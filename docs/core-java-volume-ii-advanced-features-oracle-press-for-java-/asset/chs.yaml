  | `QueuedJobCount` | `IntegerSyntax` |  |  |  | ✓ |\n| `ReferenceUriSchemesSupported`\
  \ | `FILE`, `FTP`, `GOPHER`, `HTTP`, `HTTPS`, `NEWS`, `NNTP`, `WAIS` |  |  |  |\
  \  |\n| `RequestingUserName` | `TextSyntax` |  |  | ✓ |  |\n| `Severity` | `ERROR`,\
  \ `REPORT`, `WARNING` |  |  |  |  |\n| `SheetCollate` | `COLLATED`, `UNCOLLATED`\
