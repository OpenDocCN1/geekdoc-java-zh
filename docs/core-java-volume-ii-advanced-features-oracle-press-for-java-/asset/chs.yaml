  \ e);\n        }\n    }\n\n    /**\n     * 获取所有图像写入器的“首选”格式名称集合。\n     * 首选格式名称是写入器指定的第一个格式名称。\n\
  \     * @return 格式名称集合\n     */\n    public static Set<String> getWriterFormats()\
