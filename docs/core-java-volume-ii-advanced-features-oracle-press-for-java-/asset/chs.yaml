  \     * @param tableName 要要的表名\n     * @param conn 数据库连接\n     */\n    void showTable(String\
  \ tableName, Connection conn) throws SQLException {\n        try (Statement stat\
  \ = conn.createStatement();\n             ResultSet result = stat.executeQuery(\"\
  SELECT * FROM \" + tableName)) {\n            // 拷贝到缓存行集\n            RowSetFactory\
  \ factory = RowSetProvider.newFactory();\n            crs = factory.createCachedRowSet();\n\
  \            crs.setTableName(tableName);\n            crs.populate(result);\n\n\
  \            ResultSetMetaData rsmd = result.getMetaData();\n            for (int\
  \ i = 1; i <= rsmd.getColumnCount(); i++) {\n                columns.add(new Column(rsmd.getColumnLabel(i),\
  \ rsmd.getColumnDisplaySize(i),\n                        rsmd.getColumnClassName(i)));\n\
  \            }\n\n            showNextRow();\n        }\n    }\n\n    void executeCommands()\
  \ throws SQLException {\n        while (true) {\n            String selection =\
  \ Choices.choose(\"Next\", \"Previous\", \"Edit\", \"Delete\", \"Quit\");\n    \
  \        switch (selection) {\n                case \"Next\" -> showNextRow();\n\
  \                case \"Previous\" -> showPreviousRow();\n                case \"\
  Edit\" -> editRow();\n                case \"Delete\" -> deleteRow();\n        \
  \        default -> {\n                    return;\n                }\n        \
  \    }\n        }\n    }\n\n    /**\n     * 通过填充所有文本填充列值来显示数据库行。\n     */\n    void\
  \ showRow(ResultSet rs) throws SQLException {\n        for (int i = 1; i <= columns.size();\
  \ i++) {\n            String format = \"%%s [%%%ds]\".formatted(columns.get(i -\
  \ 1).width());\n            IO.println(format.formatted(columns.get(i - 1).label(),\n\
  \                    rs == null ? \"\" : rs.getString(i)));\n        }\n    }\n\n\
  \    /**\n     * 移动到上一个表行。\n     */\n    void showPreviousRow() throws SQLException\
  \ {\n        if (crs == null || crs.isFirst()) return;\n        crs.previous();\n\
  \        showRow(crs);\n    }\n\n    /**\n     * 移动到下一个表行。\n     */\n    void showNextRow()\
  \ throws SQLException {\n        if (crs == null || crs.isLast()) return;\n    \
  \    crs.next();\n        showRow(crs);\n    }\n\n    /**\n     * 删除当前表行。\n    \
  \ */\n    void deleteRow() throws SQLException {\n        if (crs == null) return;\n\
  \        crs.deleteRow();\n        if (crs.isAfterLast()) {\n            if (!crs.last())\
  \ crs = null;\n        }\n        showRow(crs);\n    }\n\n    /**\n     * 将更改的数据更新到行集中的当前行。\n\
  \     */\n    void editRow() throws SQLException {\n        List<String> editableColumns\
  \ = columns.stream()\n                .filter(c -> c.columnClass.equals(\"java.lang.String\"\
  ))\n                .toList();\n        IO.println(\"Choose column\");\n       \
  \ String newValue = Choices.choose(editableColumns);\n        IO.println(\"New value:\
