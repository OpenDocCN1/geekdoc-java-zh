  \n`java.lang.CharSequence1.0`\n\n* `IntStream codePoints()`8\n返回包含所有 Unicode 代码点的流。\n\
  \n`java.util.random.RandomGenerator`17\n\n* `IntStream ints()`\n* `IntStream ints(int\
  \ randomNumberOrigin, int randomNumberBound)`\n* `IntStream ints(long streamSize)`\n\
  * `IntStream ints(long streamSize, int randomNumberOrigin, int randomNumberBound)`\n\
  * `LongStream longs()`\n* `LongStream longs(long randomNumberOrigin, long randomNumberBound)`\n\
  * `LongStream longs(long streamSize)`\n* `LongStream longs(long streamSize, int\
  \ randomNumberOrigin, int randomNumberBound)`\n* `DoubleStream doubles()`\n* `DoubleStream\
  \ doubles(double randomNumberOrigin, double randomNumberBound)`\n* `DoubleStream\
  \ doubles(long streamSize)`\n* `DoubleStream doubles(long streamSize, double randomNumberOrigin,\
  \ double randomNumberBound)`\n返回随机数流。如果提供了 `streamSize`，则该流是具有给定数量元素的有限流。当提供了边界，则元素介于\
  \ `randomNumberOrigin`（包含）和 `randomNumberBound`（不包含）之间。\n\n* `DoubleStream equiDoubles(double\
  \ left, double right, boolean isLeftIncluded, boolean isRightIncluded)`22\n返回一个在\
  \ `left` 和 `right` 之间的浮点数流，这些数是从目标范围内最大的等等距序列中均匀抽取的。相比之下，`doubles` 方法是从 0 到 1 之间的浮点数中均匀抽取，然后转换到目标区间。这种转换可能会引入轻微的失真。\n\
  \n`java.util.OptionalInt`8\n\n`java.util.OptionalLong`8\n\n`java.util.OptionalDouble`8\n\
  \n* `static Optional`Xxx`of(xxx value)`\n返回一个带有所提供的原始类型值的可选对象。\n\n* `xxx` `getAsXxx()`\n\
  返回此可选对象的值，如果为空，则抛出 `NoSuchElementException`。\n\n* `xxx` `orElse(xxx other)`\n* `xxx`\
  \ `orElseGet(XxxSupplier other)`\n返回此可选对象的值，或者如果此对象为空则返回备选值。\n\n* `void ifPresent(XxxConsumer\
  \ consumer)`\n如果此可选对象为空，则将其值传递给 `consumer`。\n\n`java.util.IntSummaryStatistics`8\n\
  \n`java.util.LongSummaryStatistics`8\n\n`java.util.DoubleSummaryStatistics`8\n\n\
  * `long getCount()`\n* `xxx` `getSum()`\n* `double getAverage()`\n* `xxx` `getMax()`\n\
  * `xxx` `getMin()`\n返回收集元素的计数、和、平均值、最大值和最小值。\n\n## 1.13. 并行流\n\n流使得批量操作并行变得很容易。大部分是自动的，但你需要遵循一些规则。首先，你必须有一个并行流。你可以通过\
  \ `Collection.parallelStream()` 方法从任何集合获取并行流：\n\n```\nStream<String> parallelWords\
  \ = words.parallelStream();\n```\n\n此外，`parallel` 方法可以将任何顺序流转换为并行流。\n\n```\nStream<String>\
  \ parallelWords = Stream.of(wordArray).parallel();\n```\n\n只要在执行终端方法时流处于并行模式，所有的中间流操作都将并行化。\n\
  \n当流操作并行并行运行时，其意图是返回与串行执行相同的结果。重要的一点是这些操作必须是**无状态的**（stateless）并且可以按任意顺序执行。\n\n\
  这里有一个你不能做的示例。假设你想统计字符串流中所有的短单词：\n\n```\nvar shortWords = new int[12];\nwords.parallelStream().forEach(\n\
  \    s -> { if (s.length() < 12) shortWords[s.length()]++; });\n        // 错误竞态条件！\n\
  IO.println(Arrays.toString(shortWords));\n```\n\n这是非常、非常糟糕的代码。传递给 `forEach` 的函数在多个线程中并发运行，每个线程都在更新一个共享数组。正如你在第一卷第\
  \ 10 章中所看到的的，那是经典的 `竞态条件`（race condition）。如果你多次运行此程序，你很可能在每次运行中得到不同的计数序列——而且每一个都是错误的。\n\
  \n你有责任确保传递给并行流操作的任何函数在并行执行时都是安全的。做到这一点的最好方法是避免可变状态。在这个示例中，如果你按长度对字符串进行分组并计数，就可以安全地并行化计算：\n\
  \n```\nMap<Integer, Long> shortWordCounts\n    = words.parallelStream()\n      \
  \  .filter(s -> s.length() < 12)\n        .collect(groupingBy(\n            String::length,\n\
  \            counting()));\n```\n\n默认情况下，来自有序集合（数组和列表）、范围、生成器、迭代器或调用 `Stream.sorted`\
  \ 产生的流是有序的（ordered）。结果按照原始元素的顺序积累，并且完全可预测的。如果你运行两次相同的操作，将得到完全相同的结果。\n\n排序并不排除并行化。例如，在计算\
  \ `stream.map(fun)` 时，流可以被分成 `n` 段，每段都被并发处理。然后按顺序重新组合结果。\n\n当放弃排序要求时，某些操作可以更有效地并行化。通过调用\
  \ `Stream.unordered` 方法，你表示你不在乎顺序。一个可以从中获益的操作是 `Stream.distinct`。在有序流上，`distinct`\
  \ 保留所有相同元素中的第一个。这阻碍了并行化——处理某个段的线程在处理前一个段之前不知道应该丢弃哪些元素。如果保留唯一元素中的*任何一个*都是可以的，那么所有段都可以并发处理（使用共享集合来跟踪重复项）。\n\
  \n你也可以通过放弃排序来加速 `limit` 方法。如果你只想从流中获取 `n` 个元素且不在乎获取的是哪些，调用：\n\n```\nStream<String>\
  \ sample = words.parallelStream().unordered().limit(n);\n```\n\n正如在节 1.9.2 中中讨论的，合并\
  \ map 是昂贵的。因此，`Collectors.groupingByConcurrent` 方法使用共享并发 map。为了从并行中获益，map 值的顺序将与流顺序不一致。\n\
  \n```\nMap<Integer, List<String>> result = words.parallelStream().collect(\n   \
  \ Collectors.groupingByConcurrent(String::length));\n    // 值按流顺序收集\n```\n\n当然，如果你使用独立于顺序的下游收集器，你就不在乎，例如：\n\
  \n```\nMap<Integer, Long> wordCounts\n    = words.parallelStream()\n        .collect(\n\
  \            groupingByConcurrent(\n                String::length,\n          \
  \      counting()));\n```\n\n不要为了加速操作而将你所有的流都转换为并行流。请记住这些问题：\n\n* 并行化有巨大的开销，只有对于非常大的数据集才划算。\n\
  * 只有当底层数据源可以被有效地分成多个部分时，并行流才有优势。\n* 并行流使用的线程池会被阻塞操作（如文件 I/O 或网络访问）阻塞。\n\n并行流对于巨大的内存数据集合和计算密集型处理效果最好。\n\
  \n如果你处理大文件的行，并行化流可能会提高性能。`Files.lines` 方法使用内存映射文件使分割有效。（如果你只是一次读取一行，那么你必须在读取文件后半部分之前读取前半部分，并行化将无法实现。）\n\
  \n\n\n\n\n如果你在并行流中需要随机数，可以通过 `RandomGenerator.SplittableGenerator.of` 工厂方法获取一个生成器。\n\
  \n默认情况下，并行流使用由 `ForkJoinPool.commonPool` 返回的全局 fork-join 池。如果你的操作没有阻塞且没有与其他任务共享该池，那么就是没问题的。有一个替换不同\
  \ fork-join 池的技巧：在该池的线程中执行并行流操作：\n\n```\nForkJoinPool customPool = . . .;\nresult\
  \ = customPool.submit(() ->\n    stream.parallel().map(. . .).collect(. . .)).get();\n\
  ```\n\n或者，使用异步方式：\n\n```\nCompletableFuture.supplyAsync(() ->\n        stream.parallel().map(.\
  \ . .).collect(. . .), customPool)\n    .thenAccept(result -> . . .);\n```\n\n这种方法仅适用于\
  \ fork-join 池，不适用于任意执行器。\n\nListing 1.10 中的示例程序演示了如何使用并行流。\n\nListing 1.10 `v2ch01/parallel/ParallelStreams.java`\n\
  \n```\npackage v2ch01.parallel;\n\nimport static java.util.stream.Collectors.*;\n\
  \nimport module java.base;\n\nclass ParallelStreams {\n    void main() throws Exception\
  \ {\n        String contents = Files.readString(Path.of(\"gutenberg\", \"alice30.txt\"\
  ));\n        List<String> wordList = List.of(contents.split(\"\\\\PL+\"));\n\n \
  \       // 下面是非常糟糕的代码\n        var shortWords = new int[10];\n        wordList.parallelStream().forEach(s\
  \ -> {\n            if (s.length() < 10) shortWords[s.length()]++;\n        });\n\
  \        IO.println(Arrays.toString(shortWords));\n\n        // 再试一次——结果可能会不同（也是错误的）\n\
  \        Arrays.fill(shortWords, 0);\n        wordList.parallelStream().forEach(s\
  \ -> {\n            if (s.length() < 10) shortWords[s.length()]++;\n        });\n\
  \        IO.println(Arrays.toString(shortWords));\n\n        // 补救：分组并计数\n     \
  \   Map<Integer, Long> shortWordCounts = wordList.parallelStream()\n           \
  \     .filter(s -> s.length() < 10).collect(groupingBy(String::length, counting()));\n\
  \n        IO.println(shortWordCounts);\n\n        // 下游顺序不是确定的\n        Map<Integer,\
  \ List<String>> result = wordList.parallelStream()\n                .collect(Collectors.groupingByConcurrent(String::length));\n\
  \n        IO.println(result.get(14));\n\n        result = wordList.parallelStream()\n\
  \                .collect(Collectors.groupingByConcurrent(String::length));\n\n\
  \        IO.println(result.get(14));\n\n        Map<Integer, Long> wordCounts =\
  \ wordList.parallelStream()\n                .collect(groupingByConcurrent(String::length,\
  \ counting()));\n\n        IO.println(wordCounts);\n    }\n}\n```\n\n`java.util.stream.BaseStream<T,S\
  \ extends BaseStream<T,S>>8`\n\n*   `S parallel()`\n    产生一个与此流元素相同的并行流。\n*   `S\
  \ unordered()`\n    产生一个与此流元素相同的无序流。\n\n`java.util.Collection<E>1.2`\n\n*   `Stream<E>\
  \ parallelStream()`8\n    产生一个包含该集合元素的并行流。\n\n在本章中，你已经学习了如何使用流库。下一章将涵盖另一个重要主题：处理输入和输出。\n\
  \n# 第 2 章 输入与输出\n\n在本章中，我们涵盖了用于输入和输出的 Java 应用程序编程接口（API）。你将学习如何访问文件和目录，以及如何以二进制和文本格式读写数据。本章还将向你展示对象序列化机制，它让你能像存储文本或数字数据一样容易存储对象。我们以对正则表达式的讨论结束本章，尽管它们实际上与输入输出没有关系。我们找不到更好的地方来处理这个话题，显然\
  \ Java 团队也无法找到——正则表达式 API 规范被附带在一个关于“新 I/O”功能的规范请求中。\n\n## 2.1. 输入/输出流\n\n在 Java\
  \ API 中，可以从其读取字节序列的对象称为**输入流**（input stream）。可以向其写入字节序列的对象称为**输出流**（output stream）。这些字节序列的源和目的地可以是（且通常是）文件，但也可以是网络连接甚至是内存块。抽象类\
  \ `InputStream` 和 `OutputStream` 是输入/输出（I/O）类层次结构的基础。\n\n这些输入/输出流与你在上一章中看到的流无关。为了清晰起见，当我们讨论用于输入和输出的流时，将使用输入流、输出流或输入/输出流术语。\n\
  \n面向字节的输入/输出流对于处理存储在 Unicode 中的信息极不方便（记住 Unicode 每个字符使用多个字节）。因此，另一个单独的层次结构提供了继承自抽象\
  \ `Reader` 和 `Writer` 类的类，用于处理 Unicode 字符。这些类具有基于双字节 `char` 值（即 UTF-16 编码单元）而非 `byte`\
  \ 字节（字节）的读写操作。\n\n### 2.1.1. 读取和写入字节\n\n`InputStream` 类有一个抽象方法：\n\n```\nabstract\
  \ int read()\n```\n\n该方法读取一个字节并返回读取到的字节，如果遇到输入末尾则返回 `-1`。具体输入流的设计者覆盖此方法以提供有用的功能。例如，在\
  \ `FileInputStream` 类中，此方法从文件中读取一个字节。`System.in` 是 `InputStream` 子类的一个预定义对象，允许你从“标准输入”（即控制台或重定向的文件）读取。\n\
  \n`InputStream` 有一个非常有用的方法来读取所有字节：\n\n```\nbyte[] in.readBytes();\n```\n\n还有读取指定数量字节的方法——参见\
  \ API 说明。这些方法调用抽象 `read` 方法，因此子类只需要覆盖一个方法。\n\n同样，`OutputStream` 类定义了抽象方法\n\n```\n\
  abstract void write(int b)\n```\n\n向输出位置写入一个字节。\n\n如果你有一个字节数组，可以一次性写入它们：\n\n```\n\
  byte[] values = . . .;\nout.write(values);\n```\n\n`transferTo` 方法将输入流的所有字节传输到输出流：\n\
  \n```\nin.transferTo(out);\n```\n\n`read` 和 `write` 方法都会阻塞直到字节实际读取或写入。这意味着如果无法立即访问（通常是因为网络连接），当前线程会阻塞。这使得其他线程在等待输入流可用时有机会执行有用的工作。\n\
  \n`available` 方法让你检查当前可读的字节数。这意味着类似下面的代码片段可能不会阻塞：\n\n```\nint bytesAvailable = in.available();\n\
  if (bytesAvailable > 0) {\n    var data = new byte[bytesAvailable];\n    in.read(data);\n\
  }\n```\n\n当你完成对输入/输出流的读写后，调用 `close` 方法关闭它。这将释放有限的操作系统资源。如果应用程序打开了太多输入/输出流而不关闭，系统资源可能会耗尽。关闭输出流还会冲刷输出流使用的缓冲区：任何临时存放在缓冲区以便作为较大的数据包交付的字节都会被发送。特别是，如果你不关闭文件，最后一个数据包可能永远无法送达。你也可以使用\
  \ `flush` 方法手动刷新输出。\n\n即使输入/输出流类提供了处理原始 `read` 和 `write` 函数的具体实现方法，应用程序程序员也很少使用它们。你感兴趣的数据可能包含数字、字符串和对象，而不是原始字节。\n\
  \n与其处理字节，不如你可以使用构建在基础 `InputStream` 和 `OutputStream` 类之上的许多输入输出类之一。\n\n\n\n\n\n\
  # `java.io.InputStream` 1.0\n\n* `abstract int read()`\n    读取一个字节的数据并返回读取的字节；在输入流末尾时返回\
  \ `-1`。\n* `int read(byte[] b)`\n    将字节读取到字节数组中，并返回实际读取的字节数，或在输入流末尾时返回 `-1`；此方法最多读取\
  \ `b.length` 个字节。\n* `int read(byte[] b, int off, int len)`\n* `int readNBytes(byte[]\
  \ b, int off, int len)` 9\n    读取最多 `len` 个字节，如果在不阻塞的情况下可用这些字节（使用 `read`），则读取；或者阻塞直到所有值都被读取（使用\
  \ `readNBytes`）。这些值被置于 `b` 中，从 `off` 开始开始。返回实际读取的字节数。\n* `byte[] readAllBytes()`\
  \ 9\n    产生一个可以从此流中读取的所有字节的数组。\n* `long transferTo(OutputStream out)` 9\n    将此输入流的所有字节传输到给定的输出流，返回传输的字节数。两个流都不会被关闭。\n\
  * `long skip(long n)`\n    尝试在输入流中跳过 `n` 个字节，返回实际跳过的字节数（由于某种原因，这可能小于 `n`）。\n* `long\
  \ skipNBytes(long n)` 12\n    在输入流中跳过 `n` 个字节，返回实际跳过的字节数（如果遇到输入流的末尾，则可能小于 `n`）。\n\
  * `int available()`\n    返回可用的字节数，且不阻塞（记住，阻塞意味着当前线程失去了它的执行机会）。\n* `void close()`\n\
  \    关闭输入流。\n* `void mark(int readlimit)`\n    在输入流的当前位置放置一个标记（并非所有流都支持此功能）。如果从输入流中读取了超过\
  \ `readlimit` 个字节，则允许该流遗忘该标记。\n* `void reset()`\n    返回到上一个标记。随后的 `read` 调用将重新读取这些字节。如果没有当前标记，则输入流不会被重置。\n\
  * `boolean markSupported()`\n    如果输入流支持标记，则返回 `true`。\n* `static InputStream nullInputStream()`\
  \ 11\n    返回一个没有任何字节的输入流。\n\n# `java.io.OutputStream` 1.0\n\n* `abstract void write(int\
  \ n)`\n    写入一个字节的数据。\n* `void write(byte[] b)`\n* `void write(byte[] b, int off,\
  \ int len)`\n    写入数组 `b` 中所有的字节，或从 `off` 开始的 `len` 个字节。\n* `void close()`\n   \
  \ 刷新并关闭输出流。\n* `void flush()`\n    刷新输出流——即，将任何缓冲区数据发送到其目的地。\n* `static OutputStream\
  \ nullOutputStream()` 11\n    返回一个丢弃所有字节的输出流。\n\n## 2.1.2. 完整的流动物园\n\n与 C 不同，C 只需要单一类型\
  \ `FILE*` 就能运行得很好，而 Java 拥有一整套超过 60 个 (!) 类和接口用于输入和输出。\n\n图 2.1：输入和输出流层次结构。图 2.2：读取器和写入器层次结构\n\
  \n让我们让我们根据使用方式对输入/输出动物园中的动物进行分类。处理字节和字符的类有各自的层次结构。正如你所看到的，`InputStream` 和 `OutputStream`\
  \ 类允许你读取和写入单个字节以及字节数组。这些类形成了 #ch01fig01 所示层次结构的基础。为了读取和写入字符串和数字，你需要更强大的子类。例如，`DataInputStream`\
  \ 和 `DataOutputStream` 允许你以二进制格式读写所有 Java 原始类型。最后，还有用于特殊任务的输入/输出流；例如，`ZipInputStream`\
  \ 和 `ZipOutputStream` 允许你以熟悉的 ZIP 压缩格式读取和写入文件。\n\n对于 Unicode 文本，你可以使用抽象类 `Reader`\
  \ 和 `Writer` 的子类（参见 #ch01fig02）。`Reader` 和 `Writer` 类的基本方法与 `InputStream` 和 `OutputStream`\
  \ 相似。\n\n```\nabstract int read()\nabstract void write(int c)\n```\n\n`read` 方法返回\
  \ UTF-16 代码单元（作为 `0` 到 `65535` 之间的整数）或在到达文件末尾时返回 `-1`。`write` 方法带有一个 Unicode 代码单元调用。（参见\
  \ 第一卷第 3 章 关于 Unicode 代码单元的讨论。）\n\n还有四个接口：`Closeable`、`Flushable`、`Readable` 和 `Appendable`（参见\
  \ #ch01fig03）。前两个接口非常简单，分别拥有方法\n\n```\nvoid close() throws IOException\n```\n\n\
  和\n\n```\nvoid flush()\n```\n\n`InputStream`, `OutputStream`, `Reader` 和 `Writer`\
  \ 类都实现了 `Closeable` 接口。\n\n`java.io.Closeable` 接口扩展了 `java.lang.AutoCloseable` 接口。因此，你可以对任何\
  \ `Closeable` 使用 `try`-with-resources 语句。为什么要两个接口？`Closeable` 接口的 `close` 方法只抛出\
  \ `IOException`，而 `AutoCloseable.close` 方法可能会抛出任何异常。\n\n`OutputStream` 和 `Writer`\
  \ 实现了 `Flushable` 接口。\n\n图 2.3：`Closeable`、`Flushable`、`Readable` 和 `Appendable`\
  \ 接口\n\n`Readable` 接口有一个方法\n\n```\nint read(CharBuffer cb)\n```\n\n`CharBuffer`\
  \ 类具有顺序和随机读写访问。它表示内存缓冲区或内存映射文件。（详情参见 2.4.2 节\nAppendable append(CharSequence s)\n\
  ```\n\n`CharSequence` 接口描述了 `char` 值序列的基本属性。它被 `String`、`CharBuffer`、`StringBuilder`\
  \ 和 `StringBuffer` 实现。\n\n输入输出流类中，只有 `Writer` 实现了 `Appendable`。\n\n# `java.io.Closeable`\
  \ 5.0\n\n* `void close()`\n    关闭此 `Closeable`。此方法可能会抛出 `IOException`。\n\n# `java.io.Flushable`\
  \ 5.0\n\n* `void flush()`\n    刷新此 `Flushable`。\n\n# `java.lang.Readable` 5.0\n\n\
  * `int read(CharBuffer cb)`\n    尝试将尽可能多的 `char` 值读取到 `cb` 中。返回读取的值，如果从此 `Readable`\
  \ 没有可用值，则返回 `-1`。\n\n# `java.lang.Appendable` 5.0\n\n* `Appendable append(char c)`\n\
  * `Appendable append(CharSequence cs)`\n    将给定的代码单元或给定序列中的所有代码单元追加此 `Appendable`；返回\
  \ `this`。\n\n# `java.lang.CharSequence` 1.4\n\n* `char charAt(int index)`\n    返回指定索引处的代码单元。\n\
  * `int length()`\n    返回序列中代码单元的数量。\n* `CharSequence subSequence(int startIndex,\
  \ int endIndex)`\n    返回一个由从 `startIndex` 到 `endIndex - 1` 存储的代码单元组成的 `CharSequence`。\n\
  * `String toString()`\n    返回一个由此序列的代码单元组成的字符串。\n\n## 2.1.3. 输入/输出流过滤器\n\n`FileInputStream`\
  \ 和 `FileOutputStream` 提供了连接到磁盘文件的输入和输出流。你需要将文件名或文件的完整路径传递给构造函数。例如，\n\n```\nvar\
  \ fin = new FileInputStream(\"employee.dat\");\n```\n\n会查找名为 `employee.dat` 的文件。\n\
  \n相对路径从*工作目录*开始。你可以通过调用 `System.getProperty(\"user.dir\")` 获取该目录。它在虚拟机启动时设置，并且之后无法更改。如果你从命令行启动程序，工作目录就是终端中的当前目录。在\
  \ IDE 中，你可以在运行配置中设置工作目录。\n\n\n\n\n由于反斜杠字符是 Java 字符串中的转义字符，请务必使用 `\\\\` 来表示 Windows\
  \ 风格的路径（例如 `C:\\\\Windows\\\\win.ini`）。在 Windows 中，你也可以使用单个正斜杠（`C:/Windows/win.ini`），因为大多数\
  \ Windows 文件处理系统调用会将正斜杠解释为文件分隔符。然而，并不建议这样做——Windows 系统函数的行为可能会发生变化。相反，对于可移植程序，请使用程序运行所在平台的文件分隔符字符。它可以通过常量字符串\
  \ `java.io.File.separator` 获取。\n\n与抽象的 `InputStream` 和 `OutputStream` 类一样，这些类仅支持在字节级别进行读取和写入。这意味着，我们只能从对象\
  \ `fin` 中读取字节和字节数组。\n\n```\nbyte b = (byte) fin.read();\n```\n\n正如你将在下一节中看到的，如果我们仅仅有一个\
  \ `DataInputStream`，我们就可以读取数值类型：\n\n```\nDataInputStream din = . . .;\ndouble x\
  \ = din.readDouble();\n```\n\n但正如 `FileInputStream` 没有读取数值类型的方法一样，`DataInputStream`\
  \ 也没有从文件中获取数据的方法。\n\nJava 使用了一种巧妙的机制来分离两种职责。某些输入流（例如 `FileInputStream` 和 `URL` 类\
  \ `openStream` 方法返回的输入流）可以从文件和其他更特殊的位置检索字节。其他输入流（例如 `DataInputStream`）可以将字节组装成更有用的数据类型。Java\
  \ 程序员必须将两者结合。例如，为了能够从文件中读取数字，先创建一个 `FileInputStream`，然后将其传递给 `DataInputStream` 的构造函数。\n\
  \n```\nvar fin = new FileInputStream(\"employee.dat\");\nvar din = new DataInputStream(fin);\n\
  double x = din.readDouble();\n```\n\n如果你再次查看 #ch01fig01，你可以看到 `FilterInputStream`\
  \ 和 `FilterOutputStream` 类。这些类的子类被用于为处理字节的输入/输出流添加功能。\n\n你可以通过嵌套过滤器来添加多个功能。例如，默认情况下，输入流不是缓冲的。这意味着，每次调用\
  \ `read` 都会请求操作系统分发另一个字节。请求数据块并将其存储在缓冲区中会更高效。如果你既需要*缓冲*，又需要针对文件的数据输入方法，请使用下面这个相当怪的构造函数序列：\n\
  \n```\nvar din = new DataInputStream(\n    new BufferedInputStream(\n        new\
  \ FileInputStream(\"employee.dat\")));\n```\n\n注意，我们将 `DataInputStream` 放在构造函数链的*最后*，因为我们想使用\
  \ `DataInputStream` 的方法，并且我们希望*它们*使用缓冲后的 `read` 方法。\n\n有时，当你将它们链在一起时，需要跟踪中间输入流。例如，在读取输入时，你通常需要查看下一个字节以判断它是否是你预期的值。Java\
  \ 提供了 `PushbackInputStream` 用于此目的。\n\n```\nvar pbin = new PushbackInputStream(\n\
  \    new BufferedInputStream(\n        new FileInputStream(\"employee.dat\")));\n\
  ```\n\n现在你可以推测性读取下一个字节\n\n```\nint b = pbin.read();\n\nIf `b != expectedValue` {\n\
  \    pbin.unread(b);\n}\n```\n\n\n\n\n有关字符编码的更多信息请参阅第 2.1.8 节。\n\n`Reader` 和 `Writer`\
  \ 类仅具有读取和写入单个字符的基本方法。与流一样，你应当使用子类来处理字符串和数字。\n\n### 2.1.5. 如何读取文本输入\n\n你可以像下面所示将短文本文件读取到字符串中：\n\
  \n```\nString content = Files.readString(path);\n```\n\n但如果你想将文件视为行的序列，请调用\n\n```java\n\
  List<String> lines = Files.readAllLines(path);\n```\n\n如果文件很大，请作为 `Stream<String>`\
  \ 以懒性加载方式处理这些行：\n\n```java\ntry (Stream<String> lines = Files.lines(path)) {\n \
  \   . . .\n}\n```\n\n如果流在获取行时发生 `IOException`，该异常将被封装进 `UncheckedIOException` 并从流操作抛出。这种处理方式是必要的，因为流操作没有声明抛出任何检查异常（checked\
  \ exceptions）。\n\n处理任意文本简单的方法是使用 `Scanner` 类。这段代码处理了文件中的所有行：\n\n```java\ntry (var\
  \ in = new Scanner(path)) {\n    while (in.hasNextLine()) {\n        String line\
  \ = in.nextLine();\n        // Process line\n    }\n}\n```\n\n你还可以使用扫描器读取 `tokens`——即由分隔符分隔的字符串。默认分隔符是空白字符。你可以将分隔符更改为任何正则表达式。例如，这里展示了如何配置扫描器使其使用任何非\
  \ Unicode 字符作为分隔符。\n\n```java\nScanner in = . . .;\nin.useDelimiter(\"\\\\PL+\"\
  );\n```\n\n现在，该扫描器接受仅由 Unicode 字符组成的 token。\n\n调用 `next` 方法可以获取下一个 token：\n\n```java\n\
  while (in.hasNext()) {\n    String word = in.next();\n    . . .\n}\n```\n\n或者，你可以获取所有\
  \ token 的流：\n\n```java\nStream<String> words = in.tokens();\n```\n\n在旧版代码中，你可能会发现通过反复调用\
  \ `BufferedReader` 的 `readLine` 方法来读取行的代码。如今，没有正理由这样做。\n\n`nextInt` 和 `nextDouble`\
  \ 方法会产生输入中的下一个整数或浮点数。先调用 `hasNextInt` 或 `hasNextDouble` 以确保下一个 token 是数字。\n\n`next`、`nextInt`\
  \ 和 `nextDouble` 方法仅消耗前导空白字符和一个 token。尾随空白字符会留在输入中。如果你也调用了 `nextLine`，请记住这一点点。如果你的输入是：\n\
  \n```\n29.95\nBlackwell Toaster\n```\n\n而你调用了\n\n```java\ndouble price = in.nextDouble();\n\
  double description = in.nextLine(); // ERROR\n```\n\n那么 `description` 将是空的！`nextLine`\
  \ 的调用只读取数字后面的换行符。\n\n只需再添加一个 `nextLine` 调用来消耗尾随空白字符。\n\n### 2.1.6. 如何写入文本输出\n\n\
  对于文本输出，请使用 `PrintWriter`。该类拥有以文本格式打印字符串和数字的方法。为了打印到文件，请通过文件名构造 `PrintWriter`：\n\n\
  ```java\nvar out = new PrintWriter(\"employee.txt\");\n```\n\n奇怪的是，你无法通过 `Path`\
  \ 构造 `PrintWriter`。\n\n在 Java 18 之前，请务必指定第二个参数指定字符编码：\n\n```java\nvar out = new\
  \ PrintWriter(\"employee.txt\", StandardCharsets.UTF_8);\n```\n\n否则，将使用平台编码，这会导致你的程序行为依赖于主机操作系统的配置。\n\
  \n要向 `PrintWriter` 写入，请使用 `print` 和 `println` 方法。你可以使用这些方法打印数字（`int`、`short`、`long`、`float`、`double`）、字符、`boolean`\
  \ 值、字符串和对象。\n\n例如，考虑这段代码：\n\n```java\nString name = \"Harry Hacker\";\ndouble salary\
  \ = 75000;\nout.print(name);\nout.print(' ');\nout.println(salary);\n```\n\n会将字符写入写入器\
  \ `out`：\n\n```\nHarry Hacker 75000.0\n```\n\n随后字符被转换为字节并进入文件 `employee.txt`。\n\n\
  `println` 方法会在行尾添加目标系统正确的换行符（Windows 上为 `\"\\r\\n\"`，UNIX 上为 `\"\\n\"`）。这正是通过调用\
  \ `System.getProperty(\"line.separator\")` 获取的字符串。\n\n如果写入器设置为自动刷新模式（autoflush），每当调用\
  \ `println` 时，缓冲区中的所有字符都会发送到目的地。（写入器是有缓冲的。）默认情况下未启用自动刷新。你可以通过使用 `PrintWriter(Writer\
  \ writer, boolean autoFlush)` 构造函数来启用或禁用自动刷新：\n\n```java\nvar out = new PrintWriter(\n\
  \    new OutputStreamWriter(\n        new FileOutputStream(\"employee.txt\")),\n\
  \    true); // autoflush\n```\n\n`print` 方法不抛出异常。你可以调用 `checkError` 方法查看输出流是否出现问题。\n\
  \n老可能会好奇 `PrintStream` 类和 `System.out` 发生了什么。在 Java 1.0 中，`PrintStream` 类通过将所有 Unicode\
  \ 字符截断为 ASCII 字符。（当时 Unicode 还是 16 位编码。）显然，这不是一种简洁或可移植的方法，并在引入读取器写入器后得到了解决。`System.in`、`System.out`\
  \ 和 `System.err` 仍然是输入输出流。但现在当你使用 `print` 和 `println` 方法时，`PrintStream` 类的行为与 `PrintWriter`\
  \ 完全相同。\n\n### 2.1.7. 以文本格式保存对象\n\n在本节中，我们将讨论一个在文本文件中存储 `Employee` 记录数组的示例程序。每个记录存储在单独的一中。实例字段之间通过分隔符分开。使用竖线\
  \ `|` 作为分隔符。（冒号 `:` 是另一个流行的选择。自然地，我们暂回避了如果在保存的字符串中实际上出现了 `|` 可能会发生的问题。）\n\n这是一组示例记录：\n\
  \n```\nHarry Hacker|35500.0|1989-10-01\nCarl Cracker|75000.0|1987-12-15\nTony Tester|38000.0|1990-03-15\n\
  ```\n\n\n\n\n写入记录非常简单。由于我们将数据写入文本文件，因此我们使用 `PrintWriter` 类。我们只需要写入所有字段，后面紧跟一个 `|`，或者对于最后一个字段紧跟一个换行符。这项工作在以下方法中完成：\n\
  \n```\npublic static void writeEmployee(PrintWriter out, Employee e) {\n    out.println(e.getName()\
  \ + \"|\" + e.getSalary() + \"|\" + e.getHireDay());\n}\n```\n\n要读取记录时，我们每次读取一行并分离字段。我们使用\
  \ `Scanner` 读取每一行，然后使用 `String.split` 方法将行拆分为多个标记。\n\n```\npublic static Employee\
  \ readEmployee(Scanner in) {\n    String line = in.nextLine();\n    String[] tokens\
  \ = line.split(\"\\\\|\");\n    String name = tokens[0];\n    double salary = Double.parseDouble(tokens[1]);\n\
  \    LocalDate hireDate = LocalDate.parse(tokens[2]);\n    int year = hireDate.getYear();\n\
  \    int month = hireDate.getMonthValue();\n    int day = hireDate.getDayOfMonth();\n\
  \    return new Employee(name, salary, year, month, day);\n}\n```\n\n`split` 方法的参数是一个描述分隔符的正则表达式。我们将在本章末尾详细讨论正则表达式。恰好，竖线字符在正则表达式中有特殊含义，因此它需要用\
  \ `\\` 字符进行转义。该字符本身需要用另一个 `\\` 进行转义，从而产生 `\"\\\\|\"` 表达式。\n\n完整的程序位于 Listing 2.1\
  \ 中。静态方法\n\n```\nvoid writeData(Employee[] e, PrintWriter out)\n```\n\n首先写入数组的长度，然后写入每条记录。静态方法\n\
  \n```\nEmployee[] readData(Scanner in)\n```\n\n首先读取数组长度，然后读取每条记录。这被证明有点棘手：\n\n```\n\
  int n = in.nextInt();\nin.nextLine(); // 消费换行符\nvar employees = new Employee[n];\n\
  for (int i = 0; i < n; i++) {\n    employees[i] = readEmployee(in);\n}\n```\n\n\
  对 nextInt` 的调用读取了数组长度，但没有读取末尾的换行符。我们必须消耗掉这个换行符，以便 `readEmployee` 方法在调用 `nextLine`\
  \ 方法时可以获取下一行输入。\n\nListing 2.1 v2ch02/textFile/TextFileDemo.java\n\n```\npackage\
  \ v2ch02.textFile;\n\nimport com.horstmann.corejava.*;\nimport module java.base;\n\
  \nclass TextFileDemo {\n    void main() throws Exception {\n        var staff =\
  \ new Employee[3];\n\n        staff[0] = new Employee(\"Carl Cracker\", 75000, 1987,\
  \ 12, 15);\n        staff[1] = new Employee(\"Harry Hacker\", 50000, 1989, 10, 1);\n\
  \        staff[2] = new Employee(\"Tony Tester\", 40000, 1990, 3, 15);\n\n     \
  \   // 将所有员工记录保存到 employee.dat 文件\n        try (var out = new PrintWriter(\"employee.dat\"\
  )) {\n            writeData(staff, out);\n        }\n\n        // 将所有记录读到一个新数组\n\
  \        try (var in = new Scanner(new FileInputStream(\"employee.dat\"))) {\n \
  \           Employee[] newStaff = readData(in);\n\n            // 打印新读取的员工记录\n \
  \           for (Employee e : newStaff)\n                IO.println(e);\n      \
  \  }\n    }\n\n    void writeData(Employee[] employees, PrintWriter out) throws\
  \ IOException {\n        // 写入员工人数\n        out.println(employees.length);\n\n \
  \       for (Employee e : employees)\n            writeEmployee(out, e);\n    }\n\
  \n    Employee[] readData(Scanner in) {\n        // 获取数组大小\n        int n = in.nextInt();\n\
  \        in.nextLine(); // 消费换行符\n\n        var employees = new Employee[n];\n \
  \       for (int i = 0; i < n; i++) {\n            employees[i] = readEmployee(in);\n\
  \        }\n        return employees;\n    }\n\n    void writeEmployee(PrintWriter\
  \ out, Employee e) {\n        out.println(e.getName() + \"|\" + e.getSalary() +\
  \ \"|\" + e.getHireDay());\n    }\n\n    Employee readEmployee(Scanner in) {\n \
  \       String line = in.nextLine();\n        String[] tokens = line.split(\"\\\\\
  |\");\n        String name = tokens[0];\n        double salary = Double.parseDouble(tokens[1]);\n\
  \        LocalDate hireDate = LocalDate.parse(tokens[2]);\n        int year = hireDate.getYear();\n\
  \        int month = hireDate.getMonthValue();\n        int day = hireDate.getDayOfMonth();\n\
  \        return new Employee(name, salary, year, month, day);\n    }\n}\n```\n\n\
  ### 2.1.8. 字符编码\n\n每个 Unicode “代码点”都有一个 21 位的整数。有不同的`字符编码`——即将这些 21 位数字封装成字节的方法。\n\
  \n最常见的编码是 UTF-8，它将每个 Unicode 代码点编码为一个到四个字节的序列。表 2.1 详细展示了如何编码具有位 `a`[`20`]`a[`19`]`..a[`0]`\
  \ 的 21 位代码点。UTF-8 的优势在于传统的 ASCII 字符只占用一个字节。\n\n表 2.1：UTF-8 编码\n| 范围 | 编码 |\n| :---\
  \ | :--- |\n| 前 7 位 | 0xxxxxxx |\n| 前 11 位 | 110xxxxx |\n| 前 16 位 | 1110xxxx |\n\
  | 前 21 位 | 11110xxx |\n\n另一种常见的编码是 UTF-16，它将每个 Unicode 代码点编码为一个或两个 16 位值（参见表 2.2）。这是\
  \ Java 使用的编码。实际上，UTF-16 有两种形式，被称为“大端”和“小端”。考虑 16 位值 `0x2122`。在大端格式中，高字节在前：`0x21`\
  \ 后面跟着 `0x22`。在小端格式中，相反：`0x22 0x21`。为了指示使用的是哪一种，文件可以以“字节顺序标记”或 BOM，16 位数值 `0xFEFF`\
  \ 开始。读者可以使用该值来确定字节序。\n\n有些程序会在 UTF-8 编码文件的开头添加 BOM。显然，这没有必要，因为 UTF-8 没有字节序问题。但 Unicode\
  \ 标准允许这样做，有些程序员认为这样做很好，因为它消除了疑义。在读取 UTF-8 编码文件时，任何 BOM 都应该被忽略。遗憾的是，Java 并没有这样做，针对此问题的错误报告被关闭为“不修复”。最好的办法是过滤掉输入中发现的任何领先的\
  \ `\\uFEFF`。\n\n除了 UTF 编码外，还有一些覆盖特定用户群字符范围的局部编码。例如，ISO 8859-1 是一种单字节编码，包含了西欧语言使用的带重音字符。Shift-JIS\
  \ 是一种用于日语字符的变长编码。许多此类编码仍在在使用。\n\n没有可靠的方法可以从字节流自动检测字符编码。有时，编码会在其他地方指定。例如，在读取网页时，检查\
  \ `Content-Type` 头部。\n\n`StandardCharsets` 类具有 `Charset` 类型的静态变量，对应每个 Java 虚拟机必须支持的字符编码：\n\
  \n\n\n\n\n```\nStandardCharsets.UTF_8\nStandardCharsets.UTF_16\nStandardCharsets.UTF_16BE\n\
  StandardCharsets.UTF_16LE\nStandardCharsets.UTF_32\nStandardCharsets.UTF_32BE\n\
  StandardCharsets.UTF_32LE\nStandardCharsets.ISO_8859_1\nStandardCharsets.US_ASCII\n\
  ```\n\n要获取另一种编码的 `Charset`，请使用静态方法 `forName`：\n\n```\nCharset shiftJIS = Charset.forName(\"\
  Shift-JIS\");\n```\n\n静态方法 `Charset.availableCharsets` 返回所有可用的 `Charset` 实例，表现为从规范名称到\
  \ `Charset` 对象的映射。\n\n每当你需要指定字符编码时，请使用 `Charset` 对象。例如，你可以将字节数组转换为字符串如下：\n\n```\n\
  var str = new String(bytes, StandardCharsets.ISO_8859_1);\n```\n\n许多方法允许你使用字符串而不是\
  \ `CharSet` 来指定字符编码。对于标准的字符编码，请使用 `StandardCharsets` 常量，这样任何拼写错误都会在编译时被捕获。\n\n在\
  \ Java 17 之前，调用 `Charset.forName` 并传入名称 `\"default\"` 会产生 `StandardCharsets.US_ASCII`！而现在，该调用会导致产生\
  \ `UnsupportedCharsetException`。\n\n### 2.1.9. 默认字符编码\n\n如果你没有指定字符编码，且某个操作需要在字节和字符串之间进行转换，它将选择一个默认值。对于\
  \ `java.nio.file` 包中的许多方法，该默认值是 UTF-8。\n\n但其他方法在未指定字符编码时会使用默认字符集（default charset）。这些包括：\n\
  \n* `java.io` 读取器和写入器类的方法\n* `String(byte[])` 构造函数和 `String` 类的 `getBytes` 方法\n\
  * `java.util` 包中的 `Scanner` 和 `Formatter`\n* `java.net` 包中的 `URLEncoder` 和 `URLDecoder`\n\
  \n在 Java 18 之前，默认字符集是原生编码（native encoding），它由执行 Java 虚拟机的系统决定。在 Linux 和 Mac OS 上，该它是\
  \ UTF-8，除非另有特定配置。然而，在 Windows 上，大多数情况下原生编码是某种过时的编码，例如 `Cp1252`。（从 Java 17 开始，系统属性\
  \ `native.encoding` 会产生原生编码的名称。）\n\n在 Java 18 之前，Oracle 的 Java 实现有一个系统属性 `file.encoding`\
  \ 用于覆盖默认字符集。这并不是一个官方支持的属性，但它仍然被广泛使用。\n\n从 Java 18 开始，该属性已标准化。你可以在命令行上将 `file.encoding`\
  \ 属性设置为这些值：\n\n* `COMPAT`：将默认字符集设置为原生编码，并将 `file.encoding` 系统属性设置为其名称。\n* `UTF-8`：将默认字符集设置为\
  \ UTF-8。\n* 其他字符编码如 `US-ASCII`：对于某些未指定的旧字符集名称，它可以将默认字符集设置为指定的编码。\n\n`file.encoding`\
  \ 属性必须在命令行上设置。通过 `System.setProperty` 设置它不会更新默认字符集。\n\n实际使用的默认字符集由静态方法 `Charset.defaultCharset`\
  \ 返回。\n\n最后，Windows 控制台使用的字符编码比文件编码使用的编码还要陈旧。在将输出重定向到文件时，你可能想要覆盖它。从 Java 18 开始，你可以通过设置系统属性\
  \ `stdout.encoding` 和 `stderr.encoding` 来实现。\n\n这些系统属性的命名可能令人困惑。该编码并不适用于 `stdout`\
  \ 和 `stderr`（它们是字节流），而是适用于 `System.out` 和 `System.err` 对象。两者都是 `PrintStream` 的实例，其\
  \ `print` 和 `println` 方法需要一个将字符转换为字节的编码。\n\nJava 25 增加了 `stdin.encoding` 属性，用于指定从\
  \ `System.in` 读取时的编码。它被 `IO` 和 `Console` 类使用，但 `Scanner` 不使用。\n\n要快速查看你当前各种编码的设置，请运行：\n\
  \n```\njava -XshowSettings:properties\n```\n\n查找以 `.encoding` 结尾的属性。以下是 Java 25\
  \ 的典型属性值：\n\n| 属性 | Windows | Linux/Mac OS |\n| --- | --- | --- |\n| `native.encoding`\
  \ | `Cp1252` | `UTF-8` |\n| `file.encoding` | `UTF-8` | `UTF-8` |\n| `stdin.encoding`\
  \ | `cp437` | `UTF-8` |\n| `stdout.encoding` | `cp437` | `UTF-8` |\n| `stderr.encoding`\
  \ | `cp437` | `UTF-8` |\n\n### 2.1.10. 读取字符输入\n\n如果你读取一个具有 JSON 或 XML 等结构化格式的文件，你将使用某个了解该格式复杂细节的人编写的解析器。此类解析器通常一次读取一个字符。\n\
  \n在需要实现此类解析器的罕见情况下，请使用 `BufferedReader` 以提高效率。持续调用它的 `read` 方法，这将返回一个 `char` 值或在输入结束时返回\
  \ -1。读取器产生 UTF-16 代码单元。如果你对码点（code points）感兴趣，你需要处理 UTF-16 编码：\n\n```\nint ch =\
  \ reader.read();\nif (ch != -1) {\n    int codePoint;\n    if (Character.isHighSurrogate((char))ch))\
  \ {\n        int ch2 = reader.read();\n        if (Character.isLowSurrogate((char)ch2))\
  \ {\n            codePoint = Character.toCodePoint((char)ch, (char)ch2);\n     \
  \   } else {\n            throw new MalformedInputException();\n        }\n    }\
  \ else {\n        codePoint = ch;\n    }\n}\n```\n\n`Character` 类包含判断码点是否具有给定属性的方法。例如\n\
  \n```\nisLetter(codePoint)\n```\n\n如果 `codePoint` 是字母，则返回 `true`。其他关于 Unicode 的规则：\n\
  \n```\nisUpperCase\nisLowerCase\nisDigit\nisSpace\n```\n\n在分析码点后，你通常需要将它们存储在字符串中，转换为\
  \ UTF-16。`StringBuilder` 的 `appendCodePoint` 方法将码点转换为一个或两个 `char` 值。\n\n## 2.2 输出二进制数据\n\
  \n文本格式便于测试和调试，因为它是人类可读的，但并不高效。在后续章节中，你将学习如何进行二进制输入输出。\n\n### 2.2.1. `DataInput`\
  \ 和 `DataOutput` 接口\n\n`DataOutput` 接口定义了以下方法，用于二进制格式写入数字、字符、布尔值或字符串：\n\n```\nwriteChars\
  \          writeFloat\nwriteByte           writeDouble\nwriteInt            writeChar\n\
  writeShort          writeBoolean\nwriteLong           writeUTF\n```\n\n例如，`writeInt`\
  \ 始终将整数写入 4 字节量，无论位数有多少，而 `writeDouble` 始终将 `double` 写入 8 字节量。生成的输出不是人类可读的，但每个值占用的空间相同。\n\
  \n在内存中存储整数和浮点数有两种不同的方法，取决于你使用的处理器。假设你正在处理一个 4 字节的 `int`，例如十进制 1234，十六进制为 4D2（1234\
  \ = 4 × 256 + 13 × 16 + 2）。该值可以这样存储，使得内存中四个字节中的第一个持有数值的最有效字节（MSB）：`00 00 04 D2`。这就是所谓的大端序（big-endian）。或者，我们可以从最低有效字节（LSB）开始：`D2\
  \ 04 00 00`。这自然地被称为小端序（little-endian）。例如，SPARC 使用大端序；Intel 处理器使用小端序。这可能会导致问题。当文件从\
  \ C 或 C++ 文件保存时，数据是按照处理器存储数据的方式保存的。这使得即使是简单的数据文件移动到另一个平台也具有挑战性。在 Java 中，所有值都以大端序写入。这使得\
  \ Java 数据文件与平台无关。\n\n\n\n\n\n`writeUTF` 方法使用一种修改后的 8 位 Unicode 转换格式来写入字符串数据。它并不是简单地使用标准的\
  \ UTF-8 编码，而是先将 Unicode 代码单元的序列用 UTF-16 表示，然后使用 UTF-8 规则对结果进行编码。这种修改后的编码对于代码高于 `0xFFFF`\
  \ 的字符是不同的。它是为了与在 Unicode 超过 16 位之前构建的虚拟机保持向后兼容。\n\n由于没有其他人使用这种 UTF-8 的修改版本，你应该只使用\
  \ `writeUTF` 方法来编写用于 Java 虚拟机的字符串——例如，在生成字节码的程序中。对于其他用途，请使用 `writeChars` 方法。\n\n\
  要读回这些数据，请使用 `DataInput` 接口定义的以下方法：\n\n```\nreadInt            readDouble\nreadShort\
  \          readChar\nreadLong           readBoolean\nreadFloat          readUTF\n\
  ```\n\n`DataInputStream` 类实现了 `DataInput` 接口。要从文件中读取二进制数据，请将 `DataInputStream` 与\
  \ `FileInputStream` 等字节源结合使用：\n\n```\nvar in = new DataInputStream(new FileInputStream(\"\
  employee.dat\"));\n```\n\n同样，要写入二进制数据，请使用实现了 `DataOutput` 接口的 `DataOutputStream`\
  \ 类：\n\n```\nvar out = new DataOutputStream(new FileOutputStream(\"employee.dat\"\
  ));\n```\n\n### java.io.DataInput 1.0\n\n*   `boolean readBoolean()`\n*   `byte\
  \ readByte()`\n*   `char readChar()`\n*   `double readDouble()`\n*   `float readFloat()`\n\
  *   `int readInt()`\n*   `long readLong()`\n*   `short readShort()`\n    读入给定类型的值。\n\
  \n*   `void readFully(byte[] b)`\n    将字节读入数组 `b` 中，阻塞直到所有字节都被读完。\n\n*   `void readFully(byte[]\
  \ b, int off, int len)`\n    将最多 `len` 个字节放入数组 `b` 中，从 `off` 位置开始，阻塞直到所有字节都被读完。\n\
  \n*   `String readUTF()`\n    读取“修改后的 UTF-8”格式的字符字符串。\n\n*   `int skipBytes(int\
  \ n)`\n    跳过 `n` 个字节，阻塞直到所有字节都被跳过。\n\n### java.io.DataOutput 1.0\n\n*   `void writeBoolean(boolean\
  \ b)`\n*   `void writeByte(int b)`\n*   `void writeChar(int c)`\n*   `void writeDouble(double\
  \ d)`\n*   `void writeFloat(float f)`\n*   `void writeInt(int i)`\n*   `void writeLong(long\
  \ l)`\n*   `void writeShort(int s)`\n    写入给定类型的值。\n\n*   `void writeChars(String\
  \ s)`\n    写入字符串中的所有字符。\n\n*   `void writeUTF(String s)`\n    写入“修改后的 UTF-8”格式的字符字符串。\n\
  \n### 2.2.2. 随机访问文件\n\n`RandomAccessFile` 类允许你在文件的任何位置读取或写入数据。磁盘文件是随机访问的，但与网络套字通信的输入/输出流则不是。你可以以只读模式或读写模式打开随机访问文件；通过在构造函数的第二个参数中使用字符串\
  \ `\"r\"`（读取访问）或 `\"rw\"`（读/写访问）来指定选项。\n\n```\nvar in = new RandomAccessFile(\"\
  employee.dat\", \"r\");\nvar inOut = new RandomAccessFile(\"employee.dat\", \"rw\"\
  );\n```\n\n还有 `\"rwd\"` 和 `\"rws\"` 模式，可以将数据更新或数据和元数据刷新到磁盘。这种方式较慢，但可以防止程序或计算机崩溃时发生的数据丢失。\n\
  \n当你作为 `RandomAccessFile` 打开一个现有文件时，它不会被删除。\n\n随机访问文件有一个*文件指针*，用于指示下一个要读取或写入的字节位置。`seek`\
  \ 方法可将文件指针设置为文件内的任意字节位置，该位置由一个 `long` 类型的值指定。\n\n`getFilePointer` 方法返回文件指针的当前位置。\n\
  \n`RandomAccessFile` 类实现了 `DataInput` 和 `DataOutput` 接口。要从随机访问文件读写数据，请使用我们在上一节中讨论过的\
  \ `readInt/writeInt` 以及 `readChar/writeChar` 等方法。\n\n让我们来看一个在随机访问文件中存储员工记录的示例程序。每个记录的大小都相同。这使得读取任意记录变得非常简单。假设你想将文件指针定位到第三条记录。只需将文件指针设置为相应的字节位置并开始读取即可。\n\
  \n```\nlong n = 3;\nin.seek((n - 1) * RECORD_SIZE);\nvar e = new Employee();\ne.readData(in);\n\
  ```\n\n如果你想修改记录并将其保存回相同的位置，请记住将文件指针设回记录开头：\n\n```\nin.seek((n - 1) * RECORD_SIZE);\n\
  e.writeData(out);\n```\n\n要确定文件中总字节数，请使用 `length` 方法。记录总数是长度除以每个记录的大小。\n\n```\n\
  long nbytes = in.length(); // 以字节为单位\nint nrecords = (int) (nbytes / RECORD_SIZE);\n\
  ```\n\n整数和浮点值在二进制格式中具有固定大小，但处理字符串时我们需要花费更多努力。`writeUTF` 方法写入指定数量的代码单元。如果数量太少，该方法将从字符串开始，使用零值填充字符串。\n\
  \n```java\npublic static void writeFixedString(String s, int size, DataOutput out)\n\
  \        throws IOException {\n    for (int i = 0; i < size; i++) {\n        char\
  \ ch = 0;\n        if (i < s.length()) ch = s.charAt(i);\n        out.writeChar(ch);\n\
  \    }\n}\n```\n\n`readUTF` 方法从输入流中读取字符，直到消耗了 `size` 个代码单元或遇到零值字符。然后，它会跳过输入字段中剩余的零值。为了提高效率，该方法使用\
  \ `StringBuilder` 类来读入字符串。\n\n```java\npublic static String readFixedString(int\
  \ size, DataInput in)\n        throws IOException {\n    var b = new StringBuilder(size);\n\
  \    int i = 0;\n    var done = false;\n    while (!done && i < size) {\n      \
  \  char ch = in.readChar();\n        i++;\n        if (ch == 0) done = true;\n \
  \       else b.append(ch);\n    }\n    in.skipBytes(2 * (size - i));\n    return\
  \ b.toString();\n}\n```\n\n我们将 `writeFixedString` 和 `readFixedString` 方法放在 `DataIO`\
  \ 工具类中。\n\n要写入固定大小的记录，我们只需以二进制格式写入所有字段。\n\n```java\nDataIO.writeFixedString(e.getName(),\
  \ Employee.NAME_SIZE, out);\nout.writeDouble(e.getSalary());\nLocalDate hireDay\
  \ = e.getHireDay();\nout.writeInt(hireDay.getYear());\nout.writeInt(hireDay.getMonthValue());\n\
  out.writeInt(hireDay.getDayOfMonth());\n```\n\n读回数据同样简单。\n\n```java\nString name\
  \ = DataIO.readFixedString(Employee.NAME_SIZE, in);\ndouble salary = in.readDouble();\n\
  int y = in.readInt();\nint m = in.readInt();\nint d = in.readInt();\n```\n\n让我们计算每个记录的大小。我们将为字符串留\
  \ 40 个字符。因此，每条记录将包含 100 个字节：\n\n*   40 个字符 = 名称 80 字节\n*   1 个 `double` = 工资 8 字节\n\
  *   3 个 `int` = 日期 12 字节\n\n列表 2.2 所示的程序向数据文件写入三条记录，然后按反序从文件中读取这些记录。为了高效执行此操作，需要随机访问——我们首先到达最后一条记录。\n\
  \n\n\n\n\n```java\npackage v2ch02.randomAccess;\n\nimport module java.base;\nimport\
  \ com.horstmann.corejava.*;\n\npublic class RandomAccessDemo {\n    final int NAME_SIZE\
  \ = 40;\n    final int RECORD_SIZE = 2 * NAME_SIZE + 8 + 4 + 4 + 4;\n\n    void\
  \ main() throws Exception {\n        var staff = new Employee[3];\n\n        staff[0]\
  \ = new Employee(\"Carl Cracker\", 75000, 1987, 12, 15);\n        staff[1] = new\
  \ Employee(\"Harry Hacker\", 50000, 1989, 10, 1);\n        staff[2] = new Employee(\"\
  Tony Tester\", 40000, 1990, 3, 15);\n\n        try (var out = new DataOutputStream(new\
  \ FileOutputStream(\"employee.dat\"))) {\n            // 将所有员工记录保存到文件 employee.dat\n\
  \            for (Employee e : staff)\n                writeData(out, e);\n    \
  \    }\n\n        try (var in = new RandomAccessFile(\"employee.dat\", \"r\")) {\n\
  \            // 将所有记录读入新数组\n\n            // 计算数组大小\n            int n = (int) (in.length()\
  \ / RECORD_SIZE);\n            var newStaff = new Employee[n];\n\n            //\
  \ 倒序读取员工\n            for (int i = 0; i < n; i++) {\n                in.seek((n\
  \ - 1 - i) * RECORD_SIZE);\n                newStaff[i] = readData(in);\n      \
  \      }\n\n            // 打印新读取的员工记录\n            for (Employee e : newStaff)\n\
  \                IO.println(e);\n        }\n    }\n\n    /**\n     * 将员工数据写入数据输出。\n\
  \     * @param out 数据输出流\n     * @param e 员工\n     */\n    void writeData(DataOutput\
  \ out, Employee e) throws IOException {\n        DataIO.writeFixedString(e.getName(),\
  \ NAME_SIZE, out);\n        out.writeDouble(e.getSalary());\n\n        LocalDate\
  \ hireDay = e.getHireDay();\n        out.writeInt(hireDay.getYear());\n        out.writeInt(hireDay.getMonthValue());\n\
  \        out.writeInt(hireDay.getDayOfMonth());\n    }\n\n    /**\n     * 从数据输入读取员工数据。\n\
  \     * @param in 数据输入流\n     * @return 员工\n     */\n    Employee readData(DataInput\
  \ in) throws IOException {\n        String name = DataIO.readFixedString(NAME_SIZE,\
  \ in);\n        double salary = in.readDouble();\n        int y = in.readInt();\n\
  \        int m = in.readInt();\n        int d = in.readInt();\n        return new\
  \ Employee(name, salary, y, m, d);\n    }\n}\n```\n\n`java.io.RandomAccessFile`\
  \ 1.0\n\n* `RandomAccessFile(String file, String mode)`\n* `RandomAccessFile(File\
  \ file, String mode)`\n  打开给的文件用于随机访问。`mode` 字符串 `\"r\"` 表示只读模式，`\"rw\"` 表示读/写模式，`\"\
  rws\"` 表示读/写模式且每次更新都会同步将数据和元数据写入磁盘，`\"rwd\"` 表示读/写模式且仅同步将数据写入磁盘。\n\n* `long getFilePointer()`\n\
  \  返回文件指针当前的位置。\n\n* `void seek(long pos)`\n  将文件指针设置为距离文件开头 `pos` 字节处。\n\n* `long\
  \ length()`\n  返回文件的长度（字节）。\n\n### 2.2.3 ZIP 档\n\nZIP 档以（通常是）压缩格式存储一个或多个文件。每个 ZIP\
  \ 档都有头部，包含每个文件的名称和所使用的压缩方法等信息。在 Java 中，你可以使用 `ZipInputStream` 读取 ZIP 档。你需要查看档中的各个\
  \ `entries`。`getNextEntry` 方法返回一个 `ZipEntry` 类型的对象，描述该条目。从流中读取到结束（这实际上是当前条目的结束），然后调用\
  \ `closeEntry` 读取下一个条目。在读取完最后一个条目之前不要关闭 `ZipInputStream`。以下是遍历 ZIP 文件的典型代码序列：\n\n\
  ```java\nvar zin = new ZipInputStream(new FileInputStream(zipname));\nboolean done\
  \ = false;\nwhile (!done) {\n    ZipEntry entry = zin.getNextEntry();\n    if (entry\
  \ == null) done = true;\n    else {\n        // 读取 zin 的内容\n        zin.closeEntry();\n\
  \    }\n}\nzin.close();\n```\n\n要写入 ZIP 文件，请使用 `ZipOutputStream`。对于想要放入 ZIP 文件的每个条目，创建一个\
  \ `ZipEntry` 对象。将文件名传递给 `ZipEntry` 构造函数；它会设置其他参数，如日期和解压缩方法。你可以根据需要重写这些设置。然后，调用 `ZipOutputStream`\
  \ 的 `putNextEntry` 方法开始写入新文件。将文件数据发送到 ZIP 输出流。完成后，调用 `closeEntry`。对所有想要存储的文件重复此操作。以下是代码骨架：\n\
  \n```java\nvar fout = new FileOutputStream(\"test.zip\");\nvar zout = new ZipOutputStream(fout);\n\
  for all files {\n    var ze = new ZipEntry(filename);\n    zout.putNextEntry(ze);\n\
  \    // 将数据发送到 zout\n    zout.closeEntry();\n}\nzout.close();\n```\n\nJAR 文件（第 4\
  \ 章讨论过）仅仅是 ZIP 文件——使用 `JarInputStream` 和 `JarOutputStream` 类来访问 ZIP 档。\n\n`java.util.zip.ZipInputStream`\
  \ 1.1\n\n* `ZipInputStream(InputStream in)`\n  创建一个 `ZipInputStream`，允许你从给定的 `InputStream`\
  \ 解压缩数据。\n\n* `ZipEntry getNextEntry()`\n  返回下一个条目的 `ZipEntry` 对象，如果没有更多条目则返回 `null`。\n\
  \n* `void closeEntry()`\n  关闭 ZIP 档中的当前条目。\n\n`java.util.zip.ZipOutputStream` 1.1\n\
  \n* `ZipOutputStream(OutputStream out)`\n  创建一个 `ZipOutputStream`，你可以用它向指定的 `OutputStream`\
  \ 写入压缩数据。\n\n* `void putNextEntry(ZipEntry ze)`\n  将给定 `ZipEntry` 中的信息写入输出流，并为数据准备流的位置。\n\
  \n* `void closeEntry()`\n  关闭 ZIP 档中当前打开的条目。\n\n* `void setLevel(int level)`\n \
  \ 设置后续 `DEFLATED` 条目的默认压缩级别，范围范围从 `Deflater.NO_COMPRESSION` 到 `Deflater.BEST_COMPRESSION`。默认值为\
  \ `Deflater.DEFAULT_COMPRESSION`。如果级别无效，则抛出 `IllegalArgumentException`。\n\n* `void\
  \ setMethod(int method)`\n  设置此 `ZipOutputStream` 中未指定方法的条目的默认压缩方法；可以是 `DEFLATED`\
  \ 或 `STORED`。\n\n`java.util.zip.ZipEntry` 1.1\n\n* `ZipEntry(String name)`\n  构造一个给定名称\
  \ ZIP 条目。\n\n* `long getCrc()`\n  返回此 `ZipEntry` 的 CRC32 校验和。\n\n* `String getName()`\n\
  \  返回此条目的名称。\n\n* `long getSize()`\n  返回此条目的未压缩的大小，如果未知则返回 `-1`。\n\n* `boolean isDirectory()`\n\
  \  如果此条目是目录，则返回 `true`。\n\n* `void setMethod(int method)`\n  将条目的压缩方法设为 `DEFLATED`\
  \ 或 `STORED`。\n\n* `void setSize(long size)`\n  设置此条目的的大小。仅在压缩方法为 `STORED` 时才需要。\n\
  \n* `void setCrc(long crc)`\n  设置此条目的的 CRC32 校验和。使用 `CRC32` 类计算此校验和。仅在压缩方法为 `STORED`\
  \ 时才需要。\n\n\n\n\n你已经学习了如何从文件中读取和写入数据。然而，文件管理不仅仅是读和写。`Path` 接口和 `Files` 类封装了在用户机器上操作文件系统所需的功能。例如，`Files`\
  \ 类可以用于删除或重命名文件，或者查找文件最后一次修改的时间。换句话说，输入/输出流类关注的是文件的内容，而我们在这里讨论的类关注的是文件在磁盘上的存储。\n\
  \n`Path` 接口和 `Files` 类比可以追溯到 JDK 1.0 的 `File` 类要方便得多。除非是为了与旧代码衔接，否则你不应该使用 `File`\
  \ 类。\n\n### 2.3.1. 路径 (Paths)\n\n`Path` 是目录名称的序列，可选地后跟一个文件名。路径的第一个组件可以是根组件，例如 `/`\
  \ 或 `C:\\`。允许的根组件取决于文件系统。以根组件开头路径是**绝对路径**（absolute）。否则，它是**相对路径**（relative）。例如，在这里我们构造了一个绝对路径和一个相对路径。对于绝对路径，我们假设使用的是类\
  \ UNIX 文件系统。\n\n```\nPath absolute = Path.of(\"/home\", \"harry\");\nPath relative\
  \ = Path.of(\"myprog\", \"conf\", \"user.properties\");\n```\n\n静态 `Path.of` 方法接收一个或多个字符串，并用它们与默认文件系统的路径分隔符（类\
  \ UNIX 系统使用 `/`，Windows 使用 `\\`）连接起来。然后它会解析结果，如果结果在给定的文件系统中不是有效路径，将抛出 `InvalidPathException`。结果是一个\
  \ `Path` 对象。\n\n`of` 方法可以获取包含多个组件的单个字符串。例如，你可以像这样从配置文件读取路径：\n\n```\nString baseDir\
  \ = props.getProperty(\"base.dir\");\n// 可能是类似于 /opt/myprog 或 c:\\Program Files\\\
  myprog 的字符串\nPath basePath = Path.of(baseDir); // baseDir 包含分隔符是允许\n```\n\n路径并不对应于实际存在的文件。它仅仅是名称的抽象序列。正如你在下一节看到的，当你想要创建一个文件时，首先创建一个路径，然后调用方法来创建对应的文件。\n\
  \n组合或解析路径是非常常见的。调用 `p.resolve(q)` 根据以下规则返回一个路径：\n\n* 如果 `q` 是绝对路径，则结果为 `q`。\n* 如果\
  \ `q` 没有根路径，则结果通过连接 `p` 和 `q` 。\n* 否则，结果取决于文件系统的规则。\n\n例如，假设你的应用程序需要相对于从配置文件读取的给定基目录查找其工作目录，如前面的示例所示。\n\
  \n```\nPath workRelative = Path.of(\"work\");\nPath workPath = basePath.resolve(workRelative);\n\
  ```\n\n`resolve` 方法有一个快捷方式，可以接受字符串而不是路径：\n\n```\nPath workPath = basePath.resolve(\"\
  work\");\n```\n\n`resolve` 方法不会简化结果。例如，\n\n```\nPath.of(\"/usr/bin\").resolve(\"\
  ../local\")\n```\n\n是一个路径 `/usr/bin/../local`。\n\n有一个便利方法 `resolveSibling`，它相对于路径的父目录进行解析，产生一个兄弟节点路径。例如，如果\
  \ `workPath` 是 `/opt/myapp/work`，则调用\n\n```\nPath tempPath = workPath.resolveSibling(\"\
  temp\");\n```\n\n将创建 `/opt/myapp/temp`。\n\n`resolve` 的相反操作是 `relativize`。调用 `p.relativize(r)`\
  \ 产生路径 `q`，当 `q` 与 `p` 解析时，会产生 `r`。例如，相对于 `/home/fred/input.txt` 化 `/home/harry`\
  \ 得到 `../fred/input.txt`。在这里，我们假设 `..` 表示文件系统中的父目录。\n\n`normalize` 方法移除任何冗余的 `.`\
  \ 和 `..` 组件（或文件系统认为冗余的任何内容）。例如，规范路径 `/home/harry/../fred/./input.txt` 得到 `/home/fred/input.txt`。\n\
  \n`toAbsolutePath` 方法产生给定路径的绝对路径，从根组件开始，例如 `/home/fred/input.txt` 或 `c:\\Users\\\
  fred\\input.txt`。\n\n`Path` 接口有很多用的方法来分解路径。这段代码示例展示了一些最有用的方法：\n\n```\nPath p = Path.of(\"\
  /home\", \"fred\", \"myprog.properties\");\nPath parent = p.getParent(); // 路径 /home/fred\n\
  Path file = p.getFileName(); // 路径 myprog.properties\nPath root = p.getRoot(); //\
  \ 路径 /\n```\n\n`getFileName` 方法简单地返回给定路径的最后一个组件。如果路径描述的是目录，那么它是目录名而不是文件名。\n\n正如你已经在第一卷中看到的，你可以从一个\
  \ `Path` 对象构造一个 `Scanner`：\n\n```\nvar in = new Scanner(Path.of(\"/home/fred/input.txt\"\
  ));\n```\n\n偶尔，你可能需要与使用 `File` 类而不是 `Path` 接口的旧 API 交互。`Path` 接口有一个 `toFile` 方法，而\
  \ `File` 类有一个 `toPath` 方法。\n\n### 2.3.2. 读取和写入文件\n\n`Files` 类可以快速处理常见的文件操作。例如，你可以轻松地将整个文件内容读取字节数组、字符串、行列表或行流：\n\
  \n```\nbyte[] bytes = Files.readAllBytes(path);\nString content = Files.readString(path);\n\
  List<String> lines = Files.readAllLines(path);\nStream<String> lineStream = Files.lines(path);\n\
  ```\n\n反之，对于写入操作：\n\n```\nFiles.write(path, bytes);\nFiles.writeString(path, content);\n\
  Files.write(path, lines);\n```\n\n要追加到给定文件，使用\n\n```\nFiles.write(path, content,\
  \ StandardOpenOption.APPEND);\n```\n\n调用\n\n```\nlong pos = Files.mismatch(path1,\
  \ path2);\n```\n\n产生文件内容不同的第一个字节的位置。\n\n要获取文件的 MIME 类型（例如 `\"text/html\"` 或 `\"\
  image/png\"`），调用\n\n```\nString mimeType = Files.probeContentType(path);\n```\n\n\
  具体的行为取决于 Java 的实现。每个实现都有一组 `FileTypeDetector` 实例，并会以未指定的顺序进行尝试。每个检测器可能会检查文件扩展名、操作系统特定的元数据或内容的前几个字节。\n\
  \n以下方法允许你与使用经典输入/输出流或读取器/写入器的 API 交互：\n\n```\nInputStream in = Files.newInputStream(path);\n\
