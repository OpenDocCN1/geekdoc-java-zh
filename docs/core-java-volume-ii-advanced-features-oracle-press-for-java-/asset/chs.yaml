  \        columnsItem.setSelected(table.getColumnSelectionAllowed());\n        cellsItem.setSelected(table.getCellSelectionEnabled());\n\
  \    }\n}\n```\n\n`javax.swing.table.TableModel`1.2\n\n- `Class getColumnClass(int\
  \ columnIndex)`\n  获取此列值的类型。该信息用于排序和渲染。\n\n`javax.swing.JTable`1.2\n\n- `TableColumnModel\
