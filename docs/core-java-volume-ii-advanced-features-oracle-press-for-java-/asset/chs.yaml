  \   // 所有滑块的公共监听器\n        listener = event -> {\n            // 当滑块值改变时更新文本字段\n\
  \            JSlider source = (JSlider) event.getSource();\n            textField.setText(\"\
  \" + source.getValue());\n        };\n\n        // 添加一个普通滑块\n\n        var slider\
  \ = new JSlider();\n        addSlider(slider, \"Plain\");\n\n        // 添加一个带有主刻度和最小刻度的滑块\n\
  \n        slider = new JSlider();\n        slider.setPaintTicks(true);\n       \
  \ slider.setMajorTickSpacing(20);\n        slider.setMinorTickSpacing(5);\n    \
  \    addSlider(slider, \"Ticks\");\n\n        // 添加一个可以吸齐到刻度的滑块\n\n        slider\
  \ = new JSlider();\n        slider.setPaintTicks(true);\n        slider.setSnapToTicks(true);\n\
  \        slider.setMajorTickSpacing(20);\n        slider.setMinorTickSpacing(5);\n\
  \        addSlider(slider, \"Snap to ticks\");\n\n        // 添加一个没有轨的滑块\n\n    \
  \    slider = new JSlider();\n        slider.setPaintTicks(true);\n        slider.setMajorTickSpacing(20);\n\
  \        slider.setMinorTickSpacing(5);\n        slider.setPaintTrack(false);\n\
  \        addSlider(slider, \"No track\");\n\n        // 添加一个反向滑块\n\n        slider\
  \ = new JSlider();\n        slider.setPaintTicks(true);\n        slider.setMajorTickSpacing(20);\n\
  \        slider.setMinorTickSpacing(5);\n        slider.setInverted(true);\n   \
  \     addSlider(slider, \"Inverted\");\n\n        // 添加一个带有数字标签的滑块\n\n        slider\
  \ = new JSlider();\n        slider.setPaintTicks(true);\n        slider.setPaintLabels(true);\n\
  \        slider.setMajorTickSpacing(20);\n        slider.setMinorTickSpacing(5);\n\
  \        addSlider(slider, \"Labels\");\n\n        // 添加一个带有字母标签的滑块\n\n        slider\
  \ = new JSlider();\n        slider.setPaintLabels(true);\n        slider.setPaintTicks(true);\n\
  \        slider.setMajorTickSpacing(20);\n        slider.setMinorTickSpacing(5);\n\
  \n        var labelTable = new Hashtable<Integer, Component>();\n        labelTable.put(0,\
  \ new JLabel(\"A\"));\n        labelTable.put(20, new JLabel(\"B\"));\n        labelTable.put(40,\
  \ new JLabel(\"C\"));\n        labelTable.put(60, new JLabel(\"D\"));\n        labelTable.put(80,\
  \ new JLabel(\"E\"));\n        labelTable.put(100, new JLabel(\"F\"));\n\n     \
  \   slider.setLabelTable(labelTable);\n        addSlider(slider, \"Custom labels\"\
  );\n\n        // 添加一个带有图标标签的滑块\n\n        slider = new JSlider();\n        slider.setPaintTicks(true);\n\
  \        slider.setPaintLabels(true);\n        slider.setSnapToTicks(true);\n  \
  \      slider.setMajorTickSpacing(20);\n        slider.setMinorTickSpacing(20);\n\
  \n        labelTable = new Hashtable<>();\n\n        // 添加牌图片\n\n        labelTable.put(0,\
  \ new JLabel(new ImageIcon(\"images/nine.gif\")));\n        labelTable.put(20, new\
  \ JLabel(new ImageIcon(\"images/ten.gif\")));\n        labelTable.put(40, new JLabel(new\
  \ ImageIcon(\"images/jack.gif\")));\n        labelTable.put(60, new JLabel(new ImageIcon(\"\
  images/queen.gif\")));\n        labelTable.put(80, new JLabel(new ImageIcon(\"images/king.gif\"\
  )));\n        labelTable.put(100, new JLabel(new ImageIcon(\"images/ace.gif\")));\n\
  \n        slider.setLabelTable(labelTable);\n        addSlider(slider, \"Icon labels\"\
  );\n\n        // 添加显示滑块值的文本字段\n\n        textField = new JTextField();\n       \
  \ add(sliderPanel, BorderLayout.CENTER);\n        add(textField, BorderLayout.SOUTH);\n\
  \        pack();\n    }\n\n    /**\n     * 将滑块添加到滑块面板并挂接监听器。\n     * @param slider\
  \ 滑块\n     * @param description 滑块描述\n     */\n    public void addSlider(JSlider\
  \ slider, String description) {\n        slider.addChangeListener(listener);\n \
  \       var panel = new JPanel();\n        panel.add(slider);\n        panel.add(new\
  \ JLabel(description));\n        panel.setAlignmentX(Component.LEFT_ALIGNMENT);\n\
  \        var gbc = new GridBagConstraints();\n        gbc.gridy = sliderPanel.getComponentCount();\n\
