  \ String toString(TableModel model, int row, int column)`\n  将给定位置的模型值转换为字符串；你可以重写此方法。\n\
  \n## javax.swing.RowFilter<M, I>\n\n* `boolean include(RowFilter.Entry<? extends\
  \ M,? extends I> entry)`\n  指定要保留的行；你可以重写此方法。\n* `static <M,I> RowFilter<M,I> numberFilter(RowFilter.ComparisonType\
  \ type, Number number, int... indices)`\n* `static <M,I> RowFilter<M,I> dateFilter(RowFilter.ComparisonType\
  \ type, Date date, int... indices)`\n  返回一个过滤器，包含包含与给定数字或日期的给定比较匹配值的行。比较类型为 `EQUAL`、`NOT_EQUAL`、`AFTER`\
  \ 或 `BEFORE` 之一。如果给定了任何列索引，则只搜索这些列；否则搜索所有列。对于数字过滤器，单元格值的类必须与 `number` 的类匹配。\n* `static\
  \ <M,I> RowFilter<M,I> regexFilter(String regex, int... indices)`\n  返回一个过滤器，包含具有匹配给定正则表达式的字符串值的行。如果给定了任何列索引，则只搜索这些列；否则搜索所有列。注意，匹配的是\
  \ `RowFilter.Entry` 的 `getStringValue` 方法返回的字符串。\n* `static <M,I> RowFilter<M,I>\
  \ andFilter(Iterable<? extends RowFilter<? super M,? super I>> filters)`\n* `static\
  \ <M,I> RowFilter<M,I> orFilter(Iterable<? extends RowFilter<? super M,? super I>>\
  \ filters)`\n  返回一个过滤器，包含所有过滤器包含的条目，或至少包含一个过滤器的条目。\n* `static <M,I> RowFilter<M,I>\
  \ notFilter(RowFilter<M,I> filter)`\n  返回一个包含不包含给定过滤器的条目的过滤器。\n\n## javax.swing.RowFilter.Entry<M,\
  \ I>\n\n* `I getIdentifier()`\n  返回此条目的标识符。\n* `M getModel()`\n  返回此条目的模型。\n* `Object\
  \ getValue(int index)`\n  返回存储在索引处的值。\n* `int getValueCount()`\n  返回存储在此条目中的值数量。\n\
  * `String getStringValue(int index)`\n  返回存储在索引处的字符串。\n\n## 12.3 Cell Rendering\
  \ and Editing\n\n正如 12.2 节所示，列类型决定了单元格如何渲染。对于 `Boolean` 和 `Icon` 类型有默认渲染器。对于其他类型，你需要自定义渲染器。\n\
  \n### 12.3.1 Rendering Cells\n\n单元格渲染器与之前看到的列表渲染器类似。它们实现 `TableCellRenderer` 接口，该接口有一个方法：\n\
  \n```\nComponent getTableCellComponent(JTable table, Object value, boolean isSelected,\
  \ boolean hasFocus, int row, int column)\n```\n\n当表格需要绘制单元格时会调用该方法。返回一个组件，其 `paint`\
  \ 方法将被调用以填充单元格区域。\n\n12.8 中的表格包含 `Color` 类型的单元格。渲染器只需返回一个面板，其背景颜色为存储在单元格中的颜色。颜色通过\
  \ `value` 参数传递。\n\n```\nclass ColorTableCellRenderer extends JPanel implements TableCellRenderer\
  \ {\n    public Component getTableCellComponent(JTable table, Object value,\n  \
  \          boolean isSelected, boolean hasFocus, int row, int column) {\n      \
  \  setBackground((Color) value);\n        if (hasFocus)\n            setBorder(UIManager.getBorder(\"\
  Table.focusCellHighlightBorder\"));\n        else\n            setBorder(null);\n\
  \        return this;\n    }\n}\n```\n\n如你所示，渲染器在单元格获得焦点时会绘制边框。（为了找到查找键，我们查看了 `DefaultTableCellRenderer`\
  \ 类的源代码。）\n\n如果你的渲染器只需绘制文本字符串或图标，你可以扩展 `DefaultTableCellRenderer` 类。它会为你处理渲染和选择状态。\n\
  \n你需要告诉表格使用此渲染器处理所有 `Color` 类型的对象。`JTable` 类的 `setDefaultRenderer` 方法允许你建立这种关联。提供一个\
  \ `Class` 对象和渲染器：\n\n```\ntable.setDefaultRenderer(Color.class, new ColorTableCellRenderer());\n\
  ```\n\n该渲染器现在被用于此表格中所有给定类型的对象。如果你想根据其他标准选择渲染器，你需要子类 `JTable` 类并重写 `getCellRenderer`\
  \ 方法。\n\n### 12.3.2 Rendering the Header\n\n要在表头中显示图标，请设置头值：\n\n```\nmoonColumn.setHeaderValue(new\
  \ ImageIcon(\"Moons.gif\"));\n```\n\n\n\n\n然而，表头并不智能，无法为表头值选择合适的渲染器。你必须手动安装渲染器。例如，若要在列头中显示图像图标，可以调用\n\
  \n``````\nmoonColumn.setHeaderRenderer(table.getDefaultRenderer(ImageIcon.class));\n\
  ```\n\n### 12.3.3. 编辑单元格\n\n要启用单元格编辑，表格模型必须通过定义 `isCellEditable` 方法来指示哪些单元格是可编辑的。通常，你会让某些列变为可编辑。在示例程序中，我们允许对四列进行编辑。\n\
  \n```\npublic boolean isCellEditable(int r, int c) {\n    return c == PLANET_COLUMN\
  \ || c == MOONS_COLUMN || c == GASEOUS_COLUMN\n        || c == COLOR_COLUMN;\n}\n\
  ```\n\n`AbstractTableModel` 定义 `isCellEditable` 方法始终返回 `false`。`DefaultTableModel`\
  \ 则重写了该方法使其始终返回 `true`。\n\n如果你运行本节末尾的示例程序，注意你可以点击气态（Gaseous）列中的复选框，并开启或关闭勾选。如果你点击卫星（Moons）列中的单元格，会弹出一个组合框（参见图\
  \ 12.9）。你很快就会看到如何安装这样一个组合框作为单元格编辑器。\n\n![Figure](img/fig06-13.jpg)图 12.9: 单元格编辑器\n\
  \n最后，点击第一列中的单元格。该单元格获得焦点。你可以开始输入，单元格内容会随之改变。\n\n你刚刚看到的演示是 `DefaultCellEditor` 类的三种变体。`DefaultCellEditor`\
  \ 可以使用 `JTextField`、`JCheckBox` 或 `JComboBox` 来构造。`JTable` 类会自动为 `Boolean` 单元格安装复选框编辑器，并为所有未提供自定义渲染器的可编辑单元格安装文本字段编辑器。文本字段允许用户编辑通过对表格模型\
  \ `getValueAt` 方法的返回值应用 `toString` 得到的字符串。\n\n当编辑完成时，通过调用编辑器的 `getCellEditorValue`\
  \ 方法来获取编辑后的值。该方法应该返回正确类型的值（即模型 `getColumnType` 方法返回的类型）。\n\n要获取组合框编辑器，需要手动设置单元格编辑器——`JTable`\
  \ 组件并不知道特定类型可能适用于哪些值。对于卫星（Moons）列，我们希望用户可以选择 0 到 20 之间的任何值。以下是初始化组合框的代码：\n\n```\n\
  var moonCombo = new JComboBox();\nfor (int i = 0; i <= 20; i++)\n    moonCombo.addItem(i);\n\
  ```\n\n要构造 `DefaultCellEditor`，请在构造函数中提供组合框：\n\n```\nvar moonEditor = new DefaultCellEditor(moonCombo);\n\
  ```\n\n接下来，我们需要安装编辑器与颜色单元格渲染器不同，此编辑器依赖于对象 `type`——我们并不一定想将其用于所有 `Integer` 类型的对象。相反，我们需要将其安装到特定的列：\n\
  \n```\nmoonColumn.setCellEditor(moonEditor);\n```\n\n### 12.3.4. 自定义编辑器\n\n再次运行示例程序并点击颜色。弹出颜色选择器允许你为行星选择新颜色。选择一种颜色并点击确定。单元格颜色将更新（参见图\
  \ 12.10）。\n\n![Figure](img/fig06-14.jpg)图 12.10: 使用颜色选择器编辑单元格颜色\n\n颜色单元格编辑器不是标准的表格单元格编辑器，而是自定义实现。要创建自定义单元格编辑器，需要实现\
  \ `TableCellEditor` 接口。该接口有点繁琐，因此提供了 `AbstractCellEditor` 类来处理事件处理细节。\n\n`TableCellEditor`\
  \ 接口的 `getTableCellEditorComponent` 方法请求一个用于渲染单元格的组件。它与 `TableCellRenderer` 接口的\
  \ `getTableCellRendererComponent` 方法完全相同，没有 `focus` 参数。当单元格正在编辑时，假设它拥有焦点。在编辑期间，编辑器组件临时替换渲染器。在我们的示例中，我们返回了一个没有颜色的空白面板。这指示用户该单元格正在被编辑。\n\
  \n接下来，你希望在用户点击单元格时弹出你的编辑器。\n\n`JTable` 类会带事件（如鼠标点击）调用你的编辑器，以确定该事件是否可以启动编辑过程。`AbstractCellEditor`\
  \ 类定义了接受所有事件的方法。\n\n```\npublic boolean isCellEditable(EventObject anEvent) {\n\
  \     return true;\n}\n```\n\n然而，如果你重写此方法并返回 `false`，表格将不会费力插入编辑器组件。\n\n一旦安装了编辑器组件，就会调用\
  \ `shouldSelectCell` 方法，推测使用的是相同的事件。你应该在该方法中启动编辑——例如通过弹出一个外部编辑对话框。\n\n```\npublic\
  \ boolean shouldSelectCell(EventObject anEvent) {\n    colorDialog.setVisible(true);\n\
  \    return true;\n}\n```\n\n如果用户取消了编辑，表格会调用 `cancelCellEditing` 方法。如果用户点击了另一个表格单元格，表格会调用\
  \ `stopCellEditing` 方法。在两种情况下，你都应该隐藏对话框。当你的 `stopCellEditing` 方法被调用时，表格希望使用部分编辑的值。如果当前值有效，你应该返回\
  \ `true`。在颜色选择器中，任何值都是有效的。但如果你编辑的是其他数据，你可以确保只从编辑器中获取有效数据。\n\n此外，你应该调用处理事件触发的父类方法——否则编辑将无法被正常取消。\n\
  \n```\npublic void cancelCellEditing() {\n     colorDialog.setVisible(false);\n\
  \     super.cancelCellEditing();\n}\n```\n\n最后，你需要一个方法来产生用户在编辑过程中提供的值：\n\n```\n\
  public Object getCellEditorValue() {\n     return colorChooser.getColor();\n}\n\
  ```\n\n总结来说，你的自定义编辑器应该执行以下操作：\n\n1. 继承 `AbstractCellEditor` 类并实现 `TableCellEditor`\
  \ 接口。\n2. 定义 `getTableCellEditorComponent` 方法以提供组件。这可以是虚拟组件（如果你弹出了对话框），也可以用于就地编辑的组件（如组合框或文本字段）。\n\
  3. 定义 `shouldSelectCell`、`stopCellEditing` 和 `cancelCellEditing` 方法来处理编辑过程的开始、完成和取消。`stopCellEditing`\
  \ 和 `cancelCellEditing` 方法应该调用父类方法以确保通知监听器。\n4. 定义 `getCellEditorValue` 方法返回编辑过程的结果。\n\
  \n最后，通过调用 `stopCellEditing` 和 `cancelCellEditing` 方法指示用户已完成编辑。在构造颜色对话框时，我们安装了触发这些事件的接受和取消回调。\n\
  \n```\ncolorDialog = JColorChooser.createDialog(null, \"Planet Color\", false, colorChooser,\n\
  \    EventHandler.create(ActionListener.class, this, \"stopCellEditing\"),\n   \
  \ EventHandler.create(ActionListener.class, this, \"cancelCellEditing\"));\n```\n\
  \n完成了自定义编辑器的实现。\n\n你现在已经知道如何让单元格变得可编辑以及如何安装编辑器。剩下的最后一个问题——如何用用户编辑的值更新模型。当编辑完成后，`JTable`\
  \ 类会调用表格模型的以下方法：\n\n```\nvoid setValueAt(Object value, int r, int c)\n```\n\n你需要重写该方法来存储新值。`value`\
  \ 参数是单元格编辑器返回的对象。如果你实现了单元格编辑器，你就知道从 `getCellEditorValue` 方法返回的对象类型。在 `DefaultCellEditor`\
  \ 的情况下，该值有三种可能性：如果单元格编辑器是复选框，则是一个 `Boolean`；如果是文本字段，则是一个字符串；如果值来自组合框，则是用户选择的对象。\n\
  \n\n\n如果 `value` 对象没有相应的类型，你对其对它进行转换。这种情况通常发生在文本字段中编辑数字时。在我们的示例中，我们为组合框填充了 `Integer`\
  \ 对象，这样就不需要任何转换。\n\n### 列表 12.4 v2ch12/tableCellRender/TableCellRenderFrame.java\n\
  \n```java\npackage v2ch12.tableCellRender;\n\nimport module java.desktop;\n\n/**\n\
  \ * 此帧包含一个行星数据表格。\n */\npublic class TableCellRenderFrame extends JFrame {\n   \
  \ private static final int DEFAULT_WIDTH = 600;\n    private static final int DEFAULT_HEIGHT\
  \ = 400;\n\n    public TableCellRenderFrame() {\n        setSize(DEFAULT_WIDTH,\
  \ DEFAULT_HEIGHT);\n\n        var model = new PlanetTableModel();\n        var table\
  \ = new JTable(model);\n        table.setRowSelectionAllowed(false);\n\n       \
  \ // 设置渲染器和编辑器\n\n        table.setDefaultRenderer(Color.class, new ColorTableCellRenderer());\n\
  \        table.setDefaultEditor(Color.class, new ColorTableCellEditor());\n\n  \
  \      var moonCombo = new JComboBox<Integer>();\n        for (int i = 0; i <= 20;\
  \ i++)\n            moonCombo.addItem(i);\n\n        TableColumnModel columnModel\
  \ = table.getColumnModel();\n        TableColumn moonColumn = columnModel.getColumn(PlanetTableModel.MOONS_COLUMN);\n\
  \        moonColumn.setCellEditor(new DefaultCellEditor(moonCombo));\n        moonColumn.setHeaderRenderer(table.getDefaultRenderer(ImageIcon.class));\n\
  \        moonColumn.setHeaderValue(new ImageIcon(\"images/Moons.gif\"));\n\n   \
  \     // 显示表格\n\n        table.setRowHeight(100);\n        add(new JScrollPane(table),\
  \ BorderLayout.CENTER);\n    }\n}\n```\n\n### 列表 12.5 v2ch12/tableCellRender/PlanetTableModel.java\n\
