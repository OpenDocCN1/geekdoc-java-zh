  \n*   `void setStroke(Stroke s)`\n\n    将此图形上下文的描边设置为实现 `Stroke` 接口的给定对象。\n\n`java.awt.BasicStroke`1.2\n\
  \n*   `BasicStroke(float width)`\n\n*   `BasicStroke(float width, int cap, int join)`\n\
  *   `BasicStroke(float width, int cap, int join, float miterlimit)`\n*   `BasicStroke(float\
  \ width, int cap, int join, float miterlimit, float[] dash, float dashPhase)`\n\n\
  \    根据给定属性构造描边对象。\n\n    端点样式是 `CAP_BUTT`、`CAP_ROUND` 和 `CAP_SQUARE` 之一。\n\n  \
  \  连接样式是 `JOIN_BEVEL`、`JOIN_MITER` 和 `JOIN_ROUND` 之一。\n\n### 12.5.6. Paint\n\n当你填充形状时，其内部会被*填充*覆盖。使用\
  \ `setPaint` 方法将填充样式设置为实现 `Paint` 接口类的对象。Java 2D API 提供了三个这样的类：\n\n*   `Color` 类实现了\
  \ `Paint` 接口。要用纯颜色填充形状，只需调用 `setPaint` 并传入一个 `Color` 对象即可，例如\n\n\n\n\n\n```\ng2.setPaint(Color.red);\n\
  ```\n\n*   `GradientPaint` 类通过在两个指定的颜色值之间进行插值来改变颜色（参见图 12.45）。\n\n    ![Figure](img/fig07-15.jpg)图\
  \ 12.45: 渐变填充\n\n*   `TexturePaint` 类通过图像的重复填充区域（参见图 12.46）。\n\n    ![Figure](img/fig07-16.jpg)图\
  \ 12.46: 纹理填充\n\n你可以通过指定两个点以及在这两个点上所需的颜色来构造一个 `GradientPaint` 对象。\n\n```\ng2.setPaint(new\
  \ GradientPaint(p1, Color.RED, p2, Color.YELLOW));\n```\n\n颜色沿着连接两点的直线进行插值。在与该连接线垂直的直线上，颜色保持恒定。超出直线端点的点将赋予该端点的颜色。\n\
  \n或者，如果你在调用 `GradientPaint` 构造函数时将 `cyclic` 参数设置为 `true`：\n\n```\ng2.setPaint(new\
  \ GradientPaint(p1, Color.RED, p2, Color.YELLOW, true));\n```\n\n那么，颜色变化将变为“循环”，并在超出端点后继续变化。\n\
  \n要构造一个 `TexturePaint` 对象，请指定一个 `BufferedImage` 和一个 `anchor` 矩形。\n\n```\ng2.setPaint(new\
  \ TexturePaint(bufferedImage, anchorRectangle));\n```\n\n我将在本章后面讨论图像时介绍 `BufferedImage`\
  \ 类。获取缓冲区图像最简单的方法是读取图像文件：\n\n```\nbufferedImage = ImageIO.read(new File(\"blue-ball.gif\"\
  ));\n```\n\n锚点矩形在 `x` 和 `y` 方向上无限延伸，以平铺整个坐标平面。图像被缩放以适应锚点，然后复制到每个瓦片中。\n\n### `java.awt.Graphics2D`\
  \ 1.2\n\n*   `void setPaint(Paint s)`\n\n    将此图形上下文的绘画具设置为实现 `Paint` 接口的给定对象。\n\
  \n### `java.awt.GradientPaint` 1.2\n\n*   `GradientPaint(float x1, float y1, Color\
  \ color1, float x2, float y2, Color color2)`\n*   `GradientPaint(float x1, float\
  \ y1, Color color1, float x2, float y2, Color color2, boolean cyclic)`\n*   `GradientPaint(Point2D\
  \ p1, Color color1, Point2D p2, Color color2)`\n*   `GradientPaint(Point2D p1, Color\
  \ color1, Point2D p2, Color color2, boolean cyclic)`\n\n    构造一个渐变填充对象，用颜色填充形状，使得起点颜色为\
  \ `color1`，终点颜色为 `color2`，中间的颜色进行线性插值。在连接起点和终点的直线垂直的直线上，颜色保持恒定。默认情况下，渐变填充不是循环的——也就是说，超出起点和终点的点具有与起点和终点相同的颜色。如果渐变填充是\
  \ `cyclic`，则颜色将继续进行插值，首先返回起点颜色，然后在两个方向上无限重复。\n\n### `java.awt.TexturePaint` 1.2\n\
  \n*   `TexturePaint(BufferedImage texture, Rectangle2D anchor)`\n\n    创建一个纹理填充对象。锚点矩形定义了要绘制空间的平铺方式；它在\
  \ `x` 和 `y` 方向上无限重复，纹理图像被缩放以填充每个瓦片。\n\n### 12.5.7. 坐标变换\n\n假设你需要绘制一个对象，例如汽车。根据制造商的规格，你知道它的高度、轴距和总长度。当然，你可以假设每米有若干像素，计算出所有的像素位置。然而，有一种更简单的方法：你可以请求图形上下文为你完成转换。\n\
  \n```\ng2.scale(pixelsPerMeter, pixelsPerMeter);\ng2.draw(new Line2D.Double(coordinates\
  \ in meters)); // 转换为像素并\n                                                   //\
  \ 绘制缩后的线\n```\n\n`Graphics2D` 类的 `scale` 方法将图形上下文的`coordinate transformation`设置为缩放变换。该变换将`user\
  \ coordinates`（用户指定的单位）转换为`device coordinates`（像素）。图 12.47 显示了该变换是如何工作的。\n\n.图 12.47:\
  \ 用户坐标和设备坐标\n\n坐标变换在实践中非常有用。它们允许你使用方便的坐标值进行工作。图形上下文负责将它们转换为像素的脏活。\n\n有四种基本的变换。\n\
  \n*   缩放（Scaling）：放大或缩小所有点到固定点的距离\n*   旋转（Rotation）：绕固定中心旋转所有点\n*   平移（Translation）：按固定量移动所有点\n\
  *   剪切（Shear）：固定一条线不变，并使平行于该线的线“滑动”，其滑动量与固定直线的距离成正比\n\n图 12.48 显示了这四种基本变换如何作用于单位正方形。\n\
  \n.图 12.48: 基本变换\n\n`Graphics2D` 类的 `scale`、`rotate`、`translate` 和 `shear` 方法将图形上下文的坐标变换设置为这些基本变换之一。\n\
  \n你可以`compose`这些变换。例如，你可能希望旋转形状并增加它们的大小；提供旋转和缩放变换：\n\n```\ng2.rotate(angle);\ng2.scale(2,\
  \ 2);\n```\n\n在这种情况下，变换的顺序并不重要。然而，对于大多数变换，你提供的顺序是有区别的。例如，如果你想要剪切，图形上下文将按照你提供的相反的顺序应用变换——也就是说，最后提供的变换首先应用。\n\
  \n你可以提供许多变换。例如，考虑以下变换序列：\n\n```\ng2.translate(x, y);\ng2.rotate(a);\ng2.translate(-x,\
  \ -y);\n```\n\n最后一种变换（首先应用）将点 (`x`, `y`) 移到原点。第二个变换绕原点旋转 `a`。最后的变换将原点移回 (`x`, `y`)。整体效果是相对于点\
  \ (`x`, `y`) 的旋转——参见图 12.49。由于绕非原点旋转是一种常见的操作，有一个快捷方法：\n\n```\ng2.rotate(a, x, y);\n\
  ```\n\n.图 12.49: 组合变换\n\n如果你熟悉矩阵理论，可能知道所有的旋转、平移、缩放以及它们的组合都可以由以下形式的变换矩阵表示：\n\n$\\\
  begin{bmatrix} x_{\\text{new}} \\\\ y_{\\text{new}} \\\\ 1 \\end{bmatrix} = \\begin{bmatrix}\
  \ a & c & e \\\\ b & d & f \\\\ 0 & 0 & 1 \\end{bmatrix} \\cdot \\begin{bmatrix}\
  \ x \\\\ y \\\\ 1 \\end{bmatrix}$\n\n这种变换被称为`affine 变换`。在 Java 2D API 中，`AffineTransform`\
  \ 类描述了这种变换。如果你知道特定变换矩阵的分量，可以直接构造它：\n\n```\nvar t = new AffineTransform(a, b, c,\
  \ d, e, f);\n```\n\n此外，工厂方法 `getRotateInstance`、`getScaleInstance`、`getTranslateInstance`\
  \ 和 `getShearInstance` 构造这些变换类型的矩阵。例如，调用\n\n```\nt = AffineTransform.getScaleInstance(2.0F,\
  \ 0.5F);\n```\n\n返回一个对应于矩阵的变换：\n\n$\\begin{bmatrix} 2 & 0 & 0 \\\\ 0 & 0.5 & 0 \\\
  \\ 0 & 0 & 1 \\end{bmatrix}$\n\n最后，实例方法 `setToRotation`、`setToScale`、`setToTranslation`\
  \ 和 `setToShear` 将变换对象设置为新类型。这里有一个例子：\n\n```\nt.setToRotation(angle); // 将 t 设置为旋转\n\
  ```\n\n你可以将图形上下文的坐标变换设置为 `AffineTransform` 对象。\n\n```\ng2.setTransform(t); // 替换当前变换\n\
  ```\n\n\n\n\n然而，在实践中，你不应该调用 `setTransform` 操作，因为它会替换图形上下文可能具有任何现有变换。例如，用于横向模式打印的图形上下文已经包含\
  \ 90 度的旋转变换。如果你调用 `setTransform`，你就会消除该旋转。相反，请调用 `transform` 方法。\n\n```\ng2.transform(t);\
  \ // 将当前变换与 t 组合\n```\n\n它将现有的变换与新的 `AffineTransform` 对象组合。\n\n如果你只想临时应用变换，请先获取旧变换，将其与你的新变换组合，最后在完成完成后恢复旧变换。\n\
  \n```\nAffineTransform oldTransform = g2.getTransform(); // 保存旧变换\ng2.transform(t);\
  \ // 应用临时变换\n在 g2 上绘制\ng2.setTransform(oldTransform); // 恢复旧变换\n```\n\n### `java.awt.geom.AffineTransform`\
  \ 1.2\n\n*   `AffineTransform(double a, double b, double c, double d, double e,\
  \ double f)`\n*   `AffineTransform(float a, float b, float c, double d, float e,\
  \ float f)`\n    使用矩阵构造仿变换\n    $\\begin{bmatrix} a & c & e \\\\ b & d & f \\\\\
  \ 0 & 0 & 1 \\end{bmatrix}$\n*   `AffineTransform(double[] m)`\n*   `AffineTransform(float[]\
  \ m)`\n    使用矩阵构造仿变换\n    $\\begin{bmatrix} \\mathtt{\\text{m[0]}} & \\mathtt{\\\
  text{m[2]}} & \\mathtt{\\text{m[4]}} \\\\ \\mathtt{\\text{m[1]}} & \\mathtt{\\text{m[3]}}\
  \ & \\mathtt{\\text{m[5]}} \\\\ 0 & 0 & 1 \\end{bmatrix}$\n*   `static AffineTransform\
  \ getRotateInstance(double a)`\n    按角度 `a`（弧度）绕原点创建旋转。变换矩阵为\n    $\\begin{bmatrix}\
  \ {\\cos(a)} & {- {\\sin(a)}} & 0 \\\\ {\\sin(a)} & {\\cos(a)} & 0 \\\\ 0 & 0 &\
  \ 1 \\end{bmatrix}$\n    如果 `a` 于 0 和 π / 2 之间，旋转将正 x 轴向正 y 轴移动。\n*   `static AffineTransform\
  \ getRotateInstance(double a, double x, double y)`\n    按角度 `a`（弧度）绕点 `(x,y)` 创建旋转。\n\
  *   `static AffineTransform getScaleInstance(double sx, double sy)`\n    创建一个缩放变换，将\
  \ x 轴缩放为 `sx`，y 轴缩放为 `sy`。变换矩阵为\n    $\\begin{bmatrix} {sx} & 0 & 0 \\\\ 0 & {sy}\
  \ & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}$\n*   `static AffineTransform getShearInstance(double\
  \ shx, double shy)`\n    创建一个剪切变换，将 x 轴剪切为 `shx`，y 轴剪切为 `shy`。变换矩阵为\n    $\\begin{bmatrix}\
  \ 1 & {shx} & 0 \\\\ {shy} & 1 & 0 \\\\ 0 & 0 & 1 \\end{bmatrix}$\n*   `static AffineTransform\
  \ getTranslateInstance(double tx, double ty)`\n    创建一个平移，将 x 轴移动 `tx` 单位，y 轴移动\
  \ `ty`。变换矩阵为\n    $\\begin{bmatrix} 1 & 0 & {tx} \\\\ 0 & 1 & {ty} \\\\ 0 & 0 &\
  \ 1 \\end{bmatrix}$\n*   `void setToRotation(double a)`\n*   `void setToRotation(double\
  \ a, double x, double y)`\n*   `void setToScale(double sx, double sy)`\n*   `void\
  \ setToShear(double sx, double sy)`\n*   `void setToTranslation(double tx, double\
  \ ty)`\n    将此仿变换设置为带有给定参数的基本变换。参见 `getXxxInstance` 方法以获取基本变换及其参数的解释。\n\n### `java.awt.Graphics2D`\
  \ 1.2\n\n*   `void setTransform(AffineTransform t)`\n    用 `t` 替换此图形上下文的现有坐标变换。\n\
  *   `void transform(AffineTransform t)`\n    将此图形上下文的现有坐标变换与 `t` 组合。\n*   `void\
  \ rotate(double a)`\n*   `void rotate(double a, double x, double y)`\n*   `void\
  \ scale(double sx, double sy)`\n*   `void shear(double sx, double sy)`\n*   `void\
  \ translate(double tx, double ty)`\n    将此图形上下文的现有坐标变换与带有给定参数的基本变换组合。参见 `AffineTransform.getXxxInstance`\
  \ 方法以获取基本变换及其参数的解释。\n\n### 12.5.8. Clipping\n\n通过在图形文中设置裁剪形状，你可以将所有绘制操作限制在该裁剪形状的内部。\n\
