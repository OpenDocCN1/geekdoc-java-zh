  number: \" + number);\n            IO.println(\"以下语句将抛出异常:\");\n            var\
  \ _ = (Integer[]) numbers; // 抛出异常\n        }\n        catch (ClassCastException\
  \ e) {\n            IO.println(e);\n        }\n\n        Integer[] numbers3 = Stream.iterate(0,\
  \ n -> n + 1).limit(10).toArray(Integer[]::new);\n        IO.println(\"Integer array:\
  \ \" + numbers3 + \" \" + Arrays.toString(numbers3));\n        // 注意这是一个 Integer[]\
  \ 数组\n\n        String result = noVowels().limit(10).collect(Collectors.joining());\n\
  \        IO.println(\"Joining: \" + result);\n        result = noVowels().limit(10).collect(Collectors.joining(\"\
  , \"));\n        IO.println(\"Joining with commas: \" + result);\n\n        IntSummaryStatistics\
  \ summary = noVowels()\n                .collect(Collectors.summarizingInt(String::length));\n\
  \        double averageWordLength = summary.getAverage();\n        double maxWordLength\
  \ = summary.getMax();\n        IO.println(\"Average word length: \" + averageWordLength);\n\
  \        IO.println(\"Max word length: \" + maxWordLength);\n        IO.println(\"\
  forEach:\");\n        noVowels().limit(10).forEach(IO::println);\n    }\n\n    Stream<String>\
  \ noVowels() throws IOException {\n        String contents = Files.readString(Path.of(\"\
  gutenberg\", \"alice30.txt\"));\n        Stream<String> words = Stream.of(contents.split(\"\
  \\\\PL+\"));\n        return words.map(s -> s.replaceAll(\"[aeiouAEIOU]\", \"\"\
  ));\n    }\n\n    <T> void show(String label, Set<T> set) {\n        IO.print(label\
  \ + \": \" + set.getClass().getName());\n        IO.println(\"[\"\n            +\
  \ set.stream().limit(10).map(Object::toString).collect(Collectors.joining(\", \"\
  ))\n            + \"]\");\n    }\n}\n```\n\n### 1.9.2. 收集到映射\n\n假设你有一个 `Stream<Person>`\
  \ 并想要将其元素收集到映射中，以便稍后通过 ID 查找人员。调用 `Collectors.toMap` 并传入两个用于产生映射的键值的值的函数。例如，\n\n\
  ```\npublic record Person(int id, String name) {}\n. . .\nMap<Integer, String> idToName\
  \ = people.collect(\n    Collectors.toMap(Person::id, Person::name));\n```\n\n\n\
  \n\n在值应为实际元素的常见情况下，请对第二个函数使用 `Function.identity()`。\n\n```\nMap<Integer, Person>\
  \ idToPerson = people.collect(\n    Collectors.toMap(Person::id, Function.identity()));\n\
  ```\n\n如果存在多个具有相同的元素，则会发生冲突，收集器将抛出 `IllegalStateException`。你可以通过提供第三个函数来覆盖该行为，该函数根据现有值和新值解决冲突并确定键的值。你的函数可以返回现有值、新值或两者的组合。\n\
  \n在这里，我们构建了一个映射，对于可用本地区域（locales）中的每种语言，键为在默认本地区域中的名称（例如 `\"German\"`），值为其本地化后的名称（例如\
  \ `\"Deutsch\"`）。\n\n```\nMap<String, String> languageNames = Locale.availableLocales().collect(\n\
  \    Collectors.toMap(\n        Locale::getDisplayLanguage,\n        loc -> loc.getDisplayLanguage(loc),\n\
  \        (existingValue, newValue) -> existingValue));\n```\n\n我们不在乎同一种语言可能会出现两次（例如德国和瑞士的德语），因此我们只保留第一个条目。\n\
  \n在本章中，我使用 `Locale` 类作为有趣数据集来源。有关处理本地区域的更多信息，请参见第 7 章。\n\n现在假设我们想知道某个国家的所有语言。那么我们需要一个\
  \ `Map<String, Set<String>>`。例如，`\"Switzerland\"` 的值是集合 `[French, German, Italian]`。起初，为每种语言存储一个单例集合。每当为某个国家发现新语言时，我们就形成现有集合和新集合的并集。\n\
  \n```\nMap<String, Set<String>> countryLanguageSets = Locale.availableLocales().collect(\n\
  \    Collectors.toMap(\n        Locale::getDisplayCountry,\n        l -> Collections.singleton(l.getDisplayLanguage()),\n\
  \        (a, b) -> { // a 和 b 的并集\n            var union = new HashSet<String>(a);\n\
  \            union.addAll(b);\n            return union;\n        }));\n```\n\n\
  将在下一节看到获取此映射的更简单的方法。\n\n如果你想要 `TreeMap`，请将构造函数作为第四参数提供。你必须提供一个合并函数。这里是该节开头的示例之一，现在产生一个\
  \ `TreeMap`：\n\n```\nMap<Integer, Person> idToPerson = people.collect(\n    Collectors.toMap(\n\
  \        Person::id,\n        Function.identity(),\n        (existingValue, newValue)\
  \ -> { throw new IllegalStateException(); },\n        TreeMap::new));\n```\n\n对于每个\
  \ `toMap` 方法，都有一个等效 `toConcurrentMap` 方法，它可以产生并发映射。在并行收集过程中使用单个并发映射。当与并行流配合时，共享映射比合并映射更高效。请注意，元素不再按照流的顺序收集，但这通常没有区别。\n\
  \nListing 1.6 中的程序提供了将流结果收集到映射中的示例。\n\nListing 1.6 v2ch01/collecting/CollectingIntoMaps.java\n\
  \n```\npackage v2ch01.collecting;\n\nimport module java.base;\n\nrecord Person(int\
  \ id, String name) {}\n\nclass CollectingIntoMaps {\n    void main() throws Exception\
  \ {\n        Map<Integer, String> idToName = people()\n                .collect(Collectors.toMap(Person::id,\
  \ Person::name));\n        IO.println(\"idToName: \" + idToName);\n\n        Map<Integer,\
  \ Person> idToPerson = people()\n                .collect(Collectors.toMap(Person::id,\
  \ Function.identity()));\n        IO.println(\"idToPerson: \" + idToPerson.getClass().getName()\
  \ + idToPerson);\n\n        idToPerson = people().collect(\n                Collectors.toMap(Person::id,\
  \ Function.identity(), (_, _) -> {\n                    throw new IllegalStateException();\n\
  \                }, TreeMap::new));\n        IO.println(\"idToPerson: \" + idToPerson.getClass().getName()\
  \ + idToPerson);\n\n        Map<String, String> languageNames = Locale.availableLocales()\n\
  \                .collect(Collectors.toMap(Locale::getDisplayLanguage,\n       \
  \                 l -> l.getDisplayLanguage(l),\n                        (existingValue,\
  \ _) -> existingValue));\n        IO.println(\"languageNames: \" + languageNames);\n\
  \n        Map<String, Set<String>> countryLanguageSets = Locale.availableLocales()\n\
  \                .collect(Collectors.toMap(Locale::getDisplayCountry,\n        \
  \                l -> Set.of(l.getDisplayLanguage()), (a, b) -> { // a 和 b 的并集\n\
  \                            Set<String> union = new HashSet<>(a);\n           \
  \                 union.addAll(b);\n                            return union;\n\
  \                        }));\n        IO.println(\"countryLanguageSets: \" + countryLanguageSets);\n\
  \    }\n\n    static Stream<Person> people() {\n        return Stream.of(new Person(1001,\
  \ \"Peter\"), new Person(1002, \"Paul\"),\n                new Person(1003, \"Mary\"\
  ));\n    }    \n}\n```\n\n`java.util.stream.Collectors`\n\n-   `static <T,K,U> Collector<T,?,Map<K,U>>\
  \ toMap(Function<? super T,? extends K> keyMapper, Function<? super T,? extends\
  \ U> valueMapper)`\n-   `static <T,K,U> Collector<T,?,Map<K,U>> toMap(Function<?\
  \ super T,? extends K> keyMapper, Function<? super T,? extends U> valueMapper, BinaryFunction<?super\
  \ U, super U, ? U> mergeFunction)`\n-   `static <T,K,U> Collector<T,?,Map<K,U>>\
  \ toMap(Function<? super T,? extends K> keyMapper, Function<? super T,? extends\
  \ U> valueMapper, BinaryFunction<? super U, super U, U> mergeFunction, Supplier<?\
  \ extends M> mapSupplier)`\n-   `static <T,K,U> Collector<T,?,Map<K,U>> toConcurrentMap(Function<?\
  \ super T,? extends K> keyMapper, Function<? super T,? extends U> valueMapper)`\n\
  -   `static <T,K,U> Collector<T,?,Map<K,U>> toConcurrentMap(Function<? super T,?\
  \ extends K> keyMapper, Function<? super T,? extends U> valueMapper, BinaryFunction<?\
  \ super U, super U, U> mergeFunction)`\n-   `static <T,K,U,M extends ConcurrentMap<K,U>>\
  \ Collector<T,?,M> toConcurrentMap(Function<? super T,? extends K> keyMapper, Function<?\
  \ super T,? extends U> valueMapper, BinaryFunction<? super U, super U, U> mergeFunction,\
  \ Supplier<? extends M> mapSupplier)`\n-   `static <T,K> Collector<T,?,Map<K,List<T>>>\
  \ groupingBy(Function<? super T,? extends K> classifier)`\n-   `static <T,K,U> Collector<T,?,Map<K,U>>\
  \ groupingBy(Function<? super T,? extends K> classifier, Collector<? super U, ?\
  \ U> downstream)`\n-   `static <T,K,U,M extends Map<K,U>> Collector<T,?,M> groupingBy(Function<?\
  \ super T,? extends K> classifier, Collector<? super U, ? U> downstream, Supplier<?\
  \ extends M> mapSupplier)`\n\n\n\n\n快速回顾一下区域设置（locales）：每个区域设置都包含一个语言代码（例如英语的 `en`）和一个国家代码（例如美国的\
  \ `US`）。区域设置 `en_US` 描述的是在美国使用的英语，而 `en_IE` 描述的是爱尔兰使用的英语。某些国家有多个区域。例如，`ga_IE` 是爱尔兰的盖尔语，正如前面的示例所示，JDK\
  \ 至少知道瑞士的三个区域。\n\n当分类器函数是一个谓词函数（即返回 `boolean` 值的函数）时，流元素被划分为两个列表：函数返回 `true` 的元素所在的列表以及其补集。在这种情况下，使用\
  \ `partitioningBy` 比使用 `groupingBy` 更高效。例如，在这里我们将所有区域划分为使用英语的区域和其他所有区域：\n\n```java\n\
  Map<Boolean, List<Locale>> englishAndOtherLocales = Locale.availableLocales().collect(\n\
  \    Collectors.partitioningBy(l -> l.getLanguage().equals(\"en\")));\nList<Locale>\
  \ englishLocales = englishAndOtherLocales.get(true);\n```\n\n如果你调用 `groupingByConcurrent`\
  \ 方法，你会得到一个并发 map，当它与并行流一起使用时，会进行并发填充。这与 `toConcurrentMap` 方法完全类比。\n\n`java.util.stream.Collectors`\
  \ 8\n\n- `static <T,K> Collector<T,?,Map<K,List<T>>> groupingBy(Function<? super\
  \ T,? extends K> classifier)`\n- `static <T,K> Collector<T,?,ConcurrentMap<K,List<T>>>\
  \ groupingByConcurrent(Function<? super T,? extends K> classifier)`\n  产生一个产生 map\
  \ 或并发 map 的收集器，其键为将 `classifier` 应用于所有收集元素的结果，其值 own 具有相同键的元素列表。\n- `static <T>\
  \ Collector<T,?,Map<Boolean,List<T>>> partitioningBy(Predicate<? super T> predicate)`\n\
  \  产生一个产生 map 的收集器，其键为 `true`/`false`，其值位满足/不满足谓词的元素列表。\n\n### 1.9.4. 下游收集器 (Downstream\
  \ Collectors)\n\n`groupingBy` 方法产生一个值为列表的 map。如果你想以某种方式处理这些列表，请提供一个“下游收集器”（downstream\
  \ collector）。例如，如果你想要集合而不是列表，可以使用你在上一节中看到的 `Collectors.toSet` 收集器：\n\n```java\n\
  Map<String, Set<Locale>> countryToLocaleSet = Locale.availableLocales().collect(\n\
  \    groupingBy(Locale::getCountry, toSet()));\n```\n\n在这个示例中，以及本节剩余的示例中，我假设静态导入了\
  \ `java.util.stream.Collectors.*`，以便使表达式更易读。\n\n你也可以应用两次 `groupingBy`：\n\n```java\n\
  Map<String, Map<String, List<Locale>>> countryAndLanguageToLocale =\n    Locale.availableLocales().collect(\n\
  \        groupingBy(Locale::getCountry,\n            groupingBy(Locale::getLanguage)));\n\
  ```\n\n然后 `countryAndLanguageToLocale.get(\"IN\").get(\"hi\")` 是印度印地语区域的列表。（有几种变体。）\n\
  \n提供了几个收集器将收集到的元素还原为数字：\n\n- `counting` 产生收集元素的计数。例如，\n\n```java\nMap<String, Long>\
  \ countryToLocaleCounts = Locale.availableLocales().collect(\n    groupingBy(Locale::getCountry,\
  \ counting()));\n```\n统计每个国家有多少区域设置。\n\n- `summing`(Int`|`Long`|`Double)` 和 `averaging`(Int`|`Long`|`Double)`\
  \ 将提供的函数应用于下游元素，并产生函数结果之和或平均值。例如，\n\n```java\npublic record City(String name, String\
  \ state, int population) {}\n. . .\nMap<String, Integer> stateToCityPopulation =\
  \ cities.collect(\n    groupingBy(City::state, averagingInt(City::population)));\n\
  ```\n计算城市流中每个州的人口平均。\n\n- `maxBy` 和 `minBy` 接收一个比较器并产生下游元素的最大值最小值。例如，\n\n```java\n\
  Map<String, Optional<City>> stateToLargestCity = cities.collect(\n    groupingBy(City::state,\n\
  \        maxBy(Comparator.comparing(City::population))));\n```\n产生每个州最大的城市。\n\n\
  `collectingAndThen` 收集器在收集器之后添加了一个最终处理步骤。例如，如果你想知道有多少个不同的结果，先将它们收集到集合中，然后计算大小：\n\
  \n```java\nMap<Character, Integer> stringCountsByStartingLetter = strings.collect(\n\
  \    groupingBy(s -> s.charAt(0),\n        collectingAndThen(toSet(), Set::size)));\n\
  ```\n\n`mapping` 收集器恰恰相反。它对每个收集到的元素应用函数并将结果传递给下游收集器。\n\n```java\nMap<Character,\
  \ Set<Integer>> stringLengthsByStartingLetter = strings.collect(\n    groupingBy(s\
  \ -> s.charAt(0),\n        mapping(String::length, toSet())));\n```\n在这里，我们根据字符串的首字母分组。在每个组内，我们产生长度并将其收集到集合中。\n\
  \n`mapping` 方法还为上一节中的问题提供了一个更好的解决方案——收集所有语言的集合。\n\n```java\nMap<String, Set<String>>\
  \ countryToLanguages = Locale.availableLocales().collect(\n    groupingBy(Locale::getCountry,\n\
  \        mapping(Locale::getLanguage, toSet())));\n```\n\n还有一个 `flatMapping` 方法，用于返回流的函数。\n\
  \n如果分组或映射函数的返回类型为 `int`、`long` 或 `double`，你可以将元素收集到统计对象，如 1.8 节所述。例如，\n\n```java\n\
  Map<String, IntSummaryStatistics> stateToSummary = cities.collect(\n    groupingBy(City::state,\n\
  \        summarizingInt(City::population)));\n```\n然后你可以从每个州的汇总统计中获取和、计数、平均值最小最大。\n\
  \n`filtering` 收集器对每个组应用过滤器，例如：\n\n```java\nMap<String, Set<City>> largeCitiesByState\n\
  \    = cities.collect(\n        groupingBy(City::state,\n            filtering(c\
  \ -> c.population() > 500000,\n                toSet())); // 没有大城市的州为空集合\n```\n\n\
  最后，你可以使用 `teeing` 收集器分支到两个下游收集。当你需要从流计算多个结果时非常有用。假设你想收集城市名称并计算它们的平均人口。你无法读取两次流，但\
  \ `teeing` 允许执行两次计算。指定两个下游收集器和一个合并结果的函数。\n\n```java\nrecord Pair<S, T>(S first,\
  \ T second) {}\nPair<List<String>, Double> result = cities.filter(c -> c.state().equals(\"\
  NV\"))\n    .collect(teeing(\n        mapping(City::name, toList()), // 第一个下游收集\n\
  \        averagingDouble(City::population), // 第二个下游收集\n        (list, avg) -> new\
  \ Pair(list, avg))); // 合并函数\n```\n\n还有三个 `reducing` 方法的版本用于通用归约，如下一节所述。\n\n组合收集器是强大的，但可能会导致非常复杂的表达式。最佳用法是配合\
  \ `groupingBy` 或 `partitioningBy` 处理“下游” map 值。否则，只需直接在流上应用 `map`、`reduce`、`count`、`max`\
  \ 或 `min` 等方法。\n\n`Listing 1.7` 中的示例程序演示了下游收集器。\n\nListing 1.7 v2ch01/collecting/DownstreamCollectors.java\n\
  \n\n\n\n\n```java\npackage v2ch01.collecting;\n\nimport static java.util.stream.Collectors.*;\n\
  \nimport module java.base;\n\nrecord City(String name, String state, int population)\
  \ {}\n\nclass DownstreamCollectors {\n\n    void main() throws Exception {\n   \
  \     Map<String, Set<Locale>> countryToLocaleSet = Locale.availableLocales()\n\
  \                .collect(groupingBy(Locale::getCountry, toSet()));\n        IO.println(\"\
  countryToLocaleSet: \" + countryToLocaleSet);\n\n        Map<String, Map<String,\
  \ List<Locale>>> countryAndLanguageToLocale = Locale\n                .availableLocales()\n\
  \                .collect(groupingBy(Locale::getCountry, groupingBy(Locale::getLanguage)));\n\
  \        IO.println(\n            \"Hindi locales in India: \" + countryAndLanguageToLocale.get(\"\
  IN\").get(\"hi\"));\n\n        Map<String, Long> countryToLocaleCounts = Locale.availableLocales()\n\
  \                .collect(groupingBy(Locale::getCountry, counting()));\n       \
  \ IO.println(\"countryToLocaleCounts: \" + countryToLocaleCounts);\n\n        Stream<City>\
  \ cities = readCities(\"v2ch01/cities.txt\");\n        Map<String, Integer> stateToCityPopulation\
  \ = cities\n                .collect(groupingBy(City::state, summingInt(City::population)));\n\
  \        IO.println(\"stateToCityPopulation: \" + stateToCityPopulation);\n\n  \
  \      cities = readCities(\"v2ch01/cities.txt\");\n        Map<String, Optional<String>>\
  \ stateToLongestCityName = cities.collect(groupingBy(\n            City::state,\
  \ mapping(City::name, maxBy(Comparator.comparing(String::length)))));\n        IO.println(\"\
  stateToLongestCityName: \" + stateToLongestCityName);\n\n        Map<String, Set<String>>\
  \ countryToLanguages = Locale.availableLocales()\n                .collect(groupingBy(Locale::getDisplayCountry,\n\
  \                    mapping(Locale::getDisplayLanguage, toSet())));\n        IO.println(\"\
  countryToLanguages: \" + countryToLanguages);\n\n        cities = readCities(\"\
  v2ch01/cities.txt\");\n        Map<String, IntSummaryStatistics> stateToCityPopulationSummary\
  \ = cities\n                .collect(groupingBy(City::state, summarizingInt(City::population)));\n\
  \        IO.println(stateToCityPopulationSummary.get(\"NY\"));\n\n        cities\
  \ = readCities(\"v2ch01/cities.txt\");\n        Map<String, String> stateToCityNames\
  \ = cities.collect(groupingBy(City::state,\n            reducing(\"\", City::name,\
