  \ 3D 80 78\n74 00 0C Hacker\nLjava.util.Date\n74 00 12 Ljava.String\n78\n70\n```\n\
  \n（注：上面的表是根据提供的碎片化源文本重构的）\n\n\n\n\n我们已经看到，任何给定类的完整类描述符（class descriptor）只会出现一次。后续的描述符会引用它。例如，在我们之前的示例中，对\
  \ `Date` 类的重复引用被编码为：\n\n```\n71 00 7E 00 08\n```\n\n相同的机制也适用于对象。如果写入了对之前保存的对象的引用，它将以完全相同的方式保存——即\
  \ `71` 后紧跟序列号。从上下文始终可以清楚地判断特定的序列引用是指类描述符还是对象。\n\n某些类（例如 `Date` 类）在不透明的二进制块中存储对象状态，其编码格式为：\n\
  \n*   `77`（短块）或 `7A`（长块）\n*   1 字节或 4 字节块长度\n*   块内容\n*   `78`\n\n最后，空引用被存储为：\n\n\
  ```\n70\n```\n\n这里是前一节 `ObjectStreamDemo` 程序的注释输出。运行该程序，查看其数据文件 `employee.ser` 的十六进制转储，并将其与注释后的列表进行比较。最重要的行位于输出末尾。它们显示了对之前保存对象的引用。\n\
  \n| Hex | 描述 |\n| :--- | :--- |\n| `AC ED 00 05` | 文件头头 |\n| `75` | 数组 `staff` (序列号\
  \ #1) |\n| `72 00 12 [Lserial.Employee;` | 新类，字符串长度，类名 `Employee[]` (序列号 #0) |\n\
  | `40 05 D6 7E 3B BB F2 50 02` | 指纹和标志位 |\n| `00 00` | 实例字段数量 |\n| `78` | 结束标记 |\n\
  | `70` | 无超类 |\n| `00 00 00 03` | 数组条目数量 |\n| `73` | `staff[0]`—新对象 (序列号 #7) |\n\
  | `72 00 0E serial.Manager` | 新类，字符串长度，类名 (序列号 #2) |\n| `2F FF 1F 1D E8 7A A9 74\
  \ 02` | 指纹和标志位 |\n| `00 01` | 实例字段数量 |\n| `L 00 09 secretary` | 实例字段类型和名称 |\n| `74\
  \ 00 11 Lserial/Employee;` | 实例字段类名：`String` (序列号 #3) |\n| `78` | 结束标记 |\n| `72\
  \ 00 0F serial.Employee` | 超类：新类，字符串长度，类名 (序列号 #4) |\n| `74 1E C8 E6 C3 F8 B8 77\
  \ 02` | 指纹和标志位 |\n| `00 03` | 实例字段数量 |\n| `D 00 06 salary` | 实例字段类型和名称 |\n| `L 00\
  \ 07 hireDay` | 实例字段类型和名称 |\n| `74 00 10 Ljava/util/Date;` | 实例字段类名：`String` (序列号\
  \ #5) |\n| `L 00 04 name` | 实例字段类型和名称 |\n| `74 00 12 Ljava/lang/String;` | 实例字段类名：`String`\
  \ (序列号 #6) |\n| `78` | 结束标记 |\n| `70` | 无超类 |\n| `40 F3 88 00 00 00 00 00` | `salary`\
  \ 字段值：`double` |\n| `73` | `hireDay` 字段值：新对象 (序列号 #9) |\n| `72 00 0E java.util.Date`\
  \ | 新类，字符串长度，类名 (序列号 #8) |\n| `68 6A 81 01 4B 59 74 19 03` | 指纹和标志位 |\n| `00 00`\
  \ | 无实例字段 |\n| `78` | 结束标记 |\n| `70` | 无超类 |\n| `77 08` | 外部存储，字节数 |\n| `00 00 00\
  \ 83 E7 4B 7D 80` | 不透明字节 |\n| `78` | 结束标记 |\n| `74 00 0C Carl Cracker` | `name`\
  \ 字段值：`String` (序列号 #10) |\n| `73` | `secretary` 字段值：新对象 (序列号 #11) |\n| `71 00 7E\
  \ 00 04` | 现有类（使用序列号 #4） |\n| `40 E8 6A 00 00 00 00 00` | `salary` 字段值：`double`\
  \ |\n| `73` | `hireDay` 字段值：新对象 (序列号 #12) |\n| `71 00 7E 00 08` | 现有类（使用序列号 #8）\
  \ |\n| `77 08` | 外部存储，字节数 |\n| `00 00 00 91 19 97 3D 80` | 不透明字节 |\n| `78` | 结束标记\
  \ |\n| `74 00 0C Carl Cracker` | ... |\n\n\n\n\n在 `readObject` 方法中，我们反转了过程：\n\n\
  ```java\nprivate void readObject(ObjectInputStream in)\n        throws IOException,\
  \ ClassNotFoundException {\n    in.defaultReadObject();\n    double x = in.readDouble();\n\
  \    double y = in.readDouble();\n    point = new Point2D.Double(x, y);\n}\n```\n\
  \n另一个例子是 `HashSet` 类，它提供了自己的 `readObject` 和 `writeObject` 方法。`writeObject` 方法并没有保存哈希表的内部结构，而是简单地保存了容量（capacity）、负载因子（load\
  \ factor）、大小（size）和元素。`readObject` 方法则读回容量和负载因子，构建一个新表并插入元素。\n\n`readObject` 和 `writeObject`\
  \ 方法只需要保存和加载它们自身的数据。它们不关心父类数据或任何其他类信息。\n\n`Date` 类使用了这种方法。它的 `writeObject` 方法保存了自“元\
  \ Epoch”（1970 年 1 月 1 日）以来的毫秒数。缓存日历的数据结构没有被保存。因此，第 2.6.2 节中的序列化 `Date` 实例](#index.xhtml_ch01lev2sec9）由一个不透明的数据块组成。\n\
  \n就像构造函数一样，`readObject` 方法是在部分初始的对象上操作的。如果在 `readObject` 内部调用了一个在子类中被重写的非 final\
  \ 方法，该方法可能会访问到未初始化的数据。\n\n如果一个可序列化类定义了一个字段：\n\n```java\n@Serial private static final\
  \ ObjectStreamField[] serialPersistentFields\n```\n\n那么序列化将使用这些字段描述符，而不是非临时（non-transient）非静态字段。还有一个\
  \ API 可以在序列化之前设置字段值，或在反序列化之后读取这些值。这对于在类演进后保留旧布局（layout）非常有用。例如，`BigDecimal` 类使用这种机制来序列化其实例，其使用的格式不再反映实例字段。\n\
  \n### 2.6.5. `readExternal` 和 `writeExternal` 方法\n\n与其让序列化机制保存和恢复对象数据，类可以定义自己的机制。例如，你可以对数据进行加密，或者使用比序列化格式更高效的格式。\n\
  \n要实现这一点，类必须实现 `Externalizable` 接口。这又要求它定义两个方法：\n\n```java\npublic void readExternal(ObjectInput\
  \ in)\n        throws IOException, ClassNotFoundException;\npublic void writeExternal(ObjectOutput\
  \ out) throws IOException;\n```\n\n与 `readObject` 和 `writeObject` 方法不同，这些方法完全负责保存和恢复整个对象，包括父类数据。在写入对象时，序列化机制仅在输出流中记录对象的类类型。在读取一个外部化对象时，对象输入流会使用无参构造函数创建一个对象，然后调用\
  \ `readExternal` 方法。\n\n在这个示例中，`LabeledPixel` 类继承自可化的 `Point` 类，但它接管了该类及其父类的序列化。对象的字段没有存储在标准的序列化格式中。相反，数据被放置在一个不透明的块中。\n\
  \n```java\npublic class LabeledPixel extends Point implements Externalizable {\n\
  \    private String label;\n\n    public LabeledPixel() {} // externalizable 类需要的\n\
  \n    public void writeExternal(ObjectOutput out)\n            throws IOException\
  \ {\n        out.writeInt((int) getX());\n        out.writeInt((int) getY());\n\
  \       out.writeUTF(label);\n    }\n\n    public void readExternal(ObjectInput\
  \ in)\n            throws IOException, ClassNotFoundException {\n       int x =\
  \ in.readInt();\n       int y = in.readInt();\n       setLocation(x, y);\n     \
  \  label = in.readUTF();\n    }\n    . . .\n}\n```\n\n`readExternal` 和 `writeExternal`\
  \ 方法不应该带有 `@Serial` 注解。由于它们定义在 `Externalizable` 接口中，你可以简单地为它们加上 `@Override`。\n\n\
  与私有有且只能由序列化机制调用的 `readObject` 和 `writeObject` 方法不同，`readExternal` 和 `writeExternal`\
  \ 是公共的。特别是 `readExternal` 允许修改现有对象的状态。\n\n### 2.6.6. `readResolve` 和 `writeReplace`\
  \ 方法\n\n我们理所当然对象只能通过构造函数构建。然而，反序列化的对象并不是通过构建的。它的字段直接是从对象流中恢复的。\n\n如果构造函数强制执行某些条件，就会出现问题。例如，单例对象的实现可能使得构造函数只能调用一次。另一个例子是，数据库实体的构建方式可以使其始终来自受管理实例的池。\n\
  \n你不应该为单例实现自己的机制。如果你需要单例，请创建一个包含一个实例的枚举类型，按照惯例命名为 `INSTANCE`。\n\n```java\npublic\
  \ enum PersonDatabase {\n    INSTANCE;\n\n    public Person findById(int id) { .\
  \ . . }\n    . . .\n}\n```\n\n这之所以有效，是因为 `enum` 实例保证能被正确地反序列化。\n\n现在，假设你处于一种罕见的情况，想要控制每个反序列化实例的标识。例如，假设\
  \ `Person` 类希望在反序列化时从数据库恢复其实例。那么你不应该序列化对象本身。相反，请求保存一个代理实例。当恢复时，该代理会定位并构建所需的对象。你的类需要提供一个返回代理对象的\
  \ `writeReplace` 方法：\n\n```java\npublic class Person implements Serializable {\n\
  \    private int id;\n    // 其他字段\n    . . .\n    @Serial private Object writeReplace()\
  \ {\n        return new PersonProxy(id);\n    }\n}\n```\n\n当 `Person` 对象被序列化时，它的任何字段都不会被保存。相反，会调用\
  \ `writeReplace` 方法，并将其返回值被序列化后写入流中。\n\n代理类需要实现一个产生 `Person` 实例的 `readResolve` 方法：\n\
  \n```java\nclass PersonProxy implements Serializable {\n    private int id;\n\n\
  \    public PersonProxy(int id) {\n         this.id = id;\n    }\n\n    @Serial\
  \ private Object readResolve() {\n        return PersonDatabase.INSTANCE.findById(id);\n\
  \    }\n}\n```\n\n当 `readObject` 方法在 `ObjectInputStream` 中找到 `PersonProxy` 时，它会反序列化代理，调用它的\
  \ `readResolve` 方法并返回结果。\n\n与 `readObject` 和 `writeObject` 方法不同，`readResolve` 和\
  \ `writeReplace` 方法不需要是私有的。\n\n对于枚举（enums）和记录（records），`readObject`/writeObject`\
  \ 或 `readExternal`/writeExternal` 方法不用于序列化。对于记录，但对于枚举不是，`writeReplace` 方法将被使用。\n\
  \n### 2.6.7. 版本控制\n\n如果你使用序列化来保存对象，你需要考虑程序演进时会发生什么。版本 1.1 能读取旧文件吗？仍使用 1.0 的用户能读取新版本产生的文件吗？显然，如果对象文件能够处理类的演进将是理想的。\n\
  \n乍一看，这似乎是不可能的。当类定义发生任何变化时，其 SHA 指纹也会发生变化，我们知道对象输入流会拒绝读取指纹不同的对象。然而，类可以指示它与之前的版本兼容。要做到这一点，你必须先获取类早期版本的指纹。使用\
  \ JDK 部分的独立 `serialver` 程序获取该数字。例如，运行：\n\n```\nserialver serial.Employee\n```\n\n\
  打印：\n\n```\nserial.Employee: static final long serialVersionUID = 8367346051156850807L;\n\
  ```\n\n该类的后续所有版本必须将 `serialVersionUID` 常量定义与原始版本相同的指纹。\n\n\n\n\n\n```java\nclass\
  \ Employee implements Serializable { // version 1.1\n    . . .\n    @Serial public\
  \ static final long serialVersionUID = 8367346051156850807L;\n}\n```\n\n当类中有一个名为\
  \ `serialVersionUID` 的静态数据成员时，它不会手动计算指纹，而是使用该值。\n\n一旦该静态数据成员被置于类中，序列化系统就可以读取该类不同版本的对象。\n\
  \n如果仅类的方法发生了变化，读取新的对象数据没有问题。然而，如果实例字段发生了变化，你可能会遇到问题。例如，旧文件对象的实例字段可能比程序中的多或少，或者实例字段的类型可能不同。在这种情况下，对象输入流会尝试将序列化对象转换为类的当前版本。\n\
  \n对象输入流会将类的当前版本的实例字段与序列化对象中对应版本的实例字段进行比较。当然，对象输入流只考虑非传输（nontransient）和非静态（nonstatic）的实例字段。如果两个字段名称相同但类型不同，对象输入流不会尝试将一种类型转换为另一种类型——对象是不兼容的。如果序列化对象包含当前版本中不存在的实例字段，对象输入流将忽略额外数据。如果当前版本包含序列化对象中不存在的实例字段，则新增的字段将被设置为默认值（对象为\
  \ `null`，数字为 0，布尔值为 `false`）。\n\n这是一个示例。假设我们使用类的原始版本（1.0）在磁盘上保存了一些员工记录。现在我们通过添加一个名为\
  \ `department` 的实例字段将 `Employee` 类更改为版本 2.0。[ch01fig09] 显示当 1.0 对象读入使用 2.0 对象的程序时会发生什么。`department`\
  \ 字段被设置为 `null`。[ch01fig10] 显示相反的情况：使用 1.0 对象的程序读取一个 2.0 对象。额外的 `department` 字段被忽略了。\n\
  \n图 2.8：读取实例字段较少的对象。图 2.9：读取实例字段较多的对象\n\n这个过程安全吗？这取决于情况。丢弃一个实例字段似乎无害的——接收者仍然拥有它知道如何操作的所有数据。将实例字段设置为\
  \ `null` 可能并不那么安全。许多类都在所有构造函数中努力将所有实例字段初始化为非 `null` 值，这样方法就不需要准备处理 `null` 数据。这需要类设计者在\
  \ `readObject` 方法中实现额外的代码来修复版本不兼容问题，或者确保方法足够健壮以处理 `null` 数据。\n\n在向类添加 `serialVersionUID`\
  \ 字段之前，问问自己为什么要将该类设计为可序列化。如果序列化仅用于短期持久化（例如应用服务器中的分布式方法调用），则没有必要担心版本控制和 `serialVersionUID`。如果你扩展了一个恰好是可序列化的类，但你从未打算持久化它的实例，情况也是如此。如果你的\
  \ IDE 给你 报了恼人的警告，请更改 IDE 偏好设置将其关闭，或者添加注解 `@SuppressWarnings(\"serial\")`。这比添加一个你以后可能忘记更改的\
  \ `serialVersionUID` 要安全。\n\n枚举（Enumerations）和记录（records）会忽略 `serialVersionUID`\
  \ 字段。枚举的 `serialVersionUID` 始终为 `0L`。你可以声明记录的 `serialVersionUID`，但在反序列化时这些 ID 并不需要匹配。\n\
  \n在本节中，你看到了当读取器版本的类包含对象流中不存在的实例字段时会发生什么。在类演进过程中，可能会添加一个父类。这时，使用新版本的读取器可能会读取一个对象流，其中父类的实例字段未被设置。默认情况下，这些实例字段被设置为它们的零/`null`\
  \ 默认值。这可能导致父类处于不安全状态。父类可以通过定义一个初始化方法来防御该问题：\n\n```java\n@Serial private void readObjectNoData()\
  \ throws ObjectStreamException\n```\n\n该方法应该设置为与无参数构造函数相同的状态，或者抛出 `InvalidObjectException`。它只在异常情况下（即读取一个包含缺失父类数据的子类实例的对象流时）才被调用。\n\
  \n### 2.6.8. 反序列化与安全\n\n在可序列化类的反序列化期间，对象的创建不会调用该类的任何构造函数。即使该类有无参数构造函数，也不会被使用。字段值直接从对象输入流的值中设置。\n\
  \n对于可序列化的 `records`，反序列化会调用规范构造函数，并传递来自对象输入流的组件值。（结果是记录中的循环引用不会被恢复。）\n\n绕过构造函数是一种安全风险。攻击者可以伪造描述一个永远无法构造的无效对象的字节。例如，假设\
  \ `Employee` 构造函数在带有负薪资被调用时会抛出异常。我们可能认为这意味着没有 `Employee` 对象可以具有负薪资。但是，正如你在上一节中看到的，检查序列化对象的字节并修改其中一些字节并不困难。通过这样做，可以为一个具有负薪资的员工伪造字节，然后对其进行反序列化。\n\
  \n可序列化类可以选择可选实现 `ObjectInputValidation` 接口并定义 `validateObject` 方法来检查其对象是否被正确序列化。例如，`Employee`\
  \ 类可以检查薪资是否为负：\n\n```java\npublic void validateObject() throws InvalidObjectException\
  \ {\n    IO.println(\"validateObject\");\n    if (salary < 0)\n        throw new\
  \ InvalidObjectException(\"salary < 0\");\n}\n```\n\n遗憾的是，该方法不会自动调用。要调用它，你必须提供以下方法：\n\
  \n```java\n@Serial private void readObject(ObjectInputStream in)\n        throws\
  \ IOException, ClassNotFoundException {\n    in.registerValidation(this, 0);\n \
  \   in.defaultReadObject();\n}\n```\n\n该对象会被调度进行验证，当该对象及其所有依赖对象都加载后，就会调用 `validateObject`\
  \ 方法。第二个参数允许你指定优先级。优先级较高的验证请求会先执行。\n\n还有其他安全风险。攻击者可以创建消耗足够资源导致虚拟机崩溃的数据结构。更阴险的是，类路径上的任何类都可以被反序列化。黑客长于组合“getget\
  \ 链”（gadget chains），即各种工具类中的操作序列，这些序列使用反射并最终调用诸如 `Runtime.exec` 等带有任意字符串的方法。\n\n\
  任何通过网络连接从不可信源接收序列化数据的应用程序都容易受到此类攻击。例如，某些服务器序列化会话数据并反序列化 HTTP 会话 Cookie 返回的任何数据。\n\
  \n你应该避免反序列化来自不可信源的任意数据。在会话数据的示例中，服务器应对数据进行签名，并仅反序列化具有有效签名的数据。\n\nJEP 290 和 415 提供了*序列化过滤器*（serialization\
  \ filter）机制，以增强应用程序防御此类攻击的能力。过滤器可以看到反序列化的类名以及若干指标（流大小、数组大小、引用总数、引用引用链）。基于这些数据，可以中止反序列化。\n\
  \n\n\n\n在最简单的情况下，你提供一个描述有效和无效类的模式。例如，如果你如下所示启动我们的示例序列化演示：\n\n```bash\njava -Djdk.serialFilter='serial.*;java.**;!*'\
  \ v2ch02.serial.ObjectStreamDemo\n```\n\n那么对象将被加载。该过滤器允许 `serial` 包中的所有类以及所有包名以\
  \ `java` 开头的类，但不允许其他任何类。如果你不允许 `java.**`，或者至少不允许 `java.util.Date`，反序列化就会失败。\n\n\
  你可以将过滤器模式放入配置文件中，并为不同的目的指定多个过滤器。你也可以实现自己的过滤器。详情请参见 [`docs.oracle.com/en/java/javase/21/core/serialization-filtering1.html`](https://docs.oracle.com/en/java/javase/21/core/serialization-filtering1.html)。\n\
  \n## 2.6.9. 使用序列化进行克隆\n\n序列化机制有一个有趣的用途：它为你提供了一种克隆对象的简单方法，只要该类是可序列化的。只需将其序列化到输出流，然后重新读入即可。结果是现有对象的深拷贝的新对象。你不需要将对象写入文件——可以使用\
  \ `ByteArrayOutputStream` 将数据保存到字节数组中。\n\n如 Listing 2.6 所示，要免费获得 `clone` 方法，只需扩展\
  \ `SerialCloneable` 类即可。\n\n你应该意识到，这种方法虽然很聪明，但通常会比显式构造新对象并复制或克隆实例字段的 clone 方法慢得多。\n\
  \nListing 2.6 v2ch02/serialClone/SerialCloneDemo.java\n\n```java\npackage v2ch02.serialClone;\n\
  \nclass SerialCloneDemo {\n    void main() throws Exception {\n        var harry\
  \ = new Employee(\"Harry Hacker\", 35000, 1989, 10, 1);\n        // clone harry\n\
  \        var harry2 = (Employee) harry.clone();\n\n        // mutate harry\n   \
  \     harry.raiseSalary(10);\n\n        // now harry and the clone are different\n\
  \        IO.println(harry);\n        IO.println(harry2);\n    }\n}\n```\n\n序列化尝试恢复对象之间的循环引用，但这可能会导致问题。考虑以下情况：\n\
  \n```java\nvar a = new ArrayList<Object>();\nvar s = new HashSet<Object>();\na.add(s);\n\
  s.add(a); // Cyclic references between a and s\nIO.println(SerialCloneable.serialClone(s).size());\
  \ // 1\nIO.println(SerialCloneable.serialClone(a).size()); // NullPointerException\n\
  ```\n\n为了方便起见，此示例使用了示例代码中的 `serialClone` 方法，它先序列化对象然后再次反序列化。\n\n为什么第二次反序列化会出错？ArrayList\
  \ 和 HashSet 没有序列化它们的内部数据结构。相反，它们的 `writeObject` 方法写入序列化元素，而它们的 `readObject` 方法将反序列化的元素插入到新的数组或哈集中。当\
  \ `a` 在最后一行被反序列化时，发生了以下系列不幸事件：\n\n1. 数组列表的 `size` 字段从流中恢复，但 `elements` 仍为 `null`\n\
  2. 分配了一个临时数组，稍后将赋值给数组列表的 `elements` 字段\n3. 开始反序列化数组元素。只有一个，即哈希集\n4. 哈希集反序列化它的唯一元素——数组列表，获得了指向部分反序列化对象的引用\n\
  5. 哈希集尝试计算数组列表的哈希码\n6. `ArrayList.hashCode` 方法抛出 `NullPointerException`，因为 `elements`\
  \ 字段为 `null`\n\n如你所示，`ArrayList` 的反序列化策略从根本上是有的。不应该观察到一个部分构造的实例。\n\n`HashSet` 的反序列化策略有另一个缺陷，对可能只被部分反序列化的元素调用\
  \ `hashCode`。\n\n回想起来，Java 中的序列化并没有成功。它复杂且容易出错，并提供了巨大的攻击面。了解这一机制及其局限性是好的。但对于将其用于短期持久化或同类型虚拟机之间的安全通信之外的任何用途你应该慎考虑。\n\
  \n## 2.7. 正则表达式\n\n正则表达式用于指定字符串模式。当你需要定位匹配特定模式的字符串时，可以使用正则表达式。例如，我们的示例程序之一通过查找模式\
  \ `<a href=\". . .\">` 的字符串来定位 HTML 文件中的所有超链接。\n\n当然，在指定模式时，`. . .` 表示法并不精确。你需要使用特殊语法来描述模式，精确指定哪些字符序列是合法的匹配。\n\
  \n在接下来的章节中，我们将介绍 Java API 使用的正则表达式语法，并讨论如何使用正则表达式。\n\n### 2.7.1. 正则表达式语法\n\n让我们从一个简单的例子开始。正则表达式\n\
  \n```\n[Jj]ava.+\n```\n\n匹配任何以下形式的字符串：\n\n* 首字母是 `J` 或 `j`。\n* 接下来的三个字母是 `ava`。\n\
  * 字符串剩余由一个或多个任意字符组成。\n\n例如，字符串 `\"javanese\"` 匹配此正则表达式，但字符串 `\"Core Java\"` 不匹配。\n\
  \n在指定模式时，`. . .` 表示法并不精确。你需要使用特殊语法来描述模式，精确指定哪些字符序列是合法的匹配。\n\n\n\n你的 IDE 可以帮助你完成这些转义工作。将正则表达式字符串粘贴到一个空字符串中，反斜杠就会自动双倍。\n\
  \n与其使用反斜杠，你可以用 `\\Q` 和 `\\E` 包裹一个字符串。例如，`\\(\\$0\\.99\\)` 和 `\\Q($0.99)\\E` 都能匹配字符串\
  \ `($0.99)`。\n\n如果你有一个字符串，它可能包含正则表达式语法中的许多特殊字符之一，可以通过调用 `Parse.quote(str)` 来对它们全部进行转义。这只是简单的将字符串包裹在\
  \ `\\Q` 和 `\\E` 中，但它处理了 `str` 可能包含 `\\E` 的特殊情况。\n\n### 表 2.13：正则表达式表达式语法\n\n| 表达式\
