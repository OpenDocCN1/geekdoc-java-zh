  \ createServerSocket(int port)`\n\n    返回一个给定端口的服务器字字。\n\n`javax.net.ssl.SSLServerSocketFactory`1.4\n\
  \n*   `static ServerSocketFactory getDefault()`\n\n    返回一个产生 `SSLServerSocket`\
  \ 实例的工厂。\n\n`javax.net.ssl.SSLSocketFactory`1.4\n\n*   `static SocketFactory getDefault()`\n\
  \n    返回一个产生 `SSLSocket` 实例的工厂。\n\n`javax.net.SocketFactory`1.4\n\n*   `static Socket\
  \ createSocket(InetAddress host, int port)`\n*   `static Socket createSocket(String\
  \ host, int port)`\n\n    产生一个连接到给定主机和端口的字。\n\n## 4.3. 获取 Web 数据\n\n在 Java 程序中访问\
  \ Web 服务器时，你希望比字连接和 HTTP 请求更高级别地操作。在接下来的章节中，我们将讨论 Java 库为此目的提供的类。\n\n### 4.3.1.\
  \ URLs 和 URIs\n\n`java.net` 包对 URL（统一资源定位符）和 URI（统一资源标识符）区分了非常有用的区别。\n\nURI 是一个纯语法上的构造结构，包含了指定\
  \ Web 资源的字符串各个部分。URL 是一种特殊的 URI，即具有足够信息来定位资源的 URI。其他 URI，例如\n\n```\nmailto:cay@horstmann.com\n\
  ```\n\n并不是定位符——从该标识符中没有数据可以进行定位。这种这样的 URI 被称为 URN（统一资源名称）。\n\n在 Java 库中，`URI` 类没有访问标识符所指定资源的方法——它的唯一目的是解析。与此相反，`URL`\
  \ 类可以打开指向资源的流。由于这个原因，`URL` 类仅适用于 Java 库已知如何处理的方案，例如 `http:`、`https:`、`ftp:`、本地文件系统（`file:`）以及\
  \ JAR 文件（`jar:`）。\n\n你可以从一个 `URI` 构建一个 `URL` 对象：\n\n```\nvar url = new URI(urlString).toURL();\n\
  ```\n\n`URL` 类的构造函数在 Java 20 中被弃用了。它们存在各种技术问题，导致可能构造无效的 URL。相反，先构造 URI，然后获取 URL，如上所示。\n\
  \n如果你只是获取资源的内容，请使用 `URL` 类的 `openStream` 方法。该方法产生一个 `InputStream` 对象。按照通常的方式使用它——例如构造一个\
  \ `Scanner`：\n\n```\nInputStream inStream = url.openStream();\nvar in = new Scanner(inStream);\n\
  ```\n\n在下一节中，你将看到如何使用 `URLConnection` 类对连接进行更多的控制。\n\n让我们回到 URI。为了理解为什么解析并非易事，请考虑\
  \ URI 可能有多复杂。例如，\n\n```\nhttps://google.com?q=Beach+Chalet\nftp://username:password@ftp.yourserver\n\
  ```\n\n### 4.3.2. 使用 `URLConnection` 获取信息\n\n如果你想获取 Web 资源的额外信息，你应该使用 `URLConnection`\
  \ 类，它比基础的 `URL` 类给了你更多的控制。\n\n在处理 `URLConnection` 对象时，你必须仔细安排你的步骤。\n\n1.  调用 `URL`\
  \ 类的 `openConnection` 方法获取 `URLConnection` 对象：\n\n    ```\n    URLConnection connection\
  \ = url.openConnection();\n    ```\n\n2.  设置任何请求属性，使用方法\n\n\n\n\n\n```\nsetDoInput\n\
  setDoOutput\nsetIfModifiedSince\nsetUseCaches\nsetAllowUserInteraction\nsetRequestProperty\n\
  setConnectTimeout\nsetReadTimeout\n```\n\n我们将在本节稍后以及 API 注释中讨论这些方法。\n\n### 3. 通过调用\
  \ `connect` 方法连接到远程资源：\n\n```\nconnection.connect();\n```\n\n除了与服务器建立 socket 连接外，该方法还会查询服务器的`header\
  \ information`。\n\n### 4. 连接到服务器后，你可以查询头部信息。通过 `getHeaderFieldKey` 和 `getHeaderField`\
  \ 两个方法可以列出头部中所有的字段。`getHeaderFields` 方法获取一个包含所有头部字段的标准 `Map` 对象。为了方便起见，以下方法查询了标准字段：\n\
  \n```\ngetContentType\ngetContentLength\ngetContentEncoding\ngetDate\ngetExpiration\n\
  getLastModified\n```\n\n### 5. 最后，你可以访问资源数据。使用 `getInputStream` 方法获取一个用于读取信息的输入流。（这与\
  \ `URL` 类的 `openStream` 方法返回的输入流是相同的。）另一个方法 `getContent` 在实践中并不好用。对于 `text/plain`\
  \ 和 `image/gif` 等标准内容类型返回的类，需要 `com.sun` 层次结构中的类进行处理。你可以注册自己的内容处理器，但我们书中书中书中讨论这种技术。\n\
  \n一些程序员在在使用 `URLConnection` 类时会产生一种错误的心理认知，认为 `getInputStream` 和 `getOutputStream`\
  \ 方法与 `Socket` 类的方法相似。但事实并非完全如此。`URLConnection` 类在后台做了很多“魔法”工作——特别是对请求头和响应头部的处理。因此，遵循连接的设置步骤是非常关重要的。\n\
  \n现在让我们详细查看一些 `URLConnection` 的方法。有几个方法在连接到服务器之前会设置连接的属性。最重要的两个是 `setDoInput` 和\
  \ `setDoOutput`。默认情况下，连接会产生一个用于从服务器读取的输入流，但没有用于写入的输出流。如果你需要输出流（例如为了向 Web 服务器发布数据），你需要调用：\n\
  \n```\nconnection.setDoOutput(true);\n```\n\n接下来，你可能想要设置一些请求头。请求头会随着请求命令一起发送到服务器。这里有一个示例：\n\
  \n```\nGET www.server.com/index.html HTTP/1.0\nReferer: https://www.somewhere.com/links.html\n\
  Proxy-Connection: Keep-Alive\nUser-Agent: Mozilla/5.0 (X11; U; Linux i686; en-US;\
  \ rv:1.8.1.4)\nHost: www.server.com\nAccept: text/html, image/gif, image/jpeg, image/png,\
  \ */*\nAccept-Language: en\nAccept-Charset: iso-8859-1,*,utf-8\nCookie: orangemilano=192218887821988\n\
  ```\n\n`setIfModifiedSince` 方法告诉连接，你只对自某个日期以来修改的数据感兴趣。\n\n最后，你可以使用通用的 `setRequestProperty`\
  \ 方法来设置任何对特定协议有意义的键值对。关于 HTTP 请求头的格式，请参阅 RFC 2616。这些属性中的某些没有良好的文档说明，是在程序员之间口口相传的。例如，如果你想访问受密码保护的网页，，必须执行以下操作：\n\
  \n1. 将用户名、冒号和密码拼接。\n\n```\nString input = username + \":\" + password;\n```\n\n\
  2. 计算结果字符串的 Base64 编码。（Base64 编码将字节序列编码为可打印的 ASCII 字符序列。）\n\n```\nBase64.Encoder\
  \ encoder = Base64.getEncoder();\nString encoding = encoder.encodeToString(input.getBytes());\n\
  ```\n\n3. 调用 `setRequestProperty` 方法，名称为 `\"Authorization\"`，值为 `\"Basic \" + encoding`。\n\
  \n```\nconnection.setRequestProperty(\"Authorization\", \"Basic \" + encoding);\n\
  ```\n\n你刚刚学会了如何访问受密码保护的网页。若要通过 FTP 访问受密码保护的文件，则使用完全不同的方法：构造如下格式的 URL：\n\n```\nftp://username:password@ftp.yourserver.com/pub/file.txt\n\
  ```\n\n一旦调用了 `connect` 方法，你就可以查询响应头部信息。首先，让我们如何列出所有的响应头部字段。该类的实现者认为有必要引入另一种迭代协议来表达他们的个性。。调用：\n\
  \n```\nString key = connection.getHeaderFieldKey(n);\n```\n\n将从响应头部获取第 `n` 个键，其中\
  \ `n` 从 `1` 开始计数！如果 `n` 小于 1 或大于头部字段的总数，则返回 `null`。没有方法可以返回字段的数量；你只需不断调用 `getHeaderFieldKey`\
  \ 直到得到 `null`。同样地，调用：\n\n```\nString value = connection.getHeaderField(n);\n```\n\
  \n返回第 `n` 个值。\n\n`getHeaderFields` 方法返回一个响应头部字段的 `Map`。\n\n```\nMap<String,List<String>>\
  \ headerFields = connection.getHeaderFields();\n```\n\n这是一组响应头部字段：\n\n```\nDate:\
  \ Wed, 27 Aug 2008 00:15:48 GMT\nServer: Apache/2.2 (Unix)\nLast-Modified: Sun,\
  \ 22 Jun 2008 20:53:38 GMT\nAccept-Ranges: bytes\nContent-Length: 4813\nConnection:\
  \ close\nContent-Type: text/html\n```\n\n即使 `connection.getHeaderFieldKey(0)` 返回\
  \ `null`，你也可以调用 `connection.getHeaderField(0)` 来获取响应状态（例如 `\"HTTP/1.1 200 OK\"`）。当你调用\
  \ `headerFields.get(null)` 时也会获得它。\n\n为了方便起见，六个方法查询最常见头部类型的值并在适当的情况下转换为数值类型。表 4.1\
  \ 显示了这些方便方法。返回类型为 `long`的方法返回自 1970 年 1 月 1 日 GMT 以来的秒数。\n\n表 4.1：响应头部值的方便方法\n\n\
  | 键名 | 方法名 | 返回类型 |\n| --- | --- | --- |\n| `Date` | `getDate` | `long` |\n| `Expires`\
  \ | `getExpiration` | `long` |\n| `Last-Modified` | `getLastModified` | `long` |\n\
  | `Content-Length` | `getContentLength` | `int` |\n| `Content-Type` | `getContentType`\
  \ | `String` |\n| `Content-Encoding` | `getContentEncoding` | `String` |\n\n列表 4.8\
  \ 中的程序让你实验 URL 连接。在运行程序时，在命令行提供 URL 以及可选的用户名和密码，例如：\n\n```\njava urlConnection.URLConnectionDemo\
  \ https://horstmann.com/corejava/secret user password\n```\n\n该程序打印\n\n*   所有头部键和值\n\
  *   表 4.1 中六个方便方法的返回值\n*   所请求资源的前十行\n\n\n\n\n\n```java\npackage v2ch04.urlConnection;\n\
  \nimport module java.base;\n\n/**\n * 此程序连接到 URL 并显示响应头数据以及请求数据的 \n * 前 10 行。\n\
  \ * \n * 在命令行上提供 URL 以及可选的用户名和密码（用于 HTTP 基础身份验证）。\n */\nclass URLConnectionDemo\
  \ {\n    void main(String[] args) throws Exception {\n        String urlName = args.length\
  \ > 0 ? args[0] : \"http://horstmann.com\";\n\n        var url = new URI(urlName).toURL();\n\
  \        URLConnection connection = url.openConnection();\n\n        // 如果在命令行中指定，则设置用户名和密码\n\
  \n        if (args.length > 2) {\n            String username = args[1];\n     \
  \       String password = args[2];\n            String input = username + \":\"\
  \ + password;\n            Base64.Encoder encoder = Base64.getEncoder();\n     \
  \       String encoding = encoder.encodeToString(input.getBytes());\n          \
  \  connection.setRequestProperty(\"Authorization\", \"Basic \" + encoding);\n  \
  \      }\n\n        connection.connect();\n\n        // 打印头部字段\n\n        Map<String,\
  \ List<String>> headers = connection.getHeaderFields();\n        for (Map.Entry<String,\
  \ List<String>> entry : headers.entrySet()) {\n            String key = entry.getKey();\n\
  \            for (String value : entry.getValue())\n                IO.println(key\
  \ + \": \" + value);\n        }\n\n        // 打印便利函数\n\n        IO.println(\"----------\"\
  );\n        IO.println(\"getContentType: \" + connection.getContentType());\n  \
  \      IO.println(\"getContentLength: \" + connection.getContentLength());\n   \
  \     IO.println(\"getContentEncoding: \" + connection.getContentEncoding());\n\
  \        IO.println(\"getDate: \" + connection.getDate());\n        IO.println(\"\
  getExpiration: \" + connection.getExpiration());\n        IO.println(\"getLastModifed:\
  \ \" + connection.getLastModified());\n        IO.println(\"----------\");\n\n \
  \       String encoding = connection.getContentEncoding();\n        if (encoding\
  \ == null) encoding = \"UTF-8\";\n        try (var in = new Scanner(connection.getInputStream(),\
  \ encoding)) {\n            // 打印内容的前十行\n\n            for (int n = 1; in.hasNextLine()\
  \ && n <= 10; n++)\n                IO.println(in.nextLine());\n            if (in.hasNextLine())\
  \ IO.println(\". . .\");\n        }\n    }\n}\n```\n\n### `java.net.URL` 1.0\n\n\
  *   `InputStream openStream()`\n    打开一个用于读取资源数据的输入流。\n*   `URLConnection openConnection()`\n\
  \    返回一个管理与资源连接的 `URLConnection` 对象。\n\n### `java.net.URLConnection` 1.0\n\n* \
  \  `void setDoInput(boolean doInput)`\n*   `boolean getDoInput()`\n    如果 `doInput`\
  \ 为 `true`，用户可以从此 `URLConnection` 接收输入。\n*   `void setDoOutput(boolean doOutput)`\n\
  *   `boolean getDoOutput()`\n    如果 `doOutput` 为 `true`，用户可以向此 `URLConnection` 发送输出。\n\
  *   `void setIfModifiedSince(long time)`\n*   `long getIfModifiedSince()`\n    `ifModifiedSince`\
  \ 属性配置此 `URLConnection`，仅获取自给定时间以来修改的数据。该时间是以自 GMT 1970 年 1 月 1 日午夜以来的秒数提供的。\n*\
  \   `void setConnectTimeout(int timeout)` 5.0\n*   `int getConnectTimeout()` 5.0\n\
  \    设置或获取连接的超时时间（毫秒）。如果在建立连接之前已过期，关联输入流的 `connect` 方法将抛出 `SocketTimeoutException`。\n\
  *   `void setReadTimeout(int timeout)` 5.0\n*   `int getReadTimeout()` 5.0\n   \
  \ 设置或获取读取数据的超时时间（毫秒）。如果在读取操作成功之前超时已过期，`read` 方法将抛出 `SocketTimeoutException`。\n*\
  \   `void setRequestProperty(String key, String value)`\n    设置请求头字段。\n*   `Map<String,List<String>>\
  \ getRequestProperties()` 1.4\n    返回请求属性的映射。相同键的所有值都放在一个列表中。\n*   `void connect()`\n\
  \    连接到远程资源并检索响应头。\n*   `Map<String,List<String>> getHeaderFields()` 1.4\n    返回响应属性的映射。相同键的值都放在一个列表中。\n\
  *   `String getHeaderField(int n)`\n    获取第 `n` 个响应头字段。\n*   `String getHeaderField(int\
  \ n)`\n    获取第 `n` 个响应头字段的值，如果不存在则返回 `null`。\n*   `int getContentLength()`\n   \
  \ 获取内容长度，如果不可用则返回 `-1`。\n*   `String getContentType()`\n    获取内容类型，例如 `text/plain`。\n\
  *   `String getContentEncoding()`\n    获取内容编码，例如 `gzip`。此值通常用于指定 `Content-Encoding`\
  \ 头。\n*   `long getDate()`\n*   `long getExpiration()`\n*   `long getLastModified()`\n\
  \    获取创建、过期和最后修改日期。日期以 GMT 1970 年 1 月 1 日午夜以来的秒数表示。\n*   `InputStream getInputStream()`\n\
  *   `OutputStream getOutputStream()`\n    返回用于从资源读取或写入资源的流。\n*   `Object getContent()`\n\
  \    选择适当的内容处理器来读取资源并转换为对象。此方法不适用于 `text/plain` 或 `image/gif`。\n\n### 4.3.3 提交表单数据\n\
  \n在前面的节中，你看到了如何从 Web 服务器读取数据。现在我们将向你展示程序如何向服务器发送数据。\n\n为了从 Web 浏览器向服务器发送信息，用户填写一个\
  \ `form`，如图 4.64.6：HTML 表单\n\n当用户点击提交按钮时，文本框中的文本以及复选框、单选按钮和其他元素的设置将发送回服务器。服务器处理提交的值。\n\
  \n服务器随后产生另一个 HTML 页面并将其发送回浏览器。这一序列在[图 4.7](#index.ch0310）中所示。响应页面可以包含新信息（例如在信息搜索程序中），或者只是一个确认。Web\
  \ 浏览器随后显示响应页面。\n\n4.7：执行表单提交期间的数据流\n\n\n\n\n\n# 通过 HTTP POST 请求发送数据\n\n在编写本文时，Google\
  \ Maps 网站（`[`www.google.com/maps`](https://www.google.com/maps)`）接受名为 `q` 和 `hl`\
  \ 的查询参数，其值分别是位置查询内容和响应的人类语言。要获取一张位于旧金山 1 Market Street 的地图，并使用德语响应，请使用以下 URL：\n\n\
  ```\nhttps://www.google.com/maps?q=1+Market+Street+San+Francisco&hl=de\n```\n\n\
  非常长的查询字符串在浏览器中看起来可能并不美观，而且旧版本的浏览器和代理对 `GET` 请求中包含的字符数量有限制。因此，对于包含大量数据的表单，通常使用 `POST`\
  \ 请求。在 `POST` 请求中，你不需要将参数附加到 URL 上；而是从 `URLConnection` 获取一个输出流，并向输出流写入键值值对。你仍然需要对值进行\
  \ URL 编码，并使用 `&` 字符将它们分隔。\n\n让我们详细查看这一过程。要向服务器端程序发布数据，首先建立一个 `URLConnection`：\n\n\
  ```\nURL url = new URI(\"https://host/path\").toURL();\nURLConnection connection\
  \ = url.openConnection();\n```\n\n然后，调用 `setDoOutput` 方法来设置输出输出连接：\n\n```\nconnection.setDoOutput(true);\n\
  ```\n\n接下来，调用 `getOutputStream` 获取一个可以通过该流向服务器发送数据的流。如果你在向服务器发送文本，将该流封装进 `PrintWriter`\
  \ 中会非常方便。\n\n```\nvar out = new PrintWriter(connection.getOutputStream());\n```\n\
  \n现在你已经准备好向服务器发送数据了：\n\n```\nout.print(name1 + \"=\" + URLEncoder.encode(value1,\
  \ StandardCharsets.UTF_8) + \"&\");\nout.print(name2 + \"=\" + URLEncoder.encode(value2,\
  \ StandardCharsets.UTF_8));\n```\n\n关闭输出流：\n\n```\nout.close();\n```\n\n最后，调用 `getInputStream`\
  \ 并读取服务器响应。\n\n静态方法 `URLEncoder.encode` 和 `URLDecoder.decode` 有一个使用默认字符集的版本，但它们在\
  \ Java 6 中已被弃用，因为它们应该始终与 UTF-8 一起使用。遗憾的是，尽管 Java 18 将默认字符编码更改为 UTF-8，它们仍然被弃用。\n\n\
  ## 实际示例\n\n让我们运行一个实际示例。`[`tools.usps.com/zip-code-lookup.htm?byaddress`](https://tools.usps.com/zip-code-lookup.htm?byaddress)`\
  \ 网站包含一个用于查找街道地址邮政编码的表单（参见图 4.6）。要在 Java 程序中使用此表单，你需要知道 `POST` 请求的 URL 和参数。\n\n\
  你可以通过查看表单的 HTML 代码获取这些信息，但通常使用网络监视器“监控”请求更容易。大多数浏览器的开发工具包中都包含网络监视器。例如，图 4.8 显示了向我们的示例网站提交数据时\
  \ Firefox 网络监视器的截图。你可以找到提交的 URL 以及参数名称和值。\n\n![Figure](img/devtools.jpg)图 4.8：监控表单的提交\n\
  \n在发布表单数据时，HTTP 请求头包含内容类型：\n\n```\nContent-Type: application/x-www-form-urlencoded\n\
  ```\n\n你也可以以其他格式发布数据。例如，在使用 JavaScript 对象表示法（JSON）发送数据时，将内容类型设置为 `application/json`。\n\
  \n`POST` 的头部还必须包含内容长度，例如\n\n```\nContent-Length: 124\n```\n\n代码列表 4.9 中的程序向任何服务器端程序发送\
  \ `POST` 表单数据。将数据放入如下的 `.properties` 文件中：\n\n```\nurl=https://tools.usps.com/tools/app/ziplookup/zipByAddress\n\
  User-Agent=HTTPie/0.9.2\naddress1=1 Market Street\naddress2=\ncity=San Francisco\n\
  state=CA\ncompanyName=\n. . .\n```\n\n该程序移除 `url` 和 `User-Agent` 条目，并将所有其他发送到 `doPost`\
  \ 方法。\n\n在 `doPost` 方法中，我们首先打开连接并设置用户代理。（邮政编码服务不支持默认的 `User-Agent` 请求参数，该参数包含字符串\
  \ `Java`，可能是因为邮政部门不想响应程序化的请求。）\n\n然后我们调用 `setDoOutput(true)` 并打开输出流。然后我们列出所有的键和值。对于每一个值，我们发送\
  \ `key`、`=` 字符、`value` 和 `&` 分隔符：\n\n```\nout.print(key);\nout.print(\"=\");\nout.print(URLEncoder.encode(value,\
  \ StandardCharsets.UTF_8));\nif (more pairs) out.print(\"&\");\n```\n\n当从写入切换到读取响应的任何部分时，与服务器的实际交互发生了。`Content-Length`\
  \ 头部设置为输出的大小。除非指定了不同的内容类型，否则 `Content-Type` 头部设置为 `application/x-www-form-urlencoded`。头部和数据发送到服务器。然后读取响应头部和服务器响应。\n\
  \n## 处理重定向和错误\n\n当从写入切换到读取响应的任何部分时，与服务器的实际交互发生了。`Content-Length` 头部设置为输出的大小。除非指定了不同的内容类型，否则\
  \ `Content-Type` 头部设置为 `application/x-www-form-urlencoded`。头部和数据发送到服务器。然后读取响应头部和服务器响应。\n\
  \n如果发生服务器错误，调用 `getInputStream()` 会抛出 `FileNotFoundException`。为了捕获此错误，调用 `getErrorStream`\
  \ 方法：\n\n```\nInputStream err = connection.getErrorStream();\n```\n\n`getErrorStream`\
  \ 方法以及其他几个方法属于 `URLConnection`。如果你对 `http://` 或 `https://` 进行请求，可以将结果对象转换为 `HttpURLConnection`。\n\
  \n当你向服务器发送 `POST` 数据时，服务器可能会响应重定向：一个应该被调用的 URL。`HttpURLConnection` 类在大多数情况下可以处理重定向。\n\
  \n如果 Cookie 需要从一个站点发送到另一个站点，可以这样配置 Cookie 处理器：\n\n```\nCookieHandler.setDefault(new\
  \ CookieManager(null, CookiePolicy.ACCEPT_ALL));\n```\n\n这样 Cookie 将正确包含在重定向中。\n\
  \n尽管重定向通常会被处理，但在某些情况下你必须手动处理。由于安全原因，不支持 HTTP 和 HTTPS 之间的重定向。重定向也可能因为更微妙的原因而失败。例如，早期版本的邮政编码服务使用了重定向。记得我们在初始请求中将用户代理设置了不同的字符串，该设置在自动重定向中并不生效。相反，自动重定向总是发送包含\
  \ `Java` 单词的通用用户代理字符串。\n\n在这种情况下，你可以手动执行重定向。在连接服务器之前，关闭自动重定向：\n\n```\nconnection.setInstanceFollowRedirects(false);\n\
  ```\n\n请求完成后，获取响应码：\n\n```\nint responseCode = connection.getResponseCode();\n```\n\
  \n检查它是否为以下之一\n\n```\nHttpURLConnection.HTTP_MOVED_PERM\nHttpURLConnection.HTTP_MOVED_TEMP\n\
  HttpURLConnection.HTTP_SEE_OTHER\n```\n\n如果是这种情况，获取 `Location` 响应头部以获得重定向的 URL。然后断开连接并连接到新\
  \ URL：\n\n```\nString location = connection.getHeaderField(\"Location\");\nif (location\
  \ != null) {\n    URL base = connection.getURL();\n    connection.disconnect();\n\
  \    URL url = base.toURI().resolve(location).toURL();\n    connection = (HttpURLConnection)\
  \ url.openConnection();\n    . . .\n}\n```\n\n\n\n\n\n本程序所演示的技术在任何需要从现有网站查询信息时都非常用用。你只需要找到需要发送的参数，然后从响应中剥离出\
  \ HTML 标签和其他不需要的信息即可。\n\n### 列表 4.9 `v2ch04/post/PostDemo.java`\n\n```java\npackage\
  \ v2ch04.post;\n\nimport module java.base;\n\n/**\n * 此程序演示了如何使用 URLConnection 类进行\
  \ POST 请求。\n */\npublic class PostDemo {\n    void main(String[] args) throws Exception\
  \ {\n        String propsFilename = args.length > 0 ? args[0] : \"v2ch04/post/post.properties\"\
  ;\n        var props = new Properties();\n        try (Reader in = Files.newBufferedReader(Path.of(propsFilename)))\
  \ {\n            props.load(in);\n        }\n        String urlString = props.remove(\"\
  url\").toString();\n        Object userAgent = props.remove(\"User-Agent\");\n \
  \       Object redirects = props.remove(\"redirects\");\n        CookieHandler.setDefault(new\
  \ CookieManager(null, CookiePolicy.ACCEPT_ALL));\n        String result = doPost(new\
  \ URI(urlString).toURL(), props,\n                userAgent == null ? null : userAgent.toString(),\n\
  \                redirects == null ? -1 : Integer.parseInt(redirects.toString()));\n\
  \        IO.println(result);\n    }\n\n    /**\n     * 执行一个 HTTP POST。\n     * @param\
  \ url 要发送到的 URL\n     * @param nameValuePairs 查询参数\n     * @param userAgent 使用的用户代理，或为\
  \ null 表示使用默认用户代理\n     * @param redirects 手动跟随的重定向数量，或 -1 表示自动重定向\n     * @return\
  \ 服务器返回的数据\n     * @throws URISyntaxException\n     */\n    String doPost(URL url,\
  \ Map<Object, Object> nameValuePairs, String userAgent, int redirects)\n       \
  \     throws IOException, URISyntaxException {\n        var connection = (HttpURLConnection)\
  \ url.openConnection();\n        if (userAgent != null) connection.setRequestProperty(\"\
  User-Agent\", userAgent);\n\n        if (redirects >= 0) connection.setInstanceFollowRedirects(false);\n\
  \n        connection.setDoOutput(true);\n\n        try (var out = new PrintWriter(connection.getOutputStream()))\
  \ {\n            boolean first = true;\n            for (Map.Entry<Object, Object>\
  \ pair : nameValuePairs.entrySet()) {\n                if (first)\n            \
  \        first = false;\n                else\n                    out.print(\"\
  &\");\n                String name = pair.getKey().toString();\n               \
  \ String value = pair.getValue().toString();\n                out.print(name);\n\
  \                out.print(\"=\");\n                out.print(URLEncoder.encode(value,\
  \ StandardCharsets.UTF_8));\n            }\n        }\n        String encoding =\
  \ connection.getContentEncoding();\n        if (encoding == null) encoding = \"\
  UTF-8\";\n\n        if (redirects > 0) {\n            int responseCode = connection.getResponseCode();\n\
  \            if (responseCode == HttpURLConnection.HTTP_MOVED_PERM\n           \
  \         || responseCode == HttpURLConnection.HTTP_MOVED_TEMP\n               \
  \     || responseCode == HttpURLConnection.HTTP_SEE_OTHER) {\n                String\
  \ location = connection.getHeaderField(\"Location\");\n                if (location\
  \ != null) {\n                    URL base = connection.getURL();\n            \
  \        connection.disconnect();\n                    return doPost(base.toURI().resolve(location).toURL(),\
  \ nameValuePairs,\n                            userAgent, redirects - 1);\n    \
  \            }\n            }\n        }\n        else if (redirects == 0) { throw\
  \ new IOException(\"Too many redirects\"); }\n\n        var response = new StringBuilder();\n\
  \        try (var in = new Scanner(connection.getInputStream(), encoding)) {\n \
  \           while (in.hasNextLine()) {\n                response.append(in.nextLine());\n\
  \                response.append(\"\\n\");\n            }\n        }\n        catch\
  \ (IOException e) {\n            InputStream err = connection.getErrorStream();\n\
  \            if (err == null) throw e;\n            try (var in = new Scanner(err))\
  \ {\n                response.append(in.nextLine());\n                response.append(\"\
  \\n\");\n            }\n        }\n\n        return response.toString();\n    }\n\
  }\n```\n\n`java.net.HttpURLConnection` 1.0\n\n*   `InputStream getErrorStream()`\n\
  \    返回一个可以从中读取服务器错误消息的流。\n\n`java.net.URLEncoder` 1.0\n\n*   `static String encode(String\
  \ s, String encoding)` 1.4\n    使用指定的字符编码方案返回字符串 `s` 的 URL 编码形式。（推荐的方案是 `\"UTF-8\"\
  `）。在 URL 编码中，字符 `A`–`Z`、`a`–`z`、`0`–`9`、`- _ . ~` 保持不变。空格被编码为 `+`，所有其他字符被编码为形式如\
  \ `%XY` 的编码字节序列序列，其中 `0xXY` 是该字节的十六进制值。\n\n`java.net.URLDecoder` 1.2\n\n*   `static\
  \ string decode(String s, String encoding)` 1.4\n    使用指定的字符编码方案返回 URL 编码字符串 `s`\
  \ 的解码结果。\n\n## 4.4. HTTP 客户端\n\n`URLConnection` 类设计于 HTTP 成为 Web 通用协议之前。它支持许多协议，但其对\
  \ HTTP 的支持有些繁琐。当决定支持 HTTP/2 时，很明显提供一个现代客户端是最好的选择。\n\n### 4.4.1. HttpClient 类\n\n\
  `HttpClient` 可以发送请求并接收响应。通过调用以下方法获取客户端：\n\n```java\nHttpClient client = HttpClient.newHttpClient();\n\
  ```\n\n或者，如果你需要配置客户端，可以使用构建器：\n\n```java\nHttpClient client = HttpClient.newBuilder()\n\
  \    .followRedirects(HttpClient.ALWAYS)\n    .build();\n```\n\n也就是说，获取一个构建器，调用方法自定义要构建的对象，然后调用\
  \ `build` 方法完成构建过程。对于 Cookie、SSL、代理设置和身份验证有许多高级选项。\n\n`HttpClient` 是可关闭的，因此你可以将其放在\
  \ `try` 语句中。它的 `close` 方法会等待已提交请求完成然后关闭连接池。\n\n### 4.4.2. HttpRequest 类和请求发布器\n\n\
  你也遵循构建器模式来制定请求。这是一个 `GET` 请求示例：\n\n```java\nHttpRequest request = HttpRequest.newBuilder()\n\
  \    .uri(new URI(urlString))\n    .GET()\n    .build();\n```\n\n`URI` 是统一资源标识符，在使用\
  \ HTTP 时，它与 URL 是相同的。然而，在 Java 中，`URL` 类具有实际打开连接的方法，而 `URI` 类仅关注语法（方案、主机、端口、路径、查询、片段）。\n\
  \n对于 `POST` 请求，你需要一个“体发布器”将请求数据转换为要发布的数据。提供了字符串、字节数组和文件的体发布器。例如，如果你的请求是 JSON，只需将\
  \ JSON 字符串提供给字符串发布器即可：\n\n```java\nHttpRequest request = HttpRequest.newBuilder()\n\
  \    .uri(new URI(urlString))\n    .header(\"Content-Type\", \"application/json\"\
  )\n    .POST(HttpRequest.BodyPublishers.ofString(jsonString))\n    .build();\n```\n\
  \n\n\n\n\n`HttpRequest.Builder` 类还为不常用的 `PUT`、`DELETE` 和 `HEAD` 请求 了构建方法。\n\nJava\
  \ 16 增加了一个构建器，用于过滤现有 `HttpRequest` 的标头（headers）。你提供请求以及一个接收标头名称和值的函数，该函数对于应该保留的标头返回\
  \ `true`。例如，在这里我们修改内容类型：\n\n```\nHttpRequest request2 = HttpRequest.newBuilder(request,\
  \ (name, value) ->\n        !name.equalsIgnoreCase(\"Content-Type\")) // 移除旧的内容类型\n\
  \    .header(\"Content-Type\", \"application/xml\") // 添加新的内容类型\n    .build();\n\
  ```\n\n### 4.4.3. `HttpResponse` 接口与体处理器\n\n在发送请求时，你必须告诉客户端如何处理响应。如果你只需要字符串形式响应体，请使用\
  \ `HttpResponse.BodyHandlers.ofString()` 发送请求，如下：\n\n```\nHttpResponse<String> response\n\
  \    = client.send(request, HttpResponse.BodyHandlers.ofString());\n```\n\n`HttpResponse`\
  \ 是一个泛型接口，其类型参数表示响应体的类型。你可以简单地获取响应体字符串：\n\n```\nString bodyString = response.body();\n\
  ```\n\n还有其他响应体处理器可以将响应获取字节数组或输入流。`BodyHandlers.ofFile(filePath)` 产生一个将响应保存到指定文件的处理器，而\
  \ `BodyHandlers.ofFileDownload(directoryPath)` 则将响应保存到指定目录，并使用 `Content-Disposition`\
  \ 标头中的文件名。最后，从 `BodyHandlers.discarding()` 获取的处理器会直接丢弃响应。\n\n处理响应的内容不认为是 API 的一部分。例如，如果你接收到\
  \ JSON 数据，你需要一个 JSON 库来解析内容。\n\n`HttpResponse` 对象还产生状态码和响应标头。\n\n```\nint status\
  \ = response.statusCode();\nHttpHeaders responseHeaders = response.headers();\n\
  ```\n\n你可以将 `HttpHeaders` 对象转换为一个 map：\n\n```\nMap<String, List<String>> headerMap\
  \ = responseHeaders.map();\n```\n\nmap 的值是列表，因为在 HTTP 中，每个键可以有多个值。\n\n如果你只需要特定键的值，并且知道不会有多个值，请调用\
  \ `firstValue` 方法：\n\n```\nOptional<String> lastModified = responseHeaders.firstValue(\"\
  Last-Modified\");\n```\n\n你将获得响应值，或者如果没有提供，则获得一个空的可选。\n\n`HttpHeaders` 类感知到 HTTP\
  \ 参数的键是不区分大小写的。如果你调用 `responseHeaders.firstValue(\"Last-Modified\")`，即使它是作为 `last-modified`\
  \ 发送的，你也能获得所需的标头值。\n\n### 4.4.4. 异步处理\n\n你可以异步处理响应。在构建客户端时，提供一个执行器（executor）：\n\n\
  ```\nExecutorService executor = Executors.newCachedThreadPool();\nHttpClient client\
  \ = HttpClient.newBuilder().executor(executor).build();\n```\n\n构建一个请求，然后在客户端上调用\
  \ `sendAsync` 方法。你将收到一个 `CompletableFuture<HttpResponse<T>>`，其中 `T` 是体处理器的类型。按照\
  \ 第一卷第 10 章 中描述的方法使用 `CompletableFuture` API：\n\n```\nHttpRequest request = HttpRequest.newBuilder().uri(uri).GET().build();\n\
  client.sendAsync(request, HttpResponse.BodyHandlers.ofString())\n    thenAccept(response\
  \ -> . . .);\n```\n\n要为 `HttpClient` 启用日志，请在 JDK 的 `net.properties` 中添加此行：\n\n```\n\
  jdk.httpclient.HttpClient.log=all\n```\n\n除了 `all`，你还可以指定逗号分隔的以下事件类型列表：\n\n- `channel`\n\
  - `content`\n- `errors`\n- `frames`，可选地跟随一个或多个 `:control``:data``:window` 或 `:all`\n\
  - `headers`\n- `requests`\n- `ssl`\n- `trace`\n\n不要使用任何空格：\n\n```\njdk.httpclient.HttpClient.log=headers,requests,frames:control:data\n\
  ```\n\n然后，为名为 `jdk.httpclient.HttpClient` 的记录器设置日志级别为 `INFO`，例如通过向 JDK 中的 `logging.properties`\
  \ 文件添加此行：\n\n```\njdk.httpclient.HttpClient.level=INFO\n```\n\nListing 4.10 中的程序展示了如何向不同的服务发送同步请求。Listing\
  \ 4.11 中的类实现了用于表单、文件上传和 JSON 的体发布器。以以下方式运行程序：\n\n```\njavac v2ch04/httpClient/HttpClientDemo.java\n\
  java v2ch04.httpClient.HttpClientDemo v2ch04/httpClient/form.properties\njava v2ch04.httpClient.HttpClientDemo\
  \ v2ch04/httpClient/fileupload.properties\njava v2ch04.httpClient.HttpClientDemo\
  \ v2ch04/httpClient/json.properties\n```\n\n每次运行时，它都会向 CodeCheck 服务发送一个“Hello, World”程序，并显示其运行结果。该服务可以接受表单提交、文件上传和\
  \ JSON POST。注意来自 `HttpClient` 的日志输出。\n\nListing 4.10 v2ch04/httpClient/HttpClientDemo.java\n\
  \n```\npackage v2ch04.httpClient;\n\nimport module java.base;\nimport module java.net.http;\n\
  import java.net.http.HttpRequest.BodyPublisher;\n\n/**\n * 此程序演示了 HTTP\n */\nclass\
  \ HttpClientDemo {\n    void main(String[] args) throws Exception {\n        System.setProperty(\"\
  jdk.httpclient.HttpClient.log\", \"headers,requests\");\n        Path propsPath\
