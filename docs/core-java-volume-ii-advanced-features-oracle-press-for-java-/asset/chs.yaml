  \ parent;\n        if (s == null)\n            parent = root;\n        else\n  \
  \          parent = addClass(s);\n\n        // 将类作为父节点的子添加\n        var newNode\
  \ = new DefaultMutableTreeNode(c);\n        model.insertNodeInto(newNode, parent,\
