  \n## 10.4. 事件处理\n\n任何支持图形用户界面（GUI）的操作系统环境都会持续监控按键或鼠标点击等事件。这些事件随后会被报告给运行中的程序。然后每个程序都会决定对这些事件采取什么行动（如果有的话）。\n\
  \n### 10.4.1. 基本事件处理概念\n\n在 Java AWT 中，*事件源*（如按钮或滚动条）拥有允许你注册*事件监听器*的方法——监听器是对事件执行预期响应的对象。\n\
  \n当事件监听器被通知某个事件时，有关事件的信息封装在*事件对象*中。在 Java 中，所有事件对象最终都继承自 `java.util.EventObject`\
  \ 类。当然，每种类型的事件都有相应的子类，例如 `ActionEvent` 和 `WindowEvent`。\n\n不同的事件源可以产生不同类型的事件。例如，按钮可以发送\
  \ `ActionEvent` 对象，而窗口可以发送 `WindowEvent` 对象。\n\n总而言之，这里是 AWT 事件处理工作原理的概述：\n\n* \
  \  事件监听器是实现*监听器接口*的类的实例。\n\n*   事件源是一个可以注册监听器对象并向它们发送事件对象的对象。\n\n*   当事件发生时，事件源向所有已注册的监听器发送事件对象。\n\
  \n*   监听器对象随后使用事件对象中的信息来确定它们对事件的反应。\n\n图 10.12 显示了事件处理类和接口之间的关系。\n\n.图 10.12: 事件源与监听器之间的关系\n\
  \n以下是一个指定监听器的示例：\n\n```\nActionListener listener = . . .\nvar button = new JButton(\"\
  OK\");\nbutton.addActionListener(listener);\n```\n\n\n\n\n```\nvar yellowButton\
  \ = new JButton(\"Yellow\");\nvar blueButton = new JButton(\"Blue\");\nvar redButton\
  \ = new JButton(\"Red\");\n\nbuttonPanel.add(yellowButton);\nbuttonPanel.add(blueButton);\n\
  buttonPanel.add(redButton);\n```\n\n图 10.14 显示了结果。\n\n![Figure](img/buttontest1.jpg)图\
  \ 10.14: 一个填充了按钮的面板\n\n接下来，我们需要添加用于监听这些按钮的代码。这需要实现 `ActionListener` 接口的类，正如我刚才提到的，它包含一个方法：`actionPerformed`，其签名如下所示：\n\
  \n```\npublic void actionPerformed(ActionEvent event)\n```\n\n使用 `ActionListener`\
  \ 接口的方法在所有情况下都是相同的：`actionPerformed` 方法（它是 `ActionListener` 中唯一的方法）接受一个类型为 `ActionEvent`\
  \ 的对象作为参数。这个事件对象为你提供了有关所发生事件的信息。\n\n当按钮被点击时，我们希望面板的背景颜色改变变为特定的颜色。我们将所需的颜色存储在监听器类中。\n\
  \n```\nclass ColorAction implements ActionListener {\n    private Color backgroundColor;\n\
  \n    public ColorAction(Color c) {\n        backgroundColor = c;\n    }\n\n   \
  \ public void actionPerformed(ActionEvent event) {\n        // 设置面板背景颜色\n      \
  \  . . .\n    }\n}\n```\n\n然后我们为每种颜色构造一个对象，并将这些对象设置为按钮的监听器。\n\n```\nvar yellowAction\
  \ = new ColorAction(Color.YELLOW);\nvar blueAction = new ColorAction(Color.BLUE);\n\
  var redAction = new ColorAction(Color.RED);\n\nyellowButton.addActionListener(yellowAction);\n\
  blueButton.addActionListener(blueAction);\nredButton.addActionListener(redAction);\n\
  ```\n\n例如，如果用户点击标记为“Yellow”的按钮，`yellowAction` 对象的 `actionPerformed` 方法会被调用。它的 `backgroundColor`\
  \ 实例字段被设置为 `Color.YELLOW`，现在它就可以继续设置面板的背景颜色了。\n\n还剩下一个问题。`ColorAction` 对象无法访问 `buttonPanel`\
  \ 变量。你有两种方法解决这个问题。你可以将面板存储在 `ColorAction` 对象中，并在 `ColorAction` 构造函数中设置它。或者更方便的方法，你可以将\
  \ `ColorAction` 变成 `ButtonFrame` 类的内部类。它的它的方法就可以自动访问外部面板了。\n\n代码列表 10.6 包含了完整的框架类。每当你点击其中一个按钮时，相应的动作监听器就会改变面板的背景颜色。\n\
  \n代码列表 10.6 v2ch10/button/ButtonFrame.java\n\n```\npackage v2ch10.button;\n\nimport\
  \ module java.desktop;\n\n/**\n * 一个带有按钮面板的框架。\n */\npublic class ButtonFrame extends\
  \ JFrame {\n    private JPanel buttonPanel;\n    private static final int DEFAULT_WIDTH\
  \ = 300;\n    private static final int DEFAULT_HEIGHT = 200;\n\n    public ButtonFrame()\
  \ {\n        setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\n        // 创建按钮\n      \
  \  var yellowButton = new JButton(\"Yellow\");\n        var blueButton = new JButton(\"\
  Blue\");\n        var redButton = new JButton(\"Red\");\n\n        buttonPanel =\
  \ new JPanel();\n\n        // 将按钮添加到面板\n        buttonPanel.add(yellowButton);\n\
  \        buttonPanel.add(blueButton);\n        buttonPanel.add(redButton);\n\n \
  \       // 将面板添加到框架\n        add(buttonPanel);\n\n        // 创建按钮动作\n        var\
  \ yellowAction = new ColorAction(Color.YELLOW);\n        var blueAction = new ColorAction(Color.BLUE);\n\
  \        var redAction = new ColorAction(Color.RED);\n\n        // 将动作与按钮关联\n  \
  \      yellowButton.addActionListener(yellowAction);\n        blueButton.addActionListener(blueAction);\n\
  \        redButton.addActionListener(redAction);\n    }\n\n    /**\n     * 设置面板背景颜色的动作监听器。\n\
  \     */\n    private class ColorAction implements ActionListener {\n        private\
  \ Color backgroundColor;\n\n        public ColorAction(Color c) {\n            backgroundColor\
  \ = c;\n        }\n\n        public void actionPerformed(ActionEvent event) {\n\
  \            buttonPanel.setBackground(backgroundColor);\n        }\n    }\n}\n\
  ```\n\n`javax.swing.JButton`1.2\n\n*   `JButton(String label)`\n*   `JButton(Icon\
  \ icon)`\n*   `JButton(String label, Icon icon)`\n    构造一个按钮。标签字符串可以是纯文本或 HTML；例如，`\"\
  <html><b>Ok</b></html>\"`\n\n`java.awt.Container`1.0\n\n*   `Component add(Component\
  \ c)`\n    将组件 `c` 添加到此容器中。\n\n### 10.4.3 简洁地指定监听器\n\n在前面的节中，我们定义了一个用于事件监听器的类并构造了该类的三个对象。拥有一个监听器类的多个实例并不常见。最常见的情况是每个监听器执行一个独立的动作。在这种情况下，没有必要单独创建一个类。只需使用\
  \ lambda 表达式即可：\n\n```\nexitButton.addActionListener(_ -> System.exit(0));\n```\n\
  \n记住 `_` 表示未使用的参数。在 Java 22 之前，请使用如 `event` 之类的变量名。\n\n现在考虑有多个相关动作的情况，例如前一节中的颜色按钮。在这种情况下，实现一个辅助方法：\n\
  \n```java\npublic void makeButton(String name, Color backgroundColor) {\n    var\
  \ button = new JButton(name);\n    buttonPanel.add(button);\n    button.addActionListener(_\
  \ -> buttonPanel.setBackground(backgroundColor));\n}\n```\n\n注意 lambda 表达式引用了 `backgroundColor`。然后我们只需调用\n\
  \n```\nmakeButton(\"yellow\", Color.YELLOW);\nmakeButton(\"blue\", Color.BLUE);\n\
  makeButton(\"red\", Color.RED);\n```\n\n在这里，我们构造了三个监听器对象，每种颜色一个，而没有显式地定义类。每当调用辅助方法时，它都会创建一个实现\
  \ `ActionListener` 接口的类的实例。它的 `actionPerformed` 动作引用了实际上存储在监听器对象中的 `backgroundColor`\
  \ 值。然而，这一切都不需要你显式地定义监听器类、实例字段或构造函数。\n\n在旧代码中，你可能会看到匿名类的使用：\n\n```\nexitButton.addActionListener(new\
  \ ActionListener() {\n    public void actionPerformed(ActionEvent event) {\n   \
  \     System.exit(0);\n    }\n});\n```\n\n当然，这种相当冗长的代码不再需要了。使用 lambda 表达式更加简单且清晰。\n\
  \n### 10.4.4 适配器类\n\n并不是所有事件都像点击那样容易处理。假设你想要监控用户尝试关闭主框架的情况，以便弹出一个对话框，并在用户同意后才退出程序。\n\
  \n当用户尝试关闭窗口时，`JFrame` 对象是 `WindowEvent` 的源。如果你想捕获该事件，必须有一个相应的监听器并将其添加到框架的窗口监听器列表中。\n\
  \n```\nWindowListener listener = . . .;\nframe.addWindowListener(listener);\n```\n\
  \n窗口监听器必须是实现 `WindowListener` 接口的类的对象。`WindowListener` 实际上有七个方法。框架会在窗口可能发生的七种不同事件时调用这些方法。这些名称一言而懂，除了“iconified”在\
  \ Windows 下通常被称为“minimized”。这里是完整的 `WindowListener` 接口：\n\n```java\npublic interface\
  \ WindowListener {\n    void windowOpened(WindowEvent e);\n    void windowClosing(WindowEvent\
  \ e);\n    void windowClosed(WindowEvent e);\n    void windowIconified(WindowEvent\
  \ e);\n    void windowDeiconified(WindowEvent e);\n    void windowActivated(WindowEvent\
  \ e);\n    void windowDeactivated(WindowEvent e);\n}\n```\n\n\n\n\n当然，我们可以定义一个实现接口的类，在\
  \ `windowClosing` 方法中添加对 `System.exit(0)` 的调用，并为其他六个方法编写空函数。然而，为六个无任何操作的方法编写代码是那种没人喜欢的枯燥重复工作。为了简化这项任务，每个包含多个方法的\
  \ AWT 监听器接口都带有一个相应的*适配器**adapter*）类，该类实现了接口中的所有方法，但对这些方法不执行任何操作。例如，`WindowAdapter`\
  \ 类拥有七个空方法。你通过扩展该适配器类来为接口中的某些（但不是所有）事件类型指定所需的响应。（对于像 `ActionListener` 这样只有一个方法的接口，则不需要适配器类。）\n\
  \n以下是我们如何定义一个重写了 `windowClosing` 方法的窗口监听器：\n\n```\nclass Terminator extends WindowAdapter\
  \ {\n    public void windowClosing(WindowEvent e) {\n        if (user agrees)\n\
  \            System.exit(0);\n    }\n}\n```\n\n现在，你可以将 `Terminator` 类型的对象注册为事件监听器：\n\
  \n```\nvar listener = new Terminator();\nframe.addWindowListener(listener);\n```\n\
  \n如今，人们会将 `WindowListener` 接口的空方法实现为默认方法（default methods）。然而，Swing 在默认方法出现很多年前就已经发明了。\n\
  \n`java.awt.event.WindowListener` 1.1\n\n* `void windowOpened(WindowEvent e)`\n\
  \    在窗口打开后被调用。\n\n* `void windowClosing(WindowEvent e)`\n    当用户向窗口管理器发出关闭窗口命令时被调用。注意，只有当调用了\
  \ `hide` 或 `dispose` 方法时，窗口才会关闭。\n\n* `void windowClosed(WindowEvent e)`\n    在窗口关闭后被调用。\n\
  \n* `void windowIconified(WindowEvent e)`\n    在窗口被最小化后被调用。\n\n* `void windowDeiconified(WindowEvent\
  \ e)`\n    在窗口恢复最小化后被调用。\n\n* `void windowActivated(WindowEvent e)`\n    在窗口变为激活后被调用。只有帧或对话框可以是激活状态。通常，窗口管理器会对激活的窗口进行装饰——例如，通过高亮标题栏。\n\
  \n* `void windowDeactivated(WindowEvent e)`\n    在窗口变为非激活后被调用。\n\n`java.awt.event.WindowStateListener`\
  \ 1.4\n\n* `void windowStateChanged(WindowEvent event)`\n    在窗口最大化、最小化或恢复后被调用。\n\
  \n### Actions\n\n如今，人们会将 `WindowListener` 接口的空方法实现为默认方法。然而，Swing 在默认方法出现很多年前就已经发明了。\n\
  \n使用 `Action` 接口来处理事件是常见的做法。一个 `Action` 不仅仅是一个 `ActionListener`；它还可以携带额外信息，如名称、图标和助记键（mnemonic）。这使得同一个操作可以用于按钮和菜单项，无论它是通过点击还是键盘快捷键触发的。\n\
  \n`Action` 接口提供了以下方法来管理这些属性：\n\n```java\nvoid actionPerformed(ActionEvent e);\n\
  boolean isEnabled();\nvoid setEnabled(boolean b);\nString getActionName();\nvoid\
  \ setActionName(String name);\nIcon getSmallIcon();\nvoid setSmallIcon(Icon icon);\n\
  void setMnemonic(int mnemonic);\n```\n\n\n\n该构造函数从动作（action）中读取名称和图标，将短描述设置为工具提示（tooltip），并将该动作设置为监听器。你可以在图\
  \ 10.15 中看到图标和工具提示。\n\n正如下一章所示，向菜单中添加相同的动作同样简单。\n\n![Figure](img/actiontest.jpg)图\
  \ 10.15：按钮显示了来自动作对象的图标。\n\n最后，我们想将动作对象添加到按键（keystrokes）中，以便当用户输入键盘命令时执行相应的动作。要将动作与按键关联，你首先需要生成\
  \ `KeyStroke` 类的对象。这个便利类封装了按键的描述。要生成 `KeyStroke` 对象，不要调用构造函数，而要使用 `KeyStroke` 类的静态方法\
  \ `getKeyStroke`。\n\n```\nKeyStroke ctrlBKey = KeyStroke.getKeyStroke(\"ctrl B\"\
  );\n```\n\n为了理解下一步，你需要理解键盘焦点（keyboard focus）的概念。用户界面可以有许多按钮、菜单、滚动条和其他组件。当你按下一个按键时，它会被发送到拥有焦点的组件。该组件通常（但并非总是）在视觉上有所区分。例如，在\
  \ Java 外观和体中，拥有焦点的按钮在文本周围有一个细细的矩形边框。你可以使用 Tab 键在组件之间移动焦点。当你按下空格键时，拥有焦点的按钮会被点击。其他键执行不同的动作；例如，方向键可以移动滚动条。\n\
  \n然而，在我们的情况下，我们并不希望将按键发送给拥有焦点的组件。否则，每个按钮都需要知道如何处理 Ctrl+Y、Ctrl+B 和 Ctrl+R 键。\n\n\
  这是一个常见问题，Swing 设计者提供了一个方便的解决方案。每个 `JComponent` 都有三个输入映射（input maps），每个映射将 `KeyStroke`\
  \ 对象映射到相关的动作。这三个输入映射对应于三个不同的条件（见表 10.2）。\n\n表 10.2：输入映射条件\n\n| 标记 | 动作 |\n| ---\
  \ | --- |\n| `WHEN_FOCUSED` | 当此组件拥有键盘焦点时 |\n| `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT`\
  \ | 当此组件包含拥有键盘焦点的组件时 |\n| `WHEN_IN_FOCUSED_WINDOW` | 当此组件与拥有键盘焦点的组件位于同一个窗口内时 |\n\
  \n按键处理按以下顺序检查这些映射：\n\n1. 检查具有输入焦点的组件的 `WHEN_FOCUSED` 映射。如果按键存在且对应的动作已启用，则执行该动作并停止处理。\n\
  2. 从拥有焦点的组件开始，检查其父组件的 `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT` 映射。一旦发现带有按键且对应的已启用动作的映射，立即执行该动作并停止处理。\n\
  3. 查看具有输入焦点的窗口中所有可见且启用的组件，这些组件在 `WHEN_IN_FOCUSED_WINDOW` 映射中注册了该按键。给这些组件（按照按键注册的顺序）一个执行相应动作的机会。一旦第一个启用的动作被执行，立即停止处理。\n\
  \n要从组件获取输入映射，请使用 `getInputMap` 方法。这里是一个示例：\n\n```\nInputMap imap = panel.getInputMap(JComponent.WHEN_FOCUSED);\n\
  ```\n\n`WHEN_FOCUSED` 条件意味着当当前组件拥有键盘焦点时会查询此映射。在我们的情况下，那并不是我们想要的映射。是其中一个按钮而不是面板拥有了输入焦点。另外两个映射选择中的任何一个都可以用于插入颜色更改按键。我们在示例程序中使用\
  \ `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT`。\n\n`InputMap` 并不直接将 `KeyStroke` 对象映射到 `Action`\
  \ 对象。相反，它映射到任意对象，而一个由 `ActionMap` 类实现的第二个映射则将对象映射到动作。这使得在来自不同输入映射的按键之间共享相同的动作变得更容易。\n\
  \n因此，每个组件都有三个输入映射和一个动作映射。为了将它们连接起来，你为为动作命名。以下是你可以将按键绑定到动作的方法：\n\n```\nimap.put(KeyStroke.getKeyStroke(\"\
  ctrl Y\"), \"panel.yellow\");\nActionMap amap = panel.getActionMap();\namap.put(\"\
  panel.yellow\", yellowAction);\n```\n\n习惯上使用字符串 `\"none\"` 作为无操作动作（do-nothing action）。这使得停用某个按键变得容易：\n\
  \n```\nimap.put(KeyStroke.getKeyStroke(\"ctrl C\"), \"none\");\n```\n\nJDK 文档建议使用动作名称作为动作的键。我不认为这是一个好主意。动作名称显示在按钮和菜单项上；因此，它可以根据\
  \ UI 设计师的心意改变，并可能被翻译成多种语言。这种不稳定的字符串是查找键的糟糕选择，因此我建议你设计与显示名称无关的动作名称。\n\n总结一下，为了响应按钮、菜单项或按键执行相同的动作，你需要执行以下操作：\n\
  \n1. 实现一个继承 `AbstractAction` 类的类。你可能对多个相关动作使用同一个类。\n2. 构造动作类的对象。\n3. 从动作对象构造按钮或菜单项。构造函数从动作对象中读取标签和图标。\n\
  4. 对于通过按键触发的动作，你需要执行额外的步骤。首先，定位包含所有组件的顶级组件。\n5. 然后，获取顶级组件的 `WHEN_ANCESTOR_OF_FOCUSED_COMPONENT`\
  \ 输入映射。为所需的按键创建一个 `KeyStroke` 对象。创建一个描述动作的动作键，例如字符串。将键对（按键, 动作键）添加到映射中。\n6. 最后，获取顶级组件的动作映射。将键对（动作键,\
  \ 动作对象）添加到映射中。\n\njavax.swing.Action12\n\n* `boolean isEnabled()`\n* `void setEnabled(boolean\
  \ b)`\n  获取或设置此动作的`enabled`属性。\n* `void putValue(String key, Object value)`\n  在动作对象中放置键值对。键可以是任何字符串，但某些名称具有定义的含义——见\
  \ .\n* `Object getValue(String key)`\n  返回存储的键值对的值。\n\njavax.swing.KeyStroke12\n\
  \n* `static KeyStroke getKeyStroke(String description)`\n  从人类可读描述（空白分隔的字符串序列）构造按键。描述以零或多个修饰符（`shift`,\
  \ `control`, `ctrl`, `meta`, `alt`, `altGraph`）开头，以字符串 `typed` 后跟一个单字符字符串（例如 `\"\
  typed a\"`），或可选的事件指定符（`pressed` 或 `released`，以 `pressed` 为默认），后跟一个键码。键码在带有缀 `VK_`\
  \ 时应对应于 `KeyEvent` 常量；例如，`\"INSERT\"` 对应 `KeyEvent.VK_INSERT`。\n\njavax.swing.JComponent12\n\
  \n* `ActionMap getActionMap()`\n  返回将动作键（可以是任意对象）与 `Action` 对象关联的映射。\n* `InputMap\
  \ getInputMap(int flag)`\n  获取将按键映射到动作键的输入映射。标记是 . 中的值之一。\n\n### 10.4.6 鼠标事件\n\n\
  如果你只想让用户点击按钮或菜单，就不需要处理鼠标事件。这些鼠标操作由用户界面中的组件内部处理。然而，如果你想允许用户使用鼠标绘画，你需要捕捉鼠标移动、点击和拖拽事件。\n\
  \n在本节中，我将向你展示一个简单的图形编辑器应用程序，允许用户在画布上放置、移动和擦除正方形（见图 10.16）。\n\n\n\n\n当用户点击鼠标按钮时，会调用三个监听器方法：在鼠标首次按下时调用\
  \ `mousePressed`，在释放鼠标时调用 `mouseReleased`，最后调用 `mouseClicked`。如果你只对完整的点击感兴趣，可以忽略前两个方法。通过使用\
  \ `MouseEvent` 参数上的 `getX` 和 `getY` 方法，你可以获取鼠标点击时鼠标指针的 `x` 和 `y` 坐标。要区分单击、双击和三击（!），请使用\
  \ `getClickCount` 方法。\n\n在我们的示例程序中，我们同时提供了 `mousePressed` 和 `mouseClicked` 方法。当你点击不在任何已绘制的正方形内部的像素时，会添加一个新的正方形。我们将此功能实现在\
  \ `mousePressed` 方法中，这样用户就能获得即时反馈，而不需要等待鼠标按钮释放。当用户在现有正方形内双击时，该正方形会被擦除。我们将此功能实现在\
  \ `mouseClicked` 方法中，因为我们需要点击计数。\n\n```java\npublic void mousePressed(MouseEvent\
  \ event) {\n    current = find(event.getPoint());\n    if (current == null) // 不在正方形内部\n\
  \        add(event.getPoint());\n}\n\npublic void mouseClicked(MouseEvent event)\
  \ {\n    current = find(event.getPoint());\n    if (current != null && event.getClickCount()\
  \ >= 2)\n        remove(current);\n}\n```\n\n当鼠标在窗口上移动时，窗口会接收到持续的鼠标移动事件。请注意，存在独立的\
  \ `MouseListener` 和 `MouseMotionListener` 接口。这样做是为了效率考虑——当用户移动鼠标时，会产生大量的鼠标事件，而一个只关心鼠标点击的监听器不会被不需要的鼠标移动所干扰。\n\
  \n我们的测试应用程序捕获鼠标移动事件，以便鼠标悬停在正方形上方并将光标变为不同的形状（十字准）。这是通过 `Cursor` 类的 `getPredefinedCursor`\
  \ 方法实现的。表 10.3 列出了配合此方法使用的常量，以及这些光标在 Windows 下的外。\n\n表 10.3：示例光标形状\n\n| 图标 | 常量\
  \ | 图标 | 常量 |\n| --- | --- | --- | --- |\n| ![.jpg](img/351fig01.jpg) | `DEFAULT_CURSOR`\
  \ | ![.jpg](img/351fig08.jpg) | `NE_RESIZE_CURSOR` |\n| ![.jpg](img/351fig02.jpg)\
  \ | `CROSSHAIR_CURSOR` | ![.jpg](img/351fig09.jpg) | `E_RESIZE_CURSOR` |\n| ![.jpg](img/351fig03.jpg)\
  \ | `HAND_CURSOR` | ![.jpg](img/351fig10.jpg) | `SE_RESIZE_CURSOR` |\n| ![.jpg](img/351fig04.jpg)\
  \ | `MOVE_CURSOR` | ![.jpg](img/351fig07.jpg) | `S_RESIZE_CURSOR` |\n| ![.jpg](img/351fig05.jpg)\
  \ | `TEXT_CURSOR` | ![.jpg](img/351fig08.jpg) | `SW_RESIZE_CURSOR` |\n| ![.jpg](img/351fig06.jpg)\
  \ | `WAIT_CURSOR` | ![.jpg](img/351fig09.jpg) | `W_RESIZE_CURSOR` |\n| ![.jpg](img/351fig07.jpg)\
  \ | `N_RESIZE_CURSOR` | ![.jpg](img/351fig10.jpg) | `NW_RESIZE_CURSOR` |\n\n以下是示例程序中\
  \ `MouseMotionListener` 的 `mouseMoved` 方法：\n\n```java\npublic void mouseMoved(MouseEvent\
  \ event) {\n    if (find(event.getPoint()) == null)\n        setCursor(Cursor.getDefaultCursor());\n\
  \    else\n        setCursor(Cursor.getPredefinedCursor(Cursor.CROSSHAIR_CURSOR));\n\
  }\n```\n\n如果用户在鼠标移动时按下鼠标按钮，生成的将是 `mouseDragged` 调用而不是 `mouseMoved` 调用。我们的测试应用程序允许用户拖动光标下的正方形。我们只需更新当前正在动的矩形，使其位于鼠标位置的正下方中心。然后，我们重绘画布以显示新的鼠标位置。\n\
  \n```java\npublic void mouseDragged(MouseEvent event) {\n    if (current != null)\
  \ {\n        int x = event.getX();\n        int y = event.getY();\n\n        current.setFrame(x\
  \ - SIDELENGTH / 2, y - SIDELENGTH / 2, SIDELENGTH, SIDELENGTH);\n        repaint();\n\
  \    }\n}\n```\n\n`mouseMoved` 方法只有在鼠标留在组件内部时才会被调用。然而，即使鼠标被拖到组件外部，`mouseDragged`\
  \ 方法仍会不断被调用。还有两个鼠标事件方法：`mouseEntered` 和 `mouseExited`。这些方法在鼠标进入或离开组件时被调用。\n\n最后，让我们看看如何监听鼠标事件。鼠标点击通过\
  \ `mouseClicked` 方法报告，该方法是 `MouseListener` 接口的一部分。许多应用程序对鼠标点击感兴趣而不对鼠标移动感兴趣由于鼠标移动事件发生非常频繁，鼠标移动和拖拽事件定义在一个名为\
  \ `MouseMotionListener` 的独立接口中。\n\n在我们的程序中，对这两类鼠标事件都感兴趣。我们定义了两个内部类：`MouseHandler`\
  \ 和 `MouseMotionHandler`。`MouseHandler` 类扩展了 `MouseAdapter` 类，因为它只定义了五个 `MouseListener`\
  \ 方法中的两个（`MouseAdapter` 类将所有方法都定义为什么都不做的）。`MouseMotionHandler` 实现了 `MouseMotionListener`\
  \ 并实现了该接口的两个方法。列表 10.7 是程序列表。\n\n代码列表 10.7 v2ch10/mouse/MouseComponent.java\n\n\n\
  \n\n\n```java\npackage v2ch10.mouse;\n\nimport module java.base;\nimport module\
  \ java.desktop;\nimport java.awt.event.MouseEvent;\n\n/**\n * 用于添加和删除正方形的鼠标操作组件。\n\
  \ */\npublic class MouseComponent extends JComponent {\n    private static final\
  \ int DEFAULT_WIDTH = 300;\n    private static final int DEFAULT_HEIGHT = 200;\n\
  \n    private static final int SIDELENGTH = 10;\n    private ArrayList<Rectangle2D>\
  \ squares;\n    private Rectangle2D current; // 包含鼠标光标的正方形\n\n    public MouseComponent()\
  \ {\n        squares = new ArrayList<>();\n        current = null;\n\n        addMouseListener(new\
  \ MouseHandler());\n        addMouseMotionListener(new MouseMotionHandler());\n\
  \    }\n\n    public Dimension getPreferredSize() {\n        return new Dimension(DEFAULT_WIDTH,\
  \ DEFAULT_HEIGHT);\n    }\n\n    public void paintComponent(Graphics g) {\n    \
  \    var g2 = (Graphics2D) g;\n\n        // 绘制所有正方形\n        for (Rectangle2D r\
  \ : squares)\n            g2.draw(r);\n    }\n\n    /**\n     * 找到包含某点的第一个正方形。\n\
  \     * @param p 点\n     * @return 包含 p 的第一个正方形\n     */\n    public Rectangle2D\
  \ find(Point2D p) {\n        for (Rectangle2D r : squares) {\n            if (r.contains(p))\
  \ return r;\n        }\n        return null;\n    }\n\n    /**\n     * 向集合中添加一个正方形。\n\
  \     * @param p 正方形的中心\n     */\n    public void add(Point2D p) {\n        double\
  \ x = p.getX();\n        double y = p.getY();\n\n        current = new Rectangle2D.Double(x\
  \ - SIDELENGTH / 2, y - SIDELENGTH / 2, SIDELENGTH,\n                SIDELENGTH);\n\
  \        squares.add(current);\n        repaint();\n    }\n\n    /**\n     * 从集合中删除一个正方形。\n\
  \     * @param s 要删除的正方形\n     */\n    public void remove(Rectangle2D s) {\n   \
  \     if (s == null) return;\n        if (s == current) current = null;\n      \
  \  squares.remove(s);\n        repaint();\n    }\n\n    private class MouseHandler\
  \ extends MouseAdapter {\n        public void mousePressed(MouseEvent event) {\n\
  \            // 如果光标不在正方形内部，则添加新正方形\n            current = find(event.getPoint());\n\
  \            if (current == null) add(event.getPoint());\n        }\n\n        public\
  \ void mouseClicked(MouseEvent event) {\n            // 如果双击，则删除当前正方形\n        \
  \    current = find(event.getPoint());\n            if (current != null && event.getClickCount()\
  \ >= 2) remove(current);\n        }\n    }\n\n    private class MouseMotionHandler\
  \ implements MouseMotionListener {\n        public void mouseMoved(MouseEvent event)\
  \ {\n            // 如果鼠标光标在矩形内，将光标设置为交叉准星\n\n            if (find(event.getPoint())\
  \ == null)\n                setCursor(Cursor.getDefaultCursor());\n            else\n\
  \                setCursor(Cursor.getPredefinedCursor(Cursor.CROSSHAIR_CURSOR));\n\
  \        }\n\n        public void mouseDragged(MouseEvent event) {\n           \
  \ if (current != null) {\n                int x = event.getX();\n              \
  \  int y = event.getY();\n\n                // 拖动当前矩形使其中心对齐 (x, y)\n           \
  \     current.setFrame(x - SIDELENGTH / 2, y - SIDELENGTH / 2, SIDELENGTH,\n   \
  \                     SIDELENGTH);\n                repaint();\n            }\n\
  \        }\n    }\n}\n```\n\n`java.awt.event.MouseEvent` 1.1\n\n* `int getX()`\n\
  * `int getY()`\n* `Point getPoint()`\n\n返回事件发生点的 `x`（水平）和 `y`（垂直）坐标，该坐标是从事件源组件的左上角测量的。\n\
  \n* `int getClickCount()`\n\n返回与此事件关联的连续鼠标点击次数。（构成“连续”的时间间隔取决于系统。）\n\n`java.awt.Component`\
  \ 1.0\n\n* `public void setCursor(Cursor cursor)` 1.1\n\n将光标图像设置为指定的指定的光标。\n\n###\
  \ 10.4.7. AWT 事件层次结构\n\n`EventObject` 类有一个子类 `AWTEvent`，它是所有 AWT 事件类的父类。图 10.17\
  \ 显示了 AWT 事件的继承图。\n\n.图 10.17：AWT 事件类的继承图\n\n某些 Swing 组件会生成更多类型的事件对象；这些类直接继承自 `EventObject`，而不是\
  \ `AWTEvent`。\n\n事件对象封装了事件源向其监听器通信的事件信息。需要时，你可以分析传递给监听器对象的事件对象，就像我们在按钮示例中使用 `getSource`\
  \ 和 `getActionCommand` 方法做的那样。\n\n某些 AWT 事件类对 Java 程序员来说没有实际用途。例如，AWT 会将 `PaintEvent`\
  \ 对象插入事件队列，但这些对象不会传递给监听器。Java 程序员并不监听绘制事件；相反，他们通过重写 `paintComponent` 方法来控制重绘。AWT\
  \ 还会生成许多事件\n\nAWT 在低级事件和语义事件之间做了有用的区分。语义事件表达用户正在做什么，例如点击按钮、选择菜单项或在文本字段中输入。低级事件是提供输入的事件，例如按键按下或释放或鼠标移动。这里是\
  \ `java.awt.event` 包中最常用的事件类：\n\n* `ActionEvent`（按钮点击）\n* `AdjustmentEvent`（用户调整滚动条）\n\
  * `ItemEvent`（用户进行了选择）\n* `FocusEvent`（组件获得或失去焦点）\n* `KeyEvent`（键按下或释放）\n* `MouseEvent`（鼠标按钮按下、释放、移动或拖动）\n\
  * `MouseWheelEvent`（鼠标轮旋转）\n* `WindowEvent`（窗口状态改变）\n\n表 10.4 显示了最重要的 AWT 监听器、事件和源。\n\
  \n表 10.4：事件处理摘要\n\n| 接口 | 方法 | 参数/访问器 | 生成自 |\n| --- | --- | --- | --- |\n| `ActionListener`\
  \ | `actionPerformed` | `ActionEvent` | `getActionCommand`, `getModifiers` | `AbstractButton`,\
  \ `JComboBox`, `JTextField`, `Timer` |\n| `AdjustmentListener` | `adjustmentValueChanged`\
  \ | `AdjustmentEvent` | `getAdjustable`, `getAdjustmentType`, `getValue` | `JScrollbar`\
  \ |\n| `ItemListener` | `itemStateChanged` | `ItemEvent` | `getItem`, `getItemSelectable`,\
  \ `getStateChange` | `AbstractButton`, `JComboBox` |\n| `FocusListener` | `focusGained`,\
  \ `focusLost` | `FocusEvent` | `isTemporary` | `Component` |\n| `KeyListener` |\
  \ `keyPressed`, `keyReleased`, `keyTyped` | `KeyEvent` | `getKeyChar`, `getKeyCode`,\
  \ `getKeyModifiersText`, `getKeyText`, `isActionKey` | `Component` |\n| `MouseListener`\
  \ | `mousePressed`, `mouseReleased`, `mouseEntered`, `mouseExited`, `mouseClicked`\
  \ | `MouseEvent` | `getClickCount`, `getX`, `getY`, `getPoint`, `translatePoint`\
  \ | `Component` |\n| `MouseMotionListener` | `mouseDragged`, `mouseMoved` | `MouseEvent`\
  \ | `Component` |\n| `MouseWheelListener` | `mouseWheelMoved` | `MouseWheelEvent`\
  \ | `getWheelRotation`, `getScrollAmount` | `Component` |\n| `WindowListener` |\
  \ `windowClosing`, `windowOpened`, `windowIconified`, `windowDeiconified`, `windowClosed`,\
  \ `windowActivated` | | | `Component` |\n\n\n\n\n\n| `windowDeactivated` | `WindowEvent`\
  \ |\n| :--- | :--- |\n| `getWindow` | `Window` |\n| `WindowFocusListener` | `windowGainedFocus`,\
  \ `windowLostFocus` | `WindowEvent` |\n| `getOppositeWindow` | `Window` |\n| `WindowStateListener`\
  \ | `windowStateChanged` | `WindowEvent` |\n| `getOldState`, `getNewState` | `Window`\
  \ |\n\n## 10.5. The Preferences API\n\n我将通过对 `java.util.prefs` API 的讨论来结束本章。在桌面程序中，你通常希望存储用户偏好设置，例如用户处理过的最后一个文件、上窗口位置等。\n\
  \n正如你在第一卷第 9 章中所看到的，`Properties` 类使得加载和保存程序的配置信息变得非常简单。然而，使用属性文件有以下缺点：\n\n*   某些操作系统没有“主目录”（home\
  \ directory）的概念，这使得很难为配置文件找到一个统一的位置。\n*   配置文件的命名没有标准规范，增加了用户安装多个 Java 应用程序时发生名称冲突的概率。\n\
  \n某些操作系统拥有配置信息的中央存储库。最著名的例子是 Microsoft Windows 中的注册表。`Preferences` 类以平台无关的方式提供了这样一个中央存储库。在\
  \ Windows 中，`Preferences` 类使用注册表进行存储；而在 Linux 上，信息存储在本地文件系统中。当然，存储库的实现对于使用 `Preferences`\
  \ 程序员来说是透明的。\n\n`Preferences` 存储库具有树形结构，节点路径名称如 `/com/mycompany/myapp.`。与包名一样，只要程序员以反向域名开头路径，就可以避免名称冲突。事实上，该\
  \ API 的设计者建议配置节点路径与你程序中的包名匹配。\n\n存储库中的每个节点都有一个独立的键值对表，你可以用它存储数字、字符串或字节数组。该 API 未提供存储可序列化对象的规定。API\
  \ 设计者认为序列化格式对于长期存储来说太脆弱了。当然，如果你不同意，可以将序列化对象保存在字节数组中。\n\n为了增加灵活性，存在多个并行的树。每个程序用户拥有一棵树；还有一个被称为“系统树”的树，适用于所有用户的共同设置。`Preferences`\
  \ 类使用操作系统对“当前用户”的概念来访问相应的用户树。\n\n要访问树中的节点，从用户根或系统根开始：\n\n```\nPreferences root =\
  \ Preferences.userRoot();\n```\n\n或者\n\n```\nPreferences root = Preferences.systemRoot();\n\
  ```\n\n然后访问该节点。你可以直接提供节点路径名称：\n\n```\nPreferences node = root.node(\"/com/mycompany/myapp\"\
  );\n```\n\n一个方便的快捷方法可以获取路径名等于类名的节点。只需获取该类的对象并调用：\n\n```\nPreferences node = Preferences.userNodeForPackage(obj.getClass());\n\
  ```\n\n或者\n\n```\nPreferences node = Preferences.systemNodeForPackage(obj.getClass());\n\
  ```\n\n通常，`obj` 将是 `this` 引用。\n\n一旦获得节点，你可以使用以下方法访问键值表：\n\n```\nString get(String\
  \ key, String def)\nint getInt(String key, int def)\nlong getLong(String key, long\
  \ def)\nfloat getFloat(String key, float def)\ndouble getDouble(String key, double\
  \ def)\nboolean getBoolean(String key, boolean def)\nbyte[] getByteArray(String\
  \ key, byte[] def)\n```\n\n注意，在读取信息时必须指定一个默认值，以防存储库数据不可用。需要默认值有几个原因：数据可能缺失是因为用户从未指定过偏好；某些资源受限的平台可能没有存储库；移动设备可能临时与存储库断开。\n\
  \n相反，你可以使用 `put` 方法将数据写入存储库，例如：\n\n```\nput(String key, String value)\nputInt(String\
  \ key, int value)\n```\n\n以此此类推。\n\n你可以使用方法列出节点中存储的所有键：\n\n```\nString[] keys()\n\
  ```\n\n目前还没有方法可以找到特定键的值类型。\n\n节点名称和键限制为 80 个字符，字符串值限制为 8,192 个字符。\n\nWindows 注册表等中央存储库传统上面临两个问题：\n\
  \n*   它们变成充满过时信息的“垃圾场”。\n*   配置数据纠留在存储库中，使得将偏好迁移到新平台变得困难。\n\n`Preferences` 类为第二个问题提供了解决方案。你可以通过调用以下方法导出子树（或较少见的单个节点）的偏好：\n\
  \n```\nvoid exportSubtree(OutputStream out)\nvoid exportNode(OutputStream out)\n\
  ```\n\n数据以 XML 格式保存。你可以通过调用方法将它们导入另一个存储库：\n\n```\nvoid importPreferences(InputStream\
  \ in)\n```\n\n这是一个示例文件：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
  <!DOCTYPE preferences SYSTEM \"http://java.sun.com/dtd/preferences.dtd\">\n<preferences\
  \ EXTERNAL_XML_VERSION=\"1.0\">\n   <root type=\"user\">\n      <map/>\n      <node\
  \ name=\"com\">\n         <map/>\n         <node name=\"horstmann\">\n         \
  \   <map/>\n            <node name=\"corejava\">\n               <map>\n       \
  \     <entry key=\"height\" value=\"200.0\"/>\n            <entry key=\"left\" value=\"\
  1027.0\"/>\n            <entry key=\"filename\" value=\"/home/cay/books/cj11/code/v1ch11/raven.html\"\
  />\n            <entry key=\"top\" value=\"380.0\"/>\n            <entry key=\"\
  width\" value=\"300.0\"/>\n               </map>\n            </node>\n        </node>\n\
  \      </node>\n   </root>\n</preferences>\n```\n\n如果你的程序使用了偏好设置，你应该给用户提供导出和导入的机会，这样他们就可以轻松地将设置从一台计算机迁移到另一台。。列表\
  \ 10.8 中的程序演示了这种技术。该程序只需保存窗口位置和最后加载的文件名。尝试调整窗口大小，导出偏好，移动窗口，退出并重启应用程序。窗口将与你退出时完全一样。导入偏好，窗口将恢复到之前的位置。\n\
  \nListing 10.8 v2ch10/preferences/ImageViewer.java\n\n\n\n\n\n```java\npackage v2ch10.preferences;\n\
  \nimport module java.base;\nimport module java.desktop;\nimport module java.prefs;\n\
  \n/**\n * 一个测试偏好设置的程序。程序会记住帧的位置、大小以及\n * 最后选择的文件。\n */\nclass ImageViewer {\n  \
  \  void main() {\n        EventQueue.invokeLater(() -> {\n            var frame\
  \ = new ImageViewerFrame();\n            frame.setTitle(\"ImageViewer\");\n    \
  \        frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n            frame.setVisible(true);\n\
  \        });\n    }\n}\n\n/**\n * 一个从用户偏好中恢复位置、大小和图片，并在退出时更新 偏好的图像查看器。\n */\nclass\
  \ ImageViewerFrame extends JFrame {\n    private static final int DEFAULT_WIDTH\
  \ = 300;\n    private static final int DEFAULT_HEIGHT = 200;\n    private String\
  \ image;\n\n    public ImageViewerFrame() {\n        Preferences root = Preferences.userRoot();\n\
  \        Preferences node = root.node(\"/com/horstmann/corejava/ImageViewer\");\n\
  \        // 从属性中获取位置、大小、标题\n        int left = node.getInt(\"left\", 0);\n     \
  \   int top = node.getInt(\"top\", 0);\n        int width = node.getInt(\"width\"\
  , DEFAULT_WIDTH);\n        int height = node.getInt(\"height\", DEFAULT_HEIGHT);\n\
  \        setBounds(left, top, width, height);\n        image = node.get(\"image\"\
  , null);\n        var label = new JLabel();\n        if (image != null) label.setIcon(new\
  \ ImageIcon(image));\n\n        addWindowListener(new WindowAdapter() {\n      \
  \      public void windowClosing(WindowEvent event) {\n                node.putInt(\"\
  left\", getX());\n                node.putInt(\"top\", getY());\n              \
  \  node.putInt(\"width\", getWidth());\n                node.putInt(\"height\",\
  \ getHeight());\n                if (image != null) node.put(\"image\", image);\n\
  \            }\n        });\n\n        // 使用 label 显示图片\n        add(label);\n\n\
  \        // 设置文件选择器\n        var chooser = new JFileChooser();\n        chooser.setCurrentDirectory(new\
  \ File(\".\"));\n\n        // 设置菜单栏\n        var menuBar = new JMenuBar();\n   \
  \     setJMenuBar(menuBar);\n\n        var menu = new JMenu(\"File\");\n       \
  \ menuBar.add(menu);\n\n        var openItem = new JMenuItem(\"Open\");\n      \
  \  menu.add(openItem);\n        openItem.addActionListener(_ -> {\n            //\
  \ 显示文件选择对话框\n            int result = chooser.showOpenDialog(null);\n\n        \
  \    // 如果选择了文件，将其设为 label 的图标\n            if (result == JFileChooser.APPROVE_OPTION)\
  \ {\n                image = chooser.getSelectedFile().getPath();\n            \
  \    label.setIcon(new ImageIcon(image));\n            }\n        });\n\n      \
  \  var exitItem = new JMenuItem(\"Exit\");\n        menu.add(exitItem);\n      \
  \  exitItem.addActionListener(_ -> System.exit(0));\n    }\n}\n```\n\n`java.util.prefs.Preferences`\
  \ 1.4\n\n- `Preferences userRoot()`\n  返回调用该程序的用户的偏好根节点。\n\n- `Preferences systemRoot()`\n\
  \  返回系统级的根偏好节点。\n\n- `Preferences node(String path)`\n  返回一个可以通过给定路径从当前节点到达的节点。如果\
  \ `path` 是绝对路径（即以 `/` 开头），则该节点从包含此偏好节点的树根开始定位。如果不存在给定路径的节点，则创建它。\n\n- `Preferences\
  \ userNodeForPackage(Class cl)`\n\n- `Preferences systemNodeForPackage(Class cl)`\n\
  \  返回当前用户树或系统树中的一个节点，其绝对节点路径与类 `cl` 的包名对应。\n\n- `String[] keys()`\n  返回属于此节点的所有键。\n\
  \n- `String get(String key, String def)`\n\n- `int getInt(String key, int def)`\n\
  \n- `long getLong(String key, long def)`\n\n- `float getFloat(String key, float\
  \ def)`\n\n- `double getDouble(String key, double def)`\n\n- `boolean getBoolean(String\
  \ key, boolean def)`\n\n- `byte[] getByteArray(String key, byte[] def)`\n  返回与给定键关联的值——如果该键没有关联的值、或者关联的值类型不正确，或者偏好存储不可用，则返回提供的默认值。\n\
  \n- `void put(String key, String value)`\n\n- `void putInt(String key, int value)`\n\
  \n- `void putLong(String key, long value)`\n\n- `void putFloat(String key, float\
  \ value)`\n\n- `void putDouble(String key, double value)`\n\n- `void putBoolean(String\
  \ key, boolean value)`\n\n- `void putByteArray(String key, byte[] value)`\n  在此节点中存储一个键/值对。\n\
  \n- `void exportSubtree(OutputStream out)`\n  将此节点及其子节点的偏好写入指定的流中。\n\n- `void exportNode(OutputStream\
  \ out)`\n  将此节点的偏好（但不包括其子节点）写入指定的流中。\n\n- `void importPreferences(InputStream in)`\n\
  \  导入指定流包含的偏好。\n\n到此，我们对图形用户界面编程的介绍结束。下一章将向你展示如何使用常用的 Swing 组件。\n\n# 第 11 章 ▪ 使用\
  \ Swing 构建用户界面组件\n\n上一章主要是为了向你展示如何使用 Java 中的事件模型。本章将向你展示如何操作最常用的 Swing 组件。\n\n##\
  \ 11.1 Swing 与模型视图控制器\n\n上一章主要是为了向你展示如何使用 Java 中的事件模型。在这个过程中，你已经迈向了学习构建图形用户界面的第一步。本章将向你展示构建功能强大的\
  \ GUI 所需的最工具。\n\n我们将从 Swing 的架构基础开始。了解“内部”原理对于有效地使用某些高级组件至关重要。然后我向你介绍 Swing 中常用的用户界面组件，如文本字段、菜单。接下来，你将学习如何使用布局管理器来安排这些组件。最后，你将看到如何在\
  \ Swing 中实现对话框。\n\n本章涵盖基本的 Swing 组件，如文本组件、按钮和滑动条。这些是你最频繁需要的用户界面组件。我们将在第 12 章 中介绍高级\
  \ Swing 组件。\n\n回退一步，思考构成按钮、复选框、文本字段或复杂的树控件的用户界面组件的部分。每个组件都有三个特征：\n\n- 其**内容**，例如按钮的状态（按下或未按下），或文本字段中的文本\n\
  \n- 其**视觉外观**（颜色、大小等）\n\n- 其**行为**（对事件的反应）\n\n即使是看似简单的组件，这些特征之间也存在着中等复杂的交互。显然，按钮的视觉外观取决于外观风格（look-feel）。此外，外观取决于按钮状态；当按钮被按下时，它需要重绘以显示不同。状态取决于按钮接收到的事件。当用户在按钮内部按下鼠标时，按钮就被按下了。\n\
  \n当然，当你从程序中使用按钮时，你仅仅将其看作一个*按钮*；你不会过多考虑它的内部机制和特征。这毕竟是那是实现按钮的程序员的工作。为了实现这一点，Swing\
  \ 的设计者转向了一种著名的设计模式：模型视图控制器（MVC）模式。这种设计模式告诉我们要提供三个独立的对象：\n\n- **模型**（model），存储内容\n\
  \n- **视图**（view），显示内容\n\n- **控制器**（controller），处理用户输入\n\n\n\n\n该模式精确地规定了这三个对象是如何相互作用的。模型存储内容且*没有用户界面*。对于按钮来说，内容非常微不足道——只是一小组标志位，告知按钮当前是按下状态还是弹起状态、激活状态还是非激活状态等。对于文本字段，内容就有点趣了。它是一个持有当前文本的字符串对象。这与内容的视图*不是一回事*——如果内容大于文本字段，用户只能看到显示的部分文本（参见图\
  \ 11.1）。\n\n.图 11.1: 文本字段的模型和视图\n\n模型必须实现更改内容以及发现内容是什么的方法。例如，文本模型具有在当前文本中添加或删除字符的方法，以及将当前文本作为字符串返回的方法。再次，请记住，模型是完全非视觉的。绘制模型中存储的数据是视图的任务。\n\
  \n“模型（model）”这个词可能并不恰当，因为我们经常将模型想成抽象概念的表示。汽车和飞机设计师建造模型来模拟真实的汽车和飞机。但在考虑模型-视图-控制器（MVC）模式时，这种类比实际上会误导你。在这种设计模式中，模型存储完整内容，而视图提供内容的（完整或不完整）视觉表示。一个更好的类比可能是为艺术家摆姿势的模特。观察模特并创建视图取决于艺术家。根据艺术家的不同，该视图可能是正式肖像、印象派绘画，或者是一幅肢体奇异扭曲的立体派画。\n\
  \n模型-视图-控制器模式的优势之一是模型可以拥有多个视图，每个视图显示完整内容的不同部分或方面。例如，HTML 编辑器可以提供相同内容的两个*同时*视图：所见即所得（WYSIWYG）视图和“原始标签”视图（参见图\
  \ 11.2）。当通过一个视图的控制器更新模型时，它会通知两个关联视图。当视图收到通知时，它们会自动刷新。当然，对于像按钮这样简单的用户界面组件，你不会拥有同一个模型的多个视图。\n\
  \n.图 11.2: 同一个模型的两个独立视图\n\n控制器处理用户输入事件，例如鼠标点击和按键触发。它然后决定是否将这些事件转换为模型或视图的变化。例如，如果用户在文本框中按下字符键，控制器会调用模型的“插入字符”命令。模型然后告诉视图更新自身。视图永远不知道文本为何改变。但如果用户按下光标键，控制器可能会告诉视图滚动。滚动视图对底层文本没有影响，因此模型永远不知道该事件的发生。\n\
  \n图 11.3 显示了模型、视图和控制器对象之间的交互。\n\n.图 11.3: 模型、视图和控制器对象之间的交互\n\n对于大多数 Swing 组件，模型类实现了一个以\
  \ `Model` 结尾的接口；在这种情况下，该接口被称为 `ButtonModel`。实现该接口的类可以定义各种按钮的状态。实际上按钮并没有那么复杂，Swing\
  \ 库包含一个名为 `DefaultButtonModel` 的类，实现了该接口。\n\n你可以通过查看 `ButtonModel` 接口的属性来了解按钮模型维护的数据类型——参见表\
  \ 11.1。\n\n表 11.1: `ButtonModel` 接口的属性\n\n| 属性名称 | 值 |\n| --- | --- |\n| `actionCommand`\
  \ | 与此按钮关联的操作命令字符串 |\n| `mnemonic` | 此按钮的键盘快捷键 |\n| `armed` | 如果按钮被按下且鼠标悬停在按钮上，则为\
  \ `true` |\n| `enabled` | 如果按钮可选，则为 `true` |\n| `pressed` | 如果按钮被按下但鼠标按钮尚未释放，则为\
  \ `true` |\n| `rollover` | 如果鼠标悬停在按钮上，则为 `true` |\n| `selected` | 如果按钮已开启，则为 `true`（用于复选框和单选框）\
  \ |\n\n每个 `JButton` 对象存储了一个你可以获取的按钮模型对象。\n\n```\nvar button = new JButton(\"Blue\"\
  );\nButtonModel model = button.getModel();\n```\n\n在实践中，你并不会关心这些——按钮状态的细节只对绘制它的视图感兴趣。所有重要信息——例如按钮是否被启用——都可以从\
  \ `JButton` 类获取。（当然，`JButton` 然后会请求其模型来获取该信息。）\n\n再次查看 `ButtonModel` 接口，看看里面*没有*什么。模型*不*存储按钮标签或图标。无法通过查看模型来发现按钮表面上有什么。（实际上，如你将在\
  \ 11.4.2 节 中看到的，这种设计的纯洁是程序员某些痛苦的根源。）\n\n值得注意的是，*同一个*模型（即 `DefaultButtonModel`）用于推按钮、单选框、复选框甚至菜单项。当然，每种按钮类型都有不同的视图。\n\
  \n## 1.2. 布局管理引言\n\n在我们继续讨论单个组件（如文本字段和单选框）之前，让我们简要介绍如何在框架内部安排这些组件。\n\n当然，Java 开发环境具有拖放式的\
  \ GUI 构建器。尽管如此，确切知道底层发生了什么是重要的，因为即使是最好的工具也需要手动微调。\n\n### 1.2.1. 布局管理器\n\n让我们从回顾第\
  \ 10 章](../10/index.xhtml）中用于按钮更改框架背景颜色的程序开始。按钮包含在 `JPanel` 对象中，并由流布局管理器管理，这是面板的默认布局管理器。图\
  \ 11.4 显示了向面板中添加更多按钮时发生的情况。如你所见，当没有更多空间时，会开启新行。\n\n![Figure](img/buttontest2.jpg)图\
  \ 11.4: 由流布局管理的六个按钮面板\n\n此外，即使用户调整框架大小，按钮也保持在面板居中的位置（参见图 11.5）。\n\n![Figure](img/buttontest3.jpg)图\
  \ 11.5: 更改面板会自动重新排列按钮。\n\n\n\n\n遗憾的是，继承层次结构在两个方面并不纯洁。首先，顶层窗口（如 `JFrame`）是 `Container`\
  \ 的子类，因此也是 `Component`，但它们不能被放在其他容器内部。此外，`JComponent` 是 `Container` 的子类，而不是 `Component`。因此，可以将其他组件添加到\
  \ `JButton` 中。（然而，由于这些组件将不会被显示。）\n\n每个容器都有默认的布局管理器，但你始终可以设置自己的布局管理器。例如，以下语句：\n\n\
  ```\npanel.setLayout(new GridLayout(4, 4));\n```\n\n使用 `GridLayout` 类将组件排列为四行四列。当你向容器中添加组件时，容器的\
  \ `add` 方法会将组件和任何位置方向传递给布局管理器。\n\n### `java.awt.Container` 1.0\n\n*   `void setLayout(LayoutManager\
  \ m)`\n    为此容器设置布局管理器。\n*   `Component add(Component c)`\n*   `Component add(Component\
  \ c, Object constraints)` 1.1\n    向此容器中添加一个组件并返回该组件的引用。\n\n### `java.awt.FlowLayout`\
  \ 1.0\n\n*   `FlowLayout()`\n*   `FlowLayout(int align)`\n*   `FlowLayout(int align,\
  \ int hgap, int vgap)`\n    构造一个新的 `FlowLayout`。`align` 参数是 `LEFT`、`CENTER` 或 `RIGHT`\
  \ 之一。\n\n### 11.2.2. 边界布局 (Border Layout)\n\n`边界布局管理器` 是是每个 `JFrame` 内容面板的默认布局管理器。与完全控制每个组件位置的流式布局管理器不同，边界布局管理器允许你选择放置每个组件的位置。你可以选择将组件放置在内容面板的中心、北部、南部、东部或西部（参阅\
  \ 图 11.7）。\n\n.图 11.7: 边界布局\n\n例如：\n\n```\nframe.add(component, BorderLayout.SOUTH);\n\
  ```\n\n首先布局边缘组件，剩余的可用空间由中心区域占据。当容器调整大小时，边缘组件的尺寸保持不变，但中心组件会改变其大小。通过指定 `BorderLayout`\
  \ 类中的常量 `CENTER`、`NORTH`、`SOUTH`、`EAST` 或 `WEST` 来添加组件。并不是所有位置都需要被占据。如果你不提供任何值，则假设为\
  \ `CENTER`。\n\n`BorderLayout` 常量定义为字符串。例如，`BorderLayout.SOUTH` 被定义为字符串 `\"South\"\
  `。这比直接使用字符串更安全。如果你不小心拼错了字符串，例如 `frame.add(component, \"south\")`，编译器不会捕捉该错误。\n\n\
  与流式布局不同，边界布局会扩展所有组件以填充可用空间。（流式布局让每个组件保持其首选大小。）当你添加一个按钮时，这是一个问题：\n\n```\nframe.add(yellowButton,\
  \ BorderLayout.SOUTH); // 不要这样做\n```\n\n图 11.8 显示了使用上述代码片段时会发生什么。按钮已经增大以填充框架的整个南部区域。而且，如果你在南部区域添加另一个按钮，它将仅仅取代第一个按钮。\n\
  \n![图](img/buttontest4.jpg)图 11.8: 由边界布局管理的单个按钮\n\n为了解决这个问题，请使用额外的面板。例如，查看 图 11.9。屏幕底部的三个按钮都在在一个面板中。该面板被放入内容面板的南部区域。\n\
  \n![图](img/buttontest5.jpg)图 11.9: 放置在框架南部区域的面板\n\n要实现这种配置，首先创建一个 `JPanel` 对象，然后将各个按钮添加到面板中。面板的默认布局管理器是\
  \ `FlowLayout`，这对于这种情况是一个很好的选择。使用你之前见过的 `add` 方法将各个按钮添加到面板。按钮的位置和大小由 `FlowLayout`\
  \ 管理器控制。这意味着按钮保持在面板内居中，不会扩展以填充整个面板区域。最后，将面板添加到框架的内容面板中。\n\n```\nvar panel = new\
  \ JPanel();\npanel.add(yellowButton);\npanel.add(blueButton);\npanel.add(redButton);\n\
  frame.add(panel, BorderLayout.SOUTH);\n```\n\n边界布局扩展面板的尺寸以填充整个南部区域。\n\n### `java.awt.BorderLayout`\
  \ 1.0\n\n*   `BorderLayout()`\n*   `BorderLayout(int hgap, int vgap)`\n    构造一个新的\
  \ `BorderLayout`。\n\n### 11.2.3. 网格布局 (Grid Layout)\n\n网格布局像电子表格一样按行和列排列所有组件。所有组件都具有相同的尺寸。图\
  \ 11.10 中的计算器程序使用网格布局来排列计算器按钮。当你调整窗口大小时，按钮会随之放大缩小，但所有按钮的尺寸是相同的。\n\n![图](img/calculator.jpg)图\
  \ 11.10: 计算器\n\n在网格布局对象的构造函数中，你指定需要多少行和列。\n\n```\npanel.setLayout(new GridLayout(4,\
  \ 4));\n```\n\n添加组件，从第一行的第一个条目开始。\n\n```\npanel.add(new JButton(\"1\"));\npanel.add(new\
  \ JButton(\"2\"));\n```\n\n当然，很少有应用程序像计算器界面那样布局布局。在实践中，小型网格（通常只有一行或一列）可以组织窗口的部分区域。例如，如果你有一行尺寸相同的按钮，可以将它们放在一个由单行网格控制的面板中。\n\
  \n### `java.awt.GridLayout` 1.0\n\n*   `GridLayout(int rows, int columns)`\n*  \
  \ `GridLayout(int rows, int columns, int hgap, int vgap)`\n    构造一个新的 `GridLayout`。`rows`\
  \ 和 `columns` 之一可以为零，表示每行或每列任意数量的组件。\n\n## 11.3. 文本输入\n\n我们终于准备好引入 Swing 用户界面组件了。让我们从允许用户输入和编辑文本的组件开始。你可以使用\
  \ `JTextField` 和 `JTextArea` 组件进行文本输入。文本字段接受一行文本；文本区域接受多行文本。`JPasswordField`接受一行文本但不显示内容。\n\
  \n这三个类都继承自一个名为 `JTextComponent` 的类。你无法自己构造 `JTextComponent`，因为它是一个抽象类。另一方面，正如 Java\
  \ 中常见的情况一样，当你查询 API 文档时，可能会发现你寻找的方法实际上在父类 `JTextComponent` 中，而不是派生类中。例如，获取或设置文本字段或文本区域文本的方法实际上在\
  \ `JTextComponent` 中。\n\n### `javax.swing.text.JTextComponent` 1.2\n\n*   `String\
  \ getText()`\n*   `void setText(String text)`\n    获取或设置此文本组件的文本。\n*   `boolean\
  \ isEditable()`\n*   `void setEditable(boolean b)`\n    获取或设置 `editable` 属性，该属性决定用户是否可以编辑此文本组件的内容。\n\
  \n### 11.3.1. 文本字段\n\n将文本字段添加到窗口的通常方法将其添加到面板或其他容器中——就像添加按钮一样：\n\n```\nvar panel\
  \ = new JPanel();\nvar textField = new JTextField(\"默认输入\", 20);\npanel.add(textField);\n\
  ```\n\n\n\n\n这段代码添加了一个文本字段，并通过在其中放置字符串 `\"Default input\"` 来对其进行初始化。该构造函数的第二个参数设置了宽度。在本例中，宽度为\
  \ 20 个“列”。遗憾的是，“列”是一个相当不精确的测量。一列是指你为文本所使用的字体中，一个字符的预期宽度。其想法是，如果你预计输入内容为 `n` 个字符或更少，你应该指定\
  \ `n` 为列宽。在实践中，这种测量方法的效果并不理想，为了安全起见，你应该在最大输入长度上加上 1 或 2。此外，请记住，列数只是给 AWT 的一个提示，用于提供\
  \ `preferred`（优先）尺寸。如果布局管理器需要扩大或缩小文本字段，它可以调整其大小。你在 `JTextField` 构造函数中设置的列宽并不是用户输入字符数量的上限。用户仍然可以输入更字符串，但当文本超过字段长度时，输入会滚动。用户往往会认为滚动文本字段令人恼恼，因此你应该将字段尺寸留得宽大一些。如果你需要在运行时重置列数，可以使用\
  \ `setColumns` 方法。\n\n在使用 `setColumns` 方法更改文本框的大小后，调用周围容器的 `revalidate` 方法。\n\n\
  ```\ntextField.setColumns(10);\npanel.revalidate();\n```\n\n`revalidate` 方法重新计算容器内所有组件的尺寸和布局。在你使用\
  \ `revalidate` 方法之后，布局管理器会调整容器的大小，文本字段改变后的尺寸将变得可见。\n\n`revalidate` 方法属于 `JComponent`\
  \ 类。它不会立即调整组件的大小，而仅仅将其标记为需要调整大小。当多个组件请求调整大时，这种方法可以避免重复计算。然而，如果你想重新计算 `JFrame` 内部的所有组件，你必须调用\
  \ `validate` 方法——`JFrame` 并没有继承 `JComponent`。\n\n通常情况下，用户在文本字段中添加文本（或编辑现有文本）。这些文本字段通常是空白的。要创建一个空白的文本字段，只需不要为\
  \ `JTextField` 构造函数提供字符串参数即可：\n\n```\nvar textField = new JTextField(20);\n```\n\
  \n你可以通过使用上一节提到的 `JTextComponent` 父类的 `setText` 方法随时更改文本字段的内容。例如：\n\n```\ntextField.setText(\"\
  Hello!\");\n```\n\n并且，正如上一节提到的，你可以通过调用 `getText` 方法获取用户输入了什么。该方法返回用户输入的准确文本。要删除文本字段数据中任何多余的前导和后缀空格，应对\
  \ `getText` 的返回值应用 `strip` 方法：\n\n```\nString text = textField.getText().strip();\n\
  ```\n\n要更改用户文本显示的字体，请使用 `setFont` 方法。\n\n### `javax.swing.JTextField` 1.2\n\n* `JTextField(int\
  \ columns)`\n  构造一个具有指定列数的空 `JTextField`。\n* `JTextField(String text, int columns)`\n\
  \  构造一个具有初始字符串和指定列数的新 `JTextField`。\n* `int getColumns()`\n* `void setColumns(int\
  \ columns)`\n  获取或设置此文本字段应该使用的列数。\n\n### `javax.swing.JComponent` 1.2\n\n* `void\
  \ revalidate()`\n  导致组件重新计算位置和尺寸。\n* `void setFont(Font f)`\n  设置此组件的字体。\n\n###\
  \ `java.awt.Component` 1.0\n\n* `void validate()`\n  重新计算组件的位置和尺寸。如果该组件是容器，则会重新计算其组件的位置和尺寸。\n\
  * `Font getFont()`\n  获取此组件的字体。\n\n### 11.3.2 标签和标签组件\n\n标签（Labels）是持有文本的组件。它们没有装饰（例如，没有边界）。它们也不会对用户产生响应。你可以使用标签来标识组件。例如，与按钮不同，文本字段没有标签来标识它们。要为一个本身不带标识符的组件添加标签：\n\
  \n1. 构建一个具有正确文本的 `JLabel` 组件。\n2. 将其放置在你想要标识的组件足够近的地方，以便用户可以看到该标签标识的是正确的组件。\n\n\
  `JLabel` 的构造函数允许你指定初始文本或图标，以及可选的内容对齐方式。使用来自 `SwingConstants` 接口的常量来指定对齐方式。该接口定义了一些有用的常量，如\
  \ `LEFT`、`RIGHT`、`CENTER`、`NORTH`、`EAST` 等。`JLabel` 类是实现此接口的多个 Swing 类之一。因此，你可以通过以下方式指定右对齐的标签：\n\
  \n```\nvar label = new JLabel(\"User name: \", SwingConstants.RIGHT);\n```\n\n或者\n\
  \n```\nvar label = new JLabel(\"User name: \", JLabel.RIGHT);\n```\n\n`setText`\
  \ 和 `setIcon` 方法允许你在运行时设置标签的文本和图标。\n\n你可以在按钮、标签和菜单项中使用纯文本和 HTML 文本。我不建议在按钮中使用 HTML——它会干扰视觉效果（look-and-feel）。但在标签中使用\
  \ HTML 可以非常有效。只需地将标签字符串包在 `<html>. . .</html>` 中即可，如下所示：\n\n```\nlabel = new JLabel(\"\
  <html><b>Required</b> entry:</html>\");\n```\n\n注意，第一个带有 HTML 标签的组件显示可能需要一些时间，因为复杂的\
  \ HTML 代码需要加载。\n\n标签可以像其他组件一样放置在容器内部。这意味着你可以使用之前学的技术将标签放在需要的地方。\n\n### `javax.swing.JLabel`\
  \ 1.2\n\n* `JLabel(String text)`\n* `JLabel(Icon icon)`\n* `JLabel(String text,\
  \ int align)`\n* `JLabel(String text, Icon icon, int align)`\n  构造标签。`align` 参数是\
  \ `SwingConstants` 常量之一：`LEFT`（默认）、`CENTER` 或 `RIGHT`。\n* `String getText()`\n*\
  \ `void setText(String text)`\n  获取或设置此标签的文本。\n* `Icon getIcon()`\n* `void setIcon(Icon\
  \ icon)`\n  获取或设置此标签的图标。\n\n### 11.3.3 密码字段\n\n字段字段特殊的文本字段。为了防止旁人看到你的密码，用户输入的字符不会实际显示。相反，每个输入的字符都由回显字符表示，例如圆点（•）。Swing\
  \ 提供了一个 `JPasswordField` 类来实现这种文本字段。\n\n密码字段是模型视图控制器架构的另一个例子。密码字段使用与文本字段相同的模型来存储数据，但它的视图已更改为显示回显字符。\n\
  \n### `javax.swing.JPasswordField` 1.2\n\n* `JPasswordField(String text, int columns)`\n\
  \  构造一个新的密码字段。\n* `void setEchoChar(char echo)`\n  设置此密码字段的回显字符。这是一个建议值；特定的外观可能会坚持使用它自己的回显字符。值\
  \ `0` 将回显字符重置为默认。\n* `char[] getPassword()`\n  返回此密码字段包含的文本。为了更高的安全，在使用后你应该覆盖返回数组的内容。（密码不以\
  \ `String` 返回，因为字符串在垃圾回收之前会一直留在虚拟机中。）\n\n### 11.3.4 文本区域\n\n有时，你需要收集比单行长的用户输入。正如前面提到的，你可以使用\
  \ `JTextArea` 组件来实现这一点。当你将文本区域组件放置在程序中，用户可以输入任意数量行的文本，使用回车键将它们分开。每行都以 `'\\n'` 结束（即使在\
  \ Windows 上也是如此）。图 11.11 图 11.11: 文本组件\n\n\n\n\n\n在 `JTextArea` 组件的构造函数中，指定文本区域的行数和列数。例如：\n\
  \n```\ntextArea = new JTextArea(8, 40); // 8 行每行 40 列\n```\n\n其中 `columns` 参数的作用与之前相同——为了安全起见，你仍然需要多添加几列。此外，和之前一样，用户并不受限于行数和列数；当用户输入的内容过多时，文本会自动滚动。你也可以使用\
  \ `setColumns` 方法更改列数，以及使用 `setRows` 方法更改行数。这些数字仅表示首选大小——布局管理器仍然可以放大或缩小文本区域。\n\n\
  如果文本多于文本区域能够显示的范围，剩余的文本将会被裁剪。你可以通过开启换行（line wrapping）来避免长行被裁剪：\n\n```\ntextArea.setLineWrap(true);\
  \ // 长行将换行\n```\n\n这种换行仅是一种视觉效果；文档中的文本不会发生改变——不会在文本中自动插入 `'\\n'` 字符。\n\n### 11.3.5.\
  \ 滚动面板 (Scroll Panes)\n\n在 Swing 中，文本区域没有滚动条。如果你想要滚动条，必须将文本区域放在一个滚动面板（scroll pane）中。\n\
  \n```\ntextArea = new JTextArea(8, 40);\nvar scrollPane = new JScrollPane(textArea);\n\
  ```\n\n现在滚动面板管理文本区域的视图。如果文本多于文本区域能够显示的范围，滚动条会自动出现；当文本被删除且剩余文本适合区域内时，滚动条会再次消失。滚动由滚动面板内部处理——你的程序不需要处理滚动事件。\n\
  \n这是一个适用于任何组件的通用机制，而不仅仅是文本区域。要为组件添加滚动条，请将其放入滚动面板中。\n\n列表 11.1 展示了各种文本组件。此程序显示了一个文本字段、一个密码字段和一个带有滚动条的文本区域。文本字段和密码字段都有标签。点击“插入”（Insert）将字段内容插入到文本区域。\n\
  \n`JTextArea` 组件仅显示纯文本，没有特殊字体或格式。要显示格式化文本（如 HTML），你可以使用 第 12 章 中讨论的 `JEditorPane`\
  \ 类。\n\n列表 11.1 v2ch11/text/TextComponentFrame.java\n\n```\npackage v2ch11.text;\n\
  \nimport module java.desktop;\n\n/**\n * 一个带有示例文本组件的框架。\n */\npublic class TextComponentFrame\
  \ extends JFrame {\n    private static final int TEXTAREA_ROWS = 8;\n    private\
  \ static final int TEXTAREA_COLUMNS = 20;\n\n    public TextComponentFrame() {\n\
  \        var textField = new JTextField();\n        var passwordField = new JPasswordField();\n\
  \n        var northPanel = new JPanel();\n        northPanel.setLayout(new GridLayout(2,\
  \ 2));\n        northPanel.add(new JLabel(\"User name: \", SwingConstants.RIGHT));\n\
  \        northPanel.add(textField);\n        northPanel.add(new JLabel(\"Password:\
  \ \", SwingConstants.RIGHT));\n        northPanel.add(passwordField);\n\n      \
  \  add(northPanel, BorderLayout.NORTH);\n\n        var textArea = new JTextArea(TEXTAREA_ROWS,\
  \ TEXTAREA_COLUMNS);\n        var scrollPane = new JScrollPane(textArea);\n\n  \
  \      add(scrollPane, BorderLayout.CENTER);\n\n        // 添加按钮以文本追加到文本区域\n\n  \
  \      var southPanel = new JPanel();\n\n        var insertButton = new JButton(\"\
  Insert\");\n        southPanel.add(insertButton);\n        insertButton\n      \
  \          .addActionListener(_ -> textArea.append(\"User name: \" + textField.getText()\n\
  \                        + \" Password: \" + new String(passwordField.getPassword())\
  \ + \"\\n\"));\n\n        add(southPanel, BorderLayout.SOUTH);\n        pack();\n\
  \    }\n}\n```\n\n`javax.swing.JTextArea`1.2\n\n*   `JTextArea()`\n*   `JTextArea(int\
  \ rows, int columns)`\n*   `JTextArea(String text, int rows, int columns)`\n   \
  \ 构造一个新的文本区域。\n\n*   `void setColumns(int columns)`\n    告诉文本区域它应该使用的首选列数。\n\n*\
  \   `void setRows(int rows)`\n    告诉文本区域它应该使用的首选行数。\n\n*   `void append(String newText)`\n\
  \    将给文本追加到文本区域中已有文本的末尾。\n\n*   `void setLineWrap(boolean wrap)`\n    开启或关闭换行。\n\
  \n*   `void setWrapStyleWord(boolean word)`\n    如果 `word` 为 `true`，长行将在单词边界换行。如果为\
  \ `false`，长行将在不考虑单词边界的情况下断开。\n\n*   `void setTabSize(int c)`\n    设置每隔 `c` 列设置一个制表位。注意，制表符不会被转换为空格，而是导致与下一个制表位对齐。\n\
  \n`javax.swing.JScrollPane`1.2\n\n*   `JScrollPane(Component c)`\n    创建一个显示指定组件内容的滚动面板。当组件大于视图口大时，会提供滚动条。\n\
  \n## 11.4. 选择组件\n\n你现在已经知道如何从用户那里收集文本输入，但在许多情况下，你可能更倾向于给用户一组有限的选择，而不是让他们在文本组件中输入数据。使用一组按钮或项目列表可以告诉用户他们有哪些选择。（相应的错误检查。）在本节中，你将学习如何编写复选框、单选按钮、列表和滑块。\n\
  \n### 11.4.1. 复选框 (Checkboxes)\n\n如果你只想收集“是”或“否”输入，请使用复选框组件。复选框自动带有标识它们的标签。用户可以通过点击内部来勾选，通过再次点击内部取消勾选。当焦点在复选框时，按下空格键也可以切换勾选状态。\n\
  \n图 11.12 显示了一个两个复选框的简单程序，一个用于开启或关闭字体的斜体属性，另一个用于加粗。注意第二个复选框具有焦点，如周围框所示。每当用户点击其中一个复选框时，屏幕都会使用新的字体属性刷新。\n\
  \n![图](img/checkest.jpg)图 11.12：复选框\n\n复选框旁边需要标签来标识它们的用途。在构造函数给出标签文本：\n\n```\nbold\
  \ = new JCheckBox(\"Bold\");\n```\n\n使用 `setSelected` 方法开启或关闭复选框。例如：\n\n```\nbold.setSelected(true);\n\
  ```\n\n`isSelected` 方法可以获取每个复选框的状态。未勾选为 `false`，勾选为 `true`。\n\n当用户点击复选框时，这将触发动作事件。像往常一样，你为复选框附加动作监听器。在我们的程序中，两个复选框共享同一个动作监听器。\n\
  \n```\nActionListener listener = . . .\nbold.addActionListener(listener);\nitalic.addActionListener(listener);\n\
  ```\n\n监听器查询 `bold` 和 `italic` 复选框的状态，并设置面板字体为普通、加粗、斜体或同时加粗斜体。\n\n```\nActionListener\
  \ listener = _ -> {\n    int mode = 0;\n    if (bold.isSelected()) mode += Font.BOLD;\n\
  \    if (italic.isSelected()) mode += Font.ITALIC;\n    label.setFont(new Font(Font.SERIF,\
  \ mode, FONTSIZE));\n};\n```\n\n列表 11.2 是复选框示例的程序列表。\n\n列表 11.2 v2ch11/checkBox/CheckBoxFrame.java\n\
  \n\n\n\n\n```java\npackage v2ch11.checkBox;\n\nimport module java.desktop;\n\n/**\n\
  \ * 一个带有示例文本标签和用于选择字体属性复选框的框架。\n */\npublic class CheckBoxFrame extends JFrame {\n\
  \    private JLabel label;\n    private JCheckBox bold;\n    private JCheckBox italic;\n\
  \    private static final int FONTSIZE = 24;\n\n    public CheckBoxFrame() {\n \
  \       // 添加示例文本标签\n\n        label = new JLabel(\"The quick brown fox jumps over\
  \ the lazy dog.\");\n        label.setFont(new Font(\"Serif\", Font.BOLD, FONTSIZE));\n\
  \        add(label, BorderLayout.CENTER);\n\n        // 此监听器将标签的字体属性\n        //\
  \ 设置为选框的状态\n\n        ActionListener listener = _ -> {\n            int mode = 0;\n\
  \            if (bold.isSelected()) mode += Font.BOLD;\n            if (italic.isSelected())\
  \ mode += Font.ITALIC;\n            label.setFont(new Font(\"Serif\", mode, FONTSIZE));\n\
  \        };\n\n        // 添加复选框\n        var buttonPanel = new JPanel();\n\n   \
  \     bold = new JCheckBox(\"Bold\");\n        bold.addActionListener(listener);\n\
  \        bold.setSelected(true);\n        buttonPanel.add(bold);\n\n        italic\
  \ = new JCheckBox(\"Italic\");\n        italic.addActionListener(listener);\n  \
  \      buttonPanel.add(italic);\n\n        add(buttonPanel, BorderLayout.SOUTH);\n\
  \        pack();\n    }\n}\n```\n\n`javax.swing.JCheckBox`1.2\n\n*   `JCheckBox(String\
  \ label)`\n\n*   `JCheckBox(String label, Icon icon)`\n    构造一个初始状态为未选中的复选框。\n\n\
  *   `JCheckBox(String label, boolean state)`\n    构造一个给定标签和初始状态的复选框。\n\n*   `boolean\
  \ isSelected()`\n\n*   `void setSelected(boolean state)`\n    获取或设置复选框的选择状态。\n\n\
  ### 11.4.2 单选按钮 (Radio Buttons)\n\n在上一个示例中，用户可以勾选两个复选框中的任意一个或多个。在很多情况下，我们希望用户只选择多个框中的一个。当另一个框被勾选时，之前的框会自动取消勾选。这样一组框通常被称为\
  \ `单选按钮组` (radio button group)，因为这些按钮的作用就像收音机上的调台选择按钮。当你按下一个按钮时，之前按下的按钮会弹出。图 11.13\
  \ 显示了一个典型的示例。我们允许用户从小、中、大或特大选项中选择一种字体大小——当然，我们只允许一次选择一种大小。\n\n![Figure](img/radiobuttontest.jpg)图\
  \ 11.13: 单选按钮组\n\n在 Swing 中实现单选按钮组非常简单。你为每组按钮构造一个 `ButtonGroup` 类型的对象。然后，将 `JRadioButton`\
  \ 类型的对象添加到按钮组中。按钮组对象负责在点击新按钮时，关闭之前设置的选中的按钮。\n\n```java\nvar group = new ButtonGroup();\n\
  \nvar smallButton = new JRadioButton(\"Small\", false);\ngroup.add(smallButton);\n\
  \nvar mediumButton = new JRadioButton(\"Medium\", true);\ngroup.add(mediumButton);\n\
  . . .\n```\n\n构造函数的第二个参数对于初始应被选中的按钮为 `true`，对于其他所有按钮为 `false`。注意，按钮组只控制按钮的`行为`；如果你是为了布局目的而对按钮分组，你还需要将它们添加到诸如\
  \ `JPanel` 的容器中。\n\n如果你再次查看图 11.12，你会注意到单选按钮的外观与图 11.13 中的复选框不同。复选框是正方形的，选中时包含一个标记；单选按钮是圆形的，选中时包含一个点。\n\
  \n单选按钮的事件通知机制与其他任何按钮相同。当用户勾选单选按钮时，该按钮会生成一个动作事件。在示例程序中，我们定义了一个监听器，将字体设置为特定的值：\n\n\
  ```java\nActionListener listener = _ -> label.setFont(new Font(\"Serif\", Font.PLAIN,\
  \ size));\n```\n\n将此监听器设置与复选框示例进行比较。每个单选按钮获得一个不同的监听器对象。每个监听器对象都确切知道需要做什么——将字体设置为特定的值。对于复选框，我们使用了不同的方法：两个复选框拥有同一个动作监听器，该监听器调用一个方法查看两个复选框当前的状态。\n\
  \n我们在这里采用相同的方法吗？我们可以有一个单一监听器，如下计算大小：\n\n```java\nif (smallButton.isSelected()) size\
  \ = 8;\nelse if (mediumButton.isSelected()) size = 12;\n. . .\n```\n\n然而，我们更倾向于使用独立的动作监听器对象，因为它们将大小值与按钮结合得更紧密。\n\
  \n如果你有一组单选按钮，你知道其中只有一个是被选中的。如果能够快速找到是哪一个，而不需要查询组中的所有按钮，那就好了。`ButtonGroup` 对象控制所有按钮，如果这个对象能为我们提供选中按钮的引用，将会非常方便。事实上，`ButtonGroup`\
  \ 类有一个 `getSelection` 方法，但该方法并不返回被选中的单选按钮。相反，它返回的是指向被选中按钮的 `ButtonModel` 引用。\n\n\
  \n\n\n\n* `ButtonModel getSelection()`\n  返回所选按钮的模型。\n\n`javax.swing.ButtonModel`\
  \ 1.2\n\n* `String getActionCommand()`\n  返回此按钮模型的动作命令（action command）。\n\n`javax.swing.AbstractButton`\
  \ 1.2\n\n* `void setActionCommand(String s)`\n  设置此按钮及其模型的动作命令。\n\n### 11.4.3 边框\
  \ (Borders)\n\n如果你在窗口中有组单选按钮，你可能希望视觉上指示哪些按钮是一组的。Swing 提供了一组实用的 `borders` 用于此目的。你可以将边框应用于任何扩展\
  \ `JComponent` 的组件。常见的用法是在面板周围放置边框，并在面板中填充其他用户界面元素，如单选按钮。\n\n你可以从许多边框中选择，但对所有边框都需要遵循相同的步骤。\n\
  \n1. 调用 `BorderFactory` 的静态方法来创建边框。你可以从以下样式中选择（参见图 11.14）：\n    * 凹槽 (Lowered bevel)\n\
  \    * 凸槽 (Raised bevel)\n    * 蚀刻 (Etched)\n    * 线型 (Line)\n    * 哑光 (Matte)\n\
  \    * 空（仅在组件周围留出一些空白）\n      ![Figure](img/bordertest.jpg)图 11.14: 边框类型测试\n2. 如果需要，可以通过将边框传递给\
  \ `BorderFactory.createTitledBorder` 为你的边框添加标题。\n3. 如果你真的想到位，可以通过调用 `BorderFactory.createCompoundBorder`\
  \ 组合多个边框。\n4. 通过调用 `JComponent` 类的 `setBorder` 方法将生成的边框添加到组件中。\n\n例如，这里是向向面板添加带有标题的蚀刻边框：\n\
  \n```\nBorder etched = BorderFactory.createEtchedBorder();\nBorder titled = BorderFactory.createTitledBorder(etched,\
  \ \"A Title\");\npanel.setBorder(titled);\n```\n\n不同的边框具有设置边框宽度和颜色的选项；详情请参见 API\
  \ 注释。真正的边框爱好者会发现，还有一个 `SoftBevelBorder` 类用于边角软化的凹槽边框，并且 `LineBorder` 也可以具有圆角。你只能通过使用类构造函数之一来构造这些边框——它们没有对应的\
  \ `BorderFactory` 方法。\n\n`javax.swing.BorderFactory` 1.2\n\n* `static Border createLineBorder(Color\
  \ color)`\n* `static Border createLineBorder(Color color, int thickness)`\n  创建一个简单的线型边框。\n\
  * `static MatteBorder createMatteBorder(int top, int left, int bottom, int right,\
  \ Color color)`\n* `static MatteBorder createMatteBorder(int top, int left, int\
  \ bottom, int right, Icon tileIcon)`\n  创建一个填充了颜色或重复图标的厚边框。\n* `static Border createEmptyBorder()`\n\
  * `static Border createEmptyBorder(int top, int left, int bottom, int right)`\n\
  \  创建一个空边框。\n* `static Border createEtchedBorder()`\n* `static Border createEtchedBorder(Color\
  \ highlight, Color shadow)`\n* `static Border createEtchedBorder(int type)`\n* `static\
  \ Border createEtchedBorder(int type, Color highlight, Color shadow)`\n  创建一个具有\
  \ 3D 效果的线型边框。`type` 参数是 `EtchedBorder.RAISED` 或 `EtchedBorder.LOWERED` 之一。\n* `static\
  \ Border createBevelBorder(int type)`\n* `static Border createBevelBorder(int type,\
  \ Color highlight, Color shadow)`\n* `static Border createLoweredBevelBorder()`\n\
  * `static Border createRaisedBevelBorder()`\n  创建一个产生凹陷或凸起效果的边框。`type` 参数是 `BevelBorder.RAISED`\
  \ 或 `BevelBorder.LOWERED` 之一。\n* `static TitledBorder createTitledBorder(String\
  \ title)`\n* `static TitledBorder createTitledBorder(Border border)`\n* `static\
  \ TitledBorder createTitledBorder(Border border, String title)`\n* `static TitledBorder\
  \ createTitledBorder(Border border, String title, int justification, int position)`\n\
  * `static TitledBorder createTitledBorder(Border border, String title, int justification,\
  \ int position, Font font)`\n* `static TitledBorder createTitledBorder(Border border,\
  \ String title, int justification, int position, Font font, Color color)`\n  创建一个带有指定属性的标题边框。`justification`\
  \ 参数是 `TitledBorder` 常量 `LEFT`、`CENTER`、`RIGHT`、`LEADING`、`TRAILING` 或 `DEFAULT_JUSTIFICATION`（左对）之一，而\
  \ `position` 是 `ABOVE_TOP`、`TOP`、`BELOW_TOP`、`ABOVE_BOTTOM`、`BOTTOM`、`BELOW_BOTTOM`\
  \ 或 `DEFAULT_POSITION`（顶部）之一。\n* `static CompoundBorder createCompoundBorder(Border\
  \ outsideBorder, Border insideBorder)`\n  将两个边框组合为一个边框。\n\n`javax.swing.border.SoftBevelBorder`\
  \ 1.2\n\n* `SoftBevelBorder(int type)`\n* `SoftBevelBorder(int type, Color highlight,\
  \ Color shadow)`\n  创建一个圆角凹槽边框。`type` 参数是 `SoftBevelBorder.RAISED` 或 `SoftBevelBorder.LOWERED`\
  \ 之一。\n\n`javax.swing.border.LineBorder` 1.2\n\n* `public LineBorder(Color color,\
  \ int thickness, boolean roundedCorners)`\n  创建一个具有指定颜色和厚度的线型边框。如果 `roundedCorners`\
  \ 为 `true`，则边框具有圆角。\n\n`javax.swing.JComponent` 1.2\n\n* `void setBorder(Border\
  \ border)`\n  设置此组件的边框。\n\n### 11.4.4 下拉框 (Combo Boxes)\n\n如果你有许多备选方案，单选按钮不是很好的选择，因为它们占据了太多屏幕空间。相反，可以使用下拉框。当用户点击此组件时，列表会出现（参见图\
  \ 11.15）。\n\n![Figure](img/comboboxtest.jpg)图 11.15: 下拉框\n\n如果下拉框是可编辑的，你可以像编辑文本框一样编辑它。`JComboBox`\
  \ 类提供了一种具有预定义选项的下拉框组件。从 Java 7 开始，`JComboBox` 是一个泛型类。例如，`JComboBox<String>` 持字符串。调用\
  \ `setEditable` 方法使下拉框变为可编辑。注意编辑只会影响选中的项目，不会以任何方式改变列表选项。\n\n你可以通过调用 `getSelectedItem`\
  \ 获取当前选择，如果下拉框是可编辑的，该项目可能经过编辑。对于可编辑的下拉框，该项目可以是任何类型，取决于编辑器（参见第 12 章 ../12/index.xhtml\
  \ 关于编辑器的讨论）。如果你的下拉框不可编辑，最好调用\n\n```\ncombo.getItemAt(combo.getSelectedIndex())\n\
  ```\n\n获取正确类型的选中项目。在示例程序中，用户可以从字体列表中选择样式（Serif、SansSerif、Monospaced 等）。用户也可以输入另一种字体。\n\
  \n使用 `addItem` 方法添加选项。在我们的程序中，`addItem` 只在构造函数中调用，但你可以随时调用它。\n\n```\nvar faceCombo\
  \ = new JComboBox<String>();\nfaceCombo.addItem(\"Serif\");\nfaceCombo.addItem(\"\
  SansSerif\");\n```\n\n这将将字符串添加到列表末尾。你可以使用 `insertItemAt` 方法在列表任何地方添加新项目：\n\n```\n\
  faceCombo.insertItemAt(\"Monospaced\", 0); // 添加到开头\n```\n\n你可以添加任何类型的项目——下拉框调用每个项目的\
  \ `toString` 方法来显示它。如果你需要在运行时删除项目，使用 `removeItem` 或 `removeItemAt` 方法，取决于你提供的是要删除的项目还是其位置。\n\
  \n```\nfaceCombo.removeItem(\"Monospaced\");\nfaceCombo.removeItemAt(0); // 删除第一个项目\n\
  ```\n\n`removeAllItems` 方法一次性删除所有项目。\n\n\n\n\n\n如果你需要向组合框添加大量项目，`addItem` 方法的性能会很差。相反，应该构造一个\
  \ `DefaultComboBoxModel`，通过调用 `addElement` 填充它，然后调用 `JComboBox` 类的 `setModel` 方法。\n\
  \n当用户从组合框中选择一个项目时，组合框会产生一个动作事件。要确定选中了哪个项目，请在事件参数上调用 `getSource` 以获取发送事件的组合框引用。然后调用\
  \ `getSelectedItem` 方法检索当前选中的项目。你需要将返回的值强制转换为适当类型，通常为 `String`。\n\n```\nActionListener\
  \ listener = _ ->\n    label.setFont(new Font(\n        faceCombo.getItemAt(faceCombo.getSelectedIndex()),\n\
  \        Font.PLAIN,\n        DEFAULT_SIZE));\n```\n\nListing 11.4 显示了完整的程序。\n\n\
  Listing 11.4 v2ch11/comboBox/ComboBoxFrame.java\n\n```java\npackage v2ch11.comboBox;\n\
  \nimport module java.desktop;\n\n/**\n * 一个带有示例文本标签和用于选择字体的组合框的框架。\n */\npublic\
  \ class ComboBoxFrame extends JFrame {\n    private JComboBox<String> faceCombo;\n\
  \    private JLabel label;\n    private static final int DEFAULT_SIZE = 24;\n\n\
  \    public ComboBoxFrame() {\n        // 添加示例文本标签\n\n        label = new JLabel(\"\
  The quick brown fox jumps over the lazy dog.\");\n        label.setFont(new Font(\"\
  Serif\", Font.PLAIN, DEFAULT_SIZE));\n        add(label, BorderLayout.CENTER);\n\
  \n        // 创建一个组合框并添加字体名称\n\n        faceCombo = new JComboBox<>();\n        faceCombo.addItem(\"\
  Serif\");\n        faceCombo.addItem(\"SansSerif\");\n        faceCombo.addItem(\"\
  Monospaced\");\n        faceCombo.addItem(\"Dialog\");\n        faceCombo.addItem(\"\
  DialogInput\");\n\n        // 组合框监听器将标签字体更改为选定的字体名称\n\n        faceCombo.addActionListener(_\
  \ -> label.setFont(new Font(\n                faceCombo.getItemAt(faceCombo.getSelectedIndex()),\
  \ Font.PLAIN, DEFAULT_SIZE)));\n\n        // 将组合框添加到框架南部边界的面板中\n\n        var comboPanel\
  \ = new JPanel();\n        comboPanel.add(faceCombo);\n        add(comboPanel, BorderLayout.SOUTH);\n\
  \        pack();\n    }\n}\n```\n\n`javax.swing.JComboBox`1.2\n\n*   `boolean isEditable()`\n\
  *   `void setEditable(boolean b)`\n    获取或设置此组合框的 `editable` 属性。\n\n*   `void addItem(Object\
  \ item)`\n    向项目列表添加一个项目。\n\n*   `void insertItemAt(Object item, int index)`\n\
  \    在指定的索引处向项目列表插入一个项目。\n\n*   `void removeItem(Object item)`\n    从项目列表中删除一个项目。\n\
  \n*   `void removeItemAt(int index)`\n    删除指定索引处的项目。\n\n*   `void removeAllItems()`\n\
  \    从项目列表中删除所有项目。\n\n*   `Object getSelectedItem()`\n    返回当前选中的项目。\n\n### 11.4.5.\
  \ 滑块 (Sliders)\n\n组合框允许用户从一组离散的值中进行选择。而滑块则提供了从连续值中进行选择的机会——例如，1 到 100 之间的任何数字。\n\
  \n构建滑块最常见的方法如下：\n\n```\nvar slider = new JSlider(min, max, initialValue);\n```\n\
  \n如果你省略了最小值、最大值和初始值，它们将分别初始化为 `0`、`100` 和 `50`。\n\n或者如果你想让滑块垂直显示，请使用以下构造函数调用：\n\n\
  ```\nvar slider = new JSlider(SwingConstants.VERTICAL, min, max, initialValue);\n\
  ```\n\n这些构造函数创建一个普通的滑块，例如图 11.16 顶部的滑块。你现在将看到如何为滑块添加装饰。\n\n![Figure](img/slidertest.jpg)图\
  \ 11.16: 滑块\n\n当用户滑动滑块条时，滑块的 `value` 会在最小值和最大值之间移动。当值变化时，一个 `ChangeEvent` 会发送给所有变化监听器。要接收变化通知，请调用\
  \ `addChangeListener` 方法并安装一个实现 `ChangeListener` 功能接口的对象。在回调中，获取滑块值：\n\n```\nChangeListener\
  \ listener = _ -> {\n    JSlider slider = (JSlider) event.getSource();\n    int\
  \ value = slider.getValue();\n    . . .\n};\n```\n\n你可以通过显示刻度（ticks）来美化滑块。例如，在示例程序中，第二个滑块使用了以下设置：\n\
  \n```\nslider.setMajorTickSpacing(20);\nslider.setMinorTickSpacing(5);\n```\n\n\
  滑块每隔 20 个单位有一个大刻度，每隔 5 个单位有一个小刻度。这些单位指的是滑块的值，而不是像素。\n\n这些指令仅设置了刻度的单位。要让刻度实际出现，请调用\n\
  \n```\nslider.setPaintTicks(true);\n```\n\n主刻度和小刻度是独立的。例如，你可以设置每隔 20 个单位一个主刻度，每隔\
  \ 7 个单位一个小刻度，但这会给你得到一个非常混乱的刻度。\n\n你可以强制滑块“吸附到刻度”（snap to ticks）。当用户在吸附模式下拖动滑块时，它会立即移动到最近的刻度。通过以下调用激活此模式：\n\
  \n```\nslider.setSnapToTicks(true);\n```\n\n“吸附到刻度”的行为并不如你想象的那样完美。在滑块实际吸附之前，变化监听器报告的值并不与刻度对应。如果你点击滑块旁边——这种操作通常会让滑块移动一点——具有“吸附到刻度”功能的滑块不会移动到下一个刻度。\n\
  \n你可以通过调用以下方法显示主刻度标签：\n\n```\nslider.setPaintLabels(true);\n```\n\n例如，对于范围从 0 到\
  \ 100 且主刻度间距为 20 的滑块，刻度标记为 0、20、40、60、80 和 100。\n\n你还可以提供其他的刻度标签，例如字符串或图标（见图 11.16）。这个过程有点复杂。你需要填充一个键为\
  \ `Integer` 类型、值为 `Component` 哈表。然后调用 `setLabelTable` 方法。组件被放置在刻度下方。通常使用 `JLabel`\
  \ 对象。以下是将刻度标记为 A、B、C、D、E 和 F 的方法：\n\n```java\nvar labelTable = new Hashtable<Integer,\
  \ Component>();\nlabelTable.put(0, new JLabel(\"A\"));\nlabelTable.put(20, new JLabel(\"\
  B\"));\n. . .\nlabelTable.put(100, new JLabel(\"F\"));\nslider.setLabelTable(labelTable);\n\
  ```\n\nListing 11.5 还显示了一个使用图标作为刻度标签的滑块。\n\n如果你的刻度或标签没有显示，请双检是否调用了 `setPaintTicks(true)`\
  \ 和 `setPaintLabels(true)`。\n\n图 11.16 中的第四个滑块没有轨道。要抑制滑块移动的“轨道”，请调用\n\n```\nslider.setPaintTrack(false);\n\
  ```\n\n通过调用反转滑块的方向：\n\n```\nslider.setInverted(true);\n```\n\nListing 11.5 中的示例程序通过一组滑块展示了所有视觉效果。每个滑块都安装了一个变化事件监听器，将当前滑块值放入框架底部的文本框中。\n\
  \n\n\n\n\n```java\npackage v2ch11.slider;\n\nimport module java.base;\nimport module\
  \ java.desktop;\n\n/**\n * 一个包含多个滑块和一个用于显示滑块值的文本字段的帧框。\n */\npublic class SliderFrame\
  \ extends JFrame {\n    private JPanel sliderPanel;\n    private JTextField textField;\n\
  \    private ChangeListener listener;\n\n    public SliderFrame() {\n        sliderPanel\
