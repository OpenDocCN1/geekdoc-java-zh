  \ endExclusive, Period step)`\n    产生一个从此 `LocalDate` 直到结束的日期流，步长为 1 或给定的期间。\n\n\
  `java.time.Period`\n\n*   `static Period of(int years, int months, int days)`\n\
  *   `Period ofXxx(`int number)`\n    产生一个具有给定时间单位的 `Period`，其中 `Xxx` 是 `Days`、`Weeks`、`Months`\
  \ 或 `Years`。\n*   `int getXxx() `\n    获取此 `Period` 的时间单位数量，其中 `Xxx` 是 `Days`、`Months`\
  \ 或 `Years`。\n*   `Period plusXxx(`long number)`\n*   `Period minusXxx(`long number)`\n\
  \    产生通过加或减给定的时间单位而得到的 `Period`，其中 `Xxx` 是 `Days`、`Months` 或 `Years`。\n*   `Period\
  \ plus(TemporalAmount amountToAdd)`\n*   `Period minus(TemporalAmount amountToSubtract)`\n\
  \    产生一个与此 `Instant` 相隔给定量的 `Instant`。`Duration` 和 `Period` 类实现了 `TemporalAmount`\
  \ 接口。\n*   `Period withXxx(`int number)`\n    返回一个新的 `Period`，将天、月或年更改为给数字，其中 `Xxx`\
  \ 是 `Days`、`Months` 或 `Years`。\n\n## 6.3. 日期调整器 (Date Adjusters)\n\n在调度应用程序中，你经常需要计算如“每月第一个星期二”之类的日期。`TemporalAdjusters`\
  \ 类提供了许多用于常用调整的静态方法。你将调整方法的结果传递给 `with` 方法。例如，每月第一个星期二可以这样计算：\n\n```\nLocalDate\
  \ firstTuesday = LocalDate.of(year, month, 1).with(\n    TemporalAdjusters.nextOrSame(DayOfWeek.TUESDAY));\n\
  ```\n\n像既常一样，`with` 方法返回一个新的 `LocalDate` 对象，而不修改原始对象。本节末尾的 API 说明了可用的调整器。\n\n你也可以通过实现\
  \ `TemporalAdjuster` 接口来创建自己的调整器。这里是一个用于计算下一个工作日的调整器：\n\n```\nTemporalAdjuster NEXT_WORKDAY\
  \ = w -> {\n    var result = (LocalDate) w;\n    do {\n        result = result.plusDays(1);\n\
  \    }\n    while (result.getDayOfWeek().getValue() >= 6);\n    return result;\n\
  };\n\nLocalDate backToWork = today.with(NEXT_WORKDAY);\n```\n\n注意，lambda 表达式的参数类型为\
  \ `Temporal`，必须强制转换为 `LocalDate`。你可以使用 `ofDateAdjuster` 方法避免这种转换，该方法接受类型为 `UnaryOperator<LocalDate>`\
  \ 的 lambda。\n\n```\nTemporalAdjuster NEXT_WORKDAY = TemporalAdjusters.ofDateAdjuster(w\
  \ -> {\n    LocalDate result = w; // 无转换\n    do {\n        result = result.plusDays(1);\n\
  \    }\n    while (result.getDayOfWeek().getValue() >= 6);\n    return result;\n\
  });\n```\n\n`java.time.LocalDate`\n\n*   `LocalDate with(TemporalAdjuster adjuster)`\n\
  \    返回通过给定调整器调整此日期的结果。\n\n`java.time.temporal.TemporalAdjusters`\n\n*   `static\
