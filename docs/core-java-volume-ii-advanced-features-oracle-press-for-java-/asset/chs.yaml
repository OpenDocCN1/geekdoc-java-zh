  \ Component>)`\n设置标签表。\n\n## 11.5 菜单\n\n本章将介绍最常见的 UI 元素——下拉菜单，它们在应用程序中非常常见。\n\n\
  ### 11.5.1 构造菜单\n\n首先，创建一个菜单栏：\n\n```java\nvar menuBar = new JMenuBar();\n```\n\n\
  菜单栏可以放在任何地方。通常，我们希望它出现在窗口顶部。使用 `setJMenuBar` 方法将其添加：\n\n```java\nframe.setJMenuBar(menuBar);\n\
  ```\n\n为每个菜单创建一个菜单对象：\n\n```java\nvar editMenu = new JMenu(\"Edit\");\n```\n\n将顶层菜单添加到菜单栏中：\n\
  \n```java\nmenuBar.add(editMenu);\n```\n\n向菜单对象添加菜单项、分隔符和子菜单，这些都是常见的操作：\n\n```java\n\
  var pasteItem = new JMenuItem(\"Paste\");\neditMenu.add(pasteItem);\neditMenu.addSeparator();\n\
  JMenu optionsMenu = . . . // 子菜单\neditMenu.add(optionsMenu);\n```\n\n在图 11.17 中你可以看到“粘贴”和“只读”菜单之间的分隔符。\n\
  \n![图](img/menu2.jpg)图 11.17：带有子菜单的菜单\n\n当用户选择菜单项时，会触发动作事件。你需要为每个菜单项安装监听器：\n\n\n\
  \n\n菜单项经常会触发命令，这些命令也可以通过其他用户界面元素（如工具栏按钮）来激活。在第 10 章中，你已经了如何通过 `Action` 对象指定命令。你定义一个实现\
  \ `Action` 接口的类（通常通过扩展 `AbstractAction` 便利类），在 `AbstractAction` 对象的构造函数中指定菜单项标签，并重写\
  \ `actionPerformed` 方法来存放菜单动作处理器。例如：\n\n```\nvar exitAction = new AbstractAction(\"\
  Exit\") { // 菜单项文本在这里\n    public void actionPerformed(ActionEvent event) {\n  \
  \      // 动作代码在这里\n        System.exit(0);\n    }\n};\n```\n\n然后你可以将该动作添加到菜单中：\n\
  \n```\nJMenuItem exitItem = fileMenu.add(exitAction);\n```\n\n此命令使用动作名称向菜单添加一个菜单项。该动作对象成为它的监听器。这只是一个方便的快捷方式：\n\
  \n```\nvar exitItem = new JMenuItem(exitAction);\nfileMenu.add(exitItem);\n```\n\
  \n### `javax.swing.JMenu` 1.2\n\n*   `JMenu(String label)`\n    构造一个给定标签的菜单。\n*\
  \   `JMenuItem add(JMenuItem item)`\n    添加一个菜单项（或一个菜单）。\n*   `JMenuItem add(String\
  \ label)`\n    向此菜单添加带有给定标签的菜单项并返回该项。\n*   `JMenuItem add(Action a)`\n    向此菜单添加带有给定动作的菜单项并返回该项。\n\
  *   `void addSeparator()`\n    向菜单添加一条分隔线。\n*   `JMenuItem insert(JMenuItem menu,\
  \ int index)`\n    在特定索引处向菜单添加一个新的菜单项（或子菜单）。\n*   `JMenuItem insert(Action a, int\
  \ index)`\n    在特定索引处向菜单添加带有给定动作的新菜单项。\n*   `void insertSeparator(int index)`\n\
  \    在菜单中添加分隔符。\n*   `void remove(int index)`\n*   `void remove(JMenuItem item)`\n\
  \    从菜单中移除特定项。\n\n### `javax.swing.JMenuItem` 1.2\n\n*   `JMenuItem(String label)`\n\
  \    构造带有给定标签的菜单项。\n*   `JMenuItem(Action a)` 1.3\n    为给定动作构造菜单项。\n\n### `javax.swing.AbstractButton`\
  \ 1.2\n\n*   `void setAction(Action a)` 1.3\n    为此按钮或菜单项设置动作。\n\n### `javax.swing.JFrame`\
  \ 1.2\n\n*   `void setJMenuBar(JMenuBar menubar)`\n    为此框架设置菜单栏。\n\n### 11.5.2.\
  \ 菜单项中的图标\n\n菜单项与按钮非常相似。事实上，`JMenuItem` 类扩展了 `AbstractButton` 类。就像按钮一样，菜单可以只有文本标签、只有图标，或者二者兼有。你可以通过\
  \ `JMenuItem(String, Icon)` 或 `JMenuItem(Icon)` 构造函数指定图标，也可以通过 `JMenuItem` 类从 `AbstractButton`\
  \ 类继承的 `setIcon` 方法来设置它。这是一个示例：\n\n```\nvar cutItem = new JMenuItem(\"Cut\", new\
  \ ImageIcon(\"cut.gif\"));\n```\n\n在图 11.17 中，你可以看到几个菜单项旁边的图标。默认情况下，菜单项文本位于图标的右侧。如果你希望文本放在图标左侧，请调用\
  \ `JMenuItem` 类从 `AbstractButton` 类继承的 `setHorizontalTextPosition` 方法。例如，调用：\n\n\
  ```\ncutItem.setHorizontalTextPosition(SwingConstants.LEFT);\n```\n\n这会将菜单项文本移动到图标的左侧。\n\
  \n你也可以为动作添加图标：\n\n```\ncutAction.putValue(Action.SMALL_ICON, new ImageIcon(\"cut.gif\"\
  ));\n```\n\n每当你从动作构造一个菜单项时，`Action.NAME` 值将成为菜单项的文本，`Action.SMALL_ICON` 值将成为图标。\n\
  \n或者，你可以在 `AbstractAction` 构造函数中设置图标：\n\n```\ncutAction = new AbstractAction(\"\
  Cut\", new ImageIcon(\"cut.gif\")) {\n        public void actionPerformed(ActionEvent\
  \ event) {\n            . . .\n        }\n    };\n```\n\n### `javax.swing.JMenuItem`\
  \ 1.2\n\n*   `JMenuItem(String label, Icon icon)`\n    构造带有给定标签和图标的菜单项。\n\n### `javax.swing.AbstractButton`\
  \ 1.2\n\n*   `void setHorizontalTextPosition(int pos)`\n    设置文本相对于图标的水平位置。`pos`\
  \ 参数为 `SwingConstants.RIGHT`（文本在图标右侧）或 `SwingConstants.LEFT`。\n\n### `javax.swing.AbstractAction`\
  \ 1.2\n\n*   `AbstractAction(String name, Icon smallIcon)`\n    使用给定名称和图标构造抽象动作。\n\
  \n### 11.5.3. 复选框和单选按钮菜单项\n\n复选框和单选按钮菜单项在名称旁边显示复选框或单选按钮（参见图 11.17）。当用户选择菜单项时，该项会自动在选中和未选中之间切换。\n\
  \n除了按钮装饰外，像处理其他菜单项一样处理这些菜单项。例如，这里是创建一个复选框菜单项的方法：\n\n```\nvar readonlyItem = new\
  \ JMenuItem(\"Read-only\");\noptionsMenu.add(readonlyItem);\n```\n\n单选按钮项就像普通按钮。你必须将它们添加到组中。当其中一个按钮被选中时，其他的将取消选中。\n\
  \n```\nvar group = new ButtonGroup();\nvar insertItem = new JMenuItem(\"Insert\"\
  );\ninsertItem.setSelected(true);\ngroup.add(insertItem);\n```\n\n对于这些菜单项，你并不一定要在用户选择它们时收到通知。（当然，你应该在实例字段中保留该项的引用。）使用\
  \ `setSelected` 方法设置状态。\n\n### `javax.swing.JCheckBoxMenuItem` 1.2\n\n*   `JCheckBoxMenuItem(String\
  \ label)`\n    构造带有给定标签的复选框菜单项。\n*   `JCheckBoxMenuItem(String label, boolean state)`\n\
  \    构造带有给定标签和初始状态（true 为选中）的复选框菜单项。\n\n### `javax.swing.JRadioButtonMenuItem` 1.2\n\
  \n*   `JRadioButtonMenuItem(String label)`\n    构造带有给定标签的单选按钮菜单项。\n*   `JRadioButtonMenuItem(String\
  \ label, boolean state)`\n    构造带有给定标签和初始状态（true 为选中）的单选按钮菜单项。\n\n### `javax.swing.AbstractButton`\
  \ 1.2\n\n*   `boolean isSelected()`\n*   `void setSelected(boolean state)`\n   \
  \ 获取或设置此项的选择状态（true 为选中）。\n\n### 11.5.4. 弹出菜单\n\n弹出菜单是一种没有附加到菜单栏而是浮动在某处的菜单（参见图 11.18）。\n\
  \n![Figure](img/menu3.jpg)图 11.18: 弹出菜单\n\n像创建普通菜单一样创建弹出菜单，只是弹出菜单没有标题。\n\n```\n\
  var popup = new JPopupMenu();\n```\n\n然后，照常添加你的菜单项：\n\n```\nvar item = new JMenuItem(\"\
  Cut\");\nitem.addActionListener(listener);\npopup.add(item);\n```\n\n与始终位于框架顶部的菜单栏不同，你必须通过\
  \ `show` 方法显式显示弹出菜单。指定父组件和弹出的位置，使用父组件的坐标系。例如：\n\n```\npopup.show(panel, x, y);\n\
  ```\n\n通常，你希望在用户点击特定按钮时弹出菜单——所谓的*弹出触发器*。在 Windows 和 Linux 中，弹出触发器是非主（通常是右侧）鼠标按钮。为了在用户点击组件时弹出菜单（使用弹出触发器），只需调用方法：\n\
  \n```\ncomponent.setComponentPopupMenu(popup);\n```\n\n极少数情况下，你可能会将一个组件放在另一个带有弹出菜单的组件内部。子组件可以通过调用以下继承父组件的弹出菜单：\n\
  \n```\nchild.setInheritsPopupMenu(true);\n```\n\n\n\n在组件 `c` 之上显示弹出菜单，其左上角位于 `(x,\
  \ y)`（在 `c` 的坐标系中）。\n\n* `boolean isPopupTrigger(MouseEvent event)`1.3\n  如果鼠标事件是弹出菜单的触发器，则返回\
  \ `true`。\n\n`java.awt.event.MouseEvent`1.1\n* `boolean isPopupTrigger()`\n  如果此鼠标事件是弹出菜单的触发器，则返回\
  \ `true`。\n\n`javax.swing.JComponent`1.2\n* `JPopupMenu getComponentPopupMenu()`5.0\n\
  * `void setComponentPopupMenu(JPopupMenu popup)`5.0\n  获取或设置此组件的弹出菜单。\n* `boolean\
  \ getInheritsPopupMenu()`5.0\n* `void setInheritsPopupMenu(boolean b)`5.0\n  获取或设置\
  \ `inheritsPopupMenu` 属性。如果属性已设置且此组件的弹出菜单为 `null`，则将使用父组件的弹出菜单。\n\n### 11.5.5. 键盘快捷键和加速器\n\
  \n对于经验丰富的用户来说，通过键盘快捷键（Mnemonics）选择菜单项是一种非常方便的操作。你可以在菜单项构造函数中指定一个记忆字母，为菜单项创建一个键盘快捷键：\n\
  \n```java\nvar aboutItem = new JMenuItem(\"About\", 'A');\n```\n\n键盘快捷键会自动显示在菜单中，记忆字母带有下划线（参见图\
  \ 11.19）。例如，在在上例定义的项中，标签将显示为“About”，并带有带有下划线的字母‘A’。当菜单显示时，用户只需按下 A 键即可选中该菜单项。（如果快捷键字母不是菜单字符串的一部分，输入该字母仍然可以选中项，但快捷键不会显示在菜单中。自然地，这种不可见的快捷键用处大为疑问。）\n\
  \n![Figure](img/menu4.jpg)图 11.19: 键盘快捷键\n\n有时，你不希望为匹配快捷键的菜单项的第一个字母添加下划线。例如，如果你为“另存为”（Save\
  \ As）菜单项设置了快捷键“A”，那么下划第二个“A”（Save As）会更合理。你可以通过调用 `setDisplayedMnemonicIndex` 方法来指定你想要带有下划线的字符。\n\
  \n如果你有一个 `Action` 对象，可以将快捷键作为 `Action.MNEMONIC_KEY` 键的值添加，如下：\n\n```java\naboutAction.putValue(Action.MNEMONIC_KEY,\
  \ Integer.valueOf('A'));\n```\n\n你只能在菜单项的构造函数中提供记忆字母，而不能在菜单的构造函数中。要为菜单绑定快捷键，调用 `setMnemonic`\
  \ 方法：\n\n```java\nvar helpMenu = new JMenu(\"Help\");\nhelpMenu.setMnemonic('H');\n\
  ```\n\n要从菜单栏中选择顶级菜单，请同时按下 Alt 键和记忆字母。例如，按下 Alt+H 从菜单栏中选择“帮助”菜单。\n\n键盘快捷键允许你从当前打开的菜单中选择子菜单或菜单项。相比之下，加速器（Accelerators）是键盘快捷键，让你可以在无需打开菜单的情况下选择菜单项。例如，许多程序将加速器\
  \ Ctrl+O 和 Ctrl+S 绑定到文件菜单中的“打开”和“保存”项。使用 `setAccelerator` 方法为菜单项绑定加速器键。`setAccelerator`\
  \ 方法接收类型为 `Keystroke` 对象。例如，以下调用将加速器 Ctrl+O 绑定到 `openItem` 菜单项：\n\n```java\nopenItem.setAccelerator(KeyStroke.getKeyStroke(\"\
  ctrl O\"));\n```\n\n输入加速器键组合会自动选择菜单选项并触发动作事件，就像用户手动选择菜单选项一样。\n\n你只能将加速器绑定到菜单项，而不能绑定到菜单。加速键实际上不会打开菜单。相反，它们会直接触发与菜单关联动作事件。\n\
  \n从概念上讲，向菜单项添加加速器与向 Swing 组件添加加速器的技术类似。然而，当加速器被添加到菜单项时，按键组合会自动显示在菜单中（参见图 11.20）。\n\
  \n![Figure](img/menu5.jpg)图 11.20: 加速器\n\n在 Windows 下，Alt+F4 会关闭窗口。但这不是需要在 Java\
  \ 中编写的加速器。它是操作系统定义的快捷键。无论菜单上是否有“关闭”项，此按键组合始终会触发活动窗口的 `WindowClosing` 事件。\n\n`javax.swing.JMenuItem`1.2\n\
  * `JMenuItem(String label, int mnemonic)`\n  使用指定的标签和记忆键构造菜单项。\n* `void setAccelerator(KeyStroke\
  \ k)`\n  将击键 `k` 设置为此菜单项的加速器。加速键显示在标签旁边。\n\n`javax.swing.AbstractButton`1.2\n* `void\
  \ setMnemonic(int mnemonic)`\n  设置按钮的记忆字符。该字符在标签中将带有下划线。\n* `void setDisplayedMnemonicIndex(int\
  \ index)`1.4\n  设置按钮文本中带有下划线的字符的索引。如果你不希望记忆字符的第一次出现处带有下划线，请使用此方法。\n\n### 11.5.6.\
  \ 启用和禁用菜单项\n\n偶尔，菜单项应该只在特定的上下文中被选中。例如，一旦文档被设置为只读模式，你可以找到“保存”和“另存为”项并禁用它们。或者，你可以在显示菜单之前禁用项。要做到这一点，你必须为“菜单选中”事件注册一个监听器。`javax.swing.event`\
  \ 包定义了一个 `MenuListener` 接口，包含三个方法：\n\n```java\nvoid menuSelected(MenuEvent event)\n\
  void menuDeselected(MenuEvent event)\nvoid menuCanceled(MenuEvent event)\n```\n\n\
  `menuSelected` 方法在菜单显示*之前*调用。因此，它可以用于禁用或启用菜单项。以下代码显示了每当选中“只读”复选框菜单项时，如何禁用“保存”和“另存为”动作：\n\
  \n```java\npublic void menuSelected(MenuEvent event) {\n    saveAction.setEnabled(!readonlyItem.isSelected());\n\
  \    saveAsAction.setEnabled(!readonlyItem.isSelected());\n}\n```\n\n在显示菜单之前禁用菜单项是一个聪明的主意，但对于也带有加速键的菜单项无效。因为当按下加速键时菜单永远不会打开，动作永远不会被禁用，仍然会被加速键触发。\n\
  \n`javax.swing.JMenuItem`1.2\n* `void setEnabled(boolean b)`\n  启用或禁用菜单项。\n\n`javax.swing.event.MenuListener`1.2\n\
  * `void menuSelected(MenuEvent e)`\n  在菜单被选中、打开之前调用。\n* `void menuDeselected(MenuEvent\
  \ e)`\n  在菜单被取消选中、关闭之后调用。\n* `void menuCanceled(MenuEvent e)`\n  在菜单被取消时调用，例如，通过用户点击菜单外部时。\n\
  \nListing 11.6 是一个生成一组菜单的示例程序。它展示了你在本节中看到的所有功能：嵌套菜单、禁用的菜单项、复选框和单选按钮菜单项、弹出菜单以及键盘快捷键和加速器。\n\
  \nListing 11.6 v2ch11/menu/MenuFrame.java\n\n\n\n\n\n```java\npackage v2ch11.menu;\n\
  \nimport module java.desktop;\n\n/**\n * 一个带有示例菜单栏的框架。\n */\npublic class MenuFrame\
  \ extends JFrame {\n    private static final int DEFAULT_WIDTH = 300;\n    private\
  \ static final int DEFAULT_HEIGHT = 200;\n    private Action saveAction;\n    private\
  \ Action saveAsAction;\n    private JCheckBoxMenuItem readonlyItem;\n\n    /**\n\
  \     * 一个向 System.out 打印动作名称的示例动作。\n     */\n    class TestAction extends AbstractAction\
  \ {\n        public TestAction(String name) {\n            super(name);\n      \
  \  }\n\n        public void actionPerformed(ActionEvent event) {\n            System.out.println(getValue(Action.NAME)\
  \ + \" selected.\");\n        }\n    }\n\n    public MenuFrame() {\n        setSize(DEFAULT_WIDTH,\
  \ DEFAULT_HEIGHT);\n\n        var fileMenu = new JMenu(\"文件\");\n        fileMenu.add(new\
  \ TestAction(\"新建\"));\n\n        // 演示加速键\n\n        var openItem = fileMenu.add(new\
  \ TestAction(\"打开\"));\n        openItem.setAccelerator(KeyStroke.getKeyStroke(\"\
  ctrl O\"));\n\n        fileMenu.addSeparator();\n\n        saveAction = new TestAction(\"\
  保存\");\n        JMenuItem saveItem = fileMenu.add(saveAction);\n        saveItem.setAccelerator(KeyStroke.getKeyStroke(\"\
  ctrl S\"));\n\n        saveAsAction = new TestAction(\"另存为\");\n        fileMenu.add(saveAsAction);\n\
  \        fileMenu.addSeparator();\n\n        fileMenu.add(new AbstractAction(\"\
  退出\") {\n            public void actionPerformed(ActionEvent event) {\n        \
  \        System.exit(0);\n            }\n        });\n\n        // 演示复选框和单选按钮菜单\n\
  \n        readonlyItem = new JCheckBoxMenuItem(\"只读\");\n        readonlyItem.addActionListener(_\
  \ -> {\n            boolean saveOk = !readonlyItem.isSelected();\n            saveAction.setEnabled(saveOk);\n\
  \            saveAsAction.setEnabled(saveOk);\n        });\n\n        var group\
  \ = new ButtonGroup();\n\n        var insertItem = new JRadioButtonMenuItem(\"插入\"\
  );\n        insertItem.setSelected(true);\n        var overtypeItem = new JRadioButtonMenuItem(\"\
  覆盖\");\n\n        group.add(insertItem);\n        group.add(overtypeItem);\n\n \
  \       // 演示图标\n\n        var cutAction = new TestAction(\"剪切\");\n        cutAction.putValue(Action.SMALL_ICON,\
  \ new ImageIcon(\"images/cut.gif\"));\n        var copyAction = new TestAction(\"\
  拷贝\");\n        copyAction.putValue(Action.SMALL_ICON, new ImageIcon(\"images/copy.gif\"\
  ));\n        var pasteAction = new TestAction(\"粘贴\");\n        pasteAction.putValue(Action.SMALL_ICON,\
  \ new ImageIcon(\"images/paste.gif\"));\n\n        var editMenu = new JMenu(\"编辑\"\
  );\n        editMenu.add(cutAction);\n        editMenu.add(copyAction);\n      \
  \  editMenu.add(pasteAction);\n\n        // 演示嵌套菜单\n\n        var optionMenu = new\
  \ JMenu(\"选项\");\n\n        optionMenu.add(readonlyItem);\n        optionMenu.addSeparator();\n\
  \        optionMenu.add(insertItem);\n        optionMenu.add(overtypeItem);\n\n\
  \        editMenu.addSeparator();\n        editMenu.add(optionMenu);\n\n       \
  \ // 演示助记符\n\n        var helpMenu = new JMenu(\"帮助\");\n        helpMenu.setMnemonic('H');\n\
  \n        var indexItem = new JMenuItem(\"索引\");\n        indexItem.setMnemonic('I');\n\
  \        helpMenu.add(indexItem);\n\n        // 你也可以将助记符键添加到动作中\n        var aboutAction\
  \ = new TestAction(\"关于\");\n        aboutAction.putValue(Action.MNEMONIC_KEY, Integer.valueOf('A'));\n\
  \        helpMenu.add(aboutAction);\n\n        // 将所有顶层菜单添加到菜单栏\n\n        var menuBar\
  \ = new JMenuBar();\n        setJMenuBar(menuBar);\n\n        menuBar.add(fileMenu);\n\
  \        menuBar.add(editMenu);\n        menuBar.add(helpMenu);\n\n        // 演示弹出菜单\n\
  \n        JPopupMenu popup = new JPopupMenu();\n        popup.add(cutAction);\n\
  \        popup.add(copyAction);\n        popup.add(pasteAction);\n\n        var\
  \ panel = new JPanel();\n        panel.setComponentPopupMenu(popup);\n        add(panel);\n\
  \    }\n}\n```\n\n### 11.5.7. 工具栏\n\n工具栏是一个按钮栏，提供了快速访问程序中最常用的命令（参见图 11.22）。\n\n\
  ![Figure](img/toolbar1.jpg)图 11.22: 工具栏\n\n工具栏的特殊之处在于你可以将其移动其他地方。你可以将工具栏拖动到框架的四个边界之一（参见图\
  \ 11.23）。当你释放鼠标按钮时，工具栏将落到新位置（参见图 11.24）。\n\n![Figure](img/toolbar2.jpg)图 11.23:\
  \ 拖动工具栏![Figure](img/toolbar3.jpg)图 11.24: 工具栏已拖到另一个边界\n\n如果工具栏位于具有边界布局（border layout）的容器，或任何支持\
  \ `North`、`East`、`South` 和 `West` 约束的布局管理器中，工具栏拖动功能即可生效。\n\n工具栏可以从框架中完全分离。分离的工具栏包含在框架中（参见图\
  \ 11.25）。\n\n![Figure](img/toolbar4.jpg)图 11.25: 分离工具栏\n\n工具栏的实现非常简单。向工具栏添加组件：\n\
  \n```java\nvar toolbar = new JToolBar();\ntoolbar.add(blueButton);\n```\n\n`JToolBar`\
  \ 类也有方法添加 `Action` 对象，如下：\n\n```java\nvar toolbar = new JToolBar();\ntoolbar.add(blueAction);\n\
  ```\n\n图标显示在工具栏中。你可以使用分隔符来分隔按钮组：\n\n```java\ntoolbar.addSeparator();\n```\n\n例如，图\
  \ 11.22](#index.xhtml_v2ch11fig24) 中的工具栏有一个分隔符（不，应该是：例如，图 11.22](#index.xhtml_v2ch11fig24)\
  \ 中的工具栏在第三和第四个按钮之间有一个分隔符）。\n\n```java\ntoolbar.addSeparator();\n```\n\n然后将工具栏添加到框架中：\n\
  \n```java\nadd(toolbar, BorderLayout.NORTH);\n```\n\n你也可以为工具栏指定标题：\n\n```java\n\
  toolbar = new JToolBar(titleString);\n```\n\n默认情况下，工具栏是水平的。要让工具栏变为垂直方向，请使用\n\n```java\n\
  toolbar = new JToolBar(SwingConstants.VERTICAL)\n```\n\n或者\n\n```java\ntoolbar =\
  \ new JToolBar(titleString, SwingConstants.VERTICAL)\n```\n\n按钮是工具栏内部常见的组件。但对向工具栏添加的组件没有限制。例如，你可以向工具栏添加组合框。\n\
  \n### 11.5.8. 提示\n\n工具栏的一个缺点是用户经常对图标的含义感到困惑。为了解决这个问题，界面设计师发明了提示。当鼠标悬留在按钮上方一段时间，提示就会激活。提示文本显示在彩色矩形中。当用户移动鼠标时，提示就会消失。（参见图\
  \ 11.26）。\n\n![Figure](img/toolbar5.jpg)图 11.26: 提示\n\n在 Swing 中，你可以简单地通过调用 `setToolTipText`\
  \ 方法为任何 `JComponent` 添加提示：\n\n```java\nexitButton.setToolTipText(\"退出\");\n```\n\
  \n或者，如果你使用 `Action` 对象，可以将提示与 `SHORT_DESCRIPTION` 键关联：\n\n```java\nexitAction.putValue(Action.SHORT_DESCRIPTION,\
  \ \"退出\");\n```\n\n\n\n\n到目前为止，我们的示例应用程序界面仅使用了边界布局（border layout）、流式布局（flow layout）和网格布局（grid\
  \ layout）。对于更复杂的任务，这些是不够的。\n\n自 Java 1.0 以来，AWT 就包含了 `grid bag layout`，它以行和列的形式排列组件。行和列的大小是灵活的，组件可以跨越多行多列。这种布局管理器非常灵活，但也非常复杂。仅仅是“grid\
  \ bag layout”这几个字，就让 Java 程序员感到恐惧。\n\nSwing 设计者曾尝试设计一种能让程序员从 grid bag layout 的暴政下解脱出来的布局管理器，并想出了\
  \ `box layout`。根据 `BoxLayout` 类的 JDK 文档：“嵌套具有不同水平和垂直[*sic*]组合的多个面板，可以产生类似于 `GridBagLayout`\
  \ 的效果，而没有后者的复杂性。”然而，由于每个框都是独立布局的，你无法使用框布局同时在水平和垂直方向上排列相邻的组件。\n\nJava 1.4 出现了另一个设计\
  \ grid bag layout 替代方案尝试——`spring layout`，你使用想象的弹簧来连接容器中的组件。随着容器调整大小，弹簧会拉伸或收缩，从而调整组件的位置。这听起来既乏味又混乱，事实也如此。spring\
  \ layout 很快就被边缘化了。\n\nNetBeans IDE 了布局工具（称为“Matisse”）和布局管理器。用户界面设计师使用该工具将组件拖入容器中，并指示哪些组件应该对齐。该工具将设计师的意图翻译成给\
  \ `group layout manager` 的指令。这比手动编写布局管理代码要方便得多。\n\n在接下来的章节中，我将介绍 grid bag layout，因为它被广泛使用，并且是通过程序生成布局代码的最简单机制。我将向你展示一种策略，在常见情况下让\
  \ grid bag layout 变得不再痛苦。\n\n### 11.6.1 Grid Bag 基础\n\ngrid bag layout 是所有布局管理器的母体。你可以将\
  \ grid bag layout 理解为没有限制的网格布局。在 grid bag layout 中，行和列可以有任意的大小。你可以合并相邻单元格以为更大的组件留出空间。（许多文字处理器以及\
  \ HTML 都为表格提供了类似的功能：你可以从网格开始，然后根据需要合并相邻单元格。）组件不需要填充整个单元格区域，你可以指定它们在单元格内的对齐方式。\n\n\
  考虑图 11.27 中的字体选择器。它由以下组件组成：\n\n* 两个指定字体和大小的组合框\n* 这两个组合框的标签\n* 两个用于选择粗体和斜体的复选框\n\
  * 一个用于示例字符串的文本区域\n\n![Figure](img/gridbaglayouttest.jpg)图 11.27：字体选择器\n\n现在，将容器划分为单元格网格，如图\
  \ 11.28 所示。（行和列的大小不需要相等。）每个复选框跨越两列，文本区域跨越四行。\n\n.图 11.28：设计中使用的对话框网格\n\n要向 grid\
  \ bag 管理器描述布局，请使用以下步骤：\n\n1. 创建一个 `GridBagLayout` 类型的对象。你不需要告诉它底层网格有多少行多少列。相反，布局管理器将尝试根据你之后提供的信息来猜测。\n\
  2. 将此 `GridBagLayout` 对象设置为该组件的布局管理器。\n3. 对于每个组件，创建一个 `GridBagConstraints` 类型的对象。设置\
  \ `GridBagConstraints` 对象的字段值以指定组件在 grid bag 内的布局方式。\n4. 最后，通过调用以下方法带有约束添加每个组件：\n\
  \n```\nadd(component, constraints);\n```\n\n这是一个所需的代码示例。（我们将在后面的章节中详细介绍各种约束——所以如果你不知道某些约束的作用，请不要担心。）\n\
  \n```\nvar layout = new GridBagLayout();\npanel.setLayout(layout);\nvar constraints\
  \ = new GridBagConstraints();\nconstraints.weightx = 100;\nconstraints.weighty =\
  \ 100;\nconstraints.gridx = 0;\nconstraints.gridy = 2;\nconstraints.gridwidth =\
  \ 2;\nconstraints.gridheight = 1;\npanel.add(component, constraints);\n```\n\n技巧在于知道如何设置\
  \ `GridBagConstraints` 对象的状态。我们将在后面的章节中讨论这个对象。\n\n### 11.6.2 `gridx`, `gridy`, `gridwidth`\
  \ 和 `gridheight` 参数\n\n`gridx`、`gridy`、`gridwidth` 和 `gridheight` 约束定义了组件在网格中的位置。`gridx`\
  \ 和 `gridy` 值指定了要添加的组件左上角的列行位置。`gridwidth` 和 `gridheight` 值决定了组件占据的列数和行。\n\n左上角的\
  \ `gridx = 0` 且 `gridy = 0`。我们示例中的文本区域 `gridx = 2`, `gridy = 0`，因为它从第 0 行的第 2 列（即第三列）开始。它的\
  \ `gridwidth = 1` 且 `gridheight = 4`，因为它跨越了一列四行。\n\n### 11.6.3 权重字段 (Weight Fields)\n\
  \n你总是需要为 grid bag 中的每个区域设置权重字段（`weightx` 和 `weighty`）。如果你将区域的权重设置为 `0`，区域就不会超过其初始大小。在\
  \ 11.27 的 grid bag 布局中，我们将标签的 `weightx` 字段设置为 `0`。这允许标签在调整窗口大小时保持宽度不变。另一方面，如果你将所有区域的权重设置为\
  \ `0`，容器将聚集在区域中心而不是填充它。\n\n从概念上讲，权重参数的问题在于权重是行和列的属性，而不是单个单元格的。但你需要为单元格指定它们，因为 grid\
  \ bag 布局没有暴露行和列。行和列权重是通过每行/列中单元权重计算出来的。因此，如果你想让某行或列保持固定大小，需要将其中所有组件的权重设置为零。\n\n\
  注意，权重并没有给出列的比例。它们告诉如果容器超过其首选大小时，应该分配多少比例的剩余空间。这并不直观。我建议你将所有权重设置为 `100`。然后，运行程序查看布局效果。调整对话框查看行和列如何调整。如果你发现某行或某列不应该增长，请将其其中所有组件的权重设置为零。你可以尝试其他权重值，但通常是不值得的。\n\
  \n### 11.6.4 `fill` 和 `anchor` 参数\n\n如果你不希望组件拉伸并填充整个区域，请设置 `fill` 约束。该参数有四种可能性：有效值为\
  \ `GridBagConstraints.NONE`、`GridBagConstraints.HORIZONTAL`、`GridBagConstraints.VERTICAL`\
  \ 和 `GridBagConstraints.BOTH`。\n\n如果组件没有填充整个区域，你可以通过设置 `anchor` 字段来指定它在区域中的位置。有效值为\
  \ `GridBagConstraints.CENTER`（默认值）、`GridBagConstraints.NORTH`、`GridBagConstraints.NORTHEAST`、`GridBagConstraints.EAST`\
  \ 等。\n\n### 11.6.5 内边距 (Padding)\n\n你可以通过设置 `GridBagConstraints` 的 `insets` 字段在组件周围添加额外的空白空间。设置\
  \ `Insets` 对象的 `left`、`top`、`right` 和 `bottom` 值为希望在组件周围留的空间。这被称为*外部边距*（external\
  \ padding）。\n\n\n\n\n\n`ipadx` 和 `ipady` 值设置内部内边距。这些值会被加上组件的最小宽度和高度。这确保了组件不会缩小到其最小尺寸。\n\
  \n### 11.6.6. 指定 `gridx`、`gridy`、`gridwidth` 和 `gridheight` 参数的替代方法\n\nAWT 文档建议不要将\
  \ `gridx` 和 `gridy` 值设为绝对位置，而是将它们设置为常量 `GridBagConstraints.RELATIVE`。然后，按照标准顺序将组件添加到网格布局中，即从第一行从左到右，然后移动到下一行，依此类推。\n\
  \n你仍然可以通过提供相应的 `gridheight` 和 `gridwidth` 字段来指定跨越的行数和列数。然而，如果组件延伸到最后一行或最后一列，你不需要指定实际数字，而是使用常量\
  \ `GridBagConstraints.REMAINDER`。这告诉布局管理器该组件是所在行的最后一个组件。\n\n这种方案似乎确实有效。但向布局管理器隐藏实际位置信息并希望它能重新发现这些信息，听起来确实非常笨拙。\n\
  \n### 11.6.7. 网格布局配方\n\n在实践中，以下配方可以使网格布局变得相对易于处理：\n\n1.  在纸上画出组件布局。\n2.  找到一个网格，使得小型组件各包含在一个单元格中，而较大的组件跨越多个单元格。\n\
  3.  用 0, 1, 2, 3, . . . 为网格的行和列标记。你可以读取 `gridx`、`gridy`、`gridwidth` 和 `gridheight`\
  \ 值。\n4.  对于每个组件，问自己它是否需要水平或垂直填充其单元格。如果没有，你希望它如何对齐？这决定了 `fill` 和 `anchor` 参数。\n\
  5.  将所有权重都设置为 `100`。然而，如果你希望某一行或某列始终保持其默认大小，则将属于该行或该列的所有组件的 `weightx` 或 `weighty`\
  \ 设置为 `0`。\n6.  编写代码。仔细双检查你的 `GridBagConstraints` 设置。一个错误的约束就会破坏你的整个布局。\n7.  编译、运行并享受其中。\n\
  \n### 11.6.8. 用于驯服网格约束的辅助类\n\n网格布局最乏味 Aspect 是编写设置约束的代码。大多数程序员为此目的编写辅助函数或小型辅助类。我在字体对话框示例的完整代码之后介绍了这样一个类。该类具有以下特性：\n\
  \n*   它的名字很短：`GBC` 而不是 `GridBagConstraints`。\n*   它继承自 `GridBagConstraints`，因此你可以使用较短的常量，如\
  \ `GBC.EAST`。\n*   在添加组件时使用 `GBC` 对象，例如：\n\n    ```\n    add(component, new GBC(1,\
  \ 2));\n    ```\n*   有两个构造函数来设置最常用的参数：`gridx` 和 `gridy`，或者 `gridx`、`gridy`、`gridwidth`\
  \ 和 `gridheight`。\n\n    ```\n    add(component, new GBC(1, 2, 1, 4));\n    ```\n\
  *   对于成 `x`/`y` 对出现的字段提供了方便的 setter 方法：\n\n    ```\n    add(component, new GBC(1,\
  \ 2).setWeight(100, 100));\n    ```\n*   setter 方法返回 `this`，因此你可以链式调用：\n\n    ```\n\
  \    add(component, new GBC(1, 2).setAnchor(GBC.EAST).setWeight(100, 100));\n  \
  \  ```\n*   `setInsets` 方法会为你构造 `Insets` 对象。要获得一个像素的内边距，只需调用：\n\n    ```\n    add(component,\
  \ new GBC(1, 2).setAnchor(GBC.EAST).setInsets(1));\n    ```\n\n列表 11.7 显示了字体对话框示例的框架类。`GBC`\
  \ 辅助类位于列表 11.8。以下是将组件添加到网格布局的代码：\n\n```\nadd(faceLabel, new GBC(0, 0).setAnchor(GBC.EAST));\n\
  add(face, new GBC(1, 0).setFill(GBC.HORIZONTAL).setWeight(100, 0).setInsets(1));\n\
  add(sizeLabel, new GBC(0, 1).setAnchor(GBC.EAST));\nadd(size, new GBC(1, 1).setFill(GBC.HORIZONTAL).setWeight(100,\
  \ 0).setInsets(1));\nadd(bold, new GBC(0, 2, 2, 1).setAnchor(GBC.CENTER).setWeight(100,\
  \ 100));\nadd(italic, new GBC(0, 3, 2, 1).setAnchor(GBC.CENTER).setWeight(100, 100));\n\
  add(sample, new GBC(2, 0, 1, 4).setFill(GBC.BOTH).setWeight(100, 100));\n```\n\n\
  一旦你理解了网格约束，这段代码就易读了。\n\n\n\n\n\n```java\npackage v2ch11.gridbag;\n\nimport module\
  \ java.desktop;\n\n/**\n * 此类简化了 GridBagConstraints 类的使用。\n */\npublic class GBC\
  \ extends GridBagConstraints {\n    /**\n     * 构建一个给定 gridx 和 gridy 位置的 GBC，并将所有其他\
  \ grid bag \n     * 约束值设置为默认值。\n     * @param gridx the gridx 位置\n     * @param\
  \ gridy the gridy 位置\n     */\n    public GBC(int gridx, int gridy) {\n        this.gridx\
  \ = gridx;\n        this.gridy = gridy;\n    }\n\n    /**\n     * 构建一个给定 gridx,\
  \ gridy, gridwidth, gridheight 的 GBC，并将所有其他 grid bag\n     * 约束值设置为默认值。\n     *\
  \ @param gridx the gridx 位置\n     * @param gridy the gridy 位置\n     * @param gridwidth\
  \ x 方向的单元格跨度\n     * @param gridheight y 方向的单元格跨度\n     */\n    public GBC(int gridx,\
  \ int gridy, int gridwidth, int gridheight) {\n        this.gridx = gridx;\n   \
  \     this.gridy = gridy;\n        this.gridwidth = gridwidth;\n        this.gridheight\
  \ = gridheight;\n    }\n\n    /**\n     * 设置锚点。\n     * @param anchor 锚点值\n    \
  \ * @return 返回此对象以便进一步修改\n     */\n    public GBC setAnchor(int anchor) {\n    \
  \    this.anchor = anchor;\n        return this;\n    }\n\n    /**\n     * 设置填充方向。\n\
  \     * @param fill 填充方向\n     * @return 返回此对象以便进一步修改\n     */\n    public GBC setFill(int\
  \ fill) {\n        this.fill = fill;\n        return this;\n    }\n\n    /**\n \
  \    * 设置单元格权重。\n     * @param weightx x 方向的单元格权重\n     * @param weighty y 方向的单元格权重\n\
  \     * @return 返回此对象以便进一步修改\n     */\n    public GBC setWeight(double weightx,\
  \ double weighty) {\n        this.weightx = weightx;\n        this.weighty = weighty;\n\
  \        return this;\n    }\n\n    /**\n     * 设置此单元格的内边距。\n     * @param distance\
  \ 所有方向使用的间距\n     * @return 返回此对象以便进一步修改\n     */\n    public GBC setInsets(int\
  \ distance) {\n        this.insets = new Insets(distance, distance, distance, distance);\n\
  \        return this;\n    }\n\n    /**\n     * 设置此单元格的内边距。\n     * @param top 上部的间距\n\
  \     * @param left 左侧的间距\n     * @param bottom 下部的间距\n     * @param right 右侧的间距\n\
  \     * @return 返回此对象以便进一步修改\n     */\n    public GBC setInsets(int top, int left,\
  \ int bottom, int right) {\n        this.insets = new Insets(top, left, bottom,\
  \ right);\n        return this;\n    }\n\n    /**\n     * 设置内部填充。\n     * @param\
  \ ipadx x 方向的内部填充\n     * @param ipady y 方向的内部填充\n     * @return 返回此对象以便进一步修改\n\
  \     */\n    public GBC setIpad(int ipadx, int ipady) {\n        this.ipadx = ipadx;\n\
  \        this.ipady = ipady;\n        return this;\n    }\n}\n```\n\n`java.awt.GridBagConstraints`\
  \ 1.0\n\n*   `int gridx`\n    `int gridy`\n    指定单元格的起始列和行。默认值为 `0`。\n\n*   `int\
  \ gridwidth`\n    `int gridheight`\n    指定单元格的列和行跨度。默认值为 `1`。\n\n*   `double weightx`\n\
  \    `double weighty`\n    指定单元格的增长能力。默认值为 `0`。\n\n*   `int anchor`\n    表示组件在单元格内的对齐方式。你可以从绝对位置之间选择：\n\
  \n    | `NORTHWEST` | `NORTH` | `NORTHEAST` |\n    | `WEST` | `CENTER` | `EAST`\
  \ |\n    | `SOUTHWEST` | `SOUTH` | `SOUTHEAST` |\n\n    或者选择与方向无关的对应项：\n\n    |\
  \ `FIRST_LINE_START` | `LINE_START` | `FIRST_LINE_END` |\n    | `PAGE_START` | `CENTER`\
  \ | `PAGE_END` |\n    | `LAST_LINE_START` | `LINE_END` | `LAST_LINE_END` |\n\n \
  \   如果你的应用程序可能针对从右到左或从上到下的文本进行本地化，请使用后者。默认值为 `CENTER`。\n\n*   `int fill`\n    指定组件在单元格内的填充行为：`NONE`、`BOTH`、`HORIZONTAL`\
  \ 或 `VERTICAL` 之一。默认值为 `NONE`。\n\n*   `int ipadx`\n    `int ipady`\n    指定组件周围的“内部”填充。默认值为\
  \ `0`。\n\n*   `Insets insets`\n    指定沿单元格边界的“外部”填充。默认没有间距。\n\n*   `GridBagConstraints(int\
  \ gridx, int gridy, int gridwidth, int gridheight, double weightx, double weighty,\
  \ int anchor, int fill, Insets insets, int ipadx, int ipady)` 1.2\n    通过参数指定的所有字段来构建一个\
  \ `GridBagConstraints`。此构造函数应该只由自动生成器使用，因为它会使你的源代码非常难以阅读。\n\n## 11.7 自定义布局管理器\n\n\
  你可以设计自己的 `LayoutManager` 类，以特殊的方式管理组件。作为一个趣味性示例，让我们把容器中的所有组件排列成一个圆（见图 11.29）。\n\n\
  ![图片](img/circlelayouttest.jpg)图 11.29: 圆形布局\n\n你自己的布局管理器必须实现 `LayoutManager` 接口。你需要重写以下五个方法：\n\
  \n```java\nvoid addLayoutComponent(String s, Component c)\nvoid removeLayoutComponent(Component\
  \ c)\nDimension preferredLayoutSize(Container parent)\nDimension minimumLayoutSize(Container\
  \ parent)\nvoid layoutContainer(Container parent)\n```\n\n前两个方法在组件添加或删除时调用。如果你不保留关于组件的任何额外信息，可以什么它们什么都不做。接下来两个方法计算组件最小布局和首选布局所需的空间。这些通常是相同的数值。第五个方法执行实际工作，并对所有组件调用\
  \ `setBounds`。\n\nAWT 有第二个接口，称为 `LayoutManager2`，它有十个方法需要实现而不是五个。`LayoutManager2`\
  \ 接口的核心在于允许你使用带约束的 `add` 方法。例如，`BorderLayout` 和 `GridBagLayout` 实现了 `LayoutManager2`\
  \ 接口。\n\n列表 11.9 显示了 `CircleLayout` 管理器的代码，遗憾的是，它只是在父容器内部沿圆周排列组件。示例程序的框架类在 列表 11.10\
  \ 中。\n\n列表 11.9 v2ch11/circleLayout/CircleLayout.java\n\n\n\n\n\n```java\npackage\
  \ v2ch11.circleLayout;\n\nimport module java.desktop;\n\n/**\n * 一个沿着圆形布局组件的布局管理器。\n\
  \ */\npublic class CircleLayout implements LayoutManager {\n    private int minWidth\
  \ = 0;\n    private int minHeight = 0;\n    private int preferredWidth = 0;\n  \
  \  private int preferredHeight = 0;\n    private boolean sizesSet = false;\n   \
  \ private int maxComponentWidth = 0;\n    private int maxComponentHeight = 0;\n\n\
  \    public void addLayoutComponent(String name, Component comp) {\n    }\n\n  \
  \  public void removeLayoutComponent(Component comp) {\n    }\n\n    public void\
  \ setSizes(Container parent) {\n        if (sizesSet) return;\n        int n = parent.getComponentCount();\n\
  \n        preferredWidth = 0;\n        preferredHeight = 0;\n        minWidth =\
  \ 0;\n        minHeight = 0;\n        maxComponentWidth = 0;\n        maxComponentHeight\
  \ = 0;\n\n        // 计算组件的最大宽度和高度\n        //并将首选大小设置为所有组件尺寸之和\n        for (int\
  \ i = 0; i < n; i++) {\n            Component c = parent.getComponent(i);\n    \
  \        if (c.isVisible()) {\n                Dimension d = c.getPreferredSize();\n\
  \                maxComponentWidth = Math.max(maxComponentWidth, d.width);\n   \
  \             maxComponentHeight = Math.max(maxComponentHeight, d.height);\n   \
  \             preferredWidth += d.width;\n                preferredHeight += d.height;\n\
  \            }\n        }\n        minWidth = preferredWidth / 2;\n        minHeight\
  \ = preferredHeight / 2;\n        sizesSet = true;\n    }\n\n    public Dimension\
  \ preferredLayoutSize(Container parent) {\n        setSizes(parent);\n        Insets\
  \ insets = parent.getInsets();\n        int width = preferredWidth + insets.left\
  \ + insets.right;\n        int height = preferredHeight + insets.top + insets.bottom;\n\
  \        return new Dimension(width, height);\n    }\n\n    public Dimension minimumLayoutSize(Container\
  \ parent) {\n        setSizes(parent);\n        Insets insets = parent.getInsets();\n\
  \        int width = minWidth + insets.left + insets.right;\n        int height\
  \ = minHeight + insets.top + insets.bottom;\n        return new Dimension(width,\
  \ height);\n    }\n\n    public void layoutContainer(Container parent) {\n     \
  \   setSizes(parent);\n\n        // 计算圆的中心\n\n        Insets insets = parent.getInsets();\n\
  \        int containerWidth = parent.getSize().width - insets.left - insets.right;\n\
  \        int containerHeight = parent.getSize().height - insets.top - insets.bottom;\n\
  \n        int xcenter = insets.left + containerWidth / 2;\n        int ycenter =\
  \ insets.top + containerHeight / 2;\n\n        // 计算圆的半径\n\n        int xradius\
  \ = (containerWidth - maxComponentWidth) / 2;\n        int yradius = (containerHeight\
  \ - maxComponentHeight) / 2;\n        int radius = Math.min(xradius, yradius);\n\
  \n        // 沿着圆形布局组件\n\n        int n = parent.getComponentCount();\n        for\
  \ (int i = 0; i < n; i++) {\n            Component c = parent.getComponent(i);\n\
  \            if (c.isVisible()) {\n                double angle = 2 * Math.PI *\
  \ i / n;\n\n                // 组件的中心点\n                int x = xcenter + (int) (Math.cos(angle)\
  \ * radius);\n                int y = ycenter + (int) (Math.sin(angle) * radius);\n\
  \n                // 移动组件使其中心点位于 (x, y)\n                // 其大小为首选尺寸\n         \
  \       Dimension d = c.getPreferredSize();\n                c.setBounds(x - d.width\
  \ / 2, y - d.height / 2, d.width, d.height);\n            }\n        }\n    }\n\
  }\n```\n列表 11.10 `v2ch11/circleLayout/CircleLayoutFrame.java`\n\n```java\npackage\
  \ v2ch11.circleLayout;\n\nimport module java.desktop;\n\n/**\n * 一个显示沿圆形排列按钮的框架。\n\
  \ */\npublic class CircleLayoutFrame extends JFrame {\n    public CircleLayoutFrame()\
  \ {\n        setLayout(new CircleLayout());\n        add(new JButton(\"Yellow\"\
  ));\n        add(new JButton(\"Blue\"));\n        add(new JButton(\"Red\"));\n \
  \       add(new JButton(\"Green\"));\n        add(new JButton(\"Orange\"));\n  \
  \      add(new JButton(\"Fuchsia\"));\n        add(new JButton(\"Indigo\"));\n \
  \       pack();\n    }\n}\n```\n`java.awt.LayoutManager1.0`\n\n*   `void addLayoutComponent(String\
  \ name, Component comp)`\n    将组件添加到布局中。\n*   `void removeLayoutComponent(Component\
  \ comp)`\n    从布局中移除一个组件。\n*   `Dimension preferredLayoutSize(Container cont)`\n\
  \    返回在该布局下容器的首选尺寸维度。\n*   `Dimension minimumLayoutSize(Container cont)`\n    返回在该布局下容器的最小尺寸维度。\n\
  *   `void layoutContainer(Container cont)`\n    对容器中的组件进行布局。\n\n## 11.8 对话框 (Dialog\
  \ Boxes)\n\n在 GUI 应用程序中，你通常希望弹出独立的对话框来提供信息或获取信息。\n\n与大多数操作系统一样，AWT 区分了*模态*（modal）和*非模态*（modeless）对话框。模态对话框在关闭之前会阻塞交互，而非模态对话框允许与应用程序的其余部分进行交互。让我们从简单的对话框——带有单个消息的模态对话框开始本节。Swing\
  \ 有一个方便的 `JOptionPane` 类可以创建这些对话框。接下来，你将看到如何通过实现自己的对话框来编写更复杂的对话框。最后，你将看到如何向对话框之间传输数据。我们将通过查看\
  \ `JFileChooser` 来结束对对话框的讨论。\n\n### 11.8.1 选项面板 (Option Panes)\n\nSwing 提供了一系列现成的简单对话框，足以向用户询问某个信息。`JOptionPane`\
  \ 有四个静态方法来显示这些对话框：\n\n*   `showMessageDialog`: 显示消息并等待用户点击确定。\n*   `showConfirmDialog`:\
  \ 显示消息并获取确认（如 确定/取消）。\n*   `showOptionDialog`: 显示消息并获取一个选项（通常来自一组按钮）。\n*   `showInputDialog`:\
  \ 显示消息并获取用户输入（通常来自输入字段或组合框）。\n\n图 11.30 显示了一个典型的对话框。如你所见，对话框包含以下组件：\n\n*   一个图标\n\
  *   一条消息\n*   一个或多个选项按钮\n\n输入对话框还有一个用于用户输入的组件。它可以是一个用户可以在其中输入任意字符串的文本字段，也可以是一个用户可以从中选择一个项的组合框。\n\
  \n这些对话框的精确布局以及标准消息类型的图标选择取决于可插的外观（look-and-feel）。左侧的图标取决于五种*消息类型*之一：\n\n```\nERROR_MESSAGE\n\
  INFORMATION_MESSAGE\nWARNING_MESSAGE\nQUESTION_MESSAGE\nPLAIN_MESSAGE\n```\n\n`PLAIN_MESSAGE`\
  \ 类型没有图标。每个对话框类型都有一个方法可以让你提供自定义图标来替换。对于每种对话框类型，你都可以指定消息。此消息可以是字符串、图标、用户界面组件或其他任何对象。以下是消息对象的显示方式：\n\
  \n*   `String`: 绘制字符串\n*   `Icon`: 显示图标\n*   `Component`: 显示组件\n*   `Object[]`:\
  \ 显示数组中的所有对象，并堆叠在一起\n\n\n\n\n\n| 其他任何对象 | 应用 `toString` 并显示生成的字符串 |\n\n当然，提供消息字符串是目前最常见的情况。提供一个\
  \ `Component` 可以给你提供极大的灵活性，因为你可以让 `paintComponent` 方法绘制你想要的任何内容。\n\n底部的按钮取决于对话框类型和\
  \ `option type`（选项类型）。在调用 `showMessageDialog` 和 `showInputDialog` 时，你只会得到标准的按钮（分别是\
  \ OK 和 OK/Cancel）。调用 `showConfirmDialog` 时，你可以在四种选项类型中选择：\n\n```\nDEFAULT_OPTION\n\
  YES_NO_OPTION\nYES_NO_CANCEL_OPTION\nOK_CANCEL_OPTION\n```\n\n通过 `showOptionDialog`，你可以指定一组任意的选项。你提供一个对象数组作为选项。每个数组元素的渲染方式如下如下：\n\
  \n| `String` | 以该字符串为标签创建一个按钮 |\n| `Icon` | 以该图标为标签创建一个按钮 |\n| `Component` | 显示该组件\
  \ |\n| 其他任何对象 | 应用 `toString` 并以生成的字符串为标签创建一个按钮 |\n\n这些函数的返回值如下：\n\n| `showMessageDialog`\
  \ | 无 |\n| `showConfirmDialog` | 代表所选选项的整数 |\n| `showOptionDialog` | 代表所选选项的整数 |\n\
  | `showInputDialog` | 用户提供或选择的字符串 |\n\n`showConfirmDialog` 和 `showOptionDialog`\
  \ 返回整数以指示用户选择了哪个按钮。对于选项对话框，这仅仅是所选选项的索引；如果用户关闭了对话框而不是选择选项，则返回 `CLOSED_OPTION`。对于确认对话框，返回值可以是以下之一：\n\
  \n```\nOK_OPTION\nCANCEL_OPTION\nYES_OPTION\nNO_OPTION\nCLOSED_OPTION\n```\n\n这些听起来像是一组令人困惑的选择，但在实践中非常简单。遵循这些步骤操作：\n\
  \n1. 选择对话框类型（消息、确认、选项或输入）。\n2. 选择图标（错误、信息、警告、问题、无或自定义）。\n3. 选择消息（字符串、图标、自定义组件或它们的组合）。\n\
  4. 对于确认对话框，选择选项类型（默认、Yes/No、Yes/No/Cancel 或 OK/Cancel）。\n5. 对于选项对话框，选择选项（字符串、图标或自定义组件）以及默认选项。\n\
  6. 对于输入对话框，在文本字段和组合框之间进行选择。\n7. 在 `JOptionPane` API 中找到相应的调用方法。\n\n例如，假设你想在 图 11.30\
  \ 中显示对话框。该对话框显示一条消息并请求用户确认或取消。因此，这是一个确认对话框。图标是一个问号图标。消息是一个字符串。选项类型是 `OK_CANCEL_OPTION`。以下是你将进行的调用：\n\
  \n```\nint selection = JOptionPane.showConfirmDialog(parent,\n    \"Message\", \"\
  Title\",\n    JOptionPane.OK_CANCEL_OPTION,\n    JOptionPane.QUESTION_MESSAGE);\n\
  if (selection == JOptionPane.OK_OPTION) . . .\n```\n\n消息字符串可以包含换行符（`'\\n'`）。此类字符串将多行显示。\n\
  \n`javax.swing.JOptionPane`1.2\n\n* `static void showMessageDialog(Component parent,\
  \ Object message, String title, int messageType, Icon icon)`\n* `static void showMessageDialog(Component\
  \ parent, Object message, String title, int messageType)`\n* `static void showMessageDialog(Component\
  \ parent, Object message)`\n* `static void showInternalMessageDialog(Component parent,\
  \ Object message, String title, int messageType, Icon icon)`\n* `static void showInternalMessageDialog(Component\
  \ parent, Object message, String title, int messageType)`\n* `static void showInternalMessageDialog(Component\
  \ parent, Object message)`\n  显示消息对话框或内部消息对话框。（内部对话框完全渲染在其所有者的框架内.）父组件可以为 `null`。在对话框上显示的消息可以是字符串、图标、组件或它们的数组。`messageType`\
  \ 参数是 `ERROR_MESSAGE`、`INFORMATION_MESSAGE`、`WARNING_MESSAGE`、`QUESTION_MESSAGE`\
  \ 或 `PLAIN_MESSAGE` 之一。\n* `static int showConfirmDialog(Component parent, Object\
  \ message, String title, int optionType, int messageType, Icon icon)`\n* `static\
