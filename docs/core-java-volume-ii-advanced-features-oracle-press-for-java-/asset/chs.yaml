  *   `static TemporalAdjuster previousWorkingDay(TemporalField range)`\n\n## 6.4.\
  \ 本地时间 (Local Time)\n\n`LocalTime` 表示时间，例如 15:30。你可以通过 `now` 或 `of` 方法创建：\n\n```\n\
  LocalTime now = LocalTime.now();\nLocalTime bedtime = LocalTime.of(22, 30); // 或\
  \ LocalTime.of(22, 30, 0)\n```\n\n`LocalTime` 不涉及 AM/PM。有一个 `LocalDateTime` 类表示日期和时间。`LocalTime`\
  \ 显示了常见的持续操作。例如，\n\n```\nLocalTime wakeup = bedtime.plusHours(8); // wakeup 是 6:30\n\
  ```\n\n`LocalTime` 适用于存储时间。但如果你需要跨夏令时的计算，或者需要处理时区，应该使用我们讨论的 `ZonedDateTime` 类。\n\
  \n`java.time.LocalTime`\n\n*   `static LocalTime now()`\n    获取当前的 `LocalTime`。\n\
  *   `static LocalTime of(int hour, int minute)`\n*   `static LocalTime of(int hour,\
  \ int minute, int second)`\n*   `static LocalTime of(int hour, int minute, int second,\
  \ int nano)`\n    产生具有给定小时（0 到 23）、分钟（0 到 59）和纳秒（0 到 999,999,999）的 `LocalTime`。\n\
  *   `LocalTime plusXxx(`long number)`\n*   `LocalTime minusXxx(`long number)`\n\
  \    产生通过加或减给定的时间单位而得到的 `LocalTime`，其中 `Xxx` 是 `Hours`、`Minutes` 或 `Seconds`。\n\
  *   `LocalTime withXxx(`int value)`\n    返回一个时间单位更改为给定值的新的 `LocalTime`，其中 `Xxx`\
  \ 是 `Nano`、`Second`、`Minute` 或 `Hour`。\n*   `int getHour()`\n    获取小时（0 到 23）。\n\
  *   `int getMinute()`\n*   `int getSecond()`\n    获取分钟或秒（0 到 59）。\n*   `int getNano()`\n\
  \    获取纳秒（0 到 999,999,999）。\n*   `int toSecondOfDay()`\n*   `long toNanoOfDay()`\n\
  \    产生自午夜来的秒或纳秒。\n*   `boolean isBefore(LocalTime other)`\n*   `boolean isAfter(LocalTime\
  \ other)`\n    如果此日期在给定日期之前或之后，则返回 `true`。\n\n## 6.5. 时区时间 (Zoned Time)\n\n时区由于完全是人类的产物，比地球不规则旋转引起的复杂问题更加混乱。在一个理性的世界里，我们都遵循格林威治的时钟，我们一些人在\
  \ 02:00 吃午饭，另一些人则 22:00 吃。我们的胃会适应的。这在中国实际上是发生了，中国跨越四个常规时区。\n\n\n\n对于觉悟者来说，时区看起来可能是变幻莫测，但它们是生活的事实。当你实现一个日历应用程序时，它需要适用于从一个国家飞往另一个国家的人。当你在纽约时间\
  \ 10:00 有一个电话会议，但你恰好在柏林，你希望在正确的本地时间收到提醒。\n\n互联网数字分配机构（IANA）维护着一个全球已知时区的数据库（[`www.iana.org/time-zones`](https://www.iana.org/time-zones)），该数据库每年更新几次。大部分更新涉及夏令时规则的变更。Java\
  \ 使用了 IANA 数据库。\n\n每个时区都有一个 ID，例如 `America/New_York` 或 `Europe/Berlin`。要查找所有可用的时区，请调用\
  \ `ZoneId.getAvailableZoneIds`。在本文期间，有近 600 个 ID。\n\n给定一个时区 ID，静态方法 `ZoneId.of(id)`\
  \ 会产生一个 `ZoneId` 对象。你可以使用该对象通过调用 `local.atZone(zoneId)` 将 `LocalDateTime` 对象转换为\
  \ `ZonedDateTime` 对象，或者通过调用静态方法 `ZonedDateTime.of(year, month, day, hour, minute,\
  \ second, nano, zoneId)` 来构造 `ZonedDateTime`。例如：\n\n```\nZonedDateTime apollo11launch\
  \  = ZonedDateTime.of(1969, 7, 16, 9, 32, 0, 0,\n    ZoneId.of(\"America/New_York\"\
  ));\n    // 1969-07-16T09:32-04:00[America/New_York]\n```\n\n这是一个特定的时间时刻。调用 `apollo11launch.toInstant`\
  \ 来获取 `Instant`。相反，如果你有一个时间时刻，调用 `instant.atZone(ZoneId.of(\"UTC\"))` 来获取格林维治皇家天文台的\
  \ `ZonedDateTime`，或使用另一个 `ZoneId` 获取地球上其他地方的时刻。\n\nUTC 代表“协调世界时”（Coordinated Universal\
  \ Time），该缩写是上述英语和法语“Temps Universel Coordiné”之间的折中方案，其特点是在这两种语言中都是不正确的。UTC 是格林维治皇家天文台的时间，不考虑夏令时。\n\
  \n`ZonedDateTime` 的许多方法与 `LocalDateTime` 方法相同（参见本节末尾的 API 说明）。大部分方法都是直观的，但夏令时引入了一些复杂性。\n\
  \n当夏令时开始时，时钟拨快一小时。当你构造一个落在跳过小时的时间会发生什么？例如，2013 年，中欧在 3 月 31 日 2:00 切换到夏令时。如果你尝试构造不存在的时间\
  \ 3 月 31 日 2:30，实际上得到的是 3:30。\n\n```\nZonedDateTime skipped = ZonedDateTime.of(\n\
  \    LocalDate.of(2013, 3, 31),\n    LocalTime.of(2, 30),\n    ZoneId.of(\"Europe/Berlin\"\
  ));\n    // 构造 3 月 31 日 3:30\n```\n\n相反，当夏令时结束时，时钟回拨一小时，因此会有两个具有相同本地时间的时刻！当你构造该跨度内的时间时，你会得到两个较早的一个。\n\
  \n```\nZonedDateTime ambiguous = ZonedDateTime.of(\n    LocalDate.of(2013, 10, 27),\
  \ // 夏令时结束\n    LocalTime.of(2, 30),\n    ZoneId.of(\"Europe/Berlin\"));\n    //\
  \ 2013-10-27T02:30+02:00[Europe/Berlin]\nZonedDateTime anHourLater = ambiguous.plusHours(1);\n\
  \    // 2013-10-27T02:30+01:00[Europe/Berlin]\n```\n\n一小时后，时间的小时分钟相同，但区域偏移量（zone\
  \ offset）发生了变化。\n\n在跨越夏令时边界调整日期时，也需要注意。例如，如果你为下周安排了一个会议，不要添加持续 7 天的时间：\n\n```\n\
  ZonedDateTime nextMeeting = meeting.plus(Duration.ofDays(7));\n    // 注意！这在夏令时下无效\n\
  ```\n\n相反，请使用 `Period` 类。\n\n```\nZonedDateTime nextMeeting = meeting.plus(Period.ofDays(7));\
  \ // OK\n```\n\n还有一个 `OffsetDateTime` 类，它表示与 UTC 有偏移的时间，但没有时区规则。该类旨在用于明确要求缺少这些规则的特殊应用程序，例如某些网络协议。对于人类时间，请使用\
  \ `ZonedDateTime`。\n\nListing 6.3 中的示例程序演示了 `ZonedDateTime` 类。\n\nListing 6.3 v2ch06/ZonedTimes.java\n\
  \n```\npackage v2ch06;\n\n/**\n * 此程序演示了时区时间。\n */\n\nimport module java.base;\n\
  \nclass ZonedTimes {\n    void main() {\n        ZonedDateTime apollo11launch =\
  \ ZonedDateTime.of(1969, 7, 16, 9, 32, 0, 0,\n                ZoneId.of(\"America/New_York\"\
  )); // 1969-07-16T09:32-04:00[America/New_York]\n        ZonedDateTime skipped =\
  \ ZonedDateTime.of(\n            LocalDate.of(2013, 3, 31),\n            LocalTime.of(2,\
  \ 30),\n            ZoneId.of(\"Europe/Berlin\"));\n            // 构造 3 月 31 日 3:30\n\
  \        ZonedDateTime ambiguous = ZonedDateTime.of(\n            LocalDate.of(2013,\
  \ 10, 27), // 夏令时结束\n            LocalTime.of(2, 30),\n            ZoneId.of(\"\
  Europe/Berlin\"));\n            // 2013-10-27T02:30+02:00[Europe/Berlin]\n     \
  \   ZonedDateTime anHourLater = ambiguous.plusHours(1);\n            // 2013-10-27T02:30+01:00[Europe/Berlin]\n\
  \    }\n}\n```\n\n\n\n获取分钟或秒（0 到 59 之间）。\n\n*   `int getNano()` 获取纳秒（0 到 999,999,999\
  \ 之间）。\n*   `public ZoneOffset getOffset()` 获取相对于 UTC 的偏移量。偏移量范围从 –12:00 到 +14:00。某些时区具有小数偏移量。偏移量会随夏令时间变化。\n\
  *   `LocalDate toLocalDate()`\n*   `LocalTime toLocalTime()`\n*   `LocalDateTime\
  \ toLocalDateTime()`\n*   `Instant toInstant()` 返回本地日期、时间或日期/时间，或相应的瞬时。\n*   `boolean\
  \ isBefore(ChronoZonedDateTime other)`\n*   `boolean isAfter(ChronoZonedDateTime\
  \ other)` 如果此时区日期/时间在指定的时区日期/时间之前或之后，则返回 `true`\n\n## 6.6. 格式化与解析\n\n`DateTimeFormatter`\
  \ 类提供了三种格式化器来打印日期/时间值：\n\n*   预定义的标准格式化器（参见表 6.1）\n*   特定区域的格式化器\n*   带有自定义模式的格式化器\n\
  \n要使用其中一种标准格式化器，只需调用其 `format` 方法：\n\n```java\nString formatted = DateTimeFormatter.ISO_OFFSET_DATE_TIME.format(apollo11launch);\n\
  // 1969-07-16T09:32:00-04:00\"\n```\n\n表 6.1: 预定义格式化器\n\n| 格式化器 | 说明 | 示例 |\n| ---\
  \ | --- | --- |\n| `BASIC_ISO_DATE` | 不带分隔符的年、月、日、区域偏移量 | `19690716-0400` |\n| `ISO_LOCAL_DATE`,\
  \ `ISO_LOCAL_TIME`, `ISO_LOCAL_DATE_TIME` | 使用分隔符 `-`, `:`, `T` | `1969-07-16`,\
  \ `09:32:00`, `1969-07-16T09:32:00` |\n| `ISO_OFFSET_DATE`, `ISO_OFFSET_TIME`, `ISO_OFFSET_DATE_TIME`\
  \ |  `ISO_LOCAL_XXX`，但带有区域偏移量 | `1969-07-16-04:00`, `09:32:00-04:00`, `1969-07-16T09:32:00-04:00`\
  \ |\n| `ISO_ZONED_DATE_TIME` | 带有区域偏移量和区域 ID | `1969-07-16T09:32:00-04:00[America/New_York]`\
  \ |\n| `ISO_INSTANT` | UTC ，用 `Z` 区域 ID 表示 | `1969-07-16T13:32:00Z` |\n| `ISO_DATE`,\
  \ `ISO_TIME`, `ISO_DATE_TIME` |  `ISO_OFFSET_DATE`, `ISO_OFFSET_TIME` 和 `ISO_ZONED_DATE_TIME`，但区域信息是可选的\
  \ | `1969-07-16-04:00`, `09:32:00-04:00`, `1969-07-16T09:32:00-04:00[America/New_York]`\
  \ |\n| `ISO_ORDINAL_DATE` | `LocalDate` 的年和一年中的第 | `1969-197-04:00` |\n| `ISO_WEEK_DATE`\
  \ | `LocalDate` 的年、周和星期几 | `1969-W29-3-04:00` |\n| `RFC_1123_DATE_TIME` | 邮件时间戳标准，在\
  \ RFC 822 中编码并在 RFC 1123 中更新为四位数的年份 | `Wed, 16 Jul 1969 09:32:00 -0400` |\n\n标准格式化器主要用于机器可读的时间戳。要向人类读者展示日期和时间，请使用特定区域的格式化器。日期和时间都有四种样式：`SHORT`、`MEDIUM`、`LONG`\
  \ 和 `FULL`——参见表 6.2。\n\n静态方法 `ofLocalizedDate`、`ofLocalizedTime` 和 `ofLocalizedDateTime`\
  \ 创建此类格式化器。例如：\n\n```java\nDateTimeFormatter formatter = DateTimeFormatter.ofLocalizedDateTime(FormatStyle.LONG);\n\
  String formatted = formatter.format(apollo11launch);\n// July 16, 1969 9:32:00 AM\
  \ EDT\n```\n\n这些方法使用默认区域（locale）。要切换到不同的区域，只需使用 `withLocale` 方法。\n\n```java\nformatted\
  \ = formatter.withLocale(Locale.FRENCH).format(apollo11launch);\n// 16 juillet 1969\
  \ 09:32:00 EDT\n```\n\n`DayOfWeek` 和 `Month` 枚举拥有 `getDisplayName` 方法，用于以不同的区域和格式提供工作几和月份的名称。\n\
  \n```java\nfor (DayOfWeek w : DayOfWeek.values())\n    IO.print(w.getDisplayName(TextStyle.SHORT,\
  \ Locale.ENGLISH) + \" \");\n// Prints Mon Tue Wed Thu Fri\n```\n\n有关区域的更多信息请第 7\
  \ 章。\n\n表 6.2: 特定区域的格式化\n\n| 样式 | 日期 | 时间 |\n| --- | --- | --- |\n| `SHORT` | `7/16/69`\
  \ | `9:32 AM` |\n| `MEDIUM` | `Jul 16, 1969` | `9:32:00 AM` |\n| `LONG` | `July\
  \ 16, 1969` | `9:32:00 AM EDT` |\n| `FULL` | `Wednesday, July 16, 1969` | `9:32:00\
  \ AM EDT` |\n\n`java.time.format.DateTimeFormatter` 类旨在替换 `java.util.DateFormat`。如果你需要后者的实例，调用\
  \ `toFormat()`。最后，你可以通过指定模式自定义日期格式。例如：\n\n```java\nformatter = DateTimeFormatter.ofPattern(\"\
  yyyy-MM-dd HH:mm\");\n```\n以 `Wed 1969-07-16 09:32` 格式化日期。每个字母表示不同的时间字段，字母重复的次数根据随时间推移而变化的规则。表\
  \ 6.3 显示了最常用的模式。\n\n表 6.3: 日期/时间常用符号\n\n| `ChronoField` 或 目的 | 示例 |\n| --- | ---\
  \ |\n| `ERA` | `G`: `AD`, `GGGG`: `Anno Domini`, `GGG`: `A` |\n| `YEAR_OF_ERA` |\
  \ `yy`: `69`, `yyyy`: `1969` |\n| `MONTH_OF_YEAR` | `M`: `7`, `MM`: `07`, `MMM`:\
  \ `Jul`, `MMMM`: `July` |\n| `DAY_OF_MONTH` | `d`: `6`, `dd`: `06` |\n| `DAY_OF_WEEK`\
  \ | `e`: `3`, `E`: `Wed`, `EEEE`: `Wednesday`, `EEEEE`: `W` |\n| `HOUR_OF_DAY` |\
  \ `H`: `9`, `HH`: `09` |\n| `CLOCK_HOUR_OF_AM_PM` | `h`: `9`, `hh`: `09` |\n| `AMPM_OF_DAY`\
  \ | `a`: `AM` |\n| Period of day (since Java 16) | `B`: `in the evening`, `at night`,\
  \ `midnight` |\n| `MINUTE_OF_HOUR` | `mm`: `02` |\n| `SECOND_OF_MINUTE` | `ss`:\
  \ `00` |\n| `NANO_OF_SECOND` | `nnnnnn`: `000000` |\n| Time zone ID | `VV`: `America/New_York`\
  \ |\n| Time zone name | `z`: `EDT`, `zzzz`: `Eastern Daylight Time`, `v`: `ET`,\
  \ `vvvv`: `Eastern Time` |\n| Zone offset | `x`: `-04`, `xx`: `-0400`, `xxx`: `-04:00`,\
  \ `XXX`: 相同，但零使用 `Z` |\n\n注意这些字母的大小写：`M` 是月份，`m` 是分钟。你可能想要几几 `d` 而而不是一年中的天 `D`，以及秒\
  \ `s` 而不是毫秒 `S`。非常危险的是，`y` 表示普通年份而 `Y` 是“周年”，如果 1 月 1 日是周五、周六或周日，则会有所不同。\n\n`ofLocalizedPattern`\
  \ 方法产生一个以特定区域方式组装模式部分、具有适当分隔符和顺序的格式化器。例如：\n\n```java\nDateTimeFormatter formatter\
  \ = DateTimeFormatter.ofLocalizedPattern(\"yMMMd\");\nformatter.withLocale(Locale.US).format(apollo11launch)\
  \ // Jul 16, 1969\nformatter.withLocale(Locale.GERMANY).format(apollo11launch) //\
  \ 16. Juli 1969\nformatter.withLocale(Locale.CHINA).format(apollo11launch) // 1969\
  \ 年 7 月 16 日\n```\n\n你只需要按大小顺序指定部分的符号。不要包含任何分隔符。对于小时，使用 `j` 用于本地化的 12 小时或 24 小时格式：\n\
  \n```java\nformatter = DateTimeFormatter.ofLocalizedPattern(\"jm\");\nformatter.withLocale(Locale.US).format(LocalTime.of(23,\
  \ 59)) // 11:59 pm\nformatter.withLocale(Locale.GERMANY).format(LocalTime.of(23,\
  \ 59)) // 23:59\n```\n\n要从字符串解析日期/时间值，请使用一个静态 `parse` 方法。例如：\n\n```java\nLocalDate\
  \ churchsBirthday = LocalDate.parse(\"1903-06-14\");\nZonedDateTime apollo11launch\
  \ =\n    ZonedDateTime.parse(\"1969-07-16 03:32:00-0400\",\n        DateTimeFormatter.ofPattern(\"\
  yyyy-MM-dd HH:mm:ssxx\"));\n```\n\n第一个调用使用标准的 `ISO_LOCAL_DATE` 格式化器，第二个使用自定义格式化器。\n\
  \n列表 6.4 中的程序显示了如何格式化和解析日期和时间。\n\n列表 6.4 v2ch06/Formatting.java\n\n\n\n\n\n```\n\
  package v2ch06;\n\n/**\n * 此程序了时间格式化。\n */\n\nimport module java.base;\n\nclass\
  \ Formatting {\n    void main() {\n        ZonedDateTime apollo11launch = ZonedDateTime.of(1969,\
  \ 7, 16, 9, 32, 0, 0,\n                ZoneId.of(\"America/New_York\"));\n\n   \
  \     String formatted = DateTimeFormatter.ISO_OFFSET_DATE_TIME.format(apollo11launch);\n\
  \        // 1969-07-16T09:32:00-04:00\n        IO.println(formatted);\n\n      \
  \  DateTimeFormatter formatter = DateTimeFormatter.ofLocalizedDateTime(FormatStyle.LONG);\n\
  \        formatted = formatter.format(apollo11launch);\n        // July 16, 1969\
  \ 9:32:00 AM EDT\n        IO.println(formatted);\n        formatted = formatter.withLocale(Locale.FRENCH).format(apollo11launch);\n\
  \        // 16 juillet 1969 09:32:00 EDT\n        IO.println(formatted);\n\n   \
  \     formatter = DateTimeFormatter.ofPattern(\"E yyyy-MM-dd HH:mm\");\n       \
  \ formatted = formatter.format(apollo11launch);\n        IO.println(formatted);\n\
  \n        LocalDate churchsBirthday = LocalDate.parse(\"1903-06-14\");\n       \
  \ IO.println(\"churchsBirthday: \" + churchsBirthday);\n        apollo11launch =\
  \ ZonedDateTime.parse(\"1969-07-16 03:32:00-0400\",\n                DateTimeFormatter.ofPattern(\"\
  yyyy-MM-dd HH:mm:ssxx\"));\n        IO.println(\"apollo11launch: \" + apollo11launch);\n\
  \n        for (DayOfWeek w : DayOfWeek.values())\n            IO.print(w.getDisplayName(TextStyle.SHORT,\
  \ Locale.ENGLISH) + \" \");\n    }\n}\n```\n\n`java.time.format.DateTimeFormatter`\
  \ 8\n\n- `String format(TemporalAccessor temporal)`\n格式化给定的值。`Instant`、`LocalDate`、`LocalTime`、`LocalDateTime`\
  \ 和 `ZonedDateTime` 以及许多其他类都实现了 `TemporalAccessor` 接口。\n\n- `static DateTimeFormatter\
  \ ofLocalizedDate(FormatStyle dateStyle)`\n- `static DateTimeFormatter ofLocalizedTime(FormatStyle\
  \ timeStyle)`\n- `static DateTimeFormatter ofLocalizedDateTime(FormatStyle dateTimeStyle)`\n\
  - `static DateTimeFormatter ofLocalizedDateTime(FormatStyle dateStyle, FormatStyle\
  \ timeStyle)`\n返回一个用于样式的格式器。`FormatStyle` 枚举具有值 `SHORT`、`MEDIUM`、`LONG` 和 `FULL`。\n\
  \n- `static DateTimeFormatter ofLocalizedPattern(String requestedTemplate)` 19\n\
  创建一个可以适配到本地区域的格式器，使用模板中指定的各个。\n\n- `DateTimeFormatter withLocale(Locale locale)`\n\
  返回一个与此格式器相等但使用给定本地区域的格式器。\n\n- `static DateTimeFormatter ofPattern(String pattern)`\n\
  - `static DateTimeFormatter ofPattern(String pattern, Locale locale)`\n返回一个使用给定模式和本地区域的格式器。模式语法请参见文档。\n\
  \n`java.time.LocalDate` 8\n\n- `static LocalDate parse(CharSequence text)`\n- `static\
  \ LocalDate parse(CharSequence text, DateTimeFormatter formatter)`\n返回使用默认格式器或给定格式器的\
  \ `LocalDate`。\n\n`java.time.ZonedDateTime` 8\n\n- `static ZonedDateTime parse(CharSequence\
  \ text)`\n- `static ZonedDateTime parse(CharSequence text, DateTimeFormatter formatter)`\n\
  返回使用默认格式器或给定格式器的 `ZonedDateTime`。\n\n## 6.7. 与旧代码相互操作\n\n作为一种新产物，Java 日期和时间 API\
  \ 必须与现有类相互操作——特别是无处不在的 `java.util.Date`、`java.util.GregorianCalendar` 以及 `java.sql.Date`/`Time`/`Timestamp`。\n\
  \n`Instant` 类是 `java.util.Date` 的类似对应类。旧 `Date` 类的 `toInstant` 方法产生一个 `Instant`，而静态方法\
  \ `from` 则反向转换。\n\n同样，`ZonedDateTime` 是 `java.util.GregorianCalendar` 的紧密对应类，该旧类也拥有转换方法。`toZonedDateTime`\
  \ 方法将 `GregorianCalendar` 转换为 `ZonedDateTime`，而静态方法 `from` 执行相反的转换。\n\n`java.sql`\
  \ 包中的日期和时间类提供了另一组转换。你也可以将 `DateTimeFormatter` 传递给使用 `java.text.Format` 的旧代码。表 6.4\
  \ 总结了这些转换。\n\n表 6.4：`java.time` 类与旧类之间的转换\n\n| 类 | 转换为旧类 | 从旧类转换 |\n| --- | ---\
  \ | --- |\n| `Instant` ↔︎ `java.util.Date` | `Date.from(instant)` | `date.toInstant()`\
  \ |\n| `ZonedDateTime` ↔︎ `java.util.GregorianCalendar` | `GregorianCalendar.from(\
  \ zonedDateTime)` | `cal.toZonedDateTime()` |\n| `Instant` ↔︎ `java.sql.Timestamp`\
  \ | `Timestamp.from(instant)` | `timestamp.toInstant()` |\n| `LocalDateTime` ↔︎\
  \ `java.sql.Timestamp` | `Timestamp.valueOf( localDateTime)` | `timestamp.toLocalDateTime()`\
  \ |\n| `LocalDate` ↔︎ `java.sql.Date` | `Date.valueOf(localDate)` | `date.toLocalDate()`\
  \ |\n| `LocalTime` ↔︎ `java.sql.Time` | `Time.valueOf(localTime)` | `time.toLocalTime()`\
  \ |\n| `DateTimeFormatter` ↔︎ `java.text.DateFormat` | `DateFormat.format(...)`\
  \ | `formatter.toFormat()` |\n| `java.util.TimeZone` ↔︎ `ZoneId` | `ZoneId.of(id)`\
  \ | `timeZone.toZoneId()` |\n| `java.nio.file.attribute.FileTime` ↔︎ `Instant` |\
  \ `FileTime.from(instant)` | `fileTime.toInstant()` |\n\n# 第 7 章 国际化\n\n世界很大，我们希望世界上那里的居民对你的软件感兴趣。毕竟，互联网毫不地跨越了国界。\n\
  \nJava 编程语言是第一种从设计上就支持国际化的语言。从一开始，它就拥有了国际化所需的关键特性：对所有字符串使用 Unicode。Unicode 支持使得世界上大多数语言的\
  \ Java 程序变得简单。\n\n## 7.1. 地区域 (Locales)\n\n当你查看一个适配国际市场的应用时，最明显的区别是语言。这种观察其实有点局限性，因为国家之间可以共享共同语言，但你可能仍然需要做一些工作让两个国家的用户都满意。\n\
  \n### 7.1.1. 为什么需要本地区域？\n\n当你提供程序的国际化版本时，所有的程序消息都需要翻译成本地语言。然而，仅仅翻译用户界面文本是不够的。还有许多细微的差异——例如，数字在英语和德语中的格式化方式大不相同。\n\
  \n\n对于德国用户来说——也就是说，小数点和小逗号分隔符的作用是反转的。在日期显示上也存在类似的差异。在美国，日期的显示方式（某种不理性的）是月/日/年。德国使用更符合逻辑的日/月/年顺序，而在中国，使用习惯是年/月/日。因此，日期\n\
  \n> 3/22/61\n\n对德国用户来说应该呈现为\n\n> 22.03.1961\n\n当然，如果明确写出月份名称，语言之间的差异就会显而易见。英语的\n\
  \n> March 22, 1961\n\n在德语中应该呈现为\n\n> 22\\. März 1961\n\n或者用中文呈现为\n\n> 1961 年 3 月\
  \ 22 日\n\n一个 `locale`（区域）捕捉了此类本地偏好。每当你展示数字、日期、货币值和其他格式随语言或位置而变化的项目时，你需要使用感知区域的 API。\n\
  \n## 7.1.2. 指定区域 (Specifying Locales)\n\n区域（locale）由最多五个组件组成：\n\n1.  语言，由两个或三个小写字母指定，例如\
  \ `en`（英语）、`de`（德语）或 `zh`（中文）。表 7.1 显示了常用代码。\n\n2.  可选的脚本，由首字母大写的四位字母字符串指定，例如 `Latn`（拉丁字母）、`Cyrl`（西里尔字母）或\
  \ `Hant`（繁体中文）。这非常有用，因为某些语言（如塞尔维亚语）使用拉丁字母或西里尔字母编写，而且某些中文读者更倾向于繁体字而非简体字。\n\n3.  可选的国家或地区，由两个大写字母或三位数字指定，例如\
  \ `US`（美国）或 `CH`（瑞士）。表 7.2 显示了常用代码。\n\n4.  可选的变体（variant），用于指定方言或拼写规则等杂项特征。变体现在很少使用。挪威语曾有一个“尼诺斯语（Nynorsk）”变体，但现在用不同的语言代码\
  \ `nn` 表示。曾经用于日本皇历和泰国数字的变体现在被表示为扩展（见下一项）。\n\n5.  可选的扩展（extension）。扩展描述了对日历（如日本历）、数字（使用泰语数字而非西方数字）等的本地偏好。Unicode\
  \ 标准规定了其中一些扩展。扩展以 `u-` 开头，后跟两个字母的代码，指定该扩展处理日历（`ca`）、数字（`nu`）等。例如，扩展 `u-nu-thai`\
  \ 表示使用泰国数字。其他扩展完全任意，并以 `x-` 开头，例如 `x-java`。\n\n区域的规则制定在互联网工程任务组（IETF）的“最佳当前实践”备录\
  \ BCP 47 中（[`www.rfc-editor.org/info/bcp47`](https://www.rfc-editor.org/info/bcp47)）。你可以在\
  \ [`www.w3.org/International/articles/language-tags`](https://www.w3.org/International/articles/language-tags)\
  \ 找到更易读的摘要。\n\n表 7.1：常用 ISO 639-1 语言代码\n\n| 语言 | 代码 | 语言 | 代码 |\n| --- | --- | ---\
  \ | --- |\n| 中文 | `zh` | 意大利语 | `it` |\n| 丹语 | `da` | 日语 | `ja` |\n| 荷兰语 | `nl`\
  \ | 韩韩语 | `ko` |\n| 英语 | `en` | 挪威语 | `no` |\n| 法语 | `fr` | 葡萄语 | `pt` |\n| 芬兰语\
  \ | `fi` | 西班牙语 | `es` |\n| 德语 | `de` | 瑞典语 | `sv` |\n| 希腊语 | `el` | 土耳其语 | `tr`\
  \ |\n\n表 7.2：常用 ISO 3166-1 国家代码\n\n| 国家 | 代码 | 国家 | 代码 |\n| --- | --- | --- | ---\
  \ |\n| 奥地利 | `AT` | 日本 | `JP` |\n| 比时 | `BE` | 韩国 | `KR` |\n| 加拿大 | `CA` | 荷兰 |\
  \ `NL` |\n| 中国 | `CN` | 挪威 | `NO` |\n| 丹麦 | `DK` | 葡萄牙 | `PT` |\n| 芬兰 | `FI` | 西班牙\
  \ | `ES` |\n| 德国 | `DE` | 瑞典 | `SE` |\n| 英国 | `GB` | 瑞士 | `CH` |\n| 希腊 | `GR` |\
  \ 台湾 | `TW` |\n| 爱尔兰 | `IE` | 土耳其 | `TR` |\n| 意大利 | `IT` | 美国 | `US` |\n\n语言和国家的代码看起来有些随机，因为其中一些源自本地语言。德语在德语中是\
  \ Deutsch，中文在中文里是 zhongwen：因此是 `de` 和 `zh`。瑞士是 `CH`，源自表示瑞士联邦的拉丁术语 *Confoederatio\
  \ Helvetica*。\n\n区域通过标签（tags）描述——即由区域元素组成的连字符字符串，例如 `en-US`。\n\n在德国，你会使用区域 `de-DE`。瑞士有四种官方语言（德语、法语、意大利语和罗什曼语）。在瑞士的德语语者会想要使用区域\
  \ `de-CH`。该区域使用德语的规则，但货币值以瑞士法郎表示。\n\n## 7.1.3. 默认区域 (The Default Locale)\n\n`Locale`\
  \ 类的静态方法 `getDefault` 获取存储的默认区域。你可以通过 `setDefault` 传入一个不同的区域来更改默认区域。\n\n某些操作系统允许指定区域用于显示消息和格式。例如，在美国的法语使用者可以拥有法语菜单但货币为美元。\n\
  \n要获取这些偏好，调用\n\n```\nLocale displayLocale = Locale.getDefault();\nLocale formatLocale\
  \ = Locale.getDefault();\n```\n\n在 UNIX 中，你可以通过设置 `LC_NUMERIC`、`LC_MONETARY` 和 `LC_TIME`\
  \ 环境变量来指定区域用于数字、货币和日期。Java 会忽略这些设置。\n\n如果你想测试一个仅有语言和国家的区域，你可以在启动程序时在命令行提供它们。例如，我们将默认区域设置为\
  \ `de-CH`：\n\n```\njava -Duser.language=de -Duser.region=CH MyProgram\n```\n\n##\
  \ 7.1.4. 显示名称 (Display Names)\n\n一旦你有了区域，可以对其做什么？事实证明不多。`Locale` 类中唯一用的方法是识别语言和国家代码的方法。最重要的是\
  \ `getDisplayName`。它返回一个描述区域的字符串。该字符串不包含晦涩的双字母代码，而是可以呈现给用户的形式，例如\n\n```\nGerman\
  \ (Switzerland)\n```\n\n实际上，这里有一个问题。显示名称是用默认区域发布的。这可能并不合适。如果用户选择了德语作为首选语言，你可能用德语呈现字符串。你可以通过传入德语区域来实现。代码如下：\n\
  \n```\nLocale locale = Locale.of(\"de\", \"CH\");\nIO.println(locale.getDisplayName(Locale.GERMAN));\n\
  ```\n\n\n\n\n打印：\n\n```\nDeutsch (Schweiz)\n```\n\n此示例展示了为什么你需要 `Locale` 对象。你将它们传递给感知区域的方法，这些方法会生成呈现给不同位置用户的文本。你将在接后的章节中看到许多此类示例。\n\
  \n即使是像将字符串转换为小写或大写这样平凡的操作，也可能是特定区域的。例如，在土耳其区域（locale）中，字母 `I` 的小写是不带点的 `ı`。试图通过将字符串存储为小写来规范化字符串的程序在土耳其客户那里神秘地失败了，因为那里\
  \ `I` 和带点的 `i` 没有相同的小写版本。始终使用带有 `Locale` 参数的 `toUpperCase` 和 `toLowerCase` 变体是一个好主意。例如，尝试：\n\
  \n```java\nString command = \"QUIT\".toLowerCase(Locale.of(\"tr\"));\n    // 结果为\
  \ \"quıt\"，带有不带点的 ı\n```\n\n当然，在土耳其，`Locale.getDefault()` 返回的就是该区域，`\"QUIT\".toLowerCase()`\
  \ 与 `\"quit\"` 相同。\n\n如果你想将英语字符串规范化为小写，应该向 `toLowerCase` 方法传递一个英语区域。对于语言中性处理，请使用\
  \ `Locale.ROOT`。\n\n你可以显式地设置输入输出操作的区域。\n\n*   当从 `Scanner` 读取数字时，可以使用 `useLocale`\
  \ 方法设置它的区域。\n*   `String.format` 和 `PrintWriter.printf` 方法具有带有 `Locale` 参数的重载形式。\n\
  \n### `java.util.Locale` 1.1\n\n*   `static Locale.of(String language)` 19\n*  \
  \ `static Locale.of(String language, String country)` 19\n    根据给定的语言和国家创建一个区域。\n\
  *   `static Locale forLanguageTag(String languageTag)` 7\n    创建一个与给定语言标签对应的区域。\n\
  *   `static Locale getDefault()`\n    返回默认区域。\n*   `static void setDefault(Locale\
  \ newLocale)`\n    设置默认区域。\n*   `String getDisplayName()`\n    返回一个描述区域的名称，用当前区域表示。\n\
  *   `String getDisplayName(Locale inLocale)`\n    返回一个描述区域的名称，用给定的区域表示。\n*   `String\
  \ getLanguage()`\n    返回语言代码——一个小写的两个字母的 ISO 639 代码。\n*   `String getDisplayLanguage()`\n\
  \    返回语言的名称，用当前区域表示。\n*   `String getDisplayLanguage(Locale inLocale)`\n    返回语言的名称，用给定的区域表示。\n\
  *   `String getCountry()`\n    返回国家代码，一个大写的两个字母的 ISO 3166 代码。\n*   `static String[]\
  \ getISOCountries()`\n*   `static Set<String> getISOCountries(Locale.IsoCountryCode\
  \ type)` 9\n    获取所有两个字母的国家代码，或所有 2、3 或 4 个字母的国家代码。该 type 是枚举常量 `PART1_ALPHA2`、`PART1_ALPHA3`\
  \ 和 `PART3` 之一。\n*   `String getDisplayCountry()`\n    返回国家的名称，用当前区域表示。\n*   `String\
  \ getDisplayCountry(Locale inLocale)`\n    返回国家的名称，用给定的区域表示。\n*   `String toLanguageTag()`\
  \ 7\n    返回此区域的 IETF BCP 47 语言标签——例如 `\"de-CH\"`。\n*   `String toString()`\n   \
  \ 返回区域的描述，语言和国家之间用下划线分隔（例如 `\"de_CH\"`）。此方法仅用于调试。\n\n## 7.2. 数字格式\n\n我已经提到过数字和货币格式化是高度依赖于区域的。Java\
  \ 库在 `java.text` 包中提供了一个格式化对象集合，可以格式化和解析数值。\n\n### 7.2.1 格式化数值\n\n按照以下步骤为特定区域格式化数字：\n\
  \n1.  按照前一节所述，获取区域对象。\n2.  使用“工厂方法”获取格式化对象。\n3.  使用该格式化对象进行格式化和解析。\n\n工厂方法是 `NumberFormat`\
  \ 类中带有 `Locale` 参数的静态方法。三个工厂方法：`getNumberInstance`、`getCurrencyInstance` 和 `getPercentInstance`。这些方法分别返回可以格式化和解析数字、货币金额和百分比的对象。例如，这里是如何用德语格式化货币值：\n\
  \n```java\nLocale locale = Locale.GERMAN;\nNumberFormat formatter = NumberFormat.getCurrencyInstance(locale);\n\
  double amount = 123456.78;\nString result = formatter.format(amount);\n```\n\n结果是\n\
  \n> 123.456,78 €\n\n注意货币符号是 `€`，且它位于字符串末尾。此外，注意小数点和小数逗号的反转。\n\nJava 12 添加了具有两种风格的“紧凑”格式：短格式\
  \ (123K) 和长格式 (123 thousand)。以下是获取短格式的方法：\n\n```java\nformatter = NumberFormat.getCompactNumberInstance(locale,\
  \ NumberFormat.Style.SHORT);\n```\n\n相反，要读取按照特定区域习惯输入或存储的数字，请使用 `parse` 方法。例如，以下代码解析了用户在文本字段中输入的值。`parse`\
  \ 方法可以处理小数点和逗号，以及其他语言的数字。\n\n```java\nTextField inputField;\n. . .\nNumberFormat\
  \ formatter = NumberFormat.getNumberInstance();\n// 获取默认区域的格式器\nNumber input = formatter.parse(inputField.getText().strip());\n\
  double x = input.doubleValue();\n```\n\n`parse` 的返回类型是抽象的 `Number`。返回的对象是 `Double`\
  \ 或 `Long`，取决于解析的数字是否为浮点数。`Number` 对象不会自动拆箱——你不能简单地将 `Number` 赋值给原始类型。相反，请使用 `doubleValue`\
  \ 或 `intValue`。\n\n如果数字文本格式不，方法将抛出 `ParseException`。例如，字符串前面的空格是不允许的（调用 `strip`\
  \ 来移除它）。然而，字符串中数字后的任何字符都将被忽略，因此不会抛出异常。\n\n注意，由 `getXxxInstance` 工厂方法返回的实例并不是 `NumberFormat`。`NumberFormat`\
  \ 类型是一个抽象类，实际的格式器属于它的某个子类。工厂方法仅知道如何定位属于特定区域的对象。\n\n你可以使用静态方法 `getAvailableLocales`\
  \ 获取当前支持的区域列表。该方法返回可以获取数字格式器对象的区域数组。\n\n你可以使用 `Scanner` 读取本地化的整数和浮点数。调用 `useLocale`\
  \ 方法设置区域。\n\n书中的配套代码包含一个 GUI 程序，可以让你尝试数字格式器（见图 7.1）。图中顶部的组合框包含所有带有数字格式器的区域。你可以在数字、货币和百分比格式器之间进行选择。每当你做出选择时，文本字段中的数字就会重新格式化。你还可以输入不同的数字并点击\
  \ Parse 按钮来调用 `parse` 方法，它会尝试解析输入的内容。如果解析成功，将将其传递给 `format` 并显示结果。如果解析失败，文本字段将显示“Parse\
  \ error”消息。\n\n![Figure](img/NumberFormatTest.jpg)图 7.1：NumberFormatDemo 程序。\n\n\
  Listing 7.1 显示了一个数字格式探索器的文本版本，更容易理解。\n\n```java\n// Listing 7.1 v2ch07/numberFormat/NumberFormatDemo2.java\n\
  ```\n\n\n\n\n```java\npackage v2ch07.numberFormat;\n\nimport module java.base;\n\
  import v2ch07.util.Choices;\n\n/**\n * 此程序演示了在不同区域下的数字格式化。\n */\nclass NumberFormatDemo2\
  \ {\n    void main() {\n        var locales = (Locale[]) NumberFormat.getAvailableLocales().clone();\n\
  \        Arrays.sort(locales, Comparator.comparing(Locale::getDisplayName));\n \
  \       Locale locale = Choices.choose(locales, Locale::getDisplayName);\n\n   \
  \     var formatters = new LinkedHashMap<NumberFormat, String>();\n        formatters.put(NumberFormat.getNumberInstance(locale),\
  \ \"Number\");\n        formatters.put(NumberFormat.getCompactNumberInstance(locale,\
  \ NumberFormat.Style.SHORT),\n                \"Compact Short\");\n        formatters.put(NumberFormat.getCompactNumberInstance(locale,\
  \ NumberFormat.Style.LONG),\n                \"Compact Long\");\n        formatters.put(NumberFormat.getPercentInstance(locale),\
  \ \"Percent\");\n        formatters.put(NumberFormat.getCurrencyInstance(locale),\
  \ \"Currency\");\n        NumberFormat formatter = Choices.choose(formatters);\n\
  \n        String operation = Choices.choose(\"Format\", \"Parse\");\n        if\
  \ (operation.equals(\"Format\")) {\n            double number = Double.parseDouble(\n\
  \                    IO.readln(\"输入一个要格式化的浮点数: \"));\n            System.out.println(formatter.format(number));\n\
  \        }\n        else {\n            String text = IO.readln(\"输入一个要解析的浮点数: \"\
  );\n            try {\n                System.out.println(formatter.parse(text));\n\
  \            }\n            catch (ParseException e) {\n                System.out.println(\"\
  ParseException \" + e.getMessage());\n            }\n        }\n    }\n}\n```\n\n\
  ### `java.text.NumberFormat` 1.1\n\n*   `static Locale[] getAvailableLocales()`:返回一个\
  \ `NumberFormat` 格式化可用的 `Locale` 对象数组。\n*   `static NumberFormat getNumberInstance()`\n\
  *   `static NumberFormat getNumberInstance(Locale inLocale)`\n*   `static NumberFormat\
  \ getCurrencyInstance()`\n*   `static NumberFormat getCurrencyInstance(Locale inLocale)`\n\
  *   `static NumberFormat getPercentInstance()`\n*   `static NumberFormat getPercentInstance(Locale\
  \ inLocale)`:返回当前 locale 或指定 locale 的数字、货币金额或百分比值的格式化器。\n*   `static NumberFormat\
  \ getCompactNumberInstance()` 12\n*   `static NumberFormat getCompactNumberInstance(Locale\
  \ locale, NumberFormat.Style formatStyle)`:返回当前 locale 下 `SHORT` 样式的紧凑数字格式化器，或指定\
  \ locale 和样式（`SHORT` 或 `LONG`）的格式化器。\n*   `String format(double number)`\n*   `String\
  \ format(long number)`:返回格式化给定浮点数或整数后的字符串。\n*   `Number parse(String source)`:解析给定字符串并返回数值；如果字符串描述的是浮点数，则返回\
  \ `Double`，否则返回 `Long`。字符串开头必须包含数字；不允许有前导空格。数字后面可以跟随其他字符，这些字符会被忽略。如果解析失败，抛出 `ParseException`。\n\
  *   `void setParseIntegerOnly(boolean value)`\n*   `boolean isParseIntegerOnly()`:设置或获取标记，用以指示此格式化器是否仅解析整数值。\n\
  *   `void setGroupingUsed(boolean newValue)`\n*   `boolean isGroupingUsed()`:设置或获取标记，用以指示此格式化器是否生成并识别分组分隔符（如\
  \ `100,000`）。\n*   `void setMinimumIntegerDigits(int newValue)`\n*   `int getMinimumIntegerDigits()`\n\
  *   `void setMaximumIntegerDigits(int newValue)`\n*   `int getMaximumIntegerDigits()`\n\
  *   `void setMinimumFractionDigits(int newValue)`\n*   `int getMinimumFractionDigits()`\n\
  *   `void setMaximumFractionDigits(int newValue)`\n*   `int getMaximumFractionDigits()`:设置数字的整数部分或小数部分允许的最大或最小数字位数。\n\
  \n### 7.2.2. `DecimalFormat` 类\n\n在大多数 locale 中，你在上一节中看到的 `NumberFormat` 工厂方法会返回一个\
  \ `DecimalFormat` 类的实例。该类描述了世界范围内各种格式化变化。你可以修改单个设置，也可以创建一个全新的格式化器。模式语法让这变得更加方便。\n\
  \n模式描述了必需和可选的数字位数，以及正负数的前缀和后缀。还有一些更深奥的设置——请参见 表 7.3。\n\n考虑此示例：\n\n```java\nvar formatter\
  \ = new DecimalFormat(\"0.00;(#)\");\n```\n\n分号分隔了正部分和可选的负部分。从正部分可以看出，整数部分至少有一位数字，小数部分至少有两个数字。这适用于所有数字，无论正负。负数使用会计格式——前缀为\
  \ `(` 且后缀为 `)`。\n\n前缀或后缀可能包含一个 `¤` 货币符号（U+00A4），用以表示货币符号的位置。\n\n如果你需要在前缀或后缀中插入特殊字符，请在它前面加一个单引号。例如，前缀\
  \ `'#` 是字面量上的哈号符号，而 `o''clock` 包含一个引号。\n\n#### 表 7.3：`DecimalFormat` 属性\n\n| 属性名称\
  \ | 描述 | 模式 |\n| --- | --- | --- |\n| `groupingSize` | 分组在一起的整数位数（通常为 3） | 分组大小为\
  \ 3 时使用 `###`。 |\n| `minimum`/`maximumFractionDigits` | 小数部分的最小和最大位数 | `.00##`。\
  \ |\n| `minimumIntegerDigits` | 整数部分的最小位数 | `000`。 |\n| `maximumIntegerDigits` |\
  \ 整数部分的最大位数 | `###,##0.00`。 |\n| — | 指数部分的位数 | `00E0`。 |\n| `multiplier` | 百分比或千分比的倍数\
  \ | 100 使用 `%`，1000 使用 `‰` (U+2030)。 |\n| `positivePrefix`/`Suffix`, `negativePrefix`/`Suffix`\
  \ | `+#0.00;(#)` 对正数使用 `+` 前缀且无后缀，并将负数括在括号内。 |\n| `decimalSeparatorAlwaysShown`\
  \ | 如果小数部分为零时显示分隔符则为 `true` | 无法在模式中设置。 |\n\n数字、分隔符和其他部分的实际符号取自 `DecimalFormatSymbols`\
  \ 对象，你也可以自定义该对象。表 7.4 列出了它的属性。\n\n#### 表 7.4：`DecimalFormatSymbol` 属性\n\n| 属性 |\
  \ 类型 | 描述 |\n| --- | --- | --- |\n| `currencySymbol` | `String` | 在前缀或后缀有 `¤` 货币符号处使用的字符串，如\
  \ `\"$\"` 或 `\"EUR\"` |\n| `decimalSeparator`, `monetaryDecimalSeparator` | `char`\
  \ | 用于数字或货币的小数分隔符 |\n| `exponentSeparator` | `String` | 指数前的字符串，通常为 `\"E\"` |\n\
  | `groupingSeparator`, `monetaryGroupingSeparator`（自 Java 15 起） | `char` | 用于数字或货币的分组分隔符\
  \ |\n| `infinity`, `naN` | `String` 用于格式化 `Double.POSITIVE_INFINITY`、`Double.NEGATIVE_INFINITY`\
  \ 和 `Double.NaN` 的字符串 |\n| `internationalCurrencySymbol` | String | ISO 4217 货币符号——参见\
  \ 第 7.2.3 节 |\n| `minusSign` | `char` | 在没有负模式时使用的减号 |\n\n\n\n\n\n| `percent`, `perMill`\
  \ | `char` | 用于百分比或千分比的字符 |\n| `zeroDigit` | `char` | 数字 0 的字符。其他数字是随后的九个 Unicode\
  \ 字符。 |\n\n例如，假设无论区域设置，你都以美国风格显示数字，使用 `,` 作为分组分隔符并使用 `.` 作为小数点分隔符。自定义 `DecimalFormatSymbols`\
  \ 和格式化器：\n\n```\nDecimalFormatSymbols symbols = new DecimalFormatSymbols(locale);\n\
  symbols.setGroupingSeparator(',');\nsymbols.setDecimalSeparator('.');\nDecimalFormat\
  \ formatter = (DecimalFormat) NumberFormat.getNumberInstance(locale);\nformatter.setDecimalFormatSymbols(symbols);\n\
  ```\n\n### 7.2.3. 货币\n\n要格式化货币值，可以使用 `NumberFormat.getCurrencyInstance` 方法。然而，该方法并不灵活——它返回一个单一货币的格式化器。假设你正在为一位美国客户准备发票，其中某些金额是美元，另一些是欧元。你不能简单地使用两个格式化器：\n\
  \n```\nNumberFormat dollarFormatter = NumberFormat.getCurrencyInstance(Locale.US);\n\
  NumberFormat euroFormatter = NumberFormat.getCurrencyInstance(Locale.GERMANY);\n\
  ```\n\n你的发票看起来会非常奇怪，某些值显示为 $100,000，而另一些显示为 100.000 €。（注意，欧元值使用的是小数点而不是逗号。）\n\n\
  相反，请使用 `Currency` 类来控制格式化器使用的货币。你可以通过向静态方法 `Currency.getInstance` 传递货币标识来获取 `Currency`\
  \ 对象。然后为每个格式化器调用 `setCurrency` 方法。以下是如何为你的美国客户设置欧元格式化器：\n\n```\nNumberFormat euroFormatter\
  \ = NumberFormat.getCurrencyInstance(Locale.US);\neuroFormatter.setCurrency(Currency.getInstance(\"\
  EUR\"));\n```\n\n货币标识由 ISO 4217 定义（参见 [`www.iso.org/iso-4217-currency-codes.html`](https://www.iso.org/iso-4217-currency-codes.html)）。[表\
  \ 7.5] 提供了一个部分列表。\n\n表 7.5：货币标识符\n\n| 货币值 | 标识符 | 数字代码 |\n| --- | --- | --- |\n\
  | 美元 | USD | 840 |\n| 欧元 | EUR | 978 |\n| 英镑 | GBP | 826 |\n| 日元 | JPY | 392 |\n\
  | 人民币（元） | CNY | 156 |\n| 印度卢比 | INR | 356 |\n| 俄罗斯卢布 | RUB | 643 |\n\n`java.util.Currency`1.4\n\
  \n* `static Currency getInstance(String currencyCode)`\n* `static Currency getInstance(Locale\
  \ locale)`\n  返回给定的 ISO 4217 货币代码或给定区域设置国家的 `Currency` 实例。\n* `String toString()`\n\
  * `String getCurrencyCode()`\n* `String getNumericCode()`\n* `String getNumericCodeAsString()`\n\
  \  获取此货币的 ISO 4217 字母或数字货币代码。\n* `String getSymbol()`\n* `String getSymbol(Locale\
  \ locale)`\n  获取该货币在默认区域或给定区域设置下的格式符号。例如，USD 的符号可以是 `\"$\"` 或 `\"US$\"`，取决于区域设置。\n\
  * `int getDefaultFractionDigits()`\n  获取此货币的默认小数位数。\n* `static Set<Currency> getAvailableCurrencies()`\n\
  \  获取所有可用的货币。\n\n### 7.3. 日期和时间\n\n当你格式化日期和时间时，你应该关注四个与区域设置有关的问题：\n\n* 月份和星的名称应以本地语言呈现。\n\
  * 年、月、日的顺序会有本地偏好。\n* 格里高利历可能不是表示日期的本地偏好。\n* 必须考虑所在位置的时区。\n\n`java.time` 包中的 `DateTimeFormatter`\
  \ 类处理了这些问题。从 [表 7.6] 显示的格式化样式中选择一种。\n\n（注：原文后续部分存在大量重复内容，此处已提取核心信息。）\n\n\n\n\n\n\
  ```java\npackage v2ch07.dateFormat;\n\nimport module java.base;\nimport v2ch07.util.*;\n\
