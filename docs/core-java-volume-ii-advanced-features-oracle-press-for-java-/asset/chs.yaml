  \ 12.20 中的辅助方法 `getWriterFormats` 会查找与每个格式名称关联的第一个写入器，并询问它的格式名称是什么，希望它能将最流行的格式列在最前面。事实上，对于\
  \ JPEG 写入器，这种方法运行良好——它在其他选项之前列出了 `\"JPEG\"`。 own， PNG 写入器在 `\"PNG\"` 之前以小写列出了 `\"\
  png\"`。因此，为了一致性，辅助方法会将小写名称强制大写。\n\n### 12.6.3 使用多幅图像读写文件\n\n某些文件——特别是动画 GIF 文件——包含多个图像。`ImageIO`\
  \ 类的 `read` 方法读取单个图像。要读取多个图像，请将输入源（例如输入流或文件）转换为 `ImageInputStream`。\n\n```\nInputStream\
  \ in = . . .;\nImageInputStream imageIn = ImageIO.createImageInputStream(in);\n\
  ```\n\n然后，将图像输入流附加到读取器：\n\n```\nreader.setInput(imageIn, true);\n```\n\n第二个参数表示输入处于“仅向前寻址”模式。否则，将使用随机访问，通过在读取时缓冲流输入或使用随机文件访问来实现。某些操作需要随机访问。例如，要确定\
  \ GIF 文件中的图像数量，你需要读取整个文件。如果你随后想获取图像，则必须再次读取输入。\n\n这种考虑仅在你从流中读取、输入包含多个图像，且图像格式未在头文件中没有包含你请求的信息（如图像计数）时才重要。如果你从文件读取，只需使用\n\
  \n``````\nFile f = . . .;\nImageInputStream imageIn = ImageIO.createImageInputStream(f);\n\
  reader.setInput(imageIn);\n```\n\n一旦有了读取器，你可以通过调用以下方法读取输入中的图像：\n\n```\nBufferedImage\
  \ image = reader.read(index);\n```\n\n其中 `index` 是图像索引，从 `0` 开始。\n\n如果输入处于“仅向前寻址”模式，你就继续读取图像，直到\
  \ `read` 方法抛出 `IndexOutOfBoundsException`。否则，你可以调用 `getNumImages` 方法：\n\n```\nint\
  \ n = reader.getNumImages(true);\n```\n\n在这里，该参数表示你允许通过搜索输入来确定图像数量。如果输入处于“仅向前寻址”模式，该方法将抛出\
  \ `IllegalStateException`。或者，你可以将“允许搜索”参数设置为 `false`。那么，如果无法在不搜索的情况下确定图像数量，`getNumImages`\
  \ 方法将返回 `-1`。在这种情况下，你将不得不转向 B 计划，继续读取图像直到获取 `IndexOutOfBoundsException`。\n\n某些文件包含缩略图——用于预览的图像较小版本。你可以通过以下调用获取图像的缩略图数量：\n\
  \n```\nint count = reader.getNumThumbnails(index);\n```\n\n然后获取特定索引的图像：\n\n```\n\
  BufferedImage thumbnail = reader.getThumbnail(index, thumbnailIndex);\n```\n\n有时你可能想在实际获取图像之前先获取图像尺寸——特别是当图像巨大或来自缓慢的网络连接时。使用以下调用\n\
  \n```\nint width = reader.getWidth(index);\nint height = reader.getHeight(index);\n\
  ```\n\n来获取给定索引图像的尺寸。\n\n要写入带有多幅图像的文件，首先你需要一个 `ImageWriter`。`ImageIO` 类可以列出能够写入特定格式的写入器：\n\
  \n```\nString format = . . .;\nImageWriter writer = null;\nIterator<ImageWriter>\
  \ iter = ImageIO.getImageritersByFormatName(format);\nif (iter.hasNext()) writer\
  \ = iter.next();\n```\n\n接下来，将输出流或文件转换为 `ImageOutputStream` 并将其附加到写入器。例如，\n\n```\n\
  File f = . . .;\nImageOutputStream imageOut = ImageIO.createImageOutputStream(f);\n\
  writer.setOutput(imageOut);\n```\n\n你必须将每个图像封装成 `IIOImage` 对象。你可以可选地提供缩略图列表和图像元数据（如压缩算法和颜色信息）。在示例中，我们对两者都使用\
  \ `null`；更多信息请参见 API 文档。\n\n```\nvar iioImage = new IIOImage(images[i], null, null);\n\
  ```\n\n写入第一幅图像时使用 `write` 方法：\n\n```\nwriter.write(new IIOImage(images[0], null,\
  \ null));\n```\n\n对于后续图像，使用\n\n```\nif (writer.canInsertImage(i))\n    writer.writeInsert(i,\
  \ iioImage, null);\n```\n\n第三个参数可以包含 `ImageWriteParam` 对象以设置图像写入细节，如分块和压缩；使用 `null`\
  \ 使用默认值。\n\n并不是所有文件格式都能处理多幅图像。在这种情况下，对于 `i > 0`，`canInsertImage` 方法返回 `false`，并且保存单幅图像。\n\
  \nListing 12.20 中的程序允许加载并保存 Java 库提供读取器和写入器的格式文件。该程序显示多幅图像（见 Figure 12.55），但不显示缩略图。\n\
  \n\n\n\n\n```java\npackage v2ch12.imageIO;\n\nimport module java.base;\nimport module\
  \ java.desktop;\nimport java.util.List;\n\n/**\n * 此框架显示已加载的图像。菜单包含加载和保存文件的项。\n\
  \ */\npublic class ImageIOFrame extends JFrame {\n    private static final int DEFAULT_WIDTH\
  \ = 400;\n    private static final int DEFAULT_HEIGHT = 400;\n\n    private static\
  \ Set<String> writerFormats = getWriterFormats();\n\n    private BufferedImage[]\
