  \ `parameterNoNulls`、`parameterNullable` 或 `parameterNullableUnknown` 之一。\n\n* `int\
  \ getPrecision(int param)`\n  返回给定的从 1 开始的索引的最大列大小。对于非数值数据类型，这是字符串或字符串表示的长度，或者二进制数据的字节数。\n\
  \n* `int getScale(int param)`\n  返回给定的从 1 开始的索引的参数小数点后的位数，对于非数值数据返回 0。\n\n## 5.9.\
  \ 事务\n\n你可以将一组语句组合成一个 `transaction`（事务）。当所有操作顺利时，事务可以被 `committed`（提交）——或者，如果其中一个语句发生错误，它可以被\
  \ `rolled back`（回滚），就像这些语句从未发布过一样。\n\n将语句分组为事务的主要原因是 `database integrity`（数据库完整性）。例如，假设我们要从一个银行账户转账到另一个账户。那么，同时扣除一个账户并增加另一个账户资金是非常重要的。如果系统在扣除第一个账户后但在增加另一个账户之前发生故障，则需要撤销扣款操作。\n\
  \n如果你将更新语句分组到一个事务中，该事务要么完全成功并被 `committed`，要么在中间某处失败。在这种情况下，你可以执行 `rollback`（回滚），数据库会自动撤销自上次提交事务以来发生的所有更新操作的影响。\n\
  \n### 5.9.1. 使用 JDBC 编程事务\n\n默认情况下，数据库连接处于 `autocommit mode`（自动提交模式），每个 SQL 语句在执行后立即提交到数据库。一旦语句被提交，你就无法将其回滚。关闭此默认设置以便使用事务：\n\
  \n```java\nconn.setAutoCommit(false);\n```\n\n按照通常方式创建语句对象：\n\n```java\nStatement\
  \ stat = conn.createStatement();\n```\n\n调用任意次数 `executeUpdate`：\n\n```java\nstat.executeUpdate(command1);\n\
  stat.executeUpdate(command2);\nstat.executeUpdate(command3);\n...\n```\n\n如果所有语句都已无执行执行，调用\
  \ `commit` 方法：\n\n```java\nconn.commit();\n```\n\n然而，如果发生错误，调用：\n\n```java\nconn.rollback();\n\
  ```\n\n然后，自上次提交以来的所有语句都将自动反转。通常当你的事务被 `SQLException` 中断时，你会发出回滚。\n\n### 5.9.2. 保存点\
  \ (Save Points)\n\n对于某些数据库和驱动程序，你可以通过 `save points`（保存点）对回滚过程进行更细粒度的控制。创建一个保存点会标记一个点，你以后可以返回该点，而无需放弃整个事务。例如：\n\
  \n```java\nStatement stat = conn.createStatement(); // 开始事务；rollback() 在这里\nstat.executeUpdate(command1);\n\
  Savepoint svpt = conn.setSavepoint(); // 设置保存点；rollback(svpt) 在这里\nstat.executeUpdate(command2);\n\
  \nif (...) conn.rollback(svpt); // 撤销 command2 的影响\n...\nconn.commit();\n```\n\n\
  当你不再需要保存点时，应该释放它：\n\n```java\nconn.releaseSavepoint(svpt);\n```\n\n### 5.9.3. 批量更新\
  \ (Batch Updates)\n\n假设程序需要执行许多 `INSERT` 语句来填充数据库表。你可以通过使用 `batch update`（批量更新）来提高程序的性能。在批量更新中，一组语句被收集并作为一个批提交。\n\
  \n使用 `DatabaseMetaData` 接口的 `supportsBatchUpdates` 方法来确定你的数据库是否支持此功能。\n\n批处理中的语句可以是\
  \ `INSERT`、`UPDATE` 或 `DELETE` 等操作，也可以是如 `CREATE TABLE` 或 `DROP TABLE` 等数据定义语句。如果你向批中添加\
  \ `SELECT` 语句，将抛出异常。（从概念上讲，`SELECT` 语句在批处理中没有意义，因为它返回的是结果集而不更新数据库。）\n\n要执行批处理，首先按通常方式创建一个\
  \ `Statement` 对象：\n\n```java\nStatement stat = conn.createStatement();\n```\n\n\
  现在，不要调用 `executeUpdate`，而是调用 `addBatch` 方法：\n\n```java\nString command = \"CREATE\
  \ TABLE ...\";\nstat.addBatch(command);\n\nwhile (...) {\n    command = \"INSERT\
  \ INTO ... VALUES (\" + \")\";\n    stat.addBatch(command);\n}\n```\n\n最后，提交批处理：\n\
  \n```java\nint[] counts = stat.executeBatch();\n```\n\n`executeBatch` 返回提交的所有语句的行数。\n\
  \n对于批处理的正确错误处理，首先关闭自动提交模式，然后执行批处理，最后恢复原始的自动提交模式：\n\n```java\nboolean autoCommit\
  \ = conn.getAutoCommit(); 如果 autocommit 为 true，所有语句在执行后立即提交。\nconn.setAutoCommit(false);\n\
  Statement stat = conn.createStatement();\n...\nstat.executeBatch();\nconn.setAutoCommit(autoCommit);\n\
  ```\n\njava.sql.Connection11\n\n* `boolean getAutoCommit()`\n* `void setAutoCommit(boolean\
  \ b)`\n  获取或设置连接的自动提交模式。如果是 `true`，所有语句在执行后立即提交。\n* `void commit()`\n  提交自上次提交以来的所有语句。\n\
  * `void rollback()`\n  撤销自上次提交以来的所有语句。\n* `Savepoint setSavepoint()`\n* `Savepoint\
  \ setSavepoint(String name)`\n  设置未命名或命名的保存点。\n* `void rollback(Savepoint svpt)`\n\
  \  回滚到指定的保存点。\n* `void releaseSavepoint(Savepoint svpt)`\n  释放指定的保存点。\n\njava.sql.Savepoint14\n\
  \n* `int getSavepointId()`\n  获取未命名保存点的 ID，如果是命名保存点则抛出 `SQLException`。\n* `String\
  \ getSavepointName()`\n  获取命名保存点的名称，如果是未命名保存点则抛出 `SQLException`。\n\njava.sql.Statement11\n\
  \n* `void addBatch(String command)`\n  将添加到语句的当前批处理中。\n* `int[] executeBatch()`\n\
  * `long[] executeLargeBatch()`\n  执行当前批处理中的所有命令。返回数组中的每个值对应于批中的一个语句。如果是非负数，则它是行数。如果是\
  \ `SUCCESS_NO_INFO`，则语句执行成功但行数不可。如果是 `EXECUTE_FAILED`，则语句失败。\n\njava.sql.DatabaseMetaData11\n\
  \n* `boolean supportsBatchUpdates()`\n  如果驱动程序支持批量更新，则返回 `true`。\n\n### 5.9.4. 高级\
  \ SQL 类型\n\nTable 5.8 列出了 JDBC 支持的 SQL 类型及其在 Java 编程语言中的等效类型。\n\n表 5.8：SQL 类型及其对应的\
  \ Java 类型\n\n| SQL 数据类型 | Java 数据类型 |\n| --- | --- |\n| `INTEGER` 或 `INT` | `int`\
  \ |\n| `SMALLINT` | `short` |\n| `NUMERIC(``m``,``n``)`, `DECIMAL(``m``,``n``)`\
  \ 或 `DEC(``m``,``n``)` | `java.math.BigDecimal` |\n| `FLOAT(``n``)` | `double` |\n\
  | `REAL` | `float` |\n| `DOUBLE` | `double` |\n| `CHARACTER(``n``)` 或 `CHAR(``n``)`\
  \ | `String` |\n| `VARCHAR(``n``)`, `LONG VARCHAR` | `String` |\n\n\n\n\n\n| `BOOLEAN`\
  \ | `boolean` |\n| :--- | :--- |\n| `DATE` | `java.sql.Date` |\n| `TIME` | `java.sql.Time`\
  \ |\n| `TIMESTAMP` | `java.sql.Timestamp` |\n| `BLOB` | `java.sql.Blob` |\n| `CLOB`\
  \ | `java.sql.Clob` |\n| `ARRAY` | `java.sql.Array` |\n| `ROWID` | `java.sql.RowId`\
  \ |\n| `NCHAR(n)`, `NVARCHAR(n)`, `LONG NVARCHAR` | `String` |\n| `NCLOB` | `java.sql.NClob`\
  \ |\n| `SQLXML` | `java.sql.SQLXML` |\n\nSQL `ARRAY` 是值的序列。例如，在 `Student` 表中，你可以有一个类型为\
  \ `ARRAY OF INTEGER` 的 `Scores` 列。`getArray` 方法返回一个接口类型为 `java.sql.Array` 的对象。该接口拥有方法来获取数组值。\n\
  \n当你从数据库获取 LOB 或数组时，只有在你请求单个值时，实际内容才会从数据库中提取。这是一个非常有用的性能优化，因为数据量可能非常大。\n\n某些数据库支持\
  \ `ROWID` 值，它描述行的位置，以便非常快速地检索。JDBC 4 引入了 `java.sql.RowId` 接口，以及在查询中提供行 ID 并从结果中检索它的方法。\n\
  \n国家字符（`NCHAR` 及其变体）使用本地字符编码存储字符串，并使用本地排序规则对其进行排序。JDBC 4 提供了在查询和结果中 Java `String`\
  \ 对象与国家字符之间进行转换的方法。\n\n某些数据库可以存储用户定义的结构化类型。JDBC 3 提供了一种自动将结构化 SQL 类型映射到 Java 对象的机制。\n\
  \n某些数据库为 XML 数据提供原生存储。JDBC 4 引入了 `SQLXML` 接口，它可以在内部 XML 表示与 DOM `Source/Result`\
  \ 接口以及二进制流之间进行调解。详情请参阅 `SQLXML` 类的 API 文档。\n\n我们不再进一步讨论这些高级 SQL 类型。你可以在 *JDBC API\
  \ Tutorial and Reference* 和 JDBC 规范中找到关于这些主题的更多信息。\n\n## 5.10 Web 和企业应用程序中的连接管理\n\
  \n前几节描述的通过 `database.properties` 文件的简单数据库连接设置适用于小型测试程序，但对于较大的应用程序来说无法扩展。\n\n当 JDBC\
  \ 应用部署在 Web 或企业环境中时，数据库连接的管理将集成到一个名为 JNDI（Java 命名和目录接口）的目录服务中。跨越整个企业的数据源属性可以存储在目录中。使用目录允许对用户名、密码、数据库名称和\
  \ JDBC URL 进行集中化管理。\n\n在这样的环境中，你可以使用以下代码建立数据库连接：\n\n```\nvar jndiContext = new InitialContext();\n\
  var source = (DataSource) jndiContext.lookup(\"java:comp/env/jdbc/corejava\");\n\
  Connection conn = source.getConnection();\n```\n\n注意，`DriverManager` 不再参与其中。相反，由\
  \ JNDI 服务负责定位数据源。数据源是一个接口，允许进行简单的 JDBC 连接以及更高级的服务，例如执行涉及多个数据库的分布式事务。`DataSource`\
  \ 接口定义在 `javax.sql` 标准扩展包中。\n\n在 Java EE 容器中，你甚至不需要编写 JNDI 查找代码。只需在 `DataSource`\
  \ 字段上使用 `Resource` 注解，数据源引用就会会在应用程序加载时被设置：\n\n```\n@Resource(name=\"jdbc/corejava\"\
  )\nprivate DataSource source;\n```\n\n当然，数据源需要在某处进行配置。如果你编写了运行在 Apache Tomcat 等\
  \ servlet 容器或 GlassFish 等应用服务器中的数据库程序，请将数据库配置（包括 JNDI 名称、JDBC URL、用户名和密码）置于配置文件中，或在管理\
  \ GUI 中设置它。\n\n用户名和登录管理只是需要特别关注的问题之一。另一个问题涉及建立数据库连接的成本。我们的示例数据库程序使用了两种策略来获取数据库连接。Listing\
  \ 5.3 中的 `QueryDB` 程序在程序开始时建立了一个单一数据库连接，并在程序结束时关闭它。Listing 5.4 中的 `ViewDB` 程序在每次需要时打开一个新连接。\n\
  \n然而，这两种方法都不令人如意。数据库连接是有限的资源。如果用户离开应用程序一段时间，连接不应保持打开状态。相反，为每个查询都获取连接并在之后关闭，是非常昂贵的。\n\
  \n解决方案是连接池。这意味着数据库连接不会被物理关闭，而是保留在队列中并用。连接池是一项重要的服务，JDBC 规范为实现者提供了钩子以提供该服务。然而，JDK\
  \ 本身不提供任何实现，数据库供应商通常也不会在其 JDBC 驱动中包含它。相反，Web 容器和应用服务器的供应商提供了连接池实现。\n\n使用连接池对程序员来说是完全透明的。通过获取数据源并调用\
  \ `getConnection` 从连接池源获取连接。当你完成连接的使用后，调用 `close`。这不会关闭物理连接，而是告诉连接池你已完成使用。连接池通常还会尝试对预处理语句进行池化。\n\
  \n# 第 6 章 日期和时间 API\n\n光阴似箭，我们可以很容易地设置一个起点并向前向后计数秒。那么，为什么处理时间如此困难呢？问题在于人类。如果我们只需要告诉彼此：“在\
  \ 152379360 见，不要迟到”，一切都会变得简单！但我们希望时间与光照和季节有关。Java 1.0 有一个 `Date` 类，从回来看它是幼稚的，并且在\
  \ Java 1.1 引入 `Calendar` 类时，它的大部分方法都被弃用了。它的 API 并不出色，其实例是可变的，并且没有处理闰秒等问题。第三次为宝，Java\
  \ 8 引入的 `java.time` API 弥补了过去的缺陷，并应该服务我们很一段时间。在本章中，你将了解为什么时间计算如此麻烦，以及日期和时间 API 如何解决这些问题。\n\
  \n## 6.1 时间线\n\n历史上，基本时间单位——秒——源于地球绕自轴的旋转。一个完整的旋转有 24 小时或 24 × 60 × 60 = 86400 秒，因此精确定义秒似乎只是一个天文测量的问题。遗憾的是，地球会轻微晃动，需要更精确的定义。1967\
  \ 年，一种与历史定义相匹配的新精确秒的定义源自铯-133 原子的固有属性。\n\n\n\n\n\n经常，官方计时器会将绝对时间与地球自转进行同步。起初，官方秒会经过微调，但从\
  \ 1972 年开始，会偶尔插入“闰秒”。（理论上，偶尔可能需要删除一秒，但这种情况尚未发生过。）目前有关于再次更改系统的说法。显然，闰秒是一个麻烦，，许多计算机系统转而使用“平滑”处理，即在闰秒发生之前人为地减慢或加速时间，以保持每天\
  \ 86,400 秒。这样做之所以有效，是因为计算机的本地时间并不十分精确，而且计算机习惯了与外部时间服务同步。\n\nJava 日期时间 API 规范要求 Java\
  \ 使用的时间尺度需要满足：\n\n*   每天有 86,400 秒\n*   每天中午时与官方时间精确匹配\n*   在其他时间以精确定义的方式与之紧密匹配\n\
  \n这使得 Java 具有足够的灵活性来适应官方时间的未来变化。\n\n在 Java 中，`Instant` 表示时间线上的一个点。一个称为 `epoch`（纪元）的原点被任意设置为\
  \ 1970 年 1 月 1 日午夜，即格林尼治皇家天文台的子午线。这与 UNIX/POSIX 时间使用的是相同的惯例。从该原点开始，时间以每天 86,400\
  \ 秒为单位向前或向后测量，精度达到纳秒。`Instant` 的值可以追溯到十亿年前（`Instant.MIN`）。这不足以表达宇宙的年龄（约 135 亿年），但对于所有实际目的来说已经足够了。毕竟，十亿年前，地球被冰雪覆盖，居住着现今植物动物的微型祖先。最大值\
  \ `Instant.MAX` 是 1,000,000,000 年的 12 月 31 日。\n\n静态方法调用 `Instant.now()` 提供当前瞬时。你可以像通常一样使用\
  \ `equals` 和 `compareTo` 方法比较两个瞬时，因此你可以将瞬时用作时间戳。\n\n要找出两个瞬时之间的差值，请使用静态方法 `Duration.between`。例如，以下是测量算法运行时间的方法：\n\
  \n```\nInstant start = Instant.now();\nrunAlgorithm();\nInstant end = Instant.now();\n\
  Duration timeElapsed = Duration.between(start, end);\nlong millis = timeElapsed.toMillis();\n\
  ```\n\n`Duration` 是两个瞬时之间的时间量。你可以通过调用 `toNanos`、`toMillis`、`toSeconds`、`toMinutes`、`toHours`\
  \ 或 `toDays` 获取常规单位的 `Duration` 长度。\n\n在 Java 8 中，你需要调用 `getSeconds` 而不是 `toSeconds`。\n\
  \n如果你需要纳秒精度，请注意溢出问题。`long` 值可以存储几乎 300 年的纳秒。如果你的持续时间短于此，只需将其转换为纳秒即可。可以使用更长的持续时间——`Duration`\
  \ 对象用 `long` 存储秒数，用额外的 `int` 存储纳秒数。`Duration` API 有许多方法用于算术，显示在本节末尾。\n\n例如，如果你想检查一个算法是否比另一个至少快十倍，你可以计算：\n\
  \n```\nDuration timeElapsed2 = Duration.between(start2, end2);\nboolean overTenTimesFaster\n\
  \     = timeElapsed.multipliedBy(10).minus(timeElapsed2).isNegative();\n```\n\n\
  这只是为了展示语法。由于算法不会运行几百年，你你可以简单地使用：\n\n```\nboolean overTenTimesFaster = timeElapsed.toNanos()\
  \ * 10 < timeElapsed2.toNanos();\n```\n\n`Instant` 和 `Duration` 类是不可变的，所有的方法（如 `multipliedBy`\
  \ 或 `minus`）都会返回一个新实例。\n\nListing 6.1 中的示例程序使用了 `Instant` 和 `Duration` 类对两个算法进行计时。\n\
  \n示例程序的方法在实践中太天真了，因为它没有处理诸如 JVM 中即时编译器（JIT）的“预热”等问题。如果你需要比较算法，应该使用专门的基准测试工具，例如 Java\
  \ 微基准测试程序 (JMH)。`https://www.oracle.com/technical-resources/articles/java/architect-benchmarking.html`\
  \ 上的提供了有用的建议。\n\nListing 6.1 v2ch06/Timeline.java\n\n```java\npackage v2ch06;\n\n\
  /**\n * 此程序演示了瞬时和持续时间。\n */\n\nimport module java.base;\n\npublic class Timeline\
  \ {\n    RandomGenerator generator = RandomGenerator.getDefault();\n\n    void main()\
  \ {\n        Instant start = Instant.now();\n        runAlgorithm();\n        Instant\
  \ end = Instant.now();\n        Duration timeElapsed = Duration.between(start, end);\n\
  \        long millis = timeElapsed.toMillis();\n        IO.println(\"%d milliseconds\"\
  .formatted(millis));\n\n        Instant start2 = Instant.now();\n        runAlgorithm2();\n\
  \        Instant end2 = Instant.now();\n        Duration timeElapsed2 = Duration.between(start2,\
  \ end2);\n        IO.println(\"%d milliseconds\".formatted(timeElapsed2.toMillis()));\n\
  \        boolean overTenTimesFaster = timeElapsed.multipliedBy(10).minus(timeElapsed2).isNegative();\n\
  \        IO.println(\"The first algorithm is %more than times faster\".formatted(overTenTimesFaster\
  \ ? \"\" : \"not \"));\n    }\n\n    void runAlgorithm() {\n        int size = 10;\n\
  \        ArrayList<Integer> list = generator.ints().map(i -> i % 100).limit(size).boxed().collect(ArrayList::new);\n\
  \        Collections.sort(list);\n        IO.println(list);\n    }\n\n    void runAlgorithm2()\
  \ {\n        int size = 10;\n        ArrayList<Integer> list = generator.ints().map(i\
  \ -> i % 100).limit(size).boxed().collect(ArrayList::new);\n        IO.println(list);\n\
  \    }\n}\n```\n\n`java.time.Instant`\n\n*   `static Instant now()`：从最佳时钟获取当前瞬时。\n\
  *   `Instant plus(TemporalAmount amountToAdd)`\n*   `Instant minus(TemporalAmount\
  \ amountToSubtract)`：产生距离此 Instant 偏移指定数量的 Instant。`Duration` 和 `Period`（见 ）实现了\
  \ `TemporalAmount` 接口。\n*   `Instant plus(long number)`\n*   `Instant minus(long\
  \ number)`：产生距离此 Instant 偏移指定数量的 Instant，`Xxx` 为 `Nanos`、`Millis` 或 `Seconds`。\n\
  \n`java.time.Duration`\n\n*   `static Duration of(long number)`：产生指定数量单位的持续时间，`Xxx`\
  \ 为 `Nanos`、`Millis`、`Seconds`、`Minutes`、`Hours` 或 `Days`。\n*   `static Duration\
  \ between(Temporal startInclusive, Temporal endExclusive)`：产生两个点之间的持续时间。`Temporal`\
  \ 接口由 `Instant` 类以及 `LocalDate`/`LocalDateTime`/`LocalTime`（见 ）和 `ZonedDateTime`（见\
  \ ）实现。\n*   `long toXxx()`\n*   `long toSeconds()`：获取此持续时间方法名中的单位，`Xxx` 为 `Nanos`、`Millis`、`Minutes`、`Hours`\
  \ 或 `Days`。\n*   `int toXxxPart()`\n*   `long toDaysPart()`：产生此持续时间内指定时间单位的部分。例如，在\
  \ 100 秒的持续时间中，分钟部分为 `1`，秒部分为 `40`。这里 `Xxx` 是 `Nanos`、`Millis`、`Seconds`、`Minutes`\
  \ 或 `Hours` 之一。\n*   `Duration plus(TemporalAmount amountToAdd)`\n*   `Duration\
  \ minus(TemporalAmount amountToSubtract)`：产生距离此 Duration 偏移指定数量的持续时间。`Duration`\
  \ 和 `Period`（见 ）实现了 `TemporalAmount` 接口。\n*   `Duration multipliedBy(long multiplicand)`\n\
  *   `Duration dividedBy(long divisor)`\n*   `Duration negated()`\n\n\n\n\n通过将此 `Duration`\
  \ 乘以或除以给定数值，或乘以 -1，来产生一个时长。\n\n* `boolean isZero()`\n* `boolean isNegative()`\n\
  \  如果此 `Duration` 为零或负，则返回 `true`。\n* `Duration plus``Xxx``(long number)`\n* `Duration\
  \ minus``Xxx``(long number)`\n  产生一个通过增加或减少给定时间单位得到的 `Duration`，其中 `Xxx` 是 `Nanos`、`Millis`、`Seconds`、`Minutes`\
  \ 或 `Hours` 之一。\n\n## 6.2. 本地日期\n\n现在让我们从绝对时间转向人类时间。Java API 中有两种类人类时间：*本地日期/时间*和*时区时间*。本地日期/时间包含日期和/或一天的时间，但没有关联的时区信息。本地日期的一个示例是\
  \ 1903 年 6 月 14 日（lambda 演算发明者埃隆佐·丘的生日）。由于该日期既没有具体时间也没有时区信息，它并不对应于精确的时间点。相比之下，1969\
  \ 年 7 月 16 日 09:32:00 EDT（阿波罗 11 号发射）就是一个时区日期/时间，代表时间线上的一个精确瞬间。\n\n许多计算并不需要时区，在某些情况下时区甚至会成为障碍。假设你安排了每周\
  \ 10:00 开一次会议。如果你在上次时区时间的基础上增加 7 天（即 7 × 24 × 60 × 60 秒），而你恰好跨过了夏令时边界，会议将会早一小时或晚一小时！\n\
  \n出于这个原因，API 设计者建议你不要使用时区时间，除非你真的想表示绝对的时间实例。生日、节假日、日程时间等通常用本地日期或本地时间表示最好。\n\n`LocalDate`\
  \ 是一个带有年、月、日的日期。要构造一个本地日期，可以使用 `now` 或 `of` 静态方法：\n\n```\nLocalDate today = LocalDate.now();\
  \ // 今天的日期\nLocalDate alonzosBirthday = LocalDate.of(1903, 6, 14);\nalonzosBirthday\
  \ = LocalDate.of(1903, Month.JUNE, 14);\n// 使用 Month 枚举\n```\n\n与 UNIX 和 `java.util.Date`\
  \ 中不规则的约定不同（其中月份从 0 开始，年份从 1900 年计算），在这里你提供一年中月份常用的数字。或者，你可以使用 `Month` 枚举。\n\n本节末尾的\
  \ API 注释了处理 `LocalDate` 对象最实用的方法。\n\n例如，*程序员节*是年的第 256 天。以下是你可以轻松计算的方法：\n\n```\n\
  LocalDate programmersDay = LocalDate.of(2014, 1, 1).plusDays(255);\n// 9 月 13 日，但在闰年将会是\
  \ 9 月 12 日\n```\n\n记住，两个时间点之间的差异是一个 `Duration`。本地日期的等效物是 `Period`，它表示经过的年、月或或天数。你可以调用\
  \ `birthday.plus(Period.ofYears(1))` 来获取明年的生日。当然，你也可以直接调用 `birthday.plusYears(1)`。但在闰年里，`birthday.plus(Period.ofDays(365))`\
  \ 不会产生正确的结果。\n\n`until` 方法产生两个本地日期之间的差异。例如，\n\n```\nindependenceDay.until(christmas)\n\
  ```\n\n产生一个 5 个月 21 天的周期。这实际上并没有那么用，因为每个月的天数不同。要查找天数，请使用\n\n```\nindependenceDay.until(christmas,\
  \ ChronoUnit.DAYS) // 174 天\n```\n\n`LocalDate` API 中的某些方法可能会创建不存在的日期。例如，在 1 月 31\
  \ 日增加一个月不应产生 2 月 31 日。这些方法不是抛出异常，而是返回该月的最后一天。例如，\n\n```\nLocalDate.of(2016, 1, 31).plusMonths(1)\n\
  ```\n\n以及\n\n```\nLocalDate.of(2016, 3, 31).minusMonths(1)\n```\n\n返回 2016 年 2 月\
  \ 29 日。\n\n`getDayOfWeek` 以 `DayOfWeek` 枚举的值返回星期几。`DayOfWeek.MONDAY` 的数值为 `1`，`DayOfWeek.SUNDAY`\
  \ 的值为 `7`。例如，\n\n```\nLocalDate.of(1900, 1, 1).getDayOfWeek().getValue()\n```\n\n\
  产生 `1`。`DayOfWeek` 枚举具有便利方法 `plus` 和 `minus` 来计算对 7 取模的星期。例如，`DayOfWeek.SATURDAY.plus(3)`\
  \ 产生 `DayOfWeek.TUESDAY`。\n\n周末日实际上位于周的最后。这与 `java.util.Calendar` 不同，周日的值为 `1`，星期六值为\
  \ `7`。\n\n实用的 `datesUntil` 方法产生 `LocalDate` 对象的流：\n\n```\nLocalDate start = LocalDate.of(2000,\
  \ 1, 1);\nLocalDate endExclusive = LocalDate.now();\nStream<LocalDate> allDays =\
  \ start.datesUntil(endExclusive);\nStream<LocalDate> firstDaysInMonth = start.datesUntil(endExclusive,\
  \ Period.ofMonths(1));\n```\n\n除了 `LocalDate` 之外，还有 `MonthDay`、`YearMonth` 和 `Year`\
  \ 类来描述部分日期。例如，12 月 25 日（未指定年份）可以表示为 `MonthDay`。\n\n示例 6.2 中的示例程序显示了如何使用 `LocalDate`\
  \ 类。\n\nListing 6.2 v2ch06/LocalDates.java\n\n```\npackage v2ch06;\n\n/**\n * 此程序演示了本地日期。\n\
  \ */\nimport module java.base;\n\nclass LocalDates {\n    void main() {\n      \
  \  LocalDate today = LocalDate.now(); // 今天的日期\n        IO.println(\"today: \" +\
  \ today);\n\n        LocalDate alonzosBirthday = LocalDate.of(1903, 6, 14);\n  \
  \      alonzosBirthday = LocalDate.of(1903, Month.JUNE, 14);\n        // 使用 Month\
  \ 枚举\n        IO.println(\"alonzosBirthday: \" + alonzosBirthday);\n\n        LocalDate\
  \ programmersDay = LocalDate.of(2014, 1, 1).plusDays(255);\n        // 9 月 13 日，但在闰年将会是\
  \ 9 月 12 日\n        IO.println(\"programmersDay: \" + programmersDay);\n\n     \
  \   LocalDate independenceDay = LocalDate.of(2014, 7, 4);\n        LocalDate christmas\
  \ = LocalDate.of(2014, 12, 25);\n        IO.println(independenceDay.until(christmas));\n\
  \        IO.println(independenceDay.until(christmas, ChronoUnit.DAYS)); // 174 天\n\
  \n        IO.println(LocalDate.of(2016, 1, 31).plusMonths(1));\n        IO.println(LocalDate.of(2016,\
  \ 3, 31).minusMonths(1));\n\n        IO.println(LocalDate.of(1900, 1, 1).getDayOfWeek().getValue());\n\
  \n        LocalDate start = LocalDate.of(2000, 1, 1);\n        LocalDate endExclusive\
  \ = LocalDate.now();\n        Stream<LocalDate> allDays = start.datesUntil(endExclusive);\n\
  \        Stream<LocalDate> firstDaysInMonth = start.datesUntil(endExclusive, Period.ofMonths(1));\n\
  \        IO.println(firstDaysInMonth.toList());\n    }\n}\n```\n\n`java.time.LocalDate`\n\
  \n* `static LocalDate now()`\n  获取当前的 `LocalDate`。\n* `static LocalDate of(int year,\
