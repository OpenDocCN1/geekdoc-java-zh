  \n### 2.3.4. 复制、移动和删除文件\n\n要将文件从一个位置复制到另一个位置，只需调用\n\n```\nFiles.copy(fromPath, toPath);\n\
  ```\n\n改为移动文件，请调用\n\n```\nFiles.move(fromPath, toPath);\n```\n\n如果目标存在，复制或移动将失败。如果你想覆盖现有的目标，请使用\
  \ `REPLACE_EXISTING` 选项。如果你想复制所有文件属性，请使用 `COPY_ATTRIBUTES` 选项。你可以这样提供两个选项：\n\n```\n\
  Files.copy(fromPath, toPath, StandardCopyOption.REPLACE_EXISTING,\n    StandardCopyOption.COPY_ATTRIBUTES);\n\
  ```\n\n你可以指定移动应该是原子的。这样你就能确保移动要么成功完成，要么源文件继续存在。使用 `ATOMIC_MOVE` 选项：\n\n```\nFiles.move(fromPath,\
  \ toPath, StandardCopyOption.ATOMIC_MOVE);\n```\n\n你还可以将输入流复制到 `Path`，这意味着将输入流保存到磁盘。同样，你可以将\
  \ `Path` 复制到输出流。使用以下调用：\n\n```\nFiles.copy(inputStream, toPath);\nFiles.copy(fromPath,\
  \ outputStream);\n```\n\n与其他 `copy` 调用一样，你可以根据需要提供复制选项。\n\n最后，要删除文件，只需调用\n\n```\n\
  Files.delete(path);\n```\n\n如果文件不存在，该方法将抛出异常，因此你可能需要使用\n\n```\nboolean deleted =\
  \ Files.deleteIfExists(path);\n```\n\n此方法也可以用于删除空目录。\n\n表 2.4：文件操作的标准选项\n\n| 选项\
