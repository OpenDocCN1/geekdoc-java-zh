  \ `true`。通常你希望返回 `true`，但如果你不想编辑过程改变单元格的选择，可以返回 `false`。\n\n*   `void cancelCellEditing()`\n\
  \    取消编辑过程。你可以放弃部分编辑。\n\n*   `boolean stopCellEditing()`\n    停止编辑过程，并意图使用结果。如果编辑后的值处于可检索的正确状态，返回\
  \ `true`。\n\n*   `Object getCellEditorValue()`\n    返回编辑后的结果。\n\n*   `void addCellEditorListener(CellEditorListener\
  \ l)`\n*   `void removeCellEditorListener(CellEditorListener l)`\n    添加或移除单元格编辑器监听器。\n\
  \n## 12.4. 树\n\n每个使用过分层文件系统的计算机用户都应该见过树形显示。当然，目录和文件只是树形组织众多例子中的一个。日常生活中存在许多树形结构，例如图\
  \ 12.11 所示的国家、州和城市的层级结构。\n\n.图 12.11: 国家、州和城市的层级结构。\n\n作为程序员，我们经常需要显示树形结构。幸运的是，Swing\
  \ 库有一个为此目的设计的 `JTree` 类。`JTree` 类（同它的辅助类）负责树的布局以及处理用户展开和折叠节点的请求。在本节中，你将学习如何使用 `JTree`\
  \ 类。\n\n与其他其它复杂的 Swing 组件一样，我们必须关注常见且实用的情况，无法涵盖每一个细微差别。如果你想实现某些不寻的功能，我们建议你参考 David\
  \ M. Geary 编写的 *Graphic Java*, Third Edition* 或 Kim Topley 编写的 *Core Swing*。\n\n\
  在继续之前，让我们先确定一些术语（参见图 12.12）。`tree`（树）由`nodes`（节点）组成。每个节点要么是`leaf`（叶节点），要么拥有`child\
  \ nodes`（子节点）。除根节点外的每个节点只有一个`parent`（父节点）。树只有一个根节点。有时你有一组树，每棵树都有自己的根节点。这样的集合被称为`forest`（森林）。\n\
  \n.图 12.12: 树术语\n\n### 12.4.1. 简单树\n\n在第一个示例程序中，我们将简单显示一个包含几个节点的树（参见图 12.14）。与许多其他\
  \ Swing 组件一样，你需要提供一个数据模型，由组件为你显示它。要构造一个 `JTree`，可以在构造函数中提供树模型：\n\n```\nTreeModel\
  \ model = . . .;\nvar tree = new JTree(model);\n```\n\n还有一些从元素集合构造树的构造函数：\n\n```\n\
  JTree(Object[] nodes)\nJTree(Vector<?> nodes)\nJTree(Hashtable<?, ?> nodes) // 值变为节点\n\
  ```\n\n这些构造函数并没有很有用。它们只是构建了一个树森林，每棵树只有一个节点。第三个构造函数看起来特别没用，因为节点按照键的哈希值决定的看似随机的顺序出现的。\n\
  \n如何获取树模型？你可以通过创建一个实现 `TreeModel` 接口的类来构建自己的模型。你将在本章稍后部分看到如何做这一点。现在，我们将坚持 Swing\
  \ 库提供的 `DefaultTreeModel`。\n\n要构造默认树模型，你必须提供一个根节点。\n\n```\nTreeNode root = . . .;\n\
  var model = new DefaultTreeModel(root);\n```\n\n`TreeNode` 是另一个接口。用任何实现该接口的类的对象填充默认树模型。现在，我们将使用\
  \ Swing 提供的具体类——即 `DefaultMutableTreeNode`。该类实现了 `MutableTreeNode` 接口，它是 `TreeNode`\
  \ 的子接口（参见图 12.13）。\n\n.图 12.13: 树类\n\n默认可变树节点持有一个对象——`user object`（用户对象）。树渲染所有节点的用户对象。除非你指定渲染器，否则树将显示\
  \ `toString` 方法的结果字符串。\n\n在第一个示例中，我们使用字符串作为用户对象。在实践中，你通常会用更有表达的用户对象填充树。例如，在显示目录树时，使用\
  \ `File` 对象作为节点是有意义的。\n\n你可以在构造函数中指定用户对象，也可以稍后通过 `setUserObject` 方法设置它。\n\n```\n\
  var node = new DefaultMutableTreeNode(\"Texas\");\n. . .\nnode.setUserObject(\"\
  California\");\n```\n\n接下来，你需要建立节点之间的父/子关系。从根节点开始并使用 `add` 方法添加子节点：\n\n```\nvar\
  \ root = new DefaultMutableTreeNode(\"World\");\nvar country = new DefaultMutableTreeNode(\"\
  USA\");\nroot.add(country);\nvar state = new DefaultMutableTreeNode(\"California\"\
  );\ncountry.add(state);\n```\n\n图 12.14 展示了树的样貌。\n\n![图](img/fig06-18.jpg)图 12.14:\
  \ 简单树\n\n以这种方式连接所有节点。然后，用根节点构造一个 `DefaultTreeModel`。最后，用根节点构造一个 `JTree`。\n\n```\n\
  var treeModel = new DefaultTreeModel(root);\nvar tree = new JTree(treeModel);\n\
  ```\n\n或者，作为快捷方式，你可以直接将根节点传递给 `JTree`：\n\n```\nvar tree = new JTree(root);\n```\n\
  \n列表 12.8 包含了完整的代码。\n\nListing 12.8 v2ch12/tree/SimpleTreeFrame.java\n\n```\npackage\
  \ v2ch12.tree;\n\nimport java.desktop;\n\n/**\n * 此框架包含一个简单的树。\n */\nclass SimpleTreeFrame\
  \ extends JFrame {\n    private static final int DEFAULT_WIDTH = 300;\n    private\
  \ static final int DEFAULT_HEIGHT = 200;\n\n    public SimpleTreeFrame() {\n   \
  \     setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\n        // 设置模型数据\n\n        var\
  \ root = new DefaultMutableTreeNode(\"World\");\n        var country = new DefaultMutableTreeNode(\"\
  USA\");\n        root.add(country);\n        var state = new DefaultMutableTreeNode(\"\
  California\");\n        country.add(state);\n        var city = new DefaultMutableTreeNode(\"\
  San Jose\");\n        state.add(city);\n        city = new DefaultMutableTreeNode(\"\
  Cupertino\");\n        state.add(city);\n        state = new DefaultMutableTreeNode(\"\
  Michigan\");\n        country.add(state);\n        city = new DefaultMutableTreeNode(\"\
  Ann Arbor\");\n        state.add(city);\n        country = new DefaultMutableTreeNode(\"\
  Germany\");\n        root.add(country);\n        state = new DefaultMutableTreeNode(\"\
  Schleswig-Holstein\");\n        country.add(state);\n        city = new DefaultMutableTreeNode(\"\
  Kiel\");\n        state.add(city);\n\n        // 构造树并将其放入滚动面板\n\n        var tree\
  \ = new JTree(root);\n        add(new JScrollPane(tree));\n    }\n}\n```\n\n当你运行程序时，树起初看起来如图\
  \ 12.15 所示。只有根节点及其子节点可见的。点击圆形图标（*handles*）可以打开子树。从手柄图标上伸出的线在子树折叠时指向右侧，在子树展开时指向下方（参见图\
  \ 12.16）。\n\n![图](img/fig06-19.jpg)图 12.15: 初始树显示![图](img/fig06-20.jpg)图 12.16:\
  \ 折叠和展开的子树\n\n当然，树的显示取决于所选的外观（look-and-feel）。我们刚刚描述了 Metal 界面。在 Windows 界面中，手柄具有更熟悉的样式——方框中的“–”或“`+`”（参见图\
  \ 12.17）。\n\n![图](img/fig06-21.jpg)图 12.17: Windows 外观的树\n\n\n\n\n\n你可以使用以下魔法咒语来关闭父子节点之间的连接线（参见图\
  \ 12.18）：\n\n```\ntree.putClientProperty(\"JTree.lineStyle\", \"None\");\n```\n\n\
  ![Figure](img/fig06-22.jpg)图 12.18：没有连接线的树\n\n相反，为了确保显示线条，请使用\n\n``````\ntree.putClientProperty(\"\
  JTree.lineStyle\", \"Angled\");\n```\n\n另一种线条样式 `\"Horizontal\"` 显示在图 12.19 中。该树的显示方式为仅用水平线分隔根节点的子节点。我不太确定这有什么用。\n\
  \n![Figure](img/fig06-23.jpg)图 12.19：具有水平线样式的树\n\n默认情况下，没有用于折叠树根节点的句柄。如果你需要，可以通过调用以下方法添加一个句柄：\n\
  \n```\ntree.setShowsRootHandles(true);\n```\n\n图 12.20 显示了结果。现在你可以将整个树折叠到根节点了。\n\
  \n![Figure](img/fig06-24.jpg)图 12.20：带有根句柄的树\n\n相反，你可以完全隐藏根节点。这将显示一个*森林*——一组树，每棵树都有自己的根节点。你仍然必须将森林中的所有树连接到一个公共根节点；然后使用指令隐藏根节点：\n\
  \n```\ntree.setRootVisible(false);\n```\n\n查看图 12.21。那里似乎有两个根节点，分别标记为“USA”和“Germany”。连接这两个节点的实际根节点被设置为不可见。\n\
  \n![Figure](img/fig06-25.jpg)图 12.21：森林\n\n让我们从根节点转向树的叶子节点。注意，叶子节点的图标与其他节点不同（参见图\
  \ 12.22）。\n\n![Figure](img/fig06-26.jpg)图 12.22：叶子和文件夹图标\n\n当显示树时，每个节点都带有一个图标。实际上有三种图标：叶子图标、打开的非叶子图标和关闭的非叶子图标。为了简单起见，我们将后两种称为文件夹图标。\n\
  \n节点渲染器需要知道每个节点使用哪种图标。默认情况下，决策过程如下：如果节点的 `isLeaf` 方法返回 `true`，则使用叶子图标；否则使用文件夹图标。\n\
  \n`DefaultMutableTreeNode` 类的 `isLeaf` 方法在节点没有子节点时返回 `true`。因此，有子节点的节点获得文件夹图标，而没有子节点的节点获得叶子图标。\n\
  \n有时，这种行为并不恰当。假设我们在示例树中添加了一个名为“Montana”的节点，但我们不知道应该添加哪些城市。我们不希望该州节点获得叶子图标，因为从概念上讲，只有城市才是叶子。\n\
  \n`JTree` 类并不知道哪些节点应该是叶子。它会询问树模型。如果一个没有子节点的节点在概念上不是叶子，你可以要求树模型使用不同的标准来判断是否为叶子——即查询“允许子节点”节点属性。\n\
  \n对于不应有子节点的节点，调用：\n\n```\nnode.setAllowsChildren(false);\n```\n\n然后，告诉树模型查询“允许子节点”属性的值来确定一个节点是否应该显示为叶子图标。使用\
  \ `DefaultTreeModel` 类的 `setAsksAllowsChildren` 方法来设置此行为：\n\n```\nmodel.setAsksAllowsChildren(true);\n\
  ```\n\n使用此决策标准，允许子节点的节点获得文件夹图标，而不允许子节点的节点获得叶子图标。\n\n或者，如果你从根节点构造树，请在构造函数中提供“询问允许节点”属性的设置。\n\
  \n```\nvar tree = new JTree(root, true); // 不允许子节点的节点获得叶子图标\n```\n\n`javax.swing.JTree`\
  \ 1.2\n\n*   `JTree(TreeModel model)`：从树模型构建树。\n*   `JTree(TreeNode root)`\n*  \
  \ `JTree(TreeNode root, boolean asksAllowChildren)`：使用默认树模型构建树，该模型显示根节点及其子节点。\n\
  *   `void setShowsRootHandles(boolean b)`：如果 `b` 为 `true`，则根节点有一个用于折叠或展开其子节点的句柄。\n\
  *   `void setRootVisible(boolean b)`：如果 `b` 为 `true`，则显示根节点。否则将其隐藏。\n\n`javax.swing.tree.TreeNode`\
  \ 1.2\n\n*   `boolean isLeaf()`：如果此节点在概念上是叶子，则返回 `true`。\n*   `boolean getAllowsChildren()`：如果此节点可以有子节点，则返回\
  \ `true`。\n\n`javax.swing.tree.MutableTreeNode` 1.2\n\n*   `void setUserObject(Object\
  \ userObject)`：设置树节点用于渲染的“用户对象”。\n\n`javax.swing.tree.TreeModel` 1.2\n\n*   `boolean\
  \ isLeaf(Object node)`：如果此节点在概念上是叶子，则返回 `true`。\n\n`javax.swing.tree.DefaultTreeModel`\
  \ 1.2\n\n*   `void setAsksAllowsChildren(boolean b)`：如果 `b` 为 `true`，模型询问“允许子节点”属性。\n\
  \n`javax.swing.tree.DefaultMutableTreeNode` 1.2\n\n*   `void setUserObject(Object\
  \ userObject)`：设置树节点用于渲染的“用户对象”。\n*   `void add(TreeNode child)`：向此节点添加子节点。\n* \
  \  `void setAllowsChildren(boolean b)`：如果 `b` 为 `false`，则节点不能有子节点。\n\n`javax.swing.JTree`\
  \ 1.2\n\n*   `void setAllowsChildren(boolean b)`：如果 `b` 为 `true`，树有一个用于折叠或展开其子节点的句柄。\n\
  \n`javax.swing.JComponent` 1.2\n\n*   `void putClientProperty(Object key, Object\
  \ value)`：在此处添加键值对。这是 Swing 组件使用的“逃生口”机制。\n\n### 12.4.2 编辑树和树路径\n\n在下一个示例中，你将看到如何编辑树。图\
  \ 12.23 显示了用户界面。点击“兄弟节点”或“添加子节点”按钮，程序将添加一个新节点（带有标题）。点击“删除”按钮，程序将删除当前选中的节点。\n\n\n\
  \n\n\n```\nvar selectedNode = (DefaultMutableTreeNode) tree.getLastSelectedPathComponent();\n\
  ```\n\n该方法没有命名为 `getSelectedNode` 是因为树不知道自己包含节点——它的树模型只处理对象的路径。\n\n树路径是 `JTree`\
  \ 类描述节点的两种方式之一。相当多的 `JTree` 方法接收或返回一个整数索引——即“**行位置**”（`row position`）。行位置仅仅是节点在树显示器中的行号（从\
  \ 0 开始）。只有可见节点才有行号，而且如果某个节点之前的其他节点被展开、折叠或修改，该节点的行号就会发生变化。出于这个原因，你应该避免使用行位置。所有使用行位置的\
  \ `JTree` 方法都有使用树路径的等效方法。\n\n一旦获取了选中的节点，就可以对其进行编辑。但是，不要简单地向树节点添加子节点：\n\n```\nselectedNode.add(newNode);\
  \ // 不要！\n```\n\n如果你更改了节点的结构，你更改了模型，但关联的视图不会收到通知。你可以自己发送通知，但如果你使用 `DefaultTreeModel`\
  \ 类的 `insertNodeInto` 方法，模型类会处理该问题。例如，接下来的调用会将新节点作为所选节点的最后一个子节点并通知树视图：\n\n```\n\
  model.insertNodeInto(newNode, selectedNode, selectedNode.getChildCount());\n```\n\
  \n相应的调用 `removeNodeFromParent` 会移除一个节点并通知视图：\n\n```\nmodel.removeNodeFromParent(selectedNode);\n\
  ```\n\n如果你保持节点结构不变但更改了用户对象，则应该调用以下方法：\n\n```\nmodel.nodeChanged(changedNode);\n\
  ```\n\n自动通知是使用 `DefaultTreeModel` 的一个主要优势。如果你提供自己的树模型，则必须手动实现自动通知。（详情请参阅 Kim Topley\
  \ 写的 *Core Swing*。）\n\n`DefaultTreeModel` 类有一个 `reload` 方法，它可以重新加载整个模型。然而，不要仅仅为了在进行几处更改后就调用\
  \ `reload` 来更新树。当树被重新生成时，根节点节点之外的所有节点都会再次被折叠。如果用户必须在每次更改后都不断展开树，这会让他们感到非常困扰。\n\n\
  当视图收到节点结构更改的通知时，它会更新显示，但不会自动展开节点来显示新添加的子节点。特别是，如果我们示例程序中的用户为一个当前折叠状态的节点添加新子节点，新节点将静默地添加到折叠的子树中。这没有给用户提供命令已实际执行的反馈。在这种情况下，你应该努力展开所有父节点，以便新添加的节点变得可见。使用\
  \ `JTree` 类的 `makeVisible` 方法即可实现。`makeVisible` 方法期望一个指向应变为可见节点的树路径。\n\n因此，你需要构建一个从根到新插入节点的树路径。要获取树路径，首先调用\
  \ `DefaultTreeModel` 类的 `getPathToRoot` 方法。它返回一个包含从节点到根节点的所有节点的 `TreeNode[]` 数组。将该数组传递给\
  \ `TreePath` 构造函数。\n\n例如，这是让新节点可见的方法：\n\n```\nTreeNode[] nodes = model.getPathToRoot(newNode);\n\
  var path = new TreePath(nodes);\ntree.makeVisible(path);\n```\n\n奇怪的是，`DefaultTreeModel`\
  \ 类几乎装出完全不认识 `TreePath` 类，尽管它的工作是与 `JTree` 通信。`JTree` 类频繁使用树路径，而且从不使用节点对象数组。\n\n\
  现在，假设你的树包含在一个滚动面板中。展开树节点后，新节点可能仍然不可见，因为它位于视口之外。为了解决这个问题，请调用\n\n```\ntree.scrollPathToVisible(path);\n\
  ```\n\n而不是调用 `makeVisible`。此调用会展开路径上的所有节点，并告诉周围的滚动面板将路径末端的节点滚动可见（参见图 12.25）。\n\n\
  ![Figure](img/fig06-29.jpg)图 12.25：滚动面板滚动显示新节点。\n\n默认情况下，树节点是不可编辑的。然而，如果你调用\n\n\
  ```\ntree.setEditable(true);\n```\n\n用户只需双击、编辑字符串并按回车键，即可编辑节点。双击会调用**默认单元格编辑器**（`default\
  \ cell editor`），它由 `DefaultCellEditor` 类实现（参见图 12.26）。可以安装其他的单元格编辑器，过程与我们在讨论表格单元格编辑器时看到的相同。\n\
