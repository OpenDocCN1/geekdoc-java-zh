  \n让我们来看树模型。前两个方法非常简单。\n\n```\npublic Object getRoot() {\n    return root;\n}\n\n\
  public int getChildCount(Object parent) {\n    return ((Variable) parent).getFields().size();\n\
  }\n```\n\n`getChild` 方法返回一个描述给定索引字段的 `Variable` 对象。`Field` 类的 `getType` 和 `getName`\
  \ 方法产生字段类型和名称。该方法可能会抛出 `IllegalAccessException`。然而，我们在 `Variable` 构造函数中设置了所有字段为可访问，因此这在实践中不会发生。\n\
  \n这里是 `getChild` 方法的完整代码：\n\n```\npublic Object getChild(Object parent, int index)\
  \ {\n    ArrayList fields = ((Variable) parent).getFields();\n    var f = (Field)\
  \ fields.get(index);\n    Object parentValue = ((Variable) parent).getValue();\n\
  \    try {\n        return new Variable(f.getType(), f.getName(), parentValue);\n\
  \    }\n    catch (IllegalAccessException e) {\n        return null;\n    }\n}\n\
  ```\n\n这三个方法向 `JTree` 组件展示了树的结构。其余的方法是常规的——参见 Listing 12.13 中的源码。\n\n关于这个树模型有一个惊人的事实：它实际上描述了一棵无限的树。你可以通过追踪\
  \ `WeakReference` 对象来验证这一点。点击名为 `referent` 的变量。它会带你回到原始对象。你得到了一个相同的子树，并可以再次打开它的\
  \ `WeakReference` 对象，如此。。，你无法存储无限节点集；树模型仅在用户展开父节点时按需生成节点。Listing 12.12 展示了示例程序的帧类。\n\
  \n\n\n\n\n```\npackage v2ch12.treeModel;\n\nimport module java.base;\nimport module\
  \ java.desktop;\n\n/**\n * 此树模型描述了 Java 对象的树形结构。子节点是存储在\n * 变量中的对象。\n */\npublic\
  \ class ObjectTreeModel implements TreeModel {\n    private Variable root;\n   \
  \ private EventListenerList listenerList = new EventListenerList();\n\n    /**\n\
  \     * 构建一个空树。\n     */\n    public ObjectTreeModel() {\n        root = null;\n\
  \    }\n\n    /**\n     * 将根设置为给定的变量。\n     * @param v 被树描述的变量\n     */\n    public\
  \ void setRoot(Variable v) {\n        Variable oldRoot = v;\n        root = v;\n\
  \        fireTreeStructureChanged(oldRoot);\n    }\n\n    public Object getRoot()\
  \ {\n        return root;\n    }\n\n    public int getChildCount(Object parent)\
  \ {\n        return ((Variable) parent).getFields().size();\n    }\n\n    public\
  \ Object getChild(Object parent, int index) {\n        ArrayList<Field> fields =\
  \ ((Variable) parent).getFields();\n        var f = (Field) fields.get(index);\n\
  \        Object parentValue = ((Variable) parent).getValue();\n        try {\n \
  \           return new Variable(f.getType(), f.getName(), f.get(parentValue));\n\
  \        }\n        catch (IllegalAccessException e) {\n            return null;\n\
  \        }\n    }\n\n    public int getIndexOfChild(Object parent, Object child)\
  \ {\n        int n = getChildCount(parent);\n        for (int i = 0; i < n; i++)\n\
  \            if (getChild(parent, i).equals(child)) return i;\n        return -1;\n\
  \    }\n\n    public boolean isLeaf(Object node) {\n        return getChildCount(node)\
  \ == 0;\n    }\n\n    public void valueForPathChanged(TreePath path, Object newValue)\
  \ {\n    }\n\n    public void addTreeModelListener(TreeModelListener l) {\n    \
  \    listenerList.add(TreeModelListener.class, l);\n    }\n\n    public void removeTreeModelListener(TreeModelListener\
  \ l) {\n        listenerList.remove(TreeModelListener.class, l);\n    }\n\n    protected\
  \ void fireTreeStructureChanged(Object oldRoot) {\n        var event = new TreeModelEvent(this,\
  \ new Object[] { oldRoot });\n        for (TreeModelListener l : listenerList.getListeners(TreeModelListener.class))\n\
  \            l.treeStructureChanged(event);\n    }\n}\n```\n列表 12.14 v2ch12/treeModel/Variable.java\n\
