  \ (`TWO_SIDED_SHORT_EDGE`) | ✓ | ✓ | ✓ |  |\n\n你可以看到，有很多属性，其中许多是专门的。大多数的来源是互联网打印协议\
  \ 1.1 (RFC 2911)。\n\n打印 API 的早期引入了 `JobAttributes` 和 `PageAttributes` 类，其目的与本节涵盖的打印属性相似。这些类已过时。\n\
  \n`javax.print.attribute.Attribute`\n\n*   `Class getCategory()`\n    获取此属性的类别。\n\
  *   `String getName()`\n    获取此属性名称。\n\n`javax.print.attribute.AttributeSet`\n\n\
  *   `boolean add(Attribute attr)`\n    将属性添加到集合。如果集合具有相同类别的属性，则用给定的属性替换。如果集合由于此操作发生了变化，则返回\
  \ `true`。\n*   `Attribute get(Class category)`\n    根据指定的类别键检索属性，如果不存在此类属性则返回 `null`。\n\
  *   `boolean remove(Attribute attr)`\n*   `boolean remove(Class category)`\n   \
  \ 从集合中删除给定的属性，或具有指定类别的属性。如果集合由于此操作发生了变化，则返回 `true`。\n*   `Attribute[] toArray()`\n\
  \    返回包含集合中所有属性的数组。\n\n`javax.print.PrintService`\n\n*   `PrintServiceAttributeSet\
  \ getAttributes()`\n    获取此打印服务的属性。\n\n`javax.print.DocPrintJob`\n\n*   `PrintJobAttributeSet\
  \ getAttributes()`\n    获取此打印作业的属性。\n\n你现在已经到达了关于高级 Swing 和 AWT 特性的长章节的终点。在最后一章中，我们将转向\
  \ Java 编程的另一个方面：在同一机器上与不同语言的“原生”代码交互。\n\n\n\n\n特别是在 Java 早期，许多人认为使用 `C` 或 `C++`\
  \ 来加速 Java 应用的关键部分是一个好主意。然而，在实践中，这很少有用。1996 年 JavaOne 大会上的演示清晰地说明了这一点。Sun Microsystems\
  \ 加密库的开发者报告说，其加密函数的纯 Java 平台实现完全足够了。确实，代码运行没有 `C` 实现那么快，但事实证明这并不重要。Java 平台的实现速度远快于网络\
  \ I/O，而这才是真正的瓶颈。\n\n从那时起，即时编译器（JIT compiler）已经变得优秀得多，仅仅为了性能而转向原生代码已不再常见。但但仍然存在其他合理的理由，例如：\n\
  \n* 你的应用程序需要访问 Java 平台无法访问的系统功能或设备。\n* 你在另一种语言中拥有大量经过测试和调试的代码。\n\n例如，考虑使用一个用 `C`\
  \ 或 `C++` 编写并使用 GPU 的人工智能库。在 Java 中重新实现它可能并不切实际。在这种情况下，Java 和原生代码之间的桥接就变得必要的。\n\n\
  自 Java 1.1 以来，Java 平台一直有一个与原生 `C` 代码相互操作的 API，称为 Java Native Interface（`JNI`）。\n\
  \n然而，正如你将看到的，使用 `JNI` 涉及某些繁琐的工作。Java 17 引入了一个预览特性 API，用于访问“外部”函数和内存，它比 `JNI` 方便得多。这个\
  \ `FFM API` 现在已成为 Java 25 的正式特性。\n\n我们将通过让你简要了解 `JNI` 来开始本章节，然后转向 `FFM API`。在新的项目中你应该使用该\
  \ API。在未来的某个时刻，`JNI` 可能会被废弃。\n\n当然，使用原生代码也有缺点。如果你的应用程序的一部分是用另一种语言编写的，你必须为你你想要支持的每个平台提供独立的原生库。用\
  \ `C` 或 `C++` 编写的代码无法防止通过无效指针使用导致的内存覆盖。很容易编写出破坏你的程序或感染操作系统的原生方法。\n\n出于这个原因，从 Java\
  \ 22 开始，你必须手动开启原生访问（无论是通过 `JNI` 还是 `FFM API`）。如果你不使用模块，请如下启动启动程序：\n\n```\njava --enable-native-access=ALL-UNNAMED\
  \ ...\n```\n\n在模块化程序中，列出允许原生访问的模块：\n\n```\njava --enable-native-access=module1,\
  \ module2 ...\n```\n\n## 13.1. 使用 JNI 从 Java 程序中调用 C 代码\n\n假设你有一个 `C` 函数，它执行某些你喜欢的操作，并且出于某种原因，你不想费力在\
  \ Java 中重新实现它。为了说明起，我们将调用带有一个参数的 `C` `printf` 函数。\n\n使用 `JNI`，你需要使用 `native` 关键字声明一个代理方法，并且你显然需要将该方法放在一个类中。结果显示在列表\
  \ 13.1 中。\n\n`native` 关键字提醒编译器方法将在外部定义。当然，原生方法不包含任何 Java 代码，且方法头后面紧跟一个结束分号。因此，原生方法的声明看起来类似于抽象方法的声明。\n\
  \nListing 13.1 v2ch13/jnidemo/HelloNative.java\n\n```\npackage v2ch13.jnidemo;\n\
  \nclass HelloNative {  \n    public static native int printf(String str);\n}\n```\n\
  \n在这个特定的示例中，原生方法也被声明为 `static`。原生方法可以是静态的也可以是非静态的。\n\n你实际上可以编译这个类，但如果你尝试在程序中使用它，虚拟机会告诉你它不知道如何找到\
  \ `printf`——报告 `UnsatisfiedLinkError`。要实现原生代码，请编写相应的 `C` 函数。你必须*完全*按照 Java 虚拟机期望的方式命名该函数。规则如下：\n\
  \n1. 使用完整的 Java 方法名，例如 `jnidemo.HelloNative.printf`。\n2. 将每个点替换为下划线，并添加前缀 `Java_`。例如，`Java_jnidemo_HelloNative_printf`。\n\
  3. 如果类名包含不是 ASCII 字母或数字的字符——即 `'_'`、`'$'` 或代码大于 `\\u007F` 的 Unicode 字符——将将它们替换为\
  \ `_0xxxx`，其中 `xxxx` 是该字符 Unicode 值的四位十六进制序列。\n\n如果你*重载*了原生方法——即如果你提供了多个同名的原生方法——你必须附加双下划线，后跟编码的参数类型。例如，如果你有一个原生方法\
  \ `greeting()` 和另一个原生方法 `greeting(int repeat)`，那么第一个被称为 `Java_jnidemo_HelloNative_greeting__`，第二个是\
  \ `Java_jnidemo_HelloNative_greeting__I`。\n\n实际上，没有人会手动这样做；相反，请带有 `-h` 标志运行 `javac`，并提供头文件应该放置的目录：\n\
  \n```\njavac -h v2ch13/jnidemo v2ch13/jnidemo/HelloNative.java\n```\n\n此命令创建了一个头文件\
  \ `v2ch13_jnidemo_HelloNative.h`，如列表 13.2 所示。\n\nListing 13.2 v2ch13/jnidemo/HelloNative.h\n\
  \n```\n/* DO NOT EDIT THIS FILE - it is machine generated */\n#include <jni.h>\n\
  /* Header for class v213_jnidemo_HelloNative */\n\n#ifndef _Included_v2ch13_jnidemo_HelloNative\n\
  #define _Included_v2ch13_jnidemo_HelloNative\n/*\n * Class:     v213_jnidemo_HelloNative\n\
  \ * Method:    printf\n * Signature: (Ljava/lang/String;)I\n */\nJNIEXPORT jint\
  \ JNICALL Java_v213_jnidemo_HelloNative_printf\n  (JNIEnv *, jclass, jstring);\n\
  \n#ifdef __cplusplus\nextern \"C\" {\n#endif\n#endif\n#undef _Included_v2ch13_jnidemo_HelloNative\n\
  ```\n\n如你所见，此文件包含了 `Java_v213_jnidemo_HelloNative_printf` 的声明。（`JNIEXPORT` 和 `JNICALL`\
  \ 宏在头文件中定义。它们指明了表示来自动态加载库的导出函数的限定符。）\n\n现在，将头文件中的函数原型复制到源文件中，并给出函数的实现代码，如列表 13.3\
  \ 所示。\n\n你可以使用 C++ 实现原生方法。然而，你必须将实现原生方法的函数声明为 `extern \"C\"`。（这阻止了 C++ 编译器对方法名进行“修饰”。）例如，\n\
  \n```\nextern \"C\"\nJNIEXPORT int JNICALL Java_v213_jnidemo_HelloNative_printf(JNIEnv*\
  \ env,\n    jclass cl, . . .) { . . }\n```\n\nListing 13.3 v2ch13/jnidemo/HelloNative.c\n\
  \n```c\n#include \"v2ch13_jnidemo_HelloNative.h\"\n#include <stdio.h>\n\nJNIEXPORT\
  \ jint JNICALL Java_v213_jnidemo_HelloNative_printf(\n        JNIEnv *env, jclass\
  \ cl, jstring jstr) {\n    const char *cstr = (*env)->GetStringUTFChars(env, jstr,\
  \ NULL);\n    int numchars = printf(cstr);\n    (*env)->ReleaseStringUTFChars(env,\
  \ jstr, cstr);\n    return numchars;\n}\n```\n\n我们将深入深入这段代码，但有几个亮点。\n\n每个原生函数接收一个参数\
  \ `env`，用于访问原生调用的 C API。你可以在调用 `(*env)->GetStringUTFChars(...)` 时看到示例。\n\n`cl` 参数是\
  \ Java 类的描述符。在实例方法中，你将得到得到调用原生方法的对象的描述符。\n\n\n\n\n接下来，让我们来看如何将字符串传递给原生方法。带有 `String`\
  \ 参数的原生方法会接收一个名为 `jstring` 的不透明类型的值。字符串在两种语言中非常不同：在 Java 中，字符串是 UTF-16 码点的序列，而 C\
  \ 字符串是空终止的字节序列。JNI 有两组用于操作字符串的函数：一组将 Java 字符串转换为“修改后的 UTF-8”字节序列，另一组将它们转换为 UTF-16\
  \ 值数组。（UTF-8、“修改 UTF-8”和 UTF-16 格式在第二章 中讨论过。记住，UTF-8 和“修改 UTF-8”编码保持 ASCII 字符不变，但所有其他\
  \ Unicode 字符都被编码为多字节序列。）\n\n标准 UTF-8 编码和“修改 UTF-8”编码对于代码高于 `0xFFFF` 的字符存在差异。在标准\
  \ UTF-8 编码中，这些字符被编码为 4 字节序列。在“修改”编码中，每个此类字符首先编码为 UTF-16 编码中的一对“代理”（surrogates），然后每个代理再用\
  \ UTF-8 编码，总共 6 字节。这种做法很笨拙，但这是一个历史偶然——JVM 规范编写时，Unicode 仍限于 16 位。\n\n在我们的示例中，我们调用了\
  \ `printf`，因此转换为 UTF-8。如果我们使用“宽”版本 `wprintf`，那么 UTF-16 就会合适。\n\n要读取现有 `jstring`\
  \ 对象的的内容，请使用 `GetStringUTFChars` 函数。该函数返回一个指向描述字符串的“修改 UTF-8”字符的指针。注意，特定的虚拟机可以为其内部字符串表示选择这种字符编码，因此你可能会得到指向实际\
  \ Java 字符串的字符指针。由于 Java 字符串是不可变的，因此认真对待 `const` 并不要尝试写入此字符数组非常重要。另一方面，如果虚拟机使用 UTF-16\
  \ 或 UTF-32 字符作为其内部字符串表示，此函数调用将分配一个新的内存块，并在其中填充“修改 UTF-8”等效项。\n\n虚拟机必须知道你何时结束使用字符串，以便对其进行垃圾回收。（垃圾回收器运行在单独线程中，它可以中断原生方法的执行。）因此，你必须调用\
  \ `ReleaseStringUTFChars` 函数。\n\n将原生 C 代码编译为动态加载库。细节取决于你的编译器。\n\n例如，在 Linux 上使用\
  \ GNU C 编译器，使用以下命令：\n\n```bash\ngcc -fPIC -I $JAVA_HOME/include -I $JAVA_HOME/include/linux\
  \ -shared \\\n    -o v2ch13/jnidemo/libHelloNative.so v2ch13/jnidemo/HelloNative.c\n\
  ```\n\n在 Windows 下使用 Microsoft 编译器，命令为：\n\n```bash\ncd v2ch13/jnidemo\ncl -I %JAVA_HOME%\\\
  include -I %JAVA_HOME%\\include\\win32 ^\n    -LD HelloNative.c -FeHelloNative.dll\n\
  ```\n\n最后，在你的程序中添加对 `System.loadLibrary` 方法的调用。为了确保虚拟机在第一次使用类之前加载库，请使用静态初始化块，如列表\
  \ 13.4](#index.xhtml_ch12list04）所示。\n\n图 13.1: 处理原生代码列表 13.4 v2ch13/jnidemo/HelloNativeDemo.java\n\
  \n```java\npackage v2ch13.jnidemo;\n\nclass HelloNativeDemo {  \n    void main()\
  \ {\n        int result = HelloNative.printf(\"Hello, Native World!\\n\");\n   \
  \     IO.println(\"Printed %d characters.\".formatted(result));\n    }\n\n    static\
  \ {  \n        System.loadLibrary(\"HelloNative\");\n    }\n}\n```\n\n图 13.1 提供了原生代码处理的总结。\n\
  \n当你运行此程序时，终端窗口会显示消息“Hello, Native World!”。这是来自 C 代码的结果。下一行“Printed 21 characters.”是由\
  \ Java 代码产生的。我们已经向弥越这两种语言之间的鸿沟迈出了第一步！\n\n如果你运行 Linux，你必须将当前目录添加到库路径。可以设置 `LD_LIBRARY_PATH`\
  \ 环境变量：\n\n```bash\nexport LD_LIBRARY_PATH=v2ch13/jnidemo:$LD_LIBRARY_PATH\n```\n\
  \n或者设置 `java.library.path` 系统属性：\n\n```bash\njava -Djava.library.path=v2ch13/jnidemo\
  \ v2ch13.jnidemo.HelloNativeDemo\n```\n\n总结来说，通过 JNI，你遵循以下步骤将原生方法链接到 Java 程序中：\n\
  \n1. 在 Java 类中声明原生方法。\n2. 运行 `javac -h` 以获取带有该方法 C 声明的头文件。\n3. 在 C 中实现原生方法。\n4.\
  \ 将代码放在共享库中。\n5. 在你的 Java 程序中加载该库。\n\n`java.lang.System`1.0\n\n*   `void loadLibrary(String\
  \ libname)`\n    加载给定名称的库。该库位于库搜索路径。定位库的具体方法取决于操作系统。\n\n## 13.2. 使用 FFM 调用原生函数\n\
  \n外部函数与内存 (FFM) API 提供了一种调用原生函数和访问堆外内存的现代方式。正如你所看到的，这种 API 比 JNI 更以 Java 为中心。Java\
  \ 到 C 的转换在 Java 中完成。在接下来的节中，你将看到关于链接器（linkers）、句柄（handles）、区域（arenas）和内存段（memory\
  \ segments）的细节。\n\n要编译并运行演示，使用以下命令：\n\n```bash\njavac v2ch13/ffmdemo/HelloForeign.java\n\
  java --enable-preview --native-access=ALL-NAMED v2ch13.ffmdemo.HelloForeign\n```\n\
  \n列表 13.5 v2ch13/ffmdemo/HelloForeign.java\n\n```java\npackage v2ch13.ffmdemo;\n\
  \nimport java.lang.invoke.*;\nimport java.lang.foreign.*;\n\npublic class HelloForeign\
  \ {\n    void main() throws Throwable {\n        Linker linker = Linker.nativeLinker();\n\
  \        MethodHandle printf = linker.downcallHandle(\n            linker.defaultLookup().findOrThrow(\"\
  printf\"),\n            FunctionDescriptor.of(ValueLayout.JAVA_INT, ValueLayout.ADDRESS));\n\
  \n        try (Arena arena = Arena.ofConfined()) {\n            MemorySegment str\
  \ = arena.allocateFrom(\"Hello, Foreign World!\\n\");\n            int result =\
  \ (int) printf.invoke(str);\n            System.out.printf(\"Printed %d characters.%n\"\
  , result);\n        }\n    }\n}\n```\n\n## 13.3. 区域 (Arenas)\n\n在原生函数之间交互时，程序的 Java\
  \ 部分需要处理*堆外内存*；即不是通过调用 `new` 分配的内存。\n\n*区域（arena）管理堆外内存段的生命周期。你在之前的演示程序中已经见过一个示例。\n\
  \n```java\ntry (Arena arena = Arena.ofConfined()) {\n    MemorySegment str = arena.allocateFrom(...);\n\
  \    ...\n} // 区域关闭\n```\n\n`Arena` 类实现了 `AutoCloseable`，当 `try` 块结束时，`arena` 会被关闭。之后任何分配的段都将失效。尝试访问它们将导致异常。\n\
  \n\n\n\n这里，使用了 `confined`（受限）arena。受限 arena 分配的内存段只能在 arena 的 `owner thread`（所有者线程）中使用，这通常是创建\
  \ arena 的线程。arena 也必须在该线程中关闭，否则将抛出异常。\n\n如果内存段必须被多个线程共享，则不能使用受限 arena。一种方案是使用 `shared`（共享）arena，它在你对其调用\
  \ `close` 之前一直有效。在适当的时间关闭 arena 取决于你。\n\n或者，你可以使用 `automatic`（自动）arena。当内存段及其 arena\
  \ 都不再引用时，垃圾回收器最终会释放这些内存段。这很方便，但可预测性较低。你无法关闭自动 arena。\n\n```\nMemorySegment segment\
  \ = Arena.ofAuto().allocate(. . .);\n. . .\nsegment = null; // 内存最终会被释放\n```\n\n\
  在这个示例中，自动 arena 仅使用了一次，用于分配单个段。\n\n最后，`global arena`（全局 arena）永远不会被关闭，它分配的内存段也永远不会被释放。\n\
  \n你不能单独释放某个内存段。要释放一个内存段，你需要关闭分配了它的（受限或共享）arena。\n\n表 13.1 总结了四种 arena 类型的特征。\n\n\
  表 13.1：Arena 类型\n\n| 类型 | 可从多个线程访问 | 如何关闭 |\n| --- | --- | --- |\n| Confined | |\
  \ 通过调用 `close` |\n| Shared | ✓ | 通过调用 `close` |\n| Automatic | ✓ | 通过垃圾回收器 |\n|\
  \ Global | ✓ | 永远不 |\n\n`java.lang.foreign.Arena22`\n\n* `static void ofConfined()`\n\
  * `static void ofShared()`\n* `static void ofAuto()`\n  返回一个受限、共享或自动 arena。\n\n\
  ## 13.4. 内存段 (Memory Segments)\n\n内存段是一个连续的内存块。它可能位于 Java 堆上（由垃圾回收器管理），或者可能是 `native`（本地的），分配在\
  \ Java 堆之外。堆外内存段具有固定的物理地址。堆内段与任何 Java 对象一样，通过引用可以找到定位，但没有固定地址，因为垃圾回收器可能会移动它。为了与外部函数一起使用，我们通常对堆外内存段。\n\
  \n你使用 arena 对象来分配堆外段。正如你已经看到的，调用：\n\n```\nString javaString = . . .;\nMemorySegment\
  \ cString = arena.allocateFrom(javaString);\n```\n\n会将 Java 字符串编码为 UTF-8 并分配一个包含这些字节的内存段，包括一个空终止符。\n\
  \n要分配数组，你需要指定元素布局和元素数量。你将在第 13.5 节 中看到如何使用 `MemoryLayout` 接口。目前，我们将使用 `ValueLayout`\
  \ 类中定义的布局常量。例如，这里是分配一个 `float` 值数组的方法：\n\n```\nMemorySegment audioIn = arena.allocate(ValueLayout.JAVA_FLOAT,\
  \ sampleCount);\n```\n\n如果你已经在数组中有了这些值，请使用 `allocateFrom` 方法：\n\n```\nfloat[] samples\
  \ = . . .\nMemorySegment audioOut = arena.allocateFrom(ValueLayout.JAVA_FLOAT, samples);\n\
  ```\n\n当将内存段传递给 C 函数时，该函数接收该段的地址。它就可以处理字符串或数组的内容。\n\n反之，假设一个 C 函数已向内存段填充了数据。要将空终止的\
  \ UTF-8 字符串转换为 Java 字符串，你向 `getString` 方法传递偏移量 0：\n\n```\nString javaString = cString.getString(0);\n\
  ```\n\n要在数组索引处进行读取或写入，请提供内存布局和索引：\n\n```\nfloat sample = audioIn.getAtIndex(ValueLayout.JAVA_FLOAT,\
  \ i);\naudioIn.setAtIndex(ValueLayout.JAVA_FLOAT, i, 0f);\n```\n\n你也可以获取包含所有值的 Java\
  \ 数组：\n\n```\nfloat[] samples = audioIn.toArray(ValueLayout.JAVA_FLOAT);\n```\n\n\
  `elements` 方法产生一个内存段流，每个元素对应一个。你可以将其中每一个都映射为一个值，然后进一步处理该流。\n\n```\nDoubleStream\
  \ samples = audioIn.elements(ValueLayout.JAVA_FLOAT)\n    .mapToDouble(m -> m.get(ValueLayout.JAVA_FLOAT,\
  \ 0));\n```\n\n`get` 方法类似于 `getAtIndex`，但它接收的是字节偏移量。\n\n注意，段并不保留关于其内部数据布局的任何信息。每当你访问或更新数据时，你都需要提供布局。\n\
  \n`java.lang.foreign.SegmentAllocator22`\n\n* `MemorySegment allocate(MemoryLayout\
  \ layout)`\n  分配具有给定布局的堆外内存。\n* `MemorySegment allocate(MemoryLayout elementLayout,\
  \ long count)`\n  分配一个具有 `count` 个给定布局元素的堆外数组。\n* `MemorySegment allocateFrom(ValueLayout.of`Xxx`\
  \ elementLayout, xxx, elements)`\n  分配包含给定原始类型元素的堆外内存。\n* `MemorySegment allocateFrom(String\
  \ str)`\n  分配包含 `str` 的 UTF-8 编码的空终止字符串的堆外内存。\n* `MemorySegment allocate(long byteSize,\
  \ long byteAlignment)`\n  分配具有给定大小和对齐约束的堆外内存段。\n* `Stream<MemorySegment> elements(MemoryLayout\
  \ elementLayout)`\n  产生一个顺序切片流，从该内存段中提取。\n\n`java.lang.foreign.Segment22`\n\n* `String\
  \ getString(long offset)`\n  将给定偏移处的空终止 UTF-8 字符串转换为 Java 字符串。\n* `xxx getAtIndex(ValueLayout.of`Xxx`\
  \ layout, long index)`\n* `void setAtIndex(ValueLayout.of`Xxx` layout, long index,\
  \ xxx, value)`\n  在给数组索引处写入原始类型值。\n* `xxx get(ValueLayout.of`Xxx` layout, long offset)`\n\
  * `void set(ValueLayout.of`Xxx` layout, long offset, xxx, value)`\n  在给定偏移处读取或写入原始类型值。\n\
  * `xxx[] toArray(ValueLayout.elementLayout)`\n  将该内存段的内容复制到原始类型数组。\n\n## 13.5. 内存布局\
  \ (Memory Layout)\n\n在前节中，你已经学习了如何处理持有 UTF-8 字符串和原始值的内存段。\n\n在 C 中，你使用 `struct`\
  \ 处理更复杂的数据。例如，处理音频文件的 `libsndfile` 库（[`github.com/libsndfile`](https://github.com/libsndfile））产生如下结构的值：\n\
  \n```\nstruct SF_INFO {\n    long frames;\n    int samplerate;\n    int channels;\n\
  \    int format;\n    int sections;\n    int seekable;\n}\n```\n\n你可以按照如下方式为该结构定义布局：\n\
  \n```\nimport static java.lang.foreign.ValueLayout.*;\n. . .\nStructLayout SF_INFO\
  \ = MemoryLayout.structLayout(\n    JAVA_LONG.withName(\"frames\"),\n    JAVA_INT.withName(\"\
  samplerate\"),\n    JAVA_INT.withName(\"channels\"),\n    JAVA_INT.withName(\"format\"\
  ),\n    JAVA_INT.withName(\"sections\"),\n    JAVA_INT.withName(\"seekable\")\n\
  );\n```\n\n匹配 C 和 Java 类型时，字节长度需要匹配。但无符号 C 类型被映射为对应的尺寸 Java 类型。如果你在 Java 中处理这些值，你需要自己处理无符号值。\n\
  \n`Linker.nativeLinker().canonicalLayouts()` 返回一个常见类型名称到内存布局的映射。例如，在 64 位平台上，\"\
  size_t\" 被映射为字节大小 8 的 `MemoryLayout`，因此你知道使用 `JAVA_LONG` 在 Java 中表示 C 类型 `size_t`。\n\
  \n映射的类型包括：`bool`、`char`、`short`、`int`、`long`、`long long`、`float`、`double`、`size_t`、`wchar_t`、`void*`。\n\
  \n假设你有一个刚刚声明的具有 `SF_INFO` 布局的内存段 `info`。以下是获取其组件之一的方法：\n\n```\nint channels = info.get(JAVA_INT,\n\
  \    SF_INFO.byteOffset(PathElement.groupElement(\"channels\")));\n```\n\n\n\n\n\
  \n你已经看到了了 `get` 方法，它接收一个内存布局和一个字节偏移量。`StructLayout` 可以确定每个元素的偏移量。在这种情况下，偏移量为 12，因为\
  \ `\"channels\"` 元素之前有两个大小为 8 和 4 的元素。\n\n为了处理嵌套结构，有许多接口来描述布局——参见图 13.2。\n\n`ValueLayout`\
  \ 接口有子类型 `ValueLayout.OfInt`、`ValueLayout.ofLong` 等，每种原始类型对应一个。`ValueLayout` 接口中的常量\
  \ `JAVA_INT`、`JAVA_LONG` 等是这些类型的实例。`AddressLayout` 持有一个内存地址。\n\n.图 13.2: 内存布局层级结构\n\
  \n正如你所看到的，`StructLayout` 描述了 C 结构的布局。同样，`UnionLayout` 描述了 C 联合体（union）。这并不常见，但如果你需要处理联合体，使用\
  \ `UnionLayout` 接口不会有任何问题。它与 `StructLayout` 完全对应。\n\n`PaddingLayout` 描述填充字节。你有时需要插入它们以确保后续元素能够正确对齐。\n\
  \n让我们使用 `SequenceLayout` 来建模结构体数组：\n\n```\nlong count = . . .;\nSequenceLayout arrayOfPointLayout\
  \ = MemoryLayout.sequenceLayout(count,\n    MemoryLayout.structLayout(\n       \
  \ JAVA_FLOAT.withName(\"x\"),\n        JAVA_FLOAT.withName(\"y\")));\n```\n\n要访问索引为\
  \ i 的点的单个 x 组件或 y 组件，我们需要计算字节偏移量：\n\n```\nlong offset = arrayOfPointLayout.byteOffset(\n\
  \    PathElement.sequenceElement(i), PathElement.groupElement(\"y\"));\n```\n\n\
  `byteOffset` 方法接收一系列 `MemoryLayout.PathElement` 对象，用于导航到所选的值。\n\n现在，给定一个具有该布局的内存段，我们可以获取或设置值：\n\
  \n```\nMemorySegment arrayOfPoints = Arena.global().allocate(arrayOfPointLayout);\n\
  arrayOfPoints.set(JAVA_FLOAT, offset, yvalue);\n```\n\n关于内存布局和在内存段中访问值还有更多内容，但你现在看到的已经足够在\
  \ Java 和外部函数之间传递复杂数据了。我们将在下一节中讨论。更多信息请参见第 13.8.1 节。\n\n### java.lang.foreign.MemoryLayout22\n\
  \n* `static StructLayout structLayout(MemoryLayout... elements)`\n* `static UnionLayout\
  \ unionLayout(MemoryLayout... elements)`\n  根据给定的元素创建 `struct` 或 `union` 的布局。\n\
  * `static SequenceLayout sequenceLayout(long elementCount, MemoryLayout elementLayout)`\n\
  \  创建一个给定长度的数组布局，其元素具有给定的布局。\n* `static PaddingLayout unionLayout(long byteSize)`\n\
  \  创建一个具有给定字节数填充的布局。\n* `long byteOffset(MemoryLayout.PathElement... elements)`\n\
  \  产生此布局中由给定路径指定的第一个值的偏移量。\n\n### java.lang.foreign.MemoryLayout.PathElement22\n\
  \n* `static MemoryLayout.PathElement groupElement(String name)`\n  返回指向组布局中具有给定名称的元素的路径。\n\
  * `static MemoryLayout.PathElement sequenceElement(long index)`\n  返回指向序列布局中具有给定索引元素的路径。\n\
  \n### java.lang.foreign.ValueLayout22\n\n* `ValueLayout withName(String name)`\n\
  \  返回具有给定名称的此布局副本。\n\n## 13.6. 查找和调用外部函数\n\n在编译 C 代码时，*链接器*（linker）执行将编译后的文件与库函数的预编译代码相结合的关键步骤，生成一个可执行文件。\n\
  \nFFM API 中的 `Linker` 抽象并没有完全执行相同的操作。它查找库函数并准备 `MethodHandle` 对象以调用它们。\n\n实际上，“查找”部分被委托给\
  \ `SymbolLookup` 实例。若要在几个标准库中查找函数，请使用默认查找：\n\n```\nLinker linker = Linker.nativeLinker();\
  \ // 针对底层平台的链接器\nSymbolLookup stdlib = linker.defaultLookup();\n```\n\n默认查找所知道的库取决于平台。在\
  \ Linux 上，它们包括 `libc` 和 `libm`。这种查找对于 `printf` 和 `malloc` 等已知函数就足够了。\n\n若要与特定库配合，请按照如下方式创建查找：\n\
  \n```\nSymbolLookup sndfile = SymbolLookup.libraryLookup(\n    \"/lib/x86_64-linux-gnu/libsndfile.so\"\
  , arena);\n```\n\n你指定库文件的路径（字符串或 `Path` 对象）和一个 arena。`libraryLookup` 方法加载库。当 arena\
  \ 关闭时，库会被卸载。\n\n还有一个*加载器查找*（loader lookup），由 `SymbolLookup.loaderLookup()` 返回，它查找通过调用\
  \ `System.load` 和 `System.loadLibrary` 加载的库中的函数。\n\n现在你可以查找函数了：\n\n```\nMemorySegment\
  \ mallocAddr = stdlib.findOrThrow(\"malloc\");\nMemorySegment sfOpenAddr = sndfile.findOrThrow(\"\
  sf_open\");\n```\n\n如果未找到函数，`findOrThrow` 方法将抛出 `NoSuchElementException`。还有一个返回\
