  \ px);\n            yoff = 0;\n        }\n        else // 垂直居中\n        {\n    \
  \        scale = sx / px;\n            xoff = 0;\n            yoff = 0.5 * (sy -\
  \ scale * py);\n        }\n        g2.translate((float) xoff, (float) yoff);\n \
  \       g2.scale((float) scale, (float) scale);\n\n        // 绘制页面轮廓（忽略边距）\n   \
  \     var page = new Rectangle2D.Double(0, 0, px, py);\n        g2.setPaint(Color.white);\n\
  \        g2.fill(page);\n        g2.setPaint(Color.black);\n        g2.draw(page);\n\
  \n        Printable printable = book.getPrintable(currentPage);\n        try {\n\
  \            printable.print(g2, pageFormat, currentPage);\n        }\n        catch\
  \ (PrinterException e) {\n            g2.draw(new Line2D.Double(0, 0, px, py));\n\
  \            g2.draw(new Line2D.Double(px, 0, 0, py));\n        }\n    }\n\n   \
  \ /**\n     * 按指定的页数翻页书。\n     * @param by 翻页的页数。负值向后翻页。\n     */\n    public void\
  \ flipPage(int by) {\n        int newPage = currentPage + by;\n        if (0 <=\
  \ newPage && newPage < book.getNumberOfPages()) {\n            currentPage = newPage;\n\
  \            repaint();\n        }\n    }\n}\n```\n\n\n\n\n\n*   实现了 `Printable`、`Pageable`\
  \ 或 `RenderableImage` 的类对象\n\n数据本身可以存储在字节或字符源中，例如输入流、URL 或数组。`document flavor`（文档口味/类型）描述了数据源和数据类型的组合。`DocFlavor`\
  \ 类为各种数据源定义了若干个内部类。每个内部类都定义了常量来指定特定的口味。例如，常量\n\n``````\nDocFlavor.INPUT_STREAM.GIF\n\
  ```\n\n描述了从输入流中读取的 GIF 图像。表 12.4 列出了这些组合。\n\n表 12.4：打印服务的文档口味（DocFlavor）\n\n| 数据源\
  \ | 数据类型 | MIME 类型 |\n| --- | --- | --- |\n| `INPUT_STREAM` | `GIF` | `image/gif`\
  \ |\n| `URL` | `JPEG` | `image/jpeg` |\n| `BYTE_ARRAY` | `PNG` | `image/png` |\n\
  | | `POSTSCRIPT` | `application/postscript` |\n| | `PDF` | `application/pdf` |\n\
  | | `TEXT_HTML_HOST` | `text/html` (使用主机编码) |\n| | `TEXT_HTML_US_ASCII` | `text/html;\
  \ charset=us-ascii` |\n| | `TEXT_HTML_UTF_8` | `text/html; charset=utf-8` |\n| |\
  \ `TEXT_HTML_UTF_16` | `text/html; charset=utf-16` |\n| | `TEXT_HTML_UTF_16LE` |\
  \ `text/html; charset=utf-16le` (小端) |\n| | `TEXT_HTML_UTF_16BE` | `text/html; charset=utf-16be`\
  \ (大端) |\n| | `TEXT_PLAIN_HOST` | `text/plain` (使用主机编码) |\n| | `TEXT_PLAIN_US_ASCII`\
  \ | `text/plain; charset=us-ascii` |\n| | `TEXT_PLAIN_UTF_8` | `text/plain; charset=utf-8`\
  \ |\n| | `TEXT_PLAIN_UTF_16` | `text/plain; charset=utf-16` |\n| | `TEXT_PLAIN_UTF_16LE`\
  \ | `text/plain; charset=utf-16le` (小端) |\n| | `TEXT_PLAIN_UTF_16BE` | `text/plain;\
  \ charset=utf-16be` (大端) |\n| | `PCL` | `application/vnd.hp-PCL` (惠尔惠 打印机控制语言) |\n\
  | | `AUTOSENSE` | `application/octet-stream` (原始打印机数据) |\n| `READER` | `TEXT_HTML`\
  \ | `text/html; charset=utf-16` |\n| `STRING` | `TEXT_PLAIN` | `text/plain; charset=utf-16`\
  \ |\n| `CHAR_ARRAY` | | |\n| `SERVICE_FORMATTED` | `PRINTABLE` | N/A |\n| | `PAGEABLE`\
  \ | N/A |\n| | `RENDERABLE_IMAGE` | N/A |\n\n假设你想打印位于文件中的 GIF 图像。首先，查找是否存在能够处理该任务的\
  \ `print service`（打印服务）。`PrintServiceLookup` 类的静态方法 `lookupPrintServices` 返回一个可以处理给定文档口味的\
  \ `PrintService` 对象数组。\n\n```java\nDocFlavor flavor = DocFlavor.INPUT_STREAM.GIF;\n\
  PrintService[] services = PrintServiceLookup.lookupPrintServices(flavor, null);\n\
  ```\n\n`lookupPrintServices` 方法的第二个参数是 `null`，表示我们不想通过指定打印机属性来限制搜索。我们将在下一节中介绍属性。\n\
  \n如果查找结果的数组包含多个元素，请从列出的打印服务中进行选择。你可以调用 `PrintService` 类的 `getName` 方法来获取打印机名称并让用户选择。\n\
  \n接下来，从服务获取一个文档打印作业：\n\n```java\nDocPrintJob job = services[i].createPrintJob();\n\
  ```\n\n为了打印，你需要一个实现了 `Doc` 接口的对象。Java 库提供了一个 `SimpleDoc` 类来实现此目的。`SimpleDoc` 的构造函数需要数据源对象、文档口味以及可选的属性集。例如，\n\
  \n```java\nvar in = new FileInputStream(fileName);\nvar doc = new SimpleDoc(in,\
  \ flavor, null);\n```\n\n最后，你就可以准备好打印了：\n\n```java\njob.print(doc, null);\n```\n\
  \n如之前所示，`null` 参数可以替换为属性集。\n\n注意，此打印过程与前面的节非常不同。它没有通过打印对话框进行用户交互。例如，你可以实现一种服务器端打印机制，用户通过\
  \ Web 表单提交打印作业。\n\n`javax.print.PrintServiceLookup`1.4\n\n*   `PrintService[] lookupPrintServices(DocFlavor\
  \ flavor, AttributeSet attributes)`\n    查找处理给定文档口味和属性的打印服务。如果没有需要考虑的属性，`attributes`\
  \ 参数可以为 `null`。\n\n`javax.print.PrintService`1.4\n\n*   `DocPrintJob createPrintJob()`\n\
  \    为打印实现了 `Doc` 接口的类（如 `SimpleDoc`）的对象创建一个打印作业。\n\n`javax.print.DocPrintJob`1.4\n\
  \n*   `void print(Doc doc, AttributeSet attributes)`\n    使用给定的属性打印文档。如果不需要属性，`attributes`\
  \ 参数可以为 `null`。\n\n`javax.print.SimpleDoc`1.4\n\n*   `SimpleDoc(Object data, DocFlavor\
  \ flavor, AttributeSet attributes)`\n    构造一个 `SimpleDoc` 对象。`data` 参数是可以打印的对象，例如\
  \ `Printable`。`flavor` 参数是文档口味。`attributes` 参数在不需要属性时可以为 `null`。\n\n### 12.7.4 流打印服务（Stream\
  \ Services）\n\n流打印服务将打印数据发送到流。流打印服务生成相同的打印数据，但将其发送到流，以便进行延迟打印或者因为打印数据格式可以被其他程序解释。特别是，如果打印数据格式是\
  \ PostScript，可能有助于将打印数据保存到文件。枚举流服务比定位普通打印服务稍微麻烦一点。你需要要打印对象的 `DocFlavor` 以及流输出的 MIME\
  \ 类型。然后你获得 `StreamPrintFactory` 数组。\n\n```java\nDocFlavor flavor = DocFlavor.SERVICE_FORMATTED.PRINTABLE;\n\
  String mimeType = \"application/postscript\";\nStreamPrintFactory[] factories =\
  \ StreamPrintFactory.lookupStreamServiceFactories(flavor, mimeType);\n```\n\n`StreamPrintFactory`\
  \ 类没有区分不同工厂的方法，因此我们直接使用 `factories[0]`。我们使用输出流参数调用 `getPrintService` 方法来获取 `StreamPrintService`\
  \ 对象。\n\n```java\nvar out = new FileOutputStream(fileName);\nStreamPrintService\
  \ service = factories[0].getPrintService(out);\n```\n\n`StreamPrintService` 类是 `PrintService`\
  \ 的子类。要产生输出，只需按照上一节的步骤操作。\n\n`javax.print.StreamPrintFactory`1.4\n\n*   `StreamPrintFactory[]\
  \ lookupStreamServiceFactories(DocFlavor flavor, String mimeType)`\n    查找处理给定文档口味并产生给定\
  \ MIME 类型输出流的流打印服务工厂。\n\n*   `StreamPrintService getPrintService(OutputStream out)`\n\
  \    获取将打印输出发送到给定输出流的打印服务。\n\n\n\n\n\n```java\npackage v2ch12.printService;\n\n\
  import module java.base;\nimport module java.desktop;\n\n/**\n * 此程序演示了流打印服务的用法。该程序将\
  \ Java 2D\n * 形状打印到 PostScript 文件。如果你没有在命令行中提供文件名，输出\n * 将被保存到 out.ps。\n */\nclass\
  \ PrintServiceDemo {\n    //在此处设置你的图像尺寸\n    int IMAGE_WIDTH = 300;\n    int IMAGE_HEIGHT\
  \ = 300;\n\n    void main(String[] args) throws Exception {\n        String fileName\
  \ = args.length > 0 ? args[0] : \"out.ps\";\n        DocFlavor flavor = DocFlavor.SERVICE_FORMATTED.PRINTABLE;\n\
  \        String mimeType = \"application/postscript\";\n        StreamPrintServiceFactory[]\
  \ factories = StreamPrintServiceFactory\n                .lookupStreamPrintServiceFactories(flavor,\
  \ mimeType);\n        var out = new FileOutputStream(fileName);\n        if (factories.length\
  \ > 0) {\n            PrintService service = factories[0].getPrintService(out);\n\
  \            var doc = new SimpleDoc(new Printable() {\n                public int\
  \ print(Graphics g, PageFormat pf, int page) {\n                    if (page >=\
  \ 1)\n                        return Printable.NO_SUCH_PAGE;\n                 \
  \   else {\n                        double sf1 = pf.getImageableWidth() / (IMAGE_WIDTH\
  \ + 1);\n                        double sf2 = pf.getImageableHeight() / (IMAGE_HEIGHT\
  \ + 1);\n                        double s = Math.min(sf1, sf2);\n              \
  \          var g2 = (Graphics2D) g;\n                        g2.translate((pf.getWidth()\
  \ - pf.getImageableWidth()) / 2,\n                                (pf.getHeight()\
  \ - pf.getImageableHeight()) / 2);\n                        g2.scale(s, s);\n\n\
  \                        draw(g2);\n                        return Printable.PAGE_EXISTS;\n\
  \                    }\n                }\n            }, flavor, null);\n     \
  \       DocPrintJob job = service.createPrintJob();\n            var attributes\
  \ = new HashPrintRequestAttributeSet();\n            job.print(doc, attributes);\n\
  \        }\n        else\n            IO.println(\"No factories for \" + mimeType);\n\
  \    }\n    void draw(Graphics2D g2) {\n        //你的绘图指令在这里\n        FontRenderContext\
  \ context = g2.getFontRenderContext();\n        var f = new Font(\"Serif\", Font.PLAIN,\
  \ 72);\n        var clipShape = new GeneralPath();\n\n        var layout = new TextLayout(\"\
  Hello\", f, context);\n        AffineTransform transform = AffineTransform.getTranslateInstance(0,\
  \ 72);\n        Shape outline = layout.getOutline(transform);\n        clipShape.append(outline,\
  \ false);\n\n        layout = new TextLayout(\"World\", f, context);\n        transform\
  \ = AffineTransform.getTranslateInstance(0, 144);\n        outline = layout.getOutline(transform);\n\
  \        clipShape.append(outline, false);\n\n        g2.draw(clipShape);\n    \
  \    g2.clip(clipShape);\n\n        final int NLINES = 50;\n        var p = new\
  \ Point2D.Double(0, 0);\n        for (int i = 0; i < NLINES; i++) {\n          \
  \  double x = (2 * IMAGE_WIDTH * i) / NLINES;\n            double y = (2 * IMAGE_HEIGHT\
  \ * (NLINES - 1 - i)) / NLINES;\n            var q = new Point2D.Double(x, y);\n\
  \            g2.draw(new Line2D.Double(p, q));\n        }\n    }\n}\n```\n\n###\
  \ 12.7.5. 打印属性\n\n打印服务 API 包含了一组复杂的接口和类，用于指定各种类型的属性。属性分为四类重要的组。前两类指定对打印机的请求。\n\n\
  *   `打印请求属性（Print request attributes）为打印作业中的所有 `doc` 对象请求特定功能，例如双面打印或纸张尺寸。\n*  \
  \ `文档属性（Doc attributes）是仅适用于单个 `doc` 对象的请求属性。\n\n另外两类属性包含关于打印机和作业状态的信息。\n\n*   `打印服务属性（Print\
  \ service attributes）提供有关打印服务的信息，例如打印机的品牌和型号或打印机当前是否接受作业。\n*   `打印作业属性（Print job\
  \ attributes）提供有关特定打印作业状态的信息，例如该作业是否已经完成。\n\n为了描述各种属性，有一个 `Attribute` 接口，它包含以下子接口：\n\
  \n```\nPrintRequestAttribute\nDocAttribute\nPrintServiceAttribute\nPrintJobAttribute\n\
  SupportedValuesAttribute\n```\n\n单个属性类实现了这些接口中的一个或多个。例如，`Copies`类的对象描述打印输出的副本数量。该类同时实现了\
  \ `PrintRequestAttribute` 和 `PrintJobAttribute` 接口。显然，打印请求可以包含对多份副本的请求。相反，打印作业的属性可能是这些副本中实际上打印了多少份。这个数字可能较小，也许因为打印机的限制，或者因为打印机缺纸。\n\
  \n`SupportedValuesAttribute` 接口表示属性值并不反映实际的请求或状态数据，而是反映服务的能力。例如，`CopiesSupported`\
  \ 类实现了 `SupportedValuesAttribute` 接口。该类的对象可能会描述打印机支持 1 到 99 份打印输出。\n\n图 12.65\n\n\
  \n\n\n最后，许多属性可以取有限数量的值。例如，`PrintQuality` 属性有三个设置：`draft`、`normal` 和 `high`。它们由三个常量表示：\n\
  \n```\nPrintQuality.DRAFT\nPrintQuality.NORMAL\nPrintQuality.HIGH\n```\n\n具有有限数量值的属性类扩展了\
  \ `EnumSyntax` 类，该类提供了许多便利方法，用于以类型安全的方式设置这些枚举。在使用此类属性时，你无需担心其内部机制。只需将命名值添加到属性集中即可：\n\
  \n```\nattributes.add(PrintQuality.HIGH);\n```\n\n以下是检查属性值的方法：\n\n```\nif (attributes.get(PrintQuality.class)\
  \ == PrintQuality.HIGH)\n    . . .\n```\n\n表 12.5 列出了打印属性。第二列列出了该属性类的父类（例如，`Copies`\
  \ 属性对应 `IntegerSyntax`）或具有有限值集属性的枚举值集合。最后四列表示该属性类是否实现了 `DocAttribute` (D)、`PrintJobAttribute`\
  \ (J)、`PrintRequestAttribute` (R) 和 `PrintServiceAttribute` (S) 接口。\n\n表 12.5：打印属性\n\
