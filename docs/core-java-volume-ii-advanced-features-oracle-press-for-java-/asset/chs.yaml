  \ `Printable` 节的 `print` 方法时，它传递的是 `book` 的当前页码，而不是每个 `section`（章节）的当前页码。这非常棘手——因为每个\
  \ `section` 必须知道之前章节的页数，页码参数才有意义。\n\n### 程序员在使用 `Book` 类时面临的挑战\n\n从程序员的角度来看，使用 `Book`\
  \ 类最大的挑战在于，你必须在打印时知道每个章节会有多少页。你的 `Printable` 类需要一个`layout algorithm`（布局算法）来计算打印页上的布局。在开始打印之前，调用该算法来计算分页符和总页数。你可以保留布局信息，以便在打印过程中方便地使用。\n\
  \n你必须防范用户更改了页面格式的可能性。如果发生这种情况，即使要打印的内容没有变化，你也必须重新计算布局。\n\n### 生成多页打印输出\n\n代码列表 12.26\
  \ 显示了如何生成多页打印输出。该程序在若干页上用非常大的字符打印一条消息（参见图 12.63）。然后你可以修剪边距并将页面胶在一起形成一个横幅。\n\n图 12.63：一个横幅\n\
  \n`Banner` 类的 `layoutPages` 方法负责布局。我们首先使用 72 点字体布局消息字符串。然后我们计算结果字符串的高度，并将其与页面的可打印高度进行比较。我们从这两个测量值推导出一个比例因子。在打印字符串时，我们按该比例因子进行放大。\n\
  \n为了精确布局信息，你通常需要访问打印机图形上下文。遗憾的是，在打印实际开始之前，没有办法获取该图形上下文。在我们的示例程序中，我们使用屏幕图形上下文，并希望屏幕和打印机的字体度是匹配的。\n\
  \n`Banner` 类的 `getPageCount` 方法首先调用布局方法。然后它放大字符串的宽度，并将其除以每页的可打印宽度。商数向上取整到下一个整数即为页数。\n\
  \n### 使用 Java 2D 变换\n\n听起来打印横幅可能很困难，因为字符可能会跨越多个页面。然而，得益于 Java 2D API 的强大，这完全不是问题。当请求特定页面时，我们只需使用\
  \ `Graphics2D` 类的 `translate` 方法将字符串的左上角左移。然后，设置一个等于当前页的裁剪矩形（参见图 12.64）。最后，使用布局方法计算出的比例因子对图形上下文进行缩放。\n\
  \n图 12.64：打印横幅\n\n此示例展示了变换的力量。绘制代码保持简单，变换完成了将绘制置于相应位置的所有工作。最后，裁剪会切掉页面外的图像部分。该程序展示了变换的另一个引用途——显示打印预览。\n\
  \n代码列表 12.25 v2ch12/book/BookDemoFrame.java\n\n```java\npackage v2ch12.book;\n\n\
  import module java.desktop;\n\n/**\n * 此框架包含一个用于横幅文本的文本字段以及用于打印、页面设置和\n * 打印预览的按钮。\n\
  \ */\npublic class BookDemoFrame extends JFrame {\n    private JTextField text;\n\
  \    private PageFormat pageFormat;\n    private PrintRequestAttributeSet attributes;\n\
  \n    public BookDemoFrame() {\n        text = new JTextField();\n        add(text,\
  \ BorderLayout.NORTH);\n\n        attributes = new HashPrintRequestAttributeSet();\n\
