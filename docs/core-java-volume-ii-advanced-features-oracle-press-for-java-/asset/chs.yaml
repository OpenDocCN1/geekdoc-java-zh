  \ 的指定索引的孩子发生了变化。\n\n* `void reload()`\n    重新加载所有节点。只有当节点由于外部影响发生变化时才应使用此操作。\n\n\
  ### 12.4.3 节点枚举\n\n有时你需要从根开始访问所有孩子来在树中查找节点。`DefaultMutableTreeNode` 类提供了遍历节点的便利方法。\n\
  \n`breadthFirstEnumeration` 和 `depthFirstEnumeration` 方法返回枚举对象，其 `nextElement` 方法使用广度优先或深度优先遍历访问当前节点。图\
  \ 12.27(index.xhtml_ch06fig31) 显示示例树的遍历——节点标签表示遍历顺序。\n\n图 12.27：树遍历顺序\n\n广度优先枚举最容易可视化。树按层遍历。首先访问根，然后是所有的孩子，然后是孙子。\n\
  \n可视化深度优先枚举，想象一只困在树形迷宫中的老鼠。它沿着第一条路径冲直到遇到叶子。然后，它返回并转向另一条路径，以此此类推。\n\n计算机科学家也称后序遍历，因为搜索过程在访问父节点之前访问了孩子。`postOrderEnumeration`\
  \ 方法是 `depthFirstEnumeration` 的别名。为了完整性，还有一个 `preOrderEnumeration`，这是一种在访问父节点之前访问孩子的深度搜索。\n\
  \n以下是典型的用法模式：\n\n（参见原文代码块）\n\n最后，一个相关方法 `pathFromAncestorEnumeration` 找到从祖先到给定节点的路径，并枚举该路径上的节点。这并不困难——它只是一直调用\
  \ `getParent` 直到找到祖先，然后反向呈现。\n\n在我们的下一个示例程序中，我们将节点枚举付诸实践。该程序显示类的继承树。在框架底部的文本框输入类的名称。该类及其所有的父类都被添加到树中（参见图\
  \ 12.28(index.xhtml_ch06fig32)）。\n\n![Figure](img/fig06-32.jpg)图 12.28：一个继承树\n\n\
  \n\n\n在这个示例中，我们利用了树节点的用户对象（user objects）可以是任意类型这一事实。由于我们的节点描述的是类，因此我们在节点中存储了 `Class`\
  \ 对象。\n\n我们不希望重复添加同一个类对象，因此需要检查树中是否已经存在该类。以下方法可以在树中查找具有给定用户对象的节点（如果存在则返回）：\n\n```java\n\
  public DefaultMutableTreeNode findUserObject(Object obj) {\n    Enumeration e =\
  \ root.breadthFirstEnumeration();\n    while (e.hasMoreElements()) {\n        DefaultMutableTreeNode\
  \ node = (DefaultMutableTreeNode) e.nextElement();\n        if (node.getUserObject().equals(obj))\n\
  \            return node;\n    }\n    return null;\n}\n```\n\n### 12.4.4. 渲染节点\n\
  \n在你的应用程序中，你经常需要更改树组件绘制节点的方式。最常见的更改是为节点和叶子节点选择不同的图标。其他更改可能涉及更改节点标签的字体或在节点处绘制图像。所有这些更改都可以向树中安装新的树单元渲染器（tree\
  \ cell renderer）来实现。默认情况下，`JTree` 类使用 `DefaultTreeCellRenderer` 对象来绘制每个节点。`DefaultTreeCellRenderer`\
  \ 类继承自 `JLabel` 类。该标签包含了节点图标和节点标签。\n\n单元渲染器并不绘制用于展开和折叠子树的“句柄”。句柄是外观外观（look-and-feel）的一部分，建议不要更改它们。\n\
  \n你可以通过三种方式自定义显示内容：\n\n*   你可以更改 `DefaultTreeCellRenderer` 使用的图标、字体和背景颜色。这些设置适用于树中的所有节点。\n\
  *   你可以安装扩展 `DefaultTreeCellRenderer` 类的渲染器，并为每个节点设置不同的图标、字体和背景颜色。\n*   你可以安装实现\
  \ `TreeCellRenderer` 接口的渲染器，为每个节点绘制自定义图像。\n\n让我们逐一查看这些可能性。最简单的自定义是构造一个 `DefaultTreeCellRenderer`\
  \ 对象，更改图标并将其安装到树中：\n\n```java\nvar renderer = new DefaultTreeCellRenderer();\nrenderer.setLeafIcon(new\
  \ ImageIcon(\"blue-ball.gif\")); // 用于叶子节点\nrenderer.setClosedIcon(new ImageIcon(\"\
  red-ball.gif\")); // 用于折叠节点\nrenderer.setOpenIcon(new ImageIcon(\"yellow-ball.gif\"\
  )); // 用于展开节点\ntree.setCellRenderer(renderer);\n```\n\n你可以在图 12.28 中看到效果。我们只是使用“球”图标作为占位符——假设你的用户界面设计师会提供适用于应用程序的适当图标。\n\
  \n我们不建议你更改整棵树的字体或背景颜色——那实际上是外观外观的工作。\n\n然而，更改树中某些节点的字体以突出显示它们可能是很有用的。如果你仔细观察图 12.28，你会发现抽象类被设置为了*斜体*。\n\
  \n要更改单个节点的显示，请安装树单元渲染器。树单元渲染器与我们之前讨论的渲染器类似。`TreeCellRenderer` 接口有一个方法：\n\n```java\n\
  Component getCellRenderer(JTree tree, Object value, boolean selected, boolean expanded,\
  \ int row, boolean hasFocus);\n```\n\n`DefaultTreeCellRenderer` 类继承自 `JLabel`。要自定义它，如下所示扩展\
  \ `DefaultTreeCellRenderer`：\n\n```java\nclass MyTreeCellRenderer extends DefaultTreeCellRenderer\
  \ {\n    public Component getCellRenderer(JTree tree, Object value, boolean selected,\
  \ boolean expanded, int row, boolean hasFocus) {\n        DefaultMutableTreeNode\
  \ node = (DefaultMutableTreeNode) value;\n        Component comp = super.getCellRenderer(tree,\
  \ value, selected, expanded, row);\n        Font font = node.getUserObject() as\
  \ Font;\n        comp.setFont(font);\n        return comp;\n    }\n}\n```\n\n###\
  \ 12.4.5. 监听树事件\n\n通常情况下，树组件会与其他组件配对。当用户选择树节点时，某些信息会在另一个窗口中显示。示例参见图 12.29。当用户选择一个类时，该类的实例和静态变量将显示在右侧的文本区域。\n\
  \n要实现这种行为，你需要安装一个树选择监听器。监听器必须实现 `TreeSelectionListener` 接口——该接口有一个方法：\n\n```java\n\
  void valueChanged(TreeSelectionEvent event)\n```\n\n每当用户选择或取消选择树节点时，该方法就会被调用。\n\n\
  以正常方式将监听器添加到树中：\n\n```java\ntree.addTreeSelectionListener(listener);\n```\n\n\n\n\
  你可以指定允许用户选择单个节点、连续的节点范围或一组任意的可能不连续的节点集合。`JTree` 类使用 `TreeSelectionModel` 来管理节点选择。你需要获取该模型，并将选择状态设置为\
  \ `SINGLE_TREE_SELECTION`、`CONTIGUOUS_TREE_SELECTION` 或 `DISCONTIGUOUS_TREE_SELECTION`\
  \ 之一。（不连续选择模式是默认模式。）例如，在我们的类浏览器中，我们只允许选择单个类：\n\n```\nint mode = TreeSelectionModel.SINGLE_TREE_SELECTION;\n\
  tree.getSelectionModel().setSelectionMode(mode);\n```\n\n除了设置选择模式外，你不需要担心树的选择模型。\n\
  \n用户如何选择多个项目取决于外观（look-and-feel）。在 Metal 外观中，按住 `Ctrl` 键并点击某项，可以将其添加到选择中，或者如果该项已选中则将其移除。按住\
  \ `Shift` 键并点击某项，可以选择一个范围内的项目，范围从上一个选中的项目扩展到新项目。\n\n要查找当前选择的内容，请使用 `getSelectionPaths`\
  \ 方法查询树：\n\n```\nTreePath[] selectedPaths = tree.getSelectionPaths();\n```\n\n如果你将用户限制为单项选择，可以使用方便方法\
  \ `getSelectionPath`，它返回第一个选中的路径，或者在没有选择路径时返回 `null`。\n\n`TreeSelectionEvent` 类有一个\
  \ `getPaths` 方法，返回一个 `TreePath` 对象数组，但该数组描述的是选择的变化，而不是当前的选择。\n\nListing 12.10 显示了类树程序的框架类。程序显示继承层次结构并自定义了显示，用*斜体*显示抽象类。（单元格渲染器请参阅\
  \ Listing 12.11）。你可以在框架底部的文本框中输入任何类的名称。按 Enter 键或点击 Add 按钮将该类及其超类类添加到树中。你必须输入完整的包名，例如\
  \ `java.util.ArrayList`。\n\n这个程序有点复杂，因为它使用反射来构建类树。这项工作是在 `addClass` 方法内部完成的。（细节并不重要。我们在这个示例中使用类树是因为继承关系可以提供大量的树，而无需费力编码。当你你的应用程序中显示树时，你将会有自己的层次结构数据源。）该方法使用广度优先搜索算法通过调用我们在上一节中实现的\
  \ `findUserObject` 方法来查找当前类是否已经在树中。如果该类不在树中，我们将超类添加到树中，然后将新类节点设置为子节点并使该节点可见。\n\n\
  当你选择一个树节点时，右侧的文本区域将填充所选类的字段。在框架的构造函数中，我们将用户限制为单项选择并添加了一个树选择监听器。当 `valueChanged`\
  \ 方法被调用时，我们忽略它的事件参数，只需向树请求当前的选择路径。像既往一样，我们需要获取路径的最后一个节点并查找其用户对象。然后我们调用 `getFieldDescription`\
  \ 方法，该方法使用反射来组合包含所选类所有字段的字符串。\n\nListing 12.10 v2ch12/treeRender/ClassTreeFrame.java\n\
  \n\n\n\n```java\npackage v2ch12.treeRender;\n\nimport module java.base;\nimport\
  \ module java.desktop;\n\n/**\n * 此框架显示了类树、一个文本字段以及一个用于向树中添加更多\n * 类的“添加”按钮。\n */\n\
  public class ClassTreeFrame extends JFrame {\n    private static final int DEFAULT_WIDTH\
  \ = 400;\n    private static final int DEFAULT_HEIGHT = 300;\n\n    private DefaultMutableTreeNode\
  \ root;\n    private DefaultTreeModel model;\n    private JTree tree;\n    private\
  \ JTextField textField;\n    private JTextArea textArea;\n\n    public ClassTreeFrame()\
  \ {\n        setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\n        // 类树的根节点是 Object\n\
  \        root = new DefaultMutableTreeNode(java.lang.Object.class);\n        model\
  \ = new DefaultTreeModel(root);\n        tree = new JTree(model);\n\n        //\
  \ 添加此类以向树中填充数据\n        addClass(getClass());\n\n        // 设置节点图标\n        var\
  \ renderer = new ClassNameTreeCellRenderer();\n        renderer.setClosedIcon(new\
  \ ImageIcon(\"images/red-ball.gif\"));\n        renderer.setOpenIcon(new ImageIcon(\"\
  images/yellow-ball.gif\"));\n        renderer.setLeafIcon(new ImageIcon(\"images/blue-ball.gif\"\
  ));\n        tree.setCellRenderer(renderer);\n\n        // 设置选择模式\n        tree.addTreeSelectionListener(_\
  \ -> {\n            // 用户选择了不同的节点--更新描述\n            TreePath path = tree.getSelectionPath();\n\
  \            if (path == null) return;\n            var selectedNode = (DefaultMutableTreeNode)\
  \ path.getLastPathComponent();\n            Class<?> c = (Class<?>) selectedNode.getUserObject();\n\
  \            String description = getFieldDescription(c);\n            textArea.setText(description);\n\
  \        });\n        int mode = TreeSelectionModel.SINGLE_TREE_SELECTION;\n   \
  \     tree.getSelectionModel().setSelectionMode(mode);\n\n        // 此文本区域持有类描述\n\
  \        textArea = new JTextArea();\n\n        // 添加树和文本区域\n        var panel =\
  \ new JPanel();\n        panel.setLayout(new GridLayout(1, 2));\n        panel.add(new\
  \ JScrollPane(tree));\n        panel.add(new JScrollPane(textArea));\n\n       \
  \ add(panel, BorderLayout.CENTER);\n\n        addTextField();\n    }\n\n    /**\n\
  \     * 添加文本字段和“添加”按钮以添加新类。\n     */\n    public void addTextField() {\n       \
  \ var panel = new JPanel();\n\n        ActionListener addListener = _ -> {\n   \
  \         // 添加文本字段中名称对应的类\n            try {\n                String text = textField.getText();\n\
  \                addClass(Class.forName(text)); // 清空文本字段表示成功\n                textField.setText(\"\
  \");\n            }\n            catch (ClassNotFoundException e) {\n          \
  \      JOptionPane.showMessageDialog(null, \"未找到类\");\n            }\n        };\n\
  \n        // 新的类名输入到此文本字段\n        textField = new JTextField(20);\n        textField.addActionListener(addListener);\n\
  \        panel.add(textField);\n\n        var addButton = new JButton(\"Add\");\n\
  \        addButton.addActionListener(addListener);\n        panel.add(addButton);\n\
  \n        add(panel, BorderLayout.SOUTH);\n    }\n\n    /**\n     * 在树中查找对象。\n \
  \    * @param obj 要查找的对象\n     * @return 包含该对象的节点，如果对象不在树中则返回 null\n     */\n  \
  \  public DefaultMutableTreeNode findUserObject(Object obj) {\n        // 查找包含用户对象的节点\n\
  \        var e = (Enumeration<TreeNode>) root.breadthFirstEnumeration();\n     \
  \   while (e.hasMoreElements()) {\n            var node = (DefaultMutableTreeNode)\
  \ e.nextElement();\n            if (node.getUserObject().equals(obj)) return node;\n\
  \        }\n        return null;\n    }\n\n    /**\n     * 添加新类以及任何尚未加入树中的父类。\n\
  \     * @param c 要添加的类\n     * @return 新添加的节点\n     */\n    public DefaultMutableTreeNode\
  \ addClass(Class<?> c) {\n        // 向树中添加新类\n\n        // 跳过非类类型\n        if (c.isInterface()\
  \ || c.isPrimitive()) return null;\n\n        // 如果类已在树中，返回其节点\n        DefaultMutableTreeNode\
  \ node = findUserObject(c);\n        if (node != null) return node;\n\n        //\
