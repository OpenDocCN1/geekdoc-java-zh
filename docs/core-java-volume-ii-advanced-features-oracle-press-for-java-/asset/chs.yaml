  \ writeStartDocument(String xmlVersion)`\n\n*   `void writeStartDocument(String\
  \ encoding, String xmlVersion)`\n\n    在文档顶部写入 XML 处理指令。请注意，`encoding` 参数仅用于写入属性。它不会设置输出的字符编码。\n\
  \n*   `void setDefaultNamespace(String namespaceURI)`\n\n*   `void setPrefix(String\
  \ prefix, String namespaceURI)`\n\n    设置默认命名空间或与前缀关联的命名空间。声明的作用范围限于当前元素；如果没有写入任何元素，则作用于文档根节点。\n\
  \n*   `void writeStartElement(String localName)`\n\n*   `void writeStartElement(String\
  \ namespaceURI, String localName)`\n\n    写入起始标签，将 `namespaceURI` 替换为关联的前缀。\n\n\
  *   `void writeEndElement()`\n\n    关闭当前元素。\n\n*   `void writeEndDocument()`\n\n\
  \    关闭所有打开的元素。\n\n*   `void writeEmptyElement(String localName)`\n\n*   `void writeEmptyElement(String\
  \ namespaceURI, String localName)`\n\n    写入自闭合标签，将 `namespaceURI` 替换为关联的前缀。\n\n\
  *   `void writeAttribute(String localName, String value)`\n\n*   `void writeAttribute(String\
  \ namespaceURI, String localName, String value)`\n\n    为当前元素写入属性，将 `namespaceURI`\
  \ 替换为关联的前缀。\n\n*   `void writeCharacters(String text)`\n\n    写入字符数据。\n\n*   `void\
  \ writeCData(String text)`\n\n    写入 `CDATA` 块。\n\n*   `void writeDTD(String dtd)`\n\
  \n    写入 `dtd` 字符串，假设该字符串包含一个 `DOCTYPE` 声明。\n\n*   `void writeComment(String comment)`\n\
  \n    写入注释。\n\n*   `void close()`\n\n    关闭此写入器。\n\n## 3.9. XSL 转换\n\nXSL 转换（XSLT）机制允许你指定将\
  \ XML 文档转换为其他格式的规则，例如纯文本、XHTML 或任何 XML 格式。XSLT 通常用于从一种机器可读的 XML 格式转换为另一种，或者将 XML\
  \ 转换为供人类阅读的演示格式。\n\n你需要提供一个 XSLT 样式表，描述 XML 文档转换为其他格式的过程。XSLT 处理器读取 XML 文档和样式表，并产生所需的输出（参见图\
  \ 3.4）。\n\n.图 3.4：应用 XSL 转换\n\nXSLT 规范非常复杂，关于该主题有很多著作。我们不可能讨论 XSLT 的所有特性，因此我们将通过一个代表性的示例。你可以在\
  \ Don Box 等人的 *Essential XML* 书中找到更多信息。XSLT 规范可以在 [`www.w3.org/TR/xslt`](https://www.w3.org/TR/xslt)\
  \ 获取。\n\n假设我们要把包含员工记录的 XML 文件转换为 HTML 文档。考虑以下输入文件：\n\n```\n<staff>\n   <employee>\n\
  \      <name>Carl Cracker</name>\n      <salary>75000.0</salary>\n      <hiredate\
  \ year=\"1987\" month=\"12\" day=\"15\"/>\n   </employee>\n   <employee>\n     \
  \ <name>Harry Hacker</name>\n      <salary>50000.0</salary>\n      <hiredate year=\"\
  1989\" month=\"10\" day=\"1\"/>\n   </employee>\n   <employee>\n      <name>Tony\
  \ Tester</name>\n      <salary>40000.0</salary>\n      <hiredate year=\"1990\" month=\"\
  3\" day=\"15\"/>\n   </employee>\n</staff>\n```\n\n期望的输出是一个 HTML 表格：\n\n```\n<table\
  \ border=\"1\">\n<tr>\n<td>Carl Cracker</td><td>$75000.0</td><td>1987-12-15</td>\n\
  </tr>\n<tr>\n<td>Harry Hacker</td><td>$50000.0</td><td>1989-10-1</td>\n</tr>\n<tr>\n\
  <td>Tony Tester</td><td>$40000.0</td><td>1990-3-15</td>\n</tr>\n</table>\n```\n\n\
  带有转换模板的样式表形式如下：\n\n```xml\n<?xml version=\"1.0\" encoding=\"ISO-8859-1\"?>\n<xsl:stylesheet\n\
  \      xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\n      version=\"1.0\"\
  >\n   <xsl:output method=\"html\"/>\n   template1\n\n   template2\n   . . .\n</xsl:stylesheet>\n\
  ```\n\n在我们的示例中，`xsl:output`元素将方法指定为 HTML。其他有效的方法设置还有 `xml` 和 `text`。\n\n这是一个典型的模板：\n\
  \n```\n<xsl:template match=\"/staff/employee\">\n   <tr><xsl:apply-templates/></tr>\n\
  </xsl:template>\n```\n\n`match` 属性的值是一个 XPath 表达式。该模板规定：当你在 XPath 集合 `/staff/employee`\
  \ 中遇到一个节点时，执行以下操作：\n\n1. 输出字符串 `<tr>`。\n2.  在处理其子节点时继续应用模板。\n\n\n\n\n\n`transform`\
  \ 方法的参数是实现了 `Source` 和 `Result` 接口的类对象。有几个类实现了 `Source` 接口：\n\n```\nDOMSource\n\
  SAXSource\nStAXSource\nStreamSource\n```\n\n你可以从文件、流、读取器或 URL 构建一个 `StreamSource`，并从\
  \ DOM 树的节点构建一个 `DOMSource`。例如，在前面的节中，我们按如下调用了身份转换：\n\n```\nt.transform(new DOMSource(doc),\
  \ result)\n```\n\n在我们的示例中，做了一些更有趣的操作。不是从现有的 XML 文件开始，而是通过一个产生 SAX 事件的 `StreamSource`\
  \ 读取器来解析 XML 文件。该输入文件如下所示（index.xhtml）：\n\n```\nt.transform(new DOMSource\n```\n\
  \n`SAXSource` 转换器在处理输入时生成 SAX 事件。这里是 `EmployeeReader` 类实现 `Result` 接口的方法：\n\n```java\n\
  Attributes attributes = new Attributes();\nboolean done = false;\nwhile (!done)\
  \ {\n    String line = in.readLine();\n    if (line == null) {\n        done = true;\n\
  \    } else {\n        handler.startElement(\"name\", attributes);\n        String\
  \ tokenizer = new StringTokenizer(line);\n        String s = tokenizer.nextToken();\n\
  \        handler.characters(s.toCharArray(), 0, s.length());\n        handler.endElement(\"\
  name\");\n        handler.startElement(\"employee\", attributes);\n    }\n}\nhandler.endElement(\"\
  \", \"staff\");\nhandler.endDocument();\n```\n\n`SAXSource` 转换器是从 `StreamSource`\
  \ 构建的，你只需要这样调用：\n\n```java\nt.transform(new SAXSource(new FileInputStream(filename)),\
  \ result);\n```\n\n转换结果是 `Result` 接口的对象。Java API 提供了三个类：\n\n```\nDOMResult\nSAXResult\n\
  StreamResult\n```\n\n将结果存储在 DOM 树中，使用 `DocumentBuilder` 生成一个新文档并将其封装：\n\n```java\n\
  Document doc = builder.newDocument();\nt.transform(source, new DOMResult(doc));\n\
  ```\n\n将输出保存到文件中，使用 `StreamResult`：\n\n```java\nt.transform(source, new StreamResult(file));\n\
  ```\n\nListing 3.12 包含了完整的源代码。\n\n```xml\n<?xml version=\"1.0\" encoding=\"ISO-8859-1\"\
  ?>\n\n<xsl:stylesheet \n   xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\" \n\
  \   version=\"1.0\">\n\n   <xsl:output method=\"html\"/>\n\n   <xsl:template match=\"\
  /staff\">\n      <table border=\"1\"><xsl:apply-templates/></</table>\n   </xsl:template>\n\
  \n   <xsl:template match=\"/staff/employee\">\n      <tr><xsl:apply-templates/></</tr>\n\
  \   </xsl:template>\n\n   <xsl:template match=\"/staff/employee/name\">\n      <td><xsl:apply-templates/></td>\n\
  \   </xsl:template>\n\n   <xsl:template match=\"/staff/employee/salary\">\n    \
  \  <td>$<xsl:apply-templates/></td>\n   </xsl:template>\n\n   <xsl:template match=\"\
  /staff/employee/hiredate\">\n      <td><xsl:value-of select=\"@year\"/>-<xsl:value-of\
  \ select=\"@month\"/>-<xsl:value-of select=\"@day\"/></td>\n   </xsl:template>\n\
  \n</xsl:stylesheet>\n```\n\nListing 3.11 v2ch03/transform/makeprop.xsl\n\n```xml\n\
  <?xml version=\"1.0\"?>\n\n<xsl:stylesheet \n   xmlns:xsl=\"http://www.w3.org/1999/XSL/Transform\"\
  \ \n   version=\"1.0\">\n\n   <xsl:output method=\"text\" omit-xml-declaration=\"\
  yes\"/>\n\n   <xsl:template match=\"/staff/employee\">\nemployee.<xsl:value-of select=\"\
