  \ {\n        var model = new InvestmentTableModel(30, 5, 10);\n        var table\
  \ = new JTable(model);\n        add(new JScrollPane(table));\n        pack();\n\
  \    }\n}\n\n/**\n * 该表格模型每次被请求时计算单元格条目。表格内容\n * 显示了在不同利率下，投资在若干年内的增长情况。\n */\n\
  class InvestmentTableModel extends AbstractTableModel {\n    private static double\
  \ INITIAL_BALANCE = 100000.0;\n\n    private int years;\n    private int minRate;\n\
  \    private int maxRate;\n\n    /**\n     * 构建一个投资表格模型。\n     * @param y 年数\n \
  \    * @param r1 用于列出的最低利率\n     * @param r2 用于列出的的最高利率\n     */\n    public InvestmentTableModel(int\
  \ y, int r1, int r2) {\n        years = y;\n        minRate = r1;\n        maxRate\
  \ = r2;\n    }\n\n    public int getRowCount() {\n        return years;\n    }\n\
  \n    public int getColumnCount() {\n        return maxRate - minRate + 1;\n   \
  \ }\n\n    public Object getValueAt(int r, int c) {\n        double rate = (c +\
  \ minRate) / 100.0;\n        int nperiods = r;\n        double futureBalance = INITIAL_BALANCE\
  \ * Math.pow(1 + rate, nperiods);\n        return \"%.2f\".formatted(futureBalance);\n\
  \    }\n\n    public String getColumnName(int c) {\n        return (c + minRate)\
  \ + \"%\";\n    }\n}\n```\n\njavax.swing.table.TableModel1.2\n\n* `int getRowCount()`\n\
  * `int getColumnCount()`\n  获取表格模型中的行数和列数。\n\n* `Object getValueAt(int row, int\
  \ column)`\n  获取指定行和列的值。\n\n* `void setValueAt(Object newValue, int row, int column)`\n\
  \  在指定的行和列设置新值。\n\n* `boolean isCellEditable(int row, int column)`\n  如果指定行和列的单元格是编辑的，则返回\
  \ `true`。\n\n* `String getColumnName(int column)`\n  获取列标题。\n\n## 12.2. 操作行和列\n\n\
  在接下来的子节中，你将看到如何操作表格中的行和列。在阅读这些材料时，请记住 Swing 表格是相当不对称的——你可以在行和列上执行的操作是不同的。表格组件经过优化，用于显示具有相同结构的结构行（例如数据库查询的结果），而不是任意的二维对象网格。你将在整个小节中看到这种不对称性。\n\
  \n### 12.2.1. 列类\n\n在下一个示例中，我们再次显示我们的行星数据，但这次我们想让表格提供更多关于列类型的信息。这是通过定义表格模型的方法\n\n\
  ```\nClass<?> getColumnClass(int columnIndex)\n```\n\n实现的，该方法返回描述列类型的类。\n\n`JTable`\
  \ 类使用此信息来为该类选择适当的渲染器。表格 12.1 显示了默认的渲染动作。\n\n表格 12.1: 默认渲染动作\n\n| 类型 | 渲染为 |\n| ---\
  \ | --- |\n| `Boolean` | 复选框 |\n| `Icon` | 图片 |\n| `Object` | 字符串 |\n\n你可以在图 12.5\
  \ 中看到复选框和图片。（感谢 Jim Evins 提供的行星图片！）\n\n![Figure](img/fig06-09.jpg)图 12.5: 带有行星数据的表格\n\
  \n若要渲染其他类型，你可以安装自定义的渲染器——参见第 12.3 节。\n\n### 12.2.2. 访问表格列\n\n`JTable` 类在 `TableColumn`\
  \ 类型对象中存储关于表格列的信息。`TableColumnModel` 对象管理列。（图 12.6 显示了最重要的表格类之间的关系。）如果你不想动态插入或删除列，你就不会经常使用列模型。列模型最常用的用法只是获取一个\
  \ `TableColumn` 对象：\n\n```\nint columnIndex = . . .;\nTableColumn column = table.getColumnModel().getColumn(columnIndex);\n\
  ```\n\n图 12.6: 表格类之间的关系\n\n### 12.2.3. 调整列宽\n\n`TableColumn` 类允许你控制列的调整大小行为。你可以通过以下方法设置首选、最小和最大宽度：\n\
  \n```\nvoid setPreferredWidth(int width)\nvoid setMinWidth(int width)\nvoid setMaxWidth(int\
  \ width)\n```\n\n你可以通过使用 `JTable` 的\n\n```\nvoid setResizable(boolean resizable)\n\
  ```\n\n来控制是否允许用户调整大小。你可以通过使用方法\n\n```\nvoid setAutoResizeMode(int mode)\n```\n\n\
  从表格 12.2 中设置另一种行为。\n\n| 模式 | 行为 |\n| 1 | --- |\n| `AUTO_RESIZE_OFF` | 不调整其他列；更改表格宽度。\
  \ |\n| `AUTO_RESIZE_NEXT_COLUMN` | 仅调整下一列。 |\n| `AUTO_RESIZE_SUBSEQUENT_COLUMNS`\
  \ | 等等调整所有列；这是默认行为。 |\n| `AUTO_RESIZE_LAST_COLUMN` | 仅调整最后一列。 |\n| `AUTO_RESIZE_ALL_COLUMNS`\
  \ | 调整表格中的所有列；这不是好的选择，因为它阻止了用户调整列的大小。 |\n\n12.2.4. 调整行\n\n行高由 `JTable` 类直接管理。如果你的单元格比默认的高，你可能需要设置行高：\n\
  \n```\ntable.setRowHeight(height);\n```\n\n默认情况下，表格所有行的高度相同。你可以通过以下调用设置特定行的高度：\n\
  \n```\ntable.setRowHeight(row, height);\n```\n\n实际行高等于通过这些方法设置的行高减去行边距。默认边距为 1 像素，但你可以通过以下调用更改它：\n\
  \n```\ntable.setRowMargin(margin);\n```\n\n### 12.2.5. 选择行、列和单元格\n\n根据选择模式，用户可以选择表格中的行、列或单个单元格。默认情况下启用行选择。点击单元格内部会选中整行（参见图\
  \ 12.5）。调用\n\n```\ntable.setRowSelectionAllowed(false);\n```\n\n禁用行选择。\n\n当行选择启用时，你可以控制用户是否允许选择单行、连续一组行或任意一组行。你需要获取选择模型并使用其\
  \ `setSelectionMode` 方法：\n\n```\ntable.getSelectionModel().setSelectionMode(mode);\n\
  ```\n\n在这里，`mode` 是三个值之一：\n\n```\nListSelectionModel.SINGLE_SELECTION\nListSelectionModel.SINGLE_INTERVAL_SELECTION\n\
  ListSelectionModel.MULTIPLE_INTERVAL_SELECTION\n```\n\n* 选择模型\n\n\n\n\n启用行和列选择等同于启用单元格选择。用户随后可以选择单元格区域（参见图\
  \ 12.7）。你也可以通过调用启用该设置：\n\n```\ntable.setCellSelectionEnabled(true);\n```\n\n![Figure](img/fig06-11.jpg)图\
  \ 12.7: 选择单元格区域\n\n运行列表 12.3 中的程序以查看单元格选择的效果。在选择（Selection）菜单中启用行、列或单元格选择，观察选择行为如何变化。\n\
  \n你可以通过 `getSelectedRows` 和 `getSelectedColumns` 方法找到哪些行和列被选中了。它们都返回一个包含选中项索引的 `int[]`\
  \ 数组。注意，索引值是表格视图的，而不是底层表格模型的。尝试选择行和列，然后将列拖到不同的位置，并通过点击列头对行进行排序。使用“打印选择”（Print Selection）菜单项查看哪些行和列被报告为已选中。\n\
  \n如果你需要将表格索引值转换为表格模型索引值，请使用 `JTable` 方法 `convertRowIndexToModel` 和 `convertColumnIndexToModel`。\n\
  \n### 12.2.6. 行的排序\n\n正如我们在第一个表格示例所示，只需通过调用 `setAutoCreateRowSorter` 方法为 `JTable`\
  \ 添加行排序是非常简单的。然而，为了对排序行为进行更细粒度的控制，可以向 `JTable` 插入一个 `TableRowSorter<M>` 对象并对其自定义。类型参数\
  \ `M` 表示表格模型；它需要是 `TableModel` 接口的子类型。\n\n```\nvar sorter = new TableRowSorter<TableModel>(model);\n\
  table.setRowSorter(sorter);\n```\n\n某些列不应该是可排序的，例如行星数据中的图像列。通过调用关闭排序：\n\n```\nsorter.setSortable(IMAGE_COLUMN,\
  \ false);\n```\n\n你可以为每一列安装自定义的比较器（comparator）。在我们的示例中，我们将对 Color 列中的颜色进行排序，优先考虑蓝色和绿色而非红色。当你点击\
  \ Color 列时，你会发现蓝色行星移动到了表格底部。这是通过以下调用实现的：\n\n```\nsorter.setComparator(COLOR_COLUMN,\
  \ new Comparator<Color>() {\n    public int compare(Color c1, Color c2) {\n    \
  \    int d = c1.getBlue() - c2.getBlue();\n        if (d != 0) return d;\n     \
  \   d = c1.getGreen() - c2.getGreen();\n        if (d != 0) return d;\n        return\
  \ c1.getRed() - c2.getRed();\n    }\n});\n```\n\n如果你没有为某列指定比较器，排序顺序将如下确定：\n\n1.\
  \ 如果列类型为 `String`，则使用 `Collator.getInstance()` 返回的默认对比较器（collator）。它以适用于当前语言环境的方式对字符串进行排序。（有关语言环境和比较器的更多信息请参见第\
  \ 7 章 {\n    public String toString(TableModel model, int row, int column) {\n \
  \       Object value = model.getValueAt(row, column);\n        // 将值转换为字符串并返回\n\
  \    }\n});\n```\n4. 否则，调用单元格值的 `toString` 方法并使用默认对比较器对其进行排序。\n\n### 12.2.7. 行的过滤\n\
  \n除了排序外，`TableRowSorter` 还可以选择性地隐藏行——这个过程被称为*过滤*（filtering）。要激活过滤，请设置一个 `RowFilter`。例如，要包含包含至少一个卫星的所有行，调用：\n\
  \n```\nsorter.setRowFilter(RowFilter.numberFilter(ComparisonType.NOT_EQUAL, 0, MOONS_COLUMN));\n\
  ```\n\n在这里，我们使用了一个预定义的数字过滤器。要构造数字过滤器，需要提供：\n\n* 比较类型（`EQUAL`、`NOT_EQUAL`、`AFTER`\
  \ 或 `BEFORE` 之一）。\n* 一个 `Number` 类的对象（例如 `Integer` 或 `Double`）。只有与给定的 `Number` 对象相同类的对象会被考虑。\n\
  * 零或多个列索引值。如果没有提供任何索引值，则搜索所有列。\n\n静态方法 `RowFilter.dateFilter` 方法以相同的方式构造日期过滤器；你需要提供一个\
  \ `Date` 对象而不是 `Number` 对象。\n\n最后，静态方法 `RowFilter.regexFilter` 方法构造一个匹配正则表达式的字符串的过滤器。例如，\n\
  \n```\nsorter.setRowFilter(RowFilter.regexFilter(\".*[^s]$\", PLANET_COLUMN));\n\
  ```\n\n仅显示那些名称不以“s”结尾的行星。（有关正则表达式的更多信息请参见第 2 章,\n    RowFilter.numberFilter(ComparisonType.NOT_EQUAL,\
  \ 0, MOONS_COLUMN))));\n```\n（注：原文此处代码块似乎有截断错误，已根据逻辑补全翻译）\n\n\n\n\n\n```\ntable.addColumn(new\
  \ TableColumn(modelColumnIndex));\n```\n\n你可以拥有多个表格列来显示模型中的同一列数据。\n\n列表 12.3 中的程序演示了行和列的选择与过滤。\n\
