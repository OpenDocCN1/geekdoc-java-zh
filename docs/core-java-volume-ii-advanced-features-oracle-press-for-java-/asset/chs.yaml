  *   `Instant toInstant()`\n    产生与此 `FileTime` 表示相同时间的 `Instant`。\n\n### 2.3.6.\
  \ 访问目录项\n\n静态方法 `Files.list` 返回一个读取目录条目的 `Stream<Path>`。目录是按延迟加载读取的，这使得高效处理包含大量条目的目录成为可能。\n\
  \n由于由于读取目录涉及需要关闭的系统资源，你应该使用 `try` 块：\n\n```\ntry (Stream<Path> entries = Files.list(pathToDirectory))\
  \ {\n    . . .\n}\n```\n\n`list` 方法不会进入子目录。要处理目录的所有后代，请改用 `Files.walk` 方法。\n\n```\n\
  try (Stream<Path> entries = Files.walk(pathToRoot)) {\n    // 包含所有后代，按深度优先顺序访问\n\
  }\n```\n\n以下是对解压后的 `src.zip` 树的采样遍历示例：\n\n```java\njava/nio\njava/nio/DirectCharBufferU.java\n\
  java/nio/ByteBufferAsShortBufferRL.java\njava/nio/MappedByteBuffer.java\n. . .\n\
  java/nio/ByteBufferAsDoubleBufferB.java\njava/nio/charset\njava/nio/charset/CoderMalfunctionError.java\n\
  java/nio/charset/CharsetDecoder.java\njava/nio/charset/UnsupportedCharsetException.java\n\
  java/nio/charset/spi\njava/nio/charset/spi/CharsetProvider.java\njava/nio/charset/StandardCharsets.java\n\
  java/nio/charset/Charset.java\n. . .\njava/nio/charset/CoderResult.java\njava/nio/HeapFloatBufferR.java\n\
  . . .\n```\n\n如你所示，每当遍历产生目录时，会在继续处理其兄弟节点之前进入。\n\n你可以通过调用 `Files.walk(pathToRoot,\
  \ depth)` 来限制想要访问的树深度。两个 `walk` 方法都有一个类型为 `FileVisitOption...` 的可变参数，但你只能提供一个选项：`FOLLOW_LINKS`\
  \ 用于跟踪符号链接。\n\n如果你过滤 `walk` 返回的路径，且你的过滤标准涉及存储在目录中的文件属性（例如大小、创建时间或类型（文件、目录、符号链接）），请使用\
  \ `find` 方法代替 `walk`。调用该方法时，传入一个接受路径和 `BasicFileAttributes` 对象的谓词函数。唯一的优势是效率。因为目录正在被读取，属性是现就用的。\n\
  \n这段代码片段使用 `Files.walk` 方法将一个目录拷贝到另一个：\n\n```\nFiles.walk(source).forEach(p -> {\n\
  \    try {\n        Path q = target.resolve(source.relativize(p));\n        if (Files.isDirectory(p))\n\
  \            Files.createDirectory(q);\n        else\n            Files.copy(p,\
  \ q);\n    }\n    catch (IOException e) {\n        throw new UncheckedIOException(e);\n\
  \    }\n});\n```\n\n遗憾的是，你不能轻松地使用 `Files.walk` 方法删除目录树，因为你需要在删除父目录之前删除子节点。第 2.3.8\
  \ 节 向你展示了如何克服这个问题。\n\n### 2.3.7. Glob 模式\n\n有时，通过模式进行过滤是有用的。`glob` 语法比正则表达式更有用。2.5：Glob\
  \ 模式\n\n| 模式 | 说明 | 示例 |\n| :--- | :--- | :--- |\n| `*` | 匹配零或多个字符。 | `*.java` |\n\
  | `**` | 匹配零或多个字符，跨越目录边界。 | `**.java` |\n| `?` | 匹配一个字符。 | `????.java` |\n| `[]`\
  \ | 匹配字符集。 | `Test[0-9]` |\n| `!` | 匹配否定。 | `[!0-9]` |\n| `{}` | 匹配逗号分隔的备选项。 | `{java,class}`\
  \ |\n| `\\` | 转义上述任何内容。 | `*\\` |\n\n如果你在 Windows 上转两次，一次是为了 glob 语法，一次是为了 Java\
  \ 字符串：`Files.newDirectoryStream(dir, \"\\\\\\\\\")`。要通过这种模式过滤，构造一个 `PathMatcher`\
  \ 并使用它的 `matches` 方法。\n\n```\nPathMatcher javaSource = FileSystems.getDefault().getPathMatcher(\"\
  glob:**/*.java\");\nList<Path> sourcePaths = Files.walk(root).filter(javaSource::matches).toList();\n\
  ```\n\n### `java.nio.file.FileSystem`\n\n*   `PathMatcher getPathMatcher(String\
  \ syntaxAndPath)`\n    获取给定语法和模式的匹配器。`syntaxAndPath` 字符串以语法名称开头，后跟该语法的模式。每个文件系统都支持\
  \ `glob` 和 `regex` 语法。\n\n### `java.nio.file.FileSystems`\n\n*   `static FileSystem\
  \ getDefault()`\n    获取默认文件系统。\n\n### `java.nio.file.PathMatcher`\n\n*   `boolean\
  \ matches(Path path)`\n    如果给定路径匹配，则返回 `true`。\n\n### 2.3.8. 目录流\n\n正如你在第 2.3.6\
  \ 节 中所示，`Files.walk` 方法产生一个遍历目录后代的 `Stream<Path>`。有时，你需要对遍历过程进行更细粒度的控制。在这种情况下，请改用\
  \ `Files.newDirectoryStream` 对象。它产生一个 `DirectoryStream`。注意，这不是 `java.util.stream.Stream`\
  \ 的子接口，而是专门用于目录遍历的接口。它是 `Iterable` 的子接口，因此你可以在增强型 `for` 循环中使用目录流。以下是使用模式：\n\n```\n\
  try (DirectoryStream<Path> entries = Files.newDirectoryStream(dir)) {\n    for (Path\
  \ entry : entries)\n        Process entries\n}\n```\n\n`try`-with-resources 块确保了目录流被正确关闭。\n\
  \n\n\n\n目录项的访问没有特定的顺序。\n\n你可以使用 glob 模式来过滤文件：\n\n```\ntry (DirectoryStream<Path>\
  \ entries = Files.newDirectoryStream(dir, \"*.java\"))\n```\n\n如果你想访问目录的所有后代节点，请调用\
  \ `walkFileTree` 方法并提供一个 `FileVisitor` 类型的对象。该对象会收到以下通知：\n\n*   遇到文件时：`FileVisitResult\
  \ visitFile(T path, BasicFileAttributes attrs)`\n*   在处理目录之前：`FileVisitResult preVisitDirectory(T\
  \ dir, IOException e)`\n*   在处理目录之后：`FileVisitResult postVisitDirectory(T dir, IOException\
  \ e)`\n*   在尝试访问文件或目录时发生错误（例如尝试在没有必要权限的情况下打开目录）：`FileVisitResult visitFileFailed(T\
  \ path, IOException e)`\n\n在每种情况下，你都可以指定想要：\n\n*   继续访问下一个文件：`FileVisitResult.CONTINUE`\n\
  *   继续遍历，但不访问该目录中的项：`FileVisitResult.SKIP_SUBTREE`\n*   继续遍历，但不访问该文件的兄弟节点：`FileVisitResult.SKIP_SIBLINGS`\n\
  *   终止遍历：`FileVisitResult.TERMINATE`\n\n如果任何一个方法抛出异常，遍历也将终止，并且该异常将从 `walkFileTree`\
  \ 方法抛出。\n\n`FileVisitor` 接口是一个泛型类型，但你可能不需要 `FileVisitor<Path>` 以外的类型。`walkFileTree`\
  \ 方法愿意接受 `FileVisitor<? super Path>`，但 `Path` 并没有许多父类型。\n\n便利类 `SimpleFileVisitor`\
  \ 实现了 `FileVisitor` 接口，并提供了一些简单的方法，这些方法会继续访问或在发生异常时终止访问。你可以扩展它并根据需要重写方法。\n\n例如，这里是打印给定目录的所有子目录的方法：\n\
  \n```\nFiles.walkFileTree(Path.of(\"/\"), new SimpleFileVisitor<Path>() {\n    \
  \    public FileVisitResult preVisitDirectory(Path path, BasicFileAttributes attrs)\n\
  \                throws IOException {\n            IO.println(path);\n         \
  \   return FileVisitResult.CONTINUE;\n        }\n\n        public FileVisitResult\
  \ postVisitDirectory(Path dir, IOException e) {\n            return FileVisitResult.CONTINUE;\n\
  \        }\n\n        public FileVisitResult visitFileFailed(Path path, IOException\
  \ e)\n                throws IOException {\n            if (e != null) throw e;\n\
  \            return FileVisitResult.SKIP_SUBTREE;\n        }\n    });\n```\n\n注意，我们需要重写\
  \ `postVisitDirectory` 和 `visitFileFailed`。否则，一旦遇到无权打开的目录或无权访问的文件，访问就会失败。\n\n此外请注意，路径的属性作为参数传递给\
  \ `preVisitDirectory` 和 `visitFile` 方法的。访问者已经必须通过 OS 调用来获取属性，因为它们需要区分文件和目录。这样你就不需要再次调用了。\n\
  \n`FileVisitor` 接口的其他方法在你需要在进入或离开目录时执行某些工作时有用。例如，当你删除一个目录树时，需要在删除所有文件后删除当前目录。以下是删除目录树的完整代码：\n\
  \n```\n// 从根节点开始删除目录树\nFiles.walkFileTree(root, new SimpleFileVisitor<Path>() {\n\
  \        public FileVisitResult visitFile(Path file, BasicFileAttributes attrs)\n\
  \                throws IOException {\n            Files.delete(file);\n       \
  \     return FileVisitResult.CONTINUE;\n        }\n\n        public FileVisitResult\
  \ postVisitDirectory(Path dir, IOException e)\n                throws IOException\
  \ {\n            if (e != null) throw e;\n            Files.delete(dir);\n     \
  \       return FileVisitResult.CONTINUE;\n        }\n    });\n```\n\n`java.nio.file.Files`\n\
  \n*   `static DirectoryStream<Path> newDirectoryStream(Path path)`\n*   `static\
  \ DirectoryStream<Path> newDirectoryStream(Path path, String glob)`\n    获取给定目录中文件和目录的迭代器。第二个方法只接受匹配给定\
  \ glob 模式的项。\n*   `static Path walkFileTree(Path start, FileVisitor<? super Path>\
  \ visitor)`\n    遍历给定路径的所有后代节点，对所有后代节点应用访问者。\n\n`java.nio.file.SimpleFileVisitor<T>`\n\
  \n*   `static FileVisitResult visitFile(T path, BasicFileAttributes attrs)`\n  \
  \  在访问文件或目录时调用；返回 `CONTINUE`、`SKIP_SUBTREE`、`SKIP_SIBLINGS` 或 `TERMINATE` 之一。默认实现什么都不做并继续。\n\
  *   `static FileVisitResult preVisitDirectory(T dir, BasicFileAttributes attrs)`\n\
  *   `static FileVisitResult postVisitDirectory(T dir, IOException exc)`\n    在访问目录之前和之后调用。默认实现什么都不做并继续。然而，如果\
  \ `exc` 不为 `null`，则将其抛出，导致访问以该异常终止。\n*   `static FileVisitResult visitFileFailed(T\
  \ path, IOException exc)`\n    当尝试获取有关给定文件的信息时抛出异常时调用。默认实现重新抛出该异常，导致访问以该异常终止。如果你想继续，请重写该方法。\n\
  \n### 2.3.9. ZIP 系统\n\n`Paths` 类在默认文件系统（用户磁盘上的文件）中查找路径。你可以拥有其他文件系统。其中一个非常有用的是 ZIP\
  \ 文件系统。如果 `zipname` 是一个 ZIP 文件的名称，那么调用\n\n```\nFileSystem fs = FileSystems.newFileSystem(zipname);\n\
  ```\n\n将建立一个包含 ZIP 中所有文件的文件系统。如果你知道它的名称，从该归档中拷贝文件是很容易的事：\n\n```\nFiles.copy(fs.getPath(sourceName),\
  \ targetPath);\n```\n\n在这里，`fs.getPath` 是任意文件系统的 `Path.of` 的对应物。要列出 ZIP 归档中的所有文件，遍历文件树：\n\
  \n```\nFiles.walk(fs.getPath(\"/\")).forEach(IO::println);\n```\n\n要创建一个新的 ZIP 文件，调用：\n\
  \n```\nFileSystem fs = FileSystems.newFileSystem(zippath, Map.of(\"create\", \"\
  true\"));\n```\n\n然后将文件拷贝到文件系统中。完成后，调用\n\n```\nfs.close();\n```\n\n以便将更改写入磁盘。ZIP\
  \ 文件系统比 2.2.3 节描述的 API 更好，后者需要特殊的类来处理 ZIP 归档。\n\n`java.nio.file.FileSystems`\n\n\
  *   `static FileSystem newFileSystem(Path path)`\n*   `static FileSystem newFileSystem(Path\
  \ path, Map<String, ?> env)`\n    返回由接受给定路径的文件系统提供者创建的文件系统。默认情况下，有一个针对扩展名结尾文件的 ZIP\
  \ 文件系统的提供者。使用 `env` 映射用于依赖文件系统提供者的配置参数。\n*   `void close()`\n    关闭此文件系统并永久写入更改。\n\
  \n`java.nio.file.FileSystem`\n\n*   `static Path getPath(String first, String...\
  \ more)`\n    通过连接给字符串创建路径。\n\n## 2.4. 内存映射文件\n\n大多数操作系统可以利用虚拟内存实现将文件或文件的区域“映射”到内存中。然后就可以像访问内存数组一样访问文件，这比传统的的文件操作快得多。\n\
  \n### 2.4.1. 内存映射文件性能\n\n在本节结束，你可以你可以一个程序，它使用传统的文件输入和内存映射文件计算文件的 CRC32 校验和。在某机器上，当计算\
  \ JDK `lib` 目录下的 51MB 文件 `src.zip` 的校验和时，我们得到了表 2.6 所示的时间数据。\n\n表 2.6: 文件操作计时数据\n\
  \n| 方法 | 时间 |\n| --- | --- |\n| 普通输入流 | 15.1 秒 |\n\n\n\n\n| 缓冲输入流 | 0.8 秒 |\n| 随机访问文件\
  \ | 11.9 秒 |\n| 内存映射文件 | 0.2 秒 |\n\n如你所示，在此特定的机器上，内存映射比使用缓冲顺序输入要快一点，并且比使用 `RandomAccessFile`\
  \ 快得多。\n\n当然，具体的数值在不同机器之间会有很大差异，但显而易见，与随机访问相比，性能提升是巨大的。\n\n内存映射使用的比随机访问文件稍微不直观的\
  \ API。以下是操作方法：\n\n首先，获取该文件的 `channel`。`channel` 是磁盘文件的抽象，允许你访问操作系统功能，例如内存映射、文件锁定以及文件之间的快速数据传输。\n\
  \n```\nFileChannel channel = FileChannel.open(path, options);\n```\n\n然后，通过调用 `FileChannel`\
  \ 类的 `map` 方法从 `channel` 获取一个 `ByteBuffer`。指定你想要映射的文件区域和 `mapping mode`（映射模式）。支持三种模式：\n\
  \n*   `FileChannel.MapMode.READ_ONLY`：生成的缓冲区是只读的。任何向缓冲器的写入尝试都会导致 `ReadOnlyBufferException`。\n\
  *   `FileChannel.MapMode.READ_WRITE`：生成的缓冲区是可写的，更改将在以后某个时间写回文件。请注意，映射了同一文件的其他程序可能不会立即看到这些更改。多个程序同时映射文件的确切行为取决于操作系统。\n\
  *   `FileChannel.MapMode.PRIVATE`：生成的缓冲区是可写的，但任何更改对该缓冲区都是私有的，不会传播到文件中。\n\n例如，\n\n\
  ```\nMappedByteBuffer buffer = channel.map(FileChannel.MapMode.READ_ONLY, 0, channel.size());\n\
  ```\n\n一旦获取了缓冲区，就可以使用 `ByteBuffer` 类和 `Buffer` 超类的方法来读写数据。\n\n缓冲区支持顺序和随机数据访问。缓冲区有一个\
  \ `position`（位置），它会通过 `get` 和 `put` 操作向前移动。例如，你可以按如下顺序遍历缓冲区中的所有字节：\n\n```\nwhile\
  \ (buffer.hasRemaining()) {\n    byte b = buffer.get();\n    . . .\n}\n```\n\n或者，你可以使用随机访问：\n\
  \n```\nfor (int i = 0; i < buffer.limit(); i++) {\n    byte b = buffer.get(i);\n\
  \    . . .\n}\n```\n\n你也可以使用以下方法读写字节数组：\n\n```\nget(byte[] bytes)\nget(byte[] bytes,\
  \ int offset, int length)\n```\n\n最后，还有这些方法\n\n```\ngetInt            getChar\n\
  getLong           getFloat\ngetShort          getDouble\n```\n\n用于读取以 `binary`（二进制）值存储在文件中的基本类型值。正如我们已经提到的，Java\
  \ 对二进制数据使用大端序（big-endian）排序。然而，如果你需要处理一个包含小端序（little-endian）二进制数字的文件，只需调用\n\n```\n\
  buffer.order(ByteOrder.LITTLE_ENDIAN);\n```\n\n要查找缓冲区的当前字节序，请调用\n\n```\nByteOrder\
  \ b = buffer.order();\n```\n\n要向缓冲区写入数字，请使用以下方法之一：\n\n```\nputInt            putChar\n\
  putLong           putFloat\nputShort          putDouble\n```\n\n在某个时刻，且肯定是在通道关闭时，这些更改会被写回文件。\n\
  \n列表 2.3 计算了文件的 32 位循环冗余校验和 (CRC32)。该校验和通常用于确定文件是否被损坏。文件的损坏会导致校验和极有可能发生变化。`java.util.zip`\
  \ 包包含一个 `CRC32` 类，它使用以下循环来计算字节序列的校验和：\n\n```\nvar crc = new CRC32();\nwhile (more\
  \ bytes) {\n    crc.update(next byte);\n}\nlong checksum = crc.getValue();\n```\n\
  \nCRC 计算的细节并不重要。我们只是将其用作有用文件操作的示例。（在实践中，你会以较大的块读取和更新数据，而不是一个字节一个字节地处理。那样，速度差异就不会那么显著了。）\n\
  \n以如下方式运行程序：\n\n```\njava v2ch02.memoryMap.MemoryMapDemo filename\n```\n\n列表 2.3\
  \ `v2ch02/memoryMap/MemoryMapDemo.java`\n\n```java\npackage v2ch02.memoryMap;\n\n\
  import module java.base;\n\n/**\n * 此程序通过四种方式计算文件的 CRC 校验和。\n */\npublic class MemoryMapDemo\
  \ {\n    void main(String[] args) throws Exception {\n        Path filename = Path.of(args.length\
  \ > 0 ? args[0]\n                : IO.readln(\"Enter the path to a large file: \"\
  ));\n        IO.println(\"Input Stream:\");\n        long start = System.nanoTime();\n\
  \        long crcValue = checksumInputStream(filename);\n        long end = System.nanoTime();\n\
  \        IO.println(Long.toHexString(crcValue));\n        IO.println(\"%.3f seconds\"\
  .formatted((end - start) * 1E-9));\n\n        IO.println(\"Buffered Input Stream:\"\
  );\n        start = System.nanoTime();\n        crcValue = checksumBufferedInputStream(filename);\n\
  \        end = System.nanoTime();\n        IO.println(Long.toHexString(crcValue));\n\
  \        IO.println(\"%.3f seconds\".formatted((end - start) * 1E-9));\n\n     \
  \   IO.println(\"Random Access File:\");\n        start = System.nanoTime();\n \
  \       crcValue = checksumRandomAccessFile(filename);\n        end = System.nanoTime();\n\
  \        IO.println(Long.toHexString(crcValue));\n        IO.println(\"%.3f seconds\"\
  .formatted((end - start) * 1E-9));\n\n        IO.println(\"Mapped File:\");\n  \
  \      start = System.nanoTime();\n        crcValue = checksumMappedFile(filename);\n\
  \        end = System.nanoTime();\n        IO.println(Long.toHexString(crcValue));\n\
  \        IO.println(\"%.3f seconds\".formatted((end - start) * 1E-9));\n    }\n\n\
  \    long checksumInputStream(Path filename) throws IOException {\n        try (InputStream\
  \ in = Files.newInputStream(filename)) {\n            var crc = new CRC32();\n \
  \           boolean done = false;\n            while (!done) {\n               \
  \ int c = in.read();\n                if (c == -1)\n                    done = true;\n\
  \                else\n                    crc.update(c);\n            }\n     \
  \       return crc.getValue();\n        }\n    }\n\n    long checksumBufferedInputStream(Path\
  \ filename) throws IOException {\n        try (var in = new BufferedInputStream(Files.newInputStream(filename)))\
  \ {\n            var crc = new CRC32();\n            boolean done = false;\n   \
  \         while (!done) {\n                int c = in.read();\n                if\
  \ (c == -1)\n                    done = true;\n                else\n          \
  \          crc.update(c);\n            }\n            return crc.getValue();\n \
  \       }\n    }\n\n    long checksumRandomAccessFile(Path filename) throws IOException\
  \ {\n        try (var file = new RandomAccessFile(filename.toFile(), \"r\")) {\n\
  \            long length = file.length();\n            var crc = new CRC32();\n\n\
  \            for (long p = 0; p < length; p++) {\n                int c = file.readByte();\n\
  \                crc.update(c);\n            }\n            return crc.getValue();\n\
  \        }\n    }\n\n    long checksumMappedFile(Path filename) throws IOException\
  \ {\n        try (FileChannel channel = FileChannel.open(filename)) {\n        \
  \    var crc = new CRC32();\n            int length = (int) channel.size();\n  \
  \          MappedByteBuffer buffer = channel.map(FileChannel.MapMode.READ_ONLY,\
  \ 0, length);\n\n            for (int p = 0; p < length; p++) {\n              \
  \  int c = buffer.get(p);\n                crc.update(c);\n            }\n     \
  \       return crc.getValue();\n        }\n    }\n}\n```\n\n\n\n\n为指定的路径打开文件通道。默认情况下，通道以读模式打开。参数\
  \ `options` 是 `StandardOpenOption` 枚举中的 `WRITE`、`APPEND`、`TRUNCATE_EXISTING` 或 `CREATE`\
  \ 值之一。\n\n*   `MappedByteBuffer map(FileChannel.MapMode mode, long position, long\
  \ size)`\n\n    将文件的一个区域映射到内存。参数 `mode` 是 `FileChannel.MapMode` 类中的常量 `READ_ONLY`、`READ_WRITE`\
  \ 或 `PRIVATE` 之一。\n\n`java.nio.Buffer`1.4\n\n*   `boolean hasRemaining()`\n\n  \
  \  如果当前缓冲区位置尚未达到缓冲区的限制位置，则返回 `true`。\n\n*   `int limit()`\n\n    返回缓冲区的限制位置——即不再有可用值的第一个位置。\n\
  \n`java.nio.ByteBuffer`1.4\n\n*   `byte get()`\n\n    从当前位置获取一个字节，并将当前位置移动到下一个字节。\n\
  \n*   `byte get(int index)`\n\n    从指定的索引获取一个字节。\n\n*   `ByteBuffer put(byte b)`\n\
  \n    在当前位置放入一个字节，并将当前位置移动到下一个字节。返回此缓冲区的引用。\n\n*   `ByteBuffer put(int index, byte\
  \ b)`\n\n    在指定的索引放入一个字节。返回此缓冲区的引用。\n\n*   `ByteBuffer get(byte[] destination)`\n\
  \n*   `ByteBuffer get(byte[] destination, int offset, int length)`\n\n    用缓冲区中的字节填充字节数组（或字节数组的一个区域），并根据读取的字节数移动当前位置。如果缓冲区中剩余字节不足，则不读取任何字节，并抛出\
  \ `BufferUnderflowException`。返回此缓冲区的引用。\n\n*   `ByteBuffer put(byte[] source)`\n\
  \n*   `ByteBuffer put(byte[] source, int offset, int length)`\n\n    将字节数组中的所有字节（或字节数组某个区域的字节）放入缓冲区，并根据读取的字节数移动当前位置。如果缓冲区中剩余字节不足，则不写入任何字节，并抛出\
  \ `BufferOverflowException`。返回此缓冲区的引用。\n\n*   `Xxx getXxx()`\n\n*   `Xxx getXxx(int\
  \ index)`\n\n*   `ByteBuffer putXxx(Xxx value)`\n\n*   `ByteBuffer putXxx(int index,\
  \ Xxx value)`\n\n    获取或放入一个二进制数字。`Xxx` 是 `Int`、`Long`、`Short`、`Char`、`Float` 或\
  \ `Double` 之一。\n\n*   `ByteBuffer order(ByteOrder order)`\n\n*   `ByteOrder order()`\n\
  \n    设置或获取字节序。`order` 的值是 `ByteOrder` 类中的常量 `BIG_ENDIAN` 或 `LITTLE_ENDIAN`。\n\n\
  *   `static ByteBuffer allocate(int capacity)`\n\n    构造一个具有给定容量的缓冲区。\n\n*   `static\
  \ ByteBuffer wrap(byte[] values)`\n\n    构造一个由给定数组支持的缓冲区。\n\n*   `CharBuffer asCharBuffer()`\n\
  \n    构造一个由此缓冲区支持的字符缓冲区。对字符缓冲区的更改将反映在此缓冲区，但字符缓冲区有自己的位置、限制和标记。\n\n`java.nio.CharBuffer`1.4\n\
  \n*   `char get()`\n\n*   `CharBuffer get(char[] destination)`\n\n*   `CharBuffer\
  \ get(char[] destination, int offset, int length)`\n\n    从缓冲区位置开始获取一个 `char` 值或一个\
  \ `char` 值范围，并将位置移动过已读的字符。最后两个方法返回 `this`。\n\n*   `CharBuffer put(char c)`\n\n*\
  \   `CharBuffer put(char[] source)`\n\n*   `CharBuffer put(char[] source, int offset,\
  \ int length)`\n\n*   `CharBuffer put(String source)`\n\n*   `CharBuffer put(CharBuffer\
  \ source)`\n\n    从缓冲区位置开始放入一个 `char` 值或一个 `char` 值范围，并将位置移动过写入的字符。从 `CharBuffer`\
  \ 读取时，将读取所有剩余字符。所有方法均返回 `this`。\n\n### 2.4.2. 缓冲区数据结构\n\n当你使用内存映射时，你会创建一个跨越整个文件或你感兴趣的文件区域的单一缓冲区。你也可以使用缓冲区来读写较小的信息块。\n\
  \n在本节中，我们简要描述对 `Buffer` 对象的基本操作。缓冲区是相同类型取值的数组。`Buffer` 类是一个抽象类，其具体子类包括 `ByteBuffer`、`CharBuffer`、`DoubleBuffer`、`FloatBuffer`、`IntBuffer`、`LongBuffer`\
  \ 和 `ShortBuffer`。\n\n`StringBuffer` 类与这些缓冲区无关。\n\n在实践中，你最常用的是 `ByteBuffer` 和 `CharBuffer`。如\
  \ #ch01fig11 所示，缓冲区具有：\n\n*   一个从不变的 `capacity`（容量）\n*   用于读取或写入下一个值的 `position`（位置）\n\
  *   一个超出后读写无意义的 `limit`（限制）\n*   可选的，用于重复读写操作的 `mark`（标记）\n\n图 2.5：缓冲区\n\n这些值满足条件：\n\
  \n0 ≤ `mark` ≤ `position` ≤ `limit` ≤ `capacity`\n\n缓冲区的主要目的是“填充，然后消费”循环。开始时，位置为\
  \ 0，限制为容量。\n\n如果你想重新读取缓冲区，使用 `rewind` 或 `mark`/`reset`。\n\n要获取缓冲区，调用静态方法 `ByteBuffer.allocate`\
  \ 或 `ByteBuffer.wrap`。\n\n此循环使用缓冲区将数据从一个通道传输到另一个通道：\n\n```\nByteBuffer buffer =\
  \ ByteBuffer.allocate(BUFFER_SIZE);\nboolean doneReading = false;\nboolean doneWriting\
  \ = false;\nwhile (!(doneReading && doneWriting)) {\n    if (sourceChannel.read(buffer)\
  \ == -1) doneReading = true;\n    buffer.flip();\n    destinationChannel.write(buffer);\n\
  \    if (buffer.remaining() == 0) doneWriting = true;\n    buffer.compact();\n}\n\
  ```\n\n`java.nio.Buffer`1.4\n\n*   `Buffer flip()`\n\n    写入后准备读取缓冲区，将限制设置为位置并将位置设置为\
  \ 0；返回 `this`。\n\n*   `Buffer rewind()`\n\n    通过将位置设置为 0 并保持限制不变，准备重新读取缓冲区相同的值；返回\
  \ `this`。\n\n*   `Buffer clear()`\n\n    通过将位置设置为 0 并限制设置为容量来准备写入缓冲区；返回 `this`。\n\
  \n*   `Buffer mark()`\n\n    将缓冲区的标记设置为位置；返回 `this`。\n\n*   `Buffer reset()`\n\n\
  \    将缓冲区的位置设置为标记，从而允许标记部分再次被读取或写入；返回 `this`。\n\n*   `int remaining()`\n\n    返回剩余的可读或可写值的数量——即限制与位置之间的差。\n\
  \n`java.nio.ByteBuffer`1.4\n\n*   `Buffer compact()`\n\n    将任何未消费的字节复制到缓冲区头部，将位置设置为下一个字节，并将限制设置为容量；返回\
  \ `this`。\n\n`java.nio.ReadableByteChannel`1.4\n\n*   `int read(ByteBuffer dst)`\n\
  \n    用可用字节填充缓冲区的剩余部分，并返回传输字节数，如果通道到达末尾则返回 -1。\n\n`java.nio.WritableByteChannel`1.4\n\
  \n*   `int write(ByteBuffer src)`\n\n    尝试消耗缓冲区中的剩余字节，并返回传输字节数。\n\n### 2.5. 文件锁\n\
  \n当多个同时执行的程序需要修改同一个文件时，它们需要以某种方式通信，否则文件很容易损坏。文件锁可以解决这个问题。文件锁控制对文件或文件中字节范围的访问。]\n\
  \n\n\n\n假设你的应用程序保存了一个带有系统级偏好的文件。如果用户启动了应用程序的两个实例，可能会出现它们都想同时写入该文件的情况。在这种情况下，第一个实例应该锁定文件。当第二个实例发现文件被锁定时，它可以决定等待直到文件解锁，或者简单地跳过写入过程。\n\
  \n要锁定文件，请调用 `FileChannel` 类的 `lock` 或 `tryLock` 方法。\n\n```\nFileChannel channel\
  \ = FileChannel.open(path);\nFileLock lock = channel.lock();\n```\n\n或者\n\n```\n\
  FileLock lock = channel.tryLock();\n```\n\n第一次调用会阻塞，直到锁可用。第二次调用会立即返回，返回锁对象，或者在锁不可用时返回\
  \ `null`。文件将保持锁定状态，直到通道关闭或在锁上调用了 `release` 方法。\n\n你也可以通过以下调用锁定文件的部分区域：\n\n```\n\
  FileLock lock(long start, long size, boolean shared)\n```\n\n或者\n\n```\nFileLock\
  \ tryLock(long start, long size, boolean shared)\n```\n\n`shared` 标志为 `false` 时表示对文件进行读写锁。标记为\
  \ `true` 时表示*共享*锁，它允许多个进程从文件中读取，同时防止任何进程获取排斥锁。并不是所有的操作系统都支持共享锁。即使你只请求共享锁，也可能获得排斥锁。调用\
  \ `FileLock` 类的 `isShared` 方法可以确定你拥有哪种锁。\n\n如果你锁定了文件的尾部且文件随后增长到了锁定区域，则额外的区域不会被锁定。要锁定所有字节，请使用\
  \ `Long.MAX_VALUE` 作为大小。\n\n确保在完成后释放锁。一如既常，这最好通过 `try`-with-resources 语句来实现：\n\n\
  ```\ntry (FileLock _ = channel.lock()) {\n    access the locked file or segment\n\
  }\n```\n\n请记住，文件锁定依赖于系统。以下是一些需要注意的点：\n\n*   在某些系统（包括 Linux）上，文件锁定仅仅是*建议性*的。如果应用程序未能获取锁，它仍然可以写入另一个应用程序当前锁定的文件。\n\
  *   在某些系统中，你不能同时锁定文件并将其映射到内存中。\n*   文件锁对于 Java 虚拟机是全局的。并发线程不能分别获取同一个文件的锁。如果另一个线程已持有相同文件或重叠范围的锁，`lock`\
  \ 和 `tryLock` 方法将抛出 `OverlappingFileLockException`。\n*   在某些系统上，关闭通道会释放底层文件上的所有锁。因此，你应该避免在同一个锁定的文件上使用多个通道。\n\
  *   在网络文件系统上锁定文件高度取决于系统，可能应该避免。\n*   文件锁定仅保证 Java 程序。用其他语言编写的程序可能使用不同且不兼容的锁定机制。\n\
  \nListing 2.4 中的程序展示了文件锁定的简单示例。多个用户想要在一个文件中注册密码。程序读取文件，添加用户名和哈希密码，然后写入生成的文件。这种更新是原子性的至关重要。否则，如果两个用户并发更新，密码文件可能会损坏。\n\
  \n访问 第 9 章 获取更多关于密码哈希的信息。这与文件锁定无关，但我不想展示一个保存未哈希密码的示例程序。\n\n该程序展示了文件锁定 API 的局限性。它依赖于\
  \ `FileChannel` API，而该 API 是基于字节缓冲的读写。程序必须将这些字节缓冲区转换为读取器和写入器。\n\n替代方案是使用 `RandomAccessFile`，其\
  \ `getChannel` 方法产生一个指向文件的通道。但同样不方便。你需要将文件读取到字节数组，并准备一个字节数组来写入修改后的文件。\n\nListing\
  \ 2.4 v2ch02/fileLock/FileLockDemo.java\n\n```\npackage v2ch02.fileLock;\n\nimport\
  \ module java.base;\n\n/**\n * 此程序将用户名和密码写入 passwords.properties 文件。文件被\n * 原子地更新。在\
  \ Linux 下，尝试 \n * for f in $(seq 1 100) ; do (java fileLock.FileLockDemo user$f\
  \ secret$f &) ; done \n * 当所有 Java 进程完成后，passwords.properties\n * 为每个进程都包含一个条目。\n\
  \ */\n\npublic class FileLockDemo {\n    void main(String[] args) throws Exception\
  \ {\n        Path path = Path.of(\"password.properties\");\n        FileChannel\
  \ channel = FileChannel.open(path, StandardOpenOption.READ,\n                StandardOpenOption.WRITE,\
  \ StandardOpenOption.CREATE);\n        try (FileLock _ = channel.lock()) {\n   \
  \         // 从文件读取读取字节\n            ByteBuffer readBuffer = ByteBuffer.allocate((int)\
  \ channel.size());\n            channel.read(readBuffer);\n\n            // 从字节中读取属性\n\
  \            Reader in = new StringReader(new String(readBuffer.array()));\n   \
  \         Properties props = new Properties();\n            props.load(in);\n\n\
  \            // 从参数或用户输入获取用户名、密码\n            String username;\n            char[]\
  \ password;\n            if (args.length >= 2) {\n                username = args[0];\n\
  \                password = args[1].toCharArray();\n            }\n            else\
  \ {\n                Console console = System.console();\n                username\
  \ = console.readLine(\"User name: \");\n                password = console.readPassword(\"\
  Password: \");\n            }\n\n            // 哈希密码\n            final int ITERATIONS\
  \ = 10_000;\n            final int SALT_BYTES = 16;\n            final int HASH_BYTES\
  \ = 32;\n            SecureRandom random = new SecureRandom();\n            byte[]\
  \ salt = new byte[SALT_BYTES];\n            random.nextBytes(salt);\n\n        \
  \    var spec = new PBEKeySpec(password, salt, ITERATIONS, 8 * HASH_BYTES);\n  \
  \          SecretKeyFactory skf = SecretKeyFactory.getInstance(\"PBKDF2Hmac256\"\
  );\n            byte[] hash = skf.generateSecret(spec).getEncoded();\n         \
  \   Base64.Encoder encoder = Base64.getEncoder();\n\n            // 将用户名和哈希密码放入属性\n\
  \            props.put(username, ITERATIONS + \"|\" + encoder.encodeToString(salt)\
  \ + \"|\"\n                    + encoder.encodeToString(hash));\n\n            //\
  \ 将属性写入字节\n            StringWriter out = new StringWriter();\n            props.store(out,\
  \ null);\n            byte[] outBytes = out.toString().getBytes();\n\n         \
  \   // 将字节写入文件\n            channel.truncate(0);\n            ByteBuffer writeBuffer\
  \ = ByteBuffer.wrap(outBytes);\n            channel.write(writeBuffer);\n      \
  \  }\n    }\n}\n```\n\n`java.nio.channels.FileChannel`1.4\n\n*   `lock()`    获取整个文件的排斥锁。此方法会阻塞直到锁被获取。\n\
  *   `tryLock()`  获取整个文件的排斥锁，或者在无法获取锁时返回 `null`。\n*   `lock(long position, long size,\
  \ boolean shared)`\n*   `tryLock(long position, long size, boolean shared)` 获取文件区域的锁。第一个方法阻塞直到锁被获取，第二个方法在无法获取锁时返回\
  \ `null`。参数 `shared` 为 `true` 表示共享锁，`false` 表示排斥锁。\n*   `truncate(long size)` 如果文件大于给定大小，则将其截断为该大小。\n\
  \n`java.nio.channels.FileLock`1.4\n\n*   `close()` 释放此锁。\n\n`java.io.RandomAccessFile`1.0\n\
  \n*   `getChannel()` 返回该随机访问文件的通道。\n\n\n\n\n\n在 Section 2.1.7 和 Section 2.2.2 中，你已经了解了如何以文本或二进制格式存储\
  \ `Employee` 对象。然而，你在面向对象的程序中创建的对象极少全是同一种类型。例如，你可能有一个名为 `staff` 的数组，它在名义上是一个 `Employee`\
  \ 记录数组，但其中包含的对象实际上是如 `Manager` 等子类的实例。\n\n我们完全可以设计出一种允许存储此类多态集合的数据格式——但幸运的是，我们不必这样做。Java\
  \ 语言支持一种名为`对象序列化`（object serialization）的非常通用机制，它使得可以将任何对象写入输出流，并在稍后重新读取。（你将在接后的章节中看到“序列化”一词的来源。）\n\
  \n### 2.6.1 保存和加载可序列化对象\n\n要保存对象数据，首先需要打开一个 `ObjectOutputStream` 对象：\n\n```\nvar\
  \ out = new ObjectOutputStream(new FileOutputStream(\"employee.dat\"));\n```\n\n\
  现在，要保存一个对象，只需像下面的代码片段那样使用 `ObjectOutputStream` 类的 `writeObject` 方法：\n\n```\nvar\
  \ harry = new Employee(\"Harry Hacker\", 50000, 1989, 10, 1);\nvar boss = new Manager(\"\
  Carl Cracker\", 80000, 1987, 12, 15);\nout.writeObject(harry);\nout.writeObject(boss);\n\
  ```\n\n要读回对象，首先获取一个 `ObjectInputStream` 对象：\n\n```\nvar in = new ObjectInputStream(new\
  \ FileInputStream(\"employee.dat\"));\n```\n\n然后，使用 `readObject` 方法按照写入的顺序检索对象：\n\
  \n```\nvar e1 = (Employee) in.readObject();\nvar e2 = (Employee) in.readObject();\n\
  ```\n\n然而，对于任何想要保存到输出流并从对象输入流恢复的类，你都需要进行一个更改。该类必须实现 `Serializable` 接口：\n\n```\n\
  class Employee implements Serializable { . . . }\n```\n\n`Serializable` 接口没有方法，因此你不需要以任何方式更改你的类。在这方面，它与我们在第一卷第\
  \ 6 章中讨论的 `Cloneable` 接口相似。然而，要使类可克隆，你仍然需要覆盖 `Object` 类的 `clone` 方法。而要使类可序列化，你不需要做其他操作。\n\
  \n你只能通过 `writeObject/readObject` 方法读写对象。对于基本类型值，请使用 `writeInt/readInt` 或 `writeDouble/readDouble`\
  \ 等方法。（对象输入/输出流类实现了 `DataInput/DataOutput` 接口。）\n\n在底层，`ObjectOutputStream` 会查看对象的所有字段并保存其内容。例如，在写入\
  \ `Employee` 对象时，姓名、日期和薪水字段会被写入输出流。\n\n然而，有一个重要的情况需要考虑：当一个对象作为多个对象状态的一部分被共享时会发生什么？\n\
  \n为了说明这个问题，让我们对 `Manager` 类进行微调。让我们怀旧地假设，每个经理都有一个秘书：\n\n```\nclass Manager extends\
  \ Employee {\n    private Employee secretary;\n    . . .\n}\n```\n\n每个 `Manager`\
  \ 对象现在包含一个指向描述秘书的 `Employee` 引用。当然，两个经理可以共享同一个秘书，正如 #ch01fig06 和下面的代码所示：\n\n```\n\
  var harry = new Employee(\"Harry Hacker\", . . .);\nvar carl = new Manager(\"Carl\
  \ Cracker\", . . .);\ncarl.setSecretary(harry);\nvar tony = new Manager(\"Tony Tester\"\
  , . . .);\ntony.setSecretary(harry);\n```\n\n.图 2.6：两个经理可以共享同一个员工。\n\n保存这样一个对象网络是一个挑战。当然，我们无法保存和恢复秘书对象的内存地址。当对象被重新加载时，它占据的内存地址可能与原始完全不同。\n\
  \n相反，每个对象在保存时都带有一个`序列号`——这就是该机制被称为“对象序列化”的原因。以下是算法：\n\n1. 为遇到的每个对象引用关联一个序列号（如 #ch01fig07\
  \ 所示）。\n   .图 2.7：对象序列化的示例\n\n2. 当第一次遇到对象引用时，将对象数据写入输出流。\n\n3. 如果之前保存过，只需写入“与之前保存的序列号\
  \ `x` 的对象相同”。\n\n在读回对象时，过程是反的。\n\n1. 当对象输入流中第一次指定某个对象时，构造它，用流数据对其进行初始化，并记住序列号与对象引用之间的关联。\n\
  \n2. 当遇到“与之前保存的序列号 `x` 的对象相同”标签时，检索该序列号的对象引用。\n\n在本章中，我们将使用序列化将对象集合保存到磁盘文件，并完全按照存储的方式将其取回。另一个非常重要的应用是跨网络传输对象集合。\n\
  \n如果一个可序列化类的父类不是可序列化的，则它必须有一个可访问的无参构造函数。考虑这个例子：\n\n```\nclass Person // 不序列化\nclass\
  \ Employee extends Person implements Serializable\n```\n\n当 `Employee` 对象被反序列化时，其实例字段将从对象输入流读取，但\
  \ `Person` 实例字段将由 `Person` 构造函数设置。Listing 2.5 是一个保存并重新加载 `Employee` 和 `Manager`\
  \ 对象网络的程序（其中某些对象共享同一个员工作为秘书）。注意，在重新加载后，秘书对象是唯一的——当 `newStaff[1]` 获得薪时，这一变化会反映在经理的\
  \ `secretary` 字段中。\n\n```\npackage v202.serial;\n\nimport module.base;\nimport java.*;\n\
  \nclass ObjectStreamDemo {\n    void main() throws Exception {\n        var harry\
  \ = new Employee(\"Harry Hacker\", 50000, 1989, 10, 1);\n        var carl = new\
  \ Manager(\"Carl Cracker\", 80000, 1987, 12, 15);\n        carl.setSecretary(harry);\n\
  \        var tony = new Manager(\"Tony Tester\", 40000, 1990, 3, 15);\n        tony.setSecretary(harry);\n\
  \n        var staff = new Employee[3];\n\n        staff[0] = carl;\n        staff[1]\
  \ = harry;\n        staff[2] = tony;\n\n        // 将所有员工记录保存文件 employee.ser\n  \
  \      try (var out = new ObjectOutputStream(new FileOutputStream(\"employee.ser\"\
  ))) {\n            out.writeObject(staff);\n        }\n\n        try (var in = new\
  \ ObjectInputStream(new FileInputStream(\"employee.ser\"))) {\n            // 将所有记录读入新数组\n\
  \n            var newStaff = (Employee[]) in.readObject();\n\n            // 提高秘书薪水\n\
  \            newStaff[1].raiseSalary(10);\n\n            // 打印新读取的员工记录\n       \
  \     for (Employee e : newStaff)\n                System.out.println(e);\n    \
  \    }\n    }\n}\n```\nListing 2.5 v202/serial/ObjectStreamDemo.java\n\n\n\n\n\n\
  ### `Object readObject()`\n\n从 `ObjectInputStream` 读取一个对象。特别是，此方法会读回对象的类、类的签名以及该类及其所有父类的非传输（nontransient）和非静态（nonstatic）字段的值。它会执行反序列化，以便恢复多个对象引用。\n\
  \n### 2.6.2. 理解对象序列化文件格式\n\n对象序列化将对象数据以特定的文件格式保存。当然，你可以直接使用 `writeObject`/`readObject`\
  \ 方法，而无需知道表示文件中对象的确切字节序列。尽管如此，我们发现研究数据格式对于深入了解对象序列化过程非常有帮助。由于细节具有某些技术性，如果你对实现不感兴趣，可以跳过本节。\n\
  \n每个文件都以两个字节的“魔数数字”开头：\n\n```\nAC ED\n```\n\n随后是对象序列化格式的版本号，当前为：\n\n```\n00 05\n\
  ```\n\n（在本节中，我们始终使用十六进制数表示字节。）然后，它包含按照保存顺序排列的一系列对象。\n\nString 对象的保存方式为：\n\n*   `74`\n\
  *   两个字节长度\n*   “修改过的 UTF-8”格式的字符\n\n例如，字符串 “Harry”被保存为：\n\n```\n74 00 05 Harry\n\
  ```\n\n当保存一个对象时，该对象的类也必须保存。类描述符具有以下格式：\n\n*   `72`\n*   2 字节类名长度\n*   类名\n*   8\
  \ 字节指纹（fingerprint）\n*   1 字节标记\n*   2 字节实例字段描述符计数\n*   实例字段描述符\n*   `78`（结束标记）\n\
  *   父类描述符（若无则为 `70`）\n\n指纹是通过对类、父类、接口、字段类型和方法签名的描述进行规范化排序，然后对该数据应用安全哈希算法 1 1 (`SHA-1`)\
  \ 得到的。\n\n`SHA-1` 为数据块提供一个“指纹”。无论原始数据的大小如何，该指纹始终是一个 20 字节的数据包。它是通过对数据进行一系列巧妙的位操作创建的，这使得信息一旦发生任何更改，指纹就极有可能发生变化。序列化机制仅使用\
  \ `SHA-1` 代码的前八个字节作为类指纹。如果实例字段或方法发生变化，类指纹极有可能也会发生变化。\n\n读取对象时，会将其指纹与类的当前指纹进行比较。如果它们不匹配，意味着类定义在对象写入后发生了变化，此时会生成一个异常。当然，在实践中，类确实会演进，程序可能需要读取旧版本的对象。我们将在第\
  \ 2.6.7 节中讨论这一点。\n\n标记字节由 `java.io.ObjectStreamConstants` 中定义的位掩码组成，如表 2.7。\n\n\
  表 2.7：位掩码\n\n| 名称 | 值 | 描述 |\n| --- | --- | --- |\n| `SC_WRITE_METHOD` | 1 | 类定义了\
  \ `writeObject` 方法。 |\n| `SC_SERIALIZABLE` | 2 | 类实现了 `Serializable`。 |\n| `SC_EXTERNALIZABLE`\
  \ | 4 | 类实现了 `Externalizable`。 |\n| `SC_BLOCK_DATA` | 8 | 以“块数据”写入的不透明数据（自 JDK 1.2\
  \ 起默认）。 |\n| `SC_ENUM` | 16 | 类是一个枚举。 |\n\n我们编写的类实现了 `Serializable` 接口，并将其标记值为 `02`。可序列化的\
