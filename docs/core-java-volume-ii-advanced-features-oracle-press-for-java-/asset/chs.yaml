  \ `pearson.com/en-us/report-bias.html`。\n\n作者网站不由 Pearson 所有或管理。\n\n访问我们的网站：`informit.com`\n\
  \n美国国会图书馆控制号：2025945104\n\n\n新泽西州霍肯\n\n\n\n\n\n\n\n\n\n# 前言\n\n## 致读者\n\n你手中的这本书是《核心\
  \ Java》第十三版的第二卷，已针对 Java 25 进行了全面更新。第一卷涵盖了语言的核心特性；本卷则处理了程序员在专业软件开发中需要了解的高级主题。因此，与第一卷以及本书之前的版本一样，我们的目标仍然是那些希望在真实项目中应用\
  \ Java 技术的程序员。\n\n随着 Java 类库的爆炸式增长，要在一卷书中涵盖资深程序员需要了解的所有 Java 特性是不可能的。因此，本书被分成了两卷。\n\
  \n第一卷集中在 Java 语言的基础概念上：\n\n*   面向对象编程\n*   反射和代理\n*   接口和内部类\n*   异常处理\n*   泛型编程\n\
  *   集合框架\n*   并发\n*   注解\n*   Java 平台系统\n\n这第二卷则进一步探讨了最重要的库。在之前的版本中，用户界面编程被认为是基础，但现在是时候将其移动第二卷了。本卷详细讨论了以下主题：\n\
  \n*   Stream API\n*   文件处理和正则表达式\n*   数据库\n*   XML 处理\n*   脚本和编译 API\n*   国际化\n\
  *   网络编程\n*   图形界面设计\n*   图形编程\n*   本地函数和内存\n\n正如任何书籍一样，错误和不准确不可避免的。如果你在书中发现任何错误，我们非常希望听到它们。当然，我们希望只听到一次。因此，我们建立了一个网站，包含错误报告页面、常见问题解答、错误修复和解决方案。在错误报告页面的结尾（为了鼓励你阅读之前的报告）放置了一个用于报告错误或问题并对未来版本提出的表格。\n\
  \n## 本书简介\n\n书中的章节大部分是相互独立的。你可以深入你最感兴趣的主题，并按任何顺序阅读章节。\n\n在**第一章**中，你将学习 Java 流库，该库通过指定你想要而不是详细描述如何获取结果，为数据处理带来了现代感。这使得流库能够专注于最优的评估策略，这对于多核心并行执行计算特别有益。\n\
  \n**第二章**的主题是输入输出处理（I/O）。在 Java 中，所有的输入输出都通过输入输出流来处理。这些流（不要与第一章中的流混淆）让你能够以统一的方式处理各种数据源，例如文件、网络连接或内存块。我们包含了对\
  \ reader 和 writer 类的详细介绍，它们易于处理 Unicode。我们展示了在使用对象序列化机制时底层发生了什么，这使得保存和加载对象变得简单快捷。然后我们转向正则表达式以及文件和路径的操作。在本章中，你会发现近期\
  \ Java 版本的改进。\n\n**第三章**涵盖 XML。我们展示了如何解析 XML 文件、如何生成 XML 以及如何使用 XSL 转换。作为一个实用的示例，我们展示了如何在\
  \ XML 中指定 Swing 表单的布局。我们还讨论了 XPath API，它让在 XML 草堆中寻找针变得容易得多。\n\n\n\n\n# 第 4 章涵盖了网络\
  \ API。Java 让进行复杂的网络编程变得异常简单。我们将向你展示如何与服务器建立网络连接、如何实现自己的服务器，以及如何建立 HTTP 连接。本章还包含了对新的\
  \ HTTP 客户端介绍。\n\n# 第 5 章涵盖了数据库编程。重点是 `JDBC`，即 Java 数据库连接 API，它允许 Java 程序连接到关系型数据库。我们将向你展示如何使用\
  \ `JDBC` API 的核心子集编写实用的程序来处理现实中的数据库任务。（要完整介绍 `JDBC` API 需要一本几乎和这本书一样大的书。）\n\nJava\
  \ 之前在处理日期和时间的库方面尝试过两次。第三次尝试是 Java 8 中的亮点。在第 6 章中，你将学习如何使用新的日期和时间库来处理日历和时区的复杂性。\n\
  \n# 第 7 章讨论了一个我们认为重要性只会不断增加的特性：国际化。Java 编程语言是少数从设计之初就处理 Unicode 的语言之一，但 Java 平台的国际化支持要深入得多。因此，你可以使\
  \ Java 应用程序国际化，使其不仅能够跨平台，还能跨越国界。例如，我们将向你展示如何编写一个可以使用英语、德语或中文的退休计算器。\n\n# 第 8 章讨论了脚本和编译器\
  \ API，这些 API 允许你的程序调用 JavaScript 或 Groovy 等脚本语言的代码，并编译 Java 代码。\n\n# 第 9 章涉及了 Java\
  \ 安全模型、用户身份验证以及 Java 安全库中的加密函数。你将学习一些重要特性，如消息和代码签名、授权与认证以及加密。我们以使用 `AES` 和 `RSA`\
  \ 加密算法的示例作为结束。\n\n# 第 10 章介绍了 GUI 编程。我将展示如何创建窗口、如何在窗口上绘制、如何用几何形状绘图、如何使用多种字体格式化文本以及如何显示图像。接下来，你将看到如何编写响应事件（如鼠标点击或按键按下）的代码。\n\
  \n# 第 11 章详细讨论了 `Swing` GUI 工具包。`Swing` 工具包允许你构建跨平台的图形用户界面。你将学习各种类型的按钮、文本组件、边框、滑块、列表框、菜单和对话框。\n\
  \n# 第 12 章包含了高级的 Swing 内容，特别是重要但复杂的树和表格组件。我们还涵盖了 `Java 2D` API，你可以用它创建逼逼的绘画和特效。当然，现在没有多少程序员需要编写\
  \ `Swing` 用户界面了，因此我们特别关注对在服务器上生成的图像有用的特性。\n\n# 第 13 章涉及外部函数（foreign functions），它允许你调用用其他编程语言编写的代码。当你与\
  \ Java 不支持的设备或服务交互时，有时需要转向目标平台的操作系统 API。或者，你可能想调用经过实践检验的机器学习或数据分析库。\n\n一如既往，所有章节都已针对最新版本的\
  \ Java 进行了完全重写。过时的内容已被删除，并详细涵盖了直到 Java 25 的新 API。\n\n## 惯例\n\n与许多计算机书籍一样，我使用`等宽字体`来表示计算机代码。\n\
  \n注释带有像这样的“note”图标进行标记：笔记。\n\n提示带有像这样的“tip”图标进行标记：小提示。\n\n当前方有危险时，我会用“caution”图标警告你。\n\
  \n计划未来成为语言或 API 部分的预览特性将用此图标标记。\n\nJava 自带了一个庞大的编程库，或应用程序编程接口（API）。当你第一次使用 API 调用时，我会在章节末尾添加简短的摘要描述。这些描述稍微非正式，但希望比官方在线\
  \ API 文档中的描述更有信息量。接口的名称使用斜体，与官方文档一样。类、接口或方法名称后的数字是引入该特性的 JDK 版本，如下例所示：\n\n`java.lang.IO`\
  \ 25\n\n*   `println(Object obj)`\n\n    将对象转换为字符串并打印到控制台上，随后是一个换行符。\n\n本书配套代码中的源代码作为示例列出，例如\n\
  \nListing NotHelloWorld.java\n\n``````\nvoid main() {\n    System.out.println(\"\
  We will not use 'Hello, World!'\");\n}\n```\n\n你可以从 `https://horstmann.com/corejava`\
  \ 下载配套代码。\n\n# 谢谢\n\n写书总是一项巨大的工程，重写似乎并没有那么容易，尤其是考虑到 Java 技术变化如此之快。要让一本书变成现实需要许多人的投入，我非常荣幸能感谢整个\
  \ `Core Java` 团队的贡献。\n\n感谢我的编辑 Harry Misthos 以及来自 Pearson 的 Julie Nahil，他们引导了本书的制作过程。我使用\
  \ HTML 和 CSS 编写了这本书，Prince (`https://princexml.com`) 将其转换为 PDF——这是一个我非常推荐的工作流。\n\
  \n感谢早期版本的许多读者，他们报告了尴尬的错误并为改进提出了许多周全的建议。我特别感谢优秀的审稿团队，他们以惊人的细节眼光审阅了手稿，使我免于犯更多尴尬的错误。\n\
