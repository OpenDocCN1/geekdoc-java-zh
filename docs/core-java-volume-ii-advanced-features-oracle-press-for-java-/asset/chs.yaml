  \ DDL 语句返回 `0`。\n\n### 5.5.2. 读取和写入 LOB\n\n除了数字、字符串和日期，许多数据库还可以存储大对象（LOB），例如图像或其他数据。在\
  \ SQL 中，二进制大对象被称为 BLOB，字符大对象被称为 CLOB。\n\n这取决于应用程序是将大对象存储在数据库中还是文件中。为了读取 LOB，执行 `SELECT`\
  \ 语句并在 `ResultSet` 上调用 `getBlob` 或 `getClob` 方法。这将得到一个 `Blob` 或 `Clob` 类型的对象。例如，如果你有一个封\
  \ 表，可以这样获取图像：\n\n```java\nPreparedStatement pstat\n    = conn.prepareStatement(\"\
  SELECT Cover FROM Bookvers WHERE ISBN?\");\n. .\npstat.set(1, isbn);\ntry (ResultSet\
  \ result = pstat.executeQuery()) {\n    if (result.next()) {\n       Blob coverBlob\
  \ = result.getBlob(1);\n       Image coverImage = ImageIO.read(coverBlob.getBinaryStream());\n\
  \    }\n}\n```\n\n同样，如果你检索到一个 `Clob` 对象，可以通过调用 `getSubString` 或 `getCharacterStream`\
  \ 方法获取字符数据。要把 LOB 放入数据库，可以在 `Connection` 对象上调用 `createBlob` 或 `createClob`，获取 LOB\
  \ 的输出流或写入器，写入数据并将对象存储在数据库中。例如，这里是存储图像的方法：\n\n```java\nBlob coverBlob = connection.createBlob();\n\
  int offset = 0;\nOutputStream out = coverBlob.setBinaryStream(offset);\nImageIO.write(coverImage,\
  \ \"PNG\", out);\nPreparedStatement pstat = conn.prepareStatement(\"INSERT INTO\
  \ Cover VALUES (?, ?)\");\npstat.set(1, isbn);\npstat.set(2, coverBlob);\npstat.executeUpdate();\n\
  ```\n\n`java.sql.ResultSet1.1`\n\n* `Blob getBlob(int columnIndex)`\n\n* `Blob getBlob(String\
