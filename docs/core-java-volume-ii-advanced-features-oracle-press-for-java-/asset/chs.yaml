  \n```\nnew Variable(double.class, \"salary\", Double.valueOf(salary));\n```\n\n\
  如果变量的类型是一个类，则该变量拥有字段。使用反射，我们枚举所有字段并将它们收集到 `ArrayList` 中。由于 `Class` 类的 `getFields`\
