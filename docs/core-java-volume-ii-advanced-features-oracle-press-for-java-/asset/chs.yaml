  \ `JTree.getSelectionPaths`。\n\n### 12.4.6. 自定义树模型\n\n在最后一个示例中，我们实现了一个检查对象内容的程序，就像调试器所做的那样（参见图\
  \ 12.30）。\n\n![图](img/fig06-34.jpg)图 12.30: 一个对象检查树\n\n\n\n\n\n在继续之前，请编译并运行示例程序。每个节点都对应一个实例字段。如果该字段是一个对象，请展开它以查看其实例字段。程序将检查帧窗口的内容。如果你尝试查看几个实例字段，你应该能找到一些熟悉的类。你也会对\
