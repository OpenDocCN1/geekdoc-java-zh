  \n也许这些信息可以帮助你在多个选项之间做出决定——或者你也可以直接向程序用户展示读取器列表，让他们他们自己选择。目前，我们假设第一个列出的读取器足够使用了。\n\
  \n在 Listing 12.20 的示例程序中，我们想要找到所有可用读取器的文件后缀名，以便将它们用于文件过滤器。使用静态方法 `ImageIO.getReaderFileSuffixes`\
  \ 来实现此目的：\n\n```\nString[] extensions = ImageIO.getWriterFileSuffixes();\nchooser.setFileFilter(new\
  \ FileNameExtensionFilter(\"Image files\", extensions));\n```\n\n对于保存文件，我们需要付出更多努力。我们希望向用户展示包含所有支持图像类型的菜单。遗憾的是，`ImageIO`\
  \ 类的 `getWriterFormatNames` 返回了一个相当奇怪的列表，其中包含冗余名称，例如\n\n```\njpg, BMP, bmp, JPG,\
