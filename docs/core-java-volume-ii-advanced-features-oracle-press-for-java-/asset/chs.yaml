  \ `setPaint` 方法允许你选择一种颜色用于图形上下文上后续所有的绘制操作。例如：\n\n```\ng2.setPaint(Color.RED);\n\
  g2.drawString(\"Warning!\", 100, 100);\n```\n\n(注：原文中后续存在大量重复段落，已按要求去重，仅保留核心内容)\n\
  \n\n\n\n这些名称始终映射到客户端机器上实际存在的某些字体。例如，在 Windows 系统上，`SansSerif` 被映射到 Arial。\n\n此外，Oracle\
  \ JDK 始终包含三个名为“Lucida Sans”、“Lucida Bright”和“Lucida Sans Typewriter”的字体族。\n\n要使用某种字体绘制字符，你必须先创建一个\
  \ `Font` 类的对象。指定字体名称、字体样式和字号。这里有一个如何构造 `Font` 对象的示例：\n\n```\nvar sansbold14 = new\
  \ Font(\"SansSerif\", Font.BOLD, 14);\n```\n\n第三个参数是字号。磅（Points）在排版中通常用作指示字体的大小。每英寸有\
  \ 72 磅。\n\n你可以在 `Font` 构造函数中使用逻辑字体名称来代替字体名称。通过将第二个 `Font` 构造函数参数设置为以下值之一，可以指定样式（普通、`bold`、`italic`\
  \ 或 `bold italic`）：\n\n```\nFont.PLAIN\nFont.BOLD\nFont.ITALIC\nFont.BOLD + Font.ITALIC\n\
  ```\n\n以下代码使用系统中的标准无衬线字体，以 14 磅粗体显示字符串“Hello, World!”：\n\n```\nvar sansbold14 =\
  \ new Font(\"SansSerif\", Font.BOLD, 14);\ng2.setFont(sansbold14);\nvar message\
  \ = \"Hello, World!\";\ng2.drawString(message, 75, 100);\n```\n\n接下来，让我们让字符串在它的组件中*居中*，而不是绘制在任意位置。我们需要知道字符串在像素中的宽度和高度。这些维度取决于三个因素：\n\
  \n*   所使用的字体（在本例中为无衬线字体、粗体、14 磅）；\n*   字符串（在本例中为“Hello, World!”）；以及\n*   绘制字体的设备（在本例中为用户的屏幕）。\n\
  \n要获取表示屏幕设备字体特性的对象，调用 `Graphics2D` 类的 `getFontRenderContext` 方法。它返回一个 `FontRenderContext`\
  \ 类的对象。只需将该对象传递给 `Font` 类的 `getStringBounds` 方法即可：\n\n```\nFontRenderContext context\
  \ = g2.getFontRenderContext();\nRectangle2D bounds = sansbold14.getStringBounds(message,\
  \ context);\n```\n\n`getStringBounds` 方法返回一个包含字符串的矩形。\n\n为了解释该矩形的尺寸，你应该了解一些基础排版术语（参见图\
  \ 10.9）。*基线*（baseline）是一条虚线，例如，字母‘e’等字符的底部所在的线。*升部*（ascent）是从基线到*升部字母*（ascender）顶部的距离，升部是‘b’或‘k’等字母或大写字母的上部。*下降部*（descent）是从基线到*下降字母*（descender）的距离，下降字母是‘p’或‘g’等字母的底部。\n\
  \n图 10.9：排版术语图\n\n*行距*（Leading）是上一行下降部与下一行升部之间的空间。（该术语源于排字工人用于分隔行行的铅条。）字体的*高度*（height）是相邻基线之间的距离，等于下降部\
  \ + 行距 + 升部。\n\n`getStringBounds` 方法返回的矩形的宽度是字符串的水平跨度。矩形的高度是升部、下降部和行距之和。矩形的原点位于字符串的基线上。矩形的顶部\
  \ *y* 坐标为负值。因此，你可以如下所示获取字符串宽度、高度和升部：\n\n```\ndouble stringWidth = bounds.getWidth();\n\
  double stringHeight = bounds.getHeight();\ndouble ascent = -bounds.getY();\n```\n\
  \n如果你需要知道下降部或行距，请使用 `Font` 类的 `getLineMetrics` 方法。该方法返回一个 `LineMetrics` 类的对象，它具有获取下降部和行距的方法：\n\
  \n```\nLineMetrics metrics = f.getLineMetrics(message, context);\nfloat descent\
  \ = metrics.getDescent();\nfloat leading = metrics.getLeading();\n```\n\n当你需要在 `paintComponent`\
  \ 方法之外计算布局尺寸时，无法从 `Graphics2D` 对象获取字体渲染上下文。相反，调用 `JComponent` 类的 `getFontMetrics`\
  \ 方法，然后调用 `getFontRenderContext`。\n\n```\nFontRenderContext context = getFontMetrics(f).getFontRenderContext();\n\
  ```\n\n为了证明定位是准确的，列表 10.4 中的示例程序将字符串在框架中居中，并绘制了基线和边界矩形。图 10.10 显示了屏幕显示。\n\n![Figure](img/fonttest.jpg)图\
  \ 10.10：绘制基线和字符串边界列表 10.4 v2ch10/font/FontDemo.java\n\n```\npackage v2ch10.font;\n\
