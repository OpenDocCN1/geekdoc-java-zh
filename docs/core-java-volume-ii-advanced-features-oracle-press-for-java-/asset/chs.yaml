  \ x1, double y1, double ctrlx1, double ctrly1, double ctrlx2, double ctrly2, double\
  \ x2, double y2)`\n    根据起始点、两个控制点和终点创建一个三次次曲线。\n\n### `java.awt.geom.GeneralPath`\
  \ 1.2\n\n*   `GeneralPath()`\n    创建一个空的通用路径。\n\n### `java.awt.geom.Path2D.Float`\
  \ 6\n\n*   `void moveTo(float x, float y)`\n    将 (`x`, `y`) 设置为*当前点*——即下线段的起始点。\n\
  *   `void lineTo(float x, float y)`\n*   `void quadTo(float ctrlx, float ctrly,\
  \ float x, float y)`\n*   `void curveTo(float ctrl1x, float ctrl1y, float ctrl2x,\
  \ float ctrl2y, float x, float y)`\n    从当前点到终点 (`x`, `y`) 画一条线、二次曲线或三次曲线，并将该终点设为当前点。\n\
  \n### `java.awt.geom.Path2D` 6\n\n*   `void append(Shape s, boolean connect)`\n\
  \    将给定形状的轮廓添加到通用路径中。如果 `connect` 为 `true`，则用直线将通用路径的当前点与添加形状的起始点连接。\n*   `void\
  \ closePath()`\n    通过从当前点到路径中的第一个点画一条直线来关闭路径。\n\n### 12.5.4. Areas\n\n在前节中，你已经看到如何通过构造由直线和曲线组成的通用路径来指定复杂形状。通过使用足够数量的直线和曲线，你可以绘制任何形状。例如，你在屏幕和打印输出上看到的字体字符形状是由直线和二次或三次曲线组成的。\n\
  \n有时，通过*区域*（如矩形、多边形或椭圆）组合来描述形状会更容易。Java 2D API 支持四种*构造性区域几何*操作，可以将两个区域合并为一个新区域。\n\
  \n*   `add`：合并后的区域包含位于第一个区域或第二个区域中的所有点。\n*   `subtract`：合并后的区域包含位于第一个区域但不在第二个区域中的所有点。\n\
  *   `intersect`：合并后的区域包含位于第一个区域和第二个区域中的所有点。\n*   `exclusiveOr`：合并后的区域包含位于第一个或第二个区域但不同于两者中的所有点。\n\
  \n图 12.40 显示了这些操作。\n\n.图 12.40: 构造性区域几何操作\n\n要构造一个复杂区域，从默认区域对象开始。\n\n```\nvar a\
  \ = new Area();\n```\n\n然后，将区域与任何形状合并。\n\n```\na.add(new Rectangle2D.Double(. .\
  \ .));\na.subtract(path);\n. . .\n```\n\n`Area` 类实现了 `Shape` 接口。你可以使用 `Graphics2D`\
  \ 类的 `draw` 方法描边区域的边界，或使用 `fill` 方法填充内部。\n\n### `java.awt.geom.Area`\n\n*   `void\
  \ add(Area other)`\n*   `void subtract(Area other)`\n*   `void intersect(Area other)`\n\
  *   `void exclusiveOr(Area other)`\n    执行此区域与另一个区域的构造性区域几何操作，并将此区域设置为结果。\n\n###\
  \ 12.5.5. Strokes\n\n`Graphics2D` 类的 `draw` 操作使用当前选择的*笔画（stroke）*绘制形状的边界。默认情况下，笔画是宽度为\
  \ 1 像素的实线。你可以通过调用 `setStroke` 方法并提供实现 `Stroke` 接口的类对象来选择不同的笔画。Java 2D API 只定义了这样一个类，称为\
  \ `BasicStroke`。在本节中，我们将查看 `BasicStroke` 类的功能。\n\n你可以构造任意厚度的笔画。例如，这里是绘制宽度为 10 像素的线条的方法：\n\
  \n```\ng2.draw lines that are 10 pixels wide\n```\n\n\n\n该程序与 Listing 12.15 中的程序类似。鼠标监听器记录了你在线段端点的点击，鼠标移动监听器则监控端点的拖拽。一组单选按钮用于让用户选择端点样式（cap\
  \ style）、连接样式（join style）以及实线或虚线。`StrokePanel`类的`paintComponent` 方法构造了一个 `GeneralPath`，它由两条线段组成，这两个线段连接了用户可以用鼠标移动的三个点。然后，它根据用户的选择构造一个\
  \ `BasicStroke`，最后绘制路径。\n\nListing 12.16 v2ch12/stroke/StrokeDemo.java\n\n```java\n\
