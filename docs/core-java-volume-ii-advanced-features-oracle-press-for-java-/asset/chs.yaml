  \ parent, Object message)`\n  显示确认对话框或内部确认对话框。（内部对话框完全渲染在其所有者的框架内.）返回用户选择的选项（`OK_OPTION`、`CANCEL_OPTION`、`YES_OPTION`、`NO_OPTION`\
  \ 之一），如果用户关闭了对话框，则返回 `CLOSED_OPTION`。父组件可以为 `null`。在对话框上显示的消息可以是字符串、图标、组件或它们的数组。`messageType`\
  \ 参数是 `ERROR_MESSAGE`、`INFORMATION_MESSAGE`、`WARNING_MESSAGE`、`QUESTION_MESSAGE`\
  \ 或 `PLAIN_MESSAGE` 之一，`optionType` 是 `DEFAULT_OPTION`、`YES_NO_OPTION`、`YES_NO_CANCEL_OPTION`\
  \ 或 `OK_CANCEL_OPTION` 之一。\n* `static int showOptionDialog(Component parent, Object\
  \ message, String title, int optionType, int messageType, Icon icon, Object[] options,\
  \ Object default)`\n* `static int showInternalOptionDialog(Component parent, Object\
  \ message, String title, int optionType, int messageType, Icon icon, Object[] options,\
  \ Object default)`\n  显示选项对话框或内部选项对话框。（内部对话框完全渲染在其所有者的框架内.）返回用户所选选项的索引，如果用户取消了对话框，则返回\
  \ `CLOSED_OPTION`。父组件可以为 `null`。在对话框上显示的消息可以是字符串、图标、组件或它们的数组。`messageType` 参数是 `ERROR_MESSAGE`、`INFORMATION_MESSAGE`、`WARNING_MESSAGE`、`QUESTION_MESSAGE`\
  \ 或 `PLAIN_MESSAGE` 之一，`optionType` 是 `DEFAULT_OPTION`、`YES_NO_OPTION`、`YES_NO_CANCEL_OPTION`\
  \ 或 `OK_CANCEL_OPTION` 之一。`options` 参数是字符串、图标或组件的数组。\n* `static Object showInputDialog(Component\
  \ parent, Object message, String title, int messageType, Icon icon, Object[] values,\
  \ Object default)`\n* `static String showInputDialog(Component parent, Object message,\
  \ String title, int messageType)`\n* `static String showInputDialog(Component parent,\
  \ Object message)`\n* `static String showInputDialog(Object message)`\n* `static\
  \ String showInputDialog(Component parent, Object message, Object default)`1.4\n\
  * `static String showInputDialog(Object message, Object default)`1.4\n* `static\
  \ Object showInternalInputDialog(Component parent, Object message, String title,\
  \ int messageType, Icon icon, Object[] values, Object default)`\n* `static String\
  \ showInternalInputDialog(Component parent, Object message, String title, int messageType)`\n\
  * `static String showInternalInputDialog(Component parent, Object message)`\n  显示输入对话框或内部输入对话框。（内部对话框完全渲染在其所有者的框架内.）返回用户输入的字符串，如果用户取消了对话框，则返回\
  \ `null`。父组件可以为 `null`。在对话框上显示的消息可以是字符串、图标、组件或它们的数组。`messageType` 参数是 `ERROR_MESSAGE`、`INFORMATION_MESSAGE`、`WARNING_MESSAGE`、`QUESTION_MESSAGE`\
  \ 或 `PLAIN_MESSAGE` 之一。\n\n\n\n\n在上一节中，你已经看到如何使用 `JOptionPane` 类来显示简单的对话框。在本节中，你将看到如何手动创建一个这样的对话框。\n\
  \n图 11.31 显示了一个典型的模态对话框——当用户点击“关于（About）”按钮时显示的程序信息框。\n\n![Figure](img/dialogtest.jpg)图\
  \ 11.31: “关于”对话框\n\n要实现一个对话框，你需要扩展 `JDialog` 类。这与为应用程序的主窗口扩展 `JFrame` 的过程本质相同。具体来说：\n\
  \n1. 在你的对话框的构造函数中，调用父类 `JDialog` 的构造函数。\n2. 添加对话框的图形界面组件。\n3. 添加事件处理器。\n4. 设置对话框的大小。\n\
  \n当你调用父类构造函数时，你需要提供*所有者帧*（owner frame）、对话框的标题以及*模态性*（modality）。\n\n所有者帧控制对话框的显示位置。你可以提供\
  \ `null` 作为所有者；这样，对话框将由一个隐藏的帧所有。\n\n模态性指定了对话框显示时应用程序的哪些其他窗口会被阻塞。非模态对话框（modeless\
  \ dialog）不会阻塞其他窗口。模态对话框会阻塞应用程序的所有窗口（对话框的子窗口除外）。对于用户可以随时访问的工具箱，可以使用非模态对话框。如果你想强制用户在继续之前提供必需的信息，可以使用模态对话框。\n\
  \n以下是对话框的代码：\n\n```java\npublic AboutDialog extends JDialog {\n    public AboutDialog(JFrame\
  \ owner) {\n        super(owner, \"About DialogTest\", true);\n        add(new JLabel(\n\
  \            \"<html><h1><i>Core Java</i></h1><hr>By Cay Horstmann</html>\"),\n\
  \            BorderLayout.CENTER);\n        var panel = new JPanel();\n        var\
  \ ok = new JButton(\"OK\");\n\n        ok.addActionListener(_ -> setVisible(false));\n\
  \        panel.add(ok);\n        add(panel, BorderLayout.SOUTH);\n        setSize(250,\
  \ 150);\n    }\n}\n```\n\n如你所见，构造函数添加了用户界面元素——在本例中，是标签和按钮。它为按钮添加了处理器，并设置了对话框的大小。\n\
  \n要显示对话框，请创建一个新的对话框对象并使其可见：\n\n```java\nvar dialog = new AboutDialog(this);\ndialog.setVisible(true);\n\
  ```\n\n实际上，在下方的示例代码中，我们只创建一次对话框，每当用户点击“关于”按钮时都可以复用它。\n\n```java\nif (dialog == null)\
  \ // 第一次\n    dialog = new AboutDialog(this);\ndialog.setVisible(true);\n```\n\n\
  当用户点击 OK 按钮时，对话框应该关闭。这在 OK 按钮的事件处理器中处理：\n\n```java\nok.addActionListener(_ -> setVisible(false));\n\
  ```\n\n当用户通过点击关闭（Close）按钮关闭对话框时，对话框也会被隐藏。就像 `JFrame` 一样，你可以通过 `setDefaultCloseOperation`\
  \ 方法来重写这种行为。\n\n代码列表 11.11 是测试程序的帧类（frame class）的代码。代码列表 11.12 显示了对话框类。\n\n代码列表\
  \ 11.11 v2ch11/dialog/DialogFrame.java\n\n```java\npackage v2ch11.dialog;\n\nimport\
  \ module java.desktop;\n\n/**\n * 一个带有菜单的帧，其 File->About 操作会显示对话框。\n */\npublic\
  \ class DialogFrame extends JFrame {\n    private static final int DEFAULT_WIDTH\
  \ = 300;\n    private static final int DEFAULT_HEIGHT = 200;\n    private AboutDialog\
  \ dialog;\n\n    public DialogFrame() {\n        setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\
  \n        // 构造 File 菜单\n\n        var menuBar = new JMenuBar();\n        setJMenuBar(menuBar);\n\
  \        var fileMenu = new JMenu(\"File\");\n        menuBar.add(fileMenu);\n\n\
  \        // 添加 About 和 Exit 菜单项\n\n        // About 项显示 About 对话框\n\n        var\
  \ aboutItem = new JMenuItem(\"About\");\n        aboutItem.addActionListener(_ ->\
  \ {\n            if (dialog == null) // 第一次\n                dialog = new AboutDialog(DialogFrame.this);\n\
  \            dialog.setVisible(true); // 弹出对话框\n        });\n        fileMenu.add(aboutItem);\n\
  \n        // Exit 项退出程序\n\n        var exitItem = new JMenuItem(\"Exit\");\n   \
  \     exitItem.addActionListener(_ -> System.exit(0));\n        fileMenu.add(exitItem);\n\
  \    }\n}\n```\n\n代码列表 11.12 v2ch11/dialog/AboutDialog.java\n\n```java\npackage\
  \ v2ch11.dialog;\n\nimport module java.desktop;\n\n/**\n * 示例模态对话框，显示消息并等待用户点击 OK\
  \ 按钮。\n */\npublic class AboutDialog extends JDialog {\n    public AboutDialog(JFrame\
  \ owner) {\n        super(owner, \"About DialogTest\", true);\n\n        // 添加 HTML\
  \ 标签到居中\n\n        add(new JLabel(\"<html><h1><i>Core Java</i></h1><hr>By Cay Horstmann</html>\"\
  ),\n                BorderLayout.CENTER);\n\n        // OK 按钮关闭对话框\n\n        var\
  \ ok = new JButton(\"OK\");\n        ok.addActionListener(_ -> setVisible(false));\n\
  \n        // 将按钮添加到南部边界\n\n        var panel = new JPanel();\n        panel.add(ok);\n\
  \        add(panel, BorderLayout.SOUTH);\n\n        pack();\n    }\n}\n```\n\n`javax.swing.JDialog`\n\
  `public JDialog(Frame parent, String title, boolean modal)` 构造一个对话框。在显式显示之前它是不可见的。\n\
  \n### 1.8.3 数据交换\n\n弹出对话框的最常见是从用户那里获取信息。你已经看到如何创建一个对话框对象。现在我们来看看如何传输数据。考虑图 11.32\
  \ 中的对话框，它可以用于获取用户名和密码以连接某些在线服务。\n\n图 11.32: 密码对话框\n\n（此处）你的对话框应该提供设置默认值的方法。例如，示例程序中的\
  \ `PasswordChooser` 类有一个方法 `setUser`，用于将默认值放入字段：\n\n```java\npublic void setUser(User\
  \ u) {\n    username.setText(u.getName());\n}\n```\n\n一旦你设置了默认值（如果需要），通过调用 `setVisible(true)`\
  \ 显示对话框。现在对话框已显示。\n\n用户随后填写信息并点击 OK 或取消按钮。这两个按钮的事件处理器都会调用 `setVisible(false)`，这终止了\
  \ `setVisible(true)` 的调用。或者，用户可能会关闭对话框。如果你没有为对话框安装窗口监听器，则应用默认窗口关闭操作：对话框变为不可见，这也终止了\
  \ `setVisible(true)` 的调用。\n\n重要的问题是 `setVisible(true)` 的调用会阻塞直到用户关闭对话框。这使得实现模态对话框变得简单。\n\
  \n从非模态对话框传输数据并不简单……（此处文本根据上下文截断）\n\n\n\n\n\n```java\npublic boolean showDialog(Frame\
  \ owner, String title) {\n    ok = false;\n\n    if (dialog == null || dialog.getOwner()\
  \ != owner) {\n        dialog = new JDialog(owner, true);\n        dialog.add(this);\n\
  \        dialog.pack();\n    }\n\n    dialog.setTitle(title);\n    dialog.setVisible(true);\n\
  \    return ok;\n}\n```\n\n注意，`owner` 等于 `null` 是安全的。\n\n你可以做得更好。有时候，所有者框架（owner\
  \ frame）并不直接可用。从任何 `parent` 组件计算它是很容易的，如下所示：\n\n```java\nFrame owner;\nif (parent\
  \ instanceof Frame)\n    owner = (Frame) parent;\nelse\n    owner = (Frame) SwingUtilities.getAncestorOfClass(Frame.class,\
  \ parent);\n```\n\n我们在示例程序中使用了这种增强功能。`JOptionPane` 类也使用了这种机制。\n\n许多对话框都有一个`默认按钮`（default\
  \ button），当用户按下触发键时（在大多数外观实现中为回车键 Enter），该按钮会被自动选中。默认按钮会被特别标记，通常有一个粗轮廓。\n\n在对话框的`根面板`（root\
  \ pane）中设置默认按钮：\n\n```java\ndialog.getRootPane().setDefaultButton(okButton);\n```\n\
  \n如果你遵循了在面板（panel）中布局对话框的建议，那么你必须小心，在将面板封装到对话框之后再设置默认按钮。面板对话框本身没有根面板。\n\n列表 11.13\
  \ 是程序的框架类，它说明了进出对话框的数据流。列表 11.14 显示了对话框类。\n\n列表 11.13 `v2ch11/dataExchange/DataExchangeFrame.java`\n\
  \n```java\npackage v2ch11.dataExchange;\n\nimport module java.desktop;\n\n/**\n\
  \ * 一个带有菜单的框架，其文件->连接（File->Connect）操作显示密码对话框。\n */\npublic class DataExchangeFrame\
  \ extends JFrame {\n    public static final int TEXT_ROWS = 20;\n    public static\
  \ final int TEXT_COLUMNS = 40;\n    private PasswordChooser dialog = null;\n   \
  \ private JTextArea textArea;\n\n    public DataExchangeFrame() {\n        // 构建一个文件菜单\n\
  \n        var mbar = new JMenuBar();\n        setJMenuBar(mbar);\n        var fileMenu\
  \ = new JMenu(\"File\");\n        mbar.add(fileMenu);\n\n        // 添加连接和退出菜单项\n\
  \n        var connectItem = new JMenuItem(\"Connect\");\n        connectItem.addActionListener(new\
  \ ConnectAction());\n        fileMenu.add(connectItem);\n\n        // 退出项退出程序\n\n\
  \        var exitItem = new JMenuItem(\"Exit\");\n        exitItem.addActionListener(_\
  \ -> System.exit(0));\n        fileMenu.add(exitItem);\n\n        textArea = new\
  \ JTextArea(TEXT_ROWS, TEXT_COLUMNS);\n        add(new JScrollPane(textArea), BorderLayout.CENTER);\n\
  \        pack();\n    }\n\n    /**\n     * 连接操作弹出密码对话框。\n     */\n    private class\
  \ ConnectAction implements ActionListener {\n        public void actionPerformed(ActionEvent\
  \ event) {\n            // 如果是第一次，构建对话框\n\n            if (dialog == null) dialog\
  \ = new PasswordChooser();\n\n            // 设置默认值\n            dialog.setUser(new\
  \ User(\"yourname\", null));\n\n            // 弹出对话框\n            if (dialog.showDialog(DataExchangeFrame.this,\
  \ \"Connect\")) {\n                // 如果接受，获取用户输入\n                User u = dialog.getUser();\n\
  \                textArea.append(\"user name = \" + u.getName() + \", password =\
  \ \"\n                        + (new String(u.getPassword())) + \"\\n\");\n    \
  \        }\n        }\n    }\n}\n```\n\n列表 11.14 `v2ch11/dataExchange/PasswordChooser.java`\n\
  \n```java\npackage v2ch11.dataExchange;\n\nimport module java.desktop;\n\n/**\n\
  \ * 一个显示在对话框内部的密码选择器。\n */\npublic class PasswordChooser extends JPanel {\n    private\
  \ JTextField username;\n    private JPasswordField password;\n    private JButton\
  \ okButton;\n    private boolean ok;\n    private JDialog dialog;\n\n    public\
  \ PasswordChooser() {\n        setLayout(new BorderLayout());\n\n        // 构建一个包含用户名和密码字段的面板\n\
  \n        var panel = new JPanel();\n        panel.setLayout(new GridLayout(2, 2));\n\
  \        panel.add(new JLabel(\"User name:\"));\n        panel.add(username = new\
  \ JTextField(\"\"));\n        panel.add(new JLabel(\"Password:\"));\n        panel.add(password\
  \ = new JPasswordField(\"\"));\n        add(panel, BorderLayout.CENTER);\n\n   \
  \     // 创建终止对话框的确定和取消按钮\n\n        okButton = new JButton(\"Ok\");\n        okButton.addActionListener(_\
  \ -> {\n            ok = true;\n            dialog.setVisible(false);\n        });\n\
  \n        var cancelButton = new JButton(\"Cancel\");\n        cancelButton.addActionListener(_\
  \ -> dialog.setVisible(false));\n\n        // 将按钮添加到南部边界\n\n        var buttonPanel\
  \ = new JPanel();\n        buttonPanel.add(okButton);\n        buttonPanel.add(cancelButton);\n\
  \        add(buttonPanel, BorderLayout.SOUTH);\n    }\n\n    /**\n     * 设置对话框默认值。\n\
  \     * @param u 默认用户信息\n     */\n    public void setUser(User u) {\n        username.setText(u.getName());\n\
  \    }\n\n    /**\n     * 获取对话框默认值。\n     * @return 代表对话框的 User 对象\n     */\n  \
  \  public getUser() {\n        return new User(username.getText(), password.getPassword());\n\
  \    }\n\n    /**\n     * 在对话框中显示面板。\n     * @param parent 组件或 null\n     * @param\
  \ title 对话框标题\n     */\n    public boolean showDialog(Component parent, String title)\
  \ {\n        ok = false;\n\n        // 定位所有者\n\n        Frame owner = (Frame) SwingUtilities.getAncestorOfClass(Frame.class,\
  \ parent);\n\n        // 如果是第一次或所有者发生了变化，新建对话框\n\n        if (dialog == null ||\
  \ dialog.getOwner() != owner) {\n            dialog = new JDialog(owner, true);\n\
  \            dialog.add(this);\n            dialog.pack();\n        }\n\n      \
  \  // 设置标题并显示对话框\n\n        dialog.setTitle(title);\n        dialog.setVisible(true);\n\
  \        return ok;\n    }\n}\n```\n\n`javax.swing.SwingUtilities`\n\n- `Container\
  \ getAncestorOfClass(Class c, Component comp)`\n    返回属于给定类或其子类的给定组件的最内父容器。\n\n\
  `javax.swing.JComponent`\n\n- `JRootPane getRootPane()`\n    获取封装此组件的根面板，如果此组件没有根面板，则返回\
  \ `null`。\n\n`javax.swing.JRootPane`\n\n- `void setDefaultButton(JButton button)`\n\
  \    设置此根面板的默认按钮。要禁用默认按钮，请向此方法传递 `null` 参数。\n\n`javax.swing.JButton`\n\n- `boolean\
  \ isDefaultButton()`\n    如果此按钮是根面板的默认按钮，则返回 `true`。\n\n### 11.8.4 文件对话框\n\n在应用程序中，你通常希望能够打开和保存文件。显示文件和目录并允许用户浏览文件系统的对话框很难编写，你绝对不想重复造轮子。幸运的是，Swing\
  \ 提供了一个 `JFileChooser` 类，允许你显示与大多数原生应用程序类似的文件对话框。`JFileChooser` 对话框始终是模态的。注意 `JFileChooser`\
  \ 类并不是 `JDialog` 的子类。与其调用 `setVisible(true)`，不如调用 `showOpenDialog` 来显示打开文件的对话框，或者调用\
  \ `showSaveDialog` 来显示保存文件的对话框。此时接受文件的按钮会自动标记为 Open（打开）或 Save（保存）。你也可以通过 `showDialog`\
  \ 方法提供自己的按钮标签。图 11.33 显示了文件选择器对话框的一个示例。\n\n![Figure](img/filedialog.jpg)图 11.33:\
  \ 一个文件选择器对话框\n\n以下是弹出文件对话框并从框中恢复用户所选内容的步骤：\n\n\n\n\n\n## 1. 创建一个 `JFileChooser`\
  \ 对象。 \n与 `JDialog` 类的构造函数不同，你不需要提供父组件。这允许你在多个帧（frames）之间复用文件选择对话框。\n\n例如：\n\n```\n\
  var chooser = new JFileChooser();\n```\n\n复用文件选择对象是一个好主意，因为 `JFileChooser` 构造函数可能非常慢，特别是在\
  \ Windows 上用户拥有许多映射网络驱动器时。\n\n## 2. 通过调用 `setCurrentDirectory` 方法设置目录。\n\n例如，要使用当前工作目录：\n\
  \n```\nchooser.setCurrentDirectory(new File(\".\"));\n```\n\n你需要提供一个 `File` 对象。`File`\
  \ 对象在第 2 章 中有详细解释。你现在只需要知道，构造函数 `File(String filename)` 会将文件或目录名称转换为 `File` 对象。\n\
  \n## 3. 如果你有一个期望用户选择的默认文件名，可以使用 `setSelectedFile` 方法提供它：\n\n```\nchooser.setSelectedFile(new\
  \ File(filename));\n```\n\n## 4. 如需让使用户能够在对话框中选择多个文件，请调用 `setMultiSelectionEnabled`\
  \ 方法。这当然完全是可选的，而且并不常见。\n\n```\nchooser.setMultiSelectionEnabled(true);\n```\n\n\
  ## 5. 如果你想将对话框中的文件显示限制为特定类型（例如，所有扩展名为 `.gif` 的文件），你需要设置一个文件过滤器。我们将在本节稍后讨论文件过滤器。\n\
  \n## 6. 默认情况下，用户文件选择器只能选择文件。如果你想让用户选择目录，请使用 `setFileSelectionMode` 方法。使用 `JFileChooser.FILES_ONLY`（默认值）、`JFileChooser.DIRECTORIES_ONLY`\
  \ 或 `JFileChooser.FILES_AND_DIRECTORIES` 调用它。\n\n## 7. 通过调用 `showOpenDialog` 或 `showSaveDialog`\
  \ 方法显示对话框。在这些调用中，你必须提供父组件：\n\n```\nint result = chooser.showOpenDialog(parent);\n\
  ```\n\n或\n\n```\nint result = chooser.showSaveDialog(parent);\n```\n\n这些调用唯一的区别在于“确认按钮”的标签——即用户点击以完成文件选择的按钮。你也可以调用\
  \ `showDialog` 方法并为确认按钮传递显式文本：\n\n```\nint result = chooser.showDialog(parent, \"\
  Select\");\n```\n\n只有当用户确认、取消或关闭文件对话框时，这些调用才会返回。返回值为 `JFileChooser.APPROVE_OPTION`、`JFileChooser.CANCEL_OPTION`\
  \ 或 `JFileChooser.ERROR_OPTION`。\n\n## 8. 使用 `getSelectedFile()` 或 `getSelectedFiles()`\
  \ 方法获取选定的文件或文件。这些方法返回单个 `File` 对象或一个 `File` 对象数组。如果你只需要文件对象的名称，请调用它的 `getPath` 方法。例如：\n\
  \n```\nString filename = chooser.getSelectedFile().getPath();\n```\n\n在大多数情况下，这些步骤都是简单的。使用文件对话框的主要困难在于指定一个供用户从中选择的文件子集。\n\
  \n\n\n\n\n```\nclass FileIconView extends FileView {\n    private FileFilter filter;\n\
  \    private Icon icon;\n\n    public FileIconView(FileFilter aFilter, Icon anIcon)\
  \ {\n        filter = aFilter;\n        icon = anIcon;\n    }\n\n    public Icon\
  \ getIcon(File f) {\n        if (!f.isDirectory() && filter.accept(f))\n       \
  \     return icon;\n        else return null;\n    }\n}\n```\n\n使用 `setFileView`\
  \ 方法将此文件视图集成到你的文件选择器中：\n\n```\nchooser.setFileView(new FileIconView(filter,\n  \
  \  new ImageIcon(\"palette.gif\")));\n```\n\n文件选择器将在所有通过 `filter`set 的文件旁边显示调色板图标，并使用默认文件视图显示所有其他文件。自然地，我们使用了在文件选择器设置设置的过滤器。\n\
  \n最后，你可以通过添加一个 `accessory`（附件）组件来自定义文件对话框。例如，图 11.34 显示了文件列表旁边的预览附件。该附件显示当前选中文件的缩略图视图。\n\
  \n![Figure](img/filedialog2.jpg)图 11.34：带有预览附件的文件对话框\n\n附件可以是任何 Swing 组件。在我们的案例中，我们扩展了\
  \ `JLabel` 类并将其图标设置为图形图像的缩放副本：\n\n```java\nclass ImagePreviewer extends JLabel {\n\
  \    public ImagePreviewer(JFileChooser chooser) {\n        setPreferredSize(new\
  \ Dimension(100, 100));\n        setBorder(BorderFactory.createEtchedBorder());\n\
  \    }\n\n    public void loadImage(File f) {\n        var icon = new ImageIcon(f.getPath());\n\
  \        if(icon.getIconWidth() > getWidth())\n            icon = new ImageIcon(icon.getImage().getScaledInstance(\n\
  \                getWidth(), -1, Image.SCALE_DEFAULT));\n        setIcon(icon);\n\
  \        repaint();\n    }\n}\n```\n\n这里只有一个挑战。我们希望在用户选择不同的文件时更新预览图像。文件选择器使用“JavaBeans”机制，在其任何属性发生变化时通知感兴趣的监听器。选中的文件是一个属性，你可以通过安装\
  \ `PropertyChangeListener` 来监控它。以下是拦截通知所需的代码：\n\n```java\nchooser.addPropertyChangeListener(_\
  \ -> {\n    if (event.getPropertyName() == JFileChooser.SELECTED_FILE_CHANGED_PROPERTY)\
  \ {\n        var newFile = (File) event.getNewValue();\n        // update the accessory\n\
  \        . . .\n    }\n});\n```\n\n### `javax.swing.JFileChooser` 1.2\n\n*   `JFileChooser()`\n\
  \    创建一个可用于多个帧的文件选择器对话框。\n\n*   `void setCurrentDirectory(File dir)`\n    设置文件对话框的初始目录。\n\
  \n*   `void setSelectedFile(File file)`\n\n*   `void setSelectedFiles(File[] file)`\n\
  \    设置文件对话框的默认文件选择。\n\n*   `void setMultiSelectionEnabled(boolean b)`\n    设置或清除多选模式。\n\
  \n*   `void setFileSelectionMode(int mode)`\n    允许用户仅选择文件（默认值）、仅选择目录或同时选择文件和目录。`mode`\
  \ 参数是 `JFileChooser.FILES_ONLY`、`JFileChooser.DIRECTORIES_ONLY` 和 `JFileChooser.FILES_AND_DIRECTORIES`\
  \ 之一。\n\n*   `int showOpenDialog(Component parent)`\n\n*   `int showSaveDialog(Component\
  \ parent)`\n\n*   `int showDialog(Component parent, String approveButtonText)`\n\
  \    显示一个对话框，其中确认按钮标记为“打开”、“保存”或 `approveButtonText` 字符串。返回 `APPROVE_OPTION`、`CANCEL_OPTION`（如果用户选择了取消或关闭了对话框）或\
  \ `ERROR_OPTION`（如果发生错误）。\n\n*   `File getSelectedFile()`\n\n*   `File[] getSelectedFiles()`\n\
  \    获取用户选择的文件或文件（如果用户没有选择任何文件，则返回 `null`）。\n\n*   `void setFileFilter(FileFilter\
  \ filter)`\n    设置文件对话框的文件掩码。所有 `filter.accept` 返回 `true` 的文件都将被显示。同时，将过滤器添加到可选择过滤器列表中。\n\
  \n*   `void addChoosableFileFilter(FileFilter filter)`\n    将文件过滤器添加到可选择过滤器列表中。\n\
  \n*   `void setAcceptAllFileFilterUsed(boolean b)`\n    在过滤器组合框中包含或抑制“所有文件”过滤器。\n\
  \n*   `void resetChoosableFileFilters()`\n    清除可选择过滤器列表。除非显式抑制，否则只保留“所有文件”过滤器。\n\
  \n*   `void setFileView(FileView view)`\n    设置文件视图，以提供有关文件选择器显示的文件的信息。\n\n*   `void\
  \ setAccessory(JComponent component)`\n    设置附件组件。\n\n### `javax.swing.filechooser.FileFilter`\
  \ 1.2\n\n*   `boolean accept(File f)`\n    如果文件选择器应该显示此文件，则返回 `true`。\n\n*   `String\
  \ getDescription()`\n    返回此文件过滤器的描述——例如`\"Image files (*.gif,*.jpeg)\"`\n\n###\
  \ `javax.swing.filechooser.FileNameExtensionFilter` 6\n\n*   `FileNameExtensionFilter(String\
  \ description, String... extensions)`\n    使用给定的描述构造文件过滤器，该过滤器接受给定的扩展名字符串之一。\n\n\
  \n\n\n\n`JTable` 并不存储自己的数据，而是从 `table model`（表格模型）中获取数据。`JTable` 类有一个构造函数，可以将对象的二维数组封装进默认模型中。这就是我们在第一个示例中使用的策略；在本章的稍后部分，我们将转向表格模型。\n\
  \n图 12.1 显示了一个典型的表格，描述了太阳系行星的属性。（如果一个行星主要由氢和氦组成，则它是 `gaseous` 气态）。对“颜色”条目应保留态度——添加这一列是因为它在后续代码示例中很有用。）\n\
  \n![Figure](img/fig06-05.jpg)图 12.1：一个简单的表格\n\n如从列表 12.1 中的代码所示，表格数据以 `Object` 值的二维数组形式存储：\n\
  \n```\nObject[][] cells = {\n    { \"Mercury\", 2440.0, 0, false, Color.YELLOW },\n\
  \    { \"Venus\", 6052.0, 0, false, Color.YELLOW },\n    . . .\n};\n```\n\n在这里，我们利用了自动装箱（autoboxing）。第二、第三和第四列的条目会自动转换为\
  \ `Double`、`Integer` 和 `Boolean` 类型的对象。\n\n表格只需调用每个对象的 `toString` 方法来显示它。这就是为什么颜色显示为\
  \ `java.awt.Color[r=. . .,g=. . .,b=. . .]`。\n\n在一个独立的字符串数组中提供列名：\n\n```\nString[]\
  \ columnNames = { \"Planet\", \"Radius\", \"Moons\", \"Gaseous\", \"Color\" };\n\
  ```\n\n然后，根据单元格和列名数组构建表格：\n\n```\nvar table = new JTable(cells, columnNames);\n\
  ```\n\n你可以按照通常的方法添加滚动条——通过将表格封装在 `JScrollPane` 中：\n\n```\nvar pane = new JScrollPane(table);\n\
  ```\n\n当你滚动表格时，表格头不会滚出视图。\n\n接下来，点击其中一个列头并向左或向右拖动。观察整个列是如何分离的（请参见图 12.2）。你可以将其释放到不同的位置。这*仅在视图中*重新排列了列。数据模型不会受影响。\n\
  \n![Figure](img/fig06-06.jpg)图 12.2：移动列\n\n要 `resize` 列宽，只需将光标置在两列之间，直到光标形状变为箭头。然后，将列边界拖到所需位置（请参见图\
  \ 12.3）。\n\n![Figure](img/fig06-07.jpg)图 12.3：调整列宽\n\n用户可以通过点击行中的任何位置来选择行。选中的行会被高亮显示；稍后你会看到如何获取选择事件。用户还可以通过点击单元格并输入来编辑表格条目。然而，在这个代码示例中，编辑不会更改底层数据。在你的程序中，你应该让单元格设为不可编辑，或者处理单元格编辑事件并更新你的模型。我们将在本节稍后部分讨论这些主题。\n\
  \n最后，点击列头。行将自动排序。再次点击，排序顺序将反转。这种行为通过以下调用激活：\n\n```\ntable.setAutoCreateRowSorter(true);\n\
  ```\n\n你可以通过以下调用打印表格：\n\n```\ntable.print();\n```\n\n如果你没有将表格封装到滚动面板中，则需要显式添加头：\n\
  \n```\nadd(table.getTableHeader(), BorderLayout.NORTH);\n```\n\n列表 12.1 v2ch12/table/TableDemo.java\n\
