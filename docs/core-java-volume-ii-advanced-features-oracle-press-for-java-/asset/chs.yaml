  \ 12.5.9. 透明度与合成\n\n在标准的 RGB 色彩模型中，每种颜色都通过其红、绿、蓝分量来描述。然而，描述图像中`transparent` 或部分透明的区域也同样方便。当你将一张图像叠加到现有的图形上时，透明像素完全不会遮挡它们下方的像素，而半透明像素则会与下方的像素混合。图\
  \ 12.51 显示了在图像上叠加一个半透明矩形的效果。你仍然可以看到图像的细节透过矩形透射出来。\n\n![Figure](img/fig07-21.jpg)图\
  \ 12.51: 在图像上叠加一个半透明矩形\n\n在 Java 2D API 中，透明度由一个 `alpha channel`（alpha 通道）来描述。每个像素除了红、绿、蓝颜色分量外，还有一个介于\
  \ 0（完全透明）和 1（完全不透明）之间的 alpha 值。例如，图 12.51 中的矩形填充了具有 50% 透明度的淡黄色：\n\n```\nnew Color(0.7F,\
  \ 0.7F, 0.0F, 0.5F);\n```\n\n现在让我们看看叠加两个形状会发生什么。你需要对源像素和目标像素的颜色及 alpha 值进行混合或`compose`（合成）。Porter\
  \ 和 Duff 是计算机图形领域的两位研究人员，他们为这种混合过程制定了 12 种 `composition rules`（合成规则）。Java 2D API\
  \ 实现了所有这些规则。在继续之前，我想指出，这些规则中只有两个具有实际意义。如果你觉得这些规则深奥或难以理解，只需使用 `SRC_OVER` 规则即可。它是\
  \ `Graphics2D` 对象的默认规则，能提供最直观的结果。\n\n这是这些规则背后的理论。假设你有一个 alpha 值为 `a[S]` 的 `source\
  \ pixel`（源像素）。图像中已经有一个 alpha 值为 `a[D]` 的 `destination pixel`（目标像素）。你想对两者进行合成。图 12.52\
  \ 中的图表展示了如何设计合成规则。\n\n.图 12.52: 设计合成规则\n\nPorter 和 Duff 将 alpha 值视为使用像素颜色的概率。从源的角度来看，有\
  \ `a[S]` 的概率想要使用源颜色，以及 1 – `a[S]` 的概率表示它不在乎。目标的情况也是如此。在合成颜色时，我们假设这些概率是相互独立的。那么就有四种情况，如图\
  \ 12.52 所示。如果源想使用源颜色而目标不在乎，那么让源按其意愿执行似乎是合理的。这就是为什么图的右上角被标记为“S”。该事件发生的概率为 `a[S]`\
  \ · (1 – `a[D]`)。同样，左下角标记为“D”。如果目标和源都想选择自己的颜色，该怎么办呢？这就是 Porter–Duff 规则派上用场的地方。如果我们认为源更重要，我们将右下角标记为“S”。那条规则被称为\
  \ `SRC_OVER`。在该规则中，你以权重 `a[S]` 组合源颜色，并以权重 (1 – `a[S]`) · `a[D]` 组合目标颜色。\n\n视觉效果是源和目标的混合，并优先考虑源。特别是，如果\
  \ `a[S]` 为 1，则完全不考虑目标颜色。如果 `a[S]` 为 0，则源像素完全透明，目标颜色保持不变。\n\n其他规则取决于你在概率图的方框中填入什么字母。表\
  \ 12.3 和图 12.53 显示了 Java 2D API 支持的所有规则。图中的图像显示了当一个 alpha 为 0.75 的矩形源区域与 alpha 为\
  \ 1.0 的椭圆目标区域组合时，这些规则的结果。\n\n表 12.3: Porter–Duff 合成规则\n\n| 规则 | 解释 |\n| --- | ---\
  \ |\n| `CLEAR` | 源清除目标。 |\n| `SRC` | 源覆盖目标和空像素。 |\n| `DST` | 源不影响目标。 |\n| `SRC_OVER`\
  \ | 源与目标混合并覆盖空像素。 |\n| `DST_OVER` | 源不影响目标并覆盖空像素。 |\n| `SRC_IN` | 源覆盖目标。 |\n| `SRC_OUT`\
  \ | 源清除目标并覆盖空像素。 |\n| `DST_IN` | 源 alpha 修改目标。 |\n| `DST_OUT` | 源 alpha 补码修改目标。\
  \ |\n| `SRC_ATOP` | 源与目标混合。 |\n| `DST_ATOP` | 源 alpha 修改目标。源覆盖空像素。 |\n| `XOR` |\
  \ 源 alpha 补码修改目标。源覆盖空像素。 |\n\n.图 12.53: Porter–Duff 合成规则\n\n如你所示，`SRC_OVER` 规则是有用的。例如，考虑以下代码：\n\
  \n```\nint rule = AlphaComposite.SRC_OVER;\nfloat alpha = 0.5f;\ng2.setComposite(AlphaComposite.getInstance(rule,\
  \ alpha));\ng2.setPaint(Color.blue);\ng2.fill(rectangle);\n```\n\n然后矩形将用蓝色和 0.5\
  \ 的 alpha 值进行涂涂。\n\n\n\n\n\n```java\npackage v2ch12.composite;\n\nimport module\
  \ java.desktop;\n\n/**\n * 此框架包含一个用于选择组合规则的组合框、一个用于更改源\n * alpha 通道的滑块，以及一个显示组合结果的组件。\n\
  \ */\nclass CompositeDemoFrame extends JFrame {\n    private static final int DEFAULT_WIDTH\
  \ = 400;\n    private static final int DEFAULT_HEIGHT = 400;\n\n    private CompositeComponent\
  \ canvas;\n    private JComboBox<Rule> ruleCombo;\n    private JSlider alphaSlider;\n\
  \    private JTextField explanation;\n\n    public CompositeDemoFrame() {\n    \
  \    setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n\n        canvas = new CompositeComponent();\n\
  \        add(canvas, BorderLayout.CENTER);\n\n        ruleCombo = new JComboBox<>(\n\
  \                new Rule[] { new Rule(\"CLEAR\", \"  \", \"  \"), new Rule(\"SRC\"\
  , \" S\", \" S\"),\n                        new Rule(\"DST\", \"  \", \"DD\"), new\
  \ Rule(\"SRC_OVER\", \" S\", \"DS\"),\n                        new Rule(\"DST_OVER\"\
  , \" S\", \"DD\"), new Rule(\"SRC_IN\", \"  \", \" S\"),\n                     \
  \   new Rule(\"SRC_OUT\", \" S\", \"  \"), new Rule(\"DST_IN\", \"  \", \" D\"),\n\
  \                        new Rule(\"DST_OUT\", \"  \", \"D \"), new Rule(\"SRC_ATOP\"\
  , \"  \", \"DS\"),\n                        new Rule(\"DST_ATOP\", \" S\", \" D\"\
  ), new Rule(\"XOR\", \" S\", \"D \"), });\n        ruleCombo.addActionListener(_\
  \ -> {\n            var r = (Rule) ruleCombo.getSelectedItem();\n            canvas.setRule(r.getValue());\n\
  \            explanation.setText(r.getExplanation());\n        });\n\n        alphaSlider\
  \ = new JSlider(0, 100, 75);\n        alphaSlider.addChangeListener(_ -> canvas.setAlpha(alphaSlider.getValue()));\n\
  \        var panel = new JPanel();\n        panel.add(ruleCombo);\n        panel.add(new\
  \ JLabel(\"Alpha\"));\n        panel.add(alphaSlider);\n        add(panel, BorderLayout.NORTH);\n\
  \n        explanation = new JTextField();\n        add(explanation, BorderLayout.SOUTH);\n\
  \n        canvas.setAlpha(alphaSlider.getValue());\n        Rule r = ruleCombo.getItemAt(ruleCombo.getSelectedIndex());\n\
  \        canvas.setRule(r.getValue());\n        explanation.setText(r.getExplanation());\n\
  \    }\n}\n```\n\n列表 12.18 `v2ch12/composite/CompositeComponent.java`\n\n```java\n\
  package v2ch12.composite;\n\nimport module java.desktop;\n\n/**\n * 此组件绘制两个形状，并根据组合规则进行组合显示。\n\
  \ */\nclass CompositeComponent extends JComponent {\n    private int rule;\n   \
