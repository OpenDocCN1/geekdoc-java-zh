  \ endDateExclusive)`\n    获取直到给定结束日期的期间。`ChronoLocalDate` 接口由 `LocalDate` 和用于非格哥利亚日历的日期类实现。\n\
  \n*   `boolean isBefore(ChronoLocalDate other)`\n*   `boolean isAfter(ChronoLocalDate\
  \ other)`\n    如果此日期在给定日期之前或之后，则返回 `true`。\n\n*   `boolean isLeapYear()`\n    如果该年份是闰年，则返回\
  \ `true`——也就是说如果它能被 4 整除但不能被 100 整除，或者能被 400 整除。该算法适用于所有过去 de 年份，尽管这在历史上是不准确的。（闰年发明于公元\
  \ -46 年，涉及被 100 和 400 整除的规则是在 1582 年的格哥利亚历法改革中引入的。这次改革花了 300 多年才变得通用。）\n\n*   `Stream<LocalDate>\
