  2025 年 9 月\n\n# 第 1 章 ▪ 流\n\n与集合（collections）相比，流提供了一种数据视图，允许你在更高的概念层指定计算任务。通过流，你指定的是你想*做什么*，而不是*如何做*。你将操作的调度留给实现。例如，假设你想计算某个属性的平均值。你指定数据源和该属性，然后流库就可以优化计算，例如通过使用多个线程计算总和和计数并合并结果。\n\
  \n在本章，你将学习如何使用 Java 流库，它允许你以“做什么，而不是怎么做”风格处理值序列。\n\n## 1.1 从迭代到流操作\n\n当你处理一个集合时，通常会遍历它的元素并对每个元素执行一些操作。例如，假设我们想统计一书中所有的长单词。首先，让我们将它们放入一个列表：\n\
  \n```\nString contents =  Files.readString(Path.of(\"alice.txt\")); // 将文件读入字符串\n\
  String[] words = contents.split(\"\\\\PL+\"); // 拆分为单词\n```\n\n`split` 方法根据给定的分隔符正则表达式将字符串拆分为若干部分。（关于正则表达式的更多信息，请参阅第\
  \ 2 章 fact 目前，只需相信 `\\PL+` 表达式是有效的即可。）\n\n现在我们可以开始迭代了：\n\n```\nint count = 0;\n\
  for (String w : words) {\n    if (w.length() > 12) count++;\n}\n```\n\n使用流，相同的操作看起来如下：\n\
  \n```\nlong count = Stream.of(words)\n    .filter(w -> w.length() > 12)\n    .count();\n\
  ```\n\n现在，你不需要扫描循环来寻找过滤和计数的证据了。方法名会立即告诉你代码的意图。此外，循环详细地规定了操作的顺序，而流能够以它想要的方式调度操作，只要结果是正确的即可。\n\
  \n只需将 `stream` 改为 `parallelStream`，即可让流库并行执行过滤和计数。\n\n```\nlong count = words.parallelStream()\n\
  \    .filter(w -> w.length() > 12)\n    .count();\n```\n\n流遵循“做什么，而不是怎么做”的原则。在流示例中，我们描述了需要做什么：获取长单词并对其计数。我们没有指定这应该以什么顺序或在哪个线程中发生。相比之下，本节开头的循环精确地指定了计算应该如何工作。\n\
  \n流在表面上看起来像集合，但存在显著差异：\n\n1. 流不存储其元素。元素可以根据需要生成。\n2. 流操作不会改变其源。例如，`filter` 返回一个新流。\n\
  3. 流操作在可能的情况下是惰性的（lazy）。这意味着在结果被需要之前，它们不会执行。例如，如果你只需要五个单词而不是所有的单词，`filter` 方法就会停止。\n\
  \n这种工作流在处理流时是典型的。你通过三个阶段设置操作流水线：\n\n1. 创建流。\n2. 指定*中间操作*（intermediate operations）将初始流转换为其他流，可能涉及多个步骤。\n\
  3. 应用*终端操作*（terminal operation）来产生结果。该操作会强制执行其先的惰性操作。之后，该流无法再次使用。\n\n在列表 1.1 的示例中，通过\
  \ `stream` 或 `parallelStream` 方法创建流。`filter` 方法对其进行转换，而 `count` 是终端操作。\n\n在下一节中，你将看到如何创建流。随后的三个章节将处理中间操作。然后我们转向终端操作。\n\
  \n\n\n\n产生此集合中元素的顺序或并行流。\n\n## 1.2. 流的创建\n\n你已经看到可以通过 `Collection` 接口的 `stream`\
  \ 方法将任何集合转换为流。如果你有一个数组，请使用静态的 `Stream.of` 方法。\n\n```java\nStream<String> words =\
  \ Stream.of(contents.split(\"\\\\PL+\"));\n```\n\n在上一个示例中，我们根据 `split` 方法返回的数组创建一个流。`of`\
  \ 方法具有变长参数列表，因此你可以从任意数量的参数构造流：\n\n```java\nStream<String> song = Stream.of(\"gently\"\
  , \"down\", \"the\", \"stream\");\n```\n\n使用 `Arrays.stream(array, from, to)` 从数组的某个创建一个流。\n\
  \n要创建一个没有任何元素的流，请使用静态的 `Stream.empty` 方法：\n\n```java\nStream<String> silence = Stream.empty();\n\
  // 通用类型 <String> 被推断出来；等同于 Stream.<String>empty()\n```\n\n`Stream` 接口有两个静态方法用于创建无限流。`generate`\
  \ 方法接收一个无参数的函数（或者从技术上说，是一个 `Supplier<T>` 接口的对象）。每当需要流值时，就会调用该函数产生一个值。你可以这样获取一个常量值流：\n\
  \n```java\nStream<String> echos = Stream.generate(() -> \"Echo\");\n```\n\n或者获取一个随机数流：\n\
  \n```java\nStream<Double> randoms = Stream.generate(Math::random);\n```\n\n要产生如\
  \ `0 1 2 3 . . .` 类的序列，请使用 `iterate` 方法。它接收一个“种子”值和一个函数（技术上说，是一个 `UnaryOperator<T>`），并反复将该函数应用于上一个结果。例如：\n\
  \n```java\nStream<BigInteger> integers\n    = Stream.iterate(BigInteger.ZERO, n\
  \ -> n.add(BigInteger.ONE));\n```\n\n序列中的第一个元素是种子 `BigInteger.ZERO`。第二个元素是 `f(seed)`，它产生\
  \ `1`（作为大整数）。下一个元素是 `f(f(seed))`，它产生 `2`，以此此类推。\n\n要产生一个有限流，请添加一个谓词来指定迭代何时结束：\n\n\
  ```java\nvar limit = new BigInteger(\"10000000\");\nStream<BigInteger> integers\n\
  \    = Stream.iterate(BigInteger.ZERO,\n        n -> n.compareTo(limit) < 0,\n \
  \       n -> n.add(BigInteger.ONE));\n```\n\n一旦谓词拒绝了通过迭代生成的值，流就会结束。\n\n最后，`Stream.ofNullable`\
  \ 方法根据一个对象创建一个非常短的流。如果对象为 `null`，流的长度为 0；否则长度为 1，仅包含该对象。这与 `flatMap` 结合使用时非常有用——参见示例第\
  \ 1.7.7 节。\n\nJava API 中的许多方法都会产生流。例如，`String` 类有一个 `lines` 方法，可以产生包含字符串中所有行的流：\n\
  \n```java\nStream<String> greetings = \"Hello\\nGuten Tag\\nBonjour\".lines();\n\
  ```\n\n`Pattern` 类有一个方法 `splitAsStream`，可以根据正则表达式拆分 `CharSequence`。你可以使用以下语句将字符串拆分为单词：\n\
  \n```java\nStream<String> words = Pattern.compile(\"\\\\PL+\").splitAsStream(contents);\n\
  ```\n\n`Scanner.tokens` 方法产生一个扫描器的标记流。另一种从字符串获取单词流的方法是：\n\n```java\nStream<String>\
  \ words = new Scanner(contents).tokens();\n```\n\n静态方法 `Files.lines` 返回文件文件中所有行的\
  \ `Stream`：\n\n```java\ntry (Stream<String> lines = Files.lines(path)) {\n    Process\
  \ lines\n}\n```\n\n注意，需要 `try`-with-resources 块来关闭文件。\n\n在 Java API 中以流的形式提供数据变得越来越常见。例如，Java\
  \ 21 添加了一个静态方法 `availableLocales`，产生 `Locale` 对象的流。\n\n要产生有限流，你可以始终将元素添加到列表中，然后将其转换为流。`Stream.Builder`\
  \ 接口为此目的效率略高：\n\n```java\nStream<Integer> digits(int n) {\n    Stream.Builder<Integer>\
  \ builder = Stream.builder();\n    while (n != 0) {\n        builder.add(n % 10);\n\
  \        n = n / 10;\n    }\n    return builder.build();\n}\n```\n\n要查看本节介绍的流之一的内容，请使用\
  \ `toList` 方法，它将流的元素收集到列表中。像 `count` 一样，`toList` 是终端操作。如果流是无限的，请先用 `limit` 方法对其截断：\n\
  \n```java\nIO.println(Stream.generate(Math::random).limit(10).toList());\n```\n\n\
  为了将 `Iterator` 或不是集合的通用 `Iterable` 转换为流，你需要使用 `spliterators`（拆分器）的辅助方法。拆分器类似于迭代器（iterator），但但它可以被拆分，使得每个生成的拆分器都能产生元素的一部分。这种拆分被用于并行处理元素——参见第\
  \ 1.13 节。\n\n如果你有一个 `Iterator` 并想要获取其结果的流，请使用：\n\n```java\nStreamSupport.stream(Spliterators.spliteratorUnknownSize(\n\
  \    iterator, Spliterator.ORDERED), false);\n```\n\n如果你有一个不是集合的 `Iterable`，可以通过调用将其转换为流：\n\
  \n```java\nStreamSupport.stream(iterable.spliterator(), false);\n```\n\n在执行流操作时，不要修改支持流的集合，这一点非常重要。记住，流并不收集数据——数据始终在单独的集合中。如果你修改了该集合，流操作的结果将变得未定义。JDK\
  \ 文档将此要求称为“非干扰”（noninterference）。\n\n准确来说，由于中间流操作是懒性的，在执行终端操作之前，集合可能会被修改。例如，以下代码虽然绝对不推荐，但可以运行：\n\
  \n```java\nList<String> wordList = . . .\nStream<String> words = wordList.stream();\n\
  wordList.add(\"END\");\nlong n = words.distinct().count();\n```\n\n但这段代码是错误的：\n\n\
  ```java\nStream<String> words = wordList.stream();\nwords.forEach(s -> {if (s.length()\
  \ < 12) wordList.remove(s);});\n    // ERROR--interference\n```\n\n列表 1.2 中的示例程序展示了创建流的各种方式。\n\
  \n列表 1.2 v2ch01/streams/CreatingStreams.java\n\n\n\n\n\n```java\npackage v2ch01.streams;\n\
  \nimport module java.base;\n\nclass CreatingStreams {\n    void main() throws Exception\
  \ {\n        Path path = Path.of(\"gutenberg\", \"alice30.txt\");\n        String\
  \ contents = Files.readString(path);\n        Stream<String> words = Stream.of(contents.split(\"\
  \\\\PL+\"));\n\n        show(\"words\", words);\n        Stream<String> song = Stream.of(\"\
  gently\", \"down\", \"the\", \"stream\");\n        show(\"song\", song);\n     \
  \   Stream<String> silence = Stream.empty();\n        show(\"silence\", silence);\n\
  \n        Stream<String> echos = Stream.generate(() -> \"Echo\");\n        show(\"\
  echos\", echos);\n\n        Stream<Double> randoms = Stream.generate(Math::random);\n\
  \        show(\"randoms\", randoms);\n\n        Stream<BigInteger> integers = Stream.iterate(BigInteger.ONE,\n\
  \                n -> n.add(BigInteger.ONE));\n        show(\"integers\", integers);\n\
  \n        Stream<String> greetings = \"Hello\\nGuten Tag\\nBonjour\".lines();\n\
  \        show(\"greetings\", greetings);\n\n        Stream<String> wordsAnotherWay\
  \ = Pattern.compile(\"\\\\PL+\").splitAsStream(contents);\n        show(\"wordsAnotherWay\"\
  , wordsAnotherWay);\n\n        try (Stream<String> lines = Files.lines(path)) {\n\
  \            show(\"lines\", lines);\n        }\n\n        Iterable<Path> iterable\
  \ = FileSystems.getDefault().getRootDirectories();\n        Stream<Path> rootDirectories\
  \ = StreamSupport.stream(iterable.spliterator(), false);\n        show(\"rootDirectories\"\
  , rootDirectories);\n\n        Iterator<Path> iterator = Path.of(\"/usr/share/dict/words\"\
  ).iterator();\n        Stream<Path> pathComponents = StreamSupport.stream(\n   \
  \             Spliterators.spliteratorUnknownSize(iterator, Spliterator.ORDERED),\
  \ false);\n        show(\"pathComponents\", pathComponents);\n    }\n\n    <T> void\
  \ show(String title, Stream<T> stream) {\n        final int SIZE = 10;\n       \
  \ List<T> firstElements = stream.limit(SIZE + 1).toList();\n        IO.print(title\
  \ + \": \");\n        for (int i = 0; i < firstElements.size(); i++) {\n       \
  \     if (i > 0) IO.print(\", \");\n            if (i < SIZE)\n                IO.print(firstElements.get(i));\n\
  \            else\n                IO.print(\"...\");\n        }\n        IO.println();\n\
  \    }\n\n}\n```\n\n### `java.util.stream.Stream<T>`\n\n- `static <T> Stream<T>\
  \ of(T... values)`\n  产生一个元素为给定值的流。\n\n- `static <T> Stream<T> empty()`\n  产生一个不包含任何元素的流。\n\
  \n- `static <T> Stream<T> generate(Supplier<T> s)`\n  产生一个无限流，其元素通过重复调用函数 `s` 来构建。\n\
  \n- `static <T> Stream<T> iterate(T seed, UnaryOperator<T> f)`\n- `static <T> Stream<T>\
  \ iterate(T seed, Predicate<? super T> hasNext, UnaryOperator<T> f)`\n  产生一个流，其元素为\
  \ `seed`、对 `seed` 调用 `f`、对前一个元素调用 `f` 等以此类推。第一个方法产生无限流。第二种方法产生的流在第一个不满足 `hasNext`\
  \ 谓词的元素之前结束。\n\n- `static <T> Stream<T> ofNullable(T t)`\n  如果 `t` 为 `null` 则返回空流，否则返回一个包含\
  \ `t` 的流。\n\n### `java.util.Spliterators`\n\n- `static <T> Spliterator<T> spliteratorUnknownSize(Iterator<?\
  \ extends T> iterator, int characteristics)`\n  将迭代器转换为未知大小的可拆分迭代器，并具有给定的特性（一个包含\
  \ `Spliterator.ORDERED` 等常量的位模式）。\n\n### `java.util.Arrays`\n\n- `static <T> Stream<T>\
  \ stream(T[] array, int startInclusive, int endExclusive)`\n  产生一个元素为数组中指定范围的流。\n\
  \n### `java.lang.String`\n\n- `String[] split(String regex)`\n  找到正则表达式的所有匹配项，并通过移除它们来分割字符串。返回一个包含片段的数组，但不包含末尾的空字符串。\n\
  \n- `static Stream<String> lines()`\n  产生一个元素为该字符串各行的流。\n\n### `java.util.regex.Pattern`\n\
  \n- `Stream<String> splitAsStream(CharSequence input)`\n  产生一个流，其元素为由此模式分隔的输入部分。\n\
  \n### `java.nio.file.Files`\n\n- `static Stream<String> lines(Path path)`\n- `static\
  \ Stream<String> lines(Path path, Charset cs)`\n  产生一个流，其元素为指定文件的行，使用 UTF-8 字符集或指定的字符集。\n\
  \n### `java.util.stream.StreamSupport`\n\n- `static <T> Stream<T> stream(Spliterator<T>\
  \ spliterator, boolean parallel)`\n  产生一个包含由可拆分迭代器产生的值的。\n\n### `java.lang.Iterable`\n\
  \n- `Spliterator<T> spliterator()`\n  产生一个拆分迭代器。\n\n### `java.util.Scanner`\n\n\
  - `public Stream<String> tokens()`\n  产生一个标记流。\n\n### `java.util.function.Supplier`\n\
  \n- `T get()`\n  提供一个值。\n\n### `java.util.function.Predicate`\n\n- `boolean test(T\
  \ t)`\n  测试谓词。\n\n### `java.util.function.UnaryOperator`\n\n- `T apply(T t)`\n \
  \ 对参数应用函数。\n\n### `filter`, `map`, 和 `flatMap` 方法\n\n`filter` 方法返回一个由符合谓词的元素组成的中间流。例如，我们过滤长单词：\n\
  \n```java\nStream<String> longWords = words.stream().filter(w -> w.length() > 5);\n\
  ```\n\n`map` 方法是一个中间操作，使用提供的函数转换流的每个元素。在这里，我们将所有单词转换为小写：\n\n```java\nStream<String>\
  \ lowercaseWords = words.stream().map(String::toLowerCase);\n```\n\n通常，你使用 Lambda\
  \ 表达式：\n\n```java\nStream<Character> firstUnits = words.stream().map(s -> s.charAt(0));\n\
  ```\n\n`flatMap` 方法用于流的每个元素转换为另一个流，并且你想将这些流展化为单个流。例如，如果 `grapheClusters` 返回一个流：\n\
  \n```java\npublic static Stream<String> graphemeClusters(String s) {\n    return\
  \ Stream.of(s.split(\"\\\\b\"));\n}\n```\n\n例如，`grapheClusters(\"Ahoy\")` 是一个包含\
  \ `\"A\"`、`\"h\"`、`\"o\"`、`\"y\"` 的流。（注意由多个 `char` 值组成）。现在让我们对字符串流映射 `grapheClusters`\
  \ 方法：\n\n```java\nList<String> wordList = List.of(\"your\", \"boat\");\nStream<Stream<String>>\
  \ result = wordList.stream().map(w -> graphemeClusters(w));\n```\n\n你将得到一个流流，类似于\
  \ `[[[\"y\", \"o\", \"u\", \"r\"], [\"b\", \"o\", \"a\", \"t\"]]]`。为了将其展化为单个流 `[[[\"\
  y\", \"o\", \"u\", \"r\", \"b\", \"o\", \"a\", \"t\"]]]`，请使用 `flatMap` 方法代替 `map`：\n\
  \n```java\nStream<String> flatResult = words.stream().flatMap(w -> graphemeClusters(w));\n\
  \    // 对每个单词调用 graphemeClusters 并展平结果\n```\n\n`mapMulti` 方法是一个中间操作，允许你将每个元素转换为零或多个元素。它不是产生流，而是生成结果并将其传递给收集器——一个实现\
  \ `Consumer` 函数式接口的对象。\n\n让我们用示例来这样做。以下循环遍历字符串 `s` 的字素簇（grapheme clusters）：\n\n\
  ```java\nBreakIterator iter = BreakIterator.getCharacterInstance();\n. . .\niter.setText(s);\n\
  int start = iter.first();\nint end = iter.next();\nwhile (end != BreakIterator.DONE)\
  \ {\n    String gc = s.substring(start, end);\n    start = end;\n    end = iter.next();\n\
  \    // 对 gc 进行操作\n}\n```\n\n\n\n\n\n调用 `mapMulti` 时，你提供一个函数，该函数会被流元素和收集器（collector）调用。在你的函数中，将结果传递给收集器。\n\
  \n```\nStream<String> result = words.stream().mapMulti((s, collector) -> {\n   \
  \ iter.setText(s);\n    int start = iter.first();\n    int end = iter.next();\n\
  \    while (end != BreakIterator.DONE) {\n        String gc = s.substring(start,\
  \ end);\n        start = end;\n        end = iter.next();\n        collector.accept(gc);\n\
  \    }\n});\n```\n\n`java.util.stream.Stream<T>`8\n\n*   `Stream<T> filter(Predicate<?\
  \ super T> predicate)`\n    产生一个包含此流中满足谓元素的流。\n\n*   `<R> Stream<R> map(Function<?\
  \ super T,? extends R> mapper)`\n    产生一个包含将 `mapper` 应用于此流元素的结果的流。\n\n*   `<R>\
  \ Stream<R> flatMap(Function<? super T,? extends Stream<? extends R>> mapper)`\n\
  \    产生一个通过拼接将 `mapper` 应用于此流元素的结果而得到的流。（注意每个 `mapper` 结果都是一个流。）\n\n*   `<R> Stream<R>\
  \ mapMulti(BiConsumer<? super T,? super Consumer<R>> mapper)`16\n    对于每个流元素，都会调用\
  \ `mapper`，并在调用期间传递给 `Consumer` 的所有元素都会添加到结果流中。\n\n## 1.4. 提取子流和合并流\n\n调用 `stream.limit(n)`\
  \ 返回一个在 `n` 个元素之后结束的新流（或者如果原始流较短，则在原始流结束时也结束）。该方法对于将无限流裁剪为特定大小特别有用。例如：\n\n```\n\
  Stream<Double> randoms = Stream.generate(Math::random).limit(100);\n```\n\n产生一个包含\
  \ 100 个随机数的流。\n\n调用 `stream.skip(n)` 恰恰相反。它丢弃前 `n` 个元素。这在我们的读书示例中非常方便，由于 `split`\
  \ 方法的工作方式，第一个元素是一个不需要的空字符串。我们可以通过调用 `skip` 让它消失：\n\n```\nStream<String> words =\
  \ Stream.of(contents.split(\"\\\\PL+\")).skip(1);\n```\n\n`stream.takeWhile(predicate)`\
  \ 调用在 `predicate` 为 `true` 时获取流中的所有元素，然后停止。\n\n例如，假设我们使用上一节的 `graphemeClusters`\
  \ 方法将字符串拆分为字符，并且我们想要收集所有的初始数字。`takeWhile` 方法可以做到这一点：\n\n```\nStream<String> initialDigits\
  \ = graphemeClusters(str).takeWhile(\n    s -> \"0123456789\".contains(s));\n```\n\
  \n`dropWhile` 方法的作用相反，在条件为 `true` 时丢弃元素，并产生一个从第一个条件为 `false` 的元素开始的所有元素的流。例如：\n\n\
  ```\nStream<String> withoutInitialWhiteSpace = graphemeClusters(str).dropWhile(\n\
  \    s -> s.strip().length() == 0);\n```\n\n你可以使用 `Stream` 类的静态方法 `concat` 合并两个流：\n\
  \n```\nStream<String> combined = Stream.concat(\n    graphemeClusters(\"Hello\"\
  ), graphemeClusters(\"World\"));\n    // 产生流 [\"H\", \"e\", \"l\", \"l\", \"o\"\
  , \"W\", \"o\", \"r\", \"l\", \"d\"]\n```\n\n当然，第一个流不应该是无限的——否则第二个流将永远没有机会。\n\n\
  `java.util.stream.Stream<T>`8\n\n*   `Stream<T> limit(long maxSize)`\n    产生一个包含此流中最多\
  \ `maxSize` 个初始元素的流。\n\n*   `Stream<T> skip(long n)`\n    产生一个流，其元素为此流中除前 `n` 个元素以外的所有元素。\n\
  \n*   `Stream<T> takeWhile(Predicate<? super T> predicate)`9\n    产生一个流，其元素为此流中满足谓元的初始元素。\n\
  \n*   `Stream<T> dropWhile(Predicate<? super T> predicate)`9\n    产生一个流，其元素为此流中除满足谓元的元素元素以外元素。\n\
  \n*   `static <T> Stream<T> concat(Stream<? extends T> a, Stream<? extends T> b)`\n\
  \    产生一个流，其元素为 `a` 的元素后跟 `b` 的元素。\n\n## 1.5. 其他流转换\n\n`distinct` 方法返回一个流，该流按相同顺序产生原始流中的元素，不同的是抑制了重复项。重复项不需要相邻。\n\
  \n```\nStream<String> uniqueWords\n    = Stream.of(\"merrily\", \"merrily\", \"\
  merrily\", \"gently\").distinct();\n    // 只 保留了一个 \"merrily\"\n```\n\n对于流的排序，`sorted`\
  \ 方法有几种变体。一个适用于 `Comparable` 元素的流，另一个接受一个 `Comparator`。在这里，我们对字符串进行排序，使最长的排在前面：\n\
  \n```\nStream<String> longestFirst\n    = words.stream().sorted(Comparator.comparing(String::length).reversed());\n\
  ```\n\n与所有的流转换一样，`sorted` 方法都会产生一个新的流。`sorted` 方法返回一个流，其元素为此流的元素。第一个方法要求元素是 `Comparable`\
  \ 的实例。`sorted` 方法返回一个其元素为此流元素排序后的流。\n\n`java.util.stream.Stream<T>`8\n\n*   `Stream<T>\
  \ distinct()`\n    产生一个此流的去重元素流。\n\n*   `Stream<T> sorted()`\n*   `Stream<T> sorted(Comparator<?\
  \ super T> comparator)`\n    产生一个其元素按顺序排序的此流元素。\n\n*   `Stream<T> peek(Consumer<?\
  \ super T> action)`\n    产生一个与此流元素相同的，并在消费每个元素时将其传递给 `action`。\n\n## 1.6. 归约\n\n\
  现在你已经了解如何创建和转换流，我们将达到最重要的点——从流数据中获取答案。本节涵盖的方法被称为*归约*（reduction）。归约是*终端操作*。它们将流归约为非流值。\n\
  \n你已经见过一个简单的归约：`count` 方法，它返回流元素的数量。\n\n其他的简单归约是 `max` 和 `min`，它们返回最大或最小值。有一个转折——这些方法返回一个\
  \ `Optional<T>` 值，该值要么封装答案，要么指示没有（因为流恰好为空）。在过去，在这种情况下返回 `null` 是很常见的。但当它在未完全测试程序中发生时，会导致空指针异常。`Optional`\
  \ 类型是指示缺失返回值的更好方法。我们在下一节中详细讨论 `Optional` 类型。这里是获取流的最大值的方法：\n\n```\nOptional<String>\
  \ largest = words.max(String::compareToIgnoreCase);\nIO.println(\"largest: \" +\
  \ largest.orElse(\"\"));\n```\n\n`findFirst` 返回非空集合中的第一个值。它与 `filter` 结合使用通常非常有用。例如，在这里我们找到以字母\
  \ Q 开头的第一个单词，如果存在的话：\n\n```\nOptional<String> startsWithQ\n    = words.filter(s\
  \ -> s.startsWith(\"Q\")).findFirst();\n```\n\n\n\n\n如果你对任何匹配项都接受，而不仅仅是第一个，请使用 `findAny`\
  \ 方法。当并行化流时，这种方法非常有效，因为流可以报告它找到的任何匹配项，而不是受限于第一个。\n\n```\nOptional<String> startsWithQ\n\
  \    = words.parallel().filter(s -> s.startsWith(\"Q\")).findAny();\n```\n\n如果你只想知道是否存在匹配项，请使用带有谓词参数的终端操作\
  \ `anyMatch`：\n\n```\nboolean aWordStartsWithQ\n    = words.parallel().anyMatch(s\
  \ -> s.startsWith(\"Q\"));\n```\n\n还有 `allMatch` 和 `noneMatch` 方法，如果所有元素或没有元素匹配谓词，则它们将返回\
  \ `true`。这些方法在并行运行时也能从中获益。\n\n`java.util.stream.Stream<T>` 8\n\n* `Optional<T> max(Comparator<?\
  \ super T> comparator)` \n    返回此流的最大或最小元素，使用由给定的比较器定义的排序；如果此流为空，则返回一个空的 `Optional`。这些是终端操作。\n\
  * `Optional<T> min(Comparator<? super T> comparator)`\n    返回此流的最大或最小元素，使用由给定的比较器定义的排序；如果此流为空，则返回一个空的\
  \ `Optional`。这些是终端操作。\n* `Optional<T> findFirst()`\n    返回此流的第一个元素，如果此流为空，则返回一个空的\
  \ `Optional`。这些是终端操作。\n* `Optional<T> findAny()`\n    返回此流的第一个或任意元素，如果此流为空，则返回一个空的\
  \ `Optional`。这些是终端操作。\n* `boolean anyMatch(Predicate<? super T> predicate)`\n* `boolean\
  \ allMatch(Predicate<? super T> predicate)`\n* `boolean noneMatch(Predicate<? super\
  \ T> predicate)`\n    如果此流中的任何、所有或没有元素匹配给定的谓词，则返回 `true`。这些是终端操作。\n\n# 1.7. Optional\
  \ 类型\n\n`Optional<T>` 对象是类型 `T` 的对象或无对象的包装器。在前者情况下，我们说该值存在。`Optional<T>` 类型旨在作为类型\
  \ `T` 引用的更安全的替代方案，该引用要么指向一个对象，要么是 `null`。但只有在你正确使用它时，它才是安全的。接下来的三个章节将展示如何这样做。\n\n\
  ### 1.7.1. 获取 Optional 值\n\n有效使用 `Optional` 的关键是使用一种方法：在值不存在时产生替代值，或者仅在值存在时消费该值。\n\
  \n在本节中，我们来看第一种策略。通常，当没有匹配项时，你想使用一个默认值，可能是空字符串：\n\n```\nString result = optionalString.orElse(\"\
  \");\n    // 包装的字符串，如果没有，则返回 \"\"\n```\n\n你也可以调用代码来计算默认值：\n\n```\nString result\
  \ = optionalString.orElseGet(() -> System.getProperty(\"myapp.default\"));\n   \
  \ // 函数仅在需要时才被调用\n```\n\n或者，如果没有值，你可以抛出一个异常：\n\n```\nString result = optionalString.orElseThrow(IllegalStateException::new);\n\
  \    // 提供一个产生异常对象的方法\n```\n\n`java.util.Optional` 8\n\n* `T orElse(T other)`\n\
  \    返回此 `Optional` 的值，或者如果此 `Optional` 为空，则返回 `other`。\n* `T orElseGet(Supplier<?\
  \ extends T> other)`\n    返回此 `Optional` 的值，或者如果此 `Optional` 为空，则返回调用 `other` 的结果。\n\
  * `<X extends Throwable> T orElseThrow(Supplier<? extends X> exceptionSupplier)`\n\
  \    返回此 `Optional` 的值，或者如果此 `Optional` 为空，则抛出调用 `exceptionSupplier` 的结果。\n\n###\
  \ 1.7.2. 消费 Optional 值\n\n在前面的节中，你已经看到了如何在值不存在时产生替代值。处理可选值的另一种策略是仅在值存在时消费该值。\n\n\
  `ifPresent` 方法接受一个函数。如果 Optional 值存在，则将它传递给该函数。否则，什么都不会发生。\n\n```\noptionalValue.ifPresent(v\
  \ -> Process v);\n```\n\n例如，如果你想在值存在时将其添加到集合中，请调用：\n\n```\noptionalValue.ifPresent(v\
  \ -> results.add(v));\n```\n\n或者简单地使用：\n\n```\noptionalValue.ifPresent(results::add);\n\
  ```\n\n如果你想在 `Optional` 有值时执行一个操作，在没有值时执行另一个操作，请使用 `ifPresentOrElse`：\n\n```\noptionalValue.ifPresentOrElse(\n\
  \    v -> IO.println(\"Found \" + v),\n    () -> logger.warning(\"No match\"));\n\
  ```\n\n`java.util.Optional` 8\n\n* `void ifPresent(Consumer<? super T> action)`\n\
  \    如果此 `Optional` 不空，则将其值传递给 `action`。\n* `void ifPresentOrElse(Consumer<? super\
  \ T> action, Runnable emptyAction)` 9\n    如果此 `Optional` 不空，则将其值传递给 `action`，否则调用\
  \ `emptyAction`。\n\n### 1.7.3. Optional 值的管道化\n\n在前面的节中，你已经看到如何从 `Optional` 对象中获取值。另一种有效的策略是保持\
  \ `Optional` 完整。你可以通过使用 `map` 方法转换 `Optional` 内部的值：\n\n```\nOptional<Path> transformed\
  \ = optionalString.map(Path::of);\n```\n\n如果 `optionalString` 为空，那么 `transformed`\
  \ 也是空的。\n\n这个 `map` 方法类似于你拥有的 `Stream` 接口中的 `map` 方法。如果 `optionalString` 为空，那么 `transformed`\
  \ 也是空的。\n\n\n\n\n-   类型为 `Optional` 的方法参数是有待商榷。在请求值存在的常见情况下，它们会让调用变得不愉快。相反，可以考虑该方法的两个重载版本，一个带参数，一个不带参数。（另一方面，返回一个\
  \ `Optional` 是好的。它是指示函数可能没有结果的正确方式。）\n-   不要将 `Optional` 对象放入集合（set）中，也不要将其作为映射（map）的键。应该收集值。\n\
  \n`java.util.Optional`8\n\n- `T get()`\n- `T orElseThrow()`10\n返回此 `Optional` 的值，如果为空，则抛出\
  \ `NoSuchElementException`。\n- `boolean isEmpty()`11\n- `boolean isPresent()`\n\
  如果此 `Optional` 为空或不为空，则返回 `true`。\n\n### 1.7.5 创建 Optional 值\n\n到为止，我们讨论了如何使用别人创建的\
  \ `Optional` 对象。如果你想写一个创建 `Optional` 对象的方法，有几个静态方法可以实现此目的，包括 `Optional.of(result)`\
  \ 和 `Optional.empty()`。例如，\n\n```java\npublic static Optional<Double> inverse(Double\
  \ x) {\n    return x == 0 ? Optional.empty() : Optional.of(1 / x);\n}\n```\n\n`ofNullable`\
  \ 方法旨在作为从可能的 `null` 值到可选值的桥梁。如果 `obj` 不是 `null`，则 `Optional.ofNullable(obj)` 返回\
  \ `Optional.of(obj)`，否则返回 `Optional.empty()`。\n\n`java.util.Optional`8\n\n- `static\
  \ <T> Optional<T> of(T value)`\n- `static <T> Optional<T> ofNullable(T value)`\n\
  产生一个带有给定值的 `Optional`。如果 `value` 为 `null`，第一个方法将抛出 `NullPointerException`，而第二个方法产生一个空的\
  \ `Optional`。\n- `static <T> Optional<T> empty()`\n产生一个空的 `Optional`。\n\n### 1.7.6\
  \ 使用 `flatMap` 组合 Optional 值函数\n\n假设你有一个产生 `Optional<T>` 的方法 `f`，并且目标类型 `T` 拥有一个产生\
  \ `Optional<U>` 的方法 `g`。如果它们是普通方法，你可以通过调用 `s.f().g()` 来组合它们。但这种组合不可行，因为 `s.f()`\
  \ 的类型是 `Optional<T>`，而不是 `T`。相反，调用\n\n```java\nOptional<U> result = s.f().flatMap(T::g);\n\
  ```\n\n如果 `s.f()` 存在，则将 `g` 应用于它。否则，返回一个空的 `Optional<U>`。\n\n显然，如果你有更多产生 `Optional`\
  \ 值的方法或 lambda 表达式，你可以重复该过程。你可以通过链式调用 `flatMap` 来构建一个步骤流水线，该流水线只有在所有部分都成功时才会执行成功。\n\
  \n例如，考虑前一节中安全的 `inverse` 方法。假设我们还有一个安全的平方根方法：\n\n```java\npublic static Optional<Double>\
  \ squareRoot(Double x) {\n    return x < 0 ? Optional.empty() : Optional.of(Math.sqrt(x));\n\
  }\n```\n\n那么你可以这样计算 `inverse` 的平方根：\n\n```java\nOptional<Double> result = inverse(arg).flatMap(x\
  \ -> squareRoot(x));\n```\n\n我们可以通过从一个 `Optional` 开始让这样的链看起来更规则：\n\n```java\nOptional<Double>\
  \ result\n    = Optional.of(arg).flatMap(x -> inverse(x)).flatMap(x -> squareRoot(x));\n\
  ```\n\n使用方法表达式看起来甚至更整洁：\n\n```java\nOptional<Double> result\n    = Optional.of(arg).flatMap(this::inverse).flatMap(this::squareRoot);\n\
  ```\n\n如果 `inverse` 方法或 `squareRoot` 方法任一返回 `Optional.empty()`，则结果为空。\n\n在示例中（取自\
  \ Listing 1.3），`inverse` 和 `squareRoot` 方法是实例方法。因此，方法表达式以 `this::` 开头。如果这些是静态方法，将以\
  \ `ClassName::` 为前缀。\n\n你已经在 `Stream` 接口中见过 `flatMap` 方法（参见第 1.3 节）。该方法将产生流的方法映射到流的所有元素，然后展平产生的流之流。`Optional.flatMap`\
  \ 方法的工作原理相同。通过将产生可选的方法映射到可选值，你得到一个可选的可选，然后它被展平。\n\n`java.util.Optional`8\n\n- `<U>\
  \ Optional<U> flatMap(Function<? super T,? extends Optional<? extends U>> mapper)`\n\
  如果此 `Optional` 有值，则产生将 `mapper` 应用于该值的结果，否则产生一个空可选。\n\n### 1.7.7 将 Optional 转换为\
  \ Stream\n\n`stream` 方法将 `Optional<T>` 转换为具有零或一个元素的 `Stream<T>`。当然，为什么不呢，但你为什么需要它呢？\n\
  \n这对于返回 `Optional` 结果的方法非常有用。假设你有一个用户 ID 流和一个方法\n\n```java\nOptional<User> lookup(String\
  \ id)\n```\n\n你如何获取用户流并跳过那些无效的 ID？\n\n当然，你可以过滤掉无效的 ID，然后对剩余部分应用 `get`：\n\n```java\n\
  Stream<String> ids = . . .;\nStream<User> users = ids.map(Users::lookup)\n    .filter(Optional::isPresent)\n\
  \    .map(Optional::get);\n```\n\n但这使用了我们警告过的 `isPresent` 和 `get` 方法。更优雅的方法是调用\n\
  \n```java\nStream<User> users = ids.map(Users::lookup)\n    .flatMap(Optional::stream);\n\
  ```\n\n每次调用 `stream` 返回一个包含零或一个元素的流。`flatMap` 方法将它们合并。这意味着不存在的用户被丢弃了。\n\n在本节中，我们考虑的是返回\
  \ `Optional` 值的理想情况。如今，许多方法在没有有效结果时返回 `null`。假设 `Users.classicLookup(id)` 返回一个 `User`\
  \ 对象或 `null`，而不是 `Optional<User>`。那么你可以直接过滤掉 `null` 值：\n\n```java\nStream<User>\
  \ users = ids.map(Users::classicLookup)\n    .filter(Objects::nonNull);\n```\n\n\
  但如果你更喜欢 `flatMap` 方法，可以使用\n\n```java\nStream<User> users = ids.flatMap(\n    id\
  \ -> Stream.ofNullable(Users.classicLookup(id)));\n```\n\n或者\n\n```java\nStream<User>\
  \ users = ids.map(Users::classicLookup)\n    .flatMap(Stream::ofNullable);\n```\n\
  \n调用 `Stream.ofNullable(obj)` 在 `obj` 为 `null` 时产生一个空流，否则产生一个仅包含 `obj` 的流。\n\nListing\
  \ 1.3 中的示例程序演示了 `Optional` API。\n\nListing 1.3 v2ch01/optional/OptionalDemo.java\n\
  \n\n\n\n\n```java\npackage v2ch01.optional;\n\nimport module java.base;\n\nclass\
  \ OptionalDemo {\n    void main() throws Exception {\n        String contents =\
  \ Files.readString(Path.of(\"gutenberg\", \"alice30.txt\"));\n        List<String>\
  \ wordList = List.of(contents.split(\"\\\\PL+\"));\n\n        Optional<String> optionalValue\
  \ = wordList\n                .stream()\n                .filter(s -> s.contains(\"\
  fred\"))\n                .findFirst();\n        IO.println(optionalValue.orElse(\"\
  No word\") + \" contains fred\");\n\n        Optional<String> optionalString = Optional.empty();\n\
  \        String result = optionalString.orElse(\"N/A\");\n        IO.println(\"\
  result: \" + result);\n        result = optionalString.orElseGet(() -> Locale.getDefault().getDisplayName());\n\
  \        IO.println(\"result: \" + result);\n        try {\n            result =\
  \ optionalString.orElseThrow(IllegalStateException::new);\n            IO.println(\"\
  result: \" + result);\n        }\n        catch (Throwable t) {\n            t.printStackTrace(System.out);\n\
  \        }\n\n        optionalValue = wordList.stream().filter(s -> s.contains(\"\
  red\")).findFirst();\n        optionalValue.ifPresent(s -> IO.println(s + \" contains\
  \ red\"));\n\n        var results = new HashSet<String>();\n        optionalValue.ifPresent(results::add);\n\
  \        Optional<Boolean> added = optionalValue.map(results::add);\n        IO.println(added);\n\
  \n        IO.println(inverse(4.0).flatMap(this::squareRoot));\n        IO.println(inverse(-1.0).flatMap(this::squareRoot));\n\
  \        IO.println(inverse(0.0).flatMap(this::squareRoot));\n        Optional<Double>\
  \ result2 = Optional.of(-4.0)\n                .flatMap(this::inverse)\n       \
  \         .flatMap(this::squareRoot);\n        IO.println(result2);\n    }\n\n \
  \   Optional<Double> inverse(Double x) {\n        return x == 0 ? Optional.empty()\
  \ : Optional.of(1 / x);\n    }\n\n    Optional<Double> squareRoot(Double x) {\n\
  \        return x < 0 ? Optional.empty() : Optional.of(Math.sqrt(x));\n    }\n}\n\
  ```\n\n`java.util.Optional` 8\n\n- `Optional<U> flatMap(Function<? super T,Optional<U>>\
  \ mapper)` 9\n返回将 `mapper` 应用于此 `Optional` 的值的结果；如果此 `Optional` 为空，则返回一个空的 `Optional`。\n\
  \n## 1.8. 收集结果\n\n当你完成流（stream）完成后，通常想要查看结果。你可以调用 `iterator` 方法，它会返回一个传统的迭代器，你可以使用它来访问元素。\n\
  \n或者，你可以调用 `forEach` 方法将函数应用到每个元素上：\n\n```\nstream.forEach(IO::println);\n```\n\n\
  在并行流上，`forEach` 方法以任意顺序遍历元素。如果你想按流的顺序处理它们，请调用 `forEachOrdered`。当然，你可能会因此放弃部分或全部并行带来的益处。\n\
  \n但通常情况下，你想要将结果收集到数据结构中。你已经看到过 `toList` 方法，它产生一个流元素的列表。\n\n调用 `toArray` 来获取流元素的数组。\n\
  \n由于无法在运行时创建泛型数组，表达式 `stream.toArray()` 返回一个 `Object[]` 数组。如果你需要正确类型的数组，请传入数组构造函数：\n\
  \n```\nString[] result = stream.toArray(String[]::new);\n// stream.toArray() 的类型为\
  \ Object[]\n```\n\n为了将结果收集到其他数据结构中，`Stream` 接口有一个泛型 `collect` 方法。你可以将结果连接成字符串，将其存储在任何集合中，并将其插入映射（maps）中。通过实现自己的收集器（collector），你可以以任意方式消耗流数据。你将在后续章节中看到详细信息。\n\
  \n`java.util.stream.BaseStream` 8\n\n- `Iterator<T> iterator()`\n返回一个用于获取此流元素的迭代器。这是一个终端操作。\n\
  \n`java.util.stream.Stream<T>` 8\n\n- `List<T> toList()` 16\n返回此流中元素的列表。\n\n- `void\
  \ forEach(Consumer<? super T> action)`\n在流的每个元素上调用 `action`。\n\n- `Object[] toArray()`\n\
  \n- `<A> A[] toArray(IntFunction<A[]> generator)`\n返回一个对象数组，或者当传入构造引用 `A[]::new`\
  \ 时返回类型 `A` 的数组。这些都是终端操作。\n\n- `<R,A> R collect(Collector<? super T,A,R> collector)`\n\
  使用给定的收集器收集流中的元素。`Collectors` 类为许多收集器提供了工厂方法。\n\n## 1.9. 收集器 (Collectors)\n\n为了将流元素收集到另一个目标，有一个方便的\
  \ `collect` 方法，它接收 `Collector` 接口的实例。`collector` 是一个积累元素并产生结果的对象。`Collectors` 类为常见的收集器提供了大量的工厂方法。\n\
  \n假设你想通过连接字符串收集流中的所有字符串。你可以调用：\n\n```\nString result = stream.collect(Collectors.joining());\n\
  ```\n\n如果你想在元素之间添加分隔符，将其传递给 `joining` 方法：\n\n```\nString result = stream.collect(Collectors.joining(\"\
  , \"));\n```\n\n如果你的流包含字符串以外的对象，你需要先将它们转换为字符串，如下：\n\n```\nString result = stream.map(Object::toString).collect(Collectors.joining(\"\
  , \"));\n```\n\n如果你想将流结果归约为和、计数、平均值、最大值或最小值，请使用 `summarizing`(`Int`|`Long`|`Double`)\
  \ 方法。这些方法接收一个流对象映射到数字的函数，并产生类型为 (`Int`|`Long`|`Double`）`SummaryStatistics` 的结果，同时计算和、计数、平均值、最大值和最小值。\n\
  \n```\nIntSummaryStatistics summary = stream.collect(\n    Collectors.summarizingInt(String::length));\n\
  double averageWordLength = summary.getAverage();\ndouble maxWordLength = summary.getMax();\n\
  ```\n\n注意，你并不是在流上调用 `joining` 和 `summarizingInt` 方法。这些是 `Collectors` 类的静态方法。它们产生\
  \ `Collector` 实例，你将其传递给 `Stream` 接口的 `collect` 方法。\n\n`joining` 收集器产生字符串，而汇总收集器产生四个数字。然而，大多数收集器将值收集在数据结构中，正如你将在后续章节看到的。\n\
  \n示例程序 Listing1.5 展示了如何从流中收集元素。\n\nListing 1.4 v2ch01/collecting/CollectingResults.java\n\
  \n\n\n\n\n```java\npackage v2ch01.collecting;\n\nimport module java.base;\n\nclass\
  \ CollectingResults {\n    void main() throws Exception {\n        // 将流转换为迭代器\n\
  \        Iterator<Integer> iter = Stream.iterate(0, n -> n + 1).limit(10).iterator();\n\
  \        while (iter.hasNext())\n            IO.println(iter.next());\n\n      \
  \  Object[] numbers = Stream.iterate(0, n -> n + 1).limit(10).toArray();\n     \
  \   IO.println(\"Object array: \" + numbers + \" \" + Arrays.toString(numbers));\n\
  \        // 注意这是一个 Object[] 数组\n\n        try {\n            var number = (Integer)\
  \ numbers[0]; // OK\n            IO.println(\"number: \" + number);\n          \
  \  IO.println(\"以下语句将抛出异常:\");\n            var _ = (Integer[]) numbers; // 抛出异常\n\
  \        }\n        catch (ClassCastException e) {\n            IO.println(e);\n\
  \        }\n\n        Integer[] numbers3 = Stream.iterate(0, n -> n + 1).limit(10).toArray(Integer[]::new);\n\
  \        IO.println(\"Integer array: \" + numbers3 + \" \" + Arrays.toString(numbers3));\n\
  \        // 注意这是一个 Integer[] 数组\n\n        String result = noVowels().limit(10).collect(Collectors.joining());\n\
  \        IO.println(\"Joining: \" + result);\n        result = noVowels().limit(10).collect(Collectors.joining(\"\
  , \"));\n        IO.println(\"Joining with commas: \" + result);\n\n        IntSummaryStatistics\
  \ summary = noVowels()\n                .collect(Collectors.summarizingInt(String::length));\n\
  \        double averageWordLength = summary.getAverage();\n        double maxWordLength\
  \ = summary.getMax();\n        IO.println(\"Average word length: \" + averageWordLength);\n\
  \        IO.println(\"Max word length: \" + maxWordLength);\n        IO.println(\"\
  forEach:\");\n        noVowels().limit(10).forEach(IO::println);\n    }\n\n    Stream<String>\
  \ noVowels() throws IOException {\n        String contents = Files.readString(Path.of(\"\
  gutenberg\", \"alice30.txt\"));\n        Stream<String> words = Stream.of(contents.split(\"\
  \\\\PL+\"));\n        return words.map(s -> s.replaceAll(\"[aeiouAEIOU]\", \"\"\
  ));\n    }\n\n    <T> void show(String label, Set<T> set) {\n        IO.print(label\
  \ + \": \" + set.getClass().getName());\n        IO.println(\"[\"\n            +\
  \ set.stream().limit(10).map(Object::toString).collect(Collectors.joining(\", \"\
  ))\n            + \"]\");\n    }\n}\n```\n\n`java.util.stream.Collectors`8\n\n*\
  \   `static Collector<CharSequence,?,String> joining()`\n*   `static Collector<CharSequence,?,String>\
  \ joining(CharSequence delimiter)`\n*   `static Collector<CharSequence,?,String>\
  \ joining(CharSequence delimiter, CharSequence prefix, CharSequence suffix)`\n\n\
  \    返回一个连接字符串的收集器。分隔符放置于字符串之间，前缀和后缀分别置于第一个字符串之前和最后一个字符串之后。如果未指定，它们为空字符串。\n\n* \
  \  `static <T> Collector<T,?,IntSummaryStatistics> summarizingInt(ToIntFunction<?\
  \ super T> mapper)`\n*   `static <T> Collector<T,?,LongSummaryStatistics> summarizingLong(ToLongFunction<?\
  \ super T> mapper)`\n*   `static <T> Collector<T,?,DoubleSummaryStatistics> summarizingDouble(ToDoubleFunction<?\
  \ super T> mapper)`\n\n    返回产生（`Int`|`Long`|`Double`）`SummaryStatistics` 对象的收集器，可以通过该对象获取将\
  \ `mapper` 应用于每个元素的结果计数、总和、平均值、最大值和最小值。\n\n`java.util.IntSummaryStatistics`8\n\n\
  `java.util.LongSummaryStatistics`8\n\n`java.util.DoubleSummaryStatistics`8\n\n*\
  \   `long getCount()`\n\n    返回汇总元素的计数。\n*   `xxx` `getSum()`\n*   `double getAverage()`\n\
  \n    返回汇总元素的总和或平均值，如果没有元素，则返回零。\n*   `xxx` `getMax()`\n*   `xxx` `getMin()`\n\n\
  \    返回汇总元素的最大值或最小值，如果没有元素，则返回（`Integer`|`Long`|`Double`）的（`MAX`|`MIN`）`_VALUE`。\n\
  \n### 1.9.1. 收集到集合\n\n在 Java 16 引入 `toList` 方法之前，你必须使用由 `Collectors.toList()` 产生的收集器：\n\
  \n```\nList<String> result = stream.collect(Collectors.toList());\n```\n\n同样，以下是如何将流元素收集到集合中的：\n\
  \n```\nSet<String> result = stream.collect(Collectors.toSet());\n```\n\n这些调用会给你一个列表或集合，但你无法进行进一步的假设。该集合可能是不可变的、可序列化的或线程安全的。如果你想控制获取的是哪种集合，请改用以下调用：\n\
  \n```\nTreeSet<String> result = stream.collect(Collectors.toCollection(TreeSet::new));\n\
  ```\n\nListing 1.5 中的示例程序展示了如何将流元素放入集合。\n\nListing 1.5 v2ch01/collecting/CollectingResults.java\n\
