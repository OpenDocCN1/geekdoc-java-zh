  \ b)`\n    如果此键在 `b` 之前，则返回负值；如果视为相同，则返回 0；否则返回正值。\n\n*   `static String normalize(CharSequence\
  \ str, Form)`\n    返回 `str` 的归一化形式。`form` 是 `NFD`、`NFKD`、`NFC` 或 `NFKC` 之一。\n\n\
  ## 7.5 Formatting\n\n`MessageFormat` 类允许你为占位符替换值。它类似于 `printf`，但支持语言环境和格式。这是一个典型的消息字符串：\n\
  \n```\n\"On {2}, {0} destroyed {1} houses and caused.\"\n```\n\n在这个示例中，占位符 `{0}`\
  \ 被替换为 `\"hurricane\"`，`{1}` 被替换为 `99`。\n\n### 7.5.1 Formatting Numbers and Dates\n\
  \n这里有一个示例：\n\n```java\nString msg = MessageFormat.format(\"On {2,date,long}, {0}\
  \ destroyed {1} houses and caused {3,number.currency}.\",\n    \"hurricane\", 99,\
  \ new GregorianCalendar(1999, 0, 1).getTime());\n```\n\n这个示例输出：\n```\nOn 1, 1999,\
  \ a hurricane destroyed 99 houses and caused $100,000.00.\n```\n\n这只是一个开始，但并不完美。我们不想显示时间“12:00\
  \ AM”，并且希望以货币格式打印金额。我们的做法是为某些占位符提供可选格式：\n\n```java\nString msg = MessageFormat.format(\"\
  On {2,date,short}, {0} destroyed {1} houses and caused {3,number.currency}.\",\n\
  \    \"hurricane\", 99, new GregorianCalendar(1999, 0, 1).getTime());\n```\n\n这个示例输出：\n\
  ```\nOn 1/1/99, a hurricane destroyed 99 houses and caused $100,000.00.\n```\n\n\
  通常，占位符索引后面可以跟着一个*类型*和一个*样式*。用逗号分隔索引、类型和样式。类型可以是任意一种：\n\n```\nnumber\ntime\ndate\n\
  choice\n```\n\n如果类型是 `number`，则样式可以是：\n\n```\ninteger\ncurrency\npercent\n```\n\n\
  或者它可以是一个 `DecimalFormat` 模式，例如 `$,##0`——参见第 7.2.2 节可能的格式。\n\n如果类型是 `time` 或 `date`，则样式可以是：\n\
  \n```\nshort\nmedium\nlong\nfull\n```\n\n或者日期格式模式，例如 `yyyy-MM-dd`。（查看 `SimpleDateFormat`\
  \ 类的文档获取可能的格式。）\n\n要在消息格式字符串中包含大括号，请用单引号将其括起来，例如：`\"A {0} 被包含在 '{' 和 '}' 符号之间\"\
  `。对于文本，最好使用弯引号：`\"{0}’s 喜欢的符号是大括号\"`。但如果你必须使用直单引号，则需要双写它们：\n\n```java\nString template\
  \ = \"<a href=''{0}''>{1}</a>\";\n```\n\n\n\n\n静态方法 `MessageFormat.format` 使用当前语言区域来格式化值。要使用任意语言区域进行格式化，你必须多花功夫，因为没有可以使用的“可变参数”方法。你需要将要格式化的值放入\
  \ `Object[]` 数组中，如下所示：\n\n```\nvar formatter = new MessageFormat(pattern, locale);\n\
  String message = formatter.format(new Object[] { values });\n```\n\n`java.text.MessageFormat`1.1\n\
  \n*   `MessageFormat(String pattern)`\n*   `MessageFormat(String pattern, Locale\
  \ locale)`\n    使用指定的模式和语言区域构造消息格式对象。\n*   `void applyPattern(String pattern)`\n\
  \    将消息格式对象的模式设置为指定的模式。\n*   `void setLocale(Locale locale)`\n*   `Locale getLocale()`\n\
  \    设置或获取用于消息中占位符的语言区域。该语言区域仅用于通过 `applyPattern` 方法设置的后续模式。\n*   `static String\
  \ format(String pattern, Object... args)`\n    使用 `args[i]` 作为占位符 `{i}` 的输入来格式化模式字符串。\n\
  *   `StringBuffer format(Object args, StringBuffer result, FieldPosition pos)`\n\
  \    格式化此 `MessageFormat` 的模式。`args` 参数必须是一个对象数组。格式化后的字符串附加到 `result` 并返回 `result`。如果\
  \ `pos` 等于 `new FieldPosition(MessageFormat.Field.ARGUMENT)`，它的 `beginIndex` 和 `endIndex`\
  \ 属性将被设置为替换 `{1}` 占位符文本的位置。如果你对位置信息感兴趣，请提供 `null`。\n\n`java.text.Format`1.1\n\n\
  *   `String format(Object obj)`\n    根据此格式器的规则格式化给定对象。此方法调用 `format(obj, new StringBuffer(),\
  \ new FieldPosition(0)).toString()`。\n\n### 7.5.2. 选择格式 (Choice Formats)\n\n让我们仔细观察上一节的模式：\n\
  \n```\n\"On {2}, a {0} destroyed {1} houses and caused {3} of damage.\"\n```\n\n\
  如果我们将灾害占位符 `{0}` 替换为 `\"earthquake\"`，这个句子在英语中语法上是不正确的：\n\n```\nOn January 1, 1999,\
  \ a earthquake destroyed . . .\n```\n\n我们真正想做的是将冠词“a”整合到占位符中：\n\n```\n\"On {2},\
  \ {0} destroyed {1} houses and caused {3} of damage.\"\n```\n\n此时 `{0}` 将替换为 `\"\
  a hurricane\"` 或 `\"an earthquake\"`。如果这条消息需要翻译成一种单词性别会影响冠词的语言，这将特别恰当。例如，在德语中，模式将是：\n\
  \n```\n\"{0} zerstörte am {2} {1} Häuser und richtete einen Schaden von {3} an.\"\
  \n```\n\n占位符将被替换为冠词和名词的组合，例如 `\"Ein Wirbelsturm\"` 或 `\"Eine Naturkatastrophe\"\
  `。\n\n现在让我们转向 `{1}` 参数。如果灾害并不那么严重，`{1}` 可能会被替换为数字 1，消息将是：\n\n```\nOn January 1,\
  \ 1999, a mudslide destroyed 1 houses and . . .\n```\n\n理想情况下，我们希望消息根据占位符的值而变化，这样它应该是：\n\
  \n```\nno houses\none house\n2 houses\n. . .\n```\n\n取决于占位符的值。`choice` 格式化选项正是为此设计的。\n\
  \n选择格式是一系列对，每对都包含：\n\n*   一个下限\n*   一个格式字符串\n\n下限和格式字符串之间用 `#` 字符分隔，对之间用 `|` 字符分隔。\n\
  \n例如：\n\n```\n{1,choice,0#no houses|1#one house|2#{1} houses}\n```\n\n表 7.10 显示了此格式字符串对于不同\
  \ `{1}` 值的效果。\n\n表 7.10：由选择格式格式化的字符串\n\n| `{1}` | 结果 | `{1}` | 结果 |\n| --- | ---\
  \ | --- | --- |\n| `0` | `\"no houses\"` | `3` | `\"3 houses\"` |\n| `1` | `\"one\
  \ house\"` | `-1` | `\"no houses\"` |\n\n为什么我们在格式字符串中使用了两次 `{1}`？当消息格式对 `{1}` 占位符应用选择格式且值为\
  \ `2` 时，选择格式返回 `\"{1} houses\"`。该字符串然后由消息格式再次格式化，答案被拼接到结果中。\n\n这个示例说明选择格式的设计者有点糊涂。如果你有三个格式字符串，你需要两个界限来分隔它们。通常情况下，你需要的界限比格式字符串的数量少一个。正如你在表\
  \ 7.10 中所示，`MessageFormat` 类忽略了第一个界限。\n\n如果该类的设计者意识到界限应该位于选项之间，语法将会清晰得多，例如：\n\n\
  ```\nno houses|1|one house|2|{1} houses // true 实际格式\n```\n\n你可以使用 `<` 符号来表示如果下限严格小于值，则选择该选项。\n\
  \n你也可以使用 `<` 符号来表示如果下限严格小于值，则选择该选项。（等等，提示文本此处有重复，我将遵循所提供的文本逻辑）。\n\n你也可以使用 `<` 符号来表示如果下限严格小于值，则选择该选项。（实际上，查看提供的文本：“你也可以使用\
  \ `<` 符号来表示如果下限严格小于值，则选择该选项。”）\n\n等等，源代码文本说：\n\"You can use the `<` symbol to denote\
  \ that a choice should be selected if the lower bound is strictly less than the\
  \ value.\nYou can also use the `<` symbol to denote that a choice should be selected\
  \ if the lower bound is strictly less than the value.\"（用户文本有一句重复的，我将保留内容但调整格式）。\n\
  \n实际上，查看提供的文本：“你也可以使用 `<` 符号来表示如果下限严格小于值，则选择该选项。（实际上，查看提供的文本：文本中包含了类似 `≤` 和 `∞`\
  \ 的符号）。\n\n\n\n\n\n若要猜测用户偏好的编码，可以使用源自执行 Java 虚拟机的系统的“原生编码”。从 Java 18 开始，其名称为系统属性\
  \ `native.encoding` 的值。\n\n在 Java 18 之前，原生编码是默认字符集，你可以通过静态方法 `Charset.defaultCharset()`\
  \ 获取它。\n\n### 7.7.2. 行结束符\n\n这不是本地化的问题，而是平台的问题。在 Windows 上，文本文件期望在每行末尾使用 `\\r\\\
  n`，而基于 UNIX 的系统只需要一个 `\\n` 字符。如今，大多数 Windows 程序可以仅处理 `\\n`，但旧程序和控制台可能会给你的用户带来麻烦。\n\
  \n任何使用 `println` 方法写入的行都会被正确终止。唯一的问题是你打印了包含 `\\n` 字符的字符串。它们不会被自动修改为平台的行结束符。\n\n\
  与其在字符串中使用 `\\n`，你可以使用 `printf` 和 `%n` 格式说明符产生依赖于平台的行结束符。例如，\n\n```\nout.printf(\"\
  Hello%nWorld%n\");\n```\n\n在 Windows 上产生\n\n```\nHello\\r\\nWorld\\r\\n\n```\n\n\
  在其他地方产生\n\n```\nHello\\nWorld\\n\n```\n\n### 7.7.3. 控制台\n\n如果你编写通过 `IO`、`System.in`/`System.out`\
  \ 或 `System.console()` 与用户通信的程序，你必须面对控制台可能使用与默认字符集不同的编码的可能性。这在 Windows 上使用 `cmd`\
  \ 命令行时尤为明显。在美版 Windows 11 中，命令提示符仍使用过时的 `IBM437` 编码，它起源于 1982 年的 IBM 个人电脑。`Charset.defaultCharset()`\
  \ 方法将返回 `Windows-1252` 字符集，这非常不同。例如，欧元符号 € 存在于 `Windows-1252` 中，但在 `IBM437` 中并不。当你调用\n\
  \n```\nIO.println(\"100 €\");\n```\n\n控制台将显示\n\n```\n100 ?\n```\n\n理想情况下，你的用户应该将控制台切换到\
  \ UTF-8。在 Windows 中，命令是\n\n```\nchcp 65001\n```\n\n从 Java 18 开始，这就足够让 Java 在控制台中使用\
  \ UTF-8。在之前的版本中，还有必要用系统属性 `file.encoding` 设置平台编码：\n\n```\njava -Dfile.encoding=UTF-8\
  \ MyProgram\n```\n\n如果你无法让用户更改控制台的字符编码，你可以查出它是什么。从 Java 18 开始，系统属性 `stdout.encoding`\
  \ 和 `stderr.encoding` 为你提供这些信息。你也可以在命令行上更改设置。\n\n你也可以调用 `System.console().charset()`，前提是\
  \ `System.console()` 不为 `null`。\n\n如果你从 `new Scanner(System.in)` 获取用户输入，扫描器使用默认字符集而不是控制台编码。如果它们不匹配，则键盘输入将无法工作。如果\
  \ `System.console()` 不为 `null`，请使用 `new Scanner(System.console().reader())` 代替。\n\
  \n### 7.7.4. UTF-8 字节顺序标记\n\n如前所述，在可能的情况下对文本文件使用 UTF-8 是一个好习惯。然而，如果你的应用程序必须读取其他程序创建的\
  \ UTF-8 文本文件，你就会遇到另一个潜在问题。将“字节顺序标记”字符 `U+FEFF` 作为文件的第一个字符是完全合法的。在 UTF-16 编码中，每个代码单元是两个字节，字节顺序标记告诉读取器文件使用的是“大端序”还是“小端”字节序。UTF-8\
  \ 是单字节编码，因此不需要指定字节序。但如果文件以字节 `0xEF 0xBB 0xBF`（`U+FEFF` 的 UTF-8 编码）开头，这是使用 UTF-8\
  \ 的强烈指示。由于这个原因，Unicode 标准鼓励这种做法。任何读取器都应该忽略初始的字节顺序标记。\n\n这中唯一的瑕疵是 Oracle Java 实现固执地拒绝遵循\
  \ Unicode 标准，理由是潜在的兼容性问题。这意味着你，作为程序员，必须做平台不愿做的事情。当你读取文本文件并在开头遇到 `U+FEFF` 时，请忽略它。\n\
  \n遗憾的是，JDK 实现者并没有遵循这一建议。当你向 `javac` 编译器传递一个以字节顺序标记开头的有效 UTF-8 源文件时，编译将失败并带有错误信息“illegal\
  \ character: \\65279”。\n\n### 7.7.5. 源文件的字符编码\n\n你，作为程序员，需要与 Java 编译器通信——你通过本地系统上的工具做到这一点。例如，如果你使用中文或日语版的\
  \ Windows，你的 Java 源代码文件可能是用本地字符编码的。此类源代码文件是*不可移植的*。（只有编译后的类文件是可移植的——它们对标识符和字符串使用“修改\
  \ UTF-8”编码。）\n\n不可移植的源文件不是理想的。如今，配置文本编辑器和开发环境对源文件使用 UTF-8 很容易。从 Java 18 开始，`javac`\
  \ 编译器默认期望 UTF-8 编码的源文件。对于早期版本，请指定编码：\n\n```\njavac -encoding UTF-8 MyProgram.java\n\
  ```\n\n## 7.8. 资源包\n\n在对应用程序本地化时，你会产生一组*资源包*（resource bundles）。每个资源包都是一个属性文件或类，描述了特定本地的的项目（如消息、标签等）。对于每个资源包，你都必须为你想要支持的所有本地地区提供版本。\n\
  \n你需要为这些资源包使用特定的命名约定。例如，针对德国的资源进入文件 `baseName_de_DE`，而所有德语国家共享的资源进入 `baseName_de`。通常，对所有特定国家的资源使用\
  \ `baseName_language_country`，对所有特定语言的资源使用 `baseName_language`。最后作为回退，你可以将默认值放在没有任何后缀的文件中。\n\
  \n### 7.8.1. 定位资源包\n\n`ResourceBundle.getBundle` 方法尝试加载与当前语言和国家本地地区匹配的资源包。如果未成功，将依次丢弃国家和语言。然后对默认本地地区应用相同的搜索，最后查询默认资源包文件。即使该尝试也失败，该方法也会抛出\
  \ `MissingResourceException`。\n\n要加载资源包，请使用命令：\n\n```\nResourceBundle currentResources\
  \ = ResourceBundle.getBundle(baseName, currentLocale);\n```\n\n也就是说，`getBundle`\
  \ 方法尝试加载以下资源包：\n\n\n\n\n\n```\nbaseName_currentLocaleLanguage_currentLocaleCountry\n\
  baseName_currentLocaleLanguage\nbaseName_defaultLocaleLanguage_defaultLocaleCountry\
  \ \nbaseName_defaultLocaleLanguage\nbaseName\n```\n\n一旦 `getBundle` 方法定位了一个资源包（例如，`baseName_de_DE`），它仍然会继续寻找\
  \ `baseName_de` 和 `baseName`。如果这些包存在，它们将成为 `resource hierarchy`（资源层次结构）中 `baseName_de_DE`\
  \ 包的 `parents`（父节点）。之后在查找资源时，如果从当前包中查找未成功，则会搜索父节点。也就是说，如果在 `baseName_de_DE` 中没有找到特定的资源，则也会查询\
  \ `baseName_de` 和 `baseName`。\n\n这显然是一个非常有用的服务——如果手动编写，将会非常繁琐。Java 编程语言的资源包机制会自动定位与给定\
  \ locale（语言区域）最匹配的项。向现有程序中添加越来越多的本地化内容是很容易的——你只需要创建额外的资源包即可。\n\n如果一个 locale 包含脚本（script）或变体（variant），查找过程将变得复杂得多。更多细节请参阅\
  \ `ResourceBundle.Control.getCandidateLocales` 方法的文档。\n\n你不需要将应用程序的所有资源都放在一个包中。你可以为按钮标签创建一个包，为错误消息创建一个包，以此此类推。\n\
  \n### 7.8.2. Property Files\n\n字符串的国际化非常简单。你将所有字符串放入一个属性文件中，例如 `MyProgramStrings.properties`。这只是一个简单的文本文件，每行一个键值对。一个典型文件如下：\n\
  \n```\ncomputeButton=Rechnen\ncolorName=black\ndefaultPaperSize=210×297\n```\n\n\
  然后，按照前一节描述命名你的属性文件，例如：\n\n```\nMyProgramStrings.properties\nMyProgramStrings_en.properties\n\
  MyProgramStrings_de_DE.properties\n```\n\n你可以简单地加载资源包：\n\n```java\nResourceBundle\
  \ bundle = ResourceBundle.getBundle(\"MyProgramStrings\", locale);\n```\n\n要查找特定字符串，请调用\n\
  \n```java\nString computeButtonLabel = bundle.getString(\"computeButton\");\n```\n\
  \n属性文件以 UTF-8 编码。\n\n在 Java 9 之前，用于存储属性的文件必须是 ASCII 文件，非 ASCII 字符必须使用 `\\uxxxx`\
  \ 表示法进行编码。例如，`\"colorName=Grün\"` 必须指定为：\n\n```\ncolorName=Gr\\u00FCn\n```\n\n###\
  \ 7.8.3. Bundle Classes\n\n为了提供不是字符串的资源，请定义扩展 `ResourceBundle` 类的类。使用标准命名规范来命名你的类，例如：\n\
  \n```\nMyProgramResources.java\nMyProgramResources_en.java\nMyProgramResources_de_DE.java\n\
  ```\n\n使用与加载属性文件相同的 `getBundle` 方法加载该类：\n\n```java\nResourceBundle bundle = ResourceBundle.getBundle(\"\
  MyProgramResources\", locale);\n```\n\n在搜索资源包时，当两个包具有相同的基础名称时，类中的资源包优先级高于属性文件。\n\
  \n每个资源包类都实现了一个查找表。你需要为每个想要本地化的设置提供一个键字符串，并使用该键字符串来检索该设置。例如：\n\n```java\nvar backgroundColor\
  \ = (Color) bundle.getObject(\"backgroundColor\");\ndouble[] paperSize = (double[])\
  \ bundle.getObject(\"defaultPaperSize\");\n```\n\n实现资源包类简单的方法是扩展 `ListResourceBundle`\
  \ 类。`ListResourceBundle` 允许你将所有资源放入对象数组中，然后为你完成查找。遵循以下代码框架：\n\n```java\npublic class\
  \ baseName_language_country extends ListResourceBundle {\n    private static final\
  \ Object[][] contents = {\n        { key1, value2 },\n        { key2, value2 },\n\
  \        . . .\n    }\n    public Object[][] getContents() { return contents; }\n\
  }\n```\n\n例如：\n\n```java\npublic class ProgramResources_de extends ListResourceBundle\
  \ {\n    private static final Object[][] contents = {\n        { \"backgroundColor\"\
  , Color.black },\n        { \"defaultPaperSize\", new double[] { 210, 297 } }\n\
  \    }\n    public Object[][] getContents() { return contents; }\n}\n\npublic class\
  \ ProgramResources_en_US extends ListResourceBundle {\n    private static final\
  \ Object[][] contents = {\n        { \"backgroundColor\", Color.blue },\n      \
  \  { \"defaultPaperSize\", new double[] { 216, 279 } }\n    }\n    public Object[][]\
  \ getContents() { return contents; }\n}\n```\n\n纸张尺寸以毫米为单位。除了美国和加拿大，地球上所有人都使用 ISO\
  \ 216 纸张尺寸。更多信息请访问 [`www.cl.cam.ac.uk/~mgk25/iso-paper.html`](https://www.cl.cam.ac.uk/~mgk25/iso-paper.html)。\n\
  \n或者，你的资源包类也可以扩展 `ResourceBundle` 类。这时你需要实现两个方法：列出所有键以及为给定键查找值：\n\n```java\nEnumeration<String>\
  \ getKeys()\nObject handleGetObject(String key)\n```\n\n`ResourceBundle` 类的 `getObject`\
  \ 方法会调用你提供的 `handleGetObject` 方法。\n\n`java.util.ResourceBundle`\n\n- `static ResourceBundle\
  \ getBundle(String baseName, locale)`\n- `static ResourceBundle getBundle(String\
  \ baseName)`\n- `Object getObject(String name)`\n- `String getString(String name)`\n\
  - `String[] getStringArray(String name)`\n- `Enumeration<String> getKeys()`\n- `Object\
  \ handleGetObject(String key)`\n\n### 7.9. 完整示例\n\n在本节中，我们将本章的材料应用于本地化一个退休计算器。该程序计算你为退休储蓄了足够的资金。你可以输入年龄、每月储蓄金额等（见图\
  \ 7.4）。\n\n![Figure](img/fig05-04.jpg) 7.4: 英文版的退休计算器\n\n文本区域和图表显示退休账户 yearly 余额。如果数字在生活后期变为负数，且图中的条形出现在\
  \ x 轴下方，说明你需要做些什么——例如，存更多的钱、推迟退休、早日去世或年轻一些。\n\n该退休计算器支持三种 locale（英语、德语和中文）。以下是国际化的亮点：\n\
  \n- 标签、按钮和消息被翻译成了德语和中文。你可以在 `RetireResources_de` 和 `RetireResources_zh` 类中找到它们。英语作为备用——参见\
  \ `RetireResources` 文件。\n- 每当 locale 变化时，我们会重置标签并重新格式化字段的内容。\n- 文本字段按本地格式处理数字、货币金额和百分比。\n\
  - 计算字段使用 `MessageFormat`。格式字符串存储在每个语言的资源包中。\n- 为了演示可行性，我们根据用户选择的语言为条形图使用不同的颜色。\n\
  \n\n\n\n\n图 7.5 显示了德语输出。要查看中文（如图 7.6 所示），请确保您的 Java 运行时已安装并配置了中文字符。否则，中文将显示为“缺失字符”图标。\n\
  \n列表 7.4 显示了简化文本版本的代码，遗憾的是没有颜色。列表 7.5 是英语字符串的属性文件。本地化后的字符串位于列表 7.6（德语）和列表 7.7（中文）。\n\
  \n![Figure](img/fig05-05.jpg)图 7.5: 德语版的退休计算器![Figure](img/fig05-06.jpg)图 7.6: 中文版的退休计算器\n\
  \n### 列表 7.4 `v2ch07/retire2/Retire2.java`\n\n```java\npackage v2ch07.retire2;\n\
  \nimport module java.base;\n\nimport v2ch07.util.Choices;\n\n/**\n * 此程序显示了一个退休计算器。提示用英语、德语或中文显示。\n\
  \ */\nclass Retire2 {\n    void main() throws Exception {\n        // Get locale\n\
  \        ResourceBundle bundle = ResourceBundle.getBundle(\"v2ch07.retire.RetireStrings\"\
  ,\n                Locale.getDefault());\n        IO.println(bundle.getString(\"\
  language\"));\n        Locale[] locales = { Locale.US, Locale.CHINA, Locale.GERMANY\
  \ };\n        Locale currentLocale = Choices.choose(locales, Locale::getDisplayName);\n\
  \        bundle = ResourceBundle.getBundle(\"v2ch07.retire.RetireStrings\", currentLocale);\n\
  \        NumberFormat integerFormat = NumberFormat.getIntegerInstance(currentLocale);\n\
  \        NumberFormat numberFormat = NumberFormat.getNumberInstance(currentLocale);\n\
  \n        // Prompt for parameters\n        double savings = numberFormat.parse(\n\
  \                IO.readln(bundle.getString(\"savings\") + \": \")).doubleValue();\n\
  \        double contributions = numberFormat.parse(\n                IO.readln(bundle.getString(\"\
  contrib\") + \": \")).doubleValue();\n        double income = numberFormat.parse(\n\
  \                IO.readln(bundle.getString(\"income\") + \": \")).doubleValue();\n\
  \        int currentAge = integerFormat.parse(\n                IO.readln(bundle.getString(\"\
  currentAge\") + \": \")).intValue();\n        int retireAge = integerFormat.parse(\n\
  \                IO.readln(bundle.getString(\"retireAge\") + \": \")).intValue();\n\
  \        int deathAge = integerFormat.parse(\n                IO.readln(bundle.getString(\"\
  deathAge\") + \": \")).intValue();\n        double inflationPercent = numberFormat.parse(\n\
  \                IO.readln(bundle.getString(\"inflationPercent\") + \": \")).doubleValue();\n\
  \        double investPercent = numberFormat.parse(\n                IO.readln(bundle.getString(\"\
  investPercent\") + \": \")).doubleValue();\n\n        // Show values\n        var\
  \ retireMsg = new MessageFormat(\"\");\n        retireMsg.setLocale(currentLocale);\n\
  \        retireMsg.applyPattern(bundle.getString(\"retire\"));\n\n        double\
  \ balance = savings;\n        for (int year = currentAge; year <= deathAge; year++)\
  \ {\n            Object[] msgArgs = { year, balance };\n            IO.println(retireMsg.format(msgArgs));\n\
  \            if (year < retireAge)\n                balance += contributions;\n\
  \            else\n                balance -= income;\n            balance = balance\
  \ * (1 + (investPercent - inflationPercent));\n        }\n    }\n}\n```\n\n### 列表\
  \ 7.5 `v2ch07/retire2/RetireStrings.properties`\n\n```properties\nlanguage=Language\n\
  computeButton=Compute\nsavings=Prior Savings\ncontributions=Annual Contribution\n\
  income=Retirement Income\ncurrentAge=Current Age\nretireAge=Retirement Age\ndeathAge=Life\
  \ Expectancy\ninflationPercent=Inflation\ninvestPercent=Investment Return\nretire=Age:\
  \ {0,number} Balance: {1,number,currency}\n```\n\n### 列表 7.6 `v2ch07/retire2/RetireStrings_de.properties`\n\
  \n```properties\nlanguage=Sprache\ncomputeButton=Rechnen\nsavings=Vorherige Ersparnisse\n\
  contributions=Jährliche Einzahlung\nincome=Einkommen nach Ruhestand\ncurrentAge=Jetziges\
  \ Alter\nretireAge=Ruhestandsalter\ndeathAge=Lebenserwartung\ninflationPercent=Inflation\n\
  investPercent=Investitionsgewinn\nretire=Alter: {0,number} Guthaben: {1,number,currency}\n\
  ```\n\n### 列表 7.7 `v2ch07/retire2/RetireStrings_zh.properties`\n\n```properties\n\
  language=语言\ncomputeButton=计算\nsavings=现有\ncontributions=每年存金\nincome=退休收入\ncurrentAge=现龄\n\
  retireAge=退休年龄\ndeathAge=预期寿命\ninflationPercent=通货膨胀\ninvestPercent=投资报酬\nretire=年龄:\
  \ {0,number} 总结: {1,number,currency}\n```\n\n你已经了解了如何使用 Java 语言的国际化功能。你现在可以使用资源包（resource\
  \ bundles）提供多语言的翻译，并使用格式化器（formatters）和对比较器（collators）来处理区域设置（locale）。\n\n# 第 8\
  \ 章：编译与脚本\n\n你已经了解了如何使用 Java 语言的国际化功能。你现在可以使用资源包（resource bundles）提供多语言的翻译，并使用格式化器（formatters）和对比较器（collators）来处理区域设置（locale）。\n\
  \n下一章，我们将深入研究脚本。\n\n## 8.1 编译器\n\n你已经了解了如何使用 Java 语言的国际化功能。你现在可以使用资源包（resource bundles）提供多语言的翻译，并使用格式化器（formatters）和对比较器（collators）来处理区域设置（locale）。\n\
  \n下一章，我们将深入研究脚本。\n\n### 8.1.1 调用编译器\n\n你已经了解了如何使用 Java 语言的国际化功能。你现在可以使用资源包（resource\
  \ bundles）提供多语言的翻译，并使用格式化器（formatters）和对比较器（collators）来处理区域设置（locale）。\n\n下一章，我们将深入研究脚本。`javax.tools`\
  \ 接口允许使用用于编译的工具。以下是一个示例示例：\n\n```\nJavaCompiler compiler = ToolProvider.getSystemCompiler();\n\
  OutputStream outStream = . .\nOutputStream errStream = . .\nint result = compiler.run(null,\
  \ outStream, errStream,\n    \"-sourcepath\", \"src\", \"MyProg.java\");\n```\n\n\
  `result` 值为 `0` 表示编译成功。编译器将其输出和错误信息发送到提供的流中。你可以将这些参数设置为 `null`，在这种情况下将使用 `System.out`\
  \ 和 `System.err`。`run` 方法的第一个参数是输入流。`run` 方法的剩余参数是你传递给 `javac` 的参数。\n\n### 8.1.2\
  \ 启动编译任务\n\n你可以通过 `CompilationTask` 对象对编译过程进行更细控制。如果你想从字符串提供源码、在内存中捕获类文件或处理错误和警告消息，这将非常有用。\n\
  \n要获取 `CompilationTask`，请从上一节的 `compiler` 对象开始。然后调用：\n\n```\nJavaCompiler.CompilationTask\
  \ task = compiler.getTask(\n    errorWriter, // 如果为 null 则使用 System.err\n    fileManager,\
  \ // 如果为 null 则使用标准文件管理器\n    diagnosticListener, // 如果为 null 则使用 System.err\n \
  \   options, // 如果没有选项则为 null\n    classes, // 用于注解处理；如果没有则为 null\n    sources);\n\
  ```\n\n最后三个参数是 `Iterable` 实例。例如，一组选项可以指定为：\n\n```\nIterable<String> options = List.of(\"\
  -d\", \"bin\");\n```\n\n`sources` 参数是 `JavaFileObject` 实例的 `Iterable`。如果你想编译磁盘文件，请获取\
  \ `StandardJavaFileManager` 并调用它的 `getJavaFileObjects` 方法：\n\n```\nStandardJavaFileManager\
  \ stdFileManager\n    = compiler.getStandardFileManager(null, null, null);\nIterable<JavaFileObject>\
  \ sources\n    = stdFileManager.getJavaFileObjectsFromStrings(List.of(\"File1.java\"\
  , \"File2.java\"));\nJavaCompiler.CompilationTask task\n    = compiler.getTask(null,\
  \ null, null, options, null, sources);\n```\n\n`classes` 参数仅用于注解处理。在这种情况下，你还需要调用\
  \ `task.processors(annotationProcessors)` 并传入 `Processor` 对象的列表。请参见第一卷第 11 章以查看注解处理的示例。\n\
  \n\n\n\n`getTask` 方法返回任务对象，但尚未启动编译过程。`CompilationTask` 类继承了 `Callable<Boolean>`。你可以将其提交给\
  \ `ExecutorService` 进行并发执行，你也可以直接进行同步调用：\n\n```\nBoolean result = task.call();\n\
  ```\n\n### 8.1.3. 捕获诊断信息\n\n要监听错误消息，请安装一个 `DiagnosticListener`。当编译器报告警告或错误消息时，该监听器会接收到一个\
  \ `Diagnostic` 对象。`DiagnosticCollector` 类实现了此接口。它简单地收集所有的诊断信息，以便你可以在编译完成后遍历这些信息。\n\
  \n```\nvar collector = new DiagnosticCollector<JavaFileObject>();\ncompiler.getTask(null,\
  \ fileManager, collector, null, null, sources).call();\nfor (Diagnostic<? extends\
  \ JavaFileObject> d : collector.getDiagnostics())  {\n    IO.println(d);\n}\n```\n\
  \n`Diagnostic` 对象包含有关问题位置的信息（包括文件名、行号和列号）以及一个人类可读的描述。\n\n你也可以将 `DiagnosticListener`\
  \ 安装到标准文件管理器，以防你需要捕获关于文件缺失的消息：\n\n```\nStandardJavaFileManager stdFileManager\n\
  \    = compiler.getStandardFileManager(diagnosticsListener, null, null);\n```\n\n\
  ### 8.1.4. 从内存读取源文件\n\n如果你是动态生成源代码，可以从内存中编译它，而无需将文件保存到磁盘。使用此类来持有代码：\n\n```\npublic\
  \ class StringSource extends SimpleJavaFileObject {\n    private String code;\n\n\
  \    StringSource(String name, String code) {\n        super(URI.create(\"string:///\"\
  \ + name.replace(\".\", \"/\") + \".java\"), Kind.SOURCE);\n        this.code =\
  \ code;\n    }\n\n    public CharSequence getCharContent(boolean ignoreEncodingErrors)\
  \ {\n        return code;\n    }\n}\n```\n\n然后为你的类生成代码，并给编译器提供一个 `StringSource`\
  \ 对象列表：\n\n```\nList<StringSource> sources = List.of(\n    new StringSource(className1,\
  \ class1CodeString),\n    new StringSource(className2, class2CodeString),\n    .\
  \ . .);\ntask = compiler.getTask(null, fileManager, diagnosticsListener, null, null,\
  \ sources);\n```\n\n### 8.1.5. 将字节码写入内存\n\n如果你是动态编译类，则无需将类文件保存到磁盘。你可以将它们保存到内存并立即加载它们。\n\
  \n首先，这是一个用于持有字节的类：\n\n```\npublic class ByteArrayClass extends SimpleJavaFileObject\
  \ {\n    private ByteArrayOutputStream out;\n\n    ByteArrayClass(String name) {\n\
  \        super(URI.create(\"bytes:///\" + name.replace(\".\", \"/\") + \".class\"\
  ), Kind.CLASS);\n    }\n\n    public byte[] getCode()  {\n        return out.toByteArray();\n\
  \    }\n\n    public OutputStream openOutputStream() throws IOException {\n    \
  \    out = new ByteArrayOutputStream();\n        return out;\n    }\n}\n```\n\n\
  接下来，你需要配置文件管理器使用这些类作为输出：\n\n```\nvar classes = new ArrayList<ByteArrayClass>();\n\
  StandardJavaFileManager stdFileManager\n    = compiler.getStandardFileManager(null,\
  \ null, null);\nJavaFileManager fileManager\n    = new ForwardingJavaFileManager<>(stdFileManager)\
  \ {\n        public JavaFileObject getJavaFileForOutput(Location location,\n   \
  \             String className, Kind kind, FileObject sibling)\n               \
  \ throws IOException {\n            if (kind == Kind.CLASS) {\n                \
  \ ByteArrayClass outfile = new ByteArrayClass(className);\n                 classes.add(outfile);\n\
  \                 return outfile;\n            }\n            else\n           \
  \      return super.getJavaFileForOutput(location, className, kind, sibling);\n\
  \        }\n    };\n```\n\n要加载类，你需要一个类加载器（参见 第 9 章）：\n\n```\npublic class ByteArrayClassLoader\
  \ extends ClassLoader {\n    private Iterable<ByteArrayClass> classes;\n\n    public\
  \ ByteArrayClassLoader(Iterable<ByteArrayClass> classes) {\n        this.classes\
  \ = classes;\n    }\n\n    public Class<?> findClass(String name) throws ClassNotFoundException\
  \ {\n        for (ByteArrayClass cl : classes) {\n            if (cl.getName().equals(\"\
  /\" + name.replace(\".\", \"/\") + \".class\")) {\n                byte[] bytes\
  \ = cl.getCode();\n                return defineClass(name, bytes, 0, bytes.length);\n\
  \            }\n        }\n        throw new ClassNotFoundException(name);\n   \
  \ }\n}\n```\n\n编译完成后，使用该类加载器调用 `Class.forName` 方法：\n\n```\nByteArrayClassLoader\
  \ loader = new ByteArrayClassLoader(classes);\nClass<?> cl = Class.forName(className,\
  \ true, loader);\n```\n\n### 8.1.6. 示例：动态 Java 代码生成\n\n在用于动态页面的 Jakarta Server Pages\
  \ (JSP) 技术中，你可以将 HTML 与 Java 代码段混合，例如：\n\n```\n<p>The current date and time is <b><%=\
  \ LocalDateTime.now() %></b>.</p>\n```\n\nJSP 引擎动态地将 Java 代码编译成 servlet。在我们的示例应用程序中，我们使用了一个简单的示例，并为一种非常的工作表格式生成代码。作者将文本、Java\
  \ 表达式（用反引号包含）和 Java 语句（用三个反引号包含）引入到工作表中。`???` 表示一行输入。该工作表被编译成 Java 类，该类打印文本和表达式的值，并执行\
  \ Java 语句。这是一个示例工作表：\n\n```\nWhat is your name?\n```\n\nString name = ???;\n\n```\n\
  How old are you?\n```\n\nint age = Integer.parseInt(???);\n\n```\nHello, `name`!\
  \ Next year, you will be `age + 1`.\n```\n\n这是一个非常基础的文本版本的编程笔记本（[`docs.jupyter.org/en/latest/#what-is-a-notebook`](https://docs.jupyter.org/en/latest/#what-is-a-notebook)）。该表被翻译成一个类，该类的\
  \ `main` 方法会输出文本和表达式的值。语句被原样包含。可以想象对该程序进行增强以显示图像和表格，就像真正的编程笔记本一样。\n\n程序列表 8.1 中的\
  \ `buildSource` 方法构建此代码并放入 `StringSource` 对象中。该对象被传递给 Java 编译器。\n\n如前节所述，我们使用 `ForwardingJavaFileManager`\
  \ 为每个编译的类构造 `ByteArrayClass` 对象。这些对象捕获了编译时生成的类文件。编译后，我们使用前节中的类加载器加载该类并执行其 `main`\
  \ 方法。\n\n此示例演示了如何使用内存源和类文件进行动态编译。\n\nListing 8.1 v2ch08/compiler/CompilerDemo.java\n\
  \n\n\n\n\n```java\npackage v2ch08.compiler;\n\nimport module java.base;\nimport\
  \ module java.compiler;\n\nimport javax.tools.JavaFileObject.Kind;\nimport javax.tools.ToolProvider;\n\
  \n/**\n * 此程序演示了如何在 Java 程序中编译 Java 代码。\n */\npublic class CompilerDemo {\n    void\
  \ main(String[] args) throws Exception {\n        JavaCompiler compiler = ToolProvider.getSystemJavaCompiler();\n\
  \n        var classFileObjects = new ArrayList<ByteArrayClass>();\n\n        var\
  \ diagnosticsListener = new DiagnosticCollector<JavaFileObject>();\n\n        JavaFileManager\
  \ fileManager \n            = compiler.getStandardFileManager(diagnosticsListener,\
  \ null, null);\n        fileManager = new ForwardingJavaFileManager<>(fileManager)\
  \ {\n            public JavaFileObject getJavaFileForOutput(Location location, String\
  \ className,\n                    Kind kind, FileObject sibling) throws IOException\
  \ {\n                if (kind == Kind.CLASS) {\n                    var fileObject\
  \ = new ByteArrayClass(className);\n                    classFileObjects.add(fileObject);\n\
  \                    return fileObject;\n                }\n                else\n\
  \                    return super.getJavaFileForOutput(location, className, kind,\
  \ sibling);\n            }\n        };\n\n        String mainClassName = \"v2ch08.compiler.Main\"\
  ;\n        String worksheetName = args.length > 0 ? args[0] : \"v2ch08/compiler/worksheet\"\
  ;\n\n        StandardJavaFileManager stdFileManager = compiler.getStandardFileManager(null,\
  \ null,\n                null);\n        var sources = new ArrayList<JavaFileObject>();\n\
  \        for (JavaFileObject file : stdFileManager.getJavaFileObjectsFromStrings(\n\
  \                List.of(mainClassName.replace(\".\", \"/\") + \".java\")))\n  \
  \          sources.add(file);\n\n        JavaFileObject source = buildSource(mainClassName,\
  \ Path.of(worksheetName));\n        JavaCompiler.CompilationTask task = compiler.getTask(null,\
  \ fileManager,\n                diagnosticsListener, null, null, List.of(source));\n\
  \        Boolean result = task.call();\n\n        for (Diagnostic<? extends JavaFileObject>\
  \ d : diagnosticsListener.getDiagnostics())\n            IO.println(d.getKind()\
  \ + \": \" + d.getMessage(null));\n        fileManager.close();\n        if (!result)\
  \ {\n            IO.println(\"Compilation failed.\");\n            System.exit(1);\n\
  \        }\n\n        var loader = new ByteArrayClassLoader(classFileObjects);\n\
  \        Class<?> mainClass = loader.loadClass(mainClassName);\n        mainClass.getMethod(\"\
  main\").invoke(null);\n    }\n\n    /**\n     * 构建实现工作表操作的类源码。\n     * @param className\
  \ 要构建的类的类名\n     * @param worksheet 包含工作表指令的文件\n     * @return 包含在字符串构建器源码的文件对象\n\
  \     */\n    JavaFileObject buildSource(String className, Path worksheet) throws\
  \ IOException {\n        var builder = new StringBuilder();\n        int n = className.lastIndexOf(\"\
  .\");\n        if (n >= 0) {\n            String packageName = className.substring(0,\
  \ n);\n            className = className.substring(n + 1);\n            builder.append(\"\
  package \").append(packageName).append(\";\\n\\n\");\n        }\n        builder.append(\"\
  public class \").append(className).append(\" {\\n\");\n        builder.append(\"\
  public static void main() {\\n\");\n        boolean verbatim = false;\n        for\
  \ (String line : Files.readAllLines(worksheet)) {\n            if (line.equals(\"\
  ```\"))\n\n                verbatim = !verbatim;\n\n            else if (verbatim)\n\
  \n                builder.append(line.replace(\"???\", \"IO.readln()\")).append(\"\
  \\n\");\n\n            else {\n\n                String[] fragments = line.split(\"\
  `\");\n\n                for (int i = 0; i < fragments.length; i++) {\n\n      \
  \              builder.append(\"IO.print(\");\n\n                    if (i % 2 ==\
  \ 0)\n\n                        builder.append(\"\\\"\").append(\n\n           \
  \                     fragments[i].replace(\"\\\\\", \"\\\\\\\\\").replace(\"\\\"\
  \", \"\\\\\\\"\"))\n                                .append(\"\\\"\");\n\n     \
  \               else\n                        builder.append(fragments[i]);\n\n\
  \                    builder.append(\");\\n\");\n\n                }\n\n       \
  \         builder.append(\"IO.println()\\n;\");\n\n            }\n\n        }\n\n\
  \        builder.append(\"} }\\n\");\n\n        return new StringSource(className,\
  \ builder.toString());\n\n    }\n\n}\n```\n\n\n\n\n### `javax.tools.Tool6`\n\n*\
  \ `int run(InputStream in, OutputStream out, OutputStream err, String... arguments)`\n\
  \  使用给定的输入、输出、错误流以及参数运行工具。成功返回 `0`，失败返回非零值。\n\n### `javax.tools.JavaCompiler6`\n\
  \n* `StandardJavaFileManager getStandardFileManager(DiagnosticListener<? super JavaFileObject>\
  \ diagnosticListener, Locale locale, Charset charset)`\n  获取此编译器的标准文件管理器。你可以为默认错误报告、区域和字符集提供\
  \ `null`。\n\n* `JavaCompiler.CompilationTask getTask(Writer out, JavaFileManager\
  \ fileManager, DiagnosticListener<? super JavaFileObject> diagnosticListener, Iterable<String>\
  \ options, Iterable<String> classesForAnnotationProcessing, Iterable<? extends JavaFileObject>\
  \ sourceFiles)`\n  获取一个编译任务，调用时将编译给定的源文件。详情见前一节的讨论。\n\n### `javax.tools.StandardJavaFileManager6`\n\
  \n* `Iterable<? extends JavaFileObject> getJavaFileObjectsFromStrings(Iterable<String>\
  \ fileNames)`\n* `Iterable<? extends JavaFileObject> getJavaFileObjectsFromPaths(Collection<?\
  \ extends Path> paths)`13\n* `Iterable<? extends JavaFileObject> getJavaFileObjectsFromFiles(Iterable<?\
  \ extends File> files)`\n  将一组文件名或文件转换为一组 `JavaFileObject` 实例。\n\n### `javax.tools.JavaCompiler.CompilationTask6`\n\
  \n* `Boolean call()`\n  执行编译任务。\n\n### `javax.tools.DiagnosticCollector<S>`6\n\n\
  * `DiagnosticCollector()`\n  构造一个空的收集器。\n* `List<Diagnostic<? extends S>> getDiagnostics()`\n\
  \  获取收集到的诊断信息。\n\n### `javax.tools.Diagnostic<S>`6\n\n* `S getSource()`\n  获取与此诊断信息相关的源对象。\n\
  * `Diagnostic.Kind getKind()`\n  获取此诊断信息的类型——属于 `ERROR`、`WARNING`、`MANDATORY_WARNING`、`NOTE`\
  \ 或 `OTHER` 之一。\n* `String getMessage(Locale locale)`\n  获取描述该诊断信息中提出的问题的消息。传递 `null`\
  \ 使用默认区域。\n* `long getLineNumber()`\n* `long getColumnNumber()`\n  获取此诊断信息中提出的问题的位置。\n\
  \n### `javax.tools.SimpleJavaFileObject`6\n\n* `CharSequence getCharContent(boolean\
  \ ignoreEncodingErrors)`\n  对于代表源文件的文件对象，重写此方法以产生源代码。\n* `OutputStream openOutputStream()`\n\
  \  对于代表类文件的文件对象，重写此方法以产生一个可以从中写入字节码的流。\n\n### `javax.tools.ForwardingJavaFileManager<M\
  \ extends JavaFileManager>`6\n\n* `protected ForwardingJavaFileManager(M fileManager)`\n\
  \  构造一个 `JavaFileManager`，将所有调用委托给给定的文件管理器。\n* `FileObject getJavaFileForOutput(JavaFileManager.Location\
  \ location, String className, JavaFileObject.Kind kind, FileObject sibling)`\n \
  \ 如果你想用一个文件对象来替换写入类文件，请拦截此调用；`kind` 是 `SOURCE`、`CLASS`、`HTML` 或 `OTHER` 之一。\n\n\
  ## 8.2. Java 平台的脚本\n\n脚本语言是一种通过在运行时解释程序文本来避免通常的编辑/编译/链接/运行循环的语言。脚本具有许多优点：\n\n* 快速迭代，鼓励实验\n\
  * 更改运行中程序的行为\n* 允许用户进行自定义\n\n另一方面，大多数脚本语言缺乏对编写复杂应用程序有用的特性，例如强类型、封装和模块化。\n\n因此，将脚本语言和传统语言的优点结合起来是非常吸引力的。脚本\
  \ API 允许你在 Java 平台上这样做。它允许你从 Java 程序中调用用 JavaScript、Groovy、Ruby 甚至是 Scheme 和 Haskell\
  \ 等奇门语言编写的脚本。例如，Renjin 项目 ([`www.renjin.org`](https://www.renjin.org)) 提供了 R 语言语言的\
  \ Java 实现（该语言通常用于统计编程），并带有一个脚本 API 的“引擎”。\n\n在寻找你喜爱的语言的兼容实现时，请搜索 JSR 223 支持。（Java\
  \ 规范请求 223 在其集成到 Java 之前就已经开发了脚本 API。）\n\nJMeter 性能分析工具 ([`jmeter.apache.org/`](https://jmeter.apache.org/))\
  \ 是一个允许用户使用任何支持 Java 脚本的语言编写脚本的程序示例。Maven 构建工具有一个插件 ([`maven.apache.org/plugins/maven-scripting-plugin/index.html`](https://maven.apache.org/plugins/maven-scripting-plugin/index.html))\
  \ 用于使用任何具有 Java 脚本引擎的语言编写构建步骤。\n\n在接下来的章节中，我将为你展示如何为特定语言选择引擎、如何执行脚本，以及如何利用某些脚本引擎提供的高级特性。\n\
  \n### 8.2.1. 获取脚本引擎\n\n脚本引擎是一个可以执行特定语言脚本的库。当虚拟机启动时，它会发现这些脚本引擎。要列出这些引擎，请构造一个 `ScriptEngineManager`\
  \ 并调用 `getEngineFactories` 方法。你可以询问每个引擎工厂支持的引擎名称、MIME 类型和文件扩展名。表 8.1 显示了典型值。\n\n\
  本章中的示例使用了 Rhino 脚本引擎，可以在 [`github.com/mozilla/rhino`](https://github.com/mozilla/rhino)\
  \ 获取，它实现了 JavaScript 的早期版本。\n\n表 8.1 脚本引擎属性\n\n| 引擎 | 名称 | MIME 类型 | 扩展名 |\n| ---\
  \ | --- | --- | --- |\n| Rhino (JavaScript) | rhino, javascript | `application/javascript`,\
  \ `application/ecmascript`, `text/javascript` | `js` |\n| Groovy | groovy | None\
  \ | `groovy` |\n| Renjin | Renjin | `text/x-R` | `R`, `r`, `S`, `s` |\n\n通常你知道你需要哪个引擎，可以通过名称、MIME\
  \ 类型或扩展名来请求它。例如：\n\n```\nvar manager = new ScriptEngineManager();\nScriptEngine\
  \ engine = manager.getEngineByName(\"rhino\");\n```\n\n你需要在路径上提供实现脚本引擎的 JAR 文件。\n\
  \nOracle JDK 曾经包含一个名为 Nashorn 的 JavaScript 引擎，但在 Java 15 中已被移除。它可以作为独立项目在 [`github.com/openjdk/nashorn`](https://github.com/openjdk/nashorn)\
  \ 获取。\n\n### `javax.script.ScriptEngineManager`6\n\n* `List<ScriptEngineFactory>\
  \ getEngineFactories()`\n  获取所有发现的引擎工厂列表。\n* `ScriptEngine getEngineByName(String\
  \ name)`\n* `ScriptEngine getEngineByExtension(String extension)`\n* `ScriptEngine\
  \ getEngineByMimeType(String mimeType)`\n  根据给定的名称、脚本扩展名或 MIME 类型获取脚本引擎。\n\n###\
  \ `javax.script.ScriptEngineFactory`6\n\n* `List<String> getNames()`\n* `List<String>\
  \ getExtensions()`\n* `List<String> getMimeTypes()`\n  获取此工厂已知的名称、脚本扩展名和 MIME 类型。\n\
  \n### 8.2.2. 脚本评估与绑定\n\n一旦获取了引擎，你可以简单通过通过来执行脚本：\n\n```\nObject result = engine.eval(scriptString);\n\
  ```\n\n如果脚本存储在文件中，打开一个 `Reader` 并调用\n\n```\nObject result = engine.eval(reader);\n\
  ```\n\n你可以在同一个引擎上调用多个脚本。如果一个脚本定义了变量、函数或类，大多数脚本引擎会保留这些定义供以后使用。例如，\n\n```\nengine.eval(\"\
  n = 1728\");\nObject result = engine.eval(\"n + 1\");\n```\n\n将返回 `1729`。\n\n要确定在多线程中并发执行脚本是否安全，请调用\n\
  \n```\nObject param = factory.getParameter(\"THREADING\");\n```\n\n\n\n\n返回的值是以下之一：\n\
  \n* `null`: 并发执行是不安全的。\n* `\"MULTITHREADED\"`：并发执行是安全的。一个线程的影响可能对另一个线程可见。\n* `\"\
  THREAD-ISOLATED\"`：在 `\"MULTITHREADED\"` 的基础上，为每个线程维护了不同的变量绑定。\n* `\"STATELESS\"\
  `：在 `\"THREAD-ISOLATED\"` 的基础上，脚本不会更改变量绑定。\n\n你可能经常需要向引擎添加变量绑定。一个绑定由一个名称和一个关联 Java\
  \ 对象组成。例如，考虑以下语句：\n\n```\nengine.put(\"k\", 1728);\nObject result = engine.eval(\"\
  k + 1\");\n```\n\n脚本代码从“引擎作用域”（engine scope）的绑定中读取 `k` 的定义。这特别重要，因为大多数脚本语言都可以访问\
  \ Java 对象，且语法通常比 Java 语法更简单。例如，\n\n```\nengine.put(\"d\", LocalDate.now());\nObject\
  \ result = engine.eval(\"d.month\"); // 调用 getMonth\n```\n\n反之，你可以检索由脚本语句绑定的变量：\n\
  \n```\nengine.eval(\"n = 1728\");\nObject result = engine.get(\"n\");\n```\n\n除了引擎作用域，还有一个全局作用域。你添加到\
  \ `ScriptEngineManager` 的任何绑定对所有引擎都可见。\n\n与其将绑定添加到引擎或全局作用域，你可以将它们收集在一个 `Bindings`\
  \ 类型的对象中并将其传递给 `eval` 方法：\n\n```\nBindings scope = engine.createBindings();\nscope.put(\"\
  d\", LocalDate.now());\nengine.eval(scriptString, scope);\n```\n\n如果一组绑定不应该在后续的\
  \ `eval` 调用中持续，这种方法很有用。\n\n你可能希望拥有引擎和全局作用域之外的作用域。例如，Web 容器可能需要请求和会话作用域。然而，你需要自备。你需要编写一个实现\
  \ `ScriptContext` 接口的类，来管理作用域集合。每个作用域由一个整数标识，应该先搜索数字较小的作用域。（标准库提供了 `SimpleScriptContext`\
  \ 类，但它只持有全局和引擎作用域。）\n\n### javax.script.ScriptEngine6\n\n* `Object eval(String script)`\n\
  * `Object eval(Reader reader)`\n* `Object eval(String script, Bindings bindings)`\n\
  \  根据给定的字符串或 reader 执行脚本，并受给定绑定限制。\n* `Object get(String key)`\n* `void put(String\
  \ key, Object value)`\n  在引擎作用域中获取或放入绑定。\n* `Bindings createBindings()`\n  创建一个适用于此引擎的空\
  \ `Bindings` 对象。\n\n### javax.script.ScriptEngineManager\n\n* `Object get(String\
  \ key)`\n* `void put(String key, Object value)`\n  在全局作用域中获取或放入绑定。\n\n### javax.script.Bindings\n\
  \n* `Object get(String key)`\n* `void put(String key, Object value)`\n  向由此 `Bindings`\
  \ 对象表示的作用域中获取或放入绑定。\n\n### 8.2.3. 重定向输入和输出\n\n你可以通过调用脚本上下文的 `setReader` 和 `setWriter`\
  \ 方法来重定向脚本的标准输入输出。例如，\n\n```\nvar writer = new StringWriter();\nengine.getContext().setWriter(new\
  \ PrintWriter(writer, true));\n```\n\n任何使用 JavaScript 的 `print` 或 `println` 函数写入的输出都将发送到\
  \ `writer`。\n\n`setReader` 和 `setWriter` 方法只影响脚本引擎的标准输入和输出源。例如，如果你执行 JavaScript\
  \ 代码\n\n```javascript\nprintln(\"Hello\");\njava.lang.System.out.println(\"World\"\
  );\n```\n\n只有第一个输出会被重定向。\n\nRhino 引擎没有标准输入源的概念。调用 `setReader` 无效果。\n\n### javax.script.ScriptEngine\n\
  \n* `ScriptContext getContext()`\n  获取此引擎的默认脚本上下文。\n\n### javax.script.ScriptContext\n\
  \n* `Reader getReader()`\n* `void setReader(Reader reader)`\n* `Writer getWriter()`\n\
  * `void setWriter(Writer writer)`\n* `Writer getErrorWriter()`\n* `void setErrorWriter(Writer\
  \ writer)`\n  获取或设置用于输入的 reader 用于普通或错误输出的 writer。\n\n### 8.2.4. 调用脚本函数和方法\n\n对于某些脚本引擎，你可以直接在\
  \ Java 代码中调用脚本语言函数，而无需评估一个执行该调用的脚本代码段。如果你允许用户用他们选择的脚本语言实现服务，以便你就可以从 Java 调用它，这非常有用。\n\
  \n提供此功能的脚本引擎实现了 `Invocable` 接口。特别是 Rhino 引擎实现了 `Invocable`。\n\n要调用函数，请调用 `invokeFunction`\
  \ 方法并传入函数名，随后是函数参数：\n\n```javascript\n// 在 JavaScript 中定义 greet 函数\nengine.eval(\"\
  function greet(how, whom) { return how + ', ' + whom + '!' }\");\n// 使用参数 \"Hello\"\
  , \"World\" 调用函数\nresult = ((Invocable) engine).invokeFunction(\"greet\", \"Hello\"\
  , \"World\");\n```\n\n如果脚本语言是面向对象的，调用 `invokeMethod`：\n\n```javascript\n// 在 JavaScript\
  \ 中定义 Greeter 类\nengine.eval(\"\"\"\nfunction Greeter(how) { this.how = how }\n\
  Greeter.prototype.welcome =\n    function (whom) { return this.how + ', ' + whom\
  \ + '!' }\n\"\"\");\n\n// 实例\nObject yo = engine.eval(\"new Greeter('Hello')\");\n\
  \n// 在实例上调用方法\nresult = ((Invocable) engine).invokeMethod(\"World\");\n```\n\nRhino\
  \ 不支持现代的 JavaScript 类语法。关于如何用旧方法在 JavaScript 中定义类，请参阅 Douglas Crockford (2008) 写的\
  \ *JavaScript—The Good Parts*。\n\n如果脚本引擎没有 `Invocable` 接口，你可能仍然能够独立语言的方式调用方法。`ScriptEngineFactory`\
  \ 接口的 `getMethodCallSyntax` 方法产生一个传递给 `eval` 方法的字符串。然而，对于这种情况，所有方法参数必须绑定到名称，而 `invokeMethod`\
  \ 可以带有任意值。\n\n你可以更进一步，要求脚本引擎实现一个 Java 接口。这样就可以用 Java 方法调用语法调用脚本函数和方法。\n\n细节取决于脚本引擎，但通常你需要为接口的每个方法提供一个函数。例如，考虑以下\
  \ Java 接口：\n\n```java\npublic interface Greeter {\n    String welcome(String whom);\n\
  }\n```\n\n如果你在 Rhino 中定义一个同名的全局函数，你可以通过此接口调用它：\n\n```javascript\n// 在 JavaScript\
  \ 中定义 welcome 函数\nengine.eval(\"function welcome(whom) { return 'Hello, ' + whom\
  \ + '!' }\");\n// 获取 Java 对象并调用 Java 方法\nGreeter g = ((Invocable) engine).getInterface(Greeter.class);\n\
  result = g.welcome(\"World\");\n```\n\n在面向对象的脚本语言中，你可以通过匹配的 Java 接口访问脚本类。例如，以下是使用\
  \ Java 语法调用 JavaScript `Greeter` 类实例的方法：\n\n```java\nGreeter g = ((Invocable) engine).getInterface(yo,\
  \ Greeter.class);\nresult = g.welcome(\"World\");\n```\n\n\n\n\n综而言之，如果你想从 Java\
  \ 中调用脚本代码而不必担心脚本语言的语法，那么 `Invocable` 接口非常有用。\n\n`javax.script.Invocable`\n\n*  \
  \ `Object invokeFunction(String name, Object... args)`\n*   `Object invokeMethod(Object\
  \ thiz, String name, Object... args)`\n    使用给定的参数调用给定名称的函数或方法。\n*   `<T> T getInterface(Class<T>\
  \ clasz)`\n    返回给定接口的实现类，通过脚本引擎中的函数来实现这些方法。\n*   `<T> T getInterface(Object thiz,\
  \ Class<T> clasz)`\n    返回给定接口的实现类，通过给定对象的方法来实现这些方法。\n\n### 8.2.5. 编译脚本\n\n某些脚本引擎可以将脚本代码编译为中间形式以便进行高效执行。这些引擎实现了\
  \ `Compilable` 接口。接下来的示例展示了如何编译并评估脚本文件中包含的代码：\n\n```\nif (engine instanceof Compilable\
  \ compilableEngine) {\n    Reader reader = Files.newBufferedReader(path);\n    CompiledScript\
  \ script = compilableEngine.compile(reader);\n    script.eval();\n}\n```\n\n当然，只有当你需要重复执行脚本时，编译脚本才有意义。\n\
  \n`javax.script.Compilable`\n\n*   `CompiledScript compile(String script)`\n*  \
  \ `CompiledScript compile(Reader reader)`\n    编译由字符串或 reader 提供的脚本。\n\n`javax.script.CompiledScript`\n\
  \n*   `Object eval()`\n*   `Object eval(Bindings bindings)`\n    评估此脚本。\n\n### 8.2.6.\
  \ 示例：脚本工作表\n\n请查看 列表 8.2 中的程序，它以与 第 8.1.6 节相同的格式执行工作表。然而，这次代码是用脚本语言编写的，并在程序运行时进行评估。\n\
  \n类路径必须包含一个脚本引擎。请从 https://mvnrepository.com/artifact/org.mozilla/rhino 和 https://mvnrepository.com/artifact/org.mozilla/rhino-engine\
  \ 下载 Rhino 和 Rhino 引擎 JAR 包，并将它们放入 `jars` 目录。按如下方式启动程序：\n\n```\njava -classpath\
  \ .:v2ch08/script/rhino-1.7.14.jar:v2ch08/script/rhino-engine-1.7.14.jar \\\n  \
  \  v2ch08/script/ScriptDemo.java rhino v2ch08/script/worksheet\n```\n\n列表 8.2 v2ch08/script/ScriptDemo.java\n\
  \n```java\npackage v2ch08.script;\n\nimport module java.base;\nimport module java.scripting;\n\
  \n/**\n * 此程序演示了 Java 脚本引擎。\n */\nclass ScriptDemo {\n    void main(String[] args)\
  \ throws Exception {\n        var manager = new ScriptEngineManager();\n       \
  \ String language;\n\n        if (args.length == 0) {\n            IO.println(\"\
  Available factories: \");\n            for (ScriptEngineFactory factory : manager.getEngineFactories())\n\
  \                IO.println(factory.getEngineName());\n            return;\n   \
  \     }\n        else\n            language = args[0];\n\n        ScriptEngine engine\
  \ = manager.getEngineByName(language);\n        if (engine == null) {\n        \
  \    System.err.println(\"No engine for \" + language);\n            System.exit(1);\n\
  \        }\n\n        String sheetName = args[1];\n        boolean verbatim = false;\n\
  \        var verbatimCode = new StringBuilder();\n\n        for (String line : Files.readAllLines(Path.of(sheetName)))\
  \ {\n            if (line.equals(\"```\")) {\n                verbatim = !verbatim;\n\
  \                if (!verbatim) {\n                    engine.eval(verbatimCode.toString());\n\
  \                    verbatimCode.delete(0, verbatimCode.length());\n          \
  \      }\n            }\n            else if (verbatim)\n                verbatimCode.append(line).append(\"\
  \\n\");\n            else {\n                String[] fragments = line.split(\"\
  `\");\n                for (int i = 0; i < fragments.length; i++) {\n          \
  \          IO.print(i % 2 == 0 ? fragments[i] : engine.eval(fragments[i]));\n  \
  \              }\n                IO.println();\n            }\n        }\n    }\n\
  }\n```\n\n列表 8.3 v2ch08/script/worksheet\n\n```java\nvar name = java.lang.IO.readln(\"\
  What is your name? \");\nvar age = 1 * java.lang.IO.readln(\"How old are you? \"\
  );\n```\nHello, `name`! Next year, you will be `age + 1`.\n```\n\n# 第 9 章 ▪ 安全\n\
  \n当 Java 技术首次出现时，人们的兴奋并不源于一种精良的编程语言，而是源于安全执行通过 Internet 的 applet 的可能性。显然，只有当接收者确定代码不会对其机器造成破坏时，提供可执行的\
  \ applet 才有实际意义。因此，安全一直是 Java 技术设计者和用户关注的焦点。这意味着与其他语言和系统不同（在那些系统中，安全是事后考虑或作为对入侵的反应实现的），而安全机制是\
  \ Java 技术不可或缺的一部分。\n\n安全架构由三部分组成：\n\n1.  语言和虚拟机设计特性（数组边界检查、无类型转换、无指针算术等）。\n2.  安全管理器，用于控制代码可以做什么（文件访问、网络访问等）。\n\
  3.  代码签名，通过标准加密算法来验证 Java 代码。\n\n第一部分取得了巨大的成功。C++ 程序经常受到缓冲区溢出等攻击，但 Java 提供了强大的保护。遗憾的是，其他部分并不理想。安全管理器非常复杂且攻击面很大，它从\
  \ Java 17 开始被弃用。代码签名架构随着 applet 和 Java Start——这两种客户端安全交付机制的终结而消失。\n\n在本书之前的版本中，安全管理器和代码签名是本章的重点，但显然这些需求已经消失。我们首先讨论检查类文件完整性的类加载器。我将演示该机制如何检测篡改。然后，你将学习用于许多安全操作的认证框架和加密算法。\n\
  \n## 9.1 类加载器\n\nJava 编译器将源代码转换为虚拟机的代码。虚拟机代码存储在扩展名为 `.class` 的类文件中。每个类文件包含一个类或接口的定义和实现。在节节，你将看到虚拟机如何加载这些类文件。\n\
  \n### 9.1.1 类加载过程\n\n虚拟机只加载执行程序所需的类文件。例如，假设执行从 `MyProgram.class` 开始。虚拟机执行的步骤如下：\n\
  \n1.  虚拟机具有加载类文件的机制——例如从磁盘读取文件或从 Web 请求文件；它使用该机制加载 `MyProgram` 类文件的内容。\n2.  如果 `MyProgram`\
  \ 类具有其他类类型的字段或超类，它们的类文件也会被加载。（加载一个给定类所依赖的所有类的过程被称为*解析*该类。）\n3.  虚拟机随后执行 `MyProgram`\
  \ 中的 `main` 方法。\n4.  如果 `main` 方法或 `main` 调用的方法需要额外的类，这些类将被加载。\n\n然而，类加载机制并不只使用单一类加载器。每个\
  \ Java 程序至少拥有三个类加载器：\n\n*   启动类加载器 (bootstrap class loader)\n*   平台类加载器 (platform\
  \ class loader)\n*   系统类加载器（system class loader，有时称为应用类加载器）\n\n\n\n启动类加载器（bootstrap\
  \ class loader）加载模块中包含的平台类：\n\n```\njava.base\njava.datatransfer\njava.desktop\n\
  java.instrument\njava.logging\njava.management\njava.management.rmi\njava.naming\n\
  java.prefs\njava.rmi\njava.security.sasl\njava.xml\n```\n\n以及许多 JDK 内部模块。\n\n不存在与启动类加载器相对应的\
  \ `ClassLoader` 对象。例如：\n\n```\nStringBuilder.class.getClassLoader()\n```\n\n返回 `null`。\n\
  \n在 Java 9 之前，Java 平台类位于一个 `rt.jar` 文件中。如今，Java 平台是模块化的，每个平台模块都包含在一个 `JMOD` 文件中（参见第一卷第\
  \ 9 章）。平台类加载器加载所有未被启动类加载器加载的 Java 平台类。\n\n系统类加载器（system class loader）从模块路径（module\
  \ path）和类路径（class path）加载应用类。\n\n在 Java 9 之前，“扩展类加载器”（extension class loader）从 `jre/lib/ext`\
  \ 目录加载“标准扩展”，并且“被认可的标准重写”（endorsed standards override）机制提供了一种用新版本覆盖某些平台类（包括 CORBA\
  \ 和 XML 实现）的方法。这两个机制都已被移除。\n\n### 9.1.2. 类加载器的层级结构\n\n类加载器之间存在`父/子`关系。除了启动类加载器外，每个类加载器都有一个父类加载器。类加载器会给其父类一个机会来加载给定的类，只有在父类加载失败时它才会加载该类。例如，当要求系统类加载器加载平台类（例如\
  \ `java.lang.StringBuilder`）时，它首先询问平台类加载器。该类加载器首先询问启动类加载器。启动类加载器找到并加载了该类，因此其他类加载器都不会继续向下搜索。\n\
  \n某些程序具有插件架构，其中代码的某些被封装为可选插件。如果插件被封装为 JAR 文件，你只需使用 `URLClassLoader` 实例来加载插件类。\n\n\
  ```\nvar url = new URL(\"file:///path/to/plugin.jar\");\nvar pluginLoader = new\
  \ URLClassLoader(new URL[] { url });\nClass<?> cl = pluginLoader.loadClass(\"mypackage.MyClass\"\
  );\n```\n\n由于 `URLClassLoader` 构造函数中没有指定父类，`pluginLoader` 的父类是系统类加载器。图 9.1 显示了该层级结构。\n\
  \n图 9.1：类加载器的层级结构\n\n在 Java 9 之前，系统类加载器是 `URLClassLoader` 的一个实例。某些程序员使用强制转换来访问 `getURLs`\
  \ 方法，或者通过反射调用保护的 `addURLs` 方法将 JAR 文件添加到类路径中。这现在已不再可能。\n\n在大多数情况下，你不需要担心类加载器的层级结构。通常，类的加载是因为它们被其他类所需要，而这个过程对你来说是透明的。\n\
  \n然而，有时你需要干预并指定一个类加载器。考虑这个用例：\n\n*   你的应用代码包含一个调用 `Class.forName(classNameString)`\
  \ 的辅助方法。\n*   该方法是从插件类中调用的。\n*   `classNameString` 指定了一个包含在插件 JAR 中的类。\n\n插件的作者希望加载该类。然而，辅助方法所在的类是由系统类加载器加载的，而\
  \ `Class.forName` 使用的正是这个加载器。插件 JAR 中的类是不可见的。这种现象被称为`类加载器反转`（classloader inversion）。\n\
  \n为了解决这个问题，辅助方法需要使用正确的类加载器。它可以接收类加载器作为参数。或者，它可以要求将正确的类加载器设置为当前线程的`上下文类加载器`context\
  \ class loader）。这种策略被许多框架（如 JAXP 和 JNDI）使用。\n\n每个线程都有一个类加载器的引用，称为上下文类加载器。主线程的上下文类加载器是系统类加载器。当创建一个新线程时，它的上下文类加载器被设置为创建该线程的上下文类加载器。因此，如果你什么都不做，所有线程的上下文类加载器都将被设置为系统类加载器。\n\
  \n然而，你可以通过调用以下代码设置任何类加载器：\n\n```\nThread t = Thread.currentThread();\nt.setContextClassLoader(loader);\n\
  ```\n\n随后辅助方法可以获取上下文类加载器：\n\n```\nThread t = Thread.currentThread();\nClassLoader\
  \ loader = t.getContextClassLoader();\nClass<?> cl = loader.loadClass(className);\n\
  ```\n\n如果你编写了一个按名称加载类的方法，那么为调用者提供显式传递类加载器和使用上下文类加载器的选择是一个明智之举。不要直接使用方法所在类的类加载器。\n\
  \n### 9.1.3. 使用类加载器作为命名空间\n\n每个 Java 程序员都知道包名被用于消除命名冲突。标准库中有两个名为 `Date` 的类，但它们的真实名称显然是\
  \ `java.util.Date` 和 `java.sql.Date`。简单名只是为了方便程序员，并且需要包含适当的 `import` 语句。在运行的程序中，所有类名都包含它们的包名。\n\
  \n然而，令你惊讶的是，你可以在同一个虚拟机中拥有具有相同`类和包`名称的两个类。一个类是由其全名`以及`类加载器决定的。这种技术对于从多个源加载代码非常有用。例如，应用程序服务器为每个应用程序使用单独的类加载器。这允许虚拟机区分来自不同应用程序的类。图\
  \ 9.2 显示了一个示例。假设应用程序服务器加载了两个不同的应用程序，每个应用程序都有一个 `Util` 类。由于每个类都由单独的类加载器加载，这些类是不同的且不冲突。\n\
  \n图 9.2：两个类加载器加载相同的类。\n\n### 9.1.4. 编写自己的类加载器\n\n你可以编写特殊目的的类加载器。这允许你在将字节码传递给虚拟机之前执行自定义检查。例如，你的类加载器可以拒绝加载未标记为“已付费”的类。\n\
  \n要编写自己的加载器，只需扩展 `ClassLoader` 类并重写方法\n\n```\nfindClass(String className)\n```\n\
  \n`ClassLoader` 基类的 `loadClass` 方法处理委托逻辑，仅在类尚未加载且父类加载器无法加载该类时才调用 `findClass`。\n\n\
  你的方法实现必须执行以下操作：\n\n1.  从本地文件系统或其他源加载类的字节码。\n2.  调用 `ClassLoader` 基类的 `defineClass`\
  \ 方法将字节码提交给虚拟机。\n\n在列表 9.1](#index.xhtml_ch09list01)的程序中，我们实现了一个加载加密类文件的加载器。程序询问用户要加载的第一个类的名称（即包含\
  \ `main` 方法的类）以及解密密钥。然后它使用特殊的类加载器加载指定的类并调用 `main` 方法。该类加载器解密指定的类以及它引用的所有非系统类。\n\n\
  为了简单起见，我们忽略了密码学领域 2000 年的进步，使用古老的凯撒加密对类文件进行加密。\n\nDavid Kahn 的经典著作《密码破》（Macmillan,\
  \ 1967, p. 84）引用了苏提乌斯作为凯撒加密的历史来源。凯撒将罗马字母表的 24 个字母移动了 3 个字母，这在当时困扰了他的对手。\n\n\n\n\n\
  当本章首次撰写时，美国政府限制强加密方法的出口。因此，我在示例中使用了 `Caesar’s method method`，因为它在出口方面显然是合法的。\n\n\
  我们版本的凯撒密码使用的密钥是一个位于 1 到 255 之间的数字。要进行解密，只需将该密钥加到每个字节并对 256 取模即可。Listing 9.2 中的 `Caesar.java`\
  \ 程序执行了加密操作。\n\n为了不混淆常规类加载器，我们为加密类文件使用了不同的扩展名 `.caesar`。\n\n解密时，类加载器简单地从每个字节中减去密钥。在本书的配套代码中，你会找到四个使用密钥值\
  \ 3 加密的类文件——这是传统的选择。要运行这个加密后的程序，你需要使用我们在 `ClassLoaderDemo` 程序中定义的自定义类加载器。\n\n尝试使用类名\
  \ `Calculator` 和解密密钥 `3` 运行程序进行测试。此时会弹出一个计算器窗口。但如果你使用不同的密钥，类加载器将抛出异常。\n\n加密类文件有许多实际用途（当然，前提是你使用了比凯撒密码更强的方法）。没有解密密钥，类文件就是无用的。它们既无法被标准虚拟机执行，也无法被轻易反编译。\n\
  \n这意味着你可以使用自定义类加载器来验证类的用户身份，或者在允许程序运行之前确保其已经过费。当然，加密只是自定义类加载器的应用之一。你还可以使用其他类型的类加载器来解决其他问题——例如将类文件存储在数据库中。\n\
  \nListing 9.1 v2ch09/classLoader/ClassLoaderDemo.java\n\n```java\npackage v2ch09.classLoader;\n\
  \nimport module java.base;\n\n/**\n * 此程序演示了一个解密类文件的自定义类加载器。\n */\nclass ClassLoaderDemo\
  \ {\n    void main(String[] args) throws Exception {\n        String className =\
  \ IO.readln(\"Class name: \");\n        int decryptionKey = Integer.parseInt(IO.readln(\"\
  Decryption key: \"));\n        var loader = new CryptoClassLoader(decryptionKey);\n\
  \        Class<?> c = loader.loadClass(className);\n        Method m = c.getMethod(\"\
  main\", String[].class);\n        m.invoke(null, (Object) new String[] {});\n  \
  \  }\n}\n\n/**\n * 此类加载器加载加密的类文件。\n */\nclass CryptoClassLoader extends ClassLoader\
  \ {\n    private int key;\n\n    /**\n     * 一个加密类加载器。\n     * @param k 解密密钥\n \
  \    */\n    public CryptoClassLoader(int k) {\n        key = k;\n    }\n\n    protected\
  \ Class<?> findClass(String name) throws ClassNotFoundException {\n        try {\n\
  \            byte[] classBytes = loadClassBytes(name);\n            Class<?> cl\
  \ = defineClass(name, classBytes, 0, classBytes.length);\n            if (cl ==\
  \ null) throw new ClassNotFoundException(name);\n            return cl;\n      \
  \  }\n        catch (IOException e) {\n            throw new ClassNotFoundException(name);\n\
  \        }\n    }\n\n    /**\n     * 加载并解密类文件字节。\n     * @param name 类名\n     *\
  \ @return 包含类文件字节的数组\n     */\n    private byte[] loadClassBytes(String name) throws\
  \ IOException {\n        String cname = name.replace(\".\", \"/\") + \".caesar\"\
  ;\n        // 从此类加载器相同的目录读取加密的类文件\n        byte[] bytes = getClass().getResourceAsStream(cname).readAllBytes();\n\
  \        for (int i = 0; i < bytes.length; i++)\n            bytes[i] = (byte) (bytes[i]\
  \ - key);\n        return bytes;\n    }\n}\n```\n\nListing 9.2 v2ch09/classLoader/Caesar.java\n\
  \n```java\npackage v2ch09.classLoader;\n\nimport module java.base;\n\n/**\n * 使用凯撒密码加密或解密文件。在命令行上提供输入文件、输出文件\n\
  \ * 以及加密密钥（解密时提供其负数）。\n */\nclass Caesar {\n    void main(String[] args) throws\
  \ Exception {\n        try (var in = new FileInputStream(args[0]); var out = new\
  \ FileOutputStream(args[1])) {\n            int key = Integer.parseInt(args[2]);\n\
  \            boolean done = false;\n            while (!done) {\n              \
  \  int ch = in.read();\n                if (ch == -1)\n                    done\
  \ = true;\n                else\n                    out.write((byte) (ch + key));\n\
  \            }\n        }\n    }\n}\n```\n\n`java.lang.Class`1.0\n\n*   `ClassLoader\
  \ getClassLoader()`\n\n    获取加载此类的类加载器。\n\n`java.lang.ClassLoader`1.0\n\n*   `ClassLoader\
  \ getParent()`1.2\n\n    返回父类加载器，如果父类加载器是引导程序类加载器，则返回 `null`。\n\n*   `static ClassLoader\
  \ getSystemClassLoader()`1.2\n\n    获取系统类加载器——即用于加载第一个应用程序类的类加载器。\n\n*   `protected\
  \ Class findClass(String name)`1.2\n\n    应该由类加载器重写，以查找类的字节码，并通过调用 `defineClass`\
  \ 方法将其呈现给虚拟机。在类名中，使用 `.` 作为包名分隔符，不要使用 `.class`。\n\n*   `Class defineClass(String\
  \ name, byte[] byteData, int offset, int length)`\n\n    向虚拟机添加一个字节码在该范围的新类。\n\n\
  `java.net.URLClassLoader`1.2\n\n*   `URLClassLoader(URL[] urls)`\n\n*   `URLClassLoader(URL[]\
  \ urls, ClassLoader parent)`\n\n    构造一个从给定 URL 加载类的加载器。如果 URL 以 `/` 结尾，则假设为目录，否则视为\
  \ JAR 文件。\n\n`java.lang.Thread`1.0\n\n*   `ClassLoader getClassLoader()`1.2\n\n\
  \    获取创建此线程的线程指定的类加载器。\n\n*   `void setContextClassLoader(ClassLoader loader)`1.2\n\
  \n    设置线程加载类的类加载器。如果在启动线程时没有设置类加载器，则使用父线程的上下文类加载器。\n\n### 9.1.5 字节码验证\n\n当类加载器将新加载的\
  \ Java 类字节码呈现给虚拟机时，这些字节码首先经过*验证器*的检查。验证器检查指令不会执行明显的破坏性操作。所有类都经过验证。\n\n以下是验证器执行的一些检查：\n\
  \n*   变量在使用前已初始化。\n*   方法调用与对象引用匹配。\n*   没有违反访问私有数据和方法的规则。\n*   局部变量访问位于运行时栈内。\n\
  *   运行时栈不会溢出。\n\n如果这些检查中的任何一个失败，该类将被认为已损坏且不会加载。\n\n\n这种严格的验证是一项重要的安全考量。意外错误（如未初始化的变量）如果不被捕获，很容易造成破坏性后果。更重要的是，在互联网这样一个开放的世界里，你必须防范那些故意制造恶意影响的攻击性程序员。例如，通过修改运行时栈上的值或通过向平台对象的私有实例字段写入数据，程序可以突破浏览器的安全系统。\n\
  \n然而，你可能会想，为什么需要一个特殊的验证器来检查所有这些特性呢？毕竟，编译器绝不会允许你生成一个使用了未初始化变量、或从另一个类访问私有实例字段的类文件。事实上，Java\
  \ 编程语言编译器生成的类文件总是通过验证的。然而，类文件中使用的字节码格式有详尽的文档，对于具有汇编编程和十六进制编辑器经验的人来说，手动生成一个包含有效但不安全指令的类文件并非易事。验证器始终在防范恶意篡改的类文件——而不仅仅是检查编译器产生的类文件。\n\
  \n以下是如何构造此类被修改的类文件的示例。我们从 Listing 9.3 中的程序 `VerifierDemo.java` 开始。这是一个简单的程序，调用了一个方法并显示该方法的结果。`fun`\
  \ 方法本身计算 `1 + 2`。\n\n```\nstatic int fun() {\n    int m;\n    int n;\n    m = 1;\n\
  \    n = 2;\n    int r = m + n;\n    return r;\n}\n```\n\n作为一项实验，尝试编译该程序的的以下修改版本：\n\
  \n```\nstatic int fun() {\n    int m = 1;\n    int n;\n    m = 1;\n    m = 2;\n\
  \    int r = m + n;\n    return r;\n}\n```\n\n在这里，`n` 没有被初始化，因此它可能有任何随机值。当然，编译器检测到了这个问题并拒绝编译该程序。为了创建一个“坏的”（bad）类文件，我们必须多花点脑筋。首先，运行\
  \ `javap` 程序来查看编译器是如何翻译 `fun` 方法的。命令\n\n```\njavap -c v2ch09.verifier.VerifierDemo\n\
  ```\n\n以助记符形式显示类文件中的字节码。\n\n```\nMethod int fun()\n    0 iconst_1\n    1 istore_0\n\
  \    2 iconst_2\n    3 istore_1\n    4 iload_0\n    5 iload_1\n    6 iadd\n    7\
  \ istore_2\n    8 iload_2\n    9 ireturn\n```\n\n使用十六进制编辑器将指令 3 从 `istore_1` 改为\
  \ `istore_0`。这意味着，局部变量 0（即 `m`）被初始化了两次，而局部变量 1（即 `n`）完全没有被初始化。我们需要知道这些指令的十六进制值；这些值可以在\
  \ Java 虚拟机规范（[`docs.oracle.com/javase/specs/jvms/se21/html/index.html`](https://docs.oracle.com/javase/specs/jvms/se21/html/index.html））中获取。\n\
  \n```\n0 iconst_1 04\n1 istore_0 3B\n2 iconst_2 05\n3 istore_1 3C\n4 iload_0  1A\n\
  5 iload_1  1B\n6 iadd     60\n7 istore_2 3D\n8 iload_2  1C\n9 ireturn  AC\n```\n\
  \n你可以使用任何十六进制编辑器进行修改。在 Figure 9.3 中，你看到类文件 `VerifierDemo.class` 被载入 Gnome 十六进制编辑器，`fun`\
  \ 方法的字节码被高亮显示。\n\n![Figure](img/fig09-04.jpg)图 9：使用十六进制编辑器修改字节码\n\n将 `3C` 改为 `3B`\
  \ 并保存类文件。然后尝试运行 `VerifierDemo` 程序。你得到了一个错误信息：\n\n```\nException in thread \"main\"\
  \ java.lang.VerifyError:\n    (class: VerifierDemo, method:fun signature: ()I)\n\
  \    Accessing value from uninitialized register 1\n```\n\n这很好——虚拟机检测到了我们的修改。\n\n\
  现在使用 `-noverify`（或 `-Xverify:none`）选项运行程序：\n\n```\njava -noverify v2ch09.verifier.VerifierDemo\n\
  ```\n\n`fun` 方法返回了一个看似随机的值。这实际上是 `2` 加上偶然存储在变量 `n` 中的值，而该变量从未被初始化。\n\n这是一个典型的输出：\n\
  \n```\n1 + 2 == 15102330\n```\n\n`-noverify` 和 `-Xverify:none` 选项已过用并可能被移除，但在它们可用期间，它们展示了损坏的影响。\n\
  \nListing 9.3 v2ch09/verifier/VerifierDemo.java\n\n```\npackage v2ch09.verifier;\n\
  \n/**\n * 此应用程序演示了虚拟机的字节码验证器。如果你使用十六进制\n * 编辑器修改类文件，那么虚拟机应该能检测到篡改。\n */\nclass VerifierDemo\
  \ {\n    public static void main(String[] args) {\n        System.out.println(\"\
  1 + 2\");\n    }\n\n    /**\n     * 计算 1 的函数\n     * @return 如果未损坏，则返回结果\n     */\n\
  \    public static int fun() {\n        int m;\n        int n;\n        m = 1;\n\
  \        n = 2;\n        int r = m + n;\n        return r;\n    }\n}\n```\n\n##\
  \ 9.2 用户认证\n\nJava API 提供了一个名为 Java 认证与授权服务（JAAS）的框架，它提供了访问认证机制的接口。\n\n### 9.2.1\
  \ JAAS 框架\n\n从名称可以看出，JAAS 包含两个部分。“身份验证”部分关注用户的身份。以下是登录的基本概述：\n\n```\ntry {\n   \
  \ var context = new LoginContext(\"Login1\"); // 定义在 JAAS 配置中\n    context.login();\n\
  \    // 获取已认证的 Subject\n    Subject subject = context.getSubject();\n    // . .\n\
  \    context.logout();\n} catch (LoginException e) { // 如果登录未成功则抛出异常\n    e.printStackTrace();\n\
  }\n```\n\n现在 `subject` 表示已通过认证的个人。`LoginContext` 中的字符串参数 `\"Login1\"` 指向 JAAS 配置中同名的条目。这是一个示例配置：\n\
  \n```\nLogin1 {\n    com.sun.security.auth.module.UnixLoginModule required;\n  \
  \  com.whizzbang.auth.module.RetinaScanModule sufficient=\"true\";\n};\n\nLogin2\
  \ {\n    // . .\n};\n\nother {\n    // . .\n};\n```\n\n模块类名和标志后面可以跟随任意数量的选项，这些选项会被传递给模块的构造函数。当登录上下文名称与配置中的任何名称都不匹配时，使用特殊名称\
  \ `other`。\n\n当然，JDK 不包含生物识别登录模块。以下模块在 `com.sun.security.auth.module` 包中提供：\n\n\
  ```\nUnixLoginModule\nNTLoginModule\nKrb5LoginModule\nJndiLoginModule\nKeyStoreLoginModule\n\
  ```\n\n一个登录策略由一系列登录模块组成，每个模块标记为 `required`、`sufficient`、`requisite` 或 `optional`。这些关键字的含义由以下算法给出：\n\
  \n1. 逐执行模块，直到某个 `sufficient` 模块成功、某个 `requisite` 模块失败或到达模块列表结束。\n2. 如果所有 `required`\
  \ 和 `requisite` 模块都成功，或者它们都没有被执行，且至少有一个 `sufficient` 或 `optional` 模块成功，则认证成功。\n\n\
  登录认证的是一个 *subject*（主体），它可以有多个 *principals*（主体）。一个 principal 描述主体的某些属性，例如用户名、组 ID\
  \ 或角色。`com.sun.security.auth.UnixPrincipal` 描述 UNIX 登录名，`UnixNumericGroupPrincipal`\
  \ 可以测试对 UNIX 组的成员身份。\n\nListing 9.4 中的程序显示当前登录用户的 principals。以如下方式运行程序\n\n\n\n\n\
  \n```java\njava -Djava.security.auth.login.config=v2ch09/auth/jaas.config v2ch09.auth.AuthDemo\n\
  ```\n\nListing 9.5 显示了登录配置。\n\n在 Windows 上，请将 `jaas.config` 中的 `UnixLoginModule`\
  \ 改为 `NTLoginModule`。\n\nListing 9.4 v2ch09/auth/AuthDemo.java\n\n```java\npackage\
  \ v2ch09.auth;\n\nimport module java.base;\n\n/**\n * 此程序获取有关用户 Unix 登录的信息。\n */\n\
  class AuthDemo {\n    void main() {\n        try {\n            var context = new\
  \ LoginContext(\"Login1\");\n            context.login();\n            IO.println(\"\
  Authentication successful.\");\n            Subject subject = context.getSubject();\n\
  \            for (Principal p : subject.getPrincipals()) {\n                IO.println(p.getClass().getName()\
  \ + \": \" + p.getName());\n            }\n            context.logout();\n     \
  \   }\n        catch (LoginException e) {\n            IO.println(\"Authentication\
  \ failed.\");\n            e.printStackTrace();\n        }\n    }\n}\n```\n\nListing\
  \ 9.5 v2ch09/auth/jaas.config\n\n```config\nLogin1 \n{       \n   com.sun.security.auth.module.UnixLoginModule\
  \ required;\n};\n```\n\n`javax.security.auth.login.LoginContext`1.4\n\n*   `LoginContext(String\
  \ name)`\n    构造一个登录上下文。`name` 对应 JAAS 配置文件中的登录描述符。\n*   `void login()`\n    建立登录，如果登录失败则抛出\
  \ `LoginException`。调用 JAAS 配置文件中模块的 `login` 方法。\n*   `void logout()`\n    注销主体（subject）。调用\
  \ JAAS 配置文件中模块的 `logout` 方法。\n*   `Subject getSubject()`\n    返回已认证的主体。\n\n`javax.security.auth.Subject`1.4\n\
  \n*   `Set<Principal> getPrincipals()`\n    获取此主体的主体者（principals）。\n\n`java.security.Principal`1.1\n\
  \n*   `String getName()`\n    返回该主体者的标识名称。\n\n### 9.2.2. JAAS 登录模块\n\n在本节中，我们将查看一个\
  \ JAAS 示例，它将向你展示：\n\n*   如何实现自己的登录模块\n*   如何实现基于角色的授权\n\n如果你在数据库中存储登录信息，那么提供自己的登录模块将很有用。\n\
  \n登录模块的工作之一是填充正在认证的主体的主体集（principal set）。如果登录模块支持角色，它会添加描述角色的 `Principal` 对象。Java\
  \ 库没有提供为此目的的类，因此我编写了自己的实现类（参见 Listing 9.6）。\n\n登录模块在文本文件中查找用户、密码和角色，该文件包含如下内容的行：\n\
  \n```text\nharry|secret|admin\ncarl|guessme|HR\n```\n\n当然，在实际的登录模块中，你会将这些信息存储在数据库或目录中。并且你会对密码进行哈希处理——参见\
  \ Section 9.3.2\n\n\n\n你可以在 Listing 9.7 中找到 `SimpleLoginModule` 的代码。`checkLogin`\
  \ 方法检查用户名和密码是否与密码文件中的记录匹配。如果是，我们向主体的主体集添加两个 `Principal` 对象：\n\n```java\nSet<Principal>\
  \ principals = subject.getPrincipals();\nprincipals.add(new UserPrincipal(username));\n\
  principals.add(new RolePrincipal(role));\n```\n\n`UserPrincipal` 类声明在 `com.sun.security.auth`\
  \ 包中。\n\n`SimpleLoginModule` 的其余部分是简单的管道衔接工作。`initialize` 方法接收以下内容：\n\n*   正在认证的\
  \ `Subject`\n*   用于检索登录信息的处理程序（handler）\n*   一个用于登录模块之间通信的 `sharedState` map\n*\
  \   一个包含包含在登录配置中设置的键值对的 `options` map\n\n例如，我们如下配置我们的模块：\n\n```config\nSimpleLoginModule\
  \ required passwordFile=\"jaas/password.txt\" debug=true;\n```\n\n`initialize` 方法从\
  \ `options` 参数中检索 `passwordFile` 和 `debug` 设置。\n\n登录模块并不负责收集用户名和密码；那是单独处理程序的职责。这种分离允许你使用同一个登录模块，而无需担心登录信息来自\
  \ GUI 对话框、控制台提示还是配置文件。\n\n在构造 `LoginContext` 时指定处理程序，例如：\n\n```java\nvar context\
  \ = new LoginContext(\"Login1\",\n    new com.sun.security.auth.callback.TextCallbackHandler());\n\
  ```\n\n`TextCallbackHandler` 类从控制台提示用户名和密码。\n\n然而，你通常会有自己的用户界面来收集用户名和密码。在这种情况下，回调机制显得大材小用，但没有其他方法来传输这些信息。Listing\
  \ 9.8 中的示例应用程序使用了一个简单的处理程序，仅存储并返回这些信息。\n\n处理程序有一个方法 `handle`，用于处理 `Callback` 对象的数组。若干预定义类（如\
  \ `NameCallback` 和 `PasswordCallback`）实现了 `Callback` 接口。你也可以添加自己的类，例如 `RetinaScan`。\n\
  \n```java\npublic void handle(Callback[] callbacks) {\n    for (Callback callback\
  \ : callbacks) {\n        switch (callback) {\n            case NameCallback c ->\
  \ c.setName(username);\n            case PasswordCallback c -> c.setPassword(password);\n\
  \            default -> {}\n        }\n    }\n}\n```\n\n`SimpleLoginModule` 的 `login`\
  \ 方法准备了认证所需的所需的回调数组：\n\n```java\nvar nameCallback = new NameCallback(\"username:\
  \ \");\nvar passwordCallback = new PasswordCallback(\"password: \", false);\ncallbackHandler.handle(new\
  \ Callback[] { nameCallback, passwordCallback });\n```\n\n根据处理程序的不同，`handle` 方法可以询问用户或从某处检索信息。当\
  \ `handle` 方法返回时，`nameCallback` 和 `passwordCallback` 对象已经设置。然后，`login` 方法检索用户名和密码并检查它们是否有效。\n\
  \nListing 9.9 中的程序使用 `TextCallbackHandler` 或自定义登录，用户名位于命令行上，并提示密码。当登录成功时，将显示主体者。按如下方式运行程序：\n\
  \n```bash\njava -Djava.security.auth.login.config=v2ch09/auth/jaas.config v2ch09.auth.AuthDemo\n\
  ```\n\n或者\n\n```bash\njava -Djava.security.auth.login.config=v2ch09/auth/jaas.config\
  \ v2ch09.auth.AuthDemo harry\n```\n\n支持一种更复杂的两阶段协议可能的，即如果登录配置中的所有模块都成功了，登录将被*提交*（committed）。欲更多信息，请参阅登录模块开发者指南：[`docs.oracle.com/javase/8/docs/technotes/guides/security/jaas/JAASLMDevGuide.html`](https://docs.oracle.com/javase/8/docs/technotes/guides/security/jaas/JAASLMDevGuide.html)。\n\
  \n\n\n\n\n```java\npackage v2ch09.jaas;\n\nimport module java.base;\nimport com.sun.security.auth.UserPrincipal;\n\
  \n/**\n * 此登录模块通过从文本文件中读取用户名、密码和角色来验证用户身份信息。\n */\npublic class SimpleLoginModule\
  \ implements LoginModule {\n    private Subject subject;\n    private CallbackHandler\
  \ callbackHandler;\n    private boolean debug;\n    private String passwordFile;\n\
  \n    public void initialize(Subject subject, CallbackHandler callbackHandler,\n\
  \            Map<String, ?> sharedState, Map<String, ?> options) {\n        this.subject\
  \ = subject;\n        this.callbackHandler = callbackHandler;\n        debug = options.get(\"\
  debug\").equals(\"true\");\n        passwordFile = \"\" + options.get(\"passwordFile\"\
  );\n    }\n\n    public boolean login() throws LoginException {\n        var nameCallback\
  \ = new NameCallback(\"username: \");\n        var passwordCallback = new PasswordCallback(\"\
  password: \", false);\n        try {\n            if (debug) {\n               \
  \ System.Logger logger = System.getLogger(\"com.horstmann.corejava\");\n       \
  \         logger.log(System.Logger.Level.INFO, \"Invoking handler\");\n        \
  \    }\n            if (callbackHandler == null) throw new LoginException(\"no handler\"\
  );\n\n            callbackHandler.handle(new Callback[] { nameCallback, passwordCallback\
  \ });\n            return checkLogin(nameCallback.getName(), passwordCallback.getPassword());\n\
  \        }\n        catch (UnsupportedCallbackException | IOException e) {\n   \
  \         var e2 = new LoginException();\n            e2.initCause(e);\n       \
  \     throw e2;\n        }\n    }\n\n    /**\n     * 检查身份信息是否有效。如果有效，主体（subject）获取用户名和角色的主体（principals）。\n\
  \     * @param username 用户名\n     * @param password 包含密码的字符数组\n     * @return 如果身份信息有效，则返回\
  \ true\n     */\n    private boolean checkLogin(String username, char[] password)\
  \ throws IOException {\n        try (var in = new Scanner(Path.of(passwordFile)))\
  \ {\n            while (in.hasNextLine()) {\n                String[] inputs = in.nextLine().split(\"\
  \\\\|\");\n                if (inputs[0].equals(username)\n                    \
  \    && Arrays.equals(inputs[1].toCharArray(), password)) {\n                  \
  \  String role = inputs[2];\n                    Set<Principal> principals = subject.getPrincipals();\n\
  \                    principals.add(new UserPrincipal(username));\n            \
  \        principals.add(new RolePrincipal(role));\n                    return true;\n\
  \                }\n            }\n            return false;\n        }\n    }\n\
  \n    public boolean logout() {\n        return true;\n    }\n\n    public boolean\
  \ abort() {\n        return true;\n    }\n\n    public boolean commit() {\n    \
  \    return true;\n    }\n}\n```\n列表 9.8 `v2ch09/jaas/SimpleCallbackHandler.java`\n\
  \n```java\npackage v2ch09.jaas;\n\nimport module java.base;\n\n/**\n * 此简单的回调处理器呈现给定的用户名和密码。\n\
