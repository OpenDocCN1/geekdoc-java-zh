  Writer out = Files.newBufferedWriter(path);\n```\n\n这些便利方法省去了你处理 `FileInputStream`、`FileOutputStream`、`BufferedReader`\
  \ 或 `BufferedWriter` 的麻烦。\n\n\n\n\n\n## `java.nio.file.Files` 7\n\n*   `static byte[]\
