  \n# 第 4 章 网络\n\n本章首先回顾基本的网络概念，然后编写连接到网络服务的 Java 程序。我们将展示网络客户端和服务器的实现。最后，你将看到如何从\
  \ Java 程序发送电子邮件，以及如何从 Web 服务器获取信息。\n\n## 4.1 连接到服务器\n\n在接下来的节中，你将连接到服务器，首先通过手动和使用\
  \ telnet，然后通过 Java 程序。\n\n### 4.1.1 使用 telnet\n\ntelnet 程序是网络编程的极佳调试工具。你应该能够从命令行壳输入\
  \ `telnet` 来启动它。\n\n\n\n\n\n你可能用过 `telnet` 连接到远程计算机，但你也可以用它与 Internet 主机提供的其他服务进行通信。以下是一个你可以执行的操作示例。输入：\n\
  \n```\ntelnet time-a.nist.gov 13\n```\n\n如图 4.1 所示，你应该得到类似下面行的返回：\n\n```\n57488\
  \ 16-04-10 04:23:00 50 0 0 610.5 UTC(NIST) *\n```\n\n![Figure](img/fig03-01_new.jpg)图\
  \ 4.1：“当天时间”服务的输出\n\n发生了什么？你连接到了大多数 UNIX 机器持续运行的“当天时间”服务。你连接的这个特定服务器由美国国家标准与技术研究院（NIST）运行，它提供铯原子钟的测量值。（当然，由于网络延迟，报告的时间并不完全准确。）\n\
  \n按照惯例，“当天时间”服务总是绑定在“端口”号 13。\n\n在网络术语中，端口不是物理设备，而是一种促进服务器与客户端之间通信的抽象（参见图 4.2）。\n\
  \n.Figure 4.2：连接到服务器端口的客户端\n\n服务器软件在远程机器上持续运行，等待任何想要与端口 13 “聊天”的网络流量。当远程计算机上的操作系统接收到一个包含连接到端口号\
  \ 13 请求的网络数据包时，它会唤醒监听服务器进程并建立连接。该连接将保持开启，直到被其中一方终止。\n\n当你开始在端口 13 与 `time-a.nist.gov`\
  \ 建立 `telnet` 会话时，一段网络软件足以将字符串 `\"time-a.nist.gov\"` 转换为正确的 Internet 协议 (IP) 地址\
  \ 129.6.15.28。然后，`telnet` 软件向该地址发送连接请求，请求建立到端口 13 的连接。一旦连接建立，远程程序就会返回一行数据并关闭连接。通常情况下，客户端和服务器在其中一方关闭连接之前会进行更广泛的对话。\n\
  \n这里是另一个类似的实验——但更有趣。输入：\n\n```\ntelnet horstmann.com 80\n```\n\n然后非常仔细地输入以下内容：\n\
  \n```\nGET /index.html HTTP/1.1\nHost: horstmann.com\nblank line\n```\n\n也就是说，最后按两次回车键。\n\
  \n图 4.3 显示了响应。它看起来应该非常熟悉——你获得了一页 HTML 格式的文本，即 Cay Horstmann 的主页。\n\n![Figure](img/Capture-Terminal.jpg)图\
  \ 4.3：使用 `telnet` 访问 HTTP 端口\n\n这与你的网络浏览器获取网页时经历的过程完全相同。它使用 HTTP 从服务器请求网页。当然，浏览器会更漂亮地显示\
  \ HTML 代码。\n\n当你连接到在同一 IP 地址上托管多个域名的 Web 服务器时，需要 `Host` 键/值对。如果服务器只托管一个单一域名，你可以省略它。\n\
  \n### 4.1.2. 使用 Java 连接到服务器\n\n我们在 Listing 4.1 中的第一个网络程序将执行与我们使用 `telnet` 时相同的事情——连接到端口并打印出找到的内容。\n\
  \nListing 4.1 v2ch04/socket/SocketDemo.java\n\n```\npackage v2ch04.socket;\n\nimport\
  \ module java.base;\n\n/**\n * 此程序与科罗拉多州博尔德的原子钟建立套字连接，\n * 并打印出服务器发送的时间。\n */\n\
  class SocketDemo {\n    void main() throws Exception {\n        try (var s = new\
  \ Socket(\"time-a.nist.gov\", 13);\n                var in = new Scanner(s.getInputStream()))\
  \ {\n            while (in.hasNextLine()) {\n                String line = in.nextLine();\n\
  \                IO.println(line);\n            }\n        }\n    }\n}\n```\n\n\
  这个简单程序的关键语句是：\n\n```\nvar s = new Socket(\"time-a.nist.gov\", 13);\nInputStream\
  \ inStream = s.getInputStream();\n```\n\n第一行打开了一个*socket*（套字），这是一种网络软件抽象，允许数据进入和离开此程序。我们将远程地址和端口号传递给套字构造函数。如果连接失败，将抛出一个\
  \ `UnknownHostException`，它是 `IOException` 的子类。\n\n`java.net.Socket` 中的 `getInputStream`\
  \ 方法返回一个 `InputStream` 对象，你可以像使用任何其他流一样使用它。如果无法从套字读取，该方法将抛出 `IOException`。一旦你获取了流，此程序只需将每个输入行打印到标准输出。此过程将一直持续，直到流结束且服务器断开连接。\n\
  \n此程序仅适用于非常简单的服务器，例如“当天时间”服务。在更复杂的网络程序中，客户端向服务器发送请求数据，服务器可能在响应结束时不会立即断开连接。你将在本章的几个示例看到如何实现这种行为。\n\
  \n`Socket` 类非常愉快且易于使用，因为它隐藏了建立连接和发送数据的复杂性。Java 提供了你跨平台使用的相同接口。在书中，我们只涵盖了传输控制协议 (TCP)。Java\
  \ 平台还支持用户数据报协议 (UDP)，它可以发送包（称为*数据报*），且开销比 TCP 小。它的缺点是包不需要按顺序交付，甚至可能丢失。UDP 适用于容忍丢包的应用。\n\
  \n`java.net.Socket`1.0\n\n*   `Socket(String host, int port)`\n\n    构造一个连接到给定主机和端口的套字。\n\
  \n*   `InputStream getgetInputStream()`\n\n*   `OutputStream getOutputStream()`\n\
  \n### 4.1.3. Socket 超时\n\n从套字读取会阻塞直到数据可用。如果主机不可访问，你的应用程序将等待很久，取决于底层操作系统何时超时。\n\n\
  你可以决定对于你的特定应用程序什么超时值是合理的。然后调用 `setSoTimeout` 方法设置超时值（毫秒）。\n\n```\nvar s = new Socket(.\
  \ . .);\ns.setSoTimeout(10000); // 10 秒后超时\n```\n\n如果为套字设置了超时值，所有后续读取操作在操作完成前达到超时将抛出\
  \ `SocketTimeoutException`。你可以捕获该异常并响应超时。\n\n```\ntry {\n    InputStream in = s.getInputStream();\
  \ // 从 in 读取\n    . . .\n} catch (SocketTimeoutException e) {\n    响应超时\n}\n```\n\
  \n写操作没有超时。\n\n还有一个额外的超时问题需要解决。构造函数\n\n```\nSocket(String host, int port)\n```\n\n\
  可能会无限阻塞直到建立初始连接。\n\n你可以通过首先构造一个未连接的套字，然后带超时连接它来解决这个问题：\n\n```\nvar s = new Socket();\n\
  s.connect(new InetSocketAddress(host, port), timeout);\n```\n\n参见第 4.2.4 节如何允许用户随时中断套字连接。\n\
  \n`java.net.Socket`1.0\n\n*   `Socket()`1.1\n\n    创建一个尚未连接的套字。\n\n*   `connect(SocketAddress\
  \ address)`1.4\n\n    将套字连接到给定的地址。\n\n*   `connect(SocketAddress address, int timeoutInMilliseconds)`1.4\n\
  \n    将套字连接到给定的地址，如果时间间隔过期则抛出 `SocketTimeoutException`。\n\n\n\n\n设置此套接字读取请求的阻塞时间。如果在读取时达到超时，则会抛出\
  \ `SocketTimeoutException`。\n\n*   `boolean isConnected()` 1.4\n*   `boolean isClosed()`\
  \ 1.4\n    如果套接字已连接或关闭，则返回 `true`。\n\n### 4.1.4. Internet 地址\n\n通常，你不需要太担心互联网地址——即由\
  \ 4 字节（如果使用 IPv6，则为 16 字节）组成的数值型主机地址，例如 `129.6.15.28`。然而，如果你需要在主机名和互联网地址之间转换，可以使用\
  \ `InetAddress` 类。\n\n`java.net` 包支持 IPv6 互联网地址，前提是主机操作系统也支持。\n\n静态方法 `getByName`\
  \ 返回一个主机的 `InetAddress` 对象。例如，\n\n```\nInetAddress address = InetAddress.getByName(\"\
  time-a.nist.gov\");\n```\n\n返回一个封装了四个字节序列 `129.6.15.28` 的 `InetAddress` 对象。你可以通过\
  \ `getAddress` 方法访问这些字节。\n\n```\nbyte[] addressBytes = address.getAddress();\n```\n\
  \n一些流量很大的主机名对应于多个互联网地址，以便于负载均衡。例如，在本文编写时，主机名 `google.com` 对应十二个不同的互联网地址。访问主机时，会随机选择其中一个。你可以使用\
  \ `getAllByName` 方法获取所有主机。\n\n```\nInetAddress[] addresses = InetAddress.getAllByName(host);\n\
  ```\n\n最后，你有时需要本地主机的地址。如果你只是请求 `localhost` 的地址，你总是得到本地回环地址 `127.0.0.1`，其他人无法通过它连接到你的计算机。相反，使用静态方法\
  \ `getLocalHost` 来获取你本地主机的地址。\n\n```\nInetAddress address = InetAddress.getLocalHost();\n\
  ```\n\nListing 4.2 是一个简单的程序，如果不指定任何命令行参数，它将打印本地主机的互联网地址；如果你在命令行上指定了主机名，它将打印另一个主机的所有互联网地址，例如\n\
  \n```\njava v2ch04.inetAddress.InetAddressDemo www.horstmann.com\n```\n\nListing\
  \ 4.2 v2ch04/inetAddress/InetAddressDemo.java\n\n```\npackage v2ch04.inetAddress;\n\
  \nimport module java.base;\n\n/**\n * 此程序演示了 InetAddress 类。提供主机名作为命令行\n * 参数，或在不带命令行参数的情况下以查看本地主机的地址。\n\
  \ */\nclass InetAddressDemo {\n    void main(String[] args) throws Exception {\n\
  \        if (args.length > 0) {\n            String host = args[0];\n          \
  \  InetAddress[] addresses = InetAddress.getAllByName(host);\n            for (InetAddress\
  \ a : addresses)\n                System.out.println(a);\n        }\n        else\
  \ {\n            InetAddress localHostAddress = InetAddress.getLocalHost();\n  \
  \          System.out.println(localHostAddress);\n        }\n    }\n}\n```\n\n`java.net.InetAddress`\
  \ 1.0\n\n*   `static InetAddress getByName(String host)`\n*   `static InetAddress[]\
  \ getAllByName(String host)`\n    为主定的主机名构造 `InetAddress` 或所有互联网地址的数组。\n*   `static\
  \ InetAddress getLocalHost()`\n    为本地主机构造一个 `InetAddress`。\n*   `byte[] getAddress()`\n\
  \    返回包含数值地址的字节数组。\n*   `String getHostAddress()`\n    返回一个由点分隔的十进制字符串，例如 `\"129.6.15.28\"\
  `。\n*   `String getHostName()`\n    返回主机名。\n\n### 4.2. 实现服务器\n\n现在我们已经实现了一个可以从互联网接收数据的基础网络客户端，让我们来编写一个可以向客户端发送信息的简单服务器。\n\
  \n### 4.2.1. 服务器套接字\n\n服务器程序启动时，会等待客户端连接到它的端口。对于我们的示例程序，我们选择了端口号 8189，它没有被任何标准服务占用。`ServerSocket`\
  \ 类建立套接字。在我们的情况下，命令\n\n```\nvar s = new ServerSocket(8189);\n```\n\n建立了一个监控 8189\
  \ 端口的服务器。命令\n\n```\nSocket incoming = s.accept();\n```\n\n告诉程序无限等待，直到客户端连接到该端口。一旦有人通过网络发送正确的请求连接到此端口，该方法将返回一个表示所建立连接的\
  \ `Socket` 对象。你可以使用此对象来获取输入和输出流，如下代码所示：\n\n```\nInputStream inStream = incoming.getInputStream();\n\
  OutputStream outStream = incoming.getOutputStream();\n```\n\n服务器发送到服务器输出流的所有内容都将成为客户端程序的输入，而客户端程序的所有输出最终都会到达服务器的输入流。\n\
  \n在本章的所有示例中，我们都通过套接字传输文本。因此，我们将流转换为扫描器（Scanner）和写入器（Writer）。\n\n```\nvar in = new\
  \ Scanner(inStream);\nvar out = new PrintWriter(new OutputStreamWriter(outStream),\
  \ true /* autoFlush */);\n```\n\n让我们给客户端发送一个问候：\n\n```\nout.println(\"Hello! Enter\
  \ BYE to exit.\");\n```\n\n当你使用 `telnet` 连接到 8189 端口的服务器时，你将在屏幕上看到这个问候。在这个简单的服务器中，我们只是逐行读取客户端的输入并回显它。真正的服务器（例如\
  \ HTTP 服务器）会执行以下循环：\n\n1. 通过输入数据流接收客户端的命令。\n2. 解码命令。\n3. 收集客户端请求的信息。\n4. 通过输出数据流向客户端发送信息。\n\
  \n```\nString line = in.nextLine();\nout.println(\"Echo: \" + line);\n```\n\n根据输入计算并答案。最后，我们关闭输入套接字。\n\
  \n```\nincoming.close();\n```\n\n这就是它的全部。Listing 4.3 是完整的程序。\n\nListing 4.3 v2ch04/server/EchoServer.java\n\
  \n```\npackage v2ch04.server;\n\nimport module java.base;\n\n/**\n * 此程序实现了一个监听\
  \ 8189 端口或参数端口\n * 的服务器，并回显所有客户端输入。\n */\nclass EchoServer {\n    void main(String[]\
  \ args) throws Exception {\n        int port = args.length >= 1 ? Integer.parseInt(args[0])\
  \ : 8189;\n\n        try (var s = new ServerSocket(port); // 建立服务器\n           \
  \     Socket incoming = s.accept()) { // 等待客户端连接\n            serve(incoming);\n\
  \        }\n    }\n\n    void serve(Socket incoming) throws IOException {\n    \
  \    try (var in = new Scanner(incoming.getInputStream());\n                var\
  \ out = new PrintWriter(incoming.getOutputStream(), true /* autoFlush */)) {\n \
  \           out.println(\"Hello! Enter BYE to exit.\");\n\n            // 回显客户端输入\n\
  \            boolean done = false;\n            while (!done && in.hasNextLine())\
  \ {\n                String line = in.nextLine();\n                out.println(\"\
  Echo: \" + line);\n                if (line.strip().equals(\"BYE\")) done = true;\n\
  \            }\n        }\n    }\n}\n```\n\n要尝试一下，请编译并运行程序。然后使用 `telnet` 连接到 `localhost`（或\
  \ IP 地址 127.0.0.1）端口 8189。\n\n如果你直接连接到互联网，任何人都可以访问你的回服务器，只要他们知道你的 IP 地址和魔法端口号。\n\
  \n当你连接到端口时，你将看到图 4.4 所示的消息：\n\n```\nHello! Enter BYE to exit.\n```\n\n![Figure](img/fig03-04_alt.jpg)图\
  \ 4.4: 访问回显服务器\n\n`java.net.ServerSocket` 1.0\n\n*   `ServerSocket(int port)`\n\
  \    创建一个监控端口的服务器套接字。\n*   `Socket accept()`\n\n\n\n\n等待连接。此方法会阻塞（即空闲）当前线程，直到连接建立。该方法返回一个\
  \ `Socket` 对象，程序可以通过该对象与连接的客户端进行通信。\n\n- `void close()`：关闭服务器套接字。\n\n### 4.2.2.\
  \ 服务多个客户端\n\n前面的示例中的简单服务器存在一个问题。假设我们希望允许多个客户端同时连接到服务器。通常情况下，服务器在计算机上持续运行，而来自互联网各处的客户端可能想同时使用它。如果没有对多连接的支持，任何一个客户端都可能通过长时间连接来垄断服务。通过线程的魔力，我们可以做得更好。\n\
  \n每当我们知道程序已经建立了新的套接字连接时——也就是说，每当调用 `accept()` 返回一个套接字时，我们都会启动一个新的线程来处理服务器与*该*客户端之间的连接。主程序将直接返回并等待下一个连接。它会一直运行下去，直到服务器进程被杀死：\n\
  \n```\nExecutorService service = Executors.newVirtualThreadPerTaskExecutor();\n\
  while (true) {\n    Socket incoming = s.accept();\n    service.submit(() -> serve(incoming));\n\
  }\n```\n\n`serve` 方法包含了与客户端的通信循环：\n\n```java\npublic void serve(Socket incoming)\
  \ {\n    try (var in = new Scanner(incoming.getInputStream());\n            var\
  \ out = new PrintWriter(incoming.getOutputStream(),\n            true /* autoFlush\
  \ */)) {\n         处理输入并发送响应\n    }\n    catch (IOException e) {\n       // 处理异常\n\
  \    }\n}\n```\n\n当每个连接都启动一个新线程时，多个客户端就可以同时连接到服务器。你可以轻松地检查这一点。\n\n1. 编译并运行服务器程序（Listing\
  \ 4.4）。\n2. 打开几个 telnet 窗口，如图 4.5 所示。\n3. 在窗口之间切换并输入命令。注意，你可以同时通过所有窗口进行通信。\n4. 完成后，切换到启动服务器程序的窗口并按\
  \ `Ctrl+C` 将其杀死。\n\n![Figure](img/fig03-05_alt.jpg)图 4.5：多个同时通信的 telnet 窗口\nListing\
  \ 4.4 v2ch04/threaded/EchoServer.java\n\n```java\npackage v2ch04.threaded;\n\nimport\
  \ module java.base;\n\n/**\n * 此程序实现了一个多线程服务器，它监听 8189 端口并回显所有\n * 客户端输入。\n */\n\
  class EchoServer {\n    void main() throws Exception {\n        try (var s = new\
  \ ServerSocket(8189)) {\n            int i = 1;\n            ExecutorService service\
  \ = Executors.newVirtualThreadPerTaskExecutor();\n\n            while (true) {\n\
  \                Socket incoming = s.accept();\n                IO.println(\"Spawning\
  \ \" + i);\n                service.submit(() -> serve(incoming));\n           \
  \     i++;\n            }\n        }\n    }\n\n    void serve(Socket incoming) {\n\
  \        try (var in = new Scanner(incoming.getInputStream());\n               \
  \ var out = new PrintWriter(incoming.getOutputStream(), true /* autoFlush */)) {\n\
  \            out.println(\"Hello! Enter BYE to exit.\");\n\n            // 回显客户端输入\n\
  \            boolean done = false;\n            while (!done && in.hasNextLine())\
  \ {\n                String line = in.nextLine();\n                out.println(\"\
  Echo: \" + line);\n                if (line.strip().equals(\"BYE\")) done = true;\n\
  \            }\n        }\n        catch (IOException e) {\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n### 4.2.3. 半关闭\n\n*半关闭*（half-close）允许套接字连接的一端终止其输出，同时仍然从另一端接收数据。\n\
  \n这是一个典型的情况。假设你向服务器传输数据，但你初并不知道有多少数据。对于文件，你只需要在数据结束时关闭文件。然而，如果你关闭了套接字，你会立即与服务器断开且无法读取响应。\n\
  \n半关闭解决了这个问题。你可以关闭套接字的输出流，从而向服务器指示请求数据的已结束，但保持输入流开放。\n\n客户端看起来如下：\n\n```java\ntry\
  \ (var socket = new Socket(host, port)) {\n    var in = new Scanner(socket.getInputStream());\n\
  \    var writer = new PrintWriter(socket.getOutputStream());\n    // 发送请求数据\n  \
  \  writer.print(. . .);\n    writer.flush();\n    socket.shutdownOutput();\n   \
  \ // 现在 socket 是半关闭状态\n    // 读取响应数据\n    while (in.hasNextLine()) {\n        String\
  \ line = in.nextLine();\n        . . .\n    }\n}\n```\n\n服务器端只需读取输入直到到达输入流的结束。然后它发送响应。\n\
  \n当然，这种协议仅适用于一次性服务，例如 HTTP，其中客户端连接、发布请求、捕获响应然后断开连接。\n\n`java.net.Socket` 1.0\n\n\
  - `void shutdownInput()` 1.3\n- `void shutdownOutput()` 1.3：将输入流或输出流设置为“流的结束”。\n\
  - `boolean isInputShutdown()` 1.4\n- `boolean isOutputShutdown()` 1.4：如果输出已关闭则返回\
  \ `true`。\n\n### 4.2.4. 可中断的套接字\n\n在交互式应用程序中，你可能希望取消一个无响应的套接字。\n\n当你连接到套接字时，当前线程会阻塞直到连接建立。同样，当你通过套接字读取数据时，当前线程会阻塞直到操作成功或超时。（写入数据没有超时。）\n\
  \n使用虚拟线程时，套接字操作是可中断的，你不需要通过调用 `interrupt` 来取消。\n\n要中断套接字操作，请使用 `SocketChannel`，它是\
  \ `nio` 的特性。如下打开 `SocketChannel`：\n\n```java\nSocketChannel channel = SocketChannel.open(new\
  \ InetSocketAddress(host, port));\n```\n\n通道没有关联的流。相反，它有使用 `Buffer` 对象的 `read` 和\
  \ `write` 方法。（有关 NIO 缓冲区的更多信息请参见第二章。）这些方法在 `ReadableByteChannel` 和 `WritableByteChannel`\
  \ 接口中。。如果你不想处理缓冲区，可以使用 `Scanner` 类从 `SocketChannel` 读取，因为 `Scanner` 有一个接受 `ReadableByteChannel`\
  \ 参数的构造函数：\n\n```java\nvar in = new Scanner(channel);\n```\n\n将通道转换为输出流，使用静态方法 `Channels.newOutputStream`。\n\
  \n```java\nOutputStream outStream = Channels.newOutputStream(channel);\n```\n\n\
  这就是你需要做的。当线程在打开、读取或写入操作期间被中断时，操作不会阻塞，而是被异常终止。\n\nListing 4.5 中的程序对比了可中断和阻塞的套接字。服务器发送数字并在第十个数字后假装阻塞。你被询问想使用套接字还是通道。你也可以选择平台线程或虚拟线程。启动了一个客户端线程连接到服务器并打印输出。按回车中断客户端线程。如果你在前十个数字内这样做，你就可以中断线程。\n\
  \n然而，如果你使用套接字和平台线程，在前十个数字后的中断将不起。阻塞线程会一直阻塞直到服务器最终关闭连接。解决办法是使用通道或虚拟线程。\n\nListing\
  \ 4.5 v2ch04/interruptible/InterruptibleSocketDemo.java\n\n\n\n\n```java\npackage\
  \ v2ch04.interruptible;\n\nimport module java.base;\n\n/**\n * 此程序展示了如何中断一个 channel。\n\
  \ */\nclass InterruptibleSocketDemo {\n    void main() {\n        Thread.ofPlatform().start(new\
  \ TestServer());\n        boolean socket = IO.readln(\"Socket or channel? (S/C)\
  \ \").equalsIgnoreCase(\"S\");\n        boolean platform = IO.readln(\"Platform\
  \ or virtual? (P/V) \").equalsIgnoreCase(\"P\");\n        Runnable client = socket\
  \ ? this::useSocket : this::useChannel;\n        Thread clientThread = platform\
  \ ? Thread.ofPlatform().start(client)\n                : Thread.ofVirtual().start(client);\n\
  \n        IO.readln(\"Hit Enter to interrupt client\");\n        clientThread.interrupt();\n\
  \    }\n\n    /**\n     * 使用 channel 连接到测试服务器。\n     */\n    void useChannel() {\n\
  \        IO.println(\"Channel:\\n\");\n        try (SocketChannel channel = SocketChannel\n\
  \                .open(new InetSocketAddress(\"localhost\", 8189));\n          \
  \      Scanner in = new Scanner(channel)) {            \n            while (!Thread.currentThread().isInterrupted())\
  \ {\n                IO.print(\"Reading \");\n                if (in.hasNextLine())\
  \ {\n                    String line = in.nextLine();\n                    IO.println(line);\n\
  \                }\n            }\n        }\n        catch (IOException e) {\n\
  \            e.printStackTrace();\n        }\n        finally {\n            IO.println(\"\
  Channel closed\\n\");\n        }\n    }\n\n    /**\n     * 使用 socket 连接到测试服务器。\n\
  \     */\n    void useSocket() {\n        IO.println(\"Socket:\\n\");\n        try\
  \ (var sock = new Socket(\"localhost\", 8189); \n                Scanner in = new\
  \ Scanner(sock.getInputStream())) {\n            while (!Thread.currentThread().isInterrupted())\
  \ {\n                IO.print(\"Reading \");\n                if (in.hasNextLine())\
  \ {\n                    String line = in.nextLine();\n                    IO.println(line);\n\
  \                }\n            }\n        }\n        catch (IOException e) {\n\
  \            e.printStackTrace();\n        }\n        finally {\n            IO.println(\"\
  Socket closed\\n\");\n        }\n    }\n\n    /**\n     * 一个监听端口 8189 并向客户端发送数字的服务器，\n\
  \     * 在 10 个数字后模拟挂挂的服务器。\n     */\n    static class TestServer implements Runnable\
  \ {\n        public void run() {\n            try (var s = new ServerSocket(8189);\
  \ Socket incoming = s.accept()) {\n                serve(incoming);\n          \
  \  }\n            catch (Exception e) {\n                e.printStackTrace();\n\
  \                ;\n            }\n            finally {\n                IO.println(\"\
  Closing connection\\n\");\n            }\n        }\n\n        private void serve(Socket\
  \ incoming) throws IOException, InterruptedException {\n            int counter\
  \ = 0;\n            try (var out = new PrintWriter(incoming.getOutputStream(), true\
  \ /* autoFlush */)) {\n                while (counter < 100) {\n               \
  \     counter++;\n                    if (counter <= 10) out.println(counter);\n\
  \                    Thread.sleep(100);\n                }\n            }\n    \
  \    }\n    }\n}\n```\n\n`java.net.InetSocketAddress` 1.4\n\n* `InetSocketAddress(String\
  \ hostname, int port)`\n    使用给定的主机和端口构造地址对象，并在构造期间解析主机名。如果无法解析主机名，则地址对象的 `unresolved`\
  \ 属性被设置为 `true`。\n* `boolean isUnresolved()`\n    如果此地址对象无法解析，则返回 `true`。\n\n`java.nio.channels.SocketChannel`\
  \ 1.4\n\n* `static SocketChannel open(SocketAddress address)`\n    打开一个 socket channel\
  \ 并连接到远程地址。\n\n`java.nio.channels.Channels` 1.4\n\n* `static InputStream newInputStream(ReadableByteChannel\
  \ channel)`\n    构造一个从给定 channel 读取的输入流。\n* `static OutputStream newOutputStream(WritableByteChannel\
  \ channel)`\n    构造一个向给定 channel 写入的输出流。\n\n### 4.2.5 安全的 Socket 通信\n\n当你在互联网上实现客户端和服务器并交换机密信息时，你不希望使用明文流量。相反，你应该使用一种安全的通信机制。安全通信包含三个方面：\n\
  \n* 通信是加密的，因此第三方无法读取。\n* 服务器的身份通过数字签名进行认证，并由客户端进行验证。可选情况下，客户端也可以提供数字签名，但这在 Web 应用中并不常见。\n\
  * 传输的数据由发送者进行数字签名并由接收方验证，确保没有第三方修改或替换数据。\n\nTLS（传输层安全）协议是最常用的安全通信机制。它是 SSL（安全套接层）协议的继者。\n\
  \n在 Java 中，你使用 `javax.net.ssl` 包中的类来建立安全连接。以下是构造安全连接 socket 的方法：\n\n```\nSocketFactory\
  \ factory = SSLSocketFactory.getDefault();\nSocket s = factory.createSocket(host,\
  \ port);\n```\n\n对于安全的服务器 socket，你也使用工厂：\n\n```\nServerSocketFactory factory = SSLServerSocketFactory.getDefault();\n\
  ServerSocket s = factory.createServerSocket(port);\n```\n\n如果你需要配置客户端或服务器 socket\
  \ 的安全连接参数，将工厂返回的对象转换为 `SSLSocket` 或 `SSLServerSocket`：\n\n```\n((SSLServerSocket)\
  \ s).setNeedClientAuth(true);\n```\n\n客户端和服务器使用共享密钥加密流量。然而，它们需要知道自己确实是在相互通信，而不是与“中间人”通信。服务器出示证书来证明其真实性。该证书需要由客户端知的证书颁发机构签名。JDK\
  \ 内置了一个已知的证书颁发机构列表。你通常会从其中一个获取服务器证书并将其安装在服务器中。然而，为了测试，我们将生成自己的证书。\n\n请参第 9 章 有关证书以及用于管理它们的\
  \ `keytool` 程序的详细描述。以下是生成证书并将其放入服务器和客户端“密钥库”的命令。\n\n首先，生成服务器证书：\n\n```\nkeytool\
  \ -genkeypair -alias servercert -keyalg RSA -keysize 2048 -sigalg SHA256withRSA\
  \ \\\n    -keystore server.jks -storepass secret -ext san=ip:127.0.0.1,dns:localhost\n\
  ```\n\n你会被问若干关于服务器所属机构的问题。在演示中，你可以将它们全部保留默认值“unknown”。\n\n接下来，导出证书并将其导入客户端存储。\n\n\
  ```\nkeytool -exportcert -keystore server.jks -storepass secret -alias servercert\
  \ -rfc \\\n    -file servercert.pem\nkeytool -import -trustcacerts -file servercert.pem\
  \ -keystore client.jks \\\n    -storepass secret -keypass secret\n```\n\n在导入未由已知证书颁发机构签名的证书时，将询问你是否信任。回答\
  \ `yes`。\n\n现在启动服务器。你需要指定包含服务器证书的密钥库。\n\n```\njava -Djavax.net.ssl.keyStore=server.jks\
  \ -Djavax.net.ssl.keyStorePassword=secret \\\n    v2ch04.ssl.EchoServer\n```\n\n\
  然后运行客户端，指定包含客户端信任证书的密钥库。如果证书是由 JDK 已知的证书颁发机构签名的，则是不需要的。\n\n```\njava -Djavax.net.ssl.trustStore=client.jks\
  \ -Djavax.net.ssl.trustStorePassword=secret \\\n    v2ch04.ssl.EchoClient\n```\n\
  \n如果出现连接问题，尝试使用 `-Djavax.net.debug=ssl` 命令行选项运行客户端。\n\nListing 4.6 v2ch04/ssl/EchoClient.java\n\
  \n\n\n\n\n```java\npackage v2ch04.ssl;\n\nimport module java.base;\n\n/**\n * 此程序通过\
  \ SSL 连接到服务器并回显服务器响应。\n */\nclass EchoClient {\n    void main(String[] args) throws\
  \ Exception {\n        int port = args.length >= 1 ? Integer.parseInt(args[0]) :\
  \ 8189;\n        SocketFactory factory = SSLSocketFactory.getDefault();\n      \
  \  String message = \"\"\"\nHello\nWorld\nBYE\n\"\"\";\n        try (Socket s =\
  \ factory.createSocket(InetAddress.getLocalHost(), port);\n                OutputStream\
  \ os = s.getOutputStream();\n                var in = new Scanner(s.getInputStream()))\
  \ {\n            os.write(message.getBytes());\n            os.flush();\n      \
  \      boolean done = false;\n            while (!done) {\n                String\
  \ line = in.nextLine();\n                System.out.println(line);\n           \
  \     if (line.equals(\"Echo: BYE\")) done = true;\n            }\n        }\n \
  \   }\n}\n```\n\nListing 4.7 v2ch04/ssl/EchoServer.java\n\n```java\npackage v2ch04.ssl;\n\
