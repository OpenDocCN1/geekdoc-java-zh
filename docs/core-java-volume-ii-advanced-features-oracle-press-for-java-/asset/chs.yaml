  \ setContentPane(new JScrollPane(box));\n        validate();\n    }\n\n    /**\n\
  \     * 将当前图像保存到文件中。\n     * @param formatName 文件格式\n     */\n    public void saveFile(final\
  \ String formatName) {\n        if (images == null) return;\n        Iterator<ImageWriter>\
  \ iter = ImageIO.getImageWritersByFormatName(formatName);\n        ImageWriter writer\
  \ = iter.next();\n        var chooser = new JFileChooser();\n        chooser.setCurrentDirectory(new\
  \ File(\".\"));\n        String[] extensions = writer.getOriginatingProvider().getFileSuffixes();\n\
  \        chooser.setFileFilter(new FileNameExtensionFilter(\"图像文件\", extensions));\n\
  \n        int r = chooser.showSaveDialog(this);\n        if (r != JFileChooser.APPROVE_OPTION)\
  \ return;\n        File f = chooser.getSelectedFile();\n        try {\n        \
  \    ImageOutputStream imageOut = ImageIO.createImageOutputStream(f);\n        \
