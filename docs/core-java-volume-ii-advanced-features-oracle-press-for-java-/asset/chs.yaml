  };\n```\n`javax.security.auth.callback.CallbackHandler`\n\n* `void handle(Callback[]\
  \ callbacks)`\n  处理给定的回调，根据需要与用户交互，并将安全信息存储在回调中。\n\n`javax.security.auth.callback.NameCallback`\n\
  \n* `NameCallback(String prompt)`\n* `NameCallback(String prompt, String defaultName)`\n\
  \  使用给定的提示词（prompt）和默认名称创建一个 `NameCallback`。\n* `String getName()`\n* `void setName(String\
  \ name)`\n  获取或设置此回调收集的名称。\n* `String getPrompt()`\n  获取查询此名称时使用的提示词。\n* `String\
  \ getDefaultName()`\n  获取查询此名称时使用的默认名称。\n\n`javax.security.auth.callback.PasswordCallback`\n\
  \n* `PasswordCallback(String prompt, boolean echoOn)`\n  使用给定的提示词和一个标志（用于指示密码在输入时是否应回显显示）来构造\
  \ `PasswordCallback`。\n* `char[] getPassword()`\n* `void setPassword(char[] password)`\n\
  \  获取或设置此回调收集的密码。\n* `String getPrompt()`\n  获取查询此密码时使用的提示词。\n* `boolean isEchoOn()`\n\
  \  获取查询此密码时使用的回显标志。\n\n`javax.security.auth.spi.LoginModule`\n\n* `void initialize(Subject\
  \ subject, CallbackHandler handler, Map<String,?> sharedState, Map<String,?> options)`\n\
  \  初始化此 `LoginModule` 以验证给定的 `subject`。在登录过程中，使用给定的处理器收集登录信息。使用 `sharedState` 映射与其他登录模块进行通信。`options`\
  \ 映射包含登录配置中为此模块实例指定的键值对。\n* `boolean login()`\n  执行身份验证过程并填充主体的主体（principals）。如果登录成功，则返回\
  \ true。\n* `boolean commit()`\n  在所有登录模块都成功后调用，适用于需要两阶段提交的登录情景。如果操作成功，则返回 true。\n\
  * `boolean abort()`\n  当另一个登录模块的失败导致登录过程中止时调用。如果操作成功，则返回 true。\n* `boolean logout()`\n\
  \  注销此主体。如果操作成功，则返回 true。\n\n\n\n\n\n如前所述，applet 是引发 Java 热潮的起点。在实践中，人们发现尽管可以编写动画\
  \ applet（例如著名的“神经文本”），但在 `JDK 1.0` 安全模型下，applet 无法完成许多有用操作。例如，由于 `JDK 1.0` 下的 applet\
  \ 受到严格监控，即使在公司安全的内网中执行 applet 的风险相对较小，它们也无法在其中发挥发挥作用。Sun 公司很快意识到，要让 applet 变得真正有用，用户需要能够根据\
  \ applet 的来源分配 `different` 级别的安全策略。如果 applet 来自受信任的供应商且未被篡改，该 applet 的用户就可以决定是否赋予其更多权限。\n\
  \n为了给予 applet 更多的信任，我们需要知道两点：\n\n*   applet 来自自哪里？\n*   代码在传输过程中是否被损坏了？\n\n在过去的\
  \ 50 年里，数学家和计算机科学家开发了复杂的算法来确保数据的完整性并创建电子签名。`java.security` 包包含了许多此类算法的实现。幸运的是，你不需要理解底层的数学就可以使用\
  \ `java.security` 包中的算法。在接下来的章节中，我将向你展示消息摘要（message digests）如何检测数据文件的变化，以及数字签名如何证明签名者的身份。\n\
  \n### 9.3.1 消息摘要\n\n消息摘要是数据块的数字指纹。例如，所谓的 `SHA-1`（安全哈希算法 #1）可以将任何数据块（无论多长）压缩为 160\
  \ 位（20 字节）的序列。就像真实的指纹一样，人们希望两个不同的消息具有相同的 `SHA-1` 指纹。当然，这并不可能的——只有 `2¹⁶⁰` 种 `SHA-1`\
  \ 指纹，因此某些消息一定具有相同的指纹。但 `2¹⁶⁰` 是一个巨大的数字，以至于碰撞的概率可以忽略不计。多小呢？根据 James Walsh 在《True\
  \ Odds: How Risks Affect Your Everyday Life》（Merritt Publishing, 1996）中的说法，你被雷电击死的概率大约是\
  \ 3 万分之一。现在，想一下伪造消息与原始消息具有相同 `SHA-1` 指纹的概率。（当然，会有超过十个人——其中你可能并不认识他们任何人——死于雷击。然而，我们谈论的是你`particular\
  \ choice` 选择的人群被消灭的概率要小得多。）\n\n消息摘要有两个基本属性：\n\n*   如果数据的某位或几位发生了变化，消息摘要也会随之改变。\n\
  *   拥有给定消息的伪造者无法构造出一个与原始消息具有相同消息摘要的假消息。\n\n第二个属性同样是一个概率问题。考虑这位富翁父亲的以下消息：\n\n> “在我去世后，我的财产应平均分配给孩子们；然而，我的儿子\
  \ George 将一无所有。”\n\n这条消息（带有最后的换行符）的 `SHA-1` 指纹为：\n\n```\n12 5F 09 03 E7 31 30 19\
  \ 2E A6 E7 E4 90 43 84 B4 38 99 8F 67\n```\n\n不信任的父亲将消息留给了一位律师，将指纹留给了另一位。现在，假设 George\
  \ 贿赂了持有消息的律师。他想修改消息，让 Bill 一无所有。当然，这会让指纹变成完全不同的位模式：\n\n```\n7D F6 AB 08 EB 40 EC\
  \ CD AB 74 ED E9 86 F9 ED 99 D1 45 B1 57\n```\n\nGeorge 能找到其他匹配该指纹的措辞吗？如果他从地球形成起就拥有一十亿台计算机，每台计算机每秒计算百万条消息，他直到现在也找不到一个可以替换的消息。\n\
  \n已经设计了许多算法来计算此类消息摘要。其中包括 `SHA-1`（美国国家标准与技术研究院 NIST 开发的安全哈希算法）和 `MD5`（麻省理工 Ronald\
  \ Rivest 发明的算法）。这两种算法都以巧妙的方式打乱消息的位。有关这些算法的细节，请参考 William Stallings 的《Cryptography\
  \ and Network Security, Seventh Edition》（Pearson, 2017）。然而，在两种算法中都发现了细微的规律性，NIST\
  \ 建议切换到更强的替代方案。Java 支持 `SHA-2` 和 `SHA-3` 算法集。\n\n`MessageDigest` 类是用于创建封装指纹算法对象的\
  \ `factory`（工厂）。它有一个名为 `getInstance` 的静态方法，返回一个扩展自 `MessageDigest` 类的对象。这意味着 `MessageDigest`\
  \ 类承担了双重职责：\n\n*   作为工厂类\n*   作为所有消息摘要算法的父类\n\n例如，这里是获取可以计算 `SHA` 指纹对象的方法：\n\n```\n\
  MessageDigest alg = MessageDigest.getInstance(\"SHA-1\");\n```\n\n获取 `MessageDigest`\
  \ 对象后，通过反复调用 `update` 方法将消息中的所有字节传递给它。例如，以下代码将文件中的所有字节传递给新创建的 `alg` 对象以进行指纹提取：\n\
  \n```\nInputStream in = . . .;\nint ch;\nwhile ((ch = in.read()) != -1)\n.update((byte)\
  \ ch);\n```\n\n或者，如果你有一个字节数组，可以一次性更新整个数组：\n\n```\nbyte[] bytes = . .;\nalg.update(bytes);\n\
  ```\n\n完成后，调用 `digest` 方法。该方法完成哈希计算，返回计算出的摘要，并重置算法对象。\n\n```\nbyte[] hash = alg.digest();\n\
  ```\n\n列表 9.11 中的程序计算消息摘要。你可以在命令行指定文件和算法：\n\n```java\npackage hash;\n\nimport java.security.*;\n\
  import java.io.*;\nimport java.nio.file.*;\n\n/**\n * 该程序计算文件的消息摘要。\n */\nclass\
  \ Digest {\n    /**\n     * @param args args[0] 是文件名，args[1] 是可选的算法\n     * (SHA-1,\
  \ SHA-256 或 MD5)\n     */\n    static void main(String[] args) throws Exception\
  \ {\n        String filename = args.length >= 1 ? args[0] : IO.readln(\"File name:\
  \ \");\n        String algname;\n        if (args.length >= 2) {\n            algname\
  \ = args[1];\n        } else {\n            IO.println(\"选择以下算法之一： \");\n      \
  \      for (Provider p : Security.getProviders()) {\n                for (Provider.Service\
  \ s : p.getServices()) {\n                    if (s.getType().equals(\"MessageDigest\"\
  )) IO.println(s.getAlgorithm());\n                }\n            }\n           \
  \ algname = IO.readln(\"Algorithm: \");\n        }\n        MessageDigest alg =\
  \ MessageDigest.getInstance(algname);\n        byte[] input = Files.readAllBytes(Path.of(filename));\n\
  \        byte[] hash = alg.digest(input);\n        for (byte h : hash)\n       \
  \     IO.print(\"%02X \".formatted(h & 0xFF));\n        IO.println();\n    }\n}\n\
  ```\n\n\n\n\n\n出于明显的安全考虑，绝不应明文形式存储密码。相反，应该存储密码的哈希值。当用户登录时，对用户输入的密码也应进行哈希处理。如果两个值匹配，则用户通过身份验证。\n\
  \n然而，您在前一节中看到的哈希算法并不适用于密码哈希。为了防止破解攻击，哈希机制应该使用多轮计算。此外，为了避免预计算密码表（彩虹表），每个密码都应该随机随机“盐”（salt）值进行修改。\n\
  \nJava 提供了用于密码哈希的 `PBKDF2` 算法。算法有四个参数：\n\n*   持有密码的 `char` 数组\n*   随机盐的字节数组\n* \
  \  迭代次数\n*   输出的位数（bits）\n\n加盐的密码并不是消息，因此你不需要使用 `MessageDigest` 接口。相反，请使用这样的 `SecretKeyFactory`：\n\
  \n```\nvar spec = new PBEKeySpec(password, salt, ITERATIONS, 8 * HASH_BYTES);\n\
  SecretKeyFactory skf = SecretKeyFactory.getInstance(\"PBKDF2WithHmacSHA256\");\n\
  byte[] hash = skf.generateSecret(spec).getEncoded();\n```\n\n缩写 `PBE` 表示“基于密码的加密”，因为派生的字节也可以用作加密密钥。`PBKDF`\
  \ 是“基于密码的密钥派生函数”，它将短密码转换为较长的加密密钥。我们对加密并不感兴趣，只需存储生成的字节。对于密码验证，存储盐也是重要的。由于随着处理器的性能增强，随推移增加迭代次数是一项良好的做法，因此也应该存储该值。\n\
  \n在将哈希作为字符串存储时，字节应编码为十六进制（hex）或更高效的 base64 编码：\n\n```\nBase64.Encoder encoder =\
  \ Base64.getEncoder();\nString hashedPassword = ITERATIONS + \"|\" + encoder.encodeToString(salt)\
  \ + \"|\"\n    + encoder.encodeToString(hash);\n```\n\n要验证用户输入的密码，请从存储的哈希中获取迭代和盐，并重新计算哈希。\n\
  \n### 9.3.3. 消息签名\n\n在第 9.3.1 节中，你了解了如何计算消息摘要——消息的指纹。如果消息被篡改，修改后消息的指纹将与原始指纹不匹配。如果消息和其指纹分开传递，接收者就可以检查消息是否被篡改。然而，如果消息和指纹都被拦截了，那么修改消息并重新计算指纹轻而易举。毕竟，消息摘要算法是公开的，而且它们不需要密钥。在这种情况下，伪造消息的接收者和重新计算的指纹将永远不知道消息已被篡改。数字签名解决了这个问题。\n\
  \n为了帮助你理解数字签名的工作原理，让我们来看看来自*公钥加密*领域的几个概念。公钥加密基于*公钥*和*私钥*的概念。其思想是：向世界上所有人公布你的公钥。但是，只有你持有私钥，保护好它不泄露给其他人至关重要。密钥通过数学关系进行匹配，尽管这些关系的确切性质对我们并不重要。（如果你感兴趣，可以在《应用密码学手册》的[`cacr.uwaterloo.ca/hac/`](https://cacr.uwaterloo.ca/hac/)\
  \ 中查找。）\n\n密钥非常长且复杂。例如，这里有一对匹配的数字签名算法（DSA）公私钥。\n\n公钥：\n\n```\np: fca682ce8e12caba26efccf7110e526db078b05edecbcd1eb4a208f3ae1617ae01f35b91a47e6df63413c5e12\n\
  ed0899bcd132acd50d99151bdc43ee737592e17\n\nq: 962eddcc369cba8ebb260ee6b6a126d9346e38c5\n\
  \ng: 678471b27a9cf44ee91a49c5147db1a9aaf244f05a434d6486931d2d14271b9e35030b71fd73da179069b32e2\n\
  935630e1c2062354d0da20a6c416e50be794ca4\n\ny: c0b6e67b4ac098eb1a32c5f8c4c1f0e7e6fb9d832532e27d0bdab9ca2d2a8123ce5a8018b8161a760480fadd0\n\
  40b927281ddb22cb9bc4df596d7de4d1b977d50\n```\n\n私钥：\n\n```\np: fca682ce8e12caba26efccf7110e526db078b05edecbcd1eb4a208f3ae1617ae01f35b91a47e6df63413c5e12\n\
  ed0899bcd132acd50d99151bdc43ee737592e17\n\nq: 962eddcc369cba8ebb260ee6b6a126d9346e38c5\n\
  \ng: 678471b27a9cf44ee91a49c5147db1a9aaf244f05a434d6486931d2d14271b9e35030b71fd73da179069b32e2\n\
  935630e1c2062354d0da20a6c416e50be794ca4\n\ny: c0b6e67b4ac098eb1a32c5f8c4c1f0e7e6fb9d832532e27d0bdab9ca2d2a8123ce5a8018b8161a760480fadd0\n\
  40b927281ddb22cb9bc4df596d7de4d1b977d50\n```\n\n### 9.3.4. 验证签名\n\nJDK 自带了 `keytool`\
  \ 程序，这是一个用于生成和管理一组证书的命令行工具。我们预计该工具的功能最终将嵌入到其他更易用的程序中。但现在，我们将使用 `keytool` 来展示 Alice\
  \ 如何对文档签名并发送给 Bob，以及 Bob 如何验证该文档确实是由 Alice 签名而非冒充者签署。\n\n`keytool` 程序管理*密钥库*（keystores）——证书和私/公钥对的数据库。密钥库中的每个条目都有一个别别*（alias）。以下是\
  \ Alice 创建名为 `alice.jks` 的密钥库并生成别名为 `alice` 的密钥对的方法：\n\n```\nkeytool -genkeypair\
  \ -keyalg DSA -keystore alice.jks -alias alice\n```\n\n在创建或打开密钥库时，系统会提示输入密钥库密码。在本示例中，直接使用\
  \ `secret` 即可。如果你将 `keytool` 生成的密钥库用于任何严肃用途，则需要选择一个良好的密码并妥善保存文件。\n\n在生成密钥时，系统会提示以下信息：\n\
  \n\n\n\n\n```\nEnter keystore password:  secret\nReenter new password:  secret\n\
  What is your first and last name?\n  [Unknown]:  Alice Lee\nWhat is the name of\
  \ your organizational unit?\n  [Unknown]:  Engineering\nWhat is the name of your\
  \ organization?\n  [Unknown]:  ACME Software\nWhat is the name of your City or Locality?\n\
  \  [Unknown]:  San Francisco\nWhat is the name of your State or Province?\n  [Unknown]:\
  \  CA\nWhat is the two-letter country code for this unit?\n  [Unknown]:  US\nIs\
  \ <CN=Alice Lee, OU=Engineering, O=ACME Software, L=San Francisco, ST=CA, C=US>\
  \ correct?\n  [no]:  yes\n```\n\n`keytool` 使用 X.500 格式名称，其组件包括通用名称 (`CN`）、组织单位 (`OU`）、组织\
  \ (`O`）、地点 (`L`）、州 (`ST`）和国家 (`C`），用于标识密钥所有者和证书颁发者。\n\n假设 Alice 想将她的公钥发送给 Bob。她需要导出一个证书文件：\n\
  \n```\nkeytool -exportcert -keystore alice.jks -alias alice -file alice.cer\n```\n\
  \n现在 Alice 可以将证书发送给 Bob。当 Bob 接收到证书时，他可以将其打印：\n\n```\nkeytool -printcert -file alice.cer\n\
  ```\n\n输出如下：\n\n```\nOwner: CN=Alice Lee, OU=Engineering, O=ACME Software, L=San\
  \ Francisco, ST=CA, C=US\nIssuer: CN=Alice Lee, OU=Engineering, O=ACME Software,\
  \ L=San Francisco, ST=CA, C=US\nSerial number: b2b46ccd99479da2\nValid from: Tue\
  \ Jan 16 08:11:22 CET 2024 until: Mon Apr 15 09:11:22 CEST 2024\nCertificate fingerprints:\n\
  \  SHA1: 41:38:E6:F2:9D:FA:90:FE:CB:36:85:F1:E6:39:62:A1:5A:DD:16:BC\nBCSHA256:\
  \ 14:CC:AD:BC:83:D5:0C:F9:98:24:52:29:B3:AF:B2:B9:05:A7:C0:61:15:63:EA:FB:13:4F:73:37:D2:FD:8D:FB\n\
  Signature algorithm name: SHA256withDSA\nSubject Public Key Algorithm: 2048-bit\
  \ DSA key\nVersion: 3\n```\n\n如果 Bob 想要检查获得的证书是否正确，他可以打电话给 Alice 并通过电话验证证书指纹。\n\n\
  某些证书颁发者会在其网站上发布证书指纹。例如，要检查 `var jdk`/lib/security/cacerts` 目录下的 DigiCert 证书，可以使用\
  \ `-list` 选项：\n\n```\nkeytool -list -v -keystore $JAVA_HOME/lib/security/cacerts\n\
  ```\n\n该密钥库的密码为 `changeit`。该密钥库中的证书之一是：\n\n```\nOwner: CN=DigiCert Assured ID Root\
  \ G3, OU=www.digicert.com, O=DigiCert Inc, C=US\nIssuer: CN=DigiCert Assured ID\
  \ Root G3, OU=www.digicert.com, O=DigiCert Inc, C=US\nSerial number: ba15afa1ddfa0b54944afcd24a06cec\n\
  Valid from: Thu Aug 01 14:00:00 CEST 2013 until: Fri Jan 15 13:00:00 CET 2038\n\
  Certificate fingerprints:\n         SHA1: F5:17:A2:4F:9A:48:C6:C9:F8:A2:00:26:9F:DC:0F:48:2C:AB:30:89\n\
  \         SHA256: 7E:37:CB:8B:4C:47:09:0C:AB:36:55:1B:A6:F4:5D:B8:40:68:0F:BA:\n\
  \                 16:6A:95:2D:B1:00:71:7F:43:05:3F:C2\n```\n\n你可以通过访问网站 [`www.digicert.com/kb/digicert-root-certificates.htm`](https://www.digicert.com/kb/digicert-root-certificates.htm)\
  \ 来检查你的证书是否有效。\n\n一旦 Bob 信任该证书，他就可以将其导入密钥库：\n\n```\nkeytool -importcert -keystore\
  \ bob.jks -alias alice -file alice.cer\n```\n\n永远不要将你不完全信任的证书导入密钥库。一旦证书加入密钥库，任何使用该密钥库的程序都会认为该证书可以验证签名。\n\
  \n现在 Alice 可以开始向 Bob 发送签名文档了。`jarsigner` 用于签名并验证 JAR 文件。Alice 只需将需要签名的文档添加到 JAR\
  \ 文件中：\n\n```\njar cvf document.jar document\n```\n\n### 9.3.5. 身份验证问题\n\n确定发送者身份的问题被称为*身份验证问题*。\n\
  \n解决身份验证问题的通常方法很简单。假设陌生人和你有一个都信任的共同熟人。假设陌生人面见过你的熟人并递交了一个 U 盘。你的熟人随后见过你，保证该陌生人确实在软件公司工作，然后将\
  \ U 盘交给你（见图 9.5）。这样，你的熟人就为陌生人的真实性提供了担保。\n\n事实上，你的熟人并不一定需要和你见面。相反，他可以使用私钥对陌生人的公钥进行签名（见图\
  \ 9.6）。当你得到公钥文件时，你验证朋友的签名，因为你信任他，所以确信他在签名之前检查了陌生人的凭据。\n\n然而，你可能并没有共同熟人。某些信任模型假设存在一条“信任链”——一条共同熟人的链——因此你信任该链中的每一个成员。在实践中，事实并非总是如此。你可能信任朋友\
  \ Alice，并且 Alice 信任 Bob，但你不认识 Bob，也不确定是否信任他。其他信任模型假设存在一个我们都信任的仁慈大哥——一家公司。像 DigiCert、GlobalSign\
  \ 和 Entrust 等名称令人信赖的公司提供验证服务。\n\n你经常会遇到由一个或多个实体签名的数字签名，你需要评估自己对这些验证者的信任程度。你可能对某个证书颁发机构极极信任，也许因为你在许多网页上看到了他们的标志，或者你听过每当需要生成新的主密钥时，都需要几位带着黑色公文包的人聚集在一个安全房间室内。\n\
  \n\n\n\n然而，你应对实际正在验证的内容有一个现实的预期。你只需通过填写网络表单并支付少额费用即可获得“1 级”ID。密钥将发送到证书中包含的电子邮箱地址。因此，你可以合理地认为该邮箱地址是真实的，但请求者可能填写了*任何*名称和组织。还有更严格的\
  \ ID 级别。例如，对于“3 级”ID，证书颁发机构将要求个人请求者在公证员面前出现，并检查企业请求者的财务状况。其他身份验证器将有不同的程序。因此，当你收到一条经过验证的消息时，理解实际上到底验证了什么是非常重要的。\n\
  \n### 9.3.6. 证书签名\n\n在第 9.3.4 节中，你看到了 Alice 如何使用证书向 Bob 分发公钥。然而，Bob 需要通过与 Alice\
  \ 比对指纹来确保该证书的有效性。\n\n假设 Alice 想给她的同事 Cindy 发送一条签名消息，但 Cindy 不想费心验证大量的签名指纹。现在假设有一个\
  \ Cindy 信任的实体来验证签名。在这个示例中，Cindy 信任 ACME 软件的信息资源部门。\n\n该部门运行着*证书颁发机构*（CA）。ACME 的每个人的密钥库中都有\
  \ CA 的公钥，该公钥由系统管理员仔细检查密钥指纹后安装。CA 对 ACME 员工的密钥进行签名。当他们安装彼此的密钥时，密钥库将隐地信任它们，因为它们是由信任的密钥签名的。\n\
  \n以下是模拟这一过程的方法。创建一个密钥库 `acmesoft.jks`。生成一个密钥对并导出公钥：\n\n```\nkeytool -genkeypair\
  \ -keystore acmesoft.jks -keyalg DSA -alias acmeroot\nkeytool -exportcert -keystore\
  \ acmesoft.jks -alias acmeroot -file acmeroot.cer\n```\n\n公钥被导出为“自签名”证书。然后，将其添加到每个位员工的密钥库中：\n\
  \n```\nkeytool -importcert -keystore cindy.jks -alias acmeroot -file acmeroot.cer\n\
  ```\n\n为了让 Alice 向 Cindy 以及 ACME 软件的所有其他人发送消息，她需要向信息资源部门提交其证书的签名请求，并对其密钥进行签名。步骤如下：\n\
  \n```\nkeytool -keystore alice.jks -alias alice -certreq -file alice.req\nkeytool\
  \ -storepass secret -keystore acmesoft.jks -gencert -alias acmeroot \\\n    -infile\
  \ alice.req -outfile alice_signed_by_acmeroot.cer\n```\n\nAlice 将文件 `alice_signedby_acmeroot.cer`\
  \ 给 Cindy 以及 ACME 软件的任何其他人。或者，ACME 软件也可以简单地将文件存储在公司目录中。记住，此文件包含了 Alice 的公钥以及 ACME\
  \ 软件对该密钥确实属于 Alice 的断言。\n\n现在 Cindy 将签名的证书导入她的密钥库中：\n\n```\nkeytool -importcert\
  \ -keystore cindy.jks -alias alice -file alice_signedby_acmeroot.cer\n```\n\n密钥库验证了该密钥是由密钥库中已存在的信任根密钥签名的。Cindy*不需要*被要求验证证书指纹。\n\
  \n一旦 Cindy 添加了根证书以及经常向她发送文档的人员证书，在它们过期之前，她就不需要再担心这些证书了。\n\n### 9.3.7. 代码签名\n\n身份验证技术的常见用途是为可执行程序签名。如果你下载了一个程序，你自然会担心它可能造成的破坏。例如，该程序可能被病毒感染了。如果你知道代码的来源*并且*知道它自离开源处以来未被篡改过，那么你的安全感将比没有这些信息时高得多。\n\
  \n在本节中，我将向你展示如何为 JAR 文件签名，以及如何配置 Java 来验证签名。这种功能是为 applet 和 Java Web Start 应用设计的。这些不再是常用的技术，但你可能在旧产品中仍需要支持它们。\n\
  \n当 Java 首次发布时，applet 在加载后立即在“沙箱”中运行，权限有限。如果用户想要可以使用访问本地文件系统、建立网络连接等的 applet，他们必须显式同意。为了确保\
  \ applet 代码在传输过程中不被篡改，必须对其进行数字签名。\n\n这里有一个具体的例子。假设你在浏览互联网时，遇到一个网站提供运行来自未知供应商的 applet，前提是你授予其执行的权限（参见图\
  \ 9.7）。此类程序由 Java 运行时信任的证书颁发机构颁发的*软件开发者*证书签名。弹出对话框会标识软件开发者和证书颁发者。现在你需要决定是否授权该程序。\n\
  \n![Figure](img/fig09-17.jpg)图 9.7：启动已签名的 applet\n\n你拥有哪些可能影响你决策的事实？以下是你已知的信息：\n\
  \n*   Thawte 向软件开发者出售了一份证书。\n*   该程序确实是用该证书签名的，并且在传输过程中没有被修改。\n*   该证书确实是由 Thawte\
  \ 签名的——通过本地 `cacerts` 文件中的公钥进行了验证。\n\n当然，这些都不能告诉你代码运行是否安全。如果你仅知道供应商的名字以及 Thawte\
  \ 向他们出售了软件开发者证书这一事实，你就能信任这个供应商吗？这种方法一直没有意义。\n\n对于内网部署，证书更具可能。管理员可以在本地机器上安装策略文件和证书，这样对于信任的代码就不需要用户交互。然而，随着安全管理器（security\
  \ manager）的弃用，这种方法已不再可行。\n\n## 9.4. 加密\n\n到目前，我们讨论了 Java 安全 API 中实现的一种重要加密技术——即通过数字签名进行身份验证。安全的另一个重要方面是加密。即使经过了身份验证，信息本身也是清晰可见的。数字签名仅验证信息没有更改。相比之下，当信息被加密时，它是不可见的。它只能用匹配的密钥进行解密。\n\
  \n身份验证对于代码签名已经足够——不需要隐藏代码。然而，当应用程序传输机密（如信用卡号和其他个人数据）时，加密是必要的。\n\n过去，专利和出口管制限制了许多公司提供强加密。幸运的是，现在的出口控制已宽松得多，重要算法的专利已经过期。如今，Java\
  \ 作为标准库的一部分提供了优秀的加密支持。\n\n### 9.4.1. 对称加密\n\nJava 加密扩展包含一个 `Cipher` 类，它是所有加密算法的父类。要获取加密对象，调用\
  \ `getInstance` 方法：\n\n```\nCipher cipher = Cipher.getInstance(algorithmName);\n\
  ```\n\n或者\n\n```\nCipher cipher = Cipher.getInstance(algorithmName, providerName);\n\
  ```\n\nJDK 自带了由 `\"SunJCE\"` 提供者提供的加密算法。如果你不指定另一个提供者名称，它就是默认使用的提供者。如果你需要 Oracle\
  \ 不支持的特殊算法，你可能需要另一个提供者。\n\n算法名称是一个如 `\"AES\"` 或 `\"DES/CBC/PKCS5Padding\"` 的字符串。\n\
  \n\n\n数据加密标准 (DES) 是一种古老的块密码，密钥长度为 56 位。如今，DES 算法被认为是过时的，因为可以通过暴力破解破解。一个好得多的替代方案是它的继者——高级加密标准\
  \ (AES)。请参 [`nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.197.pdf`](https://nvlpubs.nist.gov/nistpubs/FIPS/NIST.FIPS.197.pdf)\
  \ 获取 AES 算法的详细描述。我在示例中使用了 AES。\n\n一旦你获得了一个加密对象，可以通过设置模式和密钥来初始化它：\n\n```\nint mode\
  \ = . . .;\nKey key = . . .;\ncipher.init(mode, key);\n```\n\n模式有以下之一：\n\n```\n\
  Cipher.ENCRYPT_MODE\nCipher.DECRYPT_MODE\nCipher.WRAP_MODE\nCipher.UNWRAP_MODE\n\
  ```\n\nwrap 和 unwrap 模式用一个密钥加密另一个密钥——请参见下一节的示例。\n\n现在你可以反复调用 `update` 方法来加密数据块：\n\
  \n```\nint blockSize = cipher.getBlockSize();\nvar inBytes = new byte[blockSize];\n\
  . . . // read inBytes\nint outputSize= cipher.getOutputSize(blockSize);\nvar outBytes\
  \ = new byte[outputSize];\nint outLength = cipher.update(inBytes, 0, outputSize,\
  \ outBytes);\n. . . // write outBytes\n```\n\n完成后后，你必须调用一次 `doFinal` 方法。如果存在最后的输入数据块（少于\
  \ `blockSize` 字节），则调用：\n\n```\noutBytes = cipher.doFinal(inBytes, 0, inLength);\n\
  ```\n\n如果所有输入数据都已加密，则调用：\n\n```\noutBytes = cipher.doFinal();\n```\n\n调用 `doFinal`\
  \ 是为了对最后一个块进行填充。考虑一下 DES 加密算法。它的块大小为八个字节。假设输入数据的最后一个块少于八个字节。当然，我们可以用 `0` 填充剩余字节，以获得一个八字节的最后一个块并对其进行加密。但当解密这些数据块时，结果会在末尾附加几个\
  \ `0` 字节，因此将与原始输入文件略有不同。为了避免这个问题，我们需要一种填充方案。一种常用的填充方案是 RSA Security, Inc. 在公钥密码标准\
  \ (PKCS) #5 中描述的方案 ([`datatracker.ietf.org/doc/html/rfc2898`](https://datatracker.ietf.org/doc/html/rfc2898))。\n\
  \n在该方案中，最后一个块不是用零填充值填充，而是用等于填充字节数的填充值填充。换句话说，如果 `L` 是最后一个（不完整的）块，它的填充方式如下：\n\n```\n\
  L 01                                if length(L) = 7\nL 02 02                  \
  \           if length(L) = 6\nL 03 03 03                          if length(L) =\
  \ 5\n. . .\nL 07 07 07 07 07 07 07              if length(L) = 1\n```\n\n最后，如果输入的长度实际上能被\
  \ 8 整除，则会在输入后附加并加密一个块：\n\n```\n08 08 08 08 08 08 08 08\n```\n\n解密后，明文的最后一个字节是需要丢弃的填充字符计数。\n\
  \n### 9.4.2. 密钥生成\n\n为了加密，你需要生成一个密钥。每个加密算法的密钥格式都不同，你需要确保密钥生成是随机的。遵循以下步骤：\n\n1. 为你的算法获取一个\
  \ `KeyGenerator`。\n2. 使用随机源初始化生成器。如果加密器的块长度是可变的，还要指定所需的块长度。\n3. 调用 `generateKey`\
  \ 方法。\n\n例如，这里是生成 AES 密钥的方法：\n\n```\nKeyGenerator keygen = KeyGenerator.getInstance(\"\
  AES\");\nvar random = new SecureRandom(); // see 下文\nkeygen.init(random);\nKey key\
  \ = keygen.generateKey();\n```\n\n或者，你可以从固定的原始数据产生密钥（可能派自密码或击键计时）。这样构造一个 `SecretKeySpec`（实现\
  \ `SecretKey` 接口）：\n\n```\nbyte[] keyData = . . .; // AES 使用 16 字节\nvar key = new\
  \ SecretKeySpec(keyData, \"AES\");\n```\n\n在生成密钥时，确保你使用了真正的随机数。例如，`Random` 类中的普通随机数生成器以当前日期和时间为种子，随机性不够。假设计算机时钟精确到\
  \ 1/10 秒。那么每天最多只有 864,000 个种子。如果攻击者知道密钥发放的日期（通常可以从消息日期或证书过期日期推断出来），生成当天所有可能的种子轻而易举。\n\
  \n`SecureRandom` 类生成的随机数比 `Random` 类产生的安全得多。你仍然需要提供一个种子以便从随机位置开始数字序列。执行此操作的最佳方法是从硬件设备（如白噪声生成器）获取随机输入。另一个合理的随机输入来源是让用户漫无目的地打字，以获取随机位给\
  \ `setSeed` 方法：\n\n```\nvar random = SecureRandom();\nvar b = new byte[20];\n//\
  \ fill with random bits\nrandom.setSeed(b);\n```\n\n如果你不为随机生成器种子，它将计算自己的随机位。这种算法是已知的。过去，依赖计算机某些组件（如磁盘访问时间的算法被证明是不随机的。本节末尾的程序让加密算法工作（见\
  \ 9.12）。示例程序是直观的。`-genkey` 选项产生一个新的密钥并将其序列化到文件中。`update` 和 `doFinal` 方法都会处理部分输入块（随后会被填充）或无额外数据（以生成填充块）。要使用该程序，你首先需要生成一个密钥。运行\n\
  \n```\njava v2ch09.aes.AESDemo -genkey secret.key\n```\n\n密钥保存在文件 `secret.key` 中。现在你可以使用命令加密：\n\
  \n```\njava v2ch09.aes.AESDemo -encrypt plaintextFile encryptedFile secret.key\n\
  ```\n\n使用以下命令解密：\n\n```\njava v2ch09.aes.AESDemo -decrypt encryptedFile decryptedFile\
  \ secret.key\n```\n\nListing 9.12 v2ch09/aes/AESDemo.java\n\n```java\npackage v2ch09.aes;\n\
  \nimport module java.base;\n\n/**\n * 此程序测试 AES 加密。它可以生成密钥密钥，\n * 或者加密或解密文件。\n */\n\
  class AESDemo {\n    void main(String[] args) throws Exception {\n        if (args[0].equals(\"\
  -genkey\")) {\n            KeyGenerator keygen = KeyGenerator.getInstance(\"AES\"\
  );\n            var random = new SecureRandom();\n            keygen.init(random);\n\
  \            SecretKey key = keygen.generateKey();\n            try (var out = new\
  \ ObjectOutputStream(new FileOutputStream(args[1]))) {\n                out.writeObject(key);\n\
  \            }\n        }\n        else {\n            int mode;\n            if\
  \ (args[0].equals(\"-encrypt\"))\n                mode = Cipher.ENCRYPT_MODE;\n\
  \            else\n                mode = Cipher.DECRYPT_MODE;\n\n            try\
  \ (var keyIn = new ObjectInputStream(new FileInputStream(args[3]));\n          \
  \          var in = new FileInputStream(args[1]);\n                    var out =\
  \ new FileOutputStream(args[2])) {\n                var key = (Key) keyIn.readObject();\n\
  \                Cipher cipher = Cipher.getInstance(\"AES\");\n                cipher.init(mode,\
  \ key);\n                Util.crypt(in, out, cipher);\n            }\n        }\n\
  \    }\n}\n```\n\nListing 9.13 v2ch09/aes/Util.java\n\n\n\n\n```java\npackage v2ch09.aes;\n\
  \nimport module java.base;\n\npublic class Util {\n    /**\n     * 使用加密算法变换输入流中的字节，并将变换后的字节\n\
  \     * 发送到输出流中。\n     * @param in 输入流\n     * @param out 输出流\n     * @param cipher\
  \ 用于变换字节的加密器对象\n     */\n    public static void crypt(InputStream in, OutputStream\
  \ out, Cipher cipher)\n            throws IOException, GeneralSecurityException\
  \ {\n        int blockSize = cipher.getBlockSize();\n        int outputSize = cipher.getOutputSize(blockSize);\n\
  \        var inBytes = new byte[blockSize];\n        var outBytes = new byte[outputSize];\n\
  \n        int inLength = 0;\n        boolean done = false;\n        while (!done)\
  \ {\n            inLength = in.read(inBytes);\n            if (inLength == blockSize)\
  \ {\n                int outLength = cipher.update(inBytes, 0, blockSize, outBytes);\n\
  \                out.write(outBytes, 0, outLength);\n            }\n           \
  \ else\n                done = true;\n        }\n        if (inLength > 0)\n   \
  \         outBytes = cipher.doFinal(inBytes, 0, inLength);\n        else\n     \
  \       outBytes = cipher.doFinal();\n        out.write(outBytes);\n    }\n}\n```\n\
  \n`javax.crypto.Cipher` 1.4\n\n*   `static Cipher getInstance(String algorithmName)`\n\
  *   `static Cipher getInstance(String algorithmName, String providerName)`\n   \
  \ 返回一个实现指定算法的 `Cipher` 对象。如果未提供算法，则抛出 `NoSuchAlgorithmException`。\n*   `int getBlockSize()`\n\
  \    返回加密块的大小（字节为单位），如果该加密器不是分组密码，则返回 `0`。\n*   `int getOutputSize(int inputLength)`\n\
  \    返回如果下次输入具有给定数量的字节，则所需的输出缓冲区的大小。此方法考虑了加密器对象中任何缓冲的字节。\n*   `void init(int mode,\
  \ Key key)`\n    初始化加密算法对象。mode 是 `ENCRYPT_MODE`、`DECRYPT_MODE`、`WRAP_MODE` 或 `UNWRAP_MODE`\
  \ 之一。\n*   `byte[] update(byte[] in)`\n*   `byte[] update(byte[] in, int offset,\
  \ int length)`\n*   `int update(byte[] in, int offset, int length, byte[] out)`\n\
  \    变换一个块输入数据。前两个方法返回输出。第三个方法返回放入 `out` 中的字节数。\n*   `byte[] doFinal()`\n*   `byte[]\
  \ doFinal(byte[] in)`\n*   `byte[] doFinal(byte[] in, int offset, int length)`\n\
  *   `int doFinal(byte[] in, int offset, int length, byte[] out)`\n    变换最后一个块输入数据并冲刷该算法对象的缓冲区。前三个方法返回输出。第四个方法返回放入\
  \ `out` 中的字节数。\n\n`javax.crypto.KeyGenerator` 1.4\n\n*   `static KeyGenerator getInstance(String\
  \ algorithmName)`\n    返回一个实现指定算法的 `KeyGenerator` 对象。如果未提供算法，则抛出 `NoSuchAlgorithmException`。\n\
  *   `void init(SecureRandom random)`\n*   `void init(int keySize, SecureRandom random)`\n\
  \    初始化密钥生成器。\n*   `SecretKey generateKey()`\n    生成新密钥。\n\n`javax.crypto.spec.SecretKeySpec`\
  \ 1.4\n\n*   `SecretKeySpec(byte[] key, String algorithmName)`\n    构造一个密钥规范。\n\n\
  ### 9.4.3. 加密流\n\nJCE 提供了一组方便的流类，可以自动加密或解密。例如，你可以通过以下方式加密数据：\n\n```java\nCipher\
  \ cipher = . . .;\ncipher.init(Cipher.ENCRYPT_MODE, key);\nvar out = new CipherOutputStream(new\
  \ FileOutputStream(filename), cipher);\nvar bytes = new byte[BLOCKSIZE];\nint inLength;\n\
  // ...\nout.write(bytes);\n// ...\n```\n\n同样，你可以通过以下方式解密数据：\n\n```java\nCipher cipher\
  \ = . . .;\ncipher.init(Cipher.DECRYPT_MODE, key);\nvar in = new CipherInputStream(new\
  \ FileInputStream(filename), cipher);\nvar bytes = new byte[BLOCKSIZE];\nint inLength;\n\
  while ((inLength = in.read(bytes)) != -1) {\n// ...\n}\n```\n\n只有 Bob 才能解密对称密钥，因为只有\
  \ Bob 拥有解密的私钥。因此，昂贵的公钥加密仅应用于少量的密钥数据。\n\n最常用的公钥算法是 RSA 算法，由 Rivest、Shamir 和 Adleman\
  \ 发明。直到 2000 年 10 月，该算法还受 RSA Security, Inc. 的专利保护。现在它属于公有领域。\n\n要使用 RSA 算法，你需要一对公私钥。使用如下所示的\
  \ `KeyPairGenerator`：\n\n```java\nKeyPairGenerator pairgen = KeyPairGenerator.getInstance(\"\
  RSA\");\nvar random = new SecureRandom();\npairgen.initialize(KEYSIZE, random);\n\
  KeyPair keyPair = pairgen.generateKeyPair();\nKey publicKey = keyPair.getPublic();\n\
  Key privateKey = keyPair.getPrivate();\n```\n\n公钥加密解决了密钥分发问题。在公钥密码中，Bob 有一个公钥和一个匹配的私钥。Bob\
  \ 可以公钥发布在任何地方，但必须保护私钥。Alice 只需要使用公钥加密消息。\n\n实际上，并非那么简单。所有已知的公钥算法都比对称算法慢得多。使用公钥算法加密大量信息是不实际的。然而，通过将公钥密码与对称算法结合可以轻松解决这个问题，如下：\n\
  \n1. Alice 生成一个随机对称密钥。使用它加密明文。\n2. Alice 用 Bob 的公钥加密对称密钥。\n3. Alice 向 Bob 发送加密后的对称密钥和加密后的明文。\n\
  4. Bob 使用他的私钥解密对称密钥。\n5. Bob 使用解密后的对称密钥解密消息。\n\n\n\n\n\n它随后生成一个包含以下内容的文件：\n\n- 被封装密钥的长度\n\
  - 被封装密钥的字节流\n- 使用 `AES` 密钥加密的明文\n\n`-decrypt` 选项解密此类文件。要尝试该程序，请先生成 RSA 密钥：\n\n```\n\
  java v2ch09.rsa.RSADemo -genkey public.key private.key\n```\n\n然后加密一个文件：\n\n```\n\
  java v2ch09.rsa.RSADemo -encrypt plaintextFile encryptedFile public.key\n```\n\n\
  最后，解密它并验证解密后的文件是否与明文匹配：\n\n```\njava v2ch09.rsa.RSADemo -decrypt encryptedFile decryptedFile\
  \ private.key\n```\n\n列表 9.14 `v2ch09/rsa/RSADemo.java`\n\n```java\npackage v2ch09.rsa;\n\
  \nimport module java.base;\n\nimport v2ch09.aes.Util;\n\n/**\n * 该程序测试 RSA 算法。它可以生成公钥和私钥对，\n\
  \ * 或者对文件进行加密或解密。\n */\nclass RSADemo {\n    final int KEYSIZE = 512;\n\n    void\
  \ main(String[] args) throws Exception {\n        if (args[0].equals(\"-genkey\"\
  )) {\n            KeyPairGenerator pairgen = KeyPairGenerator.getInstance(\"RSA\"\
  );\n            var random = new SecureRandom();\n            pairgen.initialize(KEYSIZE,\
  \ random);\n            KeyPair keyPair = pairgen.generateKeyPair();\n         \
  \   try (var out = new ObjectOutputStream(new FileOutputStream(args[1]))) {\n  \
  \              out.writeObject(keyPair.getPublic());\n            }\n          \
  \  try (var out = new ObjectOutputStream(new FileOutputStream(args[2]))) {\n   \
  \             out.writeObject(keyPair.getPrivate());\n            }\n        }\n\
  \        else if (args[0].equals(\"-encrypt\")) {\n            KeyGenerator keygen\
  \ = KeyGenerator.getInstance(\"AES\");\n            var random = new SecureRandom();\n\
  \            keygen.init(random);\n            SecretKey key = keygen.generateKey();\n\
  \n            // 使用 RSA 公钥封装\n            try (var keyIn = new ObjectInputStream(new\
  \ FileInputStream(args[3]));\n                    var out = new DataOutputStream(new\
  \ FileOutputStream(args[2]));\n                    var in = new FileInputStream(args[1]))\
  \ {\n                var publicKey = (Key) keyIn.readObject();\n               \
  \ Cipher cipher = Cipher.getInstance(\"RSA\");\n                cipher.init(Cipher.WRAP_MODE,\
  \ publicKey);\n                byte[] wrappedKey = cipher.wrap(key);\n         \
  \       out.writeInt(wrappedKey.length);\n                out.write(wrappedKey);\n\
  \n                cipher = Cipher.getInstance(\"AES\");\n                cipher.init(Cipher.ENCRYPT_MODE,\
  \ key);\n                Util.crypt(in, out, cipher);\n            }\n        }\n\
  \        else {\n            try (var in = new DataInputStream(new FileInputStream(args[1]));\n\
  \                    var keyIn = new ObjectInputStream(new FileInputStream(args[3]));\n\
  \                    var out = new FileOutputStream(args[2])) {\n              \
  \  int length = in.readInt();\n                var wrappedKey = new byte[length];\n\
  \                in.read(wrappedKey, 0, length);\n\n                // 使用 RSA 私钥解封装\n\
  \                var privateKey = (Key) keyIn.readObject();\n\n                Cipher\
  \ cipher = Cipher.getInstance(\"RSA\");\n                cipher.init(Cipher.UNWRAP_MODE,\
  \ privateKey);\n                Key key = cipher.unwrap(wrappedKey, \"AES\", Cipher.SECRET_KEY);\n\
  \n                cipher = Cipher.getInstance(\"AES\");\n                cipher.init(Cipher.DECRYPT_MODE,\
  \ key);\n\n                Util.crypt(in, out, cipher);\n            }\n       \
  \ }\n    }\n}\n```\n\n在本章中，你已经略了解了类加载器，并看到了 Java 库提供的身份验证和加密服务。在此过程中，你可能会流下泪水，感叹基于安全管理器和代码签名的经典\
  \ Java 安全架构现在已成为遥远的记忆。\n\n在下一章中，我们将深入研究高级的 Swing 和图形编程。\n\n# 第 10 章 ▪ 图形用户界面编程\n\
  \nJava 诞生时，大多数计算机用户通过图形用户界面（GUI）与桌面应用程序进行交互。如今，基于浏览器的和移动应用程序已更加常见，但在某些情况下，提供桌面应用程序仍然是有用的。此外，许多教师和学生喜欢通过\
  \ GUI 应用程序来学习 Java。在本章及接下来的章节中，我将讨论使用 `Swing` 工具包进行用户界面编程的基础知识。`第 12 章`涵盖了也可以用于在服务器上生成图像的高级技术。如果你对编写\
  \ GUI 和图形程序感兴趣，可以跳过这些章节。\n\n## 10.1 Java 用户界面工具包的历史\n\n当 Java 1.0 发布时，它包含一个名为抽象窗口工具包（`AWT`）的类库，用于基本的\
  \ GUI 编程。基础的 `AWT` 库通过将元素的创建和行为委托给每个目标平台的原生 GUI 工具包（Windows、Linux、Macintosh 等）来处理用户界面元素。例如，如果你使用原始的\
  \ `AWT` 在 Java 窗口上放置文本框，底层的“同行”（peer）文本框实际上负责文本输入。生成的程序理论上可以运行在这些任何平台上，并具有目标平台的“外观和感觉”。\n\
  \n这种基于对等的方法对于简单应用程序很好，但很快就会发现，要编写一个依赖原生用户界面元素的高质量可移植图形库是极其困难的。菜单、滚动条和文本字段等用户界面元素在不同平台上的行为可能存在细微差异。因此，很难通过这种方法为用户提供一致且可预测的体验。此外，某些图形环境（如\
  \ X11/Motif）拥有的用户界面组件没有 Windows 或 Macintosh 那样丰富。这进一步限制了基于“最低公分母”方法的的可移植库。结果是使用\
  \ `AWT` 构建的 GUI 应用程序看起来并不像原生 Windows 或 Macintosh 应用程序那样漂亮，也不具备这些平台用户期待的功能。更令人沮丧的是，不同平台上的\
  \ `AWT` 用户界面库存在不同的 bug。开发者抱怨说他们必须在每个平台上都测试自己的应用程序——这种做法被讽刺地称为“一次编写，处处调试”。\n\n1996\
  \ 年，Netscape 创建了一个名为 `IFC` 的 GUI 库，它采用了一种完全不同的方法。用户界面元素（如按钮、菜单等）被绘制在空白窗口上。底层窗口系统所需的功能只是提供一种显示窗口的方法并在上面进行绘制。因此，Netscape\
  \ 的 `IFC` 组件无论程序运行在哪个平台上，其外观和行为都是相同的。太阳微系统公司与 Netscape 合作完善了这种方法，创建了一个代号为“Swing”的用户界面库。Swing\
  \ 作为 Java 1.1 的扩展可用，并在 Java 1.2 中成为标准库的一部分。\n\n`Swing` 现在是这种非对等 GUI 工具包的正式名称。\n\n\
  `Swing` 并不是 `AWT` 的完全替代——它是构建在 `AWT` 架构之上的。`Swing` 提供了更强大的用户界面组件。每当你编写 `Swing` 程序时，都会使用\
  \ `AWT` 的基础——特别是事件处理。从现在起，当我说“Swing”时，指的是“绘制”的用户界面类，而当我说“AWT”时，指的是窗口工具包的底层机制（例如事件处理）。\n\
  \n\n\n\nSwing 必须辛苦地绘制用户界面的每一个像素。当 Swing 首次发布时，用户抱怨它运行很慢。（如果你在树莓派等硬件上运行 Swing 应用程序，你仍然能感受到问题的存在。）过了一段时间，桌面电脑变得越来越快，用户又开始抱怨\
  \ Swing 难看——事实上，它已经落后于那些经过动画和华丽特效修饰过的原生控件。更令人不安的是，Adobe Flash 被越来越多地用于创建具有更炫哨特效的用户界面，而这些界面完全没有使用原生控件。\n\
  \n2007 年，太阳系统公司（Sun Microsystems）引入了一个完全不同的用户界面工具包，称为 `JavaFX`，作为 Flash 的竞争对手。它运行在\
  \ `Java VM` 上，但有自己的编程语言，称为 `JavaFX Script`。该语言针对编程动画和华丽特效进行了优化。程序员们对需要学习一种新语言感到不满，他们群结队地远离它。2011\
  \ 年，Oracle 发布了新版本 `JavaFX 2.0`，它拥有 `Java API` 且不再需要额外的编程语言。从 `Java 7` 更新 6 开始，`JavaFX`\
  \ 被包含在 `JDK` 和 `JRE` 中。然而，从 `Java 11` 开始，这种包含被停止了。\n\n由于这是一本关于 Java 核心语言和 API 的书，我将专注于\
  \ Swing 的用户界面编程。\n\n## 10.2. 显示帧\n\n顶层窗口（即不包含在另一个窗口内的窗口）在 Java 中被称为 `frame`（帧）。AWT\
  \ 库有一个名为 `Frame` 的类用于这种顶层窗口。该类的 Swing 版本被称为 `JFrame`，并继承自 `Frame` 类。`JFrame` 是少数几个不是在画布上绘制的\
  \ Swing 组件之一。因此，装饰部分（按钮、标题栏、图标等）是由用户的窗口系统绘制的，而不是由 Swing 绘制的。\n\n大多数 Swing 类类以“J”开头：`JButton`、`JFrame`\
  \ 等。虽然也有像 `Button` 和 `Frame` 这样的类，但它们是 AWT 组件。如果你不小心漏掉了“J”，你的程序可能仍然编译并运行，但 Swing\
  \ 和 AWT 组件的混合会导致视觉和行为上的不一致。\n\n### 10.2.1. 创建帧\n\n在本节中，我们将介绍处理 Swing `JFrame` 的最常用方法。列表\
  \ 10.1 列出了一个在屏幕上显示空帧的简单程序，如图 10.1](#index.xhtml_ch07fig04) 所示。\n\n![Figure](img/simpleframetest.jpg)图\
  \ 10.1: 最简单的可见帧 列表 10.1 v2ch10/simpleFrame/SimpleFrameDemo.java\n\n```\npackage\
  \ v2ch10.simpleFrame;\n\nimport module java.desktop;\n\nclass SimpleFrameDemo {\n\
  \    void main() {\n        EventQueue.invokeLater(() -> {\n            var frame\
  \ = new SimpleFrame();\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n        });\n    }\n}\n\nclass SimpleFrame\
  \ extends JFrame {\n    private static final int DEFAULT_WIDTH = 300;\n    private\
  \ static final int DEFAULT_HEIGHT = 200;\n\n    public SimpleFrame() {\n       \
  \ setSize(DEFAULT_WIDTH, DEFAULT_HEIGHT);\n    }\n}\n```\n\n让我们逐行分析这个程序。\n\nSwing\
  \ 类存放在 `javax.swing` 包中。包名 `java.x` 表示这是一个 Java 扩展包，而不是核心包。由于历史原因，Swing 被认为是一个扩展。然而，自\
  \ 1.2 版本以来，每个 Java 实现中都存在它。\n\n默认情况下，帧的大小为几乎毫无意义的 0×0 像素。我们定义了一个子类 `SimpleFrame`，其构造函数将大小设置为\
  \ 300×200 像素。这是 `SimpleFrame` 和 `JFrame` 之间唯一的区别。\n\n在 `SimpleFrameDemo` 类的 `main`\
  \ 方法中，我们构造了一个 `SimpleFrame` 对象并使其可见。\n\n在每个 Swing 程序中，我们都需要解决两个技术问题。\n\n首先，所有的 Swing\
  \ 组件都必须从 `event dispatch thread`（事件分发线程）进行配置，该线程是将鼠标点击和击键等事件传递给用户界面组件的控制线程。以下代码片段用于在事件分发线程中执行语句：\n\
  \n```\nEventQueue.invokeLater(() -> {\n    statements\n});\n```\n\n你会看到很多 Swing\
  \ 程序没有在事件分发线程中初始化用户界面。过去在主线程中进行初始化是完全可以的。遗憾的是，随着 Swing 组件变得越来越复杂，`JDK` 的开发者已无法保证那种方法的安全性。发生错误的概率极低，但你可能不想成为那少数遇到间歇性问题的幸运儿之一。做正确的事情比较好，即使代码看起来相当神秘。\n\
  \n接下来，我们定义了当用户关闭应用程序的帧时应该发生什么。对于这个特定的程序，我们希望程序退出。为了选择这种行为，我们使用语句：\n\n```\nframe.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  ```\n\n在其他具有多个帧的程序中，你不希望程序仅仅因为用户关闭了其中一个帧就退出。默认情况下，当用户关闭帧时帧会被隐藏，但程序不会终止。（如果程序在*最后一个*帧变得不可见时终止可能会很好，但那并不是\
  \ Swing 的工作方式。）\n\n简单地构造一个帧并不会显示它。帧在生命开始时是不可见的。这给了程序员在显示之前向帧中添加组件的机会。要显示帧，`main`\
  \ 方法调用了帧的 `setVisible` 方法。\n\n调度初始化后，`main` 方法退出。运行的程序如图 10.1](#index.xhtml_ch07fig04)\
  \ 所示——这是一个真正的顶层窗口。如图所示，标题栏和周围的装饰（如调整角）是由操作系统绘制的，而不是 Swing 库。Swing 库绘制帧内部的内容。在这个程序中，它只是用默认背景色填充帧。\n\
  \n### 10.2.2. 帧属性\n\n`JFrame` 类本身只有几个更改帧外观的方法。当然，通过继承的魔法，大多数处理大小和位置的方法都来自父类。这里是一些最重要的方法：\n\
  \n*   用于设置帧位置的 `setLocation` 和 `setBounds` 方法\n*   `setIconImage` 方法，告诉窗口系统在标题栏、任务切换窗口等处显示哪个图标\n\
  *   用于更改标题栏中文字的 `setTitle` 方法\n*   `setResizable` 方法，接受一个 `boolean` 值来决定帧是否可以调整大小\n\
  \n图 10.2](#index.xhtml_ch07fig05) 展示了 `JFrame` 类的继承层次。\n\n如 API 注释所示，`Component`\
  \ 类（所有 GUI 对象的祖先）和 `Window` 类（`Frame` 类的父类）是你寻找调整大小和重塑帧的方法的地方。例如，`Component` 类中的\
  \ `setLocation` 方法是重新定位组件的一种方法。如果你调用\n\n```\nsetLocation(x, y)\n```\n\n左上角将向右 x\
  \ 像素、向下 y 像素，其中 (0, 0) 是屏幕的左上角。同样，`Component` 中的 `setBounds` 方法允许你一步到位地调整大小并重新定位组件（特别是\
  \ `JFrame`），如下：\n\n```\nsetBounds(x, y, width, height)\n```\n\n许多类的方法以 getter/setter\
  \ 对的形式出现，例如 `Frame` 类的以下方法：\n\n\n\n\n\n```\npublic String getTitle()\npublic void\
  \ setTitle(String title)\n```\n\n这样一对 getter/setter 被称为一个 `property`（属性）。一个属性有一个名称和一个类型。名称通过将\
  \ `get` 或 `set` 之后的第一个字母更改为小写来获得。例如，`Frame` 类有一个名称为 `title`、类型为 `String` 的属性。\n\n\
  从概念上说，`title` 是框架的属性属性。当我们设置该属性时，我们期望标题在用户的屏幕上发生变化。当我们获取该属性时，我们期望取回我们之前设置的值。\n\n\
  `get`/`set` 约定上有一个例外：对于 `boolean` 类型的属性，getter 以 `is` 开头。例如，以下两个方法定义了 `resizable`\
  \ 属性：\n\n```\npublic boolean isResizable()\npublic void setResizable(boolean resizable)\n\
  ```\n\n为了确定框架合适的尺寸，首先要找到屏幕尺寸。调用 `Toolkit` 类的静态方法 `getDefaultToolkit` 来获取 `Toolkit`\
  \ 对象。（`Toolkit` 类是各种与原生窗口系统接口的方法的堆杂之地。）然后调用 `getScreenSize` 方法，该方法返回 `Dimension`\
  \ 对象的尺寸。一个 `Dimension` 对象同时存储了宽度高度。然后你可以使用屏幕尺寸的适当百分比来调整框架的尺寸。以下是代码：\n\n```\nToolkit\
  \ kit = Toolkit.getDefaultToolkit();\nDimension screenSize = kit.getScreenSize();\n\
  int screenWidth = screenSize.width;\nint screenHeight = screenSize.height;\nsetSize(screenWidth\
  \ / 2, screenHeight / 2);\n```\n\n你也可以提供框架图标：\n\n```\nImage img = new ImageIcon(\"\
  icon.gif\").getImage();\nsetIconImage(img);\n```\n\n### java.awt.Component\n- `boolean\
  \ isVisible()`\n- `void setVisible(boolean b)`: 获取或设置 `visible` 属性。组件初始是可见的，但 `JFrame`\
  \ 等顶层组件除外。\n- `void setSize(int width, int height)`: 将组件调整为指定的宽度和高度。\n- `void setLocation(int\
  \ x, int y)`: 将组件移动到新位置。如果组件不是顶层组件，则 `x` 和 `y` 坐标使用容器的坐标；如果组件是顶层（例如 `JFrame`），则使用屏幕坐标。\n\
  - `void setBounds(int x, int y, int width, int height)`: 移动并调整此组件。\n- `Dimension\
  \ getSize()`\n- `void setSize(Dimension d)`: 获取或设置此组件的 `size` 属性。\n\n### java.awt.Frame\n\
  - `boolean isResizable()`\n- `void setResizable(boolean b)`: 获取或设置 `resizable` 属性。当属性被设置时，用户可以调整框架的大小。\n\
  - `String getTitle()`\n- `void setTitle(String s)`: 获取或设置 `title` 属性，该属性决定框架标题栏中的文本。\n\
  - `Image getIconImage()`\n- `void setIconImage(Image image)`: 获取或设置 `iconImage`\
  \ 属性，该属性决定框架的图标。窗口系统可以将图标作为框架装饰的一部分或其他位置显示。\n\n### java.awt.Toolkit\n- `static Toolkit\
  \ getDefaultToolkit()`: 返回此平台的默认工具包。\n- `Dimension getScreenSize()`: 获取用户屏幕的尺寸。\n\
  \n### javax.swing.ImageIcon\n- `ImageIcon(String filename)`: 构造一个图像存储在文件中图标。\n-\
  \ `Image getImage()`: 获取此图标的图像。\n\n## 10.3. 在组件中显示信息\n\n在本节中，我将向你展示如何在框架内部显示信息。\n\
  \n![Figure](img/nothelloworld.jpg) 图 10.3: 一个显示信息的框架\n\n你可以直接将消息字符串绘制到框架上，但这不认为是良好的做法。在\
  \ Java 中，框架实际上被设计为菜单栏和其他界面元素等组件的容器。你通常会在添加到框架的另一个组件上进行绘图。\n\n`JFrame` 的结构出奇地复杂。看图\
  \ 10.4，它显示了 `JFrame` 的组成。如你所示，`JFrame` 中层叠了四个面板。根面板（root pane）、分层面板（layered pane）和玻璃面板（glass\
  \ pane）对我们没有意义；它们是组织菜单栏和内容面板以及实现外观感觉所需的。Swing 程序员最关注的部分是 `content pane`（内容面板）。任何添加到框架的组件都会被自动放入内容面板中：\n\
  \n```\nComponent c = ...\nframe.add(c); // 添加到内容面板\n```\n图 10.4: JFrame 的内部结构\n\n\
  在我们的情况下，我们想向框架添加一个单一组件，并在其上绘制我们的消息。要在组件上绘图，你需要定义一个扩展 `JComponent` 的类，并在该类中重写 `paintComponent`\
  \ 方法。\n\n`paintComponent` 方法有一个 `Graphics` 类型参数。`Graphics` 对象记录了绘制图像和文本的设置集合，例如你设置的字体或当前颜色。Java\
  \ 中所有的绘图都必须通过 `Graphics` 对象。它具有绘制图案、图像和文本的方法。\n\n以下是如何制作一个可以在上面绘图的组件：\n\n```\nclass\
  \ MyComponent extends JComponent {\n    public void paintComponent(Graphics g) {\n\
  \        // 绘图代码\n    }\n}\n```\n\n每当窗口需要重绘时，无论出于什么，事件处理器都会通知组件。这导致组件的 `paintComponent`\
  \ 方法被执行。\n\n永远不要自己调用 `paintComponent` 方法。当应用程序的任何需要重绘时，它就会被自动调用。\n\n哪些操作会触发这种自动响应？例如，当用户增大窗口尺寸，或者最小化后恢复窗口时。如果用户弹出一个覆盖现有窗口的窗口，然后让该窗口消失，被覆盖的窗口现在损坏了，需要重绘。（图形系统并不保存下方的像素。）当然，当窗口首次显示时，它需要处理指定如何以及在哪里绘制元素的代码。\n\
  \n如果你需要强制刷新屏幕，请调用 `repaint` 方法而不是 `paintComponent`。`repaint` 方法会导致所有组件调用 `paintComponent`，并带有一个配置良好的\
  \ `Graphics` 对象。\n\n正如你在上面的代码片段所示，`paintComponent` 方法有一个唯一的 `Graphics` 参数。在 `Graphics`\
  \ 对象上进行的屏幕测量是以像素为单位的。(0,0) 坐标表示绘图组件的左上角。\n\n`Graphics` 类有各种绘制方法，显示文本被视为一种特殊的绘图。我们的\
  \ `paintComponent` 方法如下：\n\n```\npublic class NotHelloWorldComponent extends JComponent\
  \ {\n    public static final int MESSAGE_X = 75;\n    public static final int MESSAGE_Y\
  \ = 100;\n\n    public void paintComponent(Graphics g) {\n        g.drawString(\"\
  Not a Hello, World program\", MESSAGE_X, MESSAGE_Y);\n    }\n    ...\n}\n```\n\n\
  最后，组件应该告诉用户它有多大。重写 `getPreferredSize` 方法并返回一个带有所需宽度和高度的 `Dimension` 对象：\n\n```java\n\
  public class NotHelloWorldComponent extends JComponent {\n    private static final\
  \ int DEFAULT_WIDTH = 300;\n    private static final int DEFAULT_HEIGHT = 200;\n\
  \    ...\n    public Dimension getPreferredSize() {\n        return new Dimension(DEFAULT_WIDTH,\
  \ DEFAULT_HEIGHT);\n    }\n}\n```\n\n当你用一个或多个组件填充框架，并且你只是想使用它们的首选尺寸时，调用 `pack` 方法而不是\
  \ `setSize` 方法。\n\n\n\n\n\n```java\nclass NotHelloWorldFrame extends JFrame {\n\
  \    public NotHelloWorldFrame() {\n        add(new NotHelloWorldComponent());\n\
  \        pack();\n    }\n}\n```\n\nListing 10.2 显示了完整的代码。\n\nListing 10.2 v2ch10/notHelloWorld/NotHelloWorld.java\n\
  \n```java\npackage v2ch10.notHelloWorld;\n\nimport module java.desktop;\n\nclass\
  \ NotHelloWorld {\n    void main() {\n        EventQueue.invokeLater(() -> {\n \
  \           var frame = new NotHelloWorldFrame();\n            frame.setTitle(\"\
  NotHelloWorld\");\n            frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
  \            frame.setVisible(true);\n        });\n    }\n}\n\n/**\n * 一个包含消息面板的框架。\n\
  \ */\nclass NotHelloWorldFrame extends JFrame {\n    public NotHelloWorldFrame()\
  \ {\n        add(new NotHelloWorldComponent());\n        pack();\n    }\n}\n\n/**\n\
  \ * 一个显示消息的组件。\n */\nclass NotHelloWorldComponent extends JComponent {\n    public\
  \ static final int MESSAGE_X = 75;\n    public static final int MESSAGE_Y = 100;\n\
  \n    private static final int DEFAULT_WIDTH = 300;\n    private static final int\
  \ DEFAULT_HEIGHT = 200;\n\n    public void paintComponent(Graphics g) {\n      \
  \  g.drawString(\"Not a Hello, World program\", MESSAGE_X, MESSAGE_Y);\n    }\n\n\
  \    public Dimension getPreferredSize() {\n        return new Dimension(DEFAULT_WIDTH,\
  \ DEFAULT_HEIGHT);\n    }\n}\n```\n\n`javax.swing.JFrame` 1.2\n\n*   `Component\
  \ add(Component c)`\n    将给定的组件添加到此框架的内容面板并返回。\n\n`java.awt.Component` 1.0\n\n*\
  \   `void repaint()`\n    导致组件“尽快”重绘。\n\n*   `Dimension getPreferredSize()`\n  \
  \  是要重写的方法，用于返回此组件的首选尺寸。\n\n`javax.swing.JComponent` 1.2\n\n*   `void paintComponent(Graphics\
  \ g)`\n    是要重写的方法，用于描述你的组件如何被绘制。\n\n`java.awt.Window` 1.0\n\n*   `void pack()`\n\
  \    调整此窗口的大小，并考虑其组件的首选尺寸。\n\n### 10.3.1. 使用 2D 形状\n\n从 Java 1.0 开始，`Graphics` 类已经有了绘制直线、矩形、椭圆等的方法。但那些绘制操作非常有限。相反，我们将使用来自\
  \ `Java 2D` 库的形状类。\n\n要使用此库，你需要获取 `Graphics2D` 类的对象。该类是 `Graphics` 类的子类。从 Java 1.2\
  \ 开始，`paintComponent` 等方法会自动接收一个 `Graphics2D` 类的对象。只需进行如下强制转换：\n\n```java\npublic\
  \ void paintComponent(Graphics g) {\n    Graphics2D g2 = (Graphics2D) g;\n    .\
  \ . .\n}\n```\n\nJava 2D 库以面向对象的方式组织几何形状。特别是，有用于表示直线、矩形和椭圆的类：\n\n```\nLine2D\nRectangle2D\n\
  Ellipse2D\n```\n\n这些类都实现了 `Shape` 接口。Java 2D 库支持更复杂的形状——弧、二次和三次曲线以及通用路径——这些我们在本章中不会讨论。\n\
  \n要绘制一个形状，你首先创建一个实现 `Shape` 接口的类的对象，然后调用 `Graphics2D` 类的 `draw` 方法。例如：\n\n```java\n\
  Rectangle2D rect = . . .;\ng2.draw(rect);\n```\n\nJava 2D 库使用浮点坐标而不是整数来表示像素。内部计算使用单精度\
  \ `float` 数值进行。单精度已经足够了——毕竟几何计算的最终目的是在屏幕或打印机上设置像素。只要任何舍入误差保持在一个像素以内，视觉结果就不会受到影响。\n\
  \n然而，对于程序员来说，操作 `float` 值有时是不不方便的，因为 Java 固执地要求在将 `double` 值转换为 `float` 值时必须进行强制转换。例如，考虑以下语句：\n\
  \n```java\nfloat f = 1.2; // 错误--可能会丢失精度\n```\n\n该语句无法编译，因为常量 `1.2` 的类型是 `double`，而编译器担心丢失精度。解决办法是给浮点常量添加一个\
  \ `F` 后缀：\n\n```java\nfloat f = 1.2F; // 正确\n```\n\n现在考虑这条语句：\n\n```java\nfloat\
  \ f = r.getWidth(); // 错误\n```\n\n该语句也无法编译，原因相同。`getWidth` 方法返回一个 `double`。这次的解决办法是提供一个强制转换：\n\
  \n```java\nfloat f = (float) r.getWidth(); // 正确\n```\n\n这些后缀和转换有点麻烦，所以 2D 库的设计者决定为每个形状类提供两个版本：一个带有\
  \ `float` 坐标，供节约资源的程序员使用；另一个带有 `double` 坐标，供懒惰的人使用。（在书中，我们属于后者，尽可能使用 `double` 坐标。）\n\
  \n库的设计者选择了一种奇妙的机制来封装这些选择。考虑 `Rectangle2D` 类。它是一个抽象类，有两个具体的子类，这些子类也是静态嵌套类：\n\n```\n\
  Rectangle2D\nRectangle2D\n```\n\n图 10.5 显示了继承关系。\n\n.图 10.5: 2D 矩形\n\n`Rectangle2D.Float`\n\
  `Rectangle2D.Double`\n\n图 10.7 显示了继承关系。\n\n.图 10.7: 形状类之间的关系\n\n`Rectangle2D` 和\
  \ `Ellipse2D` 对象的构造非常简单。你需要指定\n\n*   左上角的 *x* 和 *y* 坐标\n*   宽度和高度\n\n对于椭圆，这些指的是边界矩形。例如，\n\
  \n```java\nvar e = new Ellipse2D.Double(150, 200, 100, 50);\n```\n\n只需使用 `Double`\
  \ 类即可避免处理 `float` 值。然而，如果你构造数千个形状对象，请考虑使用 `Float` 类以节省内存。\n\n我们为 `Rectangle2D` 的内容适用于适用于形状类。此外，还有一个\
  \ `Point2D` 类，带有 `Point2D.Float` 和 `Point2D.Double`。以下是创建点的方法：\n\n```java\nvar p\
  \ = new Point2D.Double(10, 20);\n```\n\n`Rectangle2D` 和 `Ellipse2D` 都继承自共同的父类 `RectangularShape`。诚然，椭圆不是矩形，但它们有一个边界矩形（见图\
  \ 10.6）。\n\n.图 10.6: 椭圆的边界矩形\n\n`RectangularShape` 类定义了 20 多个这些形状共同的方法，其中 `getWidth`、`getHeight`、`getCenterX`\
  \ 和 `getCenterY` 等常用方法（但遗憾的是，在本文写作时还没有一个返回 `Point2D` 对象的中心 `getCenter` 方法）。\n\n\
  最后，Java 1.0 的几个旧类已拟合到形状类层次结构中。`Rectangle` 和 `Point` 类（存储整数坐标的矩形和点）扩展了 `Rectangle2D`\
  \ 和 `Point2D` 类。\n\n\n\n\n在构造椭圆时，你通常知道中心点、宽度和高度，但不知道边界矩形的四个顶点（这些顶点甚至不在椭圆上）。`setFrameFromCenter`\
  \ 方法使用了中心点，但它仍然需要四个顶点中的一个。因此，你通常会以如下方式构造椭圆：\n\n```\nvar ellipse =\n    new Ellipse2D.Double(centerX\
  \ - width / 2, centerY - height / 2, width, height);\n```\n\n要构造一条线，你需要提供起点和终点，可以以\
