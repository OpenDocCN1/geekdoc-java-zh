  \ options)`\n    打开文件进行读取或写入。\n\n### 2.3.3. 创建文件和目录\n\n要创建一个新目录，调用\n\n```\nFiles.createDirectory(path);\n\
  ```\n\n路径中除最后一个组件以外的所有部分必须已经存在。如果要创建中间目录，请使用\n\n```\nFiles.createDirectories(path);\n\
  ```\n\n可以使用以下方法创建一个空文件\n\n```\nFiles.createFile(path);\n```\n\n如果文件已存在，该调用将抛出异常。存在检查和创建是原子的。如果文件不存在，它将在其他人有机会执行相同操作之前被创建。\n\
  \n提供了便利方法，可以在给定的或系统特定的位置创建临时文件或目录。\n\n```\nPath newPath = Files.createTempFile(dir,\
  \ prefix, suffix);\nPath newPath = Files.createTempFile(prefix, suffix);\nPath newPath\
  \ = Files.createTempDirectory(dir, prefix);\nPath newPath = Files.createTempDirectory(prefix);\n\
  ```\n\n在这里，`dir` 是一个 `Path`，`prefix`/`suffix` 是可能为 `null` 的字符串。例如，调用 `Files.createTempFile(null,\
  \ \".txt\")` 可能会返回类似 `/tmp/1234405522364837194.txt` 的路径。\n\n创建文件或目录时，你可以指定属性，例如所有者或权限。然而，细节取决于文件系统，我们在此不再进行介绍。\n\
