  \    删除给定文件或空目录。如果文件或目录不存在，第一个方法将抛出异常。第二个方法在这种情况下返回 `false`。\n\n### 2.3.5. 获取文件信息\n\
  \n以下静态方法返回 `boolean` 值以检查路径的属性：\n\n*   `exists`\n*   `isHidden`\n*   `isReadable`,\
  \ `isWritable`, `isExecutable`\n*   `isRegularFile`, `isDirectory`, `isSymbolicLink`\n\
  \n`size` 方法返回文件的字节数。\n\n```\nlong fileSize = Files.size(path);\n```\n\n`getOwner`\
  \ 方法返回文件的所有者，作为 `java.nio.file.attribute.UserPrincipal` 的实例。\n\n所有文件系统都会报告一组基本属性，由\
  \ `BasicFileAttributes` 接口封装，它与上述信息部分重叠。基本文件属性是\n\n\n\n\n\n*   文件的创建、最后访问和最后修改时间，以\
  \ `java.nio.file.attribute.FileTime` 类的实例形式存在\n*   该文件是否为普通文件、目录、符号链接或上述三者皆非\n*\
  \   文件大小\n*   文件键（file key）——某个类的对象，特定于文件系统，可能可能也无法唯一地标识一个文件\n\n要获取这些属性，请调用：\n\n\
  ```\nBasicFileAttributes attributes = Files.readAttributes(path, BasicFileAttributes.class);\n\
  ```\n\n如果你知道用户的文件系统是符合 POSIX 标准的，你可以改为获取 `PosixFileAttributes` 实例：\n\n```\nPosixFileAttributes\
  \ attributes = Files.readAttributes(path, PosixFileAttributes.class);\n```\n\n然后你就可以找到文件的组所有者，以及文件的所有者、组和世界的访问权限。我们不会在此结于细节，因为这些信息中大部分在不同操作系统之间是不可移植的。\n\
  \n### `java.nio.file.Files`\n\n*   `static boolean exists(Path path)`\n*   `static\
