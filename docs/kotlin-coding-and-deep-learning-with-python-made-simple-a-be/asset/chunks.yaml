    \ conditions. We will explore conditional statements, loops, and other control\
    \ flow constructs.\n\n# Chapter 5: Control Flow Statements in Kotlin\n\nIn Chapter\
    \ 5, we learned about the fundamental concepts of operators and expressions in\
    \ Kotlin. Now, let's explore control flow statements, which allow us to control\
    \ the flow of execution in our programs based on certain conditions. Control flow\
    \ statements enable us to make decisions, repeat certain actions, and alter the\
    \ execution path of our code.\n\n## 5.1 Conditional Statements\n\nConditional\
    \ statements are used to perform different actions based on specific conditions.\
    \ Kotlin provides two types of conditional statements: `if` statements and `when`\
    \ statements.\n\n### 5.1.1 If Statements\n\nThe `if` statement allows us to execute\
    \ a block of code if a certain condition is true. It has the following syntax:\n\
    \n```\nif (condition) {\n    // Code to be executed if the condition is true\n\
    } else {\n    // Code to be executed if the condition is false\n}\n```\n\nHere's\
    \ an example that demonstrates the usage of `if` statements:\n\n```kotlin\nval\
    \ num = 10\n\nif (num > 0) {\n    println(\"The number is positive.\")\n} else\
    \ {\n    println(\"The number is non-positive.\")\n}\n```\n\nIn the above example,\
    \ we check if the value of the variable `num` is greater than `0`. If the condition\
    \ is true, we print `\"The number is positive.\"` Otherwise, we print `\"The number\
    \ is non-positive.\"`\n\n### 5.1.2 When Statements\n\nThe `when` statement is\
    \ Kotlin's alternative to the traditional `switch` statement found in other programming\
    \ languages. It allows us to evaluate a variable or an expression and execute\
    \ different code blocks based on its value. Here's the syntax of a `when` statement:\n\
    \n```\nwhen (variable) {\n    value1 -> {\n        // Code to be executed if the\
