    4.5 Operator Precedence


    Operators in Kotlin have a specific precedence that determines the order in which
    they are evaluated in an expression. When an expression contains multiple operators,
    the ones with higher precedence are evaluated first.


    Here''s a brief overview of the precedence of some common operators in Kotlin
    (from highest to lowest):


    Parentheses ()


    Unary operators (+, -, ++, --, !)


    Multiplicative operators (*, /, %)


    Additive operators (+, -)


    Comparison operators (>, <, >=, <=)


    Equality operators (==, !=)


    Logical AND (&&)


    Logical OR (||)


    It''s important to use parentheses when necessary to override the default precedence
    and ensure the desired evaluation order in complex expressions.


