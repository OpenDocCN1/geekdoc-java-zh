    \ 64 位浮点数。\n\n`Boolean`：表示布尔值（`true` 或 `false`）。\n\n`Char`：表示单个 Unicode 字符。\n\n\
    `String`：表示字符序列。\n\n要声明具有特定数据类型的变量，请在变量名后指定数据类型，如上一节所示。\n\n以下示例演示了具有不同数据类型的变量声明：\n\
    \n```\nval age: Int = 25\n```\n\n```\nval temperature: Double = 98.6\n```\n\n\
    ```\nval isStudent: Boolean = true\n```\n\n```\nval grade: Char = 'A'\n```\n\n\
    ```\nval name: String = \"John Doe\"\n```\n\n在上述示例中，我们分别声明了类型为 `Int` 的变量 `age`、类型为\
    \ `Double` 的变量 `temperature`、类型为 `Boolean` 的变量 `isStudent`、类型为 `Char` 的变量 `grade`\
    \ 以及类型为 `String` 的变量 `name`。\n\n# 3.3 类型推断\n\n在 Kotlin 中，变量的类型通常可以根据赋值由编译器推断出来。这一特性被称为类型推断。它允许您省略显式的数据类型声明，让编译器自动确定适当的类型。\n\
