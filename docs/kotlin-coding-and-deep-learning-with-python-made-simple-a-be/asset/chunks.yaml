    # Chapter 3: Variables and Data Types in Kotlin


    In Chapter 2, we set up our development environment and explored the features
    of popular Kotlin IDEs. Now, it''s time to dive deeper into the world of Kotlin
    programming. In this chapter, we will focus on variables and data types, essential
    concepts in any programming language. By the end of this chapter, you will have
    a solid understanding of how to declare variables, assign values to them, and
    work with different data types in Kotlin.


    # 3.1 Variables in Kotlin


    In Kotlin, variables are used to store and manipulate data. Before using a variable,
    you need to declare it by specifying its name and data type. Kotlin is a statically-typed
    language, which means that the data type of a variable is determined at compile-time
    and remains fixed throughout its lifetime.


    To declare a variable in Kotlin, you use the following syntax:


    ```

    val variableName: DataType = value

    ```


    In the above syntax:


    `val` is a keyword used to declare a read-only (immutable) variable. Once assigned
    a value, a `val` cannot be reassigned.


    `variableName` is the name you choose for your variable. It should follow naming
    conventions and be descriptive of its purpose.


    `DataType` is the type of data that the variable can hold. We will explore different
    data types in the next section.


    `value` is the initial value assigned to the variable. It must be compatible with
    the declared data type.


    Here''s an example that demonstrates variable declaration and assignment in Kotlin:


    ```

    val message: String = "Hello, Kotlin!"

    ```


    In the above example, we declared a variable named `message` of type `String`
    and assigned it the value `"Hello, Kotlin!"`.


    # 3.2 Data Types in Kotlin


    Kotlin provides a variety of data types to represent different kinds of values.
    Let''s explore some commonly used data types in Kotlin:


    `Byte`: Represents 8-bit signed integers.


    `Short`: Represents 16-bit signed integers.


    `Int`: Represents 32-bit signed integers.


    `Long`: Represents 64-bit signed integers.


    `Float`: Represents single-precision 32-bit floating-point numbers.


    `Double`: Represents double-precision 64-bit floating-point numbers.


    `Boolean`: Represents boolean values (`true` or `false`).


    `Char`: Represents a single Unicode character.


    `String`: Represents a sequence of characters.


    To declare a variable with a specific data type, you specify the data type after
    the variable name, as shown in the previous section.


    Here''s an example that demonstrates the declaration of variables with different
    data types:


    ```

    val age: Int = 25

    ```


    ```

    val temperature: Double = 98.6

    ```


    ```

    val isStudent: Boolean = true

    ```


    ```

    val grade: Char = ''A''

    ```


    ```

    val name: String = "John Doe"

    ```


    In the above example, we declared variables `age` of type `Int`, `temperature`
    of type `Double`, `isStudent` of type `Boolean`, `grade` of type `Char`, and `name`
    of type `String`, respectively.


    # 3.3 Type Inference


    In Kotlin, the type of a variable can often be inferred by the compiler based
    on the assigned value. This feature is known as type inference. It allows you
    to omit the explicit data type declaration and let the compiler determine the
    appropriate type automatically.


    Here''s an example that demonstrates type inference:


    ```

    val score = 95 // The type of score is inferred as Int.

    ```


    ```

    val pi = 3.14 // The type of pi is inferred as Double.

    ```


    ```

    val message = "Welcome!" // The type of message is inferred as String.

    ```'
