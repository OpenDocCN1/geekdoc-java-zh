    # 6.1 Introduction to Functions


    A function is a named sequence of statements that performs a specific task. It
    takes input parameters (optional) and may return a value (optional). Functions
    help break down complex tasks into smaller, manageable units, making our code
    more modular and readable.


    In Kotlin, we define a function using the fun keyword followed by the function
    name, parentheses for parameters (if any), and a return type (if any). Here''s
    the general syntax of a function declaration:


    fun functionName(parameter1: Type, parameter2: Type): ReturnType {


    // Code to be executed


    // Return statement (if applicable)


    }


    Let''s look at an example of a simple function that adds two numbers and returns
    the result:


    fun addNumbers(a: Int, b: Int): Int {


    return a + b


    }


    In this example, we define a function called addNumbers that takes two integer
    parameters a and b. It adds the two numbers and returns the sum as an integer.


    We can call the function by using its name followed by parentheses, passing the
    required arguments:


    val sum = addNumbers(5, 3)


    println("The sum is: $sum") // Output: The sum is: 8


    The function call addNumbers(5, 3) returns the sum of 5 and 3, which is then stored
    in the sum variable and printed.


    # 6.2 Function Parameters


    Functions can have zero or more parameters. Parameters are placeholders for values
    that we pass to the function when calling it. Let''s explore different types of
    function parameters in Kotlin.


    # 6.2.1 Required Parameters


    Required parameters are parameters that must be provided when calling the function.
    They are specified in the function declaration and define the type and name of
    the parameter. Here''s an example:


    fun greet(name: String) {


    println("Hello, $name!")


    }


    In this example, we define a function called greet that takes a required parameter
    name of type String. It prints a greeting message with the provided name.


    To call the function, we provide the required argument:


    greet("John") // Output: Hello, John!


    The function call greet("John") passes the string "John" as the name parameter,
    and the function prints the greeting message.


    # 6.2.2 Default Parameters


    Default parameters are parameters that have a default value assigned to them.
    If we don''t provide an argument for a default parameter when calling the function,
    the default value is used. Here''s an example:


    fun greet(name: String, greeting: String = "Hello") {


    println("$greeting, $name!")


    }


    In this example, we define a function called greet that takes two parameters:
    name of type String and greeting of type String with a default value of "Hello".
    The function prints a greeting message using the provided greeting and name.


    We can call the function with or without providing the greeting parameter:


    greet("John") // Output: Hello, John!


    greet("Alice", "Hi") // Output: Hi, Alice!


    # 6.2.3 Named Arguments


    In Kotlin, we can also use named arguments when calling a function. Named arguments
    allow us to specify the argument values by their parameter names, regardless of
    their order in the function declaration. This provides flexibility and makes our
    code more readable. Here''s an example:


