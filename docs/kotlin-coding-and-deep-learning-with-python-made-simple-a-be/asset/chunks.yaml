    fun greet(name: String) {\n    println(\"Hello, $name!\")\n}\n```\n\nThe `greet`\
    \ function does not have a return statement, and its return type is implicitly\
    \ `Unit`.\n\n## 6.4 Summary\n\nIn this chapter, we explored functions in Kotlin.\
