    the compiler inferred the appropriate types for the variables `score`, `pi`, and
    `message` based on the assigned values.


    Type inference is convenient and reduces the need for explicit type declarations,
    especially when the type is evident from the assigned value. However, it''s important
    to note that type inference may not always be possible or may lead to unexpected
    results. In such cases, it''s recommended to provide explicit type declarations
    to ensure clarity and maintainability in your code.


    ## 3.4 Working with Variables


    Once you have declared a variable and assigned a value to it, you can perform
    various operations on it. Here are some common operations you can perform with
    variables:


    Reading the Value: You can access the value of a variable using its name. For
    example, `age` will give you the value of the `age` variable.


    Reassigning the Value: If you declare a mutable variable using the `var` keyword
    instead of `val`, you can reassign its value using the assignment operator (`=`).
    For example, `var count = 10` declares a variable `count` and assigns it an initial
    value of `10`. Later, you can change its value by assigning a new value, such
    as `count = 20`.


    Performing Operations: Variables can participate in various operations, such as
    arithmetic operations (`+`, `-`, `*`, `/`), string concatenation (`+`), and logical
    operations (`&&`, `||`, `!`). The result of the operation can be stored in another
    variable or used directly.


    Printing Variables: To display the value of a variable for debugging or output
    purposes, you can use the `println()` function. For example, `println(age)` will
    print the value of the `age` variable.


    Here''s an example that demonstrates these operations:


    ```

    var count = 10


    count = count + 5 // Reassigning the value


    println(count) // Printing the value


    val firstName = "John"


    val lastName = "Doe"


    val fullName = firstName + " " + lastName // String concatenation


    println(fullName) // Printing the value

    ```


    In the above example, we declared a mutable variable `count` and performed an
    arithmetic operation (`count + 5`) to update its value. We also declared read-only
    variables `firstName` and `lastName` and concatenated them to form the `fullName`
    variable.


    ## 3.5 Summary


    In this chapter, we explored the fundamental concepts of variables and data types
    in Kotlin. We learned how to declare variables, assign values to them, and work
    with different data types. We also discussed type inference and the operations
    that can be performed on variables.


    Variables and data types are the building blocks of any programming language,
    and understanding them is crucial for writing effective and reliable code. In
    the next chapter, we will delve into operators and expressions, which allow us
    to perform various computations and manipulate values in Kotlin.


    # Chapter 4: Operators and Expressions in Kotlin


    In Chapter 3, we learned about variables and data types in Kotlin. Now, let''s
    explore the world of operators and expressions. Operators are symbols or keywords
    that allow us to perform various computations and manipulate values in our programs.
    In this chapter, we will cover different types of operators available in Kotlin
    and understand how to use them effectively.


    ## 4.1 Arithmetic Operators


    Arithmetic operators are used to perform basic mathematical calculations on numeric
    values. Kotlin provides the following arithmetic operators:


    Addition (`+`): Adds two operands together.


    Subtraction (`-`): Subtracts the right operand from the left operand.


    Multiplication (`*`): Multiplies two operands.


    Division (`/`): Divides the left operand by the right operand.


    Remainder (`%`): Returns the remainder of the division between the left and right
    operands.


    Here''s an example that demonstrates the usage of arithmetic operators:


    ```

    val x = 10


    val y = 5


    val sum = x + y


    val difference = x - y


    val product = x * y


    val quotient = x / y


    val remainder = x % y


    println("Sum: $sum")


    println("Difference: $difference")


    println("Product: $product")


    println("Quotient: $quotient")


    println("Remainder: $remainder")

    ```


    In the above example, we declared two variables `x` and `y` with values `10` and
    `5` respectively. We then used arithmetic operators to perform addition, subtraction,
    multiplication, division, and remainder operations on these variables.


    ## 4.2 Assignment Operators


    Assignment operators are used to assign values to variables. Kotlin provides shorthand
    assignment operators that combine the assignment (`=`) operator with arithmetic
    operators. These operators allow you to perform an arithmetic operation and assign
    the result to the variable in a single step.


    Here''s a list of common assignment operators in Kotlin:


    Addition assignment (`+=`): Adds the right operand to the current value of the
    variable and assigns the result back to the variable.


    Subtraction assignment (`-=`): Subtracts the right operand from the current value
    of the variable and assigns the result back to the variable.


    Multiplication assignment (`*=`): Multiplies the right operand with the current
    value of the variable and assigns the result back to the variable.


    Division assignment (`/=`): Divides the current value of the variable by the right
    operand and assigns the result back to the variable.


    Remainder assignment (`%=`): Computes the remainder of the division between the
    current value of the variable and the right operand and assigns the result back
    to the variable.


    Here''s an example that demonstrates the usage of assignment operators:


    ```

    var num = 10


    num += 5 // Equivalent to: num = num + 5


    num -= 3 // Equivalent to: num = num - 3


    num *= 2 // Equivalent to: num = num * 2


    num /= 4 // Equivalent to: num = num / 4


    num %= 3 // Equivalent to: num = num % 3


    println("Final value: $num")

    ```


    In the above example, we declared a mutable variable `num` and used assignment
    operators to update its value based on arithmetic operations.


    ## 4.3 Comparison Operators


    Comparison operators are used to compare values and determine their relationship.
    Kotlin provides the following comparison operators:


    Equal to (`==`): Checks if the left operand is equal to the right operand.


    Not equal to (`!=`): Checks if the left operand is not equal to the right operand.


    Greater than (`>`): Checks if the left operand is greater than the right operand.


    Less than (`<`): Checks if the left operand is less than the right operand.


    Greater than or equal to (`>=`): Checks if the left operand is greater than or
    equal to the right operand.


    Less than or equal to (`<=`): Checks if the left operand is less than or equal
    to the right operand.


    These comparison operators return a Boolean value (`true` or `false`) based on
    the result of the comparison.


    Here''s an example that demonstrates the usage of comparison operators:


    ```

    val a = 10


    val b = 5


    val isEqual = (a == b)


    val isNotEqual = (a != b)


    val isGreater = (a > b)


    val isLess = (a < b)


    val isGreaterOrEqual = (a >= b)


    val isLessOrEqual = (a <= b)


    println("Is Equal: $isEqual")


    println("Is Not Equal: $isNotEqual")


    println("Is Greater: $isGreater")


    println("Is Less: $isLess")


    println("Is Greater or Equal: $isGreaterOrEqual")


    println("Is Less or Equal: $isLessOrEqual")

    ```


    In the above example, we compared the values of variables `a` and `b` using comparison
    operators to determine their relationship.


    ## 4.4 Logical Operators


    Logical operators are used to combine and manipulate Boolean values. Kotlin provides
    the following logical operators:


    Logical AND (`&&`): Returns `true` if both operands are `true`, otherwise returns
    `false`.


    Logical OR (`||`): Returns `true` if either of the operands is `true`, otherwise
    returns `false`.


    Logical NOT (`!`): Negates the Boolean value of the operand. If the operand is
    `true`, it returns `false`, and if the operand is `false`, it returns `true`.


    Here''s an example that demonstrates the usage of logical operators:


    ```

    val x = 10


    val y = 5


    val z = 7


    val result1 = (x > y) && (x > z)


    val result2 = (x > y) || (x < z)


    val result3 = !(x > y)


    println("Result 1: $result1")

    ```'
