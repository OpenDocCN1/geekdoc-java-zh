    \ and `age` properties of `person1` and then invoke the `sayHello()` and `celebrateBirthday()`\
    \ methods.\n\n## 7.4 Constructors\n\nConstructors are special functions that are\
    \ used to initialize the properties of an object when it is created. Kotlin provides\
