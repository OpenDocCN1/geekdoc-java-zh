  md: '**Chapter 7. Glossaries**


    Flare glossary files are XML files with the extension `.flglo`. Flare keeps glossary
    files


    in the `Glossaries` directory under the `Project` directory. Flare typically displays


    glossary entries as sidebars. You can style glossary entries in the body of your
    content to


    make them readily identifiable, and you can link to the definition. Glossary entries
    can


    be simple, plain-text entries or separate, full-blown topic files.


    The example Flare glossary file in Example 7.1 shows the two different types of


    glossary entries. The first `<GlossaryEntry>` has a `<Definition>` tag that contains
    a


    text definition of the term. The second `<GlossaryEntry>` has a `<Definition>`
    tag that


    links to another file that contains the definition. These two types are known
    as *plain text*


    and *linked* definitions, respectively.


    **Example 7.1 – Flare glossary file**


    `<?xml version="1.0" encoding="utf-8"?>`


    `<CatapultGlossary>`


    ` <GlossaryEntry TermClass="Popup" Stem="True"`


    ` IgnoreCase="true" SortAs="term"`


    ` glossTerm="myglossary.Term0">`


    ` <Terms>`


    ` <Term>\_term</Term>`


    ` </Terms>`


    ` <Definition Link="">`


    ` The plain text term definition goes here.`


    ` </Definition>`


    ` </GlossaryEntry>`


    ` <GlossaryEntry TermClass="Popup" Stem="True"`


    ` IgnoreCase="true"`


    ` glossTerm="myglossary.Term2">`


    ` <Terms>`


    ` <Term>Another Term</Term>`


    ` </Terms>`


    ` <Definition`


    ` Link="/Content/gloss/AnotherTerm.htm">`


    ` </Definition>`


    ` </GlossaryEntry>`


    `</CatapultGlossary>`


    The `TermClass` attribute on the `<GlossaryEntry>` tag determines how the entries
    will


    behave. Values for this attribute are as follows:


    **Popup: **Open a pop-up window with the definition (default)


    **Expanding: **Expand the definition at the term location


    **Hyperlink: **Replace the current pane with the definition


    If you do not assign a value to the `TermClass` attribute, it defaults to `Popup`.
    The other


    two values are limited, depending on the definition type. Linked definitions can’t
    have'
  merge: -1
  pgno: 56
- img_proc: true
  md: 'the value `Expanding`, and plain text definitions can’t have the value `Hyperlink`.


    The `SortAs` attribute of the `GlossaryEntry` tag makes it possible to sort glossary
    terms


    by a value other than the term itself. For example, you may want to sort an entry
    by its


    acronym, or the entry may begin with a non-alphanumeric character such as an


    underscore. In Example 7.1, the term is *\_term*, and the value of the `SortAs`
    attribute is


    `term`. If the `SortAs` attribute is present, Flare will use its value when sorting
    the entry.


    The `SortAs` attribute was added in Flare 12.


    The `glossTerm` attribute, which was added in Flare 12, functions as a unique
    identifier,


    much as a primary key does in a database table. Previously, the only identifier
    was the


    text node found in the `<Term>` tag, which meant that references to glossary terms
    in your


    text had to match the value of the `<Term>` tag exactly. Because links to the
    glossary now


    use this unique identifier, the text of your link can be anything. For example,
    you can


    reference a glossary entry for the term *bookmark* with the following text, as
    long as the


    `glossTerm` attribute is set correctly:


    Bookmark


    bookmarks


    bookmarking


    dog-eared page


    Flare can generate references to glossary terms by matching text with terms. The
    `Stem`


    and `IgnoreCase` attributes tell Flare whether to include variants when generating


    references. For example, if you have defined the term *bookmark* and chosen the
    Convert


    all occurrences of a term radio button in the Target Editor, Flare will link *Bookmark*,


    *bookmarks*, and *bookmarking* to the term *bookmark* in the glossary. Of course,
    the term


    *dog-eared page* would not get linked.


    The Flare glossary implementation is fairly robust, and the ability to accommodate
    both


    lengthy and short entries is useful. However, there are still a few rough patches.
    For


    example, if you mix linked and plain text glossary entries and generate a *Tripane*
    HTML


    target, when you click on an entry in the glossary sidebar, linked glossary entries
    will


    open in the main panel and plain text entries will open by expanding in place
    in the


    sidebar.


    If you want glossary entries to behave uniformly, you need to create glossary
    entries as


    one type or the other. Plain text glossary entries might make sense for simple
    glossary


    items, but definitions often require more than one paragraph and also the ability
    to use


    HTML tags – for example, you may need to use `<ul>` tags to create a list.


    Using glossary topics for all entries would seem to be the best solution. However,
    there


    is a serious shortcoming with linked entries. Flare does not support linked glossary


    entries for print output.'
