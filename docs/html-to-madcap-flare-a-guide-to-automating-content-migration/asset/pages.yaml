    `$xp = new DOMXPath($d);`


    `$ns = $d->documentElement->namespaceURI;`


    `if($ns) {`


    ` $xp->registerNamespace("ns", $ns);`


    ` //find all dt`


    `$nodelist = $xp->query(''//ns:dt'');`


    `} else {`


    ` $nodelist = $xp->query(''//dt'');`


    `}`


    `if(! $nodelist->item(0)) {`


    ` exit("Element not found.");`


    `}`


    `$flare\_doc = makeRoot();`


    `//loop through nodes`


    `foreach($nodelist as $node){`


    ` createGlossaryEntry($node, $flare\_doc);`


    `}`


    `$flare\_doc->save($filename);`


    `//end main`


    `/\*\*`


    `\* Create a DOMDocument with a root node`


    `\* @return DOMDocument`


    `\*/`


    `function makeRoot(){`


    ` $flare\_doc = new DOMDocument();`


    ` //create document with CatapultToc root`


    ` $root = $flare\_doc->createElement(''CatapultGlossary'');`


    ` $flare\_doc->appendChild($root);`


    ` return $flare\_doc;`


    `}`


    `/\*\*`


    `\* Create a glossary entry`


    `\* @param DOMNode $node The <dt> node holding the term`


    `\* @param DOMDocument $flare\_doc The new document`


    `\*/`


    `function createGlossaryEntry($node, $flare\_doc){`


    ` //node is a glossentry`


    ` $glossentry = $flare\_doc->createElement(''GlossaryEntry'');`


    ` //always create popup`


    ` $glossentry->setAttribute("TermClass", "Popup" );`


    ` //create Terms`


    ` $terms = $flare\_doc->createElement(''Terms'');`


    ` //get text from node`


    ` $value = trim($node->textContent);`


    ` $term = $flare\_doc->createElement(''Term'', $value);`


    ` $terms->appendChild($term);`


    ` $glossentry->appendChild($terms);`


    ` //create definition`


    ` $def = $flare\_doc->createElement(''Definition'');`


    ` //clean file name`


    ` $pattern = "(\[\\/\\s\\-\_~,;:\\\[\\\]\\(\\).\])";`


    ` $value = preg\_replace($pattern, "", $value);`


