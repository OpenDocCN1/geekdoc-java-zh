  md: '**Chapter 15. Creating Derived Projects**


    To create a new, derived project from your linked template, start the New Project


    wizard. With the New from template radio button selected, you should see your
    template


    project under the templates folder you created in Chapter 14. Select this template,
    click


    Next, choose a target, and click Finish.^(\[16\]) That’s all there is to creating
    a derived


    project, but there are things to do immediately afterwards.


    ***15.1. First steps after creating a derived project***


    Familiarize yourself with the derived project. Flare associates a link icon with
    all of


    your files, both structural and content. However, be aware that if you use version
    control


    software within Flare, the version control icon takes precedence over the link
    icon


    Open the Project Organizer window and double click the `Imports` folder. You should


    see a `.flimpfl` file that bears the name of the source project. If you want to
    view or


    change the settings of the imported project, double click this file and open the
    Project


    Import Editor.


    **15.1.1. Removing links**


    Most of the imported files should remain identical to their source files. For
    example, if


    your corporate logo changes, change the source file in the source project, and
    auto-sync


    will update your derived projects from that file. That’s the point of creating
    a linked


    template project. However, you should unlink some files. These are:


    Stub files, such as TOC files, local CSS files, and variable sets.


    Files that do not belong in the current project


    Unlink a file in the following way:


    1\. Open the file you want to unlink and make an inconsequential change. For example,


    you can add a carriage return to a topic file.


    2\. When you change the linked file, the Linked Document dialog window opens,


    giving you the choices shown in Figure 15.1.'
