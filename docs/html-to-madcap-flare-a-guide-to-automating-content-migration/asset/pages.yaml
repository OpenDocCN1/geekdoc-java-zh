  md: '**Chapter 2. What You Need to Know About Flare**


    In the previous chapter you saw how Flare source files differ from standard XHTML


    files and what that means when importing files into Flare. This chapter discusses
    the file


    structure of a Flare project.


    ***2.1. Flare project structure***


    If you want to copy content files directly into Flare, use your own CSS file,
    or


    manipulate Flare XML files directly, then you need to understand how a Flare project
    is


    structured and where to find the appropriate files.


    Flare is organized by projects. When you create a new project, Flare creates a
    directory


    structure. The top-level directory contains the project file (a file with the
    extension


