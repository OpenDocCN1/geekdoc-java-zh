  md: '**Chapter 3. The Tool Kit**


    Existing HTML files, or files that have been converted to HTML, may require extensive


    clean up before you can successfully import them into Flare. If you run into too
    many


    problems that require a manual fix, you may begin to think that starting from
    scratch or


    cutting and pasting plain text would be a better alternative.


    Fortunately, there is a wide variety of tools you can use to avoid most manual
    fixes. This


    section describes the most important of those tools and their capabilities. When
    a


    pneumatic nailer is readily available, why use a hammer?


    These tools can help with some of the following tasks:


    Creating XHTML files


    Fixing and validating HTML files


    Formatting HTML files


    Removing proprietary styling


    Adding an XML declaration


    Properly formatting verbatim blocks


    If you work with XML or HTML files, you may be familiar with some of the tools


    presented here. Even so, don’t skip this chapter unless you already know how to
    handle


    tasks such as removing redundant namespace declarations or adding `name` attributes
    to


    *anchor* tags.


    All of the tools discussed here are available on Windows, Mac OS X, and Linux,
    so if


    you are importing HTML files from an operating system other than Windows, you
    can


    prepare your files on that operating system before you move them. Most of these
    are


    command-line tools, so you will need to be comfortable working from the command


    prompt, but that also means you can write scripts that use these tools to automate
    tasks.


    ***3.1. tidy***


    Some HTML files, especially those converted from other tools, contain proprietary
    tags


    and inline CSS code, which can be daunting. The **tidy** command will help you
    clean up


    extraneous material and make your HTML more readable. **tidy** has been around
    for many


    years but has recently been updated and revitalized by the HTML Tidy Advocacy


    Community Group (http://www.htacg.org/). To take advantage of recent improvements
    to


    **tidy**, be sure to download the latest executable file for your platform from


    http://binaries.html-tidy.org.


    **Tidy** can also validate and fix HTML markup and remove proprietary attributes,
    such as


    those that are created when Microsoft Word exports HTML. Importing content into
    Flare'
  merge: -1
  pgno: 22
- img_proc: true
  md: 'is much easier when you use **tidy** to validate your HTML and remove unnecessary


    markup.


    **Note**


    During import, Flare tries to fix HTML and can convert HTML to XHTML. However


    the import process is not foolproof, so it is better to discover and handle problems


    before you begin importing. In addition, if you want to import files into Flare
    by copying


    them into the `Content` directory, rather than using the Flare interface, those
    files must be


    valid XHTML.


    The **tidy** command line has numerous options, and it can be cumbersome to specify
    those


    options every time you use the command.


    Since most users use the same options repeatedly, **tidy** lets you define options
    in a


    configuration file. Example 3.1 shows a sample configuration file. It has some
    standard


    options and some options (highlighted in bold text) that have a direct impact
    on your


    ability to import HTML files into Flare. You can override an option specified
    in the


    configuration file by specifying the desired value for that option on the command
    line.


    **Note**


    For a complete list of the available options see HTML Tidy 5.2.0 Options Quick


    Reference. From the command line you can display all the available configuration
    file


    options by issuing the command **tidy -help-config**. The command-line options


    sometimes differ from the configuration file options so use **tidy -help** to
    identify the


    command-line options.


    **Example 3.1 – tidy configuration file**


    `// Use in the following way:`


    `// tidy -config \\path\\to\\tidy.conf -m <file>.html.`


    `// If HTML\_TIDY is set, no need to specify config file`


    `// -m updates the file in place`


    `clean: yes`


    `merge-divs: yes`


    `bare: yes`


    `drop-empty-paras: yes`


    `show-warnings: no`


    `drop-proprietary-attributes: yes`


    `output-xhtml: yes`


    `// character encoding options`


    `ascii-chars: no`


    `char-encoding: utf8`


    `//newline: CRLF`


    `// pretty print options`


    `indent: auto`


    `indent-spaces: 2`


    `word-2000: yes`'
