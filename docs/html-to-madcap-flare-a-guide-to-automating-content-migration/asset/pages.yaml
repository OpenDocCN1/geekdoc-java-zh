  md: '**Chapter 9. After Importing HTML**


    After importing files, it is hard to resist the impulse to immediately create
    output.


    However, there are other things you must do first. This chapter describes the
    steps you


    need to take after you have imported your files, including the following:


    Update or replace the default Flare TOC.


    Update or replace the default Flare glossary.


    Update or replace the default Flare CSS file.


    Find and repair any broken links.


    Convert internal links to cross-references.


    Run the Flare Project Analysis tool to find and resolve common issues.


    ***9.1. Updating TOC files***


    Flare creates a default TOC file in the `Project\\TOCs` directory and names it
    after the


    imported directory. Flare creates an entry for each file – using the name of the
    file,


    minus the extension, as the title – and sorts the entries by file name.


    The default TOC can be useful for small projects and where alphabetic ordering
    by file


    name makes sense, but if you have created a Flare TOC, you won’t need this file.
    You


    can remove it from within Flare by opening the Project Organizer, expanding the
    `TOCs`


    folder, right clicking the TOC file, and choosing Delete. You can also delete
    this file


    from Windows Explorer in the same way that you would delete any file, but it is
    safer to


    delete it from within Flare.


    If you created a Flare TOC file as described in Chapter 6, you can copy this file
    into a


    project using Windows Explorer or by importing it through the Flare interface.
    To


    import it using Flare, open the Project Organizer window, right click the `TOCs`
    folder,


    and choose Add Table of Contents ....


    If your imported TOC file is the sole TOC file, then it becomes the default TOC,
    and


    you do not need to associate it with a project or a target. However, it is useful
    to know


    how to associate a TOC with a project both from the user interface (UI) and by


    manipulating XML files.


    To set a TOC as the master TOC for a project, open the project properties by right


    clicking the project folder. Choose the Defaults tab and select the TOC from the
    Master


    TOC drop-down box.


    From an XML perspective, the TOC associated with a project is controlled by the


    `MasterToc` attribute on the `<CatapultProject>` tag of the project file


    (`*project\_name*``.flprj`). To manually associate a TOC with a project, set the
    value of'
  merge: -1
  pgno: 85
- img_proc: true
  md: 'this attribute to the relative path to the TOC file, for example:


    `/Project/TOCs/myfile.fltoc`. The project file is found at the root directory
    of your


    project and is not visible in the Flare UI. Therefore, to manually edit its contents,
    you


    need to work outside of Flare.


    To set a TOC as the master TOC for a *target*, open the Project Organizer window,


    expand the `Targets` folder, and double click the desired target to open the *Target*


    *Editor*. Go to the General tab and select a TOC from the Master TOC drop-down
    box.


    From an XML perspective, the TOC associated with a target is controlled by the


    `MasterToc` attribute. However, in this case `MasterToc` is an attribute on the


    `<CatapultTarget>` tag of the target file (extension `.fltar`), which can be found
    in the


    `Project\\Targets` directory. To manually associate a TOC with a target, set the
    value


    of the `MasterToc` attribute to the relative path to the `.fltoc` file. You can
    open this file


    in an external editor through the Flare interface or from Windows Explorer. For
    a


    sample target file, see Example 9.3.


    **9.1.1. Updating TOC files for synchronized files**


    When you use the auto-sync capability, each time you generate output, Flare creates
    a


    new TOC file. This occurs even if you have removed the original, default TOC file.


    Flare recreates the TOC file to ensure that any new files get included.


    If the default, auto-generated TOC file meets your needs, this is convenient.
    However, if


    the auto-generated TOC is not suitable, and if you want to avoid having to manually
    re-


    create your TOC every time Flare auto-syncs, you can get around this problem by
    using


    a script.


    The script in Example 9.1 creates a Flare TOC file ordered alphabetically by file
    name


    – you can modify the script to change this. However, unlike the auto-generated
    TOC file,


    the TOC generated by this script sets the title for each entry using the first
    heading


    (`<h1>`, `<h2>`, or `<h3>`) in the file. The script creates a file called `file\_list.fltoc`,


    which includes entries for every file in the directory you run the script in.
    You then copy


    this file to the `Project\\TOCs` directory.


