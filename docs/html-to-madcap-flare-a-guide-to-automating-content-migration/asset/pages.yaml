  md: '![](img/778bbca9afe8715a0e53d695f3ecc4ce_177_0.png)


    This target uses **pandoc** to convert a Word `.docx` file to HTML. This target


    accepts a file name as a parameter and creates a file named `tmp.html`. Any image


    files are copied to the `Resources\\Images` directory. Invoking **pandoc** using
    an


    Ant target is much simpler than directly invoking pandoc. Here is the Ant


    command:


    `ant docx2html -Dfile=file.docx`


    ![](img/778bbca9afe8715a0e53d695f3ecc4ce_177_1.png)


    The **help** target displays a detailed usage message. Because it is the default
    target,


    simply entering **ant** at the command line will display the usage message. You
    are


    not required to have a **help** target. If you invoke **ant** with the `\-p` option,
    Ant


    displays each target in alphabetical order along with the contents of the


    `description` attribute. However, creating your own help target gives you more


    control over the way help is displayed.


    Once you have created your build file, you can test its syntax and function by
    creating


    files called `tmp.txt` and `tmp.xml` and running the command `ant clean`. This
    should


    remove the files.


    You do not need to be in the directory that contains your build file to use Ant.
    For


    example, if your build file is in the `Content` directory, you can invoke the
    **help** target


    from a sub-directory with the following command line:


    `ant help -Dbasedir=./ -buildfile ../build.xml `


    If your target references a properties file, you must also specify the `\-propertyfile`


    option. If this is something that you do regularly, you may find that it is simpler
    to copy


    your build file to the sub-directory. If you do copy your build file, be sure
    to adjust any


    relative directory references. As an alternative, consider using an Ant configuration
    file.


    The Apache Ant Project web page contains detailed information on how to do this.


    ***A.6. Importing files into build.xml***


    You may find that you have some targets that are common to all projects and some
    that


    are project-specific. If this is the case, consider maintaining your `build.xml`
    as a linked


    file and creating a separate file for project-specific targets only. See Example
    A.3 for a


    sample project-specific file.


    **Example A.3 – Project-specific targets**


    `<?xml version="1.0"?>`


    `<project name="s"> `


    ` <!-- put local targets here -->`


    ` <target name="specific\_to\_this\_project" depends=""`'
  merge: -1
