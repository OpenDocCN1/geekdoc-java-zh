- img_proc: true
  md: 'Cascading Style Sheets (CSS) are used to format HTML files. When you import


    HTML files into Flare, you can also import associated CSS files to preserve your


    original styles. Even if you import your own style sheets, Flare includes styling
    for


    Flare-specific elements, such as TOC proxies, when it generates output.


    When Flare creates a print target, it uses CSS to style the output. You can add
    print-


    specific style directives for PDF or Word output using the `@media print` block
    in


    your CSS file.


    **conditions**


    Flare conditions allow you to include or exclude pieces of content in a build.
    You


    can apply conditions to entire topics or to pieces of content as small as a phrase.


    Conditions are an essential component when using Flare as a single-sourcing


    solution. Conditional processing is also referred to as *profiling*.


    **Content Explorer**


    The Flare Content Explorer is the window pane used for viewing and changing


    content files and other related files such as master pages. This window provides
    a


    file system view of your content and is usually docked on the left side of the
    Flare


    interface. You can double click topic files in this window to open them in the


    editor, or you can right click them to open them in an external editor.


    **cross-reference**


    A Flare cross-reference functions as an internal hyperlink: a pointer to a page
    or


    location within a project. You create a cross-reference using a `<MadCap:xref>`
    tag


    with the `href` attribute specifying the end point. Flare dynamically creates
    the link


    text for the cross-reference from the end point. Starting with Flare 12, if you
    create


    a cross-reference using the Flare UI and the end point is a location within a
    page,


    Flare will create a *bookmark* if one does not already exist.


    **Darwin Information Typing Architecture**


    Darwin Information Typing Architecture (DITA) is an XML standard used in


    technical documentation. Like Flare, DITA is topic-oriented with specialized


    topics such as tasks, references, and concepts.


    **DITA map**


    A DITA map creates an organizational structure for DITA topic files. Within a


    DITA project it performs a function similar to a Flare TOC file; it selects which


    topics appear in a document and determines where those topics appear.'
  merge: -1
  pgno: 208
- img_proc: true
  md: '**DOCTYPE**


    A DOCTYPE (or document type declaration) instruction precedes the root tag in
    an


    XML file or the `<html>` tag in an HTML page. It tells software, such as a browser,


    what XML schema to use and, for HTML, which version of the HTML standard to


    use. You can use the Advanced tab of the Target Editor to tell Flare to add a


    DOCTYPE declaration to some types of HTML output. You need a DOCTYPE


    declaration for a Flare topic file only if you want browsers to render pages in
    strict


    mode rather than quirks mode.^(\[22\])


    **Document Object Model**


    A Document Object Model (DOM) is a way of representing an HTML or XML


    document as a tree structure that can be manipulated by computer programs. Scripts


    in this book typically search DOM objects using XPath expressions.


    **Doxygen**


    Like *Javadoc*, Doxygen is a documentation generation tool that creates API


    documentation in HTML format from function signatures and properly formatted


    comments. Using *auto-sync*, you can easily import up-to-date versions of


    documentation generated using Doxygen.


    **entities**


    Entities typically represent characters that are not available from the keyboard.


    However, entities can also act as macros for arbitrary sequences of characters.
    You


    can use Flare *variable*s to replace entities that function as macros. To insert


    characters that are not available from the keyboard, use the Character option,


    which is found under the Insert menu.


    **fragment**


    An XML fragment is XML that lacks a root node. For example, if you transform a


    file to HTML using Pandoc and do not specify the `\-s` option, Pandoc creates
    an


    XML fragment. This is useful when the XML will be integrated into an existing


    document. Typically, if a root node is added, the XML fragment will be well-


    formed and valid.


    **glossary**


    A Flare glossary file is an XML file that contains a term definition or points
    to a


    topic file that contains a definition. Flare glossary files use the extension
    `.flglo`


    and are found in the `Project\\Glossaries` directory.'
  merge: -1
  pgno: 209
- img_proc: true
  md: '**inline markup**


    There are two broad categories of XML markup: inline and block. Block markup is


    used for content, such as paragraphs, that interrupts the flow of the preceding


    element by introducing a newline character. Inline markup is used for content,
    such


    as an emphasized phrase, that remains in the flow of a block. Inline tags can
    be


    contained within other inline tags or block tags. However, inline tags cannot


    contain block tags. To attach styling to inline HTML content, use the `<span>`
    tag. To


    attach styling to block HTML content, use the `<div>` tag.


    **Javadoc**


    Javadoc is a program that creates API documentation from Java source code that


    contains specially formatted comments. Javadoc creates HTML output. This kind
    of


    externally generated documentation is ideal for use with auto-sync, which


    automatically reimports content whenever output is built.


    **JavaScript Object Notation**


    JavaScript Object Notation (JSON) is an open-standard, text format usually used
    to


    transmit data to and from a web interface. Unformatted JSON text can be difficult


    to read. This book provides a script for formatting JSON text into a more readable


    form (see Section 11.4, “Formatting JSON text”).


    **Markdown**


    Markdown is a lightweight, plain-text markup that is readily converted to HTML.


    Because Markdown is designed to be converted to HTML, importing it into Flare


    is straightforward using a tool such as *Pandoc* (see Section 3.2, “Pandoc”).


    **master page**


    Master pages provide a way to include content on every page in your output.


    Master pages are usually used with online output. By including content in a master


    page, you can maintain that content in one location rather than multiple locations.


    Master pages have the extension `.flmsp` and are found in the


    `Content\\Resources\\MasterPages` directory.


    **namespace**


    XML namespaces allow you to combine content from different XML schemas


    without worrying about name collisions. Flare uses the `MadCap:` namespace to


    differentiate Flare-specific elements from HTML elements in Flare topics.


    **Pandoc**'
  merge: -1
  pgno: 210
- img_proc: true
  md: 'Pandoc is a command-line tool, developed by John McFarlane, used for converting


    between document formats. For example, Pandoc does a good job of converting


    *Markdown* and Microsoft Word format (`.docx`) to HTML. See Section 3.2,


    “Pandoc” for a description of how to use Pandoc to convert various formats into


    HTML for import into Flare.


    **presentational tags**


    Presentational tags express how the author wants content to be presented. For


    example, the HTML `<i>` tag expresses the author’s intent that the enclosed content


    should be displayed using an italic typeface. In most cases, you should use CSS,


    rather than presentational tags, to define how content should appear. For example,


    if you want to display a variable name using an italic typeface, you could mark
    it


    up as follows:


    `<span class="variable">myvar</span>`


    Then, use CSS to specify italics for content inside `<span>` tags with the `class`


    attribute set to `variable`. That way, if you decide later to change the style
    of


    variables to a constant-width typeface, you only need to change your CSS file;
    you


    can leave your content unchanged.


    **project**


    Flare groups related topic files into projects. A project may contain any number
    of


    topic files. A Flare project directory contains all content files for a project
    along


    with a Flare project file, which is an XML file bearing the extension `.flprj`.
    See


    Section 2.1, “Flare project structure” for a sample project.


    **Project Organizer**


    The Flare Project Organizer is the window pane used for viewing and changing


    project properties and any objects within the project scope. This window provides


    a file system view of project properties and is usually docked on the left side
    of the


    Flare interface. You can add, change, or edit project properties from this window.


    **proxy**


    A Flare proxy is an XML tag that tells Flare where to insert particular types
    of


    content when documentation is built. Flare proxies can be used in topic files
    and


    page layouts to create tables of contents, glossaries, lists, and other objects.


    **reSTructured text**


    reSTructured text is a lightweight markup language typically used by Python


    developers to document code. Like *Markdown*, it is is readily converted to HTML.'
  merge: -1
  pgno: 211
- img_proc: true
  md: '**root node**


    The root node is the top-level node in an XML hierarchy; there can be only one


    root node in an XML document. For HTML pages, the root node is an `<html>` tag.


    The term root node is also used when speaking of the top-level tag of a document


    fragment.


    **single sourcing**


    Single sourcing refers to creating a document, usually in XML format, that can
    be


    transformed into multiple output formats, for example HTML, EPUB, and PDF.


    When you need to edit single-source content, you change only the source document.


    This reduces the cost of maintenance, because you make changes in just one place.


    Flare provides the tools you need to create single-source documentation. However,


    no matter what tool you use, single-sourcing is never as straightforward as you


    might like. You will probably need to make adjustments to accommodate different


    output formats. For example, you may need different graphic files for different


    output formats. Flare *conditions* make it possible for you to support these kinds
    of


    adjustments.


    **skin**


    Skins are XML files that define the characteristics of Flare output files; one
    such


    characteristic is whether or not to include a glossary. Skin files are found in
    the


    `Project\\Skins` directory and have the extension `.flskn`.


    **snippets**


    Flare snippets are document fragments that can be inserted into a document. Text


    snippets are plain text, whereas block snippets may contain markup. Block snippets


    are useful for inserting content that is generated as a target is being built.
    See


    Section 10.1.1, “Flare snippets” for a full discussion of snippets.


    **Flare source file**


    A Flare source file refers to any topic file in a Flare project. Although Flare
    topic


    files may be valid XHTML files, they may also include proprietary tags or have


    other differences that render them invalid. Although Flare source files may not
    be


    valid XHTML, Flare generates valid XHTML for HTML output types. This


    distinction is especially important when you import HTML into Flare. See


    Chapter 1 for a more detailed discussion.


    **target**'
  merge: -1
  pgno: 212
- img_proc: true
  md: 'Targets are instances of output types. Common targets are PDF, Word, and HTML5.


    You can also have several different HTML output types, each of which constitutes
    a


    target. Flare target files have the `.fltar` extension and are stored in the


    `Project\\Targets` directory. You can manipulate some target properties, such
    as


    the `MasterToc` attribute using a program. The Flare UI provides a Target Editor
    for


    manipulating the target file. Open this editor from the Project Organizer by double


    clicking a target.


    **Target Editor**


    The Target Editor provides an easy way to manipulate a target file. You open a


    target file from the Project Organizer window by double clicking it. Any changes


    made using this tool change the XML `.fltar` file, which is found in the


    `Project\\Targets` directory.


    **TOC Editor**


    The Flare TOC Editor is a graphical interface for editing Flare TOC files. You


    select files from the `Content` folder and drop them into the table of contents.
    The


    TOC Editor manipulates `.fltoc` files, which are found in the `Project\\TOCs`


    directory. Open this editor from the Project Organizer by double clicking a TOC


    file.


    **Flare TOC**


    A Flare TOC file is an XML file similar to a DITA map file. It has the extension


    `.fltoc` and is found in the `Project\\TOCs` directory. A TOC file lists the files
    (or


    bookmarks) that appear in the table of contents for a specific document. A project


    may have any number of TOC files. In the Flare interface you manipulate these
    files


    using the *TOC Editor*. You can use multiple Flare TOC files to create different


    documents and to output different targets.


    **topic**


    Flare topics are self-contained, standalone units. The concept is derived from


    DITA. Topics may be generic or specialized. The specialized forms are tasks,


    concepts, and references. One major difference between DITA and Flare is that


    Flare is less strict about the internal structure of topics. A Flare topic is
    usually a


    separate HTML page.


    **Tripane**


    Tripane is a three-part skin for an HTML5 target. Tripane help contains three


    frames: a toolbar across the top, content on the right, and navigation on the
    left.'
  merge: -1
  pgno: 213
- img_proc: true
  md: '**UTF-8**


    UTF-8 is a character encoding for the Unicode standard. Unicode is an


    international standard that can express the character sets for most of the world’s


    languages. UTF-8 is the dominant character encoding for the web and is also the


    recommended default encoding for XML. The letters UTF come from **U**niversal


    Character Set, **T**ransformation, and **F**ormat. The digit 8 indicates an 8-bit
    character


    set.


    **variable**


    Flare variables perform much the same function as variables in a programming


    language. When Flare builds a target, it replaces each variable reference with
    the


    value associated with that variable. Variables make it easier to manage small


    pieces of content, such as product names, that are subject to change. When the
    value


    of a variable changes, you change the variable definition in only one place.


    Variables can be useful when you create a project prototype, because you can


    replace literal text with variables, then set those variables for each project
    you


    create from the prototype.


    **verbatim**


    Verbatim text in an XML or HTML tag is rendered as is – line breaks in the text
    are


    interpreted literally, and the text does not get wrapped as it would inside an
    HTML


    `<p>` tag. Verbatim tags can be problematic for PDF and EPUB output. If the text
    of a


    verbatim element exceeds the width of a PDF page, it will be truncated. Behavior


    with ebook readers varies, but usually text within verbatim tags is allowed to


    reflow if necessary.


    The HTML `<pre>` tag is a verbatim tag. If you are concerned that portions of


    verbatim text will be truncated in some output types, you can use CSS to set the


    `white-space` property of a tag to `pre-wrap`. This allows the reader or browser
    to


    wrap, rather than truncate, long lines.


    **well-formed**


    A well-formed XML file uses the correct syntax according to the XML standard.


    \[23\] For example, opening and closing tags match, tag names do not contain illegal


    characters, and the file has a single root node. An XML file is considered *valid*
    if


    there is a schema and the file complies with its constraints. An XML file can
    be


    well-formed but not valid. For example, if an XHTML file contains a `<head>` tag


    inside a `<body>` tag, the file might be well-formed, but it would not be valid


    because a `<head>` tag cannot appear inside a `<body>` tag according to the XHTML


    standard.'
  merge: -1
  pgno: 214
- img_proc: true
  md: '**XHTML**


    XHTML is an XML-compliant version of HTML; unlike HTML, XHTML must


    conform to strict XML syntax. This book uses the terms HTML and XHTML


    interchangeably. However, be aware that Flare requires any HTML file that you


    import be valid XHTML. If a file is not valid XHTML, Flare will attempt to


    convert it to XHTML. For example, if you import files that use the `<br>` tag,
    Flare


    will convert those tags to `<br />` tags.


    If you copy HTML files directly into a Flare project, bypassing the import process,


    make sure the files are valid XHTML. You can do this using **xmllint** or **tidy**.
    Note


    that Flare XHTML files must contain an XML declaration, even though this is not
    a


    requirement for standard XHTML files.


    **XInclude**


    The XInclude standard allows you to include external documents in an XML page.


    XInclude is defined by the World Wide Web Consortium (W3C).^(\[24\]) Both XML
    and


    plain text files can be XIncluded. Snippets usually perform the function of XInclude


    in Flare content.


    **XML**


    XML (Extensible Markup Language) is a text markup language that defines rules
    for


    creating documents that can be read and processed by both machines and humans.


    XML is a meta-language used to create domain-specific markup languages. The set


    of rules that define a particular XML language is called a *schema*.


    **XPath**


    XPath is a language for locating information in an XML document. XPath was


    designed to be used by *XSLT*, but is also used in other contexts, including PHP,


    which many of the scripts in this book use. You can also execute XPath expressions


    from the command line using the **xmllint** command with the `\--xpath` option.


    **XSLT**


    XSLT (Extensible Stylesheet Language Transformations) is a language for


    transforming XML documents into different formats, either other forms of XML or


    other formats entirely (e.g., plain text). The acronym XSL is often used as a


    synonym for XSLT.'
  merge: -1
  pgno: 215
- img_proc: true
  md: '\[22\] Quirks mode is a browser mode designed to maintain compatibility with
    older


    browsers, such as Internet Explorer 5.


    \[23\] https://www.w3.org/TR/xml/


    \[24\] XML Inclusions (XInclude) Version 1.0'
  merge: -1
