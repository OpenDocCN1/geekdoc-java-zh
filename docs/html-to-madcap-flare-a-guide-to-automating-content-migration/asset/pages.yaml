    **13.2.1. Linked file naming conventions**


    Auto-sync overwrites existing files when the name of a file in your project matches
    the


    name of a file in a project you have linked to. Using a dedicated source project
    and


    having a file naming convention for linked files greatly mitigates this danger.
    For


    example, if all of the linked files in your dedicated source project start with
    the prefix


    `lnk\_`, and you never use this prefix with unlinked files, you will never accidentally


    overwrite a file.


    Flare associates an icon with linked files, which can help you identify them.
    However, if


    you are using source control in Flare, you will see the source control icon and
    not the


    linked files icon. This is unfortunate since it deprives you of an easy way to
    identify


    linked files. Therefore, I recommend you use a naming convention to identify linked


    files.


