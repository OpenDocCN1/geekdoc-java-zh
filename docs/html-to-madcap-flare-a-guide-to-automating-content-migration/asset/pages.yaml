  md: '**Chapter 17. Managing Linked Projects**


    When you create a linked template project and create projects from this template,
    you


    need to manage the following elements:


    The source project


    Derived projects


    The template project


    Each element needs to be managed in a different way. This chapter describes best


    practices for managing these elements to help avoid problems.


    ***17.1. Managing the source project***


    When auto-sync is enabled, changes to source files are copied to any linked project
    that


    uses those files. In addition, if you add a file to your source project, that
    file will be


    added to derived projects when auto-sync runs unless you exclude it using one
    of the


    methods discussed in Section 16.2, “Excluding files”


    When you add new files that will be copied into derived projects, be careful to
    avoid


    name conflicts with existing files. You can avoid this problem by using a naming


    convention for linked files.


    ***17.2. Managing derived projects***


    Your biggest concern with derived projects is ensuring that you import only the
    files you


    need and that you don’t incorrectly overwrite files in your derived project.


    When you make minor changes to your source project, auto-sync is the quickest
    way to


    update your derived projects. However, when you make major changes, I recommend


    testing the result before using auto-sync. Do this by manually reimporting files
    into a


    derived project, being sure to backup the project first. Pay special attention
    to the


    Accepting Imported Documents screen (Figure 16.2). This is your last chance to
    catch


    any mistakes. If the reimport shows changes that you are unsure about, back out
    the


    changes and compare the files to confirm that the changes are desirable.


    If there are files in the source project that you do not want to import, exclude
    them using


    one of the methods described in Section 16.2, “Excluding files” Also check to
    be sure


    that all of the files you do want to import from the source project have been
    successfully


    imported. Once you have completed the import, use the Project Analysis tool to
    check


    for any problems.


    If you find that updates to the source project constantly introduce problems in
    a derived'
