    need to spend on maintenance.\n\nLinking existing projects to a source project\
    \ carries some risks and requires careful\n\nconsideration. When you create a\
    \ new project from the linked template, there are no\n\nexisting files to accidentally\
    \ overwrite. However, an existing project may contain files\n\nthat have the same\
    \ name as files in the source project; you do not want to accidentally\n\noverwrite\
    \ such files. If you take care in linking existing projects to your source project,\n\
    \nyou can avoid mishaps.\n\n***16.1. Preparation***\n\nBefore you start, backup\
    \ the project you are changing. You can create a zipped copy\n\neither from within\
    \ Flare or by using an external program. If you are using version\n\ncontrol software,\
    \ commit any outstanding changes and note the latest revision number in\n\ncase\
    \ you need to revert changes.\n\nIn addition to backing up your project, you should\
    \ consider the following guidelines:\n\nIf possible, start with a small project.\n\
    \nReview all the files in the project. For files that have the same name as files\
    \ in the\n\nsource project, decide whether you want to retain the original, merge\
    \ changes from\n\nthe existing project to the source project, or overwrite the\
    \ existing file with the\n\nsource project file. You can also change the name\
    \ of the file in the existing project.\n\nBe sure to do this through the Flare\
    \ interface so that changes to any related files are\n\nmade automatically.^(\\\
