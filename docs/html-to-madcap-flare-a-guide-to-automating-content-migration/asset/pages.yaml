    **13.3.2.4. Linked CSS files**


    On the face of it, adding a CSS file to a source project doesn’t make sense. Each
    project


    has unique styles, and adding styles to a linked CSS file can be awkward, since
    you


    need to edit the source file and update your derived project every time you make
    a


    change. Plus you’ll end up with a CSS file cluttered with styles that aren’t generally


    applicable. At best, it looks like a CSS file can only be a stub file.


    However, you can have your cake and eat it too. Create a linked CSS file that
    you use in


    every project (e.g., `master.css`). Then, create a separate CSS file for local
    styles (e.g.,


    `local.css`). You associate these two style sheets with one project file by adding
    a line


    such as the following at the top of `master.css`:


    `@import ''local.css'';`


    This line imports a style sheet named `local.css` from the current directory.
    You then


    make `master.css` the default style sheet for your project and place local style


    information in the `local.css` file.


    To create `local.css` file, open a text editor and add the following contents:


    `/\* Put project-specific CSS customizations here, and`


    ` unlink this file after importing. \*/`


    `p.test`


    `{`


    ` color: #ff0000;`


    `}`


    Save this file as `local.css` in the `StyleSheets` directory of the source project.


    Because this file is imported into the main style sheet, any styles that appear
    in it can be


    used in the current project.


    This file is a stub file. Therefore, when you import it into a derived project,
    you should


    unlink it so your local changes won’t be overwritten. To confirm that the `local.css`
    file


    is accessible in your project, select the `local.css` style sheet in Flare, open
    the style


    editor, and look for the `p.test` class.


    **Warning**


    If you use this strategy, be sure to set the master style sheet for your project
    or target to


    be your shared CSS file (`master.css`), rather than the local CSS file (`local.css`).
    The


    `@import` statement in your shared CSS file ensures that `local.css` gets included.'
