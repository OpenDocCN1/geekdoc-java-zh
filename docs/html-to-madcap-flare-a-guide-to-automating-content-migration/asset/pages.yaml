  md: 'into an existing project or copy them directly into the directory without using
    the Flare


    user interface.


    The `Content` directory also contains a `Resources` directory. If you import resources
    to


    the project resources folder, then you will find them under the `Content\\Resources`


    folder. Image files will be in the `Content\\Resources\\Images` directory. Flare
    updates


    any links to these resources to match their new location.


    **8.1.1.3. Changes to HTML files**


    If the HTML files you import are valid XHTML, then Flare changes only the following


    things:


    If an imported XHTML file has no XML declaration, Flare adds one in the


    following form:


    `<?xml version="1.0"?>`


    Flare adds a namespace declaration for the MadCap namespace to the `<html>` tag:


    `xmlns:MadCap="http://www.madcapsoftware.com/Schemas/MadCap.xsd"`


    Flare may add some proprietary attributes, such as `MadCap:sourceDocument` or


    `MadCap:lastHeight` to the `<html>` tag. You can ignore these attributes, which


    Flare uses internally.


    **Importing individual HTML files**


    If you need to import individual HTML pages into a project, you can open Windows
    Explorer


    and move or copy the file to the `Content` directory for your project. If your
    file is valid XHTML


    and has a valid XML declaration, Flare will silently import the file. If there
    is no XML


    declaration, when you attempt to open the file in the Flare XML editor, a dialog
    box will open


    asking whether you want to convert the file to XML.


    **8.1.1.4. The Project directory**


    The `Project` directory contains default files that make it possible for you to
    generate


    output immediately. Because we chose the HTML5 output type during import, this
    output


    type will be the default. You can confirm this by looking under the `Project\\Targets`


    directory, which, at this point, contains only one target file. Since all target
    files require


    a TOC file, you will also find a default TOC file, which will have the name of
    the


    directory that was imported. The default TOC file can be found in the `Project\\TOCs`


    directory.'
