  md: '**Chapter 4. CSS and Flare**


    If you are familiar with CSS, then you probably have questions about using CSS
    in


    Flare. For example, “Can I reuse existing style sheets, or do I need to start
    from


    scratch?” “If I bypass the UI and directly manipulate CSS files, will I run into


    problems?” “Will my styles conflict with built-in Flare styles, and which ones
    take


    precedence?” To answer these kinds of questions, let’s look at how Flare handles
    CSS.


    In standard HTML, you manage CSS by including a style block or link to a CSS file
    in


    each HTML file. Since Flare generates HTML files, it can manage CSS at a higher
    level.


    This difference is critical when you are importing HTML files into Flare.


    The best starting point is to look at the standard ways of associating CSS with
    HTML


    content:


    By adding a `style` attribute to the element you wish to style.


    By adding a `<style>` block to the `<head>` of an HTML page.


    By referencing an external style sheet using a `<link>` in the `<head>` of an
    HTML


    page.


    Inline styling (using the `style` attribute) has the highest precedence. After
    that, the order


    in which you include CSS in the `<head>` element determines precedence. CSS defined


    later in the `<head>` takes precedence over CSS defined earlier. By convention,
    links to


    external files appear first, followed by style blocks (see Example 4.1).


    **Example 4.1 – Referencing CSS from HTML**


    `<head>`


    ` <title>Sample Page</title>`


    ` `


    ` <link rel="stylesheet" type="text/css" href="sample.css" />`


    ` `


    ` <style type="text/css">`


    ` body {`


    ` background-color: white;`


    ` color: black;`


    ` }`


    ` </style>`


    `</head>`


    `<body style="color: white; background-color: black">`


    `...`


    In Example 4.1, the inline styles defined in the `<body>` tag take precedence
    over those


    defined in the `<style>` tag in the `<head>`, which in turn, take precedence over


    properties styled in the file referenced from the `<link>` tag. The styles closest
    to an


    element are the ones applied. Simply put, the last one in wins. The same rules
    apply in


    Flare.'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'If you have uniform styling for specific classes of tags, and those tags appear
    in most


    pages, then it’s not a good idea to style such tags inline or from a `<style>`
    block


    embedded in the `<head>`. In standard HTML, the best practice for handling styles
    that


    apply to most pages – global styles – is to link to an external CSS file in the
    `<head>` of


    each page.


    **This is where Flare differs from standard HTML practice.** You usually do not
    apply


    styles directly to Flare source files. Instead, Flare adds references to CSS when
    it


    builds output. For this reason, from within Flare, you can apply styles at the
    following


    levels:


    **Project: ** Associate a style sheet with a *project*. This is a project-level
    master


    style sheet.


    **Target: ** Associate a style sheet with a *target*. This is a target-level master
    style


    sheet.


    **Topic: ** Associate a style sheet with a topic by linking to it from the `<head>`


    element. Flare documentation calls such a style sheet a local style sheet. If
    you are


    familiar with HTML, this is the most common way of styling HTML pages. ^(\[4\])


    **Master pages: ** For online output, master pages function as templates and can
    have


    style sheets associated with them. Although the name uses the term *master*, styles


    implemented in this way are a variation on local, topic-specific style sheets.
    They


    simply make it easier to associate a style sheet with a number of topic files.


    **Embedded: ** The Flare documentation refers to `<style>` tags in the `<head>`
    of an


    HTML page as embedded styles. The only way to create embedded styles within


    Flare is through the Flare text editor.


    **Inline: ** Add a `style` attribute to an individual tag within a page. The only
    way to


    create inline styles within Flare is through the Flare text editor or the XML
    editor.


    Master style sheets are usually your best choice. You should only rarely need
    to use


    embedded, inline, or topic-specific styles. For styles that apply to an entire
    project, use


    a project-level master style sheet. For styles that apply to a specific target,
    use a target-


    level master style sheet. (See Section 9.3, “Resource files” for details on how
    to do


    this.)


    As you might expect, when Flare builds output, it associates project-level and
    target-


    level master files by adding links to those files in the `<head>` element on each
    output


    page that needs them. This saves you from having to individually maintain links
    in each


    topic file.


    Because Flare can manage CSS with master style sheets, you can usually remove


    embedded CSS and links to external CSS files before you import HTML. Using Flare


    master style sheets is much easier than linking to CSS files in the `<head>` element
    of


    every file in a project.'
  merge: -1
