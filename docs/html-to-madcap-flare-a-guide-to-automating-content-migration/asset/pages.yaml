    ***7.4. Creating a glossary for print output***


    As noted earlier, Flare does not include linked glossary topics when it builds
    print


    targets. If you use linked topics – as recommended here – your print glossary
    will be


    empty, and if you mix linked and plain-text entries, your print glossary will
    include only


    plain-text topics. Neither situation is satisfactory.


    The solution is to create a separate glossary file for print and bypass Flare’s
    normal


    glossary processing. Then, either use a separate TOC for print or mark the top-level


    `<html>` tag in the glossary with the `MadCap:conditions` attribute set to the
    value


    `Default.PrintOnly`. This (along with a properly configured target file) tells
    Flare to


    use your HTML glossary only when building a print target.'
