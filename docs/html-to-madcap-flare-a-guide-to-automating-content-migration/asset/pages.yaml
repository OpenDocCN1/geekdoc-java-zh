  md: '`wrap: 72`


    `tab-size: 2`


    `preserve-entities: no`


    `join-styles: yes`


    `**add-xml-decl: yes**`


    `//drop-empty-paras: yes`


    `add-xml-space: yes`


    `**anchor-as-name: yes**`


    The options set in Example 3.1 are:


    `clean` – Replace *presentational tags* with CSS. Presentation should be controlled


    by CSS rather than by embedded HTML tags. This option will remove tags such as


    `<center>` and create a CSS style block within the `<head>` of the HTML page.


    `merge-divs` – Merge nested `<div>` tags. Conversion to HTML sometimes


    introduces unnecessary `<div>` tags. This option will not affect tags with `id`
    or


    `class` attributes.


    `bare` – Strip Microsoft-specific HTML.


    `drop-empty-paras` – Drop or keep empty `<p>` tags. Conversion to HTML


    sometimes introduces unnecessary `<p>` tags.


    `show-warnings` – Display or suppress output warnings. Warnings can be


    distracting, but in some circumstances you may want to display them.


    `drop-proprietary-attributes` – Remove proprietary attributes. Proprietary


    attributes may cause Flare import to fail.


    `output-xhtml` – Tell **tidy** whether or not to generate *XHTML*. Flare expects
    XML


    compliant HTML so if the HTML you are importing is not XHTML, then this option


    will create XHTML.


    From the command line you can specify this option using `\-asxhtml`.


    `char-encoding` – Specify the character encoding for both input and output. Change


    this option if undefined characters show up in the output. Using `ascii` instead
    of


    `utf8` may resolve any issues you encounter.


    `newline` – Specify the line terminator. If you are moving files from a non-Windows


    operating system you should specify `CRLF`.


    `ascii-characters` – Specify whether or not to convert named entities such as


    `&ndash;` to their closest ASCII equivalent. This option modifies the behavior
    of


    the `clean` option.


    `indent` – Define how **tidy** should indent block-level tags.


    `indent-spaces` – Specify the number of spaces for indentation.


    `word-2000` – Remove surplus Word insertions. If your HTML file was originally
    a


    Word file, set this option to `yes`.


    `wrap` – Specify the column width for wrapping text.


    `tab-size` – Specify the number of spaces for tab stops.


    `preserve-entities` – Specify whether or not to preserve *entities*.


    `join-styles` – Specify whether or not to combine style elements where multiple'
