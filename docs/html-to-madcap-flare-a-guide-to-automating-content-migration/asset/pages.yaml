    ***11.5. Setting a maximum line length***


    For fixed-width output formats such as PDF, long lines of code in verbatim tags
    such as


    `<pre>` can present a problem; if the line length exceeds the page margins, content
    will


    be truncated. Adjusting long lines is not difficult, but when you automate the
    inclusion of


    verbatim content with, for example, XInclude, you must also automate detecting
    and


    processing long lines.


    CSS offers one solution: add a media print style such as: `pre {white-space: pre-`


    `wrap;}`. This style allows text in `<pre>` tags to wrap. However, this solution
    does not


    indicate to readers that a line break has been introduced, and you have no control
    over


    where line breaks occur. The script in Example 11.7 breaks lines at a fixed location,
    so


    lines are not truncated. As with Example 11.6, you should use this script only
    with plain


    text content surrounded by `<pre>` tags. However, unlike Example 11.6, this script


    processes all `<pre>` tags, not just those with the `class` attribute set to `json`.


