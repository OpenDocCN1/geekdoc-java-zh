  md: 'The DocBook style sheets provide a set of parameters that make it easy to remove


    numbering and labels for chapters, appendices, sections, and parts. To do this,
    set the


    value of the following parameters to `0`: **chapter.autolabel**, **appendix.autolabel**,


    **section.autolabel**, and **part.autolabel**.


    The style sheets do not have parameters to turn off labels and numbering for tables,


    figures, examples, and glossaries. To do this, you need to add a simple, one-line


    stylesheet customization. Here is the line:


    `<xsl:template match="table|figure|example|glossary" mode="label.markup`


    You also need to turn off numbers and labels in the generated text for cross-references.


    Example E.1 contains a DocBook style sheet customization that modifies the generated


    text parameters to remove labels and numbers from cross-references.


    **Example E.1 – Remove numbering from cross-references generated from**


