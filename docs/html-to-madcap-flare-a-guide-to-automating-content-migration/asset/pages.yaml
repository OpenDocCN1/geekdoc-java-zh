  md: 'This has the advantage that you can use the source code file unchanged. However,
    Flare


    does not process XInclude statements, so you must process inclusions before generating


    output. You can use the **xmllint** command with the `\--xinclude` option to resolve


    XInclude statements.


    Example 10.4 shows how to use XInclude to include a text file, but you can also


    dynamically include HTML. Suppose you maintain *Markdown* files outside the


    documentation repository, and you need to include that content whenever you build


    output. To do this take the following steps:


    1\. Convert your Markdown file to an XML fragment using **pandoc**:^(\[9\])


    `pandoc -f markdown -t html -o markdown.html mymarkdown.md`


    2\. Reference the output file, `markdown.html` from another HTML file (see


    Example 10.5).


    **Example 10.5 – XInclude XML files in Flare**


    `<?xml version="1.0" encoding="utf-8"?>`


    `<html xmlns:MadCap="http://www.madcapsoftware.com/Schemas/MadCap.x`


    ` xmlns:xi="http://www.w3.org/2001/XInclude">`


    ` <body>`


    ` <p>Some text here.</p>`


    ` <xi:include href="markdown.html">`


    ` <xi:fallback>`


    ` <p>Markdown file not found.</p>`


    ` </xi:fallback>`


    ` </xi:include>`


    ` <p>More text here.</p>`


    ` </body>`


    `</html>`


    3\. Resolve the inclusion using the following **xmllint** command line:


    `xmllint --xinclude main.html --output new.html`


    This creates a file named `new.html`, which contains the contents of `main.html`
    and


    the contents of `markdown.html`. If **xmllint** cannot locate `markdown.html`,
    it will


    insert the contents of the `<xi:fallback>` tag instead.


    **Note**


    The included content replaces the XInclude statement. The resulting file, with
    the


    inclusion, must be valid HTML. For example, you cannot include HTML that begins


    with a `<body>` tag into a page that already has a `<body>` tag.


    You can use Apache Ant to automate XInclude tasks (see Section A.7.2, “Including


    files”), and with Flare 2016 r2, you can use pre-build commands to ensure that
    files are


