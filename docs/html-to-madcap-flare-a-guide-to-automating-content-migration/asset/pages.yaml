    **4.2.1.3. Numbering ordered lists**


    In Flare print output, numbering for ordered lists does not function as it does
    in HTML.


    In HTML, you set the `type` attribute on the `<ol>` tag. This works as expected
    in Flare


    HTML output. However, for print output, Flare uses inline CSS. From the Flare


