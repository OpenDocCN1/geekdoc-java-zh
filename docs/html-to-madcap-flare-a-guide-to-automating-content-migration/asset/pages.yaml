  md: 'You can use the default target file to generate output. However, because the
    default TOC


    file contains just an alphabetical listing of all the imported files using the
    file names as


    the titles, it may not be very useful.


    Flare also creates other default files in this directory, including a glossary
    file and a


    variables file. Flare also creates an import-related file in the `Imports` directory.
    This


    file bears the name of the imported directory and has the extension `.flimphtml`.
    You


    can delete this file if you are permanently importing files into Flare.


    **8.1.1.5. Permanent import summary**


    The import wizard makes it easy to create a project from HTML files. The wizard


    validates files and builds the basic project structure. However, creating a project
    in this


    way is a convenience and not a requirement. You do not need to use the Flare interface


    to import files. If you have valid XHTML files, importing them through the UI
    simply


    adds an XML declaration and the MadCap namespace.


    If you have valid XHTML files with XML declarations and the shell of a project,
    you


    can use the operating system to copy files to the `Content` directory; you do
    not need the


    Flare interface. You can open such files in the Flare XML editor or the text editor
    and


    use them immediately. If you include them in a TOC file, they will appear in output
    files.


    No other processing is required. This capability is a powerful feature of Flare
    not only


    for converting existing content but for dealing with any content created outside
    the Flare


    interface that needs to be incorporated into your documentation. The full implications
    of


    this are discussed in Chapter 12, Scripting Creation of Projects.


    Once you have imported content into Flare, you still need to perform several tasks.


    These tasks are discussed in Chapter 9, but first a word about synchronized


    documentation.


    ***8.2. Synchronized documentation***


    Instead of permanently importing files, you can import them and maintain them
    outside


    Flare. Importing files using the wizard is a convenient way to update and maintain


    externally created documentation. For example, suppose you have API documentation


    that is built from source code comments and function signatures using *Doxygen*.
    If you


    import these files using the import wizard, you can link the Flare files to the
    original


    files and enable auto-sync to tell Flare to automatically retrieve updates whenever
    you


    build an output target.


    Here are some situations where you might want to link to externally created


    documentation:


    When using *Javadoc* to create documentation from source code.'
