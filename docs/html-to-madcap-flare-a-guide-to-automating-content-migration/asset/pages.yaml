    the title and


    heading will always match.


    However, HTML files created outside Flare usually have a `<title>` tag, since
    you can’t


    have a valid XHTML page without one. When you convert documents to HTML and


    import them into Flare it’s easy for the `<title>` and the top-level heading to
    get out of


    sync.


    Discrepancies between these two elements can mislead readers, and because some


    targets, WebHelp for example, return only the contents of the `<title>` tag, the
    accuracy


