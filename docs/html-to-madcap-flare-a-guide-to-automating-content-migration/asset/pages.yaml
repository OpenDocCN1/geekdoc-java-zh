  md: '***E.10. Summary***


    How you use DocBook and how you use Flare will determine how you set various


    parameters and how readily a DocBook project will convert to a Flare project.
    While


    Flare is oriented towards creating standalone topics, it is often used to create


    documentation that could just as easily have been created by DocBook. A DocBook


    `<book>` transformed to chunked HTML could easily have the same structure as a
    Flare


    project output as a Tripane target.


    Some aspects of DocBook cannot be converted to Flare. For example, you normally


    resolve DocBook profiling directives during conversion, so they aren’t carried
    over to


    HTML output and, thus, cannot be used by Flare. However, the flexibility of the


    DocBook stylesheets makes it possible to fine tune output to make import into
    Flare


    seamless. If you set up a prototype project, as described in Chapter 12, then
    you may be


    able to create a completely automated process to convert, import, and build Flare
    output


    from DocBook source.


    Example E.4 summarizes the parameters discussed in this chapter, showing either
    the


    recommended value or the default where there is no recommended value.


    **Example E.4 – Sample XSL customization file for DocBook**


    `<xsl:stylesheet xmlns:xsl="http://www.w3.org/1999/XSL/Transform"`


    ` xmlns:d="http://docbook.org/ns/docbook" version="1.0">`


    ` <!-- Parameters optimized for Flare. Where there is no`


    ` optimal value, the default is shown. -->`


    ` <!-- Chunking parameters -->`


    ` <xsl:param name="chunker.output.encoding">UTF-8</xsl:param>`


    ` <xsl:param name="chunk.section.depth">1</xsl:param> `


    ` <xsl:param name="chunk.first.sections">0</xsl:param>`


    ` <xsl:param name="chunk.tocs.and.lots">1</xsl:param>`


    ` <xsl:param name="chunk.separate.lots">0</xsl:param>`


    ` <xsl:param name="html.ext">.html</xsl:param>`


    ` <xsl:param name="suppress.header.navigation">1</xsl:param>`


    ` <xsl:param name="suppress.footer.navigation">1</xsl:param>`


    ` <!-- TOC parameters -->`


    ` <xsl:param name="generate.toc">`


    ` article toc,title`


    ` book toc,title`


    ` </xsl:param>`


    ` <xsl:param name="toc.section.depth">2</xsl:param>`


    ` <xsl:param name="toc.list.type">dl</xsl:param>`


    ` <!-- CSS parameters -->`


    ` <xsl:param name="html.stylesheet"></xsl:param>`


    ` <xsl:param name="docbook.css.source"></xsl:param>`


    ` <xsl:param name="custom.css.source"></xsl:param>`


    ` <xsl:param name="generate.css.header">0</xsl:param>`'
