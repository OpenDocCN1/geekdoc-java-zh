    ***3.3. xmllint***


    The **tidy** utility can manage most HTML cleanup jobs, but an equally useful
    tool is


    **xmllint**. **xmllint** parses and validates XML files.^(\[2\]) In addition to
    validating files,


    **xmllint** has a number of other useful options, including the following:


    \--html


    Use the HTML parser for input. This option is most useful in combination with
    the


    `\--xmlout` option to generate XHTML from HTML.


    \--xmlout


    Create XML output. Use this option with the `\--html` option to convert HTML files


    to XHTML files. This command will also add an XML declaration to the output


    file so you can move it to a Flare directory directly, bypassing the Flare interface.


    \--output `*file*`


    Specify the name of the output file. By default, the output of **xmllint** goes
    to stdout.


    Use this option to direct output to a file instead.


    \--noout


    Suppress output. By default **xmllint** sends output to stdout or a file. This
    option


    suppresses that output.


    \--valid


    Validate an XML file. Although there are many ways to validate HTML files,


    **xmllint** sometimes identifies problems more precisely than other methods. Use
    the


    `\--noout` option to suppress output when you are validating; that will make errors


    easier to spot.


    \--shell


    Open an **xmllint** shell. This option lets you execute *XPath* expressions on
    an XML


    file. You can use the shell to query an XML file or to test XPath expressions.


    \--format


    Reformat and re-indent output. The default value for indentation is two spaces.
