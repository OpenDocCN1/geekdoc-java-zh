  md: 'Example 10.3 shows the structure of a `.flvar` file.


    **Example 10.3 – VariableSet file (**`**General.flvar**`**)**


    `<CatapultVariableSet conditions="">`


    ` <Variable`


    ` Name="ProductName"`


    ` Comment="We''re not sure what the final`


    ` name for this product will be.`


    ` This is the code name."`


    ` Definition="">`


    ` Vintage Port`


    ` </Variable>`


    `</CatapultVariableSet>`


    To reference a variable from a Flare topic, insert the following XML tag:


    `<MadCap:variable name="General.ProductName" />`


    In this case, `General` identifies the VariableSet file (`General.flvar`) that
    contains the


    variable definition for the variable `ProductName`. If you use named entities
    as macros in


    HTML files that you have imported into Flare, you can use a search and replace
    utility to


    convert those entities to Flare variables.


    Variables make it easier for you to customize documents at build time. Instead
    of


    directly manipulating the contents of one or more topic files, you manipulate
    a single


    VariableSet file. The Section 12.4, “Creating a document title” shows how to do
    this.


    **10.1.3. Using XInclude**


    *XInclude* is an XML specification for including documents or portions of documents


    within an XML file. Usually, snippets are the best way to reuse XML document


    fragments. However, for some use cases, XInclude may be a better choice.


    For example, suppose your documentation includes a source code file that is maintained


    elsewhere. To include that source code file as a Flare snippet, you would need
    to wrap


    it in the appropriate HTML tags before you could include it. XInclude lets you
    bypass


    this step and include the file as shown in Example 10.4.


    **Example 10.4 – XInclude text files in Flare**


    `<?xml version="1.0" encoding="utf-8"?>`


    `<html xmlns:MadCap="http://www.madcapsoftware.com/Schemas/MadCap.xsd"`


    ` xmlns:xi="http://www.w3.org/2001/XInclude">`


    ` <head><title>Source Code</title></head>`


    ` <body>`


    ` <h1>Source Code</h1>`


    ` <pre><xi:include href="external\_file.c" parse="text" /></pre>`


    ` </body>`


    `</html>`'
