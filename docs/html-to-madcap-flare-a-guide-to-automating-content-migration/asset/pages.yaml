  md: 'example, sections appear as nested elements within a chapter, following the
    order they


    appear in the DocBook source.


    If you want to use the HTML ToC created from DocBook to generate a Flare TOC,
    here


    are three parameters you need to consider:


    **generate.toc: ** Determine which elements should contain a ToC in the output.
    To


    create a Flare TOC file, you need only a top-level ToC, so set this parameter
    as


    follows:


    `<xsl:param name="generate.toc">`


    ` article toc,title`


    ` book toc,title`


    `</xsl:param>`


    To create ToCs at other levels, use the Flare mini-TOC proxy. For example, if
    you


    want a ToC at the beginning of a chapter, add a mini-TOC Proxy at that point.


    **toc.section.depth: ** Determines the deepest heading level for ToC entries.
    By


    default, this parameter is set to `2`, which means the ToC will include headings


    down to (and including) level-two sections.


    If **chunk.section.depth** and **toc.section.depth** have the same value, there
    will be a


    ToC entry for each output file. This is the most common situation. If


    **chunk.section.depth** is greater than **toc.section.depth**, some HTML files
    will not


    have ToC entries, which could leave them inaccessible. If **chunk.section.depth**
    is


    less than **toc.section.depth**, some ToC entries will point to anchors within
    pages


    rather than directly to pages. If this is the case, make sure that your destination


    anchors have `name` attributes, because Flare TOC entries can point only to anchor


    tags that have a `name` attribute. You can create bookmarks using tidy (see


    Section 3.1, “tidy”) or the script in Example 5.5, “Script to create bookmarks”.


    **toc.list.type: ** Determines the HTML list type that the stylesheets use for
    ToC


    output. The default value is `dl`, but you can change this value freely, because
    the


    script used to create a Flare ToC (Example 6.3, “Script to create a Flare TOC”)


    handles any of the ToC list types that DocBook produces.


    ***E.4. Labels and numbering***


    By default, the DocBook HTML style sheets assign numbers and labels to chapters,


    appendices, figures, tables, and examples. The numbering follows the ordering
    of those


    elements in the DocBook instance. On the other hand, Flare projects are typically
    a


    collection of related topics, which may not be presented in a fixed order. Therefore,


    traditional labels, such as “Chapter 5” usually don’t make sense when you create
    HTML


    for import.'
