    chapter.


    Create a Flare TOC file (extension `.fltoc`). If you have chunked HTML files,
    you


    doubtless have a ToC. Flare uses a different mechanism for navigation, so you


    won’t need the HTML ToC, but you may be able to convert your HTML ToC into a


    Flare TOC (see Chapter 6).


    Create a Flare glossary file (a file with the extension `.flglo`) and glossary
    topic


    files. As with TOCs, HTML glossary files differ from Flare glossaries. However,


    you can create a Flare glossary from an HTML glossary (see Chapter 7).


    Create Flare bookmarks by adding `name` attributes to source anchors. See


    Section 5.5, “Adding bookmarks”.


    Add `class` attributes to tables and other elements you plan to style with CSS.
    This


    will help avoid conflicts with Flare CSS. See Section 5.1, “Avoiding class


    conflict”


    Remove links to CSS and JavaScript files. See Section 5.4, “Removing links to


    resources”


    Create a directory, with optional subdirectories, and place all of the topic files
    you


    want to import in that directory.


    Put Flare XML files such as TOC files in a separate directory.


    Remove any HTML files you do not want to import, including the original HTML


    glossary file (unless you intend to use it for print output) and the original
    HTML


    ToC file.


