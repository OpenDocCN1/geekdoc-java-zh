- img_proc: true
  md: 'parent of derived projects.


    **Prototype Project: ** A project developed to be a model for other projects.
    The project


    described in Chapter 12 is a good example of a prototype project. The source project


    created in this chapter closely resembles a prototype project, and if you created
    a


    prototype project, you can use it as a starting point for a source project. The
    principal


    difference between these two project types is that a source project is designed
    with a


    view to reduced document maintenance and a prototype project with a view to easy


    programmatic manipulation.


    **Template Project: ** A collection of files used as a template for derived projects.
    To


    create a template project, import all of the files in the source project into
    an empty


    project and save that project. You then use that project as a template to create
    new


    projects. Using a template that has linked files lets you maintain common files
    in a single


    location, namely the source project. Projects created from templates are termed
    derived


    projects.


    **Derived Project: ** A project created from a template project. You create and
    use


    derived projects to generate output. Note that linked content in a derived project
    is


    managed from the source project and reimported using the Project Import Editor
    or auto-


    sync.


    **Linked File: ** A file in a derived project that links to a file in the source
    project. A


    linked file only changes when the source file changes and the linked file is reimported;


    you never change linked files from within the derived project. Linked files can
    be


    reimported using the Project Import Editor or auto-sync.


    **Stub File: ** An incomplete file in the source project that can be used as a
    starter file in a


    derived project. An example is a Flare TOC file that contains a cover page and
    a table


    of contents page, but nothing else. Stub files are linked to ensure that each
    time you


    create a new project, you get the most up-to-date file. However, once you have
    created a


    new project, you should unlink all stub files and maintain them in the derived
    project,


    not the source project.


    **Unlinked File: ** A file that has been imported into a derived project but is
    no longer


    linked to the source project. You should unlink stub files and any files that
    you do not


    need in the derived project. Doing this is described in Section 15.1.1, “Removing


    links”.


    **Excluded File: ** A file that exists in the source project but has not been
    imported into a


    derived project (or has been unlinked). For example, if the glossary file in the
    source


    project is not appropriate for a particular derived project, you should exclude
    it.


    Excluding files is especially important if you plan to link existing projects
    to a source


    project. Files that have been excluded will never be imported into a derived project'
