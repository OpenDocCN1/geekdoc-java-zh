  md: '***15.3. Understanding imported projects***


    This section looks at how derived projects change after the Project Linking wizard


    completes. It also looks ahead to Section 16.1, “Preparation” As we have seen,
    linked


    files are identical in the source and derived projects. Here are the main differences


    between a derived project and a project that does not use global project linking:


    The `.flprj` file in a derived project contains internal, Flare-specific attributes
    and


    elements that do not appear in a project that does not use linked files.


    A derived project has an import file (`.flimpfl`) in the `Projects\\Imports`


    directory.


    Because the changes in the `.flprj` file are internal to Flare, the important
    file for our


    purposes is the `.flimpfl` file. Example 15.1 contains a typical example.


    **Example 15.1 – A derived project **`**.flimpfl**`** file**


    `<?xml version="1.0"?>`


    `<CatapultProject`


    ` Version="1"`


    ` ...`


    ` IncludePattern="\*.\*"`


    ` AutoExcludeNonTaggedFiles="false"`


    ` IncludeLinkedFiles="false"`


    ` DeleteStale="false"`


    ` DeleteUnreferenced="false"`


    ` AutoSync="true"`


    ` ConditionTagExpression=""`


    ` LastImport="2017-01-09T14:22:25.2579337-05:00">`


    ` <Files>`


    ` <Url`


    ` Source="file:///C:/path/to/source/project.flprj"`


    ` AbsoluteSource="file:///C:/path/to/source/project.flprj" />`


    ` </Files>`


    ` <ExcludedFiles>`


    ` <Url`


    ` Source="../VariableSets/General.flvar"`


    ` AbsoluteSource="file:///C:/path/to/source/Project/VariableSets/G`


    ` ...`


    ` </ExcludedFiles>`


    ` <CollectedSourceFiles>`


    ` <Url`


    ` Source="../../../source/Content/copyright.htm"`


    ` AbsoluteSource="file:///C:/path/to/source/Content/copyright.htm"`


    ` ...`


    ` </CollectedSourceFiles>`


    ` <SkippedSourceFiles />`


    ` <GeneratedFiles>`


    ` <Url`


    ` Source="../../Content/copyright.htm"`


    ` TimeStamp="1/13/2017 11:27:17 AM" />`


    ` ...`'
  merge: -1
