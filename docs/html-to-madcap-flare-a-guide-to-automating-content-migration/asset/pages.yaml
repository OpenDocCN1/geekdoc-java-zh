  md: '**Chapter 1. Flare and HTML**


    If you are familiar with HTML, you might think unprocessed Flare *topic* files
    – let’s call


    them source files – are standard *XHTML*. However, although Flare *output* is
    standard


    XHTML, Flare source files may include proprietary tags that will not validate
    as


    XHTML. Flare source files differ from standard XHTML in the following four respects:


    They require an XML declaration.


    They may contain proprietary tags and attributes.


    They do not require a `<title>` tag.


    The `<a>` tag uses the `name` attribute instead of the `id` attribute.


    These differences all have an impact when you import HTML into Flare. If you adjust


    your HTML files to account for them, you can significantly reduce the time it
    takes to


    migrate files, and you may be able to automate some processes.


    While Flare source files are not necessarily standard XHTML files, the good news
    is


    that you can immediately import, with no modification, any valid XHTML file that
    has


    an XML declaration.


    You can import HTML or XHTML files into Flare in three ways:


    Integrate a single HTML file into an existing project


    Link a group of files that will be maintained outside Flare (*auto-sync*)


    Permanently convert existing documentation to Flare format


    Importing a single HTML file into an existing project is usually trivial. If you
    import


    through the UI, Flare validates your file and adds an XML declaration if the file
    doesn’t


    already have one. If necessary, Flare converts HTML to XHTML.


    The last two cases are a bit more interesting and complex.


    The *auto-sync* capability allows you to link a group of files into a Flare project,
    but


    maintain those files outside of Flare. Suppose, for example, that you use *Doxygen*
    (a


    documentation generating tool capable of creating HTML output) to create API


    documentation from source code. Auto-sync lets you import the Doxygen files into
    Flare


    by linking to the original files, which lets Doxygen keep your documentation up
    to date.


    Whenever you initiate a documentation build, Flare reimports the linked files.
    This


    means that a Flare build will always use the latest files. Linked files should
    not be


    edited within Flare – any changes will be overwritten when you regenerate the


    documentation.


    Auto-syncing makes sense when your documentation set includes external content.
    For'
  merge: -1
  pgno: 15
- img_proc: true
  md: 'example, you could integrate external API documentation into a reference manual
    that


    also contains content created manually by technical writers.


    **Note**


    You can also link to Flare files found in other Flare projects and auto-sync them
    in


    exactly the same way you auto-sync files maintained outside of Flare.


    If you intend to migrate files from another documentation framework into Flare
    and


    maintain those files in Flare, linking to the original files doesn’t make sense.
    If Flare is


    your primary documentation tool and you are permanently importing files, you will
    want


    to maintain the imported files within Flare. This is the most common use case
    for Flare.


    **Note about document conversion**


    You can import document types other than HTML. But no matter what file formats
    or tools you


    use, you may need to edit files manually.


    You can’t turn apples into oranges. Converting between conceptually different
    formats can be


    problematic. For example, if you try to import an unstructured Word document into
    Flare and


    create DITA output, you’re probably going to have to make numerous manual adjustments
    to


    the imported file.


    Poorly structured content poses other difficulties. For example, you may be able
    to import a


    series of short, standalone HTML files seamlessly, since Flare is designed to
    support that kind


    of content, but, if you try to import a large single-page document, you will probably
    need to


    edit it. No import tool will magically transform poorly structured content.


    ***1.1. Dynamic documentation***


    Flare provides a variety of features to help you create dynamic or automated


    documentation. Some of the features that make automation possible are:


    **Direct import of XHTML files: ** This topic has already been touched upon, but
    it


    bears repeating. Valid XHTML files with an XML declaration do not need to be


    processed or manually imported. This is indispensable for auto-synced files,


    because you can maintain content outside Flare and Flare will copy it directly
    into


    your project at build time.


    **Linked files: ** By linking files you can maximize file reuse, and you can


    synchronize changes between source and linked files, which reduces maintenance.


    The synchronization capability automatically propagates changes in one file to
    one


    or more other files.


    **Open XML architecture: ** You can use a program to view, edit, and create the


    XML objects used by Flare. This is invaluable when converting existing


    documentation to Flare documentation, but it also means that you can create XML'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'objects outside the Flare interface.


    **Command-line builds: ** Flare provides a command-line tool, so you don’t need
    to


    generate output using the UI. And you can use the Windows Task Scheduler to


    trigger a documentation build automatically.


    **Flare Proprietary XML Formats**


    MadCap will doubtless continue to support direct copying of valid XHTML content


    files into a Flare project, because this is a cornerstone of Flare’s auto-sync
    feature.


    However, the situation with Flare proprietary XML files is not as clear.


    **Be aware that MadCap does not document the structure of their proprietary XML**


    **files.** The Flare documentation identifies the location of the XML files that
    are exposed


    through the UI, but it does not document their structure, and there are no references
    to


    schema files that might definitively describe them. It’s reasonable to assume
    that this


    silence is deliberate and that MadCap reserves the right to change the structure
    of these


    files as needed to support new features in future releases.


    Wholesale changes are unlikely, but improvements to Flare in the past have required


    schema changes. For example, the improvements to glossaries in Flare 12 changed
    the


    attributes for glossary entries. You should be prepared for possible changes and
    look for


    them whenever you upgrade to a new version of Flare.'
