    that can save you hours of effort. For example, if you are working with HTML exported


    from Google docs, the `gdoc` option provides an easy way to clean up the markup.


    **Warning**


    Be careful with the `force-output` option. If you turn it on and run tidy against
    a file that


    includes proprietary Flare markup, you may remove that markup.


