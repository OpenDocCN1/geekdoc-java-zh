    ***E.6. JavaScript parameter***


    You can include a reference to an external JavaScript file in the `<head>` tag
    of your


    HTML files by setting the **html.script** parameter to point to your JavaScript
    file.


    You can also include scripts using master pages (see Section 10.2.3, “Master pages”)
    or


    in the `<body>` of an HTML page.


    ***E.7. Tables***


    The DocBook style sheets have several parameters related to tables and CSS. However,


