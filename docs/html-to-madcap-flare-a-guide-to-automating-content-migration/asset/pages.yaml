  md: '**Chapter 8. Importing HTML Files**


    Once you have cleaned up your HTML files, you are ready to import them into Flare.
    At


    this point the HTML files are still standard HTML – except for `MadCap:glossaryTerm`


    tags – and you should have completed all of the following steps that apply to
    your


    project:


    Created a Flare TOC file (`.fltoc`). See Chapter 6.


    Created a Flare glossary file (`.flglo`) and Flare glossary topic files. See


    Chapter 7.


    Created Flare bookmarks and added `name` attributes to source anchors. See


    Section 5.5, “Adding bookmarks”.


    Removed links to CSS and JavaScript files. See Chapter 4.


    Moved the topic files you need to import into one directory and optional


    subdirectories.


    Put any Flare XML files (such as TOC files) in a separate directory.


    Removed the original HTML glossary file, unless you intend to use it for print


    output.


    Removed the original HTML ToC file.


    Removed any other HTML files that you do not want to import (index files, for


    example).


    The first time you import files into Flare, I suggest you use the import wizard.
    Using the


    import wizard makes it easy to import a single project into Flare, and it is also
    an


    excellent way to begin using Flare.


    Other than deciding which files to import, you only have one other decision to
    make


    when importing HTML: do you want to link the imported files to the original files?


    Linking files, which makes it possible for you to use Flare’s *auto-sync* capability,
    makes


    sense for projects where external content gets updated regularly and must be re-


    imported into Flare. One example is API documentation, where you generate content


    from comments in source code that is maintained outside of Flare. When the source
    code


    gets updated, you need to re-import the updated files. If you enable auto-sync,
    Flare will


    re-import linked files automatically when it builds a target.


    However, if you plan to use Flare as your primary means of creating documentation
    after


    you import your content, then you should permanently import your files and not
    link to


    them. When you permanently import your files, you can use Flare’s tools to maintain


    your files. In addition, Flare uses proprietary tags for many of its features,
    including


    everything from toggle controls to variables. Maintaining files outside of Flare
    makes it


    more difficult for you to take advantage of features that use proprietary tags.
    This


    chapter describes both types of import.'
  merge: -1
