    ***3.5. unix2dos***


    While working on Microsoft Windows, you may have opened a text file sent by a
    Mac


    user and found the entire contents on one line with no line breaks. You may see
    the same


    thing with text files created on Linux. This happens because Windows uses a different


    line ending from UNIX-like systems such as Linux and Mac OS X.


    The same thing can happen to the contents of HTML verbatim tags such as `<pre>`.


    Fortunately, you don’t need to fix these issues manually; the **unix2dos** command
    converts


    UNIX line endings to DOS format, fixing both problems. If you have Cygwin installed


    on your system, you can find the **unix2dos** command, and its inverse, **dos2unix**,
    under


    the Util category as described earlier.


    **Note**


    This tool is also available for UNIX-like operating systems. The ability to adjust
    line


    endings is particularly useful if you have API documentation that was created
    on an


    operating system other than Windows. If you import content from another operating


    system, you can make it fully Flare-compliant before it leaves its native operating


