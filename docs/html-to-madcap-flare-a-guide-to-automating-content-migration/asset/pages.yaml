  md: '**Appendix C. Glossary Scripts for Flare Version 11**


    Flare 12 introduced changes to the structure of a glossary that affect three of
    the four


    scripts given in Chapter 7. This appendix describes the changes required to use
    these


    scripts with Flare 11. The following scripts require changes:


    Example 7.5, “Script to create a Flare glossary”


    Example 7.7, “Script to create print glossary”


    Example 7.8, “Script to create `<MadCap:glossaryTerm>` tags”


    In Flare 12, MadCap added several attributes to the `<GlossaryEntry>` tag that
    are not


    available in earlier Flare versions. Of these new attributes, the following four
    are


    relevant to these scripts:


    `glossTerm`: Uniquely identifies a glossary term. In version 11, Flare uses the
    text


    node of `<Term>` tags to identify a glossary entry.


    `SortAs`: Sort an entry using the value of this attribute rather than the value
    of the


    term.


    `Stem`: Indicates whether to use stemming when identifying glossary entries.


    `IgnoreCase`: Indicates whether to ignore the case of a glossary entry.


    The `Stem` and `IgnoreCase` attributes play only a minor role in the version 12
    scripts;


    these attributes are simply set to `true` or `false` and can be omitted from a
    script for


    version 11. On the other hand, the absence of the `glossTerm` attribute in version
    11


    affects both how you create glossary entries and how you reference terms using
    the


    `<MadCap:glossaryTerm>` tag. Because there is no `SortAs` attribute in Flare 11,


    ordering glossary entries for print output is simpler.


    ***C.1. Creating a Flare Glossary***


    This script creates a Flare glossary from an HTML glossary file.^(\[19\]) It takes
    the name of


    the HTML file as a parameter. This script replaces Example 7.5. The major difference


    between this script and the Flare 12 version is the absence of the `glossTerm`
    attribute.


    **Example C.1 – Script to create a Flare glossary (version 11)**


    `<?php`


    `/\*\*`


    `\* Create a Flare glossary (.flglo) file of`


    `\* links to glossary topics from an HTML`


    `\* <dl>.`


    `\* © 2017 Moneris Solutions Corporation, CC-BY-NC -SA 4.0`


    `\* @param string $argv\[1\] The HTML glossary file`


    `\*/`


    `//get glossary file`


    `$source = $argv\[1\];`'
