  md: '**Preface**


    Technical documentation often contains a mix of static documentation – content
    created


    by technical writers – and dynamic content, which is generated from external elements


    such as files extracted from databases or spreadsheets and, perhaps, source-code


    comments and function signatures. When looking for a documentation tool, you want
    one


    that handles both static and dynamic elements. You also want it to produce a variety
    of


    different outputs, and, for ease of maintenance, it should be a single-sourcing
    tool. You


    want a sophisticated tool but one that is intuitive and easy to use. You want
    to have your


    cake and eat it too.


    MadCap Flare is a single-source, open standards, XML-based documentation tool
    that


    runs on Microsoft Windows. The *Flare Key Features Guide* (published by MadCap


    software) describes Flare as “easy to integrate with other XML or XHTML


    applications” and claims that, because of its open XML architecture, “Flare projects
    are


    completely open, transparent, and accessible.”


    Do these claims stand up? Can you have your cake and eat it too? This book attempts
    to


    answer these questions.


    **Note**


    All references to MadCap Flare in this book are to version 12. However, all of
    the


    scripts used in this book will also work in Flare versions 11, 2016 r2 and 2017.
    The


    scripts in Chapter 7, Glossaries, only work with version 12 and higher, but you
    can find


    equivalent scripts for version 11 in Appendix C, Glossary Scripts for Flare Version
    11.


    Where appropriate, the differences between versions are noted.


    ***1\. Who needs this book?***


    This book focuses primarily on importing HTML into MadCap Flare. Flare can directly


    import files in a variety of formats, including: Microsoft Word, FrameMaker, *Darwin*


    *Information Typing Architecture* (DITA), and HTML. However, because Flare content


    files are HTML files, you will likely have better results if you first convert
    your files to


    HTML and then import them.


    Although the primary focus is on importing HTML into Flare, this book can also
    help


    you determine whether Flare is the appropriate tool for you. Most books about
    Flare


    focus exclusively on the user interface (UI) and say very little about the underlying


    HTML, CSS, (*Cascading Style Sheets*) or XML structures – one notable exception
    is


    *MadCap Flare for Programmers*\[Tregner, 2015\]. Understanding the UI can help
    you


    evaluate Flare, but you really need insight into the underlying structure to determine
    if it


    is the tool for you. Depending upon the nature of your work force and how you
    plan to'
  merge: -1
