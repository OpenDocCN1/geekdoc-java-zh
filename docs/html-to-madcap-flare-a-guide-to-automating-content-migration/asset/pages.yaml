    ` <body>`


    ` <script type="text/javascript">`


    ` onload = function(){alert("Hello world!")}`


    ` </script>`


    ` </body>`


    `</html>`


    When you include this snippet in a topic, the script will execute when the page
    loads.


    **10.1.2. Variables**


    If you have worked with XML previously, you may be familiar with entities and
    with


    named entities in particular. Named entities typically stand in for characters
    that are not


    readily reproduced from the keyboard. For example, you might use an entity to
    represent


    the Euro currency character (€). However, you can also use entities as macros
    to manage


    text that you know will change or that is repeated throughout a document.


    For example, if you repeatedly refer to documents that reside on the same website,
    you


    can define an entity called `baseURL`, as shown in Example 10.2:


    **Example 10.2 – Entity definition**


    `<!DOCTYPE html`


    `\[`


    `<!ENTITY baseURL "http://www.example.com/productname/documentation/">`


    `\]>`


    You reference this definition by inserting `&baseURL;`, instead of typing the
    full URL.


    When your document is processed, entities are replaced by their defined value.


    Flare supports the XML standard entity set (&quot;, &amp;, &apos;, &lt;, and &gt;).


    However, it does not fully support locally defined entities. You can define named


    entities in the DOCTYPE of an HTML file. However, Flare does not let you use those


    entities in the body of a file. This means that you must resolve locally defined
    entities on


    import or convert them into Flare variables, which serve the same purpose.


    **10.1.2.1. Flare variables**


    Suppose that you are writing a manual for a product that doesn’t yet have a fixed
    name.


    You can use a variable to stand in for the product name, and once a name is determined,


    you simply update the documentation to the official name by changing one line
    in one


    file.


    When you create a variable within Flare, you are creating an entry in a variable
    file (an


    XML file with the extension `.flvar`) found in the `Project\\Variables` directory.'
