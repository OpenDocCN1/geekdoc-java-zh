    it was


    run. When you transfer files to a Flare project, copy this file to the `Project\\TOCs`


    directory (see Section 9.1, “Updating TOC files”).


    **Warning**


    If any of your TOC entries point at anchors that use the `id` attribute rather
    than the `name`


    attribute, they will not work. To remedy this, see Section 5.5, “Adding bookmarks”.


    ***6.3. TOCs and System Variables in Flare 2017***


    Of the features added in Flare 2017, “Synchronization of Topic Title and TOC Entries”


    has the most significance for this book. This feature allows you to set the Label
    for a


    TOC entry using a system variable. This automatically synchronizes a topic’s heading
    or


    title with its description in the TOC editor. Prior to Flare 2017, if you changed
    a topic’s


    heading or title, you had to change the Label manually in the TOC editor if you
    wanted


    the two to match.


    **6.3.1. Setting a TOC entry to a system variable**


    The topic description displayed in the Flare TOC editor is determined by the value
    of


    the Label field in that topic’s property window. To set the value, open the TOC
