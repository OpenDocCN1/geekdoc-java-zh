  md: '**Page-specific styles**


    Given the recommendation to remove links to style sheets from the `<head>` of
    each page, you


    may be wondering how to override styles in a specific HTML page. The options are:


    Associate a local style sheet with a topic file after import.


    Override styles in a `<style>` block inside the `<head>` element of a topic page.


    Use the existing project or target master style sheet, but create new classes
    to override


    existing styles and then use those classes in your HTML where required.


    ***4.1. Flare-specific styles***


    Flare *skin*s, controls, navigation links, proxies, and other objects have Flare-specific


    style sheets that control their appearance and positioning. When Flare generates
    output,


    it automatically includes links to these style sheets in the `<head>` element.


    For example, suppose you include your own style sheet, `myflare.css`, as a project-


    level master style sheet. If you look at the source code of the HTML output you
    will see


    that Flare adds several style sheets to the `<head>` of each page (see Example
    4.2).


    **Example 4.2 – Flare-generated style sheet links**


    `<head>`


    ` ...`


    ` <link href="../../Skins/Default/Stylesheets/Topic.css"`


    ` rel="stylesheet" data-mc-generated="True" />`


    ` <link href="../../Skins/Default/Stylesheets/Components/Styles.css"`


    ` rel="stylesheet" data-mc-generated="True" />`


    ` <link href="../Resources/StyleSheets/myflare.css" rel="stylesheet" /`


    `</head>`


    The `data-mc-generated` attribute indicates a Flare-generated style sheet link.
    In


    Example 4.2, notice that the links with this attribute appear before `myflare.css`.
    This


    means your styles take precedence.


    However, your styles may still conflict with built-in Flare styles. Many Flare
    controls,


    such as proxies, use tables to organize content; if you directly style tables
    in your CSS


    file, there may be undesirable side effects. To avoid conflict, assign a `class`
    attribute to


    your tables and style only that class. Instead of creating a selector such as
    `table { … }`,


    create a selector specifically for your class, `table.mytable { … }`. You can
    find a


    script to create a table `class` attribute in Section 5.1, “Avoiding class conflict”.


