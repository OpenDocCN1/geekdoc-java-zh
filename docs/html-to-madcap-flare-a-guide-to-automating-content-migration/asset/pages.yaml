    if you are importing files piecemeal. Suppose you are importing a book, chapter
    by


    chapter. If you create a TOC for your chapter prior to import, you can add each
    new


    chapter TOC to an existing book TOC.


    ***6.1. The HTML ToC***


    With smaller projects, the default Flare TOC can be useful. If you are familiar
    with the


    document, you can quickly rearrange files using the *TOC Editor*, which lets you
    pick up


    files and drop them where you would like them to appear. However, when you are


    dealing with a large project with many files, manually dragging and dropping files
    to


    create a TOC is tedious and error prone. In addition, you will likely want to
    change the


    `Title` attribute associated with each ToC entry. Automating the creation of a
    Flare TOC


    file can improve accuracy and save time.


    If the HTML files you want to import already have a table of contents, you can
    use that


    ToC to automate creation of a Flare TOC. Example 6.2 contains an HTML version
    of the


    Flare TOC shown in Example 6.1.


    **Example 6.2 – HTML <ul> table of contents**


    `<ul class="toc">`


    ` <li><a href="index.html">Page One</a></li>`


    ` <li><a href="second.html">Page Two</a></li>`


    ` <li><a href="third.html">Page Three</a>`


    ` <ul>`


    ` <li><a href="table1.html">Table One</a></li>`


    ` <li><a href="table2.html">Table Two</a></li>`


    ` </ul>`


    ` </li>`


    ` <li><a href="fourth.html">Page Four</a></li>`


    `</ul>`


    A `<ul>` tag wraps the entire ToC, and each `<li>` tag is a ToC entry. Nested
    `<ul>` tags are


    used for nested ToC entries. The similarities between Example 6.2 and Example
    6.1


    make it straightforward to create a script that converts an HTML ToC to a Flare
    TOC.


    Ordered lists (`<ol>`) are also often used for HTML ToCs. The International Digital


