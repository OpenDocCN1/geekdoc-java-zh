    ***E.8. Styling DocBook admonitions***


    If you use DocBook admonitions – note, warning, etc. – you need to consider two


    parameters:


    **admon.graphics: ** Determines whether to include a graphic with admonitions.
    By


    default, this parameter is set to `0`, which tells the style sheets to wrap the


    admonition in a `<div>` tag. If you set the value to `1`, the style sheets create
    an


    HTML table to contain the graphic and the admonition. Non-graphic admonitions


    are easier to maintain in Flare, so setting **admon.graphics** to `0` makes sense.
    If you


    want to use graphics with admonitions, you can set a background graphic using


    CSS.


    **admon.textlabel: ** Determines whether to include a text label with admonitions.
    By


    default, this parameter is set to `1`, which tells the style sheets to include
    a label.


    Setting this parameter to `0` simplifies maintaining admonitions in Flare.


    Flare has its own admonition styles, so you may want to convert DocBook-generated


    admonitions to Flare admonitions. However, be aware that, unlike DocBook, Flare


    admonitions can contain only one `<p>` tag.


    ***E.9. Glossaries and indexes***


    The scripts in Chapter 7 can process any glossary created by the DocBook HTML
    style


    sheets. However, the following two parameters can simplify creating and maintaining


    your Flare glossary:


    **glossterm.auto.link: ** Determines whether to link glossary references (the


    DocBook `<glossterm>` tag) to definitions. By default, this parameter is set to
    `0`,


    which turns off links. In this case, the style sheets convert `<glossterm>` tags
    to


    HTML `<em class="glossterm">` tags. This makes it easy to convert them into


    Flare `<MadCap:glossaryTerm>` tags, which you can do with a modification to the


