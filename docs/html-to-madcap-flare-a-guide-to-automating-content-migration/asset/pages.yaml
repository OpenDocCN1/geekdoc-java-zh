    it. Using conditions is described in Section 10.2.1, “Conditional text”. Other
    glossary-


    related issues are discussed in Section 9.2, “Glossary files”.


    Any time that you add or change a glossary entry, you should run this script and
    update


    the `pdf\_glossary.html` file; you do not need to manually change it. For a sample


    output file see Appendix D, Sample Glossary Output File for Print.


    ***7.5. Creating ***`***<MadCap:glossaryTerm>***`*** tags***


    When you link to a glossary in Flare, you can choose to have Flare look for glossary


    terms in your source and generate glossary references for either the first occurrence
    of a


    term or all occurrences. Or you can choose to insert glossary links manually and
    tell


    Flare to use only those links.


    In standard HTML, you reference a glossary entry by creating a hyperlink to the
    entry.


    When Flare imports these references, they no longer point to valid glossary entries.
    You


    need to convert them to Flare glossary references, which look like the following:


    `<MadCap:glossaryTerm glossTerm="NewGlossary.Term27">Term</MadCap:gloss`


    The script in Example 7.8 creates Flare glossary references from HTML links. It
    takes


    two parameters: an HTML glossary file, such as the one in Example 7.2, and a Flare


    glossary file (`.flglo`), such as the one in Example 7.1. The script iterates
    over all the


    HTML files in the current working directory looking for links to anchors that
    refer to


    terms in the HTML glossary file, and it converts those links into Flare glossary


    references. It updates the files in place, changing matching hyperlinks to


    `<MadCap:glossaryTerm>` tags.


    The script looks for links that reference the HTML glossary file (named in the
    first


    parameter), and when it finds one, it takes the text of that link and looks for
    that term in


    the Flare glossary file. If the script finds a match, it uses the `glossTerm`
    attribute to


    create a Flare glossary reference. The script passes through unchanged any link
    that does


    not have a match in both the HTML glossary file and the Flare glossary file.


    **Note**'
