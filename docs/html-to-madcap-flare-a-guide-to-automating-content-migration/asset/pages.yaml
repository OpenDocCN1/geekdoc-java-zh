  md: '**Appendix A. Using Apache Ant with Flare**


    When you have a number of scripts that manipulate topic files or perform maintenance


    tasks, keeping track of their names and command-line options can be a challenge.


    Apache Ant, an open-source command-line tool written in Java, can make it easier
    to


    manage your scripts and automate conversion and other scripted tasks.


    Ant is typically used to build Java applications, but it can serve equally well
    to manage


    the scripts described in this book. To use Ant, you create a build file that defines
    a set of


    targets. Each target captures the commands and options you want to execute for
    a


    particular task. Then, you execute the **ant** command, naming the target you
    want to


    execute.


    ***A.1. Installing Ant***


    Download the current version of Ant from


    `http://ant.apache.org/bindownload.cgi`. In an appropriate location, unzip the


    downloaded file. This will create a directory named after the version, for example:


    `apache-ant-1.9.8`. The **ant** command is in the `bin` directory under this top-level


    directory. Ensure that the `bin` directory is in your path.


    ***A.2. Using Ant***


    Since Ant is typically used to build Java applications, many of its capabilities
    – what


    Ant calls tasks – are geared towards compiling and packaging Java applications.
    You


    can safely ignore these Java-related tasks. The tasks that you’ll find most useful
    are


    **exec**, **echo**, **property**, **copy** and **delete**.


    This appendix is not an Ant tutorial. However, it provides a working Ant build
    file that


    you can use to execute the scripts presented in this book or ones that you have


    developed. For comprehensive documentation see the Apache Ant Manual.


    ***A.3. Build files***


    Ant can’t do anything without a build file, which defines what you want Ant to
    do. This


    XML file contains a series of targets; these are the actions you want to perform.
    By


    default Ant looks for a build file named `build.xml` in the directory where the
    **ant**


    command is run. If you use the default build file, you don’t need to specify the
    location


    of the build file when you execute the **ant** command.


    After targets, the most important elements of build files are properties, which
    are


    name/value pairs equivalent to variables. Because many properties are project-'
