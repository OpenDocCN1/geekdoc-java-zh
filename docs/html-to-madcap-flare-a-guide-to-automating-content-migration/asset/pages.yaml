  md: '**Chapter 6. Tables of Contents**


    If you have chunked HTML files, then you doubtless have a table of contents (ToC)
    for


    navigating those files. Flare uses a different mechanism for navigation, so there’s
    no


    reason to import the ToC into Flare. However, if your ToC uses an HTML list (`<ul>`,


    `<ol>` or `<dl>`), you may be able to convert that HTML list to a *Flare TOC*.
    Depending


    upon how many files you are importing, this can save you considerable effort.


    Flare projects are usually different from books; They are a collection of topic
    files with


    no overarching structure. You are free to determine what elements will appear,
    in what


    order, and in what relation to one another. You do this using a Flare table of
    contents


    (TOC) file.


    **Note**


    I use the acronym ToC to refer to a generic table of contents and the all uppercase


    acronym TOC to refer to a Flare table of contents file or the Flare table of contents


    editor.


    A Flare TOC is an XML file (extension `.fltoc`) found in the `Project\\TOCs` directory.


    This file maps the relationships between different topics – it functions like
    a *DITA map*


    file. Example 6.1 contains a sample Flare TOC file with nested entries.


    The root node of a Flare TOC, `<CatapultToc>`, contains any number of `<TocEntry>`


    tags, which can contain nested `<TocEntry>` tags. The `Link` attribute of a `<TocEntry>`


    tag can point to an HTML page, an anchor on a page, or to another TOC file. In
    this


    example, the `BreakType` attribute is set to `chapter`, which tells Flare to force
    a page


    break before this page for print output.


    **Example 6.1 – Flare TOC with nested entries**


    `<?xml version="1.0"?>`


    `<CatapultToc Version="1">`


    ` <TocEntry Title="Page One" Link="/Content/one.htm" BreakType="chapte`


    ` <TocEntry Title="Page Two" Link="/Content/second.htm" BreakType="cha`


    ` <TocEntry Title="Page Three" Link="/Content/third.htm" BreakType="ch`


    ` <TocEntry Title="Table One" Link="/Content/table1.htm"/>`


    ` <TocEntry Title="Table Two" Link="/Content/table2.htm"/>`


    ` </TocEntry>`


    ` <TocEntry Title="Page Four" Link="/Content/fourth.htm" BreakType="ch`


    `</CatapultToc>`


    **Note**


    Example 6.1 does not show all the possible attributes of a Flare TOC file. As
    with other


    Flare proprietary XML files, the Flare documentation makes only passing references
    to'
