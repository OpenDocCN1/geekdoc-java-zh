    ***11.6. Automating the build process***


    If you create files dynamically or use scripts to preprocess them, you need to
    run these


    scripts before building a target. Fortunately, you can create a batch file to
    run your


    scripts and execute **madbuild.exe**. The **madbuild.exe** command, which you
    can find in


    the `Flare.app` directory, takes the `\-project` option to specify the project
    you want to


    build. The optional switch `\-target` `*target\_name*` tells Flare to build one
    target rather


    than all targets.


    Earlier versions of this command have a `\-log` option which, when set to `true`,


    generates log files. After Flare 10, this option is no longer available; Flare


    automatically creates a log file. The log file has the extension `.mclog` and,
    if you have


    not changed the default, you can find it in the `Output` directory for the target.


    You can use **madbuild.exe** in a script to automate a documentation build. For
    example,


    you can create a script that updates the repository, XIncludes files, runs scripts
    such as


    those described in this chapter, and then runs **madbuild.exe**. You can use the
    Windows


    Task Scheduler to schedule unattended builds, for example, when you need to create


    nightly builds or when your builds take a long time.^(\[11\])


    ***11.7. Pre/Post Build Processes (Flare 2016 r2 and later)***


    As of Flare release 2016 r2, you can trigger the execution of scripts prior to
    or


    following a documentation build. MadCap calls this capability “Pre/Post Build


    Processes.” Pre-build commands are ideal for use with some of the scripts provided
    in


    this chapter.


    To create a command, open the Target Editor for the desired output type and click
    the


    Build Events tab. In the Pre-Build Event Command window enter the commands you


    want to execute. Figure 11.1 shows the commands to execute the script in Example
    7.7,


    “Script to create print glossary.”'
