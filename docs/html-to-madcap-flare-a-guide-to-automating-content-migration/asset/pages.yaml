  md: 'You can download the latest release of **pandoc** from GitHub.


    **3.2.1. Converting to HTML**


    The following command converts the Markdown file `in.md` to HTML:


    `pandoc -s -f markdown -t html in.md -o out.html`


    `\-s`


    Create a stand-alone document


    `\-f markdown`


    Input format is Markdown


    `\-t html`


    Output format is HTML


    `\-o out.html`


    Output file name is `out.html`


    This command creates a stand-alone XHTML file using the default template. If you
    do


    not specify the `\-s` option, **pandoc** outputs a *fragment* – a file without
    the `<html>` root


    element. This can be useful if you want to *XInclude* content inside another file.


    The `\-t` option defines the destination format and the `\-f` option defines the
    source format.


    The input file, in this case `in.md`, does not require an option. Specify an output
    file


    using the `\-o` option; if you do not use this option, output is displayed in
    your terminal


    window (*stdout*).


    **Note**


    Using a build tool such as Apache Ant can make it much simpler to use pandoc.
    For an


    example of doing this see Appendix A.


    The command `pandoc -h` displays a list of all the options, including a list of
    input and


    output formats. For a complete description of all the options available, see the
    *Pandoc*


    *User’s Guide.*


    **3.2.1.1. The default HTML template**


    To view the default HTML template that **pandoc** uses, run the following command:'
  merge: -1
