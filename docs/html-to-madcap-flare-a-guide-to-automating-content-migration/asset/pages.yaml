  md: '***5.2. The HTML ***`***<title>***`*** tag***


    In XHTML, each page must have a `<title>` element in the `<head>`. The `<title>`
    is


    used in the following ways:


    Search engines give extra weight to the text


    Browsers use the text when creating a bookmark


    Browsers also use the text in tabs


    Flare does not require the `<title>` element on HTML files being imported. If
    this


    element is missing from your HTML files, Flare creates a `<title>` tag using text
    from


    the top-level heading when it generates HTML output. However, if your HTML files


    have a `<title>` element, Flare uses the text in the following ways, affecting
    both those


    who read content created by Flare and those who create content using Flare:


    As the title for items returned by Flare’s internal search engine (affects readers)


    As the title for ToC entries displayed by the Flare TOC Editor (affects content


    creators)


    When headings and titles differ, both readers and content creators can be confused.
    For


    readers, confusion arises because Flare’s internal search capability uses the
    `<title>`


    tag in the listing of search results, but when a reader clicks on that search
    result, the


    heading on the target page is the first heading on that page. Prior to import,
    make sure


    that the text in the heading and the `<title>` tag say what you want them to say
    and that


    there is no mismatch between the two.


    **Note**


    If you are using Flare 2017, you can reduce confusion for content creators by
    using a


    system variable to keep headers and TOC entry labels in sync. For more information
    see


    Section 6.3, “TOCs and System Variables in Flare 2017”.


    For content creators, a TOC entry that differs from a heading can be equally confusing.


    There is an expectation that the title of a ToC entry be the same as the heading
    of that


    topic. (More on this in Chapter 6.) Again, it’s a good idea to compare the `<title>`
    text


    and the text in the first heading before you import your files to ensure that
    they are the


    same or, at least, consistent.


    There is a simple way to avoid any possible mismatch: remove the `<title>` from
    all


    your HTML pages prior to import and let Flare generate the `<title>` from the
    first


    heading when it creates output. The script in Example 5.2 removes the `<title>`
    tag from


    all files in the current directory.


