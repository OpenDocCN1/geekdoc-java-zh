    and you have made changes to that file. To confirm the changes, open a derived
    project


    and, from the Project Import Editor, click Reimport…. You should see something


    similar to Figure 15.3:


    **Figure 15.3 – Confirming changes to linked files**


    ![](img/778bbca9afe8715a0e53d695f3ecc4ce_156_0.png)


    In Figure 15.3 you can see that the Import column for `flare.css` is checked,
    and the


    Status column has a green background with the message `Source is Newer`. This


    indicates that the local CSS file will be overwritten by the source project version.
    No


    other files are checked, so no other files will be reimported. This is exactly
    what you


    would expect, since you have changed only this file.


    If the Status column has a red background, then the local file is newer than the
