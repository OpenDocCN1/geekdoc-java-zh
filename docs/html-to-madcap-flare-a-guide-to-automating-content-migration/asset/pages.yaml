  md: "` </GeneratedFiles>`\n\n`</CatapultProject>`\n\nThe root element of a `.flimpfl`\
    \ file (`<CatapultProject>`) has the following\n\nattributes:\n\n `IncludePattern`\
    \ – Indicates which files have been included. The value in this\n\nexample, `\\\
    *.\\*`, indicates that all files have been included.\n\n `AutoExcludeNonTaggedFiles`\
    \ – Tells Flare whether or not to exclude files that\n\nhave no condition assigned.\
    \ This attribute is used in conjunction with the\n\n`ConditionTagExpression` attribute\
    \ and applies only when\n\n`ConditionTagExpression` is not empty.\n\n `IncludeLinkedFiles`\
    \ – Tells Flare whether or not to include files that link to\n\nexternal files.\
    \ Set this to `true` to automatically include linked files. When you use a\n\n\
    linked template file to create a new project this setting is of little consequence,\n\
    \nsince you are including all files.\n\n `DeleteStale` – Tells Flare to remove\
    \ from the derived project any files that have\n\nbeen removed or renamed in the\
    \ source project. For more information see\n\nSection 17.2.1, “Changing settings\
    \ in the Project Import Editor”\n\n `DeleteUnreferenced` – For more information\
    \ see Section 17.2.1, “Changing\n\nsettings in the Project Import Editor”\n\n\
    \ `AutoSync` – Indicates whether or not auto-sync is turned on. Note that when\
    \ the\n\nvalue is `true`, you can override that value in a target file.\n\n `ConditionTagExpression`\
    \ – Tells Flare to include or exclude files based on a\n\ncondition. For example,\
    \ you could exclude all files with the condition\n\n`General.Stub` by setting\
    \ this attribute to the expression\n\n`exclude\\[General.Stub\\]`. Using conditions\
    \ to exclude or include files is\n\ndiscussed in Section 16.2.3, “Excluding files\
    \ using conditions”\n\n `LastImport` – The date and time when the last import\
    \ occurred.\n\nA `.flimpfl` file contains the following elements:\n\n `<Files>`\
    \ – Identifies the project file for the linked source project.\n\n`<Url>` – Contains\
    \ the relative and absolute locations for a file. This tag is used\n\ninside the\
    \ other elements defined here.\n\n `<ExcludedFiles>` – Identifies files that have\
    \ been removed from the derived\n\nproject by being unlinked. If you manually\
    \ reimport the source project or have\n\nauto-sync turned on, these files will\
    \ not be reimported.\n\n `<CollectedSourceFiles>` – Identifies the imported files\
    \ in the source project.\n\n `<SkippedSourceFiles>` – Identifies files that have\
    \ been skipped rather than\n\nexcluded. When you initially import a project into\
    \ a derived project, any files that\n\nyou skip on the Accept Imported Documents\
    \ screen (Figure 16.2) appear here.\n\nWhen you manually reimport the source project,\
    \ Flare skips these files. However,\n\nif auto-sync is enabled, Flare will import\
    \ these files."
