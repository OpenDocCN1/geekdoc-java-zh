    that


    you use conditions to manage files you plan to import using global project linking.


    Despite this recommendation, conditions have limited applicability when you create
    a


    derived project from a template project because you import all the files in the
    source


    directory. However, when you upgrade an existing project to become a linked project,


    conditions make much more sense.


    You use conditions with project linking in the same way you use conditions to
    include or


    exclude content when you generate output. For example, if you have topics that
    are


    appropriate only for print output, you create a `PrintOnly` condition and add
    this


    condition to relevant topics and targets. You can control which files are imported
