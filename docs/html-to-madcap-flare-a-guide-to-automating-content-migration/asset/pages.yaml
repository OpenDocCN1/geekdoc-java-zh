  md: '**Chapter 12. Scripting Creation of Projects**


    Despite what you may have learned from Harry Potter, wizards aren’t all they’re


    cracked up to be. They make it easy to perform one-time operations, but if you
    have


    many projects to import, it makes sense to create a script. Some tasks cannot
    be


    automated, but many tasks can be scripted and creating projects in this way can
    save


    time and improve accuracy.


    So far, we have seen how it is possible to:


    Create a Flare TOC from an existing HTML ToC


    Create a Flare glossary file from an HTML glossary


    Copy HTML files directly into a project


    Use your own CSS files within a Flare project


    This chapter describes the tasks you need to perform and identifies the XML files
    you


    need to change in order to create a complete Flare project. It does not provide
    sample


    scripts; any sample script would require extensive editing to meet your needs.


    If you can manipulate HTML files as described in earlier chapters, then creating
    a new


    Flare project with a script can be fairly straightforward. The first step is to
    export a


    project that you can use as a project prototype.


    ***12.1. Exporting a project***


    If you have an existing project with settings that you commonly employ, you can
    export


    this project to create a prototype. You could do this by copying selected files
    from the


    `Content` and the `Project` directories, but it is much easier to use the Flare
    interface.


    To create a prototype project from the Flare interface, choose the Export Project
    option


    found under the File menu. This opens the export project wizard.


    On the initial screen, assign a name to your prototype and choose a New Project
    Path. In


    the Export From drop-down list box, choose the Select Files option. This allows
    you to


    select any or all files or directories from the `Content` and `Project` directories.


    You also need to choose an output type from the Output: drop-down list box. The
    options


    are: Zip Files, Project Files, Project Template, and Augmented Reality Project.
    Choose


    Project Files and, if you plan to make similar prototypes from other projects,
    check the


    Save settings check box.


    You next have the option to convert variables and snippets to text. This option
    embeds


    the contents of variables and snippets in place. Use this option when your content
    files


    reference variables or snippets, but you don’t want to export the files that contain
    those'
  merge: -1
  pgno: 126
- img_proc: true
  md: 'variables or snippets.


    Advancing to the next screen lets you choose from the files in the `Content` directory.


    You should see something like the screen in Figure 12.1:


    **Figure 12.1 – Export content files**


    ![](img/778bbca9afe8715a0e53d695f3ecc4ce_127_0.png)


    Expand the directories to select which files you want in your prototype and which
    you


    want to exclude. Files you may want to save include: CSS files, page layouts,
    master


    pages, snippets, and image files. On the other hand, most topic files will be
    specific to a


    particular project, so you will likely skip most of them.


    Clicking Next advances to the screen used for selecting files from the `Project`


    directory. You will doubtless not want to keep the TOC files in the `Project\\TOCs`


    directory, since they relate to specific content files. Otherwise, select or discard
    files as


    you see fit. When in doubt, select a file – it’s easy to remove files from your
    prototype.


    When you’re finished, click the Finish button.


    ***12.2. Reviewing the exported project***


    After creating your prototype project, you should review each file and decide
    whether it


    should be retained as is, modified, or removed. You may find that you need only


    portions of some file. For example, if you exported a glossary, some terms may
    be


    project-specific and should be removed. Here are some items to pay particular
    attention


    to:


    **Image files: ** Retain image files, such as corporate logos or background images,


    that you use across different projects.


    **Embedded content in master pages: ** Look for literal text that you can replace'
