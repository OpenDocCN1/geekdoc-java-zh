  md: 'You can set this value to a string or to a variable. To set it to a variable,
    click the icon to


    the right of the Label text box. This opens a window that displays system variables.
    You


    can select any system variable, but the ones that make sense in this context are
    the


    following:


    `LinkedTitle`: the value of the `<title>` element


    `LinkedHeader`: the top level header in the topic file


    `LinkedFile`: the topic file name


    If you set the Label to the variable `LinkedTitle`, Flare uses the same process
    for


    assigning a value that it uses when you drag and drop a topic into a TOC. That
    is, if a


    `<title>` tag exists in the `<head>`, Flare uses that value. If not, it uses the
    value of the


    first top-level heading. If there is neither a heading nor a title, Flare uses
    the file name


    without the extension. In previous versions, once the initial value was set, you
    had to


    change it manually; with Flare 2017, when you set the Label to a system variable,
    Flare


    recalculates the value whenever it displays the Label.


    If you set the Label to the variable `LinkedHeader`, Flare uses the value of the
    first


    heading tag in the topic. If there is no heading tag, Flare uses the file name
    without the


    extension.


    Because the title of a topic is not readily visible and because topics often do
    not have a


    `<title>`, I recommend using the `LinkedHeader` variable. Setting the Label to
    this


    variable makes it easy for Flare users to match a TOC entry with the corresponding


    topic file.


    To use this feature directly in a `<TocEntry>` tag in a `.fltoc` file, set the
    `Title` attribute


    as shown in Example 6.4:


    **Example 6.4 – Setting the **`**<TocEntry>**``**Title**`** attribute using a
    variable**


    `<TocEntry`


    ` Title="\[%=System.LinkedHeader%\]"`


    ` Link="/Content/intro.htm"`


    ` BreakType="chapter"`


    ` PageNumberReset="reset"`


    ` ...`


    ` PageNumberFormat="decimal" />`


    You may want to adjust any script that creates a `.fltoc` file, such as Example
    6.3, to use


    this capability.


    ***6.4. Validating your TOC file using xmllint***


    You can validate your Flare TOC file from the Flare interface (see Section 9.6.1,
    “Using


    Project Analysis”), and the script will let you know whether your input HTML ToC
    file


    is valid.'
