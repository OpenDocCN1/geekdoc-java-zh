    ***17.3. Managing a template project***


    A template project is itself a derived file that serves as a basis for new projects.
    With


    one exception, you should not directly change this template. Instead, reimport
    it only


    when you update the source project. The exception, (other than the `.flimpfl`
    file) is the


    project file (`.flprj`). To change project attributes – for example, add or change
    a


    Master Page Layout – you must directly edit the template `.flprj` file.


    Changing the template `.flprj` file only affects new projects, because `.flprj`
    files


    cannot be linked files.


    You manage templates within Flare by choosing the Manage Templates option found


    under the Tools ribbon. (This option is available only when a project is already
    open.)


    Doing this opens the Template Manager window shown in Figure 14.4. Double click
    the


    template you want to update. This opens another instance of Flare. Open the Project


    Import Editor by double clicking the import file found under the `Project\\Imports`


    folder. To update the template, click the Reimport… button. Accept any changes
    and


    save the template.


    Keeping the template project up to date is not critical because derived projects
    update


    directly from the source project. However, if you keep this file up to date, any
    new


    projects that use this template will incorporate the latest source files.'
