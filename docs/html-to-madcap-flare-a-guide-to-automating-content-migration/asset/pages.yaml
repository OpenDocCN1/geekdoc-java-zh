  md: '**Appendix E. Importing DocBook**


    DocBook is an XML standard maintained by OASIS. Like DITA, DocBook is designed


    for technical communicators. It is used extensively in the computer industry and
    open-


    source software community. DocBook can be an excellent choice for creating content
    for


    Flare, and if you need to migrate content from DocBook into Flare, you should
    be able


    to do so easily.


    You can not import DocBook content directly into Flare. However, DocBook has a
    set


    of open-source style sheets that generate HTML that can be readily imported into
    Flare.


    Here are a few of the reasons why DocBook works well with Flare:


    You have close control over chunking.


    You can readily create valid XHTML.


    You have complete control over the ToC file. If you want to preserve the same


    structure in Flare as you had in DocBook, you can generate a top-level ToC using


    the DocBook style sheets and reliably transform that ToC into a Flare TOC.


    You can include or exclude references to CSS and JavaScript files.


    Tables and other structures are enclosed in `<div>` tags with the `class` attribute
    set,


    so you can style them separately.


    You can easily remove numbering and labels.


    You can easily create List-Of proxies from DocBook-generated HTML.


    This appendix describes how to set up the DocBook style sheets to generate HTML
    that


    can be easily imported into Flare. I assume that you have the DocBook style sheets


    installed and are familiar with how to set parameters and create a simple customization.


    If you are unfamiliar with the DocBook style sheets, and even if you know them
    well, I


    recommend *DocBook XSL: The Complete Guide*\[Stayton, 2007\] by Bob Stayton, which


    is available in print and online at http://sagehill.net. It provides detailed
    instructions on


    downloading, installing, running, and customizing the DocBook style sheets.


    ***E.1. Output format***


    The recommendations in this appendix are based on DocBook 5.0 and the DocBook


    version 1.78.1 XSL style sheets for XHTML output. You can import XHTML files


    created with the DocBook style sheets using the Flare UI, or you can use the operating


    system to copy output files directly to a Flare `Content` directory.


    ***E.2. The chunking parameters***


    The following chunking parameters have a direct impact on importing files into
    Flare.


    **chunker.output.encoding: ** Determines the output encoding. The default is `UTF-8`.'
  merge: -1
  pgno: 197
- img_proc: true
  md: '**chunk.section.depth: ** Determines the level at which files are chunked in
    the


    output. By default, this parameter is set to `1`, which tells the DocBook chunker
    to


    create a separate HTML file for each chapter^(\[20\]) and each level-one section,
    with


    one exception. By default, the chunker includes the first level-one section in
    the


    HTML file for its chapter. The **chunk.first.sections** parameter controls this
    action.


    If you set the value of **chunk.section.depth** to `2`, the chunker will chunk
    at level-


    two sections, and so forth. The best value for this parameter depends on your


    original content and the degree to which your DocBook content fits into meaningful,


    separate topics.


    **chunk.first.sections: ** Determines whether the first section in a chapter should


    appear as a separate HTML file or in the chapter file. By default, this parameter
    is


    set to `0`, which tells the chunker to include the first section of a chapter
    in the


    chapter file along with any content that precedes the first `<section>` tag.


    **chunk.tocs.and.lots: ** Determines whether to create a separate file for the
    main


    ToC. By default, this parameter is set to `0`, which tells the style sheets to
    put the


    ToC in the `index.html` file and not create a separate file. If set to `1`, the
    style


    sheets create a ToC with a file name ending in `\-toc.html`. Regardless of the


    setting for this parameter, the ToC list element is always identifiable because
    the


    style sheets set the value of the `class` attribute to `toc`.


    Creating a separate file that contains only the ToC can be useful. If you are
    using a


    script to process the ToC, the name of the file containing the ToC is consistent.
    It is


    `bk01-toc.html` if the top level tag is `<book>` and `ar01-toc.html` if the top
    level


    tag is `<article>`. Another advantage is that you know that this file contains
    only


    the ToC and no other content.


    **chunk.separate.lots: ** Determines whether to create separate ToC files for
    tables,


    equations, figures and examples. By default, this parameter is set to `0`, which
    does


    not create separate ToC files. Leave this parameter as is because Flare uses List-Of


    proxies to perform this function.


    **html.ext: ** Defines the file extension for individual, chunked files. The default
    for


    this parameter is `.html` (note that the dot “.” must be part of the value). Files


    created by Flare use the `.htm` extension. However, you may want to use a different


    extension to differentiate imported files from native files.


    **suppress.header.navigation and suppress.footer.navigation: ** Determines


    whether to create navigation links in the header or footer of each HTML page.
    By


    default, these parameters are set to `0`, which turns on navigation links. Because


    Flare handles navigation separately, this parameter should be set to `1`.


    ***E.3. ToC parameters***


    DocBook 5.0 has no direct equivalent to the Flare TOC file.^(\[21\]) DocBook documents


    are hierarchical, and that hierarchical structure determines the order of the
    ToC. For'
