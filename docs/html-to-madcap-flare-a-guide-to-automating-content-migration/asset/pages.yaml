  md: '**Preparing for Import**


    Once you have valid XHTML files, you need to prepare them for import. The next
    three


    chapters describe how to preprocess your files to make the import process as clean
    as


    possible.


    Chapter 5, Preprocessing, outlines the overall process and covers several cleanup


    tasks.


    Chapter 6, Tables of Contents, describes how to create a Flare TOC for your files


    and convert an HTML TOC for import.


    Chapter 7, Glossaries, describes how to create a Flare glossary.'
