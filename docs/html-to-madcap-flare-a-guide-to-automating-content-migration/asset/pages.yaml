  md: 'unless you change the rules for exclusion, which are set from the Project Import
    Editor.


    Ways of excluding files are described in Section 16.2, “Excluding files”.


    **Skipped File: ** A file that is temporarily excluded from being imported (see


    Figure 14.3). If auto-sync is enabled, skipped files will be imported the next
    time auto-


    sync is invoked. The danger with skipped files is that they may overwrite existing
    files.


    When using global project linking, you should always exclude files rather than
    skip


    them.


    ***13.2. Auto-sync***


    To take full advantage of Global Project Linking, you should use auto-sync. When
    auto-


    sync is turned on, Flare updates files from any linked project each time it generates
    a


    target.


    Auto-sync for linked projects is similar to auto-sync for linked HTML files, but
    there


    are important differences, including the following:


    When you import an HTML file set, you import a folder and usually keep the files


    in that folder separate from other content files. This reduces the probability
    of file


    names conflicting. With global project linking, the linked files may occur anywhere


    in your project, which increases the possibility of a conflict.


    When new HTML files are added to the source directory of an imported HTML file


    set, they are automatically imported into the derived project. With linked projects


    you can choose to exclude new files.


    You can import any type of file into a linked project, but with an HTML file set,


    you can import only HTML files (and related resources).


    Flare generates a TOC file for an HTML file set, but it does not generate a TOC


    with a linked project.


    The benefits of auto-syncing are evident when content is maintained outside a
    Flare


    project. You don’t have to think about whether or not the original files have
    changed;


    Flare automatically updates your files before generating output.


    By auto-syncing you get the maximum benefit from global project linking. But this


    benefit doesn’t come for free: using auto-sync is riskier than synchronizing files


    manually. There is a danger that you may accidentally overwrite files. This can
    happen


    in two ways:


    If you add a new file to the source project that has the same name as an existing
    file


    in your project, Flare will overwrite your file, unless you tell Flare to exclude
    that


    file.


    If you decide to link an existing project to a source project, you may overwrite


    files.'
