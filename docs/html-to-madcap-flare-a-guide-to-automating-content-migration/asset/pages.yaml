  md: 'project, then discontinue auto-syncing for that project. As a last-ditch measure,
    you can


    unlink all imported files by deleting the imports folder for that project in the
    Project


    Organizer.


    **Version control and derived projects**


    If you store files in a version control repository, and multiple writers check
    out the same files,


    auto-sync can be a source of conflicts, especially if you keep both your source
    and derived


    projects in version control. I recommend that you not keep linked files in derived
    projects


    under version control, as long as the source versions are kept under version control.
    You


    don’t need to maintain copies of the same files in two places.


    If you do keep both linked and source files under version control, you should
    set up a


    process to control potential conflicts, for example, by having one user responsible
    for


    triggering auto-sync and committing changes.


    **17.2.1. Changing settings in the Project Import Editor**


    Just as you need to be careful when defining which files to include and exclude
    on


    import, you also need to be careful about import settings in the Project Import
    Editor. If


    you adjust the settings to be less restrictive – that is, you include files that
    you


    previously excluded – you can inadvertently overwrite existing files.


    The Section 16.2, “Excluding files” explains how to use the Project Import Editor


    settings to exclude files. Figure 17.1 shows the other settings available on this
    screen.'
