  md: '**Chapter 10. Dynamic Content in Flare**


    You have already seen how dynamic documentation can be created from within the
    Flare


    interface using auto-sync and from outside Flare using scripts. This chapter introduces


    several other ways to incorporate dynamic content.


    ***10.1. Including content***


    Many use cases require you to include content in a document rather than creating
    it in


    place. Doing this efficiently can reduce your workload, allow you to reuse content,
    and


    improve the quality of your documentation. The following types of material are
    well


    suited to being included:


    Repeated content


    Content that is likely to change


    External files


    How Flare handles included content depends on the content type. Usually, you can


    simply find the right menu item in the Flare UI; you don’t need to know what’s
    going on


    under the hood. However, if you understand how Flare includes content, you will
    be


    better able to exploit Flare and include items programmatically.


    **10.1.1. Flare snippets**


    Flare *snippets* are the best way to include repeated items such as legal notices,
    version


    change indicators, and other short pieces of content. As the name implies, a Flare


    snippet is a document fragment. Snippet files are stored in the


    `Content\\Resources\\Snippets` directory and have the file extension `.flsnp`.
    Snippets


    have the following characteristics:


    A snippet is an HTML file with the root tag `<html>`.


    As with Flare topic files, snippets must have an XML declaration. They may also


    reference the MadCap namespace in the `<html>` tag, but that is optional.


    Snippets need neither a `<head>` tag nor a heading tag (e.g., `<h1>`). In fact,
    it is good


    practice to avoid heading tags, since snippets can be included at different places


    and in contexts where a specific heading tag would be inappropriate.


    Flare supports two kinds of snippets; text snippets and block snippets. Text snippets
    are


    plain text and may not contain any markup. They are inserted *inline*, perhaps
    within a


    paragraph, while block snippets are block elements that break the flow of a document.


    Usually, text snippets can be replaced by Flare variables, a topic discussed in


    Section 10.1.2, “Variables” Because they can contain markup, block snippets are
    more


    interesting and useful than text snippets.'
  merge: -1
  pgno: 101
- img_proc: true
  md: 'If you repeat portions of your content in different locations, you should consider
    creating


    a block snippet. Example 10.1 shows a simple block snippet.


    **Example 10.1 – Flare block snippet**


    `<?xml version="1.0" encoding="utf-8"?>`


    `<html xmlns:MadCap="http://www.madcapsoftware.com/Schemas/MadCap.xsd">`


    ` <body>`


    ` <div class="version2.1">`


    ` <p>This change was introduced in version 2.1.</p>`


    ` </div>`


    ` </body>`


    `</html>`


    **Note**


    If you are familiar with XML, you will notice that a snippet is not an XML *fragment*,


    since it contains the root tag, `<html>`. Flare strips this tag when it generates
    output.


    To include a block snippet in a file found in the `Content` directory, use a


    `<MadCap:snippetBlock>` tag such as the following:^(\[8\])


    `<MadCap:snippetBlock src="Resources/Snippets/mysnippet.flsnp" />`


    **Note**


    Place `<MadCap:snippetBlock>` tags inside the body of a page, but do not place
    them


    inside other tags.


    If you need to include a snippet in every topic – for example, within a footer
    – then


    include the snippet in a master page (see Section 10.2.3, “Master pages”).


    Snippets are ideal for repeated, static content, but they are also suitable for
    dynamic


    document fragments created at build time. With `<MadCap:snippetBlock>` tags in
    place,


    you simply generate the dynamic content and Flare includes that content wherever
    it is


    referenced.


    Because snippets may be inserted in multiple locations, do not create links to
    snippets


    or embed bookmarks in them. Otherwise, there are no restrictions on snippets.
    You can


    use any styles you like, you can include Flare controls, and you can even reference
    other


    snippets from within them.


    **Snippets and JavaScript**


    Block snippets are ideal when you need to include JavaScript in the body of some
    pages but


    not others. For example, consider the following snippet:


    `<?xml version="1.0" encoding="utf-8"?>`'
