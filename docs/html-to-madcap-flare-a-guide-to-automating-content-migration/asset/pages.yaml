  md: 'You can also compare the number of `<li>` tags in your input HTML file with
    the number


    of `<TocEntry>` tags in your output Flare TOC file. The following two commands
    do


    that:


    `xmllint --html --xpath ''count(//li)'' toc.html`


    `xmllint --xpath ''count(//TocEntry)'' myimport.fltoc`


    The two values should be equal. This isn’t a definitive test, but you can at least
    be sure


    that you have the right number of entries in your Flare TOC file. If the HTML
    file that


    contains your ToC has no other content, you can remove it once you know you have
    a


    valid Flare TOC.'
