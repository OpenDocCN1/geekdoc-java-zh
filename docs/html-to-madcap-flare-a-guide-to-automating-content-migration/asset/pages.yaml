    ***12.6. Creating custom documents***


    Flare encourages the creation of DITA-like, standalone topics. This type of topic,


    combined with the ability to create a project from a prototype, suggests the possibility
    of


    mixing and matching existing topics – in other words creating custom documents.


    How far you pursue this idea will depend upon your needs and the nature of your


    documentation. At one end of the spectrum, it may simply mean importing topics
    from


    existing projects and then arranging them to create a custom document. This gives
    you a


    new document for little effort, and, if you auto-sync imported topics, Flare will
    apply


    updates whenever you rebuild a custom document.


    At the more ambitious end of the spectrum, you may be able to build documents
    on the


    fly without using the Flare UI. You can create an interface that lets any user,
    even one


    unfamiliar with Flare, create a custom document. The steps for creating such a
    document


    are the following:


    1\. Copy a prototype project to a new directory.


