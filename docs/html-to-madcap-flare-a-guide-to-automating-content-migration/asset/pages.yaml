    ***9.6. Troubleshooting***


    If you used the **tidy** command before importing your files, you shouldn’t see
    any basic


    problems, such as invalid HTML syntax. In addition, Flare identifies and fixes
    any


    minor issues as files are imported. However, if some of your files have more serious


    problems – for example, if your HTML does not validate as XHTML – Flare won’t
    open


    those topic files in the XML editor. Instead, the text editor will flag any errors
    in the top


    status bar. If you run into this situation, the best solution may be to use an
    external editor


    to fix those files.


    **9.6.1. Using Project Analysis**


    The Flare Project Analysis tool checks the validity of a variety of aspects of
    your


    project. You can check imported files for the following potential errors:


    Broken links


    Broken bookmarks


    Database errors


    Files with changes


    Files with annotations


    Topics not in index


    Topics not in selected TOC


    **Note**


    The MadPak Professional Suite includes the MadCap Analyzer utility, which also


    performs these tasks (plus additional ones). This book does not deal with the
    expanded


    capabilities of this separate product.'
