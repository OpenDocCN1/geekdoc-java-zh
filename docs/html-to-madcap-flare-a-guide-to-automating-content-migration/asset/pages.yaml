    the local


    file, cancel the import. You can do two things to preserve your changes:


    If your local changes are suitable for all derived projects, make these changes
    to


    the source file and reimport.


    If the changes in the derived file are only suitable for the derived project,
    unlink the


    file as described in Figure 15.1, “Linked document dialog.” Flare will no longer


