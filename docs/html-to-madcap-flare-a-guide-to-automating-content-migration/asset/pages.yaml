  md: '**Glossary**


    **anchor**


    The HTML anchor tag, `<a>`, performs two functions; it can be the source or the


    destination for hyperlinks. When functioning as a source anchor the `<a>` tag
    has an


    `href` attribute, and when functioning as a destination anchor it has either an
    `id`


    attribute or a `name` attribute. Source anchors can point directly to internal
    or


    external HTML pages or to a destination anchor within a page. You do not need
    a


    destination anchor when you point directly to an HTML page; you need destination


    anchors only to identify specific locations within a page. In this book the terms


    *source anchor* and *destination anchor* are used as defined here.


    Within Flare, source anchors that reference internal destinations – destinations
    on


    the same website – can be replaced by Flare *cross-reference*s. When you create
    a


    cross-reference to a destination anchor, you must use the `name` attribute, rather
    than


    the `id` attribute, on the destination anchor.


    **auto-sync**


    The Flare auto-sync feature links imported files to their original source and


    reimports those files each time Flare generates output. Flare gives you this option


    when you import files through the Flare UI.


    **bookmark**


    A Flare bookmark is a *destination anchor*. You create one using the HTML `<a>`
    tag


    with a `name` attribute. You link to a bookmark using the `<MadCap:xref>` tag
    (a


    *cross-reference*). The advantage of using `<MadCap:xref>` over a normal hyperlink


    is that, unlike a hyperlink, Flare determines the text of a cross-reference


    dynamically, using the text at the bookmark. If you change that text, Flare updates


    the text of the cross-reference automatically.


    You can create a `<MadCap:xref>` cross-reference to any topic page. However, to


    create a `<MadCap:xref>` to a specific location within a page, there must be a


    bookmark at that location. When you create a cross-reference using the Flare 12
    UI,


    Flare will create a bookmark if one doesn’t already exist. For earlier releases,
    or


    if you create a cross-reference using a script, you must create the bookmark first.


    For PDF output, Flare gives you the option to include links to bookmarks in PDF


    output. If you choose this option, bookmarks will show as clickable links in the
    left


    sidebar in Adobe Acrobat Reader along with TOC items.


    **Cascading Style Sheets**'
  merge: -1
