    ` </sequential>`


    `</macrodef>`


    ![](img/778bbca9afe8715a0e53d695f3ecc4ce_179_0.png)


    This line contains the call to the **pandoc** macro. The first parameter, `file`,
    contains


    the input file name, which is passed in from the Ant command line. The other two


    parameters, `totype` and `output`, have hardcoded values.


    ![](img/778bbca9afe8715a0e53d695f3ecc4ce_179_1.png)


    The macro definition begins on this line. The `name` attribute defines the name
    that


    will be used to call this macro. The `<attribute>` tags behave like function


    parameters. You can add the `default` attribute to an `<attribute>` tag to define
    a


    default value, which Ant uses if the attribute is omitted from the macro call.
    If you


    do not define a default value, you must assign a value when you invoke the macro,


    as is done in the **2txt** target.


    ![](img/778bbca9afe8715a0e53d695f3ecc4ce_179_2.png)


    You reference macro parameters using the ''`@`'' character, for example, `@{file}`.


    This differentiates them from properties, which use the ''`$`'' character.


    Once you have created a macro, you can reuse it in other targets. For example,


    Example A.5 contains a target that uses the **pandoc** macro to convert an HTML
    file to


    Markdown.


    **Example A.5 – Markdown target**


    `<!-- Convert HTML to Markdown -->`


    `<target name="2md" description="Convert -Dfile to Markdown (tmp.md)">`


    ` <pandoc file="${file}" totype="markdown\_strict" output="tmp.md"/>`


    `</target>`


    This target passes `markdown\_strict` to **pandoc** and changes the extension
    of the output


    file. You can readily create other targets to convert to the other file output
    types


    supported by Pandoc.


