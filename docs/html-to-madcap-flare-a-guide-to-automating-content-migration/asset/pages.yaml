  md: '**Foreword**


    To drive a car, you don’t need to know how its transmission works, but you’ll
    be a


    better driver if you do. Similarly, you don’t need to know how Flare works in
    order to


    use it, but you’ll make better use of it if you do. That’s the gist of this book:
    it explains


    how the parts of Flare that import HTML files work under the hood and how to make


    better use of those features.


    Author Peter Lavin is a technical writer, former programming instructor, and web


    developer with a background in XML, HTML, and CSS, along with DITA and Doxygen.


    That background shows in this book. Peter explains how Flare’s HTML-related features


    work at the interface level, then dives into the code behind those features. He
    discusses


    the automation of HTML import and the use of scripts and third party tools to
    clean up


    the incoming files. Those discussions provide tremendous value and are the heart
    of the


    book. Here are just a few of the gems you’ll find:


    Instructions for using third-party tools such as **xmllint** and **tidy** to clean
    up HTML


    files.


    Several dozen scripts for automating tasks such as removing references to


    JavaScript resource files, removing empty `<p>` tags, and identifying mismatched


    titles.


    Pre-import processing steps to increase the efficiency of your HTML file import.


    Tips on managing the `<title>` tag and controlling how page names appear in


    search results.


    Scripts that can help with little-known issues, such as getting Flare glossary
    terms


    whose definitions come from topic links to appear in print output.


    If you’re familiar with Flare and technologies like HTML and CSS…


    If you have to import large numbers of HTML files from various sources into your


    projects and are looking for ways to make the process more efficient…


    If you understand how things work in Flare but not necessarily why they work that


    way…


    … You’ll find this book extremely useful.


    Neil Perlin


    Hyper/Word Services


    Certified Flare Trainer and Consultant since 2005'
