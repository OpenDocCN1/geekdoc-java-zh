  md: '**Template Projects with Global Project Linking**


    Suppose you have a snippet that’s suitable for use in different projects. When
    you create


    a new project, you copy this snippet from an existing project to your new project.
    You


    have a lot of projects, so you end up with multiple copies of the same text in
    different


    locations. Sometimes you copy from one location, sometimes from another.


    Occasionally you make minor changes to the snippet, so the copies differ slightly.


    One day, marketing decides to change the name of one of the products referenced
    in your


    snippet. You must now locate every instance of this snippet and update it. You
    search


    through each project, locate the snippet, and make the same change numerous times.


    Minor variations between the different versions aggravate the situation.


    It’s easy to see what’s wrong with this approach: it’s repetitive, time consuming,
    and


    error prone. While handling a single snippet in this way is relatively simple,
    if you use


    this approach, it’s likely you have copied many files from one project to another,
    making


    the problem much bigger. Is there a way to manage your projects so you avoid this


    problem?


    Templates offer a partial solution, which is certainly less error prone than cutting
    and


    pasting. However, using templates leaves you in exactly the same situation when


    updating; you have multiple copies of the same files, and you need to update each
    copy


    separately.


    Within the context of a single project, variables solve a similar problem; they
    provide a


    way of updating multiple locations by making one change in one place. Is there
    a way of


    doing something similar with files that are used across different projects?'
  merge: -1
  pgno: 136
- img_proc: true
  md: '**Chapter 13. The Flare Solution**


    If you use auto-sync with imported HTML files, then you know how useful it is
    for


    maintaining content outside Flare. For example, with Java API documentation generated


    using Javadoc, Flare can automatically include changes you make to source code.
    You


    can do the same thing for any Flare file type by using what MadCap calls “Global


    Project Linking.” You can use this feature to link to topic files, resource files,
    or


    structural XML files. This capability lets you make a single change in one place
    and


    update many files across many projects.


    You can link to any number of projects using Global Project Linking. You can choose


    topic files from one project, snippets from another, and TOC files from yet a
    third. Flare


    will also let you use an existing working project as a source project.


    However, I recommend a simpler and more manageable approach: create a source


    project. A source project is a dedicated project for shared content. You never
    use a


    source project to generate output. If you use a dedicated source project, when
    it comes


    time to update source files, there is no confusion about where source files are
    located;


    you’ll find them all in one place. And, because a source project never generates
    output,


    there is never a conflict between the needs of the source project and those of
    a derived


    project.^(\[13\])


    Once you have created a source project, you can link new projects to it. The easiest
    way


    to do this is to create a template that includes global project links and then
    use this


    template for each new project. The steps for doing this are the following:


    1\. Create a source project


    2\. Create an empty project


    3\. Use the global project linking wizard to link the source project to the empty
    project


    4\. Save your linked project as a template project


    5\. Use this template to create new projects


    This chapter and the next four chapters explain these steps.


    ***13.1. Terminology***


    When you use global project linking, the same files appear in different contexts,
    which


    can lead to confusion. For clarity, I use the following definitions:


    **Source Project: ** A collection of files used as the basis for creating a template
    project.


    These files are from both the `Content` and `Project` directories. Files are maintained
    in


    the source project and reimported into projects derived from the source project.
    A


    source project is never used to generate output files; its sole purpose is to
    serve as the'
