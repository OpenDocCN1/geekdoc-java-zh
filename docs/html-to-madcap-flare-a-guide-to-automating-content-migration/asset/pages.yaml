  md: 'For HTML targets, you include glossary files from the Project Organizer window
    by


    selecting the desired target, choosing the Glossary tab, and clicking the check
    box for the


    desired glossary or glossaries. You must also change the skin properties to ensure
    the


    glossary will appear in your output. Do this in the Skin Editor by choosing the
    glossary


    you want to use under the Features frame of the General tab.


    The process for adding a glossary to print output is similar, but you must also
    add a


    glossary *proxy* to the topic file where you want the glossary to appear. Flare
    proxies are


    XML tags that you insert in your content to identify where auto-generated content
    such as


    tables of contents, indexes, or glossaries should appear. Flare resolves proxies
    when it


    builds a target.


    That said, glossary proxies fall short of the ideal. When you use a glossary proxy
    with


    print output, Flare only uses plain text glossary entries; it ignores linked entries
    entirely.


    On the face of it, neither plain text nor linked entries will do.


    This chapter shows how to create a glossary for print output that avoids these
    issues; it


    also shows how you to automate the following tasks:


    Converting an HTML glossary to a series of Flare glossary topics ready to be


    imported.


    Converting an HTML glossary page to a Flare glossary file (file extension


    `.flglo`).


    Converting HTML glossary hyperlinks to Flare `<MadCap:glossaryTerm>` tags.


    If you have an HTML glossary that uses a single definition list (`<dl>`), you
    can use all of


    the scripts in this chapter. If not, you can still create a glossary for use with
    print output


    and convert glossary hyperlinks to `<MadCap:glossaryTerm>` tags.


    **Note**


    With the exception of Example 7.4, the scripts presented in this chapter are specific
    to


    Flare 12 and will not work with Flare 11. Appendix C, Glossary Scripts for Flare


    Version 11, describes how Flare 11 glossaries differ from Flare 12 glossaries
    and


    contains versions of these scripts for Flare 11.


