    ` <!-- put commands here -->`


    ` </target>`


    `</project>`


    If you call this file `project\_specific.xml` and place it in the same directory
    as the


    `build.xml` file, you can import it by adding the following line to `build.xml`:


    `<import file="./project\_specific.xml"/>`


    You invoke targets defined in the project-specific build file the same way you
    invoke


    targets in `build.xml`. Place both build files (`build.xml` and `project\_specific.xml`)


    and the properties file in the `Content` directory, as described in Section 13.3.2,


    “Selecting content files for a source project”. The properties file and project-specific


    build file are both stub files, and the build file can be a linked file.


    ***A.7. Advanced Ant***


    The targets shown in Example A.2 may be adequate for your needs. However, Ant
    has


    other capabilities that can be useful. This section provides examples of Ant targets
    that


    use macros, include other files, and execute XSLT.


    **A.7.1. Using macros**


    Ant macros are similar to programming function calls; they allow you to reuse
    code in


    different circumstances. Macros are good for simplifying calls to commands, such
    as


    **pandoc**, that have multiple options. You define macros using the `<macrodef>`
    tag.


    Example A.4 defines a macro named `pandoc` and invokes this macro from a target
    that


    converts HTML to plain text. Invoke this target using this command line:


    `ant 2txt -Dfile=myfile.html`


    **Example A.4 – Using macros**


    `<!-- Convert HTML to text -->`


    `<target name="2txt" description="Convert -Dfile to text (tmp.txt)">`


    ` <pandoc file="${file}" totype="plain" output="tmp.txt"/> `


    ![](img/778bbca9afe8715a0e53d695f3ecc4ce_178_0.png)


    `</target>`


    `<macrodef name="pandoc"> `


    ![](img/778bbca9afe8715a0e53d695f3ecc4ce_178_1.png)


    ` <attribute name="totype"/>`


    ` <attribute name="file"/>`


    ` <attribute name="output"/>`


    ` <sequential>`


    ` <exec executable="pandoc" dir="./">`


    ` <arg line="-f html"/>`


    ` <arg line="-t @{totype}"/> `


    ![](img/778bbca9afe8715a0e53d695f3ecc4ce_178_2.png)


    ` <arg line="@{file}"/>`


    ` <arg line="-o @{output}"/>`


    ` </exec>`'
