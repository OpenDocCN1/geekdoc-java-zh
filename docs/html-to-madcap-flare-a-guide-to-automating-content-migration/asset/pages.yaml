    **8.1.1. What happened?**


    Importing files using the import wizard creates a project structure (see Section
    2.1,


    “Flare project structure”). If you open the project directory in Windows Explorer,
    you


    will see a project file (extension `.flprj`) and four directories: `Analyzer`,
    `Content`,


    `Output`, and `Project`. The `Analyzer` directory is for Flare’s internal use
    and the


    `Output` directory is where Flare stores documentation builds. The project file
    and the


    `Content` and `Project` directories are of immediate interest.


    **8.1.1.1. The project file**


    The Flare project file is an XML file found in the project directory. This file
    has the


    same name as the project and uses the extension `.flprj`. To open a project in
    Flare,


    open this file.


    The root element of the project file is `<CatapultProject>`. This tag has two
    important


    attributes, `MasterToc` and `MasterStylesheet`. When Flare creates a new project,
    it


    creates a default TOC file and a default style sheet and sets these attributes
    to refer to


    those two files.


    **8.1.1.2. Content files**


    The project directory contains a subdirectory named `Content`. When you import
    HTML


    files into a new project, Flare creates a new subdirectory of `Content` that has
    the same


    name as the directory you imported. Flare places the HTML files you chose during


    import (Figure 8.2) in that subdirectory. If you created a directory for glossary
    entries


    using the script in Example 7.4, you should also find this directory in the imported


    directory.


    **Note**


    When you import HTML files into a new project, Flare always creates a new directory,


    regardless of whether you import a complete directory or only selected files.


    If you want to import files directly into the `Content` directory, you need to
    import them'
