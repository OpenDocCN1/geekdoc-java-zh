    ***16.2. Excluding files***


    When you create a new project from a linked template, it’s impossible to overwrite
    a


    file. However, this is a danger when you link a source project to an existing
    project. To


    avoid this, you need to be able to permanently exclude files, which you can do
    in the


    following ways:


    **16.2.1. Omitting files from the Include Files list**


    If a file does not appear in the Include Files: list, Flare will not import it
    into the


    derived project. You can identify files by name or use the wild card character,
    `\*`, to


    identify a pattern for files you wish to include.


    **16.2.2. Adding files to the Exclude Files list**


    If a file appears in the Exclude Files: list, Flare will not import it into the
    derived


    project. As with included files, you can identify files by name or use the wild
    card


    character to exclude files that match a pattern.


    If files match both an inclusion pattern and an exclusion pattern, they will be
    excluded.


    For example, if `\*.\*` is an inclusion pattern and `\*.fltoc` is an exclusion
    pattern, no


    Flare TOC files will be imported.


    **16.2.3. Excluding files using conditions**


