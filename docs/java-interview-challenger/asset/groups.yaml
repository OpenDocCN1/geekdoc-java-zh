    \n![](img/508455d7d9cdb199f1cdef01c90e5d26_169_0.png)\n\nFigure 38. Graph Traverse\n\
    \nTo represent the above graph we will use the following classes:\n\n```java\n\
    import java.util.ArrayList;\nimport java.util.List;\n\npublic class Node {\n \
