    ## Java Interview Process


    Interviews are difficult and many times tricky, and if we don’t know what the
    rules are to pass in an interview, we are very likely to fail.


    One important point to remember when doing interviews is that they don’t necessarily
    test your skills as a software engineer. The interviews have their gaps, and they
    could be better. For example, if it’s been a while since we don’t practice algorithms
    and need to know some data structures, we will likely fail the interview.


    Therefore, understanding the rules of the game is very important. Otherwise, we
    won’t pass on those interviews.


    Being rejected in many interviews and feeling frustrated is a normal feeling.
    I’ve been rejected in many interviews and felt frustrated, but we need to remember
    all the time interviews will not define how good we are as software engineers.
    It will test some skills, but the day-to-day work is completely different.


    That’s why I created this chapter so you can understand the rules of the interview
    game so you can pass on those interviews.


    ## Interview Mindset


    Don’t be intimidated by the amount of technologies you see in a job spec because
    no one really knows all of those technologies in depth. Instead, knowing what
    those technologies do is usually enough.


    Also, see failing in an interview as a necessary step for your growth. Failure
    is just a stepping stone to bring you success. The crucial point is to learn why
    we failed, improve and try again.


    Java Interview Process


    The more we do it interviews, the better we get at them. Keep that in mind and
    never stop learning to pass in the interview.


    The good news is that after reading this book you will have a strong foundation
    to solve any kind of algorithm and a broad understanding of systems design. You
    will also have some insights to leverage your career!


    ## CV


    Your CV has to have relevant information regarding what the market is asking for.
    Suppose you put in your CV that you know Struts or any other obsolete technology.
    That won''t matter. That''s why you must align your CV with the market''s requirements.


    That doesn''t mean you must lie on your CV. You need instead to be honest because
    they will ask you about the concepts you included in your CV during the interview.
    They might disqualify you immediately if you don''t know the technology because
    the interviewer will notice that.


    Make sure to put the biggest highlights you had in your job experience. On the
    top of your CV, include how many years of experience you have and the results
    you got for previous companies. Try to use numbers. For example, if you refactored
    lots of code from a previous company, you can state on your CV the following.


    - Increased developer''s productivity by 25% by refactoring code and creating
    generic components.


    If you think about your previous experiences, you will have plenty of ideas about
    the results you brought.


    ## Market Yourself


    Your CV is a way to market yourself, but an even stronger way to market yourself
    is to share your knowledge. You build trust with people who have never met you
    by sharing your knowledge.


    You can also combine your knowledge sharing with your CV. You can include links
    from your blog, Youtube channel, or talks you gave.


    Also, you can skip interviews entirely if you are well known to solve a specific
    problem.


    ## Having a blog


    Having a blog is a great investment in yourself. When you create, make sure you
    are consistent. To stand out to companies, you will need to focus on:


    - Performance

    - Security

    - Data


    ## Youtube Channel


    If you prefer videos, create your Youtube channel and share what you know. Having
    a focus on a problem that companies face is also powerful because then the people
    who see your video and understand you will probably be hired without going through
    several steps.


    ## Giving Talks


    You have the option of also giving talks. Giving talks is a great way for you
    to market yourself and get visibility. When you give a talk,

