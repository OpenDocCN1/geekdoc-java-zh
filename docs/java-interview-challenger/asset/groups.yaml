    a Thread pool and a queue. Sometimes, they will ask you to create something even
    if there are already several frameworks that do the job.


    Other takeaway tests will ask you to create a normal application with the problem
    they are presenting, and your job is to create the project in a way that is robust,
    performant, and has a good code design.


