    # Summary


    The depth-first-search algorithm will visit the depth nodes first and the nodes
    closer to the root. As we''ve seen we can use this algorithm for graphs or tree
    data structures.


    We can use the preorder, postorder, and in-order, algorithms to traverse graphs.
    Notice also that it''s much easier to use the depth-first-search algorithms with
    a binary tree instead of a graph that might be cyclic or have more than two children
    nodes. Therefore, let''s recap the main points:


    +   - The depth-first-search algorithm is useful to traverse nodes in depth.

    - Recursion makes the code much simpler when implementing a depth-first search
    algorithm.

    - Preorder Depth-First search will start from the root, then will traverse to
    the left and right subtrees.

    - Post-Order Depth-First search will start from the left subtree, then the right
    subtree, and finally the root.

    - In-order Depth-First search will start from the left subtree, the root, and
    finally the right subtree.

    - It''s easier to implement the depth-first search algorithm with a binary tree
    instead of a cyclic graph.

    - A graph can be cyclic, but a tree can not be cyclic.'
