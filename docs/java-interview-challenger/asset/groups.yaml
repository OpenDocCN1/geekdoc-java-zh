    algorithm. Even still, it''s not 49 (the result of 7 * 7) as it should be with
    the Big(O) notation estimation. it''s close enough though.


    **Space Complexity:** We only swap elements in the array in place. Therefore,
    since we don''t use any auxiliary array the space complexity is O(1).


    # Summary


    The Bubble sort algorithm is the simplest sorting algorithm to implement and it''s
