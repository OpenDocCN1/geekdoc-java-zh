    \ - 指数：指数复杂度增长非常快。这种时间复杂度的好例子是尝试破解密码。假设密码只支持数字且有 4 位。这等同于 10^10000 种可能的组合。指数数字越大，增长越快。\n\
    - O(n!) - 乘阶：3! 的乘阶等同于 1 * 2 * 3 = 6。\n\n"
