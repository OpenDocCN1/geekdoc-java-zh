    \ static void main(String[] args) {\n        Stack<Integer> stack = new Stack<>();\n\
    \        stack.push(1);\n        stack.push(2);\n        System.out.println(stack);\n\
    \        System.out.println(stack.get(0)); // 获取第一个元素\n    }\n}\n```\n输出：[1, 2]\n\
    \n代码分析：\n\n首先注意到，Stack 的 `push` 方法实际上并没有将元素推到第一个位置。\n另一个有趣点是，可以通过索引访问元素。对于 Stack，`peek`\
    \ 方法将获取最后一个元素。\n正如你所看到的，`Stack` 类在实现上存在一些缺陷。\n与其使用 `Stack` 类，不如使用 `Deque` 来进行栈操作。让我们探索使用\
    \ `Deque` 来实现栈的方法...\n\n## 配合 Deque 使用 Stack\n\nJava 中 `Stack` 类的文档如下：\n\n更完整且一致的\
    \ LIFO（后进先出）操作由 `Deque` 接口提供，例如：`Deque stack = new ArrayDeque();`\n因此，处理栈操作时，使用\
    \ `Deque stack = new ArrayDeque();` 更有效。\n\n`Deque` 接口拥有栈的操作，它也是一个双端队列。在不需要线程安全操作的情况下，推荐使用\
    \ `Deque`。\n通过 `Deque`，我们可以执行与 `Stack` 类相同的操作，元素是从顶部到底插入的，这是栈数据结构预期的：\n\n## Stack\
    \ 81\n\n```java\nimport java.util.ArrayDeque;\nimport java.util.Deque;\npublic\
    \ class StackDeque {\n    public static void main(String[] args) {\n        Deque<Integer>\
    \ stack = new ArrayDeque<>();\n        stack.push(1); // 在第一个位置插入元素\n        stack.push(2);\n\
    \        System.out.println(stack); // LIFO \n        System.out.println(stack.peek());\
    \ // 显示最后一个元素\n        System.out.println(stack.pop()); // 移除并返回\n    }\n}\n```\n\
    输出：[2, 1]\n\n在 Deque 接口中，有与 push 和 pop 相同的方法。\npush 方法等同于 `addLast` 方法，而 `removeLast`\
    \ 方法等同于 `pop` 方法，如下所示：\n\n```java\nimport java.util.ArrayDeque;\nimport java.util.Deque;\n\
    public class DequeMethods {\n    public static void main(String[] args) {\n  \
    \      Deque<Integer> stack = new ArrayDeque<>();\n        stack.addLast(1);\n\
    \        stack.addLast(2);\n\n        System.out.println(stack.getLast());\n \
    \       stack.removeLast();\n    }\n}\n```\n输出：2 [1]\n\n## Stack 的时间复杂度\n\n栈的时间复杂度取决于所使用的实现。如果我们选择\
    \ `LinkedList`，我们将处理图结构。如果我们选择 `ArrayDeque`，它是一个数组数据结构。\n让我们探索 `LinkedList` 和\
    \ `ArrayDeque` 之间的时间复杂度差异。\n\n## push (addFirst)\n\nLinkedList：无论如何，`push` 方法的时间复杂度都是\
    \ `O(1)`。因为 `LinkedList` 连接节点（Nodes），它不是数组。第一个元素总是被添加到单独的变量中，实现了快速访问。\nArrayDeque：`push`\
    \ 方法可能为 `O(1)`，前提是不需要调整数组。如果数组满了，偶尔时间复杂度将是 `O(n)`，因为它需要遍历数组并创建一个新大小的数组。\n\n##\
    \ pop (removeLast)\n\nLinkedList：`pop` 方法的时间复杂度始终为 `O(1)`。因为元素是相互链接的，第一个元素存储在变量中，我们可以直接访问。因此，我们只需要删除该第一个元素的引用。\n\
    ArrayDeque：`ArrayDeque` 的 `pop` 方法始终为 `O(1)`。因为数组的第一个元素会被设置为 null，头部索引会更新以不再考虑已删除的元素。\n\
    \n## 查找元素\n\nArrayDeque：要通过值查找元素，必须遍历所有元素直到找到该元素。与 `LinkedList` 类似，时间复杂度为 `O(n)`。\n\
    \n## 总结\n\n栈数据结构用于递归和著名的深度优先搜索算法，它对其他操作也有用！\n让我们看看栈数据结构的关键点：\n\n- 它类似于现实生活中堆叠盘子并从栈取出。\n\
    - 它使用 LIFO（后进先出）策略。这意味着最后添加的元素将最先取出。\n- 我们可以使用 `Stack` 类，但正如之前看到的，它不是最优选择。\n-\
    \ `Stack` 类是线程安全的。这意味着可以在多线程环境中安全使用。\n- `Stack` 类并没有按 LIFO 结构插入元素。元素按插入顺序添加。\n\
    - `Stack` 类继承自 `Vector`，因此可以通过索引访问元素。\n- 使用 `ArrayDeque` 实现的 `Deque` 优于使用 `Stack`\
    \ 类。（此处后续重复的句已按逻辑精简）\n"
