    \    for (int i = 0; i < array.length - 1 - counter; i++) {\n                if\
    \ (array[i] > array[i + 1]) {\n                    swapElements(array, i, i +\
    \ 1);\n                }\n            }\n            counter++;\n        }\n \
    \       return array;\n    }\n    // 省略 swapElements 方法\n}\n```\n\n## 冒泡排序\n\n\
    ## 代码分析：\n\n首先，如果我们比较未优化的冒泡排序和优化化的冒泡排序之间的迭代次数，取决于输入数组，其差异是巨大的。使用代码示例中的数组，在未优化的冒泡排序中，我们进行了\
    \ 21 次迭代，而在优化化的冒泡排序中，我们进行了 11 次迭代。\n\n代码的区别在于，我们不再无视地比较每个元素，而是使用了 `isSorted` 标志。我们将上一个元素与下一个元素进行排序，并根据需要遍历整个数组，直到其完全排序为止。\n\
    \n如果一个包含 7 个元素的数组已经排序，那么使用优化化的冒泡排序将只需要 7 次迭代。相比之下，使用未优化的冒泡排序算法将会有 21 次迭代。\n\n\
    因此，在实现冒泡排序算法时，记住实现优化后的算法以提高性能！\n\n## 大 O (O) 表示法\n\n**时间复杂度：** 由于我们有两个循环，因此它是\
    \ O(n^2)。\n\n**空间复杂度：** 它在原地对数组排序，这意味着 O(1)。\n\n## 总结\n\n冒泡排序非常简单，如你所见：\n\n- 它遍历数组\n\
    - 它交换元素\n- 它在性能方面效率低下\n\n"
