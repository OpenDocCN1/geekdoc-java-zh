    \n图 38. 图遍历\n\n为了表示上面的图，我们将使用以下类：\n\n```java\nimport java.util.ArrayList;\nimport\
    \ java.util.List;\n\npublic class Node {\n    Object value;\n    private List<Node>\
    \ adjacentNodes = new ArrayList<>();\n    private boolean visited;\n\n    public\
    \ Node(Object value) {\n        this.value = value;\n    }\n\n    public void\
