    - We can choose the first, last, random element. Also, we can use the median of\
    \ three strategies to select the number in the middle from the first, middle,\
    \ and last elements.\n- We sort the partitions recursively on each method invocation.\
    \ When the partitions are small enough, there won't be any remaining elements\
    \ to be sorted. Therefore, the array will be already sorted.\n\n## Merge Sort\n\
    \nThe merge sort is a sorting algorithm that uses a divide-and-conquer strategy\
    \ to sort an array of elements. It is an efficient sorting algorithm, with an\
    \ average time complexity of O(n log n).\n\nThe merge sort algorithm works by\
    \ recursively dividing the input array into two halves until each half contains\
    \ only one element or is empty. Then, it merges the sorted subarrays back together\
    \ to produce the final sorted array.\n\nThe merge step involves comparing the\
    \ first element of each subarray and selecting the smaller one to be placed into\
    \ the final array. This process continues until all elements have been merged\
    \ into the final array.\n\nOne of the advantages of merge sort is that it is a\
    \ stable sorting algorithm, meaning that elements with the same value will retain\
    \ their original order in the sorted array. Additionally, merge sort can be easily\
    \ implemented in a parallelized manner, making it a popular choice for large-scale\
    \ sorting applications.\n\nLet's see a diagram from the Merge sort to have an\
    \ idea of how it works and also what is the order of execution:\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_161_0.png)\n\
    \n**Red Element Squares**: The elements are still being divided and not sorted\
    \ yet. **Grey Element Squares**: There is only one element, therefore, the array\
    \ is fully divided. **Green Element Squares**: the merge starts being done and\
    \ also the sorting of all elements.\n\nThe number beneath each element represents\
    \ the order of execution in the algorithm. If we debug the code, we will see that\
    \ the execution order will be exactly the same.\n\n## Merge Sort Code with Java\n\
    \nThe following code uses recursion, and if you didn't fully master it, I suggest\
    \ going back to the recursion chapter until you fully understand it.\n\nNow, notice\
    \ in the following code that the left and right arrays will be divided, then they\
