    \n选择排序通过比较每个数字并在每次发现更小的元素时更新最小元素索引，来选择数组中的最小元素。\n\n一旦找到数组的最小索引，它就会将该元素交换到数组的最左侧（左子数组），并继续操作，直到数组完全排序完毕。\n\
