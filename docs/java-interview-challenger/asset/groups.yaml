  mdcn: "\n\n# 哈希表\n\n```java\nvar endTime = System.currentTimeMillis() - startTime;\n\
    System.out.println(\"O(n) without collision: \" + endTime);\n}\nstatic class CollisionBean\
    \ {\n    private Integer value;\n\n    public CollisionBean(Integer value) {\n\
    \        this.value = value;\n    }\n\n    @Override\n    public boolean equals(Object\
    \ o) {\n        CollisionBean that = (CollisionBean) o;\n        return Objects.equals(value,\
    \ that.value);\n    }\n\n    @Override\n    public int hashCode() {\n        return\
    \ 1; // Always the same hash code forcing a hash collision\n    }\n}\nstatic class\
    \ NoCollisionBean {\n    private Integer value;\n\n    public NoCollisionBean(Integer\
    \ value) {\n        this.value = value;\n    }\n\n    @Override\n    public boolean\
    \ equals(Object o) {\n        CollisionBean that = (CollisionBean) o;\n      \
    \  return Objects.equals(value, that.value);\n    }\n    @Override\n    public\
    \ int hashCode() {\n      return value; // Different hash code, no hash collision\n\
    \    }\n}\n```\n\n输出（结果可能会略有不同）：发生冲突的 O(n ^ 2): 771；无冲突的 O(n): 4\n\n如上代码所示，这种性能差异是巨大的！在添加和搜索\
    \ 10000 个元素时，`NoCollisionBean` 的速度比 `CollisionBean` 快 192 倍。添加的元素越多，这种差异也越大。\n\
    \n另一个重要的点是，在循环内部我们的时间复杂度是 O(n)，但当发生哈希冲突时，会有另一个 O(n)。当我们在 O(n) 的时间复杂度循环内又嵌套一个 O(n)\
    \ 操作时，复杂度就会变成 O(n ^ 2)。\n\n这是因为为了在链表（LinkedList）中搜索元素，必须遍历整个节点列表然后检索该元素。\n\n#\
    \ 在 Java 中优化哈希冲突\n\n在 Java 9 中，JEP (JDK 增强提案) 180 “使用平衡树处理频繁的 HashMap 冲突” 是一项优化，它将哈希冲突后的链表转换为平衡树。这意味着链表中的节点将以某种方式排序，可以使用二分搜索算法。\n\
    \n# 哈希表\n\n58\n\n通过使用二分搜索算法，我们将时间复杂度从 O(n) 降低到 O(log n)，这要**快得多**。要实现这一特性，非常关键的一点是我们需要实现\
    \ `Comparable` 接口并重写 `compareTo` 方法。这是对象在平衡树内进行比较和排序的唯一方法。\n\n让我们在实践中观察这种巨大的复杂度差异。首先，创建一个实现\
    \ `Comparable` 的 `CollisionComparableBean`，以便 JDK 能够创建平衡树。\n\n然后，我们重复之前的步骤，但添加\
    \ 10000 个元素并搜索每个元素。由于使用二分搜索查找每个元素要**快得多**，即使发生哈希冲突，你也将从下面的代码中看到性能的巨大提升：\n\n```java\n\
    public class HashCollisionInPractice {\n    public static void main(String[] args)\
    \ {\n        collisionTest();\n        noCollisionTest();\n        collisionWithBalancedTest();\n\
    \    }\n\n    // 省略其他方法...\n    private static void collisionWithBalancedTest()\
    \ {\n        Map<CollisionComparableBean, Integer> collisionMap = new HashMap<>();\n\
    \        var startTime = System.currentTimeMillis();\n        // O(n)\n      \
    \  for (int i = 0; i < 10000; i++) {\n            collisionMap.put(new CollisionComparableBean(i),\
    \ i);\n            // O(log n)\n            collisionMap.get(i);\n        }\n\
    \    }\n}\n```\n\n```java\nvar endTime = System.currentTimeMillis() - startTime;\n\
    System.out.println(\"O(n) with collision and a balanced tree = \" + endTime);\n\
    }\nstatic class CollisionBean\nimplements Comparable<CollisionBean> {\n    private\
    \ Integer value;\n\n    public CollisionBean(Integer value) {\n        this.value\
    \ = value;\n    }\n\n    @Override\n    public boolean equals(Object o) {\n  \
    \      CollisionBean that = (CollisionComparableBean) o;\n        return Objects.equals(value,\
    \ that.value);\n    }\n\n    @Override\n    public int hashCode() {\n        return\
    \ 1; // Always the same hash code forcing a hash collision\n    }\n\n    @Override\n\
    \    public int compareTo(CollisionBean o) {\n        return this.value.compareTo(o.value);\n\
    \    }\n```\n\n输出（结果可能会略有不同）：发生冲突的 O(n ^ 2): 771；无冲突的 O(n): 4\n\n"
