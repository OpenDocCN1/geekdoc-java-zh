- md: "\n## Selection Sort\n\nThe Selection sort is not the most performant but it's\
    \ an easy one to implement. Simply put, the selection sort will have two subarrays.\
    \ The sorted part in the left, and the unsorted part is on the right.\n\nThe selection\
    \ sort will select the smallest element of the array by comparing each number\
    \ and changing the smallest element index whenever it finds a smaller element.\n\
    \nOnce it finds the smallest index of the array it will swap this element to the\
    \ left-most part of the array (left subarray) and will continue until the array\
    \ is fully sorted.\n\nLet's see what is the idea with the following diagram:\n\
    \n![](img/508455d7d9cdb199f1cdef01c90e5d26_149_0.png)\n\nFigure 35. Selection\
    \ Sort\n\n## Selection Sort\n\n```java\nimport java.util.Arrays;\n\npublic class\
    \ SelectionSort {\n    public static void main(String[] args) {\n        int[]\
    \ array = {5, 2, 3, 7, 1};\n        var sortedArray = sort(array);\n        System.out.println(Arrays.toString(sortedArray));\n\
    \    }\n\n    static int[] sort(int[] array) {\n        if (array.length == 1)\
    \ {\n            return array;\n        }\n\n        var firstUnsortedIndex =\
    \ 0;\n        while (firstUnsortedIndex < array.length - 1) {\n            var\
    \ smallestElementIndex = firstUnsortedIndex;\n            for (int i = firstUnsortedIndex;\
    \ i < array.length; i++) {\n                if (i != smallestElementIndex && array[i]\
    \ < array[smallestElementIndex]) {\n                    smallestElementIndex =\
    \ i;\n                }\n            }\n            swapElements(array, firstUnsortedIndex,\
    \ smallestElementIndex);\n            firstUnsortedIndex++;\n        }\n     \
    \   return array;\n    }\n}\n```\n\n## Selection Sort\n\n```java\n    private\
    \ static void swapElements(int[] array, int i, int j) {\n        var temp = array[i];\n\
    \        array[i] = array[j];\n        array[j] = temp;\n    }\n}\n```\n\n**Output:\
    \ [1, 2, 3, 5, 7]**\n\nCode analysis:\n\n- Initialize variables firstUnsortedIndex\
    \ and smallestIndex with 0. while looping iterate over the whole array.\n- Set\
    \ the firstUnsortedIndex to the smallestIndex to avoid comparisons with already\
    \ sorted elements.\n- Iterate the array to find the smallestIndex.\n- When the\
    \ whole array is iterated, swap the smallest element to the left subarray.\n-\
    \ Increase the firstUnsortedIndex to do the operation again until the end of the\
    \ array.\n\n## Selection Sort By Comparing Element Lowest Value\n\n```java\npublic\
    \ class SelectionSort { // Omitted above code\n\n    public static int[] sortMaxValue(int[]\
    \ array) {\n        var smallestElementIndex = 0;\n        for (int i = 0; i <\
    \ array.length; i++) {\n            var smallestElement = Integer.MAX_VALUE;\n\
    \            for (int j = i; j < array.length; j++) {\n                if (array[j]\
    \ < smallestElement) {\n                    smallestElement = array[j];\n    \
    \                smallestElementIndex = j;\n                }\n            }\n\
    \            swapElements(array, i, smallestElementIndex);\n            smallestElementIndex\
    \ = 0;\n        }\n        return array;\n    }\n    // Omitted swapElements method\n\
    }\n```\n\n## Code analysis:\n\nThe code above will do the same as the first code\
    \ example but the difference is that instead of comparing the elements from the\
    \ array directly, we are setting the smallest number to a variable smallestElement.\
    \ It's a different code technique to solve the same problem.\n\n## Big (O) Notation\
    \ Complexity\n\nTime Complexity: Since the iteration happens first for the “sorted\
    \ subarray” and then goes through the “unsorted subarray” the complexity will\
    \ be O(n^2). Keep in mind that this is not a precise number and it's the worst-case\
    \ scenario for this algorithm.\n\nSpace Complexity: Since we only swap some numbers\
    \ in the array in place, the space complexity for this algorithm is O(1).\n\n\
    ## Summary\n\nThe selection sort is not very performant but it’s easy enough to\
    \ implement. Let's see the main points of this algorithm:\n\n- The left part of\
    \ the array will be sorted and the right part will be unsorted.\n- The smallest\
    \ element index will be selected. Once it’s selected the array values are swapped.\n\
    - It’s possible to sort elements by comparing the array elements or comparing\
    \ the smallest number from another variable.\n\n## Quicksort\n\nThe Quicksort\
    \ algorithm is one of the most effective for Java and any other programming languages.\
    \ It's used behind the scenes in many JDK API methods for example.\n\n### Choosing\
    \ the pivot with the Quicksort Algorithm\n\nThe first step to the Quicksort algorithm\
    \ is to choose the pivot number. The pivot number ideally should be a number that\
    \ when the array is fully sorted would be right in the middle.\n\nIt doesn't need\
    \ to be exactly the number in the middle of the array. Instead, we try to choose\
    \ an element that will be close to it. A technique that is commonly used for that\
    \ is the median of three. The idea is that we pick the first, middle, and last\
    \ elements of the array, sort them, and finally choose the element in the middle.\
    \ The pivot number is the middle close to it, then we will have a time complexity\
    \ of O(n n).\n\n## Creating Partitions with the Quicksort\n\nAlternatively, we\
    \ can simply pick the first or last element of the array. But if the pivot is\
    \ the smallest or greatest of the array, the partitions will be created from the\
    \ left and right.\n\nLet’s see how the Quicksort works in the following:\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_149_0.png)\n\
