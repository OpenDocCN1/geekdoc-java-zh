    # Be Risk Taker


    Paradoxically, taking risks is much safer than not taking risks at all. Imagine
    a developer who stays in the same company for more than 10 years and only uses
    old technologies. Then, suddenly his boss reaches out to him and get fired.


    Therefore, because the developer didn''t get out of his comfort zone, now he has
    to face the market with skills that are obsolete and he will be looking for jobs
    without a job which is not a good position.


    If the developer had tried to look other companies and had some interviews he
    would know what the market was asking. But because he didn''t take any, now he
    has to do lots of interviews without preparation.


    Remember, always take calculated risks, don''t be the accomodated developer. Be
    an action taker instead!


