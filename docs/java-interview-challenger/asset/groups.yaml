    \ O(1)。\n\n## 总结\n\n选择排序的性能不是很好，但非常容易实现。让我们来看看该算法的要点：\n\n- 数组的左部分将被排序，右部分将保持未排序状态。\n\
    - 将选择最小元素的索引。一旦选中，就会对数组值进行交换。\n- 可以通过比较数组元素或比较另一个变量中的最小值来对元素排序。\n\n## 快速排序 (Quicksort)\n\
    \n快速排序算法是 Java 以及任何其他编程语言中最有效的算法之一。例如，它在许多 JDK API 方法背后被使用。\n\n### 使用快速排序算法选择基准值\
