    ## Java 面试流程


    面试是困难的，而且往往是棘手的，如果我们不知道通过面试的规则，很可能会失败。


    在面试时需要记住的一个重要点是，它们并不一定测试你作为软件工程师的技能。面试有其局限性，本可以改进。例如，如果我们很久没有练习算法且需要了解某些数据结构，我们很可能会通过面试。


    因此，理解游戏规则非常重要。否则，我们将无法通过那些面试。


    在很多面试中被拒绝并感到挫败是正常情绪。我曾多次在面试中被拒绝并感到沮丧，但我们需要时刻记住，面试不会定义我们作为软件工程师的优劣。它会测试某些技能，但日常工作是完全不同的。


    这就是我创建这一章的原因，为了让你理解面试游戏的规则，从而通过那些面试。


    ## 面试心态


    不要被职位描述中看到的各种技术所吓倒，因为没有人能真正深入了解所有这些技术。相反，了解这些技术的作用通常就足够了。


    此外，将面试失败视为成长的必要步骤。失败只是通往成功的垫脚石。关键在于学习我们为什么失败，改进并再次尝试。


    Java 面试流程


    面试次数越多，表现得越好。记住这一点，永远不要停止学习以通过面试。


    好消息是，读完这本书后，你将拥有解决任何算法的坚实基础，以及对系统设计的广博理解。你还将获得一些见解来助力你的职业！


    ## 简历


    你的简历必须包含与市场需求相关的信息。假设你在简历中写道知道 Struts 或任何其他过时的技术。这并不重要。这就是为什么你必须使简历与市场需求保持一致。


    这并不意味着你必须在简历上撒谎。相反，你需要诚实，因为他们会在面试中询问你在简历中包含的概念。如果你不了解该技术，他们可能会立即淘汰你，因为面试官会注意到的这一点。


    确保写出你工作经验中最大的亮点。在简历顶部，包含你的工作年限以及你为之前公司取得的成果。尝试使用数字。例如，如果你重构了前公司的大量代码，你可以在简历上这样写：


    -   通过重构代码和创建通用组件，将开发者的效率提升了 25%。


