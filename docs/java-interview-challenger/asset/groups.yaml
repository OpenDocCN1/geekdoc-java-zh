    **Time Complexity:** Since we have two loopings and we compare every element in
    the array, the performance is not good. It has exponential complexity. The time
    complexity is O(n^2) which translates to (number of elements of the array * number
    of elements of the array). Also, keep in mind that this number doesn''t need to
    be very precise, it''s a rough estimation needed.


    In our code example using an unsorted array of 7 elements, we iterate over the
