    \ }\n    // 省略 swapElements 方法\n}\n```\n\n## 代码分析：\n\n上面的代码实现与第一个代码示例相同，但区别在于我们不是直接比较数组中的元素，而是将最小数值赋值给变量\
    \ `smallestElement`。这是解决同一个问题的不同代码技术。\n\n## 大 O (O) 符号复杂度\n\n时间复杂度：由于迭代首先发生在“已排序子数组”上，然后遍历“未排序子数组”，因此复杂度将为\
