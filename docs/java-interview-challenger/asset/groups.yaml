    Breadth-First Search


    Time Complexity: When we traverse through a Graph, the complexity will be O(v+e)
    because for every vertex that is inserted into the queue the child nodes will
    be also inserted. The number of child nodes is exactly the number of edges. Therefore,
    the time complexity will be O of vertices + edges.


    Space Complexity: O(v) because the data inserted into the queue will be exactly
    the number of vertices from the graph or tree.


    Important: To learn more and fully absorb this algorithm, get the code (https://github.com/rafadelner/java-algorithms/tree/main/src/main/java/fundamentals/bfs)[https://github.com/rafadelner/java-algorithms/tree/main/src/main/java/fundamentals/bfs]
    and run your own tests.


    # Summary


    +   - The Breadth-first Search algorithm uses a queue FIFO (First-in-out) approach.
    - The nodes are visited level by level. There is no need to check if the node
    was visited when traversing a tree since a tree can''t be cyclic. When we traverse
    a graph, it''s necessary to check if the node was already visited, otherwise,
    there will be an infinite loop.'
