  mdcn: "\n\n# 总结\n\n哈表（Hash Table）是一个至关重要的数据结构，它存在于所有的编程语言中。因此，通过理解 Java 在后台是如何处理哈表的，你基本上就知道了如何操作哈表、字典（Dictionary）、HashMap\
    \ 或任何编程语言中的类似结构。\n\n基本上，从本质上说，哈表是一种用于存储键值对的数据结构。通过键检索数据非常快，而且如果我们使用有效的 `hashCode`\
    \ 实现，极少发生哈希冲突。\n\n让我们来看看哈表数据结构的关键点：\n\n- 它是一种处理键（key）和值（value）的数据结构。\n- 如果没有哈希冲突，搜索非常快，是\
    \ O(1)。\n- 如果发生哈希冲突且没有平衡树，通过键进行搜索的时间复杂度为 O(n)。\n- 如果发生哈希冲突且存在平衡树，通过键进行搜索的时间复杂度为\
    \ O(log n)。\n- 为了在发生哈希冲突时能够使用平衡树，必须实现 `Comparable` 接口。\n- 在哈表中搜索某个值（而不是键）的时间复杂度为\
    \ O(n)。\n- 哈表的键在底层是一个数组，可以通过哈希码进行访问。这就是为什么在没有哈希冲突时时间复杂度为 O(1)。\n- 当发生哈希冲突时，键和值将被插入到一个链表（LinkedList）中。此时通过键搜索元素的时间复杂度为\
    \ O(n)。\n\n# 链表\n\n链表数据结构在 Java 和其他编程语言中是一种基础类型，在添加或删除元素时具有极高性能。\n\n链表的工作方式与数组不同。数组存储在内存中，通过索引找到元素非常容易且高效。另一方面，链表是对象的链，每个对象都持有内存中的一个随机位置（非连续性）。因此，在链表中通过索引找到元素是不可能的。\n\
    \n# 单向链表结构\n\n由于链表在底层是对象的链，我们将拥有一个存储当前元素值的变量，以及另一个指向下一个对象的引用变量。\n\n让我们通过图来看看它是如何工作的：\n\
    \n![](img/508455d7d9cdb199f1cdef01c90e5d26_70_0.png)\n\n图 8. 链表\n\n如上图所示，链表中的每个元素都持有指向下一个元素的引用。请注意，只能向前移动。因此，如果我们从第一个元素开始，只能移动到链表的下一个对象引用。\n\
    \n首先，为了拥有链表，我们需要一个 `Node` 对象，它将包含一个值和一个对象引用。`Node` 类如下：\n\n```java\n// 源自链表的 Node，包含值和下一个对象引用\n\
    public class Node {\n    int value;\n    Node next;\n\n    public Node(int value)\
    \ {\n        this.value = value;\n        next = null;\n    }\n}\n```\n\n现在我们有了\
    \ `Node` 类，让我们用它将元素存储到我们的链表中。在下面的代码中，我们将第一个和最后一个元素存入链表。然后我们将会有一个构造函数，使用第一个和最后一个元素初始化链表。\n\
    \n这是我们需要添加、删除、搜索或更改元素的结构结构：\n\n```java\npublic class SinglyLinkedList {\n    //\
    \ 第一个元素\n    Node head;\n    // 最后一个元素\n    Node tail;\n\n    // 当链表创建时，headValue\
    \ 将是第一个也是最后一个元素\n    SinglyLinkedList(int value) {\n      Node newNode = new Node(value);\n\
    \      head = newNode;\n      tail = newNode;\n    }\n}\n```\n\n# 向链表添加元素\n\n\
    现在让我们探索如何在下一个对象引用处添加新节点，以及用于遍历节点并显示值的 `showElements` 方法。\n\n最后，我们有一个 `main` 方法来实例化链表、添加节点并显示其元素：\n\
    \n向链表添加元素非常快，但它的时间复杂度是 O(1)。这是因为新元素只需要与链表的最后一个元素连接起来。例如，不需要将元素复制到新的数组对象中。\n\n\
    ```java\npublic class SinglyLinkedList {\n  // 省略实例变量和构造函数\n  // 在下一个引用处添加新节点\n\
    \  // 将新节点添加到链表的末尾（结束）\n  void add(int value) {\n    Node nodeValue = new Node(value);\n\
    \    tail.next = nodeValue;\n    tail = nodeValue;\n  }\n}\n```\n\n# 代码分析：\n\n\
    在上面的代码中，我们使用传递的值创建了一个新节点，然后将此值设置为尾部（tail）的下一个指针。\n\n注意，此时尾部（最后一个元素）持有与头部（第一个元素）相同的对象引用。这就是对象将正确链链的原因。\n\
    \n然后，我们将元素添加到尾部对象，因为这是链表中的最后一个对象。\n\n# 向链表添加元素的时间复杂度\n\n注意上面的代码，链表中的 `add` 操作非常简单。因此，由于我们只执行了值赋值，时间复杂度将是\
    \ O(1)。不需要遍历链表。\n\n# 删除链表中的第一个元素\n\n从链表中删除第一个元素也是一个简单的操作。要实现这一点，我们需要将下一个对象的引用传递给\
    \ `head` 实例变量。通过这样做，我们将擦除链中的第一个元素，并留下后续元素的链：\n\n```java\npublic class SinglyLinkedList\
    \ {\n    // 省略实例变量、构造函数和方法\n    void deleteFirst() {\n        head = head.next;\n\
    \    }\n\n    public static void main(String[] args) {\n        SinglyLinkedList\
    \ linkedList = new SinglyLinkedList(1);\n        linkedList.add(2);\n\n      \
    \  linkedList.deleteFirst();\n        linkedList.showElements();\n    }\n}\n```\n\
    \n**输出：2**\n\n# 删除第一个元素复杂度\n\n从链表中删除第一个元素也是不需要循环的操作。我们可以直接访问头部元素。因此，时间复杂度是即时的\
    \ O(1)。\n\n# 在链表中搜索元素\n\n要在链表中搜索元素，我们需要遍历并检查值。让我们看看代码中是如何工作的：\n\n```java\npublic\
    \ class SinglyLinkedList {\n    // 省略实例变量、构造函数和方法\n\n    Node searchElement(int\
    \ value) {\n        Node currentNode = head;\n\n        while (currentNode !=\
    \ null) {\n            if (currentNode.value == value) {\n                return\
    \ currentNode;\n            }\n            currentNode = currentNode.next;\n \
    \       }\n\n        return null;\n    }\n\n    public static void main(String[]\
    \ args) {\n        SinglyLinkedList linkedList = new SinglyLinkedList(1);\n  \
    \      System.out.println(\"Found element: \" + linkedList.searchElement(1).value);\n\
    \    }\n}\n```\n\n**输出：Found element: 1**\n\n在上面的代码中，注意我们传递了 int 值，然后从头部开始遍历。\n\
    \n为了遍历对象链，我们检查 `currentNode` 是否为空，并在循环中将元素赋值给当前节点，直到 `currentNode` 为空。\n\n# 在链表中搜索元素复杂度\n\
    \n由于我们需要遍历链表来搜索元素，时间复杂度为 O(n)。\n\n# 在链表中间插入元素\n\n要在链表的中间插入元素，需要遍历对象并将元素连接到对象链中。\n\
    \n让我们看看代码中是如何工作的：\n\n```java\npublic class SinglyLinkedList {\n    // 省略实例变量、构造函数和方法\n\
    \n    void add(int searchValue, int value) {\n        Node currentNode = head;\n\
    \n        while (currentNode != null) {\n            if (currentNode.value ==\
    \ searchValue) {\n                Node newNode = new Node(value);\n          \
    \      Node nextNode = currentNode.next;\n                currentNode.next = newNode;\n\
    \                newNode.next = nextNode;\n            }\n            currentNode\
    \ = currentNode.next;\n        }\n    }\n}\n```\n\n"
