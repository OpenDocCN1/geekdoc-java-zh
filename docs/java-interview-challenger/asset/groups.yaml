    \ partially sorted input arrays because it will sort and merge only the unsorted\
    \ part of the array.\n\n## Depth-first-search\n\nThe depth-first-search algorithm\
    \ is used a lot in algorithms where it's necessary to traverse through nodes.\
    \ This algorithm is likely not to be used in day-to-day work directly. However,\
