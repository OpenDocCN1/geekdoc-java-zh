    # # Summary


    The Graph data structure is highly important to be mastered by every software
    developer. It’s vastly used behind the scenes by frameworks, libraries, and technologies.
    That’s the reason why it’s vastly asked in many companies during interviews.

    To recap, let’s see the important points:


    +   - Graphs contain nodes (vertices) and connections (edges). Some real examples
    are friends connections from social media, and a vehicle going from one point
    to another.

    - An adjacent or neighbor node is the direct relationship from one node to the
    other one.

    - A graph can be directed, which means one node can reach the other one but the
    other one can’t.

    - A graph can be undirected, which means that the connection with another node
    will be bidirectional.

    - A graph can be acyclic, meaning that there won’t be cycles between the nodes’
    relationships.

    - A graph can be cyclic, meaning that there will be cycles between the nodes’
    relationships.'
