- md: "\n# Summary\n\nThe Hash Table is a crucial data structure to understand and\
    \ it's present in all programming languages. Therefore, by understanding how Java\
    \ handles it behind the scenes you will pretty much know how to manipulate the\
    \ Hash Table, Dictionary, HashMap, or whatever the name from any programming language.\n\
    \nBasically, in essence, a Hash Table is a data structure to store key-value data.\
    \ It's fast to retrieve data by key and will have hash collision very rarely if\
    \ we are using effective hashCode implementations.\n\nLet's see the key points\
    \ of the Hash Table data structure:\n\n- It is a data structure to handle key\
    \ and value.\n- To search data it's pretty fast if there is no hash collision.\
    \ It's O(1).\n- If there is a hash collision and no balanced tree, the time complexity\
    \ to search by key will be O(n)\n- If there is a hash collision and balanced tree,\
    \ the time complexity to search by key is O(log n).\n- To enable a balanced tree\
    \ to be used when there is a hash collision, it's necessary to implement Comparable.\n\
    - To search a value (not the key) into a Hash Table we will have the time complexity\
    \ of O(n).\n- The keys of a Hash Table are an array behind the scenes that can\
    \ be accessed by a hash code. That's why we have the time complexity of O(1) when\
    \ there is no hash collision.\n- When there is a hash collision, the key, and\
    \ value will be inserted in a LinkedList. Then the time complexity to search an\
    \ element by the key will be O(n).\n\n# Linked List\n\nThe Linked List data structure\
    \ with Java and other programming languages is a fundamental type that is highly\
    \ performant for adding or removing elements.\n\nA Linked List works differently\
    \ than an array. An array is stored in memory where it's very easy and performant\
    \ to find an element by index. A Linked List on the other hand is a chain of objects\
    \ and each object holds a random place in memory (not contiguous). Therefore,\
    \ it's impossible to find an element by index in the Linked List.\n\n# Singly\
    \ Linked List Structure\n\nSince a Linked List behind the scenes is a chain of\
    \ objects, we will have a variable value with the value of the current element,\
    \ and another variable next to point to the next object reference.\n\nLet's see\
    \ how that works in a diagram:\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_70_0.png)\n\
    \nFigure 8. Linked List\n\nAs you can see in the above diagram each element from\
    \ the Linked List holds a reference to the next element. Notice also that it's\
    \ only possible to go forward. Therefore, if we start from the first element we\
    \ can only go to the next object reference from the Linked List.\n\nFirst of all,\
    \ to have a Linked List we need the Node object that will hold a value and the\
    \ next object reference. The Node class is as the following:\n\n```java\n// Node\
    \ from Linked List, contains value and next object reference\npublic class Node\
    \ {\n    int value;\n    Node next;\n\n    public Node(int value) {\n        this.value\
    \ = value;\n        next = null;\n    }\n}\n```\n\nNow that we have the Node class,\
    \ let's use it to store elements into our Linked List. In the following code,\
    \ we will store the first and last elements into the Linked List. Then we will\
    \ have a constructor initializing the Linked List with the first and last element.\n\
    \nThat's the code structure we need to add, remove, search or change an element:\n\
    \n```java\npublic class SinglyLinkedList {\n    // First element\n    Node head;\n\
    \    // Last element\n    Node tail;\n\n    // headValue will be the first and\
    \ last element\n    // when the Linked List is created\n    SinglyLinkedList(int\
    \ value) {\n      Node newNode = new Node(value);\n      head = newNode;\n   \
    \   tail = newNode;\n    }\n}\n```\n\n# Add Elements to Linked List\n\nLet’s now\
    \ explore how to add a new node in the next object reference, also the showElements\
    \ method to traverse nodes and show their values.\n\nFinally, we have a main method\
    \ instantiating the Linked List, adding nodes and showing its elements:\n\nAdding\
    \ elements to a Linked List is pretty fast, but it has the time complexity of\
    \ O(1). That’s because the new element just need to be chained with the last element\
    \ of the Linked List. There is no need to copy elements to a new array object\
    \ for example.\n\n```java\npublic class SinglyLinkedList {\n  // Omitted instance\
    \ variables and constructor\n  // Add new node to the next reference\n  // Add\
    \ new node to the tail (end) of the Linked List\n  void add(int value) {\n   \
    \ Node nodeValue = new Node(value);\n    tail.next = nodeValue;\n    tail = nodeValue;\n\
    \  }\n}\n```\n\n# Code analysis:\n\nIn the code above we create a new node with\
    \ the passed value, then we set this value to the next pointer from the tail.\n\
    \nNotice that the tail (last element) at this moment holds the same object reference\
    \ from the head (first element). That’s the reason the objects will be chained\
    \ correctly.\n\nThen, we add the element to the tail object since this is the\
    \ last object from the Linked List.\n\n# Add Element to Linked List Time Complexity\n\
    \nNotice in the code above that the add operation in a Linked List is pretty simple.\
    \ Therefore, the time complexity will be O(1) since we only do a value assignment.\
    \ There is no need to traverse the Linked List.\n\n# Delete First Element from\
    \ Linked List\n\nDeleting the first element from a Linked List is also an easy\
    \ operation. To accomplish that we need to pass the next object reference to the\
    \ head instance variable. By doing that, we will be erasing the first element\
    \ from the chain and putting the second element that contains the other objects\
    \ from the chain:\n\n```java\npublic class SinglyLinkedList {\n    // Omitted\
    \ instance variables, constructor and methods.\n    void deleteFirst() {\n   \
    \     head = head.next;\n    }\n\n    public static void main(String[] args) {\n\
    \        SinglyLinkedList linkedList = new SinglyLinkedList(1);\n        linkedList.add(2);\n\
    \n        linkedList.deleteFirst();\n        linkedList.showElements();\n    }\n\
    }\n```\n\n**Output: 2**\n\n# Delete First Element Linked List Time Complexity\n\
