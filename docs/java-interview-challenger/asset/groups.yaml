    \ precise with the Big(O) time complexity we would have to write O(8). But notice\
    \ that this is a constant time. It doesn't depend on any external number. It's\
    \ also irrelevant, O(8) doesn't really change much performance. For this we can\
    \ consider O(8) is actually O(1).\n\nWhen assigning a variable will take the time\
