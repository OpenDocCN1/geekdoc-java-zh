    \ 2, 3, 7, 9, 10]**\n\n## 快速排序\n\n代码分析：\n\n注意 `quickSort` 方法有两个指针，`lowIndex` 是数组的最低索引，`highIndex`\
    \ 是数组的索引。\n\n然后我们将调用 `partition` 方法，它首先选择基准值，在我们的案例中，它是数组的最后一个元素，以便理解算法。然后，小于基准值的元素将到左侧，大于基准值的元素将到右侧。\n\
