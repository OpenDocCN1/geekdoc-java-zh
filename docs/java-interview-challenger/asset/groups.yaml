    \    private boolean visited;\n\n    public Node(Object value) {\n        this.value\
    \ = value;\n    }\n\n    public void addAdjacentNode(Node node) {\n        this.adjacentNodes.add(node);\n\
    \    }\n\n    public List<Node> getAdjacentNodes() {\n        return adjacentNodes;\n\
    \    }\n\n    public Object getValue() {\n        visited = true;\n        return\
