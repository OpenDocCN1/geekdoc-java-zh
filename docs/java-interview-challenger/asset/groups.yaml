    # Tree


    The tree data structure is a type of graph. A tree has a root node (top node)
    that will have a relationship with its child nodes. The path that connects the
    root node to the child nodes is called a branch. The leaf node is the node that
    doesn''t have any children and is not the root node.


    In algorithms, you will see a lot of the nomenclature height. Height in trees
    is the number of nodes from the highest branch to the root node. Another keyword
    is the depth of a tree which means the count of nodes from a specific node to
    the root node.


