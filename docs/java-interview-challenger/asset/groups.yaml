    然后，`i` 的每个元素都将与索引 `j` 另一个数组迭代中的元素进行比较。当所有元素都经过比较并排序后，冒泡排序完成。\n\n## 优化后的冒泡排序\n\n\
    注意，在上面的算法中存在整个数组已经排序的可能性。但如果在上面的代码中发生这种情况，我们仍然会遍历整个数组。我们无法通过代码来控制这一点。\n\n然而，在接下来的代码中，我们将看到一种方法可以在数组已经排序的情况下防止多次遍历数组。让我们来看看它是如何运作的：\n\
    \n```java\npublic class BubbleSort {\n    // 省略了上述代码\n    public static int[]\
    \ sortOptimized(int[] array) {\n        var isSorted = false;\n        var counter\
