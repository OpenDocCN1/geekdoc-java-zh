    - 字符串在底层存储的是一个字节数组。\n- Java 中的 String 是不可变的，这意味着无法直接修改它的值。\n- StringBuilder 和\
    \ StringBuffer 是 String 的可变类型，不会创建大量对象。\n- 当拼接不可变的 String 时，必须创建一个新数组然后进行 String\
    \ 复制。\n- String 可以转换为 ASCII 表中的代码，反之亦然。\n- 存在从 ASCII 扩展而来的 UTF-8 等。\n- ASCII 仅包含\
    \ 128 个字符，包括字母、数字和标点符号。\n- UTF-8 与 ASCII 表具有后兼容性，是目前最流行的编码。\n\n## 哈希表 (Hashtable)\n\
    \n哈希表数据结构将 Java 和其他编程语言中的键（keys）和值（values）存储在变量中。它也是一种非常常见的数据结构，广泛应用于日常项目和算法中。\n\
    \n让我们来看哈希表存储信息的简单示例：\n\n```\nkey: 1 value: Duke key: 2 value: Juggy key: 3 value:\
    \ Moby Dock\n```\n\n我们可以通过键访问任何值。哈希表是一种性能极佳的数据结构，因为平均插入、删除和搜索键的时间复杂度为 O(1)。\n\n\
    哈希表实际上是构建在数组之上的。例如在 Java 中，`Hashtable` 类包含一个键值对 Entry 数组：\n\n```java\n1 public\
    \ class Hashtable<K,V>\n2 extends Dictionary<K,V>\n3 implements Map<K,V>, Cloneable,\
    \ java.io.Serializable {\n4\n5 /**\n6  * 哈希表数据。\n7  */\n8 private transient Entry<?,?>[]>\
    \ table;\n9\n10 }\n```\n\n哈希表数据结构的另一个重要细节是，它有一个哈希函数来使键保持唯一。\n\n哈希函数将数据转换为一个特定的数字，可以通过键方便地进行。哈希函数的工作取决于对象的类型。例如，如果键是\
    \ String，它将通过 `hashCode` 的实现转换为 UTF-16 编码。\n\n注意，JDK 为我们提供了高质量的哈希函数，这意味着我们不需要通过创建其他函数来重复造轮。String、Integer、Double、Boolean\
    \ 以及许多其他类都有它们自己的 `hashCode` 实现。\n\n关于哈希函数需要记住的重要的一点是：它必须是高效的，并且可能可能为每个对象返回一个唯一的整数代码。\n\
    \n## 什么是哈希函数？\n\n哈希函数用于创建几乎不可逆的加密，其输入几乎无法检索。最流行的是 SHA256。此外，通常情况下，哈希函数主要用于密码验证、编译器操作、如\
    \ Robin Karp 的模式搜索算法，以及当然，还有哈希表。\n\n在 Java 中，我们有一个来自 `Object` 类的著名方法 `hashCode`，它负责生成哈希码。\n\
    \n哈希函数可能极其简单，甚至可以是一个常值，但将没有任何益处。它也可以非常简单，例如，我们可以为对象创建一个哈希函数来对 ASCII 字符求和并返回一个整数：\n\
    \n## 哈希表\n\n```java\npublic class AsciiSumFunction {\n    String anyString;\n\n\
    \    public AsciiSumFunction(String anyString) {\n        this.anyString = anyString;\n\
    \    }\n\n    @Override\n    public int hashCode() {\n        int sum = 0;\n \
    \       if (anyString != null) {\n            for (int i = 0; i < anyString.length();\
    \ i++) {\n                sum += (int) anyString.charAt(i);\n            }\n \
    \       }\n        return sum;\n    }\n\n    public static void main(String[]\
    \ args) {\n        AsciiSumFunction func1 = new AsciiSumFunction(\"ABC\");\n \
    \       AsciiSumFunction func2 = new AsciiSumFunction(\"CBA\");\n        System.out.println(\"\
    Hash of ABC: \" + func1.hashCode());\n        System.out.println(\"Hash of CBA:\
    \ \" + func2.hashCode());\n    }\n}\n```\n"
