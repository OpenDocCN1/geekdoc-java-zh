    \ tree can have. For example, we can represent a binary tree as a 2-ary tree because\
    \ both mean that the tree can have up to 2 child nodes. Similarly, a 3-ary tree\
    \ is the same as a ternary tree.\n\n## Perfect Binary Tree\n\nA perfect binary\
    \ tree has the same depth for every child node to the leaf nodes. Let's see how\
    \ to represent it in a diagram:\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_117_0.png)\n\
    \nFigure 21. Perfect Tree Diagram\n\n## Complete Binary Tree\n\nA complete binary\
    \ tree contains its nodes complete for the leftmost nodes. Also, the interior\
    \ nodes have to have two child nodes. Only the leaf nodes that are not the leftmost\
    \ are allowed to not have child nodes.\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_118_0.png)\n\
    \nFigure 22. Complete Binary Tree\n\nRemember that if the binary tree is complete\
    \ only for the rightmost nodes, that wouldn't be considered a complete binary\
    \ tree.\n\n## Full Binary Tree\n\nWhen a tree has either two or zero child nodes,\
    \ it's considered a full binary tree. To illustrate a full binary tree, take a\
    \ look at the following diagram:\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_119_0.png)\n\
    \nFigure 23. Full Binary Tree\n\n## Balanced Binary Tree\n\nA balanced tree can't\
    \ have its subtrees heights with more than 1 level of difference between the left\
    \ and right subtrees. Let's see an example to understand it more clearly:\n\n\
    ![](img/508455d7d9cdb199f1cdef01c90e5d26_120_0.png)\n\nFigure 24. Balanced Tree\n\
    \nNotice in the diagram above that the total height of this tree is 3. The height\
    \ of the left nodes 4 and 5 is 3. The height of node 3 is 2. Therefore, the difference\
    \ between the node subtrees is 1, and for this reason, is a balanced tree.\n\n\
    The following diagram is an example of a non-balanced binary tree. That’s because\
    \ the height from the left subtrees is higher than 1 compared to the right subtrees:\n\
    \n![](img/508455d7d9cdb199f1cdef01c90e5d26_122_0.png)\n\nFigure 25. Non Balanced\
    \ Tree\n\nNote that in the diagram above node 6 has a height of 4. Node 3 which\
    \ is on the right has a height of 2. Therefore, the difference in the height of\
    \ the nodes is higher than 1 and for this reason, the tree above is not balanced.\n\
    \n## Summary\n\nIn this chapter, we saw essential concepts from Tree structure.\
    \ As you can see, a tree is graph used in many systems and the real world. Let’s\
    \ see the key points from Tree structure:\n\n- Tree is a type of graph but has\
    \ specific structures and rules.\n- Node is every element from the tree.\n- Root\
    \ node is the node from the top that will access child nodes.\n- Leaf node is\
    \ any child node.\n- The height of a tree is how deep the nodes go.\n- Binary\
    \ Tree can have up to two nodes at max.\n- Ternary Tree can have up to three nodes.\n\
    - K-ary tree can have whatever number you want.\n- Perfect Binary Tree has to\
    \ have the same number of nodes for every parent.\n- Complete Binary Tree means\
    \ that the leftmost nodes are complete. There must be two nodes on the left side.\n\
    - Full Binary Tree when a tree has 0 or two nodes. It can’t have only one node.\n\
    - Balanced Binary Tree can’t have more than 1 level of difference.\n\n## Recursion\n\
    \nRecursion is a programming fundamental that is highly used in algorithms. Simply\
    \ put, recursion is the ability of a method to call itself. When a method calls\
    \ itself, it stacks up and uses the LIFO (Last-in First-out) approach It’s the\
    \ same concept as a stack of plates. Let’s see the following scenario:\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_124_0.png)\n\
    \nFigure 26. Last-in First-out\n\nTo summarize the above figure, remember that\
    \ the last element that is inserted in the stack will be the first one be removed.\
    \ That’s why LIFO. To memorize and really understand the LIFO approach, just remember\
    \ that when you stack plates, you can’t get the plate at the bottom. Instead,\
    \ it’s much easier and more suitable to get the first one at the top of the stack.\
    \ The methods are stacked exactly the same way! FIFO (First-in Last-out) has the\
    \ same result as LIFO. It basically means the first plate to go on the stack will\
    \ be the last one to go out.\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_125_0.png)\n\
    \nFigure 27. First-in Last-out\n\nTo summarize the above figure, the first plate\
    \ that is inserted in the stack will be the last one to be removed. Another point\
    \ to keep in mind is that what can be done with recursion can also be done with\
    \ loops too and vice-versa. Let’s see a simple Java example using this concept:\n\
    \n```java\npublic class Recursion {\n    public static void main(String[] args)\
    \ {\n        System.out.println(getNumber(0));\n    }\n\n    static int getNumber(int\
    \ number) {\n        if (number > 5) { // #A\n            return number;\n   \
    \     }\n        return getNumber(number + 1); // #B\n    }\n```\n\n## Code analysis:\n\
    \n- #A: \"if\" is the condition that is necessary to break the recursion loop.\
    \ This means that when the number parameter is greater than 5, the recursion will\
    \ stop. This is also called the base case in recursion.\n- #B: Notice that the\
    \ getNumber method is invoking itself and it's adding up 1 to the parameter. This\
    \ means that every time the method getNumber is invoked, the number parameter\
    \ will be summed with 1. This method is invoked the first time with 0 as the number,\
    \ it's stacked until it's 6 as you can see in the following image:\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_126_0.png)\n\
    \nFigure 28. Recursion Debug\n\n## Seeing LIFO/FIFO in practice\n\nWhen we sum\
    \ the numbers, the order that methods are invoked recursively doesn't really matter.\
    \ However, if we want to print numbers in order, that changes completely. Let's\
    \ see LIFO/FIFO happening in practice:\n\n```java\npublic class NumbersRecursion\
    \ {\n    public static void main(String[] args) {\n        showNumbers(0);\n \
    \   }\n    static void showNumbers(int number) {\n        if (number == 5) {\n\
    \            return;\n        }\n        showNumbers(number + 1);\n        System.out.print(number\
    \ + \" \");\n    }\n}\n```\n\n## Output: 43210\n\nNotice that the number was printed\
    \ in reverse order. That’s because the method is recursively stacked as you can\
    \ see in the debugging images: When all methods were invoked, notice that the\
    \ variable number is 5:\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_127_0.png)\n\
    \nFigure 29. LIFO Debug Full Stack\n\nWhen all methods were invoked and the methods\
    \ are going out of the stack, the variable number is 3:\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_128_0.png)\n\
    \nFigure 30. FIFO Debug Half Stack\n\nTherefore, it’s like the recursive call\
    \ will intercept this method invocation and wait until the last recursive method\
    \ is called to be the first out of the stack. That’s why the first number to be\
    \ printed is 4!\n"
  mdcn: "\n\n## 二叉树\n\n二叉树是一种最多具有2个子节点的树。让我们通过图表来看看它是工作的：\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_115_0.png)\n\
    \n图 19. 二叉树图\n\n注意，上面的图是一个二叉树，因为节点最多有 2 个孩子。即使节点 3 只有一个孩子，上面的图仍然是一棵二叉树。\n\n##\
    \ 三叉树\n\n三叉树与二叉树相似，但它不是最多 2 个子节点，而是最多 3 个子节点。让我们来看看这在图中是如何表示的：\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_116_0.png)\n\
    \n图 20. 三叉树图\n\n注意上面的图中，节点 1 和节点 2 拥有 3 个子节点。即使节点 4 只有一个子节点，这也没有关系，它仍然是三叉树，因为子节点的最大数量是\
    \ 3。\n\n## K叉树\n\n“K”代表树可以拥有的子节点最大数量。例如，我们可以将二叉树表示为 2 叉树，因为两者都意味着树最多可以有 2 个子节点。同样，3\
    \ 叉树与三叉树是一样的。\n\n## 完全二叉树\n\n完美二叉树每个子节点到叶子节点的深度都是相同的。让我们来看看如何在图中表示它：\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_117_0.png)\n\
    \n图 21. 完全树图\n\n## 完全二叉树\n\n完全二叉树包含的节点从最左侧的节点开始是完整的。此外，内部节点必须有两个子节点。只有不是最左侧的叶子节点允许没有子节点。\n\
    \n![](img/508455d7d9cdb199f1cdef01c90e5d26_118_0.png)\n\n图 22. 完全二叉树图\n\n记住，如果二叉树仅对最右侧的节点是完全，那么它就不会被视为完全二叉树。\n\
    \n## 满二叉树\n\n当树具有两个或零个子节点时，它被认为是满二叉树。为了说明满二叉树，请看下面的图：\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_119_0.png)\n\
    \n图 23. 满二叉树图\n\n## 平衡二叉树\n\n平衡树的左右子树之间的高度树高度差不能超过 1 层。让我们来看一个例子来更清楚地理解它：\n\n\
    ![](img/508455d7d9cdb199f1cdef01c90e5d26_120_0.png)\n\n图 24. 平衡树图\n\n注意上面的图中，这棵树的总高度为\
    \ 3。左侧节点 4 和 5 的高度为 3。节点 3 的高度为 2。因此，节点子树之间的差异为 1，由于这个原因，它是一棵平衡树。\n\n下面的图是一个非平衡二叉树的例子。那是因为从左子树的高度相对于右子树高出了\
    \ 1 以上：\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_122_0.png)\n\n图 25. 非平衡树图\n\
    \n注意上面的图中节点 6 的高度为 4。右侧的节点 3 高度为 2。因此，节点高度的差异大于 1，由于这个原因，上面的树不是平衡的。\n\n## 总结\n\
    \n在这一章中，我们看到了树结构的核心概念。正如你所见，树是用于许多系统和现实世界的图。让我们来看看树结构的关键点：\n\n- 树是一种图，但具有特定的结构和规则。\n\
    - 节点是树中的每一个元素。\n- 根节点是顶部的节点，用于访问子节点。\n- 叶子节点是任何子节点。\n- 树的高度是节点延伸的深度。\n- 二叉树最多有两个节点。\n\
    - 三叉树最多有三个节点。\n- K 叉树可以有任何数量的节点。\n- 完美二叉树每个父节点必须有相同数量的节点。\n- 完全二叉树意味着最左侧的节点是完整的。左侧必须有两个节点。\n\
    - 满二叉树当树具有 0 或两个节点时。它不能只有一个节点。\n- 平衡二叉树的高度差异不能超过 1 层。\n\n## 递归\n\n递归是算法中被频繁使用的编程基础。简单来说，递归是方法调用自身的能力。当一个方法调用它自己时，它会堆叠并使用\
    \ LIFO（后进先出）方法。这和叠子盘的概念相同。让我们来看下面的场景：\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_124_0.png)\n\
    \n图 26. 后进先出\n\n总结上面的图，记住插入栈的最后一个元素将是第一个被移除的元素。这就是 LIFOIFO。为了记住并真正理解 LIFO 方法，只需记住当你堆叠盘子时，你无法拿到底部的盘。相反，获取栈顶部的第一个盘要容易得多且更合适。方法的堆叠方式完全一样！FIFO（先进后出）与\
    \ LIFO 具有相同的结果。它基本上意味着第一个进入栈的盘子将是最后一个离开的盘子。\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_125_0.png)\n\
    \n图 27. 先进后出\n\n总结上面的图，插入栈的第一个盘子将是最后一个移除的。另一个需要记住的是，可以用递归完成的任务也可以循环完成，反之亦然。让我们来看这个\
    \ Java 示例：\n\n```java\npublic class Recursion {\n    public static void main(String[]\
    \ args) {\n        System.out.println(getNumber(0));\n    }\n\n    static int\
    \ getNumber(int number) {\n        if (number > 5) { // A\n            return\
    \ number;\n        }\n        return getNumber(number + 1); // B\n    }\n}\n```\
    \ 代码分析：\n\n- #A \"if\" 是打破递归循环的条件。这意味着当参数大于 5 时，递归将停止。这在递归中被称为基本情况（base case）。\n\
    - #B 注意 getNumber 方法正在调用它自己，并将参数加 1。这意味着每当 getNumber 被调用时，参数都会累加 1。该方法会被堆叠直到参数变为\
    \ 6，如如下所示：\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_126_0.png)\n\n图 28. 递归调试\n\
    \n## 在实践中观察 LIFO/FIFO\n\n当我们相加数字时，递归调用的顺序并不重要。然而，如果我们想按顺序打印数字，情况就完全不同。让我们来看看实践中发生的\
    \ LIFO/FIFO：\n\n```java\npublic class NumbersRecursion {\n    public static void\
    \ main(String[] args) {\n        showNumbers(0);\n    }\n    static void showNumbers(int\
    \ number) {\n        if (number == 5) {\n            return;\n        }\n    \
    \    showNumbers(number + 1);\n        System.out.print(number + \" \");\n   \
    \ }\n}\n```\n\n## 输出：43210\n\n注意数字是以反序打印的。那是因为方法是递归堆叠的，正如你在调试图像所示：当所有方法都已调用时，注意变量\
    \ number 为 5：\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_127_0.png)\n\n图 29.\
    \ LIFO 调试 - 全栈\n\n当所有方法都已调用且方法正在从栈中取出时，变量 number 为 3：\n\n![](img/508455d7d9cdb199f1cdef01c90e5d26_128_0.png)\n\
    \n图 30. FIFO 调试 - 半栈\n\n因此，由于递归调用会拦截此方法调用，并等待最后一个递归方法被调用后才第一个从栈中取出。这就是为什么第一个打印的数字是\
    \ 4！\n\n"
