    # Summary


    The Linked List data structure is vital to be understood by a software engineer
    since it''s vastly used in applications and coding interviews, of course! With
    a Linked List we can easily organize and change directories names or move songs
    from a player wherever we want data is not contiguous as an array. Therefore,
    it''s easier to move data around or change data in the middle.


    Let''s recap the highlights of this chapter:


    +   - Singly Linked List has only the next pointer. Meaning that it''s possible
    to traverse forward.

    - Doubly Linked List has both the next and previous pointers. Meaning that we
    can traverse forward and backward.

    - Circular Singly Linked List has only the next pointer. But the tail (last element)
    has the reference from the head (first element).

    - Circular Doubly Linked List has the next and previous pointers. But the tail
    also includes the object reference from the head (first element).

    - A Node will have the next pointer for Singly Linked List and next and previous
    for Doubly Linked List.

    - The Linked List will have the tail and the head pointers.

    - Linked List can''t access elements by index because data is stored dynamically,
    not contiguously as an array

    - Linked List is better to handle a large amount of data since it''s dynamic.

    - Linked List is flexible, therefore, great to handle stack, queue, and graphs.

