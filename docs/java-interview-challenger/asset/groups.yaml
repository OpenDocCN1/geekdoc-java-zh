    \       }\n        }\n        swap(array, i + 1, highScore);\n        return i\
    \ + 1;\n    }\n\n    static void swap(int[] arr, int i, int j) {\n        int\
    \ temp = arr[i];\n        arr[i] = arr[j];\n        arr[j] = temp;\n    }\n\n\
    \    public static void main(String[] args) {\n        int[] array = {10, 3, 2,\
    \ 0, 9, 7};\n        int n = array.length;\n        quickSort(array, 0, n - 1);\n\
