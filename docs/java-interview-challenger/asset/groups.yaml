    \ that can't be changed. We need to pass the type and size of the array and after\
    \ that, we can't change the type or size of the array.\n\nLet's see in the following\
    \ code how to create a static array with the int type and show all the elements:\n\
    \n```\nint[] array = {1, 2, 3, 4, 5}; // Create an array O(n)\nfor (int i = 0;\
    \ i < array.length; i++) {\n  System.out.print(array[i] + \" \");\n}\n```\n\n\
    Output: 1 2 3 4 5\n\nNotice in the code above that we create an array of int values.\
    \ Once it's created we can't change either the type or the size of the array,\
    \ that's what makes it static.\n\nThen we access each element of the array by\
    \ index and show the values that will be 0 because those are the default values\
    \ for primitive int in Java.\n\n# Insert an Element in the Middle of the Array\n\
    \nTo insert an element in the middle of the array it will be necessary to shift\
    \ the elements. Therefore, the time complexity will be O(n).\n\nLet's imagine\
    \ we want to put 3 in the middle of 2 and 4 in the following array: { 1, 2, 4,\
    \ 5 }. To do that, we will have to first create a new array with the size of 5."
