    to be friendly, communicate clearly, and show that you want to bring value to
    the company with your work.


    ## Take Home Project


    Sometimes companies will opt to give you a take-home project. They will access
    your skills to create a robust and performant system using after-the-fundamental
    concepts of a web application usually.


    In one interview I did, they wanted me to create a manual job application with
    a Thread pool and a queue. Sometimes, they will ask you to create something even
    if there are already several frameworks that do the job.


    Other takeaway tests will ask you to create a normal application with the problem
    they are presenting, and your job is to create the project in a way that is robust,
    performant, and has a good code design.


    They are expecting an application that is production-ready, which means well-tested,
    with logs, containerized ready to be deployed in the cloud, well-documented, and
    with different profiles to deploy in multiple environments such as dev, stage,
    qa, and production.


    Obviously, they are expecting you to solve the problem presented in an optimized
    way.


    ## Code Quality


    It’s crucial to know how to create good quality code, not reinvent the wheel with
    technologies, and understand what you do with software development.


    One of the most important principles is to create cohesive code (code that does
    ONE thing very well) and code with low coupling (code that doesn''t have strong
    dependency).


    Another crucial point is correctly naming projects, packages, classes, methods,
    and variables. Avoid acronyms and use the name conventions for the Java language.


    Mastering paradigms like Object-Oriented Programming (OOP) and Functional Programming
    will help develop good-quality code.


    SOLID principles are powerful in guiding you to create high-quality code. Therefore,
    it’s crucial to learn those concepts well.


    The last component to help you create high-quality code is to master the most
    essential design patterns. We can’t overuse design patterns. We should use them
    only in suitable situations instead. Otherwise, the code will only get more complicated.


    ## Code Design


    We need to have a basic understanding of code design to develop systems and also
    to pass on interviews. :)


    Sometimes, there will be interviews that will ask you how you design your code
    and how many layers you use.


    In Java, it’s common to have the controller layer (the one that has the API endpoints),
    then the service that has business requirements implementations, the repository
    that interacts with the database, the data objects, and the database entities
    objects.


    Java Interview Process


    Design patterns and Domain-Driven Design will also help you to create a good code
    design.


    Knowing the frameworks you are working with and using their features also helps
    you create good code. For example, if you are using Spring, it''s better to stick
    with Spring nomenclatures to be consistent with the framework.


    ## Java Application Interview Style


    In this interview, usually two senior developers and maybe one manager will ask
    the following questions:


    - Java features (Concurrency, Collection, Exception, OOP)

    - Tests

    - Microservices concepts

    - SQL

    - Database Model


    To learn the Java core concepts, get the Java Challenger book and stay sharp for
    the Java interview: https://leanpub.com/javachallengers


    They will also ask you about your previous experiences, so only tell the experience
    from the last three companies you worked for. Otherwise, it''s too much. Also,
    highlight your accomplishments when you are talking about your experiences.


    They also might ask you about your previous experiences and model the system you
    were working with.


    ## Algorithms Interview


    This interview is nowadays very popular. A lot of companies (small, large companies)
    are following the same process for interviews.


    Similarly to the Java application interview, there will usually be two senior
    developers interviewing you for a code challenge.

    In the algorithm interview, you will be accessed by the following:


    - Your ability to understand the problem

    - Your ability to communicate your thought process

    - You must communicate your thought process while you solve the problem

    - Your ability to communicate clearly

    - Your code quality

    - Data Structures

    - Big O Notation

    - Algorithms techniques such as recursion or memoization


    ## Systems Design Interview


    In the Systems Design interview, you will be assessed in the ability to design
    a system according to the requirements. This interview is tricky if you don''t
    know the rules of the game. In this interview, they will usually give you a vague
    problem, such as “Design Instagram.” Then you must ask questions about where you
    can reasonably design a system in 45 minutes.


    Don’t ever start the system without asking questions. You must assume things during
