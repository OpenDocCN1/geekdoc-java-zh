    # # Recursion


    Recursion is a programming fundamental that is highly used in algorithms. Simply
    put, recursion is the ability of a method to call itself. When a method calls
    itself it stacks up and uses the LIFO (Last-in First-out) approach. It’s the same
    concept as a stack of plates. Let’s see the following scenario:


    ![](img/508455d7d9cdb199f1cdef01c90e5d26_124_0.png)


    Figure 26. Last-in First-out


    To summarize the above figure, remember that the last element that is inserted
    in the stack will be the first one to be removed. That’s why LIFO.


    To memorize and really understand the LIFO approach, just remember that when you
    stack up plates, you can’t get the plate at the bottom. Instead, it’s much easier
    and more suitable to get the first one at the top of the stack. The methods are
    stacked exactly in the same way!


    FILO (First-in Last-out) has the same result as LIFO. It basically means that
    the first plate to go on the stack will be the last one to go out.'
