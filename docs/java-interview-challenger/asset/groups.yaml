    # Pros from Linked List


    A Linked List is better than an array in some aspects, let''s explore what are
    they:


    +   - It''s faster to add elements at the beginning or the end of the list. It
    will always take O(1).

    - Dynamic data size, there is no need to define the initial space as an array.

    - Use the space as required since the nodes are allocated dynamically, this also
    means flexibility.

    - Good to insert a great amount of data because when adding or removing elements
    there won''t be a buffer.

    - Flexibility, a Linked List is used to handle data structures such as Queue,
    Stack, and graphs.


    # Cons from Linked List


    +   - Random Access, It''s not possible to access elements by index.

    - It uses more memory than an array. That''s because it''s necessary to create
    object references between nodes. This means that the need to create the next object
    reference. For a Doubly Linked List it''s the next and previous pointers.

    - Complexity, traversing a Linked List is difficult. It''s necessary to use algorithms
    that require beyond trivial programming knowledge. It''s necessary to really master
    concepts such as pointers and object references.

    - Traversing back to back requires more memory usage since the next and previous
    pointers will have to be pointing to objects.'
