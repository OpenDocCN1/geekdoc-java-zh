    * It will iterate over all elements with the non-optimized algorithm

    * It will have a significant gain in performance by using the optimized Bubble
    sort algorithm

    * It will have two loops so that the comparison between elements is possible.

    * The second array iteration will start always with i + 1 to avoid redundant comparison'
