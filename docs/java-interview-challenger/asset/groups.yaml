  mdcn: "\n\n# 静态数组\n\n如名所示，静态数组是一种不可更改的数组。我们需要传递数组的类型和大小，之后，我们就无法更改数组的类型或大小了。\n\n\
    让我们通过以下代码查看如何创建一个 `int` 类型的静态数组并显示所有元素：\n\n```\nint[] array = {1, 2, 3, 4, 5};\
    \ // 创建一个数组 O(n)\nfor (int i = 0; i < array.length; i++) {\n  System.out.print(array[i]\
    \ + \" \");\n}\n```\n\n输出：1 2 3 4 5\n\n注意上面的代码，我们创建了一个 `int` 类型的值的数组。一旦创建完成，我们就无法更改数组的类型或大小，这就是它被称为“静态”的原因。\n\
    \n然后，我们通过索引访问数组的每个元素，并显示那些将为 0 的值，因为这些是 Java 中基本类型 `int` 的默认值。\n\n# 在数组中间插入元素\n\
    \n要在数组中间插入元素，将需要移动原有元素。因此，时间复杂度将是 O(n)。\n\n想象我们想在数组 `{ 1, 2, 4, 5 }` 的 2 和 4 之间插入\
    \ 3。为了做到这一点，我们必须创建一个大小为 5 的新数组。\n\n然后，需要将元素 4 和 5 向前移动一个位置。完成后，我们就可以访问索引 2 并插入元素\
    \ 3。\n\n# 动态数组\n\nJava 中有一些使用动态数组的类，例如 `ArrayList`、`Vector` 等。当我们创建一个 `ArrayList`\
    \ 时，它在底层最初是空的，但在添加第一个元素后，它的大小会增长到 10。然后，如下面的 JVM 代码所示，每次需要时它都会翻倍：\n\n```\npublic\
    \ class ArrayList<E> extends AbstractList<E>\n    implements Serializable<E>,\
    \ RandomAccess, Cloneable\n{\n    private static final int DEFAULT_CAPACITY =\
    \ 10;\n    transient Object[] elementData;\n    private int size;\n    private\
    \ static final Object[] DEFAULT_CAPACITY_EMPTY_ELEMENT[] = {};\n\n    public ArrayList()\
    \ {\n        this.elementData = DEFAULT_CAPACITY_EMPTY_ELEMENT;\n    }\n\n   \
    \ // 该方法在……时会让数组翻倍\n    private Object[] grow(int minCapacity) {\n        int\
    \ oldCapacity = elementData.length;\n        if (oldCapacity > 0 || elementData\
    \ != DEFAULT_CAPACITY_EMPTY_DATA) {\n            int newCapacity = ArraysSupport.newLength(oldCapacity,\n\
    \                minCapacity - oldCapacity, /* 最小增长 */\n                oldCapacity\
    \ > 1 /* 引用增长 */\n            return elementData = Arrays.copyOfOf(elementData,\
    \ newCapacity);\n        } else {\n            return elementData = new Object[Math.max(DEFAULT_CAPACITY,\
    \ minCapacity)];\n        }\n    }\n    // 省略其他方法...\n```\n\n`elementData` 变量是\
    \ `ArrayList` 在底层存储数据的变量。请注意，动态数组实际上是通过操作静态数组来表现动态行为的。\n\n添加元素时，如果成立，时间复杂度将是 O(n)。这是因为数组创建时的大小为\
    \ 10，必须创建一个大小为 20 的新数组并将所有元素复制到新数组中。为了做到这一点，我们必须遍历整个数组并逐个复制元素。然后我们将第 11 个元素添加到数组中。\n\
    \n当底层的数组按大小为 20 创建后，每当我们添加元素时，时间复杂度都为 O(1)。注意，向动态数组中添加元素在大多数情况下都会很快，复杂度为 O(1)。只有在数组大小需要翻倍的边缘情况下，时间复杂度为\
    \ O(n)。这被称为摊还复杂度。\n\n# 总结\n\n- 数组在内存是从后分配的。\n- 通过索引访问数组的时间复杂度为 O(1)，非常快。\n- 静态数组是预定义大小的。\n\
    - 动态数组在需要时会自动调整大小。\n- 向动态数组添加元素大部分时间是 O(1)，因为会有足够的空间。\n- 当向动态数组添加元素超过数组的大小时，需要创建一个新数组，将现有元素复制过去，然后添加新元素。因此时间复杂度为\
    \ O(n)。\n- 在数组中间添加元素的时间复杂度为 O(n)，因为我们需要将右侧的所有元素向左移动。\n- 从数组末尾删除元素的时间复杂度为 O(1)，因为我们只需要删除最后一个值并直接访问它。\n\
    - Java 和其他语言背后的数据结构可以将数字转换为二进制数字，ASCII 编码如下所示：\n\n| 十进制 | 十进制 | 字符 | 十进制 | 十进制\
