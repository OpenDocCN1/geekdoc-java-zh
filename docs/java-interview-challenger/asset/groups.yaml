    \n## Stack 继承自 Vector\n\n由于 Stack 继承了 Vector，因此它是使用栈操作的一种线程安全方式。\n\n```java\n\
    public class Stack<E> extends Vector<E> { ... }\n```\n\n它还具有通过索引检索元素的可能，但这不在 Stack\
