  mdcn: '

    Java 面试流程


    如果你的经验符合他们的需求，你就能通过这一关。


    - 行为面试（Behavioral Interview）：检查你的行为方式是否符合公司的价值观。他们通常会观察你是否对前公司有不满、你是否擅长团队合作、是否友好以及沟通是否清晰。

    - 文化契合度面试（Culture Fit）：在这次面试中，重要的是让你了解公司的价值观，然后在面试中展现这些价值观。简而言之，你需要表现得友好、沟通清晰，并展示出你想通过工作为公司创造价值。


    ## 家庭作业项目 (Take Home Project)


    有时公司会选择给你布置一个家庭作业。他们通常会评估你利用 Web 应用程序基础概念之外的概念创建一个健壮且高性能系统的能力。


    在我参加过的一个面试中，他们要求我使用线程池和队列创建一个手动的任务处理程序。有时，即使已经有几个框架可以完成这项工作，他们也会要求你自己实现。


    其他的课后测试会要求你针对他们提出的问题创建一个标准的应用程序，你的任务是以一种健壮、高性能且代码设计良好的方式创建该项目。


    他们期望的是一个生产就绪的应用程序，这意味着经过了良好的测试、带有日志、准备好云端部署、文档完备，并且具有不同的配置以部署在开发（dev）、测试（stage）、QA
    和生产等多个环境中。


    显然，他们期望你以优化的方式解决所提出的问题。


    ## 代码质量 (Code Quality)


    了解如何编写高质量代码，而不是在技术上重复造轮子，并理解你在软件开发中所做的事情，是至关重要的。


    最重要的原则之一是创建高内聚的代码（即只很好地做好一件事的代码）和低耦合的代码（即没有强依赖关系的代码）。


    另一个关键点是正确命名项目、包、类、方法和变量。避免使用缩写，并遵循 Java 语言的命名规范。


    精通面向对象编程（OOP）和函数式编程等范式将有助于编写高质量的代码。


    SOLID 原则在引导你创建高质量代码方面非常强大。因此，良好学习这些概念至关重要。


    帮助你创建高质量代码的最后一个要素是掌握最核心的设计模式。我们不能过度使用设计模式。相反，我们应该在适当的情况下使用它们，否则代码只会变得更加复杂。


    ## 代码设计 (Code Design)


    我们需要对代码设计有基本的理解，以便开发系统以及通过面试。 :)


    有时，会有面试会问你如何设计代码以及使用了多少层。


    在 Java 中，常见的结构是：控制器层（拥有 API 端点的层）、服务层（实现业务需求）、存储库层（与数据库交互）、数据对象（Data Objects）以及数据库实体对象。


    Java 面试流程


    设计模式和领域驱动设计（Domain-Driven Design）也会帮助你创建良好的代码设计。


    了解你正在使用的框架并利用其特性也有助于你编写良好的代码。例如，如果你正在使用 Spring，最好遵循 Spring 的命名法以与框架一致。


    ## Java 应用程序面试风格 (Java Application Interview Style)


    在这次面试中，通常会有两个高级开发人员可能可能有一个经理询问以下问题：


    - Java 特性（并发、集合、异常、OOP）

    - 测试

    - 微服务概念

    - SQL

    - 数据库模型


    要学习 Java 核心概念，请获取《Java Challenger》这本书并为 Java 面试保持敏锐：https://leanpub.com/javachallengers


    他们还会问及你之前的经验，所以只介绍你最近工作的三家公司的经验。否则，内容太多了。另外，在谈论你的经验时，要突出你的成就。


    他们还可能询问你之前的经验，并对你工作过的系统进行建模。


    ## 算法面试 (Algorithms Interview)


    这种面试现如今非常流行。很多公司（包括小型和大型公司）都遵循相同的面试流程。


    与 Java 应用程序面试类似，通常会有两个高级开发人员对你进行代码挑战。在算法面试中，你将通过以下方面接受评估：


    - 理解问题的能力

    - 沟通你的思维过程的能力

    - 你在解决问题时必须沟通你的思维过程

    - 清晰沟通的能力

    - 代码质量

    - 数据结构

    - 大 O 表示法

    - 算法技术，如递归或记忆化（memoization）


    ## 系统设计面试 (Systems Design Interview)


    在系统设计面试中，你将根据需求设计系统的能力接受评估。如果你不知道游戏规则，这种面试将会很棘。在面试中，他们通常会给你一个模糊的问题，例如“设计 Instagram”。然后你必须提问，以便在
    45 分钟内合理地设计出一个系统。


    永远不要在提问之前开始设计系统。在面试期间你必须做出假设。所以，如果他们让你设计 Instagram，你说：“我假设你只需要基础功能，比如发布照片和故事的功能，对吧？”他们可能会说好的，然后你就可以开始。


    向面试官提问以引导系统变得简单；你越能让系统变得简单，对你就越有利。他们可能会要求你设计任何系统。例如，他们可能会要求你设计他们的一个内部系统。这时你必须阅读并理解他们的问题，然后设计系统并解释你选择的原因。


    Java 面试流程


    11


    在系统设计面试中，具备如何创建系统的知识是至关重要的。


    ## 总结 (Summary)


    面试很烦人，但了解规则是必要的。否则，无论软件工程师有多优秀，我们都会失败。


    不过，良好的动力是，通过掌握数据结构、算法和系统设计，我们将成为更好的软件工程师。


    因此，让我们看看这篇文章的要点：


    - 你的简历必须精美，但它不是推销自己的唯一方法。

    - 分享知识是推销自己的强大方式。

    - 你可以利用简历中分享的知识链接。

    - 你可以创建博客来推销自己。

    - 决定你想探索并分享的领域。

    - 决定你创作文章的频率。每周、每两周或每月。

    - 在博客、YouTube 或演讲中分享知识。

    - 为开源项目贡献代码、为文档拼写错误提交 PR，以及其他任何微小的贡献。

    - 有不同的面试形式。

    - 筛选面试（Screening call）只检查你的经验是否足够。


    行为面试关注你是否友好、沟通是否良好以及团队合作能力如何。


    文化契合度面试评估你的价值观是否与公司价值观相似。


    家庭作业项目。他们将测试你创建生产就绪系统的能力。


    代码质量将查看你如何良好地利用最佳实践使代码变得简单。


    代码设计将检查你如何将代码分层。在 Java 中，通常是 Controller、Service、Repository、实体数据和传输数据。

