    图 35. 选择排序\n\n## 插入排序\n\n```java\nimport java.util.Arrays;\n\npublic class SelectionSort\
    \ {\n    public static void main(String[] args) {\n        int[] array = {5, 2,\
    \ 3, 7, 1};\n        var sortedArray = sort(array);\n        System.out.println(Arrays.toString(sortedArray));\n\
    \    }\n\n    static int[] sort(int[] array) {\n        if (array.length == 1)\
    \ {\n            return array;\n        }\n\n        var firstUnsortedIndex =\
    \ 0;\n        while (firstUnsortedIndex < array.length - 1) {\n            var\
    \ smallestElementIndex = firstUnsortedIndex;\n            for (int i = firstUnsortedIndex;\
    \ i < array.length; i++) {\n                if (i != smallestElementIndex && array[i]\
    \ < array[smallestElementIndex]) {\n                    smallestElementIndex =\
    \ i;\n                }\n            }\n            swapElements(array, firstUnsortedIndex,\
    \ smallestElementIndex);\n            firstUnsortedIndex++;\n        }\n     \
    \   return array;\n    }\n}\n```\n\n## 插入排序\n\n```java\n    private static void\
    \ swapElements(int[] array, int i, int j) {\n        var temp = array[i];\n  \
    \      array[i] = array[j];\n        array[j] = temp;\n    }\n}\n```\n\n**输出:\
    \ [1, 2, 3, 5, 7]**\n\n代码分析：\n\n- 首先将变量 `firstUnsortedIndex` 和 `smallestIndex`\
    \ 初始化为 0。在循环中遍历整个数组。\n- 将 `firstUnsortedIndex` 设置为 `smallestIndex`，以避免与已排序元素进行比较。\n\
    - 遍历数组以寻找 `smallestIndex`。\n- 当遍历完数组后，将最小元素交换到左子数组。\n- 增加 `firstUnsortedIndex`\
