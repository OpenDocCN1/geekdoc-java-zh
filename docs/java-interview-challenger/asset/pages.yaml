  md: '# Big O Notation


    +   - Worst-case scenario of time complexity and the most important that is the
    Big-O notation

    * O(1): constant time. Examples of accessing a number from an array. Calculating
    numbers...

    * O(log n): Logarithmic time. Uses the divide and conquer strategy. The binary
    search and tree binary search are good examples of algorithms that have this time
    complexity. An approximate real-world example would be to look at a word in the
    dictionary.

    * O(n) - Linear time: When we traverse the whole array once, we have the O(n)
    time complexity. When we store information in an array of n we will also have
    the O(n) for space complexity. A real-world example could be reading a book.

    * O(n log n) - Log-linear: The Merge sort, Quick Sort, Tim Sort, and Heap Sort
    are algorithms that use the divide and conquer strategy making it more effective
    than O(n ^ 2).

    * O(n ^ 2) - Quadratic: The Bubble Sort, Insertion Sort, and Select Sort are some
    of the algorithms that have the quadratic complexity. If there are two nested
    loopholes traversing the whole array each time, then we have O(n ^ 2) of time
    complexity.

    * O(n ^ 3) - Cubic: When we have 3 nested loops and traverse the whole array on
    those loops we will have the cubic complexity.

    * O(c ^ n) - Exponential: The exponential complexity grows very quickly. A good
    example of this time complexity is when someone tries to break a password. Suppose
    it password supports only numbers and has 4 digits. That equates to 10 ^ 10000
    possible combinations. The greater the exponent number faster the number grows.

    * O(n!) - Factorial: The factorial of 3! is the same as 1 * 2 * 3 = 5. It grows
