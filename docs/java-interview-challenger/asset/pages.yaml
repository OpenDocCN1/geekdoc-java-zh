    - It is a stable sorting algorithm, meaning that it preserves the relative order
    of equal elements in the input list.

    - Merge sort is a divide-and-conquer algorithm, which makes it easy to implement
    recursively and understand.

    - Merge sort can also be used to efficiently merge two sorted lists into a single
    sorted list.


    # Cons:


    +   - Merge sort requires additional memory to store the temporary arrays used
    during the sorting process, which can be a disadvantage when working with limited
    memory.'
