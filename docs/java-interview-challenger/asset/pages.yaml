  md: '# Big O Notation


    The Big(O) Notation is a fundamental concept to help us measure the time complexity
    and space complexity of the algorithm. In other words, it helps us measure how
    performant and how much storage and computer resources an algorithm uses.


    Also, in any coding interview, you will be required to know Big(O) notation. That
    will help you to get your dream job since FAANG (Meta, Alphabet, Amazon, Apple,
    Netflix, Microsoft, Google) company will ask you that, even other companies.


    The Big(O) notation is not 100% accurate, instead, it''s an estimate of how much
    time and space your algorithm will take. Another rule is that the Big(O) notation
    will be calculated considering the worst-case scenario.


    Now that we have understanding regarding Big(O) notation, let''s see the following
    diagram from the fastest O(1) to the slowest O(n!) complexity:


    Source from (https://www.bigocheatsheet.com)[https://www.bigocheatsheet.com/


    # Asymptotic Notations


    The asymptotic notation is a defined pattern to measure the performance and memory
    usage of an algorithm. Even though the Omega and Theta notations are not very
    much used in coding interviews, it''s important to know they exist.


    Let’s see what are those asymptotic notations:


    +   - Omega Notation “Ω”: best-case scenario where the time complexity will be
    as optimal as possible based on the input.'
  merge: -1
  pgno: 25
- img_proc: true
  md: '+   - Theta Notation "Θ": average-case scenario where the time complexity will
    be the average considering the input.

    - Big-O Notation "O": worst-case scenario and the most used in coding interviews.
    It’s the most important operator to learn because we can measure the worst-case
    scenario time complexity of an algorithm.


    # Big O Notation in Practice


    To see those notations in practice, let’s take the example of the Bubble sort
    algorithm. If you don’t remember this algorithm, it sorts the elements from an
    array using two loopings, checking element by element. We will further explore
    the Bubble sort in the next chapters.


    The best-case scenario (Omega notation Ω) would be when the array is already sorted.
    In this case, it would be necessary to run through the array only once. Therefore
    the time complexity would be Ω(n).


    The average-case scenario (Theta notation Θ) would be when the array has only
    a couple of elements unordered. In this case, it wouldn’t be necessary to run
    through the whole algorithm. Even though this is a bit better, the time complexity
    is still considered as O(n ^ 2).


    The worst-case scenario (Big O notation) would be when the array is fully unsorted
    and the whole array has to be traversed. It would be necessary to sort the whole
    array, therefore, the time complexity would be O(n ^ 2).


    The space complexity from the Bubble sort algorithm will be always O(1) since
    we only change values in place from an array. Changing values in place means that
    we don’t need to create a new array, we only change array values.'
