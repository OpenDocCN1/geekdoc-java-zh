  md: "# # Logarithm Time Complexity in Binary Search\n\nLet’s take an example where\
    \ we do the binary search algorithm which basically finds an element within a\
    \ sorted array with 16 elements. You will see the O(log 16) in practice:\n\n```\n\
    public class OLogNExample {\n    // O (log(n)) time | O(1) space\n    public static\
    \ int binarySearch(int[] array, int target) {\n        int middle = array.length\
    \ / 2;\n\n        var leftPointer = 0;\n        var rightPointer = array.length\
    \ - 1;\n        int iterationsCount = 0;\n\n        while (leftPointer <= rightPointer)\
    \ {\n            iterationsCount++;\n            if (array[middle] < target) {\n\
    \                leftPointer = middle + 1;\n            } else if (array[middle]\
    \ > target) {\n                rightPointer = middle - 1;\n            } else\
    \ {\n                System.out.println(\"Iterations count: \" + iterationsCount);\n\
    \                return middle;\n            }\n        }\n\n        middle =\
    \ (leftPointer + rightPointer) / 2;\n    }\n    return -1;\n}\n```"
