  md: '# Summary


    The Hash Table is a crucial data structure to understand and it''s present in
    all programming languages. Therefore, by understanding how Java handles it behind
    the scenes you will pretty much know how to manipulate the Hash Table, Dictionary,
    HashMap, or whatever the name from any programming language.


    Basically, in essence, a Hash Table is a data structure to store key-value data.
    It''s fast to retrieve data by key and will have hash collision very rarely if
    we are using effective hashCode implementations.


    Let''s see the key points of the Hash Table data structure:


    +   - It is a data structure to handle key and value.

    - To search data it''s pretty fast if there is no hash collision. It''s O(1).

    - If there is a hash collision and no balanced tree, the time complexity to search
    by key will be O(n)

    - If there is a hash collision and balanced tree, the time complexity to search
    by key is O(log n).

    - To enable a balanced tree to be used when there is a hash collision, it''s necessary
    to implement Comparable.

    - To search a value (not the key) into a Hash Table we will have the time complexity
    of O(n).

    - The keys of a Hash Table are an array behind the scenes that can be accessed
    by a hash code. That''s why we have the time complexity of O(1) when there is
    no hash collision.

    - When there is a hash collision, the key, and value will be inserted in a LinkedList.
    Then the time complexity to search an element by the key will be O(n).'
