    # Array Allocation


    An array also needs to have data allocated contiguously meaning that if there
    is an array of boolean with 10 elements, these arrays need to occupy 10 bytes,
    it can''t be broken. Otherwise, it would impossible to have quick access to its
    elements.


    Now, remember that the boolean type takes 1 bit but each memory slot only stores
    1 byte. The JVM (Java Memory Model) avoids word tearing which basically forces
    not to be broken down into the same memory slot. Also, word tearing should avoid
    changing multiple fields in the same memory slot.


    Therefore, each boolean value will hold 1 byte of space, other than that, we will
    need 10 contiguous bytes to allocate an array of 10 boolean values. Internally
    the JVM will store more bytes for the array. We don''t need to know this in detail
    but if you are curious you can run your own tests with the library JOL (Java Object
    Layout).'
