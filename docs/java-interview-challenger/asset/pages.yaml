    # Accessing an Array by Index


    Accessing an index of an array has also constant time complexity. That''s because
    once the array is created in memory, we won''t need to traverse the array, or
    do any other special operation. We just need to access it and the time complexity
    for that is O(1) or constant time:


    ```

    int[] numbers = { 1, 2, 3};

    System.out.println(numbers[1]); // O(1) here

    ```


    # Logarithmic - O(log n)


    The classic algorithm that uses the O(log n) complexity is the binary search.
    That''s because it''s not necessary to run through the whole array. Instead, we
    get the number in the middle and check if it''s lower or greater than the number
    to be found. Then we break the array in two, we break it again until the number
    is found. That''s only possible because a binary search must have the array already
    sorted.


