  md: '# Big(O) Notation for Recursive Fibonacci


    Let’s see now how this algorithm performs: Time complexity: T(2^N) which means
    N is 3, the time complexity is 9 – very slow Space complexity: O(N) which means
    the sum of the invoked methods in the stack


    Simply put, the Big(O) notation measures the performance and space used to execute
    an algorithm. You must be wondering why the space complexity is different from
    the time complexity, let''s explore that.


    The time complexity will be always exponential and that’s not performant. This
    happens because, in terms of time, the recursive invocations will have to go through
    all the recursive trees.


    The space complexity is different though. To explain what is space complexity,
    it’s basically the space in memory that an algorithm will use.


    Remember that the recursive method invocations are stored in a stack? So, what
    happens when F(3) invokes F(2) and F(1) – F(1) and F(2) will be popped out from
    the stack. The key to understanding it in simple words is that the leftmost methods
    will be invoked and then popped out from the stack. Therefore, no how big the
    tree might become, the space will be always (n).


