  md: '# Big O Notation


    Let’s suppose we want to know how many possible combinations we can have with
    cake toppings or no toppings at all:


    +   - Chocolate

    - Strawberry

    - Whipped Cream


    To find out this we will have to use 2 as base ^ 3 which is equal to 8 combinations.
    Now let’s see some examples:


    | Toppings | Combinations |

    |---|---|

    | 1 | 1 - Plain cake |

    | 2 | 4 - Plain cake, chocolate, strawberry & strawberry |

    | 3 | 8 - ... |


    As you can see in the table above, the number grows exponentially. If we want
    a cake with 10 toppings, then the amount of combinations would be 1024, and so
    on!


    # Brute-force Password Break


    To find out a password with brute force, suppose we can only use numbers to make
    this example easy. Only numbers from 0 to 9 can be input, also, suppose that the
    password has a length of 3 numbers.


    The constant number will be 10 ^ 3 which is the same as 10 * 10 = 1000 possible
    combinations. Very easy password to break. If it accepts lower-case letters and
    numbers we would have 26 letters + 10 numbers = 36 as a constant. That would translate
    to 36 ^ 3 = 36 * 36 * 36 = 46656 possible combinations. That’s why most websites
    require us to use special characters so the number of possible combinations grows
    exponentially.'
