  md: 'Similarly to the Java application interview, there will usually be two senior
    developers interviewing you for a code challenge.

    In the algorithm interview, you will be accessed by the following:


    +   * Your ability to understand the problem

    * Your ability to communicate your thought process

    * You must communicate your thought process while you solve the problem

    * Your ability to communicate clearly

    * Your code quality

    * Data Structures

    * Big O Notation

    * Algorithms techniques such as recursion or memoization


    # # Systems Design Interview


    In the Systems Design interview, you will be assessed in the ability to design
    a system according to the requirements. This interview is tricky if you don''t
    know the rules of the game. In this interview, they will usually give you a vague
    problem, such as “Design Instagram.” Then you must ask questions about where you
    can reasonably design a system in 45 minutes.


    Don’t ever start the system without asking questions. You must assume things during
    this interview. So if they tell you to design Instagram, you say, “I assume you
    just want the basic features, such as the possibility to post photos and stories,
    right?”. They will probably say yes, then you start it.


    Make questions to the interviewer directing the system to be simple; the simpler
    you can make the system, the better for you. They might ask you to design any
    system. They might ask you, for example, to design an internal system they have.
    Then you will'
