  md: '# Memory Allocation


    Since an array in Java is an object, there will be extra bytes space because the
    JVM will allocate in memory called as object header.


    In the header, there is the mark word memory allocation which will store the Garbage
    Collector metadata, identity hashcode, and locking information which which takes
    around 8 bytes.


    Klass is part of the header too and it''s used to store class metadata, the JVM
    will use 4 bytes for that. Also, there is the extra space of memory the JVM will
    allocate for the array length.


    The JVM will allocate approximately 17 extra bytes when creating an array object.


    However, there is no need to know that in detail, the most important thing you
    must remember is that arrays take memory space contiguously. You will learn more
    about arrays in the chapter about Arrays.


