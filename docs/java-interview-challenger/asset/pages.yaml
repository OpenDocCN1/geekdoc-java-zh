    # Time Complexity from Stack


    The time complexity of a Stack will depend on the used implementation. If we choose
    LinkedList we will work with a graph data structure. If we choose ArrayDeque then
    it''s an array data structure.


    Let''s explore the differences in time complexity between LinkedList and ArrayDeque.


    # push (addFirst)


    LinkedList: the push method will have the time complexity of O(1) no matter what.
    That''s because a LinkedList links objects (Nodes) from one to another. It''s
    not an array. The first element is always added into a separate variable which
    enables quick access.


    ArrayDeque: the push method with ArrayDeque might be O(1) if it''s not necessary
    to resize the array. If the array is full and it is occasionally, the time complexity
    will be O(n) because it will be necessary to traverse the array, make a copy of
    the values and create a new resized array with the new element.'
