  md: '# pop (removeLast)


    LinkedList: the pop method will always have the time complexity of O(1). That’s
    because the elements are linked to each other and the first element will be stored
    in a variable to that we have direct access. Therefore, we only need to delete
    the object reference of this first element.


    ArrayDeque: the pop method for ArrayDeque will always be O(1). That’s because
    the first element of the array will be set to null and the head index will be
    updated to not consider the element that was deleted.


    # Find an element


    ArrayDeque: to find an element by value, it’s also necessary to go through all
    elements in the worst-case scenario until the element is found. Similarly to LinkedList,
    the time complexity is O(n).


    # Summary


    The stack data structure is used with recursion and in the famous depth-first
    search algorithm and it’s also useful for other operations!


    Let’s see the key points of the stack data structure:


    +   - It’s similar to the real-world situation of stacking up plates and removing
    them from the stack.

    - It uses the LIFO (Last-in-first-out) strategy. This means that the last element
    that is added will be the first to be out'
