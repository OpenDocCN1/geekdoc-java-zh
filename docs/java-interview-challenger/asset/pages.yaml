    # Log-linear – O(n log n)


    Many efficient sorting algorithms such as Quicksort, Mergesort, and Heapsort have
    the time complexity of O(n log n) is a bit slower than O(log n) and O(n).


    The log-linear complexity is present in algorithms that use the divide-and-conquer
    strategy. In the example of the Quicksort algorithm, we need to traverse the array,
    find the pivot number, divide the array into partitions, and swap elements until
    the array is fully sorted. Notice that besides traversing the whole array with
    the time complexity of O(n) we are also dividing the array into partitions O(n
    log n).


    The time complexity of O(n log n) is scalable, it can handle a great number of
    elements effectively. If you notice, the Quicksort algorithm that has the O(n
    log n) complexity is one of the most used in programming languages because of
