    # Factorial O(n!)


    The concept of factorial is simple. Suppose we have the factorial of 5! then this
    will equal 1 * 2 * 3 * 4 * 5 which results in 120.


    A good example of an algorithm that has factorial time complexity is the array
    permutation. In this algorithm, we need to check how many permutations are possible
    given the array elements. For example, if we have 3 elements A, B, and C, there
    will be 6 permutations. Let''s see how it works:


