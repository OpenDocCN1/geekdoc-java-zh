  md: '# Merge Sort


    The merge sort is a sorting algorithm that uses a divide-and-conquer strategy
    to sort an array of elements. It is an efficient sorting algorithm, with an average
    time complexity of O(n log n).


    The merge sort algorithm works by recursively dividing the input array into two
    halves until each half contains only one element or is empty. Then, it merges
    the sorted subarrays back together to produce the final sorted array.


    The merge step involves comparing the first element of each subarray and selecting
    the smaller one to be placed into the final array. This process continues until
    all elements have been merged into the final array.


    One of the advantages of merge sort is that it is a stable sorting algorithm,
    meaning that elements with the same value will retain their original order in
    the sorted array. Additionally, merge sort can be easily implemented in a parallelized
    manner, making it a popular choice for large-scale sorting applications.


    Let''s see a diagram from the Merge sort to have an idea of how it works and also
    what is the order of execution:'
