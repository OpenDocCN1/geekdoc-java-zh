    # # Summary


    +   - An array is allocated in memory from back to back.

    - Accessing an array by index has the time complexity of O(1), it''s pretty fast.

    - Static array is the array that is created with a size and a type pre-defined.

    - Dynamic array is an adaptation of the static array that automatically resizes
    it when necessary.

    - A dynamic array will double its size when necessary.

    - Adding an element to a dynamic array will be mostly O(1) because there will
    be space more often.

    - When adding an element to a dynamic array exceeds the size of the static array
    under the hood, it will be necessary to create a new array, copy the elements
    from the existing array, then add the new element. Therefore, the time complexity
    will be O(n).

    - Adding an element in the middle of the array will have the time complexity to
    shift all elements from the right side to one position on the right. Only then
    will we be able to insert the element by index.

    - To remove the first element from the array, it will be necessary to shift all
    the elements from the right to the left. Therefore, the time complexity is O(n).

    - To remove an element from the array in the last position takes O(1) complexity.
    That''s because we only need to remove the last value and we have direct access
    to it.'
