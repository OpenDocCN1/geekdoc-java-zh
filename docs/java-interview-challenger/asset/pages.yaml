  md: '# Static Memory Allocation


    Static memory is the stack memory in Java. The stack memory is used to allocate
    space from local variables, and methods invocations in the LIFO (Last-in Last-out)
    style.


    A very important point from the stack memory is that when a method finishes its
    execution the variable and the method will be removed from the stack. When using
    the stack memory there won''t be problems with threads collisions because each
    thread has its own stack.


    Also, the access pattern from the stack is easy enough to allocate and deallocate
    memory it is faster than the dynamic memory (heap memory).


    # Dynamic Memory Allocation


    The dynamic memory in Java is the heap memory. The heap memory is used to store
    objects and the references of these objects are stored in the stack memory.


    The heap memory can be accessed globally in the application. It''s also more complex
    than the stack memory. In the heap memory, objects need to be collected non-used
    objects by the Garbage Collector. Also, since the objects are shared in the application,
    the heap memory is not thread-safe.


