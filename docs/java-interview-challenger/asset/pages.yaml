  md: 'Behavioral interviews focus on how friendly you are, how good you communicate,
    and how well you work in a team.


    Culture fit interview evaluates if your values are similar to the company’s values.


    Take home project. They will test your ability to create a production-ready system.


    Code quality will see how well you can use the best programming practices to make
    your code simple.


    Code design will check how you divide your code into layers. In Java, it’s usually
    Controller, Service, Repository, Entity data, and transfer data.


    Java Application interview will test your knowledge in the Java language. A few
