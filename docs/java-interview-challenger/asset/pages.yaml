  md: 'Java Interview Process


    opportunity. If your experience matches what they are looking for, you will pass
    this one.


    +   - Behavioral Interview: Checks if you behave in a suitable way that aligns
    with the company’s values. They will usually see if you complain about your previous
    company, if you work well in a team if you are friendly, and if you communicate
    clearly.\n- Culture Fit: In this interview, it''s important for you to check what
    are the company values, then you show those values in this interview. In short,
    you need to be friendly, communicate clearly, and show that you want to bring
    value to the company with your work.


    # Take Home Project


    Sometimes companies will opt to give you a take-home project. They will access
    your skills to create a robust and performant system using after fundamental concepts
    of a web application usually.


    In one interview I did, they wanted me to create a manual job application with
    a Thread pool and a queue. Sometimes, they will ask you to create something even
    if there are already several frameworks that do the job.


    Other takeaway tests will ask you to create a normal application with the problem
    they are presenting, and your job is to create the project in a way that is robust,
    performant, and has a good code design.


    They are expecting an application that is production-ready, which means well tested,
    with logs, containerized ready to be deployed in the cloud, well-documented, and
    with different profiles to deploy in multiple environments such as dev, stage,
    qa, and production.


    Obviously, they are expecting you to solve the problem presented in an optimized
    way.'
