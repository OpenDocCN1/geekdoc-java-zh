    # Recursion Tree with Fibonacci


    The Fibonacci algorithm is a classic one every developer does during their college
    studies. Solving the Fibonacci algorithm with recursion though is not so efficient
    it uses a lot more memory and it’s more complex.


    If you forgot what is the Fibonacci algorithm, the goal is to basically sum the
    previous number with the next one starting with 0 and 1. For example, by starting
    the algorithm receiving 0 and 1 we would have the following numbers:


    0, 1, 2, 3, 5, 8, 13, 21, 34, 55...


    A way to solve this problem in maths is to use the following formula:


    Fn = Fn-1 + Fn-2


    Considering that maths is the basis of programming and it’s what is behind it,
    we can replicate that in code by using recursion.'
