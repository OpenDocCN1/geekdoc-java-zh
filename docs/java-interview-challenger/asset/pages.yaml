  md: '# # Stack


    The stack data structure is used in many important algorithms such as depth-first
    search and recursive methods.


    A stack also uses the LIFO (Last-in Last-out) strategy which means that the last
    element in will be the last out. This data structure can be easily represented
    in a real-world stack of plates. Let''s see the following diagram to understand
    better the stack data structure:


    ![](img/508455d7d9cdb199f1cdef01c90e5d26_83_0.png)


    Figure 11. LIFO


    Note that in the above diagram, the last plate placed on the top of the stack
    will be the first one to be removed. We would do the same with a real-world stack
    of plates. Removing the first plate of the stack would likely knock over the the
    plates.


    # ## Inserting and Removing Elements from a Stack with Java


    As mentioned above, a Stack follows the LIFO (Last-in-first-out) strategy. It''s
    the same as the real-world situation of stacking plates. We will use the most
    common methods of a stack.'
