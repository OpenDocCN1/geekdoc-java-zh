    same as 3!


    If we have 4 elements, we will have 4! which is the same as 24 permutations, if
    5! 120 permutations, and so on.


    Another algorithm is the traveling salesman, you can learn more in the following
    link (https://en.wikipedia.org/wiki/Travelling_-salesman_problem)[https://en.wikipedia.org/wiki/Travelling_-salesman_problem].
    There is no need to fully understand this algorithm, it''s quite complex but it''s
    good to know that it has the factorial time complexity.


