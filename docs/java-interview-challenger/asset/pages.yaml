  md: '# # Logarithm


    The logarithm time complexity is present in many algorithms and it''s very effective.
    Therefore, it''s important to understand how it works so we can know how performant
    the algorithm that has this time complexity is.


    In simple words, a logarithm is the number of times a number multiplies itself
    to get a certain result. Let''s take a look at the mathematical function before
    seeing practical examples:


    ![](img/508455d7d9cdb199f1cdef01c90e5d26_133_0.png)


    Figure 32. Logarithm Formula


    If we substitute b (base) with 2, then the result will be the x (exponential)
    number of 2 to result in x.


    For example, in the context of algorithms let''s consider n = 16 and we have to
    figure out what is the power number that the base 2 should have for the result
    of 16.


    ```

    log 2 ^ y = 16 == log 2 ^ 4 = 16

    ```


    The number 2 powered by 4 is the same as 16. Therefore, the algorithm will have
    4 iterations in its worst-case scenario.'
