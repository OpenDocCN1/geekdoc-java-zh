  md: '# Market Yourself


    Your CV is a way to market yourself, but an even stronger way to market yourself
    is to share your knowledge. You build trust with people who have never met you
    by sharing your knowledge.


    You can also combine your knowledge sharing with your CV. You can include links
    from your blog, Youtube channel, or talks you gave.


    Also, you can skip interviews entirely if you are well known to solve a specific
    problem that companies need very much. If a person needs the problem you solve
    to be solved, they will ask you to join their company, and they will ask you how
    much you want to solve this problem.


    # Having a blog


    Having a blog is a great investment in yourself and your career. That’s because
    you will be improving your communications skills and will be filling out the knowledge
    gaps you have. The ultimate way to learn anything is by sharing what you know.


    If you decide to create a blog, make sure you are consistent. You will also need
    to determine a focus. Meaning what problem you will solve that will make you stand
    out for companies. Let’s see some problems:


    +   - Performance

    - Bugs

    - Security

    - Data

    - Cloud Resilience


    You can also share your knowledge on something you are learning. Let’s suppose
    you are learning AWS concepts; you can share this'
