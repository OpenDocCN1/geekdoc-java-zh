    # Using Stack with Deque and ArrayDeque


    The Java docs of the Stack class has the following comment:


    A more complete and consistent set of LIFO stack operations is provided by the
    Deque interface and its implementations, which should be used in preference to
    this class. For example: Deque stack = new ArrayDeque();


    Therefore, it''s more effective to use Deque stack = new ArrayDeque(); for dealing
    with Stack operations in Java.


    The Deque interface has operations of a Stack and Queue. It''s also the short
    name for a double-ended queue. It''s recommended to use Deque when there is no
    need for thread-safe operations.


    With Deque, we can do the same as the Stack class and the elements are inserted
    from top to bottom which is what is expected from the Stack data structure:'
