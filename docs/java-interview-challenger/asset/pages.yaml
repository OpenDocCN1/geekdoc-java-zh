  md: '# # Quicksort


    The Quicksort algorithm is one of the most effective for Java and any other programming
    languages. It''s used behind the scenes in many JDK API methods for example.


    # ## Choosing the pivot with the Quicksort Algorithm


    The first step to the Quicksort algorithm is to choose the pivot number. The pivot
    number ideally should be a number that when the array is fully sorted would be
    right in the middle.


    It doesn''t need to be exactly the number in the middle of the array. Instead,
    we try to choose an element that will be close to it. A technique that is commonly
    used for that is the median of three. The idea is that we pick the first, middle,
    and last elements of the array, sort them, and finally choose the element in the
    middle. The pivot element is in the middle or close to it, then we will have a
    time complexity of O(n log n).


    Alternatively, we can simply pick the first or last elements of the array. But
    if the element is the smallest or greatest of the array, then the sorting will
    have the worst-time complexity of 0(n2).


    # ## Creating Partitions with the Quicksort Algorithm


