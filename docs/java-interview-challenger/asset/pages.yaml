  md: '# Java Interview Process


    Interviews are difficult and many times tricky, and if we don’t know what the
    rules are to pass in an interview, we are very likely to fail.


    One important point to remember when doing interviews is that they don’t necessarily
    test your skills as a software engineer. The interviews have their gaps, and they
    could be better. For example, if it’s been a while since we don’t practice algorithms
    and need to know some data structures, we will likely fail the interview.


    Therefore, understanding the rules of the game is very important. Otherwise, we
    won’t pass on those interviews.


    Being rejected in many interviews and feeling frustrated is a normal feeling.
    I’ve been rejected in many interviews and felt frustrated, but we need to remember
    all the time interviews will not define how good we are as software engineers.
    It will test some skills, but the day-to-day work is completely different.


    That’s why I created this chapter so you can understand the rules of the interview
    game so you can pass on those interviews.


    # Interview Mindset


    Don’t be intimidated by the amount of technologies you see in a job spec because
    no one really knows all of those technologies in depth. Instead, knowing what
    those technologies do is usually enough.


    Also, see failing in an interview as a necessary step for your growth. Failure
    is just a stepping stone to bring you success. The crucial point is to learn why
    we failed, improve and try again.'
  merge: -1
