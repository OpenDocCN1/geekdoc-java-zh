    # Code analysis:


    As you can see in the above code, the first step is to invoke the mergeSort method.
    Within this method, we can see the base condition from the recursion which is
    whenever the array reaches the size of 0 or 1.


    Until the recursion doesn''t reach the base condition, the dividing process in
    the array will continue. When the recursion reaches the base condition from the
    merge sort, then the sorting will start and the elements will also be merged.


    The left side of the array will be sorted before the right array. When both sides
    are divided, merged, and sorted the final left and right sides will be merged
    and the whole array will be sorted.


    # When to Use Merge Sort?


    The merge sort algorithm is a good choice in the following scenarios when:


    **Stability is important:** Merge sort is a stable sorting algorithm. This means
    it does not change the order of elements that are the same. This is important
    if there is some special configuration within each element such as a timestamp
    metadata. Therefore, if we have an array as the following { 3, 2, 2, 2, 1 }, the
    elements with the value of 2 won''t change the order. On the other hand, sorting
    algorithms such as Quicksort or Heapsort will perform unstable sorting meaning
    that elements with the same value will change their order.


    **Space is not a constraint:** Merge sort requires additional space proportional
    to the size of the input array. It needs space for the temporary arrays used during
    the merge process. Merge sort doesn''t sort the array in place, this means, it
    doesn''t use the same input array.'
  merge: -1
