  md: '# Memory Allocation


    Every time we create a variable, invoke a method, or create an instance memory
    allocation will happen in Java and any other programming language. Data is stored
    in the form of bits, each memory slot can hold 1 byte which is the same as 8 bits.


    Let''s see the chart of how many bits each variable from Java uses:


    | Type | Data Size | Data Value Range |

    |---|---|---|

    | boolean | 1 bit | false, true |

    | byte | 1 byte | -128 to 127 |

    | short | 2 bytes | 0 (\u0000) to (\ffff) |

    | char | 2 bytes | -32768 to 32767 |

    | int | 4 bytes | -2147483648 to 2147483647 |

    | long | 8 bytes | 1-9223372036854775808 to 9223372036854775807 |

    | float | 4 bytes | 1.402398466e-45f to 3.40282347e+38f |

    | double | 8 bytes | 4.94065645841264544e-324 to 1.797693134862315700e+308 |


    # Data in Binary Number


    Computers only understand binary numbers, therefore, every data stored in memory
    will be transformed into a binary number. A binary number is a number with a base
    2 which means that the data must be represented by only 0 or 1.


    The int number for example has 4 bytes which translates to 32 bits.'
