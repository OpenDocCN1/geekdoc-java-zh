- fmt: "\nIt is possible to distinguish two locations (e.g., two class attributes)\
    \ when they belong to different classes, while this cannot be done when they belong\
    \ to the same class but to different class instances (objects). In other words,\
    \ the OFG constructed according to the rules given in Section 2.2 is object insensitive.\
    \ While this may be satisfactory for some analyses, in some cases the ability\
    \ to distinguish among locations that belong to different objects might improve\
    \ the analysis results substantially.\n\n### Object Sensitive OFG\n\nAn object\
    \ sensitive OFG can be built by giving all non-static program names an object\
    \ scope instead of a class scope (static attributes and program locations that\
    \ belong to static methods maintain the class scope).\n\nObjects can be identified\
    \ statically by their allocation points, thus, in an object sensitive OFG, non-static\
    \ class attributes and methods (including their parameters and local variables)\
    \ are replicated for every statically identified object. Syntactically, an object\
    \ allocation point in the code is determined by statements of the kind (5) in\
    \ Fig. 2.1. For each such allocation point, an object identifier is created, and\
    \ all attributes and methods in the class of the allocated object are replicated\
    \ for it. Replicated program locations become distinct nodes in the OFG.\n\nConstruction\
    \ of the OFG edges becomes more complicated when locations are object sensitive.\
    \ For example, in presence of method calls, sources and targets of OFG edges can\
    \ be determined only if the current object (pointed to by `this`) and the objects\
    \ pointed by the reference variable used as invocation target are known. Chapter\
    \ 4 provides the details of an algorithm to infer such an information. \n\nThe\
    \ effect of object sensitivity on the accuracy of the OFG consists of a finer\
    \ grain edge construction, resulting in a more precise propagation of information\
    \ along the data flows. In fact, information is not mixed when propagated along\
    \ different objects, in an object sensitive OFG.\n\nThe main difficulty in object\
    \ sensitive OFG construction is the static estimation of the objects referenced\
    \ by variables. This information is necessary whenever an attribute or a method\
    \ are accessed/invoked through a reference variable. In fact, the related edges\
    \ connect locations scoped by the pointed objects.\n\nIn order to construct an\
    \ object sensitive OFG, the information about the objects possibly referenced\
    \ by program variables can be obtained by defining a flow propagation on the OFG\
    \ aiming at statically estimating the referenced objects. This is the topic of\
    \ Chapter 4. However, the algorithm used for this purpose assumes the availability\
    \ of the OFG itself. Thus, we have a mutual dependence. It can be solved by constructing\
    \ the OFG edges incrementally.\n\nOn the contrary, all OFG nodes can be constructed\
    \ from the very beginning. Initially, all allocations points are associated to\
    \ object identifiers, used to scope the names of non-static program locations.\
    \ This produces the set of all OFG nodes. As regards edges, only internal edges\
    \ can be built at this stage, that is, edges involving constructor/method parameters\
    \ or local variables, that are replicated for every object scope.\n\nInvocation\
    \ of methods and access to class attributes require knowledge about the objects\
    \ referenced by variables and by the special location `this`. Such information\
    \ is approximated by a first round of flow propagation. At the end of the propagation,\
    \ edges can be added to the OFG for method calls and attribute accesses, using\
    \ the objects pointed to by the related variables, as determined by the flow propagation.\
    \ On the new version of the OFG obtained in this way, including the edges produced\
    \ by the result of the previous flow propagation, a better estimate of the objects\
    \ pointed by variables can be obtained. Refinement of the OFG can continue, until\
    \ a stable one is produced (it should be noted that the incremental construction\
    \ is monotone, in that edges are possibly added, but never removed).\n\nComplete\
    \ construction of an object sensitive OFG is possible only if the whole program\
    \ is available (including the `main`), since all allocation points of all involved\
    \ objects must be part of the code under analysis. In Object-Oriented programming\
    \ this may not be the case, since incomplete systems are often produced and classes\
    \ are often reused in different contexts. In these situations, an object insensitive\
    \ OFG construction may be more appropriate.\n\n### Pointer Analysis\n\nThe OFG\
    \ and the related flow propagation algorithms are based on research conducted\
    \ on pointer analysis. The aim of pointer analysis is to obtain a static approximation\
    \ of any points-to relationship that may hold at run-time between pointers and\
    \ program locations. Similarly, when Object-Oriented programs are considered,\
    \ the relationship between reference variables and objects is analyzed.\n\nPointer\
    \ analysis algorithms can be divided into flow/context sensitive [21, 47, 60]\
    \ and flow/context insensitive [3, 81]. Flow/context sensitive algorithms produce\
    \ fine grained and accurate results, in that a points-to relationship is determined\
    \ that holds at every program statement. Moreover, different invocation contexts\
    \ can be distinguished. However, the computational complexity involved in these\
    \ approaches is high, and in practice their performance does not scale to large\
    \ software systems. Flow/context insensitive algorithms have lower complexity\
    \ and scale well. On the other side, they produce results that hold for the whole\
    \ program, and the points-to relationships they derive cannot be distinguished\
    \ by statement or invocation context. Flow/context sensitive analyses are defined\
    \ with reference to the control flow graph [2] of a program, while flow/context\
    \ insensitive algorithms define the analysis semantics at the statement level.\n\
    \n### Reverse Engineering in Development\n\nThis chapter deals with the practical\
    \ issues related to the adoption of reverse engineering techniques within an Object\
    \ Oriented software development process. Tool support and integration is one of\
    \ the main concerns. This chapter contains some considerations on a general architecture\
    \ for tools that implement the techniques presented in the previous chapters.\
    \ A survey of the existing support and of the current practice in reverse engineering\
    \ is also provided.\n\nOnce an automated infrastructure for reverse engineering\
    \ is in place, the process of software evolution has to be adapted so as to smoothly\
    \ integrate the newly offered functionalities. This accounts for revising the\
    \ main activities in the micro-process of software maintenance. The kind of support\
    \ offered to program understanding has been already described in detail (see Chapter\
    \ 1, eLib example). The way other activities are affected by the integration of\
    \ a reverse engineering tool in the development process are described in this\
    \ chapter, by reconsidering the eLib program and the change requests sketched\
    \ in Chapter 1.\n\nThis chapter is organized as follows: Section 8.1 describes\
    \ the main modules to be developed in a reverse engineering tool for Object Oriented\
    \ code. Reverse engineered diagrams can be exploited for change location and implementation,\
    \ as well as for change impact analysis. Their usage with the eLib program is\
    \ presented in Section 8.2. The authors’ perspectives on potential\n"
