    为什么在抽象语法中，包、类、方法和变量标识符（`<pid>`, `<cid>`, `<mid>`, `<vid>`）使用的是标识符而不是它们的名称？鉴于 Java
    程序的源代码，总是可以对其进行转换，使其名称变为唯一的 [30]。属于同一类的重载方法名可以增加一个递增的整数后缀以使其唯一。对于具有相同名称的不同类的方法，也可以这样做。调用语句也会相应地进行转换。被调用的方法（或方法）可以通过所有静态类型兼容的可能性进行解析。


    ### 对象流图 (OFG)

    对象流图（OFG）是一个二元组 `(N, E)`，由一组节点 `N` 和一组边 `E` 组成。对于每个程序位置（即根据图 2.1 中的定义，局部变量、属性或形式参数），都会在
    OFG 中添加一个节点。


    根据图 2.2（右侧）中指定的规则向 OFG 中添加边。这些边代表了在被分析程序中发生的数据流。OFG 边的集合 `E` 包含所有且仅包含由图 2.2 中至少一条规则产生的所有对。


    当调用构造函数或方法时（分别为语句 (5) 和 (7)），会建立连接每个实际参数 `ai` 到其对应的形式参数 `fi` 的边。在调用构造函数的情况下，由
    `cs.this` 引用的（`cs` 是通过 `new c(…)` 调用的构造函数）新创建与相关赋值的左侧 `x` 配对（参见语句 (5)）。在调用方法的情况下，目标对象
    `y` 在被调用方法内部变为 `m.this`，生成边 `(y,m.this)`，而方法 `m` 返回的值（如果有）则流向左侧 `x`（配对 `(m.return,x)`）。


    OFG 中的边解释了程序中发生的所有数据流。虽然其中某些与特定的 Java 指令（如赋值或方法调用）相关，但另一些则可能与库类的使用有关。每当库类引入从变量
    `x` 到变量 `y` 的数据流时，都必须在 OFG 中包含一条边 `(x,y)`。


    ### 容器与数据流

    引入额外的外部数据流的库类分类由容器表示。抽象地说，容器对象提供了两种改变程序中数据流的基本操作：`insert`（向容器中添加对象）和 `extract`（访问之前插入到容器中的对象）。


    因此，对于带有容器的程序，OFG 构建中需要处理的两个基本情况如下：

    1. `c.insert(x);`

    2. `x = c.extract();`


    其中 `c` 是容器，`x` 是对象。在第一情况下，存在从对象 `x` 到容器 `c` 的数据流，而在第二种情况下，数据流是反的。相应地，OFG 中引入了以下边：

    1. `c.insert(x);` `(x,c) ∈ E`

    2. `x = c.extract();` `(c,x) ∈ E`


    在存在以下赋值时，OFG 中也会引入相同的边：

    1. `c = x;`

    2. `x = c;`


    出于此原因，在我们所采用的抽象程序表示中，与容器对象相关的插入和提取方法通过将相关语句转换为赋值语句（如上述所示）来处理。


    ### 外部数据流

    其他可能影响 OFG 中节点和边的外部数据流示例还与动态加载的使用（例如通过 Java 反射）以及对用其他语言编写的模块的访问（例如通过 Java Native
    接口 JNI）有关。在这些情况下，只要对外部流像上述处理容器那样进行（手动的）建模，仍然可以对数据流进行半自动化分析。用户需要参与指定发生此类流的代码片段，以及受其影响的程序位置。本节未显式讨论的其他语言特性（如异常处理和多线程）需要较小的扩展（例如识别
    `throw-catch` 链 [76]），而这些扩展是可以完全自动化的。


    ### 流传播算法

    OFG 代表了所有涉及对象的数据流。因此，可以利用它来分析程序的行为，沿着对象可能传播的相同流路径传播适当的信息。


    在接下来的章节中，将给出一些需要传播的信息类型的示例。对象被强制转换的类型就是其中一个例子。在给定程序点分配对象是另一个例子。然而，通常情况下可以假设从集合
    `V` 取的某些有趣信息正沿着 OFG 传播。相应地，可以给出一个流传播算法，它不依赖于 `V` 中的特定元素。图 2.3 甚至显示了通用流传播算法的伪代码。它是
    [2] 中描述的流分析框架的具体实例，应用于 OFG 而不是控制流图。OFG 的每个节点 `n` 分别在 `in[n]` 和 `out[n]` 集合中存储传入和流出的流信息，这些集合最初为空。此外，每个节点
    `n` 生成包含在 `gen[n]` 集合中的流信息项集，并防止 `kill[n]` 集合中的元素在节点 `n` 之后进一步传播。


    传入流信息从节点 `n` 的前驱节点获取，是各自 `out` 集合的并（正向传播）。对于某些分析，按照反向沿着 OFG 边传播流信息可能是恰当的（反向传播）。这是通过收集后继节点
    `out` 集合的传入信息来实现的。


    换句话说，伪语句 7 变为：

    ```

    ![](img/Image00008.gif)

    ```

    在反向传播的情况下。传入流信息（`in[n]`）通过移除 `kill[n]` 集合中的元素并添加 `gen[n]` 中的元素转换为流出信息 `out[n]`。流信息在
    OFG 内部反复传播，直到达到不动点：任何 OFG 节点中均没有传入或流出的信息发生变化。


    假设 OFG 中传播的流信息有一个上界，图 2.3 中的算法被确保在多项式时间内收敛。通过选择 OFG 中节点的适当排序，可以极大提高实际性能。在没有循环的情况下，最佳排序是由于图边诱导的偏序。当存在循环时，良好的策略是在考虑循环后的节点之前，在循环内部传播流信息。


    图 2.3 中的算法产生的解决方案具有以下属性：对于所有产生 OFG 中表示的数据流的程序执行都是有效的。由于 OFG 的定义是为了考虑所有静态可能的数据流，因此得到的解决方案是保守的（安全的），因为不会在任何由
    OFG 路径表示的时间发生数据流。然而，通常无法在静态上判断某条路径是否可行（即它对于某些输入是否可以实际执行）。因此，算法产生的解决方案可能是过度保守的，因为它允许在不可行的路径上进行流传播。因此，如果某个节点处存在流信息，可能存在某种程序执行实际产生了它；而如果不存在，则可以确保没有任何执行能够产生它。


