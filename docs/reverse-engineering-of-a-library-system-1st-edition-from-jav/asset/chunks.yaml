    In the life cycle of a software system, the maintenance phase is the largest and
    the most expensive. Starting after the delivery of the first version of the software
    [35], maintenance lasts much longer than the initial development phase. During
    this time, the software will be changed and enhanced over and over. So it is more
    appropriate to speak of software evolution with reference page number 2 to the
    whole life cycle, in which the initial development is only a special case where
    the existing system is empty.


    Software evolution is characterized by the existence of the source code of the
    system. Thus, the typical activity in software evolution is the implementation
    of a program change, in response to a change request. Changes may be aimed at
    correcting the software (corrective maintenance), at adding a functionality (perfective
    maintenance), at adapting the software to a changed environment (adaptive maintenance),
    or at restructuring it to make future maintenance easier (preventive maintenance)
    [35].


    During software evolution, the most reliable and accurate description of the behavior
    of a software system is its source code. In fact, design diagrams are often outdated
    or missing at all. Such a valuable information repository may not directly answer
    all questions about the system. Reverse engineering techniques provide a way to
    extract higher level views of the system, which summarize some relevant aspects
    of the computation performed by the program statements. Reverse engineered diagrams
    support program comprehension, as well as restructuring and traceability.


    When an existing code base is worked on, the micro-process of program change can
    be decomposed into localizing the change, assessing the impact, and implementing
    the change. All such activities depend on the knowledge available about the program
    to be modified. In this respect, reverse engineering techniques are a useful support.
    Reverse engineering tools provide useful high level information about the system
    being maintained, thus helping programmers locate the component to be modified.
    Moreover, the relationships (dependencies, associations, etc.) that connect the
    entities in reverse engineered diagrams provide indications about the impact of
    a change. By tracing such relationships the set of entities possibly affected
    by a change are obtained.


    Object Oriented programming poses special problems to software engineers during
    the maintenance phase. Correspondingly, reverse engineering techniques have to
    be customized to address them. For example, the behavior of an Object Oriented
    program emerges from the interactions occurring among the objects allocated in
    the program. The related instructions may be spread across several classes, which
    individually perform a very limited portion of the work locally and delegate the
    rest of it to others. Reverse engineered diagrams capture such collaborations
    among classes/objects, summarizing them in a single, compact view. However, recovering
    accurate information about such collaborations represents a special challenge,
    requiring major improvements to the available reverse engineering methods [48,
    100].


    When a software system is analyzed to extract information about it, the fundamental
    choice is between static and dynamic analysis. Dynamic analysis requires a tracer
    tool to save information about the objects manipulated and the methods dispatched
    during program execution. The diagrams that can be reverse engineered in this
    way are partial. They hold valid for a single, given execution of the program,
    with given input values, and they cannot be easily generalized to the behavior
    of the program for any execution with any page number 3 input. Moreover, dynamic
    analysis is possible only for complete, executable systems, while in Object Oriented
    programming it is typical to produce incomplete sets of classes that are reused
    in different contexts. On the contrary, a static analysis produces results that
    are valid for all executions and for all inputs. On the other side, static analyses
    may be over-conservative. In fact, it is undecidable to determine if a statically
    possible path is feasible, i.e., if there exists an input value allowing its traversal.
    Static analysis may conservatively assume that some paths are executable, while
    they are actually not so. Consequently, it may produce results for which no input
    value exists. In the following chapters, the advantages and disadvantages of the
    two approaches will be discussed for each specific diagram, illustrating them
    on an executable example.


