    第 18 页


    用于逆向工程这些图表的大多数静态分析共享一种代码表示，称为`对象流图`（Object Flow Graph`，`OFG`）。这种数据结构将在第 2 章介绍。本章包含了构建
    `OFG` 的规则，并引入了一种通用流传播算法，用于推断程序对象的属性。针对特定属性定义了该通用算法的特化版本。


    第 21 页


    `对象流图` (`OFG`) 是后续章节描述的静态分析的基础程序表示。`OFG` 允许追踪对象信息的流向：从分配语句创建对象，到对象赋值给变量，直到将对象存储在类字段中或在方法调用中使用它们。


    `OFG` 中传播的信息类型各异，这取决于所采用的分析的目的。例如，当分析被定义为静态确定比对象声明中类型更精确的对象类型时，通过强制转换表达式转换的对象类型可以是被传播的信息。因此，在本章中描述了一种流传播算法，并对正在处理的对象信息进行了通用指示。


    在本章的第一节中，Java 语言被简化为一种抽象语言，该语言保留了所有与对象流相关的特征，同时舍弃了其他语法细节。这种语言是定义 `OFG` 的基础，其节点和边根据第
    2.2 节给出的规则构建。对象可能会流向分析程序的外部。例如，一个对象可能会流入库容器，稍后从从中提取。第 2.3 节处理了 `OFG` 中此类外部对象流的表示。第
    2.4 节描述了在 `OFG` 上运行通用流传播算法。第 2.5 节考虑了对象不敏感和对象敏感 `OFG` 之间的区别。下一节将给出 `eLib` 程序的
    `OFG` 构建细节。本章以对相关工作的讨论结束。


    对 Java 程序进行以从代码逆向工程出设计图的静态分析是数据流敏感的，但控制流不敏感的。这意味着具有不同控制流但相同数据流的程序在第 22 页与相同的分析结果相关。数据流敏感性和控制流不敏感是通过参考名为`对象流图`
    (`OFG`) 的程序表示来定义分析来实现的。控制流不敏感的后果是 `OFG` 的构建可以相对于 Java 语言的简化抽象版本进行描述。所有引用数据流的 Java
    指令在抽象语言中都有正确的表示，而完全不影响数据流的指令被安全地忽略了。因此，所有的控制流语句（条件语句、循环等）都不是简化语言的一部分。此外，在抽象语言中，名称解析也被简化了。所有标识符都具有完全的作用域名，其前面是一个由点分隔的包含性包、类和方法的列表。通过这种方式，永远不会发生名称冲突。


    选择数据流敏感/控制流不敏感的程序表示主要出于两个原因：计算复杂性和面向对象程序的“本质”。正如在第 2.4 节讨论的，控制流不敏感算法的理论计算复杂性和实际性能远优于控制流敏感的对应算法。此外，面向对象代码的结构通常对数据流施加的约束比控制流更多。例如，当从使用某个类的应用程序移动到另一个应用程序时，方法调用的顺序可能会改变，而复制和传播对象引用的可能方式保持稳定。因此，对于实际方法调用序列未知的面向对象代码，采用控制流不敏感/数据流敏感的分析算法是有意义的，这些算法保留了处理对象引用的方式。


    图 2.1 显示了简化版 Java 语言的抽象语法。Java 程序 `P` 由零个或多个声明 (`D`) 组成，随后是零个或多个语句 (`S`)。由于控制流不敏感性，声明和语句的实际顺序无关。包、类和方法的嵌套结构被完全扁平化了。例如，属于不同方法的语句没有被分成不同的组。然而，完整的作用域在名称中被显式保留（见下文）。因此，可以对数据元素进行细粒度的识别，而对控制元素则不如此（控制流不敏感性）。将给定的
    Java 程序转换为其抽象语言表示是一项简单任务，可以完全自动化完成。可以使用程序转换工具来实现这一目标。


    声明有三种类型：属性声明（产生式 (2)）、方法声明（产生式 (3)）和构造函数声明（4）。属性声明仅由属性完全的作用域名组成，即由点分隔的包列表，随后是一个由点分隔的第
    23 页类列表，最后是属性标识符。方法声明由完全的作用域方法名 `m`（构建方式类似于类属性名 `a`），随后是形式参数列表 `f1,…fk`。转化，每个形式参数
    `fi` 都有 `m`（完全的作用域方法名）作为前缀，参数标识符作为点分隔的后缀。构造函数具有与方法类似的抽象语法，用类名 (`<cid>`) 代替方法名
    (`<mid>`)）。声明不包含类型信息，因为构建 OFG 不需要这些信息。


    第 24 页


    语句三种类型（见图 2.1）：分配语句（产生式 (5)）、赋值语句（产生式 (6)）和方法调用（产生式 (7)）。


    所有语句的左侧 `x`（方法调用可选）是程序位置。赋值语句的右侧 `y` 以及方法调用的目标也是程序位置。程序位置 (`<progloc>`) 是局部变量、类属性或方法参数。前者的结构与形式参数相同：点分隔的包/类前缀，随后是方法标识符，最后是变量标识符。属性访问链被替换为最后一个字段，且具有完全的作用域（例如
    `a.b.c` 变为 `B.c`，假设 `b` 是类 `B` 的属性，且类 `B` 包含字段 `c`）。分配和方法调用中的实际参数 `a1,…ak` 也是程序位置
    (`<progloc>`)。终止程序位置的变量标识符 (`<vid>`) 有两个特殊值：`this` 表示指向当前指针，`return` 表示方法的返回值。非对象类型的程序位置（包括形式和实际参数，例如
    int 变量）在所选的程序表示被省略，因为它们与任何对象流无关。


    第 25 页


    条件语句和返回语句已被跳过，


