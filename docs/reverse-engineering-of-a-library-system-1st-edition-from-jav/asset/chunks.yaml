    \ and relationships not shown in Fig. 8.2 for space reasons, the most important\
    \ one is the entity `expression`, accounting for all mathematical expressions\
    \ supported by the language, possibly intermixed with method invocations. The\
    \ sub-hierarchy of the expression entities closely resembles that available in\
    \ most programming languages (either procedural or Object Oriented).\n\nThe information\
    \ represented according to the model in Fig. 8.2 is sufficient to build the OFG\
