    Why in the abstract grammar, package, class, method, and variable identifiers
    (`<pid>`, `<cid>`, `<mid>`, `<vid>`) are indicated instead of their names? Given
    the source of a Java program, it is always possible to transform it so as to make
    its names unique [30]. Names of overloaded methods belonging to the same class
    can be augmented with an incremented integer suffix, to make them unique. The
    same can be done for methods of different classes with the same name. Calling
    statements are transformed correspondingly. The called method(s) can be resolved
    with all statically type-compatible possibilities.


    ### Object Flow Graph (OFG)

    The Object Flow Graph (OFG) is a pair `(N, E)`, comprising of a set of nodes `N`
    and a set of edges `E`. A node is added to the OFG for each program location (i.e.,
    local variable, attribute or formal parameter, according to the definition in
    Fig. 2.1).


    Edges are added to the OFG according to the rules specified in Fig. 2.2 (right).
    They represent the data flows occurring in the analyzed program. The set of OFG
    edges `E` contains all and only the pairs that result from at least one rule in
    Fig. 2.2.


    When a constructor or a method are invoked (statements (5) and (7), resp.), edges
    are built which connect each actual parameter `ai` to the respective formal parameter
    `fi`. In case of constructor invocation, the newly created object, referenced
    by `cs.this` (with `cs` the constructor called by `new c(…)`), is paired with
    the left hand side `x` of the related assignment (see statement (5)). In case
    of method invocation, the target object `y` becomes `m.this` inside the called
    method, generating the edge `(y,m.this)`, and the value returned by method `m`
    (if any) flows to the left hand side `x` (pair `(m.return,x)`).


    Edges in the OFG account for all data flows occurring in a program. While some
    of them are associated with specific Java instructions, such as the assignment
    or the method call, others may be related to the usage of library classes. Each
    time a library class introduces a data flow from a variable `x` to a variable
    `y`, an edge `(x,y)` must be included in the OFG.


    ### Containers and Data Flows

    A category of library classes that introduces additional, external data flows
    is represented by containers. Abstractly, container objects provide two basic
    operations that alter the data flows in a program: `insert`, to add an object
    to a container, and `extract`, to access an object previously inserted into a
    container.


    Thus, for a program with containers, the two basic cases that have to be handled
    in OFG construction are the following:

    1. `c.insert(x);`

    2. `x = c.extract();`


    where `c` is a container and `x` is an object. In the first case there is a data
    flow from the object `x` to the container `c`, while in the second case the data
    flow is reversed. Correspondingly, the following edges are introduced in the OFG:

    1. `c.insert(x);` `(x,c) ∈ E`

    2. `x = c.extract();` `(c,x) ∈ E`


    The same edges would be introduced in the OFG in presence of the following assignments:

    1. `c = x;`

    2. `x = c;`


    For this reason, in the abstract program representation we have adopted, insertion
    and extraction methods associated with container objects are accounted for by
    transforming the related statements into assignment statements, such as those
    given above.


    ### External Data Flows

    Other examples of external data flows possibly affecting the nodes and the edges
    in the OFG are associated with the usage of dynamic loading (e.g., through Java
    reflection) and with the access to modules written in other programming languages
    (e.g., through the Java native interface, JNI). In these cases, a semi-automated
    analysis of the data flows can still be conducted, provided that the external
    flows are (manually) modeled in a similar way as done above for the containers.
    The involvement of the user is required in the specification of the code fragments
    where such flows take place and of the program locations affected by them. Other
    language features not addressed explicitly in this section, such as exception
    handling and multi-threading, require minor extensions (e.g., identifying the
    `throw-catch` chains [76]) that can be fully automated.


    ### Flow Propagation Algorithm

    The OFG represents all data flows involving objects. It is thus possible to exploit
    it to analyze the program’s behavior, by propagating proper information according
    to the same flows along which objects are possibly propagated.


    In the next chapters some examples of the kind of information to be propagated
    will be given. The type to which an object is cast is one such example. The allocation
    of an object at a given program point is another one. However, in general it can
    be assumed that some interesting piece of information, taken from a set `V`, is
    propagated along the OFG. Correspondingly, a flow propagation algorithm can be
    given, independent of the specific elements in `V`. evenFig. 2.3 shows the pseudocode
    of the generic flow propagation algorithm. It is a specific instance of the flow
    analysis framework described in [2], applied to the OFG instead of the control
    flow graph. Each node `n` of the OFG stores the incoming and outgoing flow information
    respectively inside the sets `in[n]` and `out[n]` which are initially empty. Moreover,
    each node `n` generates the set of flow information items contained in the `gen[n]`
    set, and prevents the elements in the `kill[n]` set from being further propagated
    after node `n`.


    Incoming flow information is obtained from the predecessors of node `n` as the
    union of the respective `out` sets ( forward propagation ). For some analyses,
    it may be appropriate to propagate flow information following the OFG edges in
    reverse order ( backward propagation ). This is obtained by collecting the incoming
    information from the `out` sets of the successors.


    In other words, the pseudo-statement 7 becomes:

    ```

    ![](Image00008.gif)

    ```

    in case of backward propagation. Incoming flow information (`in[n]`) is transformed
    into outgoing information `out[n]` by removing the elements in the set `kill[n]`
    and adding those in `gen[n]`. Flow information is repeatedly propagated inside
    the OFG until the fixpoint is reached: no incoming and no outgoing information
    changes, in any OFG node.


    Assuming an upper bound for the flow information propagated in the OFG, the algorithm
    in Fig. 2.3 is ensured to converge in polynomial time. The actual performance
    can be greatly improved by choosing a proper ordering of the nodes in the OFG.
    In absence of loops, the best ordering is the partialorder induced by the graph
    edges. When loops are present, a good strategy consists of propagating the flow
    information inside the loop before considering the nodes following the loop.


    The solution produced by the algorithm in Fig. 2.3 has the property of being valid
    for all program executions that give rise to the data flows represented in the
    OFG. Since the OFG has been defined in order to take into account all statically
    possible data flows, the resulting solution is conservative (safe), in that no
    data flow can ever occur at time which is not represented by a path in the OFG.
    However, in general it is impossible to decide statically if a path is feasible
    or not (i.e., if it can actually be executed for some input). Thus, the solution
    produced by the algorithm might be over-conservative, in that it may permit flow
    propagation along infeasible paths. Consequently, if a flow information is present
    at a node, there may be an execution of the program that actually produces it,
    while if it is absent, it is ensured that no execution can ever produce it.


