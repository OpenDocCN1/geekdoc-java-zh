    # Chapter 1 : reverse engineering concepts


    ### 1.1 maintenance problem and solution


    maintenance problem and solution :


    **problem:**

    maintenance is very expensive .


    **Solution:**

    re-engineering by reverse engineering from code to diagrams

    for doing model transformation to restructuring a system

    then forward engineering from diagrams to code

    for doing code refactoring to restructuring a system .


    **Benefit:**

    maintenance is not expensive .


    **Drawbacks:**

    can’t capture some types of information are not captured,

    and not completely automate of a complex process .


    **Ways:**

    object oriented code analysis by pointer analysis

    via data structure (object flow graph) and algorithm (flow propagation).


    ### 1.2 system development life cycle (SDLC)


    system development life cycle (SDLC) :


    ![](Image00000.jpg)


    ### 1.3 architecture of a reverse engineering tool


    architecture of a reverse engineering tool :


    ![](Image00001.jpg) **notes:**


    **Model**: abstract form of a data (class model) (alternative perspectives can
    be adopted when the source code is analyzed and different higher level views are
    extracted from it).


    **Diagram**: concrete form of a data stored in XML file, this file used for describe
    data to modify it by programming language and for data compatibility when transport
    it between different systems (class, object, interaction, state, and package diagrams)
    (maximum 10 entities in diagram per package to makes a diagram readable) (a single
    diagram recovered from the code through reverse engineering is insufficient. rather,
    a set of complementary views need to be obtained, addressing different program
    understanding needs).


    ### 1.4 object oriented code analysis


    object oriented code analysis :


    **types:**

    *   **static**: produces results for all or not input .

    *   **Dynamic**: produces results for a single input and possible only for complete,
    and executable systems .


    **Static object oriented code analysis:**

    is data flow sensitive but control flow insensitive. this mean data flows are
    represented in `OFG` but control flow aren’t . this mean instruction that don’t
    affect the data flows at all are safely ignored like control flow statements .
    this mean code with the same data flows and different control flows are associated
    with the same analysis results . Because computational complexity and the nature
    of the object oriented programs .


    ### 1.5 pointer analysis


    pointer analysis :

    obtain a static approximation of any points-to relationships that may hold at
    run-time between pointers and program locations , similarly, when object-oriented
    programs are considered, the relationship between reference variables and object
    is analyzed .


    ### 1.6 object flow graph (OFG) data structure


    object flow graph (OFG) data structure :

    is a data structure for represents all the data flows involving objects .


    **Types:**

    *   **Object insensitive**: to distinguish 2 location belong to different classes,
    used when complete system is not available like class `Main`.

    *   **Object sensitive**: to distinguish 2 location belong to same class but to
    difference class instances (objects), used when complete system is available like
    class `Main`, capture the data flows occurring in the code fragment more accurately
    than those in object insensitive because information is not mixed when propagated
    along different objects .


    ### 1.7 flow propagation algorithm


    flow propagation algorithm :

    is an algorithm for propagating information via `OFG` to analyze the program’s
    behavior and to recover the design views of interest .


    **Types:**

    *   **flow/context insensitive**: different statements can`t be distinguished,
    have lower computational complexity and their performance scale well to large
    software systems .

    *   **flow/context sensitive**: different statements can be distinguished, have
    high computational complexity and their performance doesn`t scale well to large
    software systems, produce accurate results than those in flow/context insensitive
    because results that hold for every program statement not for the whole program
    like flow/context insensitive .


    ### 1.8 production rules for constructing insensitive and sensitive OFG and making
    forward and backward flow propagation


    production rules for constructing insensitive and sensitive OFG and making forward
    and backward flow propagation :


    **allocation statement:**

    `( x = new c (a k) )`

    `===> edges : { (a’k,f’k),(cs’.this,x’) }`

    `===> forward : gen [cs.this] = {c}, gen [x] = {ci}`


    **concrete code:**

    ```java

    // class Library, method borrowDocument

    Loan Loan = new Loan(user);

    // first Loan for interface

    // second Loan for container

    // third Loan for object (contains method for insert it to container, and extract
    it from container)

    ```

    **abstract code:**

    `Library.borrowDocument.loan = new Loan (Library.borrowDocument.user)`


    **OFG edges:**

    `{ (Library.borrowDocument.user, Loan.Loan.usr), (Loan.Loan.this, Library.borrowDocument.loan)
    }`


    **insert only if extract it with change the second node.**

    **assignment statement:**

    `( x = (c)y )`

    `===> edges : { y’,x’ }`

    `===> backward : gen[y] = {c}`


    **concrete code:**

    ```java

    // class Library, method addLoan

    User user = loan.getUser();

    ```

    **abstract code:**

    `Library.addLoan.user = loan.getUser.return`


    **OFG edges:**

    `{ (loan.getUser.return, Library.addLoan.user) }`


    **method invocation:**

    `( [x=] (c)y.m(ak) )`

    `===> edges : { (y’,m’.this),(a’k,f’k),(m’.return,x’) }`

    `===> backward : gen[m.return] = {c}`


    **concrete code:**

    ```java

    // class Library, method borrowDocument

    addLoan(loan);

    ```

    **abstract code:**

    `Library.borrowDocument.this.addLoan(Library.borrowDocument.loan)`


    **OFG edges:**

    `{ (Library.borrowDocument.this, Library.addLoan.this), (Library.borrowDocument.loan,
    Library.addLoan.loan) }`


    **notes:**

    *   object insensitive OFG without replication (‘’), and

    *   object sensitive OFG with replication (‘) .

    *   `c` : class name

    *   `cs` : class constructor

    *   `(c)` : type coercion

    *   `x,y` : program locations

    *   `a` : class attribute name

    *   `m` : method name

    *   `ak` : actual parameters

    *   `fk` : formal parameters

    *   `gen[n]` : generates the set of flow information items

    *   `‘` : replication

    *   `ci` : object identifier

    *   `in[n],out[n]` : incoming and outgoing flow information

    *   `kill[n]` : prevents the elements from being further propagated

    *   `n` : node

    *   `pred(n)` : set of predecessors of node n

    *   `succ(n)` : set of successors of node n


