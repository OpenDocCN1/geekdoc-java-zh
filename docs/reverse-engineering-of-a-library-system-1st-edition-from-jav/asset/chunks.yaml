    ## 算法的实现


    前章节描述的算法的实现受实际考虑因素的影响，例如目标语言、可用库、结果图的图形格式等。然而，可以设计一种通用的架构，并在每个特定案例中实例化。在这种架构中，功能被分配给不同的模块，以便将主任务分解为可管理的、定义良好的子任务。反之，每个模块都需要根据实际实现构建的具体设置进行特化处理。


    图 8.1 显示了组成逆向工程工具的模块所执行的主要处理步骤。第一个模块 `Parser` 负责处理源编程语言的语法。它包含了定义所分析语言的文法。它解析源代码并构建与文法产生式关联的推导树。更优的是采用推导树的更高层级视图，以便将后续模块与目标语言语法定义中所做的特定选择解耦。具体来说，每个文法产生式中使用的中间非终符变化很大，这很大程度上取决于
    `parser` 处理歧义的方式（例如，自底向上和自顶向下的解析器所需的非终符组织方式完全不同）。因此，将推导树转换为更抽象的程序树表示，称为 `抽象语法树`
    (`AST`)，是方便的。在这种程序表示中，中间非终符链被压缩，仅表示语言的主要语法类别 [2]。


    ## 语言模型


    `AST` 是一种反映代码句法结构的程序表示。然而，逆向工程工具基于对源代码略有不同的视图。在本章的剩余部分中，这种视图被称为逆向工程工具所假设的语言模型。在语言模型中，可以安全地忽略几个语法细节。例如，分隔语句块的标记（大括号、`begin`、`end`
    等）是无关的，而关注的信息是语句序列的实际存在。第 157 页


    因此，在语言模型中，如语句块和参数的分隔符、参数列表和语句序列的分隔符等标记是不存在的。另一方面，`AST` 中未显式表示的信息在语言模型中直接可用。例如，表达式中涉及的每个变量都与其声明关联。每个方法调用都会根据被调用方法的所有类型兼容定义进行解析。每个类都与其超类以及它实现的接口相关联。此类交叉引用不是通过像
    `AST` 那样的普通标识符获得的，而是指向语言模型中被引用元素的链接。例如，如果 `class A` 继承 `class B`，则 `class A` 的
    `AST` 包含一个指向标识符 `B` 的 `extends` 子句的子节点，而在语言模型中，`class A` 的模型元素与 `class B` 的模型元素之间存在关联。下面将详细描述一个
    Java 语言的（简化版）语言模型示例。负责从输入程序的 `AST` 构建语言模型的模块是 `Model Extractor`（见图 8.1）。


    基于输入程序的语言模型，可以执行逆向工程算法以恢复备选的设计视图。输出是一组显示给用户的图表。在某些情况下，需要对逆向工程算法作为输入的语言模型进行进一步的抽象。例如，前章节中描述的大多数（但不是所有）技术要求目标面向对象程序中的数据流被抽象为一种名为
    `对象流图` (`OFG`) 的数据结构。这种数据结构在 `Reverse Engineering` 模块内部构建，并被所有依赖于它的算法共享。`OFG`
    内部适当信息的流传播会导致感兴趣的设计视图的恢复。这些视图被转换为可选的图形格式，以便最终用户能够对其可视化。


    由于逆向工程技术跨度很大，取决于要恢复的高级信息类型，因此设计一个支持所有备选算法的通用语言模型非常重要。反之，每个算法可能有一个与语言模型本身不同的源代码的内部表示。然而，对语言模型的主要要求是逆向工程算法工作和（可能）构建自身内部数据结构所需的所有信息必须在语言模型中可用。因此，语言模型在上述架构中起着关键的核心作用，应该被仔细设计。图
    8.2 给出了 Java 语言的此类模型示例。仅显示了最重要的实体（出于空间考虑），没有指示它们的属性。


    ## Java 语言模型示例


    Java 源文件包含在名为 `package` 的命名空间内的类定义。反之，包可以嵌套。因此，Java 语言模型中的顶层实体第 158 页（见图 8.2，左侧）是
    `package`，`package` 实体中的自包含关系表示嵌套。最终，包包含类（图 8.2 中从包到类的包含关系）。实体 `package` 的主要属性是它的名称，这唯一地标识了它。


    `class` 实体的属性包括名称、可见性以及其超类、实现的接口等。被包含在类内部的实体是类成员。因此，`class` 实体连接到 `attribute`
    实体和 `method` 实体。此外，类可以嵌套在类内部。这就是从 `class` 实体发出的自包含的原因。


    `attribute` 实体具有如名称、类型、可见性、初始化等属性。同样，`method` 实体具有名称、形式参数、返回类型、可见性等属性。每个方法的体在语言模型中表示为语句序列（图
    8.2 中从方法到语句的包含关系）。


    语句可以是不同的类型。其中一些在图 8.2 中列出，通过继承关系与其抽象语句相连。条件语句用于 `if` 和 `switch` 等结构。在它们的属性中，它们持有指向测试条件中所用表达式实体的引用（图
    8.2 中未显示）。`if` 条件语句有一个 `then` 部分和一个 `else` 部分，它们反过来是语句序列（类似于方法体）。`switch` 语句与一系列
    `case` 相关联，每个 `case` 包含相应的执行语句。循环语句包括 `while`、`for` 和 `do-while` 循环。它们的主要属性是测试条件（表达式实体，图
    8.2 中未显示）和循环体（语句序列）。`for` 循环还有初始化部分和增量部分。


    赋值语句有两个主要部分，左侧和右侧。虽然后者是一个通用的表达式，但前者必须是

