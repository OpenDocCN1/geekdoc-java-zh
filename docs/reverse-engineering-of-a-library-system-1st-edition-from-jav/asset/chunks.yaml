  trans: '


    在软件系统的生命周期中，维护阶段是最长且最昂贵的阶段。从软件第一个版本交付开始 [35]，维护阶段的持续时间远长于初始开发阶段。在此期间，软件将不断地进行更改和增强。因此，用“软件演化”来描述整个生命周期（参见第
    2 页）更为合适，在整个周期中，初始开发只是现有系统为空的特殊用例。


    软件演化的特征是系统源代码的存在。因此，软件演化的典型活动是响应变更请求实现程序更改。变更可能旨在纠正软件（纠正性维护）、添加功能（完善性维护）、使软件适应变化的环境（适应性维护），或对对其进行重构以利于未来的维护（预防性维护）[35]。


    在软件演化过程中，对软件系统行为最可靠且准确的描述是其源代码。事实上，设计图往往已经过时或根本缺失。这种宝贵的信息库可能无法直接回答关于系统的所有问题。反向工程技术提供了一种提取系统高视图的方法，这些视图总结了程序语句所执行计算的某些相关方面。反向工程图支持程序理解以及重构和可追溯性。


    当处理现有代码库时，程序更改的微过程可以分解为定位更改、评估影响和实施更改。所有此类活动都取决于关于被修改程序的可用知识。在这方面，反向工程技术提供了有用的支持。反向工程工具提供了关于被维护系统的有用高层信息，从而帮助程序员定位要修改的组件。此外，连接反向工程图中实体的关系（依赖关系、关联关系等）为更改的影响提供了线索。通过追踪此类关系，可以获得可能受更改影响的实体集。


    面向对象的编程在维护阶段给软件工程师带来了特殊的挑战问题。相应地，必须对反向工程技术进行定制以解决这些问题。例如，面向对象程序的行为源于程序中分配的各个之间发生的交互。相关的指令可能分散在多个类中，每个类单独在本地只执行非常有限的工作，并将其余部分工作委托给其他类。反向工程图捕获了类/对象之间的这种协作，并将它们总结在一个单一、紧凑的视图中。然而，恢复关于此类协作的准确信息是一项特殊挑战，需要对现有的反向工程方法进行重大改进
    [48, 100]。


    当对软件系统进行分析以提取信息时，根本选择是在静态分析和动态分析之间进行。动态分析需要一个跟踪工具来保存程序执行期间被操作的对象和分发的方法信息。通过这种方式可以反向工程的图是部分的。它们对于程序给定的单次执行（具有给输入值）是有效的，并且不能轻松地推广到具有任何输入（参见第
    3 页）的任何执行程序行为。此外，动态分析仅对于完整的、可执行的系统是可能的，而在面向对象编程中，产生在不同上下文中重用的不完整类集是常有的。相反，静态分析产生的结果对于所有执行和所有输入都是有效的。另一方面，静态分析可能过于保守。事实上，确定一条静态上可能的路径是否可行是不可判的，即是否存在一个允许该路径被遍历的输入值。静态分析可能会保守地假设某些路径是可执行的，而实际上它们并非如此。因此，它可能会产生不存在输入值的结果。在接下来的章节中，将针对每种特定的图表讨论这两种方法的优缺点，并在一个可执行的示例上进行说明。


    UML（统一建模语言）[7, 69] 已成为用图表形式表示面向对象系统的标准图形语言。其规范最近由对象管理组（OMG）标准化 [1]。UML 已被多家软件公司采用，其理论方面是多项研究的主题。由于这些原因，UML
    被选择为书中描述的反向工程技术输出的图形表示。然而，对 UML 的选择绝非限制：虽然从代码反向工程的信息可以用不同的图形（或非图形）形式表示，但用于产生这些信息的底层分析方法可以在替代环境中不变地复用，只需用其他描述语言替换
    UML 即可。


    反向工程技术必须考虑的重要问题是可用性。由于恢复的视图是面向人类而非计算机，因此它们必须与人类的认知能力兼容。这意味着只有当图表保持较小尺寸时，才能传递有用信息（10
    个实体可能还可以，100 个开始就太多了，1000 个会让图表变得不可读）。可以采用多种方法来支持可视化和导航模式，使反向工程信息具有可用性。这些方法从关注系统的部分到展开/折叠或放大/缩小操作，或者提供一个由详细视图补充的整体导航图。在接下来的章节中，将根据生成的特定图表描述临时方法。


    第 4 页，旨在理解此应用的程序员可能会有以下问题：

    - 系统的整体结构是怎样的？

    - 借用文档时哪些对象会被更新？

    - 哪些类负责检查给定文档是否可以被给定用户借用？

    - 如何处理最大借用数量？

    - 文档归还，图书馆的状态会发生什么变化？


    让我们假设以下变更请求（完善性维护）：当文档不可借用时，用户可以预留它，如果它未被其他用户预留。当文档归还图书馆时，如果有与文档关联的预留用户，将联系该用户。用户可以借用已提供的文档，也可以取消预留。在两种情况下，此操作后文档的预留将被删除。


    负责实现该功能的程序员对系统可能有以下问题：

    - 系统的整体结构需要任何更改吗？

    - 哪些类需要协作来实现预留功能？

    第 5 页- 对现有功能是否存在可能的副作用？

    - 归还文档的程序应该做哪些更改？

    - 文档的新状态是如何描述的？

    - 新的借用规则与现有规则之间是否存在交互？


    在接下来的章节中，我们将看到从代码反向工程出的 UML 图如何帮助回答上述列出的程序理解和影响分析问题。


