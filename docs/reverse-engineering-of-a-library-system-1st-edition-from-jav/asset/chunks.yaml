  trans: '

    当两个位置属于不同的类（例如，两个类属性）时，是可以区分开的；但当它们属于同一个类但属于不同的类实例（对象）时，则无法区分。换句话说，根据第 2.2 节给定的规则构建的
    OFG 是对象不敏感（object insensitive）。虽然这对于某些分析可能是可以的，但在某些情况下，区分属于不同对象的位置的能力可能会大幅提高分析结果。


    ### 对象敏感型 OFG


    通过为所有非静态程序名分配对象作用域而非类作用域，可以构建对象敏感的 OFG（属于静态方法的静态属性和程序位置保持类作用域）。


    对象可以通过它们的分配点静态地识别，因此在对象敏感的 OFG 中，非静态类属性和方法（包括它们的参数和局部变量）会为每个静态识别出的对象进行复制。在语法上，代码中的对象分配点由图
    2.1 中类为 (5) 的语句确定。对于每个这样的分配点，都会创建一个对象标识符，并对被分配对象的类中的所有属性和方法进行该标识的复制。被复制的程序位置成为
    OFG 中不同的节点。


    当位置具有对象敏感性时，OFG 边的构建变得更加复杂。例如，在存在方法调的情况下，只有当已知当前对象（由 `this` 指向）以及作为调用目标的引用变量所指向的对象时，才能确定
    OFG 边的源和目标。第 4 节提供了推断此类信息的算法细节。


    对象敏感性对 OFG 准确性的影响在于实现了更细粒度的边构建，从而导致信息沿着数据流进行更精确的传播。事实上，在对象敏感的 OFG 中，信息在不同对象之间传播时不会发生混合。


    对象敏感 OFG 构建的主要难点在于对变量引用的对象进行静态估计。当通过引用变量访问/调用属性或方法时，这些信息都是必须的。事实上，相关的边连接了由指向的对象限定作用域的位置。


    为了构建对象敏感的 OFG，可以通过在 OFG 上定义流传播来获取程序变量可能引用的对象信息，旨在静态估计引用的对象。这是第 4 节的主题。然而，用于此目的的算法假设
    OFG 本身。因此，我们存在相互依赖。这可以通过增量地构建 OFG 边来解决。


    相反，所有的 OFG 节点可以从一开始就开始构建。最初，所有的分配点都与对象标识符相关，用于限定非静态程序位置的作用域。这产生了所有 OFG 节点的集合。至于边，在此阶段只能构建内部边，即涉及构造函数/方法参数或局部变量的边，这些边会为每个对象作用域进行复制。


    方法的调用和类属性的访问需要了解变量以及特殊位置 `this` 所引用的对象。此类信息通过第一轮流传播进行近似。在传播结束时，可以使用流传播确定的相关变量所指向的对象，向
    OFG 中添加方法调用和属性访问的边。通过这种方式获得的新版本的 OFG（包括了由上一次流传播结果产生的边），可以获得对变量所指向对象的更好的估计。OFG
    的精化可以继续进行，直到产生一个稳定的版本（需要注意的是，增量式构建是单调的，即边可能会被添加，但永远不会被删除）。


    只有在整个程序可用（包括 `main`）的情况下，才能完整构建对象敏感的 OFG，因为所有涉及对象的所有分配点都必须是分析代码的一部分。在面向对象的编程中，情况可能并非如此，因为经常会产生不完整的系统，并且类经常在不同的上下文中重用。在这些情况下，对象不敏感的
    OFG 构建可能更为合适。


    ### 指针分析


    OFG 和相关的流传播算法基于对指针分析的研究。指针分析的目标是获取指针与程序位置之间在运行时可能存在的任何指向关系（points-to relationship）的静态近似。同样，在考虑面向对象的程序时，会分析引用变量与对象之间的关系。


    指针分析算法可以分为流/上下文敏感 [21, 47, 60] 和流/上下文不敏感 [3, 81]。流/上下文敏感算法产生细粒度且准确的结果，因为它确定了在每个程序语句处都都有效的指向关系。此外，还可以区分不同的调用上下文。然而，这些方法所涉及的计算复杂度很高，在实践中，它们的性能无法扩展到大型软件系统。流/上下文不敏感算法的复杂度较低且扩展性良好。另一方面，它们产生的结果适用于整个程序，且它们推导出的指向关系无法通过语句或调用上下文进行区分。流/上下文敏感分析是相对于程序的控制流图
    [2] 定义的，而流/上下文不敏感算法在语句级别上定义分析语义。


    ### 开发中的逆向工程


    本章处理与在面向对象的软件开发过程中采用逆向工程技术的实际问题。工具的支持和集成是关注关注之一。本章包含了对实现前几节介绍技术的工具通用架构的一些考虑。还提供了对现有支持和当前逆向工程实践的综述。


    一旦建立了自动的逆向工程基础设施，就必须对软件演化过程进行调整，以便无缝集成新提供的功能。这涉及到修订软件维护微过程中的主要活动。为程序理解提供的支持类型已经详细描述（参见第
    1 节，eLib 示例）。本章描述了将逆向工程工具集成到开发过程中对其他活动的影响，通过重新考虑 eLib 程序和第 1 节中概述的变更请求。


