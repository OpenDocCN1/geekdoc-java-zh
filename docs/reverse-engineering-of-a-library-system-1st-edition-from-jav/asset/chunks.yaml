    \nThe authors’ position is that all the information about a program should be\
    \ in the source code. From a purely observational point of view, the well-known\
    \ effects of software evolution, consisting of a progressive misalignment of source\
    \ code and other sources of information about a program, entail that only the\
    \ source code is reliable. So, de-facto, most information about a program is in\
    \ the source code. On the prescriptive side, one could take as the extreme page\
    \ number 171 consequence the fact that everything should be part of the code (including\
    \ design, documentation, etc.).\n\n### Perspectives\n\nThe first view gives a\
    \ central role to reverse engineering in the future of software development. Although\
    \ this discipline was born with the problems of legacy systems in mind, new software\
    \ systems, developed according to modern programming paradigms such as the Object\
    \ Oriented one, are not free from the problems related to program comprehension\
    \ and modification. As described in this book, the comprehension problems involved\
    \ in understanding Object Oriented systems are different from those arising with\
    \ more traditional software, but remain the main concerns during the evolution\
    \ phase. Reverse engineering has the potential to address them.\n\nThe view in\
    \ which all relevant information about a program is centralized in a single source,\
    \ the code, comes from the Extreme Programming (XP) development process [36].\
    \ In this methodology, limited effort is devoted to design and design documents\
