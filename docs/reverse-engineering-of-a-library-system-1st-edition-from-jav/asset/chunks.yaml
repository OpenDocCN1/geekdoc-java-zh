  trans: "\n最终引用一个位置。这是通过将其限制为一元表达式，而不是通用表达式来实现的。\n\n第 159 页\n\n调用语句涉及一个解引用链（初级表达式），最终指向作为调用目标的对象。其他重要属性包括被调用方法的名称、实际参数列表（表达式列表）以及指向语言模型中所有类型兼容的方法的链接。在调用库方法的情况下，该调用被标记为库调用。\n\
    \n当方法内部的控制流被中断以向调用者返回值时，会遇到一个 `return` 语句。该实体的主要属性是定义返回值的表达式。\n\n在图 8.2 出空间原因未展示的实体和关系中，最重要的一个是\
    \ `expression`（表达式）实体，它涵盖了该语言支持的所有数学表达式，并可能与方法调用交织。表达式实体的子层级结构与大多数编程语言（无论是过程式还是面向对象的）中的层级结构非常相似。\n\
    \n根据图 8.2 模型所表示的信息足以构建给定源代码的 OFG（对象流图），并能够进行所有其他不依赖于 OFG 且在前面的章节中描述的分析。因此，它可以作为反向工程模块中实现的所有反向工程技术所利用的基础表示。\n\
    \n第 170 页\n\n作者的观点是，关于程序的所有信息都应该在源代码中。从纯观察的角度来看，软件演化的已知影响——即源代码与程序其他信息源之间逐渐不一致——意味着只有源代码是可靠的。因此，事实上，程序的大部分信息都在源代码中。在规范方面，可以采取第\
    \ 171 页的事实：一切应该是代码的一部分（包括设计、文档等）。\n\n### 视角\n\n第一种视角为反向工程在未来的软件开发中提供了核心作用。尽管这门学科是为了遗留系统的问题而产生的，但现代编程范式（如面向对象）并没有消除与程序理解和修改相关的问题。如书中描述的，面向对象系统的理解问题与传统软件不同，但反向工程具有解决这些问题的潜力。\n\
    \n第二种视角将程序的所有相关信息集中在单一源代码中，源于极限编程 (XP) [36]。在这种方法论中，有限的精力投入设计，而设计文档随着时间的推移被放弃。当工程师转向实现时，设计信息的缺失通过配对编程、持续执行重构以及测试用例的描述得到了缓解。反向工程可以在对象之间的交互组织方面做出重要贡献\
    \ [93]。在 XP 设置中，这是一个相当困难的任务。如书中讨论的，可以从源代码中自动提取许多图。\n\n### 未来趋势\n\n观察新兴的编程语言和范式，我们可以假设反向工程的作用将会增加。编程语言倾向于演进以维护关于程序行为的精确信息。现代编译器依赖这些信息执行多种检查、优化和转换。这类信息的示例包括泛型（genericity）和元数据（例如注解），它们包含在\
    \ Java 语言 1.5 版本中。切面编程 [40] 和内省能力（例如 Java 反射）正朝着相同的方向发展，支持程序内部单元的可编程接口。\n\n这一切具有双重影响。一方面，它简化了反向工程，因为源代码变成了一个丰富的信息库，可以通过工具自动查询。另一方面，它使得设计直接编码在程序中（并由编译器检查），而不是通过静态或动态分析推断。从代码中轻松提取的准确图将使反向工程变得更有吸引力，更接近\
    \ XP 的愿景——即一切都在源代码中。事实上，维护和演进多个系统描述过于昂贵且容易出错。通过关注第 172 页的源代码作为唯一信息源，可以降低成本并避免视图不一致导致的错误。\n\
