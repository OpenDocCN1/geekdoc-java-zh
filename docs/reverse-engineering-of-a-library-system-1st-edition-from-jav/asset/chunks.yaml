    \ 170\n\n注意的是，软件逆向工程是一个复杂的工程，工具可以支持但不能完全自动化。任何逆向工程项目都需要大量的人工干预。\n\n![](img/Image0005.jpg)\n\
    \n![](img/Image0006.jpg)\n\n![](img/Image0007.jpg)\n\n### 参考：面向对象代码的逆向工程\n\n###\
    \ 前言自从第一个软件系统建立以来，关于如何记录软件一直存在争论。有些人希望我们编写自然语言描述，有些人希望我们准备正式规范，还有人希望我们通过设计文档，其他人通过用例来描述软件。这样做的问题是，除非与代码同步维护，否则这些很快就会失效。维护不同的视图变得非常昂贵且容易出错。视图倾向于分离并变得不一致。本书作者为这一长期问题提供了一个简单的解决方案。只需要维护和演进源代码。系统的所有其他信息都从源代码获取。这需要从源代码生成完整的\
    \ UML 图。这样，设计文档将始终反映系统的真实情况，而不是文档记录者认为系统应该是怎样的。设计与实现之间不存在任何不一致。书中介绍的技术证明了设计文档可以并且从代码中提取，因为这是最便宜且最可靠的方法。使用的方法是逆向工程，目标是\
    \ C++、C# 或 Java 面向代码。根据最新的 UML 标准从代码生成类图、对象图、交互图和状态图。由于方法是自动化的，因此没有额外成本。点击即可提供设计文档。这种方法是多年研究的结果，对系统的记录方式产生深远影响。除了源代码本身，只需要开发和维护另一个视图，即以领域特定语言形式的用户视图。每个应用程序领域都必须有自己的语言来描述应用程序。\n\
    \n"
- fmt: "\n# Preface\n\non the way to the code, but since complex IT systems are almost\
    \ always developed by trial and error, these documents will only have a transitive\
    \ nature.\n\nThe moment the code exists they are both obsolete and superfluous.\
    \ From then on, the same documents can be produced cheaper and better from the\
    \ code itself. This approach coincides with and supports the practice of extreme\
    \ programming.\n\nOf course there are several drawbacks, as some types of information\
    \ are not captured in the code and, therefore, reverse engineering cannot capture\
    \ them . An example is that there still needs to be a test oracle – something\
    \ to test against. This something is the domain specific specification from which\
    \ the application-oriented test cases are derived. The technical test cases can\
    \ be derived from the generated `UML` diagrams. In this way, the system as implemented\
    \ will be verified against the system as specified. Without the `UML` diagrams,\
    \ extracted from the code, there would be no adequate basis of comparison.\n\n\
    For these and other reasons, this book is highly recommendable to all who are\
    \ developing and maintaining Object-Oriented software systems. They should be\
    \ aware of the possibilities and limitations of automated post documentation.\
    \ It wil become increasing significant in the years to come, as the current generation\
    \ of OO-systems become the legacy systems of the future. The implementation knowledge\
    \ they encompass will most likely be only in the source and there will be no other\
    \ means of regaining it other than through reverse engineering.\n\n## Overview\
    \ \n\nDiagrams representing the organization and behavior of an Object Oriented\
    \ software system can help developers comprehend it and evaluate the impact of\
    \ a modification. However, such diagrams are often unavailable or inconsistent\
    \ with the code. Their extraction from the code is thus an appealing option.\n\
    \nThis book represents the state of the art of the research in Object Oriented\
    \ code analysis for reverse engineering. It describes the algorithms involved\
    \ in the recovery of several alternative views from the code and some of the techniques\
    \ that can be adopted for their visualization.\n\nDuring software evolution, availability\
    \ of high level descriptions is extremely desirable, in support to program understanding\
    \ and to change-impact analysis. In fact, location of a change to be implemented\
    \ can be guided by high level views. The dependences among entities in such views\
    \ indicate the proportion of the ripple effects.\n\nHowever, it is often the case\
    \ that diagrams available during software evolution are not consistent with the\
    \ code, or – even more frequently – that no diagram has altogether been produced.\
    \ In such contexts, it is crucial to be able to reverse engineer design diagrams\
    \ directly from the code. Reverse engineered diagrams are a faithful representation\
    \ of the actual code organization and of the actual interactions among objects.\
    \ Programmers do not face any misalignment or gap when moving from such diagrams\
    \ to the code.\n\n## Background and Collaboration\n\nThe material presented in\
    \ this book is based on the techniques developed during a collaboration we had\
    \ with `CERN` (Conseil Européen pour la Recherche Nucléaire). At `CERN`, work\
    \ for the next generation of experiments to be run on the Large Hadron Collider\
    \ has started in large advance, since these experiments represent a major challenge,\
    \ for the size of the devices, teams, and software involved. We collaborated with\
    \ `CERN` in the introduction of tools for software quality assurance, among which\
    \ a reverse engineering tool.\n\n## Supported Diagrams\n\nThe algorithms described\
    \ in this book deal with the reverse engineering of the following diagrams:\n\n\
    * **Class diagram**: Extraction of inter-class relationships in presence of weakly\
    \ typed containers and interfaces, which prevent an exact knowledge of the actual\
    \ type of referenced objects.\n* **Object and interaction diagrams**: Recovery\
    \ of the associations among the objects that instantiate the classes in a system\
    \ and of the messages exchanged among them.\n* **State diagram**: Modeling of\
    \ the behavior of each class in terms of states and state transitions.\n* **Package\
    \ diagram**: Identification of packages and of the dependences among packages.\n\
    \n## Technical Framework\n\nAll the algorithms share a common code analysis framework.\
    \ The basic principle underlying such a framework is that information is derived\
    \ statically (no code execution) by performing a propagation of proper data in\
    \ a graph representation of the object flows occurring in a program . The data\
    \ structure that has been defined for such a purpose is called the `Object Flow\
    \ Graph` (`OFG`). It allows tracking the lifetime of the objects from their creation\
    \ along their assignment to program variables.\n\n`UML`, the Unified Modeling\
    \ Language, has been chosen as the graphical language to present the outcome of\
    \ reverse engineering. This choice was motivated by the fact that `UML` has become\
    \ the standard for the representation of design diagrams in Object Oriented development.\
    \ However, the choice of `UML` is by no means restrictive, in that the same information\
    \ recovered from the code can be provided to the users in different graphical\
    \ or non graphical formats.\n\nA well known concern of reverse engineering methods\
    \ is how to filter the results, when their size and complexity are excessively\
    \ high. Since the recovered diagrams are intended to be inspected by a human,\
    \ the presentation modes should take into account the cognitive limitations of\
    \ humans explicitly. Techniques such as focusing, hierarchical structuring and\
    \ element explosion/implosion will be introduced specifically for some diagram\
    \ types.\n\n## Motivation\n\nThe research community working in the field of reverse\
    \ engineering has produced an impressive amount of knowledge related to techniques\
    \ and tools that can be used during software evolution in support of program understanding.\
    \ It is the authors’ opinion that an important step forward would be to publish\
    \ the achievements obtained so far in comprehensive books dealing with specific\
    \ subtopics.\n\nThis book on reverse engineering from Object Oriented code goes\
    \ exactly in this direction. The authors have produced several research papers\
    \ in this field over time and have been active in the research community. The\
    \ techniques and the algorithms described in the book represent the current state\
    \ of art.\n\nReverse engineering aims at supporting program comprehension, by\
    \ exploiting the source code as the major source of information about the organization\
    \ and behavior of a program, and by extracting a set of potentially useful views\
    \ provided to programmers in the form of diagrams. Alternative perspectives can\
    \ be adopted when the source code is analyzed and different higher level views\
    \ are extracted from it. The focus may be on the structure, on the behavior, on\
    \ the internal states, or on the physical organization of the files. A single\
    \ diagram recovered from the code through reverse engineering is insufficient.\
    \ Rather, a set of complementary views need to be obtained, addressing different\
    \ program understanding needs.\n\nIn this chapter, the role of reverse engineering\
    \ within the life cycle of a software system is described. The activities of program\
    \ understanding and impact analysis are central during the evolution of an existing\
    \ system. Both activities can benefit from sources of knowledge about the program\
    \ such as reverse engineered diagrams.\n\nThe reverse engineering techniques presented\
    \ in the following chapters are described with reference to an example program\
    \ used throughout the book. In this chapter, this example program is introduced\
    \ and commented. Then, some of the diagrams that are the object of the following\
    \ chapters are provided for the example program, showing their usefulness from\
    \ the programmer’s point of view. The remaining parts of the book contain the\
    \ algorithmic details on how to recover them from the source code.\n"
