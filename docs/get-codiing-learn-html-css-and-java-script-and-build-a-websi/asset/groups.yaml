  - "[PAGE 173]\n\n# 9. Animate the characters\n\nWe now need to apply our two new\
    \ CSS classes (hidden and visible) to our game loop so the character <div> tags\
    \ become animated. To do this, we need our game loop to add and remove the new\
    \ CSS classes to and from our <div> tags.\n\nWhen our game runs, we want our characters\
    \ to flash on and off the screen. We're currently looping around 12 times, so\
    \ the character <div> tags needs to be visible for 6 loops and invisible for 6\
    \ loops to create the flashing effect. The first thing we need is a new variable\
    \ called peopleVisible to store this information. We need to set this variable\
    \ to false, like this:\n\n```\nvar peopleVisible = false\n```\n\nWe need the variable\
    \ to be set to false at the start so that the character <div> tags start off hidden\
    \ on our screen. Then when the variable is set to true, the characters de-visible]\
    \ will appear on our screen.\n\nWhen the game loop runs, we want the value stored\
    \ in our new variable to alternate between true and false. To do this, we have\
    \ to use another JavaScript operator, called the not operator (!). We can use\
    \ the not operator (!) to change the value of your variable.\n\nLet's look at\
    \ how we use the not operator (!) in our <script> block. Type these new pieces\
    \ of code into your-text-editing program and save your file.\n\n```\n<script>\n\
    function startGame() {\n  gameLoop();\n}\nvar peopleVisible = false;\nfunction\
    \ gameLoop() {\n  peopleVisible = !peopleVisible;\n  loops++;\n  if(loops < 12)\
    \ {\n    setTimeout(gameLoop, 3000);\n  }\n  else {\n    alert(\"Game over!\"\
    );\n  }\n}\n</script>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_173_0.png)"
  - '[PAGE 174]


    We have used the not operator (!) to alternate the value of our new variable.
    If the value of our variable is false, when the variable runs in our gameLoop
    function, the not operator (!) will change its value to true. And if the value
    of our variable is true, when the variable runs, the not operator (!) will change
    its value to false.


    Every time our loop runs, the loops variable will go up by one and the peopleVisible
    variable will alternate between true and false. As we loop around, our variables
    will look like this:


    | Loop number | Variable value |

    |---|---|

    | 1 | True |

    | 2 | False |

    | 3 | True |

    | 4 | False |

    | 5 | True |

    | 6 | False |

    | 7 | True |

    | 8 | False |

    | 9 | True |

    | 10 | False |

    | 11 | True |

    | 12 | False |


    Now we need to add a new function called <script> block that will make our character
    <div> tags appear on-screen when the variable value is true. We do this using
    our two new CSS classes. When the value is true, we want to use the visible CSS
    class, and when the value is false, we want to use the hidden CSS class. Turn
    the page to find out exactly how to code this flashCharacters function.


    Game over


    > I like using loops!


    > This new function sounds complicated!


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_174_0.png)'
  - "[PAGE 175]\n\n# 10. Apply css using JavaScript\n\nWe need a new function that\
    \ apply a CSS class to the character <div> tags depending on the value of our\
    \ variable. We should call this function flashCharacters. The function must find\
    \ our board, using getElementById, and store it in a variable board. Then the\
    \ function needs to pick a CSS class to apply to the character <div> tags. This\
    \ will depend on the value of our variable.\n\nvariable to an empty string. This\
    \ empty string is filled as the if and else statements run. If our peopleVisible\
    \ variable is true, our classSet variable will be set to the visible CSS class.\
    \ If our peopleVisible variable is false, the else statement will change our classSet\
    \ variable to the hidden CSS class.\n\nTo decide the class, we create a second\
    \ variable called classSet that will store the names of the CSS classes we need\
    \ to set. We choose the CSS classes using an if and else statement. We set the\
    \ value of our classToSet\n\nWe need to code a loop that counts the 6 character\
    \ <div> tags. As the loop counts the <div> tags we assign the value of our classSet\
    \ variable to each <div>. We do this using the className method. The className\
    \ method sets us a CSS class on an HTML element in JavaScript.\n\nOur complete\
    \ function now looks like this:\n\n```\nfunction flashCharacters() {\n  var board\
    \ = document.getElementById(\"board\");\n  var classSet = \"\";\n  if(peopleVisible)\
    \ {\n    classSet = \"character visible\";\n  } else {\n    classSet = \"character\
    \ hidden\";\n  }\n  for(var index = 0; index < 6; index++) {\n    board.children[index].className\
    \ = classSet;\n  }\n}\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_175_0.png)\n\
    \n> Did you notice?\nIn the variable called index inside our loop, we have stored\
    \ more than one piece of information. This kind of variable is called a collection.\
    \ We have to use brackets ([ ]) to get a value out of the collection to use in\
    \ our.\n\nAn EMPTY STRING is a piece of data, in the form of a sequence of characters,\
    \ that has the value of 0. In JavaScript an empty string is represented as \"\"\
    \ \"."
  - '[PAGE 176]


    # 11. Simplify the conditional statements


    This function looks quite complicated, so we should now try to simplify it. You
    can use another operator in JavaScript, called a conditional operator (?), to
    simplify the if and else statements. You use the conditional operator (?) like
    this:


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_176_0.png)


    ```

    var variableName = condition ? value1 : value2;

    ```


    This tells our browser that if the condition of our variable is true, it should
    use value1, and if it is false, it should use value2. So we can rewrite the code
    in our function like this:


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_176_1.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_176_2.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_176_3.png)


    ```

    var classToSet = peopleVisible ? "character visible" : "character hidden";

    ```


    Add your new flashCharacters function with the simplified if and else statements
    to your <script> block. Make sure your gameLoop function calls your new function
    too. Save your code and open it in your browser. Every 3 seconds, your blue boxes
    will appear and disappear on your screen.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_176_4.png)'
