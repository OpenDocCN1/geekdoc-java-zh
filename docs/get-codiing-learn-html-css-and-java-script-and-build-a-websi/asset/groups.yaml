    \ id=\"list\">Buy Ernest a new collar</</div>\n  <script>\n    var showList =\
    \ document.getElementById(\"list\");\n    alert(showList.innerHTML);\n  </script>\n\
    </body>\n</html>\n```\n\n在这个示例中，我们使用了 `getElementById` 方法来找到 `id` 属性设置为 \"list\"\
