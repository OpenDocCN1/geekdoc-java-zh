    # 1. The home page: index.html


    The home page (**index.html**) is the most important page of your website because
    it''s the page user will see first. A good home page will make the purpose of
    the website obvious and engage the user''s interest. It should be clear that it
    is only a home page and that there are other web pages on the site for the user
    to discover.


    We can put a title in the banner too. Then let''s have a menu bar that contains
    links to all the other pages on our site. Then we should have a short piece of
    text that explains a little bit about the Monk Diamond''s discovery. Underneath
    the text, let''s have a button that links to the House of Volkov page on the website.
    Finally, we can have a footer with contact details for Professor Bairstone. Let''s
