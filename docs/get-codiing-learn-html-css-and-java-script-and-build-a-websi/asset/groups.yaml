- md: "\n# MAKING JAVAS WITH HTML\n\nWe've seen throughout this mission how you can\
    \ add JavaScript to your HTML web page by writing it inside the <script> tag.\
    \ But now we need to learn how to make our JavaScript code run when the user clicks\
    \ on an HTML element. If we want something to happen when user clicks on a piece\
    \ of text or an image on our page, we have to add JavaScript to our HTML tags.\
    \ Luckily there's an attribute that lets us do this.\n\n> Attributes! You know\
    \ all about them from Mission 1.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_85_0.png)\n\
    \n## The onclick Attribute\n\nIt's really easy to make a piece of JavaScript run\
    \ when the user clicks on an HTML element on your page. All you need to do is\
    \ include the onclick attribute (or the \"onclick\") in the HTML tag you want\
    \ to make interactive. Then when the user clicks on the HTML element in their\
    \ browser, the JavaScript code will run. The onclick attribute is just like all\
    \ the other attributes we've used in the missions so far. You add the attribute\
    \ to the opening tag of the HTML element you want to click on. Then you set the\
    \ value of the onclick to the piece of JavaScript you want to run, using the equals\
    \ sign (=) and double quotes (\"). Don't forget the semicolon (;). You can put\
    \ any JavaScript you want inside an onclick. Let's take a look:\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <title>Diamond Color</title>\n</head>\n<body>\n  <p\
    \ onclick=\"alert('Green');\">\n    Click here to find out the color of the Monk\
    \ Diamond\n  </p>\n</body>\n</html>\n```\n\nWhen the user clicks on the text between\
    \ the opening and closing <p> tags, the JavaScript function in our onclick runs.\
    \ An alert will pop up.\n\n> Did you know that green diamonds are extremely rare?\n\
    \nWe used single quotes ('') around the argument passed to our alert function.\
    \ This is because we had already used double quotes to set the value of the onclick\
    \ attribute. Always use single quotes inside double quotes, or your code won't\
    \ run.\n\n```\nGreen\nOK\n```\n\n## Using true and false with the Return Statement\n\
    \nYou can also use your onclick attribute to stop your browser from following\
    \ an instruction in a piece of code. To do this you use a return statement in\
    \ your onclick, and set its value to \"false\".\n\nReturn is a reserved word in\
    \ JavaScript. If you use a return statement and set it to the value \"true\",\
    \ your browser will keep running the code. But if you use \"false\" as a value\
    \ in your return statement, your browser will stop running the code immediately.\n\
    \n> I'm worried those pesky Bond Brothers might be around—please hurry with the\
    \ password!\n\nRESERVED WORDS are words that cannot be used as function or variable\
    \ names. This is because they are special commands that your browser understands.\
    \ You don't need to put reserved words in double quotes (\"\").\n\n## The onclick\
    \ Attribute and Hyperlinks\n\nWe can create a very useful piece of JavaScript\
    \ with the onclick attribute and the value “false”. You can use the onclick and\
    \ the return statement to stop a hyperlink from working when a user clicks on\
    \ it. This will be very useful when we code our password later in the mission.\
    \ If the user gets the password wrong, they won't be taken to the Monk Diamond\
    \ web page.\n\nTo do this, you first create the hyperlink exactly the same way\
    \ we did at the start of the mission, using the anchor <a> tag and the href attribute,\
    \ like this:\n\n```html\n<body>\n  <a href=\"monkondiamonddiscovery.html\">\n\
    \    Click here to visit the Monk Diamond web page\n  </a>\n</body>\n```\n\nThen\
    \ you add the onclick attribute and the return statement. Set the value of the\
    \ return statement to “false”, like this:\n\n```html\n<body>\n  <a href=\"monkondiamonddiscovery.html\"\
    \ onclick=\"return false\">\n    Click here to visit the Monk Diamond web page\n\
    \  </a>\n</body>\n```\n\nUsing “false” as the value of our onclick means that\
    \ nothing will happen when the user clicks on the link.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_87_0.png)\n\
    \n## CODE SKILLS: MAKING HTML CODE RUN JAVASCRIPT\n\nPractice using the HTML onclick\
    \ attribute to run a piece of JavaScript code. Knowing how to do this will mean\
    \ you can make HTML elements respond to the user.\n\n- 1. Open your text-editing\
    \ program. Create a new HTML file called onclick.html. Type this code into your\
    \ new file:\n\n- 2. In your <body> create a hyperlink that will take your user\
    \ to Google. Use the anchor <a> tag and href attribute. Set the value to the Google\
    \ URL. Your code will look like this:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title>OnClick</title>\n</head>\n<body>\n<a href=\"https://www.google.com\">Google</a>\n\
    </body>\n</html>\n```\n\n- 3. Now add your onclick attribute to your opening <a>\
    \ tag. Set the value of your onclick to a JavaScript alert. Remember to use single\
    \ quotes ('') for the alert argument. Your code will look like this:\n\n```html\n\
    <a href=\"https://www.google.com\" onclick=\"alert('Redirecting to Google');\"\
    >Google</a>\n```\n\n- 4. Save your HTML file and open it in your browser. When\
    \ you click it, an alert will pop up.\n\n- 5. In your <body> create a hyperlink\
    \ that will take your user to Google. Use the anchor <a> tag and href attribute.\
    \ Set the value to the Google URL. Your code will look like this:\n\n```html\n\
    <a href=\"https://www.google.com\" onclick=\"return false;\">Google</a>\n```\n\
    \n## CREATING YOUR PASSWORD\n\nNow that you know how to use the onclick, we start\
    \ building our page. Let's start with basic:\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>Password</title>\n  <style>\n  body {\n    background-color:\
    \ lightblue;\n    padding: 30px;\n  }\n</style>\n</head>\n<body>\n<p style=\"\
    font-size:30pt;\">THE MONK DIAMOND DISCOVERY</p>\n<p>Please enter the password\
    \ to view this website.</p>\n<p>Password:</p>\n<a href=\"monkondiamonddiscovery.html\"\
    >Click here to submit password and view website</a>\n</body>\n</html>\n```\n\n\
    > Don't forget: the secret is 0.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_89_0.png)\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_89_1.png)\n\n| THE MONK DIAMOND DISCOVERY\
    \ |\n| Please enter the password to view this website. |\n| Password |\n| Click\
    \ here to submit password and view website |\n\n## The input Tag: <input/>\n\n\
    Websites often need you to type in information. It's how you log in to an account,\
    \ buy movie tickets, or use a search engine. So asking your user to type in information\
    \ is a common part of coding. It's called asking for user input.\n\nThere are\
    \ lots of tags you can use for user input, but the one you will use the most is\
    \ the <input/> tag. It's great for creating boxes on your page so user can enter\
    \ data. It's a self-closing tag, and you include two attributes inside it: the\
    \ id attribute and the type attribute. As you already know, you set the value\
    \ of these attributes using the equals sign (=) and double quotes (\"). Let's\
    \ take a look at how we use the <input/> tag on our page:\n\n```html\n<body>\n\
    <p style=\"font-size:30pt;\">THE MONK DIAMOND DISCOVERY</p>\n<p>Please enter the\
    \ password to view this website.</p>\n<p>Password:<input id=\"passwordBox\" type=\"\
    text\"></p>\n<a href=\"monkdiamonddiscovery.html\">Click here to submit password\
    \ and view website</a>\n</body>\n```\n\nYou use the id attribute to give your\
    \ <input/> tag a unique name. You have to choose the name of your id attribute.\
    \ Make sure it's easy to remember. Here, we've set the value of the id attribute\
    \ to \"passwordBox\".\n\nDoing this allows us to use the value inside the <input/>\
    \ tag in our JavaScript. We use the id attribute to tell our browser exactly which\
    \ piece of data we want to use. Without the id attribute, your browser will not\
    \ be able to find the password and check whether the password is correct.\n\n\
    ![](img/fd182f6ecb2aea108dbd5523a70555aa_90_0.png)\n"
  mdcn: "\n\n# 使用 HTML 让 JavaScript 运行起来\n\n在整个任务中，我们已经看到了如何通过在 <script> 标签内部编写代码来为你的\
    \ HTML 网页添加 JavaScript。但现在，我们需要学习当用户点击 HTML 元素时让我们的 JavaScript 代码运行。如果我们希望在用户点击页面上的某些文本或图像时发生某些操作，我们就必须在\
    \ HTML 标签中添加 JavaScript。幸运的是，有一个属性可以实现这一点。\n\n> 属性！你已经在任务 1 中了解了它们的所有信息。\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_85_0.png)\n\
    \n## onclick 属性\n\n要让用户点击页面上的 HTML 元素时运行一段 JavaScript 代码非常简单。你只需要在你想要使其交互的 HTML\
    \ 标签中包含 `onclick` 属性（或 \"onclick\" 字符串）。然后，当用户在浏览器中点击该 HTML 元素时，JavaScript 代码就会运行。`onclick`\
    \ 属性与我们在此为止在任务中使用的所有其他属性一样。你将该属性添加到你想要点击的 HTML 元素的起始标签中。然后，使用等号 (=) 和双引号 (\")\
    \ 将 `onclick` 的值设置为你想要运行的 JavaScript 代码。别忘记分号 (;)。你可以在 `onclick` 中放入任何你想要的 JavaScript\
    \ 代码。让我们来看：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>钻石颜色</title>\n\
    </head>\n<body>\n  <p onclick=\"alert('Green');\">\n    点击这里查看僧侣钻石的颜色\n  </p>\n\
    </body>\n</html>\n```\n\n当用户点击起始 <p> 标签和结束 <p> 标签之间的文本时，我们 onclick 中的 JavaScript\
    \ JavaScript 函数就会运行。会弹出一个警告框（alert）。\n\n> 你知道绿色钻石非常稀有吗？\n\n我们在传递给 `alert` 函数的参数周围使用了单引号\
    \ ('' )。这是因为我们已经使用了双引号来设置 `onclick` 属性的值。请务必在双引号内部使用单引号，否则你的代码将无法运行。\n\n```\n\
    Green\nOK\n```\n\n## 在 Return 语句中使用 true 和 false\n\n你还可以使用 `onclick` 属性来阻止浏览器执行代码中的某条指令。要做到这一点，你需要在\
    \ `onclick` 中使用 `return` 语句，并将其值设置为 \"false\"。\n\n`return` 是 JavaScript 中的一个保留字。如果你使用\
    \ `return` 语句并将其设置为值 \"true\"，你的浏览器将继续运行代码。但如果你在 `return` 语句中使用 \"false\" 作为值，你的浏览器将立即停止运行代码。\n\
    \n> 我担心那些讨厌的邦德兄弟可能在附近——请快点给出密码！\n\n保留字（RESERVED WORDS）是不能用作函数或变量名的单词。这是因为它们是浏览器能够理解的特殊命令。你不需要将保留字放在双引号\
    \ (\"\"\") 中。\n\n## onclick 属性与超链接\n\n我们可以通过 `onclick` 属性和值“false” 创建一段非常有用的 JavaScript\
    \ 代码。你可以使用 `onclick` 和 `return` 语句在用户点击超链接时阻止其工作。这在我们稍后在任务中编写密码时非常有用。如果用户输入的密码错误，他们将不会被带到僧侣钻石的网页。\n\
    \n要做到这一点，你首先需要像我们在任务开始时那样的完全创建一个超链接，使用锚点 `<a>` 标签和 `href` 属性，如下：\n\n```html\n\
    <body>\n  <a href=\"monkondiamonddiscovery.html\">\n    点击这里访问僧侣钻石网页\n  </a>\n\
    </body>\n```\n\n然后你添加 `onclick` 属性和 `return` 语句。将 `return` 语句的值设置为“false”，如下：\n\
    \n```html\n<body>\n  <a href=\"monkondiamonddiscovery.html\" onclick=\"return\
    \ false\">\n    点击这里访问僧侣钻石网页\n  </a>\n</body>\n```\n\n将“false”作为我们 `onclick` 的值意味着当用户点击链接时什么都不会发生。\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_87_0.png)\n\n## 代码技能：让 HTML 代码运行 JavaScript\n\
    \n练习使用 HTML `onclick` 属性来运行一段 JavaScript 代码。学会如何做到这一点将意味着你可以让 HTML 元素对用户做出响应。\n\
    \n- 1. 打开你的文本编辑器。创建一个名为 `onclick.html` 的新 HTML 文件。在你的新文件中输入以下代码：\n\n- 2. 在你的 `<body>`\
    \ 中创建一个将用户带到 Google 的超链接。使用锚点 `<a>` 标签和 `href` 属性。将值设置为 Google 的 URL。你的代码看起来像这样：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>OnClick</title>\n</head>\n\
    <body>\n<a href=\"https://www.google.com\">Google</a>\n</body>\n</html>\n```\n\
    \n- 3. 现在为你的起始 `<a>` 标签添加 `onclick` 属性。将你的 `onclick` 值设置为一个 JavaScript `alert`。记住为\
    \ `alert` 参数使用单引号 ('' )。你的代码看起来像这样：\n\n```html\n<a href=\"https://www.google.com\"\
    \ onclick=\"alert('Redirecting to Google');\">Google</a>\n```\n\n- 4. 保存你的 HTML\
    \ 文件并在浏览器中打开它。当你点击它时，会弹出一个警告框。\n\n- 5. 在你的 `<body>` 中创建一个将用户带到 Google 的超链接。使用锚点\
    \ `<a>` 标签和 `href` 属性。将值设置为 Google 的 URL。你的代码看起来像这样：\n\n```html\n<a href=\"https://www.google.com\"\
    \ onclick=\"return false;\">Google</a>\n```\n\n## 创建密码\n\n现在你已经知道了如何使用 `onclick`\
    \ 属性，我们开始构建我们的页面。让我们从基础开始：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>密码</title>\n\
    \  <style>\n  body {\n    background-color: lightblue;\n    padding: 30px;\n \
    \ }\n</style>\n</head>\n<body>\n<p style=\"font-size:30pt;\">僧侣钻石发现</p>\n<p>请输入密码查看此网页。</p>\n\
    <p>密码:</p>\n<a href=\"monkondiamonddiscovery.html\">点击这里提交密码查看网页</a>\n</body>\n\
    </html>\n```\n\n> 别忘了：秘密是 0。\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_89_0.png)\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_89_1.png)\n\n| 僧侣钻石发现 |\n| 请输入密码查看此网页。\
    \ |\n| 密码 |\n| 点击这里提交密码查看网页 |\n\n## input 标签：<input/>\n\n网站通常需要你输入信息。这是你登录账户、购买电影票或使用搜索引擎的方式。因此，要求用户输入信息是编程常见的一部分。这被称为用户输入。\n\
    \n有很多标签可以用于用户输入，但你用最多的是 `<input/>` 标签。它非常适合在页面上创建可以让输入数据的框。它是一个自合标签，你在内部包含了两个属性：`id`\
    \ 属性和 `type` 属性。正如你已经知道的，你使用等号 (=) 和双引号设置这些属性的值。让我们来看看如何在页面上使用 `<input/>` 标签：\n\
    \n```html\n<body>\n<p style=\"font-size:30pt;\">僧侣钻石发现</p>\n<p>请输入密码查看此网页。</p>\n\
    <p>密码:<input id=\"passwordBox\" type=\"text\"></p>\n<a href=\"monkdiamonddiscovery.html\"\
    >点击这里提交密码查看网页</a>\n</body>\n```\n\n你使用 `id` 属性为你的 `<input/>` 标签提供一个唯一的名称。你必须选择\
    \ `id` 属性的名称。确保它容易记忆。在这里，我们把 `id` 属性的值设置为 \"passwordBox\"。\n\n这样做允许我们能够在 JavaScript\
    \ 中使用 `<input/>` 标签内部的值。我们使用 `id` 属性来告诉浏览器我们具体想要使用哪部分数据。没有 `id` 属性，你的浏览器将无法找到并检查密码是否正确。\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_90_0.png)\n\n"
