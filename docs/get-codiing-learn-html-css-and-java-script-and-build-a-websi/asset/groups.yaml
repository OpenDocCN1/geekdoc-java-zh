    \ the wireframe for the diamond page:\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_201_0.png)\n\
    \n## Menu bar\n\n## Big image\n\n## Text\n\n## Image\n\n## footer\n"
  mdcn: "\n让我们来看看我们将编写的五个网页，用于构建“僧侣钻石”（Monk Diamond）网站：\n\n| 网页 | 内容 |\n| --- | ---\
