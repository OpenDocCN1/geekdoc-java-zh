  raw:
  - "[PAGE 53]\n\n# CODE SKILLS USING CSS CLASSES AND THE CLASS ATTRIBUTE\n\nCSS classes\
    \ are a simple and effective way of using CSS to change your HTML elements. Let's\
    \ try coding some CSS classes and using them with the class attribute to change\
    \ the design of a web page.\n\n+   1. Open up your text-editing program and create\
    \ a new HTML file called CSSclasses.html. Copy and paste your code from CSSproperties.html\
    \ into your new file and modify it so that the three <div> tags look like this:\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_53_0.png)\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>The Monk Diamond</title>\n</head>\n<body>\n<div>\n    The\
    \ Monk Diamond<br/>\n    An incredible discovery\n</div>\n<br/>\n<div>\n    Stolen\
    \ diamond found on expedition in Siberia!\n</div>\n<br/>\n<div>\n    Professor\
    \ Bairstone and Dr. Day were looking for fossils in Siberia.<br/>\n    They found\
    \ the stolen diamond hidden inside a remote cave.\n</div>\n</body>\n</html>\n\
    ```"
  - "[PAGE 54]\n\n2. Now add a <style> tag inside your <head>. Your code will look\
    \ like this:\n\n```\n<head>\n  <title>The Monk Diamond</title>\n  <style>\n  </style>\n\
    </head>\n```\n\n3. Between your opening and closing <style> tags, create a CSS\
    \ class called header. Set the background-color, padding, text-align, and font-size\
    \ CSS properties. Add the width and height CSS properties, too. Choose values\
    \ for your properties. Your code will look like this:\n\n```\n<style>\n  .header\
    \ {\n    background-color: blue;\n    padding: 25px;\n    text-align: center;\n\
    \    font-size: 18pt;\n    width: 100%;\n    height: 25%;\n  }\n</style>\n```\n\
    \n4. Apply your header CSS class to the first <div> in your <body> using the class\
    \ attribute. Your code will look like this:\n\n```\n<div class=\"header\">\n \
    \ The Monk Diamond<br/>\n  An incredible discovery\n</div>\n```\n\n5. Create a\
    \ second CSS class in your <style> tag and call it title. This new CSS class will\
    \ come after your header CSS class. Set the font-size, text-align, and color properties.\
    \ Choose values for your properties. Your code will look like this:\n\n```\n.title\
    \ {\n  font-size: 14pt;\n  text-align: center;\n  color: gray;\n}\n```\n\n> Why\
    \ don't you try some different colors?\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_54_0.png)\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_54_1.png)\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_54_2.png)"
  - "[PAGE 55]\n\n# CODE SKILLS ► CONTINUED\n\n6. Apply your title CSS class to your\
    \ second <div>. Your code will look like this:\n\n```\n<div class=\"title\">\n\
    Stolen diamond found on expedition in Siberia!\n</div>\n```\n\n7. Create a third\
