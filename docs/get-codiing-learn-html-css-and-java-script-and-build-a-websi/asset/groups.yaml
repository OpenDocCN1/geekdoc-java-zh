    # 开始编码吧！


    学习 HTML、CSS 和 JavaScript，构建网站、App 和游戏


    在西伯利亚的山脉中挖掘史前化石时，Bairstone 教授、Day 博士和狗狗 Ernest 意外发现了无价连城的“僧士钻石”。现在现在他们需要你的帮助来隐藏它，并保护它不受珠宝大盗的侵害！你准备好接受这项机密任务了吗？太棒了！


    你只需要一台电脑和这本编程指南，这本书非常适合任何年龄的初学者来培养真正的编码技能。通过六个令人兴奋的任务，遵循逐步说明，你将学习 HTML、CSS 和 JavaScript。一旦你帮助保护了了臭名昭著的僧士钻石，就可以继续通过编写自己的项目和完成自己的大胆任务来不断提高和测试你的专业知识！


