    \ this:\n\n```html\n<div style=\"background-color: pink;\">\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_40_0.png)\n\
    \n- 4. Save your HTML file and open it in your browser. Try changing the value\
    \ of the background-color CSS property to different colors. Save your file and\
    \ refresh your page to see your changes on-screen.\n\n# MORE CSS PROPERTIES\n\n\
    Let's look at some of the CSS properties we can add to our HTML elements to make\
    \ Professor Bairstone’s page more exciting. As you know already, CSS is always\
    \ made up of a property and a value. There are hundreds of different CSS properties\
    \ and values, but here are some of the most common:\n\n| CSS property name | What\
    \ does it do? | Example values |\n|---|---|---|\n| background-color | Sets the\
    \ color of your background | red, black, white, yellow |\n| color | Sets the color\
    \ of your text | red, black, white, yellow |\n| text-align | Positions your text\
    \ around the page | left, right, center |\n| font-size | Changes the size of your\
    \ text | 12px, 20pt |\n| float | Positions your element to the left or the right\
    \ of another element | left, right, none |\n| height | Sets the height of your\
    \ element | 100px, 100% |\n| width | Sets the width of your element | 100px, 100%\
    \ |\n| border | Gives your element a border | 1px solid black |\n| margin | Adds\
    \ space around your element | 10px |\n| padding | Adds space inside your element\
    \ | 10px |\n\n> Graphics on your computer screen are made up of tiny colored dots\
    \ called PIXELS (px). You can tell your browser how many pixels you want to be\
    \ in an HTML element.\n\n# The color CSS Property\n\nTo change the color of your\
    \ text, use the color CSS property and then choose a value. It's the same as using\
    \ the background-color property.\n\n```html\n<body>\n<div style=\"color: gray;\"\
    >The Monk Diamond Discovery!</div>\n</body>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_42_0.png)\n\
    \n# Alignment CSS Properties\n\nFar all our HTML elements have been in the same\
    \ position on our page. The text-align and float CSS properties allow you to align\
    \ (or position) text and other HTML elements on your page.\nThe text-align property\
    \ lets you position your text to the left, right, or center of your page. Remember\
    \ to include the hyphen(-).\n\n```html\n<body>\n<div style=\"text-align: center;\"\
    >\nThe Monk Diamond Discovery!\n</div>\n<p>Stolen jewel found in Siberia.</p>\n\
    </body>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_42_1.png)\n\nWe can also\
    \ use CSS to position HTML elements, such as <div> tags or images, to the left\
    \ or right of the page. You use the float CSS property and set the value to the\
    \ left or right.\n\n```html\n<body>\n<div style=\"float: right;\">\nThe expedition\
    \ team:<img src=\"team.jpg\" alt=\"The Team/\">\n</div>\n</body>\n```\n\nThe text-align\
    \ and float properties are easy ways to create an interesting layout for your\
    \ web page.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_43_0.png)\n\n# Using More\
    \ Than One CSS Property\n\nYou can use more than one CSS property and value in\
    \ a style attribute. All you have to do is use a semicolon (;) to separate. Your\
    \ browser will read all the CSS properties and apply them to your HTML element,\
    \ so you can use as many as you need.\n\n```html\n<body>\n<div style=\"background-color:\
    \ lightblue; float: right;\">\nErnest sniffed out the diamond.\n</div>\n</body>\n\
    ```\n\n> Here, we've used two CSS properties.\n\nLook at how we can change both\
    \ the background color and position of a <div>\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_43_1.png)\n\
    \n# Making Different Sizes with CSS\n\nWe now know how to change the color of\
    \ our text, add background colors to our HTML elements, and position them in different\
    \ places on the page. But if we want to make a really interesting web page, we\
    \ also need how to change the sizes of our HTML elements. CSS lets us change the\
    \ size easily. We have to use the width and height CSS properties and set the\
    \ values we want. Let's look at how we can use these properties to make a square\
    \ <div>:\n\n```html\n<body>\n<div style=\"background-color: plum; height: 200px;\
    \ width: 200px\">\n  <p>The Monk Diamond was believed to be gone for.</p>\n  <p>The\
    \ House was shocked by the theft.</p>\n</div>\n</body>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_44_0.png)\n\
    \n# Measurements in CSS\n\nThere are lots of different units you can use for measuring\
    \ in CSS. Make sure you tell your browser what unit you are using by typing it\
    \ after the number. Here are some of the most common:\n\n- Pixels (px)\n- Percentages\
    \ (%)\n- Points (pt)\n\nLet's look at how we can use percentages to change the\
    \ height and width properties of a <div>:\n\n```html\n<body>\n<div style=\"background-color:\
    \ palegreen; height: 75%; width: 50%;\">\n  <p>The police remain baffled by the\
    \ crime.</p>\n  <p>There were no successful leads in the case.</p>\n</div>\n</body>\n\
    ```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_45_0.png)\n\n# Did you notice?\n\
    \nWhen you calculate percentages, you are calculating what percentage of the screen\
    \ you want your element to fill. If you change the size of your browser, the size\
    \ of the element will also change.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_45_1.png)\n\
    \nPixels and points are used in exactly the same way as percentages. With these\
    \ units, the size of your element will stay the same, even if you change the size\
    \ of your browser. Here, we've set the height and width properties using values\
    \ in pixels, and we've used the font-size CSS property to change the size of the\
    \ text to a value in points.\n\n```html\n<body>\n<div style=\"background-color:\
    \ gold; height: 200px; width: 350px; font-size: 20pt\">\n  <p>The Bond Brothers\
    \ have never been caught.</p>\n</div>\n</body>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_45_2.png)\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_45_3.png)\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_45_4.png)\n\
    \n# Creating Borders and Space with CSS\n\nWe can also use CSS properties to create\
    \ borders and space around our HTML elements. To create a border around an HTML\
    \ element, you have to use the border CSS property and set the values to the width,\
    \ style, and color you want. Let's look at an example:\n\n```html\n<body>\n<div\
    \ style=\"border: 4px solid green; width: 50%; height: 100px;\">\n  Professor\
    \ Baistone and Dr. Day are very excited by their discovery.\n</div>\n</body>\n\
    ```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_46_0.png)\n\nWe can also change\
    \ how much space there is inside an HTML element using the padding and margin\
    \ CSS properties. You can set the values for the margin and padding at the top,\
    \ bottom, left, and right of an HTML element. Let's take a look:\n\n```html\n\
    <body>\n  <div style=\"padding: 25px; margin: 50px; border: 4px solid blue; width:\
    \ 50%; height: 100px;\">\n    Ernest was also very happy with the find.<br/>\n\
    \    Professor Baistone gave him extra rations.\n  </div>\n</body>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_46_3.png)\n\
    \nThe padding CSS property creates 25px of space between the border of our <div>\
    \ and the text about Ernest inside the <div>. The margin CSS property creates\
    \ 50px of space between the border of our <div> and the edge of the page.\n"
  mdcn: "\n\n# 代码技能：编写 CSS\n\n现在是你开始在 HTML 中使用 CSS 的时候了。尝试为 HTML 标签添加 `style` 属性，然后设置\
