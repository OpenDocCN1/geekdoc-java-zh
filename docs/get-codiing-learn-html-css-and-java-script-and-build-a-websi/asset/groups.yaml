    # USING CSS CLASSES


    You might have noticed that adding lots of CSS properties to our HTML tags have
    made our lines of code long and difficult to read. It also takes time to type
    in the same CSS properties over and over again. To save time and make our code
    look better, we now need to learn how to use CSS classes. CSS classes help you
