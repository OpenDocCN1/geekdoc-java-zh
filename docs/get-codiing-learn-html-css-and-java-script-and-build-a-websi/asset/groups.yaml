  - '[PAGE 37]


    # # CODING WITH CSS


    So far in this mission, you''ve been coding HTML elements. As you''ve just seen,
    <div> tags are used to group HTML elements so you can easily change them. Next,
    to change the look and position of your HTML elements, you have to use CSS. CSS
    is a programming language often used with HTML. It is used by programmers to change
    the way HTML elements look when they are displayed in browser. CSS is short for
    “Cascading Style Sheets” and is sometimes called style sheets or styles. You can
    use CSS to change the design of your page by adding colors or changing the size
    and shape of HTML elements. You can also use CSS to change where things are positioned.
    In fact, there are many different things you can do with CSS to change the look
    and feel of your page.


    # ## The style Attribute


    To use CSS to change an HTML element, you can add a style attribute to your opening
    HTML tag. You can use the style attribute with any HTML tag. The style attribute
    works exactly the same way as the source and alt attributes we used earlier in
    the mission. Let''s look at how you add a style:


    ```

    <p style="CSS-property: value;">The Monk Diamond had been hidden in a cave.</p>

    ```


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_37_0.png)


    Just like we saw earlier, the value of our style attribute is set using the equals
    sign (=) and enclosed in double quotes (" "). We apply CSS to our HTML tag by
    setting the value of the style attribute to CSS. CSS is a very simple programming
    language to write. It''s always split into two parts: a property and a value.


    # ## CSS Properties and Values


    When you write CSS, you always have to use both a property and a value. The property
    tells your browser what part of the HTML element you want to change. The value
    tells your browser exactly what to change it to. So it works like this:


    | CSS | What does it mean? | Example values |

    |---|---|---|

    | property | The thing you want to change | background-color, height |

    | value | What you want to change it to | red, 200px |'
  - '[PAGE 38]


    When you use CSS, you divide the property from the value by inserting a colon
    (:). At the end of the value, you use a semicolon (;). If the CSS property name
    is more than one word, you join the two words using a hyphen (-). If you don''t
    use the right syntax, your browser won''t be able to decode your instructions.
    Your style attribute should also be written like this:


    ```

    style="CSS-property: value;"

    ```


    Your browser has hundreds of different built-in CSS properties and values that
    you can use in your HTML tags to change your page.

    Let''s take a closer look at how we can use CSS with <div> tags. If we want to
    change the background color of a section of our page, we can use CSS and HTML
    like this:


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_38_0.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_38_1.png)


    ```

    <body>

    <div style="background-color: green;">

    <p>The Monk Diamond had been hidden in a cave.</p>

    <p>It was inside a crack in the rock.</p>

    </div>

    </body>

    ```


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_38_2.png)


    > did you notice?

    It''s very important to use not only the right syntax but also the right spelling
    of the CSS properties and values. Even errors that seem small can prevent your
    browser from understanding your CSS.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_38_3.png)'
