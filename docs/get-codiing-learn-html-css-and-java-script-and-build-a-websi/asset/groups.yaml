    \ printed and they are now ready to be sent to the guests. I'm sending you one\
    \ too!\n\nVery best wishes from our city hideaway,\nDr. Ruby Day\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_138_0.png)\n\
    \n# The Bond Brothers’ Robberries\n\nFrom the Explorer’s Encyclopedia: The Guide\
    \ to Every Adventure\n\nFor other jewel thieves, see Famous Jewel Thieves\n\n\
    The Bond Brothers’ Robberries are the audacious jewel thefts carried out by the\
    \ gang of jewel thieves known as the Bond Brothers. The majority of the jewels\
    \ taken in their raids have never been seen again. Normally, stolen jewelry is\
    \ sold on the black market, but the Bond Brothers are thought to have a top-secret\
    \ hiding place for their loot.\n\n### Contents\n- Home page\n- Featured discoveries\n\
    - Famous explorers\n- Historical expeditions\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_139_0.png)\n\
    \n# Mr. V. Volkov requests the pleasure of your company at a very special exhibition\
    \ hosted by the House of Volkov on June 21 at 7:00 p.m. at the House of Volkov,\
    \ near St. Basil's Cathedral, Moscow\n\nYou are invited to meet guests of honor\
    \ Professor Baurstone, Dr. Day, and Ernest at and to hear about the sensational\
    \ discovery made on their recent expedition\n\nRSVP\n\nInterpol knows that the\
    \ gang has three core members, who are known only by their aliases: Light Fingers,\
    \ Gemma the Gem, and Tony Twinkles. The three members are aided by lesser-known\
    \ associates who help them choose their targets, make their escapes, and hide\
    \ the stolen jewels.\n\nOne of the gang is a skilled criminal stealing from expensive\
    \ boutiques to the way with access to government databases. In all their robberies,\
    \ the CCTV cameras in the area surrounding the target are disabled during the\
    \ period of the crime.\n\nIn addition to steals in smash-and-grab raids, the Bond\
    \ Brothers have held up courier vans and motorcycles delivering jewelry. They\
    \ have disguised themselves\n\n# ADDING CONTENT USING A WEB API\n\nLearn how to\
    \ add content from another web page. Using APIs like the DOM and localStorage\
    \ when you're coding with HTML, CSS, and JavaScript allows you to create more\
    \ complex and interactive web pages or web-based apps. You can use the DOM to\
    \ access some powerful features in your browser. It allows you to dynamically\
    \ make changes to the HTML as your user interacts with your page or app. Great\
    \ work!\n\nNow use CSS to change the design of your app so it looks like this.\n\
    \n# Web APIs\n\nWeb APIs are sometimes called web services. They let you access\
    \ built-in features of websites without having to write lots of code. You can\
    \ use web APIs for lots of different things when you're building a website. You\
    \ might have come across some of these APIs on websites, which will help you do\
    \ these:\n\n- Add maps\n- Add Like or Share buttons for Facebook\n- Share videos\
    \ on YouTube and Twitch\n\nWeb APIs let everyone build and more complex websites\
    \ quickly and easily. To embed a map and plan a route, we are going to use a map\
    \ API. There are several websites on the Internet that let you embed their maps\
    \ on your web pages. Most of them even let you do it for free. Most map APIs are\
    \ Google Maps and Bing Maps, which are run by Google and Microsoft. We're going\
    \ to learn how you can use Google Maps to find the best route for Day and the\
    \ House of Volkov's head of security. You've probably used Google Maps before\
    \ to look up an address, but this time you are learning how to program your very\
    \ map and embed it in your web page.\n\nTo use the Google maps API, you have to\
    \ register with Google and get a special piece of code called an API key. An API\
    \ key is a special password that your web page uses to access the Google API on\
    \ the Google server. If you don't use an API key, you won't be able to embed a\
    \ map. You can get a Google Maps API key by visiting:\n\n```\nhttps://developers.google.com/maps/documentation/embed/\n\
    ```\n\nAn API key is a long piece of code made up of letters and numbers. Every\
    \ one is different, but will look something like this: You have to be thirteen\
    \ or older to have a Google account. If you are under thirteen, ask an adult if\
    \ you can use their account with supervision or if they can sign up on your behalf.\
    \ Make sure you or the adult helping you reads the terms and conditions. Go to\
    \ www.support.google.com to find out more.\n"
