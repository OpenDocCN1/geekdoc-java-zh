    # 核心代码技能


    在接收任务 1 的简报之前，你需要学习一些基础的代码技能。你将在整个代码本中使用这些技能，因此现在掌握它们至关重要。你可以使用 PC 或 Mac 进行编码，但根据你所使用的系统，创建和保存
    HTML 文件的方式及方法会有所不同。


    ## 核心代码技能 1 ► 创建文件夹


    你需要在电脑上找一个可以保存所有 HTML 文件的地方。在桌面上创建一个名为 **Coding** 的文件夹。将所有 HTML 文件保存在同一个地方非常重要，因此请确保在完成任务期间一直使用这个文件夹。


    - 在 PC 上：在 PC 上，右键点击桌面，点击“新建”，然后点击*文件夹*。将你的新文件夹命名为 **Coding**。

    - 在 Mac 上：在 Mac 上，按住 Control 键并点击桌面。然后选择“新建文件夹”。将你的新文件夹命名为 **Coding**。


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_16_0.png)


    ## 核心代码技能 2 创建 HTML 文件


    你得知道如何创建 HTML 文件以便编写代码。程序员通常使用专业软件来编写代码，但所有电脑都带有文本编辑程序，可以让你编写 HTML 文件。如果你有 PC，可以使用记事本（Notepad）。如果你有
    Mac，可以使用文本编辑（TextEdit）。


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_17_0.png)


    在 PC 上，你可以通过进入“开始”菜单并在搜索栏中输入来找到记事本。


    在 Mac 上，你可以通过在屏幕右上角的 Spotlight 搜索放大镜中输入来找到文本编辑器。当你打开文本编辑器时，需要执行以下操作：

    - 将文件设置为纯文本（而不是格式文本）。要此操作，前往菜单栏中的“格式”并选择“制作纯文本”。

    - 同样前往菜单栏中的“文本编辑器”。选择“设置”。在格式部分下的“新文档”选项卡中，确保勾选了“纯文本”。在“选项”部分，确保取消勾选“智能”。

    - 在“设置”的“打开和保存”选项卡中，确保勾选了“将 HTML 文件显示为 HTML 而不是格式文本”。


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_17_1.png)


    ## 核心代码技能 3 保存你的 HTML 文件


    当你第一次保存 HTML 文件时，需要确保在文件名末尾使用 .html 文件扩展名进行保存。你的电脑使用文件扩展名来确定如何打开文件。通过给你的文件添加 .html
    扩展名，你是在告诉电脑应该用网络浏览器打开它。


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_17_2.png)


    在 PC 上，你需要：

    - 转到“文件”并选择“另存为”。

    - 选择 Coding 文件夹作为保存文件的位置。

    - 为你的文件选择一个名称（例如 Mission 1），并将其输入“文件名”栏中。

    - 在文件名后输入 .html，使你的文件名显示为 Mission1.html。点击“保存”。


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_17_3.png)


    在 Mac 上，你需要：

    - 转到“文件”并选择“保存”。

    - 选择你的 Coding 文件夹作为保存文件的位置。

    - 为你的文件选择一个名称（例如 Mission 1），并将其输入“另存为”栏中。

    - 在文件名后输入 .html，使你的文件名显示为 Mission 1.html。

    - 确保未勾选“如果没有提供扩展名，则使用 .txt”复选框。点击“保存”。


    ## 核心代码技能 4 ► 打开你的 HTML 文件


    为了在屏幕上显示你的代码，你需要在浏览器中打开 HTML 文件。你可能想回到文本编辑程序对代码进行一些更改。


    - 在 PC 上：

    ![](img/fd182f6ecb2aea108dbd5523a70555aa_18_0.png)

    当你想编辑代码时，在 Coding 文件夹中右键点击 HTML 文件。选择“打开方式”并选择“记事本”。


    - 在 Mac 上，你需要：

    - 按照核心代码技能 3 中描述的方法保存文件。

    - 打开桌面上的 Coding 文件夹。双击你的 HTML 文件。它将在浏览器中打开。

    - 当你想编辑代码时，右键点击 Coding 文件夹。选择“打开方式”并选择“文本编辑器”。


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_18_1.png)


    > 使用 Mozilla Firefox 或 Google Chrome 等浏览器。


    ## 核心代码技能 5 ► 使用 GET CODING! 网站


    不要忘记在学习本书时，可以使用 Get Coding! 网站来帮助你完成任务。你可以在那里找到探险百科的条目和你可以使用的图片。如果你在任何地方遇到困难，请使用该网站。


    Get Coding! 的 URL 为 www.getcoding.com。


    在网站上，你将找到：

    - 探险百科的条目

    - 你可以使用的图片


    ## 构建网页


    - 学习 HTML 是什么

    - 制作简单的网页

    - 为你的页面添加文本

    - 学习如何布局你的页面

    - 设计你的网页


    '
