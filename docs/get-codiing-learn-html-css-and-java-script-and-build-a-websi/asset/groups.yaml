- md: "\n# code skills checklist\n\nHere are some handy things to remember when using\
    \ HTML tags!\n\n## CODING WITH HTML\n\n- The basic structure of an HTML document\
    \ always looks the same:\n- HTML documents are made up of HTML elements. Elements\
    \ are pieces of content surrounded by HTML tags. Each tag is an instruction to\
    \ your browser, telling it to display the content between the opening and closing\
    \ tags on-screen.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n- HTML tags are written inside angle brackets (< >).\
    \ Your browser knows when the instruction starts and stops. You can always spot\
    \ a closing tag because it contains a forward slash (/). If there is no content\
    \ to put between two tags, you use a self-closing tag, which is an opening and\
    \ closing tag rolled into one.\n\n- Tags are always written in lowercase.\n\n\
    - You can nest HTML tags inside each other. Just don't forget to close your tags.\n\
    \n- When you open a new tag, you should always indent your code by pressing Tab.\
    \ This makes it easier to read your code.\n\n- If you want to give your browser\
    \ extra instructions or information about an HTML element, you can use various\
    \ HTML attributes. Attributes go inside the opening tag. They always have a name\
    \ and a value, which you set using the equals sign (=) and double quotes (\"\"\
    ).\n\nWeb pages normally have more than just words and pictures on them. Turn\
    \ the page to find out how to change the layout and design of your page.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_34_0.png)\n\
    \n## THE LAYOUT AND DESIGN OF YOUR WEB PAGE\n\nNow that you know HTML tags and\
    \ how they work, it's time to start thinking about the layout and design of your\
    \ web page. So far our HTML elements have been positioned in the same place on\
    \ page. If we want to position our text and images in different places or change\
    \ the design of our web page, we need to learn some new HTML tags and attributes.\n\
    \n## The Division Tag: `<div>` and `</div>`\n\nThe `<div>` helps us change the\
    \ layout of a web page by splitting it into sections. The opening tag is `<div>`\
    \ and the closing tag is `</div>`. The tag is a useful and time-saving way of\
    \ grouping HTML elements. It works like an invisible container.\nWhen you group\
    \ HTML elements between an opening and closing `<div>` tag, you can ask your browser\
    \ to make the same changes to all the elements inside the `<div>`. The elements\
    \ outside the `<div>` will be unchanged. Let's take a look at how the `<div>`\
    \ works:\n\n```html\n<body>\n<div style=\"color: gray;\"><p>The Monk Diamond is\
    \ over a billion years old.</p>\n<p>It is a rare green diamond.</p>\n</div>\n\
    <p>It is 300 carats and worth over $10 million.</p>\n</body>\n```\n\nHere, we\
    \ put two paragraphs of text inside a `<div>`. The text inside the `<div>` has\
    \ been changed to gray, using a new HTML attribute called the style attribute.\
    \ The paragraph of text not in the `<div>` has remained unchanged. Our `<div>`\
    \ has grouped HTML elements together and allowed us to easily change them.\n\n\
    > The Monk Diamond is over a billion years old\n> It is a rare green diamond.\n\
    > It is 300 carats and worth over $10 million.\n\nYou'll learn all about the style\
    \ attribute after this Code Skill!\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_35_0.png)\n\
    \n## CODE SKILLS ► CREATING SECTIONS\n\nNow it's time for you to try using the\
    \ `<div>` tag. Master this skill, and you'll be able to make a web page with an\
    \ interesting layout.\n\n- 1. Open your text-editing program. Create a new HTML\
    \ file called `divs.html`. Then copy and paste your code from `webpagtemplate.html`\
    \ into your new file. Modify the code so that it looks like this:\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<title>The Monk Diamond</title>\n</head>\n<body>\n\
    <p>Professor Bairstone is a famous explorer.</p>\n<p>Dr. Day is a top scientist.\
    \ She loves dinosaur fossils.</p>\n</body>\n</html>\n```\n\n- 2. Add two `<div>`\
    \ tags between the opening and closing `<body>` tags. Put each paragraph inside\
    \ a `<div>`, like this:\n- 3. Save your HTML file and open it in your browser.\
    \ Your `<div>` tags won't have changed on screen, but your elements will be grouped\
    \ together, ready for you to design and position.\n\n```html\n<body>\n<div><p>Professor\
    \ Bairstone is a famous explorer.</p></div>\n<div><p>Dr. Day is a top scientist.\
    \ She loves dinosaur fossils.</p></div>\n</body>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_36_0.png)\n\
    \n## CODING WITH CSS\n\nSo far in this mission, you've been coding HTML elements.\
    \ As you've just seen, `<div>` tags are used to group HTML elements so you can\
    \ easily change them. Next, to change the look and position of your HTML elements,\
    \ you have to use CSS. CSS is a programming language often used with HTML. It\
    \ is used by programmers to change the way HTML elements look when they are displayed.\
    \ CSS is short for “Cascading Style Sheets” and is sometimes called sheets or\
    \ styles. You can use CSS to change the design of your page by adding colors or\
    \ changing the size and shape of elements. You can also use CSS to change where\
    \ things are positioned. In fact, there are many different things you can do with\
    \ CSS to change the look and feel of your page.\n\n## The style Attribute\n\n\
    To use CSS to change an HTML element, you can add a style attribute to your HTML\
    \ tag. You can use the style attribute with any HTML tag. The style attribute\
    \ works exactly the same way as the alt attributes used earlier in the mission.\
    \ Let's look at how you add a style:\n\n```html\n<p style=\"css-property: value;\"\
    >The Monk Diamond had been hidden in a cave.</p>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_37_0.png)\n\
    \nJust like we saw earlier, the value of our style attribute is set using the\
    \ equals sign (=) and enclosed in double quotes (\"\"). We apply CSS to our HTML\
    \ tag by setting the value of the style attribute to CSS. CSS is a very simple\
    \ language to write. It's always split into two parts: a property and a value.\n\
    \n## CSS Properties and Values\n\nWhen you write CSS, you always have to use both\
    \ a property and a value. The property tells your browser what part of the HTML\
    \ element you want to change. The value tells your browser exactly what to change\
    \ it to. So it works like this:\n\n| CSS | What does it mean? | Example values\
    \ |\n| :--- | :--- | :--- |\n| property | The thing you want to change | background-color,\
    \ height |\n| value | What you want to change it to | red, 200px |\n\nWhen you\
    \ use CSS, you divide the property from the value by inserting a colon (:). At\
    \ the end of the value, you use a semicolon (;). If the CSS property name is more\
    \ than one word, you join the two words using a hyphen (-). If you don't use the\
    \ right syntax, your browser won't be able to decode your instructions. Your style\
    \ attribute should also be written like this:\n\n```css\nstyle=\"css-property:\
    \ value;\"\n```\n\nYour browser has hundreds of different built-in CSS properties\
    \ and values that you can use in your HTML tags to change your page. Let's take\
    \ a closer look at how we can use CSS with `<div>` tags. If we want to change\
    \ the background color of a section of our page, we can use CSS and HTML like\
    \ this:\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_38_0.png)\n![](img/fd182f6ecb2aea108dbd5523a70555aa_38_1.png)\n\
