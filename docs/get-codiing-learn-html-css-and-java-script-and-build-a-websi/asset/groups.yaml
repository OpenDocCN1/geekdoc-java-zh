  - "[PAGE 67]\n\n# Linking Web Pages\n\nTo protect the information about the Monk\
    \ Diamond, we first need to make a new web page. This new web page will be the\
    \ first page that the user sees. If the user gets the password correct, they will\
    \ be sent to the Monk Diamond web page. If they get the password wrong, nothing\
    \ will happen. By linking our pages, we create a website.\n\nWe need to use a\
    \ hyperlink to connect our pages. If your web pages are saved in the same place\
    \ on your computer, you don't need to provide your web browser with the URL –\
    \ you can just use the file name as the URL. If we make sure we have both HTML\
    \ files saved in our **Coding** folder, we can use code like this:\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_67_0.png)\n\
    \n```\n<a href=\"filename.html\">Web page name</a>\n```\n\nWhen we create our\
    \ new password web page and save the HTML file in our **Coding** folder, we can\
    \ link the new web page to the web page we built for Professor Bairstone in Mission\
    \ 1 really easily. All we need to do is use the `<a>` tag and href attribute on\
    \ each of our pages, like this:\n\n# Page 1: password.html\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <title>Password</title>\n</head>\n<body>\n  <a href=\"monkdiamonddiscovery.html\"\
    >\n    Click here to visit the Monk Diamond web page\n  </a>\n</body>\n</html>\n\
    ```\n\n# Page 2: monkdiamonddiscovery.html\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <title>The Monk Diamond</title>\n</head>\n<body>\n  <a href=\"password.html\"\
    >\n    Click here to log out\n  </a>\n</body>\n</html>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_67_1.png)\n\
    \nClicking on the link in our password page takes us to our Monk Diamond web page.\
    \ And clicking on the link in the Monk Diamond page takes us back to our password\
