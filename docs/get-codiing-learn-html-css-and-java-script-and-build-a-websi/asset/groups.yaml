    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_156_0.png)\n"
  mdcn: "\n\nhttps://www.google.com/maps/embed/v1?q=Moscow&key=API-KEY\n\n在这个 URL\
    \ 中，两个参数通过安培符号 (&) 分隔。第一个是查询键，第二个是 API 密钥。你的浏览器需要它们两者，因为它们包含了这些重要信息：\n\n| 参数键\
    \ | 作用是什么 | 示例值 |\n| --- | --- | --- |\n| q | 提供你想要搜索的地点 | Moscow, London |\n\
    | key | 提供访问 Google 服务器所需的 API 密钥 | API-KEY |\n\nGoogle Maps Embed API 需要这两个参数来找到我们想要嵌入的地图，然后将其集成到我们的页面中。让我们看看如果在我们的\
    \ URL 中使用这两个参数，并将其设置为 `<<iframe>` 的源属性（source attribute）时会发生什么。当我们保存文件并在浏览器中打开它时，我们将看到页面中嵌入了一张莫斯科的地图。\n\
