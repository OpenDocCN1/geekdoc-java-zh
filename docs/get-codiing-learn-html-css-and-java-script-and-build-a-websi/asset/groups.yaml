    \ House was shocked by the theft.</p>\n</div>\n</body>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_44_0.png)\n\
    \n# CSS 中的测量\n\nCSS 中有很多不同的单位可以测量。确保在数字后面输入你正在使用的单位。这里是一些常用的：\n\n- 像素 (px)\n-\
