    \ TIMES\n\n# Mission Brief\n\nDear MonkCoder,\n\nThe Monk Diamond arrived at the\
    \ House of Volkov yesterday. Dr. Day and I are both grateful for your help with\
    \ planning the route. All seemed to go smoothly, although Dr. Day did think a\
