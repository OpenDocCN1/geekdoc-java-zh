    > I really like this way of embedding content in our page.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_147_0.png)\n\
    \n## EMBEDDING A GOOGLE MAP\n\nAs you can see, the \\<iframe> tag is really useful.\
    \ Let's learn now how we can integrate a Google Map into our page using it. The\
    \ simplest kind of Google Map you can add is called embedded search. You use a\
    \ Google API called the Google Maps Embedded API. When the user gives the API\
    \ a keyword, such as the name of a country, city, or street, it will produce a\
    \ map based on that keyword.\n\n## URLs\n\nYou need to provide the Google Maps\
    \ Embedded API with a URL in the source attribute of your \\<iframe>. The URL\
    \ has to contain several important pieces of information for the correct map to\
    \ be embedded. Let's see exactly what information we need to include in a URL\
    \ if we want to embed a map of Moscow in our web page:\n\n```\nhttps://www.google.com/maps/embed/v1/search?q=Moscow&key=API-KEY\n\
    ```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_148_0.png)\n\nThe first part of\
    \ the URL is the path to the Google Maps Embedded API. Then you have to tell the\
    \ API what built-in function you want to use. We want to use the search API function\
    \ on the Google server, so that we add to the URL. The next piece of information\
    \ is the specific part of our request, called the query `string parameters`.\n\
    \n> A STRING is a piece of data in the form of a sequence of characters. Strings\
    \ can be made up of words and numbers.\n\n> A parameter is another name for a\
    \ piece of information, or an argument, that is passed to a function so it can\
    \ perform an action.\n\n## String Parameters\n\nThe string parameters are the\
    \ parts of a URL that contain variables — the pieces of information that depend\
    \ on the use. In our example, there are two parameters. The two variables are\
    \ the map we are searching for (Moscow) and our unique API key. We have to structure\
    \ our query parameters in a certain way, the Google server is able to access information\
    \ stored in our variables. The two parts of the query string parameters are the\
