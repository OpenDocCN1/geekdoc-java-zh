    # CODE SKILLS HOW TO BUILD A BUTTON


    Let''s start making the app for Professor Bairstone by building a button. Use
    <input/> tags to code a text box and button.


    +   1. Open up your text-editing program. Create a new HTML file called app.html.
    Type this code into your new file:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>To-Do List App</title>

    </head>

    <body>

    <p>Special Exhibition To-Do List</p>

    <br/><br/><br>

    </body>

    </html>

    ```


    +   2. Now use the <input/> tag to create a text box and button in your <body>.
    Don''t forget that you need to include two attributes inside your <input/> tags:
    the type and value attributes. You should set the value attribute to the text
    you want to display in your box and button. Your code will look like this:


    ```

    <body>

    <p>Special Exhibition To-Do List</p>

    <br/><n<input type="text" value="Type here to add task"/>

    <br/>

    <input type="button" value="Add item"/>

    <br/>

    </body>

    ```


    +   3. Save your HTML file and open it in your browser. You will see your box
    and button displayed on-screen.


    Now create a CSS class and use the CSS type attribute selector to change the color
    of your button.


