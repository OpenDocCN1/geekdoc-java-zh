    \ will look like this:\n\n```html\n<head>\n  <title>To-Do List App</title>\n \
    \ <script>\n    function addItem() {\n      alert(\"Hire security team!\");\n\
    \    }\n  </script>\n</head>\n```\n\n- 3. Save your HTML file and open it in your\
    \ browser. Your button will now pop up an alert when you click on it.\n\n## THE\
    \ DOCUMENT OBJECT MODEL (DOM)\n\nThe button and text box in our app work now.\
    \ But how will Professor Bairstone add and remove items from his list? To allow\
    \ him to do this, we need to use the Document Object Model (or DOM for short).\n\
    \nWe learned in Mission 1 that an HTML web page file is called a document. As\
    \ you know, HTML documents are made up of lots of smaller pieces of HTML, called\
    \ HTML elements. When we save our HTML file and run the code in our web browser,\
    \ the browser draws the elements on-screen. If we want to build the app, we need\
    \ to be able to change, delete, or add new HTML elements after our browser has\
    \ drawn the page on our screen.\n\nAs we've seen working through Mission 2, built-in\
    \ functions like the alert are very useful when we code. The DOM is a set of built-in\
    \ functions that work with your web browser. The built-in functions make it easy\
    \ to build web pages that are dynamic, changing according to what the user does.\n\
    \n## Programming Interfaces\n\nThe DOM is an application program interface (or\
    \ API). APIs help when you are coding. They are sets of built-in functions that\
    \ you can easily use with HTML and JavaScript code.\n\nThe alert function we used\
    \ in Mission 2 is a built-in function. Rather than having to code an alert, we\
