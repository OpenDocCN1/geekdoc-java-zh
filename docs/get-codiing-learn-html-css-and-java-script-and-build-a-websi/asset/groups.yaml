    \ will now look like this:\n\n```\n<DOCTYPE html>\n<html>\n<head>\n<title>Security\
    \ Game</title>\n<style>\n#board {\n  border: 1px solid black;\n  background-color:\
    \ gray;\n  height: 350px;\n  width: 650px;\n}\n.character {\n  background-color:\
    \ lightblue;\n  width: 120px;\n  height: 120px;\n  padding: 10px;\n  margin: 10px;\n\
    \  float: left;\n}\n</style>\n</head>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_167_0.png)\n\
    \n> Did you notice? We have used the float CSS property. This will make our <div>\
    \ tags align with one another.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_167_1.png)"
  - "[PAGE 168]\n\nThen apply your new character CSS class to each of your six <div>\
    \ tags using the class attribute, as you did in Mission 1. Your <body> will look\
    \ like this:\n\n```\n<body>\n  <input type=\"button\" value=\"Play\" onclick=\"\
    startGame();\"/>\n  <div id=\"board\">\n    <div class=\"character\">1</div>\n\
    \    <div class=\"character\">2</div>\n    <div class=\"character\">3</div>\n\
    \    <div class=\"character\">4</div>\n    <div class=\"character\">5</div>\n\
    \    <div class=\"character\">6</div>\n  </div>\n  <script>\n    function startGame()\
    \ {\n    gameLoop();\n  }\n\n  function gameLoop() {\n    alert(\"Game over!\"\
    );\n    setTimeout(gameLoop, 3000);\n  }\n  </script>\n</body>\n</html>\n```\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_168_0.png)\n\n> It's starting to look\
    \ more like a game!\n\nSave your code and refresh your page. You will see the\
    \ CSS properties applied to your <div> tags.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_168_1.png)\n\
    \n> Something's making my nose itch.\n\n| | | | |\n|---|---|---|---|n| 1 | 2 |\
    \ 3 | 4 |\n| 5 | 6 | | |"
  - "[PAGE 169]\n\n# 7. use the game loop to stop the game\n\nNow that we've added\
    \ our characters to the game board, we need to make some changes to our game loop.\
    \ At the moment, it pops up an alert every 3 seconds. We need to change our loop\
    \ so it will stop after a certain period of time. We're going to do this by counting\
    \ how many times we loop. When our loop has run a certain number of times, our\
    \ game will end.\n\nTo count our loops, let's create a variable that will increase\
    \ in value every time it's called. To do that, we should code a variable called\
    \ loops that is set to the value 0. Add this variable to your <script> block before\
    \ your gameLoop function, like this:\n\n```\n<script>\nfunction startGame() {\n\
    \  gameLoop();\n}\nvar loops = 0;\nfunction gameLoop() {\n  alert(\"Game over!\"\
    );\n  setTimeout(gameLoop, 3000);\n}\n</script>\n```\n\nWe need to use this variable\
    \ in our gameLoop function. We want to add 1 to its value every time the function\
    \ is called. To do this, we could code like this:\n\n```\nloops = loops + 1;\n\
    ```\n\nHowever, we can actually use a new JavaScript operator to write the same\
    \ instruction in a simpler and shorter way. It's called the increment operator\
    \ (++), and it's just like the operators we learned about Mission 2. We can use\
    \ the increment operator (++) to add 1 to the value of our variable. All we have\
    \ to write this is:\n\nWe can use the increment operator (++) in our gameLoop\
    \ function to count how many times our loop has been called. Remove the alert\
    \ from your gameLoop function and replace it with your new piece of code, like\
    \ this:\n\n```\nfunction gameLoop() {\n  loops++;\n  setTimeout(gameLoop, 3000);\n\
    }\n```\n\n> This gives me paws for thought!\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_169_0.png)"
  - "[PAGE 170]\n\nNow we want to make sure that our game loops for a fixed number\
    \ of times before the game ends. We do this by adding an if statement and an else\
    \ statement to our gameLoop function, which will keep track of how many times\
    \ our loop has run.\n\nWe need to make sure when the loop has run for a certain\
    \ number of times, the setTimeout function calling the loop will stop and an alert\
    \ will pop up. We want our loop to run 12 times. It will run every 3 seconds until\
    \ the twelfth loop, when the game will end. Our game will last for a total of\
    \ 33 seconds (11 multiplied by 3) before it ends the twelfth loop. Let's look\
    \ at our whole <script> block with the new variable, if statement, and else statement:\n\
    \n```\n<script>\nfunction startGame() {\n  gameLoop();\n  var loops = 0;\n  function\
    \ gameLoop() {\n    loops++;\n    if(loops < 12) {\n      setTimeout(gameLoop,\
    \ 3000);\n    } else {\n      alert(\"Game over!\");\n    }\n  }\n}\n</script>\n\
    ```\n\nThe if statement keeps track of how many times our loop has run. If it\
    \ is less than (< 12 times, it keeps running by calling setTimeout again. If it\
    \ is 12 times or more, the else statement runs and an alert pops up.\n\nSave your\
    \ new code and refresh your page. Press the Play button and wait until the alert\
    \ pops up. Your game will now end after a certain period of time.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_170_0.png)\n\
    \n> Don't forget, you have to wait for 33 seconds before the alert will pop up!"
- md: "\n## 8. Use css to show and hide the characters\n\nDuring our game, the guest\
    \ and thief characters will flash on-screen. The House of Volkov security team\
    \ will have to spot and click on the thief before he or she disappears. We need\
    \ to use CSS to make the characters appear and disappear as the game loop runs.\
    \ To do this, we have to learn a new CSS property that makes an HTML element appear\
    \ or disappear from our browser. We can then use JavaScript to apply the property\
    \ to our characters.\n\n| CSS property name | What does it do? | Example values\
    \ |\n| --- | --- | --- |\n| display | Changes how an HTML element appears on-screen\
    \ | block, none |\n\nThe display CSS property has lots of different values. The\
    \ two values we need for our game are \"block\" and \"none\". If you set the display\
    \ property of an HTML element to none, the element will not appear on your screen.\
    \ If you set the display property to block, the HTML element will display as a\
    \ square.\n\nIn your text-editing program, add two new CSS classes called hidden\
    \ and visible. Use the display property so your <style> block looks like this:\n\
    \n```css\n<style>\n#board {\n  border: 1px solid black;\n  background-color: gray;\n\
    \  height: 350px;\n  width: 650px;\n}\n.character {\n  background-color: lightblue;\n\
    \  width: 120px;\n  height: 120px;\n  padding: 10px;\n  margin: 10px;\n  float:\
    \ left;\n}\n.hidden {\n  display: none;\n}\n.visible {\n  display: block;\n}\n\
    </style>\n```\n\n- Save your code.\n\nLet's try using this new CSS property!\n\
    \n## CODE SKILLS USING THE DISPLAY CSS PROPERTY\n\nTry using the CSS display property\
    \ to make HTML elements appear and disappear on your screen. You'll need this\
    \ to make your characters display correctly in your game.\n\n- 1. Open up your\
    \ text-editing program. Create a new HTML file called display.html. Type out the\
    \ code below, then save your HTML file and open it in your browser. Your page\
    \ will look like this:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Display</title>\n\
    </head>\n<body>\n<div>Security</div>\n<div>Thief</div>\n<div>Guest</div>\n</body>\n\
    </html>\n```\n\n- 2. Reopen your file in your text-editing program. Modify your\
    \ second <div> by adding the display CSS property so it looks like this:\n\n```html\n\
    <body>\n<div>Security</div>\n<div style=\"display:none;\">Thief</div>\n<div>Guest</div>\n\
    </body>\n```\n\n- 3. Save your file and refresh your page. The display CSS property\
    \ and none value will make your second <div> disappear from your screen.\n\n##\
    \ 9. Animate the characters\n\nWe now need to apply our two new CSS classes (hidden\
    \ and visible) to our game loop so the character <div> tags become animated. To\
    \ do this, we need our game loop to add and remove the new CSS classes to and\
    \ from our <div> tags.\n\nWhen our game runs, we want our characters to flash\
    \ on and off the screen. We're currently looping around 12 times, so the character\
    \ <div> tags needs to be visible for 6 loops and invisible for 6 loops to create\
    \ the flashing effect. The first thing we need is a new variable called peopleVisible\
    \ to store this information. We need to set this variable to false, like this:\n\
    \n```javascript\nvar peopleVisible = false\n```\n\nWe need the variable to be\
    \ set to false at the start so that the character <div> tags start off hidden\
    \ on our screen. Then when the variable is set to true, the characters will appear\
    \ on our screen.\n\nWhen the game loop runs, we want the value stored in our new\
    \ variable to alternate between true and false. To do this, we have to use another\
    \ JavaScript operator, called the not operator (!). We can use the not operator\
    \ (!) to change the value of your variable.\n\nLet's look at how we use the not\
    \ operator (!) in our <script> block. Type these new pieces of code into your\
    \ text-editing program and save your file.\n\n```javascript\n<script>\nfunction\
    \ startGame() {\n  gameLoop();\n}\nvar peopleVisible = false;\nfunction gameLoop()\
    \ {\n  peopleVisible = !peopleVisible;\n  loops++;\n  if(loops < 12) {\n    setTimeout(gameLoop,\
    \ 3000);\n  }\n  else {\n    alert(\"Game over!\");\n  }\n}\n</script>\n```\n\n\
    We have used the not operator (!) to alternate the value of our new variable.\
    \ If the value of our variable is false, when the variable runs in our game loop,\
    \ the not operator (!) will change its value to true. And if the value of our\
    \ variable is true, when the variable runs, the not operator (!) will change its\
    \ value to false. Every time our loop runs, the loops variable will go up by one\
    \ and the peopleVisible variable will alternate between true and false. As we\
    \ loop, our variables will look like this:\n\n| Loop number | Variable value |\n\
    | --- | |\n| 1 | True |\n| 2 | False |\n| 3 | True |\n| 4 | False |\n| 5 | True\
    \ |\n| 6 | False |\n| 7 | True |\n| 8 | False |\n| 9 | True |\n| 10 | False |\n\
    | 11 | True |\n| 12 | False |\n\nNow we need to add a new function called <script>\
    \ block that will make our character <div> tags appear on-screen when the variable\
    \ value is true. We do this using our two CSS classes. When the value is true,\
    \ we want to use the visible class, and when the value is false, we want to use\
    \ the hidden class. Turn the page to find out exactly how to code this flashCharacters\
    \ function.\n\n## 10. Apply css using JavaScript\n\nWe need a new function that\
    \ applies a CSS class to the character <div> tags depending on the value of our\
    \ variable. We should call this function flashCharacters. The function must find\
    \ our board using getById and store it in a variable. Then the function needs\
    \ to pick a CSS class to apply to the character <div> tags. This will depend on\
    \ the value of our variable. We initialize it to an empty string. If our peopleVisible\
    \ variable is true, our classSet variable will be set to the visible CSS class.\
    \ If our peopleVisible variable is false, the else statement will change our classSet\
    \ variable to the hidden CSS class.\n\nTo decide the class, we create a variable\
    \ called classSet that will store the names of the CSS classes we need to set.\
    \ We need to code a loop that counts the 6 <div> tags. As the loop counts the\
    \ <div> tags, we assign the value of our classSet variable to each <div>. We do\
    \ this using the className method. The className method sets a CSS class on an\
    \ HTML element in JavaScript.\n\nOur complete function now looks like this:\n\n\
    ```javascript\nfunction flashCharacters() {\n  var board = document.getElementById(\"\
    board\");\n  var classSet = \"\";\n  if(peopleVisible) {\n    classSet = \"character\
    \ visible\";\n  } else {\n    classSet = \"character hidden\";\n  }\n  for(var\
    \ index = 0; index < 6; index++) {\n    board.children[index].className = classSet;\n\
    \  }\n}\n```\n\n> Did you notice?\nIn the variable called index inside our loop,\
    \ we have stored more than one piece of information. This kind of variable is\
    \ called a collection. We have to use brackets ([]) to get a value out of the\
    \ collection to use in our code.\n\nAn EMPTY STRING is a piece of data in the\
    \ form of a sequence of characters that has no value. In JavaScript an empty string\
    \ is represented as \"\".\n\n## 11. Simplify the conditional statements\n\nThis\
    \ function looks quite complicated, so we should now try to simplify it. You can\
    \ use another operator in JavaScript, called a conditional operator (?), to simplify\
    \ the if and else statements. You use the conditional operator (?) like this:\n\
    \n```javascript\nvar variableName = condition ? value1 : value2;\n```\n\nThis\
    \ tells our browser that if the condition of our variable is true, it should use\
    \ value1, and if it is false, it should use value2. So we can rewrite the code\
    \ in our function like this:\n\n```javascript\nvar classToSet = peopleVisible\
    \ ? \"character visible\" : \"character hidden\";\n```\n\nAdd your new flashCharacters\
    \ function with the simplified if else statements to your <script> block. Make\
    \ sure your gameLoop function calls your new function too. Save your code and\
    \ open it in your browser. Every 3 seconds, your blue boxes will appear and disappear\
    \ on your screen.\n"
  mdcn: "\n\n## 8. 使用 css 显示和隐藏角色\n\n在我们的游戏中，访客和小偷角色会在屏幕上闪烁。沃尔科夫庄园（House of Volkov）的安全团队必须在小偷消失之前发现并点击它。我们需要使用\
