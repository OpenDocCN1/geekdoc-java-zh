  - '[PAGE 111]


    # Adding to Your App Using the DOM


    We now know how to use the DOM’s methods and elements to our app. To find and
    change HTML elements in our app, which will be really useful. We now need to learn
    how to use the DOM to add new HTML After all, Professor Bairstone needs to be
    able to add items to the list. The DOM has two methods that we can use with JavaScript


    # The createElement Method


    The createElement method is used to make a new HTML element, such as a <div>,
    button, or paragraph. You have to include the name of the type of HTML element
    you want to create in double quotes (") and parentheses after the keyword, like
    this: You can then use JavaScript to assign your new element to a variable, using
    the assignment operator (=) we learned about in Mission 2. Then you can use the
    innerHTML property to set the content of your new element before your browser
    draws it onscreen.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_111_0.png)


    # The appendChild Method


    The appendChild method lets you add a new HTML element to an existing HTML element.
    When the new element is drawn on-screen, it will be drawn underneath the existing
    element. You have to include the HTML element you want to add in parentheses after
    the keyword, like this: The appendChild and createElement methods allow you to
    add each item to the list in the app.


    ```

    <script>

    var newDiv = document.createElement("div");

    newDiv.innerHTML = "Professor Bairstone";document.body.appendChild(newDiv);

    </script>

    ```


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_111_1.png)


    > Did you notice?

    All the DOM methods and properties are written using camelCase.'
