    on your page. Programmers use CSS classes to keep their code as simple as possible.
    It''s really important to do this when you are coding, as it means you are less
    likely to make mistakes. If, for example, you know that all want the text in every
    `<div>` on your page to be a certain color and font size, rather than having to
    type the CSS properties into every `<div>`, you can use a CSS class to change
    all the `<div>` tags on your page at once.


    A CSS class is a very handy way of applying a group of CSS properties to any HTML
    element


    # Using the <head> Tag


    So far we''ve mostly been coding inside the `<body>` of our page. It''s now time
    to take a closer look at how we can use the `<head>`. Let''s go back to the first
