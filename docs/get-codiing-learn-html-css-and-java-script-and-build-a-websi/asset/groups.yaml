    \ security team immediately noticed that they were behaving suspiciously near\
    \ the diamond's glass case. Mr. Volvo intervened, and the police were called just\
    \ in time. Thanks to you, the Bond Brothers are now behind bars.\n\nThe news about\
    \ the Monk Diamond spread quickly and caused quite stir, both in Moscow and around\
    \ the world. Mr. Volvo is so delighted to have it back in its rightful home that\
    \ he wants to open the special exhibition to the public. Now that we know the\
