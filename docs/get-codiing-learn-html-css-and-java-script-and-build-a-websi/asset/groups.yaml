    a statement. JavaScript programs normally contain many statements. A statement
    usually starts with a keyword that tells you what action it will perform. It always
    ends with a semicolon (;). Your browser runs one statement after another in the
    order they are written. Let''s look at some JavaScript statements. When we save
    this code and run it in our browser, this happens:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Password</title>

    </head>

    <body>

