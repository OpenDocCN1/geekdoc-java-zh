    \nWhen you save your file and refresh your page, you will see your text displayed\
    \ in an alert.\n\n## COMPARISON OPERATORS\n\nIn addition to assigning values or\
    \ performing calculations, operators can be used to compare the values of variables.\
    \ Being able to compare values allows us to make our web pages more interactive.\
    \ Using comparison operators, we can write code that does things depending on\
    \ the values of our variables. Here are some of the different comparison operators\
    \ you can use:\n\nThese operators can be used in JavaScript statements to ask\
    \ questions about our variables. Then we can write code that makes different things\
    \ happen depending on the answer to the question. Instructions for our browser\
    \ that use comparison operators are called if statements and else statements.\
    \ These types of statements are called conditional statements, because they depend\
