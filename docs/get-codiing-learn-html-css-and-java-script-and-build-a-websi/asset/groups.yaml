    \ `key` 设置为你之前在任务中获得的唯一 API 密钥。你的源属性看起来像这样：\n\n```\n<iframe>\n  width=\"450px\"\
    \n  height=\"450px\"\n  frameborder=\"0px\"\n  style=\"border: 0px\"\n  src=\"\
    https://www.google.com/maps/embed/v1?q=Moscow&key=API-KEY\"\n</iframe>\n```\n\n\
    ![](img/fd182f6ecb2aea108dbd5523a70555aa_150_1.png)\n\n- 4. 保存你的 HTML 文件并在浏览器中打开它。你将看到地图嵌入在你的页面中。\n\
    \n# 使用 Google Maps 规划路线\n\n现在你已经学会了如何在页面中嵌入地图，我们可以开始规划 Day 博士和安全主管需要穿过莫斯科的路线。要做到这一点，我们需要构建一个新的\
    \ URL 并使用 Google Maps Embed API 中的一个新函数。我们必须以稍微不同的方式创建我们的 URL。\n\n我们需要使用 directions（路线）函数，而不是\
    \ search（搜索）函数。directions 函数将创建一个提供从指定地点到另一个指定地点的路线地图。Day 博士需要从高尔基公园（Gorky Park）带着僧侣之钻石前往圣瓦西里大教堂，所以我们新的\
    \ URL 将看起来像这样：\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_151_0.png)\n\n```\n\
    https://www.google.com/maps/embed/v1/directions?origin=GorkyPark,Moscow&destination=StBasil&key=API-KEY\n\
    ```\n\n和之前一样，我们 URL 的第一部分是通 Google Maps Embed API 的路径。然后我们请求使用 directions API\
    \ 函数。接着我们使用三个参数：origin（起点）、destination（终点）和 API key。对于起点和终点，你可以放入很多值，但最简单的方法是放入城市名称的名字。这两个新键对你的浏览器是重要的，因为它们提供了以下信息：\n\
    \n| 参数键 | 作用是什么 | 示例值 |\n| --- | --- | --- |\n| origin | 提供你想要路线开始的地点 | GorkyPark,Moscow\
    \ |\n| destination | 提供你想要路线结束的地点 | StBasil,Moscow |\n\n> 注意到了吗？我们包含了名称和城市，用逗号（,）分隔。逗号后面没有空格。\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_151_1.png)\n\n让我们将新的 URL 添加到源属性（source\
    \ attribute）中，看看 Day 博士和安全主管需要穿过莫斯科的路线：\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <title>Top-Secret Route</title>\n</head>\n<body>\n  <iframe\n  width=\"650px\"\
    \n  height=\"650px\"\n  frameborder=\"0px\"\n  style=\"border: 0px\"\n  src=\"\
    https://www.google.com/maps/embed/v1/directions?\n  origin=GorkyPark,Moscow&destination=StBasil,Moscow&key=API-KEY\"\
    >\n</iframe>\n</body>\n</html>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_152_0.png)\n\
    \n> 这正是 Day 博士将僧侣之钻石运送到 Volkov 家需要的！\n\n# 动手完成：规划路线\n\n干得好！你学习了如何使用 web API 和\
    \ Google Maps 在页面中嵌入内容。现在使用你的新知识规划一条从高尔基公园到圣瓦西里大教堂的莫斯科路线。拥有路线将帮助 Day 博士保持安全。\n\
    \n# 莫斯科路线\n\n当你规划路线时，使用你的新技能完成以下操作：\n\n- **使用 API 密钥**：使用 Google Maps Embed API\
    \ 获取 API 密钥。\n- **创建一个 <iframe>**：使用这个 HTML 标签以便可以在页面中嵌入内容。\n- **更改你的 <iframe>\
    \ 显示方式**：使用属性更改高度、宽度和边框。\n- **使用源属性（source attribute）**：嵌入一个连接到你所需的 web API 的\
    \ URL。\n- **使用 Google Maps Embed API**：使用 API 创建地图。\n- **使用内置 directions 函数**：使用此函数绘制路线。\n\
    - **设置参数**：为 directions 函数提供路线的起点和终点。\n\n将你的文件保存在 **Coding** 文件夹中并将其命名为 **route.html**。\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Top-Secret Route</title>\n</head>\n\
    <body>\n  <iframe\n    width=\"1000px\"\n    height=\"1000px\"\n    frameborder=\"\
    0px\"\n    style=\"border:0px\"\n    src=\"https://www.google.com/maps/embed/v1/directions?\n\
    \    origin=GorkyPark,Moscow&destination=StBasil,Moscow&key=API-KEY\">\n  </iframe>\n\
    </body>\n</html>\n```\n\n不要忘记使用保存的 API 密钥。\n\n# 未来技能\n\n了解如何使用 web APIs 意味着你可以轻松地在代码中包含其他应用或网站的功能。你可以使用它们来构建使用大型服务的页面和应用，例如\
    \ Facebook 或 Instagram 等社交网络，或者 Google Maps 或 Dropbox 等工具。这将节省你的时间，避免从头开始编码。\n\
    \n这就是你完成的代码的样子！\n\n这条路线将阻止 Bond 兄弟并确保僧侣之钻石的安全！\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_154_0.png)\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_155_0.png)\n\n# 制作游戏\n\n- 在 JavaScript中使用计时\n\
    - 学习什么是游戏循环以及它们如何工作\n- 学习如何用 JavaScript 制作 HTML \n- 构建一个测试反应时间的游戏\n\n# 任务简报\n\n\
    亲爱的 MonkCoder：\n\n僧侣之钻石昨天到达了 Volkov 家。Day 博士和我感谢你帮助规划路线。一切似乎进展顺利，尽管 Day 博士认为一个戴着大帽的胡子男人可能在跟踪他们。他很快消失了，但她感到有些惊慌。谢天钻石安全到达了。\n\
    \n它被放置在新的玻璃柜里，新的垫子上，看起来光彩夺目！我们一直在银盘上摆放零食，这是我们列表上的最后一个任务。今晚展览的大开幕一切已准备就绪。\n\n私下里，自从岩石事件以来，我一直担心我们的安全安排。我知道我们一直小心地保守僧侣之钻石的发现，你为我们的网页创建一个密码做得非常好。但我担心\
    \ Bond 兄弟可能还在追踪（不要忘记其中之一是一个熟练的网络犯罪分子）。我最大的恐惧是他们再次再次偷钻石来破坏展览。\n\n在伦敦最著名的博物馆之一工作的一位老友最近告诉我，她使用电脑游戏训练了一支极佳的安全团队。在她给我看数据之前，我并不相信她。游戏显著提高了团队的反应时间，他们对博物馆可疑情况的反应比玩游戏之前快得多。\n\
    \n我在想你是否能帮我构建一个可以测试 Volkov 家团队反应时间的游戏。我今天下午很忙，因为我还需要为 Ernest 买一个新项圈，所以我非常希望你能提供帮助。我附上了《探险家百科全书》中的一个私有条目。它包含了关于展览的敏感信息，请不要与任何人分享。\n\
    \n再次感谢你的极大帮助。来自繁忙莫斯科的最诚挚问候，\n哈里·贝斯斯坦教授\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_156_0.png)\n\
    \n"
