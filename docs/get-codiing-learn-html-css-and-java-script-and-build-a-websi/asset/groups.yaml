    # 沃尔尔科夫家族


    选自《探险家百科全书：冒险指南》


    沃尔尔科夫钻石跳转至此。


    沃尔尔科夫家族是世界上最老的珠宝店之一，以高品质钻石珠宝闻名。它还拥有一世界闻名的私人宝石收藏。沃尔尔科夫家族由弗拉基米尔·沃尔尔科夫于17世纪0世纪90年代在圣彼得堡创立，他因对最稀有珍贵宝石的热爱被称为“钻石王子”。沃尔尔科夫家族曾被任命为皇室官方珠宝商，为俄罗斯贵族提供设计精美的漂亮珠宝。


    如今，沃尔尔科夫家族位于莫斯科最尊华的街道之一，靠近圣瓦西里大教堂。沃尔尔科夫钻石依然以其质量闻名，是世界上最昂贵的钻石之一。


    现任主维克多·沃尔尔科夫在拍卖会上以一个未披露的价格买下了“僧侣钻石”。沃尔尔科夫家族私人收藏的核心作品曾陈在一个古董玻璃柜内向公众展示，直到在一次抢劫案中被盗。“僧侣钻石”案至今仍未破。自从抢劫案以来，沃尔尔科夫家族的销售额大幅下降，有传言说它可能会被出售。沃尔尔科夫先生在最近的采访中说：“如果我家族世代经营的生意不得不关闭，我将心碎不已。”


