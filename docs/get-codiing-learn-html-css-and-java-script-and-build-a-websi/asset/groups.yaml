    \ <br/>\n  <input type=\"text\" value=\"Type here to add task\"/>\n  <br/>\n \
    \ <input type=\"button\" value=\"Add item\" onclick=\"addItem();\"/>\n  <br/>\n\
    </body>\n</html>\n```\n\n- 2. Add the `<script>` tag to your `<head>`. Create\
