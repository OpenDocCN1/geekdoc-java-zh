    \ our new <div> has been added to the first <div>.\n\n> You wouldn't believe how\
    \ forgetful Professor Bairstone can be!\n\n## CODE SKILLS ADDING NEW ELEMENTS\n\
    \nNow it's your turn to try the createElement and appendChild methods. In your\
    \ code, use the DOM and JavaScript to create a new HTML element when an existing\
    \ element is clicked. APIs like the DOM make building easier.\n\n- 1. Open up\
    \ your text-editing program. Create a new HTML file called newelements.html. Code\
    \ a <div> (with an id attribute) that contains text, like this:\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>New Elements</title>\n</head>\n<body>\n<div id=\"\
    list\">Click here to add item...</div>\n</body>\n</html>\n```\n\n- 2. In your\
    \ `<head>`, create a new function. Your code will look like this:\n\n```html\n\
    <head>\n<title>New Elements</title>\n<script>\nfunction addItem() {\n}\n</script>\n\
    </head>\n```\n\n- 3. Now make your function create a <div> using the createElement\
    \ method. Store your new <div> in a variable and give the variable a name. Then\
    \ set the value of your new <div> to some text using the innerHTML property. Your\
    \ code will look like this:\n\n```javascript\n<script>\nfunction addItem() {\n\
    \  var newItem = document.createElement(\"div\");\n  newItem.innerHTML = \"New\
    \ item\";\n}\n</script>\n```\n\n- 4. Add a final line to function. Use getElementById\
    \ to find the <div> in your <body>. Use the appendChild method to add the new\
    \ <div> to the <div> in your <body>. Your code will look like this:\n\n```javascript\n\
    <script>\nfunction addItem() {\n  var newItem = document.createElement(\"div\"\
    );\n  newItem.innerHTML = \"New item\";\n  document.getElementById(\"list\").appendChild(newItem);\n\
    }\n</script>\n```\n\n- 5. Now the only thing missing is the function call in the\
    \ <body> of your code. Add the onclick attribute to the <div> in your <body>,\
    \ so that when the <div> text is clicked, your addItem function is called. Your\
    \ code will look like this:\n\n```html\n<body>\n<div id=\"list\" onclick=\"addItem();\"\
    >Click here to add item</div>\n</body>\n```\n\n- 6. Save your HTML file and open\
    \ it in your browser. When you click on the \"Click here\" piece of text, a new\
    \ <div> will be added to your app every time you click.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_114_0.png)\n\
    \n## MAKING THE TO-DO LIST APP\n\nNow that you know what the DOM is and how it\
