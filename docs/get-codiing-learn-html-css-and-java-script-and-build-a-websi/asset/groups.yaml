    # Mission Brief


    Dear Monk Coder,

    The Monk Diamond arrived at the House of Volkov yesterday. Dr. Day and I are both
    grateful for your help with planning the route. All seemed to go smoothly, although
    Dr. Day did think a bearded man wearing a large hat might have been following
    them. He vanished quickly, but she was slightly alarmed. Thank goodness the diamond
    arrived safely.


    It''s been positioned in its new glass case, on its new cushion, and it looks
    dazzling! We''ve been arranging the snacks on silver platters, which was the final
    task on our list. Everything is now ready for the grand opening of the exhibition
    tonight.


    Between you and me, ever since the incident with the boulder, I have been worried
    about our security arrangements. I know we have been very careful to keep the
    discovery of the Monk Diamond a secret, and you did a great job creating a password
    for one of our web page. But I am worried that the Bond Brothers might still be
    on our trail (don''t forget one of them is a skilled cybercriminal). My biggest
    fear is that they could sabotage the exhibition by stealing the diamond again.


    An old pal in London who works for one of the city''s most famous museums recently
    told me she has trained a superb security team using a computer game. I didn''t
    believe her until she showed me the data. The game sharpened the team''s reaction
    times significantly, and they responded to suspicious circumstances at the museum
    far more quickly than they had before they played the game.


    I was wondering if you could help me by building a game that will test the reaction
    times of the House of Volkov''s team. I tied up this afternoon, as I still need
    to buy Ernest a new collar, so I was really hoping you could help. I have attached
    one of my private entries on the Explorer''s Encyclopedia. It contains sensitive
    information about the exhibition, so please don''t share it with anyone.


    Thank you again for your excellent help. Warmest wishes from bustling Moscow,
    Professor Harry Bairstone


