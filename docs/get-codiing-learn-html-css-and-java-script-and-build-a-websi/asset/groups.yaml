    \ your function looks like this:\n\n```\n<script>\nfunction save() {\n  var newItem\
    \ = document.getElementById(\"box\").value;\n  localStorage.box = newItem;\n}\n\
    function load() {\n  var savedDiv = document.getElementById(\"savedList\");\n\
