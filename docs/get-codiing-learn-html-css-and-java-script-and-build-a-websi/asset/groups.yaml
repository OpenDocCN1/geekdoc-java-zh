    # 使用 HTML 编码


    现在你已经阅读了任务简报（Mission Brief），是时候开始编码了。构建 Baistone 教授的网页，你首先需要编写 HTML（超文本标记语言）。HTML
    是程序员用于构建网站的编程语言。它允许你向浏览器下达指令。使用 HTML 在网页上添加文本和图像。你还用它将信息分组为行、段落或章节。


    HTML 网页被称为文档。它由 HTML 元素组成。元素是用小的代码标签创建的。标签总是成对出现，并包围页面上的每一部分内容（如文本或图像）。每个标签都包含一条给你浏览器的指令，告诉它如何在屏幕上显示该元素。这就是为什么
    HTML 被称为标记语言的原因。使用标签为每部分内容标记上给浏览器的指令。


    ## HTML 标签


    每个标签都由两个角括号（<）包围一段代码组成。角括号与键盘上的句号和逗号符号在同一个键上。让我们来看标签的示例：


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_23_0.png)


    ```

    <p>Professor Baistone and Dr. Day have discovered the Monk Diamond.</p>

    ```


    ```

    opening tag

    ```


    ```

    closing tag

    ```


    这是段落标签 `<p>` 。当标签成对出现时，我们将第一个标签称为起始标签，第二个标签称为结束标签。你可以识别出结束标签，因为它包含一个正斜杠（/）。当你的浏览器读取这段代码时，它理解你正在告诉它将起始和结束
    `<p>` 标签之间的文本分组为段落。


    要创建一个网页，你必须在文本编辑器中创建一个 HTML 文件。你的浏览器期望某些标签按特定的顺序出现。你需要先编写包含关于整个页面指令的标签。然后编写针对你页面上特定内容指令的标签。标签可以放置在其他标签内部。你只需要在完成每个标签的使用时记得关闭它即可。


    让我们来看编码一个非常简单的网页时所需的 HTML 标签。如果你使用这些标签，你将创建一个由标题和一些文本组成的网页。每个标签都为你的浏览器提供不同的信息：


    ### <!DOCTYPE html>


    这被称为 `<!DOCTYPE>` 声明，它始终是 HTML 文件的第一行。它告诉浏览器我们的网页是用哪个版本的 HTML 编码的。它不是 HTML 标签，所以它用大写字母编写，不需要结束标签。


    ### <html>


    这是 `<html>` 标签，它告诉浏览器我们使用了 HTML 来编码我们的页面。


    ### <head>


    这是 `<head>` 标签。里面是标题中不在主 `<body>` 标签中显示的内容。你也可以在这里放置你希望浏览器应用到整个页面的指令。


    ### <title>


    <The Monk Diamond Discovery</title>


    `<title>` 标签放在 `<head>` 标签内部。标签之间的内容不会出现在我们网页的主体中。当你在浏览器中打开页面时，它它是浏览器窗口的标题。


    ### <body>


    <p>Professor Baistone and Dr. Day have discovered the Monk Diamond.</p>


    你希望在网页中显示的内容放在 `<body>` 标签内部。当我们在网页浏览器中打开文件时，这段关于 Monk 钻石的文本将出现在我们的页面上。


    这是段落标签。起始和结束标签之间的所有文本都将被分组为段落。


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_24_0.png)


    > 翻页查看此代码在我们的网页浏览器屏幕上看起来什么样。


    当我们在文本编辑器中保存编写的代码并在网页浏览器中打开它时，我们的浏览器会解码我们的 HTML 文件并在屏幕上绘制出一个像这样的网页：


    The Monk diamond


    Professor Baistone and Dr. Day have discovered the Monk Diamond.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_25_0.png)


    ## 编写 HTML


    现在你已经知道 HTML 标签是什么以及它们如何工作，是时候尝试使用它们了。学习新代码的最佳方法是练习编写它们。在本书中，你会发现“代码技能”（Code Skills）。遵循练习中的分步骤说明，每次学习新技能。确保你的代码尽可能准确非常重要。一个字母或符号的错误或缺失都导致你的代码无法运行，因为你的浏览器无法理解你的指令。如果你在让程序运行遇到问题，检查以下内容是一个好主意：


    - 你没有遗漏任何标签或使用顺序错误

    - 你的代码中没有拼写错误或类型错误

    - 你在整个代码中都使用了正确的大小写

    - 你以正确的顺序包含了你需要的所有符号

    - 你使用了直引号而不是弯引号

    - 你已用正斜杠关闭了所有标签


    > 翻页查看此代码在我们的网页浏览器屏幕上看起来什么样。


