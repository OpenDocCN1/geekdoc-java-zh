    > 你注意到了吗？\n在编写 `localStorage` 关键字时，我们使用驼峰命名法。第一个字母小写，第二个单词用大写字母开头。\n\n## 使用 localStorage\
    \ 保存和加载\n\n现在你已经了解了 `localStorage`，让我们看看如何使用它来保存和加载 Bairstone 教授的应用。每当 Bairstone\
    \ 教授更改待办列表时，它都需要存储在 `localStorage` 中。我们还需要编写代码，当 Bairstone 教授在浏览器中打开它时，从 `localStorage`\
    \ 加载待办列表。让我们看看为了使用 `localStorage` 需要对 `<script>` 块进行哪些更改：\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>To-Do List App</title>\n<script>\nfunction addItem()\
    \ {\n  var newItem = document.createElement(\"div\");\n  newItem.innerHTML = document.getElementById(\"\
    box\").value;\n  newItem.onclick = removeItem;\n  document.getElementById(\"list\"\
    ).appendChild(newItem);\n  saveList();\n}\nfunction removeItem() {\n  document.getElementById(\"\
    list\").removeChild(this);\n  saveList();\n}\nfunction saveList() {\n  localStorage.storedList\
    \ = document.getElementById(\"list\").innerHTML;\n}\nfunction loadList() {\n \
    \ document.getElementById(\"list\").innerHTML = localStorage.storedList;\n}\n\
    </script>\n</head>\n<body>\n<p>Special Exhibition To-Do List</p>\n<input type=\"\
    text\" id=\"box\" value=\"Type here to add task\"/>\n<br/>\n<input type=\"button\"\
    \ value=\"Add item\" onclick=\"addItem();\"/>\n<div id=\"list\"></div>\n</body>\n\
    </html>\n```\n\n## 保存列表\n\n为了保存列表，我们需要创建一个新的 `savelist` 函数，使用 `localStorage` 将其保存。为了做到这一点，我们必须选择一个变量名来为我们想要存储在\
