    ## 3. 发现页面：discovery.html


    发现页面 (discovery.html) 是第三页，它将讲述 Bairstone 教授和 Day 博士是如何找到僧侣钻石（Monk Diamond）的。让我们创建一个与上一个页面布局略有不同的线框图，如下所示：


    ## 菜单栏

    - 这应该与钻石页面上的菜单栏相同。记得更新链接。


    ## 大图

    - 在你的 `<style>` 块中，创建一个 CSS 类，将 `width` 属性设置为 100%，将 `height` 设置为 200px，并将 `padding`
    设置为 0px。使用 `background` 和 `background-size` 属性添加图像。将此 CSS 类应用到 `<body>` 中的第二个
    `<div>` 中。


    ## 文本列

    - 创建 `<div>`，使用 `style` 属性将 `width` 设置为 80%，并将 `padding` 设置为 50px。添加你的文本，使用 `<p>`
    和 `<br/>` 标签将文本分为不同的部分。


    ## 图像列

    - 创建另一个 `<div>`，并使用 `style` 属性将 `width` CSS 属性设置为 20%。将此 `<div>` 浮动包含文本的 `<div>`
    右侧。

    - 在你的 `<div>` 内部添加图像。使用 `style` 属性的 `width`、`height` 和 `text-align` CSS 属性使其居中。


    ## 页脚

    - 使其与首页相同。


    当你完成页面编码后，将你的 HTML 文件保存到你的 `Coding` 文件夹中。将文件命名为 discovery.html。


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_202_0.png)


    ## 4. 展览页面：exhibition.html


    展览页面 (exhibition.html) 将包含关于 Volkov 庄展览的所有细节。由于它包含了重要信息，我们希望保持布局简单，以便信息易于查看和理解。让我们看看线框图：


    ## 菜单栏

    - 这应该与钻石页面和发现页面上的菜单栏相同。记得更新链接。


    ## 大图

    - 这也与钻石页面和发现页面相同。


    ## 文本

    - 为每个信息部分创建一个 `<div>`。

    - 你可以使用 `style` 属性并将 CSS `margin` 属性设置为 10px 来对文本缩进。


    ## 页脚

    - 使其与首页相同。


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_203_0.png)

    ![](img/fd182f6ecb2aea108dbd5523a70555aa_203_1.png)


    > 使用 `<div>` 标签来创建不同的布局非常有效！


    ## 文本 / 页脚

    当你完成页面编码后，将你的 HTML 文件保存到你的 `Coding` 文件夹中。将文件命名为 exhibition.html。


    ## 5. Volkov 庄页面：volkov.html


    在我们网站的最后一个页面 (volkov.html) 中，我们需要为 Volkov 庄提供指引，让人们知道在哪里找到它。我们应该提供地址，并像我们在任务 4
    中做的那样，使用 Google Maps Embed API 嵌入一张地图。让我们看看线框图：


    ## 菜单栏

    - 这应该与钻石页面、发现页面和展览页面上的菜单栏相同。记得更新链接。


    ## 大图

    - 这也与钻石页面、发现页面和展览页面相同。


    ## 文本列

    - 创建一个 `<div>`，使用 `style` 属性将 `width` 设置为 80%，并将 `padding` 设置为 50px。使用 `<p>` 和
    `<br/>` 标签将文本分为不同的部分。


    ## 地图列

    - 创建另一个 `<div>`，并使用 `style` 属性将 `width` CSS 属性设置为 20%。将此 `<div>` 浮动包含文本的 `<div>`
    右侧。

    - 添加一个 `<iframe>` 并设置 `width`、`height` 和 `border` 属性。添加一个指向 Google Maps Embed
    API 的 URL 的 `source` 属性。使用搜索 API 函数并嵌入一张显示莫斯科圣西里大教堂的地图。


    ## 页脚

    - 使其与首页相同。


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_204_0.png)


    当你完成页面编码后，将你的 HTML 文件保存到你的 `Coding` 文件夹中。将文件命名为 volkov.html。


    ## 你完成的网站


    现在你已经构建了五个网页，你最后需要做的是确保所有的链接都是正确的，并且你的页面是按照你计划的方式连接的。检查你每个网页上的菜单栏在每个链接中是否具有正确的文件名。如果链接不对，你的网站将无法工作，因为用户无法在页面之间导航。你每个链接的代码看起来如下：


    ```

    <a href="index.html">Home</a>

    <a href="diamond.html">The Diamond</a>

    <a href="discovery.html">Discovery</a>

    <a href="exhibition.html">Exhibition</a>

    ```

    '
