    在我们目前构建的每个页面中，`<title>` 标签都嵌套在 `<head>` 内部。当我们在网络浏览器中查看时，`<title>` 开启标签和结束标签之间的内容不会显示在主
    `<body>` 中。


    我们将 CSS 类 添加到 `<head>` 标签中。这是因为它是放置给浏览器的、不希望在页面主 `<body>` 中显示的信息的最佳位置。


    ## style 标签：<style></style>


    当我们使用 `<style>` 标签时，我们在内部定义 CSS 规则。我们将 `<style>` 标签放置在 HTML 文档的 `<head>` 内部。这允许我们将样式保留在一个地方，而不是放在每个单独的标签上。


