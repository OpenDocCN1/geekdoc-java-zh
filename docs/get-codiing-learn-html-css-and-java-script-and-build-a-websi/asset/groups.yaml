    # CODE SKILLS CREATING A HYPERLINK


    Creating hyperlinks is an important skill to master when building websites, as
    they let the user easily access pieces of content. Let''s create a web page with
    a hyperlink.


    +   1. Open up your text-editing program. Create a new HTML file called links.html.
    Type this code into your new file:


    +   2. Now choose the URL you want your hyperlink to connect. Set it as the value
    of your href attribute. Your code will look like this:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Links</title>

    </head>

    <body>

    </body>

    </html>

    ```


    ```

    <body>

    <a href="https://www.google.com">

    Click here</a>

    </body>

    ```


    +   3. Save your HTML file and open it in your web browser. You will see the text
    between <a> tags displayed on-screen. When you click the hyperlink text, your
    web browser will link to your URL.


    +   4. Let''s make our hyperlink. Add an anchor <a> tag with an empty href attribute
    to the <body> of your page. Your code will look like this:


    ```

    <body>

    <a href=""></a>

    </body>

    ```


    +   5. Choose a word or phrase to be the text for your hyperlink on your web page.
    Put it between your opening and closing <a> tags. Your code will look like this:


    ```

    <body>

    <a href=">Click here</a>

    </body>

    ```


