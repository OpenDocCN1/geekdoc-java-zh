    # ABOUT THIS BOOK


    Hello! We’re Young Rewired State, a worldwide community of digital makers age
    eighteen and under. We’ve made this book because we want you to become a technology
    star of the future. We hope that Get Coding! will not only teach you how to code
    but also show you how fun and exciting it can be.. Coding is one of the most important
    skills young people can learn, and there’s never been a better time to master
    it.


    # What does this book teach you?


    This book teaches you how to code using three essential programming languages:
    HTML, CSS, and JavaScript. A computer can be made to do almost anything, but first
    someone has to write a program for it to follow. Programs have to be written in
    languages a computer can understand. Coding is all about learning to write programs
    in these different languages.


    HTML, CSS, and JavaScript are three of the most important programming languages
    in the world. They are used by web developers to build the websites and web-based
    apps and games you use every day. This book will teach you how to write code and
    build programs using these programming languages. In this book you will learn
    real-coding skills you can use to do all kinds of programming.


    Find out more about Young Rewired State. www.yrs.io www.getcodingkids.com


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_8_0.png)


    # How does this book work?


    There are six chapters in this book. Each chapter contains a mission that will
    teach you new HTML, CSS, and JavaScript coding skills. Your job is to work through
    the chapters and use your skills to complete the missions. You will be joining
    Professor Bairstone, Dr. Day, and Ernest, who need your help to keep a valuable
    diamond safe.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_8_1.png)


    # What do you need?


    All you need is a computer (PC or Mac) that is connected to the Internet.


    > We hope you enjoy this book and that it inspires you to get coding!


    Tweet us: @youngrewired #GetCoding

    Also find us on YouTube, Facebook, and Instagram


    # INTRODUCTION

    ## COMPUTER CODING


    Computers are an important part of our lives today.

    We use them all the time to do many different things.

    You''ve probably used a laptop, desktop computer, or tablet before. But did you
    know that a smartphone is also a computer? And that there are computers inside
    ATMs, washing machines, game consoles, and cars? All these computers look different
    and work slightly differently, but all have one thing in common: they have to
    follow programs.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_9_0.png)


    # Perfect Programming


    Computers are electronic devices that process information. They are made up of
    hardware (the physical parts you can touch) and software (the parts you can''t).
    Computers need software because they cannot think or act by themselves. They have
    to follow sets of instructions called programs. Programs are written in languages
    computers can understand. Writing programs is therefore known as coding or programming.


    Apps you may have used:

    - Facebook

    - Google

    - iTunes

    - Microsoft Word

    - Minecraft

    - YouTube


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_9_1.png)


    You use programs every day. When you check your friend''s profile on Facebook,
    send a text, use a microwave, or play a game, you''re using programs. In fact,
    you can write a program to make a computer do anything. The people who write programs
    are called programmers or software developers. Programmers write code in different
    languages depending on the type of program they want to build.


    You may have already done some coding at school using programming languages like
    Scratch or Python. Scratch is made up of blocks of code that you drag and drop
    together to create programs. It''s great for making small games and animations.
    Python is a text-based programming language which means you can create programs
    by typing out each instruction. Programs like Instagram are written in Python.


    # Programming Languages


    There are many different programming languages you can code in. Computers can
    understand more than one programming language at a time, so programs are often
    written with several different languages. A programmer''s job is to pick the best
    languages for the program they are building, because different programming languages
    work better for different things. Every programming language has things it''s
    good and bad at. Some commonly used programming languages are listed below.


    - C and C++ are used to build operating systems for your computer.

    - C#, Java, PHP and Ruby are used to build websites.

    - C#, Java, and Objective-C are used to write apps for computers and smartphones.

    - SQL is used to extract information from databases.


    In this book you are going to learn how to write code using three programming
    languages: HTML, CSS, and JavaScript. With these programming languages, you are
    going to create programs that run on the Internet. You are going to create a website,
    app, game, and many other programs that will run in your web browser.


    > An APP (APPLICATION) is a type of computer program. Apps are usually programs
    that a user needs to perform specific tasks, like word processing or e-mailing.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_10_0.png)


    Look at all the different programming languages you can code in.

