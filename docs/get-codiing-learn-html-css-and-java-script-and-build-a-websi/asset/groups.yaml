  - '[PAGE 128]


    # SAVING YOUR TO-DO LIST ITEMS


    Professor Bairstone can now add and remove as many items as he needs to and from
    the list. You might have noticed if you refresh your page, your to-do list disappears.
    This is because so we''ve added or removed HTML elements from our screen. We haven''t
    saved the list or changed our HTML file. If we want our browser to save and remember
    our list, we need to use localStorage, a handy API that''s available in HTML5
    (the fifth version of HTML programming language).


    This API lets save information in your browser, even if your page is refreshed
    or closed, you can still access the data. Like the DOM, localStorage is a collection
    of functions, and it''s simple to use.


    All you have to do is tell your browser you want to use localStorage by typing
    the localStorage keyword (written in camelCase) and giving a name to the information
    you want to store. Set the value of the information you want using an equals sign
    (=) and double quotes (""), like this:


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_128_0.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_128_1.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_128_2.png)


    localStorage.storageName = "information";


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_128_3.png)


    If you want to remove a piece of information from localStorage, you just leave
    an empty value, like this:


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_128_4.png)


    localStorage.storageName = "";


    Viewing the information you save using localStorage is simple. All you have to
    do is use the keyword and the localStorage name, like this:


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_128_5.png)


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>The Monk Diamond</title>

    </head>

    <body>

    <script>

    localStorage.valuableDiamond = "The Monk Diamond";

    alert(localStorage.valuableDiamond);

    </script>

    </body>

    </html>

    ```


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_128_6.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_128_7.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_128_8.png)'
- md: "\n## CODE SKILLS USING THE LOCALSTORAGE API\n\nLet’s try using localStorage\
    \ to store information in our web browser. This way the list in Professor Bairstone’s\
    \ app will be safely stored.\n\n- 1. Open up your text-editing program. Create\
    \ a new HTML file called storage.html. Type this code into the `<body>` of your\
    \ new file:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Storage</title>\n\
    </head>\n<body>\n<input type=\"text\" id=\"box\" value=\"Type here to add task\"\
    /><br>\n<input type=\"button\" id=\"save\" value=\"Save\" onclick=\"save();\"\
    /><br>\n<input type=\"button\" id=\"load\" value=\"Load\" onclick=\"load();\"\
    /><br>\nSaved item: <div id=\"savedList\"></div>\n</body>\n</html>\n```\n\n- 2.\
    \ Now code a function in `<head>` that uses localStorage to save the value typed\
    \ into the text box in your browser. Don’t forget to use camelCase when you write\
    \ the localStorage keyword. Your code will look like this:\n\n```javascript\n\
    <script>\nfunction save() {\n  var newItem = document.getElementById(\"box\").value;\n\
    \  localStorage.box = newItem;\n}\n</script>\n```\n\n> Don't forget to use Google\
    \ Chrome or Mozilla Firefox for this exercise.\n\nNow code a second function in\
    \ your `<script>` block that uses the getElementById method to find your empty\
    \ `<div>`. Use innerHTML to set the value of the empty `<div>` to the information\
    \ you saved using localStorage. Make sure your function looks like this:\n\n```javascript\n\
    <script>\nfunction save() {\n  var newItem = document.getElementById(\"box\").value;\n\
    \  localStorage.box = newItem;\n}\nfunction load() {\n  var savedDiv = document.getElementById(\"\
    savedList\");\n  savedDiv.innerHTML = localStorage.box;\n}\n</script>\n```\n\n\
    - 4. Save your HTML file and open it in your browser. Type something into the\
    \ text box and click Save.\n\n- 5. Now click Load. The value you typed into the\
    \ text box will appear on-screen. Refresh your page. The item will disappear from\
    \ your screen. When you press Load, the text you saved using localStorage will\
    \ be loaded in your browser.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_130_0.png)\n\
    \n> Did you notice?\nWhen writing the localStorage keyword, we use camelCase.\
    \ The first letter is lowercase, and the second word starts with an uppercase\
    \ letter.\n\n## Saving and Loading Using localStorage\n\nNow that you know about\
    \ localStorage, let's look at how we can use it to save and load Professor Bairstone's\
    \ app. Every time Professor Bairstone changes the to-do list, it needs to be saved\
    \ in localStorage. We also need to write code that will load the to-do list from\
    \ localStorage when Professor Bairstone opens it in his browser. Let's look at\
    \ the changes we need to make to our `<script>` block to use localStorage like\
    \ this:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>To-Do List App</title>\n\
    <script>\nfunction addItem() {\n  var newItem = document.createElement(\"div\"\
    );\n  newItem.innerHTML = document.getElementById(\"box\").value;\n  newItem.onclick\
    \ = removeItem;\n  document.getElementById(\"list\").appendChild(newItem);\n \
    \ saveList();\n}\nfunction removeItem() {\n  document.getElementById(\"list\"\
    ).removeChild(this);\n  saveList();\n}\nfunction saveList() {\n  localStorage.storedList\
    \ = document.getElementById(\"list\").innerHTML;\n}\nfunction loadList() {\n \
    \ document.getElementById(\"list\").innerHTML = localStorage.storedList;\n}\n\
    </script>\n</head>\n<body>\n<p>Special Exhibition To-Do List</p>\n<input type=\"\
    text\" id=\"box\" value=\"Type here to add task\"/>\n<br/>\n<input type=\"button\"\
    \ value=\"Add item\" onclick=\"addItem();\"/>\n<div id=\"list\"></div>\n</body>\n\
    </html>\n```\n\n## Saving the List\n\nTo save the list, we need to create a new\
    \ savelist function that will save it using localStorage. To do this, we have\
    \ to choose a variable name to assign the information we want to store in localStorage.\
    \ We then use getElementById to find the `<div>` in the `<body>` of the page.\
    \ Finally, we use innerHTML to get the contents of the `<div>`. Everything in\
    \ our `<div>` will now be saved in localStorage.\n\nWe want to save our list every\
    \ time an item is added or removed, so we also need to make sure the additem and\
    \ removelt functions call the savelist function after they have run.\n\n## Loading\
    \ the List\n\nTo load the list, we need to create a second function. \"list\"\
    . Whenever the loadlist function is called, it will set the innerHTML of the `<div>`\
    \ with the id=\"\" to whatever has been saved in localStorage.\n\nWe need to call\
    \ our loadlist function so that when our browser finishes loading, it loads our\
    \ list too. To make sure we don't try to load a list that hasn't been saved, we\
    \ have to use an if statement before we try to use localStorage. The statement\
    \ we need looks like this:\n\n```html\n<div id=\"list\"></div>\n<script>\n  if(localStorage.storedList)\
    \ {\n    loadList();\n  }\n</script>\n```\n\nThe statement checks whether there\
    \ is a list saved in localStorage before trying to load it. When we save our complete\
    \ code block and run our app in our browser, items we add to the list are now\
    \ saved even if we close and then reopen our file.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_132_0.png)\n\
    \n| Special Exhibition To-Do List |\n| :--- |\n| Invite guests |\n| Add item |\n\
    | Glass display case |\n| Velvet cushion |\n| Hire private security |\n\n## Removing\
    \ Items from localStorage\n\nThere's just one more thing we have to do to make\
    \ our list work properly. At the moment, when you use the to-do list app, you'll\
    \ be able to add or remove an item by clicking on it. But if you load your saved\
    \ list from localStorage, you won't be able to remove an item when you click on\
    \ it.\n\nThis is because we're only saving the HTML elements into localStorage,\
    \ not the onclick attribute that we add when each element is created. We need\
    \ to add the onclick attribute back to each of our list items, so that the removeitem\
    \ still works after we load. We need to add the onclick attribute to each new\
    \ item in loadList so it looks like this:\n\n```javascript\nfunction loadList()\
    \ {\n  document.getElementById(\"list\").innerHTML = localStorage.storedList;\n\
    \  for(var i = 0; i < list.children.length; i++) {\n    list.children[i].onclick\
    \ = removeItem;\n  }\n}\n```\n\nWe've now added a loop to loadList that sets the\
    \ onclick attribute for each new item. We will learn more about loops in Mission\
    \ 5, but for now you should know that loops are split into three parts:\n\n> A\
    \ loop is a special piece of JavaScript that runs again and again. Programmers\
    \ use loops so they don't have to type the same code over and over.\n\n- The code\
    \ that starts the loop\n- The condition to check whether the loop runs\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_133_0.png)\n\
    \n## DO-ITSELF TASK BUILD A TO-DO LIST APP\n\nNow use all the skills you’ve learned\
    \ in this mission to build the to-do list Professor Bairstone needs for the special\
    \ exhibition. Use JavaScript with the DOM and localStorage to make a to-do list\
    \ that Professor Bairstone can add items to. Make sure when he completes a task,\
    \ he can click on the item to remove it from the list.\n\n## The To-Do App Brief\n\
    \nWhen you code your app, use HTML and JavaScript. Make sure you include these:\n\
    \n- A function that adds an item to the list using the DOM\n- A function that\
    \ removes an item from the list using the DOM\n- A function that saves the list\
    \ using localStorage\n- A function that loads the list using localStorage\n- A\
    \ text box the user can type the items into\n- A button the user can click to\
    \ add an item to the list\n\nSave your file in your Coding folder and call it\
    \ listapp.html.\n\n> Turn the page to see the entire code block you need for your\
    \ app!\n\n> Don't forget to use the Get Coding! website if you need help.\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>To-Do List App</title>\n<script>\n\
    function addItem() {\n  var newItem = document.createElement(\"div\");\n  newItem.innerHTML\
    \ = document.getElementById(\"box\").value;\n  newItem.onclick = removeItem;\n\
    \  document.getElementById(\"list\").appendChild(newItem);\n  saveList();\n}\n\
    function removeItem() {\n  document.getElementById(\"list\").removeChild(this);\n\
    \  saveList();\n}\nfunction saveList() {\n  localStorage.storedList = document.getElementById(\"\
    list\").innerHTML;\n}\nfunction loadList() {\n  document.getElementById(\"list\"\
    ).innerHTML = localStorage.storedList;\n  for(var i = 0; i < list.children.length;\
    \ i++) {\n    list.children[i].onclick = removeItem;\n  }\n}\n</script>\n</head>\n\
    <body>\n<p>Special Exhibition To-Do List</p>\n<input type=\"text\" id=\"box\"\
    \ value=\"Type here to add task\"/>\n<br/>\n<input type=\"button\" value=\"Add\
    \ item\" onclick=\"addItem();\"/>\n<div id=\"list\"></div>\n</body>\n</html>\n\
    ```\n"
  mdcn: "\n\n## 使用 LOCALSTORAGE API 的代码技能\n\n让我们尝试使用 `localStorage` 在我们的网络浏览器中存储信息。这样，Bairstone\
    \ 教授应用中的列表将被安全地存储起来。\n\n- 1. 打开你的文本编辑器。创建一个名为 `storage.html` 的新 HTML 文件。在新文件中\
