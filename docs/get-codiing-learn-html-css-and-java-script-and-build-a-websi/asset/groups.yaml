- md: "\n# CREATE A PASSWORD\n\n- LEARN TO USE HYPERLINKS TO CONNECT WEB PAGES\n-\
    \ LEARN WHAT JAVASCRIPT IS AND HOW IT WORKS\n- WRITE PROGRAMS IN JAVASCRIPT THAT\
    \ RUN IN YOUR WEB BROWSER\n- PROTECT A WEB PAGE BY USING JAVASCRIPT TO CREATE\
    \ A PASSWORD\n\n# Mission Brief\n\nDear Coder,\n\nI'm Dr. Ruby Day, the scientist\
    \ on the expedition with Professor Baistone. We were hoping to discover dinosaur\
    \ fossils. Instead we found the stolen Monk Diamond!\n\nI want to tell you about\
    \ a strange event. Yesterday we were examining the cave where we found the diamond.\
    \ I heard a rumbling noise, and Ernest started barking frantically. We looked\
    \ up and saw a massive boulder rolling over the edge of the cliff above the cave!\
    \ We jumped out of the way just in time, as the boulder landed exactly where we\
    \ were standing. In the commotion, Professor Baistone tripped and sprained his\
    \ ankle.\n\nProfessor Baistone and I agree that the boulder falling is very suspicious.\
    \ It seems too much of a coincidence for it to have happened just after we discovered\
    \ a valuable stolen diamond. Professor Baistone is convinced that the thieves\
    \ have found out exactly about our expedition and are trying to scare us off.\
    \ He thinks the boulder is exactly the kind of tricky trick that the Bond Brothers,\
    \ the main suspects in the Monk Diamond heist, would try.\n\nWe would leave the\
    \ mountains now to take the diamond to safety, but unfortunately Professor Baistone's\
    \ sprained ankle means he can't make the treacherous descent just yet. While we\
    \ are stuck in the mountains, I think the news about the diamond needs to remain\
    \ top secret. I am worried that the web page built for Professor Baistone could\
    \ be accessed by the Bond Brothers and our safety compromised. Please could you\
    \ add a password to the web page so that for now only Professor Baistone and I\
    \ can view the page? Use Ernest300 as the password.\n\nThank you for all your\
    \ help and hard work.\n\nVery best wishes from the dangerous mountains,\nRuby\
    \ Day\n\nP.S. Prof. B. has asked me to send you this entry from the Explorer's\
    \ Encyclopedia.\n\n# The Bond Brothers\n\nFrom the Explorer's Encyclopedia: The\
    \ Guide to Every Adventure\n\n> This entry is about the Bond Brothers. For more\
    \ information about jewel robberies, see Jewel Thefts.\n\nThe **Bond Brothers**\
    \ are a top-secret international gang of jewel thieves. According to Interpol,\
    \ over the last fifteen years they have stolen gems a total of more than $500\
    \ million.\n\nThe gang's tactics are similar to those used by the famous gang\
    \ the Pink Panthers.\n\n- Home page\n- Contents\n- Featured discoveries\n- Famous\
    \ explorers\n- Historical expeditions\n\n# WANTED FOR THE THEFT OF THE MONK DIAMOND\n\
    ## THE BOND BROTHERS\n\n## REWARD OF $1 MILLION\n### FOR INFORMATION LEADING TO\
    \ THE RECOVERY OF THE MONK DIAMOND OR ARREST OF THE GANG\n\nThe Bond Brothers\
    \ typically target exclusive jewelry stores all over the world. Their raids are\
    \ exceptionally well planned, with the targets scoped out weeks in advance.\n\n\
    The Bond Brothers’ tactics have included driving trucks through jewelry-store\
    \ windows and drilling through store basements to access valuables kept in vaults.\
    \ Members of the gang have disguised themselves as workers to confuse staff and\
    \ then smashed open display cases.\n\nAlthough the police were unable to prove\
    \ it, most people think that the Bond Brothers are responsible for the unsolved\
    \ theft of the Monk Diamond from the House of Volkov jewelry store in Moscow.\
    \ Two members of the gang (a man and a woman) pretended to be looking for an engagement\
    \ ring. While the woman distracted the staff, the man smashed the Monk Diamond’s\
    \ display case with a pickax. The two then fled in a getaway car, which was posing\
    \ as a taxi.\n\nAll the CCTV in and around the House of Volkov had been disabled\
    \ for the hour in which the crime took place. Interpol therefore believes that\
    \ one of the gang is also skilled in cybercrime.\n\n# USING HYPERLINKS\n\nIn the\
    \ Mission Brief, Dr. Day asked you to create a password. The password will keep\
    \ the Bond Brothers from finding out the discovery of the Monk Diamond. In this\
    \ mission, you are going to learn how to make the password.\n\nHyperlinks (or\
    \ links, as they are normally known) are found on most web pages and are essential\
    \ for creating the groups of web pages we call websites. A hyperlink can be a\
    \ word, number, phrase, or image that you click on. When you click on the link,\
    \ your web browser takes you to either a different place in your current web page\
    \ or a completely new web page.\n\nWe have to use a new programming language called\
    \ JavaScript to make the password. But before we first need to learn how to use\
    \ HTML to link two web pages.\n\n# The Anchor Tag: `<a>` and `</a>`\n\nHyperlinks\
    \ are made using an HTML tag called the anchor `<a>` tag. The opening tag is `<a>`\
    \ and the closing tag is `</a>`. Inside the opening `<a>` tag you have to include\
    \ an `href` attribute. The `href` attribute contains the URL (or web address)\
    \ your browser needs to link to the new web page. Let's take a look:\n\n| anchor\
    \ tag | href attribute | URL | hyperlink text |\n| :--- | :--- | :--- | :--- |\n\
    | `<a` | `href=` | `https://www.monkdiamonddiscovery.com` | Diamond Discovery\
    \ |\n\n```html\n<a href=\"https://www.monkdiamonddiscovery.com\">Diamond Discovery</a>\n\
    ```\n\nWe've set the value of our `href` attribute to the URL for the Monk Diamond\
    \ Discovery page. We've done this in exactly the same way as we set the values\
    \ of all the attributes in Mission 1: by using the equals sign (=) and double\
    \ quotes (\"\") to enclose it. The text between the opening and closing `<a>`\
    \ tags becomes your link. When you click on this text, you will be taken to the\
    \ Monk Diamond page.\n\n# CODE SKILLS: CREATING A HYPERLINK\n\nCreating hyperlinks\
    \ is an important skill when building websites.\n\n1. Open a new HTML file called\
    \ `links.html`.\n2. Add an `<a>` tag with an empty `href` attribute:\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <title>Links</title>\n</head>\n<body>\n  <a\
    \ href=\"\"></a>\n</body>\n</html>\n```\n3. Choose a word or phrase to be the\
    \ text for your hyperlink.\n4. Put the URL in the `href` attribute:\n```html\n\
    <body>\n  <a href=\"#\">Click here</a>\n</body>\n```\n\n# Linking Web Pages\n\n\
    To protect the information about the Monk Diamond, we first need to make a new\
    \ page. This new web page will be the first the user sees. If the user gets the\
    \ password correct, they will be sent to the Monk Diamond web page. If they get\
    \ the password wrong, nothing will happen. By linking our pages, we create a website.\n\
    \nIf your pages are saved in the same place on your computer, you don't need to\
    \ provide your web browser with the URL – you can just use the file name as the\
    \ URL.\n\n```html\n<a href=\"filename.html\">Web page name\n```\n\n# Page 1: password.html\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Password</title>\n</head>\n\
    <body>\n  <a href=\"monkdiamonddiscovery.html\">Click here to visit the Monk Diamond\
    \ web page</a>\n</body>\n</html>\n```\n\n# Page 2: monkdiamonddiscovery.html\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>The Monk Diamond</title>\n\
    </head>\n<body>\n  <a href=\"password.html\">Click here to log out</a>\n</body>\n\
    </html>\n```\n"
  mdcn: "\n\n# 创建密码\n\n- 学习使用超链接连接网页\n- 学习什么是 JavaScript 以及它是如何工作的\n- 编写可在你的网页浏览器中运行的\
    \ JavaScript 程序\n- 通过使用 JavaScript 创建密码来保护网页\n\n# 任务简报\n\n亲爱的程序员：\n\n我是鲁比·戴（Ruby\
    \ Day）博士，与瑞士（Baistone）教授一同探险的科学家。我们本希望发现恐龙化石，结果却发现了被盗的僧侣钻石（Monk Diamond）！\n\n\
    我想告诉你们一件奇怪的事情。昨天我们正在检查发现钻石的洞穴。我听到了隆隆声，埃内斯特（Ernest）开始疯狂地吠叫。我们抬头一看，发现巨大的巨石从洞穴上方悬崖边缘滚了落！我们及时避开了，巨石恰好落在我们刚才站立的地方。在混乱中，贝斯通教授绊倒并扭了脚踝。\n\
    \n贝斯通教授和我认为巨石的掉落非常可疑。在我们刚刚发现一颗珍贵的被盗钻石后发生这种事，似乎太太巧合了。贝斯通教授深信小偷们已经完全掌握了我们的探险情报，并正试图吓走我们。他认为巨石正是僧侣钻石盗窃案主要嫌疑人——邦德兄弟（Bond\
    \ Brothers）会使用的诡计。\n\n我们本可以离开大山将钻石带到安全的地方，但遗憾的是，贝斯通教授脚踝扭伤意味着他还无法完成危险的下山行程。在我们困在山上的期间，我认为关于钻石的消息必须保持最高机密。我担心为贝斯通教授建立的网页可能会被邦德兄弟访问，导致我们的安全受到威胁。请你为网页添加一个密码，以便目前只有贝斯通教授和我可以查看该页面？请使用\
    \ `Ernest300` 作为密码。\n\n感谢你所有的帮助和努力。\n\n从危险的大山送上最好的祝愿，\n鲁比·戴\n\n附：：B教授让我向你发送了这条来自《探险家百科全书》的条目。\n\
    \n# 邦德兄弟\n\n来自《探险家百科全书：冒险指南》\n\n> 本条目关于邦德兄弟。有关珠宝盗窃的更多信息，请参阅“珠宝盗窃”（Jewel Thefts）。\n\
    \n**邦德兄弟**是一个顶秘密国际珠宝盗窃团。根据国际刑警组织的数据，在过去的十五年里，他们盗取的宝石总价值超过了5亿美元。\n\n该团的战术与著名的“粉红豹”（Pink\
    \ Panthers）团使用的类似。\n\n- 首页\n- 目录\n- 特色发现\n- 著名探险家\n- 历史探险\n\n# 盗窃僧侣钻石者通缉\n## 邦德兄弟\n\
    \n## 100万美元赏金\n### 凡提供导致寻回僧侣钻石或逮捕该团的情报\n\n邦德兄弟通常针对世界各地的奢侈珠宝店。他们的袭击计划极其周密，目标在几周前就已侦察。\n\
    \n邦德兄弟的战术包括开车卡车冲进珠宝店窗户，以及钻穿商店地下室以获取保险库里的贵重物品。团员会伪装成工人以扰乱工作人员，然后砸碎展示柜。\n\n尽管警方无法证明这一点，但大多数人认为，邦德兄弟对莫斯科沃尔尔科夫之家（House\
    \ of Volkov）珠宝店僧侣钻石的未解盗窃案负责。该团的两名成员（一男一女）假装在寻找订婚戒指。当那个女性分散工作人员注意力时，那个男子用镐砸碎了僧侣钻石的展示柜。随后他们乘坐一辆伪装成出租车的汽车逃离了。\n\
    \n沃尔尔科夫之家及周围所有的监控摄像头在犯罪发生的一个小时内都被禁用了。因此，国际刑警组织认为，该团其中一名成员也精通网络犯罪。\n\n# 使用超链接\n\
    \n在任务简报中，戴博士要求你创建一个密码。这个密码将防止邦德兄弟发现僧侣钻石的发现。在这次任务中，你将学习如何制作密码。\n\n超链接（通常称为链接）存在于大多数网页上，对于创建我们称之为网站的网页组至关重要。超链接可以是一个你点击的单词、数字、短语或图像。当你点击链接时，你的网页浏览器会将你带到当前网页的另一个地方或一个全新的网页。\n\
    \n我们必须使用一种名为 JavaScript 的新编程语言来制作密码。但在之前，我们需要先学习如何使用 HTML 连接两个网页。\n\n# 锚点标签：`<a>`\
    \ 和 `</a>`\n\n超链接是使用称为锚点的 `<a>` 标签的 HTML 标签制作的。起始标签为 `<a>`，结束标签为 `</a>`。在起始 `<a>`\
    \ 标签内部，你必须包含一个 `href` 属性。`href` 属性包含浏览器链接到新网页所需的 URL（或网络地址）。让我们来看：\n\n| 锚点标签 |\
    \ href 属性 | URL | 链接文本 |\n| :--- | :--- | :--- | :--- |\n| `<a` | `href=` | `https://www.monkdiamonddiscovery.com`\
    \ | 钻石发现 |\n\n```html\n<a href=\"https://www.monkdiamonddiscovery.com\">Diamond\
    \ Discovery</</a>\n```\n\n我们将 `href` 属性的值设置为僧侣钻石发现页的 URL。我们设置此值的方式与在任务 1 中设置所有属性值的方式完全相同：通过使用等号（=）和双引号（\"\
    \"）将其括起来。起始和结束 `<a>` 标签之间的文本就成了你的链接。当你点击这段文本时，你就进入了链接。\n\n# 代码技能：创建链接\n\n创建链接是一项重要的技能。\n\
    \n1. 打开名为 `links.html` 的新 HTML 文件。\n2. 添加带有空 `href` 属性的 `<a>` 标签：\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <title>链接</title>\n</head>\n<body>\n  <a href=\"\"\
    ></a>\n</body>\n</html>\n```\n3. 选择一个单词或短语作为链接的文本。\n4. 将 URL 放入 `href` 属性中：\n\
    ```html\n<body>\n  <a href=\"#\">点击这里</a>\n</body>\n```\n\n# 连接网页\n\n为了保护僧侣钻石的信息，我们首先需要创建一个页面。这个新网页将是用户看到的第一个。如果用户密码正确，他们将被发送到僧侣钻石网页。如果密码错误，什么都不会发生。通过链接我们的页面，我们创建了一个网站。\n\
    \n如果你的页面保存在计算机的同一个位置，你不需要为网页浏览器提供 URL ——只需使用文件名作为 URL 即可。\n\n```html\n<a href=\"\
    filename.html\">网页名称\n```\n\n# 第1页：password.html\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n  <title>密码</title>\n</head>\n<body>\n  <a href=\"monkdiamonddiscovery.html\"\
    >点击这里访问僧侣钻石网页</a>\n</body>\n</html>\n```\n\n# 第2页：monkdiamonddiscovery.html\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>僧侣钻石</title>\n</head>\n<body>\n\
    \  <a href=\"password.html\">点击这里退出</a>\n</body>\n</html>\n```\n\n"
