    \ `methods.html` 的新 HTML 文件。在你的 `<body>` 中使用 `<input>` 标签创建一个按钮。同时创建一个空的 `<div>`，如下所示：\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Methods</title>\n</head>\n\
