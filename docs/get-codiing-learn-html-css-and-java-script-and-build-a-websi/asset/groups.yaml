  - '[PAGE 28]


    # The Line Break Tag: <br/>


    The line break <br/> tag lets you start your text on a new line, but without starting
    a new paragraph. The line break tag is a self-closing HTML tag. Because there
    is no content to display on-screen, the line break tag is a single tag. In this
    example, we''ve used both the <p> tag and <br/> tag to change the way text displays:


    ```

    <body>

    <p>Professor Bairstone and Dr. Day have made a sensational discovery.<br/>

    Professor Bairstone is the world’s leading explorer.<br/>

    Dr. Day is a scientist who studies fossils.</p>

    <p>They have discovered the Monk Diamond in a remote cave in Siberia.</p>

    </body>

    ```


    A SELF-CLOSING HTML tag is an opening and closing tag rolled into one. Only some
    kinds of tag are used this way.

    You can spot a self-closing tag because of the forward slash (/) comes at the
    end of the tag, rather than at the beginning as it does for a regular closing
    tag.


    Professor Bairstone and Dr. Day have made a sensational discovery.

    Professor Bairstone is the world’s leading explorer.

    Dr. Day is a scientist who studies fossils.


    They have discovered the Monk Diamond in a remote cave in Siberia.'
