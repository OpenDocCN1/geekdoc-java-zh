    </body>\n</html>\n```\n\n- 2. 现在在你的 `<head>` 中创建一个 JavaScript 函数，该函数使用 `getElementById`\
    \ 方法找到你的 `<div>`。然后使用 `innerHTML` 将你空 `<div>` 的内容设置为某些文本，如下所示：\n\n```javascript\n\
    <script>\nfunction addItem() {\n  document.getElementById(\"container\").innerHTML\
