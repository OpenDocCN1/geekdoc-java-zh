  - '[PAGE 90]


    # The input Tag: <input/>


    Websites often need you to type in information. It''s how you log in to an online
    account, buy movie tickets, or use a search engine. So asking your user to type
    in information is a common part of coding. It''s called asking for user input.


    There are lots of tags you can use for user input, but the one you will use the
    most is the <input/> tag. It''s great for creating boxes on your page so your
    user can enter data. It''s a self-closing tag, and you include two attributes
    inside it: the id attribute and the type attribute. As you already know, you set
    the value of these attributes using the equals sign (=) and double quotes (").
    Let''s take a look at how we use the <input/> tag on our page:


    ```

    <body>

    <p style="font-size:30pt;">THE MONK DIAMOND DISCOVERY</p>

    <p>Please enter the password to view this website.</p>

    <p>Password:<input id="passwordBox" type="text"></p>

    <a href="monkdiamonddiscovery.html">

    Click here to submit password and view website

    </a>

    </body>

    ```


    Using the <input/> tag with these two attributes creates a box that we can type
    our password into.


    You use the id attribute to give your <input/> tag a unique name. You have to
    choose the name of your id attribute. Make sure it''s easy to remember. Here,
    we''ve set the value of the id attribute to "passwordBox".


    Doing this allows us to use the value inside the <input/> tag in our JavaScript.
    We use the id attribute to tell our browser exactly which piece of data we want
    to use. Without the id attribute, your browser will not be able to find the password
    and check whether the password is correct.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_90_0.png)'
- md: "\n## The type Attribute\n\nThere are lots of different kinds of <input/> tags,\
    \ so you need to use the type attribute to tell your browser exactly what sort\
    \ of <input/> tag you need. You have to choose from defined values for your type\
    \ attribute. Here are many of the common type attributes you can use inside your\
    \ <input/> tag:\n\n| Attribute value | What does it do? |\n| --- | --- |\n| text\
    \ | Creates a box for entering text |\n| password | Creates a box for entering\
    \ a password |\n| button | Creates a clickable button (with JavaScript) |\n| checkbox\
    \ | Creates a box the user can tick or untick |\n\nYou may have noticed on the\
    \ previous page when we set the type attribute to text, the text for the password\
    \ was displayed in the box. That isn't very secure! What happens if the Bond Brothers\
    \ are nearby when Day types in the password? If we want to keep our password secret,\
    \ we can change the value of our type attribute to password. This will hide the\
    \ user types by changing the text to dots. Let's take a look:\n\n```html\n<body>\n\
    <p style=\"font-size: 30pt;\">THE MONK DIAMOND DISCOVERY</p>\n<p>Please enter\
    \ the password to view this website.</p>\n<p>Password: <input id=\"passwordBox\"\
    \ type=\"password\"/></p>\n<a href=\"monkondiamondiscovery.html\">\nClick here\
    \ to submit password and view website\n</a>\n</body>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_91_0.png)\n\
    \n# THE MONK DIAMOND DISCOVERY\n\nPlease enter the password to view this website.\n\
    \nPassword: *********\n\nClick here to submit password and view website\n\n##\
    \ Using JavaScript to check the Password\n\nNow that we've built the basic HTML\
    \ structure of our page, we need to write some JavaScript that will check the\
    \ password the user enters is correct. If they enter the password Ernest300, they\
    \ will be taken to the Monk Diamond Discovery page. If they enter an incorrect\
    \ password, an alert will pop up telling them they have gotten the password wrong.\n\
    \nThe first thing we need to do is create a function that will contain all the\
    \ code we need to check our password. Let's create the function inside our `<head>`.\
    \ You can put JavaScript anywhere in an HTML web page, and having it in our `<head>`\
    \ in this example makes our code easier to understand. Don't forget to put your\
    \ JavaScript inside the `<script>` tag, like this:\n\n```javascript\n<script>\n\
    function checkPassword() {\n  var password = document.getElementById(\"passwordBox\"\
    );\n  var passwordText = password.value;\n}\n</script>\n```\n\nWe then need to\
    \ create variables to store the value of our password, so that function can check\
    \ whether the user has the correct. Let's look at the two variables we need:\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_92_0.png)\n\nIn our first variable,\
    \ we are using a new built-in function called getElementById. You will learn all\
    \ about this function and use it more in Mission 3. It is a handy function that\
    \ finds the HTML element with the specified id attribute. The id attribute we\
    \ have selected here is our `<input/>` tag. The value of our variable will be\
    \ whatever data the user has typed into the password box.\n\nWe then create a\
    \ second variable to store the data that the user has typed into the password\
    \ box. We create this by typing the name of our first variable followed by a dot\
    \ (.) and then the value key. We do this so we can write an if statement using\
    \ the value of this variable.\n\nWe now need to create an if statement. If the\
    \ condition of our second variable is true and our password text is equal to (=\
    \ Ernest300), the hyperlink will work. If the condition of our variable is false\
    \ and the password text is not equal to Ernest300, the link won't work and an\
    \ alert will pop up. We don't need to use an else statement because the return\
    \ statement will halt the function.\n\nOur complete <script> block for our password\
    \ with the new if statement looks like this:\n\n```javascript\n<script>\nfunction\
    \ checkPassword() {\n    var password = document.getElementById(\"passwordBox\"\
    );\n    var passwordText = password.value;\n    if(passwordText == \"Ernest300\"\
    ) {\n        return true;\n    }\n    alert(\"Access denied! Incorrect password!\"\
    );\n    return false;\n}\n</script>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_93_0.png)\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_93_1.png)\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_93_2.png)\n\
    \nFinally, we have to make our JavaScript work with our HTML elements. We need\
    \ to look at the code in the <body> of our page now. We want to call the checkPassword\
    \ function when someone clicks on the hyperlink in our page. So we need to add\
    \ an onclick attribute to our opening <a> tag, like this:\n\n```html\n<body>\n\
    <p style=\"font-size: 30pt;\">THE MONK DIAMOND DISCOVERY</p>\n<p>Please enter\
    \ the password to view this website.</p>\n<p>Password: <input id=\"passwordBox\"\
    \ type=\"password\"/></p>\n<a href=\"monkondiamondiscovery.html\" onclick=\"return\
    \ checkPassword();\">\nClick here to submit password and view website\n</a>\n\
    </body>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_93_0.png)\n"
  mdcn: "\n\n## type 属性\n\n有很多种不同的 `<input/>` 标签，因此你需要使用 `type` 属性告诉浏览器你确切需要哪种 `<input/>`\
    \ 标签。你必须从 `type` 属性的定义值中选择。以下是可以在 `<input/>` 标签内部使用的常用 `type` 属性：\n\n| 属性值 | 作用\
    \ |\n| --- | --- |\n| text | 创建一个输入文本的框 |\n| password | 创建一个输入密码的框 |\n| button\
    \ | 创建一个可点击的按钮（配合 JavaScript） |\n| checkbox | 创建一个用户可以勾选或取消勾的框 |\n\n你可能在上一页注意到，当我们将\
    \ `type` 属性设置为 `text` 时，密码会显示在框中。这并不安全！如果 Day 输入密码时，邦德兄弟在附近会发生什么？如果我们想保持密码秘密，可以将\
    \ `type` 属性的值更改为 `password`。这将通过将文本更改为点来隐藏用户输入的内容。让我们来看：\n\n```html\n<body>\n\
    <p style=\"font-size: 30pt;\">THE MONK DIAMOND DISCOVERY</p>\n<p>Please enter\
    \ the password to view this website.</p>\n<p>Password: <input id=\"passwordBox\"\
    \ type=\"password\"/></p>\n<a href=\"monkondiamondiscovery.html\">\nClick here\
    \ to submit password and view website\n</a>\n</body>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_91_0.png)\n\
    \n# 僧侣钻石的发现\n\n请输入密码以查看此网站。\n\n密码：*********\n\n点击此处提交密码并查看网站\n\n## 使用 JavaScript\
    \ 检查密码\n\n现在我们已经构建了页面的基础 HTML 结构，我们需要编写一些 JavaScript 来检查用户输入的密码是否正确。如果他们输入密码 `Ernest300`，他们将带到“僧侣钻石的发现”页面。如果他们输入了错误的密码，会弹出一个警告框告诉他们密码错误。\n\
    \n我们需要做的第一件事是创建一个函数，其中包含检查密码所需的所有代码。让我们在 `<head>` 内部创建该函数。你可以将 JavaScript 放在 HTML\
    \ 网页的任何地方，在这个示例中，将其放在 `<head>` 中使我们的代码更易理解。不要忘记将 JavaScript 放在 `<script>` 标签内，如下：\n\
    \n```javascript\n<script>\nfunction checkPassword() {\n  var password = document.getElementById(\"\
    passwordBox\");\n  var passwordText = password.value;\n}\n</script>\n```\n\n然后，我们需要创建变量来存储密码的值，以便函数可以检查用户是否正确。让我们来看需要的两个变量：\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_92_0.png)\n\n在第一个变量中，我们使用了一个名为 `getElementById`\
    \ 的新内置函数。你将在任务 3 中学习关于该函数的知识并更多地使用它。这是一个方便函数，可以找到具有指定 `id` 属性的 HTML 元素。我们在这里选择的\
    \ `id` 属性是 `<input/>` 标签。变量的值将是用户在密码框中输入的任何数据。\n\n然后我们创建第二个变量来存储用户在密码框中输入的数据。我们通过输入第一个变量的名字后加上点（`.`）以及\
    \ `value` 键来实现。这样做是为了可以使用该变量的值来编写 `if` 语句。\n\n我们现在需要创建一个 `if` 语句。如果第二个变量的条件为 `true`\
    \ 且我们的密码文本等于 `Ernest300`，超链接将生效。如果变量的条件为 `false` 且密码文本不等于 `Ernest300`，链接失效并弹出警告。我们不需要使用\
    \ `else` 语句，因为 `return` 语句会停止函数的执行。\n\n带有新的 `if` 语句的完整密码 `<script>` 块如下：\n\n```javascript\n\
    <script>\nfunction checkPassword() {\n    var password = document.getElementById(\"\
    passwordBox\");\n    var passwordText = password.value;\n    if(passwordText ==\
    \ \"Ernest300\") {\n        return true;\n    }\n    alert(\"Access denied! Incorrect\
    \ password!\");\n    return false;\n}\n</script>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_93_0.png)\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_93_1.png)\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_93_2.png)\n\
    \n最后，我们必须让 JavaScript 与我们的 HTML 元素配合。我们现在需要查看页面 `<body>` 中的代码。我们希望在有人点击页面上的超链接时调用\
    \ `checkPassword` 函数。因此，我们需要为起始的 `<a>` 标签添加一个 `onclick` 属性，如下：\n\n```html\n<body>\n\
    <p style=\"font-size: 30pt;\">THE MONK DIAMOND DISCOVERY</p>\n<p>Please enter\
    \ the password to view this website.</p>\n<p>Password: <input id=\"passwordBox\"\
    \ type=\"password\"/></p>\n<a href=\"monkondiamondiscovery.html\" onclick=\"return\
    \ checkPassword();\">\nClick here to submit password and view website\n</a>\n\
    </body>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_93_0.png)\n\n"
