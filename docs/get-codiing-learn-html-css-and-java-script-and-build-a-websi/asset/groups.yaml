    # code skills checklist


    # WRITING JAVASCRIPT


    +   - JavaScript always has to be written inside the <script> tag, so that your
    browser knows you are switching from HTML to a new programming language. You can
    put <script> tags in the <head> or <body> of your page.


    +   - Just like HTML and CSS, JavaScript is written in a special way and has its
    own syntax. It is a case-sensitive language. You should leave spaces between pieces
    of code to make them easier to read.


    +   - Each instruction you give your browser in JavaScript is called a statement.
    Statements have to end in a semicolon (;). Braces { } are used to group statements
    into a block of code to be run all at once by your browser.


    +   - Statements normally start with a keyword that tells you the action the statement
    will perform.


    +   - You can store information in your browser using variables. Variables have
    a name and a value, which can be either text or numbers. If the value is text,
    it has to be in double quotes ("). If your variable name has two words, write
    it using camelCase.


    +   - To change or set the values of your variables, you can use assignment operators,
    arithmetic operators, and comparison operators.


    +   - If statements and else statements are known as conditional statements. Using
    conditional statements allows us to make our code do different things depending
    on the value of a variable.


    > Using JavaScript helps us make interactive web pages that respond to the user.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_80_0.png)'
  - "[PAGE 81]\n\n# FUNCTIONS\n\nAnother important part of JavaScript coding is learning\
    \ how to create and use functions. You create a function by grouping JavaScript\
    \ statements. The statements grouped in the function work together to perform\
    \ a particular action. The function won't run until you tell your browser to run\
    \ it. This is known as calling a function. Let's take a look at how you create\
    \ a function that will pop up an alert and tell it:\n\n```\n<script>\nfunction\
    \ sayPassword() {\n  alert(\"Password!\");\n}\nsayPassword();\n</script>\n```\n\
    \nFunctions always have to be written in the same way. Each part is an important\
    \ instruction for your browser.\n\n+    A function needs:\n\n* **The function\
    \ keyword**\nto define and create a function, use the function keyword.\n* **A\
    \ function name**\nThen give your function a name. The name should be short and\
    \ explain the action the function performs. The name always ends with a pair of\
    \ parentheses.\n* **Braces**\nAfter the function name, open a pair of braces ({\
    \ }). All the statements you want grouped in the function go inside the braces.\n\
    * **Statements**\nStatements form the body of your function. You can use as many\
    \ statements as you want, and the block of code will run in your browser whenever\
    \ you call the function.\n* **A function call**\nTo call our function and run\
    \ the block of code, you have to type the name of the function (including the\
    \ parentheses) followed by a semicolon. After you have defined your function,\
    \ you can call your function anywhere in your <script> block."
  - '[PAGE 82]


    # Built-in Functions


    In addition to grouping statements to create your own functions, you can also
    use functions that are built in your browser. A built-in function is an action
    your browser knows how to perform without having to write any code. A programmer
    has already done the hard work for you. All you have to do is give your browser
    name of the built-in


    function and the information it needs to run. JavaScript has many built-in functions.
    You''ve already been using one in this mission: the alert function. To use the
    alert function, all you do is type "alert" and your browser pops up the alert
    box. Built-in functions save time and let you do more complex things when you
    are programming.


    # Functions and Arguments


    To make a function perform a task, you sometimes have to give it a piece of information
    so it can run. When we put information inside a function, we say that we have
    passed our argument. You have been passing an argument to a function every time
    you have used the alert function. Let''s take a look at what an argument looks
    like:


    ```

    alert("Access Denied");

    ```


    The information in parentheses after the name of the function is our argument.
    Our browser needs the argument to know what text to display in the alert box.
    Without the argument, the alert function wouldn''t work properly.


    Arguments can be in the form of text, numbers, or variables. If you are passing
    your function a piece of text to use as an argument, it needs to be in double
    quotes (" "). If you are passing the name of a variable, you just use the variable
    name without quotes, like this:


    ```

    var bondBrothers = "Dangerous jewel thieves!";nalert(bondBrothers);

    ```


    You can pass arguments to any kind of function. You might have wondered why function
    names and function calls always end with a pair of parentheses. It''s so you can
    pass the an argument. Turn the page to see how to do it.'
