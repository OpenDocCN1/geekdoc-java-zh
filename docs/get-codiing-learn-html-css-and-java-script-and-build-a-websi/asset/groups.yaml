    \ API**: create a map using the API.\n- **Use the built-in directions function**:\
    \ plot a route using this function.\n- **Set parameters**: give the directions\
    \ function the origin and destination for your route.\n\nSave your file in your\
    \ **Coding** folder and call it **route.html**.\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>Top-Secret Route</title>\n</head>\n<body>\n  <iframe\n    width=\"\
    1000px\"\n    height=\"1000px\"\n    frameborder=\"0px\"\n    style=\"border:0px\"\
    \n    src=\"https://www.google.com/maps/embed/v1/directions?\n    origin=GorkyPark,Moscow&destination=StBasil,Moscow&key=API-KEY\"\
    >\n  </iframe>\n</body>\n</html>\n```\n\nDon't forget to use your saved API key.\n\
    \n# FUTURE SKILLS\n\nKnowing how to use web APIs means you can easily include\
    \ features from other apps or websites in your code. You can use them to build\
    \ pages and apps that use big web services, such as social networks like Facebook\
