- md: "\n<body>\n<p>Special Exhibition To-Do List</p>\n<br/>\n<input type=\"text\"\
    \ value=\"Here to add task\"/>\n<br/>\n<input type=\"button\" value=\"Add item\"\
    \ onclick=\"addItem();\"\n<br/>\n<div id=\"list\"></div>\n</body>\n```\n\nNow\
    \ let's create a function in <head> that will set the text inside our newItem\
    \ variable. Finally, we need to run when the click is clicked. Our function needs\
    \ to use the createElement method to make a new <div>. This new <div> will be\
    \ stored in a variable newItem. We then need to use innerHTML to appendChild to\
    \ our new <div> with the id \"list\" in our body. Our <script> block in the <head>\
    \ will look like this:\n\n```javascript\n<script>\nfunction addItem() {\n  var\
    \ newItem = document.createElement(\"div\");\n  newItem.innerHTML = \"New item\"\
    ;\n  document.getElementById(\"list\").appendChild(newItem);\n}\n</script>\n```\n\
    \nWhen we run this code in the browser, the button works. The text \"New item\"\
