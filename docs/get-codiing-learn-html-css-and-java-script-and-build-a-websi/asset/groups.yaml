    \ onclick=\"addItem();\"/>\n  <br/>\n</body>\n</html>\n```\n\nWhen you click on\
    \ the button, the `onclick` attribute calls the JavaScript function and an alert\
    \ pops up.\n\n## CODE SKILLS ► MAKING BUTTONS RUN CODE\n\nNow practice using the\
