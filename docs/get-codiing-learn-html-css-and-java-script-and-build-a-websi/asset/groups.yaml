    ## USING CSS CLASSES


    You might have noticed that adding lots of CSS properties to our HTML tags has
    made our lines of code long and difficult to read. It also takes time to type
    in the same CSS properties over and over again. To save time and make our code
    look better, we now need to learn how to use CSS classes. CSS classes help you
    organize the CSS in the `<body>` of your page.


    Programmers use CSS classes to keep their code as simple as possible. It''s really
    important to do this when you are coding, as it means you are less likely to make
    mistakes. If, for example, you know that you want all the text in every `<div>`
    on your page to be a certain color and font size, rather than having to type the
    CSS properties into every `<div>`, you can use a CSS class to change all the `<div>`
    tags on your page at once.


