    \ JavaScript 将该属性应用到我们的角色上。\n\n| CSS 属性名称 | 作用 | 示例值 |\n| --- | --- | --- |\n\
    | display |  HTML 元素在屏幕上的显示方式 | block, none |\n\n`display` CSS 属性有很多不同的值。我们游戏需要的两个值是\
    \ \"block\" 和 \"none\"。如果你将 HTML 元素的 `display` 属性设置为 `none`，该元素将不会出现在屏幕上。如果你将\
    \ `display` 属性设置为 `block`，HTML 元素将以正方形的形式显示。\n\n在你的文本编辑器中，添加两个名为 `hidden` 和 `visible`\
    \ 的新 CSS 类。使用 `display` 属性使你的 `<style>` 块看起来如下：\n\n```css\n<style>\n#board {\n\
    \  border: 1px solid black;\n  background-color: gray;\n  height: 350px;\n  width:\
    \ 650px;\n}\n.character {\n  background-color: lightblue;\n  width: 120px;\n \
    \ height: 120px;\n  padding: 10px;\n  margin: 10px;\n  float: left;\n}\n.hidden\
    \ {\n  display: none;\n}\n.visible {\n  display: block;\n}\n</style>\n```\n\n\
    -   保存你的代码。\n\n让我们尝试使用这个新的 CSS 属性吧！\n\n## 使用 DISPLAY CSS 属性的技能\n\n尝试使用 CSS `display`\
    \ 属性让 HTML 元素在你的屏幕上出现和消失。你需要它来让你的角色在游戏中正确显示。\n\n- 1. 打开你的文本编辑器。创建一个名为 `display.html`\
