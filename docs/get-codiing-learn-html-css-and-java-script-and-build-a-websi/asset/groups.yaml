    \n我们的应用程序已经开始初具规模了。每当用户点击按钮时，列表就会添加一个项目。但 Bairstone 教授还无法将任何项目输入到文本框并将其添加到列表中。让我们看看如何允许他输入任务。\n\
    \n我们只需要在代码块中更改两行，就可以将文本框的值添加到列表中。我们需要做的第一件事是在 `<body>` 中。我们需要为文本框的 `<input/>`\
    \ 标签提供一个我们自定义的 `id` 属性，如下：\n\n```html\n<input type=\"text\" id=\"box\" value=\"\
    在此添加任务\"/>\n```\n\n然后我们将修改 `<head>` 中的 JavaScript，使其将新 `<div>` 的 `innerHTML` 设置为文本框中输入的任何值。为了做到这一点，我们必须使用\
    \ `getElementById` 通过 `id` 属性找到文本框。然后我们通过修改我们的 `<script>` 块来访问值：\n\n```javascript\n\
    <script>\nfunction addItem() {\n  var newItem = document.createElement(\"div\"\
    );\n  newItem.innerHTML = document.getElementById(\"box\").value;\n  document.getElementById(\"\
    list\").appendChild(newItem);\n}\n</script>\n```\n\n现在，Bairstone 教授可以将文本框中的文本替换为他想要添加到列表的项目了。我们的\
    \ `addItem` 将设置输入到新 `<div>` 中的任何值。他现在可以将他的项目添加到待办事项列表了。\n\n## 特展待办事项\n\n- 狗饼干\n\
    - 添加项目\n- 玻璃展示柜\n- 丝绒垫子\n- 雇佣私人安保\n- 邀请客人\n- 零食和柠檬水\n\n> 天哪！有这么多事情要做啊！\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_117_0.png)\n\
    \n## 代码技能清单\n\n## 使用 DOM API\n\n- DOM（或文档对象模型）是一个 API（应用程序接口）。当你的 HTML 文档在网络浏览器中运行时，它会变成\
    \ DOM 的一部分，称为文档对象。文档对象的结构方式允许你编写代码来访问和更改单个 HTML 元素。\n- 你可以使用 DOM 的内置函数在 HTML 元素绘制到屏幕上之后对其进行更改。如果你想创建一个能够响应用户的交互式网页或基于\
    \ Web 的应用程序，这一点非常重要。\n- 要访问 DOM，你必须输入 `document` 关键字。你还需要使用点 (`.`) 符号。每个针对 DOM\
    \ 的新指令都必须用点隔开。\n- 你可以使用 DOM 方法和属性来更改你的 HTML 元素。\n- `getElementById` 是一个 DOM 方法，允许你通过\
    \ `id` 属性找到页面上的 HTML 元素。\n- `innerHTML` 是一个 DOM 属性。你可以设置任何 HTML 元素的 `innerHTML`。使用\
    \ `innerHTML` 是设置或更改 HTML 元素内容的好方法。\n- `createElement` 是一个 DOM 方法，允许你创建一个新的 HTML\
    \ 元素。你必须告诉浏览器你想创建什么种种的元素。\n- `appendChild` 是一个 DOM 方法，允许你将新的 HTML 元素添加到现有的 HTML\
    \ 元素中。\n\n> DOM 为你节省了大量时间，并让创建动态网页变得简单得多！\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_118_0.png)\n\
    \n## 代码技能：构建基础应用\n\n让我们构建一个基础应用吧。该应用应该有一个文本框和一个按钮，Bairstone 教授可以使用它们将他的任务添加到列表中。使用\
    \ DOM 和 JavaScript，使得当点击按钮时，框中的任务会被添加到列表中。\n\n- 1. 打开你的文本编辑器程序。创建一个名为 `basic.html`\
    \ 的新 HTML 文件。使用 DOM 和 JavaScript，使得当点击按钮时，框中的任务会被添加到列表中。\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <title>待办事项</title>\n</head>\n<body>\n  <p>特展待办事项</p>\n\
    \  <input type=\"text\" id=\"box\" value=\"在此添加任务\"/>\n  <input type=\"button\"\
    \ value=\"添加项目\" onclick=\"addItem()\">\n  <div id=\"list\"></div>\n  <script>\n\
    \  function addItem() {\n    var newItem = document.createElement(\"div\");\n\
    \    newItem.innerHTML = document.getElementById(\"box\").value;\n    document.getElementById(\"\
    list\").appendChild(newItem);\n  }\n  </script>\n</body>\n</html>\n```\n\n- 2.\
    \ 在 `<body>` 底部添加一个空的 `<div>`。为你的 `<div>` 提供一个自定义的 `id`。\n\n- 3. 为你的按钮添加 `onclick`\
    \ 属性。将 `onclick` 设置为调用函数。\n\n- 4. 在 `<head>` 中添加一个 JavaScript 函数。\n\n- 5. 现在使用\
    \ DOM 创建名为 `addItem` 的函数。该函数将使用 `innerHTML` 设置文本框的值。\n\n- 6. 保存你的 HTML 文件并在浏览器中打开它。你现在可以将文本框中的文本替换为想要添加到列表的项目。\n\
    \n> 别忘记设置 `id`！\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_119_0.png)\n\n## 从应用程序中移除元素\n\
    \n你已经知道如何使用 DOM 在网页上查找并添加元素。但如果 Bairstone 教授犯了错误，向列表添加了错误的项目怎么办？或者如果他完成了一个任务并想从列表中移除它？我们需要学习如何使用\
    \ DOM 从应用程序中移除元素。\n\n> 如果我把那双新毛袜加到列表里！太糟糕了！\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_121_0.png)\n\
    \n## removeChild 方法\n\n`removeChild` 方法的作用相反相反。它不是将 HTML 元素添加到另一个 HTML 元素中，而是从另一个\
    \ HTML 元素中移除 HTML 元素。你可以像使用 `appendChild` 一样使用它。通过 `id` 属性选择你想移除的 HTML 元素，然后告诉浏览器移除它，如下：\n\
    \n```javascript\ndocument.getElementById(\"list\").removeChild(this);\n```\n\n\
    正如你熟悉的，HTML 标签可以嵌套在其他标签内部。任何在内部的 HTML 元素都是该元素的元素。外部的 HTML 元素被称为父元素。当你使用 `removeChild`\
    \ 时，你会从父 HTML 元素中移除子元素。\n\n当你使用 `removeChild` 方法时，还需要使用一个非常有用的 JavaScript 关键字\
    \ `this`。这个关键字指向调用该函数的任何 HTML 元素。\n\n> 这些新的代码片段让我们的应用程序更具有交互性。\n\n"
