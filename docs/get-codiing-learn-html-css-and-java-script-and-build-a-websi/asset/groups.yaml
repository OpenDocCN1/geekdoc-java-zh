    # 引言

    ## 计算机编码


    计算机是我们今天生活中不可或的一部分。

    我们一直使用它们来完成许多不同的事情。

    你可能以前用过笔记本电脑、台式电脑或平板电脑。但你知道手机也是计算机吗？自动取款机、洗衣机、游戏机和汽车内部也有计算机吗？所有这些计算机看起来不同，工作也略有不同，但它们有一个共同点：它们必须遵循程序。


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_9_0.png)


    # 完美的编程


    计算机是处理信息的电子设备。它们由硬件（你可以触摸的部分）和软件（你触摸不到的部分）组成。计算机需要软件，因为它们不能自己思考或行动。它们必须遵循指令集。程序是用计算机能理解的语言编写的。因此，编写程序被称为编码或编程。


    你可能使用过的程序有：

    - Facebook

    - Google

    - iTunes

    - Microsoft Word

    - Minecraft

    - YouTube


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_9_1.png)


    你每天都在使用程序。当你在 Facebook 上查看朋友的资料、发送短信、使用微波炉或玩游戏时，你正在使用程序。事实上，你可以编写程序来让计算机完成任何事情。编写程序的人被称为程序员或软件开发人员。程序员根据他们想要构建的类型用不同的语言编写代码。


    你可能已经在学校使用 Scratch 或 Python 等编程语言进行过编码。Scratch 由代码块组成，通过拖放来创建程序。它非常适合制作小游戏和动画。Python
    是一种基于文本的编程语言，这意味着通过输入指令来创建程序。像 Instagram 这样的程序是用 Python 编写的。


    # 编程语言


    有很多不同的编程语言可以使用。计算机可以同时理解多种语言，因此程序通常用几种不同的语言编写。程序员的任务是为他们构建的程序选择最好的语言，因为不同的编程语言在某些事情上效果更好。每种编程语言都有其优缺点。以下列了一些常用的编程语言：


    - C 和 C++ 用于构建计算机的操作系统。

    - C#、Java、PHP 和 Ruby 用于构建网站。

    - C#、Java 和 Objective-C 用于为计算机和手机编写 App。

    - SQL 用于从数据库提取信息。


    在书中，你将学习如何使用三种编程语言编写代码：HTML、CSS 和 JavaScript。通过这些编程语言，你将创建运行在互联网上的程序。你将创建一个网站、App、游戏以及许多运行在你的网络浏览器中的其他程序。


    > APP（应用程序）是一种计算机程序。App 通常是用户需要执行特定任务的程序，例如处理文字或发送电子邮件。


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_10_0.png)


    看看所有你可以使用的不同编程语言。


