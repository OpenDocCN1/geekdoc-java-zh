    \ `<div>` 的内容存储在了一个变量中。然后，我们使用 `innerHTML` 将警框中的文本设置为该变量的值。如果 `<div>` 中的文本发生了变化，警框框内的文本也会随之改变，而我们无需编写任何代码。\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_109_0.png)\n\n## 代码技能、方法与属性\n\n让我们尝试使用\
