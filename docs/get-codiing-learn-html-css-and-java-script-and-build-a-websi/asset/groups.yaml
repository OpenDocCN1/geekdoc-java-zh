    \ | 10px |\n\n> 电脑屏幕上的图形是由被称为像素 (px) 的微彩色点组成的。你可以告诉浏览器 HTML 元素中包含多少像素。\n\n# color\
    \ CSS 属性\n\n要更改文本颜色，请使用 `color` CSS 属性并选择一个值。这与使用 `background-color` 属性是一样的。\n\
    \n```html\n<body>\n<div style=\"color: gray;\">The Monk Diamond Discovery!</div>\n\
    </body>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_42_0.png)\n\n# 对齐 CSS\
    \ 属性\n\n目前我们所有的 HTML 元素都在页面的相同位置。`text-align` 和 `float` CSS 属性允许你在页面上对齐（或定位）文本和其他\
    \ HTML 元素。\n`text-align` 属性允许将文本置于页面的左侧、右侧或中心。记住包含连字符 (-)。\n\n```html\n<body>\n\
    <div style=\"text-align: center;\">The Monk Diamond Discovery</div>\n<p>Stolen\
    \ jewel found in Siberia.</p>\n</body>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_42_1.png)\
    \ 还可以使用 CSS 将 HTML 元素（例如 `<div>` 标签或图像）放置在页面的左侧或右侧。使用 `float` CSS 属性并设置为左或右。\n\
    \n```html\n<body>\n<div style=\"float: right;\">The expedition team:<img src=\"\
    team.jpg\" alt=\"Team/\"></div>\n</body>\n```\n\n`text-align` 和 `float` 属性是为网页创建有趣布局的简单方法。\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_43_0.png)\n\n# 使用多个 CSS 属性\n\n你可以在\
