    \n- `if` 语句和 `else` 语句被称为条件语句。使用条件语句允许我们根据变量的值让代码执行不同的操作。\n\n> 使用 JavaScript 帮助我们创建能够响应用户用户的交互式网页。\n\
    \n## 函数\n\nJavaScript 编码的另一个重要部分是学习如何创建和使用函数。你通过组合 JavaScript 语句来创建一个函数。在函数中分组的语句共同工作以执行特定的操作。在你告诉浏览器运行它之前，函数不会运行。这被称为“调用函数”。让我们看看如何创建一个会弹出警告框并告诉它内容的函数：\n\
    \n```html\n<script>\nfunction sayPassword() {\n  alert(\"Password!\");\n}\nsayPassword();\n\
    </script>\n```\n\n函数始终必须以相同的方式编写。每个部分对你的浏览器来说都是一条重要的指令。\n\n- 函数需要：\n\n- **function\
    \ 关键字**：要定义并创建函数，请使用 `function` 关键字。\n- **函数名**：然后给你的函数起一个名字。名称应该是短的，并解释函数执行的操作。名称始终以一对括号结尾。\n\
    - **大括号**：在函数名之后，打开一对大括号 (`{ }`）。你想要在函数中分组的所有语句都放在大括号内部。\n- **语句**：语句构成了函数的函数体。你可以使用任意数量的语句，每当你调用该函数时，该代码块就会在浏览器中运行。\n\
