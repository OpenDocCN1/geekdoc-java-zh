    \ the comma.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_151_1.png)\n\nLet's add\
    \ our new URL to our source attribute and see the route Dr. Day and the head of\
    \ security need to take through Moscow:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title>Top-Secret Route</title>\n</head>\n<body>\n  <iframe\n  width=\"650px\"\
    \n  height=\"650px\"\n  frameborder=\"0px\"\n  style=\"border: 0px\"\n  src=\"\
    https://www.google.com/maps/embed/v1/directions?\n  origin=GorkyPark,Moscow&destination=StBasil,Moscow&key=API-KEY\"\
    >\n</iframe>\n</body>\n</html>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_152_0.png)\n\
    \n> This is exactly what Dr. Day needs to get the Monk Diamond safely to the House\
    \ of Volkov!\n\n# DO-IT-YOURSELF TASK: PLAN A ROUTE\n\nGreat work! You’ve learned\
    \ how to use a web API and Google Maps to embed content in your page. Now use\
    \ your new knowledge to plan a route through Moscow, from Gorky Park to St. Basil’s\
    \ Cathedral. Having a route will help Dr. Day keep the Monk Diamond safe.\n\n\
    # Moscow Route Planning\n\nWhen you plan your route, use your new skills to do\
    \ the following:\n\n- **Use an API key**: use the Google Maps Embed API to get\
    \ an API key.\n- **Create an <iframe>**: use this HTML tag so you can embed content\
    \ in your page.\n- **Change the way your <iframe> displays**: use attributes to\
