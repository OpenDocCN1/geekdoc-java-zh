    # Making Your Own Wireframes


    Making your own wireframes is very easy. Lots of people just use a pencil, piece
    of paper, and sticky notes to do it, drawing a wireframe that shows what their
    website will look like before they start to code. This is sometimes called paper
    prototyping. It''s a really quick way to experiment with your layouts before you
    spend time coding them.


    If you want to make wireframes like the ones we''ve used here, there are plenty
    of tools available. You can use Microsoft Visio on a PC, Gliffy and Balsamiq mock-ups
    in a web browser, or OmniGraffle if you''re on a Mac. All these programs come
    with premade graphics that you can use to quickly sketch your pages on a computer.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_205_0.png)'
  - '[PAGE 206]


    # Making Your Website Live


    If you want other people to see your finished website, you will need to upload
    it to a web server. At the beginning of the book, we learned about web servers.
    They can be hardware or software, and they store websites so your web browser
    can access them. For people to be able to see your website, you need to host it
    on a web server on the Internet. Setting up your web server is complicated, so
    luckily there are lots of online companies that will let you use their servers
    to host your files.


    When a web server stores a website so web browsers can access it, we say the server
    hosts the website. When files are hosted by a server, they''ll have a URL (web
    address), just like all the websites on the Internet.


    > did you know?

    If you want to host your files, you should ask an adult for help to look for web
    space on a server. Just as with a Google account, you have to be a certain age
    to sign up.


    If you want to find a free web server to host your website, there are lots to
    choose from on the Internet. Just search for "free web hosting." Sometimes home
    Internet connections come with web space that you can use. Once you have a web
    host, you''ll have to copy your files to their server. Carefully read the instructions
    and conditions that your web host gives you.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_206_0.png)'
  - '[PAGE 207]


    # WHAT NEXT?

    YOUR CODING FUTURE


    Over the six missions in this book, you have not only kept the Monk Diamond safe
    from the Bond Brothers, but have also learned all HTML, CSS, and JavaScript. You''ve
    coded a web page, made a password, built a web-based app, planned a route, and
    mastered some very complicated code to build a game. And you can add creating
    a website to your achievements. Congratulations!


    We hope Get Coding! has shown how fun and interesting coding can be. You''ve learned
    a truly impressive number of new Code Skills and built some exciting projects
    of your own. And there''s still much; much more to learn. If you enjoyed coding
    in HTML and CSS, there are plenty of other HTML tags and CSS attributes that you
    can learn from lots of excellent websites on the Internet.


    The W3Schools HTML site, which can be found at www.w3schools.com/html, will guide
    you through plenty of examples so you can expand your knowledge and make even
    more exciting websites.


    If you enjoyed coding in JavaScript, why not sharpen your skills by working through
    some of the exercises available on sites like Codewemy, at www.codewemy.com/learn/javascript?


    Or you could start learning new languages for coding programs that run outside
    your browser. Why not try C#, Java, or Ruby? Or try your hand at coding your own
    servers? Take a look at www.code.org/learn for more ideas.


    And finally, don''t forget to join the Young Rewired State community. We will
    help you to keep developing your coding skills and be a technology star of the
    future!


    The Get Coding! missions have been a great success. It''s up to where you go next.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_207_0.png)'
