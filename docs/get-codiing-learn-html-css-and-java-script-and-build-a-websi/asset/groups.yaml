    # CODE SKILLS CODING PARAGRAPHS AND LINE BREAKS


    Let''s try coding paragraphs and line breaks in a web page, using the <p> and
    <br/> tags.


    +   1. Open up your text-editing program. Create a new HTML file called breaks.html.
    Check the Key Code Skills on pages 13–15 if you need a reminder how to do this.
    Then copy and paste your code from webpagetemplate.html into your new file. Modify
    the code so that it looks like:


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>The Monk Diamond</title>

    </head>

    <body>

    </body>

    </html>

    ```


    +   3. Type some more text in your first paragraph. Add the line break <br/> tag
    to the end of a line of text, like this:


    ```html

    <body>

    <p>The Monk Diamond has been discovered in Siberia.<br/>Professor Bairstone and
    Dr. Day were on a fossil-finding expedition.</p>

    <p>Ernest, Professor Bairstone''s dog, found the jewel.</p>

    </body>

    ```


    +   2. Use the paragraph <p> tag. Open the <p> tag, type some text, then use the
    closing </p> tag. Repeat as many times as you want. Your code will look like this:


    ```html

    <body>

    <p>The Monk Diamond has been discovered in Siberia.</p>

    <p>Ernest, Professor Bairstone''s dog, found the jewel.</p>

    </body>

    ```


    +   4. Save your HTML file in your Coding folder. Then open your web page in your
    browser. Your page will look like this:


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_29_0.png)'
  - '[PAGE 30]


    # The Image Tag: <img/>


    Now that you''ve mastered the paragraph and line break tags, let''s learn how
    to add an image to our web page. The image <img> tag is another self-closing tag.
    Inside the tag itself you have to include a piece of information called the source
    (src) attribute. An image looks like this:


    ```

    <img src="image.jpg">

    ```


    You have to include the source attribute in the <img> tag so your browser knows
    where to find your image. Without it your browser wont know what to display on-screen.
    The value of your source attribute can be either a file name of a saved image
    or a URL (web address) of your image.


    An Attribute is a useful way of giving your browser extra information about an
    HTML element. There are lots of different kinds of attributes you can include
    in your tags. There are two parts to an attribute: the name and the value of the
    attribute You use an equals sign (=) to set the value of the attribute and put
    the value in double quotes (""). So an attribute will always look like this: name="value".
    Attributes are added to the opening tag, or to the only tag in the case of a self-closing
    tag.


    # Using a Saved Image


    If you have an image saved as a JPEG file (.jpg) in your Coding folder, it''s
    really easy to add this image to your page. You all need to set the value of the
    source attribute to the name of your image file, using the equals sign (=) and
    double quotes (""). So if your file is called diamond.jpg, your code will look
    like:


    ```

    <body><p>Professor Baairstone has sent us this secret photo of the Monk Diamond:<img
    src="diamond.jpg"></p></body>

    ```


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_30_0.png)'
  - '[PAGE 31]


    # Using an Image URL


    If there''s an image on the Internet that you want to use on your web page, you
    have to set the value of the source attribute in your <img> /> tag to the URL
    of the image. You find the URL of a picture by right-clicking on it and it selecting
    Copy image URL on a PC or Copy image address on a Mac. You then paste the URL
    inside your <img> /> tag as the value of the source attribute. Don''t forget to
    put it in double quotes (""), like this:


    ```

    <body>

    <p>This is Professor Bairstone and Dr. Day''s first expedition together.</p>

    <p>Here is a photo of the team:</p>

    <img src="https://getcodingkids.com/team_photo.jpg"/>

    </body>

    ```


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_31_0.png)


    # Naming an Image


    If you include an image on your page, you should always give it a name. It helps
    search engines find your page. A name is also handy for users who may not be able
    to download images.

    To name your image, you need to add the alternative (alt) attribute after your
    source, like this:


    The complete code block for our web page with text and images now looks like this:


    ```

    <img src="diamond.jpg" alt="Diamond/>

    ```


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_31_1.png)


    ```

    <body>

    <p>This is Professor Bairstone and Dr. Day''s first expedition together.</p>

    <p>Here is a photo of the team:</p>

    <img src="https://getcodingkids.com/team_photo.jpg" alt="The Team"/>

    </body>

    ```


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_31_2.png)


    > The quotes in our code are always straight ("") rather than curly ("").

    Your browser won''t understand instructions if they are in curly quotes.


    > In web browsers, if you hover your mouse over the image in your browser and
    leave it, a little pop-up will containing the text in your alt attribute.'
