    \n关于僧侣钻石的消息很快传开，在莫斯科和全球范围内引起了相当大的波动。沃尔沃先生对钻石回到它所属的家感到非常高兴，他想向公众开放这个特别展览。现在我们知道安全团队能够应对挑战，我们认为这将是一场盛大的演出。如果莫斯科的人喜欢这个展览，沃尔沃先生正考虑带着它世界巡演。\n\
    \n只剩下最后一件事要做了，我们希望你能提供帮助。沃尔沃先生需要建立一个网站（而不仅仅是一个网页），告诉全世界的每个人关于展览的情况。我们希望最后能再依靠你一次！也许有一天你能来看看僧侣钻石！我们渴望与你见面。\n\
    \n来自沃尔尔科夫之家的最诚挚的祝愿，\n斯通恩教授、戴博士和埃内斯特\n\n附记：附有斯通恩教授在《探险家百科书》上的最新条目以及沃尔沃先生的一封信。\n\
