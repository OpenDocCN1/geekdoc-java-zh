  - '[PAGE 20]


    # Mission Brief


    Dear Coder,


    We haven''t met before, but I''m sure you already know my name. I''m the famous
    explorer Professor Harry Baistone. I''m e-mailing you because I am in desperate
    need of your help.


    I am currently on an expedition in the mountains of Siberia, with the top scientist
    Dr. Ruby Day and my dog, Ernest. The aim of our expedition was to find prehistoric
    fossils. Instead we have made an even more sensational discovery.


    We were exploring a cave when Ernest suddenly started barking and sniffing at
    a larger boulder. We looked closer and saw that something had been hidden in a
    crack in the rock face. Dr. Day pulled out the object. It was a small box wrapped
    in oilcloth. When I opened the box, I couldn''t believe my eyes.


    It was the legendary Monk Diamond! As I''m sure you know, the Monk Diamond was
    stolen from Moscow three years ago in a daring robbery, and its whereabouts been
    unknown until now. Our discovery is of great international significance.


    We can only access the Internet briefly, using my emergency booster pack. Dr.
    Day and I were hoping you could help us by using your Code Skills to build a web
    page about our discovery.


    I''m attaching an entry from the Explorer''s Encyclopedia, which will tell you
    all about the Monk Diamond''s remarkable history. You can use the information
    to build your web page. We will use the page to announce our discovery to the
    world moment we arrive in Moscow.


    Thank you for helping us with this exciting mission. It''s going to be great!


    Warmest wishes from the chilly mountains,

    Professor Harry Baistone


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_20_0.png)'
