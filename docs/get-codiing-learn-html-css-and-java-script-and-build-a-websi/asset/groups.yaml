    ## 编程与网络


    一个巨大的网络连接了世界各地的计算机。这个网络被称为互联网，它允许我们在几秒钟内与范围内的人访问并共享信息。你可能已经通过互联网访问网站、观看视频、发送电子邮件、听音乐或玩游戏。但你知道吗，当你连接到互联网并查看网页时，你正在使用一系列不同的计算机程序？我们计算机上的程序被称为网页浏览器，它们通过互联网网络连接到运行在网络服务器上的程序，让我们能够快速方便地共享信息。


    ## 世界维网


    互联网由许多较小的网络组成。世网维网（或简称“网页”）是一个连接我们许多计算机的网络，每天有数百万的人在使用。网页由许多独立的页面组成。


    ## 网页浏览器


    网页是由程序员用计算机代码编写的文件。网页几乎都是用同一种编程语言编写的，这种语言被称为 HTML。HTML 包含了你的程序在屏幕上显示网页所需的信息。当一组网页链接在一起时，这组页面被称为网站。你使用名为网页浏览器的程序来访问网页。


    网页浏览器是允许我们查看网页的计算机程序。你可能遇到过 Google Chrome、Microsoft Internet Explorer、Safari 和
    Mozilla Firefox 等网页浏览器，并用它们访问各种不同的网站。你的网页浏览器使用网页地址在互联网上找到你想要的网页：它通过另一个名为网络服务器的程序来访问网页信息。


    > Bairstone 教授始终在线，发送着电子邮件！


    ## 网络服务器


    服务器是为其他计算机提供信息的计算机。网络服务器可以是硬件（计算机），也可以是软件（程序），帮助将网页传递到你的浏览器。要访问网页，你的浏览器必须连接到该网页的网络服务器。运行在网络服务器上的程序会找到你的浏览器请求的网页。然后它将网页作为
    HTML 代码发送到你的计算机。


    当网络服务器发送你的网页浏览器页面时，它会以 HTML 文档的形式发送信息。HTML 文档由 HTML 元素组成，例如文本和图像，以及关于浏览器如何在屏幕上显示和定位这些元素的精确指令。


    当网页浏览器读取 HTML 代码中的指令时，我们称浏览器在解析 HTML 文档。当它解析并解码这些指令时，它会在屏幕上绘制文档的每个元素。一个 HTML 文档可能只包含几个单词文本。最简单的
    HTML 文档只有几行代码，看起来像这样：


    - 网页浏览器请求网页。

    - 网络服务器发送网页。


    ## 网络服务器


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Get Coding!</title>

    </head>

    <body>

    你准备好开始编程了吗？

    </body>

    </html>

    ```


    ## 网页地址


    网页地址，或者更广为人知的 URL，是网页浏览器在互联网上找到其所需的网络服务器和 HTML 文件的方便方法。互联网上有数百万个网站，如果每个网页没有一个独立的
    URL，你的网页浏览器就不知道去哪里寻找它了。URL 分为不同的部分，每个部分都告诉你的网页浏览器不同的信息：


    - 这告诉网页浏览器连接到某个网络服务器。

    - 这告诉服务器向你的网页浏览器发送一个 HTML 文件。

    - http://www.getcodingcodings.com/hello.html: 这告诉网页浏览器应该连接到哪个服务器。


    文档可能会更复杂，还包含其他编程语言，例如 CSS 和 JavaScript。


    翻页了解更多关于 HTML 以及用于网页的其他编程语言的信息！


    ## 编写网页


    世界上三种常用的编程语言是 HTML、CSS 和 JavaScript。这些语言用于构建网页和基于 Web 的应用程序。将它们结合使用可以让你构建出不仅美观而且具有交互性的网页。在本书中，你将学习如何用这些语言编程。


    ## HTML


    今天，几乎所有的网页都是用 HTML（超文本标记语言）代码编写的。HTML 由 Tim Bernners-Lee 在 20 世纪 90 年代初开发。HTML
    是创建网页基础结构的极方法。HTML 文档由单个 HTML 元素组成。元素使用起始标签和结束标签创建。每个标签都是在尖括号（<）中的元素名称。内容位于标签之间。每个
    HTML 标签都是给浏览器的一个指令，告诉它如何在你的屏幕上显示内容。标签允许你向网页中添加文本、图像和视频，并将信息分为不同的部分，如行或段落。


    ## CSS


    CSS（层叠样式表）是一种与 HTML 配合使用的编程语言，使网页看起来好看。HTML 本身看起来非常枯燥，所以你使用 CSS 来更改文本和图像的颜色、字体和位置。CSS
    可以让文本变大或变小，改变背景颜色或调整位置。


    ## JavaScript


    JavaScript 是一种重要的语言，因为它通过让网页具有交互性来赋予网页生命。如果你让用户点击某些内容，请使用 JavaScript。


    ## 一些程序员


    - Ada Lovelace (1815–1852) 编写了世界上第一个程序。

    - Grace Hopper (1906–1992) 创建了世界上第一个编译器。

    - Tim Berners-Lee (1955) 发明了世界维网。

    - Alan Turing (1912–1954) 是一位建立了计算机科学基础的数学家。

    - Paul Allen (1953) 和 Bill Gates (1955) 创立了微软。

    - Brendan Eich (1961) 创建了 JavaScript。

    - Markus Persson (1979) 创建了《我的世界》。

    - Sergey Brin (1973) 和 Larry Page (1973) 创立了 Google。

    - Mark Zuckerberg (1984) 创立了 Facebook。


    ## 如何使用本书


    《Get Coding!》中有六个令人兴奋的任务。你的任务是完成每个任务并学习如何用 HTML、CSS 和 JavaScript 编程。然后你可以使用你新的编程技能帮助勇敢的探险家
    Bairstone 和顶尖科学家 Day 博士。


    ## 任务简报


    在每个任务开始时，你会收到一份任务简报。简报会要求你运用知识来提供帮助。任务包括构建网页、创建密码、编写应用、规划路线、制作游戏以及构建一个完成的网站。


    ## 代码技能


    学习编程的最佳方法是实践！起初编程可能看起来令人令畏，你必须使用特殊的单词和符号。但你很快就会熟悉不同的编程语言。为了帮助你理解每个代码的作用，你在每个任务中都能找到代码技能练习。遵循每个练习中的逐步说明，每次掌握一项新的代码技能。


    ## 探险家百科全


    你可以在简报之后的探险家百科全条目中，找到更多关于 Bairstone 教授、Day 博士和僧宝石的信息。你可以利用这些信息来帮助完成任务。


    ## 自学练习


    每个任务结束时都有一个自学练习。使用你在代码技能中学到的代码来完成任务并实现目标。僧宝石的未来在你手中！


