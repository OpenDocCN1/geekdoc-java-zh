    \n# 5. create a game loop\n\nGames are one of the most difficult things you can\
    \ code, and there are many different ways you can build them. A popular way is\
    \ to use a game loop. You used a loop in Mission 3, and we are going to learn\
    \ more about them to build our game.\n\nA game loop is a JavaScript function that\
    \ gets called over and over again while your game is running. You can use a game\
    \ loop to check whether a player has done something, to draw an HTML element on\
    \ your screen, and to run the code for the game.\n\nWe can use the setTimeout\
    \ built-in function to create a game loop. We need to add a new <script> block\
    \ that pops up an alert every 3 seconds. Let's call this function gameLoop. This\
    \ new function will be called when your button is clicked. Let's look at our code\
    \ block:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Security Game</title>\n\
    <style>\n#board {\n  border: 1px solid black;\n  background-color: gray;\n  height:\
    \ 350px;\n  width: 650px;\n}\n</style>\n</head>\n<body>\n<input type=\"button\"\
    \ value=\"Play\" onclick=\"startGame();\">\n<div id=\"board\"></div>\n<script>\n\
    function startGame() {\n  gameLoop();\n}\nfunction gameLoop() {\n  alert(\"Game\
    \ over!\");\n  setTimeout(gameLoop, 3000);\n}\n</script>\n</body>\n</html>\n```\n\
    \n> I wonder if I could sniff out the Bond. Brothers. I've got a very good nose.\n\
    \nOnce you have made these changes, save your code and open it in your browser.\
    \ When you click your button and call your startGame function, the game loop will\
    \ start to run. Your gameLoop function will be called every 3 seconds, and every\
    \ time, an alert will pop up. Every time it pops up, press OK so it keeps popping\
    \ up.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_166_0.png)\n\n> Great start\
    \ to the mission! But where's the thief?\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_166_1.png)\n\
    \n# 6. Add the guests and thief to the game board\n\nNow that you've coded your\
    \ game board, button, and game loop, we need to add the characters to our game.\
    \ We want six different characters to flash on-screen every second. Five of the\
    \ characters will be guests; one character will be a thief. The security team\
    \ will test their reaction times by trying to click on the thief when he or she\
    \ flashes on-screen.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_166_2.png)\n\n\
    Let's start creating the characters on our game board. Each character needs its\
    \ own <div>. Create six <div> tags nested inside your game board <div> and number\
    \ them 1 to 6, like this:\n\n```html\n<div id=\"board\">\n<div>1</div>\n<div>2</div>\n\
    <div>3</div>\n<div>4</div>\n<div>5</div>\n<div>6</div>\n</div>\n```\n\nSave your\
    \ code and refresh your page. You will see your six <div> tags on your game board,\
    \ like this:\n\nNow let's use CSS to change the design and layout of our <div>\
    \ tags. Let's create a CSS called character that will make our <div> tags square\
    \ blue boxes. In your text-editing program, add this new CSS class to the <style>\
    \ tag in your <head>. Your complete <style> block will now look like this:\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Security Game</title>\n<style>\n\
    #board {\n  border: 1px solid black;\n  background-color: gray;\n  height: 350px;\n\
    \  width: 650px;\n}\n.character {\n  background-color: lightblue;\n  width: 120px;\n\
    \  height: 120px;\n  padding: 10px;\n  margin: 10px;\n  float: left;\n}\n</style>\n\
    </head>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_167_0.png)\n\n> Did you\
    \ notice? We have used float property. This will make our <div> tags align with\
    \ another.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_167_1.png)\n\nThen apply\
    \ your new character class to each of your <div> tags using the class attribute,\
    \ as you did in 1. Your <body> will look like this:\n\n```html\n<body>\n  <input\
    \ type=\"button\" value=\"Play\" onclick=\"startGame();\">\n  <div id=\"board\"\
    >\n    <div class=\"character\">1</div>\n    <div class=\"character\">2</div>\n\
    \    <div class=\"character\">3</div>\n    <div class=\"character\">4</div>\n\
    \    <div class=\"character\">5</div>\n    <div class=\"character\">6</div>\n\
    \  </div>\n  <script>\n    function startGame() {\n    gameLoop();\n  }\n\n  function\
    \ gameLoop() {\n    alert(\"Game over!\");\n    setTimeout(gameLoop, 3000);\n\
    \  }\n  </script>\n</body>\n</html>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_168_0.png)\n\
    \n> It's starting to look like a game!\n\nSave your code and refresh your page.\
    \ You will see the CSS properties applied to your <div> tags.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_168_1.png)\n\
    \n> Something's making my nose.\n\n| | | | |\n|---|---|---|---|\n| 1 | 2 | 3 |\
    \ 4 |\n| 5 | 6 | | |\n\n# 7. use the game loop to stop the game\n\nNow that we've\
    \ added our characters to the game board, we need to make some changes to our\
    \ game loop. At the moment, it pops up an alert every 3 seconds. We need to change\
    \ our loop so it will stop after a certain period of time. We're going to do this\
    \ by counting how many times we loop. When our loop has run a certain number of\
    \ times, our game will end.\n\nTo count our loops, let's create a variable that\
    \ will increase in value every time it's called. To do that, we should code a\
    \ variable called loops that is set to the value 0. Add this variable to your\
    \ <script> block before your gameLoop function, like this:\n\n```html\n<script>\n\
    function startGame() {\n  gameLoop();\n}\nvar loops = 0;\nfunction gameLoop()\
    \ {\n  alert(\"Game over!\");\n  setTimeout(gameLoop, 3000);\n}\n</script>\n```\n\
    \nWe need to use this variable in our gameLoop function. We want to add 1 to its\
    \ value every time the function is called. To do this, we could code like this:\n\
    \n```javascript\nloops = loops + 1;\n```\n\nHowever, we can actually use a new\
    \ JavaScript operator to write the same instruction in a simpler and shorter way.\
    \ It's called the increment operator (++), and it's just like the operators we\
    \ learned about Mission 2. We can use the increment operator (++) to add 1 to\
    \ the value of our variable. All we have to write this is:\n\nWe can use the increment\
    \ operator (++) in our gameLoop function to count how many times our loop has\
    \ been called. Remove the alert from your gameLoop function and replace it with\
    \ your new piece of code, like this:\n\n```javascript\nfunction gameLoop() {\n\
    \  loops++;\n  setTimeout(gameLoop, 3000);\n}\n```\n\n> This gives me paws for\
    \ thought!\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_169_0.png)\n\nNow we want\
    \ to make sure that our game loops for a fixed number of times before the game\
    \ ends. We do this by adding an if statement and an else statement to our gameLoop\
    \ function, which will keep track of how many times our loop has run.\n\nWe need\
    \ to make sure when the loop has run for a certain number of times, the setTimeout\
    \ function calling the loop will stop and an alert will pop up. We want our loop\
    \ to run 12 times. It will run every 3 seconds until the twelfth loop, when the\
    \ game will end. Our game will last for a total of 33 seconds (11 multiplied by\
    \ 3) before it ends the twelfth loop. Let's look at our whole <script> block with\
    \ the new variable, if statement, and else statement:\n\n```html\n<script>\nfunction\
    \ startGame() {\n  gameLoop();\n  var loops = 0;\n  function gameLoop() {\n  \
    \  loops++;\n    if(loops < 12) {\n      setTimeout(gameLoop, 3000);\n    } else\
    \ {\n      alert(\"Game over!\");\n    }\n  }\n}\n</script>\n```\n\nThe if statement\
    \ keeps track of how many times our loop has run. If it is less than (< 12 times,\
    \ it keeps running by calling setTimeout again. If it is 12 times or more, the\
    \ else statement runs and an alert pops up.\n\nSave your new code and refresh\
    \ your page. Press the Play button and wait until the alert pops up. Your game\
    \ will now end after a certain period of time.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_170_0.png)\n\
    \n> Don't forget, you have to wait for 33 seconds before the alert will pop up!\n"
