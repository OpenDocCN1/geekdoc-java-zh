    <input type=\"button\" value=\"Add item\" onclick=\"addItem();\"/>\n<div id=\"\
    container\"></div>\n```\n\n- 4. 保存你的 HTML 文件并在浏览器中打开它。你会看到一个按钮。当你点击该按钮时，`innerHTML`\
    \ 定义的文本会被添加到你的 `<div>` 中。\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_110_0.png)\n\
    \n## 使用 DOM 为应用添加内容\n\n我们现在已经知道了如何将 DOM 的方法和元素应用到应用中。这在应用中查找和更改 HTML 元素将非常有用。我们现在需要学习如何使用\
    \ DOM 来添加新的 HTML。毕竟，Bairstone 教授需要能够向列表中添加项目。DOM 有两个方法可以配合 JavaScript 使用。\n\n\
    ## createElement 方法\n\n`createElement` 方法用于创建一个新的 HTML 元素，例如 `<div>`、按钮或段落。你必须在关键字后的双引号（\"\
    ）和括号中包含你想要创建的 HTML 元素类型名称，如下所示：然后你可以使用 JavaScript 使用我们在任务 2 中学过的赋值运算符（=）将你的新元素分配给变量。然后你可以使用\
    \ `innerHTML` 属性在浏览器屏幕上绘制它之前设置新元素的内容。\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_111_0.png)\n\
    \n## appendChild 方法\n\n`appendChild` 方法允许你向现有 HTML 元素添加新的 HTML 元素。当新元素绘制在屏幕上时，它将位于现有元素的下方。你必须在关键字后的括号内包含你想添加的\
    \ HTML 元素，如下所示：`appendChild` 和 `createElement` 方法允许你向应用列表添加每个项目。\n\n```javascript\n\
    <script>\nvar newDiv = document.createElement(\"div\");\nnewDiv.innerHTML = \"\
    Professor Bairstone\";\ndocument.body.appendChild(newDiv);\n</script>\n```\n\n\
    ![](img/fd182f6ecb2aea108dbd5523a70555aa_111_1.png)\n\n> 你注意到了吗？\n> 所有的 DOM 方法和属性都是使用驼峰命名法（camelCase）编写的。\n\
    \n让我们来看一个使用 `createElement` 和 `appendChild` 方法在页面上创建新 HTML 元素的示例。HTML 元素将是一个包含文本的\
    \ `<div>`。`<div>` 是为其他 HTML 元素创建区域或容器的有用方法。\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>To-Do List</title>\n</head>\n<body>\n  <div id=\"list\">To-Do List</div>\n\
    \  <script>\n    var newItem = document.createElement(\"div\");\n    newItem.innerHTML\
    \ = \"Item added to list\";\n    document.getElementById(\"list\").appendChild(newItem);\n\
    \  </script>\n</body>\n</html>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_112_0.png)\n\
    ![](img/fd182f6ecb2aea108dbd5523a70555aa_112_1.png)\n![](img/fd182f6ecb2aea108dbd5523a70555aa_112_2.png)\n\
    ![](img/fd182f6ecb2aea108dbd5523a70555aa_112_3.png)\n![](img/fd182f6ecb2aea108dbd5523a70555aa_112_4.png)\n\
    ![](img/fd182f6ecb2aea108dbd5523a70555aa_112_5.png)\n\n我们做的第一件事是编写一个 `<div>` 并将其\
    \ `id` 属性设置为 `list`。这个 `<div>` 将是我们使用 `appendChild` 添加的 HTML 元素。然后我们打开 `<script>`\
    \ 标签并创建了一个 JavaScript 块。在 JavaScript 的第一行中，我们使用 `createElement` 创建了一个 `<div>`。我们将这个\
    \ `<div>` 存储在一个名为 `newItem` 的变量中。我们在这里可以使用任何名称。在 JavaScript 的下一行中，我们使用 `innerHTML`\
    \ 属性将变量的值设置为某些文本。我们存储在变量中的新 `<div>` 现在包含了文本。\n\n| To-Do List |\n| Item added to\
    \ list |\n\n在 JavaScript 的最后一行中，我们使用 `getElementById` 找到我们正在使用的第一个 `<div>`。然后我们使用\
    \ `appendChild` 将 `<div>` 添加到页面。当我们在浏览器中运行代码时，我们会发现新的 `<div>` 已被添加到第一个 `<div>`\
    \ 中。\n\n> 你不会相信 Bairstone 教授有多健忘！\n\n## 代码技能：添加新元素\n\n现在轮你尝试 `createElement` 和\
    \ `appendChild` 方法了。在你的代码中，使用 DOM 和 JavaScript 在现有元素被点击时创建一个新的 HTML 元素。像 DOM 这样的\
    \ API 让构建变得更容易。\n\n- 1. 打开你的文本编辑器。创建一个名为 `newelements.html` 的新 HTML 文件。编写一个包含文本的带有\
    \ id 属性的 `<div>`如下：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>New Elements</title>\n\
    </head>\n<body>\n<div id=\"list\">Click here to add item...</div>\n</body>\n</html>\n\
    ```\n\n- 2. 在你的 `<head>` 中创建一个新函数。你的代码看起来如下：\n\n```html\n<head>\n<title>New Elements</title>\n\
    <script>\nfunction addItem() {\n}\n</script>\n</head>\n```\n\n- 3. 现在让你的函数使用 `createElement`\
    \ 方法创建一个 `<div>`。将你的新 `<div>` 存储在一个变量中并给变量命名。然后使用 `innerHTML` 属性将你的新 `<div>` 的值设置为文本。你的代码看起来如下：\n\
    \n```javascript\n<script>\nfunction addItem() {\n  var newItem = document.createElement(\"\
    div\");\n  newItem.innerHTML = \"New item\";\n}\n</script>\n```\n\n- 4. 为函数添加最后一行。使用\
    \ `getElementById` 找到你 `<body>` 中的 `<div>`。使用 `appendChild` 方法将新的 `<div>` 添加到\
    \ `<body>` 中的 `<div>` 中。你的代码看起来如下：\n\n```javascript\n<script>\nfunction addItem()\
    \ {\n  var newItem = document.createElement(\"div\");\n  newItem.innerHTML = \"\
    New item\";\n  document.getElementById(\"list\").appendChild(newItem);\n}\n</script>\n\
    ```\n\n- 5. 现在唯一缺少的是代码 `<body>` 中的函数调用。为你 `<body>` 中的 `<div>` 添加 `onclick` 属性，这样当点击\
    \ `<div>` 时，就会调用你的 `addItem` 函数。你的代码看起来如下：\n\n```html\n<body>\n<div id=\"list\"\
    \ onclick=\"addItem();\">Click here to item</div>\n</body>\n```\n\n- 6. 保存你的 HTML\
    \ 文件并在浏览器中打开。每当你点击“Click here”文本，应用中就会添加一个新的 `<div>`。\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_114_0.png)\n\
