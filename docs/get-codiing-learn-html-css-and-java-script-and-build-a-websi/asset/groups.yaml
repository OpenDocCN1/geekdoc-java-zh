  - '[PAGE 50]


    # The style Tag: <style></style>


    When you create a CSS class, you tell your browser you are switching from HTML
    to CSS. You do this by using the <style> tag, which you nest inside the <head>.
    The <style> tag is just like all the other HTML tags you have used so far in this,
    except you put CSS inside.


    Once you''ve opened the <style> tag, you can create a CSS class inside it. Every
    CSS class needs a name. It''s a good idea to make the name relate to the element
    you want to change. Let''s look at how we can create a CSS class that changes
    the look of our text:


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_50_0.png)


    This is a way of writing and structuring our code. CSS classes always start with
    the class name. It''s up to you what you name your CSS classes, but before the
    class name there has to be a dot (.). Then there is a pair of braces ({).


    As before, you separate the property from the value with a colon (:) and after
    the value put a semicolon (;).


    In this example, we have created a CSS class that we have named text. Every time
    we use this CSS class, we will change the text-alignment, font-size, and background-color
    CSS properties to the values we''ve selected.


    > did you notice?

    On your keyboard, the braces ({}) keys are found to the right of the P key, on
    the same keys as the brackets. You need to press Shift to use them.


    > Turn the page to see how you make CSS classes work in the <body> of your code.


