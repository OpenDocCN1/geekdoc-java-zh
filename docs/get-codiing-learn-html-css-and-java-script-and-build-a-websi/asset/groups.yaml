    ## # code skills checklist


    ## ## CODING WITH CSS


    - CSS is always made up of a property and a value. The property is the name of
    what you want to change, and the value is what you want to change it to. There
    are hundreds of different CSS properties and values.

    - You separate the property from the value using a colon (:) and always use a
    semicolon (;) after the value. A hyphen (-) is used between words in CSS properties.

    - Values can be given in words or numbers. Common units for numerical values include
    pixels (px), points (pt), and percentages (%).

    - You can apply more than one CSS property to an HTML element. The best way to
    do this is to use a CSS class and the class attribute.

    - You tell your browser you are switching from HTML to CSS using the `<style>`
    tag. CSS classes are nested inside the `<head>` of our HTML document.

