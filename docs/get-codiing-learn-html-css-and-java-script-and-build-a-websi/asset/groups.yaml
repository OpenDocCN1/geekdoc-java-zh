    ## CODING AND THE WEB


    A giant network connects lots of computers all over the world. This network is
    called the Internet, and it allows us to access and share information with people
    around the world in seconds. You''ve probably used the Internet to visit websites,
    watch videos, send e-mails, listen to music, or play games. But did you know when
    you connect to the Internet and view a website, you are using a chain of different
    computer programs? Programs on our computers called web browsers connect via Internet
    networks to programs running on web servers, letting us share information quickly
    and easily.


    ## World Wide Web


    The Internet is made up of lots of smaller networks. The World Wide Web (or "the
    web") is a network connecting many of our computers, used daily by millions of
    people. The web is made up of lots of individual pages.


    ## Web Browsers


    A web page is a file written in computer code by a programmer. Web pages are nearly
    all written in the same programming language, which is called HTML. HTML contains
    the information your program needs to display a web page on-screen. When a group
    of web pages is linked together, the group of pages is called a website. You access
    web pages using a program called web browser.


    Web browsers are computer programs that allow us to view web pages. You have probably
    come across web browsers as Google Chrome, Microsoft Internet Explorer, Safari,
    and Mozilla Firefox, and used to access all sorts of different websites. Your
    web browser uses a web address to find the web page you want on the web: If it
    accesses the information for the web page using another program called a web server.


    > Professor Bairstone is always online, sending e-mails!


    ## Web Servers


    Servers are computers that provide other computers with information. A web server
    can be either hardware (a computer) or software (a program) that helps to deliver
    a web page to your browser. To access a web page, your browser has to connect
    to that page''s web server. The program running on the web server then finds the
    web page your browser has requested. It then sends the web page to your computer
    as HTML code.


    When the web server sends your web browser page, it sends the information in an
    HTML document. HTML documents are made up of HTML elements, such as text and images,
    as well as exact instructions for the browser about how to display and position
    the elements on-screen.


    When a web browser reads the instructions in the HTML code, we say the browser
    parses the HTML document. As it parses and decodes the instructions, the browser
    draws each element of the document on-screen. An HTML document could contain just
    a few words of text. The simplest HTML document is only a few lines of code and
    looks like this:


    - Web browser asks for the web page.

    - Web server sends the web page.


    ## Web server


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>Get Coding!</title>

    </head>

    <body>

    Are you ready to get coding?

    </body>

    </html>

    ```


    ## Web Addresses


    Web addresses, or URLs, as they are more commonly known, are a handy way for a
    web browser to find the web server and HTML file it needs on the web. There are
    millions of websites on the Internet, and if each web page didn''t have an individual
    URL, your web browser wouldn''t know where to look for it. URLs are split into
    different parts, each telling your web browser a different piece of information:


    - This tells the web browser to connect to a web server.

    - This tells the server to send your web browser an HTML file.

    - http://www.getcodingcodings.com/hello.html: This tells the web browser which
    server to connect to.


    The document might be more complicated, containing other programming languages
    as well, such as CSS and JavaScript.


    Turn the page to find out more about HTML and the other programming languages
    used to web pages!


    ## CODING WEB PAGES


    The three common programming languages in the world are HTML, CSS, and JavaScript.
    These languages are used to build web pages and web-based apps. Using them together
    allows you to build web pages that not only look great but are interactive too.
    In this book you are going to learn how to code in these languages.


    ## HTML


    Today, nearly all web pages are written using HTML (HyperText Markup Language)
    code. HTML was developed by Tim Bernners-Lee in the early 1990s. HTML is a great
    way of creating the basic structure of your web page. HTML documents are made
    up of individual HTML elements. Elements are created using opening and closing
    tags. Each tag is the name of the element enclosed in angle brackets (<). The
    content goes between the tags. Each HTML tag is an instruction to your browser,
    telling it how to show the content on your screen. Tags allow you to add text,
    images, and videos to your web page and to divide information into sections, such
    as lines or paragraphs.


    ## CSS


    CSS (Cascading Style Sheets) is a programming language that works with HTML to
    make your web page look good. HTML looks very boring on its own, so you use CSS
    to change the color, font, and position of text and images. CSS will make you
    a piece of text bigger or smaller, change your background color, or position it.


    ## JavaScript


    JavaScript is an important language because it brings web pages to life by making
    them interactive. If you want the user to click something, use JavaScript.


    ## Some coders


    - Ada Lovelace (1815–1852) wrote the world''s first program.

    - Grace Hopper (1906–1992) created the world''s first compiler.

    - Tim Berners-Lee (1955) invented the World Wide Web.

    - Alan Turing (1912–1954) was a mathematician who established the foundations
    of computer science.

    - Paul Allen (1953) and Bill Gates (1955) founded Microsoft.

    - Brendan Eich (1961) created JavaScript.

    - Markus Persson (1979) created Minecraft.

    - Sergey Brin (1973) and Larry Page (1973) cofounded Google.

    - Mark Zuckerberg (1984) cofounded Facebook.


    ## HOW TO USE THIS BOOK


    There are six exciting missions in Get Coding! Your job is to work through each
    mission and learn how to code in HTML, CSS, and JavaScript. You can then use your
    new coding skills to help the intrepid explorer Bairstone and top scientist Dr.
    Day.


    ## Mission Briefs


    At the start of each mission, you will receive a Mission Brief. The brief will
    ask you to use your knowledge to help. The tasks include building a web page,
    creating a password, coding an app, planning a route, making a game, and building
    a finished website.


    ## Code Skills


    The best way to learn how to code is through practice! At first coding can seem
    daunting you have to use special words and symbols. But you will soon become familiar
    with the different programming languages. To help you see how each piece of code
    works, you will find Code Skills exercises throughout each mission. Follow the
    step-by-step instructions in each exercise, and master a new Code Skill every
    time.


    ## The Explorer’s Encyclopedia


    You will find more about Professor Bairstone, Dr. Day, and the Monk Diamond in
    the entries from the Explorer’s Encyclopedia after the briefs. You can use this
    information to help you complete the tasks.


    ## Do-It-Yourself Tasks


    At the end of each mission is a Do-It-Yourself Task. Use the code you have learned
    in the Code Skills to complete the tasks and accomplish the missions. The future
    of the Monk Diamond is in your hands!

