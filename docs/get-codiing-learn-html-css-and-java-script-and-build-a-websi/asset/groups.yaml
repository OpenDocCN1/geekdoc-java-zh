    Young Rewired State is a worldwide community of digital makers age eighteen and
    under. The community allows young coders to meet like-minded peers and share skills.
    Young Rewired State members can also meet expert mentors at free events around
    the world, like the Festival of Code, and use freely available open data to build
    apps, websites, and algorithms to solve real-world challenges.


    Duncan Beedie worked as an animator on television and web projects and is now
    an illustrator for children''s books. He is also the author-illustrator of The
    Bear Who Stared and The Lumberjack''s Beard. Duncan Beedie lives in Bristol, United
    Kingdom.


