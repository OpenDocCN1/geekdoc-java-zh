    \ people in Moscow like the exhibition, Mr. Volvo is thinking about taking it\
    \ on a tour around the world.\n\nThere's only one thing left to do, and we would\
    \ like you to help. Mr. Volvo needs to build a website (not just a web page) that\
    \ will tell everyone, all over the world, about the exhibition. We hope we can\
    \ rely on you one last time! Perhaps you'll be able to come and see the Monk Diamond\
    \ one day! We'd love to meet you in person.\n\nWarmest celebratory wishes from\
    \ the House of Volkov,\nProfessor Stone, Dr. Day, and Ernest\n\nP.S. Attached\
    \ are Professor Stone's latest entry on the Explorer's Encyclopedia and a note\
    \ from Mr. Volvo.\n\n# EXPLORER ENCYCLOPEDIA\n### Guide to Every Adventure\n-\
    \ Home page\n- Featured discoveries\n- Historical expeditions\n\n### The Recovery\
    \ of the Monk Diamond\n\n## VIKTOR VOLKOV\n\nDear Coder,\n\nJust wanted to write\
    \ a short note to say thank you for all you have done to bring the Monk Diamond\
    \ back to the House of Volkov. I was heartbroken when it was stolen, and in darker\
    \ moments I thought I would have to sell the business. But thanks to you, Professor\
    \ Stone, Dr. Day, and Ernest, the Monk Diamond has been returned. I am delighted\
    \ to be hosting the exhibition and have the jewel on display.\n\nAs you, a reward\
    \ was offered for its safe return or capture of the Bond Brothers. Professor Stone\
    \ and Dr. Day have taken their share and are going to use it to fund another expedition\
    \ together. I want you to know that I also have a token of gratitude to give to\
    \ you, it will be waiting for you when you come to Moscow to see the Monk Diamond\
    \ for yourself.\n\nWith very warm and kind regards,\nViktor Volkov\n\nProfessor\
    \ Stone is known for discovering ancient artifacts around the world. He is always\
    \ accompanied on his expeditions by Ernest. Before finding the Monk Diamond, his\
    \ most notable discovery was a hoard of Viking treasure, which he unearthed at\
    \ the Orkney Islands in Scotland. Dr. Day is a scientist who studies fossils.\
    \ She is currently researching a new species of feathered dinosaur and has been\
    \ on several different experiments in the hope of discovering fossils to prove\
    \ that this has feathers.\n\nThe news of the diamond's recovery has made headlines\
    \ all over the world in any news outlets. Professor Stone has been invited to\
    \ give lectures about the discovery, and his biography will be published next\
    \ year. Dr. Day has made a senior fellow at her university.\n\nA special exhibition\
    \ featuring the recovered gem at the House of Volkov has been very popular. Mr.\
    \ Volkov told reporters here were \"delighted by the return of the diamond and\
    \ the success of the exhibition.\" Lines of up to two hours were reported, and\
    \ sales have more than doubled.\n\n# BUILD A WEBSITE\n\nYou've done some great\
    \ work in the last five missions. You can now use code using HTML, CSS, and JavaScript\
    \ and now know how to use APIs to build more complex programs. You've built a\
    \ web page, created a password, built a web-based app, planned a route, and built\
    \ a game. Now there is one final challenge: to build a website.\n\nSo far all\
    \ the pages and programs you've built have been stored in your computer's browser\
    \ and have only been for Professor Stone and Dr. Day to use. What we need to do\
    \ is learn how to build a website that can be accessed by anyone, anywhere in\
    \ the world.\n\nBuilding a website is not that different from building a web page,\
    \ as we did in Mission 1. After all, a website is just a group of connected web\
    \ pages. In this mission we are going to work in a slightly different way, though.\
    \ Using a tool called a wireframe. There will be five wireframes in this mission,\
    \ and you will need to code a page from each one.\n\n# Wireframes\n\nWireframes\
    \ are a useful way of planning the content and layout of a website before you\
    \ start coding. Wireframes are just very simple drawings, like the example on\
    \ the right, that show the different elements of your web page. They help you\
    \ plan out the design of each web page and make important decisions about how\
    \ a page will be structured.\n\nWireframes also help you decide how your user\
    \ will interact with the page and move among the other pages on the website. Once\
    \ you are happy with your wireframe, you can start coding, using the wireframe\
    \ as a plan that shows you exactly what needs coding on your page.\n"
