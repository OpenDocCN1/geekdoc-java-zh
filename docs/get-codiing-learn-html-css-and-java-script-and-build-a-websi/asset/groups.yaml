  - "[PAGE 171]\n\n# 8. Use css to show and hide the characters\n\nDuring our game,\
    \ the guest and thief characters will flash on-screen. The House of Volkov security\
    \ team will have to spot and click on the thief before he she disappears. We need\
    \ to use CSS to make the characters appear and disappear as the game loop runs.\
    \ To do this, we have to learn a new CSS property that makes an HTML element appear\
    \ or disappear from our browser. We can then use JavaScript to apply the property\
    \ to our characters.\n\n| CSS property name | What does it do? | Example values\
    \ |\n| --- | --- | --- |\n| display | Changes how an HTML element appears on-screen\
    \ | block, none |\n\nThe display CSS property has lots of different values. The\
    \ two values we need for our game are \"block\" and \"none\". If you set the display\
    \ property of an HTML element to none, the element will not appear on your screen.\
    \ If you set the display property to block, the HTML element will display as a\
    \ square.\n\nIn your text-editing program, add two new CSS classes called hidden\
    \ and visible. Use the display property so your <style> block looks like this:\n\
    \n```\n<style>\n#board {\n  border: 1px solid black;\n  background-color: gray;\n\
    \  height: 350px;\n  width: 650px;\n}\n.character {\n  background-color: lightblue;\n\
    \  width: 120px;\n  height: 120px;\n  padding: 10px;\n  margin: 10px;\n  float:\
    \ left;\n}\n.hidden {\n  display: none;\n}\n.visible {\n  display: block;\n}\n\
    </style>\n```\n\n+   Save your code.\n\nLet's try using this new CSS property!\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_171_0.png)\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_171_1.png)"
