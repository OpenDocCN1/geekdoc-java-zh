    # BUILDING A WEB PAGE WITH HTML TAGS


    Now you can write HTML tags, let''s look at how we can use them to code a more
    complex web page. As you''ve just seen in the Code Skill on the previous page,
    if you write text between the opening and closing <p> tags, it will appear on-screen.
    But just having one block of text on our web page won''t look very exciting. If
    we want to make new lines or paragraphs, we have to learn new tags. We need to
    put these tags between our opening and closing <body> tags. Putting tags inside
    other tags is called nesting. Nesting tags allows us to create more exciting page
    layouts. Let''s look at an example of nesting with the <body> tag and the paragraph
    <p> tag:


    ```

    <body>

    <p>The Monk Diamond is worth over $10 million.</p>

    </body>

    ```


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_27_0.png)


    White space around your HTML doesn''t matter. But programmers indent their code
    every time they open a new tag. It helps them keep track of when they''ve opened
    and closed a tag and makes the code block easier to read. To indent, press Tab
    every time you open a new tag.

    Let''s learn about the tags you need to make paragraphs and line breaks. The code
    in the tags is very simple. It''s just a shorter way of saying "paragraph" and
    "break."


    > did you notice?

    All tags are written in lowercase letters, and there are no spaces between the
    tags and text.


    # The Paragraph Tag: <p> and </p>


    The paragraph <p> tag lets you make new paragraphs. The opening tag is <p> and
    the closing tag is </p>. Everything between the opening and closing <p> tags is
    grouped together. Use a new <p> tag every time you want a new paragraph. Look
    at this example, where we''ve coded two paragraphs:


    ```

    <body>

    <p>Professor Bairstone and Dr. Day have made a sensational discovery.</p>

    <p>They have discovered the Monk Diamond in a remote cave in Siberia.</p>

    </body>

    ```


