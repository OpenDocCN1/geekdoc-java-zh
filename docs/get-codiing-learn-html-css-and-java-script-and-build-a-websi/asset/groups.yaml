  - '[PAGE 107]


    # Using the DOM


    The DOM API is structured in a special way called a hierarchy, which is a bit
    like a family tree. This structure is called the document object. In the document
    object the individual HTML elements are all connected to one another, like the
    members of a family, with parents and children. The document object structured
    allows you to use another programming language, such as JavaScript, to access,
    change, add, or remove any of the HTML elements inside the document.


    Using the DOM when you code allows allows you to make changes to individual HTML
    elements after they have been drawn on-screen. You can use the DOM''s methods
    and properties to find an HTML element on your page and then, using JavaScript,
    add to it, remove it, or change it.


    If we want our app to be interactive, we need to learn how to use these methods
    and properties with JavaScript. Professor Bairstone needs to be able to see his
    tasks on-screen and add remove items.


    # DOM Methods and Properties


    Before you can use any of the DOM''s built-in functions, you have to tell your
    browser to access the API. To do this, you always have to type this piece of code
    at the beginning of an instruction for the DOM.


    Once you''ve told your browser you want to use the DOM, then you have to say which
    DOM functions you want to use. The DOM has built-in methods and properties that
    allow you to change HTML elements. A property is a value that you can access and
    change, such as setting the contents of an HTML element to a piece of text.


    When you want to use a method or property, you separate the DOM keyword from the
    DOM method or property with a dot (.). Because the DOM lets any HTML element in
    your web page, lots of DOM methods have the word "element" in them. In Mission
    2, you used a DOM method with JavaScript when you wrote this:


    ```

    document.getElementById("password");

    ```


    Here, we are telling our browser to use the DOM. Then we are asking to use a DOM
    method called getElementById find an HTML element. Finally, we''re directing our
    browser to find the HTML element with that specific id attribute.


    > Did you notice? When we use dots to separate pieces of code, we are using dot
    notation. The dot tells your browser that you will be using DOM methods and properties.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_107_0.png)'
  - '[PAGE 108]


    # changing Your App with the DOM


    We can use a DOM method to find an HTML element in our app by its id attribute.
    We can then use a DOM property to change the contents of that element. Let''s
    look at how we do this.


    # Using the getElementById Method


    The getElementById method is a very handy way of finding a specific HTML element
    in your block of code. To use the getElementById method, you have to include the
    id attribute you gave to the HTML element after the keyword, like this:


    ```

    document.getElementById("list");

    ```


    Here, we have asked our browser to find the HTML element in our web page that
    has the id attribute set to the value "list".


    # Using the innerHTML Property


    You can use the DOM''s innerHTML property to access or change the contents of
    an HTML element in your app. You can then use the contents of the HTML element
    as a value in your JavaScript code.


    ```

    var showList = document.getElementById("list");

    alert(showList.innerHTML);

    ```


    Here, we have created a variable where the value is set to the contents of the
    HTML element that we have called "list", using the id attribute. We have then
    created an alert. The alert will pop up the value of our variable. Our browser
    can access this information because we have set the innerHTML property of the
    variable.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_108_0.png)'
- md: "\nLet's look at using the getElementById method with the innerHTML property\
    \ to pop up an alert:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>List\
    \ Alert</title>\n</head>\n<body>\n  <div id=\"list\">Buy Ernest a new collar</div>\n\
    \  <script>\n    var showList = document.getElementById(\"list\");\n    alert(showList.innerHTML);\n\
    \  </script>\n</body>\n</html>\n```\n\nIn this example, we've used the getElementById\
    \ method to find the <div> with the id attribute set to \"list\". You will remember\
    \ <div> tags from Mission 1. They are containers for pieces of content, and you\
    \ can use them to divide your page into sections. We've stored the contents of\
    \ that <div> in a variable. Then we've used innerHTML to set the text in our alert\
    \ to the value of our variable. If the text in the <div> changes, so will the\
    \ text inside the alert box, without our having to write any code.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_109_0.png)\n\
    \n## CODE SKILLS METHODS AND PROPERTIES\n\nLet's try using the getElementById\
