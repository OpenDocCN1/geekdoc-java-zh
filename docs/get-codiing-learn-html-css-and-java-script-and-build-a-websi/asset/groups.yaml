    <body>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_177_0.png)\n\n```html\n\
    \  <input type=\"button\" value=\"Play\" onclick=\"startGame();\"/>\n  <div id=\"\
    board\">\n    <div class=\"character\">1</div>\n    <div class=\"character\">2</div>\n\
    \    <div class=\"character\">3</div>\n    <div class=\"character\">4</div>\n\
    \    <div class=\"character\">5</div>\n    <div class=\"character\">6</div>\n\
    \  </div>\n  <script>\n    function startGame() {\n      gameLoop();\n    }\n\
    \    var loops = 0;\n    var peopleVisible = false;\n    function gameLoop() {\n\
    \      peopleVisible = !peopleVisible;\n      flashCharacters();\n      loops++;\n\
    \      if (loops < 12) {\n        setTimeout(gameLoop, 3000);\n      }\n     \
    \ else {\n        alert(\"Game over!\");\n      }\n    }\n    function flashCharacters()\
    \ {\n      var board = document.getElementById(\"board\");\n      var classToSet\
    \ = peopleVisible ? \"character visible\" : \"character hidden\";\n      for(var\
    \ index = 0; index < 6; index++) {\n        board.children[index].className =\
    \ classToSet;\n      }\n    }\n  </script>\n</body>\n</html>\n```\n\n> But which\
    \ characters are the guests and which is the thief?\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_178_0.png)\n\
    \n> function call\n\n> simplified if statement\n\n> Turn the page to create the\
    \ characters!\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_178_1.png)\n\n# 12.\
    \ create the thief\n\nAt the moment in our game, every 3 seconds, our characters\
    \ flash on and off the screen. What we need to do now is change the position of\
    \ our characters onscreen every time our game loop runs. Every 3 seconds, the\
    \ characters need to move to a different place on the game board. And we need\
    \ to make one of the characters thief.\n\nWe first need to add a function that\
    \ creates a new set of characters, in different positions, every time game loop\
    \ runs. Let's call this function createCharacters. Start by adding the function\
    \ in your gameLoop function, like:\n\n```javascript\nfunction gameLoop() {\n \
    \ peopleVisible = !peopleVisible;\n  createCharacters();\n  flashCharacters();\n\
    \  loops++;\n  if (loops < 12) {\n    setTimeout(gameLoop, 3000);\n  }\n  else\
    \ {\n    alert(\"Game over!\");\n  }\n}\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_179_0.png)\n\
    \nThen code the new createCharacters function before your flashCharacters function:\n\
    \n```javascript\nfunction createCharacters() {\n  var board = document.getElementById(\"\
    board\");\n  for(var index = 0; index < 6; index++) {\n    board.children[index].innerHTML\
    \ = \"Guest\";\n  }\n}\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_179_1.png)\n\
    \nThis is very similar to the function created earlier to set the CSS class of\
    \ each character `<div>`. But this time we've used innerHTML, as we did in Mission\
    \ 3, to set the value of each of the characters to \"Guest\".\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_179_2.png)\n\
    \nSave your HTML file and refresh your page. Now when you click Play, you'll see\
    \ that each of the character `<div>` tags is labeled \"Guest\".\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_179_3.png)\n\
    \nNow we need to add some code to your createCharacters function that will pick\
    \ one of the 6 `<div>` tags to be the thief every time the loop runs. We need\
    \ to write a code that will pick a random number. There isn't an easy way of picking\
    \ a random number using JavaScript, so the next piece of code you need is quite\
    \ complicated. Carefully type this new code at the end of your createCharacters\
    \ function, so it looks like this:\n\n```javascript\nfunction createCharacters()\
    \ {\n  var board = document.getElementById(\"board\");\n  for(var index = 0; index\
    \ < 6; index++) {\n    board.children[index].innerHTML = \"Guest\";\n  }\n  var\
    \ randomNumber = Math.floor(Math.random() * 6) + 1;\n  board.children[randomNumber-1].innerHTML\
    \ = \"Thief\";\n}\n```\n\nHere, we are using a new Math API. It works in the same\
    \ way as the DOM and localStorage APIs we used in Mission 3. Using the Math API\
    \ lets you access handy functions built into your browser. To find a random number,\
    \ you have to do the following calculation:\n\nMath.floor(Math.random()) * BIGGEST_NUMBER\
    \ + SMALLEST_NUMBER;\n\nWe have 6 characters in our game, our biggest number is\
    \ 6 and our smallest number is 1. We need to code:\n\n```javascript\nMath.floor(Math.random()\
    \ * 6) + 1;\n```\n\nWe then store the result of our calculation in a variable.\
    \ Then we can use this variable in our next line of code. We use innerHTML to\
    \ set the value of whichever `<div>` matches our random number, like this:\n\n\
    ```javascript\nboard.children[randomNumber-1].innerHTML = \"Thief\";\n```\n\n\
    Because numbers in JavaScript count up from 0, we're going to subtract 1 from\
    \ our random number so we'll only get the numbers 0, 1, 2, 3, 4, and 5.\n\nSave\
    \ your code. Your new createCharacters function will have added a thief to your\
    \ game. Now when you click Play, every time the loop runs, a random character\
    \ on your game board will become the thief.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_180_0.png)\n\
    \n> We must get the diamond back!\n\n# 13. create a score\n\nNow we have a game\
    \ board that shows us a different set of characters every 3 seconds. One of those\
    \ characters is the thief that the security team needs to catch. What we need\
    \ to do now is create a way for the user to click on the thief. When the user\
    \ clicks, they catch the thief and score a point.\n\nWe first have to add a variable\
    \ called gameScore to keep track of the score. It goes underneath the startGame\
    \ function at the top of our <script> block:\n\n```javascript\nvar loops = 0;\n\
    var peopleVisible = false;\nvar gameScore = 0;\n```\n\nEvery time the player clicks\
    \ on the thief, we need to add 1 point to their score. And to make the player\
    \ pay attention, every time they click a guest, we should take away 2 points.\
    \ To create our scoring system, we need to add an onclick to every character,\
    \ time the game loop runs. Add this new code to your createCharacters function:\n\
    \n```javascript\nfunction createCharacters() {\n  var board = document.getElementById(\"\
    board\");\n  for(var index = 0; index < 6; index++) {\n    board.children[index].innerHTML\
    \ = \"Guest\";\n    board.children[index].onclick = function() {\n      gameScore\
    \ -= 2;\n    }\n    var randomNumber = Math.floor(Math.random() * 6) + 1;\n  \
    \  board.children[randomNumber-1].innerHTML = \"Thief\";\n    board.children[randomNumber-1].onclick\
    \ = function() {\n      gameScore++;\n    }\n  }\n}\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_181_0.png)\n\
    \nWe're using the onclick, just as we did in Mission 3. When a guest or thief\
    \ is created, an onclick is added. We're using two new arithmetic operators to\
    \ change the value of our gameScore variable. If the user clicks on a guest, the\
    \ += operator means the value that follows is added to the variable. In this case,\
    \ the value that follows is -2, it means that 2 is subtracted from the gameScore\
    \ value. If the user clicks on a thief, the increment operator (++) means 1 is\
    \ added to the value in the variable.\n\nWe also need to change the alert message\
    \ when the game ends, so that it tells the user score. Change the else statement\
    \ in your gameLoop function so it uses the gameScore variable value, like this:\n\
    \n```javascript\nfunction gameLoop() {\n  peopleVisible = !peopleVisible;\n  createCharacters();\n\
    \  flashCharacters();\n  loops++;\n  if (loops < 12) {\n    setTimeout(gameLoop,\
    \ 3000);\n  }\n  else {\n    alert(\"You scored \" + gameScore);\n  }\n}\n```\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_182_0.png)\n\nWe leave a space at the\
    \ end of our alert text, so the message displays correctly with the gameScore\
    \ value.\n\nSave your HTML file and refresh your page. Try clicking on the thief\
    \ every time it flashes on-screen. See how many points you score at the end of\
    \ the game. Remember, you need to refresh your page before each play\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_182_1.png)\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_182_2.png)\n\n> Hooray! The diamond\
    \ will surely be safe now!\n\n# 14. Simplify the code\n\nOur game works, and the\
    \ House of Volkov’s security team can soon begin their training. But you might\
    \ have noticed that our createCharacters and flashCharacters functions are quite\
    \ similar. One creates our characters and the other adds a CSS class to them.\n\
    \nWe can now combine these functions to make our code simpler. Simplifying your\
    \ code as you work through a problem is a really common thing to do when you’re\
    \ coding. It makes it much easier to understand your code.\n"
  mdcn: "\n\n# 开始编码吧！\n\n在你的文本编辑器中检查你的代码。你游戏所需的代码看起来像下面的块。在每次玩游戏之间，你必须刷新页面。进行任何需要的更改，并保存文件。\n\
