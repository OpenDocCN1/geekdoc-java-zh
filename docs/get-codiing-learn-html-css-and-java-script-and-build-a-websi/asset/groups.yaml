    \ you press Load, the text you saved using localStorage will be loaded in your\
    \ browser.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_130_0.png)\n\n> Did you\
    \ notice?\nWhen writing the localStorage keyword, we use camelCase. The first\
