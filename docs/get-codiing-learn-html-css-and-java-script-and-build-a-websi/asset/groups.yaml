    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_178_0.png)\n\n> 函数调用\n\n> 简化的 if 语句\n\
    \n> 翻页来创建角色！\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_178_1.png)\n\n# 12. 创建小偷\n\
    \n在目前我们的游戏中，每隔 3 秒，我们的角色就会在屏幕上闪烁一次。我们现在需要做的是，在每次游戏循环运行时，改变角色在屏幕上的位置。每隔 3 秒，角色需要移动到游戏板上的不同位置。我们需要让其中一个角色成为小偷。\n\
    \n我们首先需要添加一个函数，在每次游戏循环运行时，创建一组位于不同位置的新角色。让我们把这个函数命名为 `createCharacters`。通过在你的\
    \ `gameLoop` 函数中添加该函数开始如下：\n\n```javascript\nfunction gameLoop() {\n  peopleVisible\
    \ = !peopleVisible;\n  createCharacters();\n  flashCharacters();\n  loops++;\n\
    \  if (loops < 12) {\n    setTimeout(gameLoop, 3000);\n  }\n  else {\n    alert(\"\
    Game over!\");\n  }\n}\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_179_0.png)\n\
    \n然后于你的 `flashCharacters` 函数之前编写新的 `createCharacters` 函数：\n\n```javascript\nfunction\
    \ createCharacters() {\n  var board = document.getElementById(\"board\");\n  for(var\
    \ index = 0; index < 6; index++) {\n    board.children[index].innerHTML = \"Guest\"\
    ;\n  }\n}\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_179_1.png)\n\n这与之前创建的设置每个角色\
    \ `<div>` 的 CSS 类的函数非常相似。但这一次，我们像在任务 3 中那样，使用了 `innerHTML` 来将每个角色的值设置为 \"Guest\"\
    。\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_179_2.png)\n\n保存你的 HTML 文件并刷新页面。现在当你点击“Play”时，你会看到每个角色\
    \ `<div>` 标签都被标记为“Guest”。\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_179_3.png)\n\
    \n现在，我们需要在你的 `createCharacters` 函数中添加一些代码，在每次循环运行时，从 6 个 `<div>` 标签中选取一个作为小偷。我们需要编写一段能够选取随机数的代码。在\
    \ JavaScript 中没有简单的方法来选取随机数，所以接下来的代码相当复杂。仔细将这段新代码输入到 `createCharacters` 函数末尾，如下所示：\n\
    \n```javascript\nfunction createCharacters() {\n  var board = document.getElementById(\"\
    board\");\n  for(var index = 0; index < 6; index++) {\n    board.children[index].innerHTML\
    \ = \"Guest\";\n  }\n  var randomNumber = Math.floor(Math.random() * 6) + 1;\n\
    \  board.children[randomNumber-1].innerHTML = \"Thief\";\n}\n```\n\n在这里，我们在使用一个新的\
    \ Math API。它的工作方式与任务 3 中使用的 DOM 和 `localStorage` API 相同。Math API 允许你访问浏览器内置的函数。要找到随机数，你需要进行以下计算：\n\
    \n`Math.floor(Math.random()) * BIGGEST_NUMBER + SMALLEST_NUMBER`\n\n我们的游戏中有 6\
    \ 个角色，最大数字是6，最小数字是1。我们需要编写：\n\n```javascript\nMath.floor(Math.random() * 6) +\
    \ 1;\n```\n\n然后我们将计算结果存储在一个变量中。接着我们可以在下一行代码中使用这个变量。我们使用 `innerHTML` 来设置匹配随机数的\
    \ `<div>` 值，如下：\n\n```javascript\nboard.children[randomNumber-1].innerHTML = \"\
    Thief\";\n```\n\n因为 JavaScript 中的数字从 0 开始计数，我们将从随机数中减去 1，这样我们只会得到 0, 1, 2, 3,\
    \ 4 和 5。\n\n保存你的代码。你新的 `createCharacters` 函数已经在你的游戏中添加了一个小偷。现在当你点击 Play 时，每次循环运行，游戏板上的随机角色就会变成小偷。\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_180_0.png)\n\n> 我们必须夺回钻石！\n\n# 13.\
    \ 创建评分\n\n现在我们有一个每3秒显示一组不同角色的游戏板。其中一个是安全团队需要抓住的小偷。我们现在需要做的是一种让用户点击小偷的方法。当用户点击时，他们抓住了小偷并得分。\n\
    \n我们首先需要一个名为 `gameScore` 的变量来跟踪分数。它位于 `<script>` 块顶部的 `startGame` 函数下方：\n\n```javascript\n\
    var loops = 0;\nvar peopleVisible = false;\nvar gameScore = 0;\n```\n\n每当玩家点击小偷时，我们需要给他们的增加1分。为了让玩家注意，每当他们点击客人时，我们应该扣除2分。为了创建我们的评分系统，我们需要在游戏循环运行时为每个角色添加一个\
    \ `onclick`。将这段新代码加入你的 `createCharacters` 函数：\n\n```javascript\nfunction createCharacters()\
    \ {\n  var board = document.getElementById(\"board\");\n  for(var index = 0; index\
    \ < 6; index++) {\n    board.children[index].innerHTML = \"Guest\";\n    board.children[index].onclick\
    \ = function() {\n      gameScore -= 2;\n    }\n    var randomNumber = Math.floor(Math.random()\
    \ * 6) + 1;\n    board.children[randomNumber-1].innerHTML = \"Thief\";\n    board.children[randomNumber-1].onclick\
    \ = function() {\n      gameScore++;\n    }\n  }\n}\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_181_0.png)\n\
    \n我们像在任务3中一样使用 `onclick`。当创建客人或小偷时，就会添加一个 `onclick`。我们正在使用两个新的算术运算符来更改 `gameScore`\
    \ 变量的值。如果用户点击客人，`+=` 运算符意味着后面的值加到变量。在这种情况下，后面的值是 -2，意味着从 `gameScore` 值中减去2。如果用户点击小偷，递增运算符\
    \ (`++`) 意味着变量值上增加了1。\n\n我们还需要更改游戏结束时的提示消息，以便告知用户分数。修改你 `gameLoop` 函数中的 `else`\
    \ 语句，使其使用 `gameScore` 变量值，如下：\n\n```javascript\nfunction gameLoop() {\n  peopleVisible\
    \ = !peopleVisible;\n  createCharacters();\n  flashCharacters();\n  loops++;\n\
    \  if (loops < 12) {\n    setTimeout(gameLoop, 3000);\n  }\n  else {\n    alert(\"\
    You scored \" + gameScore);\n  }\n}\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_182_0.png)\n\
    \n我们在提示文本的末尾留了一个空格，这样消息就能正确显示 `gameScore` 的值。\n\n保存你的 HTML 文件并刷新页面。尝试在小偷每次在屏幕上闪烁时点击它。看看游戏结束时你得了多少分。记住，在每次玩之前你需要刷新页面。\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_182_1.png)\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_182_2.png)\n\
    \n> 万岁！钻石现在一定安全了！\n\n# 14. 简化代码\n\n我们的游戏运行良好，沃尔科夫家族的安全团队很快就可以开始训练了。但你可能注意到，我们的\
    \ `createCharacters` 和 `flashCharacters` 函数非常相似。一个创建我们的角色，另一个为它们添加 CSS 类。\n\n\
    我们现在可以合并这些函数来简化我们的代码。在解决问题时，简化代码是一项非常常见的事。它会让你的代码变得更容易理解。\n\n"
