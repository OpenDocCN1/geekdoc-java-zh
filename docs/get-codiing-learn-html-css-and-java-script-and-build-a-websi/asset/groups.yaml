    \n# 任务简报\n\n亲爱的编码员：\n\n听到这个消息你会很高兴，在长途跋涉之后，我们终于到达了莫斯科。我们目前躲在一个秘密地点，因为我们不希望除了沃尔科夫先生以外没人知道我们带着“僧侣钻石”抵达了这座城市。沃尔科夫先生找上了我们——他是一个非常有魅力的男人。找到他失落的宝石，我非常开心。\n\
