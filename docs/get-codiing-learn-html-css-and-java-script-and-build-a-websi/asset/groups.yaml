    \n## 内置函数\n\n除了分组语句创建你自己的函数外，你还可以使用浏览器内置的函数。内置函数是浏览器知道如何执行而无需编写任何代码的操作。程序员已经为你完成了这些艰苦的工作。你只需要给浏览器提供内置函数的名称以及它运行所需的信息。JavaScript\
