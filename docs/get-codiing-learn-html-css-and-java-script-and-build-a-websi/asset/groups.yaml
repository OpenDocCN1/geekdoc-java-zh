    The two statements between the opening and closing <script> tags have run one
    after another, popping up two alert boxes with different messages inside. An alert
    is a piece of JavaScript called a function, and it''s built in your web browser.
    We''ll learn more about it later in the mission.


    JavaScript is case sensitive, so it''s important to make sure you have used the
    correct capital letters. When you choose a name for a piece of JavaScript, you
    can''t leave spaces between words. A good way to write two words is to camelCase.


    > CAMELCase is the practice of joining two words to form one word. The first word
    starts with a lowercase letter and the second word begins with an uppercase letter,
    but there is no space between them, like the hump of a camel. An example of camelCase
    is sayHello.'
