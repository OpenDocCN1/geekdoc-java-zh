    <img src=\"ernest.jpg\" alt=\"Dog\" style=\"height: 50%\"/>\n```\n\n你的浏览器会自动计算图像应该的高度。如果你想拉伸图像并改变其比例，可以在\
    \ `style` 属性中同时使用 `width` 和 `height` CSS 属性，如下：\n\n```\n<img src=\"profB.jpg\"\
    \ alt=\"Explorer\" style=\"width: 50px; height: 50px\"/>\n```\n\n## 让图像填充 <div>\n\
    \n创建有趣布局的好方法是使用 `<div>` 标签将页面划分为不同的部分。如果你想用图像作为 `<div>` 的背景并创建一个横幅，你应该像在任务 5 中那样使用\
    \ `background` 和 `background-size` CSS 属性。使用 CSS 属性缩放图像有多种方法。\n\n| CSS 属性 | 作用\
    \ | 示例值 |\n| --- | --- | --- |\n| background | 为 HTML 元素设置背景图像 | url(filename.jpg)\
    \ |\n| background-size | 设置 HTML 元素的大小 | contain, cover, auto |\n\n在任务 5 中，你 `background-size`\
    \ CSS 属性使用了 `cover` 值。`cover` 值会缩放背景图像，使其足够大以完全填充你的 `<div>`。图像的一部分可能会被裁剪以适应 `<div>`\
    \ 的大小。\n\n除了 `cover` 值之外，你还可以使用 `contain` 值。`contain` 值使背景图像尽可能大，而不会拉伸变形。根据图像的大小，它可能无法填充你的\
    \ `<div>`。如果图像没有填充空间，你的浏览器将重复它。\n\n如果你使用 `auto` 作为 `background-size` CSS 属性的值，它也会根据需要重复图像，直到填满\
    \ `<div>`。\n\n```\n<style>\n.team {\n  width: 600px;\n  height: 600px;\n  background:\
    \ url(team.jpg);\n  background-size: contain;\n}\n</style>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_197_0.png)\n\
    \n当我们缩放（SCALE）图像时，我们通过使其变大、变小或赋予不同的比例来调整其尺寸。当我们裁剪（CROP）图像时，切掉它的边缘，使图像变小。\n\n##\
    \ 对齐文本和图像\n\n你可以通过两种简单的方法让图像和文本对齐，我们在任务 1 中查看过。你可以在包含文本和图像的 `<div>` 上使用 `text-align`\
    \ CSS 属性。或者你可以在 `<img>` 标签内部的 `style` 属性中使用 `float` CSS 属性，如下：\n\n```\n<img src=\"\
    team.jpg\" alt=\"The Team\" style=\"float: right;\"/>\n```\n\n## 更多 CSS 颜色值\n\n\
    到为止，你一直使用颜色名称作为 CSS 属性的值。默认情况下，你的浏览器支持约 140 种颜色名称。除了这些名称，你还可以使用 HEX 代码创建自己的颜色。使用\
    \ HEX 代码的方法与使用颜色名称完全相同。它们看起来像这样：\n\n```\n<body>\n<div style=\"background-color:\
    \ #0BFF54\">\n贝尔斯通教授、戴博士和埃内斯特在探险队中。\n</</div>\n</body>\n```\n\n幸运的是，你不需要记住 HEX\
    \ 代码。有很多网站可以帮助计算它们。你可以使用 www.color.adobe.com 调色板混合自己的颜色并创建自己的 HEX 代码。只需从页面上将 HEX\
    \ 值复制到你的代码中，并记得让 HEX 代码颜色以井号（#）开头。\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_198_0.png)\n\
    \n## 1. 首页：index.html\n\n首页（**index.html**）是你网站最重要的页面，因为它是人们首先看到的页面。它应该解释僧侣钻石的发现和展览。\n\
    \n首页将包含一个带有其他页面链接的页眉（header）、一个包含故事的主内容区域以及一个带有沃尔科府链接的页脚（footer）。\n\n这是首页的线框图：\n\
