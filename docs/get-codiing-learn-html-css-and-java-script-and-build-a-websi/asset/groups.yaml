    \ first need to learn how to embed content from another website in our web page.\
    \ To do this, we need to learn some new HTML tags and attributes.\n\n## The \\\
    <iframe> Tag: \\<iframe> and \\</iframe>\n\nTo add a Google Map to our page, we\
    \ need to use a new HTML tag called the \\<iframe> tag. The opening tag is \\\
    <iframe> and the closing tag is \\</iframe>. The tag is used to create an inline\
    \ frame, which is a really useful way of embedding content from another website\
    \ in your page. You can also use several attributes with the tag to change the\
    \ way your embedded content displays. \n\nThe first attribute you have to include\
    \ is the source (src) attribute, which we used in Mission 1. The source attribute\
    \ tells your browser piece of content you want to embed and is in the form of\
    \ a URL. When you are integrating your website, the information in the URL is\
    \ very important for your browser. Let's take a look at an example with the Monk\
    \ Diamond Discovery page:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Diamond\
    \ Discovery</title>\n</head>\n<body>\n<iframe src=\"https://www.monkdiamonddiscovery.com\"\
    >\n</</iframe>\n</body>\n</html>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_145_0.png)\n\
    \nA small section of the Monk Diamond Discovery web page that we provided as a\
    \ URL will appear embedded in your page. However, it's quite hard to see the embedded\
    \ page at this small size. You need to include some other attributes inside your\
    \ opening \\<iframe> tag to change the size, shape, and appearance of the embedded\
    \ page. Let's look at all the attributes you can use:\n\n| Attribute name | What\
    \ does it do? | Example values |\n| --- | --- | --- |\n| src | Provides the URL\
    \ for the piece of content you want to embed | http://www.bing.com |\n| width\
    \ | Sets the maximum width of the \\iframe | 600px, 20% |\n| height | Sets the\
    \ maximum height of the \\iframe | 600px, 20% |\n| frameborder | Sets the width\
    \ of the border around the \\iframe | 0px, 4px |\n| style | Sets the style of\
    \ the \\iframe using a CSS property and value | border: 0px |\n\nNow let's see\
    \ how we can use all these attributes to change the appearance of our \\iframe\
    \ and embedded content. Remember, you always have to add attributes inside your\
    \ opening tag, like this:\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Diamond\
    \ Discovery</title>\n</head>\n<body>\n<iframe\n  width=\"350px\"\n  height=\"\
    350px\"\n  frameborder=\"0px\"\n  style=\"border: 0px\"\n  src=\"https://www.monkdiamonddiscovery.com\"\
    >\n</iframe>\n</body>\n</html>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_146_0.png)\n\
    \nHere, we've set the width and height attributes to the same number of pixels\
    \ to make our \\iframe a square. The frameborder attribute and the CSS property\
    \ have both been set to 0px. This is how the \\iframe will blend in the page.\
    \ You normally do this with an \\iframe, so that the embedded content looks like\
    \ is part of your page.\n\n> Useful thing, this \\iframe tag!\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_146_1.png)\n\
    \n## CODE SKILLS USING THE \\<iframe> TAG\n\nNow that you’ve read about the \\\
