    \ |\n| New item |\n| New item |\n| New item |\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_116_0.png)\n\
    \n## Adding Your Own Tasks\n\nOur app is really starting to take shape. An item\
    \ is added to the list every time the user clicks the button. But Professor Bairstone\
    \ can't get yet item into the text box and add it to the list. Let's see how we\
    \ can allow him to type in his tasks.\n\nWe only need to change two lines in our\
    \ code block to add the value of the text box to the list. The first thing we\
    \ need to do is in our <body>. We need to give the <input/> tag for our text box\
    \ an id attribute of our choice, like this:\n\n```html\n<input type=\"text\" id=\"\
    box\" value=\"Here to add task\"/>\n```\n\nWe're then going to change our JavaScript\
    \ in the <head> so that it sets the innerHTML of the new <div> to whatever value\
    \ has been typed into the text box. To do that, we have to use `getElementById`\
    \ to find the text box using the id attribute. We then access the value by making\
    \ this change to our <script> block:\n\n```javascript\n<script>\nfunction addItem()\
    \ {\n  var newItem = document.createElement(\"div\");\n  newItem.innerHTML = document.getElementById(\"\
    box\").value;\n  document.getElementById(\"list\").appendChild(newItem);\n}\n\
    </script>\n```\n\nNow Professor Bairstone can replace the text in the text box\
    \ with the item he wants to add to his list. Our additem will set whatever value\
    \ is typed into the new <div>. He can now add his items to the to-do list.\n\n\
    ## Special Exhibition To-Do List\n\n- Dog biscuits\n- Add item\n- Glass display\
    \ case\n- Velvet cushion\n- Hire private security\n- Invite guests\n- Snacks and\
    \ lemonade\n\n> Gosh! There are so many things need to do!\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_117_0.png)\n\
    \n## code Skills checklist\n\n## USING THE DOM API\n\n- The DOM (or Document Object\
    \ Model) is an API (Application Program Interface). When your HTML document runs\
    \ in your web browser, it becomes a part of the DOM called the document object.\
    \ The way the document object is structured allows you to write code that will\
    \ access and change individual HTML elements.\n- You can use the DOM's built-in\
    \ functions to make changes to HTML elements after they have been drawn on your\
    \ screen. This is important if you want to make an interactive web page or web-based\
    \ app that responds to the user.\n- To access the DOM, you have to type the document\
    \ keyword. You also have to use dot (.) notation. Each new instruction for the\
    \ DOM has to be separated by a dot.\n- You can use DOM methods and properties\
    \ to make changes to your HTML elements.\n- getElementById is a DOM method that\
    \ allows you to find an HTML element on your page by its id attribute.\n- innerHTML\
    \ is a DOM property. You can set the innerHTML of any HTML element. Using innerHTML\
    \ is a good way to set or change the contents of an HTML element.\n- createElement\
    \ is a DOM method that lets you create a new HTML element. You have to tell your\
    \ browser what type of element you want to create.\n- appendChild is a DOM method\
    \ that lets you add a new HTML element to an existing HTML element.\n\n> The DOM\
    \ saves you lots of time and makes it much easier to create a dynamic web page!\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_118_0.png)\n\n## CODE SKILLS BUILDING\
    \ THE BASIC APP\n\nLet’s build a basic app. The app should have a text box and\
    \ a button that Professor Bairstone can use to add his tasks to the list. Use\
    \ the DOM and JavaScript so that when the button is clicked, the task in the box\
    \ will be added to the list.\n\n- 1. Open up your text-editing program. Create\
    \ a new HTML file called basic.html. Use the DOM and JavaScript so that when the\
    \ button is clicked, the task in the box will be added to the list.\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <title>To-Do List</title>\n</head>\n<body>\n\
    \  <p>Special Exhibition To-Do List</p>\n  <input type=\"text\" id=\"box\" value=\"\
    Here to add task\"/>\n  <input type=\"button\" value=\"Add item\" onclick=\"addItem()\"\
    >\n  <div id=\"list\"></div>\n  <script>\n  function addItem() {\n    var newItem\
    \ = document.createElement(\"div\");\n    newItem.innerHTML = document.getElementById(\"\
    box\").value;\n    document.getElementById(\"list\").appendChild(newItem);\n \
    \ }\n  </script>\n</body>\n</html>\n```\n\n- 2. Add an empty <div> at the bottom\
    \ of your <body>. Give your <div> an id of your choice.\n\n- 3. Add an onclick\
    \ attribute to your button. Set the onclick to call a function.\n\n- 4. Add an\
    \ empty JavaScript function to your <head>.\n\n- 5. Now use the DOM to create\
    \ a function called addItem. The function will use innerHTML to set the value\
    \ of the text box.\n\n- 6. Save your HTML file and open it in your browser. You\
    \ will now be able to replace the text in the text box with an item for the list.\n\
    \n> Don't forget to set the id!\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_119_0.png)\n\
    \n## Removing Elements from the App\n\nYou know how to use the DOM to find and\
    \ add elements to your web page. But what happens if Professor Bairstone makes\
    \ a mistake and adds the wrong item to the list? Or if he completes a task and\
    \ wants to remove it from the list? We need to learn how to remove elements from\
    \ our app using the DOM.\n\n> Imagine if I added that new pair of woolly socks\
    \ to the list! Terrible!\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_121_0.png)\n\
    \n## The removeChild Method\n\nThe removeChild method does the opposite of the\
    \ append. Rather than adding an HTML element to another HTML element, it takes\
    \ away an HTML element from another HTML element. You use it just like appendChild.\
    \ Select the HTML element you want to remove using the id attribute, and then\
    \ tell your browser to remove it, like:\n\n```javascript\ndocument.getElementById(\"\
    list\").removeChild(this);\n```\n\nAs you know already, HTML tags can be nested\
    \ inside other HTML tags. Any HTML element that is inside another is called a\
    \ child of that element. The HTML element on the outside is called the parent.\
    \ When you use removeChild, you remove the child HTML element from the parent\
    \ HTML element.\n\nWhen you use the removeChild method, you also have to use a\
    \ handy JavaScript keyword called \"this\". This keyword points to whichever HTML\
    \ element was used to call the function.\n\n> These new pieces of code are making\
    \ our app more and interactive.\n"
