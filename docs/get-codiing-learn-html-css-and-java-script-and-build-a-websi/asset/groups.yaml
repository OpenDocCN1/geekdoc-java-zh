  - "[PAGE 129]\n\n# CODE SKILLS USING THE LOCALSTORAGE API\n\nLet’s trying using\
    \ localStorage to store information in our web browser. This way the list in Professor\
    \ Bairstone’s app will be safely stored.\n\n+   1. Open up your text-editing program.\
    \ Create a new HTML file called storage.html. Type this code into the <body> of\
    \ your new file:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>Storage</title>\n\
    </head>\n<body>\n<input type=\"text\" id=\"box\" value=\"Type here to add task\"\
    /><br>\n<input type=\"button\" id=\"save\" value=\"Save\" onclick=\"save();\"\
    /><br>\n<input type=\"button\" id=\"load\" value=\"Load\" onclick=\"load();\"\
    /><br>\nSaved item: <div id=\"savedList\"></div>\n</body>\n</html>\n```\n\n+ \
    \  2. Now code a function in <head> that uses localStorage to save the value typed\
    \ into the text box in your browser. Don’t forget to use camelCase when you write\
    \ the localStorage keyword. Your code will look like this:\n\n```\n<script>\n\
    function save() {\n  var newItem = document.getElementById(\"box\").value;\n \
    \ localStorage.box = newItem;\n}\n</script>\n```\n\n> Don't forget to use Google\
    \ Chrome or Mozilla Firefox for this exercise."
