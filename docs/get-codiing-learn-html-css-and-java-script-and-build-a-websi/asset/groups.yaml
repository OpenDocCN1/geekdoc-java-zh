    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_40_0.png)\n\n- 4. 保存你的 HTML 文件并在浏览器中打开它。尝试将\
    \ `background-color` CSS 属性的值更改为不同的颜色。保存文件并刷新页面以查看屏幕上的更改。\n\n# 更多 CSS 属性\n\n让我们来看看一些可以添加到\
    \ HTML 元素中的 CSS 属性，让 Bairstone 教授的页面变得更加有趣。如你所知，CSS 总是由一个属性和一个值组成的。有数百种不同的 CSS\
    \ 属性和值，但这里列了一些最常用的：\n\n| CSS 属性名 | 它的作用是什么？ | 示例值 |\n|---|---|---|\n| background-color\
    \ | 设置背景颜色 | red, black, white, yellow |\n| color | 设置文本颜色 | red, black, white,\
