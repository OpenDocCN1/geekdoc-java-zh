- md: "\n## CODE SKILLS LINKING WEB PAGES\n\nLet's learn how to use hyperlinks to\
    \ link two web pages and build a very simple website.\n\n- 1. Open up your text-editing\
    \ program. Create a new HTML file called page1.html. Make sure it is saved in\
    \ your Coding folder. Type this code into your new file:\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>Page 1</title>\n</head>\n<body>\n</body>\n</html>\n```\n\
    \n- 3. Now create a hyperlink that connects your first page to your second page.\
    \ On your first page, add the `<a>` tag with an `href` attribute. Set the value\
    \ of the `href` to the name of your second page. Then add some text between the\
    \ opening and `<a>` tags to make your hyperlink, like this:\n\n```html\n<body>\n\
    <a href=\"page2.html\">Page 2</a>\n</body>\n```\n\n- 2. Create a second HTML file\
    \ called page2.html. Make sure it is saved in your Coding folder. Then copy and\
    \ paste your code from page1.html into your new file. Modify the code so it looks\
    \ like this:\n\n- 4. Now open your second page. Create a hyperlink that takes\
    \ you back to your first page. Your code will look like this:\n\n```html\n<body>\n\
    <a href=\"page1.html\">Back to Page 1</a>\n</body>\n```\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>Page 2</title>\n</head>\n<body>\n</body>\n</html>\n\
    ```\n\n> Save your files and open them in your browser. You will be able to link\
    \ the two pages.\n\n## CODING WITH JAVASCRIPT\n\nHyperlinks are an important first\
    \ step in creating a web page that responds to the user. But if we want to code\
    \ a page that is really interactive and changes according to what the user does,\
    \ we need to use a new programming language called JavaScript with our HTML.\n\
    \nUse JavaScript with HTML to create a password, so that the information about\
    \ the Monk Diamond is kept safe from the cybercriminal in the Bond Brothers gang.\n\
    \nJavaScript is the most popular programming language in the world. It transforms\
    \ an HTML and CSS web page by making it interactive. We need JavaScript to do\
    \ all sorts of useful things, such as making buttons and alerts and storing information.\
    \ In this mission, we are going to learn how we can\n\nWe saw in Mission 1 how\
    \ HTML documents are made up of different elements and how you use attributes\
    \ to change those elements. JavaScript also has its own syntax, or set of rules,\
    \ for writing code. JavaScript syntax is made up of pieces of code called statements,\
    \ variables, operators, and functions. Let's learn about them and see how we use\
    \ them to build the password.\n\n## Adding JavaScript to Your HTML Page\n\nBefore\
    \ you can start writing JavaScript, you need to tell your browser that you are\
    \ switching from HTML to JavaScript. You do this by using the `<script>` tag.\
    \ If you don't put your JavaScript code between the opening and closing `<script>`\
    \ tags, your code won't run. You can have as many `<script>` tags as you want\
    \ in your HTML document, and you can put them inside either the `<head>` or `<body>`\
    \ on your page.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Password</title>\n\
    </head>\n<body>\n  <script>\n  </script>\n</body>\n</html>\n```\n\n> Here, the\
    \ `<script>` tag is inside the `<body>` of our page. Sometimes we call this a\
    \ `<script>` block.\n\nWhen we write an instruction for our browser in JavaScript,\
    \ we call this writing a statement. JavaScript programs normally contain many\
    \ statements. A statement usually starts with a keyword that tells you what action\
    \ it will perform. It always ends with a semicolon (;). Your browser runs one\
    \ statement after another in the order they are written. Let's look at some JavaScript\
    \ statements. When we save this code and run it in our browser, this happens:\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<title>Password</title>\n</head>\n\
    <body>\n<script>\nalert(\"We need a password urgently!\");\nalert(\"Use the password\
    \ Ernest300\");\n</script>\n</body>\n</html>\n```\n\nThe two statements between\
    \ the opening and closing `<script>` tags have run one after another, popping\
    \ up two alert boxes with different messages inside. An alert is a piece of JavaScript\
    \ called a function, and it's built in your web browser. We'll learn more about\
    \ it later in the mission.\n\nJavaScript is case sensitive, so it's important\
    \ to make sure you have used the correct capital letters. When you choose a name\
    \ for a piece of JavaScript, you can't leave spaces between words. A good way\
    \ to write two words is camelCase.\n\n> CAMELCase is the practice of joining two\
    \ words to form one word.\n\n## VARIABLES\n\nVariables are an important part of\
    \ JavaScript. They are a way to store information.\n\nA variable needs:\n\n- A\
    \ keyword: To define a variable, you have to use the `var` keyword. It tells your\
    \ browser that you are creating a variable.\n- A variable name: The next part\
    \ of a variable is the variable name. You can give your variable any name you\
    \ like. The only rule (with variable names) is that they can't have spaces (so\
    \ use camelCase) and can't begin with a number.\n- A value: You then have to give\
    \ your variable a value using the equals sign (=). Doing this is called assigning\
    \ a variable. If the value of your variable is text, you have to put the value\
    \ in double quotes (\"\"). After the value, you have to include a semicolon (;).\n\
    \n## Operators\n\nOperators are another key part of JavaScript. They are a way\
    \ of changing the value of a variable. Different kinds of operators do different\
    \ things to the information in your variable.\n\n# Assignment Operators\n\nAssignment\
    \ operators allow you to create and set the values of your variables.\n\n- Equals\
    \ (=): You use the equals sign (=) to give your variable value. You can use it\
    \ to set variables to both numbers and words. If your variable is number, it doesn't\
    \ have to be in double quotes (\"\"). Here's an example where the value is set\
    \ to a number:\n\n```javascript\nvar teamMembers = 3;\n```\n\nAnd here's an example\
    \ where the value is set to words and needs double quotes (\"\"\":\n\n```javascript\n\
    var expeditionLeader = \"Professor Bairstone\";\n```\n\n# Arithmetic Operators\n\
    \nArithmetic operators are a way of using math calculations to change the values\
    \ of your variables. They are a useful way of creating a numerical value for a\
    \ variable.\n\n- Addition (+): You use the addition operator (+) to add numbers\
    \ to create a value. Here, the value of our campRations variable will be set to\
    \ 3.\n\n```javascript\nvar campRations = 2 + 1;\n```\n\n- Subtraction (-): You\
    \ use the subtraction operator (-) to subtract numbers to create a value. Here,\
    \ the value of our dogBiscuits variable will be set to 1.\n\n```javascript\nvar\
    \ dogBiscuits = 5 - 4;\n```\n"
  mdcn: "\n\n## 代码技能：链接网页\n\n让我们学习如何使用超链接连接两个网页，并构建一个非常简单的网站。\n\n- 1. 打开你的文本编辑程序。创建一个名为\
    \ `page1.html` 的新 HTML 文件。确保它被保存在你的 `Coding` 文件夹中。在你的新文件中输入此代码：\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<title>Page 1</title>\n</head>\n<body>\n</body>\n</html>\n\
    ```\n\n- 3. 现在创建一个超链接，将你的第一个页面连接到第二个页面。在你的第一个页面上，添加一个带有 `href` 属性的 `<a>` 标签。将\
    \ `href` 的值设置为你第二个页面的名称。然后在起始 `<a>` 标签和结束标签之间添加一些文本来创建你的超链接，如下所示：\n\n```html\n\
    <body>\n<a href=\"page2.html\">Page 2</a>\n</body>\n```\n\n- 2. 创建一个名为 `page2.html`\
    \ 的第二个 HTML 文件。确保它被保存在你的 `Coding` 文件夹中。然后将你从 `page1.html` 中的代码复制并粘贴到新文件中。修改代码使其看起来像这样：\n\
    \n- 4. 现在打开你的第二个页面。创建一个返回你第一个页面的超链接。你的代码看起来如下：\n\n```html\n<body>\n<a href=\"\
    page1.html\">Back to Page 1</a>\n</body>\n```\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>Page 2</title>\n</head>\n<body>\n</body>\n</html>\n```\n\n> 保存你的文件并在浏览器中打开它们。你将能够链接这两个页面。\n\
    \n## 使用 JavaScript 编码\n\n超链接是创建一个响应用户操作的网页的重要第一步。但如果我们想编写一个真正具有交互性并能根据用户操作而变化的页面，我们需要使用一种名为\
    \ JavaScript 的新编程语言与 HTML 配合使用。\n\n使用 JavaScript 配合 HTML 创建一个密码，这样关于“僧侣钻石”（Monk\
    \ Diamond）的信息就能免受邦德兄弟网络犯罪犯的侵害。\n\nJavaScript 是世界上最流行的编程语言。它通过让 HTML 和 CSS 网页具有交互性来转换网页。我们需要\
    \ JavaScript 来执行各种操作，例如创建按钮、警告以及存储信息。在这次任务中，我们将学习如何\n\n我们在任务 1 中看到 HTML 文档是由不同的元素组成的，以及你如何使用属性来更改这些元素。JavaScript\
    \ 也有它自己的语法（或者说一套规则）来编写代码。JavaScript 语法由称为语句、变量、操作符和函数的代码片段组成。让我们来学习这些内容，并看看我们如何使用它们来构建密码。\n\
    \n## 将 JavaScript 添加到你的 HTML 页面\n\n在开始编写 JavaScript 之前，你需要告诉浏览器你正在从 HTML 切换到 JavaScript。你通过使用\
    \ `<script>` 标签来实现这一点。如果你不将 JavaScript 代码放在起始和结束的 `<script>` 标签之间，你的代码将无法运行。你可以在\
    \ HTML 文档中使用任意数量的 `<script>` 标签，并且可以将它们放在页面的 `<head>` 或 `<body>` 中。\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <title>Password</title>\n</head>\n<body>\n\
    \  <script>\n  </script>\n</body>\n</html>\n```\n\n> 在这里，`<script>` 标签位于我们页面的\
    \ `<body>` 内。有时我们称称为 `<script>` 块。\n\n当我们用 JavaScript 为浏览器编写指令时，我们称之为编写一条语句。JavaScript\
    \ 程序通常包含许多语句。语句通常以关键字开头，该关键字告诉它将执行什么操作。它总是以分号（;）结尾。你的浏览器按照编写顺序一个接一个地运行语句。让我们来看一些\
    \ JavaScript 语句。当我们保存这段代码并在浏览器中运行它时，会发生这种情况：\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<title>Password</title>\n</head>\n<body>\n<script>\nalert(\"We need a\
    \ password urgently!\");\nalert(\"Use the password Ernest300\");\n</script>\n\
    </body>\n</html>\n```\n\n起始和结束 `<script>` 标签之间的两个语句接一个地运行了，弹出两个带有不同消息的警告框。警告（alert）是一段称为函数的\
    \ JavaScript 代码，它是你 Web 浏览器内置的。我们将在稍后的任务中学习更多关于它的知识。\n\nJavaScript 是大小敏感的，因此确保你使用了正确的大写字母至关重要。当你为一段\
