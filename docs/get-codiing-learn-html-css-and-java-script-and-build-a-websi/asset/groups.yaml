    # VARIABLES


    Variables are an important part of JavaScript. They are a way to store information
    in your web browser for a short period of time. You can then use the stored data
    to build programs that make your web page interactive. Without variables, your
    browser has no way of remembering information.


    > These are important!


    So when we use JavaScript to code a program that will check a password we need
    to use a variable to store the data for the correct password. Without a variable,
    our browser won''t be able to check whether


    the user has entered a correct password Variables store data in the form of words
    or numbers. You have to code variables in a certain way. You always have to tell
    your browser you are creating a variable. This is called defining a variable.
    Let''s look at how we create a variable that Ernest''s name.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_71_0.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_71_1.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_71_2.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_71_3.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_71_4.png)


    ```

    var dogName = "Ernest";

    ```


    Variables are always written in the same way. Every piece of JavaScript tells
    your browser a different piece of information and will be important when you build
    a program.


    # A variable needs:


    +   - A keyword

    To define a variable, you have to use the variable `var keyword`. It tells your
    browser that you are creating a variable.

    - A variable name

    The next part of a variable is the variable name. You can give your variable any
    name you like. The only rule (rule with variable names) is that they can''t have
    spaces (so use camelCase instead) and can''t begin with a number.

    - A value

    You then have to give your variable a value using the equals sign (=). Doing this
    is called assigning a variable. If the value of your variable is text, you have
    to put the value in double quotes (""). You can include spaces in your values.
    After the value, you have to include a semicolon (;).'
  - '[PAGE 72]


    # Operators


    Operators are another key part of JavaScript. They are a way of changing the value
    of a variable. Different kinds of operators do different things to the information
    in your variable.


    # Assignment Operators


    Assignment operators allow you to create and set the values of your variables.


    Equals (=): You use the equals sign (=) to give your variable value. You can use
    it to set variables to both numbers and words. If your variable is a number, it
    doesn''t have to be in double quotes (""). Here''s an example where the value
    is set to a number:


    ```

    var teamMembers = 3;

    ```


    And here''s an example where the value is set to words and needs double quotes
    (""):


    ```

    var expeditionLeader = "Professor Bairstone";

    ```


    # Arithmetic Operators


    Arithmetic operators are a way of using math calculations to change the values
    of your variables. They are a useful way of creating a numerical value for a variable.


    Addition (+): You use the addition operator (+) to add numbers to create a value.
    Here, the value of our campRations variable will be set to 3.


    ```

    var campRations = 2 + 1;

    ```


    Subtraction (-): You use the subtraction operator (-) to subtract numbers to create
    a value. Here, the value of our dogBiscuits variable will be set to 1.


    ```

    var dogBiscuits = 5 - 4;

    ```'
