    \ Save your HTML file and open it in your browser. You will see your map embedded\
    \ in your page.\n\n# PLAN A ROUTE USING GOOGLE MAPS\n\nNow that you know how to\
    \ embed a map in your page, we can start planning the route Dr. Day and the head\
    \ of security need to take through Moscow. To do this, we need to build a new\
