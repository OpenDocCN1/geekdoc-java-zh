    were unknown. In 1947 it was found during a police raid on a gang of petty criminals
    in Moscow and returned to the nobleman''s family.

    The nobleman''s son decided the Monk Diamond was unlucky and sold it to the House
    of Volkov. Moscow''s oldest jewelry store. The House of Volkov paid an undisclosed
    sum for the jewel, but it was rumored to be the most expensive high-profile diamond
    sale ever.

    The Monk Diamond was on display in the House of Volkov''s private collection until
    three years ago, when it was stolen in an audacious raid. Despite a long investigation
    and the promise of a huge reward, the police were unable to track down the culprits,
    and the case remains unsolved.

    The thieves are believed to be the Bond Brothers, the international gang of jewel
    thieves responsible for numerous high-profile thefts. A further theory put forward
    by the explorer Professor Bairstone is that the Monk Diamond was smuggled out
    of Moscow by the Bond Brothers and hidden somewhere in Russia. He thinks "the
    thieves are bidding their time until they can sell the diamond on the black market
    without attracting suspicion."'
- md: "\n# CODING WITH HTML\n\nNow that you've read the Mission Brief, it's time to\
    \ get coding. Build Professor Baistone's web page, you're first going to need\
    \ to write HTML (HyperText Markup Language). HTML is the programming language\
    \ used by programmers to build websites. It allows you to give your browser instructions.\
    \ Use HTML to add text and images to a web page. You also use it to group pieces\
    \ of information into lines, paragraphs, or sections.\n\nAn HTML web page is called\
    \ a document. It's made up of HTML elements. Elements are created using small\
    \ pieces of code tags. Tags always come in pairs and surround every piece of content\
    \ (like a piece of text or an image) on the page. Each tag contains an instruction\
    \ for your web browser, telling it how to show the element on-screen. This is\
    \ why HTML is called a markup language. Use tags to mark up each piece of content\
    \ with an instruction for your browser.\n\n## HTML Tags\n\nEach tag is made up\
    \ of a piece of code surrounded by two angle brackets (<). The angle brackets\
    \ are on the same keys as the period and comma symbols on your keyboard. Let's\
    \ look at an example of a tag:\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_23_0.png)\n\
    \n```\n<p>Professor Baistone and Dr. Day have discovered the Monk Diamond.</p>\n\
    ```\n\n```\nopening tag\n```\n\n```\nclosing tag\n```\n\nThis is the paragraph\
    \ <p> tag. When tags come in pairs, we call the first tag the opening tag and\
    \ the second tag the closing tag. You can spot a closing tag because it contains\
    \ a forward slash (/). When your browser reads this code, it understands you are\
    \ telling it to group the text between the opening and closing <p> tags into a\
    \ paragraph.\n\nTo create a web page, you have to create an HTML file in a text-editing\
    \ program. Your browser expects some tags to appear in a certain order. You need\
    \ to code the tags that contain instructions about the whole page first. Then\
    \ you code the tags with instructions for specific pieces of content on your page.\
    \ Tags can be put inside other tags. You just have to remember to close each tag\
    \ when you've finished with it.\n\nLet's look at the HTML tags you need to code\
    \ a very simple web page. If you use these tags, you will create a web page that\
    \ is made up of a title and some text. Each tag gives your browser a different\
    \ piece of information:\n\n### <!DOCTYPE html>\n\nThis is called the <!DOCTYPE>\
    \ declaration, and it is always the first line of an HTML file. It tells our browser\
    \ what version of HTML our page has been coded in. It is not an HTML tag so it\
    \ is written with capital letters, and it doesn't need a closing tag.\n\n### <html>\n\
    \nThis is the <html> tag, and it it tells the browser that we have used HTML to\
    \ code our page.\n\n### <head>\n\nThis is the <head> tag. Inside are pieces of\
    \ content that aren't displayed in the main <body> tag of your title. You can\
    \ also put instructions that you want your browser to apply to your whole page\
    \ here.\n\n### <title>\n\nThe Monk Diamond Discovery</title>\n\nThe <title> tag\
    \ goes inside the <head> tag. The content between the tags will not appear in\
    \ the main body of our page. It will be the title of the browser window when you\
    \ open the page in your browser.\n\n### <body>\n\n<p>Professor Baistone and Dr.\
    \ Day have discovered the Monk Diamond.</p>\n\nThe content you want to see displayed\
    \ in your web page goes inside the <body> tag. This text about the Monk Diamond\
    \ will appear on our page when we open the file in our web browser.\n\nThis is\
