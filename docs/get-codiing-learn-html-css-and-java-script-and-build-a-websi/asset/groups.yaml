    <body>\n<div style=\"background-color: palegreen; height: 75%; width: 50%;\">\n\
    \  <p>The police remain baffled by the crime.</p>\n  <p>There were no successful\
    \ leads in the case.</p>\n</div>\n</body>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_45_0.png)\n\
    \n# 你注意到了？\n\n当你计算百分比时，你是在计算你想让元素占据屏幕的百分比。如果你更改了浏览器的大小，元素的大小也会随。\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_45_1.png)\n\
    \n像素和磅的使用方式与百分比完全相同。使用这些单位，即使更改了浏览器的大小，元素的大小也会保持不变。在这里，我们使用像素值设置了 `height` 和 `width`\
    \ 属性，并使用 `font-size` CSS 属性将文本的大小更改为磅的值。\n\n```html\n<body>\n<div style=\"background-color:\
    \ gold; height: 200px; width: 350px; font-size: 20pt\">\n  <p>The Bond Brothers\
    \ have never been caught.</p>\n</div>\n</body>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_45_2.png)\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_45_3.png)\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_45_4.png)\n\
    \n# 使用 CSS 创建边框和空间\n\n我们还可以使用 CSS 属性在 HTML 元素周围创建边框和空间。要为 HTML 元素创建边框，你必须使用 `border`\
    \ CSS 属性并将值设置为所需的宽度、样式和颜色。让我们来看一个例子：\n\n```html\n<body>\n<div style=\"border:\
    \ 4px solid green; width: 50%; height: 100px;\">\n  Professor Baistone and Dr.\
    \ Day are very excited by their discovery.\n</div>\n</body>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_46_0.png)\n\
    \n我们还可以使用 `padding` 和 `margin` CSS 属性更改 HTML 元素内部的空间。你可以为 HTML 元素的顶部、底部、左侧和右侧设置\
    \ `margin` 和 `padding` 值。来看看：\n\n```html\n<body>\n  <div style=\"padding: 25px;\
