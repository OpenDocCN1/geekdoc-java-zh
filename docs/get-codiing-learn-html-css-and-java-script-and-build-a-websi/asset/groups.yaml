    # 关于本书


    你好！我们是 Young Rewired State，这是一个全球性的 18 岁及以下数字创作者组成的社区。我们编写这本书是因为我们希望你成为未来的科技明星。我们希望《开始编码吧！》不仅能教你如何编码，还能让你看到它是多么有趣和兴奋。编码是年轻人可以学习的最重要技能之一，现在是掌握它的最好时机没有没有。


    # 这本书教了你什么？


    这本书教你如何使用三种基础编程语言：HTML、CSS 和 JavaScript 进行编码。计算机可以被用来做几乎任何事情，但首先必须有人为它编写一个程序供它遵循。程序必须用计算机能理解的语言编写。编码的核心就是学习用这些不同的语言来编写程序。


    HTML、CSS 和 JavaScript 是世界上最重要的三种编程语言。它们被 Web 开发人员用于构建你每天使用的网站以及基于网络的 App 和游戏。这本书将教你如何使用这些编程语言编写代码并构建程序。在书中，你将学习到真正的编码技能，你可以用这些技能进行各种编程。


    了解更多关于 Young Rewired State 的信息。www.yrs.io www.getcodingkids.com


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_8_0.png)


    # 这本书是如何运作的？


    本书共有六章。每一章包含一个任务，将教你新的 HTML、CSS 和 JavaScript 编码技能。你的任务是学习这些章节，并运用你的技能完成任务。你将加入
    Bairstone 教授、Day 博士和 Ernest 的行列，他们需要你的帮助来保护一颗珍贵的钻石。


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_8_1.png)


