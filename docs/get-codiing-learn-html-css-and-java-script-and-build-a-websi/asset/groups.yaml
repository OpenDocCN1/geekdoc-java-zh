    >\n</iframe>\n</body>\n```\n\n- 3. Finally, add the source attribute. Set its\
    \ value to the URL of a website, like this:\n\n```html\n<iframe\nwidth=\"350px\"\
    \nheight=\"350px\"\nframeborder=\"0px\"\nstyle=\"border: 0px\"\nsrc=\"https://www.bing.com\"\
    >\n</iframe>\n```\n\n- 4. Save your HTML file and open it in your browser. Your\
    \ chosen site will be embedded in your web page. Now try changing the height and\
