    ```


    - 2. 找到 GET A KEY（获取密钥）按钮。点击它。


    - 3. 你会看到一个带有三个选项的弹出窗口。点击 CONTINUE（继续）。


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_143_0.png)

    ![](img/fd182f6ecb2aea108dbd5523a70555aa_143_1.png)

    ![](img/fd182f6ecb2aea108dbd5523a70555aa_143_2.png)


    - 4. 现在登录你的 Google 账号。记住，如果你未满十三岁，需要请成年人帮助。你将被重定向到 Google 开发者控制台。确保（如果你符合年龄要求）或帮助你的成年人阅读了条款和条件。你需要同意这些条款才能继续。然后从下拉列表中创建一个新项目并点击
    Continue（继续）。


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_143_3.png)

    ![](img/fd182f6ecb2aea108dbd5523a70555aa_143_4.png)


    - 5. 接下来会被要求创建一个 API 密钥。不需要填写任何内容——只需点击 Create（创建）。


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_144_0.png)


    - 6. 你的 API 密钥将显示出来。它是一个由数字和字母组成的长代码。每个密钥都是唯一的，但它看起来像这样：


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_144_1.png)


    - 7. 现在将你的 API 密钥复制并粘贴到你的文本编辑器中。将文件保存为你的 Coder 文件夹中的文本文件（使用扩展名 .txt）。将你的新文件命名为
    APIkey.txt。


    > 请妥善保存 API 密钥，因为你稍后在任务中需要它！


    > Coder，注意！随着 Google 更新软件，这些步骤可能会可能会发生变化。


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_144_2.png)


    ## 如何嵌入内容


    现在你已经知道什么是嵌入，并且获取了 Google Maps 的 API 密钥，我们可以开始为 Day 博士制作网页了。我们首先需要学习如何在我们的网页中嵌入来自另一个网站的内容。为了做到这一点，我们需要学习一些新的
    HTML 标签和属性。


    ## <iframe> 标签：<iframe> 和 </iframe>


    为了在我们的页面中添加 Google 地图，我们需要使用一个名为 `<iframe>` 的新 HTML 标签。起始标签是 `<iframe>`，结束标签是
    `</iframe>`。该标签用于创建内联框架（inline frame），这是在页面中嵌入另一个网站内容的一种非常有用的方法。你还可以配合标签使用几个属性来更改嵌入内容的显示方式。


    你必须包含的第一个属性是 source (src) 属性，我们在任务 1 中用过。source 属性告诉浏览器你想要嵌入的内容，其形式为 URL（统一网址）。当你集成网站时，URL
    中的信息对你的浏览器来说非常重要。让我们看一个 Monk Discovery 页面的示例：


    ```html

    <!DOCTYPE html>

    <head>

    <title>Diamond Discovery</title>

    </head>

    <body>

    <iframe src="https://www.monkdiamonddiscovery.com">

    </body>

    </html>

    ```


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_145_0.png)


    作为 URL 的 Monk Discovery 页面小部分将出现在你的页面中。然而，在这个尺寸下很难看到嵌入页面。你需要在起始 `<iframe>` 标签内部包含其他属性来更改嵌入页面的尺寸和外观。让我们看看你可以使用的属性：


    | 属性名称 | 它的作用 | 示例值 |

    | --- | --- | --- |

    | src | 提供要嵌入的内容 | http://www.bing.com |

    | width | 设置 iframe 的最大宽度 | 600px, 20% |

    | height | 设置 iframe 的最大高度 | 600px, 20% |

    | frameborder | 设置 iframe 周围的边框 | 0px, 4px |

    | style | 使用 CSS 属性设置 iframe 的样式 | border: 0px |


    现在让我们看看如何使用这些属性来更改我们的 <iframe> 和嵌入内容的显示效果。记住，你必须像这样在起始标签内部添加属性：


    ```html

    <!DOCTYPE html>

    <head>

    <title>Diamond Discovery</title>

    </head>

    <body>

    <iframe src="https://www.monkdiamonddiscovery.com" width="350px" height="350px"
    frameborder="0px" style="border: 0px"></iframe>

    </body>

    </html>

    ```


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_146_0.png)


    在这里，我们将 width 和 height 属性设置为相同的像素值，使我们的 <iframe> 变成正方形。frameborder 属性和 CSS 属性都设置为
    0px。这就是我们通常使用 <iframe> 的方法，使嵌入内容看起来是页面的一部分。


    > 这个 <iframe> 标签很有用！


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_146_1.png)


    ## 使用 <iframe> 标签的编码技能


    现在你已经阅读了 <iframe> 标签及其工作原理，让我们尝试使用该标签及其属性来更改嵌入内容在网页中的显示方式。


    - 1. 打开你的文本编辑器。创建一个名为 iframe.html 的新文件。在页面的 <body> 中添加起始和结束 `<iframe>` 标签，代码如下：


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>iframe</title>

    </head>

    <body>

    <iframe></iframe>

    </body>

    </html>

    ```


    - 2. 现在设置你的 <iframe> 属性。在起始 `<iframe>` 标签内部包含 width、height、frameborder 和 style
    属性，如下：


    ```html

    <body>

    <iframe width="350px" height="350px" frameborder="0px" style="border: 0px"></iframe>

    </body>

    ```


    - 3. 最后，添加 source 属性。将其值设置为网站的 URL，如下：


    ```html

    <iframe width="350px" height="350px" frameborder="0px" style="border: 0px" src="https://www.bing.com"></iframe>

    ```


    - 4. 保存你的 HTML 文件并在浏览器中打开它。你选择的网站将嵌入到你的网页中。现在尝试更改 <iframe> 的高度和宽度，看看它对嵌入内容产生了什么影响。


    > 我很喜欢这种在页面中嵌入内容的方式。


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_147_0.png)


    ## 嵌入 Google 地图


    如你所示，<iframe> 标签非常有用。现在让我们学习如何使用它将 Google 地图集成到我们的页面中。你可以添加的最简单类型的 Google 地图叫做嵌入搜索（embedded
    search）。你使用一个名为 Google Maps Embedded API 的 Google API。当用户给 API 提供一个关键词（如国家、城市或街道的名称）时，它将根据该关键词生成地图。


    ## URL


    你需要在 <iframe> 的 source 属性中为 Google Maps Embedded API 提供一个 URL。为了嵌入正确的地图，URL 必须包含几项重要信息。让我们看看如果我们想在网页中嵌入一张莫斯科的地图，具体需要在
    URL 中包含哪些信息：


    ```

    https://www.google.com/maps/embed/v1/search?q=Moscow&key=API-KEY

    ```


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_148_0.png)


