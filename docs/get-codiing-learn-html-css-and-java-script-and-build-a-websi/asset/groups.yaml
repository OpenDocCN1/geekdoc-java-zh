    \ CSS properties.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_185_0.png)\n\n|\
    \ CSS property | What does it do? | Example values |\n| :--- | :--- | :--- |\n\
    | background | Sets the background of an HTML element to an image | url('image.jpg'),\
