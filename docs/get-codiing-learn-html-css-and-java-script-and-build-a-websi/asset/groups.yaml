    \ is used to make a new HTML element, such as a <div>, button, or paragraph. You\
    \ have to include the name of the type of HTML element you want to create in double\
    \ quotes (\") and parentheses after the keyword, like this: You can then use JavaScript\
    \ to assign your new element to a variable, using the assignment operator (=)\
    \ we learned about in Mission 2. Then you can use the innerHTML property to set\
    \ the content of your new element before your browser draws it onscreen.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_111_0.png)\n\
    \n## The appendChild Method\n\nThe appendChild method lets you add a new HTML\
    \ element to an existing HTML element. When the new element is drawn on-screen,\
    \ it will be drawn underneath the existing element. You have to include the HTML\
    \ element you want to add in parentheses after the keyword, like this: The appendChild\
    \ and createElement methods allow you to add each item to the list in the app.\n\
    \n```javascript\n<script>\nvar newDiv = document.createElement(\"div\");\nnewDiv.innerHTML\
    \ = \"Professor Bairstone\";\ndocument.body.appendChild(newDiv);\n</script>\n\
    ```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_111_1.png)\n\n> Did you notice?\n\
    > All the DOM methods and properties are written using camelCase.\n\nLet's look\
