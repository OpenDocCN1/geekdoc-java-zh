    ## 使用 CSS 类


    你可能已经注意到，在 HTML 标签中添加大量的 CSS 属性让我们的代码行变得很长且难以阅读。反复输入相同的 CSS 属性也很浪费时间。为了节省时间并让代码看起来更好，我们现在需要学习如何使用
    CSS 类。CSS 类可以帮助你组织页面 `<body>` 中的 CSS。


    程序员使用 CSS 类来保持代码尽可能简单。在编写代码时，这一点非常重要，因为这意味着你出错的概率较低。例如，如果你知道你希望页面上每个 `<div>` 中的所有文本都具有某种颜色和字体大小，而不是在每个
    `<div>` 中手动输入 CSS 属性，你可以使用 CSS 类来一次性更改页面上所有的 `<div>` 标签。


    CSS 类是一种将一组 CSS 属性应用到任何 HTML 元素的非常方便的方法。


    ## 使用 <head> 标签


    到为止，我们大部分时间都在页面的 `<body>` 内部编写代码。现在是时候仔细观察我们如何使用 `<head>` 了。让我们回到任务开始时构建的第一个页面：


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>The Monk Diamond Discovery</title>

    </head>

    <body>

    <p>Bairstone 教授和 Day 博士发现了僧侣钻石。</p>

    </body>

    </html>

    ```


