  - "[PAGE 85]\n\n# MAKING JAVAS WORK WITH HTML\n\nWe've seen throughout this mission\
    \ how you can add JavaScript to your HTML web page by writing it inside the <script>\
    \ tag. But now we need to learn how to make our JavaScript code run when the user\
    \ clicks on an HTML element. If we want something to happen when user clicks on\
    \ a piece of text or an image on our page, we have to add JavaScript to our HTML\
    \ tags. Luckily there's an attribute that lets us do this.\n\n> Attributes! You\
    \ know all about them from Mission 1.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_85_0.png)\n\
    \n# The onclick Attribute\n\nIt's really easy to make a piece of JavaScript run\
    \ when the user clicks on an HTML element on your page. All you need to do is\
    \ include the onclick attribute (or the \"onclick\") in the HTML tag you want\
    \ to make interactive. Then when the user clicks on the HTML element in their\
    \ browser, the JavaScript code will run. The onclick attribute is just like all\
    \ the other attributes we've used in the missions so far. You add the attribute\
    \ to the opening tag of the HTML element you want to click on. Then you set the\
    \ value of the onclick to the piece of JavaScript you want to run, using the equals\
    \ sign (=) and double quotes (\"). Don't forget the semicolon (;). You can put\
    \ any JavaScript you want inside an onclick. Let's take a look:\n\n```\n<DOCTYPE\
    \ html>\n<html>\n<head>\n  <title>Diamond Color</title>\n</head>\n<body>\n  <p\
    \ onclick=\"alert('Green');\">\n    Click here to find out the color of the Monk\
    \ Diamond\n  </p>\n</body>\n</html>\n```"
  - '[PAGE 86]


    When the user clicks on the text between the opening and closing <p> tags, the
    JavaScript function in our onclick runs. An alert will pop up.


    > Did you know that green diamonds are extremely rare?


    We used single quotes ('''') around the argument passed to our alert function.
    This is because we had already used double quotes to set the value of the onclick
    attribute. Always use single quotes inside double quotes, or your code won''t
    run.


    ```

    Green

    OK

    ```


    # Using true and false with the Return Statement


    You can also use your onclick attribute to stop your browser from following an
    instruction in a piece of code. To do this you use a return statement in your
    onclick, and set its value to "false".


    Return is a reserved word in JavaScript. If you use a return statement and set
    it to the value "true", your browser will keep running the code. But if you use
    "false" as a value in your return statement, your browser will stop running the
    code immediately.


    > I''m worried those pesky Bond Brothers might be around—please hurry with the
    password!


    RESER WORDS are words that cannot be used as function or variable names. This
    is because they are special commands that your browser understands. You don''t
    need to put reserved words in double quotes ("").'
  - "[PAGE 87]\n\n# The onclick Attribute and Hyperlinks\n\nWe can create a very useful\
    \ piece of JavaScript with the onclick attribute and the value “false”. You can\
    \ use the onclick and the return statement to stop a hyperlink from working when\
    \ a user clicks on it. This will be very useful when we code our password later\
    \ in the mission. If the user gets the password wrong, they won't be taken to\
    \ the Monk Diamond web page.\n\nTo do this, you first create the hyperlink exactly\
    \ the same way we did at the start of the mission, using the anchor <a> tag and\
    \ the href attribute, like this:\n\n```\n<body>\n  <a href=\"monkondiamonddiscovery.html\"\
    >\n    Click here to visit the Monk Diamond web page\n  </a>\n</body>\n```\n\n\
    Then you add the onclick attribute and the return statement. Set the value of\
    \ the return statement to “false”, like this:\n\n```\n<body>\n  <a href=\"monkondiamonddiscovery.html\"\
    \ onclick=\"return false\">\n    Click here to visit the Monk Diamond web page\n\
    \  </a>\n</body>\n```\n\nUsing “false” as the value of our onclick means that\
    \ nothing will happen when the user clicks on the link.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_87_0.png)"
  - '[PAGE 88]


    # CODE SKILLS MAKING HTML CODE RUN JAVASCRIPT


    Practice using the HTML onclick attribute to run a piece of JavaScript code. Knowing
    how to do this will mean you can make HTML elements respond to the user.


    +   1. Open your text-editing program. Create a new HTML file called onclick.html.
    Type this code into your new file:


    +   2. In your <body> create a hyperlink that will take your user to Google. Use
    the anchor <a> tag and href attribute. Set the value to the Google URL. Your code
    will look like this:


    ```

    <DOCTYPE html>

    <html>

    <head>

    <title>OnClick</title>

    </head>

    <body>

    <a href="https://www.google.com">Google</a>

    </body>

    </html>

    ```


    3. Now add your onclick attribute to your opening <a> tag. Set the value of your
    onclick to a JavaScript alert. Remember to use single quotes ('''') for the alert
    argument. Your code will look like this:


    ```

    <a href="https://www.google.com" onclick="alert(''Redirecting to Google'');">

    Google</a>

    ```


    4. Save your HTML file and open it in your browser. When you click on the link,
    an alert will pop up. When you click OK, you will be taken to Google.


    5. Now stop your hyperlink from taking you to Google. Use a return statement in
    your onclick like this:


    ```

    <a href="https://www.google.com" onclick="return false;">

    Google</a>

    ```


    Save your file and refresh your page. When you click on the link, your page won''t
    connect to Google.'
  - "[PAGE 89]\n\n# CREATING YOUR PASSWORD PAGE\n\nNow that you know how to use the\
