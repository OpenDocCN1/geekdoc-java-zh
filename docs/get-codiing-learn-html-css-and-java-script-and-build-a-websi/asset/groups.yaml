    # 换行标签：<br/>


    换行标签 <br/> 允许你在新的一行开始文本，但不会开启新的段落。换行标签是一个自闭合 HTML 标签（self-closing HTML tag）。因为屏幕上没有内容需要显示，所以换行标签是一个单一标签。在这个示例中，我们同时使用了
    <p> 标签和 <br/> 标签来改变文本的显示方式：


    ```html

    <body>

    <p>Professor Bairstone and Dr. Day have made a sensational discovery.<br/>

    Professor Bairstone is the world’s leading explorer.<br/>

    Dr. Day is a scientist who studies fossils.</p>

    <p>They have discovered the Monk Diamond in a remote cave in Siberia.</p>

    </body>

    ```


    自闭合 HTML 标签是将开始标签和结束标签合为一的标签。只有某些类型的标签会这样使用。。

    - 你可以通过斜杠（/）来识别自闭合标签，它位于标签的末尾，而不是像普通的结束标签那样位于开头。


    Bairstone 教授和 Day 博士有了一项惊人的发现。

    Bairstone 教授是世界上领先的探险家。

    Day 博士是一位研究化石的科学家。


    他们在西伯利亚的一处偏远洞穴中发现了僧侣钻石。


    # 代码技能：编写段落和换行


    让我们尝试使用 <p> 和 <br/> 标签在网页中编写段落和换行代码。


    - 1. 打开你的文本编辑器。创建一个名为 `breaks.html` 的新 HTML 文件。如果你需要提醒如何进行此操作，请检查第 13-15 页的关键代码技能（Key
    Code Skills）。然后将来自 `webpagetemplate.html` 的代码复制并粘贴到你的新文件中。修改代码使其看起来如下：


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>The Monk Diamond</title>

    </head>

    <body>

    </body>

    </html>

    ```


    - 3. 在你的第一个段落中输入更多文本。在行文本的末尾添加换行标签 <br/>，如下所示：


    ```html

    <body>

    <p>The Monk Diamond has been discovered in Siberia.<br/>Professor Bairstone and
    Dr. Day were on a fossil-finding expedition.</p>

    <p>Ernest, Professor Bairstone''s dog, found the jewel.</p>

    </body>

    ```


    - 2. 使用段落标签 <p>。打开 <p> 标签，输入一些文本，然后使用结束标签 </p>。根据你的需要重复此操作。你的代码将看起来像这样：


    ```html

    <body>

    <p>The Monk Diamond has been discovered in Siberia.</p>

    <p>Ernest, Professor Bairstone''s dog, found the jewel.</p>

    </body>

    ```


    - 4. 将你的 HTML 文件保存到你的 `Coding` 文件夹中。然后在浏览器中打开你的网页。你的页面将看起来像这样：


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_29_0.png)


    # 图像标签：<img/>


    现在你已经掌握了段落和换行标签，让我们学习如何向网页中添加图像。图像 `<img>` 标签是另一个自闭合标签。在标签内部，你必须包含一个名为源（src）属性的信息。图像看起来像这样：


    ```html

    <img src="image.jpg">

    ```


    你必须在 <img> 标签中包含源属性，这样浏览器才能知道哪里找到你的图像。没有它，你的浏览器就不知道在屏幕上显示什么。你的源属性值可以是保存图像的文件名，也可以图像的
    URL（网络地址）。


    属性（Attribute）是向浏览器提供 HTML 元素额外信息的有用方法。你可以在标签中包含许多不同类型的属性。属性有两个部分：名称（name）和属性值（value）。你使用等号（=）来设置属性的值并将值放在双引号（""）中。因此，属性始终看起来这样：name="value"。属性被添加到开始标签或自闭合标签中。


    # 使用保存的图像


    如果你在 `Coding` 文件夹中保存了一张 JPEG 文件 (.jpg)，将此图像添加到你的页面非常简单。你需要将源属性的值设置为图像的文件名，使用等号（=）和双引号（""）。如果你的文件名为
    `diamond.jpg`，你的代码将看起来像：


    ```html

    <body><p>Professor Bairstone has sent us this photo of the Monk Diamond:<img src="diamond.jpg"></p></body>

    ```


    ![](img/fd182f6ecb2aea10dbd5523a70555aa_30_0.png)


    # 使用图像 URL


    如果互联网上有一个你想在网页上使用的图像，你必须将 <img> 标签中的源属性值设置为图像的 URL。在 PC 上右键点击并选择“复制图像 URL”（Copy
    image URL），在 Mac 上选择“复制图像地址”（Copy image address）找到图片的 URL。然后将 URL 粘贴到 <img> 标签中作为源属性的值。不要忘记将其放在双引号（""）中，如下：


    ```html

    <body>

    <p>This is Professor Bairstone and Dr. Day''s first expedition.</p>

    <p>Here is a photo of the team:</p>

    <img src="https://getcodingkids.com/team_photo.jpg"/>

    </body>

    ```


    ![](img/fd182f6b2aea70555aa_31_0.png)


    # 为图像命名


    如果你在页面上包含一张图像，应该始终给它一个名称。这有助于搜索引擎找到你的页面。对于可能无法下载图像的用户，名称也是很有用的。要为你的图像命名，你需要在源之后添加替代文本（alt）属性，如下：带有文本和图像的网页完整代码现在如下：


    ```html

    <img src="diamond.jpg" alt="Diamond">

    ```


    ```html

    <body>

    <p>This is Professor Bairstone and Dr. Day''s first expedition.</p>

    <p>Here is a photo of the team:</p>

    <img src="https://getcodingkids.com/team_photo.jpg" alt="The Team"/>

    </body>

    ```


    ![](img/fd182f6b2aea70555aa_31_2.png)


    - 我们代码中的引号始终是直引号的（""），而不是弯引号的（“”）。如果它们是弯引号，你的浏览器将无法识别。

    - 在网页浏览器中，如果你将鼠标悬停在浏览器中的图像上并停在那里，会弹出一个包含 alt 属性中文本的小窗口。


    # 代码技能：添加图像


    让我们尝试向网页添加一些僧侣钻石、Bairstone 教授、Day 博士和 Ernest 的图像，让它看起来更精彩。


    - 1. 转到 Get Coding 网站的图像部分。找到僧侣钻石的图像。右键点击图像并选择“图像”（Image）。将其保存为 `Coding` 文件夹中的
    JPEG 文件 (.jpg)。将其命名为 `diamond.jpg`。


    - 2. 打开你的文本编辑器并创建一个名为 `images.html` 的新 HTML 文件。然后将来自 `webpagetemplate.html` 的代码复制并粘贴到你的新文件中。修改代码使其看起来如下：保存你的
    HTML 文件并在浏览器中打开。你的图像将显示在屏幕上。


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>The Monk Diamond</title>

    </head>

    <body>

    <p>The Monk Diamond is a rare green color.</p>

    </body>

    </html>

    ```


    - 3. 现在向你的页面添加僧侣钻石的图像。在结束 </p> 标签之后添加一个带有空属性的 <img> 标签，如下：


    ```html

    <p>The Monk Diamond is a rare green color.</p>

    <img src="">

    ```


    ![](img/fd182f6b2aea70555aa_32_0.png)


    - 4. 然后为源属性添加一个值。添加你在 `Coding` 文件夹中保存的图像文件名，如下：


    ```html

    <p>The Monk Diamond is a rare green color.</p>

    <img src="diamond.jpg">

    ```


    - 5. 现在使用 URL 向你的页面添加一张 Bairstone 教授、Day 博士和 Ernest 的图像。添加另一个段落和一个带有空源的 <img>
    标签，如下：


    ```html

    <p>The Monk Diamond is a rare green color.</p>

    <img src="diamond.jpg">

    <p>The team was delighted with your discovery.</p>

    <img src="">

    ```


    - 不要忘记属性始终必须放在双引号中。


    # 代码技能继续


    - 6. 转到 Get Coding! 网站的图像部分。找到团队的照片。右键点击并根据你的系统选择“复制图像 URL”或“复制图像地址”。将 URL 粘贴到你的源属性中，如下：


    ```html

    <p>The team was delighted with their discovery.</p>

    <img src="https://getcodingkids.com/team_photo.jpg" />

    ```


    - 保存文件并在浏览器中刷新页面。你将看到第二个图像显示在屏幕上。


    ![](img/fd182f6b2aea70555aa_33_0.png)


    - 7. 最后，你需要添加两个 alt img 标签。为你的每个图像选择一个名称。你的代码将看起来如下：


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>The Monk Diamond</title>

    </head>

    <body>

    <p>The Monk Diamond is a rare green color.</p>

    <img src="diamond.jpg" alt="The Monk Diamond"/>

    <p>The team was delighted with their discovery.</p>

    <img src="https://getcodingkids.com/team_photo.jpg" alt="The Team"/>

    </body>

    </html>

    ```


    - 保存文件并刷新页面。根据你的浏览器，如果你将鼠标悬停在图像上，可能会看到 alt 属性中的文本。


    - Ernest 看起来不是很自豪吗？


    ![](img/fd182f6b2aea70555aa_33_1.png)


