  md: '# Mission Brief


    Dear Coder,


    You will be pleased to hear that we have finally made it to Moscow after a long
    journey. We are currently lying low at a secret location, as we want no one but
    Mr. Volkov to know we''ve arrived in the city with the Monk Diamond. Mr. Volkov
    came to us — he''s a charming man. I''m so happy we found his lost jewel.


    He and Professor Bairstone have been extremely busy getting everything ready for
    the exhibition. Your app has been very helpful, and so far everything is going
    according to plan. There is only one thing that Professor Bairstone and Mr. Volkov
    haven''t thought of: How do we safely transport the diamond from our secret location
    to the House of Volkov?


    The Bond Brothers have been known to ambush and rob courier vans transporting
    expensive jewelry in daring heists. I''m sending you an entry from the Explorer''s
    Encyclopedia so you can see what I mean. We could deliver the diamond to the shop
    ourselves, but Professor Bairstone is such a famous figure that I''m worried we
    will draw attention to ourselves and therefore the exhibition plans.


    We''ve decided that the best thing to do would be for me to take the diamond to
    Gorky Park. Mr. Volkov''s head of security will be waiting for me, and together
    we will take the diamond to the House of Volkov, which is right next to St. Basil''s
    Cathedral. Would you be able to help us by planning a route through the city?
    It would be really helpful to have a web page with map embedded in it. It would
    be terrible if we got lost or were duped by the Bond Brothers going into the wrong
    way. Imagine if we lost the Monk Diamond now!


    Thank you for helping us again. Everything is so nearly ready. We''ve just had
    the invitations for the exhibition printed and they are now ready to be sent to
    the guests. I''m sending you one too!


    Very best wishes from our city hideaway,

    Dr. Ruby Day


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_138_0.png)'
