  md: '# BUILDING A GAME


    Now that you''ve read the brief for Mission 5, you''re ready to start building
    your game. This mission works in a slightly different way from the missions you
    have completed so far. You are going to build the game as you work through the
    mission. Follow the step-by-step instructions and copy the code, and you''ll have
    the game ready for Professor Bairstone in no time.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_159_0.png)


    # 1. create an HTML file


    Just like in all the other missions, the first thing we need to do is create a
    new HTML file. Call your HTML file securitygame.html. Copy this code into your
    text-editing program:


    ```

    <DOCTYPE html>

    <html>

    <head>

    <title>Security Game</title>

    </head>

    <body>

    </body>

    </html>

    ```


    Save your HTML file in your Coding folder on your desktop.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_159_1.png)


    # 2. Build the game board


    Now we need to build the basic structure of our game. We need to code a game board
    in our web page. The game board will be the area in our browser where the game
    will work. When the security team plays the game, the guests and thieves will
    appear on the game board.


    Add your game board by coding an empty <div> in the <body> of your page. Add an
    id to attribute your <div>. Your <body> code will look like this:


    ```

    <body>

    <div id="board">

    </div>

    </body>

    ```


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_159_2.png)'
