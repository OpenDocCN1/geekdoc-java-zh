  md: "# 9. Animate the characters\n\nWe now need to apply our two new CSS classes\
    \ (hidden and visible) to our game loop so the character <div> tags become animated.\
    \ To do this, we need our game loop to add and remove the new CSS classes to and\
    \ from our <div> tags.\n\nWhen our game runs, we want our characters to flash\
    \ on and off the screen. We're currently looping around 12 times, so the character\
    \ <div> tags needs to be visible for 6 loops and invisible for 6 loops to create\
    \ the flashing effect. The first thing we need is a new variable called peopleVisible\
    \ to store this information. We need to set this variable to false, like this:\n\
    \n```\nvar peopleVisible = false\n```\n\nWe need the variable to be set to false\
    \ at the start so that the character <div> tags start off hidden on our screen.\
    \ Then when the variable is set to true, the characters de-visible] will appear\
    \ on our screen.\n\nWhen the game loop runs, we want the value stored in our new\
    \ variable to alternate between true and false. To do this, we have to use another\
    \ JavaScript operator, called the not operator (!). We can use the not operator\
    \ (!) to change the value of your variable.\n\nLet's look at how we use the not\
    \ operator (!) in our <script> block. Type these new pieces of code into your-text-editing\
    \ program and save your file.\n\n```\n<script>\nfunction startGame() {\n  gameLoop();\n\
    }\nvar peopleVisible = false;\nfunction gameLoop() {\n  peopleVisible = !peopleVisible;\n\
    \  loops++;\n  if(loops < 12) {\n    setTimeout(gameLoop, 3000);\n  }\n  else\
    \ {\n    alert(\"Game over!\");\n  }\n}\n</script>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_173_0.png)"
  merge: -1
  pgno: 173
- img_proc: true
  md: 'We have used the not operator (!) to alternate the value of our new variable.
    If the value of our variable is false, when the variable runs in our gameLoop
    function, the not operator (!) will change its value to true. And if the value
    of our variable is true, when the variable runs, the not operator (!) will change
    its value to false.


    Every time our loop runs, the loops variable will go up by one and the peopleVisible
