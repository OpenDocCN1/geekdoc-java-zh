  md: '# DO-IT-YOURSELF TASK

    PLAN A ROUTE


    Great work! You’ve learned how to use a web API and Google Maps to embed content
    in your page. Now use your new knowledge to plan a route through Moscow, from
    Gorky Park to St. Basil’s Cathedral. Having a route will help Dr. Day keep the
    Monk Diamond safe.


    # Moscow Route Planning Brief


    When you plan your route, use your new Code Skills to do the following things:


    +   - **Use an API key**: use the Google Maps Embed API to get an API key.

    - **Create an <iframe>**: use this new HTML tag so you can embed content in your
    page.

    - **Change the way you <iframe> displays**: use attributes to change the height,
    width, and borders of `<iframe>`.

    - **Use the source attribute**: embed a URL that will connect to the web API you
    need.

    - **Use the Google Maps Embed API**: create a Google Map using the Google API.

    - **Use the built-in direction function**: plot a route using this function.

    - **Set query string parameters**: give the destination function the origin and
    destination for your route.


    Save your file in your **Coding** folder and call it **route.html**.'
