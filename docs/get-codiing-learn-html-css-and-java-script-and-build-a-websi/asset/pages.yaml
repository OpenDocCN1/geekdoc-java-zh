  md: '# CODE SKILLS LINKING WEB PAGES


    Let''s learn how to use hyperlinks to link two web pages and build a very simple
    website.


    +   1. Open up your text-editing program. Create a new HTML file called page1.html.
    Make sure it is saved in your Coding folder. Type this code into your new file:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Page 1</title>

    </head>

    <body>

    </body>

    </html>

    ```


    +   3. Now create a hyperlink that connects your first page to your second page.
    On your first page, add the <a> tag with an href attribute. Set the value of the
    href to the name of your second page. Then add some text between the opening and
    <a> tags to make your hyperlink, like this:


    ```

    <body>

    <a href="page2.html">Page 2 </a>

    </body>

    ```


    +   2. Create a second HTML file called page2.html. Make sure it is saved in your
    Coding folder. Then copy and paste your code from page1.html into your new file.
    Modify the code so it looks like this:


    +   4. Now open your second page. Create a hyperlink that takes you back to your
    first page. Your code will look like this:


    ```

    <body>

