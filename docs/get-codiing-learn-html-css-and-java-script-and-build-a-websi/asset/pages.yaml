- img_proc: true
  md: "Then in your <head> add a CSS class that will change the look of your <div>.\
    \ Use a CSS selector, called the id selector, to find your <div> by its id attribute.\
    \ CSS selectors are an easy way to select various groups of elements to style.\
    \ Using the CSS id selector is simple. All you have to do is create a class name\
    \ using a hash (#) and the id attribute of the HTML element you want to change.\n\
    Create a CSS class called board that sets the CSS properties and values of your\
    \ <div> to these things. The code for the CSS class in your <head> needs to look\
    \ like this:\n\n# The game board needs:\n\n+   - A 1px solid black border\n- A\
    \ gray background\n- A height of 350px\n- A width of 650px\n\n```\n<head>\n<title>Security\
