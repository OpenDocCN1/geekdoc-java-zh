  md: '# DO-IT-YOURSELF TASK

    BUILD A TO-DO LIST APP


    Now use all the new skills you’ve learned in this mission to build the to-do list
    app Professor Bairstone needs for the Monk Diamond special exhibition. Use JavaScript
    with the DOM and localStorage APIs to make a to-do list that Professor Bairstone
    can add items to. Make sure that when he completes a task, he can click on the
    item to remove it from the list.


    # The To-Do List App Brief


    When you code your app, use HTML and JavaScript and the new APIs. Make sure you
    include these things:


    +   * A function that adds an item to the list using the DOM

    * A function that removes an item from the list using the DOM

    * A function that saves the list using localStorage

    * A function that loads the list using localStorage

    * A text box the user can type the items into

    * A button that the user can click to add an item to the list


    Save your file in your Coding folder and call it listapp.html.


    > Turn the page to see the entire code block you need for your app!


    > Don''t forget to use the Get Coding! website if you need help.'
