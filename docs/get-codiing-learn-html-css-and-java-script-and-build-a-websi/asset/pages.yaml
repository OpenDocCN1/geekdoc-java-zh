    \ this important information:\n\n| Parameter key | What does it do? | Example\
    \ value |\n| --- | --- | --- |\n| q | Gives the location you want to search for\
    \ | Moscow, London |\n| key | Gives the API key needed to access the Google server\
    \ | API-KEY |\n\nThe Google Maps Embed API needs these two parameters to find\
