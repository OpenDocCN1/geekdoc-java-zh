  md: '# # Mission Brief


    Dear Coder,


    We think you''ll be pleased to hear that the special exhibition at the House of
    Volkov was a resounding success! We want to thank you all for your help and hard
    work. When Mr. Volvo unveiled the Monk Diamond to the guests, everyone was amazed.
    It was the proudest moment of our careers.


    The evening was not without drama, though. As we feared, the Bond Brothers had
    found out about the diamond. They disguised themselves as guests and used false
    invitations to gain access to the exhibition. Luckily, they got inside, a member
    of the security team immediately noticed that they were behaving suspiciously
    near the diamond''s glass case. Mr. Volvo intervened, and the police were called
    just in time. Thanks to you, the Bond Brothers are now behind bars.


    The news about the Monk Diamond spread quickly and caused quite a stir, both in
    Moscow and around the world. Mr. Volvo is so delighted to have it back in its
    rightful home that he wants to open the special exhibition to the public. Now
    that we know the security team is up to the challenge, we think it''ll be a great
    show. And if people in Moscow like the exhibition, Mr. Volvo is thinking about
    taking it on a tour around the world. The House of Volkov has a very exciting
    future ahead.


    There''s only one thing left to do, and we would like you to help. Mr. Volvo needs
    to build a website (not just a web page) that will tell everyone, all over the
    world, about the exhibition. We hope we can rely on you one last time! Who knows?
    Perhaps you''ll be able to come and see the Monk Diamond one day! We''d love to
    meet you and thank you in person.


    Warmest celebratory wishes from the House of Volkov,

    Professor Harry Birstowne, Dr. Ruby Day, and Ernest


    P.S. Attached are Professor Birstowne''s latest entry on the Explorer''s Encyclopedia
    and a note from Mr. Volkov.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_192_0.png)'
