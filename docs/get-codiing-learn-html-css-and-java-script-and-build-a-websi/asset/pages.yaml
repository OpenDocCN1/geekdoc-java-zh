  md: "# 16. Use images for the characters\n\nIf we want to make our character <div>\
    \ tags a bit more exciting, we're going to have to learn some new CSS properties.\
    \ The new properties are very simple and work in exactly the same way as the ones\
    \ you learned in Mission 1.\nFirst of all, go to the Get Coding! website and find\
    \ these two images:\\Save these images with all your other HTML files in your\
    \ Coding folder on your desktop. You've done this before in Mission 1, so go back\
    \ to pages 28-30 if you need a reminder.\nNow we're going to change the CSS classes\
    \ in our <style> block. We're going to use two new CSS properties: the background\
    \ and background-size CSS properties.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_185_0.png)\n\
    \n| CSS property | What does it do? | Example values |\n|---|---|-|\n| background\
    \ | Sets the background of an HTML element to an image | url('image.jpg'), none\
    \ |\n| background-size | Sets the size of the background image in an HTML element\
    \ | cover, 650px |\n\nWe can use these two new CSS properties in our character\
    \ and thief CSS classes, like this:\n\n```\n.character {\n  background: url('guest.jpg');\n\
    \  background-size: cover;\n  width: 120px;\n  height: 120px;\n  padding: 10px;\n\
    \  margin: 10px;\n  float: left;\n}\nthief {\n  background: url('thief.jpg');\n\
    \  background-size: cover;\n}\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_185_1.png)"
  merge: -1
