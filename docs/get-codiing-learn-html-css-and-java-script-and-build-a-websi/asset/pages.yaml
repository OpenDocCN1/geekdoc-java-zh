  md: "# More Than One CSS class\n\nIf you want to make your CSS really effective,\
    \ it's best to split your CSS classes into groups of properties. This way, when\
    \ you are designing and laying out a web page, you can apply more than one CSS\
    \ class to your HTML element. It's really easy to use more than one CSS class\
    \ at a time. All you have to do is add the names of the different classes to your\
    \ class attribute. Let's take a look:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    <title>The Monk Diamond</title>\n<style>\n.header {\n  background-color: lightgreen;\n\
    \  width: 70%;\n  height: 50%;\n}\n.text {\n  text-align: center;\n  font-size:\
    \ 18pt;\n}\n.padding {\n  padding: 25px;\n}\n</style>\n</head>\n<body>\n<div class=\"\
    header text padding\">\nThe Monk Diamond<br>\nAn incredible discovery\n</div>\n\
    </body>\n</html>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_56_0.png)\n\n\
    # Using CSS classes to Select HTML Elements\n\nAnother handy thing you can do\
    \ with CSS classes is use to change the CSS properties of a type of HTML element.\
    \ To do this, you use something called the element selector. To use the element\
    \ selector, you use the name of the element you want to change as the name of\
    \ your CSS class. You shouldn't include the dot before the name of your CSS class.\
    \ You also don't need to include a class attribute in the `<body>`.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_56_1.png)"
