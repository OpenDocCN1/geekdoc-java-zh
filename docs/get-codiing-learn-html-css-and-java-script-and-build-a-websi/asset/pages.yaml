  md: "# 7. use the game loop to stop the game\n\nNow that we've added our characters\
    \ to the game board, we need to make some changes to our game loop. At the moment,\
    \ it pops up an alert every 3 seconds. We need to change our loop so it will stop\
    \ after a certain period of time. We're going to do this by counting how many\
    \ times we loop. When our loop has run a certain number of times, our game will\
    \ end.\n\nTo count our loops, let's create a variable that will increase in value\
    \ every time it's called. To do that, we should code a variable called loops that\
    \ is set to the value 0. Add this variable to your <script> block before your\
    \ gameLoop function, like this:\n\n```\n<script>\nfunction startGame() {\n  gameLoop();\n\
    }\nvar loops = 0;\nfunction gameLoop() {\n  alert(\"Game over!\");\n  setTimeout(gameLoop,\
    \ 3000);\n}\n</script>\n```\n\nWe need to use this variable in our gameLoop function.\
    \ We want to add 1 to its value every time the function is called. To do this,\
    \ we could code like this:\n\n```\nloops = loops + 1;\n```\n\nHowever, we can\
    \ actually use a new JavaScript operator to write the same instruction in a simpler\
    \ and shorter way. It's called the increment operator (++), and it's just like\
    \ the operators we learned about Mission 2. We can use the increment operator\
    \ (++) to add 1 to the value of our variable. All we have to write this is:\n\n\
    We can use the increment operator (++) in our gameLoop function to count how many\
    \ times our loop has been called. Remove the alert from your gameLoop function\
    \ and replace it with your new piece of code, like this:\n\n```\nfunction gameLoop()\
    \ {\n  loops++;\n  setTimeout(gameLoop, 3000);\n}\n```\n\n> This gives me paws\
    \ for thought!\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_169_0.png)"
