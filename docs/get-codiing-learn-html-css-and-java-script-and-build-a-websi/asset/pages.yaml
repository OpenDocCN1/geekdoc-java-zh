  md: "# 15. designing the game with css\n\nWe've got the basic structure of our game\
    \ working now, but it doesn't look very fun on screen. Let's use our CSS skills\
    \ from Mission 1 to design it. First let's see if we can make our thief look more\
    \ distinctive when or she flashes up on screen. Let's add a new CSS class called\
    \ thief to our <style> block, like this:\n\n```\n.character {\n  background-color:\
    \ lightblue;\n  width: 120px;\n  height: 120px;\n  padding: 10px;\n  margin: 10px;\n\
    \  float: left;\n}\n.thief {\n  background-color: red;\n}\n```\n\nThen we need\
    \ to apply this CSS class to our JavaScript. Every time the thief is added, we\
    \ need to add this new CSS class. To do that, we need to make this change to our\
    \ code:\n\n```\nvar randomNumber = Math.floor(Math.random() * 6) + 1;\nboard.children[randomNumber-1].innerHTML\
    \ = \"thief\";\nboard.children[randomNumber-1].onclick = function() {\n  gameScore++;\n\
    }\nboard.children[randomNumber-1].className = classToSet + \" thief\";\n```\n\n\
    Every time our game loop runs, this will apply our thief CSS class to our `<div>`\
    \ and make it red. Save your HTML file. Your thief will be different from the\
    \ guests.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_184_0.png)\n\n> did you\
    \ notice?\nThere is a space in the code \"thief\". This space is essential because\
    \ we are using two CSS class names: the CSS class we've picked using our classToSet\
    \ variable (hidden or visible), and the CSS class thief. We need the space so\
    \ it doesn't end up as \"hiddenthief\"."
