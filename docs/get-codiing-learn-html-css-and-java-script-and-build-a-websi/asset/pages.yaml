    \n> Hooray! The diamond will surely be safe now!\n\n# 14. Simplify the code\n\n\
    Our game works, and the House of Volkov’s security team can soon begin their training.\
    \ But you might have noticed that our createCharacters and flashCharacters functions\
    \ are quite similar. One creates our characters and the other adds a CSS class\
