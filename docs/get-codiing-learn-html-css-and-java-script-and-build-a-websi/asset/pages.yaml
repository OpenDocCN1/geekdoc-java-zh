  md: '# CODE SKILLS USING VARIABLES AND OPERATORS


    Variables and operators are important parts of the JavaScript programming language.
    Let''s code some simple JavaScript programs using them.


    +   Before we can write any JavaScript, we need to create an HTML file with a
    <script> tag in the <body>. Open up your text-editing program. Create a new HTML
