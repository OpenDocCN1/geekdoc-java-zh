    # 4. create a JavaScript timer


    Our game is going to test the reaction times of the security team at the House
    of Volkov. For our game we need to learn how we can use JavaScript to run a piece
    of code again and again, after a certain period of time has passed. This is called
    a timer.


    JavaScript has a built-in timer function called setTimeout, which allows you to
    call a function after a given amount of time has passed. All you have to give
    the setTimeout function the name of the function you want to call and the amount
    of time as arguments. As you know from Mission 2, you pass a function an argument
    by putting the argument in parentheses. This time we are passing the function
    two arguments. Let''s look at how you would use setTimeout to call a function
    after a certain time.


    In this example, the gameTimer function will be called after 1 second, or 1000
    milliseconds.


    ```

    setTimeout(function to call, amount of time to call it after)

    setTimeout(gameTimer, 1000);

    ```


    > Did you notice?

    nYou have to use milliseconds with the setTimeout function. There are 1,000 milliseconds
    in a second. To work out the number of milliseconds you need, multiply the number
    of seconds by 1,000. So if you wanted your function to be called after 3 seconds,
    you would multiply 3 by 1,000.


    > Turn the page to practice using the setTimeout function!


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_162_2.png)'
