    code, go to the website and see what your code block should look like. You can
    en copy and paste the code blocks from the website into your text-editing program.


    The Get Coding! URL is www.getcodingkids.com.


    +   On the website you will find:

    - Professor Bairstone''s entries on the Explorer''s Encyclopedia

    - Pictures of Professor Bairstone, Ernest, D. Day, and the Monk Diamond

    - Code blocks for each Skill exercise and Do-It-Yourself Task


    > Some of these steps vary depending on the system you''re using. If you''re having
    trouble, do an online search for how to write HTML in the version of the program
    you''re using.


