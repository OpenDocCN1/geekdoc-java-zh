  md: '# Mission Brief


    Dear Coder,


    I''m Dr. Ruby Day, the scientist on the expedition with Professor Baistone. We
    were hoping to discover dinosaur fossils. Instead we found the stolen Monk Diamond!


    I want to tell you about a strange event. Yesterday we were examining the cave
    where we found the diamond. I heard a rumbling noise, and Ernest started barking
    frantically. We looked up and saw a massive boulder rolling over the edge of the
    cliff above the cave! We jumped out of the way just in time, as the boulder landed
    exactly where we were standing. In the commotion, Professor Baistone tripped and
    sprained his ankle.


    Professor Baistone and I agree that the boulder falling is very suspicious. It
    seems too much of a coincidence for it to have happened just after we discovered
    a valuable stolen diamond. Professor Baistone is convinced that the thieves have
    found out exactly about our expedition and are trying to scare us off. He thinks
    the boulder is exactly the kind of tricky trick that the Bond Brothers, the main
    suspects in the Monk Diamond heist, would try.


    We would leave the mountains now to take the diamond to safety, but unfortunately
    Professor Baistone''s sprained ankle means he can''t make the treacherous descent
    just yet. While we are stuck in the mountains, I think the news about the diamond
    needs to remain top secret. I am worried that the web page built for Professor
    Baistone could be accessed by the Bond Brothers and our safety compromised. Please
    could you add a password to the web page so that for now only Professor Baistone
    and I can view the page? Use Ernest300 as the password.


    Thank you for all your help and hard work.


    Very best wishes from the dangerous mountains,

    Ruby Day


    P.S. Prof. B. has asked me to send you this entry from the Explorer''s Encyclopedia.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_62_0.png)'
