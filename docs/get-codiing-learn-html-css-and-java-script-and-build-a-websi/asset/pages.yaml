  md: '# ADDING CONTENT USING A WEB API


    Now that you''ve read the Mission Brief and know what Dr. Day needs you to do,
    let''s get coding! This will be a bit different from what you''ve done in the
    other three missions, but don''t worry. The great thing about... learning to build
    web pages or apps that use the Internet is that you don''t always have to do the
    hard work yourself.


    It might sound like a challenge to create a web page with a map embedded in it,
    but we don''t have to code the map from scratch. All we have to do is write some
    code to call a URL on the Internet that has the map we need. Programmers call
    this integrating one web page with another.


    When we want to integrate our web page with another website, we will have to write
    some code that will connect our page to the web server that stores the other website.
    We can then access the data and content that we need on that server.


    > When a new piece of content is inserted into an existing web page, we say it
    is EMBEDDED the page. The embedded content becomes part of the page.


    # Web APIS


    You already know what an API is and have used two of them in Mission 3: the DOM
    and localStorage APIs. Those APIs let you access some handy builtin functions.
    APIs come in all shapes and sizes, and the API that we need to embed a map in
    this mission is slightly different from those we have used already.


    APIs used to integrate with other websites are sometimes called web APIs or web
    services. They let you access a website''s built-in features and functions, so
    you can add extra content to your page without having to write lots of code.


    You can use web APIs for lots of different things when you''re building a website.
    You might have come across some of these web APIs on websites, which will help
    you do these things:


    +   - Add maps

    - Add Like or Share buttons for Facebook

    - Share videos on YouTube and Twitch'
