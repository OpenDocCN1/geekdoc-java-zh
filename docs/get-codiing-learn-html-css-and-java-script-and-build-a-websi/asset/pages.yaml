  md: '# ABOUT THIS BOOK


    Hello! We’re Young Rewired State, a worldwide community of digital makers age
    eighteen and under. We’ve made this book because we want to you to become a technology
    star of the future. We hope that Get Coding! will not only teach you how to code
    but also show you how fun and exciting it can be. Coding is one of the most important
    skills young people can learn, and there’s never been a better time to master
    it.


    # what does this book teach you?


    This book teaches you how to code using three essential programming languages:
    HTML, CSS, and JavaScript. A computer can be made to do almost anything, but first
    someone has to write a program for it to follow. Programs have to be written in
    languages a computer can understand. Coding is all about learning to write programs
    in these different languages.


    HTML, CSS, and JavaScript are three of the most important programming languages
    in the world. They are used by web developers to build the websites and web-based
    apps and games you use every day. This book will teach you how to write code and
    build programs using these programming languages. In this book you will learn
    real-coding skills you can use to do all kinds of programming.


    Find out more about Young Rewired State. www.yrs.io www.getcodingkids.com'
  merge: -1
