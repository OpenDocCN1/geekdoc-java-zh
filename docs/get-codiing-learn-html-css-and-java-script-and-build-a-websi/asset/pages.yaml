  md: "# ELSE STATEMENTS\n\nElse statements are used with if statements to make web\
    \ pages even more interactive. You use an else statement after an if statement\
    \ to change which block of code is run by your browser. If the condition of your\
    \ if statement is false, your browser will run the alternative else statement.\n\
    \nElse statements are written in exactly the same way as if statements – you just\
    \ have to use the else keyword instead. You put the code you want to run inside\
    \ braces ({}). Let's take a look at an example of an if statement and an else\
    \ statement working together:\n\n```\n<script>\n  var name = \"Tony Twinkles\"\
    ;\n  if(name == \"Dr. Day\") {\n    alert(\"Access Granted!\");\n  } else {\n\
    \    alert(\"Access Denied!\");\n  }\n</script>\n```\n\nIf we run this code in\
    \ our browser, an alert will pop up. The value in our variable is the name of\
    \ one of the Bond Brothers and not equal to (==) Dr. Day. Because the condition\
    \ of the if statement was false, our browser ran the else statement. But if the\
    \ value of our variable had been equal to (==) Dr. Day and the condition of our\
    \ if statement had been true, the else statement would not have run. The if statement\
    \ would have run instead, and the \"Access Granted\" alert would have popped up.\n\
    \n![](img/fd182f6ecb2aea108dbd5523a70555aa_78_0.png)\n\n> That's a clever way\
    \ to stop the Bond Brothers!"
