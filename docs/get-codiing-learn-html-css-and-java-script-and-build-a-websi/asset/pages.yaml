  md: "# Removing More Than One HTML Element\n\nYou're making great progress! Now\
    \ you can remove an HTML element using removeChild method. But what happens if\
    \ Professor Baillargeon wants to remove more than one item from his list? We need\
    \ to use the DOM and JavaScript so all the items can be removed from the list\
    \ when they're clicked. To do this we need to add an onclick attribute every time\
    \ we use the createElement method. You can use a DOM method to set the onclick\
    \ using the onclick keyword:\n\nWe can then set our onclick to call a function\
    \ that will remove the item when it is clicked, like this:\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_124_0.png)\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>To-Do List App</title>\n<script>\n\
    function addItem() {\n  var newItem = document.createElement(\"div\");\n  newItem.innerHTML\
    \ = document.getElementById(\"box\").value;\n  newItem.onclick = removeItem;\n\
    \  document.getElementById(\"list\").appendChild(newItem);\n}\nfunction removeItem()\
    \ {\n  document.getElementById(\"list\").removeChild(this);\n}\n</script>\n</head>\n\
    <body>\n<p>Special Exhibition To-Do List</p>\n<input type=\"text\" id=\"box\"\
    \ value=\"Type here to add task\"/>\n<br/>\n<input type=\"button\" value=\"Add\
    \ item\" onclick=\"addItem();\"/>\n<div id=\"list\"></div>\n</body>\n</html>\n\
    ```\n\nIn this example, we've created a new <div> using createElement. We've stored\
    \ the <div> in a variable so we can set its innerHTML to whatever item has been\
    \ typed into the text box. We then use the DOM to set the onclick attribute of\
    \ the new item. When this item is clicked, it will call the removeitem function\
    \ and remove it from the list."
