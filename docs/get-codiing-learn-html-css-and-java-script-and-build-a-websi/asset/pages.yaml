  md: '# VIKKTOR VOLKOV

    The House of Volkov, near St. Basil''s Cathedral, Moscow


    Dear Coder,

    Just wanted to write a short note to say thank you, it is much

    for all you have done to bring the Monk Diamond back to the

    House of Volkov. I was heartbroken when it was stolen, and in\my darker moments
    I thought I would have to sell the business.

    The House of Volkov has been run by my family, for generations,

    it and would have been deactivating. But thanks to you, Professor

    Bairstone, Dr. Day, and Ernst, the Monk Diamond has been

    returned. I am delighted to be hosting the exhibition and have the

    jewel on display in the store.


    As you, a reward was offered for its safe return or the

    capture of the Bond Brothers. Professor Bairstone and Dr. Day,

    have taken their share and are going to use it to fund another

    expedition together. I want you to know that I also have a token of

    gratitude to give to you, it will be waiting for you when you come

    to Moscow to see the Monk Diamond for yourself.


    With very warm and kind regards,

    Viktor Volkov


    Professor Bairstone is known for discovering ancient artifacts around the world.
    He is always accompanied on

    his expeditions by Ernest, his dog before finding the Monk Diamond, his most notable
    discovery was the Hoy-

    Hoard of Viking treasure, which he unearthed at the Orkney Islands in Scotland.

    Dr. Day is a scientist who studies fossils. She is currently researching a new
    species of feathered dinosaur

    has been on several different experiments in the hope of discovering fossils to
    prove that this has feathers.

    The news of the diamond''s recovery has made headlines all over the world, and
    the team has been between

    any news outlets. Professor Bairstone has been invited to give lectures about
    the discovery, and his

    iology will be published next year. Dr. Day has made a senior fellow at her university.

    A special exhibition featuring the recovered gem at the House of Volkov has been
    very popular. Mr. Volkov

    toll reporters here were "delighted by the return of the diamond and the success
    of the exhibition." Lines of up to

    two hours were reported, and sales have more than doubled.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_194_0.png)'
