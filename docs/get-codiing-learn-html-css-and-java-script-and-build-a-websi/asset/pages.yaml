  md: '# USING CSS CLASSES


    You might have noticed that adding lots of CSS properties to our HTML tags have
    made our lines of code long and difficult to read. It also takes time to type
    in the same CSS properties over and over again. To save time and make our code
    look better, we now need to learn how to use CSS classes. CSS classes help you
    organize the CSS in the `<body>` of your page.


    on your page. Programmers use CSS classes to keep their code as simple as possible.
    It''s really important to do this when you are coding, as it means you are less
    likely to make mistakes. If, for example, you know that all want the text in every
    `<div>` on your page to be a certain color and font size, rather than having to
    type the CSS properties into every `<div>`, you can use a CSS class to change
    all the `<div>` tags on your page at once.


    A CSS class is a very handy way of applying a group of CSS properties to any HTML
    element


    # Using the <head> Tag


    So far we''ve mostly been coding inside the `<body>` of our page. It''s now time
    to take a closer look at how we can use the `<head>`. Let''s go back to the first
    page we built at the beginning of the mission:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>The Monk Diamond Discovery</title>

    </head>

    <body>

    <p>Professor Bairstone and Dr. Day have discovered the Monk Diamond.</p>

    </body>

    </html>

    ```


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_49_0.png)


    In every page we''ve built so far, the `<title>` tag has been nested inside the
    `<head>`. The content between the opening and closing `<title>` tags doesn''t
    appear in the main `<body>` when we view it in our web browser.


    We are going to add our CSS classes to the `<head>` tag. This is because it is
    the best place to put information for our browser that we don''t want to see drawn
    in the main `<body>` of the page.'
