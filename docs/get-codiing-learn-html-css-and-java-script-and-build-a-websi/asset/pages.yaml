  md: '# # USING HYPERLINKS


    In the Mission Brief, Dr. Day asked you to create a password. The password will
    keep the Bond Brothers from finding out the discovery of the Monk Diamond. In
    this mission, you are going to learn how to make the password.


    that asks the user to enter the password to the web page built for Professor Bairstone.


    Hyperlinks (or links, as they are normally known) are found on most web pages
    and are essential for creating the groups of web pages we call websites. A hyperlink
    can be a word, number, phrase, or image that you click on. When you click on the
    link, your web browser takes you to either a different place in your current web
    page or a completely new web page.


    We have to use a new programming language called JavaScript to make the password.
    But before we first need to learn how to use HTML to link two web pages. We need
    to be able to link the web page


    # # The Anchor Tag: `<a>` and `</a>`


    Hyperlinks are made using an HTML tag called the anchor <a> tag. The opening tag
    is `<a>` and the closing tag is `</a>`. Inside the opening `<a>` tag you have
    to include an `href` attribute. The `href` attribute contains the URL (or web
    address) your browser needs to link to the new web page. Let''s take a look:


    | anchor tag | href attribute | URL | hyperlink text |


    ```

    <a href="https://www.monkdiamonddiscovery.com">Diamond Discovery</a>

    ```


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_65_0.png)


    We''ve set the value of our `href` attribute to the URL for the Monk Diamond Discovery
    page. We''ve done this in exactly the same way as we set the values of all the
    attributes in Mission 1: by using the equals sign (=) and double quotes ("") to
    enclose it. The text between the opening and closing `<a>` tags becomes your link.
    When you click on this text, you will be taken to the Monk Diamond page.'
