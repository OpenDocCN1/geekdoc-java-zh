  md: '# CODING WITH HTML


    Now that you''ve read the Mission Brief, it''s time to get coding. Build Professor
    Baistone''s web page, you''re first going to need to write HTML (HyperText Markup
    Language). HTML is the programming language used by programmers to build websites.
    It allows you to give your browser instructions. Use HTML to add text and images
    to a web page. You also use it to group pieces of information into lines, paragraphs,
    or sections.


    An HTML web page is called a document. It''s made up of HTML elements. Elements
    are created using small pieces of code tags. Tags always come in pairs and surround
    every piece of content (like a piece of text or an image) on the page. Each tag
    contains an instruction for your web browser, telling it how to show the element
    on-screen. This is why HTML is called a markup language. Use tags to mark up each
    piece of content with an instruction for your browser.


    # HTML Tags


    Each tag is made up of a piece of code surrounded by two angle brackets (<). The
    angle brackets are on the same keys as the period and comma symbols on your keyboard.
    Let''s look at an example of a tag:


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_23_0.png)


    ```

    <Professor Baistone and Dr. Day have discovered the Monk Day.</p>

    ```


    ```

    opening tag

    ```


    ```

    closing tag

    ```


    This is the paragraph <p> tag. When tags come in pairs, we call the first tag
    the opening tag and the second tag the closing tag. You can spot a closing tag
    because it contains a forward slash (/). When your browser reads this code, it
    understands you are telling it to group the text between the opening and closing
    <p> tags into a paragraph.


    To create a web page, you have to create an HTML file in a text-editing program.
    Your browser expects some tags to appear in a certain order. You need to code
    the tags that contain instructions about the whole page first. Then you code the
    tags with instructions for specific pieces of content on your page. Tags can be
    put inside other tags. You just have to remember to close each tag when you''ve
    finished with it.'
