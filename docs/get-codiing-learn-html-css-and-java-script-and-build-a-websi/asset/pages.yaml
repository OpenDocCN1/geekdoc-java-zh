  md: "# Using the class Attribute\n\nApplying a CSS class to an HTML element in the\
    \ <body><body>` of our code is really simple. We just add the name we have chosen\
    \ for our CSS class to the opening HTML tag for the element we want to change.\
    \ Rather than using the style attribute, we now use the new class attribute. The\
    \ class attribute is written and works exactly the same way as all the other attributes\
    \ we've used so far in this mission. Let's see what we have to do with our CSS\
    \ class to HTML elements on our page:\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <title>The Monk Diamond Discovery</title>\n  <style>\n    .text {\n      text-align:\
    \ center;\n      font-size: 18pt;\n      background-color: aqua;\n    }\n  </style>\n\
    </head>\n<body>\n<p class=\"text\">The Monk Diamond Discovery</p>\n<p>The Monk\
    \ Diamond has been discovered in the mountains of Siberia.</p>\n<p class=\"text\"\
    >The discovery is of great international significance.</p>\n<p>The team was looking\
    \ for fossils.</p>\n<p class=\"text\">Not one of the world's most famous jewels.</p>\n\
    </body>\n</html>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_51_0.png)\n\n\
    In the class attribute, we have used our name for the CSS class (text) as the\
    \ value. We haven't included the dot (.) at the beginning. As with all the other\
    \ attributes, we have used an equals sign (=) and double quotes (\") to set its\
    \ value. Look at how using a CSS class and the class attribute easily changed\
    \ the layout of our page!\n\n| The Monk Diamond Discovery |\n| The Monk Diamond\
    \ has been discovered in the mountains of Siberia |\n| The discovery is of great\
    \ international significance. |\n| The team was looking for fossils. |\n| Not\
    \ one of the world's most famous jewels. |"
