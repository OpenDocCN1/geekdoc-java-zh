  md: "# 12. create the thief\n\nAt the moment in our game, every 3 seconds, our characters\
    \ flash on and off the screen. What we need to do now is change the position of\
    \ our characters onscreen every time our game loop runs. Every 3 seconds, the\
    \ characters need to move to a different place on the game board. And we need\
    \ to make one of the characters thief.\n\nWe first need to add a function that\
    \ creates a new set of characters, in different positions, every time game loop\
    \ runs. Let's call this function createCharacters. Start by adding the function\
    \ in your gameLoop function, like:\n\n```\nfunction gameLoop() {\n  peopleVisible\
    \ = !peopleVisible;\n  createCharacters();\n  flashCharacters();\n  loops++;\n\
    \  if (loops < 12) {\n    setTimeout(gameLoop, 3000);\n  }\n  else {\n    alert(\"\
    Game over!\");\n  }\n}\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_179_0.png)\n\
    \nThen code the new createCharacters function before your flashCharacters function:\n\
    \n```\nfunction createCharacters() {\n  var board = document.getElementById(\"\
    board\");\n  for(var index = 0; index < 6; index++) {\n    board.children[index].innerHTML\
    \ = \"Guest\";\n  }\n}\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_179_1.png)\n\
    \nThis is very similar to the function created earlier to set the CSS class of\
    \ each character <div>. But this time we've used innerHTML, as we did in Mission\
    \ 3, to set the value of each of the characters to \"Guest\".\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_179_2.png)\n\
    \nSave your HTML file and refresh your page. Now when you click Play, you'll see\
    \ that each of the character <div> tags is labeled \"Guest\".\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_179_3.png)\n\
    \nNow we need to add some code to your createCharacters function that will randomly\
    \ pick one of the 6 character <div> tags to the thief every time the game loop\
    \ runs. We need to write a code that will pick a random number. There isn't an\
    \ easy way of picking a random number using JavaScript, so the next piece of code\
    \ you need is quite complicated. Carefully type this new code at the end of your\
    \ createCharacters function, so that it looks like this:"
  merge: -1
  pgno: 179
- img_proc: true
  md: "```\nfunction createCharacters() {\n  var board = document.getElementById(\"\
    board\");\n  for(var index = 0; index < 6; index++) {\n    board.children[index].innerHTML\
    \ = \"Guest\";\n  }\n  var randomNumber = Math.floor(Math.random() * 6) + 1;\n\
    \  board.children[randomNumber-1].innerHTML = \"Thief\";\n}\n```\n\nHere, we are\
    \ using a new Math API. It works in the same way as the DOM and localStorage APIs\
    \ that we used in Mission 3. Using the Math API lets you access handy math functions\
    \ that have been built in your web browser. To find a random number, you have\
    \ to do the following calculation:\n\nMath.floor(Math.random()) * BIGGEST_NUMBER\
    \ + SMALLEST_NUMBER;\n\nWe have 6 characters in our game, our biggest number is\
    \ 6 and our smallest number is 1. We need to code:\n\n```\nMath.floor(Math.random()\
    \ * 6) + 1;\n```\n\nWe then store the result of our calculation in a variable.\
    \ Then we can use this variable in our next line of code. We use innerHTML to\
    \ set the value of whichever <div> matches our random number, like this:\n\n```\n\
    board.children[randomNumber-1].innerHTML = \"Thief\";\n```\n\nBecause numbers\
    \ in JavaScript count up from 0, we're going to subtract 1 from our random number,\
    \ so we'll only ever get the numbers 0, 1, 2, 3, 4, and 5.\n\nSave your code.\
    \ Your new createCharacter function will have added a thief to your game. Now\
    \ when you click Play, every time your game loop runs, a random character on your\
    \ game board will become the thief.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_180_0.png)\n\
    \n> We must get the diamond back!"
  merge: -1
  pgno: 180
- img_proc: true
  md: "# 13. create a score\n\nNow we have a game board that shows us a different\
    \ set of characters every 3 seconds. One of those characters is the thief that\
    \ the House of Volkov's security team needs to catch. What we need to do now is\
    \ create a way for the user to click on the thief. When the user clicks, they\
    \ catch the thief and score a point.\n\nWe first have to add a variable called\
    \ gameScore to keep track of the score. It goes underneath the startGame function\
    \ at the top of our <script> block:\n\n```\nvar loops = 0;\nvar peopleVisible\
    \ = false;\nvar gameScore = 0;\n```\n\nEvery time the player clicks on the thief,\
    \ we need to add 1 point to their score. And to make the player is paying attention,\
    \ every time they click on a guest, we should take away 2 points. To create our\
    \ scoring system, we need to add an onclick to every character, every time our\
    \ game loop runs. Add this new code to your createCharacters function:\n\n```\n\
    function createCharacters() {\n  var board = document.getElementById(\"board\"\
    );\n  for(var index = 0; index < 6; index++) {\n    board.children[index].innerHTML\
    \ = \"Guest\";\n    board.children[index].onclick = function() {\n      gameScore\
    \ -= 2;\n    }\n    var randomNumber = Math.floor(Math.random() * 6) + 1;\n  \
    \  board.children[randomNumber-1].innerHTML = \"Thief\";\n    board.children[randomNumber-1].onclick\
    \ = function() {\n      gameScore++;\n    }\n  }\n}\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_181_0.png)\n\
    \nWe're using the onclick, just as we did in Mission 3. When a guest or thief\
    \ is created, an onclick is added. We're using two new arithmetic operators to\
    \ change the value of our gameScore variable. If the user clicks on a guest, the\
    \ += operator means the value that follows is added to the variable. In this case,\
    \ the value that follows is -2, it means that 2 is subtracted from the gameScore\
    \ value. If the user clicks on a thief, the increment operator (++) means 1 is\
    \ added to the value in the variable."
  merge: -1
  pgno: 181
- img_proc: true
  md: "We also need to change the alert message when the game ends, so that it tells\
    \ the user score. Change the else statement in your gameLoop function so it uses\
    \ the gameScore variable value, like this:\n\n```\nfunction gameLoop() {\n  peopleVisible\
    \ = !peopleVisible;\n  createCharacters();\n  flashCharacters();\n  loops++;\n\
    \  if (loops < 12) {\n    setTimeout(gameLoop, 3000);\n  }\n  else {\n    alert(\"\
    You scored \" + gameScore);\n  }\n}\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_182_0.png)\n\
    \nWe leave a space at the end of our alert text, so the message displays correctly\
    \ with the gameScore value.\n\nSave your HTML file and refresh your page. Try\
