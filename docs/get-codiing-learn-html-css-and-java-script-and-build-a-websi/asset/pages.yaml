  md: "# COMPARISON OPERATORS\n\nIn addition to assigning values or performing calculations,\
    \ operators can be used to compare the values of variables. Being able to compare\
    \ values allows us to make our web pages more interactive. Using comparison operators,\
    \ we can write code that does things depending on the values of our variables.\
    \ Here are some of the different comparison operators you can use:\n\nThese operators\
    \ can be used in JavaScript statements to ask questions about our variables. Then\
    \ we can write code that makes different things happen depending on the answer\
    \ to the question. Instructions for our browser that use comparison operators\
    \ are called if statements and else statements. These types of statements are\
    \ called conditional statements, because they depend on the value, or condition,\
    \ of the variable.\n\n| Operator | Meaning |\n| --- | --- |\n| == | Equal to |\n\
    | != | Not equal to |\n| > | Greater than |\n| < | Less than |\n| >= | Greater\
    \ than or equal to |\n| <= | Less than or equal to |\n\n# IF STATEMENTS\n\nStatements\
    \ are a way of telling our browser to perform an instruction only if the condition\
    \ of our variable is true. If the condition of our variable is false, our browser\
    \ won't perform the instruction in the code.\n\nWe have to structure statements\
    \ in a certain way. We start with the statement keyword (if). Then we open a pair\
    \ of parentheses and put the rule for if statement inside them. Then we open a\
    \ pair of braces {}. Inside them we put the instruction we want to happen only\
    \ when our if is true.\n\nLet's look at an example where we've used the equal\
    \ operator (==) to create an if statement. Here, the value of our variable is\
    \ set to Dr. Day we then create an if statement by asking our browser to check\
    \ if the value in our variable is equal to (==) Dr. Day. Then we ask our browser\
    \ to pop an alert if our condition is true.\n\n```\n<script>\nvar person = \"\
    Dr. Day\";\nif(person == \"Dr. Day\") {\n  alert(\"Hello Dr. Day!\");\n}\n</script>\n\
    ```"
  merge: -1
