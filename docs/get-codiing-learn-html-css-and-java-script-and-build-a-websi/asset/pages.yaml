    \ to the Monk Diamond web page. If they get the password wrong, nothing will happen.\
    \ By linking our pages, we create a website.\n\nWe need to use a hyperlink to\
    \ connect our pages. If your web pages are saved in the same place on your computer,\
    \ you don't need to provide your web browser with the URL – you can just use the\
    \ file name as the URL. If we make sure we have both HTML files saved in our **Coding**\
    \ folder, we can use code like this:\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_67_0.png)\n\
    \n```\n<a href=\"filename.html\">Web page name</a>\n```\n\nWhen we create our\
    \ new password web page and save the HTML file in our **Coding** folder, we can\
    \ link the new web page to the web page we built for Professor Bairstone in Mission\
