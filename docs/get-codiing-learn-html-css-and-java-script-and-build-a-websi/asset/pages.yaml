  md: 'Code this page using the HTML and CSS skills you''ve mastered in earlier missions.


    Find images of the Monk Diamond, on the Get Coding! website.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_200_0.png)


    # Header banner


    # Text


    +   - In your <style> block, create a CSS class with the width property set to
    100%, the height set to 400px, and the padding set to 0px. Use the background
    and background-size CSS to add an image.


    +   - Create a third <div>, using the style attribute to set the width to 100%
    and the padding set to 50px.


    +   - Apply this CSS class to a <div> in the <body> of your page.


    +   - Add your text, using the <p> and <br/> tags to divide the text into sections.


    +   - Add title text to your <div>. Use a style attribute to change the font-size
    and width, padding, and background-color CSS properties.


    # Button


    +   - Create a button by linking a inside a <div>. Use a style attribute with
    the width, height, padding, and background-color CSS properties to make it look
    like a button.


    # Menu bar


    # Footer


    +   - Create a second <div> in the <body> of your page. Add a style attribute
    to your <div> tag and set the width, padding, and background-color CSS properties.


    +   - Create a final <div> and use the style attribute to set the width to 100%.


    +   - Add four hyperlinks, using the anchor <a> tag and href attribute.


    +   - Add text inside the <div> with contact information for Professor Bairstone.


    +   - You could also create a <div> for each link and set them to float in a horizontal
    line.


    > You can find the code for this wireframe and all the others in the mission on
    the Get Coding! website.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_200_1.png)


    When you''ve finished coding your page, save your HTML file in your Coding folder.
    Call your file index.html.


