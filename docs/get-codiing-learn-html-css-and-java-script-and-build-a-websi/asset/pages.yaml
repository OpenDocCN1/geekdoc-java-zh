  md: '# CODING AND THE WEB


    A giant network connects lots of computers all over the world. This network is
    called the Internet, and it allows us to access and share information with people
    around the world in seconds. You''ve probably used the Internet to visit websites,
    watch videos, send e-mails, listen to music, or play games. But did you know when
    you connect to the Internet and view a website, you are using a chain of different
    computer programs? Programs on our computers called web browsers connect via Internet
    networks to programs running on web servers, letting us share information quickly
    and easily.


    # World Wide Web


    # Web Browsers


    The Internet is made up of lots of smaller networks. The World Wide Web (or "the
    web") is a network connecting many of our computers, used daily by millions of
    people. The web is made up of lots of individual pages.


    A web page is a file written in computer code by a programmer. Web pages are nearly
    all written in the same programming language, which is called HTML. HTML contains
    the information your program needs to display a web page on-screen. When a group
    of web pages is linked together, the group of pages is called a website. You access
    web pages using a program called web browser.


    Web browsers are computer programs that allow us, to view web pages. You have
    probably come across web browsers as Google Chrome, Microsoft Internet Explorer,
    Safari, and Mozilla Firefox, and used to access all sorts of different websites.
    Your web browser uses a web address to find the web page you want on the web:
    If it accesses the information for the web page using another program called a
    web server.


    > Professor Bairstone is always online, sending e-mails!


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_11_0.png)'
  merge: -1
