  md: '# KEY CODE SKILLS


    Before you receive the brief for Mission 1, there are some basic Code Skills you
    need to learn. You will use these skills throughout the entire code book, so it''s
    important to get a handle on them now. You can code using a PC or a Mac, but you
    have to create and save your HTML file in a different way depending on which system
    you are using.


    # KEY CODE SKILL 1 ► CREATING A FOLDER


    You need to have a place in your computer where you can save all your HTML files.
    Make a folder on your desktop called **Coding**. It''s really important that you
    save all your HTML files in the same place, so make sure you keep using this folder
    as you work through the missions.


    +   - PC On a PC, right-click on your desktop and click New and then *Folder*.
    Call your new folder **Coding**.


    +   - Mac On a Mac, hold down the Control key and click on your desktop. Then
    select New Folder. Call your new folder **Coding**.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_16_0.png)'
  merge: -1
  pgno: 16
- img_proc: true
  md: '# KEY CODE SKILL 2 CREATING AN HTML FILE


    You need to know how to create an HTML file so you can write code. Programmers
    normally use specialist software to write code, but all computers come with text-editing
    programs that let you write HTML files. If you have a PC, you can use Notepad.
    If you have a Mac, you can use TextEdit.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_17_0.png)


    On a PC, you''ll find Notepad by going into the Start menu and typing it in the
    search bar.


    On a Mac, you''ll find TextEdit by typing it in the Spotlight search magnifying
    glass in the topright of your screen. When you open TextEdit, you need to do the
    following:

    - Set up your file as a plain text (rather than rich text) file. To do this, go
    to Format in the menu bar and select Make Plain Text.

    - Also go to TextEdit in the menu bar. Select Preferences. In the New Document
    tab in the Format section, make sure Plain text is checked. In the Options section,
    make sure Smart is unchecked.

    - In the Open and Save tab in Preferences, make sure Display HTML files as HTML
    instead of formatted text is checked.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_17_1.png)


    # KEY CODE SKILL 3 SAVING YOUR HTML FILE


    When you save your HTML file for the first time, you need to make sure you save
    it using the file extension .html at the end of your file name. Your computer
    uses file extensions to work out how to open files. By giving your file extension
    .html, you''re telling your computer that it should open it in a web browser.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_17_2.png)


    On a PC, you need to:

    - Go to File and select Save As.

    - Select the Coding folder as the destination to save the file.

    - Choose a name for your file, such as Mission 1, and type it into the File name
    bar.

    - After the name of the file, type .html so your file name reads Mission1.html.
    Click Save.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_17_3.png)


    On a Mac, you need to:

    - Go to File and select Save.

    - Select your Coding folder as the destination to save your file.

    - Choose a name for your file, such as Mission 1, and type it into the Save As
    bar.

    - After the name of the file, type .html so your file name reads Mission 1.html.

    - Make sure the check box If no extension is provided, use ".txt" is unchecked.
    Click Save.'
