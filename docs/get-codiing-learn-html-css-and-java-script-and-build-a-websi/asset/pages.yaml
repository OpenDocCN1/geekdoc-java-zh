  md: '# 18. Make the game harder


    You might have noticed that the 3-second delay makes it easy to click on the thief.
    We now need to make the game harder so it''s more of a challenge. The characters
    need to flash on-screen for a much shorter time, so there will be less time to
    click on the thief. To do this, we need to change the setTimeout call, like this:


    ```

    setTimeout(gameLoop, peopleVisible ? 1000 : 3000);

    ```


    We''re using a simplified if statement, as we did earlier in the mission. We''ve
    changed our setTimeout call so that if peopleVisible is true, our gameLoop function
    will be called in 1 second. If peopleVisible is false, our gameLoop function will
    flash on-screen for only 1 second, but when they''re hidden they will stay hidden
    for 3 seconds.


    Save your code and start playing your finished game. Can you score 6 points?


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_188_0.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_188_1.png)


