  md: '# changing Your App with the DOM


    We can use a DOM method to find an HTML element in our app by its id attribute.
    We can then use a DOM property to change the contents of that element. Let''s
    look at how we do this.


    # Using the getElementById Method


    The getElementById method is a very handy way of finding a specific HTML element
    in your block of code. To use the getElementById method, you have to include the
    id attribute you gave to the HTML element after the keyword, like this:


    ```

    document.getElementById("list");

    ```


    Here, we have asked our browser to find the HTML element in our web page that
    has the id attribute set to the value "list".


    # Using the innerHTML Property


    You can use the DOM''s innerHTML property to access or change the contents of
    an HTML element in your app. You can then use the contents of the HTML element
    as a value in your JavaScript code.


    ```

    var showList = document.getElementById("list");

    alert(showList.innerHTML);

    ```


    Here, we have created a variable where the value is set to the contents of the
    HTML element that we have called "list", using the id attribute. We have then
    created an alert. The alert will pop up the value of our variable. Our browser
    can access this information because we have set the innerHTML property of the
    variable.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_108_0.png)'
