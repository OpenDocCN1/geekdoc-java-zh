  md: "# 10. Apply css using JavaScript\n\nWe need a new function that apply a CSS\
    \ class to the character <div> tags depending on the value of our variable. We\
    \ should call this function flashCharacters. The function must find our board,\
    \ using getElementById, and store it in a variable board. Then the function needs\
    \ to pick a CSS class to apply to the character <div> tags. This will depend on\
    \ the value of our variable.\n\nvariable to an empty string. This empty string\
    \ is filled as the if and else statements run. If our peopleVisible variable is\
    \ true, our classSet variable will be set to the visible CSS class. If our peopleVisible\
    \ variable is false, the else statement will change our classSet variable to the\
    \ hidden CSS class.\n\nTo decide the class, we create a second variable called\
    \ classSet that will store the names of the CSS classes we need to set. We choose\
    \ the CSS classes using an if and else statement. We set the value of our classToSet\n\
    \nWe need to code a loop that counts the 6 character <div> tags. As the loop counts\
    \ the <div> tags we assign the value of our classSet variable to each <div>. We\
    \ do this using the className method. The className method sets us a CSS class\
    \ on an HTML element in JavaScript.\n\nOur complete function now looks like this:\n\
    \n```\nfunction flashCharacters() {\n  var board = document.getElementById(\"\
    board\");\n  var classSet = \"\";\n  if(peopleVisible) {\n    classSet = \"character\
    \ visible\";\n  } else {\n    classSet = \"character hidden\";\n  }\n  for(var\
    \ index = 0; index < 6; index++) {\n    board.children[index].className = classSet;\n\
    \  }\n}\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_175_0.png)\n\n> Did you\
    \ notice?\nIn the variable called index inside our loop, we have stored more than\
    \ one piece of information. This kind of variable is called a collection. We have\
    \ to use brackets ([ ]) to get a value out of the collection to use in our.\n\n\
    An EMPTY STRING is a piece of data, in the form of a sequence of characters, that\
    \ has the value of 0. In JavaScript an empty string is represented as \"\" \"."
