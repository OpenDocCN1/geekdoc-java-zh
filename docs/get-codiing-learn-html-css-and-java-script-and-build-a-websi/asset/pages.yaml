  md: '# THE LAYOUT AND DESIGN OF YOUR WEB PAGE


    Now that you know HTML tags are and how they work, it''s time to start thinking
    about the layout and design of your web page. So far our HTML elements have been
    positioned in the same place on page. If we want to position our text and images
    in different places or change the design of our web page, we need to learn some
    new HTML tags and attributes.


    # The Division Tag: `<div>` and `</div>`


    The `<div>` helps us change the layout of a web page by splitting it into sections.
    The opening tag is `<div>` and the closing tag is `</div>`. The tag is a useful
    and time-saving way of grouping HTML elements. It works like an invisible container.

    When you group HTML elements between an opening and closing `<div>` tag, you can
    ask your browser to make the same changes to all the elements inside the `<div>`.
    The elements outside the `<div>` will be unchanged. Let''s take a look at how
    the `<div>` works:


    ```

    <body>

    <div style="color: gray;">\<p>The Monk Diamond is over a billion years old.</p>

    <p>It is a rare green diamond.</p>

    </div>

    <p>It is 300 carats and worth over $10 million.</p>

    </body>

    ```


    Here, we put two paragraphs of text inside a `<div>`. The text inside the `<div>`
    has been changed to gray, using a new HTML attribute called the style attribute.
    The paragraph of text not in the `<div>` has remained unchanged. Our `<div>` has
    grouped HTML elements together and allowed us to easily change them.


    > The Monk Diamond is over a billion years old

    It is a rare green diamond.

    It is 300 carats and worth over $10 million.


    You''ll learn all about the style attribute after this Code Skill!


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_35_0.png)'
