    is as accurate as possible. Having a letter or a symbol wrong or missing could
    stop your code from working, as your browser won''t be able to understand your
    instructions. If you are having problems making a program work, it''s a good idea
    to check the following things:


    +   - You haven''t missed any tags or used them in the wrong order

    - There are no typos or spelling errors in your code

    - You''ve used correct capitalization throughout your code

    - You''ve included all the symbols you need, in the right order

    - You''re using straight quotes ("") and not curly quotes (“”)

    - You''ve closed all your tags by including the forward slash (/)

    - Your text-editing program has saved your file as an HTML file (.html)


    > These are some tips for writing code!


