  md: "# Saving the List\n\nTo save the list, we need to create a new savelist function\
    \ that will save it using localStorage. To do this, we have to choose a variable\
    \ name to assign the information we want to store in localStorage. We then use\
    \ getElementById to find the <div> in the <body> of the page. Finally, we use\
    \ innerHTML\n\nto get the contents of the <div>. Everything in our <div> will\
    \ now be saved in localStorage.\nWe want to save our list every time an item is\
    \ added or removed, so we also need to make sure the additem and removelt functions\
    \ call the savelist function after they have run.\n\n# Loading the List\n\nTo\
    \ load the list, we need to create a second function. \"list\". Whenever the loadlist\
    \ function is called, it will set the innerHTML of the <div> with the id=\"\"\
    \ to whatever has been saved in localStorage.\n\nWe need to call our loadlist\
    \ function so that when our browser finishes loading, it loads our list too. To\
    \ make sure we don't try to load a list that hasn't been saved, we have to use\
    \ an if statement before we try to use localStorage. The statement we need looks\
    \ like this:\n\n```\n<div id=\"list\"></div>\n<script>\n  if(localStorage.storedList)\
    \ {\n    loadList();\n  }\n</script>\n```\n\nThe statement checks whether there\
    \ is a list saved in localStorage before trying to load it. When we save our complete\
    \ code block and run our app in our browser, items we add to the list are now\
    \ saved even if we close and then reopen our file.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_132_0.png)\n\
    \n| Special Exhibition To-Do List |\n| Invite guests |\n| Add item |\n| Glass\
    \ display case |\n| Velvet cushion |\n| Hire private security |"
  merge: -1
  pgno: 132
- img_proc: true
  md: "# Removing Items from localStorage\n\nThere's just one more thing we have to\
    \ do to make our list work properly. At the moment, when you use the to-do list\
    \ app, you'll be able to add or remove an item by clicking on it. But if you load\
    \ your saved list from localStorage, you won't be able to remove an item when\
    \ you click on it.\n\nThis is because we're only saving the HTML elements into\
    \ localStorage, not the onclick attribute that we add when each element is created.\
    \ We need to add the onclick attribute back to each of our list items, so that\
    \ the removeitem still works after we load our list from localStorage. We need\
    \ to add one final piece of code to our loadList function in our `<head>`, so\
    \ it looks like this:\n\n```\nfunction loadList() {\n  document.getElementById(\"\
    list\").innerHTML = localStorage.storedList;\n  for(var i = 0; i < list.children.length;\
    \ i++) {\n    list.children[i].onclick = removeItem;\n  }\n}\n```\n\nWe've now\
    \ added a loop to our loadList function. This loop adds our onclick attribute\
    \ to our removeItem function on every item that we load from localStorage. It\
    \ counts up each new HTML element that we've added to the to-do list and sets\
    \ the onclick attribute for each new element.\nYou will learn more about loops\
    \ in Mission 5, but for now you should know that loops are split into three parts.\n\
    \n> A loop is a special piece of JavaScript that runs the same piece again and\
    \ again. Programmers use loops so they don't have to type the same piece of code\
    \ over and over.\n\n+   A loop needs:\n* The code that starts the loop\n* The\
    \ condition to check whether the loop is allowed to run\n* The code that runs\
    \ every time the loop runs\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_133_0.png)"
  merge: -1
  pgno: 133
