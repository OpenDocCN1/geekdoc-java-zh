  md: "# creating Borders and Space with css\n\nWe can also use CSS properties to\
    \ create borders and space around our HTML elements. To create a border around\
    \ an HTML element, you have to use the border CSS property and set the values\
    \ to the width, style, and color you want. Let's look at an example:\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_46_0.png)\n\
    \n```\n<body>\n  <div style=\"border: 4px solid green; width: 50%; height: 100px;\"\
    >\n    Professor Baistone and Dr. Day are very excited by their discovery.\n \
    \ </div>\n</body>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_46_1.png)\n\
    \nWe can also change how much space there is inside an HTML element using the\
    \ padding and margin CSS properties. You can set the values for the margin and\
    \ padding at the top, bottom, left, and right of an HTML element. Let's take a\
    \ look:\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_46_2.png)\n\n```\n<body>\n\
    \  <div style=\"padding: 25px; margin: 50px; border: 4px solid blue; width: 50%;\
