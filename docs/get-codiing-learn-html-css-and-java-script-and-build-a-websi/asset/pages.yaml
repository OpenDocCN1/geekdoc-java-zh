  md: '# KEY CODE SKILL 4 ► OPENING YOUR HTML FILE


    To see your code displayed on-screen, you need to open your HTML file in a web
    browser. You might want to go back into your text-editing program to make some
    changes to your code.


    +   On a PC


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_18_0.png)


    When you want to edit your code, right-click on the HTML file in your Coding folder.
    Select Open with choose Notepad.


    +   On a Mac, you need to:

    - Save your file, as described in Key Code Skill 3.

    - Open your Coding folder on your desktop. Double-click on your HTML file. It
    will open in your web browser.

    - When you want to edit your code, right-click on the HTML folder. Select Open
    with choose TextEdit.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_18_1.png)


