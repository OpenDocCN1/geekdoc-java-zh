  md: '# Removing Elements from the App


    You know how to use the DOM to find and add HTML elements to your web page. But
    what happens if Professor Bairstone makes a mistake and adds the wrong item to
    the to-do list? Or if he completes a task and wants to remove it from the list?
    We need to learn how to remove HTML elements from our app using the DOM.


    > Imagine if I added that new pair of woolly socks I need to the list! Terrible!


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_121_0.png)


    # The removeChild Method


    The removeChild method does the opposite of the append method. Rather than adding
    an HTML element to another HTML element, it takes away an HTML element from another
    HTML element. You use it just like appendChild. Select the HTML element you want
    to remove using the id attribute, and then tell your browser to remove it, like:


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_121_1.png)


    ```

    document.getElementById("list").removeChild(this);

    ```


    As you know already, HTML tags can be nested inside other HTML tags. When you
    use the removeChild method, you remove the HTML element inside the HTML element
    selected using the id attribute.


    In the document object, all elements are connected, like in a family tree. Any
    HTML element that is inside another is called a child of that element. The HTML
    element on the outside is called the parent. When you use removeChild, you remove
    the child HTML element from the parent HTML element.


    When you use the removeChild method, you also have to use a handy JavaScript keyword
    called "this". This keyword points to whichever HTML element was used to call
    the function. Let''s look at an example:


    > These new pieces of code are making our app more and interactive.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_121_2.png)'
