  md: '# code Skills checklist


    # USING THE DOM API


    +   - The DOM (or Document Object Model) is an API (Application Program Interface).
    When your HTML document runs in your web browser, it becomes a part of the DOM
    called the document object. The way the document object is structured allows you
    to write code that will access and change individual HTML elements.


    +   - You can use the DOM''s built-in functions to make changes to HTML elements
    after they have been drawn on your screen. This is important if you want to make
    an interactive web page or web-based app that responds to the user.


    +   - To access the DOM, you have to type the document keyword. You also have
    to use dot (.) notation. Each new instruction for the DOM has to be separated
    by a dot.


    +   - You can use DOM methods and properties to make changes to your HTML elements.


    +   - getElementById is a DOM method that allows you to find an HTML element on
    your page by its id attribute.


    +   - innerHTML is a DOM property. You can set the innerHTML of any HTML element.
    Using innerHTML is a good way to set or change the contents of an HTML element.


    +   - createElement is a DOM method that lets you create a new HTML element. You
    have to tell your browser what type of element you want to create.


    +   - appendChild is a DOM method that lets you add a new HTML element to an existing
    HTML element.


    > The DOM saves you lots of time and makes it much easier to create a dynamic
    web page!


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_118_0.png)'
  merge: -1
  pgno: 118
