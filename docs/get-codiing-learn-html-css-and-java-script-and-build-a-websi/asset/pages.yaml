  md: '# CODE SKILLS ► USING THE <iframe> TAG


    Now that you’ve read about the <iframe> tag and how it works, let’s try using
    the tag and its attributes to change the way a piece of embedded content displays
    in a web page.


    +   1. Open up your text-editing program. Create a new HTML file called iframe.html.
    Add the opening and closing <iframe> tags to the <body> of your page, so the code
    in your new file looks like this:


    ```html

    <!DOCTYPE html>

    <html>

    <head>

    <title>iFrames</title>

    </head>

    <body>

    <iframe>

    </iframe>

    </body>

    </html>

    ```


    +   3. Finally, add the source attribute. Set its value to the URL of a website,
    like this:


    ```html

    <iframe

    width="350px"

    height="350px"

    frameborder="0px"

    style="border: 0px"

    src="https://www.bing.com"

    </iframe>

    ```


    +   4. Save your HTML file and open it in your browser. Your chosen site will
    be embedded in your web page.

    Now try changing the height and width of your <iframe> and seeing what it does
    to the embedded content.


    +   2. Now set the attributes of your <iframe>. Include the width, height, frameborder,
    and style attributes inside your opening <iframe> tag, like this:


    ```html

    <body>

    <iframe>

    width="350px"

    height="350px"

    frameborder="0px"

    style="border: 0px"

    </iframe>

    </body>

    ```


    > I really like this way of embedding new content in our page.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_147_0.png)'
