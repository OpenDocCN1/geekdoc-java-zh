    \ the localStorage keyword. Your code will look like this:\n\n```\n<script>\n\
    function save() {\n  var newItem = document.getElementById(\"box\").value;\n \
    \ localStorage.box = newItem;\n}\n</script>\n```\n\n> Don't forget to use Google\
    \ Chrome or Mozilla Firefox for this exercise."
