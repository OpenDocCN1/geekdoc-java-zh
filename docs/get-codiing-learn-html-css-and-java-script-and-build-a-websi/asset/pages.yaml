  md: '# # WANTED

    FOR THE THEFT OF THE MONK DIAMOND

    ## THE BOND BROTHERS


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_64_0.png)


    # ## REWARD OF $1 MILLION

    ### FOR INFORMATION LEADING TO THE RECOVERY OF THE MONK DIAMOND

    OR ARREST OF THE GANG


    The Bond Brothers typically target exclusive jewelry stores all over the world.
    Their raids are exceptionally well planned, with the targets scoped out weeks
    in advance.

    The Bond Brothers’ tactics have included driving trucks through jewelry-store
    windows and drilling through store basements to access valuables kept in vaults.
    Members of the gang have disguised themselves as workers to confuse staff and
    then smashed open display cases.

    Although the police were unable to prove it, most people think that the Bond Brothers
    are responsible for the unsolved theft of the Monk Diamond from the House of Volkov
    jewelry store in Moscow. Two members of the gang (a man and a woman) pretended
    to be looking for an engagement ring. While the woman distracted the staff, the
    man smashed the Monk Diamond’s display case with a pickax. The two then fled in
    a getaway car, which was posing as a taxi.

    All the CCTV in and around the House of Volkov had been disabled for the hour
    in which the crime took place. Interpol therefore believes that one of the gang
    is also skilled in cybercrime.'
