  md: '# BUILD A WEBSITE


    You''ve done some great work in the last five missions. You can now use code using
    HTML, CSS, and JavaScript and now know how to use APIs to build more complex programs.
    You''ve built a web page, created a password, built a web-based app, planned a
    route, and built a game. Now there is one final challenge: to build a website.

    So far all the pages and programs you''ve built have been stored in your computer''s
    browser and have only been for Professor Bairstone and Dr. Day to use. What we
    need to do is learn how


    to build a website that can be accessed by anyone, anywhere in the world.

    Building a website is not that different from building a web page, as we did in
    Mission 1. After all, a website is just a group of connected web pages. In this
    mission we are going to work in a slightly different way, though. Using a tool
    called a wireframe. There will be five wireframes in this mission, and you will
    need to code a page from each one.


    # Wireframes


    Wireframes are a useful way of planning the content and layout of a website before
    you start coding. Wireframes are just very simple drawings, like the example on
    the right, that show the different elements of your web page. They help you plan
    out the design of each web page and make important decisions about how a page
    will be structured.

    Wireframes also help you decide how your user will interact with the page and
    move among the other pages on the website. Once you are happy with your wireframe,
    you can start coding, using the wireframe as a plan that shows you exactly what
    needs coding on your page.


    In this mission, we are going to code a website made up of five web pages. All
    five pages will be linked, and each will tell a different part of the diamond''s
    exciting story. We are going to look at a possible wireframe for each page of
    the Monk Diamond website.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_195_0.png)'
  merge: -1
  pgno: 195
- img_proc: true
  md: 'Let’s look at the five web pages we’re going to code to make the Monk Diamond
    website:


    | Web page | Content |

    | --- | --- |

    | index.html | Our home page, explaining about the discovery and exhibition |

    | diamond.html | The history of the Monk Diamond, including the theft |

    | discovery.html | The story of Professor Bairstone and Dr. Day’s discovery |

    | exhibition.html | The details of the exhibition, including opening times |

    | volkov.html | How to get to the House of Volkov in Moscow |


    As we work through this mission, we’ll look at a wireframe for each page of our
    website. You can then code each web page in your text-editing program using the
    HTML, CSS, and JavaScript skills you learned in all the other missions.


    # MORE CSS PROPERTIES


    In Mission 1, you learned that CSS is a programming language that lets you change
    the look of an HTML web page. Before we start looking at wireframes, we need to
    learn about a few more CSS properties and values.


    # Using Images


    When you add images to your pages, you can change their size in lots of different
    ways. The best way to do this is to add a style attribute to your <img> tag and
    set the width CSS property to a value in pixels (px) or a percentage (%), like
    this:


    ```

    <img src="diamond.jpg" alt="The Jewel" style="width: 150px"/>

    ```


    ```

    <img src="ernest.jpg" alt="Dog" style="height: 50%"/>

    ```


    Your browser will then work out what height your image should be. If you want
    to stretch an image and change its proportions, you can use both the width and
    height CSS properties in your style attribute, like this:


    ```

    <img src="profB.jpg" alt="Explorer" style="width: 50px; height: 50px"/>

    ```'
  merge: -1
  pgno: 196
- img_proc: true
  md: "# Making an Image fill a <div>\n\nA good way to create an interesting layout\
    \ is to use <div> tags to divide your page into different sections. If you want\
    \ to use an image as the background for a <div> and create a banner, you should\
    \ use the background and background-size CSS properties, as you did in Mission\
    \ 5. There are different ways to scale your images using CSS properties.\n\n|\
    \ CSS property | What does it do? | Example values |\n| --- | --- | --- |\n| background\
    \ | Sets the background image for an HTML element | url(filename.jpg) |\n| background-size\
    \ | Sets the size of an HTML element | contain, cover, auto |\n\nIn Mission 5,\
    \ you used the cover value with the background-size CSS property. The cover value\
    \ scales the background image so it is big enough to completely fill your <div>.\
    \ Some of the image might be cropped to fit the size of the <div>.\nIn addition\
    \ to the cover value, you can use the contain value. The contain value makes the\
    \ background image as big as possible without stretching it out of shape. Depending\
    \ on the size of your image, it might not fill your <div>. If the image doesn't\
    \ fill the space, your browser will repeat it.\nIf you use auto as the value for\
    \ the background-size CSS property, it will also repeat the image as many times\
    \ as it needs to fill up the <div>.\n\n```\n<style>\n.team {\n  width: 600px;\n\
    \  height: 600px;\n  background: url(team.jpg);\n  background-size: contain;\n\
    }\n</style>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_197_0.png)\n\nWhen\
    \ we SCALE an image, we resize it by making it bigger or smaller or giving it\
    \ different proportions. When we CROP an image, we cut its edges off, making the\
    \ image smaller."
  merge: -1
  pgno: 197
- img_proc: true
  md: '# Aligning Text and Images


    You can make images and text line up in two simple ways, which we looked at in
    Mission 1. You can use the text-align CSS property on the <div> that has the text
    and image inside it. Or you can use the float CSS property in a style attribute
    inside your <img> tag, like this:


    ```

    <img src="team.jpg" alt="The Team" style="float: right;"/>

    ```


    # More css color Values


    So far you have been using color names as the values for your CSS properties.
    By default, your browser supports about 140 color names. In addition to these
    names, you can create your own colors using a HEX code. You use a HEX code in
    exactly the same way you use a color name. They look like this:


    ```

    <body>

    <div style="background-color: #0BFF54">

    Professor Bairstone, Dr. Day, and Ernest were on the expedition.

    </div>

    </body>

    ```


    Luckily you don''t need to remember HEX codes. There are plenty of websites that
    help you work them out. You can mix your own colors and make your own HEX codes
    using the Color Wheel at www.color.adobe.com. Just copy the HEX value from the
    page into your code and remember to start your HEX code color with a hash (#).


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_198_0.png)'
