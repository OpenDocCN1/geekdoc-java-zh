  md: '# THE DOCUMENT OBJECT MODEL (DOM)


    The button and text box in our app work now. But how will Professor Bairstone
    add and remove items from his list? To allow him to do this, we need to use the
    Document Object Model (or DOM for short).


    We learned in Mission 1 that an HTML web page file is called a document. As you
    know, HTML documents are made up of lots of smaller pieces of HTML, called HTML
    elements. When we save our HTML file and run the code in our web browser, the
    browser draws the elements on-screen. If we want


    to build the app, we need to be able to change, delete, or add new HTML elements
    after our browser has drawn the page on our screen.


    As we''ve seen working through Mission 2, built-in functions like the alert are
    very useful when we code. The DOM is a set of built-in functions that work with
    your web browser. The built-in functions make it easy to build web pages that
    are dynamic, changing according to what the user does.


    # Programming Interfaces


    The DOM is an application program interface (or API). APIs help when you are coding.
    They are sets of built-in functions that you can easily use with HTML and JavaScript
    code.


    The alert function we used in Mission 2 is a built-in function. Rather than having
    to code an alert, we can just type the alert keyword, and our browser knows what
    to do. The DOM works in a very similar way. We can use the DOM''s built-in functions
    to make changes to our HTML document after it''s been drawn on-screen.


    Using the DOM lets us build web pages that change and react when the user does
    something. If we want our to-list to be interactive and change on-screen when
    Professor Bairstone adds a new task or checks one off, we need to use the DOM''s
    methods and properties.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_106_0.png)


    APPLICATION Program Interfaces (APIs) save lots of time when you are writing code,
    because they allow you to use their built-in functions. Rather than having to
    write the code for these functions yourself, you can use the API''s functions
    in your code. There are APIs to do all sorts of things, from storing information
    to adding content to your page.'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# Using the DOM


    The DOM API is structured in a special way called a hierarchy, which is a bit
    like a family tree. This structure is called the document object. In the document
    object the individual HTML elements are all connected to one another, like the
    members of a family, with parents and children. The document object structured
    allows you to use another programming language, such as JavaScript, to access,
    change, add, or remove any of the HTML elements inside the document.


    Using the DOM when you code allows allows you to make changes to individual HTML
    elements after they have been drawn on-screen. You can use the DOM''s methods
    and properties to find an HTML element on your page and then, using JavaScript,
    add to it, remove it, or change it.


    If we want our app to be interactive, we need to learn how to use these methods
    and properties with JavaScript. Professor Bairstone needs to be able to see his
    tasks on-screen and add remove items.


    # DOM Methods and Properties


    Before you can use any of the DOM''s built-in functions, you have to tell your
    browser to access the API. To do this, you always have to type this piece of code
    at the beginning of an instruction for the DOM.


    Once you''ve told your browser you want to use the DOM, then you have to say which
    DOM functions you want to use. The DOM has built-in methods and properties that
    allow you to change HTML elements. A property is a value that you can access and
    change, such as setting the contents of an HTML element to a piece of text.


    When you want to use a method or property, you separate the DOM keyword from the
    DOM method or property with a dot (.). Because the DOM lets any HTML element in
    your web page, lots of DOM methods have the word "element" in them. In Mission
    2, you used a DOM method with JavaScript when you wrote this:


    ```

    document.getElementById("password");

    ```


    Here, we are telling our browser to use the DOM. Then we are asking to use a DOM
    method called getElementById find an HTML element. Finally, we''re directing our
    browser to find the HTML element with that specific id attribute.


    > Did you notice? When we use dots to separate pieces of code, we are using dot
    notation. The dot tells your browser that you will be using DOM methods and properties.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_107_0.png)'
