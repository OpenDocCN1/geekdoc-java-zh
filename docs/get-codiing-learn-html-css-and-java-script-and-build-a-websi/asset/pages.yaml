  md: '# SAVING YOUR TO-DO LIST ITEMS


    Professor Bairstone can now add and remove as many items as he needs to and from
    the list. You might have noticed if you refresh your page, your to-do list disappears.
    This is because so we''ve added or removed HTML elements from our screen. We haven''t
    saved the list or changed our HTML file. If we want our browser to save and remember
    our list, we need to use localStorage, a handy API that''s available in HTML5
    (the fifth version of HTML programming language).


    This API lets save information in your browser, even if your page is refreshed
    or closed, you can still access the data. Like the DOM, localStorage is a collection
    of functions, and it''s simple to use.


    All you have to do is tell your browser you want to use localStorage by typing
    the localStorage keyword (written in camelCase) and giving a name to the information
    you want to store. Set the value of the information you want using an equals sign
    (=) and double quotes (""), like this:


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_128_0.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_128_1.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_128_2.png)


    localStorage.storageName = "information";


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_128_3.png)


    If you want to remove a piece of information from localStorage, you just leave
    an empty value, like this:


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_128_4.png)


    localStorage.storageName = "";


    Viewing the information you save using localStorage is simple. All you have to
    do is use the keyword and the localStorage name, like this:


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_128_5.png)


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>The Monk Diamond</title>

    </head>

    <body>

    <script>

    localStorage.valuableDiamond = "The Monk Diamond";

    alert(localStorage.valuableDiamond);

    </script>

    </body>

    </html>

    ```


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_128_6.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_128_7.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_128_8.png)'
