  pgno: 169
- img_proc: true
  md: "Now we want to make sure that our game loops for a fixed number of times before\
    \ the game ends. We do this by adding an if statement and an else statement to\
    \ our gameLoop function, which will keep track of how many times our loop has\
    \ run.\n\nWe need to make sure when the loop has run for a certain number of times,\
    \ the setTimeout function calling the loop will stop and an alert will pop up.\
    \ We want our loop to run 12 times. It will run every 3 seconds until the twelfth\
    \ loop, when the game will end. Our game will last for a total of 33 seconds (11\
    \ multiplied by 3) before it ends the twelfth loop. Let's look at our whole <script>\
    \ block with the new variable, if statement, and else statement:\n\n```\n<script>\n\
    function startGame() {\n  gameLoop();\n  var loops = 0;\n  function gameLoop()\
    \ {\n    loops++;\n    if(loops < 12) {\n      setTimeout(gameLoop, 3000);\n \
    \   } else {\n      alert(\"Game over!\");\n    }\n  }\n}\n</script>\n```\n\n\
    The if statement keeps track of how many times our loop has run. If it is less\
    \ than (< 12 times, it keeps running by calling setTimeout again. If it is 12\
    \ times or more, the else statement runs and an alert pops up.\n\nSave your new\
    \ code and refresh your page. Press the Play button and wait until the alert pops\
    \ up. Your game will now end after a certain period of time.\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_170_0.png)\n\
    \n> Don't forget, you have to wait for 33 seconds before the alert will pop up!"
