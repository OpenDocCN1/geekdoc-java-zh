  md: '# BUILDING A WEB-BASED APP


    Planning the special exhibition for the Monk Diamond at the House of Volkov is
    going to be a big job for Professor Baistone, Dr. Day, and Mr. Volkov. In this
    mission you are going to help them by building an app that will run in your web
    browser. Professor Baistone can use this app to create his to-do list. Once he''s
    done a task, he can remove it from the list.


    We''re going to need to learn some new JavaScript functions to build our app.
    At the moment, the pages we built don''t change after your browser has drawn them
    on-screen. Professor Baistone is going to want to add and remove items from his
    list, so our app needs to be more interactive. Let''s see what our app will look
    like:


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_101_0.png)


    Our app will have a text box that Professor Baistone can type into. When he clicks
    on the button, the item will be added to the list. When he''s completed a task,
    he can click on it and it will be removed. We can code all these things using
    the JavaScript you learned in Mission 2 with some new programming tools.


    # Building a Text Box and Button


    Before we start learning new JavaScript code, let''s build the basic structure
    of our app. We need a text box and a button. In Mission 2, we learned how to use
    the <input/> tag and the type attribute. We''re going to be using those skills
    again in this mission.


    The <input/> tag allows you to create an HTML element on your page where your
    user can enter data. You use the type attribute to choose the kind of element
    your user can add data. To create a text box and a clickable button on our page,
    we will need the following code:'
