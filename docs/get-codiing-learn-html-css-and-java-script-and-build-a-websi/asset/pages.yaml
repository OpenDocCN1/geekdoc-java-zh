  md: "# # CODING WITH JAVASCRIPT\n\nHyperlinks are an important first step in creating\
    \ a web page that responds to the user. But if we want to code a page that is\
    \ really interactive and changes according to what the user does, we need to use\
    \ a new programming language called JavaScript with our HTML.\n\nuse JavaScript\
    \ with HTML to create a password, so that the information about the Monk Diamond\
    \ is kept safe from the cybercriminal in the Bond Brothers gang.\n\nJavaScript\
    \ is the most popular programming language in the world. It transforms an HTML\
    \ and CSS web page by making it interactive. We need JavaScript to do all sorts\
    \ of useful things, such as making buttons and alerts and storing information.\
    \ In this mission, we are going to learn how we can\n\nWe saw in Mission 1 how\
    \ HTML documents are made up of different elements and how you use attributes\
    \ to change those elements. JavaScript also has its own syntax, or set of rules,\
    \ for writing code. JavaScript syntax is made up of pieces of code called statements,\
    \ variables, operators, and functions. Let's learn about them and see how we use\
    \ them to build the password.\n\n# # Adding JavaScript to Your HTML Page\n\nBefore\
    \ you can start writing JavaScript, you need to tell your browser that you are\
    \ switching from HTML to JavaScript. You do this by using the `<script>` tag.\
    \ If you don't put your JavaScript code between the opening and closing `<script>`\
    \ tags, your code won't run. You can have as many `<script>` tags as you want\
    \ in your HTML document, and you can put them inside either the `<head>` or `<body>`\
    \ on your page.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <title>Password</title>\n\
    </head>\n<body>\n  <script>\n  </script>\n</body>\n</html>\n```\n\n![](img/fd182f6ecb2aea108dbd5523a70555aa_69_0.png)\n\
    \n> Here, the <script> tag is inside the <body> of our page. Sometimes we call\
    \ this a <script> block."
  merge: -1
  pgno: 69
- img_proc: true
  md: 'When we write an instruction for our browser in JavaScript, we call this writing
    a statement. JavaScript programs normally contain many statements. A statement
    usually starts with a keyword that tells you what action it will perform. It always
    ends with a semicolon (;). Your browser runs one statement after another in the
    order they are written. Let''s look at some JavaScript statements. When we save
    this code and run it in our browser, this happens:


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>Password</title>

    </head>

    <body>

    <script>

    alert("We need a password urgently!");

    alert("Use the password Ernest300");

    </script>

    </body>

    </html>

    ```


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_70_0.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_70_1.png)


    The two statements between the opening and closing <script> tags have run one
    after another, popping up two alert boxes with different messages inside. An alert
    is a piece of JavaScript called a function, and it''s built in your web browser.
    We''ll learn more about it later in the mission.


    JavaScript is case sensitive, so it''s important to make sure you have used the
    correct capital letters. When you choose a name for a piece of JavaScript, you
    can''t leave spaces between words. A good way to write two words is to camelCase.


    > CAMELCase is the practice of joining two words to form one word. The first word
    starts with a lowercase letter and the second word begins with an uppercase letter,
    but there is no space between them, like the hump of a camel. An example of camelCase
    is sayHello.'
  merge: -1
  pgno: 70
- img_proc: true
  md: '# VARIABLES


    Variables are an important part of JavaScript. They are a way to store information
    in your web browser for a short period of time. You can then use the stored data
    to build programs that make your web page interactive. Without variables, your
    browser has no way of remembering information.


    > These are important!


    So when we use JavaScript to code a program that will check a password we need
    to use a variable to store the data for the correct password. Without a variable,
    our browser won''t be able to check whether


    the user has entered a correct password Variables store data in the form of words
    or numbers. You have to code variables in a certain way. You always have to tell
    your browser you are creating a variable. This is called defining a variable.
    Let''s look at how we create a variable that Ernest''s name.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_71_0.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_71_1.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_71_2.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_71_3.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_71_4.png)


    ```

    var dogName = "Ernest";

    ```


    Variables are always written in the same way. Every piece of JavaScript tells
    your browser a different piece of information and will be important when you build
    a program.


    # A variable needs:


    +   - A keyword

    To define a variable, you have to use the variable `var keyword`. It tells your
    browser that you are creating a variable.

    - A variable name

    The next part of a variable is the variable name. You can give your variable any
    name you like. The only rule (rule with variable names) is that they can''t have
    spaces (so use camelCase instead) and can''t begin with a number.

    - A value

    You then have to give your variable a value using the equals sign (=). Doing this
    is called assigning a variable. If the value of your variable is text, you have
    to put the value in double quotes (""). You can include spaces in your values.
    After the value, you have to include a semicolon (;).'
  merge: -1
  pgno: 71
- img_proc: true
  md: '# Operators


    Operators are another key part of JavaScript. They are a way of changing the value
    of a variable. Different kinds of operators do different things to the information
    in your variable.


    # Assignment Operators


    Assignment operators allow you to create and set the values of your variables.


    Equals (=): You use the equals sign (=) to give your variable value. You can use
    it to set variables to both numbers and words. If your variable is a number, it
    doesn''t have to be in double quotes (""). Here''s an example where the value
    is set to a number:


    ```

    var teamMembers = 3;

    ```


    And here''s an example where the value is set to words and needs double quotes
    (""):


    ```

    var expeditionLeader = "Professor Bairstone";

    ```


    # Arithmetic Operators


    Arithmetic operators are a way of using math calculations to change the values
    of your variables. They are a useful way of creating a numerical value for a variable.


    Addition (+): You use the addition operator (+) to add numbers to create a value.
    Here, the value of our campRations variable will be set to 3.


    ```

    var campRations = 2 + 1;

    ```


    Subtraction (-): You use the subtraction operator (-) to subtract numbers to create
    a value. Here, the value of our dogBiscuits variable will be set to 1.


    ```

    var dogBiscuits = 5 - 4;

    ```'
  merge: -1
  pgno: 72
