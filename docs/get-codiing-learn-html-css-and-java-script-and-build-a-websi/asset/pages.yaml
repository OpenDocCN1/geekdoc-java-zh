  md: "# Saving and Loading Using localStorage\n\nNow that you know about localStorage,\
    \ let's look at how we can use it to save and load Professor Bairstone's app.\
    \ Every time Professor Bairstone changes the to-do list, it needs to be saved\
    \ in localStorage. We also need to write code that will load the to-do list from\
    \ localStorage when Professor Bairstone opens it in his browser. Let's look at\
    \ the changes we need to make to our <script> block to use localStorage like this:\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<title>To-Do List App</title>\n<script>\n\
    function addItem() {\n  var newItem = document.createElement(\"div\");\n  newItem.innerHTML\
    \ = document.getElementById(\"box\").value;\n  newItem.onclick = removeItem;\n\
    \  document.getElementById(\"list\").appendChild(newItem);\n  saveList();\n}\n\
    function removeItem() {\n  document.getElementById(\"list\").removeChild(this);\n\
    \  saveList();\n}\nfunction saveList() {\n  localStorage.storedList = document.getElementById(\"\
    list\").innerHTML;\n}\nfunction loadList() {\n  document.getElementById(\"list\"\
    ).innerHTML = localStorage.storedList;\n}\n</script>\n</head>\n<body>\n<p>Special\
    \ Exhibition To-Do List</p>\n<input type=\"text\" id=\"box\" value=\"Type here\
    \ to add task\"/>\n<br/>\n<input type=\"button\" value=\"Add item\" onclick=\"\
    addItem();\"/>\n<div id=\"list\"></div>\n</body>\n</html>\n```"
  merge: -1
