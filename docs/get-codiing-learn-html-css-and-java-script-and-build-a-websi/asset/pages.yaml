  md: '# PLAN A ROUTE USING GOOGLE MAPS


    Now that you know how to embed a map in your page, we can start planning the route
    Dr. Day and the head of security need to take through Moscow. To do this, we need
    to build a new URL and use a new function in the Google Maps Embed API. We have
    to create our URL in a slightly different way.


    We need to use the directions function, rather than the search function. The directions
    function will create a map that gives a route from a specified location to another
    specified location. Dr. Day needs to take the Monk Diamond from Gorky Park to
    St. Basil''s Cathedral, so our new URL will look like this:


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_151_0.png)


    ```

    https://www.google.com/maps/embed/v1/directions?origin=GorkyPark,Moscow&destination=StBasil&key=API-KEY

    ```


    Like before, the first part of our URL is the path to the Google Maps Embed API.
    We then request to use the directions API function. Then we use three parameters:
    the origin, destination, and API key. For the origin and destination, you can
    put lots of different values, but the simplest thing to do is put the place named
    by the city name. These two new keys are important for your browser, because they
    provide the following information:


    | Parameter key | What does it do? | Example value |

    |---|---|--|

    | origin | Gives the place you want route to start | GorkyPark,Moscow |

    | destination | Gives the place you want route to end | StBasil,Moscow |


    > Did you notice? We''ve included the name of the site and the city, separated
    by a comma (,). There is no space after the comma.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_151_1.png)'
