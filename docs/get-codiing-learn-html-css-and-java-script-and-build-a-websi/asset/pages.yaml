  md: '# HOW TO USE THIS BOOK


    There are six exciting missions in Get Coding! Your job is to work through each
    mission and learn how to code in HTML, CSS, and JavaScript. You can then use your
    new coding skills to help the intrepid explorer Professor Bairstone and top scientist
    Dr. Day, who are in urgent need of your assistance. They have found the valuable
    Monk Diamond on an expedition and need your help to keep it safe.


    # Mission Briefs


    At the start of each mission, you will receive a Mission Brief from Professor
    Bairstone or Dr. Day. The brief will ask you to use your coding knowledge to help
    with a Do-It-Yourself Task. The tasks include building a web page, creating a
    password, coding an app, planning a route, making a game, and building a finished
    website.


    # code Skills


    The best way to learn how to code is through practical! At first coding can seem
    daunting you have to use special words and symbols. But you will soon become familiar
    with the different programming languages have to be written. To help you see how
    each piece of code works, you will find Code Skills exercises throughout each
    mission. Follow the step-by-step instructions in each exercise, and master a new
    Code Skill every time.


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_15_0.png)


    # The Explorer’s Encyclopedia


    You will find more about Professor Bairstone, Dr. Day, and the Monk Diamond in
    the entries from the Explorer’s Encyclopedia after the briefs. You can use this
    information to help you complete the tasks.


    # Do-It-Yourself Tasks


    At the end of each mission is a Do-It-Yourself Task. Use the code you have learned
    in the Code Skills to complete the tasks and accomplish the missions. The future
    of the Monk Diamond is in your hands!


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_15_1.png)


    ![](img/fd182f6ecb2aea108dbd5523a70555aa_15_2.png)'
