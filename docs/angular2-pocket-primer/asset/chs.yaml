  \n## Angular 的图表工具\n\n有多种开源工具包可以提供图表相关的功能。其中一个是 Angular 模块 `ng2-charts`，用于创建图表和图形，其主页位于：\n\
  \n[`mean.expert/2016/09/17/angular-2-component-revised/`](http://mean.expert/2016/09/17/angular-2-component-revised/)\n\
  \n另一个选项是 `ng2d3` 框架，这是一个 Angular2 + D3 可复用的图表框架，其主页位于：\n\n[`github.com/swimlane/ng2d3`](https://github.com/swimlane/ng2d3)\n\
  \n`ng2d3` 框架使用 Angular 渲染 SVG 元素，使用 D3 处理函数、比例尺和形状生成器等。注意 ng2d3 支持自定义图表，并且可以通过 CSS\
  \ 进行自定义。\n\n检查这些（以及其他）工具包的支持功能以确定哪一个适合你的需求。\n\n## 总结\n\n本章展示了如何在 Angular 应用中渲染基于\
  \ SVG 的图形。你学习了如何使用 `D3` 和 `GSAP` 创建图形和动画效果，并且学习了如何在 生命周期 生命周期周期方法中放置自定义代码。此外，你还学习了在\
  \ Angular 中使用纯 CSS 动画效果。\n\n# 第 4 章\n\n## HTTP 请求与路由 本本章向了如何在 Angular 应用中进行 HTTP\
  \ 请求，以及如何在 Angular 应用中使用 `Observables`。代码示例展示了如何从各种来源获取数据，以及如何从 `Promise` 创建 `Observable`。如果需要，你可以访问关于\
  \ `Observables` 和 `Promises` 的在线教程。\n\n第一部分简要讨论了依赖注入 (DI) 和 `@Injectable` 装饰器。第二部分展示了如何在\
  \ Angular 应用中进行 HTTP 请求以读取 JavaScript 对象表示法 (JSON) 数据。\n\n第三部分展示了如何在 Angular 应用中进行\
  \ HTTP 请求以检索 GitHub 用户。你还将看到如何通过 `forkJoin()` 方法进行并发请求。本章的最后部分讨论了 Angular 应用中的路由。\n\
