  \n### Angular 与深度学习\n\n本节包含了 Angular 应用 `AngularDLPG`，它基于以下“深度游场”（deep playground）GitHub\
  \ 仓库的代码。该仓库提供了基于深度学习的神经网络：\n\n[`github.com/tensorflow/playground`](https://github.com/tensorflow/playground)\n\
  \nDeep playground 是一个使用 TypeScript 和 D3.js 编写的神经网络交互可视化工具。本质上，`AngularDLPG` 应用充当了该交互可视化的容器。\n\
  \n`AngularDLPG` 应用是通过三个步骤创建的：首先使用 `ng` 工具创建基准应用。接下来，将上述 GitHub 仓库中的 `package.json`\
  \ 和 `index.html` 文件合并到 `AngularDLPG` 应用中对应的文件中。第三，将 GitHub 仓库中 `src` 子目录下的 TypeScript\
