  \n![Image](img/greybox.jpg)dependencies.soundcloud-ngrx.svg\n\n### Compodoc\n\n\
  Compodoc 是一个用于生成 Angular 应用静态文档的工具，其主页位于此处（包含一个在线演示）：\n\n[`github.com/compodoc/compodoc`](https://github.com/compodoc/compodoc)\n\
  \nCompodoc 自动生成目录并提供各种其他功能，如主题、搜索功能、JSDoc 轻量级支持，而且对 Angular CLI 非常友好。\n\n官方文档网站位于此处：\n\
