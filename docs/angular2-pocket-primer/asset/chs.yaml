  ## 使用 Ionic 2 进行移动开发\n\n`Angular` 设计用于支持多平台应用，包括移动应用。还有基于 `Angular` 开发移动应用的工具包。其中一个知名的工具包是\
  \ `Ionic 2`，它的首页位于：\n\n[`ionic.io`](https://ionic.io)\n\n`Ionic 2` 构建在 `Angular`\
  \ 之上并利用了 `Cordova` 工具包。`Ionic` 框架提供了一个模拟原生 UI 的 UI 框架，用于创建混合移动应用。\n\n### 注意\n\n\
  本书印刷时已发布了 `Ionic 3`，以下链接讨论了主要变化和新功能：\n\n[`blog.ionic.io/`](http://blog.ionic.io/)\n\
  \n### 安装与项目创建\n\n使用以下命令安装 `Ionic 2`：\n\n```bash\nsudo npm install -g ionic cordova\n\
  ```\n\n如果你已经安装了旧版本的 `Ionic` 并在上一步中遇到错误，以下命令可能帮助你解决错误：\n\n```bash\nnpm uninstall\
  \ -g ionic\nsudo npm i -g ionic cordova\n```\n\n现在使用以下命令创建一个 `Ionic` 应用：\n\n```bash\n\
  ionic start firstIonicProject blank --v2\n```\n\n我们的项目名称为 `firstIonicProject`，它基于\
