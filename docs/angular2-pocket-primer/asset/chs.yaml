  \ 应用中使用一个简单的计时器。\n\n### 列表 9.8 app.component.ts\n\n![Image](img/pg263.jpg)\n\n列表\
  \ 9.8 包含标准的导入语句，随后是 `Observable` 和 `interval()` 方法的两个语句。接下来，一个属性包含了名为 `mytimer`\
  \ 的 `Observable`，其输出被传递给 `async` 操作符。\n\n`AppComponent` 类包含了 `mytimer` 的定义，它每 1500\
  \ 毫秒发射一个整数（这是示例中的 `pause` 值）。此时你可以很容易修改此代码。\n\n### RxJS 版本 5\n\nRxJS 版本 5 提供了更好的调试和模块化。版本\
  \ 5 还遵循 ES7 规范，而 RxJS 版本 4 遵循 ES6 规范。\n\nRxJS 版本 5 提供了一些性能提升：在 Google Chrome V8\
  \ 中，RxJS 版本 5 比 RxJS v4 快 5 倍。\n\nES6 下的 RxJS v5 代码片段：\n\n```\nimport {Observable}\
  \ from \"rxjs/Observable\";\nimport { map } from \"rxjs/operator/map\";\nmap.call(Observable.of(1,2,3),\
  \ x => x*x).subscribe(console.log.bind(console));\n```\n\n带有 Babel 的 RxJS v5 代码片段：\n\
  \n```javascript\nimport {Observable} from \"rxjs/Observable\";\nimport { map } from\
  \ \"rxjs/operator/map\";\nObservable.of(1,2,3)::map(x => x*x).subscribe(::console.log);\n\
  ```\n\n以下代码片段使用了 TypeScript 中的 RxJS 版本 5 语法：\n\n```typescript\nimport {Observable}\
  \ from \"rxjs/Observable\";\nimport \"rxjs/add/operator/map\";\nObservable.of(1,2,3).map(x\
  \ => x*x).subscribe(console.log.bind(console));\n```\n\n### 在 RxJS 版本 5 中创建 Observable\n\
  \n版本 5 创建 Observable 的语法与版本 4 的语法略有不同：“on”前缀在版本 5 中已被删除。\n\n这里是 RxJS 版本 5 的语法示例：\n\
