  \ `app.js`：\n\n```bash\nnpm start\n```\n\n每当你发送一个有效的 HTTP GET 请求时，该请求将通过三个步骤进行处理：第一步涉及\
  \ Express 应用程序中的代码（在 `app.js` 中），第二步是调用 `routes/index` 中的代码，第三步是将数据传递给 Jade 模板。\n\
  \n按照惯，此应用程序的 Jade 模板位于 `views` 目录。对于本示例，Jade 模板包括 `userlist.jade`（显示所有用户）和 `index.jade`（显示简单消息）。每个\
  \ Jade 模板都会处理它们接收到的数据。\n\n另一点：匹配 `/userlist` 的路由是最复杂的，因为它首先从 Mongo 数据库提取用户列表，然后将用户列表传递给\
