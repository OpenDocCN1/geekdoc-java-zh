  \ Components）\n\n展示组件作为输入接收数据并作为输出生成视图（因此它们不维护应用程序状态）。考虑以下组件：\n\n![Image](img/pg57b.jpg)\n\
  \n`StudentDetailsComponent` 组件主要具有展示职责。该组件接收输入数据并在屏幕上显示它。因此，该组件是可重用的。\n\n相比之下，特定应用程序的组件（也称为“智能”组件）与特定的\
  \ Angular 紧耦合。因此，一个智能组件将有一个展示组件（但反之则不然）。\n\n由于数据是同步传递给此组件的（而不是通过 `Observable`），数据最初可能不存在，这就是为什么要包含所谓的埃尔斯运算符（模板中的\
  \ `“?”`）的原因。\n\n## Angular 中的样式元素和 Shadow DOM\n\nAngular 支持层级样式表（CSS）封装，这意味着 CSS\
  \ 选择器将只匹配定义在同一个自定义组件中的元素。这种封装的实现得益于 Angular 中的 ShadowDOM 模拟。具体来说，这涉及一个导入 `ViewEncapsulation`\
  \ 的导入语句，并指定以下值之一：\n\n![Image](img/greybox.jpg) `ViewEncapsulation.Emulated`\n\n\
  ![Image](img/greybox.jpg) `ViewEncapsulation.Native`\n\n![Image](img/greybox.jpg)\
  \ `ViewEncapsulation.None`\n\n组件的默认值是 `ViewEncapsulation.Emulated`，它输出我们的样式并继承全局样式。相比之下，`ViewEncapsulation.Native`\
  \ 使用原生 ShadowDOM（并非所有浏览器都支持），并且丢失全局样式。最后，`ViewEncapsulation.None` 移除组件中的所有封装。\n\n\
  ![Image](img/pg58.jpg)\n\n![Image](img/disc.jpg)\n\n从随附光盘中将 `Encapsulation` 目录复制到方便的位置。列表\
