  ## 什么是 NativeScript？\n\nNativeScript 2.0 允许你为多个平台创建原生移动应用程序，其主页位于：\n\n[`www.nativescript.org/`](https://www.nativescript.org/)\n\
  \nNativeScript 使用原生平台的渲染引擎渲染 UI（即没有 WebViews），这导致了类似原生的性能。然而，NativeScript 为 Android\
  \ 和 iOS 生成原生应用，而 Ionic 2 为 Android 和 iOS 生成混合应用。因此，NativeScript 与 React Native “具有可比性”，而\
  \ Ionic 2 与 PhoneGap “具有可比性”。\n\nNativeScript 具有以下特性：\n\n![Image](img/greybox.jpg)原生\
  \ UI（无 WebViews）\n\n![Image](img/greybox.jpg)可扩展\n\n![Image](img/greybox.jpg)易学习\n\
  \n![Image](img/greybox.jpg)跨平台\n\n![Image](img/greybox.jpg)由 Telerik 支持\n\n![Image](img/greybox.jpg)开源（Apache\
  \ 2 许可）\n\n请记住，用于 Angular 的 NativeScript 为 Android 和 iOS 生成原生应用，而 Ionic 2 为 Android\
  \ 和 iOS 生成混合应用。因此，NativeScript 和 Angular 的结合是 React Native 的“对应物”（其中 UI 层可以是 ReactJS\
  \ 或是 Angular）。\n\n## 安装和创建新项目\n\n使用此命令安装 NativeScript：\n\n```bash\nsudo npm install\
  \ –g nativescript\n```\n\n在完成上述命令后，可以通过执行以下三个命令来创建并部署 NativeScript 应用程序：\n\n```bash\n\
  tns create FirstNSProject --template nativescript-template-tutorial\ncd FirstNSProject\n\
  tns run android\n```\n\n为了简单起见，`FirstNSProject` 项目基于现有的 NativeScript 模板。\n\n调用以下命令部署到\
