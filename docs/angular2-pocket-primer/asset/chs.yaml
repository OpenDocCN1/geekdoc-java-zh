  \ Angular 应用程序都可以使用的基本调试技术。本节使用 第 1 章 中的按钮相关代码示例来说明如何在 Angular 中使用调试器。\n\n本章的第二部分向你展示如何管理项目列表，包括显示、添加和删除列表项。注意，Angular\
