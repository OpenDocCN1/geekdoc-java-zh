  \n# 有用的 Angular 工具\n\n有多种第三方工具提供额外功能，作为 Chrome 扩展、可安装模块（通过 npm）或命令行执行文件。下面简要讨论的两个工具是\
  \ Augury 扩展和用于显示组件树的 `ngd` 工具。\n\n## Augury Chrome 扩展\n\nAugury Chrome Tools 扩展为\
  \ Angular 应用提供了非常良好的调试支持，可以通过此链接下载：\n\n[`augury.angular.io/`](https://augury.angular.io/)\n\
  \naugury 标签页显示两个面板，你可以决定在左面板中查看 Angular 组件的组件树或路由树（如果有）。当你选择左面板中的组件时，该组件的详细信息（包括变量）将显示在右面板中。此外，你可以动态修改右面板中变量的值，并将修改应用到当前\
  \ Angular 应用中。\n\n图 10.3 显示了 Chrome 浏览器中简单 Angular 应用的 augury console 标签。\n\n图 10.4\
  \ 显示了 Chrome 浏览器中简单 Angular 应用的 augury Component Tree 标签。\n\n## 显示 Angular 组件依赖树\n\
