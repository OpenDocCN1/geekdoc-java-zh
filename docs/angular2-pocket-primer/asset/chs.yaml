  ## 在 Angular 中使用 forkJoin 进行多个并发请求\n\n上一节的代码读取的是单个文件的内容。然而，在某些情况下，你可能需要从多个源加载数据，并在所有数据加载完成后延迟执行后续逻辑。Observable\
  \ 提供了一个名为 `forkJoin()` 的方法来“封装”多个 `Observable` 并并发发送多个 `http.get()` 请求。注意，如果任何单个请求失败，操作将失败。`subscribe()`\
  \ 方法为整个 `Observable` 集合设置处理器。\n\n![Image](img/disc.jpg)\n\n从附带的光盘将 `ForkJoin` 目录复制到方便的位置。列表\
