  \n本书旨在涵盖 Angular 4 的基本功能，并包含各种可以在 300 页书中呈现的代码示例（基于发布版本）。代码示例的主要目标是向你展示如何完成各种任务，例如显示和更新列表、将信息保存到数据存储中、使用\
  \ Observable 以及开发应用程序等。如果你对“完成任务”的 Angular 代码示例感兴趣，即使省略了一些细节，这本书可能非常适合你。\n\n如果你对本书的风格犹豫不决，或者你认为“口袋指南”应该有不同的格式，那么其他书籍可能更适合你。\n\
  \n### 阅读这本书需要 Angular 知识吗？\n\n阅读本书不需要预先了解 Angular。但你需要了解 HTML（如何使用基本元素）并具备一些 JavaScript\
  \ 知识。第 6 章 包含了 Node 相关的代码示例，这需要一些背景知识才能理解内容。第 7 章 包含了将 Angular 与 Redux 和 GraphQL\
  \ 结合的代码示例，这些是更高级的话题。然而，如果你专注于 Angular 的“核心”概念，可以跳过这两章。\n\n\n\n\n\n本书旨在面向具有不同年龄段、背景极其多样化的国际读者群体。虽然许多读者知道如何阅读英语，但他们的母语并不是英语（英语可能是他们的第二种、第三种甚至第四种语言）。因此，本书使用了标准的英语，而不是可能让这些读者感到困惑的口语化表达。如你所知，许多人通过不同类型的模仿来学习，包括阅读、写作或听取新材料（是的，还有一些基础视频可以参考）。本书考虑了这些点，旨在为目标读者提供一种舒适且有意义的学习体验。\n\
  \n## 如何充分利用本书\n\n有些程序员擅长从散文中学习，而另一些人则擅长从示例代码（大量的代码）中学习，这意味着没有一种单一风格适用于所有人。\n\n此外，有些程序员想先运行代码，看看它的作用，然后再返回代码深入研究细节（而另一些人则采用相反的方法）。\n\
  \n因此，书中包含了多种类型的代码示例：有的短，有的长，还有一些代码示例是从早期的代码示例“构建”而来的。\n\n## 本书的代码是如何测试的？\n\n书中的代码示例已在安装了\
  \ OS X 10.16 的 Macbook Pro  Google Chrome 浏览器（版本 53）中经过了测试。除非另有说明，否则没有使用任何特殊的浏览器特定功能，这意味着代码示例应该可以在其他平台的\
  \ Chrome 中运行，也可以在其他现代浏览器中运行。\n\n需要注意的另一点是，所有对“Web Inspector”的引用均指 Chrome 浏览器中的 Web\
  \ Inspector，它与 Safari 中的 Web Inspector 不同。如果你使用的是不同的（但仍是现代的）浏览器或早期版本的 Chrome，可能需要在网上查找启动和查看\
  \ Web Inspector 所需的按键序列。请访问此链接获取更多有用信息：\n\n[`benalman.com/projects/javascript-debug-console-log/`](http://benalman.com/projects/javascript-debug-console-log/)\n\
  \n## 为什么截图是黑白的？\n\n黑白图像的成本比原始彩色图像低，因此它们的加入意味着本书的价格更低。然而，彩色图像可以在附光盘上获得，还有补充的代码示例，这些示例在浏览器中启动时会以彩色渲染。\n\
  \n## 为什么本书有 300 页而不是 500 页？\n\n本书是 *Pocket Primer*（口袋指南）系列的一部分，该系列书籍页数通常在 200 到\
  \ 300 页之间。其次，目标读者涵盖了 HTML 和 JavaScript 知识水平从初学者到中级的群体。在本书的准备过程中，我们尽一切努力照顾这些读者，以便他们能够做好充分准备，在自学期间探索\
  \ SVG 的更高级功能。\n\n## 本书包含生产级代码示例吗？\n\n书中的代码示例确实使用了 `Angular` 的发布版本来演示 `Angular` 的各种特性。清晰性优先于编写更紧凑但更难理解（且可能产生\
  \ bug）的代码，特别是在一本短书里。如果你决定在生产环境的网站中使用书中的任何代码，你应当对该代码进行与任何其他 Web 应用程序同样严谨的分析。\n\n\
  ## 作者的其他相关书籍\n\n1) HTML5 Canvas and CSS3:\n[`www.amazon.com/HTML5-Canvas-CSS3-Graphics-Primer/dp/1936420341`](http://www.amazon.com/HTML5-Canvas-CSS3-Graphics-Primer/dp/1936420341)\n\
  \n2) jQuery, HTML5, and CSS3:\n[`www.amazon.com/jQuery-HTML5-Mobile-Desktop-Devices/dp/1938549031`](http://www.amazon.com/jQuery-HTML5-Mobile-Desktop-Devices/dp/1938549031)\n\
  \n3) HTML5 Pocket Primer:\n[`www.amazon.com/HTML5-Pocket-Primer-Oswald-Campesato/dp/1938549104`](http://www.amazon.com/HTML5-Pocket-Primer-Oswald-Campesato/dp/1938549104)\n\
  \n4) jQuery Pocket Primer:\n[`www.amazon.com/dp/1938549147`](http://www.amazon.com/dp/1938549147)\n\
  \n以下开源项目包含代码示例，有时可以补充本书书中各个章节的内容：\n\n[`code.google.com/p/css3-graphics/`](https://code.google.com/p/css3-graphics/)\n\
  [`code.google.com/p/d3-graphics/`](https://code.google.com/p/d3-graphics/)\n[`code.google.com/p/html5-canvas-graphics/`](https://code.google.com/p/html5-canvas-graphics/)\n\
  [`code.google.com/p/jquery-css3-graphics/`](https://code.google.com/p/jquery-css3-graphics/)\n\
  [`code.google.com/p/raphael-graphics/`](https://code.google.com/p/raphael-graphics/)\n\
  [`code.google.com/p/svg-filters-graphics/`](https://code.google.com/p/svg-filters-graphics/)\n\
  \n# 第 1 章\n## ANGULAR 快速介绍\n\n本章提供了开发 `Angular` 的快速介绍。在涵盖了 `Angular` 的高层方面后，你就可以快速掌握代码示例。同时，请记住你需要投入精力进行更深层次的理解。\n\
  \n第一部分讨论了 `Angular` 的设计目标和一些新特性，例如组件、模块和单向数据绑定。第二部分讨论了 `Angular` 命令行界面（CLI），它是一个用于生成\
  \ `Angular` 应用的命令行工具。\n\n在阅读本章之前，有几点需要注意。首先，本书提供了许多 `Angular` 应用，因此关于 `Angular`\
  \ 概念、设计目标和架构的细节比 500 页的书要“轻”。然而，你可以在网上找到有用信息。\n\n其次，你可以使用 ECMA5、ES6 和 `TypeScript`\
  \ 创建 `Angular` 应用。但主要建议是使用 ES6 或 `TypeScript` 开发 `Angular` 应用；事实上，书中所有的代码示例都使用 `TypeScript`，这使得后台执行的转译过程变得简单。\n\
  \n## Angular 支持版本：原理\n\n如果你不知道，`Angular` 的领域发展迅速，从 2017 年 3 月 `Angular 4` 的发布一直到计划于\
  \ 2018 年 9 月发布的 `Angular 7`。\n\n每个后续版本（从 2018 年的 `Angular 6` 开始）可能只支持两个之前的 `Angular`\
  \ 版本。例如，`Angular 6` 将支持 `Angular 4` 和 `Angular 5`，而 `Angular 7` 将支持 `Angular 6`\
  \ 和 `Angular 5`（但不支持 `Angular 4`）。\n\n\n\n\n\n此外，Angular 的命名规范中存在某种“双重性”：即将发布的 Angular\
  \ 版本会指定具体的版本号，但不带版本号的 `Angular` 是 `Angular 2` 及更高版本的官方称呼（而 `AngularJS` 则是版本 `1.x`\
  \ 的官方名称）。\n\nAngular 核心团队在这一开发过程中的另一个重要目标是尽可能减少**破坏性变更**（breaking changes），并确保此类更改在升级到\
  \ Angular 新版本时的影响降至最低。\n\n### 注意\n尽管未来的生产环境代码发布带有版本号，但 `Angular 2` 及更高版本官方上被称为 `Angular`。\n\
  \n### 跳过 Angular 3 的原因\n\nAngular 核心库位于 `github.com/angular/angular`。它们的所有库的版本标记方式相同，但作为不同的\
  \ Node 包进行分发：\n\n`@angular/core v2.3.0`\n`@angular/compiler v2.3.0`\n`@angular/compiler-cli\
  \ v2.3.0`\n`@angular/http v2.3.0`\n`@angular/router v3.3.0`\n\n如你所见，路由器包（router）的版本号与其他包不同。使版本号保持一致的最简单方法是使用版本\
  \ `4` 而不是版本 `3`，这导致了跳过 `Angular 3`。\n\n### TypeScript 版本\n\n将 TypeScript 依赖从 `v1.8`\
  \ 升级到 `v2.1`（或更高）确实涉及破坏性变更。幸运的是，从 Angular 版本 `2` 升级到版本 `4`（及更高）并不涉及重大重写，只需更改几个核心库。\n\
  \nAngular 团队开发了一套自动升级流程，他们使用的工具也可能供通用使用（可能在 2017 年期间）。\n\n### 注意\n本书中的 `Angular\
  \ 2` 应用使用 `TypeScript` 编译器的 `2.2.2` 版本。\n\n### 从 Angular 2 迁移到 Angular\n\n如果你使用的是最新版本的\
  \ Angular，则本节是可选的，因为最新版本已包含了 `Angular 2.0` 之后 `Angular 2.x` 中引入的所有功能。\n\n下方提供了几个\
  \ `Angular 2.x` 版本的简要概述，因为新功能是添加到 `Angular 2` 中的（但它们并不属于 `Angular 2.0`）。此外，`TypeScript`\
  \ 的版本也发生了变化。\n\n首先，`Angular 2.2` 于 2016 年 11 月发布；该版本提供了提前编译（AOT）兼容性，并在第 10 章中进行了详细讨论。接着，Google\
  \ 在 2016 年 12 月发布了 `Angular 2.3`，它包含了用于与集成开发环境（IDE）集成的 `Angular Language Service`。该服务为\
  \ `Angular Templates` 提供类型补全和错误检查。此外，该服务还支持组件的对象继承特性。\n\n关于 `TypeScript` 的版本：`Angular\
  \ 2` 使用 `TypeScript 1.8`，而 `Angular 4` 的初始正式版本使用 `TypeScript 2.1.6`（或更高），这涉及到一些较小的破坏性变更。\n\
  \n### Angular 应用需要学习的知识\n\n本书中的 Angular 应用是用 `TypeScript` 编写的，但你还需要掌握以下技术的基础能力：\n\
  \n![Image](img/greybox.jpg) `NodeJS` (`npm`)\n![Image](img/greybox.jpg) `ECMA5`,\
  \ `ES6`, 和 `TypeScript`\n![Image](img/greybox.jpg) `Webpack 2.2` (或更高)\n\n以下子节包含关于上述列表项目的更多信息。\n\
  \n### NodeJS\n\n本书中的代码示例需要 `node v6.x.x`（或更高）和 `npm 4.x.x`（或更高）。在终端中运行以下命令确定你机器上的版本：\n\
  \n```bash\nnode -v\nnpm -v\n```\n\n如有必要，请访问 `NodeJS` 主页下载更新版本的 `node` 可执行文件。如果你从未用过\
  \ `Node`，请阅读在线教程以理解以下命令的作用：\n\n```bash\nnpm install -g webpack\nnpm install webpack@latest\
  \ --save\nnpm start\n```\n\n### ECMA5, ES6 和 TypeScript\n\n你需要学习 `ES6` 和 `TypeScript`\
  \ 的基本概念，它们各自的主页包含了大量帮助你入门的信息。特别是要学习箭头函数、类、模板字符串和模块加载器。其他实用的功能包括扩展运算符和剩余参数运算符（你将在第\
  \ 7 章中遇到它们）。正如你在后续章节中看到的，Angular 应用严重依赖动态模板，这些模板经常涉及变量的插值（通过 `{{}}` 语法）。\n\n如果你计划用\
  \ `TypeScript` 编写 Angular 应用，掌握 `ES6` 知识会帮助。幸运的是，以下网站提供了一个在线“游场”以及 `TypeScript`\
  \ 文档和代码示例链接：\n\n*[`www.typescriptlang.org/play/`](https://www.typescriptlang.org/play/)*\n\
  \n熟悉 `ECMA5` 同样有用：例如，`filter()` 函数非常方便（例如在 `Angular Pipes` 中），当你在 Angular 应用中将 `Observables`\
  \ 与 HTTP 请求结合时，`map()` 函数会很有用。其他函数如 `merge()` 和 `flatten()` 也可以很有用，你可以根据需要学习这些以及其他函数。\n\
  \n你还需要对 `Promises` 和 `Observables` 有基础了解。带有 `TypeScript` 的 Angular 偏向使用 `Observables`，本书的代码示例也是如此，但你会遇到\
  \ `Promises`。请利用关于 `ECMA5` 和 `Promises` 的在线资源。\n\nAngular 利用了 `ES6` 特性（如组件和类），以及\
  \ `TypeScript` 的特性（如注解和类型系统）。\n\n对于构建工具，`Webpack` 已成为 Angular 应用的事实标准。`Webpack`（2.2\
  \ 或更高版本）是 Angular 应用的事实构建工具，其主页位于：\n\n*[`webpack.github.io/`](https://webpack.github.io/)*\n\
  \n如果你没有用过 `Webpack`，请学习 `2.x` 版本的功能（忽略 `1.x`）。\n\n其他相关细节：你可以在 `Electron`、`Webstorm`\
  \ 和 `Visual Studio Code` 中开发 Angular 应用。请查看各自网站的价格支持。最后，以下链接包含了样式指南以及开发 Angular\
  \ 应用的“最佳实践”：\n\n*[`github.com/mgechev/angular2-style-guide`](https://github.com/mgechev/angular2-style-guide)*\n\
  \n浏览上述链接以熟悉其内容，这样你在学习本书章节时就知道何时阅读相关部分。\n\n### Angular 高层视图\n\nAngular 设计为一个支持在浏览器中运行\
  \ Angular 应用，并支持服务端渲染以及移动设备 Angular 应用的平台。第一个方面——在浏览器中渲染 Angular 应用是本书的重点。第二个方面——`Angular\
  \ Universal`（即服务端渲染）将在第 6 章中简要讨论。本质上，服务端渲染是在服务器上创建 Angular 应用的“第一个视图”。由于浏览器不需要构建此视图，它可以更快地渲染视图并提高感知加载速度。第三个方面——移动设备上的\
  \ Angular 应用将在第 8 章中讨论。\n\n\n\n\nAngular 也采用基于组件的架构，其中组件以树形结构组织（Angular 模块也是如此，你将在第\
  \ 5 章单向数据绑定\n\n![Image](img/greybox.jpg)“树摇优化”\n\n![Image](img/greybox.jpg)变化检测\n\
  \n![Image](img/greybox.jpg)样式封装\n\n前两个特性在下方简要讨论，第三个特性将在第 2 章中讨论，那里的代码示例比本章更易理解。\n\
  \n由于 Angular 4 的正式版本于 2017 年 3 月发布，并且发布了额外的“点”版本（例如 4.1），后期的发布可能会导致书中某些代码示例发生破坏性变化。因此，你可能需要修改受影响代码示例中的应用程序接口（API）调用，或更改某些导入语句。你可以随时查阅在线文档以了解\
  \ Angular 连续版本之间的变化：\n\n[*https://angular.io/](https://angular.io/)*\n\n## Angular\
  \ 中的单向数据绑定\n\nAngular 将声明式单向绑定作为默认行为（但如果你愿意，你也可以切换到双向绑定）。单向绑定充当单向变化传播，与双向数据绑定相比具有两个优势：(1)\
  \ 通过消除 Angular 1.x 中的 `$digest` 循环和观察器，提升了性能；(2) 减少了代码复杂度。Angular 还支持状态化、响应式和不可变模型。随着你操作\
  \ Angular 应用程序，上述陈述的含义将变得更加清晰。\n\nAngular 应用程序涉及定义一个顶层（“根”）模块，该模块引用一个 `Component`，该组件又指定一个\
  \ HTML 元素（通过强制性的 `selector` 属性）作为 `Component` 的“父”元素。`Component` 的定义涉及所谓的“装饰器（decorator）”，它包含\
  \ `selector` 属性和 `template` 属性（或 `templateUrl` 属性）。\n\n`template` 属性包含 HTML 和自定义标记的混合（这些可以放在单独的文件中，并通过\
  \ `templateUrl` 属性引用）。此外，`Component` 之后紧跟一个 TypeScript 类定义，它包含了“后端代码”，这些代码与 `template`\
  \ 属性中出现的组件变量相关。在你操作了一些 Angular 应用程序后，这些细节将变得非常清晰。\n\n注意\n\n`templateUrl` 属性和 `styleUrls`\
  \ 属性指向文件，而 `template` 属性和 `styles` 属性指向内联代码。\n\n## Angular 应用程序的树摇\n\n树摇（Tree shaking）是指“修剪”\
  \ Angular 项目中不必要的文件（其他技术具有相同的概念），就像摇掉树上的枯枝一样，以便创建一个 Angular 应用程序的生产版本。这个生产版本可以小得多，因此需要更少的加载时间。Webpack\
  \ 2 和 Angular AOT 支持树摇，你将在第 10 章中看到一个 AOT 的示例。\n\n## Angular 应用程序的高层视图\n\nAngular\
  \ 应用程序由内置组件和自定义组件（后者由你编写）组成，每个组件通常定义在独立的 TypeScript 文件中（扩展名为 `ts`）。每个组件通过 `import`\
  \ 语句指定其依赖。Angular 中有多种类型的依赖，例如指令（directives）和管道（pipes，在本章稍后部分讨论）。\n\n*自定义指令（custom\
  \ directive）*本质上是定义组件的 TypeScript 文件内容。因此，一个自定义指令由 `import` 语句、一个 `Component` 装饰器和一个导出的\
  \ TypeScript 类组成。\n\nAngular 提供了*内置指令*，例如 `ngIf`（用于“if”逻辑）和 `ngFor`（用于循环）。这两个指令也被称为*结构型指令（structural\
  \ directives）*，因为它们修改 HTML 页面的内容。\n\nAngular *内置管道（built pipes）*包括日期和数字项目（货币、小数、数字和百分比），而*自定义管道（custom\
  \ pipes）*由你定义。\n\n此外，TypeScript 类使用*装饰器（decorator）*（内置函数）为类、其成员或方法参数提供元数据。装饰器很容易识别，因为它们总是带有\
  \ `@` 前缀。Angular 提供了许多内置装饰器，例如 `@Component()` 和 `@NgModule`。\n\n到此，Angular 特性的高层介绍结束。本章的下一部分将介绍\
  \ Angular CLI，它将在本书中用于创建 Angular 应用程序。\n\n## Angular CLI\n\n在 Angular 的测试发布期间，开发者使用手动过程创建应用程序，或者使用“启动”或“种子”项目（通常在\
  \ GitHub 上可用）。然而，在 Angular 发布新版本后，这些项目往往已经过时。因此，书中的代码示例基于 `Angular CLI`，它是 Google\
  \ 提供的官方 Angular 应用程序生成器。\n\nAngular CLI 是一个名为 `ng` 的命令行工具，它可以生成完整的 Angular 应用程序，包括与测试相关的代码，并且（默认）还会启动\
  \ `npm install` 来安装 `node_modules` 中的所需文件。Angular CLI 的首页位于：\n\n[*https://cli.angular.io](https://cli.angular.io)*\n\
  \nAngular CLI 生成一个名为 `package.json` 的配置文件来管理必要的依赖项及其版本号。生成 Angular 应用程序后，导航到 `node_modules`\
  \ 子目录，你将看到 Angular 应用程序所需的各种子目录。\n\nAngular CLI 是使用“启动”项目或手动创建项目的优替代方案，其功能集将随时间不断改进。\n\
  \n### 安装 Angular CLI\n\n你需要执行几个步骤来安装 Angular CLI。首先，使用此命令卸载之前的 CLI（如果你安装了旧版本）：\n\
  \n```bash\nsudo npm uninstall -g angular-cli\nnpm cache clean\n```\n\n接下来，使用此命令安装新的\
  \ CLI（注意新的包名）：\n\n```bash\n[sudo] npm install -g @angular/cli\n```\n\n按照如下方式创建一个名为\
  \ hello-world 的项目：\n\n```bash\nng new hello-world\n```\n\nAngular CLI 提供了自定义代码之外的所有内容，而且安装时间明显于启动项目。其次，Angular\
  \ CLI 允许你生成新的组件、路由等，这些在启动项目中是无法实现的。第三，Angular CLI 完全基于 TypeScript，生成的应用程序包含了 JavaScript\
  \ 对象表示法（JSON）文件 `tsconfig.json`、`tslint.json`、`typedoc.json` 和 `typings.json`。相反，启动项目倾向于使用\
  \ Webpack，这涉及到包含 Angular 应用程序信息的配置文件 `webpack.config.js`。\n\n### Angular CLI 功能\n\
  \n`ng` 可执行文件支持各种选项，这里显示了一些命令行调用：\n\n```bash\nng new app-root-name\nng build\nng\
  \ deploy\nng e2e\nng generate <component-type>\nng generate route\nng generate ...\n\
  ng lint\nng serve\nng test\nng x18n\n```\n\n\n\n\n`ng g` 选项等于 `ng generate` 选项，它可以允许你生成\
  \ Angular 自定义组件（Component）、Angular Pipe（在第 5 章中讨论过）等。`ng x18n` 选项从源代码中提取 i18n 消息。下一节将展示如何在应用程序中生成\
  \ Angular 自定义组件的示例，以及为你生成的文件的内容。\n\n组件的默认前缀是 `app`（例如 `<app-root></app-root>`），但你可以通过以下调用指定不同的前缀：\n\
  \n```bash\nng new app-root-name –prefix abc\n```\n\n### NOTE\n\n通过 `ng` 创建的 Angular\
  \ 始终包含 `src/app` 目录。\n\n关于升级 Angular CLI 的信息位于此处：\n\n[`github.com/angular/angular-cli`](https://github.com/angular/angular-cli)\n\
  \nAngular CLI 的文档位于此处：\n\n[`cli.angular.io`](http://cli.angular.io)\n\n现在你已经了解了\
  \ `ng` 工具的一些功能，让我们来创建第一个 Angular 应用程序，这是下一节的主题。\n\n### 通过 Angular CLI 创建“Hello World”应用程序\n\
  \n导航到一个方便的目录并使用以下命令创建一个名为 `myapp` 的 Angular 应用程序：\n\n```bash\nng new myapp\n```\n\
  \n### NOTE\n\n早期版本的 `ng` 需要一个 `--ng4` 。\n\n在完成前面的命令后，进入新项目内部：\n\n```bash\ncd myapp\n\
  ```\n\n使用以下命令启动 Angular 应用程序：\n\n```bash\nng serve\n```\n\n前面的命令会自动在以下 URL 启动浏览器会话：\n\
  \n`localhost:4200`\n\n你将在屏幕上看到以下内容：\n\n**app works!**\n\n上一个字符串是在文件 `app/app.component.ts`\
  \ 的 `template` 属性中指定的。\n\n### NOTE\n\n`template` 属性（或 `templateUrl` 属性）是你放置自定义代码的地方，这些代码将生成\
  \ HTML 输出，然后将其插入到 `index.html` 网页的 `<app-root>` 元素中。\n\n### Angular 应用程序的结构\n\n\
  当你调用 `ng` 命令创建 Angular 应用程序时，这里是自动创建的文件：\n\n- `angular-cli.json`\n- `dist/`（省略详情）\n\
  - `e2e/`（省略详情）\n- `karma.conf.js`\n- `node_modules`\n- `package.json`\n- `protractor.conf.js`\n\
  - `README.md`\n- `src/app/app.component.css`\n- `src/app/app.component.html`\n-\
  \ `src/app/app.component.spec.ts`\n- `src/app/app.component.ts`\n- `src/app/app.module.ts`\n\
  - `src/environments/environment.prod.ts`\n- `src/environments/environment.ts`\n\
  - `src/favicon.ico`\n- `src/index.html`\n- `src/main.ts`\n- `src/polyfills.ts`\n\
  - `src/styles.css`\n- `src/test.ts`\n- `src/tsconfig.json`\n- `tslint.json`\n\n\
  `dist` 子目录包含了编译后的项目和 JavaScript 包，而 `e2e` 子目录包含了端到端测试的文件（调用命令 `ng test` 执行测试）。\n\
  \n`app.component.ts` 文件（加粗显示）包含了此书中代码示例中的自定义 TypeScript 代码，并且（程度较小）你可能需要更新 `app.module.ts`\
  \ 文件。当你需要包含 JavaScript `<script>` 元素（用于 jQuery、Bootstrap 等）时，你将修改 `index.html`，而\
  \ `styles.css` 文件用于全局层叠样式表（CSS）样式规则（如果有的话）。\n\n最后，`angular-cli.json`、`package.json`\
  \ 和 `tslint.json` 分别是 `ng`、`npm` 和 `tslint` 的配置文件。请注意，当你调用 `ng lint` 命令时，它会调用 `tslint`\
  \ 工具，该工具反过来依赖于 `tslint.json` 文件。\n\n### Angular 项目文件的命名规范\n\n`app` 子目录下的文件具有由三部分组成的命名规范：功能类型、是组件还是模块，以及一个指示代码类型的后缀。例如，TypeScript\
  \ 文件 `app.component.ts` 包含了应用程序与组件相关的代码，而 TypeScript 文件 `app.module.ts` 包含了模块相关的代码。此外，`app.component.css`\
  \ 文件包含该组件的 CSS 选择器，而 `app.component.html` 包含同一组件的 HTML 标记。\n\n本章的后续部分包含两个章节：第一部分讨论\
  \ `index.html` 的内容和各种 JavaScript 配置相关文件，第二部分讨论包含 `app` 子目录的应用程序相关文件。遗憾的是，阅读这些章节是一项“苦差”，虽然建议你阅读它们，但你可以快速略过这一节，在你启动了第一个\
  \ Angular 应用程序后再返回。两种阅读风格都有权衡，因此请以最适合你学习风格的方式处理这些材料。\n\n现在让我们来看 HTML 网页 `index.html`\
  \ 的内容，它是我们 Angular 应用程序的主网页。\n\n### index.html 网页\n\n列表 1.1 显示了 `index.html` 的内容，它是通过\
  \ `ng` 工具生成的 Angular 应用程序的单元网页。\n\n***列表 1.1: index.html***\n\n![Image](img/13.jpg)\n\
  \n只有 `<app-root>` 元素（在 `app.component.ts` 的 `selector` 属性中定义）表明这是一个 Angular 应用程序的一部分。\n\
  \n### NOTE\n\nJavaScript 依赖在构建项目时动态插入 `index.html` 中。\n\n在我们深入研究 TypeScript 文件之前，让我们快速绕道了解一下导入语句。\n\
  \n### 导出包和导入类（可选）\n\n记住以下一点：导入 TypeScript 文件的类必须在定义该类的 TypeScript 文件中导出。\n\n有两种常见的导入语句类型：一种是从\
  \ Angular 模块导入包，另一种类型是导入自定义类（你编写的）。以下是两种的语法：\n\n```typescript\nimport {some-package-name}\
  \ from 'some-angular-module';\nimport {some-class } from './custom-class';\n```\n\
  \n这里是两种类型的示例：\n\n```typescript\nimport { NgModule } from '@angular/core';\n```\n\
  \n在前面的代码段中，`NgModule` 包是从 `node_modules` 目录下的 `@angular/core` 模块导入的。`EmpComponent`\
  \ 类是在 `component.ts` 文件中定义并导出的自定义类。\n\n在第二个导入语句中，从 TypeScript 文件导入自定义类时需要 `./` 前缀，并注意省略了\
  \ `.ts` 后缀。\n\n\n\n\n列表 1.2 中的第一行代码是一个导入（import）语句，它是代码列表中后续条件逻辑所必需的。你会在许多 Angular\
  \ 代码示例中看到第二个导入语句，它对于在桌面式电脑和笔记本电脑上启动 Angular 应用程序至关重要。\n\n第三个导入语句涉及 Angular 应用程序的顶层模块，该模块反过来包含了包含在此\
  \ Angular 模块中的所有自定义组件和服务。第四个导入语句包含了环境相关信息，这些信息将用于接下来的条件逻辑片段中：如果当前应用程序处于生产模式，则执行\
  \ `enableProdMode()` 函数。\n\n最后一行代码是实际的引导（bootstrapping）过程，涉及在浏览器中渲染 `app.component.ts`\
  \ 中的代码。\n\n## 顶层模块文件 `app.module.ts`\n\n列表 1.3 显示了 `app.module.ts`（位于 `src/app`\
  \ 子目录）的内容，该文件导出了顶层 Angular 模块 `AppModule`。\n\n***列表 1.3: app.module.ts***\n\n![Image](img/pg15b.jpg)\n\
  \n列表 1.3 包含了两个导入语句，分别导入了 `BrowserModule`、`NgModule`、`FormsModule` 和 `HttpModule`，它们都是\
  \ Angular 的一部分。最后一个导入语句导入了 `AppComponent` 类，它是列表 1.4 所示的顶层组件。\n\n注意\nAngular 依赖始终包含\
  \ `@` 符号，而自定义依赖则指定指向 TypeScript 文件的相对路径。\n\n接下来，`@NgModule` 装饰器包含一个带有各种属性的对象（将在下一节中讨论）。这些属性为\
  \ `AppModule` 类指定了元数据，该类在代码的最后一行被导出。`AppModule` 中的元数据涉及以下属性，每个属性都是值数组：`imports`、`providers`、`declarations`、`exports`\
  \ 和 `bootstrap`。\n\n在列表 1.3 中，数组属性 `declarations`、`imports` 和 `bootstrap` 是非空的，而\
  \ `providers` 属性是一个空数组。这些元数据对于 Angular 引导 `AppComponent` 中的代码是所必需的，而 `AppComponent`\
  \ 反过来包含了渲染内容的细节（例如，`<h1` 元素）以及渲染的位置（例如，`index.html` 中的 `app-root` 元素）。\n\n现在，让我们更仔细地观察\
  \ `@NgModule` 装饰器中每个数组属性的作用，以理解它们的用途。\n\n## `@NgModule` 中的元数据\n\n`imports` 数组包含了该应用程序所需的*模块*，例如\
  \ `BrowserModule`，以及该应用程序的一些可选模块（例如 `FormModule`）。`imports` 数组不是传递的：如果模块 A 导入了模块\
  \ B，而模块 B 导入了模块 C，那么模块 C 不会被导入到模块 A 中。\n\n接下来，`providers` 数组是该 Angular 应用程序全局范围的服务数组。服务是提供在应用程序中不可见的后台功能的东西。`providers`\
  \ 数组包含了任何通过 `@Injectable` 装饰器（后文将讨论）定义的可注入服务。\n\n`declarations` 数组由该应用程序所需的*组件*组成，例如\
  \ `AppComponent`，以及自定义组件、指令和管道（pipes），它们都具有（模块级）的私有作用范围。具体来说，*私有作用范围*意味着 `declarations`\
  \ 数组中的所有内容只能通过在模块模块声明的其他组件、指令和管道来访问。\n\n请记住，在 `declarations` 属性列出的组件*必须*从各自的组件相关文件中导出。例如，`AppComponent`\
  \ 是从 `app.component.ts` 导出的（后文所示），这允许你在 `app.module.ts` 中导入它并在 `declarations` 属性中指定它。\n\
  \n`exports` 数组包含了应用程序其他组件所需的组件、指令和管道。\n\n`schemas` 数组包含了值 `CUSTOM_ELEMENTS_SCHEMA`，它提供了应用程序“外部”的额外信息；请参见第\
  \ 2 章中的示例和第 5 章中的示例。\n\n最后，`bootstrap` 数组包含了当 Angular 应用程序在浏览器中启动时将“引导”的组件名称。\n\n\
  注意\n通常情况下，建议通过 `bootstrap` 属性引导一个组件。\n\n## 顶层组件文件 `app.component.ts`\n\n列表 1.4 显示了\
  \ `app.component.ts`（位于 `src/app` 子目录）的内容，该文件导出了顶层 Angular 组件 `AppComponent`。\n\n\
  ***列表 1.4: app.component.ts***\n\n![Image](img/pg17.jpg)\n\n列表 1.4 以一个用于 Angular\
  \ `@Component` 装饰器的导入语句开始，用于为 `AppComponent` 类定义元数据。至少，这些元数据涉及两个属性：`selector` 和\
  \ `template`。除了路由相关的组件外，这两个属性在自定义组件中都是必需的。在这个示例中，`selector` 属性指定了自定义元素 `app-root`（你可以更改它），即你在\
  \ HTML Web 页面 `index.html` 中看到的那个元素。\n\n`template` 属性指定了将插入到自定义元素 `app-root` 中的\
  \ HTML 标记。在这个示例中，标记是一个包含某些文本的 `<h1` 元素。列表 1.4 的最后一行代码是一个导出语句，它使得 `AppComponent`\
  \ 类可以在其他 TypeScript 文件（可用，如列表 1.3 所示的 `app.module.ts`）导入。\n\n注意\n`main.ts`、`app.component.ts`\
  \ 和 `app.module.ts` 文件位于书中所有的 Angular 项目中。\n\n现在通过进入根目录并输入以下命令启动你的 Angular 应用程序：\n\
  \n```bash\nng serve\n```\n\n下一节将讨论模板语法，你将在自定义代码的 `template` 属性中使用它。\n\n## 简单的 Angular\
  \ 模板\n\n正如你在列表 1.4 中看到的，`app.component.ts` 文件包含一个带有单行文本的 `<h1>` 元素的模板属性。但是，当你将所有内容放在一对反引号（```）中时，Angular\
  \ 允许你指定多行文本。这种语法（引入 ES6）在 Angular 中被广泛使用，并且方便地支持变量插值。\n\n列表 1.5 显示了 `app.component.ts`\
  \ 文件的内容，它比列表 1.4 内容更多。此代码示例说明了如何在 `template` 属性中使用插值。\n\n***列表 1.5: app.component.ts***\n\
  \n![Image](img/pg18.jpg)\n\n![Image](img/pg19a.jpg)\n\n列表 1.5 包含两个 `<h3>` 元素；第一个是简单的文本字符串，第二个引用了在类中定义的值。Angular\
  \ 使用被称为*插值*的方法处理字面量对象 `emp` 的元素，并将第二个 `<h3>` 元素中的变量替换为实际值。\n\n## 在 Angular 中处理组件\n\
  \nAngular 应用程序是嵌套组件的树，其中顶层组件是应用程序。组件定义了用户界面（UI）元素、屏幕和路由。通常，组织 Angular 应用程序的方法是将每个组件放在一个\
  \ TypeScript 文件中，然后在“主文件”（通常命名为 `app.component.ts`）中导入该文件。\n\n## 组件中的元数据\n\nAngular\
  \ 组件通常是 `@Component` 装饰器和类定义的组合，类可以可选包含构造函数。此处显示示例：\n\n![Image](img/pg19b.jpg)\n\
  \n之前的 `@Component` 装饰器包含了多个属性，其中一些是必需的，另一些是可选的。让我们看看前面代码块中的两种类型。\n\n\n\n接下来，`template`\
  \ 属性（或 `templateUrl` 属性）是强制性的，它包含了标记、插值变量和 TypeScript 代码的混合。一个重要的细节是：当 `template`\
  \ 属性的定义跨越多行时，需要使用反引号。\n\n`directives` 属性是一个可选属性，用于指定一个组件数组，这些组件被视为嵌套组件。在这个示例中，`directives`\
  \ 属性指定了组件 `EmpComponent`，该组件在代码块开头附近也通过 `import` 语句导入了。请注意，导入语句不包含 `@` 符号，这意味着 `EmpComponent`\
  \ 是在 `emp/emp.component.ts` 文件中定义的自定义组件。\n\n## Angular 中的有状态组件与无状态组件\n\n从高层来说，有状态组件（stateful\
  \ component）保留了与同一个 Angular 应用程序其他部分相关的信息。相比之下，无状态组件（stateless components）不维护应用程序状态，也不请求或获取数据：它们通过属性绑定从另一个组件（例如其父组件）传递数据。\n\
  \n本书书中的代码示例通常是有状态组件、无状态组件以及有时“值对象”的组合，值对象是自定义类的实例，用于对不同的实体进行建模（如员工、客户、学生等）。\n\n\
  你将在第 2 章中看到展示型组件的示例。同时，关于深入研究有状态和无状态组件的好文章位于这里：\n\n[https://toddmotto.com/stateful-stateless-components#stateful]\n\
  \n## 使用 Angular CLI 生成组件\n\n早些时候你看到了 `ng` 工具的一些选项，本节将讨论如何使用 `generate` 选项。此外，这里有一些自解释且易懂的示例：\n\
  \n```\nng generate component mycomp\nng generate directive mydir\nng generate pipe\
  \ mypipe\nng generate route myroute\nng generate service mycomp\n```\n\n以下命令与上述列表中的命令等效，区别在于它们使用了短别名：\n\
  \n```bash\nng g c mycomp\nng g d mydir\nng g p mypipe\nng g r myroute\nng g s mycomp\n\
  ```\n\n前面的命令会创建位于 `src/app` 新子目录中的新文件。例如，`ng g c mycomp` 命令会创建子目录 `src/app/mycomp`\
  \ 并向其中填充文件（稍后会讨论）。\n\n如果你不想创建新的子目录，请使用 `--flat` 选项，新文件将放在 `src/app` 而不是 `src/app/mycomp`。\n\
  \n现在让我们在 Angular 应用程序中调用以下命令来生成学生组件：\n\n```bash\nng g c student\n```\n\n在前面的命令完成后，你将看到以下输出：\n\
  \n```\ninstalling component\ncreate src/app/student/student.component.css\ncreate\
  \ src/app/student/student.component.html\ncreate src/app/student/student.component.spec.ts\n\
  create src/app/student/student.component.ts\n```\n\n如你所见，输出输出了四个新文件：一个 CSS 文件、一个\
  \ HTML 文件、一个 TypeScript 测试文件和一个组件定义文件。\n\n列表 1.6 显示了 `student.component.ts` 的内容，其中包含了学生组件的代码。\n\
  \n***列表 1.6: student.component.ts***\n\n![Image](img/pg21.jpg)\n\n![Image](img/pg22a.jpg)\n\
  \n注意\n\n*当你使用 `ng` 创建自定义组件时，`ng` 会在 `app.module.ts` 中插入导入语句，并更新 `declarations` 属性以引用新的自定义组件。*\n\
  \n为了方便起见，当你从命令行生成组件时，`ng` 还会生成测试文件。特别是，列表 1.7 显示了名为 `student.component.spec.ts`\
  \ 的测试文件。\n\n***列表 1.7: student.component.spec.ts***\n\n![Image](img/pg22b.jpg)\n\
  \n列表 1.7 包含了导入语句，使各种组件对该测试文件可用，包括列表 1.6 中定义的 `StudentComponent`。\n\n自动生成的 `student.component.html`\
  \ 内容显示在此：\n\n```html\n<p>\n  student works!\n</p>\n```\n\n如你所见，`student.component.html`\
  \ 文件是极简的，你可以自由地在该文件中添加应用程序相关的 HTML 标记。\n\n注意 `student.component.css` 文件目前是空的；请添加任何你为了样式化而需要的\
  \ CSS 选择器。\n\n另一个细节：`ng` 允许你在现有的组件内部创建组件。例如，以下命令会在学生组件内部创建一个配置组件：\n\n```bash\nng\
  \ g component student/profile\n```\n\n你必须在 student 子目录中调用前面的命令，否则你将看到以下错误消息：\n\n\
  `You have to be inside an angular-cli project in order to use the generate command.`\n\
  \n当你准备好后，使用以下命令创建 Angular 应用程序的生产构建：\n\n```bash\nng build --prod\n```\n\n请记住，你可以通过\
  \ AOT 显著缩小 Angular 应用程序的大小，这将在第 10 章中进行详细讨论。\n\n## Angular 中的语法、属性和属性\n\nAngular\
  \ 为属性和属性引入了方括号 `[]` 表示法，以及处理事件函数的括号 `()` 表示法。这种新语法实际上是有效的 HTML5 语法。这里有一个指定属性和函数的代码段示例：\n\
  \n```html\n<foo [bar]=\"x+1\" (baz)=\"doSomething()\">Hello World</foo>\n```\n\n\
  这里显示了一个指定属性和函数的示例：\n\n```html\n<button [disabled]=\"!inputIsValid\" (click)=\"authenticate()\"\
  >Login</button>\n```\n\n这里有一个带有自定义元素的示例相关示例：\n\n```html\n<my-chart [data]=\"myData\"\
  \ (drag)=\"handleDrag()\"></my-chart>\n```\n\n前面的片段消除了对许多内置指令的需求，正如你在本章稍些时候将看到的。\n\
  \n## Angular 中的属性与属性的区别\n\n请记住以下区别：属性（Property）可以指定复杂的模型，而属性（Attribute）只能指定字符串。例如，在\
  \ Angular 1.x 中你可以写：\n\n```html\n<my-directive foo=\"{{something}}\"></my-directive>\n\
  ```\n\n这里显示对应的 Angular 代码（不需要插值）：\n\n```html\n<my-directive [foo]=\"something\"\
  ></my-directive>\n```\n\nAngular 的新架构提供了更高的性能以及开发更整洁的 Angular 应用程序的机制。\n\n## 在 Angular\
  \ 中显示按钮\n\n在学习了本章所有的代码列表并阅读了关于它们用途的解释后，你可能会怀疑 Angular 开发是否是一个长期而枯燥的过程。幸运的是，你可以用少量代码创建许多基础应用程序。当你准备好创建中等应用程序时，可以利用\
  \ Angular 应用程序基于组件的特性增量添加新组件（和模块）。\n\n作为一个简单的示例，本节中的 `app.component.ts` 文件包含了此 Angular\
  \ 应用程序的所有自定义代码。`ng` 工具用于生成此代码示例中的所有文件，你不需要手动干预那些其他文件。\n\n![Image](img/disc.jpg)\n\
  \n列表 1.8 显示了 `app.component.ts` 的内容，说明了如何渲染 `<button>` 元素并在点击事件时显示用户在当前会话期间点击 `<button>`\
  \ 元素的次数。\n\n\n\n\n列表 1.8 起于一个出现在 `app.component.ts` 中的导入语句（import），你将在本书的每个代码示例中看到此语句。该语句允许你访问\
  \ `Component` 装饰器，它将元数据注入到名为 `AppComponent` 的 TypeScript 类中。当 TypeScript 编译器将 TypeScript\
  \ 代码转译（转换）为 ECMA5 时，这些元也将将被包含在，以便在现代浏览器中运行 Angular 应用程序。\n\n所需的 `selector` 属性指定了值为\
  \ `app-root`，这是一个自定义元素（列在 `index.html` 中），它充当“容器”，模板元素的内容将渲染在其中。\n\n在例示例中，`template`\
  \ 属性包含一个响应点击事件的 `<button>` 元素和一个 `<p>` 元素，当用户点击 `<button>` 元素时，`<p>` 元素的内容将会更新。如你所见，点击项的值是\
  \ `clickMe()` 函数（定义在 `AppComponent` 类中），该函数会增加并显示 `clickCount` 变量的值。\n\n此外，`styles`\
  \ 属性为 `<button>` 元素指定了值 `red`。`styles` 属性是组件样式的示例，这意味着这些样式仅适用于给定组件的模板。\n\n![Image](img/pg26.jpg)\n\
  \n**图 1.1** 响应点击事件的 `<button>` 元素。\n\n实际上，Angular 通过生成唯一的属性来局部而非全局应用 CSS，当你点击 Chrome\
  \ 开发者工具中的“元素”选项卡时，这些属性是可见。\n\n关于 Angular 组件样式的更多详细信息请访问：\n\n[`angular.io/docs/ts/latest/guide/component-styles.html`](https://angular.io/docs/ts/latest/guide/component-styles.html)\n\
