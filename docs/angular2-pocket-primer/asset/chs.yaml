  \ UI 组件\n\n本章的代码示例展示了如何在 Angular 应用中使用 HTML 控件。然而，你也可以使用作为 HTML 控件“封装”的 Angular\
  \ UI 组件。官方 网站包含了丰富的 UI 组件：\n\n[`angular.io/resources/#!UI%20Components`](https://angular.io/resources/)\n\
  \n前面的网站包含指向其他工具包的链接，例如 `ng-bootstrap`（用于 Bootstrap 的原生 Angular 2 指令）和 `Angular Material\
  \ 2`（用于 Angular 2 的 Material Design 组件）。\n\n以下网站包含了丰富的 Angular UI 组件（例如表格、树、菜单和图表）：\n\
