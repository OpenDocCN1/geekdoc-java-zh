  \ `json-server` 作为本地文件服务器的代码示例部分此结束。本章的下一节将讨论 Angular 中如何支持路由。\n\n#### Angular 中的路由\n\
  \nWeb 应用可以有对应不同 URL 的不同部分，通过编程支持这些部分被称为*路由（routing）*。当你看到一个包含标签页或一组显示应用程序不同部分的水平链接的\
  \ Web 页面时，很可能该页面正在使用某种形式的路由。\n\n例如，Web 页面可能提供一个“关于”（about）部分、“登录”（login）部分和一个“订单”（orders）部分。假设你想允许用户在登录应用程序后才能访问订单部分。路由可以限制对订单部分的访问，并保持状态，以简化部分间切换的代码。\n\
  \nAngular 应用中的路由涉及在 `app.module.ts` 中添加路由与操作之间的“映射”，下面的变量 `appRoutes` 就展示了这样一个示例：\n\
  \n![Image](img/pg121a.jpg)\n\n上述代码块定义了变量 `appRoutes`，它指定了三个路由——about、login 和 contact——分别映射到组件\
  \ `AboutComponent`、`LoginComponent` 和 `ContactComponent`。\n\n无论用户点击哪个链接，相关的组件都会在\
  \ `<router-outlet>` 元素中（在 `app.component.ts` 的模板定义中指定）。当用户点击链接时，`<router-outlet>`\
  \ 中的所有现有内容将被移除，并被与当前点击链接关联的组件替换。\n\n使用标签页进行类比，当用户点击标签页时，当前屏幕内容会被最近点击的标签页内容替换。\n\n\
  一个更通用的路由集配置场景支持重定向和指定参数，如下所示：\n\n![Image](img/pg121b.jpg)\n\n关于 Angular 路由的详细信息请访问：\n\
  \n*[`angular.io/docs/guide/router.html`](https://angular.io/docs/guide/router.html)*\n\
  \n请记住，路由代码相对于之前的 Angular 版本发生了变化，未来也可能发生变化，因此最好查看 Stack Overflow 上的最新帖子以及在线文档。\n\
