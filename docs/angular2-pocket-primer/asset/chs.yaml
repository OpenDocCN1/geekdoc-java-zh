  \ from './employee';\n```\n\n第二个更改是将列表 4.10 中加粗的代码片段替换为以下代码片段，该片段声明 `employees`\
  \ 变量为符合 `Employee` 接口的对象的数组：\n\n```typescript\nemployees : Employee[];\n```\n\n\
  启动应用程序，你将看到相同的结果。请记住，此项目中唯一的显著区别涉及 TypeScript `interface`。虽然在这个示例中使用 TypeScript\
  \ `interface` 没有提供显著优势，但请考虑包含多个 TypeScript 接口的 Angular 应用程序，某些接口可能包含几十个元素。在这种情况下，TypeScript\
  \ 接口简化了跟踪相关数据的任务，这在你需要执行创建、读取、更新和删除 (CRUD) 操作时非常有用。\n\n关于 TypeScript 接口有一些用的事实需要记住。首先，它们可以包含方法定义。其次，TypeScript\
  \ `interface` 可以扩展现有接口（有助于创建层级结构）。第三，TypeScript `interface` 可以扩展 `class`。虽然本章没有包含这些功能的示例，但你可以在线搜索\n\
