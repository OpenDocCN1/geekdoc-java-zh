  \ `routes/index.js`。\n3. 数据传递给 `views` 中的 Jade 模板。\n4. 生成 HTML 页面。\n5. 将生成的 HTML\
  \ 页面返回给客户端。\n\n### app.js 文件\n\n列表 6.7 显示了从 Mongo 数据库检索用户数据的 Node 应用程序的 `app.js`\
