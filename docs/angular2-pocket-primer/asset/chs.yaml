  \n\n\n\n\n由于 `Angular` 中依赖注入（DI）机制的存在，可以在 Angular 应用程序的其他部分调用服务。此外，Angular 确保了服务是单例的，这意味着每个服务的消费者都将访问服务类的同一个实例。\n\
