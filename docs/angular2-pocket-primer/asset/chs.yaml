  \n从本质上说，Universal Angular 应用程序涉及两个步骤的过程：使用 `npm` 启动一个基于 Express 的应用程序，该程序包含一个通往\
  \ `index.html` 网页的路由。该网页包含一个作为 Angular 应用程序根节点的元素，而后者是在 TypeScript 文件中定义的。\n\n###\
  \ 使用微服务（可选）\n\n本节包含了对微服务的简要和简化概述。你将学习微服务的某些优势和劣势，随后是一个使用微服务的 Angular 示例。尽管 Angular\
  \ 支持微服务（因此它是本章的相关主题），但你可以跳过本节而不影响连贯性。\n\n### 微服务的优势\n\n微服务架构将单体应用程序分解为一组服务，而不会减少原始应用程序的功能。每个服务都可以通过其暴露的应用程序接口（API）访问。使用微服务简化了“单一用途”服务的开发、维护和增强过程。\n\
  \n其次，微服务允许以独立的方式开发服务。每个新服务可以使用最适合该服务的技术来编写（这意味着并不强制使用当前技术）。\n\n第三个优势是，微服务可以相对于其他微服务进行独立部署。第四，服务可以相互独立地进行扩展。\n\
  \n#### 微服务的劣势\n\n许多许多独立微服务的集合可能会产生复杂性。微服务之间的通信需要对进程间通信做出决策。此外，微服务的分布式特性要求处理可能由于超时和其他原因引起的故障。\n\
  \n例如，如果面向事务的微服务与多个数据库进行交互，那么处理和协调这些事务可能会变得复杂。请记住，采用微服务的主要目标之一是减少大型单体应用中可能发生的相互依赖关系的复杂性。\n\
  \n有些人将微服务视为“细粒度的面向服务的架构 (SOA)”。然而，SOA 需要 Web 服务定义语言（WSDL），它定义了端点并且是强类型的，而微服务具有非常简单的连接和智能端点。另一个重要的区别是\
  \ SOA 通常是无状态的，而微服务是有状态的，并将数据和逻辑结合。总来说，SOA 是复杂且重量级的，而微服务是更简单、轻量级的独立进程。\n\n## 总结\n\
  \n本章向你展示了如何创建基于 Express 的 Node 应用程序来处理来自 Angular 应用程序的请求。你看到了如何使用 NoSQL 数据库 `MongoDB`\
  \ 为网页存储和检索数据。你还学习了如何在不同的端口上启动多个 Express 应用程序来为 Angular 应用程序提供数据。然后你了解了微服务的概述，它可以与\
  \ Angular 无缝工作。最后，你学习了关于 Angular Universal 的基本概念，它涉及 Angular 代码的服务器渲染。\n\n# 第 7\
  \ 章\n## FLUX, REDUX, GRAPHQL, APOLLO 以及 RELAY\n\n本章对 JavaScript 技术 Flux、Redux、GraphQL、Apollo\
  \ 和 Relay 进行了广泛介绍。除了 Apollo（由 Meteor 维护）外，列表中的其他技术均由 Facebook 开发。尽管这些技术用于 ReactJS\
  \ 编写应用程序，但它们也适用于 Angular 应用程序。\n\n由于不需要本章的材料也可以创建 Angular 应用程序，主要目的是解释上述技术中的某些概念。此外，本章中只有一个完整的代码示例（参见讨论\
  \ Apollo 的章节）。\n\n\n\n第三部分描述了 GraphQL，它是一个接收 Relay 请求的 JavaScript 工具包。GraphQL 通过从数据存储中检索匹配的数据来处理这些请求，该数据存储可以是关系型数据存储或\
  \ NoSQL 数据存储。本节包含一个使用 GraphQL 的基础 Angular 应用程序。\n\n第四部分讨论了 Apollo，它是一个向服务器端 GraphQL\
  \ 工具包发送数据请求的客户端 JavaScript。Apollo 最近因其相对于 Relay 的优势而赢得了广泛关注。\n\n需要记住的一点是，中大型 Web\
  \ 应用从 `Redux` 或 `GraphQL` 等工具包中获益远大于小型 Web 应用（小型应用 `MobX` 可能更合适）。因此，如果你目前正在开发基础\
  \ Web 应用，本章的部分内容对你现在来说可能是可选的。\n\n## 什么是 Flux？\n\nFlux 模式基于其他设计模式（例如观察者模式和命令查询职责分离\
  \ [CQRS]）。Flux 为开发复杂的应用程序提供了良好的基础。Flux 的主要目的是支持单向数据流。观看此视频以获取 Flux 技巧：\n\n[`angular-university.io/course/angular2-ngrx`](https://angular-university.io/course/angular2-ngrx)\n\
  \n![Image](img/pg188.jpg)\n\n***图 7.1*** Flux 模式的元素。\n\nFlux 模式的组件是 `Action`、`Dispatcher`\
  \ 和 `Store`。这些组件之间的关系所示：\n\nAction --> Dispatcher --> Store --> View（并返回 Action）\n\
  \n图 7.1 显示了 Flux 架构（复制自 GitHub 仓库 [`github.com/lgvalle/android-flux-todo-app`](https://github.com/lgvalle/android-flux-todo-app)）。\n\
  \n以下是对 Flux 模式的段落描述：当用户在 Web 应用程序中执行手势（例如点击按钮）时，该手势会被转换为一个 `Action`，该动作通过 (1) 描述动作类型的\
  \ `type` 和 (2) 包含新值的 `value` 来“模型化”状态变化。`Action` 被发送到 `Dispatcher`，`Dispatcher`\
  \ 继将 `Action` 和当前的 `Store` 发送给相应的 reducer 函数以处理该 `Action`。reducer 函数包含一个 `switch`\
  \ 语句和条件逻辑，以确定哪种 case 语句匹配 `Action` 类型，之后执行匹配的 case 语句中的代码，然后从 reducer 函数返回更新后的 `Store`（有时\
  \ `Store` 不会改变）。接下来，注册用于检测状态相关变化的 `View` 对象将相应地更新 Web 页面的内容。这个过程在用户每次在 Web 应用程序中执行手势时都会重复一次。更通用的场景涉及多个\
  \ reducer 和多个 store，这意味着 `Dispatcher` 中需要额外的逻辑。此外，`Action` 也可以源于服务器而不仅仅是用户触发的事件。\n\
  \n> 注意：*基于 Flux 的 Web 应用程序中的应用程序组件之间不直接通信。*\n\n请注意，上述数据流始终是单向的。此外，数据只能在 reducer\
  \ 中的某一个 case 语句中更新，这反过来简化了调试过程。\n\n### 什么是 Action？\n\n`Action` 是一个包含 JSON 数据的 JavaScript\
  \ 对象，带有一个强制性的属性称为 `type`。`Action` 的目的是指定在应用程序状态中需要修改的部分，以创建一个新状态。将 `Action` 想象成一个包含更新应用程序状态的信息或指令的“消息”（例如添加新用户、删除用户等）。一个关键点：不是修改当前状态，而是通过对当前状态“应用”动作来结果创建一个新对象。\n\
  \n简而言之，一个应用程序涉及许多 `Actions`（作为异步操作执行）：一个 `Dispatcher`、一个或多个 `Stores` 以及一个或多个 `View`\
  \ 组件。`Actions` 通常包含与 `View` 组件中发生的用户触发事件（如用户输入、击键、鼠标相关事件等）相关的数据。\n\n虽然 `Action`\
  \ 可以是字符串或数组，但 `Action` 往往是一个基于 JSON 的对象字面量。例如，一个涉及新用户的 `ADD` 操作的 `Action` 看起来如下：\n\
  \n```javascript\n{ type: 'ADD_USER', value: 'John Smith' }\n```\n\n上述 `Action` 会（通过\
  \ dispatcher）转发到一个 reducer 函数，该函数将新用户添加到外部数据存储中。你将在本章稍后部分看到此用例的更多细节。\n\n另一个需要记住的点是\
  \ `Action` 的属性可以有不同的名称。例如，以下 `Action` 等同于之前的代码段：\n\n```javascript\n{ kind: 'ADD_USER',\
  \ data: 'John Smith' }\n```\n\n注意，你有时会看到一个 JavaScript “辅助”函数（称为“Action Creator”），它返回一个\
  \ `Action`，其示例所示：\n\n![Image](img/pg190.jpg)\n\n### 什么是 Reducer？\n\n`Reducer` 是一个没有副作用的\
  \ JavaScript 函数（也称为“纯函数”），其目的是根据 `Action` 标识的内容将应用程序的当前状态转换为新状态。通常，每个动作类型关联一个函数。`Reducers`\
  \ 是改变应用程序状态的 JavaScript 函数。\n\nJavaScript `Array` 对象有一个 `reduce()` 方法，其示例所示：\n\n\
  ```javascript\nfunction sum(a,b) { return a + b }\n[1,2,3,4].reduce(sum,0);\n```\n\
  \n`Redux` 如下方式利用 JavaScript `reduce()` 方法的概念：`reducer()` 方法具有 `state` 参数和 `action`\
  \ 参数，并带有返回新状态的逻辑。\n\n## Store 和应用程序状态\n\n`Store` 是一个持有全局状态树（一个 JavaScript 对象）并分发动作的容器。store\
  \ 还持有 reducers 并对状态更改提供订阅。\n\n记住基于 Flux 的 Web 应用在外部维护应用程序状态，并且当应用程序状态变化时，组件之间并不通信；相反，它们从\
  \ `Store` 的内容中获取状态。因为多个组件之间的交叉通信会引入难以发现的错误，Flux 架构消除了这种错误源。\n\n由于减少函数是更新 `Store`\
  \ 的唯一地方，当发生数据错误时你知道在哪里查找。\n\n### 什么是 Redux？\n\n`Redux` 是 Dan Abramov 创建的开源工具包，实现了\
  \ Flux 模式（后者由 Facebook 创建）；其主页位于：\n\n[`github.com/reactjs/react-redux`](https://github.com/reactjs/react-redux)\n\
  \n`Redux` 由 `Actions`（消息）、`Reducers`（改变状态）和 `Store`（持有应用程序全局状态）组成，这些组件共同实现了 Flux\
  \ 模式。\n\n说明 Redux 作用的一个简单用例是显示名称列表并允许用户添加新名称的 Web 应用程序。数据流涉及创建动作（添加用户）、将其分发到执行实际添加新用户的方法，然后用新状态更新\
  \ store，最后更新 Web 页面以显示更新后的名称列表。\n\n带有热重载、动作重放和自定义用户界面 (UI) 的 Redux DevTools 可在此下载：\n\
  \n[`github.com/gaearon/redux-devtools`](https://github.com/gaearon/redux-devtools)\n\
  \n**应用程序数据的数据结构**\n\n\n\n\n除了将应用状态存储在 store（仓库）中，还需要考虑使用什么种数据结构来处理应用数据。适用于服务器端代码或视图组件的数据结构，并不一定最适用于\
  \ store 中的数据结构。换句话说，你不能简单地为 store 中的数据模仿相同的数据结构（尽管这可能非常具有吸引力），并期望应用程序具有高性能。有一篇讨论这一点的文章位于这里：\n\
  \n[`hackernoon.com/avoiding-accidental-complexity-when-structuring-your-app-state-6e6d22ad5e2a#.jzmngm3cf`](https://hackernoon.com/avoiding-accidental-complexity-when-structuring-your-app-state-6e6d22ad5e2a#.jzmngm3cf)\n\
  \n## 什么时候应该使用 Redux？\n\n虽然这个问题的答案各不相同，但 Dan Abramov 本人说，人们往往过早开始使用 Redux。也许使用 Redux\
  \ 的正确时机是应用的复杂度达到了需要使用 Redux 的程度。然而，这引发了一个新问题：什么是合适的复杂度？\n\n幸运的是，你可以遵循一些指南来做出是否使用\
  \ Redux 的判断。下面的链接也涉及 Redux 的使用：\n\n[`jamesknelson.com/5-types-react-application-state/`](http://jamesknelson.com/5-types-react-application-state/)\n\
  \n这篇文章绝对值得花时间阅读关于上述编号列表的细节。\n\n还有一些额外的考虑因素。例如，当你对组件进行热加载（hot reload）时，状态将从现有的组件树中移除。因此，如果应用状态是在外部维护的，那么状态就可以随着更新后的组件一起加载，从而保持状态的一致性。其他优点包括更好的测试支持、集中化的逻辑、时间旅行调试（time\
  \ travel debugging）以及可预测的状态更新。\n\n顺便提一下，除了 Redux，还有很多 Flux 的实现，所以你有选择（到目前为止，Redux\
  \ 是最流行的）。另一个替代方案是 Mobx，它将在章的后部分讨论。\n\n### Reducer 的简单示例\n\n正如你在本节中看到的，reducers 中的自定义代码通常包含一个带有多个\
  \ `case` 语句的 `switch` 语句（以及一个 `default` 情况）。下面的代码块是一个通用的 reducer 示例，它接收一个 `state`\
  \ 参数（初始化为空对象），后紧接一个 `action` 参数：\n\n![Image](img/pg193a.jpg)\n\n`case` 语句的细节显然取决于具体的应用程序。接下来的子节说明了状态为数字计数器的\
  \ reducers，以及一个状态为字符串数组的示例。请注意，某些代码示例使用了 JavaScript 中的“展开”（spread）运算符。\n\n### 用于增加/减少数字数值的\
  \ Reducer\n\n在 HTML Web 页面中，JavaScript 变量可以跟踪一个数字计数器。现在让我们来学习如何使用 reducer 函数来跟踪这样的计数器。计数器的“状态”简单就是它的当前值，该值将与\
  \ Web 页面中的 JavaScript 代码分开“存储”。\n\n假设我们有一个包含两个按钮的 Web 页面：一个按钮从计数器减 1，另一个按钮给计数器加\
  \ 1（计数器的初始值为 0）。\n\n`ACTION` 元素 `{type:'ADD'}` 和 `{type:'SUBTRACT'}` 分别对应加按钮和减法按钮。\n\
  \n该 Web 页面的 reducer 由一个 `switch` 语句组成，其中包含三个 `case` 语句分别处理 ADD、SUBTRACT 和默认操作，如下：\n\
  \n![Image](img/pg193b.jpg)\n\n![Image](img/pg194a.jpg)\n\n**注意**\n\nReducers 同步处理状态更改。\n\
  \n前一个示例的泛化版本涉及一个包含 `amt` 字段的 `ACTION` 元素，其数值值是要从计数器增加或减少的金额。在这种情况下，一个典型的 `ACTION`\
  \ 是 `{type:'ADD', amt:3}` 或 `{pe:'SUBTRACT', amt:5}`，其中 `amt` 的值在其他地方填充。此外，修改后的\
  \ `CountReducer` 代码块在这里：\n\n![Image](img/pg194b.jpg)\n\n实际应用中的 reducer 与之前的 `CountReducer`\
  \ 类似：区别在于具体的 `case` 语句以及在每个 `case` 语句中执行的代码。\n\n### 用于从数组添加/删除字符串的 Reducer\n\n下面的代码块定义了一个可以从数组添加项（`ADD_ITEM`）和删除项（`DEL_ITEM`）的\
  \ reducer：\n\n![Image](img/pg194c.jpg)\n\n在之前的代码块中，通过创建一个包含当前状态的新数组来添加新项，并将该项附加到数组中。注意展开运算符\
  \ `...` 如何提供了一种紧凑的方式来列出当前状态中的项。\n\n通过 `filter()` 方法中的条件逻辑删除现有项：当前状态中除了问题涉及的项外，所有内容都会被返回。\n\
  \n### Redux Reducers 是同步的\n\n请记住关于 Redux reducers 的以下几点。首先，上一节中的 `arrReducer()`\
  \ 方法是一个纯函数，因为函数中没有发生变异；不需要外部变量，并且创建了新状态而不是使用数组的 `push()` 方法（这是一个变异器）。\n\n其次，reducers\
  \ 是同步的；然而，如果你需要一个执行异步计算的 reducer，可以使用 `redux-observable`。第三，`reducer()` 中的数据逻辑与视图层是分离的。第四，应用程序中可以定义多个\
  \ reducer。\n\nRxFlux 是基于 RxJS 的 Flux 实现，其主页为：\n\n[`github.com/fdecredon/rx-flux`](https://github.com/fdecredon/rx-flux)\n\
  \n关于 Redux 的非常好的介绍是 Dan Abramov 创建的这个视频系列：\n\n[`egghead.io/series/getting-started-with-redux`](https://egghead.io/series/getting-started-with-redux)\n\
  \n### Redux Store\n\nRedux Store 维护应用的状态，该状态表示为全局状态树。Store 提供了两个函数：`getState()`\
  \ 和 `dispatch()`。\n\n`getState()` 函数允许应用的不同部分访问与状态的信息。\n\n关于 Store 还有两点需要记住：第一，store\
  \ 持有 reducers 并在每次分发（dispatch）动作时以“广播”方式调用它们。第二，store 提供了一套订阅机制，以便在状态树被修改时通知应用程序的部分（如\
  \ UI）。\n\n下面的代码块向你展示如何创建一个 store：\n\n```javascript\nimport { createStore } from\
  \ 'redux'\n\nimport RootReducer from '../Reducers/'\n\nconst store = createStore(RootReducer)\n\
  ```\n\n### 中间件\n\nRedux Store 还可以通过中间件形式的插件进行扩展。可以使用各种第三方中间件执行各种任务，例如持久化、日志和流程控制。\n\
  \n总结一下，Redux 的工作如下：\n\n![Image](img/greybox.jpg)应用状态封装在一个名为“state”的 JavaScript 对象中。\n\
  \n![Image](img/greybox.jpg)状态存储在 store 中。\n\n![Image](img/greybox.jpg)store 是不可变的，不会直接更改。\n\
  \n![Image](img/greybox.jpg)用户交互触发描述事件并封装数据的动作（actions）。\n\n名为 reducer 的函数将旧状态和动作结合创建状态的新版本，新版本保存在\
  \ store 中。\n\n\n\n\n有一个关于 `ngrxx-store`（在本书印刷时指的）的免费 10 分钟视频，可以在此处找到：\n\n[`egghead.io/lessons/angular-2-ngrx-store-in-10-minutes`](https://egghead.io/lessons/angular-2-ngrx-store-in-10-minutes)\n\
  \n关于 Angular 应用和 Redux 的章节到此此结束。如果你认为 Redux 对你的需求来说太复杂，Redux 的一种替代方案是 MobX，它比使用\
  \ Redux 更简单。MobX 被认为是流行的（且更简单的）Redux 替代方案之一，其主页在这里：\n\n[`github.com/mobxjs/mobx`](https://github.com/mobxjs/mobx)\n\
  \n## 什么是 GraphQL？\n\nGraphQL 是由 Facebook 开发的一种数据查询语言和运行时，可以将数据发送到移动和 Web 应用程序；其主页在这里：\n\
  \n[`graphql.org/`](http://graphql.org/)\n\nGraphQL 是一个规范，这意味着它可以用于任何平台和任何语言。Facebook\
  \ 维护着用 JavaScript 编写的参考实现。GraphQL 规范位于此处：\n\n[`facebook.github.io/graphql/`](http://facebook.github.io/graphql/)\n\
  \nGraphQL 模式（schema）作为数据存储的“包装器”，可以包含 NoSQL 数据和关系型数据。例如，下面的链接解释了如何结合 Mongo 使用 GraphQL：\n\
  \n[`www.compose.io/articles/using-graphql-with-mongodb/`](https://www.compose.io/articles/using-graphql-with-mongodb/)\n\
  \nFacebook 的 StarWars 模式在这里：[`goo.gl/oCrK7F`](https://goo.gl/oCrK7F)\n\n以下是 GraphQL\
  \ 的几个方面：\n\n![Image](img/greybox.jpg)查询语言\n\n![Image](img/greybox.jpg)查询语义\n\n![Image](img/greybox.jpg)查询变量\n\
  \n![Image](img/greybox.jpg)变异 (Mutations)\n\n![Image](img/greybox.jpg)片段 (Fragments)\n\
  \nGraphQL 查询语言是 GraphQL 的主要部分，你将在后续章节中看到示例。GraphQL 查询变量允许你向 GraphQL 查询传递值，这显然比使用硬编码的值要好。变异允许你更改\
  \ GraphQL 后层的数据集。变异与 GraphQL 查询中的字段非常相似，但 GraphQL 假设变异具有副作用并会更改模式之后的数据集。GraphQL\
  \ 片段提供了一种对常用字段进行分组并复用的机制。实现 GraphQL 的一些编程语言位于此处：\n\n[`graphql.org/code/`](http://graphql.org/code/)\n\
  \n使用 GraphQL 的公司包括 Coursera、Intuit、Pinterest 和 Shopify。此外，GitHub 支持 GraphQL（从 2016\
  \ 年开始），并发布了其公共 GraphQL API：\n\n[`githubengineering.com/the-github-graphql-api/`](http://githubengineering.com/the-github-graphql-api/)\n\
  \n## GraphQL 对比 REST\n\n正如你将在后续章节中看到的，GraphQL 允许你指定细粒度的查询，仅返回客户端应用程序所需的数据。请记住关于涉及\
  \ GraphQL 应用的以下一点：数据获取细节在客户端完成，而在使用表述状态转移（REST）的应用程序中，数据获取细节是在服务器完成的。\n\n这种方法有几个优势：\n\
  \n![Image](img/greybox.jpg)不向客户端发送冗余数据。\n\n![Image](img/greybox.jpg)在服务器上添加新数据字段不会影响查询。\n\
  \n![Image](img/greybox.jpg)只需要一次网络往返。\n\n上述 GraphQL 的优势对于移动应用程序尤为重要，因为移动应用中获取数据的成本可能非常高。此外，GraphQL\
  \ 查询不受客户对象（在服务器上）添加新字段的影响。\n\n另一方面，基于 REST 的请求粒度较粗，并且涉及“过度获取”（overfetching）：此类请求会返回客户对象中\
  \ 100% 的字段，其中没有区分区分的字段和不需要的字段。此外，在客户对象上添加新字段会增加返回给客户端的有效负载大小。\n\n### GraphQL 查询\n\
  \nGraphQL 查询是一个由服务器解释的字符串，它以指定的格式返回数据。这里有一个非常简单的 GraphQL 查询示例：\n\n![Image](img/pg198a.jpg)\n\
  \n上述查询可以读作“给给我 `emp` 实体的 `fname` 属性。”如你所见，`emp` 实体后面紧跟一对大括号，其中包含一个名为 `fname` 的单个属性。\n\
  \n下一个查询要复杂得多，但遵循与上一个查询相同的机制：\n\n![Image](img/pg198b.jpg)\n\n![Image](img/pg199a.jpg)\n\
  \n上述查询请求 `id` 为 `30000` 的 `user` 的属性 `id`、`name` 和 `isViewerFriend`。此外，查询还请求了该用户\
  \ `profilePicture`（尺寸为 50 × 50 像素）的属性 `uri`、`width` 和 `height`。\n\n上述查询的响应所示：\n\n\
  ![Image](img/pg199b.jpg)\n\nGraphQL 查询非常复杂，有时返回的数据包含重复的数据“子树”。开源项目 Apollo（在本章稍后讨论）会从服务器返回的数据中删除重复子树。\n\
  \n### 在 GraphQL 中定义类型系统\n\n本节包含一个类型系统的示例，它模拟了 `employees.json` 中基于 JavaScript 对象表示（JSON）的数据。\n\
