  \nAngular 支持 `@Input` 和 `@Output` 注解来在组件之间传递值。`@Input` 注解用于接收父组件传递值的变量，而 `@Output`\
  \ 注解则在给定变量的值被修改时，将数据从组件发送（或“发射”）到其父组件。\n\n此代码示例的输出结果平淡无奇。然而，此代码示例的目的是引起你对一些不符合直觉的代码片段的关注（特别是\
  \ `app.module.ts` 中的）。此外，此代码示例在 2.1.5 版本的 TypeScript 编译器中可以正常工作，但未来的版本可能需要对代码进行修改（请记住这一点）。\n\
  \n![Image](img/disc.jpg)\n\n现在，从随附光盘中将 `ParentChildEmitters` 目录复制到方便的位置。列表 2.27\
  \ 显示了 `app.component.ts` 的内容，向你展示了如何从父组件更新子组件属性的值。\n\n### 列表 2.27：app.component.ts\n\
  \n![Image](img/pg54.jpg)\n\n列表 2.27 中的 `template` 属性有一个顶层 `<div>` 元素，其中包含一个 `<child-comp>`\
  \ 元素，该元素有两个属性，如下所示：\n\n```html\n<child-comp [childValue]=\"parentValue\" (childValueChange)=\"\
  reportValueChange($event)\">\n</child-comp>\n```\n\n`[childValue]` 属性将 `parentValue`\
  \ 的值赋值给 `childValue`。注意，变量 `parentValue` 定义在 `AppComponent` 中，而变量 `childValue` 定义在\
  \ `ChildComponent` 中。*这就是如何将值从父组件传递到子组件*。\n\n接下来，`childValueChange` 属性被赋值为从 `ChildComponent`\
  \ 返回的值给当前（“父”）组件。请记住，只有当 `childValue`（在子组件中）的值被修改时，属性 `childValueChange` 才会更新。*这就是如何将值从子组件传递到父组件*。\n\
  \n请记住以下一点：子组件*必须*定义一个类型为 `EventEmitter` 的变量（例如 `childValueChange`），以便从子组件“发射”修改后的值到父组件。\n\
  \n列表 2.27 的下一部分是一个简单的构造函数，随后是包含 `console.log()` 语句的方法 `reportValueChange`。\n\n列表\
