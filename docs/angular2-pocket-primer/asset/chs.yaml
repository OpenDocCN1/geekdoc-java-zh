  \ `node_modules` 目录（大多数示例应用程序都是如此的）。\n\n现在让我们学习如何在 Angular 中进行一些基本的调试。\n\n### 在控制台中调试\
  \ Angular 代码\n\n本节向你展示如何使用 `ng.probe()` 来“单步执行” Angular 应用程序执行，并找到（或更新）变量的值。本节中的信息将帮助你检测应用程序中的简单错误。如果你感兴趣，更强大的调试器是\
  \ Augury（一个 Chrome 扩展），它将在 第 10 章 中讨论。\n\n现在在 Chrome 中启动 第 1 章 中的 Angular 应用程序（列表\
  \ 1.8），执行以下步骤：\n\n1) 打开 Chrome 开发者工具。\n2) 点击“元素（Elements）”选项卡。\n3) 点击 `<app-root>`\
  \ 元素。\n\n现在点击“控制台（Console）”选项卡并输入以下代码：\n\n```javascript\nng.probe($0)\n```\n\n你会看到一个如下的\
  \ `DebugElement`：\n\n```javascript\nDebugElement {nativeNode: app-root, parent:\
  \ null, listeners: [0], providerTokens: [1], properties: Map}\n```\n\n展开上述对象并浏览其元素。点击屏幕顶部的按钮几次，然后使用以下代码获取类实例引用：\n\
  \n```javascript\nng.probe($0).componentInstance\n```\n\n上述片段显示了以下元素：\n\n```javascript\n\
  UserInput {clickCount: 3}\n```\n\n使用以下代码片段修改 `clickCount` 的值：\n\n```javascript\n\
  ng.probe($0).componentInstance.clickCount = 7\n```\n\n上述代码片段将 `clickCount` 的值改为\
  \ 7，诚然在此代码示例中没有实际用途。然而，在包含各种输入字段和控件的其他 Angular 应用程序中，此功能可能对测试非常有用。\n\n以下代码片段提供了组件相关信息：\n\
  \n```javascript\nng.probe($0).injector._depProvider.componentView\n```\n\n上述片段显示了如下：\n\
  \n```javascript\nAppView {proto: AppProtoView, renderer: DebugDomRenderer, viewManager:\
  \ AppViewManager_, projectableNodes: null, containerAppElement: AppElement}\n```\n\
  \n```javascript\nng.probe($0).injector._depProvider.componentView.changeDetector\n\
  ```\n\n下一个代码片段提供了额外信息：\n\n```javascript\nChangeDetector_UserInput_0 {id: \"UserInput_0\"\
  \", numberOfPropertyProtoRecords: 2, bindingTargets: [1], directiveIndices: [0],\
  \ strategy: 5}\n```\n\n通过展开并检查其内容来实验可用元素。此外，以下链接包含了关于 Chrome 开发工具的有用信息：\n\n[`developers.google.com/web/tools/chrome-devtools/javascript`](https://developers.google.com/web/tools/chrome-devtools/javascript)\n\
