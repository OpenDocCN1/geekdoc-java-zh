  \n## 总结\n\n本章向展示了多种使用 Angular 作为 UI 层创建移动应用程序的方法。首先你学习了 Angular Mobile Toolkit，它允许使用\
  \ Angular 创建移动应用程序。你还学习了如何使用 Ionic 2 工具包创建跨平台混合应用。然后你看到了如何将 Ionic 2 与 NativeScript\
  \ 结合创建原生应用。\n\n你还了解了 React Native，它可以使用 ReactJS 或 Angular 作为 UI 层创建跨平台原生移动应用程序。\n\
  \n# 第 9 章：函数响应式编程\n\n本章讨论了函数响应式编程（FRP），重点是基础的 RxJS 代码示例，这些示例可以帮助你开发简单的 Web 应用（即使不使用\
  \ Angular）。本章的第一部分包含了 FRP 的层级介绍，以及一些流行的 JavaScript FRP 工具包列表。\n\n本章的第二部分讨论了 RxJS\
  \ 中的中间操作符和终端操作符，包括说明如何通过方法链调用多个操作符的代码示例。该节还讨论了冷观察者（cold Observable）和热观察者（hot Observable）的区别，以及你无法将前者转换为后者。\n\
  \n\n\n本章的第三部分包含了使用 `RxJS` 结合可缩矢量图形 (`SVG`) 生成图形和动画效果的示例。你还将看到对 HTML 网页中的某些 HTML\
  \ 元素进行“响应化”的示例。\n\n本章的最后部分提供了关于 `RxJS` 版本 5 的要介绍，以及 `RxJS` 版本 5 与版本 4 之间的差异。\n\n\
  ## 什么是函数式响应编程 (FRP)？\n\n网上有关于 `FRP` 的各种定义。对于我们而言，`FRP` 基于观察者模式、迭代器模式和函数式编程的结合。主页位于：\n\
  \n[`reactivex.io/`](http://reactivex.io/)\n\n响应式编程引入于 1997 年，可以总结如下：\n\n![Image](img/greybox.jpg)它是对异步数据流的编程。\n\
  \n![Image](img/greybox.jpg)它是事件驱动的而非主动的。\n\n![Image](img/greybox.jpg)有多种工具包和库可用。\n\
  \n![Image](img/greybox.jpg)它支持 `JS`、`Java`、`Scala`、`Android` 和 `Swift` 等语言。\n\n\
  Conal Elliott 被认为是 `FRP` 的创建者，你可以在这里找到他对 `FRP` 非常具体的定义：\n\n[`stackoverflow.com/questions/1028250/what-is-functional-reactive-programming`](https://stackoverflow.com/questions/1028250/what-is-functional-reactive-programming)\n\
  \n`FRP` 的另一个定义涉及另外两个概念的结合：响应式编程（异步数据流）和函数式编程（纯函数、不可变性以及变量和状态的最少使用）。\n\n响应式编程支持许多操作符，在处理异步流时提供了强大的功能。响应式编程范式避免了其他环境中可能出现的“回调地狱”。此外，`Observables`\
  \ 比基于 `Promise` 的工具包和库具有更大的灵活性。\n\n`FRP` 部分基于函数式编程，函数式编程因为可以减少程序中的状态而变得流行，这有助于减少代码\
  \ Bug。然而，`FRP` 比函数式编程更具声明性，通常具有更高的抽象性，并涉及高阶函数。因此，响应式编程与函数式编程的结合让你能够编写更简洁且更强大的代码。\n\
  \n根据 Reactive 主页，`FRP` 在异步流中妥善处理错误，并避免了编写自定义代码来处理线程、同步和并发的必要。从另一个角度来看，`FRP` 是从集合（Collections）到流（Streams），最后到异步流（asynchronous\
  \ Streams）路径的“顶点”。\n\n可以在以下网站找到几个 `JavaScript` 的 `FRP` 工具包：\n\nRxJS: [`github.com/Reactive-Extensions/RxJS`](https://github.com/Reactive-Extensions/RxJS)\n\
  \nBacon.js: [`baconjs.github.io/`](https://baconjs.github.io/)\n\nKefir.js: [`rpominov.github.io/kefir/`](https://rpominov.github.io/kefir/)\n\
  \nmost.js: [`github.com/cujojs/most`](https://github.com/cujojs/most)\n\n上述工具包各有优秋，通常比\
  \ `RxJS` 更轻量。在完成本章后，你将更好地评估这些 `RxJS` 的替代方案，以及你是否想用它们代替 `RxJS`。\n\n现在让我们简单地看看作为 `FRP`\
  \ 基础的观察者模式。\n\n### 观察者模式\n\n观察者模式是一种在许多编程语言中实现的强大模式。简单来说，观察者模式涉及一个 `Observable`（即被观察或被“监视”的东西）和一个或多个\
  \ `Observer` 对象。`Observer`（也称为订阅者）“观察”另一个对象中数据的变化或事件的发生。在 `Java` 等语言中，`Observable`\
  \ 包含一组已注册到该 `Observable` 的 `Observer` 对象集合。当 `Observable` 中发生状态变化或事件时，`Observable`\
  \ 会通知已注册的 `Observer` 对象。\n\n定义 `Observables` 的细节将在本章稍后讨论，但核心思想涉及结合（“链式”）操作符（如 `map()`\
  \ 和 `filter()`），然后调用 `subscribe()` 方法来“让它发生”。\n\n### 处理异步事件\n\n`RxJS` 有时被描述为“异步事件的\
  \ LoDash”。各种类型的异步事件包括于：\n\n![Image](img/greybox.jpg)Ajax\n\n![Image](img/greybox.jpg)用户事件（包括鼠标相关事件）\n\
  \n![Image](img/greybox.jpg)动画\n\n![Image](img/greybox.jpg)Sockets 和服务器发送事件 (SSEs)\n\
  \n![Image](img/greybox.jpg)Workers\n\n通过对比，下面的代码片段说明了处理异步事件的 ECMA5 ：\n\n```javascript\n\
  getDataFromSomewhere(function(result) {\n  console.log(\"result = \"+result)\n});\n\
  ```\n\n上述代码片段的等效 ES6 版本所示：\n\n```javascript\ngetDataFromSomewhere((result) => {\n\
  \  console.log(\"result = \"+result)\n});\n```\n\n## Promises 和异步事件\n\n`Promises`\
  \ 非常适合异步操作（如基于 Ajax 的请求），前提是预期的行为有一个值随后完成。以下列表描述了 `Promises` 的某些属性：\n\n![Image](img/greybox.jpg)可的未来（并非所有应用都需要的）\n\
  \n![Image](img/greybox.jpg)不可变\n\n![Image](img/greybox.jpg)单个值（并非所有应用都需要的）\n\n![Image](img/greybox.jpg)缓存\n\
  \n![Image](img/greybox.jpg)立即调用\n\n![Image](img/greybox.jpg)不可取消\n\n![Image](img/greybox.jpg)不可复用\n\
  \n因此，`Promises` 适用于未来是可能的且返回单个值的情况。下面是使用 `Promise` 的简单示例：\n\n![Image](img/pg240.jpg)\n\
  \n![Image](img/pg241a.jpg)\n\n如果你之前不知道，`Observables` 的某些操作符在 ES5 中也可用。在深入 FRP 代码示例之前，让我们在下一节看看如何使用这些方法。\n\
  \n### 不使用 FRP 使用操作符\n\n下面的代码块展示了如何链用 `filter()` 和 `map()` 方法处理一组整数：\n\n![Image](img/pg241b.jpg)\n\
  \n注意 `result1` 和 `result2` 的输出是相同的。如果可能，在 `map()` 方法之前指定 `filter()` 方法以预先减少数据（但请看下文注意事项）。在前面的示例中，性能差异可能是不可检测的，但如果你将源改为前百万个整数，你可能会看到性能差异。\n\
  \n正如前面提到的，关于操作顺序有一个重要的注意事项：`filter()` 方法和 `map()` 方法在顺序相反时有时产生不同的结果。例如，下面的代码块是前面代码块的修改版本（修改部分已**加粗**），它说明了这一点：\n\
  \n![Image](img/pg241c.jpg)\n\n![Image](img/pg242a.jpg)\n\n变量 `result3` 的值为 `[0,4,8,12,16,20]`，而变量\
  \ `result4` 的值为 `[0,8,16]`。\n\n### 关于 Observables 的比喻\n\n如果你是 `Observables` 的新手，或者发现处理\
  \ `Observables` 的代码示例感到困难，本节提供了 Venkat Subramanian 的一个幽默比喻，对 `Observables` 世界有了的见解。\n\
  \n首先，`Observables` 涉及一些核心概念：链用中间操作符（如 `map()`、`filter()` 等），然后（可能稍后）调用终端操作符（如 `subscribe()`\
  \ 或 `forEach()`）以“让事情发生”。。\n\n![Image](img/pg242b.jpg)\n\n\n\n\n**问题**：`result1`\
  \ 和 `result2` 的区别是什么？\n\n**答案**：只有 `result2` 包含了终端操作符 `subscribe()`。\n\n**结果**：第一个\
  \ `console.log()` 什么都没有显示，第二个显示了数字 0 和 12。\n\n现在，让我们来看一段 Venkat Subramanian 提供的有趣（且富有意义）的类比，他通过讲述自己妻子和两个青少年儿子的故事来解释\
  \ Observables，他们当时都在客厅看电视：\n\n母亲：“该关电视了。”\n\n儿子们：[没有反应。]\n\n母亲：“该去倒垃圾了。”\n\n儿子们：[没有人动。]\n\
  \n母亲：“你们需要开始做作业了。”\n\n儿子们：[仍然没有反应。]\n\n过了一段时间……\n\n母亲：“我去叫你们爸爸。”\n\n儿子们：[立即行动……]\n\
  \n希望你意识到，母亲的前三个请求类似于中间操作符，而她的最后一个表述类比于终端操作符，它启动了前三个请求的执行。\n\n如果这个类比让你对 Observables、中间操作符和终端操作符产生了“灵光一现”，那么好消息是，本章中的许多代码示例对你来说将更容易理解。\n\
  \n# RxJS 的 JavaScript 文件\n\nRxJS 的 JavaScript 文件可以通过内容分发网络（CDN）获取，由大约 10 个不同的文件组成。这里显示了你在\
  \ HTML 页面中需要的“核心”JavaScript 文件：\n\n```html\n<script src=\"http://cdnjs.cloudflare.com/ajax/libs/rxjs/4.1.0/rx.js\"\
  ></script>\n<script src=\"http://cdnjs.cloudflare.com/ajax/libs/rxjs/4.1.0/rx.async.js\"\
  ></script>\n<script src=\"http://cdnjs.cloudflare.com/ajax/libs/rxjs/4.1.0/rx.binding.js\"\
  ></script>\n```\n\n在本书出版时，版本号可能会不同。此外，请记住 RxJS v5 目前处于 beta 阶段。额外的 RxJS 文件可以在此处获取（第一个用于动画效果的）：\n\
  \n```html\n<script src=\"http://cdnjs.cloudflare.com/ajax/libs/rxjs/4.1.0/rx.time.js\"\
  ></script>\n<script src=\"http://cdnjs.cloudflare.com/ajax/libs/rxjs/4.1.0/rx.coincidence.js\"\
  ></script>\n<script src=\"http://cdnjs.cloudflare.com/ajax/libs/rxjs-dom/2.0.7/rx.dom.js\"\
  ></script>\n```\n\n在讨论了所有准备细节后，让我们在下一节深入探讨各种中间操作符和终端操作符。\n\n### 中间和终端操作符\n\n将 Observables\
  \ 视为数据流或数据集，它们可以包含任意数量的项目（任意时间）。Observables 在被“订阅”时产生值，并且可以被取消和重启（这是 Promises 无法做到的）。Observables\
  \ 帮助你避免在未使用 Observables 或 Promises 的异步代码中可能出现的“回调地狱”。\n\n### 操作符\n\n操作符是 Observables\
  \ 中的方法。操作符可以是中间的或终端的（稍后后会讨论），它们允许你组合新的 Observables。常见的操作符包括 `filter()`、`map()`、`reduce`\
  \ 和 `merge()`。\n\n如果你需要在 RxJS 中创建自定义操作符，可以使用以下语法：\n\n```javascript\nRx.Observable.prototype.myCustomOperator\
  \ = //在此处定义内容\n```\n\n你可以使用以下通用语法对操作符进行方法链调用：\n\n![Image](img/pg244.jpg)\n\n**结果**：`obs`\
  \ 是一个与源“连接”的 Observable。\n\n### subscribe() 和 unsubscribe() 操作符\n\n必须调用 `subscribe()`\
  \ 方法来生成数据。为了直观地说明，请考虑以下代码块：\n\n![Image](img/pg245.jpg)\n\n第一个 Observable 没有产生输出，因为没有\
  \ `subscribe()` 方法，而第二个 Observable 显示了 0 到 3 之间的整数（包含边界）。\n\n另一方面，`unsubscribe()`\
  \ 将“拆除”一个生产者，这意味着生产者将停止产生数据。下面的代码块向展示了如何调用 `unsubscribe()` 方法：\n\n```javascript\n\
  let x = Rx.Observable.(..)\nlet result = x.subscribe(...)\n//在此处执行某些操作...\nresult.unsubscribe();\n\
  ```\n\n调用 `unsubscribe()` 操作符后，你可以重启 Observable 并对该 Observable 进行“重新订阅”，这在 Promises\
  \ 中是不可能的。（曾向 TC39 委员会提交过添加取消 Promises 支持的提案，但后来被撤回了。）\n\n### subscribe() 和 forEach()\
  \ 操作符\n\nRxJS 4.0 遵循 ES6 规范（但不遵循 ES7 规范），在其中 `subscribe()` 和 `forEach()` 是相同的。然而，RxJS\
  \ 5.0 遵循 ES7 规范，在其中 `subscribe()` 和 `forEach()` 是不同的，正如后续段落所解释。\n\nRxJS 5.0 中 `subscribe()`\
  \ 方法的语法所示：\n\n```typescript\npublic subscribe(observerOrNext: Observer | Function,\
  \ error: Function, complete: Function): Subscription\n```\n\n`Observable.subscribe`\
  \ 返回一个 *subscription*（订阅）令牌，允许你取消订阅。当订阅事件的持续时间未知，或者你需要执行提前终止时，此功能非常有用。\n\nRxJS 5.0\
  \ 中 `forEach()` 方法的语法所示：\n\n```typescript\npublic forEach(next: Function, PromiseCtor?:\
  \ PromiseConstructor): Promise\n```\n\n`Observable.forEach` 返回一个 *promise*（承诺），它根据\
  \ Observable 是否完成来解析或拒绝。再次提醒，Promise 无法这样做。\n\n# 将数据源转换为 Observable\n\n你可以通过几种方法将其他数据源“转换”为\
  \ Observable：\n\n```javascript\nObservable.of(...)\nObservable.from(iterable)\n\
  Observable.fromEvent(...)\n```\n\n接下来的子节包含展示如何使用变量的代码示例。\n\n### 使用 range() 和 filter()\
  \ 操作符\n\n列表 9.1 显示了 `ObservableRange1.html` 的内容，展示了如何使用不同的样式定义 Observable。\n\n***列表\
  \ 9.1 ObservableRange1.html***\n\n![Image](img/pg246.jpg)\n\n![Image](img/pg247.jpg)\n\
  \n列表 9.1 包含了三个 Observable，第一个由于没有 `subscribe()` 方法产生输出。第二个 Observable 过滤 `range(0,20)`\
  \ 中小于 4 的整数，然后通过 `console.log()` 显示这些值。第三个 observable 遍历 `range(1,5)` 中的整数并通过一个方法显示其值。\n\
  \n运行列表 9.1 中的代码，你将看到以下输出：\n\n```\n#2 x = 0\n#2 x = 1\n#2 x = 2\n#2 x = 3\nonNext:\
  \ 1\nonNext: 2\nonNext: 3\nonNext: 4\nonNext: 5\nonCompleted\n```\n\n### 使用 from()\
  \ 和 map() 操作符\n\n下一节包含一个示例，向你展示如何链式使用 `from()` 和 `map()` 中间操作符。\n\n列表 9.2 显示了 `ObservableMap1.html`\
  \ 的内容，展示了如何使用 Observable 来“响应化”HTML 页面。\n\n***列表 9.2 ObservableMap1.html***\n\n\
  ![Image](img/pg248.jpg)\n\n列表 9.2 从字符串数组定义了一个 Observable。`map()` 方法将每个数组转换为大写形式，然后附加初始数组项。`subscribe()`\
  \ 方法只需显示 `map()` 方法内部创建每个字符串的值。在浏览器中运行列表 9.2 中的代码，你将看到以下输出：\n\n```\nA1a1\nA2a2\n\
  A3a3\n```\n\n### 使用 interval(), take(), 和 map() 操作符\n\n列表 9.3 显示了 `ObservableTake.html`\
  \ 的内容，展示了如何在 HTML 页面中“交错”两个 Observable 的输出。\n\n***列表 9.3 ObservableTake.html***\n\
  ```\n\n\n\n\n\n列表 9.3 定义了两个调用 `interval()`、`take()` 和 `map()` 算子的 Observable。第一个\
  \ Observable 每 1000 毫秒发射一次数据，而第二个 Observable 每 500 毫秒发射一次数据。第一个 Observable 调用了 `subscribe()`\
  \ 方法，该方法包含一个用于显示数据项的 `console.log()` 语句。第二个 Observable 也使用了不同的语法调用了 `subscribe()`\
  \ 方法：指定了三个函数，分别处理下一个值、错误和完成事件。\n\n运行列表 9.3 中的代码，你将看到以下输出：\n\n```\nsource2 onNext:\
  \ 1\nx = 1\nsource2 onNext: 2\nsource2 onNext: 3\nx = 2\nsource2 onNext: 4\nsource2\
  \ onCompleted\nx = 3\nx = 4\n```\n\n此时，你已经了解了如何组合一些中间算子。RxJS 支持许多其他算子，下一节将对其中一些算子进行高层级的快速介绍。\n\
  \n## 其他中间算子\n\n除了你在本章之前看到的 `filter()` 和 `map()` 算子外，Observable 还支持以下实用的算子，其中大多数都有直观的名称：\n\
  \n![Image](img/greybox.jpg)`reduce()`\n\n![Image](img/greybox.jpg)`first()`\n\n\
  ![Image](img/greybox.jpg)`last()`\n\n![Image](img/greybox.jpg)`skip()`\n\n![Image](img/greybox.jpg)`toArray()`\n\
  \n![Image](img/greybox.jpg)`isEmpty()`\n\n![Image](img/greybox.jpg)`retry()`\n\n\
  ![Image](img/greybox.jpg)`startWith()`\n\n即使你没有见过上述算子，你可能也可以推断出此 Observable 的结果：\n\
  \n![Image](img/pg250.jpg)\n\n### retry() 算子\n\n`retry()` 算子允许你多次尝试从外部网站访问数据。这里显示了该语法的两个示例：\n\
  \n```\nmyObservable.retry(3);\nmyObservable.retryWhen(errors => errors.delay(3000));\n\
  ```\n\n下一节提供了一些用于在 Observable 中合并和连接数据流的中间算子列表。\n\n## 合并/连接算子列表\n\n在第 4 章中，你学习了\
  \ `forkJoin()` 中间算子，它可以合并来自多个端点的 HTTP 请求返回的数据。以下列表包含了各种对数据流执行合并或连接操作的中间算子：\n\n![Image](img/greybox.jpg)`merge()`\n\
  \n![Image](img/greybox.jpg)`mergeMap()`\n\n![Image](img/greybox.jpg)`concat()`\n\
  \n![Image](img/greybox.jpg)`concatMap()`\n\n![Image](img/greybox.jpg)`switch()`\n\
  \n![Image](img/greybox.jpg)`switchMap()`\n\n![Image](img/greybox.jpg)`zip()`\n\n\
  ![Image](img/greybox.jpg)`forkJoin()`\n\n![Image](img/greybox.jpg)`withLatestFrom()`\n\
  \n![Image](img/greybox.jpg)`combineLatest()`\n\n其中一些算子的命名非常直观（例如用于拼接输出的 `concat()`），但它们之间存在一些微妙的。例如，`merge()`\
  \ 算子将多个 Observable 合并为一个 Observable，并可能出现数据值的交错。另一方面，`concat()` 则按顺序将多个 Observable\
  \ 合并为一个 Observable，而不会任何数据交错。\n\n阅读你感兴趣的中间算子的在线文档（如果你有时间，也可以学习所有的算子！）。\n\n## Map\
  \ 相关算子列表\n\n在第 4 章中，你看到了几个使用 `map()` 中间算子的示例，通常用于将输入流转换为基于 JavaScript 对象符号表示法（JSON）的数据。以下是\
  \ map 相关的算子列表：\n\n![Image](img/greybox.jpg)`map()`\n\n![Image](img/greybox.jpg)`flatMap()`\n\
  \n![Image](img/greybox.jpg)`flatMapLatest()`\n\n![Image](img/greybox.jpg)`mergeMap()`\n\
  \n![Image](img/greybox.jpg)`concatMap()`\n\n![Image](img/greybox.jpg)`switchMap()`\n\
  \n![Image](img/greybox.jpg)`flatten()`\n\n回想一下第 4 章中你如何使用 `map()` 算子将字符串转换为 JSON\
  \ 数据。一个更强大的算子是 `concatMap()`，它使用 `concat()` 来确保中间结果不交错，然后应用 `map()` 算子。\n\n正如你在上一节中学到的，中间结果可能会与\
  \ `merge()` 算子交错。由于 `flatMap()` 使用了 `merge()` 算子，中间结果也可以与 `flatMap()` 交错（但不会与 `concatMap()`\
  \ 算子交错）。\n\n阅读你感兴趣的中间算子的在线文档，特别是 `flatten()` 和 `flatMap()` 算子之间的区别。\n\n## timeout()\
  \ 算子\n\n`timeout()` 算子用于检测 Observable 在指定时间内没有产生值：\n\n```\nRx.Observable\n.fromEvent(document,\
  \ 'dragover')\n.throttle(350)\n.map(true)\n.timeout(1000, Rx.Observable.just(false))\n\
  .distinctUntilChanged();\n```\n\n记住，`timeout()` 会从源 Observable 取消订阅并订阅作为参数提供 `timeout()`\
  \ 的 Observable；因此，你必须重新订阅该 Observable 以接收后续结果。另一个需要记住的是，`map()` 操作被放在 `throttle()`\
  \ 算子之后，以避免不必要的映射操作。\n\n## 冷（Cold）与热（Hot）Observable\n\n冷 Observable 就像比观看录制的电影。尽管用户在不同的时间访问同一个\
  \ URL，他们都能看到整个电影。在冷 Observable 的情况下，为每个消费者创建一个新的生产者。\n\n相比之下，热 Observable 就像观看直播演示。用户在不同时间访问网站，看到的不是整个演示，而是从他们访问的时间点开始的部分。在热\
  \ Observable 的情况下，同一个生产者（流式演示）供所有消费者使用。\n\n注意：所有 Observable 默认都是冷的，而所有 Promise 默认都是热的。\n\
  \n将冷 Observable 转换为热 Observable 的一种方法是通过 `publish()` 算子，如下所示：\n\n*[`blog.thoughtram.io/angular/2016/06/16/cold-vs-hot-observables.html`](http://blog.thoughtram.io/angular/2016/06/16/cold-vs-hot-observables.html)*\n\
  \n## 响应式 HTML 页面\n\n包含访问外部数据的按钮页面。\n\n列表 9.5 展示了 Observable2.html 的内容，说明了如何使用 Observable\
  \ 响应式 HTML 页面。\n\n***列表 9.5 Observable2.html***\n\n![Image](img/pg254b.jpg)\n\n\
  ![Image](img/pg255.jpg)\n\n列表 9.5 包含两个 <div> 元素，随后是一个引用了这两个元素的 <script> 元素。该 <script>\
  \ 元素还定义 Observable，它发射前 10 个整数，数据项之间有 500 毫秒延迟。\n\nObservable 的下部分调用 `map()` 算子计算每个数据项的平方。`subscribe()`\
  \ 方法将新计算的数字附加到两个 <div> 元素的当前内容。\n\n运行列表 9.5 中的代码，在 Observable 完成后，你将在浏览器会话中看到以下输出：\n\
  \n```\nThis is a DIV element0149162536496481\nThis is a DIV element0149162536496481\n\
  ```\n\n\n\n列表 9.6 显示了网页 `SVGObservables1Anim1.html` 的内容，该页面演示了如何使用 `Observable`\
  \ 在 HTML 网页中生成并显示带有动画效果的 SVG `<ellipse>` 元素。\n\n### 列表 9.6 SVGObservables1Anim1.html\n\
  \n![Image](img/pg256.jpg)\n\n![Image](img/pg257.jpg)\n\n列表 9.6 包含一个初始化一组 JavaScript\
  \ 变量的 `<script>` 元素。列表 9.6 的部分获取 `id` 属性值为 `svg1` 的 `<div>` 元素的引用，随后是一个简单的循环，用于初始化\
  \ JavaScript 数组 `XPoints`。在初始化 `XPoints` 之后，有一段有趣的代码根据 `XPoints` 数组创建 `Observable`\
  \ 项，还有一个 `delay` 属性，它创建了动画效果（即在渲染相邻的 SVG `<ellipse>` 元素之间有 1 秒的延迟）。\n\n列表 9.6 的第三部分调用了\
