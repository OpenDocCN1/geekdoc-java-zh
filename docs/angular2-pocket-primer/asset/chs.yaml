  \ `<input>` 元素用于新用户的姓。\n\n在列表 5.3 中，`FormBuilder` 被注入到构造函数，这创建一个 `FormBuilder` 实例并赋值给构造函数中的\
  \ `fb` 变量。接下来，通过调用 `group()` 方法初始化 `myForm`，该方法接收一个键值对对象。在这种情况下，`fname` 和 `lname`\
  \ 是键，它们都作为 `<input>` 元素出现在模板属性中。这些键的值是可选的初始值。\n\n显然，你可以在 `group()` 方法内部添加许多其他属性（例如地址相关的字段）。此外，你可以为每个新实体添加不同的表单。例如，你可以为\
