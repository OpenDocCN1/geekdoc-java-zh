  \n请记住，上述链接中的 UI 组件是针对 Angular 2 的，因此最好在最新版本的 Angular 中测试它们。此外，第 5 章包含了在 Angular\
  \ 4 版本中有效的表单相关 UI 组件。\n\n## Angular 新功能\n\nAngular 的一些新功能包括支持 `ngIf` 指令中的 if/else\
  \ 逻辑以及 `NgComponentOutlet` 指令。\n\n\n\n\n\n`ngIf` 指令根据表达式的值有条件地包含一个模板。接下来，`ngIf`\
  \ 会评估表达式，并在 `expression` 分别为真（truthy）或假（falsy）时，相应地渲染 then 模板或 else 模板。通常情况下，then\
  \ 模板是 `ngIf` 的内联模板，除非绑定到不同的值；而 else 模板在未绑定的情况下将为空白。更多信息请参此处：\n\nhttps://angular.io/docs/ts/latest/api/common/index/NgIfdirective.html\n\
  \n`NgComponentOutlet` 指令是一个实验性指令，为创建动态组件提供了一种声明式方法，其示例所示：\n\n![Image](img/pg60.jpg)\n\
  \n正如你可能猜到的那样，`ng-container` 指令是用于“分组”节点的逻辑容器。在之前的代码块中，`ng-container` 指令拥有一个类型为 `Input`\
  \ 的 `NgComponentOutlet`，该值反过来引用了一个自定义组件。接下来，请确保如所示所示将动态组件添加到 `ngModule` 的 `entryComponents`\
  \ 部分：\n\n![Image](img/pg61.jpg)\n\n`NgComponentOutlet` 指令支持额外的选项，此处在此描述：\n\nhttps://angular.io/docs/ts/latest/api/common/index/NgComponentOutlet-directive.html\n\
  \n## 总结\n\n本章向你展示了如何在 Angular 应用中使用 UI 控制。你看到了如何渲染按钮、如何渲染名称列表，以及如何从这些列表中添加和删除名称。你还学习了条件逻辑以及如何创建子组件。\n\
  \n然后，你看到了如何处理与鼠标相关的事件，例如 `mousemove` 事件。接下来，你学习了父子组件之间的通信，随后是对演示型组件的讨论。你还学习了如何在\
  \ Angular 应用中指定不同类型的 CSS 封装。最后，你还简要地介绍了 Angular 中一些新的 UI 相关特性。\n\n# 第 3 章\n\n##\
  \ 图形与动画\n\n本章向你如何通过 HTML5 技术和各种开源工具包创建具有图形和动画效果的 Angular 应用。这个与图形相关的章节在书中较早介绍，是因为图形提供了一种学习技术的趣味性方式。即使你不计划在\
  \ Angular 应用中使用图形和动画，也值得快速浏览本章内容，以熟悉未来可能对你有用的视觉效果。\n\n正如你很快看到的，本章中的代码示例使用了与 Angular\
  \ 无关的技术，例如可缩矢量图形 (`SVG`)、数据驱动文档 (`D3`)、GreenSock 动画平台 (`GSAP`)、层叠样式表 3 (`CSS3`)\
  \ 以及 `jQuery`。事实上，一个示例使用“纯” `CSS3` 在 Angular 应用中创建动画效果，然后被适配到一个使用 Angular 动画属性创建动画效果的代码示例中。在阅读了该示例的代码后，你可以创建自己的变体，或许通过结合本章中其他代码示例的技术。\n\
  \n如果你是图形效果方面的新手，这可能是学习如何用 Angular 创建图形和动画效果的最快路径。因此，你受益于两点：首先，“符合 Angular 方式”的动画效果有相当数量的在线文档；其次，你不需要花费大量额外时间学习如何使用无关技术在\
  \ Angular 中创建动画效果。\n\n本章的第一节讨论了 Angular 生命周期，部分是因为本章中与 `GSAP` 相关的代码示例需要其中一个生命周期方法。\n\
  \n本章的第二节向你展示了如何在 `SVG` 以及 `D3` 中渲染图形并创建动画效果。虽然本节的示例非常简单，但它们提供了一个起点，以防你需要在 Angular\
  \ 应用中创建此类效果。\n\n第三节包含了基于 `D3` 的图形和动画效果示例。如果你还不知道，`D3` 是一个非常流行且非常适合数据可视化的开源工具包（因此它被包含在本章中）。\n\
  \n第四节包含一个使用“纯” `CSS3` 创建动画效果的示例，以及一个结合 `CSS3` 与 `jQuery` 的代码示例。接下来，你将学习如何在 Angular\
  \ 应用中处理与鼠标相关的事件。最后一节简要讨论了用于创建图表和图的 Angular 模块 `ng2-charts`。\n\n关于本章代码示例的一个重要提示：它们假设你已经具备\
  \ `SVG`、`D3`、`GSAP`、`CSS3` 和 `jQuery` 的基础知识。如果你不熟悉其中任何技术，可以阅读描述其基本特征的在线教程，或者继续阅读代码示例以识别你需要从在线资源中学习的概念。即使你决定跳过图形示例，也请阅读本章的第一节，该节讨论了\
