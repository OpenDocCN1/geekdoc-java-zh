  \ 的导入语句（可以与 `FormsModule` 的导入语句合并），该语句在 `imports` 属性中也被引用。\n\n## FormGroup 对比 FormArray\n\
  \n如你现在所知，`FormGroup` 将 `FormControl` 的值聚合到一个对象中。Angular 也支持 `FormArray`（`FormGroup`\
  \ 的一种“变体”），它将 `FormControl` 的值聚合到一个数组中。`FormGroup` 数据被序列化为对象，而 `FormArray` 数据被序列化为数组。如果你不知道组中有多少控件，可以考虑使用\
  \ `FormArray`。以下链接包含示例：\n\n[`alligator.io/reactive-forms-fields/`](https://alligator.io/reactive-forms-fields/)\n\
  \n## Angular 的其他表单功能\n\n前面的章节让你了解了 Angular 表单的模块化风格，本节要要介绍一些额外的表单功能，如下：\n\n![Image](img/greybox.jpg)表单验证\n\
  \n![Image](img/greybox.jpg)自定义验证器\n\n![Image](img/greybox.jpg)嵌套表单\n\n![Image](img/greybox.jpg)动态表单\n\
  \n![Image](img/greybox.jpg)模板驱动表单\n\n验证器允许你对表单字段进行验证，例如指定必填字段以及最小最大长度。你还可以指定字段必须匹配的正则表达式，这对于邮编、电子邮件地址等非常有用。或者，你也可以通过编程指定验证器。\n\
  \nAngular 表单还提供监听器来检测表单状态的各种事件，如代码所示：\n\n`{{myForm.form.touched}}`\n\n`{{myForm.form.untouched}}`\n\
  \n`{{myForm.form.pristine}}`\n\n`{{myForm.form.dirty}}`\n\n`{{myForm.form.valid}}`\n\
  \n`{{myForm.form.invalid}}`\n\n例如，如果一个或多个表单字段无效，则显示以下 `<span>` 元素：\n\n`<span *ngIf=\"\
  !myForm.form.valid\">表单无效</span>`\n\n你还可以使用 `ngIf` 指令来显示特定字段的状态，如下：\n\n![Image](img/pg137.jpg)\n\
  \n![Image](img/pg138.jpg)\n\n你可以在这里找到动态 Angular 表单的示例：\n\n[`angular.io/docs/ts/latest/cookbook/dynamic-form.html`](https://angular.io/docs/ts/latest/cookbook/dynamic-form.html)\n\
  \n你可以在这里找到模板驱动 Angular 表单的示例：\n\n[`toddmotto.com/angular-2-forms-template-driven`](https://toddmotto.com/angular-2-forms-template-driven)\n\
  \n## Angular 表单与 Bootstrap 4（可选）\n\n虽然 Bootstrap 是 Angular 外部的，但你可能想为你的 Angular\
  \ 应用添加一些样式效果，特别是当它们包含许多控件的 Angular 表单时。例如，之前章节中的 `ReactiveForm` 应用提供了一个非常朴的界面，Bootstrap\
  \ 可以帮助你极大提升它的外观。\n\n![Image](img/disc.jpg)\n\n\n\n然而，你并不限于 Bootstrap，因此本节仅向你展示了某些使用\
  \ Bootstrap 很容易创建的视觉效果。如果你想查看相应的代码，请从配套光盘将 `FormBootstrap4` 目录复制到方便的位置，并查看 `app.component.ts`\
  \ 的内容。\n\n图 5.1 显示了启动 `FormBootstrap4` 应用程序的输出，它显示了一个带有各种颜色按钮的表单。\n\n章关于 Angular\
  \ 表单的内容到此结束。下一节将讨论 Angular Pipes（管道），它们为 Angular 应用提供了实用的功能。\n\n## 在 Angular 中使用管道\n\
  \nAngular 支持一种称为管道（pipe）的东西（类似于 Unix 管道命令 `|`），它允许你根据条件逻辑（由你指定）来过滤数据。Angular 支持内置管道、异步管道以及对自定义管道的支持。接下来的两个章节将向你展示一些内置管道的示例，随后是对异步管道的描述。另一个独立章节将向你展示如何定义自定义\
  \ Angular 管道。\n\n![Image](img/pg139.jpg)\n\n***图 5.1*** 一个带有 Bootstrap 4 的 Angular\
  \ 应用程序。\n\n## 使用内置管道\n\nAngular 支持多种内置管道，例如 `DatePipe`、`UpperCasePipe`、`LowerCasePipe`、`CurrencyPipe`\
  \ 和 `PercentPipe`。这些以直观名称命名的管道每个都提供了你预期的功能：`DatePipe` 支持日期值，`UpperCasePipe` 将字符串转换为大写，以此此类推。\n\
  \n作为一个简单的例子，假设变量 `food` 的值为 `pizza`。那么接下来的代码片段将显示字符串 `PIZZA`：\n\n```html\n<p>I eat\
  \ too much {{ food | UppercasePipe }} </p>\n```\n\n你还可以对某些 Angular 管道进行参数化，在此所示：\n\
  \n```html\n<p>My brother's birthday is {{ birthday | date:\"MM/dd/yy\" }} </p>\n\
  ```\n\n事实上，你甚至可以链式管道，如下：\n\n```html\nMy brother's birthday is {{ birthday | date\
  \ | uppercase}}\n```\n\n在前面的代码片段中，`birthday` 是一个自定义管道（由你编写）。另一个例子是，假设 Angular 应用包含变量\
  \ `employees`，它是一个基于 JavaScript 对象表示法（JSON）的数据数组。你可以使用此代码片段显示数组的内容：\n\n```html\n\
  <div>{{employees | json }}</div>\n```\n\n### AsyncPipe\n\nAngular 的 `AsyncPipe`\
  \ 接受 `Promise` 或 `Observable` 作为输入，并自动订阅该输入，最终返回发布的值。此外，`AsyncPipe`是有状态的：该管道保持对输入\
  \ `Observable` 的订阅，并在该 `Observable` 的值到达时持续交付这些值。\n\n下面的代码块让你了解如何显示股票报价，其中变量 `quotes$`\
  \ 是一个 `Observable`：\n\n![Image](img/pg140.jpg)\n\n请记住 `AsyncPipe` 提供了两个优势。首先，`AsyncPipe`\
  \ 减少了样板代码。其次，不需要对 `Observable` 进行订阅或取消订阅（后者有助于避免内存泄漏）。\n\n另一点：Angular 并没有提供用于过滤或排序列表的管道（即没有\
  \ `FilterPipe` 或 `OrderByPipe`），因为这两者都可能是计算密集型的，这会对应用程序的感知性能产生不利影响。\n\n下一节中的代码示例将向你展示如何创建一个自定义管道，根据在自定义代码中定义的条件逻辑显示过滤后的用户列表。\n\
