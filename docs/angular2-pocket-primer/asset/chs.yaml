  \ 中的 TypeScript 接口\n\nJSON 文件 `customers.json` 包含了关于客户的类记录式信息，每条信息都可以通过称为 `interface`\
  \ 的结构进行建模，这种结构存在于许多编程语言中。接口与 Apple Swift、Google Go 或 C 语言等语言中的 `struct` 类似。\n\n\
  总的来说，TypeScript `interface` 指定了变量列表及其类型，以及一个或多个方法。当你想将逻辑上相关的数据项（即信息片段）关联在一起时，TypeScript\
  \ `interface` 都是一个非常有用的结构。许多具有多个数据项的实体示例可用，例如客户、员工、学生、采购订单等。你可以用 TypeScript `interface`\
  \ 对所有它们（以及许多其他实体）进行建模，下一节将讨论其中一个示例。\n\n### 一个简单的的 TypeScript 接口\n\n列表 4.11 显示了 `employee.ts`\
  \ 的内容，其中包含一个用于假设员工的 `interface`。真实生活中的示例会在此类接口中包含许多其他信息（和方法），而这个高度简化的示例旨在说明如何在 Angular\
  \ 中使用 TypeScript 接口。\n\n### 列表 4.11：employee.ts\n\n```typescript\nexport interface\
  \ Employee {\n  fname: string,\n  lname: string,\n  city: string\n}\n```\n\n注意列表\
  \ 4.11 中接口 `Employee` 的结构与 `Employees.json` 中行的内容匹配。\n\n### JSON 数据和 TypeScript\
  \ 接口\n\n列表 4.12 显示了 `employees.ts` 的内容，其中包含一个 `Employee` 实例数组。文件 `employees.ts`\
  \ 演示了如何使用符合 TypeScript `interface` 的硬编码数据值填充数组。请注意，列表 4.10 没有在当前代码示例中使用。它的仅仅是为了演示可以从静态文件中加载“种子数据”（这对于测试目的非常有用）。\n\
