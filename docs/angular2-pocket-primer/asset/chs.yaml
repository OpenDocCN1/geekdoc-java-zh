  \n# d3.express: 集成发现环境\n\n在第 3 章中，你看到了一些创建基于 D3 图表的 Angular 应用程序。在本书出版时，Mike Bostock（`D3.js`\
  \ 的创建）正在开发 `d3.express`，他在此处对其描述：\n\n[`medium.com/@mbostock/a-better-way-to-code-2b1d2876a3a0`](https://medium.com/@mbostock/a-better-way-to-code-2b1d2876a3a0)\n\
  \n基于本文的内容，`d3.express` 可能与 RxJS “良好地共处”（因此它被包含在本章中），这对 `d3.express` 来说是一个很好的预兆。这看起来是\
  \ Mike Bostock 提供的另一个非常有趣的项目，它可能为 Angular 应用程序提供更复杂的数据可视化功能。\n\n在本书出版时，`d3.express`\
  \ 的 Alpha 版本可能已经发布，你可以在这里注册早期访问：\n\n[`d3.express`](https://d3.express)\n\n## 总结\n\
  \n本章向你介绍了 FRP（响应式编程），主要关注用于 Web 应用的 RxJS。然后你学习了 FRP 中的各种算符，例如 `filter()`、`map()`\
  \ 和 `reduce()`。你看到了 `Promise` 和 `Observable` 之间的相似之处与差异。接着你学习了冷观测（cold `Observables`）和热观测（hot\
  \ `Observables`）之间的区别，以及如何将冷 `Observable` 转换为热 `Observable`。\n\n此外，你学习了如何对 HTML\
  \ 网页中的 HTML 元素进行响应化（reactify）。最后，你看到了如何使用 `Observables` 生成 SVG 图形和动画效果，以及一个在鼠标移动事件期间显示\
  \ SVG 椭圆的示例。\n\n最后，你看到了如何在 Angular 应用程序中将中间算符 `interval()` 与 `async` 算符结合，以固定的间隔发射整数。\n\
  \n# 第 10 章：杂项主题\n\n本章包含了 Angular 特性的多种杂烩，包括对 Angular 应用程序两个配置文件的简要描述、提前量（AOT）编译、`ngc`\
  \ 编译器、“树摇优化”（tree-shaking）功能、Webpack 工具以及其他各种主题。这些主题的介绍较为浅显，部分是因为这些细节在本书出版后可能会发生变化。不过，你可以搜索相关的在线文档（或博客文章）来获取最新更改。\n\
  \n章节的第一部分简要讨论了配置文件 `package.json`（`npm` 工具所需）和 `tsconfig.json`（`tsc` 工具可选）。本章的第二部分讨论了\
  \ AOT、其优势以及调用 AOT 的两种方法。\n\n本章的第三部分讨论了树摇和 `rollup` 工具，以及如何减小 Angular 应用程序的大小。第四部分向你介绍了\
  \ Webpack 以及它如何与 AOT 配合使用的。你还将学习热模块替换（HMR），它可以缩短开发周期，以及一些实用的 Angular 工具。\n\n最后一部分简要深入探讨了通过\
  \ Angular 实现深度学习，该应用为 TensorFlow 场提供了类似容器的功能，而后者提供了高度可定制神经网络的交互式可视化。\n\n## Angular\
  \ 4.1.0\n\nAngular 4.1.0 版本在本书出版时发布。然而，该版本是一个次要版本，这意味着它没有破坏性变更。此外，该版本是 4.x.x 的无缝替换。\n\
  \n## 新功能\n\n4.1.0 版本增加了对 TypeScript 2.2 和 2.3 的完全支持；事实上，Angular 是用 TypeScript 2.3\
  \ 构建的。幸运的是，这一更改不会影响 Angular 4.0，后者是随 TypeScript 2.1 发布的。\n\n此外，Angular 现在符合 TypeScript\
  \ 中的 `StrictNullChecks`（严格检查）。因此，如果你愿意，可以在 Angular 项目中启用 `StrictNullChecks`。\n\n\
  Angular 4.1.0 的完整功能和错误修复列表可以在此处查看：\n\n[`github.com/angular/angular/blob/master/CHANGELOG.md`](https://github.com/angular/angular/blob/master/CHANGELOG.md)\n\
  \n## Angular 配置\n\n本节讨论了 `package.json`（`npm` 所需）和 `tsconfig.json`（`tsc` 可选），它们是每个\
  \ Angular 应用程序的一部分。\n\n### package.json 配置文件\n\n列表 10.1 显示了 `package.json` 中的 JavaScript\
  \ 依赖项及其当前版本号，这些是由 `ng` 命令行工具自动生成的。请注意，在本书出版时，某些版本号可能略有不同。\n\n***列表 10.1：package.json***\n\
  \n![Image](img/pg268.jpg)\n\n![Image](img/pg269.jpg)\n\n![Image](img/pg270.jpg)\n\
  \n列表 10.1 中的 `scripts` 部分指定了你可以从命令行调用的各种命令。列表 10.1 的下一部分是 `dependencies` 部分，它列出了编译和启动应用程序所需的模块。当你从命令行调用\
  \ `npm` 时，该部分中的模块会被安装。\n\n> 注意\n> `package.json` 的 `devDependencies` 部分会在你的机器上安装一些可执行文件，这些文件在\
  \ `scripts` 部分中被引用。\n\n如果你想将 `lite-server` 可执行文件作为此应用程序的服务器，可以手动调用 `npm` 安装 `lite-server`（如果尚未安装的话）。\n\
  \n`devDependencies` 部分指定了仅开发所需的模块，例如用于执行测试的 karma 相关模块。\n\n### tsconfig.json 配置文件\n\
  \nTypeScript 编译器 `tsc` 使用 `tsconfig.json` 配置文件中的参数值将 TypeScript 文件转译为 JavaScript\
  \ 文件，而不是从命令行指定参数值。\n\n请记住，有时 Angular 应用程序运行不正常，但在浏览器的检查器中没有显示任何编译错误。如果发生这种情况，请从命令行调用\
  \ `tsc` 以检查未报告的错误。\n\n列表 10.2 显示了 `tsconfig.json` 的内容，包含了配置相关的属性，这些属性允许你在不指定参数的情况下从命令行调用\
  \ `tsc`。\n\n***列表 10.2：tsconfig.json***\n\n![Image](img/pg271.jpg)\n\n列表 10.2 包含了\
  \ TypeScript 编译器的各种相关属性及其值。注意 `outDir` 属性指定了 `dist/out-tsc` 子目录为生成文件的位置。`sourceMap`\
  \ 为 true，这意味着在转译过程中会生成源映射。`src` 子目录包含了更多配置文件，你可以方便地查看其内容。到此，关于 Angular 应用程序配置文件的简要介绍结束。\n\
  \n## 什么是 AOT？\n\nAngular AOT 是提前量编译（ahead-of-time compilation）的缩写，它涉及在加载到浏览器之前对应用程序进行编译，从而加快加载速度。\n\
  \n正如你已经所看到的，Angular 在浏览器中加载时通过即时编译（JIT）编译应用程序。然而，JIT 编译会产生运行时性能损失，并且应用程序体积更大，因为它包含了\
  \ Angular 编译器和许多必要的库代码。JIT 编译可以在运行时发现组件模板之间的绑定错误，而 AOT 可以在更早发现模板错误，并通过构建时编译提高性能。\n\
  \n\n\n\n\n此外，AOT 与 Angular 命令行界面 (CLI) 深度集成。例如，以下命令在创建 Angular 应用程序生产构建时使用了 AOT\
  \ 编译：\n\n```\nng build --prod --aot\n```\n\n## AOT 的优势\n\nAOT 的某些优势列如下：\n\n![Image](img/greybox.jpg)更快的渲染\n\
  ![Image](img/greybox.jpg)更少的异步请求\n![Image](img/greybox.jpg)更小的 Angular 框架下载体积\n\
  ![Image](img/greybox.jpg)更早检测模板错误\n![Image](img/greybox.jpg)更高的安全性\n![Image](img/greybox.jpg)更好的性能\n\
  ![Image](img/greybox.jpg)模板的编译时错误报告\n![Image](img/greybox.jpg)减小应用程序体积\n![Image](img/greybox.jpg)移除死代码（摇树优化）\n\
  \n直到最近，`ng` 模板中的错误在运行时才会失败（有时是静默失败），这使得调试 Angular 模板变得非常困难。AOT 现在会在编译时报告模板错误，但目前\
  \ AOT 只能与 `Webpack 2` 配合使用。这种情况在未来的某个时刻可能会发生。\n\n## AOT 配置\n\n在 Angular 应用程序中启用\
  \ AOT 有两种方法：使用 `@ngtools/webpack`（下文讨论）或使用 `ngc` 工具（在另一章节讨论）。第一种方法提供了细粒度的控制，而第二种方法简单且配置较少。请记住重要一点：Angular\
  \ AOT 只对可静态分析的代码和元数据有效。在阅读以下章节后，你能够更好地判断哪种技术适合你的需求。你可以参考以下链接获取更多信息：https://github.com/UltimateAngular/aot-loader。\n\
  \n### 设置 @ngtools/webpack\n\n安装 `@ngtools/webpack` 并将其保存为开发依赖，如下：\n\n```\nnpm install\
  \ -D @ngtools/webpack\n```\n\n接下来，将以下代码添加到配置文件 `webpack.config.js` 中（Webpack 将稍后讨论）：\n\
  \n![Image](img/pg273.jpg)\n`@ngtools/webpack` 加器与 `AotPlugin` 配合工作以启用 Ao 编译。请注意，Angular\
  \ CLI 并不是所有场景下都支持自定义配置。\n\n### 使用 ngc 编译器\n\n`ngc` 编译器是 `tsc` 的替代品，以类似的方式进行配置。然而，`ngc`\
  \ 尝试在没有必要上下文的情况下内联样式表（CSS）。例如，index.css` 中的 `@import` 语句会导致错误，因为没有指示表明 CSS 位于 `node_modules`。\n\
  \n另一方面，`@ngtools/webpack` 提供了 `AotPlugin` 以及一个 Webpack 加载器，它可以与其他加载器共享上下文。因此，当 `@ngtools/webpack`\
  \ 调用 `ngc` 时，`ngc` 可以从其他插件（如 `postcss-import`）获取信息来编译 CSS 等内容。\n\n### tsconfig-aot.json\
  \ 文件\n\n`ngc` 工具依赖于 `tsconfig-aot.json`，它是 `tsconfig.json` 的变体。`tsconfig-aot.json`\
  \ 文件包含了面向 AOT 的设置，其示例在此所示：\n\n![Image](img/pg274.jpg)\n注意指定 `app.module.ts` 和 `main.ts`\
  \ 的两行，它们都位于 `src/app` 子目录下。\n\n## 编译步骤\n\n现在，打开命令行窗口并安装这些依赖：\n\n```\nnpm install\
  \ @angular/compiler-cli @angular/platform-server --save\n```\n\n接下来，调用 `node_modules/@angular/compiler-cli`\
  \ 中的 `ngc` 编译器，通过以下命令创建 AOT 相关的文件：\n\n```\n./node_modules/.bin/ngc -p .\n```\n\n\
  在上述命令完成后，你将看到一个 `aot` 目录，其内容所示：\n\n```\n./aot\n./aot/src/app\n./aot/src/app/component.ngfactory.ts\n\
  ./aot/src/app/app.module.factory.ts\n```\n\n简而言，“工厂”文件通过结合原始文件和模板的 JavaScript 表示来创建组件实例。此外，生成的工厂引用了原始组件类。关于\
  \ AOT 和动态组件的示例可以在此处找到：http://angularjs.blogspot.com/2017/01/understanding-aot-and-dynamic-components.html。\n\
  \n## AOT、CLI 和 Angular Universal 的状态\n\nAngular CLI 不支持 Angular Universal。Angular\
  \ CLI 的一个独立分支支持 Universal，但该分支不支持 AOT。然而，Angular Universal 的一些关键部分将被放入 Angular 核心中。\n\
  \n## 摇树优化与 Rollup 工具\n\nAOT 编译将 Angular 应用程序大部分代码转换为 JavaScript。下一步是调用摇树优化（tree\
  \ shaking），这涉及移除冗余代码，从而减小 Angular 应用程序的体积。请记住，摇树优化对 JavaScript 代码有效。Angular 提供了一个名为\
  \ `rollup` 的摇树工具，它通过执行静态代码分析创建一个排除所有未被导入导出代码的代码包。`rollup` 工具仅适用于包含 `import` 和 `export`\
  \ 语句的 ES2015 模块。\n\n现在使用此命令安装 `rollup` 依赖：\n\n```\nnpm install rollup rollup-plugin-node-resolve\
  \ rollup-plugin-commonjs rollup-plugin-uglify --save-dev\n```\n\n### rollup-config.js\
  \ 文件\n\n在项目根目录下创建配置文件 `rollup-config.js`，内容如下：\n\n![Image](img/pg276.jpg)\n上述文件的\
  \ `entry` 属性指定 `app/main.js` 为应用程序入口，`dest` 属性导致 `rollup` 在 `dist` 目录下创建 `build.js`。\n\
  \n## 调用 rollup 工具\n\n通过执行以下命令从命令行调用 `rollup` 工具：\n\n```\nnode_modules/.bin/rollup\
  \ -c rollup-config.js\n```\n\n上述命令创建了 `dist/build.js`，你可以将其引用在 HTML 页面 `index.html`\
  \ 中，如下：\n\n![Image](img/pg27b.jpg)\n![Image](img/pg277.jpg)\n\n现在使用此命令启动 Angular\
  \ 应用程序：\n\n```\nnpm run lite\n```\n\n片刻后你会看到一个新的浏览器会，如果一切正常，你应该看到 Angular 应用程序。\n\
  \n## 缩小 Angular 应用程序的体积\n\n使用 Angular AOT 配合摇树优化，最简单的方法是使用此命令构建项目：\n\n```\nng build\
  \ --prod\n```\n\n然而，可以使用此命令进一步减小文件体积：\n\n```\nng build --prod --aot\n```\n\n上述命令移除了未使用代码和\
  \ Angular 编译器。关于 AOT 器的更多信息可以在此处获取：https://angular.io/docs/ts/latest/cookbook/aot-compiler.html。\n\
  \n## 缩小包体积\n\n本节描述了测量 Angular 应用程序包的简单过程。第一步是执行以下安装：\n\n```\nsudo npm install -g\
  \ source-map-explorer\n```\n\n接下来，使用源映射构建应用程序，如下：\n\n```\nng build --prod -sm\n\
  ```\n\n![Image](img/pg278a.jpg)\n图 10.1** Angular 应用程序代码大小地图。\n\n第三，检查其中一个包，其示例在此处（文件名对于你的应用程序会有不同）：\n\
  \n```\nsource-map-explorer dist/main.d357e5f7797d112767e6.bundle.js\n```\n\n上述命令将启动\
  \ Chrome 浏览器会话并显示总代码大小，以及各个模块占总大小的百分比。\n\n\n\n\n\nAngular 中的变更检测基于 `zone.js`，它监控所有的异步事件。每个组件都有它自己的变更检测器。变更检测（默认情况下）会检查任何模板表达式的值是否发生了变化。变更方向是单向的，并且会从组件树的顶部到底部进行一次扫描。请记住，更改只能来自组件。\n\
  \n你也可以像下方的代码段所示，通过程序化方式指定变更检测策略：\n\n![Image](img/pg278b.jpg)\n\n之前的代码块包含 `changeDetection`\
  \ 属性，其值为 `ChangeDetectionStrategy.OnPush`，这意味着只有当组件中的数据被修改时，组件才会被重新渲染。\n\n正如你所知，一个\
  \ Angular 应用程序是 Angular 组件的层级树结构，每个组件都有它自己的变更检测器。每当一个组件被修改时，整个树 都会触发一次变更检测扫描。事实上，Angular\
  \ 在扫描更改时会遍历整棵树（从上到部）。\n\n值 `ChangeDetectionStrategy.Default` 是 `changeDetection`\
  \ 的默认值（此处此处应为默认值），而 `ChangeDetectionStrategy.OnPush` 是另一个可能的值。根据 Angular 文档（遗憾的是，文档中似乎没有关于“水合”的解释）：\n\
  \n- `OnPush` 意味着在水合期间，变更检测器的模式将被设置为 `CheckOnce`。\n- `Default` 意味着在水合期间，变更检测器的模式将被设置为\
  \ `CheckAlways`。\n\n上述引言源自以下 Angular 文档：\n\n[`angular.io/docs/ts/latest/api/core/ChangeDetectionStrategy-enum.html#!#OnPush-anchor`](https://angular.io/docs/ts/latest/api/core/ChangeDetectionStrategy-enum.html#!#OnPush-anchor)\n\
  \n然而，如果 Angular 应用程序使用了不可变对象或 Observables，可以通过修改变更检测系统来提高性能。此外，你可以通过指定仅在某个输入值发生变化时执行检查，来修改任何组件变更检测器的行为。回想，输入值是组件从应用程序其他地方接收的属性。\n\
  \n考虑此代码示例：\n\n![Image](img/pg279.jpg)\n\n![Image](img/pg280a.jpg)\n\n要让在人员更改（一个输入属性）时发生变更检测，请将它的\
  \ `changeDetection` 属性设置为 `ChangeDetectionStrategy.OnPush`，如下所示：\n\n![Image](img/pg280b.jpg)\n\
  \n## zone.js 库\n\nAngular 在以下情况下使用 `zone.js` 库进行变更检测：\n\n- ![Image](img/greybox.jpg)\
  \ 当发生文档对象模型 (DOM) 事件（如点击、更改等）时\n- ![Image](img/greybox.jpg) 当 HTTP 请求解析完成时\n- ![Image](img/greybox.jpg)\
  \ 当触发器触发时（`setTimeout` 或 `setInterval`）\n\n然而，在某些情况下 `zone.js` 无法检测到更改，例如：\n\n-\
  \ ![Image](img/greybox.jpg) 使用异步运行的第三方库\n- ![Image](img/greybox.jpg) 不变数据\n- ![Image](img/greybox.jpg)\
  \ Observables\n\n## 什么是 Webpack?\n\n虽然本没有包含依赖 Webpack 的项目，但它是 Angular 应用程序的事实标准，其主页位于此处：\n\
  \n[`webpack.github.io/`](https://webpack.github.io/)\n\nWebpack 是一个模块打包器，这意味着 Webpack\
  \ 获取带有依赖项的模块，并生成表示这些模块的静态资源。Webpack 被认为是 Web 应用开发中的最新“热点”，在许多方面，Webpack 取代了 Gulp\
  \ 的功能（但后者仍然相关且有用）。幸运的是，你还可以将 Webpack 与 `grunt`、`gulp`、`bower` 和 `karma` 结合（示例请参考在线）。\n\
  \nWebpack 的目标如下：\n\n- ![Image](img/greybox.jpg) 将依赖树拆分为按需加载的块。\n- ![Image](img/greybox.jpg)\
  \ 保持较低的初始加载时间。\n- ![Image](img/greybox.jpg) 每个静态资源都能成为模块。\n- ![Image](img/greybox.jpg)\
  \ 将第三方库作为模块集成。\n- ![Image](img/greybox.jpg) 自定义模块打包器的几乎每一个部分。\n- ![Image](img/greybox.jpg)\
  \ 适用于大型项目。\n\nWebpack 的格言很简单：一切都是加载器（loader）。\n\n此外，你可以结合 Webpack 使用 AOT。AOT 的 Webpack\
  \ 配置文件示例可以在此处获取：\n\n[`github.com/blacksonic/angular2-aot-webpack/blob/master/webpack.aot.config.js`](https://github.com/blacksonic/angular2-aot-webpack/blob/master/webpack.aot.config.js)\n\
  \n## 使用 Webpack 工作\n\nWebpack 二进制执行文件会在你启动 `webpack` 的目录中搜索名为 `webpack.config.js`\
  \ 的默认配置文件。该配置文件包含各种属性，因此你不需要从命令行中指定它们。Webpack 支持许多选项，你可以通过调用以下命令查看完整列表：\n\n```\n\
  webpack --help\n```\n\n尽管 webpack 第 2 版本已于 2016 年底发布，但你仍然会遇到使用第 1.x 版本 webpack 的教程。\n\
  \n### 启动 Webpack 的简单示例\n\n确保你已经安装了 `npm`，然后使用以下命令安装 Webpack：\n\n```bash\nnpm install\
  \ webpack -g\n```\n\n接下来，使用此命令安装开发服务器：\n\n```bash\nnpm install webpack-dev-\n```\n\
  \n完成上述步骤后，导航到一个空目录并创建两个文件：`entry.js` 和 `index.html`。\n\n`entry.js` 的内容为：\n\n```javascript\n\
  document.write(\"It works.\");\n```\n\n`index.html` 的内容为：\n\n![Image](img/pg280.jpg)\n\
  \n现在调用以下命令：\n\n```bash\nwebpack ./entry.js bundle.js\n```\n\n执行上述命令后，你将在同一目录下找到\
  \ `bundle.js` 文件。\n\n### 简单的 webpack.config.js 文件\n\n列表 10.3 显示了 `webpack.config.js`\
  \ 的内容，这是一个 Webpack 配置。\n\n**列表 10.3: webpack.config.js**\n\n![Image](img/pg-)\n\n\
  列表 10.3 包含了输出文件名（此处为 `bundle.js`）以及样式表的加载器。\n\n## 热模块加载 (HMR) 与 Webpack\n\n热模块加载指的是文件的动态编译。你可以从命令行调用\
  \ HMR，也可以在 `webpack.config.js` 中指定 HMR 属性。\n\n具体来说，从命令行调用 HMR 有三种方法：\n\n- 第一种方法涉及\
  \ `webpack-dev-server` 工具（你可以全局安装），示例如下：\n  ```\n  webpack-dev-server --inline --hot\n\
  \  ```\n- 第二种方法是在 `package.json` 中将 `webpack-dev-server` 作为依赖安装，如下：\n  ```bash\n\
  \  node_modules/webpack-dev-server/bin/webpack-dev-server.js --inline --hot\n  ```\n\
  - 第三种方法是在 `package.json` 的 `scripts` 元素中将 `webpack-dev-server` 指定为目标之一，如下：\n\n![Image](img/pg283.jpg)\n\
  \n使用最适合你需求的选项。\n\n### 通过修改 webpack.config.js 使用 AOT\n\n除了上一节介绍的三种使用 AOT 的方法外，你还可以修改\
  \ `webpack.config.js` 以支持 AOT，如列表 10.4 所示：\n\n**列表 10.4: webpack.config.js**\n\n\
  ![Image](img/pg284.jpg)\n\n列表 10.4 扩展了列表 10.3 的内容，增加了 `plugins` 部分以及 `loaders` 部分中额外的加载器。\n\
