  \ Angular 应用程序根目录并执行以下步骤。\n\n### 步骤 1：如下所示启动 `ngd`：\n\n```\nngd\n```\nOR\n```bash\n\
  ngd -p ./tsconfig.json\n```\n\n### 步骤 2：指定包含根组件的文件：\n\n```bash\nngd -f src/main.ts\n\
