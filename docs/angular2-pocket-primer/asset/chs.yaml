  \ Angular 应用中整合基于 Material 的功能。\n\n# 其他 Angular 功能\n\n当你有时间时，还有几个可以探索的话题，我们在下面的小节中简要提到（不分重要性顺序）。\n\
  \n## Angular 应用对 I18n 和 L10n 的支持\n\nAngular 同时支持本地化（称为 `L10n`）和国际化（称为 `I18n`）。本地化是指以不同的语言显示文本，而国际化是指显示正确的格式和符号，例如货币、日期/时间、数字符号（数点和逗号在不同语言中含义不同）、邮政编码和电话号码。\n\
  \n通常，`L10n` 也涉及 `I18n`。例如，如果你从美式英语切换到法语，那么货币、日期/时间和数字符号就会改变（以及其他符号也是）。尽管 `l18n`\
  \ 也可能涉及 `l10n`，但有时变化是“小的”。例如，美式英语和澳洲英语的区别是区域性的，差异较小（显然远小于美式英语和法语之间的差异）。\n\nAndroid\
  \ 设备（以及笔记本电脑和桌面电脑）上的默认语言取决于设备使用的国家（例如，美国使用美式英语，英国使用英式英语）。幸运的是，用户可以通过菜单选项轻松更改默认语言。\n\
  \n## 使用组件容器\n\n使用 `this.elementRef` 访问子组件或创建新元素。此处显示示例：\n\n![Image](img/pg287.jpg)\n\
  \n请记住，允许直接访问 DOM 是一个安全风险，正如后续讨论所示：\n\n[`angular.io/docs/js/latest/api/core/index/ElementRef-class.html`](https://angular.io/docs/js/latest/api/core/index/ElementRef-class.html)\n\
  \n## ViewChild 装饰器\n\n`@ViewChild` 装饰器允许你访问 Angular 应用中的子元素，所示：\n\n```typescript\n\
  @ViewChild('input') input: ElementRef;\n```\n\nAngular 支持 `@ViewChild` 装饰器在模板中搜索名为\
  \ `input` 的元素。注意类型是 `ElementRef`，因为没有特定的类名。\n\n上述代码的变体（当仅存在一个元素时）所示：\n\n```typescript\n\
  @ViewChild(ElementClassName) variableName: ElementClassName;\n```\n\n你还需要在 Angular\
  \ 应用中导入 `ElementClassName`。\n\n# 在何指定 Service\n\n有几种方法可以指定 service，取决于你打算对该服务做什么，下文简要讨论。\n\
  \n![Image](img/greybox.jpg) 选项 1：在 `NgModule` 的 `providers` 中指定 service，如果你希望整个应用程序使用/共享\
  \ service 的单例。\n\n![Image](img/greybox.jpg) 选项 2：在 `Component` 的 `providers` 中注入\
  \ service，如果你希望类的每个实例都使用 service 的同一个实例。\n\n![Image](img/greybox.jpg) 选项 3：在类的 `constructor`\
  \ 中注入 service，如果你希望该类的每个实例都有不同的 service 实例。\n\n![Image](img/greybox.jpg) 选项 4：在\
  \ `Component` 的 `viewProviders` 中注入 service，如果你希望每个组件有一个实例，并且仅与组件的*视图*子组件共享，而不与组件的*内容*子组件共享。\n\
  \n咨询在线文档以获取有关上述场景的详细信息。\n\n# 测试 Angular 应用\n\n这是一个书中未涵盖的重要的话题。然而，以下链接提供了优秀的信息（包括代码示例）：\n\
