  \ 使用循环填充 `balls` 数组。\n\n### React Native 与 NativeScript：高层比较\n\n尽管这两个工具包都能允许你开发原生移动应用，但它们存在差异。首先，NativeScript\
  \ 将 Angular 的高级功能与底层 UI 元素结合，创建具有一致外观的跨平台应用。另一方面，React Native 允许开发者编写平台无关的代码并访问平台\
  \ UI 层。其次，React 尝试为业务逻辑提供抽象，而 NativeScript 则提供了更统一的开发体验。\n\n第三，React Native 通过“热加载”提供了快速部署和执行，这在某些情况下可能优于\
  \ NativeScript。第四，在 NativeScript 使用 Angular 需要“拥抱”Angular 架构，而 React 则不然。NativeScript\
  \ 和 Angular 也是独立的开源项目，因此是另一个依赖，而 React Native 在框架中处理跨平台功能。\n\n![Image](img/pg230.jpg)\n\
