  \ `declarations` 属性中（两者均已加粗显示）。\n\n### Angular 中的鼠标事件和用户输入\n\nAngular 支持鼠标事件，并自动识别\
  \ `click`、`mousedown`、`mousemove`、`mouseover`、`mouseup` 和 `mousewheel` 事件。\n\n以下代码片段向你展示如何在标准\
