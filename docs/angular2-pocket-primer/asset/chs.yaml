  \n**图 5.3** 在列表中搜索并显示 GitHub 用户。\n\n## 其他与服务相关的用例\n\n正如你在上一个节中看到的，服务对于检索外部数据非常有用。此外，在\
  \ Angular 应用程序中，还有其他涉及共享数据和服务服务的场景。特别是，一个应用程序可能需要服务类的多个实例，而另一个应用程序可能需要强制执行服务类的单例。另一种情况涉及在\
  \ Angular 应用程序的组件之间共享数据。\n\n这三个场景将在接下来的小节中简要讨论，它们基于一个非常简单的 `UserService` 类，定义如下：\n\
  \n![Image](img/pg155b.jpg)\n\n### 多个服务实例\n\n假设 `UserService`、`MyComponent1` 和 `MyComponent2`\
  \ 分别定义在 TypeScript 文件 `user.service.ts`、`component1.ts` 和 `component2.ts` 中。如果你需要在每个组件中使用\
  \ `UserService` 类的不同实例，请在构造函数中注入此类，所示：\n\n![Image](img/pg156.jpg)\n\n在前面的代码中，`MyComponent1`\
  \ 中的 `UserService` 类实例与 `MyComponent2` 中的 `UserService` 类实例不同。\n\n### 单例服务实例\n\n\
  考虑两个 Angular 组件必须共享 `UserService` 类实例的情况。为了简单起见，假设这两个组件是根组件的子组件。在这种情况下，执行以下步骤序列：\n\
  \n1. 创建一个新的服务组件（`ng g s service`）。\n2. 在 `app.module.ts` 的 `providers` 数组中包含 `UserService`。\n\
  3. 在 `service.component.ts` 中导入 `MyComponent1` 和 `MyComponent2`。\n4. 从 `MyComponent1`\
  \ 的 `providers` 数组中移除 `UserService` 类。\n5. 从 `MyComponent2` 的 `providers` 数组中移除\
  \ `UserService` 类。\n\n步骤 2 确保 `UserService` 类适用于此 Angular 应用程序*所有*组件，并且整个应用程序中只有一个\
  \ `UserService` 类实例。\n\n## 服务与组件间通信\n\n从 `MyComponent1` 向 `MyComponent2` 发送新用户需要三个步骤。\n\
  \n步骤 1：在 `UserService` 中定义一个作为 `EventEmitter` 实例的变量 `sendUser` 以及一个 `sendNewUser()`\
  \ 方法：\n\n![Image](img/pg157a.jpg)\n\n步骤 2：在 `MyComponent1` 中定义一个 `onSend()` 方法，将新用户发送到\
  \ `MyComponent2`：\n\n![Image](img/pg157b.jpg)\n\n步骤 3：在 `MyComponent2` 中定义一个 `Observable`\
  \ 以“监听”从 `MyComponent1` 发出的数据：\n\n![Image](img/pg157c.jpg)\n\n总结前面代码块中逻辑流的另一种方式所示：\n\
  \n![Image](img/greybox.jpg)用户点击按钮添加新用户。\n\n![Image](img/greybox.jpg)`UserService`\
  \ 实例将数据发送到 `Component1`。\n\n![Image](img/greybox.jpg)`Component1` 实例“发射”新用户。\n\n\
  ![Image](img/greybox.jpg)`Component2` 实例通过 `Observable` “监听”新用户。\n\n## 将服务注入到服务中\n\
  \n你已经看到过了如何使用 DI 通过构造函数将服务注入组件中。你也可以将服务注入到其他服务中。要做到这一点，请在“被注入的服务”中使用 `@Injectable`\
  \ 装饰器：\n\n```\n@Injectable\n\n@Component({\n\n})\n\nexport MyService(…)\n```\n\n\
  **注意**\n\nAngular 中的 DI 仅适用于在类定义中包含适当装饰器的类。\n\n## 总结\n\n本章向你展示了如何创建带有 HTML5 表单的\
  \ Angular 应用，以及包含 Angular 控件和 `FormGroups` 的表单。你还学习了如何将基于表单的数据保存在本地存储中。接下来你学习了 Angular\
  \ `Pipes`，以及一个展示了如何实现此功能的示例。\n\n你还学习了 Angular `Services`，并看到了一个说明如何使用服务的示例。最后，你学习了如何使用\
  \ `Http` 类的 `http()` 方法（该方法返回一个 `Observable`）来检索任何 Github 用户的数据，并并在用户列表中显示这些数据的部分。\n\
  \n# 第 6 章：ANGULAR 与 EXPRESS\n\n本章包含了与服务器端技术协作的 Angular 应用，这些技术通常被称为“Node stack”。你将学习如何创建在服务器端使用\
  \ `Express` 和 NoSQL 数据库 `Mongo` 的 Angular 应用。你将在本章中获得对微服务的介绍。然而，本章不涵盖 Node 本身的入门级材料，这是本章的先决条件（网上有很多在线教程）。\n\
  \n第一部分向你展示了如何设置一个简单的基于 JavaScript 对象表示 (JSON) 的服务器（称为 `json-server`），你可以将其用于许多客户端应用程序（不仅仅是\
  \ Angular）。第二部分向你介绍了可以处理客户端数据请求的基于 `Express` 应用程序。\n\n第三部分稍作转折，向你介绍了微服务，以及一个包含 `forkJoin()`\
  \ 方法的 Angular 应用，用于模拟一个简单的微服务示例。服务器端代码由三个 `Express` 应用组成，它们在三个不同的端口上监听客户端请求。\n\n\
  第四部分结合了一个基于 `Express` 的应用程序和一个发布数据请求的 Angular 应用。数据请求从 `Mongo` 实例中检索一组用户，然后将该用户列表返回给\
  \ Angular 应用。此外，此代码示例使用了你在第 X 章中看到的技术，从服务器返回基于 JSON 的数据并将其转换为 `Promise`，然后将 `Promise`\
  \ 转换为 `Observable`，并在 Angular 应用内部进行处理。\n\n## 一个极简的 Node 应用\n\n在第 4 章中，你学习了如何使用\
  \ `json-server` 为文件服务器创建 `HTTP GET` 和 `HTTP POST` 请求的 Angular 应用。使用 `json-server`\
  \ 的优势是“零配置”，对于创建原型和演示非常方便。在本节中，你将看到如何使用 `Express` 创建一个极简的代码示例，它只需要 `server.js` 文件。\n\
  \n![Image](img/disc.jpg)\n\n从光盘将 `SimpleNode` 目录复制到方便的位置。该目录包含了本节的所有文件。然而，如果你想自己执行这些步骤，接下来的节将解释如何操作。如果你想直接使用现有代码，请跳过以下设置部分。\n\
  \n### 设置 Node 环境（可选）\n\n在你的机器上安装 NodeJS 后，导航到一个方便的目录并输入以下命令：\n\n```\nnpm init –y\n\
  ```\n\n第二步是通过以下命令安装 `Express`（我们在下一节中需要）：\n\n```\nnpm install express –save\n```\n\
  \n在前面的命令执行完成后，当前目录将包含一个 `package.json` 文件，其内容类似于：\n\n![Image](img/pg160.jpg)\n\n\
  ### 创建 Express 应用\n\n\n\n\n\n如果你还没有这样做，请将随附光盘中的 `SimpleNode` 目录复制到方便的位置。列表 6.1 显示了\
  \ `server.js` 的内容，它是一个基于 Express 的简单应用程序。\n\n### 列表 6.1：server.js\n\n![Image](img/pg161.jpg)\n\
  \n列表 6.1 包含一个 `require` 语句，然后是一段初始化 `app` 变量的代码片段。它定义了两个路由：第一个路由是默认路由 `/`，第二个路由是\
  \ `/pasta`，当用户导航到 URL `localhost:3000/pasta` 时，它会显示相应的消息。\n\n## 启动 Express 应用程序\n\
  \n在启动应用程序之前，你必须运行此命令安装 Node 相关的依赖项：\n\n```bash\nnpm install\n```\n\n当上一步完成后，请调用以下命令：\n\
  \n```bash\nnpm start\n```\n\n此命令将显示以下输出：\n\n```\nListening on port 3000\n```\n\n\
  现在，启动浏览器并在并导航到 `localhost:3000/pasta`，如果一切设置正确，你将在浏览器中看到字符串 hello pasta。\n\n## 使用\
  \ Angular 和 Express 的应用程序\n\n在第 4 章中，你学习了如何使用 `Observable` 类中的 `forkJoin()` 方法并发发布多个\
  \ HTTP 请求，然后聚合这些请求的结果。本节将向如何将第 4 章中的 `json-server` 文件服务器替换为基于 Express 的应用程序，以及如何聚合来自该\
  \ Express 应用程序的多个响应。（在后面的章节中将看到如何从多个基于 Express 的应用程序提供数据。）\n\n代码示例包含两个部分：第一部分展示如何创建一个基于\
  \ Node 的应用程序，返回关于单个学生的 JSON 数据（基于发送到服务器的 `student id`）。第二部分包含一个 Angular 应用程序，它使用\
  \ `forkJoin()` 方法向服务器发送多个并发请求。\n\n因此，你需要两个终端来执行以下操作：\n\n调用 `node server.js`（位于 `NodeForkJoin/server`）\n\
  \n调用 `ng serve`（位于 `NodeForkJoin/src`）\n\n## 启动服务器和 Angular 应用程序\n\n![Image](img/disc.jpg)\n\
