  \ Angular 应用程序的代码，它显示了一个同时也响应点击事件的 `<button>` 元素。\n\n# 第 2 章\n\n## UI 控件与用户输入\n\n\
  本章包含各种用户界面（UI）控件的 Angular 应用程序，以及处理用户交互的示例，例如用户输入和鼠标事件。记住，本章中的代码示例使用标准的 HTML 语法渲染\
