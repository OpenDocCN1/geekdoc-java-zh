  \n在列表 1.8 中，`selector` 属性匹配 HTML 页面 `index.html` 中的元素 `<app-root></app-root>`：\n\
  \n```text\nselector: 'app-root'\n```\n\n然而，你也可以指定属性而不是元素。例如，假设 `index.html` 包含以下元素：\n\
  \n```html\n<div app-root>Loading. . .</div>\n```\n\n你还需要如下所示修改 `selector` 属性：\n\n\
  ```text\nselector: '[app-root]'\n```\n\n## 总结\n\n本章从描述 Angular 版本号、Angular 的前提条件，以及\
