  \n## 渐进式 Web 应用（可选）\n\n最近，PWA 在移动社区引起了极大关注。如果你对 PWA 不熟悉，这里有一段维基百科的引用：\n\n*渐进式 Web\
  \ 应用（PWA）是一个用于表示新软件开发方法的术语。与传统应用程序不同，渐进式 Web 应用可以被视为普通网页（或网站）与移动应用程序的进化混合体。这种新的应用程序生命模型结合了大多数现代浏览器提供的功能与移动体验的优势。（https://en.wikipedia.org/wiki/Progressive_web_app](https://en.wikipedia.org/wiki/Progressive_web_app))*\n\
  \nPWA 是通过 HTML5、CSS3、JavaScript 和 Service Workers 创建的类原生应用程序。PWA 加载快、可以离线工作并支持推送通知。PWA\
  \ 的图标出现在移动设备上，就像“普通的”原生移动应用程序一样。然而，PWA 无法在任何应用商店中发现，取决于你的观点，这可能是一个优势（例如，省去了发布过程），也可以是一个缺点（例如，其他人找不到你的\
  \ PWA，这可能会减少流量）。\n\n目前，Chrome 支持 PWA，其他浏览器在未来的某时刻也可能支持 PWA。\n\n## Web Workers 和\
  \ Service Workers\n\nService Worker 提供了 Web Worker 的功能以及额外的特性。你可以在这里学习关于 Service\
  \ Workers 的知识：\n\n*[`developers.google.com/web/fundamentals/getting-started/primers/service-workers?hl=en`](https://developers.google.com/web/fundamentals/getting-started/primers/service-workers?hl=en)*\n\
