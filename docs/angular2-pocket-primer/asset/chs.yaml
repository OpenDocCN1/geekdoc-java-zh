  \n## 总结\n\n本章首先向你展示了如何发送 HTTP GET 请求来读取基于 JSON 的文件的内容。接下来，你学习了如何发送 HTTP GET 请求来获取\
  \ Github 用户的信息，以及如何发送 HTTP POST 请求。你还学习了如何从网站获取 JSON 数据，将该数据转换为 `Promise`，然后将 `Promise`\
  \ 转换为 `Observable`。最后，你学习了如何在 Angular 应用程序中设置路由。\n\n# 第 5 章\n\n## 表单、管道与服务\n\n本章向你展示如何创建使用\
  \ Angular 表单（Forms）、管道（Pipes）和服务（Services）的 Angular 应用程序。代码示例依赖于对前面章节中讨论的功能理解，例如如何在\
  \ Angular 中发送 HTTP 请求。\n\n本章的第一节包含使用 Angular 控制（Controls）和控制组（Control Groups）的 Angular\
  \ 应用程序。该节还提供了一个包含 HTTP GET 请求表单的 Angular 应用程序示例，这增强了 第 4 章中涉及 HTTP 相关功能的示例。\n\n\
  本章的第二部分讨论了 Angular 管道（Angular 1.x 中过滤器 Filters 的对应物）。你还将在本节中学习异步管道（async pipes），它们可以消除对定义实例变量的需要，并减少\
  \ Angular 应用程序中内存泄漏的概率。\n\n## Angular 表单概述\n\n`FormControl` 代表单个输入字段，`FormGroup`\
  \ 由多个逻辑相关的字段组成，而 `NgForm` 组件代表 HTML 页面中的 `<form>` 元素。提交表单的 `ngSubmit` 动作语法如下：\n\n\
  ```html\n(ngSubmit)=\"onSubmit(myForm.value)\"\n```\n\n注意，`NgForm` 提供了 `ngSubmit`\
  \ 事件，而你必须在组件类中定义 `onSubmit()` 方法。表达式 `myForm.value` 由表单中的键值对组成。在本章稍后的部分，你将看到涉及这些控制器的示例，以及支持额外有用功能的\
  \ `FormBuilder`。\n\nAngular 还支持模板驱动表单（使用 `FormsModule`）和响应式表单（使用 `ReactiveFormsModule`），它们都属于\
  \ `@@/forms`。然而，响应式表单是同步的，而模板驱动表单是异步的。\n\n## 响应式表单\n\n响应式表单涉及显式管理在非用户界面（UI）数据模型和面向\
  \ UI 的表单模型之间的数据，后者保留屏幕 HTML 控件的状态和值。响应式表单提供了使用响应模式、测试和验证的便利。\n\n响应式表单涉及在组件类 `app.component.ts`\
  \ 中创建 Angular 表单控件对象的树，这些对象也绑定到组件模板 `app.component.html` 中的原生表单控件元素。\n\n组件类可以访问数据模型和表单控件结构，这使你能够将数据模型的值传播到表单控件并在\
  \ HTML 控件中检索用户提供的值。组件可以观察表单控件状态的变化并对其做出反应。直接操作表单控件对象的优势之一是值和有效性的更新始终是同步且在你的控制之下。你不会遇到有时困扰模板驱动表单的时间问题，而且响应式表单更容易进行单元测试。由于响应式表单直接通过代码创建，它们总是可用的，这使你能够立即更新值并“钻取”后代元素。\n\
  \n## 模板驱动表单\n\n模板驱动表单涉及在组件模板中放置 HTML 表单控件（如 `<input>`、`<select>` 等）。此外，表单控件通过 `ngModel`\
  \ 等指令绑定到组件中的数据模型属性。\n\n注意，Angular 指令根据所提供的数据绑定信息创建 Angular 表单对象。Angular 使用 `ngModel`\
  \ 处理数据值的传输，并在用户更改发生时随之更新可变数据模型。因此，`ngModel` 指令不属于 `ReactiveFormsModule`。\n\n![Image](img/disc.jpg)\n\
  \n在深入研究本节内容之前，配套磁盘包含 `MasterForm` Angular 应用程序，它具有表单代码。你可能会发现一些有用的功能。\n\n下一节向你展示如何使用\
  \ `ngForm` 组件以“Angular 方式”创建一个表单。然后你将看到一个如何在 Angular 中 `FormGroup` 的示例。\n\n## Angular\
  \ 表单示例\n\n![Image](img/disc.jpg)\n\n将配套磁盘中的 `NGForm` 拷贝到方便的位置。列表 5.2 显示了 `app.component.ts`\
  \ 的内容，说明如何在 Angular 应用程序中使用带有 `ngModel` 属性的 `<input>` 元素。\n\n# 列表 5.1: app.component.ts\n\
  \n![Image](img/pg129.jpg)\n\n![Image](img/pg130a.jpg)\n\n列表 5.21 定义了一个模板属性，包含一个带有两个\
  \ `<div>` 元素，每个元素包含一个 `<input>` 元素。第一个 `<input>` 元素用于名字，第二个 `<input>` 元素用于姓。\n\n\
  Angular 提供了 `ngModel` 指令，允许你在 Angular 表单中使用实例变量 `myForm`。例如，以下代码段将 `myForm` 指定为给定表单的控制组：\n\
  \n```html\n<form [ngModel]=\"myForm\" (ngSubmit)=\"onSubmit(myForm.value)\">\n```\n\
  \n注意 `onSubmit` 指定了 `myForm`，并且控件绑定到了输入元素。\n\n注意\n\n*向 `<form>` 元素添加 `novalidate`\
  \ 属性以禁用浏览器验证。*\n\n列表 5.2 显示了 `app.module.ts` 的内容，它导入了 `FormsModule` 并将其包含在 `imports`\
  \ 属性中。\n\n# 列表 5.2: app.module.ts\n\n![Image](img/pg130b.jpg)\n\n列表 5.2 非常简单：包含了此代码示例所需的涉及\
  \ `FormsModule` 的两行代码（加粗显示）。\n\n## 数据绑定与 ngModel\n\nAngular 支持表单中的三种绑定类型：无绑定、单向绑定和双向绑定。以下是一些示例：\n\
  \n```html\n<!-- 无绑定 -->\n<input name=\"fname\" ngModel>\n\n<!-- 单向绑定 -->\n<input\
  \ name=\"fname\" [ngModel]=\"fname\">\n\n<!-- 双向绑定 -->\n<input name=\"fname\" [ngModel]=\"\
  fname\" (ngModelChange)=\"fname=$event\">\n\n<!-- 双向绑定 -->\n<input name=\"fname\"\
  \ [(ngModel)]=\"fname\">\n```\n\n\n\n单向绑定示例将在关联组件中查找 `fname` 属性，并使用 `fname` 属性的值初始化\
  \ `<input>` 字段。\n\n双向绑定示例在用户更改 `<input>` 字段的值时会触发 `ngModelChange` 事件，这会导致组件中 `fname`\
  \ 属性的更新，从而确保输入值与其关联的组件值一致。你也可以将 `ngModelChange` 的值替换为函数的输出（例如，将用户在输入字段中输入的字符串转换为大写字母）。\n\
  \n双向数据绑定的第二个示例使用了“盒子里的香蕉”（banana in a box）语法，这是实现与第一个双向数据绑定示例相同结果的简化方法。然而，这种语法不支持双向数据绑定长语法中可以使用的函数。\n\
  \n## 第三方 UI 组件\n\nValor 为 Angular 提供了 Bootstrap 组件，其主页位于：\n\n[`valor-software.com/ng2-bootstrap/#/`](https://valor-software.com/ng2-bootstrap/#/)\n\
