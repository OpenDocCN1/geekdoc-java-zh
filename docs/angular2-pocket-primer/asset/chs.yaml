  \n### 注意\n\n![Image](img/disc.jpg)\n\n*从磁盘拷贝项目目录时，如果没有 node_modules 目录，请拷贝项目内部软链接\
  \ node_modules 目录（大多数示例应用如此）。*\n\n在深入研究图形示例之前，让我们来看 Angular 生命周期方法。\n\n## Angular\
  \ 生命周期方法\n\nAngular 应用拥有生命周期方法，你可以在其中放置自定义代码来处理各种事件（应用启动、运行等）。生命周期钩子接口定义在 `@/core`\
  \ 库中，列如下：\n\n![Image](img/greybox.jpg) `OnInit`\n\n![Image](img/greybox.jpg) `OnDestroy`\n\
  \n![Image](img/greybox.jpg) `DoCheck`\n\n![Image](img/greybox.jpg) `OnChanges`\n\
  \n![Image](img/greybox.jpg) `AfterContentInit`\n\n![Image](img/greybox.jpg) `AfterContentChecked`\n\
  \n![Image](img/greybox.jpg) `AfterViewInit`\n\n![Image](img/greybox.jpg) `AfterViewChecked`\n\
  \n每个接口都有一个方法，其名称在接口名称前加上 `ng`。例如，`OnInit` 接口有一个名为 `ngOnInit` 的方法。Angular 按以下顺序调用这些生命周期方法：\n\
  \n![Image](img/greybox.jpg) `ngOnChanges`: 当输入输出绑定值改变时调用\n\n![Image](img/greybox.jpg)\
  \ `ngOnInit`: 在第一次 `ngOnChanges` 之后调用\n\n![Image](img/greybox.jpg) `ngDoCheck`:\
  \ 开发者的自定义变更检测\n\n![Image](img/greybox.jpg) `ngAfterContentInit`: 组件内容初始化后调用\n\n\
  ![Image](img/greybox.jpg) `ngAfterContentChecked`: 每次检查组件内容后调用\n\n![Image](img/greybox.jpg)\
  \ `ngAfterViewInit`: 组件视图初始化后调用\n\n![Image](img/greybox.jpg) `ngAfterViewChecked`:\
  \ 每次检查组件视图后调用\n\n\n\n\n\n![Image](img/greybox.jpg) `ngOnDestroy`: 在指令被销毁之前调用。\n\n\
  由于 Angular 在组件创建时会调用该组件的 `constructor`，因此 `constructor` 是初始化该组件状态的方便位置。然而，在访问子组件中定义的任何属性或数据之前，必须先初始化子组件。在这种情况下，请在\
  \ `ngOnInit` 生命周期方法中放置自定义代码，以便从子组件获取数据。\n\nAngular 完整的生命周期事件位于此处：\n\n- [`angular.io/docs/ts/latest/guide/lifecycle-hooks.html`](https://angular.io/docs/ts/latest/guide/lifecycle-hooks.html)\n\
  - [`learnangular2.com/lifecycle/`](http://learnangular2.com/lifecycle/)\n\n## Angular\
  \ 生命周期周期方法的简单示例\n\n![Image](img/disc.jpg)\n\n将配套光盘中的 `LifeCycle` 目录复制到方便的位置。\n\n\
  列表 3.1 显示了 `app.component.ts` 的内容，向你展示了某些 Angular 生命周期周期方法被调用的顺序。\n\n***列表 3.1:\
