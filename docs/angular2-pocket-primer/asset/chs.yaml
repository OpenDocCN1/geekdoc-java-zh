  \ Angular 应用中的 TensorFlow playground。\n\n## 总结\n\n本章从关于 Angular 4.1.0 的更新开始，随后介绍了\
  \ `npm` 工具和 `tsc` 工具的配置文件。接下，你学习了 AOT，它是 Angular 中用于优化 Angular Web 应用大小和性能的复杂部分。\n\
  \n你还学习了如何使用 `ngc` 编译器、树摇优化（tree-shaking）功能的作用以及 `rollup` 工具。接下来，你学习了 Angular 变化检测和\
  \ Webpack 工具。你还学习了结合 Webpack 使用 HMR（热模块重载）。然后，你看到了使用 Angular Material 的示例，它可以增强\
  \ Angular 应用的审美价值。\n\n你还学习了 Angular 中的其他许多主题，例如对 I18n 的支持、用于调试的 Augury Chrome 开发者扩展，以及用于显示\
  \ Angular 应用依赖树的 `ngd` 工具。最后，你看到了一个包含深度学习交互可视化的 Angular 应用。\n\n### 索引\n\n**A**\n\
