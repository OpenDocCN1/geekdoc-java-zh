  md: '# Create Embedded Projects for Personal and Professional Applications


    Join the Internet of Things revolution with a project-based approach to building
    embedded Java applications. Written by recognized Java experts, this Oracle Press
    guide features a series of low-cost, DIY projects that gradually escalate your
    development skills. Learn how to set up and configure your Raspberry Pi, connect
    external hardware, work with the NetBeans IDE, and write and embed powerful Java
    applications. Raspberry Pi with Java: Programming the Internet of Things (IoT)
    covers hobbyist as well as professional home and industrial applications.


    +   - Attach hardware and program your Raspberry Pi to brew the perfect cup of
    coffee

    - Create a binary timer that uses the Pi''s GPIO (general purpose I/O) capabilities

    - Explore wearable device programming through a magic-hat pi

    - Build and program an autonomous robot using the Makeblock robotics platform

    - Plug in a high-precision scale, temperature sensor, and touchscreen to program
    a tea brewing station

    - Turn a basic quadcopter into a powerful drone by replacing its brain with a
    Pi

    - Construct an emulator that runs classic video games on your Raspberry Pi

    - Assemble a portable gaming system with a retro-style 3D printed case


    Code examples in the book are available for download at www.MHProfessional.com.


    For a complete list of Oracle Press titles, visit www.OraclePressBooks.com.


