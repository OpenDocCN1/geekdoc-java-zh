    The last step to configure our Raspberry Pi as a drone communications mastermind
    should be simply to configure the hostapd and isc-dhcp-server applications to
    run as services, and for the most part, that is true. However, running two network
    interfaces that do very different things—while coordinating with each other—can
    make for no small amount of conflict. So we''ll configure the services "ideally"
    in this step, add a bit of insurance to boost reliability. After all, we want
    to ensure we can connect at any time to our very brain drone!


    To configure these two apps as services (daemons, pronounced "demons") in UNIX/Linux
    parl, simply issue these commands from the Raspberry Pi command prompt:


    ```

    sudo update-rc.d hostapd enable

    sudo update-rc.d isc-dhcp-server enable

    ```


