  md: '# 118 Raspberry Pi with Java: Programming the Internet of Things


    For example, if you are using SPI, you need to create a new libnfc.conf file

    by typing


    ```

    sudo nano /etc/nfc/libnfc.conf

    ```


    and then adding the contents to the newly created file:


    ```

    device.name = "pn532_spi"

    device.connstrning = "pn532_spi:/dev/spidev0.0:500000"

    ```


    Once you have saved the configuration, you can test libnfc by using

    n nfc-scan-device and nfc-poll commands. Listing 4-2 shows the

    output from running nfc-poll when you wave an RFID card across the reader

    successfully.


    # Listing 4-2 Successful run of nfc-poll


    ```

    pi@iothat ~/libnfc-1.7.1 $ nfc-poll

    nfc-poll uses libnfc 1.7.1

    NFC reader: pn532_spi:/dev/spidev0.0 opened

    NFC device will poll during 30000 ms (20 timings of 300 ms for

    5 modifications)

    ISO/IEC 14434 (106 kbps) target:

    ATQA (SENS_RES): 00 04

    UID (NFCID1): e0 dc e6 16

    SAK (SENS_RES): 08

    f_initiator_target_is_present: Target Released

    Waiting for card removing...done.

    ```


    You can also use the serial and I2C connections similarly. To enable serial,

    simple change the libnfc.conf file to read


    ```

    device.name = "pn532_uart"

    device.connstrning = "pn532_uart:/dev/ttyAMA0"

    ```


    To use the I2C protocol, you will use the following configuration:


    ```

    device.name = "pn532_i2c"

    device.connstrning = "pn532_i2c:/dev/i2c-1"

    ```


    I2C is probably the most challenging to troubleshoot since it is a multi-

    device protocol. To help with troubleshooting if your device does not

    immediately register with the I2C bus, you can install i2c-tools by running the

    command:


    ```

    sudo apt-get install i2c-tools

    ```'
