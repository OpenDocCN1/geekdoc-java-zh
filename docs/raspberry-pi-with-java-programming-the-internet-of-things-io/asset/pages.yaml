    # 3D Modeling in Autodesk Fusion 360


    For the design I chose to use Autodesk Fusion 360. This is a commercial, solid
    modeling program that is very similar to the industrial standard, SolidWorks.
    It is also a successor in a lot of ways to Autodesk Inventor, which is a popular
    choice for solid modeling.


    One of the reasons I chose Autodesk Fusion 360 is that Autodesk, Inc., is very
    friendly to students and hobbyists. During the beta period, Autodesk gave hobbyists
    free use of Fusion 360, and after commercial launch, it added a special tier for
    startups and enthusiasts that enables you to get a free license for use until
    you have a commercial product. This is perfect for tinkerers like me who are going
    to build cool stuff and share it for free so others can improve it.


    I have made the full case design available for you to explore at http://a360.co/1NKpG7U.
    This page gives you a3D view of the model and lets you download the file to edit
