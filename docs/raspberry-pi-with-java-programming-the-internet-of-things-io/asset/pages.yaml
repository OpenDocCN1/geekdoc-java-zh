  md: '# Physical Construction of the IoT Hat


    Now that you have all the software working on your Raspberry Pi, it is time to
    do the physical assembly of the IoT Hat. In addition to the Raspberry Pi A+ and
    smart card reader that you have been using throughout this chapter, you will also
    need a USB power supply, a top hat, and some supplies such as gaffer tape. Refer
    to the section “Bill of Materials” at the beginning of the chapter to get the
    full list of parts.


