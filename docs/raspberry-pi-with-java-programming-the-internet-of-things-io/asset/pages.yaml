  md: 'To connect via SSH on the command line, simply issue the following

    ssh command:


    ```

    ssh user@hostname

    ```


    where "user" is your username (most likely, pi) and "hostname" is your Pi’s

    network name or IP address (for example, 192.168.0.2).

    If this is the first time you are connecting, you may be asked to verify the

    RSA fingerprint. This is a security measure to ensure that the device to

    which you are creating an encrypted connection is in fact the device you

    intended to communicate with. If your network has been compromised (or

    y are on a public network), then it is possible for someone to launch a\man-in-the-middle
    attack and spoof as your device.

    To verify the RSA fingerprint, physically log on to the Raspberry Pi and

    type the following command:


    ```

    ssh-keygen -l -f /etc/ssh/ssh_host_rsa_key.pub

    ```


    This returns a fingerprint that you can verify against the one returned by

    t SSH tunnel, which will look something like the following:


    ```

    2048 0c:b4:c5:3c:1c:2b:8e:ef:97:26:18:a1:33:bf root@raspberrypi (RSA)

    ```


    > CAUTION

    Checking the RSA fingerprint after logging on

    to the Raspberry Pi is good as not checking at

    all. Once someone else has established a man-

    the-middle attack, they can simply intercept the

    command and return a matching fingerprint.


    Now that the connection has been established as secure, SSH will ask for

    your password. Once authenticated, you can issue commands just as if

    were physically at the keyboard. This is often more convenient, and it lets

    y interact with a headless Raspberry Pi to redeployment, diagnostics,

    tor troubleshooting.

    On Windows you will have to install an SSH client yourself. A well-known

    free SSH client is PuTTY, which is maintained by a small team based in

    Cambridge, England. You can find the PuTTY downloads here: www.chiark

    greenend.org.uk/~sgtatham/putty/download.html.'
