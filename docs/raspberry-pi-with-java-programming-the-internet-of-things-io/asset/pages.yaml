  md: '# 16 Raspberry Pi with Java: Programming the Internet of Things


    To reboot you can use a similar command:


    ```

    sudo shutdown -r now

    ```


    As a shortcut you may see some Raspberry Pi users use the halt and reboot commands.
    These behave as expected and are perfectly safe on the Raspberry Pi, but they
    are not best practices when you are administering a variety of Unix operating
    systems, because the behavior varies.


    # Networking Your Raspberry Pi


    To communicate from your computer to the Raspberry Pi, you will have to put your
    Raspberry Pi and computer on the same network so that Pi is accessible via TCP/IP.
    This is also the easiest network option for Models A and A+ that lack an Ethernet
    port. There are several ways to do this depending on the physical location of
    your computer, the network topology, and your available hardware.


    # Connecting via Ethernet


    If you have a router that acts as a Dynamic Host Configuration Protocol (DHCP)
    server, you can simply plug the Raspberry Pi into your network using an Ethernet
    cable. This only works for Raspberry Pi Models B, B+, and 2, because Models A
    and A+ lack an Ethernet port.


    Once connected, the Raspberry Pi will automatically try to get a network address
    from the DHCP server. You can check for the IP address that the Raspberry Pi acquired
    by typing the following command:


    ```

    ip addr show eth0

    ```


    # Connecting via a Local Computer Network


    You can connect your Raspberry Pi directly to your PC using an Ethernet cable.
    Again, this option is only available for Raspberry Pi Models B, B+, and 2, but
    can be a great alternative if you are traveling or in a setting where the network
    topology doesn''t allow your computer and Raspberry Pi to talk.'
