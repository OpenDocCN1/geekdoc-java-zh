    # # Building an Autonomous Drone


    Now that you are familiar with the hardware and software component of this project,
    let''s discuss how you can build an Autonomous Drone. Here is a list of the overall
    steps that you''ll need to perform, which are covered in detail in the following
    sections:


    +   1. Set up your Raspberry Pi.


    +   2. Establish a wireless network connection between the Raspberry Pi and the
    drone. This uses one of the Edimax Wi-Fi adapters.


    +   3. Configure the Raspberry Pi as a wireless access point (WAP). This uses
    the remaining Edimax Wi-Fi adapter.'
  merge: -1
  pgno: 236
- img_proc: true
  md: '+   4. Assemble and fasten the hardware to the drone.


    +   5. Write a Java method that contains flight instructions similar to the example
    in Listing 7-1, using the parroter and autonomous4j libraries.


    +   6. Connect to the Raspberry Pi via NetBeans to remotely deploy the Java application
    and supporting libraries.


    +   7. Fly the drone by invoking the Java application.


    # Setting Up Your Raspberry Pi


    The first thing you need to do is set up Raspian on your Raspberry Pi. Chapter
    1 has full details on how to go through the installation process to prepare your
    Raspberry Pi for programming.


    # Establishing a Network Connection Between the Pi and Drone, and Configuring
    the Raspberry Pi as a WAP


    We''ll tackle these steps together, as they involve several steps to be performed
    "manually" on the Pi itself.


    At this point, you should have your Pi up and running, connected to your network
    via Ethernet cable or one of the Wi-Fi adapters. If you haven''t already (and
    with power to the Pi off), plug in the two Edimax Wi-Fi adapters. As previously
    shown in Figure 7-2, they both plug into the Raspberry Pi USB ports.


    +   - One of these Edimax adapters enables the Raspberry Pi to act as a client
    to the drone, just like your mobile phone or tablet would.


    +   - The other Edimax adapter enables a laptop to communicate with the Raspberry
    Pi. This facilitates pushing software to the Raspberry Pi, debugging and profiling
    it live, and even taking control if required.


    If it''s possible to connect your Pi to your network via Ethernet cable again,
    please do so now, as it simplifies things considerably when updating Wi-Fi'
  merge: -1
