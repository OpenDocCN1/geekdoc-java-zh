  md: '# 6 Raspberry Pi with Java: Programming the Internet of Things


    Either NOOBS or NOOBS LITE will work, although I recommend the former so that
    you don''t have to worry about networking your Raspberry Pi to get it up and running.


    # Installing Raspian


    Once you have an SD card with NOOBS on it, you are ready to install the Raspian
    operating system and set up your Raspberry Pi. This process has been streamlined
    with the latest installers, so you should have no trouble getting set up quickly.
    Along the way I will point out common pitfalls that you may encounter, especially
    with the older Raspberry Pi models.


    # Connecting Your Raspberry Pi


    Here are the connections you will need to make the first time you turn on your
    Raspberry Pi:


    > CAUTION

    Never insert or remove the SD card while your Raspberry Pi is plugged in. This
    can result in corruption of the filesystem and lose important data that you have
    stored on your Raspberry Pi.


    +   1. Insert the SD card into the slot on the bottom.

    On Models A and B this is a full-size friction fit socket, so be careful that
    you don''t use too much force (it goes upside down). On Models A+, B+, and 2 this
