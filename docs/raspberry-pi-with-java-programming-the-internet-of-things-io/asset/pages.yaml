  md: '# Chapter 7: Autonomous Drone 221


    adapter settings. I''ll assume your connection is wired until indicated otherwise
    in the following instructions.

    Once you''re at your Pi''s shell prompt, we''ll first update Raspian and install
    a couple essential packages by executing the following commands:


    ```

    sudo apt-get update

    sudo apt-get install hostapd isc-dhcp-server

    ```


    The hostapd application enables you to configure the Pi as an access point, and
    isc-dhcp-server provides the ability to assign IP addresses to connected devices
    dynamically.

    Next, we set up the DHCP server by opening the dhcpcd.conf file in an editor and
    making a few changes. We''ll use vi here, but if you have a different editor editor,
    please use it instead. Here are the steps to:


    # Edit the dhcpcd.conf File


    Edit the dhcpcd.conf file as follows:


    +   1. Enter sudo vi /etc/dhcpd/dhcpcd.conf.

    2. Find the lines that say

    option domain-name "example.org"

    option domain-name-servers nsl1.example.org, ns2.example.org;

    and add a # at the beginning of each line to comment them out:

    #option domain-name "example.org"

    #option domain-name-servers nsl1.example.org, ns2.example.org;

    3. Find the lines that say

    # If this DHCP server is the official DHCP server for the

    local

    # network, the authoritative directive should be

    uncommented.

    #authoritative;

    and remove the #, uncommenting the line:

    authoritative;'
