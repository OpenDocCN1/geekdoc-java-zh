  md: '# Binary Subdivision of a Day


    A more accurate interpretation of binary time would be to simply subdivide the
    halves until you reach a suitable time unit. By dividing a day into 65,536 units
    (2 to the 16th power), you get a unit that is slightly larger than 1 second (1.318359375
    seconds). An example of a binary day clock is shown in Figure 3-8.


    If the earth were ruled by computers, this is the system we would all be using!
    However, this subdivision turns out to be impractical for most timing purposes
    that standardize on the second as the core unit of time.


    # Binary Multiples of a Second


    The next level of hardcore time geekiness would be to question the basic assumption
    that a day is a useful basis for a time system. In fact, there are lot of issues
    with basing time on the rotation of the earth, including


    +   - The length of days varies throughout the year. Hence, odd systems like daylight
    saving time (DST) are used to shift time to match the sunrise.


    +   - The number of days per year varies. Leap years attempt to account for this
    by adding an extra day every four years, but even this is inaccurate, every 400
    years a leap day has to be removed (http://en.wikipedia.org/wiki/Leap_year).


    ![](img/e10b78d76be679e70031ec7a27b91e4a_95_0.png)


    FIGURE 3-8. The current time in binary subdivisions of a day, from www.abulsme.com/binarytime/'
