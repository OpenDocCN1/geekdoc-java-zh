    FIGURE 4-3. Advanced Options tab in raspi-config


    To open the raspi-config utility, you first need to get command-line

    access to the Raspberry Pi+. Since it has no Ethernet port, the easiest way

    is to hook up a keyboard and HDMI screen. Once logged in to the console,

    You can then start the raspi-config utility by typing


    ```

    sudo raspi-config

    ```


    Navigate to the Advanced Options item (number 8) and enter that

    ubmenu. You will be given a list of new options as shown in Figure 4-3

    (and described in Chapter 1).

    On the Advanced Options tab, you need to enable SPI and I2C by choosing

    the respective menu items of A6 and A7. Raspi-config will first ask you

    if you want to enable the interface, to which you should respond Yes and

    confirm by choosing OK. Then the program will ask you if you want the kernel

    module loaded by default, to which you should respond Yes and confirm again

    with OK. Do this for both the SPI and I2C interfaces.'
