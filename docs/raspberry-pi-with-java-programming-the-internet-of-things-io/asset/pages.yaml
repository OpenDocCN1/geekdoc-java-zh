  md: '# 100 Raspberry Pi with Java: Programming the Internet of Things


    Using the SysFs GPIO access, there are some additional steps needed to export
    the pins in advance, and it forces us back to using Broadcom pin numbers for the
    entire program. Another issue to watch out is that if the test does not complete
    successfully due to an exception or abnormal termination, the GPIO pin will remain
    exported, which requires a little bit of clean-up before the next run.


    Running this version, we get the following performance: 82.1 kHz. This is quite
    a performance reduction from the 1.7 MHz we got earlier by using the memory-mapped
    access, and gives us a nice upper bound on the Device I/O library. Since it is
    relying exclusively on sysfs access, it can never be faster than 80 kHz, but in
    practice it is a lot slower given the error checking, caching, and so forth.


    From all of this performance hacking, we can draw some very interesting conclusions:


    +   - Pi4J raw-access performance is pretty good. Use it and your application
    will be faster than anything else out there that is not written in pure C.


    +   - Most applications don''t really need that level of performance and will
    work fine with the high-level Pi4J and Device I/O libraries.


    +   - If you have made it through this entire performance testing section, you
    are a true embedded hacker. Welcome to the club!'
