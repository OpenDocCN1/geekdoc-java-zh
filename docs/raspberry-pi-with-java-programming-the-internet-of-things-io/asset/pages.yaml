  md: '# 244 Raspberry Pi with Java: Programming the Internet of Things


    I left the first ground connection unsoldered for later use. Also, note the use
    of diodes to connect the Start and Select buttons. Since there are only six usable
    GPIO pins, it is necessary to “overload” some of the other GPIO pins by connecting
    multiple buttons. Since it is physically impossible to press left or up and down
    at the same time, you can overload operations by having the Select button press
    left/right and having the Start button press up/downultaneously. However, if you
    were to hook a straight wire from the Start or Select to two GPIO pins simultaneously,
    it would create an electric coupling with two GPIO pins such that pressing one
    would trigger the other. By using a diode, the electrical flow is limited to one
    direction, preventing the current from leaking when one direction is pressed but
    still allowing the Start and Select buttons to trigger both GPIO pins simultaneously.
    For this to work, the diodes need be oriented such that the cathode (black ring)
    is facing the switch.


    Another point to note about this overloaded usage is that it prevents the use
    of holding Start or Select using the navigational button at the same time. This
    would produce a problem for the A or B button, but since Start and Select are
    used exclusively for mode selection, pausing, and so forth, this is not a problem.


    # Soldering the Kippah


    Time to pull out the soldering iron and hook the breadth connections to the Kippah
    board. Since the GPIO connectors on the Kippah are simply electronic pads, you
    will need to do a careful and precise job of wiring each of the (sometimes multiple)
    leads to exactly one connector. Testing the connections with a multimeter afterward
    is important to ensure there are no shorts, and I recommend adding some heat shrink
    tubing to ensure that the connections stay electrically isolated.


    To understand the wiring connections, Table 8-1 lists which Kippah lead each of
    the components is connected to.


    This should also match the breadboard wiring shown earlier in Figure 8-4, but
    having a second reference handy from the Kippah standpoint will help make sure
    that you don’t make any mistakes while wiring.


    Table 8-1 also gives you a good idea of how many leads need to go to each of the
    Kippah’s terminals. For later use by the portable enclosure, I recommend keeping
    all the leads at least 4in or 10cm long. Also, it is important to keep the wires
    connected to adjacent terminals from touching, so leave enough space when soldering
    and use heat shrink tubing to seal the wires.'
