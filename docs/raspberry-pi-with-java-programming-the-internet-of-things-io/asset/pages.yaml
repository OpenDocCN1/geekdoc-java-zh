  md: '# 46 Raspberry Pi with Java: Programming the Internet of Things


    A simple example of using this class would be to calculate how much grounds to
    use for a 300-gram cup of water:


    grindWeight (REGULAR, 300)


    This would return 17.4g, which should sound about right if you ever followed a
    coffee brewing recipe from one of the popular gourmet roasters.


    For convenience, we are making two simplifications related to this calculation:


    +   **Weight of dissolved solids** The weight of coffee is slightly heavier than
    the equivalent volume of water due to coffee solids. Our calculation assumes the
    weight is equal.


    +   **Water trapped in grounds** Not all the water will make it through the extraction
    process, since the grounds absorb some of the moisture. Our calculation measures
    the water added rather than the volume extracted, which is much easier.


    These two sources of error are relatively small and partially cancel each other
    out. Also, they are consistent and repeatable phenomena, so we should be able
    to get very reliable results in our coffee brewing regardless.


    # Asynchronous Communication


    While we used a synchronous algorithm for reading the scale in our earlier example,
    this turns out to be a poor choice for our coffee algorithm. The reason for this
    is that USB scale data is buffered, so reading on demand returns stale data initially.
    If we wait until need to know the current weight to take a reading, it is impossible
    to differentiate between the stale buffered data and the current scale unless
    we read and discard a fixed amount of data. By reading data continuously, we have
    an instantaneous snapshot of the current scale value in memory at all times, and
    can simply block our thread until the next reading is available if we are waiting
    for a specific value.


    The code in Listing 2-9 implements a new USBPipeListener callback that processes
    the returned data, submits a new request for data, and notifies any threads blocked
    on the scalePhaser that we have new data.'
