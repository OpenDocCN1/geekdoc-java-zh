    # Construction of the RetroPi Case


    3D printers are a lot of fun because of all the flexibility they give you a designer
    to build whatever you can imagine. As long as you understand the limitations of
    the machine, you can print some pretty complex and amazing structures, some of
    which cannot be fabricated by any other type of production.


    My goal for the NightHacking RetroPi case was to create a minimal-sized enclosure
    for the Raspberry Pi and Kippah screen that is reminiscent of the Game Boy Advance
    SP, shown in Figure 9-2. The Game Boy Advance SP was the first Nintendo handheld
    console to sport a hinged design, which has been a popular feature of all Nintendo
    handheld consoles since then. That also turned out to be the trickiest part of
    this design, as you will see shortly.


    Some specific design goals that I had related to the 3D model included


    +   - Capable of being printed without supports One the limitations of FDM printers
    is that they can only print on top of existing material, so printing hanging stalactites
    is impossible and many'
