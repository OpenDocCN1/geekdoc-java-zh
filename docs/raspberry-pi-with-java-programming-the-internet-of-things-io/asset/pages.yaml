    # FIGURE 4-4. PN532 Breakout Board from Adafruit


    You can leave the extra pins on the top and the FTIC connector on the bottom connectors
    onto the board is fairly straightforward, but if you have never done soldering
    before, here are a few tips:


    +   * A soldering iron with a fine chisel tip will make it easier to work with
    small components. If your soldering iron is too large, you may damage nearby components.


    +   * It is helpful to have a clamp or “helping hands” to secure the component
    you are trying to solder. Once the solder cools, your component will be stuck
    at whatever angle it was positioned, so your chance to align things before you
    start soldering.


    +   * Make sure the hole and pin are both fully heated before applying solder.
    If either is not sufficiently hot, you will get what is called a “cold solder
    joint,” which may fail over time.'
