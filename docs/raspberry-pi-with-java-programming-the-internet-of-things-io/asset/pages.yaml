  md: '# 264 Raspberry Pi with Java: Programming the Internet of Things


    Also, there are some minimum specifications that you will need to print this model
    successfully:


    +   - **100-micron layer height** The case is designed and tested at 100 microns.
    If you print at a larger layer height, you will run into issues with tolerances
    on the parts and reliably printing the overhangs. Printing at lower layer heights
    is fine and may result in higher quality.

    - **.4mm nozzle (or finer)** This is standard on most printers, but a larger diameter
    nozzle will lose detail and be unable to print some of the features.

    - **Cooling fans** There are several overhangs and bridges that will only print
    successfully if you have cooling fans to quickly solidify the filament.

    - **Print volume** The case can be printed on a very small printer, requiring
    only a 10mmx12mm build plate. Getting a larger printer is nice since you can do
    multiple parts at once, but is not required.


    One feature that is nice to have, but it is possible to print without, is a heated
    bed. This handy feature allows you to keep the large, flat surfaces of the model
    from peeling up, while providing a clean, glossy surface. However, there are other
    solutions to keep the print from peeling, such as glue or painter''s tape, so
    follow your printer manufacturer''s instructions for this. And finally, the following
    are some gimmicks that you can do. If you are buying a printer because it has
    one of these features, then you are making a mistake.


    +   - **Auto bed leveling** In practice this doesn''t actually work on most printers,
    so you will end up manually leveling. It''s better to get a printer with a refined
    manual leveling system that works.

    - **Multiple color printing** This is another feature that sounds great but doesn''t
    actually work. FDM printers are quite happy printing in a single color. Switching
    colors during a print is guaranteed to result in blending of colors, offset layers,
    or a failed print. The enclosure in this chapter is designed...'
