  md: 'Raspberry Pi with Java: Programming the Internet of Things


    # Using Pi4J


    The Pi4J library is written by Robert Savage and based on the very widely used
    WiringPi C library. Compared to the Device I/O library, Pi4J has lots of features
    and is very easy to get started with.


    To use Pi4J you just require one JAR file (pi4j-core.jar)—no permissions, no property
    files, custom JVM arguments. However, you do require root access (which you learned
    how to set up in NetBeans in Chapter 2).


    # NOTE


    Pi4J can use Sysfs GPIO access like the Device I/O library ("GPIO Performance
    Hacking") section at the end of this chapter for details). However, this is harder
    to set up and takes a big performance hit, so I recommend sticking with the default
    /dev/mem implementation.


    ![](img/e10b78d76be679e70031ec7a27b91e4a_89_0.png)


    # Pi4J Pin Assignments


    By default, Pi4J uses the WiringPi pin assignments. The advantage of these are
    that they are sequential and in the same location from revision of the Raspberry
    Pi boards. In practice this only matters between revisions 1 and 2 of the Raspberry
    Pi B, because the Raspberry Pi Foundation has standardized the main header pin
    layout for all subsequent boards, opting to add more pins to the header instead.
    Figure 3-4 shows the pin assignments to use with Pi4J.


    Pi4J also has the option to initialize pin assignments to the Broadcom GPIO pin
    numbering. However, I don''t recommend changing this, since it will confuse others
    who are familiar with the Pi4J library and assume certain assignments. The only
    reasons you may want to do,this is if you need to run as non-root (in which case
    Sysfs access is by Broadcom numbering) or if you are running mixed Device I/O
    and Pi4J code.


    # Pi4J LED Test


    To demonstrate the usage of the Pi4J library, we are going to recode exactly the
    same LED test using the Pi4J library instead. However, the setup of Pi4J is much
    simpler and the number of changes is minimal, so this will be a breeze!


    ![](img/e10b78d76be679e70031ec7a27b91e4a_89_1.png)'
