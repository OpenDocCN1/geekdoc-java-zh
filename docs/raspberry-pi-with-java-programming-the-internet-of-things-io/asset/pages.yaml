  md: '# 256 Raspberry Pi with Java: Programming the Internet of Things


    To finish the installation of JNIinput, you will need to run the following commands
    from the Raspberry Pi:


    ```

    sudo apt-get install libjinput-jni libjinput-java

    sudo in -s /usr/lib/jni/libjinput.so /usr/lib/jni/libjinput-

    inux64.so

    ```


    These commands install the JNIinput library from the Raspian repository and create
    a symbolic link for a 64-bit version, which is what Java tries to access. However,
    there are a few tweaks needed on the Raspberry Pi to get the best resolution and
    performance.


    JavaFX ignores the overscan specified in the configuration and doesn''t provide
    an alternate mechanism to overscan directly. However, we can hack this by modifying
    the framebuffer width and height to account for the overscan deeed. Edit /boot/config.txt
    to change the framebuffer width and height to the following:


    ```

    framebuffer_width=640

    framebuffer_height=472

    ```


    > NOTE

    This assumes a top overscan of 150 and a left overscan of 160. If you have different
    overscan values, simply add them to the original framebuffer width and height
    to get the correct values.


    Also, the overscan Insets in the JavaFXNES main class should match the overscan
    values in your config.txt file. Feel free to modify this member variable to match
    your display:


    ```

    Insets overscan = new Insets(-59, 160, 150, 0);

    ```


    I recommend a few other simple changes to the /boot/config.txt file:


    ```

    framebuffer_depth=32

    framebuffer_ignore_alpha=1

    gpu_mem=128

    ```'
