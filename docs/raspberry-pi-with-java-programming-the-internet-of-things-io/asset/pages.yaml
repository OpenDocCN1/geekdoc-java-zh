  md: '# Chapter 2: Your First Java Project 29


    # Getting Started with NetBeans


    For coding with the Raspberry Pi you can use any Java IDE of your choice. You
    can even edit and compile directly on the Raspberry Pi; however, I don''t recommend
    doing this since the Raspberry Pi takes considerably longer than a modern PC to
    do processor-intensive tasks. This book shows you how to use the NetBeans IDE
    since it has convenient integration that lets you run and deploy applications
    directly from your computer via SSH.


    # Downloading and Configuring NetBeans


    You can download NetBeans directly from http://netbeans.org/ for your operating
    system. There are five different download bundles available, as shown in Figure
    2-1, with different sets of plug-ins contained in each. The two main flavors of
    Java are Standard Edition (SE) and Micro Edition (ME). Java SE is what you use
    on the desktop and in server applications, and Java ME is an interpreted-only
    version designed for highly resource-constrained devices. Since we will be using
    Java SE Embedded, we only require the Java SE distribution, which also happens
    to be the smallest bundle. If you later decide to add additional support, such
    as Java ME (which I recommend trying on your Raspberry Pi), then you can always
    add the additional plug-ins later within NetBeans.


    ![](img/e10b78d76be679e70031ec7a27b91e4a_46_0.png)


