  md: 'Here is a quick rundown of what the different options do (recommended)

    changes are noted:


    +   **Expand Filesystem** This lets you expand the root filesystem to fit the

    size of the SD card. If you used NOOBS to install, this has already

    taken care of during the install.


    +   **Change User Password** Changing the password is highly

    recommended for security purposes. Anyone who can access the

    Raspberry Pi over the network will have root access if you don''t

    change this.


    +   **Enable Boot to Desktop/Scratch** This lets you boot to a graphical

    user interface (GUI) with X Window System and optionally open

    Scratch for visual programming. This book steers you to using the

    command line, anytime you want to open X Window System,

    can you type startx.


    +   **Internationalisation Options** If you forgot to catch this during

    the NOOBS install, you have another chance to rescue the

    keyboard layout.


    +   **Enable Camera** This enables support for the Pi Camera and is a

    recommended setting.


    +   **Add to Rastrack** This adds your Pi to a worldwide list of Raspberry

    Pi locations on a map. It is fun to join in and and provides valuable

    statistics on the Raspberry Pi community as you discovered earlier.

    Since this requires an Internet connection, you may want to revisit

    this option after completing the upcoming “Networking Your

    Raspberry Pi” section.


    +   **Overclock** The default speed of the Raspberry Pi''s processor is

    700 MHz for the A, B, A+, and B-, and 900 MHz for the Raspberry

    Pi 2. You can optionally raise this; however, it is recommend to start

    with the default speed. Overclocking the Pi may result in it running

    hotter and shortening the life of its components.


    +   **Advanced Options** Discussed in more detail in the next list.


    +   **About raspi-config** This displays an information screen about the

    Raspberry Pi.'
