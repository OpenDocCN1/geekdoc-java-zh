    Nano is a simple command-line editor that allows you to edit text files on Unix
    systems. When you open the cmdline.txt file, you will get an editing screen as
    shown in Figure 1-10. Scroll to the end of the line using the arrow keys and type
    ip=192.168.0.2` (or a similar local IP address). Make sure to leave a space after
    the last parameter (most likely, rootwait) and do not add any carriage returns.


    After rebooting your Pi, it will start up with the new IP address fixed, and will
    be accessible from your computer with that IP address.


