  md: '# Chapter 9: NightHacking RetroPi 277


    As a quick recap on surface-mount soldering from Chapter 8, I recommend the following
    procedure:


    +   1. Clean the terminal of any existing solder using the desoldering wick.


    +   2. Recoat the terminal by heating it up and flowing a small solder ball onto
    it.


    +   3. With a little solder on the tip of the soldering iron, heat up and push
    the wire into the solder ball.


    By ensuring both that the terminal is hot when you flow the solder onto initially
    and when you push it into the solder ball, you should get a nice, solid connection
    between both components. Also, make sure to use the board holder and the helping
    hands clips to keep everything in place while you focus on precise soldering.


    The second step is to desolder the 3.5mm jack from the TS2012 board and reconnect
    the direct audio cables in their proper place. Just to recap the connections,
    the right channel (PP26) goes to R+ and ground (PP6) goes to R-.


    # Portable Power


    The next piece of hardware to hook up the Adafruit PowerBoost1000C. This is a
    clever little circuit that has a built-in charging circuit for li-ion batteries
    as well as a voltage converter that will bump the 3.7V from the battery up to
    5V to power the Raspberry Pi. Paired with some 4400mAh lithium-ion cells, we will
    have enough power to keep the RetroPi going for a whole day of gaming fun. (In
    my tests it took 5 hours of constant use for the low battery light to come on,
    and another 80 minutes for the RetroPi to die entirely, for a total run time of
    over 6 hours.)


    Figure 9-12 shows the PowerBoost with the first two pins for the power switch
    soldered and the power pins getting prepped. We need to hook up a total of four
    different connections on this board, including the following:


    +   EN Connect to this edge terminal of the button.


    +   GND (next to EN) Hook this up to the center terminal of the button.'
