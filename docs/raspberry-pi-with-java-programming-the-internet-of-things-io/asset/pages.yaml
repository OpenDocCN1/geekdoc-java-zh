    # Hooking Up Speakers


    The Raspberry Pi has a special four-pole TRRS jack that combines both audio and
    composite video signals in a single 3.5mm connector. We are interested in just
    the audio portion, so a standard stereo audio plug will work just fine.


    To make this a truly portable setup, we are going to use the TS2012 powered mini
    amplifier that is powered off the Raspberry Pi, as well as some small speakers
    that will accurately reproduce retro music from the game emulator. The Adafruit
    breakout board for the TS2012 amp has all of the connections clearly labeled for
    the speakers and left/right audio jacks. We will also need to hook up the holes
    labeled VDD and GND to the amp to power it off the Raspberry Pi.'
