  md: '# Raspberry Pi with Java: Programming the Internet of Things


    While the Raspberry Pi can be used as a miniature, general-purpose computer, its
    utility really shines when you take advantage of the general purpose I/O (GPIO)
    pins. The GPIO pins can be used to read digital signals, small components, and
    talk to a variety of devices ranging from temperature sensors to accelerometers
    to radio frequency identification (RFID) readers.


    Depending upon the model of the Raspberry Pi you are using, the number of available
    GPIO pins and the pin layout vary. Here is a quick summary of the differences
    you will find on different boards:


    +   - Raspberry Pi B (rev 1) 26-pin header with 17 available GPIO pins

    - Raspberry Pi B (rev 2), A 26-pin header with 17 available GPIO pins + 4 additional
    on the P5 header

    - Raspberry Pi B+, A+ 40-pin header with 26 available GPIO pins


    So, the number of GPIO pins available for connecting devices from 17 to 26 based
    on the board and revision. Several of these pins are designated for special protocols
    such as Serial Peripheral Interface (SPI) or Inter-Integrated Circuit (I2C), although
    they can be used as simple digital input/output pins as well.


    For the purpose of this book, Model B revision 1 boards are considered to be “legacy”
    and not recommended for use. The pinouts differ slightly from the revision 2 boards,
    requiring different pin configurations, and they lack the additional P5 header,
    limiting the number of usable GPIO pins. The easiest way to identify if you have
    a revision 1 board is to look for the absence of mounting holes.


    ![](img/e10b78d76be679e70031ec7a27b91e4a_75_0.png)


    > TIP

    The pins to watch out for are 3, 5, and 13 (by header order), so if you don''t
    use these, your program will be compatible with the earliest board revisions.
    Also, if you use the Pi4J library''s pin numbering scheme, you are insulated from
    GPIO pin differences on the revision 1 board.


    The goal of this chapter is to learn how to use the GPIO libraries by implementing
    a timer that counts down in binary. This is a great way to learn how to do simple
    input (switches) and simple output (light emitting diodes or LEDs) using Java
    libraries.'
