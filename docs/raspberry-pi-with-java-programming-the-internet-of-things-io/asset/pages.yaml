  md: '# 82 Raspberry Pi with Java: Programming the Internet of Things


    > If you have a Raspberry Pi B revision 2, or Raspberry Pi A, you can still accomplish
    this exercise; however, you will need to supplement pins on the main header with
    ones on the P5 pinout. This is directly next to the P1 header and contains eight
    pins (in two rows of four) that you will need to solder a header onto.


    We will also be making use of a Raspberry Pi Cobbler from Adafruit. This is a
    handy device with a small PCB with labeled headers for all of the GPIO pins. On
    one side is a header that is a perfect fit for a serial cable you can use to connect
    to the Raspberry Pi, and on the other side are headers that are perfectly spaced
    to slide into a breadboard straddling the center gap. The Pi Cobbler comes in
    two flavors, B/A version with 26 pins and a B+/A+/2 version with 40 pins, make
    sure to get the right one for your board.


    To make it easy to follow along the wiring, Figures 3-11 and 3-12 show a Fritzing
    breadboard diagram and a photo of a completed breadboard, respectively. The Fritzing
    diagram in Figure 3-11 shows the placement of LEDs and resistors as well as the
    electrical connections for my prototype. You can also download the Fritzing model
    as part of the source code for this chapter in GitHub here: https://github.com/RaspberryPiWithJava/BinaryTimer.


    For the actual breadboard, I chose to use 22 AWG wire to cut and with colors to
    match the diagram. This makes it a little easier to see the connections on the
    board, which is equivalent to using jumper wires to make the connections if you
    want to spend less stripping wires and more time hacking on your timer algorithm.
    The completed project (minus the serial cable and Raspberry Pi) is shown in Figure
    3-12.


    Now that you have done wiring, you are almost ready to start coding. However,
    we have made use of a couple special-purpose pins that need to be disabled.


    # Disabling Serial


    By default the Raspberry Pi reserves the Rx and Tx pins (Broadcom GPIO 14/15 or
    Pi4J GPIO 15/16) for console access. This is handy if you don''t have a display
    to hook up to the Raspberry Pi for troubleshooting, but our project uses a lot
    of pins, so need every available GPIO!'
