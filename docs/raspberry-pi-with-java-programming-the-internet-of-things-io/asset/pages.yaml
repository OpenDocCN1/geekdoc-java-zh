    You may create additional methods with your own flight instructions as well. Table
    7-1 contains some commonly used flight control-related methods available to you
    in the autonomous4j library. Methods may be chained together in a fluent API pattern
    as demonstrated in Listing 7-2.


    | Method | Description |

    | --- | --- |

    | takeoff() | Causes drone to start and take off. |

    | stay() | Causes drone to stay in place. |

    | forward(int speed) | Causes drone to fly forward at a given percent of speed.
    |

    | backward(int speed) | Causes drone to fly backward at a given percent of speed.
    |

    | goLeft(int speed) | Causes drone to fly left at a given percent of speed. |

    | goRight(int speed) | Causes drone to fly right at a given percent of speed.
    |

    | up(int speed) | Causes drone to fly up at a given percent of speed. |

    | down(int speed) | Causes drone to fly down at a given percent of speed. |

    | doFor(long ms) | Modifier for how long an operation should occur. |

    | hold(long ms) | Synonymous with the doFor() method. |

    | goHome() | Causes drone to navigate to its takeoff point and stop. |

    | playLedAnimation() | Blinks a specified LED color for given number of times
    and duration in seconds. |

    | replay() | Causes drone to repeat the previous flight. Flights are automatically
    recorded in the A4jBlackBox object. |

    | land() | Causes drone to land and stop. |


    # **Table 7-1.** Commonly Used Flight Control Methods in autonomous4j'
