    and spreads the navigation contacts on both sides of the breadboard. Here are
    the constraints you should keep in mind when laying out the buttons:


    +   - Each of the navigational switch legs needs to be separated, so straddle
    the switch across the center of the breadboard. It is not a perfect fit for the
    breadboard hole spacing, so you will need to bend the pins slightly. I oriented
    mine with the wider-spaced pins on the left. You should be able to find a good
    position where the switch stays in place by itself but does not put stress on
    the pins to break them off.


    +   - The 12mm switches have four leads, but they are connected together in pairs.
    They fit nicely across the center of the breadboard as well, and that orientation
    the leads that cross the internal switch are both accessible from the same half.


    +   - The C&K D6 switches are also sized nicely for the breadboard, but are not
    wide enough to span the center. They also have four leads, so make sure the flat
    edge of the round switch is facing the long edge of the breadboard, which will
    keep the electrically connected leads on the same rail.'
