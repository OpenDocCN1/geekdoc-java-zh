  md: '# Programming the Line Runner


    Now that you have finished assembling the line runner, you need to program it
    to do something interesting. All the sensor ports on the Makeblock shield are
    mapped to Raspberry Pi GPIO pins, so we can control it just like any other device
    hooked up to the Raspberry Pi.


    We are going to use the Pi4J library since it has great support for pulsewidth
    modulation (explained later in the chapter), and we will also need the performance
    of the low-level API in order to get accurate results from the distance sensor,
    which uses microsecond timings.


    To prepare the Raspberry Pi for programming, set it up with a standard NOOBS image
    per the instructions in Chapter 1. You may also want to set up a Wi-Fi adapter,
    because attaching an Ethernet cable may be difficult once the Raspberry Pi board
    is mounted on the motor.


    The Raspberry Pi board can be powered directly off the six AA batteries that come
    with the Makeblock kit, so just insert your batteries and flip the switch on the
    Me Uno to turn on the Raspberry Pi. As you may want to invest in some rechargeable
    batteries, since running your robot will be an expensive proposition if you have
    to keep disposing of batteries after you accidentally leave it on.


    This section will walk you through the coding and testing of the motors, infrared
    controller, line follower module, and distance sensor. To follow along, you can
    download the code from the following GitHub-repo: https://github.com/RaspberryPiWithJava/LineRunner.


    # Makeblock/ARPI600 Pin Mappings


    Before we start coding for the Raspberry Pi, it is helpful to know which pins
    on the Raspberry Pi GPIO header correspond to which of the ports on the Makeblock
    shield. Since we are going through two different adapter boards, it can be a bit
    tricky to figure this all out, but fortunately the wiring schematic of both boards
    is documented fairly well.


    Table 5-1 shows the mapping of Arduino pins to Raspberry Pi pins using the Broadcom
    and Pi4J pin numbering schemes. In this project we are using the Pi4J library,
    so we only care about the first and third columns.


    Note that the Arduino pins marked A0 through A3 are only hooked up to the Raspberry
    Pi GPIO directly if you change the jumpers on the ARPI600. By default they are
    hooked up to an onboard analog-to-digital converter, which'
