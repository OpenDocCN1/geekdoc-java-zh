  md: '# Chapter 3: Binary Timer 65


    +   - Pins 3 and 5 are for I2C By default, the I2C bus is disabled and these pins
    can be used for GPIO. However, these have hard-wired internal 1.8k pull-up resistors
    to 3.3V.


    +   - Pins 8 and 10 are for Serial UART These pins are reserved for console serial
    communication by default, which needs to be disabled if you want to use them for
    GPIO or to connect to a serial device.


    +   - Pins 19, 21, 23, 24, and 26 are for SPI This is another communication bus
    for devices that is disabled by default, so these pins can be used for GPIO.


    +   - Pins 27 and 28 are for EEPROM These pins are designed for identifying add-on
    boards stacked on top of the Raspberry Pi and can be used for GPIO.


    Also, regarding pin numbering, it is important to note that there are several
    different ways to refer to the same GPIO pins, which can be very confusing:


    +   - Header pin order Sometimes the location of the pin on the P5 header is handy
    to know when connecting devices, but is rarely the number your program will use.


    +   - Broadcom GPIO pin number This is the most common numbering scheme, which
    matches the GPIO pinouts. However, since this depends on the wiring on the Raspberry
    Pi, the physical pin locations may change (which happened between revisions 1
    and 2 of the Model B board).


    +   - Pi4J/WiringPi numbers To to standardize on a simpler numbering scheme, the
    Pi4J and WiringPi libraries define an alternate set of numbers that is constant
    between different board revisions.


    In summary, know your pin assignments and be careful which numbering standard
    you are using. Since there is no overcurrent protection on the Pi, hooking up
    the wrong GPIO pins in your circuit can be disastrous, so wire once and check
    twice.'
