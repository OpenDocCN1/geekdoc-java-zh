  md: '# 14 Raspberry Pi with Java: Programming the Internet of Things


    Selecting Advanced Options brings up a submenu with the following

    additional options:


    +   - Overscan This allows you to enable or disable overscan. If you

    have a modern LCD, you can safely disable this and get a little

    more screen real estate at the edges of your monitor.


    +   - Hostname Feel free to change your hostname to be unique.


    +   - Memory Split The memory on the Raspberry Pi is shared between

    the CPU and the GPU. To improve performance of graphics-intensive

    applications, I recommend setting GPU memory to at least 128MB.


    +   - SSH This option is for Secure Shell, which is enabled by default,

    and is required for deployment of Java apps.


    +   - SPI This is general purpose input/output (GPIO) functionality that

    needs to be enabled for some of the example projects in later chapters.


    +   - I2C Another GPIO feature for managing a connected bus of

    devices, this option also needs to be enabled to support projects in

    later chapters.


    +   - Serial This enables shell access over serial, although you will

    disable it to free up the serial ports for a later project.


    +   - Audio This lets you force audio to go out over the HDMI or 3.5mm

    headphone jacks.


    +   - Update This updates the raspi-config tool to the latest version.


