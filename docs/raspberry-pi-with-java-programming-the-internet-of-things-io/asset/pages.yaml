    on the top and the connector pin numbers at the bottom. To fix the direction for
    motor sockets 9 and 10, you would put a jumper on pins D4 and D7, respectively,
    as shown in Figure 5-14. To make a more secure join on the connector pin, you
    should remove the existing solder first using a solder wick or solder vacuum and
    then do a fresh solder joint with the connector and jumper cable.'
