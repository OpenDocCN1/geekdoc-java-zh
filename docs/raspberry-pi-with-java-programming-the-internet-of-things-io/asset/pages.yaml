    All the model files are oriented correctly in Figure 9-8, with the exception of
    the left and right pins, which for best printing need to be rotated with the hexagonal
    nut facing downward. There is a rotation tool in the bottom-left corner of Cura
    that lets you do this easily. I also recommend printing these pins with at least
    80 percent infill to give them additional strength. Infill is the percentage of
    the area inside of solid geometries that will be filled with a crosshatch pattern.
    Printing with infill gives your parts additional strength, and usually 20 percent
    is sufficient for this purpose. However, the pins in this project are relatively
    small parts with high stress from the motion of the joint, so giving them 80 to
    90 percent infill will help prevent them from failing.'
