    # Setting Up Your Raspberry Pi A+


    Before getting started with this project, you will need to set up Raspbian on
    your Raspberry Pi A+ and connect it to a network via the Wi-Fi adapter. Chapter
    1 has full details on how to go through the installation process to prepare your
    Raspberry Pi for programming. However, since the Raspberry Pi A+ has only one
    USB port, you have to choose between hooking up a keyboard or the Wi-Fi adapter.
    This makes the initial Wi-Fi adapter setup a little tricky since you can''t scan
    for networks without the adapter present. Here are some ways to work around this
    limitation:


    +   - Use a USB hub to hook up your keyboard and Wi-Fi adapter simultaneously.
    Then, once you have established a remote SSH connection, you can remove the hub
    and use the Wi-Fi adapter exclusively.


    +   - Set up the SD card on a Raspberry Pi B, B+, or 2, and then transfer it over
    the Raspberry Pi A+. This allows you to take advantage of Ethernet networking
    and multiple USB ports during the setup process. Once you have SSH access working,
    you can simply swap the SD card into your Raspberry Pi A.


    +   - Manually add the wireless networks to your configuration. This is the most
    error prone option since a small typo in the configuration files can prevent the
    entire networking stack from loading. We will leave this in the category of possible,
    but not recommended options.


    Once you are able to get a remote SSH connection to your Raspberry Pi A+, you
    are ready to continue building the IoT Hat project.'
