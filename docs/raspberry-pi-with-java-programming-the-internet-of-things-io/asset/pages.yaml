    position for the button cables to come out from under the Kippah. Distributing
    them through several different holes will help to ensure that the Kippah lies
    flat on the Raspberry Pi.


    The next layer to add is the D-pad holder. This snaps in top of the Kippah and
    has an extra arm extension to keep the PowerBoost and power switch in position
    when the case is closed. Insert the five-way directional switch into the cutout.
    It should only fit in one direction, and it has some channels built in where you
    can route the cables as shown in Figure 9-25.


    On top of this is the final internal layer, which holds the Start, Select, A,
    and B buttons. Insert it into the case and pop the buttons into the matching slots.
    If you took my advice earlier and labeled the buttons, it should be easy to tell
    the A/B and Start/Select buttons apart. Be careful when inserting the A and B
    buttons, because they can only go in one orientation. The flat edges of the buttons
    are facing each other, as you can tell by looking at the shape of the cutout.
    This layer also holds the TS2012 amplifier board and speaker with nicely sized
    cutouts. The case with all the internal components packed in is shown in Figure
    9-26.


    Again, this is a good opportunity to test out the RetroPi before proceeding. Simply
    plug in the screen and turn on the power. Everything should work,


    ![](img/e10b78d76be679e70031ec7a27b91e4a_304_0.png)


    FIGURE 9-25. D-pad holder'
