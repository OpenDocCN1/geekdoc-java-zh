  md: "# 184 Raspberry Pi with Java: Programming the Internet of Things\n\nNotice\
    \ that sometimes you get more than one result returned in a single callback, and\
    \ other times you only get part of a line with results split across multiple calls.\
    \ The reason for this is that the continuous autoprint rate of the scale and the\
    \ default Pi[4] buffering duration are not in perfect sync. To work around this\
    \ you can use a String as a buffer to hold on results until you have a full line\
    \ of data. Listing 6-3 shows a modified version of the SerialDataListener that\
    \ produces exactly one result per line.\n\n# Listing 6-3 Modified version of the\
    \ SerialDataListener\n\n```\nstatic String data = \"\"; // this line goes outside\
    \ the main method\nserial.addListener((sde) -> {\n    data = data.concat(sde.getData());\n\
    \    String[] measurements = data.split(\"\\r\\n\", -1);\n    for (int i=0; i<measurements.length\
    \ -1; i++) {\n        System.out.println(measurements[i] = \" \" + measurements[i]);\n\
    \    }\n    data = measurements[measurements.length - 1];\n});\n```\n\nThis code\
    \ takes advantage of the split method on String, which returns a String array\
    \ based on splitting the String around the regular expression matches. By matching\
    \ on the carriage return/linefeed characters (\"\\r\\n\"), we are able to split\
    \ on whole lines. The second argument of -1 results in the String being evaluated\
    \ (and split) as many times as necessary to process the entire string.\n\nRunning\
    \ the SerialScaleTest class with the new code will clean up the output so there\
    \ is exactly one result per line, which makes it much easier to see what is going\
    \ on. An example of what the output should look like is shown in Listing 6-4.\n\
    \n# Listing 6-4 Output from the new SerialDataListener\n\n| measurements[i] =\
    \ 0.0 g |\n| measurements[i] = 0.0 g |\n| measurements[i] = 0.0 g |\n| measurements[i]\
    \ = 35.1 g |\n| measurements[i] = 93.1 g |\n| measurements[i] = 109.8 g |\n| measurements[i]\
    \ = 111.7 g |\n| measurements[i] = 111.9 g |\n| measurements[i] = 111.9 g |\n\
    | measurements[i] = 111.9 g |"
