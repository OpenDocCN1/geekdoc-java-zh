    utilizing GPIO to create a custom controller. In this chapter you can continue
    the project by adding rechargeable power circuitry and encasing it in a 3D printed
    enclosure that is reminiscent of classic portable gaming systems.


    Before starting this chapter, you should assemble and test all the components
    in the Chapter 8 project, which will serve as the foundation of your portable
    gaming system. You will also need some additional hardware and access to a 3D
    printer in print the case. However, this will be worth the investment in time
    and tooling to create a portable system that you can call your own and customize
    to show off your creativity.


    # Bill of Materials


    You will need all of the recommended hardware from Chapter 8. Since the case is
    fairly specialized, you should ensure that you have chosen the same models of
    components that were specified. Any substitutions of parts will require a substantial
    redesign of the case.


    # Power Supply


    For the power source, we are going to use the PowerBoost 1000 Charger from Adafruit.
    This is a clever device that packs a voltage converter and lithium-ion (li-ion)
    battery charging into a very small form factor. It is capable of providing a steady
    5V 1000+mA power signal off of a 3.7V rechargeable li-ion battery.


    You will need to purchase the following components:


    +   - PowerBoost 1000 Charger - Rechargeable 5V Lipo Boost @ 1A https://www.adafruit.com/products/2465

    - Lithium Ion Battery Pack - 3.7V 4400mAh https://www.adafruit .com/products/354

    - Two Breadboard-Friendly SPDT Slide Switch https://www.adafruit .com/products/805


    Similar to my advice in Chapter 8, I recommend getting a couple of the switches
    in case one breaks from wear and tear or if you accidentally damage'
