  md: '# Connecting to the Raspberry Pi via NetBeans to Remotely Deploy the Java Application
    and Supporting Libraries


    You already should have a connection established from NetBeans to your Pi, but
    if not, please review the steps provided in previous chapters to configure the
    JDK on your Pi as a remote JDK. Once this is in place, simply running (or debugging)
    your application from within NetBeans (with the Pi''s remote JDK selected) will
    deploy the application and all supporting libraries to the Pi.


    # Flying the Drone by Invoking the Java Application


    For our inaugural flight, let''s use the A4JMain.java file as it appears in the
    code distribution available with this book. The flight behavior is programmed
    to take off, hover, blink some LEDs, and land.


    The simplest way to do this is to run the application from within NetBeans, allowing
    it to deploy and execute the app remotely. This allows you to remain connected
    during the program''s execution, even remotely debugging or profiling it “live,”
    while the program executes fully on the Pi itself. Of course, you can also choose
    to execute it directly on the Pi—external to NetBeans—by connecting to the Pi
    via ssh, navigating to the deployment directory (usually /home/pi/NetBeansProjects/<program_name>/dist/),
    and running the usual java -jar command.


    After you''ve flown a couple of successful missions, go ahead and experiment by
    editing A4JMain.java to modify the flight behavior. Following the previous instructions,
    download the modified code into the Raspberry Pi, and invoke the application.
    Have fun!


    # Achieving Greater Degrees of Autonomy


    Now that you''ve successfully built and tested the project, let''s discuss a potential
    enhancement that you could make to the autonomous4j library to make the drone
    smarter. As you''ve seen in this project, many of the flight control methods allow
    the drone to fly in a given direction, at a given percentage of power, for a given
    period of time. This demonstrates a basic level of autonomy, but you may have
    noticed that the drone doesn''t'
  merge: -1
