    > > NOTE

    Notice that all the quantities are identical! Variation in amount of tea is a
    side effect of different densities by style of preparation. In this chapter we
    will use the ISO 3103 standard of 2 grams per 100ml of water.


    As you can see, the temperature used for different varieties of tea is an extremely
    important part of brewing tea, and an essential part of our tea station setup.


    # 1-Wire Serial Interface


    The temperature sensor for this section is a DS18B20 digital sensor. It uses the
    Dallas 1-Wire serial protocol for device communication that was developed by Dallas
    Semiconductor Corporation and is used by a wide range of sensors and devices.
    The Dallas 1-Wire protocol is similar to the serial communication we used in the
    previous section, but trades communication speed for a few unique advantages that
    are helpful for sensors. Some of the unique aspects of 1-Wire include


    +   - Devices can be connected with only two wires. One wire is used for communication
    and intermittent power and the other is used for ground return. (The temperature
    sensor we are using in this chapter has a third wire for dedicated power.)'
