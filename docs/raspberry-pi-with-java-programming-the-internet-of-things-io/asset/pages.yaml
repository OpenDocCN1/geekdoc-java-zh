  md: '# Raspberry Pi with Java: Programming the Internet of Things


    My first design was a friction-fit cylinder where I kept the tolerances tight
    enough that opening and closing the screen required some force. The close tolerances
    made it extremely difficult to assemble (I broke a few in the case) in the process),
    and while it initially provided a good mechanism, once the hinge was worn in (around
    50 so open and close movements), the screen would flop down on it. Upon inspecting
    the socket and pin, I found visible wear on, indicating the material would smooth
    out over time.


    My second design was a 24-sided polygon where the screen would have an audible
    and tactile click as locked in different positions about 11 degrees apart. This
    worked reasonably well, but it did not pass the kid test. I left it on my daughter''s
    desk for her to play with, and (other than the first prototypes actually breaking
    due to stress points in the case) she was able to make the polygon a perfectly
    smooth circle after opening and closing it rapidly. It is a general problem with
    plastic designs that have sharp edges that come in contact: after a while the
    sharp edges rounded.


    I came up with the third and final design after watching my daughter play her
    Nintendo console. I noticed that the screen really needed to lock in two positions:
    fully closed and two-thirds open. Therefore, if I could come up with a hinge that
    would lock in these open and close positions, that would work. The other attribute
    I attributed to modeling in plastic is that, while sharp edges do not last, the
    plastic has a reasonable tolerance for stretching and returning back to the original
    position.


    Based on my observations, I came up with the pin shape that you see in Figure
    9-5. It looks kind of a rounded Reuleaux triangle and is created by connecting
    the vertices of two concentric triangles with spline curves. By changing the relative
    size of the triangles by fractions of a millimeter, a small amount of friction
    is created when the pin is rotated out of one of the three "happy" positions.
    Given the freedom of motion on the hinge, only two of these positions are possible,
    which I lined up to fall on fully closed and two-thirds open.


    Even with the new design, it took a lot of trial and error to get the tolerances
    right. I tried two different approaches to test the hinge. The first was an empirical
    approach, where I printed a bunch of hinges and destroyed them with pliers, as
    shown in Figure 9-6.


    The second approach was a mathematical approach, where I did interference analysis
    on the pin and hinge to optimize for maximum surface'
