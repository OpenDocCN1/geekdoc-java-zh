  md: '# Raspberry Pi with Java: Programming the Internet of Things


    What Is the Worst You Can Do to Your Raspberry Pi?

    Raspberry Pis are actually pretty reliable, and despite my best efforts going
    through around 100 Raspberry Pis, I have only had a couple go bad. There are a
    few things that I wouldn''t recommend doing, though none of them damaged my hardware:


    +   - Ejecting the SD card while it is running This immediately unmounts your
    entire filesystem and can cause minor filesystem corruption. Usually recoverable.

    - Shorting 3V to ground Not such a good idea, but about all it does is overload
    and reset your Pi.

    - Full immersion in coffee I had the good sense to do this when it was powered
    off, and to rinse it in distilled water and fully dry it before turning back on.
    It is still working to this day.


    # Device I/O Library Test


    To demonstrate how to use the Device I/O library for output, we are going to blink
    a light-emitting diode (LED). This is a great way to test out your GPIO pins since
    it is a visible device that can be powered by the current from the pins.

    Connecting an LED to the Raspberry Pi GPIO pins just requires a few jumper cables.
    To prevent the LED from being overloaded, we also need a resistor that we can
    hook up serial.

    To choose an appropriate resistor, you will need to know the voltage drop and
    target current of your LED. This depends on the manufacturer, type, and even the
    color of your LED. However, 99 percent of the LEDs you will encounter in hobby
    electronics can take a 20mA current with no problem, and will have a forward voltage
    varying from 2V to 3V.

    Since the Pi pins operates at 3.3V, you can calculate the maximum resistance using
    Ohm''s law: voltage (V) = current (I) x resistance (R). Here is an example based
    on the worst-case scenario of a 2V forward voltage and a 20mA current limit:


    ```

    V = I x R

    R = V / I

    R = (3.3V - 2V) / .02A

    R = 65Ω

    ```'
