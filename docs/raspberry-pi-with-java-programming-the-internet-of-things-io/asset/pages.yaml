  md: '# 62 Raspberry Pi with Java: Programming the Internet of Things


    # NOTE


    Make sure the JAVA_HOME path is correct for your installation of Java. If you
    need help with locating your JDK 8 installation directory, refer to Chapter 2.


    Next, install it into the local Java Runtime Environment (JRE):


    ```

    sudo cp -r build/deviceio/lib/* $JAVA_HOME/jre/lib

    ```


    You will also need the libraries for your project. To do this you can use any
    Secure Copy (SCP) or Secure FTP (SFTP) client, such as Cyberduck. However, real
    geeks will do it from the command line (this works out of the box in OS X or Linux).
    Unlike the other commands, this one must be run from your desktop or laptop that
    is connected to your Raspberry Pi:


    ```

    scp pitimerpi.local:~/dio/build/deviceio/lib/ext/dio.jar dio.jar

    ```


    # NOTE


    Substitute your PI IP address or hostname for timerpi.local. Also, this command
    assumes that the dio folder was created in your user home directory on the Raspberry
    Pi. If not, adjust the path as appropriate.


    To use the Device I/O library in your project, create a new Java project called
    DioLed in NetBeans (see Chapter 2 for more details on this) and add dio.jar as
    a compile-time library. To access the library settings, choose File | Project
    Properties (RoleId), click Libraries in the Categories pane, and make sure the
    Compile tab is selected. Then click Add/Folder and choose the dio.jar file you
    copied over from the Raspberry Pi. The configured project is shown in Figure 3-1.


    # Device I/O Pin Assignments


    The Java Device I/O library uses the standard GPIO port assignments as specified
    by the Motorola Broadcom chipset. Figure 3-2 shows a full list of all the ports,
    their numbers, and what their functions are for the Raspberry Pi B+, A+, and 2.'
