    # Creating a GPIO Controller


    Probably the most important aspect of a portable gaming system is the comfort
    of the controller for ergonomics and long-term playing. If the controller buttons
    are too stiff or feel mushy when you press them, you are unlikely to pick it up
    again.


    Most controllers use rubber switches that are layered on top of a custom circuit
    board. This is actually the technology used in most computer keyboards and works
    if you can print your own circuit board and manufacture rubber domes in the right
