    # Precise Measurement with a Serial Scale


    The advantage of using a scale that communicates over a serial protocol is scales
    designed for this purpose typically have much higher accuracy and allow for bidirectional
    communication. With a little bit of work we can get our Raspberry Pi to interface
    with scales like this.


    To utilize a serial scale in our application we need to fix a few things first.
    Serial devices communicate using the RS232 standard, which operates on different
    voltages than the TTL that the Raspberry Pi uses. The Raspberry Pi Java libraries
    work better with 8-bit serial communication. Finally, we need to update our Raspberry
    Pi application to communicate using the serial protocol for our device.


    The instructions in this section assume you are using one of the recommended Ohaus
    serial scales, but you can use any scale of your choice with some modifications
    for the serial protocol used by the manufacturer.


    # Connecting the Serial Scale


    It is a good idea to test the scale in isolation first to make sure it is working
    correctly. Both the Scout Pro and Valor 7000 come with an A/C adapter, which is
    useful while testing so that you can leave the scale running without worrying
    about draining your batteries. If the scale came with a test weight, as shown
    in Figure 6-4, weigh that to test the calibration. If not, a good approximation
    is to use a measuring cup with milliliter markings. You can test different volumes
    of water to make sure the scale is reading values accurately.'
