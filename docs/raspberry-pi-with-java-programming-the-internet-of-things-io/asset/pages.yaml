  md: '# NFC/RFID Support

    on the Raspberry Pi


    Hooking up an NFC/RFID card reader to your Raspberry Pi and accessing it

    from Java should be as easy as pie ... well, cake. Unfortunately, it is a little

    bit more complicated than either of those.


    Java actually has built-in support for reading NFC and RFID cards for

    quite a while. The original specification was defined by the Java Specification

    Request (JSR 268) and was called the Java Smart I/O API. It has been

    part of the Java SE releases on desktop since Java 1.6 was released on

    December 11, 2006, and it works exactly the same on the ARM port of Java

    SE, including the Raspberry Pi.


    Being built originally for desktop platforms, the specification assumes that

    there are drivers installed for the target smart card reader and these drivers

    expose the devices via the Personal Computer/Smart Card (PC/SC) specification.

    Microsoft first made this specification available on Windows XP, and a free

    implementation called PC/SC Lite is available on Linux and other Unix platforms.


    However, rather than using a packaged device that communicates with the

    smart card reader chip, we can bypass this and directly communicate with

    the chip via the GPIO pins on the Raspberry Pi. This allows us to interface

    with the card reader chip on a much lower level, allowing us to cut out

    unnecessary hardware to create a more compact and energy-efficient design.


    The chip we are using three different embedded protocols: I²C,

    SPI, and UART (serial). I will show you how to use all of these protocols

    al the way.


    # Configuring Your Raspberry Pi

    for I²C, SPI, and UART


    There are several different protocols that we can use to connect to the

    NFC/RFID card reader. However, by default Raspbian disables all the

    communication buses, including I²C, SPI, and UART. Even though you

    will only need to choose one of these protocols to use for this project, I

    recommend enabling all of them. It will be helpful for other devices that

    require the communication buses, and give you more options in case you

    can''t get one of the protocols to work.


    To enable these buses, the easiest mechanism is to use the raspi-config

    command-line utility. It provides a console GUI with which to turn on and off

    each of the communication protocols.'
