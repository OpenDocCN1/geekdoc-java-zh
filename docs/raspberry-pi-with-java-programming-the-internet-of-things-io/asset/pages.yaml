- img_proc: true
  md: 'always fly and land exactly where instructed. For example, air currents in
    the room can cause the drone to drift off course. A good next step for improving
    this would be to implement a way for the drone to know its position in three-dimensional
    space so it can make course corrections.


    # Orienting the Drone in 3D Space


    The Parrot AR Drone 2.0 comes with a cardboard “oriented roundel,” shown in Figure
    7-6.


    The purpose of the oriented roundel is for the drone to recognize it in its downward-facing
    camera. The AR Drone can report information about what portion of the camera lens
    contains the oriented roundel. Given that information, the client (in our case
    the Raspberry Pi brain) could calculate its position in 3D space relative to the
    oriented roundel.


    # Implementing a Control Loop


    If the drone knows where it is in 3D space, then it can know when it is off course.
    A control loop, such as the one represented in Figure 7-7, could be implemented
    to keep the drone on course. This loop would iteratively:


    +   1. Estimate its position in space


    +   2. Compare that position with the desired position


    +   3. Calculate and apply control with the goal of arriving at the desired position


    ![](img/e10b78d76be679e70031ec7a27b91e4a_248_0.png)


    FIGURE 7-6. Oriented roundel'
