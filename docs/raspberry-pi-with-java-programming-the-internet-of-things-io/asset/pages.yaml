  md: '# Chapter 8: Retro Video Game Emulator 253


    # # Emulating the NES


    To do the actual NES emulation, I started with the great Java-based NES emulation
    library called halfNES, written by Andrew Hoffman. Andrew did a great job building
    an emulator from the ground up with a particular focus on accurate emulation.
    Most of the emulators that are known for their high performance results by implementing
    per-game hacks instead of focusing on correctness of the emulator implementation.
    With over 800 games available, this makes the emulator codebases complex and unapproachable
    since you are not sure which game depends on various little hacks.


    In contrast, Hoffman''s halfNES codebase is relatively short and simple to understand—and,
    of course, a little bit on the slow side. It is not slow for modern desktops,
    but on a 900-MHz ARM chip, even four cores don''t seem enough. Fortunately, with
    a little bit of tuning, his codebase works great on the Raspberry Pi 2 (and runs
    acceptably on the older Raspberry Pi B+).


    # # Running the Emulator


    Start by grabbing the forked emulator code from here:


    https://github.com/RaspberryPiWithJava/halfnes


    This codebase is derived from Hoffman''s mainline code development, with a particular
    focus on performance and features that make it playable on the Raspberry Pi. Just
    as with previous examples, open the codebase in NetBeans to compile and run it.


    There are two main classes that you can choose to run:


    +   - com.grapeshot.halfnes is the original Swing UI that needs to be run in X-Windows.


    +   - com.grapeshot.halfnes.JavaFXNES is a JavaFX-based version that runs in a
    direct framebuffer.


    Both work and have been aggressively tuned for the Raspberry Pi, but the JavaFX
    version turns out to be faster, so I will provide instructions for that specifically.'
  merge: -1
