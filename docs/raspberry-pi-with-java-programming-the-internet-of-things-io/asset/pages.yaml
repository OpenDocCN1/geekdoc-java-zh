    # Raspberry Pi


    You will, of course, need a Raspberry Pi. I recommend the Raspberry Pi 2, because
    the extra performance from the ARM7 quad-core chip is extremely helpful in gaining
    accurate emulation of the NES in Java. Also, don''t forget the SD card and power
    adapter to go along with your Raspberry Pi.


    > NOTE

    You can also use a Raspberry Pi B+, although you may see some slowdowns in emulation.
    The Raspberry Pi A+ also works, but will require a case redesign. Older Raspberry
    Pis without the 40-pin connector will not work for this project because they do
    not support the Kippah display described in the following section.


    # Display and Adapter


    The Adafruit Kippah is a very cool touchscreen adapter board that utilizes the
    GPIO pins to directly communicate with an LCD display. Compared to the HDMI touchscreen
    displays recommended in Chapter 6, the Kippah is more compact and power efficient
    since it does not require extra circuitry'
