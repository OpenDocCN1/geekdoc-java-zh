  md: '# Chapter 3: Binary Timer 67


    Therefore, you should be pretty safe using a common 68Ω resistor for most LEDs
    plugged into the Raspberry Pi. It is not unusual to use larger resistors to reduce
    power consumption in embedded projects, so feel free to use bigger ones. However,
    remember that this will reduce the brightness of your LEDs.


    # TIP


    Some LEDs are more resilient to current spikes than others, and will work fine
    when connected directly, even if the LED works, connecting it directly is a great
    way to shorten its life, so it is always recommended to pair your LED with a suitable
    resistor.


    You can tell the value of a resistor by the colored bands and a lookup chart.
    Most resistors have four to five bands, with the three closest together being
    the actual resistance value, and the final band being the tolerance. For the 68Ω
    resistor we calculated, the colors would be blue, gray, black. You could get up
    to a 5 percent tolerance resistor and still be fine, which would be four, gold
    band. To quickly look up resistors by color code, the easiest way is to use a
    web calculator like this one from DigiKey: www.digikey.com/en/resources/conversion-calculators/conversion-calculator-resistor-color-code-4-band.


    For our circuit diagrams in this book, we are going to use the open-source layout
    application (http://fritzing.org/). This tool was originally designed by the Interaction
    Design Lab at the University of Applied Sciences Potsdam, Germany, and is a great
    way to do your own circuit designs with a huge library of components from different
    online vendors, as well the ability to design simple printed circuit boards (PCBs)
    for fabrication. Figure 3-3 shows a simple circuit diagram built using the Fritzing
    layout application.


    This is a simple circuit with a resistor, LED, and some wires. Note that LEDs
    have a positive side and a negative side, usually indicated by the positive lead
    (the anode) being slightly longer than the negative lead (the cathode). If you
    hook up the LED backward, it won''t damage it, but it won''t light up either,
    so make sure that you hook up the longer end to the GPIO pin.


    ![](img/e10b78d76be679e70031ec7a27b91e4a_84_0.png)'
