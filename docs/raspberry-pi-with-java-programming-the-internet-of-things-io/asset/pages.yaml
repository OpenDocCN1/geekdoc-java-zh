  md: '# 116 Raspberry Pi with Java: Programming the Internet of Things


    # NFC Library Configuration


    We are going to use libnfc to interface with the NFC reader. This supports low-level
    access to a bunch of different NFC chips. In addition we will use the PC/SC smart
    card interface, which Java requires. And to connect the two, we will use ifnfc
    to use the libnfc devices as PC/SC devices in Java.


    # Compiling and Installing libnfc


    Unfortunately, none of these libraries come prebuilt with the Raspian distribution,
    so you will have to build them from source. To start with, you should make sure
    your repository is up to date with the latest versions of Raspian software available.
    To do this, run the following commands:


    ```

    sudo apt-get update

    sudo apt-get upgrade

    ```


    The second command is optional and may take a long time depending on how out-of-date
    your Raspian installation is. However, it will ensure your Raspberry Pi is on
    the latest version of all the installed software, which is a good thing to do
    when setting it up.


    The next step is to get libusb-dev, which you will need to compile libnfc. You
    can obtain it by using the package manager like so:


    ```

    sudo apt-get install libusb-dev

    ```


    Then download and uncompress the libnfc source code to your home directory by
    using the following commands:


    ```

    cd

    wget http://dl.bintray.com/nfc-tools/sources/libnfc-1.7.1.tar.bz2

    tar -xf libnfc-1.7.1.tar.bz2

    ```


    This gives you the full source code for the libnfc project, which you can configure
    by doing the following:


    ```

    cd libnfc-1.7.1

    ./configure --prefix=/usr --sysconfdir=/etc

    ```


    You will know this is successful when it gives you a list of the drivers for which
    it will compile support, as shown in Listing 4-1.'
