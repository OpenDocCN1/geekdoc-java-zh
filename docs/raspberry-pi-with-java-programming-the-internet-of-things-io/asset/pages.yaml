  md: '# Chapter 8: Retro Video Game Emulator 251


    To make it easier to fit in the 3D printed case, I recommend skipping the headers
    and jacks and simply soldering directly on the board. Here are the connections
    you will need to make:


    +   - VDD Connect this to the Raspberry Pi’s 5V line via the Kippah.

    - GND Connect this to the Raspberry Pi’s Ground via the Kippah.

    - R+ This goes to the red lead from the audio cable.

    - R- This goes to the bronze lead (ground) from the audio cable.

    - SDL Connect this to the Raspberry Pi’s Ground line as well.

    - Right speaker +/- Connect these leads to the mini .5W speaker.


    For this soldering I recommend using the board holder and helping hands to keep
    the TS2012 breakout board and cables lined nicely. The speaker is easy to hook
    up, and the order of the +/- connectors doesn’t matter since we are connecting
    only one speaker. The only tricky part with this is that the cables are a little
    thin and flimsy, so be prepared to desolder them and replace them with regular
    hookup wire if they break.


    Make sure to keep the stereo ground and Raspberry Pi ground distinct. The stereo
    ground comes from the 3.5mm cable pigtail end and should go to the R- jack. The
    Raspberry Pi ground comes from the third ground pad on the Kippah board that we
    left open and should go to the pins labeled GND and SDL. The reason for tying
    SDL to ground is to disable the left speaker and save power.


    You might be wondering what the jumpers on the bottom of the board are for. They
    let you control the audio volume in rough increments from 6db to 24db. Table 8-2
    lists the different jumper settings and what volume they correspond to. I recommend
    starting at 6db and incrementing it up until it is loud without any noticeable
    humming or clipping.'
