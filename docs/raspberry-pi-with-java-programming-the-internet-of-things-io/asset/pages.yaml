  md: "# Donning the Kippah\n\nBefore hooking up the Kippah to the Raspberry Pi, we\
    \ need to do a little work to prepare it. We need to reroute the GPIO ports to\
    \ control the LCD screen via a device tree overlay, and we need to disable other\
    \ functions that utilize the GPIO ports, such as IC and SPI. Also, we need to\
    \ tweak the 4.3-inch touchscreen we are using to fix the overscan. Finally, we\
    \ are going to flip the screen upside down to better fit the connectors inside\
    \ the case.\n\nTo install the device tree, grab the latest version of Adafruit's\
    \ share:\n\n```\nwget http://adafruit-download.s3.amazaws.com/dt-blob.bin\n```\n\
    \nThen, copy it to the /boot folder using root privileges: \n\n```\nsudo cp dt-blob.bin\
    \ /boot/\n```\n\nIn the same folder, edit config.txt using the nano text editor:\n\
    \n```\nsudo nano /boot/config.txt\n```\n\nTo the end of this file, add the additional\
    \ configuration options shown in Listing 8-1.\n\n# Listing 8-1 Configuration for\
    \ the Kippah screen\n\n```\n# Disable spi and i2c, we need these pins.\ndtparam=spi=off\n\
    dtparam=i2c_arm=off\n# enable DPI display\nenable_dpi_lcd=1\ndisplay_default_lcd=1\n\
    # For 4.3in displays\nhdmi_ignore_edid=0xa5000080\nhdmi_ignore_edid_audio=1\n\
    framebuffer_width=480\nframebuffer_height=272\ndpi_output_format=520197\n# Flip\
    \ the screen\ndisplay_rotate=2\n# And adjust overscan as necessary\ndisable_overscan=0\n\
    overscan_top=150\noverscan_left=160\noverscan_right=0\noverscan_bottom=-59\n```"
