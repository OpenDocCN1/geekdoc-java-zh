  md: "# Chapter 3: Binary Timer 99\n\nSysfs access (/sys/class/gpio/) This is a higher-level\
    \ API that allows for access to only GPIO in a safer, easier way. Since it is\
    \ less direct, it is also a little slower, but it has the advantage of not requiring\
    \ root access.\n\nPi[4] usually requires root access because it prefers memory-mapped\
    \ access to GPIO pins (although it does have the ability to use sysfs access without\
    \ root permissions). Device I/O exclusively uses filesystem access for all GPIO.\n\
    \nAn easy way to compare these two methods of access is to modify our earlier\
