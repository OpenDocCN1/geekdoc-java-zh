  md: '# Chapter 6: Tea Station 167


    environments, such as adjustable legs, bubble levels, and hooks to hang weights.
    However, for this project, the only features that matter are


    +   **Weight range** Choose a scale that can weigh the heaviest object you require.
    For this project you will need something that can hold at least one cup of tea,
    including the container. For this I recommend a scale with at least 600g capacity,
    which is just enough for a full one-cup glass infuser.


    +   **Accuracy** Since tea is very light, a scale with precision to 0.1g is ideal.
    A scale any more precise than that is going to cost a lot more and you''ll likely
    never need the additional accuracy.


    +   **Serial support** You will need to interface with the Raspberry Pi, by having
    a well-documented serial interface is important. Before buying a scale, make sure
    to read the serial protocol document to make sure that it can support standard
    8/N/1 serial (8 data bits, no parity, 1 stop bit). It is possible to use other
    protocols, but in my experience the Java libraries do not support them well.


    The scale manufacturer I am going to recommend and code for this chapter is Ohaus,
    which makes a wide variety of scientific and industrial scales and has a consistent
    serial protocol across its entire product line. Here are some of the models I
    have tested and known to work with the Raspberry Pi:


    +   **Scout Pro** This is Ohaus''s portable scientific scale line. It comes in
    a variety of different models, enabling you to choose the weight range and accuracy.
    As far as scientific scales go, it is also fairily inexpensive, with some educational
    discounts if you are a teacher or student (the Scout Pro is widely used in schools).
    The only downside is that you will have to purchase the serial interface kit separately,
    which is the pricey side for what you get. The recommended scale models are the
    SP601 (least expensive), SP2001, SP4001, and SP6001.


    +   **Valor 7000** This is designed as a food-grade scale, so it may be harder
    to find being sold compared to the more ubiquitous Scout Pro. However, it has
    a pretty nice weight range, with one model capable of handling 3kg at 0.1g accuracy
    (V71P3T). Also, it comes with a built-in serial port, saving you the trouble and
    extra cost of buying a serial interface kit. This is sold as a “compact” scale,
    but it is pretty large, make sure you have the available counter space.'
