  md: '# Raspberry Pi with Java: Programming the Internet of Things


    The last step is to restart the PC/SC daemon and activate the ifdnfc agent.

    The following two commands will do this:


    ```

    sudo /etc/init.d/pcscd restart

    ifdnfc-activate

    ```


    > NOTE

    The ifdnfc agent does not automatically start on boot, so you will need to rerun
    this command each time you start up your IoT Hat. To make this more convenient,
    you may want to set up a launch agent to boot this on startup.


    You now have prepared everything at the operating system level to enable smart
    card access directly from Java. The next section explains in detail how to use
    the smartcardio library to read RFID cards as they are scanned.


    # Reading Cards from Java


    The previous section demonstrated how to set up the underlying libraries and infrastructure
    to interface with an NFC/RFID smart card reader. Now you are ready to create a
    Java application to read the card using the smartcardio API that is already part
    of the JRE.


    All the code in this section is available in the GitHub repository for the book.
    Feel free to follow along by downloading the code in the repository:


    https://github.com/RaspberryPiWithJava/loTHat


    The code fragments shown assume that you are importing the correct classes from
    the javax.smartcardio package. Since this is a standard package on both desktop
    and embedded versions of Java SE, you don''t need to download or link to any external
    JAR files in order to use the functionality.


    To open a new connection to a smart card reader, you need to first open a CardTerminal
    to the specific smart card reader that you want to access. Since you are in control
    of the hardware, you can guarantee that you will always have exactly one smart
    card reader hooked up to the Raspberry Pi, so you can safely choose the first
    terminal in the list as shown in Listing 4-5.'
