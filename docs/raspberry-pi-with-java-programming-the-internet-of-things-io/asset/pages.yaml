    # # Line Following


    Makeblock Me Line Follower is a simple board that comes with two infrared LEDs
    and two IR photodiodes mounted in pairs to make two photocouplers. When the infrared
    light bounces off the ground it will either be reflected if the surface is light
    or absorbed if the surface is dark. The photodiodes when they are exposed to infrared
    light the resistance decreases, allowing us to detect the presence of a reflective
    surface. For white and black surfaces the sensor is extremely reliable when used
    at a distance of 1-2 centimeters from the ground.


    Using the two photo-couplers allows us to quickly follow a line without any “hunting.”
    For a black line on a white surface, a single sensor would only tell us if we
    were on the line or off the line, but not the direction in which we went off the
    line. However, with two sensors mounted perpendicularly to the surface, we can
    tell the direction of the line by seeing which sensor goes off the line first.
    If the rightmost sensor goes off the line first, the robot likely'
