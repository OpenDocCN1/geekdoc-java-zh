  md: '# Chapter 1: Baking Pi 17


    # TIP


    The Raspberry Pi Ethernet adapter includes auto-MDIX to detect and fix cable types,
    so you can use either a crossover cable or a more common straight Ethernet cable
    to connect devices.


    The easiest way to accomplish this is to assign static IP addresses to both your
    computer and the Raspberry Pi so they are both in the same subnet. A common local
    subnet to be 192.168.x.x, which is one of the reserved subnets for local area
    networks. The configuration on your desktop computer will look something like
    Figure 1-8 for OS X or Figure 1-9 for Windows.


    On the Raspberry Pi you will need to modify the cmdline.txt file in the boot loader.
    To do so, log in to the Raspberry Pi with the following command:


    ```

    sudo nano /boot/cmdline.txt

    ```


