    \ a refractometer to measure the TDS in your coffee brew, selecting the line corresponding\
    \ to your brew ratio, and solving for the extraction ratio. This lets you empirically\
    \ measure the effects of grind coarseness, water temperature, and steeping time\
    \ on the extraction rate. However, to keep things simple, we are going to use\
    \ the chart as a guide to recommend a dosing weight of coffee for a given number\
    \ of cups of coffee. This is an important starting point for brewing a cup of\
    \ coffee that falls in the Optimum Balance region of the chart.\n\nOur target\
    \ density for a “normal” cup of coffee will be 55g/L, which gives the highest\
    \ chance of hitting the SCAA's optimum balance for a given extraction percentage.\
    \ There is also a Special Coffee Association of Europe (SCAE) that recommends\
    \ the 18–22 percent extraction rate, but moves the optimum strength to 1.2 percent\
    \ to 14.5 percent solvent concentration. This will define our “rich” cup of coffee\
    \ at 58g/L. Finally, the Norwegian Coffee Association further moves the optimal\
    \ strength up to 1.3 percent to 1.5 percent solvent concentration, for which we\
    \ will define our “strong” cup of coffee at 62g/L.\n\nListing 2-8 CoffeeCalculator\
    \ class that takes these principles and turns them into code that will help us\
