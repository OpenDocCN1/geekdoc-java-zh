    # Infrared Controller


    To make it easier to control the robot, we are going to set up the infrared remote
    that comes with the Makeblock kit. It connects via an infrared receiver that provides
    commands over a serial interface to indicate what button is pressed. The serial
    pins are wired through to the Raspberry Pi’s serial pins on both shields, so we
    can use normal hardware serial to interface with the infrared receiver.


    Here is how you set up serial in Pi4:


    ```

    Serial remote = SerialFactory.createInstance();

    remote.open(Serial.DEFAULT_COM_PORT, 9600);

