    # Assembling the RetroPi


    Now that you have all the 3D printed parts ready, it is time to assemble the case
    with the Raspberry Pi and electrical components from Chapter 8. In addition, make
    sure you have the PowerBoost charge circuitry, li-ion battery, and power switch
    specified in the “Bill of Materials” section earlier in this chapter.


    # Direct Wire Audio


    In Chapter 8 we used a right-angle audio connector to hook up audio to the Raspberry
    Pi. Unfortunately, the case doesn''t have enough room for the bulky jack, so we
    have to wire the audio terminals directly to the Raspberry Pi.


    To do this, flip the Raspberry Pi over so you are facing the bottom, and then
    put it in your board holder to hold it steady. The two plates you want to connect
    to are marked PP26 for the right channel and PP6 for ground. Cut a couple wires
    around 10 to 12mm long and solder them onto the marked terminals. They are shown
    in Figure 9-11 with cables already attached to them.


    ![](img/e10b78d76be679e70031ec7a27b91e4a_293_0.png)


    FIGURE 9-11. Direct wiring of audio terminals'
