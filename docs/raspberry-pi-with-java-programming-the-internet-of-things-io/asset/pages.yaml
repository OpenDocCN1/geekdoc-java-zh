    \ threads to time out, which can take up to 30 seconds.\n\n+   - There are no\
    \ exceptions in the Pi4J version! Pi4J doesn't throw Exceptions that we have no\
    \ idea how to recover from (thankfully!) Also, rather using Thread.sleep, there\
