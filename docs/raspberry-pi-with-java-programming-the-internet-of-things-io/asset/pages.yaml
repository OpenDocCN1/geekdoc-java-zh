  md: '# Raspberry Pi with Java: Programming the Internet of Things


    Raspberry Pi 2, the following values specified in /boot/config.txt are stable
    and provide enough horsepower to reach about 60fps on the emulator.


    ```

    #overclocking

    arm_freq=1050

    over_voltage=4

    core_freq=525

    gpu_freq=350

    sdam_sdram=2

    over_voltage_sdram=2

    ```


    The main risk with overclocking is that you can corrupt your SD card during boot
    if it fails to load. Either having a backup copy to fall back on or setting the
    SD card to be in read-only mode this lets you experiment with different settings.
    Also, if you are worried about avoiding your warranty, stay away from the force_turbo
    setting. When paired with certain settings, like high over_voltage values, it
    will set a warranty bit upon your device that the manufacturer knows you have
    been doing aggressive overclocking.


    One other essential tweak that you will need to make to see any benefit from overclocking
    on the Raspberry Pi is to change the governor settings. Since halfNES emulator
    is largely single-threaded, the default power-saving governor sees low CPU utilization
    and will refuse to increase the speed. To work around this, set the governor to
    "performance" and it will more aggressively raise the CPU speed. The command for
    doing this is as follows:


    ```

    echo "performance" | sudo tee /sys/devices/system/cpu/cpu0/cpufreq/scaling_governor

    ```


    > NOTE This command is specific to the Raspberry Pi 2 and only changes the first
    CPU''s governor. On the Raspberry Pi B+ or A+, you would omit cpu0 to do the function.


    # Automatic NES Startup


    The last tweak you may want to make to your Raspberry Pi software is to configure
    it to automatically boot the gaming emulator on startup. The easiest way to do
    this is to edit rc.local and add a command to launch your emulator right after
    the startup sequence.'
