    Once the sensor is connected, you can check to make sure it is working from the
    command line. Go to the 1-Wire device folder and check for the existence of a
    device by typing the following commands on your Raspberry Pi:


    ```

    cd /sys/bus/w1/devices\ls

    ```


    If your device is recognized, you should have a folder that starts with “28-”
    and has a string of 13 hex digits. The 28 code signifies it is a DS18B20 chip
    and the 13-digit hex string is the unique identifier for your device. Together
    these distinguish your sensor from other devices you may have hooked up to the
    same 1-Wire bus.'
