    FIGURE 8-12. Fully operational Raspberry Pi emulator


    Setting the framebuffer depth to 32 is important for the Swing halfNES version''s
    performance, because it eliminates a very expensive copy from 32- to 16-bit graphics.
    For JavaFX there is no performance difference either way, since it sits on top
    of an accelerated graphics pipeline. However, JavaFX greatly benefits from the
    additional GPU memory, so setting this to 128 makes a difference in performance.


