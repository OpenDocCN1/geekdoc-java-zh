  md: '# Bill of Materials


    To finish the project in this chapter, you will need a few items besides your
    Raspberry Pi. All of the items are fairly inexpensive and can be purchased online
    or in small electronic hobby shops that you may have in your neighborhood.


    Here is the full list of everything you will need:


    +   - Raspberry Pi Your choice of Raspberry Pi, but one of the newer models with
    a 40-pin header is preferred (Model B+, A+, or 2).


    +   - Pi Cobbler This is a clever little invention by the Adafruit folks that
    provides an easy way to mirror the Pi GPIO header onto a breadboard for prototyping.
    Make sure to pick up the right one for your Pi (either 26 or 40-pin): https://www.adafruit.com/products/2029.


    +   - Full-size breadboard Breadboards are really handy for prototyping circuits
    quickly and fairly inexpensive. Adafruit carries these as well: https://www.adafruit.com/products/239.


    +   - LEDs For output we will be using LEDs to show the count. You will need 17
    total, and having a few different colors will make it easier to read the output.
    I ended up using three blue, six green, and two red LEDs purchased from Adafruit:
    https://www.adafruit.com/products/297.


    +   - Switches Tactile switches are a great way to take user input and very easy
    to use up. A pack of colorful switches like this set from Adafruit will go a long
    way: https://www.adafruit.com/products/1009.


    +   - Resistors These are handy to have around in a variety of sizes. For this
    project, you will need 17 identical resistors of 68Ω or larger value, so pick
    up a large pack of resistors like one: https://www.amazon.com/480-pack-5-tolerance-resistors-Assorted-Values/dp/B000TAAII.


    +   - Breadboard cables To hook everything in this project you will need a lot
    of wires. If you are clever in the layout you can save a few connections, but
    expect to use around 30-40 wires: https://www.adafruit.com/product/153.


