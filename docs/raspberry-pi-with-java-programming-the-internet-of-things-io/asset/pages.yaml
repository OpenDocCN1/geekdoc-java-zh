  md: '# 96 Raspberry Pi with Java: Programming the Internet of Things


    The test gave the following results for 100,000 iterations:


    +   - Pi4J: 0.751 kHz

    - Device I/O: 3.048 kHz


    Feel free to re this on your own to see what your observed speeds are. However,
    as you can see, both Pi4J and DIO provide reasonable performance for being fairly
    high-level APIs with lots of error checking, caching, and so each time you set
    a pin value. And even in this chapter''s example of flipping 17 pins at eight
    times per second, we are not even close to stressing the GPIO performance:


    +   - 17 pins × 8 flips/s = 136 flips/s

    - 136 flips/s × (1 cycle / 2 flips) = 68 Hz

    - 68 Hz × (1 kHz / 1000 Hz) = 0.068 kHz


    So we have plenty of headroom with either of the APIs. However, you might be wondering
    if you can do better. Occasionally, you may need to really drive the GPIO pins
    hard. For example, we might want to build a timer with millisecond accuracy:


    +   - 17 pins × 8 flips/ms = 136 flips/ms

    - 136 flips/ms × (1 cycle / 2 flips) = 68 kHz


    At this speed we are over the limit of what Pi4J or Direct I/O can handle, and
    this is not accounting for other logic that has to run between GPIO cycles to
    update the timer state.


    However, we do another option that supports even faster GPIO performance. Pi4J
    gives us access to the raw Java Native Interface (JNI) to the underlying C library
    (WiringPi), allowing us to bypass all of the safety checks and high-level API
    features that introduce overhead. Listing 3-16 shows the same performance test
    coded up for the Pi4J raw access API.'
