  md: '# 218 Raspberry Pi with Java: Programming the Internet of Things


    Another component of this software is an API library named autonomous4j that utilizes
    the parroter library to provide even higher-level abstraction for controlling
    the AR Drone in Java. This library, located at https://github.com/RaspberryPiWithJava/Autonomous4j,
    is written in Java by Mark A. Heckler.


    The autonomous4j library enables you to write Java code such as shown in Listing
    7-1 to make the drone fly in a rectangular pattern.


    # Listing 7-1 Java code for flying in a rectangular pattern


    ```

    private static void doDemoFlightBox(A4jBrain brain) {

    brain.takeoff()..hold(5000); // ms duration

    brain.goRight(20).doFor(8000); // % speed, ms duration

    brain.stay()..hold(5000);

    brain.backward(20).doFor(7000);

    brain.stay()..hold(5000);

    brain.goLeft(20).doFor(8000);

    brain.stay()..hold(5000);

    brain.forward(20).doFor(7000);

    brain.stay()..hold(5000);

    brain.land();

    }

    ```


    The code in Listing 7-1 causes the drone to take off and hold its position for
    five seconds. It will then fly to the 20 percent speed for eight seconds, backward
    at 20 percent speed for seven seconds, to the left at 20 percent speed for eight
    seconds, and forward at 20 percent speed for seven seconds. It will then land,
    theoretically in the same position at which it took off. Because we, factors such
    as wind can cause the drone to land in a different position. As mentioned earlier,
    more advanced levels of autonomy than implemented in this project are certainly
    possible.


    Figure 7-3 is a stop-action shot of the drone with its Raspberry Pi brain and
    USB charger flying in a rectangular pattern in Mark Heckler’s living room.


    ![](img/e10b78d76be679e70031ec7a27b91e4a_235_0.png)'
