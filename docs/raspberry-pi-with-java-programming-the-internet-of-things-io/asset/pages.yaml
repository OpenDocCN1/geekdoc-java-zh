  md: '# Chapter 2: Your First Project 31


    Here are the fields that you will need to configure:


    +   **Platform Name** Choose a name that distinguishes the remote platform from
    other local or remote JDKs


    +   **Host** The hostname or IP address of your Raspberry Pi


    +   **Username/Password** Login credentials for the Raspberry Pi


    +   **Remote JRE Path** Location of your Java install on the Raspberry Pi


    The Remote JRE Path is slightly harder to configure. Since you want to point to
    this for your existing Java installation on the Pi, you need to log in via SSH
    or console and find the path by using the following command:


    ```

    sudo update-alternatives --display java

    ```


    This will display the location(s) of the Java installation along with the path,
    giving you output similar to the:


    ```

    java -a mode

    link currently points to *

    usr/lib/jvm/jdk-8-oracle-arm-vfp-hflit/jre/bin/java

    usr/lib/jvm/jdk-8-oracle-arm-vfp-hflit/jre/bin/java - priority 318

    slave java.1.gz: /usr/lib/jvm/jdk-8-oracle-arm-vfp-hflit/man/man1/java.gz

    Current ''best'' version is similar to ''/usr/lib/jvm/jdk-8-oracle-arm-vfp-hflit/jre/bin/java''

    ```


    In this case you would enter a value of /usr/lib/jvm/jdk-8-oracle-arm-vfp-//jre/
    for the Remote JRE Path.


