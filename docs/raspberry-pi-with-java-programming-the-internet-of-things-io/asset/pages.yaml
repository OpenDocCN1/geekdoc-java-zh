  md: '# Raspberry Pi with Java: Programming the Internet of Things


    # Rewiring the Buttons


    It is time to retire the breadboard and get the buttons prepped for insertion
    into the case. In the previous chapter we laid out all the buttons with direct
    wire connections from the Kippah, so transitioning off the breadboard is as simple
    as removing the buttons and soldering their leads directly to the cables off the
    Kippah.


    Since the 3D printed button holder has the leads horizontal to save space, you
    will need to bend the metal pins on the buttons to make them flat. Carefully bend
    each of the pins with a pair of pliers as shown in Figure 9-15. The round buttons
    are the trickiest since the pins do not go straight out, but need to be angled
    slightly to fit through the holes in the button cover.


    When soldering the pins on the buttons, make use of the helping hands to hold
    the button and the wire in place. This will free up your hands to focus on getting
    a clean solder connection. Remember that solder will only create a firm bond if
    the metal is properly heated, so make sure that the button lead and wire are both
    in contact with the solder iron for a few seconds before coating with solder.
    A solid solder joint is shown in Figure 9-16.


    Don''t forget the diodes on the Start and Select buttons. To keep the wiring simple,
    you can directly connect the diode to the button terminals and keep the two diodes
    isolated with a little heat shrink tubing, as shown in Figure 9-17.


    ![](img/e10b78d76be679e70031ec7a27b91e4a_297_0.png)


