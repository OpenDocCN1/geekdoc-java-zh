  md: '# 36 Raspberry Pi with Java: Programming the Internet of Things


    as shown in Figure 2-6, but any Stamps.com or DymoStamp-compatible scale should
    work. To use the scale, simply plug it into one of the host ports on Raspberry
    Pi and turn it on. The Dymo M10 only consumes 16mA, so it can be safely powered
    right off the Raspberry Pi USB bus.


    **TIP**nWhen shopping for a scale, make sure you get a scale that has resolution
    to at least 1 or 2 grams. Scales with larger capacity typically have less resolution,
    and scales with smaller capacity typically have much finer resolution. If you
    are a real coffee connoisseur, you will want to get a 1/10 of a gram, like the
