  md: '# 214 Raspberry Pi with Java: Programming the Internet of Things


    In this chapter we are going to utilize a Raspberry Pi and some Java applications
    as a brain for a quadcopter. Quadcopters are often referred to more generally
    as drones, and we''ll use that term in this chapter. Usually drones for recreational
    purposes are flown with a remote control, in the form of an application that exists
    on a smartphone or tablet. The person flying the drone influences its flight by
    interacting with the user interface controls in these applications. The mobile
    device typically connects to the drone using a wireless access point that is onboard
    the drone. This is similar to the idea of connecting to a wireless router at home
    with a client such as a computer or mobile device.


    In this chapter we are going to take a step into more advanced capabilities by
    enabling the drone to fly without a remote control—the control will be onboard
    the drone. This will enable the drone to fly with a very basic level of autonomy,
    which is why the name of this chapter is “Autonomous Drone.” There are more advanced
    levels of autonomy possible for drone flight, and at the end of this chapter I''ll
    discuss for achieving one of them.


    # CAUTION


    Because the drone created in this project actually flies in the air, it is a lot
    of fun to build and test, but its flight is often unpredictable. Given this unpredictability,
    and the fact that there are multiple spinning blades, minors should be allowed
    to use this drone only with adult supervision. Assuming you''re fine with that
    caveat, then let''s get started!


    # Hardware Bill of Materials


    The main component in this project is a quadcopter, specifically the Parrot AR
    Drone 2.0, shown in Figure 7-1, which is a very capable quadcopter that is well
    suited for this project.


    Some of the standard features of the AR Drone that make it very capable include


    +   - Inertial Measurement Unit (IMU) consisting of a gyroscope, accelerometer,
    and a magnetometer, all with three degrees of freedom low


    +   - Ultrasound height sensor for measuring low flight'
  merge: -1
  pgno: 231
- img_proc: true
  md: '# Chapter 7: Autonomous Drone 215


    +   - Pressure sensor for measuring high flight

    - Front camera with 720p resolution

    - Downward-facing camera with 360p resolution

    - Lithium polymer battery, 1000mAh

    - Onboard wireless access point

    - Indoor shell/outdoor shell

    - Four brushless motors for the spinning blades


    Naturally, the hardware of the brain that we''re giving the drone in this project
    is a Raspberry Pi. This inexpensive computer is very well suited for this role
    for several reasons: it is small, lightweight, and consumes relatively low power.
    In addition, the Linux operating system may be loaded on it, which allows various
