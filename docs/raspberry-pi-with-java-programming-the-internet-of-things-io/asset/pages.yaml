  md: '# 294 Raspberry Pi with Java: Programming the Internet of Things


    Now you can do final assembly by sliding the two covers in place. The console
    lid is designed so you hook it under the hinge and then snap the edges in place.
    Be careful not to catch the battery cable in the back when pushing it in. Also,
    make sure you insert the plastic ridges properly so you get a good fit. When pushing
    down, make sure the D-pad and buttons don''t get caught, the front corner snaps
    are the tightest and will make sure everything stays in place without any screws.


    The top screen uses a sliding mechanism where you insert it from the top and push
    down, as shown in Figure 9-36. You may need to bend the screen slightly to get
    the top over the snaps. Once securely locked in the angled ridges, push down on
    the top to secure it.


    And with that you have a completed portable retro gaming console. I hope you enjoyed
    building this project as much as I enjoyed designing it and building it, and I
    also hope it will inspire you to come up with your own embedded projects to build
    and share.


    ![](img/e10b78d76be679e70031ec7a27b91e4a_311_0.png)


    FIGURE 9-36. Sliding cover for the display'
