  md: '# Chapter 2: Your First Java Project 37


    NOTE

    It may also be helpful to download the full code sample for this chapter at the
    following GitHub repo: https://github.com/RaspberryPiWithJava/JavaScale.


    For communication with our USB scale, we are going to use the usb4java Java library.
    This is an open-source, JSR 80–compliant implementation of the standard javax.usb
    specification that has for ARM Linux distributions like the Raspberry Pi. You
    can download the latest version of usb4java from the project website: http://usb4java.org/.


    Make sure to download both the core library and the javax extension. From the
    core distribution, you will need to grab the following JAR files:


    +   - usb4java-1.2.0.jar

    - libusb4java-1.2.0-linux-arm.jar

    - commons-lang3-3.2.1.jar


    You also need these additional JAR files from the usb4java-javax distribution:


    +   - usb-api-1.0.2.jar

    - usb4java-javax-1.2.0.jar


    Place all these files in a new folder called lib in your project directory, and
    add them to your project dependencies. You do so via the Project Properties dialog
    Click the Add JAR/Folder button and select all the JAR files in your lib folder
    for inclusion. A project with all the required JAR files included is shown in
    Figure 2-7.


    NOTE

    Make sure you select the JAR files themselves and not the outer lib folder. Using
    folders as a library only works when you have class files that are not inside
    a JAR.'
