    This is three orders of magnitude faster than the millisecond timer using Pi4J
    and Device I/O, and sufficiently fast to support a millisecond timer. Just for
    kicks, I included the millisecond timer implementation using the raw Pi4J API
    in the GitHub repo (https://github.com/RaspberryPiWithJava/BinaryTimer) under
    the name BinaryMillisecondTimerPi4JRaw.java.


    For true performance gurus, it is important to know why the Pi4J API is so much
    faster. To understand this, we have to back up and talk about the different ways
    you can access GPIO on the Raspberry Pi. There are two primary ways of accessing
    GPIO, each with different trade-offs:


    +   - Memory-mapped access (/dev/mem) This is the lowest-level API for accessing
    GPIO provided by the Linux kernel. It requires root access, and the ability to
    memory-map the virtual device file, but it will give you direct access to set
    one or multiple GPIO pins extremely quickly.'
