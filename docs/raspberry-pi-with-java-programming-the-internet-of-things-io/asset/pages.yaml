  md: '# 28 Raspberry Pi with Java: Programming the Internet of Things


    The fully functioning Raspberry Pi embedded computer that you set up in Chapter
    1 comes preloaded with Oracle Java 8, getting started with Java is as simple as
    typing the java command at the prompt. However, to simplify the development workflow,
    this chapter is going to take you through the installation and setup of a Java
    IDE that gives you a full-featured programming environment.


    # Bill of Materials


    To complete the project in this chapter you will need a Raspberry Pi of your choice
    and a USB scale. Since you will be connecting the Raspberry Pi to your computer
    for remote debugging and output, make sure that you choose a Raspberry Pi model
    that you can easily network. For this reason, you probably don''t want to use
    either the Model A or A+ since they both have a single USB port and no Ethernet.

    What you need:


    +   - Raspberry Pi with SD card Model B, B+, or 2 recommended.

    - Digital scale with USB support The Dymo M10 or Dymo M25 is recommended. Here
    is a link to the M10 on Amazon: www.amazon.com/DYMO-1772057-Digital-Shipping-10-pound/dp/B0053HCWRE.

    - Aeropress coffee maker Made by Aerobie, and you can find it on Amazon or at
    premium coffee roasters: www.amazon.com/Aeropress-Coffee-and-Espresso-Maker/dp/B0047BIWSK.

    - Coffee grinder if you do not already have a high-quality electric grinder, a
    manual grinder is a great value for the occasional cup and an essential for traveling.
    The Japanese made Porlex Mini Coffee Grinder is a great choice: www.amazon.com/Porlex-Mini-Stainless-Coffee-Grinder/dp/B0044ZA066.


    To the hardware you will need some consumables, such as filters and coffee beans.
    The Aeropress comes with plenty of filters to get you started. For beans you should
    source a local coffee roaster, or if there are no coffee roasters in your vicinity,
    another option is to order coffee by mail from a high-quality roaster like Four
    Barrel: http://fourbarrelcoffee.com.'
