  md: '# Chapter 9: NighHacking RetroPi 263


    it while soldering. They are inexpensive, and it would be a shame to have everything
    else working and installed but no power button to fire it up.


    You will also need the soldering iron, multimeter, board holder, and helping hands
    from Chapter 8 to finish assembly. Having plenty of hookup wire, solder, desoldering
    wick, and heat shrink tubing will ensure you don''t run out while in the middle
    of the project.


    # 3D Printer


    You will also need access to a fused deposition modeling (FDM) 3D printer to create
    the enclosure for this project. FDM printing extrudes a thin layer of plastic
    from a heated nozzle, building up a 3D form one layer at a time. 3D printers used
    to be reserved for industrial use, but recently some of the key patents have expired,
    and now there is a growing open source development community focused on building
    DIY printers, such as the RepRap project: reprap.org.


    As a result, the price of 3D printers has dropped significantly, making it affordable
    to purchase a fully assembled hobbyist printer. You can also find 3D printers
    available for use at makerspaces and universities across the world. To find a
    makerspace near you, check out this convenient centralized directory: spaces.makerspace.com/makerspace-directory.


    Typically, the printed material is either polyactic acid (PLA) or acrylonitrile
    butadiene styrene (ABS). Either PLA or ABS will work for this project, although
    I recommend starting with PLA if you are new to 3D printing. There is also a variety
    of new materials that are growing in popularity for printing, such as thermoplastic
    elastomers (TPEs), a popular brand of which is NinjaFlex and nylon, both of which
    give you a flexible print and may be handy for small parts like the directional
    pad cover in this project (although this is optional).


    If you are interested in purchasing a 3D printer, I recommend looking for a company
    that has an open source design and an active community. 3D printing technology
    is far from perfected, so keeping a printer in good working condition requires
    a lot of attention and occasional replacement of parts. Having an open design
    means you can swap and replace parts as needed, often printing the replacement
    part right on your printer (or a friend''s). And an active community means that
    you encounter issues with print quality, you have a source of folks with the same
    model to submit questions to.'
