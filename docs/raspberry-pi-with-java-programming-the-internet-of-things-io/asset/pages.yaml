  md: '# Chapter 5: Line Runner 151


    # Pulse-Width Modulation


    DC motors are typically controlled using pulse-width modulation (PWM), where you
    give the motors a regular pulse to regulate their speed. By varying the width
    of the pulse, or the length of time current supplied, you can regulate the voltage
    and slow down the motors (vs. constant current). The advantage of PWM to control
    motor speed is that it is more efficient when running at slow speeds.


    The Raspberry Pi has hardware support for PWM on pin 1, but we need to use PWM
    on multiple pins to control both motors, so we need to simulate PWM using software
    on normal GPIO pins. Pi4j has support for this via the SoftPWM, which runs a process
    in the background that controls the pin timings to create a regular pulse. The
    timings are not guaranteed to be precise since it is done in software, but it
    is good enough for controlling LEDs and motors.


    Initialize PWM on a pin, use the following method:


    ```

    result = SoftPWM.softPWMCreate(MOTOR1_PWM, 0, 100);

    ```


    The first parameter is the pin to use for PWM using the Pi4j numbering convention.
    The second parameter is the initial value of the motor, and the last parameter
    is the range of the value. The recommended default for the last parameter is 100.
    The result returned is 0 for success and -1 if there is an error.


    > TIP

    You might be wondering what the purpose of the range is and what happens if you
    change it. The way SoftPWM implementation works is that it has a granularity of
    100µs where it can set the pins to low or high. The range is the cycle time in
    100µs units, so the default of 100 would give us a cycle of 10 ms. Then the value
    is how many of those units the signal stays high, so if we used a value of 20,
    it would stay high for 2 ms and then be low for 8 ms. Changing the range to be
    higher gives you more control in the cycle, but the granularity doesn''t go up—just
    your cycle time increases. To get a finer granularity than 100µs, you would need
    to do a software loop, which would tie up resources and make it difficult to control
    more than one pin.'
