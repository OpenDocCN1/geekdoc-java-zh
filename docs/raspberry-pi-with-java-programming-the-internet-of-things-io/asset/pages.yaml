  md: '# Listing 4-1 Selected drivers that libnfc is configured to build


    ```

    Selected drivers:

    acr122_pcsc...... no

    acr122_usb....... yes

    acr122s......... yes

    arygon................. yes

    pn53x_usb....... yes

    pn532_uart....... yes

    pn532_spi........ yes

    pn532_i2c........ yes

    ```


    The last three are the ones we care about: UART (serial), SPI, and I²C support
    for the PN532 chipset. To launch the actual compilation and install it on your
    Raspberry Pi, run the following commands:


    ```

    make

    sudo make install

    ```


    The last step is to create a configuration file that tells libnfc protocol to
    use. The configuration file must be located at /etc/nfc/libnfc.conf and support
    the following options:


    +   - allow_autoscan The default value is true, allowing libnfc to automatically
    scan for devices. Unfortunately, this doesn''t actually work, so you have to manually
    configure the reader.

    - allow_intrusive_scan This is an even more aggressive scan, which is disabled
    by default. Enabling this option is not recommended.

    - log_level The level of logging used by libnfc. The default is 1 (error), but
    it goes all the way up to 3 (debug) if you need more information.

    - device_name/device.constr These parameters let you manually specify the reader
    information, which is required on the Raspberry Pi version of libnfc.


    Using a particular interface is as simple as configuring the right jumpers or
    switches on the smart card reader, hooking up wires according to the earlier diagrams,
    and enabling the right manual configuration for your device.'
