  md: '# Chapter 2: Your First Java Project 55


    complete with memory and integrated storage on a board the size of a DIMM module.
    In fact, it uses a standard DIMM socket, making it easier to build compatible
    PCBs for a custom product.


    Something else to be careful about is use of the Raspberry Pi logo or word mark.
    If you include the words "Raspberry Pi" as part of your company name, product,
    or logo, you could be in violation of the Raspberry Pi Foundation''s trademark.
    Also, if you use the Raspberry Pi logo or a derivative graphic, you may also be
    in violation. However, there are some cases in which you can use the word mark,
    such as with a referral phrase like "runs on," "compatible with." The Raspberry
    Pi has put out guidelines with more details here: www.raspberrypi.org/trademark-rules/


    Also, many of the packages in the Raspian repository are licensed for personal
    use, such as Mathematica. Before shipping a commercial product, you need to check
    the license on packages you plan to install or ensure that you are not in violation
    of the terms.


    Finally, Oracle Java comes with licensing as well, which are fully spelled out
    in the Oracle Binary Code License Agreement (agreement://www.oracle.com/technet/java/javese/terms/license/index.html).
    Oracle Java is free for development, evaluation, and for production usage on a
    general-purpose computer. This means if you are using the Raspberry Pi to replace
    a PC (for example, as a web server or desktop computer equivalent), then you don''t
    have to pay a license. Also, if you are a developer, hobbyist, or educational
    institution, you do not have to worry about license fees. However, if you are
    building a commercial product for embedded use (such as a kiosk, game console,
    etc.), then you may have to pay a volume license based on the number of units
    you sell. The price list is publicly posted here: www.oracle.com/us/corporate/pricing/price-lists/java-embedded-price-list-1977272.pdf.


    If you happen to fall into the commercial use for Oracle Java, another option
    is to use OpenJDK, which is released under a fully open-source license and free
    for use in embedded commercial projects. The main disadvantage of OpenJDK is that
    it does not support a just-in-time (JIT) compiler for Java 7 or 8, and the available
    JIT for Java 6 (Cacao) is significantly slower than the Oracle JIT. The other
    disadvantage is that you are on your own as for support with Open, so if you have
    a bug or blocking issue, you will have to fix it yourself in the open-source repo.
    Other than that, Open can often be a good alternative to licensing Oracle Java
    if you do not require the performance or commercial support.'
