  md: '# Accessing GPIO from Java


    Two libraries are commonly used for accessing the GPIO pins on the Raspberry Pi:
    Device I/O and Pi4. The Device I/O library, which is part of the OpenJDK project,
    provides a standard library for accessing I/O pins across any embedded platform,
    including the Raspberry Pi. The Pi4 library is an open-source library that is
    exclusive to the Raspberry Pi. We will make use of both of these libraries throughout
    the book, but here is a quick comparison of the two libraries:


    Device I/O benefits:


    +   - Supports multiple embedded boards (although presently just the Raspberry
    Pi)


    +   - Portable to Java ME


    +   - API optimized for Java 8 (lambdas, try-with-resources, and so on)


    Pi4J benefits:


    +   - Better support for different Raspberry Pi boards


    +   - Advanced features, such as button debouncing and interrupt-based listening


    +   - Extensible providers for add-on boards


    +   - Direct access for faster GPIO support


    The easiest way to relate the two libraries is that Device I/O is a Java standard
    providing baseline GPIO access across a range of embedded devices, while Pi4J
    is a specialized library for the Raspberry Pi with additional performance enhancements
    and features. If you are targeting only Raspberry devices as your platform, using
    Pi4J makes a lot of sense. Also, presently, setting up and using the Device I/O
    library is a bit of a chore. However, other projects in the Java community, such
    as Eclipse Kura, are standardizing on it, so the Device I/O library is likely
    to get better over time.


    This chapter presents the code for both a Device I/O version and a Pi4J version
    of exactly the same project. This will help you learn how to set up both libraries
    and also provide you with an equivalent comparison. Later chapters focus on one
    library or the other based on the project requirements.'
