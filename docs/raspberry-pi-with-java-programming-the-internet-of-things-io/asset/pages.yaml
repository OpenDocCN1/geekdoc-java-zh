  md: '# Accessing the Scale from Java


    To access serial scales from Java, you can use either the Pi4J library or the
    Device I/O library, which were introduced in Chapter 3. They both work great and
    provide similar functionality. Here is how the two libraries stack up against
    each other:


    +   - **Serial protocol support** Pi4J only lets you set the baud rate, with future
    plans to add in more support for parity, stop bits, and other features in the
    future. The Device I/O library has flags for all of these settings, but they are
    unimplemented. So currently you have the same capabilities on both libraries.


    +   - **Asynchronous processing** The Pi4J API supports synchronous writes and
    either synchronous or asynchronous reads via SerialHandler. The Device I/O library
    routes based on the Java non-blocking API (Java.nio), which makes the processing
    asynchronous, although in practice you will have to create your own threaded asynchronous
    callback abstraction to handle the serial data.


    +   - **Ease of use** For most applications the Pi4J API is a lot easier to use.
    It takes care of byte to String conversions, creates a simple callback handler
    for asynchronous processing, and lets you focus on your application logic rather
    than your non-blocking I/O jujutsu.


    I am going to show examples using Pi4J in this chapter, which is a bit simpler
    and easier to use. However, if you want to integrate your code with some other
    Java libraries that take advantage of non-blocking I/O, it might be worthwhile
    to try out the Device I/O library, which takes a more standards-based approach.

    To make it easier to follow, all of the code for this chapter is available in
    the Raspberry Pi with Java GitHub repo at the following URL:


    ```

    https://github.com/RaspberryPiWithJava/TeaStation

    ```


    # Reading Scale Data with Pi4J


    To started with the Pi4J serial API, create a new project and add pi4j-core.jar
    to the class path. You will also need to configure a Remote Java Platform to connect
    to your Raspberry Pi with the correct IP address and root permissions by entering
    a value of sudo in the Exec Prefix field.'
  merge: -1
