    # Accurate Temperature Sensing


    The secret to bringing out the best flavor in tea is careful control of the steeping
    process. Besides time, the most important factor in this process is the temperature
    of the water. Tea should never be exposed to boiling water or it will develop
    a bitter taste. However, water that is too tepid won''t extract the full flavor.
    To complicate things further, there are many varieties of tea, as shown in Figure
    6-11, and each reacts differently to water temperature.


    ![](img/e10b78d76be679e70031ec7a27b91e4a_207_0.png)


    FIGURE 6-11. Different types of tea (original photo by Hermann Hammer, public
    domain)'
