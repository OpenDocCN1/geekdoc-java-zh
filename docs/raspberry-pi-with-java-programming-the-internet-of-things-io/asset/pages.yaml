  md: 'There has been a resurgence of interest in retro video games from the 1980s
    and 1990s on 8-bit gaming platforms. Games back then had relatively limited graphics
    capabilities, so instead they focused on mechanics, level design, and most of
    all challenge. Compared to modern video games, many of the early classics were
    difficult and unforgiving, making them a real achievement. The Nintendo Entertainment
    System (NES), shown in Figure 8-1, was the most successful 8-bit console in history,
    with 61.9 million units sold worldwide.


    Since these early systems used dedicated chips, doing a perfect job of emulating
    the system (and its quirks) in software requires a reasonably fast processor.
    The Raspberry Pi is a great choice for this since it has has decent processing
    capabilities and really great graphics performance, making it an excellent classic
    platform for emulating classic video games.


    In this chapter and in Chapter 9, we will develop a portable gaming system with
    a pure Java NES emulator and custom 3D printed case as a revival of the early
    handheld gaming systems. However, if you are only interested in the game emulation
    and do not want to build the handheld version, by the end of this chapter you
    will have a fully functional functional game emulator and GPIO controller.


    ![](img/e10b78d76be679e70031ec7a27b91e4a_251_0.png)


    **FIGURE 8-1.** Nintendo Entertainment System (public domain by Evan-Amos)


    > *Nintendo Co., Ltd., "Consolidated Sales Transition by Region": www.nintendo.co.jp/ir/library/historical_data/pdf/consolidated_sales_e1506.pdf*'
