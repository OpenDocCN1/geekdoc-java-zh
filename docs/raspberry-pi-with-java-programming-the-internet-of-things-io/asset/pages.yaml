    This is probably a good time to mention the correct way to shut down your Raspberry
    Pi. If you disconnect power from the Raspberry Pi while it is running, you may
    damage the filesystem and cause corruption and data loss. To prevent this, make
    sure that you properly halt the Raspberry Pi before powering it off by using the
    following command:


    sudo shutdown -h now


    This command logs off all users, cleanly closes the filesystem, and terminates
    before you power off the Pi. You will know your Pi is ready to unplug when you
    see the green ACT LED flash ten times in sequence.'
