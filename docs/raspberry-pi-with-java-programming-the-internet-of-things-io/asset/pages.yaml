  md: 'Now that we have completed some larger projects that take advantage of GPIO,
    it is time to revisit the coffee brewing example from Chapter 2 to enhance it
    for use in brewing delicate leaves. While water temperature for brewing coffee
    is important, it is even more important for brewing tea because tea is more sensitive
    to temperature, requiring different temperatures based on the type of leaves you
    are brewing. Also, to brew the equivalent amount of tea, and the weight of the
    dried tea leaves is much lighter than that of the coffee grounds, requiring more
    precise weight measurement of the tea leaves.


    Some of the enhancements we are going to make to this example


    +   **A high-precision serial scale** The USB scale you used earlier had two limitations.
    The first is that its accuracy is restricted to 2g. Also, the scale gives values
    but does not accept inputs. The serial scale I recommend using in this chapter
    allows you to programmatically “tare,” eliminating a manual step in the recipe.


    +   **Accurate temperature measurement** Getting close to 100°C is fairly easy
    since the physical process of boiling limits the temperature. However, getting
    a precise temperature below 100°C is impossible without a thermometer. In this
    chapter you will utilize a high-temperature digital chip hooked up to the Raspberry
    Pi to accomplish this.


    +   **Touchscreen display** While it is possible to monitor terminal output to
    get instructions, most of us don''t cook in the kitchen with our laptops open.
    By adding a touchscreen to the Raspberry Pi you will have the ability to monitor
    the tea-making process and select your variety of tea on-the-fly.


    # # Bill of Materials


    For this chapter you have several choices in the hardware you use. I will give
    some recommendations as well as some alternatives that are equally good at different
    price points.


    # # Choosing a Scale


    Most high-precision serial scales are designed for scientific use. They may also
    come with certifications and features that are handy in lab'
