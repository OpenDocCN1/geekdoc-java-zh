    The Motor Driver expects to see at least 2V pin numbers to signal reversing the
    motor direction, but after we get through the logic circuit on the UNO Shield
    and Motor Driver, we end up with just under 2V from the starting Raspberry Pi
    voltage of 5V. The result is that the motors will go forward, but when you try
    to have them go backward, they will still go forward. To work around this, we
    can solder an 820Ω resistor in parallel with the 1kΩ resistor on the Me UNO Shield
