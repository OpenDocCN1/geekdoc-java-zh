  md: '# 108 Raspberry Pi with Java: Programming the Internet of Things


    # NOTE


    On the latest version of Raspbian as of this writing, raspi-config doesn''t properly
    enable the I2C kernel module. To enable it properly, you have to edit /etc/modules
    by using the command sudo nano /etc/modules. In this file, add an extra line to
    the end that reads i2c-dev.


    By default the serial port is used for console debugging. However, we are going
    to disable this feature so we can use it to talk to the smart card reader or other
    peripherals. To do this, choose A8 on the Advanced Options tab to modify serial
    access. Unlike SPI and I2C, we are disabling this feature rather enabling it.
    When asked “Would you like a login shell to be available over serial?” choose
    No. It will now tell you that "Serial disabled"; however, this is actually freeing
    the serial port for other uses. Respond OK and we are all set to use the serial
    port to communicate with other devices.


    Finally, choose Finish to exit raspi-config, and then reboot Raspberry Pi for
    good measure using


    ```

    sudo shutdown -r now

    ```


    Now you have successfully enabled I2C, SPI, and serial communication with devices
    over GPIO.


    # Connecting the Smart Card Reader


    I am going to provide instructions for both the PN532 Breakout Board from Adafruit
    and the ITEAD PN532 NFC Module. Other electronics vendors similar breakout boards,
    and any of them that have a PN532 chip and allow you to hook up over I2C, SPI,
    or serial should work just fine.


    The board from Adafruit comes without the headers attached, as shown in Figure
    4-4. The blue circuit board has the PN532 chip and an antenna for reading smart
    cards from a reasonable distance. There are also status lights and mounting holes
    for several different common device connections. Along the board you will get
    a strip of headers that you can solder on the board as needed, two jumpers to
    use for selecting the interface, and the RFID card that you can use to test and
    make sure your board is working fine.


    The only pins we will need are the set of nine connectors on the right edge and
    the two jumper sets along the bottom, both in groups of three.'
