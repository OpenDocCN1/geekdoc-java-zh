  md: '# Chapter 5: Line Runner 161


    Read the sensor as follows:


    +   1. Wait for it to go high.

    2. Start a timer.

    3. Wait for it go low.

    4. Capture the pulse width in microseconds.


    Once we have the pulse width of the sensor, we can use this to calculate the distance
    of the object. The distance in centimeters is calculated by dividing the pulse
    width by 58 as shown in the following formula:


    Distance (cm) = Pulse Width (uS) / 58


    At the minimum distance of 3cm for the sensor, this would require timings as precise
    as 174µs or .174ms. Unfortunately, the Raspberry Pi GPIO libraries cannot handle
    this resolution, so at this distance you will miss the pulse entirely. Using the
    fastest GPIO interface available, Pi4J raw mode, we can measure distances starting
    at around 20cm and up, which gives us an effective range of 20cm to 4m for the
    sensor. This is reasonable for obstacle avoidance, and is the range we will focus
    on.


    > You can achieve higher resolution on real-time chips like the ATmega328 used
    in the Arduino, because they do not run a full operating system and therefore
    have no interrupts that interfere with timing. However, you are giving up on general-purpose
    computation power, so a good combination is to hook up an Arduino to the sensors
    and communicate with a Raspberry Pi that is doing more advanced processing via
    serial.


    To measure the distance, Listing 5-9 provides a simple algorithm that follows
    the Makeblock Me Ultrasonic Sensor protocol to return the distance in centimeters.'
