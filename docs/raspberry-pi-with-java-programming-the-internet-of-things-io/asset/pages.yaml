  md: 'Chapter 2: Your First Java Project 35


    # Brewing Java


    The addition of Java to your Raspberry Pi wouldn''t be complete without an application
    to help you perfect your coffee brewing skills. For the second application we
    write on the Raspberry Pi, we will take a scientific approach to coffee brewing
    in order to obtain the ideal cup of joe.


    The setup includes a USB scale that will be used to measure the weight of ingredients,
    an Aeropress brewing device, and a portable scale as shown in Figure 2-5. All
    of this connects to the Raspberry Pi as a central control unit for the coffee
    brewing algorithm.


    # Communicating with a USB Scale


    To precisely measure weight for coffee brewing, we are going to use a USB shipping
    scale. While it is possible to create your own scale from scratch using a strain
    gauge, a Wheatstone bridge, and an analog amplifier (http://morf.lv/modules.php?name=tutorials&lasit-19),
    it turns out to be cheaper and more reliable to simply use an electronic shipping
    scale.


    The protocol used by most shipping scales is simple one-way communication where
    the current scale value is repeatedly broadcast over a single endpoint on the
    first interface. I am going to be using Dymo M10 scale for this project,


    ![](img/e10b78d76be679e70031ec7a27b91e4a_52_0.png)


    FIGURE 2-5. Hardware for the coffee brewing project'
