  md: '# 80 Raspberry Pi with Java: Programming the Internet of Things


    solderless breadboards are very easy to change and tweak as you are in the prototyping
    phase of the project. Also, it is fairly easy to transfer your breadboard design
    into a more permanent format using a breadboard-factor prototype breadboard.


    Breadboards come in a wide variety of sizes, but they all share similar properties.
    The holes are a standard size, allowing for 21–26 AWG wire or pins to be used,
    as is the spacing, which allows for common components to be used on any breadboard.
    Also, the holes are electrically connected in rows and columns, allowing you to
    make connections between components with a minimal number of hookup wires. Figure
    3-9 shows how the holes are wired on a full-size breadboard.


    The pair of horizontal rails on the top and bottom is electrically connected,
    and marked for ground and power, which is a common requirement on wiring designs.
    The center of the board is wired vertically with groups of five holes connected
    electronically and separated by the center horizontal line. This makes it possible
    for a square component with four pins (such as a button) to straddle the center
    of the breadboard and have each of its leads on a different pin grouping.


    # Button Pin Assignments


    Speaking of buttons, we are going to use a common type of button called a momentary
    switch in this project. Momentary switches have four terminals that are electrically
    connected in pairs. The adjacent terminals are permanently connected, while the
    opposing terminals are only connected


    ![](img/e10b78d76be679e70031ec7a27b91e4a_97_0.png)


    FIGURE 3-9. Wiring on a full-size breadboard'
  merge: -1
  pgno: 97
- img_proc: true
  md: '# Chapter 3: Binary Timer 81


    when the switch is depressed. To identify which terminals the switch controls,
    they are typically numbered on the back with 1 through 4, where leads 1 and 2
    are permanently connected, as are leads 3 and 4. The circuit diagram for this,
    as well as some examples of correct button wiring, is shown in Figure 3-10.


    Wiring diagonally across the button is always safe. Also, switches typically have
    bumps in the bottom so that they will only fit in the center rails in one direction,
    and in this orientation it is safe to wire across pins on the same side of the
    breadboard. In contrast, if you wired components across pins 1 and 2 on the left
    side in Figure 3-10, it would cause a short. This would be the same as if the
    button were held down permanently, which would defeat the purpose of wiring in
    a button since it would always appear to be on.


    # Completing the Wiring


    Now that you know how to wire LEDs and buttons, we are going to complete the wiring
    so that we have all 17 LEDs for our time and four control buttons hooked up to
    individual GPIO pins. The wiring diagrams and pin assignments in this example
    assume that you have one of the newer Raspberry Pi boards, such as the B+, A+,
    or 2.


    ![](img/e10b78d76be679e70031ec7a27b91e4a_98_0.png)


    FIGURE 3-10. Typical button connections and examples of correct wiring'
