  md: 'No discussion of embedded development would be complete without the creation
    of an autonomous robot. Having a robot that can utilize sensors to analyze its
    environment and can move by itself brings your embedded projects to life.


    We are going to build a simple tank that can follow a track and pause for obstacles.
    It will be able to accurately (and quickly) follow a black line on a white surface
    and identify if there are any blockages on the track. Also, we will use a simple
    infrared transmitter to issue commands to the robot.


    # Bill of Materials


    For the project we are going to utilize the Makeblock robotic platform. This will
    allow us to build a modular robot that can be customized to add different motors
    and sensors easily.


    Figure 5-1 is a photo showing all of the parts we need to build the robot (well,
    everything except the track).


    ![](img/e10b78d76be679e70031ec7a27b91e4a_151_0.png)


    FIGURE 5-1. Photo of the parts needed'
  merge: -1
  pgno: 151
- img_proc: true
  md: '# Chapter 5: Line Runner 135


    Here is an itemized list of the components:


    +   - Raspberry Pi B+ or 2 For this project I recommend using a Raspberry Pi B+
    or 2 so you can use the new Arduino shields.


    +   - Waveshare Electronics ARP1600 Arduino shield This is the Arduino shield
    I recommend for this project. Any shield that adapts pins without being an Arduino
    microcontroller itself will work fine, but you might have trouble back-powering
    the Raspberry Pi.


    +   - Makeblock Starter Robot Kit (IR Version) This has most of the parts we need
    to build our line-follower robot. You can purchase it and the other Makeblock
    parts directly from www.makeblock.cc/


    +   - Makeblock Me UNO Shield This will replace the Arduino microcontroller with
    the Starter Robot Kit, allowing us to use a Raspberry Pi as the controller.


    +   - Makeblock Me Dual DC Motor Driver The UNO Shield doesn''t have built-in
    motor drivers, so we need to get an extra external board for this. Fortunately
    it comes with two motor drivers, which is just enough for controlling the two
    motors of your robot''s treads.


    +   - Makeblock Me Line Follower This is the line follower module that is compatible
    with the Makeblock platform.


    +   - White/black gaffer tape In order to have a clearly visible line for the
    robot to follow, it helps to lay down a track to follow. If your ground is light
    enough, you may be able to get away with a strip of black. Otherwise, I recommend
    a 4-inch white tape strip with a 1-inch black tape strip down the center.


    +   - AA batteries You need six total to power the robot. It is easy to go through
    a lot of batteries, especially when you are debugging, so rechargeable NiMH batteries
    are a good idea.


    +   - USB battery To stabilize the Raspberry Pi power, you will need a USB battery
    in addition to the backpower from the Makeblock shield. The Jackery Bar recommended
    for the IoT Hat project in the last chapter will work great.


    This set of components provides everything you need to build the line runner robot
    using a Raspberry Pi B+ or 2.'
