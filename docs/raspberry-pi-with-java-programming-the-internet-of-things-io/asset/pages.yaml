  md: '# 102 Raspberry Pi with Java: Programming the Internet of Things


    This chapter shows you how to take advantage of your technical capabilities to
    build a magic prop that you can use to impress your friends. They, will probably
    be impressed with your wearable Raspberry Pi hacking skills than your magic skills,
    but in either case it makes for a great conversation piece.


    We are going to build a magic top hat that is capable of divining the values of
    seemingly ordinary playing cards. By simply brushing the playing cards over the
    top of the hat or dropping them in the hat one at a time, we will instantly know
    the value of whatever card in the deck was used. With a little clever scripting,
    this will allow us to trick the audience in believing that we can read the mind
    of our volunteers.


    # Bill of Materials


    The IoT Pi is a great project to get started with demonstrate wearable computing.
    You can build the entire project with a small set of components, and assembly
    doesn''t even require sewing (although if you are handy with a needle and thread,
    feel free to make the installation more permanent).

    Here is itemized list of the components:


    +   - Raspberry Pi A+ This is the mainly of all the projects in this book. I choose
    the A+ model shown in Figure 4-1 because it is fairly compact, reduces power,
    and the project doesn''t need USB and Ethernet ports. However, you can also do
    this project with any other Raspberry Pi model of your choice.


    +   - Wi-Fi Adapter allows us to remotely connect to the Raspberry Pi A+ since
    it has no Ethernet port. A common adapter with built-in support is the Edimax
    EW-7811Un Wi-Fi module.


    +   - Magician''s top hat Any tall, black hat you have have around the house will
    do. Costume supply or theatrical prop stores are a great store for this type of
    hat.


    +   - NFC/RFID card reader This project is designed for a card reader with the
    PN532 chipset, which supports reading Mifare Ultralight tags. A number of hardware
    vendors sell breakout boards using this chipset, and a couple I can recommend
    are the PN532 Breakout Board from Adafruit (https://www.adafruit.com/products/364)
    and the ITEAD PN532 NFC Module from ITEAD Studio (http://imall_itestudio.com/im130625002.html).'
