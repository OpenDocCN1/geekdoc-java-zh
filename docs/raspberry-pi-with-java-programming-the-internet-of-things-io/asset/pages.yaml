    # Setting Up a Hostname


    If your Raspberry Pi gets its IP address from DHCP, the address can change on
    every reboot. If you are running the Raspberry Pi headless (without a monitor
    or display), this can make it a chore to search for the new IP address. A good
    alternative is to use Bonjour/Zeroconf, which broadcasts your hostname over multicast.
    You can then refer to your Raspberry Pi as raspberrypi.local (or, in general,
    hostname.local) from anywhere on your local network.


    The first step is to set a unique hostname. This can be done from the Advanced
    Options in the Raspberry Pi configuration utility. To bring up the configuration
    utility from the command line, type the following:


    ```

    sudo raspi-config

    ```


    After setting the hostname, you will be asked to reboot the Raspberry Pi to update
    the network configuration. After reboot, you can install Bonjour on the Raspberry
    Pi by running the following command:


    ```

    sudo apt-get install libnss-mdns

    ```


    After this command completes, you are ready to access the Pi on the network. From
    any computer on the same network where multicast packets reach, you can refer
    to the IP address of your Pi with hostname.local. For example, Listing 1-2 shows
    the output of pinging my Raspberry Pi with hostnamenighthackingpi.


