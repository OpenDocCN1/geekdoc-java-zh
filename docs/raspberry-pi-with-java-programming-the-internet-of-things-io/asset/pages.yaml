  md: '# Chapter 6: Tea Station 179


    This will start Minicom at 2400 baud, which is the default baud rate of the Scout
    Pro. Unfortunately, the Scout Pro defaults to using 7-bit instead of 8-bit communication,
    which is required for communicating with the Java APIs. To modify the serial settings
    on the Scout Pro, refer to your owner''s manual, but generally the steps should
    be similar to the following:


    +   1. If the scale is on, turn it off. Then turn it on holding the power button
    (labeled "ON/or T Off") until you get to the menus.

    2. Press Print a few times (about four) to get to the RS232 prompt.

    3. Press the power button to enter the RS232 menu.

    4. Press Print a couple times (about two) to get to the parity prompt.

    5. Press the power button to enter the parity menu.

    6. Press Print until you get to the "8-none" item (about one time).

    7. Press the power button to set the parity.

    8. Turn off the scale and turn it on normally.


    In comparison, the Value 7000 series are much easier to enter and navigate. However,
    you won''t need to change the default settings unless you accidentally changed
    them or purchased a unit that was modified.

    Once you have the correct scale settings and have launched Minicom, you can test
    connectivity by pressing the Print button on the scale. Figure 6-9 shows you the
    return value for a properly configured Scout Pro scale. In contrast, if you don''t
    have the right parity set, you will get garbled text as shown in Figure 6-10.

    The Value output looks exactly the same except it having fewer spaces.

    If you have trouble getting anything to show up, you may have misconfigured the
    Raspberry Pi serial or connected the cables incorrectly. The RX/TX lights on the
    NKC Electronics board are a handy debugging aid; they will light up when you press
    the Print button on the scale to let know that data is being transmitted. The
    NullSom board has a smaller footprint, but unfortunately is missing any transmission
    indicator lights.




    +   Are the GPIO cables connected to the correct ports? You can use a multimeter
    to test continuity and safely swap the RX/TX pins for testing in case you connected
    them backward.'
