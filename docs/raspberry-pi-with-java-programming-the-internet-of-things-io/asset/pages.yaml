  md: '# Counting Down in Binary


    The simplest and least expensive device to hook up to GPIO pins on a Raspberry
    Pi is an LED. In this project we are going to hook up a whole bunch of LEDs to
    create a binary clock that ticks down from our target time to 0. Since most time
    is represented using hours, minutes, and seconds in base-10, a binary representation
    requires a little bit of conversion that can be done in several different ways,
    so we''ll tackle that topic first.


    # Implementing a Binary Timer


    This section presents three different ways to implement a binary timer or clock,
    all of which have advantages and disadvantages.


    # Binary Coding of Sexagesimal Digits


    The current time system of hours, minutes, and seconds dates back to the ancient
    Sumerians in 3rd millennium b.c. They had a numerical system based on 60, which
    is a convenient way to use for angles and fractions since it is evenly divisible
    by so many factors (http://en.wikipedia.org/wiki/Sexagesimal). The same is true
    of time, where hours and minutes are evenly subdivided into halves, thirds, quarters,
    and even sixths. The subdivision of a day into 24 hours does not follow this rule,
    but it is thought to have originated from either the ancient lunar cycle or finger
    counting using the 12 bone joints. Since time was originally subdivided using
    sundials and constellations, dividing the light and dark portions of the day into
    12 parts (www.scientificamerican.com/article/experts-time-division-days-hours-minutes/).


    Simple binary encoding of digits on a digital clock is the most common way of
    implementing binary clocks, because it is fairly easy to read. You only need to
    know your binary digits up to 9 and can easily convert in your head to sexagesimal
    hours/minutes/seconds. However, this lacks true “geekiness” since you are re-encoding
    a base-10 representation of a-60 subdivision. An example of a clock using a binary
    encoding of sexagesimal digits is shown in Figure 3-6.


    A true interpretation of binary sexagesimal encoding would be to encode each of
    the time units as its own six-digit binary number, as shown in Figure 3-7.


    However, this makes it much more difficult to read, and still does not get away
    with the historic baggage of representing time in sexagesimal divisions.'
