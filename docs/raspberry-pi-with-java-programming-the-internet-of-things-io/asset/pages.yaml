  md: '# 236 Raspberry Pi with Java: Programming the Internet of Things


    to convert from an HDMI signal. It is also unique in that it exposes the full
    graphics capabilities of the Pi, including 3D acceleration and fast refresh rates,
    unlike some of the SPI-based displays.


    The technology behind the Kippah is reconfiguration of the GPIO ports using a
    device tree overlay. By reconfiguring the GPIO ports to instead carry display
    interface information, you can directly integrate native LCD displays that are
    commonly used in small portable electronics. It is even possible to support touch
    through a USB connection.


    Of course, all this power comes at a price. The Kippah sits on top of the Raspberry
    Pi like a hat, and it takes over all of the GPIO pins, including all the buses,
    I2C, SPI, and Serial. You are left with six standard GPIO pins for program usage,
    which is why we could not use it for the Tea Station.


    Fortunately, with some clever wiring, six pins are enough to implement our controller
    gamepad. Also, the graphics performance and low power consumption is much more
    important than additional GPIO pins for expansion, so it is perfect for this project.


    Here is what you need:


    +   - Adafruit DPI TFT Kippah for Raspberry Pi with Touch Support https://www.adafruit.com/products/2453

    - Two 40-pin FPC Extension Board + 200mm Cable https://www.adafruit.com/products/2098

    - 4.3" TFT Display - 480×272 with Touchscreen https://www.adafruit.com/products/1591


    > NOTE

    Even though I recommend getting the Kippah with touch support, you technically
    do not need it for this project. Similarly, the 4.3" screen has touch support
    that we will not use. However, feel free to hook up the touchscreen and test it
    out your own.


    I recommend getting two of the 40-pin extension cables in case you break one during
    assembly. These ribbon cables are very sensitive and can easily get damaged from
    a sharp kink or rough handling during insertion in a socket. You may want to get
    two touchscreens for the same reason, although I have'
