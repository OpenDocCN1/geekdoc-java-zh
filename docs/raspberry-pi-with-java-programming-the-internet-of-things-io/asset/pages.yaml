  md: The first step is to set up your SD card. If you have a Model 2, B+, or A Raspberry
    Pi, then this will be in the form of a microSD card. If you have the older Model
    B or A, then this will be a full-size SD card. Both types of cards
  merge: -1
  pgno: 19
- img_proc: true
  md: '# Chapter 1: Baking Pi 3


    ![](img/e10b78d76be679e70031ec7a27b91e4a_20_0.png)


    FIGURE 1-1. NOOBS microSD SD card with full-size adapter


    operate the same, and microSD cards usually come with adapters to fit in full-size
    slots, so that there is the obvious choice. The difference in size between a microSD
    card and a full-size SD card can be seen in Figure 1-1.


    The Raspberry Pi foundation cards ship with NOOBS preinstalled, as photographed
    in Figure 1-1. This is a good trade-off between cost, convenience, and performance,
    and is recommended for anyone who is just getting started. Most online retailers
    offer a Raspberry Pi bundle that includes the NOOBS SD for a small incremental
    cost.


    If you have purchased an SD card with NOOBS preinstalled, skip to the section
    entitled "Installing Raspian."


    # Purchasing Compatible SD Cards


    If you need a higher-performance or larger-capacity card, you can buy SD cards
    and format them yourself. This is also typically less expensive, especially if
    you are purchasing in bulk. The key criteria to use when selecting an SD card
    are size, write performance, and quality.


    The minimum size card you can use with the Raspian distribution is 4GB, although
    this is not large enough to support NOOBS and will leave little room for your
    software. At least 8GB is recommended, and for a small incremental cost you can
    get a 16GB card. The largest-capacity card that is'
  merge: -1
  pgno: 20
- img_proc: true
  md: '# Raspberry Pi with Java: Programming the Internet of Things


    supported in the Raspberry Pi is 64GB, although this will only be helpful if you
    are doing data-intensive tasks, as storing sensor data or video over a long period
    of time.


    When shopping for SD cards, you can find a class identifier written on them. A
    higher number indicates better write performance, with the minimum sustained write
    speed equal to the number. For example, a class 4 card is tested to support a
    sustained write speed of 4 megabytes per second (MBPs). Similarly, a class 10
    is tested to support a sustained write speed of 10MBPs. This matters you if you
    are developing an application that will write a large amount of sequential data.
    It can also significantly the initial setup time of your card. However, this is
    an indication of neither read performance nor nonsequential write performance,
    so the real-world performance of your SD card may vary.


    Perhaps the most important factor is the quality of the card. Buying from a well-known
    and reputable vendor greatly increases the chances you will get the size and performance
    you are paying for. Unknown manufacturers and ill-reputed vendors may sell you
    low-quality or counterfeit cards that perform below their advertised specs. A
    good community resource for researching SD card compatibility and performance
    is the Raspberry Pi SD cards page on the Embedded Linux (eLinux) wiki: http://elinux.org/RPI_SD_cards.


    # Formatting SD Cards


    The NOOBDS installer requires that your SD card be formatted with a File Allocation
    Table (FAT) filesystem. Both FAT16 (more commonly referred to as FAT) and FAT32
    are supported, but not ExFAT. If you have purchased a large SD card, it often
    comes with ExFAT, so you will need to reform it with FAT32 in order to proceed
    with the NOOBDS install. The easiest way to make sure your SD card is formatted
    correctly is to use the SD Association''s SDFormatter utility on OS X or Windows:
    https://www.sdcard.org/downloads/formatter-4/.


    Figure 1-2 shows a screenshot of the SDFormatter utility looks like on OS X. Make
    sure that the correct SD card is selected so that you don''t accidentally delete
    the wrong drive, and then choose the Overwrite Format option. Specify the name
    of the card and click the Format button. This process will take a while depending
    upon the speed and size of your SD card, so this may be a good time to take a
    coffee break.


    ![](img/e10b78d76be679e70031ec7a27b91e4a_21_0.png)'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# Chapter 1: Baking Pi 5


    ![](img/e10b78d76be679e70031ec7a27b91e4a_22_0.png)


    FIGURE 1-2. SDFormatter utility


    If you are on Linux, you can accomplish the same thing with the GParted tool,
    which is a visual disk manager. Make sure that you select the correct partition
    and format as FAT or FAT32.

    Once you have a properly formatted card, the rest of the installation is as simple
    as following these steps:


    +   - Download the latest version of NOOBS from the Raspberry Pi website: https://www.raspberrypi.org/downloads/

    - Unzip the downloaded NOOBS archive. Most operating systems come with built-in
    unzipping functionality.

    - Copy the contents of the extracted folder to your SD card. Make sure that you
    do not have an enclosing folder.'
  merge: -1
