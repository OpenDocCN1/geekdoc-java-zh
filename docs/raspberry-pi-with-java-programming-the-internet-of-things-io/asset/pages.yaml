  md: '# Chapter 3: Binary Timer 79


    The length of a year is slowly increasing! Through astronomical observations in
    the 19th and 20th centuries, scientists have discovered that the solar year is
    not consistent, and on average is slowly lengthening (http://en.wikipedia.org/wiki/Second).


    For the preceding reasons, the International System of Units (SI) in 1967 defined
    the unit for a second as "...the duration of 9 192 631 770 periods of the radiation
    corresponding to the transition between the two hyperfine levels of the ground
    state of the caesium 133 atom." Reference: SI Brochure, 8th edition, "Unit of
    time (second)" (www.bipm.org/en/publications/si-brochure/second.html).


    If the earth were populated by alien colonists, this is the sort of time system
    they would most likely employ (with a different constant based on their home planet).
    Anchoring our binary counting algorithm on an atomic reaction is also the highest
    level of keeneness attainable, so we are going with this as the baseline. It also
    happens to be practical since stopwatches and timers are typically based on seconds.


    To make this possible, we are going to set up a multicolor LED display arranged
    as follows:


    +   - 2 red LEDs 4096–16,383 seconds [1.14 to 4.55 hours]

    - 6 yellow LEDs 64–4095 seconds [1.07 to 68.25 seconds]

    - 6 green LEDs 0–63 seconds

    - 3 blue LEDs 0.125–0.875 seconds


    So with the baseline model of the Raspberry Pi (Model B revision 1), which has
    only 17 GPIO pins, we can represent quite a reasonable range of time for the purposes
    of our timer (4.5 hours with 0.125-second precision). In practice, you will probably
    have at least a Model B revision 2 with 21 pins available, or more likely, one
    of the new A+, B+, or 2 models with a full 26 GPIO pins. Finally, the color-coding
    is a helpful guide to approximate remaining time in hours or minutes for large
    values.


    # Wiring the Breadboard


    Using a breadboard is a great way to start with your embedded designs and projects,
    because it allows you to quickly prototype different ideas. Unlike soldering components
    or designing printed circuit boards,'
  merge: -1
