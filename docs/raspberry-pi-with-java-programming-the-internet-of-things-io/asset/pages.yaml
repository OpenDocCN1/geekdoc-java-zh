  md: '# Introduction


    The Raspberry Pi has started a revolution in embedded development, reducing the
    barriers of entry for computer programmers to build devices that interact with
    the physical world. Java SE and Java ME Embedded use the Raspberry Pi as their
    reference platform, making the platform of choice for Java developers who are
    getting started in embedded development. Java also comes preinstalled on the official
    Raspbian image, making it the highest-performing high-level language available
    for the Raspberry Pi. We, the authors, took advantage of the sweet spot of programming
    the Raspberry Pi with Java to help you get up to speed on developing for the Internet
    of Things, and joining the IoT revolution.


    # Who Is This Book For?


    Whether you are an experimenting hobbyist or a seasoned professional, you''ll
    find this book to be of value for increasing your skill in creating applications
    that run on embedded devices. We purposely chose relatively low-cost projects
    and associated hardware to reduce the barrier to entry. We also employed a project-based
    learning approach with a gradual learning curve to make this book approachable.


    # What Does This Book Cover?


    The pages of this book contain several projects designed to increase your skill
    in embedded application development applicable to various home and industry scenarios.
    Here''s a rundown of what you can expect to see as you work through this book.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Chapter 1: Baking Pi This chapter walks you through the process of setting
    up your Raspberry Pi, networking it to your computer, and testing it with a simple
    Java application.


    Chapter 2: Your First Java Project In this chapter, you''ll set up a Java Integrated
    Development Environment (IDE), specifically NetBeans, on your computer. You''ll
    use this IDE for developing and remotely deploying Java applications on the Raspberry
    Pi. You''ll also build a tasty project in which Java and a Pi will be leveraged
    to brew a perfect cup of coffee.


    Chapter 3: Binary Timer You''ll utilize the GPIO (general purpose I/O) capabilities
    of the Raspberry Pi to create a binary timer. In the process you''ll discover
    how to use the Pi4 library, written by Robert Savage, to make quick work of a
    discrete-device I/O project.


    Chapter 4: IoT Hat This chapter guides you through the steps of creating a magic
    hat that demonstrates various forms of device I/O. This project certainly has
    a fun example of wearable computing, and one that will amaze your friends!


    Chapter 5: Line Runner In this chapter, you''ll create an autonomous robot by
    utilizing the Makeblock robotics platform and, of course, a Raspberry Pi with
    Java.


    Chapter 6: Tea Station Revisiting the coffee-brewing example from Chapter 2, you''ll
    leverage higher-precision equipment, and employ a touchscreen, to make a perfect
    cup of tea.


    Chapter 7: Autonomous Drone You''ll turn a quadcopter into an autonomous drone
    by outfitting it with a Raspberry Pi for its brain.


    Chapter 8: Retro Video Game Emulator In this chapter, you will build a Java-powered
    emulator that lets you play classic Nintendo Entertainment System (NES) games
    on the Raspberry Pi.'
  merge: -1
  pgno: 15
- img_proc: true
  md: '# Chapter 9: NightHacking RetroPi This chapter shows you how to turn the NES
    emulator from Chapter 8 into a portable gaming system with a retro-style case
    produced by a 3D printer, enabling you to revive the classic video gaming experience
    on modern hardware.


    # Code Downloads


    You can download the code samples shown in this book from the McGraw-Hill Professional
