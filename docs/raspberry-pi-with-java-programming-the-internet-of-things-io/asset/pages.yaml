    \  boolean isStable();\n  void waitFor(DoublePredicate condition);\n  void waitForStable(DoublePredicate\
    \ condition);\n  void tare() throws UnsupportedOperationException;\n  void close();\n\
    }\n```\n\nThere are two additional scale concepts introduced here to improve the\
    \ reliability and consistency of our coffee recipe: a \"stable\" scale value,\
    \ and a programmatic \"tare\". The concept of stability is important, because\
    \ scales do not immediately register new weights, so the value can fluctuate a\
    \ bit before it settles. Some scales implement a concept of stability directly\
    \ in their data reporting; however, the USB scales do not do this. As a workaround,\
    \ when updating the weight we will compare the last few results to see if we have\
    \ reached a steady state, as shown in Listing 2-12.\n\n# Listing 2-12 Update of\
    \ current weight value with stability calculation\n\n```\nprivate void updateWeight(int\
    \ newWeight) {\n  boolean isStable = true;\n  for (int i = 0; i < pastWeights.length\
    \ - 1; i++) {\n    pastWeights[i] = pastWeights[i + 1];\n    if (pastWeights[i]\
    \ != weight) {\n      isStable = false;\n    }\n  }\n  pastWeights[pastWeights.length\
    \ - 1] = weight;\n  if (weight != newWeight) {\n    isStable = false;\n    weight\
    \ = newWeight;\n  }\n  stable = isStable;\n}\n```"
