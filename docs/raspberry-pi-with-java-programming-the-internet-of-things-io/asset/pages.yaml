  md: '# Chapter 3: Binary Timer


    While it is useful to know how to use both libraries, I don''t recommend mixing
    them in the same project since it can be difficult to deal with conflicts between
    port usages across the two libraries.


    # Installing the Device I/O Library


    Currently, the Device I/O library is not released with the version of Java as
    the Raspberry Pi. Also, there are no binary builds available, so you have to build
    the library from source. Fortunately, this is a fairly easy process and can be
    accomplished directly on the Raspberry Pi.


    > **TIP**nIn case the availability of binaries or the build process changes after
    the time of your writing, we are advised to check the official OpenJDK I/O page
    and wiki at the following links:

    http://openjdk.java.net/projects/dio/

    https://wiki.openjdk.java.net/display/dio/Main


    To start, download the source code from the OpenJDK repository by executing the
    following command from an SSH prompt or the console on your Raspberry Pi:


    ```

    sudo apt-get install mercurial

    ```


    Next, clone the Device I/O library source code to your Raspberry Pi.

    The following command creates a folder called dio in your current working directory
    with the latest source code:


    ```

    hg clone http://openjdk.java.net/dio/dev

    ```


    To build the source code, you need to run the command on the newly downloaded
    code. The build script also requires a few variables to be set up so it knows
    where to access the Raspberry Pi native libraries and the Java 8 JDK:


    ```

    cd dio

    export PI_TOOLS=/usr

    export JAVA_HOME=/usr/lib/jvm/jdk-8-oracle-arm-vfp-hflt

    make

    ```'
