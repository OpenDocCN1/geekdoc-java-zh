    # # Printing the Case


    Now that you have gotten a behind-the-scenes look at the case design, it is time
    to try printing it on your own 3D printer (or perhaps a 3D printer that you are
    borrowing or sharing at a Makerspace).


    The standard format for 3D models used by printers is stereolithography (STL,
    a format created by 3D Systems). I exported an STL file corresponding to each
    of the parts of the RetroPi, and uploaded them to a Thingiverse project here:
    https://www.thingiverse.com/thing:993901.


    In order to print these models, you will need to convert the 3D geometries into
    instructions for the printer using a program called a slicer. Download each of
    the STL files and then import them into a slicer program that works with your
    3D printer. A popular open source slicer application that works with a wide variety
    of printers and happens to be developed by the Ultimaker team called Cura. As
    shown in Figure 9-8, I used Cura for this project.'
