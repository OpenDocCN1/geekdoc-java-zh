    # Bill of Materials


    The set of materials for this project is oriented toward the creation and prototyping
    of the internal components that we need in the handheld system that is assembled
    in Chapter 9, If you plan on putting together the 3D handheld system, make sure
    to get exactly the same items listed here so that they will fit in the custom
