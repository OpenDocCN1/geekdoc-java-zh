    \ Some points to highlight about this implementation\n\n+   - Rather than getting\
    \ the value and converting it to grams (my preferred unit of measurement), I simply\
    \ check the unit returned and issue a command to change the scale unit.\n\n+ \
    \  - Sometimes the scale returns odd values, either due to stale data upon initialization\
    \ or transmission errors on the serial line. This could result in a number of\
    \ exceptions from ArrayIndexOutOfBoundsNumberFormatException, so checking for\
    \ a Throwable (and logging it) is a good catch-all.\n\n+   - Since you are running\
    \ in continuous print mode, skipping readings due to incorrect inputs or occasional\
