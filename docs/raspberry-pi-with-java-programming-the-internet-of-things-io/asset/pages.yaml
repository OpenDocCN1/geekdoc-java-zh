  md: '# 192 Raspberry Pi with Java: Programming the Internet of Things


    +   - Multiple devices can be hooked up to the same pin, sharing the same communication
    wire and controlled by a single master.


    +   - It can be used over fairly long distances. With dedicated master hardware
    and fast lines, this can be up to 200 meters (see www.maximintegrated.com/app-notes/index.mvp/id/148).
    However, when using the Raspberry Pi''s software implementation (known as bit
    banging, which refers to serial communications using software instead of dedicated
    hardware), you should keep the distance to 1 meter for reliable communication.


    I recommend getting the Adafruit high-temperature, waterproof packaging for the
    sensor that comes with a half-meter cable. This will give you an easy way to monitor
    an electric kettle near your setup (but far away that it is not a water hazard)
    and allow you to fully immerse the sensor without damaging it.


    # Testing the DS18B20


    The DS18B20 sensor can be sampled from the Raspberry Pi by utilizing a kernel
    module that emulates the Dallas 1-Wire protocol in software. Doing bit banging
    in software is unreliable, but the protocol is forgiving enough that it works
    over short distances.


    To enable the kernel module, add the following comment and line to /boot/config.txt
    file on your Raspberry Pi:


    ```

    # Turn on 1-Wire support

    dtoverlay=w1-gpio

    ```


    After editing this file, reboot your Raspberry Pi. This should also automatically
    load the correct kernel modules for 1-Wire support. You can check for this after
    booting by running the lsmod command, which should show the items w1_therm, w1_gpio
    (among other modules) as shown in Listing 6-13.


    **Listing 6-13** Partial output of lsmod showing 1-Wire modules


    | | | |

    |---|---|-|

    | w1_therm | 3225 | 0 |

    | w1_gpio | 4287 | 0 |

    | wire | 31248 | 2 w1_gpio,w1_therm |'
