  md: '# About the Authors


    Stephen Chin is the Lead Community Manager at Oracle and JavaOne Co-Chair. He
    has keyed numerous Java conferences around the world, including JavaOne, where
    he is a four-time Rock Star Award recipient. Stephen is an avid motorcyclist who
    has done several European evangelism tours, interviewing hackers in their natural
    habitat and posting the videos on #nighthacking.com/. When he is not traveling,
    Stephen enjoys teaching kids how to do embedded and robot programming with his
    12-year-old daughter.


    James Weaver is a Java developer, author, and speaker with a passion for helping
    Java to be increasingly leveraged in rich-client applications and the Internet
    of Things. James has authored and co-authored several books, including Inside
    Java, the Beginning JEE series, and the Pro JavaFX series. He speaks internationally
    at software technology conferences about Java, JavaFX, IoT, and cloud computing.
    James tweets at @JavaFxpert, and blogs at http://javaFxpert.com and http://CultEar.com.


    # About the Technical Editor


    Mark Heckler is a Pivotal Developer Advocate, conference speaker, and published
