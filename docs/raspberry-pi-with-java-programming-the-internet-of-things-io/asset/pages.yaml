    # Attaching the Screen


    Now that the internals are assembled and tested, it is time to attach the display.
    I tried to make it as easy as possible to do the display assembly, but since you
    are working with a very fragile ribbon cable, be very gentle.


    The first step is to attach the screen base to the hinge. It should snap in without
    too much force and swivel on the axis (don''t attach the pins yet; we will get
    to that later). Orient the screen so that you can easily access both sides of
    the ribbon cable slot and gently slide the ribbon cable through as'
