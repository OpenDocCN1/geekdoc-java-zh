  md: "The curriculum in amateur librarianship develops aspects and implications of\
    \ this definition. Parts of this curriculum have evolved over a number of workshops\
    \ and talks previously held within the Public Library project, parts of it are\
    \ yet to evolve from a process of future research, exchange and knowledge production\
    \ in the education process. While schematic, scaling from the immediately practical,\
    \ strategic and tactical, to reflexive registers of knowledge, there are actual\
    \ – here unnamed – people and practices we imagine we could learn from.\n\nThe\
    \ first iteration of this curriculum could be either a summer academy rostered\
    \ with our all-star team of librarians, designers, researchers and teachers, or\
    \ a small workshop with a small group of students delving deeper into one particular\
    \ aspect of the curriculum. In short it is an open curriculum: both open to educational\
    \ process and contributions by others. We welcome comments, derivations, and additions.\n\
