- md: '

    # Amateur Librarian - A Course in Critical Pedagogy


    Tomislav Medak & Marcell Mars (Public Library project)


    A proposal for a curriculum in amateur librarianship, developed through the activities
    and exigencies of the Public Library project. Drawing from a historic genealogy
    of public library as the institution of access to knowledge, the proletarian tradition
    of really useful knowledge and the amateur agency driven by technological development,
    the curriculum covers a range of segments from immediately applicable workflows
    for scanning, sharing and using e-books, over politics and tactics around custodianship
    of online libraries, to applied media theory implicit in even practices of amateur
    librarianship. The proposal is made with further development,


    # PUBLIC LIBRARY, A POLITICAL GENEALOGY


    Public libraries have historically achieved as an institutional space of exemption
    from the commodification and privatization of knowledge. A space where works of
    literature and science are housed and made accessible for the education of every
    member of society regardless of their social or economic status. If, as a liberal
    narrative has, education is a prerequisite for full participation in a body politic,
    it is in this narrow institutional space that citizenship finds an important material
    base for its universal realization.


    The library as an institution of public access and popular literature, however,
    did not develop before a series of transformations and social upheavals unfolded
    in the course of 18th and 19th century. These developments brought about by a
    flood of books and political demands pushing the library to become embedded in
    an egalitarian and democratizing political horizon. The historic backdrop for
    these developments was the rapid ascendancy of the book as a mass commodity and
    the growing importance of the reading culture in the aftermath of the invention
    of the movable print. Having emerged almost in parallel with capitalism, by the
    early 18th century the trade in books was rapidly expanding. While in the 15th
    century the libraries around the monasteries, courts and universities of Western
    Europe contained no more than 5 million manuscripts, the output of printing presses
    in the 18th century alone exploded to formidable 700 million volumes. [11] And
    while this provided a vector for the emergence of a bourgeois reading public and
    an unprecedented expansion of modern science, the culture of reading and Enlightenment
    remained largely a privilege of the few.


    Two social upheavals stood to change that. On 2 November 1789 the French revolutionary
    National Assembly passed a decision to seize all library holdings from the Church
    and aristocracy. Millions of volumes were transferred to the Bibliothèque Nationale
    and local libraries across France. At the same time capitalism was on the rise,
    particularly in England. It massively displaced the impoverished rural population
    into growing urban centres, propelled the development of industrial production,
    and by the mid-19th century, introduced the steam-powered rotary press into the
    commercial production of books. As books became more easily-produced, the commercial
    subscription libraries catering to the better-of-art parts of society blossomed.
    This brought the class aspect of the nascent demand for public access to the fore.


    After the failed attempt to introduce universal suffrage and end the system of
    political representation based on property entitlements the Reform Act of 1832,
    the English Chartist movement started to open reading rooms and cooperative lending
    libraries that would quickly become a popular hotbed of social exchange between
    the lower classes. In the aftermath of the revolutionary upheavals of 1848, the
    ruling classes finally consented to the demand for tax-financed public libraries,
    hoping that the access to literature and edification would after all help educate
    skilled workers that were increasingly in demand and ultimately hegemonize the
    working class for the benefits of capitalism''s culture of self-interest and competition.
    [22]


    # REALLY USEFUL KNOWLEDGE


    It''s no surprise that the Chartists, reeling from a political defeat, had started
    to open reading rooms and cooperative lending libraries. The education provided
    to the proletariat and the poor by the ruling classes of that time consisted,
    indeed, either of a pious moral edification serving political pacification or
    of an inculcation of skills and knowledge useful to the factory owner. Even the
    seemingly noble efforts of the Society for the Diffusion of the Useful Knowledge,
    a Whig organization aimed at bringing high-brow learning to the middle and working
    classes in the form of simplified and inexpensive publications, were aimed at
    dulling the edge of radicalism of popular movements. [44]


    These efforts to pacify the downtrodden masses pushed them to seek self-organized
    education that would provide them with literacy and really useful knowledge –
    not applied, but critical knowledge that would allow them to see through their
    own political and economic subjetion, develop radical politics and innovate shadow
    social institutions of their own. The radical education, reliant on meagre resources
    and time of the working class, developed in the informal setting of household,
    neighbourhood and workplace, but also through radical press and communal reading
    and discussion groups. [55]


    The demand for really useful knowledge encompassed a critique of “all forms of
    ‘provided’ education” and of the liberal conception “that national education was
    a necessary condition for the granting of universal suffrage.” Development of
    radical “curricula and pedagogies” formed a part of the arsenal of “political
    strategy as a means of changing the world.” [66]


    # CRITICAL PEDAGOGY


    This is the context of the emergence of the public library. A historical compromise
    between a push for radical pedagogy and a response to dull its edge. And with
    the age of digitization, where one would think that the opportunities for access
    to knowledge have expanded immensely, public libraries find themselves increasingly
    limited in their ability to acquire and lend digital and paper editions. It is
    a sign of our radically unequal times that the political emancipation finds itself
    on a defensive fighting again for this material base of pedagogy against the rising
    forces of privatization. Not only has mass education become accessible only under
    the condition of high fees, student debt and adjunct peerage, but the useful knowledge
    that the labour market and reproduction of the neoliberal capitalism demands has
    become the one and only rationale for education.


    No wonder that over the last 6-7 years we have seen self-education, shadow libraries
    and amateur librarians emerge again to counteract the contraction of spaces of
    exemption that have been shrunk by austerity and commodity.


    The project Public Library was initiated with the counteraction in mind. To help
    everyone learn to use simple tools to be able to act as an Amateur – to digitize,
    to collect, to share, to preserve books and articles that were unaffordable, unavailable,
    undesirable in the troubled corners of the Earth we hail from.


    Amateur Librarian played an important role in the narrative of Public Library.
    And it seemed it was successful. People easily join the project by ''becoming''
    a librarian using Calibre 71 and [let''s share books]. [81] Other aspects of the
    Public Library narrative add a political articulation to that simple yet disobient
    act. Public Library detects an institutional crisis in education, an economic
    deadlock of austerity and a domination of commodity logic in the free of copyright.
    It conjures the amateur librarians'' practice of sharing books/catalogues as a
    relevant challenge against the convergence of that crisis, deadlock and copyright
    regime.


    To understand the political and technological assumptions and further develop
    the strategies that lie behind the countermeasures of amateur librarians, we propose
    a curriculum that is indebted to a tradition of critical pedagogy. Critical pedagogy
    is a productive and theoretical practice rejecting an understanding of educational
    process that reduces it to a technique of imparting knowledge and a neutral mode
    of knowledge acquisition. Rather, it sees the pedagogy as a broader “struggle
    over knowledge, desire, values, social relations, and, most importantly, modes
    of political agency”, “drawing attention to questions regarding who has control
    over the conditions for the production of knowledge.” [9]


    No industry in the present demonstrates more the asymmetries of control over the
    conditions of production of knowledge than the academic publishing. The denial
    of access to outrageously expensive academic publications for many universities,
    particularly in the Global South, stands in stark contrast to the super-profs
    that a small number of commercial publishers draws from the free labour of scientists
    who write, review and edit contributions and the extractive prices their institutional
    libraries have to pay for subscriptions. It is thus here that the amateur librarianship
    attains its poignancy for a critical pedagogy, inviting us to closer formulate
    and unfold its practices in a shared process of discovery.


    # A CURRICULUM


    Public library is:


    - free access to books for every member of society,

    - library catalogue,

    - librarian.

    '
