  mdcn: "\n\n业余图书馆学课程开发了这一定义的各个方面和内涵。该课程的部分已通过此前在“公共图书馆”项目中举办的多次研讨会和讲座演变出来，另一部分则待通过未来教育过程中的研究、交流和知识生产来演变。尽管它是纲括性的，规模涵盖了从即时实用、战略和战术到反思性知识的领域，但存在一些真实的（此处未命名）的人和实践，我们可以想象可以从他们中学习。\n\
    \n该课程的首次迭代可以是由我们全明星级别的图书员、设计师、研究人员和教师组成的夏季学院课程表，也可以是由一小部分学生深入研究课程某一特定方面的小型研讨会。简而言之，这是一个开放课程：既对教育过程开放，也欢迎他人的贡献。我们欢迎各种意见、衍生和补充。\n\
