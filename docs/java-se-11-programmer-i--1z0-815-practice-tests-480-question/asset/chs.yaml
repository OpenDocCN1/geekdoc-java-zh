  \ 5.2 练习题答案 - 5 及解析\n\n### 5.1.1 答案：A\n**原因**: 静态重载方法 `join(...)` 在 `JDK 1.8` 中添加，具有如下声明：\n\
  1. `public static String join(CharSequence delimiter, CharSequence... elements)\
  \ {...}`：它返回一个一个新的 `String`，该字符串由 `CharSequence` 元素的拷贝组成，并用指定的分隔符的拷贝连接在一起。例如：\n\
  `String.join(\".\", \"A\", \"B\", \"C\");` 返回 `\"A.B.C\"`\n`String.join(\"+\", new\
  \ String[]{\"1\", \"2\", \"3\"});` 返回 `\"1+2+3\"`\n`String.join(\"-\", \"HELLO\"\
  );` 返回 `\"HELLO\"`\n如果 `delimiter` 为 `null` 或 `elements` 引用 `null`，则抛出 `NullPointerException`。例如：\n\
  `String.join(null, \"A\", \"B\");` 抛出 `NullPointerException`\n`String [] arr = null;\
  \ String.join(\"-\", arr);` 抛出 `NullPointerException`\n但如果单个元素为 `null`，则被视为 `\"\
  null\"`。例如：\n`String str = null; String.join(\"-\", str);` 返回 `\"null\"`\n`String.join(\"\
  ::\", new String[] {\"James\", null, \"Gosling\"});` 返回 `\"James::null::Gosling\"\
  `\n\n2. `public static String join(CharSequence delimiter, Iterable<? extends CharSequence>\
  \ elements) {...}`：它返回一个一个新的 `String`，该字符串由 `CharSequence` 元素的拷贝组成，并用指定的分隔符的拷贝连接在一起。例如：\n\
  `String.join(\".\", List.of(\"A\", \"B\", \"C\"));` 返回 `\"A.B.C\"`\n`String.join(\"\
  .\", List.of(\"HELLO\"));` 返回 `\"HELLO\"`\n如果 `delimiter` 为 `null` 或 `elements`\
  \ 引用 `null`，则抛出 `NullPointerException`。例如：\n`String.join(null, List.of(\"HELLO\"\
  ));` 抛出 `NullPointerException`\n`List<String> list = null; String.join(\"-\", list);`\
  \ 抛出 `NullPointerException`\n但如果单个元素为 `null`，则被视为 `\"null\"`。例如：\n`List<String>\
  \ list = new ArrayList<>(); list.add(\"A\"); list.add(null); String.join(\"::\"\
  , list);` 返回 `\"A::null\"`\n\n请注意：`String.join(\"-\", null);` 会导致编译错误，因为编译器无法将此调用标记为特定的\
  \ `join(...)` 方法。这是一个歧义调用。\n由于编译器意识到给定的无限循环有出口，因此它不会将 `Line n2` 标记为不可达代码。`Line n2`\
  \ 也不会导致任何编译错误。第 3 和第 6 语句也没有编译错误，因为调用 `join(...)` 方法的语法是正确的。\n在 Java 中，允许使用与类名相同的方法名（尽管这不是推荐的做法），因此第\
  \ 1、2、3 语句代表了重载的 `'Sport'` 方法。第 4、5、6 语句代表重载的构造函数，因为没有指定返回类型。所有 6 句都都可以插入到 `Sport`\
  \ 类中。\n\n### 5.1.2 答案：B\n**原因**: 首先给给定的表达式 `-a++` 添加括号（圆括号）。涉及 2 个运算符：单一负号和后置运算符。让我们从表达式和\
  \ `a` 的值开始。\n`-a++; [a = 1000]` `-(a++); [a = 1000]` 后置运算符的优先级高于单一运算符。\n`-(1000);\
  \ [a = 1001]` 在表达式中使用 `a` 的值 (`1000`)，然后将 `a` 的值增加到 `1001`。`-1000; [a = 1001]` `-1000`\
  \ 打印在控制台上。\n\n### 5.1.3 答案：C\n**原因**: 二元加法 (`+`) 的优先级高于 `!=` 运算符。让我们分组表达式：\n`\"\
  Equals \" + 10 != 5`\n`(\"Equals \" + 10) != 5`\n`!=` 是二元运算符，所以我们必须先评估左侧。`+` 是连接运算符。\n\
  `\"Equals 10 != 5` 左侧是 `String`，右侧是 `int`。但 `String` 无法与 `int` 比较。\n\n### 5.1.4\
  \ 答案：A, C, D\n**原因**: `switch` 可以接受原始类型：`byte`、`short`、`int`；包装类型：`Byte`、`Integer`、`Character`；`String`\
  \ 和枚举。`long` 和 `double` 在 `switch` 中无效。`char` 使用的范围是 0 到 65535（无符号），因此它可以存储值 `10`。请注意标识符\
  \ `var` 不是关键字，因此仍然可以使用变量名、方法名或包名，但不能作为类名或接口名。\n\n### 5.1.5 答案：B\n**原因**: 模块 `string.util`\
  \ 有包：`p1.util` 和 `utility`，其模块描述文件 (`module-info.java`) 仅对 `p1.util` 导出。`testing`\
  \ 模块有 `string.util` 的指令。因此，`testing` 模块可以访问 `p1.util` 包中的所有公共类，但没有 `utility` 包。因此，`Test.java`\
  \ 存在编译错误：\n```java\nimport com.utility.StringUtility;\nSystem.out.println(StringUtility.reverse(\"\
  NO\"));\n```\n这是 Java 模块提供的额外封装层，导出的包是可访问的，未导出的不是。\n\n### 5.1.6 答案：B\n**原因**: `Medicines.java`\
  \ 中没有编译错误。通过查看模块描述文件 (`module-info.java`)，可以说：\n- 模块名为：`medicines`\n- `exports com.all\
  \ to elizabeth_hospital;` 这被称为限定导出。如果导出的包（在这种情况下为 `elizabeth_hospital`）可用，编译器会显示警告但编译通过。执行给定的\
  \ `javac` 命令后，你将拥有如下目录/文件结构：\n```\nC:+out\n|---medicines\n|   ---module-info.class\n\
  |   ---com\n|       ---allopathic\n|           ---Medicines.class\n|---src\n|---medicines\n\
  |   ---module-info.java\n|   ---com\n|       ---allopathic\n|           ---Medicines.java\n\
  ```\n\n### 5.1.7 答案：D\n**原因**: 派生类重写了 `Base` 类的 `m1()` 方法。`Base` 类 `m1()` 方法的访问修符是\
  \ `protected`，所以重写方法可以使用 `protected` 或 `public`。但这种情况下重写方法使用了 `default` 修饰符，因此存在编译错误。\n\
  \n### 5.1.8 答案：B\n**原因**: `Predicate` 的 Lambda 表达式是 `s -> s.length() < 4`。这意味着如果传递的字符串长度小于\
  \ 4 则返回 true。因此打印前三个数组元素。\n\n### 5.1.9 答案：C\n**原因**:\n`public abstract interface\
  \ Printable {};`: ✓ 有效，因为 Java 中的 `interface` 是隐式抽象的，所以使用 `abstract` 关键字不会引起任何错误。\n\
  `public interface Printable {protected void print();}` ✗ 接口的抽象方法是隐式的 public，如果你为接口的抽象方法提供访问修符，则只允许\
  \ `public`。由于 `print()` 方法使用了 `protected`，因此导致了编译错误。\n`public interface Printable\
  \ {int i; void print();}` ✗ 接口内部声明的变量是隐式的 `public`、`static` 和 `final`，因此编译器会关于未初始化的\
  \ final 变量 `i` 报错。\n`public interface Printable {void print(); default void log()\
  \ {} private void log1() {} static int getNum() {return-1;}}`: ✗ 根据 Java 8，接口添加了默认和静态方法；根据\
  \ Java 9，接口添加了私有方法。`default` 修饰符不允许用于接口的私有方法，因此 `log1()` 导致错误。\n`@MarkerInterface\
  \ interface Printable {};`: ✗ Java 中没有 `@MarkerInterface` 注解，因此导致编译错误。\n`public\
  \ interface Printable {public static final int x = 10;public final int y = 20;int\
  \ z = 30;}` ✓ 接口可以定义 `public`、`static` 和 `final` 变量，这些修饰符是隐式的。因此，对于 `y` 编译器添加 static，对于\
  \ `z` 编译器添加 public 和 final 修饰符。因此只有 2 个接口定义是有效的。\n\n### 5.1.10 答案：C\n**原因**: 模块描述文件的名称必须是：`module-info.java`，因此选项\
