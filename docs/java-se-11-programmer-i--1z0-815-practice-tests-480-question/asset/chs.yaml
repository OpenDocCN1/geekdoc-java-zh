  C. ONE ELEVEN ONE ELEVEN\nD. ONE ELEVEN ONE\n\n## 4.2 练习题 4 答案解析\n\n### 4.1.1 答案：D\n\
  **原因：**\n与模块相关的 `java` 命令格式为：\n`java [options] -m <module>[/<mainclass>] [args...]`\n\
  `java [options] --module <module>[/<mainclass>] [args...]` （用于执行模块中的主类）\n\n- `--module`\
  \ 或 `-m`：对应于模块名。`-m` 应该是命令中使用的最后一个选项。`-m` 后面跟着 `module-name`，然后是可选的 `mainclass`\
  \ 和任何命令行参数。如果模块被封装在 jar 中并设置了 `'Main-Class'` 属性，则在 `-m` `<module>` 之后传递 `classname`\
  \ 是可选的。\n\n以下是 `java` 命令中重要的（与模块）选项：\n- `--module-path` 或 `-p`：代表包含模块的目录列表或单个模块的路径。使用平台相关的路径分隔符（Windows\
  \ 上为 `;`，Linux/Mac 上为 `:`）分隔多个项目。\n例如，`java -p out;singlemodule;connector.jar` 代表包含\
  \ `'out'` 目录内所有模块、展开后的模块 `'singlemodule'` 和模块化 jar `'connector.jar'` 的模块路径。\n- `--describe-module`\
  \ 或 `-d`：后面应该跟随模块名，它描述指定的模块。\n如果你传递系统模块名，它将描述传递的系统模块，例如 `java -d java.sql`。但要用于应用程序模块，需要指定模块路径。因此，以下选项是正确的：\n\
  `java -p third-party -d com.udayankhattry.modularity`（给定选项）\n或 `java -p third-party\\\
  test.jar -d com.udayankhattry.modularity`\n\n命令 `java -d com.udayankhattry.modularity`\
  \ 和 `java --describe-module com.udayankhattry.modularity` 会因为缺少 `-p` 选项而报错缺少模块。\n\
  命令 `java -p third-party\\test.jar -m com.udayankhattry.modularity` 将尝试执行 `test.jar`\
  \ 中 `MANIFEST.MF` 文件指定的 Main-class。\n\n### 4.1.2 答案：C\n**原因：**\n局部变量类型推断在 JDK 10\
  \ 中引入。从 JDK 10 开始，保留类型名称 `var` 允许带有初始化器的局部变量声明、增强 for 循环索引以及在传统 for 循环中声明的索引变量。例如：\n\
  ```java\nvar x = \"Java\"; //x 推断为 String\nvar m = 10; //m 推断为 int\n```\n给定语句：`var\
  \ list = new ArrayList<>();` => `list` 指向一个 `Object` 类型的 `ArrayList`，因为右侧没有定义泛型类型。向\
  \ `ArrayList` 实例添加 `null` 是允许的。初始时 `list` 有 3 个元素：`[null, null, null]`。`remove(int)`\
  \ 返回列表中被删除的成员。在这种情况下，`list.remove(0);` 返回 `null`，因为 `null` 从索引 0 处被删除。因此，`list`\
  \ 留下了 2 个元素：`[null, null]`。`remove(Object)` 在删除成功时返回 `true`，否则返回 `false`。在这种情况下，`list.remove(null)`\
  \ 移除列表中的第一个 `null` 并返回 `true`，`list` 仅剩一个元素：`[null]`。\n因此，输出是：`'null:true'`。\n\n\
  ### 4.1.3 答案：B\n**原因：**\n如果使用了 `package`，那么它应该是第一条语句。但 `javadoc` 和开发者注释不被视为 Java\
  \ 语句，因此类可以在 `package` 语句之前拥有开发者注释和 javadoc 注释。如果 `import` 和 `package` 都可用，则正确的顺序是\
  \ `package`、`import`、类声明。\n\n### 4.1.4 答案：C\n**原因：**\nJava 是一种区分大小写的语言。文件名必须与 `public\
  \ class` 的名称匹配，即 `\"HelloWorld\"`。请注意：`\"helloworld\"` 不同于 `\"HelloWorld\"`。\n\n\
  ### 4.1.5 答案：C\n**原因：**\n运算符 `+` 的优先级高于 `==`，且 `+` 运算符是从左到右结合的，让我们对给定表达式进行分组：\n\
  `\"1\" + \"2\" + \"3\" == \"1\" + \"2\" + \"3\"`\n`= (\"1\" + \"2\") + \"3\" ==\
  \ \"1\" + \"2\" + \"3\"`\n`= (\"1\" + \"2\") + \"3\" == (\"1\" + \"2\") + \"3\"\
  `\n`= ((\"1\" + \"2\") + \"3\") == ((\"1\" + \"2\") + \"3\")`\n现在来求解：\n`= (\"12\"\
  \ + \"3\") == ((\"1\" + \"2\") + \"3\")`\n`= \"123\" == ((\"1\" + \"2\") + \"3\"\
  )`\n`= \"123\" == (\"12\" + \"3\")`\n`= \"123\" == \"123\"`\n`= true`\n请注意，在编译时通过连接计算的字符串由字符串池（String\
  \ Pool）引用。编译时字符串连接发生在发生在操作数均为常量时。\n\n### 4.1.6 答案：C\n**原因：**\n`java [options] <sourcefile>\
  \ [args...]` （用于执行主类）\n单文件程序会编译到内存中。\n\n### 4.1.7 答案：C\n**原因：**\n`abstract` 类可以有构造函数，并且可以没有任何抽象方法。因此\
