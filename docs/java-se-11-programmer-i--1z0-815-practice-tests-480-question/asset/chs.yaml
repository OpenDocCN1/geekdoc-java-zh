  ### 2.1.1 答案：A, D\n**原因**：Jack 的薪水是 5000，Liya 的薪水是 8000。如果 `Employee` 的薪水 `>= 10000`，则该\
  \ `Employee` 对象将从列表中移除。\n`Predicate<Employee>` 的 Lambda 表达式必须接受 `Employee` 类型作为参数，并必须返回\
  \ `boolean` 值。允许的 lambda 表达式为：`(Employee e) -> { return e.getSalary() >= 10000;\
  \ }`。\n可以简化为：`(e) -> { return e.getSalary() >= 10000; }` => 类型可以从表达式左侧移除。\n进一步简化为：`e\
  \ -> { return e.getSalary() >= 10000; }` => 如果左部分只有一个参数，则可以移除圆括号（parenthesis）。\n\
  进一步简化为：`e -> e.getSalary() >= 10000` => 如果右侧只有一个陈语句，则方法体内的分号、大括号和 `return` 关键字可以移除。但这\
  \ 3 个符号 `[return, {}, ;]` 必须同时移除。\n**注意**：箭头运算符的 `-` 和 `>` 之间不应有任何空格。\n\n### 2.1.2\
  \ 答案：F\n**原因**：`case` 值必须求值为与 `switch` 表达式相同的类型或兼容的类型。`switch` 表达式可以接受以下类型：\n- `char`\
  \ 或 `Character`、`byte` 或 `Byte`、`short` 或 `Short`、`int` 或 `Integer`\n- 仅限 Java 6\
  \ 起的 `enum`\n- 仅限 Java 7 起的 `String` 表达式\n兼容的字面量或常量可以作为 `switch` 表达式。在这种情况下，`switch`\
  \ 表达式 `\"HELLO\"` 是 `String` 类型。所有 3 个 `case` 值都是 `String` 类型，因此给定代码没有问题。第一个 `case`\
  \ 是匹配项，控制台打印 1。由于 `'case \"HELLO\":'` 内部没有 `break` 语句，因此控制流会发生穿透（fall-through）并执行剩余块，直到找到\
  \ `break` 或 `switch` 块结束。因此在这种情况下，它打印 2，然后是 3，最后控制离开 `switch` 块。`main` 方法结束，程序在控制台打印\
  \ 123 后成功终止。\n\n### 2.1.3 答案：E\n**原因**：让我们求解第 `n1` 行的表达式：\n```\n!flag1 == flag2\
  \ != flag3 == !flag4(!flag1) == flag2 != flag3 == (!flag4) //逻辑非 ! 在给定运算符中优先级最高\n\
  ((!flag1) == flag2) != flag3 == (!flag4) //== 和 != 优先级相同，从左到右结合，先分组 ==\n(((!flag1)\
  \ == flag2) != flag3) == (!flag4) //下一次分组 !=\n上述表达式仅剩单个运算符 ==，其左侧为：(((!flag1) ==\
  \ flag2) != flag3)，右侧为：(!flag4)。由于 == 是二元运算符，先求值左侧。\n((false == flag2) != flag3)\
  \ == (!flag4) //!flag1 为 false\n((false == false) != flag3) == (!flag4) //flag2\
  \ 为 false\n(true != flag3) == (!flag4) //(false == false) 结果为 true\n(true != true)\
  \ == (!flag4) //flag3 为 true\nfalse == (!flag4) //(true != true) 结果为 false\nfalse\
  \ == true //!flag4 为 true\nfalse //(false == true) 结果为 false\n因此，在控制台打印 false。\n\
  ```\n让我们求解第 `n2` 行的表达式：\n```\nflag1 = flag2 != flag3 == !flag4\nflag1 = flag2 !=\
  \ flag3 == (!flag4) //逻辑非 ! 在给定运算符中优先级最高\nflag1 = (flag2 != flag3) == (!flag4) //==\
  \ 和 != 优先级相同，从左到右结合，先分组 ==\nflag1 = ((flag2 != flag3) == (!flag4)) //下一次分组 ==\n\
  上述表达式仅剩单个赋值运算符 =，右侧需要先求值\nflag1 = ((false != flag3) == (!flag4)) //flag2 为 false\n\
  flag1 = ((false != true) == (!flag4)) //flag3 为 true\nflag1 = (true == (!flag4))\
  \ //(false != true) 结果为 true\nflag1 = (true == true) //!flag4 为 true\nflag1 = true\
  \ //(true == true) 结果为 true\ntrue 被赋值给 flag1，控制台也打印了 true。\n```\n**建议**：在实际考试中，如果你发现一个包含多个表达式的问题，请先检查是否存在编译错误。如果所有表达式都没有编译错误，再进行求解。\n\
