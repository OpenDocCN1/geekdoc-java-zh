  \ 1 答案及解析\n\n### 1.1.1 答案：D\n**原因**：`Derived` 类的 `print()` 方法正确重写了 `Base` 类的 `print()`\
  \ 方法，因此 `Derived` 类中没有编译错误。\n`java.io.FileNotFoundException` 继承自 `java.io.IOException`，而\
  \ `java.io.IOException` 继承自 `java.lang.Exception`。\n尽管运行时 `print()` 方法抛出了 `FileNotFoundException`\
  \ 实例，但 `print()` 方法声明抛出 `IOException`。引用变量 `b` 是 `Base` 类型，因此对编译器而言，调用 `b.print();`\
  \ 是调用 `Base` 的 `print()` 方法，它抛出 `IOException`。由于 `IOException` 是受检异常，调用代码应该处理它。\n\
  由于调用代码没有处理 `IOException` 或其父类，因此 `b.print();` 导致编译错误。\n\n### 1.1.2 答案：F\n**原因**：从\
  \ JDK 7 开始，Java 允许在初始化 `ArrayList`时不指定类型。由于变量 `list` 的类型是 `List<String>`，因此 `ArrayList`\
  \ 的类型被视为 `String`。`n1` 行编译成功。\n`subList` 方法在 `List` 接口中声明：\n```java\nList<E> subList(int\
  \ fromIndex, int toIndex)\n```\n`fromIndex` 是包含的，`toIndex` 是排他的。它返回列表在指定的 `fromIndex`\
  \ 和 `toIndex` 之间部分的视图。返回的列表由此列表支持，因此返回列表中的非结构性更改会反映在当前列表中，反之亦然。\n如果返回的列表（或视图）发生了结构性更改，则修改也会反映在当前列表中，但如果此列表发生了结构性更改，则此方法返回的列表的语义将变得未。\n\
  如果 `fromIndex == toIndex`，则返回列表为空。\n如果 `fromIndex < 0` 或 `toIndex > 列表大小` 或 `fromIndex\
  \ > toIndex`，则抛出 `IndexOutOfBoundsException`。\n在 `n2` 行，`list.subList(0, 4)` -->\
  \ `[A, E, I, O]` (`toIndex` 是排他的，因此起始索引为 0，结束索引为 3)。\n`list.addAll(list.subList(0,\
  \ 4));` 几乎等于 `list.addAll(5, [A, E, I, O]);` => 在索引 5 插入 `A`，`E` 占据索引 6，`I` 占据索引\
  \ 7，`O` 位于索引 8。`list` --> `[A, E, I, O, U, A, E, I, O]`。\n`main(String [])` 方法中的最后语句在控制台上打印\
  \ `[A, E, I, O, U, A, E, I, O]`。\n\n### 1.1.3 答案：D, F\n**原因**：在接口 `Buyable` 内部定义的变量\
  \ `salePercentage` 隐式为 public、static 和 final。根据 Java 8，接口中增加了默认方法和静态方法；根据 Java 9，接口中增加了私有方法。`Buyable.java`\
  \ 文件没有编译错误。\n`class Book` 实现 `Buyable` 接口，但由于 `Buyable` 接口中没有抽象方法，因此 `Book` 类不需要实现任何方法。`Book.java`\
  \ 文件编译成功。\n`Buyable [] arr = new Buyable[2];` 创建包含 2 个 `Buyable` 类型元素的一维数组，两个元素都初始化为\
  \ `null`。\n访问接口静态变量和静态方法的方法存在差异。访问接口静态方法的正确且唯一方法是使用接口名称，例如 `Buyable.salePercentage()`。`n2`\
  \ 行和 `n4` 行导致编译错误。\n对于接口的 public static final 变量，虽然访问静态变量的正确方法是使用接口名称（如 `Buyable.salePercentage`），但也可以通过以下方式访问：\n\
  - 接口的引用变量：`Buyable obj1 = null; System.out.println(obj1.salePercentage);`\n- 实现类名：`System.out.println(Book.salePercentage);`\n\
  - 实现类的引用变量：`Book obj2 = null; System.out.println(obj2.salePercentage);`\n因此，`n1`\
  \ 行和 `n3` 行编译成功。\n\n### 1.1.4 答案：D\n**原因**：Lambda 表达式在没有目标类型的情况下无法工作，且目标类型必须是函数式接口。在这种情况下，由于给定的\
  \ Lambda 表达式没有赋值给任何目标类型，因此其意图不明确。事实上，给定的 Lambda 表达式在没有目标类型时会导致编译错误。\n\n### 1.1.5\
  \ 答案：E\n**原因**：请注意，编译时通过拼接计算的字符串会被字符串常量池（String Pool）。编译时字符串拼接发生在两个操作数都是编译时常量（如字面量、`final`\
  \ 变量等）时。这意味着常量表达式的结果在编译时计算，稍后由字符串常量池引用。\n而运行时通过拼接计算的字符串（如果结果表达式不是常量表达式）是新创建的，因此不同的。\n\
  ```java\njava += world; // 等同于 java = java + world;\n```\n`java + world` 不是常量表达式，因此在运行时计算并返回一个非池的字符串对象\
  \ \"JavaWorld\"，它由变量 `java` 引用。\n另一方面，变量 `javaworld` 引用常量池中的对象 \"JavaWorld\"。由于变量\
  \ `java` 和 `javaworld` 引用不同的字符串对象，因此 `java == javaworld` 返回 `false`。\n\n### 1.1.6\
  \ 答案：B\n**原因**：顶层类只能使用两种访问修饰符（`public` 和默认的 `default`）。不能使用 `private` 和 `protected`。由于文件名为\
  \ `M.java`，因此类 `N` 不能是 `public`。顶层类可以是 `final`，因此是正确选项。顶层类可以是 `abstract`，因此也是正确选项。\n\
  \n### 1.1.7 答案：B\n**原因**：关于重写方法的返回类型有 2 条规则：\n1. 如果被重写方法的返回类型是基本类型，则重写方法应使用相同类型。\n\
  2. 如果被重写方法的返回类型是引用类型，则重写方法可以使用相同类型或其子类型（协变返回）。\n（此处省略详细逻辑推导，保持与原文逻辑一致）\n\n### 1.1.8\
