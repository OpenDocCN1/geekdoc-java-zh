  \ 被装箱为 `Character` 对象并插入列表索引 1，这使 'X' 向右移动。`list` --> `[E, P, X]`。\n`list.add(3,\
  \ 'O');` => 'O' 被装箱为 `Character` 对象并添加到列表索引 3 。`list` --> `[E, P, X, O]`。\n`list.contains('O')`\
