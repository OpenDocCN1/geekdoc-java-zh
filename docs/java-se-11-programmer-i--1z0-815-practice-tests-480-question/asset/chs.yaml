  G. `public void travel(Object obj) {}`\n\n## 3.2 练习题 3 答案及解析\n\n### 3.1.1 答案：A\n\
  **解析**: 从 JDK 11 开始，可以启动单文件源代码程序。如果你执行 `java --help` 命令，你会发现 Java 11 增加了以下选项：\n\
  ```bash\njava [options] <sourcefile> [args] (用于执行单源文件程序)\n```\n单文件程序是指整个程序都包含在一个源文件中的文件，这在学习\
  \ Java 的早期非常有用。`java Child.java` 命令的效果是将源文件编译到内存中，并执行源文件中找到第一个类。因此，`java Child.java`\
  \ 等同于（但不完全相同于）：\n```bash\njavac -d <memory> Child.java\njava -cp <memory> Parent\n\
  ```\n因此在这种情况下，输出为：`Parent`。请注意，源文件可以包含多个类（即使是 public 的），但找到的第一个类必须具有特殊的 main 方法\
  \ `public static void main(String [])`。还要注意，文件名可以是底层操作系统支持的任何名称，例如，将 `Child.java`\
  \ 重命名为 `123.java`。那么 `java 123.java` 等同于：\n```bash\njavac -d <memory> 123.java\n\
  java -cp <memory> Parent\n```\n关于单文件源代码程序的更多信息，请查看 URL：https://openjdk.java.net/jeps/3303。\n\
  \n### 3.1.2 答案：A\n**解析**: `class Error` 继承自 `Throwable`，因此 `obj instanceof Error;`\
  \ 和 `obj instanceof Throwable;` 返回 `true`。但 `Error` 类在多级继承体系中与 `Exception` 和 `RuntimeException`\
  \ 类没有关系，这就是为什么 Line n1 和 Line n2 导致编译错误的原因。\n\n### 3.1.3 答案：A\n**解析**: 题目要求你解决编译错误，而不是关心运行时错误。对于数组索引，可以使用任何\
  \ `int` 值，因此在这种情况下，所有 7 组组合都是允许的。如果题目期望成功编译并执行程序，那么任何大于最大索引值的组合都是有效的。例如，在给定的代码中，由于第一维最大值\
  \ = 6，第二维最大值 = 6，因此任何大于 6 的 `int` 值都可以用于 `x`，任何大于 6 的 `int` 值都可以用于 `y`。在给出的七个选项中，只有两个选项\
  \ `(x = 7, y = 7)` 和 `(x = 8, y = 8)` 是有效的。此外，请注意，在替换了 `x` 和 `y` 的值后，Line n1 处的语句编译成功。例如\
  \ `var arr = new int[1][1];`：右侧表达式创建了一个 `int[][]` 对象。`arr` 推断为 `int[][]` 类型。\n\n\
  ### 3.1.4 答案：E\n**解析**: 在 Java 中，`boolean` 类型只能存储两个值：`true` 和 `false`，这些值与 `int`\
  \ 类型不兼容。此外，`boolean` 类型未定义 `+` 运算符。因此，`main` 方法内部的所有 3 条语句都会导致编译错误。\n\n### 3.1.5\
  \ 答案：C\n**解析**: `List` 是超类，`ArrayList` 是子类，因此 `List l = new ArrayList();` 是有效的语法。`Animal`\
  \ 是超类，`Dog` 是子类，因此 `Animal a = new Dog();` 是有效的语法。两者都体现了多态。但在泛型语法中，参数化类型不是多态的，这意味着\
  \ `ArrayList<Animal>` 不是 `ArrayList<Dog>` 的超类。记住这一点。因此以下语法是不允许的：`ArrayList<Animal>\
  \ list = new ArrayList<Dog>();` 或 `List<Animal> list = new ArrayList<Dog>();`。\n\
  \n### 3.1.6 答案：B\n**解析**: 变量 `arr` 指向一个二维数组。使用 `for-each` 循环遍历给定的数组。在外部循环的第一次迭代中，`str`\
  \ 指向一维 `String` 数组 `{\"%\", \"$$\"}`。在内部循环的第一次迭代中，`s` 指向 `\"%\"`，控制台将打印 `%%`。Line\
  \ n1 的布尔表达式求值为 `false`，因此不执行 Line n2。在内部循环的第二次迭代中，`s` 指向 `\"$$\"`，控制台将打印 `$$`。Line\
  \ n1 的布尔表达式求值为 `false`，因此不执行 Line n2。内部 `for-each` 循环结束，控制执行 Line n3。Line n3 处的\
  \ `break;` 语句终止了外部循环，程序成功结束。因此，输出为：\n```\n$$\n```\n\n### 3.1.7 答案：A,C,D\n**解析**:\
