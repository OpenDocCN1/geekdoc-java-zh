  md: 'Through the notion of equivocation, the engagement with translation, and the
    practice of “slowing down reasoning,” it becomes possible to undo the perverse
    dualism between nature and culture, inculcated by Western epistemology and the
    cause of the disappearance of plurivers worlds. By introducing ethics being Western
    epistemology—and subverting the colonial nature/culture dichotomy—indigenous cosmopolitics
    produces a “slowing down [of] thinking” that, in turn, in decolonizing perception,
    provides an opening to other worlds and other knowledges. According to Mágara
    Millán,


    The process of decolonizing feminism(s) implies an involvement in with the worlds
    of subalternized female subjects, a recognition of their cultural logics, and
    at least a willingness to think of a different relationship between human and
    nonhuman. It involves a predisposition to perform the *pachakuti* as part of the
    feminist struggle. It is not an attempt to recover aesthetic and authentic roots
    in its purity, but to actual different ways of being and being in the world to
    diminish the foundational force that capitalism inflicts on our everyday lives.

    (2011, 26)


    Mignolo (2012), for example, argues that in terms of a geo-bodypolitics means
    to articulate some basic categories of a border epistemology as the first step
    decolonization. The colonial wound marks the location of such epistemology(ies)—as
    reflected in the feminisms of Gloria Anzúa and the Afro-Brazilian feminist intellectual
    and anthropologist Lía González.


    As a healer-writer-poet, Anzaldúa ([1990] 2009) works on the metaphors by which
    we approach the world, and in replacing them, she decolonizes our senses. Her
    project seeks to change the negative metaphors—which constructed the otherness
    of subaltern subjects in colonial contexts, often internalized by these subjects—empowering
    counterimages. Decolonization of perception, feelings, and language itself is
    not possible without a healing process carried through transformative images.
    It also necessitates a project of “translation as betrayal” of hegemonic knowledge/feeling/experiencing
    from the geo/body location of the indigenous or mestizo women. From the perspective
    of this shaman poet, everything we do, say, or write affects the human


    > ⁶Pachakuti, in the tradition of the Andean Aymara Indians, means to overthrow
    the world or place it on its feet: it is a strong radical critique of capitalist
    modernity. (Millán, 2011, 26, my translation). In other words, it symbolizes a
    re-balancing of the world through a turn of events that could be a catastrophe
