    # Decolonial Turn


    Decolonial thought calls into relation epistemological frameworks that define
    relations of domination of modernity, appealing to conceptual tools grounded in
    postmodern thought, subaltern studies, liberation theory, and the critique of
    enlightened universalism, among other frameworks (Bidaseca 2011; Schutte 2008;
    Femenías 2005, 2013, 2015, 2017; Palermo 2010, 2009a, 2009b, 2008, 2000). As a
    critical approach, decolonial thought has some advantages, among which I would
    like to highlight the following: (1) it goes along with what happens at the level
    of practices in ethno-racial movements; (2) it shows the necessity of “redistributing
    power” between racialized groups and heemonic powers; (3) it renders more complex
    ways of understanding effective power networks; and finally, (4) it gives visibility
    to the work of some theorists who remain mostly peripheral within academia.


    To begin with, it is clear that in Latin America, as in other parts of the world,
    “modernity” developed in hand with colonization. In a well-known work Serge Gruinski
    denounced the colonization and transformation of Latin American social and cultural
    imaginaries, collective memories, and personal self-identifications of the communities
    of indigenous peoples. work encouraged further research on “indigenous reactions”
    to models of conduct and introduced the “new world” and “violence, chaos, and
    colonial dominance” (1988). Some decolonial works have made progress in this direction.
    Anibal Quijano—as well as other decolonial researchers—consider whether the church
    nor local groups adopted the heemonic viewpoint as a strategy for survival or
    for gaining prestige are exempt from responsibility in the process of colonization
    (Quijano 2000, 2011). He further says that if the “colonial” phase of “modernity”
    ended more than a century ago, “coloniality” remains. In fact, the concept of
    “coloniality” is coined in order to account'
  merge: -1
  pgno: 49
