    If de Lauretis’s goal was to constitute a cognitive practice and an “unusual knowledge”
    aware of eccentricity and change, Palermo, to a great extent, aims at building
    an eccentric locus to abandon the “objective no place of the Eurocentric position”
    and to denounce “colonial difference” (2010a, 80). But, despite her effort, she
    does penetrate the conceptual correlation inherent in the enunciation. However,
    women’s movements’ claims in the public space show dynamics that refute ontologically
    closed positions. As I will show here, their negotiated identities mobilize a
    double dimension of individual and collective micronegotiations (Femenías 2013,
    295–98).


    Women make part of Quijano’s classifications of “colonized races,” including “Amerindians,”
    “blacks,” and, in a more complex way, “mestizos” (Quijano 2011, 28; 2000, 37–39).
    However, he considers each “colonized race” as a homogeneous without recognizing
    the subaltern position of women, as if men and women had the same status. Also,
    he does not take into account their claims or the ways they establish their own
    voices in the public sphere. In this sense, although Quijano proposes a “redesign
    of power” in the social taxonomy of “races” and the “control of historical ways
    of labor” at a global scale (2011, 2002), in no way does he suggest that such
    redistribution includes women qua a differentiated collective. When Palermo denouncing
    the “patriarchal structures of coloniality” (2000, 486), she clashes with the
    theory of complementarity of sexes (Palermo 2000, 485; Laureni 2012, 18–27). Regarding
    women, Quijano does not even submit strategies to revert their condition, consolidating,
    traditional cultural forms identified by their racial and territorial belonging,
    unaware of the gender-variable as a subordinating structure. However, as many
    studies show, the same women account for their discomfort and resistance in the
    face of certain traditional rites and customs, and which claim belong to their
    ethnic and cultural identities. Consider, as an example, sexual “inception” or
    intrafamiliar violence or “disciplinary” violence (Tarducci 2013, 8–10); Sciortino
    and Guerra 2009, Soza Rossi 2015, 128–36). To sum up, Quijano remains insensitive
    to the peculiar situation of women in colonized and noncolonized “races,” and
    his homogenizing or essentializing prevents him from perceiving dynamically both
    structures of power (ethnoracial and sexual). Despite her efforts, Palermo inherits
    some of these difficulties not solving.


