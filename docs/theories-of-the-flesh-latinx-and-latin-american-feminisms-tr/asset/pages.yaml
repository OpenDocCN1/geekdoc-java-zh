  md: 'Cotito describes Abuela''s spiritual practice in her home, and her involvement
    in it, one that demands both song and the body in motion. This description contrasts
    sharply with the rigidity, lifelessness, and emptiness she describes at Chachita
    and Joe''s wedding at St. Lucy''s. The latter is a sad rather than happy happy
    occasion—Chachita is being forced by her parents to marry Joe when her sexual
    relationship with him is discovered—and sadness permeates the scene, expressed
    in the language of dead bodies; participants look like they are at a funeral,
    solemn, solitude, stone-faced, and they truce—all conveying emotion.


    Moreno Vega''s, therefore, juxtaposes Orisha practices and a dominant practice
    of Christianity at mid-twentieth century in which was a critical assessment of
    their varied impact on women''s opportunities for equality and women''s spiritual
    health. In this way, Moreno Vega echoes Gloria Andalucía''s discussion of the
    process of “differentiating between legado, lo impuesto” as a critical and decolonial
    one that opens the possibility of a “conscious rupture with all oppressive traditions
    of all cultures and religions” (Andalucía 1987, 82).


    The critical assessment of religiosity at mid-twentieth century in When the Spirits
    Dance Mambo and the revaluation of forms and cultural practices as they particularly
    African Puerto Rican whom might be examined through the lens of Gloria Andalucía''s
    spiritual mestizaje, which, as I suggest elsewhere, not designate a particular
