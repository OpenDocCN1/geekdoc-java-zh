  md: '# Feminism and Translation: Toward the Decolonization of Knowledge


    A translocal feminist politics of translation, as Sonia Alvarez (2009) argues,
    is crucial to the decolonial turn and a key strategy in building partial connections
    to confront the equivocations or mistranslations that hinder feminist alliances,
    even among women who share the same language and culture, as Latinas living in
    the United States and Latin American women. Translation—based not only on a linguistic
    paradigm, but more importantly, on an ontological one—becomes a key element in
    forming political alliances and feminist epistemologies that are pro-social justice,
    anticrast, anti-imperialist, and decolonial. If women’s movements in Latin America
    and other parts of the global South share various intersecting contexts of struggle,
    then "theirs conflicts with the ''scattered hegemonies'' represented by the systems,
    development industries, global markets, and religious fundamentalism create powerful;
    even if only overlapping;) interests and identities. In this context, the project
    of translation among them becomes both newly possible and all the more pressing"
    (Thayer 2014, 2004).


    Moreover, in the interactions between Latina and Latin American feminisms, the
    travels of discourses and practices across geopolitical boundaries, disciplinary
    and others, encounter formidable roadblocks and checkpoints. For Norma Klein (2014),
    to understand the coloniality of power, one needs to grasp the unqual travels
    and translations of feminist texts, theories, and practices, as well as their
    reception. In a lucid analysis of globalization, Klein shows that testimonies
    of the place of women’s writing at the time of *latinoamericanismo* fashions,
    novels, essays, and poetry (as well as autobiographical features) written by women
    and linked to political struggles and social mobilization were instrumental in
    constructing a sui gender feminist practice. Klein argues that through cultural
    translation, Latin American and Latina feminists readapted liberation discourses
    from the West, resignifying them in relation to self-generated practices and theorizations
    of gender empowerment from their lived experiences, particular histories, and
    contestatory practices.


    Taking the example of the testimony, Klein argues that this literary genre was
    mobilized by subaltern subjects, such as Roberta Mencha and Domit Chungara, and
    their testimonial interventions, aiming, from the intersection between gender,
    ethnicity, and social class, to destabilize a Western feminism centered on the
    notion of an essentialized woman. In deconstructing the dominant feminist discourse,
    Latin American testimonies not only constitute other places of enunciation, but
    also break with the Hispanic surrealist paradigm (magical realism) in favor of
    a realist'
