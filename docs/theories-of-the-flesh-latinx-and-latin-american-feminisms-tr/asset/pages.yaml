  md: '# CHAPTER 2 | Revisiting Gender


    # A Decolonial Approach


    MARÍA LUGONES


    I WILL BEGIN BY describing the work of Rita Segato, an influential Latin American
    anthropologist, theorist, and committed activist with enormous experience. I will
    place my project in contrast to hers because I think doing so makes clearer what
    is my direction and company. I will also detail the character of my philosophical/political
    project. I emphasize an analysis and critique of gender as a category but also
    as a structural feature of the kingdom of Spain, of colonial governance, and of
    nascent nation states. That analysis is followed by a critique of the concepts
    of gender and patriarchy in both the social scientific study of the peoples of
    Abyya Yala and of coalitional attempts with them. Including women who are indigenous
    and women who are Afro-descendants in Abyya Yala. That is the name that the Puma
    have given to the territory named America by the colonial powers; it has been
    adopted by a significant number of insurgents in the region, including intellectuals,
    activists, and indigenous movements. The longer version of this critique is a
    chapter in Decolonial Feminism, a book I am writing in with indigenous women intellectuals,
    activists, and women in communities in Bolivia and the northwest and the south
    of Argentina, and with intellectual activists who are Afro-descendants from the
    Caribbean and South America.


    Segato


    Segato is doing extraordinary work with indigenous pueblos and women in Brazil,
    deep into the Amazonia. She focuses on women’s situation in'
