  md: 'Lugones warns that chacawarmi in Aymara language signifies a set of complementary
    opposites not necessarily analogous to man/woman (2012, 78). Most strongly, these
    theorists support a deconstruction of the importance of gender, but much of their
    emphasis is on the role of colonialism in creating newly oppressive conditions
    for women and for the work of social reproduction in general. They use not to
    assume that the current configured gender structures we see in various parts of
    the world have ancient cultural roots rather than a more recent genealogy (Mani
    1998).


    Taking a different tack, indigenous feminists have argued that gender complementarity
    in their societies predominated colonialism. Many defined gender differences,
    arguing that these are not always linked to domination (Allen 1992; Mikaere 1994;
    Lawrence 2015). Indigenous groups in the Americas vary in their gender arrangements,
    but it is undisputed that in many women held significant political power. From
    far back as 1540, European settlers began writing about numerous Native woman
    chiefs they encountered, as the Jamestown colonists in Virginia who described
    their encounter with the queen of Appomattoc in the early 1600s. George Washington
    recounted in 1753 he was required to visit the territory supervised by the Seneca
    leader Allaquipp to be permitted to travel through the territory (Venables 2004,
    221–22).


    The case for gender systems existing without dominance not rest on a few exceptional
    leaders, but on the political and economic organization across status. Haudenosaunee
    tribe leaders are always male but chosen exclusively by older women known as Clanmothers.
    We now know that the political and economic power of women in the Iroquois Nation
    in upstate New York inspired the development of feminism among white settlers
    in the eighteenth and nineteenth centuries (Wagner 2003). In groups such as the
    Kuna Indians today women are not isolated as individuals inside the home facing
    an unchecked male authority but play critical roles in the productive economies
    and land stewardship of tribes and communities. Matrilineal family formations
    that exist in numerous kinship systems around the world also give women power
    and status through exclusive inheritance.


    The claim that some groups have nonhier gender divisions of economic labor and
    political roles challenges the long-standing Western feminist critique of the
    doctrine of separate spheres. Both of the colonial arguments described above—that
    gender was not a universal status in the precolonial world, and that significant
    gender divisions could coexist with equal political and economic power—suggest
    that the colonial difference requires more fundamental work in feminist theory
    than it has been given. Ahistorical and universalist assumptions about patriarchy
    and the oppressive effect of gender-based separate spheres need to be reconsidered.'
