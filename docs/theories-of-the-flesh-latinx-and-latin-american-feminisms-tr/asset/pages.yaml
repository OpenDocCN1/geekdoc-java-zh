    languages as well as the indigenous language Otomi. Viramontes’s tale, taken one
    from the translation of Nahuatl accounts, refers to the attack dogs that were
    used to terrify and kill the indigenous people during the Spanish conquest. Via
    this reference, the dogs in the novel serve to connect the damage caused by the
    freeways to a longer history of militarized violence and conquest. Similarly,
    Tranquilina is linked, through her possible levitation as well as the name her
