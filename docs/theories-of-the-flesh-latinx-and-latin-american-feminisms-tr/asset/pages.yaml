    capitalism and the literal flowing of water. Just as an economic system that benefits
    only some at the expense of many is unsustainable, so too are environmental practices
    that limit access to natural resources to only a few at the expense of many. In
    addition, the mural reminds us of the bodily vulnerability we share in the face
    of our planet’s changing climate and diminishing resources, advocating a relationship
    to the'
  merge: -1
