  md: 'suggesting here is that “Women” who disidentify with, counteridentify with,
    and/or distance themselves from those on the dark side in exchange for the wages
    of gender are paradoxically in some sense collaborating in maintaining their own
    oppression. Thus, the myopic focus on individual access to wages of gender afforded
    heterosexual bourgeois “Men” can indeed work to undermine larger goals such as
    institutionally supported heterosexual racialized patriarchy and decolonizing
    all of our relationships, including those to the sacred world and to the land.


    Third, particularly for communities of color, it becomes necessary to track the
    conditions produced by racialized capitalism that underpin and bolster complicities
    with the coloniality of gender. A example of this is the 1965 Moynihan Report,
    which encouraged black males to be complicit in the exploitation of black females
    in exchange for the promise of employment and integration into the mainstream
    economy. Concerned with the social movements of the time demanding civil rights
    and racial equality and the anticolonial movements taking place globally, Daniel
    P. Moynihan, the political scientist and senator, argued that the solution to
    racial unrest lay providing black men with the material conditions to return to
    their “rightful place” as breadwinners, patriarchs, and heads of nuclear families.
    Moynihan’s “assessment” of the black family argued that racial unrest could only
    be mitigated by providing black men with much-needed employment, in this case
    by enrolling them in the army, in order to help correct the “dysfunctional matriarchy”
    (Spillers 1987) that had taken hold of the black community and constrained the
    community’s successful assimilation into American society. Moynihan claimed that
    as long as black women were “doing better” than their male counterparts, racial
    equality would never be achieved.


    Moynihan’s pathological framing of the black community was grounded in light-side
    gender and gender arrangements. His reading of the black community foregrounded
    an oppositional sexual politics (the “women” are “doing better” than the “men”)
    by arguing that the key to racial equality was minimizing light-side gender and
    familial arrangements. Moynihan in many ways derailed the conversation on substantive
    racial equality by sparking debates around black women’s “pathological tendency”
    to undermine black men by refusing to succumb to a patriarchal order and outperforming
    them in school and employment. In doing so, Moynihan framed black women, as as
    both the “perpetrator” of harm and the helpless target.


    Rather than move toward an oppositional sexual politics, the decolonial feminist
    movida would be to seek out economic solutions that foreground the well-being
    of all those impacted by the conditions of racialized capitalism. How does this
    oppositional sexual politics actually bolster capitalist exploitation at the expense
    of the black community? It does so by'
