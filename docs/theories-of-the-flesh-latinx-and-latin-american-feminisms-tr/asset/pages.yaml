  md: 'Feminist radicalism in philosophy is not an easily recognized feature. Academic
    accrediting and marginalization are prices not all women philosophers dare pay,
    because it is so difficult in the academy to justify the relation between feminist
    theory and practice and philosophy. in general, the acceptance of epistemological
    contributions from political movements is slow, and the weight of universalism
    is still overwhelming. Nonetheless, recognizing herself as the symbolic daughter
    of Sor Juana and Rosario Castellanos, two writers who philosophized, Graciela
    Hierro not only praised all feminine knowledge, granting the value of knowledge,
    but has offered herself as a “symbolic mother” to numerous students who needed
    to bridge their activism and research, as well as various women philosophers who
    dared to look further than logical analysis in order to think themselves.


    Just before here, in October 2003, she wrote: “Everything that I know I owe to
    women, [brujas] who dared to think. I only read women, I’ve already read so many
    men.... I learned what I needed from them and I consult with some ideas whose
    serve my purposes. To be feminist, for me, means to personalize everything” (Hierro
    2004, 11).


    Like Hierro and Schutte, Diana Maffia (b. 1953) is a feminist who has established
    herself in academia, but like Bartra, is a woman who also constructs knowledge
    outside of the classroom by means of her connection to interl and the women’s
    liberation movement. On occasion, the Panamanian philosopher Urania, takes to
    work in state institutions to carry out policies of justice—that is, a legal struggle
    for Women—as in the Defensoría del Pueblo en la Legislatura de la Ciudad de Buenos
    Aires. In actuality, she was working on the questioning of gender normality in
    defense of transgender and transsexual individuals (Maffia 2003).


    According to Diana Maffia, feminist philosophy in the Argentine academy began
    to develop in the mid-1980s–with the conclusion of the last military dictatorship—thanks
    to the influence of three foreign women philosophers and the pivot they initiated
    in practice: the exiled María Cristina Logones (b. 1951) (who has returned after
    twenty years in the United States), the Spanish Celia Amorós (b. 1944), and the
    Mexican Graciela Hierro.


    Among the expressions of democratization was the return of the university to its
    normal mode of political governance to remedy—through competitive selection of
    faculty—the hollowing out of the academy imposed by the military from 1976 to
    1986. An important contest was initiated to fill the Chair of Ethics in the School
    of Philosophy and Literature at the University of Buenos Aires.


    Almost all the chair-holders were men, so the contest had been preceded by a strongman
    dispute for the territory of moral legitimacy.'
