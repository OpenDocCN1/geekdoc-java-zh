  md: 'for the persistence of certain structures that survive colonization as such.
    If “colonialism” refers to historical occupation of America (among other places)
    by the British, the Spanish, the Portuguese, and the French using the model of
    territorial domination in the disputes, “coloniality,” refers to a colonial strategy,
    that is, to the colonial heritage persists and reproduces itself after colonial
    occupation has ended (Mignolo 2007, 18–19). According to Mignolo, colonial heritage
    (a notion taken from Franz Fanon) can be identified by certain fundamental, such
    as racism, epistemic Eurocentrism and violent or consented enrichment of lifestyles
    (Mignolo 2007, 34). Other features pointed out by Mignolo are (1) economic domination
    (territorial appropriation, exploitation of local labor); (2) political control
    of authority; (3) control of gender and sexuality; and (4) epistemic and subjective
    control (Mignolo 2007, 36).


    Although many of these features intersect, I will analyze them separately for
    the sake of investigating and presenting specific problems. According to Quijano,
    the coloniality of power does not only establish hierarchies in society, but also
    concentrates wealth and social privileges, putting “whites” at the top and racialized
    groups below (Quijano 2000, 2011). This “pigmentocratic” hierarchization evades
    the idea of the black/white racial binary, as in the United States, a pernicious
    oversimplification and disrupts the idea that Latinos have homogeneous effects
    on their shared public culture (Femenías 2013, 224). That is, ethnicity is related
    to the politics of demarcating limits of a collective, making it possible to divide
    the world between “us” and “them,” thus erasing internal disagreements, in particular
    women’s subaltern situation. Many female thinkers think the decolonial subject
    object to this bias. Critical analyses, those of Silvia Rivera Cusicananququi,
    Gloria Anzaldúa, María Lugones (Femenías 2013, 215–35), Catherine Walsh (Palermo
    2010, 79–81), and Zulma Palermo herself formulate specific criticisms against
    this bias. In the next section I focus on not widely known contributions of Zulma
    Palermo.


