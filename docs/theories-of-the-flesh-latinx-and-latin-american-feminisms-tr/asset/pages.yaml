    # The Problem with Deploying Gender “As Is”


    We are now in a position to identify some of the conceptual problems with applying
    “gender” retroactively to racialized bodies in “postcolonial” spaces. The “gender”
    categories of “Men” and “Women,” as are most often deployed, tend to center a
    descriptive biology (the sexual difference) grounded in a Western, dual-sexed
    notion of the body (Laqueur 1990; Butler 1993, 2004; Fausto-Sterling 2000). This
    matters because within a Western, scientific, dual-sexed model of the human it
    is possible to confuse sex and gender as synonymous or and interchangeable categories.
    However, as illustrated by the preceding historical examples, sex and gender were
