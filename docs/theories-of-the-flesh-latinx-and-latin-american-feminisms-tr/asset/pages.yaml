    This is not reportage but critical thought, or what she also calls practical rationality,
    required by the conditions of aspora. Latinas in the United States live in a dominant
    cultural context that devalues our lives, beliefs, relations, and choices. We
    then become, she says, an “invisible invisibility,” the backdrop to functioning
