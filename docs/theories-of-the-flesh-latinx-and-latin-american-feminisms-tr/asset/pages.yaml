    give birth to the selves we wish to become. Her approach takes steps further,
    of course, as it incorporates not her personal narrative but a kind of epic narrative
    about a multigational and pluricultural Chicana experience. It is far from my
    intention to essentialize Chicana experience or Latina experience. Jacqueline
    Martínez has observed, Anzalúa does not offer her approach to overcoming oppression
    as a general rule, prescription, or mandate for all to follow (2000, 84–85). Moreover,
    Anzalúa''s narrative, metaphorical, and poetic method of writing makes that the
    sensitivities she displays and her strategies for survival as a person and a writer
    are only one of many possible paths to take. The very notion of complacency that
    she fights demonstrates that the mythical universe she invents in order to preserve
    her sanity allows for multiple approaches to identity, as well as multiple Latina
    identities. Her message, then, is one of dispelling and empowering the emotional
    exploitation of fear and shame, and one of rebelling against all forms of authoritarian
    thinking.


