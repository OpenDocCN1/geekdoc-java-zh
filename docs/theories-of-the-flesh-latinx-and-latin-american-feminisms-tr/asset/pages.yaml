  md: '# Thinking Through Boomerang Perception: Reflections on the Quotidian and Belonging


    In “Boomerang Perception and the Colonizing Gaze: Ginger Reflections on Horizontal
    Hostility,” the seventh chapter of Pilgrimages/Peregrinajes, Maria Lugones launches
    a theoretical exploration of boomerang perception as an endemic dimension of racial
    perception in the United States. Broadly, boomer perception is the way in which
    people of color are perceived through white eyes that they see only in relation
    to white identity and construction. She describes the structure of perception
    in the following fashion: “The racist/colonialist perception is narcissistic,
    it denies independence to the seer, it constructs its objects imaginatively as
    a reflection of the seer” (Lugones 2003, 157). The quotidian dimension of boomerang
    perception is found in the way in which it is folded into the education of white
    children as they learn about their nonwhite peers through a framework of assimilation.
    The language that emerges takes the form of “Black people are just like us” or
    “Latinos are very similar to us.” The consequence of this logic is that people
    are taught to think of racial difference nonreciprocally. People of color are
    understood only to the extent that they can accommodate white racial expectations.
    To this effect Lugones notes: “The white person is the original, the Black person
    just an image not independent from the seer” (157).


    Following this schema, the nonwhite body is dependent on the vision or perception
    of the white body for its history, self-construction, and social perception. As
    a result, the racial other is constructed as imitative and robbed of any personal
    history or circumstance that is independent of whiteness.


    As reflected in the title of the essay, Lugones opens her discussion on racist/colonist
    perception gently. She warns that her project should not collapse into an interrogation
    of the white-other binary, which she takes to be dangerous for people of color.
    Rather, she seeks to explore the implications of the internalization of boomerang
    perception for the construction of belonging in communities of color. Such consequence
    is the evoking of ethnic legitimacy tests within communities that construct some
    people as “real” participants in ethnic/racial communities and others as “fakes”
    (Lugones 2003, 159). The language of legitimacy finds expression through the real/fake
    dichotomy instantiated in phrases like: “You are not Puerto Rican” or “You are
    not a real Latina.”


    > ¹ Lugones notes that this term originally comes from the work of Elizabeth Spelman.'
