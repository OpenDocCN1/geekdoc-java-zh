    A preoccupation with not forgetting, with our “memory alleyways” (Evastro 2006)
    and the telling of other stories, is undoubtedly a critical decolonial cultural
    practice. In the cautionary words of the Bolivian Aymara communal feminist Julieta
    Paredes,


    To refer to our memory, to our ontogenic and phylogenetic memory, connects us
    to our first rebellion as [girls], when we resisted and fought against the sexist
    and unfair rules of society, connects us to the rebellion of our great-grandmothers,
    who resisted colonial and pre-colonial patriarchy. (2010, 10)


    Equivocal translations, invasions of the arena of politics by unusual beings,
    slowing thinking, and rewriting memories and histories in the articulation of
    other knowled are, therefore, ethical and political practices that decolonial
    feminists inhabited in many locations of our vast and dense Latin/a American terrain.


    Resistance to the coloniality of gender implies, among other things, linguistic
    resistance, and putting under erasure Eurocentric representation paradigms with
    their anchorage in a dichotomous logic. Without giving up the (always everyday)
    category of gender, but instead articulating it in ways that challenge the pervasive
    binaries of modernity/coloniality, perhaps we can join forces with feminists—Latin
    American, Latino/a, black, and indigenous—in rethinking the colonial boundaries
    between human and nonhuman that have so structured the coloniality of gender and
    power. In short, we would be moving in the direction of a more robust notion of
    culture—and democracy—far more inclusive of other communities.


