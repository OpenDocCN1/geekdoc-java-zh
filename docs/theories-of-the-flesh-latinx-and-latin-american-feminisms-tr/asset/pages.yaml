  md: 'Anzaldúa shows how, in the context of Latina feminism in the academy, community
    is a necessary condition for embodied genealogical practice, particularly the
    essential genealogical practice of bodies and communities that have been marginalized
    relative to dominant discourses and practices. In the case of Latina feminism
    in philosophy, the communal work of embodied feminism is itself a mode of survival.
    As Linda Alcoff (2003), Christie Dotson (2011), Kathryn Gines (2011), Mariana
    Ortega (2006), and others have convincingly argued, what it means to be a woman
    of color in philosophy is to exist—and despite the constant threat of violent
    marginalization (see also Allen et al. 2008; Davidson, Gines, and Marcano 2010).
    Moreover, this threat isn''t accidental or conditional, but a feature of ways
    of thinking and knowing in this context. The very structures and norms that contain
    our philosophical practice marginalize genealogies produced by bodies that have
    been made to suffer in various ways. Anzaldúa''s analysis makes clear that this
    marginalization is inevitable when women of color are isolated. Women-of-color
    feminist philosophies—and women-of-color philosophers—are thus marginalized when
    they are isolated from their communities. Just survival, resilience, and embodied
    practice itself are made possible through the existence of what Anzaldúa calls
    a “border community,” so is the project of Latina feminism realized through the
    existence of interlocutors. Understanding Latina practice in terms of embodied
    genealogy sheds light on the essential role that community plays in this kind
    of diverse philosophical project.


    Anzaldúa also offers a way of understanding what, precisely, constitutes the type
    of community that is productive for my conception of embodied genealogies, and
    for thinking about the work of Latina feminisms in particular as a practice of
    survival. This is a significant and complex contribution, for communal dialogue
    is not without its own dangers. In the same response to Alcoff, Ferguson, and
    Bergotffen that I discussed in the opening pages of this chapter, Schutte speaks
    to the way that “the notion of community can be oppressive insofar as to dictate
    behaviors preferred by the majority or the collective, excluding other kinds of
    behavior as subversive or deviant” (Schutte 2004, 198). Indeed, Schutte finds
    Nietzsche''s work particularly helpful in his critique of orthodoxies, which can
    constitute communities that are homogeneous and oppressive (2004, 183). But, as
    I have argued, Nietzsche does not develop a robust positive account of an alternate
    vision of community (Young 2006; Kaufman 1975). Reading Anzaldúa and Nietzsche
    together, then, makes room for thinking about embodied genealogy as a communal
    practice of survival in a way that resists the homogenization and leveling down
    of difference that both thinkers critique.'
