    LAURA E. PÉREZ


    IN ITS PRELIMINARY VERSION this essay was written for a panel at the American
    Academy of Religion in honor of Enrique Dussel’s important and necessary work
    on the occasion of his seventieth birthday in 2004. Given that I am not a philosopher,
    theologian, or historian, in all areas which Dussel holds degrees and to which
    he has contributed prominently, and that I was a newcomer to his work, I could
    only imagine that I was asked to join the panel of his specialists and collaborators
    in order to ensure that a US feminist-of-color and queer-centered engagement with
    his work was represented. Various symposia and lectures by Enrique Dussel and
    Anibal Quijano, organized by the Department of Ethnic Studies’ Chicana/o Latino/a
    Studies Program, had produced in me and another feminist colleague the impression
    that they knew little about the US civil rights movements, and knew mainly about
    the African American struggles. They apparently knew nothing about the crucial
    feminist and queer contributions of US women of color to the racial, gender, and
    sexual rights struggles. These encounters encountered to explore intellectual
    bridge-building in decolonial thought, as a woman of color, my concern was not
    only to engage their thought as potentially useful to new transnational resistance
    movements, but also to clarify what our movements had discovered, in parallel
    fashion or differently than leftist intellectuals and popular movements from the
    1960s to the present in Latin America. I was concerned that the transnational
    circulation of knowled not one-way, producing disenounters between Latinas/os
    (Chicanas/os and Puerto Ricans) and Latin American


