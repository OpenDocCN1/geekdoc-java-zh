  md: 'It is important to note that the archive of Sandoval, a queer Chicana, for
    her coalitionary theory of social change rooted in a politics of love as social
    care for the other is primarily the creative and intellectual writings of African
    American, Asian American, Chicana, and Native American women. In their “creative”
    and ostensibly atheoretic works, they chronicle, analyze, and theorize their own
    lives and those of theirs ethnically, gender, economically, and culturally oppressed
    communities, knowing, as Audre Lorde put in 1979, “the master’s tools will never
    dismantle the master’s house” (1984, 112). And it cannot be any other way under
    the legacy of cultural imperialism and necolonizing patriarchal, heteronormative,
    and classist Eurocentrism. Logic by which to argue and think, to imagine and act,
    must be found beyond the ways of thinking that maintain justice in the present
    world. That this living in the “borderlands,” of women, of the queer, of artists,
    of the spiritual, as Anzaldua, in Borderlands (1987), enables the critical intellectual
    distance, the empathy for those who also suffer injustice, and the commitment
    to create democracy precisely because we cannot deny that injustice exists and
    that it can and be eliminated. There is wisdom in the writings and other art forms
    in which US women of color render themselves their lives objects of reflection.
    Through these creative but ideologically critical practices, they enter a record
    of the mechanisms of transformation. By the process of knowing one’s self when
    one is multiply oppressed is, by necessity, a decolonizing one, as it is for the
    multiply privileged.


    Historically marginalized from the intelligentsia, our creative writing and arts
    in general have thus been and continue to be an archive of resistance and the
    place where women of color most clearly and powerfully speak to power. Some of
    the most radical formulations with respect to political organization, reconceptualization
    of community, and the struggle for justice have come from the women of color,
    and some of the most important of these are women queer feminists. It is telling
    that many have chosen to write “queer” mixtures of diary, poetry, revisionist
    history and mythology, and political essay from outside of academic discipline,
    among the pioneering Audre Lorde; the late Gloria Anzaldua, June Jordan, and Paula
    Gunn Allen; Cherrie Moraga and Ana Castillo.


