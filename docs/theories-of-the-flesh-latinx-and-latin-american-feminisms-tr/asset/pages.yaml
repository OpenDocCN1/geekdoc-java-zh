  md: 'But what does this “communal practice” entailed embodied genealogy look like?
    First, following Anzaldúa, I argue that this communal practice is neither homogenous
    nor homogenizing. On the contrary, I have shown how genealogical knowledge as
    always embodied and performative underscores the importance of diversity in terms
    of the bodies of genealogists themselves. Anzaldúa’s work explicitly affirms and
    offers an intersectional analysis of diversity in terms of race, ethnicity, culture,
    gender, disability, and class. But her intersectional analysis—like my own conception
    of embodied genealogy as a communal practice—is not rooted in gender or racial
    essentialism. That is, while this communal practice consists of differently embodied
    genealogists who produce different kinds of embodied genealogies, this is not
    because there are existential, historical differences between gendered bodies,
    “black,” “brown,” and “white” bodies, or because all women of color or Latinas
    produce the same kinds of knowledge. My conception of embodied genealogy follows
    Anzaldúa’s analysis by being attentive to the way identities themselves are constructed,
    broken down, molded, and lived in a multiplicity of ways through distinct histories
    of power, oppression, and resistance.


    Still, the kind of community that is envisaged and enacted through Anzaldúa’s
    work is not practiced by either ignoring the diversity of bodies in general, or
    by thinking regard to race, class, sex, or disability as categories or meaningful
    identities. Anzaldúa’s insights bring to the fore how genealogical work is both
    more important and more fraught when it is engaged in bodies who have in some
    way marginalized or oppressed by dominant structures of power and ways of knowing.
    In Borders, she develops the concept of “la facultad,” to describe “the capacity
    to surface phenomena the meaning of deeper realities, to see the deep structure
    below the surface” (Anzaldúa 1987, 38). La facultad, the “historical sense” of
    the genealogist, refuses the certainty of absol and “is capable of liberating
    divergent and marginal elements” (Foucault 1980, 152–53). But Anzaldúa’s analysis
    makes clear that la facultad and the “historical sense” of the genealogist are
    most well developed in “those who are ponced on the most . the females, the homosexuals
    of all races, the darkskinned, the outcast, the persecuted, the marginalized,
    the foreigner” (Anzaldúa 1987, 38). Conceptualizing Anzaldúa’s work as a genealogical
    project illuminates the particular importance of knowledge produced by bodies
    who have been marginalized or made to suffer, and explains that groups of people
    share definitive locations within histories and structures of power and oppression
    can be marked by this differentiation in overlapping ways. The embodied perspectives
    of such people also overlap and diverge. In this way, Anzalduas work tells—and
    shows—us how communities and knowled'
