  md: 'power structures and hierarchies into which the subject is socialized. As Sartre
    famously observed in his treatise “Existentialism,” a young person faced with
    a major dilemma seeks orientation and advice will inevitably receive a different
    kind of answer on whose counsel is sought (1993, 42–45).² In a mostly-dominant
    society where class, racial, and heterosexual privileges and power structures
    still abound, radical subjectivities departing from socially expected protocols
    are likely to suffer setbacks and, in the worst cases, significant trauma due
    to the lack of a supportive social environment, around other factors. One of the
    reasons Andalusia’s narrative is so inspiring is that she addresses the topic
    directly even at the cost of exposing her intimate trauma. In taking this step
    she also overcomes the burden of secrecy that further dehumanizes the subject
    of shame. Her account shows her strength in overcoming her pain and disorientation
    through the awakened voice of the character in whose name she speaks, alongside
    offering us a window into her universe: the new mestiza.


    # Becoming Who You Are


    “Becoming who you are” is not only a paradox motivating to our assumed identities;
    it is an existential challenge even if one decides affirmatively to engage this
    paradoxical conundrum.³ I take this as meaning to be something like “Be true to
    yourself (or your most deeply felt convictions and beliefs), and act correctly.”
    Yet this remains an unreliable oversimplification and possibly even a misleading
    map, since our deepest convictions might be held in error, and what may take the
    self might be a metaphysical illusion. Well, then, how does one ascribe self-knowledge
    to oneself (or others), and how does one decide what to take when we come face-to-face
    with life’s important crossroadses? Is one driven to a choice by powerful instincts
    and desires? Or, perhaps does one look outward and survey the many social factors
    and forces that have come to us at this particular point of intersection in our
    lives, with the greatest effort at understanding such a play of forces and their
    impact on one’s life, does one deliberate and take action,


