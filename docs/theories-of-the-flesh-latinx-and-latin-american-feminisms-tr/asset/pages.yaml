    A Caribeña (Re)thinks ‘Privilege,’ the Wages

    of Gender, and Building Complex Coalitions


    XERXIS MÉNDEZ


    # A Brief Genealogy and Grounding


    This essay is titled “A Caribeña (Re)thinks ‘Privilege,’ etc.” because I wanted
    to engage what it means to be a light-skinned Latina who seeks to work against
    the erasure of my Afro-descendance without claiming a history of oppression I
    did not live. I also wanted to mark my particular location as a queer-identified
    cisgender Boricua, whose identity has been forged and grounded in Afro-Latinx/Caribbean
    ways of being knowing and in relation to black folks (primarily African Americans
    and Afro-Caribeans) in the United States. My intention is to work against a pan-Latinidad
    that bypasses the question of race and the pervasiveness of antisemitiblack in
    Latinx communities. I want to be attentive to the assimilation projects that offer
    benefits for desidentifying with and black communities. Indeed, the color-coded
    arrangement of the United States, where the ability to “pass” can significantly
    improve access to benefits, more often than the degree to which Latinx communities
    identify with and/or associate themselves with


    > ¹One of the differences between my usage and Jose Esteban Muñoz’s conception
    of disidentification in this example is the directionality of the disidentifications
    we are concerned with. I am concerned with the political consequences of “white”
    folks as well as communities of color distancing themselves from racialized, impoverished,
    and marginalized communities in their moves to aspire and merge with a white heterosexual
    upper-middle class ideal. Muñoz is focused on the political possibilities of “meriantary”,
    communities of color, finding ways to disappear from that ideal of white heterormality.
