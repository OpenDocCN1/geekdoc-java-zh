    As global media systems proliferate, transnational activism will become easier
    to engage. But without a decolonial approach, transnational feminist activism
    risks colliding with colonial rhetoric about backward societies that need to be
    “westernized.”


    The problem with imperial feminism, whether performed by state or nonstate actors,
    is simultaneously political, theoretical, and epistemological. It is wrong to
    assume the limits of unilateral intervention into faraway contexts, especially
    as this often disables local female agency and livelihoods. It is also wrong to
    presume to know people in advance.


    Imperial feminism assumes a fixed and stable meaning to the idea of feminism.
    It knows what liberation looks like, and is there to, teach, not learn or engage
    in dialogue. It does not view feminism as a dialogic, irreducibly multiple and
    local project. Some feminists reject the category of “imperial feminism” on the
    grounds that this cannot be true if truly liberating. The reality is that feminists
    disagree about what is liberating, or it is more realistic to understand feminism
    as a loosely amalgamated set of diverse discourse and practical activities. There
    is no central committee or unified genealogy of sets that can adjudicate disagreements
    (Roth 2004). Further, it may disable self-critical if we portray feminism as always
    anticolonial, especially if this is done by a facile definitional stipulation.


    Imperial forms of feminism can be especially subtle and difficult to overcome
    in the realm of theory, since theory, like philosophy, usually understands itself
    to have a general regard and abstract change: to “gender,” “identity,” “sexual
    violence,” “sexism,” and so on, in a local way. Philosophy often tries to subsume
    differences between contexts within some meta-level rubric that takes itself as
    transcendent of context. Decolonizing feminist theory may be far more difficult
    than decolonizing feminist practice.


    Achieving a completely decolonized theory is no doubt a quixotic quest. And the
    decolonial aspiration should become a standard part of self-reflective knowledge
    practices. We must at least attempt to understand the effects of our material
    and local contexts on the formation of our knowledge.


    In this paper, I will suggest an approach to decolonial feminism drawing from
    Latina feminist theory and practice. While the embrace of intersectional approaches
