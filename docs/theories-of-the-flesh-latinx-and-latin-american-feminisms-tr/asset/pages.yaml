    Thus, in setting up his genealogical project, Nietzsche rejects what Foucault
    describes as historical consciousness bears—“neutral, devoid of passions, and
    committed to truth” (1980, 162). The method of the disembodied gaze of the historian
    is uncovered by Nietzsche as an aspect of the will to power. In contradiction
    to the historian’s false claim of disembodied removal from physical life, genealogy
    is characterized by “historical sense.” This way of thinking and seeing is fundamentally
    practical. It is oriented by bodies and their energies. As such, the genealogy,
    as distinguished from history in the traditional sense, “shortens its vision to
    those nearest to it—the body, the nervous system, nutrition, digestion, and energies”
    (155). The epistemological work of genealogy is thus oriented by the physical
    lives closest to genealogists. Put differently, genealogical emerges from physical
    life, not only in the secondary sense of studying bodies but also in terms of
    their very production as manifestations of instinct and sentiment. The physical
    lives of genealogists remember particular histories, and their instincts and know
    are not separate from the moral lineages they embody. Geneologies are always embodied.


    What, then, the status of physical perspective and knowledge—of genealogies as
    embodied—mean for Nietzsche’s call for “divers perspectives” in the production
    of genealogical projects? Genealogical work is a manifestation of physical life
    in different ways by bodies which have been formed in different ways and histories.
    For Nietzsche, philosophical knowledge is fundamentally personal: “In the philosopher
    . . . there is nothing whatsoever that impersonal; and above all, his morality
    bears decided and decisive witness to who he is—that is, in what order of rank
    the innermost drives of his nature stand in relation to each other” (1989a, 14).
