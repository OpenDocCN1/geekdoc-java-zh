  md: 'María Luisa Femenías, PhD, is Professor at Universidad Nacional de La Plata;
    former chair of the Department of Philosophy; cofounder and Chair (2006–16) of
    Interdisciplinary Center for Research on Genders and the Specialization on Education,
    Gender and Sexualities (2013–17). As a researcher, she coordinates groups of junior
    and senior researchers and PhD candidates. She has been a Visiting Scholar at
    Toulouse University (Jean Jaurès), Università degli studi di Perugia, University
    of California, Berkeley, and Universidad Rey Carlos, among others. She has published
    a number of articles (translated into English and French) and books on gender
    and violence in Latin America. Recently, she edited books on sexual violence and
    multiculturalism. In 2016, she received the Konex Prize as Researcher on Feminist
    Philosophy and Gender Studies (fundacionkonex).


    Francesca Gargallo is a Mexican writer and poet. She studied philosophy at the
    University degli studi di Rome and in the National Autonomous University of Mexico.
    Gargallo’s published research includes Garífuna, Garíñagu, Caribe (Siglo Veintinto
    Editores, 2002), Ideas Feministas Latinoamericanas (UACM, 2014), and Sarahuis:
    La sonrisa del sol (Fundación Editorial El Peru y la Rana, 2006). Her published
    books include Cali cam mi amor que vivo (Ediciones Era, 1990), Estar en el mundo
    (Ediciones Era, 1994), La decisión del capitán (Ediciones Era, 1997), and Marcha
    seca (Ediciones Era, 1999).


