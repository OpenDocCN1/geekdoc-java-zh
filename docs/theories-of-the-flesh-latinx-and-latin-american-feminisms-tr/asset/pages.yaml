  md: 'fictions. When we bring the gender category to the center of the colonial project,
    then we can trace a genealogy of its formation and use as a key mechanism by which
    colonial capitalism structured asymmetries of power in the contemporary world.


    Anchored in the writings of the Nigerian feminist Oyérónké Oyeywùm, and the indigenous
    feminist Paula G Allen, argues that gender, along with race, were constructs racializing
    and genderizing subaltern identities. In others gender had never been an organizing
    principle or hierarchical category in tribal communities before "contact." The
    sexual division of labor did not exist, and economic relations were based on reciprocity
    and complementarity. However, contesting Lugones, Rita Sigato (2003), in her ethnography
    of the Yoruba people, finds ample evidence of gender nomenclature in that culture,
    thereby arguing that Afro-American tribal societies reveal the existence of a
    clear patriarchal order (gender functioning as an oppressive status differentiation
    system) that is, however, distinct from Western patriarchy. Seeger calls it a
    “lower intensity patriarchy” or, in the words of the Aymara lesbian most feminist
    Julieta Paredes (2010), an entramamiento de patriarcados (imbrication of patriarchal
    systems).


    I would like to invite in the discussion on the presence or absence of gender
    classification systems in precontact societies by bringing to the debate category
    of equivocation. To this end, I will introduce Marisol de La Cadena''s (2010)
    discussion of indigenous cosmopolitics as a way of reassessing Lugones''s coloniality
    of gender through the notion of translation as equivocation.


    # Translation as Controlled Equivocation


    In her influential essay on indigenous cosmopolitics, and attempting to go beyond
    the neoliberal view of cosmopolitics as intercultural alliances, de la Cadena
