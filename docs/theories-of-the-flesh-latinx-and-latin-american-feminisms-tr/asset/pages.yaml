    # Zoe Saldana’s True Match: The Marketing of a Latina


    2012, the L’Oréal Group launched an unorthodox campaign for marketing their True
    Match foundation makeup. Referencing the notion of a “skin mosaic,” the campaign
    included both print advertisements and television commercials and originally featured
    three celebrities: Beyoncé Knowles, Aimee Mullins and Jennifer Lopez. Later, the
    campaign added other celebrities, including Zoe Saldana. In essence, “Going beyond
    the different hues’ approach that these types of advertisements have historically
    utilized, L’Oréal presented to consumers the ethnic background of each celebrity
    . . . by placing the corresponding ethnicity or ethnicities of each celebrity
    in the left corners of the television screen or print advertisement” (Lugo-Ligo
    2015, 97). The first set of commercials and advertisements described Beyoncé Knowles
    as African American, Native American, and French; they characterized Aimee Mullins
    as Irish, Austrian, and Italian; and they pronounced Jennifer Lopez 100 percent
    Puerto Rico. Once Zoe Saldana’s advertisement was added, she was characterized
    as Dominican, Haitian, and Lebanese. We focus on Saldana’s although, here, since
    it marks a contrast to Jennifer Lopez’s claims to be “100 percent Puerto Rico,”
    which place Lopez squarely within the Latin label. In the case of Saldana, the
    combination of her phenotype and assertions of varied ethnicities complicate not
    only her individuality but also Latinidad, which is in effect deracialized and
    exclusively situated within the realm of ethnic heritage.


    Each True Match commercial in the campaign begins with a short voice-over narration
    of the celebrity stating, “There is a story behind my skin: It’s a mosaic of all
    the faces before it. My only makeup: True Match.” The commercial then proceeds
    to discuss L’Oréal’s thirty-three shades of True Match foundation going from “light”
    to “dark.” Viewers are told that these shades include warm, cool, or neutral tones.
