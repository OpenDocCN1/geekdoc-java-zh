    # Interrupting (Neo)colonizing Inequities within American and US Latina/o Studies


    The panel organizer invited the panelists to discuss how we had become familiar
    with Dussel’s work. This account allows for the elucidation of my location and
    my ideological formation as a means of contextualizing my approach to, and dialogue
    with, the work of Dussel in his *Etica de la liberación* and a disclosure of my
    profound investment, my stake, in his intellectual work in my local and global
    coalitionary concerns.


    In so I reject the criticism of the personal—that is, making use of the autobiographical
    as so many women of color writers have in the United States—unwittingly reinforces
    the feminizing by dominant cultural intelligentsia of people of color’ intellectual
    work (whether artistic or scholarly); relegating to something beneath the philosophical
    “T” or “we.” The historically specific embeddedness and the interests behind the
    pretension to transhistorical universality, reason, and truth are insights common
    to US women of color, as they are in poststructuralstructuralist thought. Women
    of color’s autobiographical writing and locating of self within scholarly texts
    has often stated a claim to theory and philosophizing itself, but through a consciously
    different protocol than that imposed by academia or literary canons yet knowingly
    positioning these as alternatives of knowing and being. Furthermore US women of
    color repeatedly speak from the defense of love, of the humane, and against that
    which is dehumanizing.


    I first heard about Dussel from Latin American scholars in the early 1990s at
    the University of Michigan, Ann Arbor, where I began my teaching career. I developed
    and taught comparative twentieth-century Latin American and US Latina feminist
    and queer literatures, as a joint appointment in the Department of Romance Languages
    and Literatures and the Program of American Cultures. I had just written a dissertation
    studying the relationship between art and political thought and practice among
    the right-wing Nicaraguan literary avant-gardeists of the late 1920s and 1930s,
    intending for this focus to contribute to a broadening of the Latin American canon
    of literary scholarship that marginalized Central'
