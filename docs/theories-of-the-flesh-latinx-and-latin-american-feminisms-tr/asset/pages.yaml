    # Coloniality of Power / Coloniality of Gender


    For Quijano (2000), the conquest of America was the founding moment of a new pattern
    of power that is still dominant today—the coloniality of power—and that was based
    on the idea of race/racial classification. As he argues,


    This idea, together with the (racist) social classification on which it was based,
    originated five hundred years ago with America, Europe, and capitalism. They are
    the deepest and most enduring erosion of colonial domination and were imposed
    on the entire population of the planet in the course of the expansion of European
    colonialism. Since then, in the current pattern of global power, these two elements
    permeate each and every one of the areas of social existence and constitute the
    most profound and effective form of social, material, and intersubject domination,
    therefore constituting the universal basis of political domination within the
    current model of power. (204, my translation)


    The productivity of the concept of coloniality of power rests in its articulation
    of nation as the sine non element of colonialism and its neocolonial manifestations.
    Moreover, gender domination—that is, the control of sex, its resources and products—is
    subordinated to a superior-inferior hierarchy of racial classification as a form
    of social domination. Lugones (2007) criticizes Quijano’s narrow understanding
    of gender in the formulation of the coloniality of power because it is


    > still trapped in biological determinism; . . . presupposes sexual dimension
    where none existed; naturalizes heteronormativity in cultures that did not deem
    either sexuality as a social transgression; and . . . presumes a patriarchal distribution
    of power in societies where more egalitarian social relations between men and
    women were prevalent. (Mendoza 2016, 116)


    Lugones argues that in colonialism and in Eurocentric global capitalism, “the
    naturalizing of sexual differences is another product of the modern use of science
    that Quijano points out in the case of ‘race’” (2007, 195). Moreover, the imposition
    of a binary gender system was integral to the coloniality of power as the latter
    was constitutive of the modern gender system. Thus, both race and gender are interdependent'
