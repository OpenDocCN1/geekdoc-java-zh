  md: 'and strategic construction. I start with Homi Bhabha, who acknowledges that
    identitarian constructions are created thanks to different discourses, practices,
    and positions (1994, 145; 2013, 23–44). Relationships between diverse identity
    movements are tense and difficult. Certain narrations break with cumulative, continuing,
    repetitive, and recursive temporality to allow the emergence of the new and a
    move away from normative origins that respond to a bivalent culture: us/others;
    inclusion/exclusion. When social relations are articulated as plural structures
    of identification they give rise to multiple, ambivalent, and “negotiated” identifications
    by virtue of priorities and needs, where some features are more persistent than
    others. Repetition in difference and successive shifts follow an always open process
    that is is an undetermined continuous production of identity. Social and individually
    undetermined, the constant negotiation process of partial, variable, and incomplete
    identities, in part di and aware, in collective and unconscious, intersects psychosocial
    variables, and makes of identity an always provisional result that works as a
    supernatant property. Acknowledging the instability and the constant pursuit of
    equilibrium facilitates dismantling rigid, closed, substantial, and determined
    traditional conceptions (Femenías 2013, 241–42).


    The rejection of strong ontological conceptions of identity has led to the understanding
    of identities as strategic socio-political constructions. In this context, I propose
    to talk about negotiated identities and to situate them in the domain of problems
    of negotiation. This domain is informed by discrete interests and general objectives
    as well as by people’s implicit psychic structures and implicit social powers.
    It is also under the influence of linguistic elements relative to one’s native
    tongue(s) (including cases of plurilingualism), which shape styles of thought
    and access to “reality” and its problems.


    In open up a space of negotiation, it is imperative to recognize that indigenous
    communities have suffered (and continue to suffer) the impact of conquest and
    colonization. The investigations of Silvia Rivera Cusicanqui, Irene Silverblatt,
    and Marisol de la Cadena, many others, address intersectional issues of gender
    and ethnicity among indigenous women through an exhaustive historical analysis
    that takes the chronicles of the conquest as its source. This research sheds light
    on the role of women in the conservation and transmission of cultural patterns
    and as well as how public policies of “assimilation-inclusion” or “ghettoization-marginalization”
    used women as mediators in various processes that worked jointly with other forms
    of power, such as those of the church, unions, and other social institutions.
    Research of this kind can help disclose the path of constitution of contemporary
    group identities, which can idealize, imitate, or underestimate the ethnic and
    cultural charge of those identities.


