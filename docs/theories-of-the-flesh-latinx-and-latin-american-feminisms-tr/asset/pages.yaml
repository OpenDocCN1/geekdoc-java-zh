    # Disidentifications: Queering Light


    In this queer spectral longing, I am moved by these representations that are not
    easily understood as assimilating or opposing structures of inant ideologies but
    in the works of the late José Esteban Muñoz, disidentify with such ideologies.
    Disidentification, according to Muñoz, is “descriptive of the survival strategies
    the minority subject practices in order to negotiate a peace majoritarian public
    sphere that continually elides or punishes the existence of subjects who do not
    conform to the phantasm of normative citizenship” (Muñoz 1999, 4). “Disidentification
    for the minority is a mode of recycling or re-forming an object that has already
    been invested with powerful energy” (39). Disidentification happens at the level
    of artistic production or reception and is also a “making over,” a “transfiguration,”
    a mode of recycling,” to the intersection of identities. One of his examples of
    disidentification includes Marta Gómez’s performance in which she portrays a truck-driving
    lesbian as gay and glamorous rather than an object of content and hate, is not
    simply identifying with a chosen object or symbol to transform or transfigure
    it, thus making worlds anew (Muñoz 1999, xi). Another example provided by Muñoz
    is that of Isaac Julien’s Looking for Langston, as well as instances of black
    men finding desire and pleasure in the photographs of black male bodies by Mapplethor
    which have been interpreted as demeaning of black male bodies. Yet, for Muñoz,
    this latter illustrates a disidentificatory pleasure that both acknowledges are
    disturbing in Mapplethor’s work and this pleasure cannot be easily dismissed.¹⁴
    Here the black body is “made


    ¹³ Heather Loves writes about “the affects—the need, the aversion, and the longing—that
    characterize the relationship between past and present.” She states that


    this decision to look on the dark side comes out of my sense that contemporary
