  md: '# CHAPTER 11 | Embodied Genealogies


    Anzaldúa, Nietzsche, and Diverse Epistemic

    Practice


    NATALIE CISNEROS


    IN THIS CHAPTER, I LOOK to Gloria Anzaldúa''s and Friedrich Nietzsche''s

    work in order to develop a conception of what I call “embodied geneal-

    geologies.” I suggest that Nietzsche''s work on genealogy can be read crit-

    cally and strategically alongside Anzaldúa''s thought in order to develop

    con conception of embodied genealogy as a mode of critical, historical, and

    transformative philosophical practice. On my reading, Anzaldúa''s thought

    resonates with Nietzsche''s conception of genealogy, a method of philo-

    sophical practice that sheds light on dominant ways of knowing by

    calling into question assumptions about historical necessity and

    progress. I show how considering Anzaldúa''s work through this lens sheds

    light on her contributions to philosophical conversations about knowledge,

    identity, and community. At the same time, Anzaldúa''s work can be read as

    a productive critique and necessary supplement to a Nietzschean concep-

    of genealogical ways of knowing. I argue that considering Anzaldúa''s

    thought and Nietzsche genealogy together yields a rich philosophical

