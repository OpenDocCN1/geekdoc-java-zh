    and society” that beset East LA communities in the wake of their destruction by
    the construction of the freeways, Viramotes effectively uses the freeway metaphor
    to represent the structural forces that constrain her characters'' lives.¹³ This
    rendering allows her to explore and why community members might “internalize that
    isolation and begin to kill each other.”¹⁴


    Key to the success of Viramotes'' developmental intervention is the way she structures
    narrative and portrays her characters. Although Their Dogs lacks a clear protagonist,
    its extensive and quite unusual character-system incorporates a dizzyingly large
    array of major and minor characters.¹⁵ By crafting the novel so can be a potential
    center of narrative interest, Viramotes highlights the inequitable distribution
    of character-space typical of most American novels; such a structure makes a point
    about the full and rich subjectivity of the types of people who are frequently
    consigned to the margins of a society, story, or a page. She then demonstrates
    the truth of the contention, forwarded by literary critic Alex Woloch, that the
    most minor character has a “case”—an orientating consciousness that . . could
    potentially organize an entire fictional universe (2003, 22). Before continuing
    with my argument about the significance of Their Dogs’ narrative structure, I
