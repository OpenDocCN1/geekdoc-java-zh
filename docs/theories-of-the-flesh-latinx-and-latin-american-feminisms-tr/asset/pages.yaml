  md: '# CHAPTER 7 | Crossroads and In-Between Spaces

    A Meditation on Anzaldúa and Beyond


    OFELIA SCHUTTE


    THE QUESTION OF IDENTITY, its social construction along a range of socioeconomic
    and gender indicators, and its motivating role as a factor for agency continue
    to challenge our coming to terms with the finite conditions issues and values.
    In this essay I address a small part of this discussion, in particular, the existential
    question of coming to self conditions under which the search for self-knowledge
    and self-realization can take place in the midst of circumstances where multiple
    obstructions obstruct the creative operation of radical subjectivities. I realize
    that some of the terms I use here are contestable for numerous reasons (methodological,
    metaphysical, political, and so on). My aim is simply to offer a few reflections
    that will provoke further thinking and discussion, or let''s just say they will
    happily provide an open space for further conversation and dialogue.


    In this essay I focus on some difficult passages in Anzaldúa’s Borderlands/La
    Frontera, with particular interest in her narrative regarding the overcoming of
    shame. I examine the problem of shame in the context of existential thought (and
    Nietzsche) how the work lends itself to this type of analysis. Of particular interest
    is the question of identity in the sense of “becoming who you are.” When issued
    in the imperative form, “Become who you are,” this type of maxim appears to send
    our heads spinning in circles of search for an origin or a foundation on which
    to base the meaning of being and becoming. It may happen, however, that the disoriented
    subject may find no ultimate believable foundation or guide. Due to the social
    construction of identities, this kind will tend to mimic the


    > term and defend every claim I make; if I did, I would not be able to get the
    matters I want to address.


    Ofelia Schutte, Crossroads and In-Between Spaces: Theories of the Flesh, Edited
    by: Andrea J. Pitts, Mariana Ortega, and Jose Medina, Oxford University Press
    (2020). © Oxford University Press.

