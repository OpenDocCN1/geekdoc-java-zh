  md: 'from a sense of belonging, community, accomplishment. However, it becomes very
    difficult to garner a sense of belonging that the category is manufactured in
    a manner that renders it vacuous due to the universalizing forces that are at
    play in its commercialization. To this effect, Lugo-Lugo (2014) writes: “In fact,
    we could describe Latina pride as the byproduct of a society that imagines Latinas
    in one way and that those who fall within the category (by label or identity)
    to create a fundamentally space from which to operate and in which take refuge
    from their daily existence in that very society”(139). The narrative of authenticity
    marks the category of Latina as a commercialized, homogenized category that can
    only be real (authentic) or fake. If, as Lugo-Lugo suggests, the identity of Latina
    is produced through commercialization that universalizes and homogenizes, then
    it should be no fake/real dichotomy that often deployed as a way of constructing
    a sense of belonging. However, the difficulties arise, much as Lugo-Lugo has noted,
    when we recognize that the category in the perceptual process has become empty
    in it refers potentially to everyone and to no one. The identity of Latina in
    the US twenty-first century is guarded zealously through the fake/real dichotomy
    because what it means to be “real” is so fragile in its construction. Commercialization
    has helped to make the category of Latina as empty, but desirable, object of identification.


    The fake/real dichotomy gained epistemic traction when one has objected or rendered
    part of a narrative constructed through white perception that does not offer an
    independent narrative of history and self. Protecting the sense of belonging through
