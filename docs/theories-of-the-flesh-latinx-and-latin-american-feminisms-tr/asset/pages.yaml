  md: '# CHAPTER 10 | Latin America, Deocoloniality, and Translation


    Feminists Building Connectant Epistemologies


    CLAUDIA DE LIMA COSTA


    # Olympia and Cultural Translation


    *Olympia*, a translation of Titian''s *Venus of Urbino* (which was, in, a translation
    of Giorcione''s *Venus of Dresden*), is a portrait in oil on canvas signed by
    Éouard Manet in 1863. The painting, exhibited at the prestigious Paris Salon in
    1267, was received with shock by the public. According to many art critics, the
    cause of scandal was not the nakedness of Olympia, but the gaze that her nudity
    embodies. Olympia’s defying stare confronts heartlessly those who look at her;
    returns a fixed, disturbing look. Her hand draws attention to her sex while covering
    it. This movement of revealing and hiding leads the viewer to feel the need to
    stare at her sex, but without blame, as she hides from public. As noted by the
    painting''s critical reception, Olympia, rising above her gender and class, refuses
    to be addressed as the courteous courtesan of French modernity, subverting the
    genre of nude painting.¹


    Why am I use Olympia’s image to begin my reflections on feminist decolonial turn
    in Latin America? Is the painting—which I appropriate—as metaphor for the debates
    on the coloniality of power. On the one hand, if we observe Titian''s *Venus of
    Urbino*, we can see that Manet''s translation of it brings to the forefront several
    elements constitutive of modernity/coloniality. On the other, from a feminist
    perspective, although


    > There is an extensive discussion about Olympia and its visual rhetoric. My intention
    here not to engage with this criticism, but to use the painting for other purposes.


    Claudia de Lima Costa, Latin America, Deocoloniality, and Translation In: Theories
    of the Flesh,

    Edited by: Andrea J. Pitts, Mariana Ortega, and José Medina, Oxford University
    Press (2020).

    Oxford University Press.

