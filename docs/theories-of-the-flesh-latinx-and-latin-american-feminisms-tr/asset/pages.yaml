  md: 'that is attentive to both its ecological fragility and the need for more equi-table
    resource distribution.


    To conclude, return to the story that opened this essay: the 2014 humanitarian
    crisis on the US-Mexico border in undocumented Central American children were
    characterized as an environmental dis-aster. This story demonstrates that social
    movements predicated on conservation often characterize the vulnerable as a threat.
    The work of artists like Juana Alicia makes visible theories that can unite multiple
    movements for justice, including feminism, antiracism, and disability activism,
    and that the interventions of such work need to be theorized in and a framework
    that recognizes all of these sites of struggle. In Juana Alicia’s art, disability
    and bodily vulner-ability emerge not as signs of tragedy or crisis but as common
    features of shared humanity that bind people to confront difficult questions about
    how we construct communities, how we imagine as insiders and outsiders, how we
    inadvertently exclude people even as we advocate for a more just society, and
    which bodies we believe are politically viable and which we do not.


