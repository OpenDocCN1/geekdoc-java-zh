    # Sensory Experience and Sacred Bodies


    As a medium and spiritual healer, Abuela conveys to Cotito an appreciation for
    the sensory and aesthetic realms and how these take form in human expression and
    manifest the sacred. Late in the narrative, Cotito names, only once, Abuela’s
    worldview and practice as Espiritismo, or Spiritism (Moreno Vega 2004, 259), though
    she more commonly names individual deities—recognizing the specific Puerto Rico
    practice of Espiritismo while emphasizing its origins in diaspora Orisha worship.
    Many Puerto Ricans practice Espiritismo, also known as Mesa Blanca, which fuses
    Christian and African viewpoints and centers of a multicultural pantheon of spirits,
    including El Negro José, a male African spirit (Flores-Peña 2004). In one encounter
    with the African male named El Negro Juan in the narrative, the spirit speaks
    through Abuela to Cotito: “Play music in the mornings before you leave the house.
    You will see tremendous changes. . . Place a cup of fresh, cool water by your
    headboard for this spirit” (Moreno Vega 2004, 194). El Negro Juan asks her, “Don’t
    you feel much better after dance?” (193). And she tells her she “has gitana dressed
    in yellow and blue dancing around you”. This exchange the aesthetic dimensions
    of Orisha worship that represents the involvement of the entire self/body in communion
    with the divine, but it also suggests that health and sensory/physical pleasure
    are interrelated. The memoir further underscores a view of spiritual health that
    centers human expressions of beauty and pleasure in its descriptions of the young
    Cotito assisting Abuela in the creation and maintenance of her altar. As important
    as how carefully Moreno Vega describes the act of listening in this memoir, and
    returns it repeatedly—Abuela listening to spiritual need, Abuela listening to
    the spirits, her parents not listening to their daughter, Cotito listening to
    the new rhythms of mambo and salsa with her siblings, and Cotito’s high school
    friend Donna Stokes listening to her—as a manifestation of a full sensory awareness
    to be respected.


