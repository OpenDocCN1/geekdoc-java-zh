  md: 'resilience comes at a cost, one that cannot be altogether forgone in an age
    of intensifying neocolonial violence, but which can be partly mitigated laying
    bare some of the mechanisms operative in the continued resilience and systematicity
    of neocolonial oppression against women of color. Ours is a history of visible
    and hidden harms, of violence by another name that requires a different archaeology
    of knowledge than previously proposed by European philosophical philosophies.
    Too often, the notions of injury and harm they expose are based on a metaphysics
    of presence that excludes the bodies of the oppressed (so that both visible and
    invisible harms coexist in our lives found shroud the normalized coexistence of
    democratic antislavism with institutional racism and sexism). Too often, the parameters
    for freedom they budget on colonial subjugation of alternative political formations
    and acquiescence to the forms of power that maintain the modern colonial gender
    system remain sidelined, eclipsed in our experience of social worlds. Ours is
    a history of hidden harms taking place in open air, of histories buried by History.
    This demands an accounting.


    This essay is one step in direction. I am interested in what keeps violence a
    productive phenomenon in the lives of women of color: what maintains and sustains
    the logical universe necessary to keep “resistance” a structural feature of our
    existence. We are undoubtedly resistant. We gather the slaughter and steward our
    pain toward survival: a beyond yet known. Yet this struggle is not an accidental
    feature of existence, but the outcome of deep, structural inequities and foundational
    fictions in the heart of modern liberalism and democratic civil society.


    Disclosing these inequities and fictions alone will not yield their demise, as
    the realistic ideal behind such logical inference found motivated European colonialism
    and imperialism. Tracing harms to their origins—even to unknown or theorized ontological
    loci of origins—dwell too on philosophical satisfaction reached by establishing
    more precise correspondences between self and world, or in growing knowledge that
    lie on “primordial,” transcendental conditions for human understanding. This alone
    is not the world. It’s an explanatory framework for making sense of a world that
    will never be the world that most matters to those excluded frameworks: the lived-world(s)
    of marginalized beings often caught in the crags between disclosure and disappearance,
