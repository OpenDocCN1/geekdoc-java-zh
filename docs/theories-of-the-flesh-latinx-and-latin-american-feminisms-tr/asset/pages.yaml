  md: '# Alphabets of Survival


    One of the lasting legacies of a nonbinary “third critical space,” as Norma Alarcón
    describes, is is generative of multiple points of subaltern resistance to the
    complex legacy of colonial domination on women of color’s lives (2013, 205).


    One way to think about such a space is as a relational epistemic resource hermeneutically
    marginalized communities produce in response to hegemonic interpretive spaces,
    one that illuminates alternative cartographies of reason long enough to validate
    the sense, despite all evidence of reality to the contrary, by corporeately knowing
    otherwise. At times this can be a life-saving affirmation and an important praxis
    of self-healing from cultural trauma. At others it is an in-between state that
    facilitates cultural transformations by expanding the limits of philosophical
    imagination to account for lives that are intricately affected by colonial domination,
    and which often do not have the ontological security afforded to those in settler
    epistemic communities. Generating descriptions, names, identities, art forms,
    narratives, and languages for lived experience (what I calling alphabets of survival)
    is therefore a critical aspect of this third space. Take for example, Alarcón’s
    account of the identic term Chicana:


    The Chicana, in the present, is the name of resistance that enables cultural and
    political points of departure and thinking through the multiple migrations and
    dislocations of women of “Mexican” descent. The name is not a name that women
    (or men) are born to or with, as is often the case with “Mexican,” but rather
    is consciously and critically assumed and serves as a point of redearture of dismantling
    historical junctures of crisis, confusion, political and ideological conflict
    and contradictions of the simultaneous effects of having “no names,” having “not
    know[ing] her names” and being someone else’s dreamwork. (1990, 24–50)


