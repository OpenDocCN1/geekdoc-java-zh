  md: 'Doing feminist *theory* and feminist *philosophy* in a decolonial way poses
    particular challenges. Research in the social sciences is generally focused on
    specific phenomena in local contexts, such as women in the Caribbean who work
    in the informational sector or women in South Asia who work in food production.³
    But theory and philosophy usually understand themselves to have a more generic
    charge with global application. Although most now recognize that femininity and
    masculinity are culturally mediated and that gender formations are local, it remains
    a common assumption that gender itself can be theorized in the abstract. Some
    argue, for example, that the diverse ideas of gender have a common process of
    subject formation in which individuals must conform to a “logic” or “script” imposed
    without, even if the content of that script varies. In this way feminist theory
    and feminist philosophy can perform their usual analytic procedures without attending
    to the specificity of mating contexts.


    The leading position of feminist theory in the global North is that gender identity
    itself needs to be overcome by coercive practices, rigid boundaries, and identitarian
    logics, and embroiled in a *necessary* subordination. Theorists as methodologically
    diverse as Sally Haslander and Judith Butler take this view (Haslander 2012; Butler
    2004). There are certainly good reasons to worry that gender systems suppress
    actual physical and biological variability and tend to normalize gender meanings.
    As result, feminist political practice has taken an increasingly oppositional
    stance toward gender identity, calling for the project of undoing gender and dismantling
    identities. Some theorists called for a dismantling of women’s studies around
    a category that needs undoing (Brown 1997). Although feminist theory is in truth
    a hugely complex and contested terrain, in the academic spaces of the global North
    it sometimes appears that the only theoretically correct position defines feminism
    as a deconstruction of gender.


    A decolonial approach indicates the need for caution. In some cases, gender systems
    may not be oppressive, either because gender is not the determining status that
    preempts all others, or because gender systems can work with a two-term scale
    of meanings associated with female/male without an exclusivity of two socially
