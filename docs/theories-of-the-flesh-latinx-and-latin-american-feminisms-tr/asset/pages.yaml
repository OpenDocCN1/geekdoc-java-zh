  md: '# CHAPTER 6 | Philosophical Feminism

    in Latin America


    FRANCESCA GARGALLO


    Translated by Erika Grimm and Kevin Cedeño-Pacheco


    THE MAJORITY OF THE cultural experiences of Latin America women, whose thought
    has expressed, since the colonial period, their difficulty in accepting and being
    accepted by the hegemonic system of knowledge transmission and creation of ideas
    and art, lies in the boundaries between philosophy and literature, between activist
    practice and theory.


    Poets like Juana Inés de la Cruz (1651–1695) of Mexico, storytellers like Teresa
    Margarita da Silva or Orta (1711–1793) of Brazil, and socialist activists like
    Lila Tristán (1803–1844) of Peru declared their right to be women of study and
    struggle in poems, letters, notes, essays, and manifestos in a world that rejected
    them for it. However, it was not until the nineteenth century, when the Argentine
    antislavery writer Juana Manso (1819–1875) argued for the necessity of public
    education and philosophical instruction from Catholic dogma for women’s moral
    and intellectual emancipation—along with the reunion of those educated in order
    to restructure the country and right its moral wrongs—that a feminist position
    was openly expressed. This endeavor was taken up by teachers and writers at the
    end of the century. Rita Cetina Gutiérrez (1846–1908) of Mexico, originator of
    the movement La Siemprima, Visitación Padilla (1882–1960) of Honduras, founder
    of the Boletín de la Defensa Nacional, as well as others from countries across
    the region demanded women’s right to education, from freedom to the male gaze
    over their lives, and later, to vote. With this, they initiated a feminist movement—that
    is, a movement of women and concerning women’s condition—in Latin America.


    The intersection of various modes of expression for conveying women’s thought
    is particularly clear in the work of Juana Inés del Carmen


    Francesca Gargallo, Philosophical Feminism in Latin America: Theories of the Flesh,
    Edited by: Andrew J. Pitas, Mariana Ortega, and José Medina, Oxford University
    Press (2020). Oxford University Press.

