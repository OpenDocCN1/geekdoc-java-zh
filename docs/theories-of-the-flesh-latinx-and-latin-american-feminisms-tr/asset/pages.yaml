    Hermeneutic violence can be understood as violence done to structures of meaning
    and intelligibility that allow for the meaning of everyday cultural acts and primitives
    of a cultural tradition to emerge, in Nahua, Olmec, Ojibwe, and other Amerindian
    worldviews. Hermeneutic violence cannot be direct, like behavioral and personal
    violence. Nor can it take the shape of structural violence since the structures
    of intelligibility are prerelective and have not assumed readily (in socially
    articulated) pattern used in culture. They have not assumed the position of (material,
    social, cultural) objects within settings of interrelated practices that can be
    linked up to one another in structural form. It is a more primordial, tacit violence
    that prevents oppressed peoples from achieving prerelective imperative familiality
    with one''s world along the same lines as their historical oppressors. This does
    not relegate oppressed peoples to positions of muteness or agential; on the contrary,
    oppressed peoples who have suffered trauma to their interpretive resources and
    referential contexts of meaning are often hyperverbal in their resistance and
    creative responses to their sense of displacement. There is certainly a እንደሚ-how
    and an experiential reality of significant epistemic standing: the long quill
    of communal suburbs attest to this. The problem lies in the existing structures
    of power that permit the audibility of those resistant voices to rise in the official
    narratives of culture. Hermeneutic violence further suggests that one consequence
    of violence done to interpretive systems is a subordinate speaking position in
    culture.


