  md: '# A Dual Gaze


    I concur with Yuval Davis and Amorós that ethnicity is not unique to op-ressed
    minority groups. Hegemonic groups are sexually and ethnically marked, even though
    men establish themselves as “neutral” by natural-izing a set of essentialized
    values with their ideologies and practices. Their own benefits are at play in
    racism and sexism (Yuval Davis 2010, 66–67; Amorós 1998, 40–54), delegating the
    role of “symbolic guardians of national purity,” together with their own duties
    (Amorós 1998, 39–41; 2005, Yuval Davis 2010, 65). The narrow link between the
    colonial policies and the gender biases is sustained thanks to the im-plicit,
    interclassist, interethnic, and metastable “patriarchal agreements” (Amorós 1990,
    2), which reaffirm themselves in games of power that consolidate double or bivalent
    hierarchical structures (1998, 40). Briefly, my position is that the mainstream
    decolonial stance ignores the subaltern status of women, whereas it builds upon
    only racialized, homogenous, equiphonic, and equiponent collectives ignoring the
    sex-gender variable. In the remaining sections of this essay, I develop the idea
    that mainstream decolonial works do not use critically sex-gender-ethnorace categories.


    In my view, “coloniality” should be understood as having (1) a racial meaning
    articulated among, others, decolonial thought; and (2) a sex-gender meaning articulated
    and denounced by feminists who refer to the colonization of women under the headings
    “patriarchal ide-ology,” “androcentric bias,” and/or “masculinist bias” (Amorós
    1990, 2–3; Femenias 2015, 137–46). If the first concerns racist discourses, the
    second one concerns sexism discourses, which, based on biological, ontological,
    cultural, religious, linguistic, and/or territorial assumptions, legitimate exclusion,
    subordination, invisibilization, and/or exploitation of women and the sexually
    differentiated collectives. The critical ways in which many decolonial thinkers
    appeal to identity, constitute a serious problem for women.


