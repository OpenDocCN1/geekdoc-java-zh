    Decolonizing communicative practices requires letting go of a priori frames of
    judgment that often block our ability to link global and local phenomena. I suggest
    that this is precisely what obscures Weber’s capacity to “see” the creative agency
    involved in colonized communities. He sees through the perpetuation of ancient
    and unchanging belief-systems—whereas, if we link local phenomena to the long
    history of colonialism, we might be able to see variation, resistance, and the
    transformations in identity structures placed by colonialism, as Oyèwùmí and Nzegwu
    show. We might also be able to see the subversive agency of religious women such
    as Asasi-Diaz describes.

    Decolonizing feminist theory cannot succeed without an epistemic shift in methodology
    that recognizes the intentional self-defining practices that occur in the everyday,
    Asasi-Diaz recounted. We have to move in two directions at once: (1) localizing
    our analyses of gender formation in order to understand the specificity of its
    form and its effects, and (2) avoid portraying any gender practice as symptom,
    but also relating the local cultural, religious, or ethnic practices to a transnational,
    colonial history. This requires being alive to the capacity of everyday agency,
    and the disparate realities of colonial contexts.


