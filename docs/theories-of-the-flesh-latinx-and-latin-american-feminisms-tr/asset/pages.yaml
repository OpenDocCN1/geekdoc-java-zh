    # Revisiting Decolonial Thought


    To move forward, we need a new starting point. Teresa de Lauretis asserts that
    critical questioning is only possible after the abandonment of ideological complexity
    with the ‘oppressor,’ which means putting into action deep change in consciousness
    (de Lauretis 1993, 74–75). Is Palermo (and other decolonial female thinkers) also
    to disable herself (themselves) from the gender biases of decolonial discourse,
    transform her (their) “scientific canon,” and generate an alternative discourse?
    In the majority of cases, as Palermo’s texts, the discourse is caught in essentialist
    comments and stereotypes of ‘the culture of the we’ (2008, 139). That is, the
    adoption of certain notions indicating their traditional meaning hinders them
    from challenging the biased conceptual cores of decolonial discourses. As Mellino
    asserts in his analysis of postcolonial thought—applicable to this case—adopting
    such notions would amount to “discourses between accomplices and critics” (2008,
    122). In other words,


