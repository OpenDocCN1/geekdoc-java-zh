  md: '# CHAPTER 3 | From Women’s Movements

    to Feminist Theories

    (and Vice Versa)


    MARÍA LUISA FEMENÍAS


    IT IS NOT AN easy task to elucidate the general trends of feminist theory, the
    vitality of women’s movements, and the impact of gender categories in Latin America
    in recent decades. With a strong propensity toward nonconconventional direct action
    and participatory structures of a communitarian, congregational, and multisectoral
    variety, women are often at the center of liberation movements. They promote national
    and transnational social networks tied to peace processes, women’s rights, and
    human rights in general, and more recently they fight against environmental pollution.
    I consider a “movement” as a form of collective action that appeals to solidarity
    in order to promote social changes, exceeding the limits of the system of norms
    and social relations which it operates, thus having the capacity to produce new
    norms and legitimacies in society (de Miguel 2000, 1). The practices of women’s
    movements prefer reality and dominant cultural codes. This view does not aim to
    ontologize the notion of “movement” itself (unless we develop an ontology of dynamic
    factors rather than substances); nor does it require a discourse about the “Latin
    American Woman” identity, although it is possible to recognize some common features
    among the women who populate our continent (Femenias 2006, 2009, 2013, 2015).


    Since the 1980s, the agenda of women’s movements received the noticeable impact
    of gender categories and identity claims (Schutte and Femenias 2010, 397–411).
    In addition, it was from the 1980s on that the central axis of women’s movements
    began to move from “equality” to “identity” claims, bringing to the fore problems
    of sexual orientation, trans identity, and ethnic racial. These heavily debated
    identity problems were influenced and touched by postmodern and decolonial discourses


    > Maria Luisa Femenias, From Women’s Movements to Feminist Theories (and Vice
    Versa): In Theories of the Flesh, Edited by: Andrew P. Jitts, Mariana Ortega and
    José Medina, Oxford University Press (2020). Oxford University Press.

