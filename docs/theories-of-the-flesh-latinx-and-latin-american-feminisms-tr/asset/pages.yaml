  md: '# CHAPTER 8 | “Remaking Human Being”


    Loving, Kaleidoscopic Consciousness in Helena Maríá Viramontes’ Their Dogs Came
    with Them


    PAULA M. L. MOYA


    The process of true decolonization involves above all a willingness to participate
    in the process of remaking human being.

    —DARIECK SCOTT (2010, 45)


    IN HER 1987 BOOK Borderlands/La Frontera, Gloria Anzalúa warns against the dangers
    of remaining locked in “the counterstance.” Calling for the development of a “new
    consciousness,”a mestiza consciousness, she reminds her camaradas that an initial
    reaction to the violence of domination might involve directly challenging those
    who subjugate us, an adherence to a logic of resistance will reduce all subsequent
    interactions to a “common denominator of violence” (100). She continues:


    At some point, on our way to a new consciousness, we will leave the opposite bank,
    the split between the two mortal combatants somehow healed that we are on both
    shores at once, and at once, through seront and eagle eyes. Or perhaps we decide
    to disengage from the dominant culture, write it off altogether as a lost cause,
    and cross the border into a wholly new separate territory. Or we go another route.
    The possibilities are numerous once we decide to act and not. (100–101)


    Anzalúa is clear about the act, and define about the necessity of moving out of
    the counterstance. She is, however, less clear about what to do. Refusing to use
    one way forward, Anzalúa considers an array of options characterized by a radical
    decentering of the terms within which Mexican descent in the United States have
    been constituted as naturally inferior persons.


    Paula M. L. Moya, “Remaking Human Being” In: Theories of the Flesh, Edited by:
    Andrea J. Pitts, Mariana Ortega, and José Medina, Oxford University Press (2020).
    © Oxford University Press. DOI: 10.1093/oso/9780150029625.003.009'
