    As I have explained elsewhere, schemas are sensory-motor and cognitive-affective
    learned structures that have been built up through past behavior and experiences
    in specific domains; they are central to persons'' perception and cognition as
    patterns for behavior (Moya 2016, 1–37). The effect of reframing Miss Eastman
    through the additional schemas provided by Ermila and the third-person external
