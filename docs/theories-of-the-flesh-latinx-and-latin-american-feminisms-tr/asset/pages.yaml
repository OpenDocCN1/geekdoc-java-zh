    practice (Hierro 1985).


    Hierro understands normal norms as agreements that can be revoked if the consequences
    of their fulfillment do not adhere to the principle of justice, which is centered
    around the idea that individuals should not be treated differently. This results
    in extreme suitable for proposing reform of the idea of the feminine condition:
    “The ethical decision about the actual feminine condition is supported in the
    evaluation that is made of its tendencies and its consequences, insofar as these
    are beneficial for the majority” (Hierro 1985, 93–94).


    For Graciela Hierro the central category applicable to the feminine condition
    is that of “being-for-others,” which, according to de Beauvoir, situated on an
