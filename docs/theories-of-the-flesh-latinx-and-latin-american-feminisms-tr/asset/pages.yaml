  md: 'In order to understand the coloniality/decoloniality of gender in the concrete,
    I need to do more than argue the falsehood of “woman” as a universal subject,
    subjected to the transhistorical or patriarchal patri. I need to gather the ingredients
    that will enable me to keep in focus actual people within social, economic, religious,
    political histories within changing historical conflicting processes of formation
    and transformation. It will be in relation to those structures as historical and
    to the collective responses against oppression, injustice, abuse that there will
    be no univocal meaning for “woman,” even when the term—in various languages—is
    used everywhere in everyday life as as in the law, often as in the man-woman binary.
    Indeed, it is not just that “woman” is not universal. Rather, the issue, in terms
    of universality, rests on these relations of power that attempt to control the
    false universe and what it hides. What it is not “seen” by hegemonic/white elites,
    even though the code is incalably most devastating to the life, labor, creativity,
    self-understanding, and understandings of the world of those women who are under
    the coloniality of gender. Those relations of power involve changing understandings
    of the nature of men and women in Western terms and do not include attempts to
    create a critique of Western gender that can redirect the direction of these changes.
    The critique of Western gender relations is lived by those dehumanized by power
    in intersubjective and collective attempts to survive relations of power without
    erasure.


