  md: 'In order to negotiate group identities, it is necessary to work toward the
    cooperative resolution of conflicts, which is not always possible. There are different
    strategies that seem to offer, in interesting ways, a basis for the negotiation
    of ethnicity and gender: the strategy around the notion of “positional objectivity,”
    as defended by Amartya Sen (1993); and the strategy around the notion of “reflective
    equilibrium,” as defended by Alicia Gianella (2001). In the former, there is an
    implicit appeal to the ideas of equality and universality, with the notion of
    “equivalence” underscoring irreducible particularity and normativity. The latter
    reflective equilibrium enables us to connect normative issues with concrete experiences
    and situations. For Gianella, reflective equilibrium is a tool for recognizing
    disequilibrium. Nonrecognized groups at social scale can amelior their situation
    on two fronts simultaneously; on the one hand, generating new norms in the political
    sphere; and, on the other, producing substantive changes in practice. The recognition
    of instability and the need for constant negotiation contribute to a conception
    of reflective equilibrium understood as an aspiration that takes into account
    what Miranda Fricker calls “epistemic injustice” (2007, 1–2).


    Both strategies can help conceptualize and address issues of exclusion and can
    contribute to the development of an eman(anti)cipatory imagination. This imagination
    can be reached, a universality that has not yet been reached, but should not be
    rejected either. Creating consensus and consciousness-raising with respect to
    inequity is pressing challenges and tasks that appear in different stages of development
    in Latin America. If inequality is not the same as the identity, then cultural
    recognition must be gender-sensitive (or gender-conscious) because striving toward
    equality should not mean neglecting differences. To erase these tensions is to
    cover the challenges that arise from articulate tensions of inequality and conflict,
    and to erase the paradoxical tensions that emerge from outlining desires for translational
    bridges that we cannot help but to construct.


    Working with the notion of negotiated identities can be enlightening and enriching.
    Undoing ossified identitarian and identifying structures is a difficult process
    for both groups and subjects-agents. Promoting this debate and the progressive
    options within it already involves a game of negotiated identities and a critical
    revision of components of identity. This task would undoubtedly benefit women
    because it would favor analysis of the nexus of categories of ethnicity, sex,
    gender, class, religion, social status, orientation, and so on, to affirm their
    negotiated inclusion in an open-ended set. In a process of nonnaturalized self-affirmation,
    critical space is fundamental. In this context, identity'
