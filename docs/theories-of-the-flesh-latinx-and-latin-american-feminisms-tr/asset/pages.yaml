    # (Re)imagining Decolonial Feminist Futures


    Fourth, decolonial feminist futures are not possible for communities of color
    unless we seek alternative systems and practices for (re)evaluating our work.
    This decolonial feminist turn toward the “future” includes developing new social
    imaginaries and visions (Paredes 2008). Aspiring to and mimicking light-side gender
    and color arrangements will not get us there. Instead a decolonial feminist asks,
    what other liberatory possibilities and alternative modes of being and relating
    are available to us within the communities relegated to the dark side? And perhaps
    these two will require creative transformations (Paredes 2008). Rather than primarily
    critiquing the world we don''t want to live in, the (re)orientation I am suggesting
    including more time and energy toward imagining and activating the world we want
    to live in.


