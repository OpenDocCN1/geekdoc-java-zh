  md: '# NOTES ON CONTRIBUTORS


    Linda Martín Alcoff is Professor of Philosophy at Hunter College and the Graduate
    School, CUNY. She is a past president of the American Philosophical Association,
    Eastern Division. Recent books include Rape and Resistance (Polity, 2018); The
    Future of Whiteness (Polity, 2015), and Visible Identities: Race, Gender and the
    Self (Oxford University Press, 2006), which won the Frantz Fanon Award for 2009.
    For more information go to www.allcoff.com.


    Mary K. Bloodsworth-Lugo is Professor of Comparative Ethnic Studies and Director
    of American Studies in the School of Languages, Cultures, and Race at Washington
    State University. She has coauthored several books with Carmen R. Lugo-Lugo, including
    Feminism after 9/11: Women’s Bodies as Cultural and Political Threat (Palgrave
    Macmillan, 2017), Projecting 9/11: Race, Gender, and Citizenship in Recent Hollywood
    Films (Rowman & Littlefield, 2014), and Containing ((Un)American Bodies: Race,
    Sexuality, and Post-9/11 Constructions of Citizenship (Ropodi, 2010). She coedited
    Race, Philosophy, and Film (Routledge, 2013) with Dan Flory, and coauthored Animating
    Difference: Race, Gender, and Sexuality in Contemporary Films for Children (Rowman
    & Littlefield, 2010) with C. Richard King and Carmen R. Lugo-Lugo. Professor Bloodsworth-Lugo
    is also author of In-Between Bodies: Sexual Difference, Race, and Sexuality (SUNY
    Press, 2007).


    Kevin Cedeño-Pacheco is a dual-title PhD candidate in philosophy and African American
    studies at Pennsylvania State University. His research focuses on the overlap
    between aesthetics and politics in critical philosophies of race and gender advanced
    by African American and Latin women'
  merge: -1
