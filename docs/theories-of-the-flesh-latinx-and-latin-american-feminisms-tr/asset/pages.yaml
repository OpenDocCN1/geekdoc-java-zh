  md: '# Anzaldúa’s Affinities with Nietzsche


    In terms of achieving a creative approach to our intellectual projects, I mentioned
    earlier the important correlation at stake for Anzaldúa be-tween establishing
    the identity she longs to claim as a person and her identity as a writer. One
    might call this a matter of style (both personal and literary), but a more examination
    signals a greater complexity. In this context, some of Anzaldúa’s affinities with
    Nietzsche as a writer, as well as of their differences, may be of interest. For
    example, as already mentioned Anzaldúa states that she cannot never write from
    “any part” of her life ([1987] 2007, 95). This recalls the intense bodily and
    spiritual passion evoked by Nietzsche when he states, in the words of Zarathusta:
    “Of all that is written I love only what a man has written with his blood. With
    blood and blood, you will experience that is spirit” (1966, 40). Despite the marked
    differences in gender positions and political outlook contextualizing these statements,
    both are veiled testimony of the deep link between the author’s writing and that
    person’s lived experience. This way of thinking, in both authors, allows for a
    multiplicity of perspectives to come play vis-à-vis one another without getting
    stuck in rigid binaries as body/mind, passion/reason, poetry/; or conventional
    dichotomies of good versus evil. While Nietzsche sheds monolith and allegedly
    impartial epistemologies in favor of a plurality of perspectives, Anzaldúa structures
    gender and cultural monologisms in favor of what she calls the *new consciousness*.
    (In Spanish the word *conciencia* means both “conscience” and “consciousness.”)
    Both authors reject stylistic and conceptual homogeneity in favor of aesthetic
    and epistemic diversification. And yet, there is a sense in which precisely in
    view of acknowledging the intellectual and moral relevance of plural phenomena
    in life experience, the question of the sociocultural construction of mestiza
    identity takes on new significance.


    # New Mestiza Identities and Their Significance


    For Anzaldúa the Borderlands are a place where multiple types of cultural experiences
    are compressed. The clash of cultures is so intense that the likely fragmentation,
    condensation, and superposition of meanings result in some of the turbulent and
    confusing mental states she has described. As we have seen, the path to self-knowledge
    she embraces—despite its discomfort—is one that is willing to confront the fragmentation
    and inter-ally felt contradictions when multiple gender, sexual, and ethnic norms
    and expectations clashing against one another, and either'
