    In follows I will apply the notion of translation as equivocation to Lugones''s
    discussion of the coloniality of gender to explore the insights of some Latin
    American feminists who were enacting a decolonial politics avant la lettre.


    In an article entitled “Toward a Decolonial Feminism,” Lugones states that the
    hierarchical dichotomy between human and nonhuman is a central mark of colonial
    modernity:


    Beginning with the colonization of the Americas and the Caribbean, a hierarchical
    distinction between human and non-human was imposed on the colonized in the service
    of Western man. It was accompanied by other dichotomous hierarchical distinctions,
    among them between men and women. This distinction became a mark of the human
    and mark of civilization. Only the civilized are men or women. Indigenous peoples
    of the Americas and enslaved Africans were classified as not human in species—uncontrollably
    sexy and wild. (2010, 734)


    The mission of Christianity focused on the transformation of noncolonized humans
    in man and woman. The colonized human female was not only racialized, but also
    reinvented as a woman through Western gender codes. Therefore, Lugones sees gender
    as imposition of modernity/coloniality: “The suggestion is not to search for a
    non-colonial construction of gender in indigenous organizations of the social.
    There is no such; ‘gender’ does not travel away from colonial modernity” (2010,
    746).


    However, why not think about gender, as well as other categories of difference,
    as equivocations, that is, as classifications possessing a single meaning and
    different representations from plurivers perspectives? If we decide to take this
    route, then we have to engage in the difficult process of cultural translation,
    avoiding the pitfalls of the coloniality of language and colonial translation.
    According to Mignolo (2003), resistance to the coloniality of gender, as Lugones
    observes, implies linguistic resistance. It involves opposition to Eurocentric
    representational paradigms and celebration of “poly/plilingualaging”—an act of
    mapping, producing, and distributing a local, subaltern knowledge system (Mignolo
    2000, 247) to change linguistic cartographies⁵ I interpret these contestatory
    practices


    ⁵ A classic example of plurilingual explored in the literature is Andalua’s (1987)
    deliberate practice of speaking in tongues / multiple registers to defy the reader’s
    colonial attempt to (textually) master subaltern subjects.'
