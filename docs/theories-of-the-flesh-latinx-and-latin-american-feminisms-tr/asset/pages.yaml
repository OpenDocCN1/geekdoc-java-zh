    cohort of scholars.


    What makes a project decolonial? Building on the examples suggested above, I identify
    several key features of decolonial thought.7 Scholars who have taken the decolonial
    turn what Nelson Maldonado Torres calls “insurgent subjectivity”; they agree on
    the imperative to be intentional and inventive action.8 Neither refusing the given,
    decolonial thinkers turn aside nor perceive anew. Because their starting point
    is the referential inaccuracy and genocide of the European colonial imaginary,
    decolonial thinkers observe and critique key aspects of that imaginary—including
    its commitment to autonomous individualism, abstract and binary thinking, and
    Eurocentrism.9 Championing the necessity of relationality witnessing and rigorous
    self-assessment, decolonial thinkers move away from dehumanizing binary logics
    toward onto-epistemological multiplicity and the development of complex solidarities.10
    Colonized peoples are not figured as problems to be dealt with (e.g., “The Negro
    Problem,” the “Mexican Problem,” the “Indian Problem”), but rather as potential
    resources whose ancestral forms of knowledge and current cultural self-ways can
    chart a path away from the master morality and penchant for what undergirds unreconstructed
    western modernity (Asia-Diaz and Mendez 2012; Maldonado-Torres 2011; Pérez 2007).
    Categorically rejecting the subordination or exploitation of others as either
    a primary or unintended consequence of caring for self, they put their energy
    and imagination into the service of remaking themselves and the world(s) they
    inhabit. The decoloniality is the creation of a new world—a different kind of
    world “in which many worlds fit,” to the borders of the Zapatista Liberation Movement
    ( (2001). This “new” entails a total renovation of the current one—a reworking
    of subjectivity, community, institutional arrangements, and the logics which humans
    live


