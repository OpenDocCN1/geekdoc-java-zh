    # Hermeneutic Violence


    Defined as violence due to structures of meaning and intelligibility, hermeneutic
    violence has played an important role in the persistence of European colonialism
    through its various historical iterations in neocololonialism, imperialism, and
    neoliberalism. The idea of hermeneutic violence begins with a particular picture
    of how human beings understands and make sense of things that differs from the
    standard view in the social and natural sciences, where making sense of things
    is based on subject-dependent interpretations of this naturalized framework. The
    understanding that arises from this framework is based on an objective knowledge
    that is reflective instead of prerequisite, and is often reducible to cognitive
    procedures. This account does not foreclose social dimensions of knowledge, but
    it does bind to toxic attitudes and the epistemic effects they have on relational
    agents; at bottom, what does not drop out is a founding framework of an inner
    mind driven by neurophysiological processes and an outer world accessible through
    mental representations, when talking about shared intentions or “collective” forms
    of intentionality. On the hermeneutic view, the knowledge generated through this
    perceive contains as a kind of knowledge, but one that is limited to the history
    of social practices concerned with causal explanation and explanatory understanding,
    one that is very useful for distinguishing between things like knowledge attribution
    and possession. It is typically accompanied by a view of linguistic practice based
    on natural languages as tools or “mediums” of expression for the inner mental
    acts of knowing agents, thus making possible the manifestation of human understanding
    in propositional statements like “S knows that P.” Under this framework comes
    first, language second.


    Hermeneutical understanding, by contrast, seeks to describe how human understanding
    is something we always do prereflectively and cannot otherwise disage ourselves
    from if we are to make basic'
