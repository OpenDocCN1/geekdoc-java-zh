  md: 'I grew up surrounded by the pulsating rhythms of Tito Puente and Machito and
    the teasing, sensual songs of Graciela. The deep, robust voice of Celia Cruz brought
    Africa to our home. In our cramped living room on 102nd Street, my brother taught
    me to mambo. There, too, my father took me in his dance, powerful arms and we
    swayed to the tune of a jibaro ballad. In the bed we shared, my mother rocked
    herself to sleep while the radio crooned a heartbroken lament. And my grandmother,
    cleaning the altar played songs to the gods and goddesses. Imitating the motions
    of the sea, let her body be carried by an imaginary wave, taking my hand, encouraged
    me to follow in her steps. In Abuela’s world, our hearts beat to the drum song
    of the thunder god, Changó. (2004, 2)


    While this opening passage suggests a rather idyllic scene of family togetherness
    and sharing, Moreno Vega’s narrative actually offers a more complex portrait,
    one in which our dark-skinned young narrator, Cotito, gradually becomes painfully
    aware of the gender and racial inequalities that impinge on the family relationships.
    The above passage highlights language, movement, even tears, but also the pleasure
    of dance and prayer as it weaves the popular music of the era with Orisha worship
    celebrated as inheritance, song, imagination, and bodily motion.


    The narrative conveys muted collective awareness across Cotito and her siblings
    of their participation in dynamic cultural practices rooted in diaspora. In this
    case, diaspora worldviews have a continued force at home, but are also depicted,
    at a pivotal moment in musical cultural history, fusing with secular moves to
    create new cultural phenomena in/from/about the diaspora—Puerto Rican and Cuban
    musicians of the era she invented and performed music infused with the languages,
    beats, and concerns of African diaspora Orisha practices with which were familiar.
    One of a few key moments in the narrative when Cotito recognizes the groundbreaking
    fusion of sacred Orisha sonic traditions with secular musical forms at a Celia
    Cruz concert she attends with her brother Chacito at the Apollo Theater (Moreno
    Vega 2004, 242–243). Orisha and African diaspora practices represent not a static
    past but a dynamic, ongoing, transformative cultural experience that comes to
    inhabit new sonic spaces in New York of the 1950s. In this memoir the younger
    generation is more willing to embrace diaspora knowledge, especially as they morph
    into new cultural spaces, in contrast to their parents, who not actively pass
    these on to their children.


