    # My Own Project


    What am I doing is to continue the work of U.S. Women-of-Color feminisms which
    is the from the where I think across to other places where racialized women resist
    dehumanization. I think of the possibilities of transformation away from the oppression
    of the different forms of coloniality, away from the logic of modernity/coloniality,
    its various understandings of “reality,” its practices and ideologies of production,
    its perception and imagination. This work has paid attention to subjectivity and
    intersubjectivity as it has focused on work of color doing the radical work of
    metamorphosis. While the western construction of what since the 1970s is called
    “gender” and “gender relations” is oppressive to proletarian and bourgeois women
