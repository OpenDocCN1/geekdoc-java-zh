    the logics that structure them, decolonial thinkers seek to subvert a colonial
    way of being by setting aside inherited assumptions to envision new social, political,
    and ontological possibilities. By attending to excluded and denigated perspectives
    on the social world, they open themselves up to previously disregarded as well
    as imagined possibilities—the exploration of which requires the kind of imagination
    and inventiveness found in the fiction of decolonial writers like Helena Viramontes.


    In a claim for the importance of literature and literary criticism to the larger
    project of decolonization, I show how the decolonial features described above
    manifest in a work of literature, taking as my example Viramontes''s (2007c) novel
    Their Dogs Came with Them. Viramontes incorporates into her fiction specific features
    that ally her with a diverse group of decolonial artists and scholars across several
    disciplines. Similar to the scholars with whom I compare, she explores the dynamics
    of subordination while imagining alternative and more egalitarian ways of being
    in the world. Differently from such scholars, however, she conducts her decolonial
    intervention through fiction. Neither analytical, Viramontes''s writings nevertheless
    reveal the socioeconomic and ideological forces that keep Latina/os and other
    people in colors of subordination. As aesthetic artifact that works at the level
    of emotion and the imagination, decolonial literature has the potential to reach
    a much larger audience in a more profound way than can be expected of most scholarship.


    Their Dogs Came with Them is an omnibus novel set in East Los Angeles during the
    decades of the 1960s and 1970s. It portrays the contiguous, and occasionally intersecting,
    daily lives of a diverse range of characters who populate the neighborhood around
    the Long Beach and Pomona Freeways interchange during a time of intense social,
    political, and geographical upheaval. Taken as a whole, the novel explores what
    happens to relatively powerless people who live in a community, because of how
    their residents are situated within a prevailing racial and socioeconomic order,
    is subject to a range of externally produced and pernicious structural forces.
    It shows how those most affected by the building of the LA freeway system—those
    who are either displaced by the freeways or else condemned to live in their shadows—first
    encounter the coming upheaval. It brings forward in time to show how the neighborhood''s
    dismemberment has negatively impacted already limited transportation and employment
    options. The effect is to show how the freeways enact what literary Rob Nixon
