    First, it is necessary to analyze the feminism that preceded the 1970s. It deliberately
    points out the problem of naming. For a long period of time, the movement for
    the vote was not called feminist but simply suffragist; even today there are people
    who refer to it as such, distinguishing it from feminism. However, this first
