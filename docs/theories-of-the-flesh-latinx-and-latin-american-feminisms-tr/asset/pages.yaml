  md: 'as MALCS: Mujeres Activas en Letras y Cambio Social (founded in 1986) and the
    Roundtable on Latina Feminism (founded in 2006, now called the Latina/x Feminisms
    Roundtable) have provided resources and support to generations of Chicano and
    Latinx scholars in the United States. Also, by Francesca Gargallo and other Latin
    American contributors in the volume, the trajectories of feminism and academic
    feminist projects have developed along different genealogical trajectories across
    the Americas. With this critical difference in mind, we hope to highlight the
    historically and culturally diverse forms of feminist engagement through Latinx
    and Latin American feminist critiques. Building bridges across generations of
