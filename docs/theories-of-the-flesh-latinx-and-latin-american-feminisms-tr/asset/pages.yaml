    # Epilogue


    As a closing thought, let’s consider subjects and their identities as the effects
    of social discourses and practices that have to be specified. There cannot be
    a discourse of decolonization, a theory of decolonization, apart from decolonized
    practices. This means to question the same daily practices and discourses. To
    begin with, the very concept of “colonization” has to be closely analyzed, as,
    for example, it means “races and cultures colonization” but also patriarchal “colonization”
    of women’s minds, is well known, which covers and updates new forms of subalternity
    and dependence. Women’s movements specify those practices in the public sphere.
    Although hegemony thought does not account for them, they prejudice reality and
    subvert dominant patriarchal cultural codes. For instance, when Quijano encourages
    “redistributing power” between racialized groups, he excludes sex-gender power
    distribution. This is because he has homogeneously constructed women and men as
    members of the “races”, presupposing that their situation is equivalent. Most
    he refer to “women” as remaining naturally subordinated to the traditional order.
    Furthermore, the colonial of power does not only institute hierarchies in society,
    but also concentrates wealth and social privileges, setting “white men” at the
    top and racialized and sexual-gendered groups below, paradigmatically women in
    a subordinate status. The construction of racial, essentialized, and homogeneous
    groups of “the Woman’s voice” is not a solution for subsuming the expressions
    of desires and needs in distinctive voices in women’s movements, but rather is
    a fundamental problem. For its intrinsic democratic value, I for a genuinely “polyphonic”
    presence of the plural voices of women in positions of political representation
    in national and transnational public spaces.


