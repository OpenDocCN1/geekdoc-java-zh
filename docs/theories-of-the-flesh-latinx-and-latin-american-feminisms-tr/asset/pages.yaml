  md: '# CHAPTER 13 | Hallucinating Knowing

    (Extra)ordinary Consciousness, More-Than-Human Perception, and Other Decolonizing
    Remedios within Latina and Xicanana Feminist Theories


    PEDRO J. DIPETRO


    THE PILGRIMS BECAME TRANSIENT citizens of the world in the 1600s when they mistook
    Wampanoag territory for empty lands waiting to be ravaged. The US Immigration
    and Customs Enforcement Agency continues this settler colonial project and predatory
    today. Unlike pilgrims, undocumented immigrants in the twenty-first century are
    as illegal and reside there at a place of fracture. They feel torn across boundaries
    of nation, race, class, gender, sexuality, and ability. Within this historical
    juncture, the shattering of subjectivity underlies the undocumented Latin condition.
    Various archives of feminist, queer, and trans* of color prism foreground feelings
    and knows about negotiating life as trespassers, as not quite fitting into the
    rule of legality. In so doing, they manifest extraordinary consciousness against
    a legacy of destitution and illegality.


    This chapter examines how the Latin subjectivities foster more-than-human and
    more-than-ordinary consciousness. Within Latina feminist theories in general,
    and Xicanana feminist theories (XFT) in particular, hallucinations denormalize
    and decolorize memories of mobility and trans. Between 2011 and 2014, I joined
    a network of radical Latin and Xicanx performers, artists, and poets in the San
    Francisco Bay Area, where I encountered this hallucinating wave of knowing.¹¹


    > I follow an impure understanding of Latina and Xicanx subjectivity (Lugones
    2003, 121–50). This network consists of cultural activists from diverse socioeconomic
    and geographical backgrounds, from cis and trans communities, including Chicanas,
    Mexicanas, Tejanas, Nuevomexicans, Chapinas, Oaxaqueños, Salvadoreans, Cubans,
    Puerto Rico,


    Pedro J. Dipetro, Hallucinating Knowing: Theories of the Flesh, Edited by: Andrea
    J. Pitts, Mariana Ortega, and José Medina, Oxford University Press (2020). ¹ Oxford
    University Press. DOI: 10.1093/oso/9780190062965.003.016'
