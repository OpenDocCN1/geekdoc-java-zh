    takes up gender the use it has in the anthropological literature as a practical
    device that she does not criticize. The gender system is a central aspect of the
    mundo aldeea she characterizes as a low-intensity patriarchy that is constituted
    as a duality rather than a binary. The distinction is important for her and for
    me, as it is for many women working on decolonial feminism. Thus she understands
    that arrangement as one is significantly different from the dichotomous modern
