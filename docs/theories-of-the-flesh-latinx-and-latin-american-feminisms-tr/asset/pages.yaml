    and gay paradigms” (Pérez 2009, 10). Serratos’ photographs open up new possibilities
    for queerly understanding the “homeboy” figure, and for disrupting hegemonic topicalizations
    of Latino. Disidentification is at work at all levels in these photographs: the
    “gangster” as sensual derelict as saintly. Serratos is working from within the
    dominant culture, neither completely assimilating himself to subjects dominant
    violence of a Latino culture nor completely rejecting them.¹⁶


