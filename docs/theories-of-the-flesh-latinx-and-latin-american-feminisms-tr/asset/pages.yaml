    # Ada María Isasi-Díaz and Democratic Epistemic Practice


    The late theologian Ada-María Isasi-Díaz, one of the first Latina feminist theorists
    who flourished in the United States during second-wave feminism, wrote about the
    different and distinct experiences and approach of US Latinas. She later developed
    what she called a *mujerista* theology that adapted certain aspects of liberation
    theology’s “preference for the poor” to US Latinas. Isasi-Díaz argued that applying
    this without deconstruction acknowledging poor women as regularly engaging in
    the theological work of seeking, interpreting, and bringing forth the sacred.
    Encho Anzaldía held that “for the sacred is an integral part of our daily lives”
    (1993, 178–79). In other words, she defines the sacred as involving all the practices
    that validate Latina lives and ways of being against efforts to *invisibility*
    or commercialize our traditions, including such everyday things as ways of cooking,
    gardening, dressing, expressing faith, and forming community. There is an intentionality
    in these practices, she seeks a conscious epistemic validation. “Those who are
    influential in society are not our models” (180). Their reasons are not ours,
    nor are our values ours. Validating Latina lives requires facing the challenge
    of finding and protecting the value in the everyday existence of the oppressed.
    This is what Isasi-Díaz refers to as sacred work.


    Isasi-Díaz identified the obstacles to this work as including authorities, traditional
    academic theology, and feminist theory. In the first pages of *Mujer Theology*
    she quotes one of her Puerto Rican students who expresses a long-standing discomfort
    with feminist theory since it never took into account her understandings, or allowed
    her space to contribute in her own terms “not in the shadow cast by the Anglos”
    (1996, 2–3). Hence, the corrective is not simply to incorporate analysis of Latina
    lives within feminist theory but to empower Latinas as theorists themselves. Throughout
    her own writing and religious practice, Isasi-Díaz appropriates the position of
    the theorist and authority, revising the methodology of the theologian, reinterpreting
    the liturgy, even rewriting a contemporary version of Psalm 137.'
