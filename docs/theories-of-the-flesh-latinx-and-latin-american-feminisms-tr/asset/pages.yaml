    experiences, as well obscures our own awareness about how ethnic identifications
    often do the work of race while seeming to be theoretically correct and politically
    advanced” (247). Alcoff also cautions that in the case of Latinos/os,“moving away
    from race to ethnicity is not necessarily moving away from race” (38). Or, as
    Silvio Torres-Saillant categorically states, “Latinos cannot escape the preponderance
    of race in the United States” (2003, 130). The paradox embedded within racial/ethnic
    categories as they have developed and deployed in relation to Latinos/os has created
