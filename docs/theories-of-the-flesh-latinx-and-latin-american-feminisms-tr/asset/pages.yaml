  md: 'If we agree that El camino se hace andar,¹¹⁸ then decolonizing gender calls
    us to develop practices that habituate and reorient toward “moving differently”
    in the world and in so doing what we think is possible. For those of us who find
    ourselves suffocated by light-side gender and gender arrangements, producing more
    critical analysis is not enough. We must seek to develop practices that actively
    engage our bodies in the decolonizing process. The call to develop and “ritualize”
    every lived practice that can rehearse, embody, and habituate us to new forms
    of socializing, being, and relating acknowledges the extent to which we can be
    transformed by our embodied experiences of freedom (Abod 2016). Indeed, how we
    can take back our bodies, and what can we do embodied experiences of freedom look
    like?


    # Conclusion: A Call for Theory/Practice That Centers Collective Well-Beings


    This approach to gender is about doing theory that is attached to practice and
    about rethinking gender toward transformative ends. I have argued that colonialism
    and processes of racialization tied to capitalist accumulation are inextricably
    linked to how we contemporarily understand gender, sided bodies, and sexuality.
    Given how I understand the gender categories to be tied to colonial relations
    of power and logic, this particular brand and localized version of decolonial
    feminism-in-the-making is not invested in women of color or being retroactively
    included in the category “Woman” nor being assessed through light-gender or gender
    arrangements. If we understand gender this way, then accessing light-side wages
    of gender means simultaneously integrated into an arrangement of bodies and power
    that is equally oppressive and has little to no de liberatory potential for women
    of color. Indeed, how we understand gender makes a difference not only for how
    we frame our contemporary relations, but also for what we consider to be the necessary
    ingredients for reimagining our various socials in literary ways.


