  md: '(e.g., boomerang perception) of people of color that leave senses of being
    self-disjointed (e.g., xenophobia), (e.g., passing), or violently objectified
    (e.g., hypersexualization). In this context, Latina identity is readily negotiated,
    challenged, or reinforced through the body (Mendible 2007, 4). It is gendered,
    hybrid, and transactional site of ethnic identity articulated through embodiment
    (4). As a transactional site of ethnic identity, Latina identity has also become
    a signifier of commercialization and consumption in a world where boomerang perception
    overwhelmingly informs the narratives of cultural and racial authenticity. In
    our global economy, the Latina body has come to function as a type of negotiable
    currency that participates in the mythological narrative of a multicultural United
    States (13). The trope of the ethnic beauty has served as a commercialized spectacle
    of national incorporation using discourses of authenticity and reality, which
    believes the lived realities of Latina today, who are overrepresented in high
    school dropout rates, teen pregnancy, and low-wage factory and domestic labor
    (14).


    The “reality” of identity gains traction through cultural messages that register
    horizontal relations of identity through the possibilities sameness. In instance,
    a claim like “Real Puerto Rico” makes sense when cultural messages dictate that
    the only way to participate in the shared history of Puerto Rico is through a
    logic of homogeneity predicated on a belonging that is built through history and
    geography. Similarly, when we consider what it means to be a “real” Latina, cultural
    messages indicate that authenticity can be found in homogenous commercialized
    scales. For instance, L’Oreal Group for the “True Match” (unlike any of the other
    models in the advertisement) 100 percent Puerto Rico. Carmen R. Lugo-Lugo (2015,
    99) has subsequently argued that a claim to 100 percent Latina ethnicity is a
    marketable condition in a way that 100 percent whiteness or 100 percent blackness
    is not. Being “real” or “authentic,” as opposed to fake or maybe only “50 percent,”
    is given credence in a world where what it means to Latina has been disjoined
    or objectified through a white perceptual process. Moreover, it is a process that
    now takes the object of identity as marketable and profitable.


    Lugo-Lugo (2014, 126) argues that the pan-ethnic label of “Latina” is flattened
    through commercialization that homogenizes the term by lumps all Latina into one
    category, and making a desirable object of consumption through a narrative of
    pride. Pride in ethnic, racial, or national heritage makes identification viable
    with the category. Unfortunately, the commercialized homogenization of Latina
    constructs the identity through a white imaginary lens that does not leave room
    for differences. The feeling of pride, Lugo-Lugo (2015, 136) argues, emerges'
