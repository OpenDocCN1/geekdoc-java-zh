    Without throwing the equivocal gender category away with the bathwater, articulating
    it in ways that challenge the modernity/coloniality binaries, we are able to perhaps
    a more productive path, one that has already been trampled by many feminists—Latin
    American and Western feminists of science—who are rethinking the boundaries between
    human and nonhuman, matter and discourse, bringing other earth beings into the
    conversation.


    To allow for the existence of heterogeneous worlds and equivocal categories, while
    holding onto the possibility of making partial connections between them, the work
    of translation becomes necessary. In other words, equivocation (in the sense of
    misinterpretation, error) calls for translation: it is from politically motivated
    and unfaithful translations that the pluralities of worlds are interconnected
    without becoming commensurate. La Cadena (2015) forcefully exemplifies in her
    ethnographic conversations with a Quechua monolingual Andean father (Nazario)
    and how son translation functions as a way of establishing partial connections
    between her worldview and that of the indigenous Andean with whom she had prolonged
    interaction (I quote at her length):


    > Nazario’s refusal “to explain again” highlighted the inevitable, thick, and
    active mediation of translation in our relationship—and it worked both of course.
    I could not translate, move his ideas to my analytic semantics, and whatever I
    ended up with would, isomorphically, identical to what he had said or what he
    meant, . . Our worlds were not necessarily commensurable, but this did not mean
    we could not communicate. Indeed, as I accepted that I was going to leave something
    behind, as any translation—or even better, that our mutual understanding was also
    going to be full of gaps that would be different for each of us, and would constantly
    show up, interrupting but not preventing our communication. Borrowing a notion
    from Marilyn Sternath, ours “partially connected” conversation . . . While our
    interactions formed an effective circuit, our communication did not depend on
    sharing single, closely identical notions—mine, or of a new one. We shared conversations
    across different epistemic formations; my friends’ explanations extended my understanding,
    and mine ended theirs; but there was a lot that exceeded our grasp—mutually so.
