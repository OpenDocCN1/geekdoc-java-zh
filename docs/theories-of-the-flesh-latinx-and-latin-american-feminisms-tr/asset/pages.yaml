    state. This was the colonizers’ move. They gave dehumanized males, people who,
    were without gender, a position that makes sense only from them—the colonizer’s
    logic. The nation state has reinforced the hierarchy of low-intensity patriarchy
    very significantly, and women, enclosed in the domestic space, have the political
    agency that they have in the mundo aldeea reduced. Men are invading domestic space,
    and women are being subjected to significant violence. The gender system of the
    pueblos survives in the margins. Men get together to discuss and make decisions,
    but they have to consult with women outside of the meeting place, and only after
    consulting with women is the decision made. Women themselves present their opinions
    outside of the meeting place. This way of life is being undermined, colonized,
    by the nation state, as it was by the Portuguese colonizers.


