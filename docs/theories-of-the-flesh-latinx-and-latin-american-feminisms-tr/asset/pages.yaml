    # Latinas/os: On “Not Moving Away From Race”


    In her book Visible Identities, Linda Martin Alcoff offers one of the more recognized
    and compelling discussions available concerning the complications involved with
    contemporary understandings of race (as phenotype) and ethnicity (as culture)
    when applied to Latinos/os in the United States (Lugo-2015). Alcoff notes, “What
    better unites Latinos/os across both and even within our specific national cultures
    is not race or phenotype but . . those features associated with culture” (2006,
    34). Alcoff positions the label in proximity to (and never within) ethnicity,
