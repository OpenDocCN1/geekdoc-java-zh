    # Gender


    As I embark in the task of moving across space and time in a nonlinear understanding
    of space, the concept of gender is problematic for me. I am moving historically
    and spatially with a conviction that my own constitution needs to be questioned,
    in particular my cognitive lenses and my being taught not to incarnate. So in
    moving, I am cautious and mistrustful of what seems right to me as well as of
    my feminist contemporaries have thought and written.'
