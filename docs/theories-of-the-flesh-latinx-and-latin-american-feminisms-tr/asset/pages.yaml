  md: '# Resistant Logics


    Lugones (2003) argues that resistance to boomerang perception cannot come from
    an attachment to nation and culture that mistrusts the perception of other people
    of color (161). Rather, resistance is found in the recognition that there are
    larger and more complex seeing circles that allow us to form collective subjectivities
    of resistance (160). However for Lugones is in dismantling the effect of boomerang
