  md: 'are formed through shared histories and experiences of both oppression and
    resistance. Thus, the kind of border community that Anzalúa says is necessary
    for the work of the border artist—and the border thinker—is constituted by distinct
    histories, power relations, and identity categories at the same time that it is
    both diverse and fluid.


    It is in this productive tension—between the historical and political specificity
    of community on the one hand and diversity and fluidity of community on the other—that
    we should understand the meaning of embodied genealogies as a common practice
    and,


    the significance of understanding Latina feminism in terms of embodied genealogy.
    Indeed, the conception of communal genealogical practice that emerges from my
    reading of Anzalúa and Nietzsche resonates with the community-building practices
    of Latina feminism itself. This volume so vividly illustrates, capturing Latina
    feminist philosophy in its fullest multiplicity demands a recognition of one,
    singular perspective or unified Latina feminist philosophy, but instead a rich
    diversity of Latina feminist philosophical perspectives, a dynamic conversation
    among multiple theoretical traditions. In this sense, though


    term "Latina feminist philosophy" describes a set of discourses and practices
    that are not only incredibly diverse but also in times with one another, this
    term must also be understood to signify a set of perspectives and ways of knowing
    that are rooted in community discussion and dialogue. The work of Latina feminist
    philosophy is then a necessarily complex project, one that involves multiple perspectives
    and ways of knowing that are at the same time rooted in communal practice.


    Thinking about embodied genealogy as a kind of communal practice also prompts
    reflection not only on philosophy as an abstract intellectual practice, but also
    on the challenges presented by philosophy as a discipline, profession, and set
    of institutions. Moreover, understanding Latina feminism as a communal, embodied,
    and genealogical practice of survival highlights the important philosophical work
    of developing community and cohesion among others across disciplinary and cultural
    boundaries. Conceptualizing Latina feminist practice in terms of embodied genealogy,
    then, reveals that the creation of spaces for communal dialogue among Latinas
    and others in the context of the discipline of philosophy and the academy broadly
    is an intrinsically political and philosophical practice—one that demands and
    enacts a transformation of institutions and structures of power and knowledge.
    Ultimately, making space for community, not forsaking it, means upsetting the
    boundaries and borders of disciplines, as well as those between theory and practice
    and between politics and philosophy.'
