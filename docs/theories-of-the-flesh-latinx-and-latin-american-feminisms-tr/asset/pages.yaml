  md: 'hard this path is, I would venture to say, will depend on the intensity of
    oppressions suffered and the resources available to fight them. Anzalúa describes
    her own path to self-overcoming as both terrifying and redemptive. She identifies
    with the headless goddess Coatlic as “a rupture in our everyday world . . . plunging
    us into the underworld” (68) but also as a mental state through which to find
    the inner strength to overcome paralyzing moments of pain that haunt her psyche.
    I will comment on her metaphors shortly.


    Decapitation, which Anález symbolically enacts when she embraces Coatlic, implies
    a break with culturally governed approaches to the world. Since in its predominant
    Western constructs philosophy is the science of concepts per excellence, Anález
    appears to plunge readers across the shore from philosophy (metaphorically speaking).
    Receding into the distance are Western philosophy’s mind-body dualisms and all
    logocentric approaches that generally serve to guide our way in the world, whether
    through the creation of meaning or the practical matter of choosing the means
    to attain various ends. Another way to say this is that she abandons and deauthors
    the West’s sense of reason for the cognitive and ethical lives. Her wisdom is
    anchored in an embodied sense of presence in the world sustained by a dynamic
    interplay of curiosity, problem-solving, and practical intuition strung together
    by a we of indigenous and earth-nurturing cosmic beliefs.


    Her testimony reveals that psychologically dangerous perils it was altogether
    irrational for Anález to embrace the headless goddess in her transition to a deeper
    type of self-knowledge. The socialization process into which she thrust left her
    multifaceted psyche in great disarray. The norms she had internalized from the
    disparate Anglo, Mexican, and indigenous cultures clashed among themselves: “alma
    entre dos mundos, tres, cuatro, / me zumba la cabeza con lo contradictorio” ([1987]
    2007, 99).⁵ The resulting internalized oppressions led to greater intensities
    of guilt and shame in a spiral of “internal strife” and “psychic restlessness”
    (100). A radical break with such oppressive opposition was needed.


    The West offers two culturally sanctioned alternatives to temper reason: art and
    religion. Anález makes use of both although, her journey through these domains
    takes shape by way of ancient Nahua myths as well a queering of Christian/indigenous
    syncretic iconography, so the aesthetic and spiritual connotations of her journey
    and its aftermath conform Western culture with significant differences.


