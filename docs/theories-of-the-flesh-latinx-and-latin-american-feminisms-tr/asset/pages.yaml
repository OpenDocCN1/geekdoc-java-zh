    is not simply a call for economists to serve the poor, but to learn from the poor.
    Max-Neef argued that the poor are the most creative thinkers, having to survive
    every day, establishing innovative forms of cooperation and work-sharing, with
    a mobile flexibility of skills and a high-level knowledge of their local conditions.
    Certainly the poor are strategic thinkers by necessity in order to survive within
    the systems in which they find themselves, but they give evidence of creativity,
    producing new modes of productivity and distribution, from informal insure and
    communal loans to innovative barring. The rising visibility of the new “sharing
    economy” is a testament to the grassroots ingenuity of those with scarce resources.


    My owned family relations, which extend pretty far from sharecroppers in the United
