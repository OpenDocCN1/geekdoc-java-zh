  md: 'In this way, the concept of embodied genealogies I''ve developed through this
    strategic reading of Nietzsche and Anzaldúa adds—and supplements—existing approaches
    to thinking about the significance of Latina feminism. Indeed, as we have seen,
    a conception of embodied genealogies can contribute to conversations about ways
    of knowing and Latina feminisms in a number of important ways. First, conceptualizing
    Latina feminism in terms of embodied genealogies emphasizes how particular histories
    and structures of power make possible and give shape to bodies and the intellectual
    and political traditions they produce. This, an understanding of embodied genealogies
    brings to the few ways of knowing emerge within histories and structures of power
    and oppression, and how these histories have affected different bodies in different
    ways. Second, a conception of Latina feminism of embodied genealogy offers us
    a new way of thinking about the dynamic interrelation between communal practices
    and the production of diverse knowledges about and through diverse bodies. This
    conceptual framework can us us how conversations—and even tensions—Latina feminisms
    not only can be illuminative and productive, but are indeed constitutive of this
    political and intellectual tradition. Third, thinking about the production of
    knowledge in terms of embodied genealogies lays the structures of power and oppression
    that make possible—and, conversely, hinder or foreclose the possibility—of the
    work of Latina feminisms. This project captures some of the many ways that Latina
    feminism theory enacts meaningful practices of survival, critique, and community-building,
    and also sheds light on the oppressive and violent structures of power that make
    this work challenging and sometimes painful.


