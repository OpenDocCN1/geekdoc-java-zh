    in different ways for different people, manifest themselves in the production
    of knowled in different ways. The strength of the genealogical perspective is
    in its acknowledgment and embrace of knowledge as embodied and perspectival. A
    critical strategic reading of Nietzschean genealogy reveals the importance of
