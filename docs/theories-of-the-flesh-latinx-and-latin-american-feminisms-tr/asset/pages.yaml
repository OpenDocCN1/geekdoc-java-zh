    I will argue that rejecting an imperial approach involves something besides “going
    local”: it requires a genuine reorientation of feminist theory toward the quotidian
    or the everyday, a democratic epistemology that takes the oppressed as the ultimate
    makers of their own liberation. Intersectional approaches will necessarily lead
    to pluralistic feminist conclusions; since forms of oppression and identities
    are varied, their solutions must be as well. Further, varied solutions are not
    going to be reducible to a unified criterion of validity, or a litmus test administered
    across contexts. The theorist’s role is to translate and connect, to support and
    augment understanding and collaboration, and to engage in the tradition of militant
    militant research in specific locations.


