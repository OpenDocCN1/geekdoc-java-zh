  md: 'An analogous dilemma is presented in an earlier foundational text by the Martinican
    writer Franz Fanon. Fanon''s 1952 Black Skin, White Masks is an instructive examination
    of the psychopathology of French colonialism as it affected persons (especially
    many) of African descent in the twentieth century (Fanon [1952]). Structured as
    an extended engagement with other thinkers who wrote about the psychology and
    biological nature of Man (so-called universal man) as specifically about persons
    of African descent, Fanon struggles to ground his humanity in something other
    than the logic of European superiority or the internalization of a mythical past¹.
    Despite being deeply concerned about colonized people''s experience of colonization
    by the historical past², Fanon refuses to accept the idea that his future is determined
    by the notion that his possible future is fixed by the blackness of his relation
    to a devastated past. See Anzaldua, Fanon proposes an intentional—even essential—move
    away from the dehumanizing binary logic that has far structured his experience,
    insisting, “The black man is not. No more than the white man. Both have to move
    away from the inhuman voices of their respective ancestors so that a genuine communication
    can be born” (Fanon [1952] 206, 2008). In describing a reactive solution to the
    dilemma Fanon gestures towards the generativity of a knowledge-gathering process
    that is radically open-ended and always embodied. He ends his book with “final
    prayer”: “O my body, always makes me a man who questions!” Urging us, readers,
    to open ourselves to the touch, feel, and consciousness of others as we collectively
    discover and “create the ideal conditions for a human world” (206), Fanon turns
    to prayer rather than rationality, rather than mind, and to questions rather than
    answers as he creates his possible futures. In this, Fanon anticipates the work
    of feminist theorists of the late century and early twenty-first centuries. Consider
    Audrey Lorde''s conception of the erotic as a “resource with which each of us
    lives in a deeply female and spiritual plane, firmly rooted in the power of our
    unrecognized or unrecognized feeling” (1984, 53); Cherrie Moraga turns to the
    bodies of women of color as a source of knowledge in the development of her “theory
    in the flesh” (Moraga 1983; Moraga and Anzaldua 1983);³ Maria Lugones''s


