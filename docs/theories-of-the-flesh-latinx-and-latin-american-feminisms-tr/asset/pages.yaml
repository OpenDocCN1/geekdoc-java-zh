    and critical race theorists, to suggest a new approach to political and ethical
    questions surrounding immigration.


    Theresa Delgadillo is a Professor of Comparative Studies at Ohio State University.
    She is the editor of Latinix Talk, an online forum for critical dialogues in Latinix
    studies and the author of Spiritual Mestizaje: Religion, Gender, Race, and Nation
    in Contemporary Chicana Narrative (Duke University Press, 2011) and Latina Lives
    (University of Illinois Press, 2015) as well as numerous articles and book chapters.
    Her research focuses on three topics: religion and spirituality in Latinix text
    and contexts, Latinix in the Midwest, and AfroLatinidad in literature and film.


    Pedro J. DiPietro is Assistant Professor in the Department of Women’s and Gender
    Studies and a member of the Democratizing Knowledge at Syracuse University. They
    work at the intersection of decolonial feminisms, transgender studies, and women-of-color
    thinking. They are one of the coeditors of Speaking Face to Face: The Visionary
    Philosophy of María Lugones (SUNY, 2019). Prior to joining Syracuse, DiPietro
    was a Mellon Postdoctoral Fellow in the Humanities in the Department of Ethnic
    Studies at the University of California, Berkeley. They are currently at work
    on a manuscript under the title Sideways Selves: The Decolonizing Politics of
    Trans* across the Americas. This book project examines the ways that we do, think,
    and practice translating three collective sites: networks of trans sex workers
    from the Andean region, queer and trans* performers in the San Francisco Bay Area,
    and XicanaLatina feminisms.'
