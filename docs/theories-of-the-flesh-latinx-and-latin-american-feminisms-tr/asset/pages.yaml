    their ontological disagreements. With the reintroduction of earth beings into
    politics, cosmopolitanism,⁴ we can open up spaces for thinking that allows us
    to unlearn/ the ontological violence represented by the nature/culture dualism
    (hence allowing us to “slow down reasoning”), together with its corollaries (e.g.,
    the imposition of linear temporality, colonial rationality, and universal truth).


    It is at this point in the argument—and to make connections with the idea of pluralism—that
    I want to invoke the notion of translation as equivocation, derived from Amerindian
    perspectivism and theoretically articulated by the Brazilian anthropologist Eduardo
    Viveiros de Castro (2004). In indigenous perspectivism, translation is a process
    of controlled equivocation, understood as “the mode of communication per excellence
    between different perspectival positions”⁵ cosmology posits that humans and nonhumans
    possess the same souls and cognitive capacities; they share the same conceptual
    values, that is, they see the same things. However, what changes from one species
    to the other is the conceptual referent. Jaguars see as “maniac brew,” for humans
    it is blood, that is, different referents (maniac brew, blood). This difference
    of perspective, Viveiros de Castro (2004) argues, derives not from their souls,
    but from the bodily differences between species/entities, constituting “uring
    their ontological differentiation and referential disjunction” (4)—one soul (perspective)
    and multiple natures. Moreover,


    The problem for indigenous perspectivism is not therefore one of covering the
    common referent (say, the planet Venus) to two different


    > ² According Stengers (2005), “to slow down reasoning” refers to the generation
    (what we might say, endangering?) of a new space for reflection by decelerating
    thinking, thus the possibility of a new awareness of the problems and situations
    that mobilize us.


    > ³ pluriverse, as opposed to a universe, refers to worlds constituted by the
    entanglement of various cosmologies. The universe is made up of only one cosmology—Western
    cosmology. As Mignolo argues, “The universalization of indigenous in the West
    was part of imperial project...[The world in which many worlds coexist”] (2013,
    217).


    > ⁴ earthly, in the politics of Western science, refers to beings or “natural
    resources” (matter) that exist separately from the human sphere. In indigenous
    cosmology, the term refers to those other beings living in nature and who have
    always interacted with humans, that are a constitutive part of the latter. For
    de la Cadena (2015), an earth being is any entity (such as the mountain Ausangu)
