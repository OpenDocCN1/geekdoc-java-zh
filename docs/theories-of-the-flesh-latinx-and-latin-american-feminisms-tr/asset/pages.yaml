  md: '# Introduction


    ANDREA J. PITTS AND JOSÉ MEDINA


    THIS VOLUME IS a collection of writings forged out of decades and generations
    of work dedicated to critical engagement with the lives of Latinx and Latin American
    peoples.¹ The authors we have included in this volume are philosophers, literary
    theorists, cultural critics, artists, and activists. Their contributions draw
    their strength from methods and innovations attuned to lived experience.


    Historically, as Laura E. Pérez outlines in her essay in this collection, the
    academic field of Latinx feminism in the United States developed alongside the
    work of black, indigenous, and Asian American feminisms throughout the 1970s and
    1980s. The work of a number of early theorists is highlighted throughout this
    volume, including that of Gloria E. Anzalúa, Cherokee Moraga, and María Lugones.
    Often through the development of writing groups, ethnic studies, and women’s studies
    programs, and publishing houses, figures like Barbara Smith, Andre Lord, Moraga,
    and Hanna Gottsett among the first to form a generation of printed materials for
    women-of-color feminists in both Latinx feminism and black feminism (De Veaux
    2004). Many of the writers during this formative perioded conceptual, affective,
    and institutional resources within academia that continue to shape scholarly production
    in Latinx feminist projects today. Throughout the 1980s, 1990s, and 2000s, new
    articles, books, and events focusing on Latinx feminism continued to circulate.
    For example, scholarly collectives such


