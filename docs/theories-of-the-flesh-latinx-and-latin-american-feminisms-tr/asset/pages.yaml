  md: '# PREFACE


    MARIANA ORTEGA


    Words are blades of grass pushing past the obstacles, sprouting on the page; the
    spirit of words moving in the body is as concrete as flesh and as palpable; the
    hunger to create is as substantial as fingers and hand.


    > GLORIA ANZALDUA (1987, 71)


    The decolonial imaginary is intangible to many because it acts much like a shadow
    in the dark. It survives as a faint outline against a wall or an object. The shadow
    is the figure between the subject and the object on which it is cast, moving and
    breathing through an in-between space.


    > EMMA PÉREZ (1999, 6)


    Flesh, spirit, longing, wisdom, and desire intermix in the pages that follow.
    Latina/x and Latin American thinkers share their words, words that traveled like
    shadows in the dark, not always seen, not recognized appropriately in various
    US academic circles, in the hallways of philosophy departments, in the works of
    those who claim to have knowledge. Like the decolonial imaginary that Emma Pérez
    recognizes in its invisibility and as breathing through an in-between space of
    possibilities, these words indeed sprout in the page and in the flesh. These words
    have spirit, Anzaldúa says, spirit to move our bodies, spirit-through-and-with-flesh
    that leads us to create so as to survive—and to thrive.'
  merge: -1
  pgno: 4
- img_proc: true
  md: 'Sometimes these words have been given space, but only tokens. Indeed, they
    have been like faint outlines gliding against the walls of philosophy. But as
    faint as they have been, they have also been powerful. They are “theories in the
    flesh” informed “by the physical realities of our lives, our skin color, the land
    or concrete we grow up on, our sexual longings” (Moraga and Andalúa 1983, 23)—reveal
    a strong spirit. They constitute institutional analyses of lives that, like shadow
    worlds, occupy between spaces. They inform new generations of Latina, Latinx,
    and Latin American writers with hunger to create.


    Hidden by familiar operations of gatekeeping and the coloniality of knowledge,
    these words of spirit and lived experience are slowly entering the halls of academic
    philosophy. You see, in loneliness one looks for company. In meetings of the Latina/x
    Feminisms Roundtable (formerly the Roundtable on Latina Feminism) (2006 to present),
    activists, philosophers, and thinkers from other disciplines have shared their
    knowledge and love of Latina/x and Latin feminisms. A new generation of Latinx
    philosophers have found words by philosophers such as Maria Lugones, Linda Martín
    Alcoff, and Ofelia Schutte; by foundational Chicana theorists such as Norma Alarcón,
    Gloria Andalúa, Cherrie Moraga, Emma Pérez, and Chile Sandoval; and by key American
    feminists such as Luisa Capetillo, Rosario Castellanos, Juan Inés de la Cruz,
    Graciela Hierro, and Julieta Kirkwood.


    In the hands of the authors, words are transformed and transforming. They help
    theorists, philosophers, lovers of words, think wreck the decolonial in its possibility
    to forge everyday forms of resistance attuned to material, historical, and cultural
    difference and to rethink feminist and gender methodology. They also help construct
    feminist selves who tell their stories in order to heal, to share their shame,
    fear, and vulnerability but also to disclose new desires and aesthetic longings—and
    to image new philosophical worlds and futures.


    # References


    Andalúa, Gloria. 1987. Borderlands/La Frontera: The New Mestiza. San Francisco:
    Aunt Luxe Books.


    Moraga, Cherrie, and Gloria Andalúa, eds. 1983. This Bridge Called My Back: Writings
    by Radical Women of Color. 2nd ed. New York: Kitchen Table, Women of Color Press.


    Pérez, Emma. 1999. The Decolonial Imaginary: Writing Chicanas into History. Bloomington:
    Indiana University Press.'
