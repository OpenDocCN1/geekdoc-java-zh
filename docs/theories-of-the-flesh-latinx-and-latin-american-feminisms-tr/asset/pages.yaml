  md: 'Recognizing this entry of traditionally sacred musics and themes into new spheres
    is an exhilarating moment for Moreno Vega, who describes hearing


    the music of Machito. It filled the room, and my limbs. “Zarabanda Changó ta veni,
    Zarabanda Changó ta veni...” [sic] My body melted with the music as I practiced
    the steps my brother had taught. An image came to me of Abuela dancing; with the
    intricate mambo steps I was practicing, inspiring my movements. I played the record
    again and again kept dancing until I felt the movement of my body become one with
    the music. (2004, 128)


    Moreno Vega recognizes the song’s Orisha references and rhythms, underscoring
    how forms of dance and music influenced the new “mambo” sound and movement by
    connecting it to the sight of her abuela in sacred dance. While a number of cultural
    and music critics have also written about the important sonic fusions of this
    period, providing invaluable insight into African American and Latino/o musical
    networks, innovations in form, transnational musical movements, and the emergence
    of Latino/o musical genres, Moreno Vega’s memoir provides an insider narrative
    of what it felt to be among this new music for the first time, and her narrative
    innovatively emphasizes the fusion of sacred and secular in the sonic realm by
    highlighting the interrelationship between worldview, body in motion, and sound—or
    Orisha worship, dance, and music, as it also examines these figure in the generational
    and gender differences within her family.


    Moreno Vega’s narrative natively portrays the silencing of Orisha traditions in
    her family (Heredia 2009, 68), but the contrast that the text creates between
    Orisha practices and Catholicism is primarily a contrast between distinct gender
    and racial norms, offering readers a woman-of- feminist take on Orisha worship.
    The alternative gender norms of practices forged in diaspora become evident in
    this text through Cotito’s observation of Abuela’s healing practice, her engagement
    with Abuela’s power and leadership as a musical and spiritual healer, and her
    assessment of Abuela’s response to the “crisis” of her sister.


    The text suggests, then, that there is a different and more feminist perspective
    on the female body and gender roles in operation in Orisha practices, one that
    unfolds through Cotito with distinctive spiritual approaches to the body / physical
    self that have broader cultural influence in the realms of the social, sonic,
    and performative. This


