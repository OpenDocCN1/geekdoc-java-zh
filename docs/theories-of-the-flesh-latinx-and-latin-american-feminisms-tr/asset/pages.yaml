    dismantling the pernicious legacies of European colonialism—“types” of human beings.
    Scholars, thinkers, and artists who have taken the “colonial turn” from several
    disciplines (religious studies, philosophy, political theory, literary studies,
    psychology, and ethnic studies) and a number of geographical spaces where indigenous
    peoples have suffered the experience of colonization (the Caribbean, the Americas,
    and Africa, among others). Although the varied projects of decolonial artists
    and scholars differ according to the contexts within they work, they are united
    in their response to European colonialism. Their shared goal is not merely to
    overturn the colonial structures that resulted in the loss of political autonomy
    for native inhabitants of a colonized region, but fundamentally to overturn the
    matrix of being, power, and knowledge that is constitutive of Western modernity
    and its corresponding project of civilization.⁷ In choosing to describe my project
    as decolonial, I mean to invoke the growing body of scholarship emerging from
    a group of Latin American and Latina/o scholars who self-identify as such and
    who distinguish their approaches from postmodern and postcolonial approaches.⁶
