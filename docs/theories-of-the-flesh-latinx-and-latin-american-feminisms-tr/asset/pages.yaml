  md: 'theor and philosophers. In his current project, he aims to examine the ways
    that art and other seemingly “secondary” modes of expression are given primacy
    and significance in the work of African American, Latina, and Chicana feminist
    political theorists and commentators.


    Natalie Cisneros is Assistant Professor of Philosophy at Seattle University. Her
    recent work appears in Hypatia: A Journal of Feminist Philosophy, Carceral Notebooks,
    Radical Philosophy Review, Active Intolerance: Michel Foucault, The Prison Information
