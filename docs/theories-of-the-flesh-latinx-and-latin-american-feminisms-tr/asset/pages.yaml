  md: '# CHAPTER 9 | African, Latina, Feminist, and Decolonial


    Marta Moreno Vega’s Remembrance of Life in El Barrio in the 1950s


    THERESA DELGADIDIO


    MARTA MORENO VEGA’s (2004) memoir of her childhood and young adult-hood, When
    the Spirits Dance Mambo, offers readers an account of Puerto Rican life in New
    York’s El Barrio that signifies on both past and present for contemporary readers.¹
    In contrast to an autobiography, historioria, or testimonio, memoirs offer us
    not the whole picture but just a tiny slice of it, focused examination of a particular
    moment or period in the life of the narrator. By their very nature, memoirs convey
    the uniqueness or significance of a compressed time period, yet because they are
    composed after the events themselves they may represent a belated consciousness
    of that significance, or perhaps an opportunity to share with a wider contemporary
    audience, respectively, the significance of events understood by only a few in
    their original time frame. Moreno Vega’s memoir conveys the latter—a sense of
    the enduring importance of her experience as a child and young woman at her grandmother’s
    knee and altar. As Moreno Vega tells it, lies in the strong bond between the two
    as Abuela teaches Vega, known by her childhood name of “Cotito” in the narrative,
    about Espiritismo and its value in everyday life. A Puerto Rican black woman,
    Moreno Vega remembers every spiritual training as integrating interconnected with
    her family’s negotiations with racialization in the United States, here growing
    questions about normative gender and sexual


    > ¹ To name is to revise, and to revise is to Signify (Moreno Vega 2004), this
    essay draws from the theory of centrality of oral/speech in African American literary
    traditions to consider both speech and the sonic in Moreno Vega (Gates 1988).


    Theresa Deladilla, African, Latin, and Decolonial In: Theories of the Flesh, Edited
    by: Andrea J. Pitts, Mariana Ortiz, and José Medina, Oxford University Press (2020).
    ² Oxford University Press. DOI: 10.1093/oso/9780199006295.003.0010'
