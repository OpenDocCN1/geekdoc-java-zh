  md: 'by creating and guarding ones seeing circle. But as Lugones notes, there is
    trouble in the oscillation between these logics because outside of one''s seeing
    circle are still constructed through the white gaze (160). In the process, the
    real/fake dichotomy emerges and shapes relations of self to others as a method
    to guard homeplaces.


    Lugones''s analysis has two implications. On the one hand, people of color are
    constructed in the image of white people. Their senses of history, relatedness,
    and belonging are contingent on white history and identity with no reciprocity.
    On the other hand, people of color may be constructed as monstrously different
    as imitative copies of white identity (Lugones 2003, 158). Regardless of the construction
    of self, the internalization of boomerang perception entails damaged horizontal
    relationships between we come to see each other and ourselves through a white
    perceptual schema. In response we construct homeplaces or seeing circles that
    are vigilantly guarded through ethnic/racial legitimacy


    A key feature of Lugones''s analysis of boomerang perception is its quotidian
    entrenchment as it comes to shape the most intimate practices of the everyday
    lives of people of color. It participates in what Sharon Holland (2012) has termed
    the quintessential life of racism. Boomerang perception is not aberrational and
    comes to inform intersubjective experiences. It shapes how we understand our relative
    histories. The world is one that requires a history: a narrative of the past that
    explains our descent (Holland 2012, 20). One must have a history to be connected
    to other people, and this fact racializes history, while simultaneously placing
    deep importance on relatedness in the narratives we construct about ourselves,
    and others (21). The fact that we are racialized implies that we belong or are
    related to a certain social group. While clearly placing a deep importance on
    the problematic biological discourses that often conge our senses of racial belonging,
    this belonging and relatedness to each other. Boomerang perception negatively
    impacts these types of social relationships. In follows I explore the impact of
    boomerang perception with respect to Latinas in the United States, treating carefully
    to ensure a focus on intra-Latina relationships and not the white-other binary.


    # Latinas in a Commercialized Context: The Real/Fake Dichotomy


    The contemporary situation of Latinas is socially and politically complex. The
    world is permeated with and constructed through perceptions'
