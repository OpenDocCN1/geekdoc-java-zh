    # Women’s Movements / Women on the Move


    In recent decades, certain claims have developed that link social unrest to an
    “unusual multiplicity” called “new social movements” (de Miguel 2004, 12). Among
    these movements “women’s movements” stand out: they are not homogeneous and they
    coalesce around identities built on the basis of concrete, circumstantial claims,
    limited to certain and clearly identified rights. They are highly dynamic and
    involve the restructuring of social and political organizations and practices
    implicit in the liberal state. That is, civil society, in its social dynamic dependent
    upon rights claims, expresses itself outside the political parties and usual usual
    structures. In general, women’s movements claim their rights, protest against
    sex-gender violence and femicide, reclaim women of indigenous peoples, demand
    acknowledgment of sexual diversities, and so on, are ambivalent and even contradictory
    (Femenías 2013, 23–24).


    However, if understood as collective action and experimentation in citizenship
    assertion, women’s movements are answering to a social dynamics ruled by urgency
    and intensity of demands. For some women theorists, these movements show the unequal
    distribution of authority among people and groups; for others, they obey a structural
    insufficiency in the distribution of the value of acknowledgment. Be that is,
    women’s movements overflow the traditional claims of representation and, indirectly,
    denounce the deep erosion of representative institutions in place (Ferrajjoli
    2011, ix). Therefore, as an antidote, they use the social guarantee of civil surveillance,
    which is an effective use of public space based in democratic movements (Ferrajoli
    2011, viii). They jointly claim the intention of boosting their counterhegemonic
    voices and widening the democratic political horizon absent of tensions. From
    a theoretical viewpoint, they move away from the risks of essentializing


