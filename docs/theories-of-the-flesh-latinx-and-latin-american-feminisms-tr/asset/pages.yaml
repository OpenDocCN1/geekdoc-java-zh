  md: 'The internalization of boomerang perception, or the seeing of other people
    of color through white eyes, impacts horizontal relationships, that is, the relationships
    between and among people of color. Lugones (2003, 156) insists on a horizontal
    focus because attention to the oppressor’s construction of the subjectivities
    of people of color (hierarchical focus) can become paralytic. The audience target
    of the essay is pointedly reflected in her opening dedicatory paragraph, in which
    she writes to “people of color; for women first and mainly, but also for men:
    green-eyed Blacks, never-been-taught-my culture Asian Americans and U.S. Latinos,
    emigres, immigrants and migrants mixed-bloods and mixed cultures, solid core,
    community breed, folks of color” (151).


    Central to Lugones’s analysis of boomerang perception is not just the perceptual
    process itself, but its intimate relationship to constructions of relatedness
    and belonging as these emerge through racialized subjective encounters. How I
    come to see myself as belonging to a community is to tell a racialized narrative
    of my encounters with others. However, racialized encounters are constructed in
    and through our racial environments from which none of us are immune. As a result,
    the formation of belonging is impacted by boomerang perception, which materializes
    in the form of legitimacy tests. To effect this she writes: “Thus, we administer
    legitimacy tests with white eyes, and what moves us to administer the same logic
    that invokes the distinction between original/real and the image/fake” (Lugones
    2003, 162). Boomerang perception seeps into our quotidian encounters that construct
    our sense of home, heritage, and descent wherever the impact of seeing with white
    eyes is harmful to


    Following our focus on the impact of boomerang perception on horizontal relationships,
    Lugones takes concern with the development of workplace as a method of resistance.
    Building workplace provides refuge and survival because it forgets the possibilities
    of an alternative vision and history of oneself that is independent of the oppressors’
    gaze (Lugones 2003, 159). However, the formation of belonging or the production
    of a seeing circle, as Lugones refers to, can come to reinscribe the distortions
    of boomerang perception, detrimentally impacting horizontal relationships. The
    impact is most notably felt through fear, the intention of which is the possible
    loss of ones that may become what one is in the racists perspective. In her words:
    “One fears that what is in the perceiver’s eye, and nothing else, all other subjectivity
    erased. And as I have argued, that to become something substantial, dependent,
    a distorted image of white humanity. One guards the seeing circle zealously” (160).
    Fear entrenched in the loss of subjectivity generates two decisive logics. On
    the one hand, one can be seen through the pangs of boomerang perception. On the
    other hand, one can resist the boomerang construction'
