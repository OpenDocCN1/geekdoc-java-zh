    some Chicanas from the San Francisco area because her vocabulary and usage deemed
    inferior. In the preface to the first edition she refers to the Chicano Spanish
    she uses as an “infant… bastard language… not approved by any society” for which
    there is no longer a need to apologize ([1987] 2007, [18]).


    These forms of discrimination hurt her because the failure to display both a acceptable
    linguistic competence and a socially acceptable gender identification risks for
    the very matrix of socially recognized personhood. These features mark the basis
    on which many superficial interpretations of human dignity exist as well as entitlement
    to social recognition and respect are formed. Failure to comply with linguistic
    and gender norms thus constitutes a double jeopardy, the psychological and emotional
    effects of which can be paralyzing even talented adults. This is especially the
    case when their effects are imprinted in the psyche in early childhood, when children
    are most vulnerable to others’. Alzánda reminds her readers. She speaks of young
    girls being subjected to emotions of fear and shame if their behavior does not
    conform with the traditional normative expectations of their families and community.
    By the worried look on my parents’ faces I learned that something was wrong with
