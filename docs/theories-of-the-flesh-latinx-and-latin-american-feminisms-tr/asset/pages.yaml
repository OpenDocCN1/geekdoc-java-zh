  md: '# Conclusion: A Note on Melancholic Longing


    I wish to conclude with a note on melancholic longing that, as Muñoz would say,
    “riddled with queer possibilities” (1999, 63) and suffused with ambivalence, with
    the queer disidentific pleasures learned from both Serrato’s and Gonzales-Day’s
    photographs that prompted Deicher’s analysis of the photograph of the two seated
    men. For Muñoz, disidentification is, like melancholia, an ambivalent structure
    of feeling that retains the problematic object and taps into the energy that is
    generated by the contradictions and ambiances that arise at the loss of an object
    (71).24 As he states,


    I am proposing melancholia, for blacks, peers, or any peers of color, is not a
    pathology but an integral part of our process of dealing with all the catastrophes
    that occur in the lives of people of color, lesbians, and gay men. It is this
    melancholia that is part of our... I have proposed a different understanding of
    melancholia that does not see it as a pathology or as a self-absorbed mood as
    a mechanism that helps us (reconstruct identity and take our dead with us to the
    various battles we waged in our names—and in our names). (74)


    My longing is that melancholic in Muñoz’s account as it connected to loss, to
    the loss of so many LGBTQ bodies and the loss of something, like Deicher, I do
    not know if it ever existed—visual testament to my existence and to the existence
    of those like me.


    For Muñoz, melancholia is a mourning that takes a different turn—it is one in
    which one mourns for oneself, one’s community, “for one’s history” (Muñoz 1999,
    73). Such mourning does not end, as if it were directed in a linear manner, with
    a final letting go of the lost object. Muñoz says, “Whereas lives are either/or/black
    and queer remain on the line, there is no ‘normal’ teleological end in sight for
    ‘mourning’” (74); mourning becomes affirming or a resistant melancholia as it
    allows for a (re)construction of identities that were not meant to be. For me,
    melancholic longing is one that opens possibilities of new worlds of visibility
    after so much loss of LGBTQ lives, a sense of loss that moves us to long for a
    past *and* a present, and to attend to make new worlds, worlds in which there
    will still be loss and shame and in which we will carry our dead with but in which
    we can also *be* who we want to be—worlds


    > 24 Muñoz disagrees with the Freudian view that melancholy, which amounts to
    a mourning that cannot let go of the lost object, is pathological. For an important
    analysis of melancholia and race see Cheng 2001.'
