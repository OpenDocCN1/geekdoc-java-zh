  md: 'reason cannot be trusted to settle the differences between the clashing parties
    or it is impotent to do so. Nor is she satisfied with taking the easy way out,
    adapting to whatever behavior is most expedient. Instead, she pays attention not
    only to external differences—the differences between Chicana roots, for example,
    the aspects of Anglo culture that oppress them, out there in society, let''s say
    in the so-called public sector. Just as much, if not more, Alzalda attends to
    the internal differences within, how they are conditioned by these external factors,
    and how the social factors touch, move, and shape her body in such a way that
    her body, consciousness, and expectations are inscribed by the values and expectations
    they convey. The paradigm of new mestiza that emerges from this process is born
    out of an affirmation of her embodied radical subjectivity, that works by awakening
    “dormant areas of consciousness” rather than following society’s comforts to “rejoin
    the flock, to go with the herd” ([1987] 2007, 19).


    This means that an understanding of her work remains incomplete without attending
    to the spiritual and existential resolutions she seeks in a synthesis of healing.
    Specifically, there is a yearning to heal from a state of fragmentation caused
    by multiple forms of oppression and grades of sedimented emotional abuse—much
    of it including epistemic violence, but not limited to this. It is the type of
    abuse that penetrates deeply into a person’s moral identity, distorting and incapacitating
    the heart of a person’s psyche deviously entangled elements of fear, guilt, and
    shame. These are learned cultural constructions acquired in dysfunctional and
    oppressive conditions and settings, not excluding some family and community settings,
    and they can only be reversed by a counterfactual effort with regard to the specific
    constraints that the oppressive patterns have generated. One of the principal
    patterns to be overcome is the abusive incubation of shame.


    Nietzsche and Alzaldúa, in their respective ways, address the liberation from
    shame. In section 270 of The Gay Science Nietzsche writes: “What does your conscience
    say?—You shall become the person you are” (1974, 219). This is followed by five
    aphorisms, of which I cite the last three:


    > Whom do you call bad?—Those who always want to put to shame. (§ 273)


    Alzalda notes that by “synthesis” she does not mean a collection of separate parts
    or a balancing of opposites. Rather, she means a “third element,” one “greater
    than the sum of its severed parts.”This is a mestiza pluralist consciousness whose
    creative energy is constantly breaking down “unitary” conceptions as well as the
    subject-object divide and other dualities that bind the psyche ([1987] 2007, 101–2).'
