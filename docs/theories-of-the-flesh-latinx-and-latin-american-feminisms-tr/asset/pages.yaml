    At the end of Their Dogs, Viramontes ties up many, but not all, of the subplots
    that run through the novel. In a confluence of events that occur during a torrential
    morning rainstorm, the storylines of the novel’s four major characters converge—even
    though the characters themselves do not emerge. Emma is on her way to the station
    to warn Nacho that she has been targeted for killing by the McBride Boys gang.
    Turtle, high on drugs, is directed by the gang to murder Nacho, and is murdered
