  md: 'the coloniality of gender in action demands that we first historicize “gender”
    from within local histories and bodies. This theoretical shift can keep us from
    reducing gender to a descriptive biology (i.e., the sexual difference) that obscures
    the violence of the colonial project and the ways in which those legacies continue
    to bind.


    Historicizing gender can also open us up to identifying and recognizing coexisting
    and coevolving arrangements of bodies and power that are simultaneously operative
    in “postcolonial” spaces. For example, in her book The Invention of Women: Making
    and African Sense of Western Gender Discourse (1997), Oyérnkó Ówými argues that
    seniority played a significant role in the (re)anging of bodies and power from
    within a Yoruba cosmoseness in Nigeria. Seniority is a coexisting and simultaneously
    operative arrangement of the social becomes to contemplate, let alone recognize,
    under a concept of gender that foregrounds secular difference. Historicizing gender
    can help us identify and mobilize to greater some effect of the more egalitarian
    social arrangements that have historically existed and continue to exist within
    the cosmenses and cosmologies of those relegated to the right side.


    Second, as demonstrated through the wages of gender, I propose a practice of mapping
    out relational power dynamics. Mapping relational power dynamics can trouble facile
    accounts of power organized around reductive understandings of sexual difference.
    In doing so, we are able to acknowledge and denounce the oppressive relationship
    between white bourgeois heterosexual “Men” had and continue to have in relation
    to white bourgeois heterosexual “Women,” while also exploring how oppressive modes
    of relating were undergirded by the material conditions of those enslaved and
    colonized. This methodological shifts our goal of undoing “Patriarchy,” by calling
    us to attend to all of the bodies that were sacrificed in order to make the oppressive
    set of relations on the left side seem relatively more attractive and even “liberatory”
    by comparison.


    One critical result of this decolonial feminist movida is that we can use these
    relational mappings to get beyond the Oppression Olympics¹⁶ that continue to undermine
    our efforts to build complex coalitions across our differences. By mapping out
    the relational power dynamics we are able to see that white bourgeois heterosexual
    women’s complicity and participation in opposing those on the dark side is what
    partially sustains the oppressive relationship between those on the light side.
    What I am


    > Oppression Olympics refers to the practice of determining who is the “most oppressed”
    by creating hierarchies of disadvantages between and among differently marginalized
    communities, making it difficult to collectively organize. My approach explores
    some of the complicated ways in which we are simultaneously oppressed and oppressing.
    See Martinez 1993.


