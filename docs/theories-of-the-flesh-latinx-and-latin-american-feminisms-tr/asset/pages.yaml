  md: 'The universalist theories of gender and gender resistance emerging today need
    decolonial work. The intersectional nature of identities, and the need for a decolonial
    hermeneutics of suspicion towards reductive or abstracted approaches, challenges
    universally imposed agendas of all sorts. All social identities may operate in
    the same way to curtail multiplicity or legitimate domination. If gender cannot
    stand alone because its form is always the product of diverse, mediated processes,
    then we should reconsider whether we can theorize a universal response to gender,
    or a resistance to gender, or a solution to gender, while ignoring the hybrid
    nature of gender.


    In my view, the decolonial approach to feminist theory needs to address three
    projects. (1) The first is a task of critique: What of our concepts and categories
    carry an implicit legacy of their colonial genealogy? (2) The second task involves
    developing tools for cross-cultural communication. How do we engage in dialogic
    encounters under the backdrop of colonialism? How do we “speak” with under conditions
    of inequality and legitimate mistrust? (3) The third task involves methods for
    conducting local analyses within a global frame, so that we can contextualize
    local conditions within a relational, transnational framework that is capable
    of capturing both local and global causality. I will return to these three tasks
    in the conclusion to show how the notion of gender figures in each of these tasks.


    # Latina Feminism and the Decolonial Turn


    The project of decolonizing feminist theory has mostly been happening, unsurprisingly,
    from theorists coming from the global South, and Latina feminists have played
    a crucial role. Latina theorists in the United States generally, as Saldivar-Hull
    remarks, the doubled focus on the domestic and the international. This follows
    necessarily from the conditions of the many Latinos who come here from elsewhere
    and remain connected to what they left behind familial, affective, legal, and
    material bonds. Questions of citizenship, concerns over loyalty, and levels of
    political participation play out very differently for whose home countries are
    across the ocean rather than right next door. Latino/a theory is, then, of necessity
    cognizant the need for a transnational analysis even seeking to understand quite
    local issues.


    Maria Lugones, Ofelia Schutte, and Ad-Maria Isasi-Diaz are among those who have
    initiated the decolonial project within feminism. Schutte’s (2000) work on Latin
    American feminism, cultural alienation, and the requirements of cross-cultural
    communication has broadened our conceptual repertoire and developed a way to think
