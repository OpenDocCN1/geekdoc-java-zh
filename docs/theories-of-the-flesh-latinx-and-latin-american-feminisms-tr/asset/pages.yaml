  md: 'The notion of cultural translation (drawing on debates on ethnographic theory
    and practice) is premised upon the view that any process of description, interpretation,
    and dissemination of ideas and worldviews is always caught up in relations of
    power and asymmetries between languages, regions, and peoples. In the context
    of an endless transnational of theories and concepts, exacerbated by a continuous
    remapping of borders, the issue of translation has become a pressing concern,
    constituting on one side, a single space for the analysis of the intersection
    (or transcultural) between the local and the global, and on the other, a privileged
    perspective for the examination of representation, power, and the asymmetries
    between languages. In postcolonial critique, the logic of cultural translation
    refers to the process of shifting the notion of difference from its common understanding
    (as “in difference from”) to the Derridean concept of *différance* that, according
    to Hall (1996) points to “a process is never complete, but remains in its undecidability”
    (247). Viewed as *différance*, translation is always deployed whenever the self
    encounters the radical, unassimilable difference of the other. In the words of
    Vern (2006),


    Translations across heterolingual and culturally heterogeneous and polyglot borders
    allow for fellows, the camouflages, the displacements, ambivalences, mimicries,
    the appropriations, that is to say, the complex stratifications of deidentification
    that leave the subaltern and the subjugated with the space for resistance.(115)


    To translate means to be inworld”-traveling (Lugones 1987), to live in the contact
    zone (Pratt 1992) or in the border (Anzaldúa 1987), which constitute geopolitical
    spaces from which the subaltern engages with against colonial/hegemonic translations.
    In what follows I will advance a more radical, decolonial notion of translation
    based on the ontological path, and which, in suspending the Western cogito, highlights
    the coloniality of power and (of gender) underining any encounter with difference.
    Instead of searching for a common ground, ontological translation emphasizes equivocations
    that stem from our realities.


    Deploying both the theory of translation and the notion of equivocation—the latter
    borrowed from Amerindian perspectivism (to be elaborated below)—will decolonial
    turn in Latin America, as a starting point the debates on the coloniality of power
    (Quijano 2000) and the coloniality of gender (Lugones 2007). Decolonial feminisms,
    articulated by subaltern/racialized subjects, usually operate within an epistemological
    referent that differs have historically structured the relations between center
    and periphery. An effect of transculturation and diasporic movements, these feminisms
    tend to be located at the interstices of dominant representations, and their'
