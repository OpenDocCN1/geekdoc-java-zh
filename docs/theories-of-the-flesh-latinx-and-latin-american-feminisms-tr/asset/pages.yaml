    cannot avoid the recognition of the centrality of sexuality and pleasure in analyzing
    the relationship between power and knowledge, and reflection on the possibility
    of ethics of pleasure that is not a sexualized ethics. Implicitly, Hierro critiques
    gender as a conceptual instrument for the moral autonomy of women, as gender is
    only what is thought about women and men and not a medium for uncovering and expressing
    the ways of life of women subjects.


    The ethics of pleasure transforms into an ethics for the practice of sexual difference,
    devised from various disciplines, which allows *las mujeres* to be independent
