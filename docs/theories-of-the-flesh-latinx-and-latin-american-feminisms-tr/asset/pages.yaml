  md: 'is not a text, in other words, that asserts a black Puerto Rican identity and
    a critique of gender roles that embraces an African and Puerto Rican identity
    that itself represents a challenge to Western/Christian dominant gender roles
    normalized through prevailing religities. When the Spirits Dance Mambo, therefore,
    hails both the ongoing cultural change among Puerto Rican African diaspora subjects
    and a feminist awareness embodied in this depiction of Orisha worship.


    In his discussion of the ways that the question of gender has influenced scholarship
    on another diaspora religion, Candamblé, and by extension multiple forms of Yoruba-inspired
    rituals and worldviews in our sphere, J. Roland Matory (2005) critically questions
    claims of traditional matriarchy or gender equity in Yoruba cultures and their
    dias own counterparts. Matory''s analysis reveals how transnational and national
    ideologies, and international dialogues, influenced not only the production of
    scholarship but also the practice of Orisha worship in the diaspora. While Matory
    makes a compelling case that we cannot assume that all Orisha worship, and the
    traditions from which these derive, are inherently more genderitable, his research
    illuminates the open acceptance of particular forms of what we might term gender
    fluidity (though he refers to this as metaphor or loophole) among priests of the
    West African Oyó-Yorubá and among priests and priestesses of Candamblé Matory
    (2005, 24–28). His research also demonstrates that at mid-twentieth century, a
    particular discourse about the matriarchy of Candamblé emerged that contributed
    to the marginalization of a “cultural person who is in the Candamblé priesthood
    as is anathema to the normative vision of the nation state—the adé, or “passive
    sexual” (15). While earlier discourse gave way to what Matory views as scholarship
    influenced by nostalgia for a genderless pre-Western tradition, the impact these
    scholarly debates have had on actual Candamblé communities has not been benign.
    Matory believes that adés have been marginalized, but another result is that “women,
    in fact, now become the majority of the chief priests in this religion” (21).
    Since the key work that Matory takes up as initiating the discourse on gender
    in relation to Candamblé appears at mid-twentieth century—the temporal setting
    of Moreno Vega’s narrative—and, as he notes, has enduring influence in multiple
    ways going forward, it might be accurate to view Moreno Vega’s narrative as evidence
    of that—of the ways that discourses about gender in Orisha traditions circulated
