    acknowledging and naming difference as to one''s historical lineage and formation.
    Overall, then, identity for Latinas is the product of a struggle for self-definition
    within a context that poses a complex set of particular challenges, from invisibility,
    to heterogeneity, to misrepresentations, to the need for an adaptive fluidity.
    It is the end point of communal and individual work.


    Throughout her writings, Isasi-Díaz called out the dangers of romanticizing and
    idealizing mestizage as well as the condition of the poor. She was quite aware
    that a valorization of lo cotidiano, including the inclusion of theoretical resources
    inherent in the condition of everyday struggles of survival, could lead to romanticizing.
    And she constantly called herself out as a “middle class” woman, even though she
    described herself as being to two paychecks away from being able to pay her bills.
    But despite her awareness of the dangers, Isasi-Díaz continued to insist on a
    democratic epistemology, claiming that "there is no such as academic mujista theology
    on one hand and grassroots mujista theology on the other" (1993, 177). The praxis
    of theory as she envisioned it, and practiced it, was one where each person makes
    a contribution according to their gifts, with none more important than others.


    Mujista theology effects a relocation of the space of the sacred in the midst
