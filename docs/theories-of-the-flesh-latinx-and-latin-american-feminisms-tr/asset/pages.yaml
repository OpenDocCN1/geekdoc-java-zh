  md: '# CHAPTER 14 | Stylized Resistance


    # Boomerang Perception and Latinas in the Twenty-First Century


    STEPHANIE RIVERA BERUZ


    RACISM REMAINS A CONSTANT reality in the lives of women of color in the United
    States, a reality that manifests itself in varying capacities. María Lugones explores
    these experiences in her scholarship by examining the logic of sameness that clashes
    racism and inhibits the preservation of difference. By analyzing the theoretical
    tensions produced and among women of color and white women, Lugones develops an
    account of boomerang perception described as the racist and colonialist perception
    of people of color that deny their independence. On her account, people of color
    are constructed through a white imaginary lens, which collapses the construction
    of the nonwhite body is dependent on the vision and perception of the white body
    for its history, self-construction, and social perception.


    This essay explores the complexity of the perceptual epistemological structures
    that comprise boomerang perception. I focus on the lived experiences of Latinas
    today and consider the ways in which boomerang perception plays out as part of
    social and cultural life by specifically looking at the way in which Latinas have
    become part of a commercial homogenized identity. I argue that such constructions
    evoke a fake/real dichotomy that is rooted in the internalization of boomerang
    perception, which can be resisted through the insights offered by the work of
    Gloria Anzaldúa on *conocimiento*. The methodological framework of conocimiento
    elucidates a transformative embodied sense of knowing that can resist the impact
    of boomerang perception. In this capacity, I offer the case of resistance through
    chonga-style politics as one that exemplifies the possibilities of conocimiento.


    Stephanie Rivera Berruz, *Stylized Resistance In: Theories of the Flesh,* Ed by:
    Andrea J. Pitts, Mariana Ortega, and José Medina, Oxford University Press (2020).
    © Oxford University Press.

    DOI: 10.1093/oso/9780190026965.003.015'
