    scholars discuss normative problems concerning knowledge, understanding, and communication
    that arise from the oppression and marginalization of Latin peoples, but also
    the liberating potential of alternative ways of talking, knowing, and being critically
    aware that can be found in the nonconforming practices and sensibilities of Latin
    resistant subjects.


