  md: 'roles, and Latina/o popular culture of the period. Moreno Vega thereby offers
    readers a feminist memoir, written by an Afro-Latina, that couples an embrace
    of new Americas religiosity born of African diaspora challenges to resist and
    misogynistic values and practices. Hers is a narrative grounded in intersectionality
    that recognizes her “multiplicitous selves”.2 Though the narrative centers on
    an era that permeated the emergence of “intersectionality” as a theory of how
    women of color might craft political and juridical answers to the multiple oppressions
    they face, I suggest that Moreno Vega’s narrative resonates with observations
    about the roots of women-color feminist theory in the social movements of earlier
    decades.3 Her memoir reveals a unique form of Latina feminisms that emerges from
    the experiences of Afro-Latinas.


    When Vega discusses the work of composing this memoir, she explains in the epilogue,
    that it was necessary to research her own story, by interviewing family and friends
    she knew in the 1950s and by visiting her abuela’s hometown in Puerto Rico, Liza
    Aldea, for its strong African diaspora heritage (Moreno Vega 2004, 268). Moreno
    Vega doesn’t mention here, perhaps taking it for granted among her readers, the
    decades of research, teaching, and community arts organizing in the cultures,
    arts, and worldviews of African diaspora peoples for which she is very well known.
    Founder of the Caribbean Cultural Institute in 1976 and faculty member in African
    diaspora studies at Hunter College and in Puerto Rico, Moreno Vega’s numerous
    projects, exhibits, and publications over the past forty years have been a significant
    contribution to creating our present-day consciousness of the African diaspora
    in Puerto Rico, and of Puerto Rican subjects as Afro-Latinas/os.


    Having worked for decades to expand the knowledge and understanding of African
    diaspora in Puerto Rico through her research and institution-building within arts
    and ethnic communities, Moreno Vega can finally narrate the story of childhood
    and youth immersed in forms of spirit and ancestor worship unique to African diaspora
    peoples that, in the 1950s, were not widely accepted or discussed or outside of
    insider circles. She describes this in another work: “In 1955, there were approximately
    twenty-five people in New York City who were believers in the Orisha tradition”
    (Moreno Vega 2010, 245). It is not hard to imagine the lack of acceptance or understanding
    that these worldviews may have encountered in the United States of the 1950s,
    especially given the scholarship upon


