  md: 'Olympia refuses to be positioned as the object of the voyeuristic male gaze,
    constituting herself as the subject of the gaze, subalternizes (as well as Manet)
    the other woman in the picture (the black servant) by not even acknowledging her
    presence. The whiteness of Olympia’s skin contrasts with the whiteness of the
    maid in the faded pink dress, who, in turn, shares the space of the painting with
    the cat, also sitting sensuously at Olympia’s feet. In quite a provocative way,
    bodies marked by gender, class, race, and animality, carefully arranged in a colonial
    narrative, intersect in the constitution of Western dualism between the human
    (white woman) and the nonhuman (the and black cat), is considered a hallmark of
    coloniality.


    The painting very clearly highlights European discourses about gendered oneness,
    as Lugones (2010) further illustrates: white women, notwithstanding their inferiority
    to men, are usually positioned on the human (gendered and civilized) side of the
    equation, black and indigenous women were viewed by the colonizer as existing
    closer to nature, as sexualized human beings “fit for breeding, brutal labor,
    exploitation, and/or massacre (206). Such dehumanization of the other, as many
    colonial feminists point out, “survives colonization [and] helps make sense of
    the contemporary issues such as femicide, trafficking, and increased violence
    against non-European women” (Mendoza 2016, 117).


    My translation of Manet’s Olympia becomes a trope to explore the challenges that
    Latin American face in analyzing the multifaceted impact of colonization on women,
    and in problematizing hegem feminism. The questions I want to pose are: How do
    decolonial feminisms in the Latin American context translate and undermine hegemonic
    feminism? How can we develop critical knowledges that speak back racialized and
    feminized peoples have always been marginalized and oppressed? These are some
    of the conundrums about contemporary theoretical trends within decolonial feminisms
    that I will explore to map out, in a necessarily abbreviated manner, possible
    alternative routes for making connections among several feminist formations in
    the Americas. More specifically, I will argue that translation—based not only
    on a linguistic paradigm, but more importantly, on an ontological one—becomes
    a key element for forging alternative, decolonial feminism.


    Considering the recent discussions on the ontological turn—defined as the view
    that humans and nonhumans inhabit and incommurable realities/ontologies (as opposed
    to cultures, according to the cultural relativist argument)—translation as both
    a cultural and ontological endeavors becomes a sine qua non practice for bringing
    these worlds into conversation.'
