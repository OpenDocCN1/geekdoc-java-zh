  * `¼ cup` 苹果酱等于 1 个鸡蛋\n* `50g` 素食羊奶士\n* `50g` 橄榄\n* 盐和胡椒\n\n**做法：**\n1. 将烤箱预热至 `300\
  \ F`。在玛芬模上涂油并撒粉。\n2. 将面粉和泡打粉筛入大碗中。将油、牛奶和苹果酱混合均匀。拌入奶士和橄榄。用盐和胡椒调味并混合。\n3. 盛入玛芬模中，烘烤\
  \ `15 minutes` 直到升起且颜色呈微褐色。\n\n### 2. 芝士吐司\n\n**食材：**\n* `2 片` 厚面包\n* `1 个` 小红洋葱，切碎\n\
