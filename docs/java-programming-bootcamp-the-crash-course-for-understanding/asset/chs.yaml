  \ `example.js`）。\n\n让我们尝试一个简单的练习。将下面的代码复制到文本文件中并保存为“`filename.js`”。然后，在添加 `filename.js`\
  \ 文件后使用 `sayHello` 函数。\n\n![](img/image1889)\n\n## 第 4 章：JavaScript 中的变量\n\n###\
  \ JavaScript 中的不同数据类型\n\n与其他编程语言类似，JavaScript 有它自己支持的类型。因此，你可以使用 JavaScript 表示某些值和信息。\n\
  \n该语言支持这些数据类型：\n\n*   布尔值（即 `true` 或 `false`）\n*   字符串（例如“This book is awesome.”）\n\
  *   数字（例如 1, 2, 3123）\n\nJavaScript 还支持 `null` 和 `undefined`，这是描述单个值的两种类型。最后，这种语言使用一种名为对象的复杂类型。稍后我们会学习。\n\
  \n**重要说明：** JavaScript 将所有数字视为浮点数。\n\n### 变量\n\n作为 JavaScript 用户，你可以将变量视为容器：你可以在变量中放置不同类型的信息。要访问存储的数据，你只需要指定持有它的容器。\n\
  \n你必须在使用变量之前对其进行声明。在 JavaScript 中，声明变量时应使用 `var`。查看下面的示例：\n\n![](img/image1890)\n\
  \n上述代码声明了变量：`money` 和 `name`。\n\n### 变量初始化\n\n将数据保存变量的过程被称为变量初始化。大多数程序员在声明时进行初始化。然而，你可以只声明变量而不保存任何值：在你需要时将数据保存变量。\n\
  \n例如，你可以创建一个名为 `profit` 的变量而不输入任何值。\n\n```javascript\nvar profit;\nprofit = 1000000.00;\n\
  ```\n\nJavaScript 被视为一种“无类型”计算机语言。这意味着 JavaScript 变量可以包含任何类型的数据。这比要求用户在创建变量时指定数据类型的语言来说是一个巨大的优势。\n\
  \n### 变量的作用域\n\n变量的“作用域”是你在计算机程序中声明它的区域。JavaScript 支持以下作用域：\n\n*   局部（Local）–局部变量仅在定义的函数内部可见。这意味着一个函数无法使用另一个函数的局部变量。\n\
  *   全局（Global）–全局变量对程序内的所有函数可用。这意味着你可以在代码的任何地方定义它们。\n\n\n\n\n如果局部变量和全局变量具有相同的名称，则局部变量具有更高优先级。如果你使用现有全局变量的名称在本地声明变量，你将隐藏该全局变量。请分析下面的示例代码：\n\
  \n![](img/image01891.jpeg)\n\n上述代码将向你显示此结果：Local。\n\n## 变量的命名\n\n在为变量选择名称时，你应该记住以下规则：\n\
  \n*   你不能使用任何 JavaScript 关键字（例如 `break`、`Boolean` 等）作为变量名。你将在稍后学习关于 JavaScript 关键字。\n\
  *   在命名变量时，可以使用字母、数字和下划线。但是，你不能用数字开头命名。例如，`sample1` 是合法的，但 `1sample` 则不是。\n*   变量名是区分大小写的。这意味着\
  \ JavaScript 将 `SAMPLE`、`Sample,` 和 `sample` 视为三个不同的变量。\n\n## JavaScript 中的保留关键字\n\
  \n与其他编程语言类似，JavaScript 拥有一组具有特殊用途的词。你不能在命名对象、方法、函数、循环和变量时使用这些词。下表将显示 JavaScript\
  \ 语言中所有的关键字。\n\n| if | do | in | int |\n| new | try | for | var |\n| else | enum\
  \ | this | long |\n| byte | case | true | null |\n| char | goto | void | with |\n\
  | break | throw | false | final |\n| catch | float | class | const |\n| while |\
  \ short | super | switch |\n| export | throws | typeof | public |\n| return | delete\
  \ | static | double |\n| import | Instanceof | abstract | synchronized |\n| Boolean\
  \ | interface | extends | transient |\n| finally | package | private | protected\
  \ |\n| function | volatile | continue | debugger |\n| implements | | | |\n\n## 第\
  \ 5 章：JavaScript 运算符\n\nJavaScript 语言支持以下类型的运算符：\n\n*   逻辑运算符\n*   比较运算符\n*   赋值运算符\n\
  *   算术运算符\n*   位运算符\n*   杂运算符\n\n让我们讨论每种类型的运算符：\n\n### 逻辑运算符\n\nJavaScript 支持这些逻辑运算符：\n\
  \n注意：假设 `x = 5` 且 `y = 10`。\n\n*   `&&` – 这被称为逻辑与（Logical AND）运算符。如果两个操作数都不等于零，则条件为真。例如：`(x\
  \ && y)` 为真。\n*   `||` – 此运算符称为逻辑或（Logical OR）。如果至少有一个操作数不等于零，则条件为真。例如：`(x || y)`\
  \ 为真。\n*   `!` – 程序员将此运算符称为逻辑非（Logical NOT）。该运算符会反转它所作用的运算符的结果。例如：`! (x && y)` 为假。\n\
  \n## 比较运算符\n\n以下是你可以在 JavaScript 中使用的比较运算符：\n\n注意：让我们使用以下变量：`x = 2; y = 4.`。\n\n\
  *   `==` – 此运算符检查两个操作数的等等性。如果值相等，则条件为真。例如：`(x == y)` 为假。\n*   `!=` – 使用此运算符，你可以检查操作数的值是否不等。如果值不相等，则条件为真。例如：`(x\
  \ != y)` 为真。\n*   `>` – 在这里，你将检查左侧操作数的值是否大于右侧的值。如果是，则条件为真。例如：`(y > x)` 为真。\n*  \
  \ `<` – 此运算符检查两个操作数的值。如果左侧操作数的值小于右侧操作数的值，则条件为真。例如：`(x > y)` 为真（注：此处原文示例可能有误，应为 `x\
  \ < y`）。\n*   `>=` - 你可以使用此运算符检查左侧操作数的值是否大于或等于右侧的值。如果是，则条件为真。例如：`(y >= x)` 为真。\n\
  *   `<=` – 使用此运算符，你可以检查左侧操作数的值是否小于或等于右侧操作的值。如果是，则条件为真。例如：`(x <= y)` 为真。\n\n### 赋值运算符\n\
  \n这些是你用来赋值的运算符：\n\n*   `=` – 这是简单赋值运算符。它将右侧操作数的值赋值给左侧操作数。例如：`(z = x + y)` 将 `x +\
  \ y` 的值赋值给 `z`。\n*   `+=` – 此运算符被称为“加赋值”运算符。它将两个操作数的值相加并将结果赋予左侧操作数。例如：`(z += x)`\
  \ 等于 `(z = z + x)`。\n*   `-=` – 程序员将其称为“减赋值”运算符。它从左侧操作数的值中减去右侧操作数的值。然后将差赋值给左侧操作数。例如：`(z\
  \ -= x)` 等于 `(z = z– x)`。\n*   `*=` – 此运算符称为“乘赋值”。它将两个操作数的值相乘并将积赋予左侧操作数。例如：`(z *=\
  \ x)` 等于 `(z = z * x)`。\n*   `/=` – 这被称为“除赋值”运算符。它将左侧操作数的值除以右侧操作数。\n*   `%=` – 这被称为“模赋值”运算符。它计算左侧操作数对右侧操作数的模并将结果赋予左侧操作数。\n\
  \n### 算术运算符\n\n为了帮助理解这些如何工作，让我们使用 `x = 2; y = 4.`。\n\n*   `+` – 你可以使用 `+` 运算符连接数值和字符串。例如：`x\
  \ + y`。\n*   `-` – 此运算符从第一个值中减去第二个值。例如：`y– x`。\n*   `*` – 如果你想乘操作数，应该使用星号。例如：`x\
  \ * y`。\n*   `/` – 使用此运算符可以将左侧操作数除以右侧操作数。例如：`y / x`。\n*   `++` – 此运算符允许给运算符加 1。例如：`x++`。\n\
  *   `--` – 此运算符从运算符减 1。例如：`x`。\n\n### 位运算符\n\n该编程语言允许你在代码中执行位操作。以下你可以使用的运算符：\n\n\
  注意：让我们使用两个变量：`x = 2; y = 3.`。\n\n*   `&` – 这被称为位与运算符。它对参数的所有位执行逻辑与操作。例如：`(x & y)`\
  \ 为 2。\n*   `|` – 程序员将此运算符称为位或运算符。它对参数的所有位执行逻辑或操作。例如：`(x | y)` 为 3。\n*   `^` – 这被称为位异或（Logical\
  \ XOR）运算符。它对参数的所有位执行逻辑异或操作。在异或中，只有一个操作数为真。例如：`(x ^ y)` 为 1。\n*   `~` – 此运算符是“单元的”（即它作用于单个操作数）。被称为位非运算符，它反转操作数的位。例如：`(~y)`\
  \ 为 -4。\n*   `<<` – 此运算符称为左移。它根据右侧操作数的数字将左侧操作数的位向左移动。此外，它使用零填充新位。将值向左移动 1 位相当于乘以\
  \ 2。因此，`(x << 1)` 为 4。\n*   `>>` - 此运算符被称为右移。它根据右侧操作数的数字将左侧操作数的值向右移动。例如：`(x >> 1)`\
  \ 为 1。\n\n\n\n\n本书的这一章节将讨论两个不属于上述类别的实用运算符。这些运算符是：\n\n* `?:` – 这被称为“条件运算符”。它检查一个表达式的值是真还是假。然后，它根据求值结果执行所分配的语句之一。\n\
  \n例如，如果条件为真，运算符将 `1` 赋值给该表达式。然而，如果条件为假，运算符将赋值 `2`。\n\n* `typeof`– 这是一个一元运算符，这意味着你可以对单数一个操作数使用它。你可以用它来确定操作数的数据类型。如果操作数是字符串、布尔值或数字，该运算符将返回“string”、“boolean”或“number”。然后，它根据求值结果返回\
  \ true 或 false。\n\n下表提供了关于 `typeof` 运算符的有用信息：\n\n| 数据类型 | typeof 结果 |\n| :--- |\
  \ :--- |\n| Object | “object” |\n| Number | “number” |\n| Boolean | “boolean” |\n\
  | Undefined | “undefined” |\n| Null | “object” |\n| Function | “function” |\n| String\
  \ | “string” |\n\n# 第 6 章：条件语句\n\n在使用 JavaScript 时，会有某些情况需要你从预定义的集合中选择一个。在这些情况下，你必须使用条件语句。条件语句允许你的程序做出适当判断并执行正确的流程。\n\
  \n这种编程语言提供了你可以在代码中使用的条件语句。本章将讨论三个最重要的条件语句：(1) `if` 语句，(2) `if… else` 语句以及 (3) `if…\
  \ else if…` 语句。\n\n让我们详细讨论这些语句：\n\n## 条件语句的流程图\n\n下面的图片显示了条件语句的基本流程图。\n\n![](img/image01892.jpeg)\n\
  \n### if 语句\n\n该语句是 JavaScript 中的基础条件语句。它帮助程序做出决策并执行其他语句。\n\n`if` 语句的语法如下：\n\n![](img/image01893.jpeg)\n\
  \n上述代码评估 JavaScript 表达式。如果求值结果为真，则将执行分配的语句。然而，如果结果为假，则不会执行任何分配的语句。在大多数情况下，你会在此语句中配合比较运算符。\n\
  \n### if… else 语句\n\n该语句比上一个更复杂。这是因为 `if… else` 语句在条件执行语句方面提供了更好的控制。\n\n这里是 `if…\
  \ else` 语句的语法：\n\n![](img/image01894.jpeg)\n\n你可以使用上述语法来评估 JavaScript 表达式。如果结果为真，则执行放在\
  \ `if` 部分的语句。另一方面，如果结果为假，则执行 `else` 部分内部的语句。\n\n### if… else if… 语句\n\n基本上，这是 `if…\
  \ else` 语句的增强形式。通过提供多个条件，它帮助你的程序做出正确的决策并执行正确的操作。\n\n在创建 `if… else if…` 语句时，必须使用的语法如下：\n\
  \n![](img/image01895.jpeg)\n\n## Switch-Case 语句\n\nJavaScript 语言允许你根据单个值执行多个操作。这是通过\
  \ `switch` 语句实现的。`switch` 语句将表达式与一系列 `case` 表达式进行比较。当找到匹配项时，执行与该 `case` 关联的代码块。`break`\
  \ 语句用于在找到匹配后退出 `switch` 块。如果没有找到匹配项，则执行 `default` 块。\n\n`switch` 语句比多个 `if… else`\
  \ 语句更具可读性。\n\n`switch` 语句以其灵活性闻名。它允许你轻松处理不同的情况。\n\n### 流程图\n\n`switch` 语句评估一个表达式。然而，如果没有找到匹配项，系统控制将交给\
  \ `switch` 之后的语句。\n\n这里是 `switch` 语句的流程图：\n\n![](img/image01896.jpeg)\n\n### 语法\n\
  \n`switch` 语句设计用于完成两件事：\n\n* 提供一个表达式\n* 提供 `case` 表达式\n\n`switch` 语句将表达式与每个 `case`\
  \ 值进行比较。如果找到匹配，则执行 `case` 之后的代码块。`break` 语句用于退出 `switch` 块。如果没有找到匹配项，则执行 `default`\
  \ 块。\n\n`switch` 语句的语法如下：\n\n![](img/image01897.jpeg)\n\n## 第 6 章：循环类型\n\n在编写自己的程序时，你会遇到必须重复某些操作的情况。这些工具被称为循环，是本章的主题。\n\
  \n### While 循环\n\n程序员认为这是最基础的循环。`while` 循环在表达式为真时执行代码块。一旦表达式变为假，循环就会结束。\n\n这里是 `while`\
  \ 循环的流程图：\n\n![](img/image01898.jpeg)\n\n### 语法\n\n`while` 循环的语法如下：\n\n![](img/image01899.jpeg)\n\
  \n在执行任何语句之前，`while` 循环会评估条件。这意味着如果表达式为假，则不会执行任何语句。\n\n### Do… while 循环\n\n`do… while`\
  \ 循环与 `while` 循环相似。唯一的区别是它在执行语句后才评估表达式。如果求值结果为真，循环将再次执行。由于这一点，即使结果为假，`do… while`\
  \ 循环也会运行一次。\n\n典型的 `do… while` 循环流程图如下：\n\n![](img/image01900.jpeg)\n\n### 语法\n\n\
  `do… while` 循环的语法如下：\n\n![](img/image01901.jpeg)\n\n重要：语法末尾的分号是强制性的。确保你在所有的 `do…\
  \ while` 循环中都加上了它。\n\n### For 循环\n\n这种循环以其紧凑性闻名。通常，`for` 循环包含以下部分：\n\n* 循环初始化——这是你为计数器设置初始值的地方。JavaScript\
  \ 解析器在运行循环之前执行此部分。\n* 测试语句——循环的这部分评估分配的条件。如果分配条件为真，解释器将执行 `for` 循环内部的代码。然而，如果条件为假，系统控制将交给\
  \ `for` 循环之后的语句。\n* 迭代语句——你可以使用此部分来增加或减少循环计数器。\n\nJavaScript 允许你将所有这些部分放在一行。你只需要用分号分隔每个部分即可。\n\
  \n下面的图片显示了 `for` 循环的流程图：\n\n![](img/image01902.jpeg)\n\n### 语法\n\n`for` 循环的语法如下：\n\
  \n![](img/image01903.jpeg)\n\n\n\n\n\n为了帮助你处理此类情况，这种编程语言提供了两个强大的工具：`break` 语句和 `continue`\
  \ 语句。让我们详细讨论一下这两个语句。\n\n### Break 语句\n\n该语句在上一章中引入，允许你提前退出任何循环。下面的图片将向你展示基础 `break`\
  \ 语句的流程图。\n\n![](img/image01904.jpeg)\n\n注意：我们在讨论 switch 语句时你已经见过 `break` 语句是如何工作的。\n\
  \n### Continue 语句\n\n`continue` 语句指示 JavaScript 解释器开始循环的下一次迭代，并忽略剩余的代码块。一旦系统遇到 `continue`\
  \ 语句，程序流将跳转到表达式求值。如果条件仍然为，`continue` 语句将开始下一次迭代。另一方面，如果条件变为假，程序控制将跳到循环之外。\n\n###\
  \ 第 7 章：JavaScript 语言中的函数\n\n基本上，函数是可重用代码的集合，可以在程序的任何部分调用。这意味着你不需要多次编写相同的代码。函数帮助程序员创建模块化代码。它们还允许程序员将一个大型程序分成较小的函数。\n\
  \n就像任何其他编程语言一样，JavaScript 提供了可以通过函数帮助编写模块化代码的功能。你可能已经在本书提供的代码中见过诸如 `write()` 和 `alert()`\
  \ 等函数。你可以反复使用这些函数，但它们在 JavaScript 中只写了一次。\n\n这种语言还允许你编写自己的函数。本章将教你 JavaScript 函数的基础知识。\n\
  \n#### 如何定义函数\n\n你必须在使用函数之前对其进行定义。定义函数最流行的方法是使用 `function`（即 JavaScript 关键字）。在输入\
  \ `function` 后，指定你想要使用的名称和参数。然后，添加一个用大括号括起来的 JavaScript 语句块。\n\n注意：你可以创建一个没有定义任何参数的函数。因此，参数列表可以是空的。\n\
  \n以下是你定义函数时必须使用的语法：\n\n![](img/image01905.jpeg)\n\n#### 如何调用函数\n\n在脚本中调用函数，只需要指定函数的名称。你可以使用下面的代码作为示例：\n\
  \n![](img/image01906.jpeg)\n\n该代码将给你如下结果：\n\n![](img/image01907.jpeg)\n\n#### 函数的参数\n\
  \n你目前看到的函数没有任何参数。然而，在唤用/调用函数时，你可以轻松地分配各种参数。你可以在函数内部捕获这些参数。一旦捕获，你就可以根据需要修改这些参数。\n\
  \n#### Return 语句\n\nJavaScript 允许你在函数中添加 `return` 语句。这个 return 语句是完全可选的，尽管你如果你想从你的函数中获取值，就必须使用它。通常情况下，你应该将\
  \ `return` 语句放在函数的最后部分。\n\n例如，你可以向函数传递两个值。然后，你可以期望该函数将这些值相乘并在你调用的程序中显示结果。\n\n####\
  \ 嵌套函数\n\nJavaScript 允许将一个函数放在另一个函数内部。这个过程被称为“嵌套函数”。根据一般规则，你不能在循环或条件语句内部包含函数定义。\n\
  \n下面的代码将教你如何嵌套自己的函数：\n\n![](img/image01908.jpeg)\n\n上面的代码给出了结果：\n\n![](img/image01909.jpeg)\n\
  \n#### 如何使用“Function()”创建函数\n\n除了讨论过的 `function` 语句外，你还可以使用 `Function()`（即 JavaScript\
  \ 构造函数）和 `new`（即 JavaScript 运算符）来创建函数。\n\n要使用此构造函数，你必须使用以下语法：\n\n![](img/image01910.jpeg)\n\
  \n这种语法可以包含任意数量的字符串参数。注意：`Function()` 不为函数指定名称。程序员将这些函数称为“匿名”函数。\n\n### 结论\n\n\n\n\
  \n\nWindows 10 的另一个最新形态是 Cortana，它是一个虚拟助手，能够帮助你在电脑中搜索所需内容、查找文件、跟踪包裹、管理日历，甚至可以与你聊天——尤其是当你需要某方面的帮助时！\n\
  \n你只需在任务栏顶部的搜索栏中输入问题即可访问 Cortana。你也可以使用麦克风图标来操作——不过，最好直接搜索，因为并不是所有的手机（如果你也将 Windows\
  \ 10 同步到了其他设备）都拥有清晰的麦克风/扬声器。\n\n## 魔法词汇\n\n你可以让 Cortana 在你每次说 `Hey, Cortana` 时对你做出回应。只需只需：\n\
  \n1. 选择 `Notebook` > `Settings`。\n2. 你会看到一个显示 `Let Cortana respond when you say\
  \ Hey, Cortana` 的设置。开启该选项。\n\n## 它的功能\n\nCortana 能够帮助你处理很多事情，但以下是你可以期待的内容：\n\n1.\
  \ **询问 Cortana 天气状况。** 了解天气情况非常有帮助，因为它可以让你据此安排活动。只需询问（自选地点）的天气如何，Cortana 就能回答你。你也可以点击\
  \ Cortana 的 `Notebook`，点击 `Weather`，查看当天的安排！\n2. **基于位置获取提醒。** 这意味着你可以在某个特定地点时让\
  \ Cortana 提醒你某事。例如，当你在杂货店想让它提醒你买猫粮时，你可以告诉 Cortana：`Remind me to buy cat food while\
  \ at Park Avenue Grocery—或者类似的话`。只需确保你不要忘记说 `Remind Me`，因为这是这里的魔法短语。你也可以告诉 Cortana\
  \ 编辑或关闭已创建的提醒，以避免混淆。\n3. **让 Cortana 为你打开应用！** 最后，你可以通过说 `Open (desired app)` 让\
  \ Cortana 打开你需要的应用。例如，对 Cortana 说：`open Adobe Photoshop`。看，现在你可以完成你必须做的事——甚至不需要用手！\n\
  4. **让 Cortana 根据时间搜索媒体文件。** 如果你不知道从何处开始，或者一个页面上的信息太多，搜索可能会令你无从下手。这时，你可以让 Cortana\
  \ 按文件类型或日期进行搜索。例如，对 Cortana 说：`search for music from 3 years ago`。确保你的电脑或 `OneDrive`\
  \ 上有所需的文件——或者你也可以将 Cortana 连接到 `Edge`（详见第 7 章）来实现此功能。\n5. **让 Cortana 为你唱歌！** 是的，Cortana\
  \ 不仅仅提供信息，她也很有趣。你可以让她为你唱歌，她甚至用 Jen Taylor 的人声演唱！这样一来，你就不会感到害怕或觉得她如此机器人化。要让她唱歌，你可以使用以下命令：\n\
  \   - `Sing me a lullaby.`\n   - `Sing me a song.`\n   - `What does the fox say?`\n\
  6. **通过告诉她你自己让她了解你的偏好。** 只需输入或说 `let me tell you about myself`，然后开始告诉她你的喜好、什么让你感到快乐，或者你想进一步了解的什么。\n\
  \n## 设置这些提醒\n\nCortana 还可以帮助你为正在发生的大事设置提醒。你只需进入搜索栏并输入你想被提醒的内容即可。例如：\n\n1. `Wake\
  \ me up at 6 on Saturday for the meeting.`\n2. `Remind me of the Superbowl.`\n3.\
  \ `Change my 9am to 10:30.`\n\n## 彩蛋\n\n在彩彩蛋的帮助下，使用 Cortana 变得更加有趣！这些是你可以问或告诉 Cortana\
  \ 的内容，它们会给出非常幽默且有趣的答案！以下是你应该尝试的：\n\n1. `Do you like Google Now?`\n2. `Can you dance?`\n\
  3. `Who’s better: You or Siri?`\n4. `Are you awake?`\n5. `I hate you.`\n\n## 关闭\
  \ Cortana\n\n如果你厌倦了 Cortana 或不再需要她的帮助，只需进入 `Settings`，然后选择 `turn Cortana off` 来关闭该功能。\n\
  \n## 第 3 章：使用开始菜单\n\n许多用户反映 Windows 10 的开始菜单相当困惑，但并不是无法理解。这里你可以遵循的简单步骤来使用它！\n\n\
  1. 点击 `Start Menu`。这出现在屏幕的左侧。\n2. 点击 `All Apps`。同样，这出现在屏幕左侧。你将看到电脑上安装的所有应用列表。\n\
  3. `Power` 按钮允许你休息或关闭 Windows。它位于屏幕的左侧列。\n4. 要锁定电脑，只需右键点击你的账户名称，你将看到以下选项：`lock`、`change\
  \ account picture`、`sign out`。选择 `lock`。\n5. 要管理你在屏幕右侧看到的磁贴，只需右键点击磁贴，屏幕上会弹出一个菜单。选择\
  \ `Unpin from Start`、`Resize` 或 `Pin to Taskbar`。同时检查你是否。\n6. 要锁定电脑，只需右键点击你的账户名称，你将看到以下选项：`lock`、`change\
  \ account picture`、`sign out`。选择 `lock`。\n7. 要管理你在屏幕右侧看到的磁贴，只需右键点击磁贴，屏幕上会弹出一个菜单。选择\
  \ `Unpin from Start`、`Resize` 或 `Pin to Taskbar`。同时检查你是否。\n\n### 访问隐藏菜单\n\n当然，你也可以根据自己的偏好对开始菜单进行个性化定制！\n\
  \n\n\n\n\n你也可以通过以下步骤在注册表中进行此调整：\n\n1. 转到`开始 > 所有应用 > Windows 系统 > 运行`。\n2. 在对话框中输入\
  \ `regedit`，然后按`回车`。\n3. 在注册表编辑器中导航到 `HKEY_LOCAL_MACHINE> Software>Policies>Microsoft\
  \ Windows>System`。\n4. 现在，右键点击 `System`，然后点击`新建>DWORD (32 位) 值`。\n5. 将名称更改为 `Disable\
  \ Log-in Background Image`（不带空格）。\n6. 右键点击 `Disable Log-in Background Image` 并选择`修改`。\n\
  7. 在`数值数据`下输入 `1` 并点击`确定`。\n8. 同时按下`Windows 键 + L`，这样当你登录时将看到一个纯色背景。\n9. 如果需要，前往`设置\
  \ > 个性化 > 背景` 来调整背景颜色。\n\n# 第 4 章：管理设置\n\nWindows 10 与其之前的版本相比，最大的区别之一在于启动电脑时，你不仅会看到“开始”菜单，还能看到“设置”菜单。这个菜单在一个新窗口中打开，带有大而易于触摸的图标。与\
  \ Windows 7 和 8 中隐藏在“Charm ”中的菜单不同，这个菜单会立即出现——这让你用起来更加舒适。\n\n你可以在此菜单中找到的内容包括：\n\n\
  ## 管理设备\n\n“设置”菜单引入了一些你在使用此操作系统时可以使用设备。它还讨论了在使用此操作系统时可以与你的电脑连接的设备。以下是你可以进行的操作：\n\
  \n1. 首先，`自动播放`允许你选择是否开启或关闭`自动播放`。\n2. `打字`允许你选择是否想使用物理键盘或屏幕键盘。\n3. `打印机和扫描仪`允许你向电脑添加打印机。要执行此操作，只需点击`设备和打印机>\
  \ 设备管理器> 相关设置> 添加打印机或扫描仪`并按照屏幕上的指示进行操作。\n4. `鼠标和触控板`让你有机会配置`鼠标和触控板`设置。只需选择`鼠标和触控板\
  \ > 相关设置> 更多鼠标选项`。\n5. 同时，`连接的设备`关于除打印机或扫描仪以外的其他连接设备。\n\n## 账户管理\n\n除了你自己的账户，你还可以管理家成员的账户——只要他们连接了你自己的账户！\n\
  \n以下是你需要了解的：\n\n1. `我的账户`是你的主登录账户。它与微软云网络相关联。\n2. `工作访问`告知你 PC 或你的账户是否连接到另一个网络。\n\
  3. `同步我的设置`允许你将此电脑与其他设备——以及家中的其他电脑——进行同步。这样，即使你不在家，也能轻松地控制它们。\n4. `登录选项`将询问你具体想以什么方式打开电脑。你可以使用普通的密码+密码登录，也可以选择`Windows\
  \ Hello`，这将允许你使用生物识别进行登录。\n5. `家庭和其他用户`允许你为电脑添加更多管理员。要执行此操作，只需点击`为选定的访问权限设置账户 >\
  \ 选择账户 > 选择应用`。\n\n## 自定义与个性化\n\n若要自定义和个性化你的设置，只需执行以下操作：\n\n1. `背景`主要是你电脑的壁纸，并选择你希望照片如何适应你的屏幕。\n\
  2. `颜色`是用于桌面、工具栏等的颜色。\n3. `锁定屏幕`是你屏幕锁定时看到的内容。点击`图片`，你将看到最近使用的 5 张锁定屏幕图片，以及一个`浏览`按钮，供你从文件中选择照片。选择`幻灯片`将使照片幻灯片成为锁定屏幕。你还可以选择`屏幕超时`以及更多`屏幕保护程序设置`。\n\
  4. `主题`将帮助你选择想要使用的主题。前往`经典主题设置 > 相关设置`来执行此操作。\n6. `开始`帮助你开启或关闭应用程序和通知——以及更多。你将在下一章中学习更多内容。\n\
  \n## 更新与还原\n\n万一出现问题或你收到有关更新的通知，你需要执行操作：\n\n1. `激活`关于你所拥有的 Windows 版本，并提供更改`产品密钥`的机会。\n\
  2. `高级选项`将提供更多可选择的更新设置。\n3. `备份`为你提供备份设置的机会。\n4. 点击`检查更新`即可手动检查更新。\n5. `适用于开发人员`全关于在\
  \ Windows 10 上制作应用和程序。\n6. `恢复`包含你可以用于修复电脑的选项，包括：`重置此电脑`、`返回到以前版本`以及`高级启动`。\n7.\
  \ 名为`Windows 更新`的选项卡包含更新 Windows 所需的所有内容。\n8. 同时，`Windows Defender`是你的云保护系统。\n\n\
  ## 网络和互联网\n\n如今谁能离开互联网呢？你可以在 Windows 10 中快速方便地调整你的互联网和网络设置——你可以这样操作：\n\n1. `数据使用`主要关于正在使用的带宽，且主要关于在`Wi-Fi`上工作的连接设备。\n\
  2. `VPN`关于向你的电脑添加`VPN 连接`。要调整此项，只需前往`设置 网络 > 显示 可用连接`。\n3. `拨号和以太网`是你旧的互联网设置。\n\
  4. `代理`将允许你使用手动或自动`代理`。你可以通过`设置 网络`执行此操作。\n\n### 关闭 Wi-Fi 共享\n\n为了确保你的 Wi-Fi 连接保持私密，你可以关闭\
  \ Wi-Fi！操作方法如下：\n\n前往`设置 网络和互联网`。\n\n### 账户隐私化\n\n如今，保持账户隐私非常重要。为了免受可能窃取你信息的人的影响，你需要保护好自己。这在\
  \ Windows 10 中非常简单。你可以尝试：\n\n1. `账户信息、日历、联系人、邮件`允许你是否与其他设备同步这些内容。\n2. `位置`基本上基于`GPS`，并允许你是否让他看到你的位置。\n\
