  3. 再次点击`Range Selector` 以返回到上一个对话框。\n\n## 第 4 章：如何管理 Excel 文件\n\n和大多数程序一样，Excel\
  \ 允许你保存文件。这意味着你不需要在一个气里完成你的项目或作业。你可以保存未完成的文件，并在以后回来查看它们。\n\n根据计算机专家的说法，你应该经常保存文件。这种技术可以帮助你防止由系统崩溃或断电引起的问题。\n\
  \n### 如何保存文件\n\nExcel 程序会自动为新文件命名。名称的格式为 `Bookn`，其中 `n` 代表从 1 开始的数字（例如 `Book1`、`Book2`、`Book3`\
  \ 等）。在单个会话中每创建一个工作簿，该数字就会增加 1。\n\n要保存新文件，你应该：\n\n1. 点击名为 `SAVE` 的按钮。或者，你可以在键盘上按\
  \ `CTRL+S`。\n2. Excel 将向你显示一个对话框。使用该对话框指定文件名和你想保存它的位置。\n3. 在设置好正确的名称和位置后，点击 `SAVE`\
  \ 按钮。\n\n要保存现有文件上的更改，你必须：\n\n1. 在键盘上按 `CTRL+S`。此操作将保存现有文件上的最新更改。按照一般规则，你应该每 10 分钟保存一次更改。这将帮助你确保所有重大修改都保存到电子表格文档中。显然，你不想反复做某些事情，特别是那些涉及复杂计算和处理的内容。\n\
  \n### 如何将工作簿另存为不同的文件\n\n1. 点击名为`FILE` 的功能区并点击 `SAVE AS`。\n2. 你将看到一个对话框。使用该对话框指定文件名和你想保存它的位置。\n\
  3. 在设置好正确的名称和位置后，点击 `SAVE` 按钮。\n\n### 如何创建新文件\n\n1. 点击名为 `FILE`的功能区并点击 `NEW`。屏幕将向你显示各种模板。\n\
