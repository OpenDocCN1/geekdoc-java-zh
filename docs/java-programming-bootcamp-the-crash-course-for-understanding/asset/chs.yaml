  - 第 5 章：地中海晚餐食谱\n- 第 6 章：地中海甜点食谱\n- 结论\n\n## 引言\n\n感谢你并下载《地中海饮食：14 天地中海饮食食谱》这本书。\n\
  \n这本书包含了令人垂涎、易于制作的食谱，它们都是健康地中海饮食的一部分。\n\n如果你对发现为什么地中海饮食值得尝试感兴趣，不要犹豫，一直读到最后一章。你将有机会发现有关这种饮食健康益处的宝贵信息，学习如何将其应用于健康的生活方式，并节省在厨房工作的时间。\n\
  \n这本书可以作为你地中海饮食的忠实指南，为你提供按照一天三顿正餐（即早餐、午餐和晚餐）分类的食谱。\n\n## 地中海饮食：健康的替代方案\n\n研究表明，居住在地中海地区的人的人预期寿命是最高的之一。这显然与他们的饮食有关，这种饮食被认为是现代西方饮食的健康替代方案。选择地中海饮食带来许多健康益处，首先是降低癌症和心脏病的风险。此外，通过转变为这种饮食模式，可以预防帕金森症或阿尔茨海默症等神经退行性疾病。\n\
  \n地中海饮食金字塔的基础是身体活动和社交烹饪。新鲜水果和蔬菜出现在每餐中，以及橄榄油和全谷物。建议鱼类和其他海鲜每周吃两次，而乳制品和葡萄酒应适量摄。红肉和甜点位于金字塔的顶端。\n\
  \n如果你决定尝试这种饮食，你必须习惯于将新鲜水果蔬菜、全谷物、豆类和坚果作为基础食物。应该用更健康的橄榄油代替黄油，用香草和香料为菜肴调味（而不是用盐）。面包是地中海饮食不可或缺的一部分，但应该是全谷物制成的。通常情况下，蘸着橄榄油吃。\n\
  \n各种坚果是地中海饮食的一部分，因为它们含有健康的脂肪。然而，建议适量食用。正如你将亲眼看到的，目的并不是完全消除脂肪，而是将健康的脂肪整合到饮食中。\n\n\
  \n\n\n橄榄油仍然健康单不饱和脂肪的主要来源，对整体健康有积极影响。研究表明，经常食用橄榄油可以降低坏低密度脂蛋白（LDL）胆固醇水平；此外，加工程度最低的特级橄榄油含有大量的健康抗氧化剂（具有防癌作用）。\n\
  \n菜籽油也是这种饮食方案的一部分，因为它含有健康的 Omega-3 脂肪酸，例如亚麻酸（也存在于坚果中）。通过食用此类油类，你将获得较低的甘油三酯水平，并降低血栓形成的风险。Omega-3\
  \ 脂肪酸已知能预防心脏疾病，它们能使血管更强，并控制血压。这些健康的酸也存在于某些鱼类中，它们通常作为地中海饮食的一部分食用（鳟鱼、沙丁鱼、魭、青�鱼、鲑鱼、金枪鱼等）。\n\
  \n乳制品如鸡蛋、奶酪或酸奶，是健康地中海饮食的一部分。然而，与肉类一样，建议适量食用。至于红肉和甜点，正如所说，它们处于金字塔的顶端，这意味着它们的食用频率应该是最低的。\n\
  \n在地中海饮食涉及的饮料方面，鼓励适量饮酒（尤其是红酒），因为它已被证明可以降低心脏疾病的风险。对于女性，建议每日饮用量一杯，而男士每天可以享受两杯。水是这种饮食的基础饮料，建议全天饮用。\n\
  \n重要的是，要理解地中海饮食不仅关乎食物，更关乎你生活方式的改变。要与爱的人一起享受和准备食物，因为这种不断的互动确保了更长、更健康的生活。此外，身体活动与保持健康饮食同样重要，你应该随时寻找机会多增加活动。\n\
  \n如果你一直想减肥，应该考虑尝试这种特殊的饮食。它不仅能帮助你减肥，还能保证理想的体重管理。这种饮食可以帮助你对抗各种慢性疾病并降低哮喘发作的风险。它可以保护你免受糖尿病或抑郁症等严重疾病的侵害。此外，它还能保证生出一个更健康、更强壮宝宝。\n\
  \n地中海饮食并不复杂而且非常有趣。想象一下你将经常食用的蔬菜和水果的新鲜口感和美味风味吧。这一定会迫使你改变对肉类的看法，因为它鼓励少吃肉。另一方面，它会刺激你对海鲜的食欲，如贻贝、牡蛎或蛤蜊，尤其是当你发现它们对心脏和大脑都有健康益处时。\n\
  \n你可以采取一些简单的步骤来适应这种新饮食。例如，你可以每周开始烹饪一或两次全素素餐。你有种种蔬菜可以选择，更不用说豆类和全谷物了。此外，由于可以使用广泛的香草和香料，地中海餐肴非常有风味。\n\
  \n还建议切换到全谷物，因为它们提供了许多健康益处。它们含有大量的营养，并且富含纤维，这意味着它们能确保较长时间的饱腹感。在推荐的全谷物中，你会找到不同类型的米、小麦仁麦、法罗小麦和大麦。此外，全麦粉可以用于制作各种菜肴，确保同样的健康益处。\n\
  \n至于甜点，这可能需要一些时间适应（此处 al dente 可能是误，此处意为“可能需要习惯”），但从长远来看对你有好处。将甜点留给特殊场合，用新鲜水果作为甜点。有很多美味的水果可以选择，如无花果、石石榴、苹果或葡萄，提供健康的维生素和营养。\n\
  \n## 第 2 章：14 天饮食计划食品清单\n\n如果你打算尝试地中海饮食两周，最好整理一下你的购物清单。在这一章中，我们针对每类食品提供了一些建议。这样一来，你将更容易组织你的购物清单并开启你的地中海美食之旅。\n\
  \n### 水果\n\n非常推荐苹果，因为它们含有健康的抗氧化剂并富含纤维。牛油果被广泛使用，是脂肪和维生素 E 的良好来源。香蕉可以降低你的血压，而且它们富含纤维和钾。蓝莓最好在季节时购买，因其抗氧化特性而被推荐。其他地中海饮食中的水果包括：哈密瓜、樱桃、葡萄、奇异果、柑橘类、桃子、梨、菠萝、石榴、草莓和西瓜。\n\
  \n### 干果\n\n干果通常是地中海饮食的一部分，但要适量食用，因为它们的热量很高。所有的它们都富含纤维并具有抗氧化特性。在推荐的选择中，有：苹果、杏仁、椰枣、无花果、西梅干和葡萄干。干无花果也富含钙，并降低血压。葡萄干可以代替糖，并且富含铁。\n\
  \n### 谷物\n\n食用大麦可以促进新代谢并降低胆固醇水平。推荐糙米，因为它具有抗炎特性并富含纤维。燕麦片是早餐的完美选择，富含钙并能刺激新代谢。藜麦是蛋白质丰富的来源，而且具有抗氧化特性。其他推荐的谷物包括：荞壳、小麦仁、库斯库斯、小米、麦片和斯佩小麦。面条也可以食用，只要是“有弹性的（al\
  \ dente）”。\n\n### 海鲜\n\n海鲜通常被包含在地中海饮食中，以新鲜形式食用。它是健康 Omega-3 脂肪酸的丰富来源，并提供了许多维生素和矿物质。由于这些积极特性，它们可以对抗慢性疾病。在最推荐的海鲜中，你可以找到：鲑鱼、虾、鳕鱼、扇贝、蛤、金枪鱼和蟹。\n\
  \n### 健康油和脂肪\n\n许多作为这种饮食一部分的沙拉和菜肴是用健康油做的，是脂肪的良好来源。如果你想确保它们的质量不变，应该考虑将它们存放在凉处。推荐的油有：特级橄榄油、牛油果油、菜籽油和葡萄籽油。\n\
  \n### 香草和香料\n\n在许多地中海菜肴中，用香草和香料代替盐来增加风味。使用香草和香料的另一个优点是你不需要额外的脂肪。推荐的香草和香料有：大蒜、罗勒、香菜、欧芹、薄荷、孜然、香荽\n\
  \n### 豆类\n\n地中海饮食有很多豆类食谱，因为它们是蛋白质和纤维的良好来源。建议每周至少用豆类代替一次红肉餐。在指定的豆类中有：鹰豆、鹰嘴豆、白豆、黑豆、斑豆和扁豆。\n\
  \n### 乳制品\n\n建议适量食用乳制品，因为热量摄入较高。加入饮食的制品包括：低脂牛奶、酸奶、各种奶酪和鸡蛋。\n\n### 坚果和种子\n\n\n\n\n\
  \n地中海菜肴包含了各种坚果和种子，无论是主菜还是甜点都是如此。它们是蛋白质、纤维和健康脂肪的良好来源。然而，由于热量摄入较高，应该适量食用。推荐的坚果和种子中包括：核桃、杏仁、花生、松子、腰果、葵花籽和亚麻籽。\n\
  \n## 蔬菜\n\n大多数地中海菜肴都能找到新鲜蔬菜，有助于控制体重。此外，它们还是维生素和矿元素的良好来源。推荐的蔬菜包括：西红柿（新鲜、罐装和酱）、西兰花、菠菜、青椒（红、绿）、蘑菇、豆角、茄子、西芦、南瓜、橄榄、洋葱和豌豆。\n\
  \n这些是你 14 天地中海饮食冒险的基础食品。在后续章节中，你将发现许多针对每日三餐的推荐食谱。每个食谱都列出了总时长、人数和食材，以便你做好准备。享受制作过程，并随时与朋友家人分享你的烹饪冒险，因为这正是生活的意义所在！\n\
  \n## 第 3 章：地中海早餐食谱\n\n地中海早餐清淡却风味丰富且饱腹。在本章中，你将发现几种推荐的早餐建议，帮助你开启美好的一天。请务必尝试所有的做法，享受它们独特的味道！\n\
  \n### #1 地中海早餐三明治\n\n**份量：** 4 人份\n**总时长：** 25 min\n**食材：** 多谷三明治片（4 张）、橄榄油（4 汤）、新鲜迷迭香（1\
  \ 汤）、鸡蛋（4 个）、婴儿菠菜叶（2 杯）、西红柿（1 个）、菲塔奶士（4 汤）、犹盐（1/8 茶匙）、现磨黑胡椒（适量）\n\n**制作方法：**\n先将烤箱预热至\
  \ 375ºF。切开三明治片并刷上橄榄油。然后放入烤箱中烤约 5 分钟，直到它们呈现出诱人的金黄色。在平锅中用橄榄油和新鲜迷迭香，中中火将鸡蛋炒熟。将烤好的三明治片下半部分放在盘中。加入婴儿菠菜叶、西红柿片、一个鸡蛋和菲塔奶士。用盐和胡椒调味。在顶部盖上三明治片的上半部分。上菜享用！\n\
  \n### #2 烤西红柿蛋白白早餐三明治\n\n**份量：** 4 人份\n**总时长：** 30 min\n**食材：** 黄油（1 茶匙）、蛋白白（1/4\
  \ 杯）、盐和胡椒（适量）、新鲜香草——欧芹、罗勒、迷迭香（各 1 茶匙）、全麦西亚塔卷饼（1 个）、青酱（1 汤）、蒙特利杰克奶士（1-2 片）、烤西红柿（1/2\
  \ 杯；烤西红柿原料——葡萄西红柿（10 盎）、特级初榨橄榄油（1 汤）、犹盐和现磨黑胡椒（适量）。\n\n**制作方法：**\n先用橄榄油炒制蛋白白。用盐和胡椒调味，然后加入上述新鲜香草。用烤面包机或烤箱烤热西亚塔卷饼。西亚塔烤好后，涂上青酱。将蛋白白放在西亚塔的下半部分，并加入奶士。加入烤西红柿和卷饼的上半部分。西红柿可以在烤箱中加入橄榄油、盐和黑胡椒烤制。上菜享用！\n\
  \n### #3 早餐库斯库小米\n\n**份量：** 4 人份\n**总时长：** 25 min\n**食材：** 低脂牛奶（3 杯）、肉桂棒（1 根）、全麦库斯小米（1\
  \ 杯）、干杏仁（1/2 杯）、干黑醋（1/2 杯）、深色红糖（6 茶匙）、盐（1/4 茶匙）、黄油（4 汤）\n\n**制作方法：**\n先将牛奶和肉桂棒一起放入锅中，用中火加热。不要煮沸牛奶，只需加热约\
  \ 3 分钟。离火后，加入以下食材：全麦库斯小米、干杏仁和干黑醋、四茶匙红糖和盐。确保盖住混合物，静静置 15 分钟。取出肉桂棒后，将混合物分装在碗中。顶部淋上融化的黄油和红糖。上菜享用！\n\
  \n### #4 菲塔奶士炒蛋\n\n**份量：** 4 人份\n**总时长：** 35 min\n**食材：** 鸡蛋（6 个）、淡酸奶油（1/4 杯）、犹盐（1/4\
  \ 茶匙）、现磨黑胡椒（适量）、蒜粉（1/4 茶匙）、罗勒（1/2 茶匙）、牛至（1/2 茶匙）、菲塔奶士（3/4 杯）、烤红椒（2 汤）、青葱（2 汤）、面粉饼（4\
  \ 个）\n\n**制作方法：**\n先将鸡蛋与酸奶油、犹盐、现磨黑胡椒、蒜粉、罗勒和牛至混合均匀。倒入锅中均匀炒匀。然后加入烤红椒和青葱。好后，将它们放在面粉饼上，撒上碎的菲塔奶士。卷起面饼，上菜享用！\n\
  \n### #5 希腊酸奶隔层\n\n**份量：** 8 人份\n**总时长：** 1 小时\n**食材：** 未煮的颗粒（1 杯）、水（12 杯）、橙花蜜（1/4\
  \ 杯）、犹盐（1/4 茶匙）、希腊酸奶（4 杯）、新鲜浆果（2 杯）\n\n**制作方法：**\n颗粒应用水浸泡一晚。早晨滤干放入加入水的锅中，确保整个混合物沸腾。然后转小火让颗粒焖煮约\
  \ 20 分钟。滤干，加入橙花蜜和盐。冷却后使用。取玻璃杯，加入第一层希腊酸奶。然后加入颗粒和浆果。重复层叠直到杯装满。上菜享用！\n\n## 第 4 章：地中海午餐食谱\n\
  \n地中海饮食因其健康食材而闻名，包括了一些令人惊叹的午餐方案。这种午餐不需要复杂的食材，但最后的味道极佳。让我们来看看一些受欢迎的午餐食谱！\n\n### #1\
  \ 柠檬罗勒虾意面\n\n**份量：** 4 人份\n**总时长：** 15 min\n**食材：** 水（3 夸脱）、意大利面（8 盎）、虾仁（1 磅）、新鲜罗勒（1/4\
  \ 杯）、刺子（3 汤）、特级初榨橄榄油（2 汤）、新鲜柠檬汁（2 汤）、盐（1/2 茶匙）、婴儿菠菜（2 杯）\n\n**制作方法：**\n先烧水。水开后加入意面，煮煮约\
  \ 8 分钟。然后将虾仁加入锅中煎约 3 分钟（此时面条应保持弹牙口感）。滤干并将混合物放入大碗中。加入新鲜罗勒、滤干的刺子、特级初榨橄榄油和柠檬汁。用婴儿菠菜作为底。将意面混合物铺在上方，上菜享用！\n\
  \n### #2 鸡肉串\n\n**份量：** 4 人份\n**总时长：** 15 min\n**食材：** 菲塔奶士（1/2 杯）、希腊酸奶（1/2 杯）、新鲜莳萝（1\
  \ 汤）、特级初榨橄榄油（1 汤）、蒜末（1 ¼茶匙）、干牛至（1/2 茶匙）、鸡胸肉（2 杯）、口袋饼（4 个）、冰生菜（1 杯）、黄瓜（1/2 杯）、小西红柿（1/2\
  \ 杯）、红洋葱（1/4 杯）\n\n**制作方法：**\n先将菲塔奶士捏碎，与希腊酸奶、莳萝、特级初榨橄榄油和蒜末混合。确保食材混合均匀。取一个锅，用橄榄油炒蒜末和牛至。加入片鸡胸肉再煎两分钟。将口袋饼对半。将煎好的鸡胸肉放入饼中，加入酸奶混合物，再放上碎生菜、黄瓜和西红柿。上菜享用！\n\
  \n### #3 地中海金鱼沙拉\n\n**份量：** 5 人份\n**总时长：** 15 min\n**食材：** 蔬菜汁（1/2 杯）、辣根芥末（4 汤）、金枪鱼（12\
  \ 盎）、烤红椒（2/3 杯）、切碎芹菜（1/2 杯）、碎欧芹（4 汤）、去核卡拉马塔橄榄（2 汤）\n\n\n\n\n首先准备沙拉的酱料。将蔬菜汁与山根芥芥末末混合并备用。充分沥干金枪鱼并放入碗中。然后，加入切好的烤红椒、西芹菜、欧芹和去核的卡拉马塔橄榄。拌匀。将酱料加入沙拉中再次混合，直到所有食材都均匀包裹。食用前冷藏。享用愉快！\n\
  \n#4 酿番茄\n\n份量：4 人份\n\n总时长：25 min.\n\n食材：番茄（2）、大蒜面包丁（1/2 杯）、碎羊奶酪（1/4 杯）、去核的卡拉马塔橄榄（1/4\
  \ 杯）、油醋（2 匙）、新鲜百荷或罗勒（2 匙）\n\n制作方法：\n\n首先预热烤箱。然后，将番茄切对半（横向切）。取出番茄果肉，保留果壳。确保将番茄果肉切碎并备用。取一个碗，混合以下食材：大蒜面包丁、碎羊奶酪、去核的卡拉马塔橄榄。将番茄果肉加入混合物中，加入油醋汁和新鲜百荷/罗勒。将番茄烤约\
  \ 5 分钟。上菜享用！\n\n#5 地中海午餐碗\n\n份量：2 人份\n\n总时长：25 min.\n\n食材：鸡胸肉（8 oz.）、新鲜迷迭香梗（2 根）、新鲜牛至梗（2\
  \ 根）、刺豆豆（1 匙）、柠檬（1 个）、形面（1/2 杯）、新鲜菠菜（3 杯）、烤红椒（1-2 个）、腌制朝鲜菊心（2-3 个）、混合味橄榄（5 个）、橄榄油（1\
  \ 匙）、盐和胡椒（适量）\n\n制作方法：\n\n首先在鸡胸肉上裹上迷迭香、牛至和柠檬汁。用中火双面煎烤约 10 分钟，直到煮熟。离火静置 10 分钟。按照包装上的说明准备形面。准备完成后，沥干形面并淋上橄榄油。然后，用盐和胡椒调味。取一个碗，放入以下食材：新鲜菠菜、形面、鸡胸肉片、烤红椒、朝鲜菊心和混合味橄榄。将橄榄油与新鲜柠檬汁以及烤红椒、朝鲜菊心和混合橄榄的天然汁混合调制酱汁。\n\
  \n## 第 5 章：地中海晚餐食谱\n\n如果你在地中海地区旅行，你会发现晚餐通常很清淡，且经常使用味道丰富的食材。本章包含了地中海晚餐食谱，让你可以在家里尝试属于自己的烹饪体验。\n\
  \n#1 地中海鸡肉意大利面\n\n份量：4 人份\n\n总时长：30 min.\n\n食材：螺旋面（2 又半 杯）、油（1 匙）、鸡肉肠（3 根）、冷冻甜豌豆（1\
  \ 又 1/4 杯）、罗勒青酱（3/4 杯）、意式混合奶酪丝丝（1 杯）、番茄（1 个）\n\n制作方法：\n\n首先按照包装上的说明煮面条。煮好后，沥干并用冷水冲洗。将鸡肉肠切成薄片并煎，直到变成诱人的金黄色。加入面条、冷冻甜豌豆和青酱。再煮\
  \ 5 分钟，期间经常搅拌。在顶部撒上意式混合奶酪丝和碎番茄。再煮 3 分钟，直到奶酪完美融化。上菜享用！\n\n#2 叠层希腊沙拉\n\n份量：8 人份\n\n\
  总时长：25 min.\n\n食材：酱料 - 冷冻菠菜（9 oz.）、希腊酸奶（5.3 oz.）、脱脂牛奶（2/3 杯）、蛋黄酱（1/4 杯）、柠檬胡椒粉（1\
  \ 匙）、干莳勒（3/4 匙）；沙拉 - 沙拉蔬菜（8 杯）、鸡胸肉（2 杯）、樱桃番茄（1 磅）、黄瓜（1 个）、红洋葱（1/2 个）、碎菲塔奶（3/4 杯）、去核的卡拉马塔橄榄（1/4\
  \ 杯）\n\n制作方法：\n\n首先按照包装上的说明煮好菠菜。用冷水冲洗并充分沥干，然后放入食物处理器中，加入制作酱料的其他食材（希腊酸奶、脱脂牛奶、蛋黄酱、柠檬胡椒粉、干莳勒）一起搅拌。搅拌至光滑酱料后备用。取一个大沙拉碗，放入第一层沙拉蔬菜。然后铺上第二鸡肉块，接着是番茄和黄瓜。重复分层，直到所有食材用完，最后用洋葱、黄瓜和剩下的沙拉蔬菜装饰。将酱料淋在沙拉上。然后，加入碎菲塔奶、卡拉马塔橄榄和剩下的洋葱。上菜享用！\n\
  \n#3 薄荷黄瓜酱火肉汉堡\n\n份量：5 人份\n\n总时长：50 min.（准备 20 min，烹饪 30 min）\n\n食材：黄瓜酱 - 原味酸奶（1/2\
  \ 杯）、黄瓜（1/2 杯）、新鲜薄荷（2 匙）、柠檬汁（1 匙）；汉堡 - 冷冻碎菠菜（9 oz.）、火鸡肉（1 又 1/4 磅）、原味酸奶（1/4 杯）、干牛至（1\
  \ 匙）、大蒜盐（1/2 匙）、胡椒（1/4 匙）、番茄（1 个）、皮塔饼（5 个）\n\n制作方法：\n\n首先混合黄瓜酱的食材。完成后冷藏。按照包装上的说明煮好菠菜。完成后，挤出多余的水分。取另一个碗，将菠菜与火鸡肉、酸奶、牛至、大蒜盐和胡椒混合。然后，将混合物做成汉堡饼。煎烤汉堡饼直到其变成诱人的金黄色。将皮塔饼切半，在上面放番茄。加入黄瓜酱即可享用！\n\
  \n#4 烤红薯猪里脊\n\n份量：3 人份\n\n总时长：50 min.（准备 15 min，烹饪 35 min）\n\n食材：蔬菜 - 橄榄油（1 匙）、意式调料（1\
  \ 匙）、盐（1/4 匙）、大蒜（1 瓣）、红薯（2 个）、洋葱（1 个）；肉 - 猪里脊（1 磅）、橄榄油（1/2 匙）、意式调料（1 匙）、调味盐（1/4\
  \ 匙）、帕玛奶酪（1 匙）、新鲜欧芹（1 匙）\n\n制作方法：\n\n首先预热烤箱至 425ºF。然后，将橄榄油与意式调料、盐和大蒜混合。将红薯切成块，洋洋碎。将红薯和洋葱与油混合。放入烤箱烤约\
  \ 10 分钟。在猪里脊刷半匙橄榄油。取一个小碗，混合意式调料、调味盐和帕玛奶酪。在猪里脊裹上混合物，放入烤箱烤 20 分钟。完成后，切片并配红薯和洋葱食用。撒上欧芹装饰，即可！\n\
  \n#5 菠菜帕玛奶酪派\n\n份量：6 人份\n\n总时长：58 min.（准备 15 min，烹饪 43 min）\n\n食材：黄油（1 匙）、青葱（4 根）、大蒜（2\
  \ 瓣）、冷冻碎菠菜（10 oz.）、奶渣（1/2 杯）、面粉（1/2 杯）、牛奶（1 杯）、柠檬汁（1 匙）、胡椒（1/4 匙）、鸡蛋（3 个）、帕玛奶酪（3\
  \ 匙）、肉豆蔻（1/4 匙）\n\n制作方法：\n\n首先预热烤箱至 350ºF。切碎青葱和大蒜，在平锅中用黄油中火翻炒。然后，加入菠菜并将混合物铺在派盘中。加入奶渣。在另一个碗中，加入以下食材：面粉、牛奶、柠檬汁、胡椒和鸡蛋。将混合物加入派盘中。然后，再撒上一些帕玛奶酪和肉豆蔻。烤约\
  \ 35 分钟。食用前冷却。撒上切片的青葱装饰，上菜享用！\n\n\n\n原料：细砂糖（1 杯）、黄油（1/2 kg）、去皮杏仁（1 kg）、面粉（700 g）、蛋黄（1\
  \ 个）、白兰（1/2 杯）、小苏打（1 tsp）；你还需要少量黄油涂抹锅以及一些细砂糖用于撒在饼干上\n\n制作方法：\n\n首先将烤箱预热至 180ºC。然后，将融化的黄油与细砂糖、蛋黄、面粉、小苏打、去皮杏仁和白兰混合。面糊准备好后，揉小球，并在中心压出一个凹槽。在锅上涂油，烘烤饼干直到它们变成诱人的金黄色。烤好后，在上面撒上细砂糖。冷却后再撒上第二层细砂糖。上桌享用吧！\n\
  \n# 2 南瓜希腊酸奶层\n\n制作份：6 人份\n总耗时：10 人份\n\n原料：南瓜泥（15 oz.）、低脂希腊酸奶（1 和¼杯）、马斯卡彭乳士（3-4\
  \ 汤匙）、香草提取物（1 tsp.）、糖蜜（2 汤匙）、红糖（2 和½汤匙）、肉桂粉（2 tsp.）、肉豆蔻（1 小撮）、巧克力碎（装饰）、碎榛果/核桃（装饰）\n\
  \n制作方法：\n\n首先在大碗中将南瓜泥与以下原料混合：希腊酸奶、马斯卡彭乳士、香草提取物、糖蜜、红糖、肉桂粉和肉豆蔻。充分混合直到口感光滑。将混合物冷一段时间。然后，将混合物放入单独的分层杯中。顶部淋上糖蜜、巧克力碎和碎榛果或核桃。上桌享用吧！\n\
  \n# 3 樱桃挞\n\n制作份：6-8 人份\n总耗时：1 小时 20 分钟。\n\n原料：普通面粉（8 oz.）、盐（1 小撮）、糖粉（2 tsp.）、玉米粉（1\
  \ oz.）、猪油（4 oz.）、人油（2 oz.）、蛋黄（1 个）、冷水（2 汤匙）\n\n制作方法：\n\n首先将烤箱预热至 400ºF。取一个碗，将普通面粉与盐、玉米粉和糖粉混合。将猪油和人油混合，加入上述混合物中。然后，向混合物加入蛋黄和冷水形成面团。将面团擀开并放在预先涂好油的派盘中。烘烤\
  \ 15 分钟，然后从烤箱取出。将樱桃摆放在派壳中。将糖、鸡蛋、杏仁和杏仁精华混合，涂在樱桃上。再烘烤一小时或直到变成金黄色。上桌享用吧！\n\n# 4 橙子香料水果汤\n\
  \n制作份：6 人份\n总耗时：45 分钟。（需额外 6 小时冷却时间）\n\n原料：新鲜迷迭香（1 枝）、橙皮（适量）、整粒黑胡椒（1 tsp.）、橙汁（3\
  \ 杯）、干杏仁（2 杯）、干酸樱桃（3/4 杯）、金黄葡萄干（3/4 杯）、干白葡萄酒（3/4 杯）、糖（3/4 杯）\n\n制作方法：\n\n首先用浸湿的奶酪布整理香料包。收集制作此包所需的迷迭香、橙皮和黑胡椒。取一个大锅，加入剩余原料。等待整个混合物沸腾。然后，开火让其慢煮约三十五分钟。食用前待冷却。取出香料包，上桌享用吧！\n\
  \n# 5 南瓜派\n\n制作份：6 人份\n总耗时：1 小时（30 分钟准备，30 分钟烹饪）\n\n原料：南瓜泥（15 oz.）、白糖（3/4 杯）、葡萄干（1\
  \ 杯）、细粗麦粉（1 杯.）、肉桂粉（1/2 tsp.）、丁香粉（1/4 tsp.）、肉豆蔻粉（1/8.）、冷冻酥皮（2 片）、鸡蛋（1 个）\n\n制作方法：\n\
  \n首先将烤箱预热至 350ºF。然后涂抹烤盘油。将南瓜泥放入煎锅中加热。一旦变浓稠，就可以加入以下原料：白糖、葡萄干、粗麦粉、肉桂粉、丁香粉和肉豆蔻。将原料充分混合并离火。取一片酥皮放在预先涂好油的烤盘上。然后铺上南瓜混合物，使其覆盖整个表面。将另一片酥皮盖在混合物上。然后，打一个鸡蛋刷在表面，这将确保它在烤箱中呈现诱人的金黄色。烘烤约三十到四十分钟。食用前待冷却。享用吧！\n\
