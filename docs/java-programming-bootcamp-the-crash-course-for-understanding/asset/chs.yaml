  \n## 巧克力、杏仁和菠菜奶昔\n\n### 配料：\n- 1 汤加糖或无糖可可粉\n- 1.5 杯杏仁奶\n- 一小把菠菠菜\n- 2 颗葡萄\n- 2 颗草莓\n\
