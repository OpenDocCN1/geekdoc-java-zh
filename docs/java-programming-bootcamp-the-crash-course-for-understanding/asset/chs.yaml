  ```\nMonty Python and the Holy Grail\n```\n\n### 脚本模式编程\n\n如果你带有脚本参数调用解释器，脚本将开始执行并持续运行直到完成。完成后，解释器将不再处于活动状态。考虑以下示例。示例程序写在脚本中，并带有\
