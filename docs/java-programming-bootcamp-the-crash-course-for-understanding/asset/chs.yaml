  \ 将禁用自动完成。\n\n#### 如何禁用自动完成\n\n在某些情况下，自动完成可能会让你困惑（或困扰）。如果你不喜欢看到这些建议，你需要这样做：\n\n\
  *   访问 `文件` 功能带并点击 `选项`\n*   转到 `高级`\n*   取消勾选 `启用单元格自动完成`\n\n#### 如何编辑单元格\n\n在\
  \ Excel 中，你有多种选项可以更改或删除数据。这些选项包括：\n\n输入覆盖高亮输入\n\n此功能适用于所有 Office 程序。它确保你输入的字符会替换高亮输入。例如，如果你高亮了“Apple”并输入了“Banana”，第一个输入将被替换。\n\
  \n此功能非常有用，特别是当你对存储的数据进行快速/简单的更改时。使用此功能需要执行的操作：\n\n1.  使用鼠标或方向键高亮正确的单元格\n2.  输入新数据（一旦开始打字，之前的输入将消失）\n\
  3.  按下 `Enter` 完成过程\n\n编辑模式\n\n有时不需要覆盖整个单词。例如，你只需要从输入中添加或删除字符。Excel 通过“编辑模式”解决这个问题——这种模式允许你快速编辑数据。你可以通过以下方法激活此模式：\n\
  \n*   在单元格内编辑：\n    1.  双击需要编辑的单元格。\n    2.  使用方向键将光标置于正确位置。\n    3.  进行必要的更改并按下\
