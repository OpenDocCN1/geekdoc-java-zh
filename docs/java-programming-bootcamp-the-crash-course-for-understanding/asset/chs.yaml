  \n### 第一章：C# - 基础信息\n\nC# 是一种高级、多功能且面向对象的编程语言。微软作为当今最大的公司之一，在其产品系列中开发了这种编程语言。为了证明\
  \ C# 是实用且可靠的，ISO（国际标准组织）和 ECMA（欧洲计算机制造商协会）已经批准了这种计算机语言。\n\n\n\n\n\n根据微软的说法，这种 C#\
  \ 语言是为 `CLI`（即通用语言体系）设计的。`CLI` 由运行时环境和可执行代码组成，允许在各种计算机架构和平台上使用高级编程语言。\n\n以下是专业程序员使用\
  \ C# 的主要原因：\n\n* C# 是一种面向对象的语言。\n* C# 简单且易于学习。\n* C# 是一种面向组件的语言。\n* C# 是一种结构化编程语言。\n\
  * C# 是高级且多功能的语言。\n* C# 可以生成出色的程序。\n* C# 允许用户使用不同的计算机系统进行编译。\n\n# C# 最强大的特性\n\nC#\
  \ 与旧的编程语言（如 `C`、`C++` 和 `Java`）具有一些相似之处。它拥有吸引全球百万程序员的优秀特性。在本节中，让我们讨论 C# 的最佳特性。请查看下面的列表：\n\
  \n* 索引器\n* 程序集版本控制\n* 布尔条件\n* 条件编译\n* Windows 集成集成\n* 属性和事件\n* 简单多线程\n\n# C# 环境\n\
  \n本节将讨论 C# 的要求。如你所知，C# 是 `.Net` 框架的一部分。因此，在学习用这种语言可以做什么之前，你应该熟悉 `.Net`。\n\n## 什么是\
  \ .Net？\n\n这个框架是一个创新程序，允许用户编写各种应用程序。这些应用程序包括：\n\n* Web 服务\n* Web 应用程序\n* Windows\
  \ 应用程序\n\n为 `.Net` 设计的程序也可以在平台上运行。基本上，该框架兼容以下编程语言：\n\n* `C++`\n* C#\n* `Jscript`\n\
  * `COBOL`\n* `Visual Basic`\n\n.Net 由大量的代码集合组成。以下是你会遇到的一些代码：\n\n* `LINQ`\n* `ADO.NET`\n\
  * Windows Forms\n* `ASP.Net`\n* 通用类型系统\n\n# C# 的集成开发环境\n\n微软为 C# 程序员提供了各种工具（例如 Visual\
  \ Web Developer）。你可以直接访问微软官网获取免费的编程工具。这意味着你不需要花费任何钱就可以创建许多计算机程序。如果你愿意，可以使用 `Notepad`（或其他文本编辑器）为你的应用程序创建源代码。然后，使用\
  \ `.Net` 内置编译器将代码编译成程序集。\n\n## 如何使用 Mac 或 Linux 系统编写 C# 程序\n\n确实，这个框架是为 Windows\
  \ 计算机创建的。但是即使你使用其他系统（例如 Mac 或 Linux），仍然可以运行 `.NET` 框架。例如，你可以使用名为“Mono”的 .Net 变体。该变体预装了\
  \ C# 编译器，并兼容不同的操作系统。\n\n# 第二章：C# 程序的 Basic 结构\n\n本章将教你 C# 程序的 Basic 结构。这些信息可以帮助你实现目标（即在\
  \ 2 周内掌握 C# 基础）。\n\n## 编写你的第一个程序\n\nC# 程序由这些部分组成：\n\n* 类\n* 注释\n* 表达式和语句\n* 命名空间声明\n\
  * 类属性\n* Main 方法\n\n分析下面的截图。这是一段简单的代码，用于打印这段短语：“Hello World”\n\n![](img/image01694.jpeg)\n\
  \n一旦你编译并执行了上述代码，你将得到这条语句：\n\n![](img/image01695.jpeg)\n\n现在，让我们分析这段简单代码的组成：\n\n\
  * `using System;` - “using”是一个可以将命名空间与程序连接的关键字。通常情况下，一个程序包含许多 `using` 语句。在这种情况下，`using`\
  \ 被用于将 `System`（即一个命名空间）附加到程序上。\n* `namespace` – 这是代码的第二行。基本上，一个命名空间是一组不同的类。在上面的示例中，`HelloWorldApplication`（一个命名空间）包含\
  \ `HelloWorld`（一个类）。\n* `class` – 这一行被称为“类声明”。它表示 `HelloWorld` 持有程序所需的信息。通常情况下，类持有各种方法。但在这种情况下，该类包含单一方法（即“Main”）。\
  \ \n* `Main` – 该方法作为所有 C# 代码的入口点。`Main` 指定了它所所属类的功能。\n* `/*…*/` - C# 编译器忽略这一行。如果你想在程序中添加一些注释，就应该使用它。\n\
  * `Console.WriteLine(“Hello World”);` - `Main` 使用这条语句来指定类的行为。\n    * `WriteLine`\
  \ - 该方法属于名为 `Console` 的类。`WriteLine` 让你的屏幕显示代码的消息（即 Hello, World）。\n* `Console.ReadKey();`\
  \ – 这一行是为 VS.NET（即 Visual Studio .NET）的用户设计的。如果你使用 VS.NET 启动程序，`Console.ReadKey()`\
  \ 会阻止屏幕关闭。\n\n这里是你应该记住的四点：\n\n* 你不必使用类名作为程序的文件名。\n* 程序的执行从 `Main` 开始。\n* 每个语句和表达式都必须使用分号结束。\n\
  * C# 编程语言是区分大小写的。\n\n## 如何编译和执行 C# 程序\n\n### 使用 Visual Studio .NET\n\n如果你使用 VS.NET，你需要采取的步骤如下：\n\
  \n1. 访问 Visual Studio。\n2. 转到菜单栏并选择“File（文件）”。然后点击“New（新建）”。\n3. 屏幕显示多个模板。寻找“C#”并选择\
  \ Windows。\n4. 选择 Console Application。\n5. 为项目命名并点击 OK。\n6. 在代码编辑器中输入代码。\n7. 按 F5\
  \ 运行程序。\n\n### 使用命令行\n\n你也可以使用命令行来编译 C# 程序。这里是你需要做的：\n\n1. 访问你喜欢的文本编辑器。\n2. 输入上述代码。\n\
  3. 将文件保存到任何目录并命名为 `hw.cs`。\n4. 访问计算机命令提示符并指定你选择的目录。\n5. 输入 `csc hw.cs` 编译代码。\n6.\
  \ 如果你输入正确，你会看到一个可执行文件 `hw.exe`。\n7. 输入 `hw` 运行程序。\n\n# 第三章：基础语法\n\n本章将讨论 C# 中使用的语法。仔细学习这些材料可以帮助你在\
  \ 2 周内掌握这种语言。\n\n## C# - 面向对象的语言\n\n正如第一章提到的，C# 是面向对象的。这意味着每个程序由可以相互通信的对象组成。对象可以执行操作（称为方法）。\n\
  \n为了帮助你理解这个概念，让我们分析一个简单的对象：矩形。下面的截图显示了 `Rectangle` 类的代码。让我们在学习 C# 基本语法的同时分析这段代码：\n\
  \n![](img/image01696.jpeg)\n\n![](img/image01697.jpeg)\n\n现在，让我们逐一讨论这段代码的各个：\n\n\
  * `using` – 所有 C# 代码都以这一行开始。“using”是一个可以将命名空间与 C# 程序连接的关键字。再次，一个程序可以包含多个 `using`\
  \ 行。这意味着你可以在每个程序中包含多个命名空间。\n* `class` – 你应该使用这个关键字来声明类。\n* 注释 – 你应该使用这部分来解释你的代码。通常情况下，C#\
  \ 编译器忽略这一部分。确保你的多行注释以 `/*` 开始并以 `*/` 结束。查看下面的示例：\n\n![](img/image01699.jpeg)\n\n\
  另一方面，对于单行注释使用两个斜杠（即 `//`）。查看下面的示例：\n\n![](img/image01700.jpeg)\n* 成员变量 – 这些是类的数据成员或属性。你应该使用变量来存储数据。对于当前的示例，名为\
  \ `Rectangle` 的类有 2 个成员变量：`width` 和 `length`。\n\n\n\n\n\n*   `member functions`（成员函数）——函数是执行特定任务的命令集合。通常情况下，你应该在类内部声明类的函数。在上面提供的程序中，`Rectangle`\
  \ 拥有 3 个成员函数：`Display`、`GetArea` 和 `AcceptDetails`。\n\n# C# 标识符\n\n标识符（Identifiers）是用于确定类、函数、变量或程序员定义的任何项的名称。在\
  \ C# 语言中命名类时，你必须遵循以下规则：\n\n*   每个名称应以字母开头。你可以使用字母、数字和下划线来继续命名。你不能用数字作为标识符的开头。\n\
  *   你选择的名称不能包含空格或特殊符号（例如 `?`、`+`、`%` 和 `*`）。但是，如前一条规则所述，在命名标识符时可以使用下划线。\n*   你不能使用任何\
  \ C# 关键字作为标识符的名称。\n\n## C# 语言的关键字\n\n基本上，关键字（keyword）是指在 C# 语言中具有预定义功能的保留词。你不能在命名标识符时使用关键字。然而，如果你真的想这样做，可以在关键字的开头添加\
  \ `@` 符号。\n\n在这个编程语言中，某些标识符（例如 `set`、`get` 等）具有特殊含义。程序员将这些标识符称为“上下文关键字”（contextual\
  \ keywords）。\n\n你将看到下面的两个表格。这些表格将向你展示 C# 语言中的上下文关键字和保留关键字。\n\n### 上文关键字\n\n| `set`\
  \ | `get` | `let` | `add` | `group` | `alias` | `from` |\n| :--- | :--- | :--- |\
  \ :--- | :--- | :--- | :--- |\n| `select` | `partial (method` | `global` | `partial\
  \ (type)` | `dynamic` | `orderby` | `descending` |\n| `ascending` | `into` | `remove`\
  \ | `join` | | | |\n\n### 保留关键字\n\n| `as` | `if` | `is` | `In` | `do` | `try` |\
  \ `int` |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| `new` | `for` |\
  \ `out` | `ref` | `goto` | `this` | `else` |\n| `void` | `true` | `lock` | `char`\
  \ | `byte` | `base` | `case` |\n| `bool` | `long` | `null` | `uint` | `using` |\
  \ `sbyte` | `catch` |\n| `const` | `break` | `short` | `throw` | `ulong` | `while`\
  \ | `event` |\n| `class` | `float` | `false` | `fixed` | `decimal` | `abstract`\
  \ | `checked` |\n| `continue` | `delegate` | `explicit` | `internal` | `double`\
  \ | `default` | `finally` |\n| `in (as a generic modifier)` | `readonly` | `return`\
  \ | `sealed` | `interface` | `implicit` | `static` |\n| `virtual` | `switch` | `sizeof`\
  \ | `namespace` | `params` | `foreach` | `protected` |\n| `stackalloc` | `string`\
  \ | `override` | `operator` | `unchecked` | `volatile` | `private` |\n| `object`\
  \ | `public` | `unsafe` | `extern` | `enum` | `typeof` | `ushort` |\n| `out (as\
  \ a generic modifier)` | `struct` | | | | | |\n\n# 第 4 章：C# 中的不同数据类型\n\n本章将讨论你在\
  \ C# 中会遇到的各种数据类型。请仔细学习本章。作为一个程序员，你将在代码和语句处理不同类型的数据。这意味着你应该对这些数据类型了如。\n\n在 C# 语言中，变量分为五类。让我们详细讨论每个类型：\n\
  \n## 值类型 (Value Type)\n\n你可以直接给这种变量赋值。如果你需要使用它们，只需访问名为 `System.ValueType` 的类。这些变量在内部存储数据。这意味着它们不涉及第三方工具或机制。下面的列表将向你展示\
  \ C# 中可值类型：\n\n*   `Int`\n*   `long`\n*   `char`\n*   `bool`\n*   `sbyte`\n*   `double`\n\
  *   `decimal`\n*   `byte`\n*   `float`\n*   `ushort`\n*   `uint`\n*   `short`\n\
  *   `ulong`\n\n## 属于这种类型的变量不直接存储数据。相反，它们指向存储数据的变量。这意味着如果你想指向文件目录或内存位置，就应该使用这种类型。\n\
  \n## 对象类型 (Object Type)\n\nC# 用户认为此类是该语言中所有数据的核心类。“Object” 是 C# 中名为 `System.Object`\
  \ 的类的别名。你可以使用 `object` 类型来存储其他类型的数据。然而，在赋值之前，你必须执行类型转换。\n\n将值转换为对象的过程被称为装箱（boxing）。相反，将对象转换为值被称为拆箱（unboxing）。\n\
  \n## 动态类型 (Dynamic Type)\n\n这种变量允许你存储任何值。使用动态变量时，类型检查在运行时进行。以下是你声明时需要使用的语法：\n\n\n\
  \n\n\n“字面量”（literals）一术指的是固定或不可更改的值：在程序执行期间，你无法更改这些值。字面量也被称为常量。字面量可以任何基本数据类型的形式存在（例如：浮点数常量、整数常量、字符串常量、字符常量等）。此外，你还可以在\
  \ C# 语句中使用枚举常量字面量。\n\n# 整数常量\n\n整数常量可以是八进制、十进制或十六进制字面量。你应该使用前缀来指定基数（也称为进制）。请检查此列表：\n\
  \n*   使用 `0` 表示八进制字面量\n*   使用 `oX` 或 `ox` 表示十六进制字面量\n*   十进制字面量不需要前缀\n\n整数字面量还可以有\
  \ `L` 和 `U` 后缀。`L` 用于长整数（long），而 `U` 用于无符号整数（unsigned）。这些后缀不区分大小写。\n\n下面的列表将向你展示有效和无效的整数常量：\n\
  \n*   `131`– 有效\n*   `312u`– 有效\n*   `0XYoU`– 有效\n*   `218`– 无效：数字 `8` 不是八进制。\n\
  *   `123UU`– 无效：你不能重复后缀。\n\n这里是第二个示例列表。不过，这个列表将展示不同类型的整数常量：\n\n*   `0123`– 八进制\n\
  *   `86`– 十进制\n*   `0x5b`– 十六进制\n*   `20`– int\n*   `20u`– 无符号整数\n*   `20l`– 长整数\n\
  *   `20ul`– 长无符号整数\n\n# 浮点常量\n\n浮点常量可能包含以下部分：\n\n1.  一个小数点\n2.  一个指数\n3.  一个整数\n\
  4.  一个分数\n\n以下是浮点常量的有效和无效示例：\n\n*   `3.14`– 有效\n*   `314-5L`– 有效\n*   `310E`– 无效：指数不完整。\n\
  *   `310f`– 无效：该常量没有指数或小数点。\n*   `.e44`– 无效–此常量缺少分数或整数。\n\n在使用小数时，你应该包含指数、小数点或两者都包含。然而，当你使用指数数字时，你应该包含分数、整数或两者都包含。你应该使用“E”或“e”引入带符号的指数。\n\
  \n# 字符常量\n\n你应该将字符常量放在单引号内。例如，你可以将‘a’存储在普通的 `char` 类型变量中。通常情况下，字符常量可以以简单字符（例如‘b’）、通用字符（例如‘\\\
  u03B0’）或转义序列（例如‘\\t’）的形式存在。\n\n在 C# 语言中，某些字符由反斜杠引入将获得特殊含义。由于它们具有特殊含义，你可以将它们用于某些功能，如制表符（\\\
  t`）或换行符（\\n`）。下面的列表将向你展示一些转义序列及其含义：\n\n*   `\\'` – 代表单引号字符。\n*   `\\\"` – 代表双引号字符。\n\
  *   `\\\\` - 代表反斜杠字符。\n*   `\\?`– 代表问号。\n*   `\\a`– 代表蜂鸣或警报。\n*   `\\b`– 代表退格符。\n\
  *   `\\n`– 代表换行符。\n*   `\\f`– 代表分页符。\n*   `\\t`– 代表水平制表符。\n*   `\\r`– 代表回车符。\n*\
  \   `\\ooo`– 代表具有 1-3 位数字的八进制。\n*   `\\v`– 代表垂直制表符。\n*   `\\xhh…` - 代表具有一个或多个数字的十六进制。\n\
  \n# 字符串常量\n\n你应该使用双引号（即““” 或 @\"\"）来包裹字符串常量。通常，字符串常量与字符常量相似：它们包含转义序列、通用字符和普通字符。\n\
  \n你可以使用字符串字面量将长行拆分为较短行。然后，你可以使用空格分隔这些短行。下面的列表将向你展示一些字符串常量：\n\n*   `“hi, girl”`\n\
  *   `“hi, \\ girl”`\n*   `“hi,” “g” “irl”`\n*   `@“hi girl”`\n\n重要提示：上述给字符串常量是完全相同的。它们将产生相同的结果：hi\
  \ girl\n\n# 如何定义字面量\n\n你可以使用 `const`（即 C# 关键字）来定义常量。在定义常量时，你应该使用以下语法：\n\n![](img/image01707.jpeg)\n\
  \n# 第 7 章：C# 中的运算符\n\n运算符决定了如何执行逻辑或数学操作。基本上，运算符是用于与 C# 编译器通信的符号。这种编程语言拥有一个强大的预装运算符集合。这些运算符分为六类，即：\n\
  \n*   关系运算符\n*   赋值运算符\n*   算术运算符\n*   位运算符\n*   逻辑运算符\n*   其他运算符\n\n让我们详细讨论每一类：\n\
  \n## 关系运算符\n\n下表将向你展示 C# 语言中可用的关系运算符。让我们使用两个变量：`X = 2`；`Y = 4`。\n\n*   `==`– 此运算符测试相等性。如果相等，则返回真值。\n\
  *   `>`– 此运算符检查操作数大小。如果大于，则返回真值。\n*   `<`– 此运算符检查操作数大小。如果小于，则返回真值。\n*   `!=`– 此运算符测试是否不相等。如果不相等，则返回真值。\n\
  *   `<=`– 此运算符检查操作数大小。如果小于或相等，则返回真值。\n*   `>=`– 此运算符检查操作数大小。如果大于或相等，则返回真值。\n\n##\
  \ 赋值运算符\n\n下面的列表显示了赋值运算符：\n\n*   `=`– 赋值运算符可以将右操作数的值复制给左侧。例如：`Z = X`。\n*   `+=`–\
  \ 此运算符称为“加”。它可以将右操作数的值加到左操作数上，并将结果赋值给左侧。例如：`Z += X`。\n*   `-=`– 此运算符称为“减”。它可以从左操作数中减去右操作数的值，并将结果赋值给左侧。例如：`Z\
  \ -= X`。\n*   `*=`– 此运算符称为“乘”。它可以将左操作数与右操作数相乘，并将结果赋值给左侧。例如：`Z *= X`。\n*   `/=`–\
  \ 此运算符称为“除”。它可以用左操作数除以右操作数，并将结果赋值给左侧。例如：`Z /= X`。\n*   `%=`– 此运算符称为“取模”。它使用两个操作数取模，并将结果赋值给左侧。例如：`Z\
  \ %= X`。\n*   `<<=`– 此运算符称为“左移”。它根据右侧指定的位数将左操作数的值向左移动，然后将结果赋值给左侧。例如：`Z <<= 3`。\n\
  *   `>>=`– 此运算符称为“右移”。它根据右侧指定的位数将左操作数的值向右移动。检查此示例：`(X >>= 3)` 等于 `(X = X >> 3)`。\n\
  \n# 算术运算符\n\n列表显示了 C# 语言中可用的算术运算符。为了帮助理解每个运算符，我们使用变量 X = 2 和 Y = 4。\n\n*   `+`–\
  \ 此运算符相加操作数（例如 X + Y = 6）。\n*   `-`– 此运算符从第一个变量中减去第二个变量的值（例如 Y– X = 2）。\n*   `*`–\
  \ 此运算符将操作数相乘（例如 X * Y = 8）。\n*   `/`– 此运算符使用分母除以分子（例如 Y/X = 2）。\n\n\n\n\n\n*   `++`\
  \ – 这被称为递增运算符。它将变量的值增加 1（例如 `X++ = 3`）。\n*   `--` – 这被称为递减运算符。它将变量的值减少 1（例如 `Y--\
  \ = 3`）。\n\n## 位运算符\n\n你可以使用位运算符来对位（bits）进行操作。通过这一类运算符，你将能够执行逐位操作。下图包含了 `^`、`|`\
  \ 和 `&` 的真值表。\n\n![](img/image01708.jpeg)\n\n对于接下来的示例，假设 `X` 为 60，`Y` 为 13。让我们它们转换为二进制元素：\n\
  \n`X = 0011 1100`\n`Y = 0000 1101`\n\n现在，让我们对这些变量进行位操作：\n\n`X|Y = 0011 1101`\n`X&Y\
  \ = 0000 1100`\n`~X = 1100 0011`\n`X^Y = 0011 0001`\n\n下面的列表显示了 C# 语言中可位运算符。让我们使用相同的值：`X\
  \ = 60`；`Y = 13`。\n\n*   `&` – 此二进制运算符被称为“与”（AND）。如果两个操作数具有相同的位，则该位将被复制到结果中。例如：`(X\
  \ & Y) = 12`，即 `0000 1100`。\n*   `|` – 此运算符被称为“或”（OR）。它会复制一个操作数中存在的位。例如：`(X | Y)\
  \ = 61`，即 `0011 1101`。\n*   `^` – 此二进制运算符被称为异或（XOR）。它复制仅存在于一个操作数中的位。因此，异或不会复制两个操作数中都存在的位。这是一个示例：`(X\
  \ ^ Y) = 49`，即 `0011 0001`。\n*   `~` – 这是一个一元运算符。在 C# 编程语言中使用时，它会“翻转”位。这是一个示例：`(~X)\
  \ = 61`，即 `1100 0011`。\n*   `>>` – 这被称为“右移运算符”。它根据右操作数指示的位，将左操作数的值向右移动。这是一个示例：`X\
  \ >> 2 = 15`，即 `0000 1111`。\n*   `<<` – 这被称为左移运算符。它根据右操作数指示的位，将左操作数的值向左移动。例如：`X\
  \ << 2 = 15`，即 `1111 0000`。\n\n## 逻辑运算符\n\n下面的列表将向你展示 C# 中的逻辑运算符。让我们给 `X` 和 `Y`\
  \ 分配布尔值。`X` 拥有“TRUE”，而 `Y` 拥有“False”。\n\n*   `||` – 此运算符被称为“逻辑或”。如果其中一个操作数不等于零，则条件为真。例如：`(X\
  \ || Y)` 为真。\n*   `&&` – 此运算符被称为“逻辑与”。如果所有操作数都不等于零，则条件为真。例如：`(X %% Y)` 为假。\n*  \
  \ `!` – 此运算符被称为“逻辑非”。你应该使用它来反转操作数的状态。如果条件为真，此运算符将变为假。`!(X || Y)` 为假。\n\n## 杂项运算符\n\
  \nC# 编程语言支持其他运算符。以下是重要的运算符：\n\n*   `sizeof()` – 此运算符可以识别任何数据类型的大小。例如，`sizeof(int)`\
  \ 可以给你 4。\n*   `typeof()` – 此运算符可以识别任何类的类型。例如：`typeof(StreamReader)`。\n*   `&` –\
  \ 你可以使用此运算符确定任何变量的地址。例如，`&x` 将给你名为“x”的变量地址。\n*   `*` – 你可以使用此运算符创建指向任何变量的指针。例如：你可以使用\
  \ `*x` 创建一个指针，将其命名为“x”，并将其赋值给任何变量。\n*   `?:` – 此运算符被称为“条件表达式”。它根据条件为任何变量赋值。例如：如果其条件为真，它可能会将\
  \ `X` 的值赋给变量。然而，如果条件为假，它将赋予 `Y` 的值。\n*   `is` – 你可以使用此运算符来确定对象是否属于特定类型。这里有一个示例：`If(\
  \ Gucci is Bag)` // 将检查名为 `Gucci` 的对象是否属于名为 `Bag` 的类。\n\n## 第 8 章：C# 中的循环\n\n在某些情况下，你必须执行多次代码块。然而，重复地输入相同的语句是无聊且耗时的。这意味着你应该找到一种快速简单地重复代码块的方法。如果你不知道如何实现这一点，本章将对你有很大帮助。\n\
  \n**重要提示**：语句通常按顺序执行。这意味着首先执行第一个语句，然后是下一个等。你在阅读本章时应该记住这个概念。与其他编程语言一样，C# 在执行方面提供了不同的控制结构。\n\
  \n### While 循环\n\n下面的列表将向你展示 C# 中的逻辑运算符。让我们给 `X` 和 `Y` 分配布尔值。`X` 拥有“TRUE”，而 `Y`\
  \ 拥有“False”。\n\n*   `||` – 此运算符被称为“逻辑或”。如果其中一个操作数不等于零，则条件为真。例如：`(X || Y)` 为真。\n\
  *   `&&` – 此运算符被称为“逻辑与”。如果所有操作数都不等于零，则条件为真。例如：`(X %% Y)` 为假。\n*   `!` – 此运算符被称为“逻辑非”。你应该使用它来反转操作数的状态。如果条件为真，此运算符将变为假。`!(X\
  \ || Y)` 为假。\n\n### For 运算符\n\nC# 编程语言支持其他运算符。以下是重要的运算符：\n\n*   `sizeof()` – 此运算符可以识别任何数据类型的大小。例如，`sizeof(int)`\
  \ 可以给你 4。\n*   `typeof()` – 此运算符可以识别任何类的类型。例如：`typeof(StreamReader)`。\n*   `&` –\
  \ 你可以使用此运算符确定任何变量的地址。例如，`&x` 将给你名为“x”的变量地址。\n*   `*` – 你可以使用此运算符创建指向任何变量的指针。例如：你可以使用\
  \ `*x` 创建一个指针，将其命名为“x”，并将其赋值给任何变量。\n*   `?:` – 此运算符被称为“条件表达式”。它根据条件为任何变量赋值。例如：如果其条件为真，它可能会将\
  \ `X` 的值赋给变量。然而，如果条件为假，它将赋予 `Y` 的值。\n*   `is` – 你可以使用此运算符来确定对象是否属于特定类型。这里有一个示例：`If(\
  \ Gucci is Bag)` // 将检查名为 `Gucci` 的对象是否属于名为 `Bag` 的类。\n\n### 嵌套循环\n\nC# 编程语言允许你在循环内部放置循环。这意味着你可以在程序中组合不同类型的循环。你必须使用的语法取决于你想要作为“容器”的循环。\n\
  \n\n\n\n\n# 目录\n\n- 引言\n- 第 1 章：什么是 Python？\n- 第 2 章：Python 的交互式模式\n- 第 3 章：基础知识\n\
  - 第 4 章：序列\n- 第 5 章：不同的数据类型\n- 第 6 章：你将遇到的错误\n- 结\n\n# 引言\n\n我想感谢你，并祝贺你下载了《初学者 Python\
  \ 编程》（Python Programming for Beginners）这本书。\n\n本书包含了掌握 Python 编程语言基础元素的经过验证的步骤和策略。\n\
  \n本电子书将教你关于 Python 的重要信息。它将解释 Python 程序员正在使用的概念和想法。此外，它还为你提供了实际的代码和语句。这意味着你将了解 Python\
  \ 语言的理论和实践方面。\n\n在本书中你将学习到：\n\n* 什么是 Python\n* 如何使用 Python\n* 常见的 Python 数据\n* 以及更多内容！\n\
  \n再次感谢下载本书。希望你阅读愉快！\n\n# 第 1 章：什么是 Python？\n\nPython 是一种高级且结构化的编程语言。你可以使用它来完成各种编程任务。此外，Python\
  \ 是一种开源语言：全球数以万计的计算机专家都在使用并改进它。一位名叫 Guido Van Rossum 的荷兰程序员在 90 年代初创建了 Python。他以一个名为《蒙提\
  \ Python 的马戏》（Monty Python’s Flying Circus）的喜剧节目命名它。\n\n计算机专家认为 Python 是一种强大的编程语言。系统管理员使用它开发不同类型的计算机软件。实际上，Python\
  \ 极大帮助了 Linux 系统的改进。Linux 的大部分组件都是使用 Python 编写的。IT 也使用这种语言教授基础编程。这意味着 Python 是多功能、强大且易学习的。\n\
  \n在执行之前，这种编程语言会自动编译成字节码。系统将字节码保存在硬盘上。这意味着除非修改源代码，否则用户不需要执行编译。此外，Python 是一种动态类型编程语言，允许（但并不要求）面向对象的结构和特性。\n\
  \n与其他编程语言不同，Python 将空格视为其代码的重要部分。事实上，空格的意义是 Python 最显著的特征。Python 不使用块分隔符（C 语言使用的），而是使用缩进来指示代码块的起点和终点。\n\
  \nPython 的另一个酷之处是它适用于所有平台。你可以轻松地在 Linux、Macintosh 和 Windows 计算机上安装和使用 Python。这意味着使用这种语言编写的计算机程序具有极强的移植性：你可以在任何平台上使用它们。\n\
  \n# 第 2 章：Python 的交互式模式\n\nPython 编程语言有两种不同的模式：\n\n1. 普通模式—— 在此模式下，你将使用内置解释器运行脚本和完成的\
  \ Python 文件。\n2. 交互模式—— 这是一个命令行程序，可以对你的每个语句提供即时反馈。该模式在执行存储在内存之前的语句时提供反馈。从技术上讲，交互模式在新的语句输入\
  \ Python 解释器时，单独和整体地评估语句。\n\n本章将重点介绍交互模式。要激活它，只需输入 `python` 而不添加任何参数。这是学习编程语言的极佳方法：你可以尝试各种语句和语法变化。输入\
  \ `python` 后，屏幕将显示类似下面的消息：\n\n![](img/image01718.jpeg)\n\n**注意**：如果 Python 无法运行，请检查是否已添加到系统的\
  \ PATH 中。\n\n# 第 3 章：基础知识\n\n在本节中，你将学习 Python 语言的基础。接下来的页面将教你如何创建程序。\n\n## 如何创建\
  \ Python 程序\n\n通常，使用 Python 创建的程序是普通的文本文件。这意味着你可以用典型的文本编辑器对其进行编辑。使用你喜喜欢的编辑器：\n\n\
  ## 你的第一个程序\n\n没有经验的程序员通过编写“Hello, World!”程序开始他们的 Python 之旅。在这里，程序简单地输出“Hello, World!”然后自行关闭。尝试这个简单的练习：\n\
  \n1. 打开你喜喜欢的编辑器。\n2. 创建一个文件并将其保存为 `hello.py`。在该文件中输入以下内容：\n\n```\nprint(\"Hello,\
  \ World!\")\n```\n\n“Hello, World!”程序利用 `print()`，该函数将语句的参数发送到机器的终端。`print()` 函数在语句输出中添加一个换行符。因此，它会自动将光标转移到下一行。\n\
  \n**注意**：对于 Python 版本 2，`print` 被视为语句而不是函数。这意味着你可以在不带括号的情况下使用它。在这种情况下，`print` 执行两件事：\n\
  \n* 它将整行发送到终端\n* 它允许用户通过在最后一个字符后放置逗号来指示多行语句\n\n你刚刚完成了自己的程序。现在，你准备好使用 Python 运行它了。注意，此过程取决于你正在使用的操作系统（OS）。\n\
  \n### 对于 Windows 计算机\n\n1. 创建新文件夹。你应该只将此文件夹用于 Python 计算机程序。将 `hello.py` 文件保存在此文件夹中。对于这个练习，假设你将文件夹命名为\
  \ `C:\\pythonfiles`\n2. 启动菜单并选择“运行...”。\n3. 在对话框中输入 `cmd` 打开系统的终端。\n4. 输入 `cd C:\\\
  pythonfiles` 并按回车。此操作将 pythonfiles 文件夹设置为目录。\n5. 通过输入 `hello.py` 运行程序。\n\n### 对于\
  \ Mac 计算机\n\n创建一个仅用于 Python 程序的文件夹。对于这个练习，将此文件夹命名为 `pythonfiles` 并将其保存在计算机的主目录（Home\
  \ folder）中。\n\n\n\n\n\n- 将 `hello.py` 程序保存到 `pythonfiles` 文件夹中。\n- 访问电脑的“应用程序”部分，进入“实用工具”，并激活“终端”（Terminal）软件。\n\
  - 在对话框中输入 `cd pythonfiles` 并按回车。\n- 输入 `python ./hello.py` 来运行 Hello, World! 程序。\n\
  \n### 对于 Linux 电脑：\n\n- 创建文件夹并命名为 `pythonfiles`。然后，将 `hello.py` 文件保存其中。\n- 激活电脑的终端程序。按照以下指令操作：\n\
  \    - 对于 KDE 用户–进入主菜单并选择“运行命令…”（Run Command…）。\n    - 对于 GNOME 用户–进入主菜单，访问“应用程序”部分，打开“附件”，并选择“终端”（Terminal）。\n\
  - 输入 `cd ~/pythonpractice`。\n- 输入 `python .hello.py` 运行程序。\n\n## 结果\n\n屏幕必须显示：\n\
  \n```\nHello, World!\n```\n\n就是这样。如果你的电脑屏幕显示了这条信息，说明你做得非常好。你距离成为出色的 Python 程序员又近了一步。\n\
  \n## Python 语言中的变量与字符串\n\n本节将重点介绍字符串和变量。作为初学者，你应该知道这两种数据类型在 Python 语言中都起着巨大的作用。\n\
  \n### 变量\n\n基本上，变量是存储可变化的值的对象。这意味着你可以将变量看作可以存放各种物品的盒子。记住，你可以使用变量来保存不同的内容。不过，现在让我们用它们来存储数字。查看下面的截图：\n\
  \n![](img/image01726.jpeg)\n\n上面的代码生成了一个名为 `lucky` 的变量。随后，它将该变量赋值为一个数字（即 `7`）。如果你“询问”Python\
  \ 存储在 `lucky` 中的数据，你将得到 `7` 作为响应。\n\n你也可以修改变量内部的值。例如：\n\n![](img/image01727.jpeg)\n\
  \n通过上述代码，你保存了一个名为 `changing` 的变量，给它分配了数字 `3`，并确认了第一条语句是正确的。随后，你将数字 `9` 赋值给该变量，并询问系统新的内容。Python\
  \ 语言将 `3` 替换为了 `9`。\n\n然后，你创建名为 `different` 的新变量。你为这个变量分配了数字 `12`。这意味着你现在有两个不同的变量，即：`changing`\
  \ 和 `different`。这些变量持有不同的数据——为其中一个设置另一个值不会影响另一个。\n\nPython 允许你将一个现有变量的值赋值给另一个变量。例如：\n\
  \n![](img/image01728.jpeg)\n\n为了防止混淆，请记住变量名始终显示在赋值运算符（即 `=` 号）的左侧。相反，变量的值显示在运算符的右侧。这意味着对于每个变量，你都会先看到名称，然后是值。\n\
  \n起初，代码创建两个变量：`red` 和 `blue`。然后它为每个变量分配了不同的值：分别为 `5` 和 `10`。注意，你可以在 `PRINT` 函数上放置不同的参数，使其在单行中显示多个项目。结果所示，`red`\
  \ 持有 `5`，而 `blue` 存储为 `10`。\n\n然后代码创建了另一个变量并命名为 `yellow`。随后，代码指示 Python `yellow`\
  \ 的值应该与 `red` 相同。因此，Python 将数字 `5` 分配给 `yellow`。\n\n接下来，代码指示 Python `red` 的值必须改变，使其等于\
  \ `blue` 的值。`blue` 的值为 `10`，因此 Python 将该数字分配给 `red`（数字 `5` 被“丢弃”了）。在截图的最后部分，Python\
  \ 显示了 `red`、`blue` 和 `yellow` 的值：分别为 `10`、`10`、`5`。\n\n等等！代码告诉 Python `yellow` 的值必须等于\
  \ `red` 的值，不是吗？为什么截图显示 `yellow` 的值为 `5`，尽管 `red` 的值是 `10`？这很简单。代码指示 Python 语言 `yellow`\
  \ 在编码时应该拥有 `red` 的值。一旦 Python 为后者分配了值，`red` 和 `yellow` 之间的连接就停止了。`yellow` 接收了 `5`——无论其原始源发生什么，`5`\
  \ 都保持不变（除非给出新的语句）。\n\n### 字符串\n\n基本上，字符串是遵循特定排列的字符列表。\n\n什么是“字符”？让我们这个概念与物理对象联系起来：键盘。任何你使用键盘输入的内容都被视为字符（例如：数字、字母、标点符号等）。\n\
  \n例如，`Birthday` 和 `Halloween` 是字符串。这些字符串由字母（即字符）组成。你也可以在字符串中添加空格：`good morning`\
  \ 包含 12 个字符：`good` = 4，`space` = 1，`morning` = 7。目前，你可以在 Python 字符串中包含任意数量的字符。这意味着在使用的字符数量上没有限制。实际上，你甚至可以创建一个不包含任何字符的字符串（程序员称之为“空字符串”）。\n\
  \n通过 Python，你可以用三种方式声明字符串：\n\n1. `'`– 使用单引号\n2. `\"`– 使用双引号\n3. `\"\"\"`– 使用三引号\n\
  \n\n\n\n上面的程序创建了一个名为 `question` 的变量。然后，它将字符串 `\"What did you have for lunch?\"`\
  \ 存储在该变量中。最后，它指示 Python 输出该字符串。\n\n需要注意的是，你不应该给变量加上引号。通过省略引号，你是在告诉 Python 你正在将 `question`\
  \ 用作变量使用，而不是一个字符串。如果你用引号包裹变量，Python 将其视为一个普通的字符串。它将输出 `\"question\"` 而不是 `\"What\
  \ did you have for lunch?\"`。\n\n# 如何组合字符串和数字\n\n分析下方的截图：\n\n![](img/image01737.jpeg)\n\
  \n这段代码的设计目的是接收程序员输入的数字，将该数字加 10，并输出总和。然而，如果你运行它，将得到以下错误信息：\n\n![](img/image01738.jpeg)\n\
  \n这里发生了什么？Python 并没有输出数字，而是显示了 `TypeError`。此信息意味着输入的信息存在问题。具体来说，Python 无法确定如何组合使用的两种类型的数据：字符串和整数。\n\
  \n例如，Python 假设 `number`（即变量）包含一个字符串，而不是一个数字。如果程序员输入 `\"15,\"`，Python 会认为该变量持有一个\
  \ 2 个字符的字符串：`1` 和 `5`。你可以做什么来告诉 Python `15` 是一个数字？\n\n此外，在请求答案时，你正在指示 Python 组合一个数字（即\
  \ `plusTen`）和一个字符串。这种编程语言不知道如何实现这一点。Python 只能组合两个字符串。你该如何让 Python 将数字视为字符串，以便将其与不同的字符串一起使用呢？\n\
  \n幸运的是，你有两个强大的函数可以调用：\n\n1. `str()` – 此函数可以将数字转换为字符串。\n2. `int()` – 此函数可以将字符串转换为数字。\n\
  \n使用这些函数时，你只需要将想要转换的字符串/数字放在括号内。如果你将此方法应用于之前给代码，你将得到以下结果：\n\n![](img/image01739.jpeg)\n\
  \n# 基本概念\n\nPython 有 5 个基本概念，即：\n\n1. **作用域 (Scope)** – 对于大型系统，你必须限制代码之间的关系。如果你想防止错误或不可预测的系统行为，这将非常重要。如果不限制代码对其他代码的影响，整个系统可能会变得混乱。\n\
  \n你可以通过为每位程序员分配特定的名称组来控制代码的 `scope`。例如，一个程序员将使用国家名称，而另一个人将使用动物名称。这种技术可以帮助限制 Python\
  \ 代码之间的连接。\n\n2. **对象 (Objects)** – 与其他面向对象的语言类似，Python 使用代码和数据组。\n\n在 Python 中，你将使用\
  \ `Classes`（这种编程语言中使用一组模板）来创建（即实例化）对象。对象拥有 `attributes`，它们存储了构成对象的不同数据片段和代码。\n\n\
  访问对象的属性非常简单：\n1. 输入对象的名称并在后面加一个点。\n2. 指定你想要访问的属性名称。\n\n3. **命名空间 (Namespaces)**\
  \ – Python 有一个预装的函数 `dir()`，它可以帮助你理解命名空间。在启动 Python 解释器后，你可以使用 `dir()` 显示默认或当前命名空间中的对象。查看下方的截图：\n\
  \n![](img/image01740.jpeg)\n\n你还可以使用 `dir()` 列出模块命名空间内的可用名称。在这个示例中，让我们对 `_builtins`（上方截图中的一个对象）使用\
  \ `type()`。此函数即 `type()` 允许我们了解对象的文件的类型。查看下方的截图：\n\n![](img/image01741.jpeg)\n\n\
  图片显示 `_builtins_` 是一个模块。这意味着你可以使用 `dir()` 列出 `_builtins_` 内部的名称。你会得到这个结果：\n\n![](img/image01742.jpeg)\n\
  \n这个概念很容易理解。基本上，命名空间是名称可以存在的地方。命名空间内的每个名称与命名空间之外的名称完全不同。计算机程序员将这种 `namespace layering`\
  \ 称为 `scope`。通常情况下，如果名称有值，你应该将它们放在命名空间内。例如：\n\n![](img/image01743.jpeg)\n\n上面的图片显示，你只需使用一个简单的语句（即\
  \ `import`）即可向任何命名空间添加名称。该代码使用 `import` 语句将 `math` 添加到活动命名空间中。如果你想知道那个对象是什么，可以运行此命令：\n\
  \n![](img/image01744.jpeg)\n\n它说 `math` 是一个模块。因此，它有自己的命名空间。你可以使用 `dir()` 函数显示 math\
  \ 命名空间内部的名称：\n\n![](img/image01745.jpeg)\n\n4. **大小写敏感 (Case Sensitivity)** – 变量始终对大小写敏感。这意味着\
  \ `\"SMITH,\"` `\"Smith,\"` 和 `\"smith\"` 是三个不同的变量。\n\n5. **制表符和空格不要混合 (Tabs and\
  \ Spaces Don’t Mix)** – 由于空白在 Python 中很重要，请记住制表符和空格不能混合。在缩进你的 Python 语句时保持一致。如果你使用空格缩进，请坚持使用该字符。这是许多初学者忘记的一个重要概念。\n\
  \n虽然制表符和空格的外观相同，但 Python 解释器读取时，它们具有不同的含义。这意味着如果你混合使用它们，将会产生错误。\n\n注意：如果你倾向于使用空格，请确保按下四次空格。\n\
  \n# 第 4 章：序列\n\n序列作为基本结构之一，允许你方便高效地保存值。Python 支持三种类型的序列，即：列表、元组和字符串。让我们详细讨论每种序列：\n\
