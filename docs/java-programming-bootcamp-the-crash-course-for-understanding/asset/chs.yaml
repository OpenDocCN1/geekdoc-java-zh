  \n# 第 1 章 – 为什么要学习 WordPress？\n很多人认为 WordPress 只是另一个博客平台。这种误解是因为在过去 WordPress 确实是用于博客的。但多年来，WordPress\
  \ 已经进化成为动态内容管理系统（CMS）。虽然你仍然可以使用这个 CMS 创建基础博客，但它现在允许你构建一个功能完备的网站。\n\n\n\n\nWordPress\
  \ 最好的地方在于它非常灵活且易于使用。这是 WordPress 成为如今最流行的内容管理系统（CMS）的主要原因。目前互联网上约 23% 的活跃网站是由 WordPress\
  \ 驱动的。\n\n由于其强大的功能，许多知名品牌使用 WordPress 来构建他们的网站，例如 eBay、《纽约时报》迪士尼、Facebook、《时代杂志》CNN、LinkedIn、索尼和谷歌。\n\
  \n## 让我们来了解一下为什么你应该学习并使用 WordPress\n\n### WordPress 赋予你自由\n基本上，WordPress 是一款免费软件。你有权以你任何需要的方式进行下载、安装、修改和使用它。你可以构建任何类型的网站。它还是一个开源平台，这意味着任何人都可以轻松获取源代码并进行研究、修改和实验。\n\
  \n全球范围内有数以百万计的人在使用 WordPress，每天都有新人在使用这款卓越的 CMS 创建网站。人们之所以能够轻松适应 WordPress，主要原因是因为它非常容易使用和学习。\n\
  \n### 你可以轻松管理 WordPress\nWordPress 内置了更新程序，这让你能够通过 WordPress 内部的管理仪表板轻松更新插件和模板。如果有新版本的\
  \ WordPress 发布，它还会通知你，你只需几次鼠标点击即可完成更新。如果你设置了定期备份，所有内容都是安全的。\n\n### 你可以通过主题和插件扩展\
  \ WordPress\n值得注意的是，绝大多数使用 WordPress 的人既不是程序员也不是网页设计师。事实上，有成千上万的人员在没有任何网站设计基础知识的情况下开始使用\
  \ WordPress。\n\nWordPress 之所以是一个充满活力的平台，主要原因在于你可以从数千个免费主题（网页模板）中进行选择，以提升网站的外观。因此，你可以根据网站的用途赋予其特定的设计和风格。你可以为任何需求找到相应的\
  \ WordPress 主题。你可以在第 2 章中了解更多相关信息。\n\nWordPress 还提供了极佳的灵活性，可以通过插件进行扩展。与主题类似，你可以使用数千个插件来增强你的网站。这些插件可以增强\
  \ WordPress 的功能，并为你的网站添加一个全新的平台。你可以在第 2 章中了解更多关于插件的内容。\n\n### WordPress 对 SEO 极其友好\n\
  WordPress 的开发使用了高质量且符合标准的代码，这些代码生成的语义化标记使你的网站对搜索引擎友好。WordPress 的设计和主题对搜索引擎非常友好，通过使用\
  \ SEO 插件，还可以使其对 SEO 更具吸引力。\n\n### WordPress 可以整合各种类型的媒体\nWordPress 提供了一个动态平台，允许你使用不同的媒体类型。它内置的支持使你能够处理视频、音频和照片内容。它还支持嵌入功能，允许你嵌入来自\
  \ YouTube 和 Vimeo 等外部网站的视频。\n\n### WordPress 提供可靠的安全功能\n网络安全是 WordPress 的基础元素之一，因此你可以通过该平台安全地运行任何网站。但由于互联网的庞杂，这并不能完全保证。互联网上存在许多想要进入尽可能网站的入侵者。好消息是，WordPress\
  \ 了安全插件以防止任何形式的安全威胁。\n\n## 使用 WordPress 的不同方式\n你可以通过多种方式使用 WordPress。许多商业网站运行在 WordPress\
  \ 上，并作为其销售产生的关键环节。你可以将 WordPress 用于以下：\n\n* 博客（个人或商业）\n* 在线游戏厅\n* 内容管理系统\n* 作品集\n\
  * 画廊\n* 在线商店\n* 会员门户\n* 视频策展网站\n* 评分网站\n* 以及更多！\n\n希望这一章回答了你关于为什么要使用 WordPress 的疑问。学习\
  \ WordPress 的最好方法就是开始使用它。在后续章节中，你每天可以学习 WordPress 的基础元素。\n\n## 第 2 章 – 第一周：设置、仪表板、管理栏、设置、链接和图像\n\
  只要你每天能抽出一到两个小时坚持两周，WordPress 就很好学。你只需要非常基础的互联网技能，当然还有准确遵循指令的能力。你甚至不需要学习 HTML 或编程语言来创建你的网站。尽管编程和编码技能在未来会派用场，但对于开始使用\
  \ WordPress 并不是必须的。\n\n全球数以百万计的人从零开始使用 WordPress。事实上，大多数 WordPress 用户甚至不知道如何设计网站或编写代码。\n\
  \n你已经读到这一章本身就是一个你愿意学习 WordPress 的好信号。那么，让我们开始吧。\n\n### 第一周第 1 天 - 学习初始设置\n第一步是学习如何安装和设置\
  \ WordPress。你需要在 `WordPress.org` 和 `WordPress.com` 之间做出选择。\n\n如果你想建立个人博客，且没有打算从网站中盈利，那么选择\
  \ `WordPress.com` 是理想的。但如果你想成为一名专业的博主，那么使用自托管的 `WordPress.org` 更好。后者会产生一些费用，但对于创建自己的网站来说实际上是非常有效益的。\n\
  \n例如，假设你选择了 `WordPress.com`，并购买了自定义域名（每年 $17），选择了自定义设计（每年 $30），并支付了移除广告费用（每年 $29.97）。每年\
  \ $76.97 的总成本并不能提供完全的控制权。\n\n如果你选择了 `WordPress.org`，你可以选择从 `Bluehost`（WordPress\
  \ 推荐）购买主机，费用为每年 $47.4，且已包含一个免费域名。如果你选择其他网络托管公司，可能需要支付同样的价格，但无法获得域名。你可以从 `NameCheap`\
  \ 或 `GoDaddy` 以仅 $10 的价格获得域名。每年 $57.4 的总成本将为你提供完全的控制权。\n\n[点击此处获取 Bluehost 设置网站的步骤说明](http://www.passiveincome.com/2015/12/15/how-to-create-a-website-in-minutes/)\n\
  \n### 第一周第 2 天 - 仪表板基础\n安装 WordPress 后，你就可以开始构建自定义网站或博客。然而，在发布任何内容之前，最好先熟悉仪表板基础。仪表板位于屏幕左侧，在你登录\
  \ `wp-admin` 账户后即可轻松看到。大多数用户将其称为网站的后端。\n\n使用仪表板主页，你可以轻松访问网站内容并查看 WordPress 平台的其他区域。仪表板通过称为小部件（Widgets）的独立区块呈现信息。默认的\
  \ WordPress 小部件包括：`概览`、`快速草稿`、`活动`和 `WordPress 新闻`。\n\n`欢迎`小部件显示了创建新网站时可以执行的顶部任务链接。\n\
  \n\n\n\n\n`At a Glance` 小部件提供了你网站页面、文章和评论数量的简览。每种内容类型都以链接形式显示，点击它们后即可跳转到特定区域，方便你轻松管理内容。\n\
  \n`QuickDraft` 小部件允许你轻松编写新的文本内容。你可以快速编写标题、添加媒体、输入内容、插入标签、保存草稿，或直接 `Publish`（发布）。\n\
  \n`Activity` 小部件显示最新的评论、已发布的和计划发布的文章。\n\n`WordPress News` 小部件涵盖了 WordPress 官方博客的最新新闻、文章和公告。\n\
  \n你可以通过将鼠标光标悬停在标题栏上来展开、折叠和重新排列小部件。如果鼠标变成四箭头图标，你可以按住鼠标左键并将小部件拖到你想要移动的区域。这被称为拖放功能。\n\
  \n你还可以通过插件或特殊的程序代码添加新的小部件。\n\n# 第一周第 3 天 - 管理工具栏 (Admin Bar)\n\n`Admin Bar` 位于屏幕的最顶端。WordPress\
  \ 标志位于仪表面板的最左侧。将鼠标悬停在标志上，你将看到有关 WordPress 特定信息的链接。如果你需要访问支持论坛或提供反馈，这些链接将对你有帮助。\n\
  \n你的站点名称位于标志右侧。你可以悬停在此处，将看到一个子菜单，用于访问网站的前端。下一个区域提供了评论的快速预览。\n\n在左侧，你可以找到 `+ New`（新建）链接。一旦你悬停在该链接上，会出现一个子菜单，将你重定向到用户、页面、媒体和文章的\
  \ `Add New`（添加）界面。你也可以使用仪表面板左侧的导航来完成这些操作，但如果你想快速操作，这些链接会大有帮助。\n\n你还可以在右侧区域看到显示“Howdy,\
  \ your name”（你好，你的名字）文本的部分。你可以悬停在该区域以访问子菜单，用它退出网站或编辑个人资料。\n\n## 管理工具栏的前端视图\n\n如果你当前登录了你的\
  \ WordPress 网站，`Admin Bar` 将显示在你网站的前端页面上。尝试悬停在站点名称上并点击 `visit site`（访问站点），它将重定向到你网站的前端。\n\
  \n一旦你悬停在站点部分的标题上，就可以看到 `dashboard`（仪表面板）链接，它将带你回到仪表面板首页，以及跳转到头部、背景、菜单、小部件和主题的链接。请注意，这些部分在仪表面板左侧的导航窗中也可以找到。\n\
  \n## 如何关闭管理工具栏视图\n\n`Admin Toolbar`（管理工具栏）通常很有用，但有时你可能想关闭它以便查看网站前端的全视图。请注意，`Admin\
  \ Bar` 仅在你以管理员登录网站时才会显示。\n\n如果你想关闭它，只需点击 `Edit my Profile`（编辑我的个人资料）功能。会出现一个屏幕，你可以在文本旁边找到一个复选框：`Show\
  \ Toolbar when viewing site`（查看站点时显示工具栏）。你只需要勾选该框，滚动到页面底部并点击 `Update profile`（更新个人资料）来保存更改。\n\
  \n# 第一周第 4 和 5 天 – 探索 WordPress 设置\n\n在仪表面板上，找到 `Settings`（设置）菜单并悬停在上。会出现一个子菜单，你可以在其中访问\
  \ WordPress 设置的多个选项：`General`（常规）、`Reading`（阅读）、`Writing`（写作）、`Media`（媒体）、`Discussion`（讨论）和\
  \ `Permalinks`（固定链接）。\n\n## 常规设置 (General Settings)\n\n为了探索，你可以先进入 `General Settings`。在此选项中你看到的第一个元素是\
  \ `Site Title`（站点标题）和 `Tagline`（标语）。确保这些文本与你的网站匹配，因为你的站点标题将用于 SEO。默认情况下，WordPress\
  \ 将“just another WordPress site”显示为标语。你需要更改此标语来描述你的网站，因为它对你网站的 SEO 至关重要。\n\n接下来是\
  \ `WordPress Address (URL)`（WordPress 地址 (URL)）。对于网站地址 URL，如果你希望你的网站主页与安装 WP 的目录分开，可以输入该\
  \ URL 地址。此时，最好不要触碰这些 URL。\n\n然后，你还会看到 `Email Address`（电子邮件地址），你将将其用于管理目的，包括新用户通知。还有\
  \ `Membership`（会员）设置。WordPress 允许在线用户注册你的网站。如果会员对你的网站至关重要，这是一个非常有用的功能。\n\n同时，`New\
  \ User Default Role`（新用户默认角色）被设置为 `subscriber`（订阅者）。暂时不要动此设置，因为你可能会意外给任何注册你网站的人授予管理员权限。\n\
  \n然后是 `Timezone`（时区）。浏览列表以选择同一时区内的城市，并选择你偏好的日期格式。请注意，此格式将显示在你的文章中。更新这些设置后，不要忘记 `Save\
  \ changes`（保存更改）。\n\n## 阅读设置 (Reading Settings)\n\n`Reading Settings` 显示影响内容显示的设置。在这里，你可以调整网站首页的显示方式——静态页面或你最新的博客文章。在构建几个页面后，你可以在此设置中列出这些页面，以便它们出现在前端。\n\
  \n下一个设置部分允许你控制 `RSS feeds`（RSS 馈）中的内容显示，包括显示的最大文章数以及你只想显示摘要还是全文。搜索引擎可见性是最后一部分。如果你希望搜索引擎不要索引你的网站，应该勾选\
  \ `Discourage search engines from indexing this site`（阻止搜索引擎索引此站点）。如果你仍处于开发阶段，不建议索引，这是一个很好的设置。\n\
  \n记得 `Save Changes`（保存更改）。\n\n## 写作设置 (Writing Settings)\n\n`Writing Settings` 影响网站的写作和发布。顶部部分允许你控制仪表面板内部编辑器，而其他部分允许你控制外部发布方法。\n\
  \n第一部分显示默认分类格式和文章格式的选项。你还会看到 `Press This` 书签，它允许你轻松撰写你在互联网上发现的内容。如果你想使用它，首先需要将屏幕上的链接拖到浏览器的书签栏。如果你在另一个网站上，只需点击该书签即可访问弹出窗口，通过你的博客分享内容。\n\
  \n同时，`Post via email`（通过电子邮件发布）设置允许你向网站发送带有文章内容的电子邮件。为了使用此设置，你需要使用 `POP3` 访问设置秘密邮件账户。最后部分用于更新服务。一旦你发布新文章，WordPress\
  \ 将立即通知你更新。确保 `Save Changes`（保存更改）。\n\n## 媒体设置 (Media Settings)\n\n`Media Settings`\
  \ 页面允许你为想要添加到文章中的图像设置最大尺寸。如果你希望图像具有相同尺寸或想为图像尺寸设置默认设置，这些设置将为你节省时间。\n\n`Uploading\
  \ files`（上传文件）选项允许你选择上传的文件是按月还是按组织。确保 `Save Changes`（保存更改）。\n\n## 讨论设置 (Discussion\
  \ Settings)\n\n`Discussion Settings` 允许你管理文章和页面的评论及链接。\n\n第一部分是默认文章设置。第一个设置允许你管理创建到其他博客的链接。第二个设置允许你管理回链（trackbacks）和引用回（ping\
  \ backs）。最后，第三个设置允许你的访客在新文章上发表评论。如果你不想访客对文章发表评论，可以取消勾选此框。\n\n`Other comment settings`（其他评论设置）允许你选择访客发布评论的指南以及你如何管理评论。\n\
  \n在 `email me whenever`（每当...邮件我）部分，你可以选择在有人评论或评论被审核员处理时通过电子邮件接收通知。\n\n\n\n\n“评论出现之前”部分将允许你管理已发布的评论。通过此功能，你可以选择是由管理员先批准评论，还是让评论自动发布。\n\
  \n在 `Comment Moderation`（评论审核）部分，你可以根据链接的数量来更改管理评论的方式。在框内，你可以包含 IP、电子邮件、名称、单词和 `URLs`\
  \ 来过滤评论以进行审核。此功能结合评论黑名单一起使用，可以帮助你保护博客免受不当评论和垃圾邮件的扰。\n\n还有头像设置。你可以开启在你的网站上发布评论的用户头像，为还没有头像的用户选择默认头像，或者根据他们的评分过滤其评论。\n\
  \n再次，请务必点击 `Save`（保存）更改。\n\n# 永久链接设置 (Permalink Settings)\n\n永久链接（Permalinks）是指指向每个页面和博客文章（包括标签和分类存档）的永久\
  \ URL。通常，永久链接是用于链接到你内容的网页地址。它通过组合“permanent”（永久）和“link”（链接）而得名，因此称为 permalink。\n\
  \nWordPress 中的 `Permalink` 设置允许你管理永久链接的默认结构。你可以从常用设置中选择，也可以构建自定义的 URL。默认情况下，WordPress\
  \ 使用带有问号和数字的 URL。你可能希望在此更改永久链接，以提高其向前兼容性、可用性和美观。\n\n# 第一周第 6 天 – 创建 WordPress 文章\n\
  \n要创建你的第一篇文章，请在 `Dashboard`（仪表面板）左侧找到 `Posts`（文章）菜单。你可以点击展开它以访问子菜单，或者直接悬停在 `Posts`\
  \ 链接上。\n\n在 `Admin Bar`（管理栏）的 `+ New` 链接中，你也可以找到 `Add New Posts`（添加文章）页面。只需点击 `Add\
  \ New` 进入 `Add New Post` 页面即可开始创建你的第一篇 WordPress 文章。\n\n你可以在第一个框中输入文章的标题。\n\n下方是文章编辑器或\
  \ `Post formatting`（文章格式化）部分，你可以在此处输入或粘贴文章内容。右侧有两个标签页，显示两种文章编辑的模式：`Text`（文本）和 `Visual`（可视化）。\n\
  \n`Text` 标签将允许你访问文章编辑器的纯文本 `HTML` 版本。你可以使用此模式编辑文章的 `HTML` 代码。如果你不熟悉 `HTML`，建议使用可视化模式。\n\
  \n`Visual` 标签非常适合熟悉 `WYSIWYG`（所见即所得）概念的开发者。它带有一个格式工具栏，提供不同的选项来格式化你的文章。如果你用过 Microsoft\
  \ Word，这些图标中的很多看起来非常眼眼。\n\n`Publish`（发布）框位于屏幕右侧列的顶部。如果你想保存文章，可以将其保存为草稿。`Preview`（预览）按钮允许你一眼看到文章发布后的实际外观。`Status`（状态）会让你知道文章当前是草稿、已保存、已发布，或者如果你安排了定时发布，则它处于待审核状态。\n\
  \n随后的链接允许你查看文章的可见性，或者查看网站访问者将看到的内容。`Publish` 行显示文章是立即发布还是在未来的某个日期发布。接下来的部分用于分配给你文章的标签和分类。稍后保存这节课程。\n\
  \n如果你想更改编辑器的屏幕选项，可以点击右上角的 `screen options`（屏幕选项）标签。这将展开链接，你将看到选项，它们将显示在屏幕的文章编辑器上。\n\
  \n在文章编辑器中，你可以直接拖放或调整这些框的布局，以更改它们在页面上的显示方式。\n\n如果你在添加新文章方面需要帮助，可以点击右上角的 `Help`（帮助）标签。在这里，你可以轻松参考如何插入媒体、使用编辑器、添加文章标题的实用提示，以及自定义文章显示的指引。\n\
  \n# 第一周第 7 天 – 添加链接和图片\n\n链接对于你内容的 SEO 至关重要，而图片是提高文章吸引力和可读性的理想选择。WordPress 让你轻松地将这两个元素添加到网站中。\n\
  \n## 添加链接\n\n在页面编辑器或 WordPress 文章中，选择并高亮想要添加链接的文本。然后点击工具栏上的超链接按钮。这将显示一个框，你可以在其中输入链接的特定\
  \ `URL` 以及悬停在链接上时显示的标题。勾选此复选框允许你在新标签页中访问链接。\n\n如果你喜欢链接到网站上的现有内容，只需点击展开此部分。通过，你可以看到一个搜索栏来搜索你的网站，以及一个现有页面或文章列表。\n\
  \n选择列表中的某一项也会更改超链接。如果你的链接准备就绪，点击 `Add Link` 按钮。你选择的文本现在有了链接。如果你想删除链接，再次选择该文本并选择\
  \ `unlink`（取消链接）按钮。你会发现链接已被删除，文本恢复正常显示。\n\n## 添加图片\n\n在文章中选择插入图片的最佳位置。在文章编辑器工具栏的顶部，你会看到\
  \ `Add Media`（添加媒体）按钮。点击此按钮显示 `Insert Media`（插入媒体）框。\n\nWordPress 存储 `media library`（媒体库）来保存所有的媒体文件，如视频和图片。在此框中，你可以选择上传新文件或使用媒体库中的现有文件。如果你想上传图片，点击\
  \ `Select files`（选择文件）按钮并找到你想使用的图片。\n\n图片上传后，你会看到它已添加到媒体库。在框的右侧区域，你可以看到附件详情。在此部分，你可以看到\
  \ `Description`（描述）、`Alt text`（替代文本）、`Caption`（说明）。你还可以选择图片的对齐方式，如右、左或居中。\n\n确保图片已勾选。点击“插入文章”按钮。现在你可以看到图片已插入文章中。\n\
  \n一旦点击图片，你将在顶部部分看到两个框。第一个是图片图标。当你点击此图标时，将出现另一个框，你可以在其中编辑所有图片详情。在此提示中，你可以根据百分比修改图片大小，也可以更改\
  \ `URL`、`caption`、`alt text` 和 `title`。你还可以选择图片链接或链接实际文件。\n\n在选择高级设置标签时，你会看到图片的托管链接、属性和样式、`CSS\
  \ Class` 以及以像素为单位的实际高宽。\n\n接下来，返回图片。右上角的图标允许你从文章中删除图片。点击 `Add Media` 按钮，你会注意到相同的插入媒体框。在左侧，你会看到设置集和选择特色图片的选项。\n\
  \n特色图片会被某些主题使用。如果你的选择的主题有特色图片，请选择图片并返回文章编辑器。点击 `preview` 按钮检查图片是否已插入。\n\n# 第三章 –\
  \ 第二周\n\n## 第二周第 1 天 – 分类与标签\n\n你可以将文章组织到不同的分类中，例如主题或学科领域。例如，如果你正在写一篇文章，请考虑文章更广泛的主题。如果你计划未来关于该主题编写更多文章，将这些文章组织在一起是理想的。\n\
  \n### 添加新分类\n\n如果你还没有添加分类，点击显示 `+ Add new category` 的链接。通过点击 `Add new category`\
  \ 插入新分类。你会注意到新分类已包含在分类列表中。要将分类包含到文章，请点击分类旁的复选框。\n\n\n\n\n\n另一种管理文章分类的方法是通过位于 `Dashboard`\
  \ 菜单中的 `Posts > Categories` 链接进行导航。如果你点击 `Categories` 链接，就可以进入 `Categories` 页面。从该页面，你可以查看右侧显示的所有分类，你也可以在其中添加新条目。\n\
  \n### 分类描述\n描述区域允许你添加有关与分类分类的文章的更多信息。某些 WordPress 主题会显示这些信息。\n\n### 分类层级\n与标签不同，分类可以嵌套成层级。例如，你可以有一个\
  \ `News`（新闻）分类，在其下方你可以包含 `World News`（国际新闻）和 `Sports News`（体育新闻）子分类。\n\n### 分类别名\n\
  `Category Slugs` 是分类的链接友好版本。这通常是小写形式，仅包含数字、连字符和字母。\n\n### 分类和标签之间有什么区别\n将你的网站想象成一本书。分类类似于目录，而标签则像是索引部分。\n\
  \n### 第 2 周第 2 天 – 创建 WordPress 页面\n创建新页的第一步是在 `Dashboard` 中找到 `Pages` 菜单。只需点击 `Add\
  \ new` 选项。\n\n你会发现页面编辑器与文章编辑器具有相同的界面。唯一的区别在于屏幕右侧区域可以找到的几个框。添加页面标题，例如 `Contact Us`（联系我们）。记住，如果你创建了固定链接（pretty\
  \ permalinks），页面标题也将用作 `URL slug`。\n\n在为页面添加内容后，你可以 `Publish` 页面编辑器的部分，这与你写文章时类似。如果你准备好发布，可以立即发布、安排在未来发布或进行排期。\n\
  \n`Page Attributes` 部分包含了你新页面的父级页面和模板。在 `Parent` 部分，你可以根据层级结构组织页面。例如，你可以创建这个新页面，并在其下方添加其他页面。请注意，对于你想要嵌套页面的层数没有限制。\n\
  \n`Template` 部分允许你为你的新页面包含一个模板。如果你的主题允许自定义页面模板，这是可以的。\n\n`Order` 界面允许你按数字顺序组织页面。页面通常按字母顺序组织，但你可以通过在此框中提供一个数字来选择自己的安排方式。\n\
  \n先预览页面，如果无误，然后点击 `Publish`。\n\n### 第 2 周第 3 天 – 应用 WordPress 模板\n某些 WordPress 主题带有模板，这些模板可以更改网站前端页面的格式。通过页面模板，主题可以为页面的外观以及特定元素放置的位置提供一些灵活性。\n\
  \n添加页面模板的第一步是浏览 `Dashboard` 中的 `Pages` 菜单，并找到 `edit` 或 `add a new page` 链接。找到 `Page\
  \ Attributes` 区域，你可以在那里可以看到可以使用模板下拉列表。根据 WordPress 主题的不同，你可以在下拉菜单中看到某些页面模板选项。\n\n\
  要查看模板将如何更改页面外观，请选择一个模板并预览，以检查它是否适用于该页面。\n\n一旦你最终选择了想要使用的模板，就可以点击 `Publish`。\n\n\
  ### 第 2 周第 4 天 – 安装插件\n插件允许你为 WordPress 网站添加更多功能。安装插件非常简单。\n\n第一步是登录网站 `Dashboard`\
  \ 后，找到并展开 `Plugins` 菜单。寻找 `Installed Plugins` 页面，你可以在该页面看到已安装在网站上的插件列表。某些插件在安装 WordPress\
  \ 时会自动安装，例如 `JetPack` 和 `Akismet`。\n\n要添加新插件，只需点击 `Add New` 选项。从该页面，你可以选择从 `WP Plugin\
  \ Directory` 浏览你想安装的插件。你也可以根据插件的发布日期、流行程度或你标记为收藏的插件进行筛选。\n\n要开始上传插件，请遵循此命令流：`Choose\
  \ file > locate your plugin zip file > Install Now > Activate`。\n\n`Dashboard` 中\
  \ `Plugins` 下的最后一个菜单部分是 `Editor`，你可以通过修改单独的 `PHP` 文件来更改插件的某些元素。但记住，如果你进行了一些修改，插件更新将覆盖你的更改。如果你不懂\
  \ `PHP` 代码，请修改插件的 `PHP`。\n\n### 第 2 周第 5 天 – 管理 WordPress 主题\n管理 WordPress 主题的第一步是浏览\
  \ `Dashboard` 中的 `Appearance` 菜单。选择 `Manage Themes` 页面。\n\n在上方，你可以看到 `Active theme`\
  \ 以及 `Customize` 选项。当你点击此链接时，你可以看到预览窗口，允许你对 `Tagline`（标语）和 `Site Title`（站点标题）进行更改。\n\
  \n如果你返回 `Manage themes` 标签，你可以在活动主题下查看可用主题列表。这些主题已经安装在你的 `WP` 站点上。\n\n如果你选择任何主题下方的\
  \ `Live Preview` 链接，你可以看到网站使用该主题后的外观预览。在预览中，你可以浏览不同的页面，查看主题如何处理模板、存档和文章。在预览窗口的左侧，你可以编辑主题的设置。这些设置将根据主题中所包含的功能类型而异。\n\
  \n务必点击左上角的 `Save & Activate` 按钮以接受新主题。\n\n### 第 2 周第 6 天 – 创建自定义菜单\n你可以创建一个自定义菜单，作为网站的导航菜单。`Menu`\
  \ 功能允许你构建自己的自定义菜单，以替换你所选主题的默认菜单。\n\n某些自定义菜单包含链接、分类、页面和其他类型的内容。你还可以为菜单项包含自定义导航标签以及包含其他属性。\n\
  \n通常情况下，设置的菜单数量没有限制。因此，如果你的主题包含多个位置，你可以选择为每个位置关联哪个自定义菜单。你还可以配合 Custom Menus 小部件使用自定义菜单。\n\
  \n#### 如何在 WP 网站创建自定义菜单\n第一步是展开 `Dashboard` 左侧的 `Appearance` 菜单。点击 `Appearance`\
  \ 中的 `Menus` 链接，这将激活菜单编辑器页面。提供你想要的菜单名称，并点击 `Create menu`。然后，你可以向左侧框中添加菜单项，如 `links`、`categories`\
  \ 和 `pages`。\n\n如果你想更改从此页面看到的菜单选项，只需展开 `Screen Options` 标签。然后添加其他菜单选项，如 `CSS classes`、`formats`、`tags`\
  \ 和 `posts`。\n\n一旦组织好菜单项，请确保点击 `Save Menu`。\n\n### 第 2 周第 7 天 – 管理评论\n在基于 WordPress\
  \ 的站点上管理评论与处理页面和文章相似。\n\n在 `Dashboard` 中，寻找 `Comments` 页面。你可以像自定义其他 WordPress 一样自定义此屏幕。黄色指示器表示评论需要审核。你可以通过\
  \ `Bulk Actions` 或悬停在操作链接上回复评论。\n\n在 `Author` 列中，除了作者姓名、`blog URL`、`email address`\
  \ 之外，还会显示评论者的 `IP address`。如果你点击此链接，将显示来自特定地址的所有评论。\n\n在 `Comment` 列中，每条评论都包含关于\
  \ `Submitted on` 的信息，以及评论在网站上发布的时间日期。点击时间和日期链接将重定向到网站上的该条评论。当你悬停在评论上时，你会看到想对该评论做什么：`approve`、`reply`、`edit`、`trash`\
  \ 或 `mark as spam`。\n\n\n\n\n\n“回复”（`In Response To`）这一列包含三个元素。文本指的是帖子的名称（评论链接到该帖子），以及指向该特定条目编辑器的链接。\n\
  \n# 结论\n\n再次感谢你下载这本书！\n\n希望这本书能够帮助你学习 `WordPress` 的基础知识，到目前，你的网站或博客应该已经上线运行了。\n\n\
  下一步是学习高级 `WordPress` 技术，例如 `SEO`、安全防护，以及使用 `Java` 和 `Ajax` 来增强你的网站或博客。\n\n# Python\
  \ 学院\n\n## 从内到外学习 Python 的无压力方法\n\n### 目录\n\n- 引言\n- 第 1 章：Python 简介\n- 第 2 章：语法\n\
  - 第 3 章：数据类型\n- 第 4 章：运算符\n- 结论\n\n## “JavaScript Academy”预览\n\n### 引言\n\n我想感谢你并祝贺你下载了《在两周内学习\
  \ Python 编程基础》这本书。\n\n这本书包含了如何在 `Python` 中编写和运行程序的经过验证的步骤和策略。书中包含了你可以作为指南的示例代码和程序。\n\
  \n书中还包含了对编程语言的介绍，包括简要历史和 `Python` 的基础。它还对 `Python` 中的各种特性进行了详细解释。\n\n再次感谢下载这本书，希望你喜欢它！\n\
  \n# 第 1 章：Python 简介\n\n如果你正在寻找一种通用的、以代码可读性为主要关注点的高级语言，你应该考虑 `Python`。它的语法允许你比 `C`、`C++`\
  \ 和 `Java` 等其他编程语言更少的代码表达概念。它支持广泛的编程范式，涵盖了命令式、函数式和面向对象的编程。此外，它还拥有完善的标准库、动态类型系统和自动内存管理。\n\
  \n你有许多解释器可供安装在不同的操作系统上；因此，你完全可以在各种系统上执行 `Python`。你甚至可以利用第三方应用程序。如果你不想安装解释器，可以将代码打包成独立的可执行程序，这样你就可以高效地向不同环境分发基于\
  \ `Python` 的软件。\n\n### Python 编程语言的简史\n\n`Python` 由 `Guido van Rossum` 在 20 世纪 80\
  \ 年代后期开发。它最初只是一个圣诞项目。Van Rossum 想为一种 `C` 和 `UNIX` 黑客使用的脚本语言编写一个解释器。他的小项目最终升级到了 `Python\
  \ 2.0`，并于 2000 年 10 月发布。这个新版本包含了垃圾回收器和 Unicode 支持。`Python 3.0`（也称为 `Python 3000`\
  \ 和 `py3k`）于 2008 年 12 月发布，其特性回到了 `2.6` 和 `2.7` 版本。\n\n### 为什么要使用 Python？\n\n编程语言的存在是有原因的。例如，`Python`\
  \ 的开发是为了让程序员能够创建高效且高产的代码。它的主要目标是帮助初学者轻松快速地学习编程语言。由于学习时间更短，你可以创建更有用的应用程序，而这些应用用晦涩且复杂的编程语言很难实现。\n\
  \n通过 `Python`，你在编写应用程序时也可以从更短的开发时间中获益。如前所述，`Python` 的代码比 `C`、`C++` 和 `Java` 少。它的代码实际上短五到十倍；因此，它更高效、不复杂。你可以花费更少的时间来开发应用程序，而花更多的时间对它们进行调优和改进。\n\
  \n当涉及到检查 Bug 和错误时，你使用的编程语言易于阅读和理解至关重要。如果编程语言太复杂，你可能在编写和检查程序时遇到困难。使用 `Python`，代码更容易读、更容易写；因此，你可以轻松地解释代码并进行必要的更改。\n\
  \n此外，`Python` 还有许多其他用途。它是基于浏览器的脚本应用程序、创建优秀的用户界面和粗略的应用程序示例、与数据库交互、处理 `XML` 以及设计数学、工程和科学应用的理想选择。\n\
  \n### Python 对比 C#、Java 和 Perl\n\n你可能会发现比较不同的编程语言是一项项主观的任务。通常，它们的差异取决于个人偏好。尽管如此，有时这种比较是有科学数据支持的。无论如何，你必须记住，并不存在全能的编程语言。作为一名程序员，你只需要找到一种最适合你目标或需求的语言即可。\n\
  \n#### C#\n\n如果你有 `Java` 背景，你可能会发现 `C#` 和 `Java` 非常相似。但尽管如此，与 `Java` 相比，`C#` 也有自己的优缺点。微软声称他们开发\
  \ `C#` 的主要目标是产生一个更好的 `C` 和 `C++` 版本。然而，与 `C#` 相比，`Python` 具有更好的科学和工程应用以及更好的多平台支持。在使用\
  \ `C`、`C++` 和 `Java` 时，它更具扩展性。它更容易学习和理解，并允许各种计算机环境。它的代码更简洁。\n\n#### Java\n\n程序员将\
  \ `Java` 视为一种一站式编程语言。多年来，他们寻找可以随处运行和编写的东西，并发现了 `Java`，它可以在不同的平台和计算机环境中良好运行。如此，`Python`\
  \ 也是一种一站式编程语言。它与 `Java` 非常相似，不同之处代码更简洁且更容易学习和理解。它的开发速度快得多，并且改进了可以存储不同数据类型的容器或变量，这在运行应用程序时非常有用。\n\
  \n#### Perl\n\n`PERL` 代表实用提取和报告语言（Practical Extraction and Report Language）。它是适用于从另一个数据库获取和处理数据的编程语言。相比之下，`Python`\
  \ Better 于 `PERL`，因为它更容易阅读、实现、学习和理解。它有更好的 `Java` 集成和数据保护。它还具有较少的平台偏见。\n\n### 为什么\
  \ Python 是初学者的理想选择\n\n如果你刚开始编程，可能想考虑 `Python`。它对初学者是理想的，因为它具有一致且简单的语法以及丰富的标准库，允许你完成多个项目。涉及的任务不限于常见的四功能计算器和平衡检查程序。\n\
  \n当你习惯了用 `Python` 编写程序时，你会发现编写现实的应用程序其实很容易。交互式解释器还允许你测试语言特性。在 `Python` 中，你可以专注于核心编程技能，如程序拆分和数据类型设计，以及基础概念，包括过程和循环。\n\
  \n由于 `Python` 涉及到多个库和系统调用，你可以开发界面易编程的应用程序。你还可以完成应用程序编程接口（`API`）的任务。\n\n如果你从未用过任何其他编程语言，请担心。即使是没有任何编程知识或经验的人，也能轻松掌握\
  \ `Python` 编程语言的基础知识。\n\n\n\n\n关于版权，`Python` 的开发者允许程序员对源码进行任何想要的操作，只要他们不要忘记包含版权声明即可。版权规则并不严格。你甚至可以出售二进制和源码形式的副本，以及涉及\
  \ Python 使用的产品。然而，如果你想使用标志（logo），请确保你已获得许可。\n\n`Python` 非常稳定。事实上，它稳定到足以日常使用。你可以预计在六到十八个月内有一个新版本。开发者会发布\
  \ bug 修复版本，以确保新版本比之前的版本更好。\n\n如果你想进行静态分析或查找 bug，可以使用 `Pylint` 或 `PyChecker`。前者是一个检查模块是否遵守编码标准的工具，并允许自定义插件。后者是一个在源代码中寻找\
  \ bug 的静态分析工具。\n\n既然你已经学习了这种编程语言的基础知识，你可能仍然好奇 `Python` 的名字是怎么来的。吉多·范·罗姆（Guido van\
  \ Rossum）喜欢蛇吗？嗯，他实际上喜欢的是那部名为《蒙提 Python 的飞行马团》（Monty Python’s Flying Circus）的电视节目，而不是那种爬行动动物。\n\
  \n在 `Python` 开发期间，他正在读这部喜剧剧的剧本，并认为“Python”是一个很合适的名字，因为它简短、独特且具有恰当的神秘感。事实上，文档中允许并实际上鼓励对该喜剧节目进行引用（references）。\n\
  \n## 第 2 章：语法\n\n`Python` 具有简单直观的语法。它甚至鼓励程序员在不使用预定义或模板代码的情况下编写程序。`print` 指令实际上是所有指令中最简单的。它打印行并包含换行符。你可能会注意到，`print`\
  \ 指令在该编程语言的新主版本中有所不同。\n\n`Python` 2.0 是更常用的版本，而 `Python` 3.0 支持最新特性且语义上更正确。无论如何，`print`\
  \ 语句在 2.0 版本中不视为函数；因此，你可以在代码中不包含括号的情况下调用它。另一方面，`print` 语句在 3.0 版本中被视为函数；因此，如果你想调用它，必须使用括号。\n\
  \n### 交互模式编程\n\n你可以在不同的模式下执行程序。如果你在调用解释器时没有传递脚本文件作为参数，你将得到这些：\n\n```\n$ python\n\
  \nPython 2.4.3 ( #1, Nov 11 2010, 13:34:43 )\n\n[GCC 4.1.2 20080704 ( Red Hat 4.1.2\
  \ – 48 )] on linux2\n\nType “help”, “copyright”, “credits” or “license” for more\
  \ information.\n\n>>>\n```\n\n当你看到这个提示符时，可以输入你想要的文本然后按回车。在这个示例中，我们将使用“Monty Python\
