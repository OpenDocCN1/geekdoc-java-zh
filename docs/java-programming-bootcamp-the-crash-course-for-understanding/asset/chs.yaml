  \n# 第 1 章：Scrum 与敏捷开发\n\nScrum 是用于“敏捷”开发模型中的一种方法。在讨论 Scrum 到底是什么之前，让我们先定义敏捷。这样，你就能理解\
  \ Scrum 方法是如何运作的，以及你如何使用它来完成编程项目。\n\n### 敏捷开发\n\n基本上，敏捷是一种用于完成项目（例如软件产品）的重复和增进的开发策略。这种策略要求人们通力合作以快速完成项目。敏捷涉及一种时间限制的重复方法，并要求对任何变化做出快速且多才的响应。根据敏捷实践者的说法，这种策略是一个理论大纲，并没有指示团队应该做的任何特定活动。\n\
  \nScrum 是敏捷开发使用的方法之一，它定义了完成任何给定项目必须执行的技术和流程。\n\n**重要提示：** 敏捷及其方法（例如 Scrum）最初用于软件开发；因此，Scrum\
  \ 不是一种编程语言或计算技术。它是一个帮助人们快速高效地完成项目的开发框架。然而，在本书中，你将学习如何使用 Scrum 来完成与编程相关的项目。\n\n###\
  \ 敏捷开发的主要原则\n\n在使用敏捷开发时，你应该记住下面列出的原则：\n\n- **关注细节** – 特别关注你项目的细节。通过这种方式，你可以获得优秀的项目设计和卓越的技术。\n\
  - **少即是多** – 敏捷开发框架强调简单性。在这里，你不需要通过无关紧要的技术/活动来增加项目的复杂。用最简单的方法解决与项目相关的问题。\n- **沟通至关重要**\
  \ – 为了确保卓越的质量，开发者（即负责项目的人）必须与业务人员（管理团队或客户）定期沟通。\n- **交付客户满意度** – 总的来说，使用敏捷的人希望满足客户的需求。这些开发者使用持续的过程尽早完成项目并将其发送给客户。\n\
  - **必须接受变化** – 敏捷实践者在处理任何项目时必须欢迎变化（环境和项目方面）。这意味着你必须观察与项目相关的所有变化并进行必要的调整。\n- **信任与动力**\
  \ – 敏捷框架本质上是重复且复杂的；因此，它需要有动力。寻找可以信任的人，因为不可靠的员工会破坏你的项目。\n- **灵活性是关键** – 团队必须适应变化的情况。如果你不适应环境的变化，你就无法成为高效的敏捷实践者。\n\
  - **产出是成功的衡量标准** – 只有当你拥有工作的产出时，你才能说你是成功的。简单性、生产力、成本效益以及所有“好东西”，如果你没有满足客户要求的产出，它们都是没用的。\n\
  \n### 结论\n\n无数公司从敏捷开发实践中受益。这就是为什么敏捷框架现在被应用于不同行业和项目（例如编程）的主要原因。\n\n敏捷框架提供了以下利益：\n\
  \n- 提高交付速度\n- 降低风险和不确定性\n- 通过关注客户需求提高 ROI（投资回报率）\n\n# 第 2 章：Scrum 框架\n\n### 什么是\
  \ Scrum？\n\n软件开发者将 Scrum 定义为用于创建和改进复杂产品的框架。它不是生成新产品的方法或方法论；相反，它是一个用于实施不同方法和方法论的开发框架。Scrum\
  \ 可以向你展示开发和管理策略的优缺点，从而提高你的整体效能。\n\n### Scrum 框架涉及的流程\n\n在使用 Scrum 时，你应该通过预设事件来标准化流程。每个事件都是时间限制的，这意味着它有一个特定的截止日期。你将在后的章节中学习更多关于“事件”的内容。\n\
  \n```\nSprint\n```\n\n\n\n\nSprint（冲刺）是一个通常以周为单位的时间盒，它是 Scrum 的核心。基本上，`Sprint` 是一个用于产生产品增量的时间段。一旦上一个\
  \ `Sprint` 完成，一个新的 `Sprint` 就会开始。Sprint 包含以下元素：\n\n* Sprint Planning（冲刺计划）–参与项目的人员将决定在\
  \ `Sprint` 期间必须完成的任务。`Scrum Team` 的每位成员都必须参与这项协作活动。\n* Daily Meetings（每日会议）–`Scrum\
  \ Teams` 需要每天制定计划并共享更新。为了实现这一目标，每个团队每天必须举行一次 15 分钟的会议。\n* Sprint Review（冲刺评审）– 此活动发生于\
  \ `Sprint` 结束时。在这里，`Scrum Team` 的成员会审查产品增量，并在必要时更新项目记录。\n* Sprint Retrospective（冲刺回顾）–它发生在下一个\
  \ `Sprint` 计划阶段之前。在这次活动中，`Scrum Team` 的成员会检查自己的表现并寻找改进方法。这使他们能够在下一次 `Sprint` 中获得更好的结果。\n\
  \n## Scrum 团队的成员\n\n`Scrum Teams` 涉及三个主要角色，分别是：\n\n* “ScrumMaster”（也写为“Scrum Master”）–此人担任团队领袖角色。`ScrumMaster`\
  \ 需要：\n    * 确保 `Scrum` 框架和产生的流程高效运行。\n    * 识别并消除影响团队生产力的障碍。\n    * 组织并促进重要会议的召开。\n\
  * Product Owner（产品负责人）–此人负责使团队效率和产品价值最大化。通常，产品负责人需要管理项目的待办列表（backlog）。项目待办列表管理涉及：\n\
  \    * 清晰表达项目待办列表中的项目\n    * 有效安排项目待办列表项以实现团队目标\n    * 最大化团队表现的整体价值\n    * 确保项目待办列表是清晰、透明且对所有团队成员可见的。此外，待办列表必须告知成员需要做什么或改进什么。\n\
  \    * 确保每位成员都理解项目待办列表项。\n\n产品负责人可以执行上述任务，也可以要求团队成员代为。无论什么情况下，产品负责人对这些任务负有全部责任。\n\
  \n产品负责人是一个，而不是一组人。此人可以在项目的待办列表中表达其他人的需求/愿望。然而，待办列表中的每个项目必须列在产品负责人的名下。\n\n整个团队必须尊重产品负责人的决定。团队成员应该检查项目待办列表以了解更多产品负责人的决策。\n\
  \n* Team（团队）–此术语指 `ScrumMaster` 和产品负责人之外的团队成员。通常，Scrum 团队的“团队”方面必须能够自我组织并执行不同的功能。这部分由测试人员、分析师、开发者和设计师组成。根据所涉及的项目，可以向团队添加其他成员（例如工程师和架构师）。\n\
  \n为了让“团队”保持高效，它的规模应该足够大以完成任务，同时足够小以保持灵活。“团队”的理想规模是五到九名成员（不包括 `ScrumMaster` 和产品负责人）。如果成员少于五人，人力可能不足以在指定的\
  \ `Sprint` 内内完成项目。然而，如果成员超过九人，团队将需要过度的协调。\n\n## 结论\n\nScrum 是一种敏捷框架，它规定了角色、规则和任务以确保一致性。只要你遵循所有的\
  \ Scrum 开发规则，就可以将其用于任何项目或组织。\n\n## 第 3 章：事件\n\n敏捷实践者将 Scrum 视为一系列事件及其产生的“产物”。如前所述，Scrum\
  \ 使用时间盒事件来管理项目。“时间盒”一词意味着每个事件都有一个预定的截止日期。这使得 `Scrum Team` 的成员能够看到他们完成项目的整体进展。最重要的\
  \ Scrum 事件是：\n\n### Sprint（冲刺）\n\n在这一活动中，`Scrum Team` 开发一个可运行的产品增量。通常，一个 `Sprint`\
  \ 持续 1 个月或 2 周，这个时间段适用于项目中的所有 `Sprint`。时间段的一致性非常重要。如果团队成员需要适应不断变化的截止日期，将会导致混乱和效率低下。\n\
  \n#### Goal of a Sprint（冲刺目标）\n\n每次冲刺都有一个特定的目标。该目标告知团队成员增量的目的。团队在冲刺的计划阶段设定此目标。产品负责人和团队其他成员设定并明确冲刺的范围。当他们发现关于项目的新情况时，也会对冲刺进行调整。\n\
  \n#### Sprint Planning（冲刺计划）\n\n此阶段允许你设定在冲刺期间必须完成的活动。对于为期两周的冲刺，计划阶段通常持续四小时；对于为期一个月的冲刺，则持续八小时。`ScrumMaster`\
  \ 负责确保会议召开以及所需人员出席。此外，`ScrumMaster` 必须主持会议以确保讨论的生产力和及时性。\n\n通常，冲刺计划集中在以下问题：\n\n\
  * 在当前增量中应该完成什么？\n* 在当前增量中可以完成什么？\n* 整个团队如何实现冲刺目标？\n\n此阶段需要以下输入：\n\n* 项目待办列表\n* 项目的最新增量\n\
  * Scrum 团队的预估容量\n* Scrum 团队之前的表现\n\n整个团队将讨论在当前冲刺内必须开发的特性/功能。产品负责人应该通过项目待办列表明确冲刺最重要的部分。团队成员选择将包含在待办列表中的项，因为他们知道自己在分配的时间盒内可以完成什么。任务是协作完成的，这种方法减少了重复工作。\n\
  \n在决定了要开发的功能后，团队必须决定如何将功能加入项目。为冲刺选择的待办列表及其实施策略被称为冲刺待办列表（Sprint backlog）。\n\n冲刺内完成的任务在计划阶段进行估算。它们可能有不同的规模和复杂性。一旦冲刺计划完成，项目将被分为最长一天的任务。这种方法有助于\
  \ ScrumMaster 分配任务并检查项目进度。如果 Scrum 团队成员意识到任务太少（或太多），他们可以与 `ScrumMaster` 和产品负责人讨论进行必要的更改。\n\
  \n成员还可能请求他人（即不是当前 `Scrum Team` 的人员）协助计划阶段。非成员可以提供成本估算、技术建议或实用技巧。\n\n#### Daily Meetings（每日会议）\n\
  \n这些会议持续 15 分钟。每天举行，以理解昨天完成的事情并制定今天的计划。一些 Scrum 实践者将这些会议称为“站会”（Stand Up）。\n\n每日会议在相同的地点和时间进行。这样团队成员就可以减少会议的复杂性，并专注于要做什么。\n\
  \n在会议期间，Scrum 团队的每位成员必须回答以下问题：\n\n* 他如何帮助 Scrum 团队实现目标？\n* 他如何协助团队实现冲刺目标？\n* 他是否注意到任何阻碍他或整个\
  \ Scrum 团队实现冲刺目标的障碍？\n\n\n\n\n有些人认为召开每日站会是为了跟踪项目进度。然而，这是一个错误的假设。实际上，举行每日站会是为了规划项目必须完成的工作，而不仅仅是检查已完成了什么。\n\
  \n根据 Scrum 专家的说法，所有团队成员对每日站会的效率和有效性负责。这意味着每位成员都必须协助进行每日站会，尽管相关的管理任务由 `ScrumMaster`\
  \ 执行。\n\n以下是每日站会提供的益处：\n\n- 这些会议改进了团队成员之间的沟通。\n- 每日站会有助于识别与项目相关的问题。它们也有助于快速高效地解决问题。\n\
  - 它们促进并强调了快速决策。\n- 它们提高了团队成员对项目相关的知识。\n\n# 迭代评审 (Sprint Review)\n\n`Scrum Team`\
  \ 应该在每个迭代结束前举行此项活动。在此阶段，团队成员在发布项目增量之前应对进行评审（即发布给客户或进入下一个迭代会话）。在迭代评审期间，所有利益相关者（即对受项目影响或参与项目的人）都应该检查当前迭代完成了哪些工作。这些利益相关者将就下一次迭代会议中必须完成的内容给出建议。他们的建议将基于两个因素：\n\
  \n- 他们从迭代评审中的发现\n- 在当前迭代期间对项目待办列表（project backlog）进行的更改\n\n此阶段的目标是获取利益相关者的反馈并确保进度的持续性。\n\
  \n通常，迭代评审的持续取决于迭代的时间盒（time-box）。为期两周的迭代评审持续两小时。相反，为期一个月的迭代需要 4 小时的评审；因此，迭代上每花费一周就需要一小时的评审。\n\
  \n在迭代评审期间，`ScrumMaster` 应该：\n\n- 确保会议召开。\n- 告知团队成员关于迭代评审的目标/目的。\n- 帮助成员关注重要话题。\n\
  - 确保会议及时结束。\n\n在迭代评审期间会发生以下事件：\n\n- `product owner` 邀请非成员参加评审（可选）。\n- `product owner`\
  \ 讨论项目待办列表。他/她将告知所有人已完成的待办列表事项。然后，他/她将列出在迭代内未完成的待办事项。\n- 团队成员讨论迭代的积极方面、他们遇到的问题以及如何解决这些问题。\n\
  - 团队成员演示他们完成的工作。如果对项目增量有任何问题，他们也将予以回答。\n- 整个小组（包括成员和非成员）决定下一次迭代中应该做什么；因此，评审阶段产生了对下一次迭代会议非常有用的重要输入。\n\
  - `Scrum team` 的成员检查与产品增量发布相关的方面（例如预算、时间表、市场、能力、潜力等）。\n\n一旦迭代评审完成，`Scrum team` 将更新项目待办列表。这些更新定义了后续迭代将使用的待办事项。\n\
  \n#迭代回顾 (Sprint Retrospective)\n\n此阶段发生在下一次迭代计划阶段开始之前。为期两周的迭代回顾持续一小时，而为期一个月的迭代回顾则持续三小时。\n\
  \n基本上，迭代回顾的目标是：\n\n- 利用从上一次迭代会收集的关于工具、人员、流程和关系方面的信息。\n- 确定运行良好的待办事项。\n- 识别迭代可以改进的领域。\n\
  - 创建一个改进项目效率和整体质量的计划。\n\nScrum 允许你回顾之前的表现；因此，它能帮助你提高后续迭代会话的效率。\n\n# 第 4 章：产物 (Artifacts)\n\
  \n在 Scrum 中，“产物”为利益相关者和团队成员提供重要数据；因此，产物让你了解当前项目、已完成的任务以及项目涉及的。Scrum 框架涉及以下产物：\n\n\
  - 项目待办列表 (Project backlog)\n- 迭代待办列表 (Sprint backlog)\n- 增量 (Increment)\n- 燃尽图 (Burn-Down\
  \ chart)\n\n上述列表显示了 Scrum 框架的强制产物。在某些情况下，Scrum 团队需要其他类型的产物。\n\n让我们详细讨论这四个强制性产物：\n\
  \n## 项目待办列表 (Project Backlog)\n\n基本上，该产物是一组 `Scrum team` 必须添加到产品中的功能/特性。它为团队提供了用于改进项目增量的信息。\n\
  \n项目待办列表规定了项目所需的函数、特性、修复、增强和需求。该列表中的事项具有以下属性：\n\n- 价值 (Value)\n- 顺序 (Order)\n- 描述\
  \ (Description)\n- 估算 (Estimate)\n\nScrum 实践者在引用上述任何属性时使用“用户故事”（user story）这一术语。通常，`product\
  \ owner` 必须负责与项目待办列表相关的所有方面（例如内容、排序、可用性等）。\n\n该产物随着项目的进展而演变。初始版本可能只包含最基础的需求。随着 `Scrum\
  \ team` 获取更多项目信息，项目待办列表将进一步开发。`product owner` 必须定期更新此产物以保持其有效性。基本上，只要与其相关的产品存在，项目待办列表就会存在。\n\
  \n随着团队开发产品，项目待办列表会变成一个更大、更详细的列表。此外，技术、市场状况或业务需求的变化可能会影响项目待办列表。这就是许多人将此待办列表视为“活”输出的原因。\n\
  \n项目待办列表的精炼涉及向产物中的事项添加细节、估算和优先级。这是一个由 `product owner` 执行的持续过程。整个团队决定何时以及如何进行精炼。\n\
  \n重要说明：`product owner` 可以根据其情况随时更新项目待办列表。\n\n通常，高优先级的待办事项比低优先级的更清晰、更明确。清晰的细节允许团队成员做出正确的估算。\n\
  \n此产物允许团队成员精炼需求，以便在后续迭代中使用。`Scrum team` 可以开发的待办事项被视为已准备好用于下一次迭代计划阶段。\n\n## 迭代待办列表\
  \ (Sprint Backlog)\n\n该产物是为迭代选择的项目待办事项与创建增量并实现迭代目标策略的结合。\n\n这种待办列表规定了可以添加到下一个项目增量的功能。它还定义了将这些功能添加到产品的任务和活动。\n\
  \n随着新任务的产生，成员更新迭代待办列表。团队成员还会定期更新剩余任务。显然，每当添加或完成任务时，通知整个团队是非常重要的。团队还应该从列表中移除不必要的事项。\n\
  \n请记住，只有团队成员可以修改迭代待办列表。此外，此产物对所有团队成员可见且可访问。\n\n## 增量 (Increment)\n\n“增量”一词是指团队完成的项目待办事项。在结束迭代时，增量应该是一个可使用的产品。即使\
  \ `product owner` 现在不想发布，该产品也应该是可用的。\n\n\n\n\n\n整个团队应该对什么被视为增量达成共识。这对于每个 Scrum 团队都有显著不同。然而，每个成员都必须清晰地理解“增量”对团队的意义。这使得成员能够确定项目的进度或完成情况。\n\
  \n关于增量的知识还允许成员识别出必须选择的待办列表项。每个冲刺会议（Sprint session）的目标是创建可用的产品增量。\n\n通常情况下，每个 Scrum\
  \ 团队都应该在一个冲刺内完成一个产品增量。由于增量是可用的产品，产品所有者可以直接将其推向市场。\n\n一些 Scrum 团队将增量知识视为一项要求。这意味着增量知识包含在组织的标准、准指南或惯例中。如果增量知识不是强制性的，则\
  \ `ScrumMaster` 必须为项目定义合适的增量。\n\n## 燃尽图 (The Burn-Down Chart)\n\n在冲刺会议期间，团队成员可能会加总项目待办列表中剩余的任务数。Scrum\
  \ 团队在每次每日会议中衡量剩余任务。这种方法允许团队确定他们实现目标的概率并管理进度。\n\n`Burn-Down chart` 是一种用于跟踪团队已完成活动的技术。敏捷实践者已使用这种技术来衡量和管理团队的进度。\n\
  \n产品所有者在每次冲刺评审期间跟踪剩余任务。然后，他/她会将这些任务与之前冲刺的任务进行比较。这种方法有助于产品所有者评估团队完成分配任务的进度。\n\n**重要提示：**\
  \ 产品所有者必须与每个利益相关者共享这一产物。\n\n## 结论\n\nScrum 涉及被称为“产物”的各种输出。在实施 Scrum 框架时，你必须生成并使用这些产物。通过这样做，你可以增加实现项目目标的概率。\n\
  \n## 第 5 章：用户故事 (The User Stories)\n\n在“软件开发”行业中，产品功能发挥着重要作用。这些功能吸引消费者并鼓励他们购买或使用完成的产品。在通用术语中，产品功能被称为“需求”。软件生成项目的成功取决于精确获知用户需求并将其整合到完成的产品中。这意味着团队成员在启动任何项目之前，应该知道他们需要处理的需求或产品功能。\n\
  \n美国软件工程师肯特·贝克（Kent Beck）在 1999 年创造了“用户故事”这一术语。用户故事是从用户的角度叙述的，它告知软件开发人员终端用户的需求，而不是产品能为他/她做什么。开发视角从“以产品为中心”转变为“以用户为中心”。由于其有效性，用户故事成为使用任何“敏捷”框架的团队的标准需求。\n\
  \n涉及 Scrum 框架时，项目待办列表作为用户故事的集合。`ScrumMaster` 必须在冲刺计划阶段识别、优先排序并讨论这些用户故事。\n\n在大多数情况下，Scrum\
  \ 团队根据项目的用户故事制定估算和目标。\n\n## 用户故事的结构 (The Structure of a User Story)\n\n用户故事遵循以下格式：\n\
  \n作为一个<用户类型>，\n\n我需要<完成一项任务>，\n\n这样我就可以<获得目标/享受收益/得到某些>。\n\n让我们分析用户故事是如何形成的。在这里，让我们假设一个银行客户想从\
  \ ATM 机取款。\n\n### 用户故事——客户的 ATM 取款\n\n作为一名客户，我需要从 ATM 机取款，这样我就可以在不用银行的情况下获得所需的现金。\n\
  \n## 验收标准 (The Acceptance Criteria)\n\n用户故事涉及验收标准（即衡量用户故事有效性的测试）。验收标准帮助 Scrum 团队分析用户故事对当前项目的影响。\n\
  \n以下是上述用户故事的简单验收标准：\n\n### 第一条验收标准：\n\n**前提条件 (Given Information):**\n* 客户信用良好。\n\
  * 借记/信用卡是可以接受的。\n* 机器有足够的现金。\n\n**状况 (Situation):**\n* 客户需要钱。\n\n**结果 (Then):**\n\
  * 确保正确账户了费用。\n* 确保机器吐出的金额正确。\n* 确保机器返回了客户的借记/信用卡。\n\n### 第二条验收标准：\n\n**前提条件 (Given\
  \ Information):**\n* 客户账户资金不足。\n* 客户卡片是可以接受的。\n\n**状况 (Situation):**\n* 客户需要钱\n\n\
  **结果 (Then):**\n* 在屏幕上显示拒绝信息。\n* 确保机器没有取出任何钱。\n* 确保机器返回了卡片。\n\n## 如何编写用户故事 (How\
  \ to Write a User Story)\n\n由于项目待办列表持有用户故事，产品所有者负责管理项目的用户故事。然而，产品所有者并不是唯一可以写用户故事的人。基本上，任何团队成员都可以完成这项任务。这意味着\
  \ `ScrumMaster` 可以将这一责任分散给整个团队。\n\n## 用户故事中的非功能性需求 (The Non-Functional Requirements\
  \ in a User Story)\n\nScrum 团队可以将非功能性需求纳入用户故事中。在上面的示例中，非功能性需求是 ATM 机 24/7 可用。\n\n\
  ## 如何管理用户故事 (How to Manage a User Story)\n\n你应该使用项目待办列表来管理用户故事。通常，Scrum 团队根据其重要性安排用户故事。最重要的故事会被充分完善，而不重要的故事则会被最少处理。对于每个冲刺，产品所有者在冲刺待办列表中记录最重要（且最详细）的用户故事。在向任何待办列表添加用户故事时，产品所有者会检查其优先级：他/她将根据优先级将用户故事放在项目待办列表中。\n\
  \n**重要提示：** 团队成员可以根据自己的情况移除或重新调整用户故事的优先级。\n\n## 用户故事提供的利益 (The Benefits Offered\
  \ by User Stories)\n\n* 用户故事帮助开发小组关注终端用户。这很重要，因为最终终端用户会在产品上市后购买并使用。因此，用户故事帮助 Scrum\
  \ 团队与终端用户建立联系。\n* 用户故事的结构帮助 Scrum 团队确定终端用户想要实现的目标/价值/收益。\n* 验收标准是用户故事的一个重要方面，可以帮助\
  \ Scrum 团队客观地分析他们的项目。\n* 团队成员在处理项目时可能会修改用户故事。例如，如果范围太大，他们可以将用户故事拆分为更小的。团队成员还可能更改用于项目的验收标准。\n\
  * 由于 Scrum 团队每次冲刺结束时向客户交付产品增量，他们可能会获得后续冲刺所需的反馈和建议。\n\n## 结论\n\n用户故事让你更接近项目的用户；因此，这些故事可以帮助你生成可用的产品并避免意外结果。\n\
  \n## 第 6 章：估算 (Estimation)\n\nScrum 团队应该在计划阶段进行估算。估算的目的是根据优先级和团队能力对用户故事进行分析。产品所有者确保高优先级的故事是易理解的、可用于估算的，并包含在项目待办列表中。\n\
  \n由于整个团队负责完成和交付项目增量，在选择用户故事时要格外小心。团队成员需要根据增量的目标大小和项目的整体努力做出决策。\n\n\n\n\n\n# 估算使用的技术\n\
  \n在进行估算时，请关注每个用户故事的复杂/困难程度。以下是你可以用于评估用户故事难度或复杂性的量表：\n\n- `数字数字 (The Numeric Sizing)`–这是一个从\
  \ 1 到 10 的量表。\n- `尺码 (Shirt Sizes)`–（S, XS, M, L, XL 等）\n- `斐波那契数列 (The Fibonacci\
  \ Sequence)`–在该量表中，你在前一个数字的基础上加上它。和将作为下一个数字。\n\n## 扑克估算法\n\n在这种方法中，你将通过玩类似扑克牌的游戏来得出估算。整个团队都可以帮助实施这种方法。通过`扑克估算\
  \ (Poker Estimation)`，你可以无需花费太多精力和生成可靠的估算。\n\n这种方法需要多副扑牌。使用牌上打印的数字，遵循`斐波那契数列`。牌上的数字代表故事点（即用于衡量用户故事的数值）。\n\
  \n每个成员都应该有一副牌。你必须指定一名主持人——此人将阅读`用户故事 (User Story)`的描述/解释。产品所有将回答会议期间提出的任何问题。\n\n\
  团队成员（也称为“估算者”）应通过私自选择纸牌来表达他们的估算。估算者在所有人选择完牌之前应隐藏自己的牌牌。一旦所有人选择了纸牌，他们应该同时揭示他们的估算。\n\
  \n在第一轮中，估算可能会差异很大。每位估算者都应该解释他们的估算。确保不要问任何个人问题——团队成员应该专注于解释他们的意见/决定。\n\n当用户解释他们的意见时，主持人应该做笔记。这些笔记可以帮助团队开发用户故事。一旦一轮完成，每个成员应该进行另一次估算。他们将隐藏自己的牌，直到所有人都做出选择。然后，他们将同时揭示牌。\n\
  \n重复此过程，直到你得到单一的估算结果。请记住，估算所需的轮数可能取决于你正在处理的用户故事。\n\n## 扑克估算法中使用的方法\n\n- `类比 (Analogy)`–这种方法要求你比较用户故事。基本上，你应该将当前的用户故事与你已经实现的故事进行比较。由于这种方法基于实际数据，它能产生准确的结果。\n\
  - `拆分 (Disaggregation)`–在在这种估算方法中，你将一个用户故事分成更小的故事。冲刺中使用的用户故事通常持续三到六天；因此，如果你遇到一个持续七天或以上的`用户故事`，你必须将其分为更小、更易管理的部分。作为额外奖励，这种方法可以帮助确保你有具有可比性的用户方法。\n\
  - `专家意见 (Expert Opinion)`–这种方法需要行业专家的反馈/建议。由于每个团队成员都紧密参与`Scrum 项目`，他们对该主题拥有足够的知识和经验；因此，他们可以被视为“专家”。\n\
  - 在这里，专家将根据他们的经验和知识提出意见/估算，而不是根据直觉。\n\n## 结论\n\n扑克法是一种有趣且高效的方法，你可以用它生成`Scrum` 估算。由于它允许人们分享和讨论他们的意见，团队将获得关于当前用户故事的更多信息。\n\
