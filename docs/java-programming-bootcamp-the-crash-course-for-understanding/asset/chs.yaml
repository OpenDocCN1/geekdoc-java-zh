  1. 将面包片烤好并冷却。\n2. 将红洋葱、奶士、芥末酱、深色啤酒和伍斯特酱混合，堆放在烤好的吐司上。\n3. 放在烤架模式下烤至金黄色。\n4. 搭配一杯茶食用。\n\
  \n### 3. 血橙色胡萝卜沙拉\n\n**食材：**\n* `10 根` 中等胡萝卜，切片\n* `3 个` 血橙子\n* 一小撮糖\n* `200ml`\
