  \ World!\n\n### 空格与换行\n\n这种脚本语言忽略程序内部的制表符、空格和换行符。这意味着你可以使用这些元素使你的 JavaScript 代码更易读、更易理解。\n\
  \n### 分号\n\n与其他计算机语言（例如 `C++`）类似，JavaScript 要求你使用分号来结束简单语句。然而，如果你的语句是分行输入的，你就不需要添加分号。例如，下面的代码即使没有分号也能正常运行：\n\
  \n![](img/image01881.jpeg)\n\n### JavaScript 语句的大小写敏感性\n\n这种编程语言是区分大小大小的。例如，“`WORD`”、“`Word`”和`word`”在\
  \ JavaScript 中被视为三个不同的实体。这意味着在处理函数、关键字、变量和其他标识符时，你必须保持字母大小写的一致。\n\n### JavaScript\
  \ 注释\n\n在 JavaScript 中创建注释时，你必须记住以下规则：\n\n*   该语言忽略放置在 `//` 符号和行尾之间的所有文本。\n*   你可以使用\
