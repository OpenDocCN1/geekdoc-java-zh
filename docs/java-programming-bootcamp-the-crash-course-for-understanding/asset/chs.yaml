  \ 章–慢炖锅牛肉菜谱\n- 第 5 章–慢炖锅海鲜菜谱\n- 第 6 章–慢炖锅蔬菜菜谱\n- 第 6 章–慢炖锅甜点菜谱\n- 结论\n\n# 引言\n如今生活比以前忙，时间过得飞快。总是想做更多，但因为缺乏时间而无法做到。这适用于日常活动和爱好，包括烹饪。\n\
  \n烹饪是现代世界大多数人倾向于放弃的——外卖和比萨外送似乎是微波食品包、方便面以及所有可以自动食用的食品一样受欢迎的选择。问题是，这些东西并不真正健康，会损害你的健康。\n\
  \n然而，传统的餐需要花费很长时间烹饪和大量的精力。例如，一道牛肉菜可能平均需要 2 小时来准备。好吧，你可能负担不起在只做晚餐时花费这么多时间。好消息是，现在你可以在休息甚至睡眠时烹饪美味健康的食物——多亏了慢炖锅（crockpot）！\n\
  \n这本书包含了如何准备快速、健康且美味的慢炖锅美食的证明步骤和策略。每一章都包含了易于遵循的菜谱，利用你喜欢的食材，如鸡肉、面食、猪肉、牛肉和蔬菜等。所有的菜谱都是健康的，适合想要维持平衡生活的人。菜谱提供了步骤说明和易于获取的食材，让烹饪变得简单且有趣。如何保持更多风味的额外提示也会提供。\n\
  \n这是一本将改变你与家人烹饪方式的慢炖锅菜谱书。现在你只需要把你想的东西丢进去而不必担心时间。感谢你下载《14 天慢炖锅计划：快速快捷的“丢入式”晚餐》。\n\
  \n我希望你喜欢！\n\n# 第 1 章：慢炖锅概述\n你可能好奇这些慢炖锅菜谱是怎么。基本上，“慢炖锅”一词指的是用于烹饪——更具体说是慢炖的电器器具的通用品牌或商标。它由三个部分组成：加热装置、玻璃盖和锅本身。\n\
  \n有了这种烹饪设备，口水流的菜肴可以轻松完成，甚至在你休息时。你只需要等待，然后品尝慢炖美食。\n\n慢炖锅是制作炖菜、汤和工作日快速晚餐的极佳选择。你可能无法相信，它还能做新鲜面包。这种烹饪工具利用湿热缓慢烹饪食物，使其可以在无人看管的情况下煮几个小时。通过这种方式，你可以像在普通锅中制作同样的食物。\n\
  \n那么，慢炖锅是如何烹饪食物的？\n\n通常，慢炖锅由位于底部和侧面的加热元件组成。它释放湿热，在低热或华氏 170 到 260 度之间烹饪食物。\n\n由于容器密封和直接加热产生的蒸汽会杀死细菌，并使烹饪非常有效。慢炖锅以能够软化肉类闻名。\n\
  \n所以无论你想做肉块、鸡肉肴还是汤，后续章节介绍的慢炖锅菜谱绝对适合你。\n\n\n\n鸡肉质质丰富，是蛋白质的极佳来源。这里是一些你可以在家里尝试的出色慢食锅食谱，特别是在忙碌的工作日：\n\
  \n## 食谱 1：甜味大蒜鸡\n\n这是一道简单的食谱，可以使用厨房里的常备食材烹制。它与烤蔬菜或糙米搭配最为完美。\n\n**你将需要：**\n- 4 块去皮鸡腿\n\
  - 5 汤匙蜂蜜\n- 半杯番茄酱\n- 半杯酱油\n- 4 瓣末大蒜\n- ½ 茶匙罗勒叶（干）\n\n**准备方法：**\n- 将除鸡肉以外的所有原料混合制成腌制料。\n\
  - 将鸡块放入慢食锅中，然后淋入混合物。确保肉类被裹匀。\n- 烹煮 6 到 7 小时。享用！\n\n**小贴士：** 你也可以用锡纸包住鸡块，这样煮得更均匀，肉质水分更充足。此外还更容易清理。\n\
  \n## 食谱 2：奶油蘑菇鸡肉面\n\n这道菜准备非常简单，但味道就像大厨的手艺一样——细腻且顺滑。\n\n**你将需要：**\n- 4 块去皮鸡胸肉（去骨）\n\
  - 240 克切片香菇\n- 240 克切片口蘑菇\n- 半杯白葡萄酒\n- 240 克奶油奶起士\n- 300 克或一罐蘑菇奶油\n- 1/3 杯黄油\n-\
  \ 250 克极细意大利面\n- 切碎的葱段\n\n**准备方法：**\n- 烧水，根据包装说明煮面条。备用。\n- 用油中火煎热锅，将鸡肉煎至金黄色（可选）。\n\
  - 在压力锅中混合蘑菇奶油、白葡萄酒、黄油和奶油奶起士，然后将鸡肉铺在上面。\n- 低火慢炖 5 小时。\n- 出锅后撒上新鲜的葱段。搭配煮好的面一起吃。享用！\n\
  \n## 食谱 3：清爽柠檬鸡\n\n这是一道汁水充足且风味丰富的菜肴，你一定会想再吃一次。它最适合搭配糙米或面条。你甚至可以单独吃。\n\n**你将需要：**\n\
  - 1 公斤鸡胸肉\n- ¼ 杯柠檬汁\n- 1/3 杯水\n- 3 瓣末大蒜\n- ¼ 杯黄油\n- 一茶匙切碎的新鲜欧芹\n- 一茶匙鸡粉\n- 一小撮干牛里香粉\n\
  - 一小撮盐和胡椒\n\n**准备方法：**\n- 将盐、胡椒和干牛里香在碗中混合。然后直接涂抹在鸡肉上。\n- 在平底锅中融黄油，将鸡肉煎 3 到 4 分钟。\n\
  - 将鸡肉放入慢食锅，接着加入水、鸡粉和柠檬汁。\n- 低火慢炖 6 小时，或高火慢炖 3 小时。煮好后加入欧芹。享用！\n\n## 食谱 4：慢食锅风味鸡肉\n\
  \n通过在慢食锅中慢炖，为你平常的鸡肉烧增添独特的风味。它最适合搭配全麦面包、炸/烤土豆食用。\n\n**你将需要：**\n- 冷冻鸡胸肉，去皮\n- 1/ 杯红糖\n\
  - ½ 杯酸奶\n- 350ml 烧烤酱\n- 30ml 伍斯特酱\n\n**准备方法：**\n- 将冷冻鸡胸肉放入慢食锅。\n- 将剩余原料在碗中混合，充分搅拌，然后淋在鸡肉上。\n\
  - 低火煮 6 到 7 小时，或高火煮 3 到 4 小时。\n\n**小贴士：** 用铝箔垫锅内，可以使烹饪效率更高且方便清洗。\n\n## 食谱 5：土豆豆炖肉\n\
  \n在这道食谱中，你将使用红薯，它比普通土豆更健康。花生酱也是中和辣味的原料之一。\n\n**你将需要：**\n- 240 克鸡胸肉，去皮去骨\n- 4 块红薯（切块）\n\
  - 2 罐无盐红豆\n- 2 杯切碎的青椒\n- 一杯切丁番茄\n- 半杯切碎的辣椒\n- 500ml 低盐鸡汤\n- 1 汤匙卡真烤粉\n- 2 汤匙花生酱\n\
  - 3 瓣末大蒜\n\n**准备方法：**\n- 将土豆、豆子、青椒、番茄、辣椒、卡真烤粉、鸡汤和大蒜放入锅中。\n- 加入鸡肉块，确保所有食材都被裹匀。\n\
  - 高火煮 6 小时，低火可长达 10 小时。\n- 煮好后加入花生酱充分搅拌。上菜并享用！\n\n## 第 3 章–慢食锅猪肉食谱\n\n猪肉绝对是你餐点中的极佳补充。这里有一些以这种食材为特色的有趣慢食锅食谱：\n\
  \n### 食谱 1：嫩滑日烧猪肉\n\n这是一道带有辣椒的猪肉日烧风味绝妙变体。全家人都会喜欢它。\n\n**你将需要：**\n- 1 公斤猪里脊\n- 3\
  \ 根红辣椒，切碎\n- 1 个小洋葱，切碎\n- 半杯日烧酱\n- 1/3 杯红糖\n- 5 瓣末大蒜\n- 一杯鸡汤\n- 2 汤匙橄榄油\n- 一小撮黑胡椒\n\
  \n**准备方法：**\n- 在锅中加热油，煎猪肉。确保各面都煎黄。\n- 混合鸡汤、红糖和日烧酱。放入洋葱、辣椒、黑胡椒和大蒜。\n- 将猪肉放入锅中，淋入酱汁包裹肉类。\n\
  - 煮 6 到 8 小时。\n\n### 食谱 2：手撕肉\n\n这是一道不可思议的猪肉食谱。\n\n**你将需要：**\n- 1 公斤猪里脊\n- 2 杯青椒\n\
  - 4 杯水\n- 半杯烟熏墨西哥辣椒酱\n- 一杯柠檬汁\n- 一把香菜\n- 4 瓣大蒜\n\n**准备方法：**\n- 在慢食锅中加入一些水和半量的烟熏墨西哥辣椒酱，然后放入猪肉。\n\
  - 铺上青椒、香菜和柠檬汁。\n- 低火慢 5 到 10 小时。\n\n### 食谱 3：果香烤猪肉\n\n这是一道像高级料理一样的猪肉食谱。在家里尝试一下。\n\
  \n**你将需要：**\n- 1 公斤猪里脊\n- 一罐蔓越莓酱\n- 3 瓣末大蒜\n- 1/3 杯蜂蜜\n- 一小撮肉豆蔻\n- 一茶匙柠檬皮\n- 一小撮盐和胡椒\n\
  \n**准备方法：**\n- 将猪里脊切成两半放入慢食锅中。用盐和胡椒调味。\n- 混合其余原料并淋在上面。\n- 高火煮 4 到 5 小时。\n\n### 食谱\
  \ 4：慢炖火腿汤\n\n在忙碌的周中晚上回家，带上这道香料火腿蔬菜汤吧，它与玉米饼或米饭是绝配。\n\n**你将需要：**\n- 2 杯切丁猪火腿\n- 1\
  \ 杯胡萝卜\n- 半杯洋葱，切碎\n- 1½ 杯鹰嘴豆\n- ½ 杯芹芹茎\n- ¼ 杯番茄酱\n- 400 ml 低盐鸡汤\n- 一小撮罗勒粉\n- 一小撮盐和胡椒\n\
  - 1 片月桂叶\n\n**准备方法：**\n- 将胡萝卜、鹰嘴豆、芹芹、洋葱、猪火腿和大蒜混合。\n- 用胡椒、罗勒和月桂叶对一切调味。倒入鸡汤、番茄酱和水。\n\
  - 低火慢炖 10 到 11 小时。\n\n### 食谱 5：慢食锅排骨\n\n这是一道简单的经典的猪肉食谱，回到家几分钟后就能享用。\n\n**你将需要：**\n\
  - 750 克 背脊排骨\n- 500 ml 烧烤酱\n- 1 个小洋葱，切碎\n- 2 瓣末大蒜\n- 半杯水\n- 1 片月桂叶\n- 一小撮盐和胡椒\n\n\
  **准备方法：**\n- 在肉上撒上盐和胡椒。\n- 在慢食锅中加入一些水和半量的烧烤酱，然后放入排骨。铺上大蒜、洋葱和月桂叶。\n- 低火慢炖 8 小时，或高火慢炖\
  \ 4 小时。\n- 将烤箱预热至 190 摄氏度。\n- 将排骨放入烤盘，淋上剩余的烧烤酱。\n\n\n\n烘烤 10 至 15 分钟。配上烤土豆或米饭享。祝用餐愉快！\n\
  \n# 第 4 章 – 慢锅牛肉食谱\n\n牛肉确实美味，但由于需要更多时间，烹饪起来困难。因此，这里有一些专门为忙碌人士设计的优质慢锅牛肉食谱：\n\n##\
  \ 食谱 1：亚洲风味牛肉蘑菇这是一道带有亚洲风味的经典牛肉蘑菇。这是一道你应该尝试烹饪的美味香气菜肴。\n\n**你需要：**\n- 1 公斤牛肩肉或牛肋\n\
  - 一杯红酒\n- 一杯鸡汤/牛肉汤\n- 250 克口蘑菇\n- 2 匙生抽\n- 3 匙柠檬汁\n- 2 匙姜，切薄\n- 2 到 3 颗八角\n- 1 个橙子\n\
  - 2 匙切碎洋葱\n- 1 匙玉米淀\n- 一少许盐和胡椒\n\n**准备方法：**\n- 将肉切成 1 英寸大小放入压力锅中。\n- 在锅中混合橙子皮、洋葱、姜、柠檬汁、汤、酒、八角和生抽并煮沸。淋在肉上，煮\
  \ 6 到 8 小时。\n- 在锅中，用 ¾ 杯液体酱汁煮蘑菇。经常搅拌，让水分蒸发。煮 10 到 15 分钟。\n- 将蘑菇加入肉中。撒上一些洋葱。用餐愉快！\n\
  \n## 食谱 2：青椒牛排\n这是一道风味丰富的牛肉菜，最适合搭配面条或白饭食用。尝试一下，你一定会喜欢它。\n\n**你需要：**\n- 500 克牛肉里脊，切成\
  \ 2 到 3 英寸厚\n- 2 个青甜椒，切碎\n- 450 克西红柿，切碎\n- 1 个小洋葱，切碎\n- 4 匙生抽\n- 1 匙红糖\n- 一少许盐\n\
  - 1 匙玉米淀\n- 2 匙橄榄油\n\n**准备方法：**\n- 用盐调味肉类。\n- 热锅，淋入油并将肉煎至金黄色。\n- 将煎好的肉放入慢锅中。\n-\
  \ 将生抽、糖、盐和溶解在少量水玉米淀混合。淋在牛肉上。放入西红柿、洋葱和青甜椒。\n- 低火慢 6 到 8 小时，或高火慢 4 小时。用餐愉快！\n\n##\
  \ 食谱 3：孜然风味丝牛肉\n这是一道极佳的菜，最适合搭配暖和的卷饼或米饭。你也可以搭配奶酪或酸奶油食用，以增加风味。\n\n**你需要：**\n- 500\
  \ 克牛侧腹\n- 1 茶匙孜然粉\n- 1 个切碎的洋葱\n- 1 个青甜椒，切碎\n- 2/3 杯西红柿酱\n- 3 瓣大蒜，切末\n- 一杯牛肉汤\n-\
  \ 1 匙橄榄油\n\n**准备方法：**\n- 热锅，将牛排四面煎黄 - 每面约 3 分钟。\n- 将牛肉放入锅中；倒入番茄酱、甜椒、孜然、洋葱和橄榄油。\n\
  - 确保所有食材混合均匀。低火慢 10 小时，或高火慢 4 到 5 小时。\n- 煮好后，用叉子将肉撕碎，配卷饼或米饭食用。你可以搭配酸奶油来获得额外的风味。\n\
  \n## 食谱 4：火辣牛肉辣椒酱\n这是一道经典美食，带有一丝烟熏味。可以作为玉米片/塔饼酱食用，或淋在白饭上。\n\n**你需要：**\n- 500 克牛肩肉，肉末\n\
  - 250 克肉眼牛排，切成小方块\n- 一杯切碎洋葱\n- 一杯红腰豆\n- 一罐烤西红柿\n- 240 毫升西红柿酱\n- 8 瓣大蒜，切末\n- 1 茶匙辣椒粉\n\
  - 1 匙粉末孜然\n- 3 杯低盐汤\n- 1 匙橄榄油\n\n**准备方法：**\n- 热锅，加油，将肉末煎制 5 到 6 分钟。将煎好的肉放入慢锅中。\n\
  - 将切好的肉眼牛排煎制 7 到 8 分钟并加入锅中。\n- 加入剩余食材并充分搅拌。煮 8 到 10 小时。上菜并享用！\n\n**提示：** 你可以在这道菜上撒上碎奶酪、牛油果片或墨西哥辣椒以增加辣味。\n\
  \n## 食谱 5：烧烤牛胸肉\n制作烧烤牛胸肉超级简单，你每晚都可以吃这道菜而无需流汗。\n\n**你需要：**\n- 1 公斤牛胸肉\n- 1 个小洋葱，切碎\n\
  - 4 匙红糖\n- 1 匙大蒜粉\n- 2 匙伍斯特斯特汁\n- 一杯西红柿酱\n- 1 茶匙红椒粉\n- 1 匙切末大蒜\n- 1/3 杯苹果醋\n- 一杯低盐汤\n\
  - 一少许盐和胡椒\n\n**准备方法：**\n- 在碗中混合红椒粉、大蒜粉、红糖，并涂抹在牛胸肉上。确保侧面都涂上。放入锅中。\n- 在另一个碗中，混合苹果醋、伍斯特斯特汁、西红柿酱并充分搅拌。淋在肉上。\n\
  - 煮 6 到 8 小时。煮好后，将肉放在菜板上。静置 15 分钟。将肉切薄片并在顶部淋上酱汁。用餐愉快！\n\n# 第 5 章 – 慢锅海鲜食谱\n\n海鲜是让你脸上洋溢微笑的东西\n\
  \n## 食谱 1：柠檬鱼片\n这是一道美味鱼菜。这是一道你应该尝试烹饪的美味香气菜肴。\n\n**你需要：**\n- 300 克鱼片\n- 1 个小洋葱，切碎\n\
  - 一杯芹菜\n- 1 匙橄榄油\n- 一少许盐\n\n**准备方法：**\n- 在锅中混合橙子皮、洋葱、姜、柠檬汁、汤、酒和生抽并煮沸。淋在肉上，煮 6 到\
  \ 8 小时。\n- 在锅中，用 ¾ 杯液体酱汁煮蘑菇。经常搅拌，让水分蒸发。煮 10 到 15 分钟。\n- 将蘑菇加入肉中。撒上一些洋葱。用餐愉快！\n\n\
  ## 食谱 2：浓郁青椒牛肉\n这是一道风味丰富的牛肉菜，最适合搭配面条或白饭食用。尝试一下，你一定会喜欢它。\n\n**你需要：**\n- 400 克鱼片\n\
  - 1 个小洋葱，切碎\n- 一杯\n- 芹菜\n- 一少许盐\n\n**准备方法：**\n- 用盐调味肉类。\n- 热锅，淋入油并将肉煎至金黄色。\n- 将煎好的肉放入慢锅中。\n\
  - 将生抽、糖、盐和溶解在少量水玉米淀混合。淋在牛肉上。放入西红柿、洋葱和青甜椒。\n- 低火慢 6 到 8 小时，或高火慢 4 小时。用餐愉快！\n\n##\
  \ 食谱 3：孜然风味丝牛肉\n这是一道极佳的菜，最适合搭配暖和的卷饼或米饭。你也可以搭配奶酪或酸奶油食用，以增加风味。\n\n**你需要：**\n- 500\
  \ 克牛侧腹\n- 1 茶匙孜然粉\n- 1 个切碎的洋葱\n- 1 个青甜椒，切碎\n- 2/3 杯西红柿酱\n- 3 瓣大蒜，切末\n- 一杯牛肉汤\n-\
  \ 1 匙橄榄油\n\n**准备方法：**\n- 热锅，将牛排四面煎黄 - 每面约 3 分钟。\n- 将牛肉放入锅中；倒入番茄酱、甜椒、孜然、洋葱和橄榄油。\n\
  - 确保所有食材混合均匀。低火慢 10 小时，或高火慢 4 到 5 小时。\n- 煮好后，用叉子将肉撕碎，配卷饼或米饭食用。你可以搭配酸奶油来获得额外的风味。\n\
  \n## 食谱 4：火辣牛肉辣椒酱\n这是一道经典美食，带有一丝烟熏味。可以作为玉米片/塔饼酱食用，或淋在白饭上。\n\n**你需要：**\n- 500 克牛肩肉，肉末\n\
  - 250 克肉眼牛排，切成小方块\n- 一杯切碎洋葱\n- 一杯红腰豆\n- 一罐烤西红柿\n- 240 毫升西红柿酱\n- 8 瓣大蒜，切末\n- 1 茶匙辣椒粉\n\
  - 1 匙粉末孜然\n- 3 杯低盐汤\n- 1 匙橄榄油\n\n**准备方法：**\n- 热锅，加油，将肉末煎制 5 到 6 分钟。将煎好的肉放入慢锅中。\n\
  - 将切好的肉眼牛排煎制 7 到 8 分钟并加入锅中。\n- 加入剩余食材并充分搅拌。煮 8 到 10 小时。上菜并享用！\n\n**提示：** 你可以在这道菜上撒上碎奶酪、牛油果片或墨西哥辣椒以增加辣味。\n\
  \n## 食谱 5：烧烤牛胸肉\n制作烧烤牛胸肉超级简单，你每晚都可以吃这道菜而无需流汗。\n\n**你需要：**\n- 1 公斤牛胸肉\n- 1 个小洋葱，切碎\n\
  - 4 匙红糖\n- 1 匙大蒜粉\n- 2 匙伍斯特斯特汁\n- 一杯西红柿酱\n- 1 茶匙红椒粉\n- 1 匙切末大蒜\n- 1/3 杯苹果醋\n- 一杯低盐汤\n\
  - 一少许盐和胡椒\n\n**准备方法：**\n- 在碗中混合红椒粉、大蒜粉、红糖，并涂抹在牛胸肉上。确保侧面都涂上。放入锅中。\n- 在另一个碗中，混合苹果醋、伍斯特斯特汁、西红柿酱并充分搅拌。淋在肉上。\n\
  - 煮 6 到 8 小时。煮好后，将肉放在菜板上。静置 15 分钟。将肉切薄片并在顶部淋上酱汁。用餐愉快！\n\n# 第 5 章 – 慢锅海鲜食谱\n\n海鲜是让你脸上洋溢微笑的东西\n\
