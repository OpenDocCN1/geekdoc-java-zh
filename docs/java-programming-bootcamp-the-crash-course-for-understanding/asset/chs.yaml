  \n# Python 学院\n## 学习 Python 编程基础\n\n我想感谢你并祝贺你下载了《在两周内学会 Python 编程基础》这本书。\n\n这本书包含了关于如何在\
  \ `Python` 中编写和运行程序的经过验证的步骤和策略。书中有你可以作为指南的示例代码和程序。\n\n这本书还包含了对该编程语言的介绍，包括简要历史和 `Python`\
  \ 的基础知识。它还包含了对 `Python` 中特性的详细解释。\n\n再次感谢下载这本书，希望你喜欢它！\n\n## 第 1 章：Python 简介\n\n\
  如果你正在寻找一种以代码可读性为主要关注点的通用、高级编程语言，你应该考虑 `Python`。它的语法允许你用比其他编程语言（如 `C`、`C++` 和 `Java`）更少的代码行表达概念。它支持广泛的编程范式，因此涵盖了命令式、函数和面向对象的编程。此外，它具有全面的标准库、动态类型系统和自动内存管理。\n\
  \n你有许多解释器可以用来安装在不同的操作系统上；因此，你可以在各种系统上执行 `Python`。你甚至可以利用第三方应用程序。如果你不想安装解释器，可以将代码打包成独立的可执行程序，这样你就可以向不同环境有效分分发基于\
  \ `Python` 的软件。\n\n### Python 编程语言简史\n\n`Python` 由 `Guido van Rossum` 在 20 世纪 80\
  \ 年代后期开发。它最初只是一个圣诞项目。Van Rossum 想要为 `C` 和 `UNIX` 黑客将使用的脚本语言创建一个解释器。他的小项目最终升级到了 `Python\
  \ 2.0`，并于 2000 年 10 月发布。这个新版本拥有完整的垃圾回收器和 `Unicode` 支持。`Python 3.0`（也称为 `Python 3000`\
  \ 和 `py3k`）于 2008 年 12 月发布，其特性被回溯到了 `2.6` 和 `2.7` 版本。\n\n### 为什么你应该使用 Python？\n\n\
  编程语言的存在是有原因的。例如，`Python` 的开发是为了让程序员能够创建高效且高产的代码。它的主要目标是帮助初学者轻松、快速地学习一种编程语言。由于学习时间更短，你可以创建更有用的应用程序，而这些应用用更晦涩、复杂的编程语言很难实现。\n\
  \n通过 `Python`，你在编写应用程序时还可以从更短的开发时间内获益。如前所述，`Python` 的代码行比 `C`、`C++` 和 `Java` 少。它的代码实际上短了五到十倍；因此，它更高效、更不复杂。你可以花费更少的时间来开发应用程序，而花费更多时间在对其进行调优和改进。\n\
  \n在检查 Bug 和错误时，你所使用的编程语言易于阅读和理解至关重要。如果编程语言太复杂，你在编写代码和检查程序时可能会遇到困难。使用 `Python`，代码更容易读和更容易写；因此，你可以轻松地解释代码并进行必要的更改。\n\
  \n此外，`Python` 还有许多其他用途。它是基于浏览器的脚本应用程序、创建极佳的用户界面和粗略的应用示例、与数据库交互、处理 `XML` 以及设计数学、工程和科学应用程序的理想选择。\n\
  \n### Python 与 C#、Java 和 Perl\n\n你可能会发现将编程语言进行相互比较是一项主观任务。通常，它们的差异取决于个人喜好。尽管如此，有时这种比较是有科学数据支持的。无论如何，你必须记住，不存在一种全能的编程语言。作为程序员，你只需要找到一个最适合你目标或需求的语言即可。\n\
  \n#### C#\n\n如果你有 `Java` 背景，你可能会发现 `C#` 和 `Java` 非常相似。尽管如此，与 `Java` 相比，`C#` 仍然有自己的优缺点。微软声称，开发\
  \ `C#` 的主要目标是产生更好的 `C` 和 `C++`。然而，与 `C#` 相比，`Python` 具有更好的科学工程应用以及更好的跨平台支持。在 `C++`\
  \ 方面它更具扩展性。它更容易学习和理解，并允许使用各种环境。它的代码也更简洁。\n\n#### Java\n\n程序员将 `Java` 视为一种全能的编程语言。多年来，他们一直在寻找一种随处运行和编写的语言，并发现了\
  \ `Java` 可以在不同平台和环境中良好运行。尽管如此，`Python` 也是一种全能的编程语言。它与 `Java` 非常相似，只是代码更简洁，且更容易学习和理解。\n\
  \n#### Perl\n\n`PERL` 代表实用提取和报告语言。它是一种适用于从另一个数据库获取和处理数据的编程语言。相比之下，`Python` 比 `PERL`\
  \ 更好，因为它更容易阅读、实现、学习和理解。它具有更好的 `Java` 集成和数据保护。它也有更少的平台偏见。\n\n### 为什么 Python 是初者的理想选择？\n\
  \n如果你刚刚开始编程，你可能考虑 `Python`。它对初学者来说是理想的，因为它具有一致且简单的语法以及丰富的标准库，允许你完成多个项目。涉及的任务不仅限于常见的四功能计算器和平衡检查程序。\n\
  \n当你习惯用 `Python` 编写代码时，你会发现编写实际应用实际上很容易。交互式解释器还允许你测试语言特性。在 `Python` 中，你可以专注于核心编程技能，如程序分解和数据类型设计，以及基础概念，如过程和循环。\n\
  \n\n\n\n\n如果你以前从未用过任何编程语言，请不要担心。即使是没有任何编程知识或经验的人，也可以轻松掌握 Python 编程语言的基础。\n\n至于安装，Python\
  \ 的安装非常简单。大多数 UNIX 和 Linux 发行版实际上已经将其包含在软件包中。如果你从惠尔-惠德（HP）购买了 Windows 电脑，你可以直接使用\
  \ Python，因为它随系统预装了。\n\n为了让你操作更方便，你应该学习如何使用文本编辑器以及集成开发环境（IDE）。阅读带有示例代码和程序的编程书籍也会对你有帮助。\n\
  \n关于版权，Python 的开发者允许程序员对源代码进行任何他们想做的操作，只要他们不要忘记包含版权声明即可。版权规则并不严格。你甚至可以销售二进制和源码形式的副本，以及涉及\
  \ Python 的产品。然而，如果你想使用其标志（logo），请确保你获得了许可。\n\nPython 非常稳定。事实上，它的稳定性足够日常使用。你可以预计在六到十八个月内出一个新版本。开发者会发布错误修复版本，以确保新版本比之前的版本更好。\n\
  \n如果你想进行静态分析或搜索 bug，可以使用 `Pylint` 或 `PyChecker`。前者是一个检查模块是否遵守编码标准并允许自定义插件的工具。后者是一个在源码中发现\
  \ bug 的静态分析工具。\n\n既然你已经学习了编程语言的基础知识，你可能仍然好奇 Python 是怎么命名的。Guido van Rossum 喜欢蛇吗？事实上，他喜欢的是名为《蒙提\
  \ Python 的飞行马》（Monty Python’s Flying Circus）的电视节目，而不是爬行动物。\n\n在 Python 开发期间，他正在读这部喜剧剧的脚本，认为\
  \ `Python` 是一个合适的名字，因为它短、独特且具有恰好处的神秘感。事实上，文档中允许并实际上鼓励引用该喜剧节目的内容。\n\n# 第 2 章：语法\n\
  \nPython 具有简单且直观的语法。它甚至鼓励程序员在不使用准备好的样板代码的情况下编写程序。`print` 指令实际上是所有指令中最简单的。它打印行并包含换行符。你可能会注意到，在编程语言的新主版本中\
  \ `print` 指令有所不同。\n\nPython 2.0 是更常用的版本，而 Python 3.0 支持最新特性且语义上更正确。无论如何，`print`\
  \ 语句在 2.0 版本中不视为函数；因此，你可以在代码中不包含括号的情况下调用它。另一方面，`print` 语句在 3.0 版本中被函数；因此，如果你想调用它，必须使用括号。\n\
  \n## 交互模式编程\n\n你可以在不同的模式下执行程序。如果你在调用解释器时不传递脚本文件作为参数，你将得到如下：\n\n```\n$ python\n\n\
  Python 2.4.3 ( #1, Nov 11 2010, 13:34:43 )\n[GCC 4.1.2 20080704 ( Red Hat 4.1.2–\
  \ 48 )] on linux2\n\nType“help”，“copyright”,“credits” or“license” for more information.\n\
  \n>>>\n```\n\n当你看到这个提示符时，可以输入所需的文本然后按回车。在这个例子中，我们将使用单词`Monty Python and the Holy\
  \ Grail`。\n\n```\n>>> print“Monty Python and the Holy Grail” ;\n```\n\n注意，如果你使用的是编程语言的更新版本，你需要在\
  \ `print` 语句中使用左右括号，如下所示：\n\n```\n>> print (“Monty Python and the Holy Grail” )\
  \ ;\n```\n\n无论你使用哪个版本，如果你运行上面所示示例代码，你将得到以下输出：\n\n```\nMonty Python and the Holy\
  \ Grail\n```\n\n## 脚本模式编程\n\n如果你在调用解释器时带有脚本参数，脚本将开始执行并持续运行直到完成。完成后，解释器将不再处于状态。考虑以下示例。示例程序写在脚本中并带有\
  \ `.py` 扩展名：\n\n```\nprint“Monty Python’s Flying Circus”;\n```\n\n如果你在 `test.py`\
  \ 文件中输入上述源代码并运行它：\n\n```\n$ python test. Py\n```\n\n你将获得以下输出：\n\n```\nMonty Python’s\
  \ Flying Circus\n```\n\n执行脚本的另一种方法是修改 `.py` 文件，例如：\n\n```\n#! /usr /bin /python\n\
  \nprint“Monty Python’s Flying Circus”;\n```\n\n如果你这样运行它：\n\n```\n$ chmod + x test.py\n\
  $ ./test.py\n```\n\n你将得到以下输出：\n\n```\nMonty Python’s Flying Circus\n```\n\n## 标识符\n\
  \n标识符基本上用于确定函数、变量、模块、类以及任何其他对象。它以下划线 `_` 或字母开头。随后是数字、下划线、零或其他字母。作为程序员，可以自由使用任何字母或数字。你可以使用大写和小写字母。\n\
  \n然而，你不能在标识符中使用点符号和特殊字符，例如 `@`、`$` 和 `%`。此外，Python 是一种大小敏感的编程语言。这意味着在代码中使用大写和小写字母时必须小心。例如，`wendy`、`Wendy`\
  \ 和 `WENDY` 是相同的名称，但在 Python 中被视为三个不同的标识符。\n\n### Python 标识符规则\n\n在 Python 中编写程序时，你必须遵守以下规则：\n\
  \n*   类名必须以大写字母开头，而标识符其余部分必须以小写字母开头。\n*   下划线开头的标识符是私有的。\n*   双下划线开头的标识符是强私有的。\n\
  *   双下划线结尾的标识符是语言定义的特殊名称。\n\n### 关键字\n\n注意某些词不能作为常量、标识符名或变量。所有关键字都使用小写字母。以下是关键字表：\n\
  \n| And | Assert | Break | Class | Continue |\n| def | del | elif | else | except\
  \ |\n| exec | finally | for | from | global |\n| if | import | in | is | lambda\
  \ |\n| Not | or | pass | print | raise |\n| return | try | while | with | yield\
  \ |\n\n## 缩进与行\n\nPython 没有使用大括号来指示类定义和函数的块。同样，也不包含流程控制。如果你想标记此类代码块，必须使用行缩进。你可以调整空格，但要确保块中的所有语句都缩进。为了帮助你理解，考虑以下示例代码：\n\
  \n```\nif True:\n    # 这显示了精确四个空格的缩进\n    print“Correct”\nelse:\n    print“Incorrect”\n\
  ```\n\n运行第一个示例会生成输出。然而，运行第二个会导致错误。为什么会发生这种情况？你必须记住，在 Python 中，块是通过缩进相同数量的连续行形成的。\n\
  \n```\nif True\n    print“Input”\n    print“Correct”\nelse:\n    print“Input”\n\
  \    print“False”\n```\n\n### 缩进误言\n\n关于 Python 缩进存在某些误言。以下是一些：\n\n*   每个源代码中都需要空白字符。\n\
  \n\n\n\n实际上，你并不非要在所有的源代码中使用空白符。空白并不一定具有重要性，尽管缩进是有。正如你所学到的，缩进是位于语句最左侧的空白。在其他任何地方，空白都没有那么重要，并且可以省略。你可以以你喜欢的任何方式使用它，甚至在程序的任何地方插入任意的空白或不包含任何内容的空行。\n\
  \n此外，缩进的精确数量并不真正重要，但嵌套块的相对缩进非常重要。当你使用隐式或显式的续接行时，缩进级别实际上不会被识别。例如，你可以将一个列表跨越多行。缩进完全不重要。看下面的示例：\n\
  \n```python\nfoo = [\n\n                                ‘ a string ‘ ,\n       \
  \                         ‘ another string ‘ ,\n                               \
  \   ‘ a short string ‘\n]\n\nprint foo\n```\n\n如果你运行上述代码，你将得到以下输出：\n\n`[ ‘ a string\
  \ ‘ , ‘ another string ‘ , ‘ a short string ‘ ]`\n\n这是另一个示例：\n\n```python\nbar =\
  \ ‘ look at this example ‘ \\\n               ‘ of a long string ‘ \\\n        \
  \                          ‘ that is split ‘ \\\n                              \
  \    ‘ across multiple lines ‘\n\nprint bar\n```\n\n如果你运行上述代码，你将获得以下输出：\n\n`look\
  \ at this example of a long string that is split across multiple lines`\n\n*   在你的程序中应该使用某种风格的缩进。\n\
  \n嗯，这一点既是正确的也是不正确的。你可以将内部块写在一行上而不进行缩进。你可以使用以下“if 语句”的任何一个版本，因为它们都是有效的并且产生相同的输出：\n\
  \n```python\nif 1 + 1 == 2 :\n\n              print “ foo”\n              print\
  \ “ bar ”\n              w = 99\nif 1 + 1 == 2 :\n             print “foo” ; print\
  \ “ bar “ ; w = 99\n\nif 1 + 1 == 2 : print “ foo “ ; print “ bar “ ; w = 99\n```\n\
  \n作为一名程序员，你可能希望将代码块写在单独的行，如第一个示例所示。然而，有时会有相似的 `if` 语句，你可以方便地将它们写在每一行。\n\n如果你决定将代码块写在单独的行，那么你必须遵循缩进规则。你必须使包含的块的缩进比\
  \ `if 语句` 多。\n\n结论是，在 Python 中你将被迫遵守这条规则，除非你选择让程序的结构变得更加复杂。编程语言不允许使用虚假缩进来混淆程序结构。\n\
  \n记住，在 Python 编程语言中，块是通过缩进表示的；因此，缩进在每个程序中都是相同的。代码格式的一致性使得程序更容易阅读和理解。\n\n*   Python\
  \ 中不能混合使用空格和制 Tab。\n\n是的，这一点是正确的，即使对于用 C 语言编写的程序也是。你不能安全地混合空格和制表符。尽管这对你的编译器来说并没有巨大的区别，但在处理代码时可能会遇到困难。例如，如果你将一个\
  \ C 源代码移动到具有不同制表位的编辑器，将更容易引入 bug。\n\n再次，记住混合空格和制表符进行缩进是不理想的。你可以单独使用空格或制表符。此外，你可能想完全避免制表符。毕竟，制表符的语义并没有那么明确，在不同类型的编辑器和系统中可能会有不同的显示。\n\
  \n制表符在复制和粘贴过程中，以及当源代码插入 Web 页面或任何其他类型的标记代码时，也经常被错误地转换或破坏。\n\n*   可以跳过缩进并改用关键字。\n\
  \n是的，你可以跳过缩进而只使用关键字。实际上有一些程序员倾向于使用 `endif` 而不是缩进来表示代码块的结束。\n\n嗯，这并不是 Python 中一个识别的关键字。该语言的早期版本带有一个工具可以转换……\n\
  \n*   缩进如何？\n\n缩进在每个程序中都是相同的。代码格式的一致性使得程序更容易阅读和理解。\n\n### 多行语句\n\n当你结束一个语句时，你可以使用新行，或者在想继续时使用续接符号\
  \ `\\`。为了帮助你进一步理解这一点，请考虑以下示例：\n\n```python\ntotal = first_item \\\n            \
  \   second_item \\\n                                  third_item\n```\n\n当你编写包含在括号（如\
  \ `{}`、`()` 和 `[]`）中的语句时，你不需要使用续接符号。例如，如果你想显示一年的月份，你可以简单地写：\n\n```python\nyear =\
  \ [‘January’ ,‘February’ ,‘March’ ,‘April’ ,‘May’ ,‘June’ ,‘July’ ,‘August’ ,‘September’\
  \ ,‘October’ ,‘November’ ,‘December’ ]\n```\n\n你允许在一行上写多个语句，或创建多个组作为 suite（块）。在涉及编写多个语句时，记住分号\
  \ `;` 的包含是关重要的。分号允许你编写尽可能多的语句，只要它们不启动新的代码块。考虑以下示例：\n\n```python\nimport sys ; y\
  \ =‘bar’ ; sys.stdout.write(y +‘\\n’)\n```\n\n那么什么是 suite 呢？嗯，它们是由代码块组成的语句组。复合或复杂的语句，如\
  \ `if`、`while`、`def` 和 `class` 需要一个 suite 和头部行。\n\n那么什么是头部行呢？它们以关键字开始语句并以冒号 `:`\
  \ 结束。此外，它们后面跟着组成 suite 的一行或多行。考虑以下示例：\n\n```python\nif expression :\n    suite\n\
  elif expression :\n    suite\nelse :\n    suite\n```\n\n### 引号\n\n作为一名程序员，在定义字符串字面量时允许使用单引号\
  \ `‘`、双引号 `“` 以及三引号 `‘’’` 或 `“””`。尽管如此，请确保在字符串的开始和结束处使用相同类型的引号。通常，三引号用于跨越跨行的字符串。看下面的示例：\n\
  \n```python\nparagraph =“””你正在阅读一个包含多行和多个句子的段落示例。你是一个优秀的程序员。“””\n```\n\n\n\n\n当涉及到注释时，你应该使用哈希符号（`#`）开头。然而，这个哈希符号不应该出现在字符串字面量中。此外，该符号之后直到行尾的字符都应该被包含在注释中。在\
  \ Python 中，解释器不会识别注释。为了帮助你进一步理解这一概念，请看以下示例：\n\n```python\n# This is the first comment\n\
  \nprint“ Monty Python’s Flying Circus is a British sketch comedy series.” ;\n\n\
  # This is the second comment\n```\n\n如果你运行上面的示例，你将获得以下输出：\n\nMonty Python’s Flying\
  \ Circus is a British sketch comedy series.\n\n你也可以在表达式或语句之后编写另一个注释，例如如下：\n\n```python\n\
  name =“Wendy” # This is a sample comment\n```\n\n如果你想对多行进行注释，你也可以这样做。例如：\n\n```python\n\
  # This is a sample comment.\n# This one is also a comment.\n# This is another comment.\n\
  # This comment is written by Wendy.\n```\n\n## 空行\n\n这些行在 Python 编程语言中不被识别。尽管如此，它们非常类似于注释。它们包含了空白字符甚至注释。你必须在交互式解释器会中使用空行来结束多行语句。\n\
  \n## 第 3 章：数据类型\n\n在 Python 中，输入数据根据不同的类别进行分类。分类的主要目的是帮助像你这样的程序员更高效地处理信息。这些类别充当数据存储位置，你每当运行\
  \ Python 平台时都可以访问它们。\n\n### 变量\n\n变量包含了被专门分配给它们的值。如果你正在为应用程序编写复杂的代码，你可能希望将信息存储在这些变量中。不要担心，因为你可以在需要时随时访问它们。你甚至可以使用它们来确保从终端用户那里收集的信息保持安全和可靠。\n\
  \n### 数字类型\n\nPython 编程语言中的数字与你解决代数问题时使用的数字不同。在数学中，在数字末尾加上 `.0` 实际上没有任何意义。它不会改变数值的值。例如，`3`\
  \ 和 `3.0` 是相同的。\n\n但在 Python 中，`3` 和 `3.0` 是不同的数字。在程序处理它们之前，它们必须经过某些特定的数据处理方法。作为程序员，你必须学习不同的数值类型。\n\
  \n#### 整数\n\n所有的整数都是整数。包含小数点的数字不是整数；因此，`3` 是整数，而 `3.0` 不是。Python 中的整数其特征是数据类型 `int`。\n\
  \n请注意，整数有容量限制。如果你尝试处理超出允许限制的值，将产生一个错误。整数通常处理 `-9,223,372,036.854` 到 `9,223,372,036.854`\
  \ 之间的数字。\n\n`int` 变量带有一些有趣的特性。例如，二进制只使用 `0` 和 `1`，八进制使用 `0` 到 `7` 之间的数字，十进制具有与十制相似的属性，而十六进制使用字母\
  \ `A` 到 `F` 和数字 `0` 到 `9` 作为数字位符。\n\n#### 浮点数\n\n在 Python 中，任何包含小数点的数字都被视为浮点数。小数点后的数字是\
  \ `0` 还是不是否并不重要。例如，`3.0`、`1.5` 和 `11.4` 都是浮点数。它们存储在 `float` 数据类型中。浮点数优于整数的一个巨大优势是它们拥有更大的存储空间；因此，它们能够存储非常小或大的值。\n\
  \n尽管如此，你不应该认为它们拥有无限的存储空间。仍然存在限制。尽管如此，它们可以包含低至`±2.2250738585072014× 10-308` 和高至 `1.7976931348623157×\
  \ 10-308` 的值。使用浮点数分配值的方法。首先，你可以直接给它们赋值。其次，你可以使用科学计数法。记住，负指数产生分数值。\n\n#### 复数\n\n\
  这些数字由实数和虚数组成。通常，它们用于动态系统、量子力学、计算机图形、电气工程和流体力学。复数可以在 Python 和其他少数编程语言中处理。\n\n####\
  \ 布尔值\n\n这是两个常量对象 `True` 和 `False`。它们代表真值。在数值上下文中使用时，它们作为 `0` 和 `1` Function。你可以使用\
  \ `bool` 函数为布尔值赋值，前提是该值可以被解释为真值。\n\n#### 字符串\n\n它们是用双引号连接的字符组。考虑以下示例：\n\n```python\n\
  TheString =“ Python got its name from a popular comedy show.“\n```\n\n如你在上面的示例代码所示，`Python\
  \ got its name from a popular comedy show.` 这句话被赋值给变量 `TheString`。\n\n计算机无法理解字母，只能理解数字。所以当你编写程序时，Python\
  \ 根据代表字母的数字对其进行读取和解释。例如，在美国信息交换标准（ASCII）中，数字 `65` 代表字母 `A`。所以如果你输入\n\n```python\n\
  ord (“ A“ )\n```\n\n你将得到输出\n\n```\n65\n```\n\n因为计算机无法理解字母，你必须将其转换为数字。\n\n## 第 4\
  \ 章：运算符\n\n操作数通过运算符进行操作。Python 中有七种运算符。下表显示了这些运算符并提供了简要说明。\n\n### 算术运算符\n\n| 运算符\
