  - 最大化按钮 (Maximize Button) – 工作簿时，Excel 将显示两个窗口：(1) 程序窗口和 (2) 工作簿窗口。你可以最大化这些窗口以充分利用屏幕空间。如果你让\
  \ Excel 程序覆盖整个屏幕，点击屏幕右上角的最大化按钮。要让工作簿填充 Excel 窗口，点击 Excel 程序内部的最大化按钮。\n- 最小化按钮 (Minimize\
  \ Button) – 此按钮允许你在不退出 MS Excel 的情况下使用其他程序。点击最小化按钮将 Excel 变为桌面任务栏上的小图标。这样做之后就可以访问所需的其他文件或程序。当你准备再次操作\
  \ Excel 时，点击任务栏上的 Excel 图标即可。工作簿窗口也有这个按钮。利用它管理多个工作簿。\n- 还原按钮 (Restore Button) –\
  \ 只有在窗口最大化时才能使用此按钮。点击还原按钮（程序或工作簿窗口中的任一）后，窗口将缩小。这意味着你可以调整窗口的大小和位置。\n- 关闭按钮 (Close\
  \ Button) – 使用此按钮关闭窗口。\n\n## 菜单与功能带\n\n最新版本的 MS Excel 没有菜单。为了取代可点击菜单，Excel 使用功能带（Ribbons）向用户显示可用选项。本电子书基于\
  \ Excel 2010，因此你在阅读本手册时将使用功能带。\n\n### 什么是功能带？\n\n功能带是一个显示用户可用的各种命令的选项卡。\n\n### 不同类型的功能带\n\
  \n以下列表列出了你在使用 Excel 时会遇到的三种功能带：\n\n\n\n\n\n* `首页`– 此功能区带包含基础格式命令。\n\n![](img/image01863.jpeg)\n\
  \n* `插入`– 此功能区带允许你向电子表格中插入不同的对象。\n\n![](img/image01864.jpeg)\n\n* `文件`– 这是 MS Excel\
  \ 的主功能区。使用此功能区可以创建新工作簿、保存更改或打开现有文件。\n\n![](img/image01865.jpeg)\n\n## 使用功能区\n\n\
  功能区使用可点击的图标来显示选项和命令。将鼠标悬停在图标上，你将看到有关该特定命令或选项的帮助信息。显然，点击图标将使其效果应用于程序或活动工作簿。\n\n某些图标带有下拉箭头——点击这些箭头将显示与该图标相关的额外选项。`Shapes`（形状）图标就是一个很好的例子：此图标允许你向工作簿中插入各种形状。这里有一张截图：\n\
  \n![](img/image01866.jpeg)\n\n## 对话框\n\n在每个功能区带的内部，图标被分为不同的“组”。这些组有名称，这意味着你只需阅读屏幕上的几个词就能轻松找到你需要的内容。某些组有一个箭头——此箭头被称为“对话框启动器”。点击此箭头将显示对话框。这里有一个示例：\n\
  \n![](img/image01867.jpeg)\n\n## 第 2 章：数据数据操作\n\n### 移动\n\n由于 Excel 提供了广泛的工作区域，你必须知道如何将数据放置在不同的位置。你可以通过两种方式在\
