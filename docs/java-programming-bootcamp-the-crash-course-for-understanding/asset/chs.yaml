  \n如你所见，生酮饮食是非常多样化的，包含了许多美味食物。如果你想尝试我建议的一些餐，请参考接下来的几章，你可以在那里找到食谱。不要介意修改食谱，但最重要的是享受它们。\n\
  \n# 第 4 章：生酮早餐食谱\n\n每天早上都享受一份美味且营养丰富的早餐。如果你早上时间有点紧迫，在前一天晚上晚上做好早餐会有很大帮助。\n\n## 奶油奶士煎饼\n\
  **份量**: 2 份\n**食材**:\n- 2 个鸡蛋\n- 1 茶匙甜菊糖\n- 2-3 汤匙奶油\n- 半茶匙肉桂\n- 1 汤匙椰子粉\n- 一小片黄油\n\
  - 枫糖浆\n\n**做法**:\n将鸡蛋、甜菊糖、奶油、肉桂、椰子粉、小片黄油和枫糖浆放入碗中，搅拌均匀。在锅中加热黄油，倒入面糊，煎至金黄色。\n\n##\
  \ 奶油奶士配草莓麦片\n（注：原文处标题逻辑似乎错乱，根据内容翻译为草莓肉桂麦片）\n*纠正*（由于原文此处标题与内容似乎不符，此处按内容逻辑翻译：）\n##\
  \ 草莓肉桂麦片\n**份量**: 2 碗\n**食材**:\n- 530 克椰子片\n- 2 个草莓\n- 200ml 杏仁牛奶\n- 1 茶匙肉桂\n\n\
  **做法**:\n预热烤箱至 350 华氏度，准备烤盘。将椰子片放入碗中，加入草莓、牛奶和肉桂搅拌均匀。在锅中加热黄油，放入椰子片翻炒约 2.5 分钟。\n\n\
  ## 培根面包\n**份量**: 3 份\n**食材**:\n- 1 包培根\n- 3 个鸡蛋\n- 100 克芝士\n\n**做法**:\n预热烤箱至 200\
  \ 华氏度，准备烤盘。将培根放入锅中切开，煎制 20-25 分钟直到熟透。取出培根，放在纸巾上吸去油脂。煎鸡蛋至熟，放在一旁备用。\n\n## 柠檬蓝莓玛芬\n\
  **份量**: 8 份\n**食材**:\n- 114 克蓝莓\n- 1/4 茶匙柠檬屑\n- 1/4 茶匙柠檬风味精\n- 120 克淡奶油\n- 1 个鸡蛋\n\
  - 100 克杏仁粉\n- 一小撮盐\n- 1/4 茶匙小苏打\n- 2.5 包甜菊糖\n- 28 克融化黄油\n\n**做法**:\n预热烤箱至 350 华氏度，准备玛芬模。将面粉和奶油放入碗中搅拌，加入鸡蛋再次搅拌至均匀。加入甜菊糖、黄油、柠檬屑、柠檬风味精和小苏打，搅拌均匀。拌入蓝莓，将面糊倒入玛芬模中，每个填满半。放入烤箱烤约\
  \ 20 分钟，直到玛芬呈金黄色。\n\n## 菠菜欧姆蛋\n**份量**: 1 个大号或 2 个小号\n**食材**:\n- 1 个蛋黄\n- 4 个蛋蛋白\n\
  - 一小把切碎的菠菜\n- 半个西红红柿\n- 2 汤匙豆奶或杏仁奶\n- 一小撮香菜\n- 1 汤匙切碎的洋葱\n- 油\n\n**做法**:\n在锅中喷油，翻炒蔬菜。将蛋黄、蛋蛋白和牛奶加入碗中搅拌打。蔬菜炒好后，从锅中取出放在一旁。再次在锅中喷油，然后倒入蛋液。\n\
  \n\n\n\n\n# 第 5 章：午餐食谱\n\n这些午餐食谱可以装盒带去上班，也可以在家里享用。请在接下来的几天内吃完剩余部分，以确保它们口感最新鲜。\n\n\
  ## 培根、鸡蛋和西兰花\n\n份量：2 人\n\n### 配料：\n- 4 个鸡蛋\n- 8 片培根\n- 1 匙黄油\n- 80 克西兰花，切碎\n- 1\
  \ 根胡萝卜，薄片\n- 半个洋葱，切碎\n- 100 克碎奶士\n- 50 克芹菜\n\n### 做法：\n在平底锅或锅中融化黄油，然后煎炸培根和蔬菜，煎约\
  \ 20 分钟，直到蔬菜开始焦化。\n\n将混合物均匀地铺在平底锅或锅的底部，然后切成四份。在每份的中间挖一个洞，加入鸡蛋。根据你的喜好烹饪鸡蛋直到煮熟，撒上奶士。让奶士融化，即可上菜。\n\
  \n## 火腿、火鸡和奶士煎饼\n\n制作量：4-5 个\n\n### 配料：\n- 4 个鸡蛋\n- 2 茶匙甜菊糖\n- 4-6 匙奶油\n- 1 茶匙肉桂粉\n\
  - 2 匙椰子粉\n- 4 片火鸡肉\n- 200 克瑞士奶士，切碎\n- 4 片火腿\n- 1 片黄油\n- 枫糖（糖浆）\n\n### 做法：\n将鸡蛋、甜菊糖、奶油、肉桂粉和椰子粉放入碗中，搅拌至混合光滑。加热平底锅或煎锅，加入黄油并用中火至大火融化。正反两面煎至金棕色。\n\
  \n将煎饼从锅中取出，移离火。\n\n取出 1 片火鸡肉放在盘子里，现在在火鸡肉上放上一片火腿，然后放在一个煎饼上，重复上述 3 次。在每份煎饼上撒上约 50\
  \ 奶士，然后用中低火加热，盖上锅盖直到奶士完全融化。即可上菜。\n\n## 鸡肉培根沙拉\n\n份量：4 人\n\n### 配料：\n- 1 个未煮且切碎的鸡胸肉\n\
  - 4 匙黄油\n- 5 片培根\n- 1 个番红柿，切碎\n- 半 茶匙盐\n- 2 茶匙牛排调料\n- 2 茶匙柠檬汁\n- 1 个蛋黄\n- 56 克碎奶士\n\
  - 56 克蛋美酱\n\n### 做法：\n取牛排调料撒在鸡肉上，与黄油一起在中火至大火上煎鸡肉。煎至鸡肉完全熟透。\n\n现在将培根切成条，煎至酥脆，然后沥出油。加入剩余食材，翻炒几分钟后取出。现在将鸡肉和培根放入盘中，淋上剩下的食材，即可上菜。\n\
  \n## 香肠披萨\n\n制作量：1 个\n\n### 配料：\n- 3 个鸡蛋\n- 200 克碎奶士\n- 2 茶匙意大利调料粉\n- 1 匙橄榄油\n-\
  \ 1 头花椰菜，切碎\n- 2 匙黄油\n- 42 克切碎洋葱\n- 60 ml 水\n- 200 克碎马苏里拉奶士\n- 60 克碎帕玛森奶士\n- 1 茶匙茴香籽\n\
  - 500 克香肠\n- 一罐低碳披萨酱\n\n### 做法：\n**制作饼底：**\n预热烤箱至 450 华氏，并在烤盘上铺纸或涂油。在平底锅或锅中融化黄油，加入花椰菜和洋葱。用小火煎至花椰菜熟。\n\
  \n向锅中加水，盖上锅盖蒸花椰菜直到变软。现在将花椰菜转移到碗中冷却。将香肠放入锅中煎，然后切成小块。现在取出香肠，沥干脂肪，放在一旁。\n\n花椰菜冷却后，取约一半放入食物机中搅拌至光滑。现在放入碗中，加入马苏里拉奶士、鸡蛋、帕玛森奶士和香料，搅拌均匀。\n\
  \n现在将混合物摊在烤盘上，摊平。烘烤约 20 分钟，直到花椰菜边缘变褐。\n\n**制作配料：**\n将香肠切成小块。在酱锅中加入披萨酱，然后加入香肠。盖盖保持煮沸。\n\
  \n将烤箱调至上火模式，将香肠混合物和酱淋在饼底上，摊开直到薄且均匀覆盖。现在加入奶士混合物，将披萨放回烤箱，直到奶士开始上色。切片上菜。\n\n## 鸡汤\n\
  \n制作量：4-6 碗\n\n### 配料：\n- 650 克鸡肉\n- 半个小洋葱，切碎\n- 1 茶匙盐\n- 半根胡萝卜，切碎\n- 半根芹菜茎，切碎\n\
  - 1 瓣去皮大蒜\n- 半 茶匙欧芹\n- 半 茶匙百香里\n- 3 粒胡椒\n- 半片月桂叶\n\n### 做法：\n预热烤箱至 400 华氏，将鸡肉放入平底锅或荷兰锅中。加入盐、洋葱、胡萝卜和芹菜，烤鸡肉约\
  \ 45 分钟。鸡肉熟后，从烤箱取出放在炉灶上。现在向鸡肉中加入一些水、大蒜、香料和香草。小火慢炖，然后撇掉任何浮沫。离火。\n\n冷却后，滤出肉汤即可。\n\n\
  ## 低碳肉饼\n\n份量：1 块\n\n### 配料：\n- 800 克肉末\n- 6 瓣大蒜，末\n- 2 匙黄油\n- 半 汤香菜\n- 半 汤百香里\n\
  - 2 个鸡蛋\n- 400 克香肠\n- 225 克洋葱，切碎\n- 120 克绿椒，切碎\n- 奶士\n\n 做法：\n预热烤箱至 350 华氏，并在烤具涂油。将奶士和面粉放入碗中充分搅拌。在平底锅或煎锅中加热黄油，加入洋葱和胡椒煎炒。变软后，冷却并放入食物机中。搅拌至细腻。\n\
  \n搅拌鸡蛋，加入烧烤酱、香料、胡椒、盐、芥末和奶油。\n\n将肉末和香肠混合，放入大碗中，加入鸡蛋和其他混合物。如果混合物变得粘稠，加入一些奶士。现在将食材放入烤具中，边缘留出约\
  \ 1 英寸。压平，烤一小时，直到肉饼达到 160 华氏。\n\n## 巧克力蛋白奶昔\n\n制作量：1 杯\n\n### 配料：\n- 28 克（16 盎司）杏仁奶或豆奶\n\
  - 114 克（4 盎司）奶油\n- 一匙覆莓浆\n- 30 克乳蛋白粉\n\n### 做法：\n将食材放入搅拌机或奶昔机中，搅拌至光滑。倒入杯中即可。\n\n\
  # 第 6 章：晚餐食谱\n\n以下晚餐食谱将让你在一天结束时感到非常满足。\n\n## 烤三文鱼\n\n份量：2 人\n\n### 配料：\n- 2 片三文鱼柳\n\
  - 6 匙橄榄油\n- 1 匙柠檬汁\n- 1 匙欧芹\n- 2 瓣大蒜，末\n- 1 茶匙香菜\n- 1 茶匙盐\n- 1 茶匙黑椒\n\n### 做法：\n\
  将黑椒、盐、大蒜、香菜、橄榄油、柠檬汁和欧芹放入碗中，搅拌。现在将三文鱼放入烤具，覆盖上大蒜香菜混合物。\n\n在冰箱中腌制三文鱼约一小时，每 20 分钟翻面一次。预热烤箱至\
  \ 375 华氏，用铝箔包裹三文鱼。淋上腌料，然后烤约 45 分钟，直到用叉子触碰三文鱼时会散。即可。\n\n## 香肠花椰菜汤\n\n份量：3 人\n\n###\
  \ 配料：\n- 半颗花椰菜，切碎\n- 半个洋葱，切碎\n- 半根中等大小西班牙香肠，切碎\n- 半根小葱，切碎\n- 半根芜根，切碎\n- 少许盐\n- 240ml\
  \ 鸡汤\n- 1 匙黄油\n\n\n\n\n在汤碗中涂上一汤匙黄油，加入洋葱，用中大火煎至呈棕色。加入菜花，边翻炒边再煮 5 分钟。\n\n将鸡汤加入到菜花中，并在碗上盖上盖子。现在加入一半的芜根和一半的墨西哥肠。煮至酥脆（约\
  \ 10 分钟）。现在将半部分墨西哥肠放入搅拌机中，搅拌至光滑。用盐调味，然后加入剩下的芜根和墨西哥肠。上菜。\n\n# 瑞典肉丸\n制作量：30 份\n\n\
  ### 配料\n- 500 克瘦牛肉\n- 1 汤匙黄油\n- 1 个煮鸡蛋\n- 半茶匙黑胡椒\n- 1 又半茶匙 肉香料\n- 1 又半茶匙 肉豆蔻\n-\
  \ 1 又半茶匙 盐\n- 200 克瑞里科塔奶士\n- 114 克瑞士奶士，擦碎\n\n### 做法\n在锅中加入黄油并加热，然后翻炒洋葱直到透明。煮约 10\
  \ 分钟。现在取出瑞士奶士放入搅拌机中，搅拌至呈面包屑状。\n\n在混合碗中加入鸡蛋和瑞里科塔奶士，并打发。现在加入胡椒、盐和香料，再次混合。加入瑞士奶士和洋葱，再次混合一次。将牛肉放入碗中混合，直到所有食材都粘在一起并产生粘性。将混合物分成\
  \ 30 个肉丸，揉成球状。\n\n将肉丸放入烤盘中，用 350 华氏度（约 177°C）烤约 20 分钟，或直到上色。上菜。\n\n# 瓜达拉亚鸡\n份：4\
  \ 人\n\n### 配料\n- 4 个去骨鸡胸，切成 2 厘米片\n- 3 瓣末大蒜\n- 2 汤匙黄油\n- 6 个西红柿，切碎\n- 4 个青辣椒\n-\
  \ 114 克 奶油奶士\n- 60ml 鸡汤\n- 60 克 鲜奶油\n- 1 茶匙孜然\n- 半茶匙 辣椒粉\n- 1 茶匙 盐\n- 半茶匙 大蒜粉\n\
  - 莎莎用于装饰\n- 酸奶油用于装饰\n- 一小撮擦碎切达奶士用于装饰\n\n### 做法\n在平底锅中融化黄油，然后翻炒大蒜洋葱直到变软。将鸡肉放入锅中，用中火煎至汁水出来。火力调至中低，加入辣椒和西红柿。加入所有香料，盖盖慢煮约\
  \ 10 分钟。\n\n现在加入奶油和奶油奶士，搅拌直到奶士融化。撒上装饰料。\n\n# 奶士洋葱挞\n制作量：1 个大\n\n### 配料\n- 12 个鸡蛋\n\
  - 500 克 切达奶士，擦碎\n- 2 汤匙黄油\n- 480 ml 鲜奶油\n- 1 个洋葱，切碎\n- 1 茶匙 盐\n- 2 茶匙 百里香\n- 1 茶匙\
  \ 胡椒\n\n### 做法\n预热烤箱至 350 华氏度（约 177°C），然后在平底锅中加入黄油在中低火加热。加入洋葱翻炒至透明，然后冷却。\n\n准备挞饼模，加入奶士，然后加入洋葱并抹平。现在将鸡蛋倒入混合碗，加入香料和奶油。搅拌直到混合物起泡。将混合物倒入奶士上并抹平。将挞饼放入烤箱烤约\
  \ 25 分钟，或直到定型。冷却后上菜。\n\n# 第 7 章：生酮饮食零食\n在生酮饮食期间享受以下零食，在进食美味食物的同时减肥。\n\n## 夏坚果\n\
  份：1 人\n\n### 配料\n- 一一把夏坚果\n- 一小片黄油\n\n### 做法\n在锅中融化黄油，加入坚果，不断搅拌。待坚果上色。冷却后上菜。\n\n\
  ## 三文鱼奶油奶士\n份：1 人\n\n### 配料\n- 150-200 克 三文鱼\n- 100 克 奶油奶士\n\n### 做法\n将三文鱼切片，放入碗中。加入奶油奶士并搅拌。上菜。\n\
  \n## 剩余肉\n份：1 人\n\n### 配料\n- 剩余肉\n- 一小撮你喜欢的香料\n\n### 做法\n将剩余肉切片，放入碗或锅中。撒上你喜欢的香料。上菜。\n\
  \n## 奶士片\n份：1 人\n\n### 配料\n- 200 克 碎奶士\n\n### 做法\n将不粘烘焙纸切成与盘相同的大小，放入微波炉。现在加入奶士。开启微波炉高火运行约半分钟，或直到奶士变脆。冷却后上菜。\n\
  \n## 猪皮青酱\n份：1 人\n\n### 配料\n- 10-15 片熟猪皮\n- 60–80ml 罗勒青酱\n\n### 做法\n将一半罗勒青酱放在底部并抹平。将猪皮放在上面，然后把剩下的酱淋在猪皮上。搅拌上菜。\n\
  \n# 第 8 章：提示与技巧\n以下是一些帮助你的生酮饮食计划变得更容易提示和技巧。\n\n### 水\n无论你在进行哪种饮食计划，保持水分充足都很重要。水对你非常有好处，不仅能帮助身体排毒，还能让你有饱腹感。每天\
  \ 8 杯水。\n\n### 运动\n很多人在参与饮食时会运动，但你不需要。只要只吃生酮计划允许的食物，就会减肥。\n\n### 你的减肥\n在进行饮食期间，减肥是不可避免的。这是因为你的身体会计算出理想体重，它会平稳地带你到达那里。\n\
  \n### 如果你想再次进行计划\n我建议你一次参加生酮饮食不要超过两周。因为你需要摄入水果和其他这种饮食可能缺乏的营养。\n如果你真的想再次进行计划，请执行两周，休息两周，然后再执行两周。\n\
  \n# 结\n再次感谢你下载这本书！\n\n希望这本书能帮你理解生酮饮食有多么美味，同时也帮助你减肥。\n\n下一步是准备你所需的所有食材，这样你就可以享受自制美食。\n\
