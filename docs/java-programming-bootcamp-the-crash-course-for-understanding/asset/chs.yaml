  \n# 第 5 章：不同类型的数据\n\n基本上，数据类型定义了对象的能力。在其他语言中，操作的有效性是通过确保对象无法存储在执行操作的地方来测试的。这种系统被称为静态类型。\n\
  \n然而，Python 使用了不同的方法。这种编程语言允许你将对象的数据类型存储在对象内部。Python 在你运行每个操作时都会检查该操作的有效性。程序员将这种系统称为动态类型。\n\
  \n本章重点介绍你可以与 Python 使用的不同数据。\n\n## 标准类型\n\nPython 拥有一套标准数据类型。这些类型预装在门编程语言中。让我们这些类型分成若干小组。本节将使用\
  \ Python 官方文档中的层级系统：\n\n### 数字类型 (The Numeric Types)\n\n* `int`– 代表整数。对于 Python\
  \ 2.x，`int` 等同于 C 语言的 longs。\n* `long`– 代表长度无限制的长整数。你会在使用 Python 2.x 的系统中找到这种类型。\n\
  * `float`– 代表浮点数。Float 等同于 C 语言中的 doubles。\n* `complex`– 这种类型由复数组成。\n\n### 序列 (The\
  \ Sequences)\n\n* `list`\n* `tuple`\n* `byte`– 这是一个 0-255 范围内的数字序列。你会在使用 Python\
  \ 3.x 的系统中找到 bytes。\n* `byte array`– 这是 bytes 的可变版本。\n* `str`– 代表“字符串”。Python 2.x\
  \ 系统将字符串表示为 8 位项的序列。然而，Python 3.x 系统将它们表示为 Unicode 项的序列。\n\n### 集合 (The Sets)\n\n\
  * `set`– 这是一个无组织的不同对象组。\n* `frozen set`– 这种类型是集合的不可变版本。\n\n### 映射 (The Mappings)\n\
  \n* `dict`– 代表 Python 字典。程序员将这种类型称为“哈希映射”或“关联数组”。通常情况下，字典的每个元素都有相应的定义。\n\n## 可变与不可变对象\
  \ (Mutable and Immutable Objects)\n\n在 Python 语言中，数据类型根据其内容的可变性进行分类。请记住，不可变数据类型防止你更改其内部的对象。这意味着你将成功地切片或重新分配可变数据的对象。然而，不可变对象将给你返回错误信息。\n\
  \n这里有一个你应该记住的重要原则：变量是对机器内存中对象的简单引用。假设你使用以下语句将对象和变量配对：\n\n```\ns = \"123\"\n```\n\
  ```![](img/image01763.jpeg)\n\n通过上述语句，你正在让变量（即 `1`、`a` 和 `s`）指向某些对象。Python 在机器内存中存储这种变量与对象之间的关系。因此，你可以随心所欲访问对象。\n\
  \n对于下一个示例，假设你使用以下代码执行重新赋值：\n\n```\ns = \"abc\"\n```\n```![](img/image01764.jpeg)\n\
  \n在这个新语句中，你将变量链接到了新对象。正如你之前学过的，`[1]` 是的，但 `a` 会产生错误。\n\n## 如何创建定义类型的对象 (How to Create\
  \ Objects of Defined Type)\n\n* **字面量整数 (Literal Integers)**– 通过以下方式输入：\n    * 十进制数字——直接输入。\n\
  \    * 六进制数字——在前缀加上 `0X` 或 `0x` 来输入。\n    * 八进制数字——输入方法取决于你使用的 Python 版本：\n    \
  \    * 对于 Python 2.x——在前缀加上 0 来输入。\n        * 对于 Python 3.x——在前缀加上 `0O` 或 `0o` 来输入。\n\
  * **浮点整数 (Floating Point Integers)**–直接输入。\n* **长整数 (Long Integers)**–通过两种方式输入：\n\
  \    * 直接输入（视为长整数）。\n    * 附加字母 `L`（视为长整数）。\n\n如果涉及短整数的计算溢出，它会自动转换为长整数。\n\n* **复数\
  \ (Complex Numbers)**–通过添加两个数字（即一个实数和一个虚数）来输入这种对象。然后通过附加字母 `j` 输入这些数字。这意味着 `11+2j`\
  \ 和 `11j` 是复数。\n\n* **字符串 (Strings)**– 使用单引号或三引号输入字符串。这两种类型的区别在于它们的界符和潜在长度。单引号字符串限制在单行。你可以使用成对的单引号或双引号输入单引号字符串。查看示例：\n\
  \n![](img/image01765.jpeg)\n\n三引号字符串与单引号字符串类似，但它们可以跨越多个行。显然，它们的界符（即引号）应该匹配。你必须使用\
  \ 3 个单引号或双引号输入这些字符串。这里是你的教学性截图：\n\n![](img/image01766.jpeg)\n\n* **元组 (Tuples)**–你可以使用括号输入元组。在对象之间放置逗号来分隔它们。\n\
  \n```\nt = (1, 2, 3)\n```\n```![](img/image01767.jpeg)\n\n你可以通过在括号内并添加逗号来输入单个元素的元组。这是一个示例：\n\
  \n```\nt = (1,)\n```\n\n* **列表 (Lists)**–列表的工作与元组类似，但它们需要方括号：\n\n```\nl = [1, 2,\
  \ 3]\n```\n```![](img/image01769.jpeg\n\n* **字典 (Dictionaries)**–你可以通过列出一些值对并使用冒号分隔每个对来创建“Python\
  \ 字典”。使用逗号分隔字典条目。然后，使用大括号包含语句。查看下方的图片：\n\n```\nd = {\"key\": \"value\", \"a\": 1}\n\
  ```\n```![](Images/image01770.jpeg\n\n\n\n\nPython 使用 `“None”` 作为空指针的类比。在这方面，Python\
  \ 与许多编程语言相似。实际上，`“None”` 本身并不是空引用或空指针——它是一个只有一个实例的对象。你可以将`“None”` 作为函数的默认参数。在 Python\
  \ 中，你必须使用 `is` 而不是 `==` 来将对象与 `None` 进行比较。\n\n# 第 6 章：你将遇到的错误\n\nPython 用户遇到三种错误：异常、逻辑错误和语法错误。\n\
  \n## 异常\n当 Python 解释器无法执行某操作但知道应该做什么时，就会发生这些错误。一个很好的例子是你在离线时运行 Google 搜索：机器知道应该做什么，但无法完成。\n\
  \n## 逻辑错误\n逻辑错误极难发现。而且，它们是你遇到的最常见的错误。受逻辑错误影响的 Program 程序仍然运行。然而，它们可能会崩溃或产生意外的结果。\n\
  \n你可以使用调试器来查找并解决程序中的逻辑错误。\n\n## 语法错误\n这可能是最基础的一种错误。当 Python 解释器无法理解代码时，就会发生语法错误。根据程序员的说法，大多数情况下语法错误是致命的——你无法执行包含此类错误的代码。\n\
  \n语法错误通常由拼写错误、错误的参数或错误的缩进引起。这意味着每当你遇到语法错误时，都应该检查代码中是否存在这些错误。\n\n# 结\n再次感谢你下载本书！\n\
