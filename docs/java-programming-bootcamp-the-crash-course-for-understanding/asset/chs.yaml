  - 第四章：卓越的沙拉\n- 第五章：巨无主菜\n- 结论\n\n## 引言\n如果你正在寻找减肥、减脂和增加能量水平的方法，你来对地方了。原始饮食（Paleo\
  \ diet）是一种低碳水饮食，含有大量的蛋白质和大量的蔬菜。这种饮食有时被称为“穴人饮食”，因为它基本上是穴人所吃过的所有东西。这种饮食之所以有效，是因为它强制你的身体燃烧脂肪产生能量，而不是利用碳化合物中的葡萄糖。这是一种必尝试的饮食，我保证它将帮助你实现目标，并在过程中让你感觉极好。\n\
  \n如果你的目标是减肥、维持体重并增加能量水平，你需要像穴人一样吃所有天然的、非加工的食物。穴人没有技术种植谷物或制作乳制品，我们为什么要吃它们呢？适应穴人饮食不仅能帮助你过上健康充实的生活，你还能减少脂肪，看起来像你一直想要的样子。\n\
  \n书中拥有味道极佳且易于制作的食谱，将开启你的健康生活之旅。我包含了我最喜欢的早餐、零食和晚餐食谱。有了这本书，你将毫无问题地实现你想要的任何健康目标，而且永远不需要跳餐或像小鸟一样进食。减肥从未是如此简单、又有趣！\n\
  \n原始饮食的主要益处之一是它能让你产生更持久的饱腹感，而这也是人们避开不同饮食的主要原因之一。这种饮食不仅让你感到饱腹，你摄入的食物还会帮助你燃烧掉不需要的脂肪，甚至不需要运动！\n\
  \n进行低碳水饮食将帮助你避免“坏”脂肪，这些脂肪倾向于附着在腹部器官上，是最难减掉的脂肪之一。这些脂肪还会对你的身体产生长期负面影响，因此**现在**消除它们极其重要。\n\
  \n我们现在现在开始原始饮食的之旅，我完全相信如果你开始了它，你将获得巨大的健康益处，并且对自己的感觉好得多。\n\n不要忘记在底部查看我最喜欢的饮食之一：\n\
  \n学习我如何通过 3 周饮食法快速减掉顽固的多余脂肪的策略。\n\n拉到底部获取更多信息，并接收你的免费报告和额外内容！\n\n## 第一章：原始饮食……或者我应该叫它穴人饮食\n\
  长期以来，人们对这种饮食一直持怀疑态度，这是由于不理解它的本质。原始饮食的核心理念是只吃我们身体演化而来的适应食用的食物。这意味着所有未加工或未经过基因改造的天然食物。我们的身体显然还没有适应食用谷物、乳制品和加工食品。这从许多人对乳糖不耐受或无法消化谷物中看出。\n\
  \n由于人类食用肉类、蔬菜和水果已经如此久，很容易说我们的身体已经习惯了这些。事实恰恰相反，因为人类食用精制白面粉、高果糖和加工食品的时间相对短。\n\n另一个证明我们身体尚未适应某些食物的例子是麸质。这是否意味着我们还没有适应？尝试这种饮食吧，我保证你再也不会回头了。\n\
  \n这里是关于饮食（碳水化合物）的其他误解。\n\n### 我必须消除所有碳水！\n消除碳水化合物是关于原始饮食的一个误解。虽然大多数人试图减少碳水的摄入量，但更重要的是减少特定类型的碳水。遵循原始饮食的人实际上从蔬菜、坚果和种子中获取足够的碳水，而不是营养不良的白谷物。\n\
  \n### 这会太难了\n大多数人认为，不能吃谷物生活将变得难以想象。这在开始阶段是真的，但随着时间的推移，你会忘记它们的。你必须理解，谷物尤其是小麦是营养不良的，未来会导致健康问题。\n\
  \n食用过多谷物可能导致的一些健康问题是：肥胖、糖尿病、肠漏，甚至成瘾。这听起来是你可以放弃谷物吗？\n\n### 我想吃多少脂肪对我会有好处？\n这再次取决于质量而非数量。高质量脂肪可以大量食用而不会产生真正的健康问题。这并不适用于其他油脂。高质量动物脂肪、牛油果、椰油、橄榄油以及鸡蛋中的脂肪将为你提供优质营养和健康。\n\
  \n避免任何精制、加工和氢化的油，如葵花油、棉籽油或菜籽油。这些对身体是有毒的，因为它们含有高炎症性的 Omega 6 脂肪酸。\n\n### 首先禁碳水……现在禁乳制品？\n\
  关于是否食用乳制品真的取决于你的个人选择。如果你乳糖不耐受，显然要避免乳制品，但你可以坚持选择无激素、草饲乳制品。不要吃太多乳制品很重要，所以不要把它成为每天饮食的一部分，特别是如果你想减肥的话。\n\
  \n## 第二章：惊人的食材\n在这里我为你提供一份你需要的储备的食材清单。有些对你来说可能是新的，但很快不会：\n\n- 冷冻汤底（鸡肉、牛肉或蔬菜）\n-\
  \ 干燥和新鲜香草及香料（我最喜欢的是牛至、姜黄和肉桂）\n- 椰奶和椰奶油\n- 椰子油、橄榄油、牛油果油\n\n\n\n新鲜柠檬\n新鲜大蒜和生姜\n牛油果\n\
  第顿芥末末\n蜂蜜\n切碎番茄或番茄泥\n希腊酸奶（蛋白质的良好来源）\n一块 100% 黑巧克力（作为你的作弊零食）\n大量的优质黄油\n\n# 第 3 章：丰盛早餐餐\n\
  \n## 牛油果培根欧姆蛋\n### 配料\n- 3 片培根\n- 2 汤匙碎红洋葱\n- 1 个牛油果\n- 1 汤匙碎新鲜香菜\n- 适量的的辣酱\n- 3\
  \ 个鸡蛋\n\n### 做法\n将培根煎至酥脆。将牛油果对半切开去核。将果肉挖入碗中。将其压碎，但确保不要压得太细，因为食物需要一点质感。\n在牛油果中加入香菜和洋葱。培根煎好后，取出并沥干水分，将其捏碎或压碎加入混合物中。轻轻搅拌整个混合物。将鸡蛋倒入碗中搅拌，制作两个欧姆蛋。在其中一个欧姆蛋中放入一半牛油果混合物。你可以根据口味加上辣酱。\n\
  \n## 西根末炒蛋\n### 配料\n- 3 片生培根\n- 3 个鸡蛋\n- 1 茶匙西根末\n\n### 做法\n将煎锅置于中火。将培根放入锅中。煎至酥脆，煎好后沥干并捏碎。将所有鸡蛋与西根末一起打匀。\n\
  留出一汤匙油来煎蛋。将鸡蛋倒入锅中，煎至几乎定型。\n加入培根碎并搅拌。烹饪约 3 分钟后上菜。\n\n## 土耳其炒蛋 (Menemen)\n### 配料\n\
  - 1/2 个红洋葱，切丁\n- 1 个中等番茄，切丁\n- 1 汤匙橄榄油\n- 1 瓣大蒜，压碎\n- 1/4 茶匙孜然粉\n- 1/2 茶匙黑胡椒\n-\
  \ 1/4 茶匙姜黄粉\n- 1/4 茶匙辣椒片\n- 2 个鸡蛋\n- 1/4 茶匙盐\n- 1 汤匙碎新鲜欧芹\n\n### 做法\n在煎锅中用中低火将橄榄油炒洋葱、青椒和番茄。压碎大蒜放入锅中搅拌。经常翻炒并继续烹饪。在蔬菜制作期间，将鸡蛋放入碗中打匀。当蔬菜快熟时，倒入鸡蛋并煎至定型。盛入盘中，撒上欧芹装饰后上菜。\n\
  \n## 菠菜培根烘烤蛋\n### 配料\n- 2 个大鸡蛋\n- 1 包（3/4 杯装）嫩菠菜叶\n- 4 汤匙重奶油\n- 3 片苹果木熏培根\n\n###\
  \ 做法\n将烤箱预热至 `4000F`（注：原文数值可能有误）。在大煎锅中用中火煎培根至酥脆。移至纸巾上沥干油。向锅中加入菠菜并撒上胡椒。中火翻炒 1 分钟，然后转移到滤网中，放在碗上方沥干。将培根捏碎。\n\
  取菠菜，然后撒上培根并确保分配均匀。用勺子压平并在中心挖一个洞。向洞中打入一个鸡蛋，确保蛋黄完整。在每个鸡蛋上淋 1 汤匙奶油，撒上盐和胡椒，烘烤至蛋白刚刚定型但蛋黄仍保持湿润即可上菜。\n\
  \n## 墨西哥香肠鸡蛋卷饼\n### 配料\n- 4 个大鸡蛋\n- 4 根青葱，切片\n- 1 杯碎切达奶士（草饲级）\n- 4 张亚麻籽卷饼\n- 辣酱或莎莎\n\
  - 3/4 杯新鲜墨西哥香肠\n- 4 汤匙切碎新鲜香菜（分用）\n- 酸奶油（可选）\n\n### 做法\n用橄榄油刷涂大号不粘锅，然后直接在电炉炉上煎烤卷饼，直到表面出现黑点，期间用夹子翻转。然后将卷饼单层铺在锅中，在每张饼上涂上\
  \ 1/4 杯碎奶士并备用。在等号碗中打匀 2 汤匙香菜和鸡蛋，用胡椒和盐调味。在中号不粘锅中用中火煎香肠至熟，用勺背压碎培根并加入青葱翻炒。加入鸡蛋混合物并搅拌。煮至几乎定型后离火。\n\
  用大火在锅中煎卷饼直到底部酥脆。将鸡蛋混合物分在卷饼上，撒上剩余的香菜，将每张卷饼对折后上菜。\n\n# 第 4 章：顶级沙拉\n\n沙拉对于遵循石器饮食的人来说是非常棒的餐点，因为它们的可定制性很高。由于种类多样，它们永远不会无味，而且制作简单。以下是一些很棒的食谱。\n\
  \n## 蜂蜜芥末科布沙拉\n### 配料\n- 2 个水煮蛋，切四分之一\n- 2 杯切碎混合生菜叶\n- 1 杯煮熟切丁鸡胸肉\n- 1/2 杯酥脆的培根碎\n\
  - 1/2 杯碎蓝奶士\n- 1 个番茄，切丁\n- 1/2 个洋葱，切丁\n- 1/2 个黄瓜，切丁\n- 酱汁：\n- 2 茶匙第顿芥末末\n- 2 茶匙蜂蜜\n\
  - 1 瓣大蒜，切末\n- 盐和胡椒\n- 1 汤匙细碎欧芹\n\n### 做法：\n在一个大型浅碗中，先铺上混合生菜作为基底。然后将其他沙拉配料以条纹状铺在生菜上。最后，将酱汁原料混合在一起并打匀，然后以与条纹相反的方向淋在沙拉上，形成漂亮的网格状图案。你可以根据选择在上面撒上一些碎坚果以增加酥脆口感。\n\
  \n## 茴根牛油果沙拉\n### 配料：\n- 1 个牛油果\n- 1 根薄切的茴根球\n- 1/2 个英式黄瓜，切成状\n- 1 汤匙苹果醋\n- 适量的的红椒粉\n\
  - 盐和胡椒\n- 1 汤匙橄榄油\n- 1 茶匙芝麻\n\n### 做法\n确保茴根球被切得越薄越好——可能的话使用切片器。只有非常嫩的部分才适合这种沙拉，所以如果你能买到幼茴根就更好。\n\
  将茴根与切碎的牛油果混合，用油、醋、盐、胡椒和红椒粉制作酱汁。沙拉可以在食用前腌制 `marinate` 一会儿。\n在顶部撒上芝麻。\n\n## 草莓菠菜沙拉\n\
  ### 配料\n- 1 把嫩菠菜叶\n- 2 杯切极薄片的的草莓\n- 2 块煮熟的鸡胸肉\n- 1/2 杯酥脆碎的培根\n- 1 汤匙蜂蜜\n- 1 汤匙橄榄油\n\
  - 1 汤匙柠檬汁\n\n### 做法\n混合所有原料。立即食用以防沙拉变软。用三色花装饰看起来非常漂亮——是夏季烧烤的理想之选。\n\n## 红洋葱木瓜沙拉\n\
  ### 配料\n- 1 个中等大小的橙肉木瓜，去籽\n- 3/4 个切薄的红洋葱\n- 1/2 杯碎菲塔奶士\n- 黑胡椒和盐\n- 1 汤匙现榨的柠檬汁\n\
  - 1 汤匙橄榄油\n\n### 做法\n将木瓜切成一口大小的块，然后加入薄切的红洋葱。撒上菲塔奶士。\n用柠檬汁和橄榄油制作酱汁，根据口味加入盐和胡椒。这种沙拉可以在食用前静置片让味道融合。用几枝新鲜薄荷装饰也非常漂亮。\n\
  \n## 罗勒蓝莓烤牛肉沙拉\n### 配料\n- 1 杯新鲜蓝莓\n- 1 块煮熟的西脊肉，薄切\n- 2 把完整的罗勒叶\n- 3 杯切碎的生菜\n- 1\
  \ 个切丁的苹果\n- 盐和胡椒\n- 1/4 杯希腊酸奶\n- 1 汤匙橄榄油\n- 1 汤匙柠檬汁\n- 1/4 茶匙柠檬皮屑\n- 1/2 杯切碎的核桃\n\
  \n### 做法：\n烤牛肉并切薄片，然后冷却。在碗中混合生菜、罗勒和蓝莓，与其他原料混合。尽量将原料切成大致相同的大小以获得均匀的沙拉。\n混合酱汁原料（橄榄油、酸奶和柠檬汁）并淋在沙拉上。将切好的牛肉铺在沙拉上并立即食用。\n\
  \n## 罗勒杏仁鸡肉沙拉\n### 配料\n- 2 块煮熟并切片的的鸡胸肉\n- 1/2 杯煎熟的培根碎\n- 1 个切丁的番茄\n- 1/2 个切丁的黄瓜\n\
  - 2 汤匙现制的罗勒酱\n- 盐和胡椒\n- 3 杯混合生菜叶\n- 1 汤匙烤过的松子\n- 3 汤匙片杏仁\n- 1 汤匙蜂蜜\n- 1 汤匙柠檬汁\n\
  - 1 汤匙橄榄油\n- 1 汤匙切丁的洋葱\n- 1 汤匙切丁的欧芹\n\n### 做法\n（原文未提供做法）\n\n\n\n\n将鸡肉、培根、生菜叶、番茄和黄瓜混合在一起。用蜂蜜、橄榄油、柠檬汁、洋葱和欧芹制作酱料。搅拌均匀并加入沙拉中。将沙拉放在大托盘上，淋上新鲜的新罗勒青酱，然后撒上杏仁片。立即食用。\n\
  \n# 亚洲胡萝卜沙拉\n\n### 配料：\n- 3 根擦丝胡萝卜\n\n### 辛辣亚洲酱料\n- 1 汤匙生抽\n- 1 汤匙碎末香菜\n- 1 汤匙碎末洋葱\n\
  - 1 汤匙碎末生姜\n- 1 汤匙辣椒酱\n- 1 汤匙芝麻\n- 1 汤匙米醋\n- 盐和黑胡椒（可选）\n\n### 说明：\n将沙拉酱料原料搅拌均匀，然后淋在擦丝胡萝卜上。简单但非常、非常好。\n\
  \n# 第 5 章：巨兽主菜\n\n## 姜油西兰花\n\n### 配料：\n- 2 茶匙黑胡椒\n- 2 瓣大蒜，切末\n- 2 杯胡萝卜，薄片\n- 2 茶匙现磨的生姜\n\
  - 1 汤匙亚麻籽粉\n- 2 汤匙椰子油（分装用）\n- 1 根大葱，切片\n- 1/2 杯低钠鸡汤\n- 1 磅小切里眼脊牛排，切片\n- 2 颗西兰花头，切成小朵\n\
  - 1/2 茶匙辣椒碎\n- 柠檬汁\n- 1/4 茶匙海盐\n\n### 做法：\n用中大火在锅中加热 1 汤匙椰子油和大蒜。加入牛排和海盐翻炒，然后将牛排从锅中取出盛出备用。滤掉锅中的汁水。\n\
  \n在另一个碗中将柠檬汁、生姜、黑胡椒、亚麻籽粉和辣椒碎混合。在锅中加入西兰花和胡萝卜，然后倒入液体原料并翻匀裹匀。\n\n小火煮至西兰花变软。将牛肉放回锅中。加入大葱，煮至牛肉重新变热后享用。\n\
  \n## 牛肉蔬菜辣椒\n\n### 配料：\n- 5 盎司瘦肉牛肉末\n- 1 个中号番茄\n- 1/2 汤匙干辣椒粉\n- 2 瓣大蒜，切碎\n- 1 汤匙越抽汁\n\
  - 2 汤匙胡椒\n- 7 盎司罐装红腰豆\n- 1 个中号洋葱\n- 4 汤匙蘑菇\n- 孜然、香菜和辣椒粉\n- 6 汤匙芹芹\n\n### 做法：\n煎炒牛肉末，确保倒掉多余的脂肪。加入\
  \ 2 瓣切碎的大蒜煎一下，然后加入切碎的洋葱。加入剩余的切碎蔬菜多煮一会儿，然后加入一半去掉了细粉籽的干切碎辣椒。\n\n各加入半茶匙孜然和香菜粉、热辣椒粉以及\
  \ 1 汤匙越抽。\n\n加入切碎的番茄和罐装红腰豆，根据需要加入盐和黑胡椒调味。煮 1 小时后热食用。\n\n## 牛肉西葫芦\n\n### 配料：\n- 2\
  \ 杯水\n- 1 磅牛肉末\n- 2 个大西葫芦\n- 1/2 茶匙咖喱粉\n- 1 罐无盐番茄酱\n\n### 做法：\n将牛肉末煎褐色并去除多余脂肪。将西葫芦切块煮至软软。将其与肉混合，加入水、香料和罐装番茄酱。\n\
  \n煮后转小火。静置几分钟使其入味，然后享用。\n\n## 红酒汁牛排\n\n### 配料：\n- 1 磅脊排、菲力牛或牛臀肉（菲力牛非常适合此食谱）\n- 草饲黄油\n\
  - 1/2 杯红酒\n- 2 瓣压碎的大蒜\n- 1 茶匙新鲜碎末欧芹\n- 盐和现磨黑胡椒\n\n### 说明：\n准备肉类，两面进行调味。在煎锅中融化黄油。缓慢温柔地烹饪牛排会更嫩，但如果直接放入热锅中煎，可以产生“美拉德反应”，使肉变褐并让一切变得美味。\n\
  \n在黄油中四面煎香牛排，但不要过头。牛排在离锅后还会继续烹饪一会儿，所以目标是比你最终想要的熟度稍低一点。不要用叉子或刀反复戳刺牛排，因为这会浪费汁水并让肉变干。\n\
  \n在你对肉类满意后，或者大约 3 到 4 分钟后，快速取出并用锡纸包裹好，在此期间进行下一步。这样做是为了防止肉类变冷或变硬，并让它进一步熟化。\n\n在同一个锅中，你现在会有焦化的黄油和牛排的汁水。如果不多，加一勺额外的黄油并融化。加入大蒜煎至香，但不要焦。\n\
  \n加入葡萄酒，用大火快速煮干酒精并不断搅拌。几分钟后，你应该得到一种粘稠的浓缩汁，可以淋在切好的牛排上——如果没有，继续加热搅拌直到酱汁变稠。\n\n## 烤鸡\n\
  \n### 配料：\n- 1 只自由散养鸡，去除了内脏\n- 2 汤匙黄油\n- 4 瓣新鲜大蒜\n- 你喜爱的香草\n- 1/2 个新鲜柠檬\n- 盐和胡椒\n\
  - 橄榄油\n\n### 说明：\n制作烤鸡的方法有很多，但有时最简单的方法是最好的。记住在烤之前不要洗鸡，但一定要确保将皮肤擦干——这会让皮变脆。\n\n预热烤箱至\
  \ 350 华氏度（177 摄氏度）。\n\n将鸡放入烤盘中。用锋利的刀在胸肉周围的皮肤上切 6 到 8 处小口。\n\n在这些切口中塞入小块黄油、整瓣大蒜和香草。\n\
  \n最后，在整个鸡涂上橄榄油，并大量撒上盐和胡椒。\n\n将鸡胸朝下放入锅中烤 1 小时，直到汁水变清（粉红色表示还没好）。\n\n烤好后，让鸡静置 10 分钟再切开，然后搭配蔬菜和一杯白葡萄酒享用。\n\
  \n## 鸡汤\n\n### 配料：\n适用于各种汤类和炖菜。\n鸡架、胡萝卜、芹芹茎、月叶、黑粒椒、洋葱、苹果醋、你喜爱的香料。\n\n### 说明：\n找一个大锅，让鸡架完全浸没在水中。\n\
  \n加入水、所有蔬菜、醋（有助于从骨中提取矿物质）和香料。煮沸后小火慢炖至少 2 小时，不超过 4 小时。\n\n如有必要，如果蒸发过多可以在锅中加水。好且汤汁呈金色时，滤掉蔬菜和香料，丢弃骨头。它们应该非常脆弱，几乎就会散架。\n\
  \n鸡汤现在可以直接用于任何汤中（需要先加盐），冻在冰格盒中用于快速增味，或在冬季直接作为清澈的鸡汤饮用。如果你的汤不透明也不要担心。如果汤表面出现一层胶质层也不要惊——这说明你成功提取了营养，并获得了良好的汤头。\n\
  \n\n\n在一个小碗中混合酱油、蜂蜜和芝麻。蒸西兰花，放在一旁沥干水分，将鸡肉切成一口口的大小，并用橄榄油煎熟。将西兰花和鸡肉加入锅中，然后淋上酱汁。拌均匀后配上土豆食用。\n\
  \n# 结论\n\n读到这里，我很清楚你已经有动力开启健康生活之旅了。生酮饮食是一个极佳的起点，我知道你将获得巨大的成效。这种饮食是减肥减脂的一种极其简单且高效的方法，能让你的身体变成一台健康的机器。你不仅会减轻，这种饮食还带来了许多其他健康益处。另一个处是它能提高你身体将脂肪转化为能量的能力，这将提升你的能量水平并让你感觉棒极了。我深信，如果你能根据我在书中讨论的内容采取行动，无论你的目标是什么，你将获得成功。\n\
