  \n黑客训练营 (Hacking Bootcamp)\n\n## 学习计算机黑客基础\n\n在 [kindlebookspot.com](http://kindlebookspot.com)\
  \ 获取更多折扣书籍\n\n## 目录\n\n- 导言\n- 第 1 章：黑客——通用信息\n- 第 2 章：编程技能\n- 第 3 章：密码\n- 第 5 章：渗透测试\n\
  - 结语\n\n# 导言\n\n我想感谢你，并祝贺你下载了《学习计算机黑客基础（安全、渗透测试、如何黑客）》这本书。\n\n书中包含了关于如何攻击计算机网络的经过证明的步骤和策略。这本电子书将教你与黑客相关的基本思想和概念。它将解释经验丰富的黑客所使用的工具、方法和技术。通过阅读这些材料，你可以对你的目标网络进行侦察和软件攻击。\n\
  \n再次感谢下载这本书，希望你喜欢它！\n\n# 第 1 章：黑客——通用信息\n\n这本书可以帮助你成为一名伟大的计算机黑客。通过这些材料，你将能够：\n\n\
  *   像黑客一样思考——由于你将了解黑客攻击中使用的方法和技术，你可以攻击网络或保护自己免受他人侵害。\n*   学习“伦理黑客”——你不需要使用你的技能来渗透网络或盗取数据。在\
  \ IT（即信息技术）世界中，你可以利用你的新技能帮助企业和组织防止黑客攻击；因此，你可以通过成为“好”黑客来赚钱。\n*   给你的朋友和家人留下深刻印象——你可以向他人展示你的黑客能力。通过这种方式，你可以建立自己作为一名熟练程序员或计算机用户的声誉。\n\
  \n### 黑客——他们是谁？\n\n黑客是那些喜欢玩计算机网络或电子系统的人。他们喜欢发现计算机是如何工作的。根据计算机专家的说法，黑客主要分为两类：\n\n\
  *   白帽黑客（White Hat Hackers）——这类人被称为“好黑客”。白帽黑客将其技能用于合法目的。通常，他们会成为安全专家，保护公司和组织免受黑帽黑客的攻击（见下文）。\n\
  *   黑帽黑客（Black Hat Hackers）——这一类涉及将技能用于恶意/非法目的的黑客。这些黑客攻击网络、破坏网站并盗取机密信息。\n\n**重要提示：**\
  \ 这些术语源于西方电影，其中主角戴白色帽子，而反派戴黑色帽子。\n\n### 计算机黑客的层级\n\n在书的这部分，黑客根据其技能水平进行分类。请仔细学习这些材料，因为它可以帮助你衡量自己的进度。\n\
  \n*   新手黑客（The Would-Be Hackers）——在这类中，你会发现一些并不不知道自己在做什么的初学者。这些黑客通常计算机技能很差。他们使用他人创建的程序和黑客工具，而不知道其原理。\n\
  *   中级黑客（The Intermediate Hackers）——这些黑客熟悉计算机、操作系统和编程语言。通常，中级黑客知道计算机脚本是如何工作的。然而，和新手黑客一样，中级黑客并不创建自己的工具。\n\
  *   精英黑客（The Elite Hackers）——这一类由经验丰富的黑客组成。通常情况下，精英黑客创建在攻击或防御计算机网络时有用的工具和程序。此外，精英黑客可以在不被捕获的情况下访问系统。所有黑客都想达到这个水平。\n\
  \n### 要求\n\n你不可能一夜之间就成为精英黑客。要获得必要的技能，你必须耐心且执着。专注于你必须做的事情（例如：编写自己的程序、练习你的黑客技能、读更多书籍等）。通过投入时间和精力的，你可以快速达到精英水平。\n\
  \n黑客专家声称创造力很重要，特别是对于初学者来说。有了创造力，你可以轻松地找到问题的多个解决方案。你不需要担心资源或选择的限制。如果你足够创意，你一定能找到答案。你还应该有学习更多的欲望。黑客涉及随着时间推移而演变的复杂过程。你应该愿意花费几个、几天甚至几周的时间研究网络结构和攻击策略。如果你没有时间或耐心从事这项工作，那么你成为专家的机会微乎其微。\n\
  \n# 第 2 章：编程技能\n\n要成为一名有效的黑客，你应该具备足够的编程技能。创建和操纵计算机程序的能力大有益处。这种能力可以帮你掩盖足迹或混淆安全专家。然而，如果你想成为一名伦理黑客，你可以使用你的技能创建防御性的计算机程序。\n\
  \n嗯，你确实可以在网上购买现成的程序和黑客工具。这意味着你可以在不编写任何程序的情况下执行黑客攻击或防御你的网络。然而，依赖他人创建的程序并不能帮助你成为伟大的黑客。任何人都可以购买和使用黑客程序——但创建一个这样的程序需要技能和知识。\n\
  \n每当你攻击、防御或测试网络时，你都应该理解与活动相关的一切内容。由于黑客攻击和系统测试涉及程序，编程技能可以帮助你在完成任务时获得有效性和准确性。\n\n\
  如果你知道如何编程，那么你将享受以下好处：\n\n*   其他黑客会认为你是一个专家。\n*   你可以根据你的特定需求专门创建程序。例如，如果你需要停止某种病毒，你可以创建自己的安全程序来实现你的目标。你不需要去网上尝试各种通常昂贵的防病毒软件了。\n\
  *   你将对自己的技能更有信心。就像从事任何其他努力一样，如果一个人信任自己的技能，黑客行为将变得容易且简单得多。\n\n简单来说，不要依赖市场上的黑客程序。学习一些编程语言并掌握必要的技能。通过这样做，你将进入计算机和黑客的新世界。\n\
  \n\n\n\n\n如果你能先学习 `HTML` 那就太好了。`HTML`（即超文本标记语言）是一种构成你在网络上所看到的所有网站的编程语言。如果你计划攻击或建立一个网站，你必须知道如何使用\
  \ `HTML` 语言。大多数人说 `HTML` 简单且易于掌握。这意味着即使你以前从未编写过任何代码，也能轻松学会这门语言。\n\n在掌握 `HTML` 之后，你应该学习\
  \ `C` 编程语言。`C` 是今天最流行的计算机语言。它构成了黑客使用的大多数工具的基础。它可以帮助你创建自己的病毒或防御程序。\n\n# 学习计划\n\n\
  这是一份可以帮助你掌握任何编程语言的学习计划：\n\n1. 购买一本关于你所选语言的“入门书籍”。在购买之前，先阅读其他书读者的评价。这样，你就不会在无用的材料上浪费时间和/或金钱。\n\
  2. 一旦你学会了如何使用这种语言，就必须定期练习它。\n3. 几乎所有的编程书籍都包含练习和实践题。通过完成这些练习题来进一步磨炼你的技能。\n4. 如果你遇到任何困难的内容，不要跳过或忽略它。尝试理解那个“东西”是如何工作的，以及它与编程和/或黑客攻击的关系。如果你跳过了复杂的概念，将学不到很多东西。\n\
  5. 寻找一个程序员在线论坛。大多数时候，经验丰富的程序员乐于帮助初学者。这意味着当学习过程中遇到问题时，你可以随时上网向“专业人士”提问。\n6. 应用你所学。如果你能用这种语言创建自己的计算机程序，那就太好了。\n\
  \n# 第 3 章：密码\n\n如今，密码是网络和网站的唯一保护形式。如果你拥有这条信息，你将获得者账户的完全访问权限。这就是为什么黑客使用各种工具和技术仅仅是为了获取密码。\n\
  \n## 密码破解——传统方法\n\n以下列表显示了破解密码时使用的传统技术：\n\n* **猜解** – 这种方法只对弱密码有效。例如，如果用户根据个人信息（如电话号码、出生日期、喜欢的动物等）创建密码，你可以通过尝试不同的可能性来轻松确定密码。如果黑客了解关于用户的几点信息，这种技术会变得更有效。\n\
  * **窥视视** – 在这里，你会在目标输入密码时从他的肩膀后面看。如果目标打字速度慢，这种方法可以给你极佳的结果。\n* **社会工程学** – 在这种技术中，你利用目标的信任来获取所需的信息。例如，你可能会给目标打电话，假装你属于公司的\
  \ IT 部门。你可以告诉目标你需要密码，以便访问他的账户并进行一些重要的更新。\n\n## 密码破解——现代技术\n\n在本节中，你将学习用于破解密码的最新技术。\n\
  \n**重要提示：** 本节使用了一些你需要安装的计算机程序。\n\n### 字典攻击\n\n在这种方法中，你必须使用包含常用密码的文本文件。你将尝试每个密码以查看哪一个有效。这种方法简单又快捷。然而，你只能将其用于弱密码。为了帮助你理解这种技术，让我们来分析以下例子：\n\
  \n一个黑客使用 `Brutus`（即一种流行的密码破解程序）访问一个 `FTP`（即文件传输协议）服务器。\n\n在讨论例子之前，让我们先谈谈 `FTP` 服务器。`FTP`\
  \ 服务器允许你通过互联网发送或接收文件。如果黑客获得了某个网站 `FTP` 服务器的访问权限，他可能会操纵或删除该服务器内的文件。\n\n现在，你准备好看例子了。我们开始：\n\
  \n1. 黑客访问 `FTP` 服务器的登录页面。\n\n![](img/image01852.jpeg)\n2. 然后，他启动 `Brutus` 来破解服务器密码。\n\
  \n![](img/image01853.jpeg)\n3. 他指明服务器类型（即 `FTP`）和 IP 地址。\n4. 他输入一个有效的用户名。\n5. 他选择包含密码列表的文本文件。\n\
  6. 他点击“开始”按钮。`Brutus` 程序将连接到 `FTP` 服务器并尝试使用文件中的密码登录。如果过程成功，`Brutus` 将在它的“正向验证结果”部分显示正确的密码。这是一张截图：\n\
  \n![](img/image01854.jpeg)\n\n**重要提示：** 顶尖黑客在使用此类类计算机程序时都会使用代理。基本上，代理通过从另一台计算机传输连接请求来隐藏你的\
  \ IP 地址。这非常重要，因为多次登录尝试会产生大量的电子“足迹”。\n\n### 暴力破解法\n\nIT 专家声称这种方法可以破解任何类型的密码。在这里，黑客尝试数字、字母和特殊符号的所有可能组合，直到他进入目标账户。这种方法的主要缺点是耗时。这是可以理解的——为了访问目标账户，你必须尝试成千上万可能的密码。\n\
  \n这种方法的速度取决于两个因素：\n\n* 密码的复杂性\n* 计算机的处理能力\n\n在上一个示例使用的黑客工具 `Brutus` 也可以对服务器发起暴力破解。其工作原理如下：\n\
  \n1. 指定目标的 IP 地址和服务器类型。在“模式”部分，选择“暴力破解”并点击“范围”。下面的图像将作为你的指南：\n\n![](img/image1855.jpeg)\n\
  2. 屏幕将向你显示一个对话框（如下）。使用此对话框配置暴力破解方法。显然，如果你对目标密码有些了解，你的工作将简单得多。\n\n![](img/image1856.jpeg)\n\
  3. 点击“确定”按钮。`Brutus` 将通过尝试所有可能的密码登录服务器。你将在程序的 `GUI`（即图形用户界面）上看到结果。\n\n### 网络钓鱼\n\
  \n在这种技术中，你通过欺骗受害者来窃取机密信息（如密码）。例如，一个黑客假装成银行代表向目标用户发送了一封邮件。邮件要求用户通过点击链接更改密码。当用户点击链接时，她看到了一个与实际银行相似的网站。然而，该网站只是一个副本。在那里输入的任何信息都将进入黑客的数据库或电子邮件账户。\n\
  \n**重要提示：** 顶尖黑客使用 `HTML` 创建看起来像官方的钓鱼网站。\n\n以下是你创建钓鱼网站时需要做的事：\n\n1. 选择你的目标 – 大多数黑客会模仿电子邮件提供商的网站。有两个原因：\n\
  \    1. 用户经常登录电子邮件账户。这意味着黑客有很多机会欺骗他的目标。\n    2. 电子邮件账户非常有用。大多数时候，电子邮件账户与其他账户（如银行账户）关联。因此，通过破解他的电子邮件账户，你就可以获得关于用户的大量信息。\n\
  2. 复制官方网页 – 启动 Mozilla Firefox（黑客推荐此浏览器，因为它安全且可定制）并访问实际网站的登录页面。在键盘上按下 `CTRL+S` 创建网页的本地副本。\n\
  \n\n\n\n\n### 3. 重命名文件 – 保存网页后，将其重命名为 `index.htm`。首页页是任何人访问网站时都会显示的第一个网页；因此，你希望目标用户相信他访问了真实网站的首页页。\n\
  \n### 4. 创建脚本 – 你应该创建一个计算机脚本来记录用户的登录信息。大多数黑客使用 `PHP` 脚本语言来完成此任务。下面的图片显示了一个记录登录凭据的基础\
  \ `PHP` 脚本。\n\n启动 `Notepad`（记事本）并输入脚本。将文件保存为 `phish.php`。\n\n![](img/image01857.jpeg)\n\
  \n### 5. 创建一个空的 `.txt` 文件并保存为 `list.txt`。\n\n### 6. 将脚本添加到网页中 – 使用 `Notepad`（记事本）打开名为\
  \ `index.htm` 的文件。按下 `CTRL+F`，输入 `action` 并点击“查找下一个”。这是一个截图：\n\n![](img/image01858.jpeg)\n\
  \n在脚本的 `form id` 部分寻找 `action`。你会发现那里有一个 URL ——将其删除并输入 `phish.php`。通过这样做，你是在指示表单将用户信息发送到你的\
  \ `PHP` 脚本而不是发送到 Google。\n\n搜索显示 `method=\"post\"` 的部分。将 `post` 替换为 `get`，使代码段变为\
  \ `method=\"get\"`。\n\n### 7. 保存文件并关闭。\n\n### 8. 将 HTML 文件上传到网站托管主机 – 托管服务提供商将为你提供该伪造网页的\
  \ URL。你可以将该 URL 用于黑客攻击。\n\n### 9. 如果你访问该网页，你会发现它看起来和官方 Gmail 登录页面完全一样。该网页将记录在其中输入的用户名和密码。它会将信息保存在空\
  \ `.txt` 文件旁边。\n\n## 彩虹表 (Rainbow Tables)\n\n基本上，彩虹表是每个可能的字符组合的哈希值的巨大列表。要获取哈希值，你必须通过运行算法转换密码（或字符组合）。这是一种单向加密：你无法使用哈希值来确定原始数据。大多数网站数据库使用\
  \ `MD5`（一种用于哈希的数学算法）来保护密码。\n\n假设你注册了一个网站。你输入了所需的登录凭据（即用户名和密码）。一旦点击“提交”按钮，算法将处理密码并将哈希值存储在网站的数据库中。\n\
  \n由于无法通过哈希值确定密码，你可能想知道网络如何知道你的密码是正确还是错误的。很好，当你输入登录凭据时，系统通过算法运行这些信息。然后，它会将生成的哈希与网站数据库中保存的哈希值进行比较。如果哈希值匹配，你就能成功登录。\n\
  \n像 `MD5` 这样的数学算法可以从简单的密码生成复杂的字符串。例如，如果你使用 `MD5` 加密“cheese”，你会得到：`fea0f1f6fede90bd0a925b4194deac11`。\n\
  \n根据专家黑客的说法，这种方法比暴力破解法更有效。一旦你创建了彩虹表（即哈希值列表），你就可以快速破解密码。\n\n## 如何防止这些密码破解技术？\n\n\
  ### 社会工程学 (Social Engineering)\n\n为了阻止“社会工程师”，你必须保持小心和专注。如果有人给你打电话，而你认为他在对你使用社会工程学策略，请问他一些证明其身份的问题。\n\
  \n**重要提示：** 一些精英黑客会研究他们的目标。这意味着他们可能会通过回答你的问题来“证明自己的身份”。因此，如果你仍然怀疑此人所说，你应该联系他声称所属的部门负责人，以获取更多信息。\n\
  \n### 窥视攻击 (Shoulder Surfing)\n\n在输入登录凭据时，确保没有看到看到你在输入的内容。如果你看到可疑的人，靠近他并练习你的摔跤技巧。好吧，并不是真的。你只需要在输入信息时保持小心。\n\
  \n### 猜词 (Guessing)\n\n为了防止这种攻击，不要使用与你的个人信息相关的密码。无论你对你的宠物或配偶有多深爱，都永远不要使用他们的名字作为密码。\n\
  \n### 字典攻击 (Dictionary Attack)\n\n你可以轻松地保护自己免这种攻击——不要使用字典中找到密码。不，将字母替换为数字（例如 `banana`\
  \ – `b4n4n4`）是不安全的。创建密码时，最好将字母、数字和特殊字符结合。\n\n### 暴力破解法 (Brute-Force Approach)\n\n\
  为了防止这种技术，你应该使用包含大量数字和特殊符号的长密码。长而复杂的密码会给“暴力破解者”带来困难的问题。如果黑客在尝试几天后仍无法破解你的密码，他可能会寻找另一个目标。\n\
  \n### 钓鱼攻击 (Phishing)\n\n为了保护自己免受这种技术，你只需要检查浏览器的地址栏。例如，如果你应该在 `www.facebook.com`，但地址栏显示了不同的\
  \ URL（例如 `www.pacebook.com`、`www.faccbook.com`、`www.focebook.com` 等），你就知道黑客正试图欺骗你。\n\
  \n### 彩虹表 (Rainbow Tables)\n\n你可以通过创建长密码来防止这种技术。根据精英黑客的说法，为长密码生成哈希表涉及大量资源。\n\n###\
  \ “密码破解 (Password Crackers)”\n\n以下是黑客在破解密码时使用的程序：\n\n* `SolarWinds`\n* `Can and\
  \ Abel`\n* `RainbowCrack`\n* `THC Hydra`\n* `John the Ripper`\n\n## 第章：如何攻击网络\n\n\
  在本章中将学习如何攻击网站和网络。仔细学习这些材料，因为它将教你有关黑客的重要思想和技术。\n\n### 足迹扫描 (Footprinting)\n\n“足迹扫描”一术是指收集有关计算机网络及其所属公司或组织的数据。这一过程是大多数黑客攻击的第一步。足迹扫描是必要的，因为黑客在进行攻击之前必须了解目标的一切。\n\
  \n以下是你扫描网站时需要采取的步骤：\n\n1. 你应该研究网站使用的名称和电子邮件地址。如果你计划对目标执行社会工程学策略，这些数据将非常有用。\n\n2.\
  \ 获取网站的 IP 地址。要获取此信息，访问 `site(http://www.selfseo.com/find_ip_address_of_a_website.php)`\
  \ 并输入目标 URL。然后，点击“Get IP”按钮。几秒后，屏幕将显示目标的 IP 地址。\n\n3. Ping 目标服务器以检查其是否活跃。显然，你不想浪费时间攻击一个“死”目标。精英黑客使用\
  \ `www.just-ping.com` 完成此任务。基本上，从全球各地 ping 网站。\n\n使用此工具时，只需将目标 URL 或 IP 地址输入文本框并点击“ping！”。这是一个截图：\n\
  \n![](img/image01859.jpeg)\n\n网页将显示目标是否活跃。\n\n4. 对网站执行 WHOIS 搜索。访问 `http://whois.domaintools.com`\
  \ 并输入目标 URL。屏幕将显示关于拥有目标网站的人/公司/组织的大量数据。\n\n**重要提示：** WHOIS 搜索为黑客提供了不同类型的信息，如姓名、地址和电话号码。\n\
  \n### 端口扫描 (Port Scanning)\n\n这是黑客过程的第二阶段。在收集有关目标的信息后，你应该执行“端口扫描”。基本上，“端口扫描”是一个检测网络中存在的开放端口和监听设备的过程。这意味着你可以利用这一步骤识别目标的漏洞和防御系统。\n\
  \n以下练习将说明端口扫描的工作原理：\n\n\n\n\n\n1. 从此站点下载 `Nmap`：[`nmap.org/download.html`](http://nmap.org/download.html)。然后，将程序安装到你的电脑中。\n\
  \n注意：此软件适用于 Windows 和 Macintosh 电脑。\n\n2. 启动 `Nmap` 并输入目标的 URL。对于本次练习，让我们假设你想破解一个名为\
  \ [www.target-site.com](http://www.target-site.com) 的网站。\n\n3. 寻找“Profile”（配置）部分并点击其下拉按钮。屏幕将向你显示几个扫描选项。大多数情况下，精英黑客会对他们的目标进行快速（且轻量）的扫描。全版本扫描可能会触发目标的防御系统，因此最好远离这些选项。这里是下拉菜单的截图：\n\
  \n![](img/image01860.jpeg)\n\n4. 点击“Scan”（扫描）按钮并等待结果。这里是一个示例：\n\n![](img/image01861.jpeg)\n\
  \n如你所见，`Nmap` 可以检测目标上存在的端口和服务项。\n\n## 封纹抓取 (Banner Grabbing)\n\n在此阶段，你将获得有关目标端口和服务的更多信息。黑客使用\
  \ `telnet` 来完成此任务。下面的练习将帮助你理解这一阶段：\n\n1. 访问你电脑的终端（如果你是 Mac 用户）或命令提示符（如果你是 Windows\
  \ 用户）。\n\n重要提示：如果你的操作系统是 Windows Vista，你必须手动安装 `telnet`。以下是你需要的操作：\n\n1. 1. 转到控制面板并点击“程序和功能”。\n\
  2. 2. 点击“启用或关闭 Windows 功能”并选择“Telnet 客户端”。\n3. 3. 点击确定 按钮。\n4. 4. 屏幕将向你显示一条确认消息。\n\
  \n2. 选择一个开放端口。对于本次练习，让我们假设你选择了 21 端口（即 FTP 端口）。要确定目标使用的 FTP 软件，请使用以下语法：`telnet <目标的\
  \ URL> <你选择的端口号>`\n\n对于目前的示例，你应该运行的命令是：\n\n```\ntelnet [www.target-site.com](http://www.target-site.com)\
  \ 21\n```\n\n3. 你的电脑将确定所选端口的类型和版本。然后，它将在屏幕上显示信息。这里是一个示例：\n\n![](img/image01862.jpeg)\n\
  \n## 寻找漏洞\n\n现在你已经有了一些关于端口软件的信息，你可能开始寻找可用的“漏洞利用”（exploit，即用于破解计算机/网络的工具）。如果有可用的漏洞利用，你可能可以在目标服务上使用它并获得完全控制权。另一方面，如果没有可用的漏洞利用，你必须在不同的端口上尝试。\n\
  \n以下是黑客常用的漏洞数据库：\n\n* `osvdb`\n* `exploit-db`\n* `SecurityFocus`\n\n许多黑客在没有当前端口的漏洞利用时，会寻找另一个端口。然而，你不能假设所有的黑客都会这样做。某些黑客，特别是经验丰富的黑客，会分析目标端口，寻找漏洞并创建漏洞利用。计算机黑客将新发现的漏洞称为“0\
  \ 日漏洞”（0-day）。这些漏洞提供以下优势：\n\n* 没人知道如何修复该漏洞。这意味着在漏洞被发现和修复之前，你可能会破解无数网站。\n* 发现者可能会以高价出售该漏洞。人们愿意花费数百（甚至数千）美元来获取新鲜漏洞。\n\
  * 发现网络漏洞并生成相应的漏洞利用表明你技术高超且知识丰富。其他黑客会将你视为专家。\n\n## 最常见的黑客攻击\n\n在讨论实际的网络渗透之前，让我们谈谈两种最流行的黑客攻击。\n\
  \n**DoS**——这是“拒绝服务”（Denial-of-Service）的缩写。通过这种攻击，黑客想要关闭服务器。这意味着合法用户将无法访问网络或使用受影响的服务。大多数情况下，黑客通过向目标网络发送无尽的数据流来实现这一点。这种策略迫使网络消耗所有的可用资源。一旦资源被耗尽，没有任何人能够使用网络。\n\
  \n**缓冲区溢出 (Buffer Overflow)**——黑客也将这种攻击称为“BoF”。缓冲区溢出攻击发生在当计算机程序尝试将大量数据保存到存储区域（也称为“缓冲区”）时。由于缓冲区的存储容量有限，多余的数据将进入其他区域。当发生这种情况时，黑客可能会用恶意代码淹没网络。\n\
  \n## 两种类型的漏洞利用\n\n黑客将利用分为两类，即：\n\n**本地漏洞利用 (Local Exploits)**——这些利用要求黑客物理接触目标计算机。通常情况下，攻击者利用这种利用来提升他们在机器或网络上的访问权限。简单来说，你可以使用本地漏洞利用来获得对目标的管理员权限。\n\
  \n**远程漏洞利用 (Remote Exploits)**——这些利用与本地的类似。唯一的区别是，黑客可以在不物理接触目标的情况下运行远程漏洞利用；因此，与本地利用相比，远程利用更安全。\n\
  \n重要提示：大多数情况下，黑客在攻击中会同时使用两种类型的漏洞利用。例如，你可能使用远程利用来获得普通权限。然后，你可以使用本地利用获得对目标的管理员访问。这种方法允许你完全控制一台机器或网络。\n\
  \n## 渗透\n\n本节将教你黑客如何渗透他们的目标。\n\n### 编程语言\n\n在练习黑客技巧时，你会发现黑客使用不同的语言。以下列表显示了最流行的语言：\n\
  \n* **PHP**——你会发现很多利用。使用这种语言编写利用时，必须以 `<?php` 开始并以 `?>` 结束。让我们假设你想对 FTP 服务器造成损害。这是攻击目标时需要采取步骤：\n\
  \n1. 1. 安装 PHP 语言。你可以访问 [`www.wampserver.com/en/`](http://www.wampserver.com/en/)\
  \ 来免费获取 PHP。\n2. 2. 从 Exploit-DB 复制 PHP 代码并粘贴到编辑器中。将文档保存为 `exploit.php`。\n3. 3.\
  \ 修改代码输入目标的 IP 地址。将修改后的文件保存到 PHP 目录（即包含 `.exe` 文件的目录）。\n4. 4. 访问电脑的命令提示符。然后，运行 `cd`\
  \ 命令（即切换目录）并指定 PHP 目录的位置。\n5. 5. 输入 `php exploit.php` 并按回车键。\n6. 6. 你的电脑会对目标发起 DoS\
  \ 攻击。只有当你关闭命令提示符时，攻击才会停止。\n7. 7. 测试攻击的效果。访问目标网站并点击标签/按钮。如果攻击成功，网站将卡顿且加载时间异常。一段时间后，网站可能会完全离线。\n\
  \n* **Perl**——这种语言像 PHP 一样简单。使用这种编程语言，你应该：\n\n1. 1. 访问此站点：[`www.activestate.com/activeperl`](http://www.activestate.com/activeperl)。然后，下载并安装正确版本的\
  \ Perl。\n2. 2. 寻找一个你可以使用的利用。对于本书，让我们假设你想使用此利用攻击 WinFTP 服务器：[`www.exploit-db.com/exploits/36861/`](https://www.exploit-db.com/exploits/36861/)。\n\
  3. 3. 修改代码输入所需的信息（例如目标的 URL、你想攻击的端口等）。然后，将其复制到文本文件中并将文档保存为 `exploit.pl`。\n4. 4.\
  \ 访问命令提示符。指定 Perl 文件的位置。\n\n\n\n\n5. 输入 `perl exploit.pl` 来运行漏洞程序。该程序将针对你的目标发起 DoS\
  \ 攻击。与之前的示例一样，该漏洞只有在你关闭命令提示符窗口后才会停止。\n\n# 第 5 章：渗透测试\n\n渗透测试是一种合法的尝试，旨在对计算机网络进行检测、探测和攻击。在大多数情况下，这种测试是由网络所有者发起的。他们希望黑客针对被测试的网络运行漏洞程序，以便他们可以衡量并改进防御能力。\n\
  \n在进行渗透测试时，你应该寻找目标中的漏洞并进行 POC（即概念证明）攻击。POC 攻击是一种设计用于证明已发现漏洞的黑客攻击。有效的渗透测试总是会对过程中发现发现的问题提供详细的修复建议。简单来说，渗透测试保护了网络和计算机免受未来黑客攻击的影响。\n\
  \n## 渗透测试的四步模型\n\n黑客将渗透测试分为四个不同的步骤。这种方法有助于他们识别在过程的任何阶段需要做的事情。让我们来讨论每一个步骤：\n\n###\
  \ 侦察 (Reconnaissance)\n\n在这一步中，黑客需要收集有关目标的信息。这有助于黑客识别他需要使用的工具和程序。如果黑客想要确保自己成功，他必须在侦察步骤花费大量时间。\n\
  \n### 扫描 (Scanning)\n\n这一步包含两个部分：\n\n1. 端口扫描 – 你在之前的章节中学习过这个主题。基本上，端口扫描是检测目标中可用端口的过程。端口充当通信线——一旦你检测并控制了它，你就能与目标网络进行交互。\n\
  2. 漏洞扫描 – 在过程中，你将搜索网络中存在的漏洞。你将使用发现的端口（见上文）来访问并利用漏洞。\n\n### 利用 (Exploitation)\n\n\
  由于你已经收集了有关目标的信息，扫描了网络端口并搜索了现有的漏洞，你现在准备好进行“实际黑客攻击”了。这一步涉及各种工具、代码和技术（某些已经在之前讨论过）。此阶段的主要目标是获得网络的管理员权限。\n\
  \n### 维持访问 (Maintaining Access)\n\n这是四步模型的最后一部分。显然，建立目标的管理员权限是不够的。你必须维护该访问权限，以便能够对系统进行其他攻击并证明漏洞的存在。为了完成这项任务，白帽黑客使用后门程序和远程漏洞利用。\n\
