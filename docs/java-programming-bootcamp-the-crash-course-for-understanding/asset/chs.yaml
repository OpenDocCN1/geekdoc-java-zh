  \ `4 cups` 婴儿芝麻菜\n* `2 ounces` Tofutti 奶油奶士\n\n**做法：**\n1. 按照厂家说明准备意面。用冷水冲洗并沥干。\n\
  2. 与此同时，在食物料理机中将大蒜、油和辣椒打成泥。加入醋搅拌至光滑。加入酸奶点打至均匀。放入大碗中。\n\n### 8. 素食早餐食谱\n\n#### 烤芦笋奶士煎饼\n\
  \n**食材：**\n* `12 根` 芦笋\n* `1½ teaspoon` 蔬菜油\n* 盐\n* 胡椒\n* `1 cup` 苹果酱\n* `4 tablespoons`\
  \ 橄榄油\n* `150g` 软奶士\n\n**做法：**\n1. 将芦笋淋上蔬菜油、盐和胡椒。在烤箱（烤架模式）下烤 `3-4 minutes` 确保不要过火。\n\
  2. 用叉子搅拌苹果酱。\n3. 在一个小煎锅中加热橄榄油。当煎饼半凝固时，放入煎饼。\n\n#### 无小麦西菜花奶士\n\n**食材：**\n* `1 整颗`\
  \ 西菜花\n* `2 tablespoons` 枫糖\n* `1 tablespoon` 橄榄油\n* 适量盐和胡椒\n* `350g` 酸奶油\n* `50g`\
  \ 素食格鲁耶奶士，碎\n* `2 teaspoon` 德式芥末\n* `1 tablespoon` 素食帕玛森奶士，碎\n* `1 tablespoon` 新鲜小葱\n\
  \n**做法：**\n1. 将烤箱预热至 `375 F`。将西菜花切成小朵并在碗中与枫糖和橄榄油混合。放入烤盘中烤 `15 minutes`。\n2. 将酸奶油、格鲁耶奶士和芥末放入碗中，拌入烤好的西菜花。\n\
  3. 撒上帕玛森奶士并放回烤箱。再烤 `10 minutes`。撒上小葱即可上菜。\n\n#### 菠菜吐司\n\n**食材：**\n* `250g` 杏仁粉\n\
  * `1½ teaspoon` 无麸质泡打粉\n* `½ teaspoon` 凯尔盐\n* `¼ teaspoon` 小苏打\n* `2 束` 英国菠菜，焯水、沥干并去茎\n\
  * `60ml` 无添加剂椰奶\n* `1 tablespoon` 苹果醋\n* `1 teaspoon` 现榨柠檬汁\n* `1 根` 香蕉 = 2 个鸡蛋（替代）\n\
  * 蔬菜油\n\n**做法：**\n1. 将烤箱预热至 `345 F`。在面包模上油并垫上烘焙纸。\n2. 在大碗中混合面粉、泡打粉、盐和小苏打。在搅拌机中将菠菜叶与椰奶、醋、柠檬汁、香蕉和蔬菜油一起打碎。\n\
  3. 将混合物盛入面包模中，烘烤 `45 minutes`。取出后放在晾架上冷却。\n\n\n\n\n\n* 2 根红洋葱\n* 大蒜\n* 80g 去皮杏仁\n\
  * 煮熟的鹰嘴豆，沥干\n* 50g 葡萄干\n* ½ 束香菜\n* 2 汤匙柠檬汁\n* 无盐黄油\n* ¼ 杯苹果酱\n* 30g 芝麻\n* 石榴果籽\n\
  * 3 汤匙流稠的蜂蜜\n\n### 制作方法\n\n1. 预热烤箱至 375 F。在平底锅中煎香香菜和孜然籽。用研臼和捣杵将其捣碎磨粉，加入红椒粉、`cumin`、`cinnamon`、一半橄榄油和一小撮盐。\n\
  2. 将南瓜放入烤盘中，拌入香料油混合物。烤 25 分钟。\n3. 与此同时，在一个大汤锅中加热剩余的橄榄油，放入红洋葱。炒至焦糖化。加入大蒜和杏仁炒 3 分钟。取出。加入鹰嘴豆、葡萄干和南瓜并压成泥状。加入香菜和柠檬汁，根据口味调味。\n\
  4. 铺一张饼皮，刷上融化的黄油，再铺另一层。盛入四分之一的南瓜馅，折叠两侧，卷起并扭成螺旋状。放在烤箱烤盘上。\n5. 在顶部刷上苹果酱并撒上芝麻。烘烤 20\
  \ 分钟，淋上蜂蜜和石榴果籽即可。\n\n### 5. 番茄莎莎菠菜烘姆蛋（Frittata）\n\n#### 配料\n\n##### 烘姆蛋配料\n* 1 汤匙特级初榨橄榄油\n\
  * 2 瓣大蒜，切末\n* 1 个小洋葱，切末\n* 1 包菠菜，解冻并充分沥干\n* 2 根香蕉 = 代替鸡蛋\n* 1/3 杯无脂牛奶\n* ½ 杯碎低脂马马苏里拉奶士\n\
  \n##### 莎莎配料\n* 4 个小西番茄，切碎\n* 1 瓣大蒜，切末\n* 2 根小葱，切末\n* 1 汤匙新鲜柠檬汁\n* 2 汤匙新鲜香菜，切末\n\
  * ¼ 茶匙盐\n* 1/8 茶匙磨碎黑胡椒。\n\n#### 制作方法\n\n1. 制作烘姆蛋：预热烤箱至 350 F。在不粘锅中加热油。加入大蒜和洋葱炒 3\
  \ 分钟。放入菠菜并将火力调至小火。\n2. 在碗中压碎香蕉，倒入牛奶，搅拌搅拌至起泡。将混合物倒入在菠菜上煮 5 分钟。撒上奶士，放入烤箱烘烤 8 分钟。\n\
  3. 制作莎莎：在大碗中，将西番茄、大蒜、小葱、新鲜柠檬汁、香菜、盐和胡椒混合均匀。淋在烘姆蛋上即可享。\n\n### 6. 蜂蜜烤小包\n\n#### 配料\n\
  \n* 300g 普通白小麦面粉\n* 50g 糖\n* 1.5g 速干酵母\n* 200g 牛奶\n* 6g 盐\n* 植物油\n\n##### 馅料：\n\
  * 25g 干混合果皮\n* 75g 葡萄干\n* 橄榄油\n* 50g 红糖\n\n##### 糖衣\n* 蜂蜜，融化状\n\n#### 制作方法\n\n1.\
  \ 在大碗中放入面粉并挖一个洞。将糖和酵母放入洞中，倒入牛奶。盖好静置一小时。\n2. 将食材汇聚成一个大面团并揉 10 分钟。加入油和盐，再揉 10 分钟。将面团放回碗中静置\
  \ 30-45 分钟。\n3. 与此同时，混合用于馅料的干果、黄油和糖。\n4. 取面团刷上橄榄油。顶部撒上糖和水果混合物包裹。卷起面团形成紧凑的香肠状。切成\
  \ 8 份，放入 450 F 的烤箱中烘烤。\n5. 烘烤 15 分钟取出。顶部淋上融化的蜂蜜即可享。\n\n### 7. 早餐花生燕麦粥\n\n#### 配料\n\
  \n* ¼ 杯杏仁奶\n* 1½ 汤匙花生酱\n* ½ 杯水\n* ¼ 杯 燕麦\n* 1 汤匙 椰奶酸奶\n* 1 茶匙花生，细碎\n\n#### 制作方法\n\
  \n1. 将杏仁奶和花生酱搅拌打匀，混合至奶油状。加入水并搅拌直到混合物变得光滑。拌入燕麦。\n2. 用保鲜膜覆盖，但留出一个小口让蒸汽排出。高火微波加热 1\
  \ 分钟，直到呈奶油状。取出冷却 5 分钟。\n3. 将混合物盛入碗中。顶部上椰奶酸奶和花生即可享。\n\n# 第 3 章 – 素食午餐食谱\n\n素食菜的妙处在于，它们是等待被发现并转化为精美、易于制作且健康的传统食物。例如，预烤胡萝卜可以带出其自然的甜味，这种甜味与素食奶士和香料完美平衡。而且，还有许多蔬菜等待被发现！\n\
  \n### 1. 烤番茄茄子煎\n\n#### 配料\n\n* 6 个牛西番茄\n* 9 茶匙特级初榨橄榄油\n* 1 个小洋葱，细碎\n* 2 手抓罗勒叶\n\
  * 适量盐和胡椒\n* 3 汤匙普通面粉\n* 400g 小茄子，切圆片\n* ¼ 杯苹果酱\n* 200g 素食马苏里拉奶士\n\n#### 制作方法\n\n\
  1. 预热烤箱至 400F。\n2. 制作盖子：切掉西番茄顶部，留约四分之一的深度。取出籽，在空腔内加入一小撮盐，备用。\n3. 加热橄榄油，煎洋葱。放入西番茄果肉，加入盐和胡椒。\n\
  4. 在另一个锅中加热橄榄油，放入番茄酱料和罗勒叶。将茄子圆片裹上面粉，刷上苹果酱。\n5. 将茄子装入西番茄空腔中，淋番茄酱料，撒上马苏里拉奶士。将西番茄放入烤箱烤\
  \ 25 分钟，淋上剩余的油即可。\n\n### 2. 孜然味烤胡萝卜配奶士\n\n#### 配料\n\n* 1 茶匙孜然籽\n* 1 汤匙香菜籽\n* 1 茶匙黑洋葱籽\n\
  * 2 汤匙芝麻\n* 4 汤匙花生油\n* 1 kg 胡萝卜，切片\n* 1 汤匙流稠蜂蜜\n* 2 个绿辣椒，去籽切片\n* 适量盐和胡椒\n* 200g\
  \ 奶士\n\n##### 酱汁\n* 柠檬汁\n* 芝麻油\n* 花生油\n\n#### 制作方法\n\n1. 预热烤箱至 200 F。在干平底锅中加入孜然籽和香菜籽。烤\
  \ 1 分钟后捣碎。\n2. 以同样的方法烤洋葱和芝麻。加入花生油、蜂蜜、辣椒，用盐和胡椒调味。\n3. 放入盘中烤 40 分钟后冷却。\n4. 将酱汁食材混合，加入胡萝卜中。拌匀即可。\n\
  \n### 3. 烘烤香料蔬菜\n\n#### 配料\n\n* 橄榄油\n* 2 个红洋葱，去皮切片\n* 2 瓣大蒜，去皮并捣成泥\n* 海盐匙孜然粉\n*\
  \ 2 茶匙香菜粉\n* ¼ 茶匙丁香粉\n* ½ 茶匙肉蔻\n* 1 茶匙红醋\n* 1 茶匙牛至\n* 400g 罐装碎番茄\n* 1 汤匙糖\n* 3 个红灯椒，切四份\n\
  * 3 个西葫芦，切片\n* 2 个茄子，切片\n* ¼ 杯苹果酱\n\n#### 制作方法\n\n1. 预热烤箱至 350 F。在一个大汤锅中用中小火加热橄榄油，加入洋葱。用盐和胡椒调味并炒至软。\n\
  2. 加入大蒜泥、孜然粉、香菜粉、丁香粉和香料。炒 1 分钟，倒入红醋、牛至、番茄和糖。炖。\n3. 与此同时，在烤烤锅上加热少量油，分批煎红灯椒、西葫芦和茄子。转移到番茄酱中炖\
  \ 10 分钟。\n4. 将蔬菜放入烤箱烘烤 15 分钟。\n5. 取出烤箱，加入苹果酱。用盐和胡椒调味。返回烤箱再烤 15 分钟即可。\n\n### 4. 烤蔬菜\n\
  \n* 大洋葱，切碎\n* 薄皮南瓜\n* 莳茴，修剪\n* 纽蘑菇\n* 胡萝卜\n* 欧洲芹根\n* 4 瓣大蒜\n* 4 汤匙橄榄油\n* 盐和胡椒\n\
  * 8 个红枣，对半去籽\n* 8 个黑橄榄，对半去籽\n* 硬豆腐，切块\n\n制作方法\n\n\n\n\n\n# 1. 将烤箱预热至 400 F。将南瓜、茴香、口蘑菇、胡萝卜和防根芹放入烤盘中。\n\
  \n2. 将大蒜加入蔬菜中，用勺加入油并洒在混合物中。用盐和黑胡椒调味。\n\n3. 将混合物放入烤箱，搅拌并烘烤。20 分钟后，加入枣子、黑橄榄和豆腐。搅拌后送回烤箱。上菜。\n\
  \n# 5. 菠菜番茄鹰嘴豆咖喱\n\n### 配料：\n* 1 汤匙葵花油\n* 1 瓣大蒜，切碎\n* 1 个小洋葱，切碎\n* 新鲜姜，切碎\n* 1 汤匙\
  \ Bart Veerasamy Moglai 喱膏\n* 400g 罐装切碎番茄\n* 410g 罐装鹰豆\n* 250g 菠菜，切碎\n* 天然酸奶\n*\
  \ 4 汤匙新鲜香菜，切碎\n\n### 做法：\n1. 在中型汤锅中加热油，放入大蒜、洋葱和姜翻炒 5 分钟，直到变软并呈金黄色。\n2. 混合喱膏并加入切碎的番茄。小火煮\
  \ 5 分钟直到酱汁变稠。\n3. 拌入鹰豆并中火煮 10 分钟。加入菠菜，小火煮至煮熟。\n4. 盛入一勺酸奶，并淋上香菜。\n\n# 6. 墨西哥千层饼\n\
  \n### 配料：\n* 300 克蘑菇\n* 1 个大大洋葱，去皮并切四份\n* 2 瓣大蒜，压碎\n* 1 根绿辣椒，去籽\n* 1 个绿青椒，去籽\n*\
  \ ½ 茶匙肉桂粉\n* 1 茶匙孜然粉\n* 1 茶匙香菜籽粉\n* 4 汤匙油\n* 1 汤匙番茄酱膏\n* 400g 罐装红腰豆\n* 1 包墨西哥薄饼\n\
  * 500g 酸奶油 (crème fraiche)\n* 50g 碎素奶士\n\n### 做法：\n1. 将烤箱预热至 445 F。\n2. 在食物处理器中，将蘑菇、洋葱、大蒜、辣椒、青椒、肉桂、孜然、香菜籽粉和油混合，直到呈碎状。\n\
  3. 在大煎锅中用大火煎。直到混合物开始上色。加入番茄酱膏和豆子。用盐和黑胡椒调味。\n4. 将一半混合物放入烤盘中并放入薄饼中。加入一些酸奶油，并用另一块薄饼覆盖。撒上奶士，放入烤箱烤\
  \ 15 分钟。上菜。\n\n# 7. 法式洋葱汤\n\n### 配料：\n* 2 汤匙特级初榨橄榄油\n* 5 杯洋片洋葱\n* 2 片月桂叶\n* 1 茶匙干百香里\n\
  * 1/8 茶匙盐\n* 5 杯蔬菜汤\n* 2 杯水\n* 2 片全麦面包，烤过并对半\n* 4 茶匙磨亚麻籽\n* Tofutti 奶士\n* 黑胡椒粉\n\
  \n### 做法：\n1. 用中火加热锅。加入油让其加热 1 分钟。加入洋葱、月桂叶、百香里和盐。搅拌并烹饪 10 分钟，直到洋葱均匀地变褐色。\n2. 加入\
  \ `½ cup` 蔬菜汤并快速沸火煮 3 分钟。加入剩余的汤和水。小火慢煮 5 分钟。取出并丢弃月桂叶。\n3. 将汤盛入大碗中，放上半片吐司。在每片吐司上撒\
  \ 1 茶匙亚麻籽。顶部放上 Tofutti 奶士。\n4. 在距离热源 6 英寸处将汤火烤 2 分钟，直到奶士起泡。注意不要烤焦奶士。用黑胡椒调味。\n\n\
  # 第 4 章 – 素食晚餐食谱\n\n以下素食晚餐食谱看起来非常华丽，会让每个人都觉得你在厨房里苦干细作，而且让你的预算紧张。但事实是，你甚至可以使用剩下的蔬菜来做出一道全新的素食菜。\n\
  \n## 1. 烤蔬菜意大利烩饭派丁\n\n### 配料：\n* 1 升蔬菜汤\n* 一小撮藏红\n* ¾ 杯油浸炭烤混合青椒\n* 2 个红洋葱，切成段\n\
  * 1 根茄子，切成块\n* 1 根西葫芦，切片\n* 175g 樱桃番茄，对半切\n* 2 瓣大蒜，切碎\n* 1 根大葱，切碎\n* 1 茶匙辣椒碎\n*\
  \ 250g 意大利烩米\n* 100ml 素食白葡萄酒\n* 175g 素食马苏里拉奶士片\n\n### 做法：\n1. 将烤箱预热至 400 F。将蔬菜汤煮沸并加入藏红。滤掉青椒并保留油。\n\
  2. 在烤盘中，拌入洋葱、茄子和西葫芦。烤 20 分钟。取出加入樱桃番茄再烤 15 分钟。从烤箱取出并完全冷却。\n3. 同时，翻炒大蒜、大葱和辣椒碎。加入米饭翻炒\
  \ 2 分钟。加入白葡萄酒并煮沸。加入一勺蔬菜汤并继续搅拌直到液体被吸收。\n4. 放入 350 F 的烤箱中。衬好一个吐司模具，将一半烩饭铺在模具底部。顶部铺上马苏里拉奶士和青椒。铺上蔬菜，最后用剩下的烩饭平表面。\n\
  5. 烤 40 分钟。从烤箱取出并上菜。\n\n## 2. 蘑菇豆腐\n\n### 配料：\n* 1 汤匙葵花油\n* ½ 茶匙四川花椒\n* 5 瓣大蒜，压碎\n\
  * 5cm 新鲜姜，擦末\n* 1 茶匙辣椒碎\n* 1 汤匙豆酱\n* 250g 蘑菇\n* 2 茶匙意大利香醋\n* 1 汤匙酱油\n* 400g 硬豆腐，切成块\n\
  * 1 茶匙芝麻油\n* 葱花，切细\n\n### 做法：\n1. 在炒锅中用大火加热油，加入四川花椒。立即拌入大蒜、姜和辣椒碎。\n2. 转为中火，加入豆酱、醋和酱油。偶尔搅拌\
  \ 5 分钟。\n3. 用小火拌入豆腐。淋上一些芝麻油并撒上葱花。\n\n## 3. 椰子豆子咖喱\n\n### 配料：\n* 3 汤匙蔬菜油\n* ¾ 茶匙芥末籽\n\
  * 10 片新鲜咖喱叶\n* 1 个红洋葱，切细碎\n* 6 瓣大蒜，切成末\n* ½ 茶匙辣椒粉\n* 2 茶匙香菜籽粉\n* ½ 茶匙孜然粉\n* ½ 茶匙姜黄粉\n\
  * 盐\n* 7g 豆角\n* 400g 罐装腰豆\n* 60g 椰子乳霜\n* 1 茶匙细砂糖\n* 3 茶匙酸罗望酱\n\n### 做法：\n1. 在大不粘汤锅中加热油，加入芥末籽。等停止停止后，立即加入咖喱叶和洋葱。炒到洋葱变透明。\n\
  2. 加入大蒜和磨好的香料，加少量水。煮 2 分钟。\n3. 加入豆角和椰子乳。再加一杯水并煮沸。拌入糖和酸罗望酱。调整调味。\n\n## 4. 烤坚果味绿蔬菜\n\
  \n### 配料：\n* 2 根绿青椒，切片去籽\n* 2 根大葱，切碎\n* 3 根西葫芦，切片\n* 2 汤匙橄榄油\n* 130g 绿色青酱\n\n顶层配料\n\
  * 1 汤匙橄榄油\n* 25g 素食帕玛森风味奶士，碎\n* 50g 去壳开心果\n* 1 片全麦面包\n\n### 做法：\n1. 将烤箱预热至 440 F。在碗中，将绿青椒、大葱和西葫芦放入油和青酱拌匀。\n\
  2. 将蔬菜放入烤箱中中，烤 30 分钟。\n3. 制作顶料，在食物处理器中将油、奶士碎、开心果和面包混合。在蔬菜上撒上坚果碎，烤 10 分钟。\n\n## 5.\
  \ 库斯林与混合蔬菜\n\n### 配料：\n库斯林\n* 500g 库斯林\n* 1 茶匙海盐\n* 600ml 水\n\n蔬菜炖\n* 1.5 升蔬菜汤\n\
  * 6 瓣大蒜，拍碎\n* 新鲜迷迭香\n* 8 粒胡椒\n* 2 片月桂叶\n* 2 个甜红薯，切成长段\n* 2 个洋葱，切四份\n* 2 根胡萝卜，切成长段\n\
  * 1 根西瓜，切成长段\n* 3 根大葱\n* 3 根西芹\n* 2 茶匙蜂蜜\n* 3 个番茄，切四份\n* 海盐和黑胡椒粉\n\n### 做法：\n1.\
  \ 将烤箱预热至 350 F。将库斯林放入烤箱中。将盐溶入热水中并倒在库斯林上。盖上并让库斯林吸收水分 10 分钟。\n\n\n\n\n2. 与此同时，在一个大汤锅中放入高汤并煮沸。混合大蒜、迷迭香、辣椒粒、月桂叶和盐。加入土豆、胡萝卜、洋葱和牛髓，煮\
  \ 5 分钟。之后，加入大葱和茎部翻炒均匀。\n\n3. 盖盖煮 25 分钟。检查调味，然后拌入蜂蜜和西红柿。\n\n4. 用叉子划开库斯库，涂抹油将颗粒拨起，让它们掉落回菜中以保持蓬松。在库斯库顶部点上黄油，放入预热好的烤箱中烘烤\
  \ 20 分钟。\n\n5. 堆成山状。取出蔬菜放在库斯库周围。将高汤倒入碗中，配上蔬菜和库斯库一同上菜。\n\n# 第 4 章 – 素食甜点\n\n没有什么比浓郁的布丁更棒了，自制的传统甜点总是最好的。以下这些令人垂涎的食谱绝对能满足你的甜食，而且让你完全察觉不到它们都是素食的。\n\
  \n## 1. 太石焦苹果布丁\n\n### 配料：\n\n* 2 个大苹果，去核并切成 2 厘米方块\n* 125g 自起面粉\n* 200g 红糖\n* ¼茶匙盐\n\
  * 1 茶匙香草提取液\n* 1 汤匙橄榄油\n* ¼杯苹果酱\n* 200ml 牛奶\n* 2 汤匙黄金糖浆\n* 150ml 沸水\n\n### 制作方法：\n\
  \n1. 将烤箱预热至 350 华氏度（约 177 摄度）。将苹果放在烤具的底部。均匀地铺开。\n2. 将面粉、一半的糖和盐混合均匀。与此同时，在另一个碗中，混合香草提取液、橄榄油、苹果酱和牛奶。融合两种混合物并快速搅拌，使其完全结合。之后，将混合物淋在苹果上。\n\
  3. 在装有沸水的汤锅中，倒入黄金糖浆和剩余的糖。搅拌至溶解。然后，均匀地倒入烤具中。撒上红糖，放入烤箱烘烤 30 分钟，或直到按压布丁表面时有轻微的回弹性即可。上菜。\n\
  \n## 2. 榛果杏仁糖\n\n### 配料：\n\n* 100g 去皮杏仁\n* 125g 烤过的榛果\n* 1 汤匙橙花水\n* ½茶匙粉碎豆蔻籽\n*\
  \ 300g 细砂糖\n\n### 制作方法：\n\n1. 将杏仁和榛果磨碎至极细。加入花水和豆蔻籽。\n2. 煮沸水和糖直到达到软球阶段。“软球阶段”是指糖滴入冷水中时反应状态的术语。\n\
  3. 与此同时，使用搅拌机将糖浆倒入磨碎的坚果中，搅拌至光滑的光泽。冷却后，用手揉面。当面团看起来发光时停止揉面。\n\n## 3. 苹果核桃蛋糕\n\n###\
  \ 配料：\n\n**蛋糕部分：**\n* 橄榄油\n* 细砂糖\n* ¼杯苹果酱\n* 2 茶匙肉桂粉\n* 250g 希腊酸奶\n* 1 汤匙泡打粉\n*\
  \ 190g 面粉\n* 3 个苹果，切成 1.5 厘米方块\n\n**糖浆部分：**\n* 150ml 水\n* 75g 流动性蜂蜜\n* 糖\n\n###\
  \ 制作方法：\n\n1. 将烤箱预热至 350 华氏度。使用活底模具并涂油。\n2. 将黄油和糖混合。打入鸡蛋，然后拌入酸奶。加入肉桂粉、泡打粉和面粉。充分混合，然后加入苹果。\n\
  3. 将面糊倒入活底模具中烘烤 1 小时。取出烤箱，在制作糖浆时让冷却。\n4. 制作糖浆，将所有原料混合并煮沸。慢煮直到酱汁变稠。\n5. 将糖浆淋在蛋糕上浸泡\
  \ 10 分钟，撒入核桃，并配上希腊酸奶食用。\n\n## 4. 香蕉油炸饼\n\n### 配料：\n\n* 植物油\n* 100g 鹰鹰嘴豆粉\n* ¼茶匙小苏打\n\
  * 150ml 水\n* 2 根香蕉，切片\n\n**糖浆部分：**\n* 4 汤匙枫糖浆\n* 2 汤匙水\n* 豆蔻籽\n* 一小撮干玫瑰花瓣\n* 去皮开心果\n\
  \n### 制作方法：\n\n1. 在大锅中加热油。\n2. 与此同时，在一个大碗中放入面粉和小苏打。加入水并充分搅拌匀。\n3. 在小煎锅中加热枫糖浆、水、豆蔻籽、干玫瑰花瓣和去皮开心果，煮沸\
  \ 2 分钟。\n4. 将裹上面糊的香蕉放入油煎锅中，分批油炸至香蕉呈金黄褐色。\n5. 淋上准备好的糖浆。上菜。\n\n## 5. 大黄与柠檬奶油\n\n###\
