  \n感谢你并祝你好运！\n\n# 14 天生酮饮食计划\n\n## 针对初者的生酮饮食\n\n\n\n\n由于你不会摄入大量的碳水化合物，你的身体将首先燃烧脂肪，这意味着你将开始减轻体重。你多余的腹部脂肪会首先被烧掉，这可能会让你对自己的外表更加自信。\n\
  \n你也会开始感到精力充沛，并可能让你的生活变得更好。\n\n# 第 2 章：开始生酮饮食计划\n\n从我自己的经验中知道，开始任何饮食计划都不像你希望的那样容易，但下面有一些提示可以帮助事情变得简单一点。\n\
  \n请不要在假设生酮饮食轻而易举的情况下就开始它，它可能比你想象的要困难一些，但别担心，你会做到的。\n\n## 犯错\n开始一种新饮食并不总是容易的，而生酮饮食可能很难适应。这是因为你被要求远离碳水化合物和任何糖分。你偶尔可能会犯错，摄入比你意识到的更多的糖分，但尽量不要因此过度沮丧。你参与这个计划的时间越长，就会越习惯食用含有极少或不含碳水化合物的食物。\n\
  \n## 寻找你的食材来源\n为了烹饪书中的食谱，所需的很多食材在大多数商店都能买到。这就是这种饮食的魅力所在，它不要求你吃任何难以获得的东西。\n\n我知道有些食谱要求你使用替代奶（如豆奶或杏仁奶，偶尔还有椰子奶），但它们通常在许多商店都有售。如果你当地的杂货店不卖替代奶，你可能想去健康食品店，因为那里很可能有。如果你仍然遇到困难，可以转向互联网，因为有很多网站以合理的价格出售替代奶。\n\
  \n## 和朋友一起开始计划\n如果你愿意，你可以和朋友一起开始这个计划。这是因为这比独自行动要容易。和朋友一起开始会容易得多，因为这可以让你获得食谱灵感，并培养动力。\n\
  \n话虽如此，如果你愿意，不必非和朋友一起开始，你也可以独自奋战。如果你选择这样做，你应该尽力保持动力，尤其是当你发现进展艰难时。\n\n## 关键食品/食材\n\
  \n### 肉和奶士\n在整个生酮计划期间，你会被要求吃很多肉和奶士。这是因为肉是很好的蛋白质来源，但你需要远离加工肉类，因为这些可能含有隐藏的碳水化合物。\n\
  \n好消息是，你每天都可以享受肉类，所以请尽管在饮食中加入更多，并享受它吧！\n\n### 鱼\n鱼也是极好的蛋白质来源，还含有非常健康的油脂。我必须强调，你需要远离裹炸和裹粉的鱼类，因为这些会含有大量的碳水化合物。尝试不要每周吃鱼超过三次，因为众某些鱼含有大量的汞。\n\
  \n### 乳制品\n我知道完全远离乳制品是困难的，但有一些很棒且美味的替代品。我知道这些经过了某种程度的加工，但它们能确保你获得所需的钙以及其他非常有益的营养素。\n\
  \n### 水果和蔬菜\n很多人认为在生酮饮食中不能吃水果和蔬菜。这是一个完全的误解，因为你需要消耗这些食物来获得能量。水果和蔬菜含有糖分，由于你不吃碳水化合物，你需要从其他地方获得能量。确保你只吃低糖的水果和蔬菜，以免最终增加体重。\n\
  \n### 酱料\n面对现实吧，我们都经常想在餐中加入一些酱料。虽然这在生酮饮食中是完全允许的，但你应该确保不要摄入过多的碳水。好消息是，这种饮食允许使用油基酱料和蛋美酱，所以尽管吃吧！\n\
  \n# 第 3 章：生酮饮食计划（14 天指南）\n\n下面你将找到一份 14 天的指南，它应该帮助你决定想吃什么。请注意，你制定自己的饮食计划是完全可以的。你看到的计划仅仅是一份指南，你可能会发现吃其他食物更符合你的口味。\n\
  \n### 第一天\n- 早餐：奶油奶士松煎饼\n- 零食：马蹄果\n- 午餐：鸡肉培根沙拉\n- 零食：奶士片\n- 晚餐：烤三文鱼\n\n### 第二天\n\
  - 早餐：草莓肉桂谷物\n- 零食：三文鱼奶油奶士\n- 午餐：低碳水肉饼\n- 零食：剩余肉类\n- 晚餐：墨西哥辣肠和椰菜花汤\n\n### 第三天\n-\
  \ 早餐：培根面包\n- 零食：奶士片\n- 午餐：鸡汤\n- 零食：猪皮结和青酱\n- 晚餐：奶士洋葱咸派\n\n### 第四天\n- 早餐：柠檬蓝莓松芬\n\
  - 零食：猪皮结和青酱\n- 午餐：香肠披萨\n- 零食：马蹄果\n- 晚餐：瑞典肉丸\n\n### 第五天\n- 早餐：菠菜蛋姆勒\n- 零食：剩余肉类\n\
  - 午餐：任何你想吃的\n- 零食：马蹄果\n- 晚餐：鸡肉瓜达拉亚\n\n### 第六天\n- 早餐：培根、蛋和西兰花\n- 零食：马蹄果\n- 午餐：巧克力（注：此处原文可能指代某种菜或笔误，保留翻译）\n\
  - 晚餐：瑞典肉丸\n\n### 第七天\n- 早餐：培根、蛋和西兰花\n- 零食：马蹄果\n- 午餐：巧克力奶\n- 晚餐：奶士洋葱咸派\n\n### 第八天\n\
  - 早餐：奶油奶士松煎饼\n- 零食：马蹄果\n- 午餐：鸡肉培根沙拉\n- 零食：剩余肉\n- 晚餐：烤三文鱼\n\n### 第九天\n- 早餐：草莓肉桂谷物\n\
  - 零食：三文鱼奶油奶士\n- 午餐：低碳水肉饼\n- 零食：剩余肉\n- 晚餐：墨西哥辣肠和椰菜花汤\n\n### 第十天\n- 早餐：培根面包\n- 零食：奶士片\n\
  - 午餐：鸡汤\n- 零食：马蹄果\n- 晚餐：瑞典肉丸\n\n### 第十一章\n- 早餐：柠檬蓝莓松芬\n- 零食：猪皮结和青酱\n- 午餐：香肠披萨\n\
  - 零食：马蹄果\n- 晚餐：瑞瑞肉肉丸\n\n### 第十二天\n- 早餐：菠菜蛋姆勒\n- 零食：三文鱼奶油奶士\n- 午餐：任何你想吃的\n- 零食：马蹄果\n\
  - 晚餐：鸡肉瓜达拉亚\n\n### 第十三天\n- 早餐：培根、蛋和西兰花\n- 零食：猪皮结和青酱\n- 午餐：巧克力奶\n- 零食：奶士片\n- 晚餐：瑞典肉丸\n\
  \n### 第十四天\n- 早餐：奶士奶士\n- 零食：三文鱼奶油奶士\n- 午餐：昨晚的剩余\n- 零食：剩余肉\n- 晚餐：奶士洋葱咸派\n\n你可以看到，生酮饮食是多样化的，包含了许多美味食物。如果你想吃我建议的某些食物，请参考接下来的章节，你可以在那里找到食谱。\n\
  \n不要害怕根据你的想法修改食谱，但最重要的是，享受它们。\n\n# 第 4 章：生酮早餐食谱\n\n每天早上都享受美味且营养丰富的早餐。如果你早上时间很紧，在前一天晚上做好早餐会有很大帮助。\n\
  \n## 奶油奶士松煎饼\n制作 2 份\n\n食材：\n- 2 个鸡蛋\n- 1 茶匙`甜菊`\n- 2-3 汤匙`奶油`\n- 半茶匙`肉桂`\n- 1 汤匙`椰子粉`\n\
  - 一小片`黄油`\n- `枫糖浆`\n\n方法：\n```\n将除黄油和枫糖浆以外的所有配料放入碗中，搅拌至均匀光滑。加热平锅或煎锅，加入黄油并用中高火融化。双面煎至金黄色。\n\
  \n离火，并淋上枫糖浆即可享用。\n```\n\n## 草莓肉桂谷物\n制作 2 碗\n\n食材：\n- 530 克片状椰子\n- 2 颗草莓\n- 200 毫升杏仁奶或豆奶\n\
  - 1 茶匙肉桂粉\n```\n\n\n\n将烤箱预热至 350 华氏度，并在饼干上垫纸。加入椰子片，烤约 2.5 分钟，然后稍微搅拌一下碎片，再烤 2.5 分钟，直到椰子开始微微变褐。\n\
  \n从烤箱中取出椰子，撒上肉桂粉。如果你想在椰子中加入糖或代糖，现在是最佳时机。\n\n将椰子片盛入 2 个碗中，加入草莓和牛奶，即可享用。\n\n## 培根面包\n\
  \n份量：3 份\n\n### 配料：\n- 1 包培根\n- 3 个鸡蛋\n- 100 克奶士，擦碎\n\n### 制作方法：\n将烤箱预热至 200 华氏度，将培根从中间切开，然后将每片切成两半。现在给饼干盘垫纸，将两片培根并排放在一起，然后在上方再放两片，这些片的方向要相反。如果你想玩得复杂一点，可以尝试将培根编织让它们固定住。\n\
  \n将培根煎约 20-25 分钟，直到达到你满意的程度。煎好后，将培根从烤箱取出，放在纸巾上让多余的油脂流出。放凉。\n\n煎鸡蛋直到根据你的喜好煮熟，然后将其放在一旁。\n\
  \n取出一层培根，放在盘子里，然后放上一个煎蛋，顶部撒上一些奶士。在上面放另一层培根形成三明治。重复此过程，直到你有了 3 个三明治。即可享用。\n\n## 柠檬蓝莓马芬蛋糕\n\
  \n份量：8 个\n\n### 配料：\n- 114 克蓝莓\n- 1/4 茶匙柠檬皮屑\n- 1/4 茶匙柠檬精\n- 120 克 鲜奶油（重奶油）\n- 1\
  \ 个鸡蛋\n- 100 克杏仁粉\n- 一小撮盐\n- 1/4 茶匙小苏打\n- 2.5 份代甜味剂\n- 28 克融化的黄油\n\n### 制作方法：\n\
  将烤箱预热至 350 华氏度，并在马芬模具上垫纸。将面粉和奶油加入碗中搅拌，然后加入鸡蛋再次搅拌，直到完全混合均匀。\n\n现在加入代甜味剂、黄油、柠檬皮屑、柠檬精和小苏打，并搅拌。拌入蓝莓，然后将混合物盛入马芬模具中，每个格只装半。\n\
  \n放入烤箱中烘烤约 20 分钟，直到马芬蛋糕呈金黄色。冷却后即可享用。\n\n## 菠菜蛋姆蛋\n\n份量：1 个大蛋姆蛋或 2 个小蛋姆蛋\n\n### 配料：\n\
  - 1 个蛋黄\n- 4 个蛋蛋白\n- 一小把切碎菠菜\n- 半个西红柿，切碎\n- 2 汤匙豆奶或杏仁奶\n- 一小撮香菜\n- 1 汤匙碎洋葱\n- 喷雾油\n\
  \n### 制作方法：\n在锅里喷上食用油，然后翻炒蔬菜。将蛋黄、蛋蛋白和牛奶加入碗中并打散。\n\n蔬菜炒好后，将它们从锅中取出放在一旁。再次向锅喷油，然后加入蛋液。\n\
  \n煎蛋直到根据你的喜好煮熟，然后将蔬菜盛在蛋的一侧。将蛋的另一侧折叠在蔬菜上，非常轻轻地将蛋姆蛋从锅中取出。即可享用。\n\n## 培根、鸡蛋和西兰花\n\n\
  份量：2 人\n\n### 配料：\n- 4 个鸡蛋\n- 8 片培根\n- 1 汤匙黄油\n- 80 克西兰花，切碎\n- 1 根胡萝卜，薄片\n- 半个洋葱，切碎\n\
  - 100 克擦碎奶士\n- 50 克芹菜\n\n### 制作方法：\n在锅或平底锅中融化黄油，然后煎炸培根和蔬菜约 20 分钟，或直到蔬菜开始焦化。\n\n\
  将混合物均匀地铺在锅或平底锅的底部，然后切成四份。在每部分的中间挖一个洞，加入鸡蛋。煎蛋直到根据你的喜好煮熟，然后撒上奶士。让奶士融化，即可享用。\n\n##\
  \ 火腿、火鸡肉奶士煎饼\n\n份量：4-5 个\n\n### 配料：\n- 4 个鸡蛋\n- 2 茶匙甜菊糖\n- 4-6 汤匙奶油\n- 1 茶匙肉桂粉\n\
  - 2 汤匙椰子粉\n- 4 片火鸡肉\n- 200 克 瑞士奶士，擦碎\n- 4 片火腿\n- 1 片黄油\n- 枫糖浆\n\n### 制作方法：\n将鸡蛋、甜菊糖、奶油、肉桂粉和椰子粉放入碗中，搅拌至混合光滑。加热锅或平底锅，加入黄油并用中大火将其融化。双面煎煎至呈金黄色。\n\
  \n移离热源，取出煎饼。\n\n取 1 片火鸡肉放在盘子里，现在在火鸡肉上放上一片火腿，然后放在一个煎饼上，重复另外 3 次。在每个煎饼顶部加入约 50 克的奶士，然后置于中低火下，盖锅直到奶士完美融化。即可享用。\n\
  \n## 第 5 章：午餐食谱\n\n这些午餐食谱可以装盒带去上班，也可以在家里享用。在接下来的几天内吃掉剩余部分，以确保口感最新鲜。\n\n### 鸡肉培根沙拉\n\
  \n份量：4 人\n\n### 配料：\n- 1 个鸡胸，切碎\n- 4 汤匙黄油\n- 5 片培根\n- 1 个西红柿，切碎\n- 半茶匙盐\n- 2 茶匙肉桂粉\n\
  - 2 茶匙柠檬汁\n- 1 个蛋黄\n- 56 克擦碎奶士\n- 56 克蛋油\n- 一罐蛋茄酱\n\n### 制作方法：\n（注：此处原文逻辑存在混乱，已按原文结构翻译）\n\
  \n### 香肠披萨\n\n份量：1 份\n\n### 配料：\n- 3 个鸡蛋\n- 200 克奶士，擦碎\n- 2 茶匙 甜菊糖\n- 蔬菜\n将鸡蛋放入碗中，搅拌至混合均匀。\n\
  \n煎蛋直到根据你的喜好煮熟，然后将蔬菜盛在蛋的一侧。将蛋的另一侧折叠在蔬菜上，非常轻轻地将蛋姆蛋从锅中取出。即可享用。\n\n（注：原文文本在此处似乎有大量重复和乱码字符，翻译已严格遵循“不要重复输出原文”原则并提取有效信息）\n\
  \n### 无碳水披萨\n\n### 制作方法：\n制作饼饼底：\n将烤箱预热至 450 华氏度，并在饼干上垫纸。在平底锅中融化黄油，然后加入花菜和洋葱。用小火翻炒直到花菜炒熟。\n\
  \n向锅中加入水，然后盖上焖花菜直到其变软。等花菜冷却后，将其其中一半放入食物处理器中，搅拌至光滑。\n\n现在将其放入碗中，加入奶士和香料搅拌均匀。\n\n\
  现在将混合物铺在饼干上。烘烤约 20 分钟，直到花菜边缘变焦。\n\n制作配料：\n将香肠切成小块。在酱锅中加入披萨酱，然后加入香肠。保持小火盖锅。\n\n将烤箱调至火烤模式，将香肠混合物和酱料淋在饼底上，直到涂匀。现在加入奶士混合物，然后将披萨放回烤箱直到奶士开始变褐。切片即可享用。\n\
  \n### 鸡汤\n\n份量：4-6 碗\n\n### 配料：\n- 650 克鸡肉\n- 半个小洋葱，切碎\n- 1 茶匙盐\n- 半根胡萝卜，切碎\n- 半根芹菜，切碎\n\
  - 1 瓣剥皮大蒜\n- 1/2 茶匙欧芹\n- 1/2 茶匙百里香\n- 3 粒胡椒\n- 1/2 叶月桂叶\n\n### 制作方法：\n将鸡肉放入锅或荷兰锅中。加入盐、洋葱、胡萝卜和芹菜，烤鸡肉约\
  \ 45 分钟。鸡肉烤好后，从烤箱取出放在炉灶上。现在向鸡肉中加入水，以及大蒜、香料和香草。小火慢炖，然后撇掉浮沫。关火，放冷却。\n\n冷却后，过滤汤汁，即可享用。\n\
  \n## 低碳水肉饼\n\n份量：1 个大肉饼\n\n### 配料：\n- 800 克 牛肉末\n- 5 瓣末大蒜\n\n\n\n\n- 2 汤匙黄油\n- 半\
  \ 汤匙香菜\n- 半 汤匙百里香\n- 6 克欧芹碎\n- 2 个鸡蛋\n- 400 克香肠\n- 225 克洋葱，切丁\n- 120 克青椒，切丁\n- 100\
  \ 克杏仁粉\n- 50 克奶酪帕玛森芝士\n- 1 茶匙盐\n- 半茶匙黑胡椒\n- 半茶匙明胶\n- 2 茶匙烧烤酱\n- 2 茶匙芥末酱\n- 60 毫升全脂鲜奶油\n\
  \n### 制作方法\n将烤箱预热至华华氏 350 度，并在大烤具上涂上一层黄油。将帕玛森芝士和面粉加入碗中充分搅拌。在平底锅或煎锅中加热黄油，然后加入洋葱、大蒜和辣椒翻炒。等变软后，使其冷却，然后放入食物加工机中。搅拌至细腻。\n\
  \n打蛋蛋，加入烧烤酱、香草、胡椒、盐、芥末和鲜奶油。现在将明胶撒在食材表面，并静置约 5 分钟。加入洋葱，搅拌均匀。\n\n将牛肉和香肠混合，然后放入大碗中，加入杏仁和鸡蛋混合物，再次混合。如果混合物变得粘稠，可以加入一些帕玛森芝士。现在将食材放入烤具中，确保每边留出约\
  \ 1 英宽的空隙。将肉饼压平，烘烤一小时，或直到肉饼内部温度达到华华氏 160 度。冷却后享用。\n\n# 巧克力蛋白奶昔\n份量：1 份\n\n### 食料\n\
  - 28 克或 16 盎司杏仁奶或大豆牛奶\n- 114 克或 4 盎司全脂鲜奶油\n- 1 汤匙树莓糖\n- 30 克蛋白粉\n\n### 制作方法\n将食材放入搅拌机或奶昔机中，搅拌至光滑。倒入杯中即可享用。\n\
  \n# 第 6 章：晚餐食谱\n以下晚餐食谱将让你在一天结束时感到非常满足。\n\n## 烘烤三文鱼\n人数：2 人\n\n### 食料\n- 2 片三文鱼排\n\
  - 6 汤匙橄榄油\n- 1 汤匙柠檬汁\n- 1 汤匙欧芹碎\n- 2 瓣大蒜，切末\n- 1 茶匙香菜\n- 1 茶匙盐\n- 1 茶匙黑胡椒\n\n###\
  \ 制作方法\n将胡椒、盐、大蒜、香菜、橄榄油、柠檬汁和欧芹加入碗中搅拌。现在在烤具中烹饪三文鱼，并在上方覆盖蒜香菜混合物。\n\n在冰箱中腌制三文鱼约一小时，期间每\
  \ 20 分钟翻面一次。将烤箱预热至华华氏 375 度，用铝箔包裹三文鱼。淋上腌料，烹饪约 45 分钟，直到用叉子触时三文鱼肉片掉落。即可享用。\n\n## 墨西哥香肠西菜花汤\n\
  人数：3 人\n\n### 食料\n- 半颗花椰花，切丁\n- 半个洋葱，切丁\n- 半根中等大小的墨西哥香肠，切丁\n- 半根小葱，切丁\n- 半根萝卜，切丁\n\
  - 一小撮盐\n- 240 毫升鸡高汤\n- 1 汤匙黄油\n\n### 制作方法\n用 1 汤匙黄油涂好汤碗，加入洋葱，用中大火煎至上色。加入花椰花，在不断翻炒的同时再煮\
  \ 5 分钟。\n\n向花椰花中加入鸡汤，并在碗上盖上盖子。现在加入一半的萝卜和半根香肠。煮至质地酥脆（约 10 分钟）。现在将半根香肠放入搅拌机中，搅拌至光滑。用盐调味，然后加入剩下的萝卜和香肠。即可享用。\n\
  \n## 瑞典肉丸\n份量：30 个\n\n### 食料\n- 500 克瘦牛肉\n- 1 汤匙黄油\n- 1 个煮熟的鸡蛋\n- 半茶匙黑胡椒\n- 1.5\
  \ 茶匙肉豆蔻\n- 1.5 茶匙肉豆蔻\n- 1.5 茶匙盐\n- 200 克里里塔奶士\n- 114 克瑞士奶士，刨丝\n\n### 制作方法\n在锅中加入黄油并加热，然后翻炒洋葱直到透明。烹煮约\
  \ 10 分钟。现在将瑞士奶士放入搅拌机中，搅拌至像面包屑。\n\n将鸡蛋和里里塔奶士加入混合碗中打匀。现在加入胡椒、盐和香料，再次混合。加入瑞士奶士和洋葱，再次混合。将牛肉放入碗中混合，直到所有食材都粘结在一起并变得粘稠。将混合物分成\
  \ 30 个肉丸，揉成球。\n\n将肉丸放入烤盘中，在华华氏 350 度下烘烤约 20 分钟，或直到变褐色。即可享用。\n\n## 瓜达拉哈亚鸡肉\n人数：4\
  \ 人\n\n### 食料\n- 4 块去骨鸡胸，切成 2 厘米片\n- 3 瓣大蒜，末\n- 2 汤匙黄油\n- 6 个西红柿，切丁\n- 4 根绿辣椒\n\
  - 114 克奶油奶士\n- 60 毫升鸡汤\n- 60 克淡发奶油\n- 1 茶匙孜然\n- 半茶匙辣椒粉\n- 1 茶匙盐\n- 半茶匙大蒜粉\n- 莎莎酱（用于装饰）\n\
  - 酸奶油（用于装饰）\n- 一把碎切达奶士（用于装饰）\n\n### 制作方法\n在平底锅中融化黄油，然后翻炒大蒜和洋葱直到变软。放入鸡肉，中火翻炒直到变软。\n\
  \n将奶油奶士撒在食材表面，静置约 5 分钟。加入所有香料，慢炖 10 分钟。\n\n淋上装饰酱，即可享用。\n\n## 奶士洋葱派\n份量：1 个大派\n\n\
  ### 食料\n- 12 个鸡蛋\n- 500 克切达奶士\n- 2 汤匙黄油\n- 480 毫升奶油\n- 1 个洋葱，切丁\n- 1 茶匙盐\n- 2 茶匙百里香\n\
