  \n# 第 2 章：如何使用精油\n\n现在你已经了解了芳香疗法的益处，是时候带你介绍一下它的应用方法了。学习如何使用精油至关重要，因为这种技术可能会产生自身的风险和副作用。尽管如此，使用精油并不是一项艰巨的任务。它只需要细心、预防，以及对每种应用方法和可用精油有充分的知识。\n\
