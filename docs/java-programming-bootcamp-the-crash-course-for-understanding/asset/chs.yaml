  \n### Excel 工作表\n\n#### 如何在工作表之间移动\n\n系统每次在生成新工作簿时都会创建三个工作表。这些工作表命名为“Sheet1”、“Sheet2”和“Sheet3”。如果你想向工作簿中添加新工作表，只需查看屏幕底部并点击“插入工作表”选项。这里有一张截图：\n\
