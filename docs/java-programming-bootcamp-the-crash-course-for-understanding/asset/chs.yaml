  \n#### 如何输入数据\n\n要向单元格输入数据，只需将光标置于目标单元格上并输入信息。Excel 允许在单个单元格中输入最多 32,000 个字符。\n\n\
  Excel 程序接受字母和数字。此外，这些程序以不同的对齐方式显示数据——字母左对齐；数字右对齐。然而，如果你需要，可以使用其他对齐方式。\n\n#### 如何取消数据输入\n\
  \n在某些情况下，人们会在单元格中输入错误内容。Excel 允许你取消错误的输入，前提是你没有按下键盘上的 `Enter` 键。\n\n要取消错误的输入，只需点击公式栏附近的“X”。这里有一张截图：\n\
  \n![](img/image01870.jpeg)\n\n或者，你可以通过按下键盘上的 `Esc` 键来取消输入。\n\n#### 如何修改未确认的输入\n\n\
  Excel 允许你编辑未确认的输入。如果你想对某项输入进行简单调整（例如：删除/替换字母），只需双击包含该内容的单元格。然后，按下退格键或输入正确的字符。\n\n\
  ### 自动完成功能\n\nExcel 提供了“自动完成”（AutoComplete）功能——这项功能允许你在输入数据时节省精力和精力。基本上，Excel 会记住你在工作簿中输入过的数据。然后，每当你在新单元格中打字时，它都会将这些输入内容作为建议。此过程与\
  \ Google 在你运行在线搜索时显示的建议相似。这里有一张截图：\n\n![](img/image01871.jpeg)\n\n#### 如何使用此功能\n\
  \n1.  高亮列中的下一个空白单元格。\n2.  开始输入数据。MS Excel 将检查新输入是否与同一列中的任何项目相似。如果是，程序将自动完成输入。\n\
  3.  如果你想接受建议，按下 `Enter` 完成该过程。\n4.  如果你需要输入新数据，只需忽略 Excel 的建议并继续打字。完成后按一下 `Enter`。\n\
  \n#### 如何从列表中选择\n\n在某些情况下，Excel 会显示多个建议。每当用户处理相似的输入内容时，就会发生这种情况。从建议列表中选择既简单又容易。你可以通过两种方式实现：\n\
