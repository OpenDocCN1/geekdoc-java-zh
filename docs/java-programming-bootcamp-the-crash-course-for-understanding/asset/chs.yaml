  \n\n\n\n\n# 一杯牛奶\n- 2 匙奇亚籽\n\n将所有食材榨汁直到光滑。将奶昔倒入杯中即可享用。\n\n# 草莓、薄荷和菠菜奶昔\n\n### 配料：\n\
  - 5 颗草莓\n- 一茶匙薄荷叶\n- 1 杯菠菜\n- 1 杯水\n- 2 杯牛奶\n\n将所有食材榨汁直到光滑。将奶昔倒入杯中即可享用。\n\n上述的某些食谱可能比较浓稠，因此请确保在需要时添加额外的水或牛奶。或者，你也可能想要添加一些果汁，以提供额外的柑橘味，或者简单地确保你每天摄入更多种类的水果。\n\
  \n如果你发现你的柑橘味奶昔非常浓稠或有很多结块，请咀嚼这些结块，而不是直接吞下去。这将有助于你的身体产生较少的气体，还能让你感到饱腹的时间更长。\n\n# 第\
  \ 6 章：甜味奶昔食谱\n\n如果你喜欢甜食，或者想犒劳自己，以下甜味奶昔食谱是理想选择。你在下方看到的这些食谱脂肪含量并不高，但它们对减重的帮助可能没有其他奶昔那么。\n\
