  \n## 第三章 - 一日清毒\n\n许多减肥者没有意识到的是，“cleanse”（清毒/排毒）这个词实际上是一个动词，而不是名词。如果你不做出过更健康生活方式的自觉决定，那么所有的努力都将是徒劳。你应该将这种排毒视为帮助你实现长期目标的手段，而不仅仅是一个短期的修复方案。虽然这个过程被称为“一日清毒”，但它的设计目的是帮助你开启一个希望成为长期的旅程。这关乎通过做出正确的决定来改变你目前生活方式的所有领域。\n\
