  \n# 字符串 (Strings)\n\n你已经学习过字符串。然而，将其作为 Python 序列来再次讨论是很有重要的。对于其他编程语言，你可以使用方括号（称为下标操作符）来访问字符串内部的字符元素。这种方法在\
