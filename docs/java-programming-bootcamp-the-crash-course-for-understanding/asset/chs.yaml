  \n## 基础信息\n\nJavaScript 是当今最流行的编程语言之一。这种语言在现代网站和网页的开发中起着重要作用。它的特性和能力可以帮助您创建支持用户交互的动态网站。此外，JavaScript\
  \ 是一种解释型计算机语言，具有强大的面向对象特征。\n\n这种语言最初被称为“LiveScript”，但 NetScape（创建它的公司）将其名称改为 JavaScript，以利用\
  \ Java（另一种编程语言）享有的人气。必须指出，JavaScript 与 Java 语言没有关系。\n\n## JavaScript 的客户端形式\n\n\
  根据计算机专家的说法，这种语言最流行的变体是客户端 JavaScript。网站开发人员在创建项目时使用这种变体。通常情况下，您可以通过两种不同的方式使用客户端\
  \ JavaScript：\n\n* 将其包含在网页的代码中\n* 将其保存在外部文件中\n\n对于第二种选择，您将需要使用 HTML 文档来引用外部文件并将其链接到您的网站。\n\
  \n基本上，您在创建网页时不需要使用静态 HTML。您可以包含允许浏览器控制、用户交互的应用程序和程序。\n\n客户端 JavaScript 比典型的 CGI（通用网关接口）服务器脚本具有许多优势。例如，您可以使用客户端\
  \ JavaScript 来判断用户是否提供了表单信息。\n\nJavaScript 代码在用户提交表单时运行。然后系统将分析提交的信息。这种机制确保了 Web\
  \ 服务器不会处理无效请求。因此，客户端 JavaScript 为您的网站提供了更好的安全性能。\n\n这种编程语言还允许收集用户发发的隐式或显式操作（例如链接导航、按钮点击等）。\n\
  \n## JavaScript 提供的优势\n\n以下是该语言提供的主要优势：\n\n* 减少服务器交互——JavaScript 在将信息发送到服务器之前验证用户输入的信息。这意味着您可以从服务器过滤掉无效流量。\n\
  * 即时反馈——您的网站访问者将立即看到他们漏掉了字段或输入了错误数据。无需刷新页面即可看到错误消息。\n* 提高网页交互性——通过 JavaScript，您可以生成响应鼠标和键盘输入的用户界面。\n\
  * 增强界面——通过这种语言，您可以轻松添加酷的界面项（例如滑块、拖放组件等），为您的网站访问者提供增强的界面。\n\n## JavaScript 的缺点\n\n\
  就像生活的其他事情一样，JavaScript 也有它的缺点。主要的有：\n\n* 这种语言没有多处理或多线程能力。\n* 您无法将 JavaScript 用于网络网络的程序/应用程序。\n\
  * 您无法读取或编辑使用客户端 JavaScript 编写的文件。出于安全考虑，这些功能被禁用了。\n\n# 第 2 章：JavaScript 语法\n\n您可以通过将\
  \ JavaScript 语句放在网页的 `<script>` 标签中来实现这种语言。通常情况下，您可以将这些 `<script>` 放在网页的任何位置。然而，专业的网站开发人员通常会将这些标签放在页面的\
  \ `<head>` 标签内。\n\n\n\n\n简单来说，`<script>` 标签指示浏览器将其包含的文本解释为脚本。以下是 JavaScript 的基本语法：\n\
  \n![](img/image01878.jpeg)\n\nScript 标签接受以下属性：\n\n*   Language（语言）– 此属性指示正在使用的语言。然而，较新版本的\
  \ HTML 和 XHTML 不再支持此属性。\n*   Type（类型）– 这是现代网站和网页中使用的属性。你必须使用它来指示你正在使用的计算机语言。请确保其值为“`text/javascript`”。\n\
  \n考虑到这些属性，JavaScript 的语法如下：\n\n![](img/image01879.jpeg)\n\n## 首次使用 JavaScript\n\n\
