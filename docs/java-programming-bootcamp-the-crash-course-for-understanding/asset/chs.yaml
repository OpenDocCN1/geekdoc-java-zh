  \ 蔬菜汤\n\n**腰果罗青酱食材：**\n* 平叶欧芹，细切\n* 新鲜香菜叶，细切\n* `1 根` 香茅，细切\n* `1 瓣` 大大蒜，细切\n* `100ml`\
  \ 特级初榨橄榄油\n* `1 tablespoon` 切碎的腰果\n* `½个` 青柠檬的汁\n* 适量盐和胡椒\n\n**做法：**\n1. 在一个大汤锅中加热橄榄油。加入红薯、胡萝卜、大蒜、洋葱、姜、盐和胡椒。加入汤并煮沸。继续煮直到所有蔬菜变软。\n\
  2. 制作罗青酱，在食物料理机中混合欧芹、香菜、香茅、大蒜、橄榄油、腰果、柠檬、盐和胡椒。搅拌至混合物变得光滑蓬松。\n3. 上菜时，将汤倒入新鲜香菜中中。淋上一勺香菜腰果混合物。即可上菜。\n\
  \n### 7. 素食意面沙拉\n\n**食材：**\n* `7 ounces` 多谷意面\n* `1 瓣` 大蒜，对半切\n* `1 tablespoon`\
