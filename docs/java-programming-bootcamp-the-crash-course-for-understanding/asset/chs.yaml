  \n## 绝佳开启果汁\n\n绿茶通过三种高营养水果获得了水果冲击。菠萝增加了纤维，梨带来了甜味，而木瓜呢？它为这种饮料带来了独特的风格，同时提供了大量的维生素\
  \ C。当你感到虚弱或发烧时制作这种饮料，你很快就能恢复活力。谈论获得对抗自由基损害的最大保护。\n\n### 有趣又美味的配料：\n* 1 杯冷泡的绿茶\n\
  * ½ 杯菠萝块\n* ½ 杯梨块\n* ½ 杯木瓜块\n\n### 制作方法：\n搅拌所有原料直到得到果汁。确保搅拌直到所有的水果块都完全液化。可能需要一段时间才能达到那种质地，所以如果你时间紧，可以使用滤网滤掉果渣后再享用。\n\
  \n# 第 5 章 - 7 天平腹减肥计划\n\n在短短 7 天内真的可能获得平坦的小肚子吗？虽然长期维持茶类排毒似乎是不可能的，但在 7 天内调整好状态会对你的身体产生巨大影响。尝试不要将这\
  \ 7 天视为解决问题的快速方案，而是将其视为一个过渡阶段，帮助你做出更好的食物选择和更健康的生活方式决定。\n\n\n\n\n\n这就是为什么这个计划的设计是为了让你向更健康的自己转变变得更容易接受。它的核心在于引入渐进式的变化，这样你的身体才不会陷入冲击中。你所做的就是严格执行这个计划，你将在短短\
  \ 7 天内看到一个崭全新的自己。\n\n## 周一\n\n开始排毒的最佳方式是养成多喝水的习惯。身体经常会将口渴与饥饿混为一谈，所以如果你一直感到饥饿，那是你的身体在提醒你喝的水不够了。保持水分充足是排毒的关键元素，也是一种提升能量的安全且有效的方法，尤其是当你正在减少热量摄入时。饭前喝一杯水，饭后再喝一杯。这样，即使没有额外的食物摄入，你也会感到饱足。\n\
  \n## 周二\n\n一旦你的身体得到了充分的水，下一步就是开始茶疗排毒。在前面的章节中读过的“1 天清洁法”在第二天执行应该会容易得多，因为你实际上已经通过喝大量水减少了食物摄入。这也是你停止沉溺于液体热量的完美时机。周二是你重新审视日常生活中饮品选择的一天。软饮料、果汁和酒精含有大量的糖，这些都是你身体并不需要的，所以请把在这一天戒掉这些习惯作为你的个人目标。\n\
  \n## 周三\n\n即使这一天只吃水果蔬菜，也要让用餐时间具有仪式感。在进行过 1 天禁食后，你的身体可能还没有准备好消化蛋白质和脂肪，所以尽量不要太兴奋。坚持吃清蒸和调淡的蔬菜来填饱一天的胃。如果你发现自己渴望甜食，水果是极佳的选择。不要让茶疗排毒让你感到被剥夺，相反，要为吃健康饮食感到兴奋。无论你多忙，留出时间让自己坐下来、放松并享受你的餐点是非常重要的。如果你一直忙着吃饭，你可能会吃过多，因为你没有花时间真正咀嚼食物，让身体自己产生饱腹感。\n\
  \n## 周四\n\n你有零食习惯吗？那么请把这一天专门用来消除那种“奖励”心态。仅仅因为你感到压力大或稍微运动了下，并不代表你有理由放纵自己巧克力和薯片等所有喜爱的零食。这些零食通常含有大量的热量和脂肪，所以用你能想到的所有美味来奖励自己，只会强化你脑海中“吃这些没关系”的想法。如果你想满足对甜味咸味的渴望，请寻找水果和坚果等健康的替代品。\n\
  \n## 周五\n\n周五的任务是养成与健康生活方式相的新习惯。这包括纠正睡眠习惯并进入运动状态。研究表明，睡眠不足的人更容易过度进，所以如果你想停止渴望，你需要增加睡眠时间。尝试在固定的时间睡觉，避免在睡前玩电子设备。这足以为高质量的睡眠奠定基调。虽然并不是人都对运动感到兴奋，但你需要找到一种方法让自己做好心理准备。从晨走或晚步开始，或者如果你觉得很冒险，可以尝试做\
  \ 10 分钟的 HIIT 初学者训练序列。重点在于从某处开始，并将其变成一种日常习惯。\n\n## 周六\n\n如果你遵循了时间表，现在你应该感觉健康了一点，饥饿感也减轻了一些。通过吃均衡的餐点来庆祝周末。你的餐点应该包含适量的碳水化合物、蛋白质和健康脂肪。如果少于这些，你注定几小时后就会感到饥饿。通过享用淡橄榄油汁的健康白鱼来满足你对肉类和脂肪的渴望。\n\
  \n## 周日\n\n从今天起养成规划餐的习惯，以确保涵盖所有的营养需求。安排好用餐时间，避免跳餐。跳餐对减肥没有帮助；相反，它只会让你在下一餐时变得更加饥饿。当你的身体开始感到被剥夺时，你会倾向于吃更多来补偿跳掉的那一餐。\n\
  \n建立一个每天固定时间用餐的常规。如果你需要补充能量，可以在下午加入一些健康的零食，别忘了用一杯你喜欢的排毒茶结束晚餐。\n\n## 结\n\n再次感谢下载本书！\n\
  \n希望这本书能够帮助你更好地了解如何通过茶疗获得你一直渴望体和生活方式。有了正确的信息和心态，恢复健康为时不晚。通过充分理解茶疗原理以及它如何改善你的生活，你很快就能恢复状态。\n\
  \n完全放弃旧习惯可能不容易，但要知道这是可能的。只要你制定一个帮助你进入正轨的行动计划，一切皆有可能。\n\n确保立即应用从书中中学到的知识。你不需要做出巨大的改变。你只需要做些事情来启动过程，进行健康的茶疗就足以帮助你获得一直想要的平腹。\n\
  \n最后，如果你喜欢这本书，我想请你一个忙，能否请你在亚马逊上为这本书留个评价？将不胜感激！\n\n\n\n\n\n无需为了健康而让自己处于一种非常严苛的饮食计划中。`Paleo\
  \ Diet`将帮助你在短时间内改善健康。因为你将不再食用任何加工食品，你的健康将会得到改善，晚上会睡得更好，看起来也会变得更好。难怪现在越来越多的人都在享受`14\
  \ Day Paleo Diet Plan`（14 天原始饮食计划）。\n\n再次感谢下载这本书，希望你喜欢！\n\n# 第 1 章：原始饮食计划的益处\n\n\
  现在越来越多的人转而原始饮食，仅仅是因为他们意识到这种饮食对你的身体有多有益。我们有太多的人吃了太多的加工食品，这些食品对我们的身体完全没有好处。\n\n原始饮食被认为与几千年前、甚至百万年前穴穴人和女性所摄入的饮食相似。他们的饮食由肉类（包括鱼类）、新鲜水果和蔬菜组成。他们不消耗乳制品，也不摄入加工食品（其中包括谷物制品）。\n\
  \n## 你身体偏好的饮食\n\n原始饮食简单来说就是你身体偏好的饮食，因为它包含了你身体保持健康所需的所有营养。我们的祖先不需要吃加工食品，我们也是如此。虽然我们可能经历了一定程度的进化，我们的生活可能与祖先的生活大不相同，但身体所需的营养仍然是非常相同的。\n\
  \n因为原始饮食是你身体偏好的饮食，这意味着它具有高度的可持续性。这意味着如果你愿意，你可以永久地切换到原始饮食，而不会对自己产生任何伤害。许多其他饮食在长期来看是不可持续的，它们应该只进行一段时间。\n\
  \n原始饮食与不同之处在于，它为你的身体提供了所需的所有营养，并将你变成一个健康的人，降低肥胖以及与饮食相关的疾病和状况的风险。\n\n# 第 2 章：开始原始饮食计划\n\
  \n如果你是第一次尝试原始饮食计划，你可能会发现一些实用的建议。从我自己的经验来看，开始一项新的饮食计划可能会非常困难。这就是为什么我决定包含一些建议，让你的旅程轻松一点。\n\
  \n## 犯错\n\n当我们开始一种新的饮食计划时，偶尔会犯错，这在我们每个人身上都会发生。如果你不小心吃了某些通常不属于原始饮食的内容，不要担心，尽快回到吃你应该吃的食物上。对于吃了不该吃的东西，你无能为力，只需尽力确保它不再发生，并将其视为一种经验即可。\n\
  \n## 寻找你可以采购食材的地方\n\n在你开始这项饮食计划之前，你可以做的最好的事情之一，就是想好从哪里采购食材。如果你当地的商店不卖太多新鲜水果和蔬菜，你需要想办法从哪里获取它们。\n\
  \n去当地的市场转转，光顾附近的蔬菜店，或者去更远的地方售卖你寻找的食物的城镇。有些商店可能乐意将你需要的产品直接送到家门口，所以为什么不问问他们是否能提供帮助呢？\n\
  \n为了制作书中包含的一些食谱，你需要的许多原料可以用日常食材制成。没有什么花哨的食材是你买不到的。看看你需要的食物，列出一份你想买的所有配料清单，然后去购物吧！\n\
  \n## 和朋友一起开始计划\n\n你可能在奇怪为什么我建议你和朋友一起开始这项计划。我建议你这样做是因为这会让饮食变得容易得多。有时候，有一个人可以交流心得会少很多麻烦。而且，你还会发现当情况变得困难时，你们可以互相激励。此外，如果你坚持执行计划，你们都可以出去奖励一下表现表现优异的自己，这永远不是一件坏事。\n\
  \n为什么不找一个愿意与你一起参加原始饮食计划的朋友甚至家人呢？如果没有人想加入你，那么我的建议是寻找在线原始饮食论坛。这些论坛被证明非常有用，因为它们充满了提示、技巧、食谱创意、激励技巧以及任何让人们坚持下去的要素。\n\
  \n不要独自执行计划，除非你绝对自己每天都能激励自己，即使在困难时期也是如此。\n\n## 关键食物/食材\n\n### 水果和蔬菜\n\n尽可能新鲜，尝试从你的当地市场采购，因为它们会格外新鲜，价格可能便宜得多，而且你也在支持当地业务。\n\
  \n如果你必须吃加工的水果和蔬菜，请寻找那些添加糖极少或完全不含糖的品种。冷冻水果蔬菜通常和新鲜的一样好，但同样要注意任何添加糖。\n\n### 乳制品\n\n\
  在执行原始计划时应避免乳制品。这是因为大多数乳制品都经过了加工，而且它们对你并不总是有益。\n\n你知道吗，我们身体被设计来的唯一牛奶是母乳？我们不应该喝牛奶，因为我们无法对其进行消化。\n\
  \n如果你仍然想在饮食中加入牛奶，我建议你考虑喝豆奶，或者需要时喝杏仁奶或椰子奶。\n\n我知道完全避开乳制品很难，但也有很好的替代品。\n\n### 鸡蛋\n\
  \n如果你没有什么比吃鸡蛋更喜欢的了，那么你会很高兴知道可以坚持下去。鸡蛋是完全自然的，没有经过加工，对你非常有益。早餐吃一个鸡蛋，或者在一天中的任何时候。\n\
  \n# 第 3 章：饮食计划（14 天指南）\n\n原始饮食计划可能是你遇到的最健康的饮食计划之一。充满了新鲜水果蔬菜，极少或没有加工食品，以及低脂肪饮食和零食。好消息是你可以享受这种饮食计划，同时食用许多自己制作的食物。\n\
  \n请查看下方列出的计划。该计划只是对你应该吃的建议，你不必遵循它。你将在后续章节找到大部分食谱。\n\n请注意，虽然许多食谱完全不含加工食品，但也有一些包含。这是因为你们中的一些可能会发现，如果不使用包装食材，很难做出这些菜肴。\n\
  \n记住，那里有很多乳制品替代品，可以在需要时寻找并使用它们。\n\n\n\n\n\n# 零食：苹果片\n午餐：面条和内红豆汤\n零食：一个水果或一个酸奶\n\
  晚餐：牛肉面\n\n# 第七天\n早餐：香香蕉混合坚果\n零食：椰子、香蕉和巧克力奶昔\n午餐：梨和柿子沙拉\n零食：一个水果或一个酸奶\n晚餐：烤土豆配沙拉\n\
  \n# 第八天\n早餐：红薯松华夫饼\n零食：苹果、香蕉和姜味马芬\n午餐：鲭鱼沙拉\n零食：一个水果或一个酸奶\n晚餐：烧烤鸡肉\n\n# 第九天\n早餐：香蕉草莓奶昔\n\
  零食：苹果片\n午餐：扁豆和鹰嘴豆汤\n零食：一个水果或一个酸奶\n晚餐：豆子番茄辣锅\n\n# 第十天\n早餐：蔬菜炒豆腐\n零食：椰子、香蕉和巧克力奶昔\n\
  午餐：烤鸡卷饼\n零食：一个水果或一个酸奶\n晚餐：奖励自己任何你想吃的食物\n\n# 第十一天\n早餐：一个水果，或两个\n零食：水果沙拉\n午餐：辣锅和芹菜沙拉\n\
  零食：一个水果或一个酸奶\n晚餐：火鸡肉油桃汉堡\n\n# 第十二天\n早餐：樱桃藜麦粥\n零食：苹果、香蕉和姜味马芬\n午餐：香菜和菠菜奶昔\n零食：一个水果或一个酸奶\n\
  晚餐：蒸三文鱼西芦\n\n# 第十三天\n早餐：橙子柠檬奶昔\n零食：苹果片\n午餐：面条和内红豆汤\n零食：一个水果或一个酸奶\n晚餐：牛肉面\n\n# 第十四天\n\
  早餐：香香蕉混合坚果\n零食：椰子、香蕉和巧克力奶昔\n午餐：梨和柿子沙拉\n零食：一个水果或一个酸奶\n晚餐：烤土豆配沙拉\n\n# 第 4 章：原始风早餐食谱\n\
  每天早上都享受美味且营养丰富的早餐。如果你早上时间比较紧迫，在前一天晚上准备好早餐会有很大帮助。\n\n## 红薯松华夫饼\n2 人份\n\n配料：\n- 4\
  \ 汤匙玉米淀粉\n- 4 汤匙红薯泥\n- 6 汤匙小麦面粉\n- 半茶匙盐\n- 4 汤匙素食友好植物酪奶\n- 2 汤匙红糖\n- 1/4 茶匙肉豆蔻\n\
  - 2 茶匙泡打粉\n- 2 个素食友好鸡蛋\n- 4 汤匙素食友好黄油（融化）\n- 118 克火腿\n\n方法：\n1. 开启华夫饼机并预热。现在击打玉米淀粉，加入泡打粉、盐、肉豆蔻并搅拌。将植物酪奶倒入另一个碗中。加入黄油、红薯泥和鸡蛋，并打匀。\n\
  2. 将面粉混合物加入红薯混合物中，搅拌。加入火腿再次搅拌。现在在华夫饼机上喷一些油，用勺子将约`80 mls`的混合物倒入机器中。\n3. 烤至松华饼呈金黄色，即可上桌。\n\
  \n## 香蕉草莓奶昔\n1 人份\n\n配料：\n- 1 根香蕉\n- 1 杯豆奶或杏仁奶\n- 一把草莓\n- 1 汤匙枫糖浆\n- 一小撮肉桂\n\n方法：\n\
  将食材加入榨汁机或破壁机中，搅拌至光滑。倒入杯中即可上桌。\n\n## 橙子柠檬奶昔\n1 人份\n\n配料：\n- 1 汤匙柠檬汁\n- 1 个橙子\n- 半个柚子\n\
  - 1 汤匙蜂蜜\n- 4 汤匙豆制基酸奶\n- 240ml 豆奶\n\n方法：\n将食材放入搅拌机或榨汁机中，搅拌至光滑。倒入杯中即可上桌。\n\n## 蔬菜炒豆腐\n\
  3 人份\n\n配料：\n- 一块`豆腐`（最好是硬豆腐）\n- 3 把菠菜叶\n- 1 个切四的番茄\n- 3 瓣大蒜\n- 半个红洋葱\n- 半个灯椒（颜色均可）\n\
  - 一小撮盐\n\n方法：\n使用食物处理器，加入菠菜、洋葱、大蒜和辣椒。反复打碎食材直到细腻。取一个煎锅，加入混合物，中火火煎。等混合物开始煮沸，加入盐和豆腐，然后搅拌。烹饪食材直到液体几乎剩余。即可上桌。\n\
  \n## 樱桃藜麦粥\n2 人份\n\n配料：\n- 2 汤匙藜麦\n- 240ml 水\n- 半茶匙香草提取物\n- 1 汤匙蜂蜜\n- 1/4 茶匙肉桂\n\
  - 一把无甜樱桃\n\n方法：\n将除蜂蜜外的所有食材放入锅中，置于中火。煮沸后转小火。慢煮约 15 分钟，或直到水完全吸收。此时藜麦应该是软的了。淋上蜂蜜，即可上桌。\n\
  \n## 混合坚果\n1 人份\n\n配料：\n- 一把无糖混合坚果\n- 1 根香蕉\n- 半杯豆奶、杏仁奶或椰子奶（可选）\n\n方法：\n将香蕉切成小块并加入混合坚果中，搅拌均匀。\n\
  加入豆奶、杏仁奶或椰子奶再次搅拌。即可上桌。\n\n## 一个水果，或两个\n一个水果可以是一顿非常健康的早餐，尤其是如果你通常在这个时间点不吃的话。尝试选择一个或两个你喜欢的口味，以及一个你当天晚些时候不会再吃的。。这样做可以确保你的身体获得尽可能多的营养。搭配一些新鲜的水果。\n\
  \n# 第 5 章：午餐时间食谱\n这些午餐食谱可以带去上班，也可以在家里享用。让这些午餐食谱保持新鲜的。\n\n## 鲭鱼沙拉\n2 人份\n\n配料：\n\
  - 3 盎司熏熏鲭鱼\n- 60ml 素食友好植物酪奶\n- 半瓣大蒜\n- 半汤匙欧芹\n- 半根芹菜\n- 半个切碎的洋葱\n\n方法：\n将鲭鱼以外的食材放入碗中搅拌。当混合物光滑后，用叉子拌匀。加入鲭鱼，拌匀即可上桌。\n\
  \n## 烤鸡卷饼\n3 人份\n\n配料：\n- 3 汤匙素食友好植物酪奶\n- 1/4 茶匙盐\n- 半汤匙醋\n- 半茶匙黑胡椒\n- 半只烤鸡\n- 2\
  \ 把切丝的红卷菜\n- 一小撮辣椒粉\n- 1 汤匙腌汁\n- 3 张有机小麦薄饼\n\n方法：\n将黑胡椒、腌汁和植物酪奶放入碗中。在另一个碗中，加入盐、卷菜和辣椒粉。将鸡肉切成一口大小，加入植物酪奶中。现在将酱和卷菜装入薄饼中，卷好即可上桌。\n\
  \n## 辣锅和芹菜沙拉\n3 人份\n\n配料：\n- 少许辣椒片\n- 4 根切碎的芹菜\n- 1 汤匙柠檬汁\n- 1 汤匙柠檬皮\n- 2 颗枣（浸泡去去）\n\
  - 芝麻酱\n- 5 克碎欧芹\n- 一小撮盐\n- 10 颗烤杏仁\n- 适量的新鲜薄荷\n\n方法：\n将枣和浸泡过的水放入搅拌机中。加入辣椒片、盐、柠檬汁和芝麻酱，搅拌。混合物光滑后，将食材倒入碗中，然后加入芹菜、柠檬皮、欧芹、杏仁和盐。搅拌。\n\
  \n## 面条和内红豆汤\n3 人份\n\n配料：\n- 140 克内红豆，浸泡并沥干\n- 半个中等洋葱，切碎\n- 1 瓣蒜末\n- 半根芹菜，切片\n-\
  \ 3 个切碎的番茄\n- 半汤匙橄榄油\n- 半根胡萝卜切片\n- 半束羽甘蓝切片\n- 125 克通心粉\n- 调味\n\n方法：\n将芹菜、胡萝卜、洋葱和大蒜放入另一个锅中，炒至软（约\
  \ 8-10 分钟）。沥干豆子，将它们加入锅中，加上番茄、盐和约`480 mls`的水。煮沸，加入面条煮至你喜好的稠度。加入羽甘蓝慢煮 5 分钟，即可上桌。\n\
  \n\n\n\n\n# 扁豆汤\n\n- 一把切碎的芹菜\n- 1 茶匙末状的大蒜\n- 1 罐沥干并冲洗过的鹰嘴豆\n- 2 个切碎的西红柿\n- 38 克扁豆\n\
  - 720ml 蔬菜汤\n\n### 烹饪方法\n在大锅中用中火至大火炒洋葱。现在加入芹菜和胡萝卜，再炒 5 分钟。加入大蒜和除汤汁以外的所有食材，炒 30-40\
  \ 秒。现在加入高汤，煮约 1.5 小时，直到扁豆变软。即可装盘享。\n\n## 香菜菠菜奶昔\n份量：1 人份\n\n### 配料\n- 2 束香菜叶\n-\
  \ 114 克菠菜\n- 半个红甜椒\n- 1 个西红柿，最好是大大号的，切碎\n- 半根芹菜茎，切碎\n- 少许柠檬汁\n- 半根胡萝卜，切碎\n- 四分之一个小洋葱，切碎\n\
  \n### 烹饪方法\n将所有食材加入榨汁机或搅拌机中，搅拌至光滑。即可装盘享。\n\n## 梨和柿子沙拉\n份量：2 人份\n\n### 配料\n- 1 个柿子，切片\n\
  - 1 个梨，切片\n- 1 茶匙芥末\n- 3 汤匙橄榄油\n- 1 个头末状红洋葱\n- 2 汤匙柠檬汁\n- 1 茶匙末状大蒜\n- 375 克菠菜\n\
  - 62 克核桃果仁\n\n### 烹饪方法\n将芥末、柠檬汁、油、红洋葱和大蒜放入碗中混合。现在加入柿子、梨、菠菜和核桃果仁并拌匀。即可装盘享。\n\n# 第\
  \ 6 章：晚餐食谱\n以下晚餐食谱将让你在一天结束时感到非常饱足。\n\n## 烤鸡肉\n份量：2 人份\n\n### 配料\n- 1 块去骨鸡胸肉\n- 2\
  \ 块去骨鸡腿\n- 1/4 茶匙大蒜\n- 3/4 汤匙红椒粉\n- 少许牛辣椒粉\n- 150 克 烧烤酱\n\n### 烹饪方法\n去掉鸡肉皮并切成薄条。将红椒粉、大蒜、盐和辣椒粉放入碗中搅拌均匀。现在将混合物抹在鸡肉上，煎\
  \ 2 分钟以锁住汁水。\n\n在锅中煎鸡肉至几乎煮熟（约 10 分钟），然后再次放置在烤架下。在鸡肉上上烧烤酱，再煮 1 分钟，即可装盘享。\n\n## 豆子西红柿辣锅\n\
  份量：3 人份\n\n### 配料\n- 1 罐黑豆\n- 1 罐切碎的西红柿\n- 半罐斑豆豆\n- 1 个红洋葱，切碎\n- 1 根芹菜茎，切碎\n- 半个甜椒，切碎\n\
  - 2 瓣大蒜，切碎\n- 1 汤匙橄榄油\n- 1 汤匙香菜\n- 1 汤匙辣椒粉\n- 1 茶匙孜然粉\n- 1/2 茶匙牛至草\n- 2  撮盐\n- 1\
  \ 茶匙柠檬汁\n- 3/4 茶匙红椒粉\n- 半片月桂叶\n- 240ml 水\n\n### 烹饪方法\n使用荷兰锅，在锅底部倒入橄榄油并加热。加入洋葱、胡萝卜、芹菜、一小撮盐和辣椒。搅拌。煮\
  \ 5 分钟。\n\n加入红椒粉、大蒜、辣椒、牛至草和孜然粉并搅拌 1 分钟。加入斑豆豆、黑豆、西红柿、月桂叶和水，搅拌。煮至沸后偶尔搅拌。煮 15 分钟，然后加入香菜再次搅拌。撒入剩余的盐，搅拌即可装盘享。\n\
  \n## 火鸡肉油油桃汉堡\n制作数量：6-8 个\n\n### 配料\n- 500 克鸡肉肉糜\n- 1 个洋葱，切碎\n- 1 汤匙香菜\n- 2 个油油桃，切碎\n\
  - 28 克干西红柿，切碎\n- 一把香菜，切碎\n- 2 汤匙盐和胡椒\n\n### 烹饪方法\n炒洋葱直到变软。将所有食材放入大碗中彻底搅拌均匀。用手做成肉饼，捏成你喜好的形状，然后放入冰箱静置几小时。\n\
  \n等汉堡定型后，涂抹少许油，每面煎约 5 分钟，或直到煮熟。即可装盘享。\n\n## 西葫芦蒸三文鱼\n份量：2 人份\n\n### 配料\n- 2 块三文鱼鱼排\n\
  - 1 个小西葫芦，切片\n- 半个切片柠檬\n- 半个洋葱，切片\n- 60ml 水\n- 120ml 白葡萄酒\n- 1/2 茶匙盐\n- 少许磨粉胡椒\n\
  \n### 烹饪方法\n取一个荷兰锅，将洋葱、西葫芦、柠檬、水和葡萄酒放入底部。现在给三文鱼调味。在荷兰锅的食材上方放置一个蒸锅架。用中火至大火加热直到液体开始沸腾。关火，将三文鱼放在蒸锅架上并盖好。蒸约\
  \ 8 分钟，直到三文鱼煮熟。即可装盘享。\n\n## 牛肉面\n份量：3 人份\n\n### 配料\n- 250 克牛肉肉糜\n- 半包面条\n- 半个绿青椒，切碎\n\
  - 2 个西红柿，切碎\n- 1 个洋葱，切碎\n- 100 克磨碎奶士\n- 175 克玉米\n- 一把蘑菇\n- 盐和胡椒调味用\n\n### 烹饪方法\n\
  将牛肉放入荷兰锅中用小火煮。煮 8-10 分钟。加入青椒、西红柿、洋葱、盐和胡椒调味。放入面条、玉米、蘑菇并撒上磨碎奶士，搅拌。\n\n放入牛肉煮熟，搅拌即可。\n\
  \n## 烤土豆\n份量：1 人份\n\n### 配料\n- 1 个土豆\n- 1 个梨，切片\n- 1/2 根黄\n- 菠菜\n- 1/2 根芹菜茎，切碎\n\
  - 1 个西红柿，切碎\n- 1/2 根胡萝卜，切碎\n- 1/4 个小洋葱，切碎\n\n## 烤烤土豆\n份量：1 人份\n\n### 配料\n- 1 个土豆\n\
  - 1 个西红柿，切碎\n- 一把生菜\n- 一根黄瓜，切片\n- 少许橄榄油\n\n### 烹饪方法\n将土豆放入烤箱烤 1 小时，直到煮熟。撒上生菜即可。\n\
  \n# 第 7 章：生酮饮食零食\n谁说不能享受一些美味的零食呢？\n\n## 苹果香蕉玛芬包\n制作数量：12 个\n\n### 配料\n- 200 克面粉\n\
  - 1 汤匙泡打粉\n- 1 汤匙苹果醋\n- 1 茶匙磨姜粉\n- 1 茶匙肉桂粉\n- 1/2 茶匙盐\n- 175 克苹果，切片\n- 150 克糖\n\
  - 180ml 牛奶\n- 150 克捣碎香蕉\n\n### 烹饪方法\n预热烤箱至 400 度华氏，准备玛芬模具。将面粉、糖、泡打粉、盐、肉桂粉混合均匀。在大碗中加入牛奶、香蕉、苹果醋和姜。加入面粉混合物搅拌至均匀。\n\
  \n放入烤箱烤 15 分钟，直到完成。即可享。\n\n## 苹果片\n份量：2 人份\n\n### 配料\n- 4 个苹果，切片\n- 少许南香料粉\n- 少许肉桂粉\n\
  \n### 烹饪方法\n将苹果片放在烤盘上，撒上肉桂粉。放入烤箱在 230 度华氏下烤 1 小时。翻转苹果片，在另一面撒上肉桂粉，在 200 度华氏下烤 1 小时。\n\
  \n现在关掉火，让苹果留在里面 1 到 2 小时，直到变脆。从烤箱中取出苹果，撒上南香料粉即可享。\n\n## 椰子香蕉巧克力奶昔\n份量：1 人份\n\n###\
  \ 配料\n- 1 茶匙椰子丝\n- 240ml 椰子水\n- 1 茶匙可可粉\n- 一把菠菜\n- 1 个香蕉\n\n### 烹饪方法\n将所有食材加入榨汁机或搅拌机中，搅拌至完全混合。倒入杯中，即可享。\n\
  \n## 水果沙拉\n份量：2 人份\n\n### 配料\n- 1 个香蕉\n- 1 个苹果\n- 4 个草莓\n- 1/4 个瓜，切片\n- 120ml 新鲜榨橙汁\n\
  \n### 烹饪方法\n将所有水果放入碗中混合。淋上新鲜榨橙汁，再次搅拌。即可。\n\n## 燕麦葡萄干饼干\n制作数量：20 个\n\n- 90 克燕麦\n\
  - 300 克葡萄干\n- 125 克花生酱替代品\n- 1 茶匙香草精\n- 1 茶匙泡打粉\n- 1 茶匙肉桂粉\n- 1/4 茶匙盐\n- 1/4 茶匙肉豆蔻\n\
  - 60ml 水\n\n### 烹饪方法\n将烤箱调至 350 度华氏，将 60 克的燕麦放入食物处理器中，脉冲碎至细末。将肉豆蔻、肉桂、燕麦粉、泡打粉和盐放入碗中搅拌。\n\
  \n\n\n\n将 150 克葡萄干放入食物处理器中，加入 60 毫升水，打成泥。加入花生酱和香草，再次打成泥。现在加入剩下的葡萄干和燕麦，加入燕麦混合物中，搅拌均匀。\n\
  \n用茶勺取一些混合物放在饼干板上。饼干之间留出 1 英新的距离，用勺背将其压平。烹饪约 12 分钟，直到饼干变色。现在将它们转移到冷却架上，冷却冷却即可食用。\n\
  \n# 第 8 章：提示与技巧\n\n你可能会发现一些提示和技巧，能让你的原始饮食计划之旅变得稍微轻松一些。这些技巧将帮助你减肥，让你理解减肥的原理，并在你希望再次执行该计划时为你提供建议。\n\
  \n## 水\n水是原始饮食计划以及（可以说，任何饮食计划中绝对不可或缺的一部分。水不仅能让你感到水分充足，还可以帮助加速减肥。这是因为它可以让你产生饱腹感，尽管如此，你应该确保不要摄入过多的水，因为这对你的健康不利。尽量坚持每天喝\
  \ 8 杯水，并用它来保持水分。\n\n## 运动\n14 天原始饮食计划不仅能帮助你吃得更健康，而且一定会有所减轻。如果你计划在执行此计划期间运动，请务必坚持你常规的锻炼方案。\n\
  \n你可能会发现，在全新的饮食计划之外增加额外运动太困难了。我的建议是一次只尝试一件新事物。习惯吃原始饮食（如果你计划长期坚持下去），然后再增加更多运动。\n\n\
  ## 你的减肥\n你作为此计划的一部分所实现的任何减肥，很可能是因为你现在摄入的盐、糖和脂肪更少。这些通常隐藏在加工食品中，因为你摄入的较少（如果完全没摄入的话），你很可能会减轻。\n\
  \n当你开始减肥时，起可能会减得很快，这取决于你平时吃什么。如果你长期坚持这个计划，每周减轻的重量将会减少。这完全是正常的，完全不需要担心。\n\n如果你并不是为了通过原始饮食计划来减肥，而只是为了享受一种健康的饮食，那么你可能仍然减轻一点体重。并不是每个人都想减肥，有些人更倾向于先吃健康的均衡饮食，并将任何减肥视为次要考虑。\n\
  \n## 如果你想再次执行该计划\n一旦你执行了 14 天的原始饮食计划，你无疑会感觉更好、看起来也更好。你很可能减轻了一些体重，但你可能更有精力，睡眠可能也更好。\n\
  \n原始饮食计划的伟大之处在于它在长期来看是完全可持续的。这是因为它非常健康的饮食，你的身体会喜欢，而且你不会错过任何营养。\n\n我的建议是享受参与原始饮食计划，但不要忘记偶尔奖励一下自己。奖励自己会让你觉得得到了补偿，也能防止你感到无聊。\n\
