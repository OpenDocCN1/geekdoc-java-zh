  $ ./test.py\n```\n\n你得到以下输出：\n\n```\nMonty Python’s Flying Circus\n```\n\n## 标识符\n\
  \n标识符基本上用于确定函数、变量、模块、类以及任何其他对象。它以下划线（`_`）或字母开头。随后是数字、下划线、零或其他字母。作为程序员，可以使用任何字母或数字。你可以使用大写和小写字母。\n\
  \n然而，你不能在标识符中使用点符号和特殊字符，例如 `@`、`$` 和 `%`。此外，`Python` 是一种大小敏感的编程语言。这意味着在代码中使用大写和小写字母时必须小心。例如，`wendy`、`Wendy`\
  \ 和 `WENDY` 都是同一个名字，但在 `Python` 中它们被视为三个不同的标识符。\n\n### Python 标识符规则\n\n在 `Python`\
  \ 中编写程序时，你必须遵守以下几条规则：\n\n- 类名必须始终以大写字母开头，而其他标识符必须以小写字母开头。\n- 如果标识符以一个前导下划线开头，则它是私有的。\n\
  - 如果标识符以两个前导下划线开头，则它是强私有性的。\n- 如果标识符以两个后缀下划线结尾，则它是语言定义的特殊名称。\n\n## 保留字\n\n请注意，某些单词你不能作为\
  \ `Python` 中的常量、标识符名或变量使用。所有的关键字都使用小写字母编写。以下是该语言的保留字：\n\n| And | Assert | Break\
  \ | Class | Continue |\n| :--- | :--- | :--- | :--- | :--- |\n| def | del | elif\
  \ | else | except |\n| exec | finally | for | from | global |\n| if | import | in\
  \ | is | lambda |\n| Not | or | pass | raise |\n| return | try | while | with |\
  \ yield |\n\n## 缩进与行\n\n`Python` 中没有用于指示代码块的大括号。同样，它不包含流控制。如果你想表示此类块，你必须使用缩进。为了帮助你理解这一点，考虑以下示例：\n\
  \n```\nif True:\n    print “Correct”\nelse:\n    print “Input”\n\nif True\n    print\
  \ “Input”\nelse:\n    print “Correct”\n\nprint “False”\n```\n\n运行第一个示例会产生输出。然而，运行第二个会导致错误。为什么会发生这种情况？嗯，你必须记住在\
  \ `Python` 中，块是通过缩进相同数量的连续行形成的。\n\n缩进仅仅是分组的方式。程序员用它来代替代码的大括号。制表符和空格都支持，但标准缩进要求代码具有相同数量的空格。通常使用四个空格。看以下示例：\n\
  \n```\nw = 1\nif w == 1 :\n    # 这显示了四个空格的缩进\n    print “ w is 1 .”\n```\n\n## 缩进误区\n\
  \n关于 `Python` 缩进存在某些误区。这里是其中一些：\n\n每段源代码中空白都是必要的。\n\n实际上，你不需要在所有的源代码中使用空白。空白并不一定是重要的，但缩进是。正如你所学到的，这是语句最左侧部分的空白。在其他任何地方，空白并不重要，可以省略。你可以以任何喜欢的方式使用它，甚至在程序的任何地方插入任意的空白或空行。\n\
  \n此外，缩进的精确数量并不重要，但嵌套块的相对缩进是重要的。当你使用隐式或显式延续行时，缩进级别实际上不会被识别。例如，你可以将列表跨越多行。此时缩进完全不重要。看以下示例：\n\
  \n```\nfoo = [\n```\n\n\n\n\n```python\n‘ a string ‘ ,\n‘ another string ‘ ,\n‘\
  \ a short string ‘\n]\nprint foo\n```\n\n如果你运行上述代码，你将得到以下输出：\n\n`[ ‘ a string ‘\
  \ , ‘ another string ‘ , ‘ a short string ‘ ]`\n\n这是另一个例子：\n\n```python\nbar = ‘\
  \ look at this example ‘ \\\n      ‘ of a long string ‘ \\\n      ‘ that is split\
  \ ‘ \\\n      ‘ across multiple lines ‘\n\nprint bar\n```\n\n如果你运行上述代码，你将获得以下输出：\n\
  \n`look at this example of a long string that is split across multiple lines`\n\n\
  在你的程序中，应该使用特定的缩进风格。\n\n嗯，这个说法既是对的也是错的。你可以将内部块写在一行并且不对其进行缩进。你可以使用以下“if 语句”的任何一个版本，因为它们都是合法的并且产生相同的输出：\n\
  \n```python\nif 1 + 1 == 2 :\n    print “ foo”\n    print “ bar ”\n    w = 99\n\
  if 1 + 1 == 2 :\n    print “foo” ; print “ bar “ ; w = 99\nif 1 + 1 == 2 : print\
  \ “ foo “ ; print “ bar “ ; w = 99\n```\n\n作为一名程序员，你可能希望将你的代码块写在单独的行，如第一个示例所示。然而，有时会有一些相似的\
  \ if 语句，你可以方便地将它们写在每一行。\n\n如果你决定将代码块写在单独的行，就必须遵循缩进规则。你必须使包含的块缩进比 `if statement`\
  \ 多。\n\n总之，在 Python 中你将被强制遵守这条规则，除非你选择让程序的结构变得复杂。该编程语言不允许使用伪缩进来混淆程序结构。\n\n请记住，在\
  \ Python 语言中，块是通过缩进表示的；因此，每个程序中的缩进都是相同的。代码格式的一致使得程序更容易阅读和理解。\n\n在 Python 中不能混合使用空格和制表符。\n\
  \n是的，这是真的，即使对于用 C 语言编写的程序也是如此。你不能安全地混合空格和制表符。尽管对于你的编译器来说可能没有巨大差异，但在处理代码时可能会遇到困难。例如，如果你将\
  \ C 源代码移动到一个具有不同制表位位的编辑器中，错误将更容易引入。\n\n再次记住，在缩进时混合使用空格和制表符是不理想的。不过你可以单独使用空格或制表符。此外，你可能想完全避免使用制表符。毕竟，制表符的语义并没有那么明确，并且在不同类型的编辑器和系统上的显示可能不同。\n\
  \n制表符在复制粘贴操作期间，以及当源代码插入 Web 页面或任何其他标记代码时，也经常被错误地转换或破坏。\n\n跳过缩进并改用关键字是可能的。\n\n是的，你可以跳过缩进而只使用关键字。实际上有少数程序员倾向于使用\
  \ `endif` 而不是缩进来表示代码块的结束。\n\n嗯，这在 Python 中并不是被认可的关键字。该编程语言的早期版本带有一个工具，可以将使用 `end`\
  \ 关键字的代码转换为正确的缩进并移除该关键字。\n\n这可以作为编译器的预处理器。然而，在该语言的最新版本中，该工具已被移除，很可能是因为它并不经常被使用。\n\
  \n### 编译器是如何解析缩进的？\n\n解析实际上非常简单且定义明确。通常，缩进层级的变化会被标记（tokens）插入到流中。缩进层级使用词法分析器或分词器的栈进行存储。最初，栈中只有一个位于左侧的值\
  \ `0`。\n\n每当一个嵌套块开始时，一个新的缩进层级会被推入栈中。随后 `indent` 标记会被插入流并传递给解析器。每当一个嵌套块结束时，层级从栈中弹出并插入\
  \ `dedent` 标记。\n\n### 多行语句\n\n当你想要让字符串跨多行时，可以使用反斜杠 `\\`。为了帮助你理解，请考虑以下示例：\n\n```python\n\
  total = first_line \\\n      second_line \\\n      third_line\n```\n\n### 引号\n\n\
  作为程序员，你被允许定义字符串字面量时使用单引号 `‘`、双引号 `“` 以及三引号 `'''` 或 `“”\"\"`。同样，请确保在字符串的开头和结尾使用相同类型的引号。通常，三引号用于跨多行字符串。看下例示例：\n\
  \n```python\nparagraph = \"\"\"You are reading an example of a paragraph that consists\
  \ multiple lines and sentences. You are an excellent programmer.\"\"\"\n```\n\n\
  ### 注释\n\n提到注释时，你应该使用井号符号 `#` 来开头。然而，这个井号不应该出现在字符串字面量中。此外，它之后直到行尾的字符都应包含在注释中。在 Python\
  \ 中，解释器不识别注释。为了帮助进一步理解这个概念，请看下例：\n\n```python\n# This is the first comment\nprint\
  \ “ Monty Python’s Flying Circus is a British sketch comedy series. ” # This is\
  \ another comment own\n```\n\n如果你运行上面的示例，你将获得以下输出：\n\n`Monty Python’s Flying Circus\
  \ is a British sketch comedy series.`\n\n你也可以在表达式或语句之后编写注释，例如：\n\n```python\nname\
  \ = “Wendy” # This is a sample comment\n```\n\n如果你想对多行进行注释，也可以这样做。例如：\n\n```python\n\
  # This is a sample comment.\n# This one is also a comment.\n# This is another comment.\n\
  # This comment is written by Wendy.\n```\n\n\n\n\n\n这些行在 Python 编程语言中是不被识别的。尽管如此，它们非常像注释。它们包含空白字符甚至注释。在交互式解释器会话，你必须使用空行来终止多行语句。\n\
  \n# 第 3 章：数据类型\n\n在 Python 中，输入数据根据不同的类别进行排序。排序的首要目的是帮助像你这样的程序员更高效地处理信息。这些类别充当数据存储位置，你可以在运行\
  \ Python 平台时随时访问它们。\n\n## 变量\n\n变量包含了专门分配给它们的值。如果你正在编写复杂的应用程序代码，可能希望将信息存储在这些变量中。不要担心，因为你可以在需要随时访问它们。你甚至可以使用它们来确保从终端用户那里收集的信息保持安全可靠。\n\
  \n## 数字类型\n\nPython 编程语言中的数字与你在代数中解决问题时使用的数字不同。在数学中，在数字末尾加上 `.0` 实际上没有任何意义。它不会改变它的值。例如，`3`\
  \ 和 `3.0` 是相同的。\n\n但在 Python 中，`3` 和 `3.0` 是不同的数字。在程序处理它们之前，它们必须经过某些数据处理方法。作为程序员，你必须学习不同的数字类型。\n\
  \n### 整数\n\n所有整数都是整数。包含小数点的数字不是整数；因此，`3` 是整数，而 `3.0` 不是。Python 中的整数的特征是数据数据类型 `int`。\n\
  \n请注意，整数有容量限制。如果你尝试处理超出允许限制的值，将产生错误。整数通常处理 `-9,223,372,036.854` 到 `9,223,372,036.854`\
  \ 之间的数字。\n\n`int` 变量还有一些有趣的特性。例如，2 进制只使用 `0` 和 `1`，8 进制使用 `0` 到 `7` 的数字，10 进制具有与十进制系统类似的属性，16\
  \ 进制使用字母 `A` 到 `F` 和数字 `0` 到 `9` 作为数字。\n\n### 浮点数\n\n在 Python 中，任何包含小数点的数字都被视为浮点数。小数点后的数字是否为\
  \ 0 并不重要。例如，`3.0`、`1.5` 和 `11.4` 都是浮点数。它们存储在 `float` 数据类型中。浮点数相对于整数的一个巨大优势是它们拥有更大的存储空间；因此，它们能够存储非常小或大的值。\n\
  \n此外，你不应该认为它们具有无限的存储空间。仍然存在限制。尽管如此，它们包含的内容低至 `±2.2250738585072014 × 10-308`，高达 `1.7976931348623157\
  \ × 10-308`。使用浮点数分配值的方法。。首先，你可以直接赋值。其次，你可以使用科学计数法。记住，负指数会产生等效分数。\n\n### 复数\n\n这些数字由实数和虚数组成。通常，它们被用于动态系统、量子力学、计算机图形、电气工程和流体力学。复数可以在\
  \ Python 以及其他少数编程语言中处理。\n\n### 布尔值\n\n这是两个常量对象 `True` 和 `False`。它们代表真值。在数值上下文中使用时，它们充当\
  \ `0` 和 `1`。你可以使用函数 `bool` 为布尔值赋值，如果该值可以被解释为真值。\n\n### 字符串\n\n它们是用双引号连接的字符组。请考虑以下示例：\n\
  \n```\nTheString = \" Python got its name from a popular comedy show. \"\n```\n\n\
  如你在上面的示例代码所示，短语 `Python got its name from a popular comedy show.` 被赋值给变量 `TheString`。\n\
  \n计算机无法理解字母，只能理解数字。所以当你写一个程序时，Python 根据代表其字母的数字来读取和解释它。例如，在美国标准信息交换编码 (ASCII) 中，数字\
  \ `65` 代表字母 `A`。所以如果你输入\n\n```\nord(\" A \")\n```\n\n你将得到输出\n\n```\n65\n```\n\n\
  因为计算机无法理解字母，你必须将字符串转换为数字。你可以使用 `int` 或 `float` 来此。在需要将数字转换为字符串的情况下，你可以使用 `str`。\n\
  \n# 第 4 章：运算符\n\n操作数的值由运算符操作。Python 编程语言中使用了七种运算符。下面的表显示了这些运算符并对其功能进行了简要说明。\n\n\
  ## 算术运算符\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| 加法 (`+` ) | 相加值。 |\n| 减法 ( `-` ) |\
  \ 从上一个操作数减去第二个操作数。 |\n| 乘法 (`*` ) | 相乘值。 |\n| 除法 ( `/` ) | 将第一个操作数除以第二个操作数。 |\n\
  | 取模 (`%` ) | 将第一个操作数除以第二个操作数并返回余数 |\n| 幂 (`**` ) | 对运算符执行指数计算。 |\n| 整除(`//` ) |\
  \ 操作操作数但消除结果后的小数点。 |\n\n## 比较运算符或关系运算符\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| `==`\
  \ | 如果两个操作数相等。 |\n| `!=` | 如果两个操作数不相等。 |\n| `<>` | 如果两个操作数不相等。 |\n| `>` | 如果第一个操作数大于第二个操作数。\
  \ |\n| `<` | 如果第一个操作数小于第二个操作数。 |\n| `>=` | 如果第一个操作数大于或等于第二个操作数。 |\n| `<=` | 如果第一个操作数小于或等于第二个操作数。\
  \ |\n\n## 赋值运算符\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| `=` | 将右操作数赋值给左操作数。 |\n| `+=`\
  \ | 将右操作数加到左操作数并将结果分配给左操作数。 |\n| `-=` | 从左操作数减去右操作数并将结果分配给左操作数。 |\n| `*=` | 将左操作数与右操作数相乘并将结果分配给左操作数。\
  \ |\n| `/=` | 将左操作数除以右操作数并将结果分配给左操作数。 |\n| `%=` | 使用两个操作数求模并将结果分配给左操作数。 |\n| `**=`\
  \ | 对运算符执行指数计算并赋值给左操作数。 |\n| `//=` | 执行整除并赋值给左操作数。 |\n\n## 位运算符\n\n| 运算符 | 描述 |\n\
  | :--- | :--- |\n| `&` | 如果位在两个操作数中都存在。 |\n| `\\|` | 如果位在任一操作数中存在。 |\n| `^` | 如果位在一个操作数中存在但不在另一个中。\
  \ |\n| `~` | 翻转位。 |\n| `<<` | 根据右操作数分配的位数将左操作数的值向左移动。 |\n| `>>` | 根据右操作数分配的位数将左操作数的值向右移动。\
  \ |\n\n## 逻辑运算符\n\n| 运算符 | 描述 |\n| :--- | :--- |\n| `And` | 如果两个操作数都为真，则条件为真。 |\n\
  | `Or` | 如果一个操作数非零，则条件为真。 |\n| `Not` | 反转操作数的逻辑状态。 |\n\n## 成员运算符\n\n\n\n\n\n| 运算符\
  \ | 描述 |\n| :--- | :--- |\n| Is | 如果运算符两侧的变量指向同一个对象，则结果为真。否则，结果为假。 |\n| Not in |\
  \ 如果在特定序列中没有找到该变量，则结果为真。否则，结果为假。 |\n\n## 身份标识运算符\n\n| 运算符 | 描述 |\n| :--- | :---\
  \ |\n| Is | 如果运算符两侧的变量指向同一个对象，则结果为真。否则，结果为假。 |\n| Is not | 如果运算符两侧的变量指向同一个对象，则结果为假。否则，结果为真。\
