  \n记住，组成甜味奶昔的某些成分可能非常高热量（例如花生酱）。这就是为什么不要经常食用它们非常重要。如果你决定经常喝甜味奶昔，请选择低热量和低脂肪的成分。这将让你更有可能减肥，这也是这个奶昔计划的目的。好消息是，市上有许多美味低热量低脂肪的产品，所以你在享受甜味奶昔时，没有理由在口味上妥协。\n\
  \n# 第 7 章：提示与技巧\n\n开始一个新的饮食计划绝非容易，但不得不说，这个特定的计划可能是你遇到过的最简单的之一。在执行这个计划期间，完全没有理由感到饥饿。你摄取的果蔬菜中所含的纤维可能会让你感到饱腹。\n\
  \n如果你坚持这个计划，你将在两周内减轻最多 15 磅。此外，你会有更多的精力，皮肤也可能看起来更好。尽管这 14 天奶昔计划并不那么困难，但你可能需要一些提示和技巧来帮助你前进：\n\
  \n### 关于牛奶的说明\n如果你像我一样乳糖不耐受，你可能不想喝牛奶。好消息是，现在有很多替代品。改用豆奶、杏仁奶、椰子奶或米浆。\n\n### 水\n请确保在计划期间保持水分充足。你摄取的果蔬菜中所含的纤维可能会让你感到饱腹。\n\
  \n如果你坚持这个计划，你将在两周内减轻最多 15 磅。此外，你会有更多的精力，皮肤也可能看起来更好。尽管这 14 天奶昔计划并不那么困难，但你可能需要一些提示和技巧来帮助你前进：\n\
  \n### 运动\n你很可能在这个计划期间减肥，同时提高精力水平。但如果你在每天中加入运动，你会发现效果更有效。你不需要大量运动，事实上，为了达到减肥并不需要过度运动。只要知道，稍微运动有助于加速你正在寻找的减肥效果。\n\
  \n### 冷藏那些奶昔\n你应该尽快冷藏你的奶昔。我知道有些人人可能会带着它们去上班，它们在路途中可能会变温，但到达办公室后请将它们放入冰箱。\n\n如果你有任何剩余，也请冷藏，并尽量尽快食用。书中书中所有的奶昔都可以保持\
  \ 2 天的新鲜，但如果存放更久，它们可能会开始变质。\n\n### 记录你自己制作的奶昔\n虽然你可能乐意使用书中的食谱，但你可能也想过自己尝试。你能做的最好的事情之一，就是记录你自己制作的奶昔。你可能会发明出一个非常有营养且美味的食谱，如果你不把它下来就太可惜了。记录下来，以便日后再次享受。\n\
  \n### 起初的大量减肥\n每当任何人开始新的减肥或饮食计划时，他们往往会在短时间内减轻相当数量的体重。这是自然现象，但它是不可持续的。随着时间的推移，你减轻的体重不会像刚开始时那么多。你的减肥速度会减慢，但这并不意味着你不会继续减肥。\n\
  \n坚持这个计划，即使你看起来没有在继续减肥，因为它可能对你的身体很有好处。\n\n\n\n\n\n# 有些人喜欢多次执行这项 14 天奶昔计划。虽然这是一种有效且愉快的减重方式，但你可能希望在几周后回到常规饮食模式。我必须补充的是，在这几周里，如果你之前摄入了大量的脂肪、糖和盐，那么你可能想要吃健康的均衡饮食，而不是回到旧的饮食习惯。\n\
