  \n# 第 4 章：SQL 中的数据类型\n\n在 SQL 语言中，数据类型是任何对象的特征。所有列、变量和表达式都涉及数据类型。\n\n你在创建新表时应该指定数据类型。\n\
  \n这种计算机语言支持多种类型的数据。让我们将其分为六大类：\n\n1.  精确数值\n\nImages/image01822.jpeg)\n2.  近似数值\n\
  \nImages/image01823.jpeg)\n3.  时间与日期\n\n4.  字符字符串 – 这分为两个子类：\n    1.  Unicode 字符串\n\
  \nImages/image01824.jpeg)\n    2.  非 Unicode 字符串\n\nImages/image01825.jpeg)\n5.\
  \  二进制\n\nImages/image01826.jpeg)\n6.  杂项\n\n该类别涉及以下数据类型：\n\n*   `timestamp`– 此数据类型存储一个随行更新而变化的唯一数字。你可以在数据库的任何部分访问此唯一数字。\n\
  *   `xml`– 此数据类型存储 XML（即可扩展标记语言）信息。你可以在列或变量中存入 XML 数据。\n*   `table`– 此类型保存你的数据库查询结果，以便日后使用。\n\
  *   `cursor`– 此数据类型允许你对任何游标对象进行引用。\n*   `sql_variant`– 这可以存储所有 SQL 兼容数据类型的值，但 timestamp、text\
  \ 和 next 除外。\n*   `unique identifier`– 此数据类型可以存储 GUID（即全局唯一标识符）。\n\n# 第 5 章：SQL\
  \ 语言中的运算符\n\n运算符是你可用于 SQL 命令的保留字或字符。通常，运算符用于命令的 WHERE 部分，以执行操作（例如：比较、数学运算等）。\n\n\
  你可以使用运算符在 SQL 语句中指定条件。当你的命令涉及多个条件时，你可能可以使用运算符作为连接。\n\n本章将讨论 SQL 支持的四种运算符：\n\n* \
  \  逻辑运算符\n*   算术运算符\n*   比较运算符\n*   可以使条件失效的运算符\n\n逻辑运算符\n\n\n\n\n\n这些是你可以在 SQL\
  \ 计算机语言中使用的逻辑运算符：\n\n- `IN`: 你可以使用此运算符将值与你指定的字面量值进行比较。\n- `OR`: 该运算符在你的 SQL 命令的\
  \ `WHERE` 部分中组合各种条件。\n- `AND`: 该运算符允许你在 SQL 命令的 `WHERE` 子句中包含多个条件。\n- `ALL`: 该运算符将一个值与另一个值集内部的各个值进行比较。\n\
  - `ANY`: 该运算符使用一个条件来执行比较。\n- `LIKE`: 该运算符使用通配符运算符将值与相似的值进行比较。\n- `UNIQUE`: 该运算符检查你的条目的唯一性。为了实现这一点，`UNIQUE`\
  \ 运算符会扫描整个表并搜索冗余数据。\n- `EXISTS`: 该运算符搜索符合指定标准的行。 \n- `BETWEEN`: 该运算符搜索某个特定范围内的值。使用\
  \ `BETWEEN` 时，你应该指定最大值和最小值。\n- `IS NULL`: 该运算符将值与 `NULL` 值进行比较。\n\n# 算术运算符\n\n为了帮助你理解这些运算符，让我们使用两个示例变量：`x\
  \ = 1`；`y = 2`。\n\n- `+`: 你应该使用此运算符执行加法。例如，`x + y = 3`。\n- `-`: 你必须使用此运算符执行减法。它将从左操作数的值中减去右操作数的值。例如，`y\
  \ - x = 1`。\n- `*`: 在执行乘法时你应该使用此运算符。这里有一个例子：`x * y = 2`。\n- `/`: 在执行除法时你应该使用此运算符。例如，`y\
  \ / x = 2`。\n\n## 比较运算符\n\n假设 `x = 2` 且 `y = 4`。\n\n- `=`: 该运算符检查两个值的相等性。如果两个值相等，则条件为真。例如：`(x\
  \ = y)` 为假。\n- `!=`: 该运算符检查两个值的相等性。如果两个值不相等，则条件为真。例如：`(y != x)` 为真。\n- `<>`: 该运算符与\
  \ `!=` 相同。例如：`(x <> y)` 为真。\n- `>`: 该运算符检查左操作数的值是否大于右操作数的值。如果是，则条件为真。例如：`(y > x)`\
  \ 为真。\n- `<`: 该运算符检查左操作数的值是否小于右操作数的值。如果是，则条件为真。例如：`(x < y)` 为真。\n- `>=`: 该运算符检查左操作数的值是否大于或等于右操作数的值。如果是，则条件为真。例如：`(y\
  \ >= x)` 为真。\n- `<=`: 该运算符检查左操作数的值是否小于或等于右操作数的值。如果是，则条件为真。例如：`(x <= y)` 为真。\n\n\
  # 可以使条件失效的运算符\n\n- `NOT`: 该运算符可以反转你与之配合使用的逻辑运算符的功能。例如：`NOT IN`、`NOT EXISTS`、`NOT\
  \ BETWEEN` 等。\n\n# 第 6 章：SQL 表达式\n\n基本上，一个表达式是一组值、函数和运算符的组合。SQL 表达式可以帮助你评估数据库值。\n\
  \n在这个计算机语言中，表达式是一个你必须使用查询语言编写的公式。你也可以使用表达式来针对某些信息运行数据库查询。\n\n## 语法\n\n以下是 `SELECT`\
  \ 命令的格式：\n\n![](img/image01828.jpeg)\n\n现在，让我们来谈谈 SQL 支持的表达式：\n\n### 布尔表达式\n这些表达式通过匹配单个值来检索数据。以下是布尔表达式的基本语法：\n\
  \n![](img/image01829.jpeg)\n\n### 数值表达式\n你可以使用这些表达式在你的数据库查询中进行数学运算。以下是你应该使用的语法：\n\
  \n![](img/image01830.jpeg)\n\n### 日期表达式\n这些表达式为你提供系统的时间和日期信息。\n\n# 第 7 章：如何在你的数据库中使用\
  \ SQL\n\n本章将教你如何在你自己的数据库上应用 SQL 命令。通过阅读这些材料，你将能够使用 SQL 计算机语言与关系型数据库进行交互。这些材料极其重要，因为它将帮助你在短短\
  \ 2 周内掌握 SQL 的基础。\n\n## 如何创建数据库\n\n要创建一个新数据库，你应该使用 `CREATE DATABASE` 命令。以下是你应该遵循的语法：\n\
  \n![](img/image01831.jpeg)\n\n**注意：** 关系型数据库管理系统需要唯一的数据库名称。\n\n让我们使用 `CREATE DATABASE`\
  \ 命令生成一个新的数据库。\n\n```sql\nCREATE DATABASE sample;\n```\n\n上面的命令创建了一个名为“sample”的单元数据库。\n\
  \n**注意：** 如果你没有管理员权限，将无法创建一个新数据库。\n\n## 如何删除数据库\n\n在 SQL 语言中，你使用 `DROP DATABASE`\
  \ 命令来删除活动数据库。使用以下语法：\n\n```sql\nDROP DATABASE (插入你的数据库名称);\n```\n\n例如，假设你想删除一个名为“sample”的数据库。这是你需要使用的\
  \ SQL 命令：\n\n```sql\nDROP DATABASE sample;\n```\n\n**注意：** 使用此命令时你应该要非常小心。请记住，删除数据库涉及数据的永久丢失。\n\
  \n## 如何选择数据库\n\n如果你拥有多个数据库，你必须确保你正在正确的数据库上执行操作。你应该利用 `USE` 命令。分析以下语法：\n\n```sql\n\
  USE (插入数据库名称)\n```\n\n例如，要选择名为“sample”的数据库，请使用以下 SQL 命令：\n\n```sql\nUSE sample\n\
  ```\n\n## 如何创建表\n\n如果你正在创建一个新表，你应该为该表命名并定义它的列。你应该使用 `CREATE TABLE` 命令来完成此任务。以下是你应该遵循的语法：\n\
  \n![](img/image01832.jpeg)\n\n基本上，`CREATE TABLE` 是一个告知系统你想要创建一个新表的关键字。你的表标识符或名称跟在\
  \ `CREATE TABLE` 命令之后。然后，创建一个列表定义你想要使用的列和数据类型。\n\n## 如何从现有表创建新表\n\n你可以通过结合两个命令：`SELECT`\
  \ 和 `CREATE TABLE` 来复制现有表。\n\n默认情况下，你将获得的表将具有旧表的列定义。然而，你也可以从旧表中选择某些列并丢弃其他列。这意味着你可以根据需要修改新表。\n\
  \n如果你成功使用此命令，新表将获得旧表的值。以下是你应该使用的语法：\n\n![](img/image1833.jpeg)\n\n例如，你想使用名为 `EMPLOYEES`\
  \ 的表来生成一个新表（假设你称其为 `COMPENSATION`）。然后，你想复制 `EMPLOYEES` 表中的两个列：`NAME` 和 `SALARY`。为了完成此任务，你可以使用以下代码：\n\
  \n```sql\nCREATE TABLE COMPENSATION AS\nSELECT NAME, SALARY\nFROM EMPLOYEES;\n```\n\
  \n上面的代码创建一个名为 `COMPENSATION` 的新表，它包含 `NAME` 和 `SALARY` 两个列。此外，这些列将获得在旧表（即 `EMPLOYEES`）找到的值。\n\
  \n## 如何删除表\n\n你可以使用 `DROP TABLE` 命令来删除表及其包含的所有信息（例如：数据、约束、索引等）。\n\n**注意：** 使用此命令时你必须非常小心。请记住，这涉及存储信息的永久删除。如果你删除了错误的表，你的数据库将面临严重问题。\n\
  \n该命令的语法为：\n\n```sql\nDROP TABLE (在此处插入表名);\n```\n\n例如：\n\n```sql\nDROP TABLE sample\n\
  ```\n\n上面的命令从你的数据库中删除了名为“sample”的表。\n\n# 如何添加新数据行\n\n\n\n\n\n`INSERT INTO` 命令允许你向现有表添加新的数据行。该命令涉及两种语法：\n\
  \n### 第一种语法\n\n![](img/image01834.jpeg)\n\n如果你想向某些列添加数据，则应该使用这种语法。\n\n### 第二种语法\n\
  \n![](img/image01835.jpeg)\n\n如果你想为表的所有列添加值，则必须使用这种语法。这意味着你不需要标识你正在操作的列。但是，请确保值的顺序与表中现有列的顺序一致。\n\
  \n### 如何从表中检索数据\n\n你可能可以使用 `SELECT` 命令从表中检索数据。在这里，SQL 将将搜索结果以一个新表的形式呈现出来。这些新表被称为“结果集”。\n\
  \n`SELECT` 命令的语法为：\n\n![](img/image01836.jpeg)\n\n在此语法中，`column1`、`column2` 等是你想要检索的字段。如果你想检索表内部的所有字段，可以使用这种语法：\n\
  \n![](img/image01837.jpeg)\n\n### WHERE 子句\n\n`WHERE` 是一个一个 SQL 子句，用于在从所选表中检索信息时指定条件。\n\
  \n如果满足你指定的条件，该子句将从你的表中检索特定值。通常情况下，你应该使用 `WHERE` 来过滤并检索你需要的记录。\n\n你也可以在其他 SQL 命令（如\
  \ `DELETE` 和 `UPDATE`）中使用 `WHERE`。你将在以后学习这些命令。\n\n你应该使用的语法是：\n\n![](img/image01838.jpeg)\n\
  \n你可以使用逻辑运算符或比较运算符来为你的 `WHERE` 子句设置条件。\n\n### 如何组合各种条件\n\nSQL 允许你在数据库查询中组合不同的条件。你只需要在\
  \ SQL 命令中包含 `OR` 和 `AND` 运算符即可。SQL 用户将 `OR` 和 `AND` 称为连接操作符。\n\n基本上，连接操作符允许你在单条\
  \ SQL 命令中执行多次比较。让我们先讨论 OR：\n\n#### OR\n\n你可能可以使用此操作符在命令的 `WHERE` 子句中组合各种条件。该操作符的语法为：\n\
  \n![](img/image01839.jpeg)\n\n`N` 代表你可以使用 `OR` 组合的条件数量。只有在你指定的条件其中一个为真时，你的 SQL 语句才会执行执行操作。\n\
  \n#### AND\n\n此操作符允许你将几个条件放在 SQL 命令的 `WHERE` 子句中。你应该使用的语法如下：\n\n![](img/image01840.jpeg)\n\
  \n“N”代表你可以组合的条件数量。请记住，只有当所有条件都为真时，你的 SQL 命令才会执行操作\n\n### 如何修改现有记录\n\n在 SQL 语言中，你可以使用\
  \ `UPDATE` 查询编辑现有记录。该查询应用于 `WHERE` 子句，允许你编辑数据行。你应该使用的语法如下：\n\n![](img/image01841.jpeg)\n\
  \n### 如何删除记录\n\n如果你想删除记录，可能可以使用 SQL 的 `DELETE` 查询。你可以将此查询与 `SELECT` 结合以删除某些行。另一方面，你可以使用\
  \ `DELETE` 作为独立查询来删除所有数据行。该查询的语法如下：\n\n```\nDELETE FROM the_table’s_name\nWHERE\
  \ [specify you condition/s];\n```\n\n如果你需要从表中删除所有记录，只需删除 `WHERE` 子句。因此，语法将是：\n\n\
  ```\nDELETE FROM the_table’s_name;\n```\n\n### 如何通过通配符操作符进行比较\n\n在 SQL 中，你可以可以使用通配符操作符将一个值与相似的值进行比较。你只需要将这些操作符包含在\
  \ SQL 命令的 `LIKE` 子句中。以下你可以配合 `LIKE` 使用的通配符操作符：\n\n- 下划线（即 \"_\"）\n- 百分号（即 \"%\"\
  ）\n\n如果你想表示单个字符或数字，则应该使用下划线。相反，如果你想表示 0、1 或多个字符，则必须使用百分号。你可以在 SQL 语句中组合这些通配符操作符。\n\
  \n通配符操作符的语法如下：\n\n![](img/image01842.jpeg)\n\n### 如何使用 TOP 子句\n\n`TOP` 子句允许你从数据表中检索数量或百分比。\n\
  \n**注意：**某些数据库不兼容此子句。例如，MySQL 使用 `LIMIT` 来检索记录。\n\n带有 `TOP` 子句的 `SELECT` 命令语法为：\n\
  \n![](img/image01843.jpeg)\n\n### 如何对数据排序\n\nSQL 提供了 `ORDER BY` 子句，它根据你用作依据的列按降序或升序对数据进行排序。你应该使用的语法是：\n\
  \n![](img/image01844.jpeg)\n\n你可以在此子句中包含多个列。但是，请确保你想要使用的所有列都在列列表中。\n\n### 如何合并多个\
  \ SELECT 命令的结果\n\n在 SQL 中，你可以合并多个 `SELECT` 命令的结果并防止冗余行。你只需要使用 `UNION` 子句即可。\n\n\
  要使用此子句，你的 `SELECT` 语句应该具有相同数量的选取列和列表达式。语句必须具有相同的数据类型和列排列。然而，语句不需要完全相同。\n\n\n\n\n\
