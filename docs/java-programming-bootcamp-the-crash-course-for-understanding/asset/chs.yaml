  \n## 剩余肉类\n人数：1 份\n\n### 食料\n- 剩余肉类\n- 一小撮你喜欢的香料\n\n### 制作方法\n将剩余肉类切成薄片，放入碗中。撒上你喜欢的香料，即可享用。\n\
  \n## 奶士片\n人数：1 份\n\n### 食料\n- 200 克碎奶士\n\n### 制作方法\n切一些无蜡烘焙纸，大小与微波炉转盘相同。现在将纸放在转盘上，堆起一小堆奶士。\n\
