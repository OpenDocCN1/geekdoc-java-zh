  \n## 生姜茶香料调饮\n\n谁能想到将生姜茶与一些香料混合，会产生一种帮助你减肥并增强免疫系统的健康补剂？这种饮料在大餐后饮用非常好，在流感季节来临时它也有奇效。当你的身体受到攻击时，让它回到正轨的唯一方法就是让它摄入能承受的所有营养。医生的医嘱！\n\
