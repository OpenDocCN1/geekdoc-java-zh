  2. 制作酱料，将糖和果汁混合，直到果肉被压碎。倒入橄榄油和醋，用盐和胡椒调味。\n3. 沥干胡萝卜，淋上血橙混合液。碎上羊奶士，最后在顶部点缀水菜。\n\n\
  ### 4. 红扁豆汤\n\n**食材：**\n* `3 tablespoons` 橄榄油\n* `1 瓣` 大蒜，去皮\n* `1 个` 洋葱，去皮\n* 适量盐和胡椒\n\
  * `1 teaspoon` 孜然粉\n* `1 teaspoon` 香菜根粉\n* `150g` 红扁豆\n* `1 liter` 蔬菜汤\n* `½个` 柠檬的汁\n\
  * `2 tablespoons` 切碎的欧芹\n\n**做法：**\n1. 在一个只大汤锅中加热橄榄油。加入大蒜、洋葱并用盐和胡椒调味。烹炒 `8 minutes`\
  \ 直到洋葱呈微金黄色。\n2. 加入孜然粉、香菜根粉、扁豆和蔬菜汤。煮沸后煮 `12 minutes` 直到扁豆变软。\n3. 离火并挤入柠檬汁。撒上碎欧芹即可上菜。\n\
  \n### 5. 奶油酱汁芦笋水菜\n\n**食材：**\n* `1 瓣` 大蒜\n* `2 tablespoons` 苹果醋\n* `2 tablespoons`\
  \ 全谷芥末酱\n* `100ml` 酸奶油\n* `15 根` 芦笋\n* `2 束` 水菜\n* `1 个` 红洋葱，切丝\n\n**做法：**\n1. 将大蒜、苹果醋、芥末酱和酸奶油混合在一起。备用。\n\
  2. 与此同时，在一个较大的平底锅中加热油，加入芦笋翻炒 `8 minutes` 直到变软。\n3. 在大盘中摆好芦笋、水菜和洋葱丝。淋上酱汁。这道菜搭配面包食用更佳。\n\
  \n### 6. 红薯胡萝卜汤配腰果罗青酱\n\n**食材：**\n* `2 tablespoons` 橄榄油\n* `2 个` 中等红薯，去皮并切块\n* `5\
