  \n\n\n\n\n本电子书将教你 SQL 的基础知识，SQL 是一种用于关系型数据库的强大计算机语言。由于这是一本短书，它将侧重于 SQL 最重要的方面。它解释了该语言的基础、数据库系统的特性、你可以使用的命令，以及你可能应用于数据库的约束条件。基本上，你在这书中读到的所有内容设计都是为了帮助你在两周内学会\
