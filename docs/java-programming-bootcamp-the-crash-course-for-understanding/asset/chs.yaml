  \ [KindleBookSpot.com](http://kindlebookspot.com) 还有更多免费和超值优惠的书籍\n\n# 目录\n\n- 导言\n\
  - 第一章：多给我吃点！\n- 第二章：停下！……别吃那个\n- 第三章：早餐组合\n- 第四章：主菜\n- 第五章：超级零食\n- 结论\n\n# 导言\n\n\
  如果你正在寻找减少脂肪来减轻的方法，你可能听过`Ketogenic diet`。生酮饮食是一种低碳水饮食，含有高量的蛋白质和大量的脂肪。这种饮食之所以有效，是因为它强迫你的身体燃烧脂肪产生能量，而不是来自碳水化合物的`glucose`。这是一种一定要尝试的饮食，我保证它将帮助你实现目标，并在过程中感觉极佳。\n\
  \n`Ketogenic diet`的工作原理是强迫身体将脂肪转化为能量，而不是使用碳水化合物作为能量。这为你的器官提供了运作能量，而且对它们的健康非常有好处。\n\
  \n很多人一直担心，如果你的身体消耗过多的脂肪来产生能量，低碳水饮食会导致`glucose levels`水平不足。这实际上是错误的，并在许多针对低碳水饮食的人群的研究中得到了证明。重要的是要理解，尽管你的身体会将`glucose`转化为脂肪，但反之则不然。然而，你的身体可以使用你摄取的蛋白质并将其转化为`glucose`，而你的身体需要`glucose`。\n\
  \n生酮饮食的主要益处之一是它让你饱腹感持续很久，这是人们避免不同饮食的主要原因之一。此外，生酮饮食导致碳水化合物摄入减少，从而产生更大的减肥效果。这是因为低碳水饮食有助于消除体内多余的水，从而增加肾脏排出钠的速度。\n\
  \n第一章：多给我吃点！\n\n不同类别的食物构成了`Ketogenic Diet`的大部分。正确摄入这些食物分类对于获得生酮饮食的益处是非常重要的。\n\n\
  关于“净碳水化合物”\n\n随着“低碳”饮食在过去几年流行，许多健康专业人士提出的问题是：“碳水化合物什么时候不是碳水化合物？”\n\n食品制造商希望客户继续向他们购买产品，因此为了尝试向关注低碳的饮食者提供所有那些美味的含碳水食品，创造了一个新的碳水化合物类别。\n\
  \n\n\n\n食品制造商会调整标签，以突出产品中的“净碳水化合物”（net carbs），而这通常远低于食品实际标签上显示的数值。这里需要注意的是，任何 `FDA`\
  \ 批准的食品标签上的内容都经过了 `FDA` 的审查并许可，但制造商在法律上仍然允许在食品标签正面放置误导性信息。\n\n为了计算`净碳水化合物`，食品制造商会取碳水化合物的总数并减去纤维和糖醇。\n\
  \n答案很简单；这些碳水化合物被声称对血糖水平的影响很小。然而，一些医生警告说，并不是所有的纤维和糖醇都是这样起作用的。事实上，某些糖醇除了具有导泻作用并为本已经在控制的饮食增加热量外，尽管包装上是如此称，它们确实会升高血糖水平。\n\
  \n# 脂肪与油脂\n\n多年来人们对脂肪一直存在误解，人们甚至付出了极端努力来完全避免脂肪。然而，生酮饮食的重点是为身体提供脂肪以供分解产生能量。\n\n正因如此，这种饮食非常强调脂肪和油脂的摄入，以为身体提供这种燃料来源。同样重要的是，脂肪有不同的类型；有些是有益的，而另一些可能会产生健康风险。\n\
  \n### 饱和脂肪\n\n饱和脂肪使你的免疫力保持在最佳水平，骨密度正常，并控制睾酮水平。长期以来，这类脂肪被归类为不应经常摄入的坏的“反式脂肪”之一。然而，研究表明它们对我们的健康非常必要；事实上，它们对身体的整体健康没有风险。\n\
  \n含有此类脂肪的食物包括肉类、鸡蛋和黄油，它们有助于改善`HDL/LDL`胆固醇水平。\n\n### 多不饱和脂肪\n\n多不饱和脂肪经过高度加工，对你的健康有害。研究表明，大多数心脏病疾病的病源是液体植物油和反式脂肪。例如，我们涂在面包上的大多数人造黄油含有这些加工植物油，因此限制其摄入可能是一个好主意。\n\
  \n人们不应将天然不饱和脂肪和加工的不饱和脂肪混淆。天然不饱和脂肪主要发现于脂肪性鱼类中，有助于改善`HDL/LDL`胆固醇水平。另一方面，加工的不饱和脂肪会恶化`HDL/LDL`胆固醇水平，因此会对你的健康构造成风险。\n\
  \n### 单不饱和脂肪\n\n橄榄油和葵花油是此类别的的一些例子。这种脂肪已被广泛接受为健康的。研究表明，它们会导致更好的胰岛素抵抗水平和更好的`HDL/LDL`胆固醇水平，这对我们的整体健康有益。\n\
  \n### 反式脂肪\n\n反式脂肪不属于脂肪油脂范畴，但值得提及，因为这些脂肪是化学修饰产生的。脂肪通过氢化过程来提高保质期，在这个过程中调整了脂肪分子中氢原子的位置。这已被证明对我们的身体非常有害。它可能导致`HDL/LDL`胆固醇水平升高，可能对你的健康造成巨大危险。\n\
  \n# 胆固醇与脂肪\n\n胆固醇是存在于大多数人体组织中的化合物。它是细胞膜非常重要的组成部分；这些脂肪在你的血液中不断移动，当胆固醇颗粒相互碰撞并在主要动脉中形成肿块时，危险就产生了。这可能导致称为动脉粥样硬化的疾病，即动脉阻塞，这可能导致心脏发作等严重的健康风险。\n\
  \n除了脂肪之外，`HDL`、`LDL`和甘油三酯也是身体的重要组成部分。\n\n### HDL\n\n这些是高密度脂蛋白。它们通常被称为“好胆固醇”，负责将胆固醇从身体组织转移到肝脏进行分解。它们还通过从身体组织中去除不需要的胆固醇并减少血液中`LDL`的量，降低血管阻塞和心脏病的风险。\n\
  \n### LDL\n\n这些是低密度脂蛋白。这是坏的胆固醇。`LDL`从肝脏获取加工的胆固醇并将其转移身体组织，增加血液中胆固醇的量以及患动脉硬化和心脏病的概率。\n\
  \n### 甘油三酯\n\n当人食用脂肪食物时，脂肪会被消化并吸收到组织中。在组织中，脂肪以甘油三酯的形式存在，便于在组织和血液之间运输。\n\n较低的`LDL`计数减少了胆固醇颗粒相互碰撞的机会，并将减少阻塞的风险。高甘油三酯水平可能需要增加`LDL`以便运输；这可能会增加聚集的风险并增加患心脏病的几。\n\
  \n对于生酮饮食，你应该食用富含欧米 3 脂肪油，如三文鱼、金枪鱼和鳟鱼（仅举例）。此外，摄入饱和脂肪和单不饱和脂肪，如黄油、麦果仁、牛油果、蛋黄和椰子油。这些是优选，因为它们具有稳定的化学结构，对身体的炎症性较小。\n\
  \n你应该努力减少反式脂肪的摄入。这意味着避免使用氢化脂肪，因为它们含有高浓度的反式脂肪，对健康有害。简而言之，如果你喜欢炸炸，请选择非氢化的选项，如酥油（ghee）和椰子油。这确保了这些油的氧化降至最低，这意味着你将获得必需油而没有反式脂肪。\n\
  \n小心引起炎症的欧米 6 脂肪油。这可能需要观察任何坚果类或种子类产品的摄入。以下是生酮饮食食物列表，它们是脂肪和油脂极极来源，以后不会给你带来问题：\n\n\
  - 牛油果\n- 黄油\n- 椰子油\n- 橄榄油\n- 鸡油\n- 花生酱\n- 非氢化猪油\n\n# 蛋白质\n\n蛋白质负责修复磨损细胞以及整体生长。我们的许多组织大部分是蛋白质；从皮肤到头发和指甲都是。蛋白质有助于血液中激素的产生和调节，这些激素控制各种身体功能。\n\
  \n对于生酮饮食，蛋白质摄入应该是充足的。它应该足以满足蛋白质需求，然而，你应该避免大量摄入蛋白质，因为这可能导致身体分解蛋白质产生能量。这意味着身体将分解自身的组织，并在过程中消耗自身。\n\
  \n生酮饮食有多种蛋白质来源，包括：\n\n- 各种鱼类。\n\n### 白肉与红肉\n\n其他来源包括贝壳类，如生蚝、龙虾和蟹。全蛋、培根和香肠也是很好的蛋白质来源。\n\
  \n#蔬菜\n\n蔬菜在生酮饮食中极其重要。它们是维生素的重要来源，用于产生和维持健康的免疫系统以对抗疾病。选择任何生长在地面上的蔬菜。然而，某些蔬菜含有糖分，不应在生酮饮食中使用。对于这种饮食最好的蔬菜类型是营养丰富、碳水化合物低且通常是深色叶子的。它们包括菠菜和羽甘蓝或任何类似的蔬菜。以下可以作为生酮饮食的良好蔬菜：\n\
  \n- 菠菜\n- 西兰花\n- 豆角\n- 黄瓜\n- 蘑菇\n- 圆叶菜\n- 腌菜\n- 菜花\n- 芦笋\n\n此外，洋葱、西红柿和大蒜可以包含在生酮饮食中。\n\
  \n## 乳制品\n\n\n\n\n\n低碳饮食中还应该包含全脂乳制品。这些包括重奶油、硬奶酪和软奶酪、酸奶油和乡村奶油干奶酪。\n\n## 饮品\n\n采用生酮饮食的影响之一是你会变得非常脱水，因此除了咖啡和茶等液体外，摄入充足的水至关重要。注意不要喝任何含糖的液体，因为这些会破坏你的饮食计划；远离含糖饮料是上策。如果你想吃甜食，使用液体人工甜味剂也是可以的。甜味剂示例包括：\n\
  \n- 甜甜菊\n- 三麦糖醇\n- 赤藓醇\n- 木糖醇\n- 罗汉果\n\n## 香料\n\n非常注意你在食物中使用的香料。某些香料的碳化合物含量很高，因为它们大多与糖预混合；即使是普通的食盐通常也混合了粉糖糖，因此许多人考虑使用海盐。\n\
  \n以下是适合低碳饮食的香料列表：\n\n- 海盐\n- 黑胡椒\n- 肉肉桂\n- 辣椒粉\n- 姜黄\n- 欧芹\n- 迷迭香\n- 鼠鼠草\n\n## 第二章：停！…别吃那个\n\
  \n在生酮饮食中你应该避免的食物到底是什么？以下可以作为一个通用列表：\n\n- **糖**：避免任何含有红糖、甘蔗糖、玉米糖、蜂蜜或蔗糖的东西。此外，避免水果，因为大多数水果含有高水平的果糖和蔗糖。简而言之，如果它是“甜的”，就吃。\n\
  - **谷物**：包括小麦、米、高粱、大麦以及由这些谷物制成的产品如小麦粉、面条、煎饼、饼干和蛋糕。\n- **玉米**：避免玉米饼、玉米片、爆米花和玉米粉。玉米可以作为其他产品的增稠剂或防腐剂，所以记得阅读标签。\n\
  - **淀粉**：避免土豆、红薯和山药。这也适用于它们的制品，如薯片、薯条和炸薯块。\n- **包装加工食品**：这些食品大多数都含有大量小麦和糖，碳化合物含量高。此外，避免罐装汤和炖菜，因为它们大多数含有隐藏的淀粉增稠剂。\n\
  - **水果**：任何种类的水果果糖含量都很高。浆果的碳化合物最低；因此，如果你想在饮食中加入水果，一两颗浆果并无害。\n- **豆类**：包括淀粉含量极高的豆类、花生和扁扁豆。\n\
  - **啤酒**：啤酒是谷物产品，碳化合物含量高。如果你必须喝酒，请饮低碳啤酒。\n- **非饮食汽水**：甜味汽水含有大量果糖和玉米糖，含有你应该避免的大量碳化合物。\n\
  - **牛奶**：尤其是脱脂牛奶，因为它含有一种名为乳糖的糖。酸奶等发酵乳制品乳糖较少，因为发酵细菌会消耗所有的乳糖。如果你必须摄乳制品，请选择发酵制品。\n\n\
  如果你计划开始生酮饮食，你应该计划做出牺牲，特别是如果你是一个美食爱好者。减少糖分摄入并避免淀粉食物将对饮食的成功大有帮助。\n\n## 第三章：早餐组合\n\n\
  ### 炒蛋\n\n### 材料\n- 1 汤匙无盐油\n- 2 个大鸡蛋\n- 一小撮盐和现磨黑胡椒\n\n### 制作方法\n1. 用叉子打散鸡蛋。\n2.\
  \ 使用煎锅，低火融化黄油。\n3. 加入鸡蛋混合物。\n4. 用柔性铲子轻轻将鸡蛋推向锅中心，让水分从边缘流出。用铲子移动鸡蛋的同时让它们煮熟，直到鸡蛋定型。这可能需要\
  \ 2 到 3 分钟。\n5. 用盐和黑胡椒调味；热食用。\n\n### 花椰菜华夫\n\n### 材料\n- 2 个鸡蛋\n- 1/4 杯马苏里拉奶士\n-\
  \ 1/4 杯切达奶士\n- 1 杯 粗磨花椰菜\n- 1 1/2 汤匙切碎的新鲜细葱\n- 1/2 茶匙大蒜粉\n- 1/4 茶匙洋葱粉\n- 辣椒片\n-\
  \ 海盐\n- 现磨黑胡椒\n\n### 做法\n1. 将花椰菜和奶士放入食物机中。脉冲至彻底混合。\n2. 加入鸡蛋、细葱、大蒜粉和洋葱粉，以及各少许辣椒片、盐和黑胡椒。加工至混合。\n\
  3. 将混合物倒入华夫饼机中，煮至理想的脆度。\n4. 将华夫饼放在盘子里，顶部点上酸奶、奶油奶士和/或碎培根。\n\n### 猪肉贝果圈\n\n### 材料\n\
  - 3 个洋葱，切碎\n- 4 磅有机肉末瘦猪肉\n- 2 汤匙黄油或培根油\n- 1 1/2 杯番茄酱，不加糖\n- 3 个大鸡蛋\n- 2 茶匙海盐\n-\
  \ 2 茶匙红椒粉\n- 1 茶匙现磨黑胡椒\n\n### 做法\n1. 将烤箱设为 400 华氏度预热。使用烘焙纸衬好 1 或 2 个烘烤盘。\n2. 将不粘煎锅置于中火，融化黄油或加热培根油。拌洋葱并炒至透明。离火并置在一旁冷却至室温。\n\
  3. 在碗中，将猪肉末、番茄酱、鸡蛋、盐、黑胡椒、红椒粉和炒过的洋葱混合。\n4. 将混合物分成 12 个球，然后按压每个球的中间并压平，使其像贝果圈。\n5.\
  \ 将猪肉贝果圈放在准备好的烘烤盘中，烘烤 40 分钟，或直到变硬。\n6. 将烘烤盘放在铁丝架上稍稍冷却。热吃味道最好。\n\n### 西兰花奶酪汤\n\n\
  ### 材料\n- 2 杯 西兰花朵\n- 2 杯水\n- 1/2 杯 软化的奶油奶士\n- 1/2 杯 鸡汤\n- 1/4 杯重奶油\n- 1 茶匙盐\n-\
  \ 1 杯 切达奶士\n\n### 做法\n1. 蒸西兰花朵直到变软。\n2. 在搅拌机中，将奶油奶士、鸡汤和水混合。搅拌至形成光滑的混合物。\n3. 将此混合物倒入大汤锅，然后加入剩下的西兰花。煮沸。\n\
  4. 汤锅加热后，加入切达奶士，然后搅拌至融化。\n\n### 粥粥\n\n### 材料\n- 1 1/2 汤匙 碎碧根果\n- 1 汤匙 亚麻籽粉\n- 1\
  \ 1/2 汤匙 椰丝\n- 1/3 杯沸水\n- 一小撮盐\n- 适量甜味剂（根据口味）\n- 2 汤匙 重奶油\n- 少许肉桂（可选）\n\n### 做法\n\
  1. 将亚麻籽粉、椰丝和碧根果放入碗中，加入盐。\n2. 加入沸水，搅拌至融合。\n3. 静置一两分钟，然后加入甜味剂和奶油。\n\n### 奇亚籽酸奶杯\n\n\
  ### 材料\n- 2 杯 全脂酸奶\n- 4 汤匙 奇亚籽\n- 1/2 茶匙 肉桂\n- 1/2 杯 无糖杏仁奶\n- 4 汤匙 杏仁\n\n### 做法\n\
  1. 在碗中将杏仁奶、奇亚籽和酸奶混合。\n2. 将一层混合物倒入两个杯中，每个杯加入一半的杏仁和肉桂。重复直到每个杯有 3 层。\n3. 将杯子放入冰箱冷藏\
  \ 12 分钟以浓稠。冷吃。\n\n### 早餐砂锅\n\n### 材料\n- 4 个鸡蛋\n- 1/2 磅 香肠\n- 1/2 杯 奶酪状切达奶士\n- 1\
  \ 杯 重奶油\n- 1/2 头 花椰菜，切碎\n- 1/2 茶匙 干芥末\n- 1/2 茶匙 海盐\n\n### 做法\n1. 将烤箱设为 350 华氏度预热。在砂锅上喷上不粘喷油。\n\
  2. 将不粘锅置于中火，煎香肠直到褐色并碎。保留剩余脂肪用于其他食谱。\n3. 将香肠刮入碗中，加入切碎的花椰菜、重奶油、奶士、盐和芥末。\n4. 在另一个碗中打蛋鸡蛋，然后拌入香肠混合物中。\n\
  5. 将混合物倒入准备好的砂锅中。烘烤 25 分钟，或直到呈金黄色。\n\n## 第四章：主菜\n\n### 奶酪鸡块\n\n### 材料\n- 4 个鸡胸肉，自由饲养\n\
  - 2 杯 马苏里拉奶士\n- 2 汤匙 猪皮\n- 2 茶匙 干牛里香，分用\n\n\n\n\n\n# 炸鸡块\n\n### 配料\n- 1/2 杯 亚麻籽粉\n\
  - 1 杯 帕玛森芝士\n- 1 茶匙 海盐\n- 1 茶匙 现磨黑胡椒\n- 1/2 茶匙 辣椒碎\n- 1/2 汤 大蒜粉\n- 3 茶匙 红椒粉\n- 2\
  \ 个大鸡蛋\n- 3 茶匙 鸡汤\n- 1 杯 橄榄油，分用\n- 2 杯无糖番茄酱\n- 1 茶匙 蒜泥末\n\n### 制作方法\n- 在食物加工机或高功率搅拌机中，将猪皮、`flaxseed\
  \ meal`、`parmes cheese`、2 汤匙牛至草、`salt`、`pepper`、辣椒碎、大蒜粉和红椒粉混合。加工至完全混合，然后转移到碗中。\n\
  - 使用肉质质器将鸡胸肉肉至约 1/2 英寸厚。在两面撒上 `salt` 和 `pepper` 调味，然后切成一口大小的块备用。\n- 在碗中打蛋鸡蛋，然后搅拌入\
  \ `chicken broth`。备用。\n- 将烤箱预热至 `400 degrees F`。在砂锅上喷上不粘烹饪喷剂。\n- 将平锅置于中低火上，加入 1/2\
  \ 杯 `olive oil`、番茄酱、蒜泥和剩下的牛至草。偶尔搅拌，烹煮 15 分钟。\n- 将每块鸡胸肉浸入蛋液中，然后裹上芝士混合物。\n- 在重底平底锅中，用中低火加热剩余的\
  \ `olive oil`。将鸡肉块煎至金黄色色。放在纸巾上沥干油分。\n- 将炸鸡块放入砂锅中，在顶部淋上酱。在所有食材上撒上马苏里拉芝士，然后烘烤 10 分钟，直到芝士融化。热享即可。\n\
  \n# 焦香三鱼与青豆角\n\n### 配料\n- 2 片 阿斯加鲑鱼排，每片 6 盎司\n- 2 汤匙 椰子油\n- 2 汤匙 脏根芥末末，分用\n- 1/2\
  \ 汤匙 辣椒粉\n- 1/2 汤匙 甜菊醇\n- 1/2 茶匙 现磨黑胡椒\n- 1/4 茶匙 干芥末\n- 1/4 茶匙 孜然\n- 1/4 茶匙 红椒粉\n\
  - 1/4 茶匙 海盐\n- 肉桂\n\n### 豆角配\n- 1 1/2 汤匙 黄油\n- 2 瓣大蒜，切末\n- 1/2 汤匙 橄榄油\n- 1/2 磅 青豆角\n\
  - 1/4 茶匙 海盐\n- 一小撮 现磨黑胡椒\n\n### 制作方法\n- 将 `chilli powder`、`cumin`、`salt`、`paprika`、stevia、`black\
  \ pepper` 和干芥末在碗中混合。加入少许 `cinnamon` 并拌匀。备用。\n- 将不粘平锅置于中火上，加热 `coconut oil` 至少 3\
  \ 分钟。\n- 此同时，在每片鲑鱼排的两面涂上 `Dijon mustard`，然后在两面都压上 `chilli rub`。\n- 将火调至中大火，在平锅中煎鲑鱼\
  \ 2 分钟，然后翻面。将火调至中火，烹煮 8 分钟，直到鱼肉可以 easily 松分开。\n- 此同时，将另一个平锅置于中火上，融化 `butter` 和 `olive\
  \ oil`。炒香 `garlic` 1 分钟，然后拌入 `green beans` 并用 `salt` 和 `pepper` 调味。火调至中低火，盖上锅盖烹煮\
  \ 8 分钟。偶尔搅拌以防焦。\n- 将鲑鱼摆放在盘子里，将青豆角放在一侧。立即上菜。\n\n# 鸡肉沙拉\n\n### 配料\n- 2 杯 婴儿菠菜\n- 1/2\
  \ 个 牛油果\n- 1/2 块鸡胸肉\n- 1 汤匙 辣椒酱 (Peri Peri Sauce)\n- 1 片 低钠培根\n\n### 制作方法\n- 将锅加热至中火，烹煮\
  \ `bacon` 直至变褐且酥脆。\n- 烹煮时将鸡胸肉切成等份。将鸡胸肉片放入 `bacon fat` 中，单面煎 1 分钟，然后翻面另一面煎约 5 分钟。在\
  \ 5 分钟结束前，将 `avocado` 和 `bacon` 切成小块。\n- 将 `avocado` 和 `spinach` 放入大碗中，然后加入 `peri\
