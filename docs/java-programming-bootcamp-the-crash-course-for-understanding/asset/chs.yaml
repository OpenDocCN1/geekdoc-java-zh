  - 1 杯切丝的卷心菜\n- 3 汤青汁\n- 半杯切碎的香菜\n- 1 颗牛油果，切薄片\n- 少许盐和胡椒\n- 玉米卷饼\n- 4 到 5 汤无脂酸奶\n\
