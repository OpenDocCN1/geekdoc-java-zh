  \n\n\n\n你需要一台至少配备 Intel Core2Duo 处理器的计算机，并至少拥有 1GB 内存。这些实际上是你今天能买到的大多数电脑中最基础、甚至更低）配置。如果你可以在你的电脑上玩视频游戏，那么它的性能完全足够用于\
  \ Java 编程。\n\n你的操作系统（OS）应该是 Windows XP、Windows 7、Windows 8 或 Linux。本书为上述平台提供了设置路径，尽管我们建议使用提供的链接进行在线编码，以便你立即开始。\n\
  \n如果你选择在计算机上安装 Java，则需要选择 `Java JDK8`。\n\n你还需要获取微软记事本（Notepad）或其他文本编辑器。\n\n## 本地环境\n\
  \n如果你想为你的 Java 编程创建一个本地环境设置，你需要前往此[链接](http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-2133151.html)\
  \ 免费下载 Java，确保选择与你的操作系统兼容的版本。\n\n在为你的操作系统选择了正确的 Java 后，按照指令正确下载 Java 并运行 `.exe`\
  \ 文件，这将允许你在计算机上安装 Java。安装完成后，你需要为特定平台设置路径。\n\n### Windows 路径\n\n假设你已成功在计算机上安装了 Java，当你查看目录时，它看起来如下：\n\
  \n```\nc:\\Program Files\\java\\jdk\n```\n\n将光标指向“我的电脑”并点击它。打开后，右键点击它并选择“属性”（位于选项底部）。\n\
  \n在“高级”选项卡下，你会看到一个名为“环境变量”的按钮，你需要点击它。\n\n接下来你需要修改 `Path` 变量。它需要包含 `Java.exe` 的路径。如果你当前的路径设置为：\n\
  \n`C:\\WINDOWS\\SYSTEM32`，你需要将路径更改为：\n\n`C:\\WINDOWS\\SYSTEM32;c:\\Program Files\\\
  java\\jdk\\bin`\n\n### Linux, UNIX, Solaris, FreeBSD 路径\n\n你需要设置环境变量 `PATH` 以正确指向\
  \ Java 二进制文件安装的位置。如果在设置路径时遇到困难，可以参考你的 shell 文档。\n\n例如，如果你使用 `bash`，你需要添加 `export\
  \ PATH=/path/to/java: $PATH`，它看起来如下：\n\n```\n.bashrc: export PATH=/path/to/java:$PATH\n\
  ```\n\n## 流行的 Java 编辑器\n\n过去的编程语言不需要文本编辑器，与大多数现代编程语言不同，但 Java 编程需要使用文本编辑器。有几个复杂的\
  \ IDE（集成开发环境）可以用于你的 Java 编程。IDE 是一种程序员可以使用的、为软件创建或开发提供全面设施的软件应用程序。IDE 通常由构建自动化工具、调试器和文本编辑器组成。\n\
  \n以下是一些你可以使用的流行文本编辑器：\n\n1. 记事本（Notepad）——如果你的电脑运行在 Windows 上，你可以使用内置的记事本编辑器编写代码。\n\
  2. Netbeans - 实际上你可以从此[链接](http://www.netbeans.org/index.html) 免费下载的 Java IDE。\n\
  3. Eclipse - 是另一个由 eclipse 开源社区创建的 Java IDE。你可以从此[链接](http://www.eclipse.org/) 免费下载。\n\
  \n一旦你一切准备就绪，我们就可以开始学习 Java 编程的基础知识，这将帮助你更接近实现独立创建 Java 程序的目标。\n\n## 第 2 章：“Hello\
  \ Java”，初次接触\n\n“Hello”程序是编程初学者学习的第一课，出于许多种原因。该程序向你介绍了开始编写程序时首要需要做的几件事，以及你需要学习和使用的一些语法。\n\
  \n为了保持统一，我们将使用在线编码（之前已提供链接）作为示例。稍后你可以使用自己的 `Java.exe`。实际在线 Java 控制台会显示不同的字体颜色。只有当某个命令或字符/符号需要详细说明时，我们才会在示例中使用不同颜色的字体。\n\
  \n### Hello Java 基础语法\n\n查看下面的示例程序，我们将逐行进行分析：\n\n| 1 | `public class FirstProgram\
  \ {` |\n| :--- | :--- |\n| 2 | |\n| 3 | `/* 这是第一个示例.` |\n| 4 | `* 我们将打印 'Hello Java'\
  \ 作为输出` |\n| 5 | `*/` |\n| 6 | |\n| 7 | `public static void main(String []args)\
  \ {` |\n| 8 | `System.out.println(\"Hello Java\"); // prints Hello Java` |\n| 9\
  \ | `}` |\n| 10 | `}` |\n\n顺便提一下，注意 `Hello` 和 `hello` 是不同的（大小写敏感）。第一行以 `public class`\
  \ 开头。标识符 `FirstProgram` 应该大写。第七行包含方法名，所有方法名都应该用小写字母。`.println` 是告诉程序打印括号内内容的命令。命令末尾应该有一个分号（`;`）。`//`\
  \ 符号是另一种注释，当你只需要进行单行注释时就使用该符号。确保每个起始括号都有对应的结束括号。在示例中，第 1 行的起始括号在第 10 行有结束括号。第 7\
  \ 行的起始括号在第 9 行有结束括号。\n\n这里另一个：\n\n| 1 | `public class FirstName {` |\n| :--- | :---\
  \ |\n| 2 | `  public static void main(String []args) {` |\n| 3 | `    System.out.println(\"\
  Erika\");` |\n| 4 | `  }` |\n| 5 | `}` |\n\n它将产生如下结果：\n\n| Erika |\n\n\n\n\n在本章中，你将学习你将处理的不同数据类型，以及如何给变量赋值。你还将学习不应该用作变量名的保留字。\n\
  \n## 整数 (int)\n\n整数可以是正数或负数。零也被认为是一个整数。\n\n在 Java 编程中，`int` 是 integer 的缩写，你稍后就会知道它的用法。如果你想打印整数，不需要将其括在引号中。\n\
  \n看下这个程序：\n\n```java\npublic class IntPrinting {\n    public static void main(String\
  \ []args) {\n        System.out.println(10);\n    }\n}\n```\n\n它将产生以下结果：\n\n```\n\
  10\n```\n\n`int` 数据类型只能接受 -2,147,483,648 到 2,147,483,647 之间的值。\n\n只要你遵循像示例中的正确语法，你放在\
  \ `System.out.println();` 括号内的任何数字都会被打印。\n\n## 布尔值 (true 或 false)\n\n布尔数据类型只能是 true（真）或\
  \ false（假）。它不会产生任何其他答案。你不需要将其放在引号中，因为程序将 true 和 false 识别布尔类型的合法值。\n\n看这个示例程序：\n\n\
  ```java\npublic class BooleanPrinting {\n    public static void main(String []args)\
  \ {\n        System.out.println(true);\n    }\n}\n```\n\n它将产生以下结果：\n\n```\nTrue\n\
  ```\n\n尝试将括号内的 true 替换为 ‘me’，如下：\n\n```java\npublic class BooleanPrinting {\n  \
  \  public static void main(String []args) {\n        System.out.println(me);\n \
  \   }\n}\n```\n\n它将产生以下结果：\n\n```\n/tmp/java_FlX6ZW/BooleanPrinting.java:3: error:\
  \ cannot find symbol\n       System.out.println(me);\n                         \
  \   ^\n  symbol:   variable me\n  location: class BooleanPrinting\n1 error\n```\n\
  \n它不识别‘me’这个词因为它因为它字符串。打印字符串时，你需要将其写在引号内。\n\n## 字符 (char)\n\n字符或 char 数据类型表示单个字符。所有值必须括在单引号中；否则你将得到错误信息。\n\
  \n看下方的示例：\n\n```java\npublic class BooleanPrinting {\n    public static void main(String\
  \ []args) {\n        System.out.println('r');\n    }\n}\n```\n\n它将给出这个结果：\n\n```\n\
  r\n```\n\n`int`、`boolean` 和 `char` 是 Java 的基本类型。你还会遇到更多它们。\n\n## 使用变量\n\n在 Java\
  \ 编程中，你可以为变量存储值，其他语言也具有这种功能。在 Java 中使用变量时，你需要指定数据类型。以下是你不应该作为变量使用的 Java 保留字列表：\n\
  \n| abstract | assert | boolean | break | long |\n| byte | case | catch | char |\
  \ private |\n| class | const | continue | default | short |\n| do | double | else\
  \ | enum | switch |\n| extends | final | finally | float | native |\n| for | goto\
  \ | if | implements | new |\n| import | instanceof | int | interface | package |\n\
  | transient | protected | return | super |\n| synchronized | static | strictfp |\
  \ throws | this |\n| volatile | while | try | throw | void |\n\n记住你不应该以大写字母开头你的变量，尽管你可以像这样使用变量名：\n\
  \n`int myFavoriteNumber = 10;`\n\n你需要在开头写 `int` 来识别数据类型，`myFavoriteNumber` 是变量名，而\
  \ `10` 是赋值给它的值。自己尝试一下：\n\n1. `int mySampleNumber` 必须等于 6。\n2. `boolean mySampleAnswer`\
  \ 必须等于 true。\n3. `char mySampleLetter` 必须等于 L。\n\n按照指令要求给每个变量分配对应的值。当你运行程序时，你不会看到这些值。如果你想打印这些值，你需要在程序中添加\
  \ `System.out.println()`，确保写的是正确的，并且它应该是变量的真实值。仅此一次，你需要在你的程序中添加这些行：\n\n```java\n\
  System.out.println(mySampleNumber);\nSystem.out.println(mySampleAnswer);\nSystem.out.println(mySampleLetter);\n\
  ```\n\n你将得到此输出：\n\n```\n6\ntrue\nL\n```\n\n现在你准备好了迎接更具挑战性但也更有成就感的课程了。\n\n## 第 4\
  \ 章：实用表格，随手备用\n\n本章包含了你需要随手准备的不同表格，因为它们可以作为你学习 Java 时的快速参考。如果你能快速记住它们，那就好得多。\n\n\
  ### Java 数值运算符\n\n大多数编程语言对它们的数值运算符使用相同的符号。如果你已经熟悉了某种现代语言，那么你会发现 Java 的数值运算符符号大部分与你熟悉的编程语言的符号是相同的。\n\
  \n| 符号 | 运算符 | 示例 |\n| :--- | :--- | :--- |\n| + | 加法 | 8 + 7 |\n| - | 减法 | 26 -\
  \ 9 |\n| * | 乘法 | 9*5 |\n| / | 除法 | 81/3 |\n| % | 余数 | 23%3 |\n\n### Java 比较运算符（称为关系运算符）\n\
  \n如果你熟悉其他现代语言的比较运算符，那么记忆下面的表很容易。\n\n| 运算符 | 符号 |\n| :--- | :--- |\n| 小于 | < |\n\
  | 小于等于 | <= |\n| 大于 | > |\n| 大于等于 | >= |\n| 等于 | == |\n| 不等于 | != |\n\n### 布尔逻辑运算符\n\
  \n布尔逻辑运算符与比较运算符不同，使用它们时要小心。\n\n| 运算符 | 符号 |\n| :--- | :--- |\n| 非 | ! |\n| 与 | &&\
  \ |\n| 或 | || |\n| 异或 | ^ |\n\n### 不同的真值表\n\n#### “非”的真值表\n| A | !A |\n| :--- |\
  \ :--- |\n| False | True |\n| True | False |\n\n#### “与”的真值表\n| E1 | E2 | E1 &&\
  \ E2 |\n| :--- | :--- | :--- |\n| False | False | False |\n| False | True | False\
  \ |\n| True | False | False |\n| True | True | True |\n\n*E1 表示表达式 1，E2 表示表达式 2，其余表格也是如此。*\n\
  \n#### “或”的真值表\n| E1 | E2 | E1 || E2 |\n| :--- | :--- | :--- |\n| False | False\
  \ | False |\n| False | True | True |\n| True | False | True |\n| True | True | True\
  \ |\n\n#### “异或”的真值表\n| E1 | E2 | E1 ^ E2 |\n| :--- | :--- | :--- |\n| False | False\
  \ | False |\n| False | True | True |\n| True | False | True |\n| True | True | False\
  \ |\n\n\n\n\n是时候用 Java 的方式来学习数学了。你可以进行加、减、乘、除并获取余数。这并不难理解，一旦你开始编写自己的程序，你一定会喜欢这些数值运算符的。如果你还没有记住\
  \ Java 中不同数值运算符的符号，那么你随时随时回到第 4 章查看数值运算符表。\n\n## 尝试 Java 加法\n\n你可以创建一个像这样的程序：\n\n\
  ```java\npublic class AdditionProgram {\n    public static void main(String []args)\
  \ {\n        System.out.println(5 + 9);\n    }\n}\n```\n\n你也可以像这样使用变量：\n\n```java\n\
  public class AdditionProgram {\n    public static void main(String []args) {\n \
  \       int a = 5;\n        int b = 6;\n        System.out.println(a + b);\n   \
  \ }\n}\n```\n\n## 尝试 Java 减法和其他数学运算\n\n以上面的示例为指南，创建一个用于减法、乘法、除法和余数（也称为模）的简单 Java\
  \ 程序。你可以尝试自己练习，直到掌握它。练习得越多，你就会发现它的挑战性越小。到那时，你会发现操作 Java 变得更加自在。\n\n## 比较运算符\n\n\
  比较运算符也被称为关系运算符。它们比较数据类型，并始终给你一个布尔值，即 `true`（真）或 `false`（假）。如果你还不熟悉该表格，那么在你开始使用关系运算符时可以回去查看。\n\
  \n比较运算符位于两个数据（称为操作数）之间。如果你打印这条语句：\n\n```java\nSystem.out.println(9<7);\n```\n\n\
  你将得到一个 `false` 的答案。Java 程序在遇到带有关系运算符的语句时，会识别出它应该给出一个布尔答案。\n\n等于 (`==`) 和不等于 (`!=`)\
  \ 运算符也称为相等运算符。在 Java 编程中，程序员可以使用相等运算符来测试数据的相等性。程序员可以测试 `int`、`boolean` 或 `char`\
  \ 数据类型的相等性。参考下面的示例：\n\n```java\nchar sampleChar = ‘L’;\nint sampleNum = 5;\nSystem.out.println(sampleChar==sampleNum);\n\
  ```\n\n上面的示例将在屏幕上打印‘false’，因为变量 `sampleChar` 中的值与变量 `sampleNum` 持有的值不同。\n\n## 一些尝试性的练习\n\
  \n现在你可以通过这个简单的编程练习来测试你学了多少。不要担心；如果你觉得有点挑战性，稍后会看到正确的代码。如果你看到错误消息，请阅读消息并尝试找出你犯的错误。有时，一个简单的拼写错误就会危害整个程序，除非你立即发现它。确保你正确使用了大小写。\n\
  \n1. 将 `this is my program` 声明为你的类；编写程序时确保编写正确。\n2. 写一行单行注释，任何内容均可。\n3. 给布尔变量 `isAnything`\
  \ 赋值 `false`。\n4. 给 `int` 变量 `isTooMuch` 赋值 `789`。\n5. 将 `isTooMuch` 乘以 3 的值赋值 `int`\
  \ 变量 `isMuchMuch`。\n6. 打印值 `isAnything`、`isTooMuch` 和 `isMuchMuch`。\n\n在查看答案之前，尝试自己编写给定的示例。你也可以尝试更多练习。\n\
  \n如果你完成了，可以查看下面的答案。你的结果是一样的吗？\n\n```java\npublic class ThisIsMyProgram {\n    //\
  \ this is my single line comment\n    public static void main(String []args) {\n\
  \        boolean isAnything = false;\n        int isTooMuch = 789;\n        int\
  \ isMuchMuch = isTooMuch * 3;\n        System.out.println(isAnything);\n       \
  \ System.out.println(isTooMuch);\n        System.out.println(isMuchMuch);\n    }\n\
  }\n```\n\n## 第 6 章：选择语句\n\n现在你已经了解了 Java 基础，让我们更上一层楼。你需要准备好学习控制流的介绍。\n\nJava 控制语句调节\
  \ Java 程序的执行顺序。你需要理解的有有三个大类，它们是：\n1. 选择语句 `if`、`if-else` 和 `switch`。\n2. 循环语句 `while`、`do-while`\
  \ 和 `for`。\n3. 转移语句 `break`、`return`、`try-catch-finally`、`continue` 和 `assert`。\n\
  \n如果你想改变默认执行顺序，我们可以根据程序需要使用上述的任何语句。对于 Java 基础，我们将讨论选择语句和一些循环语句。\n\n### 选择语句\n\n\
  此类类别包括：`if` 语句、`if-else` 语句和 `switch` 语句。\n\n### 处理 if 语句\n\n`if` 语句告诉计算机，只有当 `if`\
  \ 语句内的表达式证明为真时，才执行特定的代码块。如果语句为假，则不会执行该代码块。假设没有其他可能由于特定条件触发执行的语句，程序将继续执行其余部分代码。\n\
  \n`if` 语句遵循以下语法：\n\n```\nif (<conditional expression>)\n<statement action>\n```\n\
  \n看下面的示例：\n\n```java\npublic class SampleIfStatement {\n    public static void main(String[]\
  \ args) {\n        int a = 20, b = 30;\n        if (a > b) {\n            System.out.println(\"\
  a is greater than b\");\n        }\n        if (a < b) {\n            System.out.println(\"\
  b is greater than a\");\n        }\n    }\n}\n```\n\n你认为这个程序会打印什么？\n\n### 理解 if-else（或嵌套\
  \ if）语句\n\n与 `if` 语句一样，`if-else` 语句也命令计算机仅在语句内的表达式为真时，才执行 `if` 语句下的特定代码块。如果语句为假，则接下来必须执行\
  \ `else` 语句，且仅当满足 `else` 选项的条件时。\n\n`if` 语句遵循以下语法：\n\n```\nif (<conditional expression>)\
  \ {\n<statement action>\n} else {\n<statement action>\n}\n```\n\n看一下示例程序：\n\n```java\n\
  public class IfElseDemo {\n    public static void main(String[] args) {\n      \
  \  int a = 20, b = 20;\n        if (a > b) {\n            System.out.println(\"\
  a is greater than b\");\n        } else if (a < b){\n            System.out.println(\"\
  b is greater than a\");\n        } else {\n            System.out.println(\"a is\
  \ equal to b\");\n        }\n    }\n}\n```\n\n如果你尝试分析它：\n\n第 4 行提供了程序运行所需的给定数据。\n\
  \n\n\n\n\n第 5 行包含一个条件：如果 `a` 大于 `b`，它将打印“a is greater than b”。如果你查看给定的数据，该语句为假，这会提示程序执行下一条语句，即\
  \ `else` 语句。\n\n第 7 行提供了另一个选项或条件；遗憾的是，它仍然为假。\n\n剩下的就是打印“a is equal to b”。\n\n程序不会执行\
  \ `if` 或 `else-if` 语句下的语句，因为这两个语句都为假。然而，底部的 `else` 语句没有提供任何条件，它告诉程序打印“a is equal\
  \ to b”，这在实际上是真实的。\n\n尝试更改程序中的给定数据，并观察程序的响应。\n\n# Switch 语句（分支语句）\n\n`switch` 语句也被称为\
  \ `case` 语句，其中你为用户提供不同的选项，程序将执行它。`switch` 语句与 `if-else` 语句相似，它们都提供了选项，且程序将寻找第一个证明为真的选项。它将执行返回值为真的\
  \ `if-else` 选项下的语句。\n\n`switch` 语句比 `if-else` 语句更有条理。如果以有规律的方式编码，维护程序也会更容易。如果你有许多选项需要展示，那么你应该使用\
  \ `switch` 语句。\n\n以下是 `switch` 语句的语法：\n\n```java\nswitch (<non-long integral expression>)\
  \ {\n    case 1: \n        <statement 1>\n        break;\n    case 2: \n       \
  \ <statement 2>\n        break;\n    case n: \n        <statement 2>\n        break;\n\
  \    default: \n        <statement>\n} // end of switch or case statement\n```\n\
  \n看下方的示例程序：\n\n```java\npublic class SwitchCaseStatementDemo {\n    public static\
  \ void main(String[] args) {\n        int a = 10, b = 30, c = 20;\n        int response\
  \ = 0;\n        if (a > b && a > c) {\n            response = 1;\n        } else\
  \ if (b > a && b > c) {\n            response = 2;\n        } else if (c > a &&\
  \ c > b){\n            response = 3;\n        }\n        switch (response) {\n \
  \           case 1:\n                System.out.println(\"a is the biggest number\"\
  );\n                break;\n            case 2:\n                System.out.println(\"\
  b is the biggest number\");\n                break;\n            case 3:\n     \
  \           System.out.println(\"c is the biggest number\");\n                break;\n\
  \            default:\n                System.out.println(\"Error encountered, try\
  \ again\");\n        }\n    }\n}\n```\n\n你需要初始化 `int response`，这是你的 `switch` 语句所需要的。如果你删除了它，你的程序将无法运行。\n\
  \n你可以更改需要的数据并查看结果。你可以尝试更改每个 `if-else` 语句下的条件，并观察会发生什么。确保当你更改某些内容时，该更改与整个程序保持一致。否则，你的程序将无法运行或产生不同的结果。\n\
  \n# 循环语句\n\n循环语句包括：`while` 语句、`do-while` 语句和 `for`。\n\n## while 语句\n\n`while` 语句告诉程序只要条件或语句保持为真，就继续执行下方的代码块。只有当语句变为假时，程序才会停止重复执行代码指令。\n\
  \n这是 `while` 循环的语法：\n\n```java\nwhile (<loop condition>)\n<statements>\n```\n\n\
  以下是示例程序：\n\n```java\npublic class SampleWhileLoop {\n    public static void main(String[]\
  \ args) {\n        int count = 1;\n        System.out.println(\"Output Numbers 1\
  \ - 10\");\n        while (count != 11) {\n            System.out.println(count++);\n\
  \        }\n    }\n}\n```\n\n我们需要初始化 `int count` 为 1。在第 6 行，它仅意味着当 `count` 等于 1\
  \ 时，它将不再打印。在第 7 行 `count++` 告诉程序将 `count` 加 1，因此在下一次循环中它将打印 2。它需要再次增加 `count`，在下一次循环中将打印\
  \ 3，依此类推，并且当 `count` 等于 1 时才会停止打印。\n\n## do-while 语句\n\n`do-while` 循环或语句与 `while`\
  \ 语句相似，不同在于程序在执行语句之前会先执行动作，然后再检查实际条件。这可以给程序提供更多控制，因为它确保了循环至少执行一次。\n\n这是 `do-while`\
  \ 语句的语法：\n\n```java\ndo {\n    <loop body>\nwhile (<loop condition>);\n```\n\n以下是示例程序：\n\
  \n```java\npublic class SampleDoWhileStatement {\n    public static void main(String[]\
  \ args) {\n        int sheep = 1;\n        System.out.println(\"Output Numbers 1\
  \ - 10\");\n        do {\n            System.out.println(sheep++);\n        } while\
  \ (sheep <= 10);\n    }\n}\n```\n\n## for 循环或语句\n\n`for` 循环适用于需要执行特定次数某段代码块的任务或程序。它就像只要条件保持为真，就重复执行相同的过程。你需要初始化控制循环的计数器。\n\
  \n这是你需要遵循的语法：\n\n```java\nfor (<initialization>; <loop condition>; <increment expression>)\n\
  <loop body>\n```\n\n这里是示例程序：\n\n```java\npublic class SampleForLoop {\n    public\
  \ static void main(String[] args) {\n        System.out.println(\"Output Numbers\
  \ 1 - 10\");\n        for (int number = 1; number <= 10; number++) {\n         \
  \   System.out.println(number);\n        }\n    }\n}\n```\n\n看第 5 行，你需要初始化计数器 `number`，设置条件\
  \ `number` 小于或等于 10，并使 `number` 加 1。下一个语句打印计数器 `number`，其初始值为 1。\n\n当 `number` 变为\
  \ 2 时，它仍然小于 10，计数器再次加 1。下一个语句将打印 2。整个循环将重复直到 `number` = 10。当计数器 `number` 变为 11 时，它不再满足计数器小于或等于\
  \ 10 的后续条件。程序将不再执行剩余的语句。\n\n# 总结\n\n感谢感谢下载这本书！希望这本书能够帮助你理解创建 Java 程序所需的 Java 基础。下一步是继续练习你所学的知识，并在过程中学习更多的命令。\n\
