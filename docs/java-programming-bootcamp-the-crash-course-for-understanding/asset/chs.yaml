  \ 14 天内成为一名高效的 Excel 用户。\n\n再次感谢你下载这本书，希望你喜欢它！\n\n# 第 1 章：Excel – 基础\n\nExcel 是一个非常优秀的电子表格程序，允许你创建包含图表和计算的表格。在使用此程序时，你的计算范围可以从简单的加法到复杂的函数和数学模型。\n\
  \n在本章中，你将学习 Excel 的基础知识。这些材料将教你与这个强大的电子表格应用程序相关的思想和原则。\n\n### Excel – 一个 Windows\
  \ 程序\n\n微软是当今领先的软件制造商之一，创建 Excel 是其“Office 套件”的一部分。基本上，MS Excel（即 Microsoft Excel）是一个使用广为人知的\
  \ Windows 图形界面的程序。一旦激活，Excel 将位于一个独立的“窗口”中——即包含程序组件的大正方形框。\n\nWindows 操作系统（例如 XP、Vista、7\
  \ 等）具有内置功能，允许你自定义 Excel 窗口的外观。这些功能包括：\n\n\n\n- 边界 (Border) – 当 Excel 窗口未最大化时，包裹该窗口的框。如果你将鼠标悬停在边界上，它将变成双头箭头——这个箭头允许你调整\
  \ Excel 窗口的大小。\n- 标题栏 (Title Bar) – 这是任何 Excel 窗口顶部的彩色区域。它显示你正在使用的程序名称。如果 Excel\
