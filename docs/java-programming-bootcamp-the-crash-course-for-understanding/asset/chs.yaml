  \n\n\n\n\n# 我在哪里/如何可以找到事物的名称？\n\n有些人使用查询语句来寻找特定的现实世界事物或地点。一个人可能正在寻找纽约周边的二手车。他通过输入以下内容让搜索引擎查找所有发布的关于二手车的分类广告：\n\
  \n“纽约市二手汽车广告 (Second-hand cars in New York City classified ads)”\n\n他发现结果太多，于是他将搜索范围缩小到：\n\
  \n“曼哈顿二手雷克斯 (Second-hand Lexus in Manhattan craigslist)”\n\n## 什么、何时和哪里的问题\n\n然而，大多数时候，人们使用搜索引擎来查找信息。例如，有些人使用搜索引擎为他们的学校作业寻找答案。许多人也会去搜索引擎查找与自己相关的时事新闻。与其查找电话簿，人们还发现通过互联网查找企业的地址和联系电话更快。\n\
  \n[公司名称]的网站是什么？\n\n最后，人们使用搜索引擎访问网络上的特定区域。例如，有些人想访问他们当地报纸的网站。他们不知道确切的网址地址，所以他们要求\
  \ `google` 引导他们到达那里。\n\n搜索引擎已成为发达国家大多数人答案的首要来源。`Google` 等搜索引擎的大多数用户信任算法编制的搜索结果。大多数人期望在顶部结果中找到查询的答案。如果前五个结果似乎没有他们问题的答案，人们倾向于认为他们在查询中使用的短语有问题。大多数人会完善他们的搜索，就像那个在纽约寻找二手雷克斯的人一样。\n\
  \n## 这对你的网站有什么影响？\n\n如果你想让网站获得更多流量，你需要了解搜索引擎是如何工作的，并且你需要优化你的网页，以便它们被爬取、索引并显示在搜索结果页的顶部。\n\
  \n对于 SEO 来说，出现在搜索中是不够的。顶部结果的点击率超过了 18%。你的页面在搜索引擎结果页上的排名越靠后，点击次数就越少。\n\n在智能手机时代，人们最初认为网站的普及将开始下降。普通人认为\
  \ App 将取代搜索。如果这真的发生了，到目前还没有出现。尽管在桌面电脑前花费的时间减少了，人们仍然在使用搜索来寻找他们需要的信息和想要的物品。针对手机屏幕优化的网站将获得来自移动搜索的大部分流量。\n\
  \n## 第 1 和第 2 天的活动：决定你网站的主题或利基市场\n\n如果你的网站专注于一个主题，你的网站更容易获得排名。如果你已经有一个通用信息网站或博客，你可以根据已经拥有的热门帖子或内容来决定要追求的最佳主题。\n\
  \n在考虑网站的主题或利基市场时，你还应该考虑你建立它的个人目标。你从现在起创建的内容类型应该让你离目标更近。\n\n## 第 2 章：搜索技术的局限性\n\n\
  搜索引擎是在网络上查找信息的最流行的工具。然而，即使搜索算法和页面爬取技术有了所有改进，这个工具仍然有很多局限性。例如，搜索引擎在爬取和索引网页后，无法直接判断网页是否对用户相关。它需要寻找更多线索，以知道某个页面是否应该出现在某些关键词的搜索结果顶部。\n\
  \n作为网站站长和搜索营销人员，你的工作是为搜索引擎提供所需的线索，将你放在顶部结果中。搜索引擎专家将这些线索称为 `排名因素 (ranking factors)`。排名因素是搜索引擎蜘蛛在访问你的网站时寻找的信息。它们在索引期间编制这些排名因素。网页在关键词搜索结果中的位置将取决于基于这些因素的排名分得分。\n\
  \n即使考虑到数百个排名因素，搜索引擎仍然有许多局限性。\n\n### 搜索引擎的局限性是什么？\n\n**爬虫机器人依赖链接进行跳转**\n\n搜索引擎爬虫的目的是为整个可搜索的互联网制作虚拟地图，我们指的是普通人可以访问的互联网部分。为了从一个页面跳转到另一个页面，它们使用所爬取页面中的超链接。这些数字桥梁是一个重要的排名因素。\n\
  \n如果你的网站中有某些页面没有指向它的链接，你应该预料它将不会被索引，也不会出现在搜索结果页中。\n\n**它们无法爬取受在线表单保护的页面**\n\n网站要求访问者成为成员是很常见的。要成为成员，你需要填写会员表单。搜索引擎并不具备填写所有类型表单的程序。由于此，它们无法爬取站长专为展示给成员的任何信息。\n\
  \n**它们专门用于文本内容**\n\n搜索引擎爬虫专门于从基于文本的网站收集信息。它们收集和组织非文本内容信息的能力受到严重限制。例如，爬虫机器人无法自行判断图片看起来什么样。它们在处理视频、音频、图像、Flash\
  \ 和插件内容时也面临类似的挑战。\n\n为了解决这个问题，搜索公司要求站长在这些内容中包含文本信息。没有这些额外信息，网页中的某些类型内容在排名时将不会被赋予太权重。\n\
  \n**它们需要关键词匹配**\n\n当用户使用搜索引擎时，他们通常输入一个描述他们正在寻找的内容短语。搜索引擎算法已经进化，它们比以往任何时候都有能力在 90%\
  \ 的时间内为你提供相关的网页。然而，如果用户没有使用术语，可能会遇到一些问题。数百万用户在搜索内容时使用不常用的术语。\n\n这种局限性在刚接触英语的人中很常见。当他们不知道某个词时，他们可能会使用形容词来描述它。英语母语者知道他可能想表达什么，但搜索引擎并没有理解非母语者可能请求内容的程序。\n\
  \n当我们使用搜索 AI 不熟悉的语言细微差别时，这个问题也变得难以处理。例如，不同英语国家之间相同单词的拼写差异会影响你的搜索结果排名。如果如果你一直使用 `behaviour`\
  \ 代替 `behavior`，搜索引擎可能会认为你的网页是为英国用户设计的。这将影响你在美国用户中的排名。\n\n搜索营销的成功在很大程度上取决于你对所用语言的了解。例如，如果你针对特定的少数群体作为网站的潜在访问者，你应该了解他们使用语言的细微差别。了解他们的搜索行为也有帮助。\n\
  \n*   专有名词与通用名称\n\n\n\n\n由于对关键词的依赖，搜索引擎面临着在正确语境下阅读单词的挑战。当用户使用具有多种含义的关键词时，这一挑战变得更加困难。例如，流行文化一直在广泛使用“黑色（black）”这个词。歌曲、电影和品牌都包含了这个词。在搜索中输入这些词的人也可能指的是他们正在寻找的物品的颜色。因此，搜索引擎用户在搜索时倾向于使用更长的短语，以使结果更符合他们的特定需求。由于这种搜索行为，网站管理员开始针对长尾关键词。这些是人们在搜索时通常使用的短语，长度通常超过三个单词，并且指的是搜索者非常具体的需求。\n\
  \n搜索技术在不断变化。工程师们继续开发新形式的技术，以便 `A.I.` 能够克服这些局限性。正因为有了这些局限性，我们需要针对用户和搜索引擎优化我们的网页。\n\
  \n### 第 3 和第 4 天的活动：\n\n你应该花时间回顾本章讨论的搜索引擎局限性，并思考你的潜在访问者通过搜索引擎访问你网站时面临的困难。\n\n你还应该花时间检查你的网站在搜索引擎结果页中的可见性。使用你所在行业或利基市场的通用关键词和短语。如果你无法在前三页找到你的网站，那么你需要做大量工作。如果你在前三页中但不在第一页，你的目标就是向上爬。无论你的位置如何，你都应该使用书中的策略和信息来提高你网站的排名。\n\
  \n## 第 3 章：你的目标用户：搜索营销策略的开始\n\n在为网站制定搜索营销策略时，你需要开始考虑那些可能从你网站找到的信息中发现价值的人群。他们是那些在搜索结果页上看到你的网页时最可能点击它的人。搜索引擎桥起了你的网站内容与需要这些内容的人之间的鸿沟。\n\
  \n#### 为你的目标搜索引擎用户建立画像\n\n互联网用户每月进行数十亿搜索。然而，并非所有的搜索对你的网站都有价值。寻找你网站中类型信息的人数取决于你网站所属的行业或利基市场的流行程度。利基市场越热门，搜索者越多。然而，热门的利基市场也意味着竞争激烈。\n\
  \n为了脱而出，你需要了解你的理想访问者。你可以通过为你的网站创建一个理想访问者画像来实现。如果你已经有一个运行了一段时间的网站，你可能通过你使用的分析软件收集一些关于访问你网站的人群类型的信息。以下是你将需要的关于访问者的几类信息：\n\
  \n*   年龄\n*   性别\n*   语言\n*   位置\n*   共同兴趣\n\n通过获取这些类型的信息，你将猜出人们在使用搜索引擎时最可能使用的词。根据你拥有的网站类型，你可能还需要一些额外信息。\n\
  \n#### 你对访问者的目标\n\n在创建了理想访问者画像后，你需要决定你希望这些人人在到达你的网站时做什么。如果你在网站上销售某些东西，你可能需要调整设计，以确保用户可以从你的索引页面开始购买。\n\
  \n其他网站则希望他们的访问者填写表单、回答调查或注册会员。\n\n设定目标还允许你精炼你所针对的关键词类型。例如，如果你在销售某些东西，你可能需要针对与购买相关的短语。某些营销人员只针对处于购买过程后期的人所使用的短语。\n\
  \n### 第 5 和第 6 天的活动：识别你的目标用户\n\n下一个活动是识别你网站理想访问者的特征。理想访问者是指那些最可能完成你想要实现的目标的人。你应该说明这些人的共同点。除了第\
  \ 3 章中提到的信息外，你还应该研究同样迎合同一目标市场需求的其他网站。你应该查看他们的设计和他们提供的内容类型。\n\n## 第 4 章：选择关键词进行排名\n\
  \n现在你已经知道你的目标访问者是谁了，你需要选择他们在搜索你所提供的信息时会使用的正确关键词。\n\n为了了解你的目标用户正在使用哪些关键词，你需要把自己放在目标用户的立场上。你需要利用你创建的画像中的信息来猜测你应该使用的正确语言类型。\n\
  \n你还需要提醒自己搜索引擎技术具有局限性。你需要确保你的关键词代表了你在页面上显示的内容类型，以及潜在访问者的意图。你的最终目标是提供潜在访问者需要的东西，并将他们转化为买家、订阅者、会员，或者至少是回访者。\n\
  \n大多数初级网站管理员认为他们应该只选择一个强关键词，并将其用于网站的所有页面。对于搜索引擎来说，这种策略看起来会非常像关键词堆砌（keyword stuffing）。\n\
  \n如果你想让你的网站成为该主题的主要信息来源，你需要目标是在与网站主题相关的多个关键词上获得良好排名。例如，如果你的网站是关于某个电视节的，你可能想在网站首页中针对它的标题。然后你应该创建与该节目相关的文章或页面，例如关于角色的页面。在该页面中，你可以使用此示例\
  \ `[TV show title] characters` 作为你的主关键词。\n\n有免费和付费工具可以帮助你找到某些主题最常用的关键词。其中最流行的工具之一是\
  \ `Google Ad Keyword Planner`。\n\n在规划关键词时，你还应该考虑以下因素：\n\n*   你提供的产品或服务的名称：这包括服务的通用名称和品牌。一些考虑购买某些东西的人通常知道他们想要购买的品牌，因此你应该拥有直接回答这些品牌问题的网站内容。\n\
  *   与你的产品或服务相关的课题：你还应该提供与你的产品或服务相关主题的内容。例如，许多公司网站包含公司更新。这显示了网站的活跃。\n*   季节性热门关键词：你还需要为预计会有高销量和流量的季节准备搜索营销活动。例如，对于零售网站，圣诞节、情人节和感恩节是大活动。在这个季节，人们倾向于在网上为线下购物寻找灵感。你应该利用人们在这些季节挥霍的习惯。\n\
  \n在 构建网页时使用关键词。\n\n\n\n\n每当你创建一个博客文章或新网页时，你都需要考虑你将使用的目标关键词。你应该为你创建的每个页面或文章针对一个主关键词。你的关键词应该与你希望访问者执行的操作保持一致。如果你希望访问者购买某些物品，你的目标就是建立一个网页，针对那些具有购买意图的搜索者所使用的关键词。你也可以创建网页，针对正在研究特定产品的搜索者所使用的关键词。\n\
  \n当你知道要针对哪些关键词进行排名后，你的下一个目标是将它们策略性地放置在你的网页中。在这些位置放置关键词时，你必须确保它们出现得自然。你的首要目标是让人类访问者理解你的内容。用户体验始终比任何\
  \ SEO 策略都重要。考虑到这一点，你应该将关键词放置在网站的以下部分：\n\n### URL 扩展名\n如果你的域名已经包含了你想要排名的关键词，那将会有帮助。但大多数情况下，你需要在\
  \ URL 的后半部分插入关键词，以确保它包含在地址栏中。\n\n### 标题标签 (Title Tag)\n标题标签让爬虫了解你的页面的主题。通常情况下，你需要尽早在标题标签中加入关键词。这一策略的挑战在于，当你计划了一个富有创意的标题时。有时，将关键词放在标题标签的开头会让它听起来很生硬。如果是此类情况，你应该优先考虑用户体验。\n\
  \n### 页面顶部\n你还应该在内容的第一段中包含关键词。长篇内容并不会被爬虫完全扫描。除了标题标签外，爬虫还会尝试通过前几段来判断你的内容是关于什么的。这就是为什么你需要在这些区域包含你的关键词。\n\
  \n### 页面文本内容\n除了第一段外，你还应该在内容的各个部分添加 3-4 次关键词。在这种情况下，你可能需要对主关键词进行变体，使其听起来更自然，并避免让读者感到冗余。\n\
  \n### 图片的 Alt 属性 (Alt-attribute)\n你还应该在图片的 alt 属性中添加你图片的句子或描述。这将有助于你的图片在搜索引擎的图片搜索功能中获得良好排名。你应该确保只包含与你的内容相关的图片。你应该尝试制作独特的图片和照片。这会让你的图片在图片搜索结果页中脱颖而出，并可能更高的点击率。\n\
  \n### 元描述 (Meta description)\n上述的所有其他属性都会让网页在搜索引擎结果页中排名更得好。为了保持你的网页排名高位，你需要确保看到它的人会点击它进入你的页面。网页过期的点击率也是一个重要的排名因素。\n\
  \n两个重要因素会提高你在搜索引擎中的点击率。第一个是你的内容的标题，我们在本节的早些部分讨论过。第二个是标题下方的描述。大多数内容管理软件（CMS）默认会使用文本内容的第一部分作为描述。你应该检查你的\
  \ `CMS` 如何添加元描述，这样你就可以控制显示在搜索引擎结果页中标题下方的文本。你需要对不同的描述文案进行实验，以获得产生最高点击率的文案。\n\n##\
  \ 第 7 天和第 8 天的活动：进行关键词研究\n当你已经有了一个网站和一个要追寻的主题时，你的下一个动作是寻找那些可以帮助你实现网站目标的关键词和短语。参考本章中的提示，以了解关键词在\
  \ SEO 中是如何运作的以及如何使用它们。除了流行的 `Google AdWords Keyword Planner` 之外，还有其他免费的在线工具可以在你为网站寻找最佳关键词时使用：\n\
  \n### Microsoft Bing Ads\n这是 `Bing` 版本的关键词规划师。如果你的网站很大一部分流量来自 `Bing`，你也应该使用这个工具。\n\
  \n### Google Trends\nGoogle Trends 为你提供了全球范围内使用的流行关键词。它们还允许你检查你国家现在和过去流行的内容。你还可以获得有关某些关键词和短语多年来流行程度波动的洞察。\n\
  \n## 第 5 章：用户体验影响你的排名\n在上一章中，我们讨论了保持你的目标关键词与你的网页内容以及访问者的需求保持一致的重要性。\n\n例如，如果你的网站专注于增肌健身设备，你应该针对人们在网上寻找该类型物品时使用的关键词。\n\
  \n当人们在搜索引擎结果页上点击你网页的链接时，他们有你需要满足的预期。在这一特定的例子中，如果你在正确的关键词上排名，访问者可能期望找到不同类型的加重训练工具。你也可以添加增加肌肉生长速度的食品补充剂。\n\
  \n假设你的访问者使用“增肌健身设备”这个短语进入你的网站，但当他们到达网站时，发现你关注的是瑜伽技巧，并且你只评价瑜伽相关产品。在这种情况下，你的访问者会对结果感到稍微失望，并可能点击移动设备或浏览器上的“返回”按钮。\n\
  \n这是一个糟糕用户体验的例子。搜索引擎试图避免将人们引导到错误的网站。它们还试图防止结构不佳的网站获得良好排名。为了确保只有特定主题的最佳网站才能获得搜索结果页的顶端，搜索引擎算法考虑了多个排名因素。检查你的网站是否符合以下有助于获得良好用户体验的排名因素：\n\
  \n### 关键词与主题的对齐\n要考虑的第一个因素是你使用的关键词。当你的主题和主关键词不一致时，你的网页可能会在与你提供的内容不相关的关键词上排名。这将导致用户不满意。你甚至可能在未来的算法更新中受到惩罚。\n\
  \n### 入站链接质量 (Inbound link quality)\n链接是搜索引擎的一个信号，表明网页内容是流行的。这让它们认为，未来可能对此感兴趣的人在与内容互动时会有良好的用户体验。\n\
  \n热门网站在建立链接方面具有显著优势。已经更多的人在关注它们的内容，它们在发布内容后，更容易获得来自其他优秀网站的链接。\n\n### 导航结构 (Navigational\
  \ structure)\n你网站的导航也很重要。通常情况下，你应该确保访问者可以在三次或更少的点击内从首页到达所有页面。如果你在构建阶段没有规划网站的导航，你应该花时间列出你所有的网页，并确保它们可以从首页轻松访问。\n\
  \n### 用户参与度 (User Engagement)\n当人们在点击搜索引擎结果页上的你的链接后立即点击返回按钮时，搜索引擎认为用户对他们的体验感到失望。这可能由于多种原因引起。例如，可能是因为某个网页加载内容太慢。也可能是因为他们看到网页中的内容不是他们需要的。然而，人们也可能因为不重要的原因点击返回。无论人们点击返回按钮的原因是什么，它都会影响你的页面在搜索引擎中的排名。\n\
  \n\n\n为了防止这种情况发生，你应该设计内容以保持读者的参与度。如果你主要使用文本内容，请写好你的第一段，以吸引人们并让他们不想点击返回。你还应该提供照片和图片，这样他们就不会只看到满屏的“文字墙”。如果你的页面上有视频，你需要确保它运行良好且加载快速。最后，你应该提供指向其他有趣内容的链接，以确保你的访问者在离开第一个页面后不会“跳出”或离开你的网站。\n\
  \n## 机器洞察\n\nSEO 领域最重要的更新之一是 2011 年的熊猫算法（Panda）更新。Google 在其排名算法中引入了一个新部分，在 SEO 行业被称为机器学习。简而言之，该算法模拟了人类判断网站质量的方式。当更新发布时，许多老牌网站被新起的网站超越，因为新网站的设计和整体用户体验优于旧网站。然而，黑帽\
  \ SEO 从业者是这些更新的目标；但一些带有少量黑帽行为的高质量网站也受到了影响。\n\nGoogle 的目标是清理其搜索结果，移除那些构建糟糕、提供用户体验不佳的网站。只要你保持高内容质量，并确保用户对你提供的内容满意，你就是安全的。通过遵循书中的提示，你将避免过去更新的某些负面影响，并可能避免未来更新的影响。\n\
  \n### 第 9-10 天活动：根据理想访问者的偏好设计你的网站\n\n你应该确保你的网站在理想访问者眼中看起来很棒。你所有的内容都应该符合他们的需求和愿。最后，你应该测试网站的导航功能。你需要确保通过链接将相关内容的页面连接起来。如果你有人帮助你，你应该让他们在你的网站中寻找特定信息。然后向他们获取对你网站导航的反馈。\n\
  \n## 第 6 章：构建你网页的链接概谱（Link Profile）\n\n搜索引擎将链接视为流行度指标。在熊猫更新之后，Google 仍然认为链接是有价值的，但在将其作为排名因素时变得更加严格了。\n\
  \n### 搜索引擎如何使用链接：\n\n#### 确保你的链接与主主题相关\n\n指向你网站的链接类型应该取决于你提供的内容类型。例如，如果你提供名人新闻，那么发布你链接的网站也应该与名人相关。这包括名人博客、论坛和其他名人新闻网站。\n\
  \n你还应该考虑网站的本地化。如果你的网站服务于特定城市的人口，那么与该城市相关的网站的链接比来自提供通用信息的网站的链接权重更高。\n\n#### 热门网站权重更高。\n\
  \n在寻找链接来源时，你还应该考虑网站的流行度。来自《纽约时报》网站的链接权重比来自你朋友博客的链接高。搜索引擎认为这类网站是值得信任的。来自垃圾网站的链接对你的网页害处大于益处。\n\
  \n#### 使用锚文本（Anchor texts）时要小心。\n\n在链接结构中，需要考虑的最因素是锚文本。这是链接代码中用户可以阅读并点击的部分。指向你网站的链接锚文本也应该与你的主题相关。然而，你应该确保指向你网页的锚文本看起来自然。如果它们都使用相同的锚文本，Google\
  \ 可能会认为你正在操纵系统或使用黑帽方法建立链接。\n\n#### 随时间缓慢建立链接。\n\n如果你的网站是新的但你已经有了数百个链接，搜索引擎可能会认为你在使用这种方法。为了避免这种情况发生，你应该确保你雇用的\
  \ SEO 公司或专业人士不会无差别地构建指向你网站的链接。\n\n#### 链接的价值随时间递减。\n\n业业余营销人员也认为，只要链接在线，它们的质量就会保持不变。然而，Google\
  \ 已经将内容的新鲜度作为排名的一个重要因素。随着链接你的网站变得越来越不流行，你的排名也会下降。为了防止这种情况发生，你应该定期制作内容，以为你的链接概谱做出贡献。\n\
  \n### 第 11-13 天活动：\n\n你需要花费大量时间来构建网站的链接概谱，但采取这些步骤将帮助你开始这一过程。你的第一个任务是找到那些拥有与你类似的网站的人。他们不应该提供垃圾内容，并且应该由声誉良好的公司或营销人员管理。\n\
  \n你的下一步是收集这些网站所有者的联系信息并开始与他们交流。做到此最好的方法之一是提议在他们的网站上发表投稿（Guest post）。大多数网站管理员都会欢迎在其网站上获得免费内容的机会。他们在给出发布许可之前会审核你的内容，所以你需要确保内容是高质量的。你需要\
  \ 2 天来创作一份研究充分且优秀的内容，花费 1 天开始发送电子邮件。\n\n在第 14 天，你应该回顾排名的改进情况，以及你可以做哪些其他任务来进一步提升。\n\
