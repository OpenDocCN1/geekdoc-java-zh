  \n“Hello”程序是编程初学者学习的第一课，这出于许多方面的考虑。该程序向你介绍了开始编写程序时首要需要做的事情，以及你必须学习和使用的一些语法。\n\n\
  为了保持统一，示例将使用在线编码工具（之前已提供链接）。稍后你可以使用自己的 `Java.exe`。实际的在线 Java 控制台会显示不同的字体颜色。只有当某个命令或字符\
  \ `/` 符号需要进行详细说明时，我们才会在示例中使用不同颜色的字体。\n\n## Hello Java，基础语法\n\n看看下方的示例程序，我们将逐行进行分析：\n\
  \n```java\n1 | public class FirstProgram {\n2 |\n3 |   /* 这是第一个示例。\n4 |     * 我们将打印\
  \ 'Hello Java' 作为输出\n5 |     */\n6 |\n7 | public static void main(String []args)\
  \ {\n8 |       System.out.println(\"Hello Java\"); // 输出 Hello Java\n9 |     }\n\
  10| }\n```\n\n顺便说一下，极其重要的是记住 Java 是区分大小写的。在 Java 编程中，标识符 `Hello` 和 `hello` 是不一样的。确保正确定义所有内容，并在整个程序中一致地使用正确大小写的标识符。\n\
  \n第一行写有类名 `FirstProgram`；不要在构成类名的单词之间留空格。类名中包含的下一个单词的首字母应该大写。你的程序应该始终以 `public class`（全小写）开头，后紧跟类名。你看到类名末尾的黄色括号了吗？别忘记也包含它。它作为一个标记，表示之后的内容是你程序的代码。\n\
  \n你的程序文件名必须与你分配的类名相同。在保存文件名时，只需在文件名后添加 `.java` 即可。看看上面的示例。保存时，请写 `FirstProgram.java`。\n\
  \n第二行是空的，为了让代码更具读性。\n\n第三行以 `/*` 开头，在第五行你有 `*/`。当你需要包含多行注释时会使用它们，编译器不会将其视为程序的一部分。你通常包含注释是为了简单解释一下程序，作为对你自己的某种提醒，或者帮助负责维护该程序的程序员。\n\
  \n第七行包含方法名，所有的方法名都应该写成小写。方法名的写法始终如下：\n\n```java\npublic static void main(String\
  \ []args) {\n```\n\n方法名末尾的括号提示程序执行括号括内的所有内容（在我们的示例中，右括号位于第 9 行）。\n\n在示例中，第 8 行包含一个命令，告诉程序在屏幕上打印\
  \ `Hello Java`。命令末尾应该有一个冒号 `;`。`//` 符号另一种注释，当你需要编写单行注释时使用该符号。`.println` 是告诉程序打印括号内内容的命令。确保每个括号都有对应的右括号。在示例中，第\
  \ 1 行的左括号在第 10 行有右括号。第 7 行的左括号在第 9 行有右括号。这里是另一个：\n\n```java\n1 | public class FirstName\
  \ {\n2 |   public static void main(String []args) {\n3 |     System.out.println(\"\
  Erika\");\n4 |   }\n5 | }\n```\n\n它将产生结果：\n`Erika`\n\n此外，确保正确缩进以使代码更具读性。你将在下一章学习更多关于数据类型和变量的知识。\n\
  \n# 第 3 章：数据类型与变量\n\n在本章中，你将学习要处理的不同数据类型，以及如何给变量赋值。你还将学习不应作为变量名的保留字。\n\n## 整数 (int)\n\
  \n整数可以是正数或负数。`Zero` 也被整数。`int` 是 Java 编程中 integer 的缩写，你稍后会知道它的用法。如果你打印打印，不需要将其放在引号中。看看这个程序：\n\
  \n```java\n1 | public class IntPrinting {\n2 |   public static void main(String\
  \ []args) {\n3 |     System.out.println(10);\n4 |   }\n5 | }\n```\n\n它将产生结果：\n`10`\n\
  \n`int` 数据类型只能接受 `-2147483648` 到 `2147483647` 之间的值。只要你遵循给定的示例语法，放在 `System.out.println()`\
  \ 括号内的任何数字都会被打印。\n\n## 布尔值 (true 或 false)\n\n`boolean` 数据类型只能是 `true` 或 `false`。它不会产生其他答案。你不需要将其放在引号中，因为程序识别\
  \ `true` 和 `false` 为布尔值的合法值。看看示例程序：\n\n```java\n1 | public class BooleanPrinting\
  \ {\n2 |   public static void main(String []args) {\n3 |     System.out.println(true);\n\
  4 |   }\n5 | }\n```\n\n它将产生结果：\n`True`\n\n尝试将括号内的 `true` 替换为 `me`：\n\n```java\n\
  1 | public class BooleanPrinting {\n2 |   public static void main(String []args)\
  \ {\n3 |     System.out.println(me);\n4 |   }\n5 | }\n```\n\n它将产生结果：\n`/tmp/java_FlX6ZW/BooleanPrinting.java:3:\
  \ error: cannot find symbol`\n\n\n\n\n\n```\nSystem.out.println(me);\n         \
  \    ^\nsymbol: variable me\nlocation: class BooleanPrinting\n1 error\n```\n\n它无法识别\
  \ `me` 这个单词，因为它是一个字符串。在打印字符串时，你需要将其写在引号内。\n\n## 字符 (char)\n\n字符或 `char` 数据类型表示单个字符。所有值都必须包含在单引号中；否则你将收到错误信息。\n\
  \n看看下面的示例：\n\n```java\n1 public class BooleanPrinting {\n2     public static void\
  \ main(String []args) {\n3         System.out.println('r');\n4     }\n5 }\n```\n\
  \n它将给出以下结果：\n\n```\nr\n```\n\n`int`、`boolean` 和 `char` 是 Java 的基本数据类型。你以后会遇到更多这些类型。\n\
  \n## 使用变量\n\n在 Java 编程中，你可以将值存储在变量中，其他编程语言也有这样的功能。在 Java 中使用变量时，你需要指定数据类型。\n\n以下是你你不应该作为变量使用的\
  \ Java 关键字列表：\n\n| abstract | assert | boolean | break | long |\n| byte | case |\
  \ catch | char | private |\n| class | const | continue | default | short |\n| do\
  \ | double | else | enum | switch |\n| extends | final | finally | float | native\
  \ |\n| for | goto | if | implements | new |\n| import | instanceof | int | interface\
  \ | package |\n| transient | protected | public | return | super |\n| synchronized\
  \ | static | strictfp | throws | this |\n| volatile | while | try | throw | void\
  \ |\n\n记住你不应该用大写字母开始变量，尽管你可以在变量名中使用大写字母：\n\n`int myFavoriteNumber = 10;`\n\n你需要在开头写\
  \ `int` 来标识数据类型，`myFavoriteNumber` 是变量名，`10` 是赋值给它的值。\n\n尝试一下：\n\n1. `int` 变量 `mySampleNumber`\
  \ 必须等于 6。\n2. `boolean` 变量 `mySampleAnswer` 必须等于 `true`。\n5. `char` 变量 `mySampleLetter`\
  \ 必须等于 `L`。\n\n只需按照指令为每个变量赋值。当你运行程序时，你不会看到值打印在屏幕上。如果你想打印这些值，那么你需要在程序中添加 `System.out.println()`，你会怎么做？提示——每个你需要打印的变量都必须有自己的\
  \ `System.out.println()`，确保写的是正确的，而且它不应该是变量的实际值。\n\n就此这一次，你需要在程序中添加这些行：\n\n```java\n\
  8     System.out.println(mySampleNumber);\n9     System.out.println(mySampleAnswer);\n\
  10    System.out.println(mySampleLetter);\n```\n\n你将得到此输出：\n\n```\n6\ntrue\nL\n\
  ```\n\n现在你准备好迎接更具挑战性但也更充实的课程了。\n\n## 第 4 章：实用表格，随手备用\n\n本章包含了你需要随手备的不同表格，因为它们可以是你学习\
  \ Java 时的快速参考。如果你能快速记住它们，那会好得多。\n\n### Java 数值运算符\n\n大多数编程语言对它们的数值运算符使用相同的符号。如果你已经熟悉了某种现代编程语言，那么你会发现\
  \ Java 数值运算符的符号与你熟悉的编程语言大多相同。\n\n| JAVA 数值运算符 | 符号 | 示例 |\n| :--- | :--- | :---\
  \ |\n| 加法 | + | 8 + 7 |\n| 减法 | - | 2 - 9 |\n| 乘法 | * | 9*5 |\n| 除法 | / | 8/3 |\n\
  | 余数 | % | 2%3 |\n\n#### Java 比较运算符（也称为关系运算符）\n\n如果你熟悉其他编程语言的比较运算符，那么记忆下面的表格将很容易。\n\
  \n| JAVA 比较运算符 | 符号 |\n| :--- | :--- |\n| 小于 | < |\n| 小于等于 | <= |\n| 大于 | > |\n\
  | 大于等于 | >= |\n| 等于 | == |\n| 不等于 | != |\n\n### 布尔逻辑运算符\n\n布尔运算符与比较运算符不同，使用它们时要小心。\n\
  \n| 布尔逻辑运算符 | 符号 |\n| :--- | :--- |\n| 非 (NOT) | ! |\n| 与 (AND) | && |\n| 异或 (EXCLUSIVE\
  \ OR) | ^ |\n\n#### 真值表\n\n| '非' 的真值表 | E1 | E2 |\n| :--- | :--- | :--- |\n| 假 |\
  \ 真 | 假 |\n| 真 | 假 | 真 |\n\n| '与' 的真值表 | E1 | E2 |\n| :--- | :--- | :--- |\n| 假\
  \ | 假 | 假 |\n| 真 | 假 | 假 |\n| 真 | 真 | 真 |\n\n| '或' 的真值表 | E1 | E2 |\n| :--- | :---\
  \ | :--- |\n| 假 | 真 | 真 |\n| 真 | 假 | 真 |\n| 真 | 真 | 真 |\n\n| '异或' 的真值表 | E1 | E2\
  \ |\n| :--- | :--- | :--- |\n| 假 | 真 | 真 |\n| 真 | 假 | 真 |\n| 真 | 真 | 假 |\n\n`E1`\
  \ 表示表达式 1，E2` 表示表达式 2，与其他情况相同。如果你能立即记住这些表格会更好，这样当你需要确认某些事情时就不需要查阅。后续章节将需要这些表格。\n\
  \n### 第 5 章：数学运算与其他事项\n\n是时候用 Java 的方式来做数学运算了。你可以进行加、减、乘、除并获取余数（也称为模）。这并不难，一旦开始编写自己的程序，你就会很感激这些运算符。如果你还没有记住\
  \ Java 中不同运算符的符号，可以随时回到第 4 章查看运算符表格。\n\n## 尝试 Java 加法\n\n你可以创建一个这样的程序：\n\n```java\n\
  1 public class AdditionProgram {\n2     public static void main(String []args) {\n\
  3         System.out.println(5 + 9);\n4     }\n5 }\n```\n\n你也可以这样使用变量：\n\n```java\n\
  1 public class AdditionProgram {\n2     public static void main(String []args) {\n\
  3     \n4         int a = 5;\n5         int b = 6;\n6         System.out.println(a\
  \ + b);\n7     \n8     }\n9 }\n```\n\n## 尝试 Java 减法和其他数学运算\n\n以上面的示例为指南，创建一个用于减、乘除和余数的简单\
  \ Java 程序。你可以自己练习直到掌握它。练习得越多，你就发现它的挑战性越小。当这种情况发生时，你会发现操作 Java 变得更加舒适。\n\n## 比较运算符\n\
  \n比较运算符也称为关系运算符。它们比较数据类型，并始终给你一个布尔值，即真或假。如果你还不熟悉该表格，在你开始处理关系运算符时可以回去查看。\n\n比较运算符位于两个数据（操作数）之间。如果你打印这条语句：\n\
  \n```\nSystem.out.println(9<7);\n```\n\n你将得到 `false` 作为答案。Java 程序在遇到带有关系运算符的语句时，会识别出应该给出一个布尔答案。\n\
  \n\n\n\n等于 (`==`) 和不等于 (`!=`) 运算符也称为相等性运算符。在 Java 编程中，程序员可以使用相等运算符来测试数据的相等性。程序员可以测试\
  \ `int`、`boolean` 或 `char` 数据类型之间的相等性。请看下面的示例：\n\n```java\nchar sampleChar = ‘L’;\n\
  int sampleNum = 5;\nSystem.out.println(sampleChar==sampleNum);\n```\n\n上面的示例将在屏幕上打印‘false’，因为变量\
  \ `sampleChar` 中的值与变量 `sampleNum` 持有的值不同。\n\n## 一些可以尝试的练习\n\n现在你可以通过这个简单的编程练习来测试你学了多少内容。不要担心；如果你觉得有些挑战性，稍后会看到正确的代码。如果你看到错误信息，请阅读信息并尝试找出你犯的错误。有时候，一个简单的拼写错误就会危害整个程序，除非你立即发现它。请确保你正确使用了大写和小写。\n\
  \n1. 将‘this is my program’声明为你的类名；在编写程序时确保编写正确。\n2. 写一个单行注释，内容均可。\n3. 将值‘false’赋值给\
  \ boolean 变量 `isAnything`。\n4. 将值‘789’赋值给 int 变量 `isTooMuch`。\n5. 将 `isTooMuch`\
  \ 乘以 3 的值赋值给 int 变量 `isMuchMuch`。\n6. 打印 `isAnything`、`isTooMuch` 和 `isMuchMuch`\
  \ 的值。\n\n在看答案之前，尝试自己编写给定的示例。你也可以尝试更多练习。如果你完成了，可以查看下方的答案。你的结果一样吗？\n\n```java\npublic\
  \ class ThisIsMyProgram {\n    // this is my single line comment\n    public static\
  \ void main(String []args) {\n        boolean isAnything = false;\n        int isTooMuch\
  \ = 789;\n        int isMuchMuch = isTooMuch * 3;\n        System.out.println(isAnything);\n\
  \        System.out.println(isTooMuch);\n        System.out.println(isMuchMuch);\n\
  \    }\n}\n```\n\n既然你已经了解了 Java 基础，让我们更进阶。你需要准备好学习控制流。\n\n## 第 6 章：选择语句\n\nJava\
  \ 控制语句调节 Java 程序的执行顺序。你需要理解的有三类大类，它们是：\n\n1. 选择语句 `if`、`if-else` 和 `switch` 语句。\n\
  2. 循环语句 `while`、`do-while` 和 `for`。\n3. 转移语句 `break`、`return`、`try-catch-finally`、`continue`\
  \ 和 `assert`。\n\n如果你想改变默认的执行顺序，可以使用上述提到的任何一种语句（取决于程序的需求）。对于 Java 基础，我们将讨论选择语句以及一些循环语句。\n\
  \n### 选择语句\n\n该类别下包括：`if` 语句、`if-else` 语句和 `switch` 语句。\n\n### 处理 if 语句\n\n`if`\
  \ 语句告诉计算机，只有当 `if` 语句内的表达式证明为真时，才执行特定的代码块。如果语句为假，则该代码块将不会执行。程序将继续执行程序中的其余代码，前提是没有其他可能由于某些特定条件而触发执行的选择语句。\n\
  \n`if` 语句遵循以下语法：\n\n```\nif (<conditional expression>)\n<statement action>\n```\n\
  \n看下方的示例：\n\n```java\npublic class SampleIfStatement {\n    public static void main(String[]\
  \ args) {\n        int a = 20, b = 30;\n        if (a > b)\n            System.out.println(\"\
  a is greater than b\");\n        if (a < b)\n            System.out.println(\"b\
  \ is greater than a\");\n    }\n}\n```\n你认为这个程序会打印什么？\n\n### 理解 if-else（或嵌套 if）语句\n\
  \n与 `if` 语句一样，`if-else` 语句也命令计算机只有当语句内的表达式为真时才执行 `if` 语句下的特定代码块。如果语句为假，则必须执行 `else`\
  \ 语句，且只有在满足 `else` 选项时才执行。\n\n`if` 语句遵循以下语法：\n```java\nif (<conditional expression>)\
  \ {\n<statement action>\n} else {\n<statement action>\n```\n\n看这个示例程序：\n\n```java\n\
  public class IfElseDemo {\n    public static void main(String[] args) {\n      \
  \  int a = 20, b = 20;\n        if (a > b) {\n            System.out.println(\"\
  a is greater than b\");\n        } else if (a < b){\n            System.out.println(\"\
  b is greater than a\");\n        } else {\n            System.out.println(\"a is\
  \ equal to b\");\n        }\n    }\n}\n```\n\n如果你尝试分析它：\n第 4 行提供了程序运行所需的给定数据。\n\
  第 5 行有一个条件，如果 `a` 大于 `b`，它将打印“a is greater than b”。如果你看给定的数据，该语句为假，这促使程序执行下一个语句，即\
  \ `else` 语句。\n第 7 行提供了另一个选项或条件；遗憾的是，它仍然为假。\n剩下的就是打印“a is equal to b”。\n程序不会执行 `if`\
  \ 或 `else-if` 语句下的语句，因为这两个语句都是假的。然而，底部的 `else` 语句没有提供任何条件，并告诉程序打印“a is equal to\
  \ b”，这实际上是真的。\n在程序中使用给定的数据看看程序如何响应。\n\n### Switch\n\n`switch` 语句也称为 `case` 语句，你为用户提供不同的选项，程序将执行它。`switch`\
  \ 语句类似于 `if-else` 语句，其中展示了选项，程序将寻找第一个证明为真的选项。它将执行返回真的 `if-else` 选项下的语句。`switch`\
  \ 语句比 `if-else` 语句更有序。如果以有序的方式编码，维护程序更容易。如果你有很多选项要展示，就应该使用 `switch` 语句。\n\n这里是 `switch`\
  \ 语句的语法：\n```\nswitch (<non-long integral expression>) {\n  case 1:\n    <statement\
  \ 1>\n    break;\n  case 2:\n    <statement 2>\n    break;\n  case n:\n    <statement\
  \ 2>\n    break;\n  default:\n    <statement>\n} // switch 或 case 语句结束\n```\n\n\
  看示例程序：\n\n```java\npublic class SwitchCaseStatementDemo {\n    public static void\
  \ main(String[] args) {\n        int a = 10, b = 30, c = 20;\n        int response\
  \ = 0;\n        if (a > b && a > c) {\n            response = 1;\n        } else\
  \ if (b > a && b > c) {\n            response = 2;\n        } else if (c > a &&\
  \ c > b){\n            response = 3;\n        }\n        switch (response) {\n```\n\
  \n\n\n\n\n```java\ncase 1:\n    System.out.println(\"a is the biggest number\");\n\
  \    break;\ncase 2:\n    System.out.println(\"b is the biggest number\");\n   \
  \ break;\ncase 3:\n    System.out.println(\"c is the biggest number\");\n    break;\n\
  default:\n    System.out.println(\"Error encountered, try again\");\n}\n```\n\n\
  你需要初始化 `int response`，这是你的 `switch` 语句所需要的。如果你将其删掉，你的程序将无法运行。\n\n你可以更改需要处理的数据并查看结果。你可以尝试更改每个\
  \ `if-else` 语句下的条件，看看会发生什么。请确保在更改某些内容时，该更改与整个程序保持一致。否则，你的程序将无法运行或产生不同的结果。\n\n# 循环语句\n\
  \n循环语句包括：`while` 语句、`do-while` 语句和 `for`。\n\n## while 语句\n\n`while` 语句告诉程序在条件或语句保持真的情况下，继续执行下方的代码块。只有当语句变为假时，程序才会停止重复或执行代码指令。\n\
  \n这是 `while` 循环的语法：\n\n```text\nwhile (<loop condition>)\n<statements>\n```\n\n\
  这里是示例程序：\n\n```java\npublic class SampleWhileLoop {\n    public static void main(String[]\
  \ args) {\n        int count = 1;\n        System.out.println(\"Output Numbers 1\
  \ - 10\");\n        while (count != 11) {\n            System.out.println(count++);\n\
  \        }\n    }\n}\n```\n\n我们需要初始化 `int count` 为 `1`。在第 6 行中，它意味着当 `count` 已经等于\
  \ `11` 时，它将不再打印任何内容。在第 7 行 `count++` 告诉程序将 `count` 加 1，因此在下次循环中它将打印 `2`。它需要再次增加\
  \ `count`，并在下一次循环中将打印 `3`，依此类推，直到 `count` 等于 `11` 才会停止打印。\n\n## do-while 语句\n\n\
  `do-while` 循环或语句与 `while` 语句相似，不同之处在于程序在执行语句之前会先给出一个实际的条件进行检查。这可以给程序提供更多控制，因为它确保了循环至少执行一次。\n\
  \n这是 `do-while` 语句的语法：\n\n```text\ndo\n<loop body>\nwhile (<loop condition>);\n\
  ```\n\n这里是示例程序：\n\n```java\npublic class SampleDoWhileStatement {\n    public static\
  \ void main(String[] args) {\n        int sheep = 1;\n        System.out.println(\"\
  Output Numbers 1 - 10\");\n        do {\n            System.out.println(sheep++);\n\
  \        } while (sheep <= 10);\n    }\n}\n```\n\n## for 循环或语句\n\n`for` 循环适用于需要执行特定次数代码块的任务或程序。它就像只要条件保持为真，一直重复相同的过程。你需要初始化一个控制循环的计数器。\n\
  \n你需要遵循的语法如下：\n\n```text\nfor (<initialization>; <loop condition>; <increment expression>)\n\
  <loop body>\n```\n\n这里是示例程序：\n\n```java\npublic class SampleForLoop {\n    public\
  \ static void main(String[] args) {\n        System.out.println(\"Output Numbers\
  \ 1 - 10\");\n        for (int number = 1; number <= 10; number++) {\n         \
  \   System.out.println(number);\n        }\n    }\n}\n```\n\n看第 5 行，你需要初始化计数器 `number`，设置\
  \ `number` 必须小于或等于 `10` 的条件，并将 `number` 加 1。下一个语句打印计数器 `number`，它的初始值为 `1`。\n\n\
  当计数器 `number` 变为 `2` 时，它仍然小于 `10`，计数器加 1。下一个语句现在将打印 `2`。整个循环将重复，直到计数器 `number =\
  \ 10`。计数器仍会递加 1，最后一条语句将打印 `10`。\n\n一旦计数器 `number` 变为 `11`，它将不再满足计数器 `number` 应小于或等于\
  \ `10` 的下一个条件。程序将不再执行剩余的语句。\n\nJava 学习既简单又有趣。继续进步，发现更多你可以用 Java 编程能做的奇妙事情。\n\n#\
