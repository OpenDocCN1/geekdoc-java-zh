  \n## 花生酱香蕉奶昔\n\n### 配料：\n- 半杯花生酱\n- 一茶匙可可粉\n- 半杯脱脂牛奶\n\n将所有食材榨汁直到光滑。将奶昔倒入杯中即可享用。\n\
