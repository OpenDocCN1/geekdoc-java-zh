  JavaScript 于 1995 年发布，作为向网页中添加程序的方法。那时，它专门用于一种名为 `Netscape Navigator` 的网络浏览器。由于\
  \ JavaScript 取得的成功，现在所有主流浏览器都支持它。这种语言允许程序员创建现代 Web 程序——你可以在无需为每个操作重新加载网页的情况下与程序进行交互。另一方面，传统网站也使用\
  \ JavaScript 提供不同类型的功能和交互性。\n\n此时，你应该知道 JavaScript 与 `Java`（即今天领先的编程语言之一）没有关系。JavaScript\
  \ 在其存在的第一年被称为`“Mocha”` 和`“LiveScript”`。然而，由于 `Java` 编程语言非常流行，JavaScript 的所有者决定采用它的名字。这是一种营销策略，旨在利用\
  \ `Java` 的人气。\n\n## 代码–通用信息\n代码是构成计算机程序和网络应用程序的文本。这本电子书包含大量代码，因此你应该熟悉它们。计算机专家声称，编写代码和阅读代码是成为程序员的重要方面。因此，你应该阅读并理解书中包含的代码。如果你只是扫一眼代码示例，你将剥夺自己极佳的学习机会。\n\
  \n初学者在分析代码时可能会遇到困难。然而，如果他们仔细阅读说明，他们将理解 JavaScript 是如何工作的。最好的办法是用 `JavaScript` 解释器尝试代码示例。这样，一旦代码被编译为程序，你就可以立即获得有关代码外观的反馈。\n\
  \n# 第 2 章：JavaScript 的不同方面\n\n## 数据与位\n数据构成了数字世界。如果你访问计算机内部的世界，你会看到这样一件事：数据。你可以读取、编辑和生成数据。每当你保存新数据时，它都会以位的形式存储。这就是为什么存储的数据看起来相似的原因。\n\
  \n在编程中，位是指任何具有两个值的实体（通常由 0 和 1 表示）。你可以将任何数据转换为位序列。这种过程被称为数据到位转换。\n\n## 值\n典型的计算机系统涉及数十亿个位。这意味着处理数据可能会很困惑。如果你想处理如此大量的信息，你需要将其分成小块。在\
  \ JavaScript 中，这些信息被称为值。尽管所有值都是由位组成的，但它们有不同的类型和功能。JavaScript 支持六种值类型，即：字符串、数字、函数、对象、未定义值布尔值。\n\
  \n生成值只需指示它的名称。这个过程简单快捷。你不需要收集材料或支付任何费用。只需给出名称，砰！你就拥有了。\n\n本章将介绍 JavaScript 语言的基本元素（即运算符和值类型）。这些元素可以与\
  \ JavaScript 中的值交互。\n\n现在，让我们谈谈不同的值类型。\n\n## 数字\n属于这种类型的值是……你猜对了：数值。在编写 JavaScript\
  \ 应用程序时，你需要使用以下格式：\n\n```<number>\n```\n\n例如，假设你在 JavaScript 程序中输入了此值：`99`。这将在机器内存中为数字\
  \ `99` 创建位序列。\n\nJavaScript 语言使用 `64` 位来存储每个数值。用 `64` 位可以创建的模式是有限的，因此用它们表示的数字也是有限的。对于\
  \ `x` 个十进制数字，你可以表示的数字等于 `10x`。同样，由于你有 `64` 位数字，你最多可以表示 `264` 个数值。\n\n\n\n\n\n以前，计算机内存非常小，人们必须使用\
  \ 8 位或 16 位的位组来表示数值。由于内存不足，用户在操作 `JavaScript` 时经常会遇到“数据溢出”。然而，现在即使是基础台式电脑也拥有大量的内存。这意味着你可以轻松使用\
  \ 64 位序列——你再也不需要担心数据溢出的问题了。\n\n数值也可以存储负整数。在这里，其中一个位表示数值的符号（可以是“+”或“-”）。此外，`JavaScript`\
  \ 支持非整数（即小数）。为了实现这一点，某些位存储了数值中小数点的位置。\n\n你可以使用句号来编写小数和分数。这里有一个示例：\n\n```\n99.99\n\
  ```\n\n另一方面，对于极大或极小的数字，你可以通过添加一个“e”来使用科学计数法。只需在它后面加上正确的指数即可。这是一个示例：\n\n```\n9.999e9\
  \ = 9.999 x 109\n```\n\n整数（也称为整数）的计算是 100%准确的。然而，分数的计算并不准确。例如，“pi”的值无法通过有限的小数精确表示。许多数值丢失了准确性，因为只有\
  \ 64 位来保存它们。如果你想避免与分数相关的问题，你必须记住这些数字只是估计值。不要把它们视为精确的值。\n\n### 算术运算\n\n这是你对数值进行的操作。通常，算术运算（例如加法、除法、减法等）使用两个数值来生成一个新值。这里有一个用\
  \ `JavaScript` 语言编写的算术运算示例：\n\n```\n10 + 4 * 5\n```\n\n`*` 和 `+` 符号被称为“运算符”。`+`\
  \ 符号代表加法，而 `*` 代表乘法。你可以通过在两个数值之间放置运算符来生成一个新的数值。需要注意的是，`JavaScript` 中的算术运算遵循运算符优先级（也称为运算顺序）。在这里，你应该按照此顺序执行操作：括号、指数、乘法/除法以及加法/减法。如果你在上面的示例中应用运算符优先级，10\
  \ 将加到 `4 * 5` 的积上。\n\n你可以使用括号来修改运算顺序。例如：\n\n```\n(10 + 4) * 5\n```\n\n在 `JavaScript`\
  \ 语言中，`-` 符号代表减法，而 `/` 代表除法。你不需要担心运算符优先级。但是，如果你不确定，只需在代码中添加括号即可。\n\n### 特殊数字\n\n\
  在使用 `JavaScript` 时，你会遇到三个被称为数字的值，尽管它们的表现并不如此。这些特殊值是：`Infinity`、`-Infinity` 和 `NaN`。`-Infinity`\
  \ 和 `Infinity` 分别代表负无穷和无穷。通常，你不应该信任基于无穷的计算。这些计算在数学上是不可靠的。\n\n相反，`NaN` 表示“不是数字”。当你执行产生不精确或无结果的算术运算时，就会得到这个特殊值。例如，如果你将零除以零（即\
  \ `0 / 0`），就会得到 `NaN`。\n\n### 字符串\n\n你应该使用字符串来表示文本信息。你应该使用引号（即单引号或双引号）来包裹你的字符串。查看以下示例：\n\
  \n```\n‘Five little monkeys’\n```\n“I’m riding a bicycle”\n```\n\n在创建字符串时，确保你的引号是一致的。如果你使用双引号开始了一行，请使用相同的符号结束该行。\n\
  \n通常，你可以使用引号包裹几乎任何内容。在对引号之间放置内容，`JavaScript` 语言就会将其转换为可用的字符串值。\n\n### 如何“转义”字符\n\
  \n有时，你需要在语句中添加特殊字符。例如，在编写文本字符串时，你必须添加“换行符”（即按下回车键后得到的字符）。目前，`JavaScript` 要求程序员在引用文本中添加反斜杠。通过放置反斜杠，你是在告诉计算机下一个字符具有特殊功能或含义。这个过程被称为“字符转义”。\n\
  \n紧跟反斜杠后的引号将被视为行的一部分：它们不会终止字符串。如果你在反斜杠后放置 `n`，语句中将添加一个换行符。同样，由反斜杠引入的 `t` 将导致一个“制表符”字符（即你按下\
  \ Tab 键后得到的字符）。这里有一个简单的示例：\n\n```\n“I’m the first one\\nYou are the last”\n```\n\
  \n如果你执行上述字符串，将得到以下结果：\n\n```\nI’m the first one\nYou are the last\n```\n\n在某些情况下，你希望在代码中使用“普通的”反斜杠。你不希望它成为一个特殊工具。你可以通过在另一个反斜杠之前放置一个反斜杠来实现。也就是说，你正在转义一个反斜杠，以便将其转换为普通字符。分析以下示例：\n\
  \n```\n“You should use \\\\t to add a tab character in your statements”\n```\n\n\
  一旦编译并执行，该行将带给你：\n\n```\nYou should use \\t to add a tab character in your statements\n\
  ```\n\n字符串不是数字，所以你不能对它们执行数学运算。然而，你可以使用 `+` 对字符串进行拼接（即合并）。这里有一个示例：\n\n```\n“Jav”\
  \ +“Sc” +“ript”\n```\n\n 一元运算符\n\n在本节中，你将学习非符号运算符。为了开始讨论，让我们来看看 `typeof`。这个运算符可以帮助你识别值的类型。查看以下示例：\n\
  \n(Images/1771)\n\n上一节中的运算符需要两个值，而 `typeof` 需要一个。需要两个值的运算符是二元运算符。然而，处理单个值的运算符被称为一元运算符。\n\
  \n### 布尔值\n\n通常，程序员需要区分两个选项的值，例如“开启”或“关闭”，“是”或“否”。为了这个目的，`JavaScript` 语言支持一种类型为\
  \ `Boolean` 的值（具有两个值：true 和 false）。\n\n### 比较\n\n你可以使用以下方法创建布尔值：\n\n(Images/1772)\n\
  \n`<` 和 `>` 字符是用于表示“小于”和“大于”的常用符号。这两个符号都属于“二元运算符”。如果你在代码中应用它们，将得到一个显示为真的布尔值。你可以使用相同的方法比较字符串。\n\
  \n(Images/1773)\n\n字符串按字母顺序排列。此外，小写字母比大写字母“更重要”。这意味着 `a > b` 是对的。`JavaScript` 在排列字符串时还包含了特殊字符（例如\
  \ `-`、`!` 等）。比较过程遵循 Unicode —— 它为你编程可能需要的每个字符分配数字。此功能非常有用，因为它允许你通过将字符串转换为数字序列来存储。在比较字符串值时，`JavaScript`\
  \ 从左到右工作，它检查每个字符的数字序列。\n\n\n\n\n[content]\n\n在本节中，你将学习可以应用于 `Boolean` 值本身的各种不同操作。JavaScript\
  \ 语言提供了三种运算符，即：`and`、`not` 和 `or`。你可以使用这些运算符对 `Boolean` 值进行逻辑处理。正如此，它们被称为“逻辑运算符”。\n\
  \n### a) and\n\n`&&` 符号表示“与”。该运算符是二元运算符。此外，只有当你处理的两个值都为真（true）时，它才会提供“true”的结果。以下是一些示例：\n\
  \n![](img/image01776.jpeg)\n\n### b) or\n\n如果你想使用 `or` 运算符，应该使用 `||` 符号。如果你处理的值中其中一个为真，“或”将带给你一个“true”的结果。请查看下方的图片：\n\
  \n![](img/image01777.jpeg)\n\n### c) not\n\n你必须使用 `!`（即感叹号）来表示 `not` 运算符。这个逻辑运算符是单元元的：你可以将其用在单个值上。然而，“not”的独特之处在于它会反转你赋值给它的值。例如，`!false`\
  \ 将给你 true，而 `!true` 将给你 false。\n\n### 三元运算符\n\n这个逻辑运算符作用于三个不同的值。它被称为条件运算符，要求你在脚本中使用\
  \ `?` 和 `:`。接下来的代码将向你展示如何如何使用它：\n\n![](img/image01778.jpeg)\n\n放置在 `?` 左侧的值决定了将选择剩余值中的哪一个。如果为“true”，则选择第一个选项。然而，如果它为\
  \ false，则选择第二个选项。\n\n### 未定义值 (Undefined Values)\n\nJavaScript 语言支持两个特殊值来表示缺少有用值。这两个特殊值是\
  \ `undefined` 和 `null`。虽然这两个被视为合法的值，但它们不携带任何信息。\n\n通常，如果一个 JavaScript 操作无法生成有用的值，它会输出“undefined”，仅仅因为需要生成一个值。\n\
  \n根据专家介绍，`null` 和 `undefined` 之间的区别是 JavaScript 设计者的失误。这意味着这两个值在大多数情况下被认为是相等的。如果你必须处理这些值，只需将它们视为脚本中可交换的元素即可。\n\
  \n### 如何自动转换类型\n\n你可能知道 JavaScript 接受任何应用，甚至是那些执行不常操作。下面列出的表达式将清晰地演示这一概念：\n\n![](img/image01779.jpeg)\n\
  \n如果你将运算符应用于错误的值类型，JavaScript 将自动将该值转换为正确的类型。JavaScript 使用一组规则来执行此功能，这些规则有时是出意之外或不受欢迎的。程序员将这种自动过程称为“类型转换（type\
  \ coercion）”。正如此，第一行中的 `null` 被转换为 0，而下一行的“5”被转换为 5（即字符串到数字的转换）。然而，第三行尝试使用 `+` 符号连接值，因此\
  \ 1 变成了“1”（数字到字符串的转换）。\n\n如果你将一个非数字值（“six”或 `undefined`）转换为数字，你将得到 `NaN` 作为结果。在\
  \ `NaN` 值上应用数学运算将产生更多的 `NaNs`，所以如果你在预料之外或不符合预期的情况下获得此值，请检查你的代码中是否存在多余的类型转换。\n\n\
  ### 第 3 章：JavaScript 中的程序结构\n\n本章将教你“实际编程”。你将使用的 JavaScript 命令将超出你迄为止所使用的名词和短语。仔细学习这些材料，因为它们将帮助你在两周内掌握\
  \ JavaScript 的基础。\n\n#### 语句和表达式\n\n在上一一章中，你通过对现有值应用运算符来生成新值。似乎值的创建是 JavaScript\
  \ 程序中最重要的部分。然而，这只是这门强大语言的一小部分。\n\n创建值的代码部分被称为“表达式（expression）”。因此，任何你字面上编写的值（例如\
  \ 99 或“ninety-nine”）都属于这一类。即使将它们括在括号中，表达式仍然被称为表达式。同样，即使你使用单元、二元或三元运算符，表达式仍然是表达式。\n\
  \n上面的段落强调了基于语言的编程界面的优势。表达式在任何人类语言中都充当子句——它们可以在内部包含其他表达式。这意味着你可以混合 JavaScript 表达式来描述复杂的计算。\n\
  \n如果表达式等同于子句，那么 JavaScript 语句（statements）等同于完整的句子。基本上，一个 JavaScript 程序只是语句的集合。\n\
  \n最基本的语句类型是一个值后跟一个分号。根据这一原理，我们可以创建这个简单的程序：\n\n```\n0;\nfalse;\n```\n\n在 JavaScript\
  \ 中，上述示例被视为一个完整的程序。尽管如此，它是毫无价值的。语句只有当它们执行影响其他事物的操作时才有用（例如在屏幕上显示某些字符、改进编程环境等）。上面显示的两个语句仅仅创建了两个值（即\
  \ 0 和 false）。它们没有改变或改进任何东西。如果你执行此程序，将不会观察到任何显著的变化。\n\n#### 变量 (Variables)\n\nJavaScript\
  \ 程序如何保持自身？它们是如何存储东西的？你已经看到如何使用旧值创建新值。然而，该过程并没有修改预先的值。你还需要立即使用结果值，否则它们将消失。为了捕捉和持有值，JavaScript\
  \ 提供了变量。\n\n```\nvar example = 3 * 3;\n```\n\n在这个示例中，`var`（JavaScript 的关键字之一）指示该行将创建一个变量。关键字后面是变量名，如果你想赋值，则跟一个\
  \ `=` 号。该语句生成了一个名为 `example` 的变量，并用它存储 `3 * 3`。\n\n一旦你定义了变量，就可以在未来的语句中使用它的名称。从该表达式获得的值与你创建时赋值的值相同。请查看以下示例：\n\
  \n```\nvar three = 3;\nconsole.log(three * three);\n// -> 9\n```\n\n命名变量时，可以使用任何不是关键字的单词（例如\
  \ var）。你可以在变量中包含数字，但不能使用数字作为开头。例如，`programming1` 是有效的，但 `1programming` 则。此外，命名变量时不能使用空格。在特殊字符方面，你可以使用美元符号（即\
  \ `$`）和下划线（即 `_`）。JavaScript 不允许在变量名中使用符号符号。\n\n你可以更改给变量赋值。在 JavaScript 中，你只需对任何变量使用\
  \ `=` 号给它一个新的新值。\n\n```\nvar taste =“bitter”;\nconsole.log(taste);\n// -> bitter\n\
  \ntaste =“sweet”;\nconsole.log(taste);\n// -> sweet\n```\n\n通常，你应该将变量视为触而不是容器。变量抓住值，而不是包含它们。这意味着多个变量可以指向同一个值。\n\
  \n让我们分析一个简单的示例。你需要一个变量来记住约翰欠你多少钱。当他付给你 50 元时，你必须给现有变量分配一个新值。查看下面的几行：\n\n```\nvar\
  \ JohnnysDebt = 200;\nJohnnysDebt = JohnnysDebt– 50;\nconsole.log(JohnnysDebt);\n\
  // -> 150\n```\n\n如果你创建一个变量而不赋值，它将被视为是空的。如果你询问它所包含的值，它将带给你“undefined”。\n\nJavaScript\
  \ 允许你在一个 `var` 语句中包含多个变量。在使用此功能时，你应该使用逗号分隔变量。这是一个示例：\n\n```\nvar three = 3, four\
  \ = 4;\nconsole.log(three + four);\n// -> 7\n```\n\n#### JavaScript 保留字 (Reserved\
  \ Words in JavaScript)\n\n\n\n\n如之前讨论过的，在命名变量时不能使用关键字。然而，还有其他单词你不能作为变量名，因为 JavaScript\
  \ 已经为未来的开发保留了这些词。以下是该脚本语言中的一些保留字：\n\n`in`, `do`, `let`, `if`, `new`, `try`, `with`,\
  \ `case`, `void`, `while`, `false`, `yield`, `extends`, `delete`, `default`, `const`,\
  \ `debugger`, `class`, `break`, `finally`, `null`, `private`, `return`, `import`,\
  \ `protected`, `switch`, `super`, `interface`, `instanceof`, `throw`, `implements`\n\
  \n请记住，定义变量时不能使用上述单词。如果你忘记了这条简单的规则，在编写 JavaScript 程序时可能会遇到问题。\n\n## JavaScript 环境\n\
  \n“环境”一词指的是活动值和变量的集合。基本上，在启动 JavaScript 程序时，环境不能为空。环境持有了与语言本身相关的变量，而且通常还拥有允许与计算机系统交互的变量。例如，在网页浏览器中，存在各种函数和变量，用于检查和影响当前网站，并从鼠标和键盘读取输入。\n\
  \n## 函数\n\n默认的 JavaScript 环境涉及函数。函数是与值关联的计算机程序段。你可以应用这些值来激活所关联的程序。例如，在浏览器环境中，`alert`（即一个变量）包含一个显示对话框的函数。这里有一个示例：\n\
  \n```javascript\nalert(\"You are not authorized to access this page!\");\n```\n\n\
  你可以通过在生成函数值的 JavaScript 表达式后放置圆括号来执行函数。通常，你会指定包含你所需函数的变量名。通过在括号内包围值，你正在将这些值赋值给函数内部的程序。对于上一个示例，“alert”使用赋值的字符串在生成的对话框中显示消息。程序员在引用赋值给函数的值时使用“参数”（arguments）一词。\n\
  \n## “console.log”\n\n在尝试新的字符串或语句时，可以使用 `alert`。然而，由于它要求关闭生成的窗口，你可能会发现这样做既方便又耗时。正因如此，你可能想使用在本书前面的章节中见过的函数：`console.log`。几乎所有的\
  \ JavaScript 系统（例如 Node.js、网页浏览器等）都提供此函数，将参数传输到兼容文本的输出设备。\n\n涉及到网页浏览器时，代码的输出会进入\
  \ JavaScript 的控制台。虽然浏览器的 GUI 部分通常是隐藏的，但你可以通过按下某些键来访问它（即对于 Windows ，按下 `F12`；对于 Mac\
  \ ，按下 `Command-Option-I`）。如果你在查看此部分时遇到问题，可以运行设备内搜索“开发者工具”或“Web 控制台”。分析以下示例：\n\n\
  ```javascript\nvar a = 99;\nconsole.log(\"one hundred minus one is\", a);\n// ->\
  \ one hundred minus one is 99\n```\n\n如之前讨论过的，命名变量时不能使用句号或逗号。然而，上面的示例中包含了这些。其原因是\
  \ `console.log` 并不是一个普通的变量。它是一个 JavaScript 表达式，用于从存储在 `console`（它是一个变量）中的值中收集日志（log）信息。\n\
  \n## 返回值\n\n在屏幕上写入信息和显示对话框被称为“副作用”（side effects）。因为这些副作用，函数在 JavaScript 语言中非常重要。你也可以使用函数来生成值——在这种情况下，函数即使没有副作用也是有用的。例如，`Math.max`（一个\
  \ JavaScript 函数）接收无限数量的数值并指示最高的那一个。这里有一个示例：\n\n```javascript\nconsole.log(Math.max(1,\
  \ 2, 3, 4, 5));\n// -> 5\n```\n\n在 JavaScript 中，任何生成值的内容都被视为表达式。这意味着你可以在大型表达式执行函数调用。在下面的示例中，你将使用\
  \ `Math.min` 函数作为 `+` 运算符的输入：\n\n```javascript\nconsole.log(Math.min(1, 2) + 98);\n\
  // -> 99\n```\n\n## 第 4 章：关于 JavaScript 函数更多信息\n\n在上一节中，你学习了如何创建和调用函数值。本章将帮助你进一步理解这个重要主题。根据专家程序员的说法，函数是你使用\
  \ JavaScript 主要工具。函数是强大的工具，可以帮助设计大型程序、减少冗余、命名子程序并为每个子程序提供安全的隔离。这意味着如果你想有效地使用 JavaScript，就必须掌握函数。本章将帮助你在两周内学会这种脚本语言。\n\
  \n许多人应用函数来定义新的词汇。这意味着你可以使用它们来创建单词并分配含义。\n\n一个普通的英语母语者词汇量大约有 20,000 个单词。然而，编程语言通常没有那么多内置命令。这意味着编程中的词汇比人类语言中的词汇更精确。如果你想减少冗余，就必须将自己的单词加入\
  \ JavaScript 并创建你自己的词汇。\n\n## 如何定义函数\n\n定义函数就像定义普通变量。唯一的区别在于你正在赋值的值是一个函数。例如，下面的代码定义了一个名为“square”的变量。该变量指向一个函数，该函数生成任何赋值数字的平方。\n\
  \n![](img/image01780.jpeg)\n\n创建函数时，你应该用 `function` 关键字开始表达式。每个函数都有两个部分：(1) 函数体和\
  \ (2) 参数。函数体存储了你在调用时想要执行的 JavaScript 语句。此外，你应该始终用括号包围函数体（即使它只有一个语句）。\n\n另一方面，参数是定义中列出的名称。函数可以有一个或多个参数。实际上，你甚至可以创建一个没有任何参数的函数。为了帮助你理解这个概念，让我们创建两个函数：`makeNoise`\
  \ 和 `power`。\n\n![](img/image01781.jpeg)\n\n你可以看到，`makeNoise` 没有参数。同时，“power”有两个参数（即\
  \ `base` 和 `exponent`）。\n\n## JavaScript 中的参数和作用域\n\n函数的参数行为类似于普通变量，尽管它们的原始值来自程序员，而不是它们所关联的函数。\n\
  \n这是任何函数的一个重要属性：在函数内部创建的所有变量（甚至是参数）都是局部的。这意味着，例如 `power` 语句中的 `result` 在每次函数被调用时都会刷新。这些独立的重复操作不会相互影响。\n\
  \n重要的是，这种“局部性原则”仅适用于使用 `var` 定义的变量和参数。此外，你应该在函数体内定义变量和参数。定义在函数外的变量被称为全局变量，因为可以在整个\
  \ JavaScript 应用程序中可见并访问。如果没有对应的局部对应项，你可以在函数内部访问全局变量和参数。\n\n下面的代码说明了这一概念。它声明并调用了两个给“x”赋值的函数。第一个函数将该变量定义为局部的。而第二个函数则不是。这意味着如果你在函数内部引用\
  \ `x`，你指向的是全局 `x`（如示例的第一行所示）。\n\n![](img/image01782.jpeg)\n\n\n\n此功能可以帮助你防止不同函数之间意外的引用或交互。如果\
  \ `JavaScript` 允许你在整个程序中共享所有变量，你将不得不花费大量精力和精力确保名称不重复。重用变量名可能会对你的代码产生意想不到或不理想的影响。因此，它可能会破坏你正在编写的程序。\n\
  \n由于这种语言将局部变量视为仅存在于其各自函数内部，因此它可以将各个函数视为不同的独立世界。每当你编写单个函数时，`JavaScript` 不需要担心整个应用程序。\n\
  \n## 嵌套作用域\n\n除了定义局部变量和全局变量之外，`JavaScript` 还使用其他方法来区分不同类型的函数。例如，你可以在现有函数内部创建函数。这种技术产生了多个级别的局部性。\n\
  \n例如，下面的函数包含了两个函数：\n\n![](img/image01783.jpeg)\n\n这两个函数（即 `flat` 和 `mountain`）都可以访问\
  \ `result` 变量，因为它们被放置在声明该变量的函数内部。然而，它们无法访问对方的变量。这意味着位于函数外部程序环境无法访问其包含的变量。\n\n使用过其他语言的程序员可能会认为，他们可以使用大括号包裹代码块来创建新的局部环境。但在\
  \ `JavaScript` 中，只有函数可以生成新的作用域。\n\n## 将函数作为普通值\n\n通常，函数变量作为程序某些部分的名称。你不能修改现有的函数变量：一旦你定义了它们，它们就会阻止你执行任何后续修改。这种特性可能会导致关于名称及其所指函数之间的产生混淆。\n\
  \n显然，函数和变量是两个不同的东西。函数值可以执行普通值可以做的事情——你可以在复杂表达式中调用并使用它们。你可以更改函数值的位置，将其作为函数的参数传递等。同样，包含函数的变量仍然被视为普通变量。这意味着你可以给它们赋予新值。\n\
  \n### 声明\n\n`JavaScript` 提供了一种快速简单的方法来声明函数。你只需要使用 `function` 关键字开始你的语句即可。例如：\n\n\
  ![](img/image01784.jpeg)\n\n上面的语句被称为“声明”。它定义了一个名为 `square` 的变量，并赋予它一个特定的函数。这个例子很容易理解。然而，这种定义函数的方法有一个微妙之处：\n\
  \n![](img/image01785.jpeg)\n\n最后一个示例运行得完美，即使该函数被声明在赋值给它的代码下方。这段代码是有效的，因为声明忽略了从上到下的语句结构。你实际上可以将声明移动到作用域的顶部，以便局部代码可以访问它。此功能非常有用，因为它允许你以有意义的方式安排代码，而无需定义所有受影响的函数。\n\
  \n### 可选参数\n\n`JavaScript` 语言接受下面的代码。调用时不会遇到任何问题。\n\n```\nalert(“Hi”,“Good Morning”,“How\
  \ are you?”);\n```\n\n从官方来说，`alert` 函数只接受一个参数。然而，如果你使用上面的示例代码调用它，它不会报错。它只会接受第一个参数（即“Hi”）并忽略其余部分。\n\
  \n这种编程语言在考虑分配给函数的参数数量时是“开放心态”的。如果你分配了太多的参数，它会接受有效的参数并忽略其他的。然而，如果你的参数不够，`JavaScript`\
  \ 将通过为适当的参数分配 `undefined` 来完成你的语句。\n\n## 结论\n\n再次感谢你下载这本书！\n\n我希望这本书能够帮助你在两周内学会\
