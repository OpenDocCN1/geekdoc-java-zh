  \n# 字典 (Dictionaries)\n\n字典与列表相似。与元组不同，字典允许用户修改其内容。这意味着你可以添加、编辑和删除任何字典的元素。列表和字典的主要区别在于：字典不会将其元素绑定到任何数字上。\n\
  \n字典的元素有两个方面：(1) 键（key）和 (2) 值（value）。如果你调用字典的键，你将获得与特定键相关的值。程序员将列表视为特殊的字典，其中数字代表每个元素的键。\n\
  \n## 如何使用字典\n\n在声明字典时应使用大括号。此外，在声明字典元素时，应使用以下格式：(1) 输入元素的键，(2) 添加冒号，以及 (3) 赋值值。这是一个示例：\n\
