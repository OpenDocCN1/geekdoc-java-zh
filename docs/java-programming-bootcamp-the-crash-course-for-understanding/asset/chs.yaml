  \ Java，也会非常有帮助。\n\n## Java 的一点历史\n\n詹姆斯·高斯林（James Gosling）创立了太阳微系统公司（Sun Microsystems）。1991\
  \ 年 6 月，高斯林启动了 Java 语言项目。它最初被称为 Oak，后来改为 Green。最后，它没有特殊原因被命名为 Java。Java 1.0 于 1995\
  \ 年发布。目前的 Java 标准版是 Java SE8。\n\n2007 年，Java 的核心代码作为免费开源软件发布，除了太阳微系统不拥有版权的一小部分代码外。\n\
  \n## Java 的若干优势\n\nJava 是面向对象的，这意味着在 Java 世界中，一切都是对象。它可以轻松地进行扩展。\n\n它还被认为是平台无关的，不像\
  \ C 和 C++ 等大多数编程语言。当你编译 Java 时，你并不是将其编译成特定平台的机器码，而是将其编译成字节码（byte code）。该字节码在网络上传输并由虚拟机进行解释。\n\
  \nJava 简单，易于学习。然而，对你最好对面向对象编程（OOP）概念有更深入的理解，这将让你更容易掌握 Java。面向对象编程相对于过程化编程的主要优势之一是它允许程序员创建不同的模块，即使添加了新类型的对象，这些模块也不需要修改。当你学习\
  \ Java 编程并增强 OOP 相关知识时，会有更深的理解。\n\nJava 具有安全特性；它能够帮助你创建一个防篡改、无病毒的系统。\n\nJava 编译器可以生成架构中性的对象文件格式。编译后的代码可以在带有\
  \ Java 运行时系统的许多处理器上执行。这使得 Java 具有可移植性。\n\nJava 是动态的；许多程序员认为它实际上比 C++ 更动态。Java 可以有效地适应任何环境。Java\
  \ 还有更多优势，当你学习 Java 编程并进一步了解 OOP 的魅力时，你会发现所有的优势。\n\n## 开启 Java 编程世界之旅所需的物品\n\n你需要一台由\
  \ Intel Core2uo 处理器驱动的电脑，并且至少有 1GB 内存。这些实际上是你今天可以买到的最基础、甚至更低的电脑配置。如果你的电脑可以玩游戏，那么运行\
  \ Java 就足够了。\n\n你的操作系统（OS）应该是 Windows XP、Windows 7、Windows 8 或 Linux。本书提供了上述平台的设置路径，尽管建议使用提供的链接进行在线编码。\n\
  \n如果你选择在电脑上安装 Java，你需要选择 JDK8。你还需要记事本或其他编辑器。\n\n## 本地环境\n\n如果你想为 Java 编程创建一个本地环境，你需要访问此[链接](http://www.oracle.com/technetwork/java/javase/downloads/jdk8-downloads-213315.html)\
  \ 免费下载 Java，确保选择与操作系统兼容的版本。\n\n选择适合你操作系统的 Java 后，按照指令正确下载 Java 并运行 `.exe` 文件，这将允许你在电脑上安装\
  \ Java。安装完成后，你需要为特定平台设置路径。\n\n### Windows 路径\n\n假设你已在电脑上成功安装 Java，查看目录时如下：\n\n`c:\\\
  Program Files\\java\\jdk`\n\n将光标指向“我的电脑”并点击。打开后，右键点击它并选择“属性”（位于底部）。\n\n在“高级”选项卡下，你会看到一个名为“环境变量”的按钮，点击它。\n\
