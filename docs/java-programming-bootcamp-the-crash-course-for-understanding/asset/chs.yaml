  \n## 元组 (Tuples)\n\n元组和列表相似，区别在于：元组是不可编辑的。创建元组后，你无法以任何方式对其更改。你不能扩展、编辑或删除元组内的元素。如果你忽略这种不可变性，你可以说列表和元组是相同的。\n\
