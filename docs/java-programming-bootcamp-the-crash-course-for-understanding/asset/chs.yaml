  \n# 第 1 章 – 概述：DASH 减肥饮食解决方案\n\n在开始之前，了解 DASH 计划是什么以及它与其他计划有何不同至关重要。\n\n## 什么是 DASH\
  \ 饮食？\n\nDASH 代表“终止高血压的饮食方法”（Dietary Approaches to Stop Hypertension）。它基本上是一项由`美国国家健康研究所`支持的饮食计划。它的制定目的是帮助控制和消除该国的高血压或“高血压症”。\n\
  \n这种饮食中包含什么？嗯，采取这种饮食的人被鼓励摄入更多的水果和蔬菜以及无脂或低脂乳制品。鱼类、禽肉、全谷物以及坚果也是允许的。然而，该饮食限制的内容包括：任何高脂肪食物、红肉、甜味食品和酒精饮料。\n\
  \n该计划的开发引发了受高血压困扰的`美国`居民的兴趣。因此，NIH 对随机受试进行了测试，并资助了各医院、研究机构和大学的研究，以确定这种饮食计划的可能性。结论是，DASH\
  \ 饮食在降低血压和其他心血管疾病方面是有效的。\n\n由于饮食的核心主要是正确的食物，因此它经历了不同的版本。现在有专门针对健康的 DASH 饮食、针对素食者的\
  \ DASH 饮食以及一种针对减肥的特定 DASH 饮食计划，本书将重点关注后者。\n\n## DASH 研究：起源\n\n正如前面提到的，DASH 代表“终止高血压的饮食方法”。这在美国已经开发了了\
  \ 50 多年。该国高血压病例的增加促使政府拨付资金开发这种饮食。\n\n在`1990 年代`，`美国`主要的健康机构和研究中心合作，开展了关于 DASH 规模最广泛的研究。该研究侧重于人们可以在超市或杂货店买到的食物，使这种饮食变得易于坚持。\n\
  \n以下是 DASH 研究过程的简单回顾：\n\n基本上，该研究利用两个实验组和一个对照组进行，如下：\n\n*   **第 1 组**：这一组被称为“蔬菜和水果”组。这个实验组摄入更多的蔬菜和水果，较少的零食和糖分类物品。\n\
  *   **第 2 组**：这个实验组被指示摄入大量的蔬菜、水果以及乳制品（低脂）。通过这种方式，受试者获得了更多的钾、镁和其他营养。这种饮食也富含蛋白质，因为禽肉和坚果也被高度鼓励。然而，被禁止的食物包括甜味食品/饮料和红肉。\n\
  *   **对照组**：这一组被指示像典型的美国人那样进食。基本上，这种饮食充满了脂肪和蛋白质，而镁、钾和其他钙等矿物质含量较低。\n\n### 这项研究的结果是什么？\n\
  \n裁定是：饮食习惯对人有影响，特别是对患有各种程度高血压的人。在研究中，`组 1`的血压下降了，但没有`第 2 组`的人那么显著。事实上，第二组中没有高血压的个体也经历了血压下降。\n\
  \n## DASH 钠\n\n这项研究是在 DASH 研究成功后进行的。其目的是确定在低盐饮食的情况下，DASH 饮食是否能进一步降低血压。研究的目的是研究低盐水平如何影响\
  \ DASH 饮食，以及饮食对不同钠摄入水平的反应。\n\n研究参与者包括采用美国平均饮食的人和采取 DASH 饮食组。每个组的参与者被要求在不同的盐分水平下进行\
  \ 30 天的饮食，包括：`每天 1500mg`、`每天 2400 mg` 和`每天 3000 mg`。\n\n### 结果是什么？\n\n结果是：对照组和采取\
  \ DASH 饮食的人在盐分水平降低时，血压都下降了。然而，当盐摄入量减少到`每天 1500 mg`时，下降最为显著。\n\n根据这一结果，研究人员建议必须减少每天的盐量。根据`美国`的饮食指南，美国人每天应摄入`2300mg`，而高血压患者应仅摄入`1500\
  \ mg`。\n\n## 用于减肥的 DASH 饮食\n\n虽然 DASH 饮食最初是为了帮助治疗高血压，但研究也表明它是一个极佳的减肥饮食计划。这种饮食在促进内外健康的同时也促进了减肥。效果可以在\
  \ 14 天内快速获得，且依靠大量的天然食物——无需挨饿！\n\n这种饮食的重点是天然或真实的食物——这种饮食中没有防腐剂和添加剂的位置。它更多是水果和蔬菜，以及适量的蛋白质。根据这一原则，它被认为是最完美的减肥饮食计划。允许的食物既饱腹又悦口。而且是任何人都可以终身遵循的。它更像是一种具有巨大益处的常规饮食。\n\
  \n## 它是如何工作的 – 第 1 阶段和第 2 阶段\n\nDASH 饮食分为两个阶段：\n\n*   **第一阶段**：这是饮食计划的前 14 天。在这个阶段，重点是低碳水、低糖和高蛋白食物。谷物和水果暂时不允许。目标是重新调整代谢，并增强身体燃烧热量的天然能力。这有助于加速减肥。\n\
  *   **第二阶段**：在这个阶段重新引入全谷物、富含淀粉的蔬菜以及水果，以增强身体控制高血压和体重增加的能力。\n\n\n\n\n坚持 DASH 饮食可以让任何人变得更健康、更强，而无需经历痛苦的节食。通过这种饮食，你实际上可以享受以下内容：\n\
  \n-   一日三餐，中间加点零食——不需要节制。\n-   大量享受健康且饱腹的蔬菜，同时保持低热量摄入。\n-   吃肉类，尤其是真正让你感到饱腹的瘦肉。\n\
  -   用无脂和低脂乳制品满足渴望。\n-   用新鲜水果缓解对甜食的渴望。\n-   吃脆美味的坚果和种子，它们有助于减肥和心脏健康。\n\n最重要的是，通过遵循\
  \ DASH 规则，看到你的体重下降，健康状况提升。\n\n# 第 2 章 – DASH 饮食基本指南\n\nDASH 饮食计划非常简单，易于遵循。它利用日常食物，即在超市里很容易看到的食物。该饮食由来自各种食物组的物品计划组成。份量实际上取决于每日的热量需求，这些需求可以根据体力活动和年龄来计算。\n\
  \n对于本指南，基础热量需求范围在每天 1600 到 2600 卡路里之间：\n\n## 全谷物\n**理想份量：** 每天 6 到 8 份\n\n全谷物是 DASH\
  \ 减肥计划的基础。这类食物富含纤维和营养，同时低脂肪。然而，你应该只消耗“全”谷物，否则这种饮食将不起作用。理想情况下，你应该只吃天然且未经加工的谷物。\n\n\
  尽管消耗谷物会导致体重增加常见原因之一是添加了高乳脂或高钠的酱料。尽可能减少在谷物中添加脂肪和盐类调味。\n\n**示例：** 1 份谷物包括：½ 杯燕麦片/糙米、一片全麦面饼、½\
  \ 杯全谷物面条或意面。\n\n## 水果\n**理想份量：** 每天 4 到 5 份\n\n虽然水果不是 DASH 第一阶段的一部分，但它们是第二阶段的重要组成部分。大多数水果低脂，富含纤维以及镁、钾等营养元素，可以减少对甜食的渴望。\n\
  \n水果可以通过多种方式食用，但最好是新鲜的。因此，饭后吃 1 或 2 份水果完全无害。带皮食用水果也是理想的，以最大化纤维摄入。果汁形式的水果也可以接受，只要不含糖。\n\
  \n**示例：** 一份等同于半杯浆果、½ 杯无糖果汁或一个中等大小苹果或其他水果。\n\n## 蔬菜\n**理想份量：** 每天 4 到 5 份\n\n在进行用于减肥的\
  \ DASH 饮食时，你将通过蔬菜获得大部分营养素。最佳选择是那些富含维生素、纤维和镁等营养的蔬菜。\n\n不要把自己局限于主要是凯撒沙拉或其他蔬菜配菜。此外，不要把蔬菜看作难吃的，因为有很多蔬菜实际上可以成为主菜。在本书的后面，你将学习适合这种饮食的易烹饪蔬菜食谱。只需确保蔬菜中等熟，以带出独特的风味。\n\
  \n**示例：** 半杯黄瓜或胡萝卜的效果与 1 杯生菜（如生菜叶）一样。\n\n## 蛋白质 – 鱼类和瘦肉\n**理想份量：** 每天 2 份\n\n无疑，肉类含有大量的蛋白质、维生素\
  \ B 以及铁。然而，它们也高胆固醇、脂肪，最重要的是高热量。尽管如此，瘦肉必须包含在饮食中。\n\n但瘦肉不应该成为你餐食的中心，就像你和大多数人习惯的那样。一个很好的开始方法是将它们作为配菜，同时增加蔬菜的摄入。可能的话，避免炸肉，并坚持不使用过多脂肪的烹饪技巧，如烤、煮等。\n\
  \n**示例：** 鱼类和鸡肉、火鸡肉和其他禽肉都可以。2 份等同于 3 盎司或大约 3 个火柴盒大小的块。\n\n## 乳制品\n**理想份量：** 每天 2\
  \ 到 3 份\n\n乳制品在某些饮食计划中被禁止，但在 DASH 中不是。事实上，推荐食用奶酪、酸奶、开菲乳和牛奶。这些食品不仅有助于改善骨骼健康和消化，还有助于预防癌症。\n\
  \n在其他计划中，乳制品被认为对胃不好且脂肪高。然而，上述乳制品要么是无脂的，低脂。因此，你摄入的脂肪是健康的种类。低脂乳制品也有低钠和低热量含量。\n\n**示例：**\
  \ 一份乳制品等同于一杯酸奶、牛奶或 ¼ 杯奶酪。\n\n## 豆类和坚果\n**理想份量：** 每周 4 到 5 份\n\n豆类、坚果和各种类型的种子富含蛋白质、纤维、营养素以及脂肪酸——欧米伽-3。它们还含有大量的植物化学物质，有助于身体避免心血管疾病。\n\
  \n将此类食物纳入饮食的最好方法是控制份量大小。例如，坚果很好吃，你可能在不经意间吃掉一把。好几手坚果也等同于高热量。减少热量的一种好方法是选择无盐品种。\n\n\
  **示例：** 一份等同于半杯煮豆、1/3 杯坚果或 2 到 3 汤匙种子。\n\n## 糖 – 甜点\n**理想份量：** 每天 5 份\n\nDASH 饮食的美之处在于它没有剥夺你对生活的简单快乐。所以，不要忘记甜点，因为你被允许偶尔吃甜食。\n\
  \n虽然新鲜水果必须是你餐食的中心，但允许食用黑巧克力，因为它对心脏健康。其他可以满足你甜食渴望的东西包括高可可量的甜点、冰沙和糖果。你也可以摄入人工甜味剂，但要控制量，不要过度依赖。\n\
  \n**示例：** 一份等同于一汤匙果酱、½ 杯冰果或冰沙、一杯柠檬水饮料、3 到 4 小块黑巧克力和 8 到 10 颗糖果。\n\n## 油和脂肪\n**理想份量：**\
  \ 每天 2 到 3 份\n\n你应该知道，正确脂肪的益处大于坏处。健康的脂肪促进维生素吸收，帮助增强免疫系统并改善心血管健康。\n\n强烈建议摄入不饱和脂肪，而不是与肥胖和心脏疾病相关的反式脂肪和饱和脂肪。将每日摄入控制在\
  \ 6%。\n\n**示例：** 一份等同于一汤匙蛋黄或 2 汤匙沙拉酱、1 汤匙油。\n\n## 钠\n**理想份量：** 每天 1500 到 2300 毫克\n\
  \nDASH 饮食在钠方面相当严格。重点是上述低钠食物。虽然 DASH 饮食允许达到标准水平，即每天 2300 毫克，但遵循较低的限额更好。为了获得最佳指导，建议与医生讨论你的钠摄入，特别是如果你有已知的心血管疾病时。\n\
  \n# 第 3 章 – DASH 饮食及其特征\n\n在 DASH 饮食中不需要进行饥饿和剥夺性——它仅仅是一种更健康的饮食方式，让你体验长期的健康益处。事实上，它不是那种包含视频\
  \ CD 之类内容的饮食计划。\n\n此外，这种饮食不仅鼓励健康的饮食习惯，而且符合这种饮食的食谱还提供了健康零食的建议——这有助于每个人避免加工食品和垃圾食品。DASH\
  \ 整体是一种通过降低盐分摄入并增加维生素、矿物质和必需营养素的摄入来实现健康生活和饮食的整体方法。\n\n\n\n\n为了帮助您更好地了解这种饮食法，请快速查看其特征：\n\
  \n## DASH 饮食富含纤维\n这种饮食法通过增加蔬菜、水果以及各种全谷物的摄入，促进高纤维摄入的生活方式。通过这种方式，你可以在获得饱腹感的同时，帮助你的身体对抗高血压。\n\
  此外，增加纤维的摄入有助于调节血糖水平，也有助于减肥。\n\n## DASH 饮食富含矿物质和维生素\n身体所需的必需维生素和矿物质可以在蔬菜、水果和全谷物中找到。基本上，大多数全性食品和未加工食品都富含优质营养。\n\
  此外，大多数水果和蔬菜含有高量的钾和镁，这非常有助于维持血压在正常水平。\n\n## 健康的脂肪\n摄入优质脂肪是 DASH 饮食的关键——这种饮食法的目标是尽可能减少对坏脂肪的摄入。脂肪主要分为两类：坏脂肪和好脂肪。在垃圾食品、加工食品以及黄油和其他脂肪制品中找到饱和脂肪和反式脂肪被认为是“坏蛋”。\n\
  这些脂肪来源必须用健康的脂肪来源代替，例如来自鲑鱼、金枪鱼等鱼类的 omega 3 脂肪酸、种子、坚果，以及零脂或低脂乳制品和禽类等瘦肉。\n\n## 减少盐摄入\n\
  平均而言，美国人每天的钠摄入量为 3500 毫克。DASH 饮食在盐分方面更为严格，因为研究证明减少盐摄入对降低血压和减轻有显著效果。\n通过 DASH 饮食，个人每天允许摄入\
  \ 1500 毫克到 2300 毫克的盐。应该遵循这一点以获得这种饮食的绝佳益处。\n\n## DASH 对糖、咖啡因和酒精说“不”\n如果你想成功地采用 DASH\
  \ 饮食，大部分时间需要放弃糖。因此，请忘记过度饮用你最喜欢的碳酸饮料，或者吃掉你在超市货架上随手拿的加工糖果零食。这种饮食的核心在于做出更健康、饱腹且满意的选择。\n\
  此外，该饮食建议减少或完全消除咖啡因和酒精，因为这些东西营养价值很或没有，且含有大量的糖，可能导致高血压、糖尿病等疾病。\n\n## 热量和钠摄入\nDASH\
  \ 饮食实际上并没有很多限制。其原则简单，食物选择非常容易获得。任何进行这种饮食的人每天最多可以采用 3100 卡路里，或者选择每天最低 1500 卡路里。\n\
  钠的情况也是如此——可以选择每天摄入 1500 毫克盐，也可以选择较高的 2300 毫克。当然，你每天需要摄入的钠和热量取决于某些因素，如下：年龄、当前体重、体力活动、任何现有状况（如高血压等）。\n\
  理想情况下，超重个人应选择较低的钠和热量摄入，体重处于正常范围内的人则反之。在患血压的情况下，低盐饮食至关重要。为了获得最佳建议，强烈建议咨询医生或营养师。\n\
  \n## 第 4 章 – DASH 饮食早餐创意\nDASH 提倡适量的健康饮食。这让跳过早餐变得没有借口。这餐早餐能为你的一整天做好准备。本章将分享非常适合早餐的美味食物。\n\
  \n### 食谱 1：西兰花奶士煎蛋\n这可以搭配一杯低脂牛奶或零脂牛奶、一片全麦吐司或你喜爱的蔬菜水果一起吃。\n你需要：\n- 4 个鸡蛋\n- 1/3 杯切达芝士（低脂）\n\
  - 2 到 3 杯西兰花花蕾\n- 1/3 杯帕玛森芝士（碎）\n- 1 杯蛋蛋白\n- 少许盐和胡椒调调味\n- 1 汤橄榄油\n制作方法：\n- 将西兰花花蕾煮或蒸\
  \ 4 到 6 分钟\n- 将西兰花压碎成小块，然后用胡椒和盐调味。\n- 热锅，淋入橄榄油。\n- 将 4 个全蛋、那杯蛋蛋白和帕玛森芝士混合。\n- 将蛋液淋在西兰花上并倒入煎锅中。\n\
  - 撒上切达芝士并双面翻煎。\n- 烹饪 2-3 分钟即可享用。\n\n### 食谱 2：豆腐辣椒惊喜\n在 DASH 饮食的第一阶段，你需要储备蛋白质。豆腐是极佳的蛋白质来源，但与肉类不同，它健康得多。\n\
  你需要：\n- 500 到 600 克老硬豆腐\n- 2 到 3 瓣大蒜，切末\n- 1 个大洋葱，切碎\n- 1 个辣椒（波灯椒），切碎去籽\n- 1 杯碎西红柿\n\
  - 1 到 2 汤匙柠檬汁\n- 少许干牛至、孜然和辣椒粉\n- 少许盐\n- 1 汤橄榄油\n制作方法：\n- 用厨房纸吸干豆腐，在压碎前切成小块。\n- 热锅并淋入橄榄油。加入洋葱、大蒜和胡椒。\n\
  - 烹炒 3 到 5 分钟后加入香料。将碎豆腐放入锅中，然后小火。\n- 在间隙搅拌时让其煮熟。关火前，加入柠檬汁和西红柿。享用！\n\n### 食谱 3：简单\
  \ DASH 金枪鱼沙拉\n这是一道快速且无需烹饪的 DASH 食谱，一定能帮助你减肥。\n你需要：\n- 一罐低盐金枪鱼\n- 2 汤匙蛋美酱\n- 1 个鸡蛋，煮熟后切碎\n\
  - 一把生菜\n- 半 杯切芹芹\n- 半 杯樱桃西红柿\n制作方法：\n- 将金枪鱼和蛋美酱在一个碗中混合。\n- 在盘子里放入生菜、西红柿和芹芹。\n- 将金枪鱼混合物放在蔬菜上。享用！\n\
  \n### 食谱 4：健康法式吐司\n这道食谱使用了全麦面包，最好搭配一杯低脂或零脂牛奶，以增加蛋白质和营养。\n你需要：\n- 4 片全麦吐司\n- 半 杯低脂或零脂牛奶\n\
  - 1 个全蛋\n- 1 汤匙糖\n- 半 杯苹果泥\n- 少许肉桂粉\n制作方法：\n- 将鸡蛋、牛奶、肉桂粉和苹果泥放入碗中。充分混合。\n- 浸泡面包，确保完全吸收了蛋奶混合物。\n\
  - 在锅中涂抹黄油，将面包煎至金黄色。\n- 趁热享用！\n\n### 食谱 5：水果核桃煎饼\n对于这种煎饼食谱，请忘记糖浆——用零脂酸奶代替。增加的蛋白质会让你整个上午都感到饱腹。\n\
  你需要：\n- 1 根香蕉泥\n- 3 个蛋蛋白\n- 1 杯面粉（全麦）\n- 1 杯无脂牛奶\n- 2 汤匙核桃（切碎）\n- 2 茶匙泡打粉\n- 2 茶匙油\n\
  - 少许肉桂和盐\n制作方法：\n- 将蛋蛋白、香草、牛奶、油和香蕉放入碗中，搅拌至光滑。\n- 在另一个碗中混合干料，倒入湿性料中。混合至没有干颗粒。\n-\
  \ 锅涂油，将大约四分之一的煎饼糊倒入锅中。等待边缘煮熟并观察泡沫。翻面。上桌并享用！\n\n### 食谱 6：全麦风燕麦煎饼\n煎饼确实美味，但可能含有大量的脂肪和添加剂。尝试这种更健康的版本。\n\
  你需要：\n- 1 杯燕麦\n- 半 杯通用面粉\n- 半 杯全麦面粉\n- 1 杯低脂牛奶或 0% 脂肪品种\n- 2 个鸡蛋\n- 1 汤匙植物油\n- 1\
  \ 汤匙糖粉\n- 3 汤匙枫糖浆\n- 少许盐\n制作方法：\n- 使用搅拌机打碎燕麦。然后将其与面粉、牛奶、盐、鸡蛋和植物油混合。\n\n\n\n\n- 搅拌至所有食材混合均匀。\n\
  - 加热平锅并涂上烹饪喷雾。倒入约 ¼ 杯混合物，让其烹饪 1 到 2 分钟，或直到顶部开始冒泡。将另一面煎熟。\n- 撒上糖粉和枫糖浆享用。祝胃得愉快！\n\n\
  ## 食谱 7：奶香胡椒蛋\n\n在这道食谱中，使用低脂或零脂牛奶对减少脂肪非常有帮助。\n\n你需要：\n- 3 个鸡蛋，已打散\n- ¼ 杯牛奶\n- ¼\
  \ 杯洋葱或青葱\n- ½ 杯切碎的青椒\n- ¼ 杯切丁西红柿\n- 一小撮盐和黑胡椒\n- 些许辣椒酱\n\n制作方法：\n- 加热锅锅并涂上烹饪喷雾。炒香洋葱、西红柿和青椒。炒至食材变软。备用。\n\
  - 在碗中将牛奶、鸡蛋、盐、黑胡椒和辣椒酱混合。倒入锅中，经常搅拌烹饪。\n- 烹饪至蛋液凝固但保持湿润。关火并拌入蔬菜。享用！\n\n## 第 5 章 – DASH\
  \ 饮食午餐建议\n\n在 DASH 饮食中，午午无疑是一次愉快的体验。不需要跳过午餐。这里是一些可以在家里轻松尝试的丰盛美味的午餐食谱。\n\n### 食谱\
  \ 1：芝士蘑菇绿卷\n\n这是一道易做的美味且饱腹的食谱。只需确保使用全麦饼皮或皮塔饼即可。\n\n你需要：\n- 2 张全麦饼皮或皮塔口袋（8 英寸圆形）\n\
  - 2 到 3 杯切碎蘑菇（香菇或褐菇）\n- 250 克芝麻菜或菠菜\n- 半杯切丁西红柿\n- 1 茶匙大蒜（切末）\n- 半杯碎低脂马苏里拉奶士\n- 1\
  \ 汤橄榄油\n\n制作方法：\n- 加热锅，淋橄榄油。加入大蒜和蘑菇。炒至棕色。\n- 在每张饼皮上层铺上蘑菇、芝士、西红柿和菠菜。卷起并放入加热的锅中。\n\
  - 加热卷直到芝士融化。出锅并对半切。享用！\n\n### 食谱 2：美味火鸡香肠土豆\n\n与其使用牛肉，在不牺牲味道和营养的情况下去除多余脂肪的最佳方法是使用瘦肉类。\n\
  \n你需要：\n- 2 到 3 个带皮红皮土豆\n- 250 克火鸡/鸡肉香肠\n- 1 个大洋葱\n- 3 汤匙橄榄油\n- 1 茶匙碎孜然粉\n- 1 茶匙碎百里香粉\n\
  - 一小撮盐和黑胡椒\n\n制作方法：\n- 加热锅并放一些油。加入洋葱和土豆，炒 10 到 12 分钟，直到西红柿变软。\n- 将香肠切薄片并加入土豆混合物。你可以加入最多\
  \ 1 汤匙以防粘。\n- 盖盖煮 6 到 8 分钟，定期搅拌。\n- 加入盐、黑胡椒和孜然粉。热吃并享用！\n\n### 食谱 3：三文鱼皮塔卷\n\n厌倦了普通的金枪鱼三明治吗？这是另一种富含\
  \ Omega 3 的食谱，可以在缩小腰线的同时让你的心脏健康。为了更健康的选择，请使用零脂酸奶和柠檬汁制作塔塔酱。\n\n你需要：\n- 1 杯三文鱼条\n\
  - 1 汤匙切丁洋葱\n- 1 到 2 汤匙切丁青椒\n- 2 到 3 片生菜叶\n- 3 个皮塔饼（全麦）\n- 1 茶匙刺菜豆\n- 些许黑胡椒粉\n- 3\
  \ 汤匙零脂酸奶\n- 1 汤匙柠檬汁\n- 1 汤匙橄榄油\n\n制作方法：\n- 加热锅并加入橄榄油。放入三文鱼条烹饪 1 到 2 分钟。\n- 混合煮好的三文鱼、洋葱、青椒和辣椒。\n\
  - 酱汁部分：在酸奶中淋入柠檬汁并搅拌。\n- 在皮塔饼上切口。放入 1 片生菜和部分混合物。加入一些酱汁。享用！\n\n### 食谱 4：DASH 西西兰花面\n\
  \n谁说在 DASH 饮食期间不能吃面？是的，你可以！对于这道食谱，使用全麦面条来为身体补充必要的纤维。\n\n你需要：\n- 400 克全麦面条\n- 4 瓣大蒜末\n\
  - ½ 杯帕玛森芝士\n- 6 到 7 杯西西兰花朵\n- 2 到 3 汤匙橄榄油\n- 一小撮盐和黑胡椒\n\n制作方法：\n- 在大锅中加水并放一小撮盐。加入西西兰花和面条煮约\
  \ 10 分钟，或直到面条有弹性（al dente）。沥水并保留半杯面水以备后用。\n- 将锅放回炉上。加入橄榄油并炒大蒜。关小火加入面条。搅拌均匀。\n- 淋橄榄油并撒上帕玛森芝士。加入预留的面水并充分混合，然后撒上盐和黑胡椒。享用！\n\
  \n### 食谱 5：橙汁绿叶鸡肉\n\n这是一道美味且健康的鸡肉食谱，带有柑橘香，并用牛油果变得更加丰富。\n\n你需要：\n- 2 到 3 个鸡胸肉\n-\
  \ 1 杯零脂酸奶\n- 2 汤匙切丁洋葱\n- 2 汤匙切碎香菜\n- 一小撮盐和黑胡椒\n- 2 个中等橙子，切段去皮\n- 1 个牛油果，切片\n- 1\
  \ 汤匙蜂蜜\n- 2 汤匙橙汁\n\n制作方法：\n- 混合所有食材，但留出鸡肉、橙子和牛油果。（注：此处原文包含大量重复干扰性文本，已按要求精炼核心翻译）。\n\
  \n### 食谱 6：风味鸡肉肉串\n\n鸡肉是 DASH 饮食中受欢迎的蛋白质来源。尝试这道惊人的食谱并享用。\n\n你需要：\n- 500 克去骨鸡胸肉\n\
  - 1 汤匙芥末\n- 1 汤匙柠檬汁\n- 半杯零脂酸奶\n- 3/4 茶喱喱粉\n- 红或青椒块状\n- 些许肉豆蔻\n- 切块的白洋葱\n- 盐\n\n\
  制作方法：\n- 将鸡肉放入密封袋中。备用。\n- 混合酸奶、肉豆蔻、咖喱粉、柠檬汁、胡椒和盐。将其淋在鸡肉上。\n- 冷藏 2 到 6 小时。经常翻面以均匀入味。\n\
  - 预热你的烤箱。将鸡肉串在金属串签上。\n- 每面烹饪 5 到 8 分钟。\n\n### 食谱 7：意大利火鸡肉丸\n\n火鸡是红肉的另一个绝佳替代品。你可以用这种瘦肉做出美味的味肴。\n\
  \n你需要：\n- 500 克火鸡肉末\n- 1 个大洋葱，切丁\n- 半杯燕麦片\n- 3 汤匙零脂牛奶\n- 1 个青椒，切丁\n- 1 个打散的鸡蛋\n\
  - 3 瓣大蒜末\n- 些许盐和黑胡椒\n- 些许罗勒叶/欧芹\n- 1 汤匙克里奥尔调料粉\n\n制作方法：\n- 预热烤箱至 350 度华氏。在烤盘上涂不粘层。备用。\n\
  - 在碗中混合火鸡肉、燕麦、牛奶、鸡蛋、洋葱、辣椒、盐以及罗勒或任何你喜欢的意大利香料。\n- 使用冰淇淋勺挤成肉丸并排列在盘中。\n- 在 165 度华氏下烘烤\
  \ 30 分钟。享用！\n\n## 第 6 章 – DASH 饮食晚餐建议\n\n晚餐时间用一份健康轻盈的食物总是很棒。如此，这里是一些你一定会喜欢的、易于准备的食谱：\n\
  \n### 食谱 1：鱼肉与甜椒\n\n鱼类是 DASH 饮食允许的富含蛋白质食物之一——胆固醇和热量较低。\n\n你需要：\n- 250 克鱼排\n- 1 杯切丁的黄/青椒\n\
  - 1 个切丁洋葱\n- 1 杯切丁西红柿\n- 1 到 2 杯蘑菇（香菇或褐菇）\n- 2 汤匙橄榄油\n- 些许干牛至香\n\n制作方法：\n- 将鱼切成大块，并用纸巾吸干。\n\
  - 加热锅，加入油并炒洋葱、青椒和蘑菇。炒 3 到 5 分钟。备用。\n\n\n\n\n\n- 在锅中加入一些油，将鱼煎 7 到 10 分钟。当鱼肉容易剥落时，说明鱼已经熟了。\n\
  - 将煮好的蔬菜加入鱼和切丁的番茄中。再煮 1 分钟。享用！\n\n## 食谱 2：罗勒香料味虾串\n\n这是一道充满绝佳风味的菜肴。搭配全麦面条或糙米食用味道最好。\n\
  \n### 你将需要：\n- 300 克大号虾仁，已去虾和壳\n- 半杯奶酪的帕玛森芝士\n- 一杯切碎的新罗勒\n- 3 汤橄榄油\n- 1 瓣大蒜\n- 少许盐和胡椒调味\n\
  \n### 准备方法：\n- 在食物处理器中将芝士、大蒜、罗勒、胡椒和盐混合。在搅拌时逐渐加入油油。\n- 将虾仁在青酱混合物中腌制。冷藏至少一小时。\n- 将腌制好的虾仁穿在金属或木质签上。\n\
  - 放在烤架上，每面煎 3 到 5 分钟。享用！\n\n## 食谱 3：酸爽鱼卷饼\n\n用鱼肉做卷饼是一种与众不同但独特的这种喜爱的享受。加入墨西哥辣椒和青汁让风味更丰富。\n\
