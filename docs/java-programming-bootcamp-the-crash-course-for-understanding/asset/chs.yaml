  \n## 第 3 章：公式和函数\n\n### Excel 中的公式\n\n在处理电子表格时，你必须对数值进行加、减、乘、除。这意味着每个电子表格程序都能够接受、引用和处理数值。然而，在\
  \ Excel 中，数学公式作用于单元格，而不是作用于数值本身。这是因为数值无论其类型如何，都容易发生变化。如果公式所需的数值发生了计划之外的更改，公式就会损坏。\n\
