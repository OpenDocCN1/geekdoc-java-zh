  \n放入烤箱烘烤 25 分钟，或直到派定型。\n\n# 第 7 章：生酮饮食零食\n将以下零食作为生酮计划的一部分，在享受美食的同时减肥。\n\n## 马蹄形坚果\n\
  人数：1 份\n\n### 食料\n- 一把马蹄形坚果\n- 一小片黄油\n\n### 制作方法\n在锅中融化黄油，加入坚果，不断翻炒。等坚果上色后离火。\n\n\
