  \n再次感谢下载这本书，希望你喜欢它！\n\n不要忘记查看底部我最喜欢的饮食之一，并学习我通过为期 3 周的饮食快速减掉顽固多余脂肪的策略。\n\n## 第 1\
  \ 章：全食饮食的益处\n\n全食饮食是由极少或没有加工食品组成的饮食。我们都知道吃健康均衡的饮食有多么重要，但我们中许多人未能吃那些能为我们提供所需营养素的食物。\n\
  \n### 一种美味的吃法\n\n许多人假设健康均衡的饮食就是吃像纸板一样的食物，并错过你喜爱的餐点。完全并非如此，你可能会对书中包含的一些食谱竟然如此美味而感到惊讶。只有当你享受各种美味的餐点时，全食饮食才会有效，而这本书将引导你走过健康饮食之旅。\n\
  \n### 额外能量\n\n当你享受全食饮食时，你将比以前任何时候都有更多的能量。能量将来自你所食的食物，主要是因为你吃的是含有缓慢释放碳化合物的食物。此外，你可能会感到不那么疲劳、压力那么小，而且可能还会减轻。\n\
  \n## 第 2 章：开始全食饮食\n\n全食饮食已被证明是一种非常美味的饮食，如果你愿意，它可以帮助你减肥并变得健康得多。有时，你可能会开始感到挣扎，但下面有一些实用的提示可以让你的生活变得轻松一点。\n\
  \n### 犯错\n\n我们都会不时犯错，即使在我们开始新的饮食计划时也可能出错。你可能会无意中（或刻意地）吃了一些你以后后悔吃过的东西。如果发生这种情况，不要恐慌，尽快回到全食饮食即可。\n\
  \n### 寻找你可以从哪里采购原料\n\n确保你的全食饮食尽可能成功的最佳方法之一，就是确切知道你可以从哪里采购原料。如果你足够幸运，附近有一售卖新鲜水果蔬菜和其他健康食品的商店，那么你就赢了一了。\n\
  \n在你开始全食饮食之前，请确保你只享受无糖的、全的、有机的乳制品。另外，如果可用，也选择草养的产品。\n\n### 与朋友一起开始计划\n\n虽然许多人尝试独自开始新的饮食计划，但那些与朋友或家人一起开始饮食的人通常会成功。这是因为他们有人可以交流经验。与他人一起经历这段旅程也可能让他们获得很多动力和奖励，这绝不是一件坏事。\n\
  \n### 奖励自己\n\n现在和再次奖励自己是非常重要的。不要坚持只吃健康食物。这对你没有好处，因为你的身体也需要脂肪、糖分和盐。在每周末奖励自己，这样你就不会觉得错过了什么。或者，每天给自己一个非常小的奖赏，但尽量不要过度。\n\
  \n## 关键食物原料\n\n### 全谷物\n\n全谷物是全食饮食的重要部分。全谷物富含纤维以及多种维生素和矿物质。此外，它们可以帮助降低患上 2 型糖尿病的风险，甚至可以帮助降低你的胆固醇水平。\n\
  \n尽可能购买含有 100%全谷物的食品，比并在烹饪或烘焙时使用全麦粉。这些食物会让你感到更饱腹，特别是因为它们比其他食物加工得少，甚至没有加工。\n\n###\
  \ 水果和蔬菜\n\n水果和蔬菜充满了身体所需的各种营养素。如果你给身体提供正常运作所需的所有营养素，你的健康将会得到提高。此外，由于水果蔬菜中高水平的纤维，你可能也会减肥。\n\
  \n从当地的蔬菜店或市场购买，那里的食物比超市的新鲜且便宜。\n\n## 第 3 章：饮食计划（30 天指南）\n\n第 4 章包含了许多供你享用的食谱。所包含的食谱都是美味且营养丰富的食谱，将帮助全食饮食变得有趣。某些食谱需要花一些时间制作，而另一些只需要几分钟。\n\
  \n\n\n\n你还会发现，我在饮食计划中加入了一些非常容易制作零食和早餐食物（例如建议你将酸奶作为零食时间的一部分）。我特意加入这些，是因为它们虽然简单，但对你的健康也非常有益。简单来说，为了享受美味，你并不总是需要从头开始制作一道菜。一罐天然酸奶就可以是一个非常健康的零食，即使它是你已经在吃的东西。\n\
  \n## 一些建议\n\n请看一看我添加到此书中的食谱。其中可能有些你看起来很顺眼，也可能有些你想要避开的。无论情况如何，请根据你的意愿随时修改食谱并按照你喜欢的频率进行烹饪。\n\
  \n你可能认为我添加了 30 个早餐食谱，接着是 30 个午餐食谱等等。事实上，我添加的食谱较少，因为我想让你有机会创造你自己的食谱，或者简单地多次享受同一顿餐。\n\
  \n你即将开始的全全食物饮食是非常个性化的。这些食谱只是我加入书中的建议，但如何使用它们完全取决于你。某天你可能会做非常复杂的菜，第二天你可能就会选择从当地商店买一小袋切好的水果。无论你做什么，决定吃什么，请确保它是健康的，并享受它。\n\
  \n## 第 4 章：全食物早餐食谱\n\n每天早上都享受一份美味且营养丰富的早餐。从你可能需要在前一天晚上准备的食物，到那些完全不需要花时间的食物。\n\n\
  ### 香蕉树莓奶昔\n\n**食材：（2 人份）**\n\n* 1 根擦丝胡萝卜\n* 三四杯树莓\n* 1 根香蕉\n* 半杯原味酸奶\n* 半个橙子\n\
  * 四分之一杯燕麦\n* 半杯牛奶\n\n将所有食材放入搅拌机中，快速搅拌至光滑。倒入杯中即可享用。\n\n### 红薯华夫\n\n**食材：（4 人份）**\n\
  \n* 四分之一杯玉米淀粉\n* 1 一半杯小麦糕面粉\n* 半茶匙海盐\n* 1 杯红薯泥\n* 1 杯酪乳奶\n* 2 汤匙红糖\n* 四分之一茶匙肉豆蔻\n\
  * 2 个鸡蛋\n* 4 汤匙融化的无盐黄油\n* 喷雾油\n* 2 茶匙泡打粉\n* 半杯切丁火腿\n\n预热你的华夫机，在碗中搅拌玉米淀粉、面粉、泡打粉、糖、肉豆蔻和盐。在另一个碗中，打蛋酪乳奶、鸡蛋、红薯泥和黄油。\n\
  \n现在将面粉混合物加入红薯混合物中。搅拌直到食材混合均匀。加入火腿并搅拌。\n\n取喷雾油喷在华夫机上喷，然后用勺子将大约三分杯面糊倒入铁心中。按照制造商的说明烹饪。享用。\n\
  \n### 早餐马芬蛋糕\n\n**食材：（可做 12 个）**\n\n* 2 片全麦面包\n* 4 盎司擦碎切达奶士\n* 8 个鸡蛋\n* 半 磅培根\n\
  * 半杯牛奶\n* 盐和胡椒\n\n预热烤箱至 350 华氏度，在马芬盘中放置 12 个马芬模具。将面包切成英寸大小的正块。在每个马芬模具底部放入几个方块。\n\
  \n取一个搅拌碗，搅拌鸡蛋和牛奶，然后用盐和胡椒调味。现在将蛋液平均分到每个马芬模具中。现在在顶部撒上奶士，然后加入培根。烤大约 15 分钟，或直到鸡蛋凝固。享用。\n\
  \n### 黄油吐司\n\n**食材：（1 人份）**\n\n* 2 片全麦面包\n* 无盐黄油\n\n像往常一样烤吐司，然后在顶部涂上你需要的数量的黄油。热吃或冷吃均可。\n\
  \n### 香蕉混合坚果谷物片\n\n**食材：（2 人份）**\n\n* 1 根香蕉\n* 四分之一杯全食物混合坚果\n* 半杯瑞士麦麦片\n* 1 杯酸奶\n\
  \n将香蕉纵向切开，将每个半部分放入碗中。在每个碗中加入半杯酸奶，然后将混合坚果和瑞士麦片分分在两个碗中。享用。\n\n### 豆腐蔬菜炒蛋\n\n**食材：（供\
  \ 3-4 人食用）**\n\n* 1 包老豆腐\n* 1 个西红柿，切成四份\n* 2 杯菠菜叶\n* 3 瓣大蒜\n* 2 四分之一个黄椒\n* 2 四分之一个红洋葱\n\
  * 八分之一茶匙海盐\n\n将青椒、菠菜、大蒜、洋葱和菠菜放入食物处理器中，脉冲搅拌直到所有食材都切碎。\n\n将混合物加入煎锅中，用中大火煎至微沸。现在加入豆腐、海盐并搅拌，确保用勺子切开大块豆腐。煮至几乎没有剩余液体，即可享用。\n\
  \n## 第 5 章：午餐食谱\n\n这些午餐食谱可以装盒带去上班，也可以在家里享。在接下来的几天里吃掉剩余部分，以确保在最新鲜的时候享。\n\n### 豆子意面汤\n\
  \n**食材：（3 人份）**\n\n* 半个切切好的中等洋葱\n* 1 瓣切末的大蒜\n* 八分之一杯蔬菜高汤\n* 半根切片的芹芹茎\n* 半 汤匙橄榄油\n\
  * 半罐西红柿\n* 半杯切片芹芹\n* 半杯意面\n* 八分之一茶匙海盐\n* 半杯菠菜\n\n将混合物放入锅中，中大火煎至微沸。现在加入豆腐、海盐并搅拌，确保大菜。。。放入锅中。\n\
  \n### 培根鸡肉杯\n\n**食材：（3 人份）**\n\n* 1 头罗马生菜叶\n* 3 杯切丁鸡肉\n* 2 汤匙牛奶\n* 6 块煮好的培根\n* 16\
  \ 盎司樱桃番柿\n* 半杯酸奶油\n* 四分之一杯切碎青葱\n* 2 汤匙莳\n* 半茶匙盐\n* 胡椒\n\n将鸡肉、番柿和培根放入碗中混合。。将中中放入生菜菜中。\n\
  \n### 豆腐鲁比明治\n\n**食材：（2 人份）**\n\n* 2 片瑞士奶士\n* 2 杯蔬菜高汤\n* 1 一半 汤匙番酱\n* 1 汤匙西抽酱\n\
  * 4 片黑麦面包\n* 三分之一杯酸菜\n* 八分之一杯酸菜酱\n* 1 包切块豆腐豆腐\n* 八分之一杯希腊酸奶\n* 喷雾油\n\n将西抽酱和高汤加入酱锅中煮沸，然后转中火，加入豆腐。\n\
  \n预热烤箱至 400 华氏度，将豆腐放入烤盘中烤至彻底加热，或约 15 分钟。将番酱、酸菜酱和酸奶放入小碗中搅拌。\n\n现在取混合物，涂在每片面包的一侧。将豆腐放在面包上。现在取酸菜铺在豆腐上，然后加入奶士，以及另一片面包。\n\
  \n取一个煎锅并喷上油，放在中火上。现在将明治放入锅中，盖上一个厚重的盖子以便压扁明治。煎大约 3 分钟，直到面包变成金黄色。然后，翻面明治，煎那另一面。享用。\n\
  \n### 鸡肉凯撒沙拉\n\n**食材：（2 人份）**\n\n* 100 克切丁鸡肉\n* 四分之一杯凯撒酱料\n* 1 头切碎罗马生菜\n* 1 罐鹰嘴豆\n\
  \n将所有食材放入碗中，拌匀即可。\n\n### 鸡肉卷饼\n\n**食材：（3 人份）**\n\n* 3 个大卷饼\n* 半个切丁洋葱\n* 三之四杯糙米\n\
  * 半杯玉米粒（最好是冷冻的）\n* 1 杯撕丝鸡肉\n\n\n\n\n# 第 6 章：晚餐食谱\n\n以下晚餐食谱将让你在一天结束时感到非常饱足。第二天午餐可以享用剩下的，或者在晚上再吃一次。\n\
  \n## 鸡肉饭卷饼\n\n1 茶匙菜籽油\n半杯莎莎酱（salsa）\n1 种半杯菠菜叶\n3 汤匙酸奶油\n\n将油加入大平底锅中，用中至大火加热。现在加入玉米和洋葱，炒至洋葱变色。将米饭和鸡肉加入锅中，炒至热透。\n\
  \n将混合物离火，然后拌入酸奶油和莎莎酱。打开卷饼，放入菠菜叶，将约三分之一杯的混合物成条状放在卷饼中间。现在将卷饼顶部向下折叠，底部向上折叠，然后卷起来。即可。\n\
  \n## 芹芹辣椒沙拉\n\n### 配料：（3 人份量）\n* 4 根芹芹\n* 1 汤匙柠檬汁\n* 2 颗泡过的去核红枣\n* 1/8 茶匙辣椒碎\n*\
  \ 1 汤匙柠檬皮屑\n* 1/8 杯柠檬汁\n* 1/4 杯切碎的欧芹\n* 1 汤匙芝麻酱\n* 1/8 茶匙海盐\n* 适量新鲜薄荷叶\n* 8-10 颗切碎并烤过的杏仁\n\
  \n将红枣和它们泡过的浸水放入搅拌机中。现在加入芝麻酱、柠檬汁、盐和辣椒。搅拌至光滑。将搅拌好的配料放入碗中，加入剩余食材并上菜。\n\n## 蔬菜烘烤面食\n\
  \n### 配料：（4 人份量）\n* 半磅面条\n* 1 种半杯切碎的蔬菜\n* 半 汤匙海盐\n* 半罐切碎的番茄\n* 半个南瓜，制泥\n* 1/4 茶匙黑胡椒\n\
  * 一小撮混合香料\n* 2 份半杯马苏里拉芝士\n\n将面条加入沸水的锅中并搅拌。煮约 8 分钟。同时，将烤箱预热至 350 华氏度。沥干面条放入耐热碗中，加入南瓜、番茄和蔬菜并搅拌。现在加入芝士，烘烤约\
  \ 40 分钟，直到热透。即可。\n\n## 番茄豆子辣椒汤\n\n### 配料：（3 人份量）\n* 1 个小罐切碎的番茄\n* 1 汤匙橄榄油\n* 1 罐黑豆\n\
  * 半罐斑豆豆\n* 半个切碎的甜甜椒\n* 1 根切碎的芹芹\n* 1 根切碎的红洋葱\n* 2 瓣切碎的大蒜\n* 2 撮撮盐\n* 半 茶匙牛至香草\n\
  * 3/4 茶匙熏制红椒粉\n* 1 汤匙辣椒粉\n* 1 汤匙香菜碎\n* 1 茶匙孜然粉\n* 半片月桂叶\n* 1 杯水\n* 1 茶匙柠檬汁\n\n将橄榄油放入厚底锅或荷兰锅中加热，然后加入胡萝卜（原文为\
  \ carrot）、洋葱、甜椒、芹芹和 1 撮撮盐，搅拌。炒至蔬菜变软或持续约 5 分钟。\n\n现在加入红椒粉、辣椒粉、大蒜、牛至香草和孜然粉，搅拌。持续搅拌约\
  \ 1 分钟。现在加入番茄、斑豆和黑豆、水和半片月桂叶。搅拌，然后偶尔搅拌慢煮约 15 到 20 分钟。加入香菜，搅拌，加入剩余的盐，再次搅拌后即可。\n\n\
  ## 蔬菜墨西哥薄肉饼\n\n### 配料：（2 人份量）\n* 2 个切片的甜甜椒\n* 115 克切片蘑菇\n* 1 根切片洋葱\n* 1 根墨西哥萨拉诺辣椒\n\
  * 1 茶匙混合香料\n* 1 汤匙融化的黄油\n* 1 汤匙食用油\n* 半个柠檬的汁\n* 3 张卷饼\n\n在锅中用中至大火加热油，等油热后加入甜椒和洋葱。然后在一个小碗中，加入黄油、香料和柠檬汁搅拌。当甜椒变色时，加入香料混合物和蘑菇，搅拌。煮约\
  \ 3 分钟，然后放在卷饼上或配卷饼食用。\n\n## 慢炖锅牛肉蔬菜炖\n\n### 配料：（3-4 人份量）\n* 半磅炖肉肉，切成块\n* 750 克切块或切楔的土豆\n\
  * 一小撮盐\n* 1 种半茶匙红酒醋\n* 170 克切四分的蘑菇\n* 3 瓣切片的大蒜\n* 2 根切碎的胡萝卜\n* 3/4 汤匙番茄酱\n* 6 盎司珍珠洋葱\n\
  * 1 种半汤匙日式酱油（tamari）\n* 1/4 茶匙黑胡椒\n\n将土豆加入慢炖锅中，在平底锅中加入盐和牛肉。用中至大火煎，搅拌至肉类变色。牛肉煎好后，放在土豆上。现在在平底锅中煎蘑菇直到变色，将其加入慢炖锅中。\n\
  \n现在将洋葱、胡萝卜和大蒜放入慢炖锅中。将醋、番茄酱、日式酱油和胡椒放入碗中并打匀，然后倒入慢炖锅中。用低火慢煮约 8 小时，等牛肉软化后即可。\n\n##\
  \ 牛肉面\n\n### 配料：（3 人份量）\n* 半磅牛肉末\n* 半罐切碎的番茄\n* 一一把蘑菇\n* 半个绿甜椒\n* 一小把玉米\n* 1 根切碎的洋葱\n\
  * 半包面条\n* 1 杯切碎芝士\n\n将土豆加入锅中，在平底锅中加入盐和牛肉。用中至大火煎，搅拌至肉类变色。当牛肉煎好后，放在土豆上。现在在锅中煎蘑菇直到变色，将其加入。调味\n\
  \n加入香料、甜椒、蘑菇、玉米，直到搅拌。现在放入面条，然后放入芝士。搅拌，确保所有的燕麦粉混合物都已吸收。用茶匙取 1 茶匙混合物放在烤盘上，确保饼错开。\n\
  \n## 烧烤鸡肉\n\n### 配料：（4 人份）\n* 2 块鸡胸肉（切条，去骨）\n* 4 块鸡大腿（切条，去骨）\n* 1 种半汤匙红椒粉\n* 3/4\
  \ 汤匙盐\n* 1/2 茶匙大蒜\n* 2/3 杯烧烤酱\n* 1/3 杯烧烤酱\n* 1/8 茶匙辣椒粉\n\n将大蒜、辣椒粉、红椒粉和盐放入碗中搅拌。将混合物撒在鸡胸肉和大腿上，煎烤约\
  \ 2 分钟。在锅中煎至刚好，然后放在烤架下。\n\n烤 1 分钟，然后配烧烤酱食用。\n\n# 第 7 章：全食零食\n\n下面找到的食谱既美味又有营养，但不含多少脂肪。可以作为全食饮食的一部分，每天吃一两次。\n\
  \n## 红枣燕麦饼干\n\n### 配料（制作 20 个）\n* 半杯泡过的红枣\n* 半杯红枣\n* 1 杯燕麦\n* 1/4 茶匙肉豆蔻\n* 1/4 茶匙盐\n\
  * 1 茶匙肉桂粉\n* 半杯腰果酱或花生酱\n* 1 茶匙泡打粉\n* 1 茶匙香草精\n\n打开烤箱并调至 350 华氏度。将 3/4 杯燕麦放入搅拌机中，脉冲至细碎。现在准备一个碗，加入肉桂粉、泡打粉、肉豆蔻、燕麦粉和盐，搅拌均匀。\n\
  \n在搅拌机中，加入泡过的红枣和约 1/4 杯浸水。现在搅拌红枣，然后加入香草精和酱搅拌。将红枣混合物、未泡过的红枣和剩余的燕麦加入燕麦混合物中。搅拌，确保所有的燕麦粉混合物都被吸收。\n\
  \n用茶匙取 1 茶匙混合物放在烤盘上，确保饼干之间留有空间。间隔 1 英寸即可。用勺背将混合物稍微压平，烤最多 12 分钟，直到饼干底部稍微变色。\n\n转移到架子上冷却。即可。\n\
  \n## 一块水果\n\n享受你喜欢的水果，但尽量不要一直吃同一种水果。水果的水种类越广，你获得的营养就越多。\n\n水果可以新鲜吃、冷冻吃或干吃，但要注意任何添加剂、防腐剂、盐和糖。如果不确定，新鲜或冷冻总是最好的。\n\
  \n## 水果爆花混合物\n\n### 配料：（6 人份量）\n* 2 和 3/4 杯干果\n\n\n\n\n2 杯无盐爆米花\n\n将所有原料加入碗中，并按分量分装。将分装放在容器中，带去上班。\n\
  \n### 花生酱南瓜饼干\n\n原料：（制作 20 份）\n\n- 1/4 杯螺旋燕麦\n- 半杯无盐花生\n- 一小撮盐\n- 1/4 杯无糖可可粉\n-\
  \ 1/4 杯顺滑花生酱\n- 半杯切碎枣\n- 1 茶匙香草精\n- 1/8 杯南瓜泥\n\n将烤箱预热至 375 华氏度。将燕麦和花生放入碗中混合。现在用脉冲搅拌直到原料混合成粗糙的混合物。加入盐和可可粉，再次搅拌至混合。\n\
  \n现在将花生酱和南瓜泥加入搅拌碗中，搅拌至融合。加入枣和香草精，再次混合。加入干性原料，缓慢搅拌，直到形成浓稠的面团。\n\n取一勺面团，揉成球放在饼干上。重复此步骤，直到用完所有面团，每份之间保持约\
  \ 1 英寸距离。用叉子压平混合物。现在将面团放入烤箱，烘烤约 10-12 分钟，直到变干。放凉后享用。\n\n### 酸奶\n\n一小罐或一盒酸奶可以是一个非常解馋的零食。确保你只吃没有添加或大部分糖的天然酸奶。为其加入一些小块水果，增加额外的特殊口感。\n\
  \n### 羽甘蓝片\n\n原料：\n\n- 1 汤匙橄榄油\n- 1/4 茶匙盐\n- 4 杯压实的羽甘蓝叶\n\n将烤箱预热至 375 华氏度。修剪并洗净羽甘蓝，然后铺在烤盘上。现在取橄榄油，洒在叶子上。用手拌匀叶子，使油脂分布均匀。将叶子单层铺回烤盘上。\n\
  \n烤叶子约 5 分钟，然后翻面。现在再烤 5 分钟，直到叶子开始变褐变脆。从烤箱中取出，撒上盐拌匀。即可食用。\n\n# 第 8 章：提示与技巧\n\n开始一项新的健康饮食计划可能并不容易，但如果你能确保自己享受美味的餐食和零食，你就不会觉得在错失什么。书中包含的所有全食食谱将由于其所含的天然纤维来源而让你感到饱腹。\n\
  \n当然，我们欢迎你尝试自己的食谱，或者对书中的食谱进行一些修改。你摄取的食物种类越多样，你的身体获得的营养就越多。\n\n### 水\n\n请确保饮水充足，最好每天\
  \ 8 杯。这可以帮助你减肥，因为它会让你更有饱腹感，也会让你感到压力减轻很多。\n\n### 运动\n\n如果你不想运动也可以，因为健康的健康的很可能会减肥。我不建议你同时开始新的运动计划和健康饮食计划。生活中的两个重大改变可能会让你感到压力太大，因此请先处理好饮食，然后温和、稳健地引入一些运动。\n\
  \n如果你已经在运动了，那么在你习惯了全食饮食之前，请不要增加额外的运动量。\n\n### 你的减重\n\n如果你是为了减肥而参加全食计划，那么你很可能会掉一些体重。当你第一次开始全食计划时，在前几周会掉很多体重，但一段时间后减重速度会放慢。这是正常现象，无需担心，只要你坚持吃健康的食物，这种情况就会持续下去。\n\
  \n### 如果你想再次执行该计划\n\n全食饮食是一种非常可持续的饮食，会让你感觉健康得多。你可能一生都可以坚持全食饮食，因为它非常健康。如果你发现这种饮食很难，或者你想偶尔吃点其他食物，那么请确保你保持一种健康的饮食，但只包含几顿不健康的餐。\n\
