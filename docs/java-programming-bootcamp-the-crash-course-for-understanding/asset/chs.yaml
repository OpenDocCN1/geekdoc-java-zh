  - 烤牛肉\n- 第 13 天\n- 黄金鸡面\n- 第 14 天\n- 牧场鸡\n- 结论\n\n# 引言\n\n我们生活在一个忙碌的世界里，很少有时间在厨房里制作美味的食物。我们都渴望美味的居家晚餐，但遗憾的是，只有少数人能从忙碌的日程中抽出时间来准备耗时的菜肴。为了满足我们对垂涎欲滴的渴望，我们去昂贵的餐厅并支付高额费用。但即使是餐厅的味道在一段时间后也会变淡，你会开始渴望家常菜，对吧？\n\
  \n好了，当你的日程非常忙碌，没时间为家人准备好吃的时，请参考我们在书中提到的菜谱。这些菜谱都是“一锅出”（dump dinner）菜谱，这意味着你只需要把所有东西倒进锅里，让锅为你完成工作即可。在此期间，你可以去办公室、享受你喜欢的节目、睡个好觉、完成家务或简单地去购物。这些一锅出菜谱完全是救命菜，尤其是当你太疲累或太忙而无法在家里准备晚餐的时候。有了这些超级快速且超级简易的菜谱，你不需要做额外的苦力活，回到家就能有一顿为全家人烹饪的美味晚餐。听起来很兴奋，对吧？\n\
  \n所以翻开页看看我们为你准备了什么。我们为大家准备了一个 14 天的计划，这样你就不必担心每天为自己准备美味的晚餐了。每道菜都是独特的且充满风味，你会喜欢它们制作过程的简便。所以，唤醒你体内的创意厨师之魂，尝试我们提到的菜谱，用最少的精力享受垂涎欲滴的晚餐吧！\n\
  \n# 第 1 天\n\n我们知道每天都要决定晚餐吃什么是多么有压力。我们也知道站在厨房里制作美味晚餐有多么困难。疲惫的身体下，要在工作中表现出色的同时还要做好好晚餐往往变得极其困难。因此，对于第\
  \ 1 天，我们为你推荐了一道简单又美味的菜谱，它不需要花费大量的时间精力。\n\n## 鸡肉砂\n\n我们为你提供的第一道菜谱是鸡肉砂。这是一道超级简易的菜，它的味道和美味程度会让你大为惊艳。鸡肉非常好做，涉及的食材你可以在家里轻松找到。这道菜需要米饭，混合鸡肉蛋黄酱和其他奶油类食材，这会让这道菜在晚餐时看起来非常有食欲。你只需要混合所有食材，将它们倒进烤箱烘烤\
  \ 40 分钟即可完成。这道菜谱非常适合那些没有时间做晚餐但又想在家里吃点美味垂涎欲滴的东西的日子。\n\n以下是制作这道简易菜肴所需的原料：\n\n- 鸡肉浓汤：1\
  \ 罐\n- 煮好的鸡肉，最好是烤鸡肉：3 杯\n- 煮好的米饭：3 杯\n- 切杏仁：½ 杯\n- 芹芹：3/4 根并切丁\n- 蛋黄酱：½ 杯\n- 玉米片：约\
  \ 3/4\n- 融化的黄油：2 汤匙\n\n### 方法：\n\n取一个大型烘烤盘，将上述所有食材倒进去。充分混合所有食材，并在撒上玉米片以增加酥脆感。你也可以在顶部加入黄油。这道菜谱非常适合那些没有时间做晚餐但又想在家里吃点美味垂涎欲滴的东西。\n\
  \n混合好食材后，只需将其放入预热好的烤箱（`350 degrees`）中即可。这道菜大约需要 40 分钟即可做好。根据你的喜好取出即可。听起来很简单，对吧？每当你想居家享受美味晚餐时就做这道菜。\n\
  \n第二天，我们推荐了另一道更简单的菜谱。这道简单的菜谱是俄罗斯杏桃鸡，它不仅垂涎欲滴且令人入味，制作起来也非常简单快捷。这道菜谱最棒的地方在于食材种类。你可能难以相信，只需四种食材就能做出美味的菜谱。少的食材和较短的烹饪时间让这道菜深受喜爱。这道菜深受想要美味晚餐但没有时间准备复杂菜品的女性喜爱。\n\
  \n## 俄罗斯杏桃鸡\n\n和上一道菜谱一样，你只需要将所有食材充分混合，让锅完成工作。这是一道慢炖菜谱，因此锅需要 8 小时来完全煮熟鸡肉。这对于某些人来说可能觉得很长时间，但请在晚上开始制作这道菜，这样你深夜就能吃到美味晚餐。在此期间，你可以完成所有家务、外出购物、参加活动、做些办公工作或简单地睡一觉。\n\
  \n以下是制作这道超级简易菜所需的食材：\n\n- 无骨鸡胸：约 2 磅\n- 杏桃酱：1 罐或 12 盎司\n- 洋葱：½ 个切碎\n- 俄罗斯沙拉：1 瓶\n\
  \n### 方法：\n\n制作这道菜，你需要在碗中将杏桃酱、俄罗斯沙拉和洋葱搅拌几分钟。下一步只需将鸡肉放入锅中，淋上杏桃混合物即可。这就是制作这道菜所需的所有步骤。食材放入锅内后，放松并完成\
  \ 8 小时的家务，然后享受一顿热腾腾的晚餐。慢炖锅配合杏桃混合物会让鸡肉非常多汁且美味。鸡肉准备好后，你可以搭配米饭或土豆泥享用。如果你想让鸡肉更辣更好吃，也可以在杏桃混合物中加入一些香料。简而言之，这道菜是所有忙碌美食爱好者的必备。\n\
  \n\n\n\n虽然之前的食谱包含四种食材，但第三天的食谱更加简单快捷。这道菜是鸡肉莎莎酱（chicken salsa），只需要两种食材和一个压力锅。所以，如果你有极其忙碌的一天，大约\
  \ 8 小时内无法进行任何额外工作，又非常渴望一顿美味的晚餐，只需在上班前做好这道菜，然后回来享受美味的莎酱配上美味的鸡肉即可。也不用担心准备时间，这道菜准备只需要不到十分钟，之后你只需要将其放入锅中即可。\n\
  \n## 鸡肉莎酱\n\n我们都喜欢鸡肉，也喜欢莎酱。想象一下，如果将这两种美味的食材结合，会是一道多么完美的菜。这就是给你的鸡肉莎酱——它将鸡肉的多汁和莎酱的香气结合，创造出一道令人欲不能的菜肴。这道菜最棒的地方在于制作非常简单。你只需要在慢炖锅将食材混合在一起，晚餐就准备好了。\n\
  \n以下是制作这道超级简单菜所需的两种主要食材：\n\n字体 无骨鸡胸肉：4 \n- 你最喜欢的莎莎酱：2 杯\n\n### 方法\n\n制作方法也相当简单。你只需要将鸡肉放入锅中，用你最喜欢的莎莎酱完全覆盖。如果你很长时间没有空吃饭，可以在慢炖锅中烹饪\
  \ 8 小时。否则，你可以使用普通的压力锅，大约需要 4 小时即可完全煮好。检查菜肴是否煮好的的一种方法是看是否能轻松撕碎鸡肉。如果肉质变软到容易撕碎，就把鸡肉撕碎，加入香料、盐和胡椒，然后享受这顿美味的晚餐。你也可以将菜肴放在密封容器中冷冻，以便在完全无法做饭的日子使用。这道菜大约有\
  \ 6 杯，也可以和其他许多墨西哥菜一起吃。所以，展现出你的创造力，用你喜爱的沙拉或配菜享受这道超级简单的食谱吧。\n\n## 第 4 天\n\n这次让我们换掉常规的鸡肉晚餐模式。第\
  \ 4 天，我们为你带来了一道美味的牛肉餐，它不仅以味道好闻名，还以烹方便著称。这道食谱非常适合那些你需要出门很长时间，但回家后仍渴望有一顿完美晚餐的日子。这道菜是斯塔罗格纳牛肉（Beef\
  \ Stroganoff），它不仅容易于，而且牛肉与斯塔罗格纳酱的完美结合。这道菜最棒的部分是它需要的食材非常少，因此完全不需要费力。\n\n## 斯塔罗格纳牛肉\n\
  \n斯塔罗格纳牛肉是一道容易制作的食谱，一旦制作并品尝你就会爱它。它有肉类的鲜美以及蛋面和酸奶油的奶油风味。食谱在压力锅上烹饪大约需要 4-5 小时，但你也可以一直低火并将烹饪时间增加到大约\
  \ 7 小时。因此，如果你要出门大约 7 小时，你只需要在锅中混合下面提到的食材，回到家就能享用到煮得完美的斯塔罗格纳牛肉。让我们看看这道食谱需要哪些食材：\n\
  \n- 切成小块的炖肉：2 磅\n- 洋葱汤包：1 包\n- 蘑菇：1 罐\n- 蘑菇奶油汤：1 罐或约 11 盎司\n- 玉米粉：1-2 汤匙\n- 姜汁汽：12\
  \ 盎司或 1 罐\n- 酸奶油：8 盎司（适量即可）\n- 蛋面：1 包\n\n### 方法\n\n要制作这道菜，你只需要将所有食材放入锅中（面条、酸奶油和淀粉除外），让锅发挥魔法。在烹饪时间前约\
  \ 1 小时，你需要加入酸奶油和玉米粉，然后准备好面以搭配斯塔罗格纳牛肉享。所以你看，这道菜非常简单容易。准备时间非常短，你不需要做任何辛苦的工作就能为你和你的家人准备一顿美味的晚餐。\n\
  \n## 第 5 天\n\n你是否喜欢尝试新菜系但忙得没时间尝试？你是否因为行程安排太紧，只在餐厅享受中餐和意大利菜，而在家里不是？如果是这样，你再也不需要出门去享受美味的中餐了。我们为你准备了一道非常简单的中餐食谱，只需花你几分钟就能准备好。这道菜是芝士牛肉西兰花（Cheese\
  \ Beef and Broccoli），既令人垂涎欲滴又制作极快。\n\n## 芝士牛肉西兰花\n\n与书中到为止提到的所有食谱一样，这道食谱以准备简单闻名。你不需要在厨房里花费几个小时为家人准备一道精好的中餐，因为这道食谱只需要你将所有食材倒入锅中，让锅完成工作即可。你只需要在最后花一点时间对菜进行最后的润色。让我们看看怎么做。\n\
  \n制作这道菜，你需要以下食材：\n\n- 牛肩肉：1 磅\n- 牛肉汤：约 1 杯\n- 酱油：½ 杯\n- 芝麻油：1 汤匙\n- 红糖：1/3 杯\n-\
  \ 蒜末：3 瓣\n- 西西兰花：2 杯\n- 水：2 汤匙\n- 玉米粉：2 汤匙\n- 熟饭或炒饭：根据需要\n\n### 方法\n\n虽然食材列表看起来很长，但烹饪方法相当简单。第一步是在锅中加入牛肉汤、芝麻油、大蒜、红糖和酱油并搅拌。然后加入牛肉再次搅拌。下一步是将食材留在锅中慢炖约\
  \ 6 小时，之后你需要加入水和玉米粉，然后让菜再煮半小时，以让酱汁完全煮好。最后加入西兰花，烹饪几分钟，最后配饭享受这道美味菜。这道菜在开始和结束只需要几分钟，中间的时间完全可以留给你放松并完成未竟的工作。\n\
  \n## 第 6 天\n\n下一个食谱也相当简单。这是一道超级美味的菜，风味丰富且食材易得。这道菜被称为牛仔鸡（Cowboy Chicken），你会发现制作它是多么简单。这道食谱也适合那些忙碌\
  \ 6 到 7 小时、没有时间在厨房为家人准备一顿好晚餐的日子。但有了牛仔鸡这样的食谱，你再也不用担心晚餐了。\n\n## 牛仔鸡\n\n这道食谱被称为“丢入即煮”食谱，因为你只需要将食材倒入锅中，让锅准备晚餐即可。这道食谱含有很多西南风味，所以如果你在家里尝试这顿晚餐，会有一些不同又美味的食物。看看下面的方法，用这道美味简单的食谱惊艳你的家人。\n\
  \n以下是制作这道菜所需的食材：\n\n- 西南味辣椒鸡肉\n- Ro-Tel 番：2 罐\n- 黑豆：1 罐\n- 墨西哥玉米：1 罐\n\n### 方法\n\
  \n制作这道菜的方法极其简单且毫不痛苦。你只需要将四种食材放入锅中，让菜烹饪 6 小时即可。了！不需要准备，也不需要最后的润色。这道菜几乎不会占用你忙碌日程中的几分钟，你就能获得一顿轻松美味的晚餐。你和你的家人会喜欢这道菜的味道以及制作它的简便。只需在加入之前洗净并沥干豆类和番茄即可。\n\
  \n\n\n我们都喜欢每天享用美味的晚餐。但遗憾的是，我们大多数人总是忙于工作和其他家务，导致没有足够的时间在厨房里为家人准备一顿丰盛的晚餐。在日程紧凑的日子里，即使在厨房里花一个小时做点好吃的都是是不可能的。但是，如果只需最少的精力和最短的时间就能享上一顿口垂欲滴的晚餐，你难道不想吗？我们都希望每天都能有这样的晚餐，特别是在我们没有时间做饭的日子。我们介绍的下一道食谱以烹饪简单、味道佳闻名。你会喜欢这道菜在几分钟内就能准备好的，而不需要在厨房里花费几个小时。这道菜是`意大利饺烘焙（Tortellini\
  \ Bake）`。\n\n## 意大利饺烘焙\n\n意大利饺焗基本上是一种美味的意面砂锅，深受大多数忙碌人的喜爱。它充满了丰富的味道，会让你一次又地制作并食用。这道菜大约供\
  \ 6 人食用，几乎只需要 10 分钟的烹饪时间和 10 分钟的准备时间。因此，在 20 分钟内，你就能享上一顿美味的晚餐。让我们来看看在家里制作这道菜所需的食材：\n\
  \n- `意大利饺 Tortellini`：9 盎司或一包你喜欢的任何口味\n- `帕玛森芝士 Parmesan cheese`：3 汤匙，奶酪\n- `马苏里拉芝士\
  \ Mozzarella cheese`：约 1 半杯，丝状\n- `意面酱 Spaghetti sauce`：约 2 杯\n- `欧芹 Parsley`\n\n\
  ### 方法\n\n第一步是根据包装上的说明准备意大利饺。准备过程只需要 10 分钟。等意大利饺准备好后，你只需要在里面加入意面酱，然后将裹好酱的意大利饺放入烘焙盘。在意大利饺上撒满马苏里拉和帕玛森芝士以完全覆盖。将烤箱预热至\
  \ 350 摄氏度，然后让意大利饺在箱内烘烤，直到芝士呈微棕色。菜出炉后，你可以在顶部撒一些欧芹。因此，在短短 20 分钟内，一道美味的菜就为你准备做好了。\n\
  \n## 第 8 天\n\n对于第 8 天，让我们尝试一些不同的东西。到目前为止，你可能已经对目前介绍菜肴的相似性感到厌倦。因此，本章节重点介绍一种我们大多数人喜爱且仍然易于制作菜。本章节将介绍一道夏威夷菜，为我们所有的美食爱好者提供丰富多样的风味。这道菜和之前所有的菜一样，非常简单易于制作，几乎只占用你\
  \ 15 分钟的时间。我们相信你一定会喜欢这道菜制作的简便以及它提供的丰富风味。这道菜是`夏威夷鸡肉`。\n\n## 夏威夷鸡\n\n夏威夷鸡基本上是一个慢炖食谱，意味着它大约需要\
  \ 5 小时才能准备好。因此在此期间，你可以睡午觉、出去购物或简单地完成所有的任务。这道菜著名的地方在于它包含了多种食材，从菠萝到橙子，再到姜和酱油。味道的多样性不仅增加了菜的深度，还让这道菜看起来非常有吸引力。这道菜大约供\
  \ 7 人食用，需要以下食材：\n\n- `鸡胸肉 Chicken breasts`：约 6 块\n- `橘橘 Mandarin oranges`：1 罐或 15\
  \ 盎司\n- `菠萝片 Pineapple slices`：1 罐或 16 盎司\n- `红糖 Brown sugar`：半杯\n- `玉米淀 Corn starch`：1/4\
  \ 杯\n- `酱油 Soy sauce`：半杯\n- `柠檬汁 Lemon juice`：1/4 杯\n- `姜粉 Ground ginger`：约 1 茶匙\n\
  \n### 方法\n\n要准备酱汁，你必须混合上述提到的所有食材（鸡肉、菠萝和橙子。搅拌酱汁使食材充分混合。酱汁准备好后，将鸡肉放入锅中并将酱汁淋在上面。下一步是在顶部加入菠萝和橙子，让锅在低火上准备约\
  \ 5 小时。5 小时后，锅里就会为你呈现出一顿美味的晚餐。你也可以将鸡肉配米饭吃，让晚餐更加丰盛。因此，你再也不需要去贵的餐厅享用像夏威夷鸡这样美味的菜肴了；只需\
  \ 15 分钟的准备时间，在家就能轻松获得。\n\n## 第 9 天\n\n下一道食谱又是一道非常简单却美味的菜。这是你通常在家里享用的菜，但我们对食材进行了一小处改变向你介绍。这道菜最棒的地方在于你不需要费费精力就能制作。这道菜准备好只需要\
  \ 30 分钟，期间你不需要做任何苦力活。这道菜也充满了味道和美味，会受到所有家庭成员喜爱，尤其是青少年。这道菜是`墨西哥鸡肉千层面`。\n\n## 墨西哥鸡肉千层\n\
  \n墨西哥鸡肉千层基本上是另一种形式的鸡肉卷饼（enchiladas）。然而，这个版本的卷饼非常简单，而且比原版味道要好得多。该食谱仅涉及四个简单的步骤。你只需要将所有食材倒在一起，混合均匀，铺一层，然后烘烤。虽然下面的食材看起来很多，但这些食材会为整道菜带来非常美味的味道。让我们来看看食材有哪些：\n\
  \n- `鸡肉 Chicken`：3 或 4 杯，切碎并煮熟\n- `Fiesta 纳乔芝芝士 Fiesta nacho cheese`：1 罐\n- `鸡奶油汤\
  \ Cream of chicken soup`：1 罐\n- `Ro-Tel 番茄`：1 罐\n- `孜然 Cumin`：1 茶匙\n- `香菜 Cilantro`：约\
  \ 1/4 杯，切碎\n- `玉米粒 Cornlets`：1 杯\n- `黑豆 Black beans`：1 罐\n- `墨西哥混合芝士 Mexican blend`：2\
  \ 杯，丝状\n- `腌渍辣椒片 Pickled jalapeno`：用于装饰\n- `酸奶油 Sour cream`：用于装饰\n- `柠檬角 Lime wedges`：用于装饰\n\
  \n### 方法\n\n第一步是通过混合鸡肉、汤、芝士和番茄来准备馅料。下一步是将剩下的食材铺在烘焙盘中。如果你喜欢，可以发挥创意添加不同的食材。用铝箔覆盖菜，然后放入预热好的烤箱（350\
  \ 华氏度）中烘烤 20 分钟。20 分钟后，取下铝箔，让菜再烤 10 分钟。因此，在 30 分钟的忙碌后，你就能得到一顿晚餐。\n\n## 第 10 天\n\n\
  世界上有很多人认为牛肉菜很无味且不好吃。如果你属于这一类，请阅读第 10 天的菜，因为我们为你准备了一道非常美味的牛肉菜。这道菜有着丰富的风味，你会喜欢每一口。这道菜最棒的地方在于，当你懒得在厨房待着或没空做复杂的菜时，它是最好的选择。这道名为`玉米片辣椒派（Frito\
  \ Chili Pie）`的菜将通过提供美味晚餐并节省你的时间来帮助完成任务。\n\n`玉米片辣椒派` 是一种简单的牛肉食谱，含有许多食材来增加风味的深度。当你吃这道菜时，你会喜欢它如此简单却又美味的事。制作这道菜你不需要做任何苦力活，因为锅会在\
  \ 8 小时内为你做好。期间，你可以做任何你想做的事，而无需担心为家人准备晚餐。你需要：\n\n- `牛肉 Beef`：1.5 磅\n- `番茄酱 Tomato\
  \ sauce`：8 盎司\n- `蒜瓣 Garlic cloves`：3 瓣，切末\n- `Ro-Tel`：1 罐\n- `番茄 Tomatoes`：15 盎司或\
  \ 1 罐，切块\n- `盐 Salt`：半茶匙\n- `粉孜然 Ground cumin`：1 汤匙\n- `牛至香 Oregano`：1 茶匙\n- `辣椒粉\
  \ Chili powder`：1 或 2 汤匙\n- `墨西哥辣椒烟熏酱 Chipotle Tabasco sauce`：1 汤匙\n- `红豆 Kidney\
  \ beans` 和 `腰豆 pinto beans`：各 1 罐或各 14 盎司\n- `玉米粉 Cornmeal`：1/4 杯\n- `水 Water`：半杯\n\
  - `玉米片 Fritos`：一包\n\n### 方法\n\n\n\n虽然配料清单相当长，但方法非常简单。第一步是在锅中煎煮牛肉直到变色，在滤出牛肉后加入大蒜。混合\
  \ 2 分钟后，将食材移入慢炖锅，并加入除玉米粉、法力玉米片（Fritos）和水以外的所有食材。慢炖锅大约需要烹饪 8 小时，但在烹饪结束前 30 分钟，你可以向菜中加入水和玉米粉。菜做好后，用切达奶酪、法力玉米片和酸奶油等食材进行点缀。\n\
  \n# 第 11 天\n\n在第 11 天，尝试一些传统且不同的做法。对于第 11 天，我们建议你尝试匈牙利牛肉汤（Hungarian goulash），这是一道为你家人准备既传统又美味的晚餐。这道菜含有许多传统风味，你的味蕾会喜欢这种对日常鸡肉牛肉晚餐的改变。这道菜最棒的部分是它大约需要\
  \ 10 小时才能完成。因此在晚餐准备好之前，你有充足的时间完成所有的家务。一旦你尝试了这道菜，你一定会爱上它的。\n\n## 匈牙利牛肉汤\n\n匈牙利牛肉汤是一道老菜，以其美味和易于烹饪而闻名。这道菜有很多食材，但准备起来仍然非常。你只需要将所有食材倒入锅中，让锅在\
  \ 10 小时内发挥魔法即可。这道菜最适合那些你超级忙且没有额外时间烹饪美味佳肴的日子。让我们来看看所需的食材：\n\n- 炖肉用：2 磅，切块\n- 大蒜瓣：1\
  \ 瓣，应切末\n- 切片洋葱：1 个\n- 伍斯特酱汁：2 汤匙\n- 番茄酱：半杯\n- 红椒粉和盐：各 2 茶匙\n- 红糖糖：1 汤匙\n- 水：1 杯\n\
  - 面粉：半杯\n- 芥末：1/2 茶匙，干粉\n\n### 方法\n\n第一步是将除洋葱和肉以外的所有食材混合成混合物。然后，你必须将肉、面粉和洋葱放入锅中，并将混合物倒在上面。最后一步只需盖上锅，在肉准备好之前放松\
  \ 10 小时。10 小时后，用少量水化开面粉并加入肉中。再煮 15 分钟，你的菜就做好了。你可以搭配面条或米饭享这道菜。\n\n# 第 12 天\n\n在第\
  \ 12 天，我们为你准备了最简单的食谱之一。这个食谱从字面上来说是“倒进去即走”（dump-and-go），因为你所做的是将所有食材倒入慢炖锅，让它用低火烹饪\
  \ 6 到 8 小时。这道菜不仅容易制作，味道也很有吸引力。尽管是在慢炖锅中烹饪的，你也会喜欢这道菜提供的风味。这道菜是一道简单的烤牛肉，它会让你欲罢不能。\n\
  \n## 烤牛肉\n\n这个烤牛肉食谱以其味道极好和易于烹饪而闻名。完成后，它会为你提供很多丰富的肉汁，所以你不应该期望这道菜是完全干燥无味的。你也可以搭配土豆泥享这道菜，因为土豆泥会进一步提升菜的味道。以下是制作这道菜所需的食材：\n\
  \n- 肩肉肉：4 磅\n- 蘑菇奶油汤：1 罐\n- 土豆奶油汤：2 罐\n- 洋葱汤调料包：1 包\n- 博士乐（Dr. Pepper）：2 杯\n- 奶油里风调料：约\
  \ 1 茶匙用于调味。\n\n### 方法\n\n方法极其简单。你只需要在慢炖锅中混合所有食材，然后忘记晚餐 6 到 8 小时。慢炖锅会以低火烹饪，当你结束了劳累的一天回到家里后，它将为你呈现一道令人垂涎滴水的菜。\n\
  \n# 第 13 天\n\n第 13 天的菜是金黄鸡面（Golden Chicken with Noodles）。这道菜以其味道和制作的简便而闻名。因此，我们将这道菜包含在书中，以便你在没有时间准备美味的家庭晚餐时可以随时制作。这道菜非常浓郁且美味，会让你回味无穷。\n\
  \n## 金黄鸡面\n\n这道菜具有鸡肉的浓郁口感和许多不同的美味风味，在电压力锅中低火烹饪大约需要 7 小时。这道菜可以供你的 8 位家人或朋友食用，但准备工作几乎不需要\
  \ 10 分钟。以下是制作这道菜所需的食材：\n\n- 无皮鸡胸：8 块\n- 鸡肉奶油汤：2 杯，浓缩\n- 柠檬汁：1/4 杯\n- 水：半杯\n- 芥末：1\
  \ 汤匙\n- 胡萝卜：8 根，切片\n- 蒜粉：1.半茶匙\n- 煮好的鸡蛋面：4 杯\n- 欧芹：用于点缀\n\n### 方法\n\n除鸡胸肉、面条和欧芹外，将所有食材放入压力锅中。混合所有食材，然后将鸡肉加入。确保食材完全覆盖了鸡肉。下一步简单地就是让压力锅工作大约\
  \ 7 到 8 小时。在此期间，你可以出去上班、在家里休息或简单地为自己去购物。一旦你回来，菜就可以享用了了。在顶部撒上欧芹，并配面条和黄油豌豆一起食用。\n\n\
  # 第 14 天\n\n所以电子书的最后一个食谱是牧场风鸡（Ranch Chicken）。这又是一道慢炖食谱，准备工作几乎只需要 5 分钟。如果你寻找这个食谱的制作，准备工作几乎只需要\
  \ 5 分钟。如果你寻找这个食谱的制作，准备工作几乎只需要 5 分钟。\n\n## 牧场风鸡\n\n这道菜是一道慢炖食谱，准备工作几乎只需要 5 分钟。如果你寻找这个食谱的制作，准备工作几乎只需要\
  \ 5 分钟。如果你寻找这个食谱的制作，准备工作几乎只需要 5 分钟。\n\n- 鸡胸肉：1 ¼4 磅\n- 干塔可调料粉：2 汤匙\n- 鸡汤：11/2 杯\n\
  - 干牧场调料粉：1 汤匙\n\n### 方法\n\n方法极其简单。你只需要将所有食材倒入慢炖锅中，让锅在 5 小时内完成。一旦鸡肉煮熟，将其撕碎并放入锅中 30\
  \ 分钟。然后你的菜就做好了。\n\n结语\n\n所以我们为你和你的家人制定了一个为期 14 天的计划，免去你们每天准备美味晚餐的烦恼。请尝试书中提到的所有菜肴，因为它们都非常美味且超级易做。我们相信你和你的家人会喜欢这些菜的！\n\
  \n\n\n\n为什么当大多数人想到健康和健身时，他们的本能反应是感到沮丧，并表现得好像这个念头根本不存在一样？诚然，我们不能所有人都是健身专家，但如果你真的认真想要恢复体形并感觉更好，确实有一些技巧可以帮助你为了一直梦寐以求的而努力。无论是减肥还是获得更多精力，采用纯素饮食（Vegan\
  \ diet）都是一个极好的开始。\n\n虽然随着年龄的增长，身体的自然能量水平会降低，但这并不意味着你应该放弃健康目标。无论你处于人生的哪个阶段，你仍然可以做很多事情来改善生理和心理健康，而阅读这本书就是通向你一直想要的生活的第一步。\n\
  \n本书的设计目的是教你如何通过使用素食食品开始一种更健康、更绿色的生活方式。这并不是为了成为帮助你快速减肥并感觉更健康的时尚风，而是它应该鼓励你使用纯素食品来做出更健康的生活选择，并在过程中重塑你的生活方式。\n\
  \n本书包含了如何享受纯素饮食的证明步骤和策略，同时还能品尝各种美味的菜肴。书中还将向你展示：\n\n* 从零开始制作各种美味菜肴\n* 享受纯素饮食\n* 为你的新饮食进行购物，确保储备所有所需物资\n\
  * 从饮食中获得大量营养\n* 以及更多内容！\n\n所以，你还在等什么？开始阅读，从今天起改变你的生活方式吧！\n\n感谢你下载这本书，希望你喜欢！\n\n\
  不要忘记查看我在底部提供的最喜欢的饮食之一，并学习我如何通过 3 周饮食法快速减掉顽固的额外脂肪的策略。\n\n# 第一章：坚持纯素主义的好处\n\n现在许多人决定通过纯素主义来给生活带来巨大的改变。虽然坚持纯素主义在其他人看来可能有些受限，但这种饮食方式实际上是非常多样且营养丰富的。\n\
  \n坚持纯素主义的好消息是，它有很多好处，其中有些你可能甚至没有意识到：\n\n### 对健康非常有益\n人们决定成为纯素主义者的众多原因之一是因为这对你的健康非常有益。纯素饮食是以植物为基础的，我们都知道植物对我们非常好。低脂肪、富含多种维生素和矿物质以及蛋白质的饮食是保持我们健康的关键。\n\
  \n此外，纯素饮食可以帮助你抵御多种疾病和状况，例如：心脏病、癌症、肥胖、糖尿病等等。难怪越来越多的人决定坚持纯素主义！\n\n### 对动物非常有益\n我们都见过动物仅仅因为我们想吃肉而必须遭受的非必要痛苦。成为纯素主义者是你对这种痛苦说“不”的方式。当你不再购买肉类时，你就会影响当地和国际的肉类生产，这意味着为了餐桌而宰死的动物变少了。\n\
  \n### 对环境非常有益\n很多人并不知道纯素生活方式实际上对环境非常好。这是因为有助于减少与饲养动物以及肉类包装相关的碳足迹。\n\n你知道吗，如果世界上的一半的人变成纯素主义者，挨饿的人就会减少？这是因为牛和其他动物需要大量的土地来放牧。如果世界上的一半的人变成纯素主义者，那么饲养牛所需的土地就会减少。这意味着土地可以用于种植作物。通常一地地的作物养活的人比一地地的牲畜多得多。此外，如果你喜欢植物性饮食，由于供应更充足，食物通常会变得更加负担得。\n\
  \n你可以看到，坚持纯素主义有很多好处。你不仅可以帮助确保每个人都有更多的食物，而且还将获得更多的精力、更好的皮肤，通常情况下也会健康得多。难怪越来越多的人正在采用纯素的生活方式。\n\
  \n你可能计划只坚持纯素饮食 14 天以帮助你排毒，并从各种纯素友好食品中获益。如果是这样，你还不需要考虑长期坚持纯素饮食，除非你绝对确定这是你想做的事情。我想鼓励你完全纯素化。如果由于某种原因你做不到，那么为什么不考虑每个月至少纯素一周呢，因为你会感受到这种益处，环境也是如此。\n\
  \n# 第二章：开始纯素饮食\n\n开始新的饮食并不是容易的，但只要稍微努力，你就能享受其中。无论你开始哪种类型的饮食，你都需要齐努力尝试新食物，并在遇到困难时坚持下去。\n\
  \n好消息是，你可以让自己更容易地转换到纯素饮食。只要花一点时间和一点精力，你很快就会发现自己已经很享受纯素饮食，并开始因此感觉更好。\n\n### 不要假设它会很轻松\n\
  不幸的是，任何剧烈的饮食改变都不会容易的，但只要有一点意志力，你就可以完全纯素化，或者确保你完无损地完成 14 天纯素计划。在旅程中可能会犯一些错误，包括发现你准备的食物包含了奶酪、肉或其他产品。\n\
  \n### 弄清楚你能吃和不能吃什么\n起初，你可能会觉得饮食非常受限，但事实是它并没有你想象的那么局。当我刚开始纯素主义时，我以为会很痛苦，但事实是食物比你想象的要多。弄清楚你可以吃什么，以及你需要避开的食物。这需要一点时间来适应。当我开始纯素主义时，我会列出哪些食物是可以的。一段时间后，我不再需要看列表了，因为随着时间的增长，我知道哪些食物适合。\n\
  \n### 了解有哪些肉类和乳制品替代品\n好消息是有许多美味的替代品。从当地的健康食品店到当地超市，到处都有纯素友好食品。你自然会有一些你喜欢的食物，也有你讨厌的，但这都是尝试错的过程。找出你喜欢的纯素食物，并避开你真正不喜欢的。强迫自己吃难吃的东西对你没有任何好处。吃你喜欢的食物，你更有可能坚持纯素计划。\n\
  \n### 了解你从哪里可以采购食物\n正如我上面提到的，你可以从健康食品店和超市采购食物。你也可以在网上找到纯素食品，甚至在专门的纯素商店或活动中。获取所需食物越容易，你就越容易适应纯素生活方式。\n\
  \n### 邀请某人加入你的旅程\n即使你只计划坚持纯素饮食 14 天，理想情况下也应该邀请某人加入你的旅程。因为这会让你的旅程变得容易得多。你们可以交流心得，讨论你们的困难。你们还可以推荐烹饪方法，以及应该和不应该避免什么。\n\
  \n### 偶尔奖励自己\n\n\n\n\n\n偶尔给自己一点奖励，是保持高水平动力的最佳方式。你给自己的奖励种类完全取决于你，但它应该是一个不会影响你素食饮食计划成功的奖励。去高档素食餐厅吃饭，看电影，尽情访问你最喜欢的地方，或者和朋友或家人聚聚，做些你们都喜欢的事情。\n\
  \n给自己设定一个目标（例如完成为期 14 天的素食计划），然后奖励自己。\n\n## 学习从零开始烹饪美味佳肴\n\n因为有这么多美味的佳肴等待着你去尝试，如果你不学习从零开始烹饪，你将会错过很多机会。虽然有预包装的素食餐，但它们通常很贵，而且营养可能没有你预期的那样。\n\
  \n学习从零开始烹饪，享受创造一些美味餐的过程，为你的身体提供所需的营养。\n\n## 购物指南\n\n并不是每个人都完全清楚素食主义者吃什么，他们很大程度上认为我们吃蔬菜、豆类和豆腐，但事实是，我们的饮食是非常多样化的。\n\
  \n### 琼胶\n如果你做的菜肴需要明胶，请使用琼胶来代替，因为它是理想的替代品。\n\n### 豆类\n豆类是极佳的蛋白质来源，它们味道很好，而且可以具有肉类的口感。购买并使用各种豆类，并将它们作为饮食的一部分来享受。请确保如果你购买的是现成或预包装的豆类，它们仍然符合素食标准。\n\
  \n### 糙米\n糙米比白米营养丰富得多，所以请使用它。\n\n### 仿黄油抹酱\n非氢化抹酱\n\n### 库斯库\n如果可以的话，选择全麦库斯库，因为它比普通的要营养丰富得多。\n\
  \n### 无奶奶士\n你现在可以买许多不同品牌和口味的无奶奶士了。有片装（奶油奶士般的质地）、碎末状或调味的，你完全没有理由觉得自己错过了奶士。\n\n###\
  \ 鸡蛋替代品\n鸡蛋替代品是一个很好的替代选择，而且味道也很好。你可以购买素食蛋黄，但很难找到，所以你现在可能需要坚持使用替代品。\n\n### 水果蔬菜\n\
  素食饮食可以包含你喜欢的任何水果蔬菜。只需确保如果你购买的是处理过的水果蔬菜，它们是符合素食标准的即可。\n\n### 奶\n- 杏奶\n- 米\n- 大麻\n\
  - 大豆\n\n### 营养酵母\n营养酵母用于赋予食物类似奶士的质地。它不含胆固醇，非常适合用于奶士味的酱汁。\n\n### 坚果\n坚果的蛋白质含量极高，可以加入各种菜肴，也可以单独食用。如果你想念肉类的味道和口感，我推荐吃栗子，因为它们的口感非常像肉。\n\
  \n### 面条\n面条有各种形状和大小，它是那种只需极少量配料就能做一顿饭的食物。如果你想更健康，请选择全麦面条或多谷面条。\n\n### 藜麦\n藜麦不仅味道好，而且蛋白质含量很高，可以加入各种菜肴中。\n\
  \n### 谷筋\n这种由小麦面筋制成，可以煎炸或烘烤。面筋是极佳的蛋白质来源，如果你想让菜肴有嚼劲，它也很棒。\n\n### 豆浆\n豆浆有不同的口味，可以真是一份真正的享受。\n\
  \n### 天贝\n这是一种基于豆豉的肉类替代品，口感很厚且带有咸鲜的风味。它非常适合烧烤。\n\n### 豆腐\n豆腐可以加入各种菜肴中，由豆浆制成。它最好用作吸收其他配料味道的方法。\n\
  \n### 蔬菜汉堡\n蔬菜汉堡可以是含肉汉堡的美味且营养丰富的替代品。蔬菜汉堡也可能高脂肪，所以买之前前请务必检查脂肪含量。\n\n还有许多其他符合素食的食物，但如果我把它们都列出来，清单将没完没了。你越深入探索素食世界，就会发现越多的食材和食物。不要害怕在网上和当地商店搜索其他配料，因为你可能会发现非常特别的东西。\n\
  \n## 关键食物和食材\n\n看看我提到的营养素以及含有这些营养素的食物。这将帮助你完善购物清单，让你最终吃到各种多样的美味营养丰富的食物：\n\n*请注意，你还可以吃许多种其他食物，但下面的列表显示的是那些营养特别丰富的食物。*\n\
  \n### 钙\n- 杏仁\n- 亚麻籽\n- 大豆\n- 西兰花\n- 羽甘蓝\n- 葵花籽\n- 鹰嘴豆\n- 小扁\n- 天贝\n- 榛果\n- 红腰豆\n\
  - 含有硫酸钙的豆腐\n- 强化早餐谷物\n- 兵豆豆（眼壳豆）\n- 强化非奶奶\n- 秋葵\n- 强化非奶酸奶\n- 橙子\n- 强化橙汁\n- 斑豆\n\
  - 强化大豆制品\n- 开皮果\n- 无花果\n- 芝麻\n\n### 铁\n- 鹰嘴豆\n- 兵豆豆（眼壳豆）\n- 强化蔬菜汉堡\n- 斑豆\n- 强化大豆制品\n\
  - 藜麦\n- 枸杞\n- 葡萄干\n- 红腰豆\n- 大豆\n- 小扁\n- 豆腐\n\n### Omega3\n- 亚麻籽油\n- 亚亚籽籽\n\n###\
  \ 蛋白质\n- 豆类\n- 天贝\n- 小扁\n- 豆腐\n- 坚果\n- 蔬菜\n- 种子\n\n### 维生素 B12\n- 营养酵母\n- 非奶奶\n\
  - 强化早餐谷物\n- 素食 B12 补充剂\n- 强化食品\n\n### 维生素 D\n- 素食 D 补充剂\n\n## 第 3 章：饮食计划（14 天指南）\n\
  \n为了从你的饮食计划中获得最大的收益，你可能需要考虑给自己一点鼓励。如果你想通过素食减肥并改善健康，请查看以下建议：\n\n### 水\n保持水分非常重要，它不仅确保你的身体不会缺水，在其他方面也至关重要。充足的水会让你减轻压力，帮助排出毒素，你的皮肤也会变好。难以的是，充足的水还能改善睡眠。真的没有理由不每天喝\
  \ 8 杯水。\n\n### 运动\n如果你想保持身材，运动是关键，而且由于素食饮食让你更有精力，你会更倾向于运动。不要认为你不摄入肉类和奶制品就不能运动。素食健身者可以运动，你也可以。\n\
  \n### 进餐时间\n进餐要有规律，你不应该跳过任何餐，即使你不饿。总是吃点东西，因为它会启动你的代谢，这意味着你更有可能减肥。\n\n另一个重要的点是，你不应该跳过早餐。不吃早餐的人更容易胖。这是因为早餐会启动代谢，并为你提供开始所需的能量。\n\
  \n下面你将找到关于在 14 天素食计划期间应该考虑食用的食物指南。这份指南只是建议，你可能会根据自己的需求和喜好进行调整。你应该做的最重要的事情之一就是享受素食，因为这样你更容易成功。\n\
  \n*请注意，某些菜肴的食谱可以在下一章找到。*\n\n### 第一天\n- 强化早餐谷物或芒果椰奶昔\n- 零食：花生酱碧桃球\n- 午餐：鹰嘴豆沙拉\n-\
  \ 零食：水果或素食酸奶\n- 晚餐：鹰嘴豆菠喱\n\n### 第二天\n- 强化早餐谷物或蘑菇番茄饼\n- 零食：水果\n- 午餐：日式面\n- 零食：水果或素食酸奶\n\
  - 晚餐：扁扁披萨\n\n### 第三天\n- 强化早餐谷物或素食酸奶加麦片\n- 零食：混合坚果\n\n\n\n\n\n# 午餐：菠菜沙拉\n零食：一份水果或素食酸奶\n\
  晚餐：你喜欢的任何餐点（犒劳自己）\n\n## 第四天\n早餐：强化早餐麦片或配素食友好奶油乳士的贝果\n零食：水果奶昔\n午餐：墨西哥沙拉\n零食：一份水果或素食酸奶\n\
  晚餐：烤土豆配素食友好鸡蛋和沙拉\n\n## 第五天\n早餐：强化早餐麦片或炒豆腐干\n零食：杏仁蛋白棒\n午餐：椰子豆汤\n零食：一份水果或素食酸奶\n晚餐：酿汁彩甜椒\n\
  \n## 第六天\n早餐：强化早餐麦片或素食友好法式吐司\n零食：种子混合露\n午餐：酸子汁豆腐\n零食：一份水果或素食酸奶\n晚餐：蔬菜汉堡配沙拉\n\n##\
  \ 第七天\n早餐：强化早餐麦片或加水果的牛奶酸奶\n零食：一个苹果或橘子\n午餐：蔬菜烤土豆\n零食：一份水果或素食酸奶\n晚餐：快速蔬菜意面\n\n## 第八天\n\
  早餐：强化早餐麦片或芒果椰子奶昔\n零食：花生酱碧果仁丸（能量球）\n午餐：鹰嘴豆沙拉\n零食：一份水果或素食酸奶\n晚餐：鹰嘴豆菠菜咖喱\n\n## 第九天\n\
  早餐：强化早餐麦片或蘑菇番煎饼\n零食：水果\n午餐：日式面条\n零食：一份水果或素食酸奶\n晚餐：扁豆千千\n\n## 第十天\n早餐：强化早餐麦片或配麦片的素食酸奶\n\
  零食：混合坚果\n午餐：菠菜沙拉\n零食：一份水果或素食酸奶\n晚餐：你喜欢的任何餐点（犒劳自己）\n\n## 第十一天\n早餐：强化早餐麦片或配素食友好奶油乳士的贝果\n\
  零食：水果奶昔\n午餐：墨西哥沙拉\n零食：一份水果或素食酸奶\n晚餐：烤土豆配素食友好鸡蛋和沙拉\n\n## 第十二天\n早餐：强化早餐麦片或炒豆腐干\n零食：杏仁蛋白棒\n\
  午餐：椰子豆汤\n零食：一份水果或素食酸奶\n晚餐：酿汁彩甜椒\n\n## 第十三天\n早餐：强化早餐麦片或素食友好法式吐司\n零食：种子混合露\n午餐：酸子汁豆腐\n\
  零食：一份水果或素食酸奶\n晚餐：蔬菜汉堡配沙拉\n\n## 第十四天\n早餐：强化早餐麦片或加水果的牛奶酸奶\n零食：一个苹果或橘子\n午餐：蔬菜烤土豆\n\
  零食：一份水果或素食酸奶\n晚餐：快速蔬菜意面\n\n这期 14 天的素食计划是一个非常健康且可持续的计划，可以帮助你改善健康状况，提供更多能量，并帮助你减肥。该计划经过专门设计，以确保你在享受均衡美味饮食的同时，也确保对环境的影响降至最低。该计划还让你保持不吃肉类和乳制品，而不会错过那些不符合伦理的食物。\n\
  \n## 第四章：早餐食谱\n\n### 芒果椰子奶昔\n原料：\n- 200 ml 无乳椰子奶\n- 1 根香蕉\n- 1 汤磨碎亚麻籽\n- 4 汤素食友好酸奶\n\
  - 1 汤葵花籽\n- 1 汤南瓜子\n- 120 克 冷冻或冷藏的芒果块\n\n制作方法：\n将所有原料放入奶昔机或搅拌机中，搅拌至光滑。光滑后，倒入杯中即可享用。\n\
  \n### 蘑菇番茄煎饼\n原料：（制作 8 份）\n- 140 克 自升筋面粉\n- 400 ml 豆奶\n- 一小撮盐\n- 1 茶匙豆粉\n- 2 汤 植物植物油\n\
  - 250 克 小蘑菇\n- 2 汤 豆奶或奶油\n- 250 克 切半的小西番茄\n- 一小撮松子\n\n制作方法：\n筛出所有面粉并放入搅拌机中，然后加入豆奶。搅拌至混合物光滑。现在将约\
  \ 3 汤混合物倒入煎锅中，煎至混合物中出现气泡。现在是时候翻面了，在另一面煎，直到呈现出漂亮的金黄色。\n\n待混合物变褐色后，取出放在盘子中。现在对剩下的混合物重复此操作。\n\
  \n在煎饼冷却期间，将蘑菇放入煎锅中，煎至变软。现在加入番茄，烹饪约 2 分钟。加入豆奶或奶油以及松子，用小火煎至食材融合。\n\n取 2 个盘子，每盘放 4\
  \ 个煎饼，顶部加上蘑菇和番茄，即可享用。\n\n### 素食友好法式吐司\n原料：（供 3 人食用）\n- 2 汤 面粉\n- 1 杯 豆奶\n- 1 汤 营养酵母\n\
  - 1 茶匙 香草精\n- 1 茶匙 糖\n- 6 片全麦面包\n- 一小撮 肉豆蔻粉\n\n制作方法：\n除面包外，将所有原料加入碗中并混合均匀。现在将面包浸入混合物中直到裹匀。取一个平底锅或煎锅，将浸泡过的面包煎至单面金黄色，然后翻面重复此操作。即可享用。\n\
  \n### 炒豆腐\n原料：（供 3 人食用）\n- 2 茶匙 橄榄油\n- 16 盎司 洗净切块的豆腐\n- 半 茶匙 干洋葱碎\n- 3 汤 营养酵母片\n\
  - 一小撮蘑菇\n- 1 个 切片的小洋葱\n- 1 瓣 大蒜\n- 1 半 汤 生抽\n- 现磨黑胡椒\n\n制作方法：\n在煎锅中用中火煎豆腐，不断搅拌煎至金黄色。加入洋葱和酵母，搅拌至豆腐均匀裹匀。现在加入橄榄油、蘑菇和大蒜，煎至蘑菇变软嫩。现在撒上生抽和白胡椒，搅拌均匀。即可享用。\n\
  \n## 第五章：午餐食谱\n\n### 鹰嘴豆沙拉\n原料：（供 5–6 人食用）\n- 200 克 熟藜麦\n- 1 根 切碎韭葱\n- 50 克 松子\n\
  - 2 个柠檬汁\n- 3 汤 橄榄油\n- 400 克 鹰嘴豆\n- 50 克 葡萄干\n- 4 汤 欧芹\n- 一把 生菜叶和红甜椒\n- 1 根 切碎芹芹\n\
  - 1 个 切片萝卜子\n\n制作方法：\n轻轻烘烤松子至呈金黄色，然后将所有原料在碗中混合。根据喜好调味，即可享用。\n\n### 日式面条\n原料：（供 2\
  \ 人食用）\n- 200 克 荞麦面\n- 1 个 切成薄片的红甜椒\n- 100 克 荷兰豆\n- 2 汤 水\n- 2 茶匙 烤芝麻粒\n- 半个 切片黄瓜\n\
  - 2 汤 生抽\n- 2 汤 米醋\n- 2 汤 芝麻酱酱\n- 1 汤 糖\n\n制作方法：\n将水和芝麻酱酱混合，然后加入生抽。现在加入米醋和糖再次搅拌，备用。\n\
  \n煮熟面条并分放在 2 个盘子或碗中。加入荷兰豆、黄瓜和甜椒，然后淋上酱汁。在顶部撒上芝麻，即可享用。\n\n### 菠菜沙拉\n原料：（供 4-5 人食用）\n\
  - 2 汤 米醋\n- 2 汤 橄榄油\n- 1 汤 烤芝麻油\n- 2 汤 鲜榨橙汁\n- 1 瓣 大蒜\n- 1 汤 蜂蜜糖\n- 1/4 汤 熏红椒粉\n\
  - 2 个 切碎的中等甜椒\n- 半个 切片洋葱\n- 一把 切碎的菠菜\n- 半个 切片橙子\n- 装饰用芝麻\n\n制作方法：\n将米醋、橄榄油、橙汁、蜂蜜糖、芝麻油、熏辣椒粉和大蒜放入搅拌机中，搅拌至食材融合。放在一边，然后将洋葱、菠菜、橙片、甜椒放入大碗中混合。\n\
  \n现在将橙味芝麻酱淋在食材上，并撒一些芝麻。\n\n### 墨西哥沙拉\n原料：（供 4 人食用）\n- 1 茶匙 墨西哥调料\n- 3 张 切碎的面粉饼\n\
  - 1 汤 橄榄油\n- 1 把 碎冰生菜\n- 200 克 切半的小西番茄\n- 400 克 沥水的黑豆\n- 1 个 柠檬汁\n- 2 个 去皮并切块的牛油果\n\
