  \ DASH 饮食，效果会更好，而且见效非常快。\n\n市面上有很多饮食计划，但大多数都无法提供持续的效果，而且难以坚持。DASH 则大不相同，因为它推广的是实际上易于遵循并能融入日常生活的饮食计划。\n\
