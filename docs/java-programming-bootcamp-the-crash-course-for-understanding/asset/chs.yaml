  \ 到 2 汤新鲜罗勒\n- 2 汤橄榄油\n\n### 准备方法：\n- 根据包装说明，使用水和低钠汤煮好米饭。\n- 将烤箱预热至 350 华氏度。然后，在鸡胸肉上划切。\n\
  - 与此同时，切开番茄顶部并取出籽。米饭煮好后，放入大蒜、鸡肉和罗勒，然后撒上大量的帕玛森芝士。淋上一些橄榄油。\n- 在烤箱中烤 15 到 20 分钟。享用！\n\
  \n## 食谱 6：亚洲风味烤豆腐\n\n豆腐的味道像肉一样，但要健康得多。尝试这道充满浓郁亚洲风味的菜谱吧。你一定会喜欢它的。\n\n### 你将需要：\n\
  - 1 块豆腐，切块\n- 4 到 5 大蒜\n- ½ 杯帕玛森芝士（磨碎末的）\n- 1 杯水和低钠蔬菜汤\n- 1 到 2 汤新鲜罗勒\n- 2 汤橄榄油\n\
  \n### 准备方法：\n- 将烤箱预热至 350 华氏度。\n- 在烤箱中烤 15 到 20 分钟。享用！\n\n*(注：由于原文文本在结尾处存在重复和乱码，翻译已根据逻辑进行了修正和去重)*\n\
  \n\n\n\n-   你也可以使用黄瓜和豆角等蔬菜。\n\n## 食谱 5：自制起士大蒜脆片\n\n这是一种独特、美味且健康的零食，它将改变你吃薯片的方式。\n\
  \n你需要：\n- 1 包云饺皮\n- 3/4 杯低脂奶士（切碎状）\n- 1 茶匙大蒜粉\n- 半茶匙辣椒粉\n- 1 汤匙涂刷的橄榄油\n\n### 制作方法：\n\
  - 在云饺皮上刷一些橄榄油。\n- 将饺皮对角线切成两半，得到三角形的包装片。\n- 将切好的饺皮放在烤盘中。放在备用。\n- 在碗中，将辣椒粉、碎奶士和大蒜粉混合均匀。撒在饺皮上。\n\
  - 在 350 华氏度下烘烤 8 到 10 分钟，直到呈金黄色。冷却几分钟后。上菜并享用吧！\n\n## 食谱 6：DASH 燕麦曲奇\n\n曲饼确实非常好吃，但其中的脂肪对身体并不是那么有好处。这里有一个食谱可以让你吃到停不下来。\n\
  \n你需要：\n- 1 杯轧制燕麦片\n- 2 个鸡蛋（仅需蛋蛋白）\n- 1 杯面粉（多功能面粉）\n- 半杯低钠低脂花生酱\n- 半杯软性人植物油或黄油（低脂）\n\
  - ½ 杯红糖\n- 一小撮泡苏打\n- 3 滴香草精\n\n### 制作方法：\n- 使用电动搅拌器将花生酱和软化的黄油或人植物油混合——持续搅拌大约 30\
  \ 到 40 秒。\n- 混合泡苏打和糖。加入香草精和鸡蛋。搅拌至完全混合均匀。加入面粉，然后加入燕麦片。\n- 用茶匙挖取面团。放在饼干板上，每个之间至少留出\
  \ 2 到 3 英寸。\n- 在 375 华氏度下烘烤 6 到 8 分钟。冷却几分钟。享用吧！\n\n## 食谱 7：无罪恶乳酪浆果\n\n浆果是维生素和矿物质的极佳来源——它们也是抗氧化剂。你可以利用低脂酸奶和这些小浆果制作美味的零食。\n\
  \n你需要：\n- 一杯浆果（蓝莓、草莓、树莓）\n- 蝴蝶结或饼干棒\n- 2 到 3 杯低脂味酸奶（芒果、香草等）\n\n### 制作方法：\n- 在碗中将浆果和酸奶混合。\n\
  - 盛入纸杯或冰棒模具中，然后用铝箔覆盖。\n- 在中间戳一个小孔，插上蝴蝶结/饼干棒。\n- 放入冷冻室冷几小时。享用吧！\n\n## 第 8 章 – DASH\
  \ 饮食甜点创意\n\n### 食谱 1：热带水果串\n\n这是一种美味且健康的甜点，可以平复你对甜的渴望。\n\n你需要：\n- 10 颗草莓\n- 25 颗黑莓\n\
  - 1 杯 切块的菠萝\n- 1 杯 切块的奇异果\n- 串签\n- 1 杯零脂酸奶\n- 240 克零脂奶油奶士\n- 2 汤匙蜂蜜\n\n### 制作方法：\n\
  - 简单地将水果串在签上。发挥你的创意。\n- 将奶士、蜂蜜和酸奶混合。蘸入水果并享用吧！\n\n### 食谱 2：DASH 菠萝冰棒\n\n这是一种清爽的甜点，一定能收紧你的腰线。\n\
  \n你需要：\n- 2 杯 切块的菠萝\n- 1/3 杯 菠萝汁\n- 半杯淡味椰奶\n- 2 茶匙糖\n\n### 制作方法：\n- 将菠萝切块并放入搅拌机中。加入菠萝汁并搅拌至光滑。\n\
  - 加入椰奶和糖，再搅拌一分钟。\n- 将混合物转移到冰棒模具中，放入冰箱冷。享用吧！\n\n### 食谱 3：甜瓜冰饮\n\n这种饮品冷后食用最佳。你也可以使用西瓜或哈密瓜。\n\
  \n你需要：\n- 2 到 3 杯 切块的哈密瓜\n- 1 杯 橙汁\n- 1 杯 零脂酸奶\n\n### 制作方法：\n- 将所有食材放入搅拌机中，点动至光滑。\n\
  - 放入冰箱冷藏至少 2 小时。享用吧！\n\n### 食谱 4：浆果香蕉冰淇淋\n\n香蕉是奶油的极佳替代品。期待更低的热量和脂肪带来的美味和奶油口感。\n\n\
  你需要：\n- 3 根香蕉，切片\n- 半杯 零脂牛奶\n- 1 杯 冷冻蓝莓\n- 1 汤匙 香草精\n\n### 制作方法：\n- 将切好的香蕉冷藏 6 到\
  \ 8 小时。\n- 冷后，放入搅拌机中，与香草精、牛奶一起，点动 2 到 3 分钟。\n- 加入浆果，再次点动一分钟。享用吧！\n\n### 食谱 5：免烤香蕉白巧克力饼\n\
  \n你不需要烤箱和厨师的大师技艺就能做出这种健康美味的甜点。\n\n你需要：\n- 120 克 白巧克力，切碎\n- 250 克奶油奶士\n- 1 到 2 根香蕉，切片\n\
  -  graham 饼干底\n- 3 汤匙 酸奶油\n- 半杯 冷藏的奶油\n- 1/3 杯糖\n- 3 到 4 滴 香草精\n\n### 制作方法：\n- 将切碎的白巧克力放入碗中。放在有沸水的水锅上方。稍微融化时，彻底搅拌直至完全融化。\n\
  - 混合糖和奶士，然后打发至均匀光滑。加入酸奶油。将冷藏的奶油打发至足够的硬。小心地翻入巧克力混合物中。\n-  graham 饼干底。放入混合物。\n\n###\
  \ 食谱 6：甜瓜冰沙\n\n冷藏后食用总是很棒。哈密瓜或甜瓜都是极佳的选择。它富含维生素 C。\n\n你需要：\n- 4 到 5 杯 切块的甜瓜\n- 1 杯\
  \ 冰\n- 1/3 杯 鲜榨橙汁\n\n### 制作方法：\n- 将冰块放入搅拌机，与甜瓜和橙汁一起。搅拌 12 秒。\n\n### 食谱 7：胡萝卜奶士蛋糕\n\
  \n除了普通的巧克力，为什么不尝试胡萝卜做甜点呢？\n\n你需要：\n- 4 杯 胡胡萝卜\n- 4 个大鸡蛋\n- 一杯 奶士\n- 香草精味蛋糕粉\n- ½\
  \ 杯 鲜橙汁\n- 1/3 杯 葡萄\n- 1 汤 肉桂\n- 半 杯 核果\n- 橙皮\n\n### 制作方法：\n- 预热烤箱至 350 华氏度。然后用植物油或任何防粘涂层涂抹模具。撒上面粉。备用。\n\
  - 在碗中混合蛋糕粉、鸡蛋、橙汁和肉桂粉。用电动搅拌器搅拌 50 秒或更久直到混合均匀。再搅拌一分钟以产生浓稠混合物。\n- 缓慢翻入坚果、碎胡萝卜和葡萄。将混合物倒入模具放入烤箱。\n\
  - 烘烤 30 到 40 分钟，直到蛋糕呈金黄色。通过轻轻按蛋糕测试。当它回弹时就好了。\n- 从烤箱取出。冷却 10 到 15 分钟。用面包刀或平铲沿模具边缘运行，将蛋糕从模具取出并倒扣。冷却\
  \ 20 分钟或更久。\n- 与此同时，打发奶士直到足够。加入一些柠檬皮以增强风味。\n- 将蛋糕水平切开。在一层顶部涂抹奶士霜。加入一些碎核果。盖上另一层并做同样的操作。顶部撒一些橙皮。享用吧！\n\
  \n\n\n\n\n你应该学会用更健康的选择来平复你对甜食的渴望。与其吃那块罪恶的巧克力蛋糕，为什么不选择一个全麦玛芬，或者更好的——新鲜水果呢？你甚至可以开始尝试吃硬糖或坚果。\n\
  \n## 避免酒精和糖分\n\n如果你真的想过得更健康、更有活力，你应该学会放弃糖分和酒精。这些东西味道确实很棒，但效果远不如一杯低脂或零脂牛奶，或者是不加糖的新鲜水果果汁。\n\
  \n## 阅读食品标签\n\n在开始之前，你需要在你的储藏室里备满 DASH 饮食的食品。为此，你必须学会识别这些物品。仔细检查标签，确保你购买的产品是新鲜的、低脂肪、低钠和低热量的。例如，与其购买普通的白面包，不如选择全麦面包。与其吃白米，野生米、红米或糙米更为合适。\n\
  \n## 无需剥夺\n\n在 DASH 饮食中，不需要经历饥饿，因为你可以在享受美食的同时变得健康并减轻体重。继续保持每天三顿正餐，并在期间穿插两顿或更多的小食即可。这就是这种饮食的美妙之处。通过\
  \ DASH 减轻体重，享受更健康的生活。\n\n## 摄入大量的蔬菜\n\n饮食中蔬菜和水果的常规分量只有半杯。为了让 DASH 饮食发挥作用，理想是将分量翻倍。所以，与其半杯，不如完整。浆果是极佳的选择，至于蔬菜，尽可能选择新鲜的，但也允许冷冻蔬菜。大多数超市都有沙拉吧，并出售包装好的即食蔬菜，这减轻了你的负担。在如此便利的情况下，没有理由不吃蔬菜和水果。\n\
  \n## 其他蛋白质来源\n\n在选择为身体提供必需蛋白质的食物时要明智。尽可能限制红肉。多吃一些瘦肉，如鱼类和禽类。此外，还有许多优质健康的蛋白质来源，如豆腐、豆浆、坚果和种子。这些可以帮助你在保持健康和缩小腰围的同时增加饱腹感。\n\
  \n## 当无法避免牛奶时\n\n当然，牛奶确实是一种享受。你用它制作奶昔、烹饪、早咖啡等。在 DASH 饮食下，饮用牛奶并不是犯罪。只需确保你使用的是脱脂或低脂品种，就没有问题。\n\
  \n## 避免垃圾食品\n\nDASH 饮食的目标之一是培养可以受用一生的健康饮食习惯。所以，学会如何丢弃垃圾食品。在这种情况下，垃圾意味着任何经过加工、包装、高盐、含咖啡因、含糖并被防腐剂轰炸的食物。因此，限制或忘记超市里的那些包装薯片、碳酸饮料和包装甜点。但不要太沮丧，你仍然可以吃这些，但要作为一种“奖励”。垃圾食品不应成为你日常饮食的一部分。\n\
  \n## 结论\n\n再次感谢你下载这本书！\n\n希望这本书能够帮助你获取更多关于极具可行性的 DASH 减肥饮食法的信息——包括该计划的核心内容、基本饮食指南，以及全天餐（包括小食和甜点）的简单食谱。\n\
