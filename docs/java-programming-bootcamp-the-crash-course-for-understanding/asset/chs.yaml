  \n由于参与者所获得的结果，生酮饮食变得越来越流行。因为它限制了碳水化合物的摄入量，体重会减轻，身体消耗的能量最终大于摄入的能量。市场上有很多饮食是不可持续的，坦率说是不健康的。这些饮食通常会严重限制你摄入的食物种类，而这会导致健康问题。\n\
  \n当你开始生酮饮食时，你会限制碳水的摄入，但会增加蛋白质的摄入量。这非常棒，这意味着你的身体将开始燃烧脂肪，你不会感到饥饿。\n\n### 易于坚持：\n\n\
  生酮饮食的美之处在于它非常容易坚持。你无疑会喜欢在减肥的同时享受许多美味的佳餐。你可以大量吃培根、奶酪和其他食物，同时看着体重下降，这似乎很奇怪。但事实是，这种饮食是有效的，而且效果很好。\n\
  \n### 如何在生酮饮食中减脂：\n\n当你开始生酮之旅时，你摄入的是不含许多碳水化合物的食物。当你摄入碳水化合物时，身体会先燃烧它们产生的能量，然后才会寻找燃烧你身上携带的任何脂肪。\n\
  \n由于你不会摄入很多碳水，你的身体会首先燃烧脂肪，这意味着你开始减肥。你身上多余的腹部脂肪会被首先烧掉，这可能会让你对自己的外表更有信心。你也会开始感到更有活力，并可能让你的生活变得更好。\n\
  \n# 第二章：开始生酮饮食计划\n\n从我自己的经验来看，开始任何饮食都不如你希望的那么容易，但下面有一些提示可以让事情变得更容易。请不要假设生酮饮食会轻而易举，它可能比你想的要困难，但不要担心，你会成功的。\n\
  \n### 犯错\n\n开始一种新饮食并不总是容易，生酮饮食可能很难入门。这是因为你被要求远离碳水化合物和任何糖分。你偶尔可能会犯错并摄入比想象中多的糖分，但不要因此感到沮丧。你越参与这个饮食计划，就越习惯食用含有少量或没有碳水化合物的食物。\n\
  \n### 了解哪里可以获取原料\n\n为了制作书中的食谱，你很多原料在大多数商店都能买到。这就是这种饮食的美妙之处，它不需要你吃任何难以获得的东西。我知道有些食谱要求你使用替代奶（如豆奶或杏仁奶，偶尔还有椰子奶），但它们通常在各种商店都有售。如果你当地的超市不卖替代奶，你可能想去健康食品店看看，那里很可能卖。如果你仍然困惑，可以转向互联网，因为有很多网站以合理的价格出售替代奶。\n\
  \n\n\n# 鱼\n\n鱼类也是极佳的蛋白质来源，含有一些非常健康的油脂。我必须强调，你需要远离炸鱼和裹粉的鱼，因为这些含有大量的碳水化合物。尝试每周不要吃超过三次鱼，因为已知鱼类含有大量的汞。\n\
  \n# 乳制品\n\n我知道完全避开乳制品很困难，但也有一些很好且美味的替代品。我知道这些经过了某种程度的加工，但它们能确保你获得所需的钙以及其他非常有益的营养成分。\n\
  \n# 水果和蔬菜\n\n许多人认为在生酮饮食中不能吃水果蔬菜。这完全是一个误解，因为你需要摄入这些食物来能量。水果蔬菜含有糖分，由于你不会摄入碳水化合物，你需要从其他地方获得能量。确保你只吃低糖的水果蔬菜，以免导致体重增加。\n\
  \n# 酱料\n\n面对现实吧，我们都喜欢偶尔给餐点加一些酱料。虽然这在生酮饮食中完全可以接受，但你应该确保不要摄入过多的碳水。好消息是，这种饮食允许食用油基酱料和蛋奶酱，所以尽管情吃吧！\n\
