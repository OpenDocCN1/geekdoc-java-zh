    # ## 7. Practical applications and food waste research projects


    This study has highlighted the importance of analyzing food waste data generation,
    considering FW treatment in technical feasibility, environmental impact assessment,
    and economic considerations. The study uses of national data, further analysis
    at a detailed stage is necessary to uncover all the complexities of food waste
    management systems. Life cycle assessments are useful tools to evaluate the environmental
    impacts of each treatment. Scenarios can assist in identifying the most environmentally
    friendly alternative by visualizing and predicting the effects of different food
    waste management systems. The implementation of sustainable food waste management
    strategies can not only reduce environmental impact and promote sustainability
    but also create economic opportunities by promoting circular economies.


    # ## 8. Conclusions


    Approximately 20.8 million tons/year of food waste in various regions Indonesia.
    Application of this target to achieve its 70% waste target requires integrated
    regulation, initiatives, and comprehensive technology. However, no concrete regulations
    or incentives exist to accelerate FW reduction and handling. Small and large-scale
    waste management must be considered from a technical, environmental, and economic
    standpoint. Application of BS, AD, composting, thermal treatment, and RDF promote
    FW treatment technologies with lower environmental impacts. Environmental impacts
    could be measured by carrying out extended studies. This data will work for in
    the e-version of this paper.


