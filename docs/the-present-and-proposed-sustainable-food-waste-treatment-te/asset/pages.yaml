    # 5.3. Composting


    Composting is a method of handling environmental waste that involves the biological
    decomposition of organic substances (Cai et al., 2023). Compost can be created
    using aerobic composting, which involves stacking rows of biodegradable materials.
    This process works for larger-scale processes where mechanical rotation is required
    and is frequently used in agricultural treatment plants (Abu et al., 2021; Keng
    et al., 2020; Sari et al., 2013). Most common compost plants in Indonesia involve
    aerobic composting with management arrangement, where the waste is stacked and
    turned annually.

    The Indonesian government and community use composting for management. In 2021,
    managed waste and generated compost products reached 192,000 tons/year with a
    residual yield of the animal feed product is 38,236 tons/year. Large/scale composting
    typically use the open window method and are managed by the local government.
    An example of composting in a metropolitan city is Surabaya. Waste reached 26
    thousand plants daily that utilize waste from the city and food products from
    households and markets (as supplementary material) (Environment Bureau of Surabaya,
    2021). Composting is associated with environmental issues, such as acidification,
    odor, and ground and water contamination from the release of leachate and potential
    heavy metals from decomposing waste, composting can improve waste disposal conditions
    and reduce GHG emissions by 20–25% (Salim et al., 2021).


    # 5.4. Thermal treatment


    The process of generating heat from waste material is thermal oxidation, which
    includes incineration. In waste, containing hydrocarbons are burned during incineration,
    converting them to water, carbon dioxide, and other pollutants. To provide developing
    an effective process, it is essential to comprehend the fundamental elements of
    exhaust such as carbon, oxygen, nitrogen, sulfur, and ash (Lokahita et al., 2019).
    Thermal waste processing can reduce large amounts of waste and convert it into
    electrical energy that is managed by the community (Kadanag and Sinaga, 2020).

    In February 2016, the Indonesian government launched a presidential regulation
    on the acceleration of WTE technology in seven cities. WTE was defined as a plant
    that uses processing technology to convert MSW, waste and plastic into energy
    through gasification and pyrolysis. Thermal waste capacity in Indonesia reached
    26947.05, 11913.60, and 3160.90 tons/year from 2021–2022, respectively (Ministry
    of Environment and Forestry of the Republic of Indonesia, 2022) (as supplementary
    material). It is thought that gasification is more reliable for many areas due
    to its reduced impact compared to landfilling, incineration, and pyrolysis (Biondo,
    2021; Gamanunta, 2010; Mulawati, 2018; Rahim, 2017).


    # 5.5. Landfilling


    Disposal of FW in landfills is considered the most environmentally damaging option
    and, therefore, is the lowest method in FW waste management. This waste system
    is considered the most polluted and significantly contributes to global warming
    and acidification (Lumban, 2017; Nikmah and Warmadewanti, 2013).


    # 5.6. Refuse-derived fuel


    As organic and plastic materials make up than 50% of Indonesia''s solid waste,
    there is potential for recovering RDF (Lokahita et al., 2019). Indonesia has three
    RDF project units: Medan City, Depok City and Citac City with private partners,
    where the unit in Depok is managed by the local government. These three projects
    have been processed up to 57,784 tons of waste per year between 2021–2022 (Ministry
    of Environment and Forestry of the Republic of Indonesia, 2021). The Citac unit
    has the highest processing capacity, capable of processing 150 tons of waste per
    day and producing approximately 54.89 tons of RDF, or around 36.069 (Government
    of Citac District, 2023). RDF technology is thought to have with refinement and
    the implementation of national strategic projects in line with WTE target (The
    Government of Indonesia, 2020).

    Compared to biomass conversion technologies, such as pyrolysis and gasification,
    RDF technology requires a substantial investment, which often limits its utilization
    in waste management. However, RDF products demonstrate an advantage price relative
    to risk halves and securing the minimum caloric value criteria, obtaining technical
    recognition (Anastasia et al., 2020; Paramita et al., 2018). This economic aspect
    may be further analyzed to clarify the required investment and economic value
    with PW utilization.


