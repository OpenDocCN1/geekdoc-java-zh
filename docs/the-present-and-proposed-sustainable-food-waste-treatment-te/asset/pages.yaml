    # ABSTRACT


    Domestic waste is driven by food waste (FW) in Indonesia. Indonesia has committed
    to advancing FW management based on the National Strategy Policy (Regulation 97/2017),
    making for a 30% reduction and 70% handling by 2025. However, the current FW regulations
    and technologies are insufficient to reach these targets. This paper aims to quantify
    the FW generation and improve technology to feed the targets. The proposed FW
    treatment in Indonesia is discussed in the context of technical, economic, and
    environmental concerns. The current FW treatments include composting and landfilling
    with the highest environmental impact. Black soldier and thermal treatments are
    new technologies considered for the Waste to Energy in Indonesia. FW treatment
    considerations are developing on different scales. Therefore, the environmental
    impact of current treatments must be considered. It is crucial to analyze specific
    FW recommendations in terms of products and residuals to environmental impact
    and product quality.

