    # 1. Introduction


    The global population is expected to grow to 9.3 billion by 2050, causing a 50%–70%
    increase in food demand. Approximately one-third of the edible food for human
    consumption is lost or wasted, which equals around 1.3 billion tons (Bond et al.,
    2013; FAO, 2020, 2011). Food waste (FW) contributes to the food crisis as an amount
    of food needs to be produced to feed the population. If FW is reduced, it will
    be more accessible, and access to nutrition for individuals will increase.


