    # 5.1. Black soldier larvae


    The BSF (Hermetia lucilia) is widely distributed globally in tropical and warm
    temperature areas. They are voracious consumers of decomposing matter such as
    fruits, vegetables, food items, cows and other animals. These insects'' oviposition
    and larval growth are greatly impacted by several conditions, such as ambient
    temperature, relative humidity, light sources, and other waste-related characteristics,
    including moisture content and pH (Hintkins et al., 2021; Singh and Kumari, 2019).
    Stability characteristics enhanced in the decomposition process of BSF is a suitable
    material for processing by BSF larvae, including fruit peel mixed with goat manure,
    agriculture, cattle and domestic waste (Fitirana et al., 2021; Ichwan et al.,
    2021; Indri et al., 2021; Sanjaya et al., 2019; Widastuti et al., 2021). As a
    tropical country, Indonesia has an optimum temperature for BSF-related FW growth.
    However, it is difficult to maintain optimum conditions, including maintaining
    temperature, a suitable waste food, and diet, for larval growth and output (Ojo
    et al., 2020).


    In the 2020-2021, the Surabaya government developed four waste processing units
    using BSF in Jambangan, Wonorejo, Bantang, and the Majengang Recycling Center
    (PDU) was initiated as a collaboration between Ministry of Environment and Surabaya
    City Environment Service (Lucy). From 2020-2021, PDU produced 50 tons of food
    waste, while the Wonorejo BSF unit produced 40-50 tons of FW from the nearest
    cattle waste and 5-10 tons of FW from food waste. This process includes maggot
    (pupae) and compost from the residual process Environmental City of Surabaya achieved
    waste reduction of 84% and 54% (Zahra, 2022). Other research indicates that using
    FW from domestic waste (household) and Cafeteria as substrate could reduce 70-75%
    of waste-cat food (Ibadurrahman et al., 2020; Priyamada et al., 2021). There are
    several studies showing that BSF can reduce 70-90% of waste (Chen et al., 2017;
    Fitirana et al., 2021; Ibadurrahman et al., 2020; Priyamada et al., 2021) and
    the collection of FW from households. Not all residents are aware that they need
    to separate their organic and inorganic wastes, making FW waste collection more
    effective (Environment Berau of Surabaya, 2021). BSF contain a healthy amount
    of crude protein (40-54%) and dietary fat (15-49%), and their essential amino
    acid composition is comparable to fish meat (Eenezer et al., 2022). BSF research
    conducted on cattle waste in Indonesia produced high nutrient content compared
    to research conducted on cattle waste (Ichwan et al., 2021). The residual process
    of BSF creates a high amino product contained 29.1% protein and 11.86% weight
    over 12 days of decubation (Ibadurrahman et al., 2020). Moreover, BSF technology
    produces less global warming than other organic composting techniques (Salakum
    et al., 2022) suitable material.


    # 5.2. Anaerobic digestion


    Anaerobic digestion (AD) technology can produce energy from organic materials.
    AD provides heat- and oxygen free conditions that allow microorganisms to decompose
    organic matter into biogas and nitrogen-rich fertilizers (Luzakita et al., 2020;
    Santaryadi et al., 2018; Sumanti and Hadiyanto, 2020; Zhang et al., 2020). AD
    has several environmental and economic benefits in reducing the waste to landfills.
    Furthermore, large-scale AD operations can deliver operational benefits and efficiency,
    such as reducing costly and impacting benefits through the generation of power,
    heat and fuel (Hobbers et al., 2023; Tiong et al., 2021; Wang et al., 2021; Zhang
    et al., 2021). Previous AD in Indonesia has piloted or laboratory studies. Biogas
    units in Indonesia typically process waste with the addition of bacteria starter/charcoal,
    mostly from cow manure, wastewater, or oil mill effluent (Tiong et al., 2021).
    Monitoring anaerobic digestion involves using operational parameters, such as
    pH, alkalinity and performance, which are characterized by volatile solids, biogas
    production, and methane content. The conversion of organic waste to biogas varies
    from 8 to 33% (WWW, at wet base). These characteristics are crucial because the
    conversion of FW into useful products, such as energy recovery (Helena Perinis
    et al., 2020). In Indonesia, AD plants have a high retention time (Santaryadi
    et al., 2019; Sarahah et al., 2021; Wang et al., 2021). Methane gas could generate
    0.30 L³ CH₄ per POME (Tiong et al., 2021). Substrates created from cattle fat
    with high grease levels could produce 127-485 CH4/kg of VS per day (Tassaka et
    al., 2019; Wulandari and Kristanto, 2016).


    One of Indonesia''s ADs for FW projects is the Integrated Resource Recovery Center
    (IRRC) in Malang, East Java developed by the United Nations Economic and Social
    Council for Asia and the Pacific (UNESCAP) in collaboration with Waste Concern.
    IRCC is a plant where 80%-50% of FW can be handled in a decentralized, cost effective
    manner for small and medium-sized communities. These plants utilize traditional
