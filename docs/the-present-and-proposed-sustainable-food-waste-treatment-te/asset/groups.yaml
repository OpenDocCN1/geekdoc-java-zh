    et al., 2019）。


    ### 5.1 黑士兵


    黑士兵（Hermetia lucilia）广泛分布在热带和温暖地区。它们是水果、蔬菜、食物和其他物质物的分解者。这些昆虫的产卵和幼虫生长受多种条件影响，如环境温度、相对湿度、光源和其他废物相关的特征，包括水分含量和
    pH（Hintkins et al., 2021; Fitirana et al., 2021; Indri et al., 2021; Sanjaya et
    al., 2019）。作为热带国家，印度尼西亚拥有黑士兵生长的最佳温度（Ojo et al., 2020）。2020-2021 年，泗水政府开发了四个使用黑士兵的废物处理单元，位于
    Jambangan、Wonorejo 和 Majeng 回收中心（PDU）。PDU产生了 5-10 吨食品废物，而 Wonorejo 的黑士兵单元产生了 40-50
    吨食品废物。这一过程包括幼虫（蛹）和来自残留物的堆肥，泗水实现了 84% 和 54% 的废物减少（Zahra, 2022）。其他研究表明，使用家庭食品废物和咖啡渣作为基质可以减少
    70-75% 的废物（Ibadrahman et al., 2020; Priyamada et al., 2021）。并非所有居民都意识到需要分离有机和无机废物，这使得食品废物收集更加有效（Environment
    Berau，2021）。黑士兵含有大量的粗蛋白（40-54%）和饮食脂肪（15-49%），其必需氨基酸组成与鱼肉相当（Eenezer et al., 2022）。在印度尼西亚进行的牛废物黑士兵研究产生的营养含量与其他研究相比（Ichwan
    et al., 2021）。黑士兵的残留过程在孵育 12 天后产生 29.1% 的蛋白和 11.86% 的重量（Ibadrahman et al., 2020）。此外，黑士兵技术比有机堆肥技术产生的全球变暖影响更小（Salakum
    et al., 2022）。


    ### 5.2. 厌氧消化


    厌氧消化（AD）技术可以从有机材料中产生能量。厌氧消化提供了无氧环境，允许微生物将有机物分解为生物气和富氮肥料（Luzquita et al., 2020;
    Santaryadi et al., 2018; Sumanti and Hadiyanto, 2020; Zhang et al., 2020）。厌氧消化在减少填埋废物方面具有环境和经济效益。此外，大规模厌氧消化运行可以提供运营效益和效率，例如降低成本并通过发电、供热和燃料产生效益（Hobbers
    et al., 2023; Tiong et al., 2021; Wang et al., 2021; Zhang et al., 2021）。印度尼西亚之前的厌氧消化已有试点或实验室研究。印度尼西亚的生物气单元通常通过添加细菌启动剂/炭来处理废物，主要来自牛粪、废水或油厂废水（Tiong
    et al., 2021）。监测厌氧消化涉及使用运行参数，如 pH、碱度和性能，以挥发性固体、生物气产量和甲烷含量为特征。有机废物向生物气的转化率从 8%
    到 33% 不等（WWW，湿基）。这些特征至关重要，因为食品废物转化为有用产品（如能量回收）（Helena Perinis et al., 2020）。在印度尼西亚，厌氧消化厂具有较高的停留时间（Santaryadi
