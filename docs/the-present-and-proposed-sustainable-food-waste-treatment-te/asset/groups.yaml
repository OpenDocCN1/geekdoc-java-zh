    under the CC-BY-ND license (https://creativecommons.org/licenses/by-nd/4.0).


    # 1. Introduction


    The global population is expected to grow to 9.3 billion by 2050, causing a 50%–70%
    increase in food demand. Approximately one-third of the edible food for human
    consumption is lost or wasted, which equals around 1.3 billion tons (Bond et al.,
    2013; FAO, 2020, 2011). Food waste (FW) contributes to the food crisis as an amount
    of food needs to be produced to feed the population. If FW is reduced, it will
    be more accessible, and access to nutrition for individuals will increase.


    * Corresponding author at: Department of Environmental Engineering, Institut Teknologi
    Sepuluh November, Jalan Teknik Kimia, Sukolilo, 60111, Surabaya, East Java, Indonesia.

    E-mail address: auliaulfaf@upnatim.id (A.A) Farahdiba.


    https://doi.org/10.1016/j.etci.2023.103256 2023 The Author(s). Published by Elsevier
    B.V. This is an open access article under the CC BY license (http://creativecommons.org/licenses/by-nd/4.0).


    Economic resources can be saved by reducing FW by decreasing operational costs
    and improving reliability to resistance to other factors, such as climate change.
    Furthermore, reducing FW will increase income for more stable food supply and
    provide nutrient-rich food for consumption, particularly in developing countries
    (FAO, 2014; Mramura et al., 2018; Thyberg and Jones). FW significantly impacts
    the environment. Operating 4% GCO2 annually, or approximately 8% of the total
    anthropogenic GHG emissions on carbon footprints (FAO, 2015). Furthermore, reducing
    FW could significantly alleviate hunger, increase incomes, climate change resilience,
    and food security.


    Indonesia is the second-largest FW producer globally, estimated to consume 300
    kg of FW per capita per year. Although it also has the third-highest index of
    stunted children at 36.4%, followed by Nigeria at 32.9% (The Economist Insight
    Unit, 2017). It is essential to recover and secure food security in Indonesia.
    The potential impact on global warming by FW in Indonesia over the last 20 years
    is estimated at 1702.9 mT CO2-eq, which is 7.29% of the average GHG emissions
    in Indonesia for the last 20 years (Ministry of National Development Planning
    of the Republic of Indonesia, 2021).


    Previous studies have not sufficiently addressed FW treatment, regulations. The
    National Strategy Policy (Regulation 97/2017) has achieved 25.3% and 49.2% (Ministry
    of Environment and Forest, 2022). This study focuses on the current and future
    trends of FW generation. The objectives of the present study are (i) to quantify
    the FW generation, (ii) to provide information regarding FW treatment, and (iii)
    to discuss proposed FW in Indonesia regarding technical challenges and environmental
    impact.


    # 2. Review methodology


    This study analyzed a comprehensive Scopus database listing important keywords
    related to FW. The researchers used the keyword "food waste" in the title, abstract,
    and authors to ensure the data selection. Data collected from government reports,
    annual statistics, and local government reports present the local data. Solid
    waste management from Indonesia was obtained from open-access website (National
    Waste Management Information System). However, several cities have not reported
    the quantity and composition.


    This review focuses on the current condition and initiatives regarding FW treatment
    in Indonesia, as shown in Fig. 1. Section 1 of this review provides an overview
    of the definition, current situation, and influence factors. 2 discusses and analyzes
    Indonesia''s development and strategies. Section 3 outlines the current and proposed
    FW treatment systems with technical, economic, and environmental consideration
    (BSF, Composting, Thermal, RDF, landfilling and Hydrothermal) in Indonesia.


    # 3. Food and waste in Indonesia


    ## 3.1. Definition of food loss and waste in Indonesia


    Food loss refers to the reduction in food waste that occurs within the supply
    chain that creates food for human consumption. Food loss occurs at the post-harvest,
    post- and processing stages of the supply chain. Food loss reason is referred
    to as FW (FAO, 2013, 2011; Parffitt et al., 2010). In Indonesia, the definition
    of regulations Law No. 18 from 2008 (Government of Indonesia, 2008). FW management
    in Indonesia focuses on FW generated in the distribution and consumption stages,
    food loss is considered inappropriate in the context of agro-industrial waste.
    In this study, the definition of FW is involved in the distribution and consumption
    stages (Ministry of National Development Planning of the Republic of Indonesia,
    2021a).


    ## 3.2. Waste generation in Indonesia


    Regarding the characteristics of MSW, in 2019-2020, FW generation in Indonesia
    was approximately 40%, 60.34% in 2019 and 40.23% in 2020. The two most significant
    waste contributors are FW, food and paper. Plastics accounted for 15.9% in 2019
    and 17.29% in 2020, while food and paper accounted for approximately 16%.

