    2019; Wulandari and Kristanto, 2016）。印度尼西亚食品废物厌氧消化项目之一是位于东爪哇马兰的综合资源回收中心（IRRC），由联合国亚太地区经济和社会委员会（UNESCAP）与
    Waste Concern 合作开发。IRRC 是一个以去中心化、成本效益的方式处理中小型社区 50%-80% 食品废物的工厂。这些工厂利用传统的废物市场作为


