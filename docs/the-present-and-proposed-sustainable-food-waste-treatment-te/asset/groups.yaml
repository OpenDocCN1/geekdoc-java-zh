    # The present and proposed sustainable food waste technology in Indonesia: A review


    Aulia Ulfah Farahdibaᵃ,b,e*, I.D.A.A. Marmadawanthiᵃ,c, Yunus Friscusᵃ,d, Elsa
    Rosaydidaᵇ, Joni Hermanaᶜ, Adhi Yuniartoᵉ


