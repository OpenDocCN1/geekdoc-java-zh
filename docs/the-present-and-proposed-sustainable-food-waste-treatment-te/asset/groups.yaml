    此外，这些国家对公众并没有强制要求，也没有适当激励措施来鼓励个人回收厨余垃圾（FW）（Dora et al., 2021; Geofilos, 2014）。在考虑厨余垃圾技术时，应当考虑垃圾收集、运输、设备设计和维护的成本（图
    6）。某些技术更适用于低容量、高污染、高能耗处理，这些技术可以降低运行成本（Wang et al., 2022）。印度尼西亚需要开发专门应对印度尼西亚厨余垃圾要求的本土技术。其他的技术缺点还包括运营费用以及对熟练操作员和技术人员的负担（Karmarkar
    et al., 2023）。


    ## 6.3. 环境影响


    图 6 显示社区家庭堆肥和黑水虻（BSF）处理可以减少与厨余垃圾相关的环境影响。现场系统对于管理厨余垃圾非常有益，因为它们不需要运输资源和废物储存设施，并能最大限度地减少有害物质的产生，包括厨余垃圾渗液。此外，需要使用生命周期框架进行技术比较。生命周期评估可用于确定不同处理场景的最佳技术（Ahamed
    et al., 2016; Angelo et al., 2017; Beretta et al., 2017; Chen et al., 2018; Iseris
    et al., 2020; Jiao et al., 2021, 2022）。


    对高水分（80–90%）和高有机物含量（约90%）的厨余垃圾进行适当的管理和处理可以减少温室气体排放并实现生物能源的生产。厌氧消化（AD）技术被经常认为是比传统的废物处置方法更具能源和排放效益的厨余垃圾处理方式（Bernad
    and La Cour Janssen, 2012; Mondello et al., 2017; Thiberg and Tonjes, 2017; Zhang
    et al., 2020）。


    以往对印度尼西亚废物处理单元环境影响的研究已经确定了各种处理技术在不同场景下的环境影响潜力。厌氧消化会导致高度酸酸化和富营养化，其中某些成分的富营养化较高（Ula
    et al., 2021）。研究分析了不同的处理方法，包括焚烧、气化、热解和再生燃料燃料（RDF）。大多数研究报告称，气化是最合适的技术，因为其环境影响低于垃圾填埋、焚烧和热解（Budiono,
    2021; Gunamantha, 2010; Mulawani, 2018; Rachim, 2017）。RDF 被认为是露天倾倒更具可持续性的替代方案（Anastasia
    et al., 2020），它可以减少 178–330 吨的二氧化碳排放（Suyawan et al., 2021），而作为印度尼西亚最常见的废物处理方式，其环境影响最大（Auvaria,
    2013）。


    ## 7. 实际应用与厨余垃圾研究项目


    本研究强调了分析厨余垃圾数据产生的重要性，并在技术可行性、环境影响评估和经济考虑中考虑了厨余垃圾的处理。该研究使用了国家数据，有必要在详细阶段进行进一步分析以揭示厨余垃圾管理系统所有的复杂性。生命周期评估是评估每种处理方式环境影响的有效工具。通过可视化和预测不同厨余垃圾管理系统的效果，场景有助于识别最环保的替代方案。可持续厨余垃圾管理策略的实施不仅可以减少环境影响并促进可持续性，还可以通过促进循环经济来创造经济机遇。


    ## 8. 结论


    印度尼西亚地区每年产生约 2080 万吨厨余垃圾。实现 70% 的废物减少目标需要综合考虑法规、倡议和技术。然而，目前还没有具体的法规或激励措施来加速厨余垃圾的减少。从技术、环境和经济角度来看，必须考虑黑水虻（BSF）、厌氧消化、堆肥和
    RDF的应用。


