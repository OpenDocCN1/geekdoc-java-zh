    ## 5.3. 堆肥


    堆肥是一种处理环境废物的方法，涉及有机物质的生物分解（Cai et al., 2023）。可以使用有氧堆肥产生堆肥，这涉及堆叠生物可降解材料。这种工艺适用于需要机械旋转的大规模流程，并经常用于农业处理厂（Abu
    et al., 2021; Keng et al., 2020; Sari et al., 2013）。印度尼西亚最常见的堆肥厂涉及带有管理安排的有氧堆肥，废物每年进行堆叠和翻堆。


    印度尼西亚政府和社区使用堆肥进行管理。2021年，管理的废物和产生的堆肥产品达到每年192,000吨，动物饲料产品的剩余产量为每年38,236吨。大规模堆肥通常使用开放式窗格法，并由当地政府管理。大城市堆肥的一个例子是泗水市。每日废物量达到26,000吨，这些废物处理设施利用了城市废物以及来自家庭和市场的食品产品（作为补充材料）（泗水市环境局，2021）。堆肥与环境问题有关，例如酸酸化、异味以及由于浸滤液释放和分解废物产生的潜在重金属导致的土壤和水污染；堆肥可以改善废物处置条件并减少20–25%的温室气体排放（Salim
    et al., 2021）。


    ## 5.4. 热处理


    从废物材料中产生热的过程是热氧化，包括焚烧。含有碳氢化合物的废物在焚烧过程中被燃烧，将其转化为水、二氧化碳和其他污染物。为了开发一种有效的工艺，理解废气中的基本元素（如碳、氧、氮、硫和灰）至关重要（Lokahita
    et al., 2019）。热处理废物可以减少大量废物并将其转化为社区管理的电能（Kadanag and Sinaga, 2020）。


    2016年2月，印度尼西亚政府发布了一项关于在七个城市加速废物垃圾发电（WTE）技术的总统条例。WTE被定义为利用处理技术通过气化和热解将城市生活垃圾（MSW）、废物和塑料转化为能量的工厂。2021–2022年，印度尼西亚的热废物能力分别达到了每年26947.05、11913.60和3160.90吨（印度尼西亚共和国环境与林业部，2022）（作为补充材料）。人们认为，气化对于许多地区更为可靠，因为与填埋、焚烧和热解相比，它的影响较小（Biondo,
    2021; Gamanunta, 2010; Mulawati, 2018; Rahim, 2017）。


    ## 5.5. 填埋


    在填埋场处置（FW）被认为是对环境破坏最大的选择，因此是固体废物管理中最低的方法。这种废物系统被认为污染最严重，对全球变暖和酸化有显著贡献（Lumban,
    2017; Nikmah and Warmadewanti, 2013）。


    ## 5.6. 垃圾衍生燃料（RDF）


    由于有机和塑料材料占印度尼西亚固体废物的50%以上，存在回收RDF的潜力（Lokahita et al., 2019）。印度尼西亚有三个RDF项目单位：美丹市（Medan）、德波克市（Depok）和与私人伙伴合作的西塔奇市（Citac），其中德波克的单位由当地政府管理。这三个项目在2021–2022年间处理了高达57,784吨废物（印度尼西亚共和国环境与林业部，2021）。西塔奇单位具有最高的处理能力，每天能处理150吨废物并产生约54.89吨RDF，或约36.069（政府，2023）。与生物质转换技术（如热解和气化）相比，RDF技术需要大量的投资，这通常限制了其在废物管理中的利用。然而，RDF产品在风险控制和确保最低热值方面具有优势，并获得了技术认可（Anastasia
    et al., 2020; Paramita et al., 2018）。


    ## 5.7. 水热处理


    2017年标志着印度尼西亚水热处理设施的投入，该设施旨在处理未分类的城市垃圾。未分类的、高有机垃圾被投入反应器，在2.5 MPa的压力和220 °C的温度下暴露于蒸汽30分钟。热热处理可以减少大量废物并将其转化为社区管理的电能（Kadanag
    and Sinaga, 2020）（注：此处原文似乎存在逻辑跳跃或重复，已按字意翻译并保持结构）。


