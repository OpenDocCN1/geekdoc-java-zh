    # 5.7 Hydrothermal treatment


    The 2017 year marked the commencement of operations of a Hydrothermal facility
    in Indonesia, designed to process non-segregated municipal solid waste. Unsorted,
    highly organic garbage is fed into the reactor and exposed to steam at a pressure
    of 2.5 MPa and 220 °C for 30 min. A powder-like substance, is one product obtained
    from this process. It was estimated that the Hydrothermal might utilize approximately
    15% of the powder is used for the boiler during the hydrothermal treatment and
    the remaining portion can be converted to coal.


    Data emissions from the boiler demonstrate low air pollution (Marbali et al.,
    2021; Saqib et al., 2019). PW utilizes the diversity of current research. The
    applicability of this technology on industrial scale is growing; however, the
    current study presents results on laboratory size (Hantoro et al., 2020); Putra
    et al., 2021; Suleaman et al., 2021; Vaskin et al., 2017). To assess the sensitivity,
    many influencing variables are the financial costs associated with material collection
    and transport (Mazumdar et al., 2022). The entire system should be assessed from
    a technical and economic standpoint, given the industrial viability of hydrothermal
    process.


    Several technologies can process input waste as wet or dry. The efficacy of these
    technologies depends on input composition, such as acidity, reaction content,
    volume reduction, and time. The period of each technology is considered an advantage
    for further application and result as environmental impact. The reliability of
    these technologies is related to the economic consideration and technical feasibility
    of their small/large-scale application. RDF and ASF are widely used in Indonesia
    because of low investment and operational cost. AD, and composting are process
    technology adopted in small/large scales with relatively easy operations and affordable
    costs. Hydrothermal treatment is a suitable without. Nevertheless, capital investment
    and infrastructure are required due to the high levels of maintenance required
    (supplementary material).


    # 6. Waste treatment recommendations in Indonesia


    Fig. 6 shows the recommendations for PW processing in Indonesia. The waste reduction
    target is the main focus for reducing generation. PW generated at the waste source
    is transported to the temporary processing site (TPS) or temporary processing
    site (TPS3R) or goes to landfills. Processed waste is transported to TPS3R. The
    waste source to TPS or TPS3R requires transportation to a communal processing
    site. Households or communities manage regional-scale composting and processing
    sites (on-site systems). Waste can be processed by the household or at the nearest
    processing site. The communal processing sites (offsite system), TPS3R can also
    function as a recycling center with compost processing, BSF, and thermal processing.
    PW must be sorted and segregated before entering the hydrothermal unit. Any residual
    PW that cannot be reused cannot be immediately transported to landfill. Products
    from PW can be reused or recycled.


    # 6.1. Feasibility


    Collecting PW is a significant priority, requiring extra transportation and microbial
    control (Fig.). Before PW is moved to a centralized treatment facility, bacterial
    growth is easily encouraged during the collection, and processing, as bacteria
    are abundant in water and organic matters. Therefore, the PW generated is crucial
    for preventing contamination and odor issues (Guan et al., 2020). PW waste must
    be stored and handled in accordance with the specifications of the facility to
    run efficiently. Every household and business requires suitable trucks, proper
    collection and hygienic waste management procedures. Furthermore, well-skilled
    operators and labours are required for the functioning of these plants (Karmak
    et al., 2023). The large range of target and non-target substances associated
    with different waste sources and the costs associated with large-scale commercialization
    and high productivity could be challenging (Abu et al., 2021; Ahamed et al., 2016;
    Laurent et al., 2014).


    # 6.2. Economic realities


    Indonesia''s annual budget for waste management in 2022 was only 0.5% of the total
    budget (Ministry of Home Affairs, 2022). Due to insufficient funding for recycling,
    some developing nations have attempted to implement a system for waste management
    in their legislative frameworks. However, budgeting remains a significant problem
    in developing countries for handling waste (Johari et al., 2017; Pham et al.,
    2015; Sukart et al., 2022).


    Sustainably managing PW is a significant priority in developing countries. PW
    is significantly higher during processing, decreasing the use of sophisticated
    food preservation methods, including inadequate government regulations and immature
    supply chains. In developing countries, PW is primarily landfilled or utilized
    as animal feed (Lohri et al., 2017). The applicability of PW recycling in developing
    countries is highly limited by weak recovery methods.'
