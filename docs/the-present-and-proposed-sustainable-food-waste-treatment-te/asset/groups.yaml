    # 2. 综述方法


    本研究分析了 Scopus 数据库中与食品浪费相关的关键词。研究人员在标题、摘要和作者处使用了“food waste”关键词以确保数据的选择性。印尼西亚的固体废物管理数据来自政府报告、年度统计。然而，许多城市尚未报告数量和组成。


    本综述关注印尼西亚食品浪费处理的现状和倡议，如图1所示。第一部分概述了定义、现状和影响因素。第二部分讨论并分析了发展。第三部分概述了目前的处理系统（黑水虻、堆肥、热处理、RDF、填埋和水热）。


    # 3. 印尼西亚的食品与废物


    ## 3.1. 印尼西亚食品损失与浪费的定义


    食品损失是指在供应链内部发生的人类食用食物减少。食品损失发生在收获后、加工后和加工阶段。食品损失的原因被认为是食品浪费（FAO, 2013, 2011; Parffitt
    et al., 2010）。在印尼西亚，法规定义为2008年第18号法律（Government of Indonesia, 2008）。印尼西亚的食品浪费管理关注分销和消费阶段产生的浪费，食品损失在农业工业废物背景下被认为是不恰的。本研究定义涉及分销和消费阶段。


    ## 3.2. 印尼西亚的废物产生


    根据固体废物（MSW）的特征，2019-2020年印尼西亚的食品浪费产生量约占40%，2019年为60.34%，2020年为40.23%。两个主要的废物贡献者是食品浪费、食物和纸张。塑料在2019年占15.9%，2020年占17.29%，而食物和纸张约占16%。


