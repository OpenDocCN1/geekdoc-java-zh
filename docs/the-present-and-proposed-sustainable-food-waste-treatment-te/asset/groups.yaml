    ## 3.3. Factors influencing the generation of food waste


    FW generation can be influenced by age, perception, income, household size, and
    children (Szabó-Bódi et al., 2018). The variation in the food supply and demand,
    social, cultural, and environmental factors impact FW patterns in Indonesia. With
    fewer members people produce more waste per capita than higher households. Human
    behavior has been investigated in such studies. Life pattern (Phatthan et al.,
    2019; Sugiharto, 2021); Consumer behavior has been investigated in such studies
    (Vargas et al., 2019; Wang et al., 2019), behavior (Lasa, 2021), and culture (Elmelich
    et al., 2018; Payedanya et al., 2016) substantially impact FW production. Reductions
    between employers and household helpers could increase awareness regarding FW
    quantity (Lemy et al., 2021; Somero, 2017). Without intervention, Indonesia''s
    FW generation is predicted to reach 344 kg/capita/year by 2045. However, this
    could be reduced to 166 kg/capita/year with the implementation of strategic measures
    (Ministry of National Development Planning of the Republic of Indonesia, 2021b).


    ## 4. Progress of food waste management and regulation


    The annual population growth in Indonesia is considerably (1.12). This will lead
    to a significant increase in FW generation within 10 years (Central Bureau of
    Statistics of Indonesia, 2020; World Bank, 2021). Therefore, Indonesia must develop
    greater FW management, with the President stating during a Plenary Meeting on
    June 2022, that Indonesia has the threat of food, energy, and financial crises.
    We need the synergy and collaboration to fulfill relevant stakeholders” (Cabinet
    Secretariat of the Republic of Indonesia, 2020).


    Indonesia has undergone a paradigm shift in order to solid waste management. Before
    Law 18 was enacted in 2008, Indonesia was using a “pipe waste” system where there
    is no natural resource efficiency, and there is a tendency to overexploit natural
    resources (Government of Indonesia, 2008). The enactment of Law 18/2008 and 3Rs
    (Reduce, Reuse, Recycle; 2015) have reduced the pollutant load associated with
    waste by changing behavior and reducing waste at the source. Indonesia has implemented
    extended producer responsibility (EPR) and circular economy (CE) to minimize waste
    generation and encourage recycled packaging (Coordinating Ministry for Maritime
    and Affairs, 2021). EPR refers to responsibility of producers to manage packaging
    and waste generation, allowing for packaging to be recycled (Ministry of Environment
    and Forestry of the Republic of Indonesia, 2021). CE implementation in FW management
    includes managing packaging, product materials in use, and regenerating natural
    systems (2020). In recent years, the Indonesian government has adopted various
    technologies such as gasification and composting. These technologies involve analysis
    of FW processing technology is integrated with technical, economic, and environmental
    impact.


    The basic framework of waste management and related FW policies was summarized
    by examining government waste management in Indonesia, as shown in (1). Indonesia
    initiated solid waste management in its Long-Term Development Plan (RPJMN 2020–2024).
    This was followed by government and presidential regulations. The presidential
    regulation is upstream (top-down) initiative by the government to clarify targets
    and achievements in solid waste management. Furthermore, the Ministry of Home
    Affairs stated solid waste retribution and the Ministry of Public Works provided
    technical guidelines regarding solid waste infrastructure. These two regulations
    are downstream regulations to provide steps for solid waste technical management.


    ![](img/3ef64613602e11207489d5cbd5df5b46_3_0.png)

    Fig. 2. Percentage of Food Waste to total MSE in each province of Indonesia (2020).
    Source: Adapted from Ministry of Environment and Forestry of the Republic of Indonesia
    (2020).


    As of this, Indonesia has committed to mainstreaming its SDG goals, targets, and
    indicators in the RPJPN for 2020–2024. The plan is divided into 5-year medium-term
    development plans with various development priorities. The RPJPN for 2020–2024
    (Presidential regulation 18/2020) has several management-related priorities. The
    third national priority is increasing food consumption, access, and quality, which
    the fifth is improving national food system security. The long-term development
    strategy has led to the creation of the current medium-term development plan.


    The first waste initiatives in Indonesia were Law No. 18/2008 (Government of Indonesia,
    2008) and government regulation No. 81/2012 (Government of Indonesia, 2021a).
    These enforce manufacturers to reduce and recycle packaging materials. Furthermore,
    the food industry must reduce its biodegradable product supply. FW is a potential
    resource that could be utilized to enhance renewable and energy efficiency. However,
    these values did not explicitly define the focus of FW. Furthermore, the FW reduction
    targets must be explained for each supply chain.


    FW minimization was introduced in 2017 as a 10-year roadmap for plastics management
    in Indonesia, including manufacturing, food and beverage services, and retail
    (Government of Indonesia, 2019). This regulation states minimizing, recycling,
    and reducing product and packaging waste 2020–2029. This strategy is targeted
    at food packaging only, with no mention of freedom. The Indonesian government''s
    initiatives to manage FW extend to include more industries and companies in the
    Ministry of Environment and Forestry regulation No. 1/2021 (Government of Indonesia,
    2021), which is significantly related to increasing industry performance.


    The presidential regulation on waste No. 97/2017 (Government of Indonesia, 2017)
    and the Ministry of Environment and Forestry regulation No. 10/2018 (Government
    of Indonesia, 2018) form the legal framework. It guides regional and district
    levels to explain waste reduction strategies. FW should be part of the waste reduction
    from the source. The Acceleration of Solid Waste Processing Installations into
    Electrical Energy by Sustainable Technology, introduced in regulation No. 35/2018,
    is a technical initiative to accelerate waste processing into renewable energy
    (Government of Indonesia, 2018). This has been discussed as energy; however, waste
    processing only involves thermal processing and refuse-derived fuel (RDF). FW
    processing has not been separated as there are no streams for FW (i.e., food organic
    waste) to be processed. The regulation focuses on organic waste for animal feed
    to meet food safety and quality standards for human consumers, however, it does
    not mention FW (Government of Indonesia, 201b).


    The downstream initiatives introduced by the Ministry of Agriculture regulation
    No. 7/2021 and the Ministry of Public Works regulation No. 3/2013, define the
    standards for solid waste management and domestic waste infrastructure. General
    solid waste management typically involves sorting and composting, FW separation
    and pre-treatment.


    ![](img/3ef64613602e11207489d5cbd5df5b46_4_0.png)

    The Indonesian government is concerned about this problem of waste management
    and has explored other options for minimizing FW disposal in landfills. Recognizing
    the increase in waste generation and the changing composition of waste, the government
    began to promote 3R in 2018 to increase material recovery and reduce the waste
    disposed in landfills.

