    Furthermore, there are no requirements for the general public and no appropriate
    incentives to encourage individuals to recycle FW in these countries (Dora et
    al., 2021; Geofilos, 2014). The cost of trash collection, transportation, equipment
    designs, and maintenance should be considered when considering FW technologies
    (Fig. 6). Several techniques are more suitable for low-capacity, significantly
    polluting treatments with high energy that lower the operational cost (Wang et
    al., 2022). Indonesia needs to develop indigenous technologies that can specifically
    respond to the requirements of Indonesia’s FW. Additional technological drawbacks
    involve operational expenses and the burden of proficient operators and technicians
    (Karmarkar et al., 2023).


    ## 6.3. Environmental impacts


    Fig. 6 shows community-home composting and BSF could reduce the environmental
    impact associated with FW. On-site systems are very beneficial for managing FW
    as they do not require resources for transportation and waste storage facilities
    and minimize the production of hazardous contents, including leachate from FW.
    Moreover, technology comparison is required by using the life cycle framework.
    Life cycle assessment can be used to determine the best technology for different
    processing scenarios (Ahamed et al., 2016; Angelo et al., 2017; Beretta et al.,
    2017; Chen et al., 2018; Iseris et al., 2020; Jiao et al., 2021, 2022).


    Proper management and treatment for FW with high moisture (80–90%) and organic
    matter (approximately 90%) content may reduce GHG emissions and enable bioenergy
    production. AD technology is frequently cited as a more energy- and emission-benefit
    treatment for FW than the conventional methods of waste disposal (Bernad and La
    Cour Janssen, 2012; Mondello et al., 2017; Thiberg and Tonjes, 2017; Zhang et
    al., 2020).


    Previous research on the environmental impact of waste processing units in Indonesia
    has determined each processing technology’s potential for environmental impact
    across different scenarios. AD can produce high acidification and eutrophication,
    with components having the higher eutrophication (Ula et al., 2021). Different
    treatments were analyzed, including incineration, gasification, pyrolysis, and
    RDF. Most studies reported that gasification is the most appropriate technology
    due to its lower environmental impact than landfilling, incineration, and pyrolysis
    (Budiono, 2021; Gunamantha, 2010; Mulawani, 2018; Rachim, 2017). RDF is considered
    to be a more sustainable alternative to open dumping (Anastasia et al., 2020),
    and it can reduce CO2 emissions by 178–330 tons (Suyawan et al., 2021), which
    is the most common waste treatment in Indonesia, has the highest environmental
    impact (Auvaria, 2013).


    ## 7. Practical applications and food waste research projects


    This study has highlighted the importance of analyzing food waste data generation,
    considering FW treatment in technical feasibility, environmental impact assessment,
    and economic considerations. The study uses of national data, further analysis
    at a detailed stage is necessary to uncover all the complexities of food waste
    management systems. Life cycle assessments are useful tools to evaluate the environmental
    impacts of each treatment. Scenarios can assist in identifying the most environmentally
    friendly alternative by visualizing and predicting the effects of different food
    waste management systems. The implementation of sustainable food waste management
    strategies can not only reduce environmental impact and promote sustainability
    but also create economic opportunities by promoting circular economies.


    ## 8. Conclusions


    Approximately 20.8 million tons/year of food waste in various regions Indonesia.
    Application of this target to achieve its 70% waste target requires integrated
    regulation, initiatives, and comprehensive technology. However, no concrete regulations
    or incentives exist to accelerate FW reduction and handling. Small and large-scale
    waste management must be considered from a technical, environmental, and economic
    standpoint. Application of BSF, AD, composting, thermal treatment, and RDF promote
    FW treatment with lower environmental impacts. Environmental impacts could be
    measured by carrying out extended studies. This data will work for the e-version
    of paper.


