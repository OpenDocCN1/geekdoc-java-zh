    # 1. 引言


    全球人口预计到2050年将增长到93亿，导致食物需求增加50%–70%。约三分之一的人类食用食物会流失或被浪费，相当于约13亿吨（Bond et al.,
    2013; FAO, 2020, 2011）。食品浪费（FW）导致了粮食危机，因为需要生产大量的食物来喂养人口。如果能减少食品浪费，食物将更容易获得，个人获取营养的机会也将增加。


