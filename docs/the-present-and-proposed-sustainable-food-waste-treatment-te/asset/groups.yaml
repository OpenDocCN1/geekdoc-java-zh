    ## 5.3. Composting


    Composting is a method of handling environmental waste that involves the biological
    decomposition of organic substances (Cai et al., 2023). Compost can be created
    using aerobic composting, which involves stacking rows of biodegradable materials.
    This process works for larger-scale processes where mechanical rotation is required
    and is frequently used in agricultural treatment plants (Abu et al., 2021; Keng
    et al., 2020; Sari et al., 2013). Most common compost plants in Indonesia involve
    aerobic composting with management arrangement, where the waste is stacked and
    turned annually.


    The Indonesian government and community use composting for management. In 2021,
    managed waste and generated compost products reached 192,000 tons/year with a
    residual yield of the animal feed product is 38,236 tons/year. Large-scale composting
    typically use the open window method and are managed by the local government.
    An example of composting in a metropolitan city is Surabaya. Waste reached 26
    thousand plants daily that utilize waste from the city and food products from
    households and markets (as supplementary material) (Environment Bureau of Surabaya,
    2021). Composting is associated with environmental issues, such as acidification,
    odor, and ground and water contamination from the release of leachate and potential
    heavy metals from decomposing waste, composting can improve waste disposal conditions
    and reduce GHG emissions by 20–25% (Salim et al., 2021).


    ## 5.4. Thermal treatment


    The process of generating heat from waste material is thermal oxidation, which
    includes incineration. In waste, containing hydrocarbons are burned during incineration,
    converting them to water, carbon dioxide, and other pollutants. To provide developing
    an effective process, it is essential to comprehend the fundamental elements of
    exhaust such as carbon, oxygen, nitrogen, sulfur, and ash (Lokahita et al., 2019).
    Thermal waste processing can reduce large amounts of waste and convert it into
    electrical energy that is managed by the community (Kadanag and Sinaga, 2020).


    In February 2016, the Indonesian government launched a presidential regulation
    on the acceleration of WTE technology in seven cities. WTE was defined as a plant
    that uses processing technology to convert MSW, waste and plastic into energy
    through gasification and pyrolysis. Thermal waste capacity in Indonesia reached
    26947.05, 11913.60, and 3160.90 tons/year from 2021–2022, respectively (Ministry
    of Environment and Forestry of the Republic of Indonesia, 2022) (as supplementary
    material). It is thought that gasification is more reliable for many areas due
    to its reduced impact compared to landfilling, incineration, and pyrolysis (Biondo,
    2021; Gamanunta, 2010; Mulawati, 2018; Rahim, 2017).


    ## 5.5. Landfilling


    Disposal of FW in landfills is considered the most environmentally damaging option
    and, therefore, is the lowest method in FW waste management. This waste system
    is considered the most polluted and significantly contributes to global warming
    and acidification (Lumban, 2017; Nikmah and Warmadewanti, 2013).


    ## 5.6. Refuse-derived fuel


    As organic and plastic materials make up than 50% of Indonesia''s solid waste,
    there is potential for recovering RDF (Lokahita et al., 2019). Indonesia has three
    RDF project units: Medan City, Depok City and Citac City with private partners,
    where the unit in Depok is managed by the local government. These three projects
    have processed up to 57,784 tons of waste between 2021–2022 (Ministry of Environment
    and Forestry of the Republic of Indonesia, 2021). Citac unit has the highest processing
    capacity, capable of processing 150 tons of waste per day and producing approximately
    54.89 tons of RDF, or around 36.069 (Government 2023). Compared to biomass conversion
    technologies, such as pyrolysis and gasification, RDF technology requires a substantial
    investment, which often limits its utilization in waste management. However, RDF
    products demonstrate an advantage relative to risk and securing minimum caloric
    value, obtaining technical recognition (Anastasia et al., 2020; Paramita et al.,
    2018).


    ## 5.7. Hydrothermal treatment


    2017 year marked the commencement of operations of hydrothermal facility in Indonesia,
    designed to process non-segregated municipal waste. Unsorted, highly organic garbage
    is fed into reactor and exposed to steam at a pressure of 2.5 MPa and 220 °C for
    30 min. Powder-like substance, is one product obtained from this process. Hydrothermal
    might utilize approximately 15% of the powder is used during hydrothermal treatment
    and the remaining portion can be converted to coal. Data emissions from boiler
    demonstrate low pollution (Marbali et al., 2021; Saqib et al., 2019). The applicability
    of this technology on industrial scale is growing; however, current study presents
    results on laboratory size (Hantoro et al., 2020); Putra et al., 2021; Vaskin
    et al., 2017). To assess sensitivity, many influencing variables are financial
    costs associated with material collection and transport (Mazumdar et al., 2022).
    The entire system should be assessed from technical and economic standpoint, given
    the industrial viability of hydrothermal process. Several technologies can process
    input waste as wet or dry. The efficacy of these technologies depends on input
    composition, such as acidity, volume reduction, and time. The period of each technology
    is considered an advantage for further application and result as environmental
    impact. The reliability of these technologies is related to economic consideration
    and technical feasibility of their small/large-scale application. RDF and ASF
    are widely used in Indonesia because of low investment and operational cost. AD,
    and composting are process adopted in small/large scales with relatively easy
    operations. Hydrothermal treatment is a suitable without. Nevertheless, capital
    investment and infrastructure are required due to high levels of maintenance (supplementary
    material).


    ## 6. Waste treatment recommendations in Indonesia


    Fig. 6 shows the recommendations for PW processing in Indonesia. The waste reduction
    target is the main focus for reducing generation. PW generated at the waste source
    is transported to the temporary processing site (TPS) or temporary processing
    site (TPS3R) or goes to landfills. Processed waste is transported to TPS3R. The
    waste source to TPS or TPS3R requires transportation to a communal processing
    site. Households or communities manage regional-scale composting and processing
    sites (on-site systems). Waste can be processed by the household or at the nearest
    processing site. The communal processing sites (offsite system), TPS3R can also
    function as a recycling center with compost processing, BSF, and thermal processing.
    PW must be sorted and segregated before entering the unit. Any residual PW that
    cannot be reused cannot be transported to landfill. Products from PW can be reused
    or recycled.


    ### 6.1. Feasibility


    Collecting PW is a significant priority, requiring extra transportation and microbial
    control (Fig.). Before PW is moved to a centralized treatment facility, bacterial
    growth is easily encouraged during the collection and processing, as bacteria
    are abundant in water and organic matters. Therefore, the PW generated is crucial
    for preventing contamination and odor issues (Guan et al., 2020). PW waste must
    be stored and handled in accordance with the specifications of the facility to
    run efficiently. Every household and business requires suitable trucks, proper
    collection and hygienic waste management procedures. Furthermore, well-skilled
    operators and labours are required for the functioning of these plants (Karmak
    et al., 2023). The large range of target and non-target substances associated
    with different waste sources and the costs associated with large-scale commercialization
    and high productivity could be challenging (Abu et al., 2021; Ahamed et al., 2016;
    Laurent et al., 2014).


    ### 6.2. Economic realities


    Indonesia''s annual budget for waste management in 2022 was only 0.5% of the total
    budget (Ministry of Home Affairs, 2022). Due to insufficient funding for recycling,
    some developing nations have attempted to implement a system for waste management
    in their legislative frameworks. However, budgeting remains a significant problem
    in developing countries for handling waste (Johari et al., 2017; Pham et al.,
    2015; Sukart et al., 2022).


    Sustainably managing PW is a significant priority in developing countries. PW
    is significantly higher during processing, decreasing the use of sophisticated
    food preservation methods, including inadequate government regulations and immature
    supply chains. In developing countries, PW is primarily landfilled or utilized
    as animal feed (Lohri et al., 2017). The applicability of PW recycling in developing
    countries is highly limited by weak recovery methods.

