    # 摘要


    印尼西亚的国内废物是由食品浪费（FW）驱动的。印尼西亚已承诺根据国家战略政策（第97/2017号法规）推进食品浪费管理，目标是到2025年减少30%并处理70%。然而，目前的食品浪费法规和技术不足以实现这些目标。本文旨在量化食品浪费的产生并改进技术以支持这些目标。文中从技术、经济和环境考虑的背景讨论了印尼西亚建议的食品浪费处理方法。目前的食品浪费处理包括堆肥和填埋，后者对环境的影响最大。黑水虻和热处理是印尼西亚考虑用于垃圾垃圾发电的新技术。食品浪费处理的考量正在不同规模上发展。因此，必须考虑当前处理方法的环境影响。从产品和残余物对环境的影响以及产品质量方面来分析特定的食品浪费建议至关重要。

