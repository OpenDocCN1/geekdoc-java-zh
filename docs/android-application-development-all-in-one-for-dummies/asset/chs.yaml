  \n### 类在树上生长\n\n列表 2-4 包含了 `extends Activity` 单词。显然，在列表 2-4 中声明的新类 `MyActivity`\
  \ 是某种名为 `Activity` 的东西的扩展。那么，这到底是怎么回事？\n\n你可以下载 Android 源代码（构成 Android 许多预定义类的 Java\
  \ 代码）。当你下载时，可以使用你喜喜欢的编辑器打开 `Activity.java` 文件。列表 2-9 包含了该文件中部分（诚然不具代表性的）代码。\n\n\
  ![cross-reference.eps](img/cross-reference_fmt.jpeg) 有关关于下载 Android 源代码的更多信息，请访问\
  \ [`http://source.android.com/source/downloading.html`](http://source.android.com/source/downloading.html)。\n\
  \n### 列表 2-9：极度精简版的 Android Activity 类\n\n```java\npackage android.app;\n\npublic\
  \ class Activity extends ContextThemeWrapper {\n    protected void onCreate(Bundle\
  \ savedInstanceState) {\n        mVisibleFromClient =\n            !mWindow.getWindowStyle().getBoolean(\n\
  \              com.android.internal.R.styleable.\n              Window_windowNoDisplay,\
  \ false);\n        mCalled = true;\n    }\n    protected void onDestroy() {\n  \
  \      mCalled = true;\n        // 释放任何我们正在管理的对话框。\n        if (mManagedDialogs\
  \ != null) {\n            final int numDialogs = mManagedDialogs.size();\n     \
  \       for (int i = 0; i < numDialogs; i++) {\n                final ManagedDialog\
  \ md =\n                    mManagedDialogs.valueAt(i);\n                if (md.mDialog.isShowing())\
  \ {\n                    md.mDialog.dismiss();\n                }\n            }\n\
  \            mManagedDialogs = null;\n        }\n        // 关闭任何打开的对话框\n       \
  \ if (mSearchManager != null) {\n            mSearchManager.stopSearch();\n    \
  \    }\n    }\n}\n```\n\nAndroid SDK 自带一个 `Activity` 类，`Activity` 类包含了名为 `onCreate`\
  \ 和 `onDestroy` 的方法。（实际上，Android 的 `Activity` 类包含至少 140 个方法。但谁会在意个数呢？）列表 2-4 中，`MyActivity\
  \ extends Activity` 单词在 `MyActivity` 类和 Android 的 `Activity` 类之间建立了关系。除其他外，`MyActivity`\
  \ 类继承了属于 `Activity` 类的字段和方法。因此，无需向列表 2-4 中添加任何代码，你就可以放心 `MyActivity` 拥有一个 `onDestroy`\
  \ 方法。这就像是你从列表 2-9 中复制了 `onDestroy` 方法并将其粘贴到列表 2-4 中。\n\n除了 `extends` 术语外，Java 对\
  \ `MyActivity` 类和 `Activity` 类之间的关系有几种名称：\n\n- `MyActivity` 类是 `Activity` 类的子类。\n\
  - `MyActivity` 类是 `Activity` 类的子节点。\n- `Activity` 类是 `MyActivity` 类的超类。\n- `Activity`\
  \ 类是 `MyActivity` 类的父类。\n\n如果这一切父子关系让你想起了家族树，那么你并不孤单。Java 开发者经常画倒立的树。例如，在列表 2-4\
  \ 中，`extends Activity` 单词表示 `MyActivity` 类是 `Activity` 类的扩展。\n\n\n\n\n\n```java\n\
  package com.allmycode.somepackage;\n\npublic class SomeClass {\n\n}\n```\n\n在另一个文件中，你拥有：\n\
  \n```java\npackage com.allmycode.someotherpackage;\nimport com.allmycode.somepackage.*;\n\
  \n//你可以可以继承 SomeClass:\nclass SomeOtherClass extends SomeClass {\n    public String\
  \ infoString() {\n        // 这样也行：\n        SomeClass someObject = new SomeClass();\n\
  \    }\n}\n```\n\n如果一个类不是公共的（public），你只能在类包内的代码中引用该类。下面的代码清楚地说明了这一点。\n\n在一个文件中，你拥有：\n\
  \n```java\npackage com.burdbrain.somepackage;\nclass SomeClass {\n}\n```\n\n在另一个文件中，你拥有：\n\
  \n```java\npackage com.burdbrain.someotherpackage;\nimport com.burdbrain.somepackage.*;\n\
  \n//你不能继承 SomeClass:\nclass SomeOtherClass extends SomeClass {\n    public String\
  \ infoString() {\n        // 这样也不行：\n        SomeClass someObject = new SomeClass();\n\
  \    }\n}\n```\n\n### 其他公共内容\n\n名称的作用范围（scope）是指你（开发者）可以使用该名称的代码范围。因此，总结一下前一节冗长的解释：\n\
  \n- 公共类名称的作用范围包括所有的 Java 代码。\n- 非公共类名称的作用范围限制在声明该类的包（package）中。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 公共类的名称并不真正包含所有的 Java 代码。如果我在我月球基地的计算机上运行一个 Java 程序，而你正在环绕火星轨道度假时在手机上运行程序，那么你的手机无法访问我代码中的公共类。要让代码访问我的公共类，该代码必须运行在同一个\
  \ Java 虚拟机上。\n\n类的成员（类的方法和字段）也可以是公有的。例如，列表 2-7 中的类具有公共字段 `name`、`address` 和 `balance`，并拥有公共方法\
  \ `infoString`。事实上，关于类成员的说明要复杂一些。`public` 关键字是一个访问修饰符，类的成员可以是 `public`、`private`\
  \ 或 `protected`，也可以没有访问修饰符。（例如，列表 2-8 中的 `textView1` 字段没有访问修饰符。列表 2-9 中的 `onCreate`\
  \ 和 `onDestroy` 方法具有 `protected` 访问权限。）你的访问修饰符选择分类如下：\n\n- `public` 成员的作用范围包括所有的\
  \ Java 代码。\n- `private` 成员的作用范围包括声明该成员的类。\n- `protected` 成员的作用范围包括声明该成员的类。该范围还包括声明该成员的类的任何子类，以及属于该成员所在包的所有类。\n\
  - 无访问修饰符的成员的作用范围包括声明该成员的类。该范围还包括声明该成员所在包的所有类。\n\n我不知道你们怎么想，但我很难理解 `protected` 访问的含义。困难点之一在于，与我的直觉相反，使用\
  \ `protected` 词的限制比完全不使用访问修饰符要小。总之，当我遇到具有 `protected` 访问权限的成员时，我会停下来思考足够久，直到我的恶心感消失。\n\
  \n### 反叛父母\n\n在家庭中，孩子们经常会反叛父母的价值观。Java 也是如此。`MyActivity` 类（在列表 2-4）是 `Activity`\
  \ 类（在列表 2-9）的子类。因此，一看，`MyActivity` 应该继承 `Activity` 类代码中声明的 `onCreate` 方法。\n\n但 `Activity`\
  \ 和 `MyActivity` 类都有 `onCreate` 方法声明。而且这两个 `onCreate` 声明具有相同的参数列表。通过这种方式，`MyActivity`\
  \ 类反叛了它的父母。`MyActivity` 类对 `Activity` 类说：“我不想要你那臭的 `onCreate` 方法。我要声明我自己的 `onCreate`\
  \ 方法。”\n\n所以当你启动一个应用时，你的手机创建一个 `MyActivity` 对象，手机执行的是 `MyActivity` 版本的 `onCreate`，而不是父类\
  \ `Activity` 版本的 `onCreate`。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 像所有反叛的孩子一样，`MyActivity` 不能完全脱离其父类的代码。`MyActivity` 类中 `onCreate` 方法的第一条语句是对 `super.onCreate`\
  \ 的调用。（我的孩子通常不叫我 `super`，但类是这样指代它的父类的。）总之，语句 `super.onCreate` 调用了父类的 `onCreate`\
  \ 方法。所以，在 `onCreate` 方法之前……\n\n### Java 注解\n\n列表 2-4 中的 `@Override` 单词是一个注解（annotation）。注解告诉\
  \ Java 有关你代码的一些信息。如果你不小心写错了方法名，Android 会显示错误。\n\n```java\n@Override\npublic void\
  \ onCreate(Bundle initState)\n```\n\n### Java 注释\n\n注释是程序的一部分。但与声明、方法调用和其他内容不同，注释的目的是帮助人们理解你的代码。Java\
  \ 编程语言有三种注释：\n\n- 块注释：块注释以 `/*` 开始，以 `*/` 结束。起始 `/*` 和结束 `*/` 之间的所有内容都只给人类看。\n-\
  \ 行尾注释：行尾注释以双斜杠 `//` 开始，一直到该行的结束。\n- Javadoc 注释：Javadoc 注释以斜杠和两个星号 `/**` 开始。\n\n\
  Javadoc 注释是为了给那些从不看 Java 代码的人读的。名为 `javadoc` 的特定程序可以找到 Javadoc 注释并将其转换为漂亮的网页。\n\n\
  ```java\n/**\n * 在活动首次创建时被调用。\n */\n```\n\n### 生成 Javadoc\n\n要生成像图 2-5 那样的网页，请执行以下操作：\n\
  \n1. 在 Eclipse 的主菜单中，选择 `Project ⇒> Generate Javadoc`。\n2. 在对话框的 Javadoc Command\
  \ 字段中，输入开发计算机上 `javadoc`（或 `javadoc.exe`）文件的路径。\n\n或者，你可以使用对话框的 `Configure` 按钮导航到\
  \ `javadoc` 或 `javadoc.exe` 文件。\n3. 在 Select Types 格中，勾选你想文档的项目。\n\n\n\n\n选择类型（Select\
  \ Types）面板实际上是两个并排的窗格。（参见图 2-6。）左侧面板用于选择整个项目或整个包；右侧面板用于选择或取消选择包内的 `.java` 文件。\n\n\
  4. 在 `Destination` 字段中，输入将包含你的 Javadoc 页面的文件夹名称（或点击 `Browse` 按钮让鼠标完成操作）。\n\n5. 点击\
  \ `Finish`。\n\n**图 2-6：** Eclipse 生成 Javadoc 的对话框。\n\n![9781118027707-fg020206.tif](img/9781118027707-fg020206_fmt.jpeg)\n\
  \n在 Generate Javadoc 对话框中，你可以选择 `Use Custom Doclet（使用自定义 doclet）而不是 `Use Standard\
  \ Doclet（使用标准 doclet）。doclet 决定 Java 文档页的外观。因此，选择 `Use Custom Doclet` 可以让你更改文档页面的外观。例如，使用名为\
  \ `DroidDoc` 的 doclet，你可以获得与 [`http://developer.android.com/reference/packages.html`](http://developer.android.com/reference/packages.html%20)（Android\
  \ 官方文档网站）类似的页面。\n\n# 第 3 章：Java 能做什么（以及何时做）\n\n## 本章\n\n![check.png](img/check.png)\
  \ 使用 Java 语句进行决策\n![check.png](img/check.png) 使用 Java 语句重复操作\n![check.png](img/check.png)\
  \ 添加异常处理\n\n人类思维围绕名词和动词展开。名词是“实体”，动词是实体的动作。名词是零件，动词是胶水。名词负责存在，动词负责执行。当你使用名词时，你说“书”、“房间”或“东西”。当你使用动词时，你说“做这个”、“做那个”、“吊起那艘船”或“举起那捆草”。\n\
  \nJava 也有名词和动词。Java 的名词包括 `String`、`ArrayList` 和 `JFrame`，以及 Android 特有的内容如 `Activity`、`Application`\
  \ 和 `Bundle`。Java 的动词涉及赋值、在备选方案中选择、重复操作和其他行动方案。\n\n本章涵盖了 Java 的一些动词。在本书的第 4 章中，你将引入名词。\n\
  \n## 做出决策（Java if 语句）\n\n当你编写计算机程序时，你不断地遇到十字路口。用户正确输入密码了吗？如果是，就让用户操作；如果不是，就把他踢出去。因此，Java\
  \ 编程语言需要一种方法让程序在两个方向之一分支。幸运的是，这种语言有一种方法：它被称为 `if` 语句。`if` 语句的使用如列表 3-1 所示。\n\n代码列表\
  \ 3-1：带有 if 语句的方法\n\n```java\npublic void onClick(View v) {\n  if (((CheckBox) v).isChecked())\
  \ {\n             textview.setTextColor(Color.GREEN);\n             textview.setText(\"\
  Thank you!\");\n  } else {\n             textview.setTextColor(Color.RED);\n   \
  \          textview.setText(\"No harm done.\");\n  }\n}\n```\n\n当用户点击特定的复选框时，Android\
  \ 会调用列表 3-1 中的 `onClick` 方法。（Android 使用参数 `v` 将此复选框传递给 `onClick` 方法。这就是 `onClick`\
  \ 方法如何发现用户点击了哪个对象的方法。）如果点击在复选框中打上标记，文本视图将用绿色字体显示 `Thank you!`。否则，文本视图将用红色字体显示 `No\
  \ harm done.`。（参见无色的图 3-1。）\n\n**图 3-1：** 列表 3-1 中的勾选与取消勾选。\n\n![9781118027707-fg020301.tif](img/9781118027707-fg020301_fmt.jpeg)\n\
  \n### 核心继承\n\n在列表 3-1 中，变量 `v` 代表某种 `View`（`onClick` 方法的参数列表是这么说的）。和所有的 Java 类一样，`View`\
  \ 类是类家族树的一部分。下图显示了 `View` 类的一些最亲近的亲属。在树中越得越深，类的特征就越具体。例如，在树的顶部，你有一个被称为 `Object`\
  \ 的非常模糊的东西。在 `Object` 之下是 `View` 类。`View` 是你放在用户屏幕上的东西（用户看到的东西）。并不是所有的 `View` 实例都显示文本，因此在层次结构中\
  \ `View` 之下是更具体的 `ImageView` 和 `TextView` 类。\n\n`CheckBox` 类位于图的最底部。`CheckBox` 是特定类型的\
  \ `TextView` —— 一直处于两种状态之一（已勾选或未勾选）的 `TextView`。\n\n与此同时，回到列表 3-1，`onClick` 方法的参数\
  \ `v` 是任何种类的 `View`。这种不特定的“任何种 `View`”之所以是因为你永远不知道用户会点击哪种 `View`。Android 预先定义的 `onClick`\
  \ 方法……\n\n\n\n\n```java\ntextview.setText(\"Thank you!\");\n}\n```\n\n### 原始类型与引用类型\n\
  \n`int` 类型是一个原始类型。当你声明一个变量为 `int` 类型时，你可以以一种非常直观的方式视觉化该声明的含义。这意味着在计算机内存的某个地方，为该变量的值预留了一个存储位置。在这个存储位置中有一组位（bits）。这些位的排列确保了某个整数被表示出来。\n\
  \n这种解释对于 `int` 或 `double` 这样的原始类型是足够的，但每个 Java 类都是引用类型。如果你声明一个变量的类型不是原始类型，那么该变量的类型（大多数情况下）就是某个\
  \ Java 类的名称。\n\n声明一个变量为引用类型意味着什么？声明 `response` 的类型为 `String` 或声明 `v` 的类型为 `View`\
  \ 意味着什么？\n\n因为 `String` 是一个类，你可以从该类中创建对象。每个这样的对象（每个 `String` 类的实例）都是字符序列。通过将变量 `response`\
  \ 的类型声明为 `String`，你预留了对 `response` 这个名称的使用。这个预留告诉 Java，`response` 可以引用一个真正的 `String`\
  \ 类型对象。换句话说，`response` 可以成为一个字符序列的昵号。下图说明了这种情况，图中描述了原始类型和引用类型的存储故事。\n\n如果你熟悉其他编程语言并喜欢讨论指针，你可以安全地认为\
  \ `String response` 是一个声明，其含义是“`response` 存储指向字符序列的指针”。\n\n![9781118027707-sb020302.eps](img/9781118027707-sb020302_fmt.jpeg)\n\
  \n### 测试相等性\n\nJava 有几种方法来测试相等性（“这个值和那个值相同吗？”）。这些方法都不是你首先想到的。特别是，为了找出参数 `v` 是否是你所调用的\
  \ `checkbox1` 那个东西，你不会写 `if (v = checkbox1)`。相反，你使用双等号（`==`）。你写 `if (v == checkbox1)`。在\
  \ Java 中，单等号（`=`）被留用于赋值。因此 `n = 5` 意味着“让 `n` 代表值 `5`”，而 `v = checkbox1` 意味着“让 `v`\
  \ 代表 `checkbox1` 对象”。\n\n比较两个字符串是另一回事。当你比较两个字符串时，你并不想使用双等号。使用双等号会询问：“这个字符串在内存中的存储位置是否与另一个字符串完全相同？”这通常不是你想要问的。相反，你通常是想问：“这个字符串包含的字符是否和另一个字符串相同？”为了问第二个问题（即更恰当的问题），Java\
  \ 的 `String` 类型有一个名为 `equals` 的方法：\n\n```java\nif (response.equals(\"yes\")) {\n\
  ```\n\n`equals` 方法比较两个字符串以查看它们包含的字符是否相同。在本段的微型示例中，变量 `response` 是一个字符串，而文本 `“yes”`\
  \ 是一个字符串。如果 `response` 指向一个字母为‘y’、然后是‘e’、最后是‘s’的字符串，则条件 `response.equals(\"yes\"\
  )` 为真。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg) 与大多数编程语言一样，Java 拥有一套比较运算符（如表示“小于”的\
  \ `<`）和逻辑运算符（如表示“和”的 `&&`）。有关此类运算符的列表，请访问 [`http://download.oracle.com/javase/tutorial/java/nutsandbolts/opsummary.html`](http://download.oracle.com/javase/tutorial/java/nutsandbolts/opsummary.html)。\n\
  \n### 在许多替代方案中进行选择（Java switch 语句）\n\n我是第一个承认自己讨厌做决定的人。如果事情出了错，我宁愿问题是别人的责任。写完之前的章节（关于使用\
  \ Java 的 `if` 语句做决策）让我精疲力尽。这就是为什么当我开始这个关于在许多替代方案中进行选择的章节时，我的大脑一片空白。\n\n考虑列表 3-2\
  \ 中的代码。\n\n**列表 3-2：Java switch 语句**\n\n```java\npublic void onClick(View v) {\n\
  \    String message;\n    Editable edit = textfield.getText();\n    if (edit.length()\
  \ != 0) {\n        int number =\n                Integer.valueOf(edit.toString());\n\
  \        switch (number) {\n        case 0:\n            message = \"none\";\n \
  \           break;\n        case 1:\n            message = \"one\";\n          \
  \  break;\n        case 2:\n            message = \"two\";\n            break;\n\
  \        case 3:\n            message = \"three\";\n            break;\n       \
  \ default:\n            message = \"many\";\n        }\n    }\n    label.setText(message);\n\
  }\n```\n\n列表 3-2 中的代码是一个应用程序的一部分，该应用程序的屏幕如图 3-2 所示。**图 3-2：** 一个 `TextView` 对象报告\
  \ `EditText` 的内容。\n\n![9781118027707-fg020302.tif](img/9781118027707-fg020302.tif)\n\
  \n列表 3-2 中的代码是一个应用程序的一部分，该应用程序的屏幕如图 3-2 所示。**图 3-2：** 一个 `TextView` 对象报告 `EditText`\
  \ 的内容。![9781118027707-fg020302.tif](img/9781118027707-fg020302.tif) 列表 3-2 中的代码是一个应用程序的一部分，该应用程序的屏幕如图\
  \ 3-2 所示。**图 3-2：** 一个 `TextView` 对象报告 `EditText` 的内容。![9781118027707-fg020302.tif](img/9781118027707-fg020302.tif)\
  \ 列表 3-2 中的代码是一个应用程序的一部分，该应用程序的屏幕如图 3-2 所示。**图 3-2：** 一个 `TextView` 对象报告 `EditText`\
  \ 的内容。![9781118027707-fg020302.tif](img/9781118027707-fg020302.tif) 列表 3-2 中的代码是一个应用程序的一部分，该应用程序的屏幕如图\
  \ 3-2 所示。**图 3-2：** 一个 `TextView` 对象报告 `EditText` 的内容。![9781118027707-fg020302.tif](img/9781118027707-fg020302.tif)\
  \ 列表 3-2 中的代码是一个应用程序的一部分，该应用程序的屏幕如图 3-2 所示。**图 3-2：** 一个 `TextView` 对象报告 `EditText`\
  \ 的内容。![9781118027707-fg020302.tif](img/9781118027707-fg020302.tif) 列表 3-2 中的代码是一个应用程序的一部分，该应用程序的屏幕如图\
  \ 3-2 所示。**图 3-2：** 一个 `TextView` 对象报告 `EditText` 的内容。\n\n（在 3-2）`switch` 语句检查 `number`\
  \ 字段。如果 `number` 是 0，代码让 `message` 变为“none”；如果 `number` 是 1，代码让 `message` 变为“one”；如果\
  \ `number` 不是 0、1、2 或 3，则 `switch` 语句的 `default` 部分接管，代码让 `message` 变为“many”。![9781118027707-fg020302.tif](img/9781118027707-fg020302.tif)\
  \ 为了确保文本字段是数字，我们在 布局中包含了以下元素：\n\n```xml\n<EditText android:id=\"@+id/editText1\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"wrap_content\"\
  \n    android:inputType=\"number\"/>\n```\n\n在 3-2 中，`switch` 语句包含某些内容。如果你写：\n\n\
  ```java\ncase 2:\n    message = \"two\";\ncase 3:\n    message = \"three\";\ndefault:\n\
  \    message = \"many\";\n}\n```\n\n并且 `number` 是 2，Java 会按顺序执行三个情况，即执行 `message\
  \ = \"two\"`，接着执行 `message = \"three\"`，紧接着执行 `message = \"many\"`。缺少 `break` 语句告诉\
  \ Java 从一个情况掉到下一个。最终结果是 `message` 为“many”，这可能不是你想要的。\n\n`switch` 语句具有以下形式：\n\n```java\n\
  switch (expression) {\ncase constant1:\n    当表达式等于 constant1 时执行的语句\ncase constant2:\n\
  \    当表达式等于 constant2 时执行的语句\ncase ...\ndefault:\n    当表达式的值与任何常量不同时执行的语句\n}\n```\n\
  \n你不能将任何旧表达式放在 `switch` 语句中。在 `switch` 语句开头测试的表达式必须是：\n\n* `char`、`byte`、`short`\
  \ 或 `int` 原始类型之一\n* `Character`、`Byte`、`Short` 或 `Integer` 引用类型之一\n* `enum` 类型\n\
  \n`enum` 类型是一种值限于你声明的几个值的类型。例如，以下代码\n\n```java\nenum TrafficSignal {GREEN, YELLOW,\
  \ RED};\n```\n\n定义了一个值仅为 `GREEN`、`YELLOW` 和 `RED` 的类型。在代码的其他地方，你可以写：\n\n```java\n\
  TrafficSignal signal;\nsignal = TrafficSignal.GREEN;\n```\n\n来使用 `TrafficSignal`\
  \ 类型。\n\n从 Java 7 开始，你可以在 `switch` 语句的开头放入 `String` 类型表达式。但在 Java 7 彻底稳定之前，你可能希望在\
  \ Android 代码中避免使用此功能。\n\n### 重复执行指令\n\n\n\n\n\n1966 年，海飞碧（Head & Shoulders）洗发水的公司创造了历史。在瓶子背面，洗发水的使用说明写着：“揉泡沫，冲洗，重复。”以前从未有一套完整的指令（用于任何事情，更不用说洗头了）被如此简洁地概括。指令编写行业的人将其誉为一项里程碑式的成就。这样的指令与当时的其他指令形成了鲜明对比。（例如，一罐杀虫剂上的第一句写着：“转动罐子，让它对开你的脸。”废话！）\n\
  \n除了简洁之外，海飞碧指令如此酷炫的地方在于，通过三个简单的单词，它们成功地捕捉到了所有指令传达的核心概念——**重复**的概念。最后那个单词 `repeat`（重复），将原本平淡乏味的指令单调循环变成了一个精密的行动配方。\n\
  \n基本思想是，当你遵循指令时，你不仅仅是一个接一个地执行指令。相反，你在道路路口交替换行。你做出决策（`如果头发是干的，则使用护发素` `）`），并进入循环（`揉泡沫-冲洗\
  \ 然后再次 揉泡沫-冲洗`）。在应用开发中，你一直在使用决策和循环。\n\n## Java while 语句\n\n在 Android 应用中，内容提供者（content\
  \ provider）向你的代码提供一个游标（cursor）。你可以将游标认为指向表格中某行的指针。在列表 3-3 中，每行表都有三个条目——`_id`、`name`\
  \ 和 `amount`。据假设，`_id` 唯一标识一行，`name` 是人的名字，而 `amount` 是该人欠你的巨额款项。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg)\
  \ 有关了解内容提供者的详情，请参阅第三卷第五章。\n\n### 列表 3-3：一个 while 循环\n\n```\ncursor.moveToFirst();\n\
  while (!cursor.isAfterLast()) {\n    String _id = cursor.getString(0);\n    String\
  \ name = cursor.getString(1);\n    String amount = cursor.getString(2);\n    textViewDisplay.append(_id\
  \ + \" \" +\n                           name + \" \" + amount + \"\\n\");\n    cursor.moveToNext();\n\
  }\n```\n\n游标的 `moveToFirst` 方法使游标指向表格的第一行。无论游标当前指向哪一行，游标的 `moveToNext` 方法都会让游标指向表格的下一行。游标的\
  \ `isAfterLast` 方法在尝试移动到下一行但发现没有下一行时，返回 `true`。\n\n在 Java 中，感叹号（`!`）表示“非”，所以 `while\
  \ (!cursor.isAfterLast())` 的意思是“当游标没有超出表格最后一行时，持续执行 . . .”。因此，列表 3-3 中的代码重复地执行以下操作：\n\
  \n只要游标没有超出最后一行，\n    获取行起始列中的字符串并\n    让 `_id` 指向该字符串，\n    获取行中间列中的字符串并\n    让\
  \ `name` 指向该字符串，\n    获取行最后一列中的字符串并\n    让 `amount` 指向该字符串，并且\n    将这些字符串添加到 `textViewDisplay`\
  \ 中，然后\n    将游标移动到下一行，为返回 while 语句的顶部做准备。\n\n假设某个特定游标的表格有 100 行。那么处理器就会执行列表 3-3\
  \ 中 `while` 循环内部的语句 100 次。使用官方开发者术语，处理器完成了 100 次循环迭代。\n\n`while` 语句具有以下形式：\n\n```\n\
  while (condition) {\n    要执行的语句\n}\n```\n\n当循环只有一个要执行的语句时，你可以省略大括号。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 在列表 3-3 中，字符 `\\n` 构成了一个转义序列。当你把 `\\n` 放在字符串内部时，你通过不显示反斜杠也不显示字母 `n` 来脱离正常的常规处理流程。相反，Java\
  \ 字符串中的 `\\n` 总是意味着“跳到下一行”。因此在列表 3-3 中，`\\n` 在一组 `_id`、`name`、`amount` 与下一组数据之间插入了换行符。\n\
  \n## Java for 语句\n\n生活中充满了计数循环的例子。应用开发镜像了生活——或者反过来？当你告诉设备执行某项操作时，你通常是在告诉设备显示十行，或其他类似的。列表\
  \ 3-3 显示了所有数据。为了获得表格的印象，你可能想显示前几行。列表 3-3 完成了任务。\n\n### 列表 3-4：一个 for\n\n```\ncursor.moveToFirst();\n\
  for (int i = 0; i < 10; i++) {\n    String _id = cursor.getString(0);\n    String\
  \ name = cursor.getString(1);\n    String amount = cursor.getString(2);\n    textViewDisplay.append(i\
  \ + \": \" + _id + \" \" + amount + \"\\n\");\n    cursor.moveToNext();\n}\n```\n\
  \n`for` 语句声明了一个 `i`。`i` 的起始值为 `0`。只要条件 `i < 10` 为真，处理器就会执行 `for` 语句内部的指令。在这个例子中，`textViewDisplay`\
  \ 获取了这些内容。但等等！当处理器回到开头时会发生什么？在开始循环之前，处理器执行 `i++`，这是 Java 语言中的“i 加 1”。所以在十次迭代后，`i`\
  \ 最终达到了 `10`。\n\n`for` 语句具有以下形式：\n\n```\nfor (初始化 ; 条件 ; 更新) {\n    要执行的语句\n}\n\
  ```\n\n- 初始化（如 3-4 中的 `int i = 0`）定义了第一次迭代之前的操作。\n- 条件（如 3-4 中的 `i < 10`）定义了迭代前的检查项。如果条件为真，处理器执行迭代。如果条件为假，处理器继续执行\
  \ `for` 语句之后的内容。\n- 更新（如 `i++`）定义了每次循环结束时执行的操作。\n\n一样，当循环只有一个语句时，你可以省略大括号。像古代悲剧中的主角一样，3-4\
  \ 中的循环有一个致命缺陷。如果游标的表格少于十行，循环就会崩溃。为了解决这个问题（并拯救主角），你可以在循环内部添加对“无行”的检查：\n\n```\nfor\
  \ (int i = 0; i < 10; i++) {\n    if (cursor.isAfterLast()) {\n        break;\n\
  \    }\n    String _id = cursor.getString(0);\n    String name = cursor.getString(1);\n\
  \    String amount = cursor.getString(2);\n    textViewDisplay.append(i + \": \"\
  \ + _id + \" \" + amount + \"\\n\");\n    cursor.moveToNext();\n}\n```\n\n在循环（`while`\
  \ 循环、`for` 循环或其他类型的循环）内部，`break` 语句表示“这个循环结束了”以及“我们离开”。处理器将继续执行循环代码之后之后的内容。\n\n\
  ## Java do 语句\n\n要查找游标表格中的某个特定行，你通常会执行查询。（有关查询的直白解释，请参阅第四卷）。你几乎从不手动搜索表格数据。但就此一次，看看一个逐行迭代的循环——该循环在列表\
  \ 3-5 中。\n\n```\ncursor.moveToFirst();\nString name;\ndo {\n    String _id = cursor.getString(0);\n\
  \    name = cursor.getString(1);\n}\n```\n\n\n\n\n\n```java\nString amount = cursor.getString(2);\n\
  textViewDisplay.append(_id + “ “ + name + “ “ + amount + “\\n”);\ncursor.moveToNext();\n\
  } while (!name.equals(“Burd”) && !cursor.isAfterLast());\n```\n\n通过 `do` 循环，处理器会直接进入并执行操作，然后检查一个条件以判断操作的结果是否是你的预期。如果结果符合预期，循环的执行就会结束。如果不符合，处理器将回到循环顶部进行下一次循环。\n\
  \n在列表 3-5 中，你正在寻找名字为 \"Burd Burd\" 的行。（毕竟，那个混蛋欠了你一大笔钱。）当你进入循环时，`cursor` 指向表格的第一行。在检查某行的名称是否为\
  \ `Burd` 之前，你会先获取该行的数据，并将其添加到 `textViewDisplay` 中，用户可以在那里看到正在发生的情况。\n\n在移动到下一行（下一次循环迭代）之前，你会检查一个条件，以确保另一行值得被访问。（确保你还没有找到那个叫\
  \ Burd 的家伙，并且还没有越过表格的最后一行。）\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 要让列表 3-5 中的代码运行，你必须将 `name` 的声明放在 `do` 语句之外。在大括号内部的声明（例如列表 3-4 中的 `_id`、`name`\
  \ 和 `amount` 声明）不能在大括号外部使用。因此，在列表 3-5 中，如果你不将 `name` 的声明移到循环外部，Java 会报错认为 `!name.equals(“Burd”)`\
  \ \n\n## Java 中的数组\n\n数组是一组相同类型的值。数组中的每个值都关联着一个索引。例如，以下代码将 `15.020999999999999`\
  \ 放入应用的 `textView1` 中：\n\n```java\ndouble[] measurements = new double[3];\nmeasurements[0]\
  \ = 5.7;\nmeasurements[1] = 9.32;\nmeasurements[2] = 0.001;\ntextView1.setText(Double.toString(measurements[0]\
  \ + measurements[1] + measurements[2]));\n```\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ `float` 值和 `double` 值的算术运算受到数值误差的困扰。`5.7 + 9.32 + 0.001` 的和是 `15.021`，而不是 `15.020999999999999`。但计算机内部使用位\
  \ 0 和 1（而不是数字 0 到 9）来存储数字。0 和 1 的使用加上计算机无法存储无限长的小数展开式，不可避免地导致了算术错误。抱歉！\n\n以下代码将\
  \ Barry Burd 和 Jane Dough 放入应用的 `textView1` 中：\n\n```java\nString[] names = new\
  \ String[3];\nnames[0] = new String(“Barry Burd”);\nnames[1] = new String(“John\
  \ Public”);\nnames[2] = new String(“Jane Dough”);\ntextView1.setText(names[0] +\
  \ “ and “ + names[2]);\n```\n\n你可以使用 `for` 循环在数组中逐值遍历。例如，以下代码将 Barry Burd John Public\
  \ Jane Dough 放入应用的 `textView1` 中：\n\n```java\nString[] names = new String[3];\n\
  names[0] = new String(“Barry Burd “);\nnames[1] = new String(“John Public “);\n\
  names[2] = new String(“Jane Dough “);\ntextView1.setText(\"\");\nfor (int i = 0;\
  \ i < 3; i++) {\n  textView1.append(names[i]);\n}\n```\n\n## Java 的增强型 for 语句\n\n\
  20 世纪 60 年代中期，一家公司通过广告推销其产品：“我们的产品曾是完美的。但现在，我们的产品更好！”\n\n21 世纪 00 代中期，新发布的 Java\
  \ 5 规范引入了一种全新的循环类型。这个功能已经是 Java 的一部分多年，但它仍然被称为增强型 `for` 循环。以下代码使用增强型 `for` 循环将 Barry\
  \ Burd John Public Jane Dough 放入应用的 `textView1` 中：\n\n```java\nString[] names =\
  \ new String[3];\nnames[0] = new String(“Barry Burd “);\nnames[1] = new String(“John\
  \ Public “);\nnames[2] = new String(“Jane Dough “);\ntextView1.setText(\"\");\n\
  for (String s : names) {\n  textView1.append(s);\n}\n```\n\n这是另一个例子。假设你有一个 `cursor`，并且你不知道它有多少列。Java\
  \ 的增强型 `for` 语句提供了一种优雅的处理方法。\n\n### 列表 3-6：For 循环\n\n```java\ncursor.moveToFirst();\n\
  while (!cursor.isAfterLast()) {\n  String amount = cursor.getString(2);\n  textViewDisplay.append(_id\
  \ + “ “ + name + “ “ + amount + “\\n”);\n  cursor.moveToNext();\n}\n```\n\n\n\n\n\
  这是一个简单的方法，可以将表示为 `String` 值的数字加 1：\n\n```java\nint increment(String str) {\n  return\
  \ Integer.parseInt(str) + 1;\n}\n```\n\n如果你调用 `increment(“985”)`，你会得到 `986`。这很好。\n\
  \n但如果你调用 `increment(“2.71828”)`，你的代码就会崩溃，你的应用程序也会停止运行。Java 会在 Eclipse 的 LogCat 视图中留下崩溃的线索。这些线索（形成\
  \ Java 堆栈跟踪）看起来如下：\n\n```\nException in thread “main” java.lang.NumberFormatException:\n\
  For input string: “2.71828”\n    at java.lang.NumberFormatException.forInputString\n\
  \    at java.lang.Integer.parseInt\n```\n\n如果你在 `increment` 方法中添加一些异常处理代码，无论是否调用\
  \ `increment(“2.71828”)`，你的代码都能继续运行。\n\n```java\nint increment(String str) {\n \
  \ try {\n    return Integer.parseInt(str) + 1;\n  } catch (NumberFormatException\
  \ e) {\n    return 0;\n  }\n}\n```\n\n在修改后的方法中使用 `try` 和 `catch`，Java 会尝试评估 `Integer.parseInt(str)`。如果评估成功，该方法返回\
  \ `Integer.parseInt(str) + 1`。但如果 `str` 有一个奇怪的值，对 `Integer.parseInt` 的调用将抛出 `NumberFormatException`。幸运的是，修改后的\
  \ `increment` 方法捕获了 `NumberFormatException`，返回值 `0` 并继续运行而不打扰用户。\n\n# 第 4 章：Java\
  \ 中的面向对象编程\n\n## 本章内容\n\n![check.png](img/check.png) 熟练使用类\n![check.png](img/check.png)\
  \ 使用 Java 类和接口\n![check.png](img/check.png) 加入 Java 核心圈\n\n如果你忘记了关于 Java 的其他任何内容，请记住本微型书籍第\
  \ 2 章中的这些思想：\n\nJava 是一种面向对象的编程语言。因此，作为一名开发者，你的首要目标是描述对象。你紧相关的目标是描述对象的近亲——即类（classes）。类是某种事物背后的概念。对象是类的具体实例。\n\
  \n如果你忘记了这些思想的其他任何内容，请记住这个两个词的总结：\n\n类；对象。\n\n本微型书籍的第 2 章涵盖了 Java 面向对象编程的亮点。本章涵盖了面向对象编程的一些更精细之处。\n\
  \n## 静态字段和方法\n\n在列表 4-1 中，我重了 Android `Toast` 类源代码的一小部分。\n\n**列表 4-1：Android Toast\
  \ 类的一个非代表性样本**\n\n```java\npublic class Toast {\n  public static final int LENGTH_LONG\
  \ = 1;\n  public static Toast makeText(Context context,\n                      \
  \        CharSequence text,\n                              int duration) {\n   \
  \   Toast result = new Toast(context);\n      LayoutInflater inflate = (LayoutInflater)\
  \ context.\n        getSystemService(Context.LAYOUT_INFLATER_SERVICE);\n      View\
  \ v = inflate.inflate\n        (com.android.internal.\n        R.layout.transient_notification,\
  \ null);\n      TextView tv = (TextView)v.findViewById\n        (com.android.internal.R.id.message);\n\
  \      tv.setText(text);\n      result.mNextView = v;\n      result.mDuration =\
  \ duration;\n      return result;\n  }\n  public void show() {\n    if (mNextView\
  \ == null) {\n      throw new RuntimeException\n        (“setView must have been\
  \ called”);\n    }\n    INotificationManager service = getService();\n    String\
  \ pkg = getPackageName();\n    long tn;\n    try {\n      service.enqueueToast(pkg,\
  \ tn, mDuration);\n    } catch (RemoteException e) {\n      // Empty\n    }\n  }\n\
  ```\n\n根据列表 4-1 中的代码，`Toast` 类有一个名为 `LENGTH_LONG` 的静态字段和一个名为 `makeText` 的静态方法。任何声明为静态（static）的内容属于整个类，而不属于该类的任何实例。当你创建静态字段\
  \ `LENGTH_LONG` 时，你只创建一个副本。这个副本与整个 `Toast` 类共存。无论你创建多少个 `Toast` 类的实例——一个还是一个——你都只有一个\
  \ `LENGTH_LONG` 字段。\n\n对比一下第 2 章的情况。在那个章中，`Account` 类拥有字段 `name`、`address` 和 `balance`。这些字段不是静态的，因此\
  \ `Account` 类的每个实例都有它们自己的 `name`、自己的 `address` 和自己的 `balance`。一个实例拥有 `name` 为 `Barry\
  \ Burd` 的 `balance` 为 `24`，另一个实例拥有 `name` 为 `John Q.` 的 `balance` 为 `47`。要引用 `balance`，你可以编写类似\
  \ `myAccount.balance` 的代码，如下所示：\n\n```java\nAccount myAccount = new Account();\n\
  myAccount.address = “222 Cyberspace Lane”;\nmyAccount.balance = 24;\n```\n\n要引用类的非静态成员，你需要写对象的名称（例如\
  \ `myAccount`），后面跟着点，然后是成员的名称（例如 `balance`）。但 `Toast` 类的 `LENGTH_LONG` 字段是静态的。当你创建一个\
  \ `Toast` 实例时，你并没有创建一个新的 `LENGTH_LONG`。\n\n\n\n\n```java\npublic interface SomeListener\
  \ extends OnClickListener {\n```\n\n* 接口可以继承多一个接口。\n* 接口的方法没有自己的方法体。\n\n在列表 4-2\
  \ 中，`onClick` 方法没有方法体——既没有大括号，也没有要执行的语句。取而代之的是一个分号。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 没有方法体的方法（如列表 4-2 中定义的方法）被称为抽象方法。\n\n* 当你实现一个接口时，你为该接口的所有方法提供方法体。\n\n这就是为什么列表 4-3\
  \ 中的 `MyListener` 类有一个 `onClick` 方法的原因。通过声明它将实现 `OnClickListener` 接口，`MyListener`\
  \ 类同意为接口的 `onClick` 方法赋予含义。在这种情况下，赋予含义意味着声明一个带有大括号、方法体以及可能包含一些要执行语句的 `onClick` 方法。\n\
  \n### 列表 4-3：实现 Android 的 OnClickListener 接口\n\n```java\npackage com.allmycode.samples;\n\
  \nimport android.app.Activity;\nimport android.os.Bundle;\nimport android.view.View;\n\
  import android.view.View.OnClickListener;\nimport android.widget.Button;\n\npublic\
  \ class MyActivity extends Activity {\n    Button button;\n    @Override\n    public\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.main);\n        button = ((Button) findViewById(R.id.button1));\n\
  \        button.setOnClickListener(new MyListener(this));\n    }\n}\n\nclass MyListener\
  \ implements OnClickListener {\n    Activity activity;\n    MyListener (Activity\
  \ activity) {\n        this.activity = activity;\n    }\n    @Override\n    public\
  \ void onClick(View arg0) {\n        ((MyActivity) activity).button.setBackgroundColor\n\
  \                              (android.graphics.Color.GRAY);\n    }\n}\n```\n\n\
  列表 4-3 并不是实现 `OnClickListener` 接口最流行的方法，但该列表展示了接口及其实现的一种直接用法。\n\n当你宣布你将实现一个接口时（例如\
  \ `class MyListener implements OnClickListener`），Java 编译器会认真对待这一声明。在类体中，如果你未能为接口的任何方法赋予含义，编译器就会向你报错。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 如果你真的很懒，可以快速发现你的接口实现代码中需要声明哪些方法。尝试编译代码，编译器会列出所有你应该声明但没有声明的方法。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 本微型读本的第 2 章介绍了 `@Override`\
  \ 的使用——这是一个 Java 注解。通常情况下，你使用 `@Override` 来表示替换已在父类中声明的方法。但从 Java 6 开始，你也可以使用 `@Override`\
  \ 来表示接口方法的实现。这正我在列表 4-3 中所做的。\n\n你可以将接口看作一种合同。当你写下：\n\n```java\nclass MyListener\
  \ implements OnClickListener\n```\n\n你正正在将 `MyListener` 绑定到列表 4-2 中描述的合同上。该合同规定：“你，作为实现类，在此同意为接口中声明的每个抽象方法提供方法体，并对因佩戴口袋保护而导致的任何损坏、意外或尴尬对该接口免于责任。”\n\
  \n作为社会的一员，你恰好有两个生物学父母，但你可以与几家公司签订协议。同样，一个 Java 类只有一个父类，但一个类可以实现许多接口。\n\n接口实现的层次结构（如果你可以称其“层次结构”的话）跨越了类继承层次结构。这一观点在图\
  \ 4-1 中得到了体现，我在图中垂直显示类继承，并水平显示接口实现。（Android 的 `KeyboardView` 类位于 `android.inputmethod\
  \ service` 包中。`KeyboardView` 和列表 4-3 中自定义的 `MyListener` 类都实现了 Android 的 `OnClickListener`\
  \ 接口。）\n\n**图 4-1：**接口层次结构跨越了类层次结构。\n\n![9781118027707-fg0204]- 接口层次结构跨越了类层次结构。](images/9781118027707-fg0204)\n\
  \n### 事件处理与回调\n\nAndroid 回调你的应用程序代码，因此“回调”一词描述了 Android 用来处理事件的机制。\n\n\n\n\n在上一节中，我针对你的应用与\
  \ Android 回调之间的交互提出了几个问题。但在那个节中，我漏掉了其中一个问题。这个问题是：在列表 4-3 的 `onClick` 方法中，代码是如何知道\
  \ `button` 代表什么的？列表 4-3 包含了两个类——`MyActivity` 和 `MyListener`。在不经过某些操作的情况下，一个类对另一个类的字段一无所知。\n\
  \n在列表 4-3 中，关键字 `this` 位于定义 `MyActivity`类的代码内部：\n\n```java\nbutton.setOnClickListener(new\
  \ MyListener(this));\n```\n\n在 Java 中，`this` 指“包含当前行代码的对象”。因此，在列表 4-3 中，单词 `this`\
  \ 指的是 `MyActivity` 的实例——正在设备屏幕上显示的活动。当前的 `MyActivity` 实例有一个按钮。到目前为止，一切良好。\n\n在列表\
  \ 4-3 之后，`MyListener` 构造函数将当前活的引用存入它的字段之一。（参见图 4-3。）\n\n**图 4-3：** 监听器如何记住它的创建者。\n\
  \n![9781118027707-fg020403.eps](img/9781118027707-fg020403_fmt.jpeg)\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg)\
  \ 有更多关于构造函数以及在构造函数内部使用单词 `this` 的信息，请参见本小书第 2 章。\n\n再次查看图 4-3，`MyListener` 引用 `activity`，而该活动包含一个按钮。当\
  \ Android 调用 `onClick` 方法时，该方法执行的指令非常像这一条：\n\n```java\nactivity.button.setBackgroundColor(android.graphics.Color.GRAY);\n\
  ```\n\n该指令获取引用的活动按钮，并将按钮的背景颜色设置为灰色。（为了使其正常工作，你必须在列表 4-3 的 `onClick` 方法中进行一些类型转换，但你可以在浏览本小书第\
  \ 3 章时再担心转换问题。）\n\n### 处理事件的简单方法\n\n如果你读了上一节，接着读这一节，你可能会想给我发一封恶毒的邮件。上一节描述了一种诚然复杂的方法，让监听器记住要调整哪个活的按钮。了解列表\
  \ 4-3 的工作原理是重要的，但如果你修改列表 4-3 使活动成为它自己的监听器，事情就会变得简单得多。列表 4-4 向你展示了如何这样做。\n\n列表 4-4：活动吃自己的狗粮\n\
  \n```java\npackage com.allmycode.samples;\n\nimport android.app.Activity;\nimport\
  \ android.os.Bundle;\nimport android.view.View;\nimport android.view.View.OnClickListener;\n\
  import android.widget.Button;\n\npublic class MyActivity extends Activity\nimplements\
  \ OnClickListener {\n    Button button;\n    @Override\n    public void onCreate(Bundle\
  \ savedInstanceState) {\n        super.onCreate(savedInstanceState);\n        setContentView(R.layout.main);\n\
  \        button = ((Button) findViewById(R.id.button1));\n        button.setOnClickListener(this);\n\
  \    }\n    @Override\n    public void onClick(View arg0) {\n        button.setBackgroundColor(android.graphics.Color.GRAY);\n\
  \    }\n}\n```\n\n早早的章节以一个问题开头：“在 `onClick` 方法中，代码是如何知道 `button` 代表什么呢？”在本节中，这个问题消失了，就像我站起来时腿离开了一样。\n\
  \n在列表 4-4 中，按钮和 `onClick` 方法都是活动内部的成员。因此，`onClick` 方法可以自由自在地访问按钮。你不需要像列表 4-4 那样的\
  \ `Activity` 字段，也不需要从 `Activity` 到 `MyActivity` 的任何复杂的类型转换。\n\n你必须提醒 Android `MyActivity`\
  \ 包含一个 `onClick` 方法；你通过在 `MyActivity` 的声明中添加 `implements OnClickListener` 来做到。你还必须提醒\
  \ Android 在每当按钮被点击时通知当前的 `MyActivity` 对象。你通过编写代码来实现这种提醒：\n\n```java\nbutton.setOnClickListener(this);\n\
  ```\n\n大概来说，这翻译为“嘿，Android！当有人点击按钮时，调用 `MyActivity` 内部的 `onClick` 方法。”\n\n### 必须（以及不能）被扩展的类\n\
  \n如果你读了上一节，接着读这一节，你可能会想给我发一封恶毒的邮件。上一节描述了一种诚然复杂的方法，让监听器记住要调整哪个活的按钮。了解列表 4-3 的工作原理是重要的，但如果你修改列表\
  \ 4-3 使活动成为它自己的监听器，事情就会变得简单得多。列表 4-4 向你展示了如何这样做。\n\n\n\n\n\n作为一名开发者，你无法从抽象类创建对象。如果你写成\n\
  \n```java\nViewGroup group = new ViewGroup();\n```\n\nJava 会提示你这种行为是不规范的。为了对 `ViewGroup`\
  \ 类进行某些有用操作，你需要 `ViewGroup` 类的子类。该子类包含了 `ViewGroup` 类中每个抽象方法的具体实现版本：\n\n```java\n\
  package com.allmycode.samples;\n\nimport android.content.Context;\nimport android.view.ViewGroup;\n\
  \npublic class MyLayout extends ViewGroup {\n    public MyLayout(Context context)\
  \ {\n        super(context);\n    }\n    @Override\n    protected void onLayout(boolean\
  \ changed, int l, int t, int r, int b) {\n    }\n}\n```\n\n## 内部类\n\n这里有一个大新闻！你可以在另一个类内部定义类！大多数类并不存在于另一个类内部，而且大多数类也不包含其他类。但当一个类的背后的想法非常切地想要成为另一个类的一部分时，请尽管在类内部创建一个类。\n\
  \n### 具命名的内部类\n\n对于用户来说，列表 4-6 的行为与列表 4-3 和 4-4 相同。但在列表 4-6 中，`MyActivity` 类包含了了自己的\
  \ `MyListener` 类。\n\n列表 4-6：类内部的类\n\n```java\npackage com.allmycode.samples;\n\n\
  import android.app.Activity;\nimport android.os.Bundle;\nimport android.view.View;\n\
  import android.view.View.OnClickListener;\nimport android.widget.Button;\n\npublic\
  \ class MyActivity extends Activity {\n    Button button;\n    @Override\n    public\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.main);\n        button = ((Button) findViewById(R.id.button1));\n\
  \        button.setOnClickListener(new MyListener());\n    }\n    class MyListener\
  \ implements OnClickListener {\n        @Override\n        public void onClick(View\
  \ arg0) {\n            button.setBackgroundColor(android.graphics.Color.GRAY);\n\
  \        }\n    }\n}\n```\n\n列表 4-6 中的 `MyListener` 类是一个内部类。内部类与任何其他类非常相似。但在内部类的代码中，你可以引用外部类的字段。例如，`MyListener`\
  \ 内部的 `onClick` 方法使用了 `button`，而 `button` 是定义在外部类 `MyActivity` 中的。\n\n列表 4-4 和 4-6\
  \ 非常相似。在两个列表中，你都避开了本章前面“对象记得是谁创建了它”节中描述的复杂性。对于本章的示例，选择列表 4-4 还是列表 4-6 大程度上取决于个人喜好。\n\
  \n### 匿名内部类\n\n注意，列表 4-6 中的代码只使用了一次 `MyListener` 类。（唯一的使用是在调用 `button.setOnClickListener`\
  \ 时。）所以我问你，对于一个只使用一次的东西，你真的需要它有一个名字吗？不需要。你可以在 `button.setOnClickListener` 的调用中替换整个内部类的定义。当你这样做时，你就拥有了一个匿名内部类。列表\
  \ 4-7 将为你展示它是如何工作的。\n\n列表 4-7：没有名的类（在有名的类内部）\n\n```java\npackage com.allmycode.samples;\n\
  \nimport android.app.Activity;\nimport android.os.Bundle;\nimport android.view.View;\n\
  import android.view.View.OnClickListener;\nimport android.widget.Button;\n\npublic\
  \ class MyActivity extends Activity {\n    Button button;\n    @Override\n    public\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.main);\n        button = ((Button) findViewById(R.id.button1));\n\
  \        button.setOnClickListener(new MyListener() {\n            @Override\n \
  \           public void onClick(View arg0) {\n                button.setBackgroundColor(android.graphics.Color.GRAY);\n\
  \            }\n        });\n    }\n}\n```\n\n\n\n\n-   XML 文件并不只描述外观和布局。事实上，极少有\
  \ XML 文件会描述任何视觉内容。相反，大多数 XML 文件描述的是数据——一份股票交易列表；一个汽车品牌和型号的层级列表；或者贝多芬交响曲中动作、度量值和注释的嵌套列表。\n\
  \n-   某些规则规定了你可以在 HTML 或 XML 文档中写什么、不能写什么。HTML 的规则非常宽松，而 XML 的规则则非常严格。\n\n在 HTML\
  \ 中，缺少一个字符或单词通常不会被察觉。在 XML 中，漏掉一个字符或单词可能会毁掉你一整天的心。\n\nXML 文档各部分的正式定义可能令人望而畏。但你可以将\
  \ XML 文档想象成一组元素，每个元素都有一个或两个标签。\n\n## 标签与元素\n\n标签和元素是 XML 的主体工作。以下是内幕：\n\n-   标签（tag）是某些尖括号包围的文本。\n\
  \n例如，列表 5-1 包含一个基本的 `AndroidManifest.xml` 文件。在这个文件中，`<intent-filter>` 是一个标签，`</intent-filter>`（出现在文件稍后的位置）是另一个标签。像\
  \ `<application android:icon=”@drawable/icon” android:label=”@string/app_name”>`\
  \ 这样的文本也是标签。\n\n### 列表 5-1：一个 AndroidManifest.xml 文件\n\n```xml\n<?xml version=”1.0”\
  \ encoding=”utf-8”?>\n<manifest xmlns:android\n  “http://schemas.android.com/apk/res/android”\n\
  \      package=”com.allmycode.andevcon”\n      android:versionCode=”1”\n      android:versionName=”1.0”>\n\
  \  <uses-sdk android:minSdkVersion=”8” />\n  <application android:icon=”@drawable/icon”\n\
  \      android:label=”@string/app_name”>\n      <activity android:name=”.MyActivity”\n\
  \                  android:label=”@string/app_name”>\n          <intent-filter>\n\
  \            <action android:name=\n                  “android.intent.action.MAIN”\
  \ />\n            <category android:name=\n                  “android.intent.category.LAUNCHER”\
  \ />\n          </intent-filter>\n      </activity>\n  </application>\n</manifest>\n\
  ```\n\n并不是所有带有尖括号的内容都算 XML 标签。例如，文本 `<This is my application.>` 违反了许多语法正确的 XML 规则。关于\
  \ XML 标签可以包含和不能包含的内容，请继续阅读下文。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 当 XML 文档的文本遵守所有语法正确的 XML 规则时，它就是良好格式的（well formed）。\n\n-   XML 文档可能有三种不同的标签：\n\
  \n-   起始标签（start tag）以左尖括号和名称开头。起始标签的最后一个字符是右尖括号。\n\n在列表 5-1 中，`<intent-filter>`\
  \ 是一个起始标签。该标签的名称是 `intent-filter`。\n\n### 你可以使用哪些元素名称？\n\n在 HTML 中，标签 `<b>` 和 `</b>`\
  \ 包围着以粗体形式显示的文本。这就是网页的编码方式。\n\n但在 XML 中，像 `<cat>` 和 `</cat>` 这样的标签可能代表一个 Windows\
  \ 安全目录、从电线杆上垂下的链形电线，或者一只爬在你的电脑键盘上的宠物（顺便提一句，当你正在编写《自学者教程：Android 应用开发全书》时）。\n\n###\
  \ 你如何知道 XML 文档中的名称是有意义的？\n\n简短的答案是：“意义取决于它的用途。”（无论那是什么意思！）只要计算机程序可以执行你意图让程序对该元素的操作，该元素的名称就有意义。例如，一个检查安全目录以区分可靠下载和恶意下载的程序，对于一个类似下面的元素，可能不会做任何有用的事情：\n\
  \n```xml\n<cat name=”Felix” age=”7” breed=”calico” />\n```\n\n另一方面，安全目录程序可能包含处理以下元素的指令：\n\
  \n```xml\n<cat name=”Firefox” verified=”true” publisher=”mozilla.org” version=”7.0.1”\
  \ />\n```\n\nDTD 看起来像这样：\n\n```xml\n<!DOCTYPE root [\n  <!ELEMENT root (cat*)>\n\
  \  <!ELEMENT cat EMPTY>\n  <!ATTLIST cat name CDATA #REQUIRED\n                \
  \        age CDATA\n                        breed CDATA\n                      \
  \  verified CDATA\n                        publisher CDATA\n                   \
  \     version CDATA>\n]>\n```\n（注：原文提供的 DTD 文本是片段化的，此处已根据源文本逻辑进行了重新格式化。）\n\n```xml\n\
  <!ELEMENT root (cat*)>\n<!ELEMENT cat EMPTY\n<!ATTLIST cat name CDATA #REQUIRED\n\
  \                        age CDATA\n                        breed CDATA\n      \
  \                  verified CDATA\n                        publisher CDATA\n   \
  \                     version CDATA>\n```\n\n\n\n\n\n内容是位于起始标签和结束标签之间的部分。例如，在列表\
  \ 5-1 中，`intent-filter` 元素的内容是\n\n```xml\n<action android:name=\"android.intent.action.MAIN\"\
  \ />\n<category android:name=\"android.intent.category.LAUNCHER\" />\n```\n\n一个元素的内容可以包含其他元素。（在本例中，`intent-filter`\
  \ 元素包含一个 `action` 元素和一个 `category` 元素。）\n\n元素的内容还可以包含普通文本。例如，在列表 5-2 中，`resources`\
  \ 元素包含两个 `string` 元素，每个 `string` 元素又包含普通文本。\n\n### 列表 5-2：一个 Android strings.xml\
  \ 文件\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\" standalone=\"no\"?>\n<resources>\n\
  \    <string name=\"hello\">Hello World!</string>\n    <string name=\"app_name\"\
  >AnDevCon App</string>\n</resources>\n```\n\n你甚至可以混合内容。例如，在一个元素的起始标签和结束标签之间，你可以先有一些普通文本，紧跟着是一个或两个元素，然后是更多的普通文本。\n\
  \n- **在某些情况下，两个或多个元素可能具有相同的名称。**\n\n在列表 5-2 中，两个不同的元素名称都是 `string`。要了解更多关于 XML 文件中所使用的名称，请参旁边的侧边栏“你可以使用哪些元素名称？”。\n\
  \n- **元素要么彼此嵌套内部，要么完全不重叠。**\n\n在列表 5-1 中，`manifest` 元素包含一个 `uses-sdk` 元素和一个 `application`\
  \ 元素。`application` 元素包含一个 `activity` 元素，该元素又包含一个 `intent-filter` 元素，以此此类推。\n\n```xml\n\
  <manifest>\n    这段代码演示了元素嵌套。\n    这段代码并不是一个真实的 AndroidManifest.xml 文件\n    <uses-sdk\
  \ />\n    <application>\n        <activity>\n            <intent-filter>\n     \
  \           <action />\n                <category />\n            </intent-filter>\n\
  \        </activity>\n    </application>\n</manifest>\n```\n\n在列表 5-1（以及此项目符号内部的虚假列表）中，`uses-sdk`\
  \ 和 `application` 元素完全不重叠。`action` 和 `category` 元素完全不重叠。但每当一个元素与另一个重叠时，其中一个元素会被完全嵌套在另一个内部。\n\
  \n例如，在列表 5-1 中，`intent-filter` 元素完全嵌套在 `activity` 元素内部。下面这种重叠且未嵌套的标签序列是非法的：\n\n\
  ```xml\n<activity>\n    <intent-filter>\n        这不是良好的 XML 代码。\n</activity>\n</intent-filter>\n\
  ```\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 在本章开头，我提到规定 HTML 的规则并不像规定\
  \ XML 的规则那样严格。在 HTML 中，你可以创建非嵌套的、重叠的标签。例如，`<b>Use <i>irregular</b> fonts</i> sparingly`\
  \ 在你的网络浏览器中显示为\n\n**Use *irregular fonts** sparingly**\n\n其中“Use irregular”为粗体，“irregular\
  \ fonts”为斜体。\n\n![tip.eps](img/tip_fmt.jpeg)Microsoft Internet Explorer 是一个不错的 XML\
  \ 查看器。当你用 Internet Explorer 访问 XML 文档时，你会看到彩色的、缩进良好的 XML 代码显示。代码中的元素可以根据你的命令展开和折叠。如果你访问一个格式不正确的\
  \ XML 文档（例如，一个带有重叠、非嵌套标签的文档），Internet Explorer 会显示一个空白页面。（这是好事。Internet Explorer\
  \ 提醒你你搞砸了。）\n\n- **每个 XML 文档包含一个元素，所有其他元素都嵌套在其中。**\n\n在列表 5-1 中，`manifest` 元素包含了所有其他元素。这很好。下面的大纲将无法构成合法的\
  \ XML 文档：\n\n```xml\n<manifest>\n    <uses-sdk />\n    <application>\n    </application>\n\
  \    这不是良好的 XML 文档，\n    因为另一个元素出现在了\n    下面的 manifest 结束标签之后：\n</manifest>\n\n\
  <manifest>\n    <uses-sdk />\n    <application>\n    </application>\n</manifest>\n\
  ```\n\n在 XML 文档中，封装所有其他元素的单个元素是根元素。\n\n- **起始标签和结束标签可以包含属性。**\n\n属性是一个键值对。每个属性的形式为\
  \ `name=\"value\"`。值周围的引号是必须的。\n\n在列表 5-1 中，起始标签和空元素标签包含许多属性。例如，在 `manifest` 起始标签中，`xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"` 是一个属性。在同一个标签中，`package=\"com.allmycode.andevcon\"\
  ` 是一个属性。总之，`manifest` 起始标签有四个属性。在列表 5-1 后面，空元素 `uses-sdk` 标签有一个属性。\n\n### 你在 XML\
  \ 中发现的其他内容\n\n生活不仅仅有标签。\n\n- **XML 文档以 XML 声明开始。**\n\n列表 5-1 中的声明是 `<?xml version=\"\
  1.0\" encoding=\"utf-8\"?>`。\n\n问号将声明与普通标签区分开来。此声明宣布文档使用了 `1.0` 规范，并且用于存储文档的字符串应被解释为\
  \ `UTF-8`。在实践中，你很少需要动文档。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) XML\
  \ 声明中的 `version=\"1.0\"` 部分看起来可能过时，但 XML 自 1998 年以来并没有很大变化。事实上，唯一的更新版本是 `1.1`，开发者很少使用。\n\
  \n- **XML 文档可以包含注释。**\n\n注释以 `<!--` 开始，以 `-->` 结束。例如，以下行\n\n```xml\n<!-- 此应用程序必须经过仔细测试。\
  \ -->\n```\n\n构成了一个 XML 注释。文档注释可以出现在标签之间（以及其他不值得关注的地方）。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 注释通常是给人类阅读的。但输入 XML 文档的程序可以读取注释并对其进行操作。Android 通常不对其 XML 文件中的注释做任何处理，但你永远不知道。\n\
  \n- **XML 文档可以包含处理指令。**\n\n处理指令看起来非常像文档的 XML 声明。这里有一个处理指令的示例：\n\n```xml\n<?chapter\
  \ number=\"x\" Put chapter here ?>\n```\n\n文档可以有很多处理指令，这些处理指令可以出现在标签之间（以及其他几处地方）。但在实践中，大多数\
  \ XML 文档没有处理指令。（由于即使是技术图标也难以解释的原因，文档的 XML 声明并不是处理指令。）\n\n和文档的 XML 声明一样，每个处理指令都以\
  \ `<?` 开始，以 `?>` 结束。每个处理指令都有一个名称。但在处理指令名称之后，任何内容都可以。此项目符号开头的处理指令名称为 `chapter`，后面跟着一些自由文本。\n\
  \n![remember.eps](img/remember_fmt.jpeg) 你可以在处理指令中放入几乎任何内容。大多数输入 XML 文档的软件将直接忽略该处理指令。（作为一个实验，我将我的章节处理指令添加到了列表\
  \ 5-1 的文件中。这对我 Android 应用的运行产生没有任何影响。）\n\n\n\n\n那么，处理指令到底有什么用呢？嗯，如果你偶然遇到了一个，我不希望你把它误认为是某种\
  \ XML 声明。此外，某些程序可能会读取特定的处理指令并从这些指令中获取特定的信息。\n\n例如，样式表（style sheet）是一个描述 XML 文档中信息的外和布局的文件。通常，XML\
  \ 文档和相应的样式表位于两个不同的文件中。为了指示 `pets.xml` 文档中的信息应该使用 `animals.css` 样式表中的规则显示，你需要在 `pets.xml`\
  \ 文档中添加以下处理指令：\n\n```xml\n<?xml-stylesheet href=”animals.css” type=”text/css”?>\n\
  ```\n\n-   XML 文档可能包含实体引用。\n\n我在 Android 的官方示例应用程序中翻找，发现了以下元素（分布在不同的程序中）：\n\n```xml\n\
  <Key android:codes=”60” android:keyLabel=\"``&lt;``”/>\n<Key android:codes=”62”\
  \ android:keyLabel=\"``&gt;``”/>\n<Key android:codes=”34” android:keyLabel=\"``&quot;``”/>\n\
  <string name=”activity_save_restore”>\nApp/Activity/Save &amp; Restore State\n</string>\n\
  ```\n\n第一个元素包含对 `&lt;` 实体的引用。你不能在 XML 文档的任何地方使用真实的角括号。角括号标志着 XML 标签的开始。因此，如果你想表达\
  \ `three-brackets` 这个名字代表字符串 `“<<<”`，你不能写成：\n\n```xml\n<string name=”three-brackets”><<<</string>\n\
  ```\n\n额外的括号会混淆任何期望遇到普通 XML 标签的程序。\n\n因此，为了绕过 XML 对角括号的特殊用法，XML 规范包含了实体 `&lt;` 和\
  \ `&gt;`。第一个 `&lt;` 代表左角括号。第二个 `&gt;` 代表右角括号。所以，为了表达 `three-brackets` 这个名字代表字符串\
  \ `“<<<”`，你应该写成：\n\n```xml\n<string name=”three-brackets”>&lt;&lt;&lt;</string>\n\
  ```\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 在实体 `&lt;` 中，字母 `lt` 代表“less\
  \ than（小于）”。毕竟，左角括号看起来就像数学学中的“小于”符号。同样，在实体 `&gt;` 中，字母 `gt` 代表“greater than（大于）”。\n\
  \n## 命名空间包含什么？\n\nXML 的第一个正式定义是由万维网联盟（W3C）于 1998 年发布的。这个标准标准忽略了一个棘手的问题：如果两个 XML\
  \ 文档具有相同名称的元素或属性，且这些名称在两个文档中具有不同的含义，你如何可能合并这两个文档呢？\n\n这是一个简单的 XML 文档：\n\n```xml\n\
  <?xml version=”1.0” encoding=”utf-8”?>\n<banks>\n    <bank>First National Bank</bank>\n\
  \    <bank>Second Regional Bank</bank>\n    <bank>United Trustworthy Trusty Trust</bank>\n\
  \    <bank>Federal Bank of Fredonia (Groucho Branch)</bank>\n</banks>\n```\n\n这里是另一个\
  \ XML 文档：\n\n```xml\n<?xml version=”1.0” encoding=”utf-8”?>\n<banks>\n    <bank>Banks\
  \ of the Mississippi River</bank>\n    <bank>La Rive Gauche</bank>\n    <bank>La\
  \ Rive Droite</bank>\n    <bank>The Banks of Plum Creek</bank>\n</banks>\n```\n\n\
  一个拥有似乎无限资源的组织旨在收集并合并来自互联网各处的知识。该组织的软件找到 XML 文档并将它们合并成一个全能的超级文档。（想象一个自动版本的维基百科。）\n\
  \n当你把关于金融机构的文档与关于河流的文档合并时，你会得到一些令人困惑的结果。如果 First National 和 Banks of Plum Creek\
  \ 都位于同一个的 `bank` 元素中，分析该文档可能需要先验知识。换句话说，如果你已经不知道某些银行贷款，而另一些银行在风暴期间会泛滥，你可能会得出一些奇怪的结论。遗憾的是，计算机程序本身并什么也不知道。（当你遇到一个描述路易斯安州斯耶夫特尔红河银行的\
  \ XML 元素时，情况会变得非常复杂。这家河银行在斯耶夫特尔、亚历山大等城镇都有自动取款机。）\n\n为了缓解这种局面，XML 标准委员会的成员创建了 XML\
  \ 命名空间。命名空间是你附加到名称上的前缀。你用冒号 (`:`) 将命名空间与名称分开。例如，在列表 5-1 中，几乎每个属性名称都以 `android` 前缀开头。列表的属性包括\
  \ `android:versionCode`、`android:versionName`、`android:minSdkVersion`、`android:icon`\
  \ 等。\n\n因此，为了合并关于贷款银行和河岸银行的文档，你在列表 5-3 中创建了 XML 文档。\n\n### 列表 5-3：带有两个命名空间的文档\n\n\
  ```xml\n<?xml version=”1.0” encoding=”utf-8”?>\n<banks xmlns:money=\"http://schemas.allmycode.com/money\"\
  \ xmlns:river=\"http://schemas.allmycode.com/river\">\n    <money:bank>First National\
  \ Bank</money:bank>\n    <money:bank>Second Regional Bank</money:bank>\n    <money:bank>United\
  \ Trustworthy Trusty Trust</money:bank>\n    <money:bank>Federal Bank of Fredonia\
  \ (Groucho Branch)</money:bank>\n    <river:bank>Banks of the Mississippi River</river:bank>\n\
  \    <river:bank>La Rive Gauche</river:bank>\n    <river:bank>La Rive Droite</river:bank>\n\
  \    <river:bank>The Banks of Plum Creek</river:bank>\n</banks>\n```\n\n\n\n\n符号字符串并不非得是一个\
  \ URL。相反，它可以是一个 URI —— 即通用资源标识符（Universal Resource Identifier）。URI 看起来像 URL，但 URI\
  \ 并不一定指向实际的网络位置。URI 仅仅是一个名称，一串“充斥着喧哗和愤怒”且可能“毫无意义”的字符。一些 XML 开发者为他们的每个 URI 创建了相应的网页。这些网页包含了对\
  \ XML 文档中所用名称的有用描述。\n\n但大多数用于 XML 命名空间的 URI 并不指向任何地方。例如，列表 5-1 中的 URI `http://schemas.android.com/apk/res/android`\
  \ 几乎出现在每个 Android XML 文档中。如果你将该 URI 输入到你常用的 Web 浏览器地址栏，你会得到熟悉的`无法显示网页`或`找不到服务器`的消息。\n\
  \n![remember.eps](img/remember_fmt.jpeg) 未绑定前缀消息（unbound prefix message）表示你没有将 XML\
  \ 文档中找到的命名空间与 URI 关联。某些非常旧的软件（不支持命名空间的软件）不会捕获此类错误，但大多数现代软件都能捕获。\n\n### package 属性\n\
  \n在列表 5-1 中，属性名称 `package` 没有前缀。所以你可能会说：“见鬼！为了保险起见，我把属性名称改为 `android:package` 。”但这种更改产生了一些错误信息。其中一条信息显示\
  \ `<manifest> does not have a package attribute.` 这是发生了什么？\n\n在 `AndroidManifest.xml`\
  \ 文件中，`package` 属性与 Java 的关系大于 Android。（`package` 属性指向包含应用程序 Java 代码的 Java 包。）因此，Android\
  \ 的开发者决定不让这个 `package` 属性成为 `android` 命名空间的一部分。开发者在某些 Android SDK 文件中硬编码了 `android`\
  \ 命名空间的单词（如 `android:versionCode` 和 `android:versionName`）。\n\n当你创建一个 `AndroidManifest.xml`\
  \ 文件时，Eclipse 会立即开始构建项目的部分内容。Android 软件会将 `AndroidManifest.xml` 文件中的名称与 `android`\
  \ 命名空间中的单词进行比较。一旦 Android 软件遇到恶性的 `android:package`（`android` 前缀后跟非 android 名称），软件就会拉响警报。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 从 Cupcake 版本开始，每个 Android 平台在你下载\
  \ Android SDK 时获得的文件中都有名为 `public.xml` 的文件。如果你用文本编辑器打开 `public.xml` 文件，你会看到 `android`\
  \ 命名空间中的名称列表。\n\n### style 属性\n\n`style` 和 `package` 同样遵循不是 `android` 名称的规则。样式（style）是一组描述移动设备屏幕上某元素外观的项（或属性）。样式的\
  \ XML 文档可能包含 Android 特有的名称，但样式本身仅仅是一组项，其本身并不是 Android 属性。\n\n为了了解它是如何运作的，想象创建一个非常简单的应用。描述应用基础布局的\
  \ XML 文件可能像列表 5-4 中的代码。\n\n列表 5-4：使用 style 属性\n\n```xml\n<?xml version=”1.0” encoding=”utf-8”?>\n\
  <LinearLayout xmlns:android=`\n  “http://schemas.android.com/apk/res/android”\n\
  \    android:orientation=”vertical”\n    android:layout_width=”fill_parent”\n  \
  \  android:layout_height=”fill_parent”\n  >\n<TextView  \n    android:layout_width=”fill_parent”\n\
  \    android:layout_height=”wrap_content”\n    android:text=”@string/callmom”\n\
  \    style=”@style/bigmono”\n    />\n</LinearLayout>\n```\n\n在列表 5-4 中，除 `style`（以及\
  \ `android` 名称本身）外，所有属性名称都在 `android` 命名空间中。值 `“@style/bigmono”` 指向你应用 `res/values`\
  \ 文件夹中的一个 XML 文件。列表 5-5 包含一个名为 `styles.xml` 的简单文件。\n\n列表 5-5：带有样式的文件\n\n```xml\n\
  <?xml version=”1.0” encoding=”utf-8”?>\n<resources>\n    <style name=”bigmono”>\n\
  \      <item name=”android:textSize”>50dip</item>\n      <item name=”android:typeface”>monospace</item>\n\
  \    </style>\n</resources>\n```\n\n再次注意 `android` 命名空间内部外的单词的混合。`android:textSize`\
  \ 和 `android:typeface` 单词在 `android` 命名空间中，而列表 5-5 中的其他单词则不在。\n\n列表 5-5 中的样式指定了字体大小为巨大的\
  \ 50 设备无关像素（dip），并且字体类型为等宽（传统打字机）字体。当 Android 将列表 5-5 中的样式应用到列表 5-4 的布局时。\n\n\n\n\
  \n\n`android.app.Activity` 类的代码是一个完整的官方定义，描述了 activity 是什么，以及 activity 不是什么。但从应用设计者的角度来看，没有任何关于\
  \ activity 的正式定义能描绘全貌。因此，也许描述 activity 的方式应该是行为性的。以下是我的非正式描述：\n\n在应用运行期间的某个时刻，应用设计师用内容填满了屏幕。此时，设计师在想：“我必须把这些东西都移开，让用户能够合理地处理当前变得最重要的事情。”于是，设计师创建了一个新的屏幕布局，编写了布局的行为，并将整个业务逻辑（布局及其行为）称为一个新的\
  \ activity。\n\n在那个（较新的）时刻，设计师拥有了两个不同的 activity——一个是填满屏幕内容的原始 activity，另一个处理当前最重要事项的新\
  \ activity。在较小的设备上（或运行比 Honeycomb 更早版本的设备上），每个 activity 都会占据整个屏幕。原始 activity 调用了新\
  \ activity，然后新 activity 会覆盖原始 activity。\n\n在正常情况下，这两个 activity 形成了一个栈的一部分——一种后进先出的结构。想象一下\
  \ `Activity A` 调用了 `Activity B`，而 `Activity B` 又调用了 `Activity C`。那么活动 `A`、`B` 和\
  \ `C` 就形成了一个栈，`Activity C` 位于栈顶（对用户可见）。当用户按下返回键时，`Activity C` 从栈中弹出，显示出 `Activity\
  \ B`。当用户再次按下返回键时，`Activity B` 从栈中弹出，显示出 `Activity A`。\n\nAndroid activity 栈被称为任务（task）。现在你有了应用（apps）、activity\
  \ 和任务。遗憾的是，这些词对于 Android 开发人员的含义与世界上其他地方的含义不同。\n\n应用程序（Application）是实现特定用户目标的各种项集合。属于应用的某些项就是\
  \ activity。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg) 应用的其他项是服务（services）、广播接收器（broadcast\
  \ receivers）和内容提供者（content providers）。我在本书的第 3、4 和 5 章中介绍了这些内容。\n\n## 应用与进程\n\n\
  典型的操作系统（包括 Android）拥有用户、进程和线程。\n\n![check.png](img/check.png) 每个登录系统的每个人都是一个用户。但系统也可能创建虚拟用户——操作系统将其视为独立的用户，但它们并不对应使用键盘的人。\n\
  \n对于非真实人类的用户，系统可以为访问资源创建专门的路径。例如，数据库可能是唯一有权访问某些数据的“用户”。真实的人类用户间接获取数据。人类用户登录数据库并请求代表其获取数据。\n\
  \n系统上的每个用户（由真实人类或虚拟用户进行的会话）都有一个用户标识符（`UID`）。\n\n在本书的大部分内容中，我触摸设备屏幕的人称为“用户”。我并不太担心虚拟用户。\n\
  \n![check.png](img/check.png) 操作系统将其工作划分为多个进程。\n\n每个进程都有自己的内存空间，与其他进程的空间相互独立。进程之间仅通过通过狭窄的、受严格监管的路径进行交互。\n\
  \n系统调度进程的运行。为了做到这一点，系统会在一个进程中执行一系列语句，然后是在另一个进程中执行一系列语句，接着在第三个进程中执行一系列，最后返回到第一个进程上次停止的地方。\n\
  \n每个进程都有一个进程标识符（`PID`）。\n\n![check.png](img/check.png) 进程可以将其工作划分为线程。\n\n操作系统以交替的方式调度线程。在这方面，线程非常像进程。但单个进程的线程共享该进程的内存空间。因此，单个进程的线程可以相互自由通信。\n\
  \n在 Android 中，每个应用都运行在自己的进程中，并拥有自己的 `PID` 和 `UID`。（应用不会在运行与运行之间保留其 `PID` 或 `UID`。操作系统在运行开始时分配这些数字，并在运行结束时将其丢弃。系统会为应用的下次运行分配新数字。）\n\
  \n随着新进程的创建，Android 会增量分配 `PID`。因此，当你的应用开始运行时，它的 `PID` 可能是 `1900`。稍后，你的设备可能内存不足。Android\
  \ 可能会注意到，短期内不需要你应用的任何组件（例如，设备正在显示另一个应用的 activity，而你的应用不包含任何长时间运行的服务）。为了节省空间，Android\
  \ 可能会杀掉你的应用进程。砰！进程消失了。\n\n当然，用户对这个“暗杀”过程一无所知。（我指的是人类用户，而不是系统想象中的某种虚拟幻影。）用户只是通过调用另一个\
  \ activity、按下 Home 键、接听电话或其他方式离开了你的应用活动。因此，在某个时刻，用户说：“嘿，等一下！我想回到几分钟前正在做的事情。”用户导航回到你进程的某一个\
  \ activity。于是 Android（作为一个聪明的操作系统）启动一个新进程来运行你的应用，重新创建你的应用在被“杀掉”之前的 activity，并显示该\
  \ activity 仿佛没有发生过任何异常一样。现在你的应用有了新的 `PID`（可能是 `1921`），因为 Android 在你的应用被杀掉到它重生之间创建了几个其他进程。\n\
  \n每个应用运行在自己的进程中，并拥有自己的用户 ID。这是 Android 的优势之一。独立的进程不共享任何内存。应用程序之间的通信路径是狭窄定义的（严格监管的）。如果应用程序做了错误（无论是恶意的还是无意的），对系统的影响是有限的。作为开发者，你在应用的\
  \ `AndroidManifest.xml` 文件中使用 `<application>` 元素来创建应用。\n\nactivity 可以（且经常）调用属于其他应用的\
  \ activity（例如，封邮件中可能包含一个链接。因此邮件应用的 activity 可能会调用浏览器应用的 activity）。这意味着一个特定的任务可能包含来自多个应用的活动。（参见图\
  \ 1-1。）\n\n**图 1-1:** 活动、应用和任务。\n\n![9781110277707-fg030101.eps](img/9781110277707-fg030101_fmt.jpeg)\n\
  \n场景通常是这样工作的：\n\n1. 用户启动一个应用。（称之为 Application 1。）\n\nAndroid 为该应用创建一个新进程，创建应用主活动的实例，并将主活动放入一个全新的任务栈中。（称之为\
  \ Task 1。）\n\n2. 从应用的主活动，用户调用了另一个活动（例如，属于同一应用的辅助活动）。\n\nAndroid 创建了辅助活动的新实例。Android\
  \ 将辅助活动推入任务栈。（参见图 1-2。）设备的屏幕只显示辅助活动。（想象应用的主活动被隐藏在辅助活动之之下。将主活动称为 Activity 1；将辅助活动称为\
  \ Activity 2。）\n\n**图 1-2:** 用户启动 Activity 1 和 2。\n\n![9781110277707-fg030102.eps](img/9781110277707-fg030102_fmt.jpeg)\n\
  \n3. 用户按下 Home 键。\n\nAndroid 将 Task 1 移出屏幕并显示主屏幕，如图 1-3 所示。\n\n4. 用户启动第二个应用。（我们称之为\
  \ Application 2 好吗？）\n\n在 Task 1 仍在等待的情况下，Android 为第二个应用创建了第二个任务（Task 2），包含第二个应用的主活动。\n\
  \n5. 用户再次按下 Home 键并点击 Application 1 的图标。\n\n\n\n\n\n参见图 1-4。Android 显示了 `Task 1`\
  \ 栈的顶部。`Activity 2` 仍然位于 `Task 1` 的顶部。因此，用户看到了 `Activity 2`。幸运的是，`Activity 2` 的状态与用户首次按下\
  \ Home 键时的状态相同。任何文本字段仍然保留了用户之前输入的文本，以此此类推。\n\n6. 用户按下 `Back` 按钮。\n\nAndroid 从 `Task\
  \ 1` 栈中弹出 `Activity 2` 并销毁该 `Activity 2` 实例。用户看到了 `Activity 1`，它的状态与 Android 用 `Activity\
  \ 2` 覆盖 `Activity 1` 之前的状态相同。\n\n7. 从 `Activity 1` 开始，用户再次调用属于 `Application 1` 的次级活动（secondary\
  \ activity）。\n\nAndroid 创建了该次级活动的全新实例。Android 将该活动推入任务栈中。设备屏幕仅显示该活动。这个新实例的状态与 `Activity\
  \ 2` 被销毁时的状态不同。该新实例用新值初始化（这对于新对象来说是正常的）。\n\n**图 1-3：** 调用 Application 2 后，用户返回了主页。\n\
  \n![9781118027707-fg030103.eps](img/9781118027707-fg030103_fmt.jpeg)\n\n**图 1-4：**\
  \ 用户关闭了 `Activity 2` 然后再次调用了 `Activity 2`。\n\n![9781118027707-fg030104.eps](img/9781118027707-fg030104_fmt.jpeg)\n\
  \n![cross-reference.eps](img/cross-reference_fmt.jpeg) 这些步骤中的场景会有许多变体。首先，用户并不一定按照步骤描述的顺序点击按钮和图标。此外，开发者可以更改活动堆叠到任务中的方式（参见本小型型书的第\
  \ 2 章）。从 Honeycomb 版本开始，Android 有了碎片（fragments），它们类似于活动但仅占据平板设备屏幕的一部分。（参见小型型书 IV\
  \ 的第 4 章）。\n\n## 声明你的意图\n\nAndroid 编程模型基于对稀缺资源的使用。与桌面电脑或笔记本电脑相比，智能手机屏幕较小、内存有限且处理器性能较弱。考虑到这一点，Android\
  \ 的原始创建者专注于资源重用。\n\n假设我的应用包含一个指向我个人网站的链接。当用户点击链接时，Android 会打开网络浏览器。但 Android 打开的是哪个浏览器呢？Android\
  \ 自带了一个浏览器（基于 Apple 的 WebKit 引擎）。但用户可能还安装了 Android 版 Firefox、Opera Mini 或任何其他浏览器。\n\
  \n在 Microsoft Windows 中，浏览器的选择取决于文件扩展名和协议关联。但在 Android 中，开发者通过发出意（intent）来调用浏览器。\n\
  \n在 Android 开发中，意图就像一个开放式的方法调用。与其编写如下代码：\n\n```java\nfirefox(“http://www.google.com”);\n\
  ```\n\n或者\n\n```java\nandroid_built_in_browser(“http://android.allmycode.com”);\n\
  ```\n\n而是编写以下代码：\n\n```java\nString url = “http://android.allmycode.com”;\nIntent\
  \ intent = new Intent(Intent.ACTION_VIEW);\nintent.setData(Uri.parse(url));\nstartActivity(intent);\n\
  ```\n\n在这个示例中，调用 `startActivity(intent)` 就像向空中扔出一个代表“我想浏览”的球，并期望另一个应用的活动接住它。另一个应用通过在应用的\
  \ `AndroidManifest.xml` 文件中放置以下类型的元素来宣布其接住“我想浏览”球的意图：\n\n```xml\n<activity android:name=”.Catcher”\n\
  \         android:label=”Catcher\">\n  <intent-filter>\n    <action android:name=”android.intent.action.VIEW”\
  \ />\n    <category android:name=”android.intent.category.DEFAULT” />\n    <category\
  \ android:name=”android.intent.category.BROWSABLE” />\n    <data android:scheme=”http”\
  \ />\n  </intent-filter>\n</activity>\n```\n\n再次，我引用 Android 官方文档：\n\n“意（intent）是对要执行的操作的抽象描述。它可以配合\
  \ startActivity 来启动一个 Activity……。Intent 为在不同应用程序中的代码之间执行延迟运行时绑定提供了便利。它最重要的用途是启动活动，此时它可以被认为是活动之间的胶水。它本质上是一个被动的数据结构，保存着要执行的操作的抽象描述。”\n\
  \n事实上，Android 有两种类型的意——隐式意（implicit intents）和显式意（explicit intents）。\n\n- 我在前面的段落中描述的那种意（启动任何自称网络浏览器的活动）是隐式意。隐式意并不要求启动特定的活动。相反，隐式意指定了要执行的操作，以及完成该意所需的其他信息。\n\
  \n### 意图\n\n```java\nIntent intent = new Intent(Intent.ACTION_VIEW);\nintent.setData(Uri.parse(url));\n\
  ```\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg) 是一个隐式意。\n\n- 显式意实际上指明了要启动的活动实例名称。显式意\n\
  \n要使用显式意，你可以编写类似列表 1-1 的代码。\n\n### 列表 1-1：使用显式意调用应用活动\n\n```java\npackage my.pack;\n\
  import android.app.Activity;\nimport android.os.Bundle;\npublic class SomeActivity\
  \ extends Activity {\n  // ... code of some sort ...\n  Intent intent = new Intent();\n\
  \  intent.setClassName(“my.pack”, “OtherActivity”);\n  startActivity(intent);\n\
  }\n```\n\n列表 1-1 中，`setClassName` 方法接收两个 `String` 参数。第一个参数是目标所在的包名，第二个参数是活动的全限定名。因此在列表\
  \ 1-1 中，`setClassName` 使用了 `my.pack`。\n\n要调用另一个应用的活动，你可以编写类似列表 1-2 代码。\n\n### 列表\
  \ 1-2：使用显式意调用另一个应用的活动\n\n```java\npackage my.pack;\nimport android.app.Activity;\n\
  import android.os.Bundle;\npublic class SomeActivity extends Activity {\n  // ...\
  \ code of some sort ...\n  Intent intent = new Intent();\n  intent.setClassName(“other.pack”,\
  \ “OtherAppActivity”);\n  startActivity(intent);\n}\n```\n\n列表 1-2 几乎与列表 1-1 完全一样。不同在于\
  \ 1-2 中的两个活动（调用者和被调用者）属于不同的应用程序。不同的应用程序意味着不同的包。因此列表 1-1 使用的是 `my.pack`，而列表 1-2 使用的是\
  \ `other.pack`。\n\n![remember.eps](img/remember_fmt.jpeg)对于应用程序中的每个活动，你必须在 `AndroidManifest.xml`\
  \ 文件中添加 `<activity>` 元素。如果一个项目的活动调用另一个项目的活动，你必须让 Eclipse 感知这两个项目之间的连接。在 Package\
  \ Explorer 中，选择包含 `startActivity` 调用的项目。选择 Project⇒Properties。在生成的属性对话框中，选择 Java\
  \ Build Path⇒Projects。添加目标项目并点击 OK。未执行这些操作会导致运行时出现 `Cannot Find Activity` 消息。\n\n\
  ### 使用上下文\n\n启动特定活动的另一种方法是使用上下文。在列表 1-3 中，活动调用同一个应用程序内的另一个活动。\n\n\n\n\n\n```java\n\
  \  new Intent(this, OtherActivity.class);\n  startActivity(intent);\n}\n```\n\n\
  在列表 1-3 中，最后两句语句的意思是：“使用 `this` 活动自身的上下文（context），启动运行 `OtherActivity` 的实例。”（如果一切顺利，`OtherActivity`\
  \ 类将继承自 Android 的 `Activity` 类，那么你就可以正常运行。）\n\n在列表 1-3 中，`Intent` 类的构造函数接收两个参数——一个上下文（context）和一个\
  \ Java 类。`this` 关键字表示包在外部的 `SomeActivity` 实例。这很好，因为构造函数的第一个参数类型是 `Context`，而 Android\
  \ 的 `Activity` 类是抽象类 `Context` 类的子类。\n\n`Context` 对象是“通往应用程序环境全局信息的接口”。（再次强调，我在引用\
  \ Android 文档的内容。）活动（activity）是一个上下文，因为（除了是 `Context` 的子类之外）活动拥有一堆文件、包名、大量资源、主题、壁纸和其他内容。所有这些内容都可以通过活动的上下文以编程的方式获取。在列表\
  \ 1-3 中，`Intent` 构造函数从 `this` 获取了 `OtherActivity` 的包名——即 `SomeActivity` 对象的上下文。\n\
  \n每个活动都是应用程序的一部分，`Application` 实例也是一个上下文。因此在许多程序中，你可以使用以下方法调用（代替 `this`）来获取 `Context`\
  \ 实例：\n\n- `getContext()`\n- `getApplicationContext()`\n- `getBaseContext()`\n\n\
  ![tip.eps](img/tip_fmt.jpeg) `getApplicationContext` 和 `getBaseContext` 方法在 Android\
  \ 程序中具有有限且特定的用途。在本书的示例中，你永远不需要调用 `getApplicationContext` 或 `getBaseContext`。\n\n\
  在列表 1-4 中，来自一个应用的活动使用上下文来调用另一个应用的活动。\n\n### 列表 1-4：使用显式 Intent 和上下文调用另一个应用的活动\n\n\
  ```java\npackage my.pack;\n\nimport android.app.Activity;\nimport android.os.Bundle;\n\
  \npublic class SomeActivity extends Activity {\n  // ... 某些代码属于这里\n  try {\n   \
  \ otherContext =\n      createPackageContext(\"other.pack\",\n      Context.CONTEXT_IGNORE_SECURITY\
  \ |\n      Context.CONTEXT_INCLUDE_CODE);\n  } catch (NameNotFoundException e) {\n\
  \    e.printStackTrace();\n  }\n  Class<?> otherClass = null;\n  try {\n    otherClass\
  \ = otherContext.getClassLoader().\n      loadClass(\"other.pack.OtherAppActivity\"\
  );\n  } catch (ClassNotFoundException e) {\n    e.printStackTrace();\n  }\n  Intent\
  \ intent = new Intent(otherContext, otherClass);\n  startActivity(intent);\n}\n\
  ```\n\n列表 1-4 比列表 1-3 复杂。但大部分复杂性来自于 Java 加载类的方式。无论如何，列表 1-4 都是根据上下文和类名创建一个 intent，然后启动该\
  \ intent 的活动。\n\n# 活动生命周期\n\n“…… 人在一生中扮演许多角色， 他的行为有七个阶段。”\n—— 出自莎士比亚的《亦或喜欢你》\n\n\
  人类的生命周期包括婴儿期、童年、青少年、成年、中年、老年，以及最后的终结。\n\nAndroid 活动也有生命周期。以下是各个阶段：\n\n- **活跃（Active\
  \ 或运行中 Running）**：活动位于设备屏幕前台，处于任务栈的顶端。用户可以与活动进行交互。\n- **停止（Stopped）**：活动位于任务栈中，但活动不可见。可能是该活动不在其栈的顶端，栈上的其他活动覆盖了该活动。或者，活动不可见是因为设备屏幕显示的内容不属于该活动所在的栈的一部分。\n\
  - **暂停（Paused）**：暂停状态是活跃（Active）和停止（Stopped）之间的一种中间状态。正式定义上，如果一个活动位于当前活跃栈上，但被另一个活动部分遮挡（例如透明活动或位于栈顶部的非全屏活动），则该活动处于暂停状态。\n\
  \n在实践中，一个从活跃到停止过渡的活动会经历一段短暂的暂停期，即使用户没有看到“部分被遮挡”的阶段。\n- **销毁（Destroyed）**：多么悲哀！但等一下！销毁并不意味着“永远消失”。Android\
  \ 可能会销毁一个活动，以便用不同的配置复活它。或者在用户没有活跃使用该活动时，Android 可能会暂时覆盖该活动。\n\n## 生命周期周期方法\n\n许多文化都有成年礼。成年礼是你从一个生命阶段过渡到另一个生命阶段时所做的事情。例如，在我的家乡，孩子在过渡到青少年时期时这样做：“你应当站在你所有土地的最高点（通常是法兰克福电车的\
  \ Dauphin Street 站），并在头顶上方挥动三次生鱼。在此期间，你要大喊：‘接下来的几年里我将成为一个麻烦的疯子。’”\n\nAndroid 活动有自己的成年礼，被称为生命周期方法。图\
  \ 1-5 展示了这些方法。与人不同，活动不会预测地从一个阶段移动到下一个阶段。例如，一个典型的活动会在活跃和停止之间来回切换，并穿插着几次暂停。而且在被销毁后，一个活动可以被毫无声息地复活。对于一个活动来说，销毁和重建是正常发展过程的一部分。一个\
  \ Android 活动有五个生命周期方法——即 `onCreate`、`onStart`、`onResume`、`onPause` 和 `onDestroy`。此外，活动还有一些\
  \ `onSomething` 方法（如 `onSaveInstanceState`），它们并不是生命周期正式的一部分，也不保证会被调用。总之，列表 1-5 包含了这些方法。\n\
  \n**图 1-5：** Android 活动的生命、死亡与重生。\n![9781827707-fg03105](img/9781827707-fg03105.jpeg)\n\
  \n### 列表 1-5：为你的活动添加日志\n\n```java\npackage com.allcode.demo;\n\nimport android.app.Activity;\n\
