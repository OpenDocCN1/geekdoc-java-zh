  \ String getType(Uri uri) {\n    return null;\n}\n```\n\n`Listing 5-5` 实现了 `android.content.ContentProvider`\
  \ 类中声明的抽象方法。实现代码与 `Listing 5-1` 中的某些代码具有惊人的相似之处：\n\n- 两个 `onCreate` 方法都使用 `DBHelper`（自\
  \ `SQLiteOpenHelper` 类）来获取可写数据库。\n- 两个列表都调用了数据库的 `insert`、`update` 和 `delete` 方法。\n\
  - 两个列表都向数据库发出查询。\n\n实际上，`Listing 5-1` 使用了 `rawQuery` 方法和 SQL 字符串。相比之下，`Listing 5-5`\
  \ 使用了带有大量参数的 `query` 方法。这种区别与内容提供者无关。底线是：内容提供者对其应用数据的操作，就像普通 activity 对其应用数据所做的一样。\n\
  \n`Listing 5-5` 具有一些我在 `Listing 5-1` 中选择不使用的特性。例如，Android 的 `update` 和 `delete`\
  \ 方法返回 `int` 值。在 `Listing 5-1` 中，我简单地忽略了返回值。但在 `Listing 5-5` 中，我将每个方法的返回值都传给了客户端。（内容提供者的抽象\
  \ `update` 和 `delete` 方法必须有 `int` 返回值。）\n\n`Listing 5-5` 还具有一些内容提供者特有的特性。例如，为了分发数据，内容提供者必须管理\
  \ `URIs`。通常情况下，内容提供者会检查每个方法的传入 `URI`，并利用这些信息决定其操作。在 `Listing 5-5` 中，我通过在 `query`\
  \ 方法中少量的 URI 处理来保持简单。\n\n在 Android 世界之外，使用 `URIs` 连接数据库是十分常见的。例如，在 Java 程序中，你可能使用类似\
  \ `DriverManager.getConnection(\"jdbc:db\")` 的语句来连接数据库。在这个语句的不透明 URI 中，方案 `jdbc:`\
  \ 将请求转发到另一个方案——即 `db: ` 方案。\n\n在 `Listing 5-5` 中，`query` 方法调用了 `UriMatcher` 实例来区分不同的路径。正如它在\
  \ `Listing 5-5` 开头定义的，`UriMatcher` 实例为 `names_amounts` 路径返回 `1`，为 `silly_stuff`\
  \ 路径返回 `2`。返回 `1` 会让 `query` 方法执行常规数据库查询。但返回 `2` 则会执行不同的操作。为了证明我可以这样做，我对 `URI` 的\
  \ `silly_stuff` 路径做出响应，而没有咨询真实的数据库。相反，我使用数组伪造了一个看起来像 `simpletable` 行的内容。我将数组压缩进\
  \ `MatrixCursor`（一种从数组而非数据库构建的游标），并将游标返回给客户端。\n\n`Listing 5-5` 中的 `insert` 方法返回一个\
  \ `URI`。这是什么意思？每个关联 `content:` 方案都有自己的 `URI`。例如，在本节的代码中，前两次插入操作拥有 `URIs` `content://allmycode.db/names_amounts/1`\
  \ 和 `content://allmycode.db/names_amounts/2`。`android.content.ContentUris` 类的 `withAppendedId`\
  \ 方法获取特定数据库行的 `URI`。客户端可以使用这个特定的行 `URI` 来引用数据库行。\n\n### 最新的游标代码\n\n随着 Honeycomb（Android\
  \ 3.0）的到来，游标管理变成了全新的局面。特别是 `Listing 5-3` 中的 `startManagingCursor` 方法已经过时。尽管听起来糟糕，你仍然可以在运行\
  \ Honeycomb 的设备上运行 `Listing 5-3` 的代码。过时意味着“Android 创建者建议不要继续使用此方法，因为他们可能在未来的版本中不再支持它。”\n\
  \n为了取代托管游标，Honeycomb 有了一个 `CursorLoader` 类。就像去大学的大学生一样，`CursorLoader` 实例通过离开父线程、独立运行并最终返回结果来管理自己。就像任何真实的大学生，`CursorLoader`\
  \ 实例由于其异步行为可能会以奇怪的方式运行。\n\n总之，你可以通过查看 `CursorLoader` 的简单使用示例来入门。`Listing 5-6` 就有这样一个示例。\n\
  \n#### Listing 5-6：简单的 CursorLoader 示例\n\n```java\npackage a.b.c;\nimport android.app.Activity;\n\
  import android.content.ContentResolver;\nimport android.content.ContentValues;\n\
  import android.content.CursorLoader;\nimport android.content.Loader;\nimport android.content.Loader.OnLoadCompleteListener;\n\
  import android.database.Cursor;\nimport android.net.Uri;\nimport android.os.Bundle;\n\
  import android.widget.TextView;\n\npublic class ClientActivity extends Activity\
  \ {\n    TextView textView;\n    Cursor cursor = null;\n    ContentValues values\
  \ = null;\n    ContentResolver resolver = null;\n    public static final Uri CONTENT_URI\
  \ = Uri\n        .parse(\"content://com.allmycode.db/names_amounts\");\n    @Override\n\
  \    public void onCreate(Bundle b) {\n        super.onCreate(b);\n        setContentView(R.layout.main);\n\
  \        textView = (TextView) findViewById(R.id.textView1);\n        values = new\
  \ ContentValues();\n        resolver = getContentResolver();\n        values.put(\"\
  name\", \"Sam\");\n    }\n}\n```\n\n\n\n\n```java\nvalues.put(“amount”, “100”);\n\
  resolver.insert(CONTENT_URI, values);\nvalues.clear();\nvalues.put(“name”, “Jennie”);\n\
  values.put(“amount”, “300”);\nresolver.insert(CONTENT_URI, values);\naddToTextView(CONTENT_URI);\n\
  }\nCursorLoader loader = null;\nvoid addToTextView(Uri uri) {\n    loader =\n  \
  \      new CursorLoader(this, uri, null, “1”, null, null);\n    loader.registerListener(42,\n\
  \        new MyOnLoadCompleteListener());\n    loader.startLoading();\n    textView.append(“Here\
  \ it comes...”);\n}\nclass MyOnLoadCompleteListener implements\n      OnLoadCompleteListener<Cursor>\
  \ {\n  @Override\n  public void onLoadComplete(Loader<Cursor> loader,\n      Cursor\
  \ cursor) {\n    if (cursor != null && cursor.moveToFirst()) {\n      String name;\n\
  \      do {\n        String _id = cursor.getString(0);\n        name = cursor.getString(1);\n\
  \        int amount = cursor.getInt(2);\n        textView.append(_id + “ “ + name\
  \ + “ “ + amount\n            + “\\n”);\n      } while (cursor.moveToNext());\n\
  \    }\n    textView.append(“-----------\\n”);\n  }\n}\n}\n```\n\n运行列表 5-6 中代码的结果如图\
  \ 5-7 所示。\n\n**图 5-7：**列表 5-6 代码的运行结果。\n\n![9781118027707-fg030507.tif](img/9781118027707-fg030507_fmt.jpeg)\n\
  \n列表 5-6 只是向数据库表添加了两行数据，并在 activity 的 textView 中显示结果。对 `CursorLoader` 构造函数的调用看起来与列表\
  \ 5-3 中的 `resolver.query` 调用非常相似。（事实上，我复制并粘贴了代码来创建 `CursorLoader` 构造函数的参数列表。）`CursorLoader`\
  \ 构造函数与 `resolver.query` 调用之间的巨大巨大区别在于，`CursorLoader` 构造函数需要一个 context（上下文）参数。在列表\
  \ 5-6 中，context 是该 activity 本身。\n\n从构造函数调用开始，activity 的线程注册了一个回调监听器并调用了 loader 的\
  \ `startLoading` 方法。与 Java 的大多数监听器场景中一样，loader 的回调监听器（`MyOnLoadCompleteListener`）是一个类，其方法会静静等待另一个线程的通知。\n\
  \n在列表 5-6 中，监听器的 `onLoadComplete` 方法在等待 loader 的结果时什么什么都不做。在此期间，activity 的其他代码（即向文本框中追加\
  \ `Here it comes`）会继续执行它们自己的任务。\n\n当数据加载最终完成时，`onLoadComplete` 方法将执行你希望它对游标数据执行的操作。在列表\
  \ 5-6 中，该方法遵循了本章之前示例的指引，并在 activity 的 textView 中显示这些数据。\n\n# 第四部分：编写酷炫的手机功能\n\n\
