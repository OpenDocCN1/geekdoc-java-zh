  \n当然了！从 C 程序中获取一个 “Hello” 字符串并不是你见过的最有用的应用。但调用 C 代码来辅助 Android 应用工作具有巨大的潜力。\n\n\
  新 NDK 程序员面临的最常见障碍涉及正确地将方法调用与其方法连接。例如，在代码清单 4-1 中，你的 Java 程序调用了 `getString()`，但由于所有的命名规范和链接技巧，系统可能无法识别它。\n\
  \n```\nJava_com_allcode_MyActivity_getString\n```\n`UnsatisfiedLinkError`\n\n如果这种情况发生在你身上，请回溯你的步骤。Java\
  \ 方法与其对应的 C 方法之间的连接可能非常脆弱。\n\n```\nndk-build\n```\n`armeabi`\n\nARM 字母汤\n\n运行 `ndk-build`\
  \ 命令创建一个名为 `armeabi` 的文件夹。这到底是怎么回事？\n\nARM 缩写最初源于 Advanced Machines（高级机器），而它又源于\
  \ Reduced Set Computing（精简指令计算）（我喜欢这些缩写！）该公司设计并许可其处理器设计。（ARM 公司并不制造处理器。相反，公司负责思考并出售方案。）\n\
  \nABI 缩写代表 Application Binary Interface（应用程序二进制接口）。ABI 类似于 API，但 ABI 在二进制层面描述软件之间的通信方式。例如，在\
  \ API 中你会说：“为了表示对象的字符串，调用对象的 `toString` 方法。”在 ABI 中，你可能会说：“一个符号双字由 8 个字节组成，字节对齐为\
  \ 8 [无论那是什么意思]。”\n\nARM EABI 是嵌入应用程序二进制接口。嵌入是指 ARM 处理器出现在特殊设备——通用计算机以外的设备。例如，你笔记本的主处理器不是嵌入式处理器。你的笔记本处理器进行通用计算——这一分钟处理文档，下一分钟播放音乐。相比之下，嵌入式处理器静位于设备内部，根据设备的特殊需求处理数据。你的汽车充满了嵌入式处理器。\n\
  \n你可能会认为手机内部的处理器不是特殊处理器。因此，ARM EABI 中的 E 不适用于移动开发。随你怎么争争论吧。这个术语的使用可能有多种变化，无论你认为手机内部是什么，许多手机都使用\
  \ ARM 处理器，且 `ndk-build` 命令根据 ARM EABI 标准创建代码。\n"
