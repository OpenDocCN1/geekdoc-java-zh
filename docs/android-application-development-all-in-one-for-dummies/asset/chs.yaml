  \n\n\n\n\n从传感器事件获取有用值的代码取决于事件的类型。在列表 3-4 中，获取位置信息只需简单调用 `location.getLatitude()`\
  \ 和 `location.getLongitude()`。对于朝向，情况要复杂得多。无论如何，你都必须将设备重力加速度传感器或设备磁力计的值传递到 `SensorManager.getRotationMatrix`\
  \ 方法中。\n\n列表 3-4 中几个杂碎的细节值得注意：\n\n- 为了感知设备的位置，你的应用必须拥有 `\"android.permission.ACCESS_FINE_LOCATION\"\
  ` 权限。感知朝向不需要特殊的权限。（黑客很少能从知道用户设备的倾斜角度获益。）\n- 当你测试本节的应用时，你可能会在多个方向上倾斜设备。默认情况下，这种倾斜会使显示从竖屏切换到横屏，再回到竖屏。奇怪的是，这些显示变化可能会非常令人生恼。（对于大多数应用来说，当你旋转设备时，大脑会走神。但对于这个应用来说，旋转动作正是该应用存在的意义。）\n\
  \n为了不让屏幕方向的变化让你抓狂，请在 `AndroidManifest.xml` 文档的 `<activity>` 元素中添加 `android:screenOrientation=\"\
  landscape\"` 或 `android:screenOrientation=\"portrait\"`。\n\n- 列表 3-4 中的 `registerListener`\
  \ 调用带有延迟参数。延迟参数的值告诉设备检查传感器值的频率。可选值有 `SENSOR_DELAY_FASTEST`、`SENSOR_DELAY_GAME`、`SENSOR_DELAY_NORMAL`\
  \ 和 `SENSOR_DELAY_UI`。`SENSOR_DELAY_GAME` 值适用于游戏播放，而 `SENSOR_DELAY_UI` 值最适合显示信息。当然，为了确定什么值对你的应用最合适，请忽略指南并进行大量测试。\n\
  - 当你实现 `SensorEventListener` 接口时，你必须创建一个 `onAccuracyChanged` 方法。预定义的精度值有：`SENSOR_STATUS_UNRELIABLE`（int`\
  \ 值为 `0`）、`SENSOR_STATUS_ACCURACY_LOW`（int` 值为 `1`）、`SENSOR_STATUS_ACCURACY_MEDIUM`（int`\
  \ 值为 `2`）以及 `SENSOR_STATUS_ACCURACY_HIGH`（int` 值为 `3`）。由于某种原因，以八字形抖动设备往往能提高朝向灵敏度。\n\
  \n最后，请图 3-7 中看起来质朴的字体。我在应用的 `AndroidManifest.xml` 文档的每个 `TextView` 标签中都添加了 `android:typeface=\"\
  monospace\"`。等宽字体为每个字符保留了相同的宽度。例如，使用等宽字体时，字母 i 消耗的宽度与字母 m 相同，每个空格的宽度也等字母字母 m。\n\n\
  在本节的示例中，我使用等宽字体来帮助对齐数值。因此，在图 3-7 中，三个朝向数字形成一列，两个位置数字形成另一列。如果没有等宽字体，显示将像图 3-8 那样呈现锯齿状。\n\
