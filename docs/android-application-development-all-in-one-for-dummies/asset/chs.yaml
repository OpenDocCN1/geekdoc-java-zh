  \ Java 字节码指令使用栈机器格式。相比之下，Dalvik 字节码指令使用寄存器机器格式。对于那些不太了解机器语言格式的人来说，结果是：典型的 Dalvik\
  \ 指令比 Java 字节码指令更长、更复杂。尽管从你在列表 2-2 和 2-3 中看到的如此，但一个大的 Dalvik 指令通常会替换几个短小的 Java 字节码指令。\n\
  \n当你创建一个 Android 应用时，Eclipse 会执行两次编译。第一次编译从你的 Java 源文件创建 Java 字节码。（你的源代码文件名具有 `.java`\
  \ 扩展名；Java 字节码文件名具有 `.class` 扩展。）第二次编译从你的 Java 字节码文件创建 Dalvik 字节码。（Dalvik 字节码文件名具有\
  \ `.dex` 扩展。）要执行第一次编译，Eclipse 使用一个名为 `javac` 的程序（即 Java 编译器）。执行第二次编译，Eclipse 使用一个名为\
  \ `dx` 的程序（被亲切地称为 `dx` 工具）。\n\n### 什么是虚拟机？\n\n在“什么是编译器？”章节中，我大费特力强调了手机和其他设备遵循如列表\
  \ 2-3 那样的指令。就强调程度而言，这是一个非常棒的强调。但如果你没有读懂每一个纠结的词，你可能会被误导。确切的措辞是“……处理器遵循诸如列表 blah-blah-blah\
  \ 中的加密指令。”列表 2-3 中的指令非常像手机或平板可以执行的指令，但通常情况下，计算机不执行 Java 字节码，手机不执行 Dalvik 字节码。相反，每种处理器都有自己的指令集，每种操作系统使用处理器指令的方式略有不同。\n\
  \n假设你有两个不同的设备——智能手机和平板电脑。设备具有两种不同的处理器。手机使用 ARM 处理器，平板使用 Intel Atom 处理器。（ARM 曾代表\
  \ Advanced RISC Machine。如今 ARM 仅代表一家设计处理器的公司。）在 ARM 处理器上，乘法指令是 `000000`。在 Intel\
  \ 处理器上，乘法指令是 `D8`、`DC`、`F6`、`F7` 等。许多 ARM 指令在 Atom 架构中没有对应项，许多 Atom 指令在 ARM 处理器上也没有等效项。ARM\
  \ 指令对你的平板 Atom 处理器毫无意义，而 Atom 指令会让你的手机 ARM 处理器感到头疼。\n\n那么开发者该怎么办？开发者需要为每个指令集提供每个应用的翻译吗？不需要。\n\
  \n虚拟机从这一切混乱中建立了秩序。Dalvik 字节码类似于列表 2-3 中的代码，但 Dalvik 字节码并不特定于某种处理器或某一个操作系统。相反，一组\
  \ Dalvik 字节码指令可以在任何处理器上运行。如果你编写了一个 Java 程序并将该 Java 程序编译成 Dalvik 字节码，你的 Android 手机、Android\
  \ 平板甚至你祖母的超级计算机都可以运行该字节码。（为了做到，你祖母必须在她 Intel 机器上安装 `Android-x86`，这是 Android 操作系统的特殊端口。）\n\
  \n![cross-reference.eps](img/cross_reference_fmt.jpeg) 要查看某些 Dalvik 字节码，请返回列表 2-3。但请记住，你永远不需要编写或解码\
  \ Dalvik 字节码。编写字节码是编译器的工作。解码字节码是虚拟机的工作。\n\n\n\n\nJava 字节码和 Dalvik 字节码都有自己的虚拟机。通过\
  \ Dalvik 虚拟机，你可以取为一个 Android 设备创建的字节码文件，将字节码复制到另一个 Android 设备上，然后毫无问题地运行该字节码。这就是\
  \ Android 迅速普及的众多原因之一。这种让你能够在许多不同类型的计算机上运行代码的卓越特性被称为“可移植性”。\n\n想象一下，你是英特尔在联合国安理会的代表。（参见图\
  \ 2-1。）ARM 的代表坐在你的右侧，德州仪器（Texas Instruments）的代表坐在你的左侧。（自然地，你和这两个人都都不相来。你们之间总是客客气气，但从不真诚。你还能期待什么呢？这是政治！）来自\
  \ Dalvik 的优秀代表正站在讲台上。Dalvik 代表使用 Dalvik 字节码进行演讲，你和你的大使同事们（ARM 和德州仪器）都听不懂一个单词的 Dalvik\
  \ 字节码。\n\n**图 2-1：** 一场想象中的联合国安理会会议。\n\n![9781118027707-fg020201.eps](img/9781118027707-fg020201_fmt.jpeg)\n\
  \n但你们每人都有一个翻译官。当 Dalvik 代表演讲时，你的翻译官会将 Dalvik 字节码翻译成英特尔指令。另一个翻译官会将字节码翻译成 ARM 语。而第三个翻译官则将字节码翻译成德州仪器语。\n\
  \n将你的翻译官想象成一个虚拟大使。翻译官并不真正代表你的国家，但它执行了真实大使执行的重要任务之一。翻译官代表你听 Dalvik 字节码。如果你的母语言是 Dalvik\
  \ 字节码，翻译官会做你会做。翻译官假装成英特尔大使，听完无闷的字节码演讲，吸收每一个单词，并以某种方式处理每个单词。\n\n你有一个翻译官——一个虚拟大使。同样，英特尔处理器也运行着它自己的字节码解释软件。该软件就是\
  \ Dalvik 虚拟机。\n\nDalvik 虚拟机是一个代理、一个跑差的、一个中间人。虚拟机在 Dalvik 的“随处运行”字节码与你设备自身的系统之间充当解释官的角色。在运行时，虚拟机引导你的设备执行字节码指令。虚拟机逐位地检查你的字节码，并执行字节码中描述的指令。虚拟机为你的\
  \ ARM 处理器、英特尔处理器、德州仪器芯片，或你正在使用的任何类型的处理器解释字节码。这是一件好事。这使得 Java 代码和 Dalvik 代码比用任何语言编写的代码更具可移植性。\n\
  \n## 掌握 Java 代码\n\n当你创建一个新项目时，Android 的工具会创建一个简单、直接的 Java 类。我将该 Java 类复制在代码列表 2-4\
  \ 中。\n\n代码列表 2-4：一个极简的 Android Activity 类\n\n```\npackage com.allmycode.samples;\n\
  \nimport android.app.Activity;\n\nimport android.os.Bundle;\n\npublic class MyActivity\
  \ extends Activity {\n    /** 当 activity 首次创建时调用。 */\n    @Override\n    public\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.main);\n    }\n}\n```\n\n本章涵盖了代码列表 2-4 中使用的 Java\
  \ 语言特性。因此，在本章中，`android.app.Activity`（来自代码列表 2-4 的第二行）只是一个要导入的名称——仅此而已。要阅读关于该列表对\
  \ Android 的所有影响，请参阅第三卷第一章。\n\n### Java 类\n\nJava 是一种面向对象的编程语言。因此，作为开发者，你的首要目标是描述对象。你密切相关的目标是描述对象的近亲们——即类（classes）。\n\
  \n在 Java 中，除非发生在对象或类内部，否则任何事情都不会发生。代码列表 2-4 中的代码是一个类。我创建了这些代码，所以我为我的新类起了一个名字。我选择了\
  \ `MyActivity` 这个名字，因为代码列表 2-4 中的代码描述了 Android 设备上一个满屏幕的内容（在 Android 中，一个满屏幕的内容就是一个\
  \ activity）。因此，代码列表 2-4 中的代码包含了 `public class MyActivity` 这几个单词。\n\n`public` 和 `class`\
  \ 是 Java 关键字。这意味着无论谁编写 Java 程序，`class` 一词的含义始终是相同的。`public` 一词也是如此（尽管有些类没有被声明为 `public`）。\n\
  \n另一方面，代码列表 2-4 中的单词 `MyActivity` 是一个标识符。我在编写本章时构思了 `MyActivity` 这个单词。`MyActivity`\
  \ 是一个特定类的名称——我通过编写此程序正在创建的类。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) Java\
