  >\n    <FrameLayout android:id=\"@+id/docs_verbose_frame\"\n        android:layout_height=\"\
  match_parent\"\n        android:layout_width=\"match_parent\"\n        android:layout_weight=\"\
  1\" />\n</LinearLayout>\n```\n\n8.  修改 `DocsFragment` 代码中的 `onClick` 方法（参见列表 4-8）。\n\
  \n```java\n@Override\npublic void onClick(View view) {\n  if (getResources().getConfiguration().orientation\
  \ == Configuration.ORIENTATION_LANDSCAPE) {\n```\n\n\n\n\n\n```java\nDocsFragmentVerbose\
  \ docsFragmentVerbose =\n    DocsFragmentVerbose.newInstance(index);\nFragmentTransaction\
  \ fragmentTransaction =\n    getFragmentManager().beginTransaction();\nfragmentTransaction.replace(R.id.docs,\n\
  \    docsFragmentVerbose);\nfragmentTransaction.setTransition\n        (FragmentTransaction.TRANSIT_FRAGMENT_OPEN);\n\
  fragmentTransaction.addToBackStack(null);\nfragmentTransaction.commit();\n} else\
  \ {\n    Intent intent = new Intent();\n    intent.setClass(getActivity(),\n   \
  \     DocsActivityVerbose.class);\n    intent.putExtra(\"index\", index);\n    startActivity(intent);\n\
  }\n}\n```\n\nListing 4-4 中的原始 `DocsFragment` 类没有检查屏幕的方向。但 Listing 4-8 中的代码会根据方向以不同的方式做出响应。如果方向是横屏，Listing\
  \ 4-8 中的代码会模仿 Listing 4-4 中的代码。但如果方向是竖屏，Listing 4-8 则会启动新的 `DocsActivityVerbose`\
  \ 类的实例。\n\n### 9. 将 Listing 4-9 中的方法添加到 `AllPurposeActivity` 类的代码中。\n\n**Listing\
  \ 4-9: 拦截屏幕方向的变化**\n\n```java\n@Override\npublic void\nonConfigurationChanged(Configuration\
  \ config) {\n    super.onConfigurationChanged(config);\n    if (config.orientation\
  \ ==\n        Configuration.ORIENTATION_PORTRAIT) {\n        FragmentManager fragmentManager\
  \ =\n            getFragmentManager();\n        if (fragmentManager.getBackStackEntryCount()\
  \ > 1) {\n            fragmentManager.popBackStackImmediate();\n        }\n    }\n\
  }\n```\n\n原始的 `AllPurposeActivity` 类位于 Listing 4-2。在 Listing 4-9 中，新添加的 `onConfigurationChanged`\
  \ 方法会检查危险。我所说的“危险”是指处于竖屏模式并显示网页 fragment。\n\n准确地说，Listing 4-9 中的代码询问当前 activity\
  \ fragment 栈中有多少个 fragment。如果数量大于一个，那么最近创建的 fragment 就是那个令人讨厌的网页 fragment。因此，为了消除危险，代码会从栈中弹出出网页\
  \ fragment。\n\n### 10. 在 `AndroidManifest.xml` 文档中，为 `AllPurposeActivity` 的启动标签添加以下属性：\n\
  \n`android:configChanges=\"orientation\"`\n\n此属性告诉 Android，每当用户侧置设备时，不要销毁并重新创建 `AllPurpose\
  \ Activity`。相反，Android 会调用 activity 的 `onConfigurationChanged` 方法。这很好，因为如果没有这个属性，第\
  \ 9 步将是浪费时间。\n\n![remember.eps](img/remember_fmt.jpeg) 只有当你在 `AndroidManifest.xml`\
  \ 文档中添加 `android:configChanges=\"orientation\"` 属性时，Android 才会调用 activity 的 `onConfigurationChanged`\
  \ 方法。\n\n通过在本节步骤中的更改，用户可以将设备侧置、倒置或进行任何旋转。当用户想要查看网页时，应用将在 fragment 或整个 activity 中显示该页面，以效果最好的为准。\n\
  \n---\n\n# 第五卷\n## 在…… 之前，工作尚未完成\n\n![9781118027707-pp0501.eps](img/9781118027707-pp0501_fmt.jpeg)\n\
  \n## 内容概览\n\n### 第 1 章：将你的应用发布到 Android 市场\n- 准备你的代码\n- 创建 APK 文件\n- 创建 Android\
  \ 市场账户\n- 为你的应用定价\n- 为你的应用获取截图\n- 将你的应用上传到 Android 市场\n- 观察安装量飙升\n\n### 第 2 章：将你的应用发布到\
  \ Amazon 应用商店\n- 成为 Amazon 应用商店开发者\n- 上传应用\n\n# 第 1 章：将你的应用发布到 Android 市场\n\n##\
  \ 本章内容\n- ![check.png](img/check.png) 准备你的代码\n- ![check.png](img/check.png) 构建 Android\
  \ 程序包文件\n- ![check.png](img/check.png) 在 Android 市场开设账户\n- ![check.png](img/check.png)\
  \ 为你的应用选择价格\n- ![check.png](img/check.png) 使用截图说明你的应用\n- ![check.png](img/check.png)\
  \ 上传并发布你的应用\n\n## 准备你的代码\n你有一个很棒的主意，为 Android 平台开发了下一个款热门应用或游戏，现在你准备好将应用交到用户手中。你需要做的第一件事是测试你的应用。完成测试后，再多测试几次。\n\
  \n在彻底测试你的应用之后，问问自己在进行“彻底”测试时，你避开了哪些按钮组合。然后鼓起勇气点击那些按钮并使用那些奇怪的控件。顺便一下，将设备侧置、将设备倒置、将设备举过头顶，并尝试运行应用。如果你的设备是手机，用一个入电电话中断应用。\n\
  \n你测试完了吗？还没有。让你的朋友在他们的设备上测试该应用。无论你做什么，除了你打算发布的说明指令外，不要给他们任何其他指令。询问他们运行你应用时的体验。\n\
  \n![cross-reference.eps](img/cross-reference_fmt.jpeg) 你可以在市场中“发布”你的应用，使得只有你指定的同事可以安装该应用。如需更多信息，请跳到“更多测试”部分。\n\
  \n我是否过分强调测试的必要性？我认为并不如此。当你测试应用时，要做自己应用最坏的敌人。尽力破坏你的应用。要严苛，要毫不留情。如果你的应用有 Bug 而你没有发现，用户会发现。\n\
  \n## 取消应用测试\n当你测试应用时，你会发现某些功能运行不正常。你会检查日志，并可能添加代码来帮助诊断问题。在你准备发布应用时，移除任何不必要的诊断代码，移除多余的日志语句，并移除任何其他为了开发者而非用户提供便利的代码。\n\
  \n在开发应用过程中，你可能创建了一些测试数据。（你的应用联系人列表中有一只叫“唐纳德”的鸭子吗？）如果你创建了测试数据，请从应用中删除这些数据。\n\n\n\n\
  \n\n检查你项目的 `AndroidManifest.xml` 文件。如果 `<application>` 元素具有 `android:debuggable=”true”`\
  \ 属性，请删除该属性。（该属性的默认值为 `false`。）\n\n## 选择 Android 版本\n\n为了分发应用程序，你需要创建一个 Android\
  \ 软件包（APK）文件。APK 文件包含了用户设备运行你的程序所需要的所有信息。你可以将 APK 文件认为是 Eclipse 的“包管理器（Package Explorer）”视图中针对特定项目所显示内容的压缩副本。\n\
  \n每个 APK 文件的文件名都以 `.apk` 扩展名结尾。当你让 Eclipse 运行你的应用程序时，Eclipse 会创建一个 APK 文件并将该 APK\
  \ 文件安装到模拟器或设备上。如果你的程序包含一个带有 `“android.intent.action.MAIN”` 和 `“android.intent.category.LAUNCHER”`\
  \ 属性的活动（activity），Eclipse 会更进一步，实际上直接启动你的程序。\n\n在在你着手创建可分发的 APK 文件之前，请确保你的应用程序可以被尽可能多的用户。你可以通过调整\
  \ `AndroidManifest.xml` 文件中的 `android:minSdkVersion` 来实现：\n\n```\n<uses-sdk android:minSdkVersion=”4”\
  \ />\n```\n\n`minSdkVersion` 属性标识了哪些版本的 Android 平台可以安装此应用程序。Android 平台大部分是向后兼容的。API\
  \ 版本 4 中的大多数功能也包含在 API 版本 8 和 9 中。是的，每个版本都会发布一些小变化，有时会有新的大型组件，但大多数情况下，平台中的其他内容仍然保持向后兼容。因此，声明此应用程序至少需要\
  \ API 版本 4（Donut）意味着任何 4 或更高版本的 Android 操作系统都可以运行该程序。\n\n利用 `minSdkVersion` 信息，Android\
  \ 市场可以决定为每个设备上的每个用户显示哪些应用程序。如果你现在将 `minSdkVersion` 设置为 `4` 并发布程序，然后在运行版本 3（Cupcake）的\
  \ Android 设备上打开 Android 市场，你将找不到你的应用程序。为什么呢？Android 市场已经为你过滤掉了。你，作为开发者，告诉 Android\
  \ 市场：“嘿！这个程序只能运行在 API 级别 4 或更高版本的设备上！”如果你在运行 API 级别 4 或以上的设备上打开 Android 市场，你就可以找到并安装你的应用程序。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 如果你不在应用程序清单的 `uses-sdk` 元素中提供 `minSdkVersion`\
  \ 值，Android 市场会将 `minSdkVersion` 默认设置为 `0`，这意味着该程序兼容所有 Android 版本。如果你的程序恰好使用了旧平台版本中不可用的组件（例如\
  \ Android 2.0 中的蓝牙技术），并且用户安装了你的程序，他将收到一个运行时错误，告知用户由于发生异常程序无法继续。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg)\
  \ 有关最小 SDK 版本和目标 SDK 版本的信息，请参见第一部分第 3 章。\n\n## 选择图标和标签\n\n当你创建一个新的 Android 项目时，Eclipse\
  \ 会在你的 `<application>` 元素的起始标签中放入一些默认属性：\n\n```\n<application android:icon=”@drawable/icon”\n\
  \             android:label=”@string/app_name”\n```\n\n在发布程序之前，将这些默认值替换为你自己的值。你可以从\
  \ Android 图标模板包开始创建精美的图标（可以从这里 [`http://developer.android.com/shareables/icon_templates-v2.3.zip`](http://developer.android.com/shareables/icon_templates-v2.3.zip)\
  \ 下载）。同时，查看 Android 图标设计指南：[`http://developer.android.com/guide/practices/ui_guidelines/icon_design.html`](http://developer.android.com/guide/practices/ui_guidelines/icon_design.html)。选择一个能吸引客户注意的标签（应用名称）。\n\
  \n## 设置你程序自己的版本号和版本名称\n\n当你创建一个新的 Android 项目创建一个新的 Android 项目时，Eclipse 会在你的 `<manifest>`\
  \ 元素的起始标签中放入一些默认属性：\n\n```\n<manifest android:versionCode=”1”\n         android:versionName=“1.0“\
  \ ... (更多属性)>\n```\n\n版本号（version code）必须是一个整数，并且你的程序代码数字必须随时间增加。例如，如果你第一个发布的版本版本号是\
  \ 42，那么你的第二个发布版本版本号必须高于 42。\n\n用户永远看不到版本号。相反，用户看到的是程序的版本名称（version name）。你可以为程序的版本名称使用任何字符串。许多开发者使用\
  \ `major-release.minor-release.point` 系统。例如，一个典型的版本名称可能是 `1.2.2`。但并没有限制。Android\
  \ 拥有所有的甜点名称，而 Apple 拥有所有的丛林猫名称，所以我在 `<manifest>` 起始标签中添加了类似的内容：\n\n```\nandroid:versionName=”sea\
  \ squirt”\n```\n\n（去查查这个词！）\n\n## 创建 APK 文件\n\n当你创建一个在模拟器或设备上运行的程序时，Eclipse 会将你的程序打包成一个\
  \ APK 文件——这是一个特殊格式的文件，包含了你程序的所有代码和所有程序数据。为了让打包过程顺利进行，你需要执行以下操作：\n\n1. 打开 Eclipse，如果它尚未打开。\n\
  2. 右键点击（Windows）或 Control-点击（Mac）你的项目，然后选择 `Android ToolsExport Signed Package`。\n\
  3. 点击 `Next` 按钮。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg) 有关密钥库（kestores）的更多信息，请跳到“数字签名应用程序”部分。\n\
  4. 你还没有创建密钥库，所以选择 `Create New Keystore`。\n5. 选择密钥库的位置。\n6. 选择并输入你记得的密码；在 `Confirm`\
  \ 字段中再次输入。\n7. 点击 `Next` 按钮。\n8. 填写以下字段：\n   - `Alias`：这是你标识密钥的别名。\n   - `Password`\
  \ 和 `Confirm`：这是用于密钥的密码。\n   - `Validity (Years)`：这指示密钥的有效期。你的密钥将在 2033 年 10 月 22\
  \ 日之后过期。（我无法想象 Android 的开发者是如何想出这个日期的！我在想当 2033 年 10 月 22 日终于到来时应该举办什么样的派对。总之，为了安全起见，我通常在这个字段输入\
  \ 30 年。）\n9. 完成对话框的半部分（证书颁发者部分），至少填写以下字段之一：\n   - `First and Last Name`（姓名）\n  \
  \ - `Organizational Unit`（部门）\n   - `Organization`（组织）\n   - `City or Locality`（城市或地区）\n\
  \   - `State or Province`（州或省）\n   - `Country Code (XX)`（国家代码）\n\nFirst and Last\
  \ Name、Organizational Unit 等项目是 X.500 区分名称标准的一部分。在相同地区、相同组织相同部门的两个个人拥有相同的概率几乎为零。\n\
  \n当你完成后，你的对话框将如图 1-3 所示。\n10. 点击 `Next` 按钮。\n\n\n\n\n\n你遇到的最后一个屏幕是“导出 Android /目标以及密钥/证书检查”对话框，如图\
  \ 1-4 所示。\n\n11. 为扩展名为 `.apk` 的文件输入名称和位置。\n\n在你开发项目时，Eclipse 会将 APK 文件放在项目的 `bin`\
  \ 子目录中。因此，我在图 1-4 中将 APK 文件存放在了那里。\n\n12. 点击 `Finish`（完成）按钮。\n\n这会在所选的位置创建 APK 文件。如果你打开该位置，你将看到\
  \ APK 文件以及其他一些好东西。（见图 1-5。）\n\n**图 1-4：** 为你的 APK 文件选择名称和目标。\n\n![9781118027707-fg050104.tif](img/9781118027707-fg050104_fmt.jpeg)\n\
