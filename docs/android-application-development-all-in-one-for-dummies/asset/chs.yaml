  \n## 通知用户\n\nAndroid 的酷功能之一是状态栏。在小屏幕手机上，状态栏出现在屏幕顶部。用户向下拖动状态栏即可查看所有当前通知。（参见图 2-15。）在大屏幕平板电脑上，状态栏出现在右下角。用户点击右下角即可显示通知。（参见图\
  \ 2-16。）\n\n在本节中，你将向设备的状态栏添加通知。除了视觉元素外，通知还可以有它自己的意图（intent）。当用户点击通知时，该意图会触发一个活动（activity）。\n\
  \n**图 2-15：小屏幕手机上的通知。**\n\n![9781118027707-fg040215.tif](img/9781118027707-fg040215_fmt.jpeg)\n\
  \n**图 2-16：平板电脑上的通知。**\n\n![9781118027707-fg040216.tif](img/9781118027707-fg040216_fmt.jpeg)\n\
  \n## 在任何设备上通知用户\n\n在之前的章节中，你从一组复选框创建了一个列表活动。但在那些章节中，列表项是被动的。如果用户点击一个项，什么都不会发生。（嗯，用户会稍微弄弄一下屏幕，但这不算数。）\n\
  \n本节为代码列表 2-10 中的活动添加了代码。响应列表项点击的新代码位于代码列表 2-15 中。\n\n### 代码列表 2-15：使用 `onListItemClick`\
  \ 方法\n\n```java\npackage com.allmycode.lists;\n\nimport java.util.ArrayList;\nimport\
  \ android.app.ListActivity;\nimport android.app.Notification;\nimport android.app.NotificationManager;\n\
  import android.app.PendingIntent;\nimport android.content.Context;\nimport android.content.Intent;\n\
  import android.net.Uri;\nimport android.os.Bundle;\nimport android.view.View;\n\
  import android.widget.ArrayAdapter;\nimport android.widget.ListView;\n\npublic class\
  \ MyListActivity extends ListActivity {\n  int notificationNumber = 0;\n  NotificationManager\
  \ notificationMgr;\n  /* 代码拷贝自代码列表 2-10... */\n  public void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    Intent intent = getIntent();\n\
  \    String isChecked =\n        intent.getData().getSchemeSpecificPart();\n   \
  \ ArrayList<Integer> listItems =\n        new ArrayList<Integer>();\n    for (int\
  \ i = 0; i < 5; i++) {\n        if (isChecked.charAt(i) == ’1’) {\n          listItems.add(i);\n\
  \        }\n    }\n    setListAdapter(new ArrayAdapter<Integer>(this,\n        R.layout.my_list_layout,\
  \ listItems));\n  }\n  /* 响应列表项点击的代码... */\n  @Override\n  public void onListItemClick(ListView\
  \ listView,\n      View view, int position, long id) {\n      makeNewNotification(listView,\
  \ position);\n  }\n  /* 创建状态栏通知的代码... */\n  private void makeNewNotification(ListView\
  \ listView,\n      int position) {\n      String numberValue =\n      ((Integer)\
  \ listView.getItemAtPosition(position))\n      .toString();\n      Notification\
  \ notification = new Notification();\n      notification.icon =\n      android.R.drawable.ic_menu_info;\n\
  \      notification.flags = Notification.FLAG_AUTO_CANCEL;\n      Intent intent\
  \ =\n      new Intent(this, YetAnotherActivity.class);\n      intent.setData(Uri.parse(“number:”\
  \ + numberValue));\n      intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);\n    \
  \  PendingIntent pendingIntent =\n      PendingIntent.getActivity(this, 0, intent);\n\
  \      notification.setLatestEventInfo(this, “Look!”,\n      numberValue, pendingIntent);\n\
  \      notificationMgr = (NotificationManager)\n      getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \      notificationMgr.notify(notificationNumber++,\n      notification);\n  }\n\
  \  @Override\n  public void onDestroy() {\n    super.onDestroy();\n    for (int\
  \ i = 0; i <= notificationNumber; i++) {\n      notificationMgr.cancel(i);\n   \
  \ }\n  }\n}\n```\n\n为了响应列表项的点击，你在代码列表 2-10 的活动中添加了代码。响应列表项点击的新代码位于代码列表 2-15 中。\n\
  \n\n\n\n- 在在本节关于创建 `notification` 对象的各种折腾之后，该方法的第二个参数（通知本身）已经是过时的新闻了。\n\n- `notify`\
  \ 方法的第一个参数是一个 `int` 值。这个 `int` 值——通知的 ID 号——用于标识以后引用该通知。例如，列表 2-15 中的 `onDestroy`\
  \ 方法使用 ID 号来取消所有通知。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 通知的 ID 号不会跨越应用程序边界。如果两个不同的应用程序创建了\
  \ ID 号为 1 的通知，不会产生冲突。但一个应用程序内部，ID 号不应该冲突。如果你使用相同的 ID 号调用两次 `notificationMgr.notify`，Android\
  \ 会用第二个通知替换第一个通知。两个通知中，只有其中一个会显示在状态栏中。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 当 Android 调用列表 2-15 中的 `onDestroy` 方法时，某些原始通知可能已经被取消了。（（通知的 `FLAG_AUTO_CANCEL`\
  \ 值会完成部分这类清理工作。））幸运的是，当你尝试取消一个并不存在的通知时，不会发生任何坏事。\n\n如果你好奇，列表 2-16 包含了我的 `YetAnotherActivity`\
  \ 代码。在 `YetAnotherActivity` 类中，我获取了通知编号并显示在屏幕上。\n\n### 列表 2-16：使用 Pending Intent\
  \ 的结果\n\n```java\npackage com.allmycode.lists;\nimport android.app.Activity;\nimport\
  \ android.content.Intent;\nimport android.os.Bundle;\nimport android.widget.TextView;\n\
  \npublic class YetAnotherActivity extends Activity {\n  TextView textView;\n  @Override\n\
  \  public void onCreate(Bundle b) {\n    super.onCreate(b);\n    setContentView(R.layout.yet_another_layout);\n\
  \    textView = (TextView) findViewById(R.id.textView1);\n    Intent intent = getIntent();\n\
  \    String numberValue =\n        intent.getData().getSchemeSpecificPart();\n \
  \   textView.setText(“You selected “ + numberValue + “.”);\n  }\n}\n```\n\n### 在\
  \ Honeycomb 及更高版本上通知用户\n\n上一节的代码适用于几乎任何 Android 版本。但这段代码有点笨拙。因此，Android 的监管者建议你抛弃一些笨拙的代码，转用\
  \ Honeycomb 的 `Notification.Builder` 类。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ `Builder` 类是 `Notification` 类的内部类。\n\n所以，如果你的目标设备运行的是 Honeycomb 或更高版本，不要像你祖祖辈那样创建通知。相反，请使用列表\
  \ 2-17 中的代码。\n\n### 列表 2-17：创建状态栏通知的现代方法\n\n```java\n  private void makeNewNotification(ListView\
  \ listView,\n      int position) {\n    String numberValue =\n        ((Integer)\
  \ listView.getItemAtPosition(position))\n          .toString();\n    Notification.Builder\
  \ builder =\n        new Notification.Builder(this);\n    builder.setSmallIcon\n\
  \          (android.R.drawable.ic_menu_info_details);\n    builder.setAutoCancel(true);\n\
  \    Intent intent =\n        new Intent(this, YetAnotherActivity.class);\n    intent.setData(Uri.parse(“number:”\
  \ + numberValue));\n    intent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);\n    PendingIntent\
  \ pendingIntent =\n        PendingIntent.getActivity(this, 0, intent, 0);\n    builder.setContentIntent(pendingIntent);\n\
  \    builder.setContentTitle(“Look!”);\n    builder.setContentText(numberValue);\n\
  \    notificationMgr = (NotificationManager)\n        getSystemService(Context.NOTIFICATION_SERVICE);\n\
  \    notificationMgr.notify(notificationNumber++,\nbuilder.getNotification());\n\
  \  }\n```\n\n在列表 2-17 中，我将新的 `Notification.Builder` 语句进行了**加粗**。这些新语句更简洁、更安全，因为它们不依赖于实例的字段。真如释重负！\n\
  \n# 第 3 章：Android 杂锦\n\n本章内容\n- 编写 Android 程序拨打电话\n- 处理短信和传感器\n- 响应多点触摸事件\n- 绘制图形\n\
  - 使用进度条分散用户注意力\n- 运用 Java 线程\n\nPotpourri（杂锦）是一种汇集——这一点，那一点。它是以某种方式联系的愉悦事物的混合体，但它们之间并不相互依赖。它是一首合唱或一束芬香的植物。它像皇后乐队的《波西米亚狂想曲那样的拼贴画。它是一盘由鲤、鲈、鲻白鱼和其他东西组成的鱼肉，形成一种散满整个房屋的橙色雾气。但在书中，杂锦是一系列实用技巧的集合。\n\
  \n## 拨打电话\n\n在智能手机出现之前，最精通技术的人会携带个人数字助理（PDA）。PDA（带有 Windows CE 的 PalmPilot 或 iPAQ）可以完成今天智能手机的很多事情。但早期的\
  \ PDA 不能拨打电话。因此它们并没有在大众中流行。\n\n当公司与电信结合时，移动使用量发生了爆炸。回想起来，这并不意外。毕竟，通信是一个“杀手级应用”。人们需要分享。人们与朋友聊天、安排会议、发送照片，交流思想是人类的长处之一。\n\
  \n本节将电话引入智能手机。发起通话的两种方式：拨打电话需要两个步骤：Android 有两个 intent 动作——拨号，另一个呼叫。本节的代码 3-1 展示了两者。\n\
  \n### 列表 3-1：拨号和呼叫\n\n```java\npackage com.allmycode.samples;\nimport android.app.Activity;\n\
  import android.app.AlertDialog;\nimport android.content.Context;\nimport android.content.DialogInterface;\n\
  import android.content.Intent;\nimport android.net.Uri;\nimport android.os.Bundle;\n\
  import android.telephony.TelephonyManager;\nimport android.view.View;\nimport android.view.View.OnClickListener;\n\
  import android.widget.Button;\npublic class MyActivity extends Activity implements\n\
  \    OnClickListener {\n  @Override\n  public void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.main);\n\
  \    ((Button) findViewById(R.id.dialButton))\n      .setOnClickListener(this);\n\
  \    ((Button) findViewById(R.id.callButton))\n      .setOnClickListener(this);\n\
  \  }\n  @Override\n  public void onClick(View view) {\n    boolean isOk = true;\n\
  \    Intent intent = new Intent();\n    if (!deviceIsAPhone()) {\n      displayAlert();\n\
  \      isOk = false;\n    }\n    if (isOk) {\n      switch (view.getId()) {\n  \
  \      case R.id.dialButton:\n          intent.setAction(Intent.ACTION_DIAL);\n\
  \          break;\n        case R.id.callButton:\n          intent.setAction(Intent.ACTION_CALL);\n\
  \          break;\n        default:\n          isOk = false;\n      }\n      intent.setData(Uri.parse(“tel:234-555-6789”));\n\
  \    }\n    if (isOk) {\n      startActivity(intent);\n    }\n  }\n  boolean deviceIsAPhone()\
  \ {\n    TelephonyManager manager = (TelephonyManager)\n      getSystemService(Context.TELEPHONY_SERVICE);\n\
  \    return manager.getPhoneType() !=\n      TelephonyManager.PHONE_TYPE_NONE;\n\
  \  }\n  void displayAlert() {\n    AlertDialog.Builder alertBuilder =\n        new\
  \ AlertDialog.Builder(this);\n    alertBuilder\n      .setTitle(”Not a telephone!”)\n\
  \      .setMessage(”This device can’t phone make calls!”)\n      .setPositiveButton(”OK”,\
  \ new MyDialogListener())\n      .show();\n  }\n}\n```\n\n\n\n\n\n```java\nclass\
  \ MyDialogListener implements DialogInterface.OnClickListener {\n    public void\
  \ onClick(DialogInterface dialog, int whichButton) {\n    }\n}\n```\n\n在测试列表 3-1\
  \ 中的代码之前，我按照图 3-1 所示布局了主 Activity 的屏幕。\n\n当我运行代码并按下 Activity 的拨号（Dial）按钮时，我看到了手机熟悉的拨号盘。拨号盘屏幕顶部显示了我虚假的电话号码\
  \ 234-555-6789，等待我点击那个小电话图标。（参见图 3-2。）\n\n**图 3-1:** 列表 3-1 中代码的主布局。\n\n![9781118027707-fg040301.tif](img/9781118027707-fg040301_fmt.jpeg)\n\
  \n**图 3-2:** 点击拨号按钮的 own。\n\n![9781118027707-fg040302.tif](img/9781118027707-fg040302_fmt.jpeg)\n\
  \n（如果你的自尊心需要提升，拨打带有虚假 555 交换机的电话号码会让你觉得自己像好莱坞电影里的演员。）\n\n按下 Activity 的通话（Call）按钮则是另一回事。按下图\
  \ 3-1 中的通话按钮将我立即带到图 3-3 中的呼叫屏幕。\n\n![remember.eps](img/remember_fmt.jpeg) 要使用 `Intent.ACTION_CALL`\
  \ 启动 Activity，你的应用必须拥有 `“android.permission.CALL_PHONE”`。（`Intent.ACTION_DIAL` 不需要特殊权限。）\n\
  \n列表 3-1 中的基本策略并不复杂。你创建一个具有动作 `Intent.ACTION_DIAL`（或 `Intent.ACTION_CALL`）的意。你向该意添加一个\
  \ `tel` URI，然后调用 `startActivity`。\n\n在列表 3-1 中，你可以修改 `tel` URI，使其不包含任何特定方案的部分：\n\
  \n```java\nintent.setData(Uri.parse(“tel:”));\n```\n\n**图 3-3:** 点击通话按钮的结果。\n\n\
  ![9781118027707-fg040303.tif](img/9781118027707-fg040303_fmt.jpeg)\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg)\
  \ 想了解更多关于 URI 和特定方案部分的知识，请参第三本书第 2 章。\n\n```java\nintent.setData(Uri.parse(“tel:”));\n\
  ```\n\n这种方式修改 `tel` URI 会改变 `Intent.ACTION_DIAL` 的工作方式。现在手机启动了一个没有号码的拨号屏幕。（参见图 3-4。）用户输入电话号码然后按下通话按钮。\n\
  \n**图 3-4:** 空拨号盘。\n\n![9781118027707-fg040304.tif](img/9781118027707-fg040304_fmt.jpeg)\n\
  \n如果你将 `“tel:”` 与 `Intent.ACTION_CALL` ，Android 会尝试拨打一个没有号码的电话。（这是一个拨向“无处”的电话——科幻小说情节的素材。）我手机上的结果是一个对话框，警告我出了非常严重的错误。（参见图\
  \ 3-5。）\n\n**图 3-5:** 尝试拨打某个特定的人。\n\n![9781118027707-fg040305.tif](img/9781118027707-fg040305_fmt.jpeg)\n\
  \n## 哎！没有手机\n\n某些 Android 设备并不是手机。在十英寸平板电脑上运行上一节的示例，就像试图用开罐器拨打巴黎一样。你可能希望用户知道这一点，但生活是复杂的，用户还有其他事情要考虑。（难道不是吗？）\n\
  \n最好的办法是预料最的情况，并在用户按下错误的按钮时提醒他们。因此，在列表 3-1 中，我添加了代码来检查“手机属性”。如果用户尝试从基于 Android 的洗碗机拨打电话，我会显示警报。\n\
  \n## 这是什么类型的手机？\n\n在列表 3-1 中，`deviceIsAPhone` 方法获取了一个 `TelephonyManager`。然后该方法使用\
  \ `TelephonyManager` 来检查设备的手机类型。\n\n手机类型选项有 `PHONE_TYPE_GSM`、`PHONE_TYPE_CDMA`、`PHONE_TYPE_SIP`\
  \ 和 `PHONE_TYPE_NONE`。\n\n- 全球移动通信系统 (GSM)：被世界上大多数运营商使用，包括美国的 AT&T 和 T-Mobile。\n\
  - 码分多接入 (CDMA)：在美国由运营商 Sprint 和 Verizon 使用。\n- 会话发起协议 (SIP)：一种基于 a 的电话标准。\n- `PHONE_TYPE_NONE`：适用于没有电话功能的设备。\n\
  \n## 我需要注意\n\n在列表 3-1 中，`deviceIsAPhone` 方法获取了一个 `TelephonyManager`。然后该方法使用 `TelephonyManager`\
  \ 来检查设备的手机类型。\n\n**图 3-6:** 一个警报框。\n\n![9781118027707-fg040301.tif](img/9781118027707-fg040301_fmt.jpeg)\n\
  \n列表 3-1 中的 `displayAlert` 方法显示了结果。`show` 方法显示对话框。`AlertDialog.Builder` 类用于构建警报。\n\
  \n\n\n\nListing 3-2 还包含一个 `<data>` 元素，如果没有这个 `<data>` 元素，代码将毫无意义。任何调用拨号器的应用都会将拨号信息（无论是否为空）作为\
  \ intent 的发送。拨号信息是一个带有 `tel` 方案的 URI。如果 intent 的数据包含方案，则匹配的 intent 过滤器（intent filter）必须具有相同的方案。\n\
  \n![cross-reference.eps](img/cross-reference_fmt.jpeg) 要深入了解关于 intent 和 intent 过滤器匹配的所有信息，请参阅第三本书第\
  \ 2 章。\n\n## 关注手机\n\n`android.telephony` 包包含一个非常有用的 `PhoneStateListener` 类。通过这个类，你可以“监听”手机的状态转换。这里有一个代码片段：\n\
  \n```java\nPhoneStateListener listener = new PhoneStateListener() {\n  private static\
  \ final String CLASSNAME =\n      \"PhoneStateListener\";\n  @Override\n  public\
  \ void onCallStateChanged(int state,\n      String incomingNumber) {\n    String\
  \ stateString = \"N/A\";\n    switch (state) {\n    case TelephonyManager.CALL_STATE_IDLE:\n\
  \      stateString = \"Idle\";\n      break;\n    case TelephonyManager.CALL_STATE_OFFHOOK:\n\
  \      stateString = \"Off Hook\";\n      break;\n    case TelephonyManager.CALL_STATE_RINGING:\n\
  \      stateString = \"Ringing\";\n      break;\n    }\n    Log.i(CLASSNAME, stateString);\n\
  \  }\n};\n```\n\n当有来电到达时，Android 会调用监听器的 `onCallStateChanged` 方法。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 使用模拟器，你可以通过 Eclipse 的 Emulator Control 视图模拟来电。该视图在 DDMS 视图中默认可见可见。\n\n监听器的其他有用方法包括\
  \ `onCellLocationChanged`、`onDataActivity`、`onDataConnectionStateChanged` 和 `onSignal\
  \ StrengthsChanged`。要使用其中任何方法，你必须在 `AndroidManifest.xml` 文档中添加以下元素：\n\n```xml\n\
  <uses-permission\n    android:name=\"android.permission.READ_PHONE_STATE\">\n</uses-permission>\n\
  ```\n\n## 发送短信\n\n在我家乡，人们互相发送“文本消息”（text messages）。显然，世界上其他地方称之为 SMS（短消息服务）。无论你如何称呼它，发送简短手机间消息业务都是当今通信中的一项重要功能。\n\
  \nListing 3-3 展示了 Android 程序如何发送短信。\n\n### 什么是短信中心？\n\n当你发送短信时，消息会先发送到服务中心。服务中心在将消息转发给目标接收者之前将其存储。\n\
  \n这种“存储并转发”机制听起来可能很麻烦。但事实是，短信并不是同步的。当你打电话时，你是在与另一个声音实时交互。但当你发送短信时，对方可能不会立即阅读消息。事实上，接收者的手机可能处于关闭状态。\n\
  \n由于这种时间上的差异，短信发送需要一个缓冲区——服务中心。如果没有这个缓冲区，没有立即处理的消息将永远无法送达。短信发送需要发送者和接收者之间仔细的协调。\n\
  \n### Listing 3-3：发送短信\n\n```java\nSmsManager smsMgm = SmsManager.getDefault();\n\
  smsMgm.sendTextMessage(\"2345556789\", null,\n    \"Hello world\", null, null);\n\
  ```\n\n`sendTextMessage` 方法有五个参数：\n\n- 第一个参数是一个 Java 字符串，是目的地的电话号码。\n- 第二个参数是一个\
  \ Java 字符串，是服务中心地址（见旁边栏）。Listing 3-3 中的值 `null` 表示：“我不在乎消息如何到达目的地。直接发送吧！”\n- 第三个参数也是一个\
  \ Java 字符串，是消息内容。\n- 第四个和第五参数是 pending intents（等待意图）。\n\nAndroid 使用这两个 intent 来发送广播。第四个参数的广播在消息发送时通知系统。第五个参数的广播在消息被接收时通知系统。\n\
  \n![cross-reference.eps](img/cross-reference_fmt.jpeg) 有关 pending intents 的介绍，请参阅本小书的第\
  \ 2 章。\n\n![remember.eps](img/remember_fmt.jpeg) 要运行 Listing 3-3 中的代码，你的应用必须拥有 `android.permission.SEND_SMS`\
  \ 权限。\n\n## 使用设备传感器\n\n功能全 Android 设备不仅仅是一个电话。为了强调这一点，我列出了来自 `android.content.PackageManager`\
  \ 类的常量列表：\n\n- `android.content.PackageManager`\n- `BLUOTH`\n- `CAMERA`\n- `AUTOFOCUS`\n\
  - `FLASH`\n- `FRONT`\n- `LIVE_WALLPAPER`\n- `LOCATION`\n- `GPS`\n- `NETWORK`\n-\
  \ `MICROPHONE`\n- `NFC`\n- `LANDSCAPE`\n- `PORTRAIT`\n- `ACCELEROMETER`\n- `BAROMETER_BAROMETER`\n\
  - `COMPASS`\n- `GYROSCOPE`\n- `LIGHT`\n- `PROXIMITY`\n- `SIP`\n- `VOIP`\n- `TELEPHONY`\n\
  - `CDMA`\n- `GSM`\n- `TOUCHSCREEN`\n- `ACCESSORY`\n- `HOST`\n- `WIFI`\n\n其中一些常量是不言自明的，但另一些需要一些说明。例如，没有触摸屏的设备对触摸事件也有支持。（对于\
  \ `TOUCHSCREEN` 常量，`DISTINCT` 代表双指触摸，而 `JAZHAND` 代表五指触摸。）\n\n设备可以通过多种方式感知 `LOCATION`。一种粗略的方法是使用附近的手机基站猜测位置。使用\
  \ GPS（全球定位系统）要准确得多。在所有 `PackageManager` 的 `FEATURE` 常量中，我最喜欢的是 `_ BAROMETER`。我无法想象在买手机时会想：“这个型号不够好。我无法用它来测量气压。”\n\
  \n无论如何当你开始为设备传感器编程时，你将面临新类型的问题。传感器测量的底层物理是什么？你如何处理必要的数学计算？你如何处理本质上是模拟的世界中的微调？GPS\
  \ 传感器检测到位置变化。我的代码应该在它的 `onLocationChanged` 方法中进行处理，还是说变化太小以至于我应该将其视为背景噪声？\n\n##\
  \ 量化位置和方向\n\n你可能熟悉经度和纬度的术语，但以防万一：\n\n- 纬度在地球赤道上为 0，北极为 90 度，南极为 -90 度。\n- 经度在英国格林尼的皇家天文台为\
  \ 0。经度在格林尼以西为负，东方为正。经度在太平洋国际经线处为 180 度。\n\n在 Android 世界中，“方向”（orientation）一词有两个不同的（但密切相关的）含义：\n\
  \n- 屏幕的方向可以是竖屏（portrait）或横屏（landscape）。\n- 设备的方向是一个由三个数字组成的测量——偏航（yaw）、俯仰（pitch）和滚滚（roll）。\n\
  \n通常，当人们谈论或编写方向时，他们不会说“屏幕方向”或“设备方向”。他们只说“方向”。幸运的是，你可以从周围的术语中区分这两种方向：\n\n\n\n\n\n\
  ![remember.eps](img/remember_fmt.jpeg) 你可以在大多数 Android 设备上使用竖屏或横屏模式。因此，作为开发者，你在设计\
  \ App 界面时必须兼顾这两种模式。诚然，用户往往以竖屏模式持有手机，以横屏模式持有平板电脑。但当你定义 Activity 的布局时，必须考虑所有可能性。当用户平躺在沙发上抬头看设备时，你的\
  \ App 看起来良好吗？\n\n* 如果你将设备平放在地面上，使设备顶部指向地球磁北极，则设备的 `yaw`（偏航）、`pitch`（俯仰）和 `roll`（翻滚）值均等于\
  \ 0。（这假设地面是完全水平的。）\n\nAndroid 不使用度来测量 `yaw`、`pitch` 和 `roll`。相反，Android 方法返回的是弧度值。设备旋转半圈是\
  \ `Π` 弧度。完整的 360 度旋转是 `2Π` 弧度。度与弧度之间转换的最简单方法如下：\n\n* 要将度转换为弧度，将度数乘以 `0.01745327777777777778`。\n\
  * 要将弧度转换为度，将弧度乘以 `57.2958279087977743754`。\n\n不要纠结每个转换因子中的位数。如果你愿意，可以使用较少的位数。无论你使用多少位数字，这些数字都不是完全精确的。\n\
  \n![cross-reference.eps](img/cross-reference_fmt.jpeg) 有关 `yaw`、`pitch` 和 `roll`\
