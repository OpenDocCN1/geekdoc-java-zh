  \n恭喜！你已经创建了一个可分发的 APK 文件和一个用于未来更新的可重用密钥库（keystore）。\n\n## 为你的应用进行数字签名\n\nAndroid\
  \ 要求所有安装的应用都必须经过数字签名：\n\n• 没有任何例外：所有的 Android 应用都必须签名。系统将不会安装未签名的应用程序。\n\n当你在模拟器或你自己的设备上测试应用时，Android\
  \ 的开发工具之一会静静地使用来自 `debug.keystore` 文件的简单密钥对你的应用进行签名。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg)\
  \ 关于 `debug.keystore` 文件和数字签名其他方面的睡前读，请参阅旁边的“理解数字签名”侧边栏。\n\n• 你可以使用自签名证书为你的应用进行签名；不需要证书机构。\n\
  \n要阅读所有关于证书机构的信息，请查看旁边的侧边栏。\n\n• 当你准备将应用发布到市场时，必须使用私钥对其进行签名。你不能使用开发期间调试应用时签名 APK\
  \ 文件的调试密钥来发布应用。\n\n• 证书有有效期，该有效期仅在安装时进行验证。如果证书在应用安装后过期，应用将继续正常运行。\n\n• Eclipse 的\
  \ Android 工具可以完成应用签名的大部分工作。为了更精细的控制，你可以使用标准的 Java 工具（如 `keytool` 或 `jarsigner`）对你的\
  \ APK 文件进行签名。\n\n关于自行签名的更多信息，请参阅第 卷第 3 章。\n\n## 理解数字签名\n\n当你对某物进行数字签名时，你添加了一个只有你才能添加的位序列。你使用复杂的软件来创建该序列并将其嵌入你的\
  \ APK 文件中。创建此序列的软件使用了数论中的技术（在 1777 年到 1855 年之间的，卡尔·弗里德里希·高斯将数论称为“数学之皇”，他可不是开玩笑！）\n\
  \n数字签名实际上涉及两个位序列：\n\n![check.png](img/check.png) 私钥：一个你不与他人分享的序列。\n\n![check.png](img/check.png)\
  \ 公钥：一个你与他人分享的序列。\n\n私钥永远不会离开你的办公室，但你可以在时代广场的霓虹灯牌上显示公钥。如果你告诉别人你的私钥，你就得 . . .（嗯，你知道的）。但你可以雇佣一名飞行员在金门大桥上方的空中用白烟写下你的公钥。\n\
  \n要为应用签名，你需要运行一个向你的应用添加证书的软件。证书是一系列信息，包括你的私钥、你的公钥、一些识别你身份的信息以及其他信息。就像你在合同上的签名一样，证书的私钥很难伪造。但通过证书的公钥，用户设备上的程序会验证你的应用是否是正品。\n\
  \n用户从你应用的证书中获取密钥。但作为开发者，你将密钥与任何证书分开存储。你将公钥和私钥保存在你的软件可以检索到它们的地方——密钥库文件（keystore file）。当你对应用进行数字签名时，软件会从你的密钥库文件中抓取密钥，使用这些密钥创建证书，并将证书合并到你的\
  \ APK 文件中。如果你访问开发电脑的主目录，并深入到 `.android` 目录（以点开头），你可能可能会找到 `debug.keystore` 文件。这个\
  \ `debug.keystore` 文件包含了签名你应用草稿版本的密钥。（如需帮助查找主目录，请参阅第 卷第 3 章。）\n\n密钥库文件包含敏感信息，因此每个密钥库文件都受密码保护。Android\
  \ 的 `debug.keystore` 文件受密码保护。与大多数密钥库文件不同，`debug.keystore` 的密码是公开的。密码是 `android`。通过\
  \ Java 的 `keytool` 程序，任何人都可以使用 `debug.keystore` 文件中的密钥对任何应用签名。没关系，因为 `debug.keystore`\
  \ 文件的密钥无法发布在 Android 市场（或其他任何地方）的应用。因此，在发布应用之前，运行软件将你自己的密钥添加到应用中。\n\n下载你的应用后，用户的软件会应用公钥来验证你的应用是否已正确签名。这证明了什么？嗯，如果黑客在发布和用户下载之间的某处篡改了你的应用，测试就会检测到篡改。Android\
  \ 说：“我拒绝安装此应用。”\n\n但如果恶意黑客创建了一个有害应用并使用 Android 的工具对其签名呢？对于整个世界来说，该应用看起来是正常的。签名并不能证明开发者的意图。链条中的薄弱环节是\
  \ Android 应用是自签名的。当你为应用添加数字签名时，没有其他人与你签名。对于需要更多安全性的场景（通常与移动设备无关），开发者可以向证书机构寻求帮助。证书机构是一个颁发特殊数字签名的组织——世界非常信任这些签名。要获得这种签名，你需要说服证书机构你是好人，并向证书机构付费。有些证书机构免费提供签名。这些免费签名还可以，但并不像付费签名那样可靠。\n\
  \n![tip.eps](img/tip.jpeg) 如果应用使用了相同的签名，你可以创建相互通信的模块化应用。这允许应用在同一个进程中运行，并且根据需要，系统可以将它们视为单个应用。通过这种方法，你可以以模块的形式创建应用，用户可以根据需要更新每个模块。一个很好的例子是创建一个游戏，然后发布更新包来升级游戏。用户可以决定购买哪些更新。\n\
  \n\n\n\n\n## Java 的 keytool 应用\n\n`keytool` 允许您通过命令行创建自签名名的密钥库（keystore）。该工具位于 Android\
  \ SDK 的 `tools` 目录中，并通过命令行提供许多选项。\n\n接下来的章节描述了 Eclipse 导出向导（Export Wizard）的使用。（有关\
  \ Java `keytool` 应用的使用示例，请参阅第 VI 卷第 3 章。）\n\n## 保护您的密钥库\n\n密钥库文件包含您的私有证书，Android\
  \ 使用该证书在 Android 市场（Android Market）中识别您的应用程序。请将您的密钥库备份在安全的地方，因为如果丢失密钥库，您将无法使用相同的私钥对应用程序进行签名。因此，您无法升级应用程序，因为\
  \ Android 市场平台识别出该应用程序不是由同一个密钥签名，并限制您进行升级；市场会将该文件视为一个新的 Android 应用程序。如果您更改了应用的包名，也会发生这种情况；Android\
  \ 不会将其识别为有效更新，因为包名和/或证书是相同的。\n\n## 不要等待！进行混淆！\n\n静静地隐藏在您的项目目录中 true 一个 `proguard.cfg`\
  \ 文件。该 `proguard.cfg` 文件包含一个混淆代码的程序的配置信息。当您进行混淆时，您会使其变得难以阅读。您打乱内容，并通常做着与您编写清晰、可维护的代码时背道而驰的事。\n\
  \n为什么要这样做？混淆后的程序可以在适当的设备上无需修改即可执行。设备不需要密码，也不需要为了运行代码解密任何内容。事实上，对于 Dalvik 虚拟机来说，混淆后的程序没有任何异常。但对于一个试图对您的代码进行逆向工程的人来说，混淆是一场噩梦。这是因为人类大脑并不是机械地处理代码的。相反，人类会把握大局；人类必须理解事物才能对其进行操作；当人类处理晦涩、迂回且高度压缩的内容时，会感到压力。\n\
  \n因此，通过混淆代码，坏人无法轻易弄清楚您代码的工作原理。他们在窃取您的技巧方面会遇到困难（更重要的是），他们无法轻易向您发布的代码中添加病毒。\n\n在发布到\
  \ Android 市场之前，您必须混淆应用的代码。幸运的是，本章“创建 APK 文件”章节中的步骤已经为您完成了混淆。Eclipse 的向导会将 ProGuard\
  \ 工具应用到您的代码中，将您的代码变成任何试图摆弄它的人眼中令人眼晕的乱团。\n\nProGuard 是一个开源项目；其网站位于 [`http://proguard.sourceforge.net`](http://proguard.sourceforge.net)。\n\
  \n## 创建 Android 市场账户\n\n现在您已经创建了 APK 文件，就可以在 Android 市场上发布该应用程序了。为了做到，您需要创建一个 Android\
  \ 市场账户。创建此类账户，您需要一个 Google 账户。任何基于 Google 的账户（例如 Gmail 账户）都可以。如果您没有 Google 账户，可以访问\
  \ [`www.google.com/accounts`](http://www.google.com/accounts) 获取免费账户。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg)\
  \ 这是您在进入收费道路前的最后一个出口。对于 Android 市场账户，您需要使用信用卡支付一次性的 25 美元开发者费用。\n\n要创建 Android 市场账户，请按照以下步骤操作：\n\
  \n1. 打开您的网络浏览器并导航到 [`http://market.android.com/publish`](http://market.android.com/publish)。\n\
  2. 在屏幕右侧，使用您的 Google 账户登录，如图 1-6 所示。\n\n**图 1-6：** `http://market.android.com/publish`\
