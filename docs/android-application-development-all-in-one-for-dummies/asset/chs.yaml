  \n16. 在 `Text` 单词处输入几个字符，然后按回车（参见图 1-27）。\n\n17. 如必要，启动模拟器并将 App Inventor 连接到模拟器。\n\
  \n有关详细信息，请参见前面的章节“创建项目”。\n\n等待模拟器接收你的 Android 应用程序的最新更改。然后 . . .\n\n18. 点击模拟器屏幕上的按钮。\n\
