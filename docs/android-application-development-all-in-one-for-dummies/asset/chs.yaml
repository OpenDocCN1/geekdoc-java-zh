  \ void onSaveInstanceState(Bundle state) {\n  }\n}\n```\n\n\n\n\n```java\nsuper.onSaveInstanceState(state);\n\
  logStuff(\"onSaveInstanceState\");\n}\n/** 当 activity 从\n * Active 切换到 Paused 时调用。\n\
