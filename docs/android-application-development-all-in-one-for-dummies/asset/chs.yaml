  \ 事件处理器模块中添加模块，形成如图 1-32 所示的不完整分组。\n\n图 1-32 中的 `Join` 模块来自 `Blocks` 调色板中 `Built-In`\
  \ 标签页下的 `Text` 分类。当你连接两段文本时，你将这两部分转换为一个组合的整体。（也就是说，你拼接了这两部分。）\n\n在这个示例中，你计划连接三段文本。因此在下一步中，你将内容连接到现有的\
  \ `Join` 模块上。\n\n12. 向 `Notifier1.AfterTextInput` 处理器中添加另一个模块，形成如图 1-33 所示的不完整分组。\n\
