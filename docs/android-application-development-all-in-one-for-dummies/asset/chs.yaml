  \ 1-11 内容。名副其实，Android 将透明 Activity 的按钮叠加在栈中下一个 activity 之上。\n\n参考“Activity 生命周期”中的状态列表，暂停（Paused）状态的职责之一就是存放部分遮挡的\
  \ activity。因此，如果你在 Eclipse 的 LogCat 视图中点击透明 Activity 按钮，你会看到以下：\n\n**图 1-11：** 另一个\
