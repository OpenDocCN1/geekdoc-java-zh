  \n## 绘制、拖动和缩放\n\n毫无疑问——触摸屏非常酷。你只需按下普通的玻璃，设备就有了响应！（好吧。它确实不是普通的玻璃。但它仍然很神秘。）当你滑动手指时，某种绘画就会移动！在多点触控屏上，你可以对物体进行缩放、旋转和重塑形状。\n\
  \nAndroid 的软件支持涉及多达 256 个手指的事件。这大约相当于两半只蜈蚣同时在屏幕上行走。当然，人类很少在设备屏幕上使用超过两个手指。\n\n###\
  \ 概览\n\n列表 3-5 展示了触摸事件的处理。触摸事件与点击非常相似。最主要的区别是触摸事件涉及运动——你的手指（或手写笔）沿屏幕表面的滑动。\n\n###\
  \ 列表 3-5：处理触摸事件\n\n```java\npackage com.allcode.draw;\nimport android.app.Activity;\n\
  import android.content.Context;\nimport android.graphics.Canvas;\nimport android.graphics.Color;\n\
  import android.graphics.Paint;\nimport android.graphics.Rect;\nimport android.os.Bundle;\n\
  import android.util.DisplayMetrics;\nimport android.view.MotionEvent;\nimport android.view.View;\n\
  import android.view.View.OnTouchListener;\n\npublic class DrawStuff extends Activity\
  \ implements OnTouchListener {\n    View myView;\n    int numberOfFers = 0;\n  \
  \  float oldX[] = new float[2], oldY[] = new float[2];\n    Rect rectangle = new\
  \ Rect(0, 0, 100, 100);\n    DisplayMetrics metrics = new DisplayMetrics();\n\n\
  \    @Override\n    protected void onCreate(Bundle savedInstanceState) {\n     \
  \   super.onCreate(savedInstanceState);\n        myView = new MyView(this);\n  \
  \      setContentView(myView);\n        myView.setOnTouchListener(this);\n     \
  \   getWindow().getDisplay().getMetrics(metrics);\n    }\n\n    @Override\n    public\
  \ boolean onTouch(View view, MotionEvent event) {\n        switch (event.getActionMask())\
  \ {\n            case MotionEvent.ACTION_DOWN:\n                numberOfFers = 1;\n\
  \                oldX[0] = event.getX(0);\n                oldY[0] = event.getY(0);\n\
  \                break;\n            case MotionEvent.ACTION_POINTER_DOWN:\n   \
  \             numberOfFers = 2;\n                oldX[1] = event.getX(1);\n    \
  \            oldY[1] = event.getY(1);\n                break;\n            case\
  \ MotionEvent.ACTION_MOVE:\n                handleMove(event);\n               \
  \ break;\n            case MotionEvent.ACTION_POINTER_UP:\n            case MotionEvent.ACTION_UP:\n\
  \                numberOfFers--;\n                break;\n        }\n        view.invalidate();\n\
  \        return true;\n    }\n\n    // The handleMove 方法在列表 3-6 中。\n    void handleMove(MotionEvent\
  \ event) {\n        // Implementation omitted for brevity\n    }\n\n    class MyView\
  \ extends View {\n        Paint whitePaint = new Paint();\n        MyView(Context\
  \ context) {\n            super(context);\n            whitePaint.setColor(Color.WHITE);\n\
  \        }\n\n        @Override\n        protected void onDraw(Canvas canvas) {\n\
  \            canvas.drawRect(rectangle, whitePaint);\n        }\n    }\n}\n```\n\
  \n图 3-10 是本节示例运行的一张平淡的截图。\n\n**图 3-10：** 相信我！你可以移动并调整白色矩形的大小。\n\n\n\n\n内容视图是 `MyView`\
  \ 类的一个实例，我在列表 3-5 的末尾定义了这个类。`MyView` 类并不复杂。该类的主要用途是重写 `View` 类的 `onDraw` 方法。当 Android\
  \ 绘制 `MyView` 实例时，Android 会在画布上放置一个白色矩形。矩形本身（Android 的 `Rect` 类的实例）有四个属性：`left`、`top`、`right`\
  \ 和 `bottom`。（参见图 3-11。）每个属性代表像素值。\n\n在列表 3-5 中，`onTouch` 方法响应运动事件。运动事件的 `getActionMasked`\
  \ 方法返回运动的类型：\n\n*   当用户将一个手指放在屏幕上时，Android 触发 `MotionEvent.ACTION_DOWN`。随后当用户在屏幕上放置第二个手指时，Android\
  \ 触发 `MotionEvent.ACTION_POINTER_DOWN`。\n\n**图 3-11：** `Rect` 实例的属性。\n\n![9781118027707-fg040311.eps](img/9781118027707-fg040311_fmt.jpeg)\n\
  \n*   当用户从屏幕上抬第一个手指时，Android 触发 `MotionEvent.ACTION_UP`。\n*   当用户从屏幕上拿起第二个手指时，Android\
  \ 触发 `MotionEvent.ACTION_POINTER_UP`。\n*   当用户沿屏幕表面移动一个或多个手指时，Android 触发 `MotionEvent.ACTION_MOVE`。\n\
  \n![tip.eps](img/tip_fmt.jpeg) Android 拥有一些常量，例如 `ACTION_POINTER_2_UP` 和 `ACTION_POINTER_3_DOWN`，但这些名称已过时。要区分三个或更多手指，请查阅\
  \ Android SDK 文档中的 `MotionEvent.ACTION_POINTER_INDEX_MASK`。\n\n列表 3-5 中的 `onTouch`\
  \ 方法记录了用户手指落在屏幕上的像素坐标：\n\n*   `getX` 方法返回距离屏幕左边缘的像素数。\n*   `getY` 方法返回距离屏幕顶部的像素数。\n\
  *   在对 `getX` 和 `getY` 的调用中，参数 `0` 代表用户放在屏幕上的第一个手指。\n*   参数 `1` 代表用户放在屏幕上的第二个手指。\n\
  \n除了这些简单的记录工作外，`onTouch` 方法将大部分代码计算工作交给了 `handleMove` 方法。（列表 3-6 中的 `handleMove`\
  \ 方法——在本章稍后部分显示——负责计算白色矩形的新尺寸和位置。）\n\n在 `onTouch` 方法的末尾，我调用了 `view.invalidate()`。这告诉\
  \ Android 屏幕上该视图的渲染不再有效。因此，Android 必须重新绘制该视图。这意味着 Android 必须调用视图的 `onDraw` 方法。\n\
  \n在 `onTouch` 方法结束时，返回值 `true` 表示该方法已彻底处理了该运动事件。任何其他认为自己将处理该运动事件的方法都可以去远远了。\n\n\
  ![tip.eps](img/tip_fmt.jpeg) 本节的应用不应响应屏幕倾斜。要保持屏幕处于横屏模式，请在 `AndroidManifest.xml`\
  \ 文档中 activity 的启动标签中添加 `android:screenOrientation=\"landscape\"`。\n\n### 细节\n\n\
  在屏幕上移动控件（gizmos）可能涉及一些有趣的数学知识。事实上，大多数图形包使用矩阵变换来调整项目的形状和大小。但在本节中，我折中了。我没有使用 Android\
  \ SDK 中简洁的数学工具，而是采用了一些简单（可能更直观）的测量方法。列表 3-6 包含了代码。\n\n### 列表 3-6：拖动与缩放\n\n```\n\
  float newX[] = new float[2], newY[] = new float[2];\nint xChange[] = new int[2],\
  \ yChange[] = new int[2];\nint diffX, diffY;\nint newLeft = rectangle.left, newTop\
  \ = rectangle.top,\n    newRight = rectangle.right,\n    newBottom = rectangle.bottom;\n\
  void handleMove(MotionEvent event) {\n  newX[0] = Math.round(event.getX(0));\n \
  \ newY[0] = Math.round(event.getY(0));\n  xChange[0] = Math.round(newX[0] - oldX[0]);\n\
  \  yChange[0] = Math.round(newY[0] - oldY[0]);\n  oldX[0] = newX[0];\n  oldY[0]\
  \ = newY[0];\n  switch (numberOfFingers) {\n    case 1:\n      newLeft = rectangle.left\
  \ + xChange[0];\n      newTop = rectangle.top + yChange[0];\n      newRight = rectangle.right\
  \ + xChange[0];\n      newBottom = rectangle.bottom + yChange[0];\n      if (newLeft\
  \ < 0 || newRight > metrics.width) {\n        newLeft = rectangle.left;\n      \
  \  newRight = rectangle.right;\n      }\n      if (newTop < 0 || newBottom > metrics.height)\
  \ {\n        newTop = rectangle.top;\n        newBottom = rectangle.bottom;\n  \
  \    }\n      rectangle = new Rect(newLeft, newTop, newRight, newBottom);\n    \
  \  break;\n    case 2:\n      newX[1] = Math.round(event.getX(1));\n      newY[1]\
  \ = Math.round(event.getY(1));\n      xChange[1] = Math.round(newX[1] - oldX[1]);\n\
  \      yChange[1] = Math.round(newY[1] - oldY[1]);\n      oldX[1] = newX[1];\n \
  \     oldY[1] = newY[1];\n      newLeft = rectangle.left + xChange[1];\n      newTop\
  \ = rectangle.top + yChange[1];\n      newRight = rectangle.right + xChange[1];\n\
  \      newBottom = rectangle.bottom + yChange[1];\n      view.invalidate();\n  \
  \    break;\n  }\n}\n```\n\n\n\n你可能对 Java 线程的使用非常熟悉。代码可以创建一个新线程。通过两个执行线程（主线程和新创建的线程），你的代码可以同时完成两件事。一个线程等待网页，而另一个线程处理按钮点击和其他与用户相关的事件。新线程就像是一条侧道。当一辆大卡车堵塞这条侧道时，汽车仍然继续在主公路上流动。\n\
  \n但是，仅仅创建新的 Java 线程并不能完全解决问题。Android 的线程规则规定，除了主线程外，任何线程都不能更新应用程序的用户界面。例如，你的辅助线程可以等待从网络获取图像。但在图像下载完成后，辅助线程无法轻松地显示该图像。\n\
  \n为了从根本上解决这个问题，Android 提供了一个抽象的 `AsyncTask` 类。`AsyncTask` 在单独的线程中执行应用程序的耗时工作，并将有用的结果返回给应用的主线程。此外，`AsyncTask`\
  \ 具有许多方法，可以以一种合理、填空的方式来组织代码。\n\n当然，你通过 `AsyncTask` 执行的工作有许多种形式和类型。这就是为什么 `AsyncTask`\
  \ 类具有泛型参数。\n\n![remember.eps](img/remember_fmt.jpeg) 尽管命名如此，Android 的 `AsyncTask`\
  \ 类与构成任务的活动（activity）栈并没有共同之处。确实，我有时用“任务”一词来指代 Activity 栈或 `AsyncTask` 实例。但这两类任务是不同的。要回顾\
  \ Activity，请参阅第 1 章和第 2 章。\n\n### 创建 AsyncTask\n\n列表 3-7 中的 `AsyncTask` 从网络获取图像。在此期间，代码会更新显示在设备屏幕上的进度条。\n\
  \n### 列表 3-7：从网站获取图像\n\n```javaclass MyAsyncTask extends AsyncTask<String, Integer,\
  \ Bitmap> {\n    int progress;\n\n    @Override\n    protected void onPreExecute()\
  \ {\n        progress = 0;\n        button.setClickable(false);\n    }\n\n    @Override\n\
  \    protected Bitmap doInBackground(String... urlArray) {\n        try {\n    \
  \        URL url = new URL(urlArray[0]);\n            HttpURLConnection connection\
  \ = (HttpURLConnection) url.openConnection();\n            connection.setDoInput(true);\n\
  \            connection.connect();\n            progress += 50;\n            publishProgress(progress);\n\
  \            InputStream input = connection.getInputStream();\n            Bitmap\
  \ bitmap = BitmapFactory.decodeStream(input);\n            progress += 50;\n   \
  \         publishProgress(progress);\n            return bitmap;\n        } catch\
  \ (IOException e) {\n            e.printStackTrace();\n            return null;\n\
  \        }\n    }\n\n    @Override\n    protected void onProgressUpdate(Integer...\
  \ progressArray) {\n        progressBar.setProgress(progressArray[0]);\n    }\n\n\
  \    @Override\n    protected void onPostExecute(Bitmap result) {\n        imageView.setImageBitmap(result);\n\
  \        button.setClickable(true);\n    }\n}\n```\n\n列表 3-7 中的代码是一个内部类；它应该嵌套在应用的主\
  \ Activity 内部（或应用中的其他某个类内部）。当你扩展 `AsyncTask` 时，你必须提供三个泛型参数 `<String, Integer, Bitmap>`\
  \ 和四个方法：\n\n- 第一个泛型参数（列表 3-7 中的 `String`）描述了任务的 `doInBackground` 方法的输入类型。将其想为任务执行其工作所需的输入类型。在列表\
  \ 3-7 中，`doInBackground` 方法的参数是一个字符串的可变长度数组。方法体仅使用一个字符串（存储在 `urlArray` 初始元素中的值）。代码使用该字符串就像你使用任何网页地址一样——用于获取网页（在本例中，是获取图像）。\n\
  - 第二个泛型参数（列表 3-7 中的 `Integer`）描述了任务的 `onProgressUpdate` 方法的输入类型。将其想为描述进度条状态的信息类型。在列表\
  \ 3-7 中，`onProgressUpdate` 方法的参数是一个 `Integer` 值的可变长度数组。方法体仅使用一个整数（存储在 `progressArray`\
  \ 初始元素中的值）。代码调用进度条的 `setProgress` 方法使进度条显示当前状态。\n- 第三个泛型参数（列表 3-7 中的 `Bitmap`）描述了任务\
  \ `doInBackground` 方法的结果类型，这同时也是任务 `onPostExecute` 方法的输入类型。将其想为运行运行后产生的信息类型。在列表\
  \ 3-7 中，`onPostExecute` 方法将位图（从网站获取的位图）传递给 Activity 的 `imageView` 对象。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 当你创建 `AsyncTask` 时，三个泛型参数中的任何或全部都可以是 `Void`。（Java 的 `Void` 类存储了原始 `void` 类型——多线程代码。）\n\
  \n### 使用进度条\n\n很久以前我听过一个故事。我不知道在哪里听的。所以如果你是这个故事的作者，请通过电子邮件与我联系，我会在下一版中注明来源。总之，这个故事发生在一栋电梯太少的高层办公大楼里。人们不耐烦地等待从大厅前往较高楼层。大楼业主获取了增加更多电梯的估价，价格非常惊人。\n\
  \n为了解决这个问题，业主在每部电梯旁边旁边安装了通墙的镜子。结果是，人们停下来检查自己的容貌。从那时起，没有人再抱怨电梯太慢了。\n\n显然，这个故事有一个重要的寓意。这个寓意是，你不一定要加快进程。但在进程运行期间，你必须让用户忙起来。这就是进度条的作用。图\
  \ 3-12 显示了本节的进度条。\n\n我们使用以下代码定义此示例中的进度条：\n\n```xml\n<ProgressBar android:id=\"@+id/progressBar1\"\
  \n    style=\"?android:attr/progressBarStyleHorizontal\"\n    android:max=\"100\"\
  \n    android:layout_width=\"fill_parent\"\n    android:layout_height=\"wrap_content\"\
  />\n```\n\nAndroid 内置的 `android.R.attr.progressBarStyleHorizontal` 资源描述了图 3-12 中的进度条。`android:max=\"\
  100\"` 属性告诉应用程序在调用 `progressBar.setProgress(100)` 时显示完成的进度条，并在 `0` 到 `100` 之间的值显示部分完成的进度条。\n\
  \n**图 3-12：** 水平进度条。\n\n![9781118027707-fg040312.tif](img/9781118027707-fg040312_fmt.jpeg)\n\
  \n对于本节的示例，如果使用 `style=\"?android:attr/progressBarStyleLarge\"` 可能会更好，它显示一个没有进度百分比的旋转圆。但我选择水平样式是为了说明进度更新的使用。\n\
  \n\n\n\n![remember.eps](img/remember_fmt.jpeg) 在列表 3-7 中，我在 `doInBackground` 方法中选取了两个点来更改进度值并更新进度条的显示。我这样做是为了说明水平进度条的用法。但实际上，列表\
  \ 3-7 中的进度条很容易让用户感到反感。只有三个值（`0`、`50`、`100`）的进度条无法给用户提供太多有用信息。而且，列表 3-7 中 `doInBackground`\
  \ 方法的工作执行时机可能并不是 50/50 分配的。当你创建一个真实的应用时，请务考虑考虑进度条的更新。尽力让它们反映任务的预期时间。如果时间不可预测，请使用\
  \ `progressBarStyleSmall`、`progressBarStyleLarge` 或 `android.R.attr` 类中其他不带百分比的类型。\n\
