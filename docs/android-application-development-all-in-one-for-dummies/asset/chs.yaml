  \n![9781118027707-fg060111.tif](img/9781118027707-fg060111_fmt.jpeg)\n\n### 排列屏幕元素\n\
  \nApp Inventor 没有提供 Android SDK 的所有布局设施。例如，`Designer` 调板没有 `Relative` 布局。通常情况下，`Designer`\
  \ 的选项没有 SDK 布局那么丰富。但通过 `Designer` 调板的 `Screen Arrangement` 组件，你可以很大程度上自定义你的 Android\
  \ 应用的外观。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 人们会好奇是否可以兼得。你可以用\
  \ App Inventor 在几分钟内创建一个 Android 应用。\n\n要在屏幕上排列组件，请执行以下操作：\n\n1. 在 `Designer` 调板中找到\
  \ `VerticalArrangement`。\n\n见图 1-12。\n\n2. 将 `VerticalArrangement` 从调板拖到 `Designer`\
  \ 屏幕上。\n\n`Designer` 视图器中出现了一个空矩形。\n\n**图 1-12:** `Designer` 调板中的 `Vertical Arrangement`。\n\
  \n![9781118027707-fg060112.tif](img/9781118027707-fg060112_fmt.jpeg)\n\n**图 1-13:**\
  \ 屏幕包含一个空的 `Vertical Arrangement`。\n\n![9781118027707-fg060113.tif](img/9781118027707-fg060113_fmt.jpeg)\n\
  \n3. 从调板将 `Button` 拖入 `VerticalArrangement` 框中。\n\n`VerticalArrangement` 缩小以该按钮。\n\
  \n4. 从调板将第二个 `Button` 拖入 `VerticalArrangement` 框中。\n\n`VerticalArrangement` 增大以容纳该按钮。布局内部的按钮垂直排列，因为这种布局是\
  \ `VerticalArrangement`。（见图 1-14。）\n\n**图 1-14:** `Vertical Arrangement` 内部的两个组件。\n\
  \n![9781118027707-fg060114.tif](img/9781118027707-fg060114_fmt.jpeg)\n\n5. 在 `Designer`\
  \ 视图器或 `Components` 树中选中 `VerticalArrangement`。\n\n6. 在 `Properties` 属性面板中选择 `Width`\
  \ 字段。\n\n出现一个小小的 `Width` 对话框。（见图 1-15。）\n\n7. 在 `Width` 对话框中选择 `Fill Parent` 选项。\n\
  \n8. 在 `Width` 对话框中点击 `OK`。\n\n结果，`VerticalArrangement` 跨越了整个 `Designer` 视图器屏幕。（见图\
  \ 1-16。）\n\n\n\n\n到目前为止一切顺利。但布局黑科技（layout hack）中尴尬的部分现在来了。\n\n9. 从设计器（Designer）面板中拖入两个\
  \ `HorizontalArrangement` 组件到 `VerticalArrangement` 中。\n10. 将设计器查看器屏幕上的按钮拖入 `HorizontalArrangement`\
  \ 组件中。\n\n也就是说，将一个按钮拖入一个 `HorizontalArrangement`，将另一个按钮拖入另一个 `HorizontalArrangement`。（参见图\
  \ 1-17。）\n11. 从面板中拖入四个新标签（labels）到 `HorizontalArrangement` 组件中，用两个标签包围每个按钮。（参见图\
  \ 1-18。）\n12. 将每个标签的 `Width` 属性设置为 `Fill Parent`（填充父容器）选项。\n\n关于设置组件的 `Width` 属性的详情，请参见步骤\
  \ 5–8。\n13. 将两个 `HorizontalArrangement` 组件的属性都设置为（是）`Fill Parent` 选项。\n\n此时，所有内容都拉伸了整个设计器查看器屏幕。唯一的痛点是每个标签中的文本。\n\
  \n**图 1-16：** `Vertical-Arrangement` 填充了它的父容器。\n\n![9781118027707-fg060116.tif](img/9781118027707-fg060116_fmt.jpeg)\n\
  \n**图 1-17：** 每个 `Horizontal-Arrangement` 中有一个按钮。\n\n![9781118027707-fg060117.tif](img/9781118027707-fg060117_fmt.jpeg)\n\
