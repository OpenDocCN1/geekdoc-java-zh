  \ 接口。（看到了吗？你不需要写 `WeatherInterface.java`，因为 `WeatherInterface.java` 属于 Android 的包之一——而不是你的包。）你可以查看一眼\
  \ `gen` 文件夹中的 `WeatherInterface.java` 文件，但如果你不看也同样会开心。\n\n列表 3-12 包含了列表 3-6 中服务的\
  \ AIDL 版本。为了方便你阅读，我将 AIDL 特有的代码加粗了。\n\n列表 3-12：使用 AIDL 的服务\n\n```java\npackage com.allmycode.services;\n\
