  \ 来获得类似的 XML 响应。在这个地址中，字符 `%20` 是 Web 编码空格的方式。\n\n* 在服务中，将 Google 的响应提交给 XML 解析器。\n\
  \n\n\n\n\nXML 解析器是一个从 XML 文件中筛选信息的程序。本节的代码包含一个解析器，它可以从 Google 的响应中提取出华氏度温度和天气状况。（预先向非美国、非伯利兹的读者表示歉意，我使用了华氏度量衡。坏习惯是很难改掉的。）\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 在过去，在 XML 被广泛使用之前，你的应用程序通常会进行“屏幕抓取”（screen\
  \ scraping）。屏幕抓取是指从普通网页中搜寻数据的做法。在 XML 时代，你的代码必须消除页面的颜色、字体标签、广告以及任何其他无关材料。然后，你的代码必须在页面中搜索当前的华氏度温度，并尽力避免抓取到下周的预报或《天气与葡萄酒周刊》（Weather\
  \ and Wine Weekly）的订阅费用。接着，你只能希望网站布局的未来任何变化都不会破坏你代码的正确性。无疑，解析 XML 要可靠得多。\n\n*  \
  \ 作为最后一步，你的服务获取从 XML 解析器返回的结果，并将该结果转发给客户端应用。\n\n## 处理 XML\n\n列表 3-8 包含一个看起来无害的 `Weather`\
  \ 类，而列表 3-9 包含一个 XML 解析器。\n\n### 列表 3-8：Weather 类\n\n```java\npackage com.allmycode.services;\n\
  \npublic class Weather {\n  private int temperature = 0;\n  private String condition\
  \ = \"\";\n  public Weather() {\n  }\n  public Integer getTemperature() {\n    return\
  \ temperature;\n  }\n  public void setTemperature(Integer temperature) {\n    this.temperature\
  \ = temperature;\n  }\n  public String getCondition() {\n    return condition;\n\
  \  }\n  public void setCondition(String condition) {\n    this.condition = condition;\n\
  \  }\n}\n```\n\n### 列表 3-9：当发现 XML 元素时该做什么\n\n```java\npackage com.allmycode.services;\n\
  \nimport org.xml.sax.Attributes;\nimport org.xml.sax.SAXException;\nimport org.xml.sax.helpers.DefaultHandler;\n\
  \npublic class MySaxHandler extends DefaultHandler {\n  private static final String\
  \ CURRENT_CONDITIONS =\n      \"current_conditions\";\n  private static final String\
  \ DATA = \"data\";\n  private static final String CONDITION = \"condition\";\n \
  \ private static final String TEMP_F = \"temp_f\";\n  private Weather weather =\
  \ new Weather();\n  private boolean current_conditions = false;\n  public Weather\
  \ getWeather() {\n    return weather;\n  }\n  @Override\n  public void startElement(String\
  \ namespaceURI,\n      String localName, String qName,\n      Attributes attributes)\
  \ throws SAXException {\n    if (localName.equals(CURRENT_CONDITIONS)) {\n     \
  \ current_conditions = true;\n    } else {\n      if (current_conditions) {\n  \
  \        if (localName.equals(TEMP_F)) {\n            String dataAttribute =\n \
  \               attributes.getValue(DATA);\n            weather.setTemperature(Integer\n\
  \              .parseInt(dataAttribute));\n          } else if (localName.equals(CONDITION))\
  \ {\n            String condAttribute =\n                attributes.getValue(DATA);\n\
  \            weather.setCondition(condAttribute);\n          }\n        }\n    }\n\
  \  }\n  @Override\n  public void endElement(String namespaceURI,\n      String localName,\
  \ String qName) throws SAXException {\n    if (localName.equals(CURRENT_CONDITIONS))\
  \ {\n      current_conditions = false;\n    }\n  }\n}\n```\n\n列表 3-9 中的代码与 XML 的关系多于与\
  \ Android 的，因此我不会详细介绍列表 3-9 中的代码。简而言之，XML 解析器有两种类型：SAX 解析器和 DOM 解析器。SAX 的缩写代表 Simple\
  \ API for XML（XML Simple API），DOM 的缩写代表 Document Object Model（文档对象模型）。列表 3-9 使用\
  \ SAX 是因为 SAX 解析器的内存占用比 DOM 解析器小。\n\nDOM 解析器会分解 XML 文档，将所有这些信息加载到内存中，然后让你查询解析器文档中任何位置的值。你问：“`<current_conditions>`\
  \ 元素中 `<temp_f>` 元素内的 `data` 属性值是多少？” DOM 解析器会回答，但只有在分析完整个文档之后。SAX 解析器一次扫描 XML 文档的一个片段，内存中只保留当前的片段。在每一步，解析器都会提议报告它的发现。“我发现了一个起始标签”或“我发现了一个属性，”解析器如是说道。列表\
  \ 3-9 中的代码监控解析发现的相关数据，并将任何有用数据添加到 `Weather` 类的实例中。![cross-reference.eps](img/cross-reference.jpeg)\
  \ 关于如何解读 XML 内容的一些提示，请参见第二卷第 5 章。\n\n# 从在线服务器获取信息\n\n列表 3-10 包含了向 Google 天气 API\
  \ 提交位置、调用 XML 解析器以及将解析器结果转换为可用字符串的代码。只需将列表 3-10 的代码添加到列表 3-7 的代码中。\n\n### 列表 3-10：从\
  \ Google 获取信息\n\n```java\nString getWeatherString(Message message) {\n  Bundle query\
  \ = message.getData();\n  String location = query.getString(\"location\");\n  String\
  \ weatherString;\n  if (location != null && !location.equals(\"\")) {\n    Weather\
  \ weather = getWeather(location);\n    weatherString =\n      Integer.toString(weather.getTemperature())\n\
  \      + (char) 0x00B0 + \" F \"\n      + weather.getCondition();\n  } else {\n\
  \    weatherString = \"It’s dark at night.\";\n  }\n  return weatherString;\n}\n\
  private static final String GOOGLE_WEATHER_URL =\n    \"http://www.google.com/ig/api?weather=\"\
  ;\npublic Weather getWeather(String location) {\n  URL url;\n  Weather weather =\
  \ null;\n  try {\n    url =\n      new URL(GOOGLE_WEATHER_URL\n        + location.replace(\"\
  \ \", \"%20\"));\n    SAXParser parser =\n        SAXParserFactory.newInstance().newSAXParser();\n\
  \    XMLReader reader = parser.getXMLReader();\n    MySaxHandler saxHandler = new\
  \ MySaxHandler();\n    reader.setContentHandler(saxHandler);\n    reader.parse(new\
  \ InputSource(url.openStream()));\n    weather = saxHandler.getWeather();\n  } catch\
  \ (Exception e) {\n    e.printStackTrace();\n  }\n  return weather;\n}\n```\n\n\n\
  \n\nAIDL 不仅仅是一种语言，它还是一种编程范式。AIDL 是重写你的部分 Java 代码的一种方式，使其更加自然、更加直观。\n\n在列表 3-6 和\
  \ 3-7 中，一个服务及其客户端来回传递消息。消息传递范式很好，但如果客户端能够简单地调用服务的一个方法，生活难道不是更简单吗？这正是 AIDL 为你的代码所做的。\n\
  \n## 使用 AIDL\n\n以下是 AIDL 的工作原理：\n\n1. 从服务和一个客户端开始（例如列表 3-6 和 3-7 中的代码），并创建一个 `.aidl`\
  \ 文件。`.aidl` 文件描述了在服务和服务客户端之间传递的类型类型。\n2. 将 `.aidl` 文件的副本分别放在服务项目和客户端项目中。`.aidl`\
  \ 文件属于服务的包（package）。因此，为了在客户端项目中放置一个 `.aidl` 文件的副本，你需要在客户端项目中创建服务包的对应版本。参见图 3-5，在图中，在一些花哨的照片编辑软件的帮助下，两个项目的源文件夹都是可见的。当你向这两个项目添加\
  \ `.aidl` 文件时，Eclipse 会自动生成新的 Java 代码。你可以在图 3-5 项目的 `gen` 文件夹中看到这一证据。\n3. 在客户端中，移除发送消息的代码，并添加直接（至少表面上）调用服务方法的代码。\n\
  4. 在服务中，移除对 `Messenger` 类的引用和传入的处理器类（handler class）。\n\n使用 AIDL，客户端和服务端都不需要显式的消息传递器（messenger）。此外，服务内部的方法被直接调用了（至少表面上），因此服务不再需要传入的处理器类。（嗯，这几乎是如此。）\n\
  \n**图 3-5：** 服务项目和客户端项目中的源文件夹。\n\n![9781118027707-fg030305.tif](img/9781118027707-fg030305_fmt.jpeg)\n\
  \n## AIDL 和 Java 代码\n\n列表 3-11 显示了我的 `WeatherInterface.aidl` 文件。该文件几乎是一个普通的 Java\
  \ 源文件。主要的区别在于使用了非 Java 关键字 `in`。这个 `in` 关键字告诉世界，服务代码接收一个 `String` 值（而不是发送一个 `String`\
  \ 值）。\n\n列表 3-11：WeatherInterface.aidl 文件\n\n```java\npackage com.allmycode.services;\n\
  interface WeatherInterface\n{\n    String fetchWeather(in String location);\n}\n\
  ```\n\nEclipse 会根据你在 `WeatherInterface.aidl` 文件中提供的信息自动生成 `WeatherInterface.java`\
