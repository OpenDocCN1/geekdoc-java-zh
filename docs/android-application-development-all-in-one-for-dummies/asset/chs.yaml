  \n2.  向你的项目添加一个新的 Java 类。在列表 4-6 中，我将类命名为 `DocsActivityVerbose`。\n\n列表 4-6：一个作为\
  \ Fragment 的 Activity\n\n```java\npackage com.allmycode.frag;\n\nimport android.app.Activity;\n\
  import android.app.FragmentTransaction;\nimport android.os.Bundle;\n\npublic class\
