  \n# 第 2 章：更多 App Inventor 魔法\n\n## 本章内容\n\n* ![check.png](img/check.png) 拍照并发送消息\n\
  * ![check.png](img/check.png) 测量设备倾斜\n* ![check.png](img/check.png) 让物体在屏幕上移动\n\
  * ![check.png](img/check.png) 存储和访问数据\n* ![check.png](img/check.png) 启动另一个应用\n\n\
  这本微型书籍的第 1 章为你介绍了 Google App Inventor 的精彩世界。“很高兴见到你，”你对 App Inventor 说道。就像任何新关系一样，初次结识结束了，随后进入了相互进一步了解的阶段。因此，在本章中，你将在午餐时通过咖啡和\
  \ App Inventor 一起放松，并发现更多关于创建 Android 应用程序的知识。\n\n## 拍摄照片\n\nApp Inventor 可以访问相机。要检查它：\n\
  \n1. 创建一个新的 App Inventor 项目。\n2. 在 Designer 视图中放入相机。\n3. （可选）在按钮上写“拍摄照片”。\n4. 在\
  \ Media 分类中找到相机。\n5. 将相机拖入 Designer 视图。\n6. 将 `Camera1` 重命名为其他名称。\n7. 打开 Blocks\
  \ 编辑器。\n8. 启动模拟器或连接手机。\n\n如果你好奇，图 2-1 显示了这一点。\n\n**图 2-1：** 当用户点击按钮时，拍照。\n\n![9781118027707-fg060131.tif](img/9781118027707-fg060131_fmt.jpeg)\n\
  \n*(由于原文中存在重复和乱码，已根据逻辑流进行了清理)*\n\n**图 2-2：** 点击按钮的结果。\n\n![9781118027707-fg060132.tif](img/9781118027707-fg060132_fmt.jpeg)\n\
  \n**图 2-3：** 点击按钮的结果。\n\n![9781118027707-fg060133.tif](img/9781118027707-fg060133_fmt.jpeg)\n\
  \n## 发送短信\n\nSMS 是短消息服务——一种允许从一个移动设备向另一个发送消息的技术。本节的示例使用 App Inventor 发送此类消息：\n\n\
  1. 创建一个新的 App Inventor 项目。\n2. 在 Designer 视图中放入两个 `TextBox` 组件和一个 `Button` 组件。\n\
  3. （可选）为每个 `TextBox` 添加提示文字。\n4. （可选）在按钮上写“发送消息”。\n5. 在属性表上，勾选属于电话号码文本框的 `NumbersOnly`\
  \ 复选框。\n\n\n\n当用户选择文本框时，`NumbersOnly` 会告诉键盘以数字模式弹出。此外，`NumbersOnly` 可以防止用户在文本框中输入字母和其他奇怪的字符。\n\
  \n6\\. 在设计器（Designer）面板的社交（Social）类别中，找到 `Texting` 组件，将其从设计器面板拖到设计器查看器中。\n\n你没有在设计器查看器的屏幕上看到新的\
  \ `Texting` 组件。但在组件（Components）树中，你会看到一个标记为 `Texting1` 的分支。\n\n7\\. 打开块（Blocks）编辑器。\n\
  \n8\\. 在块（Blocks）查看器中，添加并对齐块，如图 2-5 所示。\n\n在图 2-5 中，第二个设置器块（setter block）用于 `Texting1.Message`。我在第\
  \ 2 步中所谓的简短消息体在这个设置器块中简单地称为 `Message`。因此，此块获取第二个文本框中的任何内容并将其作为短信正文发送。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 你可以将几个块一个接一个地挤进处理器块（handler block）的插槽中。在图 2-5 中，我将两个设置器块以及一个 `Texting1.SendMessage`\
  \ 块放入 `Button1.Click` 插槽中。这是没问题的。当用户点击 `Button1` 时，设备会顺序执行处理器块的指令。首先，设备设置 `PhoneNumber`。接下来，设备设置\
  \ `Message`（即消息正文）。最后，设备执行 `Texting1.SendMessage`。\n\n9\\. 在真手机上测试你的应用。\n\n输入一个电话号码和简短的消息体。当你按下\
  \ `Send a Message` 按钮时，你的手机会发送短信。（如果你在模拟器上测试应用，按下 `Send a Message` 按钮时什么都不会发生。这很令人失望丧，但至少没有发生什么坏事！）\n\
  \n![cross-reference.eps](img/cross-reference_fmt.jpeg) 如需将手机或平板电脑设备连接到开发计算机，请参见第一部分第\
  \ 3 章。\n\n**图 2-5：** 当用户点击按钮时，发送短信。\n\n![9781118027707-fg060205.tif](img/9781118027707-fg060205_fmt.jpeg)\n\
  \n# 环东方旅行\n\n设备方向传感器会跟踪设备面向的方向。屏幕朝向天空且顶部朝北的手机其偏航角（yaw）、俯角（pitch）和滚角（roll）均为 0。如果你顺时针旋转手机（保持其平放在地面上），偏航角会增加。（参见图\
  \ 2-6。）四分之一圈代表 90 度。例如，顶部面向东的手机偏航角为 90。顶部面向西的手机偏航角为 270。\n\n要在 App Inventor 项目中使用方向设置，请尝试以下操作：\n\
  \n1\\. 创建一个新的 App Inventor 项目。\n\n2\\. 将三个 `Label` 组件拖到设计器查看器中。\n\n一个标签用于设备的偏航角，另一个标签用于俯角，第三个标签用于滚角。\n\
  \n**图 2-6：** 偏航角、俯角和滚角。\n\n![9781118027707-fg060206.eps](img/9781118027707-fg060206_fmt.jpeg)\n\
  \n## 角度与方向\n\nAndroid 的方向和物体移动函数使用几何角度来描述方向。如果你上过几何课程，并且还没有忘记记忆，你可能还记得以下事实：\n\n\
  ![check.png](img/check.png) 0 度角指向右侧。（想象一个指针只指向 3 点的模拟钟。）看下方的图。\n\n![check.png](img/check.png)\
  \ 90 度角指向上方。（想象一个指针只指向 12 点的模拟钟。）\n\n![check.png](img/check.png) 随着指针逆时针旋转，度数会随之增加。\n\
  \n![check.png](img/check.png) 180 度角指向左侧（指向 9 点钟）。\n\n![check.png](img/check.png)\
  \ 360 度角已经逆时针绕了整整一圈。像 0 度角一样，360 度角指向右侧。\n\n这些事实（以及其他几个事实）在下图中所示。\n\n要将这些内容与手机的方向联系起来，你需要设置一个观察点。例如，如果你进行某个（诚然是愚蠢的）实验，你手机的偏航角变化与图中度数的变化完全一致。以下是实验步骤：\n\
  \n首先，将手机放在玻璃桌子上，手机屏幕朝天花板，手机顶部朝北。手机的偏航角、俯角和滚角均为 0。然后，爬到桌子下面透过玻璃向上看手机的背面。调整头部位置，使头顶面向东。现在手机的偏航角变化与图中的角度完全一致。\n\
  \n完成实验后，起来并向大家解释你为什么躺在桌子底下。\n\n![9781118027707-sb060201.eps](img/9781118027707-sb060201_fmt.jpeg)\n\
  \n3\\. 将一个 `OrientationSensor` 组件拖到设计器查看器中。\n\n可以在设计器面板的传感器（Sensors）类别中找到 `OrientationSensor`。（这真惊喜！）你没有在设计器查看器的屏幕上看到它。\n\
  \n4\\. 在同一位置拖入一个 `Clock` 组件。\n\n可以在设计器面板的基础（Basic）类别中找到 `Clock` 组件。![warning_bomb.eps](img/warning_bomb.jpeg)\
  \ `Clock` 这个名字有点误导性。它暗示了时间，但它跟踪的是毫秒。\n\n5\\. 选择 `Clock` 组件。\n\n6\\. 在属性表中，将 `TimerInterval`\
  \ 属性设置为 `500`。\n\n7\\. 打开块（Blocks）编辑器。\n\n8\\. 在块查看器中，添加并对齐块，使其类似于 2-5。\n\n9\\.\
  \ 将手机连接到电脑，并运行吧！\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg) 此部分看起来就像图\
  \ 2-7。（至少在秒内是这样。）\n\n**图 2-7：** 每秒刷新一次标签上的偏航角、俯角和滚角值。\n\n![9781118027707-fg060207.tif](img/9781118027707-fg060207_fmt.jpeg)\n\
  \n**图 2-8：** 你的应用显示了设备的方向。\n\n![9781118027707-fg060208.tif](img/9781118027707-fg060208_fmt.jpeg)\n\
  \n## 动画！\n\n有什么比让物体在屏幕上移动更有趣的吗？（我想我想起几件事，但这本书是关于 Android 开发的。）总之，App Inventor 有一些很酷的功能可以帮助你制作动画。按照以下指令进行一个简单但有用的示例：\n\
  \n1\\. 创建一个新的 App Inventor 项目。\n\n2\\. 将一个 `Canvas` 组件拖到设计器查看器中。\n\n可以在设计器面板的传感器类别中找到\
  \ `OrientationSensor`。App Inventor 不允许你将 `Animation` 组件直接拖到空白的设计器查看器上。相反，你必须先在屏幕上放置一个\
  \ `canvas`，然后在 `canvas` 上放置一个 `Animation` 组件。\n\n3\\. 选择 `canvas`（在设计器查看器或组件树中），然后在属性表中，将\
  \ `canvas` 的宽度设置为 `Fill Parent`。\n\n4\\. 在设计器面板的动画（Animation）类别中，找到 `ImageSprite`\
  \ 组件。\n\n`ImageSprite` 组件非常好用，因为它能显示图像，并且你可以快速编写精灵在画布上的移动程序。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 在计算机动画中，精灵（sprite）是添加到较大场景的小型动画图像。\n\n5\\. 将两个 `ImageSprite` 组件拖到画布（即你在第 2 步中创建的画布）上。\n\
  \n尝试放置这两个精灵，使它们距离画布顶部相同。如果你在对齐方面有困难，可以在属性表中调整精灵的 `Y` 值。\n\n6\\. 使用属性表为每个精灵放置一张图片。\n\
  \n\n\n\n\n每个精灵都有一个 `Picture` 属性。对于这两个精灵，请使用不同的图片。这样，当你启动模拟器时，你就能区分出这两个精灵。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg)\
  \ 有关如何将图片放入精灵中（或放入任何其他地方），请参考本迷你书籍的第 1 章。\n\n现在你有了两个并排的精灵。\n\n### 7. 选择最左侧的精灵（在\
  \ `Designer` 视图中或 `Components` 树中）；然后，在 `Properties` 属性表中，按照如下设置设置精灵的属性：\n\n* **Enabled**:\
  \ 勾选\n此对象启用动画。也就是说，该对象会移动。\n* **Heading**: 0\n该对象从方向 `0` 开始移动。要了解“方向 0”是什么，请参阅本章侧边栏的“Angles\
  \ and directions”。\n* **Interval**: 100\n该对象每 100 毫秒移动一次。（换句话说，该对象每秒移动十次。）\n* **Speed**:\
  \ 5\n对象每次移动时，都会朝着其朝向移动五个像素。\n* **Visible**: 勾选\n该对象出现在设备的屏幕上。\n\n你可以将此精灵的其他属性保持为默认值。\n\
  \n![remember.eps](img/remember_fmt.jpeg) 你通过 `Properties` 属性表设置的任何值都是组件的初始值。在应用程序运行时，你在\
  \ `Blocks Editor` 中配置的行为可以更改这些初始值。\n\n### 8. 选择最右侧的精灵（在 `Designer` 视图中或 `Components`\
  \ 树中）；然后，在 `Properties` 属性表中，按照如下设置设置精灵的属性：\n\n* **Enabled**: 勾选\n* **Heading**:\
  \ 180\n该对象从方向 `180` 开始移动（与另一个精灵的起始方向相反）。\n* **Interval**: 100\n* **Speed**: 10\n\
  对象每次移动时，都会朝着其朝向移动十个像素——速度是另一个精灵的两倍。\n* **Visible**: 勾选\n* **Y**: 与另一个精灵的 `Y` 值相同（参见第\
  \ 5 步）\n\n你可以将此精灵的其他属性保持为默认值。\n\n![tip.eps](img/tip_fmt.jpeg) 取决于屏幕分辨率、图片大小以及月球阶段，你在模拟器中查看动画时动画可能会看起来很糟糕。如果是这样，尝试调整第\
  \ 7 步和第 8 步中的某些数字。\n\n### 9. 好了！打开 `Blocks Editor`，连接模拟器，并观察你的应用程序运行。\n\n图 2-9 尽力向你展示模拟器屏幕上精灵的移动。加比猫（Calico）从左侧开始向右移动。缅甸猫（Burmese）从右侧向左移动。两只小猫在屏幕中间附近相而过。当小猫到达屏幕边缘时，它会停止。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 要让物体动起来，你始终有第二个选择。你可以创建一个带有计时器的时钟，并在每当计时器触发时更改精灵的位置。（参见图\
  \ 2-10。）如果你尝试这种方法，不要忘记将你的精灵放在 `Canvas` 组件内部。（参考第 2 步和第 3 步。）在 `Canvas` 组件之外，你无法显式地控制对象的\
  \ `X` 位置或 `Y` 位置。有关时钟和计时器的信息，请参阅本章前面的“Travel to the Orient”部分。\n\n**图 2-9:** 移动的精灵。\n\
  \n![9781118027707-fg060209.tif](img/9781118027707-fg060209_fmt.jpeg)\n\n**图 2-10:**\
  \ 移动精灵 . . . 一次点击。\n\n![9781118027707-fg060210.tif](img/9781118027707-fg060210_fmt.jpeg)\n\
  \n## 让精灵在屏幕边缘反弹\n\n你可以扩展前一节的示例，让精灵在屏幕边缘反弹。操作方法如下：\n\n1. 如果你还没有完成此示例之前的所有后续工作——在“Animate!”部分中进行的操作——请完成它。\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 放置精灵时，确保没有任何一个精灵接触到封闭画布的顶部或底部。\n\
  \n当精灵从左右移动时，它们应该在屏幕的左右边缘反弹。要完成所有这些操作，你需要一个 `EdgeReached` 事件处理器。坦率地说，在接下来的几步中，你将创建一个\
  \ `EdgeReached` 事件处理器。\n\n现在，如果一个精灵在侧向滑动时沿着画布底部移动会发生什么？那么精灵每次微小的侧向移动都会触发意外的 `EdgeReached`\
  \ 事件。（当精灵碰撞边缘时，`EdgeReached` 处理器触发。但当精灵擦过边缘（例如画布的顶部或底部）时，处理器也会触发。）所以底线是在示例中，不要让任何一个精灵接触画布的底部。\n\
  \n如果你的图片和封闭画布一样高，你可以执行任何一种操作：\n\n* 在每个精灵上放置较小的图片。\n* 从大图片开始，但在将其放入精灵之前，使用图像编辑程序缩小每张图片。\n\
  * 通过将 `Height` 属性设置为特定的像素值来增大画布。\n\n2. 在 `Blocks` 标签页中，找到 `ImageSprite1.EdgeReached`。\n\
  \n3. 选择 `ImageSprite1.EdgeReached` 事件处理器。\n\n4. 将 `ImageSprite1.Bounce` 模块和（来自 `My\
  \ Definitions` 分类）`Value Edge` 模块拖入 Blocks 视器中，如图 2-11 所示。\n\n5. 对 `ImageSprite2`\
  \ 重复第 2 到 4 步。（参见图 2-12）。\n\n\n\n\n\n# 6. 在积木编辑器中，连接到设备或模拟器，观察这些精灵来回弹跳吧！\n\n## 让精灵相互弹开\n\
  \n如果你测试了前一节的示例，你会看到两个精灵像夜色中的陌生人一样擦肩而过。但在游戏应用中，你可能不希望好人与坏蛋在没有发生某种冲突的情况下就擦肩而过。因此，在本节中，你将处理两个精灵之间的碰撞：\n\
  \n1. 如果你还没有完成前一节的内容，请先完成。\n\n结果是，你有两个精灵左右移动，并在移动过程中从屏幕边缘反弹。\n\n2. 在积木查看器（Blocks\
  \ viewer）中已有的内容基础上，添加图 2-13 所示的组。\n\n![cross-reference.eps](img/cross_reference_fmt.jpeg)\
  \ 关于在积木查看器中创建组的详细信息，请参阅本教程的第 1 章。\n\n图 2-13 中的大积木组展示了几个之前章节中未出现过的技术：\n\n* 你可以创建一个变量。\n\
  \  变量是存储数字、字符串或任何内容的地方。在 App Inventor 的术语中，变量就像参数，区别在于参数属于特定的事件处理程序，而变量可以独立存在。\n\
  \n  在图 2-13 中，变量的定义独立地悬浮在其他积木上方。我通过从“内置”（Built-In）选项卡的“定义”（Definition）类别中拖出一个积木来创建了这个变量。为了给变量赋一个初始值，我从“内置”选项卡的“数学”（Math）类别中获取了一个数字积木。每个变量都有一个名称，App\
  \ Inventor 会自动创建默认名称 `Variable`、`Variable1`、`Variable2` 等。在图 2-13 中，我没有改动默认名称 `Variable`。\n\
  \n**图 2-13：** 当精灵碰撞时。\n\n![9781118027707-fg060213.tif](img/9781118027707-fg060213_fmt.jpeg)\n\
  \n* 你可以测试一个条件，并在条件为真时执行代码。\n  在图 2-13 中，我使用了“内置”选项卡“控制”（Control）类别中的 `If` 积木。`If`\
  \ 积木包含两个部分——条件测试部分和条件为真时要执行的部分。\n\n* 你可以使用一个积木来引用整个组件。\n  在图 2-13 中，`If` 积木顶部的测试用于判断\
  \ `ImageSprite1` 碰撞的物体是否是 `ImageSprite2`。你可以从“我的积木”（My Blocks）选项卡中的 `ImageSprite2`\
  \ 类别中获取 `ImageSprite2` 积木。（你需要的积木标签为 `Component ImageSprite2`。）\n\n  图 2-13 中的条件还包含一个带有小等号的积木。你从“内置”选项卡的“逻辑”（Logic）类别中获取了该积木。\n\
  \n* 你可以设置变量的值并获取变量的值。\n  在图 2-13 中，我使用我的变量临时存储关于 `ImageSprite1` 的信息，同时交换 `ImageSprite1`\
  \ 和 `ImageSprite2` 运动属性的值。当尘埃落定后，`ImageSprite1` 拥有了原本属于 `ImageSprite2` 的朝向和速度，而\
  \ `ImageSprite2` 拥有了原本属于 `ImageSprite1` 的朝向和速度。\n\n交换精灵朝向和速度值的依据是两个等质量物体的线性动量守恒定律。几年前，我教过一年的大学导论物理。（我有资格教大学导论物理吗？嗯，这是一个长故事。）\n\
  \n创建完图 2-13 所示的积木后，你就可以准备测试你的应用了。\n\n![remember.eps](img/remember_fmt.jpeg) 你的应用中只有一个精灵拥有像图\
  \ 2-13 所示的积木组。如果你有一个 `ImageSprite1.CollidedWith` 事件处理程序，那么你没有 `ImageSprite2.CollidedWith`\
  \ 处理程序。如果你错误地向应用添加了类似的 `ImageSprite2.CollidedWith` 处理程序，那么每当两个精灵碰撞时，设备都会调用两个处理程序，导致运动属性的交换在一次碰撞中发生两次。这不是你想要的结果。\n\
  \n3. 测试你的应用。\n  精灵应该来回移动，在屏幕边缘反弹，并在屏幕中间相遇时互相弹开。\n\n## 使用数据库\n\n到目前，我的 App Inventor\
  \ 示例往往是视觉化的。你发送照片、制作动画或类似的操作。本节的示例不同。本节涵盖了枯燥数据库的世界。\n\nApp Inventor 组件集合包含一个基础数据库。本节将向你展示如何使用该数据库：\n\
  \n1. 创建一个新的 App Inventor 项目。\n2. 在项目的设计器视图（Designer viewer）中添加两个 `TextBox` 组件。\n\
  3. （可选）在每个 `TextBox` 组件的属性面板中，删除 `Text` 字段中的所有字符；在你精求细节的同时，将 `TextBox` 组件整齐地排列在屏幕上。\n\
  4. 在设计器视图中添加一个 `ListPicker` 组件。\n\n你可以在设计器色板的“基础”（Basic）类别中找到 `ListPicker` 组件。\n\
  \n![remember.eps](img/remember_fmt.jpeg) 在本节结束时，当你看到完成的应用时，你可能会认为 `ListPicker` 不是最好的组件。但你可能会辩论说\
  \ `ListPicker` 并不是执行该工作的最佳组件。也许复选框会更友好。但我想在本章中使用它。\n\n5. 在设计器视图或组件树中选择 `ListPicker1`。\n\
  \  结果，属性面板有一个 `ElementsFromString` 字段。\n\n6. 进入属性面板上的 `ElementsFromString` 字段，输入\
  \ `store, retrieve`。\n  你不应该感到惊讶 `ListPicker1` 与一个列表有关。文本 `store, retrieve` 告诉 App\
  \ Inventor `ListPicker` 的列表包含两个项目——第一个是 `store`，第二个是 `retrieve`。\n\n7. （可选）更改 ListPicker1\
  \ 上的文本。\n  这一步是可选的，但说真的，默认文本（Text）太丑了。你可以做得更好。在图 2-14 中，我在选择器上放置了 `store` 或 `retrieve`。\n\
  \n图 2-14 中的 `ListPicker` 组件看起来像一个按钮。这很奇怪，因为在巨大的电脑屏幕上，“选择器”看起来不像按钮。相反，选择器会展开以显示许多选项。（想象一个显示月份或国家的列表。）\n\
  \n但在移动设备的小屏幕上，显示选项的最佳方法是覆盖一个单独面板。因此，当用户按下示例中的 `ListPicker` 时，设备的整个屏幕都会改变，显示图 2-15\
  \ 所示的选项。\n\n**图 2-14：** 本节应用中可见组件的排列。\n\n![9781118027707-fg060214.tif](img/9781118027707-fg060214_fmt.jpeg)\n\
  \n**图 2-15：** 屏幕上出现了选项列表。\n\n![9781118027707-fg060215.tif](img/9781118027707-fg060215_fmt.jpeg)\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 在官方 Android 术语中，图 2-15 所示的单独面板是一个独立的活动（activity）。关于新活动接管整个屏幕的说法在你阅读这本书时可能已经过时。App\
  \ Inventor 可能能够为更大的平板电脑创建应用。在这种情况下，ListPicker 的选项将出现在应用程序文本框的片段中。关于活动的更多文字，请参阅本章后部分的“启动另一个\
  \ Android 应用”部分。关于片段的更多讨论，请参阅教程 IV 的第 4 章。\n\n8. 将一个 `TinyDB` 组件拖放到设计器视图中。\n  你可以在设计器色板的“基础”类别中找到\
  \ `TinyDB` 组件。\n\n你不在设计器屏幕上看到 `TinyDB1`，但 `TinyDB1` 现在是你应用的一部分。\n\n\n\n\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ `TinyDB` 的名称代表 `Tiny Database`（微型数据库）。这个名字有点误导性，因为 `TinyDB` 组件几乎不具备真实数据库的特征。事实上，`TinyDB`\
  \ 组件与真实数据库的唯一相似之处在于：数据库和 `TinyDB` 组件都控制持久化存储，即从应用程序的一次运行到下一次运行期间对值的保存（以及检索）。如果没有\
  \ `TinyDB` 组件，你在运行运行期间创建的任何数据都无法在后续的任何运行中使用。\n\n9. 打开“块编辑器”（Blocks Editor）。\n\n\
  10. 在“块查看器”（Blocks viewer）中，创建图 2-16 所示的块组。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg)\
  \ 关于在块查看器中创建组的详细信息，请参见本微型书籍的第 1 章。\n\n**图 2-16:** 用于控制 App Inventor 数据库的块。\n\n![9781118027707-fg060216.tif](img/9781118027707-fg060216_fmt.jpeg)\n\
  \n该组是在你执行本章之前描述的点击、拖拽和释放操作时生成的。但图 2-16 中的组组涉及了一些新花样。\n\n* 图 2-16 中最外层的块是一个事件处理器。\n\
  \n当用户点击 `ListPicker1` 时，Android 会显示一个包含要存储和检索的选项的列表。然后，当用户点击列表中的某项时，Android 会调用\
  \ `ListPicker1.AfterPicking` 事件处理器。\n\n* 用户所做的选择（在本例中，可以是存储或检索）将成为 `ListPicker1.Selection`\
  \ 的值。\n\n在图 2-16 中，我将 `ListPicker1.Selection` 与单词 `store` 进行了比较。（也就是说，我正在测试 `ListPicker1.Selection`\
  \ 的值是否为单词 `store`。）除非发生极其严重的错误，否则 `ListPicker1.Selection` 的值的另一种可能就是单词 `retrieve`。\n\
  \n* `TinyDB1` 组件包含项目。\n\n每个项目都有两个部分 —— `Tag`（标签）和 `Value`（值）。将 `TinyDB1` 想象成一个两列表格。（参见表\
  \ 2-1。）\n\n![表 2-1 每个人拥有的兔子数量](img/9781118027707-bk06ch0201.jpg)\n\n表中第一个项目的标签是\
  \ `Barry`；第一个项目的值是 `10`。第二个项目的标签是 `Harriet`；第二个项目的值是 `14`。依此类推。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 如果你熟悉真实数据库，你可能就会理解 App Inventor 的 `TinyDB` 组件到底有多小。一个 `TinyDB` 组件只有一个表，而该表只有两列。如果你在应用程序中放入两个\
  \ `TinyDB` 组件，这两个组件都与同一个表一起工作。（因此，根结底没有必要在应用程序中放入多个一个 `TinyDB` 组件。）应用程序不会与其他应用程序共享它们的\
  \ `TinyDB` 表格。但幸运的是，`TinyDB` 数据是持久化的。这意味着，在一次运行期间存储在表格中的项目可以由同一个应用程序在稍后的运行中检索到。\n\
  \n* `Built-In`选项卡下的 `Control` 类别包含一个 `Ifelse` 块。\n\n这本书的编辑告诉我，`Ifelse` 这个词很难看。但作为一个电脑极客，我喜欢\
  \ `Ifelse` 这个词。无论如何，图 2-16 中的 `Ifelse` 块说：“如果用户在 `ListPicker1` 中选择了 store，则执行一系列动作；否则，执行另一个动作。”具体地说，该\
  \ `Ifelse` 块包含以下内容：\n\n```\nIf the user selected store, then\n    将文本框的值作为新项目存储\n\
  \        在数据库中（将 TextBox1 的文本作为\n        项目的标签，将 TextBox2 的文本作为\n        项目的值），然后\n\
  \    清空两个文本框（通过在每个框中\n        不输入任何字符）。\nOtherwise (else)\n    在 TinyDB1 中查找标签与\n\
  \        TextBox1 中当前任何内容匹配的项目，并且\n        如果你找到了这样的项目，那么\n        将该项目的值放入 TextBox2。\n\
  ```\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 用户可能会尝试搜索 Fred，尽管 `TinyDB1`\
  \ 中标签为 Fred 的项目。如果 `TinyDB1` 没有标签与 `TextBox1` 中任何内容匹配的项目，则调用 `TinyDB1.GetValue`\
  \ 将无任何结果。因此在这种情况下，Android 会清空 `TextBox2` 中的任何字符。这很好，但对于一个稍微有点技巧的应用程序，你可以进行如图 2-17\
  \ 所示的测试。在那个测试中，你寻找标签与 `TextBox1` 中任何内容匹配的项目。如果你什么都没找到，就在 `TextBox2` 中放入（Not Found）（未找到）。\n\
  \n11. 运行本节的应用程序。\n\n图 2-18 到 2-20 展示了本节应用程序运行过程中的步骤。为了节省空间，这些图没有显示类似图 2-15 中的步骤（即用户在存储和检索之间进行选择的步骤）。\n\
  \n**图 2-17:** 未找到，但失败得很华丽。\n\n![9781118027707-fg060216.tif](img/9781118027707-fg060216_fmt.jpeg)\
  \ **图 2-18:** 存储 Barry 的信息。\n\n![9781118027707-fg060216.tif](img/9781118027707-fg060216_fmt.jpeg)\
  \ **图 2-19:** 检索 Harriet 的信息。\n\n![9781118027707-fg060216.tif](img/9781118027707-fg060216_fmt.jpeg)\
  \ **图 2-20:** 查找 Rhonda 的信息但一无所获。\n\n## 另一个应用程序\n\nAndroid 开发的一个很棒的功能是可以重用现有代码。例如，如果你想让应用程序查看页面，你不需要创建自己的浏览器。你只需要向另一个应用程序请求。\n\
  \n## Activity 和意\n\nActivity 是一个“屏幕”。将 Activity 想象成一个表单 —— 可以是输入信息的表单。与在线表单不同，Android\
  \ Activity 并不一定有文本框 —— 输入数字的地方。但 Android Activity 有自己的布局。当 Activity 首次出现在设备上后，其布局可能会由于用户的行为或显示的数据或其他原因而改变。\n\
  \n一个 Android 应用程序可以拥有多个自己的 Activity —— 多个不同的屏幕。此外，Android 应用程序还可以请求启动其他应用程序的 Activity。例如，我的游戏程序可以请求一个网页应用\
  \ —— 即运行一个页面 Activity。\n\n\n\n\n\n例如，假设用户在 Android 内置浏览器之外还安装了 Firefox。当一个应用程序发出请求启动\
  \ `android.intent.action.VIEW` 活动时，设备会寻找能够显示信息的应用程序和活动——即具有 `android.intent.action.VIEW`\
  \ 能力的活动。如果用户已经将 Firefox 设置为默认网页查看活动，设备将启动 Firefox 浏览器。但如果用户没有指定默认网页浏览器，Android 会显示一个列表，询问用户想要打开哪种浏览器。这就是意图（intents）的工作原理。\n\
  \n## 使用 App Inventor 启动活动\n\n本节的示例将使用预定义的 URL 启动浏览器。在示例中，你并没有直接引用特定的浏览器，而是通过请求可以满足\
  \ `android.intent.action.VIEW` 意图的活动来间接引用浏览器。工作原理如下：\n\n1. 创建一个新的 App Inventor 项目。\n\
  2. 在项目的 Designer（设计器）视图中添加两个 `Button` 组件。\n3. （可选）使用组件的 `Properties`（属性）表，在每个按钮上放置一些说明性文本。在图\
  \ 2-21 中，我放了“Barry 的 Android 页面”和“Barry 的 Java 页面”（无耻的推广）。\n4. 在 Designer 视图中添加一个\
  \ `ActivityStarter` 组件。你可以在 Designer 面板的 `Other Stuff` 类别中找到 `ActivityStarter` 组件。新组件\
  \ `ActivityStarter1` 是不可见的，因此你不会在 Designer 视图屏幕上看到 `ActivityStarter1`。\n5. 在 `Components`（组件）树中选择\
  \ `ActivityStarter1`。结果是 `Properties` 表有一个 `Action` 字段。\n6. 进入 `Properties` 表上新创建的\
  \ `Action` 字段，输入 `android.intent.action.VIEW`。文本 `android.intent.action.VIEW` 描述了一个意图——显示信息的能力。有关详细细节，请参见上一节。\n\
  7. 打开 `Blocks`（区块）编辑器。\n8. 在 `Blocks` 视图中，创建图 2-22 所示的内容。\n\n**图 2-21：** 本节示例的 Designer\
  \ 视图。\n![9781118027707-fg060221.tif](img/9781118027707-fg060221_fmt.jpeg)\n\n**图\
  \ 2-22：** 本节示例的 `Blocks` 视图。\n![9781118027707-fg060222.tif](img/9781118027707-fg060222_fmt.jpeg)\n\
  \n![cross-reference.eps](img/cross-reference_fmt.jpeg) 有关在 `Blocks` 视图中创建组的详情，请参见本微型书的第一章。\n\
  \n是的，你可以使用自己喜欢的 URL。但为了保持示例简单，请使用以 `http://` 开头的 URL。\n\n`ActivityStarter1` 组件有多个属性。在步骤\
  \ 6 中，你设置了组件的 `Action` 属性。在图 2-22 中，你通过为 `ActivityStarter1` 分配 URL 来使组件的请求更加具体。你分配哪个\
  \ URL 取决于用户点击哪个按钮。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 在图 2-22\
  \ 中，注意属性名 `DataUri` 中的字母 `Uri`。字母 `URI`（通常全大写）代表通用资源标识符（Universal Resource Identifier）。URI\
  \ 类似于 URL，但 URI 更多用途。关于 URI 极其准确的描述，请访问 `www.w3.org/Addressing/URL/uri-spec.html`。\n\
  \n9. 运行应用程序。\n\n当程序开始运行时，你会看到图 2-23 中的按钮。然后，当你点击按钮时，你会看到两个网页之一（例如图 2-24 所示页面）。\n\
  \n**图 2-23：** 选择一个页面。\n![9781118027707-fg060223.tif](img/9781118027707-fg060223_fmt.jpeg)\n\
  \n**图 2-24：** 每个按钮对应的网页。\n![9781118027707-fg060224.tif](img/9781118027707-fg060224_fmt.jpeg)\n\
  \n# 第 3 章：如何在没有 Eclipse 的情况下“艰苦”\n\n## 本章内容\n\n- 使用命令行窗口\n- 像蚂蚁一样思考\n- 为基于文本的开发做准备\n\
  - 使用 Ant 和操作系统命令进行开发\n\n是时候庆祝了！你已经接近《Android 应用开发傻傻指南》的末尾了。当然，你可能直接跳到了这一章，但这没关系。这一章没有任何剧透。这里不是你学到管家杀了继承人以及拉里·佩奇（Larry\
  \ Page）是无辜的地方。\n\n无论如何，你很快就会成为一名专家 Android 开发者，所以请通过举办大型派对来为你未来的成功感到高兴。\n\n为了准备派对，我会烤一个蛋糕。我很懒，所以我将用现成的蛋糕粉。让我看看……\n\
  \n## 预备知识\n\n我们的故事从操作系统开始。\n\n## 命令行窗口\n\n通常情况下，你不会只是打开电脑就开始输入命令。相反，你的电脑会启动一个外观良好的窗口（图形用户界面，简称\
  \ GUI），你开始使用鼠标指向和点击。在计算机响应命令之前，你必须启动一个命令行窗口，这是一个目的是接受你命令的应用程序。\n\n以下是启动你的操作系统命令行窗口的方法：\n\
  \n- 在 Windows 中，选择开始⇒所有程序⇒附件⇒命令提示符。\n- 在 Mac OS X Finder 窗口中，选择应用程序⇒实用工具⇒终端。\n-\
  \ 在 Linux 中，根据你的发行版和窗口环境进行相应操作。\n\n启动命令行窗口后，你就可以开始输入命令了。图 3-1 和 3-2 显示了 Windows\
  \ 和 Macintosh 上的命令行窗口。\n\n**图 3-1：** 运行 Microsoft Windows 的电脑上的命令行窗口。\n![9781118027707-fg060301.tif](img/9781118027707-fg060301_fmt.jpeg)\n\
  \n**图 3-2：** Mac 上的命令行窗口。\n![9781118027707-fg060302.tif](img/9781118027707-fg060302_fmt.jpeg)\n\
  \n\n\n\n\n![remember.eps](img/remember_fmt.jpeg) 当你使用 Eclipse 创建应用程序时，Eclipse 会静静地将你的鼠标点击转换为命令，并代表你执行这些命令。例如，在\
  \ Eclipse 中，选择 `File⇒New⇒Project⇒Android Project`，然后填写 `New Android Project` 对话框中的字段。当你点击\
  \ `Finish` 时，Eclipse 实际上执行了一条类似如下的命令：\n\n```\nandroid create project -t 10 -p MyProject\n\
  \                      -a MyActivity -k com.allmycode.samples\n```\n\n在底层，Android\
  \ 应用程序开发其实是一系列命令。\n\n## 脚本\n\n在娱乐界，脚本是一系列提前为演员准备的待说台词。在计算领域，脚本是一系列为计算机执行而提前准备的命令序列。\n\
  \n每个操作系统都提供了某种方法，让你将命令收集到一个文件中，然后执行该文件中的命令。通常情况下，你打开一个纯文本编辑器，输入命令，保存文件，然后在命令行窗口中输入文件名。\n\
  \n- 在 Windows 中，你可以使用 `Notepad` 并将文件保存为 `.bat` 扩展名。\n- 在 Mac 上，你可以使用 `TextEdit`\
  \ 并选择 `Format⇒Make Plain Text`。\n- 在 Linux 中，你可以使用 `gedit` 或 `KEDIT` 并将文件保存为 `.sh`\
  \ 扩展名。\n\n这种场景的问题在于可移植性。为 Mac 编写的脚本几乎不可能在 Linux 上正确运行，而为 Windows 编写的脚本几乎没有可能在 Mac\
  \ 上运行。\n\n# 认识 Apache Ant\n\n为了解决上一节的可移植性问题，Apache 软件基金会的人们提出了 Ant 项目。Ant 是一个用于保存和重新运行命令序列的工具。Ant\
  \ 简化了为了创建、编码和部署 Android 应用程序而需要一个接一个输入命令的巨型工程。\n\nAndroid 的创建者编写了 Ant 脚本来简化创建应用程序的工作。最棒的是，Ant\
  \ 并不特定于某一个操作系统。你可以在 Windows、Mac 和 Linux 上使用 Ant 脚本，而无需进行任何重大更改。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 与 Eclipse 一样，Apache Ant 为开发者隐藏了细节。有了 Android 预制的 Ant 脚本，你不需要输入通常在命令行窗口中需要输入的所有命令。创建\
  \ Android 的人们编写了可移植的命令并将其嵌入 Ant 脚本中。但 Ant 隐藏的细节比 Eclipse 少，所以当你使用 Ant 时仍然会有些不便。而且，你也可以兼得两者。你可以使用\
  \ Ant 执行某些任务，并使用你操作系统的命令行语言执行其他任务。\n\n## Ant 的视角\n\nAnt 的核心仅仅是另一个计算机程序。事实上，Ant 是一个\
  \ Java 程序。当你运行 Ant 程序时时，Ant 会解释你在指定的任何 Ant 脚本中编写的任何指令。例如，在 Ant 脚本中，元素\n\n```xml\n\
  <mkdir dir=\"${out.classes.absolute.dir}\" />\n```\n\n告诉 Ant 无论底层操作系统是什么都创建一个新目录。在元素的\
  \ `dir` 属性中，占位符 `${out.classes.absolute.dir}` 代表一个目录名称。名称中的精确字符是在 Ant 脚本运行期间动态生成的。由于\
  \ Ant 脚本具有占位符（或其他特性），因此 Ant 脚本是灵活且高度可编程的。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg)\
  \ 有关 XML 文档的一些背景信息，请参阅第二卷第 5 章。\n\n列表 3-1 包含一个小型 Ant 脚本。除非另有指定，否则 Ant 程序会在 `build.xml`\
  \ 文件中查找它的脚本。\n\n列表 3-1：一个 Ant 脚本（build.xml 文件）\n\n```xml\n<?xml version=\"1.0\"\
  \ encoding=\"UTF-8\"?>\n<project>\n  <target name=\"compile\">\n    <mkdir dir=\"\
  classes\" />\n    <javac srcdir=\"src\" destdir=\"classes\" />\n  </target>\n  <target\
  \ name=\"run\" depends=\"compile\">\n    <java classpath=\"classes\" classname=\"\
  Hello\" />\n  </target>\n  <target name=\"clean\">\n    <delete dir=\"classes\"\
  \ />\n  </target>\n</project>\n```\n\n作为 Android 开发者，你很少（如果有的话）编写 Ant 脚本。但能够解读其他开发者脚本的亮点是有帮助的。\n\
  \n一个基础 Ant 脚本有一个 `project` 元素、`project` 内部的 `target` 元素以及 `target` 内部的 `task` 元素：\n\
  \n- `project` 元素是 Ant 脚本的根元素。\n- 在 `project` 元素内部，每个 `target` 元素描述了执行的起点。\n\n在列表\
  \ 3-1 中，`compile` 目标创建一个 `classes` 目录以包含字节码文件，编译源代码文件并将生成的字节码文件放在新创建的 `classes`\
  \ 目录中`run` 目标执行编译后的字节码文件。`clean` 目标删除字节码文件及其目录，为再次编译做准备。\n\n- 在 `target` 内部，每个 `task`\
  \ 元素描述了要执行的步骤。\n\n在列表 3-1 的 `compile` 目标中，一个 `task` 创建 `classes` 目录，另一个 `task` 调用了\
  \ `javac`（Java 编译器）。你通过启动 Ant 程序并添加目标名称来启动 Ant。例如，要执行列表 3-1 中的 `compile` 任务，你在操作系统的命令行窗口中输入类似的内容：\n\
  \n`ant compile`\n\n列表 3-1 中的另一个细节值得你注意。Ant 目标的执行可以依赖其他目标。在列表 3-1 中，`run` 目标依赖于 `compile`。所以如果你调用\n\
  \n`ant run`\n\nAnt 会执行 `compile` 目标，然后执行 `run` 目标。（如果不需要编译，`compile` 目标只是挥手致意。）\n\
  \n## 安装 Apache Ant\n\n要下载并安装 Ant，请执行以下操作：\n\n1. 访问 `http://ant.apache.org/` 并找到\
  \ Binary Distributions 页面。\n2. 选择 Binary Distributions 页面上的一个链接。\n\n`.zip` 存档适用于大多数系统，如果你是硬核\
  \ Linux 用户，你可能想要 `.tar.gz` 存档或 `.tar.bz2` 存档。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ Android 的 Ant 脚本需要 Apache Ant 1.8.0 或更高版本。如果你发现了 1.7 或早期版本，请忽略该版本并访问 `http://ant.apache.org/`\
  \ 获取最新版本。\n\n当你的计算机完成下载后，继续第 3 。\n\n3. 执行你通常提取存档的方法。\n\n通常，我会创建一个 `ant` 文件夹并将存档的内容提取到该\
  \ `ant` 文件夹中。当然，你可能没有将其命名为 `ant`，或者你的 `ant` 文件夹可能是 `Applications` 文件夹的子目录。在本章中，我使用\
  \ `ANT_HOME` 代表任何包含 Ant 东西的文件夹。\n\n\n\n\n\n整个过程从开始到结束并不十分复杂。但那些挑剔的细节（你使用的是什么操作系统、你的\
  \ Android SDK 文件存储在哪里、你的电脑是如何预先配置的等）可能会让你抓狂。因此，在你投入与分号、斜杠、波浪号和其他符号的海洋进行斗争之前，你应该先了解大局。基于此，我将向你介绍使用命令行工具进行\
  \ Android 开发的概述：\n\n1. **创建一个 Android 项目。**\n   通过输入命令来实现。该命令以 `android create project`\
  \ 开头。在此上下文中，`android` 是一个程序的名称，而 `create project` 是 `android` 程序的选项之一。\n\n2. **编辑项目代码。**\n\
  \   使用你喜喜欢的纯文本编辑器（记事本、TextEdit 或任何编辑器），反复搜寻，直到你创建出完美的 Java 代码和理想的 XML 文档。\n\n3.\
  \ **运行创建一个 Ant 脚本的程序。**\n   再次输入一个命令来调用 `android` 程序。但这次要添加 `update project` 选项。\n\
  \n4. **运行 Ant 脚本。**\n   输入 `ant` 并加上一两个选项。Ant 脚本会编译并打包你的代码，并将你的代码安装到模拟器或连接的设备上。\n\
  \n有了这个大纲，我邀请你进一步深入探索。本章的其余部分都是细节、细节、细节。\n\n### 准备你的系统\n\n我妻子的几个亲戚都叫 Chris。所以，由于名字和姓氏相同，很难讨论某个\
  \ Chris 的工作或 Chris 最喜欢的甜点。相反，我必须通过位置来识别这些人。我会说“来自加利尼亚的 Chris”或“来自波士顿的 Chris”。如果我不小心说成“来自巴伐利亚的\
  \ Chris”，我就有点大麻烦了，因为我妻子在巴伐利亚没有亲戚。\n\n当你在开发电脑的命令行窗口中输入 `android` 时，也会发生同样的事情。你的电脑可能存在多个名为\
  \ `android` 的文件，每个文件位于不同的目录。而且许多目录与 Android 无关，且没有 `android` 文件。因此，在命令行窗口中输入 `android`\
  \ 就像在巴伐利亚的街道上大喊 Chris 的名字。为了帮助理清这一切，你的操作系统会记录一个 `PATH`。\n\n你的 `PATH` 是一个包含你经常执行的程序的目录列表。当你在命令行窗口的一行中输入程序名称时，你的操作系统会在\
  \ `PATH` 列表的每个目录中寻找同名文件。只要你的 `PATH` 设置正确，你就可以通过输入程序名称来启动程序。你不需要输入存放该程序的（可能很长的）目录名称。\n\
  \n在我家里，我们不言而喻的 `PATH` 包含了加利福尼亚。所以，我不需要说“加利福尼亚的 Chris”，只需要说“Chris”。指代另一个亲戚时，我必须说“波士顿的\
  \ Chris”或“斯克内尼斯迪的 Chris”。\n\n在本节的步骤中，请调整你的 `PATH`：\n\n1. **启动命令行窗口。**\n   详情请参阅本章前面的“你的朋友，命令行窗口”部分。\n\
  \n2. **在命令行窗口中，输入 `cd /` 然后按回车（那是 `cd` 字母，后面跟着一个空格、一个斜杠和回车）。**\n   ![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 该命令将带你进入电脑的根目录。根目录是一个中立的地方，你可以安全地按照第 3 步的指令操作。\n\n3. **发现开发电脑的 PATH 中包含哪些软件工具。**\n\
  \   对于本章的示例，你的 `PATH` 应该包含 Java 工具、Android 工具和 Ant 工具。\n\n   * 要检查你的 `PATH` 是否包含\
  \ Java 开发工具，请在命令行窗口中输入 `javac -version`。\n     如果电脑返回如下内容：\n     ```\n     javac\
  \ 1.7.0\n     ```\n     说明你的 `PATH` 包含 Java 开发工具。相反，如果你的电脑返回类似\n     `'javac’ is\
  \ not recognized as a command`\n     或者：\n     ```\n     javac: command not found\n\
  \     ```\n     说明你的 `PATH` 不包含 Java 开发工具。无论结果如何，请记录下来。\n\n   * 要检查你的 `PATH` 是否包含\
  \ Android 开发工具，请在命令行窗口中输入 `android`。\n     如果电脑响应并打开 Android SDK 和 AVD Manager 窗口，说明你的\
  \ `PATH` 包含了 Android 开发工具。你可以关闭 Android SDK 和 AVD Manager 窗口并继续你的测试。\n     如果你的电脑返回\
  \ `no such command` 信息，说明你的 `PATH` 不包含 Android 开发工具。\n\n   * 要检查你的 `PATH` 是否包含 Ant\
  \ 工具，请在命令行窗口中输入 `ant -version`。\n     如果电脑返回如下内容：\n     ```\n     Apache Ant(TM)\
  \ version 1.8.2\n     ```\n     说明你的 `PATH` 包含了 Ant 工具。相反，如果你的电脑返回 `no such command`\
  \ 信息，说明你的 `PATH` 不包含 Ant 工具。\n\n4. **找到不在 PATH 中的软件工具的根目录。**\n   对于第 3 步中每个返回 `no\
  \ such command` 信息的软件工具，请在你的硬盘中搜索包含该工具的目录。\n\n   * 你的 `JAVA_HOME` 目录名称类似于 `jdk1.7.0`（或该名称的变体）。\n\
  \     你的 `JAVA_HOME` 目录包含一个名为 `bin` 的子目录，而 `bin` 子目录包含一个 `javac.exe` 文件，或简单称为 `javac`。（这个\
  \ `javac` 文件就是 Java 编译器。更多信息见书 I 第 2 章。）\n     当你找到符合 `JAVA_HOME` 定义的目录时，记录该目录名称。例如，在我的电脑上，该目录是：\n\
  \     `C:\\Program Files (x86)\\java\\jdk1.6.0_25`\n     ![tip.eps](img/tip_fmt.jpeg)\
  \ 在某些情况下，你的硬盘上可能有多个包含 Java 工具的目录。如果硬盘上有多个 JDK 目录，只需选择一个作为你的 `JAVA_HOME`。\n\n   *\
  \ 你的 `ANDROID_HOME` 目录名称中包含 `android`。\n     该目录有两个子目录：`tools` 和 `platform-tools`。`tools`\
  \ 和 `platform-tools` 文件夹包含了帮助你开发 Android 应用的程序。详情见书 I。\n\n   * 你在本章的“安装 Ant”部分创建\
  \ `ANT_HOME` 目录。\n     `ANT_HOME` 目录包含一个 `bin` 子目录。`bin` 子目录下有多个文件：`ant`、`antRun`\
  \ 等。这些文件在不同的操作系统上对启动 Ant 起着某种作用。\n\n5. **对于不在 PATH 中的任何软件工具，将相应的根目录添加到你的 PATH。**\n\
  \   当你输入 `javac` 时，你希望电脑执行 `JAVA_HOME` 目录 `bin` 子目录下的 `javac` 程序。换句话说，你希望 `JAVA_HOME`\
  \ 目录的 `bin` 子目录在 PATH 中。`ANDROID_HOME` 目录有两个包含程序的子目录——`tools` 目录和 `platform-tools`\
  \ 目录。因此你希望这两个子目录都在 PATH 中。\n\n   此步骤的工作取决于你开发电脑的操作系统。\n\n   * Windows\n     在我的\
  \ Windows 电脑上，`JAVA_HOME` 目录是 `C:\\Program Files (x86)\\java\\jdk1.6.0_25`，`ANDROID_HOME`\
  \ 目录是 `C:\\Program Files (x86)\\Android\\android-sdk`，`ANT_HOME` 目录是 `C:\\ant`。因此为了将软件目录添加到我的\
  \ PATH，我输入列表 3-2 中的命令。\n\n     列表 3-2：在 Windows 电脑上修改 PATH\n     ```\n     set JAVA_HOME=C:\\\
  Program Files (x86)\\java\\jdk1.6.0_25\n     set ANDROID_HOME=^\n     C:\\Program\
  \ Files (x86)\\Android\\android-sdk\n     set ANT_HOME=C:\\ant\n     set PATH=%PATH%;%JAVA_HOME%\\\
  bin;%ANDROID_HOME%\\tools;^\n     %ANDROID_HOME%\\platform-tools;%ANT_HOME%\\bin\n\
  \     ```\n\n     列表 3-2 包含四个命令。每个命令都以 `set` 开头。但列表 3-2 有六行，是因为列表中的两个命令非常长。这两个长命令都无法完全位于书的页边距之间。\n\
  \n\n\n\n对于每一条长命令，我都会在一行中输入命令的一部分；然后用 Windows 换行符（`^`）结束该行；紧接着在下一行继续输入该命令。当你输入命令时，可以使用\
  \ `^` 字符将一个命令分成两行或多行。或者，你也可以像在越窗口窗口边缘时那样输入每条长命令。每当你到达窗口边缘时，长命令会自动换到下一行。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 在输入完列表 3-2 中的内容后，你可以通过输入 `echo %PATH%` 并按回车键来检查工作结果。当你这样做时，你会看到一长串目录，最后以你的 `JAVA_HOME`、`ANDROID_HOME`\
  \ 和 `ANT_HOME` 目录结尾。分号将列表中的每个目录与下一个目录分隔。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg)\
  \ 当你在特定的命令窗口中输入列表 3-2 中的内容时，`set` 命令对任何其他命令窗口中的 `PATH` 都没有影响。例如，假设你打开了两个命令窗口——窗口\
  \ 1 和窗口 2。在窗口 1 中输入列表 3-2 中的命令。此时，窗口 1 中的 `PATH` 包含了你的 `JAVA_HOME`、`ANDROID_HOME`\
  \ 和 `ANT_HOME` 目录，但窗口 2 中的 `PATH` 可能不包含这些目录。完成所有操作后，打开第三个窗口——窗口 3。这第三个窗口的 `PATH`\
  \ 可能不包含 `HOME` 目录。这个道理是，如果你切换到不同的命令窗口，请在新命令窗口中输入列表 3-2 中的内容。\n\n### Macintosh\n\n\
  步骤 3 中的内容告诉我，我的 Mac 的 `PATH` 包含了 Java 工具和 Ant 工具。在步骤 4 中，我发现我的 Mac 的 `ANDROID_HOME`\
  \ 目录是 `/Applications/android-sdk`。因此，为了将软件目录添加到我的 `PATH` 中，我输入了列表 3-3 中的命令。\n\n\
  #### 列表 3-3：在 Macintosh 上修改你的 PATH\n\n```bash\nexport ANDROID_HOME=/Applications/android-sdk/\n\
  export PATH=${PATH}:\n${ANDROID_HOME}/tools:${ANDROID_HOME}/platform-tools\n```\n\
  \n列表 3-3 两个命令。每条命令都以 `export` 开头。但列表 3-3 有三行，是因为列表中的一条命令非常长。这两条长命令都无法完全放入书的页边距之间。\n\
  \n对于每一条长命令，我都会在一行中输入命令的一部分；然后用 Unix 换行符（`\\`）结束该行；紧接着在下一行继续输入该命令。当你输入命令时，可以使用 `\\\
  ` 字符将一个命令分成两行或多行。或者，你也可以像在越过窗口边缘时那样输入每条长命令。每当你到达窗口边缘时，长命令会自动换到下一行。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 在输入完列表 3-3 中的内容后，你可以通过输入 `echo ${PATH}` 并按回车键来检查工作结果。当你这样做时，你会看到一长串目录，最后以你在列表\
  \ 3-3 版本中添加的任何目录名称结尾。冒号将列表中的每个目录与下一个目录分隔。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg)\
  \ 当你在特定的命令窗口中输入列表 3-3 中的内容时，`set` 命令对任何其他命令窗口中的 `PATH` 都没有影响。\n\n### 创建项目\n\n当你正确设置了\
  \ `PATH` 之后，就可以开始创建一个新的 Android 项目：\n\n1. 设置你的 `PATH`。\n   若需比你所想的更详细的说明，请参见前一节。在执行本节后续步骤时，请使用同一个命令窗口。\n\
  \n2. 创建一个目录来存储本章的 Android 项目，并将目录切换到该新目录。\n   在 Windows 电脑上，我输入以下两条命令：\n\n   ```cmd\n\
  \   md %HOMEPATH%\\MyAndroidProjects\n   cd %HOMEPATH%\\MyAndroidProjects\n   ```\n\
  \n   在 Mac 上，我输入这两条命令：\n\n   ```bash\n   mkdir ~/MyAndroidProjects\n   cd ~/MyAndroidProjects\n\
  \   ```\n\n切换目录的概念并不难理解，但要严谨地描述这个概念很难。当你使用命令窗口时，你总是处于一个目录或另一个目录中。例如，当你第一次打开命令窗口时，你可能处于\
  \ `C:\\Users\\yourname` 或 `/Users/yourname`。你可以通过输入 `cd` 命令以及你想要到达的目录名称来更改你所在的位置。\n\
  \n   在任何时刻，你所所在的目录就是你的工作目录。在这一步中，你创建了一个新目录（使用 `md` 或 `mkdir` 命令）。然后，通过 `cd` 命令切换目录（这样新创建的目录就成了你的工作目录）。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 在普通电脑上，每个用户都有自己的目录（存储设置、文档、数据和其他内容的地方）。在\
  \ Windows 电脑上，`%HOMEPATH%` 代表你的用户目录。（通常，`%HOMEPATH%` 代表 `C:\\Documents and Settings\\\
  your-user-name` 或 `C:\\Users\\your-user-name`。）在 Mac 上，波浪号（`~`）代表你的用户目录。（通常，`~`\
  \ 代表 `/Users/user-name`。）\n\n![tip.eps](img/tip_fmt.jpeg) 在不同目录之间跳转时（使用 `cd` 命令），你可以检查你是否到达了想要的地方。\n\
  \n3. 最后，创建项目！\n   如果你运行 Windows，请输入列表 3-4 中的命令。如果你使用 Mac，请输入带有反斜线的相同命令。\n\n### 列表\
  \ 3-4：创建一个 Android 项目\n\n```bash\nandroid create project --target \"android-8\"\
  \ ^\n--name MyProject \\\n--path MyProject \\\n--activity MyActivity \\\n--package\
  \ com.allcode.samples\n```\n\n![crossreference.eps](img/cross-reference_fmt.jpeg)\
  \ 在列表 3-4 中，连接是 Windows 换行符。同样，反斜线是 Macintosh 换行符。要了解更多关于换行符（以及为什么我痴迷的写作习惯使我使用它们），请参见本章前面的“准备你的系统”。\n\
  \n`android` 工具（随你下载的 Android SDK）有很多用途。该工具的一个用途是创建一个全新的 Android 项目。在列表 3-4 中，你在工具名称\
  \ `android` 后面紧跟着动作名称 `create project`。（动作名称没有任何秘密！）\n\n在 `create project` 之后，你有一些选项：\n\
  \n- 在 `--target` 选项中，`\"android-8\"` 代表 Froyo，也称为 Android 2.2。\n  查看接受的目标名称列表，请在命令窗口中输入\
  \ `android list targets`。然后将 `\"android-8\"` 替换为适用于你的目标名称。\n\n- 在 `--name` 选项中，我使用了老旧的\
  \ `MyProject` 名称。\n\n- `--path` 选项为电脑指定一个新目录的名称（即包含你新 Android 项目的目录）。\n\n\n\n由于我很懒，所以我重复使用了\
  \ `MyProject` 这个名字。新的 `MyProject` 目录将成为你工作目录的一个子目录。（在步骤 2 中，我将我的工作目录命名为 `MyAndroidProjects`。）\n\
  \n- `--activity` 选项告诉你的计算机创建一个基础的 Android 活动（activity）。\n\n同样，在列表 3-4 中，懒惰促使我创建了\
  \ `MyActivity.java`。而且不，我从没有在任何密码中使用 `password` 这个词。\n\n- `--package` 选项为项目的 Java\
  \ 代码提供一个包名。\n\n在分享我的包名方面我很自私。所以，请使用你自己的包名。\n\n创建一个 Android 项目后，你几乎已经准备好打包你的应用程序了。但当然，你还没有完全准备好。这里还有几个步骤：\n\
  \n### 4. 编辑你项目的 Java 代码和项目的 XML 文件。\n\n没什么大不了，对吧？是的，这一步确实很重要，但本章并不是关于编写 Java 代码和调整\
  \ XML 文件的。\n\n如果你在避开 Eclipse，我建议在 Windows 电脑上使用 TextPad 编辑器。（要查看 TextPad 编辑器，请访问\
  \ [`http://textpad.com`](http://textpad.com/)）。）在 Mac 上，我推荐 TextEdit，但在第一次保存 JAVA\
  \ 文件或 XML 文件之前，选择 `Format⇒Make Plain Text`（格式⇒制作纯文本）。\n\n### 5. 在命令窗口中输入以下命令：\n\n\
  ```bash\nandroid update project --path MyProject\n```\n\n`android` 工具的 `update project`\
  \ 操作会自定义你项目的 `build.xml` 文件（你项目的 Ant 脚本）。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 你的计算机将 `--path` 名称 `MyProject` 解析为相对于你的工作目录。此步中的命令仅在你的工作目录与步骤 3 中的工作目录相同时才有效。\n\
  \n### 6. 启动模拟器。\n\n启动 Android 模拟器永远都不为早。（你永远不知道模拟器启动自己需要长时间。）\n\n要启动模拟器，你有几种替代方案：\n\
  \n- 你可以运行 `android` 脚本。\n\n在命令行中输入不带其他单词的 `android` 会导致 Android 启动其 SDK 和 AVD Manager。（参见第一部分第\
  \ 2 章。）从 SDK 和 AVD Manager 中，你可以启动你选择的模拟器。\n\n- 你可以运行 `emulator` 程序。\n\n例如，假设你已经创建了一个名为\
  \ `Froyo1` 的 AVD。你可以输入 `emulator -avd Froyo1` 来启动一个基于你的 `Froyo1` AVD 的模拟器。\n\n-\
  \ 你可以运行 Eclipse 并按照你通常处理 Eclipse 项目的方式启动模拟器。\n\n无论用哪种方法，让模拟器运行起来。\n\n# 使用 Ant 进行\
  \ Android 开发\n\n完成了本章“创建项目”部分的内容后，你已经准备好编译并测试你的 Android 应用程序了。你可以在一步中完成所有的繁重工作。但为了更精细的控制，你可能更喜欢多步骤的方法：\n\
  \n1. 遵循上一节的指令 . . .\n\n. . . 这意味着也要遵循两个章节之前的指令，而反过来又意味着遵循从很久以前的指令，以此此类推。\n\n2. 在命令窗口中，进入包含你\
  \ Android 项目的目录。\n\n快速回顾一下：在前一节中，我进入了我自己的用户目录，Windows 下为 `%HOMEPATH%`，在 Mac 上调用\
  \ `~`（波浪符号）。从那里，我移动到一个我称为 `MyAndroidProjects` 的子目录。然后，在列表 3-4 中，我创建了一个 `MyProject`\
  \ 目录（`MyAndroidProjects` 的子目录）。在这个 `MyProject` 目录中，我准备了 Android 项目的所有材料（`src` 文件、`res`\
  \ 文件以及所有其他极好的东西）。\n\n所以，如果你完全按照我在上一节中的做法操作，你就在一个 `MyProject` 目录中拥有了一个 Android 项目。你希望你的工作目录就是那个\
  \ `MyProject` 目录。\n\n在 Windows 电脑上，输入以下命令：\n\n```bash\ncd %HOMEPATH%\\MyAndroidProjects\\\
  MyProject\n```\n\n在 Mac 上，输入此命令：\n\n```bash\ncd ~/MyAndroidProjects/MyProject\n\
  ```\n\n3. （可选）通过输入运行 Ant 脚本：\n\n```bash\nant compile\n```\n\n在在前一节的步骤 5 中，你为你的项目创建了一个\
  \ Ant 脚本。幸运的是，那个 Ant 脚本包含一个 `compile` 目标。当你带有该 `compile` 目标调用 Ant 时，你的计算机会生成项目的\
  \ `R.java` 文件并编译与你项目相关的所有 Java 源文件。\n\n这个 `ant compile` 步骤是可选的。如果你跳过这一步，步骤 4 中运行的\
  \ Ant 将代你调用 `compile` 目标。\n\n4. （可选）通过输入运行 Ant 脚本：\n\n```bash\nant debug\n```\n\n\
  在前一节的步骤 5 中的 Ant 脚本包含一个 `debug` 目标。当你带有该 `debug` 目标调用 Ant 时，你的计算机会执行脚本中 `compile`\
  \ 目标中的所有任务，并将你的项目打包成 APK 文件。\n\n这个 `ant debug` 步骤是可选的。如果你跳过这一步，步骤 5 中运行的 Ant 将代你调用\
  \ `compile` 和 `debug` 目标。\n\n5. 通过输入运行 Ant 脚本：\n\n```bash\nant install\n```\n\n\
  在前一节的步骤 5 中的 Ant 脚本包含一个 `install` 目标。当你带有该 `install` 目标调用 Ant 时，你的计算机会执行脚本中 `compile`\
  \ 和 `debug` 目标中的所有任务，并将项目安装到模拟器（或连接到开发设备的设备）。\n\n6. 测试你的应用程序。\n\n在某些情况下，测试你的应用程序。\n\
  \n# 使用操作系统命令进行 Android 开发\n\n多年前，我参加了一个汽车修理课程。我想以此节省一些维护费用，但我对机械事务并没有天赋。在一次课程中，当我在测试变速箱油时被卡在了汽车下面。老师威胁说，如果结束前我没有从车下面出来，他就把车推到停车场（连同我一起）。\n\
  \n总之，我不擅长修理东西，所以我放弃了。但一年后，我正开车在 94 号高速路上前往密尔基机场。我有足够的时间赶上飞机。但在 35 号出口和 26 号出口之间，我的车自动熄火了。当我滑到高速路路边时，我不知道是否能赶上后一班飞机。\n\
  \n当我的恐慌缓解一些，我下车打开了引擎盖。我的目光立刻注意到一根从部件上掉出来的线。其他一些部件奇怪地挂着，但根据我在汽车修理课程的经验，我知道这根特定的线必须连接回它的部件。我连接好电线，启动汽车，并及时赶到了机场。\n\
  \n这就是我的故事。理解事物的内部原理起初可能看起来深奥。但从长远来看，几乎没有知识会被浪费。比绝对需要的更多要总是好的。\n\n\n\n\n\n在本节中，我将展示一组\
  \ Windows 命令（即一个 Windows `BAT` 文件），用于创建、编译和安装 Android 应用。我已努力让这个批处理文件具有移植性，以便该文件可以在任何更新过的\
  \ Windows 电脑上正确运行。但我不作保证。如果列表 3-5 中的命令在你的电脑上无法运行，请不要死磕（撞墙）去试图让这些命令运行。把汽车电线重新接回那个小装置上即可，但不要趴在车底检查变速油。\n\
  \n抱歉就到此为止…… 列表 3-5 包含了这些命令。\n\n### 列表 3-5：用你的双手创建一个 Android 应用\n\n```batch\nset\
  \ JAVA_HOME=C:\\Program Files (x86)\\java\\jdk1.6.0_25\nset JRE_HOME=C:\\Program\
  \ Files (x86)\\java\\jre6\nset ANDROID_HOME=^\nC:\\Program Files (x86)\\Android\\\
  android-sdk\nset ANT_HOME=C:\\ant\nset PATH=%PATH%;%JAVA_HOME%\\bin;%ANDROID_HOME%\\\
  tools;^\n%ANDROID_HOME%\\platform-tools;%ANT_HOME%\\bin\nrem Uncomment the next\
  \ command if you\nrem want to start an emulator\nrem\nrem start “Starting the emulator...”\
  \ emulator ^\nrem -scale 0.75 -avd Froyo1\ncd “%HOMEPATH%\\MyAndroidProjects”\n\
  call android create project ^\n  --target “android-8” ^\n  --name MyNextProject\
  \ ^\n  --path MyNextProject ^\n  --activity MyActivity ^\n  --package com.allmycode.samples\n\
  set MY_PROJECTS=%HOMEPATH%\\MyAndroidProjects\nset THISPROJ=%MY_PROJECTS%\\MyNextProject\n\
  cd “%THISPROJ%”\nmkdir gen\nmkdir bin\\classes\naapt package -f -m -M AndroidManifest.xml\
  \ -S ^\n  -I “%ANDROID_HOME%\\platforms\\android-8\\android.jar” ^\n  -J gen\nset\
  \ CLASSPATH=”%THISPROJ%\\bin\\classes”;^\n“%THISPROJ%”;^\nC:\\ant\\lib\\ant-launcher.jar;^\n\
  C:\\ant\\lib\\ant-antlr.jar;^\nC:\\ant\\lib\\ant-apache-bcel.jar;^\nC:\\ant\\lib\\\
  ant-apache-bsf.jar;^\nC:\\ant\\lib\\ant-apache-log4j.jar;^\nC:\\ant\\lib\\ant-apache-oro.jar;^\n\
  C:\\ant\\lib\\ant-apache-regexp.jar;^\nC:\\ant\\lib\\ant-apache-resolver.jar;^\n\
  C:\\ant\\lib\\ant-apache-xalan2.jar;^\nC:\\ant\\lib\\ant-commons-logging.jar;^\n\
  C:\\ant\\lib\\ant-commons-net.jar;^\nC:\\ant\\lib\\ant-jai.jar;^\nC:\\ant\\lib\\\
  ant-javamail.jar;^\nC:\\ant\\lib\\ant-jdepend.jar;^\nC:\\ant\\lib\\ant-jmf.jar;^\n\
