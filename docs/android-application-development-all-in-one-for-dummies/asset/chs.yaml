  \n## 使用 Blocks 编辑器\n\nGoogle 的 App Inventor 有两个主要部分：`Designer`（设计器）和 `Blocks Editor`（区块编辑器）。`Blocks\
  \ Editor` 有两个大面板。这些面板似乎没有特定的名称。为了清晰起见，我在此将这些面板命名为 `Blocks palette`（区块面板）和 `Blocks\
  \ viewer`（区块查看器）。（在某些教程中，我看到 `Blocks viewer` 被称为编辑器，但那种术语让我我很困惑。）\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ `Blocks Editor` 有一个面板和一个查看器，而 `Designer` 也有面板和一个查看器（以及其他面板）。对于 `Designer` 的面板，我使用\
  \ `Designer palette` 和 `Designer viewer` 的名称；对于 `Blocks Editor` 的面板，我使用 `Blocks\
  \ palette` 和 `Blocks viewer` 的名称。我的术语并不是标准的。但就我来说，标准术语并没有太大帮助。事实上，在 App Inventor\
  \ 的官方文档中，界面的很多部分都没有命名。\n\n你可以在图 1-3 中看到 `Blocks palette` 和 `Blocks viewer`。\n\n\
  *   左侧的 `Blocks palette` 包含了用于操作的构建区块——你的 Android 应用要执行的操作。\n*   `Blocks palette`\
  \ 有两个标签页——`Built-In`（内置）和 `My Blocks`（我的区块）：\n    *   `My Blocks` 标签页上的大部分项目代表你添加到\
  \ `Designer` 查看器中的组件——按钮、标签、屏幕布局等等。\n    *   `Built-In` 标签页上的项目是编程逻辑的基础元素。这包括文本字符串、数学运算符、比较运算符、循环、`if-then`\
  \ 结构以及其他内容。\n*   `Blocks viewer` 是你应用程序操作的预览。`Blocks viewer` 最初是空的，占据了 `Blocks Editor`\
  \ 大部分区域。正如你可能猜到的，你将项目从 `Blocks palette` 拖入 `Blocks viewer`。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ App Inventor 的 `Blocks Editor` 的编程模型是 Scratch 开发环境。访问 `http://scratch.mit.edu`\
  \ 了解详情。\n\n## 添加事件处理器\n\n在之前的章节中，我描述了大多数视觉化编辑器可以做的事情。事实上，Eclipse 的 `Graphical Layout`（图形布局）具有与\
  \ App Inventor 的 `Designer` 相同的拖放功能，而且 `Graphical Layout` 还有一个额外的优势。通过 Eclipse 的\
  \ `Graphical Layout`，你可以访问大多数 Android SDK 特性。\n\n那么，是什么让 Inventor 与众不同呢？为什么使用 App\
  \ Inventor 而不是 Eclipse？随着 App Inventor 的 `no coding`（无代码）功能，也来了 `no coding` 的限制。在本节中，尝试一些：\n\
  \n\n\n\n-   事件（Event）是应用程序可能会响应的某些，例如点击按钮、按下按键、GPS 位置变化或文本消息的到达。\n-   事件处理器（例如 `Button1.Click`\
  \ 块）是你的应用程序中响应事件发生的部分。\n-   当事件发生时，你的设备会自动调用事件处理器中包含的指令。\n\n在这个示例中，当用户点击 `Button1`\
  \ 时会发生一个事件。在 `Block1.Click` 事件处理器中，你将添加指令，将文本放入应用程序的另一个组件（`Label1` 组件）中。（事实上，你在这个步骤列表的剩余部分里都在精确做这件事。）\n\
  \n8. 在积木（Blocks）调板中，点击 `Label1`。\n\n现在，展开的积木调板包含了一堆 `Label1` 拼图碎片。注意，有些碎片（积块）是成对出现的。展开的调板包含一个\
  \ `Label1.Text` 块和一个 `Set Label1.Text To` 块。\n\n- `Label1.Text` 块是一个获取器（getter）。\n\
  - `Set Label1.Text To` 块是一个设置器（setter）。\n\n获取器允许你访问现有值。设置器更改现有值（或首次设置该值）。获取器和设置器结合在一起允许你检查并更改组件属性的值。\n\
  \n**图 1-23：** 积木查看中的 `Button1.Click` 块。\n\n![9781118027707-fg060123.tif](img/9781118027707-fg060123_fmt.jpeg)\n\
  \n9. 点击 `Label1.Text` 设置器块。\n\n`Label1.Text` 设置器与 `Button1.Click` 事件处理器并列位于积木查看中。\n\
  \n是时候玩玩拼图的乐趣了！就像两个漂移的构造板块一样，积木查看中的这两个碎片看起来是一对的。`Labe1.Text` 设置器可以紧密地嵌入 `Button1.Click`\
  \ 事件处理器内部。\n\n10. 将 `Labe1.Text` 设置器块拖入 `Button1.Click` 事件处理器块的间隙中（参见图 1-24）。\n\n\
  极其精确地说，这些间隙中的一个名称实际上是插槽（socket）。\n\n如果你将标签块放在正确的位置，你的电脑扬声器会发出啪嗒一声，块组合的外观会发生细微变化。这些响应表明你已成功地将一个块与另一个关联。在编程逻辑上，你说了：“当用户点击\
  \ `Button1` 时，将 `Label1` 的文本设置为 . . .”，而你还没有指定 `Label1` 的新文本。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 在 `Button1.Click` 块的顶部，App Inventor 在小框内显示了一个感叹号。如果你悬停在框上，弹出气泡会说：“Warning: 此组合包含一个空插槽，将不会发送到手机。”那个空插槽就是\
  \ `Label1.Text` 设置器块中 `To` 部分的间隙。本章前面的“向你的项目添加组件”部分中描述的轻松模拟器更新将无法进行。\n\n11. 点击积木调板的\
  \ `Built-In` 标签页。\n\n12. 在 `Built-In` 标签页中，点击 `Text` 项目。\n\n展开的积木调板中出现了一堆文本相关的块。（参见图\
  \ 1-25。）\n\n13. 在展开的积木调板中，点击 `Text` 项目。\n\n作为一个拼图碎片，该项目只有一个部分与另一个碎片连接。那个部分是一个小旋钮，可以完美地契入\
  \ `Label1.Text` 设置器块的空插槽。\n\n**图 1-24：** 标签块吸入按钮块。\n\n![9781118027707-fg060124.tif](img/9781118027707-fg060124_fmt.jpeg)\n\
  \n14. 将 `Text` 块拖入 `Label1.Text` 设置器块的间隙中（参见图 1-26）。\n\n你正在指示你的应用程序将 `Label1` 的文本设置为某些内容。剩下的工作就是指定那个某些内容到底是什么。\n\
  \n15. 点击新掉落的 `Text` 碎片中加粗的 `Text` 单词。\n\n该单词的外观发生了变化，就像你在管理器或 Finder 树中重命名的文件分支一样。\n\
