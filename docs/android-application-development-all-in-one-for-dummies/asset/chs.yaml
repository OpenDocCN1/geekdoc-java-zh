  在本节中，我将展示一组 Windows 命令（即一个 Windows `BAT` 文件），用于创建、编译和安装 Android 应用。我已努力让这个批处理文件具有移植性，以便该文件可以在任何更新过的\
  \ Windows 电脑上正确运行。但我不作保证。如果列表 3-5 中的命令在你的电脑上无法运行，请不要死磕（撞墙）去试图让这些命令运行。把汽车电线重新接回那个小装置上即可，但不要趴在车底检查变速油。\n\
  \n抱歉就到此为止…… 列表 3-5 包含了这些命令。\n\n### 列表 3-5：用你的双手创建一个 Android 应用\n\n（代码块略，保持原样）\n\n\
  为了在（设备或模拟器上）运行，Android 项目文件必须经过签名。你必须添加证明证明该文件来自你，而不是来自恶意黑客。但项目文件并不像合同或艺术品，你无法在项目文件上签名字。相反，你通过“签名”文件来添加你自己的比特序列——一个只属于你自己的序列。一种帮助创建此类序列的算法是\
  \ RSA 加密（如果你想知道，那就是 Rivest、Shamir 和 Adleman 加密）。在签名文件之前，你需要一个密钥——一个应用到文件比特上的大数字。例如，想象通过将\
  \ A 变为 C、将 B 变为 D、将 C 变为 E 等方式来加密秘密消息。单词 Android 变成了 Cpftqkf。那么，应用到文件字母上的“大”数字就是\
  \ 2。\n\n\n\n总之，列表 3-5 中运行的 `keytool` 创建了一个包含 617 位的密钥。然后运行 `jarsigner` 将该密钥应用到你的\
  \ Android 应用程序文件中。\n\n当 `keytool` 运行时，你的电脑会提示你输入一些标识信息。每条信息都是 X.500 属性名称（Distinguished\
  \ Name）标准的一部分。例如，以下是我在开发计算机上运行 `keytool` 的片段：\n\n`Enter keystore password:` `(我编造了一个密码。)`\n\
  `Re-enter new password:` `(我重复了密码。)`\n`What is your first and last name?`\n`  [Unknown]:\
  \  Barry Burd`\n`What is the name of your organizational unit?`\n`  [Unknown]: \
  \ Global Headquarters`\n`What is the name of your organization?`\n`  [Unknown]:\
  \  Burd Brain Consulting`\n`What is the name of your City or Locality?`\n`  [Unknown]:\
  \  Madison`\n`What is the name of your State or Province?`\n`  [Unknown]:  NJ`\n\
  `What is the two-letter country code for this unit?`\n`  [Unknown]:  US`\n`Is CN=Barry\
  \ Burd, OU=Global Headquarters,`\n`O=Burd Brain Consulting, L=Madison, ST=NJ,`\n\
  `C=US correct?`\n`  [no]:  yes`\n\n10. `zipalign` 程序对齐 Android 应用程序文件中的字节（参见旁边的侧边栏）。\n\
  \n你始终要在签名之后进行对齐。对齐不会破坏之前的签名。但如果你反过来操作，签名可能会破坏之前的对齐。\n\n11. 带有 `install` 选项的 `adb`\
  \ 将你的 Android 应用程序复制到模拟器或连接的设备上。\n\n如果 `adb` 有多个模拟器或连接设备可供选择，你可以指定特定的模拟器或设备。例如，要安装到\
  \ `emulator-5556` 而不是 `emulator-5554`，请向 `adb` 命令中添加 `-s emulator-5556` 选项。\n\n\
  ### 偏移超过你的视图范围\n\nAndroid 操作系统（以及所有其他 Unix 类系统）都有一个 `mmap` 程序。`mmap` 中的 `mm` 代表内存映射输入/输出（memory-mapped\
  \ input and output）。`mmap` 程序从文件中获取数据并让应用程序可以使用数据。`mmap` 程序是一个真正的得力助手，为许多应用程序同时提供快速高效的数据访问。\n\
  \n`mmap` 的灵活性并非完全免费。为了让 `mmap` 工作，必须存储某些值以便它们从四字节边界开始。为了理解四字节边界，请考虑你应用程序 APK 文件中的一段数据。一个字节是\
  \ 8 位数据（每位为 0 或 1）。因此，4 个字节是 32 位。现在想象两个值（Value A 和 Value B）紧挨存储在你的 APK 文件中。（参见此图）。Value\
  \ A 消耗了 3 个字节，Value B 消耗了 4 个字节。\n\n如果没有四字节对齐，计算机可能会将 Value B 的第一个字节紧接着 Value A\
  \ 的最后一个字节存储。如果是这样，Value B 将从四字节组的最后一个字节开始。但 `mmap` 只有当每个值从四字节组的开头开始时才能工作。因此，Android\
  \ 的 `zipalign` 程序按照下图下半部分所示移动数据。`zipalign` 没有使用每个可用字节，而是浪费了一个字节以便 Value B 易于定位。\n\
  \n![9781118027707-sb060301.eps](img/9781118027707-sb060301_fmt.jpeg)\n\n# 第 4 章：原生化\n\
  \n## 本章内容\n\n- 将 C 代码到 Java 代码\n- 使用原生代码创建 Android 应用程序\n\n有时，你必须亲自动手。你必须打开引擎盖，弄清楚为什么汽车会冒烟。你必须为那位对商店蛋糕成分过敏的特殊朋友烘焙蛋糕。或者，为了构建完美的移动应用，你必须绕过\
  \ Android 舒适的 Java 外壳，深挖以找到真正的内在极客精神。你必须使用 C 这种原始的、螺丝钉式的、粗直接的语言来创建应用的一部分。\n\n第二卷第\
  \ 2 章解释了 Java 如何在你的处理器硬件和运行的应用程序之间放置一个虚拟机。Java 程序不会直接转换为处理器可以运行的指令集。相反，你的处理器运行的是一组指令，或者一个虚拟机。（你的\
  \ Android 设备运行 Dalvik 虚拟机；你的笔记本电脑运行 Java 虚拟机。）虚拟机解释 Java 程序的指令并代表你的处理器执行这些指令。\n\n\
  总之，这个新增的软件层（在 Java 指令和你的处理器电路之间）既有优点也有缺点。与硬件隔离增强了可移植性和安全性。但额外的软件层可能会减慢程序的执行速度。该层还防止了\
  \ Java 对处理器进行微观管理。\n\n想象通过直接从当地烘焙店订购蛋糕来解决过敏朋友的问题。“我的朋友对小麦过敏。你们可以在不使用任何小麦制品的情况下制作蛋糕吗？”\n\
  \n\n\n\n下载 NDK 压缩包后，双击此压缩文件以显示文件内容。然后，将文件的内容（不是文件本身——而是压缩包内部的内容）拖到你开发计算机硬盘上方便存放的地方。（在我的\
  \ Windows 电脑上，我只在下载的压缩包里看到一个项目，即一个名为 `android-ndk` 的文件夹。我将此文件夹拖到我的 C 盘根目录下。结果是，我有一个名为\
  \ `c:\\android-ndk` 的文件夹。）\n\n![tip.eps](img/tip_fmt.jpeg) 请记住包含你解压后的 NDK 材料的文件夹（或者你“解压\
  \ `bz2`”并“解压 `tar`”后的 NDK 材料）。我在后面的章节中会引用这个文件夹。我将其称为你的 `NDK_HOME` 目录。\n\n## 获取 C\
  \ 编译器\n\n在本章的大型示例中，一个 C 程序执行应用程序的部分工作。因此，要运行本章的大型示例，你需要一个 C 编译器。如果你运行 Mac OS X 或\
  \ Windows，你可能也可能没有 C 编译器。如果你在开发电脑上运行 Linux，你可以自得洋了，因为你已经正确 own 好了一切。（实际上，别自得。只需跳过此“获取\
  \ C 编译器”章节即可。）\n\n### 为 Windows 获取 C 编译器\n\nWindows 用户可以通过以下步骤获取 C 编译器：\n\n1. 访问\
  \ [`http://cygwin.com`](http://cygwin.com)。\n2. 在 Cygwin 网站上，寻找 Cygwin 安装文件。\n\n\
  我找到的文件命名非常雅致，名为 `setup.exe`。但请记住，你的文件名可能会有所不同。\n\n3. 下载 Cygwin 安装文件，然后双击安装文件开始运行。\n\
  \n`setup.exe` 和“安装文件”这些名称略有误导性。当你运行此文件时，计算机会启动一个程序，提议从网上下载更多代码。\n\n4. 点击 Next（下一步）浏览安装的初始对话框。\n\
  \n点击 Next 从一个对话框移动到另一个后，你到达了 Select Packages（选择包）对话框。（见图 4-1。）\n\n**图 4-1：** Cygwin\
  \ 的设置程序为你提供了一些包。\n\n![9781118027707-fg060401.tif](img/9781118027707-fg060401_fmt.jpeg)\n\
