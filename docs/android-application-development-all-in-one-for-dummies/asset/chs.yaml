  \n### 使用数字单位\n\n在列表 1-2 中，我用单位描述第三个按钮的宽度。`60dp` 代表 60 密度像素。密度独立像素（dp）是基于 160 像素每英寸的测量值。“那么，”你问，“160\
  \ 像素每英寸是什么？”密度独立像素是屏幕上的一个点。\n\n不同的设备具有不同的像素密度。例如，低密度屏幕可能每英寸 120 像素，而高密度屏幕可能每英寸 260\
  \ 像素。为了调整这些差异，每个 Android 屏幕都有多个指标。每个指标都是描述屏幕某些特征的数值值：\n\n- `displayWidth`（`int`）：从屏幕左边缘到右边缘的像素数。\n\
  - `heightPixels`（`int`）：从屏幕顶部到底部的像素数。\n- `xdpi`（`int`）：每英寸从左到右的像素数。\n- `ydpi`（`int`）：每英寸从上到下的像素数。（在正正方形内，某些屏幕横向像素比垂直多，所以\
  \ `xdpi` 并不等于 `ydpi`。）\n- `densityDpi`（`int`）：每英寸像素数的通用衡量。对于 `xdpi` 和 `ydpi` 值相同的屏幕，`densityDpi`\
  \ 等于 `xdpi` 和 `ydpi`。对于 `xdpi` 和 `ydpi` 值不等的屏幕，有人计算出了屏幕的 `densityDpi`（但他们没有告诉我是如何计算的）。\n\
  - `density`（`float`）：每英寸像素数除以 160。\n- `scaledDensity`（`float`）：`density` 测量值，但根据用户选择的默认字体大小进行了额外的的拉伸或压缩。\n\
  \n当你指定 160dp 时（如列表 1-2 所示），你是在告诉 Android 显示 `density` × 160 像素。因此，在我的小屏幕上，160dp\
  \ 的宽度是英寸；而在你从 2055 年穿越时而带来的 Android 家庭影院上，160dp 的宽度也是英寸。每个人都得到了他们想要的英寸。\n\n\n\n\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) `dpi` 字母代表每英寸点数（dots per inch）。你的\
  \ Android 项目拥有名为 `res/drawable-hdpi`、`res/drawable-ldpi` 和 `res/drawable-mdpi` 的文件夹。在运行时，Android\
  \ 会感知设备或模拟器的屏幕密度，并使用最合适的 `res/drawable-dpi` 文件夹中的资源。要了解 Android 认为各种屏幕密度的“最合适”值是什么，请访问\
  \ [`http://developer.android.com/guide/practices/screens_support.html`](http://developer.android.com/guide/practices/screens_support.html)。\n\
  \n另一个方便的单位是 `sp` —— 比例无关像素（scale-independent pixels）。与 `dp` 单位一样，`sp` 单位的大小可以根据不同的屏幕进行良好调整。但\
  \ `sp` 单位的大小以两种方式发生变化。除了根据屏幕像素密度变化外，`sp` 单位还会根据用户的字体大小设置设置发生变化。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ `dp` 和 `dip` 缩写是可以互换的。它们都代表设备无关像素（device-independent pixels）。但 `sp` 始终是 `sp`。Android\
  \ 没有名为 `sip` 的单位。\n\n如果你想刁剔一下，可以使用物理单位。例如，值 1 代表一英寸。其他不理想的物理单位包括 `mm`（毫米）、`pt`（磅，1\
  \ 磅等于 1/72 英寸）和 `px`（像素 —— 设备屏幕上的实际点）。在几乎所有情况下，你都应该避免物理单位。使用 `dp` 来指定视图的大小，使用 `sp`\
  \ 来指定文本字体大小。\n\n图 1-4 和图 1-5 说明了像素与密度无关像素之间的关系。图 1-4 中的屏幕密度为 0.75。因此，一个宽一英寸的按钮消耗了\
  \ `0.75 × 160 = 120` 个像素。你可以通过比较 `160dp` 和 `160px` 按钮的大小来确认这一点。`160dp` 按钮的宽度大约是\
  \ `160px` 按钮的四分三。\n\n**图 1-4：** 低密度显示器。\n\n![9781118027707-fg040104.tif](img/9781118027707-fg040104_fmt.jpeg)\n\
  \n**图 1-5：** 高密度显示器。\n\n![9781118027707-fg040105.tif](img/9781118027707-fg040105_fmt.jpeg)\n\
  \n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 本书的图表在打印过程中可能会被拉伸或缩小。物体可能比看起来要大。在书页上或你的电子阅读器屏幕上测量为一英寸的长度，并不一定是\
  \ Android 设备屏幕上的一英寸。\n\n图 1-5 中的屏幕密度为 1.5，因此在图 1-5 中，`160dp` 按钮的宽度是 `160px` 按钮的\
  \ 1.5 倍。\n\n描述图 1-4 和图 1-5 布局的 XML 文档如代码列表 1-3 所示。\n\n代码列表 1-3：使用尺寸单位\n\n```xml\n\
  <?xml version=”1.0” encoding=”utf-8”?>\n<LinearLayout xmlns:android\n      “http://schemas.android.com/apk/res/android”\n\
  \    android:orientation=”vertical”\n    android:layout_width=”fill_parent”\n  \
  \  android:layout_height=”fill_parent”>\n<TextView android:textSize=”30sp”\n   \
  \       android:layout_width=”wrap_content”\n          android:layout_height=”wrap_content”\n\
  \          android:textColor=”#FFFF”\n          android:id=”@+id/textView1”></TextView>\n\
  <Button android:layout_width=”160dp”\n          android:text=”160dp”\n         \
  \ android:layout_height=”wrap_content”\n          android:id=”@+id/button1”></Button>\n\
  <Button android:layout_width=”160px”\n          android:text=”160px”\n         \
  \ android:layout_height=”wrap_content”\n          android:id=”@+id/button2”></Button>\n\
  </LinearLayout>\n```\n\n注意图 1-4 和图 1-5 中文本视图中的度量信息。为了显示这些信息，我在应用的主类中使用 `android.util.DisplayMetrics`\
  \ 类：\n\n```java\npackage com.allcode.screen;\nimport android.app.Activity;\nimport\
  \ android.os.Bundle;\nimport android.util.DisplayMetrics;\nimport android.widget.TextView;\n\
  public class ScreenActivity extends Activity {\n  TextView textView;\n  DisplayMetrics\
  \ metrics;\n  String densityDpi;\n  @Override\n  public void onCreate(Bundle savedInstanceState)\
  \ {\n    super.onCreate(savedInstanceState);\n    setContentView(R.layout.main);\n\
  \    textView = (TextView) findViewById(R.id.textView1);\n    metrics = new DisplayMetrics();\n\
  \    getWindow().getDisplay().\n    getMetrics(metrics);\n    switch (metrics.densityDpi)\
  \ {\n      case DisplayMetrics.DENSITY_LOW:\n        densityDpi = “DENSITY_LOW”;\n\
  \      case DisplayMetrics.DENSITY_MEDIUM:\n        densityDpi = “DENSITY_MEDIUM”;\n\
  \      case DisplayMetrics.DENSITY_HIGH:\n        densityDpi = “DENSITY_HIGH”;\n\
  \      default:\n        densityDpi = “???”;\n    }\n    textView.setText(densityDpi);\n\
  \  }\n}\n```\n\n`android:padding` 和 `android:margin`\n\n物体在屏幕上需要空间。Android 有名为 `padding`\
  \ 和 `margin` 的属性：\n\n* 视图的 `padding` 是视图与其边界之间的空间。\n* 视图的 `margin` 是视图与其外部之间的空间。\n\
  \n在图 1-6 中，我们叠加到 Eclipse 布局编辑器上。带有小方块的矩形是视图的边界。`padding` 让视图内部不拥挤，而 `margin` 决定了视图想要的个人空间。\n\
  \n**图 1-6：** 内边距与外边距。\n\n![9781118027707-fg040106.tif](img/9781118027707-fg040106_fmt.jpeg)\n\
  \n代码列表 1-4 包含了生成图 1-6 布局的代码。\n\n代码列表 1-4：使用内边距和外边距\n\n```xml\n<?xml version=”1.0”\
  \ encoding=”utf-8”?>\n<LinearLayout xmlns:android\n      “http://schemas.android.com/apk/res/android”\n\
  \    android:orientation=”vertical”\n    android:layout_width=”match_parent”\n \
  \   android:layout_height=”match_parent”\n    android:gravity=”center”>\n  <LinearLayout\
  \ android:id=”+id/LinearLayout1”\n        android:layout_height=”wrap_content”\n\
  \        android:layout_width=”wrap_content”\n        android:background=”@color/opaque_white”>\n\
  \    <TextView android:text=”Dummies”\n             android:layout_margin=”30dip”\n\
  \             android:padding=”30dip”\n             android:textSize=”30sp”\n  \
  \           android:layout_height=”wrap_content”\n             android:layout_width=”wrap_content”\n\
  \             android:id=”@+id/textView1”\n             android:textColor=”@color/opaque_black”></TextView>\n\
  \  </LinearLayout>\n</LinearLayout>\n```\n\n`android:gravity` 和 `android:layout_gravity`\n\
  \n我曾问过一个按钮长大后想成为什么。按钮回答说：“我想成为宇航员。”于是我把它放在一个具有 `android:layout_gravity=”center”`\
  \ 的布局中。Android 有两个命名相似的属性，很容易混淆它们：\n\n* `android:gravity` 告诉布局如何在其内部对齐视图。\n* `android:layout_gravity`\
  \ 告诉视图如何在其布局中定位自己。\n\n图 1-7 阐明了这一观点。\n\n图 1-7 中的屏幕包含一个高度为 220dip 的缩短线性布局和一个按钮。其\
  \ `android:layout_gravity` 是 `center_vertical`，因此灰色布局移动到了屏幕中心。但布局的 `android:gravity`\
  \ 属性是 `center_horizontal`，因此按钮在布局内水平移动到中心。按钮还悬挂在布局的顶部，因为默认情况下，物体会向上移动并靠向左侧。\n\n\n\
  \n\n图 1-7：灰色布局居于屏幕中心；按钮居于灰色布局的顶部。\n\n![9781118027707-fg040107.tif](img/9781118027707-fg040107_fmt.jpeg)\n\
  \n### 使用 `layout_gravity` 和 `gravity`\n\n列表 1-5：使用 `layout_gravity` 和 `gravity`\n\
  \n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\n\
  \      \"http://schemas.android.com/apk/res/android\"\n    android:layout_gravity=\"\
  center_vertical\"\n    android:gravity=\"center_horizontal\"\n    android:background=\"\
  #F999\"\n    android:orientation=\"vertical\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"220dip\">\n    <Button android:text=\"Button\"\n \
  \       android:id=\"@+id/button1\"\n        android:layout_width=\"wrap_content\"\
  \n        android:layout_height=\"wrap_content\">\n    </Button>\n</LinearLayout>\n\
  ```\n\n图 1-8 到 1-11 展示了其他 `android:gravity` 属性值。\n\n图 1-8：`<Linear Layout android:\
  \ gravity= ”center_ vertical” . ..`\n\n![9781118027707-fg040108.tif](img/9781118027707-fg040108_fmt.jpeg)\n\
  \n图 1-9：`<Linear Layout android: gravity= ”center” . ..`\n\n![9781118027707-fg040109.tif](img/9781118027707-fg040109_fmt.jpeg)\n\
  \n图 1-10：`<Linear Layout android: gravity= ”bottom| right” . ..`\n\n![9781118027707-fg040110.tif](img/9781118027707-fg040110_fmt.jpeg)\n\
  \n图 1-11：没有显式 `android:gravity` 属性的 Linear Layout。\n\n![9781118027707-fg040111.tif](img/9781118027707-fg040111_fmt.jpeg)\n\
  \n图 1-10 显示了通过使用 Java 的位或操作符（`|`）组合重 值时可以实现的效果。\n\n### `android:color`\n\n你可以将颜色应用于各种事物——诸如文本、背景、阴影、链接和其他内容。在列表\
  \ 1-5 中，我使用了 `android:background=\"#F999”` 属性，将布局的背景设置为一种安静、庄重的浅灰色。\n\n作为一名 Android\
  \ 开发人员，创建颜色最专业的方法是在 `res/values/colors.xml` 文件中声明它。该文件的内容类似于列表 1-6 中的。\n\n列表 1-6：一个\
  \ `colors.xml` 文件\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<resources\
  \ xmlns:android=\n    \"http://schemas.android.com/apk/res/android\">\n  <color\
  \ name=\"bright_red\">#F00</color>\n  <color name=\"bright_red2\">#FF00</color>\n\
  \  <color name=\"bright_red3\">#FF0000</color>\n  <color name=\"translucent_red\"\
  >#7F00</color>\n  <color name=\"invisible_good_for_nothing_red\">\n      #00FF0000\n\
  \  </color>\n  <color name=\"white\">#FFF</color>\n  <color name=\"black\">#000</color>\n\
  \  <color name=\"puce\">#CC8898</color>\n</resources>\n```\n\n颜色值以井号（`#`）开头，然后是三、四、六或八个十六进制数字。对于三位数，最左边的数字代表红色程度，中间的数字代表绿色程度，右边的数字代表蓝色程度。（颜色总是按照这个顺序出现——红、绿、然后是蓝。这被称为\
  \ RGB 颜色。）因此，例如，颜色值 `#F92` 代表一种看起来不错的橙色——15 单位红色、9 单位绿色和 2 单位蓝色，每种颜色最大可为 16 单位。\n\
  \n仅用三位数时，你无法表达细微的差异。因此，Android 允许你用六位数序列来表示颜色。例如，值 `#FEF200` 是此书封面黄色的良好近似值。它是 254\
  \ 单位红色、242 单位绿色且没有蓝色，每种颜色最大可为 255 单位。\n\n对于三个 RGB 数字，你可以在井号后立即添加第四个数字。而对于六个 RGB\
  \ 数字，你可以在井号后立即添加两个 alpha 数字。alpha 值是不透明度的程度，15 表示完全不透明，0 表示完全透明。因此，列表 1-6 中的值 `#7F00`\
  \ 是部分红色的（“半透明红”）。\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout\
  \ xmlns:android=\n    \"http://schemas.android.com/apk/res/android\"\n    android:background=\"\
  @color/translucent_red\"\n    android:layout_height=\"wrap_content\"\n    android:layout_width=\"\
  match_parent\"\n    android:orientation=\"vertical\">\n    <Button android:text=\"\
  Button\"\n        android:id=\"@+id/button1\"\n        android:layout_height=\"\
  wrap_content\"\n        android:layout_width=\"wrap_content\">\n</LinearLayout>\n\
  ```\n\n黑色背景下，值 `#7F00` 是淡红色的。\n\n\n\n但不要放弃相对布局（relative layouts）！对于复杂的设计，人们尝试在其他线性布局内部创建大量的线性布局嵌套。在有人运行代码之前，一切都很顺利。线性布局的过度嵌套会减慢处理器的速度。\n\
  \nAndroid 有两个工具可以帮助你摆脱嵌套的线性布局。一个是层级查看器（hierarchy viewer）。层级查看器是你 SDK tools 目录中的一个可执行文件。层级查看器的树显示了你布局对象的嵌套情况。\n\
  \n图 1-15 包含了我最近的一个项目中令人尴尬的层级查看器分析。每个圆矩形代表一个视图（view），树的长度（从左到右）显示了该项目的嵌套深度。树的某些分支深达七层，处理器在没有先计算树分支上左侧的视图之前，无法绘制某个视图。因此，处理器在尝试渲染整个场景时运行得非常缓慢。\n\
  \n**图 1-15：** 层级查看器。\n\n![9781118027707-fg040115.tif](img/9781118027707-fg040115_fmt.jpeg)\n\
  \n运行层级查看器可以告诉你你的布局嵌套有多深。结合查看器的树结构，你可以寻找消除某些嵌套的方法。\n\n另一个在对抗嵌套布局中非常有用的工具是 Eclipse\
  \ 中的重构工具。以下是使用方法：\n\n1. 使用 Eclipse 的图形化布局编辑器（Graphical Layout editor）在线性布局内部创建一个极其糟糕的线性布局集合。\n\
  2. 在图形化布局编辑器中，选择最外层的线性布局。\n3. 在 Eclipse 的主菜单中，选择 `Refactor⇒Android⇒Change Layout`。\n\
  此时会出现 `Change Layout` 对话框。\n4. 在 `Change Layout` 对话框的下拉列表中，选择 `Relative Layout`（相对布局）。\n\
  5. 觉得好玩，点击 `Preview`（预览）。\nEclipse 向你展示它计划更改你的 XML 代码的所有方式。（见图 1-16。）\n6. 点击 `OK`。\n\
  \n搞定！你获得了一个高效的相对布局。新的相对布局看起来和你旧的线性布局网络完全一样。但与一组嵌套的线性布局不同，相对布局在计算上是高效的。\n\n**图 1-16：**\
  \ Eclipse 比较你的旧代码和新代码。\n\n![9781118027707-fg040116.tif](img/9781118027707-fg040116_fmt.jpeg)\n\
  \n### 表格布局 (Table Layout)\n\n表格布局拥有行，每行包含一些视图。如果你不对默认值进行任何修改，视图将对齐并形成列。\n\n例如，图\
  \ 1-17 中的表格布局有三行表格。每行表格行都包含按钮。\n\n```xml\n<TableLayout ... >\n    <TableRow ...>\n\
  \        <Button ... android:layout_width=\"wrap content\"\n                  ...\
  \ android:text=\"Button\">\n        <Button ... android:layout_width=\"wrap content\"\
  \n                  ... android:text=\"Button\">\n        <Button ... android:layout_width=\"\
  wrap content\"\n                  ... android:text=\"Button\">\n    </TableRow>\n\
  \    <TableRow ...>\n        <Button ... android:layout_width=\"wrap content\"\n\
  \                  ... android:text=\"Button\">\n        <Button ... android:layout_width=\"\
  wrap content\"\n                  ... android:text=\"Wide button\">\n    </TableRow>\n\
  \    <TableRow ...>\n        <Button ... android:layout_width=\"wrap content\"\n\
  \                  ... android:text=\"Button\">\n        <Button ... android:layout_width=\"\
  wrap content\"\n                  ... android:text=\"Btn.\">\n        <Button ...\
  \ android:layout_width=\"wrap content\"\n                  ... android:text=\"Button\"\
  >\n    </TableRow>\n</TableLayout>\n```\n\n**图 1-17：** 表格布局中的按钮。\n![9781118027707-fg040117.tif](img/9781118027707_11fmt.jpeg)\n\
  \n### 帧布局 (Frame Layout)\n\n帧布局显示一个视图。这有什么用呢？\n嗯，更准确地说（而且不那么危人耸听），帧布局是在在另一个视图前面显示视图。（戴上\
  \ 3D 眼镜，将帧布局想象成一个向外延伸的布局。）由于视图往往会覆盖它们，帧布局通常只显示一个视图——即最前面的那个。\n\n帧布局通常用于以下目的之一：\n\
  - 帧布局可能会在较大的视图上显示较小的视图（例如图像上的文本）。\n- 帧布局可以存储多个视图，但任何时间只有一个是的。通过帧布局，你可以更改屏幕上某个位置显示的内容。\n\
  \n本节的示例说明了这两种观点。你从一个叠加在图像上的单词开始，该图像又叠加在另一个图像上。（见图 1-18。）\n\n**图 1-18：** 帧布局上的三个控件。\n\
  ![9781118027707-fg040118.tif](img/9781118027707_1fmt.jpeg)\n\n当用户触摸屏幕时，三个项目中的两个会消失。（见图\
  \ 1-19。）屏幕在三张图像之间循环，每当用户触摸屏幕时切换图像。（见图 1-20 和 1-21。）\n\n**图 1-19：** 喵！\n![9781118027707-fg04019.tif](img/9781118027707_19.jpeg)\n\
  \n**图 1-20：** 三张图像中最大的。\n![9781118027707-fg04020.tif](img/9781118027707_20.jpeg)\n\
  \n**图 1-21：** 中等大小的图像。\n![9781118027707-fg04021.tif](img/9781118027707_21.jpeg)\n\
  \n（我知道你想什么：“作者在找借口放猫。”这部分正确。我包含了大量的插图来帮助你视觉化代码。无论如何，猫的照片是完美的素材。）\n\n列表 1-8 显示了图\
  \ 1-18 到 1-21 应用的 XML 代码。\n\n**列表 1-8：** 创建帧布局\n\n\n\n\n```java\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.frame);\n    imageCalico =\n        (ImageView) findViewById(R.id.imageViewCalico);\n\
  \    imageBurmese =\n        (ImageView) findViewById(R.id.imageViewBurmese);\n\
  \    textView = (TextView) findViewById(R.id.textView);\n}\n  int count = 0;\n \
  \ public void rotate(View view) {\n    switch (count++ % 3) {\n    case 0:\n   \
  \     textView.setVisibility(View.VISIBLE);\n        imageCalico.setVisibility(View.INVISIBLE);\n\
  \        imageBurmese.setVisibility(View.INVISIBLE);\n        break;\n    case 1:\n\
  \        textView.setVisibility(View.INVISIBLE);\n        imageCalico.setVisibility(View.VISIBLE);\n\
  \        imageBurmese.setVisibility(View.INVISIBLE);\n        break;\n    case 2:\n\
  \        textView.setVisibility(View.INVISIBLE);\n        imageCalico.setVisibility(View.INVISIBLE);\n\
  \        imageBurmese.setVisibility(View.VISIBLE);\n        break;\n    }\n  }\n\
  }\n```\n\n当应用启动运行时，所有三个视图（两个图像和一个文本视图）都是可见的。但随后列表 1-9 会在一个视图之间之间循环切换。每次调用 `rotate`\
  \ 方法都会让一个视图可见并让另外两个视图隐藏。\n\n# 第 2 章：菜单、列表与通知\n\n## 本章内容\n\n- ![check.png](img/check.png)\
  \ 构建选项菜单和上下文菜单\n- ![check.png](img/check.png) 在 Activity 中以及独立 Activity 使用列表\n-\
  \ ![check.png](img/check.png) 向状态栏添加通知\n\n当然，我真希望自己正待在我最喜欢的廉价餐馆里，点几道美食家永远不会去吃的菜。遗憾的是，我并不在那里。尽管我很想聊聊关于食物的菜单，但我实际上要聊的是\
  \ Android 内部的菜单！\n\n## 关于菜单的一切\n\nAndroid 为提供了一个简单的机制，让你向应用程序中添加菜单。在 Android 的帮助下，你可以添加以下类型的菜单：\n\
  \n- **选项菜单 (Options menu)**：选项菜单是用户在预 Honeycomb 设备上按下 `Menu` 键时出现的菜单。（参见图 2-1。）在运行\
  \ Android 3.0 或更高版本的设备上，当用户点击小菜单图标时，会出现选项菜单。（图 2-2 用我开发电脑的模拟器说明了这一点。看到的不是手指触摸图标，而是我的鼠标光标。）\n\
  \n此外，Honeycomb 还有一个动作栏（action bar）。动作栏出现在屏幕的右上角。（参见图 2-3。）\n\n- **上下文菜单 (Context\
  \ menu)**：上下文菜单是用户长按视图时呈现的浮动菜单项列表。（参见图 2-4。）\n\n- **子菜单 (Submenu)**：子菜单是用户通过点击选项菜单或上下文菜单上的菜单项而打开的浮动菜单项列表。子菜单项不支持嵌套的子菜单。\n\
  \n**图 2-1**：Gingerbread（或更版本）上的选项菜单。\n\n![9781118027707-fg040201.tif](img/9781118027707-fg040201_fmt.jpeg)\n\
  \n**图 2-2**：Honeycomb（或更高版本）上的选项菜单。\n\n![9781118027707-fg040202.tif](img/9781118027707-fg040202_fmt.jpeg)\n\
  \n**图 2-3**：动作栏中的选项菜单（Honeycomb 或更高版本）。\n\n![9781118027707-fg040203.tif](img/9781118027707-fg040203_fmt.jpeg)\n\
  \n**图 2-4**：上下文菜单。\n\n![9781118027707-fg040204.tif](img/9781118027707-fg040204_fmt.jpeg)\n\
  \n在选项菜单中，你会发现两组内容：\n\n- **图标 (Icon)**：这些是出现在预 Honeycomb 设备屏幕底部的菜单项。该设备支持最多六个图标类型的菜单项。（再次参见图\
  \ 2-1。）\n\n- **展开 (Expanded)**：展开菜单是一个超了原始六个图标类型菜单项的菜单项列表。\n\n在预 Honeycomb 设备上，当你在选项菜单上放置超过六个项时，Android\
  \ 会自动添加一个“更多”（More）项。（参见图 2-5。）当用户点击“更多”项时，会出现展开菜单。（参见图 2-6。）\n\n在 Honeycomb 之后，项可以堆叠在动作栏和动作栏的溢出箱中。（参见图\
  \ 2-7。）你通过 `android:showAsAction=\"ifRoom|withText\"` 属性控制这种行为。\n\n在本章中，你将创建一个选项菜单和一个上下文菜单。\n\
  \n**图 2-5**：带有“更多”项的选项菜单。\n\n![9781118027707-fg040205.tif](img/9781118027707-fg040205_fmt.jpeg)\n\
  \n**图 2-6**：展开菜单。\n\n![9781118027707-fg040206.tif](img/9781118027707-fg040206_fmt.jpeg)\n\
  \n**图 2-7**：动作栏。\n\n![9781118027707-fg040207.tif](img/9781118027707-fg040207_fmt.jpeg)\n\
  \n## 创建选项菜单\n\n你可以使用 Java 代码或 XML 文档来创建菜单。如果你使用 XML，文档位于 `res/menu`。这有助于将菜单定义与实际代码分离。\n\
  \n### 定义 XML 文件\n\n要定义 XML，请按照以下步骤操作：\n\n1. 在 `res` 目录下创建一个 `menu` 文件夹。\n2. 添加 `list_menu.xml`\
  \ 文件。\n3. 在 `list_menu.xml` 中输入代码：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<menu xmlns:android=\"http://schemas.android.com/apk/res/android\">\n\
  \    <item\n        android:id=\"@+id/menu_insert\"\n        android:icon=\"@drawable/ic_add\"\
  \n        android:title=\"insert\" />\n    <item\n        android:id=\"@+id/make_noise\"\
  \n        android:icon=\"@drawable/ic_play\"\n        android:title=\"noise\" />\n\
  </menu>\n```\n\n4. 创建名为 `menu_insert` 和 `honk` 的新字符串资源。\n5. 将所示代码添加到项目的主 Activity\
  \ 中：\n\n```java\n@Override\npublic boolean onCreateOptionsMenu(Menu menu) {\n  \
  \  super.onCreateOptionsMenu(menu);\n    MenuInflater inflater = getMenuInflater();\n\
  \    inflater.inflate(R.menu.list_menu, menu);\n    return true;\n}\n```\n\n当你加载\
  \ XML 文档时，Android 将 XML 代码转换为类似于 Java 代码的内容（可能是 Java 对象）。在前面的代码中，我获取了一个可以从 XML 加载菜单的\
  \ `MenuInflater`。然后我加载 XML 代码以获取真实的对象。\n\n`ldpi`、`mdpi` 和 `hdpi` 版本的图标都构建在 `res/drawable`\
  \ 文件夹中。\n\n6. 运行应用程序。根据当前的风向，当你点击菜单按钮或图标时，你会看到图 2-2 或图 2-8。你甚至可能看到图 2-3 中的动作栏项（无需点击）。\n\
  \n### 处理用户操作\n\n菜单已经创建，现在你希望在点击它时执行某些操作。为了此此，请将列表 2-1 中的方法添加到应用的主 Activity 中。\n\n\
  **列表 2-1：响应菜单项**\n\n```java\n@Override\npublic boolean onOptionsItemSelected(MenuItem\
  \ item) {\n    switch (item.getItemId()) {\n        case R.id.menu_insert:\n   \
  \         createReminder();\n            return true;\n        case R.id.make_noise:\n\
  \            MediaPlayer mediaPlayer =\n                MediaPlayer.create(this,\
  \ R.raw.honk);\n            mediaPlayer.start();\n            return true;\n   \
  \ }\n    return super.onOptionsItemSelected(item);\n}\n```\n\n\n\n\n在你的 `onOptionsItemSelected`\
  \ 方法中，你进行了一次“老操作”来确定用户到底点击了哪一个项。你将被点击项的 ID 与 `list_menu.xml` 文档中的项 ID 进行匹配。在这个示例中，你的菜单有两个项。其中一个项创建一个提醒，另一个项则播放声音。\n\
  \n你仍然需要定义 `createReminder` 方法，但在此期间，你可以为项目添加一个声音。要添加声音，首先创建一个 `res/raw` 文件夹，然后将一个\
  \ MP3 文件拷贝到该 `res/raw` 文件夹中。将文件重命名为 `honk.mp3` 后，你就可以准备大显身手了。\n\n列表 2-1 中的方法返回了\
  \ `true`。这个 `true` 值告诉 Android 你已经完成了对用户选择的处理。如果你返回 `false`，Android 会把选择事件传递给可能可能正在等待它的其他代码。\n\
  \n## 创建提醒\n\n列表 2-2 中的方法响应了列表 2-1 中的调用。将列表 2-2 的代码添加到你项目的主活动类（main activity）中。\n\
  \n### 列表 2-2：调用 Activity 创建新提醒\n\n```java\nprivate static final int ACTIVITY_CREATE\
  \ = 0;\n\nprivate void createReminder() {\n  Intent intent =\n      new Intent(this,\
  \ ReminderEditActivity.class);\n  startActivityForResult(intent, ACTIVITY_CREATE);\n\
  }\n```\n\n`createReminder` 方法启动了一个 `ReminderEditActivity` 实例。`startActivityForResult`\
