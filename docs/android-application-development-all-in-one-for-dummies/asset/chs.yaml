  \ 以方法名开始。方法名后面的括号里是参数列表（parameter list）。关于参数列表的深入理解，请考虑列表 2-6 中的代码。\n\n### 列表 2-6：一个方法和两次方法调用\n\
  \n```java\ndouble monthlyPayment(double principal, double percentageRate, int years)\
  \ {\n    int numPayments = 12 * years;\n    double rate = percentageRate / 100.00;\n\
  \    double effectiveRate = rate / 12;\n    return principal * (effectiveRate /\n\
  \      (1 - Math.pow(1 + effectiveRate, -numPayments)));\n}\n\ndouble myPayment\
  \ = monthlyPayment(100000.00, 5.25, 30);\ndouble yourPayment = monthlyPayment(100000.00,\
  \ 5.00, 15);\n```\n\n\n\n\n\n-   在 `monthlyPayment` 方法声明的体内，处理器计算抵押贷款的每月还款额。\n\n\
  \    你可以遵循这些方法和方法参数的描述，无需理解列表 2-6 中的任何计算逻辑。\n\n-   `monthlyPayment` 方法体内使用某些名称作为占位符。\n\
  \n    例如，在 `montlyPayment` 方法体内，名称 `years` 代表抵押贷款期限的年数。同样，名称 `principal` 代表借贷总额。\n\
  \n-   某些占位符出现在方法声明开头的括号中。\n\n    `principal`、`percentageRate` 和 `years` 名称是方法的参数。每个参数都注定代表一个特定的值。但在应用程序执行方法调用之前，参数并不代表某个值。\n\
  \n    在列表 2-6 中，调用 `monthlyPayment(100000.00, 5.25, 30)` 为方法的第一个参数（即 `principal`）赋予了值\
  \ `100000.00`。同一个调用为方法的第二个参数（`percentageRate`）赋予了值 `5.25`。最后，该方法调用为方法的第三个参数（`years`）赋予了值\
  \ `30`。\n\n    列表 2-6 中的下一个方法调用为 `monthlyPayment` 方法的参数提供了不同的值（`principal` 再次为 `100000.00`，但\
  \ `percentageRate` 为 `5.00`，years 为 `15`）。你每次调用方法，都会为方法的参数提供值。\n\n-   方法调用中的参数类型必须与方法声明中的参数类型匹配。\n\
  \n    列表 2-6 中 `monthlyPayment` 方法的声明有一个 `double` 参数（`principal`）、另一个 `double` 参数（`percentage\
  \ Rate`）以及一个 `int` 参数（`years`）。因此，列表 2-6 中的第一个方法调用有两个 `double` 参数（`100000.00` 和\
  \ `5.25`），随后是一个 `int` 参数（`30`）。列表 2-6 中的第二个方法调用同样有两个 `double` 参数，并在后跟一个 `int` 参数。\n\
  \n    ![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 你可以多次声明同一种方法，只要每个声明具有不同的参数列表即可。例如，列表\
