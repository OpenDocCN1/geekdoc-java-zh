  \ 软件。Cygwin 的文档建议运行安装文件两次。第一次运行此安装时，接受图 4-1 中显示的所有默认设置。\n\n5. 在 Select Packages\
  \ 对话框中保持默认设置，点击 Next。\n\nCygwin 的安装（带有最少组件集）将在你的电脑上进行。要进行 Android NDK 开发，你需要比 Cygwin\
  \ 的最小工具集多一点。\n\n6. 第二次运行 Cygwin 安装文件。\n7. 再次点击 Next 浏览初始对话框。\n\n当你终于看到 Select Packages\
  \ 对话框时，你会看到类别列表，每个类别都显示单词 Default。\n\n8. 展开列表中的 Devel 分支（见图 4-2）。\n\n**图 4-2：**\
