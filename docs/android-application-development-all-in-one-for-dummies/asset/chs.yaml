  # 第 4 章：广播接收器\n\n## 本章主要内容\n\n- 创建广播接收器\n- 整理来自广播接收器的数据\n- 限制接收器的访问权限\n\n本微型书籍的第\
  \ 3 节介绍了一种用于在启动时运行代码的广播接收器。以下是该章广播接收器内容的摘要：\n\n- 当你发送广播时，Android 会启动所有过滤器符合意图（intent）的接收器。\n\
  - 广播接收器的运行时间足够执行接收器中 `onReceive` 方法 get 代码。接收器没有 `onCreate`、`onDestroy` 或任何其他方法——只有\
  \ `onReceive`。在 Android 完成执行 `onReceive` 方法的代码后，广播接收器将进入休眠状态，直到应用程序发送另一个匹配的广播为止。\n\
  \n本章将更详细地描述广播接收器。\n\n## 接收器入门 (101)\n\n本章的第一个示例包含了世界上最简单的广播接收器。确切地说，列表 4-1 包含了接收器类（`MyReceiver`，它继承自\
  \ `BroadcastReceiver`），列表 4-2 包含了广播到接收器的代码，而列表 4-3 包含了示例的 `AndroidManifest.xml`\
  \ 文件。\n\n### 列表 4-1：一个简单的广播接收器\n\n```java\npackage com.allmycode.rec1;\nimport android.content.BroadcastReceiver;\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.util.Log;\n\
  public class MyReceiver extends BroadcastReceiver {\n  @Override\n  public void\
  \ onReceive(Context arg0, Intent arg1) {\n    Log.i(\"MyReceiver\", \"Received a\
  \ broadcast\");\n  }\n}\n```\n\n继承 `android.content.BroadcastReceiver` 的类必须实现 `onReceive`\
  \ 方法。列表 4-1 中的类写道：“当我收到广播时，我会在 Android 的日志中写一条目。”\n\n### 列表 4-2：一个简单的广播者\n\n```java\n\
  package com.allmycode.rec1;\nimport android.app.Activity;\nimport android.content.Intent;\n\
  import android.os.Bundle;\nimport android.view.View;\npublic class MyActivity extends\
  \ Activity {\n  @Override\n  public void onCreate(Bundle savedInstanceState) {\n\
  \    super.onCreate(savedInstanceState);\n    setContentView(R.layout.main);\n \
  \ }\n  public void onButtonClick(View view) {\n    Intent intent = new Intent();\n\
  \    intent.setAction(\"com.allmycode.ACTION\");\n    sendBroadcast(intent);\n \
  \ }\n}\n```\n\n在列表 4-2 中，`onButtonClick` 方法发送了广播。该方法创建一个意图并将将其传递给 `sendBroadcast`\
  \ 方法。\n\n### 列表 4-3：声明广播接收器\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"\
  ?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\n   \
  \ package=\"com.allmycode.rec1\"\n    android:versionCode=\"1\"\n    android:versionName=\"\
  1.0\">\n  <uses-sdk android:minSdkVersion=\"8\" />\n  <application android:icon=\"\
  @drawable/icon\" android:label=\"@string/app_name\">\n    <activity android:name=\"\
  .MyActivity\" android:label=\"@string/app_name\">\n      <intent-filter>\n     \
  \   <action android:name=\"android.intent.action.MAIN\" />\n        <category android:name=\"\
  android.intent.category.LAUNCHER\" />\n      </intent-filter>\n    </activity>\n\
  \    <receiver android:name=\".MyReceiver\">\n      <intent-filter>\n        <action\
  \ android:name=\"com.allmycode.ACTION\" />\n      </intent-filter>\n    </receiver>\n\
  \  </application>\n</manifest>\n```\n\n在列表 4-3 中，接收器的 action 是 `com.allmycode.ACTION`。确实，在列表\
  \ 4-2 中，广播意图的 action 也是 `com.allmycode.ACTION`。在没有其他限制的情况下，广播匹配了接收器。当你运行列表 4-1、4-2\
  \ 和 4-3 中的代码时，Android 会调用接收器的 `onReceive` 方法。该方法会在 Android 的日志文件中写入目。\n\n## 动态创建接收器\n\
  \n在 Android 的四个组件（`Activity`、`Service`、`BroadcastReceiver` 和 `ContentProvider`）中，`BroadcastReceiver`\
  \ 是唯一不需要自己的 `AndroidManifest.xml` 元素的组件。与其像列表 4-3 那样创建 `<receiver>` 元素，你可以在代码中动态注册广播接收器。列表\
  \ 4-4 展示了如何操作。\n\n### 列表 4-4：注册一个新的广播接收器\n\n```java\npublic void onButtonClick(View\
  \ view) {\n    IntentFilter filter = new IntentFilter();\n    filter.addAction(\"\
  com.allmycode.ACTION\");\n    registerReceiver(new MyReceiver(), filter);\n    Intent\
  \ intent = new Intent();\n    intent.setAction(\"com.allmycode.ACTION\");\n    sendBroadcast(intent);\n\
  }\n```\n\n通过列表 4-4 中的加粗代码，你消除了列表 4-3 中 `<receiver>` 元素的需求。\n\n## 调度接收器与广播\n\n你可以创建多个广播接收器的实例并发送多个广播。列表\
  \ 4-5 和 4-6 阐了这种情况。\n\n### 列表 4-5：注册多个接收器\n\n```java\npublic void onButtonClick(View\
  \ view) {\n    IntentFilter filter = new IntentFilter();\n    filter.addAction(\"\
  com.allmycode.ACTION\");\n    MyReceiver receiver = new MyReceiver();\n    registerReceiver(receiver,\
  \ filter);\n    registerReceiver(receiver, filter);\n    registerReceiver(new MyReceiver(),\
  \ filter);\n    Intent intent = new Intent();\n    intent.setAction(\"com.allmycode.ACTION\"\
  );\n    sendBroadcast(intent);\n    Log.i(\"MyActivity\", \"Sent a broadcast; about\
  \ to send another...\");\n    sendBroadcast(intent);\n}\n```\n\n### 列表 4-6：日志中的目\n\
  \n```\nMyActivity(280): Sent a broadcast; about to send another...\nMyReceiver(280):\
  \ Received a broadcast\nMyReceiver(280): Received a broadcast\nMyReceiver(280):\
  \ Received a broadcast\nMyReceiver(280): Received a broadcast\n```\n\n\n\n\n是的，列表\
  \ 4-5 中的代码调用了三次 `registerReceiver`。但第二次调用是多余的，因为它包含了与第一次 `registerReceiver` 调用相同的\
  \ `MyReceiver` 实例。\n\n* 列表 4-5 发送了两个广播。\n\n这一点毫无疑问。\n\n* 在发送完两个广播中的第一个后，activity\
  \ 记录了 `Sent a broadcast; about to send another...` 字样。\n\n但在列表 4-6 中，你看到的日志条目顺序不同。在列表\
  \ 4-6 中，你看到 activity 在吹嘘自己已经发送了一个广播。然后你看到两个广播到达了两个接收器（总共四条日志记录）。\n\n请记住，广播并不是方法调用。发送广播意味着向\
  \ Android 操作系统投递一条消息。系统会按照自己的节奏调用 `onReceive` 方法。因此，对 `onReceive` 的调用（以及相应的日志条目）与发送者的代码是不同步的。即使发送者和接收者类属于同一个应用，这种异步影响也会发生。\n\
  \n### 如何注销接收器\n\n你可以注销、重新注册和再次注销广播接收器。你甚至可以对广播接收器进行“反-反-反-注销”。列表 4-7 和 4-8 用一些代码说明了这一切。\n\
  \n### 列表 4-7：注册与注销接收器\n\n```java\npublic void onButtonClick(View view) {\n  IntentFilter\
  \ filter = new IntentFilter();\n  filter.addAction(“com.allmycode.ACTION”);\n  filter.addDataScheme(“letter”);\n\
  \  MyReceiver receiver1 = new MyReceiver(1);\n  MyReceiver receiver2 = new MyReceiver(2);\n\
  \  registerReceiver(receiver1, filter);\n  registerReceiver(receiver2, filter);\n\
  \  Intent intent = new Intent();\n  intent.setAction(“com.allmycode.ACTION”);\n\
  \  intent.setData(Uri.parse(“letter:A”));\n  sendBroadcast(intent);\n  unregisterReceiver(receiver1);\n\
  \  sendBroadcast(intent);\n  intent.setData(Uri.parse(“letter:B”));\n  sendBroadcast(intent);\n\
  \  registerReceiver(receiver1, filter);\n}\n```\n\n在列表 4-7 中，我在接收器的构造函数调用中为每个接收器提供了自己的\
  \ `int` 值。这有助于接收器在日志条目中识别自己。我还在代码的 intents 中添加了标识字母。但我改变了向 intents 粘贴额外数据（extras）的坏习惯。相反，我创建了自己的\
  \ URI 方案（字母 方案），并随每个 intent 一起发送一个不透明的 URI。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg)\
  \ 不透明的 URI（opaque URI）是指在第一个冒号之后没有特定结构的 URI。我在本微书的第 2 章中描述了不透明 URI。\n\n列表 4-8 包含了接收器的代码。接收器会将它的数字和广播的字母写入每个日志条目中。\n\
  \n#### 列表 4-8：更详细的广播接收器\n\n```java\npackage com.allmycode.rec1;\nimport android.content.BroadcastReceiver;\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.util.Log;\n\
  \npublic class MyReceiver extends BroadcastReceiver {\n  private int number;\n \
  \ public MyReceiver(int number) {\n    this.number = number;\n  }\n  @Override\n\
  \  public void onReceive(Context context, Intent intent) {\n    String letter =\n\
  \        intent.getData().getSchemeSpecificPart();\n    Log.i(“MyRecevier”, number\
  \ + “ Received a broadcast “\n        + letter);\n  }\n}\n```\n\n列表 4-7 和 4-8 中代码的日志输出是什么？列表\
  \ 4-9 提供了答案。\n\n#### 列表 4-9：日志中的条目\n\n```\nMyRecevier(278): 1 Received a broadcast\
  \ A\nMyRecevier(278): 2 Received a broadcast A\nMyRecevier(278): 2 Received a broadcast\
  \ A\nMyRecevier(278): 2 Received a broadcast B\n```\n\n运行列表 4-7 中的代码时会发生以下情况：\n\n\
  * 代码注册了两个 `MyReceiver` 实例，分别为 1 和 2。\n* 代码发送了一个字母为 `A` 的广播。\n两个接收器都收到了该广播。（参见列表\
  \ 4-9 中的前两行。）\n* 代码注销了 `receiver1`。\n此时，只有 `receiver2` 处于注册状态。\n* 代码发送了另一个字母为 `A`\
  \ 的广播。\n只有 `receiver2` 收到了该广播。（参见列表 4-9 中的第三行。）\n* 代码发送了另一个字母为 `B` 的广播。\n再次，`receiver2`\
  \ 收到了该广播。（参见列表 4-9 中的最后一行。）\n* 代码重新注册了 `receiver1`。\n\n该代码在已注册的接收器之后清理了一个广播。相比之下，你为清单（manifest）调用了\
  \ `registerReceiver`。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg) 前一段说，“Android\
  \ 清理”。要了解更多信息，请跳到“如何变为粘性广播（How to be sticky）”部分。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 当我写“注册接收器”时，我包含了 `AndroidManifest.xml` 中声明的任何接收器。Android 通过注册每个清单的实例来响应。\n\n###\
  \ 广播接收器与 Context\n\n与 `startActivity` 和 `startService` 方法一样，`sendBroadcast` 方法属于\
  \ `Context` 类。熟悉的 `Activity` 类是 `Context` 的子类，因此 activity 的代码可以调用这些方法。Android 的\
  \ `Service` 类也是 `Context` 的子类。但 `BroadcastReceiver` 类不是 `Context` 的子类。因此广播接收器的代码无法直接调用\
  \ `startActivity` 或任何其他需要 context 方法。作为变通方法，让广播接收器在其 `onReceive` 方法中使用 `context`\
  \ 参数：\n\n```java\n@Override\npublic void onReceive(Context context, Intent intent)\
  \ {\n  Intent newIntent = new Intent();\n  newIntent.setClassName(“com.allmycode.rec3”,\
  \ “com.allmycode.rec3.OtherActivity”);\n  newIntent.addFlags(Intent.FLAG_ACTIVITY_NEW_TASK);\n\
  \  context.startActivity(newIntent);\n}\n```\n\n另一种破解方法是将接收器编写为带有 context 的组件的内部类：\n\
  \n```java\npackage com.allmycode.rec3;\nimport android.app.Activity;\nimport android.content.BroadcastReceiver;\n\
  import android.content.Context;\nimport android.content.Intent;\nimport android.content.IntentFilter;\n\
  import android.os.Bundle;\n\npublic class ReceiverContextActivity extends Activity\
  \ {\n  @Override\n  public void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.main);\n    IntentFilter filter = new IntentFilter();\n\
  \    filter.addAction(“MY_ACTION”);\n    registerReceiver(new MyReceiver(), filter);\n\
  \    Intent intent = new Intent();\n    intent.setAction(“MY_ACTION”);\n    sendBroadcast(intent);\n\
  \  }\n\n  class MyReceiver extends BroadcastReceiver {\n    @Override\n    public\
  \ void onReceive(Context context, Intent intent) {\n      Intent newIntent = new\
  \ Intent();\n      newIntent.setClassName(“com.allmycode.rec3”, “com.allmycode.rec3.OtherActivity”);\n\
  \      ReceiverContextActivity.this.startActivity(newIntent);\n    }\n  }\n}\n```\n\
  \n### 基础之外\n\n早些部分处理的是一些极简、直接的广播接收器示例。本节涵盖了一些额外的广播接收器功能。\n\n\n\n\n上一节的代码既漂亮又简单。至少我认为它是很棒，因为我是一个老师，无论从职业上还是精神上都是如此。我喜欢这些小示例，即使它们并不健壮到足以在现实世界中使用。\n\
  \n但一些硬核开发者并不认同我的观点。他们会认为列表 4-4、4-5 和 4-7 是“糟糕且简单的”，因为（我在这里非常痛苦且诚实地表示）这些列表中的代码在现实世界中经不起任何考验。事实上，这些列表中的代码可能连轻微的抚摸都活不了。。要弄清楚为什么，请尝试这个实验：\n\
  \n1. 创建一个目标 API 为 8 或更高的全新 Android 项目。实际上，比 API 8 更早的 API 也可以。但对于较早的 API，视图没有那个方便的\
  \ `android:onClick` 属性。因此，对于较早的 API，你需要扩展 `OnClickListener` 并进行一些其他无聊的工作。\n2. 从列表\
  \ 4-2 中的 activity 代码开始。\n3. 将 activity 的 `onButtonClick` 方法更改为与列表 4-4 中的代码一致。\n\
  4. 在 `main.xml` 布局中添加一个按钮，其点击处理程序为 activity 的 `onButtonClick` 方法。\n5. 使用列表 4-3 中的\
  \ `AndroidManifest.xml` 文。\n6. 运行应用。\n7. 在等待应用加载时，切换到 Eclipse 的 DDMS 视图（perspective）。有关在\
  \ Eclipse 视图之间切换的详细信息，请参阅第二卷第 1 章。\n\n当应用加载完成后，你会在模拟器屏幕上看到一个按钮。这就是你在步骤 4 中创建的那个按钮。\n\
  \n8. 点击按钮，查看 Eclipse LogCat 视图中生成的条目。\n\n你会看到两个 `MyReceiver Received a broadcast`\
  \ 条目，因为 Android 正在运行两个 `MyReceiver` 实例。一个实例来自 `AndroidManifest.xml` 文中的 `<receiver>`\
  \ 元素。另一个接收器来自列表 4-4 中的 `registerReceiver` 方法调用。\n\n拥有两个 `MyReceiver` 实例并不是坏事。但在大多数情况下，这可能不是你想要的。观察这两个实例是执行此实验带来的额外收益。\n\
  \n9. 在应用仍运行时，按下模拟器的返回键（Back），再次查看 Eclipse 的 LogCat 视图。\n\n在 Eclipse 的 LogCat 视图中，你会看到一条巨大的、丑陋\
  \ `activity has leaked IntentReceiver` 错误消息。该消息告诉你 Android 已经销毁了你的 activity，并且（因为你忘记这样做……）Android\
  \ 也注销了你的其中一个 `MyReceiver` 实例。\n\n如果你调用了 `registerReceiver`，Android 希望你在终止 activity\
  \ 之前注销接收器。当你按下返回键时，Android 会调用 activity 的 `onPause`、`onStop` 和 `onDestroy` 方法。在这个实验的代码中，你没有重写继承的\
  \ `onPause`、`onStop` 和 `onDestroy` 方法，因此 Android 调用了这些继承的方法。\n\n在这个实验中，Android 发现继承的\
  \ `onDestroy` 方法特别令人痛苦。你正在放弃你的 activity，却把你注册的接收器留在了悬空状态。如果有大量开发者都这样做，用户的 Android\
  \ 设备将经历“活尸广播接收器之夜”。\n\n于是 Android 说：“如果你拒绝清理你自己的摊子，我就帮你清理。我会终止你的广播接收器。而且就像你妈妈一样，我会通过向日志文件写入一条条目来表达我的不满。”（如果妈妈当时能那么冷静就好了！）\n\
  \nAndroid 不喜欢我在列表 4-4 中注册但没有注销的 `MyReceiver` 实例。但 Android 并不来自 `AndroidManifest.xml`\
  \ 文件的 `MyReceiver` 实例（见列表 4-3）。Android 期望这样声明的接收器拥有它们自己的生命，其寿命超过应用程序中任何 activity\
  \ 的寿命。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 错误消息 `activity has\
  \ leaked IntentReceiver` 提示 SDK 有一个 `IntentReceiver` 类。但这具有误导性。`IntentReceiver`\
  \ 这个名字是 Android 早期历史产物。以前被称为 `IntentReceiver` 的东西现在是 `BroadcastReceiver`。\n\n你可能对步骤\
  \ 9 中的 `activity has leaked IntentReceiver` 消息并不印象深刻。毕竟，Android 并不会提醒用户，所以你的应用看起来并不糟糕。当用户点击返回键时，你可能并不介意\
  \ Android 终止你的广播接收器。那么这有什么大不了的呢？尝试接下来的几步……\n\n10. 重启本节的应用。\n11. 再次点击 activity 屏幕上的按钮以调用列表\
  \ 4-4 中的代码。\n12. 在应用仍运行时，按 Ctrl+F11 将模拟器横过来。当然，如果你在真实设备上测试，只需将设备横过来即可。\n\n在 Eclipse\
  \ 的 LogCat 视图中，再次寻找那条侮辱性的 `activity has leaked IntentReceiver` 错误消息。除非你重写默认行为，否则\
  \ Android 在设备方向改变时会销毁并重建你的 activity。对于用户来说，activity 仍然运行良好。但用户并不知道，Android 杀死了广播接收器并没有将其复活。\n\
  \n这种异常在列表 4-4 中没有太大区别，因为你在同一个按钮上注册了接收器并发送了广播。但你的进程状态已经发生了巨大变化。在现实应用中，你仅仅通过倾斜设备就丢失了一个广播接收器。很难想象在那种情况下你会希望这种情况发生。\n\
  \n在大多数应用中，我们在 `onButtonClick` 方法中注册接收器并发送广播，如果我们在本章的示例中处理这些糟糕的情况是可以的。逻辑会变得复杂，而且很容易出错。\n\
  \n通常情况下，处理注册的最简单方法是在 activity 的周期方法中进行注册和注销。列表 4-10 显示了如何做。\n\n### 列表 4-10：处理生命周期\n\
  \n```java\npackage com.allmycode.rec1;\n\nimport android.app.Activity;\nimport android.content.Intent;\n\
  import android.content.IntentFilter;\nimport android.os.Bundle;\nimport android.view.View;\n\
  \npublic class MyActivity extends Activity {\n  MyReceiver receiver = new MyReceiver();\n\
  \  @Override\n  public void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.main);\n  }\n  @Override\n  public void onResume()\
  \ {\n    super.onResume();\n    IntentFilter filter = new IntentFilter();\n    filter.addAction(\"\
  com.allmycode.ACTION\");\n    registerReceiver(receiver, filter);\n  }\n  @Override\n\
  \  public void onPause() {\n    super.onPause();\n    unregisterReceiver(receiver);\n\
  \  }\n  public void onButtonClick(View view) {\n    Intent intent = new Intent();\n\
  \    intent.setAction(\"com.allmycode.ACTION\");\n    sendBroadcast(intent);\n \
  \ }\n}\n```\n\n我可以简单地说明列表 4-10 的核心信息：在 activity 的 `onResume` 方法中创建内容，并在 activity\
  \ 的 `onPause` 方法中丢弃它们。如果你想让内容存活更久，在 activity 的 `onCreate` 方法中创建内容，并在 activity 的\
  \ `onDestroy` 方法中丢弃它们。就这样。（是的，我意识到我写了三页的内容来论证一个我在结尾只用两句话就能总结的问题。）\n\n### 如何做一个固执的人\n\
  \n普通广播在发送给所有匹配的正在运行的接收器后就会消失。但另一种类型的广播——粘性广播——会一直持续直到某些事或显式地将其移除。要移除粘性广播，你可以调用 `removeStickyBroadcast`。或者，你可以关闭设备、用锤子敲设备，或者做其他不愉快的事情。列表\
  \ 4-11 包含了一些信息性的代码。\n\n### 列表 4-11：发送粘性广播\n\n```java\npublic void onButtonClick(View\
  \ view) {\n  IntentFilter filter = new IntentFilter();\n  filter.addAction(\"com.allmycode.ACTION\"\
  );\n  filter.addDataScheme(\"letter\");\n}\n```\n\n\n\n\n```java\nMyReceiver receiver1\
  \ = new MyReceiver(1);\nMyReceiver receiver2 = new MyReceiver(2);\nMyReceiver receiver3\
  \ = new MyReceiver(3);\nIntent intent = new Intent();\nintent.setAction(\"com.allmycode.ACTION\"\
  );\nintent.setData(Uri.parse(\"letter:A\"));\nregisterReceiver(receiver1, filter);\n\
  sendStickyBroadcast(intent);\nregisterReceiver(receiver2, filter);\nremoveStickyBroadcast(intent);\n\
  registerReceiver(receiver3, filter);\n```\n\n结合列表 4-11 中的发送和注册业务以及我在列表 4-8 中设置的接收器，Android\
  \ 记录了列表 4-12 所示条目。\n\n### 列表 4-12：日志文件条目\n\n```text\nMyRecevier(282): 1 Received\
  \ a broadcast A\nMyRecevier(282): 2 Received a broadcast A\n```\n\n在列表 4-11 中，我在发送广播之前注册了\
  \ `receiver1`。因此，`receiver1` 接收到了广播。这没什么特别的。\n\n在列表 4-11 的运行过程中，`receiver1` 是当前唯一注册的接收器，且\
  \ `receiver1` 已接收到广播。但由于广播是粘性的（sticky），所以广播会一直存在。在下一行代码中，当我在列表 4-11 中注册 `receiver2`\
  \ 时，`receiver2` 收到广播。这就是粘性的作用。\n\n在列表 4-11 的最后两条语句中，我移除了粘性广播（通过方法调用，而不是用松剂），并注册了\
  \ `receiver3`。由于我移除了唯一匹配的广播，`receiver3` 并没有接收到任何内容。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 调用 `sendStickyBroadcast`（或调用密切相关的 `sendStickyOrderedBroadcast` 方法）的组件必须在其应用的 `AndroidManifest.xml`\
  \ 文档中包含 `<uses-permission android:name=\"android.permission.BROADCAST_STICKY\" />`\
  \ 元素。调用 `sendBroadcast`（或它的伙伴 `sendOrderedBroadcast` 方法）的组件不需要为此获取权限。\n\n### 使用接收器\
  \ Intent\n\n在某个时刻，你可能会有多个接收器和多个粘性广播以多进程、非确定性的方式争夺注意力。听起来很有趣，不是吗？你可能还会处理来自其他其他应用以及系统本身的广播。为了帮助你跟踪来去去，`registerReceiver`\
  \ 方法会返回一个 intent。这个 intent 来自于新注册的接收器所捕获的（可能是多个）广播之一。\n\n在列表 4-13 中，我注册了两个接收器并向空中抛掷了两个粘性广播（`\"\
  letter:A\"` 和 `\"letter:O\"`）。对于每个接收器注册，列表 4-13 记录了接收器捕获的 intent。\n\n### 列表 4-13：从接收器注册中获取\
  \ Intent\n\n```java\npublic void onButtonClick(View view) {\n    IntentFilter filter\
  \ = new IntentFilter();\n    filter.addAction(\"com.allmycode.ACTION\");\n    filter.addAction(\"\
  com.allmycode.OTHER_ACTION\");\n    filter.addDataScheme(\"letter\");\n    MyReceiver\
  \ receiver1 = new MyReceiver(1);\n    MyReceiver receiver2 = new MyReceiver(2);\n\
  \    Intent returnedIntent =\n        registerReceiver(receiver1, filter);\n   \
  \ Log.i(\"MyActivity\", getStatus(returnedIntent));\n    Intent intentAct = new\
  \ Intent();\n    intentAct.setAction(\"com.allmycode.ACTION\");\n    intentAct.setData(Uri.parse(\"\
  letter:A\"));\n    sendStickyBroadcast(intentAct);\n    Intent intentOth = new Intent();\n\
  \    intentOth.setAction(\"com.allmycode.OTHER_ACTION\");\n    intentOth.setData(Uri.parse(\"\
  letter:O\"));\n    sendStickyBroadcast(intentOth);\n    returnedIntent = registerReceiver(receiver2,\
  \ filter);\n    Log.i(\"MyActivity\", getStatus(returnedIntent));\n}\n\nprivate\
  \ String getStatus(Intent returnedIntent) {\n    if (returnedIntent == null) {\n\
  \        return \"null\";\n    } else {\n        return returnedIntent.toString();\n\
  \    }\n}\n```\n\n列表 4-14 显示了列表 4-13 代码的运行结果（使用了列表 4-8 中的接收器）。第一次注册返回 `null` 而不是实际的\
  \ intent。这是因为当代码执行此第一次注册时，没有任何活跃的广播。\n\n### 列表 4-14：记录这个！\n\n```text\nMyActivity(313):\
  \ null\nMyActivity(313):\n```\n（注：列表 4-14 提供的文本在源码中不完整，此处保留了上述结构。）\n\n\n\n\n列表 4-16\
  \ 证实了 `receiver2` ——优先级最高的接收器 —— 首先接收广播。而糟糕的 `receiver3` ——优先级最低的接收器 —— 最后接收广播。\n\
  \n## 在途中停止广播\n\n在节一节中，有序广播从一个接收器传输到另一个接收器。接收器的顺序取决于它们的相对优先级。\n\n在本节中，你对除一个之外的所有接收器实例实施一个恶劣的手段。如列表\
  \ 4-17 所示修改 `MyReceiver` 类的代码。\n\n### 列表 4-17：中止广播\n\n```java\npackage com.allmycode.rec1;\n\
  \nimport android.content.BroadcastReceiver;\nimport android.content.Context;\nimport\
  \ android.content.Intent;\nimport android.util.Log;\n\npublic class MyReceiver extends\
  \ BroadcastReceiver {\n  private int number;\n  public MyReceiver(int number) {\n\
  \    this.number = number;\n  }\n  @Override\n  public void onReceive(Context context,\
  \ Intent intent) {\n    String letter =\n          intent.getData().getSchemeSpecificPart();\n\
  \      Log.i(\"MyRecevier\", number + \" Received a broadcast \"\n          + letter);\n\
  \    abortBroadcast();\n  }\n}\n```\n\n由于列表 4-17 中调用了 `abortBroadcast`，运行列表 4-15\
  \ 中的代码产生了两条日志记录：\n\n```\nMyActivity(281): Now watch the log entries pour in...\n\
  MyRecevier(281): 2 Received a broadcast A\n```\n\n第二条日志记录来自列表 4-17 中的接收器实例。列表对 `abortBroadcast`\
  \ 的调用在途中停止了有序广播。其他的 `MyReceiver` 实例从未见过该广播。\n\n`abortBroadcast` 方法仅对有序广播有效。通常情况下，你会让一个\
  \ `MyReceiver` 实例中止广播，以便其他接收器（可能是 `YourReceiver` 实例）不会获取广播。但在本章的示例中，我通过只创建一个 `MyReceiver`\
  \ 类和该类的多个实例来保持简单性。\n\n## 从接收器获取结果\n\n它们接下来会想些什么？你已经有了粘性广播（sticky broadcasts）和有序广播（ordered\
  \ broadcasts）。为什么不做一个既是粘性又是有序的广播呢？开发者通常使用粘性有序广播来从多个广播接收器收集结果。\n\n列表 4-18 包含一个“加强版”的接收器。\n\
  \n### 列表 4-18：接收器管理数据\n\n```java\npackage com.allmycode.rec1;\nimport java.util.ArrayList;\n\
  import android.app.Activity;\nimport android.content.BroadcastReceiver;\nimport\
  \ android.content.Context;\nimport android.content.Intent;\nimport android.os.Bundle;\n\
  import android.util.Log;\n\npublic class MyReceiver extends BroadcastReceiver {\n\
  \  private int number;\n  private boolean INTENTIONALLY_FAIL = false;\n  public\
  \ MyReceiver(int number) {\n    this.number = number;\n  }\n  @Override\n  public\
  \ void onReceive(Context context, Intent intent) {\n    String letter =\n      \
  \    intent.getData().getSchemeSpecificPart();\n      Log.i(\"MyRecevier\", number\
  \ + \" Received a broadcast \"\n          + letter);\n    if (INTENTIONALLY_FAIL)\
  \ {\n        setResultCode(Activity.RESULT_CANCELED);\n        return;\n      }\n\
  \    if (getResultCode() == Activity.RESULT_OK) {\n      Bundle bundle = getResultExtras(true);\n\
  \      ArrayList<Integer> receiverNums =\n          bundle.getIntegerArrayList(\"\
  receiverNums\");\n      if (receiverNums != null) {\n        receiverNums.add(new\
  \ Integer(number));\n      }\n      setResultExtras(bundle);\n    }\n  }\n}\n```\n\
  \n有序广播发送到一个有序的接收器实例链。随着广播，每个接收器实例都会获得链中上一个接收器的结果额外数据（result extras）。这些额外数据以 `bundle`\
  \ 的形式存在。关于 `bundle` 的详情，请参阅本书第 3 章。\n\n列表 4-18 中的接收器实例获得了一个包含整数 `ArrayList` 的 `bundle`。这个\
  \ `ArrayList` 正好包含有序广播链中所有接收器实例的数字。列表 4-18 中的实例将自己的数字加到 `ArrayList` 中，然后将其结果设置为新增强的\
  \ `ArrayList`。链中的下一个接收器实例将获得这个新增强的 `ArrayList`。\n\n有序广播还带有一个 `int` 值的代码。在列表 4-18\
  \ 中，对 `getResultCode` 的调用检查了 `Activity.app.RESULT_OK` 代码。链中的任何接收器实例都可以破坏非 `OK` 的结果代码。在列表\
  \ 4-18 中，我添加了一个额外的 `INTENTIONALLY_FAIL` 常量来测试不可避免的情况。将常量值更改为 `true` 会强制列表 4-18 将结果代码设置为\
  \ `Activity.app.RESULT_CANCELED`。此之后，有序广播的任何结果都再不可信。在发布应用之前，务必移除测试和调试代码（例如列表 4-18\
  \ 中的 `INTENTIONALLY_FAIL` 代码）。\n\n列表 4-19 让列表 4-18 中的接收器经受重炼。\n\n### 列表 4-19：处理来自接收器链的结果\n\
  \n```java\npackage com.allmycode.rec1;\nimport java.util.ArrayList;\nimport android.app.Activity;\n\
  import android.content.BroadcastReceiver;\nimport android.content.Context;\nimport\
  \ android.content.Intent;\nimport android.os.Bundle;\nimport android.util.Log;\n\
  import android.view.View;\nimport android.net.Uri;\n\npublic class MyActivity extends\
  \ Activity {\n  @Override\n  public void onCreate(Bundle savedInstanceState) {\n\
  \    super.onCreate(savedInstanceState);\n    setContentView(R.layout.main);\n \
  \ }\npublic void onButtonClick(View view) {\n    IntentFilter filter = new IntentFilter();\n\
  \    filter.addAction(\"com.allmycode.ACTION\");\n    filter.addDataScheme(\"letter\"\
  );\n    IntentFilter filter1 = new IntentFilter(filter);\n    IntentFilter filter2\
  \ = new IntentFilter(filter);\n    IntentFilter filter3 = new IntentFilter(filter);\n\
  \    MyReceiver receiver1 = new MyReceiver(1);\n    MyReceiver receiver2 = new MyReceiver(2);\n\
  \    MyReceiver receiver3 = new MyReceiver(3);\n    registerReceiver(receiver1,\
  \ filter1);\n    registerReceiver(receiver2, filter2);\n    registerReceiver(receiver3,\
  \ filter3);\n    Intent intent = new Intent();\n    intent.setAction(\"com.allmycode.ACTION\"\
  );\n    intent.setData(Uri.parse(\"letter:A\"));\n    MyEndResultReceiver resultReceiver\
  \ = new MyEndResultReceiver();\n    ArrayList<Integer> receiverNums = new ArrayList<Integer>();\n\
  \    Bundle bundle = new Bundle();\n    bundle.putIntegerArrayList(\"receiverNums\"\
  , receiverNums);\n    sendStickyOrderedBroadcast(intent, resultReceiver, null, Activity.RESULT_OK,\
  \ null, bundle);\n  }\n}\n\nclass MyEndResultReceiver extends BroadcastReceiver\
  \ {\n  final static String CLASSNAME = \"MyEndResultReceiver\";\n  @Override\n \
  \ public void onReceive(Context context, Intent intent) {\n    if (getResultCode()\
  \ == Activity.RESULT_OK) {\n      Bundle bundle = getResultExtras(true);\n     \
  \ ArrayList<Integer> receiverNums =\n          bundle.getIntegerArrayList(\"receiverNums\"\
  );\n      Log.i(CLASSNAME, receiverNums.toString());\n    } else {\n      Log.i(CLASSNAME,\
  \ \"Result code: \" + Integer.toString(getResultCode()));\n    }\n  }\n}\n```\n\n\
  在列表 4-19 中，对 `sendStickyOrderedBroadcast` 的调用包含了大量的参数。方法 `sendStickyOrderedBroadcast`\
  \ 的官方签名如下：\n\n```java\npublic void\nsendStickyOrderedBroadcast(Intent intent,\n\
  \  BroadcastReceiver resultReceiver,\n  Handler scheduler,\n  int initialCode,\n\
  \  String initialData,\n  Bundle initialExtras)\n```\n\n• `intent` 参数的作用与任何其他广播的意图相同。\n\
  \n\n\n\n\n`intent` 呈现了一组用于测试接收器过滤器的标准。\n\n* `resultReceiver` 是有序广播调用链中的最后一个实例。通过指定结果接收器，你就能知道该去哪里查找累积的结果。\n\
  * `scheduler`（如果它不为 `null`）负责处理来自 `resultReceiver` 的消息。\n* `initialCode` 是从一个接收器传递到下一个接收器的结果代码序列的起始值。在大多数大多数应用中，`initialCode`\
  \ 的值是 `Activity.RESULT_OK`。只有在你创建自己的自定义结果代码值时，你才会给 `initialCode` 分配不同的值。当你这样做时，你会对你的程序对每个生成的自定义值做出合理的响应。\n\
  * `initialData`（如果它不为 `null`）是链中从一个接收器传递到另一个接收器的字符串的起始值。\n\n有序广播携带一个数据包（结果额外数据 extras）和一个代码（一个\
  \ `int` 值，例如 `Activity.RESULT_OK`）。此外，有序广播还携带结果数据——一个可以被链中每个接收器实例检查和修改的 `String`\
  \ 值。\n\n* `initialExtras` 是广播额外内容数据包的起始值。在列表 4-19 中，`initialExtras` 包是一个空的 `ArrayList`。每个获取广播的接收器实例都会将其数字添加到此\
  \ `ArrayList` 中。\n\n列表 4-20 显示了列表 4-18 和 4-19 中代码的输出。\n\n#### 列表 4-20：更多日志记录\n\n\
  ```\nMyRecevier(3602): 1 Received a broadcast A\nMyRecevier(3602): 2 Received a\
  \ broadcast A\nMyRecevier(3602): 3 Received a broadcast A\nMyEndResultReceiver(3602):\
  \ [1, 2, 3]\n```\n\n广播在 `MyEndResultReceiver` 实例处结束——该实例是通过列表 4-19 中的 `sendStickyOrderedBroadcast`\
  \ 调用在链中最后命名的实例。当这个最后一个接收器执行其操作时，接收器会记录 `[1, 2, 3]`——接收器数字的累积 `ArrayList`。\n\n###\
  \ 使用权限和其他技巧\n\n要发送广播，你只需向太空中投出一个 intent。如果接收器的过滤器与 intent 匹配，广播接收器就会获取该 intent。故事就此结束。真的如此吗？\n\
  \n当你发送广播时，还可以指定权限。权限来自于你放在 `AndroidManifest.xml` 文档中的那些 `<uses-permission>` 元素（在第一次忘记这么做并收到错误消息之后）。在列表\
  \ 4-21 中，`sendBroadcast` 用的第二个参数就是一个权限。\n\n### 列表 4-21：需要权限\n\n```java\npublic void\
  \ onButtonClick(View view) {\n  Intent intent = new Intent();\n  intent.setAction(\"\
  THIS_ACTION\");\n  sendBroadcast(intent,\n      android.Manifest.permission.INTERNET);\n\
  }\n```\n\n列表 4-22 中声明的接收器捕获列表 4-21 中的广播。\n\n#### 列表 4-22：声明应用拥有权限\n\n```xml\n<?xml\
  \ version=\"1.0\" encoding=\"utf-8\"?>\n<manifest xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n          package=\"com.allmycode.receiver2\"\n          android:versionCode=\"\
  1\"\n          android:versionName=\"1.0\">\n  <uses-sdk android:minSdkVersion=\"\
  8\" />\n  <uses-permission android:name=\"android.permission.INTERNET\" />\n  <application\
  \ android:icon=\"@drawable/icon\"\n               android:label=\"@string/app_name\"\
  >\n    <receiver android:name=\"com.allmycode.receiver2.MyReceiverWithPermission\"\
  >\n      <intent-filter>\n        <action android:name=\"THIS_ACTION\" />\n    \
  \  </intent-filter>\n    </receiver>\n  </application>\n</manifest>\n```\n\n另一个\
  \ manifest 中没有 `<uses-permission>` 元素的应用的接收器无法接收来自列表 4-21 的广播。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ Android 内置的 `android.Manifest.permission.INTERNET` 常量（用于列表 4-21）具有 `String` 值\
  \ `\"android.permission.INTERNET\"`。冒着风险，`\"android.permission.INTERNET\"` 使用在 `AndroidManifest.xml`\
  \ 中。\n\n# 第 5 章：内容提供者 (Content Providers)\n\n## 本章\n\n* 数据库基础\n* Android 中的数据库处理\n\
  * 使用内容提供者共享数据\n\n#### 数据库：从石器时代到今天\n\n数据库是存储大量数据的地方。对此没人意外。数据库管理系统是一组用于创建数据、查找数据以及对数据进行其他有用操作的软件。\n\
  \n直到 20 世纪 70 年代中期，人们对于数据库存储数据的最佳结构尚未达成共识。有些人支持层级结构，而另一些人则坚信网络结构是唯一的途径。但在 70 年代，在\
  \ IBM 工作的 Edgar Codd 发表了关于用于存储数据的关系型结构的论文。从 20 世纪 80 年代中期以来，关系数据库一直是最受欢迎的选择。\n\n\
  \n\n\n关系型数据库由一组表组成。就像书中的表一样，数据库表包含行和列。每行代表一个实例（客户、员工、预约或其他任何内容），每列代表某种属性（例如，客户的姓名、员工的薪水或预约时间）。表\
  \ 5-1 是书中的一张表，但它完全可以看作关系型数据库中的一张表。\n\n![表 5-1 客户](img/9781118027707-bk03ch0501.jpg)\n\
  \nJava 程序员可能会将数据库表比作 Java 类。每个实例都是行行，每个公共字段都是一列。事实上，表与类之间的这种相似性人们已经察觉到很长时间了。许多软件框架专门用于对象-关系映射（ORM），在\
  \ ORM 中，软件会自动管理 Java 对象与关系型数据库表之间的对应关系。\n\n数据库管理系统（DBMS）存储数据库数据，并为管理员和用户提供数据访问。数据库管理员（DBA）是负责维护\
  \ DBMS 软件运行的人员。用户是从数据库中获取信息并（在拥有相应权限的情况下）修改存储在数据库中的值的人。用户可能会直接或间接地向表中添加行，但用户不会向表中添加列或以任何方式更改表的结构。\n\
  \n数据库管理系统使用复杂的数据结构和算法来高效地存储和检索数据。因此，数据库中的数据很少存在于平文件中。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 平文件是硬盘上普通的普通数据堆，没有指向文件内部重要位置的特殊指针或索引。数据库管理系统提供了将数据存储在平文件中的选项，但这仅作为快速、临时存储数据的必要之恶。如果在平文件中使用数据库表，DBMS\
  \ 必须缓慢且低效地遍历文件所需的任何数据。\n\n数据库管理系统来自许多不同的供应商，具有不同的价格范围和功能 set。主要的商业巨头有 IBM（拥有 `DB2`\
  \ 软件）、Microsoft（拥有 `Access` 和 `SQL Server` 产品）和 Oracle（拥有名副其实的 `Oracle Database`）。一些流行的非商业产品包括\
  \ `MySQL`（Oracle 所有）、`PostgreSQL` 和 `SQLite`。每个 Android 设备都自带 `SQLite` 软件。\n\n通常情况下，你通过以下方式与数据库通信：\n\
  \n- 你连接到数据库（无论这意味着具体什么）。\n- 你查询数据库，请求符合你指定的标准的行和列。\n\n作为响应，数据库管理系统会交给你游标。游标是一个微表；它是包含匹配你查询的行和列的表。数据库管理系统提炼数据库中的信息，以便游标交付给你。\n\
  \n和普通的数据库表一样，游标由行和列组成。在任何时刻，游标都指向表中的某一行（或指向表最后一行之后的“永无之地”）。\n\n- 你使用游标在行与行之间移动，对每行数据执行你需要的任何操作。\n\
  - 最后（这一点很重要），你关闭与数据库的连接。\n\n根据你的权限，你还可以创建表、修改表中行的值、向表中插入行以及进行其他操作。四个主要的表操作被称为 `CRUD`，代表\
  \ `Create`（创建）、`Read`（读取）、`Update`（更新）和 `Delete`（删除）。\n\n向 DBMS 发布命令的最常用方法是使用 `SQL`\
  \ —— 结构查询语言。（取决于心情，你可以将 SQL 缩写读作 ess-kyoo-el 或 sequel。）一条 SQL 语句看起来像这样：\n\n```\n\
  SELECT * FROM CUSTOMER_TABLE WHERE COMMENT=’Deadbeat’;\n```\n\n每个数据库管理系统都有自己的 `SQL`\
  \ 方言，因此详细学习 `SQL` 的唯一方法是专门针对一个 DBMS 进行工作。通过 Android 的 SDK，你可以向代码中添加包含 SQL 命令的字符串。但你也可以调用方法来代你组合\
  \ SQL 命令。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg) 欲了解 `SQLite` 使用\
  \ `SQL` 的规则，请访问 [`http://sqlite.org/lang.html`](http://sqlite.org/lang.html)。\n\n\
  ## 数据库操作\n\n通过 Android 的 SDK，应用有两种方式可以访问数据库：\n\n- 应用可以通过向 `SQLite` 的命令直接访问自己的数据库。（见图\
  \ 5-1。）\n\n**图 5-1：** 应用访问其自己的数据库。\n\n![9781118027707-fg030501.eps](img/9781118027707-fg030501_fmt.jpeg)\n\
  \n- 应用可以通过向另一个应用的内容提供者发送命令，间接访问另一个应用的数据库。（见图 5-2。）\n\n**图 5-2：** 应用访问另一个应用的数据库。\n\
  \n![9781118027707-fg030502.eps](img/9781118027707-fg030502_fmt.jpeg)\n\n内容提供者（Content\
  \ Provider）是 Android 四大组件类型之一。（这四种分别是 Activity、Service、广播接收器和内容提供者。）\n\n为了全面说明，我必须写内容提供者并不只与数据库协作。内容提供者是应用代码与另一个应用数据之间的桥梁。另一个应用的数据并不必须是数据库。但提供者公开的方法看起来就像数据库调用。（见\
  \ 553。）提供者创建数据。\n\n![9781118027707-fg30503.eps](img/9781118027707-fg30503)\n\n本章剩余部分由三个示例组成。第一个示例演示了应用创建数据库。在第二个示例中，应用使用内容提供者暴露数据，另一个应用通过提供者访问数据。（第三个示例说明了较新的\
  \ API 特性。）\n\n当你比较第一个和第二个示例时，你会发现一些相似之处。第二个示例非常像第一个。为了得到第二个示例，我（比喻地）将第一个示例一分为二，将第一个示例代码的一部分交给新的内容提供者，另一部分交给全新的应用。\n\
  \n### 使用 Android SDK 为 SQLite SQLite\n\n列表 5-1 包含了访问 SQLite 数据库的代码。当活动运行时，代码会插入数据，然后修改数据，最后删除数据。为了保持简单，我刻意省略了数据库代码通常具有的故障检查。我只有一个简单的用户界面。活动的屏幕只有一个组件——用于显示处理阶段数据的文本视图。\n\
  \n### 涉及并发的问题\n\n任何优秀的计算设备都会同时运行多个进程。也就是说，这些进程是并发的。\n\n并发对于充分利用设备资源非常好，但如果两个或多个进程同时写入数据库，就会发生糟糕的事情。例如，我可能发现表\
  \ 5-1 有三行并决定添加第四行。与此同时，你可能发现了相同的情况并发布了自己的命令添加第四行。结果是表格只增加了一行，而该行包含了你的数据和我数据的混合。哎呀！\n\
  \n为了解决双进程写入问题，数据库管理系统拥有锁。锁强制在同一时间除一个进程外其他进程处于只读状态。因此两个进程不能同时执行写入操作。数据库管理系统（有时对于开发者）的技巧在于选择能够在维护数据完整性的同时，以最短的时间锁定最小范围的数据。长期的、范围大的锁往往会减慢系统。\n\
  \n\n\n数据库处理的另一个可能陷阱是写入操作不完全的危险。想象一下，我富有钱的叔叔给公司支付表 5-1 中的账单。代表人员为账号 002 输入了新信息：我富有钱的叔叔的名字；新的\
  \ 0.00 余额；以及“VIP 长期客户”的注释。DBMS 修改了姓名和新余额，但在 DBMS 接收到更改注释的请求之前，网络连接就中断了。结果，账号 002\
  \ 拥有了 `Rich Burd`（富翁的伯德）、`0.00` 和 `Deadbeat`（赖账）这些值。你可能并不看好我叔叔，但他绝对不是个赖账！\n\n为了防止不完全的写入操作，数据库管理系统执行事务（transactions）。事务是一组以“全有全无”方式执行的操作集合。“要么全部执行，要么一个都不执行，”DBMS\
  \ 这样说。事务中的操作集合是原子的；该操作集合不能被分割。\n\n正如你可能猜到的那样，强制原子性并不是容易的。当某些恶性的网络错误导致整个系统卡住时，DBMS\
  \ 如何确保全有全无的写入呢？\n\n幸运的是，如果你是数据库用户，用于强制原子性的机制并不是你需要的问题。如果你的应用需要原子性（并且如果数据库管理系统没有自动强制原子性），你只需要编写一系列常规数据库命令。在一个全有全无序列的末尾，你发布一个特殊的\
  \ `commit`（提交）命令或特殊的 `rollback`（回滚）命令。`commit` 命令表示：“固定此操作序列中的所有更改”，而 `rollback`\
  \ 命令表示：“丢弃此序列中的所有更改”。数据库管理系统会干净、可靠地实现特殊的 `commit` 和 `rollback` 命令。\n\n（如果你在想，这些\
  \ `commit` 和 `rollback` 命令通常位于你代码中的备选分支。你不会为了好玩而发出一堆命令然后又把它们回滚。）\n\n### 列表 5-1：向数据库发送命令\n\
  \n```java\npackage com.allmycode.db1;\n\nimport android.app.Activity;\nimport android.content.ContentValues;\n\
  import android.database.Cursor;\nimport android.database.sqlite.SQLiteDatabase;\n\
  import android.os.Bundle;\nimport android.widget.TextView;\n\npublic class MyActivity\
  \ extends Activity {\n  TextView textView;\n  Cursor cursor = null;\n  DBHelper\
  \ helper = null;\n  SQLiteDatabase db = null;\n  ContentValues values = null;\n\n\
  \  @Override\n  public void onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.main);\n    textView = (TextView) findViewById(R.id.textView1);\n\
  \    helper = new DBHelper(this, \"simple_db\", null, 1);\n    db = helper.getWritableDatabase();\n\
  \    values = new ContentValues();\n    values.put(\"name\", \"Barry\");\n    values.put(\"\
  amount\", \"100\");\n    db.insert(\"simpletable\", \"\", values);\n    values.clear();\n\
  \    values.put(\"name\", \"Harriet\");\n    values.put(\"amount\", \"300\");\n\
  \    db.insert(\"simpletable\", \"\", values);\n    addToTextView();\n    values.clear();\n\
  \    values.put(\"amount\", \"500\");\n    db.update(\"simpletable\", values, \"\
  name='Barry’\", null);\n    addToTextView();\n    db.delete(\"simpletable\", \"\
  1\", null);\n    addToTextView();\n  }\n\n  @Override\n  public void onDestroy()\
  \ {\n    super.onDestroy();\n    helper.close();\n  }\n\n  void addToTextView()\
  \ {\n    cursor =\n        db.rawQuery(\"SELECT * FROM simpletable;\", null);\n\
  \    if (cursor != null && cursor.moveToFirst()) {\n      String name;\n      do\
  \ {\n        String _id = cursor.getString(0);\n        name = cursor.getString(1);\n\
  \        int amount = cursor.getInt(2);\n        textView.append(_id + \" \" + name\
  \ + \" \" + amount + \"\\n\");\n      } while (cursor.moveToNext());\n    }\n  \
  \  textView.append(\"-----------\\n\");\n  }\n}\n```\n\n列表 5-1 中第一个新且令人兴奋的语句是调用\
  \ `DBHelper` 构造函数。我的 `DBHelper` 类（将在列表 5-2 中揭晓）扩展了 `android.database.sqlite.SQLiteOpenHelper`\
  \ 类。此类类的目的是管理 SQLite 数据库的创建和修改。特别是列表 5-1 中的代码使用该助手类来获取实际数据库。\n\n关于友好的助手类列表 5-2 的详情包含了\
  \ `DBHelper` 代码。\n\n### 列表 5-2：SQLiteOpenHelper 的子类\n\n```java\npackage com.allmycode.db1;\n\
  import android.content.Context;\nimport android.database.sqlite.SQLiteDatabase;\n\
  import android.database.sqlite.SQLiteOpenHelper;\n\npublic class DBHelper extends\
  \ SQLiteOpenHelper {\n  public DBHelper(Context context, String dbName,\n      SQLiteDatabase.CursorFactory\
  \ factory, int version) {\n    super(context, dbName, version);\n  }\n\n  @Override\n\
  \  public void onCreate(SQLiteDatabase db) {\n    String createString =\n      \
  \  \"CREATE TABLE IF EXISTS simpletable \" +\n        \"_id PRIMARY KEY AUTOINCREMENT,\
  \ \" +\n        \"name TEXT NOT NULL, \" +\n        \"amount INTEGER NOT NULL);\"\
  ;\n    db.execSQL(createString);\n  }\n\n  @Override\n  public void onUpgrade(SQLiteDatabase\
  \ db,\n      int oldVersion, int newVersion) {\n    String dropString = \"DROP TABLE\
  \ IF EXISTS simpletable;\";\n    db.execSQL(dropString);\n    onCreate(db);\n  }\n\
  }\n```\n\n在列表 5-2 中，我实现了父类的抽象方法（正如我必须做的那样）。我还创建了一个构造函数，将所有参数传递给父构造函数。\n\n列表 5-2\
  \ 中最重要的部分是 `onCreate` 方法。你从不直接调用这个方法。相反，当你像我在列表 5-1 中那样设置助手时，Android 会代表你调用该方法。这对你的应用程序性能是有好处的。\n\
  \nAndroid 传递 `onCreate` 方法一个 SQLite 数据库（属于助手类所在的应用程序）。该 SQLite 数据库（在 `onCreate`\
  \ 方法参数列表中称为 `db`）有一个 `execSQL` 方法。列表 5-2 调用数据库的 `execSQL` 方法，并传入了一个普通的 Java 字符串。幸运的是，这个普通的\
  \ Java 字符串正好是一个 SQL 命令。\n\n在列表 5-2 的 `onCreate` 方法中，很多好事都在发生，但并没有动静。如果数据库不存在，Android\
  \ 会创建一个。如果数据库已经没有名为 `simpletable` 的表，SQLite 会创建一个。如果数据库已经存在并拥有 `simpletable`，`onCreate`\
  \ 方法就不会产生任何扰动。\n\n数据库通常在托管进程终止后仍然存在。如果你在 3 月运行此示例代码，然后关闭设备三个月，当你 6 月再次打开设备时，数据库仍然存在（以及你在\
  \ 3 月添加的任何数据）。\n\n我没有在书中介绍 SQL 命令。尝试涵盖所有命令我会疯的。但幸运的是，其他作者已经涵盖了 SQL 而没有疯。所以，如果想阅读所有\
  \ SQL 命令，可以购买《SQL For Dummies》或加强版《SQL All-in-One For Dummies》，这两者都由 Allen G. Taylor\
  \ 编写（John Wiley & Inc.）。\n\nSQL 比其他语言更具可读性，因此即使没有深入的介绍，你可能也能理解书中的大多数 SQL 命令。例如，列表\
  \ 5-2 中间部分的 SQL 命令表达了以下内容：\n\n`如果数据库没有名为 simpletable 的表，`\n`创建 simpletable，包含三列，名为`\n\
  `_id、name 和 amount。`\n`_id 列存储整数值，`\n`用于识别该行，`\n`并且每个新添加的行都会加 1，`\n\n\n\n\n`name`\
  \ 列存储一个不可为空的字符串值，而 `amount` 列存储一个不可为空的整数值。\n\n![tip.eps](img/tip_fmt.jpeg) Android\
  \ 的 SDK 希望你使用 `_id` 作为表自增主键的名称。我还没有尝试过其他列名，但根据我读到的内容，如果我尝试这样做，某些功能将会崩溃。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ `SQLiteOpenHelper` 的 `onUpgrade` 方法处理数据库的新版本。例如，当我修改列表 5-2 中的数据库，使每行都多出一列（可能是一个注释列）时，我实际上是在更改表的结构。这种更改要求我销毁现有的表（即删除该表），并像从头开始一样创建另一个表。在辅助类的\
  \ `onUpgrade` 方法中，你负责管理这个（诚然很微妙）的过程。\n\n### 关于主流 SQLite 代码的细节\n\n在列表 5-1 中，在调用 `getWritableDatabase`\
  \ 后，代码执行了一些相当常见的操作——即插入、更新、删除和查询。\n\n### 插入\n\n每次调用 `db.insert` 都会向 `simpletable`\
  \ 添加一行值。每个值实际上都是一个键值对，其中键是数据库列名，值是要填充到该列的内容。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 属于 `ContentValues` 类的 `put` 方法接受两个 `String` 参数。在调用 `values.put(\"amount\", \"\
  100\")` 时，第一个参数是列名。第二个参数是要放入当前行该列中的值。注意第二个参数 `\"100\"` 是一个 Java `String`，尽管数据库的\
  \ `amount` 列存储的是整数。运行机制就是如此。哦，当你记住这些事情时，别在使用一组值和组装另一组值之间调用 `values.clear()`。\n\n\
  ![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 在列表 5-1 中，`insert` 方法接受三个参数——表名、一个空列处理小技巧（null\
  \ column hack）以及一组构成新创建行的值。空列处理技巧是你添加的一个值，用于处理完全空插入的情况。如果你尝试插入一个不包含任何数据的行，SQLite\
  \ 的表现会很糟糕。\n\n由于列表 5-1 中对 `insert` 的调用，活动屏幕包含了图 5-4 文本视图中的前两行。\n\n**图 5-4：** 运行列表\
  \ 5-1 中的代码。\n\n![9781118027707-fg030504.tif](img/9781118027707-fg030504_fmt.jpeg)\n\
  \n### 更新\n\n在列表 5-1 中，`db.update` 的调用接受四个参数。前两个参数——表名和一组值——是老常识。`update` 方法的第三个参数是\
  \ SQL `WHERE` 子句的一部分。`WHERE` 子句告诉 SQLite 选择哪些行进行处理。例如，“数据库：从石器时代到现代”章节中的 `WHERE`\
  \ 子句告诉 SQLite 仅选择 `Comment` 列包含值 `Deadbeat` 的行。\n\n对于 `update` 方法调用中的第三个参数，你提供一个包含整个\
  \ `WHERE` 子句的字符串，但你省略了 `WHERE` 单词。因此在列表 5-1 中，`update` 方法的调用生成了一个包含 `WHERE name\
  \ = ‘Barry’` 的 SQL 语句。在游戏的这个阶段，很容易被嵌套的单引号和双引号搞混。SQL 命令规则要求如 `‘Barry’` 的值值加引号，而 Java\
  \ 字符串必须使用双引号。如果情况变得更加复杂，你就必须使用转义序列和其他技巧。\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
