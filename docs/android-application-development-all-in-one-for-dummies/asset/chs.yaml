  \ principal, double percentageRate)`。要调用这个备用的 `monthlyPayment` 方法，你编写类似 `monthlyPayment\
  \ (100000.00, 5.25)` 的代码。在这种情况下，备用 `monthlyPayment` 方法体内可能包含类似 `years = 30` 的语句。除非你知道抵押贷款期限是\
