- "# Android 应用开发傻学者指南\n\n\n\n![](img/cover.jpg)\n![cover.eps](img/cover.jpg)\n\n\n\
  \n\n# 第二卷：第 5 章：XML 简介\n\n# 第三卷：构建模块\n\n\n## 处理右键菜单选择\n### Fragment、更多的 Fragment、甚至更多的\
  \ Fragment\n## 兼顾两者的优势\n\n## 上传应用\n## 第六卷：第二章：更多 Inventor\n# 使用 Ant 进行 Android 开发\n\
  # 使用操作系统命令进行 Android 开发\n\n\n\n\n\n![9781118027707-fg020121.tif](img/9781118027707-fg020121_fmt.jpeg)\n\
  \n## 重命名内容\n\n要更改 Java 程序中变量、方法或其他内容的名称，在编辑器中点击该名称，然后选择 `Refactor⇒Rename`。Eclipse\
  \ 会等待你编辑现有名称。完成重命名后，按 Enter 键。（要取消重命名操作，请按 Esc。）\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 当你点击编辑器中的一个名称时，不必点击该名称的定义处。你可以点击代码中出现该名称的任何地方。在你编辑名称后，Eclipse 会更改项目内该名称的所有出现处。\n\
  \n![remember.eps](img/remember_fmt.jpeg) Eclipse 足够智能，不会更改具有含义的相同名称。例如，如果一个 setter\
  \ 方法包含语句 `this.myButton = myButton`，重命名 `this.myButton` 会更改你的类字段名。但重命名赋值右侧的 `myButton`\
  \ 仅更改方法局部变量的名称。\n\n## 创建 Android 字符串\n\n你正在有力地输入 Java 代码（当然，这是在仔细规划和设计了代码之后），并且你输入了一个包含字符串字面量的语句：\n\
  \n```java\nbutton.setText(“Click me!”);\n```\n\n然后你想起 Java 代码不应包含硬编码字符串。你应该将 `“Click\
  \ me!”` 更改为类似 `R.string.click` 的内容，并向你的 `res/values/strings.xml` 文件添加字符串标签。然后，你的法语用户将从另一个不同的\
  \ `strings.xml` 文件获取数据——在该文件中，`R.string.click` 指向文本 `“Cliquez-moi!”`\n\nEclipse\
  \ 的 Android Development Tools 插件提供了一种快速简单的方法，将硬编码字符串字面量转换为外部化的 Android 字符串。在 Java\
  \ 编辑器中选择字符串字面量的任何部分。然后，在 Eclipse 的主菜单中，选择 `Refactor⇒Android⇒Extract Android String`。在简短查看\
  \ Extract Android String 对话框中的选项后，你的字符串字面量就会转换为 `strings.xml` 中的一个元素。\n\n## 使用其他重构操作\n\
  \nEclipse 为你的 Java 代码提供了一系列重构操作。例如，通过几次菜单选择，你可以将几行代码转换为一个独立的方法。你可以从现有类创建一个接口。你甚至可以为旧式的原始集合类型声明添加泛型类型参数。（Eclipse\
  \ 会对泛型参数类型进行合理的推断。）\n\n要尝试 Eclipse 的重构功能，请从 Eclipse 的主菜单中选择 `Refactor` 并开始探索。\n\n\
  ## 组织导入项操作\n\nEclipse 有一个很酷的 `Source⇒Organize Imports` 操作。当你进入 Eclipse 主菜单并选择 `Source⇒Organize\
  \ Imports` 时，会发生很多好事：\n\n- Eclipse 会移除任何你没有使用的导入声明。\n\n如果你的代码开头是\n```java\nimport\
  \ android.widget.EditText;\n```\n但你从未使用过 `EditText`，Eclipse 会删除 `EditText` 的导入声明。\n\
  \n- Eclipse 会添加任何缺失的导入声明。\n\n如果你的代码包含\n```java\n((EditText) findViewById(R.id.editText1))\n\
  ```\n但你没有为 `EditText` 的导入声明，Eclipse 会在代码顶部添加\n```java\nimport android.widget.EditText;\n\
  ```\n我甚至见过 Eclipse 取消注释我之前注释掉的声明。\n\n- Eclipse 会对代码的导入声明进行排序。\n\n默认情况下，Eclipse 对声明进行排序，使得\
  \ `java` 包优先，然后是 `javax` 包，接着是 `org` 包，然后是 `android` 包，最后是 `com` 包。在每个类别中，Eclipse\
  \ 按字母顺序对声明进行排序。（这样更容易查找。）\n\n当然，你可以更改排序顺序。访问 `Window⇒Preferences` 对话框中的 `Java⇒Code\
  \ Style⇒Organize Imports` 页面。在列表中向上移动名称，向下移动名称。\n\n\n\n\n作为一种导入技术，拖放操作仅在 Windows\
  \ 操作系统上有效。此外，这种技术像是一个粗线条的工具。它会导入你硬盘上某个特定目录下的所有内容。如果你只想从某个目录中导入几个文件，那么这种技术并不是你的最佳选择。\n\
  \n当然，如果你使用 Windows 并且喜欢拖放的直观感受，那么这种技术就适合你。只需从你开发电脑的文件管理器中将包含代码的文件夹，拖到 Eclipse 的\
  \ `Package Explorer`（包管理器）视图中相应的项目文件夹即可。\n\n在上一段中，我通过指示你将文件夹拖到“相应的项目文件夹”来巧妙地掩盖了自己的笨拙。我承认吧，我经常忘记该把哪个文件夹拖到哪里。我通常会弄错一级（要么拖到了目标文件夹的父目录，要么拖到了子目录）。结果就是我的项目目录结构就不正确了，我在代码中看到了各种红色的错误标记。因此，我必须在\
  \ `Package Explorer` 中将项目从一个地方移动到另一个地方，或者删除导入的内容并重新开始拖放。我的大脑很难处理“拖放文件夹”这一特定概念。谁知道呢？也许你的大脑处理得更好。\n\
  \n### 使用导入向导\n\n如果你不使用 Microsoft Windows，或者你想仔细挑选要导入的内容，就不能使用拖放操作。相反，你需要使用 `Import\
  \ Wizard`（导入向导）。\n\n如何使用 `Import Wizard` 取决于你想导入的内容类型。要导入一个 Eclipse 项目（可能来自旧的、当前未使用的\
  \ Eclipse 工作空间），请执行以下操作：\n\n1. 在 Eclipse 的主菜单中，选择 `File⇒Import`。\n\nEclipse 的 `Import\
  \ Wizard`（魔法般地）出现了。\n\n2. 在 `Import Wizard` 的 `General`（常规）分支下，点击 `Existing Projects\
  \ into Workspace`（现有项目导入工作空间）子分支。（参见图 1-24。）\n\n**图 1-24：** 通知 Eclipse 导入现有项目。\n\
  \n![9781118027707-fg020124.tif](img/9781118027707-fg020124_fmt.jpeg)\n\n点击 `Existing\
  \ Projects into Workspace` 子分支后，另一个 `Import` 对话框（`Import Projects` 对话框）就会出现。\n\n\
  3. 在 `Import Projects` 对话框中，点击 `Select Root Directory`（选择根目录）单选按钮，并使用 `Browse`（浏览）按钮找到包含一个或多个\
  \ Eclipse 项目的文件夹（当前 Eclipse 工作空间之外的项目）。\n\nEclipse 项目包含源代码和其他内容。这些“其他内容”包括 `.project`\
  \ 和 `.classpath` 文件，你在 Eclipse 项目文件夹内部几乎注意不到这些文件。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 要被视为现有的 Eclipse 项目，文件夹必须包含一个名为 `.project` 的文件。\n\n在你浏览到一个文件夹后，Eclipse 会列出在该文件夹中找到的所有项目。（参见图\
  \ 1-25。）\n\n4. 在你想要 Eclipse 导入的每个项目旁边的选框中勾选。（再次参见图 1-25。）\n\n5. 勾选 `Copy Projects\
  \ into Workspace`（将项目复制到工作空间）选框。（或者不勾选！）\n\n如果你勾了这个选框，Eclipse 会在你的当前工作空间内创建一个项目的副本。你对该新副本进行的任何操作都不会影响你导入项目的原始文件夹。换句话说，你拥有了一个易于访问的项目备份副本。\n\
  \n**图 1-25：** 选择一个或多个现有项目。\n\n![9781118027707-fg020125.tif](img/9781118027707-fg020125_fmt.jpeg)\n\
  \n如果你不勾选此选框，Eclipse 就不会创建项目的副本。相反，Eclipse 直接在原始包含这些项目的文件夹上操作。因此，你对项目文件进行的任何更改都会影响你导入项目的文件夹。换句话说，你没有易于访问的备份副本。\n\
  \n6. 在 `Import Projects` 对话框中，点击 `Finish`（完成）按钮。\n\n好了！Eclipse 在 `Package Explorer`\
  \ 的树中添加了一个新项目。\n\n要将文件或文件夹导入你当前的 Eclipse 项目，请执行以下操作：\n\n1. 在 Eclipse 的 `Package\
  \ Explorer` 中，选择目标文件夹（将包含导入文件的文件夹）。\n\n2. 在 Eclipse 的主菜单中，选择 `File⇒Import`。\n\n\
  `Import Wizard` 出现了（参考图 1-24）。\n\n3. 在 `Import Wizard` 中，点击 `Archive File`（归档文件）或\
  \ `File System`（文件系统）选项。\n\n一个 `Import` 对话框出现。\n\n![tip.eps](img/tip_fmt.jpeg) 你选择\
  \ `Archive File` 还是 `File System` 取决于你想导入的内容所在地。如果内容在压缩文件内（`.zip` 文件、`.tar.gz` 文件等），请点击\
  \ `Archive File`。如果你要导入的内容不在压缩文件中，请选择 `File System`。\n\n4. 在 `Import` 对话框中，浏览到包含你想导入内容的文件夹或归档文件。\n\
  \n浏览后，`Import` 对话框中的两个大面板将显示所选文件夹或归档文件内部的子文件夹和文件。（参见图 1-26。）\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 有时你必须让 `Import` 对话框的两个大面板显示你的内容。点击，让 `Import` 对话框的两个大面板显示你想要导入的内容。\n\n5. 在 `Import`\
  \ 对话框中，勾选你想要 Eclipse 导入的每个项目旁边的选框。\n\n在 `Import` 对话框中，在 `Android` 选项卡（在这里，在 `Import`\
  \ 对话框的主体中）中，勾选项目。\n\n6. （可选）如果你想导入文件夹名称，勾选 `Create Folder Structure`（创建文件夹结构）。\n\
  \n7. 点击 `Finish`。\n\n`Import` 对话框消失。`Package Explorer` 树视图中包含了新条目。\n\n**图 1-26：**\
  \ `Import` 对话框。\n\n![9781118027707-fg020126.tif](img/9781118027707-fg020126_fmt.jpeg)\n\
  \n### 创建运行配置\n\n运行配置是 Eclipse 用于运行应用程序的一套指南。运行配置存储了项目名称、目标平台（Gingerbread、Honeycomb\
  \ 等）以及关于应用的许多其他信息。\n\n每当你运行应用程序时，Eclipse 都会使用一个运行配置。如果你不创建运行配置，Eclipse 将使用默认配置。有时你希望在模拟器或设备上精细管理应用程序的运行方式。因此在此处你可以创建一个自定义运行配置。操作方法如下：\n\
  \n1. 在 `Package Explorer` 中右键点击 Android 项目（如果你是 Mac 用户，请 Control 点击）。\n\n2. 在弹出的右键菜单中，选择\
  \ `Run As⇒Run Configurations`。\n\n大型 `Run Configurations` 对话框出现。\n\n3. 点击窗口左角的 `New\
  \ Launch Configuration` 。（参见图 1-27。）\n\n**图 1-27：** `New Launch Configuration` 按钮。\n\
  \n![9781118027707-fg020127.tif](img/9781118027707-fg020127_fmt.jpeg)\n\n`Run Configurations`\
  \ 对话框左侧面板出现一个新的分支（标签类似于 `New_configuration`）。\n\n4. 在 `Run Configurations` 对话框的主体中，在\
  \ `Name` 字段中为新配置输入一个具有描述性的名称。（参见图 1-28。）\n\n**图 1-28：** 为你的自定义配置添加信息。\n\n![9781118027707-fg020128.tif](img/9781118027707-fg020128_fmt.jpeg)\n\
  \n5. 在 `Android` 选项卡的 `Project` 字段中（再次，在 `Run Configurations` 对话框的主体中），输入该配置适的项目名称。（再次参见图\
  \ 1-28。）\n\n6. 在 `Run Configurations` 对话框的主体中，点击 `Apply`。\n\n7. 仍在 `Run Configurations`\
  \ 对话框的主体中，点击 `Target` 选项卡。\n\n`Run Configurations` 对话框看起来类似于图 1-29。\n\n8. 更改 `Target`\
  \ 选项卡中的任何（或不更改）默认选项。\n\n\n\n\n在图 1-29 中，我指定了由哪一个模拟器来运行应用程序（名为 `GingerbreadWithSDImage`\
  \ 的模拟器）。我还为模拟器的启动提供了了 `-no-boot-anim` 选项。（`-no-boot-anim` 选项告诉模拟器不要浪费时间显示 Android\
  \ 字样的闪烁动画。）\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg) 了解更多模拟器选项，请访问\
  \ [`http://developer.android.com/guide/developing/tools/emulator.html`](http://developer.android.com/guide/developing/tools/emulator.html)。\n\
  \n9. 在“运行配置”（Run Configurations）对话框的主体中，点击`Apply（应用）。\n\n10. 在对“运行配置”对话框完成所有所需的调整后，点击`Run（运行）或`Close（关闭）。\n\
  \n**图 1-29：** “运行配置”对话框的 Target（目标）选项卡。\n\n![9781118027707-fg020129.tif](img/9781118027707-fg020129_fmt.jpeg)\n\
  \n`Run`和`Close`按钮出现在“运行配置”对话框的右下角。点击`Run`将使用新创建的配置启动你的项目。点击`Close`将保存新配置而不启动项目。\n\
  \n你自定义的运行配置将成为你在第 5 步中选择的任何项目的默认配置。因此，下次运行此项目时，你可以以简单的方式启动项目。要使用你的自定义配置启动，只需右键点击项目的\
  \ Package Explorer（包资源管理器）分支，并选择`Run As⇒Android Application（运行⇒Android 应用）`\n\n\
  ### 向项目构建路径添加额外内容\n\n在 Java 中，`.jar` 文件是类和其他内容的压缩集合。它是一组使用与 `.zip` 文件相同压缩方法压缩成单个文件的精良内容。`.jar`\
  \ 文件包含了运行一个或多个应用程序时所需的类。例如，一个名为 `junit.jar` 的文件包含了运行 Java JUnit 测试的类。\n\n根据你的心情，`.jar`\
  \ 代表 Java ARchive（Java 归档），也可以代表装满 Java 咖啡豆的罐子（jar）。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg)\
  \ JUnit 是一个酷的软件测试工具。有关 JUnit 的更多信息，请访问 [`http://Junit.org/`](http://junit.org/)。\n\
  \n正如你可能已经猜到的，你可以将 `.jar` 文件添加到 Eclipse 项目中。这样，你就可以在项目代码中使用 `.jar` 文件的类了。操作方法如下：\n\
  \n1. 在 Eclipse 的 Package Explorer 中选择一个项目。\n2. 在 Eclipse 的主菜单中，选择`Project（项目）⇒Properties（属性）`。\n\
  \nEclipse 显示项目的 Properties（属性）对话框。（大惊喜！）你可以在图 1-30 中看到一个 Properties 对话框。\n\n**图\
  \ 1-30：** 项目的 Properties（属性）对话框。\n\n![9781118027707-fg020130.tif](img/9781118027707-fg020130_fmt.jpeg)\n\
  \n3. 在 Properties 对话框左侧的树结构中，点击`Java Build Path（Java 构建路径）`。\n\n此树分支存储了 Eclipse\
  \ 在编译你的项目代码时会检查的位置信息。Java Build Path 包含许多选项。在本节中，我将示例缩小到 Eclipse 可以检查的一个地方——一个 `.jar`\
  \ 文件。\n\n4. 在 Properties 对话框的主体中，点击`Libraries（库）`选项卡。\n\n对话框的右侧会出现一些按钮。\n\n5. 点击`Add\
  \ External JARs（添加外部 JAR）`按钮。\n\n当你点击此按钮时，Eclipse 会显示你操作系统的“打开文件”对话框。\n\n6. 在“打开文件”对话框中，导航到你开发计算机上\
  \ `.jar` 文件的位置。\n\n我无法告诉你去哪里找到你以后可能需要的所有 `.jar` 文件。但如果你是为了练习添加 `.jar` 文件而遵循这些指令，我有一个建议：在你的\
  \ `JAVA_HOME` 目录中查找 `.jar` 文件。在该目录的 `lib` 子目录下，你会发现很多不错的 `.jar` 文件。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg)\
  \ 如需帮助查找开发计算机的 `JAVA_HOME` 目录，请参见第 VI 卷第 3 章。\n\n7. 双击你选择的 `.jar` 文件。\n\n瞧！“打开文件”对话框关闭了，现在你选择的\
  \ `.jar` 文件出现在了你的项目构建路径中。（为了得到图 1-31 的结果，我选择了一个名为 `tools.jar` 的文件。）\n\n**图 1-31：**\
  \ 增强后的 Java 构建路径。\n\n![9781118027707-fg020131.tif](img/9781118027707-fg020131_fmt.jpeg)\n\
  \n# 第 2 章：这是 Java！\n\n## 本章内容\n\n![check.png](img/check.png) 计算机、手机和其他设备如何运行 Java\
  \ 程序\n![check.png](img/check.png) 典型 Java 程序的部分\n\n在成为一个 Android 哥之前，我是一个 Java 哥。Java\
  \ 人是指痴迷于 Java 程序运行原理的人。我编写 Java 程序，阅读关于 Java 程序的内容，参加 Java 用户会议，穿着 Java T 恤。这就是为什么当我发现\
  \ Android 的应用程序编程语言是 Java 时感到非常兴奋。\n\n在 20 世纪 90 年代初，Microsystems 的 James Gosling\
  \ 创建了 Java。他使用了来自许多传统的思想，包括 C++。\n\n## 从开发到执行 Java\n\nJava 程序（例如 Android 应用程序）在你编写程序到处理器运行它之间会经过几个步骤。本节描述了这些层级。\n\
  \n### 什么是编译器？\n\n在 Java 变得流行之前，程序几乎直接从开发者的键盘传输到处理器的电路。但 Java 增加了一个额外的层。人们可以理解列表\
  \ 2-1 中的代码。\n\n列表 2-1：Java 源代码\n```java\npublic void checkVacancy(View view) {\n\
  \    if (room.numGuests == 0) {\n        label.setText(\"Available\");\n    } else\
  \ {\n        label.setText(\"Taken :(\");\n    }\n}\n```\n\n列表 2-1 中的 Java 代码检查酒店的空房情况。如果不添加几行代码，你就无法运行列表\
  \ 2-1 中的代码。但在游戏的这个阶段，那些额外的行并不重要。重要的是，通过盯着代码看、眯起眼睛并忽略代码中所有奇怪的标点符号，你可以看到代码正尝试做什么：\n\
  \n如果房间里没有客，\n那么将 label 的文本设置为 \"Available\"。\n否则，\n将 label 的文本设置为 \"Taken :(\"\n\
  \n列表 2-1 中的内容是 Java 源代码。\n\n计算机、手机和其他设备中的处理器通常不遵循像列表 2-1 那样的指令。也就是说，处理器不遵循 Java\
  \ 源代码指令。相反，处理器遵循像列表 2-2 中那样的加密指令。\n\n列表 2-2：Java 字节码\n```bytecode\n0 aload_0\n1\
  \ getfield #19 <com/allmycode/samples/MyActivity/room>\nLcom/allmycode/samples/Room;>\n\
  4 getfield #47 <com/allmycode/samples/Room/numGuests I>\n7 ifne 22 (+15)\n10 aload_0\n\
  11 getfield #41 <com/allmycode/samples/MyActivity/label>\nLandroid/widget/TextView;>\n\
