  \ 3-6` 中的代码是平行的。与 `Listing 3-6` 中的服务一样，`Listing 3-7` 中的客户端也拥有 messenger 和一个入站处理器（incoming\
  \ handler）。`Figure 3-3` 显示了我为 `Listing 3-7` 中的活动创建的布局。`Listing 3-7` 中的 `bind`、`queryService`\
  \ 和 `unbind` 方法处理了 `Figure 3-3` 中的按钮点击。（本节的服务并不不在乎你在哪个城市，因此 `Figure 3-3` 中为城市名称或邮政编码设置的\
  \ `EditText` 没有任何用。它是后续示例中用户输入的占位符。）\n\n## 通知用户\n\n在 `Figure 3-3` 的底部，有一个包含 `Message`\
  \ 字样的圆角矩形。该矩形说明了 Android 中 `Toast` 类的用法。toast 是一种不显眼的小视图，会在短时间内显示一些有用信息。toast 视图在屏幕上弹出，就像一片热热的面包从吐司机中弹出一样（据传\
  \ Android 类名 `Toast` 就源于这个比喻）。\n\n**图 3-3：** `Listing 3-7` 活动的用户界面。\n\n![97811802707-fg03303](img/97811802707-fg03303_tif)\
  \ 一个 toast 视图通常显示一条供用户阅读的消息。因此 Android 开发者经常提到 toast 消息（toast messages）。从原则上说，使用\
  \ toast message 这个词没有问题。但本章的大部分涉及 `android.os.Message` 类的实例——即在服务与其客户端之间发送的消息。在\
  \ `Figure 3-3` 的底部，`Message` 一词指的是服务与其客户端之间的消息，而不是 toast 消息。因此在 `Figure 3-3` 中，toast\
  \ 消息告知用户的是另一种完全不同的消息。作者该怎么办？在本章中，我使用 message 一词来指代服务与其客户端之间的通信。在其他章节中，我会随意使用 toast\
  \ message 等词而不必担心这个问题。\n\n`Toast` 类有两个非常有用的方法：`makeText` 和 `show`。\n\n静态方法 `Toast.makeText`\
  \ 创建一个 `Toast` 类的实例。`makeText` 方法有三个参数：\n\n*   第一个参数是上下文（context，即 `Listing 3-7`\
  \ 中的 `this`）。\n*   第二个参数是资源（resource）或字符序列（例如 `String`）。如果你使用一个 `String` 调用 `makeText`，那么当\
  \ Android 显示 toast 时，用户将看到该 `String`。如果你使用资源调用 `makeText`，Android 会在你的应用的 `res`\
  \ 目录中查找该资源。在 `Listing 3-7` 中，代码调用了两次 `makeText`——一次使用资源 `R.string.service_connected`，另一次使用\
  \ `R.string.service_crashed`。\n\n![remember](img/remember_jpeg) 如果你在 `makeText`\
  \ 方法的第二个参数中使用一个 `int` 值（例如 42），Android 不会在 toast 视图显示字符 42。相反，Android 会寻找 `R.java`\
  \ 中值为 42 的资源。你的 `R.java` 文件可能并不包含 42。因此，你得到的不是 toast 视图，而是 `ResourceNotFound` 异常。你的程序崩溃了，你感到沮丧。\n\
  \n*   `makeText` 方法的第三个参数是 `Toast.LENGTH_LONG` 或 `Toast.LENGTH_SHORT`。`LENGTH_LONG`，toast\
  \ 视图持续大约四秒。`LENGTH_SHORT`，toast 视图持续大约两秒。\n*   `show` 方法告诉 Android 显示 toast 视图。\n\
  \n在 `Listing 3-7` 中，注意我在一个 Java 语句中调用了 `makeText` 和 `show`。如果你忘记调用 `show` 方法，toast\
  \ 视图就不会出现。你难以置信地盯着屏幕，不知道为什么看不到 toast 视图（“谁偷了我的 toast？”你想）。当你终于发现是忘记调用 `show` 方法时，你会觉得自己很蠢（至少我今天早些时候是这种感觉）。\n\
  \n### 绑定服务\n\n在 `Listing 3-7` 中，`bindService` 的调用接受三个参数——一个 `intent`、一个服务连接（service\
  \ connection）和一个表示标志的 `int` 值。\n\n*   `intent` 帮助确定调用的服务。\n\n在 `Listing 3-7` 中，该\
  \ intent 有 action `com.allmycode.WEATHER`。这很好，因为我的服务的 `AndroidManifest.xml` 文件包含了以下元素：\n\
  \n```xml\n<application android:icon=\"@drawable/icon\"\n  android:label=\"@string/app_name\"\
  >\n  <service android:name=\".MyWeatherService\">\n    <intent-filter>\n      <action\
  \ android:name=\"com.allmycode.WEATHER\" />\n    </intent-filter>\n  </service>\n\
  </application>\n```\n\n（本章仅出现了 `AndroidManifest.xml` 文件的片段。）\n\n\n\n\n\n当 Android\
  \ 需要更多内存时，Android 会终止进程。在列表 3-7 中，标记 `BIND_AUTO_CREATE` 告诉 Android 在你的 activity\
  \ 运行时避免终止服务的进程。另一种替代方案 `BIND_NOT_FOREGROUND` 则告诉 Android 在决定是否终止服务的进程时，不要考虑你的 activity\
  \ 的需求。\n\n## 查询服务\n\n在列表 3-7 中，`queryService` 方法向服务请求问题的答案。以下是 `queryService` 方法的作用：\n\
  \n1. `queryService` 方法从 `android.os.Message` 类获取一个空消息（blank message）。\n2. `queryService`\
  \ 方法向消息中添加一个问题（即 bundle）。\n3. `queryService` 方法告诉信使器（messenger）将该消息发送给服务。\n\nbundle（`android.os.Bundle`\
  \ 的实例）是一个进程可以写入、而另一个进程可以从其读取的对象。你会在每个 activity 的 `onCreate` 方法中看到一个 bundle。在数据通信的世界中，发送消息被比作写入数据。因此在列表\
  \ 3-7 中，代码在处理各种 bundle。\n\n* `queryService` 方法将 bundle 放在消息上，然后将消息“写入”Android 消息队列。\n\
  * `MyIncomingHandler` 类中的 `handleMessage` 方法从 Android 消息队列中“读取”消息，然后获取该消息的 bundle\
  \ 以在设备屏幕上显示。\n\n## 使用 shared preferences 重启连接\n\n列表 3-7 包含了一个关于服务生命周的重要课程。绑定到另一个组件（例如\
  \ activity）的服务往往会保持存。如果开发者没有显式地从服务解绑（unbind），服务就会堆积并开始阻塞 Android 的通道。因此，一个良好的公民应该做清理工作来解绑服务。\n\
  \n因此在列表 3-7 中，`onDestroy` 方法解绑了服务。到目前为止一切良好。但当用户旋转设备时会发生什么？这本微型书籍的第一章提醒过当用户更改设备方向时会发生什么——Android\
  \ 会销毁当前的 activity 并在新的方向上重新创建它。所以如果你不小心，用户只需移动设备就会丢失服务。这可能不是你想要的。\n\n为了防止这个问题，请使用\
  \ shared preferences。通过 shared preferences，你可以存储信息。稍后，你的应用（或者如果你愿意，其他人的应用）可以检索这些信息。\n\
  \n以下是使用一组 shared preferences 的方法：\n\n* 要创建 shared preferences，调用 `android.content.Context`\
  \ 类的 `getSharedPreferences` 方法。\n\n对于参数，向方法调用传递一个名称和一种模式。在列表 3-7 中，名称是字符串 `“PREFS\"\
  `，模式是 `int` 值 `android.content.Context.MODE_PRIVATE`。替代方案有：\n\n* `MODE_PRIVATE`：没有其他进程可以读取或写入这些偏好。\n\
  * `MODE_WORLD_READABLE`：其他进程可以读取这些偏好。\n* `MODE_WORLD_WRITEABLE`：其他进程可以写入这些偏好。\n\
  * `MODE_MULTI_PROCESS`：即使在一个进程进行读取操作，其他进程也可以写入这些偏好。如此并发的情况下可能会发生奇怪的事情。所以要小心！\n\n\
  你可以使用 Java 的位或 `or` 运算符组合模式。因此，如下的调用：\n\n```java\ngetSharedPreferences(\"PREFS\"\
  , MODE_WORLD_READABLE | MODE_WORLD_WRITEABLE);\n```\n\n会让你的偏好对所有其他进程都是可读且可写的。\n\n\
  * 要向一组 shared preferences 添加值，请使用 `android.content.SharedPreferences.Editor` 类的实例。\n\
  \n在列表 3-7 中，`onDestroy` 方法创建了一个新的编辑器对象。然后代码使用该编辑器向 shared preferences 添加一个键/值对 `(\"\
  isBound\", isBound)`。`Editor` 类拥有如 `putInt`、`putString`、`putStringSet` 等方法。\n\n\
  * 要完成工作，调用编辑器的 `commit` 方法。\n\n再次，参见列表 3-7。\n\n* 要检索已存在的 shared preferences，调用 `getSharedPreferences`，并使用与你创建偏好时相同的名称。\n\
  \n你能猜到是哪个列表包含此代码示例吗？是的！列表 3-7。看该列表的 `onCreate` 方法。\n\n* 要从已存在的 shared preferences\
  \ 中读取值，调用 `getBoolean`、`getInt`、`getFloat` 或属于 `SharedPreferences` 类的其他 get 方法。\n\
  \n在列表 3-7 中，对 `getBoolean` 的调用接受两个参数。第一个参数是你尝试获取的任何键/值对中的名称。第二个参数是默认值。所以当你调用 `prefs.getBoolean(\"\
  isBound\", false)` 时，如果 `prefs` 没有名为 `“isBound\"` 的对，则该方法调用返回 `false`。\n\n在列表 3-7\
  \ 中，`onDestroy` 方法保存了 `isBound` 的值。然后当 Android 恢复 activity 时，`onCreate` 方法检索 `isBound`\
  \ 的值。实际上，`onCreate` 方法“发现”了在 activity 被销毁之前服务是否已绑定。如果服务是绑定的，代码将重新建立连接，再次调用 `bindService`\
  \ 方法。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg) 使用应用中 `AndroidManifest.xml`\
  \ 文档中的属性，你可以防止 Android 在用户更改设备方向时销毁 activity。\n\n## 获取真实数据\n\n在本节中，你对天气进行操作。在列表\
