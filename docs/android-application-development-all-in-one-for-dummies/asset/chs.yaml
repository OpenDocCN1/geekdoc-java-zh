  \ ）。\n\n![remember.eps](img/remember_fmt.jpeg) 没有人（除了某些偏远实验室里的少数疯狂开发者之外）会去编写 Java\
  \ 字节码。你是运行软件（编译器）来创建 Java 字节码的。查看列表 2-2 的唯一目的是为了理解计算机有多勤奋。\n\n### Dalvik 字节码\n\n\
  如果说编译是一件好事，那么编译两次可能更好。2007 年，Google 的 Dan Bornstein 创建了 Dalvik 字节码 —— 另一种供处理器遵循的指令表示方式。（若想知道\
