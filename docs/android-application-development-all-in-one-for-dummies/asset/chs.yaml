  \n# 第 4 章：平板电脑应用\n\n## 本章内容\n\n![check.png](img/check.png) 适配屏幕尺寸和屏幕方向\n![check.png](img/check.png)\
  \ 管理多面板 Activity\n\n#### 不要想大象\n\n好了，既然你已经在想大象了，那就想大大象的腿。大象腿的直径大约是 40 厘米（超过一码的十分分之一）。\n\
  \n再想想跳蛛科的“大脚蜘蛛”，它们有像头发一样的腿。再想想格列夫和他的布罗丁纳格巨人朋友。每个布罗丁纳格巨人高约 72 英尺，但布罗丁纳格巨人的身体比例与格列夫相同。\n\
  \n《格列夫游记》是一部虚构作品。一个身高是人类 12 倍的动物，其骨骼尺寸不可能符合人类比例。换句话说，如果你增加对象的尺寸，就必须加宽对象的支撑部分。否则，物体将会坍塌。\n\
  \n这个关于宽高的反直觉的真相来自于某些几何事实。对象的体积随着高度的立方增长而增加。但支撑这种体积的能力仅随着高度的平方增长而增加。这是因为重量支撑取决于支撑腿的截面积，而截面积是平方测量，而不是立方测量。\n\
  \n总之，事物的大小会产生重要的定性差异。以一个为触摸手机设计的 Activity 为例。在进行任何其他更改的情况下，将该 Activity 放大到更大。然后在十英寸平板屏幕上显示放大后的版本。你在平板上看到的会非常糟糕。一个微小的、看起来清晰的图标变成了一个大而模糊的块。电子书页面适应了显示更长的行宽。但如果一行有\
  \ 40 个单词，人眼会遭受极其严重的疲劳。\n\n同样的问题也出现在 Android Activity 中。一个 Activity 包含了足够填充小手机屏幕的信息。当用户需要更多信息时，你的应用会显示另一个\
  \ Activity。新 Activity 替换旧 Activity，导致屏幕完全刷新。\n\n如果你将这种 Activity 行为强加到更大的平板屏幕上，用户会觉得被骗了。尽管有空间同时容纳新旧信息，你却替换了屏幕上的所有内容。从一个\
  \ Activity 到另一个的过渡是突兀的，而且新旧 Activity 看起来都很空。\n\n毫无疑问……Android 的平板设备需要全新的面貌。为了实现这种面貌，Android\
  \ 的 Honeycomb 版本引入了碎片（fragments）。\n\n## Fragment 能为你做什么\n\nFragment 处于 View 和 Activity\
  \ 之间。像 View 一样，Fragment 无法独立生存。View 存在于 Activity 内部。除非你将其设置为 Activity 的内容，否则不会显示它。\n\
  \n是的，Fragment 类似于 View。但像 Activity 一样（与 View 不同），Fragment 有生命周期。表 4-1 列出了 Fragment\
  \ 的生命周期方法。\n\n![Table 4-1 Fragment Lifecycle Methods](img/9781118027707-bk0401a.jpg)\n\
  \n![Table 4-1 Fragment Lifecycle Methods](img/9781118027707-bk0401b.jpg)\n\nFragment\
  \ 有生命周期。你对此消息的反应可能是：“噢，不！有更多此类之类的方法要管理！”但事实是，组件的生命周期方法是你的朋友。生命周期方法协调各个组件的进入和退出。这意味着你需要管理自己的应用界面。但如果没有生命周期方法，你必须微管理自己的应用与其他应用以及\
  \ Android 操作系统的交互。\n\n## 使用 Fragment 编程\n\n本节示例中的用户界面有三个面板——项目列表、描述列表中所选项目的详情面板，以及一个更深入的细节面板。在小手机屏幕上，每个面板将是一个独立的\
  \ Activity。但平板屏幕横屏模式下有空间容纳多个面板。\n\n图 4-1 显示了本节应用三个面板中的两个。左面板显示 Android SDK 组件列表。右侧面板显示左列表中选中的任何组件的描述。（该描述实际上是组件\
  \ SDK 文档的前几句。）这种右侧详情的模式是许多用户界面的组成。\n\n**图 4-1：** 附加到 Activity 的两个 Fragment。\n\n\n\
  \n\n\n要创建图 4-1 所示的界面，你需要构建一个 activity。该 activity 包含两个 fragment —— 左侧一个，右侧一个。左侧面板在整个应用运行期间一直显示同一个\
  \ fragment，因此你可以在 `AndroidManifest.xml` 文档中声明该 fragment。右侧面板每次显示一个 fragment，但 fragment\
  \ 在应用运行期间会变化。因此，你在右侧面板声明了一个框架布局（frame layout）。代码列表 4-1 包含了代码。\n\n### 代码列表 4-1：main.xml\
  \ 文\n\n```xml\n<?xml version=\"1.0\" encoding=\"utf-8\"?>\n<LinearLayout xmlns:android=\"\
  http://schemas.android.com/apk/res/android\"\n    android:orientation=\"horizontal\"\
  \n    android:layout_width=\"match_parent\"\n    android:layout_height=\"match_parent\"\
  >\n    <fragment class=\"com.allmycode.frag.ComponentNamesFragment\"\n         \
  \ android:id=\"@+id/component_names\"\n          android:layout_height=\"match_parent\"\
  \n          android:layout_width=\"0px\"\n          android:layout_weight=\"1\"\
  \ />\n    <FrameLayout android:id=\"@+id/docs\"\n          android:layout_height=\"\
  match_parent\"\n          android:layout_width=\"0px\"\n          android:layout_weight=\"\
  1\"\n          android:background=\"?android:attr/detailsElementBackground\" />\n\
  </LinearLayout>\n```\n\n应用的主 activity 代码出乎奇地平淡无奇。（参见代码列表 4-2。）\n\n### 代码列表 4-2：MainActivity\n\
  \n```java\npackage com.allmycode.frag;\nimport android.app.Activity;\nimport android.os.Bundle;\n\
  public class AllPurposeActivity extends Activity {\n  @Override\n  protected void\
  \ onCreate(Bundle savedInstanceState) {\n    super.onCreate(savedInstanceState);\n\
  \    setContentView(R.layout.main);\n  }\n}\n```\n\n代码列表 4-3 包含了 `ComponentNamesFragment`\
  \ 类。得益于列表 4-1 中的布局，Android 在设备屏幕的左侧放置了一个 `ComponentNamesFragment`（参见图 4-1）。\n\n\
  ### 代码列表 4-3：包含项目列表的 Fragment\n\n```java\npackage com.allmycode.frag;\nimport android.app.FragmentManager;\n\
  import android.app.FragmentTransaction;\nimport android.app.ListFragment;\nimport\
  \ android.os.Bundle;\nimport android.view.View;\nimport android.widget.ArrayAdapter;\n\
  import android.widget.ListView;\npublic class ComponentNamesFragment extends ListFragment\
  \ {\n  final static String[] COMPONENTS = { \"Activity\",\n      \"Service\", \"\
  BroadcastReceiver\", \"ContentProvider\" };\n  @Override\n  public void onActivityCreated(Bundle\
  \ savedInstanceState) {\n    super.onActivityCreated(savedInstanceState);\n    setListAdapter(new\
  \ ArrayAdapter<String>(\n        getActivity(),\n        android.R.layout.simple_list_item_activated_1,\n\
  \        COMPONENTS));\n  }\n  @Override\n  public void onListItemClick(ListView\
  \ l, View v,\n      int index, long id) {\n    getListView().setItemChecked(index,\
  \ true);\n    DocsFragment docsFragment =\n        DocsFragment.newInstance(index);\n\
  \    FragmentManager fragmentManager =\n        getFragmentManager();\n    FragmentTransaction\
  \ fragmentTransaction =\n        fragmentManager.beginTransaction();\n    fragmentTransaction.replace(R.id.docs,\
  \ docsFragment);\n    int backStackEntryCount =\n        fragmentManager.getBackStackEntryCount();\n\
  \    for (int i = 0; i < backStackEntryCount; i++) {\n      fragmentManager.popBackStackImmediate();\n\
  \    }\n    fragmentTransaction.addToBackStack(null);\n    fragmentTransaction.commit();\n\
  \  }\n}\n```\n\n`ListFragment` 是一个显示列表的 fragment。在 fragment 生命周期的早期，列表 4-3 中的代码为该\
  \ fragment 设置了一个列表适配器（更具体地说，是一个 `ArrayAdapter`）。那么，“早期”是指多早呢？正如迷你书（minibook）第 2\
  \ 章的示例所示，`ArrayAdapter` 构造函数的第一个参数是上下文（context）。等一下！与 activity 不同，fragment 不是上下文。因此，不能在构造函数的第一个参数中使用\
  \ `this` 关键字。\n\n幸运的是，fragment 拥有一个 `getActivity()` 方法。调用 `getActivity()` 可以获取 fragment\
  \ 所挂载的 activity。因此，对于 `ArrayAdapter` 构造函数的第一个参数，你可以调用 `getActivity()`。当然，在 fragment\
  \ 挂载到现有 activity 之前，你无法调用 `getActivity()`。这就是为什么在列表 4-3 中，我重写了 fragment 的 `onActivityCreated`\
  \ 方法。Android 在挂载 fragment 并调用 activity 的 `onCreate` 方法后会调用 `onActivityCreated`。因此，一切按计划运行。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\n\n`android.app.Activity` 类的祖父类是\
  \ `android.content.Context`。但 `android.app.Fragment` 类的父类是普通的 `java.lang.Object`。因此，在\
  \ activity 的代码中，关键字 `this` 指向上下文。但在 fragment 的代码中，关键字 `this` 并不指向上下文。\n\n![cross-reference.eps](img/cross_reference_fmt.jpeg)\n\
  \n`ListFragment` 就像 `ListActivity` —— 只一个它是一个 fragment，而不是 activity。`ListActivity`\
  \ 类的许多概念非常适用于 `ListFragment`。要了解 Android 的 `ListActivity` 类，请参阅迷你书的第 2 章。就像 `ListActivity`\
  \ 一样，`ListFragment` 也有 `onListItemClick` 方法。在列表 4-3 中，我通过 `DocsFragment`、`FragmentTransaction`\
  \ 和 `FragmentManager` 来响应点击：\n\n* 列表 4-3 中的 `DocsFragment` 实例代表了图 4-1 的右侧。\n* fragment\
  \ 事务（fragment transaction）是你对 fragment 进行的一些操作。例如，在列表 4-3 中替换一个 fragment 就是事务。\n\
  * fragment 管理器（fragment manager）名副其实。它管理 fragment 的进入和离开。\n\n### fragment\n\n你直到列表\
  \ 4-4 才能看到 `DocsFragment` 的代码。所以现在，通过 `DocsFragment.newInstance()` 创建的 fragment\
  \ 还是一个黑盒。（我不应该这样故弄悬疑。）\n\n列表 4-3 中关于 `DocsFragment` 实例的信息是，它知道当前的 `index` —— 即用户选择的项目的位置。（列表在左侧。）`DocsFragment`\
  \ 类代码应该根据这个 `index` 值（`0`、`1`、`2` 或 `3`）决定显示哪个组件的文档。\n\n### 事务\n\n事务一词源于数据库领域。事务是一组操作。这些操作在一个全有或无的泡泡中运行。也就是说，事务中的所有操作要么全部执行，要么一个都不执行。\n\
  \n在列表 4-3 中，你将一组语句转换为事务。具体来说，你将一组语句夹在 `beginTransaction()` 和 `commit()` 调用之间。这些语句中的\
  \ `fragmentTransaction.replace(R.id.docs, docsFragment)` 准备将 `docs` 框架布局（位于列表 4-1）中的当前内容替换为新的\
  \ fragment。替换在 Android 执行 `fragmentTransaction.commit()` 方法时发生。\n\n\n\n\n随着 Android\
  \ 3.0 引入了 fragment（片段），一个 activity 可以拥有它自己的私有栈。你可以显示 fragment A，然后调用 `fragmentTransaction.replace`\
  \ 和 `fragmentTransaction.addToBackStack`。这些方法调用的组合使得 fragment B 覆盖 fragment A。当用户按下返回键时，fragment\
  \ B 消失，fragment A 回到在 activity 屏幕上的位置。在 activity 没有任何可以丢弃的 fragment 之前，Android 不会销整个\
  \ activity。\n\n通过列表 4-3 中的 `for` 循环，片段管理器（fragment manager）对 activity 的 fragment\
  \ 栈进行了一些快速清理工作。要了解更多关于这种清理工作，请看下一节。\n\n## Fragments、更多的 Fragments、甚至是 Fragments\n\
  \n图 4-1 中的右侧面板有一个“更多”（More）按钮。当用户按下此按钮按钮时，应用程序会显示所选组件更详细的描述。要发现这是如何实现的，请若有所思（但要心情愉快）地观察列表\
  \ 4-4 中的代码。\n\n### 列表 4-4：在图 4-1 右侧创建 Fragment 的代码\n\n```java\npackage com.allmycode.frag;\n\
  \nimport android.app.Fragment;\nimport android.app.FragmentTransaction;\nimport\
  \ android.os.Bundle;\nimport android.view.LayoutInflater;\nimport android.view.View;\n\
  import android.view.View.OnClickListener;\nimport android.view.ViewGroup;\nimport\
  \ android.widget.Button;\nimport android.widget.LinearLayout;\nimport android.widget.TextView;\n\
  public class DocsFragment extends Fragment {\n  int index;\n  public static DocsFragment\
  \ newInstance(int index) {\n    DocsFragment docsFragment = new DocsFragment();\n\
  \    docsFragment.index = index;\n    return docsFragment;\n  }\n  @Override\n \
  \ public View onCreateView(LayoutInflater inflater,\n      ViewGroup container,\
  \ Bundle savedInstanceState) {\n      LinearLayout layout = new LinearLayout(getActivity());\n\
  \      layout.setOrientation(LinearLayout.VERTICAL);\n      TextView textView1 =\
  \ new TextView(getActivity());\n      textView1.setTextSize(30);\n      textView1\n\
  \          .setText(ComponentNamesFragment.COMPONENTS[index]);\n      layout.addView(textView1);\n\
  \      TextView textView2 = new TextView(getActivity());\n      textView2.setTextSize(20);\n\
  \      textView2.setText(DOCS[index]);\n      layout.addView(textView2);\n     \
  \ Button button = new Button(getActivity());\n      button.setText(“More”);\n  \
  \    button\n          .setOnClickListener(new MyButtonListener(index));\n     \
  \ layout.addView(button);\n      return layout;\n  }\n  public class MyButtonListener\
  \ implements\n      OnClickListener {\n    int index;\n    public MyButtonListener(int\
  \ index) {\n      this.index = index;\n    }\n    @Override\n    public void onClick(View\
  \ view) {\n      DocsFragmentVerbose docsFragmentVerbose =\n          DocsFragmentVerbose.newInstance(index);\n\
  \      FragmentTransaction fragmentTransaction =\n          getFragmentManager().beginTransaction();\n\
  \      fragmentTransaction.replace(R.id.docs,\n          docsFragmentVerbose);\n\
  \      fragmentTransaction.setTransition\n          (FragmentTransaction.TRANSIT_FRAGMENT_OPEN);\n\
  \      fragmentTransaction.addToBackStack(null);\n      fragmentTransaction.commit();\n\
  \    }\n  }\n  final static String[] DOCS =\n    {\"An activity is a single, focused\
  \ thing that the user can do. Almost all activities interact with the user, so the\
  \ Activity class takes care of creating a window for you which you can place your\
  \ UI with setContentView(View).A Service is an application component representing\
  \ either an application’s desire to perform a longer-running operation while not\
  \ interacting with the user or to supply functionality for other applications to\
  \ use.,Base class for code will receive intents sent by broadcast(). You can either\
  \ dynamically register an instance of this class with Context.registerReceiver()\
  \ or statically publish an implementation through the <receiver> tag in AndroidManifest.xml.,Content\
  \ providers are one of the building blocks of Android applications, providing content\
  \ to applications. They encapsulate data and provide it to applications through\
  \ the single ContentResolver.A content provider is only required if you need to\
  \ share data between multiple applications.\"};\n}\n```\n\n表 4-1 列出了 `onCreateView`\
  \ 为 `Fragment` 类生命周期方法之一。在列表 4-4 中，`onCreateView` 方法使用 Java 代码来组合布局——图 4-1 右侧的布局。列表中的\
  \ `onCreateView` 方法返回一个线性布局（linear layout），它是一个视图组（view group），也是一个 view。而这个 view\
  \ 就成了 fragment 在平板屏幕上的可见呈现。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg)\
  \ 在列表 4-4 中，我使用 Java 代码而非 `res/layout` 文档来定义 fragment 的布局。第三卷第 2 章将详细介绍使用 Java 代码定义\
  \ view 和布局的用法。\n\n## 构建 fragment 栈\n\n在列表 4-4 中，按钮的 `OnClickListener` 将图 4-1 的右侧替换为一个全新的\
  \ fragment——一个我的 `DocsVerbose` 类的实例。由于我这人很聪明，我编写了 `DocsVerbose` 类来显示官方文档网站上的一个页面。列表\
  \ 4-5 包含了这些代码。\n\n### 列表 4-5：包含 Web View 的 Fragment\n\n```java\npackage com.allmycode.frag;\n\
  import android.app.Fragment;\nimport android.os.Bundle;\nimport android.view.LayoutInflater;\n\
  import android.view.View;\nimport android.view.ViewGroup;\nimport android.webkit.WebView;\n\
  public class DocsFragmentVerbose extends Fragment {\n  int index;\n  public static\
