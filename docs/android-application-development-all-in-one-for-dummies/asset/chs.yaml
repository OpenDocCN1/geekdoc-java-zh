  \        docsFragmentVerbose);\n    fragmentTransaction.setTransition\n        (FragmentTransaction.TRANSIT_FRAGMENT_OPEN);\n\
  \    fragmentTransaction.commit();\n  }\n}\n```\n\n新的 `DocsActivityVerbose` 执行相同的操作。\n\
  \n![technicalstuff.eps](img/technicalstuff.jpeg)\n\n3.  向项目的 `AndroidManifest.xml`\
