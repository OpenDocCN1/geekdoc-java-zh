  \n**图 1-14：** Android 开发者主页。\n\n![9781118027707-fg050114.tif](img/9781118027707-fg050114_fmt.jpeg)\n\
  \n## 为您的应用程序定价\n\n现在您已经有了 APK 文件，并且注册了 Android 开发者。现在您终于准备好将应用交到用户手中了。但您需要问自己最后一个重要的问题——我的应用是免费应用还是付费应用？\n\
  \n\n\n\n\n在发布应用之前，你应该做出这个决定，因为这会对潜在客户/用户产生心理影响，并对你产生经济上的影响。如果你的应用程序是付费应用，你必须决定你的价格点。查看市场中类似的应用程序。大多数应用销售的价格范围似乎从\
  \ $0.99 到 $9.99 不等。我很少看到某个应用的价格超过 10 美元的门槛。让你的定价与你的产品保持竞争性，这是一场你必须参与的经济学游戏，以确定哪种方案适用于你的应用程序。\n\
  \n付费与免费的讨论是一个永恒的话题，双方都认为任何一种模式都可以盈利。我两种模式都尝试过，并发现它们都能带来可观的收入。（是的，“免费”应用也可以赚钱——如果你不相信，请查看本章稍后关于“免费模型”的内容。）哪种模型都不是万无一的——你必须根据自己的情况找出哪种最适合你的应用程序。\n\
  \n## 付费模型\n\n如果你选择付费模型，在第一笔销售后的 `24` 小时内你就能拿到钱（节假日和周末除外，否则你将在下一个工作日收到资金）。但根据我的经验，你的应用程序不会收到很多活跃安装，因为它是一个付费应用。你就是自己应用的营销团队，如果没人知道你的应用，他们又怎么知道去买呢？免费应用也面临类似的问题，但用户可以免费安装，而且应用留在他们设备上的心理负担微乎其微。对于付费应用，情况会有所不同。\n\
  \n所有 Android 市场用户在首次购买你的付费应用时，都会获得免费的 `24` 小时试用期。这意味着用户可以购买并安装应用，`Google Checkout`\
  \ 会授权用户存档的信用卡，该费用将保持授权状态，直到原始购买时间起 `24` 小时后。你可以在你的 `Google Checkout` 面板中监控这一点。\n\
  \n在这 `24` 小时内，用户可以使用功能完整的应用程序。如果用户在 `24` 小时内卸载了应用程序，Google 将全额退款。如果用户在 `24` 小时内未卸载应用，信用卡授权将变为收费，你将在第二天收到资金。\n\
  \n## 成为商家\n\n当你在 Android Market 上销售应用时，Google 会收取 `30` 百分的佣金。考虑到 Google 巨大的曝光率，让你获得收入的\
  \ `70` 百分是一个相当不错的交易。\n\n要发送你的应用，你必须先创建一个商家账户——与你在上一节中创建的 Android Market 账户不同。创建商家账户：\n\
  \n1. 遵循本章“创建 Android Market 账户”部分中的步骤操作。\n2. 创建 Android Market 账户后，将浏览器指向 [`https://market.android.com/publish/Home`](https://market.android.com/publish/Home)。\n\
  3. 当到达 Android Market 首页时，点击 `Setup Merchant Account`（设置商家账户）链接。\n\n点击此链接将带你进入一个带有大型表单的页面。（参见图\
  \ 1-15。）\n\n**图 1-15:** 输入你的私人联系信息。\n\n![9781118027707-fg050115.tif](img/9781118027707-fg050115_fmt.jpeg)\n\
  \n4. 告诉 Google 你内心的秘密。\n. . . 但不要在《Android Application Development All-in-One For\
  \ Dummies》的图 1-15 中显示它们。\n5. 在表单的下一部分，填写你的公开可用联系信息。\n参见图 1-16。\n6. 在表单的 Financial\
  \ Information（财务信息）部分，向他们展示资金。\n参见图 1-17。\n7. 同意服务条款（如果你愿意），并点击 `Complete Sign Up`（完成注册）按钮。\n\
  \n完成所有操作后，你就可以在 Google 的 Android Market 上销售应用了。\n\n**图 1-16:** 输入你的公开联系信息。\n\n![9781118027707-fg050116.tif](img/9781118027707-fg050116_fmt.jpeg)\n\
  \n**图 1-17:** 关键所在。\n\n![9781118027707-fg050117.tif](img/9781118027707-fg050117_fmt.jpeg)\n\
  \n## 应用许可\n\n要对你的应用收费，你必须为其添加许可。使用 Android 的许可验证库 (`LVL`) 来实现此操作。你可以使用 Android 的\
  \ `SDK` 和 `AVD Manager` 下载 `LVL`。在图 1-18 中，`LVL` 的名为 `Google Market Licensing` 包，版本号为\
  \ `1`。\n\n**图 1-18:** 获取许可验证库。\n\n![9781118027707-fg050118.tif](img/9781118027707-fg050118_fmt.jpeg)\n\
  \n![tip.eps](img/tip_fmt.jpeg) 要调出 `SDK` 和 `AVD Manager`，请从 Eclipse 的主菜单选择 `Window⇒Android\
  \ SDK and AVD Manager`。或者，在你开发电脑的命令行窗口中，导航到 Android SDK 目录。\n\n在 `tools` 目录中运行 `android`\
  \ 或 `android.bat`。\n\n在你的应用中集成 `LVL` 时，它允许你选择一种许可策略。你有三种选择：\n\n*   **Strict（严格模式）**：每当用户尝试启动应用时，设备都会向\
  \ Market 请求许可。如果设备没有连接，用户将无法使用。这种方式很糟糕。\n*   **Server-managed（服务器管理模式）**：设备存储许可副本。设备会跟踪有效期等其他内容。这是默认策略，也是\
  \ Google 极推荐的策略。\n*   **Custom（自定义模式）**：在你的 Java 代码中创建自己的策略。对于开发者来说，这种选择可能会让你紧张。但对于非常敏感的情况，这可能是最好的。\n\
  \n![cross-reference.eps](img/cross-reference.jpeg) 有关 `LVL` 的所有细节，请访问 [`developer.android.com/guide/licensing.html`](http://developer.android.com/guide/licensing.html)。\n\
  \n## 测试\n\n当你与同楼的朋友测试应用时，你得到的是可靠的结果。因此，住在其他国家的朋友应该测试你的应用。这就是为什么 Android 的 `LVL`\
  \ 允许你发布受限制的应用。图 1-19 显示了列出测试用户 Google 账户的屏幕。`Test Response`（测试响应）框让你选择 Market 的响应。\n\
  \n例如，在图 1-19 中，我在框中选择了 `LICENSED`（已许可）。当我的一个测试用户（例如 `user1@gmail.com`）尝试启动应用时，Market\
  \ 回复：“是的，你已许可”。但注意你可以测试许可代码的程度。如果你在框中选择了 `NOT_LICENSED`（未许可），Market 服务器是否正确拒绝测试用户访问应用？如果\
  \ Market 返回 `LICENSED_OLD_KEY` 会发生什么？用户可以启动应用吗？你希望用户能够启动应用吗？所有这些选择都能帮助你测试许可代码的健壮性。\n\
  \n图 1-19 列出测试用户并选择响应。\n\n![9781118027707-fg050119.tif](img/9781118027707-fg050119_fmt.jpeg)\n\
  \n## 免费模型\n\n如果你选择免费路线，用户可以免费安装应用。根据我的经验，50%-80% 的应用用户会将应用留在设备上，而其他人会卸载。现在的问题是，你如何通过免费应用赚钱？\n\
  \n幸运的是，你有一些选择：\n\n* **广告**：各种移动广告代理公司可以为你提供第三方库，以便在你的移动应用上显示广告。顶级的移动广告公司是 `Google\
  \ AdSense`、`AdMob`（最近被 Google 收购）和 `Quattro Wireless`（最近被 Apple 收购）。\n\n\n\n\n从这些公司中获取一个免费账户相当简单。它们提供极佳的\
  \ SDK，并引导你如何在你的原生 Android 应用程序上运行广告。大多数公司都采用 60 天的净账期支付周期，因此在可能几个月后，你才能收到第一张支票。\n\
  \n## 应用内购买\n\n作为一名正规的 Android 市场（Market）开发者，你可以直接通过你的应用程序销售商品和服务。你可以出售订阅服务、厨房用具以及为失恋者提供建议。用户通过在你的应用程序内填写字段并点击按钮来完成购买。与付费模式一样，Google\
  \ 会收取 30% 的佣金。\n\n要设置应用内购买，你必须对你的应用代码进行重大的添加。你需要创建一个服务、一个广播接收器、一个 `AIDL` 文件以及其他内容。欲了解所有详尽细节，请访问\
  \ [`http://developer.android.com/guide/market/billing/billing_integrate.html`](http://developer.android.com/guide/market/billing/billing_integrate.html)。\n\
  \n## 为应用程序获取截图\n\n截图是 Android 市场生态系统中非常重要的一部分，因为它们允许用户在安装之前预览你的应用程序。允许用户查看几张应用程序运行的截图，可能是决定用户是否安装你应用的决定性因素。想象一下你创建了一个游戏并想让用户玩。如果你花费了几个周（甚至是几个月）来创建精美的图形，你肯定希望游戏的潜在用户/买家能看到这些内容，这样他们就能看到你的应用看起来有多棒。\n\
  \n要获取应用程序的实时截图，你需要一个模拟器或物理 Android 设备。要获取截图，请执行以下操作：\n\n1. 打开模拟器，然后导航到你想捕捉的屏幕。\n\
  2. 在 `Eclipse` 中，打开 `DDMS` 视图。\n3. 在 Devices（设备）面板中选择该模拟器，如图 1-20 所示。\n4. 点击 `Screen\
  \ Shot` 按钮来捕捉截图。\n\n会出现 Device Screen Capture（设备屏幕捕捉）对话框。起初，你会看到 Capturing（正在捕捉）字样而不是截图。几秒后，截图就会出现。\n\
  \n5. 在 Device Screen Capture 对话框中，点击 `Save`（保存）按钮。\n操作系统会提示你文件名、目标文件夹以及所有这些操作。\n\
  6. 按照提示导航到 `Save Location`（保存位置）文件夹，输入文件名并点击 `Save`（保存）（或你在系统上保存文件时通常做的其他操作），完成截图的保存。\n\
  7. 要关闭 Device Screen Capture 对话框，点击框框的 `Done`（完成）按钮。\n\n你可以在模拟器或设备上进行更改，并使用命名准确的\
  \ `Refresh`（刷新）按钮刷新截图对话框，如图 1-20 所示。拍摄此截图后，你可以将其发布到 Android 市场。\n\n**图 1-20：** 已拍摄模拟器截图的\
  \ `DDMS` 视图。\n\n![9781118027707-fg050120.eps](img/9781118027707-fg050120_fmt.jpeg)\n\
  \n## 将你的应用程序上传到 Android 市场\n\n你终于达到了 Android 应用开发的巅峰——发布应用程序的时刻。发布应用程序很容易；只需遵循以下步骤即可：\n\
  \n1. 在 Android 开发者主页（参考图 1-14），点击 `Upload Application`（上传应用）按钮。\n打开 Upload an Application（上传应用）页面，如图\
  \ 1-21 所示。\n2. 对于 `Upload an .apk File`（上传 .apk 文件）字段，浏览到包含你应用的项目的 `bin` 目录；在该 `bin`\
  \ 目录中，选择你在“创建 APK 文件”章节中制作的 APK 文件；然后点击 `Upload`（上传）。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg)\
  \ 如果你导航到项目的 `bin` 目录，但在目录中没有看到 APK 文件，你的操作系统可能隐藏了诸如文件名末尾的 `apk` 字符的内容。关于此问题的解决方案，请参阅第一卷第\
  \ 2 章中名为“那些讨厌的文件名扩展名”（Those pesky filename extensions）的侧边栏。\n\n**图 1-21：** 上传页的第一部分。\n\
  \n![9781118027707-fg050121.tif](img/9781118027707-fg050121_fmt.jpeg)\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg)\
  \ Android 市场使用 Java 包名作为市场内部的标识符。没有两个应用具有相同的包名。所以，如果你的第一个应用在 `com.example.earnMeAMillion`\
  \ 包中，请将你的第二个应用放在 `com.example.secondTimeIsACharm` 包中。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 你的包名应该有助于识别你或你的公司。如果你有一个域名，请以域名部分的倒序顺序开始包名。例如，我是域名 `allmycode.com` 的自豪所有者，因此我发布了一个包名为\
  \ `com.allmycode.clicks` 的应用。（如果你发布了包名为 `com.allmycode.clicks` 的应用，你会收到我律师的电话的！）\n\
  \n3. 在 `Add a Screenshot`（添加截图）字段中，添加两张应用程序的截图。\n这些截图的大小需要为 320 像素宽 x 480 像素高，或\
  \ 480 像素宽 x 854 像素高。这些截图允许用户在运行状态下预览你的应用程序。如果你在犹豫提供截图是否值得麻烦，请考虑这个简单的事实：带截图的应用安装率更高。\n\
  4. 添加高分辨率图标。高分辨率图标的大小为 512 像素宽 x 512 像素高。随着 Android 设备拥有更大、更好的屏幕，高分辨率图标已成为必需。\n\
  5. （可选）添加宣传图、特色图和宣传视频。Google 可能会使用这些展示你的应用。\n6. 滚动到 `Listing Details`（列表详情）部分（参考图\
  \ 1-22），填写应用标题。\n![tip.eps](img/tip_fmt.jpeg) 根据经验，一个出色的标题可以提升应用的流行度。\n7. 设置应用程序的描述（参考图\
  \ 1-22）。\n这是用户在查看你的应用以决定是否安装时看到的描述。所有文本都用于搜索。\n8. 设置应用的推广文字。\n推广文字是在你的应用在市场中被推荐时使用的。让你的应用被推荐的过程在这一阶段相当模糊，根据我的观察，它是基于你应用的流行度的。如果你的应用被选中出现在推广区域（通常是市场中每个分类的顶部），推广文字将作为推广组件出现。\n\
  9. 设置应用类型。\n选项有应用程序（Applications）和游戏（Games）。\n\n**图 1-22：** 上传页的 `Listing Details`\
  \ 部分。\n\n![9781118027707-fg050122.tif](img/9781118027707-fg050122_fmt.jpeg)\n10.\
  \ 设置应用的分类。\n应用程序类型的选项包括商务、漫画、通信、教育等许多其他。游戏类型的选项包括街机与动作、益智与益谜、卡牌与赌场等。\n11. 滚动到 `Publishing\
  \ Options`（发布选项）部分（参考图 1-23），选择你的 `Copy Protection`（复制保护）选项。\n我总是选择关闭。当你选择开启时，设备上的上的文件占用空间通常会翻倍。如果你的应用是\
  \ 2MB，开启复制保护后安装在设备上的文件占用空间约为 4MB。我将文件保持在最低设置上。\n\n\n\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 在 Android 2.2 之前的旧设备无法将应用程序安装到 SD 卡上。因此，内部空间有限，当用户空间耗尽时，他们倾向于首先卸载占用空间最大的应用以释放最多空间。如果你的应用非常庞大，它可能会为了节省空间而被删除。保持文件较小并将复制保护设置为\
  \ `Off`（关闭），可以让你避免成为这一问题的眼中。\n\n12. 选择应用程序需要可见的位置列表。\n\n例如，如果你的应用程序是一个意大利应用，请取消选择\
  \ `All Locations`（所有位置）并选择 `Italy`（意大利）作为目标位置。这确保了只有 `Italy` 地区的设备才能在市场中看到它。如果你仍然启用\
  \ `All Locations`，你猜得没错——所有地区都能在市场上看到你的应用。\n\n**图 1-23：** 上传页的发布选项（Publishing Options）部分。\n\
  \n![9781118027707-fg050123.tif](img/9781118027707-fg050123_fmt.jpeg)\n\n13.向下滚动页面到\
  \ `Contact Information`（联系信息）部分（见图 1-24），并填写 `Web Site`（网站）和 `Email`（电子邮件）字段（如果需要，还可以填写\
  \ `Phone`）。\n\n我从不填写 `Phone` 字段，因为嗯，用户会给你打电话！是的，他们会在午夜打电话给你提问、提供反馈等等。我更喜欢通过电子邮件与客户沟通。如果你正在为另一公司编写应用但在自己的开发者账户下发布，你可以更改\
  \ `Web Site`、`Email` 和 `Phone` 字段，这样用户就不会联系你了。用户出于各种原因联系你。我收到的最常见的邮件是应用功能请求和错误报告。\n\
  \n14. 通过勾选相关的复选框，验证你的应用程序符合 Android 内容指南，并且遵守了相关法律。\n\n15. 选择以下选项之一：\n\n*   `Publish`（发布）：保存并实时将应用发布到市场。\n\
  *   `Save`（保存）：保存所做的更改但不发布应用。\n*   `Delete`（删除）：删除目前为止的所有工作。不要这样做。\n\n你可以在当前页的最顶部或最底部找到这些按钮。（两个地方都看看。这些按钮是移动目标。）\n\
  \n对于本次练习，点击 `Save` 按钮。这会保存你的应用程序并返回到 Android 开发者主页，那里有一个图标显示应用处于已保存状态。（见图 1-25。）你可以将其作为暂存区域，直到你准备好发布应用。\n\
  \n**图 1-24：** 上传页的联系信息（Contact Information）和同意（Consent）部分。\n\n![9781118027707-fg050124.tif](img/9781118027707-fg050124_fmt.jpeg)\n\
  \n**图 1-25：** Android 开发者主页上已保存的应用。\n\n![9781118027707-fg050125.tif](img/9781118027707-fg050125_fmt.jpeg)\n\
  \n16. 当你准备好发布应用时，在 Android 开发者主页上选择应用标题。\n\n“上传应用程序”（Upload an Application）页面将打开。（参考图\
  \ 1-21。）在此页面上，你的部分应用信息已经填写完毕。\n\n17. 滚动到页面底部，点击 `Publish` 按钮。\n\n这会将你的应用程序发布到 Android\
  \ 市场。\n\n你可能注意到了 Android 处理应用上传的一个额外好处：没有应用审核流程！亚马逊的 Android Appstore 有审核流程。而苹果的\
  \ App Store 有极其严格的筛选流程，并且每年需要支付 99 美元的费用。\n\n但通过 Android 市场，你可以现在就创建并发布应用，然后用户就可以立即安装。这意味着你可以进行快速的发布周期，并在完成开发后尽可能快地推出新功能，这非常酷。\n\
  \n顺便说一下，如果你在 Android 市场中搜索本节的应用，你是找不到它的。我发布了该应用然后将其从市场移除。要移除应用，我在 Android 开发者主页上选择了应用标题，滚动到底部并点击了\
  \ `Unpublish`（取消发布）按钮。再见，应用！\n\n### 观察下载量飙升\n\n你终于发布了自己的第一个应用程序。是时候看着数百万下载开始涌入了，对吧？嗯，某种程度上是。你可能是一个正在发布下一款顶级第一人称射击游戏的独立开发者，也可能是一个正在推出公司\
  \ Android 应用的企业开发者。无论如何，你都需要意识到各种设备上的终端用户体验。你有多种方法来识别你的应用运行情况：\n\n*   五星级评分系统：平均分越高越好。\n\
  *   评论：读读它们！人们花时间留评，所以请给予他们阅读评论的礼貌。你会对人们免费为你提供的绝佳主意感到惊讶的。大多数时候，我发现如果我实现了请求最频繁的功能，用户会对此感到兴奋，并回来更新他们的评论，给出更积极的评分好评。\n\
  *   错误报告：足够慷慨提交错误报告的用户是想让你知道应用由于未知原因发生了运行时异常。打开这些报告，查看错误，检查堆栈跟踪（stack trace），并尝试修复它。\n\
  *   安装量与活跃量：虽然这不是衡量用户满意度的最佳指标，但它是科学科学的方法，判断安装你应用的用户是否倾向于将其保留在手机中。\n*   直接电子邮件：用户会返回市场寻找你的电子邮件地址和或网站地址。他们会发邮件给你询问有关功能的问题，并就他们的体验给你提供反馈。他们可能还会向你提供改进应用的想法，或者要求你创建另一个他们在市场上找不到的某些功能的应用。\n\
  \n\n\n\n\n为亚马逊商店开发应用比为 Google Android 市场开发要贵一点。要向 Amazon Appstore 提交应用，你需要支付 99\
  \ 美元。当然，如果你有一个很棒的应用创意，并且打算认真营销它，那么这 99 美元的入场费是完全值得的。\n\n所以拿起你的信用卡，按照以下步骤操作：\n\n\
  1. 访问 [`https://developer.amazon.com/welcome.html`](https://developer.amazon.com/welcome.html)。\n\
  一个友好的页面邀请你点击 `Get Started` 按钮。\n\n2. 继续，点击该按钮。\n这将带进入登录页面。（参见图 2-1。）\n\n3. 使用你的电子邮件地址和密码登录，然后点击\
  \ `Sign In Using Our Secure Server` 按钮。\n会出现一个提交联系信息的页面——你的姓名、地址、电话等。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ 不言而喻，如果你没有 Amazon 密码（尽管这不太可能），你需要在向 Amazon 注册以获取一个密码，才能向 Amazon Appstore 提交应用。\n\
  \n4. 填写你的联系信息，然后点击 `Save`。\n接下来是开发者许可协议页面。\n\n5. 如果你有意向，请接受协议。\n与 Google Android\
  \ 市场一样，Amazon Appstore 对你的应用每笔销售收取 30% 的佣金。\n与 Google Android 市场不同，亚马逊的开发者注册表单询问你是否打算对应用收费。（你的答案没有约束力，因为上传单个应用的表单有其自己的免费与付费入口。）\n\
  \n6. 在注册表单末尾，点击 `Save`。\n你准备好开始上传应用了。\n\n**图 2-1：** 使用你的常规 Amazon 密码登录。\n\n![9781118027707-fg050201.tif](img/9781118027707-fg050201_fmt.jpeg)\n\
  \n## 在哪里发布？\n\n当你读到这本书时，可能已经有了其他的知名 Android 应用商店。即使现在，当我于 2011 年写这些文字时，也有几个网站看起来像是替代性的应用商店。其中一些仅仅是对应用进行广告和评分，然后链接到\
  \ Google Android 市场进行实际下载。作为开发者，你最大的关注的是让你的应用在这些网站上可见。\n\n一些硬件厂商有自己的专属应用商店。例如，三星产品的所有者可以访问\
  \ Samsung Apps ([`samsungapps.com``](http://samsungapps.com/))。旧版 Archos 产品的用户无法访问\
  \ Google Android 市场，但他们可以从 AppsLib ([`appslib.com``](http://appslib.com/)) 下载应用。\n\
  \n一些老牌网站最初是托管 PDA 应用的——个人数字助手，如 Palm 和 iPAQ。随着智能手机和平板电脑的兴起，这些网站现在分发 Android 应用。此类类的网站包括\
  \ Handango、PocketGear.com、GetJar.com 等。\n\n此外，大多数手机运营商允许用户从任何网站安装应用。（移动设备的网页浏览器访问普通网页；网页上的链接直接指向一个\
  \ `APK` 文件。）但现如今，普通消费者（John Q. Consumer）倾向于不信任那些并非来自知名应用商店的应用，因此这种自发布模式并没有很大的前景。\n\
  \n## 上传应用\n\n上传应用从一个 URL 开始。要开始上传应用：\n\n1. 在 [`https://developer.amazon.com/application/info.html`](https://developer.amazon.com/application/info.html)\
  \ 登录。\n登录后，你会看到一个如图 2-2 所示的表单。\n\n2. 填写表单字段——包括 `Supported Languages` 字段——然后点击 `Save`。\n\
  在图 2-2 的表单中，`Application SKU` 字段用于你的产品编号，无论那是什么。如果你销售了足够不同的应用或其他物品，需要你自己的产品编号，那太棒了！（你可以付得起这本书的零售价的，所以我希望你已经买了！）\n\
  接下来是表单的营销部分（Merchandizing）（参见图 2-3。）\n\n3. 输入关于类别、价格、日期和其他所有信息；然后点击 `Save`。\n\n\
  **图 2-2：** 关于你的应用的通用信息。\n\n![9781118027707-fg050202.tif](img/9781118027707-fg050202_fmt.jpeg)\n\
  \n**图 2-3：** 关于你的应用的营销信息。\n\n![9781118027707-fg050203.tif](img/9781118027707-fg050203_fmt.jpeg)\n\
  \n图 2-3 展示了来自亚马逊开发者页面的一些重要的营销建议。在我图 2-3 的初稿中，描述字段只包含一句话：`This app helps Android\
  \ developers learn about intents and intent filters.` 多大的错误啊！幸运的是，编写亚马逊帮助页面的人查看了他们的水晶球，预先知道我会写一个以\
  \ `This app` 开头的单句描述。帮助页面明确建议不要使用 `This app` 这个词，也不要使用单句描述。这就像帮助页面在说：“事实，我们知道你在营销上很偷懒，虚假广告无法隐瞒多久。”\n\
  \n根据你的文化取向，如图 2-4 所示的表单要么是耻辱也是荣誉。\n\n4. 在表单的下拉框中进行选择，然后点击 `Save`。\n接下来的页面要求图标和截图。（参见图\
  \ 2-5。）\n\n5. 上传图标、截图和其他多媒体；然后点击 `Save`。\n我不是艺术类型的。所以对我来说，图 2-5 是最具挑战性的。但在征服了艺术世界后，我终于准备好上传我的应用。出现了\
  \ `Upload Binary` 页面（参见图 2-6）。\n\n6. 你可以对你的应用应用数字权限管理（DRM），如图 2-6 所示。\n\n就像亚马逊 Kindle\
  \ 书的 `DRM` 一样，应用商店按设备授权运行应用。就像任何其他管理用户权限的方案一样，应用商店的 `DRM` 在博客和论坛上引发了巨大的争议。\n\n**图\
  \ 2-4：** 描述你的应用。\n\n![9781118027707-fg050204.tif](img/9781118027707-fg050204_fmt.jpeg)\n\
  \n**图 2-5：** 多媒体页面。\n\n![9781118027707-fg050205.tif](img/9781118027707-fg050205_fmt.jpeg)\n\
  \n**图 2-6：** 上传 APK 文件。\n\n![9781118027707-fg050206.tif](img/9781118027707-fg050206_fmt.jpeg)\n\
  \n亚马逊没有发布关于其 `DRM` 工作原理的信息。但如果你点击图 2-6 中的 `Why?` 链接，你会看到以下提示：“如果没有 DRM，你的应用可以无限制地使用。”因此当你发布付费应用时，`DRM`\
  \ 是唯一选择。\n\n7. 点击 `Choose File` 按钮选择你的应用 `APK` 文件，然后点击 `Upload File` 按钮。\n8. 点击\
  \ `Done` 按钮移动到下一页。\n\n下一页的问题比看起来要重要。（参见图 2-7。）\n\n9. 经过深思熟虑和多次重写后，填写图 2-7 中的大文本区域。\n\
  \n\n\n\n\n**图 2-7：**帮助亚马逊的人员测试你的应用程序。\n\n![9781118027707-fg050207.tif](img/9781118027707-fg050207_fmt.jpeg)\n\
  \n此外，应用程序必须符合亚马逊的非技术规范。这些包括图像的清晰度、你使用图像的权利、是否包含应用内广告、应用程序对各种观众的适用性以及其他事项。（再次，访问\
  \ [`https://developer.amazon.com/help/faq.html`](https://developer.amazon.com/help/faq.html)。）\n\
  \n想象一下，你正在亚马逊工作。你通常很喜欢测试开发者提交的应用程序，但今天你心情有些不佳。你评估的所有应用程序开始看起来大同小异。而且，办公室的咖啡机坏了！\n\
  \n这时，一个开发者提交了一个应用程序。这个程序看起来不错，但它被标记为一个更新版本。作为一名测试人员，你希望关注应用程序的新功能，而对旧版本的功能关注得少一点。（是的，你想确保新功能不会破坏任何旧功能，但那种测试需要特定的心态。）\n\
  \n问题是，开发者在图 2-7 的 `Release Notes`（发布说明）部分写得不够详细。如果不调出该应用程序的旧版本，你就无法区分新版本的功能和旧版本的功能。也许新版本看起来和旧版本一样，而新功能隐藏在后台。最好的情况下，你必须找出一个旧版本，并将其与新提交的应用程序进行比较。最坏的情况下，你必须进行一些逆向工程来弄清楚从一个版本到另一个版本发生了什么。\n\
  \n但记住……办公室的咖啡机今天坏了。这就决定了。这个应用程序被拒绝了。\n\n同样的想法也适用于图 2-7 中的 `Testing Instructions`（测试说明）部分。作为应用程序的开发者，你非常清楚地知道应用程序的需求以及你在创建应用程序时所有的假设。但测试你应用程序的人对这些一无所知。如果缺少一个简单的测试前提条件导致你的应用程序从一个救命的工具变成了无用的千字节浪费，你必须在\
  \ `Testing Instructions` 字段中清楚地描述该前提条件。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 额外的广告、良好的营销和实用的功能决定了 1,000,000 次下载与 1,000 次下载的区别。但审批过程中的障碍或不便，决定了有下载和无下载的区别。\n\
  \n10. 当你添加了所有必要信息后，点击页面底部的 `Save`（保存）。\n\n从那时起，就轮亚马逊了。你可以通过访问 `Developer Portal`（开发者门户）并检查门户的\
  \ `Dashboard`（仪表板）来查看应用程序审批的状态。（访问 [`https://developer.amazon.com/home.html`](https://developer.amazon.com/home.html)。）如果在测试过程中出现任何问题，亚马逊会给你发送电子邮件。当你的应用程序通过时，你也会收到电子邮件。\n\
  \n# 第六卷\n\n## 替代 Android 开发技术\n\n![9781118027707-pp0601.tif](img/9781118027707-pp0601_fmt.jpeg)\n\
  \n## 内容摘要\n\n### 第一章：使用 App Inventor 快速创建代码\n* 入门 App Inventor\n* 创建项目\n* 使用设计器\n\
  * 使用积块编辑器\n\n### 第二章：更多 App Inventor 魔法\n* 拍摄照片\n* 发送短信\n* 远游东方\n* 动画！\n* 使用数据库\n\
  * 启动另一个 Android 应用程序\n\n### 第三章：如何在没有 Eclipse 的情况下“艰难生存”\n* 准备工作\n* 认识 Apache Ant\n\
  * 为文本开发做准备\n* 使用 Ant 进行 Android 开发\n* 使用操作系统命令进行 Android 开发\n\n### 第四章：原生开发\n* 原生开发包\
  \ (NDK)\n* 创建应用程序\n\n# 第一章：使用 App Inventor 快速创建代码\n\n## 本章\n\n* ![check.png](img/check.png)\
  \ 设计用户界面\n* ![check.png](img/check.png) 使用视觉工具构建程序逻辑\n* ![check.png](img/check.png)\
  \ 无需输入代码即可创建 Android 应用程序\n\n生活是一长期的权衡过程。你喜欢吃甜腻的大甜点，但甜点并不健康。你喜欢在乐队里演奏，但大多数乐队成员无法获得体面的收入。你天生具有每天睡\
  \ 10 或 12 小时的能力，但由于浪费了这些时间，你在编写《Android 应用开发全解（傻呆版）》时进度落后了。\n\n情况就是如此。应用程序开发也涉及权衡。为了充分利用\
  \ Android 功能集的丰富性，你将使用 `Eclipse` 和 `Android API` 编写 `Java` 代码。但如果你可以放弃 Android 一些花哨的功能，就可以使用\
  \ Google 的 `App Inventor` 来节省精力和。\n\nApp Inventor 就是我在第一段中描述的“GUI 甜点”。App Inventor\
  \ 使用拖放范式来处理视觉界面和应用程序逻辑，让 Android 开发变得简单。使用 App Inventor 时，你无法像使用 `Java` 代码那样精细地调整你的工作。你无法让你的应用程序执行某些\
  \ Android 程序能执行的更复杂的事情。但 App Inventor 隐藏了许多涉及开发的杂乱技术细节。对于快速、简单地开发应用程序，请尝试一下 App\
  \ Inventor。（事实上，对于开发非基础应用程序，App Inventor 值得一看。）\n\n## 入门 App Inventor\n\n要开始你的 App\
  \ Inventor 之之旅，请执行以下操作：\n\n1. 访问 [`http://java.com`](http://java.com)。\n\n在访问期间，你可以检查你的电脑是否有\
  \ Java 运行时环境 (`JRE`)。使用 App Inventor 不需要完整的 Java 开发包 (`JDK`)。但你需要 Java 运行时环境 (`JRE`)。\n\
  \n如果你已经按照第一卷第二章的步骤操作，你的电脑已有 `JRE`。或者由于某种原因你知道你的电脑有 `JRE`，你可以跳过此步直接进入第 4 步。\n\n2.\
  \ 在 Java 网站上检查是否安装了 Java。\n\n网站的术语与官方术语不同。网站提供检查你的电脑是否有“Java”。准确来说，它检查的是你的电脑是否有\
  \ Java 运行时环境 (`JRE`) 以及你的浏览器是否启用了 `JRE`。\n\n大多数电脑都预装了 `JRE`。因此，如果你运行该“我的电脑有 Java\
  \ 吗？”测试，如果 Java 网页响应“Java 不工作”的消息，请确保你的浏览器已启用 `JRE`。\n\n3. 按照 [`http://java.com`](http://java.com)\
  \ 的说明在电脑上安装 Java。\n\n如果你的电脑没有 Java，或者你不想折腾浏览器设置，或者你可能已经有了 Java 但你不在意重新安装，请执行此操作。\n\
  \n\n\n\n在 Windows 中，安装程序会将自身安装在 `c:\\Program Files\\AppInventor` 目录（在 64 位系统上则在\
  \ `C:\\Program Files (x86)\\AppInventor` 目录）。在 Mac 上，安装程序妥妥地存放在 `/Applications/Appinventor`\
  \ 文件夹。在 Linux 中，安装程序通常嵌套在 `/usr/google/appinventor` 目录。\n\n# App Inventor 是什么东西？\n\
  \nApp Inventor 实际上由三部分组成：设计器（Designer）、积木编辑器（Blocks Editor）以及一些安装程序：\n\n![check.png](img/check.png)\
  \ 通过**设计器**，你可以指定 Android 应用用户界面的外观。\n\n![check.png](img/check.png) 通过**积木编辑器**，你可以开发\
  \ Android 应用的行为。（当用户点击那个按钮时，这个文本框中会发生什么。）\n\n设计器和积木编辑器程序都运行在网络上。你每次使用 App Inventor\
  \ 时，都会从 Google 服务器下载这些程序的代码到你电脑的硬盘上。当你运行这些程序时，程序会频繁与 Google 服务器进行通信。\n\n![check.png](img/check.png)\
  \ 安装程序本地存储在你电脑的硬盘上。这部分代码包含了一些 Android 软件开发包（SDK）工具和一个 Android 设备模拟器。\n\n设计器运行在 浏览器中，而积木编辑器运行在\
  \ Java Web Start 窗口中。Java Web Start 窗口就像在 浏览器之外运行的 Java Applet。积木编辑器的运行非常像运行在桌面上的任何普通程序。但与大多数其他程序不同，你每次使用\
  \ App Inventor 时都会重新下载积木编辑器的代码。\n\n当你下载 App Inventor 的安装程序时，你下载并安装了一小部分 Android\
  \ SDK、一个模拟器以及其他几个小工具。但你最经常看到的 App Inventor 部分（设计器和积木编辑器）运行在 Google 的服务器上，而不是你电脑的硬盘上。\n\
  \n（附言：等你读到这本书时，已经有人会向我解释，为什么 Google 的人们要把 App Inventor 分为基于浏览器的部分和 Java Web Start\
  \ 部分了。当我发现原因时，可能会为自己没有早点发现而感到尴尬。）\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg)\
  \ 一切都在变化。或者正如法国人所说：“变化越多，巴里书里的东西就越过时。”我推测 Google 的 App Inventor 在本书出版期间会快速变化，所以不要把本章的指令视为金科律。Google\
  \ 的软件人员从零开始设计 App Inventor，使其既友好又直观。因此，如果我的指令与你在电脑屏幕上看到的并不完全匹配，请自己多找找看。如果你真的卡住了，请给我发邮件。（我的邮箱地址在本书的引言中。）\n\
  \n### 创建项目\n\n按照以下步骤创建并测试一个空骨架的 App Inventor 项目：\n\n1. 访问 [`www.appinventorbeta.com`](http://www.appinventorbeta.com/)。\n\
  \n访问该网站会带你进入多个可能的网页之一。你看到的页面取决于你之前已经做过多少 App Inventor 的工作。如果你已经下载并安装了 App Inventor，该网站将带你进入\
  \ App Inventor 的项目页面（Projects page）或设计页面（Designer page）。\n\n项目页面列出了你创建的项目。（见图 1-1。）\n\
  \n设计页面是进入 App Inventor 设计器程序的主界面。在设计页面上，你可以布局 Android 应用的屏幕，将组件拖拽到应用屏幕上，并设置组件的属性。（见图\
  \ 1-2。）\n\n你可以在项目页面和设计页面之间切换。当你处于项目页面时，点击主工具栏上的 `New` 按钮（创建新项目）将带你进入设计页面。或者，你可以选择一个现有项目的项目名称。\n\
  \n**图 1-1：** 项目页面。\n\n![9781118027707-fg060101.tif](img/9781118027707-fg060101_fmt.jpeg)\n\
  \n**图 1-2：** 设计页面。\n\n![9781118027707-fg060102.tif](img/9781118027707-fg060102_fmt.jpeg)\n\
  \n当你处于设计页面时，点击 `My Projects` 链接返回项目页面。\n\n记住：拉夫·劳伦（Ralph Lauren）或克里斯蒂安·迪尔（Christian\
  \ Dior）与 App Inventor 的设计页面没有任何关系。\n\n2. 如果你不在项目页面，点击 `My Projects` 链接进入项目页面。\n\n\
  在图 1-2 中，`My Projects` 链接位于页面的右上方。\n\n3. 在项目页面上，点击 `New` 按钮。\n\n打开“New App Inventor\
  \ for Android Project”对话框。\n\n4. 输入项目名称，并点击 `OK`。\n\n打开设计页面。（见图 1-2。）\n\n此时，App\
  \ Inventor 创建了一个骨架阶段的 Android 项目。你可以通过运行这个项目来做一个快速的现实检查。\n\n5. 在设计页面上，点击右上角的 `Open\
  \ the Blocks Editor` 按钮（见图 1-2）。\n\n点击 `Open the Blocks Editor` 按钮后，你的电脑将从 Google\
  \ 服务器下载并启动积木编辑器程序。\n\n积木编辑器屏幕包含许多小玩意，但对于本节来说，你可以忽略顶部的两个按钮以外的所有内容。（见图 1-3。）\n\n6.\
  \ 点击 `New` 按钮。（见图 1-3 顶部。）\n\n点击 `New Emulator` 会启动虚拟设备。\n\n7. 等待模拟器的启动界面出现。\n\n\
  ![remember.eps](img/remember.jpeg) 启动 Android 模拟器需要圣人的耐心。（在我的 2GHz Intel Core 2\
  \ 上启动需要几分钟。）有时在启动过程中模拟器会卡住，你需要关闭它并重试。但在完全启动后，它通常可靠的。\n\n8. 在模拟器屏幕上，执行你通常解锁手机或平板电脑的操作。\n\
  \n用鼠标从屏幕的一处移动到另一处。\n\n9. 在积木编辑器中，点击 `Connect to Device` 按钮。（再次见图 1-3 顶部。）\n\n出现运行设备列表。（见图\
  \ 1-4。）\n\n10. 从下拉列表中选择一个设备。\n\n在图 1-4 中，运行设备只有模拟器。\n\n11. 等待你的 Android 应用出现在模拟器屏幕上。\n\
  \nApp Inventor 的骨架应用平淡到了极点。模拟器屏幕上唯一的项目是状态栏和标题栏。（见图 1-5。）\n\n## 5554 这个数字有什么特别？\n\
  \n当你启动 Android 设备模拟器时，新模拟器的名称类似于 `emulator-5554` 或 `emulator-5556`。这个名字源于每次运行 Android\
  \ 模拟器都会使用两个端口号（与开发电脑通信的两个通道）。正如你可能已经知道的，你的浏览器通常使用端口号 `80` 来请求网页。你的电子邮件程序可能使用端口 `110`、`143`、`585`、`993`\
  \ 或 `995` 来检索电子邮件。\n\n\n\n当你在开发计算机上启动模拟器时，可以为模拟器的几项网络需求指定多个端口号。但在本书的大多数示例中，你启动模拟器时并不会显式地指定端口号。当你不指定端口号时，模拟器将依赖于默认值。如果你指定了除默认值以外的端口号，是因为你不希望模拟器的通信与另一个程序对某个特定端口号的使用发生冲突。谁知道呢？也许你最喜欢的电脑游戏通过端口\
  \ `5228` 与网络进行通信，而这正是 Android 用于从 Android Market 获取应用的端口号。\n\n现在，假设你的开发计算机上没有运行任何模拟器，并且你在没有指定任何端口号的情况下启动了一个模拟器。那么新的模拟器将使用两个默认端口号——`5554`\
  \ 和 `5555`。\n\n![check.png](img/check.png) 模拟器使用端口 `5554` 来中继控制台消息（显示在 `Eclipse`\
  \ 控制台视图中的文本）。\n\n![check.png](img/check.png) 模拟器使用端口 `5555` 与 Android 调试桥接 (`adb`)\
  \ 通信。例如，当你开发计算机的命令行窗口中输入 `adb install myApp.apk` 时，Android 调试桥使用端口 `5555` 处理通信并将\
  \ `myApp.apk` 安装到你运行的模拟器上。\n\n如果你在开发计算机的命令行窗口中输入命令 `adb devices`，你会看到正在运行的模拟器列表。（该列表还包括通过\
  \ USB 或或其他特殊连接到计算机的任何实际设备。）列表可能包含 `emulator-5554`，因为 `5554` 是默认控制台端口号，而模拟器的名称源自模拟器的控制台端口号（而不是模拟器的\
  \ `adb` 端口号，在本例中该 `adb` 端口是 `5555`）。\n\n现在该加大难度了。假设在 `emulator-5554` 运行的同时，你回到开发计算机并启动第二个模拟器（同样没有显式地指定任何端口号）。这时\
  \ Android 会启动一个控制台端口为 `5556`、`adb` 端口为 `5557` 的新模拟器。`adb` 端口号总是比控制台端口大一。要在两个运行的模拟器中的第二个上安装\
  \ `myApp.apk`，你需要在开发计算机的命令行窗口中输入 `adb -s emulator-5556 install myApp.apk`。如果你关闭第一个模拟器，第二个模拟器的端口号不会改变。因此，在关闭两个模拟器中的第一个后，当你输入\
  \ `adb devices` 时，设备列表将包含 `emulator-5556` 而不再包含 `emulator-5554`。\n\nAndroid 模拟器允许的控制台端口号是从\
  \ `5554` 到 `5584` 的偶数。因此，你可以同时运行名为 `emulator-5554`、`emulator-5556`、`emulator-5558`\
  \ 等直到 `emulator-5584` 的模拟器。我从未尝试过同时运行超过 16 个模拟器，但我确定如果我尝试了的话，绝不会有好的结果。\n\n**图 1-5：**\
  \ 模拟器运行着你空的 App Inventor 项目。\n\n![9781118027707-fg060105.tif](img/9781118027707-fg060105_fmt.jpeg)\n\
  \n确实，这一节的 Android 应用枯燥得像土一样。但不要因为沮丧而合上笔记本的盖子！在执行下一节的指令时，请保持一切运行。\n\n## 使用设计器 (Designer)\n\
  \n设计器由五个主面板加上一些额外的菜单和按钮组成。自然地，每个主面板都有特定的用途。（要查看每个面板，请参考图 1-2。）这五个主面板如下：\n\n- **设计器（Designer）**\
  \ 调板包含供你拖入 Android 应用程序屏幕的项。设计器调板中的项被称为“组件（components）”。某些组件是可见的小东西（Android 视图等），但其他组件（例如\
  \ `LocationSensor`）是功能性的而非可见的。\n- **设计器（Designer）** 查看器是你的目标设备屏幕的预览。你将组件从设计器调板拖入到设计器查看器中。\n\
  - **组件（Components）** 树对于你拖入设计器查看器的每一个组件都都有一个分支。设计器查看器和组件树中的选择是保持同步的。也就是说，当你在设计器查看器中选择一个组件时，App\
  \ Inventor 会自动选择组件树中对应的分支。当你选择组件树中的一个分支时，App Inventor 会自动选择设计器查看器中对应的组件。\n\n组件树面板的底部有用于重命名和删除树中组件的按钮。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 如果你正在进行一个严肃的项目（而不是在本书的指令中胡胡乱闹），请重命名你拖入设计器查看器的每一个组件。如果你不进行任何重命名，App\
  \ Inventor 会为你的组件分配默认名称——如 `Button1`、`Button2` 等名称。稍后当你在块编辑器（Blocks Editor）中处理这些带有随机命名的组件时，你会在记住每个组件的作用方面方面遇到困难。\n\
  \n- **媒体（Media）** 面板显示你添加到项目中的任何图像或其他媒体。在图 1-2 中，媒体面板静静地位于组件树下方。\n- **属性（Properties）**\
  \ 表格列出了你在设计器查看器或组件树中选择的任何组件的属性。你可以使用属性表中的文本字段、下拉列表和其他工具来设置组件的属性。\n\n## 向项目添加组件\n\
  \n在设计器、块编辑器和模拟器运行的同时，尝试以下操作：\n\n1. 设计器调板中的组件被分为不同的类别，请找到基础（Basic）类别。参考图 1-2。基础类别位于图片的左上部分。\n\
  2. 在基础类别中，找到我喜欢的组件——`Button`。\n3. 将 `Button` 组件从设计器调板拖到设计器查看器。\n\n结果如图 1-6 所示。现在的乐趣开始了！\n\
  \n**图 1-6：** 查看器中的新 Button 组件。\n\n![9781118027707-fg060106.tif](img/9781118027707-fg060106_fmt.jpeg)\n\
  \n4. 回到你在第 6 节中启动的模拟器。\n\n看！模拟器显示了你修改后的 Android 应用——一个带有按钮的应用（见图 1-7）。\n\n在“创建项目”第\
  \ 9 节中，你建立了 App Inventor 与模拟器之间的连接。之后，当你在设计器查看器中添加按钮时，模拟器的屏幕会自动变化。你不需要重新加载修改后的项目到模拟器上。App\
  \ Inventor 会为你加载。嘿！当你连接 App Inventor 到设备时，你真的连接了设备！\n\n### 创建检查点 (checkpoint)\n\n\
  设计器没有撤销（Undo）功能。相反，你可以创建检查点。当你创建一个检查点时，你就创建一个包含自上次保存、另存为或检查点操作以来的所有更改的项目。创建检查点后，设计器继续显示创建检查点之前显示的项目。\n\
  \n检查点按钮出现在设计器页查看器的上方。（见图 1-2。）点击此按钮打开检查点对话框。\n\n6. 在检查点对话框中为你的检查点输入一个名称，然后点击确定。\n\
  \n\n\n\n• 当你点击 `Checkpoint` 时，你会创建一个新项目，其中包含自上一次 `Save`、`Save As` 或 `Checkpoint`\
  \ 操作以来你进行的所有更改。创建检查点后，`Designer` 将继续显示你在创建检查点之前所显示的任何项目。\n\n要撤销对项目所做的更改，请返回 `Projects`\
  \ 页面（通过点击 `Designer` 页面上的 `My Projects`）。在 `Projects` 页面的列表中，选择你之前创建的一个项目。（你是使用\
  \ `Designer` 的 `Save`、`Save As` 和 `Checkpoint` 按钮创建项目的。）\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 使用 App Inventor 时（就像你使用的任何其他工具一样），请经常保存你的工作。\n\n**图 1-7:** 模拟器与 `Designer` 中的更改保持同步。\n\
  \n![9781118027707-fg060107.tif](img/9781118027707-fg060107_fmt.jpeg)\n\n### 设置组件属性\n\
