  \        + \".html\");\n    return webView;\n  }\n}\n```\n\n此时，我可以描述这一节大示例的完整故故事板（storyboard）：\n\
  \n- 用户看到一个列表——即图 4-1 左侧 fragment 中的组件名称列表。\n 用户 用户选择列表中的一项。\n\n作为响应，应用程序会显示所选项的简要描述。在图\
  \ 4-1 中，该描述是 Android `BroadcastReceiver` 文档的前几句。\n\n为了显示该描述，列表 4-3 中的代码调用了 `replace(R.id.docs,\
  \ docsFragment)`。也就是说，代码将 fragment 放入了 `R.id.docs` view 中。\n\n\n\n\n\n当我创建列表 4-3\
  \ 中的第一个代码草稿时，我并没有包含任何关于 `getBackStackEntryCount` 或 `popBackStackImmediate` 的内容。“呼！我完事了！”我对自己说。但随后我测试了代码。我在测试中发现，用户的注意力会随着新列表项的选择而发生突然转移。\n\
  \n想象一下选择了 `BroadcastReceiver` 然后点击了“更多”按钮。在查看了图 4-2 中的 `BroadcastReceiver` 文档页面后，你将注意力转向左侧的组件列表。一旦你选择了一个不同的组件，你往往会忘记所有的广播接收器。因此，如果你点击返回按钮，你可能不想再翻找之前的选择了。换句话说，在组件列表中选择一个项代表了一个全新的开始。当你从组件列表中选择一个项时，应用程序应该清除之前创建的任何\
  \ fragment 栈。\n\n列表 4-3 中的 `for` 循环实现了预期的栈清理。该代码调用 fragment manager 的 `getBackStackEntryCount`\
  \ 方法来确定栈上有多少个 fragment。然后 `for` 循环使用条目计数来决定从栈中弹出多少个 fragment。当循环完成工作后，fragment 栈就空了，因此你可以安全地调用当前事务的\
  \ `addToBackStack` 方法。这种策略效果非常好。\n\n### 兼顾两者\n\n本章的节几节描述了一个使用 fragment 的应用程序。该程序运行得很好，但有一个微小的局限性。你不能让用户将平板电脑横放。如果平板设备处于竖屏模式，应用程序看起来会很傻。（是的，如果我把这个问题称为“微小的局限性”，那我一定是在讽刺。）\n\
  \n图 4-3 显示了在高度大于宽的显示器上的应用程序。你在左侧有大量的浪费空间，右侧没有空间显示页面标题（BroadcastReceiver）。\n\n**图\
  \ 4-3：** 屏幕方向非常重要！\n\n![9781118027707-fg040403.tif](img/9781118027707-fg040403_fmt.jpeg)\n\
  \n我是第一个承认这一点的人，书中其他示例从平平无奇到丑陋不等。但对于其他示例，问题在于我缺乏艺术天赋。在本章的示例中，问题出在代码上。“亲爱的布鲁塔，错误不在于我们的艺术，而在于我们的代码……”\n\
  \n为了纠图 4-3 中的视觉失误，你创建了一个额外的 activity。新的 `DocsActivityVerbose` activity 只有一个视图——即显示列表\
  \ 4-5 中网页 fragment 的视图。与图 4-3 中狭窄的 fragment 不同，新的 activity 占据了整个屏幕。（参见图 4-4。）你调整应用程序的其他代码，根据屏幕方向显示\
  \ `DocsFragmentVerbose` 或 `DocsActivityVerbose`。\n\n要使本章的应用程序能够同时适应竖屏和横屏模式，请遵循以下步骤：\n\
  \n1.  从列表 4-1 到 4-5 描述的项目开始。你可以从这本书的网站（`www.allmycode.com/android`）下载代码。\n\n**图\
