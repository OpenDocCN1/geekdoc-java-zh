  \n既然简单的 Devel 就能说明一切，为什么要给这个分支标记为 Development（开发）呢？\n\n9. 在 Devel 分支中，寻找 `make`\
  \ 项（见图 4-3）。\n\n在 `make` 项行的某处，你会看到 Skip（跳过）单词。\n\n10. 重复点击看到 Skip 的地方，直到看到版本号而不是\
  \ Skip。\n\n**图 4-3：** 安装 make 实用程序。\n\n![978111027707-fg060403.tif](img/9781118027707-fg060403_fmt.jpeg)\n\
  \n在图 4-3 中，我点击同一个位置，直到看到 `3.81-2` 而不是 Skip。当你点击该位置时，可能会看到 Source 而不是 Skip，或者可能会看到其他版本号。如果有不同的版本号供选择，选择最高的。（这是最安全的做法。）\n\
  \n11. 在 Select Packages 对话框的右下角，点击 Next。\n\n安装完成后，你就拥有了所需的所有 Cygwin 工具。\n\n### 为\
  \ Macintosh 获取 C 编译器\n\nMac 用户必须安装 Xcode 来编译 C 程序。此外，Mac 用户必须安装 Xcode 可选的 Unix 开发支持。\n\
  \n检查你是否已经拥有所需内容：\n\n1. 打开 Terminal（终端）窗口。\n\n你在 Mac 的 `Applications` 文件夹下的 `Utilities`\
  \ 子文件夹中找到 Terminal 应用。\n2. 在 Terminal 窗口中，输入 `make` 然后按 Return。\n\n计算机应该返回类似的内容：\n\
  \n```\n/usr/bin/make\n```\n\n如果你看到这个响应（或与其非常相似的行），说明你已经在 Mac 上安装了 `make`。（或者可能你在\
  \ `make` 上安装了 Mac！我不知道。）相反，如果计算机只返回另一个提示符，则你必须安装 `make`。\n\n在 Mac 上安装 `make` 的方法：\n\
  \n1. 定位到你的 Macintosh 安装。\n2. 访问 Finder 窗口。\n3. 在搜索框中输入 Xcode。\n4. 双击项目。\n5. 点击 Continue\
  \ 直到看到列表（见图 4-4）。\n\n**图 4-4：** Xcode 安装选项。\n\n![9781118027707-fg06404.tif](img/9781118027707-fg06404_fmt.jpeg)\n\
  \n6. 确保选中了 Unix Support 选项。\n7. 点击 Continue 继续安装。\n\n安装完成后，你就拥有了所需的工具。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ Eclipse 有一些非常好的插件可以帮助处理 C/++ 代码和 Android NDK。在本章中，我不介绍这些工具。（我不想让你为了半小时的应用经历两个小时的下载。）但如果你计划大量使用\
  \ Android NDK，请查看 Eclipse 的 CDT（C/++ 开发工具）。还要访问 Sequoyah 项目页面（[www.eclipse.org/sequah](http://www.eclipse.org/sequah)）。Sequoyah\
  \ 是一个帮助调试 Android 代码的工具集。\n\n## 创建应用程序\n\n启用 NDK 的应用程序与普通的应用程序几乎一样，但它不同！（开玩笑）。创建一个简单的启用\
  \ NDK 的应用程序如下：\n\n1. 使用 Eclipse 创建一个新的 Android 项目（见图 4-5）。\n\n你可以选择任何项目名称，但如果你想跟随示例中的步骤，请将项目命名为\
  \ `MyNDKProject`。此外，选择 Android 2.2 目标，应用名称 `My NDK App`，活动名称 `MyActivity`。对于包名，选择\
  \ `com.allmycode.examples.ndk`。\n\n书籍 I 和 II 包含了创建“普通”简单 Android 应用程序所需的所有。\n\n\
  **图 4-5：** 创建你的新项目。\n\n![978118027707-fg06405.tif](img/9781118027707-fg06405_fmt.jpeg)\n\
  \n2. 使用布局编辑器在 `main.xml`（主布局）中添加 EditText 视图。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg)\
  \ 关于添加 EditText 视图以及后续几个步骤的详细信息，请参见第二本书第 1 章和第三本书第 2 章。\n\n3. 使用布局编辑器在 `main.xml`（主布局）中添加一个按钮。\n\
  \n4. 为按钮的 Click 事件监听器分配一个名称。\n\n\n\n\n\n如果你正在家里跟着操作，我给按钮的点击事件监听器命名为 `onButtonClick`。也就是说，我使用属性（Properties）视图将按钮的\
  \ `onClick` 属性设置为 `onButtonClick`。\n\n### 5. 为你的 app activity 添加事件监听器代码。\n\n我不清楚你的\
  \ activity 如何，但我的 activity 包含以下监听器代码：\n\n```java\npublic void onButtonClick(View\
  \ v) {\n    Editable name = ((EditText) findViewById(R.id.editText1)).getText();\n\
  \    Toast.makeText(getApplication(), getString() + name,\n                    Toast.LENGTH_LONG).show();\n\
  }\n```\n\n![remember.eps](img/remember_fmt.jpeg) 这些监听器代码大部分是完全无害的。但请记住，代码中的名称必须与项目中的名称对应。例如，方法名（在我的示例中为\
  \ `onButtonClick`）必须与你在第 4 步中为按钮指定的 `onClick` 监听器名称相同。此外，ID `editText1` 必须与你在第 2\
  \ 步中创建的视图 ID 相同。\n\n监听器代码中唯一异常的地方是调用了一个名为 `getString` 的方法。你并不像声明大多数 Java 方法那样来声明\
  \ `getString`。\n\n### 6. 在你的 activity 类（第 1 步中命名为 `MyActivity`）添加以下代码：\n\n```java\n\
  public native String getString();\n\nstatic {\n    System.loadLibrary(\"my-jni-app\"\
  );\n}\n```\n\n无论是否使用 Android，Java 技术套件都带有一个 JNI —— Java 原生接口（Java Native Interface）框架。JNI\
  \ 的目的是帮助 Java 程序与用其他语言编写的代码进行通信。这一步的代码是 JNI 告诉你的程序：`getString` 方法体将是用 Java 以外的语言编写的。第一行\n\
  ```java\npublic native String getString();\n```\n告诉 Java 去其他地方寻找 `getString` 的体（在出现行所在的\
  \ Java 类之外）。代码的其余部分\n```java\nstatic {\n    System.loadLibrary(\"my-jni-app\");\n\
  }\n```\n告诉你的程序去名为 `my-jni-app` 的地方寻找方法体。你猜怎么着？本节的示例包含了一个名为 `my-jni-app.c` 的文件，其中\
  \ C 语言代码。\n\n列表 4-1 汇总了你 `MyActivity.java` 文件中的所有代码。\n\n### 列表 4-1：你的项目的主 Activity\n\
  \n```java\npackage com.allmycode.examples.ndk;\nimport android.app.Activity;\nimport\
  \ android.os.Bundle;\nimport android.text.Editable;\nimport android.view.View;\n\
  import android.widget.EditText;\nimport android.widget.Toast;\n\npublic class MyActivity\
  \ extends Activity {\n    /** 当 activity 首次创建时调用。 */\n    @Override\n    public\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.main);\n    }\n    public native String getString();\n\
  \    static {\n        System.loadLibrary(\"my-jni-app\");\n    }\n\n    public\
  \ void onButtonClick(View v) {\n        Editable name =\n            ((EditText)\
  \ findViewById(R.id.editText1)).getText();\n        Toast.makeText(getApplication(),\
  \ getString() + name,\n            Toast.LENGTH_LONG).show();\n    }\n}\n```\n\n\
  ### 7. 在 Eclipse 的 Package Explorer 树中，右键点击 `MyNDKProject` 分支并选择 New⇒Folder。（在 Mac\
  \ 上，使用 Control-click 代替右键。）\n\nEclipse 显示 New Folder 对话框。\n\n### 8. 在 New Folder\
  \ 对话框的 Folder Name 字段中输入 `jni`，然后点击 Finish。\n\nPackage Explorer 树有了一个名为 `jni` 的新分支。此时，检查\
  \ `jni` 文件夹的位置会有帮助。在图 4-6 中，`jni` 文件夹是 `MyNDKProject`（主项目文件夹）的直接子目录。`jni` 文件夹与 `res`、`assets`、`Android\
  \ 2.2` 等处于级。这个位置非常重要，因为如果位置错误，Java 将找不到你的代码。（而且，这很容易出错。）\n\n**图 4-6：`jni` 文件夹**\n\
  \n![9781180270406](img/9781180270406)\n\n### 9. 在 Eclipse 的 Package Explorer 树中，右键点击\
  \ `MyNDKProject` 分支并选择 New⇒Folder。\n\n### 10. 在 New Folder 对话框的 Folder Name 字段中输入\
  \ `jni`，然后点击 Finish。\n\n\n\n\n\n`jstring`\n\n`Java_com_allmycode_examples_ndk_MyActivity_getString`\n\
  \n```c\njstring\n(JNIEnv* env, jobject obj)\n{\n    return (*env)->NewStringUTF(env,\
  \ “Hello, “);\n}\n```\n\n如果你不是一名资深的 C 程序员，你可能会疑惑 `my-jni-app.c` 中的代码是什么意思。很好，你运气不错。那里有一个侧边栏可以解释！（该侧边栏的名称为“600\
  \ 字以内的 C 编程”。）\n\n在接下来的步骤中，你将从 Eclipse 切换到开发电脑的命令行窗口。\n\n## 600 字以内的 C 编程\n\n阅读这一章并不会让你成为一名\
  \ C 程序员，但你可能想了解一下列表 4-2 中 C 代码的一些信息。\n\n首先，C 代码通常不运行在虚拟机上。你将 C 程序编译成一个原生可执行文件——这是一种低级二进制文件，它仅运行在\
  \ Intel x86 处理器、ARM 处理器或其他类型的处理器上。由于缺乏虚拟机，C 语言更加依赖于特殊的二进制文件类型。当你完成本章步骤后，你不仅拥有第 14\
  \ 步中的 `.c` 文件，还有一个 `.o` 对象文件、一个 `.o.d` 文件以及一些 `.so` 库文件。\n\n我会因为尝试将列表 4-2 翻译成 Java\
  \ 而受到纯主义者的批评。尽管如此，你仍然可以使用我的伪 Java 代码来理解这个 C 程序：\n\n```java\n/*\n* 免责声明：\n* 这是对列表\
  \ 4-2 中 C\n* 程序的粗略翻译。这段代码\n* 说明了 my-jni-app.c \n* 含义。但这段 Java\n* 代码不能替换列表 4-2 中的\
  \ my-jni-app.c\n* 程序。\n*/\npackage com.allmycode.examples.ndk;\n\nimport java.lang.String;\n\
  import java.lang.Runtime;\n\npublic class MyActivity {\n    public String getString()\
  \ {\n        return “Hello, “;\n    }\n}\n```\n\n列表 4-2 中实际的 `my-jni-app.c` 程序定义了一个方法——方法\
  \ `Java_com_allmycode_examples_ndk_MyActivity_getString`。这个长方法名遵循 JNI 规则，以实现列表 4-1\
  \ 中的 `getString` 方法。列表 4-1 中的 `MyActivity` 类声明了一个原生方法，其全限定名为为 `com.allmycode.examples.ndk.MyActivity.getString`。为了形成列表\
  \ 4-2 中的 C 语言 JNI 名称，你将点替换为下划线，并在整个名称前加上 `Java_`。\n\nC 语言并不会把指针藏在毯子下。在 C 中，你使用星号和箭头来显式引用指针，并可以使用指针将对象传递给函数。例如，`JNIEnv`\
  \ 名称指向一个拥有约 200 个字段的类。每个 `JNIEnv` 字段都是指向函数的指针。当你调用列表 4-2 中的方法时，你传递了一个指向 `JNIEnv`\
  \ 对象的指针（也就是说，你传递了一个类型为 `JNIEnv*` 的内容）。参数 `env` 存储了该指向 `JNIEnv` 对象的指针（见附近的图形）。\n\n\
  在 C 程序中，当你输入 `env` 时，你正在对存储在 `env` 中的指针进行解引用。换句话说，`*env` 代表 `env` 所指向的任何对象。因此在列表\
  \ 4-2 中，`(*env)` 代表一个 `JNIEnv` 对象。\n\n在 C 中，像 `x->y` 这样的表达式是“x 对象的 y 字段所指向的内容”的简写。在列表\
  \ 4-2 中，文本 `(*env)-> NewStringUTF` 代表由 `*env` 的 `NewStringUTF` 字段指向的函数。换句话说，`(*env)->\
  \ NewStringUTF` 代表当前 JNI 环境版本的 `NewStringUTF` 函数。\n\n列表 4-2 中的 `return` 语句创建了一个新的\
  \ `java.lang.String` 对象（在 JNI C 程序中被称为 `jstring` 对象）。新的 `String` 对象成为 Java 调用环境的一部分，Java\
  \ 调用环境获取了返回值 `“Hello, “`。\n\n如果这还不够复杂，那么当你放弃纯粹的 C 语言而改用 C++ 编写原生代码时，整个过程的工作方式会有所不同。呼！\n\
