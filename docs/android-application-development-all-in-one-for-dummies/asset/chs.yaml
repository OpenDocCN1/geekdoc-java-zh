  \ 的公共类，该类的 Java 代码必须放在一个名为 `DogAndPony.java` 的文件中，拼写和大小写必须完全一致。\n\n如果你定义了一个名为 `DogAndPony`\
  \ 的公共类，该类的 Java 代码必须放在一个名为 `DogAndPony.java` 的文件中，拼写和大小写必须完全一致。\n\n\n\n\n\n## 引言\n\
  \n根据表格的列标题，每个账户都有一个名称、一个地址和一个余额。用面向对象编程的术语来重新表述，`Account` 类中的每个对象（即 `Account` 类的每个实例）都有一个名称、一个地址和一个余额。因此，表格的最后一行是一个名为\
  \ `Jane Dough` 的对象。该相同对象拥有地址 800 Rich Street，余额为 247.38。如果你开了一个新账户，你就会拥有另一个对象，表格会多出一行。新对象将是同一个\
  \ `Account` 类的实例。\n\n## Java 类型\n\n“六（six）”意味着什么？你可以有六个孩子，你也可以有六英尺高。有六个孩子时，你确切知道自己有多少孩子（与美国平均家庭不同，你不能有\
  \ 2.5 个孩子）。但如果你身高是 6 英尺，你实际上可能是 6 英尺半英寸高。或者你可能身高 5 英尺 11 分之三四英寸，没人会对此异。\n\n一个值的含义取决于该值的类型。如果你在\
  \ Java 程序中写：\n\n```java\nint numberOfChildren = 6;\n```\n\n`6` 意味着“精确的六”。但如果你在 Java\
  \ 程序中写：\n\n```java\ndouble height = 6;\n```\n\n`6` 意味着“在你关注的测量范围内尽可能接近六”。而且如果你在\
  \ Java 程序中写：\n\n```java\nchar keystroke = ‘6’;\n```\n\n`‘6’` 意味着“排在数字 `5` 之后的数字”。\n\
  \n在 Java 程序中，每个值都有一个类型。Java 有八种基本类型（语言内置的类型），并且可以根据你的需要创建任意数量的引用类型。\n\n表 2-2 列出了\
  \ Java 的八种基本类型。\n\n![Table 2-2 Java 的基本类型](img/9781118027707-bk02ch0202a.jpg)\n\n\
  ![Table 2-2 Java 的基本类型](img/9781118027707-bk02ch0202b.jpg)\n\n字面量（literal）是一个其值在不同\
  \ Java 程序之间不会改变的表达式。例如，表达式 `42` 在每个 Java 程序中都意味着“`int` 类型的值 42”。同样，表达式 `‘B’` 在每个\
  \ Java 程序中都意味着“罗马字母表中的第二个大写字母”，而单词 `true` 在每个 Java 程序中都意味着“`false` 的反面”。\n\n除了基本类型外，Java\
  \ 还有引用类型。列表 2-4 中的代码包含了三个引用类型的名称。\n\n- 引用类型 `android.app.Activity` 定义在 Android API（Android\
  \ 庞大的现成声明库）中。\n- 引用类型 `android.os.Bundle` 也定义在 Android API 中。\n- 引用类型 `MyActivity`\
  \ 定义在列表 2-4 中。\n\n怎么样？每个类都是一种类型！\n\n当你写 `int numberOfChildren = 6` 时，你声明了一个名为 `numberOfChildren`\
  \ 的变量的存在。变量 `numberOfChildren` 的类型是 `int`，初始值为 `6`。\n\n但在列表 2-4 中，`android.os.Bundle`\
  \ 也是一种类型（引用类型）。事实上，`android.os.Bundle` 是一个作为 Android API 部分声明的类的名称。因此，就像你可以在 Java\
  \ 程序中写 `int numberOfChildren` 一样，你也可以在列表 2-4 中写 `Bundle savedInstanceState`。（由于列表\
  \ 2-4 顶部的 `import` 声明，你可以将 `android.os.Bundle` 简化为简单的名称 `Bundle`。）\n\n因为每个类都是一种类型，而且你新声明的\
  \ `MyActivity` 类型是一个类，你可以将如下的行：\n\n```java\nMyActivity anActivity;\n```\n\n添加到列表\
  \ 2-4 的代码中。这一行声明了名称 `anActivity` 是值的占位符（类型为 `MyActivity` 的值）。如果这个想法让你感到困惑，列表 2-5\
  \ 提供了另一个示例。\n\n### 列表 2-5：类是一种类型\n\n```java\npublic class Account {\n    String\
  \ name;\n    String address;\n    double balance;\n}\n\nAccount myAccount = new\
  \ Account();\nAccount yourAccount = new Account();\n\nmyAccount.name\nyourAccount.name\n\
  myAccount.balance = 24.02;\n```\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg)\
  \ 列表 2-5 并不包含完整的 Java 程序。如果你尝试运行列表 2-5 中的代码（而不先向代码中添加其他内容），你会得到各种错误信息。\n\n列表 2-5\
