  \n14. 删除每个标签中的文本，只留下你的按钮文本。\n\n关于设置组件的 `text` 的帮助，请参见“设置组件属性”部分。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ App Inventor 处理字符串的方式与 Java 不同。在 App Inventor 中，记法 `“”` 并不代表空字符串。相反，`“”` 代表包含两个双引号的两个字符字符串。要在\
  \ App Inventor 的任一个标签组件中放入空字符串，请进入 `Properties` 节点并删除组件 `Text` 字段中的所有字符。\n\n在设计器查看器中，最终结果如图\
  \ 1-19 所示。你在模拟器中看到的（美观）显示效果如图 1-20 所示。\n\n**图 1-19：** 终于完成了！按钮居中了。\n\n![9781118027707-fg060119.tif](img/9781118027707-fg060119_fmt.jpeg)\n\
