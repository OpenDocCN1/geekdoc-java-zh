  \ == 2) {\n        String[] columnNames = { \"_id\", \"name\", \"amount\" };\n \
  \       String[] rowValues = { \"Table \", \"2\" };\n        MatrixCursor matrixCursor\
  \ = new MatrixCursor(columnNames);\n        matrixCursor.addRow(rowValues);\n  \
