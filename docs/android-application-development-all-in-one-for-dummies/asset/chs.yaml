  \n```\nINFO/Demo1Activity(4783): onSaveInstanceState\nINFO/Demo1Activity(4783):\
  \ onPause\nWARN/TranslucentActivity(4783): onCreate\nWARN/TranslucentActivity(4783):\
  \ onStart\nWARN/TranslucentActivity(4783): onResume\n```\n\n`Demo1Activity` 暂停了但没有停止。\n\
  \n### 从 activity 获取结果\n\n在本书前面的部分，我将 `intent` 类比为方法调用。启动一个 activity 时，你不是调用方法，而是触发一个\
  \ `intent`。到目前为止一切顺利。但 `intent` 的哪个功能可以替代方法调用的返回值？列表 10 和 11 给出了答案。\n\n### 列表 1-10：请求结果的\
  \ activity\n\n```java\npackage com.allmycode.results;\nimport android.app.Activity;\n\
  import android.content.Intent;\nimport android.os.Bundle;\nimport android.view.View;\n\
  import android.view.OnClickListener;\nimport android.widget.Button;\nimport android.widget.TextView;\n\
  \npublic class GetResultActivity extends Activity implements OnClickListener {\n\
  \    final int MY_REQUEST_CODE = 42;\n    TextView textView;\n    Button button;\n\
  \n    @Override\n    public void onCreate(Bundle savedInstanceState) {\n       \
  \ super.onCreate(savedInstanceState);\n        setContentView(R.layout.main);\n\
  \        textView = (TextView) findViewById(R.id.textView);\n        button = (Button)\
  \ findViewById(R.id.button1);\n        button.setOnClickListener(this);\n    }\n\
  \n    @Override\n    public void onClick(View v) {\n        Intent intent = new\
  \ Intent();\n        intent.setClassName(\"com.allmycode.results\", \"com.allmycode.results.GiveResultActivity\"\
  );\n        startActivityForResult(intent, MY_REQUEST_CODE);\n    }\n\n    @Override\n\
  \    protected void onActivityResult(int requestCode, int resultCode, Intent intent)\
  \ {\n        if (requestCode == MY_REQUEST_CODE && resultCode == RESULT_OK) {\n\
  \            textView.setText(intent.getStringExtra(\"text\"));\n        }\n   \
  \ }\n}\n```\n\n### 列表 1-11：提供结果的 activity\n\n```java\npackage com.allmycode.results;\n\
  import android.app.Activity;\nimport android.content.Intent;\nimport android.os.Bundle;\n\
  import android.view.KeyEvent;\nimport android.view.View;\nimport android.view.OnClickListener;\n\
  import android.view.OnKeyListener;\nimport android.widget.Button;\nimport android.widget.EditText;\n\
  \npublic class GiveResultActivity extends Activity implements OnKeyListener, OnClickListener\
  \ {\n    Button button;\n    EditText editText;\n    StringBuffer buffer = new StringBuffer();\n\
  \n    @Override\n    public void onCreate(Bundle state) {\n        super.onCreate(state);\n\
  \        setContentView(R.layout.giver);\n        editText = (EditText) findViewById(R.id.editText);\n\
  \        editText.setOnKeyListener(this);\n        button = (Button) findViewById(R.id.button2);\n\
  \        button.setOnClickListener(this);\n    }\n\n    @Override\n    public boolean\
  \ onKey(View v, int keyCode, KeyEvent event) {\n        buffer.append(keyCode);\n\
  \        return false;\n    }\n\n    @Override\n    public void onClick(View arg0)\
  \ {\n        Intent intent = new Intent();\n        intent.putExtra(\"text\", editText.getText().toString());\n\
  \        setResult(RESULT_OK, intent);\n        finish();\n    }\n}\n```\n\n\n\n\
  \n![9781118027707-fg030112.tif](img/9781118027707-fg030112_fmt.jpeg)\n\n当用户点击获取结果（Get\
  \ a Result）按钮时，Android 会调用 `startActivityForResult(intent, MY_REQUEST_CODE)`。\n\n\
  `startActivityForResult` 方法接收一个 `intent` 和一个请求代码。在代码列表 1-10 中，`intent` 显式地指向要启动的\
  \ activity。请求代码可以是任何 `int` 值。请求代码用于在结果返回时标识该返回结果。（你可以在获取任何结果之前多次调用 `startActivityForResult`。当结果到达时，你使用请求代码来区分不同的结果。）\n\
  \n点击图 1-12 中的按钮后，用户会看到代码列表 1-11 中的 `GiveResult Activity`。（参见图 1-13。）\n\n**图 1-13：**\
  \ 代码列表 1-11 中的 activity。\n\n![9781118027707-fg030113.tif](img/9781118027707-fg030113_fmt.jpeg)\n\
  \n用户在图 1-13 的文本字段中输入文本，然后点击返回（Go Back）按钮。点击按钮会导致代码列表 1-11 中的代码创建一个 `intent`。该 `intent`\
  \ 带有额外信息——即用户的文本输入。\n\n调用 `setResult` 会发送一个结果代码（`RESULT_OK`、`RESULT_CANCELED` 或任何对接收者有意义的正\
  \ `int` 值）以及一个包含有用信息的 `intent`。\n\n在代码列表 1-11 的末尾，`finish` 方法的调用结束了图 1-13 所示 activity\
  \ 的运行。屏幕返回 `GetResultActivity`。（参见图 1-14。）\n\n**图 1-14：** 获取结果后代码列表 1-10 中的 activity。\n\
  \n![9781118027707-fg030114.tif](img/9781118027707-fg030114_fmt.jpeg)\n\n此时，Android\
  \ 调用代码列表 1-10 中的 `onActivityResult` 方法。该方法会以某种方式使用结果。（在本例中，`onActivityResult` 方法简单地将结果显示在\
  \ `TextView` 元素中。）\n\n## 应用程序也不会被遗落\n\n在任何操作系统中，事物都在产生又消灭。用户登录和注销，activity 被创建和销毁。但应用程序呢？应用程序会被创建和终止。\n\
  \n如果你检查代码列表 1-9，你会看到一个带有 `android:name=\".Demo1App\"` 属性的 `application` 元素。应用不需要\
  \ `android:name` 属性，但如果有该属性，你必须创建一个与你指定的名称相同的类。你可以通过这个类来跟踪应用程序的全局值（超越应用单个 activity\
  \ 的值）。\n\n对 `Application` 类方法的调用是不可预测的。代码列表 1-12 阐明了这种情况。\n\n### 代码列表 1-12：一个 Android\
  \ 应用程序\n\n```java\npackage com.allmycode.demo1;\n\nimport android.app.Application;\n\
  import android.content.res.Configuration;\nimport android.util.Log;\n\npublic class\
  \ Demo1App extends Application {\n    private static final String CLASSNAME = \"\
  Demo1App\";\n    @Override\n    public void onCreate() {\n        Log.v(CLASSNAME,\
  \ \"onCreate\");\n    }\n    @Override\n    public void onConfigurationChanged(Configuration\
  \ config) {\n        Log.v(CLASSNAME, \"onConfigurationChanged\");\n    }\n    @Override\n\
  \    public void onLowMemory() {\n        Log.v(CLASSNAME, \"onLowMemory\");\n \
  \   }\n    @Override\n    public void onTerminate() {\n        Log.v(CLASSNAME,\
  \ \"onTerminate\");\n    }\n}\n```\n\n![remember.eps](img/remember_fmt.jpeg) Android\
  \ 的 `Application` 类只有四个自己的方法——即在代码列表 1-12 中声明的方法。在之前的章节中，我没有向你展示代码列表 1-12 的日志记录。因此，如果你重新运行“重载系统”部分的实验，并且没有隐藏应用的日志条目，你就能看到。\n\
  \n\n\n\n\n首先，一个活动发送一个意图（intent）。然后系统会将该意图与其他活动的意图过滤器（intent filters）进行比较，以找出哪些活动具有匹配该意图的过滤器（哪些活动可以执行所需的操作）。见图\
  \ 2-1。\n\n**图 2-1：寻找匹配意图的活动（或其他组件）。\n\n![9781118027707-fg030201.eps](img/9781118027707-fg030201_fmt.jpeg)\n\
  \n在图 2-1 中，Android 检查意图与 Activity P 的第一个过滤器是否匹配。如果意图不匹配 Activity P 的第一个过滤器，Android\
  \ 会检查意图与第二个 Activity P 过滤器。如果 Android 在 Activity P 的某个过滤器中找到了匹配项，它会将 Activity P\
  \ 标记为实现意图的一种可能方式（可能执行意图所描述的工作的可能组件）。\n\n继续在图 2-1 中，Android 继续测试 Activity Q、Activity\
  \ R 和 Activity S 的过滤器。Android 维护着所有至少有一个匹配过滤器的活动列表。\n\n* 如果恰好有一个活动具有匹配的意图过滤器，则该活动开始运行。\n\
  * 如果没有活动具有匹配的意图过滤器，系统将抛出异常。\n* 如果有多个活动具有匹配的意图过滤器，系统将在匹配的活动中进行选择，或者系统显示菜单让用户在匹配的活动中进行选择。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) Android 的 `startActivity`、`bindService`\
  \ 和 `sendBroadcast` 方法都接受 `Intent` 类型参数。因此，匹配意图的组件可以是活动、服务或广播接收器。在本章的大多数示例中，当你读到“组件”一词时，可以安全地认为它指的是“活动”。有时我会模糊这些术语并用“活动”作为示例，尽管更完善的解释会使用“组件”一词。\n\
  \n![cross-reference.eps](img/cross-reference_fmt.jpeg) 在本微型书中，我将在第 3 章介绍服务，在第 4\
  \ 章介绍广播接收器。\n\n## 意图组成\n\n图 2-2 显示了隐式意图（implicit intent）的部分。一个意图包含动作（action）、数据（data）、类别（categories）、额外信息（extras）和标志（flags）。这些内容可能会被省略，但\
  \ Android 对可以或不可以省略的内容以及省略的时有严格限制。\n\n图 2-2 中的每个项目由一个或多个 Java 字符串组成。一些典型的示例值使用了斜体。因此，字符串`“android.intent.action.MAIN”`是一个示例动作值，而预定义的\
  \ `android.content.Intent.FLAG_ACTIVITY_NO_HISTORY` 常量是一个示例标志值。\n\n![tip.eps](img/tip_fmt.jpeg)\
  \ Android 意图周围的惯用法使得很难区分字符串和预定义常量。在图 2-2 中，`“android.intent.action.MAIN”`是一个字符串，而\
  \ `android.content.Intent.FLAG_ACTIVITY_NO_HISTORY` 是一个预定义常量（`android.content.Intent`\
  \ 类中一个名为 `FLAG_ACTIVITY_NO_HISTORY` 的静态 final 字段）。奇怪的是，字符串`“android.content.intent.MAIN”`\
  \ 中的点并没有太大意义。在任何 `android.content.intent` 类中都没有名为 `MAIN` 的成员。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 你可以在 Java 源文件中使用字符串、常量或对字符串资源的引用，但在 XML 文档中只能使用字符串。\n\n**图 2-2：一个 Android 意图。\n\
  \n![9781118027707-fg030202.eps](img/9781118027707-fg030202_fmt.jpeg)\n\n图 2-2 表示意图的数据部分有两种形式——URI\
  \ 和 MIME 类型。一个意图可能这两者皆没有、只有其中之一，或者两者兼有。\n\n继续看图 2-2，MIME 类型中的 MIME 代表多用途互联网邮件扩展（Multipurpose\
  \ Internet Mail Extensions）。原始的 MIME 标准描述了可以在电子邮件中进行编码和发送的数据类型。例如，当你的电子邮件程序接收到带有\
  \ `Content-Type: text/html` 的消息时，你的程序会将消息解释为 HTML 文档，并像网络浏览器显示网页一样显示内容。当程序接收到声明为\
  \ MIME 类型 `audio/mp3`、`image/jpeg` 或 `application/zip` 的位流时，程序会将这些位解释为声音、图像或 ZIP\
  \ 文件。在每种情况下，斜杠之前的单词是顶级类型，斜杠之后的单词是子类型。常见的顶级类型/子类型对包括 `text/plain`、`text/html`、`text/xml`、`image/png`、`image/jpeg`\
  \ 和 `image/gif`。\n\n![tip.eps](img/tip_fmt.jpeg) Android SDK 中的许多名称使用了缩词 `type`\
  \ 而不是全称 `MIME type`。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) 与普通电子邮件处理中使用\
  \ MIME 类型不同，Android 的 MIME 类型匹配是区分大小写的。因此，，意图中的 `TEXT/PLAIN` 不匹配过滤器中的 `text/plain`。Android\
  \ 开发者指南建议在 MIME 类型名称中仅使用小写字母。\n\n统一资源定位符（URL）是当有人问起“我可以在网上找到那个？”时，你口出的任何熟悉的网络地址。统一资源标识符（URI）看起来像\
  \ URL，但 URI 描述的内容不仅仅是页面。\n\n## 统一资源标识符\n\n统一资源定位符（URL）是当有人问“我可以在网上找到那个？”时，你口出的任何熟悉的网络地址。统一资源标识符（URI）看起来像\
  \ URL，但 URI 描述的内容不仅仅是页面。每个 URL 都是 URI，但 URI 并不都是 URL。某些 URI 并不定位内容。\n\n**图 2-3：统一资源标识符。\n\
  \n![9781118027707-fg030203.eps](img/9781118027707-fg030203_fmt.jpeg)\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg)\
  \ 我在图 2-3 中所示的 URI 是层次级 URI。层次级 URI 的替代方案是不透明 URI。不透明 URI（如 `tel:650253` 或 `mailto:allcode.com`）使用冒号而不是\
  \ `://`。此外，在不透明 URI 中，冒号之后的内容取决于方案。事实上，在不透明 URI 中，冒号之后的是 URI 的方案特定部分。例如，在 URI `mailto:allcode.com`\
  \ 中，方案是 `mailto`，方案特定部分是 `allcode.com`。不透明 URI 既没有权威也没有路径。\n\n### 什么是 URL？\n\n如果你不是住在石头底下，你就用过成百上千的\
  \ URL（统一资源定位符）。正如名称所示，URL 定位资源。例如，[`www.panynj.gov:80/path`](http://www.panynj.gov:80/path)\
  \ 定位了港务管理局网站（一个负责在纽泽西和纽约市之间运行火车的机构）的主页。该 URL 的方案是 `http`。它的主机是 `www.panynj.gov`。它的端口是\
  \ `80`。它的权威是 `www.panynj.gov:80`。它的路径恰好是 `/path`。\n\n每个 URL 都是 URI（统一资源标识符），但 URI\
  \ 并不都是 URL。某些 URI 并不定位内容。例如，每个 `AndroidManifest.xml` 文档包含属性 `xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  `。该 URI 的方案是 `http`。主机和权威都是 `schemas.android.com`。（此 URI 没有端口。）该 URI 的路径是 `/apk/res/android`。\n\
  \n如果你在网络浏览器地址栏中输入 `http://schemas.android.com/apk/res/android`，你的浏览器将无处去。URI `http://schemas.android.com/apk/res/android`\
  \ 并不定位任何内容。就像许多 XML 文档开 URI 一样，这个 URI 仅仅是一个名称。这个 URI 是 URN（统一资源名称）。根据互联网工程任务组文档\
  \ RFC 3986，URN “即使资源消失或不可用，也要求保持全局唯一和持久 . . . ”换句话说，URN 命名某个东西——一个名称始终有效的东西——一个可能永远不需要被找到的东西。\n\
  \n\n\n\n这是另一个例子。Android SDK 包含一个充满示例应用程序的文件夹。其中一个程序（`SearchableDictionary` 示例）使用了\
  \ URI `content://com.example.android.searchable dict.DictionaryProvider/ dictionary`。该\
  \ URI 的方案（scheme）是 `content`，依此类推。这个 URI 在网络浏览器的地址栏中无法工作。但在 Android 的 `SearchableDictionary`\
  \ 示例中，URI 定位了一个特定的内容提供者（在本例中，是一个字典单词和定义的提供者）。URI 定位的内容并不非要是网页。\n\n世界维网联盟（W3C）正在研究\
  \ IRI（国际化资源标识符）。IRI 类似于 URI，不同之处是 IRI 的字符不受限于罗马字母表中的字符。下图展示了一个 IRI 的示例。\n\n![9781118027707-sb030201.eps](img/9781118027707-sb030201_fmt.jpeg)\n\
  \n## 过滤器过滤器（intent filter）的组成\n\n你的应用创建一个意图（intent），然后调用 `startActivity(intent)`。接着发生了什么？Android\
  \ 设备上安装了一系列活动（activities），每个活动都有自己的意图过滤器（intent filters）。Android 尝试将意图与每个意图过滤器进行匹配。如果某个活动具有任何匹配的意图过滤器，该活动就会进入\
  \ `startActivity` 方法的可能响应者列表。\n\n活动不匹配的过滤器不会损害该活动进入列表的机会。即使该活动只有一个过滤器匹配成功，该活动仍会进入可能响应者列表。\n\
  \n那么，什么构成了意图与意图过滤器之间的匹配呢？你这个问题问得真好！答案并不简单。\n\n意图过滤器可以包含动作（actions）、数据项（data entries）和类别（categories）。与意图不同，意图过滤器可以有多个动作和多个数据项。与意图一样，意图过滤器也可以有多个类别）。意图过滤器没有额外属性（extras）或标志（flags）（见图\
  \ 2-4）。\n\n**图 2-4：**意图过滤器的组成部分。\n\n![9781118027707-fg030204.eps](img/9781118027707-fg030204_fmt.jpeg)\n\
  \n为了找到隐式意图与意图过滤器之间的匹配，Android 会进行三次测试：\n\n• Android 测试意图的动作与过滤器的动作是否匹配。\n• Android\
  \ 测试意图的类别与过滤器的类别是否匹配。\n• Android 测试意图的数据与过滤器的数据是否匹配。\n\nAndroid 匹配意图动作与过滤器动作的规则相当简单。匹配意图类别与过滤器类别的规则还可以。但这两条规则都不是那种过朗易口的、单句口号。而匹配意图数据与过滤器数据的规则则相当复杂。遗憾的是，关于过滤器匹配的官方文档（[`http://developer.android.com/guide/topics/intents/intents-filters.html`](http://developer.android.com/guide/topics/intents/intents-filters.html)）含义模糊，且包含一些错误。\n\
  \n因此，为了帮助你理解意图是如何匹配意图过滤器的，我采用了多方面的方法。（这是一种高级说法，意思是我会用几种不同的方式解释几次匹配过程。）\n\n## 匹配：使用（幼稚的）类比的总体概念\n\
  \n两类人报名参加了一场相亲活动。在房间的一侧，每个参与者代表 Android 意图的一个部分。（所以一个人代表动作，接下来的两个人代表类别，依此类推。我警告过你这个类比会很幼稚！）在房间的另一侧，每个参与者代表过滤器的一个部分部分。（见图\
  \ 2-5。）\n\n**图 2-5：**相亲活动中的意图元素和过滤器元素。\n\n![9781118027707-fg030205.eps](img/9781118027707-fg030205_fmt.jpeg)\n\
  \n就像所有的约会场合一样，房间里的人数可能会失衡。过滤器可能有更多的动作或更多的类别。意图可能有更多的数据。这几乎从不是那种一对一的童话式组合。\n\n在这个领域，有些人比其他人更“迫切”（needier）。例如，在意图端，你有一个动作坚决要在过滤器中找到匹配项。在过滤器端，你有一个类别仅仅是为了陪陪朋友来参加相亲的。这个漫不经心的类别并不需要在意图的类别中找到匹配项。\n\
  \n作为一个快速（且不完全准确）的规则：当且仅当每个迫切的人都找到匹配项时，整个意图才匹配整个过滤器。任何不迫切的人都不需要匹配。也就是说，即使那些为了凑热闹的人没有找到匹配项，整个相亲活动也是成功的。不迫切的部分不会偏离意图与过滤器之间的整体匹配。\n\
  \n那么谁是迫切的，谁是不迫切的呢？图 2-5 给你提供了一个大致的思路。\n\n![remember.eps](img/remember_fmt.jpeg)\
  \ 图 2-5、2-6 和 2-7 中的匹配规则是通用指南。官方规则包含一些重要的例外。欲需更多信息，请参阅接几节。\n\n## 真实情况\n\n意图过滤器有三个部分：动作、类别和数据。如果动作、类别和数据都匹配，则意图过滤器匹配该意图。\n\
  \n匹配意图动作与过滤器动作的规则相当简单。匹配意图类别与过滤器类别的规则还可以。然而，匹配意图数据与过滤器数据的规则相当复杂。\n\n## Java 方法与\
  \ XML 元素\n\n你可以在 `AndroidManifest.xml` 或 Java 代码中描述意图过滤器。在 `AndroidManifest.xml`\
  \ 文档中，`<intent-filter>` 有 `<action>`、`<category>` 和 `<data>` 子元素。\n\n```xml\n<intent-filter>\n\
  \    <action android:name=\"string\" />\n    <category android:name=\"string\" />\n\
  \    <data android:scheme=\"string\"\n          android:host=\"string\"\n      \
  \    android:port=\"string\"\n          android:path=\"string\"\n          android:pathPattern=\"\
  string\"\n          android:pathPrefix=\"string\"\n          android:mimeType=\"\
  string\" />\n</intent-filter>\n```\n\n意图方法与数据元素的属性并不是对应的。例如，通过意图的 `setAction` 方法，你设置意图的动作（如果意图需要动作）。但通过过滤器的\
  \ `<action>` 元素，你向过滤器添加多个动作中的一个。通过意图的 `setData` 方法，你设置意图的 URI（如果意图需要 URI）。但通过过滤器的\
  \ `<data>` 元素，你添加 URI 的各个部分。\n\n你通常在 `AndroidManifest.xml` 文件中设置过滤器值。但在 Java 代码中，`android.content.IntentFilter`\
  \ 类有很多实用的方法。我在这里列出几个：\n\n- `addAction`: 向过滤器添加一个动作。\n- `addCategory`: 向过滤器添加一个类别。\n\
  - `addDataScheme`: 向过滤器添加一个方案。\n- `addDataAuthority`: 向过滤器添加一个权限。\n- `addDataPath`:\
  \ 向过滤器添加一个路径。\n- `addDataType`: 向过滤器添加一个 MIME 类型。\n\n\n\n\n正如 intent 方法和数据元素属性一样，intent\
  \ 方法和 filter 方法之间并不是一一对应的。intent 的 `set Action` 方法执行的是显而易见的操作——它设置 intent 的 action（如果你希望\
  \ intent 拥有 action）。然而，filter 的 `addAction` 方法允许你向 filter 添加可能存在的多个 action 之一。intent\
  \ 的 `setData` 方法设置 intent 的 URI（如果你希望 intent 拥有 URI）。另一方面，filter 的 `addDataScheme`、`addDataAuthority`\
  \ 和 `addDataPath` 方法则允许你分段地添加 URI 的各个部分。\n\n### 匹配 action\n\n根据图 2-5 所示，intent 的\
  \ action 必须与 filter 的 action 之一匹配。这是很有道理，因为 intent 的 action 表示的是：“我想要一个可以执行某项任务的组件。”而\
  \ filter 的 action 表示的是：“我可以执行某项任务。”filter 可能有其他 action（能够执行其他事情），但拥有额外的 filter action\
  \ 并不会阻止 intent 与 filter 匹配。\n\naction 到底是什么？最简单的回答是 action 是一个字符串。你可以创建自己的 action\
  \ 字符串 `“thisismyaction”` 或 `“allmy code.intent.action.DO_THIS”`——Android 文档推荐后者的形式。但\
  \ Android 还有许多标准 action——为某些特定工作预留的 action。例如，当开发者创建一个可以显示内容（文档、网页、图像或任何内容）的 activity\
  \ 时，开发者会在 activity 的 filter 中包含 `“android.intent.action.VIEW”`。然后，当你想要他人的 activity\
  \ 显示某些内容时，就在你的 intent 中放入 `“android.intent.action.VIEW”`（或常量 `android.content.Intent.ACTION_VIEW`，其值为\
  \ `“android.intent.action.VIEW”`）。\n\n表 2-1 列出了我最喜欢的一些标准 action。\n\n![表 2-1 Activity\
  \ 的一些标准 action](img/9781118027707-bk03ch0201a.jpg)\n\n![表 2-1 Activity 的一些标准 action](img/9781118027707-bk03ch0201b.jpg)\n\
  \n![表 2-1 Activity 的一些标准 action](img/9781118027707-bk03ch0201c.jpg)\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg)欲查看\
  \ Android 标准 action 列表，请访问 [`http://developer.android.com/reference/android/content/Intent.html`](http://developer.android.com/reference/android/content/Intent.html)。\n\
  \n这里有一个用的实验：\n\n1. 创建一个包含两个 activity 的新 Android 项目——由 Eclipse 创建的主 activity 和第二个\
  \ `OtherActivity.java` activity。\n\n2. 向项目的 `AndroidManifest.xml` 文件中添加以下 `activity`\
  \ 元素：\n\n```xml\n<activity android:name=”.OtherActivity”>\n  <intent-filter>\n \
  \   <action\n      android:name=”com.allmycode.action.MY_ACTION” />\n    <category\n\
  \      android:name=”android.intent.category.DEFAULT” />\n  </intent-filter>\n</activity>\n\
  ```\n\n3. 在主 activity 中添加以下代码：\n\n```java\nfinal String THE_ACTION =\n    “com.allmycode.action.MY_ACTION”;\n\
  Intent intent = new Intent();\nintent.setAction(THE_ACTION);\nstartActivity(intent);\n\
  ```\n\n4. 使用 Eclipse 的图形化布局编辑器更改另一个 activity 的布局。\n\n任何更改都是可以。更改另一个 activity 布局的唯一理由是帮助你识别两个\
  \ activity（主 activity 或另一个 activity）哪一个在模拟器屏幕上。\n\n5. 运行项目。\n\n一旦你的模拟器执行了第 3 步中的代码，Android\
  \ 就会启动另一个 activity。intent 的 `“com.allmycode.action.MY_ACTION”` 匹配 filter 的 `“com.allmycode.action.MY_ACTION”`，因此另一个\
  \ activity 开始运行。\n\n![remember.eps](img/remember_fmt.jpeg) 真正的 Android 开发者使用标准 action（如表\
  \ 2-1 中的 action），或者他们会编写点分隔的 action 名称，例如 `“com.allmy code.action.MY_ACTION”`。真正的开发者会在\
  \ `AndroidManifest.xml` 文件中输入那个 `“com.allmy code.action.MY_ACTION”` 字符串（因为必须这样做）。但在\
  \ Java 代码中，真正的开发者会创建一个常量值来表示该字符串（因为这是良好的编程习惯）。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg)\
  \ 本节说明第 2 步中的 `category` 元素是一个异常，我在稍后的章节“细节说明”中介绍它。如果你不想跳转到该章节，只需为你的 `AndroidManifest.xml`\
  \ 文件中的每个 filter 添加 category `“android.intent.category.DEFAULT”` 即可。\n\n继续实验 . .\
  \ .\n\n6. 从项目的 `AndroidManifest.xml` 中注释掉（或删除）以下元素：\n\n```xml\n<action name=”com.allmycode.action.MY_ACTION”\
  \ />\n```\n\n7. 运行你的项目。\n\n当你的模拟器执行第 3 步中的代码时，Android 启动另一个 activity。intent 的 `“com.allmycode.action.MY_ACTION”`\
  \ 匹配 filter 的 `“com.allmycode.action.MY_ACTION”`，因此另一个 activity 开始运行。\n\n![remember.eps](img/remember_fmt)\
  \ 真正的 Android 开发者使用标准 action（如表 2-1 中的 action），或者他们会编写点分隔的 action 名称，例如 `“com.allmy\
  \ code.action.MY_ACTION”`。真正的开发者会在 `AndroidManifest.xml` 文件中输入那个 `“com.allmy code.action.MY_ACTION”`\
  \ 字符串（因为必须这样做）。但在 Java 代码中，真正的开发者会创建一个常量值来表示该字符串（因为这是良好的编程习惯）。\n\n![cross-reference.eps](img/cross-reference_fmt)\
  \ 本节说明第 2 步中的 `category` 元素是一个异常，我在稍后的章节“细节说明”中介绍它。如果你不想跳转到该章节，只需为你的 `AndroidManifest.xml`\
  \ 文件中的每个 filter 添加 category `“android.intent.category.DEFAULT”` 即可。\n\n（注：原文后续存在大量重复的段落，已根据指令要求不重复输出，仅保留核心逻辑翻译）\n\
  \n\n\n\n\n考虑使用以下 Java 代码创建的猫咪意图（kitty-cat intent）：\n\n```java\nfinal String THE_ACTION\
  \ = \"com.allmycode.action.MY_ACTION\";\nfinal String THE_CATEGORY = \"com.allmycode.category.KITTY\"\
  ;\nIntent intent = new Intent();\nintent.setAction(THE_ACTION);\nintent.addCategory(THE_CATEGORY);\n\
  startActivity(intent);\n```\n\n该猫咪意图匹配以下 XML 代码的过滤器：\n\n```xml\n<activity android:name=\"\
  .OtherActivity\">\n  <intent-filter>\n    <action android:name=\"com.allmycode.action.MY_ACTION\"\
  \ />\n    <category android:name=\"com.allmycode.category.KITTY\" />\n    <category\
  \ android:name=\"android.intent.category.DEFAULT\" />\n  </intent-filter>\n</activity>\n\
  ```\n\n猫咪意图也匹配以下意图，因为（在快速相亲语言中）过滤器的类别是不够挑剔的：\n\n```xml\n<activity android:name=\"\
  .OtherActivity\">\n  <intent-filter>\n    <action android:name=\"com.allmycode.action.MY_ACTION\"\
  \ />\n    <category android:name=\"com.allmycode.category.KITTY\" />\n    <category\
  \ android:name=\"Otto.Schmidlap\" />\n    <category android:name=\"android.intent.category.DEFAULT\"\
  \ />\n  </intent-filter>\n</activity>\n```\n\n猫咪意图不匹配以下意图，因为意图的类别是挑剔的：\n\n```xml\n\
  <activity android:name=\".OtherActivity\">\n  <intent-filter>\n    <action android:name=\"\
  com.allmycode.action.MY_ACTION\" />\n    <category android:name=\"Otto.Schmidlap\"\
  \ />\n    <category android:name=\"android.intent.category.DEFAULT\" />\n  </intent-filter>\n\
  </activity>\n```\n\n## 匹配数据\n\n图 2-5 展示了意图数据与过滤器数据之间一种有趣的关系：\n\n- 如果意图拥有 URI，或者过滤器拥有\
  \ URI，那么过滤器的 URIs 之一必须匹配意图的 URI。\n- 如果意图拥有 MIME 类型，或者过滤器拥有 MIME 类型，那么过滤器的 MIME 类型之一必须匹配意图的\
  \ MIME 类型。\n\n这些规则还有一些推论：\n\n- 没有 URI 的意图无法匹配没有 URI 的过滤器。没有 URI 的过滤器无法匹配没有 URI 的意图。\n\
  - 没有 MIME 类型的意图无法匹配没有 MIME 类型的过滤器。没有 MIME 类型的过滤器无法匹配没有 MIME 类型的意图。\n\n所有这些关于 URI\
  \ 和 MIME 类型的内容是如何自圆其说的的呢？关键在于，在匹配过滤器和意图时，数据起的作用与 action 或 category 并不相同。想象一下，一个意图声明：“我想要一个组件来执行\
  \ `android.intent.action.VIEW`”，而某个 Activity 的过滤器声明：“我可以执行 `android.intent.action.VIEW`。”意图并不不在乎过滤器是否声明了它还能执行其他操作。\n\
  \n但如果意图声明：“我想要一个组件来处理 URI `tel:6502530000`”呢？（URI `tel:6502530000` 会拨打向位于加利福尼亚州山景城的\
  \ Google 公司总部的电话。）一个合适的过滤器包含 `tel` 方案。（见图 2-6。）现在想象另一个意图没有 `tel:` URI，而一个过滤器的唯一方案是\
  \ `tel` 方案。（再次见图 2-6。）在这种情况下，过滤器说：“我可以用电话号码做一些有用的事情，当我被调用时，我期望接收到一个电话号码。”如果意图没有\
  \ `tel:` URI，则这种匹配是不合适的。\n\n因此，意图数据与过滤器数据之间的耦合比 action 之间的耦合或 category 之间的耦合更强。对于数据中的\
  \ URI 部分，意图和过滤器都是挑剔的。数据的 MIME 类型也是如此。\n\n**图 2-6：** 匹配 tel 方案。\n\n![9781118027707-fg03206.jpeg]\n\
  \n以下意图和过滤器构成了一个匹配项：\n\n```java\nfinal String THE_ACTION = \"com.allmycode.action.MY_ACTION\"\
  ;\nIntent intent = new Intent();\nintent.setAction(THE_ACTION);\nintent.setData(Uri.parse(\"\
  http:\"));\nstartActivity(intent);\n<intent-filter>\n  <action android:name=\"com.allmycode.action.MY_ACTION\"\
  \ />\n  <category android:name=\"android.intent.category.DEFAULT\" />\n  <data scheme=\"\
  http\" />\n  <data scheme=\"mymscheme\" />\n</intent-filter>\n```\n\n带有稍作修改过滤器的相同意图并不构成匹配，因为过滤器中的\
  \ MIME 类型集是挑剔的：\n\n```xml\n<intent-filter>\n  <action android:name=\"com.allmycode.action.MY_ACTION\"\
  \ />\n  <category android:name=\"android.intent.category.DEFAULT\" />\n  <data scheme=\"\
  http\" />\n  <data scheme=\"mymscheme\" />\n  <data mimeType=\"text/html\" />\n\
  </intent-filter>\n```\n\n要匹配这个修改后的过滤器，你需要以下意图之一：\n\n```java\nfinal String THE_ACTION\
  \ = \"com.allmycode.action.MY_ACTION\";\nIntent intent = new Intent();\nintent.setAction(THE_ACTION);\n\
  intent.setData(Uri.parse(\"http:\"));\nstartActivity(intent);\n```\n\n```java\n\
  final String THE_ACTION = \"com.allmycode.action.MY_ACTION\";\nIntent intent = new\
  \ Intent();\nintent.setAction(THE_ACTION);\nintent.setDataAndType(Uri.parse(\"mymscheme:\"\
  ), \"text/html\");\nstartActivity(intent);\n```\n\n最后，以下意图和过滤器构成匹配，因为意图中的 MIME 类型匹配过滤器中的\
  \ MIME 类型之一：\n\n```java\nfinal String THE_ACTION = \"com.allmycode.action.MY_ACTION\"\
  ;\nIntent intent = new Intent();\nintent.setAction(THE_ACTION);\nintent.setType(\"\
  text/html\");\nstartActivity(intent);\n<intent-filter>\n  <action android:name=\"\
  com.allmycode.action.MY_ACTION\" />\n  <category android:name=\"android.intent.category.DEFAULT\"\
  \ />\n  <data mimeType=\"abc/xyz\" />\n  <data mimeType=\"text/html\" />\n</intent-filter>\n\
  ```\n\n## 匹配数据\n\n本章前面的“Java 方法与 XML 元素”列出了方法和元素。通过意图的 `setData` 方法设置意图的 URI（如果你希望意图拥有\
  \ URI）。通过过滤器的 `<data>` 元素添加 URI 的各个部分。过滤器的片段并不需要完全匹配。例如，以下意图和过滤器构成匹配：\n\n```java\n\
  final String THE_ACTION = \"com.allmycode.action.MY_ACTION\";\nIntent intent = new\
  \ Intent();\nintent.setAction(THE_ACTION);\nintent.setData(Uri.parse(\"abc://example.com:2222\"\
  ));\nstartActivity(intent);\n<intent-filter>\n  <data scheme=\"xyz\" host=\"example.com\"\
  \ />\n  <data port=\"2222\" />\n  <action android:name=\"com.allmycode.action.MY_ACTION\"\
  \ />\n  <category android:name=\"android.intent.category.DEFAULT\" />\n  <data scheme=\"\
  abc\" />\n</intent-filter>\n```\n\n过滤器可以拥有 `abc` 和 `xyz` 方案，以及 `example.com` 。那么过滤器数据就能匹配意图数据\
  \ `abc://example.com` 和意图数据 `xyz://example.com`。即使你把 `xyz` 和 `example.com` 放在同一个\
  \ `<data>` 元素中，这同样有效。\n\n通过过滤器的 `addDataScheme`、`addDataAuthority` 和 `addDataPath`\
  \ 方法，你可以分别添加 URI 的各个部分。例如，以下意图和过滤器构成匹配：\n\n```java\nfinal String THE_ACTION = \"\
  com.allmycode.action.MY_ACTION\";\nIntent intent = new Intent();\nintent.setAction(THE_ACTION);\n\
  intent.setData(Uri.parse(\"abc://example.com:2222\"));\nstartActivity(intent);\n\
  final IntentFilter filter = new IntentFilter();\nfilter.addAction(THE_ACTION);\n\
  // Constant com.content.Intent.CATEGORY_DEFAULT has\n//  value \"android.intent.category.DEFAULT\"\
  \nfilter.addCategory(Intent.CATEGORY_DEFAULT);\nfilter.addDataScheme(\"abc\");\n\
  filter.addDataScheme(\"xyz\");\nfilter.addDataAuthority(\"example.com\", \"2222\"\
  );\n```\n\n此时，有几点观察需要说明。\n\n\n\n\n\n- 一个意图（intent）有三种相似的方法：`setData`、`setDataAndType`\
  \ 和 `setType`。对于带有 URI 但没有 MIME 类型的图，调用 `setData`。对于有 MIME 类型但没有 URI 的意图，调用 `setType`。只有对于同时具有\
  \ URI 和 MIME 类型的意图，才调用 `setDataAndType`。\n\n- 你不需要向 `setData` 方法或 `setDataAndType`\
  \ 方法的参数传递字符串。你传递的是 `android.net.Uri` 类的实例。你通过对字符字符串应用 `Uri.parse` 方法来实现这一点。\n\n\
  - 这是一个虽然愚蠢但重要的细节：调用 `intent.setData(Uri.parse(“http:”))` 时，由于 `http` 后面带有一个冒号，它会匹配过滤器元素\
  \ `<data android:scheme=”http” />`（而注意后者的 `http` 后面没有冒号）。URI 方案中其他冒号/无冒号的组合都无法匹配。\n\
  \n## 匹配 URI\n\n图 2-5 展示了意图部分与意图过滤器（intent filter）之间的一场想象中的速会活动。该图并没有讨论一个 URI 与另一个\
  \ URI 的匹配问题。所以，想象图 2-5 中的 URI 带着它们心爱的小孩子（它们的方案、授权和路径）参加了这场速会。随着傍晚的开始，孩子们进入另一个单独的房间参加他们自己的速会。（当然，他们还太小，不能约会。但这对青少年期来说是很好的练习。）图\
  \ 2-7 展示了孩子们活动中的“需求感”状况。\n\nURI 孩子们的情况与所有数据的情况类似。只要意图侧的每个东西都能匹配过滤器侧的某个东西，大家就是开心的。例如，以下意图和过滤器形成了匹配：\n\
  \n```java\nfinal String THE_ACTION = “com.allmycode.action.MY_ACTION”;\nIntent intent\
  \ = new Intent();\nintent.setAction(THE_ACTION);\nintent.setData(Uri.parse(“``abc://example.com:2222``”));\n\
  startActivity(intent);\n\n<intent-filter>\n  <action android:name=”com.allmycode.action.MY_ACTION”\
  \ />\n  <category android:name=”android.intent.category.DEFAULT” />\n  <data android:scheme=”``abc``”\
  \ />\n</intent-filter>\n```\n\n**图 2-7：** 在 URI 的部分中，谁需要遇到某人？\n\n![9781118027707-fg030207.eps](img/9781118027707-fg030207_fmt.jpeg)\n\
  \n但使用同一个意图，以下过滤器并不匹配：\n\n```xml\n<intent-filter>\n  <action android:name=”com.allmycode.action.MY_ACTION”\
  \ />\n  <category android:name=”android.intent.category.DEFAULT” />\n  <data android:scheme=”abc”\
  \ />\n  <data android:host=”example.com” />\n  <data android:port=”2222” />\n  <data\
  \ android:path=”/some/stuff” />\n</intent-filter>\n```\n\n## 细节说明\n\n在前面的几节中对过滤器匹配进行了如此大量的讨论，你可能会认为问题已经解决了。但工作永远没有完结的。以下是过滤器匹配中最重要的陷阱（gotchas）和异常列表：\n\
  \n- Android 对 activity 的处理与其他组件（如 service 和广播接收器）不同。\n\n你可以创建一个没有 action 的隐式意图。如果你这样做，调用\
  \ `startActivity(intent)` 将不会在任何 activity 过滤器中找到匹配项。然而，调用 `sendBroadcast(intent)`\
  \ 或 `bindService(intent, ...)` 可能会找到匹配。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg)\
  \ 根据 Android 文档，“……一个没有指定 action 的 Intent 对象会自动通过测试——只要过滤器包含至少一个 action。” 就我所知，文档中的这一表述是不正确的。\n\
  \n- 在类别（categories）方面，Android 对 activity 的处理与其他组件不同。\n\n当你尝试启动一个 activity 时，Android\
  \ 的行为就像意图包含了 `“android.intent.category.DEFAULT”` 类别。（即使你没有执行代码将该类别添加到意图中，Android\
  \ 也会这样做。）由于由于，没有 `“android.intent.category.DEFAULT”` 类的 activity 过滤器永远不会匹配意图。\n\n\
  ![tip.eps](img/tip_fmt.jpeg) 用户首次点击应用图标时启动的 activity 是该应用的主活动（main activity）。主 activity\
  \ 的过滤器通常包含 action `“android.intent.action.MAIN”` 和类别 `“android.intent.category.LAUNCHER”`。如果你想让一个\
  \ activity 作为主活动运行（且永远不会通过应用的 `startActivity` 调用启动），你可以安全地从 activity 中省略 `“android.intent.category.DEFAULT”`。\n\
  \n- 在 URI 的部分中，谁需要遇到某人？\n\n- 使用同一个意图，以下过滤器并不匹配：\n\n- 在前面的几节中对过滤器匹配进行了如此大量的讨论，你可能会认为问题已经解决了。\n\
  \n- 除了主机名（host name）之外，意图及其过滤器中的字符串是区分大小写的。\n\n- 等等，Android 对 activity 的处理与其他组件（如\
  \ service 和广播接收器）不同。\n\n- 你可以创建一个没有 action 的隐式意图。如果你这样做，调用 `startActivity(intent)`\
  \ 将不会在任何 activity 过滤器中找到匹配项。\n\n- 在类别方面，Android 对 activity 的处理与其他组件不同。\n\n- 用户首次点击应用图标时启动的\
  \ activity 是该应用的主活动。\n\n- 某些部分可能包含通配符或简化的正则表达式。\n\n- `text/*` 类型匹配 `text/plain`。\n\
  \n- `text/*` 类型也匹配 `text/html` 和 `text/whatever`。\n\n- `*/*` 类型匹配 `text/plain`。\n\
  \n- `*/*` 类型也匹配 `image/jpeg` 等。\n\n- `*`（没有斜杠的单个通配符）和 `*/html` 似乎不匹配任何东西。\n\n- `text/ht*`\
  \ 类型不匹配 `text/html`。\n\n- 等等等等等等等等等等等。\n\n- 路径使用简化的正则表达式形式。（也就是说，路径可以包含通配符和其他奇的符号。）例如，意图\
  \ URI `http://example.com/folder` 匹配方案为 `http`、授权为 `example.com` 路径模式为 `/fol.*`\
  \ 的过滤器 URI。\n\n\n\n\n\n如果我每误解一次 Android `Intent Filters` 文档就能得到一分硬币，我有足够的钱加满我的油箱了。（这挺了不起的，不是吗？）我希望本章中关于意图过滤器匹配的章节是清晰且无歧义的。但内心深处，我知道几乎所有的口语句子都是移动目标。以以下句子为例：\n\
  \n*   把妈妈放在我们身后的车里。\n*   我想让大卫·科珀菲尔德读书。\n*   我会给自己贴上绷带。\n*   所有东西不应该是蓝色的。\n*   这种药每天吃三次，直到吃完。\n\
  *   我为每个人省了五美元。\n*   拖车费由车主承担。\n*   我们的奶油非常温和，即使在刮脸后也不会让大多数人感到刺痛。\n*   我希望有一天你能像爱艾米一样爱我。\n\
  *   如果他发现野熊和狗是亲戚，而且不会伤害人类，他会更开心。\n\n检验你理解程度最好的方法不是你在阅读此本书段落时点头的样子。相反，最好的测试是你在模拟器或设备上尝试你自己的例子。如果你能在大多数情况下准确地预测结果，你就理解了该主题。\n\
  \n遗憾的是，测试意图和过滤器匹配可能是枯燥的。每更改一次，你都必须编辑 Java 代码，然后编辑 `AndroidManifest.xml` 文件，最后重新安装应用。早些时候，在经历了几个小时这样的测试后，我简直“气疯了，再也无法忍受”。我写了一个应用来逐一个测试过滤器匹配，而无需修改文件或重新安装任何内容。我将其命名为\
  \ Intentsity 应用（因为作为作者，我厌倦了担心拼写是否正确的问题）。不用说，你可以通过本书的网站使用该应用——[`www.allmycode.com/android`](http://www.allmycode.com/android)。（你以后可以再感谢我。）\n\
  \n该应用主界面的上半部分如图 2-8 所示。\n\n**图 2-8：** 输入意图和意图过滤器字符串的屏幕。\n\n![9781118027707-fg030208.tif](img/9781118027707-fg030208_fmt.jpeg)\n\
  \nIntentsity 应用的屏幕有一个 `Intent` 部分和一个 `Filter` 部分。这两个部分都有用于填写 `String` 值的 `EditText`\
  \ 字段。每个 `EditText` 字段代表一个 `Intent` 实例方法或一个 `IntentFilter` 实例方法。（此类方法的列表，请参见本章前面的“Java\
  \ 方法和 XML 元素”部分。）\n\n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) Android\
  \ 没有使用 Java 代码设置 Activity 意图过滤器的功能。但你可以创建另一个组件——广播接收器——并使用 Java 代码设置广播接收器的过滤器。（你使用“Java\
  \ 方法和 XML 元素”部分中描述的 `IntentFilter` 方法调用）。因此，我的 Intentsity 应用通过尝试与广播接收器通信来测试你在 `EditText`\
  \ 字段中输入的值。应用下半部分的字段（Filter 字段）与创建 `IntentFilter` 对象的 Java 方法匹配，而不是与 `AndroidManifest.xml`\
  \ 文档中的属性匹配。为了尽可能忠于 Android 的真实行为，我的应用尊重广播接收器的过滤器可以不需要类别 `“android.intent.category.DEFAULT”`这一事实。因此，当你从\
  \ Intentsity 应用转移到自己的项目时，请记住向你的 Activity 过滤器添加 `“android.intent.category.DEFAULT”`。\n\
  \n本章前面的“Java 方法和 XML 元素”部分列出了 `setAction` 和 `addCategory` 等方法。以 `set` 开头的方法用于意图的动作（action），因为意图不能有多个动作。以\
  \ `add` 开头的方法用于意图的类别（category），因为意图可以有多个类别。\n\n图 2-8 显示了一个“New Intent Category”（新建意图类别）按钮。当你点击此按钮时，应用会创建一个额外的\
  \ `addCategory` 行。\n\n图 2-9 显示了 Intentsity 应用滚动屏幕的底部。\n\n**图 2-9：** 按 Test 匹配。\n\
  \n![9781118027707-fg030209.tif](img/9781118027707-fg030209_fmt.jpeg)\n\n填写一些 `EditText`\
  \ 字段后，点击 Test 按钮，应用就会执行它最擅长的工作：\n\n*   应用调用 `Intent` 类的方法，根据你的 Intent 字段条目组合一个意图。\n\
  *   应用调用 `IntentFilter` 类的方法，根据你的 Filter 字段条目组合一个过滤器。\n*   应用调用 `registerReceiver(myReceiver,\
  \ filter)` 创建带有新过滤器的广播接收器。\n*   应用调用 `sendBroadcast(intent)` 向系统所有的广播接收器发出广播。\n\n\
  如果接收器的过滤器匹配你的意图，接收器将显示类似图 2-10 所示的屏幕。\n\n**图 2-10：** 匹配成功！\n\n![9781118027707-fg030210.tif](img/9781118027707-fg030210_fmt.jpeg)\n\
  \n无论是否匹配，应用都会显示你的意图和意图过滤器的 `toString` 版本。图 2-10 显示了显示内容。\n\n```java\nprivate Intent\
  \ IntentFromTextFields() {\n    String theAction = actionText.getText().trim();\n\
  \    Intent intent = new Intent();\n    if (theAction.length() != 0) {\n       \
  \ intent.setAction(theAction);\n    }\n    if (intentCategoriesLayout != null) {\n\
  \        int count = intentCategoriesLayout.getChildCount();\n        for (int i\
  \ = 0; i < count; i++) {\n            String cat = ((EditText) ((ViewGroup) intentCategoriesLayout.getChild(i)).getText().trim();\n\
  \            if (cat.length() != 0) {\n                intent.addCategory(cat);\n\
  \            }\n        }\n    }\n    // 等等，等等，...\n    return intent;\n}\n```\n\
  \n### 使用 ScrollView\n\n应用主界面占据的空间比手机上通常提供的空间更多。因此，我将整个屏幕封装在 `ScrollView` 中。正如其名，`ScrollView`\
  \ 允许用户在其他内容滑出屏幕时将其滑入屏幕。`ScrollView` 的主要限制是它只能包含一个直接子元素。因此在下面的代码中，你不能在结束标签 `</LinearLayout>`\
  \ 和 `</ScrollView>` 之间放置另一个 `View` 元素：\n\n```xml\n<?xml version=\"1.0\" encoding=\"\
  utf-8\"?>\n<ScrollView xmlns:android=\"http://schemas.android.com/apk/res/android\"\
  \n    android:id=\"@+id/scrollView1\"\n    android:layout_width=\"match_parent\"\
  \n    android:layout_height=\"wrap_content\">\n    <LinearLayout android:orientation=\"\
  vertical\"\n        android:layout_width=\"match_parent\">\n        <!-- 更多布局内容\n\
  \             位于 LinearLayout 内部。\n             这些内容可能包括额外的视图元素。 -->\n    </LinearLayout>\n\
  </ScrollView>\n```\n\n\n\n\n\n```xml\n  </LinearLayout>\n    <!-- No additional\
  \ view elements may appear here. -->\n</ScrollView>\n```\n\n# 在 Java 代码中定义布局\n\n\
  通过我的 Intentsity 应用，用户可以向现有布局添加新元素。Android 拥有一个 `ListView` 类，用于处理运行时向布局添加内容的操作。然而，在\
  \ Intentsity 应用中，我发现 Android 的 `addView` 和 `removeView` 方法更易用。`addView` 和 `removeView`\
  \ 方法允许你在 Java 代码中动态地操作布局，而不是在 XML 资源文件中进行静态操作。以下节代码片段将让你略略一了解这种技术：\n\n```java\n\
  void addRow(final LinearLayout layout,\n            String label, String hintStr,\n\
  \            boolean addRadioGroup) {\n    LinearLayout.LayoutParams rowLayoutParams\
  \ =\n            new LinearLayout.LayoutParams(\n              LinearLayout.LayoutParams.FILL_PARENT,\n\
  \              ViewGroup.LayoutParams.WRAP_CONTENT);\n    LinearLayout.LayoutParams\
  \ editTextLayoutParams =\n            new LinearLayout.LayoutParams(\n         \
  \     180, LinearLayout.LayoutParams.WRAP_CONTENT);\n    LinearLayout row = new\
  \ LinearLayout(this);\n    row.setOrientation(LinearLayout.HORIZONTAL);\n    row.setGravity(Gravity.CENTER_VERTICAL);\n\
  \    TextView textView = new TextView(this);\n    textView.setText(label);\n   \
  \ row.addView(textView);\n    EditText editText = new EditText(this);\n    editText.setTextSize(TypedValue.COMPLEX_UNIT_SP,\
  \ 12);\n    editText.setHint(hintStr);\n    editText.setLayoutParams(editTextLayoutParams);\n\
  \    if (!isFirstTime) {\n        editText.requestFocus();\n    }\n    row.addView(editText);\n\
  \    // Blah, blah, blah...\n    Button button = new Button(this);\n    button.setTextSize(10);\n\
  \    button.setTypeface(null, Typeface.BOLD);\n    button.setText(\"X\");\n    button.setTypeface(\n\
  \              Typeface.SANS_SERIF, Typeface.BOLD);\n    button.setOnClickListener(new\
  \ OnClickListener() {\n        public void onClick(View view) {\n            layout.removeView(\n\
  \                (LinearLayout) view.getParent());\n        }\n    });\n    row.addView(button);\n\
  \    row.setLayoutParams(rowLayoutParams);\n    layout.addView(row);\n}\n```\n\n\
  # Activity 与栈\n\n当用户首次点击应用图标时启动的 Activity 是该应用的主 Activity（main activity）。当用户首次点击应用图标时，这个主\
  \ Activity 会成为新任务栈中的根 Activity（root activity）（起初，根 Activity 是任务栈上唯一的 Activity。随着栈的增长，根\
  \ Activity 通常保留在栈的底部。）\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg) 欲了解更多关于任务的信息，请参考本小型书籍的第\
  \ 1 章。\n\n在 Activity A 的代码中调用 `startActivity` 可以启动属于另一个应用的 Activity（Activity B）。当这种情况发生时，Android\
  \ 通过将 Activity B 推入 Activity A 的任务栈顶端来启动 Activity B。因此，一个任务可能包含属于多个应用程序的 Activity。\n\
  \n但每个任务都与单个应用程序关联——即包含该任务根 Activity 的应用程序。通常情况下，该唯一的应用程序有一个图标。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg)\
  \ 欲了解更多关于任务的信息，请参考本小型书籍的第 1 章。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg)\
  \ 欲了解更多关于任务的信息，请参考本小型书籍的第 1 章。\n\n在 Activity A 的代码中调用 `startActivity` 可以启动属于另一个应用的\
  \ Activity（Activity B）。当这种情况发生时，Android 通过将 Activity B 推入 Activity A 的任务栈顶端来启动 Activity\
  \ B。因此，一个任务可能包含属于多个应用程序的 Activity。\n\n（注：提供的原文在后半部分包含大量重复段落和碎片化句子。已根据提供的指令，在保持技术背景的同时清理了核心叙述内容。）\n\
  \n\n\n\n\n- `Intent.FLAG_ACTIVITY_CLEAR_TOP`: 如果要启动的 activity 在任务栈的某处已经有一个实例，则不在任务栈顶端添加新实例。相反，获取现有实例之上的所有\
  \ activity，并将它们从栈中弹出（是的，会销毁它们）。参见图 2-16。\n\n- `Intent.FLAG_ACTIVITY_NEW_TASK`: 每个任务都与一个应用程序关联。假设你有两个应用程序——App\
  \ A 和 App B，且当前活跃的任务与 App A 关联。在这个任务中，你调用 `startActivity` 来启动另一个应用（App B）中的 activity。会发生什么？\n\
  \n  如果没有 `FLAG_ACTIVITY_NEW_TASK` 标记，Android 将新启动的 activity 推送到当前栈的顶部。（参见图 2-17。）但如果使用了\
  \ `FLAG_ACTIVITY_NEW_TASK` 标记，Android 会查找与 App B 关联的任务。\n\n**图 2-14:** 添加 `FLAG_ACTIVITY_NO_HISTORY`\
  \ 的效果。\n\n![9781118027707-fg030214.eps](img/9781118027707-fg030214_fmt.jpeg)\n\n\
  **图 2-15:** 添加 `FLAG_ACTIVITY_SINGLE_TOP` 的效果。\n\n![9781118027707-fg030215.eps](img/9781118027707-fg030215_fmt.jpeg)\n\
  \n**图 2-16:** 添加 `FLAG_ACTIVITY_CLEAR_TOP` 的效果。\n\n![9781118027707-fg030216.eps](img/9781118027707-fg030216_fmt.jpeg)\n\
  \n- 如果 Android 找到了这样的任务，Android 将把新启动的 activity 推送到该任务中。\n\n- 如果 Android 没有找到这样的任务，Android\
  \ 将创建一个与 App B 关联的任务。（参见图 2-17。）\n\n无论之前是否存在 App B 任务，Android 都会在用户的屏幕上显示新启动的 activity。\n\
  \n**图 2-17:** 添加 `FLAG_ACTIVITY_NEW_TASK` 的效果。\n\n![9781118027707-fg030217.eps](img/9781118027707-fg030217_fmt.jpeg)\n\
  \n- `Intent.FLAG_ACTIVITY_EXCLUDE_FROM_RECENTS`: 当用户长按 Home 键时，不要显示此 activity 应用程序。\n\
  \n当你创建一个新任务时，Android 会创建一个“最近（Recents）”项。将 `FLAG_ACTIVITY_EXCLUDE_FROM_RECENTS`\
  \ 与 `FLAG_ACTIVITY_NEW_TASK` 结合可以抑制新“最近”项的创建。\n\n- `Intent.FLAG_ACTIVITY_CLEAR_TASK`:\
  \ 与 `FLAG_ACTIVITY_NEW_TASK` 配合使用，如果新 activity 已经是任务的一部分，则使包含该 activity 的任务成为活跃任务，并抹除该任务上当前的所有其他\
  \ activity。（参见图 2-18。）\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg) `FLAG_ACTIVITY_CLEAR_TASK`\
  \ 功能随着 Honeycomb 的发布加入了 Android SDK。如果你的目标版本比 Honeycomb 旧，请不要尝试使用 `FLAG_ACTIVITY_CLEAR_TASK`。\n\
  \n- `Intent.FLAG_ACTIVITY_REORDER_TO_FRONT`: 如果要启动的 activity 实例已经是当前任务的一部分，则重新排列任务的\
  \ activity，使该实例位于顶部。（参见图 2-19。）\n\n- `Intent.FLAG_EXCLUDE_STOPPED_PACKAGES`: 在搜索要启动的\
  \ activity 时，仅考虑当前处于活跃或暂停状态的 activity。\n\n这些标记标记都有一个 Java `int` 值，你可以使用 Java 的位“或”运算符（`|`）组合两个或多个标记。例如，你可以写：\n\
  \n```java\nintent.addFlags(FLAG_ACTIVITY_NEW_TASK |\n               FLAG_ACTIVITY_CLEAR_TASK);\n\
  ```\n\n结果是 `0x10000000 | 0x00008000`，即 `0x10008000`。\n\n![warning_bomb.eps](img/warning_bomb_fmt.jpeg)\
  \ `FLAG_ACTIVITY_CLEAR_TASK` 功能随着 Honeycomb 的发布加入了 Android SDK。如果你尝试在非 Honeycomb\
  \ 系统上使用此标记的数值（`0x00008000`），你不会得到编译时错误。毕竟，编译器认为 `0x00008000` 是一个完美的十六进制数，即使你将该数字传递给\
  \ `addFlags` 方法也是如此。但在运行时，非 Honeycomb 系统会说：“我无法执行 `addFlags(0x00008000)`，所以我我想显示一条粗鲁的‘应用程序意外停止’消息。”因此，为了在运行之前捕捉此类错误，请始终使用常量名\
  \ `FLAG_ACTIVITY_CLEAR_TASK` 以及其他 SDK 常量。\n\n![ontheweb.eps](img/ontheweb_fmt.jpeg)\
  \ 不用说，我创建了一个应用来帮助你实验 intent 标记。我的标记测试 App 与我在本章稍后描述的 Intentsity App 非常相似。我没有给我的标记测试\
  \ App 起一个花丽的名字，但你可以从这本书的网站下载该 App 及其源代码——[`www.allmycode.com/android`](http://www.allmycode.com/android)。\n\
  \n![tip.eps](img/tip_fmt.jpeg) 要测试你的 intent 标记，你必须跟踪在模拟器或设备上运行的应用程序、任务和 activity。这并不总是那么简单。幸运的是，Android\
  \ 的 `dumpsys` 命令可以让你看到当前状态的快照。要查看模拟器 activity 栈及其任务的最新列表，请在开发计算机的命令行窗口中输入 `adb shell\
  \ dumpsys activity`。或者，你可以登录模拟器的 shell（通过输入 `adb shell`），然后在模拟器自己的命令行窗口中执行 `dumpsys\
  \ activity` 命令。\n\n**图 2-18:** 添加 `FLAG_ACTIVITY_CLEAR_TASK` 的效果。\n\n![9781118027707-fg030218.eps](img/9781118027707-fg030218_fmt.jpeg)\n\
  \n**图 2-19:** 添加 `FLAG_ACTIVITY_REORDER_TO_FRONT`。\n\n## 第 3 章：服务\n\n在本章中，我们将探索服务，它们是在没有用户界面的情况下后台执行长时间操作的组件。\n\
  \n某些服务用于执行耗时较的任务，例如播放音乐、下载文件或从网络获取数据。\n\n### 列表 3-1：简单服务\n\n```java\npackage com.allmycode.services;\n\
  \nimport android.app.Service;\nimport android.content.Intent;\nimport android.os.IBinder;\n\
  import android.widget.Toast;\n\npublic class MyWeatherService extends Service {\n\
  \n    @Override\n    public IBinder onBind(Intent intent) {\n        Toast.makeText(this,\
  \ R.string.service_bound, Toast.LENGTH_SHORT).show();\n        return null;\n  \
  \  }\n\n    @Override\n    public int onStartCommand(Intent intent, int flags, int\
  \ startId) {\n        Toast.makeText(this, R.string.service_started, Toast.LENGTH_SHORT).show();\n\
  \        return START_STICKY;\n    }\n\n    @Override\n    public void onDestroy()\
  \ {\n        Toast.makeText(this, R.string.service_destroyed, Toast.LENGTH_SHORT).show();\n\
  \    }\n}\n```\n\n事实上，列表 3-1 中的服务代码比绝对需要的要多。作为抽象类 `android.app.Service` 类的子类，列表\
  \ 3-1 中唯一要求的方法是 `onBind`。\n\n\n\n\n我将代码 3-1 中的服务放在在它自己的 Eclipse 项目中，并拥有它自己的包名。因此，该服务在模拟器或设备上作为其独立进程中的独立应用程序运行。该服务没有用户界面（因此也没有布局文件）。应用程序的\
  \ `AndroidManifest.xml` 文件没有 `<activity>` 元素，而是有了如代码 3-2 所示的 `<service>` 元素。\n\n\
  ### 代码 3-2：Un-Weather 服务 AndroidManifest.xml 文件中的一个元素\n\n```xml\n<service android:name=”.MyWeatherService\"\
  >\n    <intent-filter>\n        <action android:name=”com.allmycode.WEATHER” />\n\
  \    </intent-filter>\n</service>\n```\n\n### 客户端 Activity\n\n为了启动代码 3-1 中的服务，其他组件引用了代码\
  \ 3-2 中命名的 action。代码 3-3 向你展示了如何操作。\n\n### 代码 3-3：Un-Weather 服务的客户端\n\n```java\n\
  package com.allmycode.demos;\nimport android.app.Activity;\nimport android.content.Intent;\n\
  import android.os.Bundle;\nimport android.view.View;\n\npublic class ServiceConsumerActivity\
  \ extends Activity {\n    Intent intent = new Intent();\n    @Override\n    public\
  \ void onCreate(Bundle savedInstanceState) {\n        super.onCreate(savedInstanceState);\n\
  \        setContentView(R.layout.main);\n        intent.setAction(“com.allmycode.WEATHER”);\n\
  \    }\n    public void onStartClick(View view) {\n        startService(intent);\n\
  \    }\n    public void onStopClick(View view) {\n        stopService(intent);\n\
  \    }\n}\n```\n\n代码 3-3 中的 activity 有两个按钮——一个启动按钮和一个停止按钮。（参见图 3-1。）\n\n**图 3-1：**\
  \ 启动和停止服务。这有多简单呢？\n\n![9781118027707-fg030301.tif](img/9781118027707-fg030301_fmt.jpeg)\n\
  \n在创建布局时，我冒昧为这两个按钮分配了监听器方法名：\n\n```xml\n<Button android:text=”Start”\n    android:onClick=”onStartClick”\n\
  \    android:id=”@+id/button1”\n    android:layout_height=”wrap_content”\n    android:layout_width=”wrap_content”>\n\
  </Button>\n<Button android:text=”Stop”\n    android:onClick=”onStopClick”\n    android:id=”@+id/button4”\n\
  \    android:layout_height=”wrap_content”\n    android:layout_width=”wrap_content”>\n\
  </Button>\n```\n\n因此，点击启动按钮调用 `startService(intent)`，点击停止按钮调用 `stopService(intent)`。除了启动和停止服务外，每次点击都会显示一个\
  \ `Toast` 视图。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg) 关于 Android\
  \ `Toast` 类的简要介绍，请参见本章节后面的“通知用户”部分。\n\n服务的主要目的是在后台运行（独立于任何明显的用户交互）并为其他应用提供帮助。因此，如果代码\
  \ 3-1 中的代码代表一个实用的服务，那么这段代码将处理与天气有关的事情。（实用的代码，请参见本章的“讨论天气”部分。）\n\n当你在操作图 3-1 中的按钮时，会发生以下情况：\n\
  \n* **按下启动然后按下停止。**\n在按下启动后，你会看到 Service Started toast。然后，在按下停止后，你会看到 Service Destroyed\
  \ toast。这里没有意外！\n* **连续按下两次停止。**\n如果服务正在运行，第一次调用 `stopService`（在代码 3-3 中）会销毁该服务。第二次调用\
  \ `stopService` 不会显示 Service Destroyed toast，因为未运行的组件无法被销毁。\n* **连续按下两次启动，然后连续按下两次停止。**\n\
  结果是，你会看到两个 Service Started toast，随后只跟着一个 Service Destroyed toast。每次 `startService`\
  \ 调用（来自代码 3-3）都会触发代码 3-1 中 `onStartCommand` 的调用。但第一次 `stop Service` 调用（再次来自代码 3-3）会销毁该服务。随后的\
  \ `stopService` 调用没有任何影响。\n* **按下启动，然后按下模拟器的返回键。**\n当你按下返回键时，你不会看到 Service Destroyed\
  \ toast。这就是 Android 服务的精髓。在启动服务的 activity 被销毁后，服务可以继续存在。\n\n### 服务启动、停止和再次启动\n\n\
  服务没有用户界面，并且在你销毁启动服务的 activity 后，它可能会继续运行。这可能是一个危险的特征组合。没有界面的服务可能会像拉斯普京一样无限期地留下来——那个沙俄时代没人能杀掉的疯僧。如果开发者不包含管理其服务的代码，服务就会阻塞系统。没人会高兴。\n\
  \n当然，Android 可以杀死服务以回收所需的内存。\n\n### 服务、线程和进程\n\n当你还是个孩子，舒服地靠在妈妈膝上时，她告诉你 Android\
  \ 服务运行在自己的线程中。遗憾的是，你妈妈错了。服务运行在应用程序的主线程中。你可以通过显示服务代码中 `Thread.currentThread().getName()`\
  \ 的值来验证这一事实。当你这样做时，你会看到 `main`。应用程序的 activity 也运行在应用程序的主线程中。因此，验证服务行为另一种方法是执行耗时工作——耗时工作包括从网络检索数据或进行计算。在主线程中执行重负载任务会导致\
  \ ANR（程序无响应）情况。\n\n\n\n\n你可以强制让活动或服务在它自己的进程中运行。要做到这一点，可以在应用的 `AndroidManifest.xml`\
  \ 文件中的 `<service>` 元素或 `<activity>` 元素添加 `android:process=\"other.process.name\"\
  ` 属性。`other.process.name` 可以是你想要的任何内容，只要它至少包含一个点。（通常情况下，`other.process.name` 是包名，例如\
  \ `com.example.mystuff`，但该名称并不非要是现有包名的一部分。）作为一个额外的好处，你可以用冒号开头进程名称（例如 `android:process=\"\
  :other.process.name\"`）。按照真正的 Unix/Linux 极客风格，这种高效的键入的冒号符号表示该额外进程是组件所属应用程序私有的。其他应用无法与这个珍贵的进程进行通信。\n\
  \n底线是说是，你应该主动启动和停止自己的服务。不要依赖系统来为你清理内存，从而成为一个内存大户。要意识到你的服务的生命周期，并在不再需要时销毁你的服务。如果合适，在\
  \ activity 的 `onPause` 或 `onDestroy` 方法中添加 `stopService` 调用。如果服务知道自己已经不再有用，让服务调用自己的\
  \ `stopSelf` 方法。\n\n![cross-reference.eps](img/cross-reference_fmt.jpeg) 每当用户旋转设备时（例如从竖屏切换到横屏），Android\
  \ 都会调用活动 的 `onDestroy` 方法。如果你在 activity 的 `onDestroy` 方法中放置了 `stopService` 调用，你必须处理服务停止的所有可能情况。详情请参阅本章的“讨论天气”章节。\n\
  \n## 在启动时运行服务\n\n你的服务有多重要？你的服务是否在用户按下特定按钮的少数情况下启动？还是说你的服务会在设备上电时启动？\n\n如果 Android\
  \ 用户没有你的服务就无法生存，你可以在启动时启动服务。要做到这一点，你需要创建另一种组件——广播接收器。\n\n广播接收器响应你使用 `sendBroadcast`\
  \ 或 `sendOrderedBroadcast` 方法抛出的意图（intent）。Android 对使用这两个方法之一发送的意图提供了特殊处理。\n\n-\
  \ 当你调用 `startActivity` 或 `startService` 时，Android 会寻找一个组件来满足意图。\n\n如果系统发现多个合适的活动（例如安装了两个\
  \ Web 浏览器），Android 会显示一个对话框提示用户在备选项之间进行选择。\n\n- 当你调用 `sendBroadcast` 或 `sendOrderedBroadcast`\
  \ 时，Android 会触发所有过滤器满足意图的接收器。\n\n使用 `sendOrderedBroadcast` 时，Android 会按顺序运行接收器。每个接收器可以将意图传递给队列中的下一个接收器，也可以通过调用其\
  \ `abortBroadcast` 方法中断链。\n\n使用 `sendBroadcast` 时，Android 可能会交替运行多个接收器。在这种情况下，让接收器中止广播是没有意义的。\n\
  \n考虑列表 3-1 中的气象服务。在同一个应用程序中，使用列表 3-4 中的代码创建一个 Java 类。\n\n### 列表 3-4：简单的广播接收器\n\n\
  ```java\npackage com.allmycode.services;\n\nimport android.content.BroadcastReceiver;\n\
  import android.content.Context;\nimport android.content.Intent;\n\npublic class\
  \ MyBootReceiver extends BroadcastReceiver {\n  @Override\n  public void onReceive(Context\
  \ context, Intent intent) {\n    Intent serviceIntent = new Intent();\n    serviceIntent.setClass(context,\n\
  \                         MyWeatherService.class);\n    context.startService(serviceIntent);\n\
  \  }\n}\n```\n\n当 `MyBootReceiver` 运行时，它会启动 `MyWeatherService` 类的一个实例。并不难的技巧是让模拟器或设备启动时运行\
  \ `MyBootReceiver`。\n\n列表 3-5 向你展示了启动列表 3-4 中接收器的机制。\n\n### 列表 3-5：列表 3-4 中接收器的\
  \ Manifest 元素\n\n```xml\n<uses-permission android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"\
  />\n<application android:icon=\"@drawable/icon\"\n             android:label=\"\
  @string/app_name\">\n  <service android:name=\".MyWeatherService\">\n    <intent-filter>\n\
  \      <action android:name=\"com.allmycode.WEATHER\" />\n    </intent-filter>\n\
  \  </service>\n  <receiver android:name=\".MyBootReceiver\">\n    <intent-filter>\n\
  \      <action android:name=\"android.intent.action.BOOT_COMPLETED\" />\n      <category\
  \ android:name=\"android.intent.category.DEFAULT\" />\n    </intent-filter>\n  </receiver>\n\
  </application>\n```\n\n带有 `android:name=\"android.permission.RECEIVE_BOOT_COMPLETED\"\
  ` 的 `uses-permission` 元素授予此应用接收启动的权限。`application` 元素包含 `service` 和 `receiver`。`service`\
  \ 元素拥有 `android:name=\".MyWeatherService\"` 和针对动作 `com.allmycode.WEATHER` 的 `intent-filter`。`receiver`\
  \ 元素拥有 `android:name=\".MyBootReceiver\"` 以及针对动作 `android.intent.action.BOOT_COMPLETED`\
  \ 和类别 `android.intent.category.DEFAULT` 的 `intent-filter`。\n\n\n\n\n\n`Activity\
  \ A` 调用 `startService` 来启动 `MyService`。\nAndroid 实例化 `MyService` 并调用实例的 `onStartCommand`\
  \ 方法。\n\n`Activity B` 调用 `startService` 来启动 `MyService`。\nAndroid 调用现有实例的 `onStartCommand`\
  \ 方法。\n\n`Activity A` 调用 `stopService` 来停止 `MyService`。\nAndroid 销毁 `MyService`\
  \ 实例。\n\n`Activity B` 调用 `stopService` 来停止 `MyService`。\nAndroid 说：“你白忙了。”这里没有 `MyService`\
  \ 的实例可以停止。\n\n- 你可以对服务进行绑定，并从服务上解绑定。\n\n你通过调用 `Context` 类的 `bindService` 和 `unbindService`\
  \ 方法来实现这一操作。在绑定和解绑定之间，你与服务保持着一个持续的连接。通过这个连接，你可以向服务发送消息并从服务处接收消息。这非常有用！\n\n当你调用 `bindService`\
  \ 时，如果已经没有运行中的实例，Android 会创建一个服务的实例。此外，Android 会调用服务的 `onBind` 方法。（例如，请跳到列表 3-6\
  \ 和 3-7。）\n\n![remember.eps](img/remember_fmt.jpeg) 当你调用 `bindService` 时，Android\
  \ 不调用服务的 `onStartCommand` 方法。\n\n对 `bindService` 的调用会堆积。一个服务可以同时拥有多个绑定，每个绑定对应不同的活动。你的服务代码可以通过维护一个绑定对象的集合（`ArrayList`\
  \ 或其他类型）来跟踪所有的这些活动。当你调用 `unbindService` 时，并不会销毁服务实例。只要有活动绑定到该服务，Android 就会保持服务的活跃。\n\
  \n![technicalstuff.eps](img/technicalstuff_fmt.jpeg) 服务可以同时接收启动请求和绑定请求。当所有绑定的活动都从某个特定服务解绑时，系统会检查这段时间内是否有人启动过服务。如果是，系统将等待有人调用\
  \ `stopService` 后再销毁该服务。\n\n![remember.eps](img/remember_fmt.jpeg) Android 可以终止活动以回收内存。如果我是一个服务，而\
  \ Android 终止了绑定到我身上的活动，我会担心自己的生存。请测试你的应用，防止因活动及其服务的非预期终止而产生意外结果。如果在测试中，你由于服务的过早终止而遇到任何异常行为，请修复代码。\n\
  \n前几节的示例启动并停止了服务。本章的其余部分将与服务进行绑定和解绑定。\n\n# 论天气\n\n每本 Android 书籍都需要一个天气服务的示例，本书也不例外。在本节中，你的活动绑定到一个服务，而该服务转而通过互联网获取天气信息。\n\
  \n## 服务\n\n我分阶段构建这个示例。第一阶段是服务的本质。一个活动绑定到服务，get 无意义查询获取一些虚假响应，然后解绑定。列表 3-6 包含了该服务。\n\
  \n### 列表 3-6：一个害怕承诺的天气服务\n\n```java\npackage com.allmycode.services;\nimport android.app.Service;\n\
  import android.content.Intent;\nimport android.os.Bundle;\nimport android.os.Handler;\n\
  import android.os.IBinder;\nimport android.os.Message;\nimport android.os.Messenger;\n\
  import android.os.RemoteException;\nimport android.widget.Toast;\n\npublic class\
  \ MyWeatherService extends Service {\n  Messenger messengerToClient = null;\n  MyIncomingHandler\
  \ myIncomingHandler =\n      new MyIncomingHandler();\n  Messenger messengerToService\
  \ =\n      new Messenger(myIncomingHandler);\n  @Override\n  public IBinder onBind(Intent\
  \ intent) {\n    doToast(R.string.service_bound);\n    return messengerToService.getBinder();\n\
  \  }\n  class MyIncomingHandler extends Handler {\n    @Override\n    public void\
  \ handleMessage(Message incomingMessage) {\n        messengerToClient = incomingMessage.replyTo;\n\
  \        Bundle reply = new Bundle();\n        reply.putString(\"weather\", \"It’s\
  \ dark at night.\");\n        Message replyMessage = Message.obtain();\n       \
  \ replyMessage.setData(reply);\n        try {\n          messengerToClient.send(replyMessage);\n\
  \        } catch (RemoteException e) {\n          e.printStackTrace();\n       \
  \ }\n        doToast(R.string.message_handled);\n    }\n  }\n  @Override\n  public\
  \ boolean onUnbind(Intent intent) {\n      doToast(R.string.stopped_itself);\n \
  \     stopSelf();\n      return false;\n  }\n  @Override\n  public void onDestroy()\
  \ {\n    myIncomingHandler = null;\n    doToast(R.string.service_destroyed);\n \
  \ }\n  void doToast(int resource) {\n    Toast.makeText(this, resource, Toast.LENGTH_SHORT).show();\n\
  \  }\n}\n```\n\n列表 3-6 中的控制流并不简单，因此我创建了图 3-2 来帮助你理解。图 3-2 中首先注意到的点是，服务并没有与客户端交互。相反，服务通过\
  \ Android 操作系统间接接收调用。\n\n**图 3-2**：绑定与消息传递。\n![97811027707-fg03032.eps](img/97811027707-fg03032_fmt.jpeg)\n\
  \n与其他许多通信一样，客户端与服务之间的对话有两个阶段：\n- 第一阶段（绑定阶段）建立了通信链路。\n- 在第二阶段，客户端和交换交换信息。通常情况下，客户端发送请求，服务发送回复。\n\
  \n要绑定到服务，客户端发送一个 `Intent`。Android 将此 Intent 传递给服务的 `onBind` 方法。作为响应，`onBind` 方法返回一个\
  \ binder——一个实现了 `IBinder` 接口的对象（见列表 3-6 和图 3-2）。binder 就像一张名片。通过返回 binder，服务说：“Android，告诉客户端可以通过这个地址找到我。”这就是为什么在列表\
  \ 3-6 中，服务是从 `MyIncomingHandler` 的实例创建 binder 的（就像打印号码）。\n\nAndroid 将 binder 交付给客户端应用。最终，客户端应用查询服务。查询包含了对特定信息的请求。但查询还包含一个\
  \ `replyTo` 字段。服务的内部类（在本例中为 `MyIncomingHandler`）使用 `replyTo` 信息向客户端应用。在列表 3-6 中，无论客户端发送什么，我都简单地回复\
  \ `晚上很黑`。（这样的天气报告总是正确的。）\n\n## 客户端\n\n列表 3-7 包含了列表 3-6 服务的客户端。\n\n### 列表 3-7：列表\
