    ## PREFACE


    It was at the end of the month of September, 1907, that the writer visited Java
    with the object of spending a brief vacation there.


    The outcome was a series of articles in the "Straits Times," and after they appeared
    so many applications were made for reprints that we were encouraged to issue the
    articles in handy form for the information of those who intend to visit the neighbouring
    Dutch Colony. There was no pretension to write an exhaustive guide-book to the
    Island, but the original articles were revised and amplified, and the chapters
    have been arranged to enable the visitor to follow a given route through the Island,
    from west to east, within the compass of a fortnight or three weeks.


    For liberty to reproduce some of the larger pictures, we are indebted to Mr. George
    P. Lewis (of O. Kurkdjian), Sourabaya, whose photographs of Tosari and the volcanic
    region of Eastern Java form one of the finest and most artistic collections we
    have seen of landscape work.


    Singapore, *July, 1908*.


