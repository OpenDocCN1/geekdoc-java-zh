    It is more archæological than descriptive, however, and we must acknowledge our
    indebtedness again to Miss Scidmore for the following passage to show the scope
    of the sculptures:—


    ### Buddha statue in a niche.


    "The everyday life of the seventh and eighth century is pictured—temples, palaces,
    thrones and tombs, ship and houses, all of man''s constructions are portrayed.
    The life in courts and palaces, in fields and villages, is all seen there. Royal
    folk in wonderful jewels sit enthroned, with minions offering gifts and burning
    incense before them warriors kneeling and maidens dancing. The peasant ploughs
    the rice-fields with the same wooden stick and ungainly buffalo, and carries the
    rice-sheaves from the harvest field with [56]the same shoulder poles, used in
    all the farther East to-day. Women fill their water-vessels at the tanks and bear
    them away on their heads as in India now, and scores of bas-reliefs show the unchanging
    costumes of the East that offer sculptors the same models in this century. Half
    the wonders of that great three-mile-long gallery of sculptures cannot be recalled.
    Each round disclosed some more wonderful picture, some more eloquent story. Even
    the humorous fancies of the sculptors are expressed in stone. In one relievo a
    splendidly caparisoned state elephant flings its feet in imitation of the dancing
    girl near by. Other sportive elephants carry fans and state umbrellas in their
    trunks; and the marine monsters swimming about the ship that bears the Buddhist
    missionaries to the isles have such expression and human resemblance as to make
    one wonder if those pillory an enemy with their chisels, too. In the last gallery,
    where, in the progress of the religion, it took on many features of Jainism, or
    advancing Brahmanism, Buddha is several times represented as the ninth avatar,
    or incarnation, of Vishnu, still seated on the lotus cushion and holding a lotus
    with one of his four hands."


    In all probability, the masonry was shaken down by an earthquake, the `Boro Budur`
    being near three volcanoes. Restorative and preservative work is now being carried
    on by the Government, and some of the smaller temples in the `Djocja` district
    are restored in the original design.


    ### A gallery at Boro Budur.


    ### The Bara Budur—One of the Galleries.


    ### Smeroe volcano.


    ### The Sméroe—13,000 Feet High.


    There is a small hotel at the `Boro Budur` where one is recommended to stay when
    studying details, and we can well believe that sunrise as seen from the summit
    is a sight one should never forget. We saw it in the early afternoon when the
    heat vapours from the noontide sun partially obliterated the landscape, but even
    so it was impressive. Except on the right, where the mountains close in the horizon,
    the eye has a range of many miles over fertile alluvial plains, studded with coco
    and banana and palm trees, and every other patch of ground cultivated "like a
    tulip bed." Miss Marianne North, whose collection of paintings in Kew Gardens
    may be familiar to some of our readers, wrote of this view: "The very finest view
    we ever saw."


    ***


    ## The Temples of Parambanan.


    There are other Buddhist ruins in the neighbourhood of the `Boro Budur`; but the
    other more important collection is scattered over the region between `Djocjakarta`
    and `Soerakarta`. One small temple, the `Tjandi Kali Bening`, is reputed to be
    the gem of Hindu art in Java. This we did not see; but, on another day, in a victoria
    drawn by four small ponies, kept going by the wild gr-r-r-ee gr-r-r-eeing of our
    native running footman, we drove to the scattered temples on the Plain of Parambanan,
    where, with the help of another archæological guide by `Dr. I. Groneman`, we were
    able to appreciate the beauties of these 1100-year-old centres of ancient religious
    devotees. These temples are the most interesting in the country, though lacking
    the extent and grandeur of the `Boro Budur`. Though they do not contain a single
    genuine Buddha figure, but many images of Brahmanic gods, `Dr. Groneman` says
    there are many reasons to justify the opinion that they were built by Buddhists,
    probably over the ashes of princes and grandees of a Buddhistic empire.


    In his report to Sir Stamford Raffles on these Parambanan ruins, Captain George
    Baker, of the Bengal establishment wrote:—"In the whole course of my life, I have
    never met with such stupendous and finished specimens of human labour and of the
    science and taste of ages long since forgot, crowded together in so small small
    compass, as in this little spot, which, to use a military phrase, I deem to have
    been the headquarters of Hinduism in Java."


    In Volume XIII of the "Asiatick Researches or Transactions of the Society instituted
    in Bengal for inquiring into the History and Antiquities, the Arts, Sciences and
    Literature of Asia" (Calcutta, 1820), `Mr. John Crawfurd`, who, apparently, visited
    Java in 1816, gives a long and interesting description of the ruins on the Plain
    of Parambanan. He describes the locale as ten miles from `Djocjakarta`, a valley
    lying between `Rababu` and `Marapi` to the north and a smaller southern range
    of high land.


    A few of the ruins consist of single isolated temples, but the greater number
    are in groups, rows of small temples surrounding larger temples.


    The shape of the smaller temples is worthy of observation. From the foundation
    to the lintels of the doors, they are of a square form. They then assume a pyramidal
    but round shape, and are decorated around by small figures resembling `Lingas`,
    while a larger `Linga` surmounts the whole building, forming the apex of the temple.


    Invariably, the sites of the temples are adjacent to abundant supplies of clear
    water so much desired by the Hindus and so necessary to the performance of the
    ritual. Beside two rivers of the purest water, there is between the villages of
    `Parambanan` and `Plaosan` a small tank, evidently an appendage to the temples.
    This little piece of water is a square of about 200 feet to the side. The ground
    around it is elevated, and there is every appearance of its being an artificial
    excavation. The whole tank, when visited by `Mr. Crawfurd`, was covered with blue
    lotus, the flower of which is so conspicuous an ornament of the sculptures of
    the temple.


    Then, as now, there was no evidence of Hindu descendants of the builders of these
    religious houses and places of worship, but the Javanese are as tolerant of various
    religious cults as the Chinese or the Japanese, and the visitor need not be surprised
    to find native visitors making what appears to be a pilgrimage to some particular
    shrine.


    `Mr. Crawfurd` found barren women, men unfortunate in trade or at play, persons
    in debt and sick persons propitiating the Goddess `Durgá`, "smeared with perfumed
    unguents or decked with flowers." This worship, too, was not confined to the lower
    orders. His Highness the `Susuhunan` when meditating an unusually ambitious or
    hazardous scheme made offerings to the image.

