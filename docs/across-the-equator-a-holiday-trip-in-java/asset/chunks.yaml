    \ `www.gutenberg.org/contact` 上找到。\n\n### 第 4 节 关于向 Project Gutenberg 文学基金会捐赠的信息\n\
    Project Gutenberg™ 依赖于广泛的公众支持和捐赠，没有这些支持无法履行其使命，即增加可以通过广泛设备（包括过时设备）读取机器格式的公领域作品和许可作品。许多小额捐赠（1\
    \ 美元至 5000 美元）对于维持 IRS 的免税地位尤为重要。\n\n基金会致力于遵守美国 50 个州监管慈善和慈善捐赠的法律。合规要求并不统一，需要大量的努力、文工作和费用来满足并跟进这些要求。在没有收到书面合规确认的情况下，我们不在相关地区募集捐赠。要进行捐赠或确定任何州的合规状态，请访问\
    \ `www.gutenberg.org/donate/`。\n\n虽然我们不能从未达到合规要求的地区募集捐赠，但我们并不禁止接受来自此类地区主动联系我们并提供捐赠的捐赠者。我们感谢捐赠，但无法对从美国境外收到的捐赠的税务处理做出任何说明。仅美国的法律就让我们的小团队应于不堪。请查看\
