    # 酒店与旅行设施


    在前往 `Java` 之前，游客应当了解该岛自受欧洲统治以来的历史轮廓。如果不仅仅是一个不加思考的环球旅行者，那么欧洲旅行的魅力有一半在于所到之处的历史关联，而正是这种特质的相对匮乏，剥夺了新国家对受过教育的人们应拥有的趣味。光有风景是会审美疲劳的。


    在 `Java`，正如大多数东方国家一样，旅行者觉得自己正置身于古老的氛围之中。尽管称之为“永恒的东方”已成为一种误称，但在由 `菲律宾和马来群岛` 组成的大群岛屿中，从北的
    `Luzon` 到南的 `Java`，从东的 `Samar` 到西的 `Sumatra`，几个世纪的西方接触对当地人的性格仅留下了微小的印记。那里无疑发生了变化。现代文明像一股不可阻挡的浪潮一样推进，逐渐吞噬了一个古老的文明，但在
    `Java`，人们感到这种变化并不那样决绝；尽管有铁路、运河和耕作，`爪哇人`与`日本人`在总体发展水平上的差异仍然非常显著，即使是华人，尽管他们在许多方面都很保守，也拥有更多的特色，且在接收和发展西方思想方面这片土地看起来更有希望。


    通过研读 `Sir Stamford Raffles''` 的历史，可以为 `Java` 之行奠定坚实的基础，该书的第二版于 1830 年出版，可在 `Raffles
    Library` 找到。它涵盖了从 1510 年`葡萄牙人`到达`远东`到英国占领的全时期。`Albuquerque` 以`马六甲`为总部，向周围岛屿派遣了多次远征，而
    `Antonio de Abrew` 是他前往 `Java` 和马鲁古群岛的使者。荷兰人于 1595 年出现，在 `Bantam` 在`东印度群岛`立足，`东印度公司`于
    1602 年在同一地点建立了工厂。


    关于英军攻占 `Java` 的细节已给出简要介绍。


    骑马军官 `William Thorn 尉`（曾担任一名旅长的参谋）提供了一份关于“征服爪哇”的有趣记载。该书写于 1815 年他回英国的途中，书中有大量的实地地图，增加了访问
    `Batavia`、`Buitenzorg` 以及 `Samarang` 和 `Sourabaya` 海港的趣味。


    我们感谢馆长 `Hanitsch 博士` 提供以下 `Raffles Library` 中关于 `Java` 的书单：


    *   `The Dutch in Java`；1904 年，`Clive Day` 著。

    *   `Java, Facts and Fancies`；1905 年，`Augusta de Wit` 著。

    *   `Facts and Fancies about Java`；1908 年，`Augusta de Wit` 著。

    *   `Life in Java, 2 vols`；1864 年，`W. B. d''Almeida` 著。

    *   `Voyage Round the World`；1870 年，`Marquis de Beauvoir` 著。

    *   `With the Dutch in the East`；1897 年，`W. Cool` 著。

    *   `Geschiedenis der Nederlanders of Java`；1887 年，`M. L. Deventer` 著。

    *   `From Jungle to Java`；1897 年，`Arthur Keyser` 著。

