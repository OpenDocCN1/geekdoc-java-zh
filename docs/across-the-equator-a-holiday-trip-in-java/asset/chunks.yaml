    # A Visit to Java and the Boro Budur


    A visit to Java would be incomplete did it not include a pilgrimage to the marvellous
    products of religious fervour which Buddhism reared in the plains around Djocjakarta
    before it went down before the all-conquering onslaught of Moslemism. These ruins
    testify to an ancient art and civilisation and culture and an instinct of creation
    few are aware of to-day, and it is hard to resist the temptation to indulge in
    extravagant language when attempting to describe them as they now stand, partially
    restored by the Dutch authorities.


    Miss Scidmore has lavished the wealth of her luxuriant vocabulary upon them, but
    neither she, nor any of her predecessors in the work of praise, saw them as they
    stand to-day—a wonder alike to archaeologist, architect, artist and student of
    comparative religions. Here in the centre of fertile plains we have the real Java
    of ancient times.


    ## The Discovery of the Ruins


    The Dutch had been in possession of the island for two hundred years without discovering
    the rich deposits hidden beneath the accumulated mounds of centuries and buried
    under a mass of tropical vegetation. To the active mind of Sir Stamford Raffles
    the discovery was due. He went to Java as Lieutenant-Governor in 1811, and during
    the period it was under his control, he had the mounds explored, the ruined temples
    un-earthed and their historic import co-related with the romantic legends and
    poetic records rescued from the archives of the native princes. It was due to
    the investigations of this great Englishman that the date of the construction
    of the temples was fixed at the beginning of the seventh century of the Christian
    era, and subsequent investigators (prominent amongst whom must be placed Dr. I.
    Groneman, now and for many years resident of Djocjakarta and Honorary President
    of its Archaeological Society) agree in accepting this period as authentically
    proved from the ruins themselves.


    People crossing a bridge.


    Sir Stamford was of opinion that the temples, as works of labour and art, dwarf
    to nothing all wonder and admiration at the great pyramids of Egypt; but since
    his time, it must not be forgotten, much richer discoveries in ancient art and
    archæological lore have been made in Egypt and Palestine. Alfred Russell Wallace,
    Brumund, Fergusson, all join in the chorus of praise, and the latter, in his "History
    of Indian and Eastern Architecture," expresses the opinion that the Boro Budur
    is the highest development of Buddhist art, an epitome of all its arts and ritual,
    and the culmination of the architectural style, which, originating at Barhut a
    thousand years before—that is more than twenty-one centuries ago—had begun to
    decay in India at the time the colonists were erecting this masterpiece of the
    ages in the heart of Java.


    People by a river.


    ## Travelling to Boro Budur


    To reach the Boro Budur, one takes the steam tram from Djocja to Moentilan. There
    a dog-cart may be hired for three guilders, and, taking the Temple or Tjandi of
    Mendoet on the way, the Boro Budur may be reached in an hour and a half from Moentilan.
    Miss Scidmore was able to write with her customary enthusiasm about this road;
    but, truth to tell, we found the drive far from pleasant. Until one gets within
    a quarter of a mile of the ruins, the surface is bad and some of the small bridges
    so dangerous that we dismounted at the driver''s request. The dog-cart, also,
    is far from an agreeable vehicle in which to travel, and if a better carriage
    could be found we would advise its being hired. Wherever one goes in Java, the
    public vehicles are in a state of decay, far more disreputable than the gharry
    of Singapore, and a large number of the ponies are decrepit and suffering from
    open sores. If Java is to become a tourist country the vehicles should be better
    supervised.


    Before setting out from Djocjakarta, the visitor should get the hotel proprietor
    to communicate with the stationmaster at Moentilan, with the object of having
    a more comfortable carriage than fell to our unhappy lot through leaving the matter
    to haphazard.


    ## The Structure of Boro Budur


    Strictly speaking, the Boro Budur—which means the collection of Buddas—is not
    a building in the sense that we speak of St. Paul''s or St. Peter''s. A small
    hill has been cut down and the earthwork surrounded by masonry, uncemented, unjointed,
    layer upon layer, and there is no column, pillar, or true arch. It is supposed
    that it was built by some of the first Buddhist settlers from India as the resting
    place (`dagaba`) of one of the urns containing a portion of the ashes of Buddha.


    Bas relief at Boro Budur.


    Bas Relief—Bara Budur.


    Bas relief at Boro Budur.


    Bas Relief—Bara Budur.


    It is difficult to describe it briefly, but the following extract from Miss Scidmore''s
    book seems to us to convey the best idea of the structure in general terms:—


    "The temple stands on a broad platform, and rises first in five square terraces,
    inclosing galleries or processional paths between their walls, which are covered
    on each side with bas-relief sculptures. If placed in single line, these bas-reliefs
    would extend for three miles. The terrace walls hold four hundred and thirty-six
    niches or alcove chapels, where life-size Buddhas sit serene upon lotus cushions.
    Staircases ascend in straight lines from each of the four sides, passing under
    stepped or pointed arches, the keystones of which are elaborately carved masks,
    and rows of sockets in the jambs show where wood or metal doors once swung. Above
    the square terraces are three circular terraces, where seventy-two latticed dagabas
    (reliquaries in the shape of the calyx or bud of the lotus) inclose each a seated
    image, seventy-two more Buddhas sitting in those inner, upper circles, of Nirvana,
    facing a great dagaba, or final cupola, the exact function or purpose of which
    as key to the whole structure is still the puzzle of archæologists. This final
    shrine is fifty feet in diameter, and either covered a relic of Buddha, or a central
    well where the ashes of priests were deposited, or is a form surviving from the
    tree-temples of the earliest East when nature-worship prevailed. The English engineers
    made an opening in the solid exterior, and found an unfinished statue of Buddha
    on a platform over a deep well-hole."


    Boro Budur scene.


    We read this description among others before we visited the Boro Budur, and must
    confess that from none of them did we get a correct idea of what we were to see.
    It must be seen to be realised. Not even photographs give a true conception of
    the ornate character of the stonework—the hard but freely-worked lava stone having
    lent itself easily to the chisel. Like Cologne or Milan Cathedrals, it must be
    examined minutely to grasp the elaborateness of the sculptured work, but, unlike
    either of these, it does not produce an immediate impression of grandeur and religious
    elevation. It is unlike any of the temples in Japan, or, indeed, anywhere, though
    Ceylon and India may suggest comparisons.


    What will strike the visitor as he perambulates these miles of sculptured terraces
    is the complete absence of any offensive or indecent figure. Mere nudity is not,
    of course, an outrage to the artistic soul; but here there is not even a nude
    or grotesque figure. Each is draped in the fine flowing robes of the East, not
    in monotonous regularity but suggestive of prince and peasant, princess and maids,
    down even to the jewels they wear. Strangely enough, no particularly Javanese
    type of face or figure is represented—all are Hindu, Hindu-Caucasian and pure
    Greek.


    It is not our purpose to give elaborate details of this work of religious art.
    The visitor may obtain at Djocjakarta a copy of Dr. Groneman''s learned treatise
    on the subject, a treatise which will teach him something about Buddhism as well
    as the Boro Budur, of which Dr. Groneman has made an exhaustive study. With his
    guide, the sculptures become an open book to the visitor.

    '
