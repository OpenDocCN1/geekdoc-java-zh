    这种织物的样式被称为 `bátik`。根据白色、黑色或红色底色的不同，分别被称为 `bátik látur púti`、`bátik látur irang`或
    `bátuk látur bang`。为了准备好接受设计，布料需浸泡在米水中，晾干并上光。`bátik` 的制作过程是使用液态热蜡，通过 `chánting`（蜡笔）进行。`chánting`
    通常由银或铜制成，可容纳约一盎司液体。管子固定在一根小木棍末端并握在手中，在紧绷悬挂的布料两侧勾勒出图案。


    当轮廓完成后，布料上想要保留白色或呈现除大背景色以外的任何颜色的部分，都以同样的方式小心地覆盖上液蜡，然后将布料浸入图案背景所需的任何颜色的染料中。覆盖了蜡的部分会阻隔染料的作用，当通过浸泡在热水直到熔化来去除蜡时，就会发现这些部分保持了原始状态。如果需要涂上其他颜色，则重复此过程。由此可见，这需要相当的技巧。通常情况下，`bátik`
    的制作过程对于普通图案大约需要十天，而对于精美复杂的图案则需要十五到十七天。当地贵族和欧洲女士穿着的一些纱笼（sarongs）不仅图案和制作精美，而且价格昂贵。


    ### 爪哇工业


    在雅加达（Djocjakarta）附近的游览中，我们有充分的机会观察爪哇人的产业。无论走到哪里，都能看到长长的队伍，矮小的女性勇敢地背负着沉重的负担，有时胯部上用背带（slandang）还背着一个婴儿。巽丹人（Soendanese）那种活泼俏皮的神态在这里并不常见。一切似乎都被沉重体力生活的严肃感所压抑。田野间传不出歌声；当我们的
    `kreta`（马车）咯哒着驶过时，辛勤耕种水稻苗的人几乎没有抬头。当母亲们在田里劳作时，孩子们在路旁玩耍，或偶尔协助父母。


    ### 爪哇的甲状


    我们惊讶地发现，在这些肥沃的平原上，甲状在女性中是如此普遍。从门恩蒂兰（Moentilan）到婆罗布屠（（Boro Budur）的途中，每二十人中至少有一个患此病。我们在门恩蒂兰等电车时向一位当地官员提到这一事实，他向我们保证这种病在普通百姓中非常普遍，但男性的受害比例没有女性那么。爪哇人将这种疾病称为“kondo”。我们不知道荷兰官员是否对这种疾病进行过科学调查；但如果知道为什么它在这一地区如此流行，将非常有意义。甲状通常与居住山区的人有关，但我们从未在普兰格尔（Preanger）注意到它，在东爪哇的山山上也几乎没有。


    士兵游行。


    #### 雅加达苏丹的士兵。


    自上述内容写后，我们有机会参考了斯坦福德·拉福斯爵士（Sir Stamford Raffles）的《爪哇史》。他发现甲状在爪哇和苏门答腊岛都很普遍，但他谨慎地解释说，这是在某些山区观察到的。当地人将其归因于水质，但拉福斯爵士说，“似乎有充分的理由认为，这与其归因于大气有关。为了证明这一点，可以提到在岛东部的腾格山（Teng''ger）脚下有一个村庄，每个家庭都受到这种病的困扰，而在另一个海拔更高、溪流流经并供双方使用的村庄，却没有出现这种畸形。这些肿块在某些家族中被认为是遗传的，似乎与地理位置无关。现任万隆（Bandung）阿迪帕（Adipati）（1811-15）家族的一个分支深受此影响，值得注意的是，它们主要发生于该家族的女性身上。它们从不产生剧性痛苦或导致早死，可以被看作是畸形而非疾病。人们从未尝试过消除它们。”


    ### 从三泗到雅加达的旅程


    我们通过常规路线经马奥斯（Maos）到达雅加达。情况可能会让旅行者偏离常路，我们感谢一位朋友对这段从三泗越越山到达雅加达旅程的简短描述：——


    “从三泗到雅加达的常规行程经由梭罗（Solo/Soerakarta），但这条路线索然无味，铁路穿过稻田所在的低洼地带。我建议选择经威廉一世（Willem I）的更有趣的路线。从上午
    5.57 或 8.17 出发，在下午 2.16 或下午 5.10 到达雅加达。我发现上午 10.50 的火车只到了马格朗（Magelang），因此我在下午
    2.9 出发，在经过了一段愉快的行驶后到达了科东·贾蒂蒂（Kedoeng Djattie），这是一个极好的枢纽站，我们在那里换了车。接下来的两小时车程穿丘陵、林带和美丽的植被，随着火车向威廉一世攀升，每隔一会儿就能瞥到宜人的山谷、稻田和远处的山丘。我们大约在下午
    5 点到达此处，正好可以享受清爽的凉风，并欣赏酒店对面小山上的美景和日落。


    第二天早晨，我乘坐了（上午 8.54）的火车，它在上午 5.57 从三泗出发，经过短途到达一个车站，在那里换成了齿轮系统，因为坡度太大普通火车无法胜任。我们向上攀爬，直到进入云层，空气变得非常清新且提神。在从威廉一世出发前应预订午餐，午餐会被送到车上。大约一点钟，我们换回了普通火车，经马格朗下山到达雅加达。对于任何访问三泗的人，我推荐这段旅程。”


    雅加达本身的主要景观是水城堡。这次旅程不需要超过两个小时，其欣赏价值取决于访问者的品味。大自然对建筑造成了破坏，但留下了许多隧道、洞穴、浴池和如监狱般的房间。随处可见破败和荒凉的迹象；尽管如此，支付小笔费用，当地人会引导你穿过雕刻的拱门、地下大厅、通道和囚室。当你站在巨大的宴会厅里时，可以想起过去时代的仪式，并在脑海中想象随从环绕在苏丹及其后宫周围，而衣着华丽的妓女为“上层人士”唱歌跳舞。


    ### 东爪哇的疗地


    腾格山的托萨里（Tosari）是我们旅行的目的地。我们渴望离开平原的炎热，因为太阳现在跨越了赤道，爪哇正处于夏季，随时可能下雨。从雅加达出发，我们本应赶在晚餐前到达泗（Surabaya），但门恩蒂兰的冲刷仍导致交通延误，我们到达目的地时迟了两个小时。

    '
- fmt: '

    Sourabaya is the most important port and business centre of Java, but this fact
    notwithstanding many of the foreign business houses still maintain their headquarters
    in Batavia. As a place of residence, each has its good points, and those who have
    lived in both are divided in preference. Possibly we were not in either long enough
    to form a lasting opinion, but we stayed so long in Sourabaya that we prefer Batavia.
    It would be sheer ingratitude, however, not to acknowledge the hearty welcome
    we received from the British colony in Sourabaya, and the personal help of members
    of that community. Here where the principal business of Java is conducted, as
    elsewhere throughout the Far East, it was satisfying to one''s patriotism to see
    the respect in which British commercial enterprise and integrity is held by native
    and European alike, and that the most cordial good feeling exists on all sides.


    To reach Tosari, the visitor proceeds first of all by train to Pasoeroean, leaving
    Sourabaya (Goebeng Station) at 6.42 a.m., and reaching Pasoeroean at 8.23. Here
    a single-pony carriage is engaged (two and a-half guilders) as far as Pasrepan,
    where a change is made to a two-pony carriage (three guilders). This conveyance
    takes one to Poespo, 2,600 feet above sea-level. A halt is made for tiffin in
    this delightful little hotel, whose pleasant looking proprietress, unfortunately,
    does not speak English. The remainder of the journey to the Sanatorium (6,000
    feet) is made in the saddle or by sedan chair. Of this ride and a subsequent excursion
    we have painful recollections, but anyone accustomed to the saddle will enjoy
    this ascent through mountain scenery and vegetation, and even more the morning
    trip down to Poespo, through the forest, when returning to Sourabaya.


    Tosari has been described as the Darjeeling of the Netherland Indies.


    Here within four days'' journey from Singapore, one may obtain a complete change
    of climate, and if there were only more frequent direct steamer communication
    between Singapore and Sourabaya, we predict with confidence that Tosari would
    become a favourite health resort for those who live on the northern side of the
    Equator. The rooms are comfortable, the food is good, the facilities for amusements
    at nightfall are ample, the walks and excursions are inexhaustible and the views
    are magnificent. The tariff (seven guilders per day—$4.90 in Singapore currency)
    is higher than that of any other hotel in Java, but those who intend to stay for
    a fortnight or more could probably arrange more favourable terms.


    There is a resident doctor who has graduated in the Schools of Tropical Medicine,
    and when we were in Tosari there were visitors from Burma, Siam, Singapore, Penang,
    and all parts of Java, recruiting from malaria and other ailments peculiar to
    Far Eastern residence. But they were not all invalids, and formed a bright, companionable
    party.


    The Teng''gerese who people this mountainous region are a race apart. Their religion
    is a mixture of paganism and Buddhism, and, though reputed to be kind and honest,
    they are an ignorant, uncouth, uncultured people. They dwell `en famille` in large
    square houses without windows, in isolated kampongs on the projecting ridges of
    the mountains. The door of each house is on the side nearest the Bromo crater,
    and as if tradition gave them cause to fear another destructive eruption they
    worship this volcano. Dirt prevails everywhere, and in consequence of the cool
    climate and the scarcity of water they seldom bathe, a fact that is very noticeable
    after one''s acquaintance with the people of the plains.


    To go to Tosari without seeing the Bromo is tantamount to going to Rome without
    entering St. Peter''s. The journey is made on pony or in a sedan chair, by way
    of the Moengal Pass or the Dasar or Sand Sea, which is in reality the enormous
    Teng''ger crater, inside of which there are three more craters, the Bromo being
    the only one showing signs of activity.


    A better view and more impressive is obtained from the Penandjaan Pass, a description
    of which is given in the next chapter.


    Another trip worth making is to the lakes in the saddle-back mountain between
    the Teng''ger and the Seméroe. From this high plateau, the ascent of the Seméroe
    or Mahameroe is fairly easy and will prove attractive to those who are fond of
    mountaineering. It is the highest volcano in Java and has a perfect cone. The
    crater, from which smoke and ashes are constantly ejected, is not on the summit
    but is formed on the south-east side.


    The visitor who does not wish to retrace his steps to Poespo and Pasrepan may
    return to the plains by way of Malang or Lawang through beautiful sub-tropical
    and tropical mountain scenery.


    ***


    ## Sunrise at the Penandjaan Pass.


    When a sharp rap came to our door at two o''clock in the morning to summon us
    for a ride to the Penandjaan Pass, we repented the rash promise to carry out this
    over-night project to see the sun rise. It was no use to curl one''s-self up under
    two heavy blankets and pretend that we had not heard. The "jongus" was insistent.
    Up we had to get, effect a hasty toilet in ice-cold water by the aid of a flickering
    lamp, and step into the outer darkness and mount the pony waiting beside our bedroom
    door.


    Unfamiliar constellations shed a cold light on the hillside.


    Our thickest clothing was penetrated by a searching though slight breeze, as our
    little rat of a pony, guided by the syce, clambered bravely up the brae that led
    through Tosari village.


    The road bore away to the left, and we were soon slipping and jolting down a mountain
    path that sank into a crater-like ravine. It was like a descent into the infernal
    regions. Disaster seemed inevitable. A mistake by the pony or the slightest lurch
    would have precipitated us down hundreds of feet; but the guide knew his way and
    so did the pony, as, sure-footed and cautious, it picked its way, first on one
    side of the road and then the other, descending, descending, lower and lower,
    where the pale light failed to penetrate. The hill on the other side loomed so
    high that one could not believe there was a way out. Pit-pat, pit-pat went the
    pony with steady step, now on hard road now on yielding lava mud, across fragile
    bamboo bridges covered with bamboo lathing, down, down, down till at last we reach
    the ford. The seat was not an easy one for the unustomed rider, whose hands and
    feet were chilled almost beyond feeling by the unwont cold. But it was arm-chair
    ease compared with the experience on the other side, as the pony pluckily pounded
    his way up the zigzag path for the summit of the hill. How either guide or pony
    could see a path will ever remain a puzzle. The over-hanging vegetation blotted
    out any recognisable landmarks; not even the ribbon of a road was visible to the
    eye. But the top was reached, and believing we were now on the level road for
    Penandjaan we tried to open up conversation with our guide.


    It is not easy to carry on a connected conversation with a native of the Teng''ger
    when one''s Malay vocabulary consists of about twenty words—and half of these
    numerals—and the native''s knowledge of the English language, as one soon learned,
    consists entirely of "Yes" and "No." Yet, it is wonderful what one will attempt
    in the dark—the loneliness was so overpowering that one felt compelled to break
    the awesome silence.


    Party with a sedan chair.

