    今年，得益于一些领先酒店业主的努力，荷属印度荷兰政府已意识到了爪哇岛作为一个旅游国家的潜力。通过与酒店和轮船公司的合作，在 5 月和 6 月期间，他们通过降低票价等方式为游客提供了特别的诱因，这项事业的成功无疑将使其持续下去。


    `Koninklyke Paketvaart Maatschappij`（船务代理，原 J. Daendels 公司）签发前往巴塔维（Batavia）和泗水域（Sourabaya）的单程票，其中往返巴塔维的费用为
    45 美元；往返泗水域为 63 美元；往返巴塔维并经沿岸港口到达泗水域返回新加坡（在船上停留十六天）为 74 美元。可以通过皇家荷兰线（Royal Nederland
    Line）和鹿特丹联合线（Rotterdamsche Lloyd）的蒸汽轮购买。


    全岛的铁路旅行非常廉价。为了方便时间有限前往爪哇岛的游客，已经安排了旅游票。这种票可以在新加坡的轮船公司获得。价格为 40 美元（新加坡货币）。优惠券上规定的路线涵盖了从巴塔维港丹绒普里奥克（Tanjong
    Priok）到岛的最东端，经过泗水域前往托萨里（Tosari）和布罗（Bromo）的整个爪哇。持票可以参观布滕佐尔格（Buitenzorg）和普兰格（Preanger）疗养地、雅加达（Djocjakarta）附近著名的印度教遗址以及东爪哇的疗养地。游客可以在任何想停留的地方中断行程，机票有效期为六天。


    票上用英文印有关于行李和其他事项的说明，一张小简笔地图是很有用的补充。


    在全岛，租用的马车极其糟糕。那辆载我们从雅加达前往帕兰南巴南（Parambanan）佛教遗迹的四匹马拖维多利亚马车（four-pony victoria）还没走半英里，其中一个轮子就掉了下来，我们很幸运地没有受严重伤害。对我们来说，这永远是一个奇迹，那辆摇摇欲坠的`kreta`竟然支撑着我们从布滕佐尔格到了辛当格拉亚（Sindanglaya），越过了彭恰克山口（Poentjak
    Pass）。我们很惊讶的是，荷兰当局在其他方面非常严苛，却没有对这些跨国马车和马车所使用的马匹进行良好的监督，因为很难想象还有比这更糟糕的劣马群了。


    我们已经对`Toelatings Kaart`（入境卡）发表过评论。这种过去时代的遗迹对收入贡献不大，而且在入境处那种刻板的官僚主义留下了不好的印象，而这种做法在内陆并没有引起人们的注意，现在游客只要在旅游局（Tourist
    Bureau）登记就可以避免这种了。在我们自己的案例中，我们从未被要求出示过`kaart`。


    访问爪哇岛给人的总体印象是城市和乡村的极度整洁以及广泛的开发。当然，城市里也有阴暗面；但对于一个走过远东任何英国殖民地原住民居住区的游客来说，这些都是微不足道的。当我们想到`香港`花费了数百万美元来应对污秽引起的瘟疫，并缩小中国城原住民贫民窟时，我们对荷兰在爪哇的管理充满了由心的钦佩。海峡殖民地政府（Government
    of the Straits Settlements）正开始开展类似的运动，以纠正过去违反卫生和健康法律的罪行；如果华人能得到像荷兰人在巴塔维、三马兰和泗水域那样的对待，可能有几十万美元可以用于其他用途。为了粉刷每座桥和全国每个糖厂烟囱的墙，这种对粉刷的追求可能有些过度了，但对于欧洲人来说，看到一个国家成功地将其清洁理念带入热带，并让东方人遵守保护普通人健康的普通常法，是令人愉快的。


    对于那些可能被吸引来爪哇岛的读者，我们提供一些建议。

    '
