- fmt: "\nBut the conversation soon flagged, and one was thrown back upon one's own\
    \ thoughts. And as the road once again shaped for another crater-like ravine,\
    \ plunged in inkier darkness and shrouded in solemn stillness, thoughts surged\
    \ rapidly through one's mind.\n\nThe first thing that had attracted our attention\
    \ as we mounted our pony was the delicious smell of roses in the grounds of the\
    \ `Tosari Hotel`. Since nothing could be learned from the syce, nothing could\
    \ be seen, nothing could be heard except the occasional bark of a dog from a remote\
    \ hut on the hillside or the tuneful tingle of a bell on the neck of the uneasy\
    \ occupant of an unseen cow-shed, one tried to learn something by the sense of\
    \ smell. At first, the morning air was snell and sharp; there was an earthy aroma\
    \ which suggested nothing but decaying vegetable matter, but soon it was succeeded\
    \ by a pungent penetrating odour which made one wonder whence its source. This\
    \ pungency remained for the remainder of the morning's ride, almost to the top\
    \ of the mountain pass, some 9000 feet above sea-level, and we ascertained on\
    \ our return that it proceeded from the enormous cabbages grown by the mountaineers\
    \ for the markets on the plains of `East Java`.\n\nAs we plunged deeper into the\
    \ forest, it was impossible to make out more than a dull outline of a white jacket\
    \ and the white shoulder of our piebald pony. Had we not known that the guide\
    \ was there, we might have wondered how the wonderful jacket succeeded in floating\
    \ through space. The pony had no head to our sight; the reins we held in our hand\
    \ might have been dispensed with so far as they acted as a guide to the pony,\
    \ who picked his own foothold and followed the white jacket. With painful persistence,\
    \ he picked the edge of the precipitous declivity which was lost in the bottomless\
    \ abyss.\n\nOnce only we lost our way. Turn after turn was negotiated safely,\
    \ first down into the bottom of the ravine and through the mountain torrent, then\
    \ up the hillside again, mysterious zigzag after zigzag, and one had become reconciled\
    \ to the jolting motion of the pony, the steady tramp of his tiny hoofs, and his\
    \ heavy breathing where the path was steepest, and gave one's-self up to reverie.\n\
    \nHow terrible, we thought, must have been the scene on the mountain slopes when\
    \ the enormous craters of the `Teng'ger` range were belching forth their death-dealing\
    \ streams of lava, their showers of ashes and stones and choking sulphurous fumes!\
    \ How insignificant was man before the powerful agencies of Nature! How bright\
    \ were the occasional stars one saw wherever there was a break in the trees that\
    \ lined our path! How wonderful that each of those stars, those planets, might\
    \ be peopled by beings puzzling over the disputed facts of the Creation, as we\
    \ were; who might also be worrying over a future existence and the redemption\
    \ of a sinful people; who might be endeavouring to solve labour problems and trade\
    \ disputes and discussing whether free trade or preferential tariffs were best\
    \ for a nation's welfare! Was there somebody up in one of those other planets\
    \ on a pony's back, as we were, robbing one's-self of much-needed rest to reach\
    \ a mountain top to see the sun rise?\n\nThese and other thoughts kept recurring\
    \ to one when, suddenly, as if it had been shot, the pony planted his forefeet\
    \ and refused to follow the guiding lead of the syce.\n\nWe had made a wrong turning\
    \ and the syce all but slipped over a precipice. Had it not been for the pony's\
    \ instinct, all three of us would have been plunged into Eternity, and some of\
    \ the problems of the previous moment might have been solved.\n\nOut came the\
    \ syce's matches, as he clung to the pony's bridle. Not nearly so bright as the\
    \ lambent phosphorescence from the fireflies which flickered across our path,\
    \ the puny light of the match was sufficient for the guide to pick up the ribbon-like\
    \ path, and once more we were on our way to the top.\n\nThree deep ravines were\
    \ traversed before we made the final upward movement, and then Nature's lamp lights\
    \ were being shut out in hundreds at a time as the soft dawn began to diffuse\
    \ itself. With `Dawn's` left hand in the sky, we thought of `Omar Khayyam's` stanza,\
    \ and felt impelled to cry out to the sleepers in the hollow—\n\nAwake! for Morning\
    \ in the Bowl of Night Has flung the stone that puts the Stars to Flight: And\
    \ lo! the Hunter of the East has caught The Sultan's Turret in a Noose of Light,\
    \ \n\nThe dawn had been preluded by the awakening chirrups of songsters in the\
    \ wood. A shriller note was struck by some feathered `Daphnis` piping to his `Chloe`.\
    \ Deep down in the valleys and in the villages perched perilously on projecting\
    \ ledges of the mountain, faint twinkling lights began to appear, and the lowing\
    \ of the cattle and the answering and re-echoed crowing of rival poultry-yards\
    \ sent the thoughts back to Homeland scenes some 10,000 miles away.\n\nAs we stood\
    \ on the wall of the enormous crater, overlooking the `Sand Sea`, and watched\
    \ the long shafts of golden light shoot up to the zenith from behind the mountain\
    \ peaks to the East, we felt that our ride had not been in vain. To be abroad\
    \ at early dawn in the tropics is to enjoy the most delightful period of the day.\
    \ An English essayist has well expressed the exhilaration one feels: \"There is\
    \ something beautiful in the unused day, something beautiful in the fact that\
    \ it is still untouched, unsoiled.\" Only those who have stood on the hill tops,\
    \ far removed from the haunts of men, have any true idea of the grandeur of Nature\
    \ and the insignificance of man.\n\nThe sun rose speedily in the full power of\
    \ his golden radiance to paint the landscape. There was no transition. Out of\
    \ the darkness there rose a view, enormous, diversified, impressive.\n\nMiles\
    \ away on the west, the five summits of the `Ardjeono` had been the first to reflect\
    \ the rays hidden from us. `Penanggoenan's` sugar-loaf top soon caught them up\
    \ and passed them on to `Kawi's` three peaks. To the south, was `Seméroe`; to\
    \ the east, the `Yang Plateau`; to the north, the sea and the island of `Madoera`.\
    \ We could trace the coast-line 9000 feet below, away beyond `Surabaya`, where\
    \ white-crested surf beat silently upon the streak of yellow sand. The vast plains\
    \ of `East Java` showed a pattern of variegated colour, which stretched out to\
    \ the cultivated slopes of the hills. Mountain hamlets and villages on the plains\
    \ sent out blue vapours from morning fires. The rivers were distinguishable by\
    \ their leafy fringe as much as by the reflection of the blue sky. Between us\
    \ and the `Yang Plateau`, there were rolling billows of white cloud, tipped by\
    \ the colours from the sun's spectrum.\n\nBut it was the panorama spread out like\
    \ a model beneath our feet which arrested attention and impressed one most. We\
    \ stood on the edge of an enormous crater—the `Teng'ger`—with a circumference\
    \ of fifteen miles. Where, in prehistoric times, flames and ashes and lava had\
    \ boiled and belched, there was now a sea of yellow sand, out of which stood other\
    \ three volcano peaks—the `Battok`, the `Bromo`, and the `Widodarèn`—showing purple\
    \ in the morning light. The `Battok` is a perfect cone, the lava-covered sides\
    \ standing out in clearly defined ridges like the buttresses of a Gothic structure.\
    \ The `Bromo` is the only one of the three now active. As we gaze down, we are\
    \ startled by a deep groaning noise, and out of the wide crater mouth there issues\
    \ a mass of grey smoke and ashes laden and streaked with fire. Simultaneously,\
    \ a huge mass of cloud, cruciform in shape, is shot up hundreds of feet into the\
    \ air from the `Seméroe`. It rests a few seconds above the bare, ash-strewn cone,\
    \ and then drifts heavily to westward, to make way for the next eruption.\n"
