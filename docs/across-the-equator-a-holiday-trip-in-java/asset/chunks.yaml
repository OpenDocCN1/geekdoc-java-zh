    cost.


    In the matter of the personal attention to their guests by the management of some
    of Hotels in the interior, and the supply of information, there could easily be
    an improvement, and doubtless there will be a great change when tourist traffic
    becomes more general, as it promises to do in the near future. Our own experience
    was that we were left, almost invariably, to the tender mercies of the servants,
    and as one''s Malay was limited this led to avoidable inconvenience.


    Nothing, however, could exceed the courtesy and attention of the management at
    the `Hotel des Indes`, in `Batavia`, and the `Hotel du Pavilion` in `Samarang`,
    and the `Manager` of the `Hotel at Sindanglaya`.


    We have already mentioned `Stamm` and `Weijns Restaurant` in `Batavia`. Coupled
    with it for excellence of table is `Grimm''s` famous restaurant in `Sourabaya`.


