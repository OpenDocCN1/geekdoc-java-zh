  trans: '

    “我认为真正的美是超越言语的；你可以向一个见过精美雕塑并能回忆它们的人描述一座雕塑永恒而无暇的轮廓；你或许可以找到词汇来描述一幅名画的光泽、温度和深邃的质感，你所写的文字对那些了解这位大师作品的人来说是有意义的；你甚至可以在未受训练的眼中幻化出一幅图像。但无论是细致的描述还是精妙的辞藻，无论是感性的形容词还是灵魂的微笑，都无法道出一个美妙生命体的一半真相。”


    这位高贵的罗马人站在金努尔山之巅，俯瞰着苏格兰最高贵河流的肥沃山谷，受感发出“看那提提比河”，他看到的没有比赤道爪哇岛这片真正的伊甸园更美的景色了。


    在下午，当落日在景观上投下长长的影子时，齐达尼山谷的景色足以唤醒最迟钝的人的艺术感官。数英之外，萨拉克山以其那雄伟的锥体屹立在蓝天之下。在远方，山峦为这幅画面构成了一个紫色的背景，紫色中点缀着漂浮云朵的柔和白色。在他巨大的身躯下，色彩消失了，但近处的是树木和植被那弥漫的、深邃的绿色；棕榈、树蕨和香蕉树以它们优雅的姿态相得益彰，增添了真正热带特征；而同样优雅的竹丛在微风中摇曳咯吱响，它们尖尖的叶子提供了那种持久的闪动与动态，这种动态人们常与家乡的白桦和山毛联系在一起。山坡和山谷中的耕作土地色彩斑斓。这里，金色的稻田正等待着镰刀收割；那里，是明亮的绿色；旁边，耐心的水牛正拖着笨拙的木犁在积水的土壤上穿行，为下一季作物做准备。如湖泊般的斑块倒出奇异的轮廓，人们几乎想象它们捕捉到了来自彩绘般云朵的绚丽色彩。


    沿山谷而下，从左向右横跨画面的是河流——齐达尼河——当我们看到它时，它是一条宽而浅的溪流，男女老少在那里不断地沐浴。从坐落在树林间的紧凑村庄（kampong）里，穿着鲜艳纱笼的当地妇女带着孩子走来，孩子们嬉水就像那里是它们的自然元素一样。当年轻人在水中戏水、互相追逐时，欢快的笑声从山谷中升起。一切都预示着美、和平与知足。当人们沉浸在这一景象中时，不禁感到，将其与伊甸园相比也并非不恰当。对于一片美丽、富饶的土地和一个快乐知足的人民，人们还有什么奢求呢！


    ## 在往辛丹格拉亚的路上


    在出出很久以前，山谷里就传来了欢快的说话声。当地人已经在齐达尼河中沐浴了，当光线来临时，那被阳光吻过的原始生命在我们面前展开的如模型般的场景中重现了。我们去越波恩特贾克山口的
    `kreta`（马车）被订在六点，但按照那种不典型的东方式准时，当车轮声打破我们的梦境时，已经是六点一刻了。


    当我们喝着晨咖啡时——爪哇酒店咖啡自西德莫尔小姐在 1899 年诅咒它以来已经有所改进——阳光开始开始越过萨拉克山的肩膀，驱散了河流和山谷的晨雾。萨拉克山那皱纹般的火口清晰可见——它的形状是这幅逐渐展开画面的紫色背景。大自然无处不在苏醒。孩子们嬉戏的声音与走向田间的清晨劳动者的歌声融合。蝴蝶像从花中飘落的花瓣一样飞舞漂浮。距离将人形变成了巨大的蝴蝶，有黄色、橙色、粉色、蓝色和红色。如果说傍晚的美，那么清晨的景象令人迷醉，我们不情愿服从了早早餐的召唤，跟随我们的
    `barang`（随从）登上 `kreta`，开始了前往辛丹格拉亚的旅程。


    六六点半，我们已经离开了布吕维（Bellevue）。


    这辆 `kreta`（马车）并不好。


    这辆 `kreta`（马车）并不体面。事实上，它是我们坐过的最令人遗憾的车辆，当我们熟悉这条路时，必须对车主人的坚固性表示感谢。


    在试图到达那里时，马群的突然动作让我们冲进了 `barang`（随从/马车），帽子掉掉了。


    我们现在有时间检查我们的马匹了。马群由三匹小巴塔克马组成。两只是棕色的，一只是斑纹的，其中两只马的大小是一样的。一匹在前方拉处；另外两只在侧面。它们的大小从右到左逐渐缩小——斑纹的在左边。马群中的个头脾气不好，每当它被抽打时（经常如此），它就把怒气发泄在承担了大部分工作的苦力身上。总的来说，它们工作得非常好，因为对它们的要求很大，而它们几乎遭受了持续不断的鞭打。


    在走过布滕佐（Buit 自己在）到辛丹格拉亚的路后，我们毫无保留地建议前往辛丹格拉亚的朝圣者走齐柔（Tijero）。当地指南忠实地指出：“通往山口山口的主路非常陡，不能提供快速的旅行方式。在特古（Toegoe），必须增加额外的马匹——或者用
    `karbouws`（水牛）代替马，以缓慢的速度爬上山。因此，体能良好的人被建议步行通过这段路，大约需要一个半小时。这样做他们将能够更好地欣赏丹德尔斯总督的这一杰作。”


    我们怀疑最后这句话带有一丝荷兰式的讽刺。我们走过这条路，我们并不准备模仿那位老苏格兰人的格言：


    ```

    如果你在路路建成之前见过它，

    你会双手合佑韦德将军

    ```


    丹德尔斯可能是一位令人尊敬的绅士、一位勇敢的士兵和一位聪明的管理者，但他的工程技术并不不上其他品质。如果这条路从未被建成，会好得多。


