    这家酒店由一座主楼和若干座被玫瑰及其他温带花卉环绕的小独立亭子组成，坐落在`Gedéh`山的山坡上，海拔 3,300 英尺。在这个高度，人们白天可以长距离行走而不会感到疲惫；傍晚空气凉爽宜人，我们住那里的晚上，气温略低于
    70 华氏度。这里有一个网球场，经理还打算再建一个；晚上还有台球和保龄球游戏；此外，总督别墅附近，还有一个温泉游泳池，供人白天进行健康的娱乐，因此人们完全不必过于怀念城市的生活和社交。房费是中等水平，每每天六个吉德，但如果居住一周或以上，则降至每天五个吉德。


    总督的避暑别墅 `Tjipanas` 就在这里，距离酒店四分之一英里。这是一栋坐落优美的平房住宅，紧邻通往 `Tjiandjoer` 的主路，周围环绕着一片花园，让人瞬间置身于英格兰南部。在这里，正如爪哇岛的其他许多地方一样，告示上写着：“`Verbodden
    Toegang;`”（禁止通行），但只要向负责的管家礼貌地申请，就能获得热情的欢迎去参观。园里种满了大丽花、玫瑰、绣球花、海棠、报黄堇、报春花、石竹和其他古老品种；盛开的锦羽花让人回想起在德文郡山谷中度过的愉快时光。草坪上芬芳的紫罗草弥漫着空气。无与伦比的兰花依附在树上，纤细的鸟尾蕨与那些顽强的品种相得益彰。深色的冷杉树、成片的澳洲南松以及日本橡树和栗树，衬托出花坛的鲜艳。公园内有一个美丽的池塘，池中心的喷泉喷出晶莹剔透的水花，捕捉阳光，洒下如片闪烁的钻石光。


    `Tjipanas` 的字面意思是“热水”，别墅附近的温泉提供了浴室，以及 `Sanatorium`（疗养院）的游泳池。


    从别墅可以欣赏美景，但在高出数百英尺的 `Goenoeng Kasoer` 则能获得更好的视野，那里曾有一任总督经常在那里享用他的 `ontbijtberg`（早餐）。那里现在被称为“早餐山”。附近的一座银矿曾由
    `John Company` 开采过一段时间。


    前文中提到的 `Tjibodas` 山地花园非常值得一游。健行者如果从早上六点出发，可以到达那里，吃完早餐并在中午前回到酒店。但任何在 `Sindanglaya`
    停留足够长时间的人都应该参加的行程是前往 `Tjibeureum` 瀑布、`Kandang Badak` 和 `Gedéh` 火口。女士可以乘坐轿子出行；男士则步行或骑马。`Tjibeureum`
    瀑布由三级瀑布组成，从垂直的岩壁上落下 400 英尺，蜿蜒的路穿过了一些有趣的丛林风景。


    从 `Tjibeureum` 出发，路径沿着陡峭的山坡向上，通过岩石中的一个狭缝，当地人给这个天然通道增添了许多奇妙的传说。温泉破山壳而出，与清澈见底的冷溪并肩流，这在日本的山区也很常见。


    从 `Tjibeureum` 爬两半小时后，到达 `Kadang Badak`（或称“犀牛圈”）。它几乎位于连接 `Gedéh` 与 `Pangerango`
    的山脊中点，尽管现在已经没有厚蹄动物的踪迹，但据说这里和 `Telega Warna` 在几年前仍是犀牛喜爱的出没地。建议攀登者在此处的小屋过夜，并于凌晨
    4 点登上 `Pangerango`（9,500 英尺）观看日出。从山顶俯瞰，景色壮丽。


    沿着陡峭且艰难的山径，一小时半后即可到达 `Gedéh` 火口。据说，看到这座宏伟火山的巨大火口景象是震撼人心的，对艰辛的攀登来说是极其丰厚的回报。它距离
    `Pangerango` 大约两英里，是这座双火山中仍在活跃的部分。在 1761 年至 1832 年间没有发生爆发，但在随后的二十年里发生了七次，最可怕、最严重的是
    1840 年的爆发。1886 年和 1899 年再次发生了可怕的爆发，当时火山用巨石覆盖了山坡，其中一块超过 150 公斤的石头掉在了四分之三英里之外。


    `Preanger Region`（普南地区）有几个游客可以选择住在 `Sindanglaya` 以外的地方，例如 `Soekaboemi`（海拔 2,100
    英尺，其优势是位于铁路旁）、`Bandoeng` 和 `Garoet`。这些地方对病人来说都有自己的吸引力，所有去过的人对那里的酒店住宿都是最高赞誉。


    第二天早上七点，当我们离开 `Sindanglaya` 时，`Gedéh` 白色的火山口壁在晨光中像一块巨大的大理石一样格外醒目。


    我们的路线穿过茶园、咖啡园和可可园，通往 `Tjiandjoer`——一个繁荣的山镇——我们在上午 9:30 在那里乘坐了火车。

