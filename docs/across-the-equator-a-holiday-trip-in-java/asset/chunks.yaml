    These temples are built of a hard dark and heavy species of basalt, the chief
    component of the mountains of Java. The stone is usually hewn in square blocks
    of various sizes, as is the case with the Boro Budur. The respective surfaces
    of the stones which lie on each other in the building have grooves and projections
    which key into each other as in the best masonry work to-day. They are regularly
    arranged in the walls in such a manner as to give the greatest degree of strength
    and solidity to the structure, and nowhere is cement or mortar utilised. There
    are no huge pillars or single blocks such as may be seen in other prehistoric
    edifices, and neither in boldness of design nor imposing grandeur have the temples
    presented any difficulties to the builders. There is nothing upon a great scale,
    nothing attempted outside the reach of the most obvious mechanical contrivance
    or the most ordinary methods of common ingenuity. The chief characteristic is
    the minute laboriousness of the execution. Nevertheless, the temples excite the
    imagination, and send the thoughts back to those primeval days when men sought
    to express their religious feeling through these elaborate monuments of hewn stone.


    The Tjandi Kalasan, one of the most beautiful of the temples, is the only ruin
    in Central Java of which the exact date of construction has been learned with
    any degree of accuracy. This was ascertained from a stone found in the neighbourhood,
    inscribed in nâgari characters. Two versions of the inscription were made—one
    by the Dutch scholar, Dr. J. Brandes, and the other by the Indian, Dr. R. G. Bhandarkar.


    Dr. I. Groneman makes use of both versions to compile the following:—


    "Homage to the blessed (or, reverend) and noble Târâ.


    "May she,—the only deliverer of the world, who, seeing how men perish in the sea
    of life, which is full of incalculable misery, is sure to save them by the three
    means—grant you the wished for essence, the salvation of the world by the Lord
    of gods and men.


    "The guru (i.e. teacher) of the Sailendra prince erected a magnificent Târâ temple.
    At the command (or, the instance) of the guru, the grateful ——(?) made an image
    of the goddess and built the temple, together with a dwelling (vihara, monastery)
    for the monks (bhikshus) who know the great vehicle of discipline (Mahâyâna).


    "By authorisation of the king, the Târâ temple and the monastery for the reverend
    monks have been built by his counsellors, the pangkur, the tavan, and the tirip
    (old Javanese civil officers, perhaps soothsayers or astrologers).


    "The deserving guru of the Sailendra king built the temple in the prosperous reign
    of the king, the son of the Sailendra dynasty.


    [63]"The great king built the Târâ temple in honour of the guru (to do homage
    to the guru) when 700 years of the Saka era were past.


    "The territory of the village of Kâlasa was bestowed on the congregation of priests
    (monks) in the presence of the pangkur, the tavan and the tirip, and the village
    chiefs (as witnesses).


    "This great (incomparable) endowment was made by the king for the monks. It is
    to be perpetuated by the (later) kings of the Sailendra dynasty, for the benefit
    of the successive reverend congregations of monks, and be respected (maintained)
    by the wise pangkur, the good tivan, the wise tirip and others, and by their virtuous
    wives (according to Dr. Brandes, but "their virtuous foot-soldiers" according
    to Dr. Bhandarkar).


    "The king also begs of all following kings that this bridge (or, dam) of charity,
    which is (a benefit) for all nations, may be perpetuated for all time.


    "May all who adhere to the doctrine of the Jinas, through the blessings of this
    monastery, obtain knowledge of the nature of things, constituted by the concatenation
    of causes (and effects), and may they thrive.


    "The —— prince once more requests of (all) future kings that they may protect
    the monastery righteously."


    This inscription, showing clearly that the temple was consecrated to Târâ, the
    sakti of the deliverer of the world, the fourth Dhyâni Buddha, Amitâbha, the Târâ
    of the Buddhists of the Northern Church (Mahâyâna, or the "Great Vehicle"), leads
    Dr. Groneman to the opinion that this particular temple was completed in the year
    701 of the Saka era, or 779 of the Christian era. No trace of the Târâ image was
    found; but this is not to be wondered at when we note the presence of other images
    in the gardens of private residences in Djocjakarta, and even farther afield,
    and remember the destruction wrought by foreign soldiers and foreign and native
    vandals.


    ## People and Industries of Central Java


    In the plains going eastward through Central Java from the Preanger Regencies
    to the mountains of the Teng''ger Region, one cannot fail to be struck by the
    remarkable change in the appearance of the natives. The Soendanese of the West
    may not have the resource and thoughtfulness of the people of the plains, the
    Javanese, but they have brightness and vivacity which make them more attractive.
    Their bent of mind is reflected in the bright colours of their dress. In this
    and other respects, they resemble the Japanese women. In the plains, sombreness
    of dress is a characteristic—the browns of Mid-Java changing to an almost universal
    dark blue in the west, reminding the traveller of the Chinese and the inhabitants
    of the southern Japanese islands.


    Everywhere, the male Javanese carry the kris or native knife in the girdle. There
    is much variety in the blades, handles and sheaths of those weapons, real native
    damascene blades costing considerable sums. One taking a superficial trip through
    the island is at a loss to understand why the natives should be armed. According
    to all accounts, they are a peaceably inclined people, and give their Dutch rulers
    very little trouble; and if they were at all quarrelsome amongst themselves, the
    handy weapon would be a source of grave danger. In course of time, perhaps, the
    knife will disappear as did the sword of civilised Europe a century or more ago.
    A traffic in Birmingham manufactured krises and knives is done at Djocjakarta
    and Soerakarta, as well as at Samarang, Sourabaya and Batavia, and anyone who
    wishes to make a collection of native weapons should be careful to have the assistance
    of an expert to detect the sham from the real.


    The same remark applies to the purchase of sarongs. The ordinary sarong of commerce
    is manufactured in Lancashire, whence an excellent imitation of the native manufacture
    is exported. Tourists are also catered for in a native block-stamped variety,
    which is at least a colourable imitation of the real article. Wherever we went,
    however, we could see that the native art had not been lost entirely. Women sit
    outside their little huts by the roadside tracing the most elaborate designs in
    brown and blue dye upon the cloth with tiny funnel-shaped implements.

