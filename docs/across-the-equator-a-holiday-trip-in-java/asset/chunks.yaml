    These indications of Nature''s activity in the crucible at the earth''s centre
    make one reflect on the possible consequences of the next great convulsion, and
    the fate that is in store for those intrepid villagers who have perched their
    primitive huts on the very edge of the `Teng''ger` crater. With these reflections,
    we turn away from one of the most solemn and impressive sights it has been our
    privilege to witness, silently mount our pony and retrace our steps for the snugly-situated
    Hotel at Tosari, no longer regretting, nay, rather thankful, that we had resolved
    and achieved our resolution to climb the `Penandjaan Pass` to see the sun rise.


    Smoke plume from a volcano


    Smoke Plume—The Sméroe.


    ***


    # Hotels and Travelling Facilities


    Before going to `Java`, the tourist ought to make himself acquainted with the
    outlines of the history of the island since it came under European domination.
    Half the charm of European travel, if one is something more than a mere unreflective
    globetrotter, lies in the historic associations of the places visited, and it
    is the comparative absence of this quality which robs new countries of the interests
    they would otherwise possess for educated people. Scenery alone surfeits the appetite.


    In `Java`, as in most Oriental countries, the traveller feels that he is moving
    in an atmosphere of antiquity, and though it has become a misnomer to refer to
    "The Unchanging East," it is borne in upon one that in the large group of islands
    comprised in the `Philippine and Malay Archipelagoes`, from `Luzon` in the north
    to `Java` in the south, from `Samar` in the east to `Sumatra` in the west, centuries
    of western contact has left but a slight impress upon the characters of the people.
    Changes there are, undoubtedly. Modern civilisation has advanced like a resistless
    wave and gradually engulfed an older civilisation, but here in `Java` one feels
    that the change has not been so decisive; and railways and canals and cultivation
    notwithstanding, the difference in general advancement between the `Javanese`
    and the `Japanese` is most marked, and even the Chinese, conservative though they
    are in most ways, have more character and look more hopeful soil for the reception
    and development of western ideas.


    A solid foundation for the trip to `Java` may be laid by perusing `Sir Stamford
    Raffles''` history, the second edition of which, published in 1830, will be found
    in `Raffles Library`. It covers the whole period from the time the `Portuguese`
    arrived in the `Farther East` in 1510 to the British occupation. Making `Malacca`
    his headquarters, `Albuquerque` sent various expeditions to the surrounding islands,
    and `Antonio de Abrew` was his emissary to `Java` and the `Moluccas`. The Dutch
    appeared in 1595, obtaining their first footing in the `East Indies` at `Bantam`,
    the `East India Company` establishing a factory at the same place in 1602.


    Of the capture of `Java` by the British troops brief details have already been
    given.


    An interesting account of "The Conquest of Java" is given by `Captain William
    Thorn`, a Dragoon officer, who served on the staff of one of the brigadiers. It
    was written in 1815 while he was on his way back to England, and is so plentifully
    illustrated with field maps as to add interest to one''s visit to `Batavia` and
    `Buitenzorg` and the seaports of `Samarang` and `Sourabaya`.


    We are indebted to `Dr. Hanitsch`, the Curator, for the following list of books
    on `Java` in `Raffles Library`:—


    *   `The Dutch in Java`; 1904, by `Clive Day`.

    *   `Java, Facts and Fancies`; 1905, by `Augusta de Wit`.

    *   `Facts and Fancies about Java`; 1908, by `Augusta de Wit`.

    *   `Life in Java, 2 vols`; 1864, by `W. B. d''Almeida`.

    *   `Voyage Round the World`; 1870, by `Marquis de Beauvoir`.

    *   `With the Dutch in the East`; 1897, by `W. Cool`.

    *   `Geschiedenis der Nederlanders of Java`; 1887, by `M. L. Deventer`.

    *   `From Jungle to Java`; 1897, by `Arthur Keyser`.

    *   `Java`; 2 vols., 1861, by `J. W. Money`.

    *   `Java; 1830`, by `Sir Stamford Raffles`.

    *   `Führer auf Java`; 1890, by `L. F. M. Schulze`.

    *   `The Conquest of Java`; 1815, by `William Thorn`.

    *   `A Visit to Java`; 1893, by `W. B. Worsfold`.

    *   `Rambles in Java`; 1853, (anon.).

    *   `The Hindu Ruins in the Plain of Parambanan`; 1901, by `Dr. I. Groneman`.

    *   `The Tjandi-Bäräbudur in Central Java`; 1901, by `Dr. I. Groneman`.

    *   `Bôrô-Boedoer op het Eiland Java`; 1873, by `F. C. Wilsen`, 2 vols.


    In addition to a selection from the above-named, the intending visitor should
    read "Java: The Garden of the East" by `Miss E. R. Scidmore`, 1898, and the `Rev.
    G. M. Reith`''s "A Padre in Partibus" will be found entertaining.


    Much must depend upon the notions of the tourist as to the cost of a trip in `Java`,
    but our experience is that `Java` is the cheapest country we have ever visited.
    The hotels are superior to those found in the interior of `Japan`, and, as the
    `guilder`, which has a value of 70 cents in `Singapore` currency or about `1s.
    7¾d.` in English currency, may be taken as the unit of value for travelling purposes,
    our readers will see at a glance what a fortnight or three weeks is likely to
