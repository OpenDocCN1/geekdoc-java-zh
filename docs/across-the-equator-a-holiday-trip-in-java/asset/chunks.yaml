    This cloth is styled `bátik`. According to the ground of white, black or red,
    it is known as `bátik látur púti`, `bátik látur irang`, or `bátuk látur bang`.
    To prepare it to receive the design, the cloth is steeped in rice water, dried
    and calendered. The process of the `bátik` is performed with hot wax in a liquid
    state applied by means of the `chánting`. The `chánting` is usually made of silver
    or copper, and holds about an ounce of the liquid. The tube is held in the hand
    at the end of a small stick, and the pattern is traced on both sides of the tightly
    drawn suspended cloth.


    When the outline is finished, such portions of the cloth as are intended to be
    preserved white, or to receive any other colour than the general field or ground,
    are carefully covered in like manner with the liquid wax, and then the piece is
    immersed in whatever coloured dye may be intended for the ground of the pattern.
    The parts covered with wax resist the operation of the dye, and when the wax is
    removed, by being steeped in hot water till it melts, are found to remain in their
    original condition. If other colours are to be applied, the process is gone over
    again. It will thus be seen that a considerable amount of skill is required. In
    the ordinary course, the process of the `bátik` occupies about ten days for common
    patterns, and from fifteen to seventeen days for the finer and more variegated.
    Some of the sarongs worn by the native aristocracy and the European ladies are
    not only beautiful in pattern and working but most expensive in price.


    ### Javanese Industry


    In our excursions in the neighbourhood of Djocjakarta, we had ample opportunity
    of seeing the industry of the Javanese. Wherever one went, there were long processions
    of stunted women bravely carrying enormous burdens on their backs, often with
    a baby slung in the slandang astride the hip. The cheery, coquettish look of the
    Soendanese was absent here. All seemed to be borne down by the seriousness of
    a strenuous physical life. No songs arose from the fields; scarcely a head was
    raised from the laborious planting of tufts of paddy roots as our `kreta` rattled
    past. While mothers toiled in the fields, children played near the roadways, or
    now and then assisted their parents.


    ### Goitre in Java


    We were surprised to see in these fertile plains how prevalent goitre is amongst
    the women. In the drive from Moentilan to the Boro Budur, at least one in twenty
    were so afflicted. We commented on this fact to a native official while waiting
    for our tram at Moentilan, and he assured us that it is remarkably prevalent amongst
    the common people, but that the men do not suffer in the same proportion as the
    women. The disease is named "kondo" by the Javanese. We do not know whether any
    scientific investigations into the disease have been carried out by the Dutch
    officials; but it would be interesting to know why it should be so prevalent in
    this area. Goitre is usually associated with people living in mountainous regions,
    yet we never noticed it in the Preanger and scarcely at all on the mountains of
    East Java.


    Parade of soldiers.


    #### Sultan of Djocja''s Soldiers.


    Since the above was written, we have had an opportunity of consulting Sir Stamford
    Raffles'' History of Java. He found goitre prevalent in both Java and Sumatra,
    but is careful to explain that it was observed in certain mountainous districts.
    The natives ascribed it to the quality of the water, but, says Sir Stamford, "there
    seems good ground for concluding that it is rather to be traced to the atmosphere.
    In proof of this, it may be mentioned that there is a village near the foot of
    the Teng''ger mountains, in the eastern part of the island, where every family
    is afflicted by this malady, while in another village, situated at a greater elevation,
    and through which the stream descends which serves for the use of both, there
    exists no such deformity. These wens are considered hereditary in some families,
    and seem thus independent of situation. A branch of the family of the present
    Adipati of Bandung (1811-15) is subject to them, and it is remarkable that they
    prevail chiefly among the women of the family. They never produce positive suffering
    nor occasion early death, and may be considered rather as deformities than diseases.
    It is never attempted to remove them."


    ### Trip from Samarang to Djocja


    We reached Djocjakarta in the ordinary way through Maos. It may be that circumstances
    may take the traveller off the beaten track, and we are indebted to a friend for
    the following brief description of the trip from Samarang to Djocja over the mountains:—


    "The usual journey from Samarang to Djocjakarta is made by way of Solo (Soerakarta),
    but the route is devoid of interest, the railway running through low country under
    rice cultivation. I would suggest the far more interesting route via Willem I.
    Starting at 5.57 a.m. or 8.17 a.m., Djocja is reached at 2.16 p.m. or 5.10 p.m.
    The 10.50 a.m. train, I found, went only as far as Magelang, so I started at 2.9
    p.m., and, after a delightful run, reached Kedoeng Djattie, a fine junction station,
    where we changed cars. The next two hours'' run is through foot hills, strips
    of forest and lovely vegetation, glimpses being obtained every little while of
    pleasant valleys, rice fields and distant hills as the train climbed up to Willem
    I. This point we reached about 5 p.m., in time to enjoy the refreshing cool breezes
    and to admire the beautiful view and sunset on a small mountain opposite the hotel.


    Next morning, I caught the train (8.54 a.m.,) which leaves Samarang at 5.57, and
    after a short run reached a station where our engine was changed for the cog-wheel
    system, the grade being too heavy for the ordinary locomotive. Upwards we climbed
    till we were in the clouds and the air became quite bracing and invigorating.
    Tiffin should be ordered through the guard before starting from Willem I., and
    it will be handed into the train. It was about one''clock when we reverted to
    the ordinary locomotive, and began the descent to Djocja, through Magelang. To
    anyone who has to visit Samarang, I would recommend this trip."


    The principal sight of Djocja itself is the Water Castle. This trip need not occupy
    more than a couple of hours, and its appreciation depends upon the taste of the
    visitor. Earth have played havoc with the buildings, but sufficient is left in
    the way of tunnels, grottoes, bathing ponds and dungeon-like rooms. Everywhere
    are signs of decay and desolation; nevertheless, it is possible, with a little
    knowledge of comparatively recent Javan history, to reconstruct the scenes enacted
    here in the days when the native sultans were more powerful in the land than they
    are to-day. For a small fee, a native pilots one through the carved archways,
    underground halls and subways and cells. As one stands in the large banqueting
    hall, it is possible to conjure up the ceremonials of a past age, and, in the
    mind''s eye, to group retainers round the Sultan and the members of his harem,
    whileudily dressed courtesans sang and danced for the entertainment of "the quality."


    ### The Health Resort of East Java


    Tosari on the Teng''ger mountains was the goal of our travels. We were anxious
    to escape from the heat of the plains, for the sun had now crossed the Equator,
    Java was in its summer season and the rains might come any day. From Djocjakarta,
    we should have arrived in Sourabaya in time for riz-tafel, but the wash-out at
    Moentilan still caused a delay of traffic and we were two hours late in reaching
    our destination.

