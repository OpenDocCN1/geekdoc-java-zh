    ## 巴达亚的第一印象


    考虑到以下事实时：爪哇从新加坡出发仅需两天船程；它在某些方面比日本更美；它拥有 1000 多年历史的遗迹；它的章节安排使访问者能够在两周到三周内，从西向东穿过整个岛屿。这是巴达亚的第一印象。


    当我们的船在清晨驶出新加坡港时，岛屿仿佛从海中浮现而出，一幅接一幅的海景，联想起我们童年熟悉的老式风景画。毕竟，人们对风景的理解很大程度上是一个比较过程。一位乘客将此与比特峡湾（Kyles
    of Bute）相比；另一位则将其与世界另一端的日本内海相比。然而，这条热带水道与两者都不同，它有着独特的个性，并因其所引发的联想和回忆而更显迷。


    我们在驾驶舱上与船长交流了很长时间，他礼貌地为我们指出了地图上的所有主要地点。


    里约苏丹国位于左舷，距离新加坡仅四小时船程。右舷可以观察到苏门答腊岛的影子，在途中船只经过了邦卡岛（Banca），据报道那里拥有世界上丰富的锡矿。这些锡矿由荷兰殖民政府聘用中国契工开采；其收入是平衡殖民预算的重要因素。有趣的是，长期在马来半岛和群岛开采金和锡的中国人，在两百年前就非常熟悉邦卡土壤的肥沃程度，而且当时来自该岛的锡是中国以及整个远东探险商人足迹之处的流通货币。

