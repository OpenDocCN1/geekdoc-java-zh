    ride over the Poentjak Pass should be avoided and the train taken from Buitenzorg
    to Tjiandjoer. The train leaving Batavia (Weltervreden Station) at 7.25 a.m. and
    Buitenzorg at 8.44 reaches Tjiandjoer at 12.04\. Here, if a carriage has been
    ordered in advance, a representative of the Sindanglaya establishment meets passengers,
    and the journey to the hotel is negotiated in two hours at a cost of two and a-half
    guilders. From Buitenzorg to Sindanglaya the hire of a carriage for passenger
    and baggage is nine guilders; from Sindanglaya to Buitenzorg it costs seven guilders.
    The train fare from Batavia to Buitenzorg is three guilders for first-class and
    two guilders for second; from Batavia to Tjiandjoer, it is eight guilders first-class
    and four guilders and seventy-five cents second.'
