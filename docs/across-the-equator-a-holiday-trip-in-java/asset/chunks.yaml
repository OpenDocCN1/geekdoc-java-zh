    "I think that true beauty is beyond description; you may describe the changeless
    faultless outlines of a statue to a man who has seen good statues and can recall
    them; you can, perhaps, find words to describe the glow and warmth and deep texture
    of a famous picture, and what you write will mean something to those who know
    the master''s work; you may even conjure up an image before untutored eyes. But
    neither minute description nor well-turned phrase, neither sensuous adjective
    nor spiritual smile can tell half the truth of a beautiful living thing."


    The noble Roman, prompted to exclaim "Behold the Tiber" as he stood on the summit
    of Kinnoull Hill and gazed upon the fertile valley of Scotland''s noblest stream,
    saw no fairer sight than this veritable Garden of Eden in Equatorial Java.


    Seen in the afternoon when the setting sun is casting long shadows over the landscape,
    the scene in the Tjidani Valley is calculated to arouse the artistic senses of
    the most insusceptible. Miles away, the Salak raises his majestic cone against
    the blue sky. In the distance, the mountain forms a purple background for the
    picture, purple flecked with soft white patches of floating cloud. Beneath his
    massive form, colour is lost in shadowy but closer at hand are the dark pervading
    greens of the trees and vegetation, palms and tree ferns and banana trees helping
    by their graceful form to provide the truely tropical features, while the equally
    graceful clumps of bamboo sway and creak in the light breeze, their pointed leaves
    supplying that perpetual flutter and movement which one associates with the birches
    and beeches of one''s native land. The cultivated patches on hillside and valley
    are rich in colour. Here, the yellow paddy is ripening for the sickle; there,
    it is bright green; alongside, the patient buffaloes are dragging a clumsy wooden
    plough through water-covered soil to prepare for the next crop. The lake-like
    patches reflect weird outlines, and one almost imagines that they catch the brilliant
    colours from the sun-painted clouds.


    Down the valley, crossing the picture from left to right is the river—the Tjidani,—a
    broad shallow stream when we saw it, in which men, women and children are constantly
    bathing. From the compact kampong nestling among the trees, the native women,
    clad in bright coloured sarongs, came with babies, who take to the water as if
    it were their natural element. Merry shouts of laughter ascend from the valley
    as the youngsters splash about and chase each other. Everything suggests beauty
    and peace and contentment, and as one drinks in the scene it is borne in upon
    one that the comparison with the Garden of Eden is not inapt. What could one wish
    for more than a beautiful, bounteous land and a happy, contented people!


    ## On the Road to Sindanglaya


    Long before sunrise, the sound of merry voices arose from the valley. Already
    the natives were bathing in the Tjidani, and, when the light came, the primeval
    life on which the sun had gone down was reproduced in the model-like scene spread
    out before us. Our `kreta` for the journey over the Poentjak Pass had been ordered
    for six o''clock, but with un-Oriental punctuality it was a quarter-past live
    when the sound of carriage wheels broke in upon our dreams.


    While we sipped our morning coffee—Java hotel coffee has improved since Miss Scidmore
    anathematised it in 1899,—the sun''s rays began to peep over the shoulder of the
    Salak, and dispelled the morning mists on river and valley. The Salak''s fretwork
    crater stood out entirely clear—his form a purple background to the picture gradually
    unfolding itself. Nature was everywhere awake. Children''s voices in play blended
    with the songs of early workers proceeding to the fields. Butterflies flitted
    and floated like detached petals from the flowers. Distance converted human figures
    into larger butterflies, yellow and orange, pink and blue and red. If it were
    beautiful in the evening, the scene was enchanting in the morning, and it was
    with reluctance that we obeyed the summons to early breakfast, and followed our
    `barang` into the `kreta` to begin the journey to Sindanglaya.


    It was half-past six o''clock when we were salaamed out of the courtyard of the
    Bellevue by the hotel "boys."


    The `kreta` was not a handsome affair. In fact it was one of the most disreputable
    vehicles it has ever been our misfortune to travel in, and when we made acquaintance
    of the road it had to travel over we must give the owner credit for an abundant
    faith in the toughness of the `kreta`. It was a cross between the carromata of
    the Philippines and a covered dog-cart. There was no aid to mount. By a series
    of gymnastics we managed to get into the driver''s seat—our own was behind his
    but also facing to the front. In attempting to get there, a sudden movement of
    the team sent us plunging into the `barang`, and, in extricating ourselves, head
    came in contact with the roof and hat went overboard.


    Eventually we went off with a bound along the main street of Buitenzorg, scattering
    the fowls obtaining a precarious living in the roadway, and sending cats and dogs
    and goats flying for safety into the houses.


    We had now time to examine the points of our team. It was composed of three tiny
    Battak ponies. Two were brown, and one a piebald in which a dingy chestnut strove
    for mastery with a dingier white. No two ponies were the same in size. One was
    in the shafts; the other two were in traces alongside. They tapered in size from
    right to left—the piebald on the left. The giant of the group had a nasty temper,
    and when lashed, as he was frequently during the drive, vented his anger upon
    the patient brute doing the lion''s share of the work in the shafts. Upon the
    whole they did their work extremely well, for a great deal was asked of them,
    and they scarcely deserved the almost continuous flogging to which they were subjected
    by our driver.


    Having travelled over the road from Buitorg to Sindanglaya by the Poentjak, without
    reserve, we advise pilgrims to Sindanglaya to patronise the road from Tjijoer.
    The local guide book remarks with truth: "The main road to Poentjak being very
    steep, it does not afford a quick mode of travelling. At Toegoe, an extra team
    of horses must be added—or `karbouws` (water buffaloes) used instead of horses,
    to pull the carriage at a slow pace up the mountain. Good walkers may, therefore,
    be advised to do this part of the road on foot, which will take them about an
    hour and a half. By doing so they will be more able to admire this marvellous
    work of Governor-General Daendels."


    We suspect there is a touch of Dutch satire in this last remark. We have travelled
    the road, and we are not prepared to parody the old Scot''s saying:


    ```

    If you''d seen this road before it was made, You''d lift up your hands and bless
    General Wade

    ```


    Daendels may have been an admirable gentleman, a brave soldier, and a clever administrator,
    but his engineering skill did not equal his other qualities. It would have been
    much better if the road had never been made. Surely no highway was ever more badly
    graded, and we are not astonished that a practical people like the Dutch set themselves
    to construct a more sensible road by way of Tjiteroeg and Soekaboemie. Needless
    to say, it is not a road for a motor car. It would be inadvisable to adopt this
    route to Sindanglaya if the party included ladies. But, if they have a taste for
    mountaineering, baggage should be sent by rail to Tjiroeg under the care of some
    of the party, and carriages dispensed with at Toegoe and the remainder of the
    journey made on foot. As it was, a good deal of our journey up had to be made
    on foot over unblinded loose road metal.

