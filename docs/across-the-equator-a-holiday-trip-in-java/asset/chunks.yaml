    The squadron consisted of four line of battle ships, fourteen frigates, seven
    sloops, eight Honourable East India Company''s cruisers, fifty-seven transports
    and several gunboats—altogether over 100 sail. Composed equally of European and
    Indian troops, there were upwards of 10,000 men under Sir Samuel Auchmuty''s command.
    The European troops included the `14th`, `59th`, `69th`, `78th`, and `89th` Regiments
    of Infantry, Royal Artillery, and Royal Marines, and a small detachment of Royal
    Engineers.


    A course was set for a rendezvous off the coast of Borneo, and on August 4, 1811,
    a landing was effected at Chillingching, a village about ten miles east of Batavia.
    To the astonishment of the British Commander, his landing was not opposed, the
    defending force being concentrated in the neighbourhood of Weltevreden and Meister
    Cornelius, to-day the thriving residential suburbs of Batavia.


    General Janssens rejected Lord Minto''s summons to surrender.


    On August 10, Batavia was in the hands of the British troops, and on that day,
    after two hours of hard fighting, Weltervreden was captured, the `78th` Highlanders
    having a heavy casualty list amongst their officers.


    The French troops bravely contended every foot of ground, and battles, with heavy
    losses on both sides, were fought on August 22, August 24, and August 26. Colonel
    Gillespie, who led the advance in each of these engagements, performed prodigies
    of bravery in the latter fight, for we read that "Colonel Gillespie took one General
    in the batteries, one in the charge, and a Colonel, besides having a personal
    affair in which another Colonel fell by his arm."


    Altogether, the British captured three General officers, 34 field officers, 70
    captains and 150 subaltern officers in these fights.


    The rout of the enemy was complete. General Janssens made his escape to Buitenzorg,
    thirty miles distant, with a few cavalrymen and the remnants of his army of 13,000
    men. He did not remain here long, but fled eastwards.


    A British force was shipped to Cheribon, where a large number of French officers
    were captured; and the port of Samarang was next attacked, with the object of
    forcing General Janssens back upon Solo, while the eastern end of the island was
    occupied by another British force. On September 10, an action was fought outside
    Samarang, and Janssens, defeated, retreated to Fort Salatiga; but eventually,
    being deserted by his troops, he opened up negotiations for capitulation.


    This must have been a bitter experience for General Janssens, for it was not only
    the crowning misery of his defeat but marked the end of his military career, assuming
    that his Imperial master retained his power in Europe.


    "Souvenez vous, Monsieur," Napoleon is reported to have said to him upon taking
    up his appointment, "Qu''un Génèral Francais ne se laissa pas prendre une seconde
    fois!"


    The island having been wrested from the French, the British authorities set about
    the reform of the civil administration. This was not to be accomplished, however,
    without a test of strength between the natives and their new masters. An act of
    treachery soon called the troops into the field again.


    During the Governorship of Marshal Daendels, the Sultan of Djocjakarta had been
    the most turbulent and intriguing of the native princes, and his conduct immediately
    after the British occupation gave occasion for serious uneasiness. Mr. Stamford
    Raffles, who had been appointed by Lord Minto Lieutenant-Governor of Java in December,
    1811, went in person to see the Sultan. A treaty was entered into, under which
    the Sultan confirmed to the Honourable East India Company all the privileges,
    advantages and prerogatives which had been possessed by the Dutch and French authorities.
    To the Company also were transferred the sole regulation of the duties and the
    collection of tribute within the dominions of the Sultan, as well as the general
    administration of justice in cases where British interests were concerned.


    This expedition of Mr. Raffles seems to have had exciting experiences, for we
    read:


    ```

    [21]"The small British escort which accompanied Mr. Raffles, consisting only of
    a part of the 14th Regiment, a troop of the 22nd Light Dragoons and the ordinary
    garrison of Bengal Sepoys in the Fort and at the Residency, were not in a condition
    to enforce terms anyway obnoxious to the personal feelings of the Sultan. The
    whole retinue, indeed, of the Governor were in imminent danger of being murdered.
    Krises were actually unsheathed by several of the Sultan''s own suite in the Audience
    Hall where Mr. Raffles received that Prince, who was accompanied by several thousands
    of armed followers expressing in their behaviour such an infuriated spirit of
    insolence as openly to indicate that they only waited for the signal to perpetrate
    the work of destruction, in which case not a man of our brave soldiers, from the
    manner in which they were surrounded, could have escaped."

    ```


    For a time, however, an open breach of the peace was averted by the tact of Mr.
    Raffles and the outward appearance of bravery of the officers and men accompanying
    him.


    Several expeditions were made into the interior to put down petty brigands, in
    much the same way as the Dutch are engaged in Flores and Celebes to-day, and a
    more imposing display of military force had to be made in Sumatra.


    In the following year, the Sultan of Mataram in Djocjakarta again became troublesome,
    and it was found necessary to send a strong expedition against him. On June 20,
    the famous Water Castle at Djocjakarta was captured by assault, and the Sultan
    taken prisoner. He was exiled to Prince of Wales Island (Penang), and the Hereditary
    Prince was placed on the throne. The ruling native at Solo, who rejoiced in the
    imposing title of Emperor, made terms with the Lieutenant-Governor, and peace
    was established throughout the island, and was not disturbed seriously during
    the remainder of the British occupation.


    Mr. Raffles set himself to establish a more humane administration than had prevailed,
    and anyone who wishes to realise the thoroughness with which this able administrator
    set himself to the task should read his "History of Java." It is replete with
    shrewd observations of the native customs, industries, antecedents, and languages,
    and shows how little change has been effected in the character and domestic customs
    of the people during the last hundred years.


    The essence of his policy of administration is contained in the following sentence
    written by him:"Let the higher departments be scrupulously superintended and watched
    by Europeans of character; let the administration of justice be pure, prompt and
    steady;" and it is satisfactory to one''s sense of patriotism to know that that
    is the spirit which pervades British administration in her Crown Colonies to-day.


    * * *


    ## Botanist''s Paradise at Buitenzorg


    To the Singaporean visitor to Java there is a melancholy interest in the little
    monument erected in the Garden at Buitenzorg by Sir Stamford Raffles to the memory
    of his wife, who died during his residence there.


    In the conditions under which the island was restored to Holland, it was stipulated
    that the monument, in the form of a little Greek temple, should be cared for by
    the Dutch. The trust has been fulfilled, and those of us who take interest in
    the historic chances and changes of Britain''s possessions in the Far East and
    the personal influence of the builders of the Empire, can find food for reflection
    in the sacrifices made by those men and women who are ever found on the Empire''s
    frontiers. The sight of this memorial among the kanari trees in the tropical island
    of Java makes us think of the tablet in the little parish church on the hill at
    Hendon, near which this woman''s husband lies buried.


    The inscription runs as follows:—


    ```

    "Sacred to the memory of Olivia Marianne, wife of Thomas Stamford Raffles, Lieutenant-Governor
    of Java and its dependencies, who died at Buitenzorg on the 26th November, 1814."

