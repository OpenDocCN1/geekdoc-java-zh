    “噢，我那永恒的心从未忘记过你片刻。尽管严酷的命运驱使我们分离，但请——请不要忘记我。”


    对于只有两周或三周时间投入爪哇岛的旅行者来说，必须早起。无论如何，他必须早出发以利用快车；而在我们这里，只有一天时间留给 `Buitenzorg`，那里是荷兰属东印度总督的宫。


    ### 爪哇岛的铁路服务


    除了从 `Tandjong Priok` 出发的短途线外，这是我们第一次接触铁路服务。当我们看到 `Weltervreden Station` 站等候上车的人群时，我们决定违背朋友的建议乘坐一等座旅行。这次我们这样做是明智的，因为火车非常拥挤；但此后我们只乘坐二等座，发现它如我们所愿地舒适。事实上，乘坐火车一等车厢的人少得可怜，我们对管理层竟然还保留这些座位感到惊讶。


    在整个爪哇岛，我们发现铁路服务在各方面都很出色。车厢很舒适。为每个人都提供了充足的空间。车厢内可以存放大量的 `barang`（行李），荷兰游客和当地旅行者充分利用了这一便利。洗厕设施比比我们在英国主要干线的快车火车上见过的还要，在直达快车上还设有餐具车，可以以适中的价格用餐。我们不能说食物总是合胃口的，因为负责负责的中国厨师似乎有一个固执的观念，认为作为主菜的“牛排”（beef-stuk）应该生着上菜。随着时间的推移，铁路管理部门无疑会将注意力转移到膳食安排上以进行改进；当他们这样做时，我们希望他们完全取消牛排，提供更多种化、更精致、更诱人且更合口味的菜肴。


    火车保持着相当的速度，可以在两天内从 `Batavia` 到达位于岛屿另一端的 `Sourabaya`。当然，正如在马来联邦各州一样，火车只在从日出运行到日落，在两个主要城市之间往返的直达旅行者必须在
    `Maos` 过夜，那里有一个宽敞的 `pasanggrahan`（休息站），提供干净、舒适的住宿和健康的食物。我们只有两次错误了火车，两次都是由于同一个原因——`Moentilan`
    线的道路被冲毁了，那是前一天一夜剧烈雷雨暴造成的。火车小心地行驶到缺口，乘客通过临时桥渡到另一侧等候的火车上，行李则由许多苦力搬运。这一切都必须在暴雨中完成，但铁路官员尽了一切努力让状况尽可能不那么糟糕，唯一的不便是某些行李到达
    `Djocjakarta` 时晚了了。


    去往 `Buitenzorg` 的早晨旅途中并没有特别有趣的，但那位与四位男士进行了整整一个半小时生快交谈的荷兰女士，向我们介绍了荷兰语中表达“是”和“否”的各种表达方式。


    ### Buitenzorg 市


    我们已经通过 Scidmore 小士的书对 `Buitenzorg` 的美景做好了准备，而这一次，完全超出了预期。


    荷兰总督 `van Imhoff` 在选择这个地方作为总督的官邸时显然是明智之举，而荷兰园艺家们可能没有人比他们更优秀的了，他们从原始丛林中创造出这座园林城市值得祝贺。


    旧宫殿的一部分是由总督 `Mossel` 在一百五十年前建造的，而原始建筑在 `Daendels` 和 `Raffles` 统治期间得到了扩建。这座建筑在
    1834 年的一场地震中被毁，而新宫殿——人们透过人工湖就能瞥见一眼——是荷兰属东印度行政长官名副其实的住所。湖面上点满了莲花和大王莲萍（`victoria
    regia`），中心的小岛展示了丰富的红棕榈、羽毛状黄竹和深绿色的叶子，湖面映照出变幻万千的画面。


    阿尔玛·塔德玛（Alma Tadema）或马尔库斯·斯通（Marcus Stone）会迷恋宫殿的花卉和大理石，那里有宽阔的楼梯、走廊以及精美的爱奥尼柱和檐口；而兰西尔（Landseer）或麦惠特特（MacWhirter）可能会在环绕它的鹿园中发现无尽的题材。


    ### 植物园与研究


    这座园林是植物学家的天堂。由历任主任收集的、来自自然宝库的热带珍宝，以其典型的荷兰风格被细心地精确地安排着。它由 `Reinwardt` 教授于 1817
    年建立，许多在科学界留下足迹的卓越植物学家在此学习过并丰富了藏品。正如想象的那样，荷兰人并不满足于仅仅一个热带标本的展示地，他们建立了五座山地花园，为了实用和科学目的，在那里培养通常温带地区常见的花卉、植物、蔬菜和树木。这些花园位于南方的山区——`Tjipanas`、`Tjibodas`、`Tjibeureum`、`Kadang
    Badoh` 以及 Pangerango 山顶，即高度在 3,500 英尺到 10,000 英尺之间。`Tjibodas` 的植物园保留了下来，而在总督的夏季别墅，人们仿佛置身萨里郡或肯特郡的私人花园中。


    在 `Buitenzorg` 的建筑内为外国学生提供了便利，在我们访问时，一位来自东京大学、在柏林学习了三个半的日本教授正在进行详尽的调查。对植物学学生有帮助的一切，在博物馆、标本馆和图书馆中都能找到。


    通用标本馆是按照邱园的模式排列的。除了 `Zollinger` 在 1845 年至 1858 年间制作的大量植物标本外，它包含了了 Teysmann` 在
    1854 年至 1870 年在整个马来群岛采集的珍贵藏品。还有 `Kurz` 和 `Scheffer` 的标本，以及来自婆罗洲及邻近岛屿的最新收藏。这里还有邱植物园和几个著名的欧洲标本馆的副本，以及来自英国殖民地植物机构的标本。


    `Herbarium Horti` 包含了编写植物园新目录所需的材料，而 `Herbarium Bogoriense` 则包含了 `Buitenzorg`
    附近的植物。


    除了水果标本外，植物博物馆里还有一份全面的技术收藏——纤维、商业用藤、橡胶和乳胶、用于鞣制的树皮、秘鲁树脂、植物油、靛蓝样品、各种粉、树脂和油脂。还有一个专门关于森林和主要产品的区域。


    关于 `Buitenzorg` 花园及周边地区的更详细信息，可以在巴达维亚 `G. Kolff & Co.` 公司出版的手册中找到。


    人们不需要科学研究人员也能欣赏 `Buitenzorg` 的美。这里有一处景观被反复描述，往往使用了夸张的辞藻——从 `Bellevue` 酒店的阳台俯瞰
    `Tjidani` 山谷的景色。确实，在描述这处自然美景时，很难避免使用夸张的辞藻。


    尽管他描写的是一位美丽的女性，但 `F. Marion Crawford` 用他那精美的风格写作时可能是在描述某种优美的风景：—


    '
