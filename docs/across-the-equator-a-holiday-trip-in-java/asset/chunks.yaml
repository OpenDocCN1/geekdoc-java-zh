    在体验过其他远东港口后，抵达巴达达港丹戎普里克（Tandjong Priok）的游客，不禁会对船舶停泊和货物存储安排的卓越性所震动。我们英国人习惯于认为自己的港口是最好的，贸易安排无与伦比的，因此当我们发现我们的航运和商业竞争对手在某些方面做得比我们更好时，我们感到非常惊讶；所有的智慧并不局限于英国的范围内，也不在那些以英国为出生地而自豪的人之中。我们远东港口的领先地位几乎完全归功于地理位置。我们意识到在最近几年的新加坡，由于我们急于纠正前任官员和居民的错误，海峡殖民地在征收拥有码头、码坞和仓库的`Tanjong
    Pagar Company` 时付出了相当昂贵的代价。丹戎普里克处理的船舶可能不如丹戎巴加那么多，但如果被要求那样做，我们完全不怀疑我们的荷兰邻居会能够从容应对。


    ### 丹戎普里克的海关


    丹戎普里克设有海关检查。在我们那里，这仅仅是一个形式，对进口相机的新征关税并不适用于我们经常使用的`kodak`，因为它正被再次运出国外。但我们禁不住将其与中国及其他亚洲乘客的检查进行对比，这对新加坡来说是不占利的。从理论上讲，新加坡没有海关服务。它是一个自由港，因此从理论上讲，人们在那里登陆时无需经历烦人的检查，就像在某些欧洲大陆港口或旧金山码头所经历的那样。但事实上，那些有机会在新加坡海滨散步的人可能会看到亚洲乘客在任何登陆点，在日晒或雨中翻找行李，而“查车佬”（chentings）——富有的华人财团（“经营”或租赁鸦片和酒类垄权的雇佣）——正在检查行李中是否有鸦片或酒。这里没有像样的登陆点，完全没有适当的行李检查安排，导致这些可怜的亚洲人被迫在这样的条件下接受检查，而这对于一个自诩世界港口领先地位的地方来说是耻辱的。


    他们在丹戎普里克把事情办得更好。


    ### 交通与氛围


    乘坐火车短途即可到达巴达达，在那里，游客在丹戎普里克将行李交给酒店的行李员照顾后，应当乘坐一辆`sado`（轿车）前往他选定的特定酒店。`sado`一词是“dos-a-dos”的变体。这种车辆由小马牵引，在舒适度上无法比人力车，尽管长途距离可能让人力车在巴达达变得无法实现。


    ### 市政厅


    巴达达的优势在于它有几家很不错的酒店可供选择。任何选择`Hotel Nederland`（荷兰酒店）或`Hotel des Indes`（印度支酒店）的人都会说，其他所谓的“远东最佳酒店”在接待客人、整体整洁和价格适中方面仍有学习的空间。


    到达后，人们应该要做的事情之一是在市政厅获得`toelatingskaart`（入境证）。拿着这份文件（尽管他可能永远不会被要求出示），游客就可以在内陆旅行。如果没有它，他可能会遇到麻烦。


    巴达达与法国的`Saigon`（西贡）和`Hanoi`（河内）一样享有比远东任何其他港口都更像欧洲城镇的荣誉。这当然是一个观点，尽管它是基于对从`Yokohama`（横浜）到`Penang`（槟城），包括菲律宾主要港口在内的每一个重要港口的了解。因此，当我们向一位荷兰朋友表达这一观点时，他的回答让我们意外：


    “当我离开新加坡，看着那些精美的建筑，我觉得我已经和欧洲告别了！”


    小小的探听很快表明，只有那些两三层的房子营造了这种印象。


    ### 印度支酒店（Hotel Des Indes）


    这种印象仅是由那些两三层的房子营造的。（注：由于原文中后续段落为重复，此处已根据指令去重并保留所有核心翻译内容）

