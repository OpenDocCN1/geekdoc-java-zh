    It must be seen to be realised. Not even photographs give a true conception of
    the ornate character of the decorative stonework—the hard but freely-worked lava
    stone having lent itself easily to the chisel. Like Cologne or Milan Cathedrals,
    it must be examined minutely to grasp the elaborateness of the sculptured work,
    but, unlike either of these, it does not produce an immediate impression of grandeur
    and religious elevation. It is unlike any of the temples in Japan, or, indeed,
    anywhere, though Ceylon and India may suggest comparisons.


    What will strike the visitor as he perambulates these miles of sculptured terraces
    is the complete absence of any offensive or indecent figure. Mere nudity is not,
    of course, an outrage to the artistic soul; but here there is not even a nude
    or grotesque figure. Each is draped in the fine flowing robes of the East, not
    in monotonous regularity but suggestive of prince and peasant, princess and maids,
    down even to the jewels they wear. Strangely enough, no particularly Javanese
    type of face or figure is represented—all are Hindu, Hindu-Caucasian and pure
    Greek.


    It is not our purpose to give elaborate details of this work of religious art.
    The visitor may obtain at Djocjakarta a copy of Dr. Groneman''s learned treatise
    on the subject, a treatise which will teach him something about Buddhism as well
    as the Boro Budur, of which Dr. Groneman has made an exhaustive study. With his
    guide, the sculptures become an open book to the visitor.'
