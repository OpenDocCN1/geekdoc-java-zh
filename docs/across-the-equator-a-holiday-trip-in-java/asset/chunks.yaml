    然而，这更具考古性而非描述性，我们必须再次感谢 Scidmore 小士，她通过以下文字展示了这些雕塑的规模：


    ### 龛内的佛像。


    “第七、八世纪的日常生活被描绘出来——寺庙、宫殿、宝座和坟墓、船只和房屋，人类所有的建筑都得到了刻画。宫廷与宫殿、田野与村庄的生活在这里皆可见。皇族戴着华丽的珠宝坐在宝座上，侍从在他们面前献上、焚香，武士跪地，少女在跳舞。农民用同样的木棍和笨拙的水牛耕种稻田，用同样的[56]扁担从收获田运回稻穗，这种扁担今天在更远的东方仍在使用。妇女在水池旁盛水，像现在的印度一样顶在头上带走，许多浮雕展示了东部永恒不变的服饰，为这一世纪的雕塑家提供了相同的模型。在那长长三英里的巨大雕塑廊中，一半的奇迹已无法记忆。每一个转角都揭示了更多奇妙的画面、更动人的故事。甚至雕塑家的幽默幻想也也被刻在了石头上。在一处浮雕中，一头装饰华丽的宫象正模仿旁边女孩的舞姿踢腿。其他活泼的大象用象鼻拿着扇子和国伞；而在载着佛教传教士前往岛屿的船周围，游动的海怪兽其表情和类人类的相似程度，让人怀疑那些雕刻家是否也曾用凿子把它们视作枷锁或敌人。在最后一个走廊中，随着宗教的发展，它吸收了许多耆那教或进阶婆罗门的特征，佛像多次被描绘为毗湿奴的第九个化身（或化身），依然坐在莲花座上，用四只手之一拿着一朵莲花。”


    极有可能，这些石建筑是由于地震震落的，因为 `Boro Budur` 靠近三座火山。现在，政府正在进行修复和保护工作，`Djocja` 地区的一些小寺庙已按照原设计进行了修复。


    ### 婆罗浮屠的一廊。


    ### 巴拉浮屠——其中一个走廊。


    ### Smeroe 火山。


    ### Sméroe——高 13,000 英尺。


    `Boro Budur` 有一家小酒店，在研究细节时建议住在那里，我们完全相信从山顶看到的日出是一场令人永生难忘的景观。我们在午后早些时候看到，正午阳光的热气部分遮蔽了景观，但尽管如此依然令人震撼。除了右侧山脉在地平线上延伸处，视野可以跨越数英里的肥沃冲积平原，平原布满了椰子树、香蕉树和棕榈树，每一块土地都耕得“像郁金花床一样”。Marian
    North 小士（她在邱园收藏的花卉作品可能对我们的一些读者来说很熟悉）对这片景色写道：“我们见过的最美的风景。”


    ***


    ## Parambanan 的寺庙。


    `Boro Budur` 附近还有其他的佛教遗迹；但另一处更重要的遗迹分布在 `Djocjakarta` 和 `Soerakarta` 之间的地区。有一座小寺庙
    `Tjandi Kali Bening` 被誉为爪哇印度教艺术的明珠。我们没有看到它；但在另一一天，我们坐在一辆由四匹小马拉着的维多利亚马，在当地跑腿侍从的尖叫声引导下，前往
    Parambanan 平原上散落的寺庙。在那里，在 `Dr. I. Groneman` 另一位考古指南的帮助下，我们得以欣赏这些拥有 1100 年历史的古代宗教信徒中心之美。这些寺庙是该国最有趣的，尽管缺乏
    `Boro Budur` 的规模和宏伟感。虽然它们不包含任何一尊真正的佛像，但有很多婆罗门神灵的画像，`Dr. Groneman` 博士说，有许多理由支持这种观点：它们是由佛教徒建造的，可能是在一个佛教帝国王子和贵族的灰烬之上。


    在提交给 Stamford Raffles 爵关于这些 Parambanan 遗迹的报告中，来自孟加部的 George Baker 上尉写道：“在我的一生中，从未见过如此宏伟且完工的人类劳动样本，以及被遗忘已久的科学与品味，它们紧密地聚集在如此小的范围内，就在这个小小地方，用军事术语来说，我认为这里是爪哇印度教的总部。”


    在《亚洲研究或孟加拉调查亚洲历史、古迹、艺术、科学和文学协会协会会报》第 XIII 卷（加尔答，1820 年）中，`Mr. John Crawfurd`（他显然在
    1816 年访问过爪哇）对 Parambanan 平原的遗迹进行了长而有趣的描述。他描述该地点距离 `Djocjakarta` 十英里，是一个位于 `Rababu`
    和 `Marapi` 之间的山谷，南部是一条较小的高地山脉。


    少数遗迹由单个孤立的寺庙组成，但大部分成群分布，小寺庙环绕着大寺庙。


    小寺庙的形状值得观察。从地基到门楣，它们呈正方形。然后呈现出金字塔形但呈圆形，周围装饰着类似于 `Lingas`（林伽罗）的小像，而一个较大的 `Linga`
    位于整座建筑顶部，形成寺庙的顶点。


    无论过去还是现在，寺庙选址总是邻近丰富的清泉，这是印度教徒渴望的，也是履行仪式的所必不可少的。在两条最纯净的河流旁，`Parambanan` 和 `Plaosan`
    村之间有一个小水池，显然是寺庙的附属设施。这个小水池是一个边长约 200 英尺的正方形。周围地面抬高，看起来完全是人工挖掘的。当 `Mr. Crawfurd`
    访问时，整个水池覆盖着蓝莲花，这种花是寺庙雕塑中非常显眼的装饰。


    那时和现在一样，没有证据表明这些宗教建筑和场所的建造者有印度教后裔，但爪哇人对各种宗教崇拜的宽容程度如同中国人或日本人，游客发现当地人似乎正在某个特定的神龛朝圣，不必感到惊讶。


    `Mr. Crawfurd` 发现不孕的妇女、生意或赌运不利的男子、负债累的人以及病人正在祭拜 `Durgá` 女神，“他们涂抹着香油膏或点缀着花朵。”这种崇拜也不限于下阶层。`Susuhunan`
    下在冥想一个雄心勃勃或危险的计划时，也会向神像进行供奉。


