    ABSTRACT


    # 1. Introduction


    Indonesia is one of the largest shrimp producing countries in Southeast Asia (FAO,
    2020). The Indonesian shrimp farming industry initially developed in East Java
    in the late 1980s before expanding throughout the country. The presence of bacterial
    and viral diseases increases the potential for severe economic losses affecting
