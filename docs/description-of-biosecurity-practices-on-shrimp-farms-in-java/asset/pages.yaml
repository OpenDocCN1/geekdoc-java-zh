  md: '# 2.5.2. Hierarchical clustering and partitioning


    Performing a clustering on the first principal components of MCA is a common approach
    for variables (Hussion, 2010) with complex, multivariate data. Hierarchical clustering
    and partitioning the data set can provide essential information from the work
    data for much of the variance in the data. Agglomerative hierarchical clustering
    and partitioning was performed using R in Statistical Software (from the FactoMine
    package) to the methodology described by Husson (2010). The HCP functions allow
    the use of Euclidean distances to determine the difference between variables using
    the Houveg algorithm which can construct a hierarchical tree. This is based on
    the decomposition of the inertia (total variance) and within-group variance, which
    in turn clusters that are clusters such that the number of clusters is at minimum
    at each level of the tree (Allison et al., 2010).


    A hierarchical tree was constructed through a sequence of nested partitions, from
    the individual class to a more general partition that includes all classes. The
    similarity is measured among them, and a group is different from other grouped
    farms. The number of clusters was chosen by looking at the overall appearance
    of the tree (Hussion et al., 2015). The HCP function provides information for
    selecting an optimal level of division. All levels were considered for the data
    set.


    The MCA and HCP functions were used in the R software, specifically the FactoMine
    package used for multivariate exploratory analysis (R Development Team, 2008;
    Husson et al., 2015). We also used, the missda package allowed the imputation
    of missing values in the data set (Josse et al., 2012; Husson and Josse, 2015).


