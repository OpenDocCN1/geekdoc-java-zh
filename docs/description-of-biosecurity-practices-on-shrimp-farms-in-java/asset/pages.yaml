    # 4. Discussion and conclusions


    This study basically common knowledge of biosecurity practices in grow-intensive
    and intensive shrimp farming in Indonesia, where practices could be improved,
    and industry-wide sharing of data could contribute to the predictive risk analysis
    by enhanced detection and accuracy. Such data could provide the basis for longitudinal
    use of biosecurity practices for farmers to improve detection and probability
    of pathogen spread.


    For Lampung and Java, we characterized the growth of farms into three clusters
    based on their biosecurity practices. It was observed that farms in East Java
    were more represented by smaller farms, had more biosecurity deficiencies than
    Cluster 3 (consisting of medium large farms from West Java), and however, in higher
    categories of risk. The introduction of new technology improved through treatment
    of biosecurity practices.


