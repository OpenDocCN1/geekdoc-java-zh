    pathogen-herb treatment may be used incorporating targeted field strategy for
    selected products would provide useful measures for timely and detection of disease
    emergence and implementation of control decisions (Lotz, 1997). Effective management
    practices to reduce pathogen and outbreaks would benefit from further farmers
    and agricultural awareness of scientific and epidemiological knowledge (Muningsathing
    et al., 2010; Ali et al., 2018). Training for managers and organizations implementing
    consistent systems and enhancing the capacity of farmers through improved methods
    that can lead to increased productivity.


    Consequently, the primary aim of this study is to improve availability of disease
    and mortality records, including with increased frequency for prospective longitudinal
    surveillance (Boerlage et al., 2017). When training, sufficient information can
    address deficiencies that can prevent poor or inadequate adherence to diagnostic
    and biotic processes (Muningsathing et al., 2010).


    A collective approach to gathering disease and biological information across different
    regions and farming industry, including help from government and service providers,
    will strengthen the effectiveness of surveillance against both mandatory disease
    and voluntary management practices. Adoption may ensure sustainable production
    and reduced risk of pathogen outbreak, clinical disease occurrence, and spread
    (Walker and Mohan, 2009). These programs also need to consider the impacts of
    specific pathogens on farming and control of outbreaks and cycles, practices of
    infection and disease, and decreasing the risk of pathogen spread between/in farms
    in proximity or due to shared equipment, operations and workers (Lotz, 1997; Muningsathing
    et al., 2010; Boerlage et al., 2017). Unlike larger farmers, those with limited
    resources may need adopting methods that would ensure their sustainable production
    and disease risk management (Walker and Mohan, 2009; Muningsathing et al., 2010).
