    The sustainability of the Indonesian shrimp farming industry is challenged by
    the presence of bacterial and viral diseases and their associated potential for
    severe economic losses and environmental impact. In shrimp aquaculture, biosecurity
    is essential to prevent pathogen introduction, emergence and spread between and
    within farms. This study was conducted using a questionnaire to survey the biosecurity
    practices for grow-out and intensive shrimp farms in Indonesia. A questionnaire
    was designed to collect information on farm characteristics, farm management,
    and biosecurity practices. Descriptive statistics, multiple correspondence analyses,
    and hierarchical cluster analysis were performed. The objective of the study was
    to describe the biosecurity practices implemented by farms and to classify them
    into clusters, based on these practices. Distinct clusters were identified for
    90 grow-out farms in Java and Lampung area, while 7 clusters were identified for
    101 intensive farms in Banyuwangi. Clusters ranged from micro and small-scale
    farms, with less biosecurity practices, to not testing quality, and not infecting
    peoples etc. One cluster was characterized by medium biosecurity practices, including
    disinfection for visitors, testing quality, and frequent period greater than 30
    days between cycles. In Banyuwangi areas, farms could not be distinctly classified
    by patterns of biosecurity practices but were grouped by biosecurity structure
    (e.g., lack of response or missing records). For future sustainable programs and
