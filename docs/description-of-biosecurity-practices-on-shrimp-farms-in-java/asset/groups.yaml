    ## 2.5.2. 分层聚类与划分


    对主成分分析（MCA）的第一主成分进行聚类是处理复杂多变量数据的常用方法（Husson, 2010）。对数据集进行分层聚类和划分可以从工作数据中提取关于大部分变异的关键信息。使用
    R 语言统计软件（来自 `FactoMine` 包）按照 Husson (2010) 描述的方法执行了凝聚性分层聚类和划分。`HCP` 函数允许使用欧几里得距离，通过
    `Houveg` 算法确定变量之间的差异，该算法可以构建分层树。这是基于惯性性（总方差）和组内方差的分解，进而对聚类进行分类，使得树的每个层级的聚类数量最少（Allison
    et al., 2010）。


    通过一系列嵌套划分构建了分层树，从单个类别到包含所有类别的更通用划分。它们之间的相似性得到了衡量，并且某组与其他分组的农场不同。聚类数量是通过观察树的整体外观来确定的（Husson
    et al., 2015）。`HCP` 函数提供了选择最佳划分层级的信息。数据集考虑了所有层级。


    在 R 软件使用了 `MCA` 和 `HCP` 函数，特别是用于多变量探索性分析的 `FactoMine` 包（R Development Team, 2008;
    Husson et al., 2015）。我们还使用了 `missda` 包对数据集中的缺失值进行填充（Josse et al., 2012; Husson
    and Josse, 2015）。


    ## 3. 结果


    ### 3.1. 按规模和年龄划分农场分组


    在 96 份调查中，100 个受访农场仅评估了男性特征。大多数受访者（96%）为男性。尽管其中 75% 的人具有水产养殖经验，但只有 43% 的接受过与生产相关的培训。大多数农民年龄为
    37 岁，范围从 19 岁到 69 岁不等。每个农场的中位数至少为 2 年；访谈时最大的农场已有 55 年历史。大约 60% 的农场距离最近的上游和下游农场距离
    < 1 km，且所有调查农场都通过水渠与其他农场相连。只有 13% 的受访农场有电，只有 8% 的农场入口有车辆，但有近 30% 的农场使用设备进行了净水或水质监测。有一组农民没有对农场生产进行任何记录，而
    13% 的农场使用纸质系统，极少数（15%）的农场使用了电子记录系统。食物消耗是受访者记录最多的信息（67%）。所有农场都从孵化场购买（例如虾苗或 PL），只有大多数农场评估了所售鱼类的质量，其中测试
    PL 质量的方法包括压力测试（66%）、全筛法（10%）、细菌培养（9%）和肝胰感染（6%）。有三组农民在每个生产年度内不自产饲料，即使他们自产了，持续时间也少于一周。


    对于 MCA，我们使用了 96 个农场，涉及 101 个分类变量。剔除了 100 个数据中的缺失值，剩余共 96 个变量。值最高的变量与使用化学品处理鱼类动物或池塘处理的问题、以及检查使用物种的测试频率有关。结果记录在问卷上（图
    a）。输出的聚类结果将农场分为三组。最佳划分层级通过 `Silhouette` 函数确定（图. b）。


    表 2 汇总了代表这些聚类的结果。聚类 1 是由经营实践较差的小规模农场构成的（例如：不测试水质；不使用消毒；没有对农场生产的任何记录；不自产饲料；每天不吃来自其他农场的鲜鱼）。聚类
    2 几乎由微小规模农场组成，这些农场在生产引入、育苗方面也有一些实践，并向其他农场售卖鱼（例如：每天或每周一次）。聚类 3 主要是应用良好经营实践的中型和大型农场（例如：测试食物来源；最佳消毒；在访问、使用车辆和人员时记录农场生产应用情况以检查质量；农场年龄在
    30 岁之间）。


    ### 3.2. 按范围划分密集型农场


    分析数据来自 101 个农场，涉及 70 个分类变量。约 46.5% 的重要性未归类。尽管大多数农场经过了培训（29% 的农场至少有 6 个池塘，每年 2
    到 4 个池塘）。池塘数量年龄从 6 年到 98 年不等（从 < 7 年到 30 年，21.4% 超过 6 年，39 个超过 30 年）。每个农场的活跃池塘数量值也较高（59%
    范围在 1 到 5 个池塘之间）。调查的池塘尺寸范围为 2 到 80。大约一半的调查农场使用咸水养殖（50.5%），农场使用了循环水（67.2%，范围从 1
    到 80），76.2% 在将水引入池塘时使用了这些水。


    大多数（77%）不靠近邻近农场，尽管只有 22.8% 的农场与其他同物种农场有水路连接。大多数农场（84.2%）使用了围栏系统，大约一半（43.6%）在农场入口未使用大门或检查。结果记录在问卷上（图
    c）。95% 和 84.2% 的农场分别报告他们没有记录（94.1%），未与其他农场交流（89.1%），但农场内池塘之间未共享设备（91.1%）。


