    # 层次级：聚类


    ![](img/c70f384a94a27dede4c896a13b5a47b8_6_0.png)


    # 因子地图上的层级聚类


    ![](img/c70f384a94a27dede4c896a13b5a47b8_6_1.png)


    图 3. 印度尼西亚望岸（Banywangi）农民的层级聚类，根据 (A) 第一主成分的坐标（黑线代表最佳结合水平）和 (B) 前两个成分诱导的地图进行排序。


    聚类 3、4 和 7 的农场数量需要从农民处进行推断，但为了突出它们的差异，简而言之聚类 3（1 个农场）来自 Sukabumi 的 Mayangan 地区，拥有较小的池塘。这还包含了大量关于生物安全、健康管理、疾病和治疗的广泛信息，访谈还报告了一些较好的生物安全实践。同样，聚类
    4（2 个农场）记录了一些较好的生物安全实践，但农民具有研究生学历，且在过去的作物周期中治疗仅是因为疾病，而不是因为水质较差。剩余的聚类组（5、6、7）存在缺失类别：代表聚类
    7 的农场包含较大的池塘，养殖虾类体，使用运河水，有记录并改进了生物安全实践。聚类 5 和 6 由望岸地区良好地代表，并报告了关于一般特征、生物安全实践、农场健康和管理的广泛信息。具体而言，聚类
    5包含所有者年龄较大且受过高中到大学水平的农场。农民从未观察到外部疾病迹象，使用铲子或勺从池塘中取出死动物并用抗生素/水浴进行处理。聚类 6 的农民有此类实践的记录并在农场内埋了死动物，一些人报告上一个周期发生了疾病，并是因为疾病进行了治疗，而非由于任何症状。


    家庭经营的农场不太负担更好的诊断、养殖虾类体、咨询和治疗用品以充分实施生物安全实践（Mananghani 等人，2021；Ali 等人，2018）。另一种解释可能是实施聚类生物安全实践的障碍，例如单元和设备的共享（池塘、车辆、设备）。缺乏基于建设的记录性报告可能导致数据收集不准确、纸质信息转换为电子格式时的错误、重复使用相同名称以及数据的及时性。如果农民能够整合并使用电子信息系统，将有助于捕捉相关的疾病迹象或管理事件，并共享数据以更好地保护环境健康和农民。


    总体而言，响应农民与其实践之间存在巨大差异，这些差异发生在不同的维度上。农场聚类并非通过实践与其他聚类明确区分，而是通过特征区分，且发现单个类别对聚类分布的影响更大。此外，某些变量也影响聚类的大小：例如，县，某些类别只有一个或少数农场适用（如聚类
    3、4 和 7），或物种组成（聚类 7）。


    ## 4. 讨论与结论


    本研究基本上涵盖了印度尼西亚集约型和密集型虾类养殖中生物安全实践的常识，这些实践可以得到改进，行业范围内的数据共享可以通过增强检测和准确性有助于预测性风险分析。此类数据可以为农民长期使用生物安全实践提供基础，以提高检测能力和病原体扩散概率。


    对于楠榜和爪腊，我们根据其生物安全实践将农场增长分为三类。观察到东爪腊的农场更多地以小型农场为主，比聚类 3（由西爪腊的中大型农场组成）更多的生物安全缺陷，但处于较高的风险水平。新技术的引入通过生物安全实践的处理得到了改进。


    中爪腊和东爪腊通过病原体增长，尽管这被认为是引入病原体的主要途径之一（Corin 等）。对这两个聚类农场观察到的实践的某种解释可能是由于财务资源，小规模农民未来的调查可能需要根据研究区域对农场聚类进行分离和定制的调查，以解决问题的特定测试变量（特征或变量）。该研究开发是为了提高农民的响应率，而对问题的回答尚不明确、不一致或请求者未知。在考虑缺失数据的情况下，有必要使用更好的方案进行跟进调查。未来的研究还应包括社会科学方面，以识别防止农民改进生物安全和疾病管理实践的挑战。


