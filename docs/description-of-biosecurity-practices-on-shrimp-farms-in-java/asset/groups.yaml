    We designed a survey to characterize the current state of shrimp farm biosecurity
    and management practices of JAL''s Indonesian clients. Two separate surveys were
    conducted in the two major provinces of Indonesia by JAL. Data technology focused
    on improving shrimp productivity via IoT technology by the use of data analytics
    and IoT (1), namely (1) Java and Lampung area and (2) Banyuwangi area (Fig. 1).
    Specific questionnaire design methodology is discussed in section 2.2.


