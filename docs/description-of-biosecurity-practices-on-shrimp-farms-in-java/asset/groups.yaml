    # 印度尼西亚爪哇、楠孟贡和万尼望岸虾类养殖场的生物安全措施描述


    Marina K.V.C. Delfino a, Emilie Laurin b, Thitiwan Patanasienkul a, Raynafie Budhi
    Rajhardo b, Lukman Hakim b, Wildan Gaufikar b, Holly Burney b, K Larry Hammell
    b, Krishna Thakur b


    a 海洋养殖系，大西洋兽医学院，爱德华岛大学，550 University Avenue, Charleston, PE CIA 4P3, 加拿大

    b JALA TECH Pr Ltd. Kompleks Pt. Indramar, Jl. Kalurang 16/3, Sleman, Ngrampak,
    Sleman, Daerah Istimewa Yogyakarta, 55884, 印度尼西亚


    印度尼西亚虾类养殖业持续性面临细菌和病毒疾病的挑战，以及这些疾病可能带来的严重经济损失和环境影响。在虾类养殖中，生物安全对于防止病原体在农场之间及内部的引入、出现和传播至关重要。本研究通过问卷对印度尼西亚生长养殖和密集型虾养场的生物安全措施进行了调查。问卷设计用于收集农场特征、农场管理和生物安全措施的信息。研究执行了描述性统计、多重对应分析和层次聚类分析。研究目标是描述农场实施的生物安全措施，并根据这些措施将其归类。针对爪哇和楠孟贡地区的
    90 个生长养殖场识别出了不同的聚类，而针对万尼望岸的 101 个密集型养殖场识别出了 7 个聚类。聚类范围从生物安全措施较少的微小规模农场，到不进行质量检测、不感染人员等。其中一个聚类的特征是具有中等生物安全措施，包括对访客进行消毒、质量检测以及循环之间频繁大于
    30 天。在万尼望岸地区，农场无法根据生物安全措施模式进行明确分类，而是根据生物安全结构（例如缺乏响应或记录缺失）进行分组。为了未来可持续计划的实施以及减少这些地区疾病引入和传播风险的生物安全落实，建议包括：


    - 关键词：

    虾

    印度尼西亚

    生物安全

    流行病学

    调查


    文章信息


    摘要


    # 1. 引言


    印度尼西亚是东南亚最大的产虾国之一（FAO, 2020）。印度尼西亚虾类养殖业最初于 20 世纪 80 年代后期发展于东爪哇，随后扩展到全国。细菌和病毒疾病的存在增加了严重经济损失的风险，影响了您的生存（*注：原文此处
    survive 疑有笔误，应为 survival*），并像许多其他国家一样，对印度尼西亚虾类养殖带来了挑战（Sunarto et al., 2004; Walker
    and Mohan, 2009; Ali et al.）。随着产量增加，高密度、饲料率、水质以及对特定病原体的敏感性会不断变化（Thakur et al.,
    2018; Ali et al., 2015）。虾类行业的服务运营正通过在大型暴露背景下利用流行病学原理和统计模型，开发能够应对疾病能力的系统（如早期检测水平的健康和生产异常）来应对这些挑战（Munias,
    2018）。本研究的启动是一项基础工作，旨在解决印度尼西亚行业潜在的疾病传播路径问题。


    生物安全被定义为农场和区域层面减少动物染病或传播疾病概率的过程，特别是在不利的环境条件下（Lotz, 1997; Pruder, 2004）。由于生物安全措施不足、生物安全防御优势未被充分利用以及通过贸易引入病原体的风险，农民更容易受到传染病的影响。


    改进生物安全是成功性水产产殖系统的必要组成部分。生物安全措施是农场防止虾类养殖场之间发生感染和传播的重要工具。在其他食品生产中使用的生物安全工具（如疫苗接种）或野生动物（Walker
    and Mohan, 2009; Ali et al., 2018），以及农民在靠近农场的情况下不使用无病源或抗病种子，都是可能与传染病的引入和传播相关的因素和做法（Corisin
    et al., 2005; Tang and Bondesson, 2003）。


    通过改进农场管理、工人培训以及关注健康管理实现的有效生物安全，将通过减少风险操作，有助于印度尼西亚密集型虾养殖的可持续性。


    对印度尼西亚养殖虾类的生物安全和管理措施的评估很大程度上缺乏记录或未知，且大多在传染病爆发的情况下进行描述（Amelia et al., 2021; Arifin
    et al., 2021）。这是首项专门用于评估印度尼西亚虾农实施的生物安全措施的研究。本研究的目标是：(1) 设计并实施针对关键水产养殖管理和生物安全措施的问卷调查；(2)
    对密集型虾农的现状提供反馈。其目的是利用调查结果告知印度尼西亚虾业现有生物安全措施中的差距，并为农民建立全面且主动的监测系统做出贡献。长期目标是为印度尼西亚水产部门提供基于证据的健康管理和可持续支持。


    ## 2. 方法论


