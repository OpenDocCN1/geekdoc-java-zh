    ABSTRACT


    # 1. Introduction


    Indonesia is one of the largest shrimp producing countries in Southeast Asia (FAO,
    2020). The Indonesian shrimp farming industry initially developed in East Java
    in the late 1980s before expanding throughout the country. The presence of bacterial
    and viral diseases increases the potential for severe economic losses affecting
    you survive and the challenges of shrimp farming in Indonesia, as it in many other
    countries (Sunarto et al., 2004; Walker and Mohan, 2009; Ali et al.). As production
    increases with high stocking densities, feed rates, and water quality and susceptibility
    to specifically agents experience constant changes (Thakur et al., 2018; Ali et
    al., 2015). Services operations the shrimp industry are addressing these challenges
    by developed systems at increasing disease capabilities (such as early detection
    of health and production anomalies at a normal level) using epidemiological principles
    and statistical models across large exposure contexts (Munias, 2018). This study
    was initiated as a fundamental process to address the potential of disease transmission
    pathways for farmers in the Indonesian industry.


    Biosecurity has been defined as those processes, at the farm and area level, to
    reduce the probability that animals will catch, or spread disease, especially
    under adverse environmental conditions (Lotz, 1997; Pruder, 2004). Farmers are
    more vulnerable to infectious diseases due to inadequate biosecurity measures,
    the advantages of biosecurity defenses, and the risk of introduction of pathogens
    through trade.


    Improved biosecurity is an essential component of successful aquatic production
    systems. Biosecurity practices represent important tools to farms to prevent infection
    and spread between shrimp farms. The presence of biosecurity tools used in other
    food production, such as vaccination, or of wild animals (Walker and Mohan, 2009;
    Ali et al., 2018), and the presence of farmers in close proximity to the farm,
    without using biosecurity-free or disease-resistant seeds are some of the factors
    and practices that may likely be associated with the introduction and spread of
    infectious diseases (Corisin et al., 2005; Tang and Bondesson, 2003).


    Effective biosecurity achieved through improved farm management and worker training
    and attention to health management will contribute to the sustainability of Indonesian
    intensive shrimp production by reducing risky practices.


    Assessments of biosecurity and management practices in shrimp cultured in Indonesia
    are largely undocumented or unknown and mostly described in the prefect of infectious
    disease outbreaks (Amelia et al., 2021; Arifin et al., 2021). This is the first
    study specifically designed to evaluate biosecurity practices implemented by Indonesian
    shrimp farmers. The objectives of this study were to (1) design and implement
    a questionnaire survey addressing key aquaculture management and biosecurity practices,
    and (2) to provide feedback on the current status of intensive shrimp farmers.
    The aim was to use the results to inform the Indonesian shrimp industry of gaps
    in existing biosecurity practices and contribute to building comprehensive and
    proactive surveillance systems for farmers. The long-term goal was to provide
    evidence-based health management and sustainability of the aquaculture sector
    in Indonesia.


    ## 2. Methodology


