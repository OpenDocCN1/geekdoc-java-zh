  md: '# # Chapter 1. Architecture


    In this chapter, we cover the essentials of forming software architecture, specifically
    REST based. We will first look at what is software architecture. We will then
    look at how to select a framework for RESTful Web Services, a web framework, a
    business-tier technology, and a persistence mechanism. Finally, we will review
    popular patterns and best practices and take a look ahead to the application architecture
    covered in the book. The aim is to set the context for the discussions after this
    chapter on data driven development using REST architectural style.


    # ## What is Software Architecture?


    Software architecture denotes the higher-level building blocks of a software system.
    Like architecture in the real world, software architecture defines the high-level
    system structure of the software components, the discipline of creating the component
    hierarchy, and documenting this structure. It also forms a set of architectural
    design decisions that lead to the structure and the rationale behind it. During
    the start of the product development, an architect creates a software architecture,
    which forms the basis of design and development for the technical requirements
    converted from business requirements.


    When we look at how software development started, we mainly focus on the required
    functionality and a data-driven flow. However, modern application development
    has extended the focus on quality attributes such as extensibility, reliability,
    performance, scalability, maintainability, availability, security, backward compatibility
    and usability. These quality attributes drive the software architecture to a certain
    extent and are popularly known as non-functional requirements. There are many
    architectural patterns and styles that have evolved over time with both the functional
    and non-functional requirements. A software architecture is typically built on
    a solid foundation using one of these proven architectural mechanisms. A poor
    architecture may expose risks, such as a system being unstable, being unable to
    execute immediate or future business requirements, or difficult to manage in a
    production environment.


    When the architect studies the requirements of the new system to be developed,
    he should first check to see if the use case can be designed and implemented using
    an established architecture pattern. Because it is typically costly in time and
    money to change an architecture late in the project, this initial phase is very
    important. One should be very careful when creating the software architecture
    because it is not only costly, but also difficult to change and it may put your
    application at risk.


    The software architecture should have a number of goals beyond basic functionality.
    It should be flexible and able to adapt to new business requirements and challenges.
    For example, a system under development may have the requirement of doubling the
    number of registered users within a year. Each module or component of the architecture
    should have a single responsibility or an aggregation of cohesive functionality.
    A specific component should not be aware of the details of other components or
    modules. Duplication should be avoided and specific functionality should be'
