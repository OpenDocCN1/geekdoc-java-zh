  md: '# # Chapter 13. Many-to-Many Self-Referencing with Join-Attribute Relationship


    In this chapter, we will elaborate how to manage a many-to-many self-referencing
    with join-attribute relationship. We will follow the stream developed in the book
    by first looking at the user interface and then the REST service development.


    # ## Domain Model


    ![](img/d6edf9f96429eb727079894e8f397fff_284_0.png)


    Figure 13-1: A many-to-many self-referencing with join attribute relationship


    We will evaluate a many-to-many self-referencing with join attribute relationship
    as illustrated in Figure 13-1. The Worker entity has an identifier and a name
    field of type String. Here we are speaking about an instance of the Worker which
    relates to many instances of Worker with a relationship type of String field,
    and in turn are related to other Workers. The relationship type attribute is used
    to indicate the relationship between the two Workers as Father, Sister or Brother,
    for example. As the relationship is unidirectional you can traverse the list of
    Workers from an instance of Worker but you cannot navigate the contrary. We will
    walk through the traditional way of writing the mock user interface first and
    then the generic service.


    # ## Develop a User Interface


    The three vigorous tasks we learn during the evolution of the mock user interface
    are the development of the data transfer object, the mock service and the mock
    user interface. We develop them one by one.


    # ## Develop the data transfer object


    The WorkerDto data transfer object has an identifier and the name of the worker.
    The join object WorkerWorkerDto has two instances of WorkerDto and a relationship
    type field of String.'
