  md: '# Chapter 5. One-to-One Self-Referencing Relationship


    A one-to-one self-referencing relationship is a one-to-one relationship which
    has a reference to its own instance. We will display the familiarized stream of
    starting with the user interface followed by the service development, then join
    both units at the close of the chapter. Once you finish reading this chapter you
    will be able to fully execute a one-to-one self-referencing relationship, both
    from a user interface as well as a REST service point of view.


    # Domain Model


    ![](img/d6edf9f96429eb727079894e8f397fff_83_0.png)


    Figure 5-1: A one-to-one self-referencing relationship


    We have so far looked at how to manage one-to-one unidirectional and bidirectional
    relationships. Let’s start by looking at the one-to-one self-referencing association
    shown in Figure 5-1. Here, the Student entity has an identifier and a name field
    of String type. The Student can have an optional mentor which is also a Student.
    Hence, within one instance of Student, another instance of Student (who is a mentor)
    can be associated. We will go with the typical stream of script with the mock
    user interface initially and then the service.


    # Develop a User Interface


    The three major tasks we look at during the development of the mock user interface
    are the data transfer object, the mock service and the mock user interface. We
    will look at them one by one.


    # Develop the data transfer object


    The data transfer object does not have the identifier of the Student mentor object
    because the internal design of the one-to-one self-referencing relationship is
    not exposed to the user interface team. In an instance of a Student object there
    could be only one mentor object who is also a Student.

    public class StudentDto {

    private Integer id;

    private String name;'
