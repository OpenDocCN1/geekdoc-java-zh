  md: 'Communication between stakeholders is another key to good architecture. As
    with software architecture plans, there are proven patterns and best practices
    that you can rely on for optimal success here. The most popular way to reduce
    complexity is by introducing the separation of concerns and views which can be
    addressed by specific stakeholders.


    Modern product development does not allow an upfront, big design; it promotes
    the use of agile methodology to break the design into more manageable pieces.
    It should also reduce risk by analyzing the system using modeling techniques and
    visualizations. For example, a system may be first drafted using enterprise modeling
    tools like Enterprise Architect or Rational Rose. The entire team may work in
    parallel describing the design and the architecture using those tools. Finally,
    the architecture developed can be evaluated by proven techniques such as the Software
    Architecture Analysis method (SAAM). SAAM was the first documented software architecture
    analysis method, developed in the 1990s to analyze non-functional requirements
    and flexibility for change. An in-depth discussion of these techniques is beyond
    the scope of this book.


    # What is REST?


    REST (Representation State Transfer) is an architectural style of networked systems,
    as Web applications. REST was first introduced in 2000 in a Ph.D dissertation
    by Roy Fielding, who was one of the writers of the HTTP specification. REST is
    a simple stateless architecture that generally runs over HTTP. A good REST principle
    to start with is that the interaction between client and server requests is stateless
    in nature. Each request should be able to communicate all the information required
    to process the request. On the server side, all requests are identified by a Universal
    Resource Identifier (URI). The URI should be unique to a web application. Standard
    HTTP methods such as POST, GET, DELETE and PUT can be used. The REST architecture
    scales to a large number of client requests it is lightweight in nature and simplifies
    interaction between client and server. We will also look at some of the REST concepts
    like resource, representation, connectors and components. A resource is accessible
    using a global identifier when implementing REST over HTTP. A representation is
    a document representing the current standing of a resource. A component is a piece
    of software instruction, the state of which is modifiable via the exposed interfaces.
    A connector mediates communication among components.


    # Frameworks for RESTful Web Services


    There are three popular RESTful Web Services frameworks: Jersey, Restlet, and
    Spring. Jersey RESTful Services is an open-source framework for developing RESTful
    Web Services in Java that provides support for JAX-RS APIs, constituted by Oracle''s
    Java EE 7 JAX-RS specifications (JSR 311 & JSR 339). Jersey is a Reference Implementation.
    Restlet is a lightweight, open-source framework derived the name of its classes
    directly from the REST concepts (resource, representation, connector, component,
    media type, language), indicating that one is able to think RESTfully and to more
    easily translate a solution into code.'
