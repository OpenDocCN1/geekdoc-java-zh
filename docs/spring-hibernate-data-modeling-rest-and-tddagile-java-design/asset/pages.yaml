  md: '# Chapter 6. One-to-Many Uni-directional Relationship


    A one-to-many unidirectional relationship is a one-to-many relationship which
    has reference from parent to child but not vice versa. We will follow the customary
    flow of starting with the user interface followed by the service development and
    integrating both the modules at the end of the chapter. Following the chapter
    closely will enable you to master the user interface as well as a REST service
    related to a one-to-many unidirectional relationship.


    # Domain Model


    ![](img/d6edf9f96429eb727079894e8f397fff_106_0.png)


    Figure 6-1: A one-to-many unidirectional relationship


    We have seen how to manage the different forms of one-to-one relationships in
    the previous chapters. In this chapter, we will see a one-to-many unidirectional
    association, as shown in Figure 6-1. The Person entity has an identifier and a
    name field of type String. The Phone entity also has an identifier and a number
    String field. In an instance of Person, there must be one or more instances of
    Phone associated. Similarly, in an instance of Phone there must be one instance
    of Person linked. Since the relationship is unidirectional, you can traverse the
    list of Phones from Person but the opposite traversal is not allowed. We will
    follow the pattern of writing the mock user interface initially and then the genuine
    service.


    # Develop a User Interface


    The three key tasks we look at during the growth of the mock user interface are
    the creation of the data transfer object, the mock service and the mock user interface.
    We will proceed one by one in order.


    # Develop the data transfer object


    The Person data transfer object has an identifier, the name of the person and
    a list of String numbers. The identifier of the Phone object is hidden from the
    caller, although an instance of Person can have one or more instances of Phone
    numbers. The idea is not to expose the database design of the complexity and to
    make it simple for the caller to understand the API.

