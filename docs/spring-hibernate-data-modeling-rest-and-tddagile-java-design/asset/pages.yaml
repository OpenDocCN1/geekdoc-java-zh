    The mock service will be interacting with an in-memory custom database for saving
    the data, which will be consumed by the mock user interface. We will begin with
    the add feature. We have a list of StudentDto, with every new entry, one instance
    of StudentDto having a Student and a mentor is added to the list. Enum oriented
    Singleton pattern is used for the in-memory database implementation. The identifier
    field begins with 1 and increments by 1 for every new count.

    public enum StudentInMemoryDB {


    ```

    INSTANCE;

    private static Integer lastId = 0;

    private static List<StudentDto> list = new ArrayList<StudentDto>();

    ```


    ```

    public Integer getId() { return ++lastId; }


    public void add(StudentDto studentDto) {

    studentDto.setId(getId());

    list.add(studentDto);

    }

    ```


