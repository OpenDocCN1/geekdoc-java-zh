  md: '# Appendix: Setting Up the Workspace


    This chapter briefs you on how to work with the GitHub source control location
    and configure the workspace using Eclipse. Following the chapter closely will
    enable you to configure the application and run it successfully. The software
    versions are as of this writing. At a later date, you may choose to download the
    latest versions, the applications may require a certain amount of tweaking to
    run perfectly.


    # Steps to Set Up Spring OODD Workspace


    +   Prerequisites for running Spring OODD application

    - Eclipse IDE for Java EE Developers (http://www.eclipse.org/downloads/packages/eclipse-ide-java-ee-developers/heliossr2)

    - JDK 1.7 (http://www.oracle.com/technetwork/java/javase/downloads/jdk7-downloads-1880260.html)

    - Apache Maven (http://maven.apache.org/)

    - MySql DB Server (http://www.mysql.com/)

    - Apache Tomcat (http://tomcat.apache.org/)


    # Download the source from GitHub


    The source can be downloaded from GitHub (https://github.com/Spring-Hibernate-Book/spring-hibernate-datamodeling-tdd-rest)
    as shown in Figure 17-1.


    ![](img/d6edf9f96429eb727079894e8f397fff_386_0.png)


    *Figure 17-1: Download the code from GitHub*'
