    We will inspect the Client entity which comprises an identifier and a name String
    field. Since the entity is on the owning side and is a bidirectional association,
    a reference to the Account is declared. An instance of the Client may have one
    or more instances of Account which may also be shared with other Clients. Since
    the relationship is bidirectional, reference to a list of Accounts is specified
    on the owning Client side. The @ManyToMany defines a many-valued association with
    many-to-many multiplicity. The join table is specified on the owning side which
    in this case is the Client. The @JoinTable annotation typically specifies the
    join table name with the join column name and the inverse joins column name.

