  md: '# Chapter 14. Single Table Inheritance


    This chapter is a primer to the process of development with a single table inheritance
    relationship. We will continue our journey of creating the user interface at the
    beginning and then write the real service. At the end, we will be integrating
    both the solutions and arriving at a reasonable conclusion.


    # Domain Model


    ![](img/d6edf9f96429eb727079894e8f397fff_310_0.png)


    Figure 14-1: A Single Table Inheritance relationship


    Different types of objects may have something in common with each other. Object
    orientation allows classes to inherit common attributes and methods which is referred
    to as Inheritance. Generalization is the art of extracting shared attributes and
    methods from a related set of classes and forming a generalized superclass. On
    the other hand, Specialization means forming a subclass with attributes and methods
    specific to the subclass. In this chapter, we will look at the first approach
    to handling inheritance in object relational modeling, as shown in Figure 14-1.
    The Protocol entity has an identifier, a name, and a field known as discriminator
    which denotes the difference between an SNMP and a TCP. Here the generalized superclass
    is Protocol and the specialized subclasses are SNMP and TCP. Let''s start by discussing
    how the user interface may be developed.


    # Develop a User Interface


    We will divide the user interface development into three main tasks – the data
    transfer object, the mock service and the mock user interface. We will look at
    each of these tasks by one.


