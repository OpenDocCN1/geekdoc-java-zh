  md: '# Chapter 2. Managing a Standalone Entity


    This chapter is an introduction to the entire process of development with a standalone
    entity. Following the chapter closely will educate you regarding the design of
    the tiers of the application along with development and unit testing techniques.
    First, we will look at the development of the mock user interface and then turn
    to the development of the REST service. We will be taking examples of data modeling
    scenarios and build all the tiers of the application. In this chapter, we have
    taken an example of a standalone entity and will be building all the tiers showing
    how to manage the entity.


    # Domain Model


    | class Standalone Entity |

    | @entity |

    | Product |

    | name String |


    Figure 2-1: A Standalone Entity


    We will start with a simple standalone entity called Product, shown in Figure
    2-1. The properties include name along with an identifier field. The development
    will be divided into two main broad teams - the user interface team and the service
    development team.


    # Develop a User Interface


    When the user interface team starts, they do not receive the service ready. Hence
    they have to create a mock service with an in-memory database. We will divide
    the user interface development into three major tasks – the data transfer object,
    the mock service, and the mock user interface. Remember, the mock user interface
    will be exactly similar to the real user interface with the exception that the
    database is mock. When the service development team is ready to integrate with
    the user interface team, we will replace the mock service with the real one.


    # Develop the data transfer object


    The data transfer object acts as a mapper between the user interface and the data
    access object tier. The internal database design should not be disclosed to the
    user interface; hence mapping is required with a data transfer object.

