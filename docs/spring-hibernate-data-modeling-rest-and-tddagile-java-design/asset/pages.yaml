  md: '# Chapter 4. One-to-One Bi-directional Relationship


    A one-to-one bi-directional relationship is a one-to-one relationship which does
    refer back both ways from parent to child and vice versa. If you find a real life
    situation where the relationship is a to one and you need to traverse in both
    directions, use a one-to-one bi-directional relationship. We will monitor the
    habituated flow of starting with the user interface tracked by the service development
    and seam in both the modules at the conclusion of the chapter.


    # Domain Model


    ![](img/d6edf9f96429eb727079894e8f397fff_60_0.png)


    Figure 4-1: A one-to-one bi-directional relationship


    As shown in the one-to-one bi-directional association in Figure 4-1, the Customer
    entity has an identifier and a String name field. The Cart entity also has an
    identifier with a Double amount field. Because of the bi-directional nature of
    the relationship, in an instance of Customer an instance of Cart must be present
    and vice-versa. We will first write the mock user interface, then turn to the
    service. To develop the mock UI, let''s look at the data transfer object, the
    mock service and the mock user interface.


    # Develop a User Interface


    There are usually three major tasks we look at during the development of the mock
    user interface. They are the data transfer object, the mock service and the mock
    user interface.


