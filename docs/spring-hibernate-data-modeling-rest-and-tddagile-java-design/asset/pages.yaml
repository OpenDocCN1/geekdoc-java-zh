  md: '# # Chapter 8. One-to-Many Self-Referencing Relationship


    A one-to-many self-referencing relationship is a one-to-many relationship which
    has reference to itself. We will study the adapted tide of opening with the user
    interface stalked by the service development and embracing both mechanisms at
    the end of the chapter.


    # ## Domain Model


    ![](img/d6edf9f96429eb727079894e8f397fff_158_0.png)


    Figure 8-1: A one-to-many self-referencing relationship


    In this chapter, we will conduct a one-to-many self-referencing relationship as
    shown in Figure 8-1. The Category entity has an identifier and a name field of
    type String. In an instance of Category, there is an instance of parent Category
    associated. Only for the root element, there is no parent. Think of this example
    as a tree or a product hierarchy where Books is the root and the next level is
    Java, C++ and so on. Please note that the relationship is a one-to-many self-referencing
    relationship, hence the parent can be shared by many children. For example, there
    may be more than one type of book under Books category. We will review the mock
    user interface first of all and then the natural service.


    # ## Develop a User Interface


    The primary tasks we look at during the development of the mock user interface
    are the creation of the data transfer object, the mock service and the mock user
    interface. We will look at these one by one.


