    hence we cannot recreate the parent every time we create a new category. Therefore,
    we are skipping the parent identifier, but not the parent category. If we skip
    the parent name, the parent category has to be recreated and all the related categories
    also have to be recreated by updating the parent category, which is a cumbersome
    task. public class CategoryDto {'
