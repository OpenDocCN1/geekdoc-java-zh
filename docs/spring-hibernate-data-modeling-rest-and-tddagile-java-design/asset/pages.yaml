  md: '# Web Frameworks


    There are currently two major approaches for doing web development: server-side
    MVC and client-side MVC. Server-side MVC renders all pages on the server. Popular
    examples of this framework include Java Server Faces (JSF), Oracle ADF, JBoss
    Seam and Spring MVC. Client-side MVC combines Java Server Pages (JSP) and jQuery
    along a REST API. There are specialized forms of jQuery like Angular and Backbone
    that can be used, and a REST API can be developed using Spring REST support. In
    this book, we will use client-MVC extensively. We will use JSP and jQuery for
    the user interface and Spring REST for the presentation tier. The essential difference
    between client side MVC and server side MVC is that the client bears most of the
    logic in client side MVC (extensively using Javascript) whereas in server side
    MVC the server has to process most of the logic.


    # Business-Tier Technology


    Oracle Java EE 7 talks about two main technology choices for implementing business
    tiers in a JEE web application. The first approach is to use session beans, which
    are part of the Enterprise Java Beans 3.2 (JSR 345). The second approach is to
    use Java API for XML based Web Services (JAXWS 2.2). The third approach is the
    non-JEE approach provided by the Spring framework. The Spring framework provides
    an annotation @Service which indicates the class is a business service façade
    implementation. In this book, we will see this annotation widely used in developing
    the business tier.


    # Persistence Mechanism


    Persistence is the ability to store the state of an object in a non-volatile storage
    such as hard disk. Oracle Java EE 7 mainly provides two basic mechanisms for implementing
    the persistence tier of a web application. The first approach is the use of Java
    Database Connectivity API (JDBC) which provides methods for querying and updating
    data in a database. The second approach is the use of the Java Persistence API
    (JPA) which describes the management of relational data in applications. Here,
    we will use the second approach with Hibernate, an implementation of the JPA specification.
    Hibernate-specific annotations have been intentionally avoided and coverage restricted
    to the use of only JPA annotations.


