    \ interface and then the REST package development.\n\n# Domain Model\n\n![](img/d6edf9f96429eb727079894e8f397fff_261_0.png)\n\
    \nWe evaluate a man-to-many self-referencing relationship as shown in Figure 12-1.\
    \ The Member entity has an identifier and a name field of type String. Here we\
    \ are talking about an instance of the Member which relates to many instances\
    \ of Member and they in turn are related to other Members. As the relationship\
    \ is unidirectional you can traverse the list of Members from an instance of Member\
    \ but you cannot traverse the reverse. An instance of Member is related to many\
    \ instances of Members and hence is a self-referencing many-to-many relationship.\
    \ Please note that the relationship is of a particular type like Friends or Relatives.\
    \ If the relationship changes for every instance, we have to consider the relationship\
