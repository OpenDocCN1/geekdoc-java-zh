  md: '# # Chapter 15. Concrete Table Inheritance


    In the previous chapter, we looked at the first approach to inheritance using
    a discriminator in a single table. In this chapter, we will look at the second
    approach to inheritance. This chapter is a briefing on the process of development
    with a concrete table inheritance relationship. We will first create the user
    interface and then write the actual service. At the end, we will join the two
    solutions and come to a judicious conclusion.


    # ## Domain Model


    ![](img/d6edf9f96429eb727079894e8f397fff_333_0.png)


    Figure 15-1: A Concrete Table Inheritance relationship


    We will begin with a concrete table inheritance relationship, as shown in Figure
    15-1. The Estate entity has an identifier and a name. The Building entity has
    the identifier and the name of the Estate along with a number of floors. The Land
    entity has has all the fields of Estate with the area of the land. The characteristic
    of the concrete table is that all classes have tables and the sub-types have all
    the fields of the super-type.


    # ## Develop a User Interface


    We will divide the user interface development into three main tasks – the data
    transfer object, the mock service and the mock user interface. We will see each
    of these tasks one after another.


    # ## Develop the data transfer object


    The data transfer object contains EstateDto which has an identifier and a name.
    There are two types of EstateDto known as BuildingDto which also has a number
    of floors and LandDto which has an area.


