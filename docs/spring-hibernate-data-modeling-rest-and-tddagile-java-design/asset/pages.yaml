  md: '# Chapter 11. Many-to-Many Bi-directional with Join-Attribute Relationship


    In this chapter, we will look in detail at how to manage a many-to-many bi-directional
    with a join attribute relationship. Going with the flow of the book, we will initially
    look at the user interface and then the REST package development.


    # Domain Model


    ![](img/d6edf9f96429eb727079894e8f397fff_233_0.png)


    Figure 11-1: A many-to-many bi-directional with join attribute relationship


    We will evaluate a many-to-many bi-directional with join attribute relationship
    presented in Figure 11-1. The Manuscript entity has an identifier and a name field
    of type String and the Author entity is also similar. All many-to-many relationships
    necessitate an owner which is the Manuscript. The difference in this case is that
    the join entity has a field apart from an instance of Manuscript and Author. In
    an instance of Manuscript there be one or more instances of Author linked along
    with the publisher and these Author entities in turn be shared by many Manuscript
    entities as. The relationship is bidirectional so we can traverse the list of
    Authors from Manuscript and the reverse traversal is also permitted. The Manuscript
    and Author is associated with a publisher, hence publisher is a describing attribute
    of the relationship and not of the Author or the Manuscript.


    # Develop a User Interface


    The three active tasks we study during the development of the mock user interface
    are the making of the data transfer object, the mock service and the mock user
    interface.


