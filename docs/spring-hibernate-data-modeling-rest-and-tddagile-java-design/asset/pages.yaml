  md: '# # Chapter 3. One-to-One Uni-directional Relationship


    A one-to-one unidirectional relationship is a one-to-one relationship that does
    not refer back to the parent entity and hence is deemed to be unidirectional.
    In this chapter, we will follow the accustomed flow of starting with the user
    interface followed by service development, then join both modules at the culmination
    of the chapter. This approach will allow you to master the user interface by taking
    an example of a related entity followed by the REST service development, so you
    will leave the chapter ready to fully execute a one-to-one unidirectional relationship.


    # ## Domain Model


    ![](img/d6edf9f96429eb727079894e8f397fff_37_0.png)


    Figure 3-1: A one to one unidirectional relationship


    We will first take an example of a one-to-one unidirectional relationship and
    build all the tiers of the application on. As in Figure 3-1, the Book entity has
    an identifier and a name field, which is a String field. Similarly, the Shipping
    entity has an identifier as well as a city field, which is also a String. In one
    instance of Book an instance of Shipping must be present. The Book is the owning
    entity of the relationship from which Shipping can be traversed but not vice-versa.
    We will look at the entity design in the next sections of this chapter. As with
    the previous chapter, we will start by looking at the mock user interface before
    turning to the service development.


    # ## Develop a User Interface


    We will divide the mock user interface development into three major tasks – the
    data transfer object, the mock service and the mock user interface. When the database
    service is ready, we will create the actual user interface and integrate it.


    # ## Develop the data transfer object


    The data transfer object encapsulates the actual entity design and does not allow
    the user interface or the client to know the entity design underneath. Look at
    the data transfer object carefully and you will see the identifier of the Book
    object along with name and city field. We are not exposing the Shipping entity
    or its identifier. We form a relationship between the Book and Shipping in the'
