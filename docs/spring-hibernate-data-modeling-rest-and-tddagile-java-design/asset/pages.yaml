  md: '# Chapter 9. Many-to-Many Unidirectional Relationship


    In this chapter, we will look in detail at how to manage a many-to-many unidirectional
    relationship. Working with the flow in the manuscript, we will initially look
    at the user interface and then the REST service package.


    # Domain Model


    ![](img/d6edf9f96429eb727079894e8f397fff_183_0.png)


    Figure 9-1: A many-to-many uni-directional relationship


    We have seen how to manage the different forms of one-to-many relationships in
    the previous chapters. In this chapter, we will view a many-to-many unidirectional
    association as shown in Figure 9-1. The User entity has an identifier and a name
    field of type String. The Group entity also has an identifier and a name String
    field. Every many-to-many relationship has an owner. In this example, the User
    is the owner. In an instance of User there must be one or more instances of Group
    linked, and these Group entities can in turn be shared by many User entities.
    Since the relationship is unidirectional we can traverse the list of Group from
    User but the opposite traversal is not allowed. We will follow the conventional
    channel of writing the mock user interface first and then the real service.


    # Develop a User Interface


    The three tasks we look at during the evolution of the mock user interface are
    the creation of the data transfer object, the mock service and the mock user interface.
    We will progress one-by-one in order.


    # Develop the data transfer object


    The UserDto data transfer object has an identifier and the name of the user. Similarly
    the GroupDto object has an identifier and a name. The join object UserGroupDto
    has an instance of UserDto and GroupDto.

    public class UserDto {

    private Integer id;'
