  md: '# # Chapter 16. Class Table Inheritance


    In the previous two chapters, we looked at the two approaches to inherit: one
    as a single table and the other as a concrete table. In this chapter, we will
    look at the third and final approach to inheritance with a class table inheritance
    relationship. We will conclude our journey of creating the user interface at the
    start and then write the genuine service. At the conclusion, we will join both
    the solutions and come to a thoughtful inference.


    # ## Domain Model


    ![](img/d6edf9f96429eb727079894e8f397fff_359_0.png)


    Figure 16-1: A Class Table Inheritance relationship


    We will start with a class table inheritance relationship as shown in Figure 16-1.
    This is an example of a normalized design. The Employee entity has an identifier
    and a String name field. The Permanent entity has an identifier which is a foreign
    key to the parent and has fields such as leaves and salary. The Contractor entity
    also has an identifier which is a foreign key with the Employee identifier, and
    fields such as hourly rates and overtime rate.


    # ## Develop a User Interface


    We will break the user interface development into three main tasks – the data
    transfer object, the mock service and the mock user interface. We will look at
    these tasks one after another.


    # ## Develop the data transfer object


    The data transfer object contains EmployeeDto which has an identifier and a name.
    There are two sub-types of EmployeeDto known as PermanentEmployeeDto which also
    has salary and leaves, and ContractorEmployeeDto which has hourly rate and overtime
    rate.

