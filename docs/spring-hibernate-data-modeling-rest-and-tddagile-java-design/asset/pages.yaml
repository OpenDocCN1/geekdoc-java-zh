  md: '# Preface


    I have been working on Java based, data driven applications for more than a decade
    now. I have seen the rise of popular object relational model frameworks solving
    the object impedance mismatch which is a set of technical and conceptual problems
    encountered in an object oriented program when using a relational database management
    system. This book takes into consideration all the relationships of data modeling
    and solving the problem by designing, developing and unit using Spring and Hibernate
    technology. Developers who are working with relational database driven Spring
    and Hibernate applications will find it very useful. The book will also be helpful
    for developers who are using Spring for designing business service and data access
    tiers or service development which supports front ends like Android, iPhone or
    mobile browser.


    Chapter 1 starts with a discussion of the most popular data driven Java based
    architecture – Spring and Hibernate. The architecture alone along with each architected
    and important tier is discussed in detail. The chapter also covers REST architectural
    style in detail.


    Chapter 2 starts with a simple example of managing a standalone entity. The chapter
    contains detailed explanations with code examples.


    Chapters 3, 4 and 5 focus on one-to-one relationships with a detailed explanation
    of how to manage a one-to-one unidirectional, bidirectional or self-referencing
    relationship.


    Chapters 6, 7 and 8 focus on one-to-many relationships. If you wish to manage
    a one-to-many relationship, whether it is a unidirectional, bidirectional or self-referencing
    relationship, this chapter shows you.


    Chapters 9, 10, 11, 12 and 13 are about managing many-to-many relationships. If
    you wish to manage a many-to-many relationship of different varieties, these chapters
    will show you how.


    Chapters 14, 15 and 16 are about managing inheritance relationships. The different
    forms, like Single table, Concrete table and Class table inheritance relationships,
    are covered in detail.


    All the chapters begin with a mock test tier which can be used for developing
    the user interface. The user interface team and the service development team work
    in parallel, saving crucial dependency time in an agile manner. You will find
    a detailed explanation of how to achieve this by reading the second chapter.


    The chapters contain fragments of the entire source code and therefore I thought
    it would be useful to provide the entire source code to the readers. I strongly
    urge that the reader gets hands-on and implements all the code described in this
    book. Experienced architects and developers may skip as per their judgment. The
    Github location for the entire application covered in the book is https://github.com/Spring-Hibernate-Book/spring-hibernate-datamodeling-tdd-rest.
    The download does not require a password.'
