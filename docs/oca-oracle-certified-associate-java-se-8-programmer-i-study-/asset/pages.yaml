    \ static void main(String[] args) {\n    List<String> list = Arrays.asList(\"\
    one\", \"two\");\n}\n```\n\nImports are convenient because you don't need to specify\
    \ where each class comes from each time you use. There is another type of import\
    \ called a static import. Regular imports are for importing classes. Static imports\
