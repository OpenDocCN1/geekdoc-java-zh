    Why won''t you need to be concerned with a primitive or wrapper class is returned,
    you ask? Since Java 5, you can just type the primitive value and Java will convert
    it to the relevant wrapper class for you. This is called autoboxing. Let''s look
    at an example:


    ```

    4: List<Double> weights = new ArrayList<>();

    5: weights.add(50.5); // [50.5]

    6: weights.add(new Double(60)); // [50.5, 60.0]

    7: weights.remove(50.5); // [60.0]

    8: double first = weights.get(0); // 60.0

    ```


    Line 5 autobox the primitive into a Double object and adds to the List. Line 6
    shows that you can still write the code long and pass in a wrapper object. Line
    7 again autobox into the wrapper object and passes it to remove(). Line 8 retrieves
    the Double and unboxes it into a double primitive.

    What do you think if you try to unbox a null?


    ```

    3: List<Integer> heights = new ArrayList<>();

    4: heights.add(null);

    5: int h = heights.get(0); // NullPointerException

    ```


    On line 4, we add a null to the list. This is legal because a null reference can
    be assigned to any reference. On line 5, we try to unbox that null to an int primitive.
    This is a problem. Java tries to get the value of null. Calling any method on
    null gives a NullPointerException, which is what we get. Be careful when you see
    null in relation to autoboxing.

    Be careful when autoboxing into Integer. What do you think this code outputs?


    ```

