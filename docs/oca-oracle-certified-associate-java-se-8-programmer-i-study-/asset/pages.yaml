  md: '# Writing Simple Lambdas 211


    Don''t worry that the syntax looks a little funky. You''ll get to use it and we''ll
    describe it in the next section. We''ll also explain the bits that look like magic.
    For now, just focus on how easy it is to read. We are telling Java that we only
    care about Animals that can hop.

    It doesn''t take much imagination how we would add lambda to get the Animals to
    swim. We only have to add one line of code--no need for an extra class to do something
    simple. Here''s that other line:


    ```

    print(animals, a -> a.canSwim());

    ```


    How about Animals that cannot swim?


    ```

    print(animals, a -> !a.canSwim());

    ```


    The point here is that it is really easy to write code that uses lambdas you get
    the basics in place. This code uses a concept called deferred execution. Deferred
    execution means that code is specified but will run later. In this case, when
    the print() method calls it.


    # Lambda Syntax


    One of the simplest lambda expressions you can write is the one you just saw:


    ```

    a -> a.canHop();

    ```


    This means that Java should call a method with an Animal parameter that returns
    a boolean value''s the result of a.canHop(). We know all this because we wrote
    the code.

    But does Java know?


    Java replies on figuring out what lambda expressions mean. We are passing this
    lambda as the second parameter of the print() method. Method expects a CheckTrait
    as the second parameter. Since we are passing a lambda instead, Java tries to
    map our lambda to that interface:


    ```

    boolean test(Animal a);

    ```


    Since that interface''s method takes an Animal, that means the lambda parameter
    has to be an Animal. And since that interface''s method returns a boolean, we
    know the lambda returns a boolean.


    The syntax of lambdas is tricky because many parts are optional. These two lines
    do the exact thing:


    ```

    a -> a.canHop();

    ```


    ```

    (Animal a) -> { return a.canHop(); };

    ```


    Let''s look at what is going on here. The first example, shown in Figure 4.5,
    has three parts:


    +   - Specify a single parameter with the name a

    - The arrow operator to separate the parameter and body

    - A body that calls a single method and returns the result of that'
