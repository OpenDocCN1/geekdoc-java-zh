    This appendix covers suggestions and recommendations for how you should prepare
    for the certification exam. If you''re an experienced test taker, or you''ve taken
    a certification test before, most of this should be common knowledge. For those
    who are taking the exam for the first time, don''t panic! We''ll present a number
    of tips and strategies in this appendix to help you prepare for the exam.


    # # Studying for the Test


    Before you sign up and take the test, you need to study the material. Studying
    includes the following tasks:


    +   - Create a study plan.

    - Read the Study Guide material.

    - Create and run sample applications.

    - Solve the Review Questions at the end of each chapter.

    - Create flashcards/or use the ones we''ve provided.

    - Take the three practice exams.


    The book is divided into chapters with corresponding exam objectives, to make
    it easier to assimilate. The earlier chapters on syntax and operators are especially
    important since they are used throughout the code samples on the exam. Unless
    we explicitly stated something was out of scope for the exam, you will be required
    to have a strong understanding of all the information in this book.


    # ## Creating a Study Plan


    Rome wasn''t built in a day, so you should attempt to study for only one day.
    Even if you''ve been certified with a previous version of Java, the new test includes
    features and components unique to Java 8 that are covered in this.


    Once you have decided to take the test, we assume that you''ve already been reading
    this book, you should construct a study plan that fits with your schedule. We
    recommend you set some amount of time each day, even if it''s just a few minutes
    during lunch, to read or practice the exam. The idea is to keep your momentum
    going through the exam preparation process. The more consistent you are in how
    you study, the better prepared you will be for the exam. To avoid taking a few
    days or weeks off studying, or you''re likely to spend a lot of time relearning
    existing material instead of moving on to new material.'
