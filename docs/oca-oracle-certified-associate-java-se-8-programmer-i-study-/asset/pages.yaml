    # Optional Exception List


    In Java, code can indicate that something went wrong by throwing an exception.
    We''ll cover this in Chapter 6, "Exceptions." For now, you just need to know that
    it is optional and where in the method signature it goes if present. In the example,
    InterruptedException is a type of Exception. You can list as many types of exceptions
    as you want in this class by commas. For example:


    ```

    public void zeroExceptions() {}

    public void oneException() throws IllegalArgumentException {}

    public void twoExceptions() throws

    IllegalArgumentException, InterruptedException() {

    ```


    You might be wondering what methods do with these exceptions. The calling method
    can throw the same exceptions or handle them. You''ll learn more about this in
    Chapter 6.


