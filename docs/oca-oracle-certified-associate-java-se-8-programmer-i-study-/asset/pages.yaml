  md: "# Understanding Java Statements\n\nThe simplest such repetition control structure\
    \ in Java is the while statement, described in Figure 2.5. Like all repetition\
    \ control structures, it has a termination condition, implemented as a boolean\
    \ expression, that will continue as long as the expression evaluates to true.\n\
    \n# FIGURE 2.5 The structure of a while statement\n\n![](img/7ba91ff267bc04c697c94b2034027b4d_122_0.png)\n\
    \nAs shown in Figure 2.5, a while loop is similar to an if-then statement in that\
    \ it is composed of a boolean expression and a statement, or block of statements.\
    \ During execution, the boolean expression is evaluated before each iteration\
    \ of the loop and exits if evaluation false. It is important to note that a while\
    \ loop may terminate after its first evaluation of the boolean expression. In\
    \ this manner, the statement may never model a mouse eating a meal.\n\nLet's return\
    \ to our mouse example from Chapter 1 and show a loop can be used to model a mouse\
    \ eating a meal:\nroomInBelly = 5;\n\n```\npublic void eatCheese(int bitesOfCheese)\
    \ {\n  while (bitesOfCheese > 0 && roomInBelly) {\n    bitesOfCheese--;\n    roomInBelly--;\n\
    \  }\n  System.out.println(bitesOfCheese + \" pieces of cheese left\");\n}\n```\n\
    \nThis method takes an amount of food, in this case cheese, and continues until\
    \ the mouse has no room in its belly or there is no food left to eat. With each\
    \ iteration of the loop, the mouse \"eats\" one bite of food and loses one spot\
    \ in its belly. By using a boolean statement, you ensure that the while loop can\
    \ end for either of the conditions."
