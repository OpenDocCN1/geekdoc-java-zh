    In Chapter 1, “Java Building Blocks,” we introduced the basic definition for a
    class in Java. In Chapter 4, “Methods and modifiers, and Encapsulation,” we delved
    into constructors, methods, and showed how you can use them to build more structured
    classes. In this chapter, we''ll take one step further and show how class structure
    is one of the most powerful features in the Java language.


    At its core, proper Java class design is about code reusability, increased functionality,
    and standardization. For example, by creating a new class that extends an existing
    class, you may gain access to protected primitives, objects, and methods. Alternatively,
    by designing a standard interface for your application, you ensure that any class
    implements the interface has certain required methods defined. Finally, by creating
    abstract class definitions, you''re defining a platform that other developers
    can extend and build on top of.


    # # Introducing Class Inheritance


    When creating a new class in Java, you can define the class to inherit from an
    existing class. Inheritance is the process by which the new subclass automatically
    includes any public or protected primitives, objects, or methods defined in the
    parent.


    For illustrative purposes, we refer to any class that inherits from another class
    as a *child class*, or declass, the class that the child inherits from the *parent
    class*, or an ancestor of the class. If class X inherits from class Y, and in
    turn inherits from class Z, X would be considered indirect child, or descendant,
    of Z.


    Java supports single inheritance, by which a class may inherit from only one direct
    parent. Java also supports multiple levels of inheritance, by which one class
    may extend another class, in which turn extends another. You can extend class
    any number of times, allowing each descendant to gain access to its ancestor’s
    members.


    To truly understand single inheritance, it may be helpful to contrast it with
    *multiple inheritance*, which a class may have multiple direct parents. By design,
    Java does not support multiple inheritance in the language because studies have
    shown that multiple inheritance can lead to complex, often difficult-to-maintain
    code. Java also allows one exception to the single inheritance rule: classes may
    implement multiple interfaces, as you''ll see later in this chapter.


    Figure 5.1 illustrates the various types of inheritance models. The items on the
    left are considered single inheritance because each child has exactly one parent.
    You may notice that single inheritance doesn''t preclude parents from having multiple
    children. The right'
