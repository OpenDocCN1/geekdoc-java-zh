  md: '# Using Additional Binary Operators


    We''ll expand our discussion of binary operators to include all other binary operators
    you''ll need to know for the exam. This includes operators that perform assignments,
    those that compare arithmetic values and return boolean results, and those that
    compare boolean and object values return boolean results.


    # Assignment Operators


    An *assignment operator* is a binary operator that modifies, or assigns, the variable
    on the left-hand side of the operator, with the result of the value on the right-hand
    side of the equation. The simplest assignment operator is the = assignment, which
    you have seen already:


    ```

    int x = 1;

    ```


    This statement assigns x the value of 1.

    Java will automatically promote from smaller to larger data types, as we saw in
    the previous section on arithmetic operators, but it will throw a exception if
    it detects you are trying to convert from larger to smaller data types.

    Let''s return to some examples similar to what you saw in Chapter 1 in order to
    show how casting can resolve these issues:


    ```

    int x = 1.0; // DOES NOT COMPILE

    short y = 19212222; // DOES NOT COMPILE

    int z = 9f; // DOES NOT COMPILE

    long t = 19230198193810323; // DOES NOT COMPILE

    ```


    The first statement does not compile because you are trying to assign a double
    1.0 to an integer value. Even though the value is a mathematician integer, adding
    .0, you''re instructing the compiler to treat it as a double. The second statement
    does not compile because the literal 19212222 is outside the range of short and
    the third statement does not compile because of the f added to the number that
    instructs the compiler to treat it as floating-point value. Finally the last statement
    does not compile because Java interprets the literal as an int and notices that
    the value is larger than int allows. The literal would need a prefix L to be considered
    a long.


    # Casting Primitive Values


    We can fix the examples in the previous section by casting the results to a smaller
    data type. Any time you are going from a larger numerical type to a smaller numerical
    data type, or converting from a floating-point number to an integral value.


    ```

    int x = (int)1.0;

    short y = (short)19212222; // Stored as 20678

    ```'
