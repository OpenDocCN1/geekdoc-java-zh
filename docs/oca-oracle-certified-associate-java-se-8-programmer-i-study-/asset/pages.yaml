  md: '# Chapter 2 • Operators and Statements


    noticed in Table 2.1, the multiplicative operators (*, /, %) have a higher order
    of precedence than the additive operators (+, -). That means when you see an expression
    such as this:


    ```

    int x = 2 * 5 + 3 * 4 - 8;

    ```


    you first evaluate the 2 * 5 and 3 * 4, which reduces the expression to the following:


    ```

    int x = 10 + 12 - 8;

    ```


    Then, you evaluate the remaining terms in left-to-right order, resulting in a
    value of x of 14. Make sure you understand why the result is 24 as you will likely
    see this kind of operator precedence question on the exam.


    Notice that we say “Unless overridden with parentheses..." prior to Table 2.1.
    That’s because you can change the order of operation by wrapping parentheses around
    the sections you evaluated first. Compare the previous example with the following
    one containing the same values and operators, in the same order, but with two
    sets of parentheses:


    ```

    int x = 2 * ((5 + 3) * 4 - 8);

    ```


    This time you would evaluate the addition operator 10 + 3, which reduces the expression
    to the following:


    ```

    int x = 2 * (8 * 4 - 8);

    ```


    You can further reduce this expression by multiplying the first two values within
    the parentheses:


    ```

