  md: "# Understanding Package Declarations and Imports\n\nJava comes with thousands\
    \ of built-in classes, and there are countless more from developers like you.\
    \ With all those classes, Java needs a way to organize them. It handles this in\
    \ a way similar to a file cabinet. You put all your pieces of paper in folders.\
    \ Java puts classes in packages. These are logical groupings for classes.\n\n\
    We wouldn't put you in front of a file cabinet and tell to find a specific paper.\
    \ Instead, we'd tell you which folder to look in. Java works the same way. It\
    \ is needs to tell it which packages to look in to find code.\n\n```\nSuppose\
    \ you try to compile this:\npublic class ImportExample {\n    public static void\
    \ main(String[] args) {\n        Random r = new Random(); // DOES NOT COMPILE\n\
    \        System.out.println(r.nextInt(10));\n    }\n}\n```\n\nThe Java compiler\
    \ helps give you an error that looks like this:\nRandom cannot be resolved to\
    \ a type\n\nThis error could mean you made a typo in the name of the class. You\
    \ double-check and discover that you didn't. The other cause of this error is\
    \ omitting a needed import statement. Import statements tell Java which packages\
    \ to look in for classes. Since you didn't tell Java to look for Random, it has\
    \ no clause.\n\n```\nimport java.util.Random; // import tells us where to find\
    \ Random\npublic class ImportExample {\n    public static void main(String[] args)\
    \ {\n        Random r = new Random();\n        System.out.println(r.nextInt(10));\
    \ // print a number between 0 and 9\n    }\n}\n```\n\nThe code runs; it prints\
    \ a random number between 0 and 9. Just like arrays, Java likes classes to begin\
    \ counting with 0.\n\nJava classes are grouped in packages. The import statement\
    \ tells the compiler which package to look in to find a class. This is similar\
    \ to how mailing a letter works."
