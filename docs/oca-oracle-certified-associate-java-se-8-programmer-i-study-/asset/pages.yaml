  md: "# Understanding Compiler Enhancements\n\nUp to now, we defined numerous classes\
    \ that did not explicitly call the parent constructor via the super() keyword,\
    \ so why did the code compile? The answer is that the Java compiler automatically\
    \ inserts a call to the no-argument constructor super() if the first statement\
    \ is not a call to the parent constructor. For example, the following three class\
    \ and constructor definitions are equivalent, because the compiler will automatically\
    \ convert them all to the last example:\n\n```\npublic class Donkey {\n}\n```\n\
    \n```\npublic class Donkey {\n    public Donkey() {\n    }\\}\n```\n\n```\npublic\
    \ class Donkey {\n    public Donkey() {\n        super();\n    }\\}\n```\n\nMake\
    \ sure you understand the differences between these three Donkey class definitions\
    \ and why Java will automatically convert all to the last definition. Keep the\
    \ process of the Java compile performs in mind as we discuss the next examples.\n\
    \nWhat happens if the parent class doesn't have a no-argument constructor? Recall\
    \ that the no-argument constructor is not required and only inserted if there\
    \ is no constructor defined in the class. In this case, the Java compiler will\
    \ not help and may you create at least one constructor in your child class that\
    \ explicitly calls a parent constructor via the super() command. For example,\
    \ the following code will not compile:\n\n```\npublic class Mammal {\n    public\
    \ Mammal(int age) {\n}\n```\n\n```\npublic class Elephant extends Mammal { //\
    \ DOES NOT COMPILE }\n```\n\nIn this example no constructor is defined within\
    \ the Elephant class, so the compiler tries to insert a default no-argument constructor\
    \ with a super() call, as it did in the Donkey example. The compiler stops, though,\
    \ when it realizes there is no parent constructor that takes no arguments. In\
    \ this example, we must explicitly define at least one constructor, as in the\
    \ following code:"
