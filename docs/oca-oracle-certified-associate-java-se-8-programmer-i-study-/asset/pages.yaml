  md: 'Table 1.1 shows the Java primitive types together with their size in bytes
    and the range of values that each holds.


    # TABLE 1.1 Java primitive types


    | Keyword | Type | Example |

    |---|---|--|

    | boolean | true or false | true |

    | byte | 8-bit integral value | 123 |

    | short | 16-bit integral value | 123 |

    | int | 32-bit integral value | 123 |

    | long | 64-bit integral value | 123 |

    | float | 32-bit floating-point value | 123.45f |

    | double | 64-bit floating-point value | 123.456 |

    | char | 16-bit Unicode value | ''a'' |


    There''s a lot of information in Table 1.1. Let''s look at some key points:


    +   - float and double are used for floating-point (decimal) values.

    - A float requires the letter f following the number so Java knows it is a float.

    - byte, short, int, and long are used for numbers without decimal points.

    - Each numeric type uses twice as many bits as the smaller type. For example,
    short uses twice as many bits as byte does.


    You won''t be asked about the exact sizes of most of these types. You should know
    that a byte can hold a value from -128 to 127. So you''re stuck memorizing this,
    let''s look at how Java gets. A byte is 8 bits. It has two possible values (These
    are basic computer science definitions that you should memorize). $2^8 = 2 * 2
    = 4 * 2 = 8 * 2 = 16 * 2 = 32 * 2 = 64 * 2 = 128 = 256$. Since 0 needs to be included
    in the range, Java takes it from the positive side. Or if you don''t like math,
    you can just memorize it.


    The number of bits is used by Java when it figures out how much memory to reserve
    for your variable. For example, Java allocates 32 bits if you write this:


    ```

    int num;

    ```'
