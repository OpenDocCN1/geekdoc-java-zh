  md: "# Creating Encapsulating Classes\n\nEncapsulatingdata is helpful because it\
    \ prevents callers from making uncontrolled changes to your class. Another common\
    \ technique is making classes immutable so they cannot be changed at all.\n\n\
    Immutable classes are helpful because you know they will always be the same. You\
    \ can pass them around your application with a guarantee that the caller does\
    \ not change anything. This makes programs easier to maintain. It also helps with\
    \ performance by limiting the number of copies, as you can say with String in\
    \ Chapter 3, \"Core Java APIs.\"\n\nOne step in making a immutable class is to\
    \ omit the setters. But wait: we still want the caller to be able to specify the\
    \ initial value—we just don't want it to change after the object is constructed.\
    \ Constructors to the rescue!\n\n```\npublic class ImmutableSwan {\n    private\
    \ int numberEggs;\n    public ImmutableSwan(int numberEggs) {\n        this.numberEggs\
    \ = numberEggs;\n    }\n    public int getNumberEggs() {\n        return numberEggs;\n\
    \    }\n}\n```\n\nIn this example, we don't have a setter. We do have a constructor\
    \ that allows a value to be set. Remember, immutable is only measured after the\
    \ object is constructed. Immutable classes are allowed to have values. They just\
    \ can't change after instantiation.\n\n# Real World Scenario\n\n# Return Types\
    \ in Immutable Classes\n\nWhen you are writing an immutable class, be careful\
