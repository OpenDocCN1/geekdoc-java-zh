    # Relational Operators


    We now move on to relational operators, which compare two expressions and return
    a boolean value. The first four relational operators (see Table 2.3) are applied
    to numeric primitive types only. If the numeric operands are not of the same data
    type, the smaller one is promoted in the manner as previously discussed.


    # TABLE 2.3 Relational operators


    | < | Strictly less than |

    | <= | Less than or equal to |

    | > | Strictly greater than |

    | >= | Greater than or equal to |


    Let’s look at examples of these operators in action:


    ```

    int x = 10, y = 20, z = 10;

    System.out.println(x < y); // Outputs true

    System.out.println(x >= z); // Outputs true

    System.out.println(x > z); // Outputs false

    ```


    Notice that the last example outputs false, although x and z are the same value,
    x is not strictly greater than z.

    The fifth relational operator (Table 2.4) is applied to object references and
    classes or interfaces.


    # TABLE 2.4 Instanceof operator


    | instanceof b | True if the reference that a points to is an instance of a class,
    subclass, or class that implements a particular interface, as named in b |


    The instanceof operator, while useful for determining whether an object is a member
    of a particular class or interface, is out of scope for the OCA exam.'
