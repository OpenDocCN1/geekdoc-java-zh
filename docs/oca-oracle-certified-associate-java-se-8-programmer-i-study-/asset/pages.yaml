  md: '# # Destroying Objects


    Now that we''ve played with our objects, it is time to put them away. Luckily,
    Java automatically takes care of that for you. Java provides a garbage collector
    to automatically look for objects that aren''t needed anymore.


    All objects are stored in your program memory''s heap. The heap, which is also
    referred to as the free store, represents a large pool of unused memory allocated
    to your Java application. The heap can be quite large, depending on your environment,
    but there is always a limit to its size. If your program instantiating objects
    and leaving them on the heap, eventually it will run out of memory.


    In the following sections, we''ll look at garbage collection and the finalize()
    method.


    # # Garbage Collection


    Garbage collection refers to the process of automatically freeing memory on the
    heap by deleting objects that are no longer reachable in your program. There are
    many different algorithms for garbage collection, but you do not need to know
    any of them. You do need to know that System.gc() is not guaranteed to run, and
    you should be able to recognize object eligible for garbage collection.


    Let''s start with the first one. Java provides a method called System.gc(). Now
    you might think from the name that tells Java to run garbage collection. Nope!
    It suggests that now might be a good time for Java to kick off a garbage collection
    run. Java is free to ignore the request.


    The more interesting part of garbage collection is when the memory belonging to
    an object can be reclaimed. Java waits until the code needs that. An object will
    remain on the heap until it is no longer reachable. An object is no longer reachable
    when one of two situations occurs:


    +   - The object has no references pointing to it.


    +   - All references to the object have gone out of scope.


    # # Objects vs. References


    Do not confuse a reference with the object that it refers to; they are two different
    entities. The reference is a variable that has a name and can be used to access
    the contents of an object. A reference can be assigned to another reference, passed
    to a method, or returned from a method. All references are the same size, no matter
    what their type is.


    An object sits on the heap and does not have a name. Therefore, you have no way
    to access an object except through a reference. Objects come in all different
    shapes and sizes consuming varying amounts of memory. An object cannot be assigned
    to another'
