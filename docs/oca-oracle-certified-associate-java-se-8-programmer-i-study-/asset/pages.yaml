    | Scenario | Result |

    | --- | --- |

    | Target element found in sorted array | Index of match |

    | Target element not found in sorted array | Negative value showing one smaller
    than the negative of index, where a match needs to be inserted to preserve order
    |

    | Unsorted array | A surprise—this result isn''t predictable |


    Let''s try these rules with an example:


    ```

    3: int[] numbers = {2,4,6,8};

    4: System.out.println(Arrays.binarySearch(numbers, 2)); // 0

    5: System.out.println(Arrays.binarySearch(numbers, 4)); // 1

    6: System.out.println(Arrays.binarySearch(numbers, 1)); // -1

    7: System.out.println(Arrays.binarySearch(numbers, 3)); // -2

    8: System.out.println(Arrays.binarySearch(numbers, 9)); // -5

    ```


    Take note of the fact that line 3 is a sorted array. If it weren''t, we couldn''t
    apply any the other rules. Line 4 searches for the index of 2. The answer is 0.
    Line 5 searches for the index of 4, which is 1.

    Line 5 searches for the index of 1. Although 1 isn''t in the list, search can
    determine that it should be inserted at 0 to preserve the sorted order. Since
    0 already means for array index, Java needs to subtract 1 to give the answer of
    -1. Line 7 searches for the index of 3. Although 3 isn''t in the list, it would
    need to be inserted at 1 to preserve the sorted order. We negate and subtract
    1 for consistency, getting -1,-1, also known as -2. Finally, line 8 wants to tell
    us 9 should be inserted at 4. We again negate and subtract 1, getting -4,-1, also
    known as -5.'
