  md: "# Chapter 5 • Class Design\n\nNotice that the instance of Mouse contains two\
    \ copies of the tailLength variables: one defined in the parent and one defined\
    \ in the child. These instances are separate from each other, allowing our instance\
    \ of Mouse to reference both tailLength values independently. In the first method\
    \ call, getRodentDetails(), the parent method outputs the value of the tailLength\
    \ variable. In the second method call, getMouseDetails(), the child method outputs\
    \ both the child and parent version of the tailLength variables, using the super\
    \ keyword to access the parent's value.\n\nThe important thing to remember is\
    \ that there is no notion of overriding a member variable. For example, there\
    \ is no code change that could be made to cause Java to override the value of\
    \ tailLength, making it the same in both parent and child. These rules are the\
    \ same regardless of whether the variable is an instance variable or a static\
    \ variable.\n\n![](img/7ba91ff267bc04c697c94b2034027b4d_303_0.png)\n\nAlthough\
    \ Java allows you to hide a variable defined in a parent class with one defined\
    \ in a child class, this is considered an extremely poor coding practice. For\
    \ example, take a look at the following code, which uses a hidden variable length,\
    \ marked as public in both parent and child classes.\n\n```\npublic class Animal\
    \ {\n    public int length = 2;\n}\n\npublic class Jellyfish extends Animal {\n\
    \    public int length = 5;\n    public static void main(String[] args) {\n  \
    \      Jellyfish jellyfish = new Jellyfish();\n        Animal animal = new Jellyfish();\n\
    \        System.out.println(jellyfish.length);\n        System.out.println(animal.length);\n\
    \    }\n}\n```\n\nThis code compiles without issue. Here's the output:\n\n5\n2"
