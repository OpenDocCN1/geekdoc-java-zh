  md: '# Implementing Interfaces


    example, abstract and public are assumed. In other words, whether or not you provide
    them, the compiler will automatically insert them as part of the method definition.

    A class may implement multiple interfaces, each separated by a comma, just as
    in the following example:


    ```

    public class Elephant implements WalksOnFourLegs, HasTrunk, Herbivore {

    }

    ```


    In the example, if any of the interfaces defined abstract methods, the concrete
    Elephant would be required to implement those methods.

    New to Java 8 is the notion of default and static interface methods, which we''ll
    cover at the end of this section.


    # Defining an Interface


    It may be helpful to think of an interface as a specialized kind of abstract class,
    since it shares many the same properties and rules as an abstract class. The following
    is a list of rules for creating an interface, many of which you should recognize
    as adaptions of the rules for defining abstract classes.


    +   1. Interfaces cannot be instantiated directly.

    2. An interface is not required to have any methods.

    3. An interface may not be marked as final.

    4. All top-level interfaces are assumed to have public or default access, and
