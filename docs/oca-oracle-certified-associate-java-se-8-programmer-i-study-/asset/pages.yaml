  md: '# Distinguishing Between Object References and Primitives


    # ## Converting Back to Binary


    Although you don''t need to convert number systems on the exam, we''ll look at
    one example in case you''re curious:


    ```

    System.out.println(56);        // 56

    System.out.println(0b11);     // 3

    System.out.println(0o17);      // 15

    System.out.println(0x1F);      // 31

    ```


    First we have our normal base 10 value. We know you already know how to read that,
    but with us. The rightmost digit is 7 and it''s "worth" 7. The second-to-most
    digit is 5, so it''s "worth" 50 (5 times 10). Adding these together, we get 56.


    Next we have binary, or base 2. The rightmost digit is 1 and is "worth" 1. The
    second-to-most digit is 1. In this case, it''s "worth" 2 (1 times 2) because the
    base is 2. Adding these gets us 3.


    Then comes octal, or base 8. The rightmost digit is 7 and is "worth" 7. The second-to-most
    digit is 1. In this case, it''s "worth" 8 (1 times 8) because the base is 8. Adding
    these gets us 15.


    Finally, we have hexadecimal, or base 16. The rightmost digit is 1 which is also
    known as hex. The rightmost "digit" is F and it''s "worth" 15 (9 is "worth" 9,
    A is "worth" 10, B is "worth" 11, and so forth). The base is 16. Adding these
    gets us 31.


    ```

    int million1 = 1000000;

    int million2 = 1_000_000;

    ```


    We''d rather being the latter one because the zeros don''t run together. You can
    add underscores anywhere except the beginning of a literal, the end of a literal,
    before a decimal point, or after a decimal point. Let''s look at a few examples:


    ```

    double notAtStart = _1000.00;      // DOES NOT COMPILE

    double notAtEnd = 1000.00_;      // DOES NOT COMPILE

    double notByDecimal = 1000_.00;    // DOES NOT COMPILE

    double annoyingButLegal = 1_00_0.0_0; // this compiles

    ```'
