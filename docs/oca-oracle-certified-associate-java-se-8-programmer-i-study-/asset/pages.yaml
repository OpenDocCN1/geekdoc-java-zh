  md: "# Introducing Class Inheritance\n\n```\npublic class Snake extends Reptile\
    \ {\n    protected double getHeight() throws Exception { // DOES NOT COMPILE\n\
    \        return 2;\n    }\n    protected int getLength() throws InsufficientDataException\
    \ { // DOES NOT COMPILE\n        return 10;\n    }\n}\n```\n\nUnlike the earlier\
    \ example, neither of the methods in the child class of this code will compile.\
    \ The getHeight() method in the parent class throws an InsufficientDataException,\
    \ whereas Exception is not a subclass of InsufficientDataException, the third\
    \ rule of overriding methods is violated and the code will not compile. Coincidentally,\
    \ Exception is a supersclass of InsufficientDataException.\n\nNext, the getLength()\
    \ method does not throw an exception in the parent class, but it does throw an\
    \ exception, InsufficientDataException, in the child class. In this manner, the\
    \ child class defines a new exception that the parent class did not, which is\
    \ a violation of the third rule of overriding.\n\nThe last three rules of overriding\
    \ a method may seem arbitrary or confusing at, as you'll see later in this chapter\
    \ when we discuss polymorphism, they are needed for consistency of the language.\
    \ Without these rules, it is possible to create contradictions within the Java\
    \ language.\n\n# Redearing private Methods\n\nThe previous section defined the\
    \ behavior if you override a public or protected method in the class. Now let's\
    \ expand our discussion to private methods. In Java, it is not possible to override\
    \ a method in a parent class since the parent method is not accessible from the\
    \ child class. Because a child class does not have access to the parent method,\
    \ doesn't mean the child class cannot define its own version of the method. It\
    \ means, strictly speaking, that the new method is not an overridden version of\
    \ the parent class's method.\n\nJava permits you to redeclare a new method in\
    \ the child class with the same modifier signature in the parent class. This method\
    \ in the child class is a separate and independent method, unrelated to the parent\
    \ version's method, so none of the rules for overriding methods are invoked. For\
    \ example, let's return to the Camel example we used in the previous section and\
    \ show two related classes that define the same method:\n\n```\npublic class Camel\
    \ {\n    private String getNumberOfOfHumps() {\n        return \"Undefined\";\n\
    \    }\n```"
