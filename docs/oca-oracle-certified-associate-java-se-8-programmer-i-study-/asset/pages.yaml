  md: "# Understanding Java Statements\n\nThe primary difference between the syntactic\
    \ structure of a do-while loop and a while loop is that a do-while loop orders\
    \ the statement or block of statements before the conditional expression, in order\
    \ to reinforce that the statement will executed before the expression is ever\
    \ evaluated. For example, take a look at the output of the following statements:\n\
    \n```\nint x = 0;\ndo {\n  x++;\n} while(false);\nSystem.out.println(x); // Outputs\
    \ 1\n```\n\nJava will execute the statement block first, and then check the loop\
    \ condition. Even though the loop exits right away, the statement block was still\
    \ executed once and the program outputs a 1.\n\n# When to Use while vs. do-while\
    \ Loops\n\nIn practice, it is difficult to determine when you should use a while\
    \ loop and when you should use a do-while loop. The short answer is that it does\
    \ not actually matter. Any while loop can be converted to a do-while loop, and\
    \ vice versa. For example, compare this while loop:\n\n```\nwhile(x > 10) {\n\
    \  x--;\n}\nand this do-while loop:\n```\n\n```\nif(x > 10) {\n  do {\n    x--;\n\
    \  } while(x > 10);\n}\n```\n\nThough one of the loops is easier to read, they\
    \ are functionally equivalent. Java recommends use a while loop when a loop might\
    \ not be executed at all and a do-while loop when the loop is executed at least\
    \ once. But determining whether you should use a while loop or a do-while loop\
    \ in practice is sometimes about personal preference and code readability.\n\n\
    For example, although the first statement is shorter, the second has the advantage\
    \ that you could leverage the existing if-then statement and perform some other\
    \ operation in a new else branch, as shown in the following example:\n\ncontinues"
