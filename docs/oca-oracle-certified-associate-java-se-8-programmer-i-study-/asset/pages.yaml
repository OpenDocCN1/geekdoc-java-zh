  md: "# Creating Abstract Classes\n\nThe first method, swim(), doesn't compile because\
    \ two brackets are provided instead of a semicolon; and Java interprets this as\
    \ providing a body to an abstract method. The second method, age(), doesn't compile\
    \ because it also provides a body to an abstract method. Pay attention to swim(),\
    \ because you'll likely see a question like this on the exam.\n\n# Default Method\
    \ Implementations in Abstract Classes\n\nAlthough you can't provide a default\
    \ implementation to an abstract method in an abstract class, you still can't define\
    \ a method with a body—you can't just mark it as abstract. As long as you do not\
    \ mark it as final, the subclass still has the option to override it, as explained\
    \ in the process below.\n\nNext, we note that an abstract class cannot be marked\
    \ as final for a somewhat obvious reason. By definition, an abstract class is\
    \ one that must be extended by another class to be instantiated, whereas a final\
    \ class can't be extended by another class. By marking an abstract class as final,\
    \ you're saying it can never be instantiated, so the compiler refuses to process\
    \ the code. For example, the following code snippet will not compile:\n\n```\n\
    public abstract class Tortoise { // DOES NOT COMPILE\n}\n```\n\nLikewise, an abstract\
    \ method may not be marked as final for the same reason that an abstract class\
    \ may not be marked as final. Once marked as final, the method can never be overridden\
    \ in a subclass, making it impossible to create a concrete instance of the abstract\
    \ class.\n\n```\npublic abstract class Goat {\n    public abstract void chew();\
    \ // DOES NOT COMPILE\n}\n```\n\nFinally, a method may not be marked as both abstract\
    \ and private. This rule makes sense if you think about it. How would you define\
    \ a subclass that implements a required method if the method is not accessible\
    \ by the subclass itself? The answer is you can't, which is why the compiler will\
    \ complain if you try to do the following:\n\n```\npublic abstract class Whale\
    \ {\n    private void sing(); // DOES NOT COMPILE\n}\n```\n\n```\npublic class\
    \ HumpbackWhale extends Whale {\n    private void sing() {\n        System.out.println(\"\
    Humpback whale is singing\");\n    }\n}\n```"
