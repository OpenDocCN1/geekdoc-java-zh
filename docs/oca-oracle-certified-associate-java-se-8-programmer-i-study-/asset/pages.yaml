    \ is public? |\n|---|---|---|---|---|n| Member in a superclass in a different\
    \ package | No | No | Yes | Yes |\n| Method/file in a non-superclass class in\
    \ a different package | No | No | No | Yes |\n\n# # Defining Static Methods and\
    \ Fields\n\nExcept for the `main()` method, we have been looking at instance methods.\
    \ Static methods don't require an instance of the class. They are shared among\
    \ all users of the class. You can think of static as being a member of the single\
    \ class object that exists independently of any instances of that class.\n\n>\
    \ ## Each Class Have Its Own Copy of the Code?\nClass has a copy of the instance\
    \ variables. There is only one copy of the code for the instance methods. Each\
    \ instance of the class can call it as many times as it would like. However, each\
    \ call of an instance method (or any method) gets space on the stack for method\
    \ parameters and local variables.\nThe same thing happens for static methods.\
    \ There is one copy of the code. Parameters and local variables go on the stack.\n\
    \nJust remember that only data gets its \"own copy.\" There is no need to duplicate\
    \ copies of the code itself.\n\nWe have seen one static method since Chapter 1.\
    \ The `main()` method is a static method. That means you can call it by the class.\n\
    \n```\npublic class Koala {\n    public static int count = 0; // static variable\n\
    \    public static void main(String[] args) { // static method\n        System.out.println(count);\n\
    \    }\n}\n```\n\nWe said that the JVM basically calls Koala.main() to get the\
    \ program started. You can do this too. We can have a KoalaTester that does nothing\
    \ but call the `main()` method."
