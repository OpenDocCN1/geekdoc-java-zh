    # substring()


    The method substring also looks for characters in a string. It returns parts of
    the string. The first parameter is the index to start with the returned string.
    As usual, this is a zero-based index. There is an optional second parameter, which
    is the end index you want to stop.


    Notice we say "stop" rather than "include." This means the endIndex parameter
    is allowed to pass to the end of the sequence if you want to stop at the end of
    the sequence. That would be redundant, though, you could use the second parameter
    entirely in that case. In your own code, you want to avoid this redundancy. Don''t
    be surprised if the example uses this. The method signatures are as follows:


