  md: "```\npublic class Walrus extends Animal { // DOES NOT COMPILE\n}\n```\n\nFirst,\
    \ note that Animal is marked as abstract and Walrus is not. In this example, Walrus\
    \ is considered the first concrete subclass of Animal. Second, since Walrus is\
    \ the first concrete subclass, it must implement all inherited abstract methods,\
    \ getName() in this example. Because it doesn't, the compiler rejects the code.\n\
    \nNotice when we define a concrete class as the \"first\" nonabstract subclass,\
    \ we include the possibility that another nonabstract class may extend an nonabstract\
    \ class. The key point is that the first class to extend the nonabstract class\
    \ must implement all inherited abstract methods. For example, the following variation\
    \ will not compile:\n\n```\npublic abstract class Animal {\n    public abstract\
    \ String getName();\n}\n```\n\n```\npublic class Bird extends Animal { // DOES\
    \ NOT COMPILE\n}\n```\n\n```\npublic class Flamingo extends Bird {\n    public\
    \ String getName() {\n        return \"Flamingo\";\n    }\n}\n```\n\nEven though\
    \ a second subclass Flamingo implements the abstract method getName(), the first\
    \ concrete subclass Bird doesn't; therefore, the Bird class will not compile.\n\
    \n# Extending an Abstract Class\n\nLet's expand our discussion of abstract classes\
