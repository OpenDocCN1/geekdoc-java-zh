  md: 'Like many programming languages, Java is composed primarily of variables, operators,
    and statements put together in some logical order. In the previous chapter, we
    discussed variables and gave you some examples; in this chapter we will discuss
    the various operators and statements available to you within the language. This
    knowledge will allow you to build complex functions and class structures that
