  md: '# Compound Assignment Operators


    Besides the simple assignment operator, =, are also numerous compound assignment
    operators. Only two of the compound operators listed in Table 2.1 are required
    for the exam, += and -=. Complex operators are really just justified forms of
    the simple assignment operator, with a built-in arithmetic or logical operation
    that applies the left- and right-hand sides of the statement and stores the resulting
    value in a variable in the left-hand side of the statement. For, the following
    two statements after the declaration of x and z are equivalent:


    ```

    int x = 2, z = 3;

    x = x * z; // Simple assignment operator

    x *= z; // Compound assignment operator

    ```


    The left-hand side of the compound operator can only be applied to a variable
    that is already defined and cannot be declared a new variable. In the previous
    example, if x was not defined, then the expression x *= z would not compile.

    Compound operators are useful for more than just shorthand—they can also save
    you from having to explicitly cast a variable. For example, consider the following
    example, in which the last line will not compile due to the result being promoted
    to a long and assigned to an int:


    ```

    long x = 10;

    int y = 5;

    y = y * x; // DOES NOT COMPILE

    ```


    Based on the last two sections, you should be able to spot the problem in the
    last line. This line could be fixed with an explicit cast to (int), but there''s
    a better way using the compound assignment operator:


    ```

    long x = 10;

    int y = 5;

    y *= x;

    ```


    The compound operator will first cast x to a long, apply the multiplication of
    two long values, and then cast the result to an int. Unlike the previous example,
    in which the compiler throw an exception, in this example we see that the compiler
    will automatically cast the resulting value to the data type of the value on the
    left-hand side of the compound operator.


    One final thing to know about the assignment operator is that the result of the
    assignment is an expression and of itself, equal to the value of the assignment.
    For example, the following snippet of code is perfectly valid, if not a little
    odd looking:


    ```

    long x = 5;

    long y = (x=3);

    System.out.println(x); // Outputs 3

    System.out.println(y); // Also, outputs 3

    ```'
