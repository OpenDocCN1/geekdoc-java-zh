  md: "# Nested Loops\n\nFirst off, loops can contain other loops. For example, consider\
    \ the following code that iterates over a two-dimensional array, an array that\
    \ contains other arrays as its members. We'll cover multidimensional arrays in\
    \ detail in Chapter 3, but for now assume the following is how you would declare\
    \ a two-dimensional array.\n\n```\nint[][] myComplexArray = {{5,2,1,3},{3,9,8,9},{5,7,12,7}};\n\
    for(int[] mySimpleArray : myComplexArray) {\n   for(int i=0; i<mySimpleArray.length;\
    \ i++) {\n     System.out.print(mySimpleArray[i]+\"\\t\");\n   }\n   System.out.println();\n\
    }\n```\n\nNotice we intentionally mix for and for-each loop in this example. The\
    \ outer loop will execute a total of three times. Each time the inner loop executes\
    \ executes four times. When we execute this code, we see the following output:\n\
    \n| 5 | 2 | 1 |\n| 3 | 9 | 8 |\n| 5 | 7 | 12 |\n\nNested loops can include while\
    \ and do-while, as shown in this example. If you want to determine what this code\
    \ will output:\n\n```\nint x = 20;\nwhile(x>0) {\n   do {\n     x -= 2;\n   }\
    \ while (x>5);\n   x--;\n   System.out.print(x+\"\\t\");\n}\n```\n\nThe first\
    \ loop executes, the inner loop repeats until the value of x is 4. The value will\
    \ be decremented to 3 and that will be at the end of the first iteration of the\
    \ outer loop. On the second iteration of the outer loop, the do-while statement\
    \ will execute once, even though x is already not greater than 5. As you may recall,\
    \ do-while statements always execute the body at least once. This will reduce\
    \ to 1, which will be further lowered by the decrement operator in the outer loop\
    \ to 0. Once the value reaches 0, the outer loop will terminate. The result is\
