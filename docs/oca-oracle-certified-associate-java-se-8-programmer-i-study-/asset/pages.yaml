  md: "# Understanding Exceptions\n\n# Runtime vs. (unchecked) exception is a specific\
    \ type of exception\n\nA runtime (unchecked) exception is a specific type of exception.\
    \ All exceptions occur at the time that the program is run. (The alternative is\
    \ compile time, which would be a compiler error.) People don't refer to them as\
    \ runtime exceptions because that would be too easy to confuse with Runtime! When\
    \ you run it, it means unchecked.\n\nA checked exception includes Exception and\
    \ all subclasses that do not extend RuntimeException. Checked exceptions tend\
    \ to be more anticipated—for example, trying to read a file that doesn't exist.\
    \ Checked exceptions? What are we checking? Java has a rule called the handle\
    \ or declare rule. For checked exceptions, Java requires the code to either handle\
    \ them or declare them in the method signature.\n\nFor example, this method declares\
    \ that it might throw an exception:\n\n```\nvoid fail() throws Exception {\n \
    \   throw new Exception();\n}\n```\n\nNotice that you're using two different keywords.\
    \ throw tells Java that you want to throw an Exception. throw simply declares\
    \ that the method might throw an Exception. It also might not. You will see the\
    \ keyword more later in the chapter.\n\nBecause checked exceptions tend to be\
    \ anticipated, Java enforces that the programmer do something to show the exception\
    \ was thought about. Maybe it was handled in the method. Or maybe the method declares\
    \ it can't handle the exception and someone else should.\n\nAn example of a runtime\
    \ exception is a NullPointerException, which happens when you try to call a member\
    \ on a null reference. This can occur in any method. If you had to declare runtime\
    \ exceptions everywhere, every single method would have clutter!\n\n# Checked\
    \ vs. Unchecked (Runtime) Exceptions\n\nIn the past, developers used checked exceptions\
    \ more than they do now. According to Oracle, they are intended for issues a programmer\
    \ \"might reasonably be expected to recover from\". Then developers started writing\
    \ code a chain of methods kept declaring the same exception and nobody handled\
    \ it. Some libraries started using runtime exceptions for issues a programmer\
    \ might reasonably be expected to recover from. Many programmers hold this approach\
    \ is better. For the OCA exam, you need to know the rules for how checked versus\
    \ unchecked exceptions function. You don't have to decide philosophically whether\
    \ an exception should be checked or unchecked."
  merge: -1
