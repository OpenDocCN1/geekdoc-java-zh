    # IDE Software


    While studying for the exam, you should develop code using a text editor and command-line
    compiler. Some of you may have existing experience with Integrated Development
    Environments (IDEs) such as Eclipse or IntelliJ. An IDE is a software application
    that facilitates software development for computer programmers.


    Although tools are extremely valuable in developing software, they can interfere
    with your ability to quickly spot problems on the exam. For example, when a line
    code does not compile, the IDE will underline it in red, whereas on the exam,
    you''ll have to find the line that does not compile, if there is one, on your
    own.


    If you choose to study with an IDE, make sure you understand everything it is
    doing in the background for you. For the exam, you''ll need to know how to manually
    compile code from the command line, and this experience is rarely learned using
    an IDE. You''ll need to understand why the code does not compile without relying
    on the tips and suggestions provided by the IDE.


    # Identifying Your Weakest Link


    The best advice we can give you to do well on the exam is to practice writing
    sample applications that push the limits of what you already know, and as much
    as often as possible. For example, if the previous samples with float values were
    too difficult for you, then you should spend even more time studying numeric promotion
    and casting expressions.


    Prior to taking the OCA exam, you may already be an experienced Java developer,
    but there is a difference between being able to write Java code and being a certified
    Java'
