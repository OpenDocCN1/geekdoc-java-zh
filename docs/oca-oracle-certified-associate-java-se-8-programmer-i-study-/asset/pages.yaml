    # Reviewing Common Compiler Issues


    The following is a brief list of common things to look for when trying to determine
    whether code compiles. Bear in mind that this is only a partial list. We recommend
    you review each chapter for a comprehensive list of reasons that code will not
    compile. Also, if you have finished reading the book, you should set aside this
    list and return to it when you are preparing to take the exam.


    # Common Tips to Determine if Code Compiles: [Chapter 1]


    +   - Keep an eye out for reserved words. [Chapter 1]


    +   - Verify brackets—{} and parentheses——are being used correctly. [Chapter 1]


    +   - Verify new is used appropriately for creating objects. [Chapter 1]


    +   - Ignore all line indentation especially with if-then statements that do not
    use brackets {}. [Chapter 2]


    +   - Make sure operators compatible data types, such as the logical operator
    (!) only applied to boolean values, and arithmetic operators (+, -, --) only applied
    to numeric values. [Chapter 2]


    +   - For any numeric operators, check for automatic numeric promotion and order
    operation when evaluating an expression. [Chapter 2]


    +   - Verify switch statements use acceptable data types. [Chapter 2]


    +   - Remember == is not the same as equals(). [Chapter 3]


    +   - String values are immutable. [Chapter 3]


    +   - Non-void methods must return a value that matches or is a subclass of the
    return type of the method. [Chapter 4]


    +   - If two classes are involved, make sure modifiers allow proper access of
    variables and methods. [Chapter 4]


    +   - Nonstatic methods and variables require an object instance to access. [Chapter
    4]


    +   - If a class is missing a default no-argument constructor or the provided
    constructors do not explicitly call super(), assume the compiler will automatically
    insert them. [Chapter 5]


    +   - Make sure abstract methods do not define an implementation, and likewise
    concrete methods always define an implementation. [Chapter 5]'
