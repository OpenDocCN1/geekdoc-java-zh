  md: '“unchecked” checked exceptions. Therefore, the Java compiler disallows overriding
    methods with or broader exceptions.


    Finally, overridden methods must use covariant return types for the same kinds
    of reasons as discussed. If an object is cast to a subclass reference and the
    overridden method is called, the return type must be compatible with the return
    type of the parent. If the return type in the child is too broad, it will result
    an inherent cast exception when accessed through the subclass reference.


    For example, if the return type of a method is Double in the parent class and
    is overridden in a subclass with a method that returns any value, the subclass
    would be allowed to return any value, including Integer, another subclass of Number.
    If we are using the object with a reference to the subclass, that means an Integer
    could be returned when a Double was expected. Integer is not a subclass of Double,
    this would lead to an implicit cast exception as soon as the value was referenced.
    Java solves this problem by only allowing covariant return types for overridden
    methods.


    # Summary


    This chapter the basic class structure we presented in Chapter 4 and expanded
    it by introducing the notion of inheritance. Java classes follow a multilevel
    single-inheritance pattern in which every class has exactly one direct parent
    class, with all classes eventually inheriting from java.lang.Object. Java interfaces
    simulate a limited form of multiple inheritance, since Java classes may implement
    multiple interfaces.


    Inheriting a class gives you access to all of the public and protected methods
    of the class, but special rules for constructors and overriding methods must be
    followed or the code will not compile. For example, if the parent class does not
    include a no-argument constructor, an explicit call to a parent constructor must
    be provided in the child''s constructor. Pay close attention to the exam to any
    class that defines a constructor with arguments and doesn''t define a no-argument
    constructor.


    We reviewed overloaded, overridden, and hidden methods and showed how they differ,
    especially in terms of polymorphism. We also introduced the notion of hiding variables,
    although we strongly discourage this practice as it often leads to confusing,
    difficult-to-maintain code.


    We introduced abstract classes and interfaces and showed how you can use them
    to define a platform for other developers to interact with. By definition, an
    abstract type cannot be instantiated and directly requires a concrete subclass
    for the code to be used. default and static interface methods are new to Java
    8, expect to see at least one question on the exam.'
