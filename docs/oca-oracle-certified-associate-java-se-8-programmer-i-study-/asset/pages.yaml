    # Identifiers in the Real World


    Most Java developers follow these conventions for identifier names:


    +   * Method and variables names begin with a lowercase letter followed by CamelCase.

    * Class names begin with an uppercase letter followed by CamelCase. Don’t start
    any identifiers with $. The compiler uses this symbol for some files.


    Also, know that valid letters in Java are not just characters in the English alphabet.
    Java supports the Unicode character set, so there are more than 45,000 characters
    that can start a Java identifier. A few hundred more are non-Arabic numerals that
    may appear after the first character in a legal identifier. Luckily, you don''t
    have to worry about memorizing those for the exam. If you are in a country that
    doesn''t use the English alpha-bet, this is useful to know for a job.


    # Understanding Default Initialization of Variables


    Before you use a variable, it needs a value. Some types of variables get this
    value set automatically, and others require the programmer to specify it. In the
    following sections, we''ll look at the differences between the defaults for local,
    instance, and class variables.


    # Local Variables


    A local variable is a variable defined within a method. Local variables must be
    initialized before use. They do not have a default value and contain garbage data
    until initialized. The compiler will not let you read an uninitialized value.
    For example, the following code generates a compiler error:


    ```

    4: public int notValid() {

    5: int y = 10;

    6: int x;

    7: int reply = x + y; // DOES NOT COMPILE

    8: return reply;

    9: }

    ```'
