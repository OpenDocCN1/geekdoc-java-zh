  md: '# Taking the Test


    +   * 60 Minutes Remaining: Two thirds of the exam finished.

    * 30 Minutes Remaining: First pass of all questions complete.

    * 5 Minutes Remaining: Finished reviewing all questions marked for “Review.” Select
    answers to all questions left blank.


    As you''re taking the exam you may realize you''re falling behind. In this scenario,
    you need to allotting time per question, which may involve more guessing, or you''ll
    end up with some questions that you never even encountered. As discussed in the
    previous section, guessing an answer to a question is better than not answering
    the question at all.


    # Skipping Hard Questions


    If you find you are having difficulty with a particular set of questions, just
    skip them. The exam provides a feature to mark questions for “Review” that you
    can come back to. Remember that all questions on the exam, easy or difficult,
    are weighted the same. It is a better use of your time to spend five minutes answering
    ten questions than the same amount of answering one difficult question.


    You might come to a question that looks difficult and immediately realize it is
    going to take a lot of time. In this case, skip it before starting on it. You
    can save the most difficult problems for the end so you can get all the ones solved
    early. Of course, you shouldn''t mark every question for “Review,” use that sparingly.
    For example, if you only need 30 seconds to solve a specific question, it is better
    to finish it so you do not have to come back to it. The trick is to not get stuck
    on a difficult question for a long period of time.


    # Improving Your Test-Taking Speed


    Answering exam questions quickly does not come naturally to most people. It takes
    a bit of practice and skill to look at a question, a code sample, and 4–6 answers,
    and be able to answer it within a minute or two. The best way to practice is to
    keep solving the review questions at the end of each chapter until you can read,
    understand, and answer them in a minute.


    Once you''ve completed all of the material and practiced with the review questions
    enough you can answer them quickly and correctly, you should try one of the 60-question
    practice exams that come with this Study Guide. You should treat it like the real
    exam, setting aside two hours and finishing it in one sitting.


    Although we recommend you avoid taking the practice exams so much that you memorize
    the questions, and we recommend keeping them until you can finish each practice
    exam in two hours. Remember not to move on to the next one until you pass the
    previous exam in the allotted time. If not, study more and go back to drilling
    on the Review Questions. The idea is that you want to be good at quickly reading
    through the question, honing in on the key concept the question is asking, and
    being able to select the answer that best represents it.'
  merge: -1
  pgno: 410
- img_proc: true
  md: '# Getting a Good Night’s Rest


    Although a lot of people are inclined to cram as much material as they can in
    the hours leading up to the exam, most studies have shown that this is a poor
    test-taking strategy. The best thing we can recommend you do before the exam is
    to get a good night’s rest!


    Given the length of the exam and number of questions, the exam can be quite draining,
    especially if this is your first time taking a certification exam. You might come
    in expectations of the exam with half the time remaining. At some point, you may
    begin to panic, and it is in these moments that these test-taking skills are most
    important. Just remember to take a deep breath, stay calm, eliminate as many wrong
    answers as you can, and make sure to answer each and every question. It is for
    stressful moments like these that being well rested with a good night’s sleep
    will be most beneficial!'
  merge: -1
