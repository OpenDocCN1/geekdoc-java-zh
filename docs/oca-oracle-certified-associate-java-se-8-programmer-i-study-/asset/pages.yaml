  md: '# Logical Operators


    If you have studied computer science, you may have already come across logical
    operators before. Not, no need to panic—we''ll be covering them in detail in this
    section.

    The logical operators, (&), (|), and (*) may be applied to both numeric and boolean
    data types. When they are applied to boolean data types, they are referred to
    as logical operators. Alternatively, when they are applied to numeric data types,
    they are referred to as bitwise operators, they perform comparisons of the bits
    that compose the number. For the exam, you don''t need to know anything about
    numeric bitwise comparisons, so we''ll leave that educational aspect to other
    books.


    You should familiarize yourself with the truth tables for &, |, and ^ where x
    and y are assumed to be boolean data types.


    **FIGURE 2.1** The truth tables for &, |, and ^


    | x & y (AND) | | x | y (INCLUSIVE OR) | | x ^ y (EXCLUSIVE OR) |

    | :--- | :--- | :--- | :--- | :--- | :--- | :--- |

    | x = true | y = true | true | x = true | y = true | true | x = true | y = false
    | false |

    | x = true | y = false | false | x = true | y = false | true | x = true | y =
    true | true |

    | x = false | y = true | false | x = false | y = true | true | x = false | y =
    false | true |

    | x = false | y = false | false | x = false | y = false | false | x = false |
    y = true | false |


    Here are some tips to help remember this table:


    +   - AND is only true if both operands are true.

    - Inclusive OR is only false if both operands are false.

    - Exclusive OR is only true if the operands are different.


    Finally, we present the conditional operators, && and |, which are often referred
    to as short-circuit operators. The short-circuit operators are nearly identical
    to the logical operators, and && and |, except that the right-hand side of the
    expression may never be evaluated if the final result can be determined by the
    left-hand side of the expression. For example, consider the following statement:


    ```

    boolean x = true || (y < 4);

    ```


    Referring to the truth tables, the value x can only be false if both sides of
    the expression are false. Since we know the left-hand side is true, there''s no
    need to evaluate the right-hand side, since no value of y will ever make the value
    of x anything other than true. It may help you to illustrate this concept by executing
    the previous line of code for various values of y.'
