  md: "# Creating Abstract Classes\n\n```\nreturn \"BigCat\";\n}\npublic abstract\
    \ void roar();\n}\n```\n\n```\npublic class Lion extends BigCat {\npublic void\
    \ roar() {\n    System.out.println(\"The Lion lets out a loud ROAR!\");\n}\n}\n\
    ```\n\nIn this example, BigCat provides an implementation for the abstract method\
    \ getName() defined in the abstract Animal class. Therefore, Lion inherits only\
    \ one method, roar(), and is not required to provide an implementation for the\
    \ method getName().\n\nHere's one way to think about this: if an intermediate\
    \ class provides an implementation for an abstract method, it is inherited by\
    \ subclasses as a concrete method, not as an abstract one. In other words, the\
    \ subclasses do not consider an inherited abstract method because it is no longer\
    \ abstract by the time it reaches the subclasses.\n\nThe following are lists of\
    \ rules for abstract classes and abstract subclasses that we have covered in this\
    \ section. Review and understand these rules before taking the exam.\n\n# Abstract\
    \ Class Definition Rules:\n\n+   1. Abstract classes cannot be instantiated directly.\n\
    \n+   2. Abstract classes may be defined with any number, including zero, of abstract\
    \ and non-abstract methods.\n\n+   3. Abstract classes may not be marked as private\
    \ or final.\n\n+   4. An abstract class that extends another abstract class inherits\
    \ all of its abstract methods as its own abstract methods.\n\n+   5. The first\
    \ concrete class that extends an abstract class must provide an implementation\
    \ for all of the inherited abstract methods.\n\n# Abstract Method Definition Rules:\n\
    \n+   1. Abstract methods may only be defined in abstract classes.\n\n+   2. Abstract\
    \ methods may not be declared or final.\n\n+   3. Abstract methods must not provide\
    \ a method body/implementation in the abstract class for which it is declared.\n\
    \n+   4. Implementing an abstract method in a subclass follows the same rules\
    \ for overriding a method. For example, the name and signature must be the same,\
    \ and the visibility of the method in the subclass must be at least as accessible\
    \ as the method in the parent class."
