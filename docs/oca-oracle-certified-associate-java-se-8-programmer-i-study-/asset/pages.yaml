    \ getWeight() throws Exception {\n        return 2;\n    }\n}\n\npublic class\
    \ Snake extends Reptile {\n    protected boolean hasLegs() {\n        return false;\n\
    \    }\n    protected double getWeight() throws InsufficientDataException {\n\
    \        return 2;\n    }\n}\n```\n\nIn this example, both parent and child classes\
    \ define two methods, hasLegs() and getWeight(). The first method, hasLegs(),\
    \ throws an exception InsufficientDataException in the parent class but doesn't\
    \ throw an exception in the child class. This does not violate the third rule\
    \ of overriding methods, though, as no exception is defined. In other words, a\
    \ child method may hide or eliminate a parent method's exception without issue.\n\
    \nThe second method, getWeight(), throws Exception in the parent class and InsufficientDataException\
