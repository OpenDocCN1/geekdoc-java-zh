  md: "# Predicates\n\nIn our earlier example, we created an interface with one method:\n\
    boolean test(Animal a);\n\nLambdas work with interfaces that have only one method.\
    \ These are functional interfaces—interfaces that can be used with functional\
    \ programming. (It's actually more complicated than this, but for the OCA exam\
    \ this is fine.)\n\nYou can imagine that we've had to create lots of interfaces\
    \ like this that we use lambdas. We want to test Animals and Strings and Plants\
    \ and anything else we come across.\nLuckily, Java recognizes that this is a common\
    \ problem and provides an interface for us. It's in the package java.util.function\
    \ and the gist of it is as follows:\n\n```\npublic interface Predicate<T> {\n\
    \  boolean test(T t);\n}\n```\n\nThat looks a lot like our method. The only difference\
    \ is that it uses this type T instead of Animal. The syntax for generics is it\
    \ like when we created an ArrayList and got to specify what type it goes in.\n\
    \nThis means we don't need our own interface and can put everything related to\
    \ our search in one class:\n\n```\n1: import java.util.*;\n2: import java.util.function.*;\n\
    3: public class PredicateSearch {\n4:   public static void main(String[] args)\
    \ {\n5:     List<Animal> animals = new ArrayList<Animal>();\n6:     animals.add(new\
    \ Animal(\"fish\", false, true));\n7:\n8:     print(animals, a -> a.canHop());\n\
    9:   }\n10:  private static void print(List<Animal> animals, Predicate<Animal>\
    \ checker) {\n11:    for (Animal animal : animals) {\n12:      if (checker.test(animal))\
    \ {\n13:        System.out.print(animal + \" \");\n14:            }\n15:     \
    \ System.out.println();\n16:    }\n17:  }\n```\n\nThis time, line 10 is the only\
    \ one that changed. We expect to have a Predicate passed in that that uses type\
    \ Animal. Pretty cool. We can just use it without writing extra code."
