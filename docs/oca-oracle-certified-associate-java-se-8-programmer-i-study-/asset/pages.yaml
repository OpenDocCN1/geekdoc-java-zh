  md: 'The following code snippet illustrates this distinction:


    ```

    int counter = 0;

    System.out.println(counter); // Outputs 0

    System.out.println(+counter); // Outputs 1

    System.out.println(counter); // Outputs 1

    System.out.println(--counter); // Outputs 1

    System.out.println(counter); // Outputs 0

    ```


    The first pre-increment operator updates the value for counter and outputs the
    new value of 1. The next post-decrement operator also updates the value for counter
    but outputs the value before the decrement occurs.


    One common practice in a certification exam, albeit less common in the real world,
    is to apply multiple increment or decrement operators to a single variable on
    the same line:


    ```

    int x = 3;

    int y = ++x * 5 / x --;

    System.out.println("x is " + x);

    System.out.println("y is " + y);

    ```


    This one is more complicated than the previous example because x is modified three
    times on the same line. Each time it is modified, with different values being
    assigned to the variable. As you''ll recall from our discussion on operator precedence,
    order of operation plays an important part in evaluating this example.


    How do you read this code? First, x is incremented and returned to the expression,
    which is multiplied by 5. We can simplify this:


    ```

    int y = 4 * 5 / x --; // x assigned value of 4

    ```


    Next, x is decremented, but the original value of 4 is used in the expression,
    leading to this:


    ```

    int y = 4 * 5 / 4 - x--; // x assigned value of 3

    ```


    The final assignment of x reduces the value to 2, and since this is a pre-increment
    operator, value is returned to the expression:


    ```

    int y = 4 * 5 / 4 + 2; // x assigned value of 2

    ```


    Finally, we evaluate the multiple and division from left-to-right, and finish
    with the addition. The result is printed:


    ```

    x is 2

    y is 7

    ```'
