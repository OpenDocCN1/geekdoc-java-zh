  md: '# TABLE 4.5 Rules for JavaBBeans naming conventions


    | Rule | Example |

    |---|---|

    | Properties are private. | private int numEggs; |

    | Getter methods begin with is if the property is a boolean. | public boolean
    isHappy() { return happy; } |

    | Getter methods begin with get if the property is not a boolean. | public int
    getNumEggs() { return numEggs; } |

    | Setters methods begin with set. | public void setHappy(boolean happy) { this.happy
    = happy; } |


    The method name must have a prefix of set/get, followed by the first letter of
    the property in uppercase, followed by the rest of the property name.


    From the last example in Table 4.5, you noticed that you can name the method parameter
    to set anything you want. Only the method name and property name have naming conventions.


    It''s time for some practice. See if you can figure out which lines follow Java
    naming conventions:


    +   12: private boolean playing;

    13: private String name;

    14: public boolean getPlaying() { return playing; }

    15: public boolean isPlaying() { return playing; }

    16: public String getName(String name) { return name; }

    17: public void updateName(String name) { name = n; }

    18: public void setName(String n) { name = n; }


    Lines 12 and 13 are good. They are private instance variables. Line 14 doesn''t
    follow the JavaBeans naming conventions. Since playing is a boolean, the getter
    begins with is. Line 15 is a correct getter for playing. Line 16 doesn''t follow
    the JavaBeans naming conventions because it should be called getName. Lines 17
    and 18 do not follow the JavaBeans naming conventions because they should be named
    setName. Remember that Java is case sensitive, so setName is not adequate to meet
    the naming convention.'
