  md: "# Understanding Polymorphism 279\n\nThe method getJumpHeight() works just like\
    \ a static method as defined in a class. Other words, it can be accessed without\
    \ an instance of the class with the Hop.getJumpHeight() syntax. Also, note that\
    \ the compiler will automatically insert the access modifier public since all\
    \ methods in interfaces are to be public.\n\nThe following is an example of a\
    \ class Bunny that implements Hop:\n\n```\npublic class Bunny implements Hop {\n\
    \    public void printDetails() {\n        System.out.println(getJumpHeight());\
    \ // DOES NOT COMPILE\n    }\n}\n```\n\nAs you can see, without an explicit reference\
    \ to the name of the interface the code will not compile, even though Bunny implements\
    \ Hop. In this manner, the static methods are not inherited by a class implementing\
    \ the interface. The following modified version of the code resolves the issue\
    \ with a reference to the interface name Hop:\n\n```\npublic class Bunny implements\
    \ Hop {\n    public void printDetails() {\n        System.out.println(Hop.getJumpHeight());\n\
    \    }\n}\n```\n\nIt follows, then, a class that implements two interfaces containing\
    \ static methods with the same signature will still compile at runtime, because\
    \ the static methods are not inherited by the subclass and must be accessed with\
    \ a reference to the interface name. Contrast with the behavior you saw for default\
    \ interface methods in the previous section: the code would compile if subclass\
    \ override the default methods and would fail to compile otherwise. You can see\
    \ that static interface methods have none of the same multiple inheritance issues\
    \ and rules as default interface methods do.\n\n# Understanding Polymorphism\n\
    \nJava supports polymorphism, the property of an object to take on many different\
    \ forms. To put this more precisely, a Java object may be accessed using a reference\
    \ of the same type as the object, a reference that is a superclass of the object,\
    \ or a reference that defines an interface it implements, either directly or through\
    \ a superclass. Furthermore, a cast is not required if the object is reassigned\
    \ to a super type or interface of the object. Let's illustrate this polymorphism\
    \ property with the following example:\n\n```\npublic class Primate {\n    public\
    \ boolean hasHair() {\n        return true;\n    }\n```"
