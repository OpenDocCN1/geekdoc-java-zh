  md: "# Implementing Interfaces\n\nA default method within an interface defines an\
    \ abstract method with a default implementation. In this manner, classes have\
    \ the option to override the default method if they need to, but they are not\
    \ required to do so. If the class doesn't override the method, the default implementation\
    \ will be used. In this manner, the method definition is concrete, abstract.\n\
    \nThe purpose of adding default methods to the Java language was in part to help\
    \ with code development and backward compatibility. Imagine you have an interface\
    \ that is shared among dozens or hundreds of users that you would like to add\
    \ a new method to. If you update the interface with the new method, the implementation\
    \ would break among all of your subscribers, who would be forced to update their\
    \ code. In practice, this might discourage you from making the change altergo.\
    \ By providing a default implementation of the method, the interface becomes backward\
    \ compatible with the existing codebase, while still providing those individuals\
    \ who want to use the new method with the option to override it.\n\nThe following\
    \ is an example of a default method defined in an interface:\n\n```\npublic interface\
    \ ISwarmBlooded {\n    boolean hasScales();\n    public double getTemperature()\
    \ {\n        return 10.0;\n    }\n}\n```\n\nThis example defines two interface\
    \ methods, one is a normal abstract method and the other a default method. Note\
    \ that both are assumed to be public, as all methods of an interface are public.\
    \ The first is terminated with a semicolon and doesn't provide a body, whereas\
    \ the second default method provides a body. Any class that implements ISwarmBlooded\
    \ may rely on the default implementation of getTemperature() or override the method,\
    \ and create its own version.\n\nNote that the default access modifier defined\
    \ in Chapter 4 is completely different from the default method defined in this\
    \ chapter. We defined a default access modifier in Chapter 4 as a lack of an access\
    \ modifier, which indicated that a class, method, or value within another class\
    \ if both classes are within the same package. In this chapter, we are specifically\
    \ talking about the default keyword as applied to a method within an interface.\
    \ Because all methods within an interface are assumed to be public, the access\
    \ modifier for a default method is therefore public.\n\nThe following are the\
    \ default interface rules you need to be familiar with:\n\n+   1. A default method\
    \ may only be declared within an interface and not within a class or abstract\
    \ class.\n\n+   2. A default method must be marked with the default keyword. If\
    \ a method is marked as default, it must provide a method body.\n\n+   3. A default\
    \ method is not assumed to be static, final, or abstract, as it may be overridden\
    \ by a class that implements the interface."
