  md: '# About the Authors


    Jeanne Boyarsky has worked as a Java developer for over 12 years at a bank in
    New York City where she develops, mentors, and conducts training. Besides being
    a senior moderator at CodeRanch.com in her free time, she works on the forum codebase.
    Jeanne also mentors the programming division of a FIRST robotics team, where she
    works with students just getting started with Java.


    Jeanne got her Bachelor of Arts in 2002 and her Master''s in Computer Information
    Technology in 2005. She enjoyed getting her Master''s degree in an online program
    while working full time. Jeanne is also a Distinguished Toastmaster and a Scrum
    Master. You can find out about Jeanne at www.coderanch.com/how-to/java/BioJeanneBoyarsky.


    Scott Selikoff is a professional software consultant, author, and owner of Selikoff
    Solutions, LLC, which provides software development solutions to businesses in
    the tri-state New York City area. Skilled in a plethora of software languages
    and platforms, Scott specializes in database-driven systems, web-based applications,
    and service-oriented architectures.


    A native of Toms River, NJ, Scott achieved his Bachelor of Arts from Cornell University
    in Mathematics and Computer Science in 2002, after 3 years of study. In 2003,
    he received his Master''s of Engineering in Computer Science, also from Cornell
    University.


    As someone with a deep love of education, Scott has always enjoyed teaching others
    new concepts. He''s given lectures at Cornell University and Rutgers University,
    as well as conferences including The Server Side Java Symposium. Scott lives in
    New Jersey with his loving wife and two very playful dogs, a Siberian husky named
    Webby and standard poodle named Georgetown. You can find out more about Scott
    at www.linkedin.com/in/selikoff.


    Jeanne and Scott are both moderators on the CodeRanch forums and can be reached
    there for questions and comments. They also co-author a technical blog called
    Down Home Country Coding at www.selikoff.net.'
