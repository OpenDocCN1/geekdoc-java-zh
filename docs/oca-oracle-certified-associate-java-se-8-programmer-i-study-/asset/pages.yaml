  md: '# Writing Simple Lambdas


    Notice that all of these examples have parentheses around the parameter list except
    the one that takes only one parameter and doesn''t specify the type. Line 3 takes
    0 parameters and always returns the Boolean true. Line 4 takes one parameter and
    calls a method on it, returning the result. Line 5 does the same except that it
    explicitly defines the type of the variable. Lines 6 and 7 take two parameters
    and ignore one of them—isn''t a rule that says you may sure to use all parameters.


    Now let''s make sure you identify invalid syntax. Do you see what''s wrong with
    each of these?


    ```

    print(a, b -> a.startsWith("test")); // DOES NOT COMPILE

    print(a -> { a.startsWith("test"); }); // DOES NOT COMPILE

    print(a -> return a.startsWith("test")); }); // DOES NOT COMPILE

    ```


    The first line needs parentheses around the parameter list. Remember that the
    parentheses are only optional when there is one parameter and it doesn''t have
    a type declared. The second line is missing the return key. The last line is missing
    the semicolon.


    You might have noticed all of your lambdas return a boolean. That is the scope
    for the OCA exam limits what you need to learn.


    # Real World Scenario


    Lambdas are allowed to access variables. This topic isn''t on the OCA exam, but
    you may come across it when practicing. Lambdas are allowed to access variables.
    Here''s an example:


    ```

    boolean wantWhetherCanHop = true;

    print(animals, a -> a.canHop() = wantWhetherCanHop);

    ```


    The trick is that they cannot access all variables. Instance and static variables
    are okay. Method parameters and local variables are fine if they are not assigned
    new values.


    There is one more issue you might see with lambdas. We''ve been defining an argument
    in our lambda expressions. Since Java doesn''t allow you to redeclare a local
    variable, the following is an issue:


    ```

    (a, b) -> { int a = 0; return 5; }; // DOES NOT COMPILE

    ```


    We tried to redeclare a, which is not allowed. By contrast, the following line
    is okay because it uses a variable name:


    ```

    (a, b) -> { int c = 0; return 5; }

    ```'
