    just for this exam OCAJP. It also has a forum called Beginning Java for non-exam-

    s questions. As you read the book, feel free to ask your questions in either of
    those

    forums. If you will be having trouble compiling a class or that you are just plain-

    fused about something. You''ll get an answer from a knowledgeable Java programmer.
    It

    might be one of us.


    # Who Should Buy This Book


    If you want to become certified as a Java programmer, this book is definitely
    for you. If you

    want to acquire a solid foundation in Java and your goal is to prepare for the
    exam, this

    book is also for you. You''ll find clear explanations of the concepts you need
    to grasp and

    plenty of help to achieve the high level of professional competency you need in
    order to suc-

    ceed in your chosen field.'
