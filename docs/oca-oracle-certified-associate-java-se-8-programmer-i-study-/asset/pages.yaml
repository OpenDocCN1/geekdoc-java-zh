    ```


    Line 19 passes 1 as start but nothing else. This means Java creates an array of
    0 for nums. Line 20 passes 1 as start and one more. Java converts this value to
    an array of length 1. Line 21 passes 1 as start and two more values. Java converts
    these two values to an array of 2. Line 22 passes 1 as start and an array of length
    2 directly as nums.


    You''ve seen that Java will create an empty array if no parameters are passed
    for a vararg. However, it is still possible to pass null explicitly:


    ```

    walk(1, null);               // throws a NullPointerException

    ```


    Since null isn''t an int, Java treats it as an array reference that happens to
    be null. It just passes on the null array object. Then the walk() method throws
    an exception because it tries to determine the length of null.


    Accessing a vararg parameter is just like accessing an array. It uses array indexing.


    ```

    16: public static void run(int... nums) {

    17:     System.out.println(nums[1]);

    18: }

    19: public static void main(String[] args) {

    20:     run(11, 22);               // 22

    21: }

    ```


    Line 20 calls a vararg parameter two parameters. When the method gets called,
    it sees an array of size 2. Since indices are 0 based, 22 is printed.


    # Applying Access Modifiers


    You already saw that there are four access modifiers: public, private, protected,
    and default access. We are going to discuss them in order from most restrictive
    to least restrictive:


    +   - private: Only accessible within the same class

    - default (package access): private and other classes in the same package

    - protected: default access and child classes

    - public: protected and classes in the other packages


    # Private Access


    Private access is easy. Only in the same class can call private methods or access
    private fields.'
