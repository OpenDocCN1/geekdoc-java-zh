  md: "When you override a method, you may reference the parent version of the method\
    \ using the super keyword. In this manner, the keywords this and super allow you\
    \ to select between the current and parent version of a method, respectively.\
    \ We illustrate this with the following example:\n\n```\npublic class Canine {\n\
    \    public double getAverageWeight() {\n        return 50;\n    }\n}\npublic\
    \ class Wolf extends Canine {\n    public double getAverageWeight() {\n      \
    \  return super.getAverageWeight()+20;\n    }\n    public static void main(String[]\
    \ args) {\n        System.out.println(new Canine().getAverageWeight());\n    \
    \    System.out.println(new Wolf().getAverageWeight());\n    }\n}\n```\n\nIn this\
    \ example, in which the child class Wolf overrides the parent class Canine, the\
    \ method getAverageWeight() runs without issue and outputs the following:\n\n\
    50.00\n70.00\n\nYou might be wondering, what was the use of super in the child's\
    \ method required? For example, what would the following code output if we removed\
    \ the super keyword in the getAverageWeight() method of the Wolf class?\n\n```\n\
    public double getAverageWeight() {\n    return getAverageWeight()+20; // INFINITE\
    \ LOOP\n}\n```\n\nIn this example, the compiler would not call the Canine method;\
    \ it would call the current Wolf method since it would think you were executing\
    \ a recursive call. A recursive function is one that calls itself as part of execution,\
    \ and it is common in programming. A recursive function must have a termination\
    \ condition. In this example, there is no termination condition; therefore, the\
    \ application will attempt to call itself infinitely and produce a stack overflow\
    \ error at runtime.\n\nOverriding a method is not without limitations, the compiler\
    \ performs the following checks when you override a nonprivate method:\n\n+  \
    \ 1. The method in the child class must have the same signature as the method\
    \ in the parent class."
