    # ClassCastException


    Java tries to protect you from impossible casts. This code doesn''t compile because
    Integer is not a subclass of String:


    ```

    String type = "moose";

    Integer number = (Integer) type; // DOES NOT COMPILE

    ```


    More complicated code throws Java''s attempts to protect you. When the code fails
    at runtime, Java will throw a ClassCastException:


    ```

    String type = "moose";

    Object obj = type;

    Integer number = (Integer) obj;

    ```


    The compiler sees a cast from Object to Integer. This could be okay. The compiler
    doesn''t realize there''s a String in that Object. When the code runs, it yields
    the following output:


    Exception in thread "main" java.lang.ClassCastException: java.lang.String cannot
    be cast to java.lang.Integer


    Java uses both types that were involved in the problem, making it apparent what''s
    wrong.


    # IllegalArgumentException


    IllegalArgumentException is a way for your program to protect itself. We first
    saw the following setter method in the Swan class in Chapter 4, "Methods and Encapsulation."


    ```

    6: public void setNumberEggs(int numberEggs) { // setter

    7: if (numberEggs >= 0) // guard condition

    8: this.numberEggs = numberEggs;

    9: }

    ```


    This code works, but we don''t want to ignore the caller''s request when they
    tell a Swan has -2 eggs. We want to tell the caller that something is wrong—preferably
    in a very obvious way that the caller can ignore so that the programmer will fix
    the problem. Exceptions are an efficient way to do this. Seeing the end with an
    exception is a great reminder that something is wrong:'
