    # Understanding Java Operators


    A Java operator is a special symbol that can be applied to a set of variables,
    values, or literals—referred to as operands—and that returns a result. Three flavors
    of operators are available in Java: unary, binary, and ternary. These types of
    operators can be applied to one, two, or three operands, respectively. For the
    OCA exam, you will need to know a specific subset of operators, how to apply them,
    and the order in which they should be applied. Java operators are not necessarily
    evaluated from left-to-right order. For example, the following Java expression
    is actually evaluated from right-to-left given the operators involved:


    ```

    int y = 3;

    double x = 3 + 2 * --y;

    ```


    In this example, you would first decrement y to 3, and then multiplying the result
    value of 2, and finally add 3. The value would then be automatically upcast from
    9 to 9.0 and assigned to x. The final values of x and y would be 9.0 and 3, respectively.
    If you didn''t follow evaluation, don''t worry. By the end of this chapter, solving
    problems like this should be second nature.


    Unless overridden with parentheses, Java operators follow order of operation,
    listed in Table 2.1, by decreasing order of operator precedence. If two operators
    have the same level of precedence, Java guarantees left-to-right evaluation. You
    need to know only those operators in the OCA exam.


    # TABLE 2.1 Order of operator precedence


    | Operator | Symbols and examples |

    |---|--n| Post-unary operators | expression++, expression-- |

    | Pre-unary operators | +expression, --expression |'
