  md: '# Parsing Dates and Times


    Now that you know how to convert a date or time to a formatted String, you''ll
    find it easy to convert a String to a date or time. Just like the format() method,
    the parse() method takes a formatter as well. If you don''t specify one, it uses
    the default for that type.


    ```

    Formatter f = DateTimeFormatter.ofPattern("MM dd yyyy");

    LocalDate date = LocalDate.parse("01 02 2015", f);

    LocalTime time = LocalTime.parse("11:22");

    System.out.println(date);

    // 2015-01-02

    System.out.println(time);

    // 11:22

    ```


    Here we use both a custom formatter and a default value. This isn''t common, but
    you might have to read code that looks like this on the exam. Parsing is consistent
    in if anything goes wrong, Java throws a runtime exception. That could be a format
    that doesn''t match the String to be parsed or an invalid date.


    # Summary


    In this chapter, you learned that Strings are immutable sequences of characters.
    The concatenation operator (+) creates a new String with the content of the first
    String followed by the content of the second String. If either operand involved
    in the + expression is a string, concatenation is used; otherwise. String literals
    are stored in the string pool. The String class has many methods. You need to
    know charAt(), concat(), endsWith(), equals(), equalsIgnoreCase(), indexOf(),
    length(), startsWith(), substring(), toLowerCase(), toUpperCase(), and trim.


    StringBuilder are mutable sequences of characters. Most of the methods return
    a reference to the current object to allow method chaining. The StringBuilder
    class has many methods. You need to know append(), charAt(), delete(), deleteCharAt(),
    insert(), length(), reverse(), substring(), and toString(). StringBuffer is the
    same as String except that it is not thread safe.


    Calling == on objects will check whether they point to the same object in the
    pool. Calling == on StringBuilder references will check whether they are pointing
    to the same Calling equals() on String objects will check whether the sequence
    of characters is the same. Calling equals() on StringBuilder objects will check
    whether they are pointing to the same object rather than looking at the values
    inside.


