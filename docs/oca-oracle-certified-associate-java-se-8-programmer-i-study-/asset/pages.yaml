  md: '# Chapter 1 • Java Building Blocks


    The return type is int, which is a numeric type. There''s one parameter named
    month, which is of type int as well.


    # Comments


    Another common part of the code is called a comment. Because comments aren''t
    executable code, you can place them anywhere. Comments make your code easier to
    read. You won''t see many comments on the exam—the exam creators are trying to
    make the code difficult to read—but you''ll see them in this book as we explain
    the code. And we hope you use them in your code. There are three types of comments
    in Java. The first is called a single-line comment:


    ```

    // comment until end of line

    ```


    A single-line comment begins with two slashes. Anything you type after that the
    same line is ignored by the compiler. Next comes the multiline-line comment:


    ```

    /*

    * line comment

    */

    ```


    A multiline-line comment (also known as a multiline comment) includes anything
    starting from the symbol /* until the symbol */. People often type an asterisk
    (*) at the beginning of each line of a multiline comment to make it easier to
    read, but you don''t have to. Finally, we have a Javadoc comment:


    ```

    /**

    * Javadoc multiple-line comment

    * @Jeanne and Scott

    */

    ```


    This comment is similar to a multiline comment except it starts with /**. This
    special syntax tells the Javadoc tool to pay attention to the comment. Javadoc
    comments have a specific structure that the Javadoc tool knows how to read. You
    won''t see a Javadoc on the exam—just remember it exists so you can read up it
    online when you start writing programs for others to use.


    As a bit of practice, you can identify which type of comment each of these five
    words is? Is it a single-line or a multiline comment?


    ```

    /*

    * // anteater

    */

    // bear

    // // cat

    ```'
