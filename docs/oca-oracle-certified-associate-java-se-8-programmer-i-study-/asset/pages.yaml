  md: "# Writing Simple Lambdas\n\nanonymous method. It has parameters and a body\
    \ just like full-fledged methods, but it doesn't have a name like a real method.\
    \ Lambda expressions are often referred to as lambs for short. You might also\
    \ know them as closures if Java is not your first language. If you had a bad experience\
    \ with closures in the past, don't worry. They are far simpler in Java.\n\nIn\
    \ other words, a lambda expression is a method that you can pass as if it were\
    \ a variable. For example, there are different ways to calculate age. One year\
    \ corresponds to seven days. You want to write a method that takes an age() method\
    \ as input. To do this in an object-oriented program, you'd need to define a Human\
    \ subclass and a Dog subclass.\n\nLambdas allow you to write powerful code in\
    \ Java. The simplest lambda expressions are on the OCA exam. The goal is to get\
    \ comfortable with the syntax and the concepts. This means you aren't trying functional\
    \ programming yet. You'll see lambdas again on the OCP exam.\n\nIn this section,\
    \ we will cover an example of why lambdas are helpful, the syntax of lambdas,\
    \ and how to use predicates.\n\n# Lambda Example\n\nOur goal is to print out all\
    \ the animals in a list according to some criteria. We'll show how to do this\
    \ without lambdas to illustrate how lambdas are useful. We start out with the\
    \ Animal class:\n\n```\npublic class Animal {\n    private String species;\n \
    \   private boolean canHop;\n    private boolean canSwim;\n    public Animal(String\
    \ speciesName, boolean hopper, boolean swimmer) {\n        species = speciesName;\n\
    \        canHop = hopper;\n        canSwim = swimmer;\n    }\n\n    public boolean\
    \ canHop() { return canHop; }\n    public boolean canSwim() { return canSwim;\
    \ }\n    public String toString() { return species; }\n}\n```\n\nThe Animal class\
    \ has three instance variables, which are set in the constructor. It has two methods\
    \ that get the state of whether the animal can hop or swim. It also has a toString()\
    \ method so we can easily identify the Animal in programs.\n\nWe plan to write\
    \ a lot of different checks, so we want an interface. You'll learn more about\
    \ interfaces in the next chapter. For now, it is enough to remember that an interface\
    \ specifies the methods that our class needs to implement:\n\n```\npublic interface\
    \ CheckTrait {\n    boolean test(Animal a);\n}\n```"
