    # Return Type


    The next item in a method declaration is the return type. The return type might
    be an actual Java type like String or int. If there is no return type, the void
    keyword is used. This special return type comes from the English language: void
    means without contents. In Java, we have no type.


    ![](img/7ba91ff267bc04c697c94b2034027b4d_214_0.png)


    Remember that a method must have a return type. If no value is returned, the return
    type is void. You cannot omit the return type.


    When checking return types, you also have to look inside the method body. Methods
    with a return type other than void are required to have a return statement inside
    the method body. This return statement must include the primitive or object to
    be returned. Methods that have a return type of void are permitted to have a return
    statement with no value or omit the return statement entirely.


