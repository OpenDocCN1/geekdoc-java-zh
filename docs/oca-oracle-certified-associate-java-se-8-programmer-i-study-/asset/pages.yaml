  md: '# Introduction


    Java, "born" in 1995, is now just about 20 years old. As with anything 20 years
    old, there is a good amount of history and variation between versions of Java.
    Over the years, the certification exams have changed to cover different topics.
    The names of the exams have even changed. This book covers the Java 8 Oracle Certified
    Associate (OCA) exam.

    If you read about "the exam" on the Web, you may see information about the older
    names for the exam. We''ve showed the changes in name. Here''s what happened.
    Sun Microsystems to have two exams. The SCJP (Sun Certified Java Programmer) was
    meant for programmers and SCJA (Sun Certified Java Associate) was meant for those
    who wanted broader knowledge. When Oracle changed Sun Microsystems, they changed
    all the names from Sun to Oracle, or OCJP and OCJA.


    ![](img/7ba91ff267bc04c697c94b2034027b4d_22_0.png)


    Then Oracle made two strategic decisions with Java 7. They decided to stop updating
    the OCJA exam. They also decided to cover more on the programmer space and split
    it into two exams. Now you first take the OCAJP (Oracle Certified Associate Java
    Programmer), also known as Java Programmer I, or OCA. That is what this book is
    about. Then you take the OCJP (Oracle Certified Professional Java Programmer),
    also known as Java Programmer II, or OCP. There also an upgrade exam in case you
    took an older version of the SCJP/ OCJP and want to upgrade. Most people refer
    to the current exams as OCA 8, OCP 8, and the Java 8 upgrade exam. When we mention
    a topic split between the OCA and OCP so you know which parts are more advanced.


    We try to keep the history to a minimum in this book. There are some places on
    the exam where you need to know both an "old way" and a "new way" of doing things.
    When that happens, we will be sure to tell you what version of Java introduced
    it. Will also let you know about topics that are not on the exam anymore in case
    you see questions in the older free online mock exams.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# Introduction


    # The OCA Exam


    All you need to do to earn the Oracle Certified Associate Java SE 8 Programmer
    certification is to pass the exam! That''s it.


    Oracle has a tendency to fiddle with the length of the exam and the passing score
    once it comes out. It''s pretty much a guarantee that whatever we tell you here
    will become obsolete, we will give you a feel for the range of variation. The
    OCA exam has varied between 60 and 90 questions since it was introduced. The score
    to pass has varied between 60 percent and 80 percent. The time allowed to take
    the exam has varied from two hours to two-and-a-half hours.


    Although there will likely be changes to the scope of the exam, it certainly isn''t
    a secret. We''ve created a book page on our blog: www.selikoff.net/oca. If there
    are any changes to the topics on the exam after this book is published, we will
    not notify them there.


    That page also contains a link to the official exam page so that you can check
    the length and passing score that Oracle has chosen for the moment.


    # Scheduling the Exam


    The exam is administered by Pearson VUE and can be taken at any Pearson VUE testing
    center. To find a testing center or register for the exam, go to www.pearsonvue.com.
    Choose IT and Oracle. If you haven''t been to the test center before, we recommend
    visiting in advance. Some testing centers are nice and professionally run. Others
    use a closet with lots of people talking around you. You don''t want to be taking
    the exam with someone complaining about their broken laptop nearby!


    At this time, you can reschedule the exam without penalty up to 24 hours before.
    This means that you can register for a convenient time slot well in advance, knowing
    that you can delay if you aren''t ready by that time. Rescheduling is easy and
    can be done on the Pearson VUE website. This may change, so check the rules before
    paying.


    # The Day of the Exam


    When you go to take the exam, remember to bring two forms of ID, including one
    that is government issued. See Pearson''s list of what is acceptable ID at http://www.pearsonvue.com/policies/15.pdf.
    Try not to bring too much extra with as you will not be allowed'
  merge: -1
  pgno: 23
- img_proc: true
  md: 'Introduction xxiii


    into the exam room. While you will be allowed to check your belongings, it is
    better to leave items at home or in the car.


    You will not be allowed to bring your paper, your phone, and so forth into the
    exam room with you. Some centers are stricter than others. At one center, tissues
    were even taken away from us! Most centers allow keeping your ID and memory. They
    watch you taking the exam, though, don''t even think about writing notes on memory.


    The exam center will give you materials to use during the exam. These are used
    as scratch paper during the exam to figure out answers and keep track of your
    thought process. The exam center will dispose of them at the end. Notice how we
    said "writing materials" rather than "pen and paper." Some centers still give
    pen and paper. Most give a small erasable board and a dry erase marker. If you
    have a preference to which you receive, call the testing center in advance.


    # # Finding Your Score


    In the past, you would find out after finishing the exam if you passed. Now you
    have to wait nervously until you can check your score online.


    If you go onto the Pearson VUE website, it will have a status of "Taken" rather
    than your result. Oracle uses a system for scores. You''ll need to go to http://oracle.com
    to find out you passed and your score. It doesn''t update immediately upon taking
    the test, but we''ve heard of it taking more than an hour. In order to check your
    score, you''ll see objectives for which you got a question wrong and instructions
    on how to get a hardcopy certificate.


    At some point, you will get an electronic certificate and some more time after
    that you receive your printed certificate. Sound vague? It is. The times reported
    to receive certificates widely varied.


    # # Exam Questions


    The OCA exam consists of multiple-choice questions. There are typically five or
    six answers. If a question has more than one answer, the question specifically
    states exactly how many correct answers are there. This book does not say We say
    "choose all that apply" to make the questions harder. This means the questions
    in this book are generally harder than those on the exam. The idea is to give
    you more practice so you can spot the correct answer more easily on the real exam.


    Note that exam questions sometimes have line numbers that begin with numbers higher
    than 1. This is to indicate that you are looking at a code snippet rather than
    a complete class. We follow this convention as well as to get you used to.


    If you read about older versions of the exam online, you might see references
    to dragand-drop questions. These questions had you do a puzzle on how to complete
    a piece of'
