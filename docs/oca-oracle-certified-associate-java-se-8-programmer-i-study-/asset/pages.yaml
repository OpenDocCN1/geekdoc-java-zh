    # Object vs. Reference


    In Java, all objects are accessed by reference, as a developer you will never
    have direct access to the object itself. Conceptually, you should consider the
    object as the entity that exists in memory, allocated by the Java runtime environment.
    Regardless of the type of reference you have for the object in memory, the object
    itself doesn''t change. For example, since all objects inherit from java.lang.Object,
    they can all be reassigned to java.lang.Object, as shown in the following example:


    ```

    Lemur lemur = new Lemur();

    ```


    ```

    Object lemAsObject = lemur;

    ```


    Even though the Lemur object has been assigned a reference with a different type,
    the object itself hasn''t changed and still exists as a Lemur object in memory.
