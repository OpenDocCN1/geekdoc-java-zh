  md: "# Creating final methods\n\nWe conclude our discussion of method inheritance\
    \ with a somewhat self-explanatory rule: final methods cannot be overridden. If\
    \ you recall our discussion of modifiers from Chapter 4, you can create a method\
    \ with the final keyword. By doing so, you forbid a child class from overriding\
    \ this method. This rule is in place both when you override a method and when\
    \ you hide it. In other words, you cannot hide a static method in a parent class\
    \ if it is marked as final.\n\nLet's take a look at an example:\n\n```\npublic\
    \ class Bird {\n    public final boolean hasFeathers() {\n        return true;\n\
    \    }\n}\n```\n\n```\npublic class Penguin extends Bird {\n    public final boolean\
    \ hasFeathers() { // DOES NOT COMPILE\n        return false;\n    }\n}\n```\n\n\
    In this example, the method hasFeathers() is marked as final in the parent class\
    \ Bird, so the child class Penguin cannot override the parent method, resulting\
    \ in a compiler error. Note that whether or not the child method used the final\
    \ keyword is irrelevant—the code will not compile either way.\n\n# Why Mark a\
    \ Method as final?\n\nAlthough marking methods as final prevents them from being\
    \ overridden, it does have advantages in practice. For example, you'd mark a method\
    \ as final when you're defining a parent class and want to guarantee certain behavior\
    \ of a method in the parent class, regardless of which class is invoking the method.\n\
    \nFor example in this example with Birds, the author of the parent class may want\
    \ to ensure the method hasFeathers() always returns true, regardless of the child\
    \ class instance on it is invoked. The author is confident there is no instance\
    \ of a Bird in which feathers are not present.\n\nThe methods are not commonly\
    \ marked as final in practice, though, that it may be difficult for the author\
    \ of a parent class to consider all of the possible ways their child class may\
    \ be used. For example, although all birds have feathers, a baby chick doesn't;\
    \ therefore, if you have an instance of a Bird that is a chick, it would not have\
    \ feathers. In short, the final modifier is only used on methods when the author\
    \ of the parent method wants to guarantee very precise behavior."
