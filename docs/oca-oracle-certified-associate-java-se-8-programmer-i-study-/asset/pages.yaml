  md: "# Implementing Interfaces\n\nas private or protected throws a compiler error.\
    \ Finally, the last line doesn't compile because the method is marked as final\
    \ and since interface methods are assumed to be abstract, the compiler throws\
    \ an exception for both abstract and final keywords on a method.\n\n> Adding the\
    \ assumed keywords to an interface is a matter of personal preference, although\
    \ it is considered good coding practice to do so to be easier and clearer to read,\
    \ and leads to fewer potential conflicts, as you saw in the previous example.\n\
    \nBe sure to review the previous example and understand why each of the lines\
    \ doesn't compile. There will likely be at least one question on the exam in which\
    \ an interface or interface method uses invalid modifier.\n\n# Inheriting an Interface\n\
    \nThere are two inheritance rules you should keep in mind when extending an interface:\n\
    \n+   1. An interface that extends another interface, as well as an abstract class\
    \ that implements an, inherits all of the abstract methods as its own methods.\n\
    \n+   2. The first class that implements an interface, or an abstract class that\
    \ implements an interface, must provide an implementation for all of the inherited\
    \ abstract methods.\n\nLike an abstract class, an interface may be extended using\
    \ the extend keyword. In this manner, the new child interface inherits all the\
    \ abstract methods of the parent interface. Consider the following example:\n\n\
    ```\npublic interface HasTail {\n    public int getTailLength();\n}\n```\n\n```\n\
    public interface HasWhiskers {\n    public int getNumberOfWhiskers();\n}\n```\n\
    \n```\npublic interface Seal extends HasTail, HasWhiskers {\n}\n```\n\nAny class\
    \ that implements the Seal interface must provide an implementation for all methods\
    \ in the parent interfaces—in this case, getTailLength() and getNumberOfWhiskers()."
