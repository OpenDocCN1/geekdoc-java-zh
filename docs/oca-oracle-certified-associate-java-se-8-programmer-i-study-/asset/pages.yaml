  md: '# Ternary Expression Evaluation


    As of Java 7, only one of the right-hand expressions of the ternary operator will
    be evaluated at runtime. In a similar manner to the short-circuit operators, if
    one of the right-hand expressions in a ternary operator performs a side effect,
    then it may not be applied at runtime. Let''s illustrate this principle with the
    following example:


    ```

    int y = 1;\int z = 1;

    final int x = y<10 ? y++ : z;

    System.out.println("y",z); // Outputs 2,1

    ```


    Notice that since the left-hand boolean expression was true, only y was incremented.
    Contrast the preceding example with the following modification:


    ```

    int y = 1;\int z = 1;

    final int x = y>=10 ? y++ : z;

    System.out.println("y",z); // Outputs 1,2

    ```


    Now that the left-hand boolean expression evaluates to false, only z was incremented.
    In this manner, we see how the expressions in a ternary operator may not be applied
    if the particular expression is used.


    > For the exam, be wary of any question that includes a ternary expression in
    which a variable is modified in one of the right-hand side expressions.


    # The switch Statement


    We expand on our discussion of if-then-else statements by discussing the switch
    statement. A switch statement, as shown in Figure 2.4, is a complex decision-making
    structure in which a single value is evaluated and flow is redirected to the first
    matching branch, known as a case statement. If no case statement is found that
    matches the value, an optional default statement will be called. If no such default
    option is available, the entire switch statement will be skipped.


    # Supported Data Types


    As shown in Figure 2.4, a switch statement has a target variable that is not evaluated
    until runtime. Prior to Java 5.0, this variable could only be int values or those
    that could be promoted to int, specifically byte, short, char, or int. When enum
    was added in Java 5.0, support was added to switch statements to support enum
    values. In Java 7, switch'
