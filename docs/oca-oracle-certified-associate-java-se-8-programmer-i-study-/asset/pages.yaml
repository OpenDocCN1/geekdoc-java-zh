  md: "# Real World Scenario\n\n# Constructor Chaining\n\nOverloaded constructors\
    \ often call each other. One common technique is to have each constructor add\
    \ one parameter until getting to the constructor that does all the work. This\
    \ approach is called constructor chaining. In this example, all three constructors\
    \ are chained.\n\n```\npublic class Mouse {\n    private int numTeeth;\n    private\
    \ int numWhiskers;\n    private int weight;\n\n    public Mouse(int weight) {\n\
    \        this(weight, 16); // calls constructor with 2 parameters\n    }\n\n \
    \   public Mouse(int weight, int numTeeth) {\n        this(weight, numTeeth, 6);\
    \ // calls constructor with 3 parameters\n    }\n    public Mouse(int weight,\
    \ int numTeeth, int numWhiskers) {\n        this.weight = weight;\n        this.numTeeth\
    \ = numTeeth;\n        this.numWhiskers = numWhiskers;\n    }\n\n    public void\
    \ print() {\n        System.out.println(weight + \" \" \" + numTeeth + \" \" \"\
    \ + numWhiskers);\n    }\n    public static void main(String[] args) {\n     \
    \   Mouse mouse = new Mouse(15);\n        mouse.print();\n    }\n```\n\nThis code\
    \ prints 15 16 6. The main() method calls the constructor with one parameter.\
    \ That constructor adds a second hard-coded value and calls the constructor with\
    \ two parameters. That constructor adds one more hard-coded value and calls the\
    \ constructor with three parameters. The three-parameter constructor assigns the\
    \ instance variables."
