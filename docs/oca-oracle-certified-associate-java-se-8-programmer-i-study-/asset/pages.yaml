  md: "# Introducing Class Inheritance\n\nIn this example, the code compiles and runs\
    \ without issue, outputting the:\nMarsupial walks on two legs: false\nKangaroo\
    \ hops on two legs: true\n\nNotice that isBiped() returns false in the parent\
    \ class and true in the child class.\nin the first method, the parent method getMarsupialDescription()\
    \ is used. The Marsupial class only knows about isBiped() from its own class definition,\
    \ so it outputs false. In the second method, the child executes a method of isBiped(),\
    \ which hides the parent method's version and returns true.\n\nContrast this first\
    \ example with the following example, which uses an, overridden version of isBiped()\
    \ instead of a hidden version:\n\n```\nclass Marsupial {\n    public boolean isBiped()\
    \ {\n        return false;\n    }\n\n    public void getMarsupialDescription()\
    \ {\n        System.out.println(\"Marsupial walks on two legs: \"+isBiped());\n\
    \    }\n}\n```\n\n```\npublic class Kangaroo extends Marsupial {\n    public boolean\
    \ isBiped() {\n        return true;\n    }\n\n    public void getKangarooDescription()\
    \ {\n        System.out.println(\"Kangaroo hops on two legs: \"+isBiped());\n\
    \    }\n\n    public static void main(String[] args) {\n        Kangaroo joey\
    \ = new Kangaroo();\n        joey.getMarsupialDescription();\n        joey.getKangarooDescription();\n\
    \    }\n}\n```\n\nThis code also compiles and runs without issue, but it outputs\
    \ different text:\nMarsupial walks on two legs: true\nKangaroo hops on two legs:\
    \ true\n\nIn this example, the isBiped() method is overridden, not hidden, in\
    \ the child class. Therefore, it is replaced at runtime in the parent class with\
    \ the call to the child class's method. Make sure you understand these examples\
    \ as how hidden and overridden methods are fundamentally different. This example\
    \ makes uses of polymorphism, which we will discuss later in this chapter."
