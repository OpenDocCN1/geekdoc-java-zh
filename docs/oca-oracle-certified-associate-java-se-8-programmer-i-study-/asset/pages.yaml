  md: '# Chapter 4 • Methods and Encapsulation


    only change was the type of the parameter. Overloading also allows different numbers
    of parameters.

    Everything other than the method signature can vary for overloaded methods. This
    means there can be access modifiers, specifiers (like static), return types, and
    exception lists.

    These are all valid overloaded methods:


    ```

    public void fly(int numMiles) {}

    public void fly(short numFeet) { {}

    public boolean fly() { return false; }

    void fly(int numMiles, short numFeet)

    public void fly(short numFeet, int numMiles) throws Exception {}

    ```


    As you can see, we can overload by changing anything in the parameter list. We
    can have a different type, method, or the same types in a different order. Also
    notice that the access modifier and exception list are irrelevant to overloading.

    Now let''s look at an example that is not valid overloading:


    ```

    public void fly(int numMiles) {}

    public int fly(int numMiles) { // DOES NOT COMPILE

    ```


    This method doesn''t compile because it only differs from the original by return
    type. The parameter lists are the same so they are duplicate methods as Java is
    concerned. What about these two? Why does second not compile?


    ```

    public void fly(int numMiles) {}

    public static void fly(int numMiles) { // DOES NOT COMPILE

    ```


    Again, the parameter list is the same. The only difference is that one is an instance
    method and one is a static method.

    Calling overloaded methods is easy. You just write code and Java calls the right
    one. For example, look at these two methods:


    ```

    public void fly(int numMiles) {

    System.out.println("short");

    }

    ```


    ```

    public void fly(short numFeet) {

    System.out.println("short");

    }

    ```


    The call((short) 1) prints short. It looks for matching types and calls the appropriate
    method. Of course, it can be more complicated than this.

    Now you know the basics of overloading, let''s look at some more complex scenarios
    that you may encounter on the exam.


