  md: 'Be able to write code that creates, extends, and implements interfaces. Interfaces
    are similar to a specialized abstract class in which only abstract methods and
    static final variables are allowed. New to Java 8, an interface can also define
    default and static methods with body. All members of an interface are assumed
    to be public. Methods are assumed to be abstract if not explicitly marked as default
    or static. An interface that extends another interface inherits all its methods.
    An interface cannot extend a class, nor can a class extend an interface. Finally,
    classes may implement any number of interfaces.


    Be able to write code that uses default and static interface methods. A default
    method allows a developer to add a new method to an interface used in existing
    implementations, without forcing others using it to recompile their code. A developer
    using the interface may override the default method or use the provided one. A
    static method in an interface follows the same rules for a static method in a
    class.


    Understand polymorphism. An object in Java may take on a variety of forms, in
    part depending on the reference used to access the object. Methods that will be
    overridden everywhere they are used, whereas methods and variables that are hidden
    will only be replaced in the classes and subclasses that they are defined. It
    is common to rely on polymorphic parameters—the ability of methods to be automatically
    passed as a superclass or interface reference—when creating method definitions.


    Recognize valid reference casting. An instance can be automatically cast to a
    superclass or interface reference without an explicit cast. Alternatively, an
    explicit cast is required if the reference is being narrowed to a subclass of
    the object. The Java compiler doesn''t permit casting to unrelated types. You
    should be able to discern between compiler-time casting errors and those that
    will not occur at runtime and that throw a ClassCastException.'
