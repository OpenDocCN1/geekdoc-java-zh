  md: "As you saw in the previous example, hiding static methods is fraught with pitfalls\
    \ and potential problems and as a practice should be avoided. Though you might\
    \ see questions on the exam that contain hidden static methods that are syntactically\
    \ correct, avoiding static methods in your own work, since it tends to lead to\
    \ confusing and difficult-to-read code. You should not reuse the name of a static\
    \ method in your class if it is already used in the parent class.\n\n# Overriding\
    \ vs Hiding Methods\n\nIn our description of hiding static methods, we indicated\
    \ there was a distinction between overriding and hiding methods. Unlike overriding\
    \ a method, in which a child method replaces the parent method in classes defined\
    \ in the parent and child, hidden methods only replace parent methods in the calls\
    \ defined in the child class.\n\nAt runtime the overridden method is always executed\
    \ regardless of whether the method is called in a parent or child class method.\
    \ In instance, the parent method is never used unless an explicit call to the\
    \ parent method is referenced, using the syntax ParentClassName.method(). Alternatively,\
    \ at runtime the version of a hidden method is always executed if the call to\
    \ the method is defined in the parent class. Let's look at an example:\n\n```\n\
    public class Marsupial {\n    public static boolean isBiped() {\n        return\
    \ false;\n    }\n\n    public void getMarsupialDescription() {\n        System.out.println(\"\
    Marsupial walks on two legs: \"+isBiped());\n    }\n}\n```\n\n```\npublic class\
    \ Kangaroo extends Marsupial {\n    public static boolean isBiped() {\n      \
    \  return true;\n    }\n\n    public void getKangarooDescription() {\n       \
    \ System.out.println(\"Kangaroo hops on two legs: \"+isBiped());\n    }\n\n  \
    \  public static void main(String[] args) {\n        Kangaroo joey = new Kangaroo();\n\
    \        joey.getMarsupialDescription();\n        joey.getKangarooDescription();\n\
    \    }\n}\n```"
