    ```

    int z = (int)9l;

    long t = 192301398193810323L;

    ```


    The expressions in the previous example may compile, although there''s a cost.
    The second value, 1,921,222, is too large to be stored as a short, so numeric
    overflow occurs and it becomes 20,678. Overflow is when a number is so large that
    it will no longer fit within the data type, so the system "wraps around" to the
    next lowest value and up from there. There''s also an analogous underflow, when
    the number is too low to fit in the data type.


    This is beyond the scope of the exam, but something to be careful of in your own
    code. For example, the following statement outputs a negative number:


    ```

    System.out.print(2147483647l); // -2147483648

    ```


    Since 2147483647 is the maximum int value, adding any positive value to it will
    cause it to wrap to the next negative number.


    Let’s return to one of our earlier examples for a moment:


    ```

    short x = 10;

    short y = 3;

    short z = x * y; // DOES NOT COMPILE

    ```


    Based on everything you have learned until now, you can understand why the last
    line of this statement will not compile? If you remember, short values are automatically
    promoted to int when performing any arithmetic operator, the resulting value being
    of type int. Trying to set a variable to an int results in a compiler error, as
    Java thinks you are trying to convert from a larger data type to a smaller one.


    There are times that you may want to override the default behavior of the compiler.
    For example, in the preceding example, we know the result of 18 * 3 is 54, which
    can easily fit into a short. If you need the result to be a short, though, you
    can override this behavior by casting the result of the multiplication:


    ```

    short x = 10;

    short y = 3;

    short z = (short)x * y);

    ```


    By performing this explicit cast of a larger value into a smaller data type, you
    are instructing the compiler to ignore its default behavior. In other words, you
    are telling the compiler that you have taken additional steps to prevent overflow
    or underflow. It is also possible that in your particular application and scenario,
    overflow or underflow would result in acceptable values.'
