  md: "# Chapter 4 • Methods and Encapsulation\n\nThe first thing we want to check\
    \ is whether the Animal can hop. We provide a class that can check this:\n\n```\n\
    public class CheckIfHopper implements CheckTrait {\n    public boolean test(Animal\
    \ a) {\n        return a.canHop();\n    }\n}\n```\n\nThis class may seem simple—and\
    \ it is. This is actually part of the problem that lambdas solve. Just bear with\
    \ it that we need to write code to find the animals that hop:\n\n```\n1: public\
    \ class TraditionalSearch\n2: public static void main(String[] args) {\n3: List<Animal>\
    \ animals = new ArrayList<>(); // list of animals\n4: animals.add(new Animal(\"\
    fish\", false, true));\n5: animals.add(new Animal(\"kangaroo\", true, false));\n\
    6: animals.add(new Animal(\"rabbit\", true, false));\n7: animals.add(new Animal(\"\
    turtle\", false, true));\n8:\n9: print(animals, new CheckIfHopper()); // pass\
    \ class that does check\n10: }\n11: private static void print(List<Animal> animals,\
    \ CheckTrait checker) {\n12: for (Animal animal : animals) {\n13: if (checker.test(animal))\
    \ // the general check\n14: System.out.println(animal + \" \");\n15: }\n16: }\n\
    17: }\n18:\n```\n\nThe print() method on line 11 is very general—it can check\
    \ for any trait. This is good design. It shouldn't need to know specifically what\
    \ we are searching for in order to provide a list of animals.\n\nNow what happens\
    \ if we want the Animals to swim? Sigh. We need to write another class CheckIfSwims.\
    \ Granted, it is only a few lines. Then we need to add a new line under line 9\
    \ that instantiates class. That's two things just to do another check.\n\nWhy\
    \ can't we just specify the logic we care about right here? Turns out that we\
    \ can with lambda expressions. We could repeat that whole class here and make\
    \ you the one line changed. Instead, we will just show you could replace line\
    \ 9 with the following, which uses a lambda:\n\n```\n9: print(animals, a -> a.canHop());\n\
    ```"
