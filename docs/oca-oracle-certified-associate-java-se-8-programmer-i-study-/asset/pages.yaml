  md: "# Chapter 6 • Exceptions\n\nCreating your own exceptions is not on the OCA\
    \ exam, but it is on the OCP exam.\nHowever, the OCA exam can define basic exceptions\
    \ to show you the hierarchy. You only\need to do two things with this information.\
    \ First, you must be able to recognize if\nexception is a checked or an unchecked\
    \ exception. Second, you need to determine if any of\nt exceptions are subclasses\
    \ of the others.\n\n```\nclass AnimalsOutOfWalk extends Runtime {}\nclass ExhibitClosed\
    \ extends Runtime {}\nclass ExhibitClosedForLunch extends ExhibitClosed {\n```\n\
    \nIn this example, there are three custom exceptions. All are unchecked exceptions\n\
    because they directly or indirectly extend RuntimeException. Now we catch types\
    \ of\nexceptions and handle them by printing out the appropriate message:\n\n\
    ```\npublic void visitPorcupine() {\ntry {\n    seeAnimal();\n} catch (AnimalsOutOfWalk\
    \ e) { // first catch block\n    System.out.print(\"try back later\");\n} catch\
    \ (ExhibitClosed e) { // second catch block\n    System.out.print(\"not today\"\
    );\n}\n}\n```\n\nThere are three possibilities for this code to run. If seeAnimal()\
    \ doesn't throw an\nexception, nothing is out. If the animal is out for walk,\
    \ only the first catch block\nruns. If the exhibit is closed, only the second\
    \ catch block runs.\n\nA rule exists for the order of catch blocks. Java looks\
    \ at them in the order\nappear. If it is impossible for one of the catch blocks\
    \ to be executed, a compiler error\nunreachable code occurs. This happens when\
    \ a superclass is caught before a subclass.\nRemember, we warned you to pay attention\
    \ to any subclass exceptions.\n\nIn the porcupine example, the order of the catch\
    \ blocks could be reversed because the\nexceptions do not inherit from each other.\
    \ And yes, we have seen a porcupine taken for a\nwalk on a leash.\n\nThe following\
    \ example shows exception types that inherit from each other:\n\n```\npublic void\
    \ visitMonkeys() {\ntry {\n    seeAnimal();\n} catch (ExhibitClosedForLunch e)\
    \ { // subclass exception\n    System.out.print(\"try back later\");\n} catch\
    \ (ExhibitClosed e) { // superclass exception\n    System.out.print(\"not today\"\
    );\n}\n}\n```"
