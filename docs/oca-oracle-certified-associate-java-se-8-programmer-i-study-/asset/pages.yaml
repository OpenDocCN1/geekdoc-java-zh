    The OCA exam expects you to know the core data structures and classes used in
    Java, and in this chapter readers will learn about the most common methods available.
    For example, String and StringBuilder are used for text data. An array and ArrayList
    are used when you have multiple values. A variety of classes are used for working
    with dates. In this chapter, you will also learn to determine whether two objects
    are equal.


    API stands for application programming interface. In Java, an interface is something
    special. In the context of API, it can be a group of class or interface definitions
    that give you access to a service or functionality. You will learn about the most
    common APIs for each of the classes covered in this chapter.


    # # Creating and Manipulating Strings


    The String class is such a fundamental class that you would be hard-pressed to
    write code without it. After all, you can''t write a main() method without using
    the String class. A string is basically a sequence of characters; here''s an example:


    ```

    String name = "Fluffy";

    ```


    As learned in Chapter 1, "Java Building Blocks," this is an example of a reference
    type. You also learned that reference types are created using the new keyword.
    A minute. Something is missing from the previous example: it doesn''t have new
    in it! In Java, these two snippets create a String:


    ```

    String name = "Fluffy"

    String name = new String("Fluffy");

    ```


    Both give you a reference variable of type naming the String object "Fluffy".
    They are subtly different, as you will also see in the section "String Pool,"
    later in this chapter. For now, remember that the String class is special and
    doesn''t need to be instantiated with new.


    In this section, we will learn at concatenation, immutability, the string pool,
    common methods, and method chaining.


    # # Concatenation


    In Chapter 2, "Operators and Statements," you learned how to add numbers. 1 +
    2 is clearly 3. But what is "1" + "2"? It''s actually "12" because Java joins
    the two String objects.'
