  md: "# Reading and Writing Object Fields\n\nIt's possible to read and write instance\
    \ variables directly from the caller. In this example, a mother swan lays eggs:\n\
    \n```\npublic class Swan {\n    int numberEggs;// instance variable\n    public\
    \ static void main(String[] args) {\n        Swan mother = new Swan();\n     \
    \   mother.numberEggs = 1;    // set variable\n        System.out.println(mother.numberEggs);\
    \ // read variable\n    }\n}\n```\n\nReading a variable is known as getting it.\
    \ The class gets numberEggs directly to print it out. Writing to a variable is\
    \ known as setting it. The class sets numberEggs to 1.\nIn Chapter 4, you'll learn\
    \ how to protect the Swan class from having someone set a negative number of eggs.\n\
    \nYou can read and write fields directly on the line declaring them:\n\n+   1:\
    \ public class Name {\n2:     String first = \"Theodore\";\n3:     String last\
    \ = \"Moose\";\n4:     String full = first + last;\n5: }\n\n> Lines 2 and 3 both\
    \ write to fields. Line 4 does both. It reads the fields first and last. It writes\
    \ the field full.\n\n# Instance Initializer Blocks\n\nWhen you learned about methods,\
    \ you saw braces {}. The code between the braces is called a code block. Sometimes\
    \ this code is being inside the braces. Anywhere where you see braces is a code\
    \ block.\nSometimes code blocks are inside a method. They are run when the method\
    \ is called. Other times, code blocks appear outside a method. These are called\
    \ instance initializers. In Chapter 5, you'll learn how to use a static initializer.\n\
    \nHow many blocks do you see in this example? How many instance initializers do\
    \ you see?\n\n```\n3: public static void main(String[] args) {\n4:     { System.out.println(\"\
    Feathers\"); };\n5: }\n6: { System.out.println(\"Snowy\"); }\n```"
