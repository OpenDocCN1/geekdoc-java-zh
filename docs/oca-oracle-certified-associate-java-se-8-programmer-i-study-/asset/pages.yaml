  md: '# Real World Scenario


    What Is the Largest int?


    You do not have to know this for the exam, but the maximum number an int can hold
    is 2,147,483,647. How do we know this? One way is to have Java tell us:


    ```

    System.out.println(Integer.MAX_VALUE);

    ```


    The other way is with math. An int is 32 bits. $2^{32}$ is 4,294,967,296. Divide
    that by 2 and you get 2,147,483,648. Subtract 1 as we did with bytes and you get
    2,147,483,647. It''s easier to ask Java to print the value, isn''t it?


    There are a few things you should know about numeric primitives. When a number
    is present in the code, it is called a *literal*. By default, Java assumes you
    are defining an int value with a literal. In this example, the number listed is
    bigger than what fits in an int. Remember, you are not expected to maximize the
    maximum value for an int. The exam will include it in the question if it comes
    up.


    ```

    long max = 3123456789; // DOES NOT COMPILE

    ```


    Java claims the number is out of range. And it is—for an int. However, we don''t
    have an int. The solution is to add the character L to the number:


    ```

    long max = 3123456789L; // now Java knows it is a long

    ```


    Alternatively, you could add a lowercase l to the number. But please use the uppercase
    L. The lowercase l looks like the number 1.


    Another way to specify numbers is to change the "base". When you learned how to
    count, you studied the 0–9. This numbering system is called base 10 since there
    are 10 numbers. It is also known as the decimal number system. Java allows you
    to specify digits in several other formats:


    +   octal (0–7), which uses the number 0 as a prefix—example, 017


    +   hexadecimal (0–9 and letters A–F), which uses the number 0x or XX as a prefix—example,
    0xFF


    +   binary (0–1), which uses the number 0 followed by b or B as a prefix—example,
    0b10


    You won''t need to convert between numeric systems on the exam. You''ll have to
    recognize literal values that can be assigned to numbers.'
