  md: '# equals() and equalsIgnoreCase()


    The equals() method checks whether two String objects contain exactly the same
    characters in the same order. The equalsIgnoreCase() method checks whether two
    String objects contain the same characters with the exception that it will convert
    the characters if needed. The method signatures are as follows:


    ```

    boolean equals(String str)

    boolean equalsIgnoreCase(String str)

    ```


    The following code shows how to use these methods:


    ```

    System.out.println("abc".equals("ABC")); // false

    System.out.println("abc".equals("ABC")); // true

    System.out.println("abc".equalsIgnoreCase("ABC")); // true

    ```


    This example should be fairly intuitive. In the first, the values are not exactly
    the same. In the second, they are exactly the same. In the third, they differ
    only by case, but it is okay because we called the method that ignores differences
    in case.


    # startsWith() and endsWith()


    The startsWith() and endsWith() methods look at whether the provided value matches
    part of the string. The method signatures are as follows:


    ```

    boolean startsWith(String prefix)

    boolean endsWith(String suffix)

    ```


    The following code shows how to use these methods:


    ```

    System.out.println("abc".startsWith("a")); // true

    System.out.println("abc".startsWith("A")); // false

    System.out.println("abc".endsWith("c")); // true

    System.out.println("abc".endsWith("a")); // false

    ```


    Again, nothing surprising here. Java is a case-sensitive check on the values.


    # contains()


    The contains() method also looks for matches in the String. It isn''t as particular
    as startsWith() and endsWith()—the match can be anywhere in the String. The method
    signature is as follows:


    ```

    boolean contains(String str)

    ```


    The following code shows how to use these methods:


    ```

    System.out.println("abc".contains("b")); // true

    System.out.println("abc".contains("B")); // false

    ```'
