  md: '# Writing a main() Method


    A Java program begins execution with its main() method. A main() method is the
    gateway to the startup of a Java process, which is managed by the Java Virtual
    Machine (JVM), and the beginning of the programmer''s code. The JVM calls on the
    underlying system to allocate memory and CPU time, access files, and so on.

    The main() method lets us hook our code into this process, keeping it alive long
    enough to do the work we''ve coded. The simplest possible class with a main()
    method looks like this:


    ```

    1: public class Zoo

    2: public static void main(String[] args) {

    3:

    4: }

    5:}

    ```


    This code doesn''t do anything (or harmful). It has no instructions other to declare
    the entry point. It does illustrate, in a sense, that you can put in a main()
    method is arbitrary. Any legal Java code will do. In fact, the only reason we
    need a class structure to start a Java process is because the language requires
    it. To compile and execute this code, type it into a file named Zoo.java and execute
    the following:

    $ javac Zoo.java

    $ java Zoo


    If you don''t get any error messages, you were successful. If you do get error
    messages, check that you''ve installed a Java Development Kit (JDK) and not a
    Java Runtime Environment (JRE), that you have added it to the PATH, and that you
    didn''t make any typos in the example. If you have any of these problems and don''t
    know what to do, post a question with the error message you received in the Beginning
    Java forum at Codeanch (www.coderanch.com/forums/f-33/java).


    To compile Java, the file must have the extension .java. The name of the file
    must match the name of the class. The result is a file of bytecode by the same
    name, but a .class filename extension. Bytecode contains instructions that the
    JVM knows how to execute. Notice that we omit the .class extension to run Zoo.java
    because the period has a reserved meaning in the JVM.


    The rules for what a Java code file contains, and in order, are more detailed
    than what we have explained so far (there is more on this topic later in the chapter).
    To keep things simple for now, we''ll follow a subset of the rules:


    +   - Each file can contain only one class.

    - The filename must match the class name, including case, and have a .java extension.'
