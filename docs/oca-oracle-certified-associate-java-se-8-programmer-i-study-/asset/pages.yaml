  md: "Notice the same type of object created twice, the reference to the object determines\
    \ which value is seen as output. If the object Jellyfish was passed to a method\
    \ by an Animal reference, as you'll see in the section \"Understanding Polymorphism,\"\
    \ later in this chapter, the right value might be used.\n\nHiding variables makes\
    \ the code very confusing and difficult to read, especially if you are modifying\
    \ the value of the variable in the parent and child methods, since it may not\
    \ be clear which variable you're updating.\n\nWhen defining a new variable in\
    \ a child class, it is considered good coding practice to select a name for the\
    \ variable that is not already public, protected, or default variable in use of\
    \ a parent class. Hiding private variables is considered less problematic because\
    \ the child class did not have access to the parent class to begin.\n\n# Creating\
    \ Abstract Classes\n\nLet's say you want to define a parent class that other developers\
    \ are going to subclass. Your goal is to provide some reusable variables and methods\
    \ to developers in the parent class, whereas the developers provide specific implementations\
    \ or overrides of other methods in the child classes. Furthermore, let's say you\
    \ don't want an instance of the parent class to be instantiated unless it is an\
    \ instance of the child class.\n\nFor example, you might define an Animal parent\
    \ class that a number of classes extend from use and for which an instance of\
    \ Animal cannot be instantiated. All subclasses of the Animal class, such as Swan,\
    \ are required to implement a getName() method, but there is no implementation\
    \ for the method in the Animal class. How do you ensure all classes extend Animal\
    \ provide an implementation for this method?\n\nIn Java, you can accomplish this\
    \ task by using an abstract class and abstract method. An abstract class is a\
    \ class that is marked with the abstract keyword and cannot be instantiated. An\
    \ abstract method is a method marked with the abstract keyword defined in an abstract\
    \ class, for which no implementation is provided in the class it is declared.\
    \ The following code is based on our Animal and Swan description:\n\n```\npublic\
    \ abstract class Animal {\n    protected int age;\n    public void eat() {\n \
    \       System.out.println(\"Animal is eating\");\n    }\n    public abstract\
    \ String getName();\n}\n```"
