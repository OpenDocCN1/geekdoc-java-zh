  md: "# Chapter 5 • Class Design\n\nIn this example, the abstract method sing() defined\
    \ in the parent class Whale is not visible to the subclass HumpbackWhale. Even\
    \ though HumpbackWhale does an implementation, it is not considered an override\
    \ of the abstract method since the abstract method is unreachable. The compiler\
    \ recognizes this in the parent class and throws an exception as soon as private\
    \ and abstract are applied to the same method.\n\nIf we changed the access modifier\
    \ from private to protected in the parent class Whale, would the code compile?\
    \ Let's take a look:\n\n```\npublic abstract class Whale {\n    protected abstract\
    \ void sing();\n}\n```\n\n```\npublic class HumpbackWhale extends Whale {\n  \
    \  private void sing() { // DOES NOT COMPILE\n        System.out.println(\"Humpback\
    \ whale is singing\");\n    }\n}\n```\n\nIn this modified example, the code will\
    \ still not compile but for a completely different reason. If you remember the\
    \ rules earlier in this chapter for overriding a method, the subclass cannot reduce\
    \ the visibility of the parent method, sing(). Because the method is declared\
    \ protected in the parent class, it must be marked as protected or public in the\
    \ child class. With abstract methods, the rules for overriding methods must be\
    \ followed.\n\n# Creating a Concrete Class\n\nWhen working with abstract classes,\
    \ it is important to remember that by themselves, they cannot be instantiated\
    \ and therefore do not much other define static variables and methods. For example,\
    \ the following code will not compile as it is an attempt to instantiate an abstract\
    \ class.\n\n```\npublic abstract class Eel {\n    public static void main(String[]\
    \ args) {\n        final Eel eel = new Eel(); // DOES NOT COMPILE\n    }\n}\n\
    ```\n\nAn abstract class becomes useful when it is extended by a concrete subclass.\
    \ A concrete class is the first nonabstract subclass that extends an abstract\
    \ class and is required to implement all inherited abstract methods. When you\
    \ see a concrete class extending an abstract class on the exam, check that it\
    \ implements all of the required abstract methods. Let's review this with the\
    \ following example.\n\n```\npublic abstract class Animal {\n    public abstract\
    \ String getName();\n}\n```"
