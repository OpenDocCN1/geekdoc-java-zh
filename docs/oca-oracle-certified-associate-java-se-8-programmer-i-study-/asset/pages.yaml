  md: '# Using a try Statement


    38: fall();

    39: } finally {

    40: System.out.println("all better");

    41: }


    The first example (lines 25–31) does not compile because the catch and finally
    blocks are in the wrong order. The second example (lines 33–35) does not compile
    because there must be a catch or finally block. The third example (lines 37–41)
    is just fine. catch is not required if finally is present.


    One problem with finally is that any realistic uses for it are out of the scope
    of the OCA example. finally is typically used to control resources such as files
    or databases—both of which are topics on the OCP exam. This means most of the
    examples you encounter on the OCA exam with finally going to look contrived. For
    example, you''ll get asked questions such as "";


    ```

    String s = "";

    try {

    s s += "";

    } catch (Exception e) {

    s s += "c";

    } finally {

    s s += "f";

    }

    s += "a";

    System.out.print(s);

    ```


    The answer tfa. The try block is executed. Since no exception is thrown, Java
    goes straight to the finally block. The code after the try statement is run. We
    know; this is a silly example. Expect to see examples like this on the OCA exam.


    System.exit


    There is one exception to "the finally block always runs after the catch block"
    rule: Java defines a method that you call as System.exit(0); The integer parameter
    is the error code that gets returned. System.exit tells Java, "Stop. End the program
    right now. Do not pass go. Do not collect $200." When System.exit is called in
    the try or catch block, finally does not run.


    # Catching Various Types of Exceptions


    So far, you have been catching only one type of exception. Now let''s see what
    happens when different types of exceptions can be thrown from the same method.'
