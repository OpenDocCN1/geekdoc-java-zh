  md: "# Implementing Interfaces\n\nAlthough Java doesn't allow multiple inheritance,\
    \ it does allow classes to implement any number of interfaces. An interface is\
    \ an abstract data type that defines a list of abstract public methods that any\
    \ class implementing the interface must provide. An interface can also include\
    \ a list of constant variables and default methods, which we'll cover in this\
    \ section. In Java, an interface is defined with the interface keyword, analogous\
    \ to the class keyword used defining a class. A class invokes the interface by\
    \ using the implements keyword in its class definition. Refer to Figures 5.4 and\
    \ 5.5 for proper syntax usage.\n\n# FIGURE 5.4 Defining an interface\n\n```\n\
    public or default access modifier\nabstract keyword (assumed)\tinterface name\n\
    interface keyword (required)\npublic abstract interface CanBurrow {\n    public\
    \ static final int MINIMUM_DEPTH = 2;\n    public abstract int getMaximumDepth();\n\
    }\npublic abstract keywords (assumed)\tpublic static final keywords (assumed)\n\
    ```\n\n# FIGURE 5.5 Implementing an interface\n\n```\nimplements keyword (required)\n\
    class name\ninterface name\npublic class FieldMouse implements CanBurrow {\n \
    \   public int getMaximumDepth() {\n        return 10;\n    }\nsignature matches\
    \ interface method\n```\n\nAs you see in this example, an interface is not declared\
    \ an abstract class, although it has many of the same properties of abstract class.\
    \ Notice that the method modifiers in this"
