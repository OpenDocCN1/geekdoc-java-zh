  md: '# Summary


    An exception indicates something unexpected happened. A method can handle an exception
    by catching it or declaring it for the caller to deal with. Many exceptions are
    thrown by Java libraries. You can throw your own exception with code such as new
    Exception().


    Subclasses of java.lang Error are exceptions that a programmer should not attempt
    to handle. Subclasses of java.lang RuntimeException are runtime (unchecked) exceptions.
    Subclasses of java.lang Exception, but not java.lang Runtime are checked exceptions.
    Java requires checked exceptions to be handled or declared.


    If a try statement has multiple catch blocks, the one catch block can run. Java
    looks for an exception that can be caught by each catch block in the order they
    appear, and the first match is run. Then execution continues after the try statement.
    If both catch and finally throw an exception, the one finally gets thrown. Common
    runtime exceptions include:


    +   * ArithmeticException

    * ArrayIndexOutOfBoundsException

    * ClassCastException

    * IllegalArgumentException

    * NullPointerException

    * NumberFormatException


    IllegalArgumentException and NumberFormatException are typically thrown by the
    programmer, whereas the others are typically thrown by the JVM. Common checked
    exceptions include:


    +   * IOException

    * FileNotFoundException


    +   Common errors include:

    * ExceptionInInitializerError

    * StackOverflowError

    * NoClassDefFoundError


    When a method overrides a method in a superclass or interface, it is not allowed
    to add checked exceptions. It is allowed to declare fewer exceptions or declare
    a subclass of a declared exception. Methods declare exceptions with the keyword
    throws.'
