  md: "# Chapter 5 • Class Design\n\nIn this example, Cat inherits the two default\
    \ methods for getSpeed(), so which does it use? Since Walk and Run are considered\
    \ siblings in terms of how they are used in the Cat class, it is not clear whether\
    \ the code should output 5 or 10. The answer is that the code outputs neither\
    \ value—it fails to compile.\n\nIf a class implements two interfaces that have\
    \ default methods with the same name and signature, the compiler will throw an\
    \ error. There is an exception to this rule, though: if the subclass overrides\
    \ the duplicate default methods, the code will compile without issue—the ambiguity\
    \ about which version of the method to call has been removed. For example, the\
    \ following modified implementation of Cat will compile and output 1:\n\n```\n\
    public class Cat implements Walk, Run {\n    public int getSpeed() {\n       \
    \ return 1;\n    }\n}\n```\n\n```\npublic static void main(String[] args) {\n\
    \    System.out.println(new Cat().getSpeed());\n}\n```\n\nYou can see that having\
    \ a class that implements or inherits two duplicate default methods forces the\
    \ class to implement a new version of the method, or the code will not compile.\
    \ This rule holds true even for abstract classes that implement multiple interfaces,\
    \ because the default method could be defined in a concrete method within the\
    \ abstract class.\n\n# Static Interface Methods\n\nJava 8 also includes support\
    \ for static methods within interfaces. These methods are defined explicitly with\
    \ the static keyword and nearly identically to static methods defined in classes,\
    \ as discussed in Chapter 4. In fact, there is only one distinction between a\
    \ static method in a class and an interface. A static method defined in an interface\
    \ is not inherited in any classes that implement the interface.\n\nHere are the\
    \ static interface rules you need to be familiar with:\n\n+   1. Like all methods\
    \ in an interface, a static method is assumed to be public and will not compile\
    \ if private or protected.\n\n+   2. To reference a static method, a reference\
    \ to the name of the interface must be used.\n\nThe following is an example of\
    \ a static method defined in an interface:\n\n```\npublic interface Hop {\n  \
    \  static int getJumpHeight() {\n        return 8;\n    }\n}\n```"
