  md: '# Introduction


    # XXV


    This book is intended to be understandable to anyone who has a tiny bit of Java
    knowledge. If you''ve never read a Java book before, we recommend starting with
    a book teaches programming from the beginning and then returning to this study
    guide.

    This book is for anyone from high school students to those beginning their journey
    to experienced professionals who need a review for the certification.


    # How This Book Is Organized


    This book consists of six chapters, plus supplementary information: a glossary,
    this introduction, three appendices, and the assessment test after the introduction.
    You might have noticed that there are more than six exam objectives. We split
    up what you need to know to make it easy to learn and remember. Each chapter begins
    with a list of the objectives that are covered in that chapter.


    markdown": "The chapters are organized as follows:


    +   - Chapter 1, "Java Building Blocks," covers the basics of Java such as scoping
    variables and how to run a program. It also includes methods and types of variables.


    +   - Chapter 2, "Operators and Statements," focuses on the core logical structures
    as conditionals and how to use. It also talks about the meaning and precedence
    of operators.


