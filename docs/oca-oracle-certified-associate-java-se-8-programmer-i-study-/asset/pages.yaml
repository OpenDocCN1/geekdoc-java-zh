  md: "# Introducing Class Inheritance\n\nThe first method, fly(), is overloaded in\
    \ the subclass Eagle, since the signature changes from a no-argument constructor\
    \ to a constructor with one int argument. Because the method is overloaded and\
    \ not overridden, the return type can be changed from void to int issue.\n\nThe\
    \ second method, eat(), is overridden in the subclass Eagle, since the signature\
    \ is the same as it is in the parent class Bird—they both take a single argument\
    \ int. Because the method is being overridden, the return type of the method in\
    \ Eagle must be a subclass of the return type of the method in Bird. In this example,\
    \ the return type void is not a subclass of int; therefore, the compiler will\
    \ throw an exception on this method definition.\n\nAny time you see a method on\
    \ the exam with the same name as a method in the parent class, determine whether\
    \ the method is overloaded or overridden first; doing so will help you with questions\
    \ about whether the code will compile.\n\nLet's review some examples of the last\
    \ three rules of overriding methods so you can learn to spot the issues when they\
    \ arise:\n\n```\npublic class Camel {\n    protected String getNumberOfHumps()\
    \ {\n        return \"Undefined\";\n    }\n}\n\npublic class BactrianCamel extends\
    \ Camel {\n    private int getNumberOfHumps() { // DOES NOT COMPILE\n        return\
    \ 2;\n    }\n}\n```\n\nIn this example, the method in the child class doesn't\
    \ compile for two reasons. First, it violates the second rule of overriding methods:\
    \ the child method must be at least accessible as the parent. In the example,\
    \ the parent method uses the protected modifier, but the child method uses the\
    \ private modifier, making it less accessible in the child method than the parent\
    \ method. It also violates the fourth rule of overriding methods: the return type\
    \ of the parent method and child method must be covariant. In this example, the\
    \ return type of the parent method is String, whereas the return type of the child\
    \ method is int, neither of which is covariant with each other.\n\nAny time you\
    \ see a method that appears to be overridden on the example, first check to make\
    \ sure it is truly being overridden and not overloaded. Once you have confirmed\
    \ it is being overridden, check that the access modifiers, return types, and any\
    \ exceptions defined in the method are compatible with one another. Let's take\
    \ a look at some example methods that use exceptions:"
