  md: "# Chapter 5 • Class Design\n\n2. The method in the child class must be at least\
    \ accessible or more accessible than the\nmethod in the parent class.\n\n3. The\
    \ method in the child class may not throw a checked exception that is new or\n\
    broader than the exception in the parent class method.\n\n4. If the method returns\
    \ a value, it must be the same or a subclass of the method in the\nparent class,\
    \ known as _covariant return types.\n\nThe first rule of overriding a method is\
    \ somewhat self-explanatory. If two methods have\nt same name but different signatures,\
    \ the methods are overloaded, not overridden. As you\nrecall from our discussion\
    \ of overloaded methods in Chapter 4, the methods are unre-\nlated each other\
    \ and do not share properties.\n\n# Overloading vs. Overriding\n\nOverloading\
    \ a method and overriding a method are similar in that they involve\nredefining\
    \ a method using the same name. They differ in an overloaded method would\nuse\
    \ a different signature than an overridden method. This distinction allows overloaded\n\
    methods a great deal more freedom in syntax in an overridden method would have.\n\
    For example, take a look at the following code sample:\n\n```\npublic class Bird\
    \ {\n    public void fly() {\n        System.out.println(\"Bird is flying\");\n\
    \    }\n    public void eat(int food) {\n        System.out.println(\"Bird is\
    \ eating \"+food+\" units of food\");\n    }\n}\n```\n\n```\npublic class Eagle\
    \ extends Bird {\n    public void fly(int height) {\n        System.out.println(\"\
    Bird is flying at \"+height+\" meters\");\n        return height;\n    }\n   \
    \ public int eat(int food) { // DOES NOT COMPILE\n        System.out.println(\"\
    Bird is eating \"+food+\" units of food\");\n        return food;\n    }\n}\n\
    ```"
