  md: '# 364 Appendix B • Study Tips


    # Guessing the Correct Answer


    Unlike some other standardized tests, there''s no penalty for answering a question
    incorrectly versus leaving it blank. If you''re nearly out of time, or you just
    can''t decide on an answer, select a random answer and move on. If you''ve been
    able to eliminate even one answer, then your guess will be better than blind luck.


    # Answer All Questions!


    You should have a hard stop of 5 minutes of time remaining on the exam to ensure
    that you''ve answered each and every question. Remember, if you fail to answer
    a question you''ll definitely get it wrong and lose points, but if you guess,
    there''s at least a chance you''ll be correct. There''s no harm in guessing!


    When in doubt, we generally recommend picking a random answer that includes "Does
    not compile" if available, although which choice you select is not as important
    as making sure to not leave any unanswered questions on the exam!


    # Optimizing Your Time


    One of the most difficult test-taking skills to master is balancing your time
    on the exam. Although Oracle varies the precise number of questions on the exam
    and the general rule of thumb is that you have about one and half minutes per
    question.


    Of course, it can be stressful to frequently look at the time remaining while
    taking the exam, the key is to pace yourself. Some questions will take you longer
    than two minutes to solve, hopefully others will only take less than a minute.
    The more time you save on the easier questions, the more time you''ll have for
    the harder questions.


    # Checking the Time Remaining


    The exam software includes a clock that tells you the amount of time you have
    left on the exam. We don''t recommend checking the clock after each and question
    to determine your pace. All doy, such a calculation will waste time and probably
    make you nervous and stressed out. We recommend you check the time remaining at
    certain points while taking the exam to determine whether you should try to increase
    your pace.


    For example, if the exam lasts two hours and is 90 questions long, the following
    would be a good pace to keep.


    +   - 120 Minutes Remaining: Start exam.


    +   - 90 Minutes Remaining: One third of the exam finished.'
