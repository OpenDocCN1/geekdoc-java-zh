  md: '![](img/7ba91ff267bc04c697c94b2034027b4d_47_0.png)


    Welcome to the beginning of your journey to become certified on Java. We assume
    this isn''t the first Java programming book you''ve read. Although we do talk
    about the basics, we do so because we want to make sure you have all the terminology
    and detail you''ll need for the OCA exam. If you''ve never run a Java program
    before, we recommend you pick up Head First Java, 2nd Edition (O''Reilly Media,
    2005); Java for Dummies (For Dummies, 2014), or Thinking in Java, 4th Edition
    (Prentice Hall, 2006). (It''s okay if the book covers an older version of Java—even
    Java 1.3 is fine.) Then come back to this certification study guide.


    This chapter covers the fundamentals of Java. You''ll see how to define and run
    a Java class, and learn packages, variables, and the object life cycle.


    # Understanding the Java Class Structure


    In Java programs, classes are the building blocks. When defining a class, you
    describe all the parts and characteristics of one of building blocks. To use most
    classes, you have to create objects. An object is a runtime instance of a class
    in memory. All the various objects of the different classes represent the state
    of your program.


    In the following sections, we''ll look at fields, methods, and comments. We''ll
    also explore the relationship between classes and files.


    # Fields and Methods


    Java classes have two elements: methods, often called functions or procedures
    in other languages, and fields, more generally known as variables. Together these
    are called the members of the class. Variables hold the state of the program,
    and methods operate on state. If the change is important to remember, a variable
    stores that change. That''s what all classes really do. It''s the programmer who
    creates and arranges these elements in such a way that the resulting code is useful
    and, ideally, easy for programmers to understand.


    Other building blocks include interfaces, which you''ll learn about in Chapter
    5, “Class Design,” and enums, which you''ll learn about when you start studying
    for the OCP exam.'
