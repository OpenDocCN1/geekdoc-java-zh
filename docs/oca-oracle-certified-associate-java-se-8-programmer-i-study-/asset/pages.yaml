    # Applying Process of Elimination


    Although you might immediately know the correct answer to a question, if you can
    reduce the question from five answers to three, your odds of guessing the correct
    answer will be markedly improved. For example, if you can reduce a question from
    four answers to two, you double your chances of guessing the correct answer. In
    this section, we will discuss how to apply the process of elimination to help
    improve your score.


