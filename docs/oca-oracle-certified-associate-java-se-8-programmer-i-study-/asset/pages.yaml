  md: "# 306 Chapter 6 • Exceptions\n\nThe code in the try block is normal. If any\
    \ of the statements throw an exception that can be caught by the exception type\
    \ listed in the catch block, the try block stops running and execution goes to\
    \ the catch statement. If none of the statements in the try block throw an exception\
    \ can be caught, the catch clause is not run.\n\nYou probably noticed the words\
    \ \"block\" and \"clause\" used interchangeably. The exam does this so well, so\
    \ we are getting used to it. Both are correct. \"Block\" is correct because there\
    \ are braces present. \"Clause\" is correct because they are part of a try statement.\n\
    \nThere aren't a ton of syntax rules. The curly braces are required for the try\
    \ and catch blocks.\n\nIn our example, the little girl gets up by herself the\
    \ first time she falls. Here’s what this looks like:\n\n```\n3: void explore()\
    \ {\n4:   try {\n5:     fall();\n6:     System.out.println(\"never get here\"\
    );\n7:   } catch (RuntimeException e) {\n8:     getUp();\n9:   }\n10:  seeAnimals();\n\
    11: }\n12: void fall() { throw new RuntimeException(); }\n```\n\nFirst, line 5\
    \ calls the fall() method. Line 12 throws an exception. This means Java jumps\
    \ straight to the catch block, skipping line 6. The girl gets up on line 8. Now\
    \ the try statement is over and execution proceeds normally with line 10.\n\n\
    Now let's look at some invalid try statements that the exam might try to trick\
    \ you with. Do you see what's wrong with this one?\n\n```\ntry // DOES NOT COMPILE\n\
    fall();\ncatch (Exception e) {\nSystem.out.println(\"get up\");\n```\n\nThe problem\
    \ is that the braces are missing. It needs to look like this:\n\n```\ntry {\n\
    \  fall();\n} catch (Exception e) {\n  System.out.println(\"get up\");\n}\n```"
