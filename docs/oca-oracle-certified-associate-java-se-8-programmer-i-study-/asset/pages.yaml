  md: "# Constructors\n\nTo create an instance of a class, all you have to do is write\
    \ new before it. For example:\nRandom r = new Random();\n\nFirst you declare the\
    \ type that you'll be creating (Random) and give the variable name (r). This gives\
    \ Java a place to store a reference to the object. Then you write new Random()\
    \ to actually create the object.\n() looks like a method since it is followed\
    \ by parentheses. It's called a constructor, which is a special type of method\
    \ that creates a new object. Now it's time to define a constructor of your own:\n\
    \n```\npublic class Chick {\npublic Chick() {\n  System.out.println(\"in constructor\"\
    );\n}\n}\n```\n\nThere are two key points to note about the constructor: the name\
    \ of the constructor matches the name of the class, and there's no return type.\
    \ You'll likely see a method that won't be called when you write new Chick().\n\
    \n```\npublic void Chick() { // NOT A CONSTRUCTOR\n```\n\nWhen you see a method\
    \ name beginning with a capital letter and having a return type, pay attention\
    \ to it. It is not a constructor since there's a return type. A regular method\
    \ that won't be called when you write new Chick().\nThe purpose of a constructor\
    \ is to initialize fields, although you can put any code in there. Another way\
    \ to initialize fields is to do so directly on the line on they're declared. This\
    \ example shows both approaches:\n\n```\npublic class Chicken {\nint eggs = 0;\
    \ // initialize on line\nString name;\npublic Chicken() {\n  name = \"Duke\";\
    \ // initialize in constructor\n}\n```\n\nFor most classes, you don't have to\
    \ code a constructor—the compiler will supply a “do nothing” default constructor\
    \ for you. There's one scenario that requires you to declare a constructor that\
    \ you'll learn about in Chapter 5."
