  md: '# FIGURE 4.5 Lambda syntax omitting optional parts


    ![](img/7ba91ff267bc04c697c94b2034027b4d_257_0.png)


    The second example also has three parts; it''s just more verbose (see Figure 4.6):


    +   - Specify a single parameter with the name a and stating the type is Animal

    - The arrow operator to separate the parameter and body

    - A body that has one or more lines of code, including a semicolon and a return
    statement


    # FIGURE 4.6 Lambda syntax, including optional parts


    ![](img/7ba91ff267bc04c697c94b2034027b4d_257_1.png)


    The parentheses can also be omitted if there is a single parameter and its type
    is not explicitly stated. Java does this because developers commonly use lambda
    expressions this way and we can do as little typing as possible.


    It shouldn''t be news to you that we can omit braces when we only have a single
    statement or loops already. What is different here is that the rules change when
    you omit the braces. Java does not require you to type return or semicolon when
    no braces are used. This special shortcut doesn''t work when we have two or more
    statements. At least this is consistent with {} to create blocks of code elsewhere.


    Let''s look at some examples of valid lambdas. Pretend that there are valid interfaces
    that can consume a lambda with zero, one, or two String parameters.


    ```

    3: print(() -> true); // 0 parameters

    4: print(a -> a.startsWith("test")); // 1 parameter

    5: print((String a) -> a.startsWith("test")); // 1 parameter

    6: print((a, b) -> a.startsWith("test")); // 2 parameters

    7: print((String a, String b) -> a.startsWith("test")); // 2 parameters

    ```'
