  md: "# super() vs. super\n\nAs discussed in Chapter 4, this () and this are unrelated\
    \ in Java. Likewise, super () and super are quite different but may be used in\
    \ the same methods on the exam. The first, super(), is a statement that explicitly\
    \ calls a parent constructor and may only be used in the first line of a constructor\
    \ of a class. The second, super, is a keyword used to reference a member defined\
    \ in a parent class and may be used throughout the child class.\n\nThe exam may\
    \ try to trick you by using both super() and super in a constructor. For example,\
    \ consider the following code:\n\n```\npublic Rabbit(int age) {\n  super();\n\
    \  super.setAge(10);\n}\n```\n\nThe first statement of the constructor calls the\
    \ parent's constructor, whereas the statement calls a function defined in the\
    \ parent class. Contrast this with the following code, which doesn't compile:\n\
    \n```\npublic Rabbit(int age) {\n  super(); // DOES NOT COMPILE\n  super().setAge(10);\
    \ // DOES NOT COMPILE\n}\n```\n\nThis code looks similar to the previous example,\
    \ but neither line of the constructor will compile since they are using the keywords\
    \ incorrectly. When you use super() or super on the exam, be sure to check that\
    \ they are used correctly.\n\n# Inheriting Methods\n\nInheriting a class grants\
    \ access to the public and protected members of the parent class, but also sets\
    \ the stage for collisions between methods defined in both the parent class and\
    \ the subclass. In this section, we'll review the rules for method inheritance\
    \ and how Java handles such scenarios.\n\n# Overriding a Method\n\nWhat if a method\
    \ is defined in both the parent and child class? For example, you may want to\
    \ define a new version of an existing method in a class that makes use of the\
    \ definition in the parent class. In this case, you can override a method by declaring\
    \ a new method with the signature and return type as the method in the parent\
    \ class. As you recall from Chapter 4, the method signature includes the name\
    \ and list of input parameters."
  merge: -1
  pgno: 291
