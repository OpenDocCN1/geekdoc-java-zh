    \ of the constructor.\n\n+   4. If the parent doesn't have a no-argument constructor\
    \ and the child doesn't define any constructors, the compiler will throw an error\
    \ and try to insert a default no-argument constructor into the child class.\n\n\
    +   5. If the parent doesn't have a no-argument constructor, the compiler requires\
    \ an explicit call to a parent constructor in each child constructor. Make sure\
    \ you understand these rules; the exam will often provide code that breaks one\
    \ or many of these rules and then doesn't compile.\n\n# Calling Constructors\n\
    \nNow we have covered how to define a valid constructor, we'll show you how Java\
    \ calls the constructors. In Java, the parent constructor is always executed before\
    \ the child constructor. For example, to determine what the following code outputs:\n\
    \n```\nclass Primate {\n  public Primate() {\n    System.out.println(\"Primate\"\
    );\n  }\n}\n\nclass Ape extends Primate {\n  public Ape() {\n    System.out.println(\"\
    Ape\");\n  }\n}\n\npublic class Chimpanzee extends Ape {\n  public static void\
    \ main(String[] args) {\n    new Chimpanzee();\n  }\n}\n```\n\nThe compiler first\
