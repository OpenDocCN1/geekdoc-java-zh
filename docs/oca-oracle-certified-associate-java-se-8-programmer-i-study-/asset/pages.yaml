  md: '# Understanding the Java Class Structure 3


    The simplest Java class you can write like this:


    ```

    1: public class Animal {

    2: }

    ```


    Java calls a word with special meaning a keyword. The public keyword on line 1
    means the class can be used by other classes. The class keyword indicates you''re
    defining a class. Animal gives the name of the class. Granted, this isn''t a very
    interesting class, so add your first field:


    ```

    1: public class Animal {

    2: String name;

    3: }

    ```


    > The lines numbers aren''t part of the program; they''re just there to make the
    code easier to talk about.


    On line 2, we define a variable named Name. We also define the type of that variable
    to be a String. A String is a value that we can put text into, such as "this is
    a string". String is a class supplied by Java. Next you can add methods:


    ```

    1: public class Animal {

    2: String name;

    3: public String getName() {

    4: return name;

    5: }

    6: public void setName(String newName) {

    7: name = newName;

    8: }

    9: }

    ```


    On lines 3–5, you''ve defined your first method. A method is an operation that
    can be called. Again, public is used to signify that this method may be called
    from other classes. Next comes the return type—in this case, the method returns
    a String. In lines 6–8 is another method. This one has a special return type void.
    void means that no value at all is returned. This method requires information
    to be supplied to it from the calling method; this information is called a parameter.
    setName has one parameter newName, and it is of String type. This means the caller
    should pass in one String parameter and expect nothing to be returned.


    The full declaration of a method is called a method signature. In this example,
    can you identify the return type and parameters?


    ```

    public int numberVisitors(int month

    ```'
