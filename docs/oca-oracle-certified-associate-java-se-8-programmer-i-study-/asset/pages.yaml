  md: "# 4. Like all methods in an interface, a default method is assumed to be public\
    \ and will not compile if marked as private or protected.\n\nThe first rule should\
    \ give you comfort in that you'll only see default methods in interfaces. If you\
    \ see them in a class on the exam, assume the code will not compile. The second\
    \ rule denotes syntax, as default methods must use the default keyword.\n\n```\n\
    public interface Carnivore {\npublic default void eatMeat(); // DOES NOT COMPILE\n\
    public int getRequiredFoodAmount() { // DOES NOT COMPILE\n    return 3;\n}\n```\n\
    \nIn this example, the first method, eatMeat(), doesn't compile because it is\
    \ marked as default but doesn't provide a method body. The second method, getRequiredFoodAmount(),\
    \ also doesn't compile because it provides a method body but is not marked with\
    \ the default keyword.\n\nUnlike variables, which are assumed static class members,\
    \ default methods cannot be marked as static and require an instance of the class\
    \ implementing the interface to be invoked. They also cannot be marked as final\
    \ or abstract, because they are allowed to be overridden in subclasses but are\
    \ not required to be overridden.\n\nWhen an interface extends another interface\
    \ that contains a default method, it may choose to ignore the default method,\
    \ in which case the interface implementation for the method will be used. Alternatively,\
    \ the interface may override the definition of the default method using the standard\
    \ rules for method overriding, such as not limiting the accessibility of the method\
    \ and using covariant returns. The interface may declare the method as abstract,\
    \ requiring classes that implement the new interface to explicitly provide a method\
    \ body. Analogous options apply for an abstract class that implements an interface.\n\
    \nFor example, the following class overrides one default interface method and\
    \ redeclaims a second interface method as abstract:\n\n```\npublic interface HasFins\
    \ {\npublic default int getNumberOffins() {\n    return 4;\n}\npublic default\
    \ double getLongestFinLength() {\n    return 20.0;\n}\npublic default boolean\
    \ doHasScales() {\n    return true;\n}\n```"
