    \ one of the primary reasons we have class structure at all—is to support virtual\
    \ methods. A virtual method is a method in which the specific implementation is\
    \ not determined until runtime. In fact, all non-final, non-static, and non-private\
    \ Java methods are considered virtual methods, since any of them can be overridden\
    \ at runtime. What makes a virtual method special in Java is if you call a method\
    \ on an object that overrides the overridden method, get the overridden method,\
    \ even if the call to the method is on a parent reference or within the parent\
    \ class. We'll illustrate this with following example:\n\n```\npublic class Bird\
    \ {\n    public String getName() {\n        return \"Unknown\";\n    }\n\n   \
    \ public void displayInformation() {\n        System.out.println(\"The bird name\
