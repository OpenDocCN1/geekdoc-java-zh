  md: "# Creating Objects\n\nThere are three code blocks and one instance initializer.\
    \ Counting code blocks is easy: you just count the number of pairs of braces.\
    \ If there aren't the same number of open { { and close {} braces, the code doesn't\
    \ compile. It doesn't matter that one set of braces is inside the main() method—still\
    \ counts.\n\nWhen counting initializers, keep in mind that it do matter whether\
    \ the braces are inside a method. There's only one pair of braces outside a method.\
    \ Line 6 is an instance initializer.\n\n# Order of Initialization\n\nWhen writing\
    \ code that initializes fields in multiple places, you have to keep track of the\
    \ order of initialization. We'll add some more rules to the order of initialization\
    \ in Chapters 4 and 5. In the meantime, you need to remember:\n\n+   - Fields\
    \ and instance initializer blocks run in the order in which they appear in the\
    \ file.\n\n+   - The constructor runs after all fields and instance initializer\
    \ blocks have run.\n\nLet's look at an example:\n\n```\n1: public class Chick\
    \ {\n2:   private String name = \"Fluffy\";\n3:   System.out.println(\"setting\
    \ field\"); \n4:   public Chick() {\n5:     name = \"Tiny\";\n6:     System.out.println(\"\
    setting constructor\");\n7:   }\n8:\n9:   public static void main(String[] args)\
    \ {\n10:    Chick chick = new Chick();\n11:    System.out.println(chick.name);\
    \ } }\n```\n\nRunning this example prints:\n\nsetting field\nsetting constructor\n\
    \nTiny\n\nLet's look at what's happening here. We start with the main() method\
    \ because that Java starts execution. On line 9, we call the constructor of Chick.\
    \ Java creates a new object. It first initializes name to \"Fluffy\" on line 2.\
    \ Next it executes the print statement in the instance initializer on line 3.\
    \ Once all the fields and instance initializers run, Java returns to the constructor.\
    \ Line 5 changes the value of name to \"Tiny\" and line 6 prints another statement.\
    \ At this point, the constructor is executing and goes back to the print statement\
    \ on line 10."
