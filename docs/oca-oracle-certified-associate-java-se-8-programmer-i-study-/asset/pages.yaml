    # The String Pool


    Since strings are everywhere in Java, they use up a lot of memory. In some production
    appli-

    cations, they can use 25-40 percent of the memory in the entire program. Java
    realizes

    at many strings repeat in the program and does this by reusing common ones. The

    string pool, also known as the internal pool, is a location in the Java virtual
    machine (JVM)

    that collects all these strings.


    The string pool contains literal values that appear in your program. For example,

    "name" is a literal and therefore goes into the string pool. myobject.toString()
    is a string

    not a literal, so it does not go into the string pool. Strings not in the string
    pool are gar-

    baged just like any other object.


    Remember back when these two lines are subtly different?


    ```

    String name = "Fluffy";

    String name = new String("Fluffy");"

    ```


    The former says to use the string pool normal. The second says "No, JVM. I really

    don''t want you to use the string pool. Please create a new object for me though
    it is

    less efficient." When you write programs, you wouldn''t want to do this. For the
    exam, you

    need to know that it is allowed.


    # Important String Methods


    The String class has dozens of methods. Lucky, you need to know only a handful
    for the

    exam. The exam creators pick most of the methods developers use in the real world.


    For all these methods, you need to remember that a string is a sequence of characters

    and Java counts from 0 indexed. Figure 3.1 shows how each character in the string

    "animals" is indexed.'
