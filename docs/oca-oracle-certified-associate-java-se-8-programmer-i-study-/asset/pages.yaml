  md: '# Summary


    This chapter covered a wide variety of topics, including dozens of Java operators,
    along with numerous control flow statements. Many of these operators and statements
    may have been new to you.


    It is important that you understand how to use all of the required Java operators
    covered in this chapter and how operator precedence influence the particular expression
    is interpreted. There will likely be numerous questions on the exam that appear
    to test one thing, such as StringBuilder or exception handling, when in fact the
    answer is related to the misuse of a particular operator that causes the application
    to fail to compile. When you see an operator on the exam, always check that the
    appropriate data types are used and that they match each where applicable.


    For statements, this chapter covered two types of control structures: decision-making
    controls structures, if-then, if-else, and switch statements, as well as repetition
    structures including for, each, while, and do-while. Remember that most of these
    structures require the evaluation of the particular boolean expression either
    for branching decisions or repetition. The switch statement is the only one that
    supports a variety of data types, including String variables as Java 7.


    With a for-each statement, you don''t need to write a boolean expression, for-each
    loop, but syntactically they are written as a for statement.


    We concluded this chapter by discussing advanced control options and how flow
    can be enhanced by nested loops, break statements, and continue statements. Be
    wary of questions on the exam that you used nested statements, especially ones
    with labels, and verify they are being used correctly.


    This chapter is especially important because at least one component of this chapter
    will likely appear in every exam with sample code. Many of the questions on the
    exam focus on syntactic use of the structures, which will be a large source of
    questions that end in "Does not compile." You should be able to answer all of
    the review questions correctly or fully understand that you answered incorrectly
    before moving on to later chapters.


    # Exam Essentials


    Be able to write code that uses Java operators. This chapter covered a wide variety
    of operator symbols. Go back and review them several times so that you are familiar
    with them throughout the rest of the book.


    Be able to recognize which operators are associated with which data types. Some
    operators may be applied only to numeric primitives, some only to boolean values,
    and some only to objects. It is important that you notice when an operator and
    operand(s) are mismatched, as this issue is likely to come up in a couple of exam
    questions.'
  merge: -1
  pgno: 137
- img_proc: true
  md: 'Understand Java operator precedence. Most Java operators you''ll work with
    are binary, but the number of expressions is often greater than two. Therefore,
    you must understand the order in which Java will evaluate each operator symbol.


    Be able to write code that uses parentheses to override operator precedence. You
    can use parentheses in your code to manually change the order of precedence.


    Understand if and switch decision control statements. The if-then and switch statements-come
    up frequently throughout the exam in questions unrelated to decision control,
    so make sure you fully understand these basic building blocks of Java.


    Understand loop statements. Know the syntactical structure of all loops, including
    while, do-while, and for. Each loop has its own special properties and structures.
    Also, be familiar with the enhanced-each loops that iterate over lists.


    Understand how break and continue can change flow control. Know how to change
    the flow control within a statement by applying a break or continue command. Also
    know which control statements can accept break statements and which can accept
    continue statements. Finally, understand how these statements work inside embedded
    loops or switch statements.'
