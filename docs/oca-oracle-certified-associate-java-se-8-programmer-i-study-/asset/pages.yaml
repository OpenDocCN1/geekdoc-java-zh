  md: 'Finally, this chapter introduced the concept of polymorphism, central to the
    Java language, and showed how objects can be accessed in a variety of forms. Make
    sure you understand when casts are needed for accessing objects, and be able to
    spot the difference between compile-time and runtime casts.


    # Exam Essentials


    Be able to write code that extends other classes. A Java class that extends another
    class inherits all of its public and protected methods and variables. The first
    line of every constructor is a call to another constructor within the class using
    this() or a call to a constructor of the parent class using the super(). If the
    parent class doesn''t contain a no-argument constructor, an explicit call to the
    parent constructor must be provided. Methods and objects can be accessed explicitly
    using the super keyword. Finally, all classes in Java extend directly or from
    a superclass.


    Understand the rules for method overriding. The Java compiler allows methods to
    be overridden in subclasses if rules are followed: method must have the same signature,
    be at least as accessible as the parent method, must not declare any new or broader
    exceptions, and must use covariant return types.


    Understand the rules for hiding methods and variables. When a static method is
    created in a subclass, it is referred to as method hiding. Likewise, variable
    hiding is when a variable name is reused in a subclass. In both situations, the
    original method or variable still exists and is used in methods that reference
    the object in the parent class. For method hiding, the use of static in the method
    declaration must be the same between the parent and child class. Finally, variable
    and method hiding should generally be avoided since it leads to confusing and
    difficult-to-follow code.


    Recognize the difference between method overriding and method overloading. Both
    method overloading involve creating a new method with the same name as an existing
    method. When the method signature is the same, it is referred to as method overriding
    and must follow a specific set of rules to compile. When the method signature
    is different, the method taking different inputs, it is referred to as method
    overloading and none of the override rules are required.


    Be able to write code that creates and extends abstract classes. In Java, classes
    and methods can be declared as abstract. Abstract classes cannot be instantiated
    and require a concrete subclass to be accessed. Abstract classes can include any
    number, including zero, of abstract and nonabstract methods. Abstract methods
    follow all the method override rules and may only be defined within abstract classes.
    The first concrete subclass of an abstract class must implement all the inherited
    methods. Abstract classes and methods may not be marked as final or private.'
