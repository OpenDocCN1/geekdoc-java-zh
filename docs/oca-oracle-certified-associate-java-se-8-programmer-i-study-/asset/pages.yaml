  md: "```\npublic class Swan extends Animal {\n    public String getName() {\n  \
    \      return \"Swan\";\n    }\n}\n```\n\nThe first thing to notice about this\
    \ sample code is that the Animal class is declared abstract and Swan is not. Next,\
    \ the member age and the method eat() are marked as protected and public, respectively;\
    \ therefore they are inherited in subclasses as Swan. Finally, the abstract method\
    \ getName() is terminated with a semicolon and doesn't provide a body in the parent\
    \ class Animal. This method is implemented with the same name and signature as\
    \ the parent method in the Swan class.\n\n# Defining an Abstract Class\n\nThe\
    \ previous sample class illustrates a number of important rules about abstract\
    \ classes. For example, an abstract class may include nonabstract methods and\
    \ variables, as you see with the variable age and the method eat(). In fact, an\
    \ abstract class is not required to include any abstract methods. For example,\
    \ the following code compiles without even though it doesn't define any abstract\
    \ methods:\n\n```\npublic abstract class Cow {\n}\n```\n\nAlthough an abstract\
    \ class doesn't have to implement any abstract methods, an abstract method may\
    \ only be defined in an abstract class. For example, the following code won't\
    \ compile because an abstract method is not defined within an abstract class:\n\
    \n```\npublic abstract class Chicken {\n    public abstract void peck(); // DOES\
    \ NOT COMPILE\n}\n```\n\nThe exam creators are fond of questions like this one,\
    \ which mixes nonabstract classes with abstract methods. They are also fond of\
    \ methods marked as abstract for which an implementation is also defined. For\
    \ example, neither method in the following code will compile because the methods\
    \ are marked as abstract:\n\n```\npublic abstract class Turtle {\n    public abstract\
    \ void swim() {} // DOES NOT COMPILE\n    public abstract int getAge() { // DOES\
    \ NOT COMPILE\n        return 10;\n}\n```"
