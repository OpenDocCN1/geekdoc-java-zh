  md: "# Encapsulating Data\n\nIn Chapter 1, we had an example of a class with a field\
    \ that wasn't private:\n\n```\npublic class Swan {\n    int numberEgs; // instance\
    \ variable\n}\n```\n\nWhy do we care? Since there is default (package private)\
    \ access, which means any class in the package can set numberEgs. We no longer\
    \ have control of what gets set in our own class. A caller could do this:\nmother.numberEgs\
    \ = -1;\n\nThis is clearly no good. We do not want the method Swan to have a negative\
    \ number of eggs!\nEncapsulation return to the rescue. Encapsulation means we\
    \ set up the class to only methods in the class with the variables can refer to\
    \ the instance variables. Callers are restricted to use these methods. Let's take\
    \ a look at our newly encapsulated Swan:\n\n```\npublic class Swan {\n    private\
    \ int numberEgs; // private\n    public int getNumberEgs() { // getter\n     \
    \   return numberEgs;\n    }\n    public void setNumberEgs(int numberEgs) { //\
    \ setter\n        if (numberEgs >= 0) // guard condition\n            this.numberEgs\
    \ = numberEgs;\n        }\n    }\n```\n\nNote numberEgs is private on line 2.\
    \ This means only code within the class can read or write the value of numberEgs.\
    \ Since we wrote the class, we know better than to set a negative number of eggs.\
    \ We added a method on lines 3–5 to read the value, which is called an accessor\
    \ method or a getter. We added a method on 6–9 to update the value, which is called\
    \ a mutator method or a setter. The setter has an if statement to prevent setting\
    \ the instance variable to an invalid value. This guard condition protects the\
    \ instance variable.\n\nOn line 8, we used this keyword that we saw in constructors\
    \ to differentiate the method parameter numberEgs and the instance variable numberEgs.\
    \ For encapsulation, remember that data (an instance variable) is private and\
    \ getters/setters are public. Java defines a naming convention that is used in\
    \ JavaBeans. JavaBeans are reusable software components, JavaBeans call an instance\
    \ variable a property. The only thing you need to know about JavaBeans for the\
    \ exam is the naming conventions listed in Table 4.5."
