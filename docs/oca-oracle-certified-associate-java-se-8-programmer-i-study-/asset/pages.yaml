  md: '# Runtime Exceptions


    Runtime exceptions extend RuntimeException. They don''t have to be handled or
    declared. They can be thrown by the programmer or by the JVM. Common runtime exceptions
    include the following:


    +   - ArithmeticException Thrown by the JVM when code attempts to divide by zero


    +   - ArrayIndexOutOfBoundsException Thrown by the JVM when code uses an illegal
    index to access an array


    +   - ClassCastException Thrown by the JVM when an attempt is made to cast an
    exception to a subclass of it is not an instance


    +   - IllegalArgumentException Thrown by the programmer to indicate that a method
    has been passed an illegal or inappropriate argument


    +   - NullPointerException Thrown by the JVM when there is a null reference where
    an object is required


    +   - NumberFormatException Thrown by the programmer when an attempt is made to
    convert a string to a numeric type the string doesn''t have an appropriate format


    # ArithmeticException


    Trying to divide an int by zero gives an undefined result. When this occurs, the
    JVM will throw an ArithmeticException:


    ```

    int answer = 11 / 0;

    ```


    Running code results in the following output:


    Exception in thread "main" java.lang.ArithmeticException: / by zero


    Java spells out the word "divide". That is, because we know that / is the division
    operator and Java is to tell us why zero occurred. The thread "main" is telling
    us the code was called directly or indirectly from a program with a main method.
    On the OCA, this is all the output we will see. Next comes the name of the exception,
    followed by extra information (if any) that goes with the exception.


    # ArrayIndexOutOfBoundsException


    You know that array indices start with 0 and go up to 1 less the length of the
    array—which means this code will throw an ArrayIndexOutOfBoundsException:


    ```

    int[] countsMoose = new int[3];

    System.out.println(countsMoose[-1]);

    ```


    This is a problem because there''s no thing as a negative array index. Running
    this code yields the following output:


    Exception in thread "main" java.lang.ArrayIndexOutOfBoundsException: -1


    At least Java tells us what index was invalid. Can you see what''s wrong with
    this?'
