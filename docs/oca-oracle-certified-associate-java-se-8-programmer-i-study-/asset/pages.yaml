  md: '# Ternary Operator


    Now we have discussed if-else statements, we can briefly return to our discussion
    of operators and present the final operator that you need to learn for the exam.
    The conditional operator, ? ; otherwise known as the ternary operator, is the
    only operator that takes three operands and is of the form:


    ```

    booleanExpression ? expression1 : expression2

    ```


    The first operand must be a boolean expression, and the second and the third can
    be any expression that returns a value. The ternary operation is really a condensed
    form of if-then-else statement that returns a value. For example, the following
    two snippets of code are equivalent:


    ```

    int y = 10;

    final int x;

    if(y > 5) {

    x = 2 * y;

    } else {

    x = 3 * y;

    }

    ```


    Compare the previous code snippet with the following equivalent ternary operator
    snippet:


    ```

    int y = 10;

    int x = (y > 5) ? (2 * y) : (3 * y);

    ```


    Note that it is often helpful for readability to add parentheses around the expressions
    in ternary operations, although it is certainly not required.\ There is no requirement
    that second and third expressions in ternary operations have the same types, although
    it may come into play when combined with the assignment operator. Compare the
    following statements:


    ```

    System.out.println(y > 5) ? 21 : "Zebra";

    int animal = (y < 91) ? 9 : "Horse"; // DOES NOT COMPILE

    ```


    Both expressions evaluate similar boolean values and return an int and a String,
    although only the first line will compile. The System.out.println() does not care
    that the statements are completely different types, because it can convert to
    String. On the other hand, the compiler does know that "Horse" is of the wrong
    type and cannot be assigned to an int; therefore, it will not allow the code to
    be compiled.'
