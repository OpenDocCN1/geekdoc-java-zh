  md: "# Using a try Statement\n\ntry statements are like methods in that the curly\
    \ braces are required even if there is only one statement inside the code blocks.\
    \ if statements and loops are special in this respect as they allow you to omit\
    \ the curly braces.\nWhat about this not?\n\n```\ntry // DOES NOT COMPILE\n  fall();\n\
    }\n```\n\nThis code does not compile because the try block doesn't have anything\
    \ after it. Remember, the point of a try statement is something to happen if an\
    \ exception is thrown. Without another clause, the try statement is lonely.\n\
    Now that you know the basics, let's start adding more features to exceptions.\
    \ The following sections show you how to add a finally clause to a try statement\
    \ and catch different types of exceptions and describe what happens if an exception\
    \ is thrown or catch\n\n# Adding a finally Block\n\nThe try statement also lets\
    \ you run code at the end with a finally clause regardless of whether an exception\
    \ is thrown. Figure 6.3 shows the syntax of a try statement with this extra functionality.\n\
    \nFIGURE 6.3 The syntax of a try statement with finally\n\n![](img/7ba91ff267bc04c697c94b2034027b4d_352_0.png)\n\
    \nThere are two paths through code with a catch and a finally. If an exception\
    \ is thrown, the finally block is run after the catch block. If no exception is\
    \ thrown, the finally block is run after the try block completes."
