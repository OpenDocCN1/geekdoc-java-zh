  md: '# Appendix B · Study Tips


    developer. For example, you might go years without writing a ternary expression
    or using an abstract class, but that does not mean they are important features
    of the Java language. You may also be unaware of some of the more complex features
    that exist within the Java language. On top of that, there are new features to
    Java 8, such as lambda expressions and default interface methods, as this writing
    very professional software developers are using.


    The Review Questions in each chapter are designed to help you in on those features
    of the Java language that you may be weak in and that are required knowledge for
    the exam. For example, you should note which questions you got wrong, understand
    why you got them wrong, and study those areas even more.


    Often the reason you got a question on the exam is that you did not fully understand
    the concept. Concepts in Java have subtle rules that you often need to see to
    prove to yourself. For example, you cannot write a class that implements two interfaces
    that define the same default method unless you override the default method in
    the class. Writing and attempting to compile your own sample interfaces and classes
    that reference the default method may illuminate this concept better than we could
    explain it.


    Finally, we find developers who practice code while studying for the Java certification
    to write better Java code in professional career. Anyone can write a Java class
    that can compile, but just because a class does not mean it is well designed.
    For example, imagine a class where all methods and variables were declared public,
    simply because the developer did not understand the other access modifiers, such
    as protected and private. Studying for the certification helps you to learn those
    features that may be applicable in your daily coding experience that you never
    existed within the Java language.


    # “Overstudying” Practice Exams


    Although we recommend reading this book and writing your own applications multiple
    times, redoing exams over and over can have a negative impact on the long run.
    For example, some individuals study the exam questions so that they end up memorizing
    them. In this scenario, they can easily become overconfident—they can achieve
    perfect scores on the practice exams but fail on the exam.


    If you get a exam question correct, you should move on, and if you get incorrect
    you should review the part of the chapter that covers it until you can answer
    it correctly. Remember that for legal reasons the practice questions are not real
    exam questions, so it is important to learn the material the questions are based
    on.


    On the other hand, we recommend repeat Review Questions as you like to master
    a chapter. Review Questions are designed to teach you important concepts in the
    chapter, and you should understand them completely before leaving a section. Furthermore,
    they help improve your ability to recognize certain types of problems present
    in many code snippets.'
