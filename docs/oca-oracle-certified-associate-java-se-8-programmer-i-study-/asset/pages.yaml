  md: "# Static Initialization\n\nIn Chapter 1, we covered instance initializers that\
    \ looked like unnamed methods. Just code inside braces. Static initializers look\
    \ similar. They add the static keyword to specify that they should be run when\
    \ the class is first used. For example:\n\n```\nprivate static final NUM_SECONDS_PER_HOUR;\n\
    static {\n    int numSecondsPerMinute = 60;\n    int numMinutesPerHour = 60;\n\
    \    NUM_SECONDS_PER_HOUR = numSecondsPerMinute * numMinutesPerHour;\n}\n```\n\
    \nThe static initializer runs when the class is first used. The statements in\
    \ it assign any static variables as needed. There is something interesting about\
    \ this example. We just got saying that final variables aren't allowed to be reassigned.\
    \ The key here is that the static initializer is the first assignment. And since\
    \ it occurs up front, it is okay.\nLet's try another example to make sure you\
    \ understand the distinction:\n\n+   14: private static int one;\n15: private\
    \ static int two;\n16: private static int three = 3;\n17: private static final\
    \ int four; // DOES NOT COMPILE\n18: static {\n19:     one = 1;\n20:     two =\
    \ 2;\n21:     three = 3; // DOES NOT COMPILE\n22:     two = 4;\n23: }\n\nLine\
    \ 14 declares a static variable that is not final. It can be assigned as many\
    \ times as we like. Like line 15 a final variable without initializing it. This\
    \ means we can initialize it exactly once in a static block. Line 22 doesn't compile\
    \ because this is the second attempt. Line 16 declares a final variable and initializes\
    \ it at the same time. We are not allowed to assign it again, so line 21 doesn't\
    \ compile. Line 17 declares a final variable that never gets initialized. The\
    \ compiler gives a compiler error because it knows the static blocks are the only\
    \ place the variable could possibly get initialized. Since the programmer forgot,\
    \ this is clearly an error.\n\n# Try to Avoid Static and Instance Initializers\n\
    \nUsing static and instance initializers can make your code much harder to read.\
    \ Everything that could be done in an instance initializer could be done in a\
    \ constructor instead. The constructor approach is easier to read."
