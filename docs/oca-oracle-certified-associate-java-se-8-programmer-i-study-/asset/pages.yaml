    In this example, we first try to convert the primate reference back to a lemur
    reference,

    lemur2, without an explicit cast. The result is that the code will not compile.
    In the second

    example, though, we explicitly cast the object to a subclass of the object Primate
    and we

    gain access to all the methods available to the Lemur class.


    Here are some basic rules to keep in mind when casting variables:


    +   1. Casting an object from a subclass to a subclass doesn''t require an explicit
    cast.

    2. Casting an object from a superclass to a subclass requires an explicit cast.

    3. The compiler will not allow casts to unrelated types.

    4. Even when the code compiles without issue, an exception may be thrown at runtime
    if

    the object being cast is not actually an instance of that class.'
