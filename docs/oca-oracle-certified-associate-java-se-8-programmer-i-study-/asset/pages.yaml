  md: "# Using a try Statement\n\nIf the more specific ExhibitClosedForLunch exception\
    \ is thrown, the first catch block runs. If not, Java checks if the superclass\
    \ ExhibitClosed exception is thrown and catches it there. This time, the order\
    \ of the catch blocks does matter. The reverse does not work.\n\n```\npublic void\
    \ visitMonkeys() {\n    try {\n        seeAnimal();\n    } catch (ExhibitClosed\
    \ e) {\n        System.out.print(\"not today\");\n    } catch (ExhibitClosedForLunch\
    \ e) { // DOES NOT COMPILE\n        System.out.print(\"try back later\");\n  \
    \  }\n}\n```\n\nThis time, the more specific ExhibitClosedForLunch exception is\
