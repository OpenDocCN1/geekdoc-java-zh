  md: '# Reference Types


    A reference type refers to an object (an instance of a class). Unlike primitive
    types that hold their values in the memory where the variable is allocated, references
    do not hold the value of the object they refer to. Instead, a reference "points"
    to an object by storing the memory address where the object is located, a concept
    referred to as a pointer. Unlike other languages, Java does not allow you to learn
    what the physical memory address is. You can only use the reference to refer to
    the object.


    Let''s take a look at some examples that declare and initialize reference types.
    Suppose we declare a reference of type java.util.Date and a reference of type
    String:


    ```

    java.util.Date today;


    String greeting;

    ```


    The today variable is a reference of type Date and can only point to a String
    object. A value is assigned to a reference in one of ways:


    +   - A reference can be assigned to another object of the same type.

    - A reference can be assigned to another object using the new keyword.


    For example, the following statements assign these references to objects:

    today = new java.util.Date();

    greeting = "How are you?";


    The today reference points to a new Date object in memory, and today can be used
    to access the various fields and methods of this Date object. Similarly, the greeting
    reference points to a new String object, "How are you?". The String and Date objects
    do not have names and can be accessed only via their corresponding reference.
    Figure 1.1 shows how the reference types appear in memory.


    FIGURE 1.1 An object in memory can be accessed only via a reference.


    ![](img/7ba91ff267bc04c697c94b2034027b4d_69_0.png)'
