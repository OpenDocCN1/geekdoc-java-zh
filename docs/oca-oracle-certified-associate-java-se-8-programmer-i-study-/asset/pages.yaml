  md: "# Chapter 1 Java Building Blocks\n\nImagine you are mailing a letter to 123\
    \ Main St., Apartment 9. The mail carrier first brings the letter to 123 Main\
    \ St. Then she looks for the mailbox for apartment 9. The address is like the\
    \ package name in Java. The apartment number is like the class name in Java. Just\
    \ as the mail carrier only looks at numbers in the building, Java only looks for\
    \ classes in the package.\n\nPackage names are hierarchical like the mail start.\
    \ The postal service starts with the top level, which is likely your country.\
    \ If it begins with java or javafx, this means it comes from the JDK. If it starts\
    \ with something else, it is likely where it comes from using the website name\
    \ in reverse. For example, com.amazon.javabook tells you the code from amazon.com.\
    \ For the website name, you can add whatever you want. For example, com.amazon.java8.myname\
    \ also comes from amazon.com. javabook more detailed packages which tell you it's\
    \ longer and more specific.\n\nYou'll see many package names like a.b.c. The rule\
    \ for package names is that they are mostly letters or numbers separated by dots.\
    \ Technically, you're allowed a couple of characters between the dots. The rule\
    \ for them is the same for variable names, which you'll see later in the chapter.\
    \ The example may try to trick you with invalid variable names. Luckily, it doesn't\
    \ try to trick you by giving invalid package names.\n\nIn the following sections,\
    \ we'll look at imports with wildcards, naming conflicts with imports, how to\
    \ create a package of your own, and how the exam formats code.\n\n# Wildcards\n\
    \nClasses in the same package are often imported together. You can use a shortcut\
    \ to import all the classes in a package:\n\n```\nimport java.util.*; // imports\
    \ java.util.Random among other things\npublic class ImportExample {\n    public\
    \ static void main(String[] args) {\n        Random r = new Random();\n      \
    \  System.out.println(r.nextInt(10));\n    }\n}\n```\n\nIn this example, we import\
    \ java.util.Random and a * is a wildcard that matches all classes in the package.\
    \ Every class in the java.util package is available to this program when Java\
    \ compiles. It doesn't import child packages, fields, or methods; it only imports\
    \ classes. (Okay, it's only classes for now, but there's a special type of import\
    \ called \"static import\" that imports other types. You'll learn more about that\
    \ in Chapter 4).\n\nYou might think that including many classes slows down your\
    \ program, but it doesn't. The compiler figures out what's actually needed. Which\
    \ approach you choose is personal preference."
