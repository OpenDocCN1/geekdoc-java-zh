    # Increment and Decrement Operators


    Increment and decrement operators, ++ and --, respectively, can be applied to
    numeric operands and have the higher order or precedence, as compared to binary
    operators. In other words, they often get applied first to an expression.


    Increment and decrement operators require special care because the order they
    are applied to their associated operand can make a difference in how an expression
    is processed. If the operator is placed before the operand, referred to as the
    pre-increment operator and the pre-decrement operator, then the operator is applied
    first and the return value is the new value of the expression. Alternatively,
    if the operator is placed after the operand, referred to as the post-increment
    operator and the post-decrement operator, then the original value of the expression
    is returned, with operator applied after the value is returned.'
