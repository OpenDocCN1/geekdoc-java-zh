    # Identifiers


    It properly comes as no surprise that Java has precise rules about identifier
    names. Luckily, the rules for identifiers apply to anything you are free to name,
    including variables, methods, classes, and fields.


    There are only three rules to remember for legal identifiers:


    +   - The name must begin with a letter or the symbol $ or _.

    - Subsequent characters may also be numbers.

    - You cannot use the same name as a reserved word. As you might imagine, a reserved
    word is a keyword that Java reserved so you are not allowed to use it. Remember
    that Java is case sensitive, so you can use versions of the keywords that only
    differ in case. Please don''t, though.


