  md: "```\npublic class BactrianCamel extends Camel {\n    private int getNumberOfHumps()\
    \ {\n        return 2;\n    }\n}\n```\n\nThis code compiles without issue. Note\
    \ that the return type differs in the child method from String to int. In example,\
    \ the method getNumberOfHumps() in the parent class is hidden, the method in the\
    \ child class is a new method and not an override of the method in the parent\
    \ class. As you saw in the previous section, if the method in the parent class\
    \ were public or protected, the method in the child class would not compile because\
    \ it would violate rules of overriding methods. The parent method in this example\
    \ is private, so there are no such issues.\n\n# Hiding Static Methods\n\nA hidden\
    \ method occurs when the child class defines a static method with the same name\
    \ and signature as a static method defined in a parent class. Method hiding is\
    \ similar but not exactly the same as overriding. First, the four previous rules\
    \ for overriding a method must be followed when a method is hidden. In addition,\
    \ a new rule is added for hiding a method, namely the usage of the static keyword\
    \ must be the same between parent and child classes. The following list summarizes\
    \ the five rules for hiding a method:\n\n+   1. The method in the child class\
    \ must have the same signature as the method in the parent class.\n\n+   2. The\
    \ method in the child class must be at least as accessible or more accessible\
    \ than the method in the parent class.\n\n+   3. The method in the child class\
    \ may not throw a checked exception that is new or broader than the class of any\
    \ exception thrown in the parent class.\n\n+   4. If the method returns a value,\
    \ it must be the same or a subclass of the method in the parent class, known as\
    \ covariant return types.\n\n+   5. The method defined in the child class must\
    \ be marked as static if it is marked as static in the parent class (method hiding).\
    \ Likewise, the method must not be marked as static in the child class if it is\
    \ not marked as static in the parent class (over overriding).\n\nNote that the\
    \ first four are the same rules for overriding a method.\nLet's review some examples\
    \ of the new rule:\n\n```\npublic class Bear {\n    public static void eat() {\n\
    \        System.out.println(\"Bear is eating\");\n    }\n}\n```"
