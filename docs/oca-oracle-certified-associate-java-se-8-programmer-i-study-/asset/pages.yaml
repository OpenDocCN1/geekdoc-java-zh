  md: "# Inheriting Variables\n\nAs you saw with method overiding, there were a lot\
    \ of rules when two methods have the same signature and are defined in both the\
    \ parent and child classes. Luckily, the rules for variables with the same name\
    \ in the parent and child classes are a lot simpler, because Java does not allow\
    \ variables to be overridden instead hidden.\n\n# Hiding Variables\n\nWhen you\
    \ hide a variable, you define a variable with the same name as a variable in a\
    \ parent class. This creates two copies of the variable within an instance of\
    \ the child class: one instance defined for the parent reference and another defined\
    \ for the child reference.\nAs hiding a static method, you can't override a variable;\
    \ you can only hide it. Also similar to hiding a static method, the rules for\
    \ accessing the parent and child variables are quite similar. If you're referencing\
    \ the variable from within the parent class, the variable defined in the parent\
    \ class is used. Alternatively, if you're referencing the variable from within\
    \ a child class, the variable defined in the child class is used. Likewise, you\
    \ can reference the parent value of the variable with an explicit use of the super\
    \ keyword. Consider the following example:\n\n```\npublic class Rodent {\n   \
    \ protected int tailLength = 4;\n    public void getRodentDetails() {\n      \
    \  System.out.println(\"[parentTail=\"+tailLength+\"]\");\n    }\n}\n\npublic\
    \ class Mouse extends Rodent {\n    protected int tailLength = 8;\n    public\
    \ void getMouseDetails() {\n        System.out.println(\"[parentTail=\"+tailLength+\"\
    ,+parentTail=\"+super.tailLength+\"]\");\n    }\n    public static void main(String[]\
    \ args) {\n        Mouse mouse = new Mouse();\n        mouse.getRodentDetails();\n\
    \        mouse.getMouseDetails();\n    }\n}\n```\n\nThis code compiles without\
    \ issue and outputs the following when executed:\n[parentTail=4]\n[tail=8,parentTail=4]"
