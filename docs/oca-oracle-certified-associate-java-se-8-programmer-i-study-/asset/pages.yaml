  md: '# Chapter 4 • Methods and Encapsulation


    Calling methods on objects that method parameters changes the state of those objects
    and is reflected in the color.


    Overloaded methods are methods with the same name but a different parameter list.
    Java calls the most specific method it can find. Exact matches are preferred,
    followed by wider primitives. After that comes autoboxing and finally varargs.


    Constructors are used to instantiate new objects. The default no-argument constructor
    is called when no constructor is coded. Multiple constructors are allowed and
    can call each other writing this(). If this() is present, it must be the first
    statement in the constructor. Constructors can refer to instance variables by
    writing the variable name to identify the instance variable and method parameter
    with that name. The order of initialization is in the superclass (which we will
    cover in Chapter 5); static and static initializers in the order they appear;
    instance variables and instance initializers in the order they appear; and finally
    the constructor.


    Encapsulation refers to preventing callers from changing instance variables directly.
    This is done by making variables private and getters public. Immutability refers
    to preventing callers from changing the instance at all. This uses techniques,
    including removing setters. JavaBeans use methods with is and set for boolean
    and non-boolean property types. Methods with set are used for setters.


    Lambda expressions, or lambdas, allow passing blocks of code. The syntax looks
    like (String a, String b) -> { return equals(b); }. The parameter types can be
    omitted. When only one parameter is specified without a type, parentheses can
    also be omitted. The braces and return statement can be omitted for a single statement,
    making the short form (a -> equals(b)). Lambdas are passed to a method expecting
    an interface with one method. Predicate is a common interface. It has one method
    named test that returns a boolean and takes any type. The removeIf() method on
    ArrayList takes a Predicate.


    # Exam Essentials


    Be able to identify correct and incorrect method declarations. A sample method
    signature is public static void method(String... args) throws Exception.


    Identify when a method or field is accessible. Recognize when a method or field
    is accessed when the access modifier (private, protected, public, or default access)
    does not allow it.


    Recognize valid and invalid uses of static imports. Static imports import static
    members. They are written as static, not static import. Make sure you are importing
    static methods or variables rather than classnames.


    State the output of code involving methods. Identify when to call static rather
    than instance methods based on theclassname or object comes before the method.'
