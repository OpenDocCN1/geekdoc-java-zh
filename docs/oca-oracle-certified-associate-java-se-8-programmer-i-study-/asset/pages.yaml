  md: 'Java 8 even integrated the Predicate interface into existing classes. ArrayList
    does a removeIf() method that takes a Predicate. Imagine we have a list of names
    for pet bunnies. We decide to remove all of the bunnies that do not begin with
    the letter h how our little cousin really wants us to choose an H. We could solve
    this by writing a loop. Or we could solve it in one line:


    ```

    3: List<String> bunnies = new ArrayList<>();

    4: bunnies.add("long ear");

    5: bunnies.add("floppy");

    6: bunnies.add("hopping");

    7: System.out.println(bunnies); // [long ear, floppy, hopping]

    8: bunnies.removeIf(s -> s.charAt(0) == ''h'');

    9: System.out.println(bunnies); // [hopping]

    ```


    Line 8 takes care of everything for us. It defines a predicate that takes a String
    and returns a boolean. The removeIf() method does the rest.

    For the OCA, you only need to know how to implement lambda expressions using the
    Predicate. Remember the one method in the interface called test()? It takes any
    reference type parameter and returns a boolean. Functional programming is a large
    topic and the basics are covered. In the OCP exam, you''ll learn how to get rid
    of the loop entirely for more than removeIf(). You''ll also learn the rules for
    implementing your own functional interfaces as we did with CheckTrait.


    # Summary


    As you learned in this chapter, Java methods start with an access modifier of
    public, private, protected or blank (default access). This is followed by an optional
    modifier such as static, final, or abstract. Next comes the return type, which
    is void or a Java type. The method name follows, using standard Java identifiers.
    Zero or more parameters go in parentheses as the parameter list. Next come any
    optional exception types. Finally, zero or more statements go in braces to wrap
    the method body.


    Using the private access means the code is only available from the same package.
    Default (package private) access means the code is only available from the same
    package. Using the protected keyword means the code is available from the same
    package or subclasses. Using the public keyword means the code is available from
    anywhere. Static methods and static variables are shared by the class. When referred
    from outside the class, they are called using the className--for example, StaticClass.method().
    Instance members are allowed to call static methods, but static members are not
    allowed to call instance members. Static imports are used to import static members.


    Java uses pass-by-value, which means that methods create a copy of the parameters.
    Assigning new values to those parameters in the method does not affect the caller''s
    variables.'
