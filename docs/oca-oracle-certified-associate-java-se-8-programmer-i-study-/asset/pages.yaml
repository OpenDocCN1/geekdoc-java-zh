  md: '# Checked Exceptions


    Checked exceptions have Exception in their hierarchy but RuntimeException. They
    must be handled or declared. They can be thrown by the programmer or by the JVM.
    Runtime exceptions include the following:


    FileNotFoundException Thrown programmatically when code tries to reference a file
    that not exist


    IOException Thrown programmatically when there''s a problem reading or writing
    a file for the OCA exam, you only need to know that these are checked exceptions.
    Keep in mind that FileNotFoundException is a subclass of IOException, although
    the exam will remind you of that if it comes up. You''ll see these two exceptions
    in more detail on the OCP exam.


    # Errors


    Errors extend the Error class. They are thrown by the JVM and should not be handled
    or declared. Errors are rare, but you might see them:


    ExceptionInitializerError Thrown by the JVM when a static initializer throws an
    exception and doesn''t handle it


    StackOverflow Thrown by the JVM when a method calls itself too many times (this
    is called infinite recursion because the method typically calls itself without
    end)


    NoClassDefFoundError Thrown by the JVM when a class that the code uses is available
    at compile time but not runtime


    # ExceptionInitializerError


    Java runs static initializers the first time a class is used. If one of the static
    initializers throws an exception, Java cannot start using the class. It declares
    defeat by throwing an ExceptionInitializerError. This code shows an ArrayIndexOutOfBounds
    in a static initializer:


    ```

    static {

    int[] countsOfMoose = new int[3];

    int num = countsOfMoose[-1];

    }\public static void main(String[] args) { }

    ```'
