  md: "# Polymorphism and Method Overriding\n\nLet's conclude this chapter by returning\
    \ to the last three rules for method overriding to demonstrate how polymorphism\
    \ requires them to be included as part of the Java specification. You'll see that\
    \ without such rules in place, it is easy to construct an example with polymorphism\
    \ in Java.\n\nThe first rule is that an overridden method must be at least as\
    \ accessible as the method it is overriding. Let's assume this rule is not necessary\
    \ and consider the following example:\n\n```\npublic class Animal {\n    public\
    \ String getName() {\n        return \"Animal\";\n    }\n}\n```\n\n```\npublic\
    \ class Gorilla extends Animal {\n    protected String getName() { // DOES NOT\
    \ COMPILE\n        return \"Gorilla\";\n    }\n}\n```\n\n```\npublic class ZooKeeper\
    \ {\n    public static void main(String[] args) {\n    Animal animal = new Gorilla();\n\
    \        System.out.println(animal.getName());\n    }\n}\n```\n\nFor the purpose\
    \ of this discussion, we'll ignore the fact that the implementation of getName()\
    \ in the Gorilla class doesn't compile because it is less accessible than the\
    \ version it is overriding in the Animal class.\n\nAs you can see, this creates\
    \ an ambiguity problem the reference animal.getName() is allowed because the method\
    \ is public in the Animal class, but by polymorphism, the Gorilla object itself\
    \ has been overridden with a less accessible version, not available to the ZooKeeper\
    \ class. This creates a contradiction in that the compiler should not allow access\
    \ to this method, but because it is being referenced as an instance of Animal,\
    \ it is allowed. Java eliminates this contradiction, by forbidding a method from\
    \ being overridden by a less accessible version of the method.\n\nLikewise, a\
    \ subclass cannot declare an overridden method with a new or broader exception\
    \ than in the superclass, since the method may be accessed using a reference to\
    \ the superclass. For example, if an instance of the subclass is passed to a method\
    \ using a superclass reference, the enclosing method would not know about any\
    \ new checked exceptions that exist on methods for this object, potentially leading\
    \ to compiled code with"
