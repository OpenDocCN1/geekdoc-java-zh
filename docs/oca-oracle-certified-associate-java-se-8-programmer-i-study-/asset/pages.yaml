  md: "# FIGURE 4.4 Copying a reference with pass-by-value\n\n![](img/7ba91ff267bc04c697c94b2034027b4d_235_0.png)\n\
    \n# Pass-by-Value vs. Pass-by-Reference\n\nDifferent languages handle parameters\
    \ in different ways. Pass-by-value is used by many languages, including Java.\
    \ In this example, the swap method does not change the original values. It only\
    \ changes a and b within the method.\n\n```\npublic static void main(String[]\
    \ args) {\n    int original1 = 1;\n    int original2 = 2;\n    swap(original1,\
    \ original2);\n    System.out.println(original1); // 1\n    System.out.println(original2);\
    \ // 2\n}\npublic static void swap(int a, int b) {\n    int temp = a;\n    a =\
    \ b;\n    b = temp;\n}\n```\n\nThe other approach is pass-by-reference. It is\
    \ used by default in a few languages, such as Perl. We aren't going to show Perl\
    \ code here because you are studying for the Java exam and don't want to confuse\
    \ you. The following example is in a made-up language that shows pass-by-reference:\n\
    \n```\noriginal1 = 1;\noriginal2 = 2;\nswapByReference(original1, original2);\n\
    print(original1); // 2 (not in Java)\nprint(original2); // 1 (not in Java)\n```\n\
    \n```\nswapByReference(a, b) {\n    temp = a;\n    a = b;\n    b = temp;\n}\n\
    ```\n\nSee the difference? In our made-up language, the caller is affected by\
    \ variable assignments made in the method."
