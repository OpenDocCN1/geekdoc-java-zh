  - 传递性——`equals` 约的第三个要求是：如果一个对象等于第二个对象，而第二个对象等于第三对象，那么第一个对象必须等于第三个对象。同样，想象在无意中违反这一要求并不困难。考虑一种向其父类添加了新的*值组件*（value
    component）的子类情况。换句话说，子类添加了一部分影响 `equals` 比较的信息。让我们从一个简单的不可变二维整数点类开始：
