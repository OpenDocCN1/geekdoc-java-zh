  - 优势一：工厂方法有名称
- - '###'
  - 优势二：它们不要求创建新对象
- - '###'
  - 优势三：它们可以返回任何子类型的对象
- - '###'
  - 优势四：返回的类可以变化
- - '###'
  - 第五优势：返回的类在编写时不必存在
- - '###'
  - 仅提供静态工厂方法的主要局限性是，没有公共或受保护构造函数的类无法被子类。例如，无法创建 Collections Framework 中任何便利实现类的子类。可以这么说，这可能是无中之福，因为它鼓励了程序员使用组合而不是继承（Item
    18），并且对于不可变类型是必须的（Item 17）。
- - '###'
  - 静态工厂方法的第二个缺点是程序员很难找到它们。它们在 API 文档中不像构造函数那样引人注目，因此可能很难弄出如何实例化一个提供静态工厂方法而非构造函数的类。Javadoc
    工具有一天可能会引起静态工厂方法的关注。在此期间，你可以通过在类或接口文档中对静态工厂引起关注，并遵循通用的命名规范来减少这一问题。以下是一些静态工厂方法的常见名称。此列表远不是穷尽的：
