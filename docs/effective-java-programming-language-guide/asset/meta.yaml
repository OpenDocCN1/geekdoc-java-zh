  - Item 17：最小化可变性
- - '###'
  - 你不仅可以共享不可变对象，它们还可以共享彼此的内部实现。
- - '###'
  - 不可变对象是其他对象（无论可变的还是不可变的）极佳的区块。如果你知道组件对象不会在其下方发生变化，那么维护复杂对象的不不变性要容易得多。这一原则的一个特殊情况是，不可变对象是极佳的
    map 键和 set 元素：你不需要担心值一旦进入 map 或 set 就会改变，这会破坏 map 或 set 的不变性。
- - '###'
  - 不可变对象免费提供了失败原子性（项目 76）。它们的状态永远不会改变，因此不存在瞬时不一致的可能性。
- - '###'
  - 不可变类的主要缺点是它们为每个不同的值都需要一个单独的对象。
