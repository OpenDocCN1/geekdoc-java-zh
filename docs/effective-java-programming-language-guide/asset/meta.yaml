  - 'Item 24: 优先使用静态成员类而非非静态成员类'
- - '###'
  - 静态成员类是最简单的嵌套类。它最好被看作是一个普通类，恰好被声明在另一个类内部，并且可以访问外层类的所有成员，即使是声明为 `private` 的成员。静态成员类是其外层类的静态成员，并遵循与其他静态成员相同的访问权限规则。如果它被声明为
    `private`，则只能在外层类内部访问，依此类推。
