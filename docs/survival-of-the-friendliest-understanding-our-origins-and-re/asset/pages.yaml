  md: '# Introduction


    It was 1971, seventeen years after Brown v. Board of Education declared that segregation
    in schools was unconstitutional, and schools all over the country were still in
    turmoil.


    Minority children often had to catch buses from one side of town to another, which
    meant they had to get up two hours earlier than white children. If they could
    afford to, white families sent their children to private schools, leaving only
    the poorest white children in the public school system. In the classroom, there
    was so much hostility between racial groups that children had very little energy
    for learning. Educators, parents, policy makers, civil rights activists, and social
    workers watched in dismay.


    Carlos*1 was in the fifth grade at a public school in Austin, Texas. English was
    his second language. He answered questions with a stammer, and when the other
    children mocked him, he stammered even more. He became withdrawn, rarely speaking
    at all.


    Many social scientists had predicted that school desegregation would be an unequal
    success. It was assumed that once all children were on an equal footing in the
    classroom, white children would leave less racist, not just toward people of color
    in their schools, but toward those throughout their lives. Minority children would
    receive a first-class education, which would set them up for successful careers.


    However, when the psychologist Elliot Aronson looked in Carlos and his classmates,
    he spotted a fundamental problem. The children in that classroom were not on an
    equal footing. The white children were better prepared, better equipped, and better
    rested. Many teachers were teaching minority children for the first time and were
    as bewildered by their new charges as their white students. Carlos’s teacher,
    seeing how badly he'
  merge: -1
  pgno: 5
- img_proc: true
  md: 'was being teased and not wanting to put him on the spot, no longer called on
    him, inadvertently isolating him further. Other teachers did not want minority
    children in their classroom. If they did nothing to encourage the white children’s
    merciless taunting, neither did they do anything to stop it.


    In a traditional classroom structure, children are in constant competition for
    their teacher''s approval. This inherent conflict—in the success of one child
    threatens the success of another—can foster a toxic environment, and integration
    exacerbated this issue. Many of the white children had been at their school for
    years. They saw minority children as invaders, and inferior ones at that. The
    minority children understandably felt threatened by their hostility.


    Aronson convinced Carlos to try something new. Instead of the teacher holding
    court over the class, asking questions, singling out students and neglecting others,
    Aronson suggested transferring a small portion of knowledge, and its associated
    power, to each student.


    Carlos’s class was studying the journalist Joseph Pulitzer. Aronson broke the
    class into groups of six. Each member of Carlos’s group had to learn about one
    stage of Pulitzer’s life, and at the end of the exercise, the children were tested
    on his whole life. Carlos was in charge of Pulitzer’s middle years. When it was
    time to say what he had learned, he stammered as usual, and assistant remarked,
    "You can say things like that if you want to, but it’s not going to help you learn
    about Pulitzer’s middle years, and you’ll have an example on Pulitzer’s life in
    about twenty minutes."


    The children quickly realized that they weren’t competing against Carlos, they
    needed him. Making Carlos nervous made harder for him to explain what he’d learned,
    so they became sympathetic interviewers, carefully drawing out what he knew. After
    several weeks of working like this on various projects, Carlos became more comfortable
    around the other children, and they grew friendlier.


    Aronson had introduced what’s known as the “igsaw” method, in which each child
    in a group has a piece of knowledge to contribute to a coherent lesson.¹ Working
    this was just for a few hours each week had powerful effects. After only six weeks,
    Aronson found that both the white and minority children liked the members of their
    jigsaw group, regardless'
  merge: -1
  pgno: 6
- img_proc: true
  md: 'of their race, more than they liked the other children in their classrooms.
    They liked school better, and their self-esteem improved. Jigsaw children empathized
    with others more easily and academically outperformed children in competitive
    classrooms. Minority children showed the biggest improvements of all. Cooperative
    learning methods were repeated with similar results, time after time, in hundreds
    of different studies and in thousands of classrooms around the United States.2,
    3, 4, 5


    # SURVIVAL OF THE FITTEST


    Cooperation is the key to our survival as a species because “it increases our
    evolutionary fitness. But somewhere along the way, “fitness” became synonymous
    with physical fitness. In the wild, the logics goes became the bigger you are,
    and the more willing you are to fight, the less others will mess with you and
    the more successful you will become. You can monopolize the best food, find the
    most attractive mates, and have the most babies. Arguably, no folk theory of human
    nature has done more harm—or is more mistaken—than the “survival of the fittest.”
    Over the past century and a half, it has been the basis for social movements,
    corporate restructuring, and extreme views of the free market. It has been used
    to argue for the abolition of government, and to judge groups of people as inferior,
    and to justify the cruelty that results. But to Darwin and modern biologists,
    “survival of the fittest” refers to something very specific—the ability to survive
    and leave behind viable offspring. It is not meant to go beyond.


    The idea that the strong and ruthless will survive while the weak perish became
    in the collective consciousness around the publication of the fifth edition of
    Charles Darwin’s Origin of Species in 1869, in which he wrote as a proxy for the
    term “natural selection,” “Survival of the Fittest is more accurate, and is sometimes
    equally convenient.


    Darwin was constantly impressed with the kindness and cooperation observed in
    nature, and he wrote that “those communities, which included the greatest number
    of the sympathetic members, would flourish and rear the greatest number of offspring.”6
    He and many of the biologists who followed him have documented that the ideal
    way to win at the evolutionary game is to maximize friendliness so that cooperation
    flourishes.7, 8, 9'
  merge: -1
  pgno: 7
- img_proc: true
  md: 'The idea of “survival of the fittest” as it exists in the popular imagination
    can make for a terrible survival strategy. Research shows that being the biggest,
    strongest, and meanest animal can set you up for a lifetime of stress.10 Social
    stress saps your body’s energy budget, leaving a weakened immune system and fewer
    offspring.11 Aggression is also costly because fighting increases the chance that
    you will be hurt or even killed.12 This kind of fitness can lead to alpha status,
    but it can also make your life “nasty, brutish and short.”—14, 15, 16 Friendliness,
    roughly defined as some kind of intentional or unintentional cooperation, or positive
    behavior toward others, is so common in nature because it is so powerful. In people,
    it can be as simple as approaching someone and wanting to socially interact or
    be as complicated as reading someone’s mind in order to cooperatively accomplish
    a mutual goal.8


    It is an ancient strategy. Millions of years ago, mitochondria were free-floating
    bacteria until they entered larger cells. Mitochondria and the larger cells joined
    forces and became the batteries that power cell function in animal bodies.17 Your
    microbiome, which, among other things, allows your body to digest food, make vitamins,
    and develop organs, is the result of similar, mutually beneficial partnerships
    between microbes and your body.18 Flowers appeared later with pollinating insects
    made them so successful that they dominate the landscape.19 Ants, estimated to
    have the same mass as a fifth of all the terrestrial animals on earth combined,
    can form superorganisms of up to 50 million individuals that function as a single
    social unit.20


    Each year I*2 challenge my students to use evolutionary theory to solve the world’s
    problems. In this book, we gave ourselves the same challenge. This is a book about
    friendliness and how it came to be an advantageous evolutionary strategy. It is
    a book about understanding animals—and here dogs play the starring role—because
    in doing so, we can better understand ourselves. It is also an exploration of
    our friendliness: the flip side of our capacity to be cruel to those who aren’t
    friends. If we can develop an understanding of how this dual nature evolved, we
    can find powerful new'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'ways to address the social and political polarization that endangers liberal
    democracies around the world.


    # THE FRIENDLIEST HUMAN


    We tend to think of evolution as a creation story. Something that happened once,
    long ago, and continued in a linear fashion. But evolution is not a neat line
    of life forms progressing toward the “perfection” of Homo sapiens. Many species
    have been more successful than we are. They have lived for millions of years longer
    than we have and spawned dozens of other species still alive.


    The evolution of our own lineage, since we split from our common ancestor around
    6 to 9 million years ago, produced dozens of different species within our genus,
    Homo. There is fossil and DNA evidence that for most of the approximately 200,000
    to 300,000 years that Homo sapiens has existed, we shared the planet with at least
    four other human species.¹ Some of these humans had brains that were as big, or
    bigger, our own. If brain size was the main requirement for success, these other
    humans should have been able to survive and flourish as we did. Instead, their
    populations were relatively sparse, their technology—though improved compared
    to that of nonhumans—remaining limited, and at some point, all of them went extinct.


    Even if we had been the only humans with big brains, we would still have to explain
    the gap of at least 150,000 years between our appearance in the fossil record
    and the explosion in our population and culture. Though the physical features
    that distinguished us from other humans marked us early in our evolution, we were
    still culturally immature for at least 100,000 years after we appeared in Africa.
    There were tantalizing glimpses of the technology we would become famous for:
    blades carefully worked to symmetrical points, objects painted with red pigment,
    bone and shell pendants. For thousands of years, these innovations flickered but
    did not hold hold.²²³⁴


    If, a hundred thousand years ago, you were setting the odds for which human species
    would be the last standing, we would not have been a clear winner. A more likely
    contender would have been Homo erectus, who left Africa as early as 1.8 million
    years ago to become the most widespread'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'species earth. Homo erectus were explorers, survivors, and warriors. They colonized
    most of the planet, and somewhere along the way they learned to control fire,
    which they used for warmth, protection, and cooking.


    Homo erectus were the first humans to skillfully use advanced stone tools, including
    the Acheulean hand made from raw materials like quartz, granite, and basalt.25,
    26 The type of rock dictated its sculpting method—chipping or flaking—and the
    results were tear-shaped, razor-sharp tools beautifully crafted that people found
    them thousands of years later, they thought the stones were supernatural powers.
    Homo erectus saw the rise and fall of many other human species, and they existed
    longer than any other humans, including us.


    At one hundred years ago, we were still using the same hand as Homo erectus invented
    a million and a half years before we emerged. Genetic evidence suggests that our
    population might have diminished to a point near extinction.27, 28, 29 Homo erectus
    probably thought we were just another short-lived novelty of the Pleistocene.


    Fast-forward to 75,000 years ago. Homo erectus were still around, but their technology
    had not advanced much, and you might guess the Neanderthals would succeed instead.
    Neanderthals had brains that were as big or bigger than ours. They were as tall
    as we were, heavier, and most of their weight was muscle. Neanderthals ruled the
    Ice Age. Although technically omnivores, they tended to be carnivorous, which
    means they had to be skillful hunters. Their main weapon was a long, heavy spear
    meant to thrust at close range. Carnivores usually hunt animals smaller than themselves.
    Neanderthals hunted every large herbivore in the Ice Age, mostly red deer, reindeer,
    horses, and bovines, and the occasional mammoth, all of which were considerably
    more powerful than humans.24


    Neanderthals were far from hunting cave. We share with them a variant of the FOXP2
    gene thought to be responsible for the fine motor movements needed for speech.30
    They buried their dead, cared for their skin and injured painted with pigment,
    and adorned themselves with jewelry made of shells, feathers, and bone. One Neanderthal
    man was found buried with almost three thousand pearls decorating his animal hide'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'clothing that had been expertly stretched and stitched together.31 They made
    cave paintings depicting mythical creatures. Towards the end of their time, they
    had many of the same tools we did.24


    When Homo sapiens first met Neanderthals, the Neanderthal population was the largest
    it had ever been. Because they were cold adapted, they replaced us as we fled
    in the face of oncoming glaciers. If 75,000 years ago you were going to put money
    on who would survive the uncertain climate of the future millennia, Neanderthals
    would have been a good bet.


    However, 50,000 years ago, the tide was turning in our favor. While the Acheulan
    axe served every human species for more than a million years, we developed a far
    more complex toolbox. Improving upon the wooden thrusting spears of Neanderthals,
    we developed projectile weapons like the spear throw—a two-foot handle that launched
    six-foot arrow-like shafts. The arrows, usually tipped with sharpened stone or
    bone, were hollowed at one end and set onto the wooden shaft.32 The physics worked
    on the same principle as a Chuckit—the owners'' ball throw. Even if you were very
    strong, you would be able to throw a standard spear only a few feet by hand. The
    stored energy in the shaft of a spear throw could propel the shaft more than 300
    feet at better than 100 miles per hour. Spear throws revolutionized hunting, allowing
    us to graduate beyond human-sized herbivores and hunt prey that flew, swam, and
    climbed trees. We could kill mammoths without the risk of being stomped by their
    feet or speared by their tusks. Spear throws also revolutionized warfare. We could
    launch a spear at a saber-toothed cat or hostile human and cause serious injury
    from a safe distance. We made sharp points for weapons, tools for engraving, blades
    for cutting, and drill bits for piercing. We had bonded harpoons; nets for fishing
    and traps; snares for birds and small mammals. Neanderthals, for all their hunting
    prowess, were never more than mid-ranking Carnivores. With our new technology,
    we became the ultimate predator, largely immune to predation by other species.


    We ventured out of Africa and spread rapidly across Eurasia. We may have reached
    as far as Australia within a few thousand years. The arduous crossing would have
    required planning and packing food for an'
  merge: -1
  pgno: 11
- img_proc: true
  md: 'indefinite journey, taking tools that could repair unforeseen damage and catch
    unfamiliar food, and solving future imagined problems like replenishing drinking
    water at sea. These early sailors had to be able to communicate in detail, leading
    some anthropologists to hypothesize that by this time, we already had full-blown
    language.33


    Most remarkably, these sailors had to infer that there was something beyond the
    horizon. Perhaps they had studied the patterns of migratory birds or seen the
    smoke of natural bushfires in the distance. Even if this was the case, they would
    have had to imagine that there was somewhere to go.


    By 25,000 years ago, the odds were clearly with us. We lived in more permanent
    camps filled with hundreds of people. Camps were organized by function: butchering,
    cooking, sleeping, and dumping garbage. We were well fed and had grinding and
    pounding tools that allowed us to process and treat food that would otherwise
    have been inedible or even toxic. We had fires for cooking, ovens for baking,
    and ways to store food in lean times.34


    Instead of draped or loosely tied fur, we had real clothing possible by fine bone
    needles. Snugly fitting snowsuits meant we were better able to withstand the cold
    without evolving calorie-hungry bodies like the Neanderthals.34 This equipped,
    we could push northward even in freezing glacial periods and eventually head toward
    the Americas—the first humans ever to make the journey.


    But this period of time, known as the Upper Paleolithic, remarkable for more than
    just an upgrade in weapons and living conditions.35 It was around this time that
    we began to leave evidence of unique forms of cognition, especially our expanding
    social networks.36 Jewelry made from shells has been found hundreds of miles inland,
    implying that an object with no practical value was worth carrying some distance
    or was obtained from someone else who had traveled on one of our trade routes.37,38


    We painted animals on rocks skillfully that the contours of the stone rippled
    beneath their bodies and gave them a third dimension. In what can be regarded
    as the creation of protocamina, a cave wall bears the illustration'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'of a bison with eight legs that would have seemed gallop in firelight. We even
    seem to have illustrated with sound: horses'' mouths open in a winny, lions depicted
    in midroar, and rhinoceroses butting their heads ferociously enough that you can
    almost hear the clash of their horns. We not only imitated life, we imagined and
    portrayed mythical creatures—a woman with the head of a lion, a man with the body
    of a bison.39, 40


    This was behavioral modernity: We both looked and acted like modern humans. Our
    culture and technology suddenly become far more powerful and sophisticated than
    that of any other human. But how? What happened to us, and why did it happen only
    to us?


    What allowed us to thrive while other humans went extinct was a kind of cognitive
    superpower: a particular type of friendliness called cooperative communication.
    We are experts at working together with other people, even strangers. We can communicate
    with someone we''ve never met about a shared goal and work together to accomplish
    it. As you would expect, chimpanzees are as smart as chimpanzees are, they are
    cognitively sophisticated in many of the ways humans are. But despite our many
    similarities, they struggle to understand when communication is intended to help
    them accomplish a shared goal. This means that as smart as chimpanzees are, they
    have little ability to synchronize their behavior, coordinate different roles,
    pass on their innovations, or even communicate beyond a few rudimentary requests.
    We develop all of these skills before we can walk or talk, and they are the gateway
    to a sophisticated social and cultural world. They allow us to plug our minds
    into the minds of others and inherit the knowledge of generations. They are the
    foundation for all forms of culture and learning, including sophisticated language,
    and it was dense groups of these cultured humans who invented superior technology.
    Homo sapiens were able to flourish because other human species didn''t because
    we excel at a particular kind of collaboration.


    When I began studying animals, I was so focused on social competition that it
    never occurred to me that communication or friendliness could be important for
    cognitive evolution, not just in animals in'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'ourselves. I thought increased skill in manipulation or deception could explain
    the evolutionary fitness of an animal. What I discovered is that being smarter
    is not enough. Our emotions play an oversized role in what we find rewarding,
    painful, attractive, or aversive. Our preferences for solving certain problems
    over others plays as important a role in shaping our cognition as our computing
    abilities. The most sophisticated understanding, memory, or strategy will not
    facilitate innovation unless it is paired with the ability to communicate cooperatively
    with others.


    This friendliness evolved through self-domestication.8 Domestication is not just
    a result of artificial selection by humans choosing which animals to breed. It
    is also the result of natural selection. In this case, the selection pressure
    would be on friendliness—either toward a different species or towards your own.
    This is what we call self-domestication. Self-domestication gave us the friendly
    edge we needed to succeed as other humans went extinct. So far, we have seen this
    in ourselves, in dogs, and in our closest cousins, bonobos. This book is about
    the discovery that linked our three species together and helped us understand
    how we became who we are.


    As humans*3 friendlier, we were able to make the shift from living in small bands
    of ten to fifteen individuals like the Neanderthals to living in larger groups
    of a hundred or more. Even without larger brains, our larger, better-coordinated
    groups easily outcompet other species of humans. Our sensitivity to others allowed
    us to cooperate and communicate in increasingly complex ways that put our cultural
    abilities on a new trajectory. We could innovate and share those innovations more
    rapidly than anyone else. Other humans did not stand a chance.


    But our friendliness has a dark side. When we feel the group we love is threatened
    by a different social group, we are capable of unplugging the threatening group
    from our mental network—which allows us to dehumanize them. Where empathy and
    compassion would have been, there is nothing. Incable of empathizing with outsiders,
    we can''t see them as fellow humans and become capable of the worst forms of cruelty.
    We are both the most tolerant and the most merciless species on the planet.8'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Dehumanizing rhetoric flourishes in the current United States Congress, which
    is more polarized now than it has been since the Civil War.41 The former Republican
    representative Jim Leach, of Iowa, claimed that “In the Republican cloakroom,
    truly bizarre things are said about the Democrats.”42 The former Democratic senator
    Tom Daschle of South Dakota said that “these causes have become pep rallies...and
    it becomes a ‘we,’ ‘they,’ ‘kill-em’ attitude.”43 Social media has made this brand
    of animosity public. When Donald Trump, Jr., was quoted as saying “A border wall
    is like a zoo fence protecting you from the animals,” the Democraticwoman Ilhan
    Omar of Minnesota retorted, “The higher the climbs, the more you see of its behind.”


    In the recent past, Washington was a friendlier place. President Reagan used to
    invite both Democrats and Republicans to the White House for drinks, “just to
    tell jokes.”43 Democrats and Republicans used to carpool from their hometowns
    to D.C., driving all night and taking turns at the wheel.\We’d argue like hell
    on the floor of the House of Representatives,” said Dan Rosstenkowski, a Democratic
    congressman from Illinois, “But we were playing golf night.”43 When Reagan called
    Speaker of the House Tip O’Neill after a particularly heated exchange, Tip said,
    “Old buddy, that politics—after six o’clock we can be friends.”44


    That kind of Congress gets things done. More bills were introduced and passed
    then than today. More people voted across the aisle. In 1967, Republicans and
    Democrats passed the Civil Rights Act, the most important social legislation in
    a century. Democrats worked with Republicans to pass Reagan’s tax plan, the most
    significant tax reform in modern history.


    Then, in 1995, a young Republican congressman from Georgia by the name of New
    Gingrich came with a plan to loosen the hold Democrats had on Congress for more
    than forty years. His theory was that as long as a Congress was working, people
    would not want to change the party in control of it. In his words, “You have to
    blow down the old order to establish a new order.”45'
