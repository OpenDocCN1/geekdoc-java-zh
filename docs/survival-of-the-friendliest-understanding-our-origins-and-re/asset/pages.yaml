    We suspected this pattern of development was unique to humans. We had not seen
    these same communicative skills in other great apes, but without a direct comparison
    of development between human and great ape infants, we could not know for sure.
    So we worked with bonobo, chimpanzee, and human infants, starting from the age
    of two. We tested almost a hundred infants from the three species on almost two
    dozen cognitive measures every year for three, to see how their cognition developed.
    We measured every type of cognition that made sense for their age: counting, causality,
    tool use, self-control, emotional reactivity, imitation, gestures following, and
    about a dozen more. It was the first time anyone had directly compared many infants
    from all three species across many different abilities. And we found that two-year-old
    human babies were unremarkable when it came to nonsocial tasks, like counting
    and understanding the physical world. They looked just like bonobos and chimpanzees
    of the same age.


    The difference appeared when we looked at how human babies solved social problems.
    At two years old, human babies, with their completely underdeveloped brains, showed
    more social skill than nonhuman apes with more mature brains. By four, human babies
    outperformed the other ape babies on every task. The same toddlers can''t put
    their drinks down without spilling them, or make it to the toilet in time, have
    a theory about how other minds work.³²


    These early-emerging social skills give us an edge, allowing those of us with
    underdeveloped brains to use others to solve sophisticated problems. Our ability
    to understand others at a young age also allows us to inherit knowledge acquired
    over generations, giving us a unique survival advantage.


    # BABY BALLOONS'
