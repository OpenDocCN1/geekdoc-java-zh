- img_proc: true
  md: 'highly prized meat and honey.30 Apes sometimes share food while they are foraging,
    but only humans bring food home.


    In hunter-gatherer communities, food is distributed relatively equally.^40 The
    families of the most productive foragers do not get the lion''s share of food.
    They share, and in return, they make friends who will take care of them if they
    are hungry, injured, or sick. With no crops, refrigerators, banks, or governments,
    these social bonds are their only insurance.^30


    The most productive Hadza hunters have already eaten to meet their daily calorie
    needs before they return to camp with food.^41 Sharing their surplus is mutually
    beneficial, they feed others while reinforcing bonds that will buffer them against
    shortfall.^42 The prospect of sharing also motivates cooperation, since it means
    more food for everyone. Over hundreds of generations, these strongly bonded groups
    have developed a competitive advantage over less cooperative, more despotic humans
    with less reliable social insurance.


    This insurance alters the calculus of social relationships. While chimpanzee cooperation
    is constrained by fear and despotism, hunter-gatherer cooperation rewards everyone.
    Unlike chimpanzee males working to dominate one another, hunter-gatherers use
    aggression to prevent individuals from dominating the group. When aggression within
    human groups is used to prevent power grabs rather than assert dominance,30, 43
    sharing, tolerance, and cooperation increase exponentially.


    This new social formula meant that the benefit of new social partners was often
    greater than the cost. This includes new social partners from outside the group.
    A similar calculation explains why bonobos are attracted to strangers. Without
    the risk of lethal aggression from neighboring males, female bonobos can interact
    with neighbors and expand their social networks.


    Selection for friendliness occurred in us, but the difference is that we did not
    become more tolerant overall, like bonobos. We expanded our definition of who
    we considered a group member. Chimzees and bonobos recognize strangers based on
    familiarity. Someone who lives with them, inside their territory, is a group member.
    Everyone else is a stranger.'
  merge: -1
  pgno: 90
- img_proc: true
  md: 'Chimpanzees may hear or see their neighbors, but the interaction is almost
    always brief and hostile. Bonobos are much friendlier with the unfamiliar.


    We, too, respond to those we are familiar and unfamiliar in different ways, unlike
    any other animal, we also have the ability to instantly recognize whether a stranger
    belongs to our group. Human group members are not defined geographically but have
    a broader kind of identity, unlike bonobos or chimpanzees.


    A new social category evolved for humans—the intrag stranger. We can recognize
    people we have never met as belonging to our group. Someone who wears the same
    sports jersey, fraternity tie, or religious symbol on a necklace. Each day, without
    thinking about it, we adorn ourselves in ways that make us identifiable to the
    other members. We are prepared to care for, bond with, and sacrifice ourselves
    for intragroup strangers.


    This capacity dominates our modern lives. We are surrounded by people we do not
    know, and yet we not just tolerant of these strangers, we actively help one another.
    This friendliness encourages us to perform acts of kindness both great, like donating
    an organ, or small, like helping someone cross the street.


    People do prefer to help strangers with whom they share a group identity—especially
    if they know that the stranger is of the bond.⁴⁴ The Tsimane of Bolivia are hunter-gatherers.
    When researchers showed the Tsimane pictures of strangers from their group and
    strangers from other groups, they were willing to share more with the Tsimane
    strangers.⁴⁵ Likewise, people who live in fourteen out of fifteen industrial economies
    shared more with strangers from their own country than with those who did not
    identify themselves with the same nationality.⁴⁶


    We are babies when we begin to recognize intragroup strangers—around the time
    our earliest theory of mind abilities come online. Nine-month-old babies prefer
    puppets who like the food they do, and they prefer people who are nice to these
    puppets.⁴⁷ Seven-month-old babies prefer music introduced by someone in their
    native tongue.⁴⁸ Just as babies begin to pay attention to the communicative intentions
    of others, they also begin to choose where to focus their attention. Even very
    early in life, our'
  merge: -1
  pgno: 91
- img_proc: true
  md: 'thoughts, feelings, and beliefs about the thoughts, feelings, and beliefs of
    strangers are stronger for some strangers than for others. The psychologist Niam
    McLoughlin showed first graders a picture of a doll face morphing into a human
    face. The first graders had to let researchers know when they thought the picture
    “had a mind.” The children were quicker to say an image had a mind when they were
    told the picture was of someone from their town than when they were told that
    the picture was of someone from far away.49,50 Children are also more generous
    towards others who believe their group identity.51 As adults, we are also more
    likely to acknowledge that others have a mind like ours if we believe they are
    from our group.52


    Even though we are essentially attracted to people who share our group identity,
    that constitutes identity is highly influenced by social forces. Even for babies,
    group identity is about more than just familiarity. As we grow, it can be defined
    by almost anything: clothing, food preferences, rituals, physical traits, political
    affiliation, place of origin, or loyalty to sports teams. While we appear biologically
    prepared to recognize group identities, our social awareness allows our construction
    of these identities to be flexible.


    This plasticity is what the anthropologist Joseph Henrich argues is critical to
    the emergence of social norms.53 Norms are the implicit or explicit rules that
    govern even the smallest social interaction. They are central to the success of
    all our institutions, and they must have arisen when humans had domesticated ourselves,
    allowing us to identify and embrace humans beyond our immediate families.


    # GROUPS THAT FEEL LIKE FAMILY


    The molecule largely responsible for the evolution of this new social category
    is probably the neurohormone oxytocin.54 Oxytocin is closely linked to serotonin
    and testosterone availability, two hormones we have inferred were altered as a
    result of human self-domestication. More available serotonin impacts oxytocin,
    since serotonin neurons and the activity of their receptors mediate the effects
    of oxytocin. Basically, serotonin increases the impact of oxytocin.'
