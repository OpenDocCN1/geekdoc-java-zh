  md: 'In order to mark the moment that we domesticated ourselves, we need to identify
    when we developed this unparalleled social intelligence. What makes this possible
    fossilized Homo sapiens skulls that hint at brain development.


    There are two relevant physical markers for our brain development. The first is
    the giant hole we have in our head when we are born. Unlike most mammals who are
    born with fully developed skulls, Homo sapiens and Neanderthal babies'' skull
    bones are unconnected so they can squeeze through the birth canal. Our shape-shifting
    baby skulls and the underdeveloped brains they contain evolved late, but not uniquely
    in our species.³31


    The second morphological signature of development is in the skull''s shape. Unlike
    other humans, who had low, flat foreheads and thick skulls, our infants developed
    balloon-shaped heads to fit their oddly shaped brains.³33


    Other animals shut down brain growth after they are born, but maintain fetal growth
    rates for two years past birth.³34 This rapid postnatal growth particularly affects
    the top and back of our heads, creating its balloon shape.³31 The top and back
    of the brain, the parietal regions, house two central nodes of our brain''s theory
    of mind network—the temporal parietal junction (TPJ) and precuneus (PC) regions.³35
    These are the areas that become active as babies start paying attention to the
    gaze and gestures of others.³6 We can infer from fossilized skulls that these
    early-emerging social skills were unique to Homo sapiens.


    But the type of social cognition that develops early is very specific. Beyond
    cooperative communicative skills, other skills seem to be delayed. It is not until
    four to six years of age that human self-control begins to outstrip that of other
    apes, just in time for them to take the marshmallow test.³37,38 Self-control develops
    so slowly that we do not have full adult levels until our early twenties. This
    may be why, as teenagers, we take more risks—which is why car insurance for a
    sixteen-year-old is more expensive than it is for a twenty-one-year-old. Fortunately,
    teenagers feel failure more deeply, so we are quicker learners.³39'
