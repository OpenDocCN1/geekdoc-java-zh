    In any bonobo group, either in the wild or in captivity, there is never an alpha
    male. As a result, many scientists thought females were in charge.9 No one suspected
    the important role babies play.


    Infant chimpanzees are cautious taking food from anyone, especially big males.
    So considering babies in a chimpanzee group when assessing everyone’s rank is
    not very informative. As we observed the bonobos at Lola, however, their natural
    behavior and interactions suggested something different was going on. To our surprise,
    repeatedly saw adult males running away from food when infants were sitting nearby.
    My Kara Walker and I decided to do systematic observations, but unlike in other
    studies, we also included the baby bonobos in the dominance equation of each group.
    When we did, some of the highest-ranking bonobos were babies who also had their
    mothers in the group. The babies who are raised by their mothers at Lola outrank
    some of the adult males. And even if an adult male is higher-ranking than a baby,
    the male is always very well'
