  md: '# About the Authors


    BRIAN HARE is a core member of the Center of Cognitive Neuroscience and a professor
    in evolutionary anthropology, psychology, and neuroscience at Duke University.
    He received his Ph.D. from Harvard University, founded the Hominoid Psychology
    Research Group while at the Max Planck Institute for Evolutionary Anthropology
    in Germany, and subsequently created the Canine Center when arriving at Duke.
    He has co-authored three books and published over a hundred scientific papers,
    including in Science, Nature, and PNAS. His research on dozens of different animal
    species, including dogs, wolves, bonobos, chimpanzees, has taken him from Siberia
    to the Congo Basin. In 2007, Smithsonian Magazine named Hare one of the world''s
    top 35 scientists under 36. He and his research has been featured on 60 Minutes,
    NOVA, and Nature, as well as the series Is Your Dog a Genius?, which he hosted
    for National Geographic Wild. Most recently, in 2013, he participated in Steven
    Spielberg''s documentary series Why We Hate, which was released worldwide on Discovery
    Channel.


    VANESSA WOODS is a research scientist in evolutionary anthropology at Duke University
    and an award-winning writer and journalist. Woods has written eight nonfiction
    books for both adults and children. In 2010, her book Bonobo Handshake: A Memoir
    of Love and Adventure in Congo won the Thomas Orwell Award for nonfiction, and
    her children''s book It''s True, Space Turns into Spaghetti was named an Acclaimed
    Book by the Royal Society in 2007. Her books have been translated into twelve
    languages. Woods received the Australian Science Award for journalism in 2004.
    Her articles have been published in both national and international media, including
    The Wall Street Journal, National Geographic, and The New York Times.


    Hare and Woods are married and live with their family and dog, Congo, in North
    Carolina. Their first book together, The Genius of Dogs, was a New York Times
    bestseller.'
