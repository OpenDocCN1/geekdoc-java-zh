  md: '# Acknowledgments


    We had a first draft ready around October 2016. That draft ended with a warning
    that the very worst of our nature could resurface and express itself in any place
    or culture. But after the U.S. elections, we threw away half or more of that draft.
    We realized we had to offer solutions. Real solutions required an even deeper
    dive into the scientific literature. We had to become experts in areas of social
    psychology, history, and political science with which we had been unfamiliar.
    We spent two more years researching, restructuring, and rewriting the book so
    that we could not only showcase our species’ unusual friendliness but also offer
    help in thinking about the root causes and solutions of our most vexing problems.


    Disagreement and debate in science are healthy and exciting. Disagreement often
    drives research that leads to advances in our understanding. Scientists rely on
    skepticism and empirical debate as a road to truth. Although we have done our
    best to represent the literature fairly, not every scientist will agree with everything
    we report. Unlike the scientific papers we write, to ensure ease of reading, we
    did not always highlight alternative perspectives or competing data in the main
    text. However, we have provided extensive references and notes that cover important
    details and alternative findings. If you are interested, there are many ways to
    get access to these sources and read them for yourself.


    The book benefited immensely from the efforts of many people who took the time
    to help us along the journey. The biggest thank-you must go to our editor, Hilary
    Redmon, who for five years has been the kindest, most thoughtful editor two writers
    could wish for. If this were an academic publication, she would be listed as a
    co-author. She went above and beyond typical editorial duties to help us dramatically
    improve the organization and'
  merge: -1
  pgno: 175
- img_proc: true
  md: 'writing of this manuscript. We are deeply indebted to her, and it was a joy
    to work together.


    Our agent, Max Brockman, was instrumental in shaping our book proposal we initially
    began brainstorming about what the book might be. His encouragement was critical
    as we decided to take on this project.


    There would be no self-domestication hypothesis without Richard Wrangham and Mike
    Tomaselco. Our collaboration and their own work inspired many of the ideas in
    this book. They tirelessly endured endless discussions so many disparate ideas.
    Our colleague Walter Sinnott-Armstrong was also a fantastic mentor—always ready
    to provide friendly encouragement and helpful arguments along the way.


    Thank you to our many Duke students who have shaped much of our thinking as we
    grappled with the primary literature in seminar classes and lab meetings. In particular,
    we thank graduate students and postdocs Victoria Wobber, Alexandra Rosati, Evan
    MacLean, Jingzhi Tan Kara, Chris Kruypen, Aleah Bowen, Wen Zhou, Margaret Gruen,
    and Hannah Salomons for all the stimulating conversations that in part motivated
    this work. You were extremely patient as you tolerated our split attention while
    we worked on this patient. Aleah and Wen were especially generous in helping us
    as we struggled to understand the vast social psychology literature relevant to
    the best and worst of human nature.


    Thank you to our department staff and lab coordinators Lisa Jones, James Allen,
    James Brooks, Kyle Smith, Maggie Bunzey, Morgan Ferrans, and Madison Moore who
    kept everything going as we were writing. Finally, thanks to Jessica Tan and Rong
    Xiang for creating many of the figures included in the text.


    Our research, reported throughout the book, was supported by federal and foundation
    funds including the Office of National Research (NOOO14-12-1-0095, NOOO14-16-1-2682),
    the Eunice Kennedy Shreve National Institute of Child Health and Human Development
    (NIH-HD07049; NIH-1R01HD09732), the National Science Foundation (NSF-BCS-08-27552),
    the Stanton Foundation, the Canine Health Foundation, and the Templeton World
    Charity Foundation.'
