    Urban architecture can also design certain people out of certain spaces. “Hostile
    architecture” is the term for the sloped windowsills and grated metal on steps
    that keep people from sitting on them, or for the balls on edges and uneven pavements
    meant to deter skateboarders. The most hostile architecture of all is reserved
    for those most vulnerable to dehumanization, homeless people, who have to contend
    with spikes under bridges and the awnings of buildings that might offer shelter,
    armrests between park benches where they might have slept, and sprinklers meant
    to chase them from an otherwise welcoming green space.


    The rest of us are not immune to the effects of this kind of architecture. According
    to the writer Alex Andreou, “By making the city less accepting of the human frame,
    we make it less welcoming to all humans. By making our environment more hostile,
    we become more hostile within it.”⁹⁷


    Cities need to be designed to create conditions similar to those that were so
