  md: 'In the wild, male chimpanzees regularly patrol the border of their territory.
    Before each border patrol, they huddle and put their arms around one another.
    They put their fingers in the others'' mouths and touch the others'' testicles.
    They fall silent and walk single file. Every now and then they listen and sniff
    the ground near the border to see if the enemy has been nearby and how many of
    them there are.^3 If they outnumber the enemy three to one, they are more likely
    to attack. They pin their victims to the ground, bits of their fingers off, and
    even disarticulate limbs. In extreme cases researchers have found corpses with
    torn jugular and missing testicles.^45 If chimpanzee community kills enough males
    from the neighboring territory, they move in, effectively annexing this new territory
    along with any females living within.^6 Richard noted that many human communities,
    from hunter-gatherers to street gangs, conduct border patrols and raids in a similar
    manner, and he found that the homicide rate of chimpanzees and hunter-gatherers
    was similar.^7


    It is not just male chimpanzees who have the potential for violence. Female chimpanzees
    also have strict hierarchies illustrated by where they sit in a fruit tree. The
    high-ranking females sit at the sunny crown and eat the best fruit. Mid-ranking
    females have to do with lower branches. The lowest-ranking females are pushed
    to the outskirts of the group''s territory, leaving them vulnerable to attacks
    by neighboring males. When females reach puberty, they leave their mother''s community
    and try to find mates elsewhere. Immigrating females are often beaten badly by
    female members of a new group that the high-ranking males have to step in to prevent
    them from being seriously injured.^8


    I had not yet seen chimpanzees in the wild, but standing outside the enclosure
    at Yerkes, I knew Travis was in serious trouble. The floor was covered in a dark
    pool of blood. More blooded from a gash in his thigh.


    I grabbed the hose and turned it full blast on Sonia. She screamed at me in fury
    and jumped off Travis, who ran with his mother into another room. The rest of
    the chimpanzees were right behind him. I held them off with the hose and threw
    all my weight against the door, slamming shut.'
