    # Forever Young


    We have seen the link between an increase in friendliness in humans and the accidental
    changes we believe it caused—including our feminized faces, white sclerae, and
    cognitive skills like cooperative communication. We know that an increase in friendliness
    triggers the self-domestication syndrome. But how do these changes actually happen?


    The key is development. Changes in an animal’s patterns of growth can be a powerful
    evolutionary engine.¹, 2 Even a slight adjustment to the rate or timing of development
    can result in a completely different body type. For example, baby salamanders
    have gills, fins, and a tail—just like tadpoles. As they become adults, they lose
    their gills, replace fins with tails, and grow legs that allow them to walk on
    land. One type of salamander, called the axolot, keeps its gills and does not
    grow legs. Even as an adult, it still looks like a big version of a salamander
    that never grew up.¹1


    Development can also affect social behavior. Young cockroaches are extremely social.
    They hang out in groups, groom each other, and as a true sign of affection, eat
    each other''s poop. It is not until they are adults that they become antisocial
    and solitary.


    Baby cockroaches are wingless, with underdeveloped eyes and powerful gut bacteria
    that can digest anything—even wood—just like termites. In fact, termites are their
    closest relatives and are basically baby cockroaches frozen in their super-friendly
    juvenile state. They live in a colony where sterile workers serve a reproductive
    queen, and their ability to cooperate ensures their success.³3'
