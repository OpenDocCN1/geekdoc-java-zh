  md: '47. Politicians who live in Washington are criticized as “carpetbaggers” (C.
    Raasch, “Where do U.S. Senators ‘live,’ and does it matter?,” Saint Louis-Dispatch,
    September 2, 2016) and “out of touch with their constituents (A. Delaney, “Living
    Large of Capital Hill,” Huffington Post, July 31, 2012). But having members of
    Congress living in the same place would build relationships between them. As Ormstein
    said, “if you are standing on the sidelines of a soccer game with a colleague
    from across the aisle and his or spouse, you’re just going to have a harder time
    vilifying than the devil when you get on the floor” (Gibson, “Restoring Community
    to Congress”). Being part of the same community might restore a sense of shared
    experience and common purpose that our representatives have. If contact is not
    possible for our representatives, then at least there be contact between the staffers.
    Few people know that our government is primarily run by idealistic young people
    in their twenties, hoping to make a difference for our democracy. The effectiveness
    of our representatives is linked to the quality of their staff (J. McCain, “Election
    Strategy and Policy Making,” Emery University, 2018). They are the ones who brief
    their representatives with information, talking points, and briefings. When you
    call or visit your representative, a young staffer will answer or meet with you.
    They live in one of the most expensive areas in the United States and are almost
    nothing, as little as $20,000 a year. When I spoke to one of my former students,
    who is a staffer for a U.S. senator, there are very few opportunities for Republican
    and Democratic staffers to find any kind of relationship. He had never been to
    lunch with a staffer from the other party. If the older generation is too entrenched
    in the court polarization, it would not take much to bring these open-minded young
    people together. Many of these young people will be in politics for decades. Through
    friendships, casual acquaintances, they will be able to accomplish what their
    more experienced elders do not. But by giving them a chance, we are looking at
    greater polarization in the future.


