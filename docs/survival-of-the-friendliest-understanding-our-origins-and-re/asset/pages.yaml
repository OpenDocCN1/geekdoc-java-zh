    # EARLY TO GROW, LATE TO FINISH


    Serotonin changes the shape of our skulls. Androgens like testosterone alter our
    faces and hands. Loss of pigmentation in our eyes dramatically enhances our cooperative
    communication. All of these changes point to selection for friendliness late in
    hominin evolution.


    The progress of our development is a big part of what has made us different from
    other, extinct humans.29 Compared to them, and to other primates, we have an unusual
    life trajectory. We are born too early and we take forever to reproduce; but then
    we are able to reproduce faster with a shorter interval between babies, and women
    go through menopause with decades left to live.30 Our cognition also marks us
    as different—both its early expression and the extended development of traits
    related to cooperative communication and tolerance.'
