  md: 'Rachel and her family survived the Congo War of 1996. They were battered but
    hopeful. Because Banyamulenge soldiers helped topple the former dictator and put
    the next president in power, Banyamulenge throughout the country thought they
    might finally be accepted. But the new president quickly turned against them,
