  md: 'Wolves could understand and respond to the social gestures of other wolves,
    but they were too busy running away from humans to pay attention to our gestures.
    Once their fear of us was replaced with attraction, their social skills could
    be used to communicate with us in a new way. Animals who could respond to our
    gestures and voices would be extremely useful as hunting partners and guards.
    They would have valuable also for their warmth and companionship,$^{40,41}$ and,
    slowly, we would have allowed them to move from outside our camps to our firesides.
    We did not domesticate dogs. The friendliest wolves domesticated themselves.$^2$


    These friendly wolves became one of the most successful species on the planet.
    Their descendants now number in the tens of millions and live with us on every
    continent, while the few remaining wild populations, sadly, live under constant
    threat of extinction.


    If self-domestication could happen in dogs without interference from us, then
    what about other animals, especially those who, like early wolves, are encroaching
    upon human habitat today?


    Like protodogs thousands of years ago, urban coyotes scavenge our trash, with
    human garbage making up to 30 percent of their diet.$^{42}$ These urban coyotes
    raise their pups in drainage ditches, under fences, and in pipes. They cross freeways
    with traffic volumes of more than a hundred cars per day, and casually stroll
    over bridges like pedestrians.$^{42}$


    My students James Brooks and I analyzed the data from camera traps all over North
    Carolina.$^{43}$ We predicted that when we coded coyote behavior toward the camera,
    we would see a link between temperament and human population density. Our initial
    results suggest that urban coyotes are more likely to approach camera traps than
    those living in wild areas. It is not just their temperament that makes coyotes
    adaptable. When we compared the self-control of thirty-six different species,
    coyotes were not only better than dogs and wolves, they were the only other animal
    who were as good as great apes.$^{44}$'
