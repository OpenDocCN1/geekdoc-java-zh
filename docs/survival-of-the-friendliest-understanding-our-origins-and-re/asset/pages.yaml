  md: 'Oreo and I had grown up together. He might have learned to follow only my gestures.
    But could other dogs follow my point? I went to a doggy daycare in Atlanta, gathered
    dogs, hid the food under one of two cups, and gestured to the correct cup. Even
    though we had just met, the daycare dogs were just as good as Oreo at following
    my pointing gesture. Using this gesture seemed to be something all pet dogs could.10


    What makes human babies special is that they truly understand what to communicate
    with a pointing gesture, which means any gesture they will do, as long as it''s
    helpful. To demonstrate this with human mothers and babies, Mike asked the baby’s
    mother to put a block on the correct cup. The babies had never seen their mothers
    do this before, but guessing that she was trying to help them, chose the cup she
    put the block on. When I played this same game with dogs, they performed in the
    same way. Like babies, they understood I wanted to help them and would use any
    new gesture they thought was intentionally helpful.11


    Both dogs and babies were more likely to pay attention if you made eye contact
    and used a friendly voice. They could use the direction of your voice. Human babies
    start to recognize vocal direction around their first birthday as they begin to
    understand that words refer to specific objects and actions. This might be why
    some dogs have been so successful at inferring the meaning of new words without
    any trial-and-error training.123


    Even the chimpanzees who were able to learn to follow pointing gestures after
    dozens of trials could not generalize this skill when using a novel gesture—marking
    with a wooden block, for example, to indicate where the food was hidden. If we
    played a game of fetch with chimpanzees and extended an arm, pointing at a toy
    we wanted to pick up, chimpanzees would bring back a toy, but not necessarily
    the one we pointed at.14 They seemed to know only that pointing meant “Go pick
    something up and bring it to me.” Instead of making eye contact with humans, as
    dogs do,'
