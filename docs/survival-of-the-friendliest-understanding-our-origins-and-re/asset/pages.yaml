  md: 'This progression is a manifestation of synaptic pruning. When our brains are
    growing, we make more neurons than we need. As we navigate our lives, solving
    problems and adapting to different environments, we use certain networks of neurons
    more than others. These commonly used networks become more numerous and better
    able to compute information; then they streamline their connections and become
    more efficient. By the time we are adults, our brain networks are stripped down
    and specialized. We lose plasticity, or our cognition becomes better at solving
    the problems we are most likely to face.³39


    Other animals are born with brains that develop quickly in closed skulls. Baby
    wildebeest find their feet within minutes and can keep up with the herd within
    days. Even baby chimpanzees are and about long before we are.


    As we are born, the poet William Blake wrote, "helpless, naked, piping loud,"
    and we stay that for years. But because of our early-emerging social cognition,
    we can plug into other minds. We can read the intentions, beliefs, and emotions
    of others in a way that allows us to harness the efforts and love of our caregivers
    who keep us safe while our brains continue to form and flourish.


    When we''re babies, our minds have the power to read the intentions, beliefs,
    and emotions of others, and we use this power to compensate for our physical helplessness—our
    weak muscles and unformed skulls—as our brains slowly catch up, growing, then
    pruning, so that when we are finished in our early twenties, they have become
    supercomputers, uniquely designed to learn and innovate in the cultural environment
    into which we are born.


    # THE FRIENDS YOU HAVEN''T MET


    We have seen dogs and foxes selected to become friendlier toward people and bonobos
    male who were selected to be friendlier toward females. What type of friendliness
    drove human self-domestication?


    Each day, hunter-gatherers like the Hadza in Tanzania search for food and return
    to camp to cook, eat, socialize, and sleep. Women share the tubers they have dug
    up and the fruits they have gathered. Men return with'
  merge: -1
