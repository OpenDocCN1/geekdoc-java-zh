  md: 'In human babies, this is the spark that suddenly ignites, always early, always
    around the same age, and always before we can speak or use simple tools.^3 The
    simple gesture of extending an arm and index finger that we start to use at nine
    months old, or our ability to follow along when our mothers point to a lost toy,
    or a bird flying overhead, is something chimpanzees do not do and do not understand.^2


    This star of cooperative communication, missing from the constellation of abilities
    that comprise chimpanzee theory of mind, is the first to appear in humans.^5,6
    shows up before we speak our first words or learn our names; before we understand
    that others can feel sad even when we are happy, and the other way around; before
    we can do something bad and lie about it, or understand that we might love someone
    and they might not love us.


    This ability allows us to communicate with the minds of others. Is the door into
    a new social and cultural world where we inherit the knowledge of generations.
    Everything we are as Homo sapiens begins with this star. And many powerful phenomena,
    it begins in an ordinary way, with a baby understanding the intentions behind
    her parents'' gestures.


    If understanding these cooperative intentions is fundamental to the development
    of every human, figuring out how that ability evolved could help solve a major
    part of the puzzle of human evolution.


    As Mike and I were discussing this one day, I blurt, "I think my dog can do that"


    “Sure.” Mike leaned back in his chair, amused. “Everybody’s dog can do calculus."


    It was reasonable for Mike to be skeptical. It was hard to be impressed with animals
    who drank out of the toilet and tangled their leashes around lampposts. Psychologists
    did not think dogs were interesting, so there was almost no research on their
    cognition. From 1950 to 1998, there were only two experiments on dog intelligence,
    and both found that the dogs were unremarkable. “Strangely enough,” wrote one
    of the authors, “domestication does not seem to have produced anything in dog'
  merge: -1
  pgno: 21
- img_proc: true
  md: 'behavior.”⁷ Everyone’s attention was on primates. It made sense to study our
    primate relatives, who looked more like us and whose minds were presumably more
    like ours too.


    Because people tended to assume that domestication made animals unintelligent,
    researchers looking for cognitive flexibility in nonhuman animals thought it best
    to look in the wild, where their survival depended on solving problems. How cognitively
    flexible could you be if you never had to think for yourself—if your food, shelter,
    and reproduction were all taken care of? But I knew my Oreo.


    “No, really, I bet he could pass the gesture tests.”


    “Okay,” said Mike, humoring me. “Why don’t you pilot an experiment?”


    # GOOD DOG


    Oreo’s special talent was that he could hold three tennis balls in his mouth.
    When we played fetch, I often threw two or three balls in different directions.
    After Oreo fetched one, he would look at me to see where I had thrown the second
    ball. I would point to it, and after he got that ball, he would look back at me
    again, and I would point to ball number three.'
