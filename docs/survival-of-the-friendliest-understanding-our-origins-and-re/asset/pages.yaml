    It was a clear demonstration of how costly aggression can be. It can lead to serious
    injury or death, but it can severely limit your number of social partners. The
    risks associated with aggression pay only when they result in more or higher-quality
    offspring. Any slight tweak to this cost-benefit ratio, and friendliness quickly
    becomes more advantageous than aggression.


    Lola ya Bonobo is a hidden forest just outside the Democratic Republic of Congo’s
