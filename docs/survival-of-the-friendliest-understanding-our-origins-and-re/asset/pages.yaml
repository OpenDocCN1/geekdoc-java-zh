    Domestication has often been defined by physical appearances. Body size is a variable
    trait—in dogs, this leads to dwarf breeds like Chihuahuas and giant breeds like
    Great Danes. Dogs tend to have smaller heads, shorter'
  merge: -1
  pgno: 33
- img_proc: true
  md: 'snouts, and smaller canine teeth than their wild cousins. Their hair changes
    color so that they lose their natural camouflage. They can be covered in random
    blotches of color, sometimes with a star mutation on the forehead. Their tails
    curl upward, sometimes in a full circle like huskies'' and sometimes in several
    loops, as in the tails of domesticated pigs. Dogs often have floppy ears. Instead
    of having breeding season, they can breed throughout the year. This collection
    of traits is not unique to dogs; an assortment of these traits pops up in each
    domesticated species.4


    Nobody knew what connected these seemingly random traits, or whether they were
    connected at all. Some thought people bred for these changes deliberately. The
    biologist Eitan Tchernov thought smaller animals would have been easier to handle
    and would have required less food.5 The geneticist Lee Andersson said that farmers
    bred animals with splotchy coats to make them easier to spot when they wandered
    off.6 The zoologist Helmut Hemmer said domesticated animals had weaker visual
    and sensory systems that lowered exploratory behavior, stress, and fear responses.7
    The benefits of having smaller teeth and being more fertile are obvious. But everyone
    tended to look at each trait associated with domestication individually, and many
    considered them deleterious. Most scientists had a low opinion of domesticated
    animals'' intelligence, for example. As Jared Diamond wrote, brains got smaller
    in domesticated animals because brains were a “waste of energy in the barnyard.”8
    Everyone tends to agree that we deliberately chose to breed “animals more useful
    to humans than other individuals of the same species.”9


    Of the world''s 147 large mammals (average weight over 100 pounds) with the potential
    to be domesticated, only fourteen were domesticated, and we relied on only five
    of them for any length of time: sheep, goats, cows, pigs, and horses. Smaller
    animals were also domesticated—wolves were one of these—but they were still relatively
    few.


    Researchers proposed a set of conditions that would predispose animals to domestication.
    Diamond proposed that they had to be able to eat easily supplied by people, grow
    quickly, breed easily and give birth frequently in captivity, have a friendly
    disposition, predisposed to dominance hierarchies, and remain calm in enclosures
    or faced with'
  merge: -1
  pgno: 34
- img_proc: true
  md: 'predators.$^8 Diamond insisted that to qualify for domestication, an animal
    had to meet all criteria. Other researchers added that suitable animals should
    be polygamous, readily controlled within a small home range, and that females
    should be able to live in large groups with males.


    According to what became the dominant theory, domestication has always been a
    humcentric process by which animals come under our control and become economically
    useful. This theory explained, from a cultural and economic perspective if not
    a biological one, why particular animals had been domesticated and why some societies
    developed agriculture while others remained hunter-gatherers. But it had one big
    problem—clearly. Dogs are domesticated, but their wild relatives, wolves, do not
    fit the essential criteria. Wolf food is difficult for people to supply. Wolves
    definitely panic in enclosures, and while they are not normally aggressive toward
    humans, they bite when threatened.


    Belyaev thought domestication relied on just one criterion, and his theory promised
    to provide an answer to the question that had eluded everyone from Darwin to Diamond.


    The friendly foxes were beautiful and strange. They had the grace of cats, but
    they barked like dogs. Some had black and white patches and blue eyes, like border
    collies. Some were spotted, like Dalmatians. Others were red, white, and black,
    like beagles. As Lyudmila led me around the one, all of them stood up and ran
    toward me, wagging their tails, whimpering and barking in excitement.'
