    # UNDER THE HOOD OF DEVELOPMENT


    How exactly do genes for development evolve to cause the self-domestication syndrome?
    Some genes have a much bigger role in determining how an organism develops than
    other genes. These genes can control hundreds of other genes end up doing their
    jobs.


    This is not what I was taught in high school genetics. I learned about Mendel''s
    pea plants, with their dominant and recessive genes, dominant traits being those
    most usually expressed. Mendel found that different traits are inherited separately
    and do not depend on each other. Each gene has a different job, like controlling
    the color or shape of the pea flowers.'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'independence creates the opportunity for diversity in form and function, since
    pea plants can produce different color or shape combinations. Selection then acts
    on this variation.


    But decades of research have shown that development makes this picture more complicated.
    Mendel''s genes reveal just one of the simplest ways heritable variation is created.
    While different genes can have different jobs, one gene or a set of genes, can
    have multiple jobs. For example, a gene can be involved in both bone growth and
    pigmentation. These multitasking genes may do two jobs simultaneously or at different
    times during your life.


    There is another class of genes that are like librarians. Genes are like books
    filled with instructions on how to make different proteins. These proteins are
    the building blocks of every fluid and tissue in our bodies—including our brains.
    Librarian genes in each cell of our bodies make recommendations about which books
    should be read and how often, and some librarian genes have control over large
    parts of our genetic library. Librarian genes can have a big impact, since they
    control not only which protein is made, but the rate and time at which it is made.


    A tiny change to one of these multitasking or librarian genes can have huge impact
    on many traits at the same time. This is especially true for multitasking and
    librarian genes that help control development. The earlier they kick in and the
    longer they act, the more they will amplify genetic change. This is how small
    genetic changes that help control development can alter an animal so dramatically
    that it becomes a different animal entirely, just as we saw in termites, axolotl,
    and wrasse.2, 22 A similar explanation has been proposed for the changes we see
    in dogs, bonobos, and even our own species.


    # THE NEURAL CREST


    The discovery that traits can emerge as by-products of friendliness is one of
    the most remarkable of the last century. Belyaev and his team selected the foxes
    only to be friendlier toward humans, discounting any other cognitive, physiological,
    or morphological characteristic. Yet selecting foxes for friendly behavior led
    foxes with a higher frequency of, curlier tails; piebald, multicolored coats;
    shorter snouts with smaller teeth; floppy'
