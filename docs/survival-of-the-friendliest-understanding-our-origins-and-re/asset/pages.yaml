  md: 'One of Newt Gingich''s many tactics as Speaker of the House in the late nineties
    was to institute policies explicitly designed to make friendships between Republicans
    and Democrats difficult, if not impossible. He started by simply changing the
    Washington workweek from five to three days so representatives would spend the
    majority of time in their home districts, connecting with constituents and fundraising.
    This hindered cross-group friendships, since fewer congresspeople moved their
    families to Washington.46 The political scientist Norman Ornstein wrote, “It used
    to be all the time that members were around on the weekends and they’d have dinner
    parties or they’d wind up with their kids at the same schools...We just didn''t
    have to do that anymore.”42,47


    On Capitol Hill, Gingrich forbade Republican cooperation with the Democrats, either
    in committees or on the floor of the House. When Republicans spoke about a Democrat
    or the Democratic Party, they were advised to use dehumanizing language that elicited
    disgust, to characterize the opposition with words such as “decay” and “sick.”48
    Gingrich frequently compared the Democrats to the Nazis.49 When he led the Republicans
    into this new and hostile territory, many Democrats eagerly followed suit. There
    were no more deals worked out closed doors, no bipartisan meetings or caucuses.
    Eventually the norms Gingrich introduced to the House took the Senate’s culture
    as well.50


    As former senator Joe Biden of Delaware spoke of his relationship with the late
    John McCain of Arizona, “John and I used to debate in the nineties. We’d go over
    and sit with each other, literally next to each other on either the Democratic
    or Republican side of the floor...we...were chastised by the leadership of both
    our caucuses—why were we talking with each other and sitting with each other showing
    friendship in the middle of debates...after the Gingrich Revolution in the nineties.
    They didn''t want us sitting together, that’s when things began to change.”51


    As com dissolved on the hill, tools that allowed negotiation and compromise were
    vilified. Pork barrel projects—projects funded by the federal government that
    benefit a relatively small number of people—fell out of fashion. Pork barrel projects
    might seem like a wasteful practice, but they are a tiny portion of the federal
    budget and have generally been crucial in pushing vital legislation. The political
    scientist Sean Kelly found'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'the 2010 ban on pork barrel spending locked up the gears that make Congress
    turn.52 After the ban was in place, nearly one hundred fewer laws were passed
    each year. Policy makers were less likely to succeed when they had no carrots
    to motivate compromise. Like students in a competitive classroom, members of different
    parties saw how they no longer depended on one another, and they refused to cooperate.


    Political rivals in a liberal democracy cannot afford to be enemies.53 Socializing
    with your rivals humanizes them. Cooperation, negotiation, and trust—currently
    in short supply in Washington—become possible.


    The self-domestication hypothesis is not just another creation story. It is a
    powerful tool that can help us short-circuit our tendency to dehumanize others.
    It is a warning and a reminder that in order to survive and thrive, we need to
    expand our definition of who belongs.


