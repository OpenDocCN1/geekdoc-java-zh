    After World War II, researchers found that contact was the only thing that reliably
    reduced intergroup conflict. The best way to defuse conflict was to diminish the
    perceived sense of threat between groups. If groups could come together in low-anxiety
    situations, they discovered, these strangers would have the chance to empathize
    with one another. Reducing this anxiety was one of the central factors in reducing
    intergroup conflict. If feeling threatened turns off our theory of mind network,
    engaging in nonthreatening contact to switch back on.


    Most policies are enacted with the assumption that a change in attitude will lead
