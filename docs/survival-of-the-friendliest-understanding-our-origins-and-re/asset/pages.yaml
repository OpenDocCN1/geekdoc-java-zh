    More egalitarian hunter-gatherers most likely accepted dogs into their families,
    as did the Martu Aboriginals. It was during agriculture and industrialization
    that dogs likely went from family members to workers to status symbols that reinforced
    social hierarchy. As liberal democracies and economic prosperity spread, our dogs
    rapidly returned to their place in our families. Our egalitarian attitudes towards
    one another are reflected in how we view and treat our nonhuman friends.


    Our views on the treatment of dogs might also reflect what we view as acceptable
