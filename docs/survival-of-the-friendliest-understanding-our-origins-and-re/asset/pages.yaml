  md: 'Oreo, failing to find a ball when he swam to my left, looked at me. pointed
    to the right. He swam to the right. No ball. Then I called him in, took the ball
    out of his mouth, and threw it again, and repeated the pointing game ten times,
    so that Mike would see Oreo’s responses were not due to chance.


    Mike watched the footage silently. Then he rewound it and watched it again.


    I waited, nervously.


    “Wow.”


    His eyes were bright with excitement.


    “Let’s really do some experiments.”


    The same behavior from two different individuals can be produced by two very different
    minds that understand the world differently. To attribute complex cognition you
    must follow the principle of parsimony:⁸ You cannot infer complexity until all
    plausible simpler explanations have been ruled out. Experiments give us a way
    to do this.


    Mike taught me when we are probing the mind of someone who cannot talk, simple
    is best. Experiments are just a way of asking questions. If the question is easy
    to understand, it is likely the answer will be to. I called it “duct tape science”—if
    your equipment broke and could not be fixed with duct tape, your experiment was
    too complicated.


    Even with just two cups, a table, and some duct tape, however, the experiments
    with the chimpanzees had taken months. Suiting up, waiting, food preparation,
    equipment checks, driving to see them, filling out forms, more waiting.


    With Oreo, I took two cups and put them upside down on the ground few feet apart.


    “Sit.”'
