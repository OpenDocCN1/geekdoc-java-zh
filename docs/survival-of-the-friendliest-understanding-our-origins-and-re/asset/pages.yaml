  md: '# # Notes


    # ## Introduction


    +   1. Elliot Aronson, Shelley Patnoe, *Cooperation in the Classroom: The Jigsaw
    Method* (London: Pinter & Martin, 2011).


    +   2. D. W. Johnson, G. Maruyama, R. Johnson, D. Nelson, L. Skon, “Effects of
    Cooperative, Competitive, and Individualistic Goal Structures on Achievement:
    A Meta-Analysis,” *Psychological Bulletin* 89, 47 (1981).


    +   3. D. W. Johnson, R. T. Johnson, “An Educational Psychology Success Story:
    Social Interdependence Theory and Cooperative Learning,” *Educational Researcher*
    38, 365–79 (2009).


    +   4. M. J. Ryzin, “Effects of Cooperative Learning on Peer Relations, Empathy,
    and Bullying in Middle School,” *Aggressive Behavior* (2019).


    +   5. C. J. Roses, Y.-k. Lee, W. A. Saltarelli, “Reconsidering Social Psychology:
    Longitudinal Effects on Social Interdependence, Sociative Conflict Resolution,
    Motivation, and Achievement,” *Journal of Educational Psychology* 111, 149 (2019).


    +   6. Charles Darwin, *Descent of Man, and Selection in Relation to Sex*, new
    edition, revised and augmented (Princeton, New Jersey: Princeton University Press
    1981; Photocopy of original London: Murray Publishing 1871).


    +   7. Brian Hare, “Survival of the Friendliest: *Homo sapiens* evolved via Selection
    for Prosociality,” *Annual Review of Psychology* 66, 155–86 (2016).


    Domestication over the generations does not, as once thought, increase intelligence;
    it increases friendliness. When a species of animal is domesticated, it undergoes
    many changes that appear completely unrelated to one another. This pattern of
    changes—called the domestication syndrome—can show up in the shape of the face,
    the size of the teeth, and the pigmentation of body parts or hair, and it can
    change hormones, reproductive cycles, and the nervous system. What we discovered
    in our research is that it can increase a species'' ability to coordinate and
    communicate with others.


    All seemingly random changes are tied to development. The brains and bodies of
    domesticated species develop differently than those of the less friendly species
    from which they evolved. The behaviors that facilitate social bonding, such as
    play, appear earlier and are retained longer—often through adulthood—in domesticated
    species than are not in closely related species.


    Studying domestication in other species has allowed us to understand how our cognitive
    superpower probably evolved.'
