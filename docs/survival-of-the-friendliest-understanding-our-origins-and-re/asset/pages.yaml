  md: 'Red foxes in the United Kingdom are at densities ten times higher in urban
    areas as rural. Urban arctic foxes are more likely to breed earlier, as yearlings.^{45}
    Urban blackbirds in Europe are less aggressive than their rural relatives. They
    have higher breeding density and a longer breeding season.^{46} They also live
    longer and have lower corticosterone, a stress hormone, than their rural relatives.^{47}


    In the Florida Keys, there is a population of deer that is native to the islands
    called Key deer. These deer, who live in more urban areas, have become fearful,
    bigger, more social, and more fertile than those out of contact with humans.^{48}
    In other urban areas, people have seen common white-tailed deer with unusual coloring—like
    blotchy or albino coats. There are anecdotes of “deformities” in piebald and albino
    deer, including short legs, shorter, longer mandates—the kind of changes associated
    with the domestication syndrome.^{49}


    After we uncovered how cognitively sophisticated dogs are, other researchers began
    to reevaluate assumptions about the intelligence of domesticated animals generally.
    Researchers have found increasing evidence that friendliness, rather than dull
    intelligence, gives animals a cognitive advantage—particularly when it comes to
    cooperating and communicating.


    József Topál found that domesticated ferrets are better at following our gestures
