  md: '![](img/fa943def924f8e17f50282098dfcc89c_36_0.png)


    Lyudmila opened the door to one of their houses, and a russet vixen

    with black socks and a white star on her forehead leaped into my arms,

    licked my face, and peed for joy.


    One of the first changes to the population of friendly foxes was coat

    color. Tawny red began to appear more frequently in their fur, then black

    and white splotching. After twenty generations, most of the friendly foxes

    were easily identifiable. A white star appeared on a few foreheads, then

    suddenly stars became frequent. Next came more floppy ears and curly

    tails. The friendly foxes had smaller teeth in shorter snouts, while the skulls

    of males and females became more similar to each other in their shape.

    These same changes had appeared in dog skulls early in domestication.10, 11


    It was not just the foxes’ appearance that had changed. Regular foxes

    bred once a year. Many friendly foxes had a longer mating season.

    Some of the friendly foxes began to have two reproductive cycles, which

    meant they could mate eight months out of the year. They became sexually

    mature a much younger and had larger litters than the regular foxes.


    Like wolves, the regular foxes had only a short window after birth—

    from sixteen days to six weeks—to become socialized to people. Like dogs,'
