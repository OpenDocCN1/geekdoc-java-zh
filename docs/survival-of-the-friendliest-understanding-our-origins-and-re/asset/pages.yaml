  pgno: 19
- img_proc: true
  md: 'On warm nights, we would sit together on the front steps, his head on my lap.
    It never bothered me that he could not talk. I just enjoyed being with him, wondering
    what the world looked like through his eyes.


    When I went to college at Emory, I discovered that exploring the animal world
    was a serious scientific endeavor. I began working with Mike Tomasello, a psychologist
    who was an expert on the theory of mind in children. Mike''s experiments with
    babies connected their earliest theory of mind abilities with their ability to
    acquire all forms of culture—including language.


    Mike and I worked together for ten years, testing the theory of mind abilities
    of one of our closest living relatives, chimpanzees. Before our experiments, there
    was no experimental evidence that any animal had theory of mind. But our research
    showed that the answer was more complicated.


    Chimpanzees had some ability to map the minds of others. In our experiments, we
    found that not only chimpanzees know someone else saw, they knew what someone
    else knew, could guess what someone else might remember, and understood the goals
    and intentions of others. They even knew when someone else had lied to.


    The fact that chimpanzees could do all these things put what they could not do
    into sharp resolution. Chimpanzees can cooperate. They can communicate. But they
    struggle to do both under one of two cups at the same time. Mike told me to hide
    a piece of food under one of two cups so a chimpanzee would know that I had hidden
    the food, but not where. Then I would try to tell them which was the correct cup
    by pointing to it. Almost unbelievably, the chimpanzees, trial after trial, ignored
    my helpful gesture and could only guess. If we changed the gesture even slightly,
    they fell apart again.


    At first, we thought chimpanzees had trouble using our gestures because there
    was something wrong with our tests. But because chimpanzees seemed to understand
    our intentions when they were competitive, but not when they were cooperative,
    we realized their failure might be meaningful.'
