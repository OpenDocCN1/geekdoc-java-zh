    The Gatumba refugee camp was mercifully close—only fifteen miles away. Rachel''s
    parents, her brother and his family, her cousins, and most of her neighbors left
    their homes with what they could carry. They moved into tents. There were showers
    and toilets. They shared food and pots and clothes. The children played together
