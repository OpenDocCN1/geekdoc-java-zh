  md: 'Ever since we thought up clever weapons to outcompete the other, stronger human
    species, we have put undue emphasis on intelligence. We have used our ideas about
    intelligence to create a linear scale that allows us to subject both animals and
    people to cruelty and suffering. My own dog, Oreo, taught me that every living
    creature has its own variety of genius, and everyone is born into this world with
    a mind brilliantly capable of solving the problems relevant to their survival.


    Discovering the genius in Oreo opened my eyes to the mental potential of other
    animals. Because of Oreo, I looked a little closer at the capabilities of chimpanzees.
    Because of Oreo, I turned to bonobos and discovered animals who see every stranger
    as a potential friend.


    Loving Oreo led me to the most valuable lesson of all: Our lives should be measured
    not by how many enemies we have conquered, but by how many friends we have made.
    That is the secret to our survival.'
