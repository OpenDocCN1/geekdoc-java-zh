  md: '![](img/fa943def924f8e17f50282098dfcc89c_25_0.png)


    I hid a piece of food under one of the cups. Then I pointed at the cup that hid
    the food. Oreo found it the first time. And the next seventeen times.


    “Oreo,” I said, scratching his ears as he hugged me with his full weight against
    my legs, “you’re a genius.”


    All those months gesturing for chimpanzees and coming up with nothing, and Oreo
    had been sitting in my backyard the whole time, waiting for me to give him a chance.


    Oreo and I were spending time together in a new way. Through my experimental games,
    I would give him a choice, and with each choice, he told me a little more about
    what the world was like for him. When I wanted to ask him whether he was really
    following my gesture or could just smell the food under the cup, I hid the food
    the same way but did not gesture. When he made his choice, he found the food only
    half the time.'
