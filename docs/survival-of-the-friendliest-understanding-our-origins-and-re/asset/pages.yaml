  md: '# The Power of Friendliness


    During Stalin''s Great Terror of 1937–38, Nikolai Belyaev was arrested by the
    secret police for being a geneticist and shot without a trial.1 Though Stalin
    was broadly paranoid about everyone, he disliked geneticists in particular because
    they seemed to go against the party line by promoting the popularized idea of
    the survival of the fittest. He saw this as an inherently American capitalist
    idea, a justification for superior strength or intelligence to amass wealth while
    workers lived in poverty. Stalin''s solution was to ban genetics entirely. Genetics
    was taken off the curriculum of schools and universities. It was torn from textbooks.
    Geneticists were declared enemies of the state, sent to labor camps, or killed,
    as Belyaev had been.


    A year later, Nikolai''s brother, Dmitry Belyaev, became a geneticist too. In
    1948, Dmitry was fired from the Central Research Laboratory of Fur Breeding in
    Moscow. But he kept his head down and in 1959 moved to Novosibirsk, far from the
    political center of Moscow as you can get.2 It was at this safe distance that
    he conducted the greatest behavioral experiment of the twentieth century.


    Belyaev''s aim was ambitious. Instead of guessing how animals had been domesticated,
    he decided to domesticate them from scratch and see for himself. He chose to work
    with foxes, close but undomesticated relatives of dogs. The foxes'' handlers had
    to wear mitts two inches thick because the foxes would struggle and bite when
    they were handled, but these animals were the perfect screen—breeding them for
    fur was important to the Russian economy and would ward off any suspicious government
    officials.'
  merge: -1
  pgno: 30
- img_proc: true
  md: 'It was an elegant experiment. Lyudmila Trut, Belyaev’s protégée, divided a
    population of foxes into two groups. They kept them in identical conditions but
    used a single criterion to separate them. The first group was bred on what they
    reacted to. When these foxes were seven months old, Lyudmila stood in front of
    them and gently tried to touch them. If the fox approached or was unaraid, it
    was chosen to breed with another fox who had a similar response. Only the friendliest
    foxes were chosen from each generation, and this group became the friendly foxes.
    The second group was bred randomly in regard to their response to people. Any
    differences between the two groups could be caused only by their selection criteria—friendliness
    toward people.2,3


    Belyaev continued this experiment for the rest of his life, and Lyudmila carried
    on after he died. By the time I arrived in Siberia, forty-four years after the
    work began, the regular foxes were pretty much the same as their ancestors. The
    friendly foxes were extraordinary.


    Darwin was fascinated by domestication and used it to demonstrate the main principles
    of his evolutionary theory. After publishing The Origin of Species, he wrote The
    Variations of Plants and Animals Under Domestication, which used artificial selection
    to illustrate the way natural selection might work on various inherited traits.
    But he did not offer a theory for when, where, and how animals first became domesticated.'
