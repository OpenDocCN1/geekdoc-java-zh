  md: 'Without my help, he was just guessing. This meant that even though, like all
    dogs, his sense of smell was excellent, he could not rely on it to go to the correct
    cup on his first try.


    It was lucky that Oreo and I were having fun, because working with him raised
    questions that involved a dozen variations on our game. Just because Oreo followed
    my point did not mean he understood the intention behind it, as a child does.
    There were simple explanations that could explain Oreo''s success, and Mike helped
    me design experiments to test each one.


    The most obvious was that Oreo was just following the movement of my arm, the
    same way he might watch a raindrop rolling down a window. He would not have to
    think the raindrop was trying to tell him anything to follow its path with his
    eyes.


    The motion of my arm could have grabbed Oreo''s attention as I gazed followed
    my arm, he could have searched for food in the cup he happened to be looking at—perhaps
    even forgetting there was another cup. This would mean Oreo did not understand
    anything about what I was thinking. I could have wgled my arm or flashed a light
    on the same side as the correct cup and gotten the same results.


    For control for this, I had to take the movement out of pointing. So sometimes
    I only turned my head and looked at the correct cup, other times I pointed across
    my body with the arm opposite the correct cup, and sometimes I got go my little
    brother to cover Oreo''s eyes until my arm was already extended and motionlessly
    pointing. In the hardest version, I even stepped toward the incorrect cup while
    pointing at the correct cup. Oreo had no problem finding the food in any of these
    new situations. He was clearly not just relying on my motion.


    Oreo hadn''t learned how to follow a point by trial and error like chimpanzees.
    If he had been, he would have gotten better as we did more trials. Instead, he
    never made a mistake in the basic tests, and even in the more difficult tests,
    he did so as well as he did at the end. Whatever Oreo was doing, it appeared to
    be more flexible and cognitively sophisticated than the responses of chimpanzees.⁹


    It was time to be bigger.'
