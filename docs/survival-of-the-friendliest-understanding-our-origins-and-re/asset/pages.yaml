  md: 'supercharged because hundreds and then millions of innovators were uniquely
    able to accept and cooperate with strangers.60


    We think this new category of intragroup stranger appeared in our species during
    the Middle Paleolithic, more than 80,000 years ago, and allowed communities to
    become larger and more densely populated. The anthropologist Kim Hill suggested
    that this level of tolerance was facilitated as both men and women immigrated
    into neighboring communities, binding families together across groups in a way
    not observed in other primates.61


    As populations became more dense, technological innovation would have exploded.
    With improved technology, we could expand into a wider range of ecologies than
    other human species. Trade across networks of neighboring communities that shared
    rituals or a communicative system allowed us to transfer innovations far and wide.
    Strange ideas met even when their inventors did not. People could barter for far-flung
    natural resources and gain access to water across territorial boundaries.


    This newfound coordination would have created the potential for collective action
    as a multroup hunt for large mammals or fish. Once the social calculus shifted
    in favor of friendliness, the increasing network of minds would have given us
    a major advantage over other human species.


    # THE NICEST HUMAN WON


    The idea that friendliness led to our success is not new. Neither is the idea
    that as a species, we became more intelligent. Our discovery lies in the relationship
    between the two ideas: It was an increase in social tolerance that led to cognitive
    changes, especially those related to communication and cooperation.


    Like the foxes under the watchful selection of a Russian genius, or the Bengales
    finches singing loops and harmonies around their wild cousins, we have domesticated
    minds. And like those first bonobos settling into the rainforest below the arc
    of the Congo River, or those protogs scavenging on our trash, we effected this
    change ourselves.


    Domesticating a human, however, is not the same as domesticating a bird, a wolf,
    or even a great ape. Only humans have gigantic brains, packed'
  merge: -1
  pgno: 94
- img_proc: true
  md: 'densely with neurons, which, along with other cognitive abilities, gave us
    unprecedented self-control. We shared this self-control with other human species
    who were able to build rudimentary tools. Closer relatives, like the Neanderthals,
    had sophisticated culture, weapons, and perhaps language, but were never a top
    predator. They were on the level of a jackal or a hyena in the carnivore hierarchy,
    sometimes hunting, sometimes scavenging, and often at the mercy of larger carnivores.


    Our species was not doing much better. Megadroughts, erupting volcanoes, and advancing
    glaciers threatened their survival, and we may have near extinction. Then, in
    the Middle Paleolithic, and with only we, underwent intense selection for friendliness.


    This selection for friendliness gave us a new social category, one that no other
    animal had—the intragroup stranger. This category was sparked and maintained by
    oxytocin, the same hormone that floods through a mother at the birth of her baby.
    With oxytocin, even at a distance, we could feel kindness toward an approaching
    stranger we could see like us.50 Perhaps they had a certain other pattern on their
    body. Or a necklace with shells from our coastline. When they were close enough
    to grasp our hands, eye contact would send another pulse of oxytocin through us
    both. We would be less fearful, more trusting and cooperative.


    Coupled with the extraordinary levels of self-control we shared with all humans,
    we could weigh the benefits of cooperation. We were better to think through the
    consequences of our actions.


    Human self-domestication before 80,000 years ago led to both the increase in population
    and the revolution in technology we see in the fossil record. Friendliness drove
    this technological revolution by linking groups of innovators together in a way
    other hominin species never could. Self-domestication gave us a superpower, and
    in the blink of an evolutionary eye, we took over the world.


    And by one, every other human species went extinct.


    Our capacity for friendliness toward strangers has continued to increase. The
    psychologist Steven Pinker argues that human violence has steadily'
  merge: -1
  pgno: 95
- img_proc: true
  md: 'declined over time.62 Yuval Harari writes that the “Law of the Jungle has finally
    been broken, if not rescinded...a growing segment of humankind has come to see
    war as simply inconceivable.”63


    We have human self-domestication to thank. The concept of the intragroup strategy
    has allowed us to extend our love towards those we have never met. This notion
    of an extended family helped us to succeed in the past, and it is the great hope
    for our future. As our population grows and uses more resources, we must keep
    expanding our circle of trust in order to flourish.


    ![](img/fa943def924f8e17f50282098dfcc89c_96_0.png)


    And yet this optimistic of ourselves is at odds with misery and suffering we still
    inflict on one another.64 Our theory of mind gives us a unique capacity for compassion,
    but at times it seems to go missing.


    We know how human self-domestication explains the best in us, but does it also
    explain the worst? How do we reconcile our unique friendliness with our capacity
    for cruelty?'
