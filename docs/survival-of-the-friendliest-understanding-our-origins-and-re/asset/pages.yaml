  md: 'behaved around it.10 Watching a male bonobo run away from a baby bonobo the
    size of his feet seems ridiculous, but it makes sense if you look at it from the
    point of view of the baby''s mother.


    For a female, one of the worst things that can happen to her reproductive fitness
    is that someone kills her baby. Not only are her genes not passed on; babies are
    energetically expensive investments. When a female is pregnant and nursing, her
    body diverts an enormous number of calories to the baby. To have a belligerent
    male kill your baby with savage swipe is a devastating loss on reproductive investment.


    It would be a huge advantage for females to eliminate this risk. Female chimpanzees
    mate with several different males to confuse paternity and reduce the risk of
    infanticide. But chimpanzees are betrayed by their own bodies. Males know when
    a female is ovulating because the pink part of her bottom swells, advertising
    exactly when she is most likely to conceive. All the high-ranking males attack
    an ovulating female, beating her into submission so she will with them and not
    other males. Her only defense is to stay close to the alpha male as protection,
    which means that the alpha male is the most reproductively successful. It also
    means that if the alpha male loses his status while his infant is still young,
    the new alpha may attack her infant. This perpetuates a cycle of violence in which
    aggressive males have the advantage and infanticide can increase fitness in males
    by quickly returning nursing mothers to a reproductive state.3, 11


    Female bonobos have managed to break this cycle by obscuring when they ovulate.
    They have swellings throughout their ovulatory cycle, making it harder for males
    to determine exactly when they are fertile. Females are also aggressive towards
    males who act like chimpanzees. Any male who tries to force females into mating
    is met with fierce opposition—sometimes from a coalition of angry females. And
    if any male looks at a baby the wrong way, he quickly feels the full force of
    female wrath. Females work together, so that even though males might dominate
    by size, females always dominate by numbers.11, 12, 13'
