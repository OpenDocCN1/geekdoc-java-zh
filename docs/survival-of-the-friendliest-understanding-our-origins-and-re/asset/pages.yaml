    It took me almost a decade to stumble on the answer.


    Self-control is one of those cognitive abilities you do not appreciate until you
    lose it. Its source is the prefrontal cortex (PFC).¹⁸ It is sometimes called the
    brain''s executive center, because, like a good CEO, it stops you from making
    counterproductive or dangerous mistakes.


    Self-control overrides the nucleus accumbens that tempts us to gamble; the visual
    cortex sees a mirage in the desert; and the amygdala makes us jump at noises in
    the dark. It is the space between a thought and an action, the look before the
    leap. Without self-control, we would all be divorced, in prison, or dead.


    Some people have more self-control than others, and by studying these variations,
