  md: 'Self-control is just as important for nonhuman animals when they make decisions,
    and some species of animals seem to have more self-control than others. The biologist
    Evan MacLean and I came up with an easy way to compare levels of self-control
    between distantly related species—a kind of marshmallow test for animals.²³


    We put a treat inside a cylinder that was open at both ends fitted with a cloth
    that made it opaque. An animal could watch and remember as we placed the food
    inside. Then, after introducing this simple hiding game, we introduced our self-control
    test. We changed the cylinder in a way that at first would seem the problem easier.
    We simply removed the cloth and made the cylinder transparent. This meant an animal
    could see the food as they went to retrieve it.


    We recruited more than fifty researchers from all over the world to use our cylinder
    test with 550 animals from 36 different species, including birds, apes, monkeys,
    dogs, lemurs, and elephants.


    All the species easily retrieved the food they had hidden a few moments before
    in the cylinder. By giving them more information, by making the tube transparent,
    actually made the problem harder. Now the correct solution required resisting
    the urge to grab the food directly through the transparent cylinder.


    It sounds simple, and some species spontaneously solved it on their first go.
    But most species could not control their urge to reach. They went directly for
    the food and bumped into the solid cylinder even though they knew from their warm-up
    that they could retrieve the food through the open ends. Some species, like the
    great apes, quickly learned to inhibit this reaching response after one or two
    mistakes, but other species, like squirrel monkeys, never learned—even after ten
    chances. We used the test to get big ideas about what leads some species to be
    more cognitively sophisticated than others.


    I thought, as long has been argued, that animals that lived in larger groups—creating
    more complex social relationships—would require more inhibition to navigate life
    successfully. Instead, we found that the animals who passed their own marshmallow
    test simply had brains with more raw computing power. The small-brained animals
    we tested struggled with-'
