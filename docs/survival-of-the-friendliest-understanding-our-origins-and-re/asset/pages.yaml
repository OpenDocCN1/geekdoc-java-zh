  md: 'Loving thanks to Vanessa’s mom, “Bobo” (Jacqui Leong), who helped wrangle kids
    at various stages, and to Brian’s folks, “Mema” and “Pops” (Alice and Bill Hare),
    who started it all by bringing home a wriggling black Labrador called Oreo. Thank
    you to our friends, who put up with various stages of ranting and raging and occasional
    public breakdowns and who so learned not to ask “Is the book done yet?” Thank
    you to our dogs, Tassie and Congo, who loved and reminded us every day how friendliness
    is the winning strategy. Finally, thank you to our sweet children, Malou and Luke.
    Yes, the book is finally done. Yes, we can play with you now.


    We hope our book will inspire all humans to show even more compassion toward one
    another and the animals with which we share this earth. If you wish to help Claudine
    André with her mission to save bonobos and to help the youth of Congo to show
    kindness to humans and all animals—including dogs—please consider donating to
    Friends of Bonobos: friendsofbonobos.org. If you would like to follow our research
    group’s progress, you can visit dukedogs.com.


    * Most of the research review is available to you online. Google has a function
    called Google Scholar that allows you to download many of the papers; many scientific
    journals allow free access to their papers through their websites; you can search
    the website of the scientists who authored the papers and download their papers
    for free; and, there is nothing scientists more than sharing their papers. If
    you write to them, they may happily share papers we discuss in this book if you
    cannot get access to them otherwise.'
