  pgno: 83
- img_proc: true
  md: 'ears; a longer reproductive period each year; high levels of serotonin, and
    enhanced cooperative communicative abilities. The changes seen in the foxes are
    even more dramatic given that they mirror those commonly seen in other domesticated
    mammals—as well as species we suspect are self-domesticated.


    In attempting to explain the link between friendliness and the suite of traits
    that tend to make up the mammalian domestication syndrome, Richard Wrangham and
    the geneticist Adam Wilson became particularly interested in neural crest cells,
    which play an outsized role in development.³ Neural crest cells appear for a short
    time in all vertebrate embryos. These cells develop on the back of the neural
    tube, which eventually becomes the brain and spine. Neural crest cells are stem
    cells, which means that as the embryo develops, neural crest cells can transform
    into a variety of cell types. They are also migratory. As the embryo develops,
    these special stem cells travel all over the body. A set of librarian genes is
    thought to have powerful sway on which type of these cells become and where they
    migrate.


    Migratory neural crest cells play a role in the development of a host of traits
    associated with the domestication syndrome. Central to domestication is reduced
    fear and aggression; neural crest cells are involved in the development of the
    adrenal medullae that release adrenaline.³ In domesticated animals, the adrenal
    glands are smaller than in their wild cousins, and smaller adrenal glands mean
    fewer stress-inducing hormones. Neural crest cells are also heavily involved in
    all of the tissues altered in association with the selection for friendliness.
    This includes the development of tail and ear cartilage, skin pigment, the bones
    of the snout (face), and the teeth.


    The neural crest cells in the head are also thought to affect brain development.³⁴
    This may account for changes in brain size as well as for how receptive different
    areas of the brain are to neurohormones like serotonin and oxytocin.³ These brain
    changes are likely linked to changes in reproductive cycles as well. A smaller
    brain size could affect the hypothalamic pituitary gonadal (HPG) axis that controls
    reproductive cycles. Limiting the function of the HPG axis would produce earlier
    sexual maturation and more frequent breeding cycles.'
