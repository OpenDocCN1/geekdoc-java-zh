  md: 'chimpanzees spend more time looking at people''s mouths.15 This might explain
    their failure to be guided by our gestures.


    We recently discovered that performance on related problems clusters in human
    infants.16 who understand what you mean when you gesture toward the correct cup
    also understand when you gesture or look at the correct cup. Babies who struggle
    to understand pointing gestures also struggle to read the other types of gestures.
    Doing well on games that test communicative intentions does not mean they will
    do well in everything. A baby who is good at reading gestures is not necessarily
    good at physics, with a good sense of whether objects fall down or, or which tool
    would work best to solve a certain problem. Those abilities are in a separate
    cluster.


    We found that communicative intention cluster even more closely in dogs. If a
    dog does well on one gesture game, they do well on all of them. If they do badly
    on one, they do badly on all of them. Like babies, these skills do not relate
    to skills for solving problems that are not social. Not only do dogs have the
    suite of communicative intention skills that we have, but these skills cluster
    the same way. This means they share with us a specialized cognition for cooperative
    communication. Dogs look like us exactly where it counts.


    Because cognition evolves to promote reproductive success, an animal will develop
    the most cognitive flexibility in the types of thinking that solve problems central
    to its survival. Unlike chimpanzees, dogs survive by communicating with people.
    But even I was surprised at how sophisticated'
