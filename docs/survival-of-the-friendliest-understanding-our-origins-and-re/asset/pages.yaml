  md: '# URBAN ANIMALS


    Self-domestication’s most powerful consequence was that it allowed us to live
    in larger, denser groups. While Neanderthals in the Upper Paleolithic could likely
    support bands of only a dozen or more people, we could support semi-permanent
    settlements with populations in the hundreds. Eventually settlements became more
    permanent, and populations grew from hundreds to thousands of millions.


    In 2008, we became an urban species. More people now live in cities than rural
    areas. In many ways, this is good news. Even in the poorest countries, life in
    cities is, by some measures, preferable to that in rural areas. There is a better
    chance for upward mobility, education, and decent living standards.


    At their best, cities create vibrant communities that mix people from different
    countries, ethnicities, sexual orientations, and races. This diversity facilitates
    contact, which in turn promotes tolerance, driving innovation and economic growth.
    Fortunately, we already know how to build cities that promote contact, because
    architecture, like all technology, is an extension of ourselves. What seems to
    work best is midrise buildings (twelve stories seems to be the upper limit), where
    mothers can keep an eye on children playing outside and residents can watch people
    passing below; mixedincome housing, where people from different professions and
    socioeconomic status can live by side; sidewalks that lead to small businesses,
    cafés, and restaurants; people working in these businesses who know their customers;
    gardens and playgrounds where mothers can talk and their children can make friends.94,
    95, 96


    In the 1950s, the West Village, New York, was this kind of city. The urbanist
    Jane Jacobs described the intricate “ballet” outside her apartment every morning.
    “The strangers on Hudson Street, the allies whose eyes help us keep peace of the
    street, are so many that they always seem to be different people...When you see
    the same stranger three or four times on Hudson Street, you begin to nod.”94


    At their worst, cities prevent social contact. High-rise create neighborhoods
    in which you can live on the same floor with someone for years and never meet,
    neighborhoods with no sidewalks and only big-box'
