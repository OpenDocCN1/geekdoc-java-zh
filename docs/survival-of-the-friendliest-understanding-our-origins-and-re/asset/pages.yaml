  md: 'The human self-domestication hypothesis helps us explain both our friendliness
    and our potential for cruelty. Our capacity to dehumanize outsiders is a by-product
    of the friendliness we feel toward people who seem to be members of our own group.
    Unlike floppy ears or a multicolored coat, this by-product can have cataclysmic
    consequences. If we see someone unlike us as a threat, we are capable of unplugging
    them from our mental network. Where there would have been a connection, empathy,
    or even compassion, there is nothing. Our unique mechanism for kindness, cooperation,
    and communication shuts down, we have the potential for horrific cruelty. This
    tendency is only magnified and accelerated in the modern world of social media.
    Large groups can move from expressing prejudice to reciprocally dehumanizing one
    another with frightening speed.


