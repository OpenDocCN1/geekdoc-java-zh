  md: 'testosterone increase the ability of oxytocin to bind with neurons and change
    behavior.29 With increased available serotonin and decreased testosterone, during
    human self-domestication, an increase in the efficacy of oxytocin is predicted.
    It is this increased power of oxytocin over our behavior that likely explains
    why our species evolved the ability to perceive our group as if they are family.


    When researchers gave people oxytocin to inhale, the subjects were more likely
    to empathize and could more accurately recognize others'' emotions. The pathway
    for the hormone seems to be the brain''s medial prefrontal cortex (mPFC), part
    of the brain''s theory of mind network.55 Oxytocin may disrupt the connection
    between the mPFC and the amygdala, allowing the mPFC to have more influence and
    blunting the amygdala''s fear and disgust response. In other words, oxytocin reduces
    feelings of trust and enables trust. When researchers gave people oxytocin to
    inhale, they tended to be cooperative, to donate more generously, and to be more
    trusting in financial and social games.56


    Oxytocin floods mothers during childbirth; it facilitates milk production and
    is passed through breast milk. Eye contact between parents and babies creates
    an oxytocin loop, making both parent and baby loving and loved. The whites of
    our eyes, both highly visible and universal, help to jump-start this oxytocin
    loop. Though it probably originated to encourage caregiving between parents and
    their babies, it acts to encourage bonding in face-to-face interactions among
    all humans. Even dogs, but not wolves, hijack this bonding pathway, creating an
    oxytocin loop between themselves and their people.57


    According to the human self-domestication hypothesis, oxytocin should help us
    feel friendly toward an intrag stranger, like bonobos, rather than aggressive,
    like chimpanzees.58, 59 Eye contact creates a further surge in oxytocin, reinforcing
    an emotional bond. When you meet someone new, your willingness to make eye contact
    long enough for the oxytocin to kick in is probably more important than the firmness
    of your handshake. A knack for befriending intrroup strangers improves our fitness,
    because, as we saw with the Arctic Inuits and Tasmanians, people in isolation
    lose cultural knowledge. Human cultural innovation was'
