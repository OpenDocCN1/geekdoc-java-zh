  md: 'When we arrived with our projectile weapons to hunt and gather in Eurasia ~50,000
    years ago, we wiped out nearly every predator of the Ice Age except the wolf.^36


    People generally assume that thousands of years ago, agriculturalists picked up
    some wolf puppies, brought them home, and bred the tame wolf puppies to make calmer
    wolves. After many generations, we would have created the lovable dog. Based on
    genetic work, we know this cannot have happened, since wolf domestication began
    at least ten thousand years before the first seed was sown. Hunter-gatherers would
    have been the first people to live alongside the first dogs.^37


    Intentional domestication of Ice Age wolves evokes an impractical scenario. Humans
    would have had to allow only the friendliest, least aggressive wolves to reproduce
    over dozens of generations. This would mean for hundreds of years, if not longer,
    hunter-gatherers would have lived among these large, impulsively aggressive wolves,
    sharing many pounds of hard-won meat with adult wolves every day. More likely,
    there was a stage in domestication before humans took control—a period of self-domestication.^38


    If we created anything, it was lots of garbage. Even today, hunter-gatherers dispose
    of food waste and urine would have been more tempting morsels for a hungry wolf
    at night. Discarded bones would be nice, because we would cook and rapidly digest
    our food, human feces is equally nutritious.^39 Our waste would have been irresistible
    to any wolf who was calm and brave enough to approach our camps. These wolves
    would have been at a reproductive advantage and scavenging together, more likely
    to breed together. The flow of genes between the friendly wolves and the fearful
    wolves would have subsided, and a new, friendlier species could have evolved even
    without intentional selection by humans.


    After only a few generations of selection for friendliness, this special population
    of wolves would have begun to look different. Coat color, ears, tails: All probably
    started to change. We would become increasingly tolerant of these odd-looking
    scavenger wolves and would quickly discovered that these protogs had a unique
    capacity for reading our gestures.'
