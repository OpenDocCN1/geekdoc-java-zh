  md: 'People have tried to explain the function of these traits individually, just
    as they had with other domesticated animals. Richard Wrangham was the exception.
    He had not sent me to Siberia to find out how smart dogs were. He wanted me to
    find out what domestication had done to Belyaev''s foxes because he thought it
    might explain what had happened to bonobos.2


    I will always remember one terrible day at Yerkes, the primate research center
    where I studied chimpanzees in my early days with Mike Tomasello. It was a Sunday,
    and I was the only person.


    I was playing the gesture game with a chimpanzee called Tai. She was old and moved
    slowly, but, like an indulgent grandmother, she was me. I watched her hide the
    food under one cup and point to it. Tai wrinkled her face, as though puzzling
    over a difficult crossword. She pointed. It got wrong. Slapped her forehead.


    Suddenly there was a scream so loud it shook the walls. Tai and I froze. I jumped
    up, knocking the table and everything on it, and ran down the hall.


    Travis, a male chimpanzee, was being held down by four other chimpanzees. One
    chimpanzee held his legs and two held his arms, so he was spread-eagled on his
    stomach.


    An enormous toothless female called Sonia sat on his back, pinning him to the
    floor. Normally Sonia''s weight was comical, but today it was frightening. Travis
    struggled beneath her, but he could not get up.


    > “Get off him!” I yelled as loud as I could, but my voice was lost in their screeches.


    The chimpanzees holding Travis''s arms took kicking his head into the concrete,
    screaming horribly. They had already bitten off two of his fingertips. His mother
    was nearby, wailing, but she was helpless as I was.


    I had seen chimpanzees fight before. I had seen them bite and hit each other.
    I had seen a chimpanzee casually break a woman’s hand. But this was different.
    They were going to kill him.'
