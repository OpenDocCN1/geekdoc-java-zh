  md: '![](img/fa943def924f8e17f50282098dfcc89c_23_0.png)


    To show Mike what I was talking about, I took Oreo to play fetch.

    “Hey, buddy, let’s go.”


    He thumped his tail, a tennis ball in his mouth. When Oreo figured out where we
    were going, he started to sprint like a dog half his age. In our neighborhood,
    there was a large pond where Oreo and I used to play together.


    Oreo bolted straight to the water’s edge and barked the bark that said he would
    bark forever unless I threw the ball.


    “Okay, okay. Just wait!”


    I pulled a giant VHS video camera out of my bag and turned it on. I threw a ball
    into the middle of the pond where Oreo leaped after it. For a magical moment,
    he soared over the water; weightless, timeless, legs sprawled front and back,
    tongue loling from his smiling mouth.


    The splash was epic, as always. When Oreo got the ball, he came swimming toward
    me. I extended my arm and pointed to the left, but time I had not thrown any other
    balls for him to find.'
