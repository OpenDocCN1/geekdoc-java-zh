    # # Our Long-Lost Cousins


    If dogs and other urban animals domesticated themselves by becoming friendlier
    and more attracted to humans, we began to wonder if the same thing could happen
    if we took humans out of the equation. Could an animal become self-domesticated
    when interacting with others of its own species through natural selection?


    Few animals are friendlier than the bonobo, but bonobos have always been a puzzle.
    Bonobos and chimpanzees shared a common ancestor a million years ago and share
    more genes with us than they do with gorillas. This makes bonobos and chimpanzees
    our two closest living primate relatives. It is like having two first cousins
    who are equally related to you. They are similar but different from each other
    in important ways.


    Some of the bonobos differ from chimpanzees have been difficult to explain, until
    we realized the mirrored genes we see in domesticated animals. Male bonobos''
    brains are approximately 20 percent smaller than those of chimpanzees, and both
    of sexes have smaller faces with smaller, more crowded teeth. Some bonobos'' lips
    are missing pigment, giving them a pinkish tinge. They are also missing pigment
    in their tuft, a patch of long pointy hair on their bottom. Chimpanzees have these
    tufts when they''re young but lose them when they mature. Both bonobos and chimpanzees
    are playful when they''re young, but chimpanzees grow out of this behavior, while
    bonobos carry this joie de vivre into adulthood. Bonobo adults are also more playfully
    sexual, and females use sex to bond with one another and to resolve conflicts
    among the males.¹'
