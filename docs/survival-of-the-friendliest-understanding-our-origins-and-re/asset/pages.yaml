  md: 'Because oxytocin seems crucial to parental behavior, it is sometimes called
    the hug hormone. But I prefer to call it the momma bear hormone. The same oxytocin
    that floods through a mother with the arrival of her newborn³ feeds the rage she
    feels when someone threatens that. For example, hamster mothers give extra oxytocin
    are more likely to attack and bite a threatening male.⁴ Oxytocin is also implicated
    in related forms of aggression. Available oxytocin increases when a male rat bonds
    with his mate. He is more caring toward her but also more likely to attack a stranger
    who threatens her.⁵ This relationship between social bonding, oxytocin, and aggression
