  md: '# Not Quite Human


    Our nanny, Rachel, sang as she gently wiggled a shoe onto our daughter''s foot.
    Our daughter was clapping and bouncing when she knocked Rachel''s skirt to one
    side, revealing a scar that went from her knee to the bottom of her shin.


    “Rachel, what happened to your leg?” I asked.


    The wound had not been stitched well. The tissue was swollen and crooked. Rachel
    looked at the floor and shrugged.


    “Machete.”


    She pulled her skirt back to reveal an identical scar on the other leg.


    Rachel was born in Minembwe, a small village high in the mountains overlooking
    Lake Tanganyika. She grew up like any other girl, going to school, playing in
    creeks, and running around the neighborhood with her friends. Her parents owned
    a store, and since Rachel could add long columns of numbers in her head, she worked
