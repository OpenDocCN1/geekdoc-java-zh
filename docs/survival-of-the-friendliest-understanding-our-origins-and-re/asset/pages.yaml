  md: 'dogs are in their understanding of our communicative intentions. How could
    dogs have social skills so similar to those that psychologists had thought were
    unique to us?


    One of the obvious explanations was that something had happened during dog domestication
    that caused canine cognition to evolve. If this was true, and we could determine
    what it was, perhaps we could uncover what drove the evolution of cooperative
    communication not just in dogs, but in ourselves. Just like legs, eyes, and wings,
    which have evolved many times independently$^{17}$ the ability to cooperatively
    communicate may also have evolved multiple times. Dogs may have converged with
    us cognitively in a narrow but crucial way.


    Since dogs evolved from wolves, they have evolved to be more like us in a variety
    of ways. The gene that enables humans to digest starch also evolved in dogs, allowing
    them, unlike their ancestors, to easily digest foods that humans gathered or farmed$^{18}$
    the gene that evolved to allow people to live at high altitudes also evolved in
    the Tibetan mastiff—both populations are able to harvest the low levels of oxygen
    found at high altitudes$^{19}$ and the same gene that confers a degree of protection
    against malaria in West Africans has also been selected for the region’s domestic
    dogs$^{20}$.


