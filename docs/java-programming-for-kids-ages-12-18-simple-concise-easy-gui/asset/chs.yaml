  \n\n在上一一章中，我们学习了方法的基本概念。在本章中，我们将创建一个包含构造函数和方法的 Java 程序。\n\n## 4.1: 构造函数\n\n我们在第\
  \ 3 章第 3.1 节学习了 Java 对象的语法，并了解到 `new` 关键字后面跟着构造函数的调用，那么什么是 Java 构造函数呢？\n\n*   Java\
  \ 构造函数是一种特殊的 Java 方法，用于初始化 Java 对象。\n*   Java 构造函数的名称必须与 Java 类名匹配。\n*   Java 构造函数没有返回值（返回值在第\
  \ 4.2 节中讨论）。\n*   Java 构造函数在对象创建期间始终会被被调用。如果一个类不包含任何构造函数，那么 Java 编译器会自动创建一个默认构造函数并执行程序。\n\
  \nJava 构造函数分为两种：\n\n1.  默认构造函数\n2.  带参数构造函数\n\n### 默认构造函数\n默认构造函数不包含任何参数。\n\n###\
  \ 带参数构造函数\n带参数构造函数包含参数。\n\n### 什么是参数？\n参数是传递给方法或构造函数的变量。方法或构造函数可以有一个参数或多个参数。\n\n\
  示例 ➢ 启动 Eclipse IDE -> 创建一个新类（我将我的类命名为 `Multiply`![](img/Image00043.jpg)\n\n代码解释：\n\
