  \ Eclipse IDE。让我们开始编码吧..\n\n\n## 3.1: 什么是 Java 类和对象？\n\n### `Class`\n需要注意的要点是：\n\
  *   Java 类是创建对象的蓝图。\n*   Java 类包含方法和变量。\n*   创建 Java 类的语法为：\n    ```\n    access_modifier\
  \ class class_name {……..}\n    ```\n\n### `Object`\n*   类的对象实例。\n*   对象包含其类中存在的方法和变量的副本。\n\
  *   创建 Java 对象的语法为：\n    ```\n    type object_name = new class_name ( )\n    ```\n\
  \    `type` 表示声明的对象的类型。`new` 关键字用于创建对象。`new` 关键字后面跟着对构造函数的调用（构造函数将在第 4 章中解释）。例如：`Animal\
  \ a = new Animal( )`，这里 `a` 是 `Animal` 类型的对象（类名），`new` 关键字后面跟着对 `Animal` 默认构造函数的调用。\n\
  \n我知道这听起来非常复杂，让我们尝试在下面将其简化一下。让我们考虑一个包含三个学生 `John`、`Ram` 和 `Katy` 的教室。这三个学生有一些共同点，如下所示：\n\
  1. 他们三个人都是教室里的学生。\n2. 他们每个人都有一个名字。\n3. 他们每个人都有一个 `student_ID`。\n4. 他们每个人都有一个 `age`。\n\
  5. 他们每个人都有一个 `gender`。\n6. 他们每个人都有自己的家庭地址。\n\n上述列出的六点被称为学生的属性。在 Java 世界中，我们可以用 `variable`\
  \ 的形式来描述这些属性。学生执行多个功能，如学习、吃饭、玩耍等。在 Java 世界中，这些功能可以用 `methods` 来描述。我们已经成功陈述了 `Student`\
  \ 的属性和功能。现在大问题是我们在哪里存储这些信息呢？嗯，我们可以这些信息存储在类中。学生 `John`、`Ram` 和 `Katy` 有他们各自的特征，他们都属于学生类别。在\
  \ Java 世界中，这三个学生被称为类 `student` 的 `objects`，而 `objects` 将包含其所在类中声明的所有变量和方法的副本![](img/Image00028.jpg)让我们总结一下这个概念：\n\
  *   `Student` 是一个类。\n*   `John`、`Ram` 和 `Katy` 是属于 `Student` 类的 `objects`。\n*  \
  \ `Name`、`Gender`、`Age`、`Student_ID`、`Address` 是 `Student` 类的 `variables`。\n\n我们将查看另一个\
  \ Java 类和对象的例子![](img/Image00029.jpg)有多种动物属于动物界。有 `dogs`狗、`tigers`老虎、`monkeys`猴子、`lion`狮等。所有动物有一些共同点，比如它们都属于动物类别，它们都有名字、重量、年龄，并且还执行一些共同的功能，如吃饭、玩耍等。在\
  \ Java 世界中，我们可以将所有以上信息写入类 `Animal` 中，`Animal` 类的 `objects` 将是 `dog`、`tiger`、`monkey`。换句话说，我们可以说\
  \ `object` 是巨大类中的一个微小实体，它有自己的属性和特性。\n## 3.2: 什么是 Java 变量？\n\n需要注意的要点是：\n*   Java\
  \ `variables` 充当数据的容器。\n*   `variables` 使用 `Data type` 声明。\n    示例：`int age`\n \
  \   这里 `age` 是变量名，其数据类型为 `int` 或整数，这意味着变量 `age` 只能存储数值整数。\n\nJava `variables` 分三种类型：\n\
  1. `Local variable` 局部变量——这些 `variables` 在方法内部声明（方法将在第 4 章讨论），并且 `variables` 在退出方法后就会被销毁。\n\
  2. `Instance variable` 实例变量——这些 `variables` 在类内部声明。\n3. `Static variables` 静态变量——这些\
  \ `variables` 的值保持不变，不需要任何对象即可访问。\n\n## 3.3: Java 数据类型\n\nJava 数据类型分为两类：\n1. `Primitive\
  \ Data Type` 原始数据类型——它包含如 `boolean`、`char`、`int`、`short`、`byte`、`long`、`float` 和\
  \ `double`。\n2. `Non-Primitive Data Type` 非原始数据类型：它包含 `String`、`Array` 等。\n\n| 数据类型\
  \ |\n| :--- |\n| `int` |\n| `float` |\n| `char` |\n| `boolean` |\n| `String` |\n\
  \n在上面的 `Student` 类示例中：\n*   `Name`、`Gender`、`Age`、`Student_ID`、`Address` 是 `Student`\
  \ 类的 `variables`。\n*   `Student` 是一个类。\n*   `John`、`Ram` 和 `Katy` 是属于 `Student`\
  \ 类的 `objects`。\n*   `Age` 将是 `int`。\n*   `Student_ID` 将是 `String`。\n*   `Address`\
  \ 将是 `String`。\n*   `Gender` 将是 `String`。\n*   `Name` 将是 `String`。\n\n## 3.4: 什么是访问修符？\n\
  \n`access modifiers` 表示类或方法的可见性。大致分为四种：\n1. `Public` 公有修符——意味着可以随处可见。\n2. `Private`\
  \ 私有修符——意味着仅在内部可见。\n3. `Default` 默认修符——意味着仅在包内可见。\n4. `Protected` 保护修符——意味着可以通过继承在包内（继承将在第\
  \ 7 章讨论）。\n\n## 3.5: 什么是 Java 包？\n\n*   `Java package` 包含类的组。\n*   `Java packages`\
  \ 主要用于避免命名冲突。\n如果一个包包含两个同名的类文件，会导致命名冲突并在 Java 项目中发生错误。为了防止这种情况发生，应该创建不同的包来存储类文件![](img/Image0030.jpg)\n\
