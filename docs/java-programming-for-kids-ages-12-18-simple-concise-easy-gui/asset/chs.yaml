  \n### 5.2.2: while 循环\n只要条件为 `TRUE`，`while` 循环就会持续执行一个代码块。\n语法如下：\n```\nwhile (\
  \ condition ) {………. code…………..}\n```\n示例![](img/Image00058.jpg)代码解释：\n*   在第 7 行，只要条件为\
  \ `TRUE`，`while` 循环就会持续执行一个代码块。\n*   注意：如果不满足条件，循环将停止。\n\n\n`break` 语句用于在满足特定条件时跳出循环。\n\
  示例：\n```\nint i = 0;\nwhile (i < 10) {\n    if (i == 5) {\n        break;\n    }\n\
  \    System.out.println(i);\n    i++;\n}\n```\n代码解释：\n*   在第 1 行，初始化变量 `i` 为 0。\n\
  *   在第 3 行，声明了一个 `if` 条件，检查 `i` 是否等于 5。\n*   如果 `i` 等于 5，执行 `break` 语句，跳出循环。\n*\
  \   在第 5 行，打印 `i` 的值。\n*   在第 6 行，`i` 的值加 1。\n\n执行过程：\n*   `i = 0` -> 检查 `i < 10`（真）\
  \ -> 检查 `i == 5`（假） -> 打印 0 -> `i` 为 1。\n*   `i = 1` -> 检查 `i < 10`（真） -> 检查 `i\
  \ == 5`（假） -> 打印 1 -> `i` 为 2。\n*   `i = 2` -> 检查 `i < 10`（真） -> 检查 `i == 5`（假）\
  \ -> 打印 2 -> `i` 为 3。\n*   `i = 3` -> 检查 `i < 10`（真） -> 检查 `i == 5`（假） -> 打印 3 ->\
  \ `i` 为 4。\n*   `i = 4` -> 检查 `i < 10`（真） -> 检查 `i == 5`（假） -> 打印 4 -> `i` 为 5。\n\
  *   `i = 5` -> 检查 `i < 10`（真） -> 检查 `i == 5`（真） -> 执行 `break` -> 退出循环。\n\n\n数组是用于存储相同类型多个值的结构。\n\
