    \ 5.2.2: while 循环\n只要条件为 `TRUE`，`while` 循环就会持续执行一个代码块。\n语法如下：\n```\nwhile ( condition\
    \ ) {………. code…………..}\n```\n示例![](img/Image00058.jpg)代码解释：\n*   在第 7 行，只要条件为 `TRUE`，`while`\
    \ 循环就会持续执行一个代码块。\n*   注意：如果不满足条件，循环将停止。\n\n## 5.3: Break 语句\n\n`break` 语句用于在满足特定条件时跳出循环。\n\
    示例：\n```\nint i = 0;\nwhile (i < 10) {\n    if (i == 5) {\n        break;\n  \
    \  }\n    System.out.println(i);\n    i++;\n}\n```\n代码解释：\n*   在第 1 行，初始化变量 `i`\
    \ 为 0。\n*   在第 3 行，声明了一个 `if` 条件，检查 `i` 是否等于 5。\n*   如果 `i` 等于 5，执行 `break` 语句，跳出循环。\n\
    *   在第 5 行，打印 `i` 的值。\n*   在第 6 行，`i` 的值加 1。\n\n执行过程：\n*   `i = 0` -> 检查 `i <\
    \ 10`（真） -> 检查 `i == 5`（假） -> 打印 0 -> `i` 为 1。\n*   `i = 1` -> 检查 `i < 10`（真）\
    \ -> 检查 `i == 5`（假） -> 打印 1 -> `i` 为 2。\n*   `i = 2` -> 检查 `i < 10`（真） -> 检查 `i\
    \ == 5`（假） -> 打印 2 -> `i` 为 3。\n*   `i = 3` -> 检查 `i < 10`（真） -> 检查 `i == 5`（假）\
    \ -> 打印 3 -> `i` 为 4。\n*   `i = 4` -> 检查 `i < 10`（真） -> 检查 `i == 5`（假） -> 打印 4\
    \ -> `i` 为 5。\n*   `i = 5` -> 检查 `i < 10`（真） -> 检查 `i == 5`（真） -> 执行 `break` ->\
    \ 退出循环。\n\n## 6: 数组 (Arrays)\n\n数组是用于存储相同类型多个值的结构。\n示例：\n```\nint[] numbers =\
    \ {10, 20, 30, 40, 50};\n```\n代码解释：\n*   `int[] numbers` 声明并初始化了一个整数数组。\n*   `{10,\
    \ 20, 30, 40, 50}` 是数组的初始值。\n\n### 6.1: 访问数组\n数组通过索引（index）访问，索引从 0 开始。\n示例：\n\
    ```java\nSystem.out.println(numbers[0]); // 输出 10\nSystem.out.println(numbers[2]);\
    \ // 输出 30\n```\n\n### 6.2: 修改数组\n你可以通过索引修改数组的值。\n示例：\n```java\nnumbers[1] = 100;\n\
    System.out.println(numbers[1]); // 输出 100\n```\n\n### 6.3: 遍历数组\n可以使用 `for` 循环或\
    \ `for-each` 循环来遍历数组。\n示例：\n```java\nfor (int i = 0; i < numbers.length; i++)\
    \ {\n    System.out.println(numbers[i]);\n}\n```\n或者使用 `for-each`:\n```java\n\
    for (int num : numbers) {\n    System.out.println(num);\n}\n```\n\n## 7: 类与对象\
    \ (Classes and Objects)\n\n类是创建对象的蓝图。\n示例：\n```java\nclass Car {\n    String brand;\n\
    \    int year;\n\n    void drive() {\n        System.out.println(\"The car is\
    \ driving.\");\n    }\n}\n```\n实例化对象：\n```java\nCar myCar = new Car();\nmyCar.brand\
    \ = \"Toyota\";\nmyCar.year = 2022;\nmyCar.drive();\n```\n\n### 7.1: 继承 (Inheritance)\n\
    继承允许类使用另一个类的属性和方法。\n示例：\n```java\nclass Animal {\n    void eat() {\n        System.out.println(\"\
    This animal eats.\");\n    }\n}\n\nclass Dog extends Animal {\n    void bark()\
    \ {\n        System.out.println(\"The dog barks.\");\n    }\n}\n```\n\n### 7.2:\
    \ 多态 (Polymorphism)\n多态允许不同类对同一个方法调用做出不同的响应。\n示例：\n```java\nAnimal myDog = new\
    \ Dog();\nmyDog.eat(); // 输出 This animal eats.\n```\n"
- fmt: "\n* Encapsulation is the mechanism in which all the Java methods and variable\
    \ are wrapped up into a single unit (`Class`).\n\n![](Image00069.jpg)\n\n* Encapsulation\
    \ helps to protect the data present inside the unit and prevents any malicious\
    \ activity.\n\n* In Encapsulation, the variables of a class is declared `private`\
    \ (private access modifiers explained in chapter 3, section 3.4).\n\nIn order\
    \ to access the private variable from outside the class, `get` and `set` methods\
    \ are used. `set` method is used to set a value and `get` method is used to get\
    \ the value.\n\nExample➢ Launch Eclipse IDE -> create a new `Class` (I named my\
    \ class `Encap`).![](Image00070.jpg)\n\nIn `Encap` class, I declared two variables\
    \ `username` and `password`. Since both `username` and `password` carries very\
    \ important and sensitive data (sensitive data are those data which must be hidden\
    \ and protected at any cost), so we declared its access modifier as `private`\
    \ meaning that no class outside `Encap` class can access these variables. In order\
    \ to access these private variables, we need `get` and `set` methods.\n\n➢ To\
    \ generate `get` and `set` methods of variables `username` and `password`, click\
    \ on the yellow bulb like icon beside `username` and `password` and select Create\
    \ getter and setter for ‘username’ and Create getter and setter for ‘password’\
    \ respectively.![](Image00071.jpg)![](Image00072.jpg)![](Image00073.jpg)![](Image00074.jpg)![](Image00075.jpg)\n\
    \nWhat is this `this` keyword? `this` keyword refers to the current object. In\
    \ the above example, Class `Encap` is `public` meaning that any other class can\
    \ access Class `Encap` but its variables are `private` meaning no other class\
    \ can access these variables except for Class `Encap`. The `get` and `set` methods\
    \ are `public` meaning that any other class can access these methods.\n\n➢ Let’s\
    \ create another class (I named my class `Encap2`) and access the `get` and `set`\
    \ method declared in class `Encap`.![](Image00076.jpg)\n\nCode explanation:\n\n\
    * Since Class `Encap` was `public`, Class `Encap2` can access it easily.\n\nIn\
    \ line 6, an object of class `Encap` is created and its `set` and `get` methods\
    \ are accessed. First we pass a value to variable `username` using its `set` method\
    \ at line 8 and then we get and print out the value using its `get` method at\
    \ line 9. Then we pass a value to variable `password` using its `set` method at\
    \ line 11 and then we get and print out the value using its `get` method at line\
    \ 12. Let’s run the above piece of code:![](Image00077.jpg)\n\n## 7.2: Inheritance\n\
    \nImportant points to note are:\n\n* Inheritance is a mechanism in which a subclass\
    \ or child class inherits all the properties from superclass or parent class.\n\
    * The main usage of Inheritance is code reusability.\n* The subclass or child\
    \ class inherits properties from its parent class using `extends` keyword.\n\n\
    ```\nclass Parent {………………..code…………}\nclass Child extends Parent {……………….code………………}\n\
    ```\n\n* A subclass can contain its own properties as well as its parent class\
    \ properties.\n\nExample: Let us consider a school district XYZ contains three\
    \ schools, elementary school, middle school and high school and all the three\
    \ schools are built on the same street and on the same location. The common attribute\
    \ between these schools are:\n\n1. They all are schools or educational institution.\n\
    2. They all are built on the same street but have different building names and\
    \ numbers.\n3. They all fall under the same school district.\n\n![](Image00078.jpg)\n\
    \nWhile coding, instead of writing these common information for each school again\
    \ and again, we can write them once in a single place (in a superclass or parent\
    \ class) and call them whenever any other class needs them.\n\nExample➢ Launch\
    \ Eclipse IDE, create a new class (I named my class `SchoolSuperClass`) and this\
    \ class will act as a superclass. \n➢ Create three more classes, one for elementary\
    \ school (I named my class `ElementaryChild`), one for middle school (I named\
    \ my class `MiddleChild`) and one for high school (I named my class `HighChild`).\
    \ These three classes will act as a child class of superclass `SchoolSuperClass.java`.\
    \ \n➢ In superclass `SchoolSuperClass.java`, write the following lines of code:![](Image00079.jpg)\n\
    \nIn this class, we declared all the variables and methods which are common to\
    \ all three schools.\n\n* Open `ElementaryChild.java`, and write the following\
    \ lines of code\n\n![](Image00080.jpg)\n\nCode explanation:\n\n* At line 3, with\
    \ the help of `extends` keyword, all properties of superclass `SchoolSuperClass`\
    \ are incorporated into child class `ElementaryChild`.\n* At line 7, object `e`\
    \ of `ElementaryChild` class is created.\n* At line 9 and line 10, the variables\
    \ `school_Id` and `building_num` are accessed from superclass and values are passed\
    \ into it.\n* At line 12 and 13, the values of the variables are printed.\n* At\
    \ line 14, the `street_address()` method present in superclass is called.\n\n\
    Now let’s run the above piece of code:![](Image00081.jpg)\n\n* Open the second\
    \ class file `MiddleChild.java` and write the following lines of code:![](Image00082.jpg)\n\
    \nThe above piece of code is very similar to `ElementaryChild.java`, only data\
    \ is different. Let’s run the above piece of code:![](Image00083.jpg)\n\nWe followed\
    \ the same process above for `HighChild.java`.\n\n## 7.3: Polymorphism\n\nPolymorphism\
    \ is a mechanism in which a method can be executed in many forms based on the\
    \ object that is acting upon it.\nPolymorphism is of 2 types:\n\n1. Dynamic Polymorphism\
    \ or Run Time polymorphism\n2. Static Polymorphism or Compile time polymorphism\n\
    \n### 7.3.1: Dynamic Polymorphism\n\nThe most important example of this type of\
    \ Polymorphism is Method overriding.\n\n* When superclass and subclass have method\
    \ with same name and signature, the method of the subclass tends to overrides\
    \ the method of the superclass. This mechanism is called Method overriding.\n\
    * When method of the superclass and subclass have same method (with same name\
    \ and signature), the compiler does not understand which method to execute. This\
    \ type of conflict is resolved at run time and due to this Dynamic Polymorphism\
    \ is also called Run time polymorphism.\n\n### Example\n\nLet’s create a Method\
    \ overriding scenario.\n➢ Launch Eclipse IDE and create a new Superclass (I named\
    \ my class `Animal`)![](Image00084.jpg)\n➢ Create two subclasses (I named one\
    \ subclass `Cow` and other subclass `Lion`) `Cow.java`](Image00085.jpg) `Lion.java`Image00086.jpg)\n\
    \nSuperclass `Animal` have an `eat` method and both subclasses `Cow` and `Lion`\
    \ also have the same method with same name and signature (highlighted in the screen\
    \ shot above). In Class `Cow.java`, at line 10, we created object `c` of type\
    \ `Animal` and a call was made to the `Cow` constructor. At line 11, we called\
    \ the `eat` method. After running `Cow.java` we get an output of![](Image00087.jpg)\
    \ In Class `Lion.java`, at line 10, we created object `l` of type `Animal` and\
    \ a call was made to the `Lion` constructor. At line 11, we called the `eat` method.\
    \ After running `Lion.java` we get an output of![](Image00088.jpg)\n\nIn both\
    \ cases we see that the `eat` method of each subclass (`Cow` and `Lion`) overrides\
    \ the `eat` method of superclass (`Animal`).\n\n### 7.3.2: Static Polymorphism\n\
    \nThe most important example of this type of Polymorphism is Method Overloading.\n\
    \n* In Method Overloading, a class can contain multiple methods with same name\
    \ with different signature.\n* Static Polymorphism is also called Compile time\
    \ Polymorphism because in this case the compiler knows which method to execute\
    \ based on the method signature and the conflict is resolved at compile time.\n\
    \nExample➢ Launch Eclipse IDE -> create a new class (I named my class `SPExample`)![](Image00089.jpg)\
    \ Code explanation:\n\n* At line 5, a method named `show` is declared.\n* At line\
    \ 9, another method named `show` is declared with a parameter.\n* At line 15,\
    \ `show()` method is called.\n* At line 16, the other `show()` method is called\
    \ and an argument is passed into it.\n"
