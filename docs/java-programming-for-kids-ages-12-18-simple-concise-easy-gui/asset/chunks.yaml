    ![](Image0004.jpg)


    ### JVM Architecture

    is divided into three sections:

    1. Class Loader

    2. JVM Memory

    3. Execution Engine


    ![](Image0005.jpg)


    ### JVM Memory

    is further divided into:

    * Method area - It stores methods.

    * Heap area - It stores instances.

    * Stack area - It stores local variables.

    * PC Register - It stores the address of currently executing instruction.


    ### Execution Engine

    is further divided into:

    * Interpreter - It converts byte code to machine code.

    * JIT Compiler - JIT stands for Just In Time compiler and its main task is to
    increases the performance and efficiency of Interpreter.


    Now let’s summarize the Java program before we start coding, we need to download
    and install `JDK` and an `IDE`.


    ### What is IDE?

    IDE stands for Integrated Development Environment. It is a software application
    needed to write programs in Java. There are multiple IDE present but we will be
    using Eclipse IDE to write our Java code.


    ## Chapter 2 : Java JDK and Eclipse IDE Installation


    ### 2.1: JDK download

    * Open Google chrome (or any browser you like ) and search for java download and
    select the oracle website highlighted in the screen below.

    ![](Image0007.jpg)

    * Download the latest JDK version.

    ![](Image0008.jpg)

    * Select your operating system. (since I am using windows, so downloading windows-x64
    installer highlighted in the screen below )

    ![](Image0009.jpg)

    * Check on review box, click download and install.

    ![](Image0010.jpg)(Image0011.jpg)(Image0012.jpg)(Image0013.jpg)

    * Click close.

    * Now check whether the Java PATH is automatically added to your Environment Variables
    or not.


    ### What is Java PATH?

    Java PATH is an environment variable which helps us to locate the `JDK` bin directory
    or folder which contains all the important files needed to execute a Java program.

    Let’s access the Environment Variables.

    * Open control panel -> click on System and Security .![](Image0014.jpg)

    * Click on System![](Image0015.jpg)

    * Click on Advanced system settings![](Image0016.jpg)

    * Click on Environment Variables.![](Image0017.jpg)

    * Under System variables , select Path -> click Edit![](Image0018.jpg)

    * Javapath shows highlighted in the screen below.![](Image0019.jpg)

    * Click ok and exit.

    We have successfully installed JDK in our machine. Now let’s download and install
    Eclipse IDE.


    ### 2.2: Download and install Eclipse IDE

    * Go to website [https://www.eclipse.org/downloads/packages/](https://www.eclipse.org/downloads/packages/)
    and download the latest version of Eclipse IDE .

