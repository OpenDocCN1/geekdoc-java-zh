  trans: "\n\n（因为我使用的是 Windows 操作系统，所以我下载了 Windows 版本的 Eclipse IDE）![](img/Image00020.jpg)![](img/Image00021.jpg)\n\
    \n*   下载完成后，在电脑上打开下载文件夹。\n\n![](img/Image00022.jpg)下载的文件夹是一个 ZIP 文件夹，我们需要将其解压才能访问\
    \ Eclipse 应用程序。因此，右键点击 ZIP 文件夹并点击“提取所有”。![](img/Image00023.jpg)浏览你的解压位置并点击“提取”。![](img/Image00024.jpg)现在打开\
    \ eclipse 文件夹，寻找下方截图所示的 eclipse 应用程序![](img/Image00025.jpg)点击并打开 eclipse 应用程序![](img/Image00026.jpg)选择一个工作空间并点击启动（launch）![](img/Image00027.jpg)我们现在已成功安装了\
    \ Eclipse IDE。让我们开始编码吧..\n\n# 第 3 章：类、对象、变量和数据类型\n\n## 3.1: 什么是 Java 类和对象？\n\n\
    ### `Class`\n需要注意的要点是：\n*   Java 类是创建对象的蓝图。\n*   Java 类包含方法和变量。\n*   创建 Java 类的语法为：\n\
    \    ```\n    access_modifier class class_name {……..}\n    ```\n\n### `Object`\n\
    *   类的对象实例。\n*   对象包含其类中存在的方法和变量的副本。\n*   创建 Java 对象的语法为：\n    ```\n    type object_name\
    \ = new class_name ( )\n    ```\n    `type` 表示声明的对象的类型。`new` 关键字用于创建对象。`new` 关键字后面跟着对构造函数的调用（构造函数将在第\
    \ 4 章中解释）。例如：`Animal a = new Animal( )`，这里 `a` 是 `Animal` 类型的对象（类名），`new` 关键字后面跟着对\
    \ `Animal` 默认构造函数的调用。\n\n我知道这听起来非常复杂，让我们尝试在下面将其简化一下。让我们考虑一个包含三个学生 `John`、`Ram`\
    \ 和 `Katy` 的教室。这三个学生有一些共同点，如下所示：\n1. 他们三个人都是教室里的学生。\n2. 他们每个人都有一个名字。\n3. 他们每个人都有一个\
    \ `student_ID`。\n4. 他们每个人都有一个 `age`。\n5. 他们每个人都有一个 `gender`。\n6. 他们每个人都有自己的家庭地址。\n\
    \n上述列出的六点被称为学生的属性。在 Java 世界中，我们可以用 `variable` 的形式来描述这些属性。学生执行多个功能，如学习、吃饭、玩耍等。在\
    \ Java 世界中，这些功能可以用 `methods` 来描述。我们已经成功陈述了 `Student` 的属性和功能。现在大问题是我们在哪里存储这些信息呢？嗯，我们可以这些信息存储在类中。学生\
    \ `John`、`Ram` 和 `Katy` 有他们各自的特征，他们都属于学生类别。在 Java 世界中，这三个学生被称为类 `student` 的 `objects`，而\
    \ `objects` 将包含其所在类中声明的所有变量和方法的副本![](img/Image00028.jpg)让我们总结一下这个概念：\n*   `Student`\
    \ 是一个类。\n*   `John`、`Ram` 和 `Katy` 是属于 `Student` 类的 `objects`。\n*   `Name`、`Gender`、`Age`、`Student_ID`、`Address`\
    \ 是 `Student` 类的 `variables`。\n\n我们将查看另一个 Java 类和对象的例子![](img/Image00029.jpg)有多种动物属于动物界。有\
    \ `dogs`狗、`tigers`老虎、`monkeys`猴子、`lion`狮等。所有动物有一些共同点，比如它们都属于动物类别，它们都有名字、重量、年龄，并且还执行一些共同的功能，如吃饭、玩耍等。在\
    \ Java 世界中，我们可以将所有以上信息写入类 `Animal` 中，`Animal` 类的 `objects` 将是 `dog`、`tiger`、`monkey`。换句话说，我们可以说\
    \ `object` 是巨大类中的一个微小实体，它有自己的属性和特性。\n\n## 3.2: 什么是 Java 变量？\n\n需要注意的要点是：\n*  \
    \ Java `variables` 充当数据的容器。\n*   `variables` 使用 `Data type` 声明。\n    示例：`int age`\n\
    \    这里 `age` 是变量名，其数据类型为 `int` 或整数，这意味着变量 `age` 只能存储数值整数。\n\nJava `variables`\
    \ 分三种类型：\n1. `Local variable` 局部变量——这些 `variables` 在方法内部声明（方法将在第 4 章讨论），并且 `variables`\
    \ 在退出方法后就会被销毁。\n2. `Instance variable` 实例变量——这些 `variables` 在类内部声明。\n3. `Static\
    \ variables` 静态变量——这些 `variables` 的值保持不变，不需要任何对象即可访问。\n\n## 3.3: Java 数据类型\n\n\
    Java 数据类型分为两类：\n1. `Primitive Data Type` 原始数据类型——它包含如 `boolean`、`char`、`int`、`short`、`byte`、`long`、`float`\
    \ 和 `double`。\n2. `Non-Primitive Data Type` 非原始数据类型：它包含 `String`、`Array` 等。\n\n\
    | 数据类型 |\n| :--- |\n| `int` |\n| `float` |\n| `char` |\n| `boolean` |\n| `String`\
    \ |\n\n在上面的 `Student` 类示例中：\n*   `Name`、`Gender`、`Age`、`Student_ID`、`Address`\
    \ 是 `Student` 类的 `variables`。\n*   `Student` 是一个类。\n*   `John`、`Ram` 和 `Katy`\
    \ 是属于 `Student` 类的 `objects`。\n*   `Age` 将是 `int`。\n*   `Student_ID` 将是 `String`。\n\
    *   `Address` 将是 `String`。\n*   `Gender` 将是 `String`。\n*   `Name` 将是 `String`。\n\
    \n## 3.4: 什么是访问修符？\n\n`access modifiers` 表示类或方法的可见性。大致分为四种：\n1. `Public` 公有修符——意味着可以随处可见。\n\
    2. `Private` 私有修符——意味着仅在内部可见。\n3. `Default` 默认修符——意味着仅在包内可见。\n4. `Protected` 保护修符——意味着可以通过继承在包内（继承将在第\
    \ 7 章讨论）。\n\n## 3.5: 什么是 Java 包？\n\n*   `Java package` 包含类的组。\n*   `Java packages`\
    \ 主要用于避免命名冲突。\n如果一个包包含两个同名的类文件，会导致命名冲突并在 Java 项目中发生错误。为了防止这种情况发生，应该创建不同的包来存储类文件![](img/Image0030.jpg)\n\
    \n## 3.6: 示例\n\n### 示例 1\n启动 Eclipse 并创建一个新的 Java 项目。\n*   点击 `File` -> `New`\
    \ -> `Java Project`![](img/Image0031.jpg)\n*   输入项目名称（我命名为 `hello_world`）并点击 `Finish`![](img/Image00032.jpg)\n\
    *   在 `Create module-info.java` 窗口，目前我将点击 `Don’t Create`![](img/Image00033.jpg)\n\
    我们的 `hello_world` Java 项目已创建![](img/Image00034.jpg)\n*   右键点击 `src` 文件夹 -> `New`\
    \ -> `Package`（我们正在创建一个包）。\n什么是默认的 `src` 文件夹？\n默认 `src` 文件夹是源代码文件夹，包含了我们项目的源代码或主代码![](img/Image00035.jpg)![](img/Image00036.jpg)点击\
    \ Finish\n*   右键点击 `hello_world` 包 -> 点击 `New` -> 点击 `Class`（我们正在创建一个新的 Java 类）![](img/Image0037.jpg)\n\
    输入类名（我给了 `Hello`），大写字母开头 -> 勾选 `public static void main(String[] args)` 复选框 ->\
    \ 点击 `Finish`![](img/Image0038.jpg)\n*   在 `Hello.java` 中，编写下方截图所示的代码，并通过点击运行按钮执行程序![](img/Image0039.jpg)\n\
    \n代码解释：\n*   `System.out.print` 用于显示或打印输出。\n`System.out.println` 与 `System.out.print`\
    \ 相同，但 `println` 会分行输出。\n*   在第 5 行，你会注意到一行非常重要的代码，它是 `public static void main(String[]\
    \ args)`。它是 Java `main` 方法，作为 Java 程序的入口。任何 Java 程序在遇到这行非常重要的代码后才会开始执行过程。（我们将在第\
    \ 4 章详细讨论这行代码）。\n\n### 示例 2\n让我们创建另一个 Java 类。\n\n"
