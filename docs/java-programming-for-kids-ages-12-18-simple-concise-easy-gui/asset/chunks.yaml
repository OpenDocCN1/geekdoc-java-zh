    \n我们在 `HighChild.java` 中遵循相同的过程。\n\n## 7.3: 多态 (Polymorphism)\n\n多态是一种方法根据所作用的对象以多种形式执行的机制。\n\
    多态有两种类型：\n\n1. 动态多态（Dynamic Polymorphism）\n2. 静态多态（Static Polymorphism）\n\n###\
    \ 7.3.1: 动态多态\n\n这种类型多态最重要的例子是方法重写（Method Overriding）。\n\n*   当超类和子类具有相同名称的方法时，子类的方法会重写超类的方法。\n\
    *   当超类和子类具有相同名称的方法时，编译器无法确定执行哪个方法。这种类型的冲突在运行时解决的。\n\n### 示例\n\n让我们创建一个方法重写的场景。\n\
    ➢ 启动 Eclipse IDE 并创建一个超类（我将我的类命名为 `Animal`）![](img/Image00084.jpg)\n➢ 创建两个子类（将一个子类命名为\
    \ `Cow`，另一个子类命名为 `Lion`）`Cow.java`](Image00085.jpg) `Lion.java`Image00086.jpg)\n\
    \n超类 `Animal` 有一个 `eat` 方法，两个子类 `Cow` 和 `Lion` 也具有相同名称的方法（如截图所示）。在 `Cow.java`\
