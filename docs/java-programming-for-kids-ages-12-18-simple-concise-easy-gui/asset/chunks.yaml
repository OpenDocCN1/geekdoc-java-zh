    \ 安装程序）\n![](img/Image0009.jpg)\n* 勾选确认框，点击下载并安装。\n![](img/Image0010.jpg)(Image0011.jpg)(Image0012.jpg)(Image0013.jpg)\n\
    * 点击关闭。\n* 现在检查 Java PATH 是否已自动添加到你的环境变量中。\n\n### 什么是 Java PATH？\nJava PATH 是一个环境变量，帮助我们定位\
    \ `JDK` 的 bin 目录或文件夹，其中包含了执行 Java 程序所需的所有重要文件。\n让我们访问环境变量：\n* 打开控制面板 -> 点击系统和安全\
    \ .![](img/Image0014.jpg)\n* 点击系统![](img/Image0015.jpg)\n* 点击高级系统设置![](img/Image0016.jpg)\n\
    * 点击环境变量。(Image0017.jpg)\n* 在系统变量下，选择 Path -> 点击编辑![](img/Image0018.jpg)\n* Javapath\
    \ 显示如下方屏幕所示。![](img/Image0019.jpg)\n* 点击确定并退出。\n我们已经已经在机器上成功安装了 JDK。现在让我们下载并安装\
    \ Eclipse IDE。\n\n### 2.2：下载并安装 Eclipse IDE\n* 访问网站 [`www.eclipse.org/downloads/packages/`](https://www.eclipse.org/downloads/packages/)\
    \ 并下载最新版本的 Eclipse IDE 。\n\n"
- fmt: "\n(since I am using windows operating system, so downloaded Eclipse IDE for\
    \ Windows )![](Image00020.jpg)![](Image00021.jpg)\n\n*   After finish downloading,\
    \ open the download folder in your machine.\n\n![](Image00022.jpg)The downloaded\
    \ folder is a ZIP folder and we need to extract it in order to access Eclipse\
    \ application.So right click on ZIP folder and click extract all.![](Image00023.jpg)Browse\
    \ for your extract location and click on Extract .![](Image00024.jpg)Now open\
    \ the eclipse folder and look for the eclipse application highlighted in the screen\
    \ shot below.![](Image00025.jpg)Click and open the eclipse application.![](Image00026.jpg)Select\
    \ a workspace and click on launch![](Image00027.jpg)We have now successfully installed\
    \ Eclipse IDE .Let’s begin coding..\n\n# Chapter 3 : Class, Object, Variables\
    \ and Data types\n\n## 3.1: What is a Java Class & Object?\n\n### `Class`\nImportant\
    \ points to note are:\n*   Java class is a blueprint for creating an object .\n\
    *   Java class contains methods and variables .\n*   The syntax for creating a\
    \ Java class is:\n    ```\n    access_modifier class class_name {……..}\n    ```\n\
    \n### `Object`\n*   An object instance of a class .\n*   An object contains the\
    \ copy of methods and variables present inside its class .\n*   The syntax for\
    \ creating a Java object is:\n    ```\n    type object_name = new class_name (\
    \ )\n    ```\n    The `type` denotes the type of object declared. The `new` keyword\
    \ is used to create an object . The `new` keyword is followed by call to a constructor\
    \ (constructor explained in chapter 4). For example: `Animal a = new Animal( )`,\
    \ here `a` is an object of type `Animal` ( Class name) and the `new` keyword is\
    \ followed by call to `Animal` default constructor .\n\nI know it all sounds extremely\
    \ complicated, let’s try to simplify a little bit below. Let us consider a class\
    \ room containing three students, `John`, `Ram` and `Katy`. These three students\
    \ have few things in common and they are as follows:\n1. All three are students\
    \ of a class room.\n2. They each have a name.\n3. They each have a `student_ID`.\n\
    4. They each have an `age`.\n5. They each have a `gender`.\n6. They each have\
    \ their home address.\n\nThese six things listed above are called attributes of\
    \ a student. In Java world, we can depict these attributes in the form of a `variable`.\
    \ A student performs multiple functions like studying, eating, playing etc. In\
    \ Java world, these functions can be depicted by `methods`. We have successfully\
    \ stated the attributes and functions of a `Student`. Now the big question is\
    \ where we can store these information?. Well we can store this information in\
    \ a class . The students `John`, `Ram` and `Katy` have their own individual characteristics\
    \ and they all fall under the student category. In Java world, these three students\
    \ are referred as `objects` of class `student` and the `objects` will contain\
    \ a copy of all variables and methods declared within its class .![](Image00028.jpg)Let’s\
    \ summarize the concept:\n*   `Student` is a class .\n*   `John`, `Ram` and `Katy`\
    \ are `objects` which belong to class `Student`.\n*   `Name`, `Gender`, `Age`,\
    \ `Student_ID`, `Address` are `variables` of class `Student`.\n\nWe will look\
    \ into another example of Java class and object .![](Image00029.jpg)There are\
    \ multiple animals which belong to the animal kingdom. There are `dogs`, `tigers`,\
    \ `monkeys`, `lion` etc. All animals have few things in common like they all fall\
    \ under the animal category, they all have a name, weight, age and they also perform\
    \ some common functions like eating, playing and many more. In Java world, we\
    \ can write all the above information in a class `Animal` and the `objects` of\
    \ class `Animal` will be `dog`, `tiger`, `monkey`. In other words we can say an\
    \ `object` is a small miniscule entity of the vast class which has its own properties\
    \ and characteristic.\n\n## 3.2: What is Java Variable?\n\nImportant points to\
    \ note are:\n*   Java `variables` act as a container to hold data.\n*   The `variables`\
    \ are declared with a `Data type`.\n    Example: `int age`\n    Here `age` is\
    \ a variable name whose data type is `int` or integer meaning that the variable\
    \ `age` can hold only numeric whole numbers.\n\nJava `variables` are of three\
    \ types:\n1. `Local variable` – These `variables` are declared within methods\
    \ (methods discussed in chapter 4) and the `variables` get destroyed soon after\
    \ exiting the method .\n2. `Instance variable` – These `variables` are declared\
    \ within the class .\n3. `Static variables` – The values of these `variables`\
    \ remains constant or static and it also does not require any object to access\
    \ it.\n\n## 3.3: Java Data Types\n\nJava data types are divided into two categories:\n\
    1. `Primitive Data Type` – It contains  such as `boolean`, `char`, `int`, `short`,\
    \ `byte`, `long`, `float`, and `double`.\n2. `Non-Primitive Data Type` : It contains\
    \ `String`, `Array`, etc.\n\n| Data type |\n| :--- |\n| `int` |\n| `float` |\n\
    | `char` |\n| `boolean` |\n| `String` |\n\nIn the above `Student` class example\
    \ of section 3.1:\n*   `Variable Name` will be of data types `String`.\n*   `Variable\
    \ Gender` is usually denoted by a single character `M` (for male) or `F` (for\
    \ female) so its data types will be `char`.\n*   `Variable Age` will be of data\
    \ type `int`.\n*   `Variable Student_ID` may contain numbers and character values\
    \ together, so let’s assign a data type of `String` to it.\n*   `Variable Address`\
    \ will be of data types `String`.\n\n## 3.4: What are access modifiers?\n\n`access\
    \ modifiers` denote the accessibility of a class or a method . It is broadly divided\
    \ into 4 types:\n1: `Public access modifiers` – This means that the class or method\
    \ is accessible from everywhere.\n2: `Private access modifiers` – This means that\
    \ the class or method is accessible only from within.\n3: `Default access modifiers`\
    \ – This means that the class or method is accessible only within its package\
    \ .\n4: `Protected access modifiers` – This means that the class or method is\
    \ accessible from within its package or any package through inheritance (inheritance\
    \ discussed in chapter 7).\n\n## 3.5: What is Java package?\n\n*   A `Java package`\
    \ contain group of Java classes .\n*   `Java packages` are mainly done to avoid\
    \ name conflicts.\nIf a package contains two class files of the same name, it\
    \ will lead to name conflict and error in the Java project may occur. In order\
    \ to prevent that from happening, separate packages should be created for storing\
    \ the class file which has the same name.![](Image0030.jpg)\n\n## 3.6: Examples\n\
    \n### Example 1\nLaunch Eclipse IDE and create a new Java project .\n*   Click\
    \ on `File` -> `New` -> `Java Project` .![](Image0031.jpg)\n*   Give the Project\
    \ name ( I named `hello_world` ) and click on `Finish` .![](Image00032.jpg)\n\
    *   On `Create module-info.java` window, for now I will be clicking on `Don’t\
    \ Create` .![](Image00033.jpg)\nOur `hello_world` Java project is created.![](Image00034.jpg)\n\
    *   Right click on the `src` folder -> Click `New` -> `Package` (we are creating\
    \ a new package) .\nWhat is the default `src` folder of Eclipse IDE?\nDefault\
    \ `src` folder is the source folder which contains the source code or the main\
    \ code of our project.![](Image00035.jpg)![](Image00036.jpg)Click Finish\n*  \
    \ Right click on the `hello_world` package -> click `New` -> Click `Class` (we\
    \ are creating a new Java class )![](Image00037.jpg)\nGive the Class name (I gave\
    \ `Hello` ) starting with a capital letter -> check on `public static void main(String[]\
    \ args)` box -> click `Finish` .![](Image00038.jpg)\n*   In `Hello.java` , write\
    \ one line of code highlighted in the screen shot below and execute the program\
    \ by clicking on the run button.![](Image00039.jpg)\n\nCode explanation:\n*  \
    \ `System.out.print` is used to display or print output.\n`System.out.println`\
    \ is same as `System.out.print` but the `println` displays output in separate\
    \ lines.\n*   At line 5, you will notice a very important line of code that is\
    \ `public static void main(String[] args)`. It is the Java `main` method and it\
    \ acts as an entry point to our Java Program. Any Java program will only start\
    \ execution process after it encounters this very important line of code. (We\
    \ will discuss more about this line of code in Chapter 4).\n\n### Example 2\n\
    Let’s create another Java class .\n"
