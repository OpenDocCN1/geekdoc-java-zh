  trans: "\n\n*   封装（Encapsulation）是将所有 Java 方法和变量封装成单个单元（`Class` 类）的机制。\n\n![](img/Image00069.jpg)\n\
    \n*   封装有助于保护单元内部的数据，并防止任何恶意活动。\n\n*   在封装中，类的变量被声明为 `private`（第 3 章第 3.4 节解释了\
    \ `private` 访问修饰符）。\n\n为了从类外部访问私有变量，使用了 `get` 和 `set` 方法。`set` 方法用于设置值，`get` 方法用于获取值。\n\
    \n示例➢ 启动 Eclipse IDE -> 创建一个新的 `Class`（我将我的类命名为 `Encap`）。![](img/Image00070.jpg)\n\
    \n在 `Encap` 类中，我声明了两个变量 `username` 和 `password`。由于 `username` 和 `password` 都携带了非常重要且敏感的数据（敏感数据是指那些必须不惜代价隐藏和保护的数据），因此我们将访问修饰符声明为\
    \ `private`，这意味着 `Encap` 类之外任何类无法访问这些变量。为了访问这些私有变量，我们需要 `get` 和 `set` 方法。\n\n\
    ➢ 为了生成变量 `username` 和 `password` 的 `get` 和 `set` 方法，点击 `username` 和 `password`\
    \ 旁边的黄色灯泡图标，并分别选择 Create getter and setter for ‘username’ 和 Create getter and\
    \ setter for ‘password’。![](img/Image00071.jpg)![](img/Image00072.jpg)![](img/Image00073.jpg)![](img/Image00074.jpg)![](img/Image00075.jpg)\n\
    \n这个 `this` 关键字是什么？`this` 关键字引用当前对象。在上面的示例中，类 `Encap` 是 `public` 的，这意味着任何其他类都可以访问\
    \ `Encap` 类，但它的变量是 `private` 的，这意味着除了 `Encap` 类没有类可以访问这些变量。`get` 和 `set` 方法是 `public`\
    \ 的，这意味着任何其他类都可以访问这些方法。\n\n➢ 让我们创建另一个类（我将我的类命名为 `Encap2`）并访问在 `Encap` 类中声明的 `get`\
    \ 和 `set` 方法。![](img/Image00076.jpg)\n\n代码解释：\n\n*   由于类 `Encap` 是 `public` 的，因此类\
    \ `Encap2` 可以轻松地访问它。\n\n在第 6 行，创建了 `Encap` 类对象并访问了它的 `set` 和 `get` 方法。首先，我们在第\
    \ 8 行使用其 `set` 方法为变量 `username` 赋值，然后在第 9 行使用其 `get` 方法获取并打印该值。然后，我们在第 11 行使用其\
    \ `set` 方法为变量 `password` 赋值，然后在第 12 行使用其 `get` 方法获取并打印该值。让我们运行上述代码：![](img/Image00077.jpg)\n\
    \n## 7.2: 继承 (Inheritance)\n\n需要注意的重要点有：\n\n*   继承是一种子类或子类从超父类或父类继承所有属性的机制。\n\
    *   继承的主要用途是代码重用。\n*   子类或子类使用 `extends` 关键字从其父类继承属性。\n\n```\nclass Parent {………………..code…………}\n\
    class Child extends Parent {……………….code………………}\n```\n\n*   子类可以包含它自己的属性，也可以包含其父类的属性。\n\
    \n示例：让我们考虑一个 XYZ 学区包含三所学校：小学、中学和高中，且这三所学校都位于同一条街道的同一个位置。这些学校之间的共同属性是：\n\n1. 它们都是学校或教育机构。\n\
    2. 它们都位于同一条街道上，但有不同的建筑名称和编号。\n3. 它们都属于同一个学区。\n\n![](img/Image00078.jpg)\n\n在编写代码时，与其为每所学校重复编写这些共同信息，我们可以在一个地方写一次（在超类或父类中），并在任何其他类需要它们时调用它们。\n\
    \n示例➢ 启动 Eclipse IDE，创建一个新类（我将我的类命名为 `SchoolSuperClass`），该类将作为超类起作用。 \n ➢ 创建另外三个类，一个用于小学（我将我的类命名为\
    \ `ElementaryChild`），一个用于中学（我将我的类命名为 `MiddleChild`），一个用于高中（我将我的类命名为 `HighChild`）。这三个类将作为超类\
    \ `SchoolSuperClass.java` 的子类作用。 \n ➢ 在超类 `SchoolSuperClass.java` 中，编写以下代码：![](img/Image00079.jpg)\n\
    \n在这个类中，我们声明了所有三所学校通用的变量和方法。\n\n* 打开 `ElementaryChild.java`，并编写以下代码\n\n![](img/Image00080.jpg)\n\
