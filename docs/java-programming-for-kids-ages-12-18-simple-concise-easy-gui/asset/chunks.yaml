    \ meaning that when we will assign a value to variable `x`, that value will in\
    \ turn get assigned to variable `value1`.\n*   At line 13, we passed `y` to `value2`\
    \ meaning that when we will assign a value to variable `y`, that value will in\
    \ turn get assigned to variable `value2`.\n*   At line 16, method `multiply` is\
    \ declared and this method will return the multiplication result.\n*   At line\
    \ 21, Java `main` method is declared (we have discussed about this very important\
    \ line of code in chapter 3 and we will discuss more about this method as we proceed\
    \ further).\n*   At line 22, object `m` is created and values are passed to `Multiply`\
    \ constructor (parameterized constructor created in line 10. Value 10 is assigned\
    \ to instance variable `value1` and other value 10 is assigned to `value2`).\n\
    *   At line 23, method `multiply` is called.\n\nNow let’s run the above piece\
    \ of code![](Image00044.jpg)\n\n## 4.2: Method\n\n*   A Java method is a block\
