  trans: "\n\n*   右键点击 `hello_world` 程序包 -> New -> Class (我将我的类文件命名为 `students`)\n\
    \n![](img/Image00040.jpg)\n\n*   在 `students.java` 中，编写以下代码。\n\n![](img/Image00041.jpg)\n\
    \n代码解释：\n\n*   在第 5 行，我们声明了一个实例变量（在第 3.2 节中解释）名为 `name`，其数据类型（在第 3.3 节中解释）为 `String`。\n\
    \n*   在第 8 行，编写了非常重要的代码 `public static void main(String[] args)`。\n\n请注意：始终记住，Java\
    \ 对象必须在输入这行非常重要的代码后才能进行声明。\n\n*   在第 9、10, 11 行，创建了 `Students` 类的不同对象。\n\n*  \
    \ 通过 `.` 运算符，我们从 `Students` 类中访问变量 `name`。\n\n请注意：要从对象访问类的任何变量或方法，均使用 `.` 运算符。\n\
    \n*   在第 13、14, 15 行，我们将值或数据传递给每个对象的 `name` 变量。\n\n*   在第 17、18, 19 行，我们打印出这些值。\n\
    \n现在让我们运行上面的代码![](img/Image00042.jpg)\n\n# 第 4 章：构造函数与方法\n\n在上一一章中，我们学习了方法的基本概念。在本章中，我们将创建一个包含构造函数和方法的\
    \ Java 程序。\n\n## 4.1: 构造函数\n\n我们在第 3 章第 3.1 节学习了 Java 对象的语法，并了解到 `new` 关键字后面跟着构造函数的调用，那么什么是\
    \ Java 构造函数呢？\n\n*   Java 构造函数是一种特殊的 Java 方法，用于初始化 Java 对象。\n*   Java 构造函数的名称必须与\
    \ Java 类名匹配。\n*   Java 构造函数没有返回值（返回值在第 4.2 节中讨论）。\n*   Java 构造函数在对象创建期间始终会被被调用。如果一个类不包含任何构造函数，那么\
    \ Java 编译器会自动创建一个默认构造函数并执行程序。\n\nJava 构造函数分为两种：\n\n1.  默认构造函数\n2.  带参数构造函数\n\n\
    ### 默认构造函数\n默认构造函数不包含任何参数。\n\n### 带参数构造函数\n带参数构造函数包含参数。\n\n### 什么是参数？\n参数是传递给方法或构造函数的变量。方法或构造函数可以有一个参数或多个参数。\n\
    \n示例 ➢ 启动 Eclipse IDE -> 创建一个新类（我将我的类命名为 `Multiply`![](img/Image00043.jpg)\n\n\
    代码解释：\n\n*   在第 4 行，声明了实例变量（实例变量在第 3 章第 3.2 节中解释）`value1` 和 `value2`。\n*   在第\
    \ 6 行，我们创建了默认构造函数。\n*   在第 10 行，我们创建了带参数构造函数，它接收两个参数 `x` 和 `y`。\n*   在第 12 行，我们将\
    \ `x` 传递给 `value1`，这意味着当给变量 `x` 赋值时，该值反过来会被赋值给变量 `value1`。\n*   在第 13 行，我们将 `y`\
    \ 传递给 `value2`，这意味着当给变量 `y` 赋值时，该值反过来会被赋值给变量 `value2`。\n*   在第 16 行，声明了方法 `multiply`，该方法将返回乘法结果。\n\
    *   在第 21 行，声明了 Java `main` 方法（我们在第 3 章中讨论过这行非常重要的代码，随着学习进行，我们将进一步讨论该方法）。\n* \
    \  在第 22 行，创建了对象 `m` 并值传递给 `Multiply` 构造函数（第 10 行创建的带参数构造函数。值 10 被赋值给实例变量 `value1`，另一个值\
    \ 10 被赋值给 `value2`）。\n*   在第 23 行，调用了方法 `multiply`。\n\n现在让我们运行上面的代码![](img/Image00044.jpg)\n\
    \n## 4.2: 方法\n\n*   Java 方法是执行某些任务的代码块。\n\n示例：让我们考虑一个 `Math` 类，`Math` 包含数字，通过这些数字我们可以执行多个功能，如加法、减法、乘法、除法等。在\
    \ Java 中，我们可以在方法中编写这些函数。\n\n*   Java 方法的签名是：\n`access_modifier return_type method_name\
    \ {……………}` (`access_modifier` 在第 3 章第 3.4 节中讨论)\n\n### Java 中的返回值是什么？\n返回值是方法所返回的值的数据类型。\n\
    \n示例：让我们考虑下面写的方法签名：\n`public int addition ( ) {}`\n在上面的方法签名中，方法名为 `addition`，其返回类型是\
    \ `int`。这意味着 `addition` 方法将返回数据类型为 `int` 的值。为了返回方法的值，使用了 `return` 关键字。\n\n让我们考虑下面写的另一个方法签名：\n\
    `public void show ( ) {}`\n在上面的方法签名中，方法名为 `show`，其返回类型是 `void`。这意味着 `show` 方法不返回任何值。\n\
    \n示例\n\n*   启动 Eclipse IDE -> 在 `hello_world` 包（在第 3 章创建的）中创建一个新类（我将我的类命名为 `Math`![](img/Image00045.jpg)\n\
    *   在 `Math.java` 中编写以下代码。\n\n![](img/Image00046.jpg)\n\n代码解释：\n\n*   在第 3 行，声明了\
    \ `Math` 类，该类包含两个方法 `addition` 和 `subtraction`。\n*   在第 5 行，声明了 `addition` 方法。让我们看看签名![](img/Image00047.jpg)\n\
    *   在第 6 行，我们声明了一个局部变量 `z`（局部变量在第 3 章第 3.3 节中讨论）。\n*   在第 7 行，我们执行算术运算。\n*   在第\
    \ 8 行，通过 `return` 关键字返回 `z` 的值。\n*   第 11–14 行包含 `subtraction`，它遵循与 `addition`\
    \ 相同的过程。\n*   第 17 行包含 main 方法，它作为 `Math` 的入口。\n*   在第 19 行，创建了 `Math` 类的对象 `m`。\n\
