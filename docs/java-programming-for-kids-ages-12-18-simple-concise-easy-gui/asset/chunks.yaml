    \ `Cow.java` 后得到输出：![](img/Image00087.jpg) 在 `Lion.java` 中，第 10 行我们创建了 `Animal`\
    \ 类型的对象 `l` 并调用了 `Lion` 的构造函数。在第 11 行，我们调用了 `eat` 方法。运行 `Lion.java` 后得到输出：![](img/Image00088.jpg)\n\
    \n在两种情况下，我们都看到每个子类的 `eat` 方法都重写了超类的 `eat` 方法。\n\n### 7.3.2: 静态多态\n\n这种类型多态最重要的例子是方法重载（Method\
    \ Overloading）。\n\n*   在方法重载中，一个类可以包含多个具有相同名称但签名不同的方法。\n*   静态多态也被称为编译多态，因为在这种情况下，编译器根据方法签名知道要执行哪个方法，冲突在编译时解决。\n\
