    *   Java is an object oriented programming (OOP) language .


    *   Java is platform independent meaning that it can run on any machine containing
    JVM .


    *   In order to code and execute a Java code, JDK is needed.


    What is object oriented programming or OOP?


    *   Object oriented programming or OOP is all about working with classes , objects
    , methods and variables (explained in Chapter 3 ). 


    *   The most important concepts of OOP are: Encapsulation , Inheritance and Polymorphism
    (explained in Chapter 7 ). 


    What is JDK?


    *   JDK stands for Java Development Kit which is needed to code and execute Java
    .


    *   JDK includes both JVM and JRE.


    ![](Image00002.jpg)What is JRE?


    *   JRE stands for Java Runtime Environment .


    *   JRE contains classes , libraries and software that a Java program needs in
    order to run successfully.


    *   JRE also contains JVM .


    What is JVM?


    *   JVM stands for Java virtual machine .


    *   JVM is responsible for converting the byte code present in .class file into
    machine depended code which is understood by that specific processor or operating
    system or machine.


    JVM ArchitectureJava files are saved with a .java extension. When we compile the
    .java file, .class file is generated and this .class file contains byte code.
    JVM handles the .class file and generates the desired output of the Java program.![](Image00003.jpg)What
    does compilation mean in Java?Java compilation is the process of converting a
    .java file (which contains readable text Java code) into a .class file (which
    contains byte code).What is byte code?Byte codes are sequence of 0s and 1s.![](Image00004.jpg)Let’s
    look into JVM Architecture .JVM architecture is divided into three main sections:


    1.  Class Loader


    2.  JVM Memory


    3.  Execution Engine


    ![](Image00005.jpg)Class LoaderIt is responsible for loading the .class file to
    the JVM memory .JVM MemoryIt is further divided into:


    *   Method area – It stores all the methods information. (methods explained in
    chapter 4 ).


    *   Heap area – It stores all the objects and its corresponding instance variables
    (objects and variables explained in chapter 3 ).


    *   Stack Area – It stores all the local variables and the results of the methods
    (local variables explained in chapter 3 ).


    *   PC Register – PC register store the address of the currently executing Java
    virtual machine instruction.


    *   Native Method Stacks - Native method stacks contains native codes which are
    written in another language instead of Java .


    Execution EngineIt is further divided into:


    *   Interpreter – It converts the byte code to machine dependent code which is
    understood by the machine and desired output is generated.


    *   JIT Compiler – JIT stands for Just in Time compiler and its main task is to
