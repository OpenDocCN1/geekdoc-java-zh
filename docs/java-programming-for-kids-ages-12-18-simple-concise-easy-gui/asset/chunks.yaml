    \ return_type method_name {……………}` (`access_modifier` discussed in section 3.4\
    \ of chapter 3)\n\n### What is return type in Java?\nReturn type is the data type\
    \ of the value returned by the method.\n\nExample: Let us consider the method\
    \ signature written below:\n`public int addition ( ) {}`\nIn the above method\
