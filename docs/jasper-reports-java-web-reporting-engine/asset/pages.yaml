  md: 'In the above file, the resourceBundle attribute of the <jasperReport> element
    elements JasperReports to get the localized strings used for the report. We need
    to create a property file with a name matching the value of the attribute. This
    file must exist anywhere in the CLSPATH when filling the property. In this example,
    the property file localizationdemo.properties is saved under the directory C:\tools\jasperreports-5.0.1\test.
    The contents of this file are as follows:


    ```

    localization.text1=Is English text.

    ```


    To use a different locale, the name of the file must be localizationdemo[locale].properties.
    Here, we will write a file for spanish locale. Save this file as: C:\tools\jasperreports-5.0.1\test\localizationdemo_es.properties..
    The contents of this file are as follows:


    ```

    localization.text1=Este es en Español.

    ```


    The syntax to obtain the value for resourceBundle properties is R${key}. To let
    JasperReports know which locale to use, we need to assign a value to a built-in
    parameter. This parameter''s name is defined as a constant called REPORT_LOCALE,
    and this constant is defined in the net.jasperreports.engine.JRParameter class.
    The constant value must be an instance of java.util.Locale. This logic is incorporated
    in java code to fill and generate the report. Let''s save this file JasperReportFillI18.java
    to C:\tools\jasperreports-5.0.1\src\com\tutorialpoint directory. The contents
    of this file are as follows:


    ```

    package com.tutorialpoint;


    import java.util.HashMap;

    import java.util.Locale;

    ```'
