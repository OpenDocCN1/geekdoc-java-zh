  md: "# JasperReports\n\nconditional styles involve report expressions, and expressions\
    \ can only be interpreted in the context of a single report definition.\n\nReferences\
    \ to style templates are included in JRXML reports as <template> elements. The\
    \ style templates are loaded at report fill, and style name references are resolved\
    \ once all the templates have been loaded. When loading style templates and resolving\
    \ style names to styles, a tree/graph of style templates is created, the top of\
    \ the tree being the set of styles defined in the report. On this tree, style\
    \ name references are resolved to the last style that matches the none in a depth-first\
    \ traversal.\n\n# Example\n\nLet's try out the conditional styles and style templates.\
    \ Let's add the <style> element alternateStyle to our report template (Chapter\
    \ Report designs). Based on the design, font color changes to blue for even count.\
    \ We have also included a style template \"styles.jrtx\". The revised report template\
    \ (jasper_report_template.jrxml) is as follows. set to C:\\tools\\jasperreports-5.0.1\\\
    test:\n\n```\n<xml version=\"1.0\"?>\n<!DOCTYPE Report PUBLIC \"JasperReports/DTD\
    \ Report Design//EN\" \"http://jasperreports.sourceforge.net/dtds/jasperreport.dtd\"\
    >\n\n<JasperReport xmlns=\"http://jasperreports.sourceforge.net/jasperreports\"\
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"\
    http://jasperreports.sourceforge.net/xsd/jasperreport.xsd\" name=\"report_template\"\
    \ pagewidth=\"595\" pageHeight=\"842\" columnWidth=\"515\" leftMargin=\"40\" topMargin=\"\
    50\" bottomMargin=\"50\">\n  <style>styles.jrtx</style>\n  <style name=\"alternateStyle\"\
    \ fontName=\"Arial\" forecolor=\"red\">\n    <conditionExpression>\n      <![CDATA[isBold($V{countNumber}.intValue()\
    \ % 2 == 0)]]]\n    </conditionExpression>\n    <style forecolor=\"blue\" isBold=\"\
    true\"/>\n  </style>\n</style>\n  <parameter name=\"ReportTitle\" class=\"java.lang.String\"\
    />\n  <parameter name=\"Author\" class=\"java.lang.String\"/>\n```\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_154_0.png)"
