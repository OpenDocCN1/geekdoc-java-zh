  md: '# Value Dataset


    This is a special chart dataset implementation that contains a single value and
    is used for rendering Meter and Thermometer charts. The value is collected using
    the <Expression > expression.


    # Chart Plots


    Another JRXML element through all chart types is the <plot> element. This allows
    us to define several of the chart''s characteristics like orientation and background
    color. Plots differ, based on the type of chart.


    # Plot Attribute


    The table below summarizes the attributes of <plot> element:


    | Attribute | Description | Values |

    | --- | --- | --- |

    | bgcolor | This attribute defines the chart''s background color. | Any six digit
    hexadecimal value is a valid value for this attribute. The hexadecimal value must
    be preceded by a # |

    | orientation | This attribute defines the chart''s orientation. | Horizontal
    / Vertical. Default value is "Vertical" |

    | backgroundAlpha | This attribute defines the transparency of the chart''s background
    color. | The valid values for this attribute are between 0 and 1, inclusive. The
    higher the value, the less transparent the background will be. Default value is
    "1." |

    | foregroundAlpha | This attribute defines the transparency of the chart''s foreground
    colors. | The valid values for this attribute include any decimal number between
    0 and 1, inclusive. The higher, the less transparent the background will be. Default
    value is "1." |

    | labelRotation | This attribute allows rotation of text labels on x-axis to rotate
    clockwise or anti-clockwise. This attribute applies only to charts for which the
    x axis is not numeric or does not display days. | Default value is "0.0." |'
