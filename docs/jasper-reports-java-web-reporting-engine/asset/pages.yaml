  md: "# 20. CREATE SUBPORTS\n\nSubreports are one of the nice features of the JasperReports.\
    \ This feature allows incorporating a report within another report, that is, one\
    \ report can be a subreport of another. Subreports help us keep report designs\
    \ simple, as we can create many simple reports and encapsulate them in a master\
    \ report. Subreports are compiled and filled just like normal reports. Any report\
    \ template can be used as a subreport when incorporated into another report template,\
    \ without changing anything inside (of the report template).\n\nSubreports are\
    \ like normal report templates. They are in fact net.sf.jasperreports.engine.JasperObject\
    \ objects, which are obtained after compiling a net.sf.jasperreports.engine.JasperObject.\n\
    \n# <subreport> Element\n\nA subreport is used when introducing subreports into\
    \ master reports. Here is the list of sub-elements in the <subreport> JRXML element.\n\
    \n+   * <parentElement>\n* <parametersMapExpression> : This is used to pass a\
    \ map containing report parameters to the subreport. The map is usually obtained\
    \ from a parameter in the master report, or by using the built-in REPORTS_PARAMETERS_MAP\
    \ to pass parameters to the subreport. This expression should always return a\
    \ java.util.Map object in which keys are the parameter names.\n* <subreportParameter>\
    \ : This element is used to pass parameters to the subreport. It has an attribute\
    \ name, which is mandatory.\n* <connectionExpression> : This is used to pass a\
    \ java.sql.Connection to the subreport. It is used only when the subreport template\
    \ needs a database connection during report filling.\n* <dataSourceExpression>\
    \ : This is used to pass a datasource to the subreport. This datasource is usually\
    \ obtained from a parameter in the master report or by using the built-in REPORT_DATA_SOURCE\
    \ to pass the report's datasource.\nThe elements (connectionExpression and dataSourceExpression)\
    \ cannot be present at the same time in a <subreport> element declaration. This\
    \ is because we cannot supply both a data source and a connection to the subreport.\
    \ We must decide on one of them and stick to it.\n* <returnValue> : This is used\
    \ to assign the value of the subreport's variables to one of the master report's\
    \ variables. This sub-element has attributes as follows:\n    * subreportVariable:\
    \ This attribute specifies the name of the subreport variable whose value is to\
