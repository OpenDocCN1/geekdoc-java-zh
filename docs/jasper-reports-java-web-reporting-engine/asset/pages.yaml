  md: '# JasperReports


    +   - <anchorNameExpression>: This element creates the target for the anchor.

    - <hyperlinkReferenceExpression>: This element contains a report expression indicating
    the name of the external resource (usually a URL).

    - <hyperlinkAnchorExpression>: Hyperlink points to an anchor in an external resource.

    - <hyperlinkPageExpression>: Hyperlink points to a page in the current report.

    - <hyperlinkTooltipExpression>: This element controls the ToolTip of hyperlink.
    The type of the expression should be java.lang.String.

    - <hyperlinkParameter>: This element when present generates a final hyperlink
    depending on the parameter values.


    # Chart Attributes


    Attributes in the <chart> element available for all chart types:


    +   - isShowLegend: This attribute is used to determine, if a chart legend will
    be displayed on the report. Values could be *true* or *false*. Default value is
    *true*.

    - evaluationTime: Determines when the chart will be evaluated. Values could be
    *Now, Report, Page, Column, Group, Band*. Default value is *Now*.

    - evaluationGroup: This attribute determines the name of the group to be used
    to evaluate the chart''s expressions. The value for this attribute must match
    the name of the group, we we would like to use as the chart''s evaluation.

    - hyperlinkType: This attribute can hold any text value. Default value is *None*.
    This means, the text fields not the images represent hyperlinks, even if the special
    hyperlinks are present.

    - hyperlinkTarget: This attribute helps to customize the specified link when it
    is clicked in the viewer. Values could be *Self* or *Blank*. Default value is
    *Self*.

    - bookmarkLevel: This attribute when set to a positive integer, generates bookmarks
    in the reports exported to PDF. Default value is *0*.

    - customizerClass: This is the name of a class (optional) that can be used to
    customize the chart. The value for this element must be a String containing the
    name of a customizer.


    # Chart Customization


    As mentioned above, JasperReports use JFreeChart as the underlying charting library.
    JFreeChart contains features that are not supported by JasperReports. We can take
    advantage of these features by using a customizer via the customizerClass attribute
    in <chart> element. A customizer is nothing, but an implementation of the net.sf.jasperreports.engine.JRCustomizer
    interface. The easiest way to implement this interface is by extending the net.sf.jasperreports.JRAAbstractChartCustomizer
    class and having access to parameters, fields, and variables for more flexible
    chart customization based on report data.


