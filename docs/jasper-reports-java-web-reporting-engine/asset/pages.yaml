  md: '# 9. REPORTS PARAMETERS


    The main input for filling report are: report template, parameters, and data sources.
    This chapter will describe the parameters and in the next chapter we will discuss
    the data sources.


    Parameters are the object references, those are passed during report-filling operations
    to the report engine. The data which cannot be passed through the data source,
    can be passed by using parameters. Data like author name, title of the report,
    etc. can be passed through parameters. A JasperReports template or JRXML template
    can have zero or more parameter elements.


    # Parameter Declaration


    Parameter declaration as follows:


    ```

    <parameter name="exampleParameter" class="java.lang.String" />

    ```


    # The Name Attribute


    The name attribute of the <parameter> element is mandatory. It references the
    parameter in report expressions by name. Parameter name should be a single word.
    It should not contain any special characters like dot or comma.


    # The Class Attribute


    The class attribute is also mandatory and specifies the class name for the parameter
    values. Its default value is java.lang.String. This can be changed to any class
    available at runtime. Irrespective of the type of report parameter, the engine
    takes care of casting in the report expressions where the $P{} token is used,
    making the manual casts unnecessary.


    The report parameter values are always packed in a java.util.Map object, which
    has the parameter name as its key. Report parameters can be used in the query
    string of the report, so as to further customize the data set, retrieved from
    the database. These act like dynamic filters in the query that supplies data for
    the report.


    # Built-in Parameters


    Following are the pre-defined report parameters, ready to use in the expressions:


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_55_0.png)'
  merge: -1
