  md: '# 11. REPORT FIELDS


    Report fields are elements, which represent mapping of data between datasource
    and report template. Fields can be combined in the report expressions to obtain
    the desired output. A report template can contain zero or more <field> elements.
    When declaring report fields, the data source should supply data corresponding
    to all the fields defined in the report template.",


    # Field Declaration


    Field declaration is done as shown below:


    ```

    <field name="FieldName" class="java.lang.String"/>

    ```


    # The Name Attribute


    The name attribute of the <field> element is mandatory. It references the field
    in report expressions by name.


    # The Class Attribute


    The class attribute specifies the class name for the field values. Its default
    value is java.lang.String. This can be changed to any class available at runtime.
    Irrespective of the type of a report field, the engine takes care of casting in
    the report expressions using the F{} token used, making manual casts unnecessary.


    # Field Description


    The <fieldDescription> element is an optional element. This is very useful when
    implementing a custom data source. For example, we can store a key or information,
    by which we can retrieve the value from the custom data source at runtime. By
    using the <fieldDescription> element instead of the field name, you can easily
    overcome restrictions of field-naming conventions when retrieving the field values
    from the data source.


    Following is a piece of code from our existing JRML (Chapter Report Designs).
    Here we can usage of name, class, and fieldDescription elements.


    ```

    <field name="country" class="java.lang.String">

    <fieldDescription><![CDATA[country]]]></fieldDescription>

    </field>

    <field name="name" class="java.lang.String">

    <fieldDescription><![CDATA[name]]></></fieldDescription>

    </field>

    ```


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_69_0.png)'
