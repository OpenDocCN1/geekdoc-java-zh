  md: '# JasperReports


    +   - lib: Contains all JARs needed, both to build JasperReports and to use it
    in our applications.

    - src: Contains the JasperReports source code.

    - build.xml: An ANT build file to build the JasperReports source code. If we don''t
    intend to modify JasperReports, we don''t need to use this file since JasperReports
    is distributed in the compiled form.

    - changes.txt: A text document, explaining the differences between the current
    and previous versions of the JasperReports class library.

    - license.txt: A text document that contains the full text of the LGPL (Lesser
    General Public License) license.

    - readme.txt: A text document, containing instructions on how to build and execute
    the supplied examples.


    Basically, we use the jasperreports-x.x.jar under the dist and JARs under the
    lib directory for generating reports. As JasperReports being an open source tool,
    if any defect or bug is recognized during execution in the jasperreports-x.x.jar,
    we can fix it and build the JAR again using the building.xml file.


    # Set the CLSPATH


    To use JasperReport, we need to set the following files to our CLSPATH:


    +   - jasperreports-x.x.jar, where x.x is the JasperReports version. This is found
    under directory C:\tools\jasperreports-x.x\dist.

    - All the JAR files under the lib subdirectory (C:\tools\jasperreports-x.x\lib).


    At the time of installation, we used Jasper Report version 5.0.1. Right-click
    on '' My Computer and select ''Properties'', click on the ''Environment variables''
    button under the ''Advanced'' tab. Now update the ''Path'' variable with this
    C:\tools\jasperreports-5.0.1\dist\jasperreports-5.0.1.jar;C:\tools\jasperreports-5.0.1\lib.
    Now you are ready to create your reports.


    In all the examples in this tutorial, we used ANT tasks to generate reports. The
    build file takes care of importing all the required JARs for generating reports.
    Hence, setting CLSPATH as mentioned above will only help those who wish to generate
    reports without using ANT.


