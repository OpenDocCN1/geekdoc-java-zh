  md: 'JasperReports, working with texts needs some dedicated tools to process both
    the character representations and the text formatting properties. Any text can
    be considered as a character sequence with a particular representation structure.
    The text appearance consists in both layout (and paragraph) and font settings.
    While in most cases, the text layout remains invariant, font settings may change
    when running the report in different Locations.


    We know that different languages need different character sets with respect to
    specific characters representation. Therefore, working with texts means working
    with fonts. However, a detailed discussion about how to use fonts in JasperReports
    is available in the chapter


    +   * Report Fonts.


    One of the main features concerning the text content in a given report is the
    possibility to internationalize it. It means, we can run the report in different
    localized environments, using different languages and other localization settings
    without any hardcoded modification. Character encoding is an important feature
    when a report is intended to be internationalized.


    # Character Encoding


    A character is the smallest unit of writing conveying a meaningful information.
    It is an abstract concept, a character does not have a visual appearance. “Uppercase
    Latin A” is a different character from “lowercase Latin a” and “uppercase Cyrillic
    A” and “uppercase Greek Alpha”.


    A visual representation of a character is known as a glyph. A set of glyphs is
    called a font. “Uppercase Latin A”, “uppercase Cyrillic A” and “uppercase Greek
    Alpha” may have identical glyphs, but they are different. At the same time, the
    glyphs for “Uppercase Latin A” can look very different in Times Roman, Gill and
    Poetica encry, but they still represent the same character.


    The set of available characters is called a character repertoire. The location
    (index) of a given character is written as its code position or code point. The
    method of numerically representing a code point within a repertoire is called
    the character encoding.


    Encodings are normally expressed in terms of octets. An octet is a group of eight
    digits, i.e., eight ones and zeros. An octet can express a numeric range between
    0 and 255, or between 0x00 and 0xFF, to hexadecimal notation.


    # Unicode


    A Unicode is a character repertoire that contains most of the characters used
    in the languages of the world. It can accommodate millions of characters, and
    already contains hundreds of thousands. Unicode is divided into “planes” of 64K
    characters. The only one used in most circumstances is the first plane, known
    as the basic multilingual plane, or BMP.


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_143_0.png)'
