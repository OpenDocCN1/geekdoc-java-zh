    Any number of scripts can be specified per report; if no script is specified then
    the engine creates a single JRDefaultScriptlet instance and registers it with
    the built-in REPORT_SCRIPTLET parameter.


    We can add any additional methods that we need to our scripts. Reports can call
    these methods by using the built-in REPORT_SCRIPTLET.


    # Global Scriptlets


    We can associate scriptlets in another way to reports, which is by declaring the
    scriptlets globally. This makes the scriptlets apply to all reports being filled
    in the given JasperReports deployment. This is made easy by the fact that scriptlets
    can be added to JasperReports as extensions. The scriptlet extension point is
    represented by the net.sf.jasperreports.engine.ScriptletFactory interface. JasperReports
    will load all scriptlet factories available from extensions at runtime, then will
    ask each one of them for the list of scriptlets instances that they want to apply
    to the current report that is running. When asking for the list of scriptlet instances,
    the engine gives some context information that the factory could use in order
    to decide, which scriptlets actually apply to the current report.


    # Report Governors


    Governors are just an extension of global scriptlets that enable us to tackle
    a problem of report entering infinite loop while generating reports. Invalid report
    templates cannot be detected at design time, because most of the time, the conditions
    for entering the infinite loop depend on the actual data that is fed into the
    engine at runtime. Report Governors help in deciding whether certain report has
    entered an infinite loop and they can stop it. This prevents resource exhaustion
    for the machine that runs the report.


    JasperReports has two simple report governors that will report report execution
    based on a specified maximum number of pages or a specified timeout interval.
    They are:


