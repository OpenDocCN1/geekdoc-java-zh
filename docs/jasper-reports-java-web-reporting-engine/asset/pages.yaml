    The details of the above file are as follows: <crosstab> element.


    +   - Crosstab is defined by the <crosstab> element.

    - <rowGroup> element defines a group to split the data into rows. Here, each row
    will display data for a different name.

    - The <bucket> and <bucketExpression> elements define what report expression to
    use as a delimiter for <rowGroup>. Here, we used the name field as a delimiter,
    to split the rows by name.

    - The <rosstabHeader> element defines the expression to be used as a row header.
    It contains a single sub-element, namely <cellContents>, which acts like an inner
    band inside <crosstabHeader>. Instead of defining variable for the text field
    inside <crosstabHeader>, we have assigned the name to the text field <rowGroup>
    (via its name attribute), hence it creates an implicit variable. The <crosstabHeader>
    element defines the contents of the header cell for the entire row.

    - The <columnGroup> element as well as its sub-elements are analogous to the <rowGroup>
    element, except that it influences columns instead.

    - The <measure> element defines the calculation to be performed across rows and
    columns. The *calculation* attribute is set to *Count*.

    - The <crosstabCell> element defines how data in non-header cells will be laid
    out. This element also contains a single <crosstabCell> element as its only sub-element.


