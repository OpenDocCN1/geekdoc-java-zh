  md: '# JasperReports


    +   * bar3DChart: Wraps a Category dataset and a Bar 3D plot.

    * xyBarChart: Supports Time Period datasets, Time Series datasets, and XY datasets,
    and uses a Bar plot to render the axis and the items.

    * stackedBarChart: Uses data from a Category dataset and renders its content using
    a Bar plot.

    * stackedBar3DChart: Uses data from a Category dataset and renders its content
    using a 3D plot.

    * lineChart: Groups a Category dataset and a Line plot.

    * xyLineChart: Groups an XY dataset and a Line plot.

    * areaChart: Items from a Category dataset are rendered using an Area plot.

    * stackedAreaChart: Items from a Category dataset are rendered using an Area plot.

    * xyAreaChart: Uses data from an XY dataset and renders it through an Area plot.

    * scatterChart: Wraps an XY dataset with a Scatter plot.

    * bubbleChart: Combines XZ dataset with a Bubble plot.

    * timeSeriesChart: Groups a Time Series dataset and a Time Series plot.

    * highLowChart: A combination of a High-Low dataset and a High-Low plot.

    * candlestickChart: Uses data from a High-Low dataset, but with a special candlestick
    plot.

    * meterChart: Displays a single value from a Value dataset on a dial, using rendering
    options from a Meter plot.

    * thermometerChart: Displays the single value in a Value dataset using rendering
    options from a Thermometer plot.

    * multiAxisChart: Contains multiple range axes, all sharing a common domain axis.


