  md: 'Report expressions are the powerful features of JasperReports, which allow
    us to display calculated data on a report. Calculated data is the data that is
    not a static data and is not specifically passed as a report parameter or datasource
    field. Report expressions are built from combining report parameters, fields,
    and static data. The Java language is used for writing report Groovy expressions
    by default. Other scripting languages for report expressions like Groovy scripting
    language, JavaScript, or BeanShell script are supported by JasperReports.


    This chapter will explain you — how report expressions work, assuming that they
    have been written using the Java language only. In a JXRL report template, there
    are several elements that define expressions as:


    +   - <variableExpression>

    - <initialValueExpression>

    - <groupExpression>

    - <printWhenExpression>

    - <imageExpression>

    - <textFieldExpression>


    # Expression Declaration


    Basically, all report expressions are Java expressions, which can reference the
    report fields, report variables, and report parameters.


    # Field Reference in Expression


    To use a field reference in an expression, the name of the field must be put between
    **$F{and} character sequences, as shown below:


    ```

    <textFieldExpression>

    $F{Name}

    </textFieldExpression>

    ```


    Following is a piece of code from our existing JRXML file (chapter **Report Designs**):


    ```

    <textFieldExpression class="java.lang.String">

    <![CDATA[$F{country}]]>

    </textFieldExpression>

    ```


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_80_0.png)'
