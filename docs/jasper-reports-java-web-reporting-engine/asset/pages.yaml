    +   - <itemHyperLink> - sets hyperlinks associated with the chart items.


    # Time Period Dataset


    A time period dataset is characterized by the <timePeriodSeries> element, which
    contains:


    +   - <seriesExpression> - indicates the name of the series. This expression can
    return any java.lang.Comparable object.


    +   - <startDateExpression> - specifies the beginning of the date interval with
    which the numeric value will be associated when it is added to the time period
    series.


    +   - <endDateExpression> - specifies the end of the date interval with which
    the numeric value will be associated when it is added to the time period series.


    +   - <valueExpression> - returns the java.lang.Number to associate with the current
    date interval specified by the start date and end expressions.


    +   - <labelExpression> - if this expression is missing, the chart will display
    default labels for each item in the chart. Use this expression, which returns
    java.lang.String values, to customize the item labels for the chart.


    +   - <itemHyperLink> - sets hyperlinks associated with the chart items.


    # High Low Dataset


    A high low dataset is characterized by the following expressions:


    +   - <seriesExpression> - currently, only one series is supported inside a High-Low
    or Candlestick chart. However, this single series must be identified by a java.lang.Comparable
    value returned by this expression, and it must also be used as the series name
    in the chart''s legend.


    +   - <dateExpression> - returns the date to which the current (high, low, open,
    value) item period refers.


    +   - <highExpression> - returns a java.lang.Number value, which will be part
    of the data item added to the series when the dataset gets incremented.


    +   - <lowExpression> - returns a java.lang.Number value, which will be part of
    the data item added to the series when the dataset gets incremented.


    +   - <openExpression> - returns a java.lang.Number value, which will be part
    of the data item added to the series when the dataset gets incremented.


    +   - <closeExpression> - returns a java.lang.Number value, which will be part
    of the data item added to the series when the dataset gets incremented.


    +   - <volumeExpression> - a numeric expression that returns the volume value
    to use for the current data item. It is used only for Candlestick charts.


    +   - <itemHyperLink> - sets hyperlinks associated with chart items.


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_198_0.png)'
