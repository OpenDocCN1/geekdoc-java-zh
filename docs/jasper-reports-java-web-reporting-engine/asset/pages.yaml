  md: "# JasperReports\n\nimplemented by the class: net.sf.jasperreports.ant.JRAntCompileTask.\
    \ Its syntax and behavior are very similar to the built-in <javac> ANT task.\n\
    \n# Template Compilation\n\nLet's add new compileoreportdesing to our existing\
    \ build.xml. Here, the source folder is specified using a nested <src> tag with\
    \ the filesets. The nested source tag allows compiling report templates that are\
    \ scattered through many different locations and are not grouped under a single\
    \ root report folder. Below is the revised build.xml:\n\n```\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<project name=\"JasperTest\" default=\"compileoreportdesing\"\
    \ basedir=\">\n  <import file=\"basebuild.xml\" />\n  <target name=\"viewDesign\"\
    \ description=\"Design viewer is launched\n    to preview the compiled report\
    \ design.\">\n    <java className=\"net.sf.jasperreports.view.JasperDesignViewer\n\
    \      fork=\"true\" />\n    <arg value=\"-F$(file.name).jasper\" />\n    <classpath\
    \ refid=\"classpath\" />\n    </java>\n  </target>\n\n  <target name=\"compileoreportdesing\"\
    \ description=\"Compiles the JXML\nfile and produces the .jasper file.\">\n  \
    \  <taskdef name=\"jrc\"\n      className=\"net.sf.jasperreports.ant.JRAntCompileTask\"\
    >\n      <classpath refid=\"classpath\" />\n    </taskdef>\n    <jrc destdir=\"\
    .\">\n      <src>\n        <fileset dir=\".\">\n          <include name=\"*.jrxml\"\
    \ />\n        </fileset>\n      </src>\n      <classpath refid=\"classpath\" />\n\
    \    </jrc>\n  </target>\n</project>\n```\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_27_0.png)"
