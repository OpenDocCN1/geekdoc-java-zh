  md: '# Font Types


    In JasperReports fonts can be categorized as:


    +   - **Logical Fonts:** Five font types, which have been recognized by the Java
    platform since version 1.0, are called logical fonts. These are Serif, SansSerif,
    Monospaced, Dialog, and DialogInput. These logical fonts are not actual font libraries
    that are installed anywhere on the system. They are merely font recognized by
    the Java runtime. These must be mapped to some physical font that is installed
    on the system.

    - **Physical Fonts:** These are the actual font libraries consisting of, for example,
    TrueType or PostScript Type 1 fonts. The physical fonts may be Arial, Helvetica,
    Courier, or any number of other fonts, including international fonts.

    - **Font Extensions:** The JasperReports library can use of fonts registered on-the-fly
    at runtime, using its built-in support for font extensions. A list of font families
    can be made available to JasperReports using font extension. These are made out
    of similarly looking fonts and supporting specific locales.


    As described in the table above, we need to specify in the attribute contractName
    the name of a physical font, the name of a logical font, or the name of a font
    family from the registered JasperReports font extensions.


    # PDF Font Name


    JasperReports library uses the iText library, when exporting reports to PDF(Portable
    Document Format). PDF files can be viewed on various platforms and will always
    look the same. This is partially because in this format, there is a special way
    of dealing with fonts. **fontName** attribute is of no use when exporting to PDF.
    Attribute **pdfFontName** exist where we need to specify the font settings.


    The iText library knows how to deal with built-in fonts and TTF files and recognizes
    the following built-in font names:


    +   - Courier

    - Courier-Bold

    - Courier-BoldOblique

    - Courier-Oblique

    - Helvetica

    - Helvetica-Bold

    -Helvetica-BoldOblique

    - Symbol

    - Times-Roman

    - Times-Bold

    - Times-BoldItalic


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_131_0.png)'
  merge: -1
  pgno: 131
- img_proc: true
  md: '# JasperReports


    +   * Times-Italic

    * ZapfDingbats


    As per iText library pre-requisite, to work with fonts we need to specify one
    of the following as the font name:


    +   * A built-in font name from the above list.

    * The name of a TTF (True Type Font) file, which it can locate on disk.

    * The real name of the font, provided that the TTF file containing the font has
    previously registered with iText or that an alias was defined when the font was
    registered.


    Based on the above pre-requisites, the pdfFontName attribute can contain one of
    the following values:


    +   * The name of a built-in PDF font from the above list.

    * The name of a TTF file that can be located on disk at runtime when exporting
    to PDF.

    * The real name of a registered font.

    * The suffix of the key (the part after net.sf.jasperreports.export.pdf.font)
    for a font registered with iText as a font file.


    # Default Fonts and Inheritance


    Each element inherits font and style attributes from its parent element, which
    inherits these attributes from its parent. If no styles and/or fonts are defined
    for elements, the default style (and/or font - but this is now deprecated) declared
    in the <JasperReport> root element will be inherited.


    Defining default styles or fonts in JasperReports is not mandatory. If no font
    is defined for a given element, the engine looks either for the inherited font
    attributes, or if no attributes are found on this way, it looks for /src/default.jasperreports.properties
    file. Its value defines the name of the font family to be used when font properties
    are not explicitly defined for a text element or inherited from its parent.


    The main default font properties and their values defined in the /src/default.jasperreports.properties
    file are in the following table:


    | Property | Description |

    | net.sf.jasperreports.default.font.name=SansSerif | The default font name. |

    | net.sf.jasperreports.default.font.size=10 | The default font size. |

    | net.sf.jasperreports.default.pdf.font.name=Helvetica | The default PDF font.
    |

    | net.sf.jasperreports.default.font.encoding=Cp1252 | The default PDF character
    encoding. |

    | net.sf.jasperreports.default.pdf.embedded=false | By default PDF fonts are not
    embedded. |


