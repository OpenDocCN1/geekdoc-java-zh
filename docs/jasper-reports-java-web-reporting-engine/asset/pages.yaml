  md: '# JasperReports


    As you have seen, the parameter, field, and variable references are in fact Java
    objects. Knowing their class from the parameter, field, or variable declaration
    made in the report template, we can even call methods on object references in
    the expressions.


    The following example shows — how to extract and display the first letter from
    java.lang.String report field "Name":


    ```

    <textFieldExpression>

    $F(Name).substring(0, 1)

    </textFieldExpression>

    ```


    # Resource Bundle Reference in Expression


    To reference a resource in an expression, the key should be put between $R{and}
    as shown in the example given below:


    ```

    <textFieldExpression>

    $R(report.title)

    </textFieldExpression>

    ```


    Based on the runtime-supplied locale and the report.title key, the resource bundle
    associated with the report template is loaded. Hence, the title of report is displayed
    by extracting the String value from the resource bundle. More on internationalization
    can be found in the chapter Internationalization.


    # Calculator


    Calculator is an entity in JasperReports, which evaluates expressions and increments
    variables or datasets at report-filling time. During compiling process, the information
    is produced and stored in the pool by the report compiler. This information is
    used during the report-filling time to build an instance of the net.sf.jasperreports.engine.fillJRCalculator.


    Java source file is generated and compiled by Java-based report compilers on the
    fly. This generated class is a subclass of JRCalculator, and the bytecode produced
    compiling it is stored inside the JasperReport object. This bytecode is loaded
    at report filling time and the resulting class is instantiated to obtain the calculator
    object needed for expression evaluation.


    # Conditional Expressions


    JasperReports doesn''t support if-else statements when defining variable expressions.
    Instead, you can use the ternary operators {cond} ? {statement 1} : {statement
    2}. This operator can be nested inside a Java expression to obtain the desired
    output based on multiple conditions.


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_82_0.png)'
