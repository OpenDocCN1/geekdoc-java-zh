  md: "# JasperReports\n\n+   toVariable: This attribute specifies the name of the\
    \ parent report variable whose value is to be copied/incremented with the value\
    \ from the subreport.\n\n+   calculation: This attribute can take values: Nothing,\
    \ Count, DistinctCount, Sum, Average, Lowest, Highest, StandardDeviation, Variance.\
    \ Default value for calculation is \"Nothing\"\n\n+   incrementerObjectClass:\
    \ This attribute specifies the factory class for creating the incrementer instance.\n\
    \n+   <subreportExpression>: This indicates where to find the compiled report\
    \ template for the subreport. This element has a class attribute. The class attribute\
    \ can take any of these values:java.lang.String, java.io.File, java.net.URL, java.io.InputStream,\
    \ net.sf.jasperreports.engine.JasperReport. Default value is java.lang.String.\n\
    \n+   isCaching: This is an attribute of the <subreport> element. This is a Boolean,\
    \ when set to true, the reporting engine will recognize to previously loaded subreport\
    \ template objects, using their specified source. This caching functionality is\
    \ available only for subreport elements that have expressions returning java.lang.String\
    \ objects as the subreport template source, representing file names, URLs, or\
    \ classpath resources.\n\n# Example\n\nLet us take a simple example to demonstrate\
    \ creation of subreports using JRDataSource. Let's first write two report templates,\
