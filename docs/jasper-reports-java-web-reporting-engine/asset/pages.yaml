  md: "# 5. JASPERREPORTS - COMPILING REPORT DESIGN\n\nWe have generated the JasperReport\
    \ template (JRXML file) in the previous chapter. This file cannot be used directly\
    \ to generate reports. It has to be compiled to JasperReport' native binary format,\
    \ called Jasper file. On compiling, we transform JasperDesign object into JasperReport\
    \ object:\n\n```\nnet.sf.jasperreports.engine.design.JasperDesign objects\n```\n\
    \n```\nnet.sf.jasperreports.engine.JasperReport objects\n```\n\nnet.sf.jasperreports.engine.design.JRCompiler\
    \ plays a central role during compilation. This interface has several implementations\
    \ depending on the language used for report expressions, which can be written\
    \ in Java, Groovy, JavaScript, or any other scripting language as long as compiler\
    \ implementation can evaluate it at runtime.\n\nWe can compile JRXML file in the\
    \ following ways:\n\n+   * Programmatic compilation.\n* Compilation through ANT\
    \ task.\n\n# Programmatic Compilation of JRXML\n\nJasperReports API offers a facade\
    \ class net.sf.jasperreports.engine.JasperManager for compiling a JasperReport.\
    \ This class consists of several public static methods for compiling report templates.\
    \ The source of templates can be files, input streams and memory objects.\n\n\
    The contents of the JRXML file (report_template.jrxml) are as follows. It is saved\
    \ at directory C:\\toolsjasperreports-5.0.1\\test:\n\n```\n<xml version=\"1.0\"\
    \ encoding=\"UTF-8\"?>\n<!DOCTYPE jasperReport PUBLIC \"////JasperReports//DTD\
    \ Report Design//EN\" \n  \"http://jasperreports.sourceforge.org/dtds/jasperreport.dtd\"\
    >\n<jasperReport xmlns=\"http://jasperreports.sourceforge.org/net/jasperreports\"\
    \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\nxsi:noNamespaceSchemaLocation=\"\
    http://jasperreports.sourceforge.org/net/jasperreport\"\nhttp://jasperreports.sourceforge.net/xsd/jasperreport.xsd\"\
    \nname=\"report_template\" language=\"groovy\" pagewidth=\"595\">\n```\n\n15\n\
