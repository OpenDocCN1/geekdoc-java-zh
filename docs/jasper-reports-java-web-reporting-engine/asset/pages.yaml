    +   - <xExpression - returns the java.lang.Number representing the X value from
    the (x, y) pair that will be added to the current data series.


    +   - <yExpression > returns the java.lang.Number representing the Y value from
    the (x, y) pair that will be added to the current data series.


    +   - <labelExpression > if this expression is missing, the chart will display
    default labels for each item in the chart. This expression, returns java.lang.String
    values, to customize the item labels for the chart.


    +   - <itemHyperlink - sets hyperlinks associated with the chart items.


    # XYZ Dataset


    An XYZ dataset is characterized by the <xyzSeries> element, which contains:


    +   - <seriesExpression - indicates the name of the series. This expression can
    return any java.lang.Comparable object.


    +   - <xExpression > returns the java.lang.Number representing the X value from
    the (x, y, z) item that will be added to the current data series.


    +   - <yExpression > returns the java.lang.Number representing the Y value from
    the (x, y, z) item that will be added to the current data series.


    +   - <zExpression > returns the java.lang.Number representing the Z value from
    the (x, y, z) item that will be added to the current data series.


    +   - <labelExpression > if this expression is missing, the chart will display
    default labels for each item in the chart. This expression, returns java.lang.String
    values, to customize the item labels for the chart.


    +   - <itemHyperlink - sets hyperlinks associated with the chart items.


    # Time Series Dataset


    A time series dataset is characterized by the timePeriod attribute, and the <timeSeries>
    element. The timePeriod attribute specifies the type of the data series inside
    the dataset. Time series can contain numeric values with days, months, years,
    or predefined time periods. Possible values are: Year, Quarter, Month, Week, Day
    - this is the default value, Hour, Minute, Second, Millisecond.


    The <timeSeries> element contains:


    +   - <seriesExpression - indicates the name of the series. This expression can
    return any java.lang.Comparable object.


    +   - <timeExpression > returns a java.util.Date value which the engine will extract
    the corresponding time period depending on the value set for the timePeriod mentioned
    above.


    +   - <valueExpression > returns the java.lang.Number value to associate with
    the corresponding time period value when incrementing the current series of the
    dataset.


    +   - <labelExpression > if this expression is missing, the chart will display
    default labels for each item in the chart. This expression, returns java.lang.String
    values, to customize the item labels for the chart.


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_197_0.png)'
