  md: '# Sort Fields


    At the times when sorting is required and the data source implementation doesn''t
    support it (for e.g. CSV datasource), JasperReports supports in-memory field-based
    data source sorting. The sorting can be done using one or more <sortField> elements
    in the report template.


    If least one sort is specified, during report process, the data source is passed
    to a JRRSortableDataSource instance. In this turn, fetches all the records from
    data source, performs in memory sort according to the specified fields, and replaces
    the original data source.


    The sort field name should be identical to the report field name. Fields used
    for sorting should have types that implement java.util.Comparable. Natural order
    sorting is performed for all fields except those of java.lang.String (for String
    type, collator corresponding to the report fill local is used). When severalFields
    are specified, the sorting will be performed using the fields sort keys in the
    order which they appear in the report template. The following example demonstrates
    the sorting feature.


    # Sorted Report Example


    Let''s add the <sortField> element to our existing report template (Chapter Report
    designs). Let''s sort field country in descending order. The revised report template
    (jasper_report_template.jrxml) is as follows. We set it to C:\tools\jasperreports-5.0.1\test
    directory:


