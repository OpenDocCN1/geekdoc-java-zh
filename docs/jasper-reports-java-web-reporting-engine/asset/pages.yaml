  md: '# JasperReports


    The <plot> element has a subelement <seriesColor> which attributes are: seriesOrder
    and color. This element customizes colors for series, and its position within
    the color sequence.


    # Specific Settings for Chart Plots


    +   - piePlot: It has no specific settings

    - pie3DPlot: Contains the depthFactor attribute, a numeric value ranging from
    0 to 1 that represents the depth of the pie as a percentage of the height of the
    plot

    - barPlot: Can show or hide tick labels, tick marks or item labels, and provides
    settings for both axis.

    - bar3DPlot: provides the same settings as the barPlot, and generates a 3D effect
    using the xOffset and yOffset attributes.

    - linePlot: Can show or hide connecting points, can show or hide shapes with item
    points, and provides settings for both axis.

    - scatterPlot: Similar to the linePlot, it can show or hide connecting points,
    can show or hide shapes associated with item points, and provides settings for
    both axes.

    - areaPlot: Provides settings for both axis.

    - bubblePlot: Can set the bubble dimensions by setting the scaleType attribute,
    and provides settings for both axes.

    - timesSeriesPlot: Can show or hide connecting item points, can show or hide shapes
    associated with item points, and provides settings for both axis.

    - highLowPlot: Can show or hide open ticks, can show or hide close ticks, and
    provides settings for both axis.

    - candlestickPlot: Can show or hide the volume, and provides settings for both
    axis.

    - meterPlot: Contains specific settings for the dial shape, scale angle, measurement
    units, tick interval, dial color, needle color, tick color, value display font,
    color and format pattern, data range, and meter intervals.

    - thermometerPlot: Contains specific settings for the location memory, mercury
    color, show/hide value lines, value display font, color and format pattern, data
    range, low range, and high range.

    - multiAxisChart : Contains specific settings for axis included in the plot.


    # Types of Charts


    JasperReports offers built-in support for several chart types. They are listed
    as below:


    +   - pieChart: A combination of a Pie dataset and a Pie plot.

    - pie3DChart: Groups a Pie dataset and a Pie 3D plot.

    - barChart: A basic combination of a Category dataset and a Bar plot.


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_200_0.png)'
