  md: '# JasperReports


    UTF-8 is the recommended encoding. It uses a variable number of octets to represent
    different characters.


    In a JRXML file, the encoding attribute is specified in the header. It is used
    at report compilation time to decode the XML content. For instance, if the report
    contains French words only characters such as c, é, ê, then the ISO-8859-1 (a.k.a
    Latin-1) encoding is sufficient:


    ```

    <xml version="1.0" encoding="ISO-8859-1">

    ```


    As seen above, ideally we can choose the encoding to the minimal character set,
    which can correctly represent all the characters in the document. But in case
    of Multilingual documents (i.e. documents containing words spelled in several
    languages), one should choose the encoding adapted to the minimal character set,
    to correctly represent all the characters in the document, even if they belong
    to different languages. One of the encoding adapted de handling multilingual documents
    is the UTF-8, used as default encoding by JasperReports.


    The texts are kept in resource bundle files rather than within the document internationalization.
    So, there are cases where the JRXML itself looks completely ASCII-compatible,
    but generated reports at runtime contain texts unless without ASCII. As a result,
    for a certain type of document export formats (such as CSV, HTML, XML, and text)
    one has to know the encoding for the generated document. Different languages are
    supported by different characters. Each time, we need to run a report in a localized
    environment. Further, we have to know which is the most appropriate character
    encoding for the generated document language. In this case, the encoding property
    defined in the JRXML file itself might be no useful.


    To solve this kind of issues we can use an export custom property known as net.sf.jasperreports.export.character.encoding.
    This export custom property is default to UTF-8 and options at export time, the
    CHARACTER_ENCODING export parameter is also available.


    # Example


    To demonstrate unicode support in runtime JasperReports, let''s write new report
    template (jasper_template.jrxml). **Save it to C:\tools\jasperreports-5.0.1\test**
    directory. Here, we will display in different languages using the Unicode characters
    (uXXXX). Any character encoded with UTF-8 can be represented using its 4-digits
    hexadecimal code. For instance, the Greek letter ξ can be written as \u0393. When
    such a notation is entered, the engine allows for the appropriate representation
    in the character set, only that particular character will be printed. The contents
    of the JRXML are as follows:


    ```

    <xml version="1.0" xmlns="http://jasperreports.sourceforge.net/jasperreports"

    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"

    si:noSchemaLocation="http://jasperreports.sourceforge.net/jasperreport.xsd"

    <jasperReport ...>

    ```


