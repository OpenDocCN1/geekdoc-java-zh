  md: "Crosstab (cross-tabulation) reports are the reports containing tables that\
    \ arrange data across rows and columns in a tabular form. Crosstab object is used\
    \ for inserting a crosstab report within the main report. Crosstabs can be used\
    \ with any level of data (nominal, ordinal, interval, or ratio), and usually display\
    \ the summarized data, contained in the report variables, in form of a dynamic\
    \ table. Variables are used to display aggregate data such as sums, counts, average\
    \ values.\n\n# Crosstab Properties\n\nJRXML element <crosstab> is used to insert\
    \ a crosstab into a report.\n\n# Attribute\n\nFollowing is a list of attribute\
    \ of <crosstab> element:\n\n+   * **isRepeatColumnHeaders**: Indicates whether\
    \ the column headers should be reprinted after a page break. The default value\
    \ is *true.*\n* **isRepeatRowHeaders**: Indicates whether the row headers should\
    \ be reprinted after a crosstab column break. The default value is *true*.\n*\
    \ **columnBreakOffset**: When a column break occurs, indicates the amount of vertical\
    \ space, measured in pixels, before the subsequent crosstab piece to be placed\
    \ below the one on the same page. The default value is 10.\n* **runDirection**:\
    \ Indicates whether the crosstab data should be filled from left to right (LTR)\
    \ or from right to left (RTL). The default value is LTR.\n* **ignoreWidth**: Indicates\
    \ whether the crosstab will stretch beyond the initial crosstab width limit and\
    \ not generate column breaks. Else it will stop rendering columns within the crosstab\
    \ width limit and continue with the remaining columns after all rows have started\
    \ rendering. The default value is *false*.\n\n# Sub Elements\n\nA <crosstab> element\
    \ has the following elements:\n\n+   * **reportElement**: This element defines\
    \ the position, width, and height of the crosstab within its enclosing . Attributes\
    \ for this element include all standard <reportElement> attributes.\n* **crosstabParameter**:\
    \ This element is used to access report variables and parameters from within the\
    \ crosstab. Attributes for this element include:\n    * **name**: This defines\
    \ the parameter name.\n    * **class**: This indicates the parameter class.\n\n\
    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_212_0.png)"
