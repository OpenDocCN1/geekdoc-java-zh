  md: 'We discussed the structure of a simple report template in the chapter Getting
    Started. On similar lines, JasperReports structures the report template into multiple
    sections. Sections are portions of the report that have a specified height and
    can contain report objects like lines, rectangles, images, or text fields.


    The report engine iterates through the virtual records of the supplied report
    data source, at report filling time. Depending on each section''s defined behavior,
    the engine renders each section when appropriate. For instance, the detail section
    is rendered for each record in the data source. When page breaks occur, the page
    header and footer sections are rendered as needed.


    In JasperReports, terminology and report sections are also called as report bands.
    Sections are made up of one or more bands. These sections are filled repeatedly
    by report-generating time and prepare the final document.


    # Main Sections


    A report template in JasperReports has the following sections:


    ```

    <title></title>


    <pageheader></pageheader>


    <columnheader></columnheader>


    <groupheader></groupheader>


    <detail></detail>


    <groupfooter></groupfooter>


    <columnfooter></columnfooter>


    <pagefooter></pagefooter>


    <lastpagefooter></lastpagefooter>


    <summary></summary>

    ```


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_105_0.png)'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# JasperReports


    <nodata></nodata>

    <background></background>


    The following table summarizes each of the sections:


    | Section | Description |

    | Title | This section appears only once at the beginning of the report. |

    | Page Header | This section appears at the beginning of each page in the generated
    document. |

    | Column Header | This section appears at the beginning of each column in the
    generated document. If the report has only one column defined, then column header
    and footer sections are ignored. |

    | Group Header | This section is introduced by a report group (chapter Groups).
    Each time the grouping expression changes its value, the group header section
    is printed above the detail section. In case, if more than one group is defined,
    the group header is printed in the order of group definition. |

    | Detail | This section is repeated for each line of data supplied by the report''s
    data source. The detail section can be made of multiple bands. |

    | Group Footer | This section is introduced by a report group (chapter Groups).
    The group footer section is printed below the detail section before the value
    of the grouping changes. The group footer is always printed for the last line
    of data in data source. In case, if more than one group is defined, the group
    footer is printed in the reverse order of group definition. |

    | Column Footer | This section appears at the bottom of each column. If the report''s
    column count is 1, then column header and footer sections are ignored. |

    | Page Footer | This section appears at the bottom of each page. |

    | Last Page Footer | This section replaces the regular page footer on the last
    page of the report. In case, the summary section is also present, this might not
    be the very last page of the document. This section is sometimes useful when summary
    information has to be displayed at the bottom of the last page. |

    | Summary | This section appears only once at the end of the report. |


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_106_0.png)'
  merge: -1
  pgno: 106
- img_proc: true
  md: '# JasperReports


    | No Data | This section is printed when the When No Data report property is set
    to *No Data Section*. If the <noData> section is defined in the report template,
    and if the data source is empty, then the <noData> section will be the only one
    taken into account at fill time, and its content will produce the report output
    |

    | Background | The background section is displayed on every page and not overflow
    to the next page. Elements placed on this section are evaluated at page initialization
    time and are displayed in the background. All other page objects are displayed
    on top of the background objects. This section is useful for creating page watermarks.
    |


    # Section, Elements, and Attribute Relation


    The following diagram shows the elements and attributes relationship in a section
    of a report.


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_107_0.png)'
