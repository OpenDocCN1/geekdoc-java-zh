    \ hence can be executed by ANT.\n\nLet's write an ANT target viewXML to view the\
    \ JRXML. So, let's create and save build.xml from C:\\tools\\jasperreports-5.0.1\\\
    test directory (which should be placed in the same directory where JRXML is placed).\
    \ Here is the build file:\n\n```\n<xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
    <project name=\"JasperReportTest\" default=\"viewDesignXML\" basedir=\">\\n  <import\
