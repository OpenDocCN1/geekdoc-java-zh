  md: "# Variable Reference in Expression\n\nTo reference a variable in an expression,\
    \ we must put the name of the variable between $nV{and} as shown in the example\
    \ given below:\n\n```\n<textFieldexpression>\n\"Total height : \" + $V{SumOfHeight}\
    \ + \" ft.\"\n</textFieldexpression>\n```\n\n# Parameter Reference in Expression\n\
    \nTo reference a parameter in an expression, the name of the parameter should\
    \ be put between $P{and} as shown in the example given below:\n\n```\n<textFieldexpression>\n\
    \"Report Title : \" + $P{Title}\n</textFieldexpression>\n```\n\nFollowing is a\
    \ piece of code from our existing JRXML file, which demonstrates the referencing\
    \ of parameter in an expression. (JRXML from chapter Report Designs):\n\n```\n\
    <textField isBlankNull=\"true\" bookmarkLevel=\"1\">\n<reportElement x=\"0\" y=\"\
    10\" width=\"515\" height=\"30\">\n  <textFieldElement textAlignment=\"Center\"\
    >\n    <font size=\"22\"/>\n  </textFieldElement>\n  <textFieldExpression class=\"\
    java.lang.String\">\n    <![CDATA[$P{ReportTitle}]]>\n  </textFieldExpression>\n\
    \  <anchorNameExpression>\n    <![CDATA[\\Title\\]]>\n  </anchorNameExpression>\n\
    </textField>\n<textField isBlankNull=\"true\">\n<reportElement x=\"0\" y=\"40\"\
    \ width=\"515\" height=\"20\">\n  <textFieldElement textAlignment=\"Center\">\n\
    \    <font size=\"10\"/>\n  </textFieldElement>\n  <textFieldExpression class=\"\
    java.lang.String\">\n    <![CDATA[$P{Author}]]>\n  </textFieldExpression>\n</textField>\n\
    ```\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_81_0.png)"
