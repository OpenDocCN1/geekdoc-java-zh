  md: '# Chart Datasets


    One of the common properties across all chart types is <dataset> element. Chart
    datasets help mapping report data and retrieving chart data at runtime. Each chart
    type contains different sub-elements to define chart''s expressions. These expressions
    define the data used to generate the chart. All of these sub-elements contain
    a <dataset> element that defines when the chart''s expressions are evaluated and
    reset.


    Several types of chart datasets are available in JasperReports because each type
    of chart works with certain datasets: Pie, Category, XY, Time Series, Time Period,
    XYZ, and High-Low. Each of these dataset types implements net.sf.jasperreports.engine.JRChartDataset
    interface that defines chart datasets. All chart datasets initialize and increment
    in the same way; however, they differ in the type of data or report series they
    map.


    # Dataset Properties


    | Attribute | Description |

    |---|---||

    | resetType | This attribute determines when the value of the chart expression
    is to reset. | None, Report, Page, Column, Group. Default value is Report. |

    | resetGroup | This attribute determines the name of the group at which the chart
    expression value is reset. | The value for this attribute must match the name
    of any group declared in the JRMXML report template. |

    | incrementType | This attribute determines when to recalculate the value of the
    chart expression. | None, Report, Page, Column, Group. Default value is "None".
    |

    | incrementGroup | This attribute determines the name of the group at which the
    chart expression is recalculated. | The value for this attribute must match the
    name of any group declared in the JRMXML report template. |


    The following table summarizes the sub-elements of the element <dataset>:


    | Sub element | Description |

    |---||'
