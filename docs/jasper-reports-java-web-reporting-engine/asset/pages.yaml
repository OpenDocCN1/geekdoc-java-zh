    document. Here, we shall see how to transform or export these reports into other
    formats such as PDF, HTML, and XLS. Facade class net.jasperreports.engine.JasperExportManager
    is provided to achieve this functionality. Exporting means transforming the JasperObject
    (.jrprint file) into different format.


