  md: "# JasperReports\n\n+   - In the generated output, the library keeps information\
    \ about the text direction so that documents generated in languages that have\
    \ right-to-left writing (like Arabic and Hebrew) can be rendered properly.\n\n\
    +   - If an application relies on the built-in Swing viewer to display generated\
    \ reports, then it needs to be internationalized by adapting the built ToolTips\
    \ or other texts displayed. This is very easy to do since the viewer relies on\
    \ a predefined resource bundle to extract locale-specific information. The base\
    \ name for this resource bundle is net.sf.jasperperports.view.viewer.\n\n# Example\n\
    \nTo demonstrate internationalization, let's write new report template (jasper_report_template.jrxml).\
    \ The contents of the JRXML are given below. Save it to C:\\\\jasperreports-5.0.1\\\
    test directory.\n\n```\n<xml version=\"1.0\" encoding=\"UTF-8?>\n<!DOCTYPE JasperReport\
    \ \"//JasperReports//DTD Report Design//EN\"\n\"http://jasperreports.sourceforge.org/dtds/jasperreport.dtd\"\
    >\n<JasperReport xmlns=\"http://jasperreports.sourceforge.org/net/jasperreports\"\
    \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\nsxi:schemaLocation=\"\
    http://jasperreports.sourceforge.org/jasperreport \nhttp://jasperreports.sourceforge.org/xsd/jasperreport.xsd\"\
    \nname=\"jasper_report_template\" language=\"groovy\" pageWidth=\"595\"\nheight=\"\
    842\" columnWidth=\"555\" leftMargin=\"20\" rightMargin=\"20\"\ntopMargin=\"20\"\
    \ bottomMargin=\"20\" resourceBundle=\"localizationdemo\">\n<title>\n\n<band name=\"\
