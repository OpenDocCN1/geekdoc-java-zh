  md: '# 16. REPORT FONTS


    A report contains text elements and each of these can have its own font settings.
    These settings can be specified using the <font> tag available in the <element>
    tag. A report can define a number of fonts. Once defined, they can be used as
    default or base font settings for other font definitions throughout the report.


    # Report Fonts


    A report is a collection of font settings, declared at the report level. A report
    font can be reused throughout the entire report template when setting the properties
    of text elements.


    Report fonts are now deprecated. Do not use <reportFont/> elements declared within
    the document itself. Use the <style/> element instead.


    # Font Attributes


    Table summarizes the main attributes of the <font> element:


    | Attribute | Description |

    |---|---|n| fontName | The font name, which can be the name of a physical font,
    a logical one, or the name of a font family from the registered JasperReports
    extensions. |

    | size | The size of the font measured in points. It defaults to 10. |

    | isBold | The flag specifying if a bold font is required. It defaults to false.
    |

    | isItalic | The flag specifying if an italic font is required. It defaults to
    false. |

    | isUnderline | The flag specifying if the underline decoration is required. It
    defaults to false. |

    | isStrikeThrough | The flag specifying if the strikethrough text decoration is
    required. It defaults to false. |

    | pdfName | The name of an equivalent PDF font required by the iText library when
    exporting documents to PDF format. |

    | pdfEncoding | The equivalent PDF character encoding, also required by the iText
    library. |

    | isPdfEmbedded | The flag that specifies whether the font should be embedded
    into the document itself. It defaults to false. If set to true, helps view the
    PDF document without any problem. |'
