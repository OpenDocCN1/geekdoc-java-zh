    Here is the all the directories:


    +   - **build**: Contains the compiled JasperReport class files.

    - **demo**: Contains various examples, demonstrating several aspects of JasperReports
    functionality.

    - **dist**: Contains jasperreports-x.x.x.jar file. We shall add this JAR file
    to our CLASSPATH to take advantage of JasperReports.

    - **docs**: Contains a local copy of the JasperReports documentation.


