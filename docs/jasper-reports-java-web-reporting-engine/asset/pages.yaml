    Here are the details of fields in the report template:


    +   * <queryString>: This is empty (as we are passing data through Java Beans)
    Usually contains the SQL statement, which retrieves the result report.

    * <name>: This element is used to map data from data sources or queries, into
    report templates. **name** is re-used in the report body and is case-sensitive.

    * <fieldDescription>: This maps the field name with the appropriate element in
    the XML file.

    * <staticText>: This defines the static text that does not depend on any data
    sources, variables, parameters, or report expressions.

    * <textFieldExpression>: This defines the appearance of the value of result,

    * $F{country}: This is a variable that contains the value of result, predefined
    field in the tag `<name>`.

    * <band>: Bounds the content of the data, which is displayed in the report.


    Once the design is ready, save it in C:\\ directory.


