  md: '# 10. REPORT DATA SOURCES


    Datasources are structured data container. While generating the report, JasperReports
    engine obtains data from the datasources. Data can be obtained from databases,
    XML files, arrays of objects, and collection of objects. We saw in the chapter
    Filling Reports, the fillReportXXX method provides to receive a data source of
    the report, which has to fill, in the form of net.jasperreports.engine.JRDataSource
    object or a java.sql.Connection (when the report is data in a relational database).


    The JRDataSource interface has only two methods, which should be implemented:


    +   - public boolean next() throws JLException

    - At the report filling time, this method is called on the data source object
    by the reporting engine when iterating through the data.

    - public Object getFieldValue(JRField field) throws JLException

    - This method provides the value for each report field in the current data source
    record.


    The only way to retrieve data from the data source is by using the report fields.
    There are several default implementations of the JRDataSource interface, depending
    on the way, the records in the data source are acquired.


    # Datasource Implementations


    The table below summarizes the datasources and their implementation classes:


    | Datasource | Implementation Class |

    |---|---|

    | JDBC | net.jasperreports.engine.JRDataSource |

    | JavaBean | net.jasperreports.engine.data.JRBeanCollectionDataSource, net.jasperreports.engine.data.JRArrayDataSource
    |

    | Map-based | net.jasperreports.engine.data.JRMapArrayDataSource, net.jasperreports.engine.data.JRMapCollectionDataSource
    |

    | TableModel | net.jasperreports.engine.data.JRTableModelDataSource |

    | XML | net.jasperreports.engine.data.JRXmlDataDataSource |

    | CSV | net.jasperreports.engine.data.JRCsvDataSource |

    | XLS | net.jasperreports.engine.data.JRXlsDataSource |

    | Empty | net.jasperreports.engine.JREmptyDataSource |


    # JDBC Data Sources


    Class JRResultSetDataSource wraps a java.sql.ResultSet object. This is the most
    commonly used data source implementations when report data are extracted from
    a relational database. If a java.sql.Connection is passed to the engine, it executes


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_66_0.png)'
