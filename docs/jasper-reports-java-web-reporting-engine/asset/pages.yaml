  md: "# 13. REPORT VARIABLES\n\nReport variables are special objects built on top\
    \ of the report expression.\n\nReport variables simplify the following tasks:\n\
    \n+   - Report expressions, which are heavily used throughout the report template.\n\
    These expressions can be declared only once by using the report variables.\n-\
    \ Report variables can perform various calculations on the corresponding\nexpressions\
    \ values such as count, sum, average, lowest, highest, variance, etc.\n\nIf variables\
    \ are defined in a report design, then these can be referenced by new\n in the\
    \ expressions. Here, the order in which the variables are declared in a\nreport\
    \ design is important.\n\n# Variable Declaration\n\nA variable declaration is\
    \ as follows:\n\n```\n<variable name=\"CityNumber\" class=\"java.lang.Integer\"\
    \ incrementType=\"Group\"\nincrementGroup=\"CityGroup\" calculation=\"Count\"\
    >\n<variableExpression>\n  <![CDATA[Boolean.TRUE]]>\n</variableExpression>\n</variable>\n\
    ```\n\nAs seen above, <variable> element contains number of attributes. These\
    \ attributes are\nsummarized below:\n\n# The Name Attribute\n\nSimilar to parameters\
    \ and fields, the name attribute of </variable> element is\nmandatory. It allows\
    \ referencing the variable by its declared name in the report\nexpressions.\n\n\
    # The Class Attribute\n\nThe class attribute is also mandatory that specifies\
    \ the class name for the variable\nvalues. Its default value is java.lang.String.\
    \ This can be changed to any class available in\nt classpath, both at the report-compilation\
    \ time and the report filling time. The engine\ntakes care of type-casting in\
    \ report expressions where the $V{} token is used, hence\nmanual type-casting\
    \ is not required.\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_92_0.png)"
  merge: -1
  pgno: 92
- img_proc: true
  md: '# Calculation


    This attribute determines — what calculation to perform on the variable when filling
    the report. The following subsections describe all the possible values for the
    calculation attribute of the <variable> element.


    +   - Average: The variable value is the average of every non-null value of the
    variable expression. Valid for numeric variables only.

    - Count: The variable value is the count of non-null instances of the variable
    expression.

    - First: The variable value is the value of the first instance of the variable
    expression. Subsequent values are ignored.

    - Highest: The variable value is the highest value for the variable expression.

    - Lowest: The variable value is the lowest value for the variable expression.

    - Nothing: No calculations are performed on the variable.

    - StandardDeviation: The variable value is the standard deviation of all non-null
    values matching the report expression. Valid for numeric variables only.

    - Sum: The variable value is the sum of all non-null values returned by the report
    expression.

    - System: The variable value is a custom calculation (calculating the value for
    that variable yourself, using the scriptlets functionality of JasperReports).

    - Variance: The variable value is the variance of all non-null values returned
    by evaluation of the report variable''s expression.


    # IncrementFactoryClass


    This attribute determines the class used to calculate the value of the variable
    when filling the current record on the report. Default value would be any class
    implementing net.sf.jasperreports.engine.fill.JRIncrementFactory. The factory
    class will be used by the engine to instantiate increment objects at runtime depending
    on the calculation attribute set for the variable.


    # IncrementType


    This determines when to recalculate the value of the variable. This attribute
    uses values, as below:


    +   - Column: The variable value is recalculated at the end of each column.

    - Group: The variable value is recalculated when the group specified by incrementGroup
    changes.

    - None: The variable value is recalculated with every record.

    - Page: The variable value is recalculated at the end of every page.

    - Report: The variable value is recalculated once, at the end of the report.


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_93_0.png)'
  merge: -1
  pgno: 93
- img_proc: true
  md: '# IncrementGroup


    This determines the name of the group at which the variable value is recalculated,
    when incrementType is Group. This takes name of any group declared in the JRXML
    report template.


    # ResetType


    This determines when the value of a variable is reset. This attribute uses values,
    as below:


    +   - Column: The variable value is reset at the beginning of each column.

    - Group: The variable value is reset when the group specified by incrementGroup
    changes.

    - None: The variable value is never reset.

    - Page: The variable value is reset at the beginning of every page.

    - Report: The variable value is reset only once, at the beginning of the report.


    # ResetGroup


    This determines the name of the group at which the variable value is reset, when
    resetType is Group. The values for this attribute would be the name of any group
    declared in the JRXML report template.


    # Built-In Report Variables


    There are built-in system variables, ready to use in expressions, as follows:


    | Variable Name | Description |

    | PAGE_NUMBER | This variable''s value is its current page number. It can be used
    to display both the current page number and the total number of pages using a
    special feature of JasperReports text field elements, the evaluationTime attribute.
    |

    | COLUMN_NUMBER | This variable contains the current column number. |

    | REPORT_COUNT | This variable contains the total number of records processed.
    |

    | PAGE_COUNT | This variable contains the number of records that were processed
    when generating the current page. |

    | COLUMN_COUNT | This variable contains the number of records that were processed
    when generating the current column. |

    | GroupName_COUNT | The name of this variable is derived from the name of the
    group it corresponds to, suffixed with the _COUNT sequence. This variable contains
    the number of records in the current group.'
