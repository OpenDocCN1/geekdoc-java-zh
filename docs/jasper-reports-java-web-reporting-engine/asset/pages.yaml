    # Dataset Types


    Specific dataset types are explained below:


    # Pie Dataset


    A pie dataset is characterized by the following expressions:


    +   * <keyExpression> - represents the categories that will make up the slices
    in the pie chart. This expression can return any java.lang.Comparable object.

    * <expression> - produces the values that correspond to each category/key in the
    dataset. Values are always java.lang.Number objects.

    * <labelExpression> - if this expression is missing, the chart will display default
    labels for each slice in the pie chart. This expression, returns java.lang.String
    values to customize the item labels for the chart.

    * <sectionHyperlink> - sets hyperlinks associated with the pie sections.


    # Category Dataset


    A category dataset is characterized by the <categorySeries> element, which contains:


    +   * <seriesExpression> - indicates the name of the series. This expression can
    return any java.lang.Comparable object.

    * <categoryExpression> - returns the name of the category for each value inside
    the series specified by the series expression. Categories are always java.lang.Comparable
    objects.

    * <expression> - produces the values that correspond to each category in the dataset.
    Values are always java.lang.Number objects.

    * <labelExpression> - if this expression is missing, the chart will display default
    labels for each item in the chart. This expression, returns java.lang.String values,
    to customize the item labels for the chart.

    * <itemHyperlink> - sets hyperlinks associated with chart items.


    # XY Dataset


    An XY dataset is characterized by the <xySeries> element, which contains:


    +   * <seriesExpression> - indicates the name of the series. This expression can
    return any java.lang.Comparable object.


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_196_0.png)'
