  md: "# JasperReports\n\n+   <parametersMapExpression>: This element is used to pass\
    \ a report variable or parameter containing an instance of java.util.Map, as a\
    \ set of parameters for the crosstab. This element contains no attributes.\n\n\
    +   <crosstabDataset>: This element defines the dataset to populate the crosstab\
    \ (see next section for a detailed explanation). Attributes for this element include:\n\
    \    * isDataPreSorted: This indicates whether the data in the dataset is presorted.\
    \ Default value is false.\n\n+   <crosstabHeaderCell>: This element defines the\
    \ content of the region found at the upper-left corner of the crosstab where column\
    \ headers and row headers meet. The size of this cell is calculated automatically\
    \ based on the defined row and column widths and heights.\n\n+   <row>: This element\
    \ defines a group to split the data into rows. Attributes for this element include:\n\
    \    * name: This defines the name of the row group.\n    * width: This defines\
    \ the width of the row group.\n    * headerPosition: This defines the position\
    \ of the header contents (Top, Middle, Bottom, Stretch).\n    * totalPosition:\
    \ This defines the position of the entire column (Start, End, None).\n\nThis element\
    \ contains the following sub elements:\n\n+   * <bucket>\n    * <crosstabRowHeader>\n\
    \    * <crosstabTotalRowHeader>\n\n+   <columnGroup>: This element defines a group\
    \ used to split the data into columns. Attributes for this element include:\n\
    \    * name: This defines the column group name.\n    * height: This defines the\
    \ height of the column group header.\n    * headerPosition: This defines the position\
    \ of the header contents (Right, Left, Center).\n    * totalPosition: This defines\
    \ the position of the entire column (Start, End, None).\n\nThis element contains\
    \ the following sub elements:\n\n+   * <bucket>\n    * <crosstabColumnHeader>\n\
    \    * <crosstabTotalColumnHeader>\n\n+   <measure>: This element defines the\
    \ calculation to be performed across rows and columns. Attributes for this element\
