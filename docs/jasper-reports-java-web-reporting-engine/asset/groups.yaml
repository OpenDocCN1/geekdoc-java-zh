    \ JRXML files contain tag <JasperReport>, as root element. In this turn contains\
    \ many sub-elements (all of these are optional). JasperReport framework can handle\
    \ different kinds of data sources. In this tutorial, we will show how to generate\
    \ a report, by passing a connection of Java data object (using Java beans), to\
    \ the Jasper Engine. The final report shall display a list of people with the\
    \ categories including their names and countries.\n\nThe following steps are covered\
    \ in this chapter to describe — how to design a JasperReport:\n\n+   - Creating\
    \ a JRXML Report Template\n- Previewing the XML Report Template.\n\n# Creating\
    \ a JRXML Report Template\n\nCreate the JRXML file, which is jasper_report_template.jrxml\
    \ using a text editor and save this file in C:\\tools\\jasperreports-5.0.1\\test\
    \ as our environment setup.\n\n```\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
    <!DOCTYPE jasperreport PUBLIC \"//JasperReports//DTD Report Design//EN\"\n   \"\
