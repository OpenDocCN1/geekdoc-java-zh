    We discussed the structure of a simple report template in the chapter Getting
    Started. On similar lines, JasperReports structures the report template into multiple
    sections. Sections are portions of the report that have a specified height and
    can contain report objects like lines, rectangles, images, or text fields.


    The report engine iterates through the virtual records of the supplied report
    data source, at report filling time. Depending on each section''s defined behavior,
    the engine renders each section when appropriate. For instance, the detail section
    is rendered for each record in the data source. When page breaks occur, the page
    header and footer sections are rendered as needed.


    In JasperReports, terminology and report sections are also called as report bands.
    Sections are made up of one or more bands. These sections are filled repeatedly
    by report-generating time and prepare the final document.


    # Main Sections


    A report template in JasperReports has the following sections:


    ```

    <title></title>


    <pageheader></pageheader>


    <columnheader></columnheader>


    <groupheader></groupheader>


    <detail></detail>


    <groupfooter></groupfooter>


    <columnfooter></columnfooter>


    <pagefooter></pagefooter>


    <lastpagefooter></lastpagefooter>


    <summary></summary>

    ```


