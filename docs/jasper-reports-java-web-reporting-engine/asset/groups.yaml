- md: "\n# Calculation\n\nThis attribute determines — what calculation to perform\
    \ on the variable when filling the report. The following subsections describe\
    \ all the possible values for the calculation attribute of the \\ltvariable\\\
    gt; element.\n\n- Average: The variable value is the average of every non-null\
    \ value of the variable expression. Valid for numeric variables only.\n- Count:\
    \ The variable value is the count of non-null instances of the variable expression.\n\
    - First: The variable value is the value of the first instance of the variable\
    \ expression. Subsequent values are ignored.\n- Highest: The variable value is\
    \ the highest value for the variable expression.\n- Lowest: The variable value\
    \ is the lowest value for the variable expression.\n- Nothing: No calculations\
    \ are performed on the variable.\n- StandardDeviation: The variable value is the\
    \ standard deviation of all non-null values matching the report expression. Valid\
    \ for numeric variables only.\n- Sum: The variable value is the sum of all non-null\
    \ values returned by the report expression.\n- System: The variable value is a\
    \ custom calculation (calculating the value for that variable yourself, using\
    \ the scriptlets functionality of JasperReports).\n- Variance: The variable value\
    \ is the variance of all non-null values returned by evaluation of the report\
    \ variable's expression.\n\n# IncrementFactoryClass\n\nThis attribute determines\
    \ the class used to calculate the value of the variable when filling the current\
    \ record on the report. Default value would be any class implementing net.sf.jasperreports.engine.fill.JRIncrementFactory.\
    \ The factory class will be used by the engine to instantiate increment objects\
    \ at runtime depending on the calculation attribute set for the variable.\n\n\
    # IncrementType\n\nThis determines when to recalculate the value of the variable.\
    \ This attribute uses values, as below:\n\n- Column: The variable value is recalculated\
    \ at the end of each column.\n- Group: The variable value is recalculated when\
    \ the group specified by incrementGroup changes.\n- None: The variable value is\
    \ recalculated with every record.\n- Page: The variable value is recalculated\
    \ at the end of every page.\n- Report: The variable value is recalculated once,\
    \ at the end of the report.\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_93_0.png)\n\
    \n# IncrementGroup\n\nThis determines the name of the group at which the variable\
    \ value is recalculated, when incrementType is Group. This takes name of any group\
    \ declared in the JRXML report template.\n\n# ResetType\n\nThis determines when\
    \ the value of a variable is reset. This attribute uses values, as below:\n\n\
    - Column: The variable value is reset at the beginning of each column.\n- Group:\
    \ The variable value is reset when the group specified by incrementGroup changes.\n\
    - None: The variable value is never reset.\n- Page: The variable value is reset\
    \ at the beginning of every page.\n- Report: The variable value is reset only\
    \ once, at the beginning of the report.\n\n# ResetGroup\n\nThis determines the\
    \ name of the group at which the variable value is reset, when resetType is Group.\
    \ The values for this attribute would be the name of any group declared in the\
    \ JRXML report template.\n\n# Built-In Report Variables\n\nThere are built-in\
