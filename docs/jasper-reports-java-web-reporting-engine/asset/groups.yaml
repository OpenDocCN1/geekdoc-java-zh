- md: "\n# List of Contacts\nPrepared By Manisha\n\n| Name | Country |\n| :--- | :---\
    \ |\n| Dennis Ritchie | USA |\n| Manisha | India |\n| V. Anand | India |\n| Srinath\
    \ | California |\n\nHere, we can see that the country names are arranged in descending\
    \ order alphabetically.\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_79_0.png)\n\
    \nReport expressions are the powerful features of JasperReports, which allow us\
    \ to display calculated data on a report. Calculated data is the data that is\
    \ not a static data and is not specifically passed as a report parameter or datasource\
    \ field. Report expressions are built from combining report parameters, fields,\
    \ and static data. The Java language is used for writing report Groovy expressions\
    \ by default. Other scripting languages for report expressions like Groovy scripting\
    \ language, JavaScript, or BeanShell script are supported by JasperReports.\n\n\
    This chapter will explain you — how report expressions work, assuming that they\
    \ have been written using the Java language only. In a JXRL report template, there\
    \ are several elements that define expressions as:\n\n- <variableExpression>\n\
    - <initialValueExpression>\n- <groupExpression>\n- <printWhenExpression>\n- <imageExpression>\n\
    - <textFieldExpression>\n\n## Expression Declaration\n\nBasically, all report\
    \ expressions are Java expressions, which can reference the report fields, report\
    \ variables, and report parameters.\n\n## Field Reference in Expression\n\nTo\
    \ use a field reference in an expression, the name of the field must be put between\
    \ **$F{ and }** character sequences, as shown below:\n\n```xml\n<textFieldExpression>\n\
    $F{Name}\n</textFieldExpression>\n```\n\nFollowing is a piece of code from our\
    \ existing JRXML file (chapter **Report Designs**):\n\n```xml\n<textFieldExpression\
    \ class=\"java.lang.String\">\n<![CDATA[$F{country}]]>\n</textFieldExpression>\n\
    ```\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_80_0.png)\n\n## Variable Reference\
    \ in Expression\n\nTo reference a variable in an expression, we must put the name\
    \ of the variable between $V{ and } as shown in the example given below:\n\n```xml\n\
    <textFieldexpression>\n\"Total height : \" + $V{SumOfHeight} + \" ft.\"\n</textFieldexpression>\n\
    ```\n\n## Parameter Reference in Expression\n\nTo reference a parameter in an\
    \ expression, the name of the parameter should be put between $P{ and } as shown\
    \ in the example given below:\n\n```xml\n<textFieldexpression>\n\"Report Title\
    \ : \" + $P{Title}\n</textFieldexpression>\n```\n\nFollowing is a piece of code\
    \ from our existing JRXML file, which demonstrates the referencing of parameter\
    \ in an expression. (JRXML from chapter Report Designs):\n\n```xml\n<textField\
    \ isBlankNull=\"true\" bookmarkLevel=\"1\">\n  <reportElement x=\"0\" y=\"10\"\
    \ width=\"515\" height=\"30\">\n    <textFieldElement textAlignment=\"Center\"\
    >\n      <font size=\"22\"/>\n    </textFieldElement>\n    <textFieldExpression\
    \ class=\"java.lang.String\">\n      <![CDATA[$P{ReportTitle}]]>\n    </textFieldExpression>\n\
    \    <anchorNameExpression>\n      <![CDATA[\\Title\\]]>\n  </anchorNameExpression>\n\
    </textField>\n<textField isBlankNull=\"true\">\n  <reportElement x=\"0\" y=\"\
    40\" width=\"515\" height=\"20\">\n    <textFieldElement textAlignment=\"Center\"\
    >\n      <font size=\"10\"/>\n    </textFieldElement>\n    <textFieldExpression\
    \ class=\"java.lang.String\">\n      <![CDATA[$P{Author}]]>\n    </textFieldExpression>\n\
    </textField>\n```\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_81_0.png)\n\n##\
    \ JasperReports\n\nAs you have seen, the parameter, field, and variable references\
    \ are in fact Java objects. Knowing their class from the parameter, field, or\
    \ variable declaration made in the report template, we can even call methods on\
    \ object references in the expressions.\n\nThe following example shows — how to\
    \ extract and display the first letter from java.lang.String report field \"Name\"\
    :\n\n```xml\n<textFieldExpression>\n$F{Name}.substring(0, 1)\n</textFieldExpression>\n\
    ```\n\n## Resource Bundle Reference in Expression\n\nTo reference a resource in\
    \ an expression, the key should be put between $R{ and } as shown in the example\
    \ given below:\n\n```xml\n<textFieldExpression>\n$R{report.title}\n</textFieldExpression>\n\
    ```\n\nBased on the runtime-supplied locale and the report.title key, the resource\
    \ bundle associated with the report template is loaded. Hence, the title of report\
    \ is displayed by extracting the String value from the resource bundle. More on\
    \ internationalization can be found in the chapter Internationalization.\n\n##\
    \ Calculator\n\nCalculator is an entity in JasperReports, which evaluates expressions\
    \ and increments variables or datasets at report-filling time. During compiling\
    \ process, the information is produced and stored in the pool by the report compiler.\
    \ This information is used during the report-filling time to build an instance\
    \ of the net.sf.jasperreports.engine.fillJRCalculator.\n\nJava source file is\
    \ generated and compiled by Java-based report compilers on the fly. This generated\
    \ class is a subclass of JRCalculator, and the bytecode produced compiling it\
    \ is stored inside the JasperReport object. This bytecode is loaded at report\
    \ filling time and the resulting class is instantiated to obtain the calculator\
    \ object needed for expression evaluation.\n\n## Conditional Expressions\n\nJasperReports\
    \ doesn't support if-else statements when defining variables. Instead, you can\
    \ use the ternary operator to obtain the desired output based on multiple conditions.\n\
    \n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_82_0.png)\n\n## Example of Conditional\
