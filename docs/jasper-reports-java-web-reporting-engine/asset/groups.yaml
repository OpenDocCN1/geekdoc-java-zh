    \n# JasperReports\n\n```xml\n<import file=\"baseBuild.xml\" />\n<target name=\"\
    viewDesign\" description=\"启动设计查看器以预览编译后的报告设计。\">\n<java className=\"net.sf.jasperreports.view.JasperDesignViewer\"\
    \ fork=\"true\">\n  <arg value=\"-F${file.name}.jasper\" />\n  <classpath refid=\"\
    classpath\" />\n</java>\n</target>\n</project>\n```\n\n在命令行提示符执行命令 `ant`（`viewDesign`\
    \ 是默认目标）。\n`JasperDesignViewer` 打开并显示如下所示 Jasper 文件：\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_26_0.png)\n\
    \n| Name | Country |\n| --- | --- |\n| ${name} | ${country} |\n\n# 通过 ANT 任务进行编译\n\
    \n由于报告模板的编译更像是一个设计时的工作而非运行时工作，JasperReport 库提供了一个自定义的 ANT 任务。在某些情况下，JRXML 文件是在运行时创建，我们无法使用此\
    \ ANT 任务。该自定义 ANT 任务称为 JRC，并由类 `net.sf.jasperreports.ant.JRAntCompileTask` 实现。它的语法和行为与内置的\
    \ `<javac>` ANT 任务非常相似。\n\n# 模板编译\n\n在我们现有的 `build.xml` 中添加 `compileoreportdesing`。在这里，使用嵌套的\
    \ `<src>` 标签配合 `filesets` 指定源文件夹。嵌套的源标签允许编译分散在许多不同位置且未归类在根报告文件夹下的报告模板。以下是修改后的\
    \ `build.xml`：\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<project\
    \ name=\"JasperTest\" default=\"compileoreportdesing\" basedir=\">\n  <import\
    \ file=\"basebuild.xml\" />\n  <target name=\"viewDesign\" description=\"启动设计查看器以预览编译后的报告设计。\"\
    >\n    <java className=\"net.sf.jasperreports.view.JasperDesignViewer\" fork=\"\
    true\" />\n    <arg value=\"-F$(file.name).jasper\" />\n    <classpath refid=\"\
    classpath\" />\n    </java>\n  </target>\n\n  <target name=\"compileoreportdesing\"\
    \ description=\"编译 JXML 文件并生成 .jasper 文件。\">\n    <taskdef name=\"jrc\" className=\"\
    net.sf.jasperreports.ant.JRAntCompileTask\">\n      <classpath refid=\"classpath\"\
    \ />\n    </taskdef>\n    <jrc destdir=\".\">\n      <src>\n        <fileset dir=\"\
    .\">\n          <include name=\"*.jrxml\" />\n        </fileset>\n      </src>\n\
    \      <classpath refid=\"classpath\" />\n    </jrc>\n  </target>\n</project>\n\
    ```\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_27_0.png)\n\n接下来，打开命令行提示符并进入 `build.xml`\
    \ 目录。\n执行命令 `ant`（`compileoreportdesing` 是默认目标）；输出如下：\n\n```\nC:\\tools\\jasperreports-5.0.1\\\
