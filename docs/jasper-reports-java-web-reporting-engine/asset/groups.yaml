    # 23. JASPERREPORTS – 国际化\n\n有时我们需要不同语言的报告。为每种语言编写相同的报告意味着大量的重复工作。只有不同语言的文本部分应该单独编写并在运行时根据区域设置加载到文本元素中。这就是报告国际化的目的。国际化的报告可以在任何运行。\n\
    \n在以下步骤中，我们列出了生成不同语言报告的方法以及报告国际化的其他特性：\n\n- 将资源包 `java.util.ResourceBundle` 与报告模板关联。将\
    \ `java.util.ResourceBundle` 对象与报告模板关联有两种：\n- 在设计阶段，通过在运行时设置报告对象的 `resourceBundle`\
    \ 属性来指定目标资源包的基类。\n- 在填充报告时提供 `java.util.ResourceBundle` 对象作为 `REPORT_RESOURCE_BUNDLE`\
    \ 参数的值可以实现动态/运行时关联。\n- 如果报告需要在与当前不同的区域生成，可以使用内置的 `REPORT_LOCALE` 参数指定填充报告时的运行时区域。\n\
    \n为了方便报告国际化，报告表达式可以使用特殊语法 `$R{}` 来引用与报告相关的 `java.util.ResourceBundle` 对象内部的 `java.lang.String`\
    \ 资源。`$R{}` 根据括号内的键从资源包中提取特定区域的资源：\n\n```xml\n<textFieldExpression>\n$R{report.title}\n\
    </textFieldExpression>\n```\n\n上述文本字段通过从与报告相关的资源包中根据运行时区域和 report.title 键提取值来显示报告标题。\n\
    \n根据报告区域以不同语言格式化消息，在 `net.sf.jasperreports.engine.fillCalculator` 中有一个内置方法。该方法为\
    \ `java.text.MessageFormat` 类提供了功能。该方法 `msg()` 有三个方便的签名，允许你在消息中使用最多三个参数。\n\n内置的\
    \ `str()`（等同于报告表达式中的 `$R{}` 语法），允许根据报告区域访问资源包内容。\n\n对于日期和时间格式化，可以使用内置的 `REPORT_TIME_ZONE`\
    \ 参数来确保时间的正确转换。\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_225_0.png)\n\n# JasperReports\n\
    \n- 在生成的输出中，库保留了文本方向信息，以便从右向左语言（如阿拉伯语和希伯来语）生成的文档可以正确渲染。\n- 如果应用程序依赖内置的 Swing 查看器显示生成的报告，则需要通过适配内置工具提示或其他显示的文本来进行国际化。这很容易实现，因为查看器依赖于预定义的资源包来提取特定区域的信息。该资源包的基类是\
    \ `net.sf.jasperreports.view.viewer`。\n\n# 示例\n\n为了演示国际化，让我们编写一个新的报告模板（jasper_report_template.jrxml）。JRXML\
    \ 的内容所示。将其保存到 C:\\jasperreports-5.0.1\\test 目录。\n\n```xml\n<?xml version=\"1.0\"\
