  - "[PAGE 154]\n\n# JasperReports\n\nconditional styles involve report expressions,\
    \ and expressions can only be interpreted in the context of a single report definition.\n\
    \nReferences to style templates are included in JRXML reports as <template> elements.\
    \ The style templates are loaded at report fill, and style name references are\
    \ resolved once all the templates have been loaded. When loading style templates\
    \ and resolving style names to styles, a tree/graph of style templates is created,\
    \ the top of the tree being the set of styles defined in the report. On this tree,\
    \ style name references are resolved to the last style that matches the none in\
    \ a depth-first traversal.\n\n# Example\n\nLet's try out the conditional styles\
