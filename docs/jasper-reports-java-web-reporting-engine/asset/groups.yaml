  - '[PAGE 118]


    # 15. REPORT GROUPS


    Groups in JasperReports help to organize data on report in a logical manner. A
    report group represents a sequence of consecutive records in the data source,
    which has something in common, such as the value of a certain report fields. A
    report group is defined by the <group> element. A report can have any number of
    groups. Once declared, groups can be referred throughout the report.


    A report group has three elements:


    +   - Group expression: This indicates the data that must change to start a new
    data group.

    - Group header section: Helps place label at the beginning of the grouped data.

    - Group footer section: Helps place label at the end of the grouped data.


    During the iteration through the data-source at report-filling, if the value of
    the group expression changes, a group rupture occurs. These group ruptures <groupFooter>
    and <groupHeader> sections are inserted in the resulting document.


    Report group mechanism does not perform any sorting on the data supplied by the
    data source. Data grouping works as expected only when the records in the data
    source are already ordered according to the group expressions used in the report.


    # Group Attributes


    The <group> element contains attributes that allow us to control how grouped data
    is laid out. The attributes are summarized in table:


    | Attribute | Description |

    |---|--|

    | name | This is mandatory. It references the group in report expressions by name.
    It follows the naming conventions that we mentioned for the report parameters,
    fields, and report variables. It can be used in other JRXML attributes when you
    want to refer to a particular report group. |

    | isStartNewColumn | When set to *true*, each data group will begin on a new column.
    Default value is *false*. |

    | isStartNewPage | When set to *true*, each data group will begin on a new page.
    Default value is *false*. |

    | isResetNumber | When set to *true*, the report page number will be reset every
    time a new group starts. Default value is *false*. |

    | isReprintHeaderOnPage | When set to *true*, the group header will be reprinted
    on every page. Default value is *false*. |


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_118_0.png)'
  - '[PAGE 119]


    # JasperReports


    | minHeightToStartPage | Defines minimum amount of vertical space needed at the
    bottom of the column in order to place the group header on the current column.
    The amount is specified in report units. |

    | footerPosition | Renders position of the group footer on the page, as well as
    its behavior in relation to the report sections that follow it. Its value can
    be: Normal, StackAtBottom, ForceAtBottom, and CollateAtBottom. Default value is
    Normal. |

    | keepTogether | When set to true, prevents the group from splitting on its first
    break attempt |


