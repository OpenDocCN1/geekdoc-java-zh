    Total time: 18 minutes 22 seconds\n\nAs a result of the above compilation, a Jasper\
    \ window opens up as in the screen below:\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_116_0.png)\n\
    \n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_117_0.png)\n\nHere, we can see in each\
    \ of the sections a text is printed. It is to be noted that as JRXML contains\
    \ a <pageFooter> element, it will be displayed in the last page of the report\
    \ instead of the <pageFooter> element being displayed. The <columnHeader> and\
    \ <columnFooter> elements will only be displayed on the report, if it has more\
    \ than one column.\n\n# 15. REPORT GROUPS\n\nGroups in JasperReports help to organize\
    \ data on report in a logical manner. A report group represents a sequence of\
    \ consecutive records in the data source, which has something in common, such\
    \ as the value of a certain report fields. A report group is defined by the <group>\
    \ element. A report can have any number of groups. Once declared, groups can be\
    \ referred throughout the report.\n\nA report group has three elements:\n\n- Group\
    \ expression: This indicates the data that must change to start a new data group.\n\
    - Group header section: Helps place label at the beginning of the grouped data.\n\
    - Group footer section: Helps place label at the end of the grouped data.\n\n\
    During the iteration through the data-source at report-filling, if the value of\
    \ the group expression changes, a group rupture occurs. These group ruptures <groupFooter>\
    \ and <groupHeader> sections are inserted in the resulting document.\n\nReport\
    \ group mechanism does not perform any sorting on the data supplied by the data\
    \ source. Data grouping works as expected only when the records in the data source\
    \ are already ordered according to the group expressions used in the report.\n\
    \n# Group Attributes\n\nThe <group> element contains attributes that allow us\
    \ to control how grouped data is laid out. The attributes are summarized in table:\n\
    \n| Attribute | Description |\n|---|---|\n| name | This is mandatory. It references\
    \ the group in report expressions by name. It can be used in other JRXML attributes,\
    \ fields, and variables. |\n| isStartNewColumn | When set to true, each data group\
    \ will begin a new column. Default value is false. |\n| isStartNewPage | When\
    \ set to true, each data group will begin a new page. Default value is false.\
    \ |\n| isResetNumber | When set to true, the report page number will be reset\
    \ every time a group starts. Default value is false. |\n| isReprintHeaderOnPage\
    \ | When set to true, the group header will be reprinted on page. Default value\
    \ is false. |\n| minHeightToStartPage | Defines minimum amount of vertical space\
    \ needed at the bottom of the column in order to place the group header on the\
    \ current column. The amount is specified in report units. |\n| footerPosition\
    \ | Renders position of the group footer on the page, as well as its behavior\
    \ in relation to the report sections that follow it. Its value can be: Normal,\
    \ StackAtBottom, ForceAtBottom, CollateAtBottom. Default value is Normal. |\n\
    | keepTogether | When set to true, prevents the group from splitting on its first\
    \ break |\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_118_0.png)\n\n# Example\n\
    \nLets add a group (CountryGroup) to existing report template (Chapter Report\
    \ designs). Occurrence of each country is counted and the count is displayed as\
    \ the group footer. In the group header, the count of each record is prefixed.\
