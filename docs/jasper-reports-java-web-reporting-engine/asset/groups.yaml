    used for JDBC datasource |

    | REPORT_DATA_SOURCE | This is a user supplied instance of JRDataDataSource representing
    either of the built-in data source types or a user-defined one. |

    | REPORT_MAX_COUNT | This is a java.lang.Integer value, allowing the users to
    limit the records from datasource. |

    | REPORT_SCRIPTLET | This points to net.sf.jasperreports.engine.JRAbstractScriptlet
    and contains an instance of the report script provided by the user. |

    | REPORT_LOCALE | This is a java.util.Locale instance, containing the resource
    bundle desired locale. |

    | REPORT_RESOURCE_BUNDLE | This points to java.util.ResourceBundle object and
    contains localized messages. |

    | REPORT_TIME_ZONE | This is a java.util.TimeZone instance, used for the date
    formatting. |

    | REPORT_VIRTUALIZER | This is an instance of net.sf.jasperreports.engine.JRVirtualizer
    object, and used for the page virtualization (optimize memory consumption). |

    | REPORT_CLASS_LOADER | This is a java.lang.ClassLoader instance to be used during
    the report filling process to load resources as images, fonts, and sub-report
    templates. |

    | IS_IGNORE_PAGINATION | If set to java.lang.Boolean.TRUE, the report will be
    generated on one long page and page break will not occur. |


