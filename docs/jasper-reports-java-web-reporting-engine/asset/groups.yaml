    # JasperReports


    | isBold | Indicates the font style is bold. |

    | isItalic | Indicates if the font style is italic. |

    | isUnderline | Indicates if the font style is underline. |

    | isStrikeThrough | Indicates if the font style is strikethrough. |

    | pdfFontName | Specifies the related PDF font name. |

    | pdfEncoding | Specifies the character encoding for the PDF output format. |

    | isPdfEmbedded | Indicates if the PDF is embedded. |

    | pattern | Specifies the format pattern for formatted texts. |

    | isBlankWhenNull | Indicates if an empty string (whitespace) should be shown
    if the expression evaluates to null. |


    # Conditional Styles


    In some situations, a style should be applied only when certain condition is met
    (for example, to alternate adjacent row colors in a report detail section). This
    can be achieved using conditional styles.


    A conditional style has two elements:


    +   * a Boolean condition expression

    * a style


    The style is used only if the condition evaluates to true.


    # Applying Styles to Report Elements


    Any type of report element can reference a report style definition using the style
    attribute. Hence, all the styles declared by the style definition that are applicable
    to the current element will be inherited. To override the inherited values, style
    properties specified at the report element level can be used.


    # Style Templates


    We can make a set of reports with a common looking by defining the style at a
    common place. This common style can then be referenced by the report templates.
    A style template is an XML file that contains one or more style definitions. Style
    template files used by convention the *.jrtx extension, but this is not mandatory.


    A style template contains the following elements:


    +   * <jasperTemplate>: This is the root element of a style template file.

    * <template>: This element is used to include references to other template files.
    The contents of this element are interpreted as the location of the referred template
    file.

    * <style>: This element is identical to the element with the same name from report
    design templates (JRXML files), with the exception that a style in a style template
    cannot contain conditional styles. This limitation is caused by the fact that


