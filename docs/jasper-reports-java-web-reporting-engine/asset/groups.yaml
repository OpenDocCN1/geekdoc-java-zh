  - "[PAGE 29]\n\n# 6. JASPERREPORTS – FILLING REPORTS\n\nThe main purpose of any\
    \ reporting tool is to produce high quality documents. Report filling process\
    \ helps reporting tool to achieve this by manipulating sets of data.\n\nThe main\
    \ inputs required for report-filling process are:\n\n+   - Report Template: This\
    \ is actual JasperReport file.\n- Report Parameters: These are basically named\
    \ values that are passed at the report filling time to the engine. We will discuss\
    \ them in Report Parameter character.\n- Data Source: We can fill a Jasper file\
    \ from a range of data sources that include an SQL query, an XML file, a csv file,\
    \ or HQL (Hibernate Query Language) query, a collection of Java Beans, This will\
    \ be discussed in Report Data Sources.\n\nThe output generated by this process\
    \ is a jrprint document which is ready to be viewed, printed, or exported to other\
    \ formats. The facade class net.jasperreports.engine.JasperFillManager is usually\
    \ used for filling a report template with data. This has various fillXXX methods\
    \ that fill report templates (templates can be located on disk, picked from input\
    \ sources, or are supplied directly (in-memory).\n\nThere are two categories of\
    \ fillXXX() methods in this facile class:\n\n+   - The first type, receive a java.sql.Connection\
    \ object as the third parameter. Most of the times, reports are filled with data\
    \ from a relational database. This is achieved by:\n  - Connect to the database\
    \ using JDBC.\n  - Include an SQL query inside the report template.\n  - JasperReports\
    \ uses the connection and executes the SQL query.\n  - A report data source is\
    \ thus produced for filling the report.\n\n+   - The second type, receive a net.jasperreports.engine.JRDataource\
    \ object, when the data needs to be filled is available in other forms.\n\n# Fill\
    \ Report Templates\n\nLet's write a report template. The contents of the JRXML\
