- md: "\n# JasperReports\n\nThe <plot> element has a subelement <seriesColor> which\
    \ attributes are: seriesOrder and color. This element customizes colors for series,\
    \ and its position within the color sequence.\n\n## Specific Settings for Chart\
    \ Plots\n\n- piePlot: It has no specific settings\n- pie3DPlot: Contains the depthFactor\
    \ attribute, a numeric value ranging from 0 to 1 that represents the depth of\
    \ the pie as a percentage of the height of the plot\n- barPlot: Can show or hide\
    \ tick labels, tick marks or item labels, and provides settings for both axis.\n\
    - bar3DPlot: provides the same settings as the barPlot, and generates a 3D effect\
    \ using the xOffset and yOffset attributes.\n- linePlot: Can show or hide connecting\
    \ points, can show or hide shapes with item points, and provides settings for\
    \ both axis.\n- scatterPlot: Similar to the linePlot, it can show or hide connecting\
    \ points, can show or hide shapes associated with item points, and provides settings\
    \ for both axes.\n- areaPlot: Provides settings for both axis.\n- bubblePlot:\
    \ Can set the bubble dimensions by setting the scaleType attribute, and provides\
    \ settings for both axes.\n- timesSeriesPlot: Can show or hide connecting item\
    \ points, can show or hide shapes associated with item points, and provides settings\
    \ for both axis.\n- highLowPlot: Can show or hide open ticks, can show or hide\
    \ close ticks, and provides settings for both axis.\n- candlestickPlot: Can show\
    \ or hide the volume, and provides settings for both axis.\n- meterPlot: Contains\
    \ specific settings for the dial shape, scale angle, measurement units, tick interval,\
    \ dial color, needle color, tick color, value display font, color and format pattern,\
    \ data range, and meter intervals.\n- thermometerPlot: Contains specific settings\
    \ for the location memory, mercury color, show/hide value lines, value display\
    \ font, color and format pattern, data range, low range, and high range.\n- multiAxisChart:\
    \ Contains specific settings for axis included in the plot.\n\n## Types of Charts\n\
    \nJasperReports offers built-in support for several chart types. They are listed\
    \ as below:\n\n- pieChart: A combination of a Pie dataset and a Pie plot.\n- pie3DChart:\
    \ Groups a Pie dataset and a Pie 3D plot.\n- barChart: A basic combination of\
    \ a Category dataset and a Bar plot.\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_200_0.png)\n\
    \n# JasperReports\n\n- bar3DChart: Wraps a Category dataset and a Bar 3D plot.\n\
    - xyBarChart: Supports Time Period datasets, Time Series datasets, and XY datasets,\
    \ and uses a Bar plot to render the axis and the items.\n- stackedBarChart: Uses\
    \ data from a Category dataset and renders its content using a Bar plot.\n- stackedBar3DChart:\
    \ Uses data from a Category dataset and renders its content using a 3D plot.\n\
    - lineChart: Groups a Category dataset and a Line plot.\n- xyLineChart: Groups\
    \ an XY dataset and a Line plot.\n- areaChart: Items from a Category dataset are\
    \ rendered using an Area plot.\n- stackedAreaChart: Items from a Category dataset\
    \ are rendered using an Area plot.\n- xyAreaChart: Uses data from an XY dataset\
    \ and renders it through an Area plot.\n- scatterChart: Wraps an XY dataset with\
    \ a Scatter plot.\n- bubbleChart: Combines XZ dataset with a Bubble plot.\n- timeSeriesChart:\
    \ Groups a Time Series dataset and a Time Series plot.\n- highLowChart: A combination\
    \ of a High-Low dataset and a High-Low plot.\n- candlestickChart: Uses data from\
    \ a High-Low dataset, but with a special candlestick plot.\n- meterChart: Displays\
    \ a single value from a Value dataset on a dial, using rendering options from\
    \ a Meter plot.\n- thermometerChart: Displays the single value in a Value dataset\
    \ using rendering options from a Thermometer plot.\n- multiAxisChart: Contains\
    \ multiple range axes, all sharing a common domain axis.\n\n## Example\n\nTo demonstrate\
    \ the charts, let's write a new report template (jasper_report_template.jrmxmi).\
    \ Here, we will add the <barChart> element to the <pageHeader> section and <pieChart>\
    \ to <summary>. We would be displaying in charts: the marks obtained for each\
    \ subject. Save it to the directory C:\\jasperreports-5.0.1\\test. The contents\
    \ of the file are given below:\n\n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"\
    ?>\n<jasperReport xmlns=\"http://jasperreports.sourceforge.net/jasperreports\"\
    \nxmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\nxsi:schemaLocation=\"\
    http://jasperreports.sourceforge.net/jasperreports.xsd http://jasperreports.sourceforge.net/jasperreport.xsd\"\
    \nname=\"jasper_report_template\" pageWidth=\"595\" pageHeight=\"860\"\ncolumnWidth=\"\
    515\" leftMargin=\"40\" rightMargin=\"40\" topMargin=\"50\" bottomMargin=\"50\"\
    \n```\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_201_0.png)\n\n```xml\n<field\
    \ name=\"subjectName\" class=\"java.lang.String\"/>\n<field name=\"marks\" class=\"\
    java.lang.Integer\"/>\n<variable name=\"countNumber\" class=\"java.lang.Integer\"\
    \ calculation=\"Count\">\n<variableExpression><![CDATA[Boolean]]></variableExpression>\n\
