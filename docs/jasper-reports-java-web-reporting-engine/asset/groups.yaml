    # 10. REPORT DATA SOURCES


    Datasources are structured data container. While generating the report, JasperReports
    engine obtains data from the datasources. Data can be obtained from databases,
    XML files, arrays of objects, and collection of objects. We saw in the chapter
    Filling Reports, the fillReportXXX method provides to receive a data source of
    the report, which has to fill, in the form of net.jasperreports.engine.JRDataSource
    object or a java.sql.Connection (when the report is data in a relational database).


    The JRDataSource interface has only two methods, which should be implemented:


    +   - public boolean next() throws JLException

    - At the report filling time, this method is called on the data source object
    by the reporting engine when iterating through the data.

    - public Object getFieldValue(JRField field) throws JLException

    - This method provides the value for each report field in the current data source
    record.


    The only way to retrieve data from the data source is by using the report fields.
    There are several default implementations of the JRDataSource interface, depending
    on the way, the records in the data source are acquired.


    # Datasource Implementations


    The table below summarizes the datasources and their implementation classes:


    | Datasource | Implementation Class |

    |---|---|

    | JDBC | net.jasperreports.engine.JRDataSource |

    | JavaBean | net.jasperreports.engine.data.JRBeanCollectionDataSource, net.jasperreports.engine.data.JRArrayDataSource
    |

    | Map-based | net.jasperreports.engine.data.JRMapArrayDataSource, net.jasperreports.engine.data.JRMapCollectionDataSource
    |

    | TableModel | net.jasperreports.engine.data.JRTableModelDataSource |

    | XML | net.jasperreports.engine.data.JRXmlDataDataSource |

    | CSV | net.jasperreports.engine.data.JRCsvDataSource |

    | XLS | net.jasperreports.engine.data.JRXlsDataSource |

    | Empty | net.jasperreports.engine.JREmptyDataSource |


    # JDBC Data Sources


    Class JRResultSetDataSource wraps a java.sql.ResultSet object. This is the most
    commonly used data source implementations when report data are extracted from
    a relational database. If a java.sql.Connection is passed to the engine, it executes


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_66_0.png)'
- md: '

    # JasperReports


    first the related query and stores the returned java.sql.ResultSet object in a
    JRResultSetDataSource instance.


    # JavaBean Data Sources


    Classes JavaBeanArrayDataSource and JavaBeanCollectionDataSource represent implementations
    that can wrap arrays and collections of JavaBean objects. Each object inside the
    array or the collection will be seen as one record in this type of data source.
    The mapping between a particular JavaBean property and the corresponding report
    field is made by naming conventions. The name of the report field must be the
    same as the name of the JavaBean property specified by the JavaBeans specifications.


    In all the examples of this tutorial, we have used JavaBeanCollectionDataSource.


    # Map-based Data Sources


    The implementation classes JRMapArrayDataSource and JRMapDataSource are useful
    if the parent application already stores the reporting data available in-memory
    as java.util.Map objects. Each Map object in the wrapped array or collection is
    considered a virtual record in the data source, and the value of each report field
    is extracted from the map using the report field named as the key.


    # TableModel Data Sources


    In many client-side applications, data is displayed in tabular format. A common
    requirement in many applications is to allow the user to print this tabular format
    as a report. Implementation class JRTableModelDataSource makes the task of generating
    reports from tabular trivial for Swing applications. This class wraps a javax.swing.table.TableModel
    object. Columns in the wrapped TableModel object can be accessed by their names
    or by their 0-based indexes.


    # XML Data Sources


    Class JRXmlDataSource is a data source implementation based on DOM, which uses
    XPath to select data from the XML document. Records in the XML data source are
    represented by node elements selected through the XPath expression. Field values
    are retrieved from each record using the XPath provided by the field description
    <fieldDescription> element in JRXML.


    XPath is a language to navigate through an XML document''s attributes and elements.
    More information about XPath can be found at http://www.w3.org/TR/xpath.


    # CSV Data Sources


    JRCsvDataSource represents an implementation for data sources, which retrieve
    their data from structured text files; usually CSVs. Field values are retrieved
    using their column index.


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_67_0.png)


    # XLS Data Sources


    JRIsDataSource represents an implementation for data sources, which retrieve data
    from Excel documents. Report-field mapping for this data source implementation
    is also based on the field column index.


    # Empty Data Sources


    The class JEmptyDataSource simulates a data source with a given number of virtual
    empty records inside. It is used by the UI tools to offer basic report preview
    functionality, or in special report templates, for testing and debugging purposes.


    # Rewind Data Sources


    The net.sf.jasperreports.engine.JRewindableDataSource extends the basic DataSource
    interface. It adds only one method, moveFirst(), to the interface. This method
    is intended to move the cursor to the first element in the datasource.


    Rewindable data sources are useful when working with sub-reports except for the
    that is not allowed to split because isAllowed="False" and there is not enough
    space on the current page for the sub-report to be rendered.


    All the above data source implementations are rewind except for the record pointer.
    This poses a problem if this data source is used manually to wrap a java.sql.ResultSet
    before passing it to the sub-report. There is no problem, if the SQL query in
    the sub-report template, the engine will execute again when restarting the sub-report
    on the next page.


    # Data Source Providers


    The JasperReports library has an interface net.sf.jasperreports.engine.DataSourceProvider
    for disposing of data source objects. When creating a report template using GUI
    tools, a special tool for customizing the report''s data is needed. DataSourceProvider
    is the standard way to plug custom data sources into a design tool. A custom implementation
    of this interface should follow the methods that allow creating and disposing
    of data source objects and methods for listing the available report fields inside
    the data source if possible:


    ```

    public boolean getFieldsOperation();


    public JRField[] getFields(JasperReport report)

    throws JException, UnsupportedOperationException;


    public JRDataSource create(JasperReport report) throws JException;

    public void dispose(JRDataSource dataSource) throws JException;

    ```


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_68_0.png)


    # 11. REPORT FIELDS


    Report fields are elements, which represent mapping of data between datasource
    and report template. Fields can be combined in the report expressions to obtain
    the desired output. A report template can contain zero or more <field> elements.
    When declaring report fields, the data source should supply data corresponding
    to all the fields defined in the report template.


    # Field Declaration


    Field declaration is done as shown below:


    ```

    <field name="FieldName" class="java.lang.String"/>

    ```


    # The Name Attribute


    The name attribute of the <field> element is mandatory. It references the field
    in report expressions by name.


    # The Class Attribute


    The class attribute specifies the class name for the field values. Its default
    value is java.lang.String. This can be changed to any class available at runtime.
    Irrespective of the type of a report field, the engine takes care of casting in
    the report expressions using the F{} token used, making manual casts unnecessary.


    # Field Description


    The <fieldDescription> element is an optional element. This is very useful when
    implementing a custom data source. For example, we can store a key or information,
    by which we can retrieve the value from the custom data source at runtime. By
    using the <fieldDescription> element instead of the field name, you can easily
    overcome restrictions of field-naming when retrieving the value from the data
    source. Following is a piece of code from our existing report (Chapter Designs).


    ```

    <field name="country" class="java.lang.String">

    <fieldDescription><![CDATA[country]]></fieldDescription>

    </field>

    <field name="name" class="java.lang.String">

    <fieldDescription><![CDATA[name]]></fieldDescription>

    </field>

    ```


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_69_0.png)


    # Sort Fields


    At the times when sorting is required and the data source implementation doesn''t
    support it (for e.g. CSV datasource), JasperReports supports in-memory field-based
    data source sorting. The sorting can be done using one or more <sortField> elements
    in the report template.


    If least one sort is specified, during report process, the data source is passed
    to a SortableDataSource instance. In this turn, fetches all the records from data
    source, performs in memory sort according to the specified fields, and replaces
    the original data source. The sort field name should be identical to the report
    field name. Fields used for sorting should have types that implement java.util.Comparable.
    Natural order sorting is performed for all fields except those of java.lang.String
    (for String type, collator corresponding to the report fill is used). When several
    fields are specified, the sorting will be performed using the fields sort keys
    in the order which appear in the report template. The following example demonstrates
    the sorting feature.


    # Sorted Report Example


    Let''s add the <sortField> element to our existing report template (Chapter designs).
    Let''s sort field country in descending order. The revised report template (jasper_report_template.jrxml)
    is as follows. We set it to C:\tools\jasperreports-5.0.1\test directory:


    ```xml

    <?xml version="1.0"?>

    <!DOCTYPE jasperReport PUBLIC

    "//JasperReports/DTD Report Design//EN"


    "http://jasperreports.sourceforge.net/dtds/jasperreport.dtd">


    <jasperreport xmlns="http://jasperreports.sourceforge.net"

    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"

    xsi:schemaLocation="http://jasperreports.sourceforge.net/xsd/jasperreport.xsd"

    name="jasper_report_template" pageWidth="595" pageHeight="842"

    columnWidth="515" leftMargin="40" rightMargin="40" topMargin="50"

    bottomMargin="50">


    <parameter name="ReportTitle" class="java.lang.String"/>

    <parameter name="Author" class="java.lang.String"/>


    <queryString>

    <![CDATA[]]>

    </queryString>


    <field name="country" class="java.lang.String"/>

    <fieldDescription><![CDATA[country]]></fieldDescription>

    </field>


    <field name="name" class="java.lang.String"/>

    <fieldDescription><![CDATA[name]]></fieldDescription>

    </field>


    </jasperreport>

    ```


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_70_0.png)

