    # 18. REPORT STYLES


    JasperReports has a feature <style> which helps to control text properties in
    a report template. This element is a collection of style settings declared at
    the report level. Properties like foreground color, background color, whether
    the font is bold, italic, or normal, the font size, a border for the font, and
    many other attributes are controlled by <style> element. Styles can extend other
    styles, and add to, or override properties of the parent style as well.


    # Style Properties


    A <style> element has many attributes. Some of the most commonly used are listed
    in the table below:


    | Attribute | Description |

    | --- | --- |

    | name | Is mandatory. It must be unique because it references the corresponding
    report style throughout the report. |

    | isDefault | Indicates whether this style is the document''s default style. |

    | style | Is a reference to the parent style. |

    | mode | Specifies the element''s transparency. Possible values are Opaque and
    Transparent. |

    | forecolor | Is the foreground color of object. |

    | bgcolor | Is the background color of object. |

    | fill | Determines the fill pattern used to fill the object. At the moment, the
    single value allowed is Solid. |

    | radius | Specifies the radius of the rectangle''s corner arc. |

    | scaleImage | Specifies scale for the images only. Possible values: Left, ClipFrame,
    RetainShape, RealHeight, and RealSize. |

    | hAlign | Specifies the horizontal alignment. Possible values: Top, Middle, and
    Bottom. |

    | vAlign | Specifies the element''s rotation. Possible values: None, Left, Right,
    and UpsDown. |

    | lineSpacing | Specifies the line spacing between lines of text. Possible values:
    Single, 1_1_2, Double. |

    | markup | Specifies the markup style for styled texts. |

    |'' | Specifies the font name. |

    | fontSize | Specifies the font size. |


