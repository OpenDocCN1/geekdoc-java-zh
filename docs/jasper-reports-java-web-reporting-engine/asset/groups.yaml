    \ We can preview this jasper file, executing ant viewDesign.\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_28_0.png)\n\
    \n# 6. JASPERPORTS – FILLING REPORTS\n\nThe main purpose of any reporting tool\
    \ is to produce high quality documents. Report filling helps reporting tool to\
    \ achieve this by manipulating sets of data. The main inputs required for filling\
    \ process are:\n\n- Report Template: This is actual Jasper file.\n- Report Parameters:\
    \ These are basically named values passed at report filling time to the engine.\
    \ We will discuss them in Report Parameter.\n- Data Source: We can fill Jasper\
    \ from range of data sources that include an SQL query, an XML file, a csv file,\
    \ or HQL (Hibernate Query Language) query, a collection of Java Beans. This will\
    \ be discussed in Data Sources.\n\nThe output generated by this process is print\
    \ document which is ready to be viewed, printed, or exported to other formats.\
    \ The class net.jasperreports.engine.JasperFillManager is used for filling report\
    \ template. This has various fillXXX methods that fill report templates (templates\
    \ can be located on disk, picked from input sources, or are supplied directly\
    \ (in-memory)). There are two categories of fillXXX() in this class:\n\n- The\
    \ first type, receive a java.sql.Connection object as the third parameter. Most\
    \ of the times, reports are filled with data from a relational database. This\
    \ is achieved by:\n  - Connect to the database using JDBC.\n  - Include an SQL\
    \ query inside the report template.\n  - JasperReports uses the connection and\
    \ executes the SQL query.\n  - A report source is thus produced for filling the\
    \ report.\n- The second type, receive a net.jasperreports.engine.JRDataSource,\
    \ when the data needs to be filled is available in other forms.\n\n# Fill Report\
    \ Templates\n\nLet's write a report template. The contents of the JRXML file (C:\\\
    tools\\jasperreports-5.0.1\\test\\jasper_report_template.jrxml) are as below:\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE JasperReport PUBLIC\
    \ \"//JasperReports//DTD Design//EN\" \"http://jasperreports.sourceforge.net/dtd/jasperreport.dtd\"\
    >\n<JasperReport xmlns=\"http://jasperreports.sourceforge.net/jasperreports\"\
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\nxsi:schemaLocation=\"\
    http://jasperreports.sourceforge.net/jasperreports http://jasperreports.sourceforge.net/xsd/jasperreport.xsd\"\
    \nname=\"jasper_report_template\" language=\"groovy\" pageWidth=\"595\" pageHeight=\"\
    842\" columnWidth=\"555\" leftMargin=\"20\" rightMargin=\"20\" topMargin=\"20\"\
    \ marginBottom=\"20\">\n```\n\n```xml\n<queryString>\n<![CDATA[]]>\n</queryString>\n\
    <field name=\"country\" class=\"java.lang.String\">\n<fieldDescription><![CDATA[country]]></fieldDescription>\n\
    </field>\n<field name=\"name\" class=\"java.lang.String\">\n<fieldDescription><![CDATA[name]]></fieldDescription>\n\
    </field>\n</columnHeader>\n<band height=\"23\">\n<staticText>\n<reportElement\
    \ mode=\"Opaque\" x=\"0\" y=\"3\" width=\"535\" height=\"15\" backgroundColor=\"\
    #70A9A9\" />\n<box>\n<bottomPen lineWidth=\"1.0\" lineColor=\"#CCCCCC\" />\n</box>\n\
    <textElement />\n<text><![CDATA[]]></text>\n</staticText>\n<staticText>\n<reportElement\
    \ x=\"414\" y=\"3\" width=\"121\" height=\"15\" />\n<textElement textAlignment=\"\
    Center\" verticalAlignment=\"Middle\">\n<font isBold=\"true\" />\n</textElement>\n\
    <text><![CDATA[Country]]></text>\n</staticText>\n<staticText>\n<reportElement\
    \ x=\"0\" y=\"3\" width=\"136\" height=\"15\" />\n```\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_29_0.png)\n\
    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_30_0.png)\n"
