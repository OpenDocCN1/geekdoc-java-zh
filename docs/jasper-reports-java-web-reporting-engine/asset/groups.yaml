    \ sample_report.xls generated in the C:\\ directory.\n\n# 9. REPORTS PARAMETERS\n\
    \nThe main input for filling report are: report template, parameters, and data\
    \ sources. This chapter will describe the parameters and in the next chapter we\
    \ will discuss the data sources.\n\nParameters are the object references, those\
    \ are passed during report-filling operations to the report engine. The data which\
    \ cannot be passed through the data source, can be passed by using parameters.\
    \ Data like author name, title of the report, etc. can be passed through parameters.\
    \ A JasperReports template or JRXML template can have zero or more parameter elements.\n\
    \n# Parameter Declaration\n\nParameter declaration as follows:\n\n```xml\n<parameter\
    \ name=\"exampleParameter\" class=\"java.lang.String\" />\n```\n\n# The Name Attribute\n\
    \nThe name attribute of the <parameter> element is mandatory. It references the\
    \ parameter in report expressions by name. Parameter name should be a single word.\
    \ It should not contain any special characters like dot or comma.\n\n# The Class\
    \ Attribute\n\nThe class attribute is also mandatory and specifies the class name\
    \ for the parameter values. Its default value is java.lang.String. This can be\
    \ changed to any class available at runtime. Irrespective of the type of report\
    \ parameter, the engine takes care of casting in the report expressions where\
    \ the $P{} token is used, making the manual casts unnecessary.\n\nThe report parameter\
    \ values are always packed in a java.util.Map object, which has the parameter\
    \ name as its key. Report parameters can be used in the query string of the report,\
    \ so as to further customize the data set, retrieved from the database. These\
    \ act like dynamic filters in the query that supplies data for the report.\n\n\
    # Built-in Parameters\n\nFollowing are the pre-defined report parameters, ready\
    \ to use in the expressions:\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_55_0.png)\n\
    \n| Parameter Name | Description |\n|---|---|\n| REPORT_PARAMETERS | Contains\
    \ a map with all built-in parameters. |\n| REPORT_CONNECTION | This points to\
    \ user supplied JDBC Connection. |\n| REPORT_DATA_SOURCE | This is a DataSource\
    \ representing data types. |\n| REPORT_COUNT | This is an Integer value allowing\
    \ to limit records. |\n| REPORT_SCRIPTLET | This points to a user-defined scriptlet.\
    \ |\n| REPORT_LOCALE | This is a Locale instance localized messages. |\n| REPORT_RESOURCE_BUNDLE\
    \ | This points to ResourceBundle containing messages. |\n| REPORT_TIME_ZONE |\
    \ This is a TimeZone used for date formatting. |\n| REPORT_VIRTUALIZER | This\
    \ is an instance of net.sf.jasperreports.engine.Virtualizer optimizing memory\
    \ consumption. |\n| REPORT_CLASSLOADER | This is a ClassLoader to load resources.\
    \ |\n| IS_PAGINATION | If set to TRUE, page break will not occur. |\n\n# Let's\
    \ compile and execute the above files using our regular ANT build process. The\
