    \n# 13. REPORT VARIABLES\n\nReport variables are special objects built on top\
    \ of the report expression. Report variables simplify the following tasks:\n\n\
    - Report expressions, which are heavily used throughout the report template. These\
    \ expressions can be declared only once by using the report variables.\n- Report\
    \ variables can perform various calculations on the corresponding expressions\
    \ values such as count, sum, average, lowest, highest, variance, etc.\n\nIf variables\
    \ are defined in a report design, then these can be referenced by name in the\
    \ expressions. Here, the order in which the variables are declared in a report\
    \ design is important.\n\n# Variable Declaration\n\nA variable declaration is\
    \ as follows:\n\n```xml\n<variable name=\"CityNumber\" class=\"java.lang.Integer\"\
    \ incrementType=\"Group\"\nincrementGroup=\"CityGroup\" calculation=\"Count\"\
    >\n<variableExpression>\n  <![CDATA[Boolean.TRUE]]>\n</variableExpression>\n</variable>\n\
    ```\n\nAs seen above, <variable> element contains number of attributes. These\
    \ attributes are summarized below:\n\n# The Name Attribute\n\nSimilar to parameters\
    \ and fields, the name attribute of </variable> element is mandatory. It allows\
    \ referencing the variable by its declared name in the report expressions.\n\n\
    # The Class Attribute\n\nThe class attribute is also mandatory that specifies\
    \ the class name for the variable values. Its default value is java.lang.String.\
    \ This can be changed to any class available in the classpath, both at the report-compilation\
    \ time and the report filling time. The engine takes care of type-casting in report\
    \ expressions where the $V{} token is used, hence manual type-casting is not required.\n"
