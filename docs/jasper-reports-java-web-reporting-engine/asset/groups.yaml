    # 1. JASPERREPORTS – GETTING STARTED


    ## What is a Report?


    A report is a meaningful, well-defined, and summarized presentation of information.
    Usually, the routine activities are automated and data summarized into a decision-supporting
    "Reports". Reports represent usual messy data into charts, graphs, and other forms
    of graphical representations.


    ## Report Template


    Generally, the following layout is adopted to generate reports by most of the
    commercial report generating tools.


    | TITLE |

    | PAGEHEADER |

    | COLUMNHEADER |

    | DETAIL |

    | COLUMNFOOTER |

    | PAGEFOOTER |

    | SUMMARY |


    Following are the descriptions of each element mentioned in the diagram:


    | Element | Description |

    | :--- | :--- |

    | title | Title contains the ‘Title’ of the report. It appears only once at the
    very beginning of the report, for example, "Tutorials Point." |

    | pageHeader | PageHeader may contain date and time information and/or organization
    name. This appears at the top of each page. |

    | columnHeader | ColumnHeader lists the names of those specific fields, which
    we want to display in the report, for example, "Author Name," "Starting Hour,"
    "Finishing Hour," "Hours Worked," "Date," etc. |

    | detail | Detail is the part where entries of specific fields (listed in columnHeader)
    are shown, for example "Manisha," "9:00," "18:00," "9," "10.02.2013." |

    | columnFooter | ColumnFooter may display summation of any of the field, for example,
    "Total Hours Worked: 180." |

    | pageFooter | PageFooter may contain page count information. It appears at the
    bottom of each page, for example, "1./23." |


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_7_0.png)


    | summary | Summary contains information inferred from "detail" part, after listing
    the number of hours, worked by each author, total hours worked by each author
    can be put in visual chart like part chart, graph, etc. for better comparison.
    |


    ## JasperReports


    Following are the common troubles faced during the report development:


    - **Core changes:** Usually, to reflect the business changes or enhancements it
    is required to change the logic of the report.

    - **Results reporting:** There are a wide range of formats, which your report
    can be exported to, such as: HTML, Text, MS Excel, RTF, ODT, Comma-separated values,
    XML or.

    - **Complicated reports:** sub-reports and cross-tabs reports are good example.

    - **Charts reports:** Visual charts; for example, Graph, Pie, XY Line, Bar, Meter,
    and Time series.


    To remove the overhead of the above mentioned points and to facilitate the reporting
    process, a lot of frameworks, tools, libraries, and 3rd party applications were
    introduced. **JasperReports** is one of them.


    JasperReports is an open source java reporting engine. It is Java based and doesn''t
    have its own expression syntax. JasperReports has the ability to deliver rich
    content onto the screen, to the printer, or into PDF, HTML, XLS, RTF, ODT, CSV,
    TXT, and XML files. As it is not a standalone tool, it cannot be installed on
    its own. Instead, it is embedded into Java applications by including its library
    in the application''s CLSPATH.


    JasperReports is a Java class library, and is not meant for the end users, but
    rather is targeted towards Java developers who need to add reporting capabilities
    to their applications.


    ## Features of JasperReports


    Some of the significant features of JasperReports are:


    - It has a flexible report layout.

    - It can present data either textually or graphically.

    - Developers can supply data in multiple ways.

    - It can accept data from the multiple data sources.

    - It can generate watermarks (A watermark is like a secondary image that is laid
    over the primary image).

    - It can generate sub-reports.

    - It is capable of exporting reports in a variety of formats.


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_8_0.png)


    # 2. JASPERREPORTS – ENVIRONMENT SETUP


    JasperReports is a pure Java library and not a standalone application. It cannot
    run on its own, hence it needs to be embedded into another client or server-side
    Java application. As it is based, it can be run on any platform that supports
    Java (JDK 1.3 and above). All the JasperReports'' functionalities are gathered
    in a single JAR file, jasperreports-x.x.x.jar. This JAR along with the required
    and optional libraries (.ZIP file) can be downloaded from the site: **JasperReport
    Library Link**. Download the latest version from this link.


    The ZIP file includes the JasperReports JAR file along with the Jasper source
    code, dependent JARs, and a lot of examples demonstrating Jasper''s functionalities.


    ## JasperReport Environment


    To start creating reports, we need to set up the environment ready. Extract the
    downloaded JasperReport.ZIP to any location (in our case, we have extracted it
    to C:\tools\jasperreports-5.0.1). The directory structure of the extracted file
