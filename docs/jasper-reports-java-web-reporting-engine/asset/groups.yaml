    \ />\n</textFieldElement>\n<textFieldExpression class=\"java.lang.String\">\n\
    <![CDATA[$F{country}]]>\n</textFieldExpression>\n</textField>\n<textField>\n<reportElement\
    \ x=\"0\" y=\"0\" width=\"136\" height=\"15\" />\n<textFieldElement textAlignment=\"\
    Center\"\nverticalAlignment=\"Middle\" />\n<textFieldExpression class=\"java.lang.String\"\
    >\n<![CDATA[$name}]]>\n</textFieldExpression>\n</textField>\n</band>\n</detail>\n\
    </jasperReport>\n```\n\nHere are the details of fields in the report template:\n\
    \n- <queryString>: This is empty (as we are passing data through Java Beans) Usually\
    \ contains the SQL statement, which retrieves the result report.\n- <name>: This\
    \ element is used to map data from data sources or queries, into report templates.\
    \ **name** is re-used in the report body and is case-sensitive.\n- <fieldDescription>:\
    \ This maps the field name with the appropriate element in the XML file.\n- <staticText>:\
    \ This defines the static text that does not depend on any data sources, variables,\
    \ parameters, or report expressions.\n- <textFieldExpression>: This defines the\
    \ appearance of the value of result,\n- $F{country}: This is a variable that contains\
    \ the value of result, predefined field in the tag <name>.\n- <band>: Bounds the\
    \ content of the data, which is displayed in the report.\n\nOnce the design is\
    \ ready, save it in C:\\directory.\n\n12\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_18_0.png)\n\
    \n# Previewing the XML Report Template\n\nThere is a utility net.sf.jasperreports.view.JasperViewer\
    \ available in JasperReports JAR file, which helps in reviewing the report design\
    \ without having to compile or fill it. This utility is a standalone Java application,\
    \ hence can be executed by ANT.\n\nLet's write an ANT target viewXML to view the\
    \ JRXML. So, let's create and save build.xml from C:\\tools\\jasperreports-5.0.1\\\
    test directory (which should be placed in the same directory where JRXML is placed).\
    \ Here is the build file:\n\n```xml\n<xml version=\"1.0\" encoding=\"UTF-8\"?>\n\
    <project name=\"JasperReportTest\" default=\"viewDesignXML\" basedir=\".\">\n\
    \  <import file=\"baseBuild.xml\" />\n  <target name=\"viewDesignXML\" description=\"\
    Design viewer is launched\nto view the JRXML report design.\">\n    <java classname=\"\
    net.sf.jasperreports.view.JasperDesigner\"\n        fork=\"true\">\n      <arg\
    \ value=\"-XML\" />\n      <arg value=\"-F${file.name}.jrxml\" />\n      <classpath\
    \ refid=\"classpath\" />\n    </java>\n  </target>\n</project>\n```\n\nNext, let's\
    \ open a command prompt and go to the directory where build.xml is placed. Execute\
    \ the command ant (As the viewDesignXML is the default target). Output is follows:\n\
    \n```\nC:\\tools\\jasperreports-5.0.1\\test>ant\nBuildfile: C:\\tools\\jasperreports-5.0.1\\\
    test\\build.xml\nnviewDesignXML:\n[java] log4j:WARN No appenders could be found\
