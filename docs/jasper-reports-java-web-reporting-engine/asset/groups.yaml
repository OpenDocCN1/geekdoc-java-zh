    # 19. REPORT SCRIPTLETS


    We have seen in our previous chapters, data displayed on the report is usually
    fetched from report parameters and report fields. This data can be processed using
    the report variables and their expressions. There are situations when a complex
    functionality cannot be easily achieved using report expressions or variables.
    Examples of this may be complex String manipulations, building of Maps, or Lists
    of objects in memory or manipulations of using 3rd party Java APIs. For such situations,
    JasperReports provides us with a simple and powerful means of doing this with
    Scriptlets.


    Scriptlets are sequences of Java code that are executed every time a report occurs.
    Values of report variables can be affected through scriptlets.


    # Scriptlet Declaration


    We declare a scriptlet in two ways:


    +   - By using <scriptlet> element. This element has name attribute and class
    attribute. The class attribute should specify the name of the class, which extends
    JRAbstractScriptlet class. The class must be available in the classpath at report
    filling time and must have an empty constructor, so that the engine can instantiate
    it on the fly.

    - By using the attribute scriptletClass of the element <jasperReport>(JRXML),
    in the report template. By setting this attribute with fully qualified name of
    scriptlet (including the entire package), we indicate that we want to use a scriptlet.
    The scriptlet instance, created with this attribute, acts like the first in the
    list of scriptlets and has the predefined name REPORT.


