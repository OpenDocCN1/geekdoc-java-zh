    # JasperReports


    | No Data | This section is printed when the When No Data report property is set
    to *No Data Section*. If the <noData> section is defined in the report template,
    and if the data source is empty, then the <noData> section will be the only one
    taken into account at fill time, and its content will produce the report output
    |

    | Background | The background section is displayed on every page and not overflow
    to the next page. Elements placed on this section are evaluated at page initialization
    time and are displayed in the background. All other page objects are displayed
    on top of the background objects. This section is useful for creating page watermarks.
    |


    # Section, Elements, and Attribute Relation


    The following diagram shows the elements and attributes relationship in a section
    of a report.


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_107_0.png)


    # Section Elements


    All the mentioned report sections are optional. But any report template will have
    at least one section. Each of these sections contains a single <band> element
    as it is only sub-element. A <band> can contain zero or more sub-elements:

    <line>, <rectangle>, <ellipse>, <image>, <staticText>, <textField>, <subReport>


    Each of these elements must contain a single <reportElement> as its first element
    (except Group). A <reportElement> determines how data is laid out for that particular
    element. Unlike variables and parameters, report elements are not required to
    have a name, because you do not need to obtain any element inside a report template.


    The table below summarizes the attributes of <reportElement>:


    | Attribute | Description | Valid Values |

    |---|---|---|

    | x | Specifies the x coordinate of the band element. | An integer indicating
    the x coordinate of the element in pixels. This attribute is required. |

    | y | Specifies the y coordinate of the band element. | An integer indicating
    the y coordinate of the element in pixels. This attribute is required. |

    | width | Specifies the width of the band element. | An integer indicating the
    element width in pixels. This attribute is required. |

    | height | Specifies the height of the band element. | An integer indicating the
    element height in pixels. This attribute is required. |

    | key | Unique identifier of band element. | A unique string value. |

    | stretchType | Specifies how does the element stretch when the containing band
    stretches | NoStretch (default): The element will not stretch. RelativeToTallestObject:
    The element will stretch to accommodate the tallest object in its group. RelativeToBand:
    The element will stretch to fit the band''s height. |

    | positionType | Specifies the element''s position when the band stretches. |
    Float: The element will move depending on the size of the surrounding elements.
    FixRelativeToTop(default): The element will maintain a fixed position relative
    to the band''s top. FixRelativeToBottom: The element will maintain a fixed position
    relative to the band''s bottom. |

    | isPrintRepeatedValues | Specifies if repeated values are printed. | true(default):
    Repeated values will be printed. false: Repeated values will not be printed. |

    | mode | Specifies the background mode of the element | Opaque, Transparent |

    | isRemoveLineWhenBlank | Specifies if the element should be removed when it is
    blank and there are no other elements in the same horizontal space. | true, false
    |

    | isPrintInFirstWholeBand | Specifies if the element must be printed in a whole
    band, that is, a band that is not divided between report pages or columns. | true,
    false |

    | isPrintWhenDetailFlows | Specifies if the element will be printed when the band
    overflows to a new page or column. | true, false |

    | printWhenGroupChanges | Specifies that the element will be printed when the
    specified group changes. | A string value. |

    | forecolor | Specifies the foreground color of the element. | Either a hexadecimal
    RGB value preceded by the # character, or one of the following predefined values:
    black, blue, cyan, darkGray, gray, green, lightGray, magenta, orange, pink, red,
    white. |

    | backcolor | Specifies the background color of the element. | Same as Valid Values
    for forecolor |


    ## Section Attributes


    Following are the attributes of a report section:


    ## Height


    Height of the section specifies the height in pixels for that particular section
    and is very important in the overall report design.


    ## PrintWhen Expression


    A Boolean expression that determines whether the section should be printed or
    not.


    ## Split Allowed


    A flag indicating whether the section is allowed to split when it does not fit
    on the current page. If true, the section will be transferred to the next page.
    Note that in case, the section does not fit on the next page, the section will
    be split regardless of the flag''s value. splitType can take the following values:


    - splitType="Stretch": Splits stretched content. If the section stretches on the
    current page (if the available space is less than declared height), the region
    that is added to the original height is allowed to split onto the next page.

    - splitType="Prevent": Prevent split on first attempt. If the section does not
    fit on the next page, the split occurs normally, as split prevention is effective
    only on the first split attempt.

    - splitType="Immediate": Split immediately. The band is allowed to split anywhere
    except above, its topmost element.


