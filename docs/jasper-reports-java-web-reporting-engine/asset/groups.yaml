    \ is strikethrough. |\n| pdfFontName | Specifies the related PDF font name. |\n\
    | pdfEncoding | Specifies the character encoding for the PDF output format. |\n\
    | isPdfEmbedded | Indicates if the PDF is embedded. |\n| pattern | Specifies the\
    \ format for formatted texts. |\n| isBlankWhenNull | Indicates if an empty string\
    \ (whitespace) should be shown if expression evaluates to null. |\n\n## Conditional\
    \ Styles\n\nIn some situations, a style should be applied only when certain condition\
    \ is met (for example, to alternate row colors in detail section). This can be\
    \ achieved using conditional styles. A conditional style has two elements:\n\n\
    - Boolean condition expression: the style is used only if condition evaluates\
    \ to true.\n\n## Applying Styles to Report Elements\n\nAny type of report element\
    \ can reference a style definition using the style attribute. Hence, to override\
    \ inherited values, properties specified at report level can be used.\n\n## Style\
    \ Templates\n\nWe can make a set of reports by defining a style at a common place.\
    \ A style template is an XML file that contains one or more style definitions\
    \ by convention the *.jrxml extension, but this is not mandatory.\n\n- <jasperTemplate>:\
    \ This is the root element of style template.\n- <template>: This element is used\
    \ to include references to other template files.\n- <style>: This element is identical\
    \ to the element with the same name from conditional styles involve report expressions,\
    \ and can only be interpreted in the context of a single report definition. References\
    \ to style templates are included in JRXML as <template> elements. The style templates\
    \ are loaded once all templates have been loaded. When loading templates and resolving\
    \ style names to styles, a graph is created, the top of the tree being the set\
    \ of styles defined in depth-first traversal.\n\n## Example\n\nLet's try out the\
    \ conditional styles and templates. add the <style> element alternateStyle to\
    \ our report template (designs). Based on design, font color changes to blue for\
    \ even. We have also included style template \"report_template.jrxml\" as follows:\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE JasperReport PUBLIC\
    \ \"-//JasperReports//DTD Report/EN\" \"http://jasperreports.sourceforge.net/dtd/jasperreport.dtd\"\
    >\n<JasperReport xmlns=\"http://jasperreports.sourceforge.net/jasperreports\"\
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"\
    http://jasperreports.sourceforge.net/xsd/jasperreport.xsd\" name=\"report_template\"\
    \ pageWidth=\"595\" pageHeight=\"842\" columnWidth=\"515\" leftMargin=\"40\" topMargin=\"\
    50\" bottomMargin=\"50\">\n  <style.jrtx</style>\n  <style name=\"alternateStyle\"\
    \ fontName=\"Arial\" forecolor=\"red\">\n    <conditionExpression>\n      <![CDATA[$V{countNumber}.intValue()\
    \ % 2 == 0]]\n    </conditionExpression>\n    <style forecolor=\"blue\" isBold=\"\
    true\"/>\n  </style>\n  <parameter name=\"ReportTitle\" class=\"java.lang.String\"\
    />\n  <parameter name=\"Author\" class=\"java.lang.String\"/>\n  <queryString>\n\
    \    <![CDATA[]]>\n  </queryString>\n  <field name=\"country\" class=\"java.lang.String\"\
    >\n    <fieldDescription><![CDATA[country]]></fieldDescription>\n  </field>\n\
    \  <field name=\"name\" class=\"java.lang.String\">\n    <fieldDescription><![CDATA[name]]></fieldDescription>\n\
    \  </field>\n  <variable name=\"countNumber\" class=\"java.lang.Integer\" calculation=\"\
    Count\">\n    <variableExpression><![CDATA[Boolean.TRUE]]></variableExpression>\n\
    \  </variable>\n  <title>\n    <band height=\"70\">\n      <line>\n        <reportElement\
    \ x=\"0\" y=\"0\" width=\"515\" height=\"1\"/>\n      </line>\n      <textField\
    \ isBlankWhenNull=\"true\" bookmarkLevel=\"1\">\n        <reportElement x=\"0\"\
    \ y=\"0\" width=\"515\" height=\"30\"/>\n        <textElement textAlignment=\"\
    Center\">\n          <font size=\"22\"/>\n        </textElement>\n        <textField\
    \ class=\"java.lang.String\">\n          <![CDATA[$P{ReportTitle}]]>\n       \
    \   <anchorNameExpression><![CDATA[\"Title\"]]]></anchorNameExpression>\n    \
    \    </textField>\n      </textField>\n      <textField isBlankWhenNull=\"true\"\
    >\n        <reportElement x=\"0\" y=\"40\" width=\"515\" height=\"20\"/>\n   \
    \     <textElement textAlignment=\"Center\">\n          <font size=\"10\"/>\n\
    \        </textElement>\n        <textFieldExpression class=\"java.lang.String\"\
    >\n          <![CDATA[$P{Author}]]>\n        </textFieldExpression>\n      </textField>\n\
    \    </band>\n  </title>\n  <columnHeader>\n    <band height=\"23\">\n      <staticText>\n\
