    \ language=\"groovy\" pageWidth=\"595\"\nheight=\"842\" columnWidth=\"555\" leftMargin=\"\
    20\" rightMargin=\"20\"\ntopMargin=\"20\" bottomMargin=\"20\" resourceBundle=\"\
    localizationdemo\">\n<title>\n\n<band name=\"552\">\n  <textField>\n\n  <reportElement\
