  mdcn: "\n\n# 联系人列表\n由 Manisha 准备\n\n| 姓名 | 国家 |\n| :--- | :--- |\n| Dennis Ritchie\
    \ | 美国 |\n| Manisha | 印度 |\n| V. Anand | 印度 |\n| Srinath | 加利福尼亚 |\n\n在这里，我们可以看到国家名称是按字母降序排列的。\n\
    \n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_79_0.png)\n\n报告表达式（Report expressions）是\
    \ JasperReports 的强大功能，允许我们在报告上显示计算后的数据。计算后的数据不是静态数据，也不是专门作为报告参数或数据源字段传递的数据。报告表达式通过组合报告参数、字段和静态数据构建。默认情况下使用\
    \ Java 语言编写报告 Groovy 表达式。JasperReports 还支持其他用于报告表达式的脚本语言，如 Groovy 脚本语言、JavaScript\
    \ 或 BeanShell 。\n\n本章将向你解释——报告表达式是如何工作的，假设它们仅使用 Java 语言编写。在 JXRL 报告模板中，有几个元素定义了表达式：\n\
    \n- <variableExpression>\n- <initialValueExpression>\n- <groupExpression>\n- <printWhenExpression>\n\
    - <imageExpression>\n- <textFieldExpression>\n\n## 表达式声明\n\n基本上，所有的报告表达式都是 Java\
    \ 表达式，可以引用报告字段、报告变量和报告参数。\n\n## 表达式中的字段引用\n\n要在表达式中使用字段引用，必须将字段名放在 **$F{ 和 }**\
    \ 字符序列之间，如下所示：\n\n```xml\n<textFieldExpression>\n$F{Name}\n</textFieldExpression>\n\
    ```\n\n以下来自我们现有 JRXML 文件的一段代码（来自 **报告设计** 章节）：\n\n```xml\n<textFieldExpression\
    \ class=\"java.lang.String\">\n<![CDATA[$F{country}]]>\n</textFieldExpression>\n\
    ```\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_80_0.png)\n\n## 表达式中的变量引用\n\n\
    要在表达式中引用变量，我们必须将变量名放在 $V{ 和 } 之间，如下例所示：\n\n```xml\n<textFieldexpression>\n\"Total\
    \ height : \" + $V{SumOfHeight} + \" ft.\"\n</textFieldexpression>\n```\n\n##\
    \ 表达式中的参数引用\n\n要在表达式中引用参数，应将参数名放在 $P{ 和 } 之间，如下示例所示：\n\n```xml\n<textFieldexpression>\n\
    \"Report Title : \" + $P{Title}\n</textFieldexpression>\n```\n\n以下来自我们现有 JRXML\
    \ 文件的一段代码，演示了在表达式中引用参数。（来自报告设计章节的 JRXML）：\n\n```xml\n<textField isBlankNull=\"\
    true\" bookmarkLevel=\"1\">\n  <reportElement x=\"0\" y=\"10\" width=\"515\" height=\"\
    30\">\n    <textFieldElement textAlignment=\"Center\">\n      <font size=\"22\"\
    />\n    </textFieldElement>\n    <textFieldExpression class=\"java.lang.String\"\
    >\n      <![CDATA[$P{ReportTitle}]]>\n    </textFieldExpression>\n    <anchorNameExpression>\n\
    \      <![CDATA[\\Title\\]]>\n  </anchorNameExpression>\n</textField>\n<textField\
    \ isBlankNull=\"true\">\n  <reportElement x=\"0\" y=\"40\" width=\"515\" height=\"\
    20\">\n    <textFieldElement textAlignment=\"Center\">\n      <font size=\"10\"\
    />\n    </textFieldElement>\n    <textFieldExpression class=\"java.lang.String\"\
    >\n      <![CDATA[$P{Author}]]>\n    </textFieldExpression>\n</textField>\n```\n\
    \n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_81_0.png)\n\n## JasperReports\n\n正如你所见，参数、字段和变量引用实际上是\
    \ Java 对象。通过报告模板中的参数、字段或变量声明中了解它们的类，我们甚至可以在表达式中对对象引用调用方法。\n\n以下示例展示了——如何提取并显示\
    \ java.lang.String 报告字段 \"Name\" 的第一个字母：\n\n```xml\n<textFieldExpression>\n$F{Name}.substring(0,\
    \ 1)\n</textFieldExpression>\n```\n\n## 表达式中的资源包引用\n\n要在表达式中引用资源，应将键值放在 $R{ 和\
    \ } 之间，如下示例所示：\n\n```xml\n<textFieldExpression>\n$R{report.title}\n</textFieldExpression>\n\
    ```\n\n根据运行时提供的 locale 和 report.title 键，加载与报告模板关联的资源包。因此，报告标题将通过从资源包中提取 String\
    \ 值来显示。关于国际化的更多信息，可以参阅“国际化”章节。\n\n## 计算器 (Calculator)\n\nCalculator 是 JasperReports\
    \ 中的一个实体，它在报告填充期间评估表达式并增加变量或数据集。在编译过程中，报告编译器会产生信息并将其存储在池中。这些信息在报告填充期间用于构建 net.sf.jasperreports.engine.fillJRCalculator\
    \ 实例。\n\n基于 Java 的报告编译器会即时生成并编译 Java 源文件。此生成的类是 JRCalculator 的子类，编译它时产生的字节码存储在\
    \ JasperReport 对象中。该字节码在报告填充时加载，并实例化结果类以获取用于表达式评估的计算器对象。\n\n## 条件表达式\n\nJasperReports\
    \ 不支持在定义变量时使用 if-else 语句。相反，你可以使用三元运算符根据条件获取输出![](img/c7ac028fe0205a5d7878fbfc6ebd9483_82_0.png\n\
    \n## 报告中的条件表达式\n\n让我们修改报告设计并为字段添加条件表达式，修改后的报告（jrxml）如下：\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE Report PUBLIC \"-//JasperReports/Report\
    \ 2.0//EN\" \"http://jasperreports.sourceforge.net/jasper-2.0.dtd\">\n<Report\
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" width=\"595\" height=\"\
    842\" pageWidth=\"40\" leftMargin=\"40\" rightMargin=\"40\" topMargin=\"40\">\n\
    ...（此处内容不完整，未继续翻译）\n```\n"
