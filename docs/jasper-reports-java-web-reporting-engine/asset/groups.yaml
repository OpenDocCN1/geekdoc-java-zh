    ## JasperReports


    | <incrementWhenExpression> | The chart dataset is incremented can be customized
    by filtering out unwanted data through the use of this subelement. |

    | <datasetRun> | This contains information required to instantiate a report subdataset.
    |


    ## Dataset Types


    Specific dataset types are explained below:


    ### Pie Dataset


    A pie dataset is characterized by the following expressions:


    - * <keyExpression> - represents the categories that will make up the slices in
    the pie chart. This expression can return any java.lang.Comparable object.

    - <expression> - produces the values that correspond to each category/key in the
    dataset. Values are always java.lang.Number objects.

    - <labelExpression> - if this expression is missing, the chart will display default
    labels for each slice in the pie chart. This expression, returns java.lang.String
    values to customize the item labels for the chart.

    - <sectionHyperlink> - sets hyperlinks associated with the pie sections.


    ### Category Dataset


    A category dataset is characterized by the <categorySeries> element, which contains:


    - * <seriesExpression> - indicates the name of the series. This expression can
    return any java.lang.Comparable object.

    - <categoryExpression> - returns the name of the category for each value inside
    the series specified by the series expression. Categories are always java.lang.Comparable
    objects.

    - <expression> - produces the values that correspond to each category in the dataset.
    Values are always java.lang.Number objects.

    - <labelExpression> - if this expression is missing, the chart will display default
    labels for each item in the chart. This expression, returns java.lang.String values,
    to customize the item labels for the chart.

    - <itemHyperlink> - sets hyperlinks associated with chart items.


    ### XY Dataset


    An XY dataset is characterized by the <xySeries> element, which contains:


    - * <seriesExpression> - indicates the name of the series. This expression can
    return any java.lang.Comparable object.


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_196_0.png)


    - <xExpression> - returns the java.lang.Number representing the X value from the
    (x, y) pair that will be added to the current data series.

    - <yExpression> - returns the java.lang.Number representing the Y value from the
    (x, y) pair that will be added to the current data series.

    - <labelExpression> - if this expression is missing, the chart will display default
    labels for each item in the chart. This expression, returns java.lang.String values,
    to customize the item labels for the chart.

    - <itemHyperlink> - sets hyperlinks associated with the chart items.


    ### XYZ Dataset


    An XYZ dataset is characterized by the <xyzSeries> element, which contains:


    - <seriesExpression> - indicates the name of the series. This expression can return
    any java.lang.Comparable object.

    - <xExpression> - returns the java.lang.Number representing the X value from the
    (x, y, z) item that will be added to the current data series.

    - <yExpression> - returns the java.lang.Number representing the Y value from the
    (x, y, z) item that will be added to the current data series.

    - <zExpression> - returns the java.lang.Number representing the Z value from the
    (x, y, z) item that will be added to the current data series.

    - <labelExpression> - if this expression is missing, the chart will display default
    labels for each item in the chart. This expression, returns java.lang.String values,
    to customize the item labels for the chart.

    - <itemHyperlink> - sets hyperlinks associated with the chart items.


    ### Time Series Dataset


    A time series dataset is characterized by the timePeriod attribute, and the <timeSeries>
    element. The timePeriod attribute specifies the type of the data series inside
    the dataset. Time series can contain numeric values with days, months, years,
    or predefined time periods. Possible values are: Year, Quarter, Month, Week, Day
    - this is the default value, Hour, Minute, Second, Millisecond.


    The <timeSeries> element contains:


    - <seriesExpression> - indicates the name of the series. This expression can return
    any java.lang.Comparable object.

    - <timeExpression> - returns a java.util.Date value which the engine will extract
    the corresponding time period depending on the value set for the timePeriod mentioned
    above.

    - <valueExpression> - returns the java.lang.Number value to associate with the
    corresponding time period value when incrementing the current series of the dataset.

    - <labelExpression> - if this expression is missing, the chart will display default
    labels for each item in the chart. This expression, returns java.lang.String values,
    to customize the item labels for the chart.


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_197_0.png)


    - <itemHyperLink> - sets hyperlinks associated with the chart items.


    ### Time Period Dataset


    A time period dataset is characterized by the <timePeriodSeries> element, which
    contains:


    - <seriesExpression> - indicates the name of the series. This expression can return
    any java.lang.Comparable object.

    - <startDateExpression> - specifies the beginning of the date interval with which
    the numeric value will be associated when it is added to the time period series.

    - <endDateExpression> - specifies the end of the date interval with which the
    numeric value will be associated when it is added to the time period series.

    - <valueExpression> - returns the java.lang.Number value to associate with the
    corresponding time period value when incrementing the current series of the dataset.

    - <labelExpression> - if this expression is missing, the chart will display default
    labels for each item in the chart. This expression, returns java.lang.String values,
    to customize the item labels for the chart.

    - <itemHyperLink> - sets hyperlinks associated with the chart items.


    ### High Low Dataset


    A high low dataset is characterized by the following expressions:


    - * <seriesExpression> - indicates the name of the series. This expression can
    return any java.lang.Comparable object.

    - <dateExpression> - returns the date to which the (high, low, open) item refers.

    - <highExpression> - returns the java.lang.Number value, which will be part of
    the data item added to the current data series.

    - <lowExpression> - returns the java.lang.Number value, which will be part of
    the data item added to the current data series.

    - <openExpression> - returns the java.lang.Number value, which will be part of
    the data item added to the current data series.

    - <closeExpression> - returns the java.lang.Number value, which will be part of
    the data item added to the current data series.

    - <volumeExpression> - a numeric expression that returns the volume value to use
    for the current item. It is used only for Candlestick charts.

    - <itemHyperLink> - sets hyperlinks associated with the chart items.


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_198_0.png)


    ## Value Dataset


    This is a special chart dataset implementation that contains a single value and
    is used for Meter and Thermometer charts. The value is collected using the <Expression>.


    ## Chart Plots


    Another JRXML element through chart types is the <plot> element. This allows us
    to define several of the chart''s characteristics like orientation and background
    color. Plots differ, based on the type of chart.


    ## Plot Attribute


    The table below summarizes the attributes of <plot> element:


    | Attribute | Description | Values |

    | --- | --- | --- |

    | bgcolor | This attribute defines the chart''s background color. | Any six digit
    hexadecimal value is a valid value for this attribute. The hexadecimal value must
    be preceded by a # |

    | orientation | This attribute defines the chart''s orientation. | Horizontal
    / Vertical. Default value is "Vertical" |

    | backgroundAlpha | This attribute defines the transparency of the chart''s background
    color. | The valid values for this attribute are between 0 and 1, inclusive. The
    higher the value, the less transparent the background will be. Default value is
    "1." |

    | foregroundAlpha | This attribute defines the transparency of the chart''s foreground
    colors. | The valid values for this attribute include any decimal number between
    0 and 1, inclusive. The higher, the less transparent the background will be. Default
    value is "1." |

    | labelRotation | This attribute allows rotation of text labels on x-axis to rotate
    clockwise or anti-clockwise. This attribute applies only to charts for which the
    x axis is not numeric or does not display days. | Default value is "0.0." |

