    # JasperReports


    首先执行相关查询，并将返回的 `java.sql.ResultSet` 对象存储在 `JRResultSetDataSource` 实例中。


    # JavaBean 数据源


    `JavaBeanArrayDataSource` 和 `JavaBeanCollectionDataSource` 类表示封装 JavaBean 对象的数组和集合的实现。数组或集合中的每个对象都将被视为此类数据源中的一条记录。特定
    JavaBean 属性与对应报告字段之间的映射通过命名约定实现。报告字段的名称必须与 JavaBeans 规范指定的 JavaBean 属性名称相同。


    在本教程的所有示例中，我们都使用了 `JavaBeanCollectionDataSource`。


    # 基于 Map 的数据源


    如果父应用程序已经以 `java.util.Map` 对象的形式在内存中存储了可用的报告数据，那么实现类 `JRMapArrayDataSource` 和
    `JRMapDataSource` 就非常有用。封装在数组或集合中的每个 Map 对象被视为数据源中的一个虚拟记录，每个报告字段的值通过作为键的报告字段从
    map 中提取。


    # TableModel 数据源


    在许多客户端应用程序中，数据以表格形式显示。许多应用程序的一个共同需求是允许用户将此表格格式打印为报告。实现类 `JRTableModelDataSource`
    使 Swing 应用程序从表格生成报告的任务变得简单。该类封装了 `javax.swing.table.TableModel` 对象。可以通过名称或基于 0
    的索引访问封装的 TableModel 对象中的列。


    # XML 数据源


    `JRXmlDataSource` 类是基于 DOM 的数据源实现，它使用 XPath 从 XML 文档中选择数据。XML 数据源中的记录由通过 XPath
    表达式选择的节点元素表示。使用 JRXML 中字段描述 `<fieldDescription>` 元素提供的 XPath 从每个记录中检索字段值。


    XPath 是一种用于遍历 XML 文档属性和元素的语言。关于 XPath 的更多信息可以访问 http://www.w3.org/TR/xpath 获取。


    # CSV 数据源


    `JRCsvDataSource` 表示数据源的实现，它从结构化文本文件（通常是 CSV）中检索数据。字段值通过其列索引进行检索。


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_67_0.png)


    # XLS 数据源


    `JRIsDataSource` 表示数据源的实现，它从 Excel 文档中检索数据。该数据源实现实现的报告-字段映射也基于字段列索引。


    # 空数据源


    `JEmptyDataSource` 类模拟了一个内部包含给定数量虚拟空记录的数据源。它被 UI 工具用于提供基本的报告预览功能，或者在特殊报告模板中用于测试和调试目的。


    # 回溯数据源


    `net.sf.jasperreports.engine.JRewindableDataSource` 扩展了基本的 `DataSource` 接口。它仅向接口添加了一个方法
    `moveFirst()`。该方法旨在将光标移动到数据源中的第一个元素。


    在处理子报告时，回溯数据源是有用的，除非出现由于 `isAllowed="False"` 而不允许拆分，且当前页没有足够的空间来渲染子报告的情况。


    上述所有数据源实现都是可回溯的，但记录指针除外。如果手动使用此数据源封装 `java.sql.ResultSet` 然后将其传递给子报告，就会出现问题。如果子报告模板中有
    SQL 查询，引擎在下一页重新启动子报告时将再次执行它，则没有问题。


    # 数据源提供者


    JasperReports 库有一个接口 `net.sf.jasperreports.engine.DataSourceProvider` 用于释放数据源对象。当使用
    GUI 工具创建报告模板时，需要一个特殊的工具来定制报告数据。`DataSourceProvider`是将自定义数据源插入到设计工具的标准方法。此接口的自定义实现应遵循创建和释放数据源对象的方法，并在可能的情况下提供列出数据源内部可用报告字段的方法：


    ```

    public boolean getFieldsOperation();


    public JRField[] getFields(JasperReport report)

    throws JException, UnsupportedOperationException;


    public JRDataSource create(JasperReport report) throws JException;

    public void dispose(JRDataSource dataSource) throws JException;

    ```


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_68_0.png)


    # 11. 报告字段


    报告字段是元素，代表数据源和报告模板之间的数据映射。字段可以在报告表达式中组合以获得所需的输出。报告模板可以包含零或多个 `<field>` 元素。在声明报告字段时，数据源应该提供与报告模板中定义的所有字段对应的数据。


    # 字段声明


    字段声明按如下所示进行：


    ```

    <field name="FieldName" class="java.lang.String"/>

    ```


    # Name 属性


    `<field>` 元素的 `name` 属性是强制性的它通过名称引用报告表达式中的字段。


    # Class 属性


    `class` 属性指定字段值的类名。其默认值是 `java.lang.String`。它可以更改为运行时可用的任何类。无论报告字段的类型如何，引擎都会在处理使用
    `F{}` 标记的报告表达式中处理类型转换，使得手动转换变得不再必要。


    # 字段描述


    `<fieldDescription>` 元素是一个可选元素。这在实现自定义数据源时非常有用。例如，我们可以存储一个键或信息，通过该信息我们可以在运行时从自定义数据源中检索值。通过使用
    `<fieldDescription>` 元素而不是字段名，您可以轻松地克服从数据源检索值时字段命名的限制。以下是来自我们现有报告的一段代码：


    ```

    <field name="country" class="java.lang.String">

    <fieldDescription><![CDATA[country]]></fieldDescription>

    </field>

    <field name="name" class="java.lang.String">

    <fieldDescription><![CDATA[name]]></fieldDescription>

    </field>

    ```


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_69_0.png)


    # 排序字段


    需要排序且数据源实现不支持时（例如 CSV 数据源），JasperReports 支持基于内存的数据源排序。可以使用报告模板中的一个或多个 `<sortField>`
    元素进行排序。


    如果在处理过程中指定了至少一个排序，数据源将传递给 `SortableDataSource` 实例。这将从数据源获取所有记录，根据指定的字段进行内存排序并替换原始数据源。排序字段名应与报告字段相同。用于排序的字段类型应实现
    `java.util.Comparable`。对于 `java.lang.String` 类型外进行自然排序。如果指定了多个字段，将按照它们在报告模板中出现的顺序进行排序。下面的示例演示了排序功能。


    # 排序报告示例


    为现有报告模板添加 `<sortField>` 元素。我们将 country 字段降序排序。修订后的模板 (jasper_report_template.jrxml)
    如下：


