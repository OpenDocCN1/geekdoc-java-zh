    define expressions that will help the chart dataset. JasperReports uses JFreeChart
    as the underlying charting library. When configuring a new chart component, the
    following three components are involved:


    - The chart component.

    - The chart dataset (which groups chart data-related settings).

    - The chart plot (which groups visual settings relative to the way the chart items
    are rendered).


    JasperReports currently supports the following types of charts: Pie, Pie 3D, Bar,
    Bar 3D, XY Bar, Stacked Bar, Stacked Bar 3D, Line, XY Line, Area, XY Area, Stacked
    Area, Scatter, Bubble, Time Series, High-Low-Close, Candlestick, Multiple Axis,
    Meter, Thermometer, and Gantt.


    # Chart Properties


    Charts are normal elements, so they share some of their properties with all the
    other report elements. There is a JRXML element called <chart>, used to create
    all type of charts. These groups special chart-specific objects that apply to
    all types of charts.


    # Chart Sub-Elements


    The sub-elements of <chart> element are:


    - <reportElement>: These are displayable objects like static texts, text fields,
    images, lines, and rectangles that you put in your report template sections.

    - <Box>: This element is used to surround charts by a border that''s customizable
    on each side.

    - <chartTitle>: This element is used to place the title of the chart. The Position
    attribute decides the title position of the chart in the report. This element
    has attributes - Position (Values could be Top, Bottom, Left, Right. Default value
    is Top), color. <chartTitle> has font and titleExpression elements.

    - <chartSubtitle>: This element is used to place the subtitle of the chart. This
    element has attribute - color. <chartSubtitle> has font and subtitleExpression
    elements.

    - <chartLegend>: The element can control the font-related properties as well as
    the text color and the background color of the chart legend using. This element
    has attributes - textColor and backgroundColor.


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_193_0.png)


    # JasperReports


    - <anchorNameExpression>: This element creates the target for the anchor.

    - <hyperlinkReferenceExpression>: This element contains a report expression indicating
    the name of the external resource (usually a URL).

    - <hyperlinkAnchorExpression>: Hyperlink points to an anchor in an external resource.

    - <hyperlinkPageExpression>: Hyperlink points to a page in the current report.

    - <hyperlinkTooltipExpression>: Hyperlink points to a tooltip.

    - <hyperlinkParameter>: This element contains the hyperlink parameter.


    # Chart Attributes


    Attributes in the <chart> element:


    - isShowLegend: This attribute determines if the legend will be displayed. Values
    could be true or false.

    - evaluationTime: This attribute determines when the chart is evaluated. Values
    could be Now, Report, Page, Column, Group.

    - hyperlinkType: This attribute determines the type of hyperlink.

    - hyperlinkTarget: This attribute determines the hyperlink target. Values could
    be Self or Blank.

    - bookmarkLevel: This attribute determines the level of the bookmark.

    - customizerClass: This is the name of a class (optional) that can customize the
    chart.


    # Chart Customization


    As mentioned above, JasperReports use JFreeChart as the underlying charting library.
    We can take advantage of these features by using a customizer via the customizerClass
    in <chart>. A customizer is an implementation of the net.sf.jasperreports.engine.JRustomizer
    interface. The easiest way to implement this interface is by extending the net.sf.jasperreports.RAAbstractChartCustomizer
    class and having access to parameters, fields, and variables for more chart customization.


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_194_0.png)


    # Chart Datasets


    One of the common properties across all chart types is <dataset> element. Chart
    datasets help mapping report data and retrieving chart data at runtime. Each chart
    type contains different sub-elements to define chart''s expressions. All of these
    sub-elements contain a <dataset> element that defines when the chart''s expressions
    are evaluated and reset.


    Several types of chart datasets are available in JasperReports because each type
    of chart works with certain datasets: Pie, Category, XY, Time Series, Time Period,
    XYZ, and High-Low. Each of these dataset types implements net.sf.jasperreports.engine.JRChartDataset
    interface that defines chart datasets. All chart datasets initialize and increment
    in the same way; however, they differ in the type of data or report series they
    map.


    # Dataset Properties


    | Attribute | Description |

    |---|---|

    | resetType | This attribute determines when the value of the chart expression
    is to reset. None, Report, Page, Column, Group. Default value is Report. |

    | resetGroup | This attribute determines the name of the group at which the chart
    expression value is reset. The value for this attribute must match the name of
    any group declared in the JRMXML report template. |

    | incrementType | This attribute determines when to recalculate the value of the
    chart expression. None, Report, Page, Column, Group. Default value is "None".
    |

    | incrementGroup | This attribute determines the name of the group at which the
    chart expression is recalculated. The value for this attribute must match the
    name of any group declared in the JRMXML report template. |


