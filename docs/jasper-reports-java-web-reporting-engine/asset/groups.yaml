    ## 16. REPORT FONTS


    A report contains text elements and each of these can have its own font settings.
    These settings can be specified using the <font> tag available in the <element>
    tag. A report can define a number of fonts. Once defined, they can be used as
    default or base font settings for other font definitions throughout the report.


    ### Report Fonts


    A report is a collection of font settings, declared at the report level. A report
    font can be reused throughout the entire report template when setting the properties
    of text elements.


    Report fonts are now deprecated. Do not use <reportFont/> elements declared within
    the document itself. Use the <style/> element instead.


    ### Font Attributes


    Table summarizes the main attributes of the <font> element:


    | Attribute | Description |

    |---|---|---|

    | fontName | The font name, which can be the name of a physical font, a logical
    one, or the name of a font family from the registered JasperReports extensions.
    |

    | size | The size of the font measured in points. It defaults to 10. |

    | isBold | The flag specifying if a bold font is required. It defaults to false.
    |

    | isItalic | The flag specifying if an italic font is required. It defaults to
    false. |

    | isUnderline | The flag specifying if the underline decoration is required. It
    defaults to false. |

    | isStrikeThrough | The flag specifying if the strikethrough text decoration is
    required. It defaults to false. |

    | pdfName | The name of an equivalent PDF font required by the iText library when
    exporting documents to PDF format. |

    | pdfEncoding | The equivalent PDF character encoding, also required by the iText
    library. |

    | isPdfEmbedded | The flag that specifies whether the font should be embedded
    into the document itself. It defaults to false. If set to true, helps view the
    PDF document without any problem. |


    ### Font Types


    In JasperReports fonts can be categorized as:


    - **Logical Fonts:** Five font types, which have been recognized by the Java platform
    since version 1.0, are called logical fonts. These are Serif, SansSerif, Monospaced,
    Dialog, and DialogInput. These logical fonts are not actual font libraries that
    are installed anywhere on the system. They are merely font recognized by the Java
    runtime. These must be mapped to some physical font that is installed on the system.

    - **Physical Fonts:** These are the actual font libraries consisting of, for example,
    TrueType or PostScript Type 1 fonts. The physical fonts may be Arial, Helvetica,
    Courier, or any number of other fonts, including international fonts.

    - **Font Extensions:** The JasperReports library can use of fonts registered on-the-fly
    at runtime, using its built-in support for font extensions. A list of font families
    can be made available to JasperReports using font extension. These are made out
    of similarly looking fonts and supporting specific locales.


    As described in the table above, we need to specify the name of a physical font,
    a logical font, or the name of a font family from the registered.


    ### PDF Font Name


    JasperReports uses the name of a physical font (Portable Document Format). The
    pdfName attribute is used when exporting to PDF. The library recognizes the following-in
    names:


    - Courier

    - CourierBold

    - CourierOblique

    - Helvetica

    - HelveticaBold

    - HelveticaOblique

    - Times

    - TimesBold

    - TimesItalic

    - Zapf


    ### Default Fonts and Inheritance


    Each element inherits styles from its parent. If no style is explicitly defined,
    it looks for the default style. The default properties and their values are:


    | Property | Description |

    |---|---|

    | name=SansSerif | The default name. |

    | size=10 | The default size. |

    | pdfName=Helvetica | The default PDF font. |

    | encoding=Cp152 | The default encoding. |

    | embedded=false | By default fonts are not embedded. |


    ### Example


    To demonstrate using fonts and attributes in order to get a particular text appearance,
    let''s write new report template (jasper_report_template). The contents of the
    JRXML are as below. Save it to C:\tools\jasperreports-5.0.1\test directory. Here
    we display a title of the report in various font formats.


    ```xml

    <?xml version="1.0" encoding="UTF-8"?>

    <jasperReport xmlns="http://jasperreports.sourceforge.net/jasperreports"

    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"

    xsi:schemaLocation="http://jasperreports.sourceforge.net/jasperreport.xsd

    http://jasperreports.sourceforge.net/jasperreport.xsd

    name="jasper_report_template" pageWidth="595" pageHeight="842"

    columnWidth="555" leftMargin="20" rightMargin="20" topMargin="30">

    <title>

    <band height="682" />

    <staticText>

    <reportElement x="0" y="50" width="150" height="40"/>

    <text><![CDATA[Welcome to TutorialsPoint!]]></text>

    </staticText>

    <staticText>

    <reportElement x="0" y="100" width="150" height="40"/>

    <text>

    <font size="12" />

    </text>

    <text><![CDATA[Welcome to TutorialsPoint!]]></text>

    </staticText>

    </title>

    </jasperReport>

    ```

