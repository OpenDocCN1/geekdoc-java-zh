    # JasperReports


    first the related query and stores the returned java.sql.ResultSet object in a
    JRResultSetDataSource instance.


    # JavaBean Data Sources


    Classes JavaBeanArrayDataSource and JavaBeanCollectionDataSource represent implementations
    that can wrap arrays and collections of JavaBean objects. Each object inside the
    array or the collection will be seen as one record in this type of data source.
    The mapping between a particular JavaBean property and the corresponding report
    field is made by naming conventions. The name of the report field must be the
    same as the name of the JavaBean property specified by the JavaBeans specifications.


    In all the examples of this tutorial, we have used JavaBeanCollectionDataSource.


    # Map-based Data Sources


    The implementation classes JRMapArrayDataSource and JRMapDataSource are useful
    if the parent application already stores the reporting data available in-memory
    as java.util.Map objects. Each Map object in the wrapped array or collection is
    considered a virtual record in the data source, and the value of each report field
    is extracted from the map using the report field named as the key.


    # TableModel Data Sources


    In many client-side applications, data is displayed in tabular format. A common
    requirement in many applications is to allow the user to print this tabular format
    as a report. Implementation class JRTableModelDataSource makes the task of generating
    reports from tabular trivial for Swing applications. This class wraps a javax.swing.table.TableModel
    object. Columns in the wrapped TableModel object can be accessed by their names
    or by their 0-based indexes.


    # XML Data Sources


    Class JRXmlDataSource is a data source implementation based on DOM, which uses
    XPath to select data from the XML document. Records in the XML data source are
    represented by node elements selected through the XPath expression. Field values
    are retrieved from each record using the XPath provided by the field description
    \<fieldDescription> element in JRXML.


    XPath is a language to navigate through an XML document''s attributes and elements.
    More information about XPath can be found at http://www.w3.org/TR/xpath.


    # CSV Data Sources


    JRCsvDataSource represents an implementation for data sources, which retrieve
    their data from structured text files; usually CSVs. Field values are retrieved
    using their column index.


    ![](img/c7ac028fe0205a5d7878fbfc6ebd9483_67_0.png)'
