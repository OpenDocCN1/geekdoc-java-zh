    \ opens, displaying our report template preview.\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_20_0.png)\n\
    \nAs we see, only report expressions for obtaining the data are displayed, as\
    \ JasperDesignViewer doesn't have access to the actual data source or report parameters.\
    \ Terminate the JasperDesignViewer by closing the window or by hitting Ctrl-c\
    \ in the command-line window.\n\n# 5. JASPERREPORTS - COMPILING REPORT DESIGN\n\
    \nWe have generated the JasperReport template (JRXML file) in the previous chapter.\
    \ This file cannot be used directly to generate reports. It has to be compiled\
    \ to JasperReport's native binary format, called Jasper file. On compiling, we\
    \ transform JasperDesign object into JasperReport object:\n\n```\nnet.sf.jasperreports.engine.design.JasperDesign\
    \ objects\n```\n\n```\nnet.sf.jasperreports.engine.JasperReport objects\n```\n\
    \nnet.sf.jasperreports.engine.design.JRCompiler plays a central role during compilation.\
    \ This interface has several implementations depending on the language used for\
    \ report expressions, which can be written in Java, Groovy, JavaScript, or any\
    \ other scripting language as long as compiler implementation can evaluate it\
    \ at runtime.\n\nWe can compile JRXML file in the following ways:\n\n- Programmatic\
    \ compilation.\n- Compilation through ANT task.\n\n# Programmatic Compilation\
    \ of JRXML\n\nJasperReports API offers a facade class net.sf.jasperreports.engine.JasperManager\
    \ for compiling a JasperReport. This class consists of several public static methods\
    \ for compiling report templates. The source of templates can be files, input\
