    </band>\n</detail>\n</jasperReport>\n```\n\n以下是报告模板中字段的详细说明：\n\n- <queryString>:\
    \ 它是空的（因为我们通过 Java Beans 传递数据）。通常包含获取结果报告的 SQL 语句。\n- <name>: 此元素用于将数据从数据源或查询映射到报告模板。**name**\
    \ 在报告正文中被重用且区分大小写。\n- <fieldDescription>: 它将字段名与 XML 文件中的相应元素映射。\n- <staticText>:\
    \ 定义不依赖于任何数据源、变量、参数或报告表达式的静态文本。\n- <textFieldExpression>: 定义了结果值的外观。\n- $F{country}:\
    \ 这是一个包含结果值的变量，是 <name> 标签中预定义的字段。\n- <band>: 限制显示在报告中的数据内容范围。\n\n设计完成后，请将其保存到\
    \ C:\\directory 中。\n\n12\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_18_0.png)\n\
    \n# 预览 XML 报告模板\n\nJasperReports JAR 文件中有一个可用的 `net.sf.jasperreports.view.JasperViewer`\
    \ 工具，它可以帮助在不无需编译或填充报告的情况下查看报告设计。该工具是一个独立的 Java 应用程序，因此可以使用 ANT 执行。\n\n让我们编写一个\
    \ ANT 目标 `viewXML` 来查看 JRXML。因此，让我们从 C:\\tools\\jasperreports-5.0.1\\test 创建并保存\
    \ `build.xml`（该文件应放在与 JRXML 相同的目录）。以下是构建文件：\n\n```xml\n<xml version=\"1.0\" encoding=\"\
    UTF-8\"?>\n<project name=\"JasperReportTest\" default=\"viewDesignXML\" basedir=\"\
    .\">\n  <import file=\"baseBuild.xml\" />\n  <target name=\"viewDesignXML\" description=\"\
    Design viewer is launched\nto view the JRXML report design.\">\n    <java classname=\"\
    net.sf.jasperreports.view.JasperDesigner\"\n        fork=\"true\">\n      <arg\
    \ value=\"-XML\" />\n      <arg value=\"-F${file.name}.jrxml\" />\n      <classpath\
    \ refid=\"classpath\" />\n    </java>\n  </target>\n</project>\n```\n\n接下来，让我们打开命令提示符并进入\
    \ `build.xml` 所在的目录。执行命令 `ant`（因为 `viewDesignXML` 是默认目标）。输出如下：\n\n```\nC:\\tools\\\
    jasperreports-5.0.1\\test>ant\nBuildfile: C:\\tools\\jasperreports-5.0.1\\test\\\
    build.xml\nnviewDesignXML:\n[java] log4j:WARN No appenders could be found for\
    \ logger\n(net.sf.jasperreports.engine.JRXmDigesterFactory).\n[java] log4j:WARN\
    \ Please initialize the log4j system properly.\n```\n\nLog4j 警告可以忽略，作为上述执行的结果，将打开一个名为“JasperDesignViewer”的窗口，显示我们的报告模板预览。\n\
    \n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_20_0.png)\n\n正如我们所见，只显示了获取数据的报告表达式，因为\
    \ JasperDesignViewer 无法访问实际数据源或报告参数。通过关闭窗口或在命令行窗口中按 Ctrl-c 终止 JasperDesignViewer。\n\
    \n# 5. JASPERREPORTS - 编译报告设计\n\n在上一章节中我们已经生成了 JasperReport 模板（JRXML 文件）。该文件无法直接用于生成报告。它必须被编译为\
    \ JasperReport 的原生二进制格式，称为 Jasper 文件。在编译时，我们将 `JasperDesign` 对象转换为 `JasperReport`\
    \ 对象：\n\n```\nnet.sf.jasperreports.engine.design.JasperDesign objects\n```\n\n\
    ```\nnet.sf.jasperreports.engine.JasperReport objects\n```\n\n`net.sf.jasperreports.engine.design.JRCompiler`\
    \ 在编译过程中起着核心作用。该接口根据报告表达式使用的语言有多种实现，报告表达式可以用 Java、Groovy、JavaScript 或任何脚本语言编写，只要编译器实现可以在运行时评估它即可。\n\
    \n我们可以通过以下方式编译 JRXML 文件：\n\n- 程序化编译。\n- 通过 ANT 任务编译。\n\n# JRXML 的程序化编译\n\nJasperReports\
    \ API 提供了一个 `net.sf.jasperreports.engine.JasperManager` 门面类，用于编译 JasperReport。该类包含多个用于编译报告模板的公共静态方法。模板源可以是文件、输入流和内存对象。JRXML\
    \ 文件的内容（report_template.jrxml）如下：\n\n以下代码演示了对上述 `report_template.jrxml` 文件的编译。\n\
    \n```java\npackage com.tutorialpoint;\n\nimport net.sf.jasperreports.JRException;\n\
    import net.sf.jasperreports.engine.JasperManager;\n\npublic class JasperReportCompile\
    \ {\n\n    public static void main(String[] args) {\n        String sourceFileName\
    \ = \"C:/tools/jasperreports-5.0.1/test\" + \n        \"/jasper_report_template.jrxml\"\
    ;\n\n        System.out.println(\"Compiling Report Design ...\");\n        try\
    \ {\n            /**\n             * 将报告编译为与 JRXL 文件同名的文件\n             */\n \
    \           JasperCompileManager.compileReportToFile(sourceFileName);\n      \
    \  } catch (JRException e) {\n            e.printStackTrace();\n        }\n  \
    \      System.out.println(\"Done compiling ...\");\n    }\n}\n```\n\n# 模板编译\n\n\
    作为下一步，我们将上述内容保存到 C:\\jasperreports-5.0.1\\test\\src\\tutorialpoint\\JasperReportCompile.java\
    \ 文件中，并如下所示导入 `baseBuild.xml`。`BaseBuild.xml` 已经包含了 `compile` 和 `run` 目标：\n\n\
    ```xml\n<xml version=\"1.0\" encoding=\"UTF-8\"?>\n<project name=\"JasperReportTest\"\
    \ default=\"run\" basedir=\".\">\n\n<import file=\"baseBuild.xml\"/>\n```\n\n\
