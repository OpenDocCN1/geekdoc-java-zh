- md: "\n## JasperReports\n\nSubreports are one of the nice features of JasperReports.\
    \ This feature allows incorporating a report within another, that is, one report\
    \ can be a subreport of another. Subreports help us keep designs simple, as we\
    \ can create many simple reports and encapsulate them in a master report. Subreports\
    \ are compiled and filled just like normal reports. Any report template can be\
    \ used as a subreport when incorporated into another template without changing\
    \ anything inside the report template. Subreports are like normal templates. They\
    \ are `net.sf.jasperreports.engine.JasperReport` objects which are obtained after\
    \ compiling.\n\n### <subreport> Element\n\nA subreport is used when introducing\
    \ subreports into master reports. Here is the list of sub-elements in the `<subreport>`\
    \ element:\n\n- `<parentElement>`: This attribute specifies the name of the parent\
    \ report whose value is copied/incremented with the value from the subreport.\n\
    - `calculation`: This attribute can take values: Nothing, Count, DistinctCount,\
    \ Sum, Average, Lowest, Highest, StandardDeviation, Variance. Default value is\
    \ \"Nothing\".\n- `incrementerObjectClass`: This attribute specifies the factory\
    \ class for creating the incrementer instance.\n- `<subreportExpression>`: This\
    \ indicates where to find the compiled report template for the subreport. This\
    \ element has a class attribute. The class attribute can take any of these values:\
    \ `java.lang.String`, `java.io.File`, `java.net.URL`, `java.io.InputStream`, `net.sf.jasperreports.engine.JasperReport`.\
    \ Default value is `java.lang.String`.\n- `isCaching`: This is an attribute of\
    \ the `<subreport>` element. This is a Boolean; when set to true, the reporting\
    \ engine will recognize previously loaded subreport template objects using their\
    \ specified source. This caching functionality is available only for subreport\
    \ elements that have expressions returning `java.lang.String` objects as the subreport\
    \ template source, representing file names, URLs, or classpath resources.\n- `<parametersMap>`:\
    \ This is used to pass a map containing parameters to the subreport. The map is\
    \ usually obtained from a parameter in the master report or using the built-in\
    \ `REPORTS_MAP`. This expression should always return a `java.util.Map` object\
    \ in which keys are the parameter names.\n- `<subParameter>`: This element is\
    \ used to pass parameters to the subreport. It has a mandatory name.\n- `<connectionExpression>`:\
    \ This is used to pass a `java.sql.Connection` to the subreport. It is used only\
    \ when the subreport template needs a database connection during report filling.\n\
    - `<dataSourceExpression>`: This is used to pass a datasource to the subreport.\
    \ This datasource is usually obtained from a parameter in the master report or\
    \ using the built-in `REPORT_DATA_SOURCE`. The elements (connectionExpression\
    \ and dataSourceExpression) cannot be present at the same time in a `<subreport>`\
    \ declaration because we cannot supply both a data source and a connection to\
    \ the subreport. We must decide on one of them and stick to it.\n- `<returnValue>`:\
    \ This is used to assign the value of subreport's variables to one of the master\
    \ report's variables.\n    - `subreportVariable`: This attribute specifies the\
    \ name of the subreport variable whose value is to be returned.\n    - `toVariable`:\
    \ This attribute specifies the name of the parent report variable whose value\
    \ is to be modified by the value from the subreport.\n\n### Example\n\nLet us\
    \ take a simple example to demonstrate creation of subreports using JRDataSource.\
    \ Let's first write two report templates, one subreport and the other Master report.\
    \ The contents of the subreport (address_report_template.jrxml) template is given\
    \ below. Save to `C:\\tools\\jasperreports-5.0.1\\test` directory.\n\n```xml\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<jasperReport xmlns=\"http://www.jasperreports.sourceforge.net/jasperreport\n\
    \              xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\n     \
    \         xsi:schemaLocation=\"http://jasperreports.sourceforge.net/jasperreport\
    \ http://jasperreports.sourceforge.net/xsd/jasperreport.xsd\"\n              name=\"\
    address_report_template\" pageWidth=\"175\" pageHeight=\"842\"\n             \
    \ columnWidth=\"175\" leftMargin=\"0\" rightMargin=\"0\" topMargin=\"0\"\n   \
    \           bottomMargin=\"0\">\n\n  <field name=\"city\" class=\"java.lang.String\"\
    />\n  <field name=\"street\" class=\"java.lang.String\"/>\n  <background>\n  \
    \  <band splitType=\"Stretch\"/>\n  </background>\n  <title>\n    <band height=\"\
    20\" splitType=\"Stretch\"/>\n  </title>\n</jasperReport>\n```\n"
  mdcn: "\n\n## JasperReports\n\n子报（Subreports）是 JasperReports 的优秀特性之一。该功能允许将一个报告嵌入另一个报告，即一个报告可以作为另一个报告的子报。子报帮助我们保持设计的简单，因为我们可以创建许多简单的报告并将它们封装在一个主报告中。子报的编译和填充与普通报告一样。任何报告模板在合并到另一个模板时都可以作为子报，而无需更改报告模板内部的任何内容。子报就像普通模板一样。它们是编译后获得的\
    \ `net.sf.jasperreports.engine.JasperReport` 对象。\n\n### <subreport> Element\n\n\
    在向主报告中引入子报时使用该元素。以下是 `<subreport>` 元素中的子元素列表：\n\n- `<parentElement>`：此属性指定父报告的名称，其值将根据子报的值进行复制/增加。\n\
    - `calculation`：此属性可以取以下值：Nothing, Count, DistinctCount, Sum, Average, Lowest,\
    \ Highest, StandardDeviation, Variance。默认值为 \"Nothing\"。\n- `incrementerObjectClass`：此属性指定用于创建计数器实例的工厂类。\n\
    - `<subreportExpression>`：指示在哪里查找子报的编译报告模板。该元素有一个 `class` 属性。`class` 属性可以取以下任何值：`java.lang.String`,\
    \ `java.io.File`, `java.net.URL`, `java.io.InputStream`, `net.sf.jasperreports.engine.JasperReport`。默认值为\
    \ `java.lang.String`。\n- `isCaching`：这是 `<subreport>` 元素的属性。这是一个布尔值；设置为 true 时，报告引擎通过指定的源识别之前加载的子报模板对象。此缓存功能仅适用于表达式返回\
    \ `java.lang.String` 对象作为子报模板的子报元素（代表文件名、URL 或类路径资源）。\n- `<parametersMap>`：用于向子报传递包含参数的\
    \ map。该 map 通常从主报告中的参数获取，或使用内置的 `REPORTS_MAP` 获取。此表达式应始终返回一个 `java.util.Map` 对象，其中键为参数名。\n\
    - `<subParameter>`：该元素用于向子报传递参数。它有一个强制性的 name name属性。\n- `<connectionExpression>`：用于向子报传递\
    \ `java.sql.Connection`。仅当子报模板在报告填充期间需要数据库连接时使用。\n- `<dataSourceExpression>`：用于向子报传递数据源。该数据源通常从主报告中的参数获取，或使用内置的\
    \ `REPORT_DATA_SOURCE` 获取。在 `<subreport>` 声明中，connectionExpression 和 dataSourceExpression\
    \ 元素不能同时存在，因为我们不能同时为子报提供数据源和连接。我们必须决定其中一个并坚持使用。\n- `<returnValue>`：用于将子报变量的值赋值给主报告的变量之一。\n\
    \    - `subreportVariable`：此属性指定要返回的子报变量的名称。\n    - `toVariable`：此属性指定父报告变量的名称，其值将通过子报的值进行修改。\n\
    \n### Example\n\n让我们通过一个简单的示例来演示使用 JRDataSource 创建子报。首先，我们编写两个报告模板，一个是子报，另一个是主报告。子报模板（address_report_template.jrxml）的内容所示。将其保存到\
