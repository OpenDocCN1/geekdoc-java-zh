  - "[PAGE 37]\n\n# 7. JASPERREPORTS – VIEW & PRINT REPORTS\n\nThe output of the report\
    \ filling process JasperPrint objects can be viewed using a built-in viewer component,\
    \ printed, or exported to more popular document formats like PDF, HTML, RTF, XLS,\
    \ DTS, CSV, or XML. Viewing and printing of the Jasper documents will be discussed\
    \ in this chapter and exporting will be discussed in the next chapter i.e. Export\
    \ Reports.'\n\n# Viewing Reports\n\nJasperReports provides a built-in viewer for\
    \ viewing the generated reports in its original format. It is a swing based component\
    \ and other Java applications can integrate this component without exporting the\
    \ documents to other formats in order to be viewed or printed. The net.sf.jasperreports.view.JRViewer\
    \ class represents this visual component. This class can also be customized as\
    \ per the application needs, by subclassing it.\n\nJasperReports also has a Swing\
    \ application, which uses the visual component for viewing the reports. This application\
