    \ indicates the measure class.\n- calculation: This indicates the calculation\
    \ to be performed between crosstab cell values. Its values could be any of these\
    \ - Nothing, Count, DistinctCount, Sum, Average, Lowest, Highest, StandardDeviation,\
    \ Variance, and First. Default value is Nothing.\n- <crosstabCell>: This element\
    \ defines how data in non-header cells will be laid out. Attributes for this element\
    \ include:\n  - columnTotalGroup: This indicates the group to use to calculate\
    \ the column total.\n  - height: This defines the height of the cell.\n  - rowTotalGroup:\
    \ This indicates the group to use to calculate the row total.\n  - width: This\
    \ defines the width of the cell.\n  - <whenNoDataCell>: This element defines what\
    \ to display on an empty crosstab cell. This element contains no attributes.\n\
    \n# Data Grouping in Crosstab\n\nThe crosstab engine aggregates data by iterating\
    \ through the associated dataset records. In order to aggregate data, we need\
    \ to group them first. In a crosstab, rows and columns are based on specific group\
    \ items, called buckets. A bucket definition should contain:\n\n- bucketExpression:\
    \ The expression to be evaluated in order to obtain data group items.\n- comparatorExpression:\
    \ Needed in the case the natural ordering of the values is not the best choice.\n\
    - orderByExpression: Indicates the value used to sort data.\n\nRow and columns\
    \ (defined above) in a crosstab rely on buckets.\n\n# Built-In Crosstab Total\
    \ Variables\n\nBelow is a list of value of measurement and totals of different\
    \ levels corresponding to the cell can be accessed through variables named according\
    \ to the following scheme:\n\n- The current value of a measurement is stored in\
    \ a variable having the same name as the measure.\n- <Measure>_<Column Group>_ALL:\
    \ This yields the total for all the entries in the column group from the same\
    \ row.\n- <Measure>_<Row Group>_ALL: This yields the total for all the entries\
    \ in the row group from the same column.\n- <Measure>_<Row Group>_<Column Group>_ALL:\
    \ This yields the total corresponding to all the entries in both row and column\
    \ groups.\n\n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_214_0.png)\n\n# Example\n\
    \nTo demonstrate the crosstabs, let's write a new report template (jasper_report_template.jrxml).\
