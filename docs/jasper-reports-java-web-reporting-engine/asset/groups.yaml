    # JasperReports


    +   - name: This defines the measure name.


    +   - class: This indicates the measure class.


    +   - calculation: This indicates the calculation to be performed between crosstab
    cell values. Its values could be any of these - Nothing, Count, DistinctCount,
    Sum, Average, Lowest, Highest, StandardDeviation, Variance, and First. Default
    value is Nothing.


    +   - <crosstabCell>: This element defines how data in non-header cells will be
    laid out. Attributes for this element include:


    +   - columnTotalGroup: This indicates the group to use to calculate the column
    total.


    +   - height: This defines the height of the cell.


    +   - rowTotalGroup: This indicates the group to use to calculate the row total.


    +   - width: This defines the width of the cell.


    +   - <whenNoDataCell>: This element defines what to display on an empty crosstab
    cell. This element contains no attributes.


    # Data Grouping in Crosstab


    The crosstab engine aggregates data by iterating through the associated dataset
    records. In order to aggregate data, we need to group them first. In a crosstab,
    rows and columns are based on specific group items, called buckets. A bucket definition
    should contain:


    +   - bucketExpression: The expression to be evaluated in order to obtain data
    group items.


    +   - comparatorExpression: Needed in the case the natural ordering of the values
    is not the best choice.


    +   - orderByExpression: Indicates the value used to sort data.


    Row and columns (defined above) in a crosstab rely on buckets.


    # Built-In Crosstab Total Variables


    Below is a list of value of measurement and totals of different levels corresponding
    to the cell can be accessed through variables named according to the following
    scheme:


    +   - The current value of a measurement is stored in a variable having the same
    name as the measure.


    +   - <Measure>_<Column Group>_ALL: This yields the total for all the entries
    in the column group from the same row.


    +   - <Measure>_<Row Group>_ALL: This yields the total for all the entries in
    the row group from the same column.


    +   - <Measure>_<Row Group>_<Column Group>_ALL: This yields the total corresponding
    to all the entries in both row and column groups.


