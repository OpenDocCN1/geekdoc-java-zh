    \nHere, we see that each country and name are tabulated.\n\n# 23. JASPERREPORTS\
    \ – INTERNATIONALIZATION\n\nSometimes, we need reports in different languages.\
    \ Writing the same report for each language implies a lot of redundant work. Only\
    \ pieces of text differing from language to language should be written separately,\
    \ and loaded into text elements at runtime, depending on locale settings. This\
    \ is the purpose of the report internationalization. Internationalized reports\
    \ can run everywhere.\n\nIn the following steps, we have listed how to generate\
    \ a report in different languages and some other features of report internationalization:\n\
    \n- Associate a resource bundle java.util.ResourceBundle with the report template.\
    \ There are two ways to associate the java.util.ResourceBundle object with the\
    \ report template.\n- At design, by setting the resourceBundle attribute of the\
    \ report object at runtime the base name of the target resource bundle.\n- A dynamic/runtime\
    \ association can be made by supplying a java.util.ResourceBundle object as the\
    \ value for the REPORT_RESOURCE_BUNDLE parameter at report filling.\n- If the\
    \ report needs to be generated in a locale that is different from the current\
    \ one, the built-in REPORT_LOCALE parameter can be used to specify the runtime\
    \ locale when filling the report.\n\nTo facilitate report internationalization,\
    \ a special syntax $R{} is available in report expressions to reference java.lang.String\
    \ resources placed inside a java.util.ResourceBundle object associated with the\
    \ report. The $R{} character syntax extracts the locale-specific resource from\
    \ the resource bundle based on the key that must be put between the brackets:\n\
    \n```xml\n<textFieldExpression>\n$R{report.title}\n</textFieldExpression>\n```\n\
    \nThe above text field displays the title of the report by extracting the String\
    \ value from the resource bundle associated with the report based on the runtime\
    \ locale and the report.title key.\n\nFormatting messages in different languages\
    \ based on the report locale, there's a built-in method inside the reports net.sf.jasperreports.engine.fillCalculator.\
    \ This method offers functionality to the java.text.MessageFormat class. This\
    \ method, msg(), has three convenient signatures that allow you to use up to three\
    \ parameters in the messages.\n\nA built-in str() (the equivalent of the $R{}\
    \ syntax inside the report expressions), which gives access to the resource bundle\
    \ content based on the report locale.\n\nFor date and time formatting, the built-in\
    \ REPORT_TIME_ZONE parameter can be used to ensure proper time transformations.\n\
    \n![](img/c7ac028fe0205a5d7878fbfc6ebd9483_225_0.png)\n\n# JasperReports\n\n-\
    \ In the generated output, the library keeps information about the text direction\
    \ so that documents generated in languages that have right-to-left writing (like\
    \ Arabic and Hebrew) can be rendered properly.\n- If an application relies on\
    \ the built-in Swing viewer to display generated reports, then it needs to be\
    \ internationalized by adapting the built ToolTips or other texts displayed. This\
    \ is very easy to do since the viewer relies on a predefined resource bundle to\
    \ extract locale-specific information. The base name for this resource bundle\
    \ is net.sf.jasperreports.view.viewer.\n\n# Example\n\nTo demonstrate internationalization,\
    \ let's write new report template (jasper_report_template.jrxml). The contents\
    \ of the JRXML are given below. Save it to C:\\jasperreports-5.0.1\\test directory.\n\
