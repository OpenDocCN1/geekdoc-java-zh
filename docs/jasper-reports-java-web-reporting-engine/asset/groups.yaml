    # JasperReports


    <nodata></nodata>

    <background></background>


    The following table summarizes each of the sections:


    | Section | Description |

    | Title | This section appears only once at the beginning of the report. |

    | Page Header | This section appears at the beginning of each page in the generated
    document. |

    | Column Header | This section appears at the beginning of each column in the
    generated document. If the report has only one column defined, then column header
    and footer sections are ignored. |

    | Group Header | This section is introduced by a report group (chapter Groups).
    Each time the grouping expression changes its value, the group header section
    is printed above the detail section. In case, if more than one group is defined,
    the group header is printed in the order of group definition. |

    | Detail | This section is repeated for each line of data supplied by the report''s
    data source. The detail section can be made of multiple bands. |

    | Group Footer | This section is introduced by a report group (chapter Groups).
    The group footer section is printed below the detail section before the value
    of the grouping changes. The group footer is always printed for the last line
    of data in data source. In case, if more than one group is defined, the group
    footer is printed in the reverse order of group definition. |

    | Column Footer | This section appears at the bottom of each column. If the report''s
    column count is 1, then column header and footer sections are ignored. |

    | Page Footer | This section appears at the bottom of each page. |

    | Last Page Footer | This section replaces the regular page footer on the last
    page of the report. In case, the summary section is also present, this might not
    be the very last page of the document. This section is sometimes useful when summary
    information has to be displayed at the bottom of the last page. |

    | Summary | This section appears only once at the end of the report. |


