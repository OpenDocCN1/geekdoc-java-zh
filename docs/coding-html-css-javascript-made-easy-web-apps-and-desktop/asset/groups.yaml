    \ - 它是为了被创建的，但还没有被分配值\n</script>\n</body>\n```\n\n上方：我们可以使用括号表示法通过获取和设置值访问数组元素。\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_161_0.png)\n\n## 向数组追加元素\n\n数组的 `push()`\
