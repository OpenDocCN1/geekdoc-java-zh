  - '[PAGE 85]


    # GETTING ONLINE


    It’s no good going to that effort to build a website and then keeping it hidden
    away on your computer – it needs to be out there on the web! To do this you need
    a domain name, a web server and an FTP Client application for managing your site’s
    files.


    # DOMAIN NAME


    A domain name is the human-readable name that is associated with the IP address
    of your website, for example, Google’s domain name is google.com. This is a unique
    name that needs registering so that it is assigned to you. To do this you use
    a domain name registrar such as 1&1 (www.1and1.co.uk) or 123-reg (www.123-reg.co.uk).


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_85_0.png)


    Above: 1&1 is a popular domain name registrar and hosting service provider.'
  - '[PAGE 86]


    # WEB SERVER


    Your website needs be available on the internet, and for this you need a web server.
    The easiest way to get one is via a web-hosting service; this provides you with
    your own web server. ISPs often include such services as part of your rental package.
    Alternatively you can buy hosting services for a little as £1/month from the likes
    of 1&1 and 123-reg.


    # TRANSFERRING FILES


    FTP (File Transfer Protocol) provides a means for transferring files across a
    network, and is the best method for getting your site onto your web server. There
    are numerous FTP Client applications, with Filezilla (http://filezilla-project.org)
    and CyberDuck (http://cyberduck.io) being popular choices on Windows and Mac respectively.


