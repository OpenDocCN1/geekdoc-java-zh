    \ as data type **casting**.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_166_0.png)\n\
    \n### Implicit Casting\n\nJavaScript is very proactive when it comes to managing\
    \ data types, and automatically casts between types depending on the context in\
    \ which they are being used (see page 179 for an example of this).\n\n### Explicit\
    \ Casting\n\nWe can also explicitly cast some data types, most often used when\
    \ casting between strings and numbers. To cast a number to a string, for example,\
    \ we would write String(42), giving the result \"42\". Conversely, to cast a string\
    \ to a number, we would write Number(\"42\"), resulting in 42.\n\n```javascript\n\
    var myNumber = 42;\nvar myString = \"549\";\nvar my = \"Sajid\";\nvar test1 =\
    \ myNumber + myString;\nalert(test1);//Shows '42549' in the alert box\nvar test2\
    \ = myNumber + Number(myString);\nalert(test2);//Shows '591' in the alert box\n\
    var test3 = myString + myName;\nalert(test3);//Shows '549sajid' in the alert box\n\
    var test4 = myNumber + Number(myName);\nalert(test4);//Shows 'NaN' in the alert\
    \ box\nvar test5 = String(myNumber) + myName;\nalert(test5);//Shows '42Sajid'\
    \ in the alert box\n```\n\n**Above:** This code highlights how and why we might\
    \ explicitly cast between data types.\n\n## The Special NaN Number\n\nNot all\
    \ values can be converted to a number – for example, the string \"foo\" has no\
    \ numeric meaning.\n\nIf we cast this string to a number, we'd get the result\
    \ NaN (Not a Number). Despite the name, this is indeed a number, and can be used\
    \ anywhere that a number is allowed or expected. However, any calculations that\
    \ include NaN always evaluate to NaN themselves.\n\n## Results of Casting Different\
    \ Data Types\n\nThis table shows the results of casting between different data\
    \ types. Read the table as `casting` from row title to column title.\n\n| Boolean\
    \ | number | string |\n| --- | --- | --- |\n| Boolean | - | false is 0, true is\
    \ 1 | false is \"false\", true is \"true\" |\n| number | 0 is false, else true\
    \ | - | String representation of number |\n| string | \" \" is false, else true\
