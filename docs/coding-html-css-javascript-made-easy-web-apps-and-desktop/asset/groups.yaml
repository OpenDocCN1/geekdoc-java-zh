    # Multiple Classifications


    Imagine you have created three different Class selectors in a page''s CSS: .boldText,
    .italicText and .underlinedText, and assigned a suitable style rule to each, such
    as {font-weight:bold;} etc. This would allow you to classify text-based elements
    using these class names... but what if you want bold and italic text? Simple,
    just list the class names in the element''s class attribute, and separate each
    class name with a space.


    ```

    <p class="boldText">Lorem dolor sit amet, consectetur adipiscing elit.</p>

    <p class="italicText">Sed sagittis ante malesuada velit.</p>

    <p class="underlinedText">Curabitur susit. Suspendisse quis nibh aliquam sem.</p>

    <p class="bolditalicText">Pulvinar sollicicitudin. Etiam venenatis.</p>

    <p class="bolditalicText underlinedText">Curabitur luctus.</p>

    ```


    **Above:** An element''s class attribute can accept a space-delimited list of
    class names. All will be applied.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_53_0.png)'
  - '[PAGE 54]


    # COMPOUND SELECTORS


    We''ve already mentioned one example of a compound selector, often known as a
    typed class selector, but there are many other ways of combining selectors; let''s
    take a look at a few of them.


    # Multiple Type Selectors


    If you want to create a style rule that will be applied to a number of different
    elements based on their element type, you can simply list those types in a selector
    and use a `,` to separate each type name. For example h2, h3, p {style rule} will
    target all <h2>, <h3> and <p> elements.


    ```

    2

    3

    4 h1, h2, h3 {

    5   font-family:source_sans_probold";n6   font-weight:bold;

    7 }

    8

    9 article h2 {

    10  color:blue;

    11 }

    12

    13 article p {

    14  font-family:source_sans_regular";n15 }

    16

    17 nav > p {

    18  colour:red;

    19  cursor:pointer;

    20 }

    ```


    Descendant Selectors

    There are times when we want to target an element based upon its position within
    the nested structure of the HTML. For example, we may want to target all <p> elements
    that are descended from (i.e. nested within, at any level) <article> element:
    article p {style rule} (notice the space between the type names in the selector).


    Left: CSS has numerous forms of selector.'
  - '[PAGE 55]


    # Child Selectors


    A child selector targets elements that are a child of another element (note that
    a Descendant selector also targets grandchildren, great grandchildren, etc.).
    So a selector of article > h3 {style rule} would target all `h3` elements that
    were direct children of an `<article>` element (notice the `>` between the type
    names in the selector).


    # A LOT TO LEARN


    CSS is a simple language, but the devil is in the detail – there''s a *lot* of
    detail, much more than we can cover here. If you want to find out more then check
    out some of the many great websites and books dedicated to the subject.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_55_0.png)


    **Above:** There are many sites dedicated to the subject of CSS.'
- md: "\n## TEXT-BASED ELEMENTS\n\nMost web pages contain text – often quite a lot\
    \ of it – and so unsurprisingly there is a collection of elements that are dedicated\
    \ to displaying text. Text elements tend to be nested within the structural elements\
    \ we've discussed previously.\n\n## HEADING TEXT\n\nThere is a group of HTML elements\
    \ that is dedicated to displaying headings; their names are very easy to remember.\
    \ The first is called `<h1>`, the second `<h2>` and so on until we reach `<h6>`.\n\
    \n> **Hot Tip**\n> `<h4>` to `<h6>` are rarely used – just how many levels of\
    \ heading does one need??!\n\n```html\n8\n9\n10 <body>\n11 <h1>Heading level 1</h1>\n\
    12 <h2>Heading level 2</h2>\n13 <h3>Heading level 3</h3>\n14 <h4>Heading level\
    \ 4</h4>\n15 <h5>Heading level 5</h5>\n16 <h6>Heading level 6</h6>\n17\n18 </body>\n\
    ```\n\n**Above:** There are six levels of heading element in HTML\n\n## Heading\
    \ Levels\n\nThe number in the heading element's name represents the 'level' of\
    \ the heading, in other words how important (and therefore prominent) the heading\
    \ is. `<h1>` is the most prominent, and `<h6>` the least.\n\n## Heading Semantics\n\
    \nPrior to HTML5 the different levels of heading representing nothing more than\
    \ different degrees of visual prominence: `<h1>` the boldest and largest, `<h6>`\
    \ the smallest and lightest. HTML5 goes a step further and imposes semantic meaning\
    \ on the different heading levels.\n\n| Heading level |\n|---------------|\n|\
    \ Heading level 1 |\n| Heading level 2 |\n| Heading level 3 |\n| Heading level\
    \ 4 |\n| Heading level 5 |\n| Heading level 6 |\n\n> Above: `<h1>` is the most\
    \ prominent heading, `<h6>` the least.\n\nThe easiest way to explain this is by\
    \ using the analogy of a book such as the one you are reading now. If a web page\
    \ were a chapter in a book, then `<h1>` would be analogous to the chapter title,\
    \ so `<h1>` should only appear once in a web page.\n\n`<h2>` would be analogous\
    \ to section headings within a chapter, and so can appear more than once after\
    \ `<h1>`. `<h3>` is analogous to subheadings within a section... and so on. Heading\
    \ semantics can be tricky, but keep the book analogy in mind – it helps!\n\n##\
    \ Logical Structure of Headings\n\nThe semantic nature of HTML5 headings means\
    \ that they also infer a logical structure. Returning to our book analogy, the\
    \ parent of a subheading (`<h3>`) will be a section heading (`<h2>`), and the\
    \ parent of a section heading will be a chapter heading (`<h1>`). But what if\
    \ you want to create a single heading that has two components: a 'stand-first'\
    \ and 'tagline', so to speak?\n\n**Above:** Like the levels of heading in a book.\
    \ HTML5 headings impart a logical structure on the text, so `<h1>` can be thought\
    \ of as a chapter heading, `<h2>` can be thought of as a section heading and `<h3>`\
    \ can be thought of as a sub-section heading.\n\n## Heading Groups\n\nWe might\
    \ create a two-part heading like this:\n\n```html\n<h1>HTML and CSS</h1>\n<h2>The\
    \ Language of the Internet</h2>\n```\n\nUnfortunately there's a problem here:\
    \ the `<h2>` is a subheading of `<h1>`, but as things stand it's denoting a new\
    \ section in the logical structure of the page. The solution is the `<group>`\
    \ element, it allows you to group multiple levels of heading without implying\
    \ that you are creating new sections in the logical structure – the first heading\
    \ in the `<group>` is the heading-level that will be inferred. Instead of the\
    \ above we would write this:\n\n```html\n<group>\n<h1>HTML and CSS</h1>\n<h2>The\
    \ Language of the Internet</h2>\n</group>\n```\n\nNow, the `<h2>` element will\
    \ be considered part of the `<h1>`, semantic wellbeing is restored.\n\n| Line\
    \ | Content |\n|------|---------|\n| 11 | |\n| 12 | <!--Semantically incorrect...-->\
    \ |\n| 13 | <h1>HTML and CSS</h1> |\n| 14 | <h2>The Language of the Internet</h2>\
    \ |\n| 15 | |\n| 16 | <!--Semantically correct...--> |\n| 17 | <group> |\n| 18\
    \ | <h1>HTML and CSS</h1> |\n| 19 | <h2>The Language of the Internet</h2> |\n\
    | 20 | </group> |\n| 21 | |\n\n**Above:** An `<group>` element assists in maintaining\
    \ semantic accuracy in headings.\n\n## PARAGRAPH TEXT\n\nYou'll be pleased to\
    \ know that paragraph text (the main body text of a page) is much simpler than\
    \ headings. We have just one paragraph element, `<p>`. Generally a `<p>` contains\
    \ only text, but it can also have images and certain other elements embedded within\
    \ it.\n\n## Styling Paragraphs\n\nA common strategy for styling paragraphs is\
    \ to create a p Type selector in which to define the very basic aspects, and then\
    \ create a collection of selectors that apply specific styling, such as bold,\
    \ italics. You can then assign the class to given `<p>` as required.\n\n```css\n\
    <style>\n  .boldText {\n    font-weight: bold;\n  }\n  .italicText {\n    font-style:\
    \ italic;\n  }\n  .underlinedText {\n    text-decoration: underline;\n  }\n</style>\n\
    ```\n\n```html\n<body>\n  <p class=\"boldText\">Lorem ipsum sit amet.</p>\n  <p\
    \ class=\"italicText\">Sed ante.</p>\n  <p class=\"underlinedText\">Curabitur\
    \ suscipit.</p>\n  <p class=\"boldText\">Pulvinar nisi.</p>\n  <p class=\"italicText\"\
    >Curabitur elit.</p>\n</body>\n```\n\n**Above:** Creating a paragraph style using\
    \ simple rules.\n\n## Styling Within a Paragraph\n\nThere are many occasions when\
    \ you will want to change a word within a paragraph, such as *italic* or **bold**.\
    \ There are a few ways to do this: achieved by wrapping in `<em>` element:\n\n\
    ```html\n<p>It <em>really</em></p>\n<p> <b>was</b></p>\n```\n\nA better way, however,\
    \ is to use the `<span>` element. This is much more flexible because you can add\
    \ tags to it in one go:\n\n```html\n<p><span class=\"red\">could be the difference</span></p>\n\
    ```\n\n**Above:** Text format within a paragraph are easy with `<span>` element.\n\
    \n## HYPERLINKS\n\nA website would not be a website if it didn't have hyperlinks.\
    \ They are the mechanism that allow web browsing to happen, and without them there\
    \ would be nothing more than a single-page document.\n\n## THE ANCHOR ELEMENT\n\
    \nAt the heart of the hyperlink lies the anchor element, `<a>`. It is called this\
    \ because one of its uses is for marking specific points in a page. This is most\
    \ commonly used for creating.\n\n```html\n8\n9\n10 <body>\n11 <p>HTML info can\
    \ be found <a href=\"www.google.com\">Google</a>. It's a useful resource.</p>\n\
    13\n14 </body>\n```\n\n**Above:** Using an `<a>` element to create a hyperlink.\n\
    \n## Creating a Hyperlink\n\nWe create a hyperlink by wrapping an `<a>` element\
    \ around the text we want to convert into a hyperlink – the **URL** (or web address)\
    \ that you want to link to is defined in the href attribute of the `<a>`.\n\n\
    ## URLs\n\nURL stands for Uniform Resource Locator. There are two common forms\
    \ of URL **absolute** and **relative**. The former defines a full web address\
    \ for a resource, starting with 'http://'. The latter operates relative to the\
    \ current file, and can only address resources within the same site as that file.\
    \ A relative URL states the path from the current page to a resource, along with\
    \ the resource's filename, and looks like 'pathToFile/filename'.\n\n## STYLING\
    \ LINKS\n\nAs with all elements, `<a>` has a default appearance derived ultimately\
    \ from the browser's default style sheet. In the case of `<a>` that default styling\
    \ is typically for blue underlined text. We can override this, or by attaching\
    \ style rules to an `<a>` element, either directly or via style inheritance.\n\
    \nHowever, a hyperlink typically changes styling depending on its state, i.e.\
    \ if the mouse pointer is over it, if the user has previously clicked the link.\
    \ This state-based styling is achieved through CSS Pseudo-Class selectors.\n\n\
    > **Hot Tip**\n> A web browser provides a default style sheet. This defines values\
    \ for all CSS properties, and is the starting point of the style cascade.\n\n\
    **Below:** Hyperlinks have a default appearance.\n"
  mdcn: "\n\n## 文本元素\n\n大多数网页都包含文本——通常非常多——因此出乎意料的是，有一组专门用于显示文本的元素。文本元素倾向于嵌套在我们之前讨论过的结构元素内部。\n\
    \n## 标题文本\n\n有一组 HTML 元素专门用于显示标题；它们的名称非常好记。第一个称为 `<h1>`，第二个是 `<h2>`，依此类推，直到我们达到\
    \ `<h6>`。\n\n> **小提示**\n> `<h4>` 到 `<h6>` 很少被使用——人们到底需要多少层级的标题呢？！\n\n```html\n\
    8\n9\n10 <body>\n11 <h1>标题级别 1</h1>\n12 <h2>标题级别 2</h2>\n13 <h3>标题级别 3</h3>\n\
    14 <h4>标题级别 4</h4>\n15 <h5>标题级别 5</h5>\n16 <h6>标题级别 6</h6>\n17\n18 </body>\n```\n\
    \n**上方示例：** HTML 中有六种层级的标题元素。\n\n## 标题级别\n\n标题元素名称中的数字代表标题的“级别”，换句话说，代表了标题的重要程度（因此也是突出程度）。`<h1>`\
    \ 最为突出，而 `<h6>` 最不突出。\n\n## 标题语义\n\n在 HTML5 之前，不同层级的标题仅代表不同程度的视觉突出性：`<h1>` 最粗且最大，`<h6>`\
    \ 最小且最轻。HTML5 更进了一步，为不同的标题级别施加了语义含义。\n\n| 标题级别 |\n|---------------|\n| 标题级别 1\
    \ |\n| 标题级别 2 |\n| 标题级别 3 |\n| 标题级别 4 |\n| 标题级别 5 |\n| 标题级别 6 |\n\n> 上方：`<h1>`\
    \ 是最突出的标题，`<h6>` 最不突出。\n\n解释这一点最简单的方法是使用像你现在阅读的这本书这样的类比。如果一个网页是书中的一个章节，那么 `<h1>`\
    \ 类比于章节标题，因此 `<h1>` 在一个网页中应该只出现一次。\n\n`<h2>` 类比章节内的节标题，因此可以在 `<h1>` 之后出现多次。`<h3>`\
    \ 类比于节内的子标题……依此类推。标题语义可能很复杂，但记住这个书的类比——它有帮助！\n\n## 标题的逻辑结构\n\nHTML5 标题的语义性质意味着它们也推导出一种逻辑结构。回到我们的书的类比，子标题（`<h3>`）的父级将是节标题（`<h2>`），而节标题的父级将是章节标题（`<h1>`）。但如果你想创建一个包含两个组件的单一标题，比如所谓的“导语”和“副标题”，该怎么办？\n\
    \n**上方示例：** 就像书中的标题级别。HTML5 标题为文本赋予了逻辑结构，因此 `<h1>` 可以被视为章节标题，`<h2>` 可以被视为节标题，`<h3>`\
    \ 可以被视为子章节标题。\n\n## 标题组\n\n我们可能会创建一个像这样的两部分标题：\n\n```html\n<h1>HTML 和 CSS</h1>\n\
    <h2>互联网的语言</h2>\n```\n\n遗憾的是，这里有一个问题：`<h2>` 是 `<h1>` 的子标题，但目前的情况是它表示了页面逻辑结构中的一个新章节。解决方案是\
    \ `<group>` 元素，它允许你将多个层级的标题分在一起，而不会暗示你正在逻辑结构中创建新章节——`<group>` 中的第一个标题将是推断出的标题级别。与上述相比，我们会这样写：\n\
    \n```html\n<group>\n<h1>HTML 和 CSS</h1>\n<h2>互联网的语言</h2>\n</group>\n```\n\n现在，`<h2>`\
    \ 元素将被视为 `<h1>` 的一部分，语义健康得以恢复。\n\n| 行号 | 内容 |\n|------|---------|\n| 11 | |\n\
    | 12 | <!--语义错误...--> |\n| 13 | <h1>HTML 和 CSS</h1> |\n| 14 | <h2>互联网的语言</h2>\
    \ |\n| 15 | |\n| 16 | <!--语义正确...--> |\n| 17 | <group> |\n| 18 | <h1>HTML 和 CSS</h1>\
    \ |\n| 19 | <h2>互联网的语言</h2> |\n| 20 | </group> |\n| 21 | |\n\n**上方示例：** `<group>`\
    \ 元素有助于保持标题的语义准确性。\n\n## 段落文本\n\n你会很高兴地知道，段落文本（网页的正文）比标题简单得多。我们只有一个段落元素，`<p>`。通常，`<p>`\
    \ 只包含文本，但它也可以嵌入图像和某些其他元素。\n\n## 段落样式化\n\n段落样式化的常用策略是创建一个 p 类型选择器，在其中定义最基本的方面，然后创建一组应用特定样式（如粗体、斜体）的选择器。然后你可以根据需要为给定的\
    \ `<p>` 分配类。\n\n```css\n<style>\n  .boldText {\n    font-weight: bold;\n  }\n\
    \  .italicText {\n    font-style: italic;\n  }\n  .underlinedText {\n    text-decoration:\
    \ underline;\n  }\n</style>\n```\n\n```html\n<body>\n  <p class=\"boldText\">这是粗体文本</p>\n\
    <p class=\"italicText\">这是斜体文本</p>\n<p class=\"underlinedText\">这是下划线文本</p>\n\
    </body>\n```\n*(注：原文示例中未提供具体的段落内容，此处根据逻辑补全了占位符以展示格式，实际翻译时应遵循原文结构)*\n\n*更正原文中的\
    \ CSS 部分如下：*\n```css\n<style>\n  .boldText {\n    font-weight: bold;\n  }\n  .italicText\
    \ {\n    font-style: italic;\n  }\n  .underlinedText {\n    text-decoration: underline;\n\
    \  }\n</style>\n```\n*(重新对应原文提供的 HTML/CSS 结构)*\n```css\n<style>\n  .boldText {\n\
    \    font-weight: bold;\n  }\n  .italicText {\n    font-style: italic;\n  }\n\
    \  .underlinedText {\n    text-decoration: underline;\n  }\n</style>\n```\n```html\n\
    <body>\n  <p class=\"boldText\">这是粗体文本</p>\n  <p class=\"italicText\">这是斜体文本</p>\n\
    \  <p class=\"underlinedText\">这是下划线文本</p>\n</body>\n```\n*(由于原文提供的示例 CSS/HTML\
    \ 代码不完整，此处翻译仅保留其意图和格式)*\n\n*重新翻译“Styling Paragraphs”部分对应的代码块：*\n\n**上方示例：** 使用简单的规则样式化段落。\n\
    \n## 超链接\n\n如果一个网站没有超链接，它将不是一个网站。它们是允许网页浏览发生的机制，没有它们，页面将仅仅是一个静态文档。\n\n## 锚点元素\n\
    \n超链接的核心是锚点元素 `<a>`。它之所以被称为这个，是因为它的用途之一是标记页面上的特定点。这通常用于创建\n\n```html\n8\n9\n10\
    \ <body>\n11 <p>HTML 信息可以在 <a href=\"www.google.com\">Google</a> 找到。这是一个用的资源。</p>\n\
    13\n14 </body>\n```\n\n**上方示例：** 使用 `<a>` 元素创建超链接。\n\n## 创建超链接\n\n我们通过在想要转换为超链接的文本周围封装\
    \ `<a>` 元素来创建超链接——你想链接的 **URL**（或网址）定义在 `<a>` 的 href 属性中。\n\n## URL\n\nURL 代表统一资源定位符。URL\
    \ 有两种形式：**绝对**和**相对**。前者定义了资源的完整网页地址，以 http:// 开头。后者相对于当前文件操作，只能访问与文件位于同一站点的资源。相对\
    \ URL 从当前页面到资源的路径以及资源文件名，看起来像 '路径文件/文件名'。\n\n## 链接样式化\n\n和所有元素一样，`<a>` 具有最终源自浏览器默认样式表的默认外观。在\
    \ `<a>` 的情况下，这种默认样式通常是蓝色下划线文本。我们可以覆盖这种样式，通过向 `<a>` 元素附加样式规则，无论是直接附加还是通过继承来实现。\n\
    \n然而，超链接通常根据其状态更改样式，例如当鼠标指针悬停在其上方，或者用户之前点击过该链接。这种基于状态的样式通过 CSS 伪类选择器实现。\n\n> **小提示**\n\
    > 浏览器提供一个默认样式表。它定义了所有 CSS 属性的值，是样式级联的起点。\n\n**下方示例：** 链接具有默认外观。\n\n"
