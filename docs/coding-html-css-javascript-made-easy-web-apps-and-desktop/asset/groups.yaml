  - '[PAGE 152]


    # DATA TYPES


    All data handled by JavaScript has a data type. This specifies the nature of the
    data being handled – whether it''s a number, text, a list and so on.


    # WHAT IS A DATA TYPE?


    In order to translate a piece of data into anything useful, a computer or program
    has to know what the data is intended to represent – Because data is stored in
    variables, we normally refer to variables as having a data type, or as being of
    type so and. Data types fall into two groups: primitive and reference. Let''s
    take a look at what that means.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_152_0.png)


    **Above:** Data types define the meaning of the raw numbers stored by a computer.'
  - '[PAGE 153]


    # PRIMITIVE AND REFERENCE DATA TYPES


    Primitive data types can be thought of as those whose data represents a single
    value, such as a number, while reference data types represent complex data, such
    as a list.


    When a variable of a primitive type is used in a script, the interpreter copies
    the variable''s value and uses this copy in its calculations. In contrast, when
    a variable of reference type is used, the interpreter works directly with the
    data stored in memory.


    | Variable name typed into an expression | Interpreter looks-up variable value
    from memory | Data in memory |

    | --- | --- | --- |

    | myPrimitiveVar | value | 0001111010011101 |

    | | Interpreter returns copy of looked-up value to expression |


    Primitive data type


    | Variable name typed into an expression | Interpreter locates variable in memory
    | Data in memory |

    | --- | --- | --- |

    | myReferenceVar | | 0010111010011101 |

    | | Interpreter returns a reference to the variable |


    Reference data type


    Above: Primitive data types return a copy of their in-memory value; reference
    types return a direct reference to their in-memory value.


    # Understanding the Difference Between Primitive and Reference Data Types


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_153_0.png)


