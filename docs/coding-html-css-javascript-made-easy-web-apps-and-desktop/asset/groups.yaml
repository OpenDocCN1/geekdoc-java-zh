    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_75_1.png)\n\nAbove: All files for a\
    \ site should be stored in a single outer folder. It's also handy to place all\
    \ of your sites into a single outer folder.\n\n## Create a Basic Structure\n\n\
    - 1. Create a new page in your editor of choice and add the DOCTYPE declaration\
    \ at the very top of the page.\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n</head>\n\
    <body>\n</body>\n</html>\n```\n\n- 2. Add the base elements <html>, <head> and\
    \ <body>, and save the page as 'index.html' inside your First folder.\n\n```html\n\
    <!DOCTYPE HTML>\n<html>\n<head>\n<title>My First Web Page</title>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\nStep 2: Start with the essential elements.\n\n- 3. Now\
    \ add a <title> element as a child of (i.e. within) the <head> element. Make the\
    \ title relevant as this will show up in search-engine listings.\n\nStep 3: Choose\
    \ a title for your page wisely; it can make the difference between the page getting\
    \ visitors or not.\n\n- 4. Now we'll create the basic layout structure for the\
    \ visible content of the page. Add <header>, <section> and <footer> elements as\
    \ children of the <body> element.\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n\
    <title>My First Web Page</title>\n</head>\n<header>\n</header>\n<section>\n</section>\n\
    <footer>\n</footer>\n</body>\n</html>\n```\n\n> Hot Tip\n> The default page of\
    \ any website – the one that is loaded if no specific page is requested – is often\
    \ called index.html. There are other names that work, but this one is best.\n\n\
