  mdcn: "\n\n## 伪类选择器\n\n伪类是一种在 HTML 文档中没有专门声明的类，但当浏览器中查看页面时会变得可用。有几种不同的伪类，但对于超链接，我们关注的伪类有：:link（超链接的基础状态）、:hover（鼠标指针悬停在链接上）和\
    \ :visited（链接已被点击）。在 CSS 中，我们用这些伪类选择器作为另一个选择器的后缀。\n\n```css\na:link {\n  color:blue;\n\
    }\na:hover {\n  color:red;\n  text-decoration:none;\n}\na:visited {\n  color:purple;\n\
    }\n.navButton:hover {\n  color:blue;\n  background-color:gray;\n  cursor:pointer;\n\
    }\n#headerLogo:hover {\n  border-color:blue;\n  border-style:solid;\n  border-width:2px;\n\
    \  cursor:pointer;\n}\n```\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_65_0.png)\n\
    \n**上方：** 伪类选择器被添加为另一个选择器的后缀。\n\n## 在新窗口打开超链接\n\n通常我们希望在新浏览器窗口中打开超链接，这样你自己的网站就可以留在后台打开。这是通过\
    \ `<a>` 元素的 `target` 属性实现的，如下：\n\n```html\n<a href=\"http://www.bbc.co.uk\" target=\"\
    _blank\">\n```\n\n## 列表\n\n列表是网页设计的基础。有两种基本的列表类型：无序列表和有序列表，它们都包含一个或多个列表项。第三种类型定义列表，它创建了一个类似于词汇表的标题和相关信息的结构。\n\
    \n## 列表项\n\n在查看列表元素本身之前，让我们考虑列表中包含的内容。在 HTML 中，这是一个列表项元素 `<li>`。通常，这些元素包含文本，但与其他文本元素一样，它们也可以包含图像和超链接等其他元素。`<a>`\
    \ 元素按照它们在父列表元素出现的顺序进行渲染。\n\n### 无序列表\n\n- HTML5 大部分由元素组成。\n- 元素由开始标签和结束标签标记。\n\
    - 属性允许你修改元素。\n\n### 有序列表\n\n- 1. HTML5 大部分由元素组成。\n2. 元素由开始标签和结束标签标记。\n3. 属性允许你修改元素。\n\
    \n### 定义列表\n\nHTML5\n大部分由元素组成。\n元素\n由开始标签和结束标签标记\n属性\n允许你修改元素。\n\n> 上方：列表允许我们以一种吸引人且符合逻辑的方式呈现信息。\n\
    \n## 无序列表\n\n无序列表 `<ul>` 是一个简单的项目符号列表。添加到列表的每个 `<li>` 都会创建一个新的项目符号。`list-style-type`\
    \ 和 `list-style-image` 样式属性决定了项目符号标记的外观。\n\n> 提示：通常将 `<ul>` 放在页面的 `<nav>` 元素中以创建导航菜单。可以对\
    \ `<ul>` 进行样式处理，使其水平或垂直渲染项目。\n\n```css\nul {\n  list-style-type:circle;\n}\nol\
    \ {\n  list-style-type:decimal;\n}\n</style>\n</head>\n<body>\n<ul>\n  <li>HTML5\
    \ 大部分由元素组成。</li>\n  <li>元素由开始标签和结束标签标记。</li>\n  <li>属性允许你修改元素。</li>\n</ul>\n<h2>有序列表</h2>\n\
    <ol>\n  <li>HTML5 大部分由元素组成。</li>\n  <li>元素由开始标签和结束标签标记。</li>\n  <li>属性允许你修改元素。</li>\n\
    </ol>\n</body>\n```\n\n上方：`<ul>` 和 `<ol>` 列表的唯一区别在于每个项的标记方式。\n\n## 有序列表\n\n在有序列表\
