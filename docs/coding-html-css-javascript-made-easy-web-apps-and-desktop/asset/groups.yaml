    \ | 5 > 4 (true) |\n| >= | 大于等于 | 左操作数大于或等于右操作数时返回 true | 4 >= 4 (true) |\n\n\
    ## 逻辑运算符\n\n逻辑运算符比较值并返回 true 或 false。\n\n| 运算符 | 操作数数量 | 名称 | 操作 | 示例（括号内为结果）\
    \ |\n|---|---|---|---|---|\n| && | 2 | 逻辑与 | 两个操作数均为真时返回 true | true && false\
    \ (false) |\n| || | 2 | 逻辑或 | 任一操作数为真时返回 true | true || false (true) |\n| ! |\
    \ 1 | 逻辑非 | 放在单个操作数之前；反转布尔值 | !true (false) |\n\n## 182 轻松学习 HTML • CSS • JAVASCRIPT\n\
