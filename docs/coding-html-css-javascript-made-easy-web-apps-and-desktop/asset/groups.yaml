  mdcn: "\n括号内的任何表达式都会在同一语句中的所有其他表达式之前求值。考虑以下情况：(24 - 2) / 7。括号中的语句 `(24 - 2)` 首先被求值，结果\
    \ `22` 然后被除以 7。\n\nIDE 检测到由于缺少括号导致的语法错误\n\n```\n第 10 行存在语法错误。在修复此错误之前，代码提示可能无法工作。\n\
    ```\n```html\n1 <!DOCTYPE HTML>\n2 <html>\n3\n4 <head>\n5 <title>嵌套括号</title>\n\
    6 </head>\n7\n8 <body><script type=\"text/javascript\">\n9 var myValue1 = ((22\
    \ / 7) + 10) - 3;\n10 var myValue2 = 13 + (9 - 2 / (4 + 6));\n11\n12 </script>\n\
    13 </body>\n14 </html>\n```\n```\n\n此左括号没有对应的右括号\n\n上所示：此示例的第二个表达式导致了语法错误。\n\n\
    ## 嵌套括号\n\n> 小贴士\n> 在嵌套括号时，始终确保每个左括号 `(` 都有一个对应的右括号 `)`。如果存在不匹配，就会发生语法错误。\n\n\
    你经常会发现自己需要在括号内嵌套括号，例如 `((24 - 2) + 10) / 7`。在这种情况下，最深层嵌套的表达式首先求值，然后是下一层深嵌套，依此类推。\n\
    \n## 语句 (STATEMENTS)\n\n在 JavaScript 结构的顶层，我们找到了“语句”。\n所有的 JavaScript 指令都包含在语句之中。\n\
    \n## 什么是语句？\n\nJavaScript 语句封装了一个或多个表达式，可以被视为脚本中离散的步骤或指令。脚本中的每个语句在处理下一个语句之前都会完整执行。\n\
    \n### 编写语句\n考虑以下简单表达式：`playerScore = 0;`。虽然这是一个表达式，但它也是一个语句，正如末尾的分号 `;` 所示。语句不需要比这更复杂，但它们通常都很复杂。\n\
    \n```\nExpression\nplayerScore = 0;\nstatement\n```\n\n```\nExpression\ndocument.write(\"\
    Your score is \" + playerScore);\nstatement\n```\n\n上所示：语句由一个或多个表达式组成\n\n## 复合表达式\n\
    \n我们经常在语句中构建相当复杂的表达式堆，例如：`document.getElementsByTagName(\"body\")[0].appendChild(document.createElement(\"\
    p\")).innerHTML = \"Hello World!\";`\n\n这条语句说明了表达式如何组合。它使用了在第 109 页引入的 DOM 编程技术，来实现与我们编写的第一个脚本相同的结果。\n\
    \n| Expression |\n| --- |\n| Expression |\n| Expression |\n| Expression |\n| Expression\
    \ | Expression |\n| Expression | Expression |\n\n```\ndocument.getElementsByTagName(\"\
    body\")[0].appendChild(document.createElement(\"p\")).innerHTML = \"Hello World!\"\
    ;\n```\n\n**上所示：** 语句通常由复合表达式构建而成。\n\n## 平衡复杂性与可读性\n\n理解冗长且复杂的语句（如上面的语句）可以很容易地分解为一系列更短、更简单的语句是非常重要的。\n\
    \n> 小贴士\n> 像本这样复杂的语句通常写起来比读起来容易得多。事实上，一旦你掌握了 JavaScript，你可能会发现编写它们有一种奇妙的满足感——甚至是艺术性的。\n\
    \n## 186 轻松掌握 HTML • CSS • JAVASCRIPT\n\n我们所做的只是将表达式分配到更多的语句中。然而，为了将一个语句中的表达式结果与另一个语句共享，我们需要将每个语句的结果存储在变量中，以便其他语句访问这些值。\n\
    \n## 平衡速度与可读性\n\n创建和管理变量会增加解释器的负载，因此，复杂的多个表达式的执行速度通常比将相同表达式分解为多个语句要快。虽然选择如何取决于性能需求。\n\
