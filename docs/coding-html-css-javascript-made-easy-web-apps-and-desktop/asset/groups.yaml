    \ is 0, array with elements is NaN | comma-separated list of element values |\n\
    | object | true | NaN | \"object Object\" |\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_168_0.png)\n\
    \n## ANATOMY OF JAVCRIPT\n\n### JAVCRIPT SYNTAX\n\nA script can consist of a single\
    \ instruction or it can contain thousands of lines of code. No matter the size\
    \ though, all scripts in JavaScript share a common structure and syntax.\n\n###\
    \ SENSITIVITY\n\nThe first thing to note is that JavaScript is case sensitive,\
    \ i.e. lower-case characters are considered distinct from their upper-case counterparts.\
    \ For example, the identifier \"myVariable\" is not the same as \"MyVariable\"\
    \ (notice the different capitalizations).\n\n```javascript\npublishing.prototype.loadQuestions\
    \ = function() {\n  // QUESTION 1\n  this.questions.push(\n    new QuizQuestion(\n\
    \      1,\n      \"Approximately how far away from the Earth is the Sun?\",\n\
    \      [\"200 miles\", \"93,000,000 miles\", \"49,000,000 miles\", \"150,000,000\
    \ miles\"]\n    )\n  );\n  // QUESTION 2\n  this.questions.push(\n    new QuizQuestion(\n\
    \      2,\n      \"How many planets are there in our Solar System?\",\n      [\"\
    6\", \"7\", \"8\", \"9\"]\n    )\n  );\n  // QUESTION 3\n  this.questions.push(\n\
    \    new QuizQuestion(\n      3,\n      \"Which of these is a Moon of Jupiter?\"\
    ,\n      [\"Ganymede\", \"Miranda\", \"Enceladus\", \"Mars\"]\n    )\n  );\n};\n\
    ```\n\n**Above:** Indented code is easier to read because it helps to group sections\
    \ of related code visually.\n\n## WHITE SPACE\n\nLeading spaces and tabs are ignored\
    \ in JavaScript. This enables us to use code indenting in our code, which is a\
    \ technique that helps make the code more organized and human-readable.\n\n##\
    \ SEMICOLONS\n\nJavaScript statements are normally terminated by a semicolon (;)\
    \ but do not have to be. Where semicolons are omitted, the interpreter assumes\
    \ line breaks mark the end of a statement. However, omitting semicolons can lead\
    \ to ambiguity in your code, so best practice is to terminate every statement\
    \ with a semicolon.\n\n```javascript\n// Inline comments start with // and end\
    \ at the next line break\nvar userScore = 0; //They can be written on the same\
    \ line as other code\n\n//alert(userScore); //They can also be used to disable\
    \ lines of code\n```\n\n**Above:** Inline comments end at the line break that\
    \ follows the comment.\n\n## COMMENTS\n\nA **comment** is a section of script\
    \ that ignored by the interpreter. Comments are used for adding notes and explanations\
    \ to scripts, helping others understand them, and acting as notes-to-self when\
    \ revisiting a script months after writing it.\n\n> ### Hot Tip\n> Comments are\
    \ commonly used to disable sections of a script – very useful when experimenting\
    \ with new ideas or attempting to hunt down bugs.\n\n## Inline Comments\n\nAn\
    \ inline comment starts with // and continues until the next line break. They\
    \ can be placed on their own line or on a line following other JavaScript code.\n\
    \n## Block Comments\n\nA block comment starts with /* and continues until a closing\
    \ /. Everything between these markers is considered part of the comment.\n\n```javascript\n\
