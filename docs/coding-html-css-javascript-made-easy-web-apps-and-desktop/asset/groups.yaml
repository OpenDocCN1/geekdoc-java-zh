    \ is a reference to an object, while the right one is the name of a property or\
    \ method of that object.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_176_0.png)\n\
    \n**Above:** Operands are the values that an operator will, umm, operate on.\n\
    \n## Arithmetic Operators\n\nAn arithmetic operator performs arithmetic using\
    \ the supplied operand(s) and returns the result of calculation. The operands\
    \ must be numbers, or expressions that evaluate to numbers.\n\n> Hot Tip\n> Go\
    \ to https://en.wikibooks.org/wiki/JavaScript/Operators to find a complete list\
    \ of JavaScript’s operators.\n\n| Operator | Number of operands | Name | Action\
    \ | Example (result in brackets) |\n|---|---|---|---|---|\n| + | 2 | addition\
    \ | Sums the left and right operands | 4 + 5 (9) |\n| - | 2 | subtraction | Subtracts\
    \ the right operand from the left operand | 31 - 14 (17) |\n| * | 2 | multiplication\
    \ | Multiplies the left and right operands | 12 * 3 (36) |\n| / | 2 | division\
    \ | Divides the left operand by the right operand | 12 / 3 (4) |\n| ++ | 1 | increment\
    \ | Adds 1 to the value of the identifier that is the single operand | numUsers\
    \ ++ (numUsers increases by 1) |\n| -- | 1 | decrement | Subtracts 1 from the\
    \ value of the identifier that is the single operand | numUsers -- (numUsers decreases\
    \ by 1) |\n\n## String Operators\n\nThere are a few different operators that can\
    \ work with strings, but only one dedicated to strings:\n\n| Operator | Name |\
    \ Action | Example (result in brackets) |\n| --- | --- | --- | --- |\n| + | concatenation\
    \ | Joins two strings | \"Hello\" + \"World\" (\"HelloWorld\") |\n\nNote that\
    \ the concatenation operator looks the same as addition; if either operand evaluates\
    \ to a string, the result is a string.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_178_0.png)\n\
    \n## Assignment Operator\n\nWe've already met this operator, whose right operand\
    \ can be a literal.\n\n| Operator | Name | Action | Example (result in brackets)\
    \ |\n| --- | --- | --- | --- |\n| = | assignment | Assigns the value of the right\
    \ operand to the variable | myVar = 42 |\n\n## Equality Operators\n\nThese operators\
    \ compare two operands.\n\n| Operator | Name | Action | Example (result in brackets)\
    \ |\n| --- | --- | --- | --- |\n| == | equality | Returns true if the operands\
    \ are equal | 4 == 4 (true) |\n| != | inequality | Returns true if the operands\
    \ are not equal | 4 != 2 (true) |\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_179_0.png)\n\
    \n## Comparison Operators\n\nAs the name suggests, comparison operators compare\
    \ two operands and return either true or false.\n\n| Operator | Name | Action\
    \ | Example (result in brackets) |\n|---|---|---|---|\n| < | less than | Returns\
    \ true if the left operand is less than the right operand | 4 < 5 (true) |\n|\
    \ <= | less than or equal | Returns true if the left operand is less than or equal\
    \ to the right operand | 4 <= 4 (true) |\n| > | greater than | Returns true if\
    \ the left operand is greater than the right operand | 5 > 4 (true) |\n| >= |\
    \ greater than or equal | Returns true if the left operand is greater than or\
    \ equal to the right operand | 4 >= 4 (true) |\n\n## Logical Operators\n\nLogical\
    \ operators compare values and then return true or false.\n\n| Operator | Number\
    \ of operands | Name | Action | Example (result in brackets) |\n|---|---|---|---|---|\n\
    | && | 2 | logical AND | Returns true if both operands evaluate to true | true\
    \ && false (false) |\n| || | 2 | logical OR | Returns true if either operand evaluates\
    \ to true | true || false (true) |\n| ! | 1 | logical NOT | Placed before its\
    \ single operand; inverts the Boolean value | !true (false) |\n\n## 182 CODING\
    \ HTML • CSS • JAVASCRIPT MADE EASY\n\n```\n<body>\n  <script type=\"text/javascript\"\
    >\n    var jsResult = 20 - 4 * 3;\n    document.write(\"<p>20 - 4 * 3 equals \"\
    \ + jsResult + \"</p>\");\n    var possResult1 = (20 - 4) * 3;\n    document.write(\"\
    <p>(20 - 4) * 3 equals \" + possResult1 + \"</p>\");\n    var possResult2 = 20\
    \ - (4 * 3);\n    document.write(\"<p>20 - (4 * 3) equals \" + possResult2 + \"\
    </p>\");\n  </script>\n</body>\n```\n\nAbove: Exploring JavaScript's operator\
    \ precedence\n\n## OPERATOR PRECEDENCE\n\nConsider the following code: 20 - 4\
    \ * 3. Does this mean (20 - 4) * 3, which would evaluate to 48, or could it mean\
    \ 20 - (4 * 3), which would evaluate to 8? JavaScript deals with this by assigning\
    \ a precedence to each operator – the operator with the highest precedence is\
    \ evaluated first; the operator with the lowest precedence last. Why not write\
    \ a script to see which of the above is the correct solution?\n\n## Overriding\
    \ Operator Precedence\n\nRemembering the precedence of every operator can be quite\
    \ challenging, so it's often easier and less ambiguous to override the default\
    \ operator precedence using parentheses (brackets).\n"
