    \ `this` 关键字。当在构造函数中使用时，`this` 指的是正在构建中的实例。\n\n在我们刚刚编写的代码中，有四个以 `this` 开头的语句——它们将传递给构造函数的参数值赋值给新实例。通过将这些值赋值给\
    \ `this`，我们实际上是将它们赋值给了新实例。\n\n当 `this` 在类方法中使用时，它指的是执行该方法的类所属的特定实例。这在接下来的练习中将会变得更加清晰。\n\
    \n## 类方法\n\n方法与函数相似。简单来说，函数是一个可以接收对象的独立实体，而方法是对象不可或缺的一部分，并在该对象的上下文中运行。\n\n我们已经遇到过一些内置类的方法——例如，数组类的\
    \ `push()` 方法。当我们调用 `push()` 时，是通过数组类的的一个实例来调用的：`myArray.push(newValue)`，因此它是一个方法。\n\
    \n## 原型对象 (The Prototype Object)\n\n正如之前提到的，JavaScript 对象类在语言中处于崇高的地位——它是所有类的基石。结果是所有其他类（包括我们自定义的类）都继承了\
    \ `Object` 类的方法和属性。其中一个属性被称为 `prototype`——这是定义类方法的地方。让我们来看看如何操作。\n\n```javascript\n\
