- md: "\n## EXPRESSIONS AND OPERATORS\n\nThe instructions you write in scripts are\
    \ made up of expressions. Typically, expressions use operators to manipulate data\
    \ in some way.\n\n## WHAT IS AN EXPRESSION?\n\nAn expression is any segment of\
