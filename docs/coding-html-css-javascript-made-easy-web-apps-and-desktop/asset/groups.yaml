    \n## JAVASCRIPT 结构\n\n### JAVCRIPT 语法\n\n脚本可以由单条指令组成，也可以包含数千行代码。无论大小如何，所有 JavaScript\
    \ 脚本都共享共同的结构和语法。\n\n### 敏感性\n\n首先要注意的是，JavaScript 是区分大小写的，即小写字母与其大写字母被认为是是不同的。例如，标识符\
    \ \"myVariable\" 与 \"MyVariable\" 相同（注意大小写的区别）。\n\n```javascript\npublishing.prototype.loadQuestions\
    \ = function() {\n  // 问题 1\n  this.questions.push(\n    new QuizQuestion(\n \
    \     1,\n      \"太阳距离地球有多远？\",\n      [\"200 英里\", \"93,000,000 英里\", \"49,000,000\
    \ 英里\", \"150,000,000 英里\"]\n    )\n  );\n  // 问题 2\n  this.questions.push(\n\
    \    new QuizQuestion(\n      2,\n      \"我们的太阳系中有多少行星？\",\n      [\"6\", \"7\"\
    , \"8\", \"9\"]\n    )\n  );\n  // 问题 3\n  this.questions.push(\n    new QuizQuestion(\n\
    \      3,\n      \"这些中哪是木星的卫星？\",\n      [\"盖卫\", \"米兰达\", \"恩克拉多斯\", \"火星\"]\n\
    \    )\n  );\n};\n```\n\n**上方：** 缩进代码有助于理解我们为什么要这样做。\n\n## 空格\n\n领先空格和制表符在 JavaScript\
    \ 中会被忽略。这允许我们在代码中使用缩进，这种技术可以使代码更有条理。\n\n## 分号\n\nJavaScript 语句通常以分号（;）结束，但不是必须的。省略分号可能会导致歧义，因此最佳实践是在每条语句结束时加上分号。\n\
    \n```javascript\n// 行内注释以 // 开始，到换行结束\nvar userScore = 0; //它们也可以与其他代码在同一行\n\n\
    //alert(userScore);//它们也可以用来禁用代码\n```\n\n**上方：** 行内注释在换行处结束。\n\n## 注释\n\n**注释**是解释器忽略的脚本部分。注释用于为脚本添加备注和解释，帮助他人理解，并在几个月后重新查看脚本时作为提示。\n\
    \n> ### 小贴士\n> 注释通常用于禁用脚本部分——在尝试新想法或寻找 bug 时非常有用。\n\n## 行内注释\n\n行内注释以 // 开始，到下一个换行结束。它们可以单独占一行，也可以跟在\
