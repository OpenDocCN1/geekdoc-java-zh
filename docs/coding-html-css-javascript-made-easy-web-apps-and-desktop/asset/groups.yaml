    # TROUBLESHOOTING

    COMMON HTML/CSS PROBLEMS


    When working with web-based technologies, there will always be issues of compatibility.
    Here we run through some of the common issues that you are likely to encounter
    when building websites.


    # WEB PAGE DOESN''T DISPLAY

    PROPERLY IN INTERNET EXPLORER


    Older versions of Internet Explorer use a different method to other browsers to
    display HTML and CSS elements. However, the latest versions of Internet Explorer
    are much more standards-compliant than previous ones. The best workaround is to
    keep as simple as possible.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_127_0.png)'
  - '[PAGE 128]


    # COPYING TEXT FROM WORD LEAVES LOADS OF EXTRA TEXT


    Copying text directly from a Word document into a web page will also bring in
    a load of the styling that Word applies to its documents. You could delete this
    by hand, but this is time-consuming. A simple solution is to save the Word document
    as a text-only file and then copy and paste the text into a web page.


    # WHY ISN''T MY IMAGE SHOWING?


    There could be a number of reasons but the first part of call is to make sure
    that the image''s URL is using the correct path, name and file extension. You
    might be using a URL with the right image name but the wrong file extension, for
    example, png instead of jpg, or not have provided the correct folder path information.


    # HOW DO I CHECK THAT MY HTML IS CORRECT?


    The best way to check your HTML and CSS for errors is to use an online validation
    tool such as the official W3C validator at http://validator.w3.org/

    If you use an HTML editor such as Dreamweaver to build your pages, it will have
    validation tools built in.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_128_0.png)


    **Above:** Use a validation tool or service to test your HTML.'
  - '[PAGE 129]


