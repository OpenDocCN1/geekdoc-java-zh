    \nAbove: Adding a statement block to an if statement."
- md: "\n## The Else Clause\n\nThe basic if statement can be expanded via the addition\
    \ of an else clause (we refer to it as a clause because it's a subsection of a\
    \ larger if statement, and means nothing outside of an if statement). The general\
    \ form is this:\n\n```\nif(condition) {\n  statement(s);\n} else {\n  statement(s);\n\
    }\n```\n\nThe statement following else executes when the if statement's condition\
    \ evaluates to false. Why not try adding an else clause to the last coding exercise\
    \ (page 65)?\n\n## Hot Tip\n\nThe opening brace of a statement block can be directly\
    \ following the closing of the condition expression, or on its own line, or even\
    \ just before the first statement. It's up to you.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_190_0.png)\n\
    \nRight: The else clause is triggered when the condition expression evaluates\
    \ to false.\n\n## NESTING IF STATEMENTS\n\nThe else if clause creates a branching\
    \ logical structure that is very common in programming. But beware: such structures\
    \ become increasingly complex with each additional branch — we can often avoid\
    \ them altogether by employing a different conditional statement.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_191_0.png)\n\
    \n**Above:** The else if clause adds more conditional tests to an if statement\n\
    \n## The Else If Clause\n\nWe can introduce a new conditional test in the event\
    \ that the previous test evaluates to false. The general form looks like this:\n\
    \n```\nif(condition) {\n    statement(s);\n} else if(condition) {\n    statement(s);\n\
    }\n```\n\nWe can add as many else if clauses as we like, and also conclude with\
    \ a final else clause executes only when all preceding conditions evaluate to\
    \ false.\n\n## THE SWITCH STATEMENT\n\nThe switch is similar to if but rather\
    \ testing a condition for true or false, a switch statement selects a block of\
    \ code to execute based on the result of the condition expression. The values\
    \ to test for are specified in case sections. The general form is:\n\n```\nswitch(condition)\
    \ {\n  case label_1:\n    statement(s);\n    break;\n  case label_2:\n    statement(s);\n\
    \    break;\n  ...\n  default:\n    statement(s);\n    break;\n}\n```\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_192_0.png)\n\
    \n## How a Switch Statement Works\n\nWhen the interpreter encounters a switch\
    \ statement, it evaluates the condition expression and then looks in the statement\
    \ block for a case label that matches the condition's result. If a match is found,\
    \ all following statements are executed, including those contained in subsequent\
    \ case sections.\n\nAbove: The flow of a switch statement.\n\n## CODING HTML •\
    \ CSS • JAVASCRIPT MADE EASY\n\n## Breaking from a Case Section\n\nIn order to\
    \ prevent subsequent sections from being executed, we include a break keyword\
    \ at the end of each case. This tells the interpreter to cease processing the\
    \ statement block and resume execution at the first statement following the block.\n\
    \n> Hot Tip\n> If you find a structure of if-else-if statements is becoming too\
    \ cumbersome to manage, a switch statement may be a more suitable approach.\n\n\
    ## Default Case\n\nA switch statement can contain a special default section that\
    \ is always triggered if encountered. This is typically placed at the end of the\
    \ switch so that it is selected only if no case labels match the condition expression.\n\
    \n| | |\n|---|---|\n| 8 | <script type=\"text/javascript\"> |\n| 9 | //Imagine\
    \ an object named mediaObject exists on the page. |\n| 10 | //mediaObject could\
    \ refer to a video file or to an audio file, |\n| 11 | //but writing the code\
    \ we don't know which it will be. |\n| 12 | switch(mediaObject.mediaType) { |\n\
    | 13 | case \"video\": |\n| 14 | alert(\"You are about to access a video\"); |\n\
    | 15 | //statements that cause the video to load and play |\n| 16 | break; |\n\
    | 17 | case \"audio\": |\n| 18 | alert(\"You are about to access an audio recording\"\
    ); |\n| 19 | //statements that cause the audio to load and play |\n| 20 | break;\
    \ |\n| 21 | default: |\n| 22 | alert(\"Cannot determine the media type\"); |\n\
    | 23 | } |\n| 24 | | |\n| 25 | </script> |\n\n**Above:** This imaginary script\
    \ shows how a switch statement can be used.\n\n## LOOP STATEMENTS\n\nWe often\
    \ need to run the same set of statements against a collection of different values,\
    \ or repeat statements a certain number of times – this is where loops come in.\n\
    \n## WHILE LOOPS\n\nThe simplest form of loop statement is known as the while\
    \ loop. Its general form is:\n\n```\nwhile(condition) {\n  statement(s);\n}\n\
    ```\n\nIf the condition evaluates to true, the statement(s) contained in the code\
    \ block following the condition are executed, then the condition is tested again.\
    \ If still true, the process is repeated. This continues until the condition evaluates\
    \ to false.\n\n> Hot Tip\n> Caution: if you code loops incorrectly, you may trigger\
    \ an infinite loop, where the interpreter gets stuck.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_194_0.png)\n\
    \n## DO WHILE LOOPS\n\nThese loops are very similar to while loops, except the\
    \ condition is evaluated after the statement block. If the condition evaluates\
    \ to true, the statement block is repeated. Here is how it looks:\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_195_0.png)\n\
    \n```\ndo {\n  statement(s);\n} while(condition);\n```\n\n## FOR LOOPS\n\nThe\
    \ for loop is often used for processing elements of an array, because it simplifies\
    \ the number of iterations. For example:\n\n```\nfor(initialize; condition; iteration)\
    \ {\n  statement(s);\n}\n```\n\n## Elements of For Loop\n\nThe three elements\
    \ of a for loop are expressions that control the loop:\n\n- **initialize:** This\
    \ expression creates an initial index, typically a number.\n- **condition:** This\
    \ is the expression that tests whether the loop repeats.\n- **iteration:** This\
    \ expression is evaluated after each iteration.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_196_0.png)\n\
    \n## Using a Loop\n\nIn the exercise on page 41, we'll build a quiz application.\n\
    \n- Create an outer folder and call it Quiz.\n- Create a new HTML document and\
    \ save it simpleQuiz.html.\n- Create a new JavaScript document and save it in\
    \ the js folder as quizQuestions.js.\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n\
    \  <title>A Simple Quiz</title>\n  <script type=\"text/javascript\" src=\"js/quizQuestions.js\"\
    ></script>\n</head>\n<body>\n</body>\n</html>\n```\n\n- Return to the HTML document.\
    \ Add a `<script>` element as a child of the `<head>`, setting its type to \"\
    text/javascript\" and its src to \"js/quizQuestions.js\".\n- Go to quizQuestions.js,\
    \ where we're going to define the questions themselves. At the top of the file,\
    \ declare an array variable named questions.\n- Now we'll add a question by declaring\
    \ object and array literals within the push() method's parentheses, as shown in\
    \ the illustration below.\n\n```javascript\nvar questions = [];\n//QUESTION 1\n\
    questions.push({\n  questionText: \"Approximately how far away from the Earth\
    \ is the Sun?\",\n  answers: [\"200 miles\", \"93,000,000 miles\", \"49,000,000\
    \ miles\", \"150,000 miles\"],\n  correctAnswerIndex: 1\n});\n\n//QUESTION 2\n\
    questions.push({\n  questionText: \"How many planets are there in our solar system?\"\
    ,\n  answers: [\"6\", \"7\", \"8\", \"9\"],\n  correctAnswerIndex: 2\n});\n\n\
    //QUESTION 3\nquestions.push({\n  questionText: \"Which of these is a moon of\
    \ Jupiter?\",\n  answers: [\"Ganymede\", \"Miranda\", \"Enceladus\", \"Mars\"\
    ],\n  correctAnswerIndex: 0\n});\n```"
  mdcn: "\n\n## else 子句\n\n基础的 `if` 语句可以通过添加 `else` 子句来扩展（我们称之为子句是因为它是较大的 `if` 语句的子部分，并且在\
    \ `if` 语句之外没有任何意义）。通用格式如下：\n\n```\nif(condition) {\n  statement(s);\n} else {\n\
    \  statement(s);\n}\n```\n\n当 `if` 语句的条件求为假时，执行 else 之后的语句。为什么不尝试在最后一个编码练习（第 65\
    \ 页）中添加一个 `else` 子句呢？\n\n## 小贴士\n\n语句块的大括号可以紧跟在条件表达式的结束之后，也可以单独占一行，甚至可以位于第一个语句之前。这取决于你。\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_190_0.png)\n\n正确：当条件表达式求为假时，触发 `else`\
    \ 子句。\n\n## 嵌套 if 语句\n\n`else if` 子句创建分支逻辑结构，这在编程中非常常见。但请注意：随着每个分支的增加，这种结构会变得越来越复杂——我们通常可以通过采用不同的条件语句来完全避免它们。\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_191_0.png)\n\n**上方：** `else if` 子句为\
    \ `if` 语句增加了更多的条件测试。\n\n## else if 子句\n\n当上一个测试求为假时，我们可以引入一个新的条件测试。其通用格式如下：\n\n\
    ```\nif(condition) {\n    statement(s);\n} else if(condition) {\n    statement(s);\n\
    }\n```\n\n我们可以根据需要添加任意多个 `else if` 子句，并以最后的 `else` 子句结束，该子句仅在所有之前的条件都求为假时才执行。\n\
    \n## switch 语句\n\n`switch` 与 `if` 类似，但它是测试条件为真还是假，`switch` 语句根据条件表达式的结果选择一个代码块执行。要测试的值在\
    \ `case` 部分中指定。其通用格式为：\n\n```\nswitch(condition) {\n  case label_1:\n    statement(s);\n\
    \    break;\n  case label_2:\n    statement(s);\n    break;\n  ...\n  default:\n\
    \    statement(s);\n    break;\n}\n```\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_192_0.png)\n\
    \n## switch 语句如何工作\n\n当解释器遇到 `switch` 语句时，它会评估条件表达式，然后在语句块中寻找与条件结果匹配的 `case` 标签。如果匹配项，则执行所有后续语句，包括包含在后续\
    \ `case` 部分中的语句。\n\n上方：`switch` 语句的流程。\n\n## 轻松上手 HTML • CSS • JAVASCRIPT\n\n\
    ## 跳出 case 部分\n\n为了防止执行后续部分，我们在每个 `case` 的末尾包含一个 `break` 关键字。这告诉解释器停止处理语句块，并从块后的第一个语句开始恢复执行。\n\
    \n> 小贴士\n> 如果你发现 `if-else-if` 语句的结构变得难以管理，那么 `switch` 语句可能是一个更合适的方法。\n\n## 默认\
    \ case\n\n`switch` 语句可以包含一个特殊的 `default` 部分，如果遇到它将始终触发。这通常放置在 `switch` 的末尾，以便在没有\
    \ `case` 标签匹配条件表达式时才选择它。\n\n| | |\n|---|---|\n| 8 | <script type=\"text/javascript\"\
