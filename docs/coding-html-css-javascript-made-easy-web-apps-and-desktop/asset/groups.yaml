    # CODING HTML • CSS • JAVASCRIPT MADE EASY


    # # Hot Tip


    Web fonts allow you to use fonts on your site that aren''t installed on your visitors''
    computers.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_81_0.png)


    +   2. Now we need a font for your text. There is a limited set of standard fonts
    that are installed on all computers; using one of these is an option. The better
    option is to use a web font: head over to Google Fonts (www.google.com/fonts)
    and find a font you like, preferably one with a lot of variations, such a Lato.


    **Step 2:** Choose a font to use on your website.


    +   3. Click the Quick-Use button and select a font variation. You will now be
    shown a block of code for a `<link>` element. Copy it and paste it into the `<head>`
    of your page, before the `<style>` element.


    **Step 3:** Copy the `<link>` element code from Google Fonts.


    | Standard | Import | JavaScript |

    |---|---|---|

    | 3. Add this code to your website: | | |

    | `<link href=''http://fonts.googleapis.com/css?family=Lato:400,700,400italic,700italic''
    rel=''stylesheet''>` |'
