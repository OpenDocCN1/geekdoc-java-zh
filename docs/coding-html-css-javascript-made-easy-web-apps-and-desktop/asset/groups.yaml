  - "[PAGE 65]\n\n# Pseudo-Class Selectors\n\nA pseudo-class is a class that's not\
    \ specifically declared in an HTML document, but that becomes available when the\
    \ page is being viewed in a browser. There are a few different ones, but with\
    \ hyperlinks the pseudo-classes we are concerned with are :link (the base-state\
    \ of a hyperlink), :hover (the mouse pointer is over the hyperlink) and :visited\
    \ (the hyperlink has been clicked). In CSS we use these pseudo-class selectors\
    \ as a suffix to another selector.\n\n```\na:link {\n  color:blue;\n}\na:hover\
    \ {\n  color:red;\n  text-decoration:none;\n}\na:visited {\n  color:purple;\n\
    }\n.navButton:hover {\n  color:blue;\n  background-color:gray;\n  cursor:pointer;\n\
    }\n#headerLogo:hover {\n  border-color:blue;\n  border-style:solid;\n  border-width:2px;\n\
    \  cursor:pointer;\n}\n```\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_65_0.png)\n\
    \n**Above:** Pseudo-Class selectors are added as a suffix to another selector\n\
    \n# OPENING A HYPERLINK IN A NEW WINDOW\n\nIt's often desirable to open a hyperlink\
    \ in a new browser window so your own site remains open in the background. This\
    \ is done via the target attribute of the `<a>` element, like so:\n\n```\n<a href=\"\
    http://www.bbc.co.uk\" target=\"_blank\">\n```"
