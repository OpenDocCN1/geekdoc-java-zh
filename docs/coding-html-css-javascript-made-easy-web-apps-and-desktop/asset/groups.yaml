    \n# PNG 格式\n\nPNG（Portable Network Graphics，读音为 'ping'）是图形（相对于基于照片的图像）的最佳选择，因为它们通常使用无损压缩，因此比\
    \ JPG 具有更好的清晰度和准确性。它们的另一个优点是支持透明度。这意味着 PNG 图像不需要实色背景，PNG 后面的任何内容都可以通过 PNG 的透明区域显示。\n\
    \n**下方：** PNG 图像格式通常是像 logo 等小型图形元素的最佳选择。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_92_0.png)\n\
    \n# JPG 格式\n\nJPG 格式（也称为 JPEG，读音为 'jaypeg'）使用复杂的图像压缩技术来减小图像的文件大小，而不会引起肉眼可见的劣化。这意味着可以以不同的质量级别保存图像以减小文件大小。级别越高，质量越好，但文件越大；开发者可以在此取得平衡。JPG\
    \ 不支持透明度，因此不适用于图形。\n\n> 在创建图像和图形时，请从无损格式（如 PSD，Photoshop 的原生格式）的全质量可编辑版本开始工作，将所需的图形导出为\
    \ PNG 或 JPG 文件。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_93_0.png)\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_93_1.png)\n\
    \n# JPEG\n\n来自维基百科，自由的百科\n\n对于其他用途，JPEG（消义）。在计算中，JPEG (/ˈdʒɛpeg/（通常带有 .jpg 文件扩展出现））是数字图像的一种常用无损压缩方法，特别是对于由数字摄影产生的图像。压缩程度可以调整，具有灵活性。JPEG\
    \ 通常实现 10:1 的压缩，且图像质量几乎没有察觉的损失。\n\nJPEG 压缩用于多种图像文件。JPEG/EXIF 是数字相机和其他摄影图像采集设备最常用的格式；JPEG/EXIF\
    \ 是全球网范围内存储和传输摄影图像最常用的格式。这些变体不作区分，统称为 JPEG。\n\nJPEG 是联合摄影专家小组（Joint Photographic\
    \ Experts Group）的缩写，由该小组创建了标准。JPEG 的 MIME 类型为 image/jpeg（定义在 RFC 1371 中），但在 Internet\
    \ Explorer 中，它在上传 JPEG [图像] 时提供的 MIME 类型为 image/png。\n\nJPEG 支持的最大图像大小为 65535\
    \ 像素 —— 一到四十亿像素（1 亿像素），取决于比例（从 3:1 到 4）。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_93_2.png)\n\
    \n上方：照片通常以 JPG 格式保存。\n\n# 添加图像\n\n在网页上添加图像是一个相对简单的过程。\n\n# <IMG> 元素\n\n在网页上添加图像是一个相对简单的过程。然而，在添加图像之前，我们使用\
    \ `<img>` 标签，该标签是自闭合的。\n\n# 如何添加图像\n\n在网页上添加图像是一个相对简单的过程。\n\n**第一步：** PNG 图像格式通常是\
    \ logo 等小型图形元素的最佳选择。\n\n**第二步：** 在 HTML 中定位图像。\n\n**第三步：** 在 HTML 中创建一个空行。\n\n\
