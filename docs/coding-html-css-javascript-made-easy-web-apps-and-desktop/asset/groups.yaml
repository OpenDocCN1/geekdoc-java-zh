    \ = new com.flametreepublishing.SimpleQuiz();\n  com.flametreepublishing.simpleQuiz.renderAllQuestions();\n\
    </script>\n```\n\nAbove: Step 13: Ensure your HTML page looks like this\n\n14.\
    \ Save and close all open files. If you open the page in your browser, nothing\
    \ will have changed visually, all being well.\n\n# WORKING WITH THE DOM\n\nEvery\
    \ script we've written so far has worked by outputting data to the page while\
    \ the page loads. This is OK – but limiting. What if we want to manipulate the\
    \ page after it has loaded? How do we achieve this?\n\n# DYNAMIC HTML\n\nAll major\
    \ browsers support something called Dynamic HTML — or DOM for short. HTML allows\
    \ JavaScript to make changes to a page after it has been loaded and rendered in\
    \ the browser, with which changes immediately shown on screen. This presents us\
    \ with a whole host of possibilities – your imagination really is the limit.\n\
    \n```javascript\n24 We've checked userAnswer see comments within the body of the\n\
    25 method();\n26\n27 com.flametreepublishing.QuizQuestion.prototype.checkAnswer\
    \ = function(answerIndex) {\n28     //Initialize this to false - we can change\
    \ this if the question is correctly answered\n29     var result = false;\n30 \
    \    if(this.questioned) {\n31         //If the question has already been answered\
    \ then report it in an alert and do not modify\n32         alert('you've already\
    \ answered this question');\n33     } else {\n34         this.questioned = this.correctAnswer(answerIndex);\n\
    35         //If the correct answer is given then mark the question as being correctly\
    \ answered\n36         result = true;\n37 //How to set the color of the question's\
    \ div so that it changes to green\n38 document.getElementById(\"q\" + this.questionNum).className\
    \ = \"correctAnswered\";\n39     result = true;\n40 } else {\n41     //If the\
    \ question has been incorrectly answered then change the div - style class name\n\
    42     // that it has a red highlight\n43 document.getElementById(\"q\" + this.questionNum).className\
    \ = \"incorrectlyAnswered\";\n44 }\n45 }\n46 //Record that this has now been answered\n\
    47 this.questioned = true;\n48 //How to return the result - this isn't actually\
    \ being used any more, but it's nonetheless\n49 //useful to have methods return\
    \ a result, even if only to indicate that the code was\n50 //executed in full\
    \ without errors.\n51 return(result);\n```\n\n# Hot Tip\n\nBe sure to download\
    \ the code examples – see page 13. As well as enabling you to check your code\
    \ against ours, you'll also find comments included that help to further explain\
    \ the examples.\n\n# HTML IS HIERARCHICAL\n\nAll HTML documents contain an `<html>`\
    \ element; this element always contains a `<head>` and a `<body>` element; these\
    \ elements themselves contain other elements. A page is, therefore, a hierarchical\
    \ structure of HTML elements. We express this structure in terms of ancestry:\
    \ `<html>` is the **root** and has two **children**, `<head>` and `<body>`; `<html>`\
