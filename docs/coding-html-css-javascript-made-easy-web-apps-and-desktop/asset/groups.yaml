  - "[PAGE 194]\n\n# LOOP STATEMENTS\n\nWe often need to run the same set of statements\
    \ against a collection of different values, or repeat statements a certain number\
    \ of times – this is where loops come in.\n\n# WHILE LOOPS\n\nThe simplest form\
    \ of loop statement is known as the while loop. Its general form is:\n\n```\n\
    while(condition) {\n  statement(s);\n}\n```\n\nIf the condition evaluates to true,\
    \ the statement(s) contained in the code block following the condition are executed,\
    \ then the condition is tested again. If still true, the process is repeated.\
    \ This continues until the condition evaluates to false.\n\n> Hot Tip\nCaution:\
    \ if you code loops incorrectly, you may trigger an infinite loop, where the interpreter\
    \ gets stuck processing the same loop statement indefinitely.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_194_0.png)"
  - "[PAGE 195]\n\n# DO WHILE LOOPS\n\nThese loops are very similar to while loops,\
    \ except the condition is evaluated only after the statement block has been executed.\
    \ If the condition resolves to true, the statement block is repeated and the condition\
    \ evaluated once more. Here's how it looks:\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_195_0.png)\n\
    \n```\ndo {\n  statement(s);\n} while(condition);\n```\n\n# FOR LOOPS\n\nThe for\
    \ loop is often used for processing the elements of an array, because it simplifies\
    \ executing the same statement block against each element in the array. The for\
    \ loop's declaration can appear a little daunting - let's take a look at it before\
    \ analysing what it means:\n\nAbove: The flow of a do while loop.\n\n```\nfor(initialize\
    \ ; condition ; iteration ) {\n  statement(s);\n}\n```"
  - '[PAGE 196]


    # Elements of a For Loop


    The three elements of a for loop are expressions that control the reiteration
    of the loop:


    +   **initialize:** This expression is evaluated once and creates an initial index
    for the loop; the index is just a number, typically used to count the number of
    loop iterations that have occurred.


    +   **condition:** This is the expression that is tested to see whether the loop
    repeats or not. In most circumstances, the condition expression tests the value
    of the index against some other value, such as an array''s length.


    +   **iteration:** This expression is evaluated after the loop''s statement block
    has been executed, and its intended use is to modify the value of the index before
    the next iteration.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_196_0.png)


    Above: The flow of a for loop.'
