  - "[PAGE 190]\n\n# The Else Clause\n\nThe basic if statement can be expanded via\
    \ the addition of an else clause (we refer to it as a clause because it's a subsection\
    \ of a larger if statement, and means nothing outside of an if statement). The\
    \ general form is this:\n\n```\nif(condition) {\n  statement(s);\n} else {\n \
    \ statement(s);\n}\n```\n\nThe statement following else executes when the if statement's\
    \ condition evaluates to false. Why not try adding an else clause to the last\
    \ coding exercise (page 65)?\n\n# Hot Tip\n\nThe opening brace of a statement\
    \ block can be directly following the closing of the condition expression, or\
    \ on its own line, or even just before the first statement. It's up to you.\n\n\
    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_190_0.png)\n\nRight: The else clause\
    \ is triggered when the condition expression evaluates to false."
  - "[PAGE 191]\n\n# NESTING IF STATEMENTS\n\nThe else if clause creates a branching\
    \ logical structure that is very common in programming. But beware: such structures\
    \ become increasingly complex with each additional branch — we can often avoid\
    \ them altogether by employing a different conditional statement.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_191_0.png)\n\
    \n**Above:** The else if clause adds more conditional tests to an if statement\n\
    \n# The Else If Clause\n\nWe can introduce a new conditional test in the event\
    \ that the previous test evaluates to false. The general form looks like this:\n\
    \n```\nif(condition) {\n    statement(s);\n} else if(condition) {\n    statement(s);\n\
    }\n```\n\nWe can add as many else if clauses as we like, and also conclude with\
    \ a final else clause executes only when all preceding conditions evaluate to\
    \ false."
  - "[PAGE 192]\n\n# THE SWITCH STATEMENT\n\nThe switch is similar to if but rather\
    \ testing a condition for true or false, a switch statement selects a block of\
    \ code to execute based on the result of the condition expression. The values\
    \ to test for are specified in case sections. The general form is:\n\n```\nswitch(condition)\
    \ {\n  case label_1:\n    statement(s);\n    break;\n  case label_2:\n    statement(s);\n\
    \    break;\n  ...\n  default:\n    statement(s);\n    break;\n}\n```\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_192_0.png)\n\
    \n# How a Switch Statement Works\n\nWhen the interpreter encounters a switch statement,\
    \ it evaluates the condition expression and then looks in the statement block\
    \ for a case label that matches the condition's result. If a match is found, all\
    \ following statements are executed, including those contained in subsequent case\
    \ sections.\n\nAbove: The flow of a switch statement."
  - '[PAGE 193]


    # CODING HTML • CSS • JAVASCRIPT MADE EASY


    # Breaking from a Case Section


    In order to prevent subsequent sections from being executed, we include a break
    keyword at the end of each case. This tells the interpreter to cease processing
    the statement block and resume execution at the first statement following the
    block.


    > Hot Tip

    If you find a structure of if-else-if statements is becoming too cumbersome to
    manage, a switch statement may be a more suitable approach.


    # Default Case


    A switch statement can contain a special default section that is always triggered
    if encountered. This is typically placed at the end of the switch so that it is
    selected only if no case labels match the condition expression.case labels match
    the condition expression.


