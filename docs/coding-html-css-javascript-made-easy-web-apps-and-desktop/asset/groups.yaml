    # ADDING IMAGES


    The addition of images to a web page is a relatively simple process. However,
    before adding an image, it is a good idea to store your images in a sub-folder
    of your site root.


    # THE <IMG> ELEMENT


    When adding images to a page we use the `<img>` element. This is a self-closing
    element, meaning that, you will recall, they only have an opening tag and no closing
    tag, and can''t have any content nested within them.


    # How to Add an Image


    +   In the previous chapter we built a simple page in a folder called MyFirstFit.
    Locate this folder and create a subfolder within it; name the subfolder ''images''.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_94_0.png)


    **Step 1:** Make sure the ''images'' folder is a subfolder of the site root folder.'
