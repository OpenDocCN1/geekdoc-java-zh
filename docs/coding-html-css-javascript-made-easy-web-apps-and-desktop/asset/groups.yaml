    > ### 请查看第 13 页，了解如何下载书中所有代码示例的完整版本。它们包含了额外的注释，有助于进一步解释这些示例。


    ## Firefox


    本书中的所有示例都使用标准的 JavaScript 编程技术和结构。然而，为了避免任何烦人的浏览器兼容性问题，我们将使用 Firefox 浏览器运行所有示例，并鼓励你也这样做。


    上：Mozilla Firefox 是目前可用的最符合标准的网页浏览器之一，且免费安装和使用。你可以从 mozilla.org 下载它。


    ## 什么是 JavaScript？


    JavaScript 是一种脚本语言，用于交互和控制加载到网络浏览器中的页面。它为与用户、页面以及互联网交互提供了丰富的函数库。


    ## 什么是脚本？


    在剧院世界，脚本（script）可以被看作一系列指令，告诉演员应该在哪里、做什么、以及什么时候做和说什么。在计算中，其含义非常相似：脚本是让计算机执行的一系列指令。是的，演员是屏幕上的图形和数据块，而不是一群演员，但原理是相同的。


    脚本告诉演员应该在哪里、做什么以及什么时候做——当然，这些演员是指计算机数据和图形。


    ## JavaScript 运行在客户端


    从一开始就必须理解的是，当在网页中使用 JavaScript 时，它运行在用户的（或客户端的）计算机上，并与加载到该计算机网络浏览器中的网页副本进行交互。这通常被称为“客户端侧”脚本。


    ## Java 和 JavaScript


    你可能听过一种叫做 Java 的语言，并认为它与 JavaScript 有某种关系——其实并没有。Java 在 JavaScript 开发期间是一个热门话题，通过将该语言命名为
    JavaScript，它的开发者确保了它获得了关注。尽管在语法上有偶然的相似之处，这两种语言在本质上是不同且无关的。


    上：JavaScript 直接与加载到用户浏览器中的页面映像进行交互。


    ## 为什么在页面中包含脚本？


    页面中使用脚本的理由几乎与使用脚本的页面一样多。总的来说，使用脚本有两个关键原因：修改页面外观；以及/或允许页面与 Web 服务器之间的通信。


    ## 视觉变化


    一些最常见的——无疑是最明显的——脚本根据编写页面时未知的条件来修改页面外观。条件可能简单如一天中的时间或用户鼠标指针的位置，也可以非常复杂。关键点在于，使用
    JavaScript，我们可以判断是否满足了某个条件，然后根据该条件采取行动。


    右：搜索引擎使用脚本在你输入时显示可能的搜索结果。


    ## 认识 JavaScript


    上：JavaScript 直接与加载到用户浏览器中的页面映像进行交互。


    ## 通信


    脚本可以在许多场景下与服务器进行通信。例如，脚本可以从服务器获取数据或向服务器发送数据。这允许动态内容在不需要重新加载整个页面的情况下发生变化。


    上：JavaScript 为开发者提供了许多功能。


    ## 编写 JavaScript


    将脚本链接到页面是常见做法。要做到这一点，脚本被写在一个独立的文本文件中，并以 .js 后名保存。


    ## IDEs


    字体 行号：帮助我们在大型脚本中导航

    - 代码折叠：避免被你正在处理的代码块分心

    - 代码提示：在你输入时显示一个与上下文敏感的函数、方法和属性列表

    - 内置参考信息：某些 IDE 包含参考信息

    - 文件管理：对于较大的项目来说，内置的文件管理功能是无价的


    '
