    \ the viewport, we have to let it know what size we want it to assume; if we don't\
    \ this then a default value will be used which may or not be suitable. We set\
    \ the scaling via a <meta> tag placed in the <head> of the page.\n\n# Viewport\
    \ Properties\n\nThe thing we are interested in is the value of the content attribute.\
    \ This is used to set a viewport property; in our example we are telling the viewport\
