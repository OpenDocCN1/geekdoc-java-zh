  - '[PAGE 10]


    # GO FURTHER


    The advice doesn''t stop at simply creating your website: learn how to get your
    website onto the internet, find out how you can buy your own .com name, create
    a blog with WordPress, discover some advanced CSS techniques and learn simple
    JavaScript language.


    # STEP-BY-STEP


    The process of building a website and learning new languages can seem like a daunting
    task. But this book rises to the challenge and demonstrates the process through
    a selection of step-by-step guides. These provide easy-to-follow instructions
    which will guide you through some of the most important building blocks of a website.


    # EXPERT GUIDANCE


    Should all not go according to plan, our helpful troubleshooting guide will help
    you get back on track, and our Further Reading guide will point you in the direction
    of where to go next.


    # CODE EXAMPLES


    When showing examples of HTML, CSS and JavaScript code we will use text that looks
    like this. When we want to indicate that something would be written in a code
    block but that we haven''t shown it in the example, we would build the text as
    well, like this: header {style rule}. You wouldn''t type ''style rule'' into the
    code - rather, we''re showing you where the style rule would go.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_10_0.png)


    In addition to the more substantial step-by-steps, there is a collection of Hot
    Tip guides. These offer quick, handy hints as well as advice to add flourishes
    to the final website.'
  - '[PAGE 11]


    # THE FORMATION OF JAVASCRIPT


    The JavaScript language has been with us since the very earliest days of the World
    Wide Web. In its early days it was merely one face in a crowd, one of many languages
    and technologies vying for the attention and evangelism of the web development
    community.


    # UNIVERSAL LANGUAGE


    Over the years, many such technologies have come into fashion before falling from
    grace for one reason or another, but not so with JavaScript. Thanks largely to
    a combination of flexibility and ubiquitness, JavaScript is now the principal
    scripting language of the internet.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_11_0.png)'
  - '[PAGE 12]


    # A STEP UP FROM HTML/CSS


    Despite JavaScript''s at-times esoteric nature, it is the perfect language to
    use for learning about coding in general. This book is aimed at people who are
    quite new to writing code and programming. You may be completely new to HTML,
    CSS and JavaScript; you may have spent some time with HTML and CSS and want to
    refresh your knowledge and learn about JavaScript; or you may have tinkered with
    a bit of scripting and want to formalize and expand on that knowledge. You may
    even be an experienced programmer who has never used JavaScript and wants a quick
    overview to get started.


    # GO-TO PRIMER


    There''s no getting away from the fact that JavaScript is a deep subject, so much
    so that no single book can tell you all there is to know about the language and
    what it can achieve. What this book aims to do, then, is to deliver a wide-ranging
    overview of the JavaScript language, and give you sufficient understanding to
    be able to add your own simple scripts and interactions to your pages. It is also
    perfect as a primer for further studies in coding with JavaScript.


    # Online Samples


    You can download completed versions of the JavaScript code examples and additional
    notes. To do so, visit www.flametrepublishing.com/book-samples.html.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_12_0.png)


    # Hot Tips


    Look out for the Hot Tips that give you helpful tips about the many shortcuts
    and quick techniques in JavaScript.'
