    # # DATA TYPE

    CASTING


    There are many occasions when you need to use a value of one type in the context
    of another type. For example, you may wish to use the string representation of
    a number ("42" instead of 42), or you may need to use a number in the context
    of a Boolean value. Translating between data types in this way is referred to
    as data type **casting**.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_166_0.png)'
