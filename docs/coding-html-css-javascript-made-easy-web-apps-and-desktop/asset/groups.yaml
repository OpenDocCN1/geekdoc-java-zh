    # ADDING A BLOG TO YOUR SITE


    Web logs, or blogs to give them their usual name, are a common addition to a website,
    and help you build a community of users with similar interests to you.


    # TWO EASY OPTIONS


    From a programing point of view, blogs are quite complex; you''ve come a long
    way, but you''re not ready to tackle that particular project just yet! Frankly,
    then, you can add a blog to your site without having to build your own, and your
    newly acquired knowledge of HTML and CSS can be brought to bear on customizing
    the blog. You can either link it from your site to an external blog provider,
    or install third-party blogging software on your web server. WordPress is a great
    option for both scenarios.


    > Below: Sign up for a free WordPress site at www.wordpress.com


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_87_0.png)


    WordPress.com


    Despite having grown into a complete CMS (Content Management System), WordPress
    is, at its core, a blogging system and can still be used as such. If you wish
    to keep things as simple as possible'
