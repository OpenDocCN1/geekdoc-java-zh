    \ 步骤 4：这里的代码将使题目实现自渲染。\n\n## 创建主类\n\n在构建应用程序时，创建一个主类来定义属性和方法是常见的。其意图是创建一个该类的单一实例，并将其作为其他操作的起点。\n\
    \n## SimpleQuiz\n\n为我们的应用程序创建一个主类。\n\n- 1. 创建一个新文档并保存为 `SimpleQuiz.js`。\n- 2.\
    \ 在编辑器中打开 `simpleQuiz.html`。\n- 3. 添加命名空间声明并为其创建一个构造函数。\n\n```html\n<!DOCTYPE\
