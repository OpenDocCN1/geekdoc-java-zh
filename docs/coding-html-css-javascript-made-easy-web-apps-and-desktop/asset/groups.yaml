  mdcn: "\n\n## 如何工作\n\n第一个 `<script>` 元素非常简单——它链接到一个脚本，我们在该脚本中声明了代表测验中问题的对象，并将它们存储在一个名为\
    \ `questions` 的数组中。该数组可以被页面中的所有脚本访问，并且定义在 `<head>` 中，这样我们可以确保在处理页面的 `<body>` 时，它是是可用的。\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_199_0.png)\n\n现在让我们来看第二个 `<script>`\
    \ 元素中的 `for` 循环。索引初始化为 0。然后评估条件 `i < questions.length`。当 `i` 为 0 时，条件评估为 `true`，因此执行循环体并使用熟悉的\
    \ `document.write()` 技术将文本写入页面。需要注意的是，我们使用循环索引 `i` 来访问 `questions` 数组的每个元素。\n\n\
    一旦语句块完成，就会评估迭代表达式 `i++`，将索引值值加 1，然后再次测试条件。该过程会一直重复，直到条件评估为 `false` 为止。\n\n## 退出循环或迭代\n\
    \n我们可以通过使用 `break` 关键字随时退出循环，这将导致脚本执行从循环后的第一条语句开始继续。我们还可以使用 `continue` 退出循环的当前迭代，它会指示解释器立即评估迭代和条件表达式，如果需要，则继续循环。\n\
    \n```javascript\n<script type=\"text/javascript\">\nfor(var i = 0; i < questions.length;\
    \ i++) {\n  if(typeof questions[i] != \"Number\") {\n    // i 不是一个数字，它不能作为索引 -\
    \ 出了某些\n    // 问题，所以退出循环\n    break;\n  } else if(questions[i].questionText !=\
    \ \"\") {\n    // 如果问题没有文本，则跳过这一次\n    continue;\n  }\n  // 一切正常 - 渲染\n  document.write(\"\
    <h2>QUESTION \" + (i + 1) + \"</h2>\");\n  document.write(\"<p>\" + questions[i].questionText\
    \ + \"</p>\");\n  document.write(\"<pA1: \" + questions[i].answers[0] + \"</p>\"\
    );\n  document.write(\"<pA2: \" + questions[i].answers[1] + \"</p>\");\n  document.write(\"\
    <pA3: \" + questions[i].answers[2] + \"</p>\");\n  document.write(\"<pA4: \" +\
    \ questions[i].answers[3] + \"</p>\");\n}\n</script>\n</body>\n```\n\n上方：`continue`\
    \ 和 `break` 语句分别允许跳过迭代或完全退出循环。\n\n## JAVASCRIPT 的函数与类\n\n## JAVASCRIPT 中的函数\n\n\
    函数是一组语句的集合，可以通过引用分配给函数的标识符来执行。它们是创建可重用代码块的关键，这些代码可以在需要时被调用。\n\n## 内置函数\n\nJavaScript\
    \ 语言中内置了许多函数——事实上，我们已经在使用其中一个：`alert()` 函数。当我们在脚本中使用函数名时，我们是在调用或触发该函数——这通过函数名后的括号来标识。通过使用这些括号，我们还可以向函数传递数据——称为参数（arguments）。\n\
    \n```javascript\nfunction(c,len(0-1)) {\n  console.log(\"#User_logged\" + \"click\"\
    ));\n  function() for (var a = p) {\n    for (var i = 0; i < a.length; i++) {\n\
    \      for (var j = 0; j < c.length; j++) {\n        if (a[i] == c[j]) {\n   \
    \       p.push(a[i]);\n        }\n      }\n    }\n  }\n  function(a, c) {\n  \
    \  for (var i = 0; i < b.length; i++) {\n      if (b[i] == a) {\n        array[i].push(b[i]);\n\
    \      }\n    }\n  }\n  for (var b = 0; b < array.length; b++) {\n    if (array[b].length\
    \ > 0) {\n      array[b].push(inp_array[b]);\n    }\n  }\n  array[b].reverse();\n\
    \  for (var b = 0; b < b.length; b++) {\n    b.splice(b, 1, \"\");\n  }\n}\n```\n\
    \n参数 (Arguments)\n\n参数是传递给函数的值。当调用函数时，我们在函数名后的括号内传递值。例如，在 `alert()` 函数中，我们需要传递一个字符串来显示。\n\
    \n"
