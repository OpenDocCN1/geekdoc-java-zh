    \n# 面向对象编程\n\n面向对象编程 – OOP 是一种将对象置于一切核心的编程方法。虽然 JavaScript 不是一种真正的 OOP 语言，因为它缺乏实现真正\
    \ OOP 所需的特定结构，但它可以以 OOP 风格使用。\n\n# 为什么要使用 OOP 技术？\n\n关于 OOP 与其他编程方法相比的优缺点，已经写了太多文字了，我们就不赘了。只需说明\
    \ OOP 最引人注目的特征之一是以与人类相同的方式组织事物。正如此，它是最广泛使用的编程方法。\n\n![](img/36c072bc9bbf881fd6b216dfe432.png)\n\
    \n上方：OOP 以与人类相同的方式组织代码。\n\n# 如何分类事物\n\n当我们思考物理世界中的一个事物时，该事物通常是某个同类家族的一部分；这个家族又是某个更大分组的一部分，以此类推。这些分组是我们思考的第一场所。例如，我们可以将一个事物分类为狗、家养的、哺乳动物、动物以及生物。这提供了一个像狗一样的分类链。该链中的每个点都定义了某些特征\
    \ – 例如动物腿的数量，或者狗毛的柔软程度。\n\n![](img/36c072bc9bbf881fd6b21dfe432.png)\n\n上方：通过分类事物，我们也定义了它们。\n\
    \n# OOP 中的类\n\nOOP 正利用了这种分类系统。我们编写类来定义属性 – 以及类的特征。类还定义了方法，这些是操作对象的函数。类继承其祖先类的属性和方法，以及它所属的分类特征。你在类中编写的代码是一个模板\
    \ – 它描述了定义对象的属性和方法。\n\n所有事物\n- habitat = land\n- numberOf = 4\n- hasFur = true\n\
    - isDomesticated = false\n- earStyle = \"floppy\"\n- colour = \"golden\"\n\n上方：在物理世界中，特征是被继承并成为事物定义的固有部分的\
    \ – 在 OOP 中也是如此。\n\n![](img/36c072bc9bbf881fd6b21dfe432.png)\n\n然而，这个类定义并不是类的对象\
    \ – 要创建一个对象，我们必须调用类的构造函数，因为它是从类生成对象的。生成的对象被称为类的实例，因此调用类的行为通常被称为实例化。\n\n# 一个宏大的课题\n\
    \nOOP 是一个非常深入的主题，我们不会探讨 – 如果你想探索，可以搜索“OOP”并从成千上万的结果中进行选择。不过我们要学会如何在 JavaScript\
    \ 中创建和使用基本类。\n\n![](img/36c072bc9bbf881fd6b21dfe432.png)\n\n# JavaScript 类\n\n\
    我们已经在处理 JavaScript 类 – `number`、`string` 和 `array` 都是内置类。它们从类继承某些特征 – 在 OOP 术语中，这使得其他类的超类。我们还在处理类方法；例如，`write`\
    \ 是 `HTMLDocument` 类的方法 – 我们使用了 `document.write()`。（`document` 是 `HTMLDocument`\
    \ 类的实例）。这些类内置在语言中，但我们也可以构建自己的。\n\n# 定义自定义类\n\n我们 Simple Quiz 中的问题目前定义在通用对象中 –\
    \ 让我们开发一个 `QuizQuestion` 类。\n\n- 1. 创建一个新的 JavaScript 文档并将其存在 Simple Quiz 的 `js`\
    \ 文件夹中，命名为 `QuizQuestion.js`。同时在 `simpleQuiz.html` 的 `<head>` 中创建一个 `<script>`\
    \ 元素并链接到这个新的 quiz。参见下方插图。\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n  <title>A\
    \ Simple Quiz</title>\n  <script type=\"text/javascript\" src=\"js/QuizQuestion.js\"\
    ></script>\n  <script type=\"text/javascript\" src=\"js/quizQuestions.js\"></script>\n\
    \  <script type=\"text/javascript\" src=\"js/functions.js\"></script>\n</head>\n\
    <body>\n  <script type=\"text/javascript\">\n  for(var i=0; i<com.flametreepublishing.questions.length;\
    \ i++) {\n    com.flametreepublishing.renderQuestionAtIndex(i);\n  }\n</script>\n\
    </body>\n</html>\n```\n\n上方：步骤 1 如图所示创建一个新的 JavaScript 文档。\n\n- 2. 在 `QuizQuestion.js`\
    \ 顶部添加我们的命名空间声明（参见第 217 页）。\n\n- 3. 我们将此类命名为 `QuizQuestion`，所以第一件事是定义构造函数 – 参见下方插图。构造函数与类同名。\n\
    \n```javascript\nvar com;\nif(!com) {\n  com = {};\n}\nif(!com.flametreepublishing)\
    \ {\n  com.flametreepublishing = {};\n}\ncom.flametreepublishing.QuizQuestion\
    \ = function(aQuestionNum, aQuestionText, aAnswers, aCorrectAnswerIndex) {\n\n\
    }\n```\n\n上方：步骤 3 如图所示定义构造函数。\n\n- 4. 如你所示，构造函数接受四个参数。这些对应于我们希望 `QuizQuestion`\
