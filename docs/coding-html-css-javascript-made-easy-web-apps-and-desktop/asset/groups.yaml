    ```\n\n**Above:** Step 9: Add the element to the page, as shown here.\n\n# EVENTS\n\
    \nWeb pages issue events in response to various conditions and user actions, such\
    \ as a page having loaded successfully, or the user clicking on something. Responding\
    \ to these events is one of JavaScript's key roles.\n\n# JAVASCRIPT EVENT MODELS\n\
    \nThere are a few different event models in JavaScript that have evolved over\
    \ the years. We don't have space to cover them all, so we'll focus on the current\
    \ best practice model, known as the W3C model. This isn't the simplest of the\
    \ models, but it's the one that you aim to use.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_239_0.png)\n\
    \n> Hot Tip\n> If you want to explore all of the JavaScript event models, an excellent\
    \ discussion of them can be found at www.quirkasmode.org/j/introevents.html\n\n\
    Left: Quirksmode.org/ is a fantastic resource for both new and experienced JavaScript\
    \ developers.\n\n# WHAT IS AN EVENT?\n\nAn event is a message issued by the browser.\
    \ An event always has a type – the type indicates the nature of the event – whether\
    \ it's a click, a page load, a key press and so on. For example, clicking on any\
    \ element in a page causes that element to send – or dispatch – an event of type\
