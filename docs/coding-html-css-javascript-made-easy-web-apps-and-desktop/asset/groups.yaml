    \ of the questions array.\n\nOnce the statement block has completed, the iteration\
    \ expression, i++, is evaluated, adding 1 to the index, and the condition is tested\
    \ once more. The process repeats until the condition evaluates to false.\n\n#\
    \ EXITING FROM A LOOP OR ITERATION\n\nWe can exit a loop at any time by using\
    \ the break keyword, causing script execution to resume at the first statement\
    \ following the loop. We can also exit from the current iteration of a loop using\
    \ continue, which instructs the interpreter to evaluate the iteration and condition\
    \ expressions immediately, and then continue looping if required.\n\n```\n<script\
    \ type=\"text/javascript\">\nfor(var i = 0; i < questions.length; i++) {\n  if(typeof\
