    \ into which other elements can be placed, and a logical structure for the different\
    \ types of information within a page. There are four more structural elements\
    \ in HTML5 that you will use regularly.\n</body>\n```\n\nAbove: Structural elements\
    \ provide a logical structure into which a page's content is written.\n\n# Site\
    \ Navigation\n\nMost websites include a site navigation menu to allow users to\
    \ move quickly and easily around the site; HTML5 provides the <nav> element to\
    \ contain the elements of the elements of such a navigation menu. The <nav> element\
