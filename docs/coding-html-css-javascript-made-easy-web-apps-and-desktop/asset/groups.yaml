    \  div {\n    position:absolute;\n    width:100px;\n    height:100px;\n    background-color:red;\n\
    \  }\n\n  #box {\n    left:200px;\n    top:200px;\n  }\n\n  #rotatedBox {\n  \
    \  left:400px;\n    top:200px;\n    transform:rotate(45deg);\n  }\n</style>\n\
    ```\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_103_0.png)\n\n**Left & Above:**\
