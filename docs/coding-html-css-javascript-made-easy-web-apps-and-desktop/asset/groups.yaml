  - '[PAGE 156]


    # THE PRIMITIVE DATA TYPES


    Let''s take a look at the primitive data types. Remember, variables of these types
    represent a single value.


    # Booleans


    Booleans represent a single bit of computer data and as such are simplest data
    type there is. A Boolean can have a value of either false or true, represented
    within the computer as 0 or 1 respectively.


    # Numbers


    Generally, in computing, there are two types of number: integers and floats. The
    former are whole numbers, and the latter are numbers that involve a fractional
    or exponential component, such as 3.14 or 0.945x10⁷. JavaScript doesn''t worry
    itself with such distinctions – a number is a number.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_156_0.png)'
  - '[PAGE 157]


    # Strings


    Strings are text data – don''t worry about why they''re called strings (it gets
    technical

    in ways we don''t need to worry about), just know that a string is text, and text
    is

    a string.


    When writing strings into scripts, they have to be

    surrounded by quotation marks. These can be single ''

    or double " quotes (we''ll be using the latter), but it''s

    vital that a string is closed by the same style of

    quotation mark that it was opened with.


    An empty string – a string with no characters in it – is

    normally written as a pair of quotation marks:


    " or "".


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_157_0.png)


    ```

    1 <!DOCTYPE HTML>

    2 <html>

    3 <head>

    4 <title>Using Quotes in Strings</title>

    5

    6 </head>

    7

    8 <body>

