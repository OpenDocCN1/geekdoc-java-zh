  - "[PAGE 104]\n\n# How Transitions Work\n\nWe already know how to use Pseudo-Class\
    \ selectors to make an <a> element respond to different states, such as :hover,\
    \ when the mouse pointer is over an element. What you may not realize that Pseudo-Class\
