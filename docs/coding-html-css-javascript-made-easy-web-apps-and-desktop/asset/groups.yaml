    15 } \n```\n\nAbove: Step 7: Update the condition expression and function call\
    \ as shown here.\n\n8. Save your work and open the page in Firefox — again, it\
    \ should look identical to previously, but underneath we have a pristine and unpolluted\
    \ namespace.\n\n# OBJECT ORIENTED PROGRAMMING\n\nObject oriented programming –\
    \ OOP is an approach to programming that places objects at the heart of everything.\
    \ While JavaScript is not a true OOP language, because it lacks specific constructs\
    \ that are requirements for true OOP, it can be – and normally is – used in an\
    \ OOP style.\n\n# WHY USE OOP TECHNIQUES?\n\nFar too many words have been written\
    \ by others about the relative merits and drawbacks of OOP compared to other approaches\
    \ to programming – and we're not going to add to them. Suffice it to say that\
    \ one of the most compelling features of OOP is that it organizes things in much\
    \ the same way as our human brains do. For this reason if no other, it is the\
    \ most widely used approach to programming.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_218_0.png)\n\
    \nAbove: OOP structures code in much the same way as humans thoughts.\n\n# HOW\
    \ CLASSFY THINGS\n\nWhen we think about a thing in the physical world, that thing\
    \ is normally part of a family of similar things; this family is in turn part\
    \ of a larger grouping, and so on. These groupings classify the thing we were\
    \ thinking about the first place.\n\nFor example, we could classify a thing as\
    \ a dog, as domesticated, as a mammal, as an animal, and as a living thing. This\
    \ gives a chain of classification that defines something dog-like. Each point\
    \ in that chain specifies characteristics that the definition – the number of\
    \ legs an animal has, or the smoothness of a dog’s fur.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_219_0.png)\n\
    \nAbove: By classifying things, we also define them.\n\n# CLASSES IN OOP\n\nOOP\
    \ harnesses exactly this system of hierarchical classification. We write classes\
    \ to define properties that describe the characteristics – and are intrinsic to\
    \ – the class. Classes also define methods, these being functions that operate\
    \ on objects of the class.\n\nA class inherits the properties and methods of its\
    \ ancestor classes, taking on aspects of their characteristics and classifications\
    \ it belongs to.\n\nThe code you write in a class is a template – it describes\
    \ the properties and methods that define objects of that class.\n\nAll things\n\
    - habitat = land\n- numberOf = 4\n- hasFur = true\n- isDomesticated = false\n\
    - earStyle = \"floppy\"\n- colour = \"golden\"\n\nAbove: In the physical world,\
    \ characteristics are inherited and become an intrinsic part of a thing's definition\
    \ – the same is true in OOP.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_220_0.png)\n\
    \nHowever, this class definition is not an object of that class – to create one\
    \ of those, we must call the class’s constructor function because it is what generates\
    \ an object from the class. The generated object is known as an instance of the\
    \ class, so the act of calling the class constructor is often referred as instantiating\
    \ the class.\n\n# A Massive Topic\n\nOOP is a very deep subject that we aren’t\
    \ going to delve into – if it’s something you want to explore, Google ‘OOP’ and\
    \ take your pick from the thousands of results. What we are going to do, though,\
    \ is find out how to create and use basic classes in JavaScript.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_221_0.png)\n\
    \n# JAVASCRIPT CLASSES\n\nWe've already been working with JavaScript classes –\
    \ number, string and array are all built-in classes. They all inherit some of\
    \ their characteristics from the class – in OOP parlance, this makes the object\
    \ superclass of those other classes. We've also been working with class methods;\
    \ for example, write is a method of the HTMLDocument class – we've used it as\
    \ document.write(). (document is an instance of the HTMLDocument class.) These\
    \ classes are built into the language, but we can also build our own.\n\n# Defining\
    \ a Custom Class\n\nThe questions in our Simple Quiz application are currently\
    \ defined in generic objects – let’s develop a QuizQuestion class instead.\n\n\
    - 1. Create a new JavaScript document and save it in your Simple Quiz's js folder\
    \ as QuizQuestion.js. Also create a <script> element in the <head> of simpleQuiz.html\
    \ and link it to this new quiz. See the illustration below.\n\n```html\n<!DOCTYPE\
    \ HTML>\n<html>\n<head>\n  <title>A Simple Quiz</title>\n  <script type=\"text/javascript\"\
    \ src=\"js/QuizQuestion.js\"></script>\n  <script type=\"text/javascript\" src=\"\
    js/quizQuestions.js\"></script>\n  <script type=\"text/javascript\" src=\"js/functions.js\"\
    ></script>\n</head>\n<body>\n  <script type=\"text/javascript\">\n  for(var i=0;\
    \ i<com.flametreepublishing.questions.length; i++) {\n    com.flametreepublishing.renderQuestionAtIndex(i);\n\
    \  }\n</script>\n</body>\n</html>\n```\n\nAbove: Step 1: Create a new JavaScript\
    \ document as shown here.\n\n- 2. Add our namespace declaration at the top of\
    \ QuizQuestion.js (see page 217).\n\n- 3. We're going to call this class QuizQuestion,\
    \ so the first thing to do is define the constructor function – see the illustration\
    \ below. The constructor function has the same name as the class.\n\n```javascript\n\
    var com;\nif(!com) {\n  com = {};\n}\nif(!com.flametreepublishing) {\n  com.flametreepublishing\
    \ = {};\n}\ncom.flametreepublishing.QuizQuestion = function(aQuestionNum, aQuestionText,\
    \ aAnswers, aCorrectAnswerIndex) {\n\n}\n```\n\nAbove: Step 3: Define the constructor\
    \ function as shown here.\n\n- 4. As you see, the constructor accepts four parameters.\
    \ These correspond to the properties we want QuizQuestion instances to have; we've\
    \ added a leading 'a' to the names so they are distinct from the similarly named\
    \ class properties.\n\n- 5. Add the code highlighted in the illustration above\
    \ to the body of the constructor.\n\n```javascript\ncom.flametreepublishing.QuizQuestion\
    \ = function(aQuestionNum, aQuestionText, aAnswers, aCorrectAnswerIndex) {\n \
    \ this.questionNum = aQuestionNum;\n  this.questionText = aQuestionText;\n  this.answers\
    \ = aAnswers;\n  this.correctAnswerIndex = aCorrectAnswerIndex;\n}\n```\n\nAbove:\
    \ Step 5: Add the code highlighted here.\n\nHere, we meet the this keyword for\
    \ the first time – see above.\n\n6. Save your work.\n"
  mdcn: "\n\n# 创建命名空间\n\n让我们为 Simple Quiz 项目中的对象创建一个命名空间。\n\n- 1. 在你的编辑器中打开 `quizQuestions.js`，并在文档顶部创建两个空行。\n\
    \n- 2. 我们将使用 `com.flametreepublishing` 作为我们的命名空间 – 这意味着我们需要在 `com` 对象内部创建一个名为全局命名空间的对象（global\
