  - '[PAGE 211]


    # VARIABLE SCOPE


    When a variable is declared outside of functions or statement blocks, it is available
    from anywhere in the web page, so so is known as a global variable. Another way
    of putting this is that the variable exists within the global scope.  Conversely,
    variables declared within a function are only accessible from within that function
    – they are said to be within the function''s scope.


    # The Scope Chain


    Scope is hierarchical – one scope is nested within another. For example, named
    functions always exist in the global scope. An expression can only access variables
    that are in the same scope as – or are further up the scope chain than – the expression.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_211_0.png)


    **Above:** Variable scope is hierarchical. A variable in one scope can''t access
    deeper-nested scopes.'
  - "[PAGE 212]\n\n# NAMESPACES\n\nWe create a lot of named objects – variables and\
    \ functions – in JavaScript, and the name of each should be unique within its\
    \ own scope. If it isn’t unique, a name clash occurs, and things go badly wrong.\n\
    \n# WHAT IS A NAMESPACE?\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_212_0.png)\n\
    \nNamespaces are not spaces or contexts in which a set of unique names can be\
    \ defined. Put another way, two names can be identical so long as they exist in\
    \ different namespaces. Namespaces are important because without them, we run\
    \ the risk of encountering name clashes.\n\n| NOUN |\n| **Dog:**\n A four-legged\
    \ domesticated animal often kept as a pet |\n\n| VERB |\n| **Dog:**\n To persistently\
    \ pursue or pester |\n\n| NOUN |\n| **Shoot:**\n A young branch stemming from\
    \ the main branch of a tree or plant |\n\n| VERB |\n| **Shoot:**\n The act of\
    \ firing a gun or cannon |\n\n| NOUN |\n| **Dope:**\n A stupid or indolent person\
    \ |\n\n| VERB |\n| **Dope:**\n To administer drugs |\n\n**Above:** We can think\
    \ of verbs and nouns as being examples of real-world namespaces – a name can appear\
    \ in both, yet remain distinct."
  - '[PAGE 213]


    # What is a Name Clash?


    A name clash occurs when a name given to an object in a page is used by another
    object within the same page. Any expression that uses this name may not get back
    the data it expects or requires, leading to hard-to-trace bugs and errors.


    # Pollution of the Global Namespace


    The name of every named function and every global variable exists within the global
    namespace. With large projects, this namespace can become cluttered with many
    different names. Having third-party scripts in a page can make matters considerably
    worse. The more polluted the global namespace becomes, the more likely that you
    will encounter name clashes.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_213_0.png)


    **Above:** The global namespace can become somewhat messy'
  - '[PAGE 214]


    # SIMULATING NAMESPACES IN JAVASCRIPT


    Unlike some languages, JavaScript does not have formal notation for creating namespaces.
    However, remember that everything in JavaScript is an object — an upshot of this
    is that we can create an object in the global namespace and then define all of
    our variables and functions within this object. Our names don''t pollute the global
    namespace, and if we choose the namespace object''s name wisely, we won''t end
    up using the same one as is used in other scripts.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_214_0.png)


    # Hot Tip


    The name of a named function exists in the global namespace. In contrast, anonymous
    functions can be assigned to an object property, thereby removing their identifiers
    from the global namespace.


    ```

    1 var myNamespace = {};n4 myNamespace.calculateRectArea = function(rectWidth,
    rectHeight) {

    5 return(rectWidth * rectHeight);

    }

    ```


    Above: Anonymous functions can be assigned to object properties so that they don''t
    pollute the global namespace.'
  - '[PAGE 215]


    # Choosing a Name for a Namespace


    Given that a namespace''s name has to exist in the global namespace, it is entirely
    possible to get a name clash with another namespace''s name. The trick to avoiding
    this is to choose a name that nobody else is likely to be using. How do you do
    this? Easy – base the namespace name on your website''s domain name. Typically,
    we reverse the name, so if your domain name is mydomain.com, you could then extend
    this further with a per-application and/or per-module name – for example, com.mydomain.myapplication.


    > Hot Tip

    It is important to understand that a namespace does not refer to a page or web
    resource – it’s just a name.


    Global scope namespace

    Global identifiers and named functions

    com.mydomain

    Identifiers that refer to the functions and values used by your scripts

    com.otherdomain

    Identifers that refer to the functions and values defined by 3rd party scripts
    that are attached to your page. They have their own namespace so they won''t clash
    with your names.


    **Above.** JavaScript simulates namespaces using objects. Reversing your domain
    name is the best way to ensure your names don''t clash with others.'
