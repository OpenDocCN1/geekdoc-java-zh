  - '[PAGE 174]


    # EXPRESSIONS AND OPERATORS


    The instructions you write in scripts are made up of expressions. Typically, expressions
    use operators to manipulate data in some way.


    # WHAT IS AN EXPRESSION?


    An expression is any segment of code that the interpreter can evaluate, typically
    yielding a value. A grandiose description belies how simple the concept is – consider
    the following: 42. Strictly speaking, as well as being a literal, this is also
    an expression – the interpreter can evaluate it, yielding the decimal value 42.
    Admittedly, it isn''t much of an expression – it''s the scripting equivalent of
    walking up to a colleague and saying "42"; she will understand that you''ve stated
    a value, but she won''t have a clue what you expect her to do with it.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_174_0.png)


    ```

    1 42

    2

    3 "Hello World"

    4

    5 true

    6

    7 null

    8

    9

    10

    ```


    Left: The interpreter can evaluate all of these expressions; they''re pretty pointless
    though.'
