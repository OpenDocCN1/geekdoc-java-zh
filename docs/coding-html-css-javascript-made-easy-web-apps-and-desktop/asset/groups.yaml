    \ transition; we define it within a Pseudo-Class selector's style rule.\n\nFor\
    \ example, if we had an element with an id of \"homeButton\", then we could target\
    \ a specific style rule at this button when the mouse is over it using an ID selector.\
    \ We would then define the transition within the style rule (see illustration).\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_104_0.png)\n\n```\n#homeButton:hover\
