    ## STATEMENTS\n\nAt the top level of JavaScript’s anatomy, we find the statement.\n\
    All JavaScript instructions are contained within statements.\n\n## WHAT IS A STATEMENT?\n\
    \nA JavaScript statement encapsulates one or more expressions, and can be thought\
    \ of as a discrete step or instruction within a script. Each statement in a script\
    \ is executed in its entirety before the next statement is processed.\n\n### Making\
    \ a Statement\nConsider the following simple expression: playerScore = 0;. While\
    \ this is an expression, it is also a statement, as indicated by the terminating\
    \ semicolon ;. A statement need not be any more complex than this, but they are\
    \ often.\n\n```\nExpression\nplayerScore = 0;\nstatement\n```\n\n```\nExpression\n\
    document.write(\"Your score is \" + playerScore);\nstatement\n```\n\nAbove: Statements\
    \ comprise one or more expressions\n\n## Compound Expressions\n\nWe often build\
    \ up quite complicated stacks of expressions within a statement, for example:\
    \ document.getElementsByTagName(\"body\")[0].appendChild(document.createElement(\"\
    p\")).innerHTML = \"Hello World!\";\n\nThis statement illustrates how expressions\
    \ can be combined. It uses DOM programming techniques, introduced on page 109,\
    \ to achieve the same outcome as the first script we wrote.\n\n| Expression |\n\
    | --- |\n| Expression |\n| Expression |\n| Expression |\n| Expression | Expression\
    \ |\n| Expression | Expression |\n\n```\ndocument.getElementsByTagName(\"body\"\
    )[0].appendChild(document.createElement(\"p\")).innerHTML = \"Hello World!\";\n\
    ```\n\n**Above:** Statements are often built out of compound expressions.\n\n\
    ## Balancing Complexity Against Legibility\n\nIt's important to understand that\
    \ lengthy and convoluted statements, such as the one above, can quite easily be\
    \ broken down into a series of shorter, simpler statements.\n\n> Hot Tip\n> Complex\
    \ statements like the one on this page are usually much easier to write than to\
    \ read. In fact, once you've got the hang of JavaScript, you'll probably find\
    \ writing them to be curiously satisfying – even artistic.\n\n## 186 CODING HTML\
    \ • CSS • JAVASCRIPT MADE EASY\n\nAll we do is distribute the expressions among\
    \ more statements. However, in order to share the results of the expressions in\
    \ one statement with another, we would need to store the result of each statement\
    \ in a variable, so that the other statements have access to those values.\n\n\
    ## Balancing Speed Against Legibility\n\nCreating and managing variables adds\
    \ to the interpreter’s workload, so complex multiple expressions are generally\
    \ executed more quickly than the same expressions broken down into multiple statements.\
    \ While choosing how simple – or complex – to make your statements is largely\
    \ down to personal preference, you do need to think about how performance-critical\
    \ the application is.\n\n```\n8  <script type=\"text/javascript\">\n9    //This\
    \ compound statement...\n10  document.getElementsByTagName(\"body\")[0].appendChild(document.createElement(\"\
    p\")).inn\n11  //...does the same as the following set of statements\n12  var\
    \ bodyElementsArray = document.getElementsByTagName(\"body\");\n13  var bodyElement\
    \ = bodyElementsArray[0]; //Remember, there is only one body element\n14  var\
    \ newPara = document.createElement(\"p\");\n15  newPara.innerHTML = \"Hello World!\"\
    ;\n16  bodyElement.appendChild(newPara);\n17\n18  </script>\n```\n\n**Above:**\
    \ Complex statements can be broken down into separate statements - or not\n\n\
    - 1: Decide how many cups of tea to make - call this number C\n- 2: Lift kettle\
    \ off base\n- 3: Fill the kettle with enough water for C cups of tea\n- 4: Add\
    \ an extra half cup of water to allow for water lost as vapour\n- 5: Place kettle\
