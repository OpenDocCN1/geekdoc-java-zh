    # Accessing Array Elements


    Each element in an array has an index, this being a number that refers to the
    position of the element within the array. The first element has an index of 0,
    the second an index of 1 and so on. To access a specific element of an array,
    we write the variable''s name followed by the index number wrapped in square brackets.
    For example, if we want to use the third element (index 2) of the myArray we write
    myArray[2].


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_160_0.png)


    # Adding Elements to an Array


    We can also assign values to elements of an array using square brackets. For example,
    to set the eighth element (index 7) of the array myArray we could type myArray[7]
    = 19. If the eighth element already contains data, it is overwritten with the
    new value. Or, if the array''s length is less than 8, the new element is created,
    as any empty elements required to pad between the last element of the unmodified
    array and the newly added element.


    ```

    <body>

    <script type="text/javascript">

    var Names = new Array("Helen", "Amrit", "Geoff", "Jacques");

    var userLogins = new Array();

    //Get array element values...

    alert(userLogins[0]); //displays ''Helen'' in the alert dialog

    alert(userLogins[3]); //displays ''Jacques'' in the alert dialog

    //Set array element values...

    userLogins[0] = ["Amrit", "Monday\]; //Assign array to 1st element of userLogins

    userLogins[2] = ["Helen", "Tuesday\]; //Assign array to 3rd element of userLogins

    //Get undeclared array element...

    alert(userLogins[1]); //displays undefined in the alert dialog, I.E. the element

    exists - it was created for but it had not had a

    value assigned to it

    </script>

    </body>

    ```


    Above: We can access array elements, for both getting and setting a value, using
    bracket notation.'
