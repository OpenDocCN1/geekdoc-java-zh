  - '[PAGE 108]


    # HTML AND JAVASCRIPT


    We already know that HTML creates the structure for a page and defines its content,
    and that CSS controls the visual look of that content. Scripting completes this
    picture by providing the means to control the behaviour of your page, and how
    it reacts to user interaction. There are various scripting languages for the web
    – built into the main web browsers – is JavaScript.


    # WHERE DOES JAVASCRIPT FIT?


    Earlier we used the analogy of a house to HTML and CSS, the former being the bricks
    and mortar, and the latter being the decoration and finish. If we stick with this
    analogy, JavaScript (or JS for short) should be a master home control system that
    can control every aspect of the house intricately.


    Right: JavaScript is the most common scripting language used in web pages.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_108_0.png)'
  - "[PAGE 109]\n\n# Adding a Script\n\nThe intricacies of JavaScript are explored\
    \ in the later chapters of this book, but let's take a quick look at how you add\
    \ a script to a page, to get us started. For a more detailed look at this see\
    \ page 142.\n\n# The <script> Element\n\nLike CSS, a script can be embedded into\
    \ your page or be external to your page. The latter is the more common approach,\
    \ but both are achieved via the <script> element: an embedded script is written\
    \ between the opening and closing <script> tags; an external script is located\
    \ in a separate text file and is linked to a page via the src attribute of the\
