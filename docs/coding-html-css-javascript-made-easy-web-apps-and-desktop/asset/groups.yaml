    \ rule would go.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_10_0.png)\n\nIn addition\
    \ to the more substantial step-by-steps, there is a collection of Hot Tip guides.\
    \ These offer quick, handy hints as well as advice to add flourishes to the final\
    \ website.\n\n# THE FORMATION OF JAVASCRIPT\n\nThe JavaScript language has been\
    \ with us since the very earliest days of the World Wide Web. In its early days\
    \ it was merely one face in a crowd, one of many languages and technologies vying\
    \ for the attention and evangelism of the web development community.\n\n# UNIVERSAL\
    \ LANGUAGE\n\nOver the years, many such technologies have come into fashion before\
    \ falling from grace for one reason or another, but not so with JavaScript. Thanks\
    \ largely to a combination of flexibility and ubiquitness, JavaScript is now the\
    \ principal scripting language of the internet.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_11_0.png)\n\
