    ## JAVASCRIPT, HTML AND CSS


    There are three core languages used to develop web pages: HTML provides the underlying
    structure and content; CSS provides the visual scenery; while JavaScript..? Well,
    JavaScript provides the magic that brings the whole thing to life.


    ## BEFORE WE START


    This chapter and the proceeding chapters are concerned solely with JavaScript,
    yet the language is deeply tied to web browsers and web pages that it is impossible
    to discuss it without relying heavily on prior knowledge of HTML and CSS. If you
    already have such knowledge, or if you''re a bit rusty on the subjects, it is
    in your best interest to read the chapters in this book on HTML and CSS.


    > Hot Tip If, in the context of HTML and CSS, you understand the meaning of terms
    such as element, attribute, opening and closing tags, selectors and style rules,
    you''re good to go with JavaScript.


    Right: If you didn''t start at the beginning, previous chapters of this book will
    help you to understand JavaScript.


    ## BROWSER COMPATIBILITY


    While the core JavaScript language is fully supported across all major browsers,
    problems can arise when using advanced or esoteric functions, because not all
    browsers support all of JavaScript''s extended functionality. There are ways and
    means to work around such issues, but unfortunately, there isn''t room to cover
    them here.


    > ### See page 13 to find out how to download completed versions of all the book''s
    code examples. They include additional notes that help to further explain the
    examples.


    ## Firefox


    All of the examples in this book use standard JavaScript programming techniques
    and constructs. However, in order to sidestep any tiresome browser compatibility
    issues, we''ll be using the Firefox browser for running all examples, and encourage
    you to do the same.


    Above: Mozilla Firefox is one of the most standard-compliant web browsers currently
    available and is free to install and use. You can download it from mozilla.org.


    ## WHAT IS JAVASCRIPT?


    JavaScript is a scripting language used to interact with and control pages loaded
    into a web browser. It provides a rich palette of functionality for interacting
    with the user, the page and the internet.


    ## WHAT IS A SCRIPT?


    In the theatre world, a script can be thought of as a series of instructions that
    tell the actors where to be, what to do and when to do and say it. In computing,
    the meaning is very similar: a script is a series of instructions for the computer
    to perform. Yes, the actors are onscreen graphics and chunks of data rather than
    a troupe of thespians, but the principle remains the same.


    A script tells the actors where to be, what to do and when to do it — the actors
    being computer data and graphics, of course.


    ## JAVASCRIPT RUNS ON THE CLIENT SIDE


    It’s important to understand from the get-go that when using JavaScript in a web
    page, it runs on the user’s – or client’s – computer and interacts with a copy
    of the web page that is loaded into a web browser on that computer. This is often
    referred to as ''client-side'' scripting.


    ## Java and JavaScript


    You may have heard of a language called Java, and think that it somehow relates
    to JavaScript – it doesn’t. Java was a hot topic at the time JavaScript was developed,
    and by calling the language JavaScript, its developers ensured that it got noticed.
    Other than a passing similarity in their syntax though, the two languages are
    fundamentally different and unrelated.


    Above: JavaScript interacts directly with the page impression that’s loaded into
    the user’s browser.


    ## WHY INCLUDE SCRIPTS IN A PAGE?


    There are almost as many reasons for using scripting in a page as there are pages
    that use scripting. In general though, there are two key reasons for using scripts:
    to modify the appearance of a page; and/or to allow communication between a page
    and a web server.


    ## VISUAL CHANGES


    Some of the most common – certainly the most obvious – scripts modify the appearance
    of a page based upon conditions that weren''t known when the page was authored.
    A condition could be as simple as the time of day or the position of the user''s
    mouse pointer, or it could be very complex. The point is that using JavaScript,
    we can determine whether a certain condition has been met and then take action
    in response to that condition.


    Right: Search engines use scripting to display possible search results as you
    type.


    ## MEET JAVASCRIPT


    Above: JavaScript interacts directly with the page impression that’s loaded into
    the user’s browser.


    ## COMMUNICATIONS


    There are many scenarios in which a script can communicate with a server. For
    instance, a script can fetch data from a server or send data to a server. This
    allows for dynamic content that can change without needing to reload the entire
    page.


    Above: JavaScript provides many features for the developer.


    ## WRITING JAVCRIPT


    It is common to link a script to a page. To do this, the script is written in
    a separate text file and saved with a .js filename.


    ## IDEs


    - Line numbering: Helps us navigate within a large script

    - Code folding: Avoid distraction blocks of code you are working on

    - Code hinting: Shows a context-sensitive list of functions, methods and properties
    as you type

    - Built-in reference information: Some IDEs include reference information

    - File management: Built-in file management features are invaluable with larger
    projects

