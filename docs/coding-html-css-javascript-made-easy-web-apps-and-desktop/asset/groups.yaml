    \ it is the perfect language to use for learning about coding in general. This\
    \ book is aimed at people who are quite new to writing code and programming. You\
    \ may be completely new to HTML, CSS and JavaScript; you may have spent some time\
    \ with HTML and CSS.\n\n# AN INTRODUCTION TO HTML\n\nHTML is the most important\
    \ component for building websites. But what is it and what does it do?\n\n# WHAT\
    \ IS HTML?\n\nHTML or HyperText Language is the framework upon which all websites\
    \ are built. If a website were a house, HTML would be the bricks and mortar.\n\
    \n# WHAT IS HTML?\n\nHTML consists of elements, each of which has a specific use.\
    \ For example, the video element is used to place a video on the page. When your\
    \ choices of elements are put together in a suitable order\n\n- HTML is a collection\
    \ of elements\n- These elements are demarked by tags\n- Each element has a name\
    \ - it is included in the tag\n- Whatever appears between the opening and closing\
    \ tags is the content of the element\n\n# WHAT DOES HTML LOOK LIKE?\n\nHTML is\
    \ nothing more than plain text. If we were creating the aforementioned element\
    \ we would write an opening tag. <video>, and a matching closing tag. </video>.\
    \ As you can see, the opening tag starts with '<', states the element name, and\
    \ finishes with '>'. The closing tag follows the same pattern, but we insert a\
    \ '/' before the element name. When a web browser encounters it it creates a video\
    \ player on the page. Simple, huh?\n\n# WHAT S INSIDE AN ELEMENT\n\nSo, what goes\
    \ between those tags? In most circumstances the answer is text and/or other elements.\
    \ This means that HTML has a nested structure of elements within elements. Incidentally,\
    \ many developers indent lines of code to reflect this nesting.\n\n```html\n<!DOCTYPE\
