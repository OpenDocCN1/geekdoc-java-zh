    \ 240 页的“事件”中讨论这一点。\n\n## 匿名函数\n\n在 JavaScript 中，函数只是另一种数据形式。这意味着你可以创建一个函数并将其赋值给变量或对象属性。此类函数被称为匿名函数，因为它们没有函数名。\n\
    \n## 声明匿名函数\n\n我们通过将函数字面量赋值给变量或对象属性来声明匿名函数。其通用形式如下：\n\n```javascript\nvar myAnonymousFunction\
    \ = function(parameter(s)) {\n    statement(s);\n}\n```\n\n## 调用匿名函数\n\n调用匿名函数与调用命名函数没有区别；我们只是使用变量名或属性引用，而不是函数名。从任何角度来看，这等同于调用命名函数。\n\
    \n```javascript\n1 //这是一个命名函数...\n2 function calculateRectArea(rectWidth, rectHeight)\
    \ {\n3 return(rectWidth * rectHeight);\n4 }\n6 //这是一个匿名函数...\n7 var calculateRectHypotenuse\
    \ = function(rectWidth, rectHeight) {\n8 var widthSquared = rectWidth * rectWidth;\n\
    9 var heightSquared = rectHeight * rectHeight;\n10 return(Math.sqrt(widthSquared\
    \ + heightSquared)); //Math.sqrt() 计算平方根\n11 }\n13 //对这两个函数的调用形式形式相同：\n14 var\
    \ myRectArea = calculateRectArea(49, 28);\n15 var myRectHypotenuse = calculateRectHypotenuse(49,\
    \ 28);\n```\n\n上方：命名函数和匿名函数的调用方式相同。\n\n## 变量作用域\n\n当变量在函数或语句块之外声明时，它在网页的任何地方都可用，因此被称为全局变量。另一种说法是该变量存在全局作用域中。相反，在函数内部声明的变量只能从函数内部访问——它们处于函数的作用域内。\n\
    \n## 作用域链\n\n作用域是层级的——一个作用域嵌套另一个作用域之中。例如，命名函数始终存在于全局作用域中。表达式只能访问与其处于同一作用域或处于作用域链更高处的变量。\n\
    \n**上方：**变量作用域是层级的。一个作用域中的变量无法访问更深层嵌套的作用域。\n\n## 命名空间\n\n我们在 JavaScript 中创建了许多命名对象——变量和函数，每个名称在它自己的作用域内应该是唯一的。如果不唯一，就会发生名称冲突，导致问题变得非常糟糕。\n\
    \n## 什么是命名空间？\n\n命名空间是我们定义名称以避免冲突的上下文。\n\n| 名词 | 示例 |\n| :--- | :--- |\n| 一只狗\
    \ | Dog |\n| 一棵树 | Shoot |\n| 一个人 | Dope |\n| 一个动作 | Shoot |\n| 一种药物 | Dope |\n\
    \n**上方：**命名空间很重要，因为没有它们，我们就会遇到问题。\n\n## 什么是名称冲突？\n\n当名称被页面上的另一个对象使用时，就会发生名称冲突。\n\
    \n## 全局命名空间的污染\n\n每个命名函数的名称都存在于全局命名空间中。在大型项目中，这个命名空间会变得充斥名称。\n\n**上方：**全局命名空间可能会变得混乱。\n\
    \n## 在 JavaScript 中模拟命名空间\n\n与某些语言不同，JavaScript 没有创建命名空间的正式符号。但是，请记住 JavaScript\
    \ 中的一切皆都是对象——我们可以在全局命名空间中创建一个对象，然后在该对象内定义所有的变量。我们的名称不会污染全局命名空间，如果我们明智地选择命名对象的名称，就不会与其他脚本使用相同的名称。\n\
    \n## 提示\n\n命名函数的名称存在于全局命名空间中。相比之下，匿名函数可以赋值给对象属性，从而从全局命名空间中移除它们的标识符。\n\n```javascript\n\
    var myNamespace = {};\nmyNamespace.calculateRectArea = function(rectWidth, rectHeight)\
    \ {\n  return(rectWidth * rectHeight);\n}\n```\n\n上方：匿名函数可以赋值给对象属性，以便不污染全局命名空间。\n\
    \n## 为命名空间命名\n\n鉴于命名空间的名称必须存在于全局命名空间中，完全有可能与其他命名空间的名称发生名称冲突。避免这种冲突的技巧是选择一个别人不太可能使用的名称。如何做到这一点？简单——基于你的网站域名来创建命名空间名称。通常，我们会反转名称，所以如果你的域名是\
    \ mydomain.com，你还可以进一步扩展每个应用程序和/或每个模块的名称——例如，com.mydomain.myapplication。\n\n>\
    \ 提示\n> 重要的是理解命名空间并不指向页面或网络资源——它只是一个名称。\n\n- 全局作用域命名空间：全局标识符和命名函数\n- com.mydomain：指向你的脚本所使用的函数和值的标识符\n\
    - com.otherdomain：指向附加到你页面上的第三方脚本定义的函数和值的标识符。它们有自己的命名空间，因此不会与你的名称冲突。\n\n"
