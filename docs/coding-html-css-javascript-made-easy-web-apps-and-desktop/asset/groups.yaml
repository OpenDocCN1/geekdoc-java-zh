  mdcn: "\n\n## 创建简单动画\n\n- 1. 创建一个新的 HTML 文档，添加基础结构元素（`<html>`、`<head>` 和 `<body>`），并在\
    \ `<head>` 中创建一个 `<style>` 元素。将文件保存为 movingbox.html。\n- 2. 在 `<body>` 中添加一个 `<div>`\
    \ 并赋予其 id 为 'boxToMove'。在 `<style>` 元素中创建一个 ID 选择器，并定义一个样式规则，将 `<div>` 的大小设置为\
    \ 100 x 100 像素，并赋予它背景颜色，以便我们在屏幕上看到它。\n- 3. 我们现在向样式规则中添加动画代码。从插图中复制样式属性并定义值；样式属性名是自言自明的。\n\
    \n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<title>CSS Animation</title>\n<style>\n\
    </style>\n</head>\n<body>\n\n</body>\n</html>\n```\n\n第 1 步：创建一个名为 movingbox.html\
    \ 的基础文档文件。\n\n```\n<style>\n#boxToMove {\nposition:relative;\nwidth:100px;\nheight:100px;\n\
    background-color:red;\nanimation-name:boxMover;\nanimation-duration:3s;\nanimation-iteration-count:infinite;\n\
    }\n</style>\n```\n\n> 提示：并不是所有浏览器都支持关键帧动画——如果在你的地方不起作用，请尝试在 Firefox 中打开页面。\n\n\
    第 2 和第 3 步：样式规则定义了移动框 `<div>` 的外观及其动画属性。\n\n4. 拼图的最后一部分是关键帧代码。它是以我们尚未研究过的方式声明的，使用了\
    \ CSS '@' 声明，在此情况下为 `@keyframes`。之后是动画的名称，与 `animation-name` 样式属性中声明的相同。\n\n```\n\
    <style>\n#boxToMove {\n  position:relative;\n  width:100px;\n  height:100px;\n\
    \  background-color:red;\n  animation-name:boxMover;\n  animation-duration:3s;\n\
    \  animation-iteration-count:infinite;\n}\n\n@keyframes boxMover {\n  0% {top:0px};\n\
    \  25% {top:100px};\n  75% {top:50px};\n  100% {top:150px};\n}\n```\n\n第 4 和第\
    \ 5 步：`@keyframes` 声明后的代码定义了哪些样式属性将被动画化以及它们在不同时间点取什么值。\n\n5. 跟在 `@keyframes` 声明之后的代码定义了相对于不同时间点（以百分比表示）的样式属性和值。我们使用的顶部样式属性决定了动画元素顶部与其容器块（在本例中为\
    \ `<body>` 元素）之间的距离。\n\n6. 保存你的工作并在浏览器中打开文件以查看结果。\n\n## HTML 和 JAVASCRIPT\n\n\
    我们已经知道 HTML 创建了页面的结构并定义了其内容，CSS 控制这些内容的视觉外观。脚本通过提供控制页面行为以及页面如何响应用户交互的方法来完善这幅图景。Web\
    \ 上有多种脚本语言——内置在主要网络浏览器中 JavaScript JavaScript。\n\n## JAVASCRIPT 位于什么位置？\n\n早些我们把\
    \ HTML 和 CSS 比作房子，前者是砖块和水泥，后者是装饰和精装修。如果我们坚持这个比喻，JavaScript（或简称为 JS）应该是一个主主家居控制系统，可以精细地控制房子的每一个方面。\n\
    \n正确：JavaScript 是网页中最常用的脚本语言。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_108_0.png)\n\
    \n## 添加脚本\n\nJavaScript 的复杂性将在本书的后续章节中进行探讨，但让我们快速看看如何向页面添加脚本以开始。如需更详细的查看，请参阅第\
    \ 142 页。\n\n## <script> 元素\n\n像 CSS 一样，脚本可以嵌入你的页面中，也可以位于页面外部。后者是更常见的方法，但都通过 `<script>`\
    \ 元素实现：嵌入脚本写在起始 `<script>` 和结束 `<script>` 标签之间；外部脚本位于单独的文本文件中并通过 `<script>` 元素的\
    \ `src` 属性链接到页面。\n\n如下：像 CSS 一样，脚本可以是嵌入或外部的。\n\n```\n<head>\n<title>Script Elements</title>\n\
    <!-- 这是一个外部脚本... -->\n<script type=\"javascript\" src=\"js/siteCore.js\"></script>\n\
    <!-- 这是一个嵌入脚本... -->\n<script type=\"text/javascript\">\n  var com;\n  if(!com)\
    \ {\n    com = {};\n  }\n  if(com.umasdvd) {\n    com.umasdvd.resetContactForm\
    \ = function() {\n      document.getElementById(\"messageTitle\").setAttribute(\"\
    value\", \"\");\n      document.getElementById(\"messageTitleMessage\").textContent\
    \ = \"\";\n      document.getElementById(\"senderAddress\").setAttribute(\"value\"\
    , \"\");\n      document.getElementById(\"senderMessage\").textContent = \"\"\
    ;\n      document.getElementById(\"messageBody\").textContent = \"\";\n      document.getElementById(\"\
    messageBodyMessage\").textContent = \"\";\n    }\n  }\n</script>\n</head>\n```\n\
    \n## 图像、视频与增强\n\n执行在：`<script>` 元素可以出现在 Web 页面的任何位置，并执行——也就是说，当浏览器遇到它时运行（见第 143\
    \ 页）。通常，需要输出的脚本定义在 `<head>` 中。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_110_0.png)\n\
    \n## 良好的理解\n\n深入理解 JavaScript 让你能够超越 HTML 和 CSS 的局限。在本书的后续章节中探索 JavaScript，为你学习这门迷人的语言提供一个极佳的起点。\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_111.png)\n\n正如我们所学的，HTML 不仅仅是纯文本；如果我们想在像\
    \ `<p>` 这样的文本元素中使用其中某些特殊字符，将会导致错误。例如，某些字符在 HTML 中具有预定义的含义（如所有的）。\n\n## ASCII 和扩展字符\n\
    \n计算中使用的核心字符集被称为 ASCII（美国标准信息交换）。该标准定义了 128 个字符代码。落在 ASCII 标准之外的字符（如带重音的字母）被称为扩展字符。在内部，计算机用给定的字母、数字、标点符号或符号来表示一切。\n\
    \n| ASCII 控制字符 | ASCII 可打印字符 |\n|---|---|\n| 00 NULL (空字符) | 32 space |\n| 01\
