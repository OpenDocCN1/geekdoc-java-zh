    CHARACTER ENTITIES

    The solution to both of these scenarios is something called character entities.
    To use these you type a special little bit of code into the HTML text which, when
    rendered, will be displayed as the desired character. All special characters and
    many extended characters have their own dedicated character entity.


    # How to Write a Character Entity


    Character entities consist of an ampersand ''&'' followed by an entity name, such
    as ''quot'', and are rounded off with a semicolon ''; To create a quote character,
    we type &quot; rather than typing an actual quote mark. Interestingly, because
    an ampersand is itself a character, you have to write &amp; to make one in the
    rendered text of your page.


    ```

    <body><header><h1>Special Characters</h1></header><section><p>&quot;There are
    many special characters in HTML&quot; said the man. &quot;Characters such as &lt;&amp;
    &gt; can not be typed directly into the text of an HTML document&quot; he said.</p><p>He
    went to explain that the same was true of &quot;extended&quot; characters such
    as &copy;, &micro; and many more. Accented latin characters, such as &Acute; &Egrave;
    are also classed as extended characters, he explained.</p></section></body>

    ```


    **Above:** All special and many extended characters are represented by character
    entities'
