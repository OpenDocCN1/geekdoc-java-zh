    # KEYWORDS AND RESERVED WORDS


    JavaScript defines a set of predefined identifiers, called **keywords**, as well
    as other identifiers that may be


    incorporated into the language into the future. Collectively, these are known
    as **reserved words**, and you must not use these as names for your own identifiers
    (nor as property names within objects).


    | KEYWORDS |

