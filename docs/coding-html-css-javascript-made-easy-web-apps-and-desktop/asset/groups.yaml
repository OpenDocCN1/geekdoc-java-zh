    \ (确认) | 38 & 70 F |\n| 07 BEL (铃声) | 39 ) 71 G |\n| 08 BS (退格) | 40 ( 72 H |\n\
    | 09 HT (水平制表) | 41 ) 73 I |\n| 10 LF (换行) | 42 * 74 J |\n| 11 VT (垂直制表) | 43\
    \ + 75 K |\n| 12 FF (换页) | 44 , 76 L |\n| 13 CR (回车) | 45 . 77 M |\n| 14 SO (移出)\
    \ | 46 / 78 N |\n| 15 SI (移入) | 47 ; 79 O |\n| 16 DLE (数据链路转义) | 48 0 80 P |\n\
    | 17 DC1 (设备控制 1) | 49 1 81 Q |\n| 18 DC2 (设备控制 2) | 50 2 82 R |\n| 19 DC3 (设备控制\
    \ 3) | 51 3 83 S |\n| 20 DC4 (设备控制 4) | 52 4 84 T |\n| 21 NAK (否定确认) | 53 5 85\
    \ U |\n| 22 ETB (传输块结束) | 54 6 86 V |\n| 23 CAN (取消) | 55 7 87 W |\n| 24 EM (结束)\
    \ | 56 8 88 X |\n| 25 SUB (替换) | 57 9 89 Y |\n| 26 ESC (转义) | 58 : 90 Z |\n| 27\
