    \ 语句。\n\n## 循环语句\n\n我们经常需要对一组不同的值运行同一组语句，或者重复执行语句某些次数——这就是循环大显用场的地方。\n\n## while\
    \ 循环\n\n最简单的循环语句被称为 `while` 循环。它的通用格式是：\n\n```\nwhile(condition) {\n  statement(s);\n\
    }\n```\n\n如果条件求为真，则执行条件后代码块中的语句，然后再次测试条件。如果仍然为真，则重复该过程。这会持续到条件求为假为止。\n\n> 小贴士\n\
    > 注意：如果你编写循环时不不当，可能会触发无限循环，导致解释器卡住。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_194_0.png)\n\
    \n## do while 循环\n\n这些循环与 `while` 循环非常相似，区别是在语句块之后评估条件。如果条件求为真，则重复语句块。它的样子如下：\n\
