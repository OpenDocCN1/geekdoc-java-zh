    # IMAGES, VIDEO & OTHER ENHANCEMENTS


    Execute on Sight

    A<script> element can appear anywhere within a web page, and is executed – in
    other words, run – when the browser encounters it (see page 143). Typically, then,
    scripts that have to be available to the whole page are defined in the <head>,
    whereas scripts that create an output to the page whilst the page is being rendered
    are positioned at the location that the output is required.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_110_0.png)


    # A GOOD UNDERSTANDING


    A thorough understanding of JavaScript allows you to take your site well beyond
    the limitations of HTML and CSS, turning your pages into bona web applications,
    but it''s a deep subject with a lot to learn. In later chapters of this book (see
    page 134) explore JavaScript, providing you with an excellent place to start learning
    about this fascinating and complex language.


