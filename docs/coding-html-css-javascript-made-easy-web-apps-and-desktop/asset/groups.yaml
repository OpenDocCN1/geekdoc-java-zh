    \ {\n    theResult = true;\n  } else {\n    theResult = false;\n  }\n  return(theResult);\n\
    }\n```\n\n**上方：** 步骤 2：按所示插入方法定义。\n\n- 2. 在构造函数下方创建两个空行，并输入上一页插图中所示的 `checkUserAnswer`\
