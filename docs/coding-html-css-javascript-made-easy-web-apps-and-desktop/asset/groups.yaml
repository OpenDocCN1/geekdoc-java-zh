    # WordPress.org


    You can install WordPress on your own website.

    Often it is provided as an option by your web server

    host; all you need to do is switch it on from your server

    control panel. Alternatively, the software can also be

    downloaded from www.wordpress.org if it''s not offered

    pre-installed by your host. Then you can use WordPress to

    create blog pages or indeed, to restore your entire site.

    documentation is available at www.wordpress.org.


