    \n```\nplayerScore = 0;\nvar playerName = 'Sarah';\nvarAge = 29;\n```\n\n语句块\n\
    \n## 条件语句 (CONDITIONAL STATEMENTS)\n\n我们经常需要根据条件执行不同的语句。\n\n## IF 语句\n\n当解释器遇到\
