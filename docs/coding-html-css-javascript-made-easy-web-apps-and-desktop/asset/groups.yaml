- md: "\n# ADDING VIDEO\n\nVideo is a medium that is very commonplace in web pages\
    \ and websites. They are attention-grabbing and are much more engaging than a\
    \ static image. Users want to watch video, and a ten-second video clip can impart\
    \ far more information than an image and text occupying the same space.\n\n# VIDEO\
    \ OPTIONS\n\nThere are two main options for adding video to a web page. One is\
    \ to use the <video> element, while the other (and simpler) option is to embed\
    \ a YouTube (or similar) video into a page. In basic setups, the <video> element\
    \ requires the actual video file to be stored on your web server. Embedding a\
    \ YouTube video is simply a matter of copying and pasting code provided by YouTube.\n\
    \n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<title>My Video Page</title>\n</head>\n\
    <body>\n  <video src=\"videos/stoneham.mp4\"></video>\n</body>\n</html>\n```\n\
    \n**Above:** Adding video to a site used to be difficult; with HTML5 it's a breeze.\n\
    \n# ADD A VIDEO WITH HTML\n\nTo embed a video into a page, add a <video> element\
    \ to its HTML. There are two ways to specify the video file's to be played. The\
    \ simplest is to use the <video> element's src attribute, into which the video's\
    \ URL is entered. However, by the fact that different browsers support different\
    \ formats of video, it's not uncommon to provide multiple versions of the video\
    \ in different file formats. When doing this we have to embed a <source> element\
    \ within the <video> element for each file format you provide.\n\n> Hot Tip\n\
    > If hosting your own videos, favour the MP4 file format. You should also consider\
    \ including a version in Ogg-Theora format to improve browser and OS compatibility\
    \ (http://theora.org).\n\n```\n<!DOCTYPE HTML>\n<html>\n  <head>\n    <title>My\
    \ Video Page</title>\n  </head>\n  <body>\n  <video>\n    <source src=\"videos/stoneham.mp4\"\
    \ type=\"video/mp4\">\n    <source src=\"videos/stoneham.ogv\" type=\"video/ogg\"\
    >\n  </video>\n\n</body>\n</html>\n```\n\nAbove: The <source> element allows you\
    \ to include multiple versions of a video.\n\n# ADD A YOUTUBE VIDEO\n\nAdding\
    \ a YouTube video is much simpler than hosting your own. If it's a video you've\
    \ produced yourself then you will need a Google account to allow you to upload\
    \ the material to YouTube. Once there, though, hooking your video into your page\
    \ couldn't be easier.\n\n**Above:** Embedding a YouTube video is simply a copy\
    \ and paste job.\n\nElement\n\nAll videos on YouTube have a button underneath\
    \ their marked Share. Clicking this button reveals a panel with three tabs along\
    \ the top and a field containing some code. Clicking the Embed tab code will generate\
    \ the HTML code for an `<iframe>`, an element that creates a portal between your\
    \ site and another. Copy the `<iframe>` code and paste it into your page's HTML:\
    \ simple!\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_99_0.png)\n\n# ADDING AUDIO\n\
    \nHTML5's new <audio> element works on very much the same principle as <video>.\
    \ As with <video>, the <audio> element supports multiple source files in order\
    \ to improve browser and OS compatibility.\n\n# AUDIO FORMATS\n\nWhilst you may\
    \ think MP3 audio files are ubiquitous, licensing considerations mean they are\
    \ not supported in all browsers on all operating systems (it is the same situation\
    \ with video, as already alluded to). Including your audio content in both MP3\
    \ and Ogg-Vorbis formats should cover all the bases, though.\n\n> Hot Tip\n> The\
    \ Ogg-Vorbis audio format is partner to the Ogg-Theora video format. Both are\
    \ open-source software and are therefore free to use. Pop along to http://vorbis.com\
    \ for information and encoding tools.\n\n```\n<head>\n  <title>My Video Page</title>\n\
    </head>\n<body>\n  <audio src=\"music/TheSentinel.mp3\"></audio>\n  <audio>\n\
    \    <source src=\"music/TheSentinel.mp3\" type=\"audio/mp3\">\n    <source src=\"\
    music/TheSentinel.oga\" type=\"audio/ogg\">\n  </audio>\n</body>\n```\n\nAbove:\
    \ Including audio content in a page is a breeze with the <audio> element.\n\n\
    # GOING BEYOND THE BASICS\n\nHTML5 and CSS3 represent significant advances in\
    \ their respective languages. Here we introduce some of the more advanced features\
    \ of both languages. A full discussion is beyond the scope of this book, you should\
    \ be aware of these features.\n\n# HTML5 FORMS\n\nA simple example of the power\
    \ of HTML5 lies in HTML forms. Before HTML5, creating forms for the web typically\
    \ involved the use of coding with JavaScript. For instance, if you wished to verify\
    \ that the user had entered suitable data into a form the only way to do so was\
    \ via scripting. HTML5 forms, however, have built-in validation features, saving\
    \ the developer heaps of time and complexity.\n\nBelow: HTML5 forms greatly simplify\
    \ validation of user entries\n\n# Email Sign-up Form Demo\n\nWe have created a\
    \ demo of an email sign-up form you can check out at http://richardshepherd.com/forms\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_101.png)\n\n# DRAG-AND-DROP\n\nDrag-and-drop\
    \ is fundamental to user interaction. In HTML5, adding the attribute to any element\
    \ makes it draggable.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_102.png)\n\n\
    Above: The <source> element allows you to include multiple versions of a video.\n\
    \n# GEOLOCATION\n\nThe HTML5 geolocation is used to determine the user's location.\
    \ It is a powerful tool for maps and services.\n\n# TRANSFORMS\n\nTransforms manipulate\
    \ the visual appearance of elements. For example, rotate a square.\n\n# TRANSITIONS\n\
    \nTransitions allow elements to change visually over a specified time.\n\n```\n\
    <style>\n  div {\n    position:absolute;\n    width:100px;\n    height:100px;\n\
    \    background-color:red;\n  }\n\n  #box {\n    left:200px;\n    top:200px;\n\
    \  }\n\n  #rotatedBox {\n    left:400px;\n    top:200px;\n    transform:rotate(45deg);\n\
    \  }\n</style>\n```\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_103_0.png)\n\n\
    **Above:** allow the position and orientation of elements to be adjusted.\n\n\
    # How Transitions Work\n\nWe already know how to use Pseudo-Class selectors to\
    \ make an element respond to different states, such as :hover, when the mouse\
    \ pointer is over an element.\n\n```\n#homeButton:hover {\n  transition-property:background-color;\n\
    \  transition-duration:0.6s;\n  transition-timing-function:ease;\n  background-color:blue;\n\
    }\n```\n\n# CSS KEYFRAMES\n\n# # Hot Tip\n\nRelated groups of CSS properties often\
    \ have a shorthand equivalent that can set all such properties in one line of\
    \ code. For example, the various animation-style properties can be declared simultaneously\
    \ via the animation property.\n\nKeyframes are a concept from the world of animation.\
    \ They specify a point in time and the state of an object at that point – the\
    \ intermediate steps between the keyframes can then be calculated by the computer.\
    \ Until HTML5 and CSS3 came along, Adobe Flash was the standard for creating keyframed\
    \ animations on a web page, but not any more!\n\n# Apply an Animation\n\nAnimations\
    \ can be applied to almost every element in a web page. Here we are going to demonstrate\
    \ how to animate a <div> element moving across the screen.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_105_0.png)\n\
    \n**Above:** CSS animation changes the value of a style property over time.\n"
  mdcn: "\n\n# 添加视频\n\n视频是网页和网站中非常常见的媒介。它们引人注目，并且比静态图像更具吸引力。用户想要看视频，一段十秒钟的视频片段传达的信息比占据相同空间的图像和文本多得多。\n\
    \n# 视频选项\n\n向网页中添加视频有两种主要方法。一种是使用 `<video>` 元素，另一种（更简单）的方法是将 YouTube（或类似的）视频嵌入页面中。在基础设置中，`<video>`\
    \ 元素要求实际视频文件存储在你的 Web 服务器上。嵌入 YouTube 视频只需复制并粘贴 YouTube 提供的代码即可。\n\n```\n<!DOCTYPE\
    \ HTML>\n<html\n<head>\n<title>My Video Page</title>\n</head>\n<body>\n  <video\
    \ src=\"videos/stoneham.mp4\"></video>\n</body>\n</html>\n```\n\n**上方所示：** 在网站中添加视频曾是一件困难的事；但有了\
    \ HTML5，这变得轻而易举。\n\n# 使用 HTML 添加视频\n\n要将视频嵌入页面，请在其 HTML 中添加 `<video>` 元素。有两种方法指定要播放的视频文件。最简单的方法是使用\
    \ `<video>` 元素的 `src` 属性，其中输入视频的 URL。然而，由于不同的浏览器支持不同格式的视频，提供不同文件格式的多个版本视频并不罕见。这样做时，我们必须为你提供的每种文件格式在\
    \ `<video>` 内部嵌入一个 `<source>` 元素。\n\n> 小贴士\n> 如果托管自己的视频，请优先选择 MP4 文件格式。你还应该考虑包含一个\
    \ Ogg-Theora 格式的版本以提高浏览器和操作系统的兼容性（http://theora.org）。\n\n```\n<!DOCTYPE HTML>\n\
    <html>\n  <head>\n    <title>My Video Page</title>\n  </head>\n  <body>\n  <video>\n\
    \    <source src=\"videos/stoneham.mp4\" type=\"video/mp4\">\n    <source src=\"\
    videos/stoneham.ogv\" type=\"video/ogg\">\n  </video>\n\n</body>\n</html>\n```\n\
    \n上方所示：`<source>` 元素允许你包含多个版本的视频。\n\n# 添加 YouTube 视频\n\n添加 YouTube 视频比自己托管要简单得多。如果这是你自己制作的视频，那么你需要一个\
    \ Google 账户才能将素材上传到 YouTube。一旦上传完成，将你的视频连接到页面上就再不过简单了。\n\n**上方所示：** 嵌入 YouTube\
    \ 视频仅仅是复制和粘贴的工作。\n\n元素\n\nYouTube 上的所有视频下方都有标记为“分享”（Share）的按钮。点击此按钮会显示一个面板，顶部有三个标签和一个包含某些代码的字段。点击“嵌入”（Embed）标签代码将生成用于\
    \ `<iframe>` 的 HTML 代码，该元素在你的网站和另一个站点之间创建一个门户。复制 `<iframe>` 代码并将其粘贴到页面的 HTML 中：简单！\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_99_0.png)\n\n# 添加音频\n\nHTML5 新的 `<audio>`\
    \ 元素原理与 `<video>` 非常相似。与 `<video>` 一样，`<audio>` 元素支持多个源文件以提高浏览器和操作系统的兼容性。\n\n\
    # 音格式\n\n尽管你认为 MP3 音频文件无处不在，但由于许可考虑，并不是所有操作系统的浏览器都支持它（视频的情况也是如此）。将你的音频内容同时包含 MP3\
    \ 和 Ogg-Vorbis 格式应该可以涵盖所有情况。\n\n> 小贴士\n> Ogg-Vorbis 音频格式与 Ogg-Theora 视频格式是一对。两者都是开源软件，因此免费使用。访问\
    \ http://vorbis.com 获取信息和编码工具。\n\n```\n<head>\n  <title>My Video Page</title>\n\
    </head>\n<body>\n  <audio src=\"music/TheSentinel.mp3\"></audio>\n  <audio>\n\
    \    <source src=\"music/TheSentinel.mp3\" type=\"audio/mp3\">\n    <source src=\"\
    music/TheSentinel.oga\" type=\"audio/ogg\">\n  </audio>\n</body>\n```\n\n上方所示：使用\
    \ `<audio>` 元素在页面中包含音频内容轻而易举。\n\n# 超出基础\n\nHTML5 和 CSS3 代表了它们各自语言的重大进展。在这里我们将介绍这两种语言的一些更高级的特性。充分讨论将出了本书的范围，但你应该了解这些特性。\n\
    \n# HTML5 表单\n\nHTML5 力量的一个简单例子在于 HTML 表单。在 HTML5 之前，为 Web 创建表单通常涉及使用 JavaScript\
    \ 进行编码。例如，如果你想验证用户是否在表单中输入了适当的数据，唯一的方法是通过脚本。然而，HTML5 表单具有内置的验证功能，为开发者节省了大量的时间和复杂性。\n\
    \n下方：HTML5 表单极大地简化了用户输入内容的验证\n\n# 邮件注册表单演示\n\n我们创建了一个邮件注册表单的演示，你可以在 http://richardshepherd.com/forms\
    \ 查看。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_101.png)\n\n# 拖放\n\n拖放是用户交互的基础。在\
    \ HTML5 中，为任何元素添加该属性即可使其变为可拖拽的。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_102.png)\n\
    \n上方所示：`<source>` 元素允许你包含多个版本的视频。\n\n# 地理定位\n\nHTML5 地理定位用于确定用户的位置。它是地图和服务的强大工具。\n\
    \n# 变换 (Transforms)\n\n变换操纵元素的视觉外观。例如，旋转一个正方形。\n\n# 过渡 (Transitions)\n\n过渡允许元素在指定的时间内发生视觉变化。\n\
    \n```\n<style>\n  div {\n    position:absolute;\n    width:100px;\n    height:100px;\n\
    \    background-color:red;\n  }\n\n  #box {\n    left:200px;\n    top:200px;\n\
    \  }\n\n  #rotatedBox {\n    left:400px;\n    top:200px;\n    transform:rotate(45deg);\n\
    \  }\n</style>\n```\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_103_0.png)\n\n\
    **上方所示：**允许调整元素的位置和方向。\n\n# 过渡是如何工作的\n\n我们已经知道如何使用伪类选择器（Pseudo-Class selectors）让元素对不同状态做出响应，例如鼠标指针悬停在元素上时的\
    \ `:hover`。\n\n```css\n#homeButton:hover {\n  transition-property:background-color;\n\
    \  transition-duration:0.6s;\n  transition-timing-function:ease;\n  background-color:blue;\n\
    }\n```\n\n# CSS 关键帧\n\n# # 小贴士\n\n相关的 CSS 属性组通常有一个简写形式，可以在一行代码中设置所有此类属性。例如，各种动画样式属性可以通过\
    \ `animation` 属性同时声明。\n\n关键帧（Keyframes）是动画领域的一个概念。它们指定了某个时间点以及对象在该点的状态——关键帧之间的中间步骤可以由计算机计算。在\
    \ HTML5 和 CSS3 出现之前，Adobe Flash 是在网页上创建关键帧动画的标准，但现在不再是！\n\n# 应用动画\n\n动画可以应用于网页中的几乎每一个元素。在这里我们将演示如何让一个\
    \ `<div>` 元素跨屏幕移动。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_105_0.png)\n\n\
    **上方所示：** CSS 动画随时间改变样式属性的值。\n\n"
