    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_5_0.png)\n\n# JavaScript 中的数据 146\n\
    \n在本章中，我们探索 JavaScript 的结构。这包括语法、注释、变量和运算符。\n\n```javascriptlet x = 10;\nlet y\
    \ = \"Hello\";\nif (x > 5) {\n  console.log(y);\n}\n```\n\n# JavaScript 结构 170\n\
    \n# JavaScript 的函数与类 . . . . 202\n\n现在我们涵盖了语句，重要的是学习使用函数进行代码复用，以及如何创建命名函数。我们还研究了为什么使用命名空间避免命名冲突很重要。然后我们介绍了面向对象的编程；解释了类的用法。\n\
    \n# JavaScript 的 DOM 与事件 232\n\n在最后这最后一个章节中，我们研究了最后一块拼图：文档对象模型（DOM）和事件。JavaScript\
    \ 的 DOM 类允许我们操作现有页面，这开启了无限可能。我们探索了如何获取和添加 DOM 元素，然后转向事件和监听器。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_6_1.png)\n\
    \n# 有用的网站和扩展阅读 . . . . 250\n\n# 索引 . . . . . . . . . . . . . . . . 254\n\n# 前言\n\
    \n我们生活在一个连接的世界里。我们分享新闻、故事和图像；我们崇高的愿望和黑暗的噩梦（还有很多猫咪图片）以不断加快的速度在全球传播，而我们对这些无限人类思想（以及可爱的猫咪图片）的需求似乎是无限的。\n\
    \n所有这些信息的媒介——数据流管道——全球文化交织和进步的魔法织机——就是互联网。因此，学习互联网的语言既是赋权的又有回报的。\n\n很多人认为编程很难学；事实完全非如此。如果你知道\
    \ 1 + 2 = 3，并且知道在拿牛奶之前要打开冰箱门，你就可以编程！\n\n当然，精通任何语言（人类语言或计算机语言）都需要长时间专注的学习。但正如学习足够的法语以便在巴黎度假与当地人交流很简单一样，掌握大多数计算机语言的基础也是如此。\n\
