    # HTML5 DRAG-AND-DROP


    Drag-and-drop is fundamental to computer use, and is a very intuitive way for
    a user to interact with on-screen objects. In HTML5, adding the draggable attribute
    to any visual element and setting the attribute''s value to "true" makes that
    element draggable: <img id="#homepageImage" draggable="true" />. Handling such
    interactions remains the job of a scripting language like JavaScript.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_102_0.png)


    Above: The user will be asked whether or not they wish to share their geolocation
    data with your site.


    # HTML5 GEOLOCATION


    The HTML5 geolocation feature is used to determine a person''s location through
    their desktop or mobile device. A popular use of geolocation is on mobile devices
    where it integrates with maps. It is used for a host of services that need your
    location, for example, for getting directions from A to B.'
  - "[PAGE 103]\n\n# CSS TRANSFORMS\n\nTransforms manipulate the visual appearance\
    \ of HTML elements. For example, the rotate style property will rotate an element.\
    \ This makes it easy to turn a square into a diamond, for example. Other properties\
    \ include scale and skew. The former makes an element larger, whilst the latter\
    \ tilts an element.\n\n# CSS TRANSITIONS\n\nTransitions allow elements to change\
    \ visually over a specified time period. A simple example of the transition property\
    \ is typically found on buttons. These will have an initial background colour\
