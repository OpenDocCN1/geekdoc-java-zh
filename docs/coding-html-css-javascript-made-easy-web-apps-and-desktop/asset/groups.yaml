    # CSS KEYFRAMES


    # # Hot Tip


    Related groups of CSS properties often have a shorthand equivalent that can set
    all such properties in one line of code. For example, the various animation-style
    properties can be declared simultaneously via the animation property.


    Keyframes are a concept from the world of animation. They specify a point in time
    and the state of an object at that point – the intermediate steps between the
    keyframes can then be calculated by the computer. Until HTML5 and CSS3 came along,
    Adobe Flash was the standard for creating keyframed animations on a web page,
    but not any more!


    # Apply an Animation


    Animations can be applied to almost every element in a web page. Here we are going
    to demonstrate how to animate a <div> element moving across the screen.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_105_0.png)


    **Above:** CSS animation changes the value of a style property over time'
- md: "\n## Creating a Simple Animation\n\n- 1. Create a new HTML document, add the\
    \ basic structural elements (<html>, <head> and <body>) and create a <style> element\
    \ in the <head>. Save the file as movingbox.html.\n- 2. Add a <div> within the\
    \ body and give it an id of 'boxToMove'. In the <style> element create an ID selector\
    \ and define a style rule that will size the <div> to 100 x 100 pixels and give\
    \ it a background colour so we can see it on-screen.\n- 3. We'll now add the animation\
    \ code to the style rule. Copy the style properties and define values from the\
    \ illustration; the style property names are self-explanatory.\n\n```\n<!DOCTYPE\
    \ HTML>\n<html>\n<head>\n<title>CSS Animation</title>\n<style>\n</style>\n</head>\n\
    <body>\n\n</body>\n</html>\n```\n\nStep 1: Create a basic document file called\
    \ movingbox.html.\n\n```\n<style>\n#boxToMove {\nposition:relative;\nwidth:100px;\n\
    height:100px;\nbackground-color:red;\nanimation-name:boxMover;\nanimation-duration:3s;\n\
    animation-iteration-count:infinite;\n}\n</style>\n```\n\n> Hot Tip: Not all browsers\
    \ support keyframe animation – if it's not working for you, try opening the page\
    \ in Firefox.\n\nSteps 2 & 3: The style rules define both the appearance of the\
    \ movingbox <div>, and its animation properties.\n\n4. The final part of the jigsaw\
    \ is the keyframe code. This is declared in a way we have not yet investigated,\
    \ using a CSS '@' declaration, in this case @keyframes. This is followed by the\
    \ name of the animation, the same name as is declared in the animation-name style\
    \ property.\n\n```\n<style>\n#boxToMove {\n  position:relative;\n  width:100px;\n\
    \  height:100px;\n  background-color:red;\n  animation-name:boxMover;\n  animation-duration:3s;\n\
    \  animation-iteration-count:infinite;\n}\n\n@keyframes boxMover {\n  0% {top:0px};\n\
    \  25% {top:100px};\n  75% {top:50px};\n  100% {top:150px};\n}\n```\n\nSteps 4\
    \ & 5: The code following the @keyframes declaration defines which style properties\
    \ will be animated, and what values they'll take at various points in time.\n\n\
    5. The lines of code that follow the @keyframes declaration define a style property\
    \ and value against various points in time, expressed as percentages. The top\
    \ style property we are using determines the distance between the top of the animated\
    \ element and the top of its containing block, in this case the <body> element.\n\
    \n6. Save your work and open the file in a browser to see the results.\n\n## HTML\
    \ AND JAVASCRIPT\n\nWe already know that HTML creates the structure for a page\
    \ and defines its content, and that CSS controls the visual look of that content.\
    \ Scripting completes this picture by providing the means to control the behaviour\
    \ of your page, and how it reacts to user interaction. There are various scripting\
    \ languages for the web – built into the main web browsers – is JavaScript.\n\n\
    ## WHERE DOES JAVASCRIPT FIT?\n\nEarlier we used the analogy of a house to HTML\
    \ and CSS, the former being the bricks and mortar, and the latter being the decoration\
    \ and finish. If we stick with this analogy, JavaScript (or JS for short) should\
    \ be a master home control system that can control every aspect of the house intricately.\n\
    \nRight: JavaScript is the most common scripting language used in web pages.\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_108_0.png)\n\n## Adding a Script\n\n\
    The intricacies of JavaScript are explored in the later chapters of this book,\
    \ but let's take a quick look at how you add a script to a page, to get us started.\
    \ For a more detailed look at this see page 142.\n\n## The <script> Element\n\n\
    Like CSS, a script can be embedded into your page or be external to your page.\
    \ The latter is the more common approach, but both are achieved via the <script>\
    \ element: an embedded script is written between the opening and closing <script>\
    \ tags; an external script is located in a separate text file and is linked to\
    \ a page via the src attribute of the <script> element.\n\nBelow: Like CSS, scripts\
    \ can be embedded or external.\n\n```\n<head>\n<title>Script Elements</title>\n\
    <!-- This is an external script... -->\n<script type=\"javascript\" src=\"js/siteCore.js\"\
    ></script>\n<!-- This is an embedded script... -->\n<script type=\"text/javascript\"\
    >\n  var com;\n  if(!com) {\n    com = {};\n  }\n  if(com.umasdvd) {\n    com.umasdvd.resetContactForm\
    \ = function() {\n      document.getElementById(\"messageTitle\").setAttribute(\"\
    value\", \"\");\n      document.getElementById(\"messageTitleMessage\").textContent\
    \ = \"\";\n      document.getElementById(\"senderAddress\").setAttribute(\"value\"\
    , \"\");\n      document.getElementById(\"senderMessage\").textContent = \"\"\
    ;\n      document.getElementById(\"messageBody\").textContent = \"\";\n      document.getElementById(\"\
    messageBodyMessage\").textContent = \"\";\n    }\n  }\n</script>\n</head>\n```\n\
    \n## IMAGES, VIDEO & ENHANCEMENTS\n\nExecute on: A <script> element can appear\
    \ anywhere within a web page, and is executed – in other words, run when the browser\
    \ encounters it (see page 143). Typically, then, scripts that have to be available\
    \ to the whole page are defined in the <head>, whereas scripts that create an\
    \ output are positioned at the location that the output is required.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_110_0.png)\n\
    \n## A GOOD UNDERSTANDING\n\nA thorough understanding of JavaScript allows you\
    \ to take your site well beyond the limitations of HTML and CSS, turning your\
    \ pages into bona applications, but it's a deep subject with a lot to learn. In\
    \ later chapters of this book (see page 134) explore JavaScript, providing you\
    \ with an excellent place to start learning about this fascinating and complex\
    \ language.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_111.png)\n\nAs we have\
    \ learned, HTML is nothing more than plain text; it works at all because web browsers\
    \ recognize characters that have a special meaning in HTML such as '<' and '>'.\
    \ But what if we want to use one of those special characters within a text-based\
    \ element such as <p>, will cause errors and the page will not be rendered correctly\
    \ (if all). For example, we may wish to include angle brackets when quoting what\
    \ somebody has said. The problem is that such characters have predefined meanings\
    \ in HTML and \"There are many characters in HTML\" said the man. He went to explain\
    \ that the same was true of \"extended\" characters. Accented characters, such\
    \ as ©, μ, 'Á' and 'É' are also classed as extended characters, he explained.\
    \ Some characters have special meaning in HTML and can't be typed directly into\
    \ an element.\n\n## ASCII and Extended Characters\n\nThe core set of characters\
    \ used in computing is referred to as ASCII (American Standard for Information\
    \ Interchange). This is a standard that defines the most common alphabetic, numeric\
    \ and punctuation characters. There are 128 character codes, and all computers\
    \ follow the ASCII standard for these characters. Characters that fall outside\
    \ the ASCII standard, such as accented letters, are known as extended characters\
    \ and should be typed directly into HTML text. Internally, computers represent\
    \ everything with numbers, and this includes text. The number that represents\
    \ a given alphumeric, punctuation or symbol character is called a character code.\n\
    \n| ASCII control characters | ASCII printable characters |\n|---|---|\n| 00 NULL\
