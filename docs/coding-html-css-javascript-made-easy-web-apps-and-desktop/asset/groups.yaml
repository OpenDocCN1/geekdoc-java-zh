    # 50 CODING HTML • CSS • JAVAS MADE EASY


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_49_0.png)


    # Page Sections


    The <section> element is meant as a generic container for groups of related content,
    i.e. for ''sections'' of your page. <section> elements typically follow the <header>
    element of a page.


    # OTHER STRUCTURAL ELEMENTS


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    <!--Head used for defining meta data about the page-->

    <title>All Structural Elements</title>

    </head>

    <body>

    ...The <header>, <section> and <footer> elements create both a page structure
    into which other elements can be placed, and a logical structure for the different
    types of information within a page. There are four more structural elements in
    HTML5 that you will use regularly.

    ```


    Above: Structural elements provide a logical structure into which a page''s content
    is written.


    # Site Navigation


    Most websites include a site navigation menu to allow users to move quickly and
    easily around the site; HTML5 provides the <nav> element to contain the elements
    of the elements of such a navigation menu. The <nav> element is generally created
    as a child of <header>, but this is not a requirement.'
  - '[PAGE 50]


    # Article Element


    The <article> element is intended as the final element in a structural chain in
    that it typically resides within another structural element such as <section>.
    The idea of <article> is that its content relates to a single subject, like an
    article in a newspaper.


    # Aside Element


    The idea behind an <aside> element is for it to display content that''s related
    to content within another structural element, but does not a direct part of that
    content. Semantically, any structural element can have a related <aside> element,
    but the typical usage is a sidebar for showing things such as adverts, profile
    information, or links to other areas of the site.


