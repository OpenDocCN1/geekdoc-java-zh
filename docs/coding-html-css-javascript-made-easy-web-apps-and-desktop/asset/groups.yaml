  - '[PAGE 56]


    # TEXT-BASED ELEMENTS


    Most web pages contain text – often quite a lot of it – and so unsurpriseingly
    there is a collection of elements that are dedicated to displaying text. Text
    elements tend to be nested within the structural elements we''ve discussed previously.


    # HEADING TEXT


    There is a group of HTML elements that is dedicated to displaying headings; their
    names are very easy to remember. The first is called <h1>, the second <h2> and
    so on until we reach <h6> .


    > **Hot Tip**


    `<h4>` to `<h6>` are rarely used – just how many levels of heading does one need??!


    ```

    8

    9

    10 <body>

    11 <h1>Heading level 1</h1>

    12 <h2>Heading level 2</h2>

    13 <h3>Heading level 3</h3>

    14 <h4>Heading level 4</h4>

    15 <h5>Heading level 5</h5>

    16 <h6>Heading level 6</h6>

    17

    18 </body>

    19

    ```


    **Above:** There are six levels of heading element in HTML'
  - '[PAGE 57]


    # Heading Levels


    The number in the heading element''s name represents the ''level'' of the heading,
    in other words how important (and therefore prominent) the heading is. <h1> is
    the most prominent, and <h6> the least.


    # Heading Semantics


    Prior to HTML5 the different levels of heading representing nothing more than
    different degrees of visual prominence: <h1> the boldest and largest, <h6> the
    smallest and lightest. HTML5 goes a step further and imposes semantic meaning
    on the different heading levels.


    | Heading level 1 |

    | Heading level 2 |

    | Heading level 3 |

    | Heading level 4 |

    | Heading level 5 |

    | Heading level 6 |


    > Above: <h1> is the most prominent heading, <h6> the least.


    The easiest way to explain this is by using the analogy of a book such as the
    one you are reading now. If a web page were a chapter in a book, then <h1> would
    be analogous to the chapter title, so <h1> should only appear once in a web page.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_57_0.png)'
  - '[PAGE 58]


    <h2> would be analogous to section headings within a chapter, and so can appear
    more than once after <h1>. <h3> is analogous to subheadings within a section...
    and so on.

    Heading semantics can be tricky, but keep the book analogy in mind – it helps!


    # ## Logical Structure of Headings


    The semantic nature of HTML5 headings means that they also infer a logical structure.

    Returning to our book analogy, the parent of a subheading ( <h3> ) will be a section
    heading ( <h2> ), and the parent of a section heading will be a chapter heading
    ( <h1> ).nBut what if you want to create a single heading that has two components:
    a ''stand-first'' and ''tagline'', so to speak?


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_58_0.png)


    **Above:** Like the levels of heading in a book. HTML5 headings impart a logical
    structure on the text, so <h1> can be thought of as a chapter heading, <h2> can
    be thought of as a section heading and <h3> can be thought of a sub-section heading'
  - '[PAGE 59]


    # Heading Groups


    We might create a two-part heading like this:


    ```

    <h1>HTML and CSS</h1>

    <h2>The Language of the Internet</h2>

    ```


    Unfortunately there''s a problem here: the <h2> is a subheading of <h1>, but as
    things stand it''s denoting a new section in the logical structure of the page.
    The solution is the <group> element, it allows you to group multiple levels of
    heading without implying that you are creating new sections in the logical structure
    – the first heading in the <group> is the heading-level that will be inferred.
    Instead of the above we would write this:


    ```

    <group>

    <h1>HTML and CSS</h1>

    <h2>The Language of the Internet</h2>

    </group>

    ```


    Now, the <h2> element will be considered part of the <h1>, semantic wellbeing
    is restored.


    |11

    12 <!--Semantically incorrect...-->

    13 <h1>HTML and CSS</h1>

    14 <h2>The Language of the Internet</h2>

    15

    16 <!--Semantically correct...-->

    17 <group>

    18 <h1>HTML and CSS</h1>

    19 <h2>The Language of the Internet</h2>

    20 </group>

    21|


    **Above:** An <group> element assists in maintaining semantic accuracy in headings.'
  - "[PAGE 60]\n\n# PARAGRAPH TEXT\n\nYou'll be pleased to know that paragraph text\
    \ (the main body text of a page) is much simpler than headings. We have just one\
    \ paragraph element, <p>. Generally a <p> contains only text, but it can also\
    \ have images and certain other elements embedded within it.\n\n# Styling Paragraphs\n\
    \nA common strategy for styling paragraphs is to create a p Type selector in which\
    \ to define the very basic aspects of your paragraph style, such as the font,\
    \ and then create a collection of Class selectors that apply specific styling,\
    \ such as bold text, underlining and italics. You can then assign the assigned\
    \ class name(s) to a given <p> element as required.\n\n```\n<style>\n  .boldText\
    \ {\n    font-weight:bold;\n  }\n  .italicText {\n    font-style:italic;\n  }\n\
    \  .underlinedText {\n    text-decoration:underline;\n  }\n</style>\n```\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_60_0.png)\n\
    \n```\n<body>\n  <p class=\"boldText\">Lorem ipsum sit amet, consectetuer adipiscing\
    \ elit.</p>\n  <p class=\"italicText\">Sed sagittis ante malesuada velit.</p>\n\
    \  <p class=\"underlinedText\">Curabitur suscipit. Suspendisse quis nibh aliquam\
    \ sem.</p>\n  <p class=\"bold italicText\">Pulvinar sollicitudin. Etiam venenenatis.</p>\n\
    \  <p class=\"bold italicText underlinedText\">Curabitur luctus.</p>\n</body>\n\
    ```\n\n**Above:** Creating a number of Class selectors using simple rules makes\
    \ for easy paragraph styling."
  - '[PAGE 61]


    # Styling Within a Paragraph


    There are many occasions when you will want to change the text format within a
    paragraph, such as when you wish to emphasize a word or passage with *italic*
    or **bold** text. There are a few ways to do this: italicizing can be achieved
    by wrapping a span of text in an `<em>emphasis</em> element:


    ```

    <p>Mary had a <em>little</em> lamb</p>

    ```


    Or for bold text:


    ```

    <p>It really <b>was</b> a dear</p>

    ```


    A better way, however, is to use the `<span>` element. It is much more flexible
    because than giving a single style property change, it can apply a whole style
    rule – or rules – in one go:


    ```

    <p>But she <span class="redText italic">couldn''t tell the difference</span</span></p>

    ```


    > Hot Tip

    When adding child elements to a text-based element it is normal to place the new
    tags within the text without creating new lines or indentation in the code.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_61_0.png)


    **Above:** Text format changes within a paragraph are easy with the `<span>` element'
  - '[PAGE 62]


    # HYPERLINKS


    A website would not be a website if it didn''t have hyperlinks. They are the mechanism
    that allow web browsing to happen at all, and without them there would be no way
    to navigate within a site, or to direct people to external sites. A website would
    be nothing more than a single page!


    # THE ANCHOR ELEMENT


    At the heart of the hyperlink mechanism lies the anchor element, `<a>`. It is
    called this because one of its uses is for marking specific points in a page.
    This use remains, but `<a>` is most commonly used for creating hyperlinks.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_62_0.png)


    **Above:** Without hyperlinks there would be no such thing as Google.'
  - '[PAGE 63]


    ```

    8

    9

    10 <body>

    11

    12 <p>HTML info can he found on <a href="www.google.com">Google</a>. It''s a useful
    resource.</p>

    13

    14 </body>

    15

    16

    ```


    Above: Using an <a> element to create a hyperlink.


    # Creating a Hyperlink


    We create a hyperlink by wrapping an <a> element around the text we want to convert
    into a hyperlink – the **URL** (or web address) that you want to link to is defined
    in the href attribute of the <a>.


    # URLs


    URL stands for Uniform Resource Locator. There are two common forms of URL **absolute**
    and **relative**. The former defines a full web address for a resource, starting
    with ''http://''. The latter operates relative to the current file, and can only
    address resources within the same site as that file. A relative URL states the
    path from the current page to a resource, along with the resource''s filename,
    and looks like ''pathToFile/filename''.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_63_0.png)'
  - '[PAGE 64]


    # STYLING LINKS


    As with all elements, <a> has a default appearance derived ultimately from the
    browser''s default style sheet. In the case of <a> that default styling is typically
    for blue underlined text. We can override this, or by attaching style rules to
    an <a> element, either directly or via style inheritance.


    However, a hyperlink typically changes styling depending on its state, i.e. if
    the mouse pointer is over it, if the user has previously clicked the link. This
    state-based styling is achieved through CSS Pseudo-Class selectors.


    > Hot Tip

    A web browser provides a default style sheet. This defines values for all CSS
    properties, and is the starting point of the style cascade.


    **Below:** Hyperlinks have a default appearance.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_64_0.png)'
- md: "\n## Pseudo-Class Selectors\n\nA pseudo-class is a class that's not specifically\
    \ declared in an HTML document, but that becomes available when the page is being\
    \ viewed in a browser. There are a few different ones, but with hyperlinks the\
    \ pseudo-classes we are concerned with are :link (the base-state of a hyperlink),\
    \ :hover (the mouse pointer is over the hyperlink) and :visited (the hyperlink\
    \ has been clicked). In CSS we use these pseudo-class selectors as a suffix to\
    \ another selector.\n\n```css\na:link {\n  color:blue;\n}\na:hover {\n  color:red;\n\
    \  text-decoration:none;\n}\na:visited {\n  color:purple;\n}\n.navButton:hover\
    \ {\n  color:blue;\n  background-color:gray;\n  cursor:pointer;\n}\n#headerLogo:hover\
    \ {\n  border-color:blue;\n  border-style:solid;\n  border-width:2px;\n  cursor:pointer;\n\
    }\n```\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_65_0.png)\n\n**Above:** Pseudo-Class\
    \ selectors are added as a suffix to another selector.\n\n## OPENING A HYPERLINK\
    \ IN A NEW WINDOW\n\nIt's often desirable to open a hyperlink in a new browser\
    \ window so your own site remains open in the background. This is done via the\
    \ target attribute of the `<a>` element, like so:\n\n```html\n<a href=\"http://www.bbc.co.uk\"\
    \ target=\"_blank\">\n```\n\n## LISTS\n\nLists are a staple of web design. There\
    \ are two basic list types, unordered and ordered, both of which will contain\
    \ one or more list items. A third type, the definition list, creates a glossary-like\
    \ structure of titles and associated information.\n\n## LIST ITEMS\n\nBefore looking\
    \ at the list elements themselves, let's consider what goes into a list. In HTML\
    \ this is a list item element, `<li>`. Typically, these contain text but, as with\
    \ other text-based elements, can also contain other elements such as images and\
    \ hyperlinks. `<a>` elements are rendered in the order in which they appear in\
    \ the parent list element.\n\n### Unordered List\n\n- HTML5 is largely made up\
    \ of elements.\n- Elements are demarked by opening and closing tags.\n- Attributes\
    \ allow you to modify an element.\n\n### Ordered List\n\n- 1. HTML5 is largely\
