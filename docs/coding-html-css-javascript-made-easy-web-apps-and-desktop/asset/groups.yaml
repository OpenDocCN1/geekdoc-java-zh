    # HTML IS HIERARCHICAL


    All HTML documents contain an `<html>` element; this element always contains a
    `<head>` and a `<body>` element; these elements themselves contain other elements.
    A page is, therefore, a hierarchical structure of HTML elements. We express this
    structure in terms of ancestry: `<html>` is the **root** and has two **children**,
    `<head>` and `<body>`; `<html>` is the **parent** of `<head>` and `<body>`; `<head>`
    and `<body>` are **siblings**.


    # What is the DOM?


    We know that JavaScript enables us to create similar hierarchical structures by
    storing objects within other objects; as it turns out, this is exactly how a web
    page is represented under the hood of the browser. this representation – or model
    – is known as the Document Object Model, or DOM for short.


    ```

    <html>

    <head>

    <title>

    A Simple Quiz

    </title>

    <script>

    jsSimpleQuiz.js

