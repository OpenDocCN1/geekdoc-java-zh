    # GETTING STARTED WITH HTML & CSS


    # WHAT’S A FOOTER?


    The <footer> element should be positioned at the bottom of a web page, and is
    normally the same across all pages on a site. In general it is used for holding
    copyright information and additional navigation links, but it can contain any
    elements that you like.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_48_0.png)


    **Above:** The footer of a website is found at the bottom of the page.


    # WHAT’S CONTENT?


    Content is the main bulk of information and media on your page: it’s the stuff
    that your visitors have come to see Unlike the <header> and <footer> elements
    that tend to be uniform throughout a site, the content area of a page will differ
    from page to page.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_48_1.png)


    > ### Hot Tip

    nThe menu/navigation system on a website is critical to how it works. Take a look
    at other websites to find one that works well for you and take inspiration from
    it.'
