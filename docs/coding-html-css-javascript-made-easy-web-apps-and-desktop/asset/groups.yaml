- md: "\n## CREATING AN INSTANCE\n\nNow that the constructor is defined, we can create\
    \ a QuizQuestion instance by using the new keyword, like this:\n```javascript\n\
    new com.flametreepublishing.QuizQuestion(arguments);\n```\n\nRecall that the QuizQuestion\
    \ constructor function expects four arguments to be passed to it: the question\
    \ number, the question text, the array of possible answers, and the index of the\
    \ correct answer. These all need to be included within the parentheses following\
    \ the constructor name when instantiating the class – we’ll come back to this\
    \ shortly.\n\n```javascript\nnew com.flametreepublishing.QuizQuestion(\n  1,\n\
    \  \"Approximately how far away from the Earth is the Sun?\",\n  [\"200 miles\"\
    , \"93,000,000 miles\", \"49,000,000 miles\", \"150,000 miles\"],\n  1\n)\n```\n\
    \n**Above:** Instantiating a class creates an object of class which we can work\
    \ with.\n\n## THE THIS KEYWORD\n\nThe last walkthrough introduced the special\
    \ this keyword. When used in a constructor function, this refers to the instance\
    \ that’s under construction.\n\nIn the code we've just written, there are four\
    \ statements starting with this – they assign the argument values sent to the\
    \ constructor to the new instance. By assigning these values to this, we assign\
    \ them to the new instance.\n\nWhen this is used in a class method, it refers\
    \ to the specific instance of the class that the method is being executed on.\
    \ This will become clearer over the coming exercises.\n\n## CLASS METHODS\n\n\
    A method is similar to a function. In simple terms, where a function is a stand\
    \ alone entity that can have objects passed to it, a method is part and parcel\
    \ of an object, and operates from the context of that object.\n\nWe've already\
    \ met a few methods of the built-in classes – for example, the push () method\
    \ of the array class. When we call push (), we do so via an instance of the array\
    \ class: myArray.push(newValue), hence it is a method.\n\n## The Prototype Object\n\
    \nAs has been mentioned previously, the JavaScript object class holds an exalted\
    \ place within the language – it is the class upon which all classes are based.\
    \ The upshot is that all other classes, including our own custom classes, inherit\
    \ the methods and properties of the object class. One such property is called\
    \ prototype – this is where the methods of a class should be defined. Let's see\
    \ how.\n\n```javascript\n// QUESTION 1\ncom.flametreepublishing.questions.push({\n\
    \  question: \"Approximately how far away from the Earth is the Sun?\",\n  answers:\
    \ [\"200 miles\", \"93,000,000 miles\", \"49,000,000 miles\", \"150,000 miles\"\
    ],\n  correctAnswerIndex: 1\n});\n```\n\n**Above:** We've already used the push()\
    \ method of the array class (note that com.flametreepublishing.questions is Instance\
    \ of the array class).\n\n## Defining Class Methods\n\nWe currently have a function\
    \ in our quiz, checkUserAnswer, which would be better as a method of our new QuizQuestion\
    \ class.\n\n- 1. Open QuizQuestion.js in your editor.\n\n```javascript\ncom.flametreepublishing.QuizQuestion.prototype.checkUserAnswer\
    \ = function(answerIndex) {\n  var theResult;\n  if(answerIndex === this.correctAnswerIndex)\
    \ {\n    theResult = true;\n  } else {\n    theResult = false;\n  }\n  return(theResult);\n\
    }\n```\n\n**Above:** Step 2: Insert the method definition as shown here.\n\n-\
    \ 2. Create a couple of empty lines below the constructor and type the checkUserAnswer\
    \ method definition shown in the illustration on the previous page. This uses\
    \ much the same logic as our earlier function of the same name.\n\n- 3. Note that\
    \ the method name has to be prefixed by the namespace, the class name, and the\
    \ prototype property reference. This can become somewhat long-winded, but is unavoidable.\n\
    \n| always define methods on the prototype object | namespace class name method\
    \ name method definition |\n| :--- | :--- |\n| com.flamreetublishing.QuizQuestion.prototype.checkUserAnswer\
    \ = function(answerIndex) { |\n\n> **Above:** Method names can become a bit long-winded,\
    \ but they have a simple structure.\n\n- 4. While we're here, let's make the question\
    \ self-rendering. The code for this is shown in the illustration below and should\
    \ be familiar by now.\n\n- 5. Save your work.\n\n```javascript\ncom.flametreetublishing.QuizQuestion.prototype.renderQuestion\
    \ = function() {\n  document.write(\"<h2>QUESTION\" + this.questionNum + \"</h2>\"\
    );\n  document.write(\"<p>\" + this.questionText + \"</p>\");\n  document.write(\"\
    <p>A1: \" + this.answers[0] + \"</p>\");\n  document.write(\"<p>A2: \" + this.answers[1]\
    \ + \"</p>\");\n  document.write(\"<p>A3: \" + this.answers[2] + \"</p>\");\n\
