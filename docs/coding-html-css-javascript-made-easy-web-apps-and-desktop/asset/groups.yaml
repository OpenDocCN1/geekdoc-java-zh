- md: "\n## RETURNING A VALUE FROM A FUNCTION\n\nWe often want to process the values\
    \ we pass to a function in some way, and to return the result of that calculation\
    \ to the calling expression – the returned value becomes the value of the function\
    \ call call. We do this with the return keyword.\n\n## Using the Return Keyword\n\
    \nWhen the interpreter encounters return, it ceases processing of the function\
    \ and returns to the calling expression. If the function needs to send a value\
    \ back to the calling expression, we place the value in the parentheses following\
    \ the return keyword – for example, return(functionResult);\n\n```javascript\n\
    function calculateRectArea(rectWidth, rectHeight) {\n  var rectArea = rectWidth\
    \ * rectHeight;\n  return(rectArea);\n}\n```\n\n```javascript\nvar myRectArea\
    \ = calculateRectArea(217, 179);\n```\n\nAbove: The value returned by a function\
    \ becomes the value of the function call expression.\n\n## Using Return When Checking\
    \ a Quiz Answer\n\nOur quiz needs to be able to determine whether the user has\
    \ selected a correct answer – let's write a function for that.\n\n- 1. Open quizFunctions.js\
    \ in your editor, and add a new function called checkUserAnswer() – see the illustration\
    \ below. The function will receive two arguments – a question index and an answer\
    \ index – that allow the function to determine the question that's to be checked\
    \ and the answer that was given.\n\n```javascript\n11 function checkUserAnswer(questionIndex,\
    \ answerIndex) {\n12   //function statements will go here...\n13 }\n```\n\nAbove:\
    \ Step 1: Add a new function as shown here.\n\n- 2. Enter the code in the illustration\
    \ below and then save your work.\n\n```javascript\n10 function checkUserAnswer(questionIndex,\
    \ answerIndex) {\n11   var questionObject = questions[questionIndex];\n12   var\
    \ theResult;\n13   if(questionObject.correctAnswer == answerIndex) {\n14     theResult\
    \ = true;\n15   } else {\n16     theResult = false;\n17   }\n18   return(theResult);\n\
    19 }\n```\n\nAbove: Step 2: Enter the code shown here.\n\n- 3. Nothing happens\
    \ if you launch the page, because we aren't triggering the new function in any\
    \ way – we’ll get to that when we look at Events on page 240.\n\n## ANONYMOUS\
    \ FUNCTIONS\n\nIn JavaScript, a function is just another form of data. This means\
    \ that you can create a function and assign it to a variable or object property.\
    \ Such functions are called anonymous functions, because they don't have a function\
    \ name.\n\n## Declaring an Anonymous Function\n\nWe declare an anonymous function\
    \ by assigning a function literal to a variable or object property. The general\
    \ form looks like this:\n\n```javascript\nvar myAnonymousFunction = function(parameter(s))\
    \ {\n    statement(s);\n}\n```\n\n## Invoking an Anonymous Function\n\nInvoking\
    \ an anonymous function is no different to invoking a named one; we just use a\
    \ variable name or property reference instead of a function name. To all intents\
    \ and purposes, this is identical to invoking a named function.\n\n```javascript\n\
    1 //This is a named function...\n2 function calculateRectArea(rectWidth, rectHeight)\
    \ {\n3 return(rectWidth * rectHeight);\n4 }\n6 //This is an anonymous function...\n\
    7 var calculateRectHypotenuse = function(rectWidth, rectHeight) {\n8 var widthSquared\
    \ = rectWidth * rectWidth;\n9 var heightSquared = rectHeight * rectHeight;\n10\
    \ return(Math.sqrt(widthSquared + heightSquared)); //Math.sqrt() calculates a\
    \ square root\n11 }\n13 //Calls to either function have the same general form:\n\
    14 var myRectArea = calculateRectArea(49, 28);\n15 var myRectHypotenuse = calculateRectHypotenuse(49,\
    \ 28);\n```\n\nAbove: Named and anonymous functions are called in the same way.\n\
    \n## VARIABLE SCOPE\n\nWhen a variable is declared outside of functions or statement\
    \ blocks, it is available from anywhere in the web page, so so is known as a global\
    \ variable. Another way of putting this is that the variable exists within the\
    \ global scope. Conversely, variables declared within a function are only accessible\
    \ from within that function – they are said to be within the function's scope.\n\
    \n## The Scope Chain\n\nScope is hierarchical – one scope is nested within another.\
    \ For example, named functions always exist in the global scope. An expression\
    \ can only access variables that are in the same scope as – or are further up\
    \ the scope chain than – the expression.\n\n**Above:** Variable scope is hierarchical.\
    \ A variable in one scope can't access deeper-nested scopes.\n\n## NAMESPACES\n\
    \nWe create a lot of named objects – variables and functions – in JavaScript,\
    \ and the name of each should be unique within its own scope. If it isn’t unique,\
    \ a name clash occurs, and things go badly wrong.\n\n## WHAT IS A NAMESPACE?\n\
    \nNamespaces are contexts in which we define names to avoid clashes.\n\n| NOUN\
    \ | Example |\n| :--- | :--- |\n| A dog | Dog |\n| A tree | Shoot |\n| A person\
    \ | Dope |\n| An action | Shoot |\n| A drug | Dope |\n\n**Above:** Namespaces\
    \ are important because without them, we run into issues.\n\n## What is a Name\
    \ Clash?\n\nA name clash occurs when a name is used by another object on the page.\n\
    \n## Pollution of the Global Namespace\n\nThe name of every named function exists\
    \ within the global namespace. With large projects, this namespace becomes cluttered\
    \ with names.\n\n**Above:** The global namespace can become messy\n\n## SIMULATING\
    \ NAMESACES IN JAVASCRIPT\n\nUnlike some languages, JavaScript does not have formal\
    \ notation for creating namespaces. However, remember that everything in JavaScript\
    \ is an object — we can create an object in the global namespace and then define\
    \ all of our variables within this object. Our names don't pollute the global\
    \ namespace, and if we choose the namespace object's name wisely, we won't end\
    \ up using the same as other scripts.\n\n## Hot Tip\n\nThe name of a named function\
    \ exists in the global namespace. In contrast, anonymous functions can be assigned\
    \ to an object property, thereby removing their identifiers from the global namespace.\n\
    \n```javascript\nvar myNamespace = {};\nmyNamespace.calculateRectArea = function(rectWidth,\
    \ rectHeight) {\n  return(rectWidth * rectHeight);\n}\n```\n\nAbove: Anonymous\
    \ functions can be assigned to object properties so that they don't pollute the\
    \ global namespace.\n\n## Choosing a Name for a Namespace\n\nGiven that a namespace's\
    \ name has to exist in the global namespace, it is entirely possible to get a\
    \ name clash with another namespace's name. The trick to avoiding this is to choose\
    \ a name that nobody else is likely to be using. How do you do this? Easy – base\
    \ the namespace name on your website's domain name. Typically, we reverse the\
    \ name, so if your domain name is mydomain.com, you could then extend this further\
    \ with a per-application and/or per-module name – for example, com.mydomain.myapplication.\n\
    \n> Hot Tip\n> It is important to understand that a namespace does not refer to\
    \ a page or web resource – it’s just a name.\n\n- Global scope namespace: Global\
    \ identifiers and named functions\n- com.mydomain: Identifiers that refer to the\
    \ functions and values used by your scripts\n- com.otherdomain: Identifers that\
    \ refer to the functions and values defined by 3rd party scripts that are attached\
    \ to your page. They have their own namespace so they won't clash with your names.\n"
