  mdcn: "\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_8_0.png)\n\n互联网语言——HTML、CSS\
    \ 和 JavaScript——是人们可以学会的最简单的语言，同时也是最实用且无处不在的语言。本书仅是对这些语言的介绍，但将赋予你从零开始创建充满活力且令人有趣的网站的能力。\n\
    \n不要害怕，这很容易。翻页自己亲眼看一下吧……\n\nAdam Crute\n\n# 引言\n\n如今，每个人都在使用互联网，从爱好者到大企业。如果你想推销自己、产品，或者仅仅让人们知道你的热情，网站都能为你提供一扇观察世界的窗。它是获取任何事情更多信息的首选地。\n\
    \n# HTML 和 CSS\n\n现在你知道为什么需要网站了，那么如何开始构建呢？网络上每个网站背的核心技术是 HTML（超文本标记语言）和 CSS（层叠样式表）。本书将准确揭示它们是如何工作的、能够做什么，更重要的是，将向你展示如何创建你自己的网站。\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_9_0.png)\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<title>The Coffee Shop - The best coffee in your town</title>\n\
    <link href=\"https://fonts.googleapis.com/css?family=Lato:wght@400,900,700,300\"\
    \ rel=\"stylesheet\">\n<style>\nbody {\n  font-family: Lato, Arial, Helvetica,\
    \ sans-serif;\n  font-size: 14px;\n}\n.wrapper {\n  height: auto;\n  width: content;\n\
    \  margin-left: auto;\n  margin-right: auto;\n}\n</style>\n</head>\n<body>\n<div\
    \ id=\"wrapper\">\n<nav>Home | About Us | Contact</nav>\n<h2>The best coffee you\
    \ will find in your town</h2>\n<section>\n<img src=\"images/coffeehouse.jpg\"\
    \ width=\"680\" height=\"372\">\n<h3>Welcome to The Coffee Shop</h3>\n<p>Lorem\
    \ ipsum dolor sit amet, consectetur adipiscing elit. Duis consequat at orci tincidunt.\
    \ Vivamus id neque, ultricies lacinia, massa, fringilla mauris aliqu. Duis auctor\
    \ lacinia nisl, at non tellus, luctus in mauris nibh nisl eu erat.</p>\n</section>\n\
    </div>\n</body>\n</html>\n```\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_9_1.png)\n\
    \n**上方：** 学习如何将代码转化为互联网黄金；创建你自己的网站可能并没有你想象的那么困难。\n\n# 进一步进\n\n建议不仅止于创建你的网站：学习如何将你的网站发布到互联网，了解你如何购买自己的\
    \ .com 域名，使用 WordPress 创建博客，发现一些高级的 CSS 技术并学习简单的 JavaScript 语言。\n\n# 逐步进行\n\n\
    构建网站和学习新语言的过程看起来可能是一项艰巨的任务。但本书迎接了挑战，通过一系列逐步的指南展示了这一过程。这些指南提供了易于遵循的指令，将引导你完成网站的一些最重要的构建模块。\n\
    \n# 专家指导\n\n如果一切没有按照计划进行，我们实用的故障排除指南将帮助你重回正轨，而我们的进一步阅读指南将指引你下一步去哪里。\n\n# 代码示例\n\
    \n在展示 HTML、CSS 和 JavaScript 代码示例时，我们将使用像这样的文本。当我们想表示某些内容将写在代码块中但我们没有在示例中显示它时，我们会这样构建文本，例如：`header\
    \ {style rule}`。你不需要在代码中输入 'style rule'——相反，我们是在向你展示样式规则所在的位置。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_10_0.png)\n\
    \n除了更有实质性的逐步指南外，还有一系列热点提示（Hot Tip）指南。这些指南提供了快速、方便的提示，以及为最终网站锦添花花的建议。\n\n# JavaScript\
    \ 的形成\n\nJavaScript 语言自万维网早期起就一直与我们在一起。在它的早期，它只是群众中的一员，是许多争夺网页开发社区关注和推广的语言与技术之一。\n\
    \n# 通用语言\n\n多年来，许多此类技术由于各种原因流行一时后没落，但 JavaScript 并非如此。很大程度上归功于灵活性和无处不在的结合，JavaScript\
    \ 现在是互联网主要的脚本语言。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_11_0.png)\n\n# 从\
    \ HTML/CSS 进阶\n\n尽管 JavaScript 有时具有深奥的本质，但它是学习通用编程的完美语言。本书针对对编写代码和编程非常新的人。你可能对\
    \ HTML、CSS 和 JavaScript 完全陌生；你可能已经在 HTML 和 CSS 上花过时间。\n\n# HTML 简介\n\nHTML 是构建网站最重要的组件。但它是什么？有什么用？\n\
    \n# 什么是 HTML？\n\nHTML 亦是构建所有网站的框架。如果说网站是一个房子，那么 HTML 就是砖和灰浆。\n\n# 什么是 HTML？\n\n\
    HTML 由元素组成，每个元素都有特定的用途。例如，video 元素用于在页面上放置视频。\n\n- HTML 是元素的集合\n- 这些元素由标签标记\n\
    - 每个元素都有一个名称——包含在标签中\n- 开启标签和闭合标签之间的任何内容都是元素的内容\n\n# HTML 像什么样？\n\nHTML 不仅仅是纯文本。如果我们创建上述元素，我们将写一个开启标签\
    \ `<video>` 和匹配的闭合标签 `</video>`。如你所示，开启标签以 `<` 开始，说明元素名称并以 `>` 结束。闭合标签遵循相同的模式，我们在元素名称之前插入\
    \ `/`。当网络浏览器遇到它时，它会在页面上创建一个视频播放器。简单吧？\n\n# 元素内部有什么\n\n那么，这些标签之间是什么？大多数情况下，答案是文本和/或其他元素。这意味着\
    \ HTML 具有元素内部元素的嵌套结构。此外，许多开发者会缩进代码行以反映这种嵌套。\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <title>My Page</title>\n</head>\n<body>\n  <header>\n    <h1>A Page\
    \ All About Me</h1>\n  </header>\n  <section>\n    <h2>I'm thinking now</h2>\n\
    \    <p>Lorem ipsum dolor sit amet, consectetur adipiscing elit. Duis consequat\
    \ at orci tincidunt. Vivamus id neque, ultricies lacinia, massa, fringilla mauris\
    \ aliqu.</p>\n    <p>Nuncen velit molestie sapien. Maecenas elementum aliquet\
    \ velit. Ut eget mauris sed lacus lacinia. Nunc arcu magna, mollis id, ornare\
    \ ac, pharetra sit amet, purus. Aliquam luctus consect dolor.</p>\n  </section>\n\
    </body>\n</html>\n```\n\n"
