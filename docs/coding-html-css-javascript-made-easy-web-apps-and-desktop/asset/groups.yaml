    \ src=\"QuizQuestion.js\"></script>\n  <script type=\"javascript\" src=\"SimpleQuiz.js\"\
    ></script>\n  <script type=\"javascript\" src=\"quizFunctions.js\"></script>\n\
    </head>\n</html>\n```\n\n```javascript\nvar com;\nif (!com) {\n  com = {};\n \
    \ if (!com.flametreetublish) {\n    com.flametreetublish = {};\n  }\n}\ncom.flametreetublish.SimpleQuiz\
    \ = function() {\n  this.questions = [];\n}\n```\n\n## 编写 HTML • CSS • 易 JavaScript\n\
    \n```javascript\n// QUESTIONS\nfunction init() {\n  this.loadQuestions();\n}\n\
    \ncom.flametreepublishing.SimpleQuiz.prototype.loadQuestions = function () {\n\
