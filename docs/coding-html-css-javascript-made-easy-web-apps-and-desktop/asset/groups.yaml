    \ the nested structure of your elements."
- md: "\n## MODIFYING ELEMENTS\n\nWhilst all HTML elements have an intended use, nearly\
    \ all can be modified in various ways too. For example, we may want to change\
    \ the dimensions of a video player or the font size of a heading.\n\nElements\
    \ are modified by adjusting the attributes of the element, and this is done in\
    \ the opening tag:\n\n```\n<video width=\"720\" height=\"360\">\n```\n\nAs you\
    \ can see, an attribute name is declared within the opening tag, is followed by\
    \ '=' and then a value wrapped inside quote marks.\n\n## Components of HTML\n\n\
    - Element: The basic building block of HTML\n- Tag: Defines the start and end\
    \ of an element.\n- Attribute: Modifies the behaviour and appearance of an element.\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_17_0.png)\n\n```\n<video width=\"640\"\
    \ width=\"360\" src=\"vids/intro.mp4\"></video>\n<section lang=\"en\">\n  <article\
    \ id=\"article_01\">\n    <h2 class=\"underlinedText\">Lorem ipsum dolor sit amet</h2>\n\
    \    <p class=\"redText\">Sed sagittis ante malesuada velit. Curabitur suscipit.</p>\n\
    \  </article>\n</section>\n```\n\nAbove: Attributes allow you to modify an element.\n\
    \n## DOING THINGS WITH STYLE\n\nIn old versions of HTML a plethora of different\
    \ attributes existed for controlling the visual appearance of elements. What's\
    \ more, different elements had wildly varying sets of attributes that they recognized.\
    \ Remembering all of the connotations and variations was a nightmare, and so the\
    \ style attribute was developed.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_18_0.png)\n\
    \n## Obey The Rules\n\nThe value assigned to a style attribute is called a style\
    \ rule and this consists of one or more style commands. A style command is a pairing\
    \ of a style property and a value to be applied to that property, for example:\n\
    \n```\n<body style=\"color:green; font-weight:bold;\">\n```\n\nEach style property\
    \ name (color and font-weight in this example) is followed by a colon '', then\
    \ the value to be assigned to that property, and finally a semicolon ';'.\n\n\
    | Line | | |\n|---||||\n| 8 | | |\n| 9 | | |\n| 10 | <header style=\"font-size:18px;\
    \ color:blue;\"> |\n| 11 | <h1 style=\"font-weight:bold;\">HTML and CSS Basics</h1>\
    \ |\n| 12 | <h2 style=\"font-size:14px;\">Learn the language of the Internet</h2>\
    \ |\n| 13 | | |\n| 14 | </header> |\n| 15 | | |\n| 16 | | |\n| 17 | <video width=\"\
    640\" width=\"360\" src=\"vids/introvid.mp4\"></video> |\n| 18 | | |\n\nAbove:\
    \ The style attribute allows you to add inline styling to an element.\n\n## INTRODUCTION\
    \ TO CSS\n\nIf HTML is the bricks and mortar of a house, then CSS provides the\
    \ decoration. The language is simple but packs a big punch, and without it your\
    \ web pages would look awful.\n\n### WHAT IS CSS?\n\nWe've already looked at adding\
    \ a style rule to an element's style attribute. This is called **Inline** styling\
    \ - it works, but has an inherent problem: if you want to change the font of all\
    \ of your text headings then you have to edit the font-family style property in\
    \ every occurrence of a heading element. This is where **CSS** comes into the\
    \ picture.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_19_0.png)\n\nCSS stands\
    \ for Cascading Style Sheets. It provides the means of separating page content\
    \ from page appearance, and of applying a style rule to more than one element\
    \ at a time. A key benefit of this is that any changes made to a CSS style rule\
    \ will affect all elements that are associated with that\n\n```\nheader {\n  position:relative;\n\
    \  width:1024px;\n  height:130px;\n  margin:0px auto auto;\n  padding:0px;\n \
    \ background-color:#778081;\n  border:none;\n  border-bottom:2px solid #FDSF12;\n\
    }\nnav {\n  position:relative;\n  width:788px;\n  height:30px;\n  margin:0px auto\
    \ auto;\n  padding:0px 118px auto 118px;\n  background-color:#D9D0D9;\n  border:none;\n\
    \  border-bottom:1px solid #FDSF12;\n}\n```\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_20_0.png)\n\
    \n## WHAT DOES CSS LOOK LIKE?\n\nLike HTML, CSS is plain text written with a specific\
    \ structure. CSS code is comprised of selectors that identify the HTML element(s)\
    \ that the subsequent style rule will be applied to. The style rule itself is\
    \ wrapped in curly brackets, '{' and '}'. (Note: original OCR error had '(' and\
    \ ')')\n\n> **Above:** CSS code employs selectors and style rules. How indenting\
    \ the code assists with legibility.\n\n## Selection of Selectors\n\nSelectors\
    \ can take a number of different forms, but in this book we will only focus on\
    \ three of them: Type, ID and Class. The simplest of these is the Type selector.\
    \ It consists of nothing more than the name of the HTML element that will receive\
    \ the style rule. For example, a p selector will target all instances of <p> elements.\n\
    \n## WHY CASCADING?\n\nWhen writing HTML we create a nested structure in which\
    \ every element is nested within another. This means that every element has a\
    \ **parent** element – the element in which a given element is nested – and most\
    \ elements have **child** element(s), i.e., the element(s) nested within a given\
    \ element.\n\n| Line | | |\n|---|---|---|\n| 12 | | |\n| 13 | | |\n| 14 | | |\n\
    | 15 | <section> | |\n| 16 | <h2> Ipsum</h2> | |\n| 17 | </section> | |\n| 18\
    \ | | |\n\nWhen a web browser **renders** (draws) an element in a web page, it\
    \ has to assess which style rule to apply to that element. But if it were rendering\
    \ an element that displays text, such as <h2>, but no font-family property has\
    \ been defined in the style rule applied to that element – how does the browser\
    \ determine which font to use? The answer is that it looks to the parent and copies\
    \ the font-family property from there.\n\nAbove: HTML-nested structure is expressed\
    \ in terms of ancestry. Here <h2> is the child of <section>, and <section> is\
    \ the parent of <h2>.\n\nIf a parent element also lacks a style property then\
    \ that property is inherited from the parent's parent, and so on. Ultimately we\
    \ have a 'cascade' of style properties in which a property applied to one element\
    \ will be inherited by the children of that element unless a child specifically\
    \ overrides with a new rule of its own. When this happens the properties of the\
    \ new rule are passed into the inheritance chain.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_22_0.png)\n\
    \n## Components of CSS\n\n- Selector: Targets the HTML element(s) that style rules\
    \ will be applied to.\n- Style command: Specifies a style property and assigns\
    \ a value to it (aka 'property-value pair').\n- Style rule: A collection of style\
    \ properties and their associated values.\n\nRight: A complete CSS stylesheet\
    \ containing multiple selectors and style rules.\n\n```\nbody {\n  position:relative;\n\
    \  background-color:#FD5F12;\n  margin:0px;\n  padding:0px;\n  width:100%;\n \
    \ height:100%;\n}\n```\n\n```\n#pageBg {\n  position:fixed;\n  width:1024px;\n\
    \  left:0px;\n  right:0px;\n  top:0px;\n  bottom:0px;\n  margin:0px auto auto;\n\
    \  background-color:#D9D0D9;\n}\n```\n\n```\nheader {\n  position:relative;\n\
    \  width:1024px;\n  height:130px;\n  margin:0px auto auto;\n  padding:0px;\n \
    \ background-color:#778081;\n  border:none;\n  border-bottom:2px solid #FDSF12;\n\
    }\n```\n\n```\nnav {\n  position:relative;\n  width:788px;\n  height:30px;\n \
    \ margin:0px auto auto;\n  padding:0px 118px 0px 118px;\n  background-color:#D9D0D9;\n\
    \  border:none;\n  border-bottom:1px solid #FDSF12;\n}\n```\n\n## ESSENTIAL ELEMENTS\n\
    \nAs we have learned, an HTML document is made up of a structure of elements,\
    \ each of which performs a certain role. This document acts like a set of instructions\
    \ for a web browser, telling it what to draw where. Let's look at the essential\
    \ elements required by all documents.\n\n## THE DOCTYPE DECLARATION\n\nThere are\
    \ a couple of different dialects of HTML that are currently in use – HTML5, the\
    \ most up-to-date, and XHTML. This book is concerned only with the former, so\
    \ suffice to say that\n\n```\n1 <!DOCTYPE HTML>\n2\n3\n4\n5\n```\n\n> Above: All\
    \ HTML documents start with a DOCTYPE declaration; this is the declaration for\
    \ HTML5.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_23_0.png)\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_24_0.png)\n\
    \nXHTML exists and isn't drastically different from HTML5 – in fact you'd struggle\
    \ to notice the difference if you didn't know what to look for!\n\nA web browser,\
    \ however, *has* to be able to tell the difference so that it knows how to render\
    \ the page. To this end *all HTML* documents start with a **DOCTYPE** declaration.\
    \ HTML5's declaration is `<!DOCTYPE HTML>`. This easy-to-remember declaration\
    \ must appear at the top of every HTML5 web page that you create.\n"
  mdcn: "\n\n## 修改元素\n\n虽然所有的 HTML 元素都有其特定的用途，但几乎所有的元素都可以通过各种方式进行修改。例如，我们可能想要更改视频播放器的尺寸或标题的字体大小。\n\
    \n元素是通过调整元素的属性来修改的，这在起始标签中完成：\n\n```\n<video width=\"720\" height=\"360\">\n```\n\
    \n如你所见，属性名是在起始标签内声明的，后面跟着 `=`，然后是一个包裹在引号内的值。\n\n## HTML 的组成部分\n\n- 元素 (Element)：HTML\
    \ 的基本构建块\n- 标签 (Tag)：定义元素的开始和结束。\n- 属性 (Attribute)：修改元素的行为和外观。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_17_0.png)\n\
    \n```\n<video width=\"640\" width=\"360\" src=\"vids/intro.mp4\"></video>\n<section\
    \ lang=\"en\">\n  <article id=\"article_01\">\n    <h2 class=\"underlinedText\"\
    >Lorem ipsum dolor sit amet</h2>\n    <p class=\"redText\">Sed sagittis ante malesuada\
    \ velit. Curabitur suscipit.</p>\n  </article>\n</section>\n```\n\n上图：属性允许你修改元素。\n\
    \n## 使用样式进行操作\n\n在 HTML 的旧版本中，存在大量不同的属性来控制元素的视觉外观。更重要的是，不同元素它们所能识别的属性集合也差异巨大。记住所有的内涵和变化是一场噩梦，因此\
    \ `style` 属性被开发出来。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_18_0.png)\n\n##\
    \ 遵守规则\n\n赋值给 `style` 属性的值称为样式规则（style rule），它由一个或多个样式命令组成。样式命令是样式属性与应用于该属性的值的配对，例如：\n\
    \n```\n<body style=\"color:green; font-weight:bold;\">\n```\n\n每个样式属性名（此例中的 `color`\
    \ 和 `font-weight`）后面跟着一个冒号 `:`，然后是赋值给该属性的值，最后是一个分号 `;`。\n\n| 行 | | |\n|---||||\n\
    | 8 | | |\n| 9 | | |\n| 10 | <header style=\"font-size:18px; color:blue;\"> |\n\
    | 11 | <h1 style=\"font-weight:bold;\">HTML 和 CSS 基础</h1> |\n| 12 | <h2 style=\"\
    font-size:14px;\">学习互联网语言</h2> |\n| 13 | | |\n| 14 | </header> |\n| 15 | | |\n\
    | 16 | | |\n| 17 | <video width=\"640\" width=\"360\" src=\"vids/introvid.mp4\"\
    ></video> |\n| 18 | | |\n\n上图：`style` 属性允许你为元素添加内联样式（inline styling）。\n\n## CSS\
    \ 简介\n\n如果说 HTML 是房子的砖块和灰浆，那么 CSS 提供了装饰。这种语言简单但威力巨大，没有它，你的网页看起来会非常糟糕。\n\n### 什么是\
    \ CSS？\n\n我们已经查看了如何向元素的 `style` 属性添加样式规则。这被称为**内联**（Inline）样式——它虽然有效，但有一个固有的问题：如果你想更改所有文本标题的字体，那么你必须在每个标题元素出现的地方编辑\
    \ `font-family` 样式属性。这正是 **CSS** 登场的地方。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_19_0.png)\n\
    \nCSS 代表级联样式表（Cascading Style Sheets）。它提供了将页面内容与页面外观分离的方法，并允许同时对多个元素应用样式规则。它的一个关键优势是，对\
    \ CSS 样式规则进行的任何更改都将影响所有与它关联的元素。\n\n```\nheader {\n  position:relative;\n  width:1024px;\n\
