    \    this.linkData = itemData.linkData;\n    this.isSelected = false;\n    this.isHover\
    \ = false;\n  }*/\n  this.posterImage = itemData.posterImage;\n  // add icon\n\
    \  switch(this.linkType) {\n    case \"video\":\n  }\n}\n```\n\n**Above:** Block\
    \ comments can extend across multiple lines.\n"
