    # # DATA MECHANICS


    Unlike lower-level programming languages such as C and JavaScript does not require
    the programmer to get involved in the details of how data is stored on the computer
    — the interpreter manages the intricacies for us.


    However, you should still appreciate that everything your computer does — every
    email you write, every song you listen to, every video you watch — is represented
    by numbers. Therefore, at the most fundamental level, all computer data is just
    numbers.


    > ### Hot Tip

    nThe binary and hexadecimal number systems are intrinsically tied to the way computers
    represent numbers and data — look them up on Wikipedia if you don''t know how
    they work.'
- md: "\n# DATA TYPES\n\nAll data handled by JavaScript has a data type. This specifies\
    \ the nature of the data being handled – whether it's a number, text, a list and\
    \ so on.\n\n# WHAT IS A DATA TYPE?\n\nIn order to translate a piece of data into\
    \ anything useful, a computer or program has to know what the data is intended\
    \ to represent – Because data is stored in variables, we normally refer to variables\
    \ as having a data type, or as being of type so and so. Data types fall into two\
    \ groups: primitive and reference. Let's take a look at what that means.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_152_0.png)\n\
    \n**Above:** Data types define the meaning of the raw numbers stored by a computer.\n\
    \n# PRIMITIVE AND REFERENCE DATA TYPES\n\nPrimitive data types can be thought\
    \ of as those whose data represents a single value, such as a number, while reference\
    \ data types represent complex data, such as a list.\n\nWhen a variable of a primitive\
    \ type is used in a script, the interpreter copies the variable's value and uses\
    \ this copy in its calculations. In contrast, when a variable of reference type\
    \ is used, the interpreter works directly with the data stored in memory.\n\n\
    | Variable name typed into an expression | Interpreter looks-up variable value\
    \ from memory | Data in memory |\n| --- | --- | --- |\n| myPrimitiveVar | value\
    \ | 0001111010011101 |\n| | Interpreter returns copy of looked-up value to expression\
    \ | |\n\nPrimitive data type\n\n| Variable name typed into an expression | Interpreter\
    \ locates variable in memory | Data in memory |\n| --- | --- | --- |\n| myReferenceVar\
    \ | | 0010111010011101 |\n| | Interpreter returns a reference to the variable\
    \ | |\n\nReference data type\n\nAbove: Primitive data types return a copy of their\
    \ in-memory value; reference types return a direct reference to their in-memory\
    \ value.\n\n# Understanding the Difference Between Primitive and Reference Data\
    \ Types\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_153_0.png)\n\n- 1. Create\
