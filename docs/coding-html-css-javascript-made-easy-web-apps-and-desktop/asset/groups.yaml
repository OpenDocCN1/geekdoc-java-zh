    \ colleague \"38 plus 4\", which she has replied \"42\". The thing that made the\
    \ difference was the inclusion of the addition operator, +.\n\n## WHAT IS AN OPERATOR?\n\
    \nAs we've just seen, for an expression to have meaning, it typically includes\
    \ an operator; the operator defines how the data within the expression should\
    \ be evaluated in order to obtain a value for the expression.\n\n| 38 + 4 |\n\
    | 2 |\n| 3 \"Hello \" + \"World\" |\n| 4 |\n| 5 myVariable = true |\n| 6 |\n|\
    \ 7 quizQuestion.questionText |\n| 8 |\n| 9 getMyValue() |\n| 10 |\n| 11 myObject.doSomething()\
    \ |\n\nAbove: Operators give meaning and purpose to expressions.\n\n## Operands\n\
    \nIn the context of operators, the value(s) being processed are referred to as\
    \ operands. Many operators expect two operands, one on either side of the operator\
    \ (referred to as the left and right operands). Others – called unary operators\
    \ – work with only a single operand, while still fewer work with three or more\
    \ operands.\n\n## A PLETHORA OF OPERATORS\n\nThere are many different JavaScript\
    \ operators – too many to cover here – so let’s stick with the most common ones.\n\
    \n## The Dot Operator\n\nWe've already met the dot operator ‘.’ – it enables us\
