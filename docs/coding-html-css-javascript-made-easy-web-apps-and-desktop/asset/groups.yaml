    # FOREWORD


    We live in a connected world. We share news, stories and images; our noblest aspirations
    and darkest nightmares (not to mention a lot of cat pictures) criss-cross the
    globe in an ever-increasing rate, whilst our appetite to consume this infinite
    variation of human thought (and cute cat pictures) seems boundless.


    The conduit for all this information, the pipes through which the data flows –
    the enchanted loom through which global culture intertwines and advances – is
    the internet. Learning to speak the language of the internet, then, is both empowering
    and rewarding.


    Many people believe that programming is hard to learn; nothing could be further
    from the truth. If you know that 1 + 2 = 3, and that you have to open the fridge
    door before you take out the milk, then you can program!


    Of course, mastering any language – human or computer – requires dedicated study
    over an extended period of time. But just as it''s simple to learn enough French
    to communicate with the locals on a holiday to Paris, so it easy to get to grips
    with the basics of most computer languages.


