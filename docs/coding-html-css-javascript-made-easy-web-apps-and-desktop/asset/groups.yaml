    # 编程 HTML • CSS • JAVASCRIPT 轻松上手


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_31_0.png)


    请注意，使用多个样式表会增加对元素样式属性应用冲突值的风险。如果一个元素的显示效果不符合预期，那么值得深入检查以查看出现问题的样式规则是源自何处。


    # 应用样式的方法


    - 内联样式（Inline）：样式规则声明在元素的 `style` 属性中。

    - 嵌入式（Embedded）：CSS 代码写在 HTML 文档的 `<style>` 元素内部。

    - 外部（External）：CSS 代码写在独立的文本文件中，并通过 `<link>` 元素与 HTML 文档关联。


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_31_1.png)


    左图：将 CSS 规则应用到 HTML 元素的三种方法。


    # HTML5 的新特性


    HTML5 仍然是 HTML，但它只是该语言的最新版本。它包含了以前版本中的许多许多元素，但也引入了许多新元素和规则。通常情况下，当有人使用 HTML5 时，他们指的是这些新特性。


    # 语义化元素


    HTML5 的目标之一是在语言中引入清晰且一致的语义化，使得元素名称能够传达关于元素用途以及它在文档逻辑结构中位置的信息。


    > 提示：语义化元素对于辅助视障人士进行网页浏览的屏幕阅读器应用程序特别有帮助。


    | HTML5 特性语义化 | 语义化是 Web 平台与其他平台相比的最显著的特征之一。开发者通常会忽略或降低此类特性的优先级，但精通它可以为我们的项目带来许多益处。
    |

    | 文本和文字具有意义。最终，我们的浏览器读取的内容是纯文本。网站和应用程序是在一个生态系统中创建的，在这个系统中，文本内容是可以链接、可搜索和可组合（mashable）的。在开放网上，我们希望内容能被第三方、搜索引擎和无障碍工具展示、馈送和修复。所有这些益处并非免费。自动化工具在识别内容本质方面只能完成工作工作。开发者对内容正确语义的标记做得越好，其他代理（agents）处理起来就越容易。HTML5
    还提供了一系列工具让生活变得简单：* 新媒体元素。* 新结构元素。* 国际化的新语义。* 新链接关系类型。* 新属性。* 新表单类型。* 用于额外语义的新微数据语法。
    |


    **上图：** HTML5 非常重视语义化。


    # 编程 HTML • CSS • JAVASCRIPT 轻松上手


    因此，它包含了一组新元素来满足对语义化的需求，例如 `<header>`, `<video>`, `<article>` 和 `<footer>`。元素名称准确传达了这些新元素的用途，这一事实使得它们具有语义化。


    ![](img/...33_0.png)


    # 新功能


    HTML5 为网页引入了许多新功能，这些功能以前需要安装如 Adobe Flash Player 等第三方插件到终端用户的浏览器中。这些新特性对开发者来说是一股清风，因为它们让添加诸如拖放、Web
    表单、视频、音频、“实时”图形（包括 3D）等许多功能变得极其简单。


    # 更适合移动设备


    许多流行的浏览器插件无法安装在移动操作系统上。HTML5 通过消除对许多第三方插件的需求解决了这个问题，因此如果你希望你的网页在移动设备上被查看，HTML5
    是唯一的选择。


