    \ practice. The first step is to create an HTML document and add the basic structure\
    \ of elements that we're going to use.\n\n## CREATE A WORKING FOLDER\n\nThe first\
    \ thing to do is create a folder in which to store all of the files for our page.\
    \ Your Documents folder would be a good place for this, or better still, create\
    \ a folder called MySites inside your Home folder; this can be a central location\
    \ for all of the sites you develop. Wherever you put it, the folder you create\
    \ for an individual site should have the same name as the site. Let's call this\
    \ one MySite.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_75_0.png)\n\n> Hot Tip\n\
