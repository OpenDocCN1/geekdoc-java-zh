    \ CSS 如何创建网站的外观，允许你应用样式规则使每个页面看起来既专业又美观。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_3_0.png)\n\
    \n本章进一步探讨了 HTML 和 CSS，扩展了上一章的观点帮助你获得更丰富的知识。特别是，它研究了 HTML 元素，包括页眉、页脚和其他结构元素。然后章节转向\
