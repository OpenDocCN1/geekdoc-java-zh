    15  bodyElement.appendChild(newPara);\n16  </script>\n17\n```\n**上所示：** 复合语句可以拆分为独立的语句。\n\
    \n- 1. 创建一个新的 HTML 文档\n- 2. 创建一个新的 `<script>` 元素\n- 3. 添加一个简单的变量声明\n- 4. 添加另一个\
    \ `<script>` 元素\n- 5. 保存工作并在浏览器中打开。\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n\
    \  <title>If 示例</title>\n  <script type=\"text/javascript\">\n    varAge = 36;\n\
    \  </script>\n</head>\n```\n\n```html\n<body>\n  <script type=\"text/javascript\"\
