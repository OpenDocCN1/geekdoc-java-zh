  - '[PAGE 91]


    # ADDING MEDIA TO YOUR WEBSITE


    Most websites contain a lot more than just text. Images, video and audio can greatly
    increase your visitor numbers and encourage them to stay longer. Advanced HTML5
    features such as geolocation can improve your site''s interactions with your visitors
    and, of course, adding a sprinkle of visual polish is always a good idea.


    # WORKING WITH IMAGES


    Alongside text, images are the element that almost every website has in common.
    Very rarely will you find a contemporary website with a total lack of imagery.
    Images are extremely versatile and have the potential to make a website much more
    visually appealing.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_91_0.png)'
  - '[PAGE 92]


    # IMAGE FORMATS


    Images come in variety of formats, but on the web there are effectively three
    formats used: GIF, PNG and JPG. The GIF format is a hangover from the early days
    of the web and is becoming increasingly uncommon. PNG and JPG, on the other hand,
    are widely used. Both have specific advantages and disadvantages, but together
    they can satisfy all situations.


    # The PNG Format


    PNG (Portable Network Graphics, pronounced ''ping'') is the best option for graphics
    (as opposed to photo-based imagery) because typically they use lossless compression
    and so offer better sharpness and accuracy than JPG. Their other benefit is that
    they support transparency. This means that a PNG image needn''t have a solid-coloured
    background, and anything behind them can show through the transparent areas of
    the PNG.


    **Below:** The PNG image format is often the best for small graphic elements like
    logos.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_92_0.png)'
  - '[PAGE 93]


    # The JPG Format


    The JPG format (also known as JPEG, pronounced ''jay-peg'') uses a complex image
    compression technique to reduce the file size of an image without visibly degrading
    it. This means that the images can be saved at different quality levels to reduce
    the file size of an image. The higher the level, the better the quality, but the
    larger the file size; the developer can choose where to strike the balance. JPGs
    don''t support transparency and so are not suitable for graphics.


    > When creating images and graphics, work from a full quality editable version
    in a lossless format such as PSD (Photoshop''s native format), export the graphics
    you need as PNG or JPG files.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_93_0.png)


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_93_1.png)


    # JPEG


    From Wikipedia, the free encyclopedia


    For other uses, JPEG (disamiguation). In computing, JPEG (/ˈdʒɛpeg/ (seen most
    often with the .jpg file extension)) is a commonly used method of lossless compression
    for digital images, particularly for those produced by digital photography. The
    degree of compression can be adjusted, allowing flexibility. JPEG typically achieves
    10:1 compression with little perceptible loss in image quality.


    JPEG compression is used in a number of image files. JPEG/ExIF is the most common
    format used by digital cameras and other photographic image capture devices; with
    JPEG/EXIF, the most common format for storing and transmitting photographic images
    on the World Wide Web. These variations are not distinguished, and are simply
    called JPEG.


    JPEG is an acronym for the Joint Photographic Experts Group, which created the
    standard. The MIME type for JPEG is image/jpeg (defined in RFC 1371), except in
    Internet Explorer, which provides a MIME type of image/png when uploading JPEG
    [images].


    JPEG supports a maximum image size of 65535 pixels — one to four gigixels (100
    megapixels), depending on aspect ratio (from 3:1 to 4).


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_93_2.png)


    Above: Photos are usually saved in the JPG format.'
