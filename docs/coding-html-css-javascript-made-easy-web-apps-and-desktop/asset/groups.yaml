    0\">\n<tr>\n<td><a href=\"google.com\">Google</a></a></td>\n</tr>\n</table>\n\
    </body>\n</</html>\n```\n\n# 创建网站 70\n\n在本章中，学习如何规划、构建和样式化网站。通过易于遵循的循序渐进指令以及你已经学到的所有知识，到结束时你将拥有自己独特的网站并在运行。此外，本章还展示了如何使用\
    \ CSS 为你的网页设置样式，并使用 WordPress 为你的网站添加博客。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_4_0.png)\n\
    \n# 图像、视频和其他增强 90\n\n通过向你的网站添加图像、音频和视频，你将其提升到另一个层次，使其更吸引人，从而增加可能访问的人数。本章将引导你处理图像、音频和视频，包括要使用的最佳文件格式以及如何将每一项添加到你的网站。此外，这里还涵盖了\
    \ HTML5 基础、CSS 过渡和 CSS 关键帧。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_4_1.png)\n\
    \n# 高级 HTML & CSS 编程 112\n\n在本章中进一步提升你的知识，学习字符实体、自适应布局和响应式网页设计 (RWD)。如果你希望你的网站在所有设备（包括智能手机和平板电脑以及桌面电脑）上看起来良好，那么\
    \ RWD 就至关重要。掌握如何在移动浏览器上充分利用你的网站，以及哪些浏览器支持最好。这里还包含了故障排除指南。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_4_2.png)\n\
    \n# 编程 HTML CSS • JAVASCRIPT 从易就简\n\n# 认识 JavaScript... 132\n\n读者，你好 JavaScript——JavaScript，你好读者。在这里确切了解\
