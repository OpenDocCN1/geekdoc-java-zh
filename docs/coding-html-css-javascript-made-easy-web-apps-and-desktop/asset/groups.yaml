    \ Simple Quiz project.\n\n- 1. Open quizQuestions.js in your editor and create\
    \ a couple of empty lines at the top of the document.\n\n- 2. We're going to use\
    \ com.flametreepublishing as our namespace – this means we need to create an object\
    \ called the global namespace and another called flametreepublishing inside the\
    \ com object.\n\n- 3. Copy the code shown in the illustration (right). After declaring\
    \ – but not initializing – com, we test that each namespace object does not exist\
    \ before initializing it (see Logical NOT Operator, page 57). This is to avoid\
    \ initializing existing namespace.\n\n```javascript\ncom.flametreepublishing.questions\
    \ = [];\nvar com;\nif(com) {\n com = {};\n}\nif(com.flametreepublishing) {\n com.flametreepublishing\
    \ = {};\n}\n```\n\nAbove: Step 3 Copy the code shown here into your editor.\n\n\
