    # 186 CODING HTML • CSS • JAVASCRIPT MADE EASY


    All we do is distribute the expressions among more statements. However, in order
    to share the results of the expressions in one statement with another, we would
    need to store the result of each statement in a variable, so that the other statements
    have access to those values.


    # Balancing Speed Against Legibility


    Creating and managing variables adds to the interpreter’s workload, so complex
    multiple expressions are generally executed more quickly than the same expressions
    broken down into multiple statements. While choosing how simple – or complex –
    to make your statements is largely down to personal preference, you do need to
    think about how performance-critical the application is.


