- md: "\n# CODING HTML • CSS • JAVCRIPT MADE EASY\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_115_0.png)\n\
    \n## CHARACTER ENTITIES\nThe solution to both of these scenarios is something\
    \ called character entities. To use these you type a special little bit of code\
    \ into the HTML text which, when rendered, will be displayed as the desired character.\
    \ All special characters and many extended characters have their own dedicated\
    \ character entity.\n\n## How to Write a Character Entity\n\nCharacter entities\
    \ consist of an ampersand '&' followed by an entity name, such as 'quot', and\
    \ are rounded off with a semicolon ';'. To create a quote character, we type &amp;quot;\
    \ rather than typing an actual quote mark. Interestingly, because an ampersand\
    \ is itself a character, you have to write &amp;amp; to make one in the rendered\
    \ text of your page.\n\n```\n<<body><header><h1>Special Characters</h1></header><section><p>&quot;There\
    \ are many special characters in HTML&quot; said the man. &quot;Characters such\
    \ as &lt;&amp; &gt; can not be typed directly into the text of an HTML document&quot;\
    \ he said.</p><p>He went to explain that the same was true of &quot;extended&quot;\
    \ characters such as &copy;, &micro; and many more. Accented latin characters,\
    \ such as &Acute; &Egrave; are also classed as extended characters, he explained.</p></section></body>\n\
    ```\n\n**Above:** All special and many extended characters are represented by\
    \ character entities.\n\n## ADVANCED HTML & CSS CODING\n\n## Unnamed Entities\n\
    \nNot all extended characters have a predefined entity, so how do we include such\
    \ a character in a page? This time we have to use a character code reference instead\
    \ of an entity name – it looks like: &#x00A9; (this would be a © character). The\
    \ '#' states that what follows is a character code and the 'X' states the code\
    \ is being supplied in Unicode format. A discussion of Unicode is beyond the scope\
    \ of this book, but you can look up the code for any character at http://unicode-table.com/\n\
    \n> Hot Tip\n> There are many different character entity names. If your HTML editor\
    \ supports code hinting this will help you find the one you want. Otherwise, keep\
    \ a bookmark somewhere that points to http://dev.w3.org/html5/html-author/charref.\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_116_0.png)\n\n```\n<body>\n<header>\n\
    <h1>Special Characters</h1>\n</header>\n<section>\n<p>&quot;There are many special\
    \ characters in HTML&quot; said the man.&quot; Characters such as &lt; &amp; &apos;\
    \ can't be typed directly into the text of an HTML document&quot; he said.</p>\n\
    <p>He went on to explain what was true of &quot;extended&quot; Accented latin\
    \ characters, such as &Aacute;&acute; and &Erave; are also accented characters,\
    \ he explained.</p>\n</section>\n</body>\n```\n\n**Above:** Code hinting can be\
    \ a huge help in finding the desired character entity.\n\n## ADAPTIVE LAYOUTS\n\
    \nBuilding websites is no longer a case of creating a website that looks good\
    \ on a desktop computer. Mobile devices – smartphones and tablets – are now widely\
    \ used for web browsing, and this has an impact on how we lay out and style web\
    \ pages.\n\n```css\nbody {\n  font-family:\"Lato\";\n  font-size:14px;\n}\n\n\
    #wrapper {\n  width:80%;\n  height:auto;\n  margin-left:auto;\n  margin-right:auto;\n\
    }\n\nsection {\n  width:70%;\n  height:auto;\n  float:left;\n}\n\naside {\n  width:30%;\n\
    \  float:left;\n}\n\nfooter {\n  width:100%;\n  height:auto;\n  float:left;\n\
    \  background-color:lightgray;\n  border-top:1px solid gray;\n  padding-left:1%;\n\
    \  padding-bottom:1%;\n}\n```\n\n## FIT TO ALL SCREENS\n\nThere are several options\
    \ when it comes to making a site for all screens, big and small. One approach\
    \ that has been around since the early days of the internet is proportional –\
    \ aka ‘liquid’ – layouts. When using this technique we express positions and dimensions\
    \ in percentage terms. This causes the layout to scale to the size of the browser\
    \ window.\n\n- Left: Expressing dimensions as percentages is one way to make your\
    \ pages adapt to the browser window's dimensions.\n\n## CREATING A LIQUID LAYOUT\n\
    \nWhen creating a <div> or other structural element, it is common to specify a\
    \ width for it in absolute terms, for example, 1000px ('px') is the code you use\
    \ in CSS to denote pixels. If the browser window's width is less than this then\
    \ some of the page will spill over the edges and won't be visible without scrolling.\n\
    \nStating sizes in percentages solves this problem to a certain degree because\
    \ it keeps things in proportion: if a <div> element's width is set to 80% then\
    \ it will always be 80 per cent the width of its containing block. Throw together\
    \ a few coloured <div> elements in a page to see how this works.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_118_0.png)\n\
    \n**Above:** This shows how liquid layouts work.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_118_1.png)\n\
    \n# CODING HTML • CSS • JAVCRIPT\n\n```html\n<html>\n<head>\n  <title>Untitled\
    \ Document</title>\n</head>\n<body>\n  <header>\n    <h1>Special Characters</h1>\n\
    \  </header>\n  <section>\n    <p>There are many special characters in HTML.</p>\n\
    \  </section>\n</body>\n</html>\n```\n\n**Above:** This is an example of HTML\
    \ structure.\n\n## RESPONSIVE WEB DESIGN\n\nResponsive Web Design, also known\
    \ as RWD, is a technique for making a page or site adapt automatically to the\
    \ type and size of device on which it is viewed.\n\n## MEDIA QUERIES\n\nResponsive\
    \ Web Design is powered by what are known as media queries. These are a component\
    \ of CSS that allow you to use values that aren't determined until the page is\
    \ loaded. So instead of setting a <header> element to be, say, 100 pixels wide,\
    \ you could set it to always match the width of the browser window, no matter\
    \ wide that window, like this:\n\n```css\nheader {width:device-width};\n```\n\n\
    **Above:** The Boston Globe's website is one of the original examples of Responsive\
    \ Web Design.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_120_0.png)\n\n## DIFFERENT\
    \ DEVICES, DIFFERENT STYLE SHEETS\n\nDesktop, tablet and smartphone screens are\
    \ all of different widths and resolutions. The way to deal with this is to create\
    \ multiple versions of a style sheet, each one tailored to support a specific\
    \ class of device. The browser will then select a sheet based on the <style>/<link>\
    \ element's media attribute value.\n\n```html\n<link rel=\"stylesheet\" type=\"\
    text/css\" href=\"handheldSmall.css\" media=\"handheld and max-device-width:480px\"\
    />\n<link rel=\"stylesheet\" type=\"text/css\" href=\"handheldLarge.css\" media=\"\
    handheld and min-device-width:481px\"/>\n\n<style media=\"all and not handheld\"\
    >\n  body {\n    Font-family:Lux;\n  }\n\n  #wrapper {\n    width:1000px;\n  \
    \  height:auto;\n  }\n</style>\n```\n\n## Same Meat, Different Gravity\n\nThe\
    \ various style sheets will all contain the same selectors, and the same style\
    \ properties will be used in each selector's style rule. What will be different\
    \ the values assigned to the style properties. This means that the entire layout\
    \ of your page will adapt itself to the user's device.\n"
  mdcn: "\n\n# 轻松上手 HTML • CSS • JAVCRIPT\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_115_0.png)\n\
    \n## 字符实体\n这两种场景的解决方案被称为“字符实体”（character entities）。要使用它们，你需要在 HTML 文本中输入一段特殊的短代码，这段代码在渲染时将显示为所需的字符。所有的特殊字符和许多扩展字符都有专属的字符实体。\n\
    \n## 如何编写字符实体\n\n字符实体由一个和符号 `&` 后面跟着一个实体名称（例如 `quot`），并以分号 `;` 结尾。为了创建一个引号字符，我们输入\
    \ `&quot;` 而不是输入实际引号。有趣的是，因为 `&` 本身也是一个字符，所以你必须在页面的渲染文本中编写 `&amp;` 才能显示出一个 `&`。\n\
    \n```\n<<body><header><h1>Special Characters</h1></header><section><p>&quot;There\
    \ are many special characters in HTML&quot; said the man. &quot;Characters such\
    \ as &lt;&amp; &gt; can not be typed directly into the text of an HTML document&quot;\
    \ he said.</p><p>He went to explain that the same was true of &quot;extended&quot;\
    \ characters such as &copy;, &micro; and many more. Accented latin characters,\
    \ such as &Acute; &Egrave; are also classed as extended characters, he explained.</p></section></body>\n\
    ```\n\n**上方：** 所有特殊字符和许多扩展字符都通过字符实体表示。\n\n## 高级 HTML & CSS 编码\n\n## 未命名实体\n\n\
    并不是所有的扩展字符都有预定义的实体，那么我们如何在页面中包含此类字符呢？这次我们必须使用字符代码引用而不是实体名称——它看起来像这样：`&#x00A9;`（这将代表一个\
    \ © 字符）。`#` 表示后面的是字符代码，而 `X` 表示该代码是以 Unicode 格式提供的。关于 Unicode 的讨论超出了本书的范范围，但你可以在\
    \ http://unicode-table.com/ 查找任何字符的代码。\n\n> 小贴士\n> 有许多不同的字符实体名称。如果你的 HTML 编辑器支持代码提示（code\
    \ hinting），这将帮助你找到所需的那个。否则，请在某处保留指向 http://dev.w3.org/html5/html-author/charref\
    \ 的书签。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_116_0.png)\n\n```\n\n<body>\n\
    <header>\n<h1>Special Characters</h1>\n</header>\n<section>\n<p>&quot;There are\
    \ many special characters in HTML&quot; said the man.&quot; Characters such as\
    \ &lt; &amp; &apos; can't be typed directly into the text of an HTML document&quot;\
    \ he said.</p>\n<p>He went on to explain what was true of &quot;extended&quot;\
    \ Accented latin characters, such as &Aacute;&acute; and &Erave; are also accented\
    \ characters, he explained.</p>\n</section>\n</body>\n```\n\n**上方：** 代码提示对于寻找所需的字符实体有巨大的帮助。\n\
    \n## 自适应布局\n\n构建网站已不再仅仅是创建一个在桌面电脑上看起来良好的网站。移动设备——智能手机和平板电脑——现在被广泛用于网页浏览，这影响了我们布局和样式化网页的方式。\n\
    \n```css\nbody {\n  font-family:\"Lato\";\n  font-size:14px;\n}\n\n#wrapper {\n\
    \  width:80%;\n  height:auto;\n  margin-left:auto;\n  margin-right:auto;\n}\n\n\
    section {\n  width:70%;\n  height:auto;\n  float:left;\n}\n\naside {\n  width:30%;\n\
    \  float:left;\n}\n\nfooter {\n  width:100%;\n  height:auto;\n  float:left;\n\
    \  background-color:lightgray;\n  border-top:1px solid gray;\n  padding-left:1%;\n\
    \  padding-bottom:1%;\n}\n```\n\n## 适应所有屏幕\n\n在为所有大小的屏幕制作网站时，有几种选择。一种自互联网早期以来一直存在的方法是比例——也称为“流式”（liquid）布局。使用这种技术时，我们用百分比来表示位置和尺寸。这导致布局随浏览器窗口的大小进行缩放。\n\
    \n- 左：将维度表示为百分比是使页面适应浏览器窗口尺寸的方法之一。\n\n## 创建流式布局\n\n在创建 `<div>` 或其他结构元素时，通常会为其指定一个绝对的宽度，例如，`1000px`（'px'）是你在\
    \ CSS 中用于表示像素的代码。如果浏览器窗口的宽度小于此值，那么页面的某些部分将溢出边缘，且在不滚动的情况下将不可见。\n\n用百分比表示尺寸在某种程度上解决了这个问题，因为它保持了比例：如果一个\
    \ `<div>` 元素的宽度设置为 `80%`，那么它将始终是其容器块宽度的 80%。在页面中随机组合几个彩色的 `<div>` 元素来查看它是如何工作的。\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_118_0.png)\n\n**上方：** 这展示了流式布局是如何工作的。\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_118_1.png)\n\n# 轻松上手 HTML • CSS • JAVCRIPT\n\
    \n```html\n<html>\n<head>\n  <title>Untitled Document</title>\n</head>\n<body>\n\
    \  <header>\n    <h1>Special Characters</h1>\n  </header>\n  <section>\n    <p>There\
    \ are many special characters in HTML.</p>\n  </section>\n</body>\n</html>\n```\n\
    \n**上方：** 这是一个 HTML 示例。\n\n## 响应式网页设计\n\n响应式网页设计（也称为 RWD）是一种让页面或网站自动适应查看它的设备类型和大小的技术。\n\
    \n## 媒体查询\n\n响应式网页设计由“媒体查询”（media queries）驱动。这些是 CSS 的组件，允许你使用在页面加载时才能确定的值。因此与其将\
    \ `<header>` 元素设置为 100 像素宽，你可以将其设置为匹配浏览器窗口的宽度，无论窗口有多宽，如下：\n\n```css\nheader {width:device-width};\n\
    ```\n\n**上方：** 波士顿环报网站是响应式网页设计的早期示例之一。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_120_0.png)\n\
    \n## 不同设备，不同样式表\n\n桌面、平板和平手机屏幕的宽度和分辨率都不同。处理这个问题的方法是创建多个版本的样式表，每个版本都为支持特定类的设备而定制。浏览器将根据\
    \ `<style>`/`<link>` 元素的 `media` 属性值选择样式表。\n\n```html\n<link rel=\"stylesheet\"\
    \ type=\"text/css\" href=\"handheldSmall.css\" media=\"handheld and max-device-width:480px\"\
    />\n<link rel=\"stylesheet\" type=\"text/css\" href=\"handheldLarge.css\" media=\"\
    handheld and min-device-width:481px\"/>\n\n<style media=\"all and not handheld\"\
    >\n  body {\n    Font-family:Lux;\n  }\n\n  #wrapper {\n    width:1000px;\n  \
    \  height:auto;\n  }\n</style>\n```\n\n## 内容相同，属性不同\n\n不同的样式表包含相同的选择器，并且每个选择器规则中使用的相同的样式属性。不同的是分配给样式属性的值。这意味着整个页面的布局将自动适应用户的设备。\n\
    \n"
