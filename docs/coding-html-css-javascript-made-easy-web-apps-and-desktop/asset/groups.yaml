    \n## 访问数组元素\n\n数组中的每个元素都有一个索引（index），这是一个指向元素在数组中位置的数字。第一个元素的索引为 0，第二个索引为 1，依此类推。要访问数组的特定元素，我们编写变量名，加上包裹在方括号中的索引数字。例如，如果我们想使用\
    \ `myArray` 的第三个元素（索引为 2），我们写 `myArray[2]`。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_160_0.png)\n\
    \n## 向数组添加元素\n\n我们也可以使用方括号为数组元素赋值。例如，要设置数组 `myArray` 的第八个元素（索引为 7），我们可以输入 `myArray[7]\
