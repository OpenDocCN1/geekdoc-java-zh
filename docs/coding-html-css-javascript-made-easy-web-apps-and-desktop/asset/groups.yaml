    # IMAGES, VIDEO & OTHER ENHANCEMENTS\n\n# ADDING MEDIA TO YOUR WEBSITE\n\nMost\
    \ websites contain a lot more than just text. Images, video and audio can greatly\
    \ increase your visitor numbers and encourage them to stay longer. Advanced HTML5\
    \ features such as geolocation can improve your site's interactions with your\
    \ visitors and, of course, adding a sprinkle of visual polish is always a good\
    \ idea.\n\n# WORKING WITH IMAGES\n\nAlongside text, images are the element that\
    \ almost every website has in common. Very rarely will you find a contemporary\
    \ website with a total lack of imagery. Images are extremely versatile and have\
    \ the potential to make a website much more visually appealing.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_91_0.png)\n\
    \n# IMAGE FORMATS\n\nImages come in variety of formats, but on the web there are\
    \ effectively three formats used: GIF, PNG and JPG. The GIF format is a hangover\
    \ from the early days of the web and is becoming increasingly uncommon. PNG and\
    \ JPG, on the other hand, are widely used. Both have specific advantages and disadvantages,\
    \ but together they can satisfy all situations.\n\n# The PNG Format\n\nPNG (Portable\
    \ Network Graphics, pronounced 'ping') is the best option for graphics (as opposed\
    \ to photo-based imagery) because typically they use lossless compression and\
    \ so offer better sharpness and accuracy than JPG. Their other benefit is that\
    \ they support transparency. This means that a PNG image needn't have a solid-coloured\
    \ background, and anything behind them can show through the transparent areas\
    \ of the PNG.\n\n**Below:** The PNG image format is often the best for small graphic\
    \ elements like logos.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_92_0.png)\n\
    \n# The JPG Format\n\nThe JPG format (also known as JPEG, pronounced 'jay-peg')\
    \ uses a complex image compression technique to reduce the file size of an image\
    \ without visibly degrading it. This means that the images can be saved at different\
    \ quality levels to reduce the file size of an image. The higher the level, the\
    \ better the quality, but the larger the file size; the developer can choose where\
    \ to strike the balance. JPGs don't support transparency and so are not suitable\
    \ for graphics.\n\n> When creating images and graphics, work from a full quality\
    \ editable version in a lossless format such as PSD (Photoshop's native format),\
    \ export the graphics you need as PNG or JPG files.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_93_0.png)\n\
    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_93_1.png)\n\n# JPEG\n\nFrom Wikipedia,\
    \ the free encyclopedia\n\nFor other uses, JPEG (disamiguation). In computing,\
    \ JPEG (/ˈdʒɛpeg/ (seen most often with the .jpg file extension)) is a commonly\
    \ used method of lossless compression for digital images, particularly for those\
    \ produced by digital photography. The degree of compression can be adjusted,\
    \ allowing flexibility. JPEG typically achieves 10:1 compression with little perceptible\
    \ loss in image quality.\n\nJPEG compression is used in a number of image files.\
    \ JPEG/EXIF is the most common format used by digital cameras and other photographic\
    \ image capture devices; with JPEG/EXIF, the most common format for storing and\
    \ transmitting photographic images on the World Wide Web. These variations are\
    \ not distinguished, and are simply called JPEG.\n\nJPEG is an acronym for the\
    \ Joint Photographic Experts Group, which created the standard. The MIME type\
    \ for JPEG is image/jpeg (defined in RFC 1371), except in Internet Explorer, which\
    \ provides a MIME type of image/png when uploading JPEG [images].\n\nJPEG supports\
    \ a maximum image size of 65535 pixels — one to four gigixels (100 megapixels),\
    \ depending on aspect ratio (from 3:1 to 4).\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_93_2.png)\n\
    \nAbove: Photos are usually saved in the JPG format.\n\n# ADDING IMAGES\n\nThe\
    \ addition of images to a web page is a relatively simple process.\n\n# THE <IMG>\
    \ ELEMENT\n\nThe addition of images to a web page is a relatively simple process.\
    \ However, before adding images, we use the `<img>` tag, which is self-closing.\n\
    \n# How to Add an Image\n\nWhen adding images to a page, we use the `<img>` tag.\n\
    \n**Step 1:** The PNG image format is often the best for small graphic elements\
    \ like logos.\n\n**Step 2:** Locate the image in the HTML.\n\n**Step 3:** Create\
    \ an empty line in the HTML.\n\n**Step 4:** Now add the <img> element as shown\
    \ in the illustration. The name attribute value will be displayed in the place\
    \ of the image if the browser is unable to load it, the alt attribute value is\
    \ the text that is shown if the user hovers the mouse pointer over the image.\
    \ The src attribute value is the URL of the image to use (note we're using a relative\
    \ URL).\n\n**Step 5:** When defining a multiple of couples, it's not unusual to\
    \ split them into separate indented lines, making them easier to read.\n\n# CODING\
    \ HTML • CSS • JAVCRIPT\n"
