    # 什么是 CSS3？


    CSS3 仍然是 CSS；它是该语言的最新版本。它带来了许多让语言变得强大的增强。


    # 视觉效果


    CSS3 的主要进步之一是能够应用视觉效果，如阴影（drop shadow）或模糊（blur），这以前需要借助 Photoshop 等工具。现在，开发者只需通过
