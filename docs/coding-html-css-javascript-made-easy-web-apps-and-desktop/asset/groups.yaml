    10 var anyString = ""; // creates an empty string...

    11 anyString = ''A string can be demarked by single quotes'';

    12 anyString = "or it can be demarked by double quotes."

    13 anyString = ''A string demarked by single quotes "can" contain double quotes'';

    14 anyString = "A string demarked by double quotes ''can'' contain single quotes";

    15

    16 </script>

    17 </body>

    18 </html>

    ```


