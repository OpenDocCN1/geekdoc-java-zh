    \  <script type=\"text/javascript\" src=\"js/quizStartup.js\"></script>\n</head>\n\
    <body>\n\n</body>\n</html>\n```\n\nWhen the interpreter has finished executing\
    \ a script, control is returned to the browser, which then continues to process\
    \ the page.\n\n**Right:** JavaScript is processed in-place as the page loads.\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_142_0.png)"
