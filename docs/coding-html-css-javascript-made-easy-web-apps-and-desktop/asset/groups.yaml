    # BUILDING A WEBSITE


    The process of building a website is much more than just adding HTML and CSS.
    Here we show how to plan a site, build it with HTML and CSS, and how to get a
    website online.


    # PLANNING AND SKETCHING


    When building a web page it''s not simply a matter of jumping straight in and
    starting to code with HTML and CSS. Any good website will need some planning.
    This helps to determine the layout and where the various page elements are to
    be placed, in turn helping to speed up the design and development process.


    # What Should a Sketch Include?


    A sketch could be as simple as a few boxes showing the main layout elements and
    a few additional details. However, the more details and thought put into a sketch,
    the easier the build


    Below: Get a sketchpad to plan your site.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_71_0.png)'
  - '[PAGE 72]


    will be further down the line. For example, additional sketches could be made
    for specific elements of the site such as the <header>.


    # Web Site Design

    Home Page


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_72_0.png)


    # CREATE A WIREFRAME


    Once a final sketch (or sketches) has been completed the next step is to create
    a wireframe. This is not essential, but is another useful part of the planning
    process. A wireframe is a more precise version of a sketch, which helps determine
    the layout. Try out https: //wireframe.cc for quick and simple wireframe creation.


    Below: Creating a wireframe helps envisage a page layout.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_72_1.png)'
  - '[PAGE 73]


    # TOOLS OF THE TRADE


    You cannot build a website without the right tools. The basic set-up includes
    a text editor and an image editor. The text editor will be where the HTML and
    CSS is created, while the image editor will allow for the manipulation and modification
    of images and graphics.


    # TEXT EDITORS


    > Hot Tip

    If you are using TextEdit on a Mac, be sure to switch to plain text mode coding:
    [shift]+[cmd]+T].


    Windows and MacOS both come with text editors: Notepad and TextEdit respectively.
    These are ideal for beginners, but are very basic. There are some free editors
    worth checking out. Try Notepad++ (http://notepad-plus-plus.org); Brackets (http://brackets.io);
    CoffeeCup Free HTML Editor (http://www.coffeecup.com/free-editor/) or the more
    advanced Sublime Text (http://www.sublimetext.com)


    TopStyle 5, a powerful HTML5 & CSS3 editor for Windows.


    What makes TopStyle 5 special?

    What''s new in TopStyle 5?

    Download and try it free!


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_73_0.png)


    Above: Try different text editors to see which one works for you.'
