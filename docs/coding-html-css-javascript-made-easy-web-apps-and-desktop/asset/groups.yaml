    Becoming More Expressive

    Now consider the expression 38 + 4. This time, when evaluating the expression,
    the interpreter adds 38 and 4 – the result is the same as our previous example
    (the value 42), but we have achieved something by summing the two values.


    Sticking with our analogy, we have said to your colleague "38 plus 4", which she
    has replied "42". The thing that made the difference was the inclusion of the
    addition operator, +.


    # WHAT IS AN OPERATOR?


    As we''ve just seen, for an expression to have meaning, it typically includes
    an operator; the operator defines how the data within the expression should be
    evaluated in order to obtain a value for the expression.


    | 38 + 4 |

    | 2 |

    | 3 "Hello " + "World" |

    | 4 |

    | 5 myVariable = true |

    | 6 |

    | 7 quizQuestion.questionText |

    | 8 |

    | 9 getMyValue() |

    | 10 |

    | 11 myObject.doSomething() |


    Above: Operators give meaning and purpose to expressions.'
  - '[PAGE 176]


    # Operands


    In the context of operators, the value(s) being processed are referred to as operands.
    Many operators expect two operands, one on either side of the operator (referred
    to as the left and right operant)s). Others – called unary operators – work with
    only a single operand, while still fewer work with three or more operands.


    # A PLETHORA OF OPERATORS


    There are many different JavaScript operators – too many to cover here – so let’s
    stick with the most common ones.


    # The Dot Operator


    We''ve already met the dot operator ''.’ – it enables us to access the properties
    (and methods – see page 226) of objects. The left operand is a reference to an
    object, while the right one is the name of a property or method of that object.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_176_0.png)


    **Above:** Operands are the values that an operator will, umm, operate on.'
  - '[PAGE 177]


    # Arithmetic Operators


    An arithmetic operator performs arithmetic using the supplied operand(s) and returns
    the result of calculation. The operands must be numbers, or expressions that evaluate
    to numbers.


    > Hot Tip

    Go to https://en.wikibooks.org/wiki/JavaScript/Operators to find a complete list
    of JavaScript’s operators.


    | Operator | Number of operands | Name | Action | Example (result in brackets)
    |

    |---|---|---|---|--|

    | + | 2 | addition | Sums the left and right operands | 4 + 5 (9) |

    | - | 2 | subtraction | Subtracts the right operand from the left operand | 31
    - 14 (17) |

    | * | 2 | multiplication | Multiplies the left and right operands | 12 * 3 (36)
    |

    | / | 2 | division | Divides the left operand by the right operand | 12 / 3 (4)
    |

    | ++ | 1 | increment | Adds 1 to the value of the identifier that is the single
    operand | numUsers ++ (numUsers increases by 1) |

    | -- | 1 | decrement | Subtracts 1 from the value of the identifier that is the
    single operand | numUsers -- (numUsers decreases by 1) |'
  - '[PAGE 178]


    # String Operators


    There are a few different operators that can work with strings, but only one dedicated
    to strings:


    | Operator | Name | Action | Example (result in brackets) |

    | --- | --- | --- | --- |

    | + | concatenation | Joins two strings, returning the resulting string | "Hello"
    + "World" ("Hello World") |


    Note that the concatenation operator looks the same as the addition operator –
    the interpreter deduces which operator is intended based on the data types of
    the operands. If both operands evaluate to numbers, + is addition; if either operand
    evaluates to a string, then + is concatenation. Furthermore, if an operand of
    the concatenation operator evaluates to a number, it is cast to a string (see
    Data Type Casting, page 43).


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_178_0.png)


    > **Hot Tip**

    Our tables do not list ''Number of operands'' assume that these are binary operators
    – that is, they expect two operands.'
  - '[PAGE 179]


    # Assignment Operator


    We''ve already met this operator, whose left operand is always a variable or property
    reference, and whose right operand can be any literal, identifier or expression.


    | Operator | Name | Action | Example (result in brackets) |

    | --- | --- | --- | --- |

    | = | assignment | Assigns the value of the right operand to the variable or property
    indicated by the left operand | myVar = 42 (myVar now has a value of 42) |


    # Equality Operators


    These operators compare two operands and return either true or false (see Booleans,
    page 33). The operands can be of any data type.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_179_0.png)


    | Operator | Name | Action | Example (result in brackets) |

    | --- | --- | --- | --- |

    | == | equality | Returns true if the two operands are equal, otherwise false
    | 4 == 2 (false) |

    | != | inequality | Returns true if the two operands are not equal, otherwise
    false | 4 != 2 (true) |'
  - '[PAGE 180]


    # Comparison Operators


    As the name suggests, comparison operators compare two operands and return either
    true or false. The operands can be of any data type.


    | Operator | Name | Action | Example (result in brackets) |

    |---|---|---|---|n| <, <= | less than, less than or equal | Returns true if the
    left operand''s value is less than (or equal to) the right operand''s value, otherwise
    false | 52 < 20 (false)<br>19 <= 19 (true) |

    | >, >= | greater than, greater than or equal | Returns true if the left operand''s
    value is greater than (or equal to) the right operand''s value, otherwise false
    | 52 > 20 (true)<br>12 >= 12 (false) |


    # Logical Operators


    Logical operators compare values and then return either true or false. The operands
    are cast to Booleans if required.


    | Operator | Number of operands | Name | Action | Example (result in brackets)
    |

    |---|---|---|---|---||

    | && | 2 | logical AND | Returns true if both operands evaluate to true, otherwise
    false | true && false (false) |

    | || (two ''pipe'' symbols) | 2 | logical OR | Returns true if either operand
    evaluates to true, otherwise false | true || false (true) |

    | ! | 1 | logical NOT | Placed before its single operand; inverts the Boolean
    value of the operand | !true (false) |'
