    \  width:788px;\n  height:30px;\n  margin:0px auto auto;\n  padding:0px 118px\
    \ auto 118px;\n  background-color:#D9D0D9;\n  border:none;\n  border-bottom:1px\
    \ solid #FDSF12;\n}\n```\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_20_0.png)\n\
    \n## CSS 看起来是什么样？\n\n像 HTML 一样，CSS 是用特定结构编写的纯文本。CSS 代码由选择器（selectors）组成，选择器用于识别后续样式规则将应用的\
    \ HTML 元素。样式规则本身被包裹在大括号 `{` 和 `}` 中。（注：原始 OCR 错误使用了 `(` 和 `)`）\n\n> **上图：** CSS\
    \ 代码使用了选择器和样式规则。代码缩进如何有助于可读性。\n\n## 选择器的选取\n\n选择器可以有许多不同的形式，但在书中我们只关注其中三种：类型（Type）、ID\
    \ 和类（Class）。这些中最简单的是类型选择器。它仅由将接收样式规则的 HTML 元素名称组成。例如，一个 `p` 选择器将针对所有的 `<p>` 元素实例。\n\
