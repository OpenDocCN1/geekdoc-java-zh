  - '[PAGE 172]


    # WHITE SPACE


    Leading spaces and tabs are ignored in JavaScript. This enables us to use code
    indenting in our code, which is a technique that helps make the code more organized
    and human-readable.


    # SEMICOLONS


    JavaScript statements are normally terminated by a semicolon (;) but do not have
    to be. Where semicolons are omitted, the interpreter assumes line breaks mark
    the end of a statement. However, omitting semicolons can lead to ambiguity in
    your code, so best practice is to terminate every statement with a semicolon.


    ```

    1 //Inline comments start with // and end at the next line break

    2 var userScore = 0; //They can be written on the same line as other code

    4

    5 //alert(userScore); //They can also be used to disable lines of code

    6

    7

    8

    ```


    **Above:** Inline comments end at the line break that follows the comment.


    # COMMENTS


    A **comment** is a section of script that is ignored by the interpreter. Comments
    are used for adding notes and explanations to scripts, helping others understand
    them, and acting as notes-to-self when revisiting a script months after writing
    it.


    > ### Hot Tip

    Comments are commonly used to disable sections of a script – very useful when
    experimenting with new ideas or attempting to hunt down bugs.


    # Inline Comments


    An inline comment starts with // and continues until the next line break. They
    can be placed on their own line or on a line following other JavaScript code.'
