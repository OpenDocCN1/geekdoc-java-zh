    # ESSENTIAL ELEMENTS


    As we have learned, an HTML document is made up of a structure of elements, each
    of which performs a certain role. This document acts like a set of instructions
    for a web browser, telling it what to draw where. Let''s look at the essential
    elements required by all documents.


    # THE DOCTYPE DECLARATION


    There are a couple of different dialects of HTML that are currently in use – HTML5,
    the most up-to-date, and XHTML. This book is concerned only with the former, so
    suffice to say that


    ```

    1 <!DOCTYPE HTML>

    2

    3

    4

    5

    ```


    > Above: All HTML documents start with a DOCTYPE declaration; this is the declaration
    for HTML5.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_23_0.png)'
  - '[PAGE 24]


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_24_0.png)


    XHTML exists and isn''t drastically different from HTML5 – in fact you''d struggle
    to notice the difference if you didn''t know what to look for!


    A web browser, however, *has* to be able to tell the difference so that it knows
    how to render the page. To this end *all HTML* documents start with a **DOCTYPE**
    declaration. HTML5''s declaration is `<!DOCTYPE HTML>` . This easy-to-remember
    declaration must appear at the top of every HTML5 web page that you create.


    # THE HTML ELEMENT


    If all elements have a parent element somewhere down the chain must be a progenitor
    or starting point; this is the special `<html>` element. All HTML documents include
    one – such element. All of the other elements that compose the web page are nested
    within this `<html>` element.


    ```

    <!DOCTYPE HTML>

    <html>

    </html>

    ```


    Above: All HTML documents contain one `<html>` element: no more, no less.'
