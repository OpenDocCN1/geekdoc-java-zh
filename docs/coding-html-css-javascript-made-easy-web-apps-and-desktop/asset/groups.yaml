  mdcn: "\n\n## 构建网页\n\n在前面的章节中我们涵盖了大量的理论和信息，现在让我们开始付诸实践。第一步是创建一个 HTML 文档，并添加我们将要使用的元素的基本结构。\n\
    \n## 创建工作文件夹\n\n要做的第一件事是创建一个文件夹，用于存储我们页面的所有文件。你的“文档”（Documents）文件夹是一个好地方，或者更好是在你的“主目录”（Home）文件夹内创建一个名为\
    \ `MySites` 的文件夹；这可以作为你开发的所有网站的中心位置。无论你把它放在哪里，你为单个网站创建的文件夹应该与网站名称相同。让我们把这个命名为\
    \ `MySite`。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_75_0.png)\n\n> 提示\n> 不要要在文件夹名称中使用空格。删除空格并将每个单词的首字母大写（称为驼峰命名法，CamelCase），或者用下划线或连字符代替空格。\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_75_1.png)\n\n上方：一个网站的所有文件都应该存储在一个外部文件夹中。将你所有的网站都放在一个外部文件夹中也是方便的。\n\
    \n## 创建基础结构\n\n- 1. 在你选择的编辑器中创建一个新页面，并在页面最顶部添加 `DOCTYPE` 声明。\n\n```html\n<!DOCTYPE\
    \ HTML>\n<html>\n<head>\n</head>\n<body>\n</body>\n</html>\n```\n\n- 2. 添加基础元素\
    \ `<html>`、`<head>` 和 `<body>`，并将页面保存为 `index.html` 存放在你的 `First` 文件夹中。。\n\n```html\n\
    <!DOCTYPE HTML>\n<html>\n<head>\n<title>My First Web Page</title>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n步骤 2：从基本元素开始。\n\n- 3. 现在作为 `<head>` 元素的子元素（即在 `<head>`\
    \ 元素内部）添加一个 `<title>` 元素。让标题与内容相关，因为这会出现在搜索引擎的列表中。\n\n步骤 3：明智地为你的页面选择标题；它可能决定页面是否能吸引访客。\n\
    \n- 4. 现在我们将为页面的可见内容创建基础布局结构。作为 `<body>` 元素的子元素添加 `<header>`、`<section>` 和 `<footer>`\
    \ 元素。\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<title>My First Web Page</title>\n\
    </head>\n<header></header>\n<section></section>\n<footer></footer>\n</body>\n\
    </html>\n```\n\n> 提示\n> 任何网站的默认页面——在未请求特定页面时加载的页面——通常被称为 `index.html`。还有其他可用名称，但这个最好。\n\
    \n步骤 4：添加组成基本页面结构的元素。\n\n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n</head>\n<body>\n\
    \  <header>\n    <nav>Home | About | Contact</nav>\n  </header>\n  <section></section>\n\
    \  <footer></footer>\n</body>\n```\n\n5. 我们需要一种导航网站的方法，因此我们作为 `<header>` 的第一个子元素添加一个\
    \ `<nav>` 元素，并输入你可能包含在网站中的页面标题。\n\n6. 现在我们要在页面的 `<header>` 元素中添加一些文本标题。这些标题是相关的，因此我们将它们创建在一个\
    \ `<group>` 元素内部。\n\n步骤 5：在 `<header>` 内部创建一个 `<nav>` 元素。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_77_0.png)\n\
    \n```html\n<!DOCTYPE HTML>\n<html>\n<head>\n<title>My First Web Page</title>\n\
    </head>\n<body>\n  <header>\n    <nav>Home | About | Contact</nav>\n    <group>\n\
    \      <h1>My First Web Page</h1>\n      <h2>It may be basic, but it rocks</h2>\n\
