- md: "\n## GETTING HELP TO GO RESPONSIVE\n\nThere are a number of frameworks available\
    \ that will take much of the hard work out of the process of building your own\
    \ RWD site, so if you want to try your hand at it then check out the following\
    \ tools.\n\n## FRAMEWORKS\n\nThe two most popular and best-featured RWD frameworks\
    \ are Foundation and Bootstrap. They provide all of the necessary resources required\
    \ to build an RWD site: menus, image sliders, buttons and much more. Take a look\
    \ at both to see which you prefer.\n\n| Bootstrap | Getting started | CSS Components\
    \ | JavaScript | Customize | Expo Blog |\n|---|---|---|---|---|---|\n| Bootstrap\
    \ is the most popular HTML, CSS, and JS framework for developing responsive, mobile\
    \ first projects on the web. | | | | | |\n| **Above:** Download Bootstrap | Get\
    \ started with Bootstrap by downloading and experimenting with it (http://getbootstrap.com).\n\
    \n## Responsive Templates\n\nFrameworks are the perfect solution for those who\
    \ want to create a responsive website, but you still need to learn how to use\
    \ them. A simpler and quicker solution is to use ready-made templates, leaving\
    \ you with little more to do: add text and images to create a complete site. Try\
    \ HTML5 UP (http://html5up.net) for some modern templates.\n\n## RWD Tool to Try\n\
    \nWhen creating a website, it's essential to test it on as many screens as possible,\
    \ but with the plethora of different screen sizes out there is not always feasible.\
    \ There are many tools that can help by simulating different devices on your desktop.\
    \ Screenly is a great example of such a tool; check it out at http://quirktools.com/screenly.\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_123_0.png)\n\n**Above:** Test a live\
    \ site on myriad devices and screens.\n\n## CONTING MOBILE BROWSER SCALING\n\n\
    Web browsers running on mobile devices behave quite differently to a desktop browser\
    \ when it comes to sizing a page. This is due to the way in which mobile devices\
    \ scale between their physical resolution and an internal viewport size.\n\n##\
    \ THE VIEWPORT\n\nA mobile browser's viewport is the area in which it renders\
    \ the visual content of the page. When the page loads, this viewport is scaled\
    \ with the aim of making the viewport fit within the physical dimensions of the\
    \ device's screen. When you zoom in and out with a nip of your fingers, you're\
    \ actually adjusting the viewport scaling, and when you scroll around the page\
    \ you're actually moving the viewport around.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_124_0.png)\n\
    \n**Right:** The viewport can, and often does, extend beyond the visible area\
    \ of the screen.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_124_1.png)\n\n##\
    \ The Viewport Meta Tag\n\nIn order to have the browser adopt a suitable initial\
    \ scaling for the viewport, we have to let it know what size we want it to assume;\
    \ if we don't this then a default value will be used which may or not be suitable.\
    \ We set the scaling via a <meta> tag placed in the <head> of the page.\n\n##\
    \ Viewport Properties\n\nThe thing we are interested in is the value of the content\
    \ attribute. This is used to set a viewport property; in our example we are telling\
    \ the viewport to match the physical width of the device. Available properties\
    \ are: width, height, minimum-scale, maximum-scale, initial-scale and user-scalable.\n\
    \n```html\n<head>\n  <meta name=\"viewport\" content=\"width=device-width\">\n\
    \  <title>My First Web Page</title>\n</head>\n```\n\nAbove: The viewport meta\
    \ tag defines the initial scaling employed by a mobile browser\n\n## BROWSER SUPPORT\n\
    \nThere is a host of browsers for desktop and mobile, all offering different levels\
    \ of support for HTML5 and CSS3. On the desktop the major browsers are Chrome,\
