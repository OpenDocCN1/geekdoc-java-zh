    \ Save your work and then open the file in Firefox.\n\n```\n<!DOCTYPE HTML>\n\
    <html>\n<head>\n  <title>Getting Variables</title>\n</head>\n<body>\n  <script\
    \ type=\"text/javascript\">\n  </script>\n</body>\n</html>\n```\n\nAbove: Step\
    \ 2: Add a `<script type=\"text/javascript\">` element.\n\n```javascript\n<script\
    \ type=\"text/javascript\">\nvar message = \"The alert function displays a message\
    \ in a dialog box.\";\nalert(message);\nmessage = \"We're just changing a variable's\
    \ value...\";\nalert(message);\nmessage = \"and passing that variable's identifier\
    \ to the alert function.\";\nalert(message);\nmessage = \"The interpreter looks\
    \ up the variable's value...\";\nmessage = \"and that's what we see in the dialog\
    \ box. Simple, eh?\";\nalert(message);\n</script>\n```\n\nAbove: Step 3: Add the\
    \ JavaScript code.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_151_0.png)\n\n\
    **Above:** Computer data is simply numbers.\n\n## DATA MECHANICS\n\nUnlike lower-level\
    \ programming languages such as C and JavaScript does not require the programmer\
    \ to get involved in the details of how data is stored on the computer — the interpreter\
    \ manages the intricacies for us.\n\nHowever, you should still appreciate that\
    \ everything your computer does — every email you write, every song you listen\
    \ to, every video you watch — is represented by numbers. Therefore, at the most\
    \ fundamental level, all computer data is just numbers.\n\n> ### Hot Tip\nThe\
    \ binary and hexadecimal number systems are intrinsically tied to the way computers\
    \ represent numbers and data — look them up on Wikipedia if you don't know how\
    \ they work.\n"
  mdcn: "\n\n## 当浏览器遇到脚本时会发生什么？\n\n每当网页浏览器加载页面时，它都会在处理页的过程中顺序处理每个 HTML 元素。\n\n## 解释器\n\
    \n当浏览器遇到 `<script type=\"text/javascript\">` 元素时，脚本的内容会被立即传递给浏览器的 JavaScript **解释器**（称为执行脚本）。解释器的任务是理解脚本并据此指示浏览器操作。\n\
    \n```\n<!DOCTYPE HTML>\n<html>\n<head>\n  <title>A Simple Quiz</title>\n  <script\
    \ type=\"text/javascript\" src=\"js/QuizQuestion.js\"></script>\n  <script type=\"\
    text/javascript\" src=\"js/SimpleQuiz.js\"></script>\n  <script type=\"text/javascript\"\
    \ src=\"js/quizStartup.js\"></script>\n</head>\n<body>\n\n</body>\n</html>\n```\n\
    \n当解释器完成对脚本的执行后，控制权将返回给浏览器，浏览器随后继续处理页面。\n\n**正确：** JavaScript 是在页面加载时就地进行处理的。\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_142_0.png)\n\n## 你的第一个脚本\n\n- 1. 创建一个新的\
    \ HTML 文件并添加基础结构元素 `<html>`、`<head>` 和 `<body>`。将文件保存在方便的位置，并命名为 MyFirstScript.html。\n\
    \n- 2. 在 `<body>` 元素中添加一个 `<script>` 元素。对于此示例，我们希望将起始和结束标签放在不同的行，之间留一个空行。\n\n\
    - 3. 在脚本元素中输入以下命令：`document.write(\"<p>Hello World!</p>\");`。此命令向页面输出文本，就像你直接输入页面中一样（这就是为什么我们也包含了\
    \ `<p>` 元素标签）。\n\n- 4. 保存页面，然后在 Firefox 中打开它，可以通过双击文件，或者右键点击文件并选择“打开方式”，然后选择 Firefox。\n\
    \n```\n<!DOCTYPE HTML>\n<html>\n<head>\n  <title>My First Script</title>\n</head>\n\
    <body>\n  <script type=\"text/javascript\">\n    document.write(\"<p>Hello World!</p>\"\
    );\n  </script>\n</body>\n</html>\n```\n\n> **热提示**\n> 我们经常使用“代码”（code）和“编码”（coding）这两个词——前者指的是你输入脚本的文本，后者指的是编写脚本的过程。\n\
    \n## 工作原理\n\n恭喜——你刚刚编写并执行了你的第一个脚本。当浏览器遇到 `<script>` 元素时，脚本被传递给了解释器。解释器识别了 `document.write`\
    \ 命令，并将括号内的内容（在编程术语中称为**圆括号**）文本写入页面。\n\n文本必须包含在引号中，解释器才能将其识别为文本——如果你只看到一个空白页面，很可能是你漏掉了引号。\n\
    \n> ### 热提示\n> **关于编程语言的书籍，传统上会将“Hello World!”作为书中第一个练习的输出内容——你现在正式加入了开发者的行列！**\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_144_0.png)\n\n**正确：** 你通过了入职测试——欢迎加入！\n\
    \n## JAVASCRIPT 中的数据\n\n## 什么是数据？\n\n所有编程语言中的一个核心概念都是数据。数据可以被视为程序内部使用的任何信息。\n\n\
    ## 所有数据都有一个值\n\n任何数据都可以说它拥有一个值。这个值可以是简单的——例如，一个数字或一段文本——也可以是复杂的，例如数字列表或多个段落。然而，无论数据类型如何，由该数据表示的信息被称为该数据的值。\n\
    \n### 字面量 (Literals)\n字面量是直接输入脚本的具有特定值的数据。以下都是是字面量的例子：\"Hello World\"、true、42\
    \ 和 null。\n\n### 标识符 (Identifiers)\n标识符是一个区分大小写的名称，被赋值给某个数据（或函数——参见第 205 页的“命名函数”）。一旦赋值，标识符就可以在脚本中用于引用该数据（或函数）。JavaScript\
    \ 允许你自由选择想要使用的名称作为标识符，只要你遵循少数几条基本规则即可。\n\n```\n3 myNumberLiteral = 42;\n4 myStringLiteral\
    \ = \"Hello World\";\n5 myBooleanLiteral = true;\n6 myNullLiteral = null;\n```\n\
    \n## 标识符命名规则\n\n- **保留字**：JavaScript 定义了一些对语言具有特殊含义的特殊单词（见第 174 页）。这些单词不能用作自定义标识符名称。\n\
    \n- **第一个字符**：标识符的第一个字符必须是字母、下划线 `_` 或美元符号 `$`。\n\n- **后续字符**：标识符中的剩余字符只能是字母、数字、下划线或美元符号。\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_148_0.png)\n\n```\n1 // 合法标识符示例\n2\
    \ myValue\n3 _myValue\n4 MYVALUE\n5 $value\n6 // 非法标识符\n7 2myValue\n8 my-value\n\
    9 my value\n10 $5value\n```\n\n**正确：** 第一组标识符都是合法的，而第二组是非合法的。\n\n## 变量\n\n本质上，变量是用于存储数据的内存区域，通过标识符进行引用。\n\
    \n## 声明变量\n\n在 JavaScript 中声明一个新变量非常简单——我们只需要编写关键字 `var` 后面跟标识符即可。\n\n```\n //\
    \ 声明变量（不赋值）\n5 var answer;\n\n// 在赋值时赋值\nvar answer = 42;\n```\n\n一旦声明了变量，我们就可以像这样更改赋值给它的值：\n\
    \n```\nvar answer = 42;\nanswer = 43;\n```\n\n## 获取变量的值\n\n要使用存储在变量中的值，我们在需要使用的地方编写该变量的标识符。\n\
    \n- 1. 创建一个新的 HTML 文档并添加常用元素（`<html>`、`<head>` 和 `<body>`）。将文档保存为 gettingVariables.html。\n\
    \n- 2. 在 `<body>` 元素中添加一个 `<script type=\"text/javascript\">` 元素（即作为 `<body>`\
    \ 的子元素），如下所示。\n\n- 3. 添加所示的 JavaScript 代码。\n\n- 4. 保存并在 Firefox 中打开该文件。\n\n```\n\
    <!DOCTYPE HTML>\n<html>\n<head>\n  <title>Getting Variables</title>\n</head>\n\
    <body>\n  <script type=\"text/javascript\">\n  </script>\n</body>\n</html>\n```\n\
    \n上方：步骤 2：添加 `<script type=\"text/javascript\">` 元素。\n\n```javascript\n<script\
    \ type=\"text/javascript\">\nvar message = \"The alert function displays a message\
    \ in a dialog box.\";\nalert(message);\nmessage = \"We're just changing a variable's\
    \ value...\";\nalert(message);\nmessage = \"and passing that variable's identifier\
    \ to the alert function.\";\nalert(message);\nmessage = \"The interpreter looks\
    \ up the variable's value...\";\nmessage = \"and that's what we see in the dialog\
    \ box. Simple, eh?\";\nalert(message);\n</script>\n```\n\n上方：步骤 3：添加 JavaScript\
    \ 代码。\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_151_0.png)\n\n**上方：计算机数据就是数字。\n\
    \n## 数据机制\n\n与 C 等低级编程语言不同，JavaScript 不需要程序员参与数据如何在计算机上存储的细节——解释器已经为我们管理了这些复杂性。\n\
    \n然而，你仍然应该意识到计算机所做的一切——你写的每封邮件、听的每首歌、看的每一个视频——都是用数字表示的。因此，在最基础的层，所有的计算机数据都只是数字。\n\
    \n> ### 热提示\n二进制和十六进制数字系统与计算机表示数字和数据的方式内在相关——如果你不知道它们如何工作，请在维基百科上查询。\n\n"
