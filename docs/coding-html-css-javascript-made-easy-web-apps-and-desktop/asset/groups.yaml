    Objects have a special role in JavaScript – they are the basic building blocks
    upon which all other JavaScript data is built. Every other data type inherits
    its basic characteristics from the object data type. For this reason, we often
    refer to any and all JavaScript data as being an object – a string object, for
    example, or an array object. This concept of inheritance is fundamental to object
    oriented programming, an approach to coding that is closely tied to JavaScript,
    and that we introduce on page 219.


    > Hot Tip

    The values stored in the properties of an object can be of any data type, including
    other objects or arrays.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_163_0.png)


