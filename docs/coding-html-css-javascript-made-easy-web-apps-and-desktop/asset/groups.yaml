    \ might not be as hard as you imagined.\n\n# GO FURTHER\n\nThe advice doesn't\
    \ stop at simply creating your website: learn how to get your website onto the\
    \ internet, find out how you can buy your own .com name, create a blog with WordPress,\
    \ discover some advanced CSS techniques and learn simple JavaScript language.\n\
    \n# STEP-BY-STEP\n\nThe process of building a website and learning new languages\
    \ can seem like a daunting task. But this book rises to the challenge and demonstrates\
    \ the process through a selection of step-by-step guides. These provide easy-to-follow\
    \ instructions which will guide you through some of the most important building\
    \ blocks of a website.\n\n# EXPERT GUIDANCE\n\nShould all not go according to\
    \ plan, our helpful troubleshooting guide will help you get back on track, and\
    \ our Further Reading guide will point you in the direction of where to go next.\n\
    \n# CODE EXAMPLES\n\nWhen showing examples of HTML, CSS and JavaScript code we\
    \ will use text that looks like this. When we want to indicate that something\
    \ would be written in a code block but that we haven't shown it in the example,\
    \ we would build the text as well, like this: header {style rule}. You wouldn't\
