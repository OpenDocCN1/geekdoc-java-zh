    # ADVANCED TEXT


    As we have learned, HTML is nothing more than plain text; it only works at all
    because web browsers recognize characters that have a special meaning in HTML,
    such as ''<'' and ''>''. But what if we want to use one of those special characters
    within the text of a page?


    # SPECIAL CHARACTERS


    There are a number of characters that, if typed into a text-based element such
    as <p>, will cause errors and the page will not be rendered correctly (if at all).
    For example, we may wish to include angle brackets in a passage about mathematical
    formulae (or, indeed, HTML), or quote marks when quoting what somebody has said.
    The problem is that such characters have specific predefined meanings in HTML
    and so will be misinterpreted by the browser.


    > "There are many special characters in HTML" said the man. "Characters such as
    ''<'' and ''&'' can''t be typed directly into the text of an HTML document." he
    said.


    He went to explain that the same was true of "extended" characters such as ©,
    μ and many more. Accented latin characters, such as ''Á'' and ''É'' are also classed
    as extended characters, he explained.


    Above: Some characters have special meaning in HTML and can''t be typed directly
    into an element.'
  - '[PAGE 114]


    # ASCII and

    Extended Characters


    # Hot Tip


    The core set of character symbols used in computing is referred to as ASCII (American
    Standard Code for Information Interchange, pronounced ''ask-ee''). This is a standard
    that defines the character used to represent the most common alphabetic, numeric
    and punctuation characters. There are 128 character codes, and all computers follow
    the ASCII standard for these characters.

    Characters that fall outside the ASCII standard, such as accented letters, are
    known as extended characters and should be typed directly into HTML text.


    Internally, computers represent everything with numbers, and this includes text.
    The number that represents a given alpha-numeric, punctuation or symbol character
    is called a character code.


    | ASCII control characters | ASCII printable characters |

    |---|---|

    | 00 NULL (Null character) | 32 space 64 @ 96 |

    | 01 SOH (Start of Header) | 33 I 65 A 97 a |

    | 02 STX (Start of Text) | 34 " 66 B 98 b |

    | 03 ET (End of Text) | 35 # 67 C 99 c |

    | 04 EOF (End of Trans.) | 36 $ 68 D 100 d |

    | 05 ENQ (Enquiry) | 37 % 69 E 101 e |

    | 06 ACK (Acknowledgment) | 38 & 70 F 102 f |

    | 07 BEL (Bell) | 39 ) 71 G 103 g |

    | 08 BS (Backspace) | 40 ( 72 H 104 h |

    | 09 HT (Horizontal Tab) | 41 ) 73 I 105 i |

    | 10 LF (Line feed) | 42 * 74 J 106 j |

    | 11 VT (Vertical Tab) | 43 + 75 K 107 k |

    | 12 FF (Form feed) | 44 , 76 L 108 l |

    | 13 CR (Carriage return) | 45 . 77 M 109 m |

    | 14 SO (Shift Out) | 46 / 78 N 110 n |

    | 15 SI (Shift In) | 47 ; 79 O 111 o |

    | 16 DLE (Data link escape) | 48 0 80 P 112 p |

    | 17 DC1 (Device control 1) | 49 1 81 Q 113 q |

    | 18 DC2 (Device control 2) | 50 2 82 R 114 r |

    | 19 DC3 (Device control 3) | 51 3 83 S 115 s |

    | 20 DC4 (Device control 4) | 52 4 84 T 116 t |

    | 21 NAK (Negative Acknowledgment) | 53 5 85 U 117 u |

    | 22 ETB (End of trans. block) | 54 6 86 V 118 v |

    | 23 CAN (Cancel) | 55 7 87 W 119 w |

    | 24 EM (End) | 56 8 88 X 120 x |

    | 25 SUB (Substitute) | 57 9 89 Y 121 y |

    | 26 ESC (Escape) | 58 : 90 Z 122 z |

    | 27 GS (Group separator) | 59 ; 91 [ 123 | |

    | 28 FS (File separator) | 60 < 92 ] 124 | |

    | 29 RS (Record separator) | 61 > 93 } 125 | |

    | 30 US (Unit separator) | 62 = 94 ^ 126 | |

