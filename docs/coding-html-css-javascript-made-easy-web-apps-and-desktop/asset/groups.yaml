    \ there\n- 15: Close fridge\n- 16: Wait until kettle\n\n**Above:** Complex statements\
    \ can be broken down into separate statements\n\n## BLOCKS\n\nRelated statements\
    \ can be grouped together. This is done by wrapping them in braces.\n\n> Hot Tip\n\
    > Thinking about how to delve into JavaScript\n\n```\nplayerScore = 0;\nvar playerName\
    \ = 'Sarah';\nvarAge = 29;\n```\n\nStatement blocks\n\n## CONDITIONAL STATEMENTS\n\
    \nWe often need to execute different statements based on conditions.\n\n## IF\
    \ STATEMENTS\n\nWhen the interpreter encounters an if statement, it evaluates\
    \ the expression. In the event that the expression evaluates to true, the statement\
    \ is evaluated.\n\n```\nif(condition)\n```\n\n## How an If Statement Works\n\n\
    Let's see how an if statement works:\n\n- 1. Create a new HTML document\n- 2.\
