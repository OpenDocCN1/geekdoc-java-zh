    # GOING BEYOND THE BASICS


    HTML5 and CSS3 represent significant advances in their respective languages. Here
    we introduce some of the more advanced features of both languages. A full discussion
    is beyond the scope of this book, you should be aware of these features.


    # HTML5 FORMS


    A simple example of the power of HTML5 lies in HTML forms. Before HTML5, creating
    forms for the web typically involved the use of coding with JavaScript. For instance,
    if you wished to verify that the user had entered suitable data into a form the
    only way to do so was via scripting. HTML5 forms, however, have built-in validation
    features, saving the developer heaps of time and complexity.


    Below: HTML5 forms greatly simplify validation of user entries


    # Email Sign-up Form Demo


    ve created a demo of an email sign-up form you can check out at http://richardshepherd.com/forms


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_101_0.png)'
