    # CODING HTML • CSS • JAVASCRIPT MADE EASY


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_31_0.png)


    Be aware that using multiple sheets increases the risk of applying conflicting
    values to a style property of an element, if an element doesn''t look as expected
    then it''s worth digging around to check which problematic style rule(s) is coming
    from.


    # Methods of Applying Styling


    - Inline: A style rule is declared within an element''s style attribute.

    - Embedded: CSS code is written inside a <style> element of an HTML document.

    - External: CSS code is written inside a separate text file and associated with
    an HTML document via a <link> element.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_31_1.png)


    Left: The three methods of applying CSS rules to HTML elements.


    # NEW FEATURES OF HTML5


    HTML5 is still HTML, but it is simply the latest version of the language. It contains
    many of the elements found in previous versions but also features a number of
    new elements and rules. In general, when somebody uses HTML5, they are referring
    to these new features.


    # SEMANTIC ELEMENTS


    One of the aims of HTML5 is to introduce clear and consistent semantics into the
    language, such that the element names convey information about the purpose of
    an element and where it sits in the logical structure of a document.


    > Hot Tip: Semantic elements are particularly helpful to the screenreader applications
    that assist with web browsing for people with visual impairment.


    | HTML5 FEATURES SEMANTICS | Semantics is one of the most distinctive features
    of the Web Platform versus other platforms. Developers usually ignore or de-prioritize
    such feature but the mastery of it can bring many benefits to our projects. |

    | The text and text have a meaning. Ultimately the content that our browsers read
    is pure text. Web sites and applications have been created in an ecosystem where
    text content is linkable, searchable and mashable. In the open web we want content
    to be shown, fed and remied by third parties, search engines and accessibility
    tools. All these benefits don''t come for free. Automated tools can only do half
    of the job at recognizing the nature of content. The better the developer does
    at marking the right semantics of the content the easier be for the rest of the
    agents to deal with. HTML5 provides a series of tools to make life easier too:
    * New media elements. * New structural elements. * New semantics for internationalization.
    * New link relation types. * New attributes. * New form types. * New microdata
    syntax for additional semantics. |


    **Above:** HTML5 places a lot of importance on semantics.


    # CODING HTML • CSS • JAVASCRIPT MADE EASY


    Therefore it includes a new set of elements that satisfies this need for semantic
    meaning, for example, <header>, <video>, <article> and <footer>. The fact that
    the element names convey exactly what these new elements are for what makes them
    semantic.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_33_0.png)


    # NEW FUNCTIONALITY


    HTML5 introduced a lot of new functionality to web pages that previously have
    required third-party plug-ins, such as Adobe Flash Player, to be installed on
    the end-user''s browser. These new features are a breath of fresh air to developers
    because they make it infinitely simpler to add functionality, such as drag-and-drop,
    web forms, video, audio, ''live'' graphics (including 3D), and much more.


    # Better for Mobile


    Many popular browser plug-ins cannot be installed on mobile operating systems.
    HTML5 has fixed this by eliminating the need for many third-party plug-ins, and
    so if you expect your web pages to be viewed on mobile devices HTML5 is the only
    game in town.


    **Above:** HTML5 works beautifully on mobile devices.


    # WHAT IS CSS3?


    CSS3 is still CSS; it is simply the latest version of the language. This third
    major version brings with it some important enhancements that make the language
    much more capable than previously.


    # VISUAL EFFECTS


    One of the main advances in CSS3 is its ability to apply visual effects, such
    as drop shadow or blur, that would previously need to be produced in an image
    editor such as Adobe Photoshop. The effects on offer are fairly basic, but they
    are a godsend to developers who no longer have to jump back and forth between
    HTML editor and image editor just to put a little shadow on a graphic.


    Below: A simple example of a CSS shadow.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_34_0.png)


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_34_1.png)


    # Better Backgrounds


    Another nifty CSS3 feature is background-size. This is a CSS property that allows
    background images (these being images that sit in the background of an HTML element)
    to automatically scale as required. By assigning a value to the property, such
    as cover, the image will fill an element''s background: simple but effective.


    > Hot Tip: Just because you can do something doesn''t mean you have to: too much
    eye candy can be as off-putting to visitors as too little.


    # Animations


    The current big thing in CSS is animation. Previously, this was impossible in
    the browser without the help of third-party plug-ins or extensive scripting (or
    both), but now designers and developers can create slick and impressive animations
    with nothing more than CSS code. See page 106 for more on this.


    Below: Check out this impressive CSS3 animation at http://codepen.io/julilangmeier/pen/idhuG


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_35_0.png)


    # THE BENEFITS OF UNDERSTANDING HTML AND CSS


    HTML and CSS are ubiquitous, and are used even outside of web development. As
    such, possessing an understanding can give you a considerable advantage.


    # BECOME THE EXPERT


    Most companies nowadays have a web presence, but many lack the in-house skills
    to support and maintain them properly.


    **Below:** An in-depth knowledge of CSS means better websites.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_36_0.png)


    # Changes


    As well as giving you the ability to problem-solve web pages, having a solid grounding
    in HTML and CSS provides you with the knowledge to make modifications to a site,
    confident that you will not break it.


    # Keeping up with the Trends


    The graphical aspects of web design are heavily influenced by current trends.
    Having the ability to keep your site abreast of current fashions, then, ensures
    it always looks modern and fresh.


    # Faster Websites


    The ability to recognize the right HTML and CSS for the right job can mean the
    difference between a slick and nimble experience for your visitors, or a slow
    and frustrating one... guess which they prefer!


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_37_0.png)


    **Above:** Tweak your site to go faster to get more visitors.


    # What We''ve Learned


    - HTML: HyperText Markup Language; for constructing web pages.

    - CSS: Cascading Style Sheets; for styling web pages.

    - Element: The building block of HTML.

    - Tag: Demarks the start and end of an element.

    - Attribute: Provides the means to modify the behaviour and appearance of an element.

    - Style property: Assigns a value to a given CSS property.

    - Style rule: A collection of style properties.

    - Selector: CSS component that specifies the HTML elements to which a style rule
    will be applied.

    - Inline style: A style attached to a single element via the style attribute.

    - Embedded style sheet: A set of style rules grouped by selector; located within
    a <style> element.

    - External style sheet: A set of style rules grouped by selector; located within
    a separate text document.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_38_0.png)


    **Above:** The various components together to give a full web page.

