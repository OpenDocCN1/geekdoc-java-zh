  - "[PAGE 141]\n\n# ADDING A SCRIPT TO A PAGE\n\nWe add scripts to a page by using\
    \ the <script> HTML element. The type attribute of the element must always be\
    \ \"text/javascript\". The element should always be closed with a closing tag,\
    \ </script>.\n\n# Embedded JavaScript\n\nTo embed a script, we simply write its\
    \ commands between the opening and closing <script> tags. The script is intrinsically\
    \ tied to that page, and that alone.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <meta charset=\"UTF-8\">\n  <title>Untitled Document</title>\n  <script type=\"\
    text/javascript\">\n    // Embedded JavaScript code here\n  </script>\n  <script\
    \ type=\"text/javascript\" src=\"js/myScript.js\"></script>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n**Linked JavaScript**\nIt is common to link a script\
    \ to a page. To do this, the script is written in a separate text file and saved\
    \ with a .js filename. The script is then linked to a page using the src attribute\
    \ of the <script> element.\n\nAbove: The HTML <script> element can contain an\
    \ embedded script or link to an external script file.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_141_0.png)\n\
    \nFor example:\n\n```\n<script type=\"text/javascript\" src=\"myScript.js\"></script>\n\
    ```\n\nLeft: Store your scripts in a subfolder of your website\nJs is a good name\
    \ for this folder."
- md: "\n## WHAT HAPPENS WHEN A BROWSER ENCOUNTERS A SCRIPT?\n\nWhenever a web browser\
    \ loads a page, it deals with each HTML element sequentially as it works through\
    \ the page.\n\n## THE INTERPRETER\n\nWhen the browser encounters a `<script type=\"\
    text/javascript\">` element, the contents of the script are immediately passed\
    \ to the browser's JavaScript **interpreter** (known as executing the script).\
    \ It is the interpreter's job to make sense of the script and instruct the browser\
    \ accordingly.\n\n```\n<!DOCTYPE HTML>\n<html>\n<head>\n  <title>A Simple Quiz</title>\n\
    \  <script type=\"text/javascript\" src=\"js/QuizQuestion.js\"></script>\n  <script\
    \ type=\"text/javascript\" src=\"js/SimpleQuiz.js\"></script>\n  <script type=\"\
    text/javascript\" src=\"js/quizStartup.js\"></script>\n</head>\n<body>\n\n</body>\n\
    </html>\n```\n\nWhen the interpreter has finished executing a script, control\
    \ is returned to the browser, which then continues to process the page.\n\n**Right:**\
    \ JavaScript is processed in-place as the page loads.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_142_0.png)\n\
    \n## YOUR FIRST SCRIPT\n\n- 1. Create a new HTML file and add the basic structural\
    \ elements `<html>`, `<head>` and `<body>`. Save the file in a convenient location,\
    \ and call it MyFirstScript.html.\n\n- 2. Add a `<script>` element to the `<body>`\
    \ element. For this example, we want to place the opening and closing tags on\
    \ separate lines, with an empty line in between.\n\n- 3. Type the following command\
    \ within the script element: `document.write(\"<p>Hello World!</p>\");`. This\
    \ command outputs text to a page, just as though you'd typed directly into the\
    \ page (which is why we've also included the `<p>` element tags).\n\n- 4. Save\
    \ the page and then open it in Firefox, either by double-clicking the file or\
    \ by right-clicking it and selecting Open with, then Firefox.\n\n```\n<!DOCTYPE\
    \ HTML>\n<html>\n<head>\n  <title>My First Script</title>\n</head>\n<body>\n \
    \ <script type=\"text/javascript\">\n    document.write(\"<p>Hello World!</p>\"\
    );\n  </script>\n</body>\n</html>\n```\n\n> **Hot Tip**\nWe often use the terms\
    \ 'code' and 'coding' – the former refers to the text that you type into a script,\
    \ while the latter refers to the process of writing scripts.\n\n## How it Works\n\
    \nCongratulations – you've just written and executed your first script. The script\
    \ was passed to the interpreter when the browser encountered the `<script>` element.\
    \ The interpreter recognized the `document.write` command, and wrote the text\
    \ contained in the brackets (or, in programming parlance, **parentheses**) to\
    \ the page.\n\nThe text had to be contained in quotation marks for the interpreter\
    \ to recognize it as text – if all you see is a blank page, chances are you've\
    \ missed the quotation marks.\n\n> ### Hot Tip\n**It is traditional for books\
    \ about programming languages to use \"Hello World!\" as the output from the first\
    \ exercise in the book – you are now officially initiated into the ranks of the\
    \ developer!**\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_144_0.png)\n\n**Right:**\
    \ You have passed the initiation test – welcome aboard!\n\n## DATA IN JAVASCRIPT\n\
    \n## WHAT IS DATA?\n\nA key concept in all programming languages is data. Data\
    \ can be thought of as any piece of information that is used within a program.\n\
    \n## ALL DATA HAS A VALUE\n\nAny piece of data can be said to have a value. This\
    \ value can be simple – for example, a number or a paragraph of text – or it can\
    \ be complex, such as a list of numbers or many paragraphs. Whatever the type\
    \ of data, though, the information being represented by that data is referred\
    \ to as the data's value.\n\n### Literals\nA literal is a piece of data with a\
    \ specific value that's typed directly into a script. The following are all examples\
    \ of literals: \"Hello World\", true, 42 and null.\n\n### Identifiers\nAn identifier\
    \ is a case sensitive name that's assigned to a piece of data (or to a function\
    \ – see Named Functions on page 205). Once assigned, an identifier can be used\
    \ to refer to that data (or function) within a script. JavaScript leaves you free\
    \ to choose the names you wish to use as identifiers, as long as you follow a\
    \ few basic rules.\n\n```\n3 myNumberLiteral = 42;\n4 myStringLiteral = \"Hello\
    \ World\";\n5 myBooleanLiteral = true;\n6 myNullLiteral = null;\n```\n\n## Identifier\
    \ Naming Rules\n\n- **Reserved words**: JavaScript defines a number of special\
    \ words that have special meaning for the language (see page 174). These can't\
    \ be used as names for your own identifiers.\n\n- **First character**: The first\
    \ character of an identifier must be a letter, an underscore '_' or a dollar $.\n\
    \n- **Subsequent characters**: The remaining characters in an identifier can only\
    \ be letters, numbers, underscores or dollars.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_148_0.png)\n\
    \n```\n1 //Examples of legal identifiers\n2 myValue\n3 _myValue\n4 MYVALUE\n5\
    \ $value\n6 //Illegal identifiers\n7 2myValue\n8 my-value\n9 my value\n10 $5value\n\
    ```\n\n**Right:** The first set of identifiers are all legal, while the second\
    \ set are illegal.\n\n## VARIABLES\n\nIn essence, a variable is a portion of memory\
    \ that is used for storing data, which is referred to using an identifier.\n\n\
    ## DECLARING A VARIABLE\n\nIt's very easy to declare a new variable in JavaScript\
    \ – all we do is write the keyword var followed by the identifier.\n\n```\n //Declaring\
    \ variables (without assignment)\n5 var answer;\n\n// Assigning a value at the\
    \ time\nvar answer = 42;\n```\n\nOnce a variable has been declared, we can change\
    \ the value assigned to it like this:\n\n```\nvar answer = 42;\nanswer = 43;\n\
    ```\n\n## Getting the Value of a Variable\n\nTo use the value stored in a variable,\
    \ we write that variable's identifier in the place where we need to use it.\n\n\
    - 1. Create a new HTML document and add the common elements (`<html>`, `<head>`\
    \ and `<body>`). Save the document as gettingVariables.html.\n\n- 2. Add a `<script\
    \ type=\"text/javascript\">` element as a child of (i.e. within the `<body>`)\
