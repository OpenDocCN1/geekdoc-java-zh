    # EVENT LISTENERS


    Event listeners are assigned to the object that generates the event we want to
    capture – often this is a DOM object from the web page. Once we know the object
    we want to listen to, we call addEventListener () on that object – the general
    form is:


    ```

    myObject.addEventListener(eventType, handlerExpression, useCapture)

    ```


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_244_0.png)'
  - "[PAGE 245]\n\n# Parameters of the AddEventListener() Method\n\n+   - **Event\
    \ type**: The first parameter indicates the type of event to listen for. This\
    \ is a string such as \"click\", \"keydown\" or \"mouseover\".\n\n+   - **Handler\
    \ expression**: Typically a reference to a handler function or method. Note that\
    \ when referencing a function or method, we do not include parentheses.\n\n+ \
    \  - **Use capture**: This is complex and beyond the scope of the book. Until\
    \ you learn what this does, always pass false to this parameter.\n\n```\nfunction\
    \ clickHandler() {\n  //do things in response to the click\n}\n\nvar myPara =\
    \ document.createElement(\"p\");\ndocument.body.appendChild(myPara);\nmyPara.addEventListener(\"\
    click\", clickHandler, false);\n```\n\n*Above: Adding an event listener to a <p>\
    \ element*\n\n# Adding Event Listeners\n\nWe've created our event handler, but\
    \ it doesn't do anything until triggered by an event listener.\n\n+   1. Open\
    \ Quiz.js and locate the for loop in the renderQuestion method.\n\n```\nfor(var\
    \ i = 0; i < this.answers.length; i++) {\n  var answerPara = document.createElement(\"\
    p\");\n  answerPara.innerHTML = this.answers[i];\n  answerPara.id = \"a\" + i;\n\
    \  answerPara.addEventListener(\"click\", com.flametrepublishing.simpleQuiz.clickHandler,\
    \ false);\n  questionDiv.appendChild(answerPara);\n}\n```\n\n*Above: Step 2: Enter\
    \ the code shown here as described above*"
