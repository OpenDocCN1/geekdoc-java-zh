  - '[PAGE 158]


    # Non-existent Data


    JavaScript has two data types for representing non-existent data. The null type,
    whose value is also null, indicates that there is no value – if an identifier
    evaluates to null, it doesn''t contain any valid data or, most likely, it hasn''t
    been declared. The second type is undefined, whose value is also undefined, and
    is slightly different to null – it is the initial type and value of any variable
    that has been declared but not yet had a value assigned to it.


    # ARRAYS


    Arrays are a reference data type; array is JavaScript parlance for a list of values.
    There are two ways in which to create one.


    # Writing an Array Literal


    We can create an array by writing an array literal, like this:


    ```

    var myArray = [value_1, value_2, ..., value_n]

    ```


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    <title>Array Examples</title>

    </head>

    <body>

    <script type="text/javascript">

    var myArray = [];

    var numbersArray = [42, 12, 57, 3.14, 901582, 5];

    var stringsArray = ["Harry", "Sue", "Julia", "Chris", "Oliver\];

    var mixedArray = ["Oliver", true, false, 5];

    var arraysArray = [emptyArray, numbersArray, stringsArray, mixedArray];

    </script>

    </body>

    </html>

    ```


    Above: Arrays store lists of other data (including other arrays).'
- md: "\n# 160 CODING HTML • CSS • JAVASCRIPT MADE EASY\n\nThe square brackets []\
    \ mark the start and end of the array, while the values to store within the array\
    \ – its elements – are separated by commas and can be of any data type. To create\
    \ an empty array, we just type the brackets with no elements within them.\n\n\
    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_159_0.png)\n\n## Creating an Array with\
    \ the New Keyword\n\nWe can also create an array using the new keyword: `var myArray\
    \ = new Array();`. Initial elements, separated by commas, can be included between\
    \ the parentheses. (We discuss keywords on page 50.)\n\n## Array Length\n\nThe\
    \ number of elements within an array is referred to as length. If we have an array\
    \ called myArray, we can get its length by typing `myArray.length`.\n\n```html\n\
    <!DOCTYPE HTML>\n<html>\n<head>\n  <title>Array Examples</title>\n</head>\n<body>\n\
    \ <script type=\"text/javascript\">\n  var userNames = new Array(\"Helen\", \"\
    Amrit\", \"Geoff\", \"Jacques\");\n  var userLogins = new Array();\n  alert(userNames.length)\
    \ //Displays '4' in the alert dialog\n  alert(userLogins.length) //Displays '0'\
    \ in the alert dialog\n</script>\n</body>\n</html>\n```\n\nAbove: Arrays can be\
    \ created with the new keyword, and always have a length.\n\n## Accessing Array\
    \ Elements\n\nEach element in an array has an index, this being a number that\
    \ refers to the position of the element within the array. The first element has\
    \ an index of 0, the second an index of 1 and so on. To access a specific element\
    \ of an array, we write the variable's name followed by the index number wrapped\
    \ in square brackets. For example, if we want to use the third element (index\
    \ 2) of the myArray we write `myArray[2]`.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_160_0.png)\n\
    \n## Adding Elements to an Array\n\nWe can also assign values to elements of an\
    \ array using square brackets. For example, to set the eighth element (index 7)\
    \ of the array myArray we could type `myArray[7] = 19`. If the eighth element\
    \ already contains data, it is overwritten with the new value. Or, if the array's\
    \ length is less than 8, the new element is created, as any empty elements required\
    \ to pad between the last element of the unmodified array and the newly added\
    \ element.\n\n```html\n<body>\n<script type=\"text/javascript\">\nvar Names =\
    \ new Array(\"Helen\", \"Amrit\", \"Geoff\", \"Jacques\");\nvar userLogins = new\
    \ Array();\n//Get array element values...\nalert(userLogins[0]); //displays 'Helen'\
    \ in the alert dialog\nalert(userLogins[3]); //displays 'Jacques' in the alert\
    \ dialog\n//Set array element values...\nuserLogins[0] = [\"Amrit\", \"Monday\"\
    ]; //Assign array to 1st element of userLogins\nuserLogins[2] = [\"Helen\", \"\
    Tuesday\"]; //Assign array to 3rd element of userLogins\n//Get undeclared array\
    \ element...\nalert(userLogins[1]); //displays undefined in the alert dialog,\
    \ I.E. the element\nexists - it was created for but it had not had a\nvalue assigned\
    \ to it\n</script>\n</body>\n```\n\nAbove: We can access array elements, for both\
    \ getting and setting a value, using bracket notation.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_161_0.png)\n\
    \n## Appending Elements to an Array\n\nThe push() method of an array enables us\
    \ to append elements to the end of that array (we discuss methods on page 102).\
    \ For example, if we wished to append the string \"Harry\" to the array firstNames,\
    \ we could write this as `firstNames.push(\"Harry\")`.\n\n```html\n<body>\n  <script\
    \ type=\"text/javascript\">\n    var userNames = new Array(\"Helen\", \"Amrit\"\
    , \"Geoff\", \"Jacques\");\n    alert(userNames.length);//Displays '4' in the\
    \ alert dialog\n    userNames.push(\"Oliver\");//Displays '5' in the alert dialog\n\
    \    alert(userNames[4]); //Displays 'Oliver' in the alert dialog\n  </script>\n\
    </body>\n```\n\nAbove: The push method of an array adds an element to the end\
    \ of the array\n\n## Removing Elements from an Array\n\nWe can remove the first\
    \ element in an array using the shift() method, or remove the last element using\
    \ the pop() method. Whichever method you use, it will return the value that was\
    \ removed.\n\n```html\n<body>\n<script type=\"text/javascript\">\n  var userNames\
    \ = new Array(\"Helen\", \"Amrit\", \"Geoff\", \"Jacques\");\n  userNames.push(\"\
    Oliver\");\n  alert(userNames.length); //Displays '5' in the alert dialog\n  var\
    \ firstNameInArray = userNames.shift();\n  alert(firstNameInArray); //Displays\
    \ 'Helen' in the alert dialog\n  alert(userNames.length); //Displays '4' in the\
    \ alert dialog\n  var lastNameInArray = userNames.pop();\n  alert(lastNameInArray);\
    \ //Displays 'Oliver' in the alert dialog\n  alert(userNames.length); //Displays\
    \ '3' in the alert dialog\n</script>\n</body>\n```\n\nAbove: The shift() and pop()\
    \ methods remove the first and last elements, respectively.\n\n## Other Array\
    \ Methods\n\n(Note: The OCR text seems to be fragmented or incomplete in this\
    \ section based on the provided input, continuing with the next logical section.)\n\
    \n## OBJECTS\n\nFinally, once we again declare an object literal – but this time,\
    \ it's an empty one that could be used for storing answers to the questions in\
    \ the objects we've created.\n\nAbove: Step 4: Here, you will create an empty\
    \ object.\n\n5. Save your work. If you launch this page in Firefox, you won't\
    \ see any visual output, but that's OK – for now, this is more of a coding and\
    \ thought exercise, but we will be building on it as we progress.\n\n6. Notice\
    \ how we've created the same structure of property names within both of the quizQuestion\
    \ objects – creating and reusing object structures in this way is a key principle\
    \ in object oriented programming, which we discuss on page 219.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_165_0.png)\n"
  mdcn: "\n\n# 160 代码让 HTML • CSS • JAVASCRIPT 轻松\n\n方括号 `[]` 标记数组的开始和结束，而存储在数组中的值（即其元素）用逗号分隔，并可以是任何数据类型。要创建一个空数组，我们只需要输入括号且内部不包含任何元素。\n\
