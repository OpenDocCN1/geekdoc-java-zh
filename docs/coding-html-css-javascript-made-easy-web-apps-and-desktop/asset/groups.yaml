    3. Attributes allow you to modify an element.\n\n### Definition List\n\nHTML5\n\
    is largely made up of elements.\nElements\nare demarked by opening and closing\
    \ tags\nAttributes\nallow you to modify an element.\n\n> Above: Lists allow us\
    \ to present information in an attractive and logical manner.\n\n## UNORDERED\
    \ LISTS\n\nAn unordered list, `<ul>` is a simple bullet-point list. Each `<li>`\
    \ added to the list creates a new bullet-point. The list-style-type and list-style-image\
    \ style properties determine the appearance of the bullet-point markers.\n\n>\
    \ Hot Tip it is common to place a `<ul>` within a page's `<nav>` element in order\
    \ to create a navigation menu. The `<ul>` can be styled to render its items horizontally\
    \ or vertically.\n\n```css\nul {\n  list-style-type:circle;\n}\nol {\n  list-style-type:decimal;\n\
    }\n</style>\n</head>\n<body>\n<ul>\n  <li>HTML5 is largely made up of elements.</li>\n\
    \  <li>Elements are demarked by opening and closing tags.</li>\n  <li>Attributes\
    \ allow you to modify an element.</li>\n</ul>\n<h2>Ordered List</h2>\n<ol>\n \
    \ <li>HTML5 is largely made up of elements.</li>\n  <li>Elements are demarked\
    \ by opening and closing tags.</li>\n  <li>Attributes allow you to modify an element.</li>\n\
    </ol>\n</body>\n```\n\nAbove: `<ul>` and `<ol>` lists only differ in the way each\
    \ item is marked.\n\n## ORDERED LISTS\n\nIn an ordered list, `<ol>`, each item\
    \ is marked with a sequential number or letter. Interestingly, the style of numbering\
