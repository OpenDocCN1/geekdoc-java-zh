  md: "# How It Works\n\nThe condition expression of the if statement compares the\
    \ userAge value against a literal value, 16. Because userAge evaluates to 36,\
    \ and 36 is greater than 16, the if condition evaluates to true and the subsequent\
    \ expression is evaluated.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_189_0.png)\n\
    \n# Executing Multiple Statements\n\nThe form of if can only execute a single\
    \ statement when its condition is true, but we often need to execute multiple\
    \ statements. To do this, we add a statement block following the condition expression\
    \ (see Statement Blocks, page 63). The general form looks like this:\n\n```\n\
    if(condition) {\n  statement_1;\n  statement_2;\n  ...\n  statement_n;\n}\n```\n\
    \nNow, in the event that the condition evaluates to true, all of the statements\
    \ within the statement block (the body of the if statement) are executed.\n\n\
