  md: "Now let's look at the for loop in the second <script> element. The index is\
    \ initialized to 0. Then the condition i < questions.length is evaluated. When\
    \ i is 0 the condition evaluates to true, so the loop body is executed and text\
    \ is written to the page using the familiar document.write() technique. The important\
    \ thing to note is that we use the loop index, i, to access each element of the\
    \ questions array.\n\nOnce the statement block has completed, the iteration expression,\
    \ i++, is evaluated, adding 1 to the index, and the condition is tested once more.\
    \ The process repeats until the condition evaluates to false.\n\n# EXITING FROM\
    \ A LOOP OR ITERATION\n\nWe can exit a loop at any time by using the break keyword,\
    \ causing script execution to resume at the first statement following the loop.\
    \ We can also exit from the current iteration of a loop using continue, which\
    \ instructs the interpreter to evaluate the iteration and condition expressions\
    \ immediately, and then continue looping if required.\n\n```\n<script type=\"\
    text/javascript\">\nfor(var i = 0; i < questions.length; i++) {\n  if(typeof questions[i]\
    \ != \"Number\") {\n    // i is not a number it can't be an index - something's\n\
    \    // gone wrong so exit the loop\n    break;\n  } else if(questions[i].questionText\
    \ != \"\") {\n    // if the question has no text then skip this skip\n    continue;\n\
