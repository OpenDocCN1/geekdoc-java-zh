  md: '# AN INTRODUCTION TO HTML


    HTML is the most important component for building websites, web apps and anything
    else that''s delivered via the web. But what is it and what does it do?


    # WHAT IS HTML?


    HTML or HyperText Markup Language to give it its official title, is the framework
    upon which all websites are built. If a website were a house, HTML would be the
    bricks and mortar.


    HTML consists of elements, the bricks in our hypothetical house. An element starts
    and ends with something called a tag – the mortar, if you will. There are many
    different elements, each of which has a specific intended use. For example, the
    video element is used to – can you guess? – yes, place a video on a web page.
    When your choices of elements are put together in a suitable order you have a
    web page!


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_15_0.png)


    1 <h1>HTML is a collection of elements</h1>

    2 <h2>These elements are demarked by tags</h2>

    3 <p>Each element has a name - it is included in the tag</p>

    4 <p>Whatever appears between the opening and closing tags is the content of the
    element</p>


    Above: HTML is made up of elements, demarked by tags.'
  merge: -1
  pgno: 15
- img_proc: true
  md: "# WHAT DOES HTML LOOK LIKE?\n\nHTML is nothing more than plain text. If we\
    \ were creating the aforementioned video element we would write an opening tag.\
    \ <video>, and a matching closing tag. </video>. As you can see, the opening tag\
    \ starts with '<', states the element name, and finishes with '>'. The closing\
    \ tag follows the same pattern, but we insert a '/' before the element name. When\
    \ a web browser encounters it it creates a video player on the page. Simple, huh?\n\
    \n# What's Inside An Element\n\nSo, what goes between those tags? In most circumstances\
    \ the answer is text and/or other elements. This means that HTML has a nested\
    \ structure of elements within elements. Incidentally, many developers indent\
    \ lines of code to reflect this nesting.\",\n\n```\n<!DOCTYPE html>\n<html>\n\
    \  <head>\n    <title>My Page</title>\n  </head>\n  <body>\n    <header>\n   \
    \   <h1>A Page All About Me</h1>\n    </header>\n    <section>\n      <h2>I'm\
