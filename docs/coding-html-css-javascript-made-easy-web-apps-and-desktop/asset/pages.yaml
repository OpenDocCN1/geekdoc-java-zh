  md: '# RESPONSIVE WEB DESIGN


    Responsive Web Design, also known as RWD, is a technique for making a page or
    site adapt automatically to the type and size of device on which it is being viewed.


    # MEDIA QUERIES


    Responsive Web Design is powered by what are known as media queries. These are
    a component of CSS that allow you to use values that aren''t determined until
    the page is loaded into a browser. So instead of setting a <header> element to
    be, say, 1000 pixels wide, you could set it to always match the width of the browser
    window, no matter how wide that window, like this:


    ```

    header {width:device-width};

    ```


    Below: The Boston Globe''s website is one of the original examples of Responsive
    Web Design.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_120_0.png)'
  merge: -1
  pgno: 120
- img_proc: true
  md: '# DIFFERENT DEVICES, DIFFERENT STYLE SHEETS


    Desktop, tablet and smartphone screens are all of different widths and resolutions.
    The way to deal with this is to create multiple versions of a style sheet, each
    one tailored to support a specific class of device. The browser will then select
    a sheet based on the <style>/<link> element''s media attribute value.


    ```

    8

    9  <link

    10     rel="stylesheet"

    11     type="text/css"

    12     href="handheldSmall.css"

    13     media="handheld\ and max-device-width:480px"

    14

    15  />

    16  <link

    17     rel="stylesheet"

    18     type="text/css"

    19     href="handheldLarge.css"

    20     media="handheld\ and min-device-width:481px"

    21  />

    22

    23  <style media="all and not handheld">

    24

    25

    26    body {

    27        Font-family:

    28          Lux;

    29

    30

    31      #wrapper {

    32        width:1000px;

    33        height:auto;

    34      }


    ```


    **Above:** The browser can select a style sheet based on the type of device it
    is running on.


    # Same Meat, Different Gravity


    The various style sheets will all contain the same selectors, and the same style
    properties will be used in each selector''s style rule. What will be different
    the values assigned to the style properties. This means that the entire layout
    of your page will adapt itself to the user''s device.'
