  md: '# LISTS


    Lists are a staple of web design. There are two basic list types, unordered and
    ordered, both of which will contain one or more list items. A third type, the
    definition list, creates a glossary-like structure of titles and associated information.


    # LIST ITEMS


    Before looking at the list elements themselves, let''s consider what goes into
    a list. In HTML this is a list item element, `<li>`. Typically, these contain
    text but, as with other text-based elements, can also contain other elements such
    as images and hyperlinks. `<a>` elements are rendered in the order in which they
    appear in the parent list element.


    # Unordered List


    +   - HTML5 is largely made up of elements.

    - Elements are demarked by opening and closing tags.

    - Attributes allow you to modify an element.


    # Ordered List


    +   1. HTML5 is largely made up of elements.

    2. Elements are demarked by opening and closing tags.

    3. Attributes allow you to modify an element.


    # Definition List


    HTML5

    is largely made up of elements.

    Elements

    are demarked by opening and closing tags

    Attributes

    allow you to modify an element.


    > Above: Lists allow us to present information in an attractive and logical manner.'
  merge: -1
  pgno: 66
