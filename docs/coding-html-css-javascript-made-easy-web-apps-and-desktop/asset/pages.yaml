  md: '# UNDERSTANDING CSS SELECTORS


    We''ve already discussed CSS Type and ID selectors, but there is another important
    selector you need to know about: the Class selector. It is also possible to combine
    selectors in various ways; let''s take a look.


    # CLASS SELECTORS


    ```

    127 .italic {

    128   font-family:"source_sans_proitalic";

    130 }

    131 132 .bold {

    133   font-family:"source_sans_probold";

    135 }

    136 .footerText {

    137   position:absolute;

    138   font:10px "source_sans_proregular";

    139   color:#787878;

    140   right:0px;

    141   bottom:6px;

    142   width:auto;

    143   margin:6px 10px 6px auto;

    144   padding:0px;

    145 }

    147 .navButton {

    148   width:auto;

    ```


    Recall that a Type selector targets any HTML elements of matching type, and that
    an ID selector targets the single HTML element with a matching id attribute value.
    A Class selector, then, allows you to target a specific classification of HTML
    elements.


    A Class selector is written like this (notice the ''.'' which precedes the class
    name):


    ```

    .myClassName { style rule }

    ```


    This selector would target any and HTML elements that have been given the classification
    of myClassName.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_51_0.png)'
