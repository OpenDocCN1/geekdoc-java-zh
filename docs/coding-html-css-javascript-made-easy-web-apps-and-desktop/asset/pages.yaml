  md: '# CREATING A LIQUID LAYOUT


    When creating a <div> or other structural element, it is common to specify a width
    for it in absolute terms, for example, 1000px (''px'') is the code you use in
    CSS to denote pixels. If the browser window''s width is less than this then some
    of the page will spill over the edges and won''t be visible without scrolling.


    Stating sizes in percentages solves this problem to a certain degree because it
    keeps things in proportion: if a <div> element''s width is set to 80% then it
    will always be 80 per cent the width of its containing block. Throw together a
    few coloured <div> elements in a page to see how this works.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_118_0.png)


    Above & below: This arrangement of <div> elements highlights how liquid layouts
    work.


