    Above: Structural elements provide a logical structure into which a page''s content
    is written.


    # Site Navigation


    Most websites include a site navigation menu to allow users to move quickly and
    easily around the site; HTML5 provides the <nav> element to contain the elements
    of the elements of such a navigation menu. The <nav> element is generally created
    as a child of <header>, but this is not a requirement.'
