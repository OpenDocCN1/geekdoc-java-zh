  md: '# ORDERED LISTS


    In an ordered list, <ol>, each item is marked with a sequential number or letter.
    Interestingly, the style of numbering is determined by the list-style-type property,
    which is the same as with <ul>. This shows that the only real difference between
    <ul> and <ol> is the styling!


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_68_0.png)


    # DEFINITION LISTS


    A definition list, <dl>, is a bit like a glossary; each item consists of a title
    and a block of information relating to the title. This means each item in the
    list actually has two components: a <dt> element for the title and a <dd> element
    for the information (the second ''<dd>'' representing the word ''data'').


    | 19 | <body> |

    | 20 | <h2>Definition List</h2> |

    | 21 | <dl> |

    | 22 | <dt>HTML5</dt> |

    | 23 | <dd>HTML5 is largely made up of elements.</dd> |

    | 24 | <dt>Elements</dt> |

    | 25 | <dd>Elements are marked by opening and closing tags</dd> |

    | 26 | <dt>Attributes</dt> |

    | 27 | <dd>Attributes allow you to modify an element.</dd> |

    | 30 | </dl> |

    | 31 | </body> |


    # Definition List


    HTML5

    is largely made up of elements.

    **Elements**

    are marked by opening and closing tags

    **Attributes**

    allow you to modify an element.


    **Above:** Each item in a <dl> comprises two elements: <dt> and <dd>.


    # LISTS WITHIN LISTS


    If you wish to create a multi-tiered list, the solution is to place a new list
    element within an <li> or <dd> element. You can do this with any of the three
    list types, and you can mix and match the different types as required.'
