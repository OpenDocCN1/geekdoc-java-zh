- img_proc: true
  md: '# Arithmetic Operators


    An arithmetic operator performs arithmetic using the supplied operand(s) and returns
    the result of calculation. The operands must be numbers, or expressions that evaluate
    to numbers.


    > Hot Tip

    Go to https://en.wikibooks.org/wiki/JavaScript/Operators to find a complete list
    of JavaScript’s operators.


    | Operator | Number of operands | Name | Action | Example (result in brackets)
    |

    |---|---|---|---|--|

    | + | 2 | addition | Sums the left and right operands | 4 + 5 (9) |

    | - | 2 | subtraction | Subtracts the right operand from the left operand | 31
    - 14 (17) |

    | * | 2 | multiplication | Multiplies the left and right operands | 12 * 3 (36)
    |

    | / | 2 | division | Divides the left operand by the right operand | 12 / 3 (4)
    |

    | ++ | 1 | increment | Adds 1 to the value of the identifier that is the single
    operand | numUsers ++ (numUsers increases by 1) |

    | -- | 1 | decrement | Subtracts 1 from the value of the identifier that is the
    single operand | numUsers -- (numUsers decreases by 1) |'
  merge: -1
