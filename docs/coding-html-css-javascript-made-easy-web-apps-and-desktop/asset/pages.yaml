  md: '# HOW TO USE CSS


    Before delving deeper into CSS we need to establish how to include it in an HTML
    document. There are two ways to do this.


    # EMBEDDED STYLE SHEETS


    An embedded style sheet is one where all of the selectors and style rules appear
    in the <head> element of the HTML document they apply to. This is done by creating
    a <style> element (or elements, under some circumstances) within the page''s <head>
    element.


    You then type the desired selectors and style rules inside this <style> element.
    This approach has the advantage of keeping all of the code for a page – HTML and
    CSS – within a single file, but can become difficult to manage for larger sites
    comprising many pages.


    | |

    |---||

    | 5 | <head> |

    | 6 | <title>My Page</title> |

    | 7 | |

    | 8 | <style> |

    | 9 | body { |

    | 10 | font-family:Arial, Helvetica, sans-serif; |

    | 11 | font-size:14px; |

    | 12 | color:black; |

    | 13 | } |

    | 14 | h1 { |

    | 15 | font-size:24px; |

    | 16 | font-weight:bold; |

    | 17 | } |

    | 18 | h2 { |

    | 19 | font-size:18px; |

    | 20 | font-weight:bold; |

    | 21 | color:gray; |

    | 22 | } |

    | 23 | p { |

    | 24 | margin-top:6px; |

    | 25 | margin-bottom:6px |

    | 26 | } |

    | 27 | | |

    | 28 | </style> |

    | 29 | | |

    | 30 | </head> |


    # EXTERNAL STYLE SHEETS


    With an external style sheet, the CSS code is written in a separate file and then
    linked to any HTML documents you wish to apply the style sheet


    Above: Embedded style sheets are nested within the <head> of a document.'
