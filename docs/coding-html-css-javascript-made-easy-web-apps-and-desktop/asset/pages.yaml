  md: '# DOM PROGRAMMING


    JavaScript''s DOM classes, such as HTMLDocument and HTMLElementElement, provide
    numerous methods for manipulating a loaded page, and expose properties that directly
    map to HTML attributes. For example, a <p> element is represented in the DOM by
    an HTMLElementElement object. Any attributes defined on the <p> element are available
    to JavaScript as properties of the corresponding object; any properties defined
    by JavaScript on the object become attribute values of the <p> element.


    # JavaScript


    ```

    var paraElement = document.createElement("p");

    paraElement.id = "para1";

    paraElement.className = "articlePara";

    paraElement.style = "color:#FFCC00";

    paraElement.innerHTML = "Hello World!";

    ```


    ```

    <p id="para1" class="articlePara" style="color:#FFCC00;">Hello World!</p>

    ```


    # HTML


    Above: Attributes of an HTML element become properties of the corresponding DOM
    object, and vice versa


    # Retrieving Elements from the DOM


    As we''ve seen, all HTML elements (with the exception of <html>) have to be nested
    within another element. Therefore, to add a new element to a page with JavaScript,
    we often have to retrieve the element from the DOM that will serve as the parent
    of the new element. At other times, we may want to apply, a style change to all
    elements of a certain type.


    The methods for getting elements are defined on the single HTMLDocument instance,
    the top level of the DOM. We have already been using this object in our scripts
    – every time we type document, we are accessing this HTMLDocument object.'
