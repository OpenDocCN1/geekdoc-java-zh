  md: '![](img/36c6072bc9bbf8851fd6b2169dfe432d_25_0.png)


    # HEAD AND BODY ELEMENTS


    +   1 <!DOCTYPE HTML>

    2

    3 <html>

    4

    5 <head>

    6

    7 </head>

    8

    9 <body>

    10

    11

    12 </body>

    13 </html>

    14


    The special <html> element always has two child elements, no more, no less: <head>
    and <body>, in that order. Without these two elements a web page will not work
    properly (if at all).


    The <head> element contains information about the web page, as its title (shown
    at the top of the browser window), the text that will appear in search listings,
    links to other resources, and so on. Nothing within the <head> is rendered into
    the visible part of the web page.


    The <body> element takes care of the actual visible content of your page, i.e.
    the elements that produce visual output on the rendered web page. Typically you
    add elements to the <body> in the layout order they will appear on-screen.


    Above: The <html> element always contains a <head> and a <body> element'
