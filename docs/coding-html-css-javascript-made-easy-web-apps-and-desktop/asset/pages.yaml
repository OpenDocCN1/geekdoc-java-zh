    point to the same data in memory, so changing one changes the other, too.


    # Know Your Primitive from Your Reference


    It is important to keep this distinction in mind – not doing so can lead to some
    major bugs in your JavaScript applications.


    ```

    <script type="javascript">

    var playerObjectTemplate = {};

    var player1 = playerObjectTemplate;

