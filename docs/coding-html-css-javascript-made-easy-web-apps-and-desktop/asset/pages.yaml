  md: '# BUILDING A WEBSITE


    The process of building a website is much more than just adding HTML and CSS.
    Here we show how to plan a site, build it with HTML and CSS, and how to get a
    website online.


    # PLANNING AND SKETCHING


    When building a web page it''s not simply a matter of jumping straight in and
    starting to code with HTML and CSS. Any good website will need some planning.
    This helps to determine the layout and where the various page elements are to
    be placed, in turn helping to speed up the design and development process.


    # What Should a Sketch Include?


    A sketch could be as simple as a few boxes showing the main layout elements and
    a few additional details. However, the more details and thought put into a sketch,
    the easier the build


    Below: Get a sketchpad to plan your site.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_71_0.png)'
