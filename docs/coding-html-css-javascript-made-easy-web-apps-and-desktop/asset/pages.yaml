  md: "# Typed Class Selectors\n\nThis can be taken a step further by combining a\
    \ Class selector with a Type selector, for example, article.newsStory {style rule}.\
    \ This selector would target all <article> elements that have been given a classification\
    \ of \"newsStory \\ But how do we classify an element? Easy...\n\n# The Class\
    \ Attribute\n\nEvery visual element has a class attribute. Here's how it looks:\
    \ <article class=\"newsStory\">Once given a classification in this, the element\
    \ will receive the style rule associated with the .newsStory selector. If the\
    \ selector had been p.newsStory then the element would not have been selected\
    \ because it is an <article>, not a <p>.\n\n> Hot Tip Beware: Using Class selectors\
    \ can increase the risk of conflicting style properties being applied to an element.\n\
    \n```\n<body>\n  <header>\n    <h1> Page All About Me</h1>\n    <nav class=\"\
    navbarButton\">Home | About Me | Contact/</nav>\n  </header>\n  <section>\n  \
    \  <h2 class=\"italic\">What I'm thinking now</h2>\n    <p class=\"italic\">Lorem\
