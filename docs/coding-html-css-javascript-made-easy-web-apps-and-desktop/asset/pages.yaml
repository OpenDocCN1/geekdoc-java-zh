  md: '# WORKING WITH THE DOM


    Every script we''ve written so far has worked by outputting data to the page while
    the page loads. This is OK – but limiting. What if we want to manipulate the page
    after it has loaded? How do we achieve this?


    # DYNAMIC HTML


    All major browsers support something called Dynamic HTML — ormost for short. HTML
    allows JavaScript to make changes to a page after it has been loaded and rendered
    in the browser, with which changes immediately shown on screen. This presents
    us with a whole host of possibilities – your imagination really is the limit.


    ```

    24 We''ve checked userAnswer see comments within the body of the

    25 method();

    26

    27 com.lametreublishing.QuizQuestion.prototype.checkAnswer = function(answerIndex)
    {

    28     //Initialize this to false - we can change this if the question is correctly
    answered

    29     varResult = false;

    30     if(this.questioned) {

    31         //If the question has already been answered then report it in an alert
    and do not modify

    32         alert(''you''ve already answered this question'');

    33     } else {

    34         this.questioned = this.correctAnswer(answerIndex);

    35         //If the correct answer is given then mark the question as being correctly
    answered

    36         theResult = true;

    37 //How to set the color of the question''sdiv so that it changes to green

    38 document.getElementById("q" + this.questionNum).className = "correctAnswered";

    39     theResult = true;

    40 } else {

    41     //If the question has been incorrectly answered then change the div - style
    class name

    42     // that it has a red highlight

    43 document.getElementById("q" + this.questionNum).className = "incorrectlyAnswered";

    44 }

    45 }

    46 //Record that this has now been answered

    47 this.questioned = true;

    48 //How to return the result - this isn''t actually being used any more, but
    it''s nonetheless

    49 //useful to have methods return a result, even if only to indicate that the
    code was

    50 //executed in full without errors.

    51 return(theResult);

    ```'
