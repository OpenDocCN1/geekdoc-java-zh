    # SOME OF MY LINKS AREN’T WORKING


    Links are critical to site navigation, so broken links can be a big problem. The
    first thing to check is that the <a> element and its href attribute’s URL are
    both written correctly – if there is one mistake in the URL it won''t work. If
    you are using a relative URL then changing to an absolute one (starting with http/)
    can solve the problem.


    # FONT ISSUES


    Computers come with fonts such as Arial, Helvetica and Georgia installed. However,
    if you are using a different font it may not be available on the user’s computer
    and so a substitute will be used. Web fonts get around this, but the correct code
    must be added in the right place. Use Google Fonts – https://www.google.com/fonts
    – for peace of mind.


