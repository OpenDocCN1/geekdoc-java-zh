  md: '# WHAT IS CSS3?


    CSS3 is still CSS; it is simply the latest version of the language. This third
    major version brings with it some important enhancements that make the language
    much more capable than previously.


    # VISUAL EFFECTS


    One of the main advances in CSS3 is its ability to apply visual effects, such
    as drop shadow or blur, that would previously need to be produced in an image
    editor such as Adobe Photoshop. The effects on offer are fairly basic, but they
    are a godsend to developers who no longer have to jump back and forth between
    HTML editor and image editor just to put a little shadow on a graphic.


    Below: A simple example of a CSS shadow.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_34_0.png)


