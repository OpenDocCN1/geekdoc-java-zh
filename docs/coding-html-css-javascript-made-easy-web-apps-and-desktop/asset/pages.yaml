  md: 'A. A CSS document is simply a plain text file, typically saved with a ''.css''
    filename extension.


    # Linking CSS to HTML Documents


    An external style sheet is associated with an HTML page using a <link> element
    placed in the <head> of the page:


    ```

    <link type="text/css" rel="stylesheet" href="myCssDocument.css" />.

    ```


    Note that the tag for this element is not paired with a closing tag, but includes
    a ''/'' before the final angle-bracket. This is commonly known as a self-closing
    tag or element; the reason it is self-closing is because no other elements can
    be nested within it.


