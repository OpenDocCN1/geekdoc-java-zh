  md: '# A STEP UP FROM HTML/CSS


    Despite JavaScript''s at-times esoteric nature, it is the perfect language to
    use for learning about coding in general. This book is aimed at people who are
    quite new to writing code and programming. You may be completely new to HTML,
    CSS and JavaScript; you may have spent some time with HTML and CSS and want to
    refresh your knowledge and learn about JavaScript; or you may have tinkered with
    a bit of scripting and want to formalize and expand on that knowledge. You may
    even be an experienced programmer who has never used JavaScript and wants a quick
    overview to get started.


    # GO-TO PRIMER


    There''s no getting away from the fact that JavaScript is a deep subject, so much
    so that no single book can tell you all there is to know about the language and
    what it can achieve. What this book aims to do, then, is to deliver a wide-ranging
    overview of the JavaScript language, and give you sufficient understanding to
    be able to add your own simple scripts and interactions to your pages. It is also
    perfect as a primer for further studies in coding with JavaScript.


