  md: '# CODING HTML • CSS • JAVASCRIPT MADE EASY


    Therefore it includes a new set of elements that satisfies this need for semantic
    meaning, for example,<header>, <video>, <article> and <footer>. The fact that
    the element names convey exactly what these new elements are for what makes them
    semantic.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_33_0.png)


    # NEW FUNCTIONALITY


    HTML5 introduced a lot of new functionality to web pages that previously have
    required third-party plug-ins, such as Adobe Flash Player, to be installed on
    the end-user''s browser. These new features are a breath of fresh air to developers
    because they make it infinitely simpler to add functionality, such as drag-and-drop,
    web forms, video, audio, ''live'' graphics (including 3D), and much more.


    # Better for Mobile


    Many popular browser plug-ins cannot be installed on mobile operating systems.
    HTML5 has fixed this byating the need for many third-party plug-ins, and so if
    you expect your web pages to be viewed on mobile devices HTML5 is the only game
    in town.


    **Above:** HTML5 works beautifully on mobile devices.'
