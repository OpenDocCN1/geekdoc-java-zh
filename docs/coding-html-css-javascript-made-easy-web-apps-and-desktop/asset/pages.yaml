  md: '# TEXT-BASED ELEMENTS


    Most web pages contain text – often quite a lot of it – and so unsurpriseingly
    there is a collection of elements that are dedicated to displaying text. Text
    elements tend to be nested within the structural elements we''ve discussed previously.


    # HEADING TEXT


    There is a group of HTML elements that is dedicated to displaying headings; their
    names are very easy to remember. The first is called <h1>, the second <h2> and
    so on until we reach <h6> .


    > **Hot Tip**


    `<h4>` to `<h6>` are rarely used – just how many levels of heading does one need??!


    ```

