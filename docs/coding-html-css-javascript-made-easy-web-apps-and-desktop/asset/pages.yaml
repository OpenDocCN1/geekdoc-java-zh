  md: "# CSS TRANSFORMS\n\nTransforms manipulate the visual appearance of HTML elements.\
    \ For example, the rotate style property will rotate an element. This makes it\
    \ easy to turn a square into a diamond, for example. Other properties include\
    \ scale and skew. The former makes an element larger, whilst the latter tilts\
    \ an element.\n\n# CSS TRANSITIONS\n\nTransitions allow elements to change visually\
    \ over a specified time period. A simple example of the transition property is\
    \ typically found on buttons. These will have an initial background colour which\
    \ fades to another colour when the mouse cursor is hovered over the button. Used\
    \ subtly, such effects add a touch of class to a site.\n\n```\n<style>\n  div\
    \ {\n    position:absolute;\n    width:100px;\n    height:100px;\n    background-color:red;\n\
    \  }\n\n  #box {\n    left:200px;\n    top:200px;\n  }\n\n  #rotatedBox {\n  \
    \  left:400px;\n    top:200px;\n    transform:rotate(45deg);\n  }\n</style>\n\
    ```\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_103_0.png)\n\n**Left & Above:**\
    \ Transforms allow the position and orientation of elements to be adjusted."
  merge: -1
  pgno: 103
- img_proc: true
  md: "# How Transitions Work\n\nWe already know how to use Pseudo-Class selectors\
    \ to make an <a> element respond to different states, such as :hover, when the\
    \ mouse pointer is over an element. What you may not realize that Pseudo-Class\
    \ selectors can operate on any visual element. This is the key to triggering a\
    \ transition; we define it within a Pseudo-Class selector's style rule.\n\nFor\
    \ example, if we had an element with an id of \"homeButton\", then we could target\
    \ a specific style rule at this button when the mouse is over it using an ID selector.\
    \ We would then define the transition within the style rule (see illustration).\n\
    \n![](img/36c6072bc9bbf8851fd6b2169dfe432d_104_0.png)\n\n```\n#homeButton:hover\
    \ {\n  transition-property:background-color;\n  transition-duration:0.6s;\n  transition-timing-function:ease;\n\
    \  background-color:blue;\n}\n```\n\n**Above:** There are a number of style properties\
    \ that, taken together, define the transition."
  merge: -1
  pgno: 104
- img_proc: true
  md: '# CSS KEYFRAMES


    # # Hot Tip


    Related groups of CSS properties often have a shorthand equivalent that can set
    all such properties in one line of code. For example, the various animation-style
    properties can be declared simultaneously via the animation property.


    Keyframes are a concept from the world of animation. They specify a point in time
    and the state of an object at that point – the intermediate steps between the
    keyframes can then be calculated by the computer. Until HTML5 and CSS3 came along,
    Adobe Flash was the standard for creating keyframed animations on a web page,
    but not any more!


    # Apply an Animation


    Animations can be applied to almost every element in a web page. Here we are going
    to demonstrate how to animate a <div> element moving across the screen.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_105_0.png)


    **Above:** CSS animation changes the value of a style property over time'
  merge: -1
  pgno: 105
- img_proc: true
  md: '# Creating a Simple Animation


    +   1. Create a new HTML document, add the basic structural elements (<html>,
    <head> and <body>) and create a <style> element in the <head>. Save the file as
    movingbox.html.


    +   2. Add a <div> within the body and give it an id of ''boxToMove''. In the
    <style> element create an ID selector and define a style rule that will size the
    <div> to 100 x 100 pixels and give it a background colour so we can see it on-screen.


    +   3. We''ll now add the animation code to the style rule. Copy the style properties
