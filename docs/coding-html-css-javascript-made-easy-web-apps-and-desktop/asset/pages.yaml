  md: '# CONTROLLING MOBILE BROWSER SCALING


    Web browsers running on mobile devices behave quite differently to a desktop browser
    when it comes to sizing a page. This is due to the way in which mobile devices
    scale between their physical resolution and an internal viewport size.


    # THE VIEWPORT


    A mobile browser''s viewport is the area in which it renders the visual content
    of the page. When the page loads, this viewport is scaled with the aim of making
    the viewport fit within the physical dimensions of the device''s screen. When
    you zoom in and out with a nip of your fingers, you''re actually adjusting the
    viewport scaling, and when you scroll around the page you''re actually moving
    the viewport around.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_124_0.png)


    **Right:** The viewport can, and often does, extend beyond the visible area of
    the screen.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_124_1.png)'
  merge: -1
  pgno: 124
- img_proc: true
  md: "![](img/36c6072bc9bbf8851fd6b2169dfe432d_125_0.png)\n\n# The Viewport Meta\
    \ Tag\n\nIn order to have the browser adopt a suitable initial scaling for the\
    \ viewport, we have to let it know what size we want it to assume; if we don't\
    \ this then a default value will be used which may or not be suitable. We set\
    \ the scaling via a <meta> tag placed in the <head> of the page.\n\n# Viewport\
    \ Properties\n\nThe thing we are interested in is the value of the content attribute.\
    \ This is used to set a viewport property; in our example we are telling the viewport\
    \ to match the physical width of the device. Available properties are: width,\
    \ height, minimum-scale, maximum-scale, initial-scale and user-scalable.\n\n```\n\
    <head>\n  <meta name=\"viewport\" content=\"width=device-width\">\n  <title>My\
    \ First Web Page</title>\n</head>\n```\n\nAbove: The viewport meta tag defines\
    \ the initial scaling employed by a mobile browser"
