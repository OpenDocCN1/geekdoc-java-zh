  md: "# ADDING A SCRIPT TO A PAGE\n\nWe add scripts to a page by using the <script>\
    \ HTML element. The type attribute of the element must always be \"text/javascript\"\
    . The element should always be closed with a closing tag, </script>.\n\n# Embedded\
    \ JavaScript\n\nTo embed a script, we simply write its commands between the opening\
    \ and closing <script> tags. The script is intrinsically tied to that page, and\
    \ that alone.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"UTF-8\"\
    >\n  <title>Untitled Document</title>\n  <script type=\"text/javascript\">\n \
    \   // Embedded JavaScript code here\n  </script>\n  <script type=\"text/javascript\"\
    \ src=\"js/myScript.js\"></script>\n</head>\n<body>\n</body>\n</html>\n```\n\n\
    **Linked JavaScript**\nIt is common to link a script to a page. To do this, the\
    \ script is written in a separate text file and saved with a .js filename. The\
    \ script is then linked to a page using the src attribute of the <script> element.\n\
    \nAbove: The HTML <script> element can contain an embedded script or link to an\
    \ external script file.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_141_0.png)\n\
    \nFor example:\n\n```\n<script type=\"text/javascript\" src=\"myScript.js\"></script>\n\
    ```\n\nLeft: Store your scripts in a subfolder of your website\nJs is a good name\
    \ for this folder."
