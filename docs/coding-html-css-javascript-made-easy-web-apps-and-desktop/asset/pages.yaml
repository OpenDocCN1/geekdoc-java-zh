  md: '# # WHAT IS DATA?


    A key concept in all programming languages is data. Data can be thought of as
    any piece of information that is used within a program.


    # ## ALL DATA HAS A VALUE


    Any piece of data can be said to have a value. This value can be simple – for
    example, a number or a paragraph of text – or it can be complex, such as a list
    of numbers or many paragraphs. Whatever the type of data, though, the information
    being represented by that data is referred to as the data''s value.


    ### Literals

    A literal is a piece of data with a specific value that''s typed directly into
    a script. The following are all examples of literals: "Hello World", true, 42
    and null.


    ### Identifiers

    An identifier is a case sensitive name that''s assigned to a piece of data (or
    to a function – see Named Functions on page 205). Once assigned, an identifier
    can be used to refer to that data (or function) within a script. JavaScript leaves
    you free to choose the names you wish to use as identifiers, as long as you follow
    a few basic rules.


    ```

    3 myNumberLiteral = 42;

    4 myStringLiteral = "Hello World";n5 myBooleanLiteral = true;

    6 myNullLiteral = null;

    ```'
  merge: -1
