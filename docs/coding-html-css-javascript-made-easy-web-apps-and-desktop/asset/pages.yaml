  md: '# VARIABLE SCOPE


    When a variable is declared outside of functions or statement blocks, it is available
    from anywhere in the web page, so so is known as a global variable. Another way
    of putting this is that the variable exists within the global scope.  Conversely,
    variables declared within a function are only accessible from within that function
    – they are said to be within the function''s scope.


    # The Scope Chain


    Scope is hierarchical – one scope is nested within another. For example, named
    functions always exist in the global scope. An expression can only access variables
    that are in the same scope as – or are further up the scope chain than – the expression.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_211_0.png)


    **Above:** Variable scope is hierarchical. A variable in one scope can''t access
    deeper-nested scopes.'
  merge: -1
  pgno: 211
