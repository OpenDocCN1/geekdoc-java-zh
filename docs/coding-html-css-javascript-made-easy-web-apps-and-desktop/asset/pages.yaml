  md: "# ANONYMOUS FUNCTIONS\n\nIn JavaScript, a function is just another form of\
    \ data. This means that you can create a function and assign it to a variable\
    \ or object property. Such functions are called anonymous functions, because they\
    \ don't have a function name.\n\n# Declaring an Anonymous Function\n\nWe declare\
    \ an anonymous function by assigning a function literal to a variable or object\
    \ property. The general form looks like this:\n\n```\nvar myAnonymousFunction\
    \ = function(parameter(s)) {\n    statement(s);\n}\n```\n\n# Invoking an Anonymous\
    \ Function\n\nInvoking an anonymous function is no different to invoking a named\
    \ one; we just use a variable name or property reference instead of a function\
    \ name. To all intents and purposes, this is identical to invoking a named function.\n\
    \n```\n1 //This is a named function...\n2 function calculateRectArea(rectWidth,\
    \ rectHeight) {\n3 return(rectWidth * rectHeight);\n4 }\n56 //This is an anonymous\
    \ function...\n7 var calculateRectHypotenuse = function(rectWidth, rectHeight)\
    \ {\n8 var widthSquared = rectWidth * rectWidth;\n9 var heightSquared = rectHeight\
    \ * rectHeight;\n10 return(Math.sqrt(widthSquared + heightSquared)); //Math.sqrt()\
    \ calculates a square root\n11 }\n113 //Calls to either function have the same\
    \ general form:\n14 var myRectArea = calculateRectArea(49, 28);\n15 var myRectHypotenuse\
    \ = calculateRectHypotenuse(49, 28);\n16\n```\n\nAbove: Named and anonymous functions\
    \ are called in the same way."
  merge: -1
