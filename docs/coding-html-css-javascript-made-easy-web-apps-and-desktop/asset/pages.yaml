  md: "# UNORDERED LISTS\n\nAn unordered list, <ul> is a simple bullet-point list.\
    \ Each <li> added to the list creates a new bullet-point. The list-style-type\
    \ and list-style-image style properties determine the appearance of the bullet-point\
    \ markers.\n\n> Hot Tip is common to place a <ul> within a page's <nav> element\
    \ in order to create a navigation menu. The <ul> can be styled to render its items\
    \ horizontally or vertically.\n\n```\nul {\n  list-style-type:circle;\n}\n\\ol\
    \ {\n  list-style-type:decimal;\n}\n</style>\n</head>\n<body>\n<ul>\n  <li>HTML5\
    \ is largely made up of elements.</li>\n  <li>Elements are demarked by opening\
    \ and closing tags.</li>\n  <li>Attributes allow you to modify an element.</li>\n\
    </ul>\n<h2>Ordered List</h2>\n<ol>\n  <li>HTML5 is largely made up of elements.</li>\n\
    \  <li>Elements are demarked by opening and closing tags.</li>\n  <li>Attributes\
    \ allow you to modify an element.</li>\n</ol>\n</body>\n```\n\nAbove: <ul> and\
    \ <ol> lists only differ in the way each item is marked."
