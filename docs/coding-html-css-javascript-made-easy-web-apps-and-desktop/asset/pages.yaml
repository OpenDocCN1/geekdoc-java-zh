  md: '# ADVANCED TEXT


    As we have learned, HTML is nothing more than plain text; it only works at all
    because web browsers recognize characters that have a special meaning in HTML,
    such as ''<'' and ''>''. But what if we want to use one of those special characters
    within the text of a page?


    # SPECIAL CHARACTERS


    There are a number of characters that, if typed into a text-based element such
    as <p>, will cause errors and the page will not be rendered correctly (if at all).
    For example, we may wish to include angle brackets in a passage about mathematical
    formulae (or, indeed, HTML), or quote marks when quoting what somebody has said.
    The problem is that such characters have specific predefined meanings in HTML
    and so will be misinterpreted by the browser.


    > "There are many special characters in HTML" said the man. "Characters such as
    ''<'' and ''&'' can''t be typed directly into the text of an HTML document." he
    said.


    He went to explain that the same was true of "extended" characters such as ©,
    μ and many more. Accented latin characters, such as ''Á'' and ''É'' are also classed
    as extended characters, he explained.


    Above: Some characters have special meaning in HTML and can''t be typed directly
    into an element.'
