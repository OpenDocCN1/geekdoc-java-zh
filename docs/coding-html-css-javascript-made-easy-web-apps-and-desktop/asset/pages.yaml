  md: '# STYLING LINKS


    As with all elements, <a> has a default appearance derived ultimately from the
    browser''s default style sheet. In the case of <a> that default styling is typically
    for blue underlined text. We can override this, or by attaching style rules to
    an <a> element, either directly or via style inheritance.


    However, a hyperlink typically changes styling depending on its state, i.e. if
    the mouse pointer is over it, if the user has previously clicked the link. This
    state-based styling is achieved through CSS Pseudo-Class selectors.


    > Hot Tip

    A web browser provides a default style sheet. This defines values for all CSS
    properties, and is the starting point of the style cascade.


    **Below:** Hyperlinks have a default appearance.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_64_0.png)'
