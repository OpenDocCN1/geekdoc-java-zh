  md: '# DOING THINGS WITH STYLE


    In old versions of HTML a plethora of different attributes existed for controlling
    the visual appearance of elements. What''s more, different elements had wildly
    varying sets of attributes that they recognized. Remembering all of the connotations
    and variations was a nightmare, and so the style attribute was developed.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_18_0.png)


    # Obey The Rules


    The value assigned to a style attribute is called a style rule and this consists
    of one or more style commands. A style command is a pairing of a style property
    and a value to be applied to that property, for example:


    ```

    <body style="color:green; font-weight:bold;">

    ```


    Each style property name (color and font-weight in this example) is followed by
    a colon '':'', then the value to be assigned to that property, and finally a semicolon
    '';''.


