  md: '# # BROWSER SUPPORT


    There is a host of browsers for desktop and mobile, all offering different levels
    of support for HTML5 and CSS3. On the desktop the major browsers are Chrome, Firefox,
    Internet Explorer and Safari, so you should aim to test all of your sites in at
    least these four browsers.


    # ## WHICH BROWSERS SHOULD I SUPPORT?


    There is no doubt Chrome, Firefox, Internet Explorer, Safari and even Opera should
    be supported on the desktop. The question is which version should you support?
    As a general rule, encourage visitors to your site to install and use the latest
    version of their preferred browser(s).


    > **Hot Tip**nDownload and install the main browsers so that you can test your
    pages in each one.


