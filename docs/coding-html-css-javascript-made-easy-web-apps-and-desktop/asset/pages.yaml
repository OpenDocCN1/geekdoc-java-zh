  md: '# Styling Within a Paragraph


    There are many occasions when you will want to change the text format within a
    paragraph, such as when you wish to emphasize a word or passage with *italic*
    or **bold** text. There are a few ways to do this: italicizing can be achieved
    by wrapping a span of text in an `<em>emphasis</em> element:


    ```

    <p>Mary had a <em>little</em> lamb</p>

    ```


    Or for bold text:


    ```

    <p>It really <b>was</b> a dear</p>

    ```


    A better way, however, is to use the `<span>` element. It is much more flexible
    because than giving a single style property change, it can apply a whole style
    rule – or rules – in one go:


    ```

    <p>But she <span class="redText italic">couldn''t tell the difference</span</span></p>

    ```


    > Hot Tip

    When adding child elements to a text-based element it is normal to place the new
    tags within the text without creating new lines or indentation in the code.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_61_0.png)


    **Above:** Text format changes within a paragraph are easy with the `<span>` element'
