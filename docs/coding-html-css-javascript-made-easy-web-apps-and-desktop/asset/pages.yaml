  md: '![](img/36c6072bc9bbf8851fd6b2169dfe432d_21_0.png)


    # WHY CASCADING?


    When writing HTML we create a nested structure in which every element is nested
    within another element. This means that every element has a **parent** element
    – the element in which a given element is nested – and most elements have **child**
    element(s), i.e., the element(s) nested within a given element.


    | 12 | |

    | 13 | |

    | 14 | |

    | 15 | <section> |

    | 16 | <h3>Lorem Ipsum</h3> |

    | 17 | </section> |

    | 18 | |


    When a web browser **renders** (draws) an element in a web page, it has to assess
    which style rule to apply to that element. But what if it were rendering an element
    that displays text, such as `<h3>`, but no font-family property has been defined
    in the style rule applied to that element – how does the browser determine which
    font to use? The answer is that it looks to the parent element and copies the
    font-family property from there.


    Above: HTML-nested structure is expressed in terms of ancestry. Here `<h3>` is
    the child of `<section>`, and `<section>` is the parent of `<h3>`'
  merge: -1
  pgno: 21
- img_proc: true
  md: "If a parent element also lacks a specific style property then that property\
    \ would be inherited from the parent's parent, and so on. Ultimately we have a\
    \ 'cascade' of style properties in which a property applied to one element will\
    \ be inherited by the children of that element, unless a child specifically overrides\
    \ it with a new rule of its own. When this happens the properties of the new rule\
    \ are passed into the inheritance chain.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_22_0.png)\n\
    \n# Components of CSS\n\n+   - Selector: Targets the HTML element(s) that style\
    \ rules will be applied to.\n- Style command: Specifies a style property and assigns\
    \ a value to it (aka a 'property-value pair').\n- Style rule: A collection of\
    \ style properties and their associated values.\n\nRight: A complete CSS stylesheet\
    \ containing multiple selectors and style rules.\n\n```\nbody {\n  position:relative;\n\
    \  background-color:#FD5F12;\n  margin:0px;\n  padding:0px;\n  width:100%;\n \
    \ height:100%;\n}\n```\n\n```\n#pageBgFill {\n  position:fixed;\n  width:1024px;\n\
