  md: '# THE PRIMITIVE DATA TYPES


    Let''s take a look at the primitive data types. Remember, variables of these types
    represent a single value.


    # Booleans


    Booleans represent a single bit of computer data and as such are simplest data
    type there is. A Boolean can have a value of either false or true, represented
    within the computer as 0 or 1 respectively.


    # Numbers


    Generally, in computing, there are two types of number: integers and floats. The
    former are whole numbers, and the latter are numbers that involve a fractional
    or exponential component, such as 3.14 or 0.945x10⁷. JavaScript doesn''t worry
    itself with such distinctions – a number is a number.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_156_0.png)'
