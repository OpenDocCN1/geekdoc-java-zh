  md: "# Parameters of the AddEventListener() Method\n\n+   - **Event type**: The\
    \ first parameter indicates the type of event to listen for. This is a string\
    \ such as \"click\", \"keydown\" or \"mouseover\".\n\n+   - **Handler expression**:\
    \ Typically a reference to a handler function or method. Note that when referencing\
    \ a function or method, we do not include parentheses.\n\n+   - **Use capture**:\
    \ This is complex and beyond the scope of the book. Until you learn what this\
    \ does, always pass false to this parameter.\n\n```\nfunction clickHandler() {\n\
    \  //do things in response to the click\n}\n\nvar myPara = document.createElement(\"\
    p\");\ndocument.body.appendChild(myPara);\nmyPara.addEventListener(\"click\",\
    \ clickHandler, false);\n```\n\n*Above: Adding an event listener to a <p> element*\n\
    \n# Adding Event Listeners\n\nWe've created our event handler, but it doesn't\
    \ do anything until triggered by an event listener.\n\n+   1. Open Quiz.js and\
    \ locate the for loop in the renderQuestion method.\n\n```\nfor(var i = 0; i <\
