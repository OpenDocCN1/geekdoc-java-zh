  md: "# WHAT HAPPENS WHEN A BROWSER ENCOUNTERS A SCRIPT?\n\nWhenever a web browser\
    \ loads a page, it deals with each HTML element sequentially as it works through\
    \ the page.\n\n# THE INTERPRETER\n\nWhen the browser encounters a `<script type=\"\
    text/javascript\">` element, the contents of the script are immediately passed\
    \ to the browser's JavaScript **interpreter** (known as executing the script).\
    \ It is the interpreter's job to make sense of the script and instruct the browser\
    \ accordingly.\n\n```\n<!DOCTYPE HTML>\n<html>\n<head>\n  <title>A Simple Quiz</title>\n\
    \  <script type=\"text/javascript\" src=\"js/QuizQuestion.js\"></script>\n  <script\
    \ type=\"text/javascript\" src=\"js/SimpleQuiz.js\"></script>\n  <script type=\"\
    text/javascript\" src=\"js/quizStartup.js\"></script>\n</head>\n<body>\n\n</body>\n\
    </html>\n```\n\nWhen the interpreter has finished executing a script, control\
    \ is returned to the browser, which then continues to process the page.\n\n**Right:**\
    \ JavaScript is processed in-place as the page loads.\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_142_0.png)"
