  md: 'When this is used in a class method, it refers to the specific instance of
    the class that the method is being executed on. This will become clearer over
    the coming exercises.


    # CLASS METHODS


    A method is similar to a function. In simple terms, where a function is a stand
    alone entity that can have objects passed to it, a method is part and parcel of
    an object, and operates from the context of that object.


    We''ve already met a few methods of the built-in classes – for example, the push
    () method of the array class. When we call push (), we do so via an instance of
    the array class: myArray.push(newValue), hence it is a method.


