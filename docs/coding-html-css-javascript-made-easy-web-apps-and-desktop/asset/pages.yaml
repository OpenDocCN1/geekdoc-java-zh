  md: '# EVENTS


    Web pages issue events in response to various conditions and user actions, such
    as a page having loaded successfully, or the user clicking on something. Responding
    to these events is one of JavaScript''s key roles.


    # JAVASCRIPT EVENT MODELS


    There are a few different event models in JavaScript that have evolved over the
    years. We don''t have space to cover them all, so we''ll focus on the current
    best practice model, known as the W3C model. This isn''t the simplest of the models,
    but it''s the one that you aim to use.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_239_0.png)


    > Hot Tip

    If you want to explore all of the JavaScript event models, an excellent discussion
    of them can be found at www.quirkasmode.org/j/introevents.html


    Left: Quirksmode.org/ is a fantastic resource for both new and experienced JavaScript
    developers.'
  merge: -1
  pgno: 239
- img_proc: true
  md: '# WHAT IS AN EVENT?


    An event is a message issued by the browser. An event always has a type – the
    type indicates the nature of the event – whether it''s a click, a page load, a
    key press and so on. For example, clicking on any element in a page causes that
    element to send – or dispatch – an event of type "click".


    # LISTENING FOR AN EVENT


    In order to respond to an event, we have to write code that ''listens'' for that
    event occurring – this code is called an event listener. When an event listener
    detects an event of the type it is listening for, it evaluates an expression that
    performs some action(s) in response to the event.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_240_0.png)


    Above: Events are generated by elements on a page: JavaScript can listen for those
    events.'
  merge: -1
  pgno: 240
- img_proc: true
  md: '# Event Handlers


    Typically, when an event listener is triggered, the expression executes is a function
    or method call. The function or method being called is referred to as an event
    handler. It is the event handler''s job to deal with the event in some way – making
    visual changes, sending data to a server, and so on.


    # Adding an Event Handler


    Our Simple Quiz application needs to be able to respond to the user clicking on
    an answer – let''s define an event handler as a first step.


