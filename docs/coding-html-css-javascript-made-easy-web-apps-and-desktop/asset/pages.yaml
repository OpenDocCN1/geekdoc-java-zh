  md: "# ADDING AUDIO 5x6-(7+2)-18=\n\nHTML5's new <audio> element works on very much\
    \ the same principle as <video>. As with <video>, the <audio> element supports\
    \ multiple source files in order to improve browser and OS compatibility.\n\n\
    # AUDIO FORMATS\n\nWhilst you may think MP3 audio files are ubiquitous, licensing\
    \ considerations mean they are not supported in all browsers on all operating\
    \ systems (it is the same situation with video, as already alluded to). Including\
    \ your audio content in both MP3 and Ogg-Vorbis formats should cover all the bases,\
    \ though.\n\n> Hot Tip\nThe Ogg-Vorbis audio format is partner to the Ogg-Theora\
    \ video format. Both are open-source software and are therefore free to use. Pop\
    \ along to http://vorbis.com for information and encoding tools.\n\n```\n<head>\n\
    \  <title>My Video Page</title>\n</head>\n<body>\n  <audio src=\"music/TheSentinel.mp3\"\
    ></audio>\n  <audio>\n    <source src=\"music/TheSentinel.mp3\" type=\"audio/mp3\"\
    >\n    <source src=\"music/TheSentinel.oga\" type=\"audio/ogg\">\n  </audio>\n\
    </body>\n```\n\nAbove: Including audio content in a page is a ddle with the <audio>\
