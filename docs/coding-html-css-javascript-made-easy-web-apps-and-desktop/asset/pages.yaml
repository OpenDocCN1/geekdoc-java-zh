  md: "# Advantages of External Style Sheets\n\nExternal style sheets really come\
    \ into their own when you are building a full website and it is normal for the\
    \ pages that comprise the site to share a common look and feel. Because external\
    \ style sheets can be linked to as many HTML pages as you like, they provide a\
    \ central point from which you can modify and adapt the visual design of your\
    \ entire site.\n\n```\n/* css (style.css) Last mod: 2014 */\n\n/* PAGE STRUCTURE\
    \ SELECTORS */\n\nbody {\n  position: relative;\n  background-color: #F5F5F5;\n\
    \  padding: 0;\n  height: 100%;\n}\n\nnav {\n  position: fixed;\n  left: 0;\n\
    \  top: 0;\n  margin: auto auto auto;\n  background-color: #999999;\n}\n\nheader\
    \ {\n  position: relative;\n  width: 1024px;\n  margin: 0 auto auto;\n  background-color:\
    \ #777777;\n  border-bottom: 2px solid #F5F5F5;\n}\n\nmain {\n  position: relative;\n\
    ```\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_30_0.png)\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_30_1.png)\n\
    \nAbove: External style sheets can be shared between multiple pages, perfect for\
    \ common elements like headers.\n\n# MULTIPLE STYLE SHEETS\n\nAn HTML document\
    \ can be linked to multiple sheets. This allows you to arrange the selectors and\
    \ style rules in logical groupings, with each group saved in a different CSS file.\
    \ You only need to link a page to the style sheets that it needs.\n\nIt's also\
    \ possible to mix embedded and external style sheets within the same document:\
    \ style rules relating purely to the document can be embedded, and site-wide style\
    \ rules can be derived from external style sheets."
