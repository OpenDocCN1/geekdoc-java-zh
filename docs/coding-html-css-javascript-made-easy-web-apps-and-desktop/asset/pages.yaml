  md: "# ADDING VIDEO\n\nVideo is a medium that is very commonplace in web pages and\
    \ websites. They are attention-grabbing and are much more engaging than a static\
    \ image. Users want to watch video, and a ten-second video clip can impart far\
    \ more information than an image and text occupying the same space.\n\n# VIDEO\
    \ OPTIONS\n\nThere are two main options for adding video to a web page. One is\
    \ to use the <video> element, while the other (and simpler) option is to embed\
    \ a YouTube (or similar) video into a page. In basic setups, the <video> element\
    \ requires the actual video file to be stored on your web server. Embedding a\
    \ YouTube video is simply a matter of copying and pasting code provided by YouTube.\n\
    \n```\n<!DOCTYPE HTML>\n<html>\n<head>\n<title>My Video Page</title>\n</head>\n\
    <body>\n  <video src=\"videos/stoneham.mp4\"></video>\n</body>\n</html>\n```\n\
    \n**Above:** Adding video to a site used to be difficult; with HTML5 it's a daddle."
  merge: -1
  pgno: 97
- img_proc: true
  md: "# ADD A VIDEO WITH HTML\n\nTo embed a video into a page, add a <video> element\
    \ to its HTML. There are two ways to specify the video file's to be played. The\
    \ simplest is to use the <video> element's src attribute, into which the video's\
    \ URL is entered. However, by the fact that different browsers support different\
    \ formats of video, it's not uncommon to provide multiple versions of the video\
    \ in different file formats. When doing this we have to embed a <source> element\
    \ within the <video> element for each file format you provide.\n\n> Hot Tip\n\
    If hosting your own videos, favour the MP4 file format. You should also consider\
    \ including a version in Ogg-Theora format to improve browser and OS compatibility\
    \ (http://theora.org).\n\n```\n<!DOCTYPE HTML>\n\n<html>\n\n  <head>\n    <title>My\
    \ Video Page</title>\n  </head>\n\n  <body>\n\n  <video>\n    <source src=\"videos/stoneham.mp4\"\
    \ type=\"video/mp4\">\n    <source src=\"videos/stoneham.ogv\" type=\"video/ogg\"\
    >\n  </video>\n\n</body>\n\n</html>\n```\n\nAbove: The <source> element allows\
    \ you to include multiple versions of a video."
  merge: -1
  pgno: 98
- img_proc: true
  md: '# ADD A YOUTUBE VIDEO


    Adding a YouTube video is much simpler than hosting your own. If it''s a video
    you''ve produced yourself then you will need a Google account to allow you to
    upload the material to YouTube. Once there, though, hooking your video into your
    page couldn''t be easier.


    **Above:** Embedding a YouTube video is simply a copy and paste job.


    Element


    All videos on YouTube have a button underneath their marked Share. Clicking this
    button reveals a panel with three tabs along the top and a field containing some
    code. Clicking the Embed tab code will generate the HTML code for an `<iframe>`,
    an element that creates a portal between your site and another. Copy the `<iframe>`
    code and paste it into your page''s HTML: simple!


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_99_0.png)'
