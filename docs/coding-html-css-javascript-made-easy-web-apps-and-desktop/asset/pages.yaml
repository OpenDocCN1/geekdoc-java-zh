  md: '# BUILDING A WEB PAGE


    We''ve covered a lot of theory and information over the preceding chapters, so
    let''s start putting it into practice. The first step is to create an HTML document
    and add the basic structure of elements that we''re going to use.


    # CREATE A WORKING FOLDER


    The first thing to do is create a folder in which to store all of the files for
    our page. Your Documents folder would be a good place for this, or better still,
    create a folder called MySites inside your Home folder; this can be a central
    location for all of the sites you develop. Wherever you put it, the folder you
    create for an individual site should have the same name as the site. Let''s call
    this one MySite.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_75_0.png)


    > Hot Tip

    Don''t use spaces in folder names. Either remove the spaces and capitalize each
    word (known as CamelCase), or replace the spaces with underscores or hyphens.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_75_1.png)


    Above: All files for a site should be stored in a single outer folder. It''s also
    handy to place all of your sites into a single outer folder.'
  merge: -1
