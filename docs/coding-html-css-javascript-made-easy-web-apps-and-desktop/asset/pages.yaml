  md: '# Assignment Operator


    We''ve already met this operator, whose left operand is always a variable or property
    reference, and whose right operand can be any literal, identifier or expression.


    | Operator | Name | Action | Example (result in brackets) |

    | --- | --- | --- | --- |

    | = | assignment | Assigns the value of the right operand to the variable or property
    indicated by the left operand | myVar = 42 (myVar now has a value of 42) |


    # Equality Operators


    These operators compare two operands and return either true or false (see Booleans,
    page 33). The operands can be of any data type.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_179_0.png)


    | Operator | Name | Action | Example (result in brackets) |

    | --- | --- | --- | --- |

    | == | equality | Returns true if the two operands are equal, otherwise false
    | 4 == 2 (false) |

    | != | inequality | Returns true if the two operands are not equal, otherwise
    false | 4 != 2 (true) |'
