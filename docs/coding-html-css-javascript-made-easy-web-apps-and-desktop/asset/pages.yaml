  md: '# GOING BEYOND THE BASICS


    HTML5 and CSS3 represent significant advances in their respective languages. Here
    we introduce some of the more advanced features of both languages. A full discussion
    is beyond the scope of this book, you should be aware of these features.


    # HTML5 FORMS


    A simple example of the power of HTML5 lies in HTML forms. Before HTML5, creating
    forms for the web typically involved the use of coding with JavaScript. For instance,
    if you wished to verify that the user had entered suitable data into a form the
    only way to do so was via scripting. HTML5 forms, however, have built-in validation
    features, saving the developer heaps of time and complexity.


    Below: HTML5 forms greatly simplify validation of user entries


    # Email Sign-up Form Demo


    ve created a demo of an email sign-up form you can check out at http://richardshepherd.com/forms


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_101_0.png)'
  merge: -1
  pgno: 101
- img_proc: true
  md: '# HTML5 DRAG-AND-DROP


    Drag-and-drop is fundamental to computer use, and is a very intuitive way for
    a user to interact with on-screen objects. In HTML5, adding the draggable attribute
    to any visual element and setting the attribute''s value to "true" makes that
    element draggable: <img id="#homepageImage" draggable="true" />. Handling such
    interactions remains the job of a scripting language like JavaScript.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_102_0.png)


    Above: The user will be asked whether or not they wish to share their geolocation
    data with your site.


    # HTML5 GEOLOCATION


    The HTML5 geolocation feature is used to determine a person''s location through
    their desktop or mobile device. A popular use of geolocation is on mobile devices
    where it integrates with maps. It is used for a host of services that need your
    location, for example, for getting directions from A to B.'
  merge: -1
  pgno: 102
