  md: '# CONDITIONAL STATEMENTS


    We often need to execute different statements based upon conditions that do not
    exist until a page has been loaded into a browser, and a user is interacting with
    it. This is when we reach for conditional statements.


    # IF STATEMENTS


    With i f, we test for the existence of a condition and then execute expressions
    that should condition exist. Its basic form looks like this:


    ```

    if(condition) expressions;

    ```


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_187_0.png)


    Above: Flowchart of a simple if statement


    # USING IF STATEMENTS


    When the interpreter encounters an if statement, it evaluates the expression contained
    inside the parentheses. In the event that the expression evaluates to true, the
    statement following the if is executed.'
