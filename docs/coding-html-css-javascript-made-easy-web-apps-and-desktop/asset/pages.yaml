  md: '# Create a Basic Structure


    +   1. Create a new page in your editor of choice and add the DOCTYPE declaration
    at the very top of the page.


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    </head>

    <body>

    </body>

    </html>

    ```


    +   2. Add the base elements <html>, <head> and <body>, and save the page as ''index.html''
    inside yourFirst folder.


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    <title>My First Web Page</title>

    </head>

    <body>

    </body>

    </html>

    ```


    Step 2: Start with the essential elements.


    +   3. Now add a <title> element as a child of (i.e. within) the <head> element.
    Make the title relevant as this will show up in search-engine listings.


    Step 3: Choose a title for your page wisely; it can make the difference between
    the page getting visitors or not.


    +   4. Now we''ll create the basic layout structure for the visible content of
    the page. Add <header>, <section> and <footer> elements as children of the <body>
    element.


    ```

    <!DOCTYPE HTML>

    <html>

    <head>

    <title>My First Web Page</title>

    </head>

    <header>

    </header>

    <section>

    </section>

    <footer>

    </footer>

    <body>

    </html>

    ```


    > Hot Tip

    The default page of any website – the one that is loaded if no specific page is
    requested – is often called index.html. There are other names that work, but this
    one is best.


    Step 4: Add the elements that make up the basic page structure.'
