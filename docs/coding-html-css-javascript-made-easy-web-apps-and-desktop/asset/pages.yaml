  md: '# WHY ISN''T MY CODE WORKING ON MY DESKTOP?


    You might have all your HTML and CSS in place and working well, but when you add
    some new code and test on your desktop find that nothing happens. The first step
    is to check that any code

    or scripts are pointing to the right location. If all is fine in that department,
    upload the page to

    your web server and test it from there -- some code only works when it is running
    from a server.


    # IMAGES ARE LOADING VERY SLOWLY


    It is not uncommon for users to place images with large file sizes onto a web
    page and

    then resize them with CSS. Multiply this by ten images and everything slows to
