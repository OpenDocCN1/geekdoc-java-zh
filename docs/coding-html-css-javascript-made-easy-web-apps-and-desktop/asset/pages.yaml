  md: '# STYLING A PAGE WITH CSS


    The HTML for our page is now in place but it looks fairly basic as things stand.
    Let''s deal with that now by adding some CSS styling to the page.


    # EMBEDDED OR EXTERNAL?


    The first choice is whether to add the CSS as an embedded or external style sheet.
    Given that our site only has a single page (for now at least) we''ll use an embedded
    sheet so that all of the code for the page is in one location.


    # Creating the CSS Code


    +   1. Open index.html in your editor if it isn''t already open, and then add
    a `<style>` element inside the `<head>.",


    ```

    <!DOCTYPE html>

    <html>

    <head>

    <title>My First Web Page</title>

    <style>

    </style>

    </head>

    <body>

    ```


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_80_0.png)


    Step 1: Add an embedded style sheet in the <head> of the page.'
