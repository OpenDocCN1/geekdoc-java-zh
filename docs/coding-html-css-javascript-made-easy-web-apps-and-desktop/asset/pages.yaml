  md: '# Article Element


    The <article> element is intended as the final element in a structural chain in
    that it typically resides within another structural element such as <section>.
    The idea of <article> is that its content relates to a single subject, like an
    article in a newspaper.


    # Aside Element


    The idea behind an <aside> element is for it to display content that''s related
    to content within another structural element, but does not a direct part of that
    content. Semantically, any structural element can have a related <aside> element,
    but the typical usage is a sidebar for showing things such as adverts, profile
    information, or links to other areas of the site.


