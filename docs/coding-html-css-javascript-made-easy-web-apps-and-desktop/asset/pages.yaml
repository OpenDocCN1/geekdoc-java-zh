  md: '# ASCII and

    Extended Characters


    # Hot Tip


    The core set of character symbols used in computing is referred to as ASCII (American
    Standard Code for Information Interchange, pronounced ''ask-ee''). This is a standard
    that defines the character used to represent the most common alphabetic, numeric
    and punctuation characters. There are 128 character codes, and all computers follow
    the ASCII standard for these characters.

    Characters that fall outside the ASCII standard, such as accented letters, are
    known as extended characters and should be typed directly into HTML text.


    Internally, computers represent everything with numbers, and this includes text.
    The number that represents a given alpha-numeric, punctuation or symbol character
    is called a character code.


    | ASCII control characters | ASCII printable characters |

    |---|---|

    | 00 NULL (Null character) | 32 space 64 @ 96 |

