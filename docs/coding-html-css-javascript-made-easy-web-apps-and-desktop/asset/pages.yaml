  md: '# # AN INTRODUCTION TO CSS


    If HTML is the bricks and mortar of a house, then CSS provides the decoration.
    The language is simple but packs a big punch, and without it your web pages would
    look awful.


    # ## WHAT IS CSS?


    We''ve already looked at adding a style rule to an element''s style attribute.
    This is called **Inline** styling - it works, but has an inherent problem: if
    you want to change, the font of all of your text headings then you have to edit
    the font-family style property in every occurrence of a heading element. This
    is where **CSS** comes into picture.


    ![](img/36c6072bc9bbf8851fd6b2169dfe432d_19_0.png)'
  merge: -1
  pgno: 19
- img_proc: true
  md: "CSS stands for Cascading Style Sheets. It provides the means of separating\
    \ page content from page appearance, and of applying a style rule to more than\
    \ one element at a time. A key benefit of this is that any changes made to a CSS\
    \ style rule will affect all elements that are associated with that\n\n```\nheader\
    \ {\n  position:relative;\n  width:1024px;\n  height:130px;\n  margin:0px auto\
    \ auto;\n  padding:0px;\n  background-color:#778081;\n  border:none;\n  border-bottom:2px\
    \ solid #FDSF12;\n}\nav {\n  position:relative;\n  width:788px;\n  height:30px;\n\
    \  margin:0px auto auto;\n  padding:0px 118px auto 118px;\n  background-color:#D9D0D9;\n\
    \  border:none;\n  border-bottom:1px solid #FDSF12;\n}\n```\n\n![](img/36c6072bc9bbf8851fd6b2169dfe432d_20_0.png)\n\
    \n# WHAT DOES CSS LOOK LIKE?\n\nLike HTML, CSS is plain text written with a specific\
    \ structure. CSS code is comprised of selectors that identify the HTML element(s)\
    \ that the subsequent style rule will be applied to. The style rule itself is\
    \ wrapped in curly brackets, '(' and ')'.\n\n> **Above:** CSS code employs selectors\
    \ and style rules. How indenting the code assists with legibility.\n\n# Selection\
    \ of Selectors\n\nSelectors can take a number of different forms, but in this\
    \ book we will only focus on three of them: Type, ID and Class selectors. The\
    \ simplest of these is the Type selector (we'll return to the others later). It\
    \ consists of nothing more than the name of the HTML element that will receive\
    \ the selector's style rule. For example, a p selector will target all instances\
    \ of <p> elements."
  merge: -1
  pgno: 20
