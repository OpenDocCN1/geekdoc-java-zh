  md: '# NEW FEATURES OF HTML5


    HTML5 is still HTML, but it is simply the latest version of the language. It contains
    many of the elements found in previous versions but also features a number of
    new elements and rules. In general, when somebody uses HTML5, they are referring
    to these new features.


    # SEMANTIC ELEMENTS


    One of the aims of HTML5 is to introduce clear and consistent semantics into the
    language, such that the element names convey information about the purpose of
    an element and where it sits in the logical structure of a document.


    > Hot Tip Semantic elements are particularly helpful to the screenreader applications
    that assist with web browsing for people with visual impairment.


    | HTML5 FEATURES SEMANTICS | Semantics is one of the most distinctive features
    of the Web Platform versus other platforms. Developers usually ignore or de-prioritize
    such feature but the mastery of it can bring many benefits to our projects. |

    | The text and text have a meaning. Ultimately the content that our browsers read
    is pure text. Web sites and applications have been created in an ecosystem where
    text content is linkable, searchable and mashable. In the open web we want content
    to be shown, fed and remied by third parties, search engines and accessibility
    tools. All these benefits don''t come for free. Automated tools can only do half
    of the job at recognizing the nature of content. The better the developer does
    at marking the right semantics of the content the easier be for the rest of the
    agents to deal with. HTML5 provides a series of tools to make life easier too:

    * New media elements.

    * New structural elements.

    * New semantics for internationalization.

    * New link relation types.

    * New attributes.

    * New form types.

    * New microdata syntax for additional semantics.


    **Above:** HTML5 places a lot of importance on semantics.'
  merge: -1
  pgno: 32
