    | 9 | |

    | 10 | <header style="font-size:18px; color:blue;"> |

    | 11 | <h1 style="font-weight:bold;">HTML and CSS Basics</h1> |

    | 12 | <h2 style="font-size:14px;">Learn the language of the Internet</h2> |

    | 13 | |

    | 14 | </header> |

    | 15 | |

    | 16 | |

    | 17 | <video width="640" width="360" src="vids/introvid.mp4"></video> |

    | 18 | |


    Above: The style attribute allows you to add inline styling to an element.'
