    当我走近时，双脚滑过一层薄薄的冰，我手忙脚乱地摔倒在背上。我凝望着着灰色的天空，雨水洒在脸上。太阳明明在升起，温度为什么在下降？


    当他俯身看向我时，一个哥布林的脑袋取代了天空，他的 `club` 垂在地上。“要是你自己死掉可就不好玩了。”


    我蜷缩起身体坐起来。“噢。”


    他跳开旁边问道：“没死吧？”


    “死不了的！我们这儿没有人真的会死，对吧？”


    小家伙无视了我的问题，举了举他的 `club`。


    我站了起来，很确定身体没有哪里坏掉。“他说除非……没人会死。你是 `Lubber Fiend` 吗？”


    他的皮肤从深红色变成了粉红色，他转了三个圈，水从他的衣服和湿透的发头发上溅出来。“Fiend` 要来了？”


    我倒吸了一气。如果这不是那个 `Fiend`，而且如果 `Everglades`说他们是按力量大小倒序来的没错，那么这个生物就比高出一个等级。他完全没有机会。


    他穿着自制的纺织衣服，深红色的头发油腻腻地结成块垂在他周围。无论他是从哪个洞里爬出来的，那都不是 `Everglades` 附近什么著名的公园。这家伙已经很久没接触文明社会了。我必须找到
    `Lubber Fiend`，别再骚扰这些可怜又无力的 `gobins` 了。


    “他正在路上了，”我说，希望他听到后会逃。


    一瞬间，他看起来像是要逃。相反，他紧了了握 `club`，稳住双脚，清晰地咽了一下口水。他用颤抖的声音再次说道：“我是 Mert，我挑战你。”


    他挥起了 `club`。


    我跳开躲避，召唤魔法，向他投掷了一块 `cement`。他的 `club` 在手中松了了，因为 `cement` 碎掉落并砸在他身上。“你没有达成交易！”


    “不需要交易。”我满意地捏了响指关节。


    “不需要交易？”


    “我只对自己交易。”


    “好……好，我们看看谁最强！”他的声音随着每一个字变得越来越高。


    “最什么？”我小心翼翼向前迈了一步，寻找没有冰的 `cement` 区域。


    “最强的哥布林！”


    他再次挥起 `club`，我又躲开了。


    “是啊，但我们根据什么标准来评判？谁是最强战士？”当他进攻时，我向后跳去，忘记了冰面，再次摔成一堆。“噢。战斗有什么意义？”


    当他思考这个问题时，浓密的眉毛锁在一起。“最强！”


    `Juya’s` 的门开了，`Osman` 探出头来。


    “待在！”我再次站起来喊道。


    Mert 挥起 `club`，击中了我的锁骨。


    “噢！住手！”我面对他，再次击开了他的 `club`。“我们可以直接跳到最后吗？你打不中我的。我是人类。”


    “你竟敢声称自己是——”


    “半血。我父亲是 `Peallaidh`，我是他的继承者。”我长舒了一口气，压制着怒火。“我受够了！为什么你们没有一个人只是顺路过来打个招呼？”


    愤怒在我的胸中升腾。我不想一直被攻击并摔在冰面上。我拨开挡住眼睛的湿头发。“放弃吧！”


    他再次向我冲来，将 `club` 砸进我脚下的 `concrete` 中。地面裂开了。


    我脚下的岩石一直是极好的盟友，但它们却为他让路，我发现自己陷进了冰凉的泥沼中。“这是我朋友的门阶，”我说，“别再破坏东西了！”


    我试图离开庭院，引开他远离 `Juya’s townhouse`，但他发现了我的弱点。他笑着，用 `club` 猛砸门。


    “住手！”


    门碎了并从合页上飞了。他冲了进去，里面有人尖叫起来。我追了过去，一种不祥的预感与我的愤怒交织在一起，胃里翻江倒海。


    Mert 向 `Teresa` 逼近，她手里只有一个 `rolling pin` 用于防御。


    他向她扑去。我向他扑去。


    我没中。但他击中了。


    `club` 随着一声邪恶的脆响击中了她的手臂。`rolling pin` 掉落在地上，Mert 在楼梯底部压在了在她身上。


    Mert 咆哮着，`Teresa` 呜咽着。


    红色的雾遮蔽了我的视野，身体里积聚的所有愤怒都注入了拳头。我跃向空中，落在那个 `goblin` 的背上。


    他掐着 `Teresa`，我拽着他那结块、肮脏的头发。用力地。


    “你敢！”我尖叫道。我直起身，反手击中了他的太阳穴。这让他足够眩晕，让我将他移开了 `Teresa`，后者看起来更加震惊。


    “离开这里！”我大叫着，抓住 Mert 的脖子把他拉开。


    `Osman` 跳下楼梯，嘴里嘟囔着 `duende`一边把她拉了起来。


    我转过 Mert，以便再次击他。他的鼻子裂了，喷出近乎黑色的血。我在第一拳后又补了几拳，沉浸在拳头撞击他脸骨的感觉中。


    他停止反抗时，我并没有察觉。我不在乎。


    即使大脑告诉我 `Teresa` 是安全的，我依然一直打，直到 `Osman` 跳下来并试图抓住我的拳头。当我再次举起手要打他时，他的尖叫声终于透进了我的耳朵。


    '
- fmt: '

    Something thumped. “I’m sitting on the couch, so no.”


    I sighed. “I’m at Juya’s.”


    “How am I supposed to believe that, either? Never mind. We have an interview this
    morning with the restaurant manager and some other witnesses.”


    I waited for a second to see if she would correct herself. When she didn’t, I
    repeated, “*we*?”


    “Yeah, we. Isn’t this what you bargained for?”


    “But I thought you didn’t need my help.” I grabbed the pickup to haul myself upright
    and the tree for leverage to get to the sidewalk.


    “I need to know if anyone is lying.”


    This was one thing I could bargain for: the truth.


    “Oh, so now I’m helpful,” I huffed, just a little.


    “Orange, I’m sorry about yesterday.” She trailed off, and I said nothing. “It
    was a rough night. Let’s just move forward, okay?” Only Scharf says things like
    “move forward,” in real life.


    “I’m sorry too,” I said after a few seconds, “about the dumpster and everything.”


    A branch cracked above my head, and I ducked out from under it and landed on my
    butt again.


    “You were trying to help. I know that.”


    I sighed. “Where should I meet you?” Assuming I could get anywhere. “I’ll pick
    you up.”


    “No!” I did not want to wait around Juya’s for Scharf to make her way. “No, it’s
    too far. Pick me up at the Metro.” My orange line materialized at south. I glanced
    towards her once before I followed it, salving with the fact that I had to bargain
    with Scharf, and couldn’t have been better hands. The branch crashed where I had
    been moments before in cacophony of ice, and water.


    ### Investigation


    I sat in the front seat of Scharf’s Buick and turtled down my leather jacket,
    debating whether to break the silence. She had brought it with her and handed
    it to me when she pulled alongside the metro entrance. It belonged to her, but
    I’d inherited it from California with nowhere to deal. It seemed like weeks since
    I’d been truly warm. She maneuvered out from the gate and down the street of restaurants.
    The rain had calmed a little, though her wipers were still high. Through the water,
    the streets looked even worse in the light of day. Sports, bottles, lanterns,
    and trash littered the pavement. Boards were nailed to shop windows above piles
    of glass. It would be a while before the riot.


    “So Jack,” she said as she pulled up in front of `Pasta Joe’s`.


    “Oh, hell no, we are not having that conversation now,” I replied. I clenched
    my fists without realizing it. I loosened my fingers, sudden anger.


    “Please, no,” I mumbled.


    “Are you going to punch everybody who annoys you?”


    “Are you okay?”


    “Absolutely!” I said with manic cheer and pawed at the door.


