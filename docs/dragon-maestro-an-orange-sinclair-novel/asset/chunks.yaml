    “He never fought anyone while he lived with me.” We’d spent a blissful twelve
    years, he, my mother, and I in northern California, eating lemons off a tree in
    the front yard and playing with dolls that moved by themselves. I only figured
    out months ago that it was my father’s earth powers that allowed us to have lemons
    all year long and animated dolls.


    Mrs. Henderson stared into the middle distance. “Even she wasn’t enough to keep
    him away from his world in the end.”


    “She who? My mom? My mom tried to keep him out of this world?” An old grief stirred
    up in my gut. I didn’t know if it was sorrow at losing him and her, even though
    she was currently still alive, or anger at the fact that he’d left me a long time
    ago. Neither were very safe emotions in this weird ice storm. *Keep it together*,
    I told myself.


    “Listen, we’ve got a bigger problem than that,” I said, aware that `Scharf` could
    not yell at her boss forever.


    “No one’s bigger than the Lubber Fiend.”


    “You don’t understand. I need the autopsies of the two victims.”


    “Why?”


    I considered trying to explain our theory about the blood alcohol levels but went
    with something I knew she’d care more about. “The second victim is a goblin.”


    She jumped up. “No one’s supposed to die until the final fight. What did you do?”


    “I didn’t kill him! He jumped out a window and survived. He seemed thrilled about
    it. But now he’s legitimately dead. Found behind a dumpster in Chinatown. This
    is about more than my fight for the throne or whatever I’m fighting for.”


    Mrs. Henderson shook her head. “There is no throne, Orange.”


    “Thank God for that. So listen, I need the case files from the Chinatown murders.”


    “Oh, no.” She crossed her arms. “I’m not doing any more favors for you.”


    “We need them. `Scharf` is here for them.” And judging from a now more ominous
    silence from the office, I didn’t know if she’d been in a position to get them.


    She wagged a finger at me. “I can’t give you those files.”


    Now it was my turn to be confused. “Of course you can. Hand them over. *Please*.
    We’re running out of time. This is way bigger than one grumpy fire fiend.”


    Her little green face grew stern. “I may be a goblin, but I’m still a federal
    employee. And I have a security clearance to maintain.”


    “You told me you got this job to help your fellow creatures. Well, your fellow
    creature needs your help.”


    She snarled at me, baring her razor-sharp teeth once again. “You always get me
    with that one. You always get me.”


    “What can I throw in to sweeten the deal? The last time I saw you, you were talking
    about how you wanted a boyfriend.” A random meet-cute with one of the many goblins
    after me seemed like a perfect task for my hob powers.


    “Don’t you even dare!” She reached up a hand, claws extended like she wanted to
    go for my throat. I backed up fast.


    Her face turned a mottled green. I’d hit a nerve, but even so, she was boiling
    hotter than I’d ever seen her. She always took delight in poking at me, but never
    literally with her claws.


    “Listen to yourself!” I shouted. “It’s affecting you, too. It has something to
    do with the storm. I beat a challenger to a bloody pulp. And I don’t do that sort
    of thing. You want to rip my throat out, and as much as I annoy you, you don’t
    do that sort of thing either. `Scharf` is in there yelling. Something’s messing
    with all of us.”


    Her face regained its usual color, and she quietly sat down. “What can do such
    a thing? What can spur anger? What can ruin weather?”


    “I don’t know. That’s why I need the files.”


    She sat down and started to dig in an overstuffed filing cabinet next to her desk.
    “Two alley murders. These aren’t the official case files, only the copies I made
    as the reports came in. I assume the latest is your goblin,”


    She fished out a thick pile of papers and handed them over. My head spun with
    relief; she was helping me.


    “The autopsy reports are in there?”


    She nodded. “Don’t screw up, Orange.”


    `Scharf` burst out of her boss’s office, and I was immeasurably relieved to see
    her gun and badge on her hip. The last time she’d been in there, she’d been stripped
    of both. Then I saw `Carlisle` seated at a table in the office she’d burst out
    of. She headed for the door without looking at me.


    “That’s not good,” Mrs. Henderson said.


    “Thanks!” I said, dashed to the printer, and grabbed whatever `Scharf` had printed
    off. I tucked the files under my jacket and ran after `Scharf`.


    She stood by the elevator, stabbing the down button over and over again.


    “What happened?”


    “I’ve been reprimanded for unprofessional conduct. `OPR` is investigating.”


    I’d heard the acronym before but forgot what it meant. My confusion must have
    shown on my face because `Scharf` said, “Office of Professional Responsibility.”


    “But you haven’t done anything! We haven’t even crashed the car.”


    “I used inappropriate language interrogating a suspect.”


    It took me a second to parse the official speak. “But `Fuller` did that. Not you.”


    “The best defense is offense?” she said as we finally made it to the elevator.


    # 15


    I pulled the stack of files and computer paper out of my jacket and handed them
    to `Scharf`. “Don’t ask me how I got them.”


    `Scharf` raised an eyebrow and pointed to Mrs. Henderson’s signature under “Received.”

