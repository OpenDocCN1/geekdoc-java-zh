    want a fork. He says you eat them with your hands like a real man. It was in my
    pocket.” She was literally wringing her hands. I’d thought it was just an expression.


    “Did you strangle him, too?” Scharf asked. “Or was that done when you got there?”


    “I had to make it look like the other murders! But I promise you, I did not kill
    him.”


    “The body was unmarked when you got to it?” Scharf said very carefully.


    Melissa nodded but did not make eye contact.


    Scharf said, leaning forward. “You took Rodger’s bracelet?”


