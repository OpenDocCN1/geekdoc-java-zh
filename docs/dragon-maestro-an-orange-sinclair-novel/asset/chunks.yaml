- fmt: '

    Scharf looked at the dumpster, then at Fuller. Her eyebrows pulled together. “The
    truck’s going to be here any minute. We’ll make sure all of this gets to the lab.
    It’s taken care of, Rick.”


    Fuller shook his head. “Nothing is taken care of that you don’t take care of yourself.”


    Lee chewed on his upper lip and crossed his arms. “You want her to perform the
    autopsy too?”


    “Agent Fuller is right,” Scharf said. “Don’t pass the buck.” She looked at the
    dumpster and swallowled. Was she really going to climb in there?


    As she rolled up her sleeves, I stepped forward. The water needed to be drained
    out of the dumpster. I closed my eyes and `tugged` at the side of it. It was metal
    and no match for my magic.


    Something weird happened, though, as I reached out in my mind’s eye to break it
    open and let the water out; I `felt` the water. But that was impossible—the element
    I could control was earth. I shook off the momentary awareness and pulled on the
    side of the dumpster. A wave of trash and water spilled all over the alley. Then
    it flooded into the back of the restaurant where the body lay.


    Oops.


    A dozen investigators squawked like chickens as they hopped around, trying to
    preserve the scene. Melissa, wearing heels, squealed and leaped. I was impressed;
    she made it a good four feet even in her impractical outfit.


    The profiler didn’t panic. He stepped onto a milk crate and tsked at everyone
    and everything. “This is why you don’t wait. Now we’ve lost vital evidence.”


    I froze. Lost vital evidence?


    Scharf had been closest to the dumpster and was completely soaked in water and
    trash. She wiped at the grey muck on her pants; I could smell the rot from ten
    feet away. “I don’t know what happened,” she said. “I was certain the dumpster
    was sound. I checked it myself.”


    I backed up.


    “I’ll be right back,” she said and strode after me.


    I sped up, heading for the crime scene tape and an officer in a transparent raincoat
    standing at the mouth of the alley. But she reached me before I could get out.


    “What did you do?” she asked.


    “Nothing!”


    She put her hands on her soaked hips. “Did you rip off the side of the dumpster?”


    I really wanted to lie to her. So I did. “No.”


    “Orange Sinclair!”


    “Okay, fine.”


    She let out a deep sigh. “You destroyed the crime scene. God knows what we lost.
    The killer always leaves his gloves in a trash bag behind the restaurant. He wants
    to make the investigators dig through the trash.”


    I spread my hands. “I was just trying to help.”


    “If I want your help, I will ask,” she snapped, with more emotion than she’d shown
    before. “The next time we get fairy dust or a little creature running through
    a crime scene, you’ll be the first person I call. But right now, go home, bake
    some scones, and stay out of my job. You almost got me fired once already.”


    “That was not me,” I pointed out to her. A djinni almost got her fired when she
    was put on administrative leave after getting too close to him.


    Her face changed colors, and two red stripes appeared on her cheeks from her clenched
    teeth.


    I retreated, and an orange line appeared behind me. My magic wanted to skedaddle.
    “Okay, I’m going,”


    “Please don’t do magic at crime scenes.”


    “Don’t worry!”


    As I stomped off, Lee said, “Everything okay, Scharf?”


    “Yeah fine, why?”


    “You were talking to yourself pretty loudly over here.”


    “Worse, I was talking to my invisible friend who won’t do what I say and go home.”
    She tossed that last remark over her shoulder at me.


    I stuck out my tongue.


    Lee frowned. “Has anyone ever disappeared from your custody? Literally disappeared?”


    I hunched. I’d done that to him accidentally the first time I’d discovered my
    powers of invisibility. Ever since I’d tried to appear or disappear out of sight
    of those not in the know.


    Scharf glanced at me. “Never.”


    Lee shook it off and brushed the rain off his shoulders. “Let’s try to get all
    the trash picked up, okay? Something tells me this hotshot and his biographer
    won’t stoop to that.”


    “Ah, the glamour, the danger, the rewards of law enforcement.”


    I thought to offer to pick it all up myself but didn’t think Scharf would appreciate
    that. I walked away, following my orange line to the Metro. I’d screwed up the
    crime scene and gotten Scharf in trouble, so my work there was done. Normally,
    we had a great working relationship. I’d joke; she’d solve crimes and pretend
    not to be amused.


    She hadn’t been pretending tonight.


    # 5


    As I sat on a yellow line Metro train winding its way south towards Virginia,
    I told myself the moisture streaming down my face was only rain. And my hands
    were shaking because of the cold.


    I enjoyed pushing Scharf’s buttons. She was so starchy and correct that almost
    anything did it, but this time she had gotten so angry, so dismissive. I was used
    to that from teachers and boyfriends, but not from her. She’d been one of the
    first people to take me seriously. I’d underestimated how much I liked that.


    And she was totally wrong. I wasn’t sleeping on her couch for free; I was sleeping
    on her couch in exchange for helping her. Making myself agreeable and having a
    place to sleep were intimately connected, so her anger felt much bigger than the.
    I thought back over the hockey game and how the crowd turned. `What` had provoked
    them?


    I would go home. Then we would patch this up in the morning, and she could investigate
    this thing.


    This late, the only people in the car with me were a businessman who’d worked
    too late and a homeless dude sleeping across seat. As we hurtled south, thoughts
    of the Restaurant Killer kept intruding. For my folklore major, I’d learned about
    lot of monsters, and I’d recently hung out with a few as well. But I still couldn’t
    imagine who could do that to another human.


    “Leave it alone,” I told the poster across my seat advertising some kind of polar
    defense system. The yellow line passed the Pentagon on its way south, and sometimes
    the advertising got a little patriotic. Or paranoid. Five minutes later, as soon
    as we’d pulled above ground to cross the Potomac into Virginia, I pulled out my
    phone and searched for the Restaurant Killer. The first result was a book, *Monster
    in the Kitchen,* by Melissa Fuller, the redhead with the notebook who’d wormed
    her way onto the crime scene. The cover of the book had a picture of an alley
    with a chalk outline. I shuddered and downloaded it. She’d written it just after
    the trial.


    I quailed just reading the table of contents. There were six chapters dedicated
    to the autopsies, and another four to the trial. I flipped to chapter one. She
    summarized Richard Fuller’s years in the FBI, first in violent crimes like Scharf,
    then in the Behavioral Analysis Unit out of Quantico. He worked on high-profile
    murders around the country, consulting with police before the Restaurant Killer
    case had skyrocketed him to fame when people had started getting strangled in
    the backs of restaurants, arranged artfully where they had fallen with a fork
    in their eye.


    I gulped. Melissa used the word “artfully.”


    A rumble of thunder drew my eyes to the horizon and the storm clouds gathering
    in the ever-present orange glow of the city. It had been raining steadily for
    hours, but this was something else. The clouds looked alive, like someone had
    pressed “fast-forward” on the storm, and it was hurtling right toward us. I brushed
    against the pole at the back of my seat as I leaned towards the window and jumped
    as static electricity fizzed beneath my fingertips.

