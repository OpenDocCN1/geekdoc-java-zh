    She crossed her arms and said, “You forgot to tell me who the murderer is?”


    “Happy thoughts!” I said, pointing through the window. “Remember where we’re standing!”


    “Orange.”


    “Unicorns and rainbows!”


    “Orange!”


    “The Lubber Fiend killed the goblin.”


    “The Rubber Fiend, who is coming after you? How do you know?”


    “It’s actually Lubber… Never mind. He told me.”


    “Orange! Dear God, what are we going to do?” She paced, got doused by a sluice
    of water from the awning, and jumped back next to me. “What are you going to do?”


    “Oh no, this isn’t the judge, jury, executioner thing, is it? I can’t execute
    him!” I meant that in the moral and literal sense of the word. I still had no
    idea how I was going to win our inevitable fight, let alone punish him for his
    crimes afterward.


    Scharf looked up into the rain. “Just the goblin? What about Rodger?”


    I shook my head, but then stopped. “It didn’t come up.”


    “It. Didn’t. Come. Up?” she asked with two red lines striping her cheeks where
    she was clenching her teeth.


    “Happy thoughts!”


    “Hey, Scharf!” a voice shouted.


    We both pivoted to see Carlisle hugging the building to stay out of the rain as
    he approached us from down the block.


    “What are you doing here?” we both asked.


    He looked between the two of us. “I could ask you the same question.”


    “Are you cleared to be here?” Scharf asked, and I remembered that the last time
    we’d seen him, he was getting hauled away on a stretcher after the Lubber Fiend
    had almost squished him.


    “Agents are tough.”


    “Carlisle,” Scharf said.


    “Minor concussion.” He rolled his eyes. “It’s fine. We had a tip. Actually, Melissa
    had a tip.”


    Scharf raised an eyebrow.


    “She listened to a podcast. There’s a waitress who had a beef with Rodger. They
    broke up. The podcaster interviewed her. Now *we* get to interview her.”


    I shook my head. “I knew I should have bargained with the waitress.”


    Scharf laid a heavy hand on my shoulder, and I shut up.


    “Um, okay,” Carlisle said. “Fuller and Melissa are searching her home right now.”


    “*Melissa* is searching someone’s home?” Scharf asked.


    Carlisle crossed his arms defensively. “She’s observing. We’d already searched
    the restaurant, but I’m going to try to speak with her now.”


    I smirked. “Trying to cut out the foremost profiler in the world?”


    He ducked into the pasta shop without a by-your-leave.


    “Is he supposed to do that alone?”


    Scharf shook her head. “The case agent in charge has a great deal of discretion.”


    “Who’s the case agent in charge?”


    Scharf sighed. “That’s a good question and a problem we’ve had from the start.
    A journalist is searching a suspect’s house.”


    “What are *we* going to do?”


    Scharf looked at her phone. “Cheer up the dragon and leave them to it, I suppose.”
    She sounded like she was going in for a root canal while they went on the best
    vacation in the world.


    I sighed. “Okay, deal, we throw a parade and I help you bag Rodger’s murderer.”


    She raised an eyebrow. “I already have a magical bargain to make you help with
    the murder.”


    “I mean specifically help with getting the waitress before Carlisle. It can’t
    hurt.”


    Her raised eyebrow told me what she thought of that statement.


    “How much worse could this get?” I insisted. “Don’t answer that.”


    “Okay fine.”


    A chime sounded, and I rubbed my hands together, reveling in the rush of magic.
    I tried to rely on my bargain with myself for magic, but sometimes it was just
    easier to do it the old-fashioned way, though I had far less control when I bargained
    with somebody else.


    When nothing happened, I rubbed my hands together again.


    Scharf shook her head. “I don’t know how you stand this—just waiting for absolute
    chaos to break your way.”


    I was about to protest when the door to the pasta shop opened and a familiar,
    skinny kid ducked into the rain. I''d last seen him shouting about podcasts.


    “Hey!” I shouted. “Hey, I’m ready for that interview.”


    He turned towards me and crossed his arms. “I heard you in there. You’re a rival!”


    I poked at Scharf. She didn''t react. I poked her again.


    “What?”


    “Show him your badge thingy.”


    She obligingly flashed her shield as she whispered. “Who is that?”


    “He’s a podcaster,” I said. “Didn’t you hear Carlisle? He got the waitress from
    a podcast!”


    “Can law enforcement pose as a podcaster?” the kid asked, fascinated. “I could
    build a whole episode around this. Now they''re trying to be us!”


    “I’m not law enforcement,” I said. “But I will make a deal with you. Give us everything
    you have on the waitress, and I''ll give you the scoop of a lifetime.”


    He shook his head. “I already have the scoop of a lifetime.”


    “Okay,” Scharf said. “I won''t arrest you.”


    “For what?”


    “I''m not sure yet.”


    “That''s illegal!”


    “Probably for helping a murderer.” Scharf whispered so quietly I could barely
    hear her. (Wait, I apologize the provided text had some repetitive/garbled sentences
    at the end, I will clean the core narrative based on your instructions).


    *Note: The provided source text contained several repetitive and nonsensical sentences
    in the final paragraphs (e.g., "Happy thoughts!" repeated in different contexts).
    I have prioritized the logical narrative flow of the dialogue and actions.*

