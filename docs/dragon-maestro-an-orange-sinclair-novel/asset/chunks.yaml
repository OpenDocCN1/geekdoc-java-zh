    # 21


    The next morning, I sat on a blue metal *Washington Post* dispenser under the
    Chinatown arch on the corner of Seventh and H streets and put my head in my hands.
    I felt entirely alone in the sleet. The weather looked miserable in the dim, gray
    light of dawn through the clouds.


    The buildings surrounding the intersection were festooned with screens shining
    advertisements into the mists of the continuing storm. It wasn’t quite Times Square.
    Without skyscrapers, nowhere in DC could match that energy, but it was colorful.
    The crosswalks were painted with dragons. I hoped they weren’t the only dragons
    on the street today.


    Ragged red lanterns were still strung from the arch to nearby buildings overhead,
    leftovers from the disastrous celebration nobody had taken down. Other than those
    and one boarded-up window of a shop across the street, the riots had mostly been
    cleaned up. I suddenly wondered at the madness of gathering another crowd days
    after that. But we *had* to learn how to gather again without killing each other,
    and we had to learn it fast.


    I said to the rain, “Well, everyone can live with the de-icing bills and the lost
    revenue from the complete lack of music. Future presidential inaugurations will
    feature people talking instead of pop stars singing. The Kennedy Center will become
    a museum for lost art, and the Lubber Fiend will wipe the floor with me.” I sighed.
    “It’s been a good run for us all.”


    Red and blue lights flashed, and a police car pulled up at the end of the block
    and I sat up straight. An officer got out and started waving cars along. Detective
    Lee had come through.


    I hopped off the newspaper box, and as soon as the last cars passed me, I wandered
    out into the street to look the other way, where another police car was parking.
    I winced. They’d only cordoned off a single block.


    “Okay, it’s not a parade.” I forced myself to smile. *Happy thoughts.* “It’s a
    block party.”


    I spotted a few commuters hurrying to work on foot, eyeing the police cars, and
    moving faster. A homeless man slept in the door to Walgreens, and a guy in spandex
    bike shorts jogged out of the metro to dance in circles through the intersection
    as the light turned.


    “We’re here. Where do you want us?”


    As I spun around, I couldn’t fight the tears springing to my eyes. Astrid emerged
    from the Metro escalators with a collection of half-familiar people from Columbia
    Heights. Many more followed, each carrying a flower or a piece of art or a baked
    good.


    “Thank you,” I told Astrid.


    One of them shrugged. “Anything for Juya.”


    “She’ll be here,” I said.


    She had to be here.


    Hearing a rumble, I turned to see Mrs. Bao rolling the small, battered piano from
    her shop into the intersection. She wore a red nylon jacket with Mandarin script
    and the English words “Happy New Year” on it. She grinned at me. “I called everyone
    I know.”


    All I could say was, “Thank you.”


    And then I smelled Juya. Cinnamon and coconut. Osman was helping her from a taxi
    into a wheelchair just beyond the crime-scene tape. A cheer went up from the group
    as they converged on her to give her their offerings. I’d worried it wasn’t official
    or the worship she was used to, but watching them hug her, it seemed even more
    authentic: gifting a grandmother, blood or not, with little tokens of love in
    a ritual as old as humanity itself.


    Teresa exited the taxi next, carrying enormous bags that explained the smell.
    Of course, Juya had brought breakfast. She handed little cakes out as she rolled
    through the group and collected her gifts.


    I knelt on the ice by her chair and put my hand in hers. “I didn’t bring a gift.”


    She cackled and pushed an empanada into my hand.


    “No!” I said, “You were supposed to get gifts, not give them.”


    She closed my fingers around the tiny pastry. “Get, give; it is the same.”


    I nodded and sniffled. “Thank you for all you have done for me. That’s all I can
    say.”


    “You arranged all this.”


    I shook my head. “Astrid did, and Osman, and the whole neighborhood. Is it enough?”'
