  raw: 'I tried to get my heart rate under control. “Astrid, I’m so sorry about the
    recipes. I don’t know what’s wrong, but I’ll figure this out—I promise. For now,
    don’t sell anything I made. Throw it all away.” Who knew what kind of terrible
    magic I baked into those treats?


    “You can’t give up when it doesn’t work!” she exclaimed.


    “I know. But I can’t fix the ones you have, and I don’t want to spread them across
    the city if they’re not right.” There, that sounded professional.


    “I got another rejection. Maybe I should stop.”


    I sat up, razor straight. “Stop school?”


    This was Astrid, the most driven person I knew, who plowed through obstacles like
    they were bowling pins.


    “Maybe you’re right. Maybe this is crazy.”


    “Ahhh, don’t make any hasty decisions today. Okay? Um, throw them away, that’s
    it.”


    “I feel so powerless,” Astrid said. “We’re doing all this on faith.”


    “And your business genius, and my baking skills. Faith is for suckers.”


    She laughed. “There’s some proof of that. Optimists don’t get more opportunities;
    they notice more that are already there and pessimists don’t even see them.”


    “See? Happy thoughts! Unicorns and rainbows! You hear me?”


    There was a long pause that even Hassan seemed to hang on. “Yeah, I hear you,”
    Astrid finally said.


    “Great! See you soon!” I hung up before she told me she was going to give up all
    worldly possessions and join a commune and have twenty kids, or something equally
    unlikely.


    I turned to Hassan. “Please be careful, too. With the ice. And everything.”


    “I am always careful,” he said with a grin.


    “Seriously. It’s not normal ice. I’m not sure what’s going on yet.”


    He sobered. “Another djinn?”


    I shook my head, then stopped. “I don’t think so. This seems bigger than that.”


    His mouth fell open. “What do you mean?”


    “I mean, the djinni took out a city block. This storm covers three states.”


    “Yikes.” He pronounced the word carefully.


    “Just exercise caution, Hassan. I can’t be any more specific than that now, but
    I’ll tell you as soon as I know more.”


    Hassan slowed, and I realize we were pulling up in front of Scharf’s clapboard
    house. Hers was the only free-standing structure on a long street of brick row
    houses in the cookie-cutter suburbs south of the Pentagon in Virginia.


    “Orange…”


    “Thanks a lot!” I jumped out and slumped when I saw Scharf on the front porch.
    “You called her.”


    “Of course, I called her when you call me desperate for a ride without her!”


    “Well, thanks anyway. I mean, just thanks for the ride.”


    “*Ma’a salāma*. Although I don’t know why I tell you to go in peace. It seems
    like you and peace are like mayonnaise and water.”


    “I think you mean oil and water.”


    He cocked his head. “Isn’t mayonnaise oil?”


    I opened my mouth and closed it. “Point.”


    Scharf jogged down her sidewalk and ducked to speak to Hassan. “There’s another
    position available.”


    He rolled his eyes.


    “They keep asking,” she added.


    “Would you vouch for these men?” he asked. I wasn’t sure what they were talking
    about.


    Scharf said nothing.


    “I am done being the mouthpiece for messages I cannot influence.”


    Scharf nodded once. “I said I’d ask.”


    She stood back, but he leaned towards the passenger seat. “When my wife has completed
    her degree, and I do not have to watch the children, I will look at another position.
    If they are worthy.”


    “I’ll tell them,” Scharf said but didn’t move. She looked at me.


    “I’m going.” I flipped up the collar of my orange leather coat against the continuing
    miserable drizzle and walked away as Scharf got in the car to chat more.


    As I walked, I scanned the street carefully for anything red. It was tough with
    all the red brick. If the Lubber Fiend was lying in wait, he had a lot of camouflage.


    Nothing moved except the dripping water, and I finally stumbled onto Scharf’s
    porch and tried the door handle. It didn’t move. She’d installed an automatic
    lock with a keypad on her front door after ghuls had destroyed it, so if it shut,
    it was locked.


    I turned back to see her and Hassan in an animated conversation in the car. Scharf
    would know something was up if I asked her to open it for me. She hadn’t bothered
    to give me the code since I could open it with a murmur of magic. Most of the
    time.


    I leaned against the door.


    “Invader!”


    I tried to spin around to defend myself. It took me almost five seconds. I looked
    around, hands out, my only weapons. A tiny shape less than a foot tall jumped
    onto the porch.


    He farted and said in his high-pitched squeak, “You woke me up!”


    I crouched to peer at the gnome. “Oh, thank God, Officer Grimm. Can you open the
    door?”


    Scharf hadn’t bothered to name him; I’d called him Grimm in a fit of humor that
    seemed grotesque now. He’d been a gag gift from one of her friends: a garden gnome
    in a police uniform. Neither had known he was real. The gnome looked from me to
    the door.


    When he didn’t answer, I said, “Please open the door?”


    “Why?”


    “I’ve temporarily lost my magic, okay? Open the door!”


    “What will you give me for it?” He’d learned quickly about bargaining by watching
    me. I wrinkled my nose and wanted to offer him a cookie, but I didn’t trust my
    cooking right now.


    Unable to think of anything, I finally said, “My thanks.”


    He glowed and said, “Good bargain, goblin.”


    “Okay?” I replied, befuddled and slightly sheepish. He jumped off the porch and
    dove for the ground. It parted for him like water. He and I had similar earth
    powers. We were probably distant cousins in the magical creature universe.


    A minute later, the lock clicked, and I opened the door to find him dangling from
    the knob. He tumbled to the floor, bowed, and tapped his foot.


    “Thank you, noble gnome.”


    He farted again and saluted, wearing a proud grin, before turning to disappear
    into the living room.


    “Wait!”


    With all the magic in the air and the Lubber Fiend circling, I wanted to check
    on my box, my literal inheritance from my father, but I’d buried it beneath the
    house after a ghul attack and I didn’t have any magic to dig it up.


    “Can you get me my box? From the basement?”


    “What will—”


    “What will I give you? I know, I know.”


    “Cookie!”


    I sighed. Apparently, thanks only went so far; we really were related. But since
    I was now on the same side of the door as the kitchen, I could handle that. “Okay,
    deal.”


    There was no chime in my head. I swallowed and quelled a spurt of panic; I really
    had burnt myself out. *It’s coming back. Of course, it’s coming back.*


    Fortunately, I didn’t need magic to bake a cookie.


    Grimm dove *into* the living room floor and through to the crawlspace beneath,
    carving another hole in the hardwood. I winced but couldn’t do anything about
    it now.


    I took off my jacket, and let it drop in the entranceway. Then I stared at my
    jacket on the floor, horrified.


    Slowly, I bent, picked it up, and hung it in the closet next to the front door.
    I was a goblin; we kept house. Scharf was the slob.


    *Something is seriously wrong.*


    I looked around her home with fresh eyes. I’d done a massive cleanup a few weeks
    ago, and we’d slowly been working out a level of clean that was acceptable to
    both of us. She had confessed that it was nicer to walk around her living room
    rather than crawl over and under sports equipment, laundry from the last month,
    and mail from the last six.


    In the last week, without my having realized it, the junk had crept back. The
    living room was still livable, with my belongings stacked by the couch under the
    window where I slept and Scharf’s gym stuff in some kind of order on the opposite
    side of the room, but it did not look like a goblin lived here. I grabbed for
    a kettlebell on its side in the middle of the beige carpet but couldn’t budge
    it. My magic was genuinely gone. I couldn’t even summon enough of it to pick up
    that small piece of earth and move it to its rack. I wasn’t strong enough to lift
    it without magic.


    Cookies. The next step was cookies, which was not a bad idea under any circumstances.
    I abandoned the mess to walk across the hall.'
