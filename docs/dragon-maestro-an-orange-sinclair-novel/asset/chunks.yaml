    “How did you know he was a goblin?”


    “What do you see when you look at him?”


    She peered down the alley, her brow creased. “Male, White, brown hair, and brown
    eyes, thirties, less than six feet tall, maybe less than five. Strangled. Huge
    mullet.”


    “Fingernails?”


    She shrugged. “They looked like fingernails.”


    “Ears?”


    She scowled. “I didn’t notice.”


    “Well, to me, he looks like a goblin. His skin isn’t white—it’s blue. He has claws
    and ears like mine.”


    “Ears like yours?”


    I winced. It was my habit to keep my hair long and covering my ears. Until that
    moment, I’d forgotten she’d never seen them.


    “Show me your ears,” Scharf demanded.


    My head felt like it was on a gimbal, shaking violently. “No. That wasn’t part
    of our deal.”


    “Okay, you can stay at my place if you show me your ears.”


    “You already bargained to get my help in exchange for my staying with you,” I
    told her. “You can’t rebargain for something else.”


    “You just made up that rule.”


    “No, I didn’t. It has to balance!”


    “Balance? How about I strangle you and then we’ll be even?”


    “Cease attempting humor immediately.”


    “Who said I was joking?”


    My stomach hollowed, but then Scharf laughed and said, “How does every conversation
    with you go in circles? The body, Orange. Who was he?”


    I sighed and tried to think of the best way to tell this story. Something flickered
    in the window of the music shop. I peered inside but didn’t see anyone. The window
    display held a dozen string instruments I didn’t recognize and a half dozen violins
    that I did. The sign over the door didn’t have English lettering below its Chinese
    characters.


    I wanted to explain to her that talking back and forth about a subject was how
    normal conversation worked, something she rarely indulged in, but when I opened
    my mouth, I said, “I claimed the box my father left me.”


    “Don’t change the subject.”


    “I’m not! I’m trying to tell you how this goblin came into my life. My father
    passed on his box to me, so I am now the `Peallaidh`. As of a couple of weeks
    ago.”


    “What was in it?”


    I scuffed at a bit of ice, cracking it under my feet.


    She bit her lip, suppressing a smile, then schooled her face. “You still can’t
    get it open?”


    “Apparently opening it is not a requirement for inheriting it.”


    Scharf glanced down the alley to Fuller, who stood with his eyes closed and hands
    outstretched over the body in the light rain. Was he giving it a blessing? Melissa
    and Carlisle huddled over her notepad, ignoring us. Scharf turned to me. “So this
    goblin is connected to your father?”


    “Not really? Now that I’m officially the `Peallaidh`, all the goblins in my kingdom
    get to challenge me to make sure I’m worthy of leading them.”


    “All the goblins,” she repeated.


    “The goblin last night was the first, the weakest one, so it was a pretty quick
    fight. We wrecked a subway car.”


    Her face went white. “You `fought` with him?”


    “Not to the death! And fortunately, he knew a shortcut, so I don’t have to fight
    the rest of them. I have to go to the top of the heap and fight the most powerful
    goblin. I mean, the most powerful after me. Hopefully. Then he had to kill himself
    to restore his honor.”


    “Oh, my God.” She hurried away from me, sloshing through the rain to the curb.
    “Orange, get a lawyer,” she said over her shoulder. “Stop talking.”


    I tramped after her, hopping over the puddles. “No, not like that. He didn’t actually
    die. He jumped out the window.”


    She pivoted slowly and stared at me with two round eyes. “Repeat that?”


    “But he was fine! And technically, he jumped through the window, not out the window.
    So there might or might not be a few cuts and bruises on his face that were probably
    from the window. Or possibly my fists.” I tried to speed through that part. “But
    he really was fine.”


    She didn’t even tell me to stop talking, only looked up into the falling rain
    as if it would save her.


    “Hey, I’ve jumped from higher than that.”


    Scharf jabbed her finger at me. “No jumping out of buildings.”


    “You know, it looks like you’re pointing at the air.”


    She glanced around, but the only other person around was a homeless man sleeping
    in a bus shelter across the street. Since the riot and Rodger’s murder the night
    before, the neighborhood was far less busy.


    Scharf didn’t move. “Make me a deal. No jumping out of buildings unless you have
    to.”


    I turned to Scharf. “What if I go bungee jumping? Is that allowed? If I have a
    little rubber band around my ankles, is that okay?”


    “Bargain, Orange.”


    “What do you have that I want?” I said, perhaps a little too cocky.


    “Orange.” It was her FBI voice.


    “Fine,” I said. “Deal. I won’t voluntarily jump out of a building unless I have
    to.”


    “Define ‘have to.’”


    “Ugh. I shouldn’t have taught you about bargains.”


    She tapped her foot.


    “‘Have to’ means my life is in danger or someone else’s life is in danger. Okay?”


    “Good.”


    I crossed my arms. “It wasn’t a building, anyway. It was a train.”


    “Any height!” She shouted.


    “Okay fine, deal!” Provoking her right now was not the smartest thing I’d ever
    done.


    “You never saw the goblin before he challenged you on the subway. You don’t know
    who did this. And he was alive when you saw him last.”


    “The only…” I trailed off, reluctant to tell her the next part.


    “The only what?”


    “The only other thing is that I made a deal with him, too. He was going to find
    the Lubber Fiend for me. The most powerful goblin… The second most powerful goblin.
    In exchange for letting him jump out the window.”


    She narrowed her eyes again; this time they were nearly slits. “So you could’ve
    stopped him?”


    “You had to be there. And they can replace the window.”


    “I wasn’t worried about the window!”


    “There’s a chance he might have contacted the Lubber Fiend, who might or might
    not have found him and now is wandering around DC trying to fight me.”

