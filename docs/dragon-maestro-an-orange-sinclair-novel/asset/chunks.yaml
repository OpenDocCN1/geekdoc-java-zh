    “But—”


    # 12


    “They’re not locking you up,” Scharf said, her eyes on me as I stared at the razor
    wire and squat cement building with a sign that read *Chesapeake Bay Maximum Security
    Prison*.


    “It could have been,” I said, still not moving. They’d arrested me and interrogated
    me when they suspected me of a plot to assassinate the president.


    “It wasn’t you,” Scharf said, starting towards the towering walls.


    “It could have been!” I repeated.


    “If you dwell on the bullets that miss you, you’re letting them hit.”


    I scrambled after her, walking gingerly on the ice, and murmured, “Only you could
    spout philosophy with bullets.”


    “What?”


    “Nothing.”


    At the first gate, she unclipped her Glock from her belt and handed it to the
    guy behind the window. “We’re here to see John Hastings.”


    Heart pounding, I held up my driver’s license. We were trying out a new trick
    since Scharf said an FBI agent would never interview a suspect alone so I couldn’t
    go invisible.


    I transformed my driver''s license into an FBI badge with the same glamour I used
    to adjust my appearance. Although I could easily make myself look like a normal
    human being without orange-tinted skin or floppy ears, it was way, way, way harder
    to glamour objects. As the guard read off my name, I prayed he wouldn’t reach
    for the license. If my fingers left it, the game would be up.


    Fortunately, he didn’t seem that worried about people trying to get into prison,
    and another guard soon escorted us into the first of a series of barred enclosures.
    The gate slamming behind us left me gasping for air, but several orange lines
    sprouted in various directions, which was reassuring. I could get out of here
    anytime.


    The itch down my spine grew as we tunneled deeper into the facility and there
    were fewer and fewer orange lines showing me the way out. We went through a series
    of gates and doors that all locked behind us.


    I’d only spent a few days locked up during my first case with Scharf, but it left
    me with an allergy to beige rooms and jail cells. Finally, the guard escorted
    us to a room with a metal table and three chairs. The walls were gray, not beige,
    but it didn’t make me feel better.


    It felt like a small animal was trying to gnaw through my guts. I leaned toward
    Scharf and whispered, “Where’s the glass?”


    “What glass?”


    “The glass between the murderer and us? Dramatic drawings on the walls? The overhead
    bulb?”


    “This isn’t *Silence of the Lambs*. This is where everyone meets with any prisoner
    in this place.”


    I sighed as we sat down. “So, we’re actually less safe than Clarice was.”


    Scharf smirked. “Aside from the obstacle course at the beginning, I don’t think
    you should draw procedural tips from that film.”


    “You’ve been on that obstacle course?”


    She nodded. “Yeah. Great workout.”


    I threw up my shaky hands, then quickly hid them under the table as the door buzzed.
    It seemed as loud as a gunshot; I flinched as it clicked open.


    “Sit up straight,” Scharf said. “Try to look official.”


    Somehow, I didn’t think the curve in my spine would help with how official I seemed,
    but I ratcheted my shoulders back.


    As the door swung open, I took a deep breath and tried to match Scharf’s fierce
    look.


    The man who walked in wearing handcuffs and an obnoxious shade of orange (which
    was really saying something coming from somebody with my skin tone) was a definite
    anticlimax.


    I was going to make a crack about Anthony Hopkins but didn’t want to draw any
    attention to myself. He was middle-aged, middling height, balding, out of shape,
    and pasty. This man had killed half a dozen people? Terrorized restaurant owners
    throughout Baltimore? Maybe Scharf was right, and the actual killer was out there
    all this time.


    As Hastings took a seat across from us, it thrilled me to see the guard leave
    the shackles around his wrists and back up to stand against one wall.


    I tried to remind myself that I was a very powerful magical creature, the leader
    of all goblins, but my right leg jiggled under the table.


    The man looked between the two of us with absolutely no expression and said in
    a light tenor that matched his body but not his reputation, “To what do I owe
    the pleasure?”


    Scharf glanced at me, and I gulped. She had a very annoying habit of letting me
    lead in interviews, so I could ask whatever ridiculous questions I had without
    diminishing her authority. Instead of the usual good cop/bad cop, we played random
    cop/silent cop.


    I said, “FBI.”


    I didn’t elaborate, not wanting to admit that I wasn’t personally with the FBI,
    while also hoping he would draw the right conclusions.


    “XYZ,” Hastings said, and I frowned. Scharf wore a much better poker face; only
    one eyebrow twitched. “Forgive me,” he continued. “I thought we were reciting
    random letters of the alphabet.”


    Scharf said, “I’m an agent with the Federal Bureau of Investigation.”


    He smiled, looking a little like a church deacon, before he said, “The real killer
    has struck.”


    I gasped, then bit my tongue to keep quiet.


    This time Scharf didn’t twitch at all. “A jury of your peers convicted you in
    a court of law. First-degree murder. Six victims. The evidence was incontrovertible.”


    Hastings traced an idle figure eight on the table in front of him. “And yet here
    you are. Should I contact my lawyer?”


    Scharf shrugged. “That’s your right. But we aren’t here about your current convictions.”


    Then she looked at me. I almost jammed a nail into my palm, trying to get my hands
    still as I said, “I’ll make a deal with you.”


    “You mean I will not live out my life behind these bars, and you will repeal my
    miscarriage of justice? For that, I’ll definitely need my lawyer.”


    I shook my head. “Not that kind of deal.”


    “What have you got?” he said, sitting back. As I glanced at Scharf, he said, “Yes,
    check in with your keeper. Why am I talking to her since you’re clearly the alpha?”


    To my shock, Scharf smiled. “She has more clout than either of us combined. I’ve
    just had more experience with scum.”


    That seemed to make Hastings happy, and after a moment, Scharf sighed. She’d lost
    points with that last crack in a game I hadn’t realized we were playing, and I
    hadn’t gotten a copy of the rule book.


    I was feeling less scared, but infinitely warier. Appearances could be deceiving.
    I’d braced myself for somebody crazy, out of control, rabid. But Hastings was
    observant and charismatic. I suppose you had to be if you could get away with
    murder six times over before finally getting caught. If he stuck out, somebody
    would’ve noticed.'
