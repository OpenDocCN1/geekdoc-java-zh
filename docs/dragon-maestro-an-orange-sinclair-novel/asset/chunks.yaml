  raw: 'Juya closed her eyes. In a few seconds, the rain seemed lighter, though maybe
    I was imagining it. I stood up and turned to the crowd.


    I shouted, “Three cheers for…” *Old ladies who save the day?* But as grateful
    as I was to Mrs. Bao and Juya, it wasn’t just them. “For neighborhoods! For DC!
    For us!”


    Many people came to this city, like me, with an agenda, a protest, or a symbol,
    but looking around at the very different crowd than the hockey spectators or the
    ugly riots, I realized it was also becoming home, as it had always been to most
    of this crowd.


    Juya seemed to grow in her chair after the people cheered. The rain stopped.


    The cheering petered out to shocked murmurs.


    I craned my neck to look straight up, something I hadn’t done in weeks. The clouds
    still hung low above the intersection, but the dry air tasted fresh. I looked
    around and saw that many in the crowd followed me, standing in the street, staring
    open-mouthed upwards.


    They didn’t know she had done this, but they exclaimed as the temperatures climbed
    above freezing for the first time all month. Commuters stopped and gawked as well.
    A few workers ran out of their restaurants to stare at the sky.


    We looked up at the clouds like we had suddenly entered a grand cathedral. The
    silence felt holy, broken only by a few bubbles of laughter.


    Then the moment passed, and somebody let out a whoop and the whole crowd cheered,
    and the clouds got lighter still. One man took off his coat.


    I realized we would be okay. Without the dragon’s positive influence, we could
    build our own.


    Of course, it would be faster with him.


    “If you don’t have anywhere to be, stick around!” I announced. “Thank you for
    honoring our favorite baker on this, her birthday.” Juya snorted, and I grinned
    as I said, “A block party will be set up here in a few minutes with entertainment
    and musicians! This is our city. This is our neighborhood! Let’s celebrate!”


    The crowd cheered again. And most of them stuck around, not because I’d told them
    to, but because of Juya, who sat perched in her wheelchair next to the newspaper
    box right under the arch, and Mrs. Bao, who was gathering a crowd of her own carrying
    instruments, mats, and costumes.


    Juya called me over and pulled me down so she could whisper in my ear. “You’re
    very brave, *duende*. And you have an hour before the ice returns. Unless you
    can bring more worshippers.” And then she laughed her familiar laugh, resonant
    and rich.


    I sucked in a breath. I had less time than I’d thought.


    “Orange!” Mrs. Bao waved me over. A bunch of young people in matching maroon jackets
    were crouched at her feet, pulling band instruments out of sturdy cases.


    “Thank you,” I told her. “Thank you so much.”


    “I told them they’d have an actual crowd to perform for.” The smile slid off her
    face. “They’re very young. Most of these were the acts the committee rejected
    in favor of older or more experienced groups. Or the ones with more money.”


    I looked at another motley collection of teenagers emerging from rain gear like
    gangly butterflies. I wasn’t sure what their contribution was. “This works. It
    has to work.”


    “Where’s Mrs. Scharf?” she asked.


    “I’m here,” Scharf called, climbing out of the eggplant sedan she’d parked next
    to a police car. I started toward her. To my shock, Fuller, Carlisle, and Melissa
    piled out of the car after her.


    “What are they doing here?” I asked her quietly when I reached them.


    “I told them I couldn’t stake out the waitress’s house because I had to go to
    a parade in Chinatown. They insisted on coming.”


    “Why?”


    “They think I’m going to catch her here or something.”


    “I’m going to the Pasta Shop,” Fuller announced.


    “It’s closed,” Scharf said.


    Melissa raised her hand. “There’s a teashop next door.”


    Scharf turned to them. “You know what? That’s a great idea! Definitely stake out
    the teashop on the off chance she comes back to work four hours before they open.
    Great use of time and resources.” She spun back to me. “Where’s Kui?”


    “I was just going to go get him,” I said.


    “Shouldn’t I do that?” Scharf asked.


    I shook my head, watching the trio head toward the tea shop. “Let me, please.
    If things go south, I’m much more likely to survive than you.”


    She glanced up and down the street. “Okay. Fine.”


    “Seriously?”


    “I don’t think things are going to go south.” She hit the purple hood of her car.
    “The car made it through.”


    I glanced at the dents the crowd had put in it at the protest. “It’s early yet.”


    “This is going to be the weirdest takedown of my career.”


    “Well, hopefully, it’ll be a pulling up, not taking down.”


    The marching band collected themselves and started to play a Sousa march that
    sounded slightly off-key and off-rhythm, and excessively American, but very upbeat.


    *It’s enough.*


    Off to the side, Mrs. Bao spoke to a bunch of older men dressed in brilliant yellow
    silks. One of them fit a dragon’s head over his own. The rest of them held the
    silk that would become a dragon’s body. A group of kids set up a mat and one did
    a handstand and then flipped over; acrobats ready to perform.


    I looked over the few spectators, munching down on Juya’s treats and clapping
    along to the marching band, and fought a feeling of disappointment, trying to
    cling to my inspiration from minutes ago. This was a genuine community. It would
    have to be enough.


    As I approached the corner a block away, it heartened me to see the dragon in
    the window of his shop, watching the scene in the street. I glanced in the teashop
    and saw Fuller, Melissa, and Carlisle settling in the front window with big mugs
    of coffee. I told them not to notice me. Behind them, David and Mr. Bao stood
    at the counter, serving a huge crowd.


    I ducked under the awning of the music shop and opened his door to a tinkle of
    bells. The dragon perched on a stool beside the door. Kui’s face was gray, and
    his hair was grayer, strands of white shooting through the black.


    “Dragon,” I said.


    He didn’t twitch.


    “Dragon Kui Liu.”


    He sighed. I took that for a response.


    “I’ll make a deal with you. I’ll never come back if you walk outside with me now.”


    “Why?”


    How would I tell him the truth without strengthening his despair? “I cannot imagine
    what you have seen and survived in all your centuries. And I know we don’t deserve
    it, most of us, but some of us do, and I’d like to ask you to…” to what? *Influence?*
    I should have thought this through. “Stay?”


    He didn’t respond.


    I was going to say something about a fun morning; I was going to keep things as
    light as possible, but my awkward words spouted out instead. Sure, I didn’t pack
    the same punch as a dragon, but I wasn’t a powerless creature, and a millennium
    is a long time. I needed to know it was possible to live it well.


    “Please?”


    He shook his head.


    “Okay, no deal. Just a favor. I’ll be in your debt. If you could come outside,
    you’ll see people do still care.” I had to force each word out of my mouth; it
    was physically painful as a goblin not to balance the scales. To ask him to do
    something for me and tell him I’d pay him back when and how he wanted. My intestines
    twisted.


    “Why?” he repeated.


    “Because Mrs. Bao worked really hard for you!” I gulped against the sudden tears
    at the back of my throat and in my eyes, trying to think of a more spectacular
    reason, and failed in the face of his ancient stare. My patience failed me. “Fine.
    You want honesty? We wanted you dead. But Mrs. Bao convinced us you’re not a lost
    cause. She worked all night for you. But even if she fails, we’re gonna be fine.
    I’ve got water magic. I don’t care how much ice you throw at me—I’ll never slip.
    Stay here and rot.”


    I wanted to slam the door of his shop, but it was on automatic close, so it ponderously
    shut behind me as I tried for a dramatic exit.


    As I reached the crowd, my righteous anger slid into panic. *What had I done?*


    I almost turned around, rehearsing arguments in my head. It was nearly impossible
    to think when I was near him.'
