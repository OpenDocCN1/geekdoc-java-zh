    I grimaced. I’d forgotten I met David the night of the murder. When he glanced
    down to pick up a mug, I quickly dropped my glamour, turning my hair strawberry
    and curly and my skin orange.


    He jerked when he looked back at me, squinted, and said, “Never mind. Sorry.”


    “I’ll take a tea,” I said, lowering my voice.


    David jerked a thumb behind him at the chalkboard menu with at least thirty different
    options in carefully printed capital letters. “Take your pick.”


    I cleared my throat. “You pick.”


    He grinned. “You like green, black, white, fermented, herbal?”


    I swallowed. “What’s your best lightly flavored tea? Think very weak.”


    He smirked. “Green tea with honey in a big mug?”


    “Great.” I leaned on the counter as he pivoted to grab one tin behind him and
    started pouring pale leaves into a stainless-steel pot. I licked my lips. Maybe
    he knew what his aunt was, and I wouldn’t have to confront her.


    “So…” I began. “Crazy weather we’re having?” I cringed at the most obvious line
    in history.


    He grinned at me, and I realized he took it as a pickup line. I felt weird flirting
    for information and straightened back up.


    I traced a circle on the spotless wood counter and tried again. “It’s almost like
    someone is artificially changing the weather to be horrible all the time!”


    “You sound like my aunt,” he said as he got a coffee mug from beside the aluminum
    urn. “It’s not real!” he said in a perfect imitation of her voice.


    “Wow, what does she say is doing it?” I asked a little loudly. When he stiffened
    at my tone, I forced a heartiness into my voice. “Or… who? Just out of curiosity?
    A hugely powerful, destructive magical creature? Theoretically?” He didn’t say
    anything else, just added hot water to the pot. I exhaled. “You know my dad believed
    he was a goblin? Like an actual goblin.”


    He blinked twice.


    “With magic. Hahaha. Ha…” I trailed off.


    He put a strainer over the mug and poured the leaves and the water through it.
    “Weird.”


    “And the dude next door, well, technically his grandmother, believed in miracles
    because her toast got burned.”


    “Joe? He told me that whole thing was a prank.”


    A prank apparently the entire neighborhood got in on. “I’m just saying, magic
    weather is not the craziest story I’ve heard today. Haha.” I forced myself to
    shut up when my hysterical giggle threatened to turn into a full goblin cackle.


    “It’s nothing,” David said, setting the mug in front of me. I dug for cash and
    took a sip. The flavor was rich, subtle, and unlike any tea I had ever drunk before.


    “This is so good.” I took another sip, marveling at the floral explosion in my
    nostrils. “Like, so good.”


    He smiled and put the bill in an old-fashioned register without a computer attached.
    “You’re welcome.”


    I took another hasty sip, wanting to take an hour and savor, but I leaned closer
    to him, forcing a grin. “Top that story.”


    He leaned closer to me, smiling again. “Okay fine. My aunt believes there’s a
    dragon in the building and he’s causing the storm.”


    # 18


    “There’s a dragon in the building?!”


    At David’s sharp look, I slammed my lips shut.


    “And that’s why she’s such a talented piano player,” he continued, cleaning up
    his side of the counter. “Because of the dragon. Not because she spent most of
    her life practicing. And why I should play my damn violin more. Because apparently
    gaming is not a viable career path.” The upside-down mugs and cups on the counter
    were jiggling with each swipe of his rag. “Even though I make more in an hour
    than she does in a day.”


    “I think it’s a brilliant career path!” I resisted the urge to reach over and
    grab his wrist. “Maybe think really happy thoughts about it right now. All unicorns
    all the time.” If we’d truly tracked the source of this, he’d been at ground zero
    for `weeks`.


    “You’re right.” He took a breath and dropped the rag.


    I put the mug down. “Um. Just out of completely idle curiosity, where is this
    supposed dragon?”


    “I don’t know.”


    I sighed.


    “He closes his shop early these days. I don’t know if he’s there or not.”


    I straightened. “*His* shop?”


    David hooked a thumb over his shoulder. “Yeah, totally. Supposedly, the old dude
    next door is the god of music. And thunder.” He picked up a rag and cleaned a
    precise circle directly in front of him on the spotless counter.


    “Not another fire-breather.” I gripped the counter to keep upright.


    “What?”


    “Nothing!”


    “He wouldn’t breathe… Just no. Chinese dragons are good luck. They don’t breathe
    fire.”


    “Of course,” I said, mostly to myself, “the djinni didn’t breathe fire. He *was*
    fire.”


    “What?”


    “Since no one has run screaming from the building, I take it he doesn’t look like
    a dragon?”


    “Are you okay?”


    I nodded, visions of silent radios and malfunctioning music apps dancing in my
    head and the endless, silent ice. “You’re right, that’s such a super weird thing
    for your aunt to believe! Um, thanks. Good luck with board games!”


    “They’re not… Have a nice day.” He turned to serve a guy who had poured himself
    a coffee.


    “Amina!” Hassan cried out, panic drenching his voice.


    I ran around the counter to see Mrs. Bao and Hassan, but no little girl.


    “Amina!” Mrs. Bao echoed. “Where could she have gone?”


    “My car’s out front. Maybe…” Hassan ran towards us.


    Mrs. Bao spoke to a few customers in rapid Chinese, but they shook their heads.
    “I’ll check the back!” Mrs. Bao said and ran in the opposite direction toward
    the back door and the alley.


    David launched himself over the counter and ran towards his aunt. He said, “I’ll
    check the apartment!” and ran up the stairs.


    Hassan ran past me and burst through the front door without seeing me. He waved
    wildly at Scharf.


    Feeling sick, I looked back at the archway into the dragon’s lair. The archway
    was as wide as two doors and dim, but I could see racks of instruments. If I was
    a young girl who enjoyed music, it’s exactly where I would go. I took a breath
    and stepped through.


    At first, all I could see were instruments I didn’t quite recognize. There were
    string instruments and reeds that looked vaguely like the guitars and flutes I
    knew.


    “Amina?” I said, far too quietly.


    I took a step forward and froze. In the back far corner of the shop, an old man
    sat on a stool staring at the floor.


    He sat behind a short beat-up wooden counter with an old-fashioned metal cash
    register perched on it. The monstrosity had hidden him from my view. He leaned
    against a precarious pile of boxes with customs forms and Chinese script stamped
    up the side of them.


    I tried but failed to see a dragon in the beaten man with his straight black hair
    and wrinkled face, wearing khakis and a cardigan. For a second, I questioned my
    sanity. And yet… He had a presence like Juya had sometimes, the sense of something
    *more* beneath the exterior.


    Then I saw a little hand reach up from behind the counter and pat his hand. I
    raced to the end to look around and see Amina staring up at him, absolutely fearless.
    I could also see from this angle that he only had one leg. It ended shortly below
    his hip and his pants were sewn around it. He had a pair of crutches propped by
    him.


    “Don’t worry, I’ll help,” Amina said to the dragon.


    At that moment, I saw double. An enormous red serpent, like a hologram hovering
    above him, nodded. I froze in terror. She was inches from a creature of unfathomable
    power. And she was patting his hand.


    I blinked, and he was only an old man again; the disturbing dual perception of
    serpent and human was gone. She sang an unfamiliar melody in a warbling voice,
    “*Lalo, lalo.*”


    The dragon shuddered, a full-body convulsion much more like something cold-blooded
    than human.


    I gathered all the magic I could summon as Amina finished her song, wanting to
    pull her out of there, but not wanting to anger him.


    “It means sleep,” she said brightly. “It’s from my old home, across the ocean.
    My Baba sings it when I am scared.”


    She laughed, and as she trailed off, the dragon smiled.


    And then the rain stopped.

