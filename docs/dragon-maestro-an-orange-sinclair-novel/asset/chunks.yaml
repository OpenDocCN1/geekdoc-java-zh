    As I ate, I felt more power return. My magic sorted out the mush in my brain,
    my stiff right shoulder I hadn’t noticed in the ache of my head, and a dull throb
    deep in my tailbone. I hadn’t had my powers long, but I’d forgotten how fragile
    humans are. How did Scharf march into danger knowing this and worse was possible?
    I’d only slipped and fallen.


    Scharf mirrored my bite and closed her eyes. “This is a sin.”


    I smirked. “Your last confession was a decade ago.”


    “Probably two. But seriously, so good. Thank you, `Orange.”


    I nodded and finished mine.


    “Speaking of sin…” she said.


    “Speaking of sin?” I gaped. “What follows that non sequitur?”


    “Demon?”


    I shook my head. “Not yet time.”


    “It’s a bombshell.”


    I straightened. “So goblins you could get behind without trouble, but demons are
    your line in the sand?”


    “Eighteen years of church and confession and Sunday school. You have to admit,
    it’s a little different.”


    I shrugged. “Not that different.”


    “It’s just…”


    I held up a hand. “Let’s solve this case. And then I promise you can grill me.”


    After we had eaten a scone each, Scharf leaned over and stretched her arm toward
    my face. I backed up an inch or two. “What are you doing?”


    She pulled her hand away and said, “May I?”


    “May you what?”


    “Your ears.”


    My breath left my body in a whoosh. Yes, I kept them covered and glamoured from
    everyone, but this was Scharf. I wasn’t sure why I was hesitating. She’d seen
    the bigger, more destructive pieces of my magic. What was a little extra flap
    of skin?


    Vanity, thy name is goblin. With another sigh, I dropped my illusions.


    She jerked a bit. “I forgot how—”


    “Orange I am?”


    “You look better without it.”


    Without the illusions, my skin darkened to a citrus hue; my hair got bushier and
    pinker; my eyes grew larger; my nails sharpened, and my ears…


    I shook my head. “You sound like my mom. ‘Be proud of yourself,’” I mimicked,
    pushing down the ache. I would have given anything to hear that from her again.


    I took another breath and pulled my hair back from the right side of my head and
    turned to the side. “Of course, it might have been helpful to know that I should
    be proud of being a `goblin`.”


    Scharf ignored me and touched my earlobe. I fought the impulse to pull away. Most
    goblin ears extended four inches, but mine grew only an extra inch, forming a
    floppy point like a drunken elf’s ear. The outside edge was ragged.


    Kneeling to get a closer look, she pulled the tip taut, gently stretching it away
    from my body.


    “Wow.”


    I felt like I was sitting there naked and jerked away from her. I covered my ear
    again, tucking the extra skin back behind the lobe.


    She wore a gentle smile. “Amazing.”


    “Really? They kind of gross me out.”


    “You’re a goblin.”


    “You’ve seen me pull down buildings with my brain. It’s not like this is the strangest
    thing about me.”


    “It’s… real.” She grabbed another scone.


    I took a bite myself. “How are you so okay about any of this? From the first time
    I met you and you shot a chimera between the eyes without even blinking, weird
    stuff has happened, and you say, ‘Oh, okay.’”


    “I’m just screaming on the inside.”


    I swallowed. “Scharf. You’re the most practical person I know. Except that can’t
    be true, given everything we’ve done.”


    She cleared her throat. “I think you’re right. I am practical; I try not to let
    my expectations of a case blind me to reality. We’re in trouble with this case
    because a lot of agents are falling into that trap. You saw how they saw the body
    and, without a shred of investigation, were so certain of what happened.” She
    gestured to my ears. “The evidence is incontrovertible. Plus, something really
    strange happened one night when I was in the Academy.”


    “What happened?”


    She squinted. “I’ll tell you someday. Your walking into my life wasn’t the first
    impossible moment of my life.”


    “It’s just demons that give you the squick.”


    She opened her mouth.


    “Sorry I brought it up.”


    She closed her mouth. Still feeling raw after dropping my glamour, I found I couldn’t
    meet her eyes. I focused and put it back in place, ignoring her flinch.


    To have something else to look at, I took out my phone. I swiped my music app
    open, my stomach knotting up again. Nothing that played music had worked for more
    than a day. I hit `shuffle` and waited. The music skipped through two songs, and
    my heart sank, but finally, an old Black Eyed Peas song sputtered to life.


    Scharf burst out laughing, a genuine laugh that crinkled the corners of her dark
    eyes. She finished the scone and gestured for another. I closed my eyes and pulled
    another scone up for her from the pan on the floor. She caught it with a nod.


    A crack sounded outside, and we both flinched. It was a sound we were growing
    used to, the death of tree branches and sometimes entire trees or houses under
    the weight of the ice. But here in these eight feet of kitchen, Scharf and I had
    repaired the heart of our weird.

