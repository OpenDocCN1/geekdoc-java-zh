    Scharf looked at me with surprise. “She didn’t kill Rodger?”


    Melissa rocked her head. “I was running; it was raining. My uncle insisted on
    playing valet, but you were right. There was no way to get back to the arena.
    I didn’t know where I was. And there was a body.”


