    I was beating people to a pulp, and I never did that. The top profiler, skilled
    at breaking psychopaths, was provoking restaurant owners to violence and holding
    seances over dead bodies. The city had rioted in celebration of a hockey game
    when it’s normally a challenge to get anyone to even applaud. Juya was sick, and
    she was never sick. Something was wrong with DC.


    The heavens opened on us.


    Scharf looked up into the streaming rain. “Oh, that’s mature.”


    I crossed my arms. “I don’t do weather.”


    “And now the crime scene is ruined!” she exclaimed, then sprinted down the alley.


    I wanted to go after her and tell her she was acting crazy—scary crazy—but I didn’t
