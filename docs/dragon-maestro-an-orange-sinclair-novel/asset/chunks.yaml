- fmt: '

    I’d read more of *Monster in the Kitchen*, Fuller’s aggrandizing book about how
    the `FBI` had caught him. Hastings had been connected to the first man he’d killed.
    After the manager at `East Side Eggs`, where he had worked for six weeks, had
    called him stupid and shady one too many times, Hastings had snapped and strangled
    him, leaving a sliver of a fingernail behind and a fork in his eye.


    It was a matter of connecting the murders from that point since the first murder
    was considerably less tidy than the others. It took a solid five years of work
    to build the case.


    Hastings stared at me with vacant blue eyes. “Do you have the standing to deal
    with me?”


    Frowning, I asked, “What do you mean?”


    “You said you’d make a deal, but what do you have that I might want? And if you
    have something, do you have the standing, the power, to grant it? I’m guessing
    the answer is no. On both counts.” I had to hand it to him, he had a better understanding
    of bargains than most goblins.


    Scharf’s eyes sharpened. “You guess?”


    “I know.”


    He was right. Bargains had to balance, and both sides had to deliver on their
    promises. Scharf and I desperately wanted an answer from him, an answer he’d never
    given in hours of interrogation and months of trial. What could we offer him to
    balance that?


    I froze, and the hairs on the back of my neck stood at attention. Hastings didn’t
    have to admit anything. With my magic, I only needed him to deny his involvement
    in the murders once we had a deal in place. To me, a denial would be as good as
    a confession for learning the truth. With a bargain, I’d know if he was lying.


    I relaxed, feigning confidence, keeping my hands well below the table, and said,
    “Make me an offer. You deny it—”


    He grinned and matched my posture, an attempt to sync with me that was too calculated
    to be anything but creepy. The longer I spoke with this guy, the more off he seemed.
    “But you can have that for free. I didn’t commit the crimes for which I’ve been
    so wrongly convicted.”


    Cursing inwardly, I tried to keep the disappointment off my face. It was no good
    if he gave it to me for free.


    Scharf kept her breathing steady as she said, “Short of getting out, you want
    for absolutely nothing here? You’re perfectly happy with your life in prison?”


    “I’m perfectly happy,” he said in a monotone, but I could sense the bitter anger
    behind his words.


    “There’s nothing you need or want from anyone?”


    He shrugged. “Nothing.”


    I was catching on fast. “Yet you took this meeting.”


    “Yes, I did.”


    “Perfectly happy people don’t leave their perfectly happy existence to chat with
    strangers.”


    “I’ll admit to a certain level of curiosity,” he said, the small smile gone from
    his lips.


    “Come on, admit it. It must be boring in here.” I leaned in closer, my hands clenched
    together, my heartbeat fluttering. “What did we drag you out of?”


    Hastings ran a hand over his balding head. “My cell. But you knew that.”


    “Day after day with the same view, the same guards, limited conversation. I promise
    to amuse you if you deny the charges once more. Do we have a deal?”


    “Ambitious. I’m intrigued.” His flat eyes met mine. “But not amused.”


    “Say, ‘Deal.’”


    “Who are you? Monty Hall? Do you expect me to name the price of your eye-catching
    leather jacket?”


    Scharf made a subtle gesture under the table for me to keep him talking. At least,
    I thought that was what her twirling finger meant.


    This was a risk. What would amuse a serial killer?


    I said nothing. Finally, he burst out laughing, which had the guard’s fingers
    twitching in the corner. “Oh, we have a deal,” Hastings said. “I haven’t been
    this intrigued in four years, six months, twelve days, and six hours. Since the
    farce of the trial I was subjected to.”


    “Sure,” I said in a spurt of annoyance. “They shoved a fork in their own eye.”


    “Drunks are so clumsy. Such regrettable examples of humanity, one might even say
    inhuman.”


    I froze when he said inhuman, hanging onto an even expression only by forcing
    power into my glamour. Nobody said anything.


    He inhaled and tapped one fingertip on the counter. “But do… Do tell me your plans
    for my amusement.”


    “You first,” I said.


    “I beg your pardon?” he said, and I stayed silent until he shifted in his seat.
    “Fine, I didn’t commit the murders. I have to admit, though, that I’m curious
    why you’re so intent on hearing me say it yet again.”


    I waited for the chime in my head, half hopeful we were already amusing him, but
    nothing. Clueless, I surveyed the room. What on earth would amuse him? Why did
    I agree to such a thing?


    I stared at Scharf, who didn’t take her eyes off Hastings.


    Suddenly, I got an idea. I knew something I could show him that was pretty unusual.
    Without preamble, I dropped my glamour. My skin tint turned darker. My nails elongated.
    My ears flopped. My eyes grew larger, and my teeth sharpened.


    He blinked at me and tensed. Again, I got the impression of bottled fury before
    he smoothed his body language. “Neat trick. I’ll admit that I’m more than a little
    disgusted. But not amused.”


    I very carefully told him, but not the guard or Scharf, not to notice me. When
    I went invisible, he jerked in his chair, but his expression never changed.


    I faded into view, this time trying to exaggerate my features. I had a picture
    in my mind of my father, with his deep orange skin and elongated ears, and sharpened
    incisors. Hastings leaned forward, his eyes round. “Horrifying but not amusing.
    Is this an illusion? A mirror? Psychotropic drugs slipped into my food? A puzzle
    I’ll have to puzzle out more.”


    I stuck my tongue out at him, and he leaped to his feet, the chair toppling behind
    him. He slammed his cuffed hands onto the table and barked at Scharf, “Your creature
    won’t disrespect me.”


    Scharf’s hand shot to her belt, where her gun normally rested, while her other
    arm flew across my chest as if she could protect me. I gripped her wrist, intent
    on pushing her behind `me` when the guard reached him and pushed him into his
    chair.


    Hastings swung around to face me, and I met his gaze. I knew enough about challenges
    not to look down.


    “I believe I’ll eventually be amused,” he said, looking at me.

    '
