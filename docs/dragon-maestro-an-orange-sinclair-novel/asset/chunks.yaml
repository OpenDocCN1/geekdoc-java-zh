    The air smelled of tomato and basil. Of the dozen tables spread around the battered
    faux linoleum floor, half were full of people slurping pasta. Their conversations
    blended with clinking cutlery and shifting chairs, a strangely muted soundtrack
    to an Italian restaurant. But this was how all restaurants sounded now that streaming
    music was so unpredictable.


    A young waitress wearing a black apron over a checked red dress that looked disturbingly
    like the tablecloths skidded to a stop in front of us. She had a drink tray tucked
    under one arm. “There’s no hostess today. Just sit down, and I’ll swing by soonest.”


    “We need to talk to Joe.” Scharf flashed her badge, cupping it discretely in one
    hand.


    “Oh, no,” she paled as she looked at it. “He said he won’t talk to the police
    again.”


    “I need to hear that from him,” Scharf said, unperturbed.


    The girl nodded and hooked a thumb towards the swinging red doors to the kitchen
    that I’d snuck out of the last time we’d been here. When Joe had been throwing
    pots out of windows. *Happy thoughts, Orange.*


    “I hope it’s good news,” the waitress said. “Because I can’t keep making excuses
    for the cursing coming from the kitchen. He doesn’t understand that we can all
    hear him out here now that the sound system doesn’t work.”


    Scharf nodded and headed towards the back. A skinny kid in a misbuttoned plaid
    shirt stood up from one table with two untouched plates of spaghetti in an unnaturally
    red sauce on it. He thrust a phone in our faces. “Are you with the police? Could
    I maybe get a quote?”


    Scharf looked him up and down. “No comment.”


    He turned to me. “Are you with the investigation?”


    Scharf took a firm grip on my upper arm and hauled me towards the back.


    “I have a true-crime podcast and we’re doing—” the kid shouted as Scharf towed
    me through the red swinging doors.


    Joe stood at a stove with two huge bubbling pots spouting bursts of steam. I tried
    to keep my eyes off the spot at the back of the kitchen where Rodger had lain.


    He glanced up. “No customers back here. Didn’t you see the sign?”


    I had, in fact, not seen the sign and opened my mouth to say so when Scharf said,
    “I’m here from the FBI.”


    “Get out,” he said, brandishing a spoon. “I got myself a lawsuit against you people.”


    “I just—”


    “I take the sixth!” he bellowed.


    I blinked. “Don’t you mean the fifth?”


    Scharf shrugged. “You assert your right to a trial before a jury of your peers?
    We can make that happen.”


    “Of course, you know what the sixth amendment is!” I said to Scharf.


    “GET OUT!”


    “I’m not with the FBI,” I said quickly.


    “Then you’re a customer and you’re not allowed!”


    I stepped forward instead. “I’m with a true-crime podcast. I want your side of
    the story!”


    Belatedly, I yanked my phone out of my pocket and waved it at him.


    “Oh really?” he asked, spinning, looking a little bit interested. When boiling,
    weirdly pink pasta sauce flicked from the end of the spoon, I used my new water
    powers for the first time in self-defense to divert them away from my face. Unfortunately,
    I didn’t stop to think where they would land instead, and Scharf hissed as they
    hit her neck and her gray suit jacket.


    I winced and tried to pull them back, but she was outside my little umbrella of
    control. She wiped at her collar and cocked a head at the swinging doors. I nodded,
    and she disappeared.


    I spun back to him, scrambling for a question, struck again by the fact I could
    be talking to the most powerful magical being I had ever encountered in my life.
    Or a human who was at ground zero of his powers. Neither one would be exactly
    calm. “I have, um, a podcast about, um, magic and crimes.”


    This did not impress him. He harrumphed and turned back to his pots, tipping one
    into a stainless-steel sink beside the stove. Little snakes of pasta and boiling
    water sluiced into a colander, sending a mushroom cloud of steam into the kitchen.


    “Deal,” I began, “You answer my questions, um, truthfully, and I’ll…” I had no
    inspiration whatsoever for what he could want.


    “You’ll what?”


    “I’ll leave,” I said, naming my fervent wish.


    He sniffed. “Good deal.”


    The chime sounded and I gaped. I’d never had a bargain start so easily.


    “Well?” he demanded.


    “Right! Um, have you experienced any kind of unusual happening here?”


    “No questions about how I killed the kid?”


    “Um…” I replayed my conversation with Scharf about Joe. “Don’t you have an alibi?”


    He stopped stirring. “Yeah!”


    “Well, then you couldn’t have killed him?” I held out both hands, trying to look
    professional. “Yay?”


    “Yeah! I mean, no, I couldn’t have!” He tossed the colander up and down to get
    all the water out and left the noodles in the sink to go back to the sauce. “I
    wouldn’t have either. He showed up to over half his shifts. Kept having damn seizures
    the rest of the time, but you don’t get that kind of reliability every day!”


    “You sure don’t,” I responded when he looked at me expectantly. When he didn’t
    say anything else, I said, “Sooo, so you sure?”

