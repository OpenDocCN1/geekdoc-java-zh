    “She doesn’t have a personality,” I said. “Can we get to the body?”


    Melissa looked at Scharf, who showed her teeth again. I couldn’t call it a smile.
    “I enjoy waterfalls,” Scharf said, “and scones.”


    I choked, and Scharf pounded me on the back.


    Melissa frowned. “Okay…”


    “And solving murders,” Scharf continued in the same tone. “It’s a really fun hobby.”


    “Of course.” Melissa turned a page in her notebook. “You were the first to see
    Rodger Clark’s body, correct?”


    “The first person to see the body was the killer.”


    Melissa paled. “Of course. Right. But you’re the one who discovered it.”


    “Wrong again. David…. A worker discovered the body and ran out into the street
    to get some help. We were… I was walking by.”


    “Someone with you?”


    Scharf shook her head, her lips in a thin line.


    Finally, Melissa added, “So you immediately recognized that it might’ve been the
    work of the Restaurant Killer. Can you explain why?”


    I had to hand it to Scharf for getting a murder suspect to interrogate her instead
    of the other way around, but we needed a bargain if this was going to work. I
    put a hand on Scharf’s shoulder and said, “We’ll answer all your questions about
    the first moments and the killer, but we’ll need your truthful recollections about
    `everything` that happened as well. For the PR.” I tried to remember what PR stood
    for. “Which means…”


    “Public relations,” Scharf said slowly, and I nodded vigorously.


    “Yes, for the public relations. We need… We need to know everything. Deal?”


    Melissa said, “Of course.”


    The chime sounded. My heart sped up.


    Scharf turned to me. “You go first.”


    I shook my head. “It doesn’t matter. Both have to happen for…” I trailed off.


    Scharf sighed, and Melissa asked, “For what?”


    “For the public relations.” I waved a hand wildly. “Agent Scharf, please tell
    her your recollections.”


    Scharf nodded. “When I saw the body, I realized it was posed similarly to the
    victims of the Restaurant Killer. I’d seen the photos in the case files.”


    “So even though you didn’t have anything to do with that investigation, you still
    reviewed the case files?”


    “When I transferred here, I read over some of the most prominent cases in the
    area.”


    Melissa tapped her pen against her temple. “I see.”


    Scharf shifted on her chair. “For just such a situation, funnily enough.”


    When Melissa scribbled that down, Scharf said, “And then I saw the fork. It was
    a pretty good sign of what had happened. Though, since we didn’t discover any
    plastic forks at the pasta shop like that one, we now know the killer brought
    it with her, which is a break in the pattern. You know the rest since you and
    your uncle showed up. Extremely fast.”


    She giggled her horrible twittering peal again. “We were at the hockey game.”


    “Right.”


    I tapped my toes. I was waiting for Scharf to ask the question. When she didn’t,
    I said, “So what was your involvement at the crime scene?”


    “My uncle got the call, and I came along. I’m trailing him for my next book. It’s
    all cleared!”


    I tried to think of what a public relations person did, let alone what questions
    they would ask. “It’s vital for the—optics—that we get everyone’s exact movements
    that night.”


    Melissa frowned. “I don’t see how that’s relevant. We were at the game. Once the
    crowd got a little rowdy, we walked out. My uncle got the call a few minutes later
    because he was familiar with the original case. They needed his expertise.”


    “How did you get out of the arena?” I asked. “The crowds were awful… From what
    I heard.”


    “We had terrible seats, thank god,” Melissa said, “Next to a door. My uncle left
    to get the car, but it was crazy in there, so I texted him I’d meet him outside.”


    “No car could have gotten within three blocks of the arena,” Scharf said.


    “We met a few blocks away.”


    Scharf said, “Run through any alleys or particularly rowdy streets on your way
    to his car?”


    “Everyone was going every which way.”


    Scharf tapped a finger on the table. “So, timelines. Very difficult. You were
    on your own running through the streets, got in your uncle’s car, and got the
    call about the body. Were you with him?”


    “Am I being accused of something?” she asked in an outraged voice.


    “Timelines,” Scharf repeated. “You wandered through Chinatown, met up with your
    uncle, and showed up at the crime scene. Not through any alleys?”


    Melissa shook her head, sending red loops of hair spinning. “Taking shortcuts
    is a stupid thing to do when you look like me at that time of night. Why does
    it matter where I was? How will that help break the case?”


    Scharf dug at her phone clip on her belt. “We already broke the case.”


    Melissa’s eyes glittered with interest. “How?”


    “A new piece of evidence,” Scharf said casually and turned her phone to show a
    picture of the bracelet.


    Melissa swallowed. “You found it in the waitress’s locker, right? Who would have
    thought she did it?”


