- fmt: "\nBut I didn’t turn back when I noticed how our attempt at bringing joy back\
    \ was going. The band had switched to the theme from `Jaws`; one dancer in the\
    \ middle of the dragon’s body had slipped, almost taking the rest of the silk\
    \ dragon with him. One acrobat had fallen and was getting his ankle bandaged.\n\
    \nNo one’s face looked joyous. The bystanders jostled one another. The band fought\
    \ to keep in tune and on tempo.\n\nNear the barricades, I found Scharf. \n\n“Is\
    \ he coming?” she asked.\n\n`Sure` was on the tip of my tongue, but then I remembered\
    \ where we were. “I don’t know.”\n\nThe jostling among the bystanders turned into\
    \ a shove and an angry shout. I pulled on my hob magic, seeking the lingering\
    \ bits of happiness, and funneled them to the potential combatants. It worked;\
    \ they calmed, but the effort left me winded. And the crowds remained restless.\n\
    \n“It’s not working,” I said.\n\n“Well, we tried amusing a serial killer, and\
    \ that backfired spectacularly. We can’t force people to be happy.”\n\nI hung\
    \ my head. “We should’ve tried for confetti.”\n\n“Confetti is illegal in the District\
    \ of Columbia, but sure.”\n\n“We’re trying to throw a party in the most uptight\
    \ city in the country. This is a complete disaster.”\n\n“Happy thoughts, Orange,”\
    \ she said with the same stoic grimness she always had.\n\nMany in the crowds\
    \ started wandering away.\n\n“You’re right, a complete disaster would be too organized.\
    \ This is an incomplete mess.”\n\nScharf spun to look at me. “Orange. Tell me\
    \ the dragon is coming. He has to come.”\n\n“Okay, the dragon is coming.”\n\n\
    “Don’t tell me that if it’s not true!”\n\n“You told me to tell you… Never mind.”\
    \ I watched a juggler’s ball slip out of his fingers and whack the end of a trombone,\
    \ which mashed into its owner’s face, giving him a bloody, split lip. The band\
    \ went silent after a final squawk of surprise as his compatriots tried to help\
    \ him.\n\n“Right now, it might be a good thing he isn’t here,” I said. “This whole\
    \ affair might depress him more.”\n\nScharf’s phone rang, and she clapped it to\
    \ her ear halfway through the first ring. “Scharf.”\n\nAfter a few seconds, she\
    \ hung up and stood staring into the middle distance, unmoving, ignoring the growing\
    \ unrest in the crowd.\n\n“What is it?”\n\nSlowly, she pivoted to look at the\
    \ music shop as she said through gritted teeth, “It’s her.”\n\n“The waitress?\
    \ Where? I thought we established that watching `The Bachelor` is not proof you\
    \ are a murderer. Highly suspect, but not proof.”\n\nScharf shook her head. “Lee\
    \ just got the print report back on the epilepsy bracelet. We have her prints\
    \ because she wanted to embed with working agents. It was part of her background\
    \ check.”\n\n“What are you talking about?” I asked, and then the phrase registered,\
    \ and I realized Scharf wasn’t staring at the music shop and the dragon. She was\
    \ staring at the teashop and `Melissa`. “No. What?”\n\nScharf nodded. “It makes\
    \ perfect sense.”\n\n“It makes no sense at all. `Melissa` killed Rodger? Why?”\n\
    \n“For now, all we know is that Melissa’s thumbprint is on the back side of Rodger’s\
    \ medical alert bracelet that was not on the premises when we searched initially\
    \ but showed up in a waitress’s locker the day a true-crime podcast gets a tip\
    \ that she must have been involved.”\n\n“`Melissa` killed Rodger.” I shook my\
    \ head. “Why though?”\n\nScharf shrugged. “Her Uncle was slipping out of the limelight.\
    \ Forced to retire. Her book sales were taxing. The Restaurant Killer was locked\
    \ up. She was there that night, remember?”\n\nI closed my eyes. “She was at the\
    \ game.” I tried to envision the pretty, perfect redhead with her fake nails wrapping\
    \ her hands around a kid's throat. “It’s crazy.”\n\n“The dragon makes you do crazy\
    \ things.”\n\nI shook my head. “No. the dragon keeps you from doing crazy things.\
    \ Without him, you revert to the same asshole you always were.”\n\nWhen Carlisle\
    \ glanced out the window at us, Scharf pasted a huge smile on her face. “One way\
    \ to find out.”\n\n“What way?”\n\nShe finally looked at me. “You bargain, Orange.\
    \ You make a bargain.”\n\n“What could a deranged killer want from me? The bargain\
    \ has to balance.”\n\nScharf smiled. “I don’t know about you, but I know she’s\
    \ been wanting to interview me all week for the book.”\n\n“I read the book.”\n\
    \n“The `new` book.”\n\nI nodded, feeling a stirring of excitement that was so\
    \ much better than constant dread. “That could work. You tell her about yourself.\
    \ She denies the murder and I’ll know if it’s a lie.”\n\n“No, she has to say it.\
    \ She was on the crime scene after the murder; she has a very plausible explanation\
    \ for how her prints got on that bracelet. She’ll look like a terrible journalist,\
    \ but not a murderer. Reason number 456 why you don’t invite journalists onto\
    \ crime scenes.”\n\nI crossed my arms. “You have 455 reasons already?”\n\nScharf\
    \ stretched her neck, cracking it. “I’m sure I could come up with them.”\n\n“So\
    \ I am bargaining for her to say the truth, not just for me to know the truth.”\n\
    \n“Exactly.”\n\nMy neck tightened. “I’ve never done that before.”\n\n“You’ll be\
    \ fine.”\n\n`Happy thoughts, Orange.` I had 455 reasons why it, in fact, may not\
    \ be fine, but now was not the time to voice them.\n\nI spared a glance around.\
    \ The acrobats had started making a pyramid. The band had moved on to a song I\
    \ didn’t recognize. Mrs. Bao was playing along on her piano. Juya was still talking\
    \ with her fans. They would have to do the cheering up on their own for a while.\n\
    \nAs we got close, I was struck again by how young Melissa was. As we opened the\
    \ door to the chimes, she scribbled in her notebook.\n\n“Melissa, I have time\
    \ for that interview today. Now, in fact.”\n\n“Okay, good.”\n\nScharf didn’t sit\
    \ down. “How about over here away from the window?”\n\n“You don’t want to keep\
    \ your eye out?”\n\n“You think your uncle can’t handle it? Or Carlisle?” Scharf\
    \ asked and Melissa nodded.\n\nCarlisle smiled. “We got this. And if she comes,\
    \ we’ll get her.”\n\nI grinned. “I don’t think so.” All three of them looked at\
    \ me and I bit my lip. “I mean, good luck.”\n\nScharf led Melissa and me to a\
    \ four-person table across the counter. David swung by. “Can I get you something?”\
    \ he asked.\n\nScharf shook her head. “Later,” I said. “I was going to. My aunt\
    \ worked, like, all night.”\n\n“Is that what’s going out there?” Melissa asked.\n\
    \n“Let’s talk about the murder,” Scharf said, sounding stiff and forced to my\
    \ ears, but Melissa didn’t seem worried. David’s gaze bounced between us before\
    \ he ran back behind the counter.\n\nMelissa took out her notebook and glanced\
    \ at me. “What’s your role in this?”\n\n“PR,” Scharf said quickly. “She has no\
    \ information about the case.”\n\nMelissa nodded and scribbled as I mouthed, “PR?”\n\
    \nScharf’s glare of death told me to shut up, and I scholed my face to neutral\
    \ as Melissa looked up. “So first of all—”\n\n“We’ll begin with the body in the\
    \ alley?” Scharf asked.\n\n“Just a little background. You weren’t involved in\
    \ the original arrest of the Restaurant Killer, correct?” Melissa asked.\n\n“You\
    \ mean John Hastings, the man currently incarcerated for the original six murders?”\n\
    \nI chimed in, “Hastings isn’t the Restaurant Killer. If you’re right.”\n\n“I\
    \ wasn’t involved,” Scharf told her. “I was working at the Phoenix field office\
