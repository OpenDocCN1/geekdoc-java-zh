    \ covered in dirt. I read the plaque next to it. It had a picture of the artifact\
    \ that had been on the dais. A beautiful, mahogany table and chair set with elaborately\
    \ carved backs in a definite Celtic style. “Appalachian table and four chairs.\
    \ Circa 1900s.”\n\n“Look,” Lee insisted.\n\nWith Scharf, I leaned over the dais\
    \ to stare at the dirt to see a five-pointed star traced with elaborate knots\
    \ and swirls. I laughed; I couldn’t help it. \n\n`Scharf`, `Lee`, and a couple\
    \ of techs looked at me.\n\n“Sorry.” I pointed to the picture. “The backs of the\
    \ chair had the same design: a star amongst leaves. And knots.”\n\n“So this is\
    \ not a satanic ritual?” Lee asked. “A couple years ago a kid carved pentagrams\
    \ into his friend in a satanic ritual. I mean, it wasn't a satanic ritual, he\
    \ was just awful, but he said that’s what he was trying to do. I was still on\
    \ the beat.”\n\nI shook my head. This is one subject we had covered in my folklore\
    \ classes, probably to forestall this exact conversation when students found pentagrams\
    \ *everywhere*. “I mean, I’m just guessing here, but pentagrams are found in almost\
    \ every culture. Most of the time, they have pretty positive connotations.”\n\n\
    `Scharf` crossed her arms. “Like what?”\n\n“In Celtic mythology? No one knows\
    \ for sure because the druids didn’t write anything down. They think it’s a symbol\
    \ of the feminine. All stages of womanhood - maiden, mother, crone, light, and\
    \ dark. That’s just the Celts. You would get a totally different answer in India,\
    \ China, the Middle East, and Africa.”\n\n“That’s a lot of different options,”\
    \ Scharf said at last, and she looked around at other displays.\n\n“They all have\
    \ designs on them,” Lee said. “But this is the only one I recognized. We’re getting\
    \ pictures of it all. It might mean nothing if it was the designs on the artwork.\
    \ I’ll have to get the exhibit catalog. I didn’t think to match the dirt with\
    \ the art.”\n\nHe sounded annoyed that he hadn’t. He’d just seen what he thought\
    \ was the devil and panicked and called us. I hoped it wasn’t the devil. I hoped\
    \ there wasn’t a devil, in general. I was dating a demon, but we didn’t really\
    \ talk about who he worked for. Mostly `Jack` just cooked at his restaurant and\
    \ at home and occasionally helped me kill ghuls.\n\n“No satanic worship?” Lee\
    \ repeated. “I’m going to find a dead body staked to that table tomorrow?”\n\n\
    Scharf looked at me. I started to nod, but an uncharacteristic caution gripped\
    \ me. “I have no idea.” I tried to stop talking but could not help myself. “But\
    \ I don’t think so. I don’t know if this is…”\n\n“If this is your area of expertise?”\
    \ Scharf prompted.\n\n“Sorry. Like I said, your thief could just be stealing all\
    \ of this and messing with us by replacing it with dirt. It’s kind of poetic.”\n\
    \n“Sir!”\n\nWe turned to see a tall guy in a brown police uniform that looked\
    \ nothing like the dark blue `Metro PD` wore.\n\nHe waved from the stairs. “Sir,\
    \ there’s something you should see.”\n\nLee said, “This is `Adelman` from park\
    \ police.”\n\nI frowned. “What park?”\n\nThe young man pivoted again, flashing\
    \ me a gap-toothed smile that made him look younger than me. “The National Mall.\
    \ America’s front lawn.”\n\n“Cool!” I said when he clearly expected a response.\
    \ He grinned, and he pivoted to bound up the stairs.\n\n“This museum has its own\
    \ police?”\n\nScharf smiled. “All of the `Smithsonians’.”\n\nWe followed him out\
    \ of the exhibit around an old ship propped up on similar white pedestals. Apparently,\
    \ the robbers were only interested in arts and crafts. We walked back up wide\
    \ white stairs to the main foyer of the shuttered museum as `Adelman` regaled\
    \ me with the reason he joined the park police and not `Metro PD`.\n\n“I mean,\
    \ with the protests, I’m not sorry, you know?”\n\nI nodded vigorously. I’d been\
    \ way too close to the recent dragon-induced riots that had gripped the city.\
    \ Not that he knew that part.\n\nWhen we reached the foyer, I goggled at the three\
    \ banners dangling from the ceiling: one of the American flag, one with a neon\
    \ pink leotard whose antecedents weren’t clear, and one with an infinity knot\
    \ in spun glass stamped with the words special exhibit and St. Patrick’s Day.\n\
    \n“This way,” `Adelman` gestured us over to an unmarked door painted white to\
    \ match the walls near the metal detectors and huge glass entry.\n\nInside, a\
    \ guy in jeans and a sweatshirt stood at a bank of monitors behind an old-school\
    \ beige computer with a tricked-out black keyboard, plus a few TV remotes. He\
    \ looked at us through thick glasses and blinked owlishly. “Uh, just give me a\
    \ second.”\n\n`Adelman` was shifting from foot to foot with excitement. His body\
    \ was concave in his mud-brown uniform. This close, I could see the fuzz of his\
    \ beard as well. He really might be younger than me.\n\n“What are we going to\
    \ see?” Lee asked.\n\n“It’s weird,” `Adelman` said with relish.\n\n“*It* is?”\
    \ Scharf repeated with alarm.\n\n“It’s a tape,” `Adelman` said and flung out a\
    \ hand. “This is `Mr. Turner`, one of our digital security experts.”\n\n“And this\
    \ is my day off,” he offered.\n\n[The rest of the text follows the same logic]\n"
