    I knew not to be taken in. “I can’t snap for food, and I’m a goblin.”


    “Then what is he?”


    “That’s beside the point.”


    “No, that’s the entire point. What is he?” She asked this like she was asking
    for the weather tomorrow, her voice silky smooth and quiet. I wished she was yelling.


    People around us erupted in anger as the other team got the ball after another
    center stand-off and broke towards our net. The boy and his father in front of
    us leaped to their feet, so we both missed what happened as they reached it.


    The crowd booed as `Scharf tried to see around the dad. I didn’t bother. I couldn’t
    see or understand enough to know what was upsetting them. But even I could sense
    the mood had changed; the jovial celebration was gone. Eventually, the boos from
    the arena petered out and people resumed their seats, but they were watching tensely.


    Scharf leaned closer to me, watching the ice and the crowd in a surveillance sweep.
    “It doesn’t matter what I think of him. The fact that you even asked my opinion
    means you don’t trust him.”


    “I do, too.”


    “And you have no sense of self-preservation whatsoever. So I have to ask myself,
    why don’t you, a powerful magical creature, trust him? What is worse than a goblin?”


    “Worse?” I asked, stung.


    She winced but plowed on. “More powerful? Scarier? Answer the question, Orange.”


    On the ice, we had the ball, and then we didn’t have the ball and the other team
    did, and it set the crowd booing and standing again.


    Scharf was not distracted. “I think the answer to my question is also the answer
    to your question.”


    “I didn’t ask a question.”


    “What do I think of Jack? That’s why I’m here, isn’t it?”


    “Can you not be an `FBI agent` for two seconds, please?”


    Scharf scrubbed a hand through her short dark hair, leaving it askew. “Sorry.”
    The soft calm of interrogation was gone. Everyone took their seats, and we watched
    the players get nowhere for another minute.


    “Look, I don’t dislike him,” she said in her normal voice. “I even like him.”


    “Are those different?”


    “Yes. And he’s crazy about you. And he’s more powerful than you, on a number of
    levels, and that worries you. And so it worries me.”


    I slumped. I never would have thought that her objection would be the fact she
    thought I had an objection. *Well, you do, don’t you?*


    We watched each team try for the other side without success again. “Orange, have
    some fun, go to some hockey games. Maybe learn something about hockey first. Enjoy
    him. Just… I don’t know what. Just be careful.”


    “I’m not really…”


    “Careful? No, you really are not.” We shot at the net but missed again, and she
    waited until the cheer/boo cycle petered off before saying, “I’m not going to
    ask again, but I want to.”


    “What is he? I’m not sure, myself,” I lied, keeping the fact that my boyfriend
    was a demon from my lapsed catholic… Landlady? Crime-fighting partner? Jack wasn’t
    the only relationship I was struggling to define.


    “Also maybe learn more about him,” she added, “And please call me when you stay
    over there.”


    I’d been splitting my time between Jack’s and her couch. I smiled; one word for
    her was friend. “Deal.”


    Too late I heard the chime in my head signaling a magical bargain, meaning whether
    I liked it or not, I would find myself with a phone in my hand at Jack’s house.


    “Damn it, not a magic deal like…” I petered off.


    “Deal,” Scharf said firmly and settled in her seat with a smile on her face, truly
    relaxed for the first time that evening. “I feel better.”


    “Good for you.”


    Suddenly, for no reason I could see, a guy from our team threw down his stick
    and started screaming something. Scharf’s relaxation lasted two seconds. The crowd
    took up the chant. “Offsides. He was offsides!”


    The other team kept skating as the crowd started stamping.


    One player *tripped* another player with his stick and suddenly we were watching
    a boxing match, not a hockey game. At first, it was only two players, but one
    went down and more flew off both benches to go after the ones on the ice. Someone
    close to us screamed, “Ref, you blind idiot!”


    “Why is this going bad?” Scharf murmured, her right-hand inching across her chest
    towards the gun.


    “It’d be worse if you draw… what’s in your armpit,” I said, batting at her hand.


    A player from the opposing team in blue postured in front of the referee, and
    then he swung his stick, clocking the guy across the head. *That* silenced the
    crowd. For a second.


    Scharf leaped to her feet, all semblance of civilian enjoying a sporting event
    disappearing, but we were trapped floors above the ice.


    “Is that a legal move?” I asked, attempting to get her back in her seat by tugging
    on her coattails.


    “Assault? Battery? Possibly with a deadly? No, it isn’t!”


    Somebody from the opposing team decked that guy, and then the rest of the players
    piled on, both benches emptying onto the ice. Soon, it was an all-out brawl. The
    announcer called for calm, but nobody listened.


    As the pile on the ice heaved, the announcer called for calm, but nobody listened.


    The pile on the ice heaved, the announcer called for calm, but nobody listened.


    The pile on the ice heaved, the announcer called for calm, but nobody listened.


    The pile on the ice heaved, the announcer called for calm, but nobody listened.


    The pile on the ice heaved, the announcer called for calm, but nobody listened.


    The pile on the ice heaved, the announcer called for calm, but nobody listened.


    The pile on the ice heaved, the announcer called for calm, but nobody listened.

