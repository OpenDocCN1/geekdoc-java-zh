    I grabbed my father’s box. I had stayed up for eight hours straight, trying to
    get more buttons to depress. Eight stairs on each side had moved, and the lid
    had opened the same centimeter, but no more water had come out, and nothing else
    had happened.


    I sighed and placed it at the base of the stake.


    “I defeated the Lubber Fiend, and if there’s a goblin more powerful than him or
    anyone else interested in challenging me, they can try me.” I was the `Peallaidh`.
    Now I had to figure out what that meant.


    “Try me!” I spoke to the empty crawlspace and the gnome. I looked down at him
    and said, “That means you, too.”


    “Little gnomes don’t challenge the `Peallaidh`.” He rolled closer to the box and
    bowed to it. Then he stood up and saluted me with his police hat. He paused and
    waited.


    I vaguely remembered movies where people had to salute back, so I smashed my hand
    to my forehead. He nodded, and with another fart, started rooting in the dirt.


    “How would you like to be appointed guardian of the `Peallaidh’s` box?” I asked
    him.


    He looked at me with glowing plastic blue eyes. “Oh, yes.”


    As he stood stiffly at attention, I searched around for something official to
    give him, but the crawlspace was empty except for `Scharf’s` canoe equipment,
    which I''d banished from the living room. I grabbed an oar and bopped him carefully
    on both shoulders, aping a ceremony I’d read in *King Arthur and His Knights of
    the Round Table*. “I appoint thee guardian of the box.”


    He took up his post with solemnity.


    “You don’t have to stay down here,” I said.


    “But I am the guardian.”


    I felt bad about what I’d started but better about my chances of keeping the box
    safe. I brushed off my hands on my jeans and turned to the crawlspace entrance:
    a trapdoor into the garden. No stairs led into the house directly.


    Which was how I ended up tramping through three inches of mud at the side of the
    house. The ice storm had broken when the dragon laughed. Now, days later, a few
    spikes of green stuck out of the ground, although that was undoubtedly the gnome’s
    doing; most of the houses on this street were still stuck in deep, slushy, muddy
    winter.


    As I picked my way through the puddles, I dug out my cell phone and dialed `Jack`,
    my heart thumping.


    “Jack.”


    “Hey, it’s `Orange`.”


    “Oh, so now you’re calling? You know, most people who forced their boyfriend to
    leave town would send them a message that they never wanted to see them again.”


    “Boyfriend?”


    “Can we have the talk and start saying ‘we’ like normal people who date?”


    I rolled my eyes and propped a hand on my hip. “The `Peallaidh` and a random demon
    with the power to flatten the city between us? Absolutely, let’s behave like normal,
    well-adjusted people.”


    “At least one of us is.”


    “If you don’t want me to hang up,” I said, “don’t tell me which one of us you’re
    referring to.”


    “Grilled cheese sounds lovely.”


    “You know, when I saw you at Union Station, I thought you were the coolest person
    alive, but I didn’t realize you have no game whatsoever.”


    `Jack` scoffed. “There are so many more important things than game, `Orange`.
    If you would get over here, you could enjoy them.”


    “And arrogant to beat.”


    “And you love it. Tonight? Seven?”


    “Fine,” I said, feigning annoyance.


    I could hear his smile over the phone. “I’ll pick you up?”


    “Sure,” I said, my mouth crinkling.


    “We’ve succeeded at the whole dating thing. And we arranged a dinner without lighting
    anything on fire or killing a magical creature or ourselves.”


    “That’s huge for us.”


    “I’ll see you soon.”


    It surprised me to feel my cheeks heating. I’d missed him. “You okay? Did you
    really go to New York?”


    “Well, at first, I thought you were being paranoid and trying to break up with
    me in a bizarre, `Orange` way, but then I got a migraine and contemplated how
    great it would be to barbecue the restaurant’s hostess, who had overbooked one
    table. As soon as I realized I wanted to extinguish a human being, I got on a
    train. My migraine disappeared at the Maryland border. So I guess I have you to
    thank for that as well.”


    I took a deep breath. “Thank you for leaving town, `Jack`.”


    “Thank you for warning me. It’s almost like you care.”


    “Oh, no,” I said, “We had the label discussion, but we aren’t having the caring
    discussion right now. I can’t handle two discussions in one phone call.”


    “Fair enough, but now you know it’s coming.” Why did that statement fill me with
    such dread? And was I really surprised to realize that I was the panicked one
    in this relationship? `Jack` had jumped in with both feet the moment he saw me;
    it should flatter me. But no, it worried me. I tried to put that aside yet again.


    “Fine,” I said. “I may or may not care about you, but I’ll see you tonight.”


    “That’s as good as I’m going to get, isn’t it?”


    “You’d better believe it.”


    Throughout the last half of our conversation, I was standing in a mud puddle,
    slowly sinking. I hung up, pulled my feet out, and sloshed my way to the front
    of the house.


    And then I froze and mentally shouted, “Don’t notice me!”


    `Scharf` stood on her front porch, facing a stranger with her hand on her belt
    where her gun normally rested. It was one of her few tells when she was nervous.
    Her feet were planted, and her jawline was white.


    I wanted to get closer but realized I’d track muddy prints up to her porch, so
    I snuck along the empty flower bed to get close enough to hear the guy she was
    confronting.


    On the surface, nothing was threatening about him. But he was some kind of Fed.
    I was beginning to recognize the look. The ill-fitting suit, red tie, buzz cut.
    He packed a few extra pounds over the requisite muscles. His face was ruddy and
    carved with laugh lines, which I didn’t expect. But he wasn’t laughing now.


    “What do you want from me?” `Scharf` asked.


    “I want an introduction. You can reach their world.”


    “What world?”


    “We call it the unexplained. We’re collecting more and more evidence that the
    simple laws of physics aren’t sufficient, nor are those of law enforcement.”


    `Scharf’s` stance widened a touch. “Then you’d better talk to Congress about making
    some laws.”


    “It wasn’t a homicide.” `Scharf` crossed her arms. “And maybe I’m just good at
    my job.”


    She leaned forward on the balls of her toes, preparing for action.


    “One of them trusts you,” the Fed said. “I don’t want to mess with that—far from
    it. I want its help.”


    It took me a second to realize by “it,” he meant me.


    `Scharf’s` eyes unerringly met mine over his shoulder, and she asked, “What do
    you have in mind?”

