  raw: 'Something thumped. “I’m sitting on the couch, so no.”


    I sighed. “I’m at Juya’s.”


    “How am I supposed to believe that, either? Never mind. We have an interview this
    morning with the restaurant manager and some other witnesses.”


    I waited for a second to see if she would correct herself. When she didn’t, I
    repeated, “*We*?”


    “Yeah, *we*. Isn’t this what you bargained for?”


    “But I thought you didn’t need my help.” I grabbed the pickup to haul myself upright
    and the tree for leverage to get to the sidewalk.


    “I need to know if anyone is lying.”


    This was one thing I could bargain for: the truth.


    “Oh, so now I’m helpful,” I huffed, just a little.


    “Orange, I’m sorry about yesterday.” She trailed off, and I said nothing. “It
    was a rough night. Let’s just move forward, okay?” Only Scharf says things like
    “move forward,” in real life.


    “I’m sorry too,” I said after a few seconds, “about the dumpster and everything.”


    A branch cracked above my head, and I ducked out from under it and landed on my
    butt again.


    “You were trying to help. I know that.”


    I sighed. “Where should I meet you?” Assuming I could get anywhere in this storm.


    “I’ll pick you up.”


    “No!” I did not want to wait around Juya’s for Scharf to make her way to me. “No,
    it’s too far north. Pick me up at the Metro in Chinatown.” My orange line materialized
    at my statement, pointing south. I glanced towards her townhouse once before I
    followed it, salving my shrieking conscious with the fact that I had the bargain
    to fulfill with Scharf, and Mert couldn’t have been in better hands. The branch
    crashed down where I had been sitting moments before in a cacophony of ice, wood,
    and water.


    <<<>>>


    I sat in the front seat of Scharf’s new Buick and turtled down into my orange
    leather jacket, debating whether to break the silence. She had brought it with
    her and handed it to me when she pulled alongside the metro entrance. It had belonged
    to her ex, but I’d inherited it when I got here from California with nowhere near
    the wardrobe necessary to deal with the DC winter. It seemed like weeks since
    I’d been truly warm.


    She maneuvered out from under the gate and down the street of restaurants. The
    rain had calmed a little, though her wipers were still on high. Through the water,
    the streets looked even worse in the light of day. Sports memorabilia, bottles,
    food, lanterns, and trash littered the sidewalk and pavement. Boards were nailed
    to various shop windows above piles of glass. It would be a while before the scars
    of the riot faded.


    “So. Jack. Demon,” she said as she pulled up in front of *Pasta Joe’s.*


    “Oh, hell no, we are not having that conversation right now.”


    “*Hell* no?”


    I clenched my fists without realizing it. I loosened my fingers, horror drowning
    my sudden anger. *Are you going to punch everybody who annoys you?*


    “Please, no,” I mumbled.


    Something in my voice must have alerted her because she turned off the car but
    didn’t move. “Are you okay?”


    “Absolutely!” I said with manic cheer and pawed at my door handle.


    “Orange.”


    My hands stilled and I turned to her, forcing calm and a smile. I wasn’t the one
    laying battered on the floor after a fight. “I’m okay.”


    She just stared at me for five more seconds as tried to keep my face still.


    “Should I go invisible for this?” I asked a little desperately.


    She took a slow breath and nodded. “Yeah. With BAU involved, I can’t be bringing
    in consultants.”


    “What’s BAU again?” I asked.


    “Behavioral analysis. Probing motive, patterns, anticipating behavior, that sort
    of thing.”


    “And that gobbledygook means?”


    “Psychotherapy for psychopaths.”


    I laughed. “That was actually funny.”


    She smiled for a moment and my shoulders finally relaxed too. Last night had been
    strange; we’d been at each other’s throats. I loved to annoy her, but I hadn’t
    meant to anger her. More than her apology, her attempt at humor put us on solid
    ground.


    We got out of the car. I clutched at the hood to stay upright on the ice and get
    to the curb.


    “Careful with the car!”


    I let go. Her old department-issued car hadn’t survived our last case, so this
    was a new requisition. Scharf had called it a girl car when she saw it because
    it was the color of an eggplant, a deep purple, but she could barely explain what
    happened to the other one, so she hadn’t protested.


    “Who are we interviewing?” I asked, looking down the row of shops: bank, music
    shop, the *Long Yinyue Teashop* where David worked, and *Pasta Joe’s*, the sight
    of the murder.


    “Alibis,” Scharf said. “I want alibis from everybody and their dogs so we can
    cross them off the list.”


    “And if they don’t have an alibi?” I asked.


    “That’s where you come in.”


    “Bargains are better than alibis.”


    Scharf started towards the door of the teashop. If someone didn’t have an alibi,
    they could deny the murder and I’d know if they were telling the truth or not.


    “Agent Scharf? Where are you going?”


    Scharf pivoted slowly. Three people walked towards us from a huge black SUV: Carlisle,
    Scharf’s too-beautiful colleague in violent crimes; Fuller, the profiler extraordinaire;
    and his niece, Melissa, with her notepad.


    I froze before I remembered I was invisible. “You didn’t tell me the cavalry was
    coming.”


    “It’s a joint investigation,” Scharf muttered to her belt buckle. “I don’t know
    what the journalist is doing here.”


    “Scharf?” Fuller demanded.


    “I’m going to interview David Bao, the first witness.”


    “No, no, no. We have to talk to the manager,” Fuller said, waving his hands with
    every word. “We have to find the new employee. That is the Restaurant Killer.
    He stays six weeks before he strikes.”


    “It’s standard procedure to interview the outcry witness,” Scharf said.


    “We don’t have time for standards!” Fuller retorted, and Melissa scribbled madly.


    “How about I get his alibi, just real quick, and I’ll call you if it’s suspect?”
    Scharf asked.


    “Good plan,” Carlisle said and gestured for Melissa to precede him toward *Pasta
    Joe’s.*


    “Miss Fuller can’t accompany us,” Scharf said with genuine shock.


    “It’s fine,” Melissa said and dug in a slinky purse wrapped crosswise across her
    chest. “I have a pass. I have full access to the investigation. For the biography.”


    Scharf looked like she wanted to protest, but eyed Fuller. “The bureau is vetting
    the manuscript before it’s published?”


    “Of course!” Melissa replied, her head bobbing like she was stuck to the front
    dash of a car.


    Scharf sighed and said, “We’ll meet back here to compare notes in a few.”


    Melissa tucked a wet curl behind her ear. “That’s great. And if I could just get
    a quick interview about your background…”


    Scharf ignored her and opened the door to the teashop, which had a handwritten
    sign that said, “Closed” on it above an older handwritten sign that said, “We
    have coffee.” The door creaked and hit a tinkling charm that sounded ominous.


    Scharf held it open, and I slipped behind her into the cloying scent of dried
    tea. The shop was a long, thin room with a counter and workspace down one side
    and narrow tables along the other. Pots, cups, and jars of green and black dried
    leaves covered both long walls. A battered aluminum urn sat on the counter with
    a sign that said, “Coffee - $2.”


    I leaned against a half wall next to the door, and the wall twanged.


    I leaped back and bumped into Scharf, who tried to pretend she’d planned on stepping
    sideways.


    “Don’t touch anything,” Scharf muttered and moved forward.


    “We’re back to that?” I replied, but she didn’t turn. I leaned over the wall to
    see a keyboard and realized I’d leaned against the back of a low piano. I hurried
    to catch up with Scharf.


    She approached the counter where David Bao and an older couple sat on stools in
    front of it.


    “My name is Agent Laura Scharf with the FBI violent crimes office here in DC.”


    I hoped my attempt to calm David down last night with magic hadn’t lingered. He
    looked catatonic.'
