    “You said only the killer knew about all that. You and the killer knew. And the
    original investigators.”


    “It’s not my first choice to go accusing my own people.”


    “Fuller knew best of all,” I pushed.


    “I know that.”


    I sat up. “And he was in the neighborhood that night. Remember, he was at the
    game?”


    She looked at the ceiling for an answer. “The Restaurant Killer made his name.
    Why would he call that into question?”


    I considered grabbing another scone, but we’d already cleaned up half the tray,
    and my stomach protested. “Yeah, but he loves this: being back in action, having
    everyone jump to his tune. You certainly jumped high enough.”


    “What does that mean?”


    “Nothing!” I stuffed a scone into my mouth.


    “Where is the motive? Why do it?”


    I swallowed and almost choked. “Either he was wrong back then, or he’s wrong now.”


    “Let’s ask him.” Scharf started out of the kitchen.


    “Whoa! You want to ask an FBI agent if he killed somebody?”


    “Not him, Hastings.”


    I shuddered. “The serial killer?”


    She stood half in and out of the kitchen, hands on her hips. “Did we get the right
    guy or not? One bargain, and we’ll know for sure. Come on.”


    “But—”


    # 12


    “They’re not locking you up,” Scharf said, her eyes on me as I stared at the razor
    wire and squat cement building with a sign that read *Chesapeake Bay Maximum Security
    Prison*.


    “It could have been,” I said, still not moving. They’d arrested me and interrogated
    me when they suspected me of a plot to assassinate the president.


    “It wasn’t you,” Scharf said, starting towards the towering walls.


    “It could have been!” I repeated.


    “If you dwell on the bullets that miss you, you’re letting them hit.”


    I scrambled after her, walking gingerly on the ice, and murmured, “Only you could
    spout philosophy with bullets.”


    “What?”


    “Nothing.”


    At the first gate, she unclipped her `Glock` from her belt and handed it to the
    guy behind the window. “We’re here to see John Hastings.”


    Heart pounding, I held up my driver’s license. We were trying out a new trick
    since Scharf said an FBI agent would never interview a suspect alone so I couldn’t
    go invisible.


    I transformed my driver''s license into an FBI badge with the same glamour I used
    to adjust my appearance. Although I could easily make myself look like a normal
    human being without orange-tinted skin or floppy ears, it was way, way, way harder
    to glamour objects. As the guard read off my name, I prayed he wouldn’t reach
    for the license. If my fingers left it, the game would be up.


    Fortunately, he didn’t seem that worried about people trying to get into prison,
    and another guard soon escorted us into the first of a series of barred enclosures.
    The gate slamming behind us left me gasping for air, but several orange lines
    sprouted in various directions, which was reassuring. I could get out of here
    anytime.


    The itch down my spine grew as we tunneled deeper into the facility and there
    were fewer and fewer orange lines showing me the way out. We went through a series
    of gates and doors that all locked behind us.

