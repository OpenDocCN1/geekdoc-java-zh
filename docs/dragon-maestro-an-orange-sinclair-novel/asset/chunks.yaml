- fmt: '

    My second instinct was to scream for Scharf, but what was she going to do? What
    would she say when she saw his blue skin and jagged ears? Did illusions last in
    death? If someone found me dead, would they see an orange, bushy-haired, pointy-eared
    goblin or my current peach complexion, smooth blond hair, and normal ears?


    I heard footsteps and turned around again, magic at the ready. Scharf and the
    profiler Fuller walked into the alley.


    While the FBI charged in, I stood invisible, surrounded by puddles and a dead
    goblin.


    “I had him,” Fuller said. “I could’ve broken him.”


    “That was an interview, not an interrogation,” Scharf replied quietly.


    “What is the difference?” Fuller asked, genuinely puzzled.


    They stopped just short of the dumpster, and I took a slow step closer to the
    body with the vague plan of making us both invisible, at least until Fuller skedaddled.


    “So, there was no new employee?” Scharf asked. I took another step.


    Fuller threw his hands up. “No new employee.”


    Carlisle and Melissa entered the alley, and I rolled my eyes. Fortunately for
    me, they only had eyes for each other.


    “And Joe had an alibi?” Scharf asked.


    Fuller sighed. “Damned airtight. He was at a bar near his house with three friends
    watching the hockey game. One of them is a judge in Alexandria.”


    “That’s pretty airtight,” Scharf said mildly. “So it wasn’t Joe.”


    Fuller shook his head. “The victim was a total wimp, so it could have been anyone.”


    “Excuse me?” Scharf asked in a dangerously mild voice.


    “He had fits,” Fuller said.


    “Epilepsy,” Carlisle added. “He had epilepsy and was not very strong. And he’d
    been alone in the shop.”


    Scharf turned to pace away from the agents, closer and closer to the hand, though
    she hadn’t seen it yet. I inched closer.


    She turned back and I took another step. “Don’t go near any of the employees again.”


    “We have a murder to solve, sweetheart,” Fuller said. “We can’t do that if we
    can’t talk to the potential murderer in case his itty-bitty feelings get bruised.”


    Scharf froze for two seconds, and I braced for an explosion, but she took a deep,
    slow breath. “Do not interview the employees again.”


    “He lawyered up anyway.”


    Scharf looked down, shaking her head in disgust. And froze.


    I winced. I wasn’t fast enough. She took two quick steps toward the dumpster.


    I held out a faint hope she hadn’t seen him until she flipped her cell phone to
    her ear. “Mrs. Henderson?” she said, speaking to the secretary of her office.
    “Deploy the team and contact Metro. We’ve got another body in the alley.”


    Fuller spun, a look of glee on his face. “He’s escalating!” He bent towards the
    corpse. “Exactly to pattern!”


    Scharf looked incredulous. “How can he keep to his pattern exactly and escalate?
    Never mind.”


    She crouched down to get a better look at Everglades’ deformed face. Carlisle
    enfolded Melissa in his arms and turned her away. “Don’t look, Mel. Don’t look.”


    Scharf reached towards the dumpster.


    “Stop!” Fuller cried.


    Scharf froze. “What?”


    “We need to take in the scene.”


    Scharf stood up. “We need to call the morgue. We need to post the scene. Again.
    We need to knock on doors.” She stopped. “Not you. Other people need to knock
    on doors. It’s the middle of the day. We don’t know long this body’s been here.”


    I couldn’t help feeling a little relieved that her heroism had worn off. Scharf
    got a closer look at the goblin’s hand. What did she see? I was going to go to
    her and ask her. Pressure was building in my brain to keep my word. We’d made
    a bargain that I would help her with supernatural cases in exchange for a place
    to live. This case had taken a definite turn toward the supernatural. Notice me.
    didn’t even jump; she just sighed.


    “Why didn’t you say something?” she whispered once she’d checked that Fuller was
    busy pontificating about the audience. “You were behind me. And it’s….”


    Scharf nodded and looked almost compassionate; she’d seen my first dead body and
    freaked completely. Which was why I didn’t want to tell her. “I knew him.”


    “What?” she said, a little louder.


    “Melissa isn’t used to this,” Carlisle said. “She didn’t have to see this. It
    didn’t have to be in her head.” Scharff twisted around. “Absolutely, please get
    her out of here!” Instead, with gulping breaths, Melissa walked closer. She didn’t
    look scared. She looked almost gleeful. “What do you see?” Fuller said, his hands
    fisted under his chin. “Are you seeing the crime in your mind’s eye?” “Yep. That’s
    it. I’m totally seeing the crime.” Scharf looked at me, and if looks could kill,
    there would be two dead goblins in this alley instead of one.


    “Oh, it gets better,” I said. “Better than that?” Scharf muttered. “He’s a goblin.”


    She grabbed tufts of her short, dark hair with two fists and yanked as hard as
    she could. “Looks like your serial killer was a magical creature,” I told her.
    Fuller crouched on the ground to examine the goblin’s body; evidently, the stopping
    phase of the investigation had ended. When he didn’t run screaming from the alley,
    I figured they really couldn’t see what I. To me, he looked grotesque and far
    from human: deep-blue skin, claws, and long ears. The huge purpling bruises on
    his neck and his swollen face pointed to what happened.


    Scharf walked away and called back, “I’m going to meet the units at the front
    of the alley.” Carlisle snorted. “By now, they ought to know the way.” Scharf
    gave a high-pitched laugh that sounded nothing like amusement and jerked her head
    from side to side, beckoning me to her. “We should stay away from this block.
    It’s deadly,” I said, turning to walk backward to get another glimpse of the hand
    on the ground, which was all I could see of the goblin from the mouth of the alley.


    “I wish.” Scharf glanced back, cursed, and dug her phone out of the holder on
    her belt. She pressed it to her ear and repeated, “I wish.” She often spoke to
    her phone when I was invisible, so it wouldn’t seem like she was talking to herself.


    “I know him,” I said. “We can solve this and—” “Orange, you’re no longer a consultant.
    You’re a witness. Walk me through exactly how you know him.” “What are you talking
    about? I just met him yesterday!” “If you knew the victim and saw him yesterday,
    you might have witnessed the events leading up to the crime. You could be called
    to the stand. You could be a suspect again.”


    All humor fled, and every muscle in my body tightened. The last time I’d been
    a suspect, I’d ended up in FBI custody getting interrogated about a presidential
    assassination plot. “I didn’t kill him, Scharf.” She wheeled away from me. “I
    know that.” I jogged so I could face her again. “Do you?” She was silent for a
    long moment, and the tension in my body ratcheted higher, cranking my shoulders
    to my ears. “Tell me what happened,” she said matter-factly. I crossed my arms.
    “Should I get a lawyer first?” She didn’t laugh. “That’s your right, of course.”
    I coughed. “Seriously?” “You weren’t on my couch last night.” “I was at Juya’s!”
    “In the middle of the night?” “She needed help. I was baking, for God’s sake.
    Ask her. Since I apparently need an alibi.”


    I wanted Scharf to say she didn’t suspect me. Instead, she took a breath and repeated,
    “Tell me what happened.” I considered being petulant. But half a dozen crime-scene
    investigators were about to descend on the alley again, and Scharf was the only
    law enforcement officer I could tell. “I swear I’d never seen him before last
    night. He confronted me on the subway.” “Accidentally or deliberately?” “How can
    anyone accidentally confront someone?” She rolled her shoulders. “Did he follow
    you onto the subway or was the meeting an accident?” “Oh,” I nodded, trying to
    quell my panic and concentrate. “Deliberate.” “And?” “He said, ‘I challenge thee.’”

