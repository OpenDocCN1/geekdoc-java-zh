  raw: 'Osman retreated, and I tried to figure out what on earth had happened.


    I had reached for my magic, something that had glowed steadily in my body since
    I’d bargained for it when I’d fought the djinni. I’d traded having my magic at
    my beck and call in exchange for…


    “My life.”


    I sank into a wet puddle on the floor in shock. I had bargained my life for my
    magic. So the only conclusion was that I hadn’t been alive the past few days.
    I hadn’t slept; I hadn’t worked and had snuck around doing nothing I enjoyed or
    wanted to do. Or even needed to do. Goblins were homemakers. We guarded hearths
    and played with the minor magics of the world. It was the stuff of life, and I’d
    ignored all of it. This wasn’t living.


    I fought the despair that welled up. Goblins were challenging me everywhere I
    went; dead bodies were piling up, and an unseen force was making everybody angry.
    DC was supposed to be a fresh start, but I seemed to slide ever deeper into a
    hole.


    I looked around at the piles of outerwear, clawing my way out of that hole. *I’m
    not going to die here, doing this.*


    # 11


    The app dinged, and I flew out the door, thrilled to see a huge black Chevy Tahoe
    through the sleet.


    I’d forgotten about the ice.


    My feet slid out from under me, and I slammed into the ground. I lay there, stunned.
    I’d fallen the same way hours before and had barely felt it. Now, human-weak,
    the back of my head felt squishy. I couldn’t breathe, and my tailbone screamed.


    I heard a car door slam and a shout before Hassan Bishara’s face came into view.
    He was an Afghan native who’d served as a translator for Scharf’s unit there and
    now worked for a rideshare company. He was about the same age as Scharf, with
    his black hair in a trendy cut, now sopping wet, and a puffy black jacket that
    was quickly getting soaked.


    “Orange, you okay?”


    “Ow.”


    He grabbed my hand, and I tried to sit up but gasped and collapsed down when my
    diaphragm protested. Fortunately, the movement kickstarted it and precious, freezing
    oxygen filled my lungs.


    On the second try, he got me to my feet, and I fought the whirling swoop of my
    stomach. “Ow.”


    We limped to the passenger side of his SUV, and I sank into the heated seat with
    a moan. Hassan slid behind the wheel and peeled off his coat. He folded it neatly,
    water and all, and put it at my feet. Under the coat, he wore a T-shirt with the
    Star Trek insignia on it. It was his favorite show.


    He had just the beginning of crow’s feet around his eyes that usually crinkled
    when he laughed but were now squeezed in concern. “You wanted to go to Scharf’s,
    but maybe I’ll take you to a hospital?”


    “No! No, I’m a goblin, remember? This will pass.” As soon as I located my magic.


    Finally, he turned the key and started into traffic. I watched the rain make little
    rivers down the front passenger-side window, keeping one eye out for a hulking
    red giant. I tried to think, but my brain was mush in my skull.


    “How’s everything with you?” I asked, mostly to forestall more worrying.


    “Everything’s ice.” I thought he was speaking metaphorically, but he gestured
    at the windshield. “They say it’s the storm of the century.”


    I peered out the window at the driving rain and sleet. “The century isn’t that
    old yet.”


    “It was like learning to drive all over again. My daughter, Amina, is *having
    a ball.* She loves the ice.” Although he spoke with an Afghan accent, his English
    was almost perfect. He collected American idioms like Scharf collected weaponry,
    or I collected recipes, relishing each turn of phrase. Having a ball was a new
    one.


    “That makes one person in this city,” I said.


    “Yesterday she showed me that if you open your coat and stand on the ice, the
    wind will blow you across the yard.”


    I frowned. “That sounds safe.”


    “At our last home in Afghanistan, it was hardly safe to leave the house; I try
    to applaud when she stretches her wings, but it is terrifying to watch.”


    “Maybe have her wear a bike helmet or something?”


    “That’s a good idea.” As he turned a corner, the car lost traction for a second.
    “We’re good!”


    “We’re good?” I *reached* for the car with my magic, but all I got was a headache
    as I clung to my seat. A moment later, the wheels caught, and we straightened
    out. I gently rotated my head on my neck, trying to ease the pounding.


    “Four-wheel drive,” he said, his voice thick with tension.


    I didn’t know much about four-wheel drive, but it seemed as useful as a bucket
    on the Titanic in this storm.


    Realizing I was wringing my hands in my lap, I sat on them. To distract us both,
    I said, “Knock knock.”


    Hassan glanced at me. “I say ‘Who’s there?’ Correct?”


    “Yes.”


    We went for another block when he turned to me again. “Oh, I’m sorry. Who’s there?”


    I grinned. “Interrupting cow.”


    “Then you say ‘Moo,’ right? Too late, Scharf already told me that one. She calls
    you a menace.” I couldn’t tell from his flat tone if he was joking or not.


    “Forget it!” Even my jokes were backfiring. Now I knew something was seriously
    wrong.


    “What are you two working on?” he asked at the next stoplight when he could examine
    my face more carefully, his eyes looking so old in his face.


    “Murder downtown.”


    Hassan nodded. “I heard about the riot. We still can’t do a drop-off at the arena.
    Nasty business. *Your* business?”


    Sometimes I forgot that under his happy-go-lucky exterior, a combat veteran lurked.
    After Scharf’s deployment, her unit had helped arrange a visa for Hassan to come
    to the States with his family since the Taliban wanted everyone he’d ever interacted
    with dead.


    “Um…”


    When I didn’t continue, he shot me a look that said, *Don’t screw with me, Orange*.


    “Half of it is *my* business. Or a third of it. Depending.”


    He turned forward but kept an eye on me in the rearview mirror. “Explain.”


    “Well, we have one totally normal murder victim, except the guy who did it is
    already locked up. And then we have one victim—who’s like me. And we have one
    potentially totally different dude, probably a dude, messing with the rain and
    everybody in DC, potentially turning them homicidal.”


    He gaped at me and started when someone behind us honked. He put his foot on the
    gas. “And Scharf is out there without you?”


    “Um…” I cleared my throat; his loyalty to Scharf was absolute. It extended to
    me only as a courtesy to her. “It’s not the kind of threat that I could help with.
    In fact, I am mostly making things worse.”


    “That is not true.”


    My phone erupted in an old-fashioned ringtone. The screen said, Astrid. “Sorry.”
    I hit the button to accept. “Are you okay?” I asked before she could say anything.


    “Something’s wrong.”


    The bottom fell out of my stomach. “Who else is dead?”


    “Who else? Who first? That’s not a funny joke, Orange. The only thing that’s dead
    is these recipes!”


    “What are you talking about?”


    “The ingredients spoiled. I was selling them on campus, and people are asking
    for their money back.”


    “What?”


    “One guy almost hit me.”


    “*What*?”


    “Orange, take this seriously. We can’t sell these.”


    I’d never baked anything bad in my life. Juya called it a part of my magic. People
    liked—no, loved—my food. Always. “I don’t understand.”


    “They weren’t off. They were awful!”


    The back of my neck itched as something occurred to me. “How close is Howard University
    to Chinatown?”


    Astrid took a moment to answer. “Well, Chinatown is on H Street, right? Howard
    is on Euclid.”


    I waited for more. “Yeah, that doesn’t help me.” Even after being in DC for two
    months, anything not connected to a crime scene or the main Metro stops eluded
    me.


    Hassan murmured, “Twenty blocks north.”


    “There are three alphabets worth of horizontal streets,” she explained. “Literally
    the letters A to W, then two-syllable words like ‘Euclid’ and ‘Fairmont,’ and
    then three-syllable words, mostly presidents.”


    I thought about that for a second. “What?”


    “Why does it matter? I’m trying to have a serious conversation about our business.”'
