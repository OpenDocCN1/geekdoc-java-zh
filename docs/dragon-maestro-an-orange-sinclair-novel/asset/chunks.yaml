    I gasped. Could that heartbroken, traumatized kid seriously strangle his friend
    and then run for help? I couldn’t imagine it.


    “But we kept those details back from the press. He doesn’t have any connection
    to law enforcement that I can find to learn those details. But we’re looking.”


    Lee scoffed. “True crime podcasts, the trial itself, it was all over the internet!”


    Scharf shook her head. “No, it’s too perfect—the body, I mean. You have to see
    it. There are details we didn’t even share with you guys, let alone the media.”


    “Now that’s not very nice, holding out on us.” Lee nudged her biceps with his
    elbow and walked deeper into the crime scene as they chatted. I moved to follow
    them, but Scharf held up a finger behind her back.


    “You okay?” Lee asked, cocking his head at the finger.


    She dropped her hand. “Just testing the wind.”


    “Why?”


    Scharf raised both eyebrows and glanced at me. “Don’t you know how *wind* can
    affect a crime scene?”


    “In an alley?”


    She cleared her throat to say something else when a loud voice from behind us
    announced, “This way, sir.”


    Everyone turned to see three newcomers enter the alley. Two of them were not dressed
    for a crime scene or the weather. The third was another familiar face.


    I sighed. James Carlisle was an FBI agent who worked with Scharf in violent crimes.
    I referred to him as the underwear model because he was beautiful, blond, and
    chiseled, but he’d also undercut Scharf by blaming her for things that had gone
    wrong in their last case and didn’t look so beautiful anymore.


    “Who are they?” Lee asked Scharf.


    “That’s Carlisle, out of my office. I don’t know the others.”


    The FBI didn’t have regular partners. They had squads where the agent in charge
    of a case would pull in whoever else was available, but she ended up with Carlisle
    a lot. He’d only been assigned to her field office a few months before, straight
    from the FBI Academy, and she was sort of training him.


    He was currently simpering at the other two with him, which was new. I also called
    him the underwear model because humility was not one of his… values.


    One was an older man, as buff as the rest of the agents, which told me he also
    probably worked for the FBI. His full head of silver hair was raked away from
    his face and seemed impervious to the sleeting rain.


    His companion was a woman at least half his age with a helmet of dark-red hair
    that came from a bottle. Carlisle kept his hand hovering at her lower back as
    he escorted her down the alley.


    The old dude scanned the entire scene with keen eyes. As his gaze paused on me,
    my heart flipped over. But his gray eyes swept on. Once they did, I exhaled slowly.


    “Yes,” he said. “This is the killer’s regular hunting grounds.”


    Nobody moved. The investigators, including Scharf and Lee, just stared at the
    man.


    Lee muttered, “I didn’t know Baltimore stretched so far south.”


    “And you are…?” Scharf asked.


    “Agent Richard Fuller with BAU, and this is Melissa, my niece. She’s writing,
    well, she’s writing about my life and my 29 years in the FBI. I trust her presence
    at the crime scene won’t be an impediment?”


    The blood left Scharf’s face, her only reaction for a second before she jumped
    forward.


    “Agent Fuller! You still work cases?” she said with very un-Scharf enthusiasm.


    “I haven’t in a couple of years. They wouldn’t even wave the retirement age for
    me, but if the Restaurant Killer’s still at large… Well, I had to leave Quantico
    and the classroom they’ve stuck me in and make sure you young sprigs don’t drop
    the ball.”


    “It’s so amazing that the killer has struck again!” Melissa said, struggling to
    keep her little notebook dry. “I’ll need to interview everyone onsite! For the
    book.”


    “You are?” Fuller asked.


    “Scharf,” Carlisle said. “The one I told you about who works with me.”


    “*Violet* crimes, right?” Fuller asked. I snickered. The N had fallen off the
    door of Scharf’s office and now even the Bureau was calling it violet crimes.


    “It’s actually… Yes sir,” Scharf said quietly. “It’s an honor to meet you.”


    “Show me this body!” Fuller said but did not wait for Scharf to move and strode
    by her, his niece trotting behind him.


    As we followed, I asked, “BAU?”


    Scharf whispered, “Behavioral Analysis Unit. Think Jodie Foster in *Silence of
    the Lambs*.”


    I gulped, fighting my tightening shoulders and throat. This was spiraling way
    beyond a regular murder. Scharf jogged to get ahead of Fuller. “Let me take you
    through the crime scene, Agent.”


    “Please, call me Rick.”


    “Rick,” Lee said, his voice flat as he followed them as well. It was clear he
    wasn’t nearly as impressed with this dude as Scharf seemed to be. “How’d you get
    here so fast?”


    “We were in the neighborhood this evening! Melissa and I were at the arena to
    attend the game that precipitated the riot.”


    Melissa picked her way daintily down the trash-strewn alley in her high heels.
    “Sometimes you just get lucky.”


    I frowned. “How incredibly lucky that somebody died. Just the best luck.”


    My phone rang, and Scharf looked at me with fear in her eyes, but no one else
    did. I snapped, “They can’t hear it!”


    Like my clothes and anything I carried, any electronics stayed unnoticed too.


    I checked the screen and put the phone to my ear. “Jack! Where are you? Did you
    go out that window?”


    “Looking for you!” Jack said. “Did you get out of the riot?”


    “Scharf and I are okay. We got out.”


    “Where are you? I’ll come get you.”


    I spun, taking in the rain-soaked alley and the officer unspooling crime-scene
    tape across the entrance. “Home. I went home already,” I said, wanting to feel
    guilty about lying to him, but I just didn’t. “Sorry. Scharf said you could take
    care of yourself.”


    “Scharf did, did she?” Fortunately, he sounded amused rather than angered.


    “Jack, you’re a demon. You expect me to buy that you were in any kind of danger?”


    Scharf had been saying something to Fuller, but stopped talking and looked at
    me in horror. I grimaced and sloshed away from her. The demon was out of the closet.


    “This isn’t about me,” Jack said. “I was worried about *you*!”


    “I’m a goblin! True, I don’t pack the same punch you do, but you were worried
    about me? Seriously?” It outraged the feminist half of me that he thought I couldn’t
    take care of myself; the other half was flattered that he wanted to protect me.
    I sighed. “Thanks, I guess.”


    “When can I see you again?”


    I grinned. “You’re terrible at playing hard to get.”


    “Why? Easy is much more fun.”


    “Give me the download,” Fuller said.


    “I’ll call you,” I told Jack, then hung up.


    Scharf gestured around the alley. “As you can see, we cordoned off the crime scene,
    and we’re going to preserve everything in the alley. The Restaurant Killer always
    left the rope he used to strangle his victims and his clothes in the dumpsters
    out back. We haven’t found those yet.”


    “He always did like to play with us,” Fuller said, trying to suppress his glee.


    Lee and I rolled our eyes. This dude was positively *thrilled* to be standing
    in the alley with a strangled teenager.


    “We’re going to get somebody in tomorrow to drain the dumpster,” Scharf added
    “Looks like there are at least two fresh bags in there, but with the rain coming
    down now—”


    “Not tomorrow!” Fuller said. “If we wait until then, vital pieces of evidence
    could be lost.”


    Carlisle, still hovering around the redhead, said, “Excellent point, sir.”


    “We know how to work a scene,” Lee muttered.


    Scharf cleared her throat as she turned to Fuller. “We weigh that against what
    we might miss in the dark and the rain. We can take the whole dumpster to our
    lab and comb through it all.”


    “Absolutely not. We have to go through this tonight, Agent. Get in there. Now!”


    “Scharf? Get in there. Now.” Carlisle grinned, his hand on Melissa’s waist. She
    scribbled madly in a notebook that was getting soggier by the second.'
