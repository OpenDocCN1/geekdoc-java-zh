  trans: "\n我掏出手机，翻看着歌单，选了我能找到的最轻快的一首歌。就是那首在冰暴风雪期间都在播放的歌子。我按下“播放”，震动的节拍声响彻了整个商店。他猛地睁开眼睛，盯着我的手机，发出一声哀吟。\n\
    \n极度痛苦中，他的身形变得模糊，我向后跳了一步，撞乱了那排金属笛子和其他管子的架子末端。一支笛子落在地上，发出一声刺耳的叮当声。\n\n我的手机屏幕碎了，手机也在我手中坏了。我掉掉了那些锯角锋利的碎片。我依然能看到柜台后的那个老头，他只有一条腿，拄着拐杖。但每当我眨眨眼睛或歪一歪头，一条长着红鳞、耳朵簇着毛、张着大嘴巴、眼睛巨大的盘曲巨蛇就会出现在我面前。\n\
    \n我冲出了商店。\n\n# 19 \n\n随着更多的乐器撞倒在地，我大喊道：“好吧，也许我没法让他开心起来！”\n\n“让谁开心起来？”沙尔夫站在她和鲍太太并肩的拱门处问道。“里面发生了什么？”\n\
    \n我回头了一眼。最后，嘈闹声安静了，一堆乐器在拱门处停了下来，挡住了路。\n\n“我们必须帮忙！”鲍太太说着，朝着拱门冲过去。\n\n“我们得离开这里！”我抓住住沙尔夫的胳膊和鲍太太的手，试图把她们拉出视线。当沙尔夫没有跟着我走时，我用魔法强迫她向前移动。幸运的是，麻将局已经结束了，商店已经空了。\n\
    \n“发生什么了？”沙尔夫问，她终于从我的手中挣脱出来，在大门口停下。\n\n“是他，”我压低声音，像舞台上的耳语，等待着一条龙冲过拱门。当他并没有出现，也没有了更多的乐器撞倒时，我对上了她的眼睛。“这一切。天气。他的愤怒。他是一条龙，他似乎有点……我不知道怎么说，不开心？”\n\
    \n沙尔夫掏出手机。“我可以在十分钟内让特警进到这里。”\n\n鲍太太惊恐地转向她。“你不能对一种基本力量动用特警！”\n\n沙尔夫停顿了一下。“你知道那条龙的事。”\n\
    \n鲍太太双手紧握，直到指节发白，但她的目光平稳而清澈，说道：“是的。”\n\n“你知道他在做这些！”沙尔夫说。\n\n“不！”鲍太太坚持道。“我的意思是，我曾想……我很担心。担心我们的离开会产生什么影响。新租户想开一间做临时纹身的沙龙房。也许那让他不快了？”\n\
    \n我眨了眨眼。“抱歉，你刚说是`临时`纹身吗？”\n\n她苦涩地点了点头。“我们想留下来，但我们留不住。建筑租金涨了三倍，想喝正宗茶的人越来越少。”\n\n\
    “这太棒了，”我低声说。在终于品尝过他们最简单的真茶后，我不知道自己以后还能喝下别的什么。“而且我不认为是因为那个。这事是从农历新年开始的，还记得吗？他是这么说的！这不是新年。也许他不喜欢游行？”\n\
    \n“他不喜欢游行？”沙尔夫用手捋了把头发。\n\n鲍太太身体僵硬，我记得她曾是委员会的一员。\n\n“我确定那场游行很美妙！”我惊恐地挥动着手说。“也许他也想搬家。你是对的。”\n\
    \n“我不明白他为什么留了这么久。”鲍太太再次紧握手指。她看起来在用两双手克制着情绪。“他跟着一个想看新世界的来到来到这里。”\n\n“新世界？你说的这么久，是指几个世纪吗？”我问。\n\
    \n鲍太太左右点了点头。我不知道该如何解读这个手势。\n"
