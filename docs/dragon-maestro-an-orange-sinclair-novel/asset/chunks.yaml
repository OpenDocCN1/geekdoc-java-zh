    When somebody elbowed me in the kidneys, I screeched and pushed on it with magic.


    Scharf shook her phone. “Hello?”


    “I don’t think that helps,” I told her.


    “No service. Too many people.” She cursed again and put the phone back on her
    belt.


    The bald guy beside me deliberately pushed me away, and I said, “Okay, buddy.
    That’s it.”


    For a second, anger overtook panic, burning my lungs. I tightened my fists, readying
    to push back at him.


    “Orange, get us to the window,” Scharf said quietly, her hand on my fist.


    I stretched my fingers, shocked by my sudden anger. Had I just gathered magic
    to shove an innocent bald guy out of a building? I shook my hands and my head.
    We *had* to get out of here.


    With the burst of magic I’d summoned, I used my short height to my advantage and
    started shoving sideways, pulling Scharf along behind me as people reacted to
    the unexpected direction and let us through.


    In less than a minute, we were out of the crush and pinned instead against the
    intact window next to the broken one, our backs against a floor-to-ceiling banner
    of a pop star I didn’t recognize mid-concert. Another banner of a tall dude in
    red with a basketball flapped in the broken window.


    I fought it aside to glance down. There was no one splattered on the pavement.
    I sagged into the casing and jumped away when a jagged piece of industrial glass
    grazed my biceps.


    “I think it was Jack!”


    “Who was Jack?”


    “Who jumped. Nobody’s dead!”


    “What *is* he?” Scharf glanced at the ceiling. In prayer? Old habit?


    “Never mind that. Now we’re farther away from the stairs.”


    A drunk dude in the opposing team’s jersey shoved me. A loud crack behind me doubled
    my heart rate. I had to dig deep to keep him from going out the broken window
    and me *through* the other.


    I clenched my hands and shoved the crowd and me away from the windows, determined
    not to let anyone innocent die, wondering whether Jack broke the window on purpose
    and bailed without me, endangering all these people.


    I shook off the thought, not liking my answer. Scharf swept the popstar banner
    aside to reveal a spider web of cracks exactly Orange shaped.


    “We have to get out of here,” Scharf said, preternaturally calm, her eyes on the
    crack.


    I looked at her and then at the open window, blinking against a spray of freezing
    water.


    “You’re made of earth,” I told Scharf to convince her and me. “And you’re much
    smaller than a car.”


    A few weeks ago, I’d lifted Scharf’s sedan when we’d gotten pushed off a bridge.
    I wiped my sweaty palms on my jeans and ignored my nerves and the voice in my
    head explaining all the ways this was different.


    *Don’t screw up*. I grabbed around her arms in an awkward hug.


    “Orange, what are you doing?”


    “Being stairs.”


    I told everyone around me to forget I was there. I knew I would go unnoticed,
    but I still hadn’t tested whether anyone would notice what I was holding. My clothes
    always disappeared with me, but would another person?


    We’d find out. Right now.


    I met Scharf’s eyes, which were six inches above mine: dark brown—almost black—showing
    alarm and confusion, but also trust.


    I jumped and called on my magic to get us both out the window.


    Scharf instantly put her arms around me. We jostled, and I said, “Don’t move!”


    There was a rough moment where I almost tangled us in a string of red lanterns,
    but I added a little more juice to bob over them. No one screamed and pointed
    at the floating people, so I guessed I was right, and we were both invisible.


    I lowered us toward the ground forty feet below as fast as I could without breaking
    Scharf. I would not have the juice to do this for long.


    Icy rain plastered our hair to our heads and my beautiful dress around my torso.
    When a pellet of ice hit my forehead, I realized it was worse than rain: a disgusting,
    dangerous sleet the East Coast weather people called a “wintry mix.”


    “Orange, there are people down there,” Scharf said in an aggressively calm voice
    she used when we were in real trouble.


    I was pleased that she was almost impossible to shock because I’d forgotten about
    the crowds. I opened my eyes and ended up with my head under one of her armpits,
    my face smashed against her weapon as I attempted to see the ground. Yep. Completely
    covered with people. Spotting a little slice of the roof, I tried to aim for that.
    But manipulating the earth in my body had a lot more to do with falling slowly
    and a lot less to do with flying. We were going down.


    Scharf said, “Go visible.”


    “What?”


    “Visible! Now!”


    I let go of the “unnoticing,” and people shrieked.


    “Move, move, move!” Scharf shouted. A hole opened below us, and we plopped onto
    the sidewalk outside the arena into a greasy puddle.


    We untangled ourselves as I gulped for air and watched people fleeing the main
    doors of the arena with bruised and bloody faces.


    “Come on,” she said. “Let’s go.”


    She took off north, and I shouldered my way through the crowds after her up Seventh
    Street dodging shouting people, overflowing trash bins, and the detritus from
    the parade and the game.


    We passed under an ornate gate over the road in vivid jewel tones of aquamarine,
    maroon, indigo, and gold that marked the center of Chinatown and turned right
    onto a side street full of restaurants. A few were Chinese with their picture
    menus glowing in their front windows, but there was also an Irish Pub and a few
    other American chains.


    I pointed behind us and said, “Your car’s that way!”


    Scharf looked behind us at the crowd rippling away from the arena. “You want to
    wade through that? I was going to go around the block.”


    I nodded. “Better plan.”


    I shoved my hands in my pocket, shivering in my wet dress. I had an orange leather
    jacket that would have been perfect for the weather, but I hadn’t wanted to wear
    it because I didn’t know what color the opponent had been. I didn’t know much,
    but I knew you did not wear the wrong color to a game. And it clashed with the
    dress, which seemed like a minor problem now. The dress was way too flimsy for
    this storm.'
