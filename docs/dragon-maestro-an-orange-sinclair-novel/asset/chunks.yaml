    Scharf opened the cabinet with her smoothie ingredients, dug behind them, and
    came up with a package of store-bought sandwich cookie knockoffs.


    I gasped. “You have store-bought cookies in this house?”


    She flicked one to him and he toppled to the ground and stuffed it in his mouth.


    “Save me from goblins,” Scharf said as she put them back.


    “I am a gnome,” the gnome said solemnly. “The bargain has been fulfilled.”


    “And gnomes,” Scharf added. “I’ve had those for years, okay? They’re probably
    expired. They belonged to my ex.”


    I gasped again. “You fed him a two-year-old, store-bought cookie?!”


    Scharf looked at the gnome splayed below us. The cookie looked gigantic sticking
    out of his tiny mouth. “He likes it. Do you want to try opening that now?”


    I’d forgotten the box in my hands. I shook my head and pressed the lowest stair
    and then the next. One after the other, they sank into the wood. Nothing happened.


    I dropped to the ground and pressed every bit of carving I could get my hands
    on. “They’re buttons. That’s why it hasn’t opened.”


    Scharf arched one eyebrow. “That’s good, right?”


    Unfortunately, I couldn’t get any of the others to depress. The whole lid and
    every side were full of carvings, abstract swirls, a cat, a bird, a dog, and a
    man and woman. And stairs. The two people were dressed in what looked like Victorian-era
    clothes with a bustle on her dress and breeches on him. None of it budged.


    I went back to the stairs.


    *Click, click, click, click.* I tugged on the lid, but nothing happened.


    “Orange, relax!”


    “It won’t open.”


    “Orange, the other side has stairs!”


    When she turned the box, I saw another set of stairs, a mirror image of the ones
    on the right. When I pressed them, nothing happened until I clicked the top one
    and then the one below. You had to go up one set of stairs and down the other.
    I tried the lid again, and it moved a centimeter.


    I put the box down, so I had more fingers to press at carvings. “Help me!”


    I crouched so I could get my eye right up to the crack. I couldn’t see into the
    black interior.


    When I shook the box, it gurgled. “What the…”


    A wave of water spat out and drenched my face and the floor. And it just kept
    coming.


    Scharf dove for it.


    “Where are you going? That’s mine!”


    Gushing water out of the three sides, the box rattled in her hands as she threw
    it into the sink.


    I scrambled past her and stuck the stopper in the drain.


    “Good idea,” she said, and we watched as the flow slowed down and stopped.


    I grabbed a cup from the sink and dipped it into the water to hold it up to the
    light, thinking, *This is my legacy?*


    I was about to toss it back in the sink, but then something weird happened.


    The water changed. Or I changed. I *felt* it in the glass. Like I felt the earth.
    I *pushed* on it like I would manipulate earth.


    Nothing happened.


    “What are you doing?” Scharf asked?


    I blinked, reaching for the water in the sink with my weird sense of magic. Was
    it magic? I’d never been able to manipulate water before.


    “Orange?”


    I sagged against the counter, exhausted again. Impossibly more tired than when
    I’d come home.


    Scharf’s hand touched my shoulder blade. “You okay?”


    I straightened and forced nonchalance into my voice as I said, “Well, now we know
    what’s in the box.”


    I crouched and carefully tried to open the lid again. It only budged a centimeter
    again, and no other water came out.


    I wiped the water off my face and wrung out my hair.


    The pitter-patter of little feet jump-started my pulse until I remembered the
    gnome. He skidded to a stop under the table.


    “It’s raining, raining on my home,” he crooned, scowling. “Bargain breaker.”


    He dove for the floor, cracking the floorboards.


    “Stop that!” Scharf dove for him and got a hand around his ankle before he made
    it to the crawlspace beneath her house.


    “Maybe we should get him a trapdoor?”


    I took a hesitant sip from the glass. The water was cold and clear, but I caught
    the slightest hint of moss or something wild in it. I sighed. “Thanks, Dad.”


    Halfheartedly, I pushed some more spots on the box, but if every bit of the carvings
    was a button, I could push them in different orders for my entire life and not
    find the right combination. Reluctantly, I handed it back to the gnome.


    “Can you put it back?”


    “What will you—”


    Without answering, I went to the smoothie cupboard, pulled out the ancient cookies,
    and thrust the entire package at him.


    He held the cookies and the box, his eyes as round as two coins in his head. “It’s
    too much!”


    “It really, really, isn’t,” I retorted.


    He bent for the new hole, and I turned him towards the door. “Not that way!”


    He farted and harrumphed and rolled away, back to his wet kingdom. One day, the
    entire floor of Scharf’s house was going to fall through. First ghuls had burned
    through it, then the gnome punched through it, and now we’d flooded it.

