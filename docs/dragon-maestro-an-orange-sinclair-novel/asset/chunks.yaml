    “Deal,” I began, “You answer my questions, um, truthfully, and I’ll…” I had no
    inspiration whatsoever for what he could want.


    “You’ll what?”


    “I’ll leave,” I said, naming my fervent wish.


    He sniffed. “Good deal.”


