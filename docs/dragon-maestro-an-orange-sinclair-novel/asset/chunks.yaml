    “Crap.”


    # 9


    I stood just inside the door to *Pasta Joe’s.* After a few more thrown chairs,
    Joe’s anger seemed to burn out, and he started cleaning up with muttered curses.
    He did not seem inclined to leave the room.


    So I had the option of magically opening the door, going through the small, shattered
    hole in the front window, or heading for the back where the dead body had been.


    Reluctantly, I chose door number three and headed for the back. There were swinging
    red shutters into the back like in an old-fashioned saloon, and I slid under them.
    The thin, galley-style kitchen was spotless, with a stove and a sink on one side
    and bare steel countertops on the other. At the back, there was a tiny hand-washing
    sink beside metal coolers and dry storage with plates, cutlery, huge brown bags
    of pasta, and rice on metal shelves. The body was gone.


    I knew the body was gone, but I still shook as I dodged around another metal shelf
    full of takeout containers and flimsy utensils that had not been a part of the
    original restaurant design. Gingerly, I stepped over the spot and opened the back
    door. I closed it just as carefully and escaped into the alley.


    While the storefront had faded in daylight, the alley exploded into technicolor
    debris. Trash, some from last night’s investigation and some from the beginning
    of time, spilled out of multiple maroon dumpsters and coated the rippling asphalt.
    The potent scent of rot assaulted my nostrils.


    I jammed my hands into the pockets of my orange coat and trudged towards the street.
    It was still raining steadily, and the ground was treacherous. Half a dozen pools
    of water were quickly turning to ice. My California blood hadn’t enjoyed all the
    snow when I first got here, but freezing sleet was infinitely worse.


    When I saw a blue hand poking out from beside a dumpster, I thought it was a prop
    or costume at first. Upon closer inspection, however, I realized the body it was
    attached to wasn’t garbage.


    Worse, I recognized him.


    Heart accelerating, I bent down to get a better look at my first goblin challenger,
    Everglades, lying dead in a muddy puddle. His eyes bugged out of his head, which
    sat at an awkward angle on his bruised neck.


    Last night, Everglades had jumped off a moving train into the street without a
    scratch. And now here he was dead, choked to death by someone’s bare hands. The
    marks on his throat looked suspiciously finger-shaped.


    Horror melted into fear, and I spun with a splash, my gaze ping-ponging around
    the alley as I gathered magic, terrified that his killer was lurking. I could
    *see* many small bits of earth: rats, bugs, and wind-blown, rain-washed trash,
    but nothing the size of his attacker.


    I was alone.'
