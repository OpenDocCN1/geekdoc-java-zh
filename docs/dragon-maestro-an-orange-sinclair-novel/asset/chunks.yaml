    derelict building I’d come upon earlier. I pounded on her front door.


    No one answered, so I pounded again. I tried to remember what time it was but
    failed. I’d gotten no sleep last night, and the fatigue was getting worse.


    Finally, Osman opened the door. He was dressed in the same jeans and sweatshirt.
    It was still the same day. It felt endless. He didn’t jibe me about being unreliable
    or riling Juya and for a second, I forgot why. *Mert.* I looked around frantically.


    “He’s gone,” Osman said carefully. “Said something about jumping off a bridge.”


    I sagged in relief.


    “You’re happy about that?”


    “If he’s jumping off bridges, he’s fine.” *I hoped.* I stuffed the shame somewhere
    deep. “I have to talk to Juya. I don’t have time for witty banter.”


    He stepped aside promptly, his eyes empty. I used to hate how he poked at me and
    never seemed to trust me. This deference was infinitely worse. I ducked into the
    house and then turned to him.


    “Osman, I’m so sorry.”


    “*Pasa nada.*” He didn’t meet my eyes. “It’s nothing.”


    After a second, I twitched away, not having any idea how to fix this, and made
    for the stairs.


    I knocked on Juya’s door and opened it without waiting for a reply from within.
    She lay there, wan and listless, dozing against her lace pillows. Someone had
    pulled her hair into a low ponytail, so she looked less like the invalid I’d seen
    before, but she was still terribly sick.


    I crouched next to her bed. “Juya.” I gently shook her shoulders. “Juya, please.
    Something’s wrong with the rain.”


    Juya’s eyes cracked open. “Orange, is there something you need?”


    “No! I’m fine.” But I wasn’t fine. Something was magically killing goblins and
    screwing with the rain. Or worse, somebody was magically killing goblins and somebody
    else was messing with the weather. “Juya, please, I know you’re sick, but can
    you tell me if there’s something in the rain that’s wrong? Is that why you don’t
    feel well?”


    Her eyes slipped closed, and my heart ached at the sight, but I couldn’t afford
    to let her rest.


    “Juya!” I exclaimed.


    Her eyes flew open once again, and she said, “I should have thought of it. I could
    kick myself.”


    This time, when she closed her eyes, I didn’t disturb her. I could feel *something*
    in the air, like a storm gathering. Finally, it dissipated, and she opened her
    eyes all the way, hunching to sit up. I helped her, stuffing a pillow behind her
    thin shoulders.


    “There’s magic in the water,” she said, before unleashing a string of phrases
    in an ancient language. As she did, the room vibrated.


    Osman burst in but stopped short when he saw Juya.


    “What is she saying?” I asked him.


    He shook his head. “I’ve been trying to learn it, but it’s not connected to English
    or Spanish. She might be the only one alive who still speaks it.”


    Whatever she was saying, it was working.


    Until Osman said, “I don’t think Juya even knows what she’s saying half the time.”


    The energy gathering faltered.


    “Hush! Don’t listen to him. You know what to do!” I told her, but the flow of
    words slowed and the electrifying atmosphere around us calmed. It rattled the
    bones of the house until Juya sank deeper into her pillows.


    “He’s pushing on the rain. I am in your debt again.”


    I smiled. “The scales are so unbalanced that I’ve given up keeping score.”


    “How did you know?” she said weakly. “About the rain?”'
