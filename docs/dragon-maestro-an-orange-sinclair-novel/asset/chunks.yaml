    Grinning, she stood with her arms crossed and her feet far apart. “I’m enjoying
    this a heck of a lot, actually.”


    I gritted my teeth, turned, and tried again. When my earth magic manifested, it
    had been out of sheer necessity. I’d been running for my life from a fire-breathing
    nightmare, and I had literally run through a wall.


    “Push me off or something.”


    Scharf’s jaw slackened. “No.”


    “Then do something else threatening!”


    She shook her head. I looked out at the spray. No change.


    A gasp came from below me. Scharf pointed above my head. I looked up and said,
    “What?”


    “Now that’s a superb skill to have.”


    “What?” I repeated.


    “Look up!”


    “I am!” And then I saw it. The rain parted around me as if I were carrying an
    invisible umbrella.


    Laughing, I raised my hand to stick my fingers in the cold spray. When I tried
    to widen the umbrella, it quickly disappeared.


    I did have water magic, but it had a radius of about one foot. I extended my hand,
    this time pushing at the water, and managed to push it farther, but as soon as
    I dropped my hand, the bubble returned to a foot away from my head. “If you ever
    need to levitate some water a few inches, I’m your girl.”


    “You can’t move the falls at all?”


    A giggle escaped. “Not a bit. Seriously.”


    I collected a bit of water in my hands. “If this is the great power of the *Peallaidh*,
    I’m the world’s wimpiest water goblin.” Another cackle burst out of my throat.


    Scharf laughed too, then sobered up. “I shouldn’t be laughing. This really isn’t
    funny.”


    I climbed off the boulder, quite relieved to be staying dry and still laughing.
    “What on earth is this gonna do for me? How can I pull down buildings with the
    earth but be so wimpy with water?”


    “You’re asking me?”


    “Well, I can’t ask Google.” I sighed. “Oh, God, I’m going to have to go talk to
    Mrs. Henderson again.”


    “What would she know?”


    “Never mind!”


    Scharf guffawed. “Why are we laughing?”


    “I have no idea. Maybe because we’re totally screwed!”


    “That’s it!”


    She fisted her hands on her knees so she could get some extra air.


    I snorted again. “We’ve got some unknown magical creature who can freeze the entire
    city, and I can almost keep the rain off my hair. This is going so well!”


    Scharf stood up. “We’ll pull it out of the hat, Orange.”


    “What hat?”


    “We’ll find a way. We always have.”


    I felt even more hysterical. “By ‘always,’ you mean once before. We defeated one
    djinni, who *wanted* *us* to defeat him, by the way.”


    Scharf burst out laughing again. “Oh, yeah! He *wanted* our help! That’s how we
    defeated him!”


    “We’re so dead!”


    She let a high-pitched giggle out that I’d never heard before. “We’re so dead!”


    I wiped tears from my eyes, then flicked them from the edge of my fingers and
    sent them spiraling into the rain. Sure enough, two feet from my body, I lost
    track of them.


    Scharf goggled. “That was impressive!”


    “I know, right?”


    Scharf hiccupped.


    “I feel drunk!” I said.


    “No, I feel high. Drunk is sad,” Scharf said, glancing at her weapon hand like
    it didn’t belong to her.


    “Scharf! You got high!” I said with a giggle.


    “Didn’t!”


    “You just said!”


    “I said I don’t like alcohol,” she said primly, but I knew what I heard. “It was
    only for law enforcement purposes.”


    I rolled my eyes. “There’s no law enforcement purpose to a trip. It’s okay. You
    can be human once in a while. I won’t tell.”


    Scharf froze, all humor leaching from her face.


    “What?”


    “Inhuman.”


    I jerked, stung.


    “Not you!” she said and paced away. Her energy was so different away from the
    storm. “What he said.”


    “I remember,” I said, fighting the urge to cross my arms in defense against the
    hate in his eyes.


    “Not that part. The part about drunks.”


    I scratched my head, replaying the interview. He’d said something about drunks,
    but what stuck in my mind is that last look and laugh.


    Scharf turned to me. “You said to him that the victims didn’t stick a fork in
    their own eyes.”


    I forced my brain back beyond that final look. “And he said they *could* have
    because they were drunks and inhuman.”


    She scrubbed at her forehead and had to pace again. “We missed something *huge*.”


    “Hey, you don’t have to rub it in my face!” I said. “I’ll remember the next time
    we interview a serial killer not to ask them to emote.”


    “No, not you, the FBI. Fuller missed something huge in the original investigation!
    I need the autopsies.”


    “Why?” I asked and had to dash after her when she started towards the car. “What
    are we looking for? What did he miss?”


    She stopped. “Hastings sure hated drunk people.”


    “Inhuman,” I echoed, shuddering.


    “Maybe he hated them enough to eliminate them. Maybe enough that it was a part
    of his motive. His victims *had* to be intoxicated.”


    At last, I got it. “And if all the victims were three sheets to the wind, but
    Rodger wasn’t…”


    “If they weren’t what?” Scharf asked.


    I blinked. “Three sheets to the wind. Drunk? You’ve never heard that expression?”


    “Never. If they were, um, three sheets to the wind, this is a copycat.”


    I had been with her until that last statement. “Why?”


    “It’s Rodger himself. Conscientious kid at work on a super busy day, taking powerful
    epilepsy meds you can’t mix with alcohol. The killer could fake everything else
    about the scene, but not his blood alcohol level.”


    It was at moments like these that I realized investigating is as much art as science.
    We couldn’t absolutely know why Hastings had done what he’d done, or that Rodger
    wouldn’t drink, but it made a lot of sense. “If Hastings only killed drunk people,
    Rodger was a copycat.”


    “Which means John Hastings should be in jail. I need those autopsies.” She started
    walking again at twice her normal pace, which was saying something.


    I jogged after her, fighting to believe her. We’d have our answer if she was right
    about Hastings and right about Rodger and right about the motive and right about…


    I took a last look at the waterfall behind me. Out of Scharf’s sight, a few tears
    leaked down my cheeks. I let my umbrella go so they could mix with the rain. We’d
    gone toe to toe with a serial killer and released the *Peallaidh’s* special water
    powers, and that was it. I could make an umbrella and he maybe only killed drunk
    people and Rodger maybe wasn’t drunk.


    There was no trace of my laughter in my voice as I whispered, “We are so dead.”


    # 14


    As Scharf drove at her ice-reduced pace into the city, and barren black trees
    gave way to cement buildings, I fell asleep. When I woke up in downtown DC, I
    tried not to read it as a terrible sign that I could sleep through Scharf driving
    in an ice storm. That pointed to a level of exhaustion I hadn’t experienced before.


    As I watched the red and silver taxis, Metro buses, and fancy black SUVs drive
    by, I sighed. Most people were taking the subway if they could stay out of the
    ice. Nobody had the tires for this. “Even if you can prove Hastings didn’t do
    it, we still have to prove who did.”


    Her fingers whitened on the steering wheel. “You called it.”


    “I did?”


    “Law enforcement. Not just any copycat, a copycat that could mimic the exact details
    of the crime scene.”'
