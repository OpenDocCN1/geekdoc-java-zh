- fmt: '

    I dug out my phone and scrolled through songs and picked the most upbeat song
    I could find. The one that had played even during the ice storm. I hit “play,”
    and the thumping beat filled the shop. His eyes flew open, and he stared at my
    phone and groaned.


    In his anguish, his form grew fuzzy, and I jumped backward, rattling the end of
    a shelf of metal flutes and other pipes. One flute hit the ground with a discordant
    clang.


    My phone screen cracked, and the phone broke in my hand. I dropped the jagged
    pieces. I still could see the old man at the counter, with his one leg and his
    crutches. But if I blinked or tilted my head, a coiled serpent with red scales
    and tufted ears, a gaping mouth, and gigantic eyes grew before me.


    I ran out of the shop.


    # 19


    As more instruments crashed, I shouted, “Okay, maybe I can’t cheer him up!”


    “Can’t cheer who up?” Scharf asked from the archway where she stood with Mrs.
    Bao. “What happened in there?”


    I glanced back. Finally, the din quieted, and a pile of instruments settled in
    the archway, blocking it.


    “We must help!” Mrs. Bao said, surging towards the archway.


    “We have to get out of here!” I grabbed Scharf’s elbow and Mrs. Bao’s hand and
    tried to pull them out of sight. When Scharf didn’t move with me, I used magic
    to force her along. Fortunately, the Mahjong games had ended, and the shop had
    emptied.


    “What’s going on?” Scharf asked, at last jerking free of my hand and stopping
    near the front door.


    “It’s him,” I said in a stage whisper, waiting for a dragon to come barreling
    through the archway. When he didn’t and no more instruments crashed, I met her
    eyes. “All of this. The weather. The anger. He’s a dragon, and he’s kind of, I
    don’t know, upset?”


    Scharf dug out her phone. “I can have SWAT in here in ten minutes.”


    Mrs. Bao turned to her, aghast. “You can’t SWAT a fundamental force!”


    Scharf paused. “You knew about the dragon.”


    Mrs. Bao clutched her hands together until her knuckles turned white, but her
    gaze was level and clear as she said, “Yes.”


    “You knew he was doing this!” Scharf said.


    “No!” Mrs. Bao insisted. “I mean, I wondered... I worried. What our leaving would
    do. The new renters want to put in a parlor for temporary tattoos. Perhaps that
    upset him?”


    I blinked. “I’m sorry, did you say `temporary` tattoos?”


    She nodded miserably. “We wanted to stay, but we could not. The building rent
    tripled and fewer and fewer people want proper tea.”


    “It’s fantastic,” I whispered. Having finally tasted even their simplest real
    tea, I didn’t know if I could ever drink anything else. “And I don’t think it
    was that. This started on the Lunar Near Year, remember? That’s what he said!
    That this was no new year. Maybe he didn’t like the parade?”


    “He didn’t like the parade?” Scharf ran a hand over her hair.


    Mrs. Bao stiffened, and I remembered she’d been on the committee.


    “I’m sure it was a lovely parade!” I said, waving my hands, horrified. “Maybe
    he just wants to move, too. You’re right.”


    “I don’t know why he stayed so long.” Mrs. Bao gripped her fingers again. She
    seemed to be holding herself together with two hands. “He followed a child here
    who wanted to see the New World.”


    “The New World? By so long, you mean centuries?” I asked.


    Mrs. Bao bobbed her head from side to side. I didn’t know how to interpret the
    gesture.


    “And he hasn’t flambeeded anyone in all that time?” I said slowly, unable to stop
    myself from asking.


    That dried her tears; she even smiled a tiny smile. “I forget all the terrible
    things your dragons do in myths. To us, dragons are luck and fortune. Kui brought
    music to the world. Dragons in China are not fire-breathing. We are blessed to
    live in his sphere of influence. Do you think I would be the best piano teacher
    in the city if I didn’t live where I live? It is a matter of Kui’s benevolence.”


    I chewed on my lip as I thought that through. On the one hand, a harbinger of
    luck and fortune sounded great, but what happened when you made him angry? I swallowed.


    “Did he know Rodger?” Scharf asked casually.


    Mrs. Bao gave a little half-shrug. “Rodger came in here, but I didn’t see him
    go next door. Kui doesn’t get close to anyone. That’s not… I don’t know. He did
    not hurt Rodger. He could hurt no one. That’s not—possible.”


    I scratched my chin. “How do we cheer up a dragon?”


    “We could…” Mrs. Bao said softly, staring at the back of her shop and the pile
    of instruments. “No, it’s too crazy.”


    “I’m standing here discussing how to cheer up a dragon,” Scharf said flatly. “I’ll
    take any and all suggestions.”


    “We could put on another parade. There are many community groups the committee
    did not approve of. We could… I could...”


    I felt the vaguest stirring of hope; it was an alien sensation. “That would make
    `me` less sad.”


    “It is not his sadness that matters,” Mrs. Bao said, visibly frustrated. “He bestows
    his bounty on the world. And he withdraws it as he chooses. He has withdrawn it.”


    Everything in me sunk. I stared down at my unmarked knuckles, remembering the
    rage and the blood. “So, this isn’t him making the world angry; this is him `not`
    making the world `less` angry? This is `normal`?”


    She nodded vigorously. “When the first cold day at the end of summer arrives,
    it feels so cold. But the same day at the end of winter feels very warm. This
    will feel warm again, one day.”


    Scharf shook her head. She looked pale. “The weather too? This is normal?”


    Mrs. Bao shrugged. “The atmosphere will adapt.”


    I sat down on one stool at the counter. “So normal feels cold because we’ve been
    so used to his, uh, warm influence? And you think offering him a parade would
    get it back?” I stared through the front windows at the falling rain, feeling
    the urge to apologize to the sky.


    Mrs. Bao didn’t look confident, but she nodded. “If the New Year is what offended
    him, we could try.”


    “I can’t believe I’m solving a crime with a parade,” Scharf said.


    There was a wild light in Mrs. Bao’s eyes. “Except we couldn’t. It takes a year
    to plan. To stop traffic. And the storm!”


    I grinned. “I’ll worry about the weather. Scharf can do the traffic.”


    Scharf raised an eyebrow. “Scharf can?”


    I ignored her and kept my eyes on Mrs. Bao. “Thank you! You have no idea how much.
    Can we do it tomorrow?”


    “Tomorrow?” Both of them asked together.


    I remembered the look in his eyes, the three-thousand-year stare. “Yes, tomorrow.”


    I could not shake the horror—that this was the normal world. He wasn’t affecting
    us, but exactly the opposite; he’d finally `stopped` affecting us. That the rage
    that had me pounding on an unconscious opponent was my natural rage.


    “Tomorrow morning, first thing,” I said.


    “I do not know who will come,” Mrs. Bao insisted.


    “You can make it happen. We have to make it happen.” I looked back into his shop.
    I could just see the pile of instruments and no sign of Kui. “Maybe don’t go in
    there until tomorrow?”


    Mrs. Bao nodded.


    “He’ll be fine,” I said.


    She smiled her tiny smile. “He will always be fine. It is the rest of us I am
    worried about.”


