    was a button, I could push them in different orders for my entire life and not
    find the right combination. Reluctantly, I handed it back to the gnome.


    “Can you put it back?”


    “What will you—”


    Without answering, I went to the smoothie cupboard, pulled out the ancient cookies,
    and thrust the entire package at him.


    He held the cookies and the box, his eyes as round as two coins in his head. “It’s
    too much!”


    “It really, really isn’t,” I retorted.


    He bent for the new hole, and I turned him towards the door. “Not that way!”


    He farted and harrumphed and rolled away, back to his wet kingdom. One day, the
    entire floor of Scharf’s house was going to fall through. First ghuls had burned
    through it, then the gnome punched through it, and now we’d flooded it.


    I looked at the water in the sink and carefully put the glass in my cupboard,
    not quite willing to let it wash down the drain.


    Scharf sat wearily at the dining room table, sidestepping the pile of newspapers
    like they didn’t exist. I retrieved the scones that had fortunately escaped the
    splash zone, and sat across from her, liberating the opposite white chair from
    her breakfast dishes. I had let things go around here.


    “You should take a nap,” she said.


    “I’m fine.” The adrenaline of getting my box open had me wide awake, which had
    other worries asserting themselves. “What happened after I left the crime scene?”


    “The medical examiner took the body away.”


    And now I could worry about a doctor cutting open a goblin somewhere. I sat on
    my hands to stop myself from asking her what they’d found.


    “I finished the interviews we could do.” Scharf ate another scone. “One other
    woman is living in the building on the third floor, but she was at the parade.
    And I met with Kui Liu, who works in that music shop, Liu Imports.”


    I perked up.


    She shook her head. “He’s a thousand years old and has one leg. It wasn’t him.”


    “What about Joe of *Pasta Joe’s*?”


    She considered for half a second. “No, his alibi is airtight. Who would have known
    he hangs out with federal judges? And he knew nothing about the Restaurant Killer,
    and it’s going down as another of his victims. According to BAU and my boss and
    everyone else.”


    “But—”


    “But the Restaurant Killer is locked up. So no, I don’t have a lead or suspect,
    except the one in maximum security, and no next steps because BAU took over the
    case.” She sighed. “I’m liaising with my own agency.”


    “But you love liaising.”


    “No, I like when *others* have to liaise with me.”


    “Right.”


    She beat her hands against her legs. She was usually never still, and it warmed
    my heart further to see her fidget. I hadn’t realized until now how worn she had
    seemed.


    She laced her hands together again. “We caught the killer.”


    “What? You just said…”


    “No, I don’t mean we caught *this* killer. We haven’t. I mean the Restaurant Killer
    is in prison.”


    I agreed that whoever had killed Rodger and the goblin wasn’t her long-ago serial
    killer if even they were the same person, but I couldn’t understand why she was
    so sure. “So you’re saying the man in jail killed the people you said he did?”


    “That investigation was solid. He was convicted without a shadow of a doubt. We
    didn’t screw that up.”


    “So who killed Rodger?”


    She didn’t answer. I ate another scone, and my phone skipped through three more
    songs before it tried to play Gregorian chants my mother had downloaded for me
    several years ago. The chanters were severely out of tune. I turned it off, and
    the world felt a little colder again.


    She straightened. “I keep harping on the manual strangulation, the pattern of
    bruising with the thumbs against the windpipe. We never let that part of it get
    out. And the fork was in the right eye.”


    “He had a fifty-fifty shot.”


    “It all adds up. There were deeper similarities only the killer knew.”


    I shrugged. “The killer and you.”


    Her brow knitted. “What?”'
