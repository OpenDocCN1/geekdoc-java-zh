    People trudged north up both sidewalks. They were not the usual DC denizens in
    suits and business casual grabbing lunch or indulging in DC’s weird cupcake obsession.
    These people were in jeans and puffy jackets for a long stay outside, marching
    in lockstep. As I passed, one blond woman unfurled a banner with angry red letters
    on it. I couldn’t see what it said.


    Scharf turned off the radio but didn’t stop driving. She fumbled for her phone
    and hit speed dial.


    “I’m rolling up Seventh and there’s a crowd of people gathering. What’s the deal?
    Okay. Okay.”


    I strained but couldn’t hear the guy on the other end. She dropped the phone and
    was forced to slow the car as the crowd swelled and poured into the street in
    front of the arena.


    “What is it?” I asked, my eyes on another banner, trying to make out the words.


    “Protest. They have a permit. But not for blocking the street.” She wrenched the
    wheel over, waving a hand at the crowd to get out of her way so she could get
    to the curb.


    “Protest of what?”


    She rubbed her temple. “Freedom?”


    “Wait. They’re protesting freedom or protesting for freedom?” I thought about
    it for a second. “Or other people’s freedom?”


    “No one will ever figure that out.”


    “What are you gonna do?”


    “Find the leaders and get them out of the street before we have another riot on
    our hands. They started on the Mall and some genius said to take to the streets.”


    “I take it DC doesn’t get freedom?”


    “Stay in the car.” She dug a radio out of the glove compartment with an earpiece
    attached to a squiggly wire. Things were never good when Scharf broke out the
    squiggly wires.


    “I could help?” I would be less vulnerable than she was out there, and my hob
    powers might calm some of them down.


    She paused for a second, meeting my eyes carefully. “Stay in the car.”


    She opened her door, and the roar of the crowd flooded in. She slammed it and
    jogged off. I sunk in the seat, grateful for the tinted windows as the marchers
    flowed around the sedan, rocking it occasionally and sending my heart rate soaring.
    But they were focused on moving north.


    Then somebody crashed into the trunk of the car hard enough to shove it forward
    an inch.


    “I spoke too soon!” I twisted around. “Get off! This is an official…”


    The words died in my throat as I got a glimpse of a dark red torso through the
    rear window. It bent down, and the Lubber Fiend leered at me. He thumped a fist
    into the trunk, and I screamed, “Not the car!”


    I reached for magic, thrilled to find it come at my call, and stumbled out my
    door into a burly dude with a beer gut who was pretty surprised when I didn’t
    budge at his shove. He sprawled to the cement instead, taking a few more protestors
    with him. His face turned purple, and he started to bellow. I pulled on my hob
    powers to calm him down.


    Nothing happened. Hob magic drew from the emotions around me, and there was no
    calm anywhere near here. I couldn’t create something out of nothing. “Crap!”


    I dodged around the car and into the street with a vague plan of fleeing again
    when the Fiend slammed a huge fist into my back. I went flying and only landed
    on my feet with a pull of magic. My kidneys ached and I groaned. He was `so` much
    stronger than me.


    A line of people marched in front of me, and I had seconds out of his sight to
    decide whether to stand and fight him or run.


    I dove into the crowd behind me, losing sight of the Fiend in seconds. I twisted
    and turned, working my way deeper between people with a vague plan of hiding somewhere
    until he lost me like last time.


    I was almost to the other side of the crowd, which had slowed to gather around
    the Chinatown arch when somebody yanked on the collar of my jacket. I windmilled
    backward into a hard chest and twisted to see the Fiend towering over me.


    “I challenge thee!”


    “Crap!”


    In the dimness of Juya’s hallway, he had been terrifying. In the light of day,
    the Lubber Fiend was an order of magnitude worse with grotesque features and deep
    maroon skin. His stringy dark hair fell over his extremely muscled body and a
    ragged pair of jeans. His face looked like a caricature of an ugly goblin with
    a bulbous nose, huge ears, and crooked, pointed teeth.


    I had no doubt his fingernails were claws too, but they were currently tangled
    in my jacket, so I couldn’t see. I spun until he lost his grip and hissed, “Not
    now!”


    Anywhere but here and now.


    “Here!” the Lubber Fiend said, flexing. “The site of my first victory in this
    land.”


    I saw red. Literally. A haze drenched my vision. “What did you say?”


    The Fiend pointed toward the arena. “I defeated your minion!”


    “It was `you`,” I growled, not recognizing my voice. I leaped closer to him; I
    was half his size and didn’t care. `You` killed Everglades.”


    A boy with a baseball bat staggered into me. I stole it from his hands with magic
    and resisted the urge to keep it. I tossed it up on an awning so nobody could
    use it and turned back to the Fiend. “`You` snapped his neck!”


    “Did I snap it?” He shook his head like a confused dog.


    I couldn’t tell if that was a denial or surprise at his accomplishment.


    The ugly chanting dropped off, and the crowd jostled. I looked left to see a line
    of police.


    “Oh, great.” Because that was all this situation needed.


    I was buffeted by another young guy in a messenger service uniform who looked
    scared. I pushed him towards the edge and fought to stay near the Fiend.


    I grabbed a greasy hunk of his hair to get him to look at me. “Why? He was just
    delivering my message. I thought only I was in danger in these challenges! Why
    hurt him?”


    He looked a little chagrinned. “Well, I didn’t mean to. It was so much power.”


    “You didn’t mean to? Meaning you did kill him.”


    He nodded.


    The moment he confirmed it, I lost the battle for control. I leaped for him, straight
    into a fist to the chest, and bounced to the ground.


    A loud bang cut through the noise of the crowd and bitter, stinging smoke filled
    the intersection. I used magic to keep it away from my face as I scrambled up
    and leaped again.


    This time, I got in a punch before a spout of flame from his hand passed my face.
    I was so far beyond caring that I didn’t even duck, just hardened my skin against
    the heat.


    But this wasn’t like other fire. This was goblin fire, and it seared my cheek.

