  raw: 'Before Kui could answer, the water took down one string of red lanterns. One
    of them landed over my head, momentarily blinding me.


    Kui snorted.


    I shrieked and toppled back. Someone caught me and helped me to the ground. The
    pain rushed back in full force, and I couldn’t help a totally inappropriate giggle
    that turned into a full goblin cackle.


    “Get this thing off me!” I said, trying to stop my hysterical laughter. In seconds,
    I’d be sobbing. Someone peeled the lantern off my head, and I shook like a dog
    to get my hair out of my face.


    The dragon laughed.


    The crowd froze. Performers, spectators, workers, and commuters.


    It sounded like trumpets, bells, the best marching band in the world, or the strongest
    spring storm. Kui bent over his canes guffawing.


    It took an eternity for him to stop.


    I didn’t want it to stop. I was growing colder.


    He looked at me and bowed.


    He raised an arm, and the clouds disappeared from the sky. Then he held out a
    hand to me, palm up. I screamed as my spinal cord knit together, each vertebra
    snapping into place, each nerve rewiring. In seconds, the searing agony had vanished.


    Kui pointed above me, and the geysering fire hydrant froze in midair. I gasped
    as the shape emerged from the ice. He had carved a dragon into the frozen spray.
    A ray of sunshine struck the ice statue and flooded the street with rainbows.


    Juya chuckled. “Well, I guess you were half right.”


    “What?” I asked.


    “There are rainbows.” She raised a hand and more exploded across the sky.


    It gave me enough faith to sit up. I was terrified of what I would find, but my
    legs responded to my commands. I was winded and aching, but whole.


    Kui dried the rain off the piano with a flick of his hand.


    After all my talk about joy, the thing that had tipped the scale for him was the
    rawest, stupidest slapstick? A lantern had landed on my head, and it was so funny
    that he’d hoped?


    I picked up the lantern and clutched it to my chest.


    I looked at Mrs. Bao, bowing low to him. No, I had not been the one to turn the
    tide.


    Feet pounded behind me, and I twisted to see the Lubber Fiend plowing my way.


    “Stop.”


    Halting, he said, “I have won, *Peallaidh*.”


    Mrs. Henderson danced in a puddle, looking happier than I’d ever seen her. A few
    other goblins had joined her.


    “No, I win,” I told him.


    He shook his head. “You are injured.”


    “Do I look injured? I win.”


    “I challenge—”


    “No. Stop,” I said. “To be the leader of goblins, what’s the one requirement?”


    He shrugged. “Strength.”


    I shook my head.


    “Smarts.”


    I shook my head again and said, “You need a follower.”


    “What?”


    Grinning, I threw my hands out, then immediately clutched my left hand against
    my rib cage. I still had a bit of healing ahead of me. “The one thing you need
    as a leader is a follower. Look around! These people followed me here.” Tears
    welled in my eyes. “I asked them to come. I asked them to help me. I couldn’t
    even tell them why, but they came.”


    Osman stepped up to my side. I glanced at him in surprise as he put an arm around
    my shoulders and bowed his head. Juya stood beside him, her face vibrant and healthy.


    I grinned as I turned to the Lubber Fiend and the goblins who stood behind him.
    “Who would you rather follow?” I asked them. “A Fiend who killed one of our own?
    Because he was annoyed? Or a goblin who can get entire crowds to come and melt
    the rain?”


    Mrs. Henderson deflated and said, “You.”


    Smiling, I turned to the Lubber Fiend. “You’re no leader. No one would follow
    you anywhere. I won this challenge the first time we met. And now we have another
    bargain to make.” If I was going to be a leader of goblins, I was going to have
    to lead. “You killed a goblin.”


    He scoffed. “He was nothing.”


    “No. *You’re* nothing. I’ll make a deal with you. You never do magic again. If
    you do, I will kill you.”


    Scharf turned away and put fingers in her ears.


    The fiend snarled and veered away, but the other goblins stood firm, blocking
    him. “Keep your end of the bargain,” I said, “and you live.”


    “You won’t know.”


    “Oh, I’ll know. If I don’t, they will. And they *will* tell me.” I looked at the
    goblins. “Bargain?” I asked them.


    In lockstep, they answered, “Bargain!”


    Even as I said it, I prayed to the gods standing in the square with me and all
    the other deities I could think of that he’d keep this bargain. Scharf was right—a
    prison would never contain him; he was mine to deal with.


    “Bargain?” I asked the Fiend.


    He snarled at me, his face a mottled red, his teeth sharp. For a second, I thought
    it wouldn’t work. He was going to call my bluff, squish me into the fire hydrant,
    and declare martial law. But he said, “Bargain.”


    The chime nearly deafened me and rang throughout my already sore body. I staggered,
    but Osman kept me up.


    “Now get out of here,” I said.


    As we watched him lope out of the square, the world got a little warmer.


    “Thank you,” the dragon said. “I didn’t want them to move. I did not realize I
    had so given up.”


    “You didn’t want them to move? The Baos?” I fought down a laugh. Mrs. Bao had
    been right. He was sad about losing them, not about a parade. We’d done all this
    for nothing.


    I glanced around. The band had finally rescued the tuba player and had started
    in on “Louie, Louie,” a song they could play perfectly. The dragon dancers had
    abandoned the dragon part of their costume and were simply dancing with the crowd.


    *Not for nothing.*


    Mrs. Bao said, “There is room in our shop in Maryland. You could come?”


    He nodded. “I would like to come with you. I am sorry about the ice.”


    It had been so much more than ice, but I bit my lip to keep from saying so. We
    could not keep him here. We had to make our own weather.


    “But before you move, come home with me, dragon,” Juya said quietly. “I learned
    from one of your kind how to make dragon’s beard candy. I haven’t made it in centuries.”


    He chuckled; it was a dry, hard sound. “My punishment is spun sugar?”


    Juya smiled. “Your punishment is hope.”


    He looked like she had struck him. “That is a just punishment.” He looked around
    the square at the party, which was now in full swing around us. “A very just punishment.
    This city is an aspiration. To see clearly and still aspire?”


    I smiled. It was the perfect bargain.


    Juya hobbled away, and soon the dragon joined her. Two old gods, forgotten by
    humans, but not quite finished with us yet.


    Osman made sure I was steady on my feet and followed. I smiled. Then I folded
    onto the ground with a groan.


    Someone tapped none too gently on my cheek. I looked up to see Scharf hovering
    over me. “You okay?”


    “Is it over?”


    She grinned. “I was going to ask you that.”


    “He’s okay. The Baos will make sure of it.” I put my head down. “I think I earned
    my rent for this month.”


    Her laugh rang out clear and clean, and I joined her, letting loose my goblin
    cackle and reveling in the music and sunshine.


    # EPILOGUE


    I stood with a wooden stake in one hand and a hammer in the other, surveying Scharf’s
    crawlspace. It smelled of wet clay and ever so faintly of char. A month ago, I’d
    defeated a load of ghuls by smothering them with the earth down here. I brushed
    my feet across the ground and uncovered the new heap of obsidian rock I’d created.


    At the edge of the glassy black hump, I hammered the stake into the ground.


    I heard a fart and turned around. The garden gnome Grimm was standing on his head,
    staring at me. “Can’t grow tomatoes here, you know.”


    “I did know that Grimm. That’s not what this is for.”


    I picked up the square bit of plywood and nailed it to the stake.


    I stood back so he could see.


    “What do the marks say?” Of course, he wouldn’t know. When would a garden gnome
    learn to read? His brain had to be the size of a peanut.


    “Try me,” I said, crossing my arms.


    “I don''t want to fight!”


    “No, that’s what the marks say: ‘Try me.’”


    “How do you want them to try you?”'
