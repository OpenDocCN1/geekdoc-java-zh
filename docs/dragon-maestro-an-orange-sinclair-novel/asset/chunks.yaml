    “Pu-erh fermented green tea,” Mrs. Bao said, and lovingly caressed the pot.


    “Think about how delicious it will be when we know if they did it,” I told her.


    Scharf took another sip, and this time, the chime sounded.


    I played back over their statements. “The two of them are in the clear. Their
    alibi will hold.”


    Scharf looked at David. “Can we chat for a moment, since you were here?”


    “I didn’t do it!”


    I groaned. That would have been the perfect thing to hear if I’d had a bargain
    in place. Scharf glanced at me, and I shook my head.


    “Repeat that. And I’ll…” She cast around for something. “Drink the rest of this
    cup of tea.”


    “Okay?” David said, looking at her like she was completely insane.


    “So long as it’s the truth,” I said quickly.


    “So long as it’s the truth,” Scharf repeated.


    The chime signaled the start of a bargain.


    “I didn’t do it?” David said slowly.


    Scharf quickly downed the rest of the tea. The second chime confirmed he told
    the truth. Scharf examined the bottom of her cup. “It grows on you.”


    Mr. Bao refilled her cup with a small smile.


    “He’s telling the truth,” I said. “He didn’t do it.”


    I expected her to get up, but she didn’t. She just sipped more tea and asked,
    “Did you notice anyone around? See anyone out of the ordinary? Anyone with an
    interest in Rodger in the weeks leading up to—to last night?”


    David shook his head.


    “I know this is difficult. That night, in the alley. Did you see anyone else there?”


    David shook his head again. “I heard running though, footsteps.”


    Scharf stiffened. “Where?”


    “Down the alley, away from the street.”


    “When?”


    He shook his head. “It’s a blur. Right before I saw you and your friend.”


    I gasped. We’d missed the murderer by seconds.


    “Okay, Anything else?” Scharf asked, concealing any reaction.


    He looked to his aunt and uncle and shook his head. “It’s a blur.”


    Scharf dug a business card out of the front pocket of her jacket and handed it
    to him. “If that changes, get in touch, day or night.”


    Glass shattered somewhere outside, and Scharf jumped to her feet.


    “We thought this was done!” Mrs. Bao shouted as Scharf carefully put down the
    teacup and then bolted for the front door.


    “Stay here!” she shouted as she yanked it open.


    I followed her, needing magic to make me fast enough to get through the closing
    door.


    The front window of `Pasta Joe’s` had exploded onto the street. A giant stainless-steel
    pot and a squiggly pile of noodles rolled amidst the shattered glass.


    Scharf drew her weapon, keeping it by her thigh. “Open the door.”


    “Me?” I shrieked.


    “Magic,” she whispered through clenched teeth.


    “Oh, yeah.” I wrenched open `Pasta Joe’s` front door with a thought, and Scharf
    ducked inside in a weird dodging dance that was as natural to her as brushing
    her teeth. I hardened my skin and followed her.


    Inside, a large Italian man in an apron stood in the center of the wrecked dining
    room. I could only assume this was Joe of `Pasta Joe''s`. He brandished a wooden
    spoon at the elder Fuller who was sprawled next to one of the few upright chairs
    in the room, looking stunned. Carlisle and Melissa crouched at his side.


    Fuller laid eyes on Scharf and pointed to the cook. “Arrest him!”


    “Did he hit you?”


    “He… He insulted me!”


    Scharf sagged and holstered her weapon. I did not let down my guard.


    “He insulted me!” Joe said. He didn''t sound Italian; he sounded like he was from
    Brooklyn.


    Scharf put out two hands in a universal placating gesture. “What happened?”


    Carlisle and Melissa eyed each other over the profiler’s pomaded silver locks.
    Melissa whispered to him about her uncle’s brilliance at rapport as a master of
    human behavior, and that this was an interview technique and Scharf was ruining
    it.


    I gritted my teeth and resisted the urge to unleash my magic. Maybe I could make
    a teeny tiny bargain and leach all the silicon from her breasts.


    “I told you the truth. The truth is not an insult,” Fuller insisted and pulled
    himself upright to sit in the chair.


    “What exactly did you say?” Scharf asked.


    “The average IQ of workers in the service industry is ten points lower than the
    average IQ of anyone in law enf—”


    Joe charged, and I grabbed for the earth in his body to keep him from strangling
    Fuller.


    I wanted to let him. I don''t know where he pulled that statistic, but as a long-time
    worker in the service industry with tons of friends who were also in the service
    industry, I took issue with the statement.


    I forced down my anger. Was I seriously going to punch anyone who upset me? And
    what was Fuller thinking?


    “The foremost profiler in the FBI is terrible at building rapport,” I mumbled.


    “This interview is over,” Scharf said. “Come on.”


    She walked over to Fuller, and I helped her pull him to his feet with magic. Once
    he was moving, Carlisle and his niece followed like two little, perfect ducklings.
    Joe stood aside so they could get out the door and slammed it behind them as an
    automatic doorbell bleated. I stared at the.

