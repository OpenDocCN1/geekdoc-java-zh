    He tugged on the end of one ear. Like most goblins, including me, his ears were
    long, pointy, and jagged. “You wanna eat with me?” he said.


    “Yeah, I would.”


    “I am not worthy!” he cried and bounded off.


    I called out, “I’ll make a deal!”


    He screeched to a stop.


    “I’ll make a deal,” I repeated, and walked toward him, dodging seat cushions.
    No goblin could resist a deal. “Don’t even think about drowning yourself, and
    we’ll share food. You’ll be worthy if it’s a bargain, right?” Looking terrified,
    he shook his head, so I said, “Okay, never mind. How about the opposite? You don’t
    drown yourself, and I promise never to ask you to share food again.”


    He didn’t say anything but didn’t walk away either.


    “Say ‘deal,’” I told him.


    He nodded.


    I shook my head. “Say ‘deal.’”


    “Deal,” he said, staring at the floor and shuffling his feet. He looked and sounded
    like a recalcitrant child. The chime in my head signaled we had a bargain.


    “Thank you for not dying because of me,” I said with fervent sincerity.


    He looked up at me, his expression serious. “You’d best avoid the others then.”


    My hand slipped to my side in shock. “The others?”


    “My brothers.”


    *Oh, no.* “You have brothers?”


    “Every other goblin in your territory.”


    “What’s my territory?”


    “They are coming for you. They must challenge the *Peallaidh*.”


    My jaw tumbled open. “But I have the box. I claimed it.”


    He nodded eagerly. “We know. We felt it. Like when we felt the old *Peallaidh*
    die. May he live forever. That’s why we all have to come.”


    I decided not to query why he wished eternal life on a dead man. “So I’m going
    to be attacked on a regular basis?”


    He gave half a shrug and tipped over. In fatigue or shock, I wasn’t sure.


    As he righted himself, I asked, “When’s it going to stop?”


    “When we know you are worthy.”


    “And how will you know that?”


    “When you defeat all of us.”


    My heart stopped for a full two seconds. “How big is my territory? Can I get a
    map? Or even better, a census?” I bit my lip to keep myself from begging. “I did
    not sign up for this.”


    He blinked twice. “Yes, you did. You claimed your legacy. You’re the *Peallaidh*.”


    I sat down on the floor. “There has to be a shortcut.”


    He bobbed. “You could go straight to the top. Find the most powerful, fight him,
    and then anybody weaker will know you defeated him, and then…” He seemed to get
    lost in his argument, but I got the gist.


    “Who’s the most powerful goblin in my undefined territory? Besides me?”


    He bit his tongue. It was a mottled purple after the fight, and I looked away.


    “It might be Billy Blind,” he said. “No, I think the Lubber Fiend defeated him.”


    “And how would I find this Lubber Fiend?” I wanted to ask how to defeat him too,
    but somehow that seemed like cheating.


    *Cheating’s fine!* I told myself. *Why not cheat?*


    “Well, we could bargain, and I could find him for you.”


    I frowned, trying to see the catch. There was always a catch. “Okay? What’s in
    it for you?”


    “You let me have honor in my defeat, and I will let the Lubber Fiend know you
    are waiting.”


    “No drowning yourself.”


    “Deal.”


    I cleared my throat and said, “Deal.”


    When he ran straight for the window of the car, I found the catch. He’d promised
    not to drown himself, but there were dozens of ways to die. We were hurtling south
    on elevated tracks. He’d be completely squished. He took a flying leap, punched
    through the glass of the door between cars, and did an elegant swan dive into
    the rain.


    # 6


    “No!” I screamed and leaped fifteen feet to the end of the car, but still wasn’t
    fast enough. I tried to reach the goblin with my magic before he became a pancake,
    but for the second time that night, I was too late.


    Something thumped on the tracks, and I just stopped. I didn’t look down as the
    train slowed. We had been less than a hundred feet from a platform.


    But I had to look when I heard a screeching cackle from below.


    Impossibly, Everglades stood on the sidewalk below the tracks, waving.


    “I have leaped from a moving train,” he cried out. I could hear him perfectly
    through the window he busted and the storm. “My honor is restored!”


    I crossed my arms. “If you’d jumped into the river,” I yelled down to him, “would
    you have actually died?”


    “Why would I kill myself? How would that restore my honor?”


    “So if I lose to the Lubber Fiend, I can jump out a window?”


    His expression turned grim. “Oh, no, when the apexes fight, it is death. The Lubber
    Fiend will kill. That one can’t live with a challenger.”


    *Oh, that’s just ducky*.


    The goblin ran away into the rain.


    “Whoa!” someone shouted from behind me. “What the hell!”


    I spun to see the passenger pull off his headphones amid the wreckage. I told
    him to forget me and slumped down in a seat as he quickly waded through the destroyed
    seats to the doors as we slowed down to reach the station. Our entire fight had
    only lasted a few minutes.


    Maybe I should’ve started by challenging another midrange goblin. I’d hold them
    in the air until they agreed to jump off a bridge or out a window, and then I
    could work up to a fight to the death.


    My phone buzzed, and I checked the screen and swiped to answer it.


    “Astrid?” I said, “It’s really late or early—I don’t even know which one.”


    “Juya is sick.”


    Every hair on my body stood on end. Juya helped me when I first got to DC at the
    end of last year and any time I was in danger to this day. She was the only magical
    creature I’d encountered who wanted nothing from me. To hear she was sick was
    like hearing the statue of Abe at the Lincoln Memorial did a jig.


    Of course, Astrid didn’t know that. She was a normal human college student who
    came to Juya’s for breakfast like I did most mornings.


    “What happened?” I asked.


    “I don’t know because she won’t go to a doctor. Nobody who lives with her is helping.
    Can you come? She listens to you.”


    “They’re right—no doctors.” She was a magical creature, I knew that, but I didn’t
    know what kind or what might show up on a blood test.


    “Never mind, don’t come! We need to get her to a doctor.”


    “I’m coming.”


    As the double doors opened, I dashed out, following the orange line that had materialized
    as soon as I said I’d come. A train returning to the city was pulling up on the
    opposite platform, and I sprinted around the dazed passenger who was trying to
    flag down the conductor at the front of the train, shouting about the destruction.


    I ducked into the opposite train just before the doors closed, and slumped in
    the empty car, wet to the bone again just from the short dash and shivering hard.'
