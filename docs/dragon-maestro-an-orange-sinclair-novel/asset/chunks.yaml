    \ I didn’t really know him,” I added when I saw her eyes round. “But it wasn’t\
    \ a human who killed him—it was something more powerful. And beyond that, everything’s\
    \ going wrong. Scharf fell apart today, which she never ever does. It feels like\
    \ I’m making it all up, but—”\n\n“It’s not your imagination. This is nothing I’ve\
    \ ever encountered before. I’m so angry I let him get to me.”\n\n“It’s a him?”\
    \ \n\nShe narrowed her golden eyes. “I can’t be sure. But I think a female would\
    \ be a little more vindictive.”\n\n“I thought you would have said nicer or something,”\
    \ I said, gingerly sitting on the multi-colored quilt.\n\nJuya harrumphed. “Let’s\
    \ just say that if I wanted to ruin the city, I wouldn’t be so slow about it.”\n\
    \n“Ruin the city? Is that what he’s trying to do?”\n\nHer head lolled, and she\
    \ forced herself into a sitting position. “That’s what he is *doing*. The world’s\
    \ turning cold. I don’t like the signs.” She looked at me, and I noticed many\
    \ of her wrinkles had disappeared. Oh, her skin still looked like old tree bark,\
    \ but it was a healthy tree again. “I would tell you to stay away, but you won’t.”\n\
    \n“Of course, I won’t. For one, I still owe Scharf, and she definitely won’t stay\
    \ away. And for another, I gotta stop this thing before you get hurt. More hurt.”\n\
    \n“I’m strong enough.”\n\nHer gray skin and clammy brow belied her words. “Yes,\
    \ of course, you are.” I looked at Osman. “Is she?”\n\nHe said nothing.\n\nI wanted\
    \ to ask what to do about “him,” but she was already losing the burst of energy\
    \ she’d summoned. Whatever he was, it was taking all she had to fend him off.\
    \ I didn’t hold out much hope for myself. “Will you be okay?”\n\n“Absolutely.”\n\
    \nI sighed. “I’m going to come back here and make a deal with you, so I know if\
    \ you’re lying.”\n\nThrough gritted teeth, Juya said, “For a while, I can hold\
    \ on. If I knew what I was fighting, it would be easier. But *m’hija*, that was\
    \ not a suggestion for you to go find out.”\n\n“I challenge thee!”\n\nEveryone\
    \ froze.\n\n“No, not right now!” I basically flew to the window. As I pulled aside\
    \ the diaphanous pink curtain, I gasped.\n\nGoblins are small. Mrs. Henderson,\
    \ Scharf’s office secretary, passed for a little person with her glamour on. And\
    \ I’m shorter than everyone I know except her.\n\nThe thing standing in Juya’s\
    \ courtyard, however, would have to duck through door frames. His skin was leathery\
    \ and red. His head was wide, and his ears extended several inches on either side,\
    \ their ragged lobes dangling. He wore jeans and a sweatshirt, and his greasy\
    \ hair was caked in ice.\n\n“I challenge the *Peallaidh*!”\n\nI squinted. They\
    \ kept saying that. “Let me guess, the Lubber Fiend?”\n\nHe roared.\n\n“I’ll take\
    \ that as a yes.”\n\nHe cracked his knuckles, and I rolled my eyes before closing\
    \ them to summon my magic.\n\nI found—nothing.\n\nI opened my eyes as the creature’s\
    \ footsteps sent cobblestones trembling.\n\nI stumbled away from the window and\
    \ tripped over the rug. I crashed onto my back.\n\nI flipped, human slow and uncoordinated,\
    \ to my hands and knees and scrambled out of Juya’s room. If he closed in on me,\
    \ he’d have me trapped up here.\n\n“Lock the door!” I told Osman as he followed\
    \ me to the threshold. I slammed the door in his face and repeated. “Lock it now!”\n\
    \nI dashed for the stairs, knowing I’d only have seconds to flee. Without my magic,\
    \ this was going to be a real short fight.\n\nWhen the Fiend knocked the front\
    \ door down, I ran out of time. I tried to make it anyway, sliding down the banister.\n\
    \n“I don’t accept!” I cried in desperation and spun around the newel post at the\
    \ bottom, trying to get to the back of the house and away.\n\nHe growled as he\
    \ got a hand on my jacket, but I wrenched free and sprinted past the kitchen.\n\
    \n“What happens if I don’t accept?” I said, “I just won’t fight!”\n\nWith my earth\
    \ power, I mentally reached for any of the dozens of metal implements in the kitchen.\
    \ But nothing flew into my hands.\n\nThen I tried my hob powers to tap into human\
    \ emotion—my own, in this case, since half of me was the only human around. The\
    \ rage and fear and despair welled up in me but didn’t translate into power of\
    \ any kind.\n\nThe beast jumped the length of the hallway, ratty hair swinging\
