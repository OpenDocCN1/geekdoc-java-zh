    She nodded. “Don’t screw up, Orange.”


    Scharf burst out of her boss’s office, and I was immeasurably relieved to see
    her gun and badge on her hip. The last time she’d been in there, she’d been stripped
    of both. Then I saw Carlisle seated at a table in the office she’d burst out of.
    She headed for the door without looking at me.


    “That’s not good,” Mrs. Henderson said.


    “Thanks!” I said, dashed to the printer, and grabbed whatever Scharf had printed
    off. I tucked the files under my jacket and ran after Scharf.


    She stood by the elevator, stabbing the down button over and over again.


    “What happened?”


    “I’ve been reprimanded for unprofessional conduct. OPR is investigating.”


    I’d heard the acronym before but forgot what it meant. My confusion must have
    shown on my face because Scharf said, “Office of Professional Responsibility.”


    “But you haven’t done anything! We haven’t even crashed the car.”


    “I used inappropriate language interrogating a suspect.”


    It took me a second to parse the official speak. “But Fuller did that. Not you.”


    “The best defense is offense?” she said as we finally made it to the elevator.


    “Offensive is right.”


    “Not that kind of offense.” She smiled, but it died quickly. “And I’m off the
    case. I’m not to go anywhere near the investigation.”


    “Oh, no.”


    “Oh yes. Fuller and BAU will run everything out of their office.”


    “But he could be the one who did it!”


    She hit the wall with the side of her fist. “You’re right. The absolute best defense
    is to investigate your crime yourself. Damn it.”


    We got out in the garage and made it to her car, distinguishable from all the
    other FBI sedans in their reserved parking spots by its color and age. We slid
    into the car, but she didn’t start it.


    “What do we do now?” I asked.


    She took a deep breath of her own, staring down at her hands in her lap. “How
    dare they?”


    “We emote. I can do that,” I said, realizing she was in no state to investigate
    anything. “How dare they!”


    “How dare they!” She hit the steering wheel. “To think they could put a mark on
    my permanent record.”


    “Terrible.”


    “And… are you humoring me?” she demanded, turning all her built-up rage at me.


    “No, Sir! Uh, Madam. Ma’am?”


    She deflated in her seat and the energy seemed to leach out of the car. “Worse
    though, they’re going to go back to Joe and question him again. Sometimes I hate
    the law.”


    “Don’t say that.” I was truly alarmed now. Law was Scharf’s north star. If it
    was in a procedure, she was fine. “Happy thoughts! Unicorns and rainbows!”


    “You’re right. Happy thoughts. Unicorns and what?” She scrubbed both hands over
    her face like she was trying to take off her skin.


    “Rainbows!” I supplied quickly.


    “Rainbows. If I could just get to the files…”


    “Well…”


    “Orange, what did you do?”


    “Nothing! Only something.”


    # 15


    I pulled the stack of files and computer paper out of my jacket and handed them
    to Scharf. “Don’t ask me how I got them.”


    Scharf raised an eyebrow and pointed to Mrs. Henderson’s signature under “Received.”


    I widened my eyes, trying to look innocent.


    She shook her head and flipped open the first one, chewing on her lip. “This is
    good. Very, very good.” She slammed her fist against the files before handing
    them back and turning on the car.


    “What’s the rest of those?” I asked, pointing to the printouts I’d swiped.


    “The original autopsy reports from the original murders.” She pulled out of her
    slot with undue haste and rocketed up the parking garage ramp.


    “Where are we going?” I asked, clutching the door.


    “I need a medical examiner. I know when someone is drunk or not if they’re still
    alive, but not what it does to their blood alcohol when they’re dead.”


    “Pickle them?” I asked. My stomach twisted. “Wait, the medical examiners who cut
    open dead people.”


    “Yep.” She checked her mirrors and sped into traffic.


    “The morgue and prison all in one day. This gets better and better.”


    The DC morgue was in the basement of another office building south of the National
    Mall and it was a quick drive with the light traffic and Scharf’s lack of self-preservation.'
