    “She was so fascinated with Hastings.”


    Finally, I gulped down enough to settle my stomach, though I didn’t think I would
    ever feel better again.


    “You’ve been waiting for news like this,” Scharf said gently.


    He nodded. He looked ten years older than a minute ago. “I watched her so carefully.
    Tried to get her work. Direct her.”


    Carlisle burst back in the door. He strode over and put a hand on Fuller’s shoulder,
    though he kept his eyes on Scharf. “Let’s go file that complaint!”


    “No!” Fuller said quietly. “There is no complaint. I am so sorry.”


    Fuller stepped towards the door.


    “No complaint?” Carlisle said like we’d denied him an ice cream cone.


    Fuller kept going and Carlisle scrambled after him, whispering urgently in his
    ear as they exited.


    “Is it over?” I asked.


    “Yeah.” She shook her head like a dog shaking off water. “Yeah, it’s over. That
    poor boy.”


    “You okay?” I examined her. Her color had come back; her jaw was unclenched, and
    her hand was nowhere near her weapon.


    She nodded. “He’s done. They’ll probably retire him with full honors in about,
    oh, three hours.”


    That didn’t seem fair, but she didn’t look upset about it, so I tried to let it
    go. “I’m glad it’s over.”


    “I challenge thee!”


    I turned to see a familiar figure tramping through the backdoor from his favorite
    alley. “Or not.”


    The Lubber Fiend strode towards me, still wet from walking in the rain outside
    Juya’s sphere. He’d be dry soon though because his stringy, long black hair was
    steaming. He was wearing only the ragged jeans I’d seen him in before. He grinned
    with his sharp teeth.


    I spared a moment to tell everybody not to notice me and told Scharf, who always
    noticed me, “You might be on your own.”


    She spun around slowly. “No fighting in the middle of the teashop!”


    I ran for the front door.


    The Lubber Fiend pushed a customer out of the way. That guy pushed back. The enormous
    goblin flattened him without pausing. Small fights sprouted in his wake.


    I burst outside into the crowd. It had grown since we’d been inside catching a
    body desecrator.


    I ducked amongst the spectators and wound away from the teashop and the goblin
    as fast as I could without knocking people over.


    The fiend plowed right through them, sending them scattering.


    I stopped short when I spotted Mrs. Henderson clinging to a lamppost, looking
    between the two of us.


    “I’m not running away!” I called up to her.


    “Okay,” she said.


    “I’m not revoking my claim or anything by running away.”


    She shrugged. “Running away is a perfectly fine tactic. I think your father ran
    away from a challenge for a decade.”


    I shook my head. “Of course, goblins would be fine with retreat. Half our magic
    is dedicated to running away.”


    I looked back at another crash and cringed when I saw the tuba player trapped
    in his flattened instrument on the ground and the Lubber Fiend marching away.


    I ran again.


    The sound of sirens replaced the sound of music as more police cars screamed to
    a stop at the end of the block. Officers with megaphones disgorged from the vehicles
    and started running towards the crowd. It felt like we were in a room full of
    explosives and a burning fire.


    Sure, nothing had exploded yet, but it was only a matter of time.


    “I challenge thee!” the Fiend bellowed again.


    When one acrobat flipped too close to him, he snatched the girl out of the air
    by her ankle and threw her on the mat. Her thin, high-pitched cry wavered over
    the sirens. She curled onto her side, clutching her wrist.


    I stopped.


    The crowds kept moving away from the police until the fiend and I stood alone,
    facing each other. He had to be a good eight feet tall.


    “I challenge *thee*,” he said, pointing one clawed fingernail at me.


    I squared my feet, not caring where we were. He had to be stopped. “I accept.”


    He roared in triumph and as he did, fire sprouted from his hair and down around
    him like a cape. He ran for me, fire spiraling behind him.


    “Cute,” I said and pulled every scrap of earth magic I could summon, which seemed
    pathetically little to me, and braced. I couldn’t waste any magic making a cape
    of my own, which was a shame, really.


    He reached me and swung a fist the size of a dinner plate toward my head.


    I ducked.


    Then got slammed by his other fist and went flying backward through the air with
    enough time to marvel at a small patch of blue sky above me before I crumpled
    to the pavement.


    The skin on my elbows ground into the blacktop, and every scrap of air left my
    lungs.


    I coughed and gasped for breath and tried to get up. The sky disappeared as the
    fiend leaned over me. I rolled away milliseconds before his fist buckled the pavement
    beside my ear.


    We both climbed to our feet, him shaking his fingers and me pounding on my solar
    plexus until something unlocked, and I sucked in a sobbing gulp of air, enough
    to say, “Ow!”


    “Stay still!”


    He charged again, and without anything else to defend myself, I raised my one
    good fist. He batted it out of the way with one hand and swung at my head with
    the other. I barely dodged in time. I would never win this way.


    As his fist wound back again to smash my face, I froze.


    *Who said I had to win this way?*


    # 23


    As I dodged the Fiend’s fist again, I said, “Whoa, whoa, whoa. What exactly are
    we fighting for?”


    I dove under his next punch and kept going between his legs. He spun after me.


    He lunged as he said, “Are you the best?”


    “The best what? What are the criteria?” I thought back to John Hastings’s extensive
    definition of “amusing.” “The fastest? Strongest? Funniest? Shortest? What does
    ‘best’ mean?” I danced backward with each word as he staggered forward, trying
    to jab me.


    The air whooshed out of him, and he repeated, “The best!”


    But he’d slowed.


    Mrs. Henderson called out from the lamppost, “The best!”


    I heard a few other jeers and noticed a few multicolored short people with floppy
    ears in the crowd. Goblins.


    “I want to bargain!” I told him.


    The jeers turned into cries of approval. Goblins understood bargains.


    “He’s at the top of the heap, right? He’s fighting for all of you, right? To make
    sure I’m worthy of being your leader?”


    “What’s your bargain?” Mrs. Henderson asked.


    As the Lubber Fiend came at me again, I held up a hand. “Whoa! I think we can
    conclude from the way you had me on the ground that you’re the better fighter.”
    When he thrust his arms into the air in victory, I said, “Wait! Goblins, do you
    want the best fighter? Can’t you fight your own battles?”


    They jabbered and chanted and shook their heads. One said, “We can look out for
    ourselves!”


    I pointed at the one who spoke. “Good. Excellent. So you don’t need the best fighter
    as your leader.” I turned to the Lubber Fiend. “We have to do something else to
    compare ourselves. I’ll even let you pick. What’s the next test?”


    He squinted at me, and I didn’t breathe, worried he wouldn’t pick up the gauntlet
    I’d thrown and would keep wailing on me. After an agonizing twenty seconds, he
    said, “Speed.”


    I tried to hide my relief that he’d agreed to play by my rules, whether or not
    he’d realized it. He could have flattened me in another few seconds—but that certainly
    didn’t make him the best.


    “Speed,” I repeated. “On your mark. Get set. Go!” I took off and reached Mrs.
    Henderson’s lamppost before he even moved.


    “I’m pretty fast. Goblins, do you need speed?”


    “We’re all fast!” Since our main magic all had to do with running away, yes, we
    were all fast.


    I cracked my knuckles. “I get to pick the next one. Shortest!”'
