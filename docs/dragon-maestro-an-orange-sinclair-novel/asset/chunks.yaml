    # 1


    “Kill him, kill him, kill him!” I screamed.


    Special Agent Laura Scharf aimed at the troll and dispatched him with a perfect
    shot between the eyes, then turned to the next grotesque creature with floppy
    ears like mine. She shot him too.


    “Are we going to do this all night?” Jack drawled from behind us.


    A cacophony of buzzing bells erupted, and the screen in front of us dissolved
    into the words, “High Score.”


    “Yes!” I clapped Scharf on the back but stepped away quickly at her raised eyebrow.
    “Good job?”


    “Not bad.” She eyed the arcade game `Trolls and Goblins` and holstered the blue
    plastic gun. “More fun with this.” She patted the bulge beneath her peacoat where
    a real Glock rested in the shoulder holster she wore off duty. Or at least as
    off-duty as an FBI agent gets.


    “If you use that,” I said, patting the arm she didn’t need to draw her weapon,
    “you would kill the nice arcade game that didn’t do anything to you.” I turned
    away once she’d entered her initials at the top of the screen. “Thanks for coming.”


    “I didn’t know you were such a hockey fan.” Scharf offered a small, tight smile
    as she scanned the concourse full of milling people in white, dark blue, and red
    fueling up between hockey innings. She looked like she was scanning for suspects.
    She stuck out like, well, an FBI agent in a sea of hockey fans.


    “Love it,” I said. As she did another full pivot, I couldn’t resist adding, “No
    dead body is going to jump out of the popcorn.”


    “You never know.” She tugged at her peacoat to fit better over her weapon.


    Jack wove his fingers with mine and said, “Glad to see y’all get some free time.”
    He put his lips to my ear as we headed towards our box around a bustling concession
    stand that reeked of burnt butter. “It would’ve been more fun without the third
    wheel.”


    He had to lean quite a way. He topped my five feet by at least another foot.


    I kissed him in reply, but unpeeled quickly, mindful of our third wheel. And her
    gun. This night was way more awkward than I had expected; before this, Scharf
    and I spent the two months we’d known each other chasing a murderer and trying
    not to die.


    It hadn’t left many opportunities for small talk. The aforementioned murderer
    had also derailed my fledgling relationship with Jack, but to my surprise, it
    was sort of turning into something.


    As a mostly unemployed, mostly homeless college dropout, I didn’t think Jack and
    I were in the same orbit, but in the world of magic, the heir of a goblin king
    was a perfect match for a demon.


    If only my puny human half believed that. I had dragged an FBI agent on a date
    with him. We still had a few more trust falls in our future before we could claim
    couplehood. Scharf’s years in the army and then the FBI had made her bad-guy detector
    way more accurate than mine. I wanted to see what she thought of him.


    A rumble of thunder almost shook the building, and all of us turned towards the
    floor-to-ceiling windows that flanked the concourse. The entrances to the private
    boxes were on the upper deck, at least three stories up. Out the windows, we could
    see the roiling sky over the old brownstones of Chinatown.


    “Let’s hope that holds off,” Scharf murmured before examining the sign above the
    hallway leading to the suites, then squinting at the pristine ticket she dug out
    of a pocket. I had no clue where mine went. The security guard nodded at us as
    we went through the door.


    “Don’t worry, agent,” Jack said. “They’ve already memorized our faces.”


    I led them quickly towards our suite, resisting the urge to tell him not to tease
    her. Wasn’t this exactly what I asked for?


    We trooped through real wood double doors into a warm suite full of free drinks
    and plush.

