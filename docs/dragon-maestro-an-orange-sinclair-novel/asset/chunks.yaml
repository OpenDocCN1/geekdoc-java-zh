  trans: '

    Scharf 纹丝不动，双手叉腰听着医生阅读。而我，则坐立不安。我很想走来走去，但不想离那堵钢制冰箱门组成的后墙比现在更近。有那么一瞬间，我甚至考虑过在走廊里翻跟头之类的动作。


    “这不一样，”Lange 医生几分钟后说道。


    “什么不一样？”


    “你们的第一个受害者体内含有大量的苯巴比妥。这很不同。”


    “是什么药？”我问。


    “一种药物，但并不常见。”


    “他是个癫痫患者，”Scharf 说。


    “噢，是的，”他看起来很失望，“好吧，这是这种药物治疗的症状。但量大得离谱。”


    “故意的大剂量？”


    Lange 医生直视着我们每一个人的眼睛。“可能。但完全没有酒精。”


    Scharf 吸了一口气。“那另一个受害者呢？”


    “这很有意思，”Lange 医生一两分钟后切换了文件说道。


    “是吗？”Scharf 问，“它们吻合吗？”


    他抬头笑了。“我需要一点时间来弄清楚这一点。但这里列出的力道一定是笔误。”


    “哪一个？”我问。


    “这一个。第二个受害者。第二个？”他检查了每个文件的顶部，“是的，那个在垃圾桶后面发现的男人。这一定是错了。没有人能产生那种力道，从正面用手折断别人的脖子。”


    我缩了缩脖。“那这意味着？”


    他抬头看着我。“根据此，我只能得出结论，你们的杀手是绿巨人。”


    我歇斯底里地笑起来。我通常尽量不这样做，因为我听起来像个咯咯的小鬼。Scharf 的手落在我的肩膀上用力捏捏。力度很大。


    “我可以和我们的法医核实那些数字，”Scharf 说，手依然按在我的肩膀上，“我们晚点再回来吗？”


    Lange 医生没有回答，只是快速翻阅原始尸检报告的旧打印件。


    “我们可以再回来，”Scharf 重复道。


    Lange 医生举起一个手指，切换回新的杀人文件。“我很想深入研究，但乍眼看，我可以告诉你们，这两个可能都不是之前的那个杀手。他们之间也不是同一个杀手。而且这两个人的体内都没有酒精或药物，除了第一个受害者体内的抗抽搐药物。而每一个原始受害者都是醉得烂醉。”


    我用胳肘碰碰 Scharf。“看到？”


    Scharf 克制住了她的兴奋，但我能感觉到她在颤抖。“你确定吗？”


    “我会读完这些，对我如何得出那个结论做些笔记，但大一医学生都能读懂这些毒理报告。”


    “但你确定他们不是同一个杀手吗？他们的酒精水平体现不出这一点。”


    他简短地笑了。“不。你们第一个杀手是右手子，而第二个是左手子。第二个高到——我见过的最高——而第一个身高和受害者差不多。第一个很可能认识他的杀手——勒杀发生在正面，而且杀手的手指上没有痕迹。”


    “没有防御性伤，”Scharf 说。


    他点了点头。“他认识杀手，而且没有防备。信任他——或她。”他皱着眉，在两个文件之间看了。“明天我会有更多发现给你们。”


    当我手搭在门上时，他说：“等一下。”


    “怎么了？”


    “我还可以告诉你，Rodger Clark 的记录被篡改过。”


    Scharf 冲向他。“你在说什么？”


    “有人重写了这些文件的部分内容。笔迹不符。”


    她歪了歪头。“你是笔迹分析师吗？”


    “不，但正如我提到的，我对细节有惊人的关注力。或者那是我惊人的记忆力？”他眼中闪烁的光芒拆穿了这句话中的自傲。“无论如何，这些字迹不是同一只手写的。有人改了这第一个文件。”他指着，“这里，这里，还有这里。”


    Scharf 越过他的肩膀。“改了什么？”


    “主要是关于血液的。关于青青模式之类的。真遗憾。做得很好。我看不出原来写的是什么。”


    “为什么？”我问。


    “我无法猜测，但参与原始调查的某人不希望任何人看到原始尸检报告。”他揉了揉眼睛，眼镜掉出了鼻梁。他一边扶眼镜一边说，“我会标记那些地方。然后我相信你们会把我的结论带远、远远远的地方。”


    “绝对会。”


    Scharf 在门口接住了我，我们离开了那里。


    “你觉得他是怎么改掉文件的？”她问。


    “Fuller？我不知道，魔法？”


    她缩了缩。“别开玩笑。”


    我又笑了，但咬了咬嘴唇止住。“我没开玩笑。”


    和我们上次来一样，我们走应急楼梯回到主层。和上次不同的是，我没有打喷嚏也没有哭。


    和上次一样，Scharf 在楼梯中间停下。“他是怎么做到的？”


    坐在楼梯上，看着她下颌上的条纹变得越来越红。她咬着牙，比我见过的任何时候都更生气。我想告诉她深呼吸，但本能知道那样只会让情况更糟。


    “不是怎么做的，而是他什么时候可能做的？”我问。

