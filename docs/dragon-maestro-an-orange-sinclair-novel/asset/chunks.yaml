    wouldn’t have either. He showed up to over half his shifts. Kept having damn seizures
    the rest of the time, but you don’t get that kind of reliability every day!”


    “You sure don’t,” I responded when he looked at me expectantly. When he didn’t
    say anything else, I said, “Sooo, back to my question. Unexplained? Homicidal
    urges, perhaps? Storms? Magic? Miracles?”


    When I said miracles, he paused, but then shook his head and grabbed an aluminum
    spice shaker from a shelf above his head and poured a spectacular amount of a
    dark dried herb into the sauce pot.


    “Miracles?” I repeated.


    He shrugged. “Granny was hardcore Catholic. Insisted she saw a miracle every other
    day. I ain''t ever seen one.”


    “What miracles?”


    He snickered and turned to me, propping one hand on the stove and the other on
    the pink-smeared white apron spread across his girth. “You see, we bought this
    metal thing you add to a toaster that puts Jesus on the side of your bread?” He
    scratched his nose, cursed, and retreated to a hand sink by the door. I tried
    to keep my surprise off my face at his level of food hygiene and my horror at
    where he was standing so casually, right where the body had stretched. As he scrubbed
    his hands, he shouted, “I always thought the toast looked more like John Lennon
    than Jesus. You know, from their later period. Like *Abbey Road*.”


    I couldn’t summon a picture but said, “Sure.”


    He returned to stirring the pot. “My brother added that thing to her toaster every
    three or four months just to watch her declare another miracle.”


    The story was fascinating, but not the kind that would lead to a city in chaos.
    “How often did your mom come down here?”


    “Here? Hell, never. She didn’t want to cross the bridge to Jersey, let alone all
    the way down here.”


    I sagged. “So no actual miracles?”


    “Oh, I think God pulled one. We didn''t know ‘til she died that every time she
    saw Jesus, she gave another thousand bucks to that priest down the street who’d
    been diddling kids during confession for years.”


    “Ouch!” I said, feelingly. “I mean, I’m sorry. My listeners will be so fascinated.”


    “Half our money went to toaster Jesus.” He started stabbing at the pasta sauce
    rather violently, sending splatters flying. I had to do some more water defense
    but directed them toward the floor. His face heated, matching the sauce. “That’s
    the only miraculous thing I ever seen.”


    Worried about the pile of sauce I was creating, I rocked backward, and a chime
    sounded. Technically, I had started to leave, and the bargain thought it was fulfilled.
    “Thanks for your help!”


    I backed towards the swinging doors before he threw another pot. Everything I’d
    heard pointed to the fact that he was a victim of this phenomenon, not its instigator.


    I told everybody not to notice me and slid under the swinging doors like I’d done
    on my last brief visit so I could avoid the real true-crime podcaster. I looked
    around the dining room, and I was shocked to see Scharf greeting Hassan Bishara
    just taking off his coat by the front door.


    “Hey!” I said as I dashed over. Scharf nodded, but Hassan didn’t. I started to
    get offended before I remembered I was invisible.


    I squinted, trying to get only the two of them to notice me and nobody else. It
    was possible, but it wasn’t easy.


    “Hey!” I tried again.'
