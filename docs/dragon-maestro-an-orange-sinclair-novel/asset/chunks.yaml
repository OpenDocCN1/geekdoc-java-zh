- fmt: '

    She maneuvered around a Circle line bus, the cleaner, cheaper buses DC created
    for tourists that only went around downtown because the people living and working
    in the suburbs didn’t need cheaper, nicer transportation.


    I really was grumpy. “Am I going to interrogate one of the premier interrogators
    in the FBI? Because I don’t think that’s going to go well.”


    Scharf shook her head. “I’d *love* to get the truth out of him, but one of your
    bargains is not proof. We need evidence he did it or an affirmative confession,
    not just a denial in front of you.”


    I watched a big SUV with embassy plates play chicken on the ice with the other
    cars at an intersection. Fortunately, before we had to try to get through ourselves,
    Scharf turned into a parking garage halfway down the block. I hadn’t realized
    we’d arrived.


    Her office was in one of the ubiquitous buildings downtown with a clothing shop
    on the bottom floor and a variety of lobbyists, lawyers, and other esoteric private
    and government businesses on the floors above, including one of the DC FBI field
    offices. It was a small set of cubicles and conference rooms on the fourth floor.


    FBI Headquarters were right on the National Mall in the Hoover Building, but she
    was assigned to the local violent crimes office, a field office like hundreds
    around the country that happened to be next door to the national headquarters.


    We made our way to the fourth floor through the beige hallways.


    “You should probably…”


    “Invisible. Oh, I know.”


    I told the world not to notice me but did not tell Scharf that Mrs. Henderson
    would see me regardless. Scharf swiped her wallet at the keycard machine at the
    end of the hall and led us into chaos.


    Somebody shouted into a phone; I dodged out of the way of one running agent, and
    some bigwig in a suit was bellowing in his office beyond felt-walled cubicles,
    all buried in towers of paper and aging computers. I headed to the right to another
    glass door that said, “Violet Crimes.” The *N* had long since fallen off the door.


    Now people were calling her office “purple” on purpose. Scharf’s unit was gaining
    a reputation as the place to send inexplicable crimes: bodies that didn’t quite
    look human or people who’d been killed for no obvious reason.


    It was probably a good thing their admin was a goblin.


    To most people, she looked like a little person with brown skin, long black hair,
    and a serious fondness for gold. To my eyes, she looked like an olive-green goblin
    with long, pointed, and ragged ears, and sharp teeth.


    Mrs. Henderson had known my father and helped a lot with the previous case Scharf
    and I had worked on. I’d never seen tip nor tail of Mr. Henderson, but she insisted
    on the honorific. Scharf gave her a nod and moved to her felt-walled cubicle behind
    her.


    Scharf logged onto her wheezing computer that still had an off-white monitor that
    took up half her desk. I didn’t follow.


    When I cleared my throat, Mrs. Henderson looked up and groaned. I was looking
    forward to seeing her again but stopped short when a terrible thought occurred.
    She was a goblin. “D-do you want to challenge me?”


    Her groan turned into a smile. She said in a scratchy, low voice, “So it started?”


    “You don’t want to challenge me?”


    Scharf stood up, and I got ready to go, but she went to the printer wedged into
    the back corner of her row of cubicles, waiting for sheets to spit out at a glacial
    crank.


    Mrs. Henderson shook her head. “I won’t be in line for weeks yet.”


    “Scharf? With me.” We all looked up at the linebacker-sized dude standing in the
    door of an office crooking a finger at Scharf.


    “Sir?” She straightened, but he’d already retreated into the office. She held
    up a finger to me, bolted into the office, and closed the door.


    I looked at Mrs. Henderson. “But you’re *going* to challenge me?”


    “They start with the small fries.”


    I clenched my fists. “The last one didn’t feel very small.”


    She looked me up and down with a grin. “But you defeated him, correct? What did
    he do—jump off a bridge, drown, bury himself alive?”


    I heaved a sigh. “What am I? A gladiator at the Colosseum, fighting for your amusement?
    It wasn’t funny.”


    Mrs. Henderson smirked, her sharp teeth gleaming in the fluorescent light. “It’s
    a little bit funny.”


    Someone peeked over a nearby cubicle wall. “You okay?”


    She tsked and said, “Phone call.” She picked up and put down her receiver, then
    closed her eyes and muttered something. I felt the air shift as she opened her
    eyes. “And now I’m invisible to my own coworkers. Thank you very much.”


    “How is that my fault?”


    “What do you want?” She meant: *go away.*


    I took a deep breath, my rage stirring and the edges of my vision going red. Fortunately,
    my dismay made the red retreat. Mrs. Henderson wasn’t challenging me, and she
    was Scharf’s administrative support. I couldn’t punch her face in. “Sorry to ruin
    your fun, but I challenged the Lubber Fiend.”


    Her face lost color, turning an unhealthy lime green for a second. “The *Lubber
    Fiend*?”


    “Yeah! The dude who first challenged me said I could go right to the top.”


    “You need to practice first! Hone your fighting skills. You can’t start at the
    top!”


    “I don’t want to spend the rest of my life fighting my father.”


    I examined the backs of my hands, thinking of the djinni. “It’s always fire. We
    always get burned.”


    She arched an eyebrow. “We?”


    “Scharf.”


    “Well, keep her away from the Lubber Fiend. And keep him away from here.”


    The shouting escalated, and I recognized Scharf’s voice. *Scharf* was shouting.
    At her boss. We had to fix the weather, or she wasn’t going to have a job soon.


    Mrs. Henderson worried her top lip. “In fact, you should get out of here now.”


    I didn’t move; I merely ran one pointed nail over my knuckles. “How did he die?”


    “The Lubber Fiend isn’t dead. You’re going to have to do that.”


    I stood up. “I meant my father.”


    The gleam left her eye.


    “I got a letter telling me about the box,” I said, “saying it was my inheritance
    upon his death, but that was it.”


    She slumped at her desk. “He was here in DC, fighting. He was always fighting.
    I don’t know who finally beat him. I’m amazed he lasted so long.”

