    The men stopped their dance and I tried to get a quick count; it had to be almost
    two dozen guys. They stood at attention, each near a different display. A few
    stuck their hands into their bags.


    A hand appeared in view. Its owner stood just under the camera and that’s all
    I could see of him. Fingers snapped.


    The men threw dirt into the air and snatched at the artifacts, one carrying the
    entire wall of tile by himself. They were far shorter than I was, probably around
    four feet tall, which meant they were insanely strong or had earth magic like
    me. They didn’t `look` like goblins.


    Now the room reacted with gasps and shouts.


    “Play it back!” Lee demanded.


