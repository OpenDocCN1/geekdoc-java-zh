    day at two on the West coast, I called my mom. It was her best time of day. She’d
    have lunch but wouldn’t have dealt yet with the discombobulation of “group activities.”


    I braced myself, pasted a smile on my face, and hit the number.


    “Hello,” a woman said. “Good Rest Home, Sharon Sinclair’s room.”


    I frowned at the phone. “Who is this?”


    “Who is this?”


    “This is her daughter, Orange.”


    “Oh, Orange. This is her nurse, Harriet.”


    “Could you put her on the phone? I always call at two.”


    “I’m afraid not.”


    “What?” A few really weird things had happened. A goblin had died; my recipes
    had failed, and now the torture of saying hello to my mother who didn’t remember
    me would not happen? “Why not?”


    “She grew extremely agitated after your last call. It’s affecting her recovery.”


    “What are you talking about? She isn’t recovering.”


    “She’s making excellent progress.”


    “You mean she hasn’t forgotten an entire food group between this week and last?”


    A brief silence followed. Yep, this aid was new. They burned through home aids
    monthly, and it always took them a second to get used to me. “Well, that is to
    say, there is no further deterioration in her condition. Her memory remains stable.”


    “Stably gone?”


    Her voice was prim as she said, “You could call her doctor to discuss this. Maybe
    we can try again in a few weeks.”


    I couldn’t believe this. “You’re genuinely not going to let me talk to my mother?”


    “Orange, we all want what’s best for her.”


    “I don’t understand what’s different about today.”


    “The doctor will speak with you tomorrow, okay?” When I didn’t respond, Harriet
    said, “You have a good day now.”


    She ended the call. With difficulty, I resisted throwing the phone across the
    room. Instead, I tucked it in my pocket, then threw a spoon across the room. It
    clattered to the floor and took the pile of Washington Posts on the table with
    it. The avalanche sounded like music.


    “Hey!” Scharf dodged the newspapers as she stepped into the tiny space.


    “Sorry.” I rolled my neck. “You shouldn’t sneak up on people like that.”


    She laughed, but it wasn’t a cheerful sound. Now that I could get a proper look
    at her in the kitchen''s light, I was shocked.


    She looked like someone had punched her twice, producing pronounced dark circles
    around her eyes. She wore the bottom half of a suit and an untucked white button-down
    shirt. Her hair was still wet from the perpetual storm.


    She sat down opposite me on the floor against a cabinet. “What smells good?”


    “Orange scones.” I glanced at the oven. “They *do* smell good, right?”


    “Yeah. What’s in them?”


    The scent of citrus and caramelizing sugar infused the air. “Um, oranges?”


    “Oh.” She peered into the oven for a second. “I thought you meant they were your
    recipe.”


    I smiled, thinking again about my hometown bakery. “It’s from the man who taught
    me to bake. They’re my favorite.”


    “They smell great.”


    “Thanks.”


    Unwilling to meet her eyes, I picked out a stray thread in the seam of my jeans.
    As our last conversation scrolled its way through my head, I winced at some things
    we’d said.


    “I didn’t for one second think you killed him,” Scharf said, running a hand through
    her disheveled hair.


    I nodded. “I didn’t think you thought I killed him.”


    “It’s just—there are procedures to this, and I can’t ignore the fact that you
    knew the victim.”


    My anger sparked a little, but I took a deep breath and said, “I get it.”


    This was Scharf I was talking to. Of course, she was going to be upset when the
    rules got twisted around. I slowly stood up and pulled out the scones. I looked
    around for plates but didn’t want to break the spell, the first kind words we’d
    exchanged in days. I dropped an oven mitt on the floor and lay the pan of scones
    on it. Then I plopped next to them and leaned against the oven door again, savoring
    the warmth.


    As an experiment, I used magic to pull a scone off the baking tray, and it obediently
    rose into the air. I could *feel* the scone the way I felt my foot. When I stretched
    out this weird sense, I could also feel the house and the stones beneath it. I
    blew out a breath in relief.


    Scharf grinned. “Thanks.”


    She snatched it out of the air and tossed it from hand to hand to let it cool
    off a bit.


    My goblin half and my human half had bargained in a moment of desperation: my
    human life for my goblin power. I had thought that meant I’d go on my merry way
    with access to my magic anytime I wanted. But I now knew the bargain’s definition
    of living was a little narrower than mine. It did not include nearly killing myself
    investigating crimes, but it included my favorite scones. Good to know.


    I tried to lift a second scone for me, and it lifted a few inches before it toppled.
    Baking one tray of scones, doing something I loved, had allowed me to gain a teeny
    piece of earth magic.


    I pulled it off the tray with my fingers, wincing when my pinkie brushed the burning
    tray; I didn’t have my magic to harden my skin against the heat. Sighing, I sank
    into the oven for my first blissful bite. My headache cleared as the sugar hit
    my stomach.'
