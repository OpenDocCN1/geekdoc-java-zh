    “The eye. The center?” He was only confused for a second before he went for me
    again. I dodged away and landed on my feet. The street was clearing, and I had
    a little bit more room to work.


    “Where in actual geography?”


    He shrugged. “Where I killed him.”


    “The source is a dumpster in an alley?” I asked, deflated. Then a sudden light
    dawned. “Not the alley, the pasta shop. Is it in the pasta shop? Whatever is doing
    this?”


    The Lubber Fiend reached for my neck. He’d made up his mind.


    His hands met my burned skin, and I lost my footing as pain flared white-hot along
    my collarbone.


    “Get off her!” somebody yelled.


    I heard a shot and the fiend reared and roared. The crowd erupted, screaming to
    get away. Behind the fiend, I glimpsed someone with the biggest shotgun I had
    ever seen.


    I curled in the fetal position, terrified I would be next, but no second gunshot
    followed.


    I rolled on something hard and pulled it out from under my ribs. It was a bright
    green toy bean bag that looked like a jellyfish with a tiny head and little strings
    dangling off it for legs. “What the?”


    I looked up. Carlisle stood cradling the huge gun, a pouch of the little green
    bean bags in his hand. It was a bean bag gun.


    “Carlisle?” I asked as he lowered the gun, oblivious to the screaming crowds.


    He glanced at me. “Orange? Scharf’s shadow? I should have known.”


    The fiend erupted off the pavement, one arm dangling, and tackled Carlisle, who
    collapsed beneath him in a crumpled heap.


    I leaped on his back, forcing all of my magic into his bruised shoulder.


    The fiend screamed, drowning out the protest and the pounding feet and everything
    else. He reared up and lumbered away, sparing me only a snarl on his way past.


    I bent down to Carlisle, straining to turn him over. He was limp.


    I jammed my fingers to his throat, trying to find his jugular. That was an easy
    feat in a CPR class that does not at all prepare you for a floppy, unconscious
    man in the middle of a riot. I heard the crash of glass, leaned over to shield
    his face, and felt a whoosh of breath on my cheek. He was not moving, but he was
    not dead.


    As the crowd scattered, I heard the march of boots and used the last of my strength
    and my one good arm to drag Carlisle out of the middle of the street to the gutter
    by a bus stop and told the world to forget us both.


    <<<>>>


    It took my breath away how quickly the street turned into a crime scene, the riot
    gear giving way to technicians and ambulances. When the level of energy vibrating
    around us had subsided to merely irked, I took a deep breath, regretting this
    already, and went visible. “Over here! Hey! Help! He’s an FBI agent!”


    A medic in a blue uniform jogged over. So did Detective Lee in a bright puffy
    coat, clearly new. I was so used to the trench coats it took me a moment to recognize
    him.


    “Orange Sinclair,” he said sadly.


    I shook my head, “Oh no, you’re not arresting me again. I was saving him! And
    I got hurt, not the other way around.” I lifted my burned shoulder. The pain had
    dimmed considerably, but it still looked pretty ugly.


    “Orange!”


    I glanced over as Scharf came running. She’d acquired another bean bag gun too,
    or maybe she had the real thing. I couldn’t tell the difference.


    “I’m okay!”


    “What happened?” She looked me up and down, lasering in on my shoulder. “I told
    you to stay put!”


    “She’s with you?” Lee asked, his arms crossed.


    Scharf pivoted, keeping her gun pointed down and away from both of us. “Lee?”


    “I need a stretcher here!” the medic said, and Scharf looked down.


    “Carlisle!” She crashed to her knees, expertly jamming two fingers into his neck.
    She looked between the two of us. “What happened?”


    Lee looked at me, arms still crossed.


    “I don’t know! I…” fought a giant red goblin that Carlisle saved me from. “I found
    him on the ground and tried to keep him safe.”


    “And your arm!” Scharf said, pivoting to me and peering at the angry flesh on
    my shoulder. It had gone from blistered to bad sunburn in the past few minutes,
    which meant I’d be okay. Not that the screaming pain was any sign. “Something
    hit it. Something really hot. I don’t know.”


    “Something really hot?” Scharf asked.


    “What are you doing here? Both of you?” Lee asked.


    We jumped out of the way as a medic rolling a stretcher joined the one on the
    ground, and they heaved Carlisle onto it.


    “I should probably go with them,” Scharf said with no enthusiasm.


    “He hit his head when he fell,” I told her. “He’ll probably be okay.”


    “I thought you found him on the ground,” Lee said.


    “From the goose egg on his head, that’s what I am guessing! I’m not a suspect.
    I’m a consultant with the FBI. I was trying to help.”


    “What happened?” Scharf asked.


    Lee looked around. “We all got pulled in.”


    I followed his gaze. Most of the wounded were getting loaded into ambulances or
    getting taped up outside the open doors of one. More law enforcement milled around,
    questioning people, dealing with a few in handcuffs.


    “Let’s do what we do,” Scharf said.


    I cocked my head at her, like she often did to me, summoning her away. I stepped
    under the awning of an Irish pub. Lee shook his head but didn’t follow.


    “What is it, Orange?”


    “You can’t do what you do. We have to go.”


    “Orange, the fork can wait. Fuller can wait.”


    “I know who it is!” I said, resisting the urge to tug on the sleeve of her jacket
    to get her to listen.


    “Who?”


    I shook my head. “Not the murderer. The…” I pointed to the now completely smoke-filled,
    bloody street. “The this.”


    # 17


    As we walked, I peered into every doorway and at every person who passed us, ready
    and waiting for them to produce a gun and shoot me, or each other, or do something
    else crazy. I didn’t know exactly what was causing this run of crime and death,
    but we were heading right into its lair. Anyone who spent any time here would
    be affected.


    My shoulder pulsed with each step, but the bubbled skin was numb now, soothed
    by the icy rain and my shock. My heart beat fast in my chest and the edge of my
    vision pulsed, but I willed myself not to pass out as we jogged by restaurant
    after restaurant toward the pasta shop.


    Scharf seemed oblivious to her surroundings, but that couldn’t be true. As soon
    as I had that thought, I saw she was scanning constantly, her hand by her weapon.
    The usually fidgety energy that infused her second of the day had focused.


    “So it’s some kind of creature?” Scharf asked.


    “Yes. That’s making everything happen.”


    “But you don’t know which creature?”


    “We don’t come with luggage tags!”


    She took a deep breath and relaxed her hand by her side. “So I just walk in there
    and ask Joe if he’s doing magic that’s wrecking the city?”


    “Yes?” I looked up into the spitting sky. Was I supposed to fight a creature who
    could do this? That was not going to go well. But if not a fight, how would we
    get him to stop?


    When my nails pierced my palm, I realized I was wringing my hands. I had forgotten
    to cut the tips, and they’d grown into points. I wiped at the smear of blood and
    shoved my hands in the pocket of my leather jacket.


    We didn’t have to fight. We just had to find out what he was trying to get with
    this stunt and give it to him in exchange for… all the music and sunshine in the
    world. “What do I have that is worth that?”


    “What?” Scharf asked.


    I shook my head and sped up.


    We jaywalked across the intersection at the end of the street of restaurants to
    approach the shop. This far from the arch, there were only a few fleeing protestors.
    We even passed a few workers in suits with lunch in their hands, normality clinging
    to the edges.


    One guy in a black trench coat stepped out of Pasta Joe’s as we made it to the
    door. He held it open for us to duck inside.

