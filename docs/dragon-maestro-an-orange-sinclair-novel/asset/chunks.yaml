  raw: '“I’m not sure.” I shrugged uncomfortably. “A goblin died in an alley today.
    I didn’t really know him,” I added when I saw her eyes round. “But it wasn’t a
    human who killed him—it was something more powerful. And beyond that, everything’s
    going wrong. Scharf fell apart today, which she never ever does. It feels like
    I’m making it all up, but—”


    “It’s not your imagination. This is nothing I’ve ever encountered before. I’m
    so angry I let him get to me.”


    “It’s a him?”


    She narrowed her golden eyes. “I can’t be sure. But I think a female would be
    a little more vindictive.”


    “I thought you would have said nicer or something,” I said, gingerly sitting on
    the multi-colored quilt.


    Juya harrumphed. “Let’s just say that if I wanted to ruin the city, I wouldn’t
    be so slow about it.”


    “Ruin the city? Is that what he’s trying to do?”


    Her head lolled, and she forced herself into a sitting position. “That’s what
    he is *doing*. The world’s turning cold. I don’t like the signs.” She looked at
    me, and I noticed many of her wrinkles had disappeared. Oh, her skin still looked
    like old tree bark, but it was a healthy tree again. “I would tell you to stay
    away, but you won’t.”


    “Of course, I won’t. For one, I still owe Scharf, and she definitely won’t stay
    away. And for another, I gotta stop this thing before you get hurt. More hurt.”


    “I’m strong enough.”


    Her gray skin and clammy brow belied her words. “Yes, of course, you are.” I looked
    at Osman. “Is she?”


    He said nothing.


    I wanted to ask what to do about “him,” but she was already losing the burst of
    energy she’d summoned. Whatever he was, it was taking all she had to fend him
    off. I didn’t hold out much hope for myself. “Will you be okay?”


    “Absolutely.”


    I sighed. “I’m going to come back here and make a deal with you, so I know if
    you’re lying.”


    Through gritted teeth, Juya said, “For a while, I can hold on. If I knew what
    I was fighting, it would be easier. But *m’hija*, that was not a suggestion for
    you to go find out.”


    “I challenge thee!”


    Everyone froze.


    “No, not right now!” I basically flew to the window. As I pulled aside the diaphanous
    pink curtain, I gasped.


    Goblins are small. Mrs. Henderson, Scharf’s office secretary, passed for a little
    person with her glamour on. And I’m shorter than everyone I know except her.


    The thing standing in Juya’s courtyard, however, would have to duck through door
    frames. His skin was leathery and red. His head was wide, and his ears extended
    several inches on either side, their ragged lobes dangling. He wore jeans and
    a sweatshirt, and his greasy hair was caked in ice.


    “I challenge the *Peallaidh*!”


    I squinted. They kept saying that. “Let me guess, the Lubber Fiend?”


    He roared.


    “I’ll take that as a yes.”


    He cracked his knuckles, and I rolled my eyes before closing them to summon my
    magic.


    I found—nothing.


    I opened my eyes as the creature’s footsteps sent cobblestones trembling.


    I stumbled away from the window and tripped over the rug. I crashed onto my back.


    I flipped, human slow and uncoordinated, to my hands and knees and scrambled out
    of Juya’s room. If he closed in on me, he’d have me trapped up here.


    “Lock the door!” I told Osman as he followed me to the threshold. I slammed the
    door in his face and repeated. “Lock it now!”


    I dashed for the stairs, knowing I’d only have seconds to flee. Without my magic,
    this was going to be a real short fight.


    When the Fiend knocked the front door down, I ran out of time. I tried to make
    it anyway, sliding down the banister.


    “I don’t accept!” I cried in desperation and spun around the newel post at the
    bottom, trying to get to the back of the house and away.


    He growled as he got a hand on my jacket, but I wrenched free and sprinted past
    the kitchen.


    “What happens if I don’t accept?” I said, “I just won’t fight!”


    With my earth power, I mentally reached for any of the dozens of metal implements
    in the kitchen. But nothing flew into my hands.


    Then I tried my hob powers to tap into human emotion—my own, in this case, since
    half of me was the only human around. The rage and fear and despair welled up
    in me but didn’t translate into power of any kind.


    The beast jumped the length of the hallway, ratty hair swinging and fingernails
    raking down my back, but he didn’t get a purchase on the leather. I kept running
    but had to twist when a burst of flame whooshed by my head. I glanced back.


    Fire bloomed between his fingers. The ice crystals in his hair melted in an instant
    and dripped over the rest of his burly frame.


    “Nice trick.”


    He thrust his hands at me, and the fire whipped from his fingers. I dove for the
    floor.


    As the Lubber Fiend cackled like the goblin he was, my throat went dry. If he
    landed any fire on me, it would be all over in a second since I didn’t have my
    magic. My heart sounded like a hummingbird in my chest. What had happened to my
    magic? What was wrong with me?


    He let loose a blast of flame that singed my hair as I dodged again.


    *I’m going to die*, I thought. Hadn’t Everglades said the apex fight was to the
    death? A *real* death?


    As the Lubber Fiend jumped for me again, I dodged again, and he ended up on his
    face.


    I ran. I had no idea if there was a rear door, but most DC townhouses were long
    and thin with an entrance front and back. I dodged right and left and scrabbled
    toward the only rear door I could see.


    My nemesis roared behind me.


    I dashed through and slammed it, muting his growls. I was in a mudroom full of
    dripping jackets and boots, and I blessed the anemic sunlight shining through
    an outer door at the back of the house.


    “Come on, come on, come on,” I muttered to my magic as I ran for it.


    An explosion of lightning and a crack of thunder boomed outside the windows, and
    the house lights flickered and went out, plunging me into darkness. I looked behind
    me and stopped.


    If I went out that door, he’d tackle me in seconds.


    I opened the door but didn’t go through it, and instead threw one of the random
    shoes from the hallway down the steps into a narrow alley with a few fancy cars
    parked near the back doors. Then I buried myself amongst the coats. As the inside
    door burst open and the Fiend flew through, I had time to put one boot in front
    of my legs.


    Could goblins see in the dark? I couldn’t. He passed within inches of me, growling
    his way toward the exit.


    In his misshapen face, I saw the reason goblins were called the beasts of the
    magical world. The Lubber Fiend looked like a red, marauding water buffalo walking
    upright.


    He paid no heed to the coats or me, though I almost threw up when he kicked the
    boot in front of me on his way out. He lumbered into the rain and away.


    I counted to thirty and then to sixty, nerves shrieking, human senses telling
    me nothing except that I was freezing and wet and the rain was loud outside the
    door. Without my magic, I was a sitting duck. No, worse, a sitting human. A duck
    could have flown away. I forced more oxygen into my lungs, telling myself not
    to pass out from the fear.


    When he didn’t circle back, I slipped out of the coats to slam the back door and
    hid again, calling on the orange line that magically told me the route to safety
    wherever I was.


    Nothing happened. I didn’t know the way home.


    When the inside door opened, Osman found me clutching a boot in front of me like
    a weapon, piled with coats.


    “*Que pasa*?” Osman whispered and then licked his lips and asked in a stronger
    voice, “What was that?”


    I took another gulping breath. “All it wants is me, and I’m going.”


    I didn’t know how to get home and I didn’t want to wander the streets with that
    thing on the loose, so I brought up a rideshare app and requested a driver who
    happened to be one of the few other humans on earth who knew I was a goblin.


    I crouched down amongst the coats. “Go upstairs, barricade the door. I’ll be gone
    in ten minutes, and you’ll be safe.” I hoped they’d be safe. They had to be safe.


    “But…”


    “Go!”'
