    “Let’s go,” she repeated and jogged towards her sedan.


    I glanced back at the building once and followed. She didn’t turn the car on but
    just said, “He’s a sociopath. He’s incapable of feeling anything.”


    I twisted to poke her in the arm. “Exactly! I mean, he can fake it, but he’s not
    genuinely happy. So, I didn’t hold up my end of the bargain. And now I `fascinated`
    a serial killer!”


    “What if he isn’t a serial killer?” Scharf said, fastening her seat belt. “What
    if he’s telling the truth?”


    I shook my head. “I don’t know anything anymore. He might be innocent, and we
    have locked up the wrong man. Or Fuller did it to return to his former glory.
    Or someone else copied Hastings—someone we haven’t even met yet.”


    She started the car, then slammed the steering wheel with her palm. “Hell, I could
    have done it.”


    That alarmed me for half a second before I remembered I was her alibi.


    I blew out a breath as Scharf continued, “And accusing yourself of murder is not
    a valid investigative technique.”


    “Right? So what should we do?” I fought my panic. *What do we do?*


    She pulled out of the parking lot at a speed that elevated my heart rate a little
    as she maneuvered toward the interstate.


    I fiddled with the radio, but there was no music anywhere. NPR came through loud
    and clear as someone explained why radio waves for music were not working near
    DC. They said it was something to do with weather, bass, and cell phones. I rolled
    my eyes. They announced the next program about the DC crime wave, and I clicked
    it off.


    “Even if he didn’t kill anyone,” I said, “I don’t think he’s in the wrong place.”


    “I don’t hear that.”


    “It’s not up to me anyway, so it doesn’t matter what I think.”


    She glanced at me. “Sometimes it’s up to you.”


    “What are you talking about?”


    Scharf sped up carefully in the icy, wet weather as we got on the highway, heading
    south. In my secret heart of hearts, I was enjoying the ice on the roads with
    Scharf behind the wheel. But with such treacherous conditions, she drove like
    a normal insane DC driver—a vast improvement.


    “There are some creatures who don’t break the law because there aren’t any laws
    for what they do. And then you step in.”


    “Oh, no. I don’t want to play judge, jury, or executioner. Especially not that
    last one.”


    She shrugged. “You’ve already done it.”


    “When?”


    “With the `djinni.”


    “He deserved what he got.”


    She raised an eyebrow, and I sighed. “Touché.”


    Scharf gripped the steering wheel hard. “Whoever took out that goblin behind the
    teashop isn’t human, right? How will we lock up the killer if he possesses that
    kind of strength?” Scharf hooked a thumb behind us. “That was a Supermax. The
    strictest protocols we have. Could you have gotten out of there? You’ve already
    escaped one prison.”


    “As you pointed out to me at the time, I wasn’t in prison. I was in jail in Metro
    Police custody. But to answer your question, sure. It would have taken me fifteen
    minutes to get out of there. I would’ve followed you out.”


    She smiled and maneuvered around a trundling semi.


    I couldn’t let this go. “I don’t know how to punish rogue goblin killers. How
    do I make sure it’s fair? Why is this my job?”


    “Aren’t you the leader of goblins? Don’t you guys have a court of law or something?”


    “Fairies have courts if the stories are right. Two of them. If goblins ever got
    organized enough to hold trials, it would involve tons of cleaning and a severe
    amount of sugar.” I flashed her a smile. “Not any kind of judgment. And I don’t
    think ‘leader’ is the right title.”


    “*Peallaidh*, or whatever your title is, you’re making the calls, right?”


    I slumped in my seat. “Nobody will tell me! It would unfairly balance the challenge,
    I guess. It sounds like all that the goblins need now in a leader is a punching
    bag to test themselves against. Until I can prove I’m better than all of them,
    they’re leaving me out of things. Or is it stronger? I still don’t know the criteria.
    For all I know, my challenger and I could both enter the Olympic decathlon and
    throw javelins and shoot people, and then we’d know.”


    Scharf laughed. “I don’t think there’s shooting in the decathlon.”


    “Then what’s the shooting one?”


    She thought for a second. “That would be the biathlon: shooting and skiing. The
    decathlon is running, high jump, shot put… I forget the rest. Summer Olympics.”


    “I can’t even keep the winter and summer Olympics straight! What the hell’s wrong
    with me?” I told myself that my foul mood was artificial, but it didn’t feel like
    that.


    “You’re doing great, Orange. Hastings is a bad guy. It took the FBI years to track
    him down and put him away.”


    “You’re thanking me for failing. Thank you for thanking me for failing.”


    She turned toward the beltway around DC, and we fell silent as she merged onto
    the ten-lane road. When we were thoroughly stuck in a mile of backed-up vehicles,
    I realized why Jack would want to commit homicide after any length of time in
    this. Workers had obviously de-iced the huge road that encircled the city, but
    it was already building up again. I’d read something online about how many millions
    it had cost the city to keep the ice at bay over the past few days.


    When she missed the exit for downtown, I frowned. “Aren’t we investigating things?”


    She shook her head. “Oh, no, we have something much more important to do.”


    “More important than finding the killer, or both killers, and the ice storm instigator?
    All of whom might be the same or different people.”


    “We’re going to do something fun.”


    “Who are you and what have you done with Scharf?”


    “That was our turn back there,” Scharf answered. I looked behind us at the retreating
    exit. “I couldn’t make myself take it.”


    “What?”


    “I can’t make myself go back into the city.” She sounded more bemused by this
    than anything else. Scharf was as mundane as it got. I assumed she meant she didn’t
    want to, not that there was an invisible force keeping her from her.”

