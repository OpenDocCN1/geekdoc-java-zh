    take all the pain and fear away but knew that wasn’t possible.


    “What’s your name?” I asked again.


    “David. David Bao.”


    Scharf put a hand on David’s thin shoulder. “You work at one of these shops? I
    saw the spilled garbage. You were taking out the garbage?”


