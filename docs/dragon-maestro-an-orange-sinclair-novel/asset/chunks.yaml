    The museum exhibit was supposed to have a plethora of beautiful art, but now all
    empty displays were piled with intricate swirls of dirt and surrounded by law
    enforcement officers with an alphabet soup of abbreviations on their backs.


    I whispered, “Scharf!”


    A black head of short hair popped up, and Special Agent Laura Scharf headed my
    way. She wore a blue nylon blazer stamped in yellow letters spelling out `FBI`
    over a white button-down shirt and black suit pants.


    She smiled for `.2` seconds. “Glad you could make it.”


    “Where’s the fairy?” This was the bargain we’d made: I help her with supernatural
    crimes in exchange for not arresting me. Whatever sadistic scorekeeper in my head
    that kept track of these bargains had decided the scales were not balanced yet.
    But the complete lack of fairies, djinnis, dragons, or goblins in the room meant
    this was outside of my jurisdiction.


    Scharf shooed me back out of the exhibit and dangled pairs of gloves and booties
    in my face. I sighed and put them on. I’d lost the thou-must-wear-gloves argument
    at our first crime scene together a few months ago.


    “Thanks for coming,” she repeated.


    “There is absolutely nothing magical about stealing a bunch of dirt.” I pointed
    a gloved hand at the general melee.


    “Lee is getting a nose for these things. When he said it was something special
    for me, I believe him.” She gestured to a familiar man in a ratty blue blazer
    looking at an empty pedestal in the glare of a police light. Though he had no
    letters on his back, I knew he was `Metro PD` because he was the first person
    to arrest me when I got to `DC`. It had been a rough year.


    Technically, he arrested me on New Year’s Eve, so this year was going better?
    In three months I’d destroyed Union Station, got arrested, and almost got killed
    three times by a djinni, a goblin, and a dragon. This year was not going better.


    I crossed my arms. “Lee thinks I’m your quirky roommate who should be in jail.”


    She raised an eyebrow. “My expert consultant who occasionally, with no one the
    wiser, sleeps on my couch. And a Presidential pardon, so no more getting arrested.”
    She stopped before reentering the archway back into the empty exhibit. “Unless
    you’ve done something else he should arrest you for?”


    I shook my head vigorously. I cast my mind over the last few weeks; it was even
    true. Since I’d defeated the challenger for my father’s throne, it had been a
    quiet month.


    My father had been the king of goblins. From him, I’d inherited a box I still
    couldn’t open, a multitude of hobgoblin powers I was still figuring out, and his
    kingdom. Though that didn’t seem to be as big of a commitment as I thought, which
    shouldn’t have surprised me. Goblins don’t really go for group activities.


    Scharf waved at Detective Lee who was now speaking to somebody in a full-body
    white jumpsuit.


    Scharf took a slow deep breath and said in her `FBI` voice, “Orange.”


    “Seriously, what am I doing here? I can’t help gather evidence! Or magically divine…
    Whatever was in here.”


    “Irish arts and crafts.”


    I felt a whisper of disquiet when I heard Irish. I tugged at my very orange curls.
    My father was from Scotland, as were many magical creatures. I don’t know why
    we collected on tiny islands in the North Atlantic. I personally suspected it
    was the mist. You can get away with a lot of magic when it’s foggy.


    `Washington DC` is not very foggy. Grey, cold, with this spitting sleet that TV
    weather personalities called “wintry mix,” but not very foggy. So if the Irish
    were involved, there was an outside chance this was magical.


    Except… “This is the American History Museum. Why is there a display of Irish
    arts and crafts?”


    “Irish-American arts and crafts,” Scharf said, “Made by immigrants or descendants.
    That part’s not clear.”


    My shiver died. “Sticking an infinity knot on a jug does not make this Celtic
    art.”


    There was nothing Irish about Scharf. She was German pale with black hair and
    stubborn cheekbones. Actually, every one of her bones was stubborn. Her stick-up-the-ass
    posture came from her time in the army though, not her heritage.


    She took another step into the light, “We have work to do.”


    “Sure, when there’s another murdering creature on the loose, I’m your goblin,
    but this is no business of the Nnn….whatever they’re calling it.”


    “The National Taskforce on the Efficacy of Partnering with the Unexplained for
    Enforcing the Law,” Scharf said quickly.


    “I can’t imagine why I didn’t remember that. Are you going to trade your blazer
    for one that says `NTEPUEL`?”


    Yes, the word was out, at least among the nation’s top-secret agencies that there
    is a good chance not everyone on earth is precisely human. And our last case was
    just a little too dramatic to hide the fact that Scharf was closing cases with
    supernatural help. And what did our nation’s most secret government servants do
    about this world-view-shattering fact?


    If you guessed form a task force, you get a pony. In a moment of surviving-a-dragon-induced
    optimism, I agreed to join it. Well, that and Scharf sleeps with a gun. Not that
    she’d ever point it at me—again. I just wanted to mention that fact in relation
    to this decision.


    It’s just that my expertise came from eleven semesters of folklore classes from
    the anthropology degree I’d abandoned, and three months as the heir of the goblin
    king.

