    As she maneuvered south, I asked, “Why are we going to the DC morgue? Don’t you
    guys have your own? Who you are not allowed to go anywhere near,” I said, answering
    my question.


    Scharf did not comment as she pulled to the curb to park. The building was new,
    with the glass-and-metal look that was taking over the city; it went well with
    the endless cement of the 70s brutalist cement architecture. Not.


    In the lobby, Scharf flashed her badge, and I stayed invisible as we headed to
    the elevators. I thought of the last time I’d been to the morgue, on the edge
    of panic at the sight of my first dead body. How much had changed in a few short
    weeks? I’d seen so much worse than a dead body in a morgue.


    The elevator dinged on the bottom floor, and Scharf led the way to the DC Medical
    Examiner’s Office. Scharf said, “He knows you already, so no point disappearing.”
    I nodded, and she clicked open the door. Still, I kept my eyes half-closed until
    I saw the metal table in the middle of the room was empty.


    ### The FBI Agents


    Wearing a lab coat and weary smile, Dr. Robert Lange spun from his desk at the
    side of the room. His eyes looked foggy through his tortoiseshell glasses, and
    his dark skin gleamed under the sickly fluorescent lights. He was probably in
    his forties, ten years older than Scharf, and one of the definite good guys in
    my book.


    “Dr. Lange. Thank you for your time,” Scharf said, sticking out her hand.


    He shook it, then reached out for mine. “Your name’s Red, correct?”


    “It’s Orange,” I said before I remembered Scharf had introduced me as Red—and
    a fellow FBI agent—on our last visit. I winced.


    He shrugged. “I knew it was a color.”


    I cleared my throat. “You’re good with names.”


    “One would hope so. Half of doctoring is remembering what to call everything.”
    He guffawed.


    I blinked. He seemed his same cheerful self, unbothered by the rain. Though I
    didn’t know him well enough to know if it was an act.


    ### The Rising Murder Rate


    “What can I do for the Bureau? As far as I’m aware, no DC cases cross with you
    guys. We’ve been very popular the past couple of weeks, but I wasn’t aware of
    federal involvement.” He was one of the city’s pathologists and normally did not
    work on FBI cases unless they had federal charges attached.


    I frowned. “Very popular the past few weeks?”


    He nodded sadly. “We have three more enjoying our hospitality overnight. Normally
    when the weather turns, I get a bit of a break, but this spree doesn’t care about
    statistics.”


    Scharf tensed beside me. “Spree? A detective I know mentioned the thefts. I hadn’t
    realized the murder rate was going up.”


    “Oh, not your official definition of a spree, I suppose. But fifteen homicides
    in two weeks match the worst weeks in our history. And that’s not counting the
    others.”


    “The others?” Scharf and I echoed together.


    “Ten suicides, thirty accidental deaths. We’ve had to ship a few bodies to Maryland
    and Virginia.” He gestured to the wall of feet-sized steel doors behind the tables.


    “I’m sorry,” I said when the silence stretched.


    ### Requesting a Review


    “Which case were you looking at?” Dr. Lange said, sadness tinging his voice.


    “Not at DC one,” Scharf said with no little chagrin.


    When she trailed off, I said, “We’d like you to review some files.”


    I crossed my arms like she always did and widened my feet, trying to look official.
    Yes, I was physically stronger than any agent, but no one would know it from looking
    at me, and I didn’t think I could ever intimidate anyone. Even so, I tried to
    look professional.


    Scharf nodded. “If you can spare a moment.”


    “But not a DC case?” There was a wariness in his voice that was missing before.
    For all her enthusiasm about consulting with other experts, when faced with the
    task of unofficially sharing FBI business, Scharf wasn’t finding it so easy.


    ### The Restaurant Killer


    “The Restaurant Killer,” I answered for her.


    Dr. Lange’s jaw fell, and interest lit his brown eyes. “I read in the paper that
    they’d found another body in Chinatown. It went to your labs, of course. Do you
    think he’s back?” He leaned forward, rubbing his hands. “Serials are a bit of
    a hobby of mine, you understand.”


    I wanted to tell him I absolutely did not understand, but instead, I nodded, trying
    to match his enthusiasm. Again I looked at Scharf, whose mouth opened and closed,
    but nothing came out.


    “We’re seeking—second opinions?” I elbowed Scharf.


    “Second opinions.” She nodded. “On the autopsy report.”


    The interest in his eyes faded to suspicion. “You’re telling me for the first
    time in the history of the FBI that a federal pathologist wants my help?”


    “You see, Dr. Lange—” I started, my tone serious.


    “Bob.”


    “Bob…” I faded out. Not because I couldn’t come up with a lie. But because I had
    no idea what would sound plausible to a medical examiner. I glanced at Scharf.


    “Bob,” she said, “the folks at the FBI are intrigued about the potential reemergence
    of the serial killer. And they’re also understandably disturbed that we might
    have the wrong guy. The problem is, I don’t think we do have the wrong guy.”


    ### The Investigation Begins


    Dr. Lange raised an eyebrow. “You see, Dr. Lange—” I started, my tone serious.


    “Bob.”


    “Bob…” I faded out. Not because I couldn’t come up with a lie. But because I had
    no idea what would sound plausible to a medical examiner. I glanced at Scharf.


    “Bob,” she said, “the folks at the FBI are intrigued about the potential reemergence
    of the serial killer. And they’re also understandably disturbed that we might
    have the wrong guy.”


    ...He put the old ones aside and opened the two newest next to each other, one
    for Rodger Clark and one for Everglades Park. I gulped. I’d looked through the
    second file but didn’t see anything obvious that said, “This victim is not human.”


    When Lange didn’t shout something similar, I took a deep breath. Apparently, when
    goblins died, we were human enough to fool a pathologist.

