  raw: 'I rubbed two fingers by my ear to be sure I could still hear, shocked by the
    sudden silence. The constant humming drum on the windows and roofs of every building
    I’d sheltered in was gone. The dragon joined in her laughter and thunder deafened
    us.


    “Thank you very much for your beautiful music,” he said slowly, with the slight
    drawl of a DC accent.


    My jaw dropped in shock. I hadn’t consciously realized I was spoiling for a fight,
    even as I knew how imbalanced our power was and how unlikely I would be to win.


    And Amina had just stopped the rain with a lullaby.


    I crouched down to be at her level. It didn’t take much; she was only a foot shorter
    than me. “How did you know he needed a song?”


    She cocked her head. “Mr. Liu shows me his instruments. He plays really good,
    but he said he was too tired today, so I said I would sing him to sleep. Like
    my Baba does.”


    I glanced at the dragon for half a second; he hadn’t moved.


    “That was really smart!” I said, deeply meaning every word. He didn’t need fighting;
    he needed cheering up.


    When another peal of thunder shook the building and the rain began again, the
    crushing pressure in my head that everything was hopeless returned. I hadn’t realized
    how oppressive it was until it lifted for a few seconds.


    I wanted to chain Amina to the counter singing songs for a week. I wanted to snatch
    her away and tell Hassan to drive to Antarctica to get away from him.


    I noticed the serpent again because he swung his head towards me, even though
    the man hadn’t twitched.


    Running won.


    “Amina!” I said much more loudly. “That was a beautiful song. Thank you! Your
    Baba is looking for you, though.”


    She cocked her head at me. “You know him? Who are you?”


    “A friend of his,” I said. It took everything I had to pull my eyes away from
    the centuries in his gaze and smile at the little girl. “My name is Orange.”


    She giggled, and the world got a little warmer for a second. “He told me about
    you.”


    I couldn’t imagine what he would say. “Oh, that’s good! You want to go back to
    the teashop and find him?”


    “Amina!” Hassan shouted from the arch. We didn’t have to find him. He’d come back
    in.


    To my infinite relief, she skipped toward him, and I backed away from the dragon
    after her.


    “I found her!” he shouted to the room behind him.


    He murmured to her in Pashto, their native language, as he gathered her in his
    arms.


    Mrs. Bao joined them seconds later and put a hand on his shoulder.


    “No more small talk,” I said, pulling the corners of my mouth up as I shooed them
    all away from the music shop. It was a travesty of a smile, but I could not summon
    even fake amusement. “Go, go, go.”


    Hassan turned towards me, a question in his eyes.


    “I found my *problem*,” I said through gritted teeth.


    “Roger that,” he said, with the ghost of a smile, though he looked drawn. This
    close to the epicenter had to be hard on all of us.


    He bid a brief goodbye to Mrs. Bao, but this time did not linger.


    When the door chimes sounded his exit, I spun. I found myself back in the music
    shop before I could think too hard about what I was doing.


    “Why are you doing this?” I’d meant to sing a song or crack a joke but screw that.


    His dark eyes left the counter and met mine. I had to step back from the millennia
    in his gaze. If I hadn’t already known, that look alone would have convinced me
    he wasn’t human. He was as far away from human as I’d ever encountered.


    “The ice?” I asked, “The silence? The crime spree? What did the world ever do
    to you? And don’t pretend you don’t know what I’m talking about.” Even as the
    words poured out of my mouth, I told myself to sing a cheerful song or just shut
    the hell up, but I couldn’t.


    “Goblin, what tales are you telling?”


    “Why? Tell me why.”


    After a long moment, he said, “You ask why we live? Why the sun rises?”


    “Stop with the philosophy. This isn’t academic.” I pointed to the front window.
    “Real people are dying out there. What are you trying to do? Who pissed you off?
    Who…” I looked at this old creature, who flinched with each word I spoke. He looked
    nothing like a powerful, wrathful dragon. I was prepared for vengeance, but I
    had no idea how to deal with—indifference? “Who broke you?”


    He straightened, which was the first real sign of life I’d seen from him. “I sell
    instruments. Teach children. Bring the rains. Soften the hail. That is my world.”


    That may have once been his world, but it wasn’t anymore. And my questions were
    making him worse. Maybe he didn’t even know himself. *Happy thoughts,* *Orange.*


    A joke seemed a feeble option, but it was all I had. “Why did the musician join
    Mensa?” When the dragon said nothing, I continued, “He was sharp!”


    I smiled hopefully, but the old man’s expression remained lifeless.


    “Never mind.” I looked around, fighting a growing certainty that all was lost,
    that all was hopeless.


    *Unicorns and rainbows, Orange.* “If I wanted a musical instrument, which one
    should I choose?”


    “The cymbals, goblin.”


    “Got any around? We could do a duet. You’re a god of music, right?”


    He coughed and shifted on the stool. I tried to look into his eyes but found I
    couldn’t meet them again. I gazed vaguely at his wrinkled, liver-spotted forehead.


    “*Something* is different. We need to put it to rights,” I said gently since my
    magic didn’t seem to make the tiniest dent.


    “What if it is right? Before now, everything was wrong.” He reached up and plucked
    one of his odd-shaped guitars from the wall that probably wasn’t called a guitar.
    It was old and made of a pale wood I didn’t recognize with deep grooves in the
    grain. He played a note and then a series of them.


    They jarred my ears, and I was about to tell him he’d proved my point when I remembered
    that Chinese music doesn’t use the Western harmonic scale. Our music is in a major
    key that sounds cheery and simple. This went far beyond that.


    A haunting, achingly familiar yet otherworldly melody filled the shop.


    I hadn’t thought it could get better until he started to sing in a cracked, gravelly
    voice in Chinese. Immobilized, I found myself lost in that voice.


    Sometimes, while watching the Olympics or listening to an inspiring speech or
    a concert, I got the feeling I was watching perfection. Or at least as close to
    perfection as you can find in this world. The control and the nuance and depth
    of every movement seemed inhuman.


    But that was nothing compared to a god of music. Every twitch of his fingers was
    poetry, every sound a universe in itself. Tears streamed down my cheeks.


    If I lived all the centuries my father had, I’d hear nothing so perfect again.


    A string snapped on the instrument, stealing the music from me. We both stared
    at his hands, and he looked up blindly. “Silence is a music.”


    Still smarting from the raw emotion the song had evoked, I stepped away.


    “This was no new year,” the dragon said.


    “No new year?” What was he talking about?


    But then it struck me. I remembered the day this started. The day the rain fell
    and people began to hurt each other. I’d been in Chinatown at a riot. *This was
    no New Year.*


    I’d heard the jeers about DC’s Chinatown. The Starbucks and the McDonald’s with
    Chinese script on the door. The same restaurant ten times in a row. Two thousand
    dollars for a broom closet-sized studio. The genuine Chinese community of Chinatown
    was dying out or moving to Maryland, exactly like the Baos. It was a business
    district now, only interested in making money.


    And then they staged a corporate-sponsored parade. Barely anyone had come before
    a bunch of hockey fans had trashed the neighborhood. Instead of picking himself
    up one more time, he’d stopped.


    I told him the first thing that came to mind. “The music isn’t dead.” It felt
    like a lie. “Thank you for your beautiful song.”


    He didn’t respond.


    “I have other music.”'
