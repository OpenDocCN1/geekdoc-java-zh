    my expectations of a case blind me to reality. We’re in trouble with this case
    because a lot of agents are falling into that trap. You saw how they saw the body
    and, without a shred of investigation, were so certain of what happened.” She
    gestured to my ears. “The evidence is incontrovertible. Plus, something really
    strange happened one night when I was in the Academy.”


    “What happened?”


    She squinted. “I’ll tell you someday. Your walking into my life wasn’t the first
    impossible moment of my life.”


    “It’s just demons that give you the squick.”


    She opened her mouth.


    “Sorry I brought it up.”


    She closed her mouth. Still feeling raw after dropping my glamour, I found I couldn’t
    meet her eyes. I focused and put it back in place, ignoring her flinch.


    To have something else to look at, I took out my phone. I swiped my music app
    open, my stomach knotting up again. Nothing that played music had worked for more
    than a day. I hit “shuffle” and waited. The music skipped through two songs, and
    my heart sank, but finally, an old Black Eyed Peas song sputtered to life.


    Scharf burst out laughing, a genuine laugh that crinkled the corners of her dark
    eyes. She finished the scone and gestured for another. I closed my eyes and pulled
    another scone up for her from the pan on the floor. She caught it with a nod.


    A crack sounded outside, and we both flinched. It was a sound we were growing
    used to, the death of tree branches and sometimes entire trees or houses under
    the weight of the ice. But here in these eight feet of kitchen, Scharf and I had
    repaired the heart of our weird little home and our tenuous partnership.


    I closed my eyes for a second.


    “Orange!”


    “What?” I opened my eyes to find myself almost on the floor.


    “You almost face-planted into a hot tray.”


    “I have to get some sleep. Eventually.”


    She helped me sit up again and asked, “When did you sleep last?”


    I tried to count. “Uh, the day before yesterday, maybe?”


    “That’s a form of torture, you know. You can’t do that to yourself.”


    I was about to protest that I was a goblin, and I could push myself much harder
    than most people, but then I remembered the horrifying moment when I’d reached
    for my magic and hadn’t found it and nodded. “Yeah. I just have to check my box
    and I’ll rest. The gnome is getting it.”


    “So your magic is in the box?”


    “No!” I thought about that one. “I don’t know…”


    She bit her lip to hide a smile. “You still haven’t opened it.”


    I shook my head. Might as well get all the humiliation out of the way. “My challengers
    seem to *believe* I got it open, which seems to be all that matters.”


    “Obviously not, since they’re still attacking you!” She took a breath and leaned
    back. “And I can’t believe I’m just casually talking about assault and battery.”


    I ran a thumb over my knuckles and shuddered. “They don’t want the box. They want
    to make sure I’m worthy of the box? Or of them?” I shook my head. “Apparently
    when goblins get a new leader, instead of telling her where the stapler is or
    even just saying hi, they have to challenge her to make sure she’s worthy. It’s
    really fun.”


    “Cookie now, please!” The gnome said from the doorway, holding my box, which was
    almost as big as he was.


    I offered the tray of scones, but he wrenched the box away. “That’s not a cookie!”


    I groaned.


    Scharf reached for the box. “Give me that.”


    “Nooooo!” he said, hopping from foot to foot.


    “I’ll find a cookie!” I said and rolled to my feet to dig through my stash.


    “Ha!” Scharf said, and I turned to see the box in her hands with the gnome dangling
    from it.


    “Your bargain is forfeit!” the gnome squealed.


    “I know, I know,” I said and opened another cupboard. “Do you have a cookie?”


    I turned when Scharf said nothing. She’d gone three shades whiter. “Orange.”


    “What happened?”


    “I was grabbing it…”


    “What happened?”


    “Cookie, goblin!” the gnome said, breathless from holding on.


    I grabbed it from Scharf, shaking it so the gnome fell to the floor. I looked
    it over frantically, from the letter taped to the bottom to the intricate carvings
    on the top and sides. It was the size of a breadbox but flatter. “It’s fine. It’s
    here and it’s fine. What’s the problem?”


    Scharf reached out and caressed the right side of the box. I heard a click, and
    the blood drained from my face. She turned the box sideways. One carving of what
    looked like stairs marching from the bottom of the box to the lid sank into the
    wood. It was some kind of button.


    “Oh, my God.”


    Scharf laughed.


    “How did you do that?” I asked.


    “I pressed it. Accidentally.”


    “I want a cookie!”'
