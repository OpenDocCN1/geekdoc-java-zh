    Mr. Bao shrugged helplessly. “She watches *Law and Order.*”


    Scharf gave a curt nod. “Yes, I''m sorry.”


    “We—” Mr. Bao started.


    “Not done yet!” I insisted. Until the chime in my head signaled, there was no
    bargain between us, and I would not know if they were telling the truth.


    “Does that sound like a deal?” Scharf asked.


    “Oh, of course,” Mrs. Bao said and shifted uncomfortably.


    “Yes,” Mr. Bao said, and the chime sounded.


    “Good to go,” I told her and sank onto a stool at the end of the counter.


    “Your… Your yesterday?” Scharf repeated.


    “We were open all day,” Mr. Bao said. “Busy with the celebrations and packing.
    Many people came for tea.”


    The old woman said to her husband’s shoulder, “Of course, they were here for tea.”


    He mumbled something in Chinese into her ear.


    “Packing?” Scharf asked.


    “We have rented a shop in Rockville in Maryland,” Mrs. Bao said.


    “Our lease is up, and the rent is doubling,” Mr. Bao added.


    “And too many people ask for lattes,” David spoke for the first time. I was glad
    he was listening.


    “And that,” Mr. Bao said.


    “So your movements?” Scharf prompted when the silence stretched.


    “I am on the parade committee,” Mrs. Bao said. “I worked all day on the street.
    There were many hands to hold.”


    “Politicians,” Mr. Bao said, like a curse.


    Mrs. Bao smiled, though she didn’t look at all amused. “There were many hands
    to hold,” she repeated.


    “What next?” Scharf asked.


    “We went to a friend’s house around four?” Mr. Bao said, glancing at his wife.


    Mrs. Bao nodded.


    “They had asked Li-Na to play.”


    “Play what?” I asked before I remembered I was invisible.


    “I teach piano and perform,” Mrs. Bao said, seeming to answer my question. She
    smoothed her perfectly straight, gray hair cut in a bob.


    “We did not return home until we received a call about the… About Rodger,” Mr.
    Bao said.


    “Did you know him?”


    They both nodded.


    “He worked next door almost a year.” Mrs. Bao turned to her husband. “Or more
    than a year?”


    He nodded. “At least. He was here for the holidays last year,”


    “He came in for tea,” Mrs. Bao added.


    Mr. Bao smiled. It was weak, but it transformed his face. “He came in for coffee.
    We set him straight.”


    I thought I heard a noise at the back of the shop, another twang of strings. I
    got up and wandered towards it, taking in the shelves stuffed with games and floor-to-ceiling
    varieties of teas. To the left at the end of the counter, I noticed an archway
    cut into the wall into a shop next door. A shadow flickered in the opening.


    I jumped as I came face-to-face with a coiling serpent. I blinked and realized
    it was only a large red vase on a shelf. I stayed there, senses outstretched for
    noise or movement, but nothing else happened.


    “Who works there?” I asked.


    Scharf twitched as if brushing off an annoying fly, but she pointed to the opening.
    “How is that store connected to yours? Was anyone working in there last night?”


    All three Baos swung their heads towards the back of the shop in obvious surprise.


    “Mr. Liu owns the music shop,” Mr. Bao said. “We broke a hole in the wall several
    years ago to encourage business between us. He closes at three. Did he yesterday?”


    Mrs. Bao nodded. “Without fail. He went to his home long before Rodger…” She gulped
    and tried again. “Rodger…” She shrugged helplessly.


    Scharf took her notebook out of the front pocket of her navy suit jacket. “We’ll
    need to talk with him. His name is Liu, yes? Spell that?”


    Mr. Bao did and said, “He could not have. He is not capable of such a thing.”


    Scharf shook her head sadly. “In my line of work, you learn everyone is capable
    of just about anything.”


    Mr. Bao shook his head. “He lost a leg a long, long time ago. He walks with two
    crutches. He is not capable, I mean.”


    “Okay, thanks,” Scharf said and closed her notebook. She would still talk to him,
    but I thought the Baos were right. This would have taken significant strength.


    When they didn’t add anything else, Scharf asked, “Did you know of a new worker
    next door?” She concealed the importance of that question by fiddling with her
    notebook.


    Mrs. Bao shrugged. “There were many. Unless they visited us, I did not keep track.
    Rodger lasted longer than most.”


    “Was he upset recently? Any kind of behavior change?”


    “He was a… contemplative person.” Mrs. Bao shrugged delicately.


    I said, “Hunh?”


    Scharf froze, but when nobody else looked at me, she cranked her shoulders down
    and asked, “What does that mean?”


    “He hated everything,” David said flatly.


    “We spoke of music often,” Mrs. Bao added. “He played the cello.”


    “Did he like that?” Scharf asked.


    “Did he like it? That’s an interesting question. He wanted to play perfectly,
    though there is no such thing.”


    “He had little joy in his life,” Mr. Bao added.


    “But he was always polite,” Mrs. Bao insisted.


    “Did you see him yesterday?” Scharf asked when the qualifiers wound down.


    All three shook their heads.


    “Take me through the rest of the day.”


    Mrs. Bao sniffed. “We came back when David called with—”


    “With the news,” Mr. Bao added.


    Mrs. Bao raised a shaking hand towards Scharf. “David said it was some kind of
    repeat. That this man has killed before.”


    “I explained all this to you, *Gu Ma*. They thought they caught him before, but
    they were wrong.”


    “We’re going to need the name of your friends where you played,” Scharf said,
    flipping a page in her notebook.


    Mrs. Bao drew a piece of paper from behind the counter. “We have prepared that.”


    Scharf looked at me for a second, an eyebrow raised.


    I shook my head and said, “The tea.”


    She hadn’t drunk any tea. For a bargain to be fulfilled, both sides had to be
    completed. I thought back over our first words and winced. “Also, David wasn’t
    in the bargain.”


    She stiffened and cast a pleading glance my way. I shrugged helplessly.


    She sighed. “I might have that glass of tea now if it’s not too much trouble.”


    “Of course.” Mrs. Bao jumped up and swung around the counter. She started pouring
    hot water into and out of a teapot at a sink behind the counter. Scharf dug out
    a five-dollar bill.


    “Our treat,” Mr. Bao said.


    “No, I insist. Policy.”


    Mrs. Bao righted the teapot without looking and began measuring two small scoops
    of leaves into the pot before adding more hot water. The activity seemed to soothe
    her. As she worked, she said, “This used to be such a vibrant neighborhood. Now
    there are only chains.”


    I blinked. “Chains?”


    “Chain *stores*, you mean?” Scharf asked.


    “Yes, the large stores come in and write their names in Mandarin and call it community.”
    Mrs. Bao set a dark red clay teapot and two tiny cups that matched it in front
    of Scharf. The pot was squat and small, enough for a cup or two of tea, and a
    design was printed into the clay of the pot and around the cups as well, a serpent
    head and a field of stars.


    “That’s beautiful,” Scharf said, picking up a cup.


    Mrs. Bao smiled. “My husband makes them.”


    Scharf looked at Mr. Bao. “Impressive.”


    I got up to examine one more closely, reminding myself to not pick one up. We
    didn’t need to explain disappearing teacups.


    Scharf poured the tea into one of the tiny cups. It was the color of rust. She
    blew on the tea and took a quick drink. I waited for the chime to see if he had
    told the truth, but I didn’t hear it. “You have to think it is delicious. You
    said *delicious*.”


    She looked down at her cup and muttered, “Oh, God.”


    She smiled and drank. Still no chime. I shook my head, and Scharf grimaced. “Now
    that’s a flavor.”'
