    # The Challenge


    Before `Kui` could answer, the water took down one string of red lanterns. One
    of them landed over my head, momentarily blinding me.


    `Kui` snorted.


    I shriek and toppled back. Someone caught me and helped me to the ground. The
    pain rushed back in full force, and I couldn''t help but an inappropriate giggle
    that turned into a full cackle.


    “Get this thing off me!” I said, trying to stop. In seconds, I’d be sobbing. Someone
    peeled the lantern off my head, and I shook like a dog to get it out of my face.


    The dragon laughed.


    The crowd froze. Performers, spectators, and commuters. It sounded like trumpets,
    bells, the best band in the world, or the strongest storm. `Kui` bent over his
    canes. It took an eternity for him to stop.


    ## The Bargain


    I was growing colder. He looked at me and bowed. He raised an arm, and the clouds
    disappeared from the sky. Then he held out a hand to me, palm up. I screamed as
    my spinal cord knit together, each vertebra snapping into place. In seconds, the
    searing agony had vanished.


    `Kui` pointed above me, and the fire hydrant froze in midair. I gasped as the
    shape emerged. He had carved a dragon into the spray. Sunshine struck the ice
    and flooded the street with rainbows. `Juya` chuckled. “Well, you were half right.”


    “What?” I asked.


    “There are rainbows.” She raised a hand and exploded across the sky. It gave me
    enough faith to sit up. I was terrified of what I would find, but my legs responded.
    I was winded, but whole.


    `Kui` dried the rain off the piano with a flick of his hand. After all my talk
    about joy, the thing that had tipped the scale for him was the rawest slapstick?
    A lantern had landed on my head, and it was funny he’d hoped?


    I picked up the lantern and clutched it to my chest. I looked at `Bao`, bowing
    low to him. I had not been the tide. Feet pounded behind me, and I twisted to
    see the `Lubber Fiend` plowing my way.


    “Stop.”


    Halting, he said, “I have won, `Pealla`.”


    The chime nearly deafened me and rang throughout my already sore body. I staggered,
    but `Osman` kept me up. “Now get out of here,” I said.


    As we watched him lope out of the square, the world got a little warmer.


    “Thank you,” the dragon said. “I didn’t want them to move. I did not realize I
    had so given up.”


    “You didn’t want them to move? The `Baos`?” I fought down a laugh. `Mrs. Bao`
    had been right. He was sad about losing them, not about a parade. We’d done all
    this for nothing.


    I glanced around. The band had finally rescued the tuba player and had started
    in on `Louie Louie`, a song they could play perfectly. The dragon dancers had
    abandoned the dragon part of their costume and were simply dancing with the crowd.


    *Not for nothing.*


    `Mrs. Bao` said, “There is room in our shop in `Maryland`. You could come?”


    He nodded. “I would like to come with you. I am sorry about the ice.”


    It had been so much more than ice, but I bit my lip to keep from saying so.


    ## The Resolution


    I turned to the `Lubber Fiend`. “You’re no leader. No one would follow anywhere.
    I won this challenge the first time we met. And now we have another bargain to
    make.” If I was going to be a leader of goblins, I was going to lead. “You killed
    a goblin.”


    He scoffed. “He was nothing.”


    “No. You’re nothing. I’ll make a deal with you. You never do magic again. If you
    do, I will kill you.”


    `Scharf` turned away and put fingers in her ears. The fiend snarled and veered
    away, but the other goblins stood firm, blocking him. “Keep your end of the bargain,”
    I said, “and you live.”


    “You won’t know.”


    “Oh, I’ll know. If I don’t, they will. And they will tell me.” I looked at the
    goblins. “Bargain?” I asked them.


    In lockstep, they answered, “Bargain!”


    Even as I said it, I prayed to the gods standing in the square with me and all
    the other deities I could think of that he’d keep this bargain. `Scharf` was right—a
    prison would never contain him; he was mine to deal with.


    “Bargain?” I asked the Fiend.


    He snarled at me, his face a mottled red, his teeth sharp. For a second, I thought
    it wouldn’t work. He was going to call my bluff, squish me into the fire hydrant,
    and declare martial law. But he said, “Bargain.”


