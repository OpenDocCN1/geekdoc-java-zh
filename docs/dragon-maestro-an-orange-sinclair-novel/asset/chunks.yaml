    I didn’t want to be out when that storm hit. I tried to tell myself I was being
    fanciful, but one thing I’d learned quickly once my goblin powers had manifested
    was that I wasn’t fanciful. It was dangerous to dismiss my instincts.


    The homeless dude got out at the next stop, ranting about the horror of the rain.
    Nobody likes thunderstorms; maybe I was picking up on the collective bracing of
    humanity against the weather.


    “Hello?” a voice asked.


    I yanked my eyes away from the storm, scanning the car.


    The dude in a suit and trench coat sat in the seat facing away from me, looking
    cold and exhausted. He had big earphones over his ears.


    “Can you see me?”


    I glanced down. A goblin stepped around the seats and into view. He was shorter
    than my five feet by an additional foot with deep blue skin and blue hair cut
    in a mullet.


    “Yes, I can see you?”


    “Are you the `Peallaidh`?” He pronounced my father’s name as `Peal`. I didn’t
    correct him. Scots Gaelic is hard for anyone to pronounce. My father always rounded
    it out, so it sounded more like `powlich`.


    The goblin wore a kid’s shirt with a collection of superheroes on the front over
    a sparkly pair of jeans meant for a little girl. He smelled like rotting beer.
    I didn’t take my eyes off him. You never knew what kind of power might concentrate
    in small packages. I was proof enough of that.


    “Are you the `Peallaidh`?” he asked again. His voice was high and thin.


    I sighed and told him what he wanted to hear. “Yes. I’m your leader person. Whatever
    we’re calling it.”


    I was glad we could conceal what we were because if anybody saw him walking around
    on any other night except Halloween, they’d run screaming to the nearest government
    science lab. And since we were in downtown DC, there were plenty of those.


    I told the guy in headphones not to notice me, just in case, and said to the goblin,
    “What can I do for you?”


    “I challenge thee.” He made a fist and pounded his chest over his heart.


    “You’re too late. I already claimed the box.” When my father died a few months
    ago, he’d left a box for me that held his powers as the leader of goblins. I still
    hadn’t been able to open the thing, but since I’d claimed it, the world of magical
    creatures treated me like I was his successor. I still wasn’t sure what that meant,
    but I had a feeling I was about to find out.


    “You want me to bow?” he asked, his nose curling until I could see his nostrils.


    “Tell me whether you’re supposed to bow, and I’ll know whether to be offended
    if you haven’t.”


    “I refuse. I refuse to bow to the—upstart.” He pounded his chest again and repeated,
    “I challenge thee.”


    “You said that already. Why?”


    He scratched between his eyes. “Why?”


    “Yeah, why are you challenging me? My father was on top and passed whatever was
    in the box to me. Not you.” Magical creature governance structures were stuck
    in the Middle Ages. I shared my father’s blood, so I was next in line.


    “My job is to challenge you!” he said.


    “Job?” I narrowed my eyes. “Someone’s paying you?”


    He shook his head. “Enough talking; we have to fight.” He clenched his fists at
    his sides, and I seriously hoped he didn’t mean to punch me.


    I reached for my magic, even as I gave him a big grin, still trying to find a
    way out of this. “My name is Orange. Maybe we could chat first?”


    “I am Everglades Park.” He went to pound his chest again but winced and rubbed
    his chest.


    “Your name is Everglades?”


    “It is the house I serve.”


    “Let me guess. You’re from Florida?”


    “Yes?” He looked gobsmacked that I had guessed a goblin named Everglades came
    from Florida.


    He didn’t serve the family; he served the house. Most goblins ruled over and kept
    homes and were beholden to bargains with their owners for magic, while I had a
    built-in source from my human half. In all the stories I’d read about goblins,
    we assisted humans or made their lives miserable, depending on what they did for
    us. It was a big deal that this little guy had uprooted and come after me.


    I bit my lip to keep from giggling. I’d never met a real-life Florida Man. Though
    I guess he would be a Florida Goblin?


    “`Now` we fight.” He stuck one fist in the air, avoiding his chest, and then half-heartedly
    poked it in my face.


    I tilted my head to dodge it. In hindsight, I shouldn’t have been surprised. Of
    course, the goblins get a new leader and challenge her. Why couldn’t we all have
    a nice holiday feast and passive-aggressively mention politics or religion while
    we stuffed ourselves?


    He tried to punch me again, coming a whole six inches closer to my nose.


    “If I fight back, we’re going to derail this train. Can’t we fight somewhere else?”


    Everglades snarled and finally summoned the courage to leap at me. I batted him
    out of the way, my heart in my throat.


    He crashed into the wheelchair seat, which swings upward to accommodate someone’s
    chair. Instead, it crashed downward, dangling from its hinges. I realized I was
    in trouble, not because he was any sort of challenge, but because he was `so much
    weaker` than me. I didn’t want to hurt him.


    I didn’t want to hurt him.

