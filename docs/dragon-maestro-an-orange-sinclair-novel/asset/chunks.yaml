  raw: 'Osman stepped into the kitchen. His black hair was plastered to his head with
    water that was still dripping onto his ear. He’d traded pajamas for a pair of
    worn jeans and a thick black sweater.


    “Can you get that monster started?” I asked, pointing to the stove.


    He nodded, then added, *“Gracias*, Orange.”


    I raised my eyebrows. He’d never been a huge fan of mine. The first time we met,
    he’d tried to drag Juya away from the trickster *duende* who might do her harm.


    He must’ve been thinking of that moment because he grinned ruefully. “I’m glad
    you don’t scare easy, goblin.”


    I flashed him a crooked smile. “Oh, I scare so easily. But then I do it.”


    “Do what?”


    “Well, today it’s baking for a goddess.”


    “She isn’t that,” he said, cocking his head.


    I spun around. “What is she, exactly?”


    He shook his head. “I don’t have the right words. Maybe goddess is right, but
    not like yours.”


    “Fair.” The only goddesses I knew about were Roman and Greek, who were nothing
    like Juya, to say the least. I opened the fridge and cupboards, reassured to find
    eggs, flour, sugar, and baking powder. The science of cake was the same no matter
    what you were.


    Even my poor recipes took on new life in Juya’s kitchen. The snickerdoodles burst
    with flavor from her cinnamon that did not taste like any cinnamon I’d ever bought
    in a grocery store. Scones seemed to levitate off the tray, perfectly mixed no
    matter what I did.


    Hours later, Astrid popped her head into the kitchen without an empty tray in
    her hands. “They’ve eaten everything.”


    I sagged against the stove, then jumped away when the cast iron burned. “I don’t
    believe it.”


    “Customers bought anything we put on the table just to help Juya. One tried to
    buy my keys.”


    I snorted. “Pity shopping. I’ll take it.”


    “Hey, they were great! Osman is closing things down.”


    For the first time since I’d been with Juya upstairs, I sat, fighting the dragging
    exhaustion in every finger. I gestured to the counter, where a series of bags
    sat propped against one another.


    Astrid and I were still debating names: “mug cake in a bag” or “bag cake.” I’d
    invented them a few weeks ago after my oven broke at the hostel where I was living.
    I put the wet ingredients in one bag and the dry ingredients in another and put
    a sticker on them explaining to mix and microwave for one minute.


    In Astrid’s fevered imaginings, they transformed into the new hot thing in grocery
    stores across the country. We were going to build a company, and we were going
    to make it big with a brand-new concept for the baking aisle. No one had yet been
    lazy enough to include both wet and dry ingredients in their mug cake mixes.


    The only reason I’d agreed to go into business with her was that my only role
    would be creating the actual products. Strategy, market research, aisle frontage,
    and who knew what else—that was all Astrid. What’s before type A? If there was
    a type more on top of life than A, that was Astrid.


    “I put some peanut butter and chocolate in that one,” I told her. “And that’s
    a spice cake mixture.”


    Astrid picked one up. “We should have a third bag for icing.”


    I shook my head and was going to keep quiet, but I knew she expected my baking
    advice. “If you put cold icing on a hot cake, it melts. And since they’ll be baking
    them at home, they’re probably not going to wait.”


    “What about frosting? And how is frosting different from icing?”


    “Butter. Which would be harder to make shelf-stable. For now, everything in those
    bags can sit out.”


    She pointed at me. “Do you think we’re ready for me to take these to school and
    see if freshmen in the dorms like them?”


    I looked at the plastic baggies and their handwritten labels. I fought a wave
    of fear. “As long as you sell them for five cents. Freshmen eat anything, right?”


    “Oh, no, a dollar at least.” Laughing, she stacked them into her worn backpack.


    “How on earth do you keep the faith?”


    She turned to me, her brown eyes sober. “I didn’t get the job.”


    “They’re idiots.”


    She was only three months from graduation and frantically searching for an internship
    or a job. This one had only been an admin thing, but it was salaried.


    “This is DC,” she said. “Someone needs a grunt.”


    “No, someone needs an insanely driven college graduate with a business degree.”


    “Thanks.”


    “You’re a million times more competent than I am,” I said, “and I keep getting
    new jobs all the time. I’m totally not worried about you.”


    She laughed again. “Orange, no offense, but I’m not going to clean things for
    a living. My grandma did that for forty years. I will not do that.”


    “You won’t have to.” I didn’t tell her I’d already lost the cleaning job I’d picked
    up on Craigslist a few weeks ago; crime-fighting and regular schedules didn’t
    mesh very well.


    “You should finish your degree!” she said with some of her old steel I feared.
    “Then you wouldn’t have to, either. Even without your degree, you have most of
    an education—and from Berkeley.”


    I shook my head. “I’m allergic to offices. And math. I’ll be a baker at… whatever
    we’re calling this company when it gets hugely successful, right? I’ll get at
    least a penny of every cake you sell.”


    “In twenty years, we’ll be breaking even!”


    I fought the familiar panic that came on whenever I thought about my degree, but
    I had bigger problems than matriculation—including a dead body, a possible serial
    killer, Juya’s illness, the mysterious Lubber Fiend, and all goblins in the territory
    I still didn’t know the edges of. I was kind of surprised a new challenger hadn’t
    found me here.


    “Oh, yeah, I forgot to tell you,” Astrid said. “This weird little dude with a
    bad tan job stopped by the courtyard this morning. He kept talking about a challenge.
    Kept asking for somebody named Peeling? I told him no one was here by that name.
    But he looked a little like you.”


    I closed my eyes. “I spoke too soon.”


    Astrid’s forehead crinkled. “You didn’t say anything.”


    “Never mind. Just get those to school and let me know how people like them. We
    have to keep trucking, right?”


    “Neither of us is becoming truckers.”


    I grimaced. “It would probably pay better.”


    “Don’t even joke.” She hitched her backpack straps onto her shoulders. With all
    the textbooks she carted everywhere, it took two tries. She leaned forward to
    balance its weight.


    “*Duende*!” We all turned as a treble voice shrieked from the courtyard.


    When I saw Osman run by the kitchen, I shouted, “Would you please tell your helpers
    I will not hurt you? I’m here to help you!”


    “Battle stations!” the voice cried again. “*Duende* in the courtyard!”


    “In the courtyard?” I ran for a window, fighting more diaphanous read curtains
    to see out. A purple-skinned goblin with large ears stood in the middle of Juya’s
    courtyard with a stick in his hands.


    As if he knew I was there, he looked up at the front of the house, saluted me
    with a fist to his shoulder, and said in a squeaky American accent, “I challenge
    thee!”


    # 7


    “I am Mert, and I challenge thee. To a fight to the death,” the little red goblin
    repeated when I got outside with Astrid. He held a club almost as big as he was.


    “What is he talking about?” she asked as I steered her past him.


    “Family game. Uh, role-playing. LARPing. You’re right. He’s a cousin.” I hustled
    her to the gate and out of the courtyard. “Get to class! Let me know how they
    sell!”


    When she turned to walk away, I saluted the goblin as I’d seen Everglades do on
    the train, pounding my fist into my chest. I didn’t know if it was an official
    goblin thing or if he was trying to be dramatic, but it felt right. And then I
    realized I’d pounded the right side of my chest and quickly switched hands. He
    watched this with his head cocked.


    “Let’s get this over with,” I said grimly.


    And then I remembered the goblin’s promise to find the Lubber Fiend. I paused
    at the gate to take in this scrawny creature. This couldn’t be the second most
    powerful goblin in my hopefully tiny territory, could it?'
