    I dug out my phone. “Yeah, and it turns out he was potentially a bit older than
    I thought.”


    “What, like that artist who was in his eighties when he had a kid?”


    “He wasn’t Mick Jagger!”


    “Um, not the artist I was referring to. How old, Orange?”


    I closed my eyes. “A couple of millennia, maybe?” As the car swerved, my eyes
    flew open. “Eyes on the road!”


    “I’m fine!” She gripped the steering wheel tighter, but she was panting. It was
    the strongest reaction I’d seen from her. “Millennia. That’s not an exaggeration.
    The plural of millennium.”


    “Yep.” When she stayed more or less straight for another few blocks, I said, “I
    did a bit more research about my kind.”


    “Googling yourself? You’ve never done it before?”


    “Of course, I have. I studied folklore and goblins for years. I’d see Peallaidh
    and figure it was a common Scottish name. Like if your last name is… I don’t know…
    Churchill and then you read a biography of Winston Churchill, and you know you’re
    not related to him, but it’s kind of cool.”


    “So, did you learn anything more about your father?”


    I nodded. “The Peallaidh was associated with the village of Aberfeldy in Scotland.
    He was a leader of a type of goblin called urusk, who liked the outdoors as much
    as home and hearth. Urusks are hobgoblins, so they’re a little bigger and more
    powerful than regular goblins. And they enjoy the water.”


    “The box?”


    “There was a waterfall in Scotland my father liked. There’s not a lot of information,
    even online. But there used to be gatherings in Scotland of goblins where… Well,
    I’m not sure what they would do, probably play a bunch of jokes on each other
    and make some good food.”


    “Sounds like fun.”


    “Fun is important.”


    She grinned. “We have a waterfall near DC, the Great Falls in Virginia. About
    half an hour from here. They’re kind of famous, I think. Or they’re close, so
    that’s where the tourists go. Jen and I went there when we first moved here.”


    I thought of what to say but left the subject of her ex-girlfriend alone, not
    wanting to rile her up again. “I suppose there isn’t a lot of water in Arizona.”


    “God, no. Though it’s balmy compared to Afghanistan in the summer.”


    “Why am I asking you about fun things to do around here? You have the least fun
    of anybody I’ve ever met.” As soon as I said it, I regretted it.


    “You know, Orange…” she trailed off, sounding a little hurt.


    “Never mind. That was an exaggeration. You have a lot of fun,” I said, although
    that was an exaggeration too. As she closed her eyes for a moment, I said, “The
    road!”


    “Fun isn’t always about jokes and playing around,” she said, her eyes snapping
    open. “You can throw yourself into something meaningful and have it… I don’t know.”


    “Mean something?”


    “Exactly.”


    I wanted to cross my arms and stop speaking to her, which told me whoever was
    affecting people was still working his terrible magic. Instead, I tried to keep
    this bizarre conversation going. “I like to bake. Don’t snicker. It’s more of
    a commitment than a knock-knock joke, so I get more out of it. Can we go see the
    waterfall?”


    She glanced at me. “Sure.”


    “Knock knock.”


    “Oh, God.”


    “Interrupting—”


    “Don’t even try it. Hassan warned me.”


    I slumped in my seat.


    We slowly wound our way out of DC, and with every mile we put between us and DC,
    the vice at the back of my neck released a little, and my shoulders stretched
    away from my ears. Although, as the weather improved, Scharf sped up considerably.


    “It’s not everywhere,” I said when we were firmly enfolded in bare trees. There
    were traces of ice on the ground, but many more fallen leaves and mulch.


    She glanced at me.


    I hit the button for the radio, and for the first time in days, heard new music.
    Something canned and auto-tuned, but it sounded like a symphony. I pointed out
    the window. “The ice, the feeling like you’re going to explode. The music.”


    She glanced out at the trees. “The further we get from DC, the better it feels.
    I hadn’t even realized how stressed I was.” She stretched an arm above her head.


    “If it’s localized, we can find it,” I said.


    “How? The localized part is the entire city.”


    “I don’t know.”


    She glanced at me, and I had to bite my tongue to keep from telling her to look
    at the road.


    “What magical thing can affect the weather of half the Eastern seaboard?”


    I winced; that was exactly the kind of question I was here to answer, but I had
    no clue. “I’m—still researching. There are both too many things and far too few.”


    “Explain.”


    “Every folklore tradition on earth has beings that can affect the weather. But
    something this powerful? I don’t know. And you can’t get around the dead goblin.
    We’re tough to kill. I’m not being arrogant when I say that.”


    “No,” she said, “I’ve seen you not die many times when you should have.”


    “Funny.” I sighed, trying but failing to find a comeback. “Insert clever pun here.”

