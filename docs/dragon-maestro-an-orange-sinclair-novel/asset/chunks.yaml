    “I know his signature, and some…” She glanced at David. “Some details were held
    from the press.”


    The officer shook his head violently. “We caught him!”


    “We caught *somebody*,” Scharf said.


    # 4


    I leaned against a dumpster thirty feet from an alphabet soup of agencies standing
    over the body, all of whom were debating what to do as the rain flooded the alley
    with mud, grease, and spilled trash.


    Rodger was barely older than David or me, with pale skin and a shock of blond
    hair. His body was in child’s pose, with his knees tucked under his torso and
    his arms outstretched as if supplicating for his life, just across the threshold
    of the back door of the pasta shop.


    I’d gotten a glance before I’d retreated out of the alley. It was only my second
    dead body, and the first had been in a morgue, cleaned up, and was still far more
    than I could cope with.


    The first cop to pull up had taken David to a precinct, and I’d then gone completely
    invisible as more and more law enforcement arrived: techs in coveralls, more uniforms,
    and the FBI in their dark blue jackets with yellow letters. I hid under the awning
    of the music shop and shivered as the rain worsened.


    Yesterday was sunny and warm for winter, but that was over. I debated leaving,
    but I wanted to help. That was the bargain I’d made with Scharf only a month ago:
    I’d help her when her case brushed the magical world in exchange for a place to
    live.


    Scharf strode out of the alley; she’d gotten an umbrella from somewhere and twirled
    it as she dug out her phone, put it to her ear, and said, “You can probably go
    home.”


    When I said nothing, she stared at me.


    “Oh! You mean me. *I* should go home.”


    “Is anyone else here?” she asked.


    “I thought you were on the phone… Never mind.” I jammed my hands in my armpits
    to keep warm.


    “The Bureau’s taking point on the case for now since this is most likely connected
    to the other Restaurant Killer cases we’ve worked on, so I’m going to be here
    a while.”


    “I could help.”


    Scharf smirked, one corner of her mouth ticking up. “No offense, Orange, but we’re
    pretty sure this is a regular human murderer. We’re waiting for the medical examiner.”


    “How do you know it was him? Your Restaurant Killer?”


    “There’s a fork in the victim’s left eyeball. It was his calling card.”


    “More than one person can stick somebody in the eye with a fork.” I pushed my
    hair out of my face. It drooped around my head in the driving rain.


    “Yeah, but can they strangle him, pose him exactly like the other victims, then
    stick a fork in his eye?”


    “Ew.”


    Scharf shrugged. “There’s more. David said Rodger wore a medical alert bracelet.
    It’s missing. The killer always took jewelry or a ring off the victim’s hands.
    I studied this killer when I first got to DC. He did this for years.”


    “But you said you caught him.”


    “Yeah, John Hastings. He got angry with his boss when he was working at a fast-food
    joint. His first kill was that boss, and then he kept going.”


    “But if this is the same killer, none of that’s right.”


    She sighed and brushed a hand over her hair, pushing the water out of it. “You’re
    right, but there hasn’t been a murder like this in the four years since we locked
    him up.”


    “So if it wasn’t him, it could be a supernatural creature,” I suggested, surprised
    by my FOMO. I would have said investigating crimes was the last thing I wanted
    to do with my life, but here I was with an out, and I was arguing to stay.


    “Just go home, Orange.”


    “You’re my ride.”


    “You’re a goblin.”


    As I thought about her house in Virginia, an orange line showed up in my vision.
    No one else could see it but me, and it showed me the way home like magical Google
    Maps; it involved a Metro and two buses. “I’m good. I’ll wait.”


    “Scharf, we meet again.”


    We pivoted to see a guy in a trench coat get out of a beat-up sedan. As he turned
    our way, I groaned.


    “Lee!” Scharf called out.


    Detective Lee was Metro PD and had arrested me a couple of times already—once
    for loitering and once for domestic terrorism. He was pushing forty with a slight
    Southern accent and was slowly losing the fight between abs and pudge. He filled
    out a familiar rumpled blue blazer under a more rumpled trench coat. His black
    hair was in a sharp buzz cut, though, and his badge was on his belt.


    “If this is that Restaurant Killer y’all thought you caught, what am I doing here?”


    “Liaising,” Scharf replied in a flat drawl.


    “Translated from Fed speak,” Lee said, “that means dumping all the paperwork on
    me?”


    Scharf snorted. “I don’t make the rules. Guy’s dead, so we call in the detectives.”


    Scharf looked at the milling crime scene techs. “Um, Happy New Year, by the way.
    If that’s what you say. If you celebrate. Your family is from Korea, right? Never
    mind.” She trailed off.


    “‘Happy new year’ works. We did celebrate *Gujeong* today. And no, I didn’t go
    to the parade. Nobody goes to the parade.” He threw a hand toward Chinatown. “Obviously.
    And then the Feds called me to a crime scene to look at a guy with a fork in his
    eye.”


    I felt compelled to repeat myself. “Ew.”


    Scharf, the only one who could hear me, twitched.


    “So, what’s the story?” Lee asked.


    Scharf rocked back on her heels. “The victim, Rodger Clark, is an employee at
    the scene. Nineteen years old. Resident of Virginia. Found by David Bao, an employee
    of the Long Yinyue Teashop next door. Pasta owner has been contacted.”


    “The Joe of Pasta Joe’s?” Lee asked.


    “Just so. He says he’s in a bar in Virginia with a bunch of friends watching the
    hockey game on TV.”


    “Convenient.”


    She shook her head. “One of the friends is a judge.”


    “So probably not the owner. Have we found the new hire?”


    “What new hire?” I asked before I remembered he couldn’t hear me.


    Scharf took a deep breath. “The killer always started out working for the business,
    gained the boss’s trust, and then murdered the boss. Reenacting his revenge for
    the injustice he suffered at the hands of his original boss.”


    Lee blinked. “Yeah, I know. I mean, it wasn’t my case since it was too fancy for
    us.”


    “And he crossed state lines?” Scharf offered mildly.


    “But I kept up with it. We haven’t had a serial in a long time.”


    “No new hire that we know about yet. The rest of the pattern fits.”


    Lee dug his hands into his trench coat pockets. “Except all his victims were older
    than fifty to match the first boss. And he’s never come this far south. And all
    served American food, not Italian.” Lee ticked off each point on his fingers.


    Scharf threw up her hands. “It’s been an hour. Give me a break.”


    Lee grinned, crinkling the corner of his eyes. “So, how do you want to work it?
    I’ll get people canvassing. See what they saw.”


    “The medical examiner’s assistant is on the way,” Scharf said.


    “What about the kid who found him? No chance he’s pulling a copycat?”'
