    我试图控制自己的心率。“阿斯特丽德，对那些食谱我深表歉意。我不知道是怎么了，但我会解决的——我向你保证。现在，别卖掉我做的任何东西。把它们全扔了。”谁能知道我在那些点心里烘入了什么样的糟糕魔法呢？


    “当事情没成功时，你不能放弃！”她惊呼道。


    “我知道。但我没法修复你手里的那些东西，如果它们不对劲，我不想让它们散遍整座城市。”这样说，听起来很专业。


    “我又被拒绝了一次。也许我应该停止了。”


    我直起身子，背部挺直。“停止学？”


    这可是阿斯特丽德，我认识最有动力的人，她冲破障碍就像撞倒保龄球一样。


    “也许你是对的。也许我疯了。”


    “啊，今天不要做任何草率的决定。好吗？嗯，把它们扔掉，就这么。”


    “我觉得我很无力，”阿斯特丽德说，“我们完全是在凭信念在做事。”


    “还有你的商业才华和我的烘焙技艺。信念是留给傻瓜的。”


    她笑了。“这方面有些证据。乐观主义者并不会获得更多机会；他们更能注意到已经存在的机会，而悲观主义者甚至看都看不见。”


    “看到吧？快乐的想法！独角兽和彩虹！听见了吗？”


    陷入了长久的沉默，连哈桑斯似乎都屏住了呼吸。“是的，我听到了，”阿斯特丽德终于说道。


    “太好了！回头见！”在她告诉我打算放弃所有世俗财产加入一个公社并生二十个孩子，或者其他同样荒谱的事之前，我就挂断了电话。


    我转向哈桑斯。“请你也务必小心。冰，还有一切。”


    “我一直都很小心，”他笑着说。


    “认真的。那不是普通的冰。我还不确定发生了什么。”


    他严肃起来。“又一个精灵（djinn）？”


    我摇摇头，然后停住。“我不觉得。这似乎比那严重。”


    他目瞪口呆。“你什么意思？”


    “我的意思是，精灵毁了一个街区。而这场风暴覆盖了三个州。”


    “天哪。”他小心地读出这个词。


    “只要保持警惕就行，哈桑。我现在无法提供更具体的细节，但一旦我知道更多，就会告诉你。”


    哈桑斯慢下了车，我意识到我们正停在沙夫（Scharf）的木板房前。在弗吉尼亚州五角大楼南方那千篇一律的郊区，长街砖排屋中，她的房子是唯一的独立建筑。


    “橙色……”


    “太感谢了！”我跳下车，看到沙夫在门廊上时我瘫软了。“你叫她了。”


    “当然了，当你没她车坐的情况下拼命找我时，我当然会叫她！”


    “好吧，还是谢谢你。我的意思是，谢谢你的载。”


    “*一路平安（Ma’a salāma）*。虽然我不知道为什么要祝你平安。看起来你和平在一起就像蛋黄酱和水。”


    “我觉得你是说油和水。”


    他歪了歪头。“蛋黄酱不是油吗？”


    我张了张嘴，又闭上。“有道理。”


    沙夫跑下人行道，俯下身和哈桑斯说话。“还有另一个职位空缺。”


    他翻了个白眼。


    “他们一直在问，”她补充道。


    “你会为这些人担保吗？”他问。。我不确定他们在谈什么。


    沙夫什么都没说。


    “我不想做那些我无法影响的消息传声筒了。”


    沙夫点了点头。“我说过我会问问。”


    她向后退了一步，但他向副座靠去。“等我妻子拿到学位，我不需要照看孩子时，我会考虑另一个职位。如果他们值得的话。”


    “我会告诉他们的，”沙夫说，但没有动弹。她看着我。


    “我走了。”我立起橙色皮衣的衣领，抵御持续的细雨，在沙夫上车继续交谈时，我离开了。


    走路时，我仔细扫视街道寻找红色的痕迹。到处都是红砖，这很难发现。如果矮人魔（Lubber Fiend）潜伏在这里，他有极好的伪装色。


    除了滴落的水，什么都没有在动，我终于走到沙夫的门廊上试着推门把手。推不动。在鬼怪破坏了门后，她在正门上安装了带键盘的自动锁，所以如果门关了，就是锁着的。


    我转去看到她和哈桑斯在车里激烈地交谈。如果我让她帮我开门，她会觉得很不对劲。由于我能用咒语开门，她没忙过给我密码。大多数时候如此。


    我靠在门上。


    “入侵者！”


    我试图转身防御。花了我五秒钟。我环顾四周，双手出手，这是我唯一的武器。一个不到一英尺的小跳到了门廊上。


    他放了个屁，用他尖细的声音说：“你吵醒我了！”


    我蹲下身盯着那个矮人。“噢，谢天谢地，格姆警官。你能开门吗？”


    沙夫没忙过给他命名；我是在一次幽默发作时叫他格姆的。他是她一个朋友送的玩笑礼物：一个穿着警察制服的园艺矮人。我们之前都知道他是真实的。

    '
- fmt: '

    # The Kitchen at Scharf’s Galley


    Scharf’s galley kitchen had just enough room for a round table and a couple of
    chairs at the end of the dual counters. The stove was electric and temperamental,
    but homeless hobgoblins couldn’t be choosers.


    A couple of baggies with old mug cakes lay on the counter next to the breadbox.
    I approached them warily. Astrid wasn’t wrong; the liquid was lumpy, and the flour
    seemed to be half the volume I put in and slightly gray. I couldn’t resist shaking
    the baggies and saying, “What’s wrong with you?”


    They didn’t answer. I dashed them into the trash; at human strength, I didn’t
    even break any of the bags.


    ## A Recipe from the Past


    I wrenched open the cupboard with my ingredients and eyed the chocolate chips,
    but realized I wanted to make something else. I’d bake something I loved, a recipe
    that had never failed me. “Take that, anonymous forces of evil!”


    I gathered flour, sugar, and baking powder. Next, I pulled out a bowl from another
    cabinet where Scharf stored her blender and her smoothie ingredients, then dug
    in the fridge for an orange. This was one of the first recipes I’d ever learned
    to make.


    There was a bakery in my hometown in California where my mom and I often went
    since she didn’t have the slightest twinge of domesticity. One morning shortly
    after I’d learned to read my name, I saw a sign that said, `Orange Scones` inside
    the glass counter. At the top of my small voice, I announced they were mine. Fortunately,
    the baker had found me charming rather than obnoxious when I insisted that he
    give them all to me because they had my name on them.


    “Oh, for the days when I could claim the world by writing my name on it in black
    marker,” I thought, trying for a laugh as I grated the rind for zest. The baker
    had taught me the recipe when I started working there at age sixteen.


    I stirred milk and eggs into the dry ingredients. The quiet scrape of the spoon
    along the bowl and the slow magic that transformed milk and flour into batter
    hypnotized me. Most of the stress of the day drained out of my muscles as the
    tempting smell of butter and oranges wafted through the kitchen. I peeled the
    orange and squeezed the juice into the batter, adding a few chunks of pulp, then
    I formed scones and put them on a tray.


    ## The Phone Call


    I stuck them in the oven and collapsed onto the tile floor, letting the warmth
    of the oven door seep into my bones. Closing my eyes, I contemplated putting on
    some music but didn’t trust the radio. Instead, I hummed an old jig my father
    had sung as he teased my mother in the kitchen. “The queen is in her kitchen and
    the king has to fart. One rules a kingdom and the other rules his heart.”


    My phone rang, and I juggled to see the front and realized it was an alarm. Every
    day at two on the West coast, I called my mom. It was her best time of day. She’d
    have lunch but wouldn’t have dealt yet with the discombobulation of “group activities.”


    I braced myself, pasted a smile on my face, and hit the number.


    “Hello,” a woman said. “Good Rest Home, Sharon Sinclair’s room.”


    I frowned at the phone. “Who is this?”


    “Who is this?”


    “This is her daughter, Orange.”


    “Oh, Orange. This is her nurse, Harriet.”


    “Could you put her on the phone? I always call at two.”


    “I’m afraid not.”


    “What?” A few really weird things had happened. A goblin had died; my recipes
    had failed, and now the torture of saying hello to my mother who didn’t remember
    me would not happen? “Why not?”


    “She grew extremely agitated after your last call. It’s affecting her recovery.”


    “What are you talking about? She isn’t recovering.”


    “She’s making excellent progress.”


    “You mean she hasn’t forgotten an entire food group between this week and last?”


    A brief silence followed. Yep, this aid was new. They burned through home aids
    monthly, and it always took them a second to get used to me. “Well, that is to
    say, there is no further deterioration in her condition. Her memory remains stable.”


    “Stably gone?”


    Her voice was prim as she said, “You could call her doctor to discuss this. Maybe
    we can try again in a few weeks.”


    I couldn’t believe this. “You’re genuinely not going to let me talk to my mother?”


    “Orange, we all want what’s best for her.”


    “I don’t understand what’s different about today.”


    “The doctor will speak with you, okay?” When I didn’t respond, Harriet said, “You
    have a good day now.”


    She ended the call. With difficulty, I resisted throwing the phone across the
    room. Instead, I tucked it in my pocket, then threw a spoon across the room. It
    clattered to the floor and took the pile of Washington Posts on the table with
    it. The avalanche sounded like music.


    ## Interaction with Scharf


    “Hey!” Scharf dodged the newspapers as she stepped into the tiny space.


    “Sorry.” I rolled my neck. “You shouldn’t sneak up on people like that.”


    She laughed, but it wasn’t a cheerful sound. Now that I could get a proper look
    at her in the kitchen''s light, I was shocked.


    She looked like someone had punched her twice, producing pronounced dark circles
    around her eyes. She wore the bottom half of a suit and an untucked white button-down
    shirt. Her hair was still wet from the perpetual storm.


    She sat down opposite me on the floor against a cabinet. “What smells good?”


    “Orange scones.” I glanced at the oven. “They *do* smell good, right?”


    “Yeah. What’s in them?”


    The scent of citrus and caramelizing sugar infused the air. “Um, oranges?”


    “Oh.” She peered into the oven for a second. “I thought you meant they were your
    recipe.”


    I smiled, thinking again about my hometown bakery. “It’s from the man who taught
    me to bake. They’re my favorite.”


    “They smell great.”


    “Thanks.”

