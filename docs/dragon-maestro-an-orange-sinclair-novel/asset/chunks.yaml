    reasonably sure I saw somebody watching us from inside, behind a row of instruments.


    Scharf’s phone dangled from her fingers, forgotten, as she said, “And what about
    the serial killer? Fuller is in the alley, crediting this kill to him.”


    I gaped at her, having momentarily forgotten about Fuller and the others. “I told
    you the victim jumped through a window out of a moving train. No human could have
    killed him.”


