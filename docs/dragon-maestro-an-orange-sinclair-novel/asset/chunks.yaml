    built-in source from my human half. In all the stories I’d read about goblins,
    we assisted humans or made their lives miserable, depending on what they did for
    us. It was a big deal that this little guy had uprooted and come after me.


    I bit my lip to keep from giggling. I’d never met a real-life Florida Man. Though
    I guess he would be a Florida Goblin?


    “*Now* we fight.” He stuck one fist in the air, avoiding his chest, and then half-heartedly
    poked it in my face.


    I tilted my head to dodge it. In hindsight, I shouldn’t have been surprised. Of
    course, the goblins get a new leader and challenge her. Why couldn’t we all have
    a nice holiday feast and passive-aggressively mention politics or religion while
    we stuffed ourselves?


    He tried to punch me again, coming a whole six inches closer to my nose.


    “If I fight back, we’re going to derail this train. Can’t we fight somewhere else?”


    Everglades snarled and finally summoned the courage to leap at me. I batted him
    out of the way, my heart in my throat.


    He crashed into the wheelchair seat, which swings upward to accommodate someone’s
    chair. Instead, it crashed downward, dangling from its hinges. I realized I was
    in trouble, not because he was any sort of challenge, but because he was *so much
    weaker* than me. I didn’t want to hurt him.


    I didn’t want to do this.


    He roared from the ground and snapped his fingers, and all the seat cushions leaped
    into the air and slammed together. Fortunately, they missed the human on the train,
    who clearly had his eyes closed and seemed oblivious to the supernatural fight
    happening around him. Those were some quality headphones.


    “Why are you doing this?” I asked as I knocked them to the floor.


    “I challenge thee!” His dark hair was waving around his head, and he’d turned
    a darker shade of blue in his anger.


    “Save me from goblins,” I muttered and tried to put the seat cushions back in
    the right place, but it was hopeless.


    He roared and leaped again, his claws extended. They weren’t really claws, just
    pointy nails. Mine grew in the same way, and I knew from experience how much they
    hurt when they gouged into flesh.


    He landed on my shoulder and broke the skin, tearing through my new red dress.
    Hardening my skin to heal it, I growled, “When was the last time you washed your
    hands?”


    “I challenge thee!”


    “Would you stop saying that?” I batted him away again but couldn’t control his
    fall.


    He slammed into another seat, this time laying waste to the entire metal frame
    that supported it. I cringed, terrified I’d killed him.


    The goblin got to his feet and shook his head, his black eyes wheeling in his
    wrinkled face. He was upright, but he wasn’t okay.


    “Why aren’t you all *helping* me?” I asked. Fresh anger warred with an old ache
    of isolation. I hadn’t yet met a goblin who was happy to see me. “Why do we always
    have to fight?”


    “I challenge—”


    I sighed. “Challenge me. I know. What will make this stop?”


    He leaped.


    I couldn’t dodge, and he latched on to the front of me in an obscene version of
    a hug. I had an unpleasant minute getting him off. As I pried his hands from around
    my middle, he ripped the front pocket of my jeans, making this the fourth outfit
    I’d ruined in the line of duty. “Not the jeans! They fit!”


    I picked the goblin up with my mind and dangled him above the slushy floor. “Don’t
    make me throw you out the window!” I said, hoping a more dire threat would get
    through to him. “Stop challenging me.”


    With round eyes and limbs flailing, he looked at the floor and then at me. “How?
    You didn’t get time to make a bargain for power.”


    “I’m half-human, you—you goblin! I don’t need to bargain for my magic. I can bargain
    with myself.” A grin crept across my face. I hadn’t yet met another half-human
    goblin, and there was a serious advantage about being both, though it had taken
    me a while to figure that out.


    As the truth of that settled on him, Everglades hung limply in my bonds. “You’re
    human?”


    I didn’t know if it was longing, jealousy, or fury that transfigured his face.
    I looked around the hurricane-stricken car and sighed. “Are you going to stop
    challenging the—me?”


    He nodded, and his mouth drooped.'
