    listened to that perfection daily and was a bit too much of a perfectionist himself?
    It wouldn’t be inspiration he felt. And then one day all that luck disappears,
    and he’s left with his genuine talent. I thought of my loss of control; I’d lashed
    out at someone else, but it wouldn’t be a stretch to lash out at yourself.


    Melissa sagged. “I don’t know what happened!”


    Scharf looked at me with some alarm. “Is that true? She didn’t know what came
    over her? She wasn’t in control?”


    Melissa whispered, “I wasn’t!”


    I shook my head, thinking of Mert and his bleeding, unconscious face and his literal
    blood on my hands. She was responsible regardless of his influence; we both had
    to be. “She was.”


    As she collapsed in sobs, I realized I didn’t have to get any detective. A booming
    voice said, “The cavalry has arrived!”


    I glanced back to see Detective Lee, wearing the same suit he wore to the murder
    scene days ago. He pointed at me and said, “Your consultant is a menace and I
    want to arrest her.”


    Carlisle stood up when he saw Lee and started towards us.


    I hooked a thumb at Melissa and said, “Arrest her instead.”


    Lee looked thrilled. “Is that her? Did you get a confession?”


    Scharf shook her head. “Not for murder.”


    “What for?”


    I frowned. “Body rearranging?”


    Scharf stood up. “We need to arrest her for disturbing the crime scene. She’s
    the one who put the fork in Rodger Clark’s eye and posed his body—after he was
    already dead.”


    “That’s impossible!” Carlisle shouted. “The waitress is missing. She had a key
    piece of evidence in her possession. This is a slam dunk!” He always turned colors
    when he was mad. It made the world a little brighter to see Mr. Perfect turn purple.


    Immediately, I told myself to stop that, because, with the dragon still not contained,
    minor jealousy or schadenfreude could turn into all-out criminal behavior.


    Lee dug out his handcuffs. “Tampering with a crime scene is one thing, but what
    about the murderer?”


    “There was no murder,” Scharf said. “Rodger Clark intentionally overdosed on his
    epilepsy medicine. She came along after he had died and stuck a fork in his eye.”


    Melissa moaned.


    I crossed my arms over my stomach. “Do you have to keep mentioning the fork?”


    “You take her, Lee,” Scharf said.


    Carlisle spun toward Scharf, incredulity in every symmetrical line of his face.
    “We’re giving this to Metro?”


    Lee dug out his handcuffs from a clip on his belt.


    “You want to write this one up?” Scharf asked and Carlisle shut up.


    Lee dragged Melissa away, still babbling about innocence, and Carlisle made to
    follow them, but Scharf held up a finger. “Carlisle, who fed information about
    this investigation to a private citizen?”


    “She has press credentials!”


    Scharf groaned. “You brought her to the autopsy.”


    “She was writing a book!”


    I snapped my fingers. “The report. She altered the autopsy report!”


    “She couldn’t have!” Carlisle shouted, his face cycling through several more colors.


    “Yes, she could,” I said. “I read her whole first book. She dedicated a chapter
    to each autopsy. It was like half the book. She went into every number. It was
    awful. But she knew what she was looking for.”


    “I didn’t know!” Carlisle screeched.


    Scharf massaged her temples. “Don’t look so scared. *I* don’t run to OPR at the
    first sign of trouble.”


    “Scharf, I—”


    She cut him off. “Are there any words you could say right now to make this better?”


    He closed his mouth and stepped away.


    “What’s the meaning of this?” Fuller stomped up between tables, his gray hair
    askew.


    “It wasn’t the Restaurant Killer,” Scharf said. “Congratulations, Agent Fuller.
    Looks like you caught the right man to begin with.”


    Fuller looked down his nose at Scharf and me. “Agent, I don’t know whom you think
    you are, or who that is,” he said, a stiff finger pointed at me, “but I doubt
    making baseless accusations against a decorated agent is going to get you any
    further in the Bureau. In fact, I’ll make sure it won’t.”


    Scharf crossed her arms, her fingers clenched into fists beneath her elbows. “I
    didn’t accuse a decorated agent of anything. Except for extremely poor judgment.
    A civilian confessed to tampering with a crime scene and desecrating a corpse.”


    I winced; I knew there was a name for it.


    “How dare you!” Fuller came for her with arms outstretched like claws. I blinked
    and held him back with magic, though I knew in seconds I wasn’t going to last
    long this close to the dragon.


    Instead of a quick Scharf quip, she got up in his face. “How dare I? How dare
    you!”


    “Remember the agon-dray!” I said in a sing-song voice.


    “You’re a washed-up nobody with terrible investigative technique who should have
    been pushed out of the Bureau ten years ago!”


    “Scharf!” I said, sounding even to my ears like an outraged mother hen. Other
    people had put down their tea and stared.


    “Says the girl who was investigated by OPR two seconds ago!” Fuller said with
    a minor smile.


    “Says the agent who is so hungry for fame he turned his niece into a sycophant!”


    “Okay, that’s enough,” I said, pulling on my powers to hob. As I tapped into Scharf’s
    rage, the depth of it surprised me. She had sworn up and down that going on probation
    and missing a promotion hadn’t bothered her.


    She’d seemed to kowtow happily enough to Fuller when he had first arrived, but
    this was a deep, old resentment. Scharf was a brilliant woman who’d spent a lot
    of her life smiling and nodding and shutting up. Add in a dragon that lowered
    inhibitions, and we had a career-ending breakdown on our hands.


    I’d been worried she might pull out her gun under the influence of the dragon,
    but she viewed that weapon as an instrument of protection, apparently to the core
    of her being. She hadn’t been remotely tempted to use it in anger.


    But giving a pompous windbag his comeuppance? Absolutely.


    “He *still* might walk because your niece pulled this stunt,” she shouted. “You
    egotistical blowhard! She mauled that poor boy and you’re defending her!”


    Time to end this. I didn’t bother searching for calm in anybody. I could *feel*
    the resentments and anger in the room and yanked on all of them. “*Walk away!”*


    I forced power into my words. I hated compelling anyone—anyone I liked—and was
    concerned this was me giving in to my temptations under the dragon’s influence,
    but I couldn’t let Scharf torch her career.


    There was a moment when nobody moved and I felt like someone was stretching a
    rubber band inside my head, and then it snapped and all the agents and customers
    walked away from me and each other, perfectly equidistant. I should have been
    more specific than “away.” When they got as far as they could, they stopped and
    stared at walls or tea, looking confused.


    It looked like a giant chessboard. Carlisle had been facing the door, and he busted
    out and kept walking. I wasn’t sure when my influence would wane and he could
    stop.


    I spun in a circle. Scharf had ended up over by the counter. She was staring at
    a jar of tea like it held the secrets of the universe. I approached gingerly.


    “That felt too good,” Scharf said quietly. “But thank you.”


    “Um, you’re welcome.” I leaned against the counter and watched as folks snapped
    out of my compulsion, some faster than others.


    I couldn’t stop from cowering as Fuller came to himself and wandered over with
    nothing of the bravado of a minute ago. Scharf stiffened when she caught sight
    of him.


    “Melissa?” he asked.


    Scharf put a hand on his shoulder. “I’m sorry.” When he just sighed, she took
    her hand away. “Did you know?”


    He lunged away from her. “No! Never!”


    “But you knew something,” Scharf said evenly.


    All the fight seemed to leak out of him onto the wooden floor. The Baos had returned
    to the counter and were waving their customers back. I felt guilty about disrupting
    their morning, but they seemed to be recovering without really noticing.


    “She’s done this before?” Scharf said softly. “Something like this before.”


    He shook his head.'
