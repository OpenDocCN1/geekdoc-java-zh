- fmt: "\nI rubbed two fingers by my ear to be sure I could still hear, shocked by\
    \ the sudden silence. The constant humming drum on the windows and roofs of every\
    \ building I’d sheltered in was gone. The dragon joined in her laughter and thunder\
    \ deafened us.\n\n“Thank you very much for your beautiful music,” he said slowly,\
    \ with the slight drawl of a DC accent.\n\nMy jaw dropped in shock. I hadn’t consciously\
    \ realized I was spoiling for a fight, even as I knew how imbalanced our power\
    \ was and how unlikely I would be to win.\n\nAnd Amina had just stopped the rain\
    \ with a lullaby.\n\nI crouched down to be at her level. It didn’t take much;\
    \ she was only a foot shorter than me. “How did you know he needed a song?”\n\n\
