    I passed Astrid in the courtyard of Juya’s home, sitting at the picnic tables
    under the umbrella. She was selling a meager pile of lumpy *cocadas*, Juya’s coconut
    cookies. She looked more put together in jeans and a peacoat than the last time
    I’d seen her, though her coiled hair was hidden in an elaborate green turban with
    a clear plastic cap protecting it. She hailed me, but I waved and continued for
    the door.


    “Things to do!” I said, racing away.


    Juya’s helpers didn’t even bother stopping me when I burst into the house. Whether
    they were still afraid after the fight—both fights—or had given up, I wasn’t sure.
    I took the stairs two at a time and pounded on the door to her bedroom for half
    a second before rushing in and announcing, “I need warm weather by tomorrow!”


    I looked down at her on the bed and winced. She’d aged and lost weight in a few
    days. Osman, sitting beside her in a chair, looked as though he had aged as well
    even though I was almost certain he was human.


    I rushed over. “Juya, you can’t let them get to you!”


    “*Hay muy frio*.”


    I took her icy hand in mine as I knelt beside her bed. “I know, but it’ll stay
    cold if you don’t help me.” Her eyes opened, and I added, “I figured out who it
    is.”


    “*Quien*?”


    “A dragon.”


    Her mouth dropped open, and she sank further into her bed with a dry laugh. “Who?”


    “Kui Liu. He looks almost as old as you.”


    Her eyes flared. “You met this dragon?”


    “Yep.”


    She coughed and curled into her pillows. It hurt deep in my solar plexus to see
    her like this. I couldn’t help feeling guilty, but guilt wouldn’t help her.


    Osman handed her a lozenge that smelled like moss.


    “The dragon’s not doing it on purpose,” I said. “At least we don’t think he is.
    It started during the Lunar New Year, so we’re gonna redo the parade and try to
    snap him out of it.”


    When I leaned closer again, Osman stood up and grabbed my shoulder. “Leave her
    alone.” His voice was urgent but quiet.


    I shook him off. “There can’t be a parade if the whole street is covered in ice.
    If I did it with my water powers, it would take me a month, and we don’t have
    a week. We need unicorns and rainbows now!”


    “Unicorns and rainbows?” Osman asked.


    “Water powers?” Juya asked.


    “I got my father’s box open. A little.” I took my finger and stirred the water
    in the glass on her side table without touching it. Like before, I had to get
    my finger within a foot of the water for it to work. Juya laughed, and it subsided
    into a dry cough as I said, “Oh, yeah, that’s hilarious. Can you help at all?”


    “I am not sure,” she said, but her eyes were keen.


    Gazing at the ceiling, I said, “I think it’s a vicious cycle. Everyone around
    him is freaking out and trying to kill each other, and that makes him more depressed,
    and then everybody freaks out more. In another month, we’re going to end up with
    the city completely frozen and overrun by homicidal maniacs who choke goblins.”


    “Who do what?” Osman asked.


    I took a breath, trying to stay calm. “You really can’t summon the power for dry
    pavement?”


    She shook her head. “There were times when I could summon a *huracán*”


    She looked at Osman, who nodded.


    “There were times when I was feared and loved across the land.” She focused on
    the window with a faraway look in her eyes. “Such powers even you cannot imagine,
    even a powerful dragon cannot imagine.”


    Kui had frozen the capital and started a crime spree. And she said she could dwarf
    that?


    Juya laughed. “But now, who would worship me?”


    She had laughed, but I didn’t. “Me, for one.”


    She sobered and looked at Osman, who said, “*Yo también*. Of course, me too.”


    Juya scoffed. “Stop being nice.”


    I stepped closer. “I’m not nice. If this dragon has proved anything, it’s that
    I’m not at all nice. But Juya, I love you. You saved my mother. You saved me.
    When the world stole from me and tried to stop me, you fed me and protected me.
    I love you! How’s that for power? And Astrid does too. And so many more.”


    “It’s true.” Astrid stood in the doorway, pulling the plastic hood off her head
    but leaving the bright-green cloth. How much had she heard? “She fed me too, Orange.
    I fell behind last year. My rent, school fees, and she gave me a day’s worth of
    food for a quarter. Every day for six months.” She looked at Juya. “I don’t even
    know how you found out.”


    I savored the small smile her story brought to Juya’s face and said, “Magic.”


    “We’re out of food today,” Astrid said. “So we’re closing. Which is a miracle
    since I baked.”


    I leaned in close and asked Juya, “Is that good enough for you?” Then Astrid’s
    last line registered. I straightened. “You baked?”


    Juya tried but failed to smile. “It is so cold. I am so old.”


    I glanced at Astrid and crouched to whisper in Juya’s ear. “Bull. Don’t tell me
    you’re old and you’ve lived your life. That’s the dragon talking. I’m staring
    down the business end of a dozen centuries, and you’re lying here saying you’re
    giving up?” I stood. “If I have to, I’ll have the entire neighborhood knock on
    your door and tell you how much they love you.”


    “*Abuela*,” Osman said, “you’ve been doing favors for everyone for years. Do you
    honestly think no one’s noticed?”


    She sighed. “It is my twilight years.”


    Astrid frowned. “What’s she talking about?”


    I dragged the quilt off her. “Nothing. She’s being crotchety and contrary. Pretending
    her life is over because it’s been long. Get up.”


    Osman jumped. “Orange!”


    “No! She doesn’t need us to sit vigil over her. She needs life!” I spun to confront
    Osman. “Can you get her to Chinatown tomorrow morning?”'
