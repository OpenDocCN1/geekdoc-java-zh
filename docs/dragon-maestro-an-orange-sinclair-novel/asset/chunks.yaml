    “Orange, it’s bad.”


    I squeezed her shoulder, too. “It’ll be okay.”


    She opened the door at the top of the stairs, and I squinted in the dim light.


    A canopy bed with a brilliant multi-colored woolen blanket stood in one corner.
    The windows were covered with red curtains that let in dim pink light from a streetlight.
    A woven rug that almost matched the bedspread lay across the hardwood floor. The
    room looked homey and cozy. An earthy smell permeated everything, as though we
    were stepping into a jungle.


    I crossed the threshold and took a second to screw my face into a smile as I caught
    sight of the tiny lump in the bed. “What’s this I hear about you lazing around?”


    As Juya coughed, I straightened my shoulders and stepped around the foot of the
    bed to go to her side. Her head was propped up on a white lace pillow, her thick
    gray hair spread across it. Her face looked almost like a prune, so wrinkled I
    could barely see her eyes. She looked old—much older than she usually did.


    She whispered, the faintest accent coloring her vowels, “It’s just a—what’s the
    word—an ant.”


    “A bug?” I sat down on the bedspread and took her gnarled hand in mine. It was
    ice cold.


    Juya coughed again and curled into herself. Osman shoved past Astrid and picked
    up a teapot on the bedside table and filled a delicate porcelain cup. That was
    where the smell was coming from.


    I had no healing powers. I could move earth around, and I could use human emotions
    to play little jokes, but I’d never felt less like joking and more like crying.
    “Juya,” I said gently, “what can we do?”


    “Nothing. It’s nothing.”


    “It’s not something—” I glanced at Astrid. “—*weird* that I could take care of
    for you?”


    Juya chuckled, a shadow of her usually joyous laugh. *“Duende*, you cannot pull
    the roof down to make this better.”


    “What will everyone say when they see the building falling apart?”


    Her eyes flew open, revealing black irises. “What are you talking about?”


    I leaned close to her and whispered, “This place looks like an abandoned building.”


    “To you even?”


    She closed her eyes, and the room shivered. I shivered with it.


    She gasped and lay back against her pillow. “There. I hadn’t known I’d locked
    my home to everyone.” She looked up at me, her face ashen. “I had not meant to.”


    I took her hand again. “Well, good. Because we’re opening the bakery for you.”


    “That’s the perfect idea.” Astrid clapped her hands.


    Juya was a goddess; she granted boons the way I made bargains. She *needed* them,
    and exactly the moment she was weakest, she was missing her principal source of
    power.


    “I feel…” Her eyes lost focus and drifted toward the ceiling. “*Vieja*.”


    “I don’t know what that means,” I whispered, stroking her hand.


    “Old.”


    I was going to protest that she wasn’t at all old, but she counted her age in
    millennia. She’d never seemed weighed down by the years until now. She delighted
    in simple pleasures that had long escaped my notice, choosing to spend her eternity
    baking and making small talk. The seemingly minor exchanges fed her power after
    all these years.


    I leaned down and rested my lips against her forehead. It was cool. I consoled
    myself that at least she didn’t have a fever, but she shouldn’t be this cold.
    Not a goddess born in the Colombian rainforest.


    “You’re not old.”


    Juya smiled. But I could tell the effort cost her, and she was only doing it to
    placate me.


    I opted for Astrid’s platitudes and ramped up my energy, cracked my knuckles,
    and said, “Well, you’ll see that everyone still needs you after they eat my baking
    for a day.”


    She closed her eyes, and her head drifted to the side. My stomach bottomed out.
    I blinked away my tears as I went downstairs.


    Juya couldn’t go. There were very few people I trusted, and she quite possibly
    was at the top of the list. She’d been the only magical creature who’d asked nothing
    of me and who’d actually tried to *help* when I’d shown up in DC for my father’s
    inheritance, thinking it was finally some financial assistance and learning I
    was a goblin instead.


    She didn’t try to take them or take advantage of me. She helped protect me, and
    when she’d heard of my mother’s trouble, she’d written me a check—no questions
    asked. Early onset Alzheimer’s is pricey to treat.


    After repairing my smile, I turned right at the base of the stairs into her kitchen
    with its 1950s Formica table, a huge fridge from the same era, and a cast-iron
    stove that dominated half the room, now sitting cold. The clock on the wall said
    12:30 am. I felt unbearably tired and off myself.'
