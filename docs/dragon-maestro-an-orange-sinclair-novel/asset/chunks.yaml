    随着她向南行驶，我问道：“我们为什么要去华盛顿的停尸房？你们自己没有自己的吗？那种你们绝不被允许靠近任何地方，”我一边说边回答了自己的问题。


    Scharf 靠向路边停车时没有评论。那栋建筑是新的，呈现出一种席卷这座城市的玻璃与金属风格；它与 70 年代那种到处都是、无止尽的粗野主义水泥建筑格格不入。并不。


    在大厅里，Scharf 出示了她的证件，当我们走向电梯时，我保持着低调。我想起了上次去停尸房时，在看到第一具尸体时几乎处于恐慌的边缘。在短短几周内，发生了多少变化？我见过比停尸房里的尸体糟糕得多的。


    电梯在底层响了声，Scharf 领路来到华盛顿法医办公室。Scharf 说：“他已经认识你了，所以没必要躲着。”我点了点头，她按开了门。尽管如此，我一直半闭着眼睛，直到我看到房间中央的金属手术台是空的。


    ### FBI 探员


    罗伯特·兰格博士穿着白大褂，带着疲惫的微笑，从房间侧面的桌旁转过身。透过龟纹眼镜，他的眼睛看起来有些浑浊，深色的皮肤在病态的荧光灯下闪着光。他可能四十多岁，比
    Scharf 大十岁，而且在我看来，他是一个绝对的好人之一。


    “兰格博士。感谢您抽空，”Scharf 说，并伸出手。


    他握了她的手，然后又去接我的手。“你的名字叫 Red（红色），对吧？”


    “是 Orange（橙色），”我说，随后才想起 Scharf 在上次访问时将我介绍为 Red——也是一名 FBI 探员。我脸红了一下。


    他耸了耸肩。“我知道是个颜色。”


    我清了清嗓子。“你很擅长记名字。”


    “希望如此。医生的工作有一半就是记住该如何称呼所有东西。”他大笑起来。


    我眨了眨眼。他看起来还是和往常一样开朗，不受雨天气的影响。尽管我并不太了解他，不知道这是否在演戏。


    ### 上升的谋杀率


    “我能为局里做什么？据我所知，没有华盛顿的案件是和你们重合的。过去几周我们这里很受欢迎，但我没注意到联邦政府的介入。”他是这座市的病理学家之一，除非涉及联邦指控，否则他通常不处理
    FBI 的案件。


    我皱起眉。“过去几周很受欢迎？”


    他忧伤地点了点头。“还有三个人在我们这儿‘享受招待’过夜。通常天气转冷时，我能休息一下，但这波连杀案并不在乎统计数据。”


    Scharf 在我身边变得紧张起来。“连杀？我认识的一位侦探提到过抢窃案。我没意识到谋杀率正在上升。”


    “噢，我想那不是你们官方定义上的‘连杀’。但两周内十五起命杀案，足以匹配我们历史上最糟糕的几周。而且这还没算其他的。”


    “其他的？”Scharf 和我异口同道。“十起自杀，三十起意外死亡。我们不得不把几具尸体运往马里兰州和弗吉尼亚州。”他指向桌子后面那一排足部大小的钢门。


    “我很抱歉，”当沉默陷入僵局时我说。


    ### 请求复审


    “你们在看哪桩案件？”兰格博士说，语气中带着一丝哀伤。


    “不是华盛顿的那个，”Scharf 说，显得有些不情愿。


    当她声音变小时，我说：“我们希望您能审查一些文件。”


    我像她常做的那样交叉手臂，迈开脚，试图让自己看起来正式一点。是的，我体能上比任何探员都强，但没有人从我的外表能看出这一点，我不认为自己能恐吓到任何人。尽管如此，我还是努力表现得专业。


    Scharf 点点头。“如果你能抽空的话。”


    “但不是华盛顿的案件？”他的声音里有一种之前没有的警惕。尽管她对咨询其他专家充满热情，但在面对非正式分享 FBI 内部事务的任务时，Scharf 发现这并不容易。


    ### 餐厅杀手


    “‘餐厅杀手，”我替她回答道。


    兰格博士的下巴掉了下来，棕色的眼睛里亮起了兴趣。“我在报纸上看到他们在唐人街发现了另一具尸体。当然，那是送到你们的实验室了。你觉得他回来了吗？”他身体前倾，揉着手。“连杀案是我的小爱好，你懂的。”


    我想告诉他我完全不理解，但而是点了点头，试图跟上他的热情。我再次看向 Scharf，她的嘴张了又合上，但没有发出任何声音。


    “我们是在寻求——第二意见？”我用手肘碰碰 Scharf。


    “第二意见。”她点了点头。“关于尸检报告的。”


    他眼中的兴趣消失了，变成了怀疑。“你是说，在 FBI 历史上第一次，一个联邦病理学家想要我的帮助？”


    “你看着，兰格博士——”我开始说，语气严肃。


    “叫 Bob。”


    “Bob……”我的声音渐渐变小。不是因为我想不出什么谎言，而是因为我不知道什么说法对法医来说听起来是合理的。我瞥了一眼 Scharf。


    “Bob，”她说，“FBI 的那些人对连杀杀手可能再次出现很感兴趣。而且他们也对我们可能抓错了人感到 {不安。问题是，我不认为我们真的抓错了人。”


    ### 调查开始


    兰格博士挑起眉毛。“你看着，兰格博士——”我开始说，语气严肃。


    “叫 Bob。”


    “Bob……”我的声音渐渐变小。不是因为我想不出什么谎言，而是因为我不知道什么说法对法医来说听起来是合理的。我瞥了一眼 Scharf。


    “Bob，”她说，“FBI 的那些人对连杀杀手可能再次出现很感兴趣。而且他们也对我们可能抓错了人感到不安。”


    ……他把旧的文件推到一边，把最近的两份放在一起，一个是罗杰·克拉克的，另一个是泽地公园的。我吞了吞口水。我翻过第二个文件，但没有发现任何明显的迹象表明“这具受害者不是人类”。


    当兰格没有大喊类似的话时，我深吸口气。看来，当鬼死去时，我们足够人类，足以欺骗病理学家。


    '
- fmt: '

    Scharf stayed perfectly still, her arms on her hips as the doctor read. I, on
    the other hand, fidgeted. I wanted to pace but didn’t want to get any closer to
    the back wall of steel refrigerator doors than I already was. For a second, I
    considered doing cartwheels down the hallway or something.


    “That’s different,” Lange said after a few minutes.


    “What?”


    “Your first victim had large amounts of phenobarbital in his system. That’s a
    change.”


    “What is it?” I asked.


    “A medication, but not very common.”


    “He was an epileptic,” Scharf said.


    “Oh, yes,” he looked disappointed. “Well, that’s one thing this treats. But outrageous
    amounts.”


    “Deliberately large amounts?”


    Dr. Lange met each of our eyes. “Possibly. But no alcohol whatsoever.”


    Scharf took a breath. “And the other victim?”


    “This is interesting,” Dr. Lange said a minute or two later, switching files.


    “Yes?” Scharf asked. “Do they match?”


    He glanced up and laughed. “It’s going to take me a little while to figure that
    out. But the force listed here must be a typo.”


    “Which one?” I asked.


    “This here. The second victim. Second?” He checked the top of each file. “Yes,
    the man found behind the dumpster. It must be wrong. No one can generate that
    kind of force to snap someone’s neck by hand from the front.”


    I winced. “What does that mean?”


    He looked up at me. “From this, I can only conclude that your murderer was the
    Hulk.”


    I laughed hysterically. I usually tried not to do that because I sounded like
    a cackling goblin. Scharf’s hand landed on my shoulder and squeezed. Hard.


    “I can check into those numbers with our ME,” Scharf said, hand still on my shoulder.
    “Should we come back later?”


    Dr. Lange didn’t answer, just flipped quickly through the old printouts of the
    original autopsies.


    “We can come back,” Scharf repeated.


    Dr. Lange held up a finger, switching back to the new murder files. “I would love
    to dig in more, but at first glance, I can tell you they are likely not the same
    killer as before, either of them. And not the same killer as each other. And neither
    had any alcohol or drugs in their systems except the anti-seizure medication in
    victim one. And every original victim was three sheets to the wind.”


    I elbowed Scharf. “See?”


    Scharf controlled her excitement, but I could feel her vibrate. “You’re sure?”


    “I’ll read through these, make some notes about how I reached that conclusion,
    but a first-year med student could read these tox reports.”


    “But you’re sure they’re not the same killer as each other? Their alcohol levels
    can’t show you that.”


    He smiled briefly. “No. Your first killer was right-handed, while your second
    was left-handed. Your second was as tall as—as I’ve ever seen—while your first
    was around the same height as the victim. The first likely knew his killer—the
    strangulation happened from the front and his fingers are unmarked.”


    “No defensive wounds,” Scharf said.


    He nodded. “He knew the killer and wasn’t braced. Trusted him—or her.” Frowning,
    he looked between the two files. “I’ll have more for you tomorrow.”


    I got my hand on the door when he said, “Wait a second.”


    “Yes?”


    “I can also tell you Rodger Clark’s records have been altered.”


    Scharf rushed over to him. “What are you talking about?”


    “Someone has rewritten parts of these files. The handwriting doesn’t match.”


    She cocked her head. “You’re a handwriting analyst?”


    “No, but as I mentioned, I do have fabulous attention to detail. Or was that my
    fabulous memory?” The twinkle in his eyes gave lie to the hubris of the statement.
    “Regardless, this writing isn’t from the same hands. Someone has altered this
    first file.” He pointed. “Here, here, and here.”


    Scharf leaned over his shoulders. “Changed what?”


    “Mostly about blood. About bruising patterns and things like that. A pity. It
    was done well. I can’t tell what it originally said.”


    “Why?” I asked.


    “I couldn’t speculate, but someone involved in the original investigation did
    not want anyone to see the original autopsy.” He rubbed his eyes, knocking his
    glasses off the bridge of his nose. He replaced them as he said, “I’ll mark those
    places. And then I trust you’ll take my conclusions far, far away from me.”


    “Absolutely.”


    Scharf met me at the door, and we got out of there.


    “How do you think he managed to change the file?” she asked.


    “Fuller? I don’t know, magic?”


    She shuddered. “Don’t even joke.”


    I laughed again but gnawed on my lip to stop. “I wasn’t.”


    Like our last visit, we took the emergency stairs to the main level. Unlike last
    time, I wasn’t hiccupping or crying.


    Like last time, Scharf stopped halfway up the stairs. “How did he do it?”


    I sat on the stairs, watching the stripes on her jaw get redder and redder. She
    was clenching her teeth, angrier than I’d ever seen her. I wanted to tell her
    to take a deep breath but instinctively knew that that would only make things
    worse.


    “Not how, but when could he have done it?” I asked.

