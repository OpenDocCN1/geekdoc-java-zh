    He spun to get away and stepped out from under the awning and onto the ice. He
    did an impressive dive and skidded. As he did, his bag burst open, revealing a
    bigger microphone, more esoteric recording equipment, and a little baggie that
    leaped straight into my hands on a puff of magic I could barely sense.


    I held it up and saw a little bracelet made of silver in a bag for snacks, not
    an official evidence packet. I flipped it over. Printed on the bracelet was a
    red cross, the universal symbol for medical alerts, and tiny letters: `Rodger
    Clark, Epilepsy`.


    Sometimes I `loved` my magic.


    I showed it to Scharf. “I did bargain for him to give me everything he has on
    the waitress.” I snapped my fingers, remembering my half of the bargain. “Oh yeah,
    here’s your big scoop.”


    “Yeah?”


    He looked interested, even as he gripped his elbow and tried to get up. I leaned
    down. “This ice storm is being caused by a dragon.” I pointed to the music shop.
    “He works there.”


    “What the hell?” he demanded.


    Scharf plucked the baggie out of my hand and kneeled beside him, making no move
    to help him up. “Where did you get this?”


    “I don’t have to—”


    “Where?” she asked, deadly quiet.


    “It was in her locker! Like right there. I don’t know how you guys didn’t find
    it.”


    “When?”


    “An hour ago?”


    “You are under arrest for tampering with evidence.”


    As Scharf flipped the podcaster over, she gestured with a chin. “Can you magic
    that?” I looked at the recorder and snapped something in it. “And go tell Carlisle
    to arrest the waitress.”


    Carlisle burst out of the restaurant. “She’s gone!”


    “Naturally.” Scharf sagged.


    Carlisle looked down. “Who’s he? Never mind. The waitress walked out on her shift
    fifteen minutes ago.”


    Scharf dug for her phone on her belt. “I’ll put out a BOLO.”


    “I’ll put out a BOLO,” Carlisle said and scrambled to get his phone.


    “What’s a BOLO?” I asked.


    “Be On the Look Out,” Scharf said. “Don’t get distracted. He can handle this.
    Go fix the weather. We have to stop the dragon before anybody else dies.”


    Carlisle turned back to us, his phone at his ear. “Did you say dragon?”


    # 20


    I hadn’t exactly told Scharf the truth. I couldn’t turn off the weather. But `Juya`
    could. I left Carlisle and Scharf duking out who was going to inform what agency
    about the missing waitress and headed for Juya’s. I just didn’t know if Juya was
    going to be in any shape to do it.


    I passed Astrid in the courtyard of Juya’s home, sitting at the picnic tables
    under the umbrella. She was selling a meager pile of lumpy `cocadas`, Juya’s coconut
    cookies. She looked more put together in jeans and a peacoat than the last time
    I’d seen her, though her coiled hair was hidden in an elaborate green turban with
    a clear plastic cap protecting it. She hailed me, but I waved and continued for
    the door.


    “Things to do!” I said, racing away.


    Juya’s helpers didn’’t even bother stopping me when I burst into the house. Whether
    they were still afraid after the fight—both fights—or had given up, I wasn’t sure.
    I took the stairs two at a time and pounded on the door to her bedroom for half
    a second before rushing in and announcing, “I need warm weather by tomorrow!”


    I looked down at her on the bed and winced. She’d aged and lost weight in a few
    days. Osman, sitting beside her in a chair, looked as though he had aged as well
    even though I was almost certain he was human.


    I rushed over. “Juya, you can’t let them get to you!”


    “`Hay muy frio`.”


    I took her icy hand in mine as I knelt beside her bed. “I know, but it’ll stay
    cold if you don’t help me.” Her eyes opened, and I added, “I figured out who it
    is.”


    “`Quien`?”


    “A dragon.”


    Her mouth dropped open, and she sank further into her bed with a dry laugh. “Who?”


    “Kui Liu. He looks almost as old as you.”


    Her eyes flared. “You met this dragon?”


    “Yep.”


    She coughed and curled into her pillows. It hurt deep in my solar plexus to see
    her like this. I couldn’t help feeling guilty, but guilt wouldn’t help her.


    Osman handed her a lozenge that smelled like moss.


    “The dragon’s not doing it on purpose,” I said. “At least we don’t think he is.
    It started during the Lunar New Year, so we’re gonna redo the parade and try to
    snap him out of it.”


    When I leaned closer again, Osman stood up and grabbed my shoulder. “Leave her
    alone.” His voice was urgent but quiet.


    I shook him off. “There can’t be a parade if the whole street is covered in ice.
    If I did it with my water powers, it would take me a month, and we don’t have
    a week. We need unicorns and rainbows now!”


    “Unicorns and rainbows?” Osman asked.


    “Water powers?” Juya asked.


    “I got my father’s box open. A little.” I took my finger and stirred the water
    in the glass on her side table without touching it. Like before, I had to get
    my finger within a foot of the water.”

