    At the next stop, a trio of drunk military dudes, judging by their buzzcuts, trooped
    on, crowing over catching the last train.


    “How much?” one of them asked me.


    I didn’t realize he was talking to me for a second, because I thought I was invisible.


    He stepped closer. “Come on, doll, how much for a night?”


    I rolled my eyes and told him to forget me, trying to decide whether to be offended
    or flattered by his offer.


    “What the—did you see that, dude?” He waved a hand in my direction.


    “What dude?”


    “That chick disappeared!”


    “You’re drunk!”


    The car started moving, and they staggered into seats, still debating what he’d
    seen. I held my breath until they started razzing each other about striking out
    at the bar.


    I was still getting used to the attention my glamour received. The real me with
    my orange skin and frizzy hair and flat chest did not get questionable offers
    from guys, no matter how drunk. My blond hair was apparently a real step up.


    I jumped off the train at `Columbia Heights`, thankful I’d avoided any other challenges
    or offers. I jogged through the rain between gentrified big-box department stores
    into `Juya’s` neighborhood of coffee shops and Latin grocery stores a few blocks
    away.


    Juya lived in a two-story 1920s townhouse ubiquitous in DC with a bunch of young
    relatives. Possibly they were just self-appointed helpers; I’d never gotten a
    clear picture of the web of relationships.


    I froze when I hit her street. Her once-vibrant courtyard now looked derelict.
    The brick and wood townhouse was falling down between its identical twins on either
    side. I couldn’t breathe for several seconds until I remembered this is what `Scharf`
    and anyone else `Juya` didn’t want to talk to saw when they came here.


    The fact that she was trying to ward off all comers—including myself—tripled my
    worry. The gate hung off its hinges, and the courtyard was full of debris. I knew
    it was an illusion, and the courtyard was full of chairs for her bakery customers,
    but when I kicked the gate with my toes, a soup can skittered across the concrete.
    Unlike my illusions, which lasted so long as you didn’t touch me, `Juya’s` went
    straight down to physical reality. Which begged the question, were they even illusions?
    And how could someone who could do this get sick?


    I jogged up the broken steps to her townhouse and pounded on the door.


    `Astrid` opened it, looking worried and sleep-deprived. She wore a bulky gray
    coat and gray sweatpants with `Howard` printed down one leg. She’d wrapped her
    normally impeccably styled hair in gray silk. It bemused me she’d coordinated
    her midnight outfit, though her face was bare of makeup and her dark skin was
    shiny with sweat.


    “Can I come in?” I asked.


    “Are you going to tell her she doesn’t have to go to the hospital?”


    “I’m coming in.”


    We stared at each other for another second before she stepped aside. “Fine.”


    I followed `Astrid` up the stairs, where I’d never been before. I’d hung out in
    the kitchen downstairs and mostly spent time in the courtyard out front where
    `Juya` sold baked goods.


    Upstairs, it smelled of stale baking and medicine, which made my heart hurt. One
    of her helpers, `Osman`, a Colombian man dressed in blue pajamas from the fifties,
    though he was only in his twenties, sat gray and listless halfway up the stairs.
    I squeezed his shoulder as I went by.


    “I was here for dinner and she fainted, and she’s only gotten worse,” `Astrid`
    said. “Orange, it’s bad.”


    I squeezed her shoulder, too. “It’ll be okay.”


    She opened the door at the top of the stairs, and I squinted in the dim light.


    A canopy bed with a brilliant multi-colored woolen blanket stood in one corner.
    The windows were covered with red curtains that let in dim pink light from a streetlight.
    A woven rug that almost matched the bedspread lay across the hardwood floor. The
    room looked homey and cozy. An earthy smell permeated everything, as though we
    were stepping into a jungle.


    I crossed the threshold and took a second to screw my face into a smile as I caught
    sight of the tiny lump in the bed. “What’s this I hear about you lazing around?”


    As `Juya` coughed, I straightened my shoulders and stepped around the foot of
    the bed to go to her side. Her head was propped up on a white lace pillow, her
    thick gray hair spread across it. Her face looked almost like a prune, so wrinkled
    I could barely see her eyes. She looked old—much older than she usually did.


    She whispered, the faintest accent coloring her vowels, “It’s just a—what’s the
    word—an ant.”


    “A bug?” I sat down on the bedspread and took her gnarled hand in mine. It was
    ice cold.


    `Juya` coughed again and curled into herself. `Osman` pushed past `Astrid` and
    picked up a teapot on the bedside table and filled a delicate porcelain cup. That
    was where the smell was coming from.


    I had no healing powers. I could move earth around, and I could use human emotions
    to play little jokes, but I’d never felt less like joking and more like crying.
    “Juya,” I said gently, “what can we do?”


    “Nothing. It’s nothing.”


    “It’s not something—” I glanced at `Astrid`. “—weird that I could take care of
    for you?”


    `Juya` chuckled, a shadow of her usually joyous laugh. “*Duende*, you cannot pull
    the roof down to make this better.”


    “What will everyone say when they see that?”

