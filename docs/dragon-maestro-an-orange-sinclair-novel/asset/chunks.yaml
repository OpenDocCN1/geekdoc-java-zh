- fmt: '

    We walked past a place selling Thai bubble tea, a Japanese restaurant that sold
    sandwiches, and a fusion restaurant selling Thai, sushi, and Chinese food, though
    all I could smell was the motor oil the rain was blasting off the streets.


    Someone whooped behind us, followed by the familiar splinter of shattering glass.
    Scharf and I pivoted to see a man in a hockey jersey leaping into the air and
    screaming with joy as he smashed the window of a curio shop and jumped through
    it, mowing through a stationary display.


    She squeezed my arm and pulled me away. “We have to go.”


    “You’re not going to play the hero?”


    She shook her head. “There are no heroes tonight.”


    We ran toward the end of the block, past restaurant after restaurant. I didn’t
    know how any of them stayed in business, considering all the competition.


    When we reached the end, Scharf turned left, further away from the car, but I
    didn’t argue. As more glass shattered behind us, I realized she was right; one
    person could never stop this. I pushed the thought away that maybe Jack could
    have.


    The crowds were thinner here. The metro and most of the parking structures were
    in the other direction, so we could pick up our pace. My pounding heart didn’t
    slow; from this distance, the crowd sounded like a roaring beast.


    We passed a bank and a teashop, and someone screamed. Scharf spun, her hand on
    her weapon. I reached through my fatigue and fear for my magic.


    “He’s dead!” A guy raced into the street from the darkened alley beside the teashop.


    # 3


    “Who’s dead?” Scharf asked as we skidded to a stop.


    The guy turned his tear-stained, grief-ravaged face toward us and repeated, “He’s
    dead!”


    I rubbed my hands together, feeling extra strength build in them, grateful again
    that I no longer had to make a bargain or ask anyone for permission. Magic arrived
    on command.


    I really hoped I didn’t need it. Up close, I could see he was young, maybe even
    still a teenager. He wore what I thought of as generic restaurant attire. Jack
    wore it often: jeans, dirty sneakers, a beat-up long-sleeved shirt, and an apron.
    His hair was tucked into a bandana around his forehead.


    “Sir, are you in danger?” Scharf called out. “What happened?”


    “He’s dead!”


    “Where?” Scharf drew her weapon. She did a sweep of the street and pointed with
    the muzzle of her Glock towards the alley he’d run out of.


    “In the alley?” She got in his face. “Sir, in the alley? Was there anyone else?
    Did you see anyone?”


    “N-no!”


    She dashed towards the dark, skinny opening between the bank and an Italian restaurant,
    weapon by her side, sweeping the area like she had the spectators at the game.


    “What about backup?” I shouted just before she disappeared.


    “This is not a riot,” she yelled over her shoulder and ducked down the alley.


    I scanned the street, trying to spot a murderer. A couple of hockey fans looked
    at us, but none of the other spectators surging down the street paused. One thing
    I didn’t have was super senses. I could barely see through the rain, let alone
    sense lurking danger.


    We were in front of a series of three-story brownstones that had been turned into
    shops: a music shop, a teashop, a pasta joint, and a bank. One trash can at the
    corner was still overflowing with garbage, but overall the street was much cleaner
    than nearer the arena.


    The music shop had an awning, and I guided the guy under it so we were out of
    the rain, which had slackened to a miserable drizzle. There was a dim light from
    the teashop, but the music shop was completely dark. I did another sweep of the
    street. I couldn’t shake the conviction we were being watched.


    “You’re paranoid,” I murmured and chafed my hands, wishing I could manipulate
    fire instead of earth.


    Finally, I couldn’t take the suspense and got up to stand at the mouth of the
    alley despite the rain, so I could keep Scharf in sight. The kid stood under the
    awning, trembling.


    The gap between the buildings was barely wide enough for a car to pass through,
    and a couple of dumpsters obscured the view to the end. Sickly yellow light illuminated
    a short stretch of pavement from the open door at the side of the pasta joint.
    Something—someone—lay in the light on the ground. I swallowed hard against a jolt
    of nausea and jogged back to the kid.


    Scharf clomped back around the corner moments later, her phone glued to her ear.


    “Yeah, we’re at H and Sixth. It’s behind…” She pivoted to take in her surroundings.
    The music shop didn’t seem to have a name; the tea shop sign said `Long Yinyue`,
    and the restaurant had a huge glowing cursive light bolted into the brick that
    spelled `Pasta Joe’s`. “A restaurant. Yeah, crime scene, Metro PD, BAU, and my
    office. I’ll call there next and get another agent out here for the initial investigation.”


    I frowned. Scharf worked violent crimes, and usually, local law enforcement called
    her in, not the other way around. She only got involved if the case involved federal
    charges. A murder in an alley outside Chinatown didn’t seem like a federal case
    to me, but right now she was trying to roll out her office and the local police
    and, judging from the acronyms, a couple of other agencies. What exactly was in
    the alley?


    “Yeah, I’m sure it was a fork. What do you want me to say?”


    I frowned and mouthed, *A fork?*


    She turned to the kid. “What’s your name?”


    It took him a second to focus on her.


    I went over and patted him on the shoulder. “I know this is hard. Can you tell
    us your name?”


    He shook like a tree in a hurricane and didn’t seem to hear.


    “Focus!” I said, trying to imbue some of my magic into my voice. I borrowed some
    of Scharf’s calm to give to him. My magic came from two sources. The first was
    the earth, helpful in rescuing nachos. But I wasn’t just a goblin, I was a more
    powerful sort called a hobgoblin. I could also draw power from humanity. It was
    useful in the face of a panicky human. It was this power to hob that I threw at
    the kid.


    Blinking like I’d given him a lobotomy, he said, “I don’t know.”


    Scharf looked at me with narrowed eyes. “What did you do?”


    “Nothing.”


    “And by nothing you mean…”


    “I tried to calm him down with a little magic…” I winced as her eyebrows drew
    together with every word I said. “He’s calm now, right?”


    “Orange.”


    “Sorry.”


    “Don’t help me,” she said firmly.

    Carefully, I told my magic to stop, and he started shaking.

