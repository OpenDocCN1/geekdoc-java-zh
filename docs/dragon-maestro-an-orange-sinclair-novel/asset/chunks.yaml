    # 1


    “杀了他，杀了他，杀了他！”我尖叫道。


    特工 Laura Scharf 瞄准那个巨鬼，一记完美的脑中弹将其击杀，然后转向另一个长着像我一样垂耳朵的怪异生物。她也向他开了枪。


    “我们要一直玩一整晚吗？”杰克在我们身后慢悠悠地问道。


    一阵嘈杂的铃声爆发，我们面前的屏幕化成了“高分”字样。


    “耶！”我拍了拍 Scharf 的背，但在她挑起眉后我迅速退开了。“做得不错吧？”


    “还不错。”她盯着街机游戏 `Trolls and Goblins`，收起蓝色的塑料枪。“玩这个更有趣。”她拍了拍大大外套下的隆起处，那里她下班时穿的肩枪套里放着一把真正的格洛克。或者至少是
    FBI 特探员所谓的“下班”状态。


    “如果你用那个那个，”我说，拍了拍她那不需要拔出武器的胳膊，“你会杀掉那个没对你做过什么的街机游戏的。”当她在屏幕顶部输入了自己的首字母后，我转过身。“谢谢你能来。”


    “我不知道你竟然是个冰球迷。”Scharf 露出一丝微而紧张的微笑，扫视着挤满行的人的走廊，那些穿着白色、深蓝色和红色衣服的人在冰球赛间隙休息补充能量。她看起来像在寻找嫌疑人。她在冰球迷海洋中显得格格不入，就像……一个
    FBI 特探员。


    “我很喜欢，”我说。当她再次完全转转身时，我忍不住补充道：“爆米花里不会跳出一具尸体。”


    “你永远不知道。”她拉了拉大大外套，让它更好地盖住武器。


    杰克将手指与我的手指交叉，说道：“很高兴看到你们有空闲时间。”当我们走向围绕着散发着焦黄油味的热闹售卖台的包厢时，他贴着我的耳朵说。“如果没有这个电电灯会更有趣的。”


    他必须得得很大。他比我这五英尺高至少多出一一英尺。


    我吻了他作为回应，但很快分开，留意着我们的电电灯。还有她的枪。这个晚上比我预想的要尴尬得多；在此之前，Scharf 和我在相识的两个月里一直在追捕一名杀手，并努力让自己不死。


    这并没有留下多少闲聊的机会。上述的杀手也扰乱了我与杰克之间萌芽的关系，但让我惊讶的是，这种关系正变成某种东西。


    作为一个大部分失业、大部分无家可归的大学辍学者，我本不认为我和杰克在同一个轨道上，但在魔法世界里，哥布王的继承人和恶魔是完美的配对。


    如果我那弱小的人类半身相信这一点就好了。我带了一个 FBI 特探员去约会。在正式成为情侣之前，我们未来还有几次“信任测试”。Scharf 在军队和后来的 FBI
    经历让她的坏人探测器比我的准得得多。我想看看她怎么看他。


    一声雷鸣几乎震动了整栋建筑，我们都转向位于走廊两侧的通天窗户。私人包厢的入口在上层，至少有三楼高。透过窗户，我们可以看到唐人街旧棕色石头建筑上方翻滚的天空。


    “希望这雨能撑住，”Scharf 低声说，接着检查了通往套房走廊上的标牌，然后眯起眼睛从口袋里掏出一张崭新的票。我完全不知道我的票去哪儿了。当我们通过门时，保安员向我们点了点头。


    “别担心，探员，”杰克说，“他们已经记住我们的脸了。”


    我带着他们快速走向我们的套房，克制住告诉他不要取笑她的冲动。这不正是我所要求的吗？


    我们穿过实木双门，进入了一个装满免费饮料和柔软家具的温暖套房。

    '
- fmt: '

    Until a few weeks ago, I would never have dreamed of wearing red, because my skin
    was orange. Literally. My skin tone came from my goblin father. Some people have
    a winter skin tone, some a summer. On my best days, my skin tint looked like I’d
    poured the cheapest spray tan on the shelf over every inch of me. But one new
    way I’d figured out to use my magic was `adjusting` my appearance with a glamour
    over the real me. I’d chosen a paler, less neon skin color and tamer blond hair
    that looked fantastic in red.


    People say be yourself, but those people don’t have magical glamour to be a better
    yourself.


    Another lawyer passed by, and Jack pivoted to shake his hand like they were trying
    to break each other’s arms before settling back, his arm casually around my shoulders.


    When the teams didn’t emerge, I asked, “When is intermission over?”


    He burst out laughing, attracting lawyerly attention that had me fighting not
    to shrink in the plush seat. “You’re such a huge fan?”


    I tried to think what had given me away; faking sports knowledge usually requires
    cheering when everyone else does. “Not an intermission?”


    “No.” He half-raised out of his seat to shake and smash another dude on the back
    as he passed our seats; they’d met before. They’d all met before.


    He also waved at a pimply teenager who passed him trying to keep a boat of nachos
    from tipping over. The kid wore a jersey three sizes too big and an expression
    that morphed between childlike exuberance when he looked at the ice and teenage
    boredom whenever his father glanced at him.


    When they sat in front of us, Jack’s eyes returned to mine. “Confess.”


    I told the room not to notice me and said, “Okay, no, but Scharf likes sports,
    and I wanted you guys to talk when we weren’t, you know, about to get killed.”


    I whispered the last word even though no one could hear me. I couldn’t really
    disappear, but I could convince people to ignore me. Goblins are champion cowards
    and much of my magic, like unnoticing and glamour, was dedicated to hiding and
    running away.


    He pulled me into him with an arm around my shoulders. “You’re a pippin.”


    “A what?”


    “A pippin? It’s an apple tart. It’s a phrase from…” The players finally burst
    out of the locker room, and he surged to his feet without finishing that thought.
    I wondered when I would get the courage to ask him how old he was. *When you stop
    taking FBI agents on dates, maybe?*


    He settled into his seat again and said, “Okay, you’re a good egg.”


    “Nobody says that but Scharf. But thanks.”


    When our team won the tussle at center ice, the teen one row ahead of us stood
    up, and his nachos tipped off his lap. Before they hit the ground, I danced a
    couple of queso-dipped chips into my hand using my magic. Another part of my magic
    was the ability to manipulate earth, or anything made or grown from it. I popped
    the first chip into my mouth and grinned at the chemical salt flavor.


    Scharf said, “Stop that.”


    “Aww.” I quickly chomped down the second chip.


    “Number one: it’s stealing. Number two: stop that. I liked it better when you
    couldn’t access your magic without a bargain.”


    “So *you* could control when I use it?”


    “So you could only use it when you needed it. No stealing food from kids!”


    Until a few weeks ago, I had to bargain with someone to gain power, always having
    to give up something to gain anything. I was a little embarrassed at how long
    it took me to figure out that since I was half-human, I could bargain with myself
    and do whatever whenever I wanted.


    “They were going to end up on the ground anyway,” I couldn’t resist saying.


    Jack snapped his fingers, and what looked to be a hot dog drowning in chili landed
    in my lap.


    Scharf froze beside me. That wasn’t a metaphor; every muscle in her body tensed,
    and she did not move for a solid five seconds. I nudged her, and she deliberately
    relaxed in her seat, joint by joint. But her eyes never left Jack.


    Gingerly, I righted the flimsy cardboard boat before I wore the chili. Called
    half-smokes, hot dogs were one unqualified delight in DC. The overflowing bucket
    smelled of spices, tomatoes, and grease. My mouth flooded with saliva.


    He frowned at the hot dog. “Sorry. They looked the same to my `Sight`.


    “This is good. Thanks,” I said, my eyes on Scharf.


    I tried for a couple of seconds to get my hands on the blistered, oozing dog,
    but the chili filled the little boat to the brim with mustard and onions on top.
    “Uh, fork?”


    Jack grinned as he brought my hand to his lips to lick my index finger free of
    chili. He effortlessly ignored Scharf staring at him as the lights came up and
    the players faced off in the center again.


    I fought a smile, but said firmly, “Fork.”


    He snapped his fingers again as the referee dropped the ball, and a rain of white
    plastic cutlery in little baggies threatened to swamp the bowl.


    I unpeeled one and dug into the chili.


    “Careful with those, they’re compostable,” Scharf said.


    I noticed they were off-white and bumpier than a normal disposable fork. “Why
    is that bad?”


    “They’ll melt in the chili,” she said with a smile.


    I stabbed the dog; the fork seemed pokey enough for processed meat.


    In front of us, the players took off in what looked like. The arena groaned. Even
    I could tell he’d screwed that up. People in our box slumped in their seats or
    threw up their hands, and I released the breath I didn’t realize I’d been holding.

    '
