    As my heart pounded in the ever-closer quarters, I tried to reassure myself that
    Scharf and I could take care of ourselves, too. A goblin and an FBI agent weren’t
    exactly helpless in a crowd of humans, however crazy they were.


    We were shoved toward the bottleneck at the stairs, then slowed to a crushing
    stop. The air grew hotter, louder, and more difficult to breathe.


    Scharf said into her phone, “You’re kidding me!”


    “What is it?”


    “It’s the Lunar New Year.”


    “I know?”


    “And we’re in the heart of Chinatown.”


    “I know! Didn’t you notice the parade when we came in?” A series of dancers and
    drummers had been walking down the street.


    “*That* was a parade?” she asked.


    “Yeah?”


    “Well, apparently there are more people out there now,” Scharf said. “The subway
    is jammed, and the streets are full. Eighteen thousand people are about to pile
    out of the arena.”


    I cringed. “We have to get out of here.”


    The sound of shattering glass temporarily silenced the crowd. One of the ten-foot-tall
    windows had splintered. I couldn’t see what caused it, but a few guys on the balcony
    of a brownstone across from the window cheered madly. Then somebody wearing a
    jersey with the number two, the same number Jack wore, went plunging out the window.


    That’s all I saw before he disappeared. I *reached* with magic but couldn’t catch
    him in time. His fading scream echoed even above the roar of the crowds.


    # 2


    “Someone went out the window,” Scharf shouted. “Stop!”


    Scharf tried to move against the stream of people to reach the gaping hole, but
    a huge bald man behind us protested and shoved her hard into me.


    Panic weighed my limbs and constricted my chest. “We have to get out of here.”


    I smelled cologne, beer, nacho cheese, and sweat. The temperature was climbing,
    and I fought to get air in my lungs. When you’re the shortest person in the room,
    an angry crowd gets old fast.


    When somebody elbowed me in the kidneys, I screeched and pushed on it with magic.


    Scharf shook her phone. “Hello?”


    “I don’t think that helps,” I told her.


    “No service. Too many people.” She cursed again and put the phone back on her
    belt.


    The bald guy beside me deliberately pushed me away, and I said, “Okay, buddy.
    That’s it.”


    For a second, anger overtook panic, burning my lungs. I tightened my fists, readying
    to push back at him.


    “Orange, get us to the window,” Scharf said quietly, her hand on my fist.


    I stretched my fingers, shocked by my sudden anger. Had I just gathered magic
    to shove an innocent bald guy out of a building? I shook my hands and my head.
    We *had* to get out of here.


    With the burst of magic I’d summoned, I used my short height to my advantage and
    started shoving sideways, pulling Scharf along behind me as people reacted to
    the unexpected direction and let us through.


    In less than a minute, we were out of the crush and pinned instead against the
    intact window next to the broken one, our backs against a floor-to-ceiling banner
    of a pop star I didn’t recognize mid-concert. Another banner of a tall dude in
    red with a basketball flapped in the broken window.


    I fought it aside to glance down. There was no one splattered on the pavement.
    I sagged into the casing and jumped away when a jagged piece of industrial glass
    grazed my biceps.


    “I think it was Jack!”


    “Who was Jack?”


    “Who jumped. Nobody’s dead!”


    “What *is* he?” Scharf glanced at the ceiling. In prayer? Old habit?


    “Never mind that. Now we’re farther away from the stairs.”


    A drunk dude in the opposing team’s jersey shoved me. A loud crack behind me doubled
    my heart rate. I had to dig deep to keep him from going out the broken window
    and me *through* the other.


    I clenched my hands and shoved the crowd and me away from the windows, determined
    not to let anyone innocent die, wondering whether Jack broke the window on purpose
    and bailed without me, endangering all these people.


    *(注：由于提供的原文后半部分存在大量重复的对话和混乱的叙述，已根据指令“保留核心内容”及“优化段落格式”原则进行了逻辑化精简与排版，确保语义连贯)*

