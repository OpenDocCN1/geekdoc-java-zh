    男人们停止了舞蹈，我试着快速数了一下人数：那里快有两个多个家伙了。他们列立着，每个人站在一个不同的展品旁。几个人把手伸进了包里。


    一只手出现在视野中。它的主人就站在摄像头下方，那是我能看到的他的全部了。手指响了响指。


    男人们向空中扬起尘土，并抢夺起那些文物，其中一个人独自搬起了一整面墙瓷砖。他们比我矮得多，大概只有四英尺高，这意味着他们力量大得惊人，或者拥有像我一样的大地魔法。他们`look`
    并不像哥布林。


    现在，房间里响起了抽吸气声和叫喊声。


    “回放！”李要求道。


    [立即购买](https://kylerford.com/book/celtic-shield/)


