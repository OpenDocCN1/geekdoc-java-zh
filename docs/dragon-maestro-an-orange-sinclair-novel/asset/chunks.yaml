    For all her enthusiasm about consulting with other experts, when faced with the
    task of unofficially sharing FBI business, Scharf wasn’t finding it so easy.


    “The Restaurant Killer,” I answered for her.


    Dr. Lange’s jaw fell, and interest lit his brown eyes. “I read in the paper that
    they’d found another body in Chinatown. It went to your labs, of course. Do you
    think he’s back?” He leaned forward, rubbing his hands. “Serials are a bit of
    a hobby of mine, you understand.”


    I wanted to tell him I absolutely did not understand, but instead, I nodded, trying
    to match his enthusiasm. Again I looked at Scharf, whose mouth opened and closed,
    but nothing came out.


    “We’re seeking—second opinions?” I elbowed Scharf.


    “Second opinions.” She nodded. “On the autopsy report.”


    The interest in his eyes faded to suspicion. “You’re telling me for the first
    time in the history of the FBI that a federal pathologist wants my help?”


    “You see, Dr. Lange—” I started, my tone serious.


    “Bob.”


    “Bob…” I faded out. Not because I couldn’t come up with a lie. But because I had
    no idea what would sound plausible to a medical examiner. I glanced at Scharf.


    “Bob,” she said, “the folks at the FBI are intrigued about the potential reemergence
    of the serial killer. And they’re also understandably disturbed that we might
    have the wrong guy. The problem is, I don’t think we do have the wrong guy.”


    Dr. Lange raised an eyebrow. “The one who’s in prison, you mean? John Hastings?”


    “Right. Some physical evidence is pointing toward these new murders being the
    work of the Restaurant Killer. But we’ve… received new information that there
    may be important discrepancies between the original cases and these, particularly
    surrounding blood alcohol levels.”


    “You’re asking me to do what here?” He retreated a little into the room, back
    to his desk, and sat down. “Off the books?”


    Scharf shook her head. “Not at all. I need fresh eyes, who did not see the original
    or the current autopsies. As the case agent, I have a lot of latitude regarding
    how I conduct my investigations, Bob. But yes, it is unusual for me to consult
    local law enforcement.” She seemed to get over her initial reluctance the more
    she spoke.


    Dr. Lange met her gaze. “Instead of the other way around, you mean.”


    “Well, yes. Will you help?”


    He leaned back in his chair and laced his fingertips together. “On the one hand,
    I’d salivate to get my eyes on those reports. As I said, I followed the original
    case—well, as much as I could from the papers.” He gave us a sheepish grin.


    I plopped the files down on the metal table.


    “Don’t put those there.” He leaped up and grabbed them off the stainless steel.


    Although I told myself I was completely fine, I blanched at what my hand had brushed.
    I knew it was probably the cleanest table in DC, but my stomach heaved a little.


    Scharf said through her smile, “I need someone who knows what they’re looking
    at. I can read an autopsy report, but not enough to draw different conclusions
    from the raw data.”


    Clutching the files, Dr. Lange glanced from Scharf to me. “I can’t help feeling
    we’re doing something illicit.”


    “Just tell me yes or no. Do those original autopsies match these, in particular,
    the alcohol levels? Were the victims drunk? That’s all that I want to know. Tell
    me I’m being a paranoid idiot, and this is exactly what it looks like, and we
    caught the wrong guy. Please.”


    I handed over the two new murder files in bulging folders I’d gotten from Mrs.
    Henderson.


    He stood with paper spilling out of his hands. “A copycat? A copycat that is too
    good, like the murderer was involved with the original investigation?” Apparently,
    there was more to doctoring than remembering names.


    Scharf nodded once.


    He took the stack of paper to his desk. He put the old ones aside and opened the
    two newest next to each other, one for Rodger Clark and one for Everglades Park.
    I gulped. I’d looked through the second file but didn’t see anything obvious that
    said, “This victim is not human.”


    When Lange didn’t shout something similar, I took a deep breath. Apparently, when
    goblins died, we were human enough to fool a pathologist. Everglades was simply
    a man visiting DC who got strangled in an alley.'
