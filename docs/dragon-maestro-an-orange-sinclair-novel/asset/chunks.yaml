  raw: 'The Lubber Fiend scrunched up his face. “Hey, no fair!”


    “Well, if you get to be the best fighter, why can’t I be the shortest?”


    A tiny purple goblin shouted, “Who cares if you’re short?”


    I spun around. “Good point.”


    I was getting into the rhythm now, beginning to have a prayer of besting him—if
    I could define “best.” “How about the best Shirley Temple impression?”


    Again, he looked confused. “Who’s Shirley Temple?”


    I gaped at him. “Shirley Temple. Icon of American cinema. Tap-dancing child star
    extraordinaire.” With a huge grin, I broke into a little jig and said, “Can you
    do that?”


    A little purple goblin said, “What do we care about that either?”


    I said, “Cartwheel!”


    I did a cartwheel.


    “We fight to the death!” the Lubber Fiend roared.


    “Why?” I was genuinely curious. “What’ll that prove? How will that determine the
    best leader of goblins?”


    A gentle rain fell. Juya had been optimistic about her hour. I backed slowly away
    from him. *Don’t get distracted, Orange.*


    He followed and asked, “How about the reddest? How about the one with the blackest
    hair?”


    I shrugged. “True, you win in those categories.”


    “How about the oldest?”


    “How about the youngest?” I retorted.


    “How about the one who can jump the highest?” he countered.


    I smiled. “Now there’s one we can both agree on.”


    I leaped into the air, using magic to help me fly. I could tell who wasn’t human
    by whose eyes trailed me up in the air. The Lubber Fiend jumped, but not as high.


    Then he leaped again as I drifted toward earth. He got his hands on my throat
    as we both fell. He was done trying to define “best.”


    I snarled and wrestled his beefy hands away, but my already injured shoulder shrieked,
    and this time the pain shot up my neck. I forced cheer into my voice as I said,
    “Sure, you’re definitely the best strangler, but that doesn’t prove anything.”


    Fortunately, he had to think that one through, and I could take a breath.


    “Orange!” I couldn’t turn my head to the left anymore, so I had to twist my whole
    torso to see Scharf.


    She pointed, and amid the crowd, I spotted a lone figure with one leg and two
    crutches limping toward us on the dotted line in the middle of the street.


    The dragon had come.


    I spared a glance around. The crowd had thinned. Juya looked cold. The acrobats
    packed up as they helped their injured members. The silk dragon was trying to
    rescue the fabric that had fallen to the ground. The band was still trying to
    extricate player from tuba.


    “How about the easiest to squish?” the Lubber Fiend bellowed behind me.


    I turned back. Goblins were very entertaining when we wanted to be. Often when
    we didn’t want to be.


    I’d never felt less like laughing. “How about the funniest? How about your best
    Charlie Chaplin impression?”


    He said, “I knew him!”


    “Great! But everyone has to see you!”


    He mimed falling to the ground and getting up again. Somebody in the crowd gasped
    and pointed.


    I told the world to notice me and started a silly walk. “How about the best Monty
    Python impression?”


    I did another cartwheel and bounced off the light pole. Then I bounced to my feet
    and did a backflip, using magic to immobilize my left side, ignoring the pain.


    For years, people had called me out for not being serious about my life. I found
    it a little ironic that I was in the fight of my life and had to be as unserious
    as I could.


    As the enormous goblin charged toward me, I dodged, so he ran straight into the
    lamppost. This time, the whole crowd laughed. The Lubber Fiend looked around and
    snarled.


    “Good one!” I shouted. His frown melted a little when I clapped desperately. A
    few more people wandered away. We needed to make this bigger.


    I crossed my arms and said, “Bet you can’t make fireworks.”


    He smiled, and I fought the urge to back up. Goblin dental work was not my favorite.
    As he put up an arm, I said, “Make sure everyone can see them!”


    The Lubber Fiend shot sparks from his fingers like sparklers up in the air. The
    exodus slowed as the street filled with colors.


    I grabbed someone’s umbrella and did a sloppy version of the rain dance from *Singin’
    in the Rain*. I barely remembered it, but I knew the key part about swinging around
    a lamppost.


    Suddenly, music filled the square again. I turned to see Mrs. Bao at her piano,
    playing something light and cheery. Quickly, I danced along.


    People clapped, and suddenly Osman asked Teresa to dance with a flourish, and
    they started to salsa to a Mozart concerto. The rain retreated, and for a moment
    I felt genuine hope.


    “We don’t need no fireworks!” one goblin said in a nasal voice, and I turned.


    “Yeah, we don’t need none of that!” another one shouted.


    Mrs. Henderson crossed her arms over the jacket she wore and said, with a smile
    on her lips, “What are you offering, *Peallaidh*?”


    I froze. *What was I offering?*


    What did *I* mean by best? I was here because I was my father’s daughter, which
    was a form of government most humans had abandoned as a poor bet a couple of hundred
    years ago. What did I have to offer at all?


    The Fiend straightened. “You don’t know?”


    “The best is…” Why would anyone follow me?


    The Fiend roared when he saw me hesitate and rammed straight into me.


    We both went flying, and I saw the world almost in slow motion: pavement, sky,
    lanterns, buildings.


    We landed. My body crumpled beneath his as he reared up to hit me, and something
    snapped in my spine.


    The pain was indescribable, and I forgot all about the challenge and the dragon.


    We rolled away as a geyser of water spouted into the air. I glanced down. I’d
    landed on a fire hydrant and broken it in half. With my spine.


    The geyser of water was impossibly cold, quickly soaking me and the street. Mrs.
    Bao stopped playing and people struggled to move the piano away from the new rain.


    I closed my eyes to harden my body with my earth magic, but I couldn’t feel anything
    below my waist.


    Fear replaced pain.


    Blood seeped into the surrounding water beneath me. I tried to get up again but
    failed. Finally, I collapsed into a whimpering heap. The pain in my spine was
    ice and fire and fear all at once.


    Suddenly Scharf was there, her brown eyes round and haunted. “Don’t move.”


    “I’m okay.”


    “Orange, you’re not okay.”


    Juya crouched next to me. It looked like she flew to me, but that was probably
    just my shock. The pain was escalating through my chest, but not below my waist.
    As Juya placed a hand on me, a small bit of warmth seeped into my cooling flesh.


    “We almost did it,” I said.


    Juya said, “*Silencio, duendecillo*.”


    Someone jostled in the crowd and an angry roar went up. Someone threw a punch.
    I closed my eyes. “I guess we should have brought out the rainbows and unicorns.”


    Juya cackled. “That is not what hope is made of.”


    Scharf held one of my hands, and Juya’s magic shimmered around me, but I already
    knew it wouldn’t be enough. My magic wouldn’t be enough, either.


    I was worried for a second about the Lubber Fiend attacking and finishing the
    job, but he posed like a bodybuilder a few feet away, crowing amid the other goblins,
    who all bowed.


    I *knew* my challengers should have bowed to me.


    Kui hovered over me, and I froze. I was getting colder and didn’t know if it was
    the blood I was losing or the freezing water I was sitting in.


    “You see, goblin?” he said. “You see?”


    “I haven’t given up!” It came out as a whisper, and even I didn’t believe it.


    He turned away.


    The rush of anger physically hurt, but I used it to seek my magic. Not to heal
    what couldn’t be healed, but to take this standing up. Surprisingly, my magic
    *pulsed* within me. I’d expected that the events of the last few minutes would
    have drained it, but even with the blow to my back, even with the blood loss and
    the grief in Scharf’s eyes, it hadn’t wavered. I guess there was more to living
    than baking scones.


    I heaved myself off the ground and stood on my own two feet. “If I can get up
    without a spine, what’s your excuse?”'
