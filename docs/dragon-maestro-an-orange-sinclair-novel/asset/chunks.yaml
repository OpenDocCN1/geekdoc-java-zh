  trans: '

    他看着朱雅，眼神中流满了深情，那让我的情感显得黯然失色。他点了点头：“是的，我可以办到。”


    我深吸了一气，闭上眼睛。“*Gracias*。谢谢你。我会一直等的，”我说道，尽力紧紧握住朱雅的手，直到奥斯曼把手放在我的肩膀上，轻轻地将我拉开。


    当我们走到楼梯口时，阿斯特丽德问道：“为什么是唐人街？”


    “呃……那个……”


    “那是她最喜欢的地方，”奥斯曼很快说道。


    “真的吗？”


    “确定的！”我看着他，补充道，“就在`Metro`地铁站拱门下面。”


    他点了点头。


    我看了他们一眼。“你们能把消息传出去吗？所有能来的人都来。”


    “我们要让他们做什么呢？”阿斯特丽德问。


    我看向奥斯曼。


    “崇拜她吗？”他皱着眉说道。


    “是比喻意义。嗯，差不多吧，”我补充道，“就像我说的。我们需要告诉她，她对我们意味着有多重要。”


    阿斯特丽德似乎接受了这一点。“但`Orange`……”


    “你需要什么？”


    她叹了口气。“`Orange`，我们的蛋糕怎么办？如果它们不能保鲜，我们可没生意做了。”


    “你会惊讶的，明天之后会好得多的……”我希望如此。


    “那不是我们唯一的问题。我最近几乎没见过你。”


    我笑了笑。“阿斯特丽德，我整个人都是你的。我会全力投入。我辞掉了其他工作。”一想起朱雅，我感到肩膀紧了紧。“除了我明天必须做这件事。为了朱雅。”


    “那是当然。”


    “然后我就是你的了。”


    她对我投来一个怀疑的眼神。“`Orange`，你以前也说过。”


    “然后我就放了鸽子。我知道。但我不会再那样了，好吗？我变了。”


    “你变了？”她笑了起来，“没有人会变的。他们只会屈服于社会压力。”


    “这是哪门心理课上说的？”


    阿斯特丽德咬了咬舌头。“`Orange`！”


    “好吧，最近我忍受了超常的社会压力，让我无法做我自己。”我停顿了一下。“这话这话不妥。做我自己，只有成年人可以。我已经是成年人了。做最好的自己？在我变成焦虑症药物广告之前停下我吧。”


    她对我露出一丝微笑。“我相信你。”


    “我会一直支持你的。”


    她叹了口气，坐在前门台阶上。“不仅仅是你。要办成这个生意几乎是不可能的。任何课程都不会告诉你那种疲惫感。那太不真实了。”


    我强忍着笑。我打过哥布林。沙夫对她的老板大吼过。鲁伯恶魔杀了人。朱雅差点死了。但那条龙只让阿斯特丽德感到了一点累。尽管看着她颓败的眼神，我知道这不仅于此。


    “你应该去睡，而我应该……”*与龙战斗，抓住杀人犯，烤一些蛋糕*……也睡觉。我们达成共识了对吧？你和我在一起，创立伟大的食物帝国，或者你叫它什么。”


    阿斯特丽德抽了抽鼻子。眼中的泪水让我吃一惊。“对不起，”她说，“我不哭。”


    我叹了口气，坐在她身边。“泪水是有力量的。”作为一个地哥布林，我很清楚。当我伸手触碰我的哥布林力量时，我准备了一十句陈词，但我停手了。


    “我从不这样，”她说。


    我试探性地把手放在她的背上。“那你早就该了。”


    我感到一种想要达成交易的急迫感，但我无法通过魔法获得成功，也无法换取她对我的信任。或者对她自己的信任。我想了一个绝妙的笑话，但忍住了舌头。


    “谢谢你今天的帮助，”我说道。


    她用手背擦了擦鼻子，直起身。“你知道的，如果你给我一周时间，我可以为朱雅策划一场游行。”


    我笑了起来。“那部分有人在负责了。”


    她脸色发白。“她糟糕那样了吗？现在不是带她去她最喜欢的地方道别的时候对吧？”


    “不是。”在这件事上我对她撒谎。如果我们处理不好那条龙，朱雅的死亡真的可能发生。“你能聚集人群吗？”


    阿斯特丽德点了点头。“她的一半客户今天已经来过她了。她真的没有意识到自己是这个社区的心脏吗？”


    我摇了摇头。“我觉得我们中没有人知道自己是如何影响这个世界的。”


    # 21


    第二天早晨，我坐在第七街和 H 街角唐人街拱门下的蓝色`Washington Post`报纸投放箱上，双手抱头。在冰雨中，我感到完全的孤单。在透过云层进来的昏暗灰白色晨光中，天气看起来糟糕极了。


    交叉路口周围的建筑挂满了屏幕，在持续风暴的雾气中闪烁着广告。这不像是时代广场。没有了摩天大楼，华盛顿没有地方能比得上那种活力，但这里确实色彩斑斓。斑马线上画着龙。我希望今天街上不只有这些龙。


    破旧的红灯笼依然挂在拱门和附近的建筑之间，那是那场没有人收走的灾难性庆祝活动的遗留。除了这些和街对面一家被封住的窗户外，暴乱已基本清理完毕。我突然觉得这种聚会很疯狂。

    '
- fmt: '

    Juya closed her eyes. In a few seconds, the rain seemed lighter, though maybe
    I was imagining it. I stood up and turned to the crowd.


    I shouted, “Three cheers for…” *Old ladies who save the day?* But as grateful
    as I was to Mrs. Bao and Juya, it wasn’t just them. “For neighborhoods! For DC!
    For us!”


    Many people came to this city, like me, with an agenda, a protest, or a symbol,
    but looking around at the very different crowd than the hockey spectators or the
    ugly riots, I realized it was also becoming home, as it had always been to most
    of this crowd.


    Juya seemed to grow in her chair after the people cheered. The rain stopped.


    The cheering petered out to shocked murmurs.


    I craned my neck to look straight up, something I hadn’t done in weeks. The clouds
    still hung low above the intersection, but the dry air tasted fresh. I looked
    around and saw that many in the crowd followed me, standing in the street, staring
    open-mouthed upwards.


    They didn’t know she had done this, but they exclaimed as the temperatures climbed
    above freezing for the first time all month. Commuters stopped and gawked as well.
    A few workers ran out of their restaurants to stare at the sky.


    We looked up at the clouds like we had suddenly entered a grand cathedral. The
    silence felt holy, broken only by a few bubbles of laughter.


    Then the moment passed, and somebody let out a whoop and the whole crowd cheered,
    and the clouds got lighter still. One man took off his coat.


    I realized we would be okay. Without the dragon’s positive influence, we could
    build our own.


    Of course, it would be faster with him.


    “If you don’t have anywhere to be, stick around!” I announced. “Thank you for
    honoring our favorite baker on this, her birthday.” Juya snorted, and I grinned
    as I said, “A block party will be set up here in a few minutes with entertainment
    and musicians! This is our city. This is our neighborhood! Let’s celebrate!”


    The crowd cheered again. And most of them stuck around, not because I’d told them
    to, but because of Juya, who sat perched in her wheelchair next to the newspaper
    box right under the arch, and Mrs. Bao, who was gathering a crowd of her own carrying
    instruments, mats, and costumes.


    Juya called me over and pulled me down so she could whisper in my ear. “You’re
    very brave, `duende`. And you have an hour before the ice returns. Unless you
    can bring more worshippers.” And then she laughed her familiar laugh, resonant
    and rich.


    I sucked in a breath. I had less time than I’d thought.


