- fmt: '

    I peered down the alley at the dead goblin, then up at the sluicing gutters. Juya
    was sick and Juya could control the weather. Scharf’s entire life was dedicated
    to her job and now she thought she was incompetent.


    “Something is really wrong,” I said under my breath.


    For the second time in a day, I turned invisible even to Scharf.


    # 10


    My phone shattered the silence as I ran through the abandoned streets, following
    my orange line north to Juya. I fumbled in my coat pocket and answered it. “Jack!”


    “Hey! You wanna get some food or something?”


    “Jack!”


    “Are you okay?” he asked, suddenly wary.


    “Are *you* okay? You’re a demon!” Jack packed a heck of a lot more firepower and
    way fewer morals than I. If something was harming the city, would he be immune
    to it?


    “Uh, I thought we’d gotten over that a while ago. Are you all right, Orange? What’s
    going on?”


    “I’m fine. You haven’t…” It probably wouldn’t do our relationship any good if
    I accused him of accidentally killing anyone in the last couple of days. “Don’t
    go to Chinatown.”


    “Well, yeah, after the hockey riot, I don’t have any particular desire to.”


    “Something’s wrong,” I said as I paused at a bus stop. My orange line didn’t end;
    it dipped into the street near the leaning metal sign. I’d learned not to walk
    blindly into traffic when it did this and just wait for the bus.


    “Okay, but can we still go to dinner?” He said “dinner” with a leer in his voice,
    and I rolled my eyes, but then a hint of a smile brushed my lips as he added,
    “There’s this new grilled cheese place in town.”


    “You know what? I’m not even hungry.” A number 70 bus heading north wheezed to
    a stop at the corner moments later.


    “You don’t sound okay at all,” Jack said, more alert, more demon. “What did you
    mean by ‘something’?”


    “One sec.” I waved my `SmartTrip` card at the front of the mostly empty bus to
    pay and collapsed near the back doors, hopefully out of earshot of the driver.
    I couldn’t tell him to forget me since I was the only one on the bus. Still, I
    kept my voice low. “You haven’t noticed anything different lately? About yourself?
    A short temper? A sudden urge to take somebody out?”


    He laughed, and it wasn’t a comforting sound. “Honey, that’s me every day of the
    week. All it takes is driving on the beltway, and I’m mad enough to murder.”


    I sighed. “Don’t tell me that, Jack.”


    “But I don’t do it, Orange!”


    I watched the watery world slide by and tried to shake off the panic clenching
    my throat closed, trying to *think.*


    Not for the first time, I questioned the wisdom of dating a demon. I tried to
    tell myself they were simply spirits with the power of humanity, the same power
    I used when I hobbed. But they had to have gained their nasty reputation somehow.


    “I have broken no laws of any country in the last two days,” he added when the
    silence stretched.


    “Funny.”


    “On the other hand… We could skip the grilled cheese and you can come over and
    we can try to break a few.”


    My libido stirred sluggishly, but I said, “I have to deal with this. A goblin
    died in Chinatown.”


    “And now that you’re the `Peallaidh`, you think you have to find out who did it?”


    “Well, yeah. Plus, I hate rain and I need to turn it off.”


    “You need to turn off the rain?” He shifted from demon to worried boyfriend.


    “Listen, I have to go.”


    “Orange, you’ve never turned down food in your life. And now you’re talking about
    goblins dying and stopping the weather. What are you—”


    “Just don’t—drive on the beltway, okay? And stay inside if you can.”


    “No beltway. No Chinatown. No going outside. This would be fun if you were here
    holed up with me.”


    “In fact, maybe get out of town.”


    “Get out of town?” He didn’t sound angry; he sounded incredulous. “What have you
    wandered into?”


    “I’ll let you know when I know.”


    “If I leave, will you come?”


    I wanted to do that, but right now, I couldn’t trust myself to be around anyone
    I cared about. “I wish.” I hung up, winced, and called him back.


    When he answered, I could hear the smile in his voice. “They have smoked cheese
    in their grilled cheese.”


    “Goodbye.”


    “What?”


    “Not goodbye goodbye. Just, I hung up on you and didn’t say goodbye. Goodbye.”


    “Orange, what is going on?”


    The bus passed into Columbia Heights and I hauled on the yellow string to signal
    a stop. “Look, I’m here. Goodbye. Again.”


    “Where’s here?”


    I hung up before he could say more and pocketed my phone.


    I stepped off the bus and jogged through the downpour. Juya’s courtyard was empty,
    but it heartened me to see that it looked like her normal townhouse and not the
    derelict building I’d come upon earlier. I pounded on her front door.


    No one answered, so I pounded again. I tried to remember what time it was but
    failed. I’d gotten no sleep last night, and the fatigue was getting worse.


    Finally, Osman opened the door.

