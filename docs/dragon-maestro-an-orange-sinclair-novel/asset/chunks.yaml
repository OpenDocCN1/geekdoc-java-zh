  raw: 'But I didn’t turn back when I noticed how our attempt at bringing joy back
    was going. The band had switched to the theme from *Jaws*; one dancer in the middle
    of the dragon’s body had slipped, almost taking the rest of the silk dragon with
    him. One acrobat had fallen and was getting his ankle bandaged.


    No one’s face looked joyous. The bystanders jostled one another. The band fought
    to keep in tune and on tempo.


    Near the barricades, I found Scharf.


    “Is he coming?” she asked.


    *Sure* was on the tip of my tongue, but then I remembered where we were. “I don’t
    know.”


    The jostling among the bystanders turned into a shove and an angry shout. I pulled
    on my hob magic, seeking the lingering bits of happiness, and funneled them to
    the potential combatants. It worked; they calmed, but the effort left me winded.
    And the crowds remained restless.


    “It’s not working,” I said.


    “Well, we tried amusing a serial killer, and that backfired spectacularly. We
    can’t force people to be happy.”


    I hung my head. “We should’ve tried for confetti.”


    “Confetti is illegal in the District of Columbia, but sure.”


    “We’re trying to throw a party in the most uptight city in the country. This is
    a complete disaster.”


    “Happy thoughts, Orange,” she said with the same stoic grimness she always had.


    Many in the crowds started wandering away.


    “You’re right, a complete disaster would be too organized. This is an incomplete
    mess.”


    Scharf spun to look at me. “Orange. Tell me the dragon is coming. He has to come.”


    “Okay, the dragon is coming.”


    “Don’t tell me that if it’s not true!”


    “You told me to tell you… Never mind.” I watched a juggler’s ball slip out of
    his fingers and whack the end of a trombone, which mashed into its owner’s face,
    giving him a bloody, split lip. The band went silent after a final squawk of surprise
    as his compatriots tried to help him.


    “Right now, it might be a good thing he isn’t here,” I said. “This whole affair
    might depress him more.”


    Scharf’s phone rang, and she clapped it to her ear halfway through the first ring.
    “Scharf.”


    After a few seconds, she hung up and stood staring into the middle distance, unmoving,
    ignoring the growing unrest in the crowd.


    “What is it?”


    Slowly, she pivoted to look at the music shop as she said through gritted teeth,
    “It’s her.”


    “The waitress? Where? I thought we established that watching *The Bachelor* is
    not proof you are a murderer. Highly suspect, but not proof.”


    Scharf shook her head. “Lee just got the print report back on the epilepsy bracelet.
    We have her prints because she wanted to embed with working agents. It was part
    of her background check.”


    “What are you talking about?” I asked, and then the phrase registered, and I realized
    Scharf wasn’t staring at the music shop and the dragon. She was staring at the
    teashop and *Melissa.* “No. What?”


    Scharf nodded. “It makes perfect sense.”


    “It makes no sense at all. *Melissa* killed Rodger? Why?”


    “For now, all we know is that Melissa’s thumbprint is on the back side of Rodger’s
    medical alert bracelet that was not on the premises when we searched initially
    but showed up in a waitress’s locker the day a true-crime podcast gets a tip that
    she must have been involved.”


    “Melissa killed Rodger.” I shook my head. “Why though?”


    Scharf shrugged. “Her Uncle was slipping out of the limelight. Forced to retire.
    Her book sales were tanking. The Restaurant Killer was locked up. She was there
    that night, remember?”


    I closed my eyes. “She was at the game.” I tried to envision the pretty, perfect
    redhead with her fake nails wrapping her hands around a kid''s throat. “It’s crazy.”


    “The dragon makes you do crazy things.”


    I shook my head. “No. The dragon keeps you from doing crazy things. Without him,
    you revert to the same asshole you always were.”


    When Carlisle glanced out the window at us, Scharf pasted a huge smile on her
    face. “One way to find out.”


    “What way?”


    She finally looked at me. “You bargain, Orange. You make a bargain.”


    “What could a deranged killer want from me? The bargain has to balance.”


    Scharf smiled. “I don’t know about you, but I know she’s been wanting to interview
    me all week for the book.”


    “I read the book.”


    “The *new* book.”


    I nodded, feeling a stirring of excitement that was so much better than constant
    dread. “That could work. You tell her about yourself. She denies the murder and
    I’ll know if it’s a lie.”


    “No, she has to say it. She was on the crime scene after the murder; she has a
    very plausible explanation for how her prints got on that bracelet. She’ll look
    like a terrible journalist, but not a murderer. Reason number 456 why you don’t
    invite journalists onto crime scenes.”


    I crossed my arms. “You have 455 reasons already?”


    Scharf stretched her neck, cracking it. “I’m sure I could come up with them.”


    “So I am bargaining for her to say the truth, not just for me to know the truth.”


    “Exactly.”


    My neck tightened. “I’ve never done that before.”


    “You’ll be fine.”


    *Happy thoughts, Orange.* I had 455 reasons why it, in fact, may not be fine,
    but now was not the time to voice them.


    I spared a glance around. The acrobats had started making a pyramid. The band
    had moved on to a song I didn’t recognize. Mrs. Bao was playing along on her piano.
    Juya was still talking with her fans. They would have to do the cheering up on
    their own for a while.


    As we got close, I was struck again by how young Melissa was. As we opened the
    door to the chimes, she scribbled in her notebook.


    “Melissa, I have time for that interview today. Now, in fact.”


    “Okay, good.”


    Scharf didn’t sit down. “How about over here away from the window?”


    “You don’t want to keep your eye out?”


    “You think your uncle can’t handle it? Or Carlisle?” Scharf asked and Melissa
    nodded.


    Carlisle smiled. “We got this. And if she comes, we’ll get her.”


    I grinned. “I don’t think so.” All three of them looked at me and I bit my lip.
    I’d forgotten I wasn’t invisible. “I mean, good luck.”


    Scharf led Melissa and me to a four-person table across from the counter which
    was crowded with customers. David swung by our table.


    “Can I get you guys something?” he asked.


    Scharf shook her head.


    “Later,” I said. “You should check out the block party!”


    He nodded. “I was going to. My aunt worked, like, all night.”


    “Is that what’s going on out there?” Melissa asked.


    “Let’s talk about the murder,” Scharf said, sounding stiff and forced to my ears,
    but Melissa didn’t seem worried. David’s gaze bounced between the three of us
    before he ran back behind the counter.


    Melissa took out her notebook and glanced at me. “What’s your role in this?”


    “PR,” Scharf said quickly. “She has no information about the case.”


    Melissa nodded and scribbled as I mouthed, “PR?”


    Scharf’s glare of death told me to shut up, and I schooled my face to neutral
    as Melissa looked up. “So first of all—”


    “We’ll begin with the first body in the alley?” Scharf asked.


    *“*Just a little background. You weren’t involved in the original arrest of the
    Restaurant Killer, correct?” Melissa asked.


    “You mean John Hastings, the man currently incarcerated for the original six murders?”


    I chimed in, “Hastings isn’t the Restaurant Killer. If you’re right.”


    Melissa blinked and said, “Er, yes.”


    “I wasn’t involved,” Scharf told her. “I was working at the Phoenix field office
    and transferred out here a couple of years ago.”


    “And you’re in the Violent Crimes Division here, not Behavioral Science?”


    “Yep.”


    “Could you walk me through a quick bio?” She smiled. “For the book. Background.”


    Scharf glanced at me as though she wanted me to stop the interview, but she returned
    Melissa’s smile. “Born in New Jersey. Degree from Rutgers. Served in the army
    in Afghanistan. Joined the FBI.”


    “You’re a veteran?”


    Scharf merely raised an eyebrow.


    Melissa smiled again. “That’ll play well.”


    “That’s exactly why I served,” Scharf said, and I cleared my throat.


    “Do you have a favorite food? Hobbies? Let’s get some personality into this.”'
