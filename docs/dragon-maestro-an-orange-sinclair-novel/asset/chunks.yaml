  trans: '

    我不想在暴风雨来袭时在外面。我试图说服自己我是在幻想，但自从我的哥布林力量觉醒后，我很快学到了一点：我并不是在幻想。忽视我的直觉是危险的。


    那个流浪汉在下一站下了，抱怨着大雨有多可怕。没有人喜欢雷阵雨；也许我捕捉到了人类对天气所产生的集体防御心理。


    “你好？”一个声音问道。


    我将目光从暴雨中移开，扫视着车厢。


    那个穿西装和风衣的男人背对着坐在座椅上，看起来既冷又疲惫。他耳朵上戴着大耳机。


    “你能看到我吗？”


    我低头一看。一个哥布林绕过座椅进入视野。他比我五英尺高还要矮一英尺，有着深蓝色的皮肤和留着蓝色鱼尾尾的头发。


    “是的，我看到你了。”


    “你是 `Peallaidh` 吗？”他把我父亲的名字读成了 `Peal`。我没有纠正他。苏格兰盖尔语对任何人来说都很难读。我父亲总是把发音圆润化，听起来更像
    `powlich`。


    那个哥布林穿着一件童装恤，正面印满了超级英雄，外面套了一条亮闪闪的小女孩牛仔裤。他闻起来有腐烂的啤酒味。我没有移开他的目光。你永远不知道什么样的力量会集中在小包裹里。我就是最好的证明。


    “你是 `Peallaidh` 吗？”他又问了一遍。他的声音高而纤细。


    我叹了口气，告诉他他想听的话。“是的。我是你们的领导。不管我们怎么称呼它。”


    我很庆幸我们隐藏了自己的身份，因为如果有人在万圣节以外的任何晚上看到他到处走动，他们会尖叫着逃向最近的政府科学实验室。而且我们在华盛顿特区中心，那里有很多实验室。


    我告诉那个戴耳机的男人不要注意到我，以防万一，然后对哥布林说：“我能为你做什么？”


    “我挑战你。”他握起拳头，拍心脏上的胸口。


    “你太晚了。我已经领走了那个盒子。”当我父亲几个月前去世时，他给我留下了一个盒子，里面装着他作为哥布林领袖的力量。我仍然无法打开它，但自从我领走了它，魔法生物世界就对待得像我是他的继任者。我仍然不确定这意味着什么，但我觉得我很快就会知道了。


    “你想要让我下跪吗？”他问道，鼻子皱在一起，直到我能看到他的鼻孔。


    “告诉我你是否该下跪，如果你没跪，我就知道我是否该被生气了。”


    “我拒绝。我拒绝向这个……暴发户下跪。”他再次拍了拍胸口，重复道，“我挑战你。”


    “你已经说过了。为什么？”


    他揉了揉眉间。“为什么？”


    “是啊，你为什么要挑战我？我父亲是顶尖人物，并把盒子里的任何东西传给了我。不是你。”魔法生物的治理结构还停留在中世纪。我流着父亲的血，所以我是顺位继承人。


    “我的工作就是挑战你！”他说。


    “工作？”我眯起眼睛。“有人在付钱给你吗？”


    他摇了摇头。“话不多说了；我们必须战斗。”他在身体两侧握紧拳头，我真心希望他不是想打我。


    我伸手感受我的魔法，尽管我给了他大大的微笑，试图找个出路。“我叫 Orange（橙色）。也许我们可以先聊聊？”


    “我是 Everglades Park（沼泽公园）。”他想再次拍胸口，但畏缩了一下揉了揉胸口。


    “你的名字叫 Everglades？”


    “那是我服务的家族名。”


    “让我猜猜。你来自佛罗里达？”


    “是吗？”他看到我猜出一个叫 Everglades 的哥布林来自佛罗里达，惊讶得大吃一口。


    他不服务于个人；他服务于家族。大多数哥布林统治并守护着家园，并依靠主人的契约来获得魔法，而我从人类的一半身体中自带了来源。在我读过的所有关于哥布林的故事中，我们要么协助人类，要么让他们的生活变得痛苦，取决于他们为我们做了什么。这个小家伙拔根而来找我，真是一件大事。


    我咬住嘴唇不笑出声。我从未见过真正的“佛罗里达奇哥”。不过我想他应该是个“佛罗里达哥布林”吧？


    “`现在`我们战斗。”他将一只拳头举在空中，避开了胸口，然后心不经心地戳向了我的脸。


    我歪头躲开了。事后想起来，我不应该感到惊讶的。难怪哥布林们有了新领袖并挑战她。为什么我们不能一起享受顿愉快的假期盛宴，一边塞满嘴一边阴阳怪气地提到政治或宗教呢？


    他试图再次打我，离我的鼻子近了整整六英寸。


    “如果我还手，我们会弄坏车的。我们不能换个地方战斗吗？”


    Everglades 吼了一声，终于鼓起勇气向我冲来。我把他拨开，心提到了嗓子眼。


    他撞到了轮椅上，那种座椅本该向上折叠，现在却向下坠了下来。我意识到我遇到麻烦了，不是因为他是什么样的挑战，而是因为他比我 `弱得多`。我不想伤害他。


    我不想伤害他。

    '
- fmt: '

    “I’m not letting you down until you say it.” Honestly, I didn’t know what he was
    supposed to say but judging from his, “I challenge thee” repetition, there had
    to be something to end this officially.


    Thunder boomed outside the windows, and rain pelted the glass with new fury. “And
    now the storm is here. Fantastic.”


    He looked up at me in confusion. “Aren’t you the `Peallaidh`?”


    “How’s that supposed to keep me from being soaked?”


    “You are the `Peallaidh`. Stop the rain,” he said matter-of-factly.


    “Stop it?” I scoffed. “I only have `earth` powers. In case you haven’t noticed.”


    “But—”


    I shook him and felt myself tiring. He needed to capitulate quickly. “Are you
    done with your little challenge thing?”


    The goblin nodded. “I am defeated.”


    Trying to judge whether he was sincere, I left him up there for a moment. When
    nothing happened, I said, “Okay, then.”


    I let go of his bonds, and he tumbled to the floor and scampered away.


    “Hey, stop. Where are you going?”


    He turned around. “I am defeated.”


    “So?”


    “I must now go drown myself.”


    I put my hands up. “Whoa. No drowning, dude. Nobody’s gonna drown around here.”


    “I am—”


    “Defeated. So you said. You don’t have to jump into the `Potomac`! Stop.” He stopped.
    “You’re one of the few goblins I’ve met in my life. Do you want to get ice cream
    or something?” I felt like a kid asking someone on a date.


    He tugged on the end of one ear. Like most goblins, including me, his ears were
    long, pointy, and jagged. “You wanna eat with me?” he said.


    “Yeah, I would.”


    “I am not worthy!” he cried and bounded off.


    I called out, “I’ll make a deal!”


    He screeched to a stop.


    “I’ll make a deal,” I repeated, and walked toward him, dodging seat cushions.
    No goblin could resist a deal. “Don’t even think about drowning yourself, and
    we’ll share food. You’ll be worthy if it’s a bargain, right?” Looking terrified,
    he shook his head, so I said, “Okay, never mind. How about the opposite? You don’t
    drown yourself, and I promise never to ask you to share food again.”


    He didn’t say anything but didn’t walk away either.


    “Say ‘deal,’” I told him.


    He nodded.


    I shook my head. “Say ‘deal.’”


    “Deal,” he said, staring at the floor and shuffling his feet. He looked and sounded
    like a recalcitrant child. The chime in my head signaled we had a bargain.


    “Thank you for not dying because of me,” I said with fervent sincerity.


    He looked up at me, his expression serious. “You’d best avoid the others then.”


    My hand slipped to my side in shock. “The others?”


    “My brothers.”


    *Oh, no.* “You have brothers?”


    “Every other goblin in your territory.”


    “What’s my territory?”


    “They are coming for you. They must challenge the `Peallaidh`.”

    '
