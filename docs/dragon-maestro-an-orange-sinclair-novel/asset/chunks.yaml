    I shook out my fingers.


    “It took your father at least three centuries to get through all the challengers.”


    I sat down. Or rather, my legs gave out.


    Mrs. Henderson stood up and peered over her desk. “And he was pretty quick about
    it.”


    “Exactly how old was my father?”


    She shrugged. “I don’t know. At least a couple of millennia.”


    How did I always end up collapsing in front of Mrs. Henderson? I had suspected
    from my research he was older than he thought, but to hear it confirmed so casually?
    I would not lie down on the floor or give in to the panic. “I’m going to live
    forever?”


    “Obviously not. Someone finally dispatched your father.” She paused and added,
    “Sorry to be blunt about it.”


    “No, that actually makes me feel better.” I gulped, figuring I was probably heading
    to a light yellow instead of orange myself. I hoped not.


    Someone shouted from inside the office, and I took a step closer to the closed
    door.


    Mrs. Henderson shook a finger at me, sending her gold bracelets jangling. “It’s
    too late to whine, Orange. You claimed the box. You said, ‘I want my legacy.’
    I said, ‘Don’t do it. Think about this.’ But no. You just had to jump in there.”


    “Okay, the cat has left the barn. The door is open.” I closed my eyes, trying
    to remember the cliché, but failing. “It’s happened. How do I defeat him?”


    “The Lubber Fiend has an unusual skill. He holds elemental fire, not earth. I
    think that’s where he got his name.”


    “What, ‘Lubber’?”


    She nodded. “People called him ‘live by the fire.’ Lubber Fiend. He’s one of the
    few goblins I’ve ever met who likes flames.”


    I examined the backs of my hands, thinking of the djinni. “It’s always fire. We
    always get burned.”


    She arched an eyebrow. “We?”


    “Scharf.”


    “Well, keep her away from the Lubber Fiend. And keep him away from here.”


    The shouting escalated, and I recognized Scharf’s voice. *Scharf* was shouting.
    At her boss. We had to fix the weather, or she wasn’t going to have a job soon.


    Mrs. Henderson worried her top lip. “In fact, you should get out of here now.”


    I didn’t move; I merely ran one pointed nail over my knuckles. “How did he die?”


    “The Lubber Fiend isn’t dead. You’re going to have to do that.”


    I stood up. “I meant my father.”


    The gleam left her eye.


    “I got a letter telling me about the box,” I said, “saying it was my inheritance
    upon his death, but that was it.”


    She slumped at her desk. “He was here in DC, fighting. He was always fighting.
    I don’t know who finally beat him. I’m amazed he lasted so long.”'
