    found my weak point. Grinning, he pounded at the door with his club.


    “Stop it!”


    The door splintered and flew off its hinges. He dashed in, and someone screamed
    inside. I raced after him, a sick sense of foreboding joining my anger and roiling
    my stomach.


    Mert advanced on Teresa, who only had a rolling pin in one hand for defense.


    He lunged for her. I lunged for him.


    I missed. He didn’t.


    The club hit her arm with a wicked crack. The rolling pin clattered to the floor,
    and Mert landed on her at the base of the stairs.


    Teresa whimpered as Mert roared.


    A red haze veiled my vision, and all the anger building in my body flowed into
    my fists. I launched into the air and landed on the goblin’s back.


    He choked Teresa, and I pulled his matted, dirty hair. Hard.


    “Don’t you dare!” I screeched. I reared up and backhanded him in the temple. It
    stunned him enough for me to maneuver him off Teresa, who looked even more shocked.


    “Get out of here!” I screamed as I hauled Mert away by his neck.


    Osman jumped down the stairs muttering about *duende* as he pulled her up with
    him.


    I turned Mert around so I could hit him again. His nose cracked and spurted blood
    that looked almost black. I followed that first punch with a few more, reveling
    in the feel of my knuckles meeting his cheekbone.


    When he stopped resisting, I didn''t register it. I didn’t care.


    Even as my brain told me Teresa was safe, I kept hitting him until Osman jumped
    down and tried to grab a fist. As I reared back to hit him too, his screams finally
    penetrated.


    “Orange! *¡Alto! Dios mio, duende.* Stop!”


    I lunged away from them, all my rage gone, replaced by solid horror. “Is he dead?
    Did I kill him?”


    # 8


    My knuckles were ripped to shreds and throbbed in time with my pounding heart,
    but Mert had it far worse. Blood streamed from a cut under the goblin’s left eye,
    and bruises already bloomed across his chest. I kneeled near him again and patted
    his torso. I swallowed hard when I felt a rib wobble.


    Osman crouched to take the pulse in his wrist. “He’s alive.”


    Something deep in me unclenched, but I couldn’t calm the nausea. I’d never, ever
    lost control like this in my life. I’d been attacked a lot since I’d learned about
    my goblin half, but I’d never retaliated like this, with so much anger.


    I turned to Teresa and Osman to see if they were okay, but they flinched away
    from me. There was no familiar exasperation in their eyes, just naked fear.


    “Sorry,” I whispered as I twisted for the door.


    “Orange!” Osman shouted as I stepped over the ruined wood.


    I stumbled into the courtyard. A thin film of ice covered the entire world around
    me, and it seemed to get thicker with every raindrop. I fell against the gate
    as I tried to get it open and then again against a parked car as I tried to stay
    upright and get away.


    I failed.


    I crumpled onto the pavement between an old pickup truck and a barren oak tree
    in its little patch of dirt between sidewalk slabs. Trying to quell my revulsion,
    I stared at my hands. My bloodied knuckles were already healing with my magic,
    but I didn’t want them to. I needed the reminder.


    Slowly, my breathing returned to normal, and nobody followed. I scrubbed the crystals
    off my eyelashes and the tears and rain off my face, fighting the draining adrenaline
    as freezing water soaked through my jeans.


    “He isn’t dead,” I told myself.


    Between the rain that washed away the blood and my body’s ability to heal itself,
    my skin looked untouched in moments, but what I’d done stained my conscience,
    maybe my soul. If those things were real.


    “Stop it. Just stop. Your soul is fine,” I reassured myself. My soul *was* fine.
    If I had one. “Stop it!” I told myself firmly.


    I was a normal human goblin, and I’d been attacked. I’d ended it. It happened
    every single day around the world. Yes, I’d gone a little bit beyond defending
    myself (okay, a lot beyond defending myself), but I didn’t suddenly need Scharf
    to arrest me.


    I needed to turn off the horror and fear that were making my hands shake and my
    stomach heave and fix this.


    “Mert isn’t dead.” I took a breath. “I didn’t kill him.”


    I was turning to return and talk to Mert and make sure he didn’t try to kill himself
    to repair his honor in his condition when my phone rang. I dug it out of my back
    pocket.


    “Where are you?” It was Scharf.


    I muted my phone so I could say, “Whoops!”


    I usually tried to get home if I told her I was going home since her professional
    paranoia extended to everyone in her life, but with Juya sick, I’d forgotten.


    I unmuted and said, “Would you believe me if I said I was on your couch and invisible?”'
