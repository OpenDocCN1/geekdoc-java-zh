    We listened to the chimes tinkle and watched them dance as the door closed on
    the shop where, at this moment, Mrs. Bao was teaching the daughter of one of Scharf’s
    dearest friends.


    “She seemed like a nice old lady,” I said as Scharf’s hand crept toward her weapon.
    I thought of Juya and her ability to manipulate reality at a fraction of the power
    that she was used to working with. “Though I would be careful of nice old ladies.”


    Scharf hesitated at the door. “Mrs. Bao knows I’m with the FBI. I shouldn’t go
    in there.”


    She slid sideways to look in the front window.


    I followed, resisting the urge to clutch at her hand and keep near her. I realized
    we had to be getting closer because my emotions had gotten more volatile. Inside,
    I could see David by the coffee urn, and in the back at the end of the long counter,
    Hassan stood talking to Mrs. Bao.


    “Anything?” Scharf asked.


    “I don’t have super eyes.”


    “Don’t approach while she’s near Hassan. Let’s just keep everybody calm. When
    Hassan and Amina are clear, do the same bargain with her. Let’s see if we can
    finally get some answers.”


    “You want me to go in there alone?”


    She glanced at me. “What did you think I meant when I said, ‘I shouldn’t go in
    there?’”


    I thought she’d meant neither of us should go in there. I didn’t want to go in
    there. I wanted to move. We could all just move and leave this city to the creatures
    who want to freeze it and silence it.


    I took a deep breath and opened the door to the cascade of chimes.


    Inside, I looked around, scanning for a creature, magic, or *something.* The floral,
    grassy scent of dried tea overpowered my senses.


    Clicking drew my eyes to the tables opposite the counter where a group of Asian
    ladies sorted through mahjong tiles. I had learned to play the game at my mother’s
    nursing home from an old woman who remembered nothing more recently than her high
    school graduation in 1968, but who never lost a game. She played the Americanized,
    simplified version of this insanely complicated game, like poker on steroids with
    tiles instead of cards. I could not play like these women, flicking tiles in blazing-fast
    play, but the familiar sound was comforting.


    Now that I was inside, I saw a little girl who looked a lot like Hassan standing
    between him and Mrs. Bao near the stairs at the back of the restaurant. She had
    to be younger than ten, wearing pink jeans and a puffy blue rain jacket that matched
    Hassan’s. Her hair was up in two pigtails. She held both adults’ hands and swung
    between them.


