    He looked at Juya with such love in his eyes that it dwarfed my feelings. He nodded.
    “Yes, I can do that.”


    I took a deep breath and closed my eyes. “*Gracias*. Thank you. I’ll be waiting,”
    I said, gripping Juya’s hand as hard as I dared until Osman put a hand on my shoulder
    and gently pulled me away.


    Once we hit the stairs, Astrid asked, “Why Chinatown?”


    “Uh… Well…”


    “It’s her favorite place,” Osman said quickly.


    “Really?”


    “Sure!” I looked at him as I added, “Right under the arch by the `Metro`.”


    He nodded.


    I looked between the two of them. “Can you spread the word? Everyone who can come.”


    “What do we ask them to do?” Astrid asked.


    I looked at Osman.


    “Worship her?” he said with a wince.


    “Metaphorically. Well, kind of,” I added. “Just what I said. We need to tell her
    how much she means to us.”


    Astrid seemed to take that in stride. “But `Orange`…”


    “What do you need?”


    She let out a sigh. “Orange, what are we going to do about our cakes? We won’t
    have a business if they won’t stay fresh.”


    “You’ll be surprised how much better that will go after tomorrow…” I hoped.


    “That’s not our only problem. I’ve barely seen you lately.”


    I smiled. “Astrid, I’m all yours. I’m all in. I quit my other jobs.” Remembering
    Juya, I felt my shoulders tighten. “Except I have to do this tomorrow. For Juya.”


    “Of course.”


    “And then I’m yours.”


    She shot me a doubtful look. “Orange, you’ve said that before.”


    “And then I flaked. I know. But I’m not going to do it again, okay? I’ve changed.”


    “You’ve changed?” she laughed. “Nobody changes. They succumb to social pressure.”


    “Which psych class did that come from?”


    Astrid bit her tongue. “Orange!”


    “Okay, lately I’ve endured an unreal amount of social pressure not to be myself.”
    I stopped. “That came out wrong. To be me, only a grown-up. I’m already a grown-up.
    To be my best self? Stop me before I become an anxiety medication commercial.”


    She flashed me a grin. “I believe you.”


    “I’m going to be there for you.”


    She sighed and sat on the front step. “It’s not just you. It’ll be nearly impossible
    to pull off this business. They don’t tell you about the exhaustion in any class.
    It’s unreal.”


    I fought a smile. I punched goblins. Scharf shouted at her boss. The Lubber Fiend
    killed people. Juya almost died. But the dragon only made Astrid a little tired.
    Though seeing her defeated eyes, I knew it went deeper than that.


    “You should sleep, and I should…” *Fight a dragon, catch a killer, and bake some
    cakes*… “Also sleep. We have a deal, right? You and me together, launching the
    grand food empire, or whatever you called it.”


    Astrid sniffled. The tears in her eyes shocked me. “Sorry,” she said. “I don’t
    cry.”


    I sighed and sat down beside her. “There’s a lot of power in tears.” As a hobgoblin,
    I would know. I had a dozen platitudes ready as I reached for my hob powers, but
    I stopped.


    “I never do this,” she said.


    Tentatively, I laid a hand on her back. “Then you were overdue.”


    I felt the desperate pressure to make a bargain, but I couldn’t magic our way
    to success or bargain for her faith in me. Or faith in herself. I thought of a
    superb joke but bit my tongue.


    “Thanks for your help tomorrow,” I said instead.


    She wiped her nose with the back of her hand and straightened. “You know, if you
    give me a week, I can put together a parade for Juya.”


    I laughed. “Someone else is taking care of that part.”


    She paled. “She’s that bad? This isn’t the moment we take her to her favorite
    place and say goodbye, is it?”


    “No.” I needed to lie to her about this one. If we didn’t take care of the dragon,
    Juya’s dying was a genuine possibility. “You can gather a crowd?”


    Astrid nodded. “Half of her customers have been by today already to check on her.
    She honestly doesn’t realize she’s the heart of this neighborhood?”


    I shook my head. “I don’t think any of us have any idea how we affect the world.”


    # 21


    The next morning, I sat on a blue metal `Washington Post` dispenser under the
    Chinatown arch on the corner of Seventh and H streets and put my head in my hands.
    I felt entirely alone in the sleet. The weather looked miserable in the dim, gray
    light of dawn through the clouds.


    The buildings surrounding the intersection were festooned with screens shining
    advertisements into the mists of the continuing storm. It wasn’t quite Times Square.
    Without skyscrapers, nowhere in DC could match that energy, but it was colorful.
    The crosswalks were painted with dragons. I hoped they weren’t the only dragons
    on the street today.


    Ragged red lanterns were still strung from the arch to nearby buildings overhead,
    leftovers from the disastrous celebration nobody had taken down. Other than those
    and one boarded-up window of a shop across the street, the riots had mostly been
    cleaned up. I suddenly wondered at the madness of gathering.


    (Note: The provided text contained a repetitive and nonsensical/garbled section
    at the end of the source. I have processed the coherent narrative flow up to the
    point of structural breakdown as per instructions.)

