    I slumped in my seat.


    We slowly wound our way out of DC, and with every mile we put between us and DC,
    the vice at the back of my neck released a little, and my shoulders stretched
    away from my ears. Although, as the weather improved, Scharf sped up considerably.


    “It’s not everywhere,” I said when we were firmly enfolded in bare trees. There
    were traces of ice on the ground, but many more fallen leaves and mulch.


    She glanced at me.


    I hit the button for the radio, and for the first time in days, heard new music.
    Something canned and auto-tuned, but it sounded like a symphony. I pointed out
    the window. “The ice, the feeling like you’re going to explode. The music.”


    She glanced out at the trees. “The further we get from DC, the better it feels.
    I hadn’t even realized how stressed I was.” She stretched an arm above her head.


    “If it’s localized, we can find it,” I said.


    “How? The localized part is the entire city.”


    “I don’t know.”


    She glanced at me, and I had to bite my tongue to keep from telling her to look
    at the road.


    “What magical thing can affect the weather of half the Eastern seaboard?”


    I winced; that was exactly the kind of question I was here to answer, but I had
    no clue. “I’m—still researching. There are both too many things and far too few.”


    “Explain.”


    “Every folklore tradition on earth has beings that can affect the weather. But
    something this powerful? I don’t know. And you can’t get around the dead goblin.
    We’re tough to kill. I’m not being arrogant when I say that.”


    “No,” she said, “I’ve seen you not die many times when you should have.”


    “Funny.” I sighed, trying but failing to find a comeback. “Insert clever pun here.”


    Her mouth dropped open. “You can’t think of a joke? Orange Sinclair? Something
    *is* wrong.”


    “A priest, a rabbi—”


    “Absolutely not.”


    She turned onto a smaller, curvier road through the leafless, black trees.


    “It’s not only the ice,” she continued. “We’re in the middle of an unprecedented
    storm that should keep everyone hunkered down, yet we’ve also got an unprecedented
    crime wave.”


    “What crime wave?”


    “You remember Detective Lee?”


    I laughed. “He’s memorable.” He’d arrested me and was the first person I disappeared
    on.


    “Normally, when the weather gets bad, crime goes down, but they’re getting run
    off their feet with thefts and assaults. The Bureau is sending agents to deal
    with petty crime. We’ve got guys from the Hoover Building who’ve been out of the
    field for a decade responding to drunk and disorderlies. It seems everybody’s
    fuse got snipped in half, and we’ve burned through what’s left.” She rolled her
    neck, and it cracked three times. “Don’t think about it now. I’m just starting
    to feel competent again.”


    I suppressed a smile. Of course, for Scharf, the most terrible symptom would be
    incompetence. Not actual incompetence, only feeling like it. The smile died. For
    me, the most terrible symptom was punching goblins in the face. She was right.
    *Put it down, Orange. For an hour.*


    Great Falls National Park was in the wooded foothills of McLean, Virginia. Scharf
    flashed her badge to get us in at the ranger station. By the time we hit the trail
    to the falls, the feeling of normalcy and even optimism felt a little euphoric.
    When the trail petered out thirty feet from the guest house, my enthusiasm quickly
    fizzled.


    “This is it?”


    She spread out her hands. “This is it.”


    A wide river spread in front of us, either the Anacostia or the Potomac; I still
    hadn’t figured out which was which. The water tumbled over a short stack of rocks.
    It was maybe a twenty-foot drop if I was being very generous.


    And most of it was ice. I’d first visited Yosemite when I was six, with its waterfalls
    the size of skyscrapers. The sense of disappointment was familiar as I looked
    out at the three families snapping pictures, all looking very satisfied.


    I turned to Scharf. “Well, you’re right, no fun to be had today.”


    I couldn’t even wade out into the water. Giant rocks and rails stood in the way
    and the hypothermia definitely wouldn’t be fun.


    Scharf pulled me toward the spray. “Come on, try something.”


    I looked at her like she was crazy.


    “You can pull down buildings with your earth power. You’re telling me the box
    water had nothing to do with magic? If we’re fighting something that controls
    the weather, I don’t know how much concrete will help. You could use this.”


    I turned to the pathetic falls and climbed up a flat boulder to get a better look.
    Up here, I was in the freezing spray from the falls. It felt like little ice kisses.


    I didn’t have much faith that anything was going to change. I also hoped I would
    not gain any more powers; the last thing I wanted was to one day be able to manipulate
    the air and then suffocate in my sleep from my incompetence.


    *Don’t borrow trouble*, I told myself.'
