    time, I wasn’t hiccupping or crying.


    Like last time, Scharf stopped halfway up the stairs. “*How* did he do it?”


    I sat on the stairs, watching the stripes on her jaw get redder and redder. She
    was clenching her teeth, angrier than I’d ever seen her. I wanted to tell her
    to take a deep breath but instinctively knew that would only make things worse.


    “Not how, but when could he have done it?” I asked.


    “That’s not the question.”


    “It’s not?”


    She shook her head. “*Why* did he alter the autopsy reports?”


    “You know more about this stuff than I do.”


    “Dead bodies?” A glint of humor momentarily returned her face to its normal color.


    “Bureaucracy.”


    She sat down beside me. “Fair enough.”


    “Let’s go backward,” I said. “We know this ended with Mrs. Henderson giving me
    altered files. It probably wasn’t Mrs. Henderson. No reason for her to change
    bruising patterns.”


    “No.”


    “So, where did they start?”


    She rubbed her hands together. “The ME generated the reports at our lab in Virginia
    during and after the autopsy. It wasn’t him, because he could have altered it
    as he generated it, and nobody would have known.”


    I nodded. “And from there?”


    She shrugged. “He uploads it to the case file for the agent in charge. Mrs. Henderson
    prints it out and puts it in the physical files. The prosecutor will also have
    access to that online file.”


    “Who is the agent in charge?” I asked, suddenly afraid of the answer. “What happened
    after I left the first crime scene?”


    “It was me. They were my files.”


    I stopped. Everything in me stopped. “What?”


    “Orange, breathe. I didn’t attend the autopsy. I had that damn dumpster to deal
    with.”


    “Who did?” I asked, but I knew the answer.


    “Carlisle. He volunteered.”


    “And?” I prompted her when her jaw kept looking angry.


    “And Fuller.” She stood up abruptly and slammed a hand into the wall. “Damn it!”


    I jumped to my feet again. “Hey, deep breaths.”


    “The fork, Orange.”


    I looked around. “What fork?”


    “The one in the victim’s eye.”


    I rocked on my heels. “Um, what about it?”


    “It wasn’t from *Pasta Joe’s.*”


    “They had a ton of forks!”


    “Not fancy compostable ones.”


    I nodded, remembering piles of plastic forks in the back of the restaurant. None
    of them had been compostable. And how did I know what a compostable fork looked
    like? “The hockey game!”


    Scharf hit the wall again. “I knew it looked familiar. It was your chili dog!
    It was the same fork!”


    I physically recoiled, bumping my head into the plastic emergency instructions
    that rattled against the wall. “I didn’t do it!”


    She growled. “I didn’t accuse you! An entire stadium full of people had those
    forks.”


    I closed my eyes. “And Fuller was at the game.” I opened my eyes. “What are we
    going to do?”


    She shook her head. “I’m going to Quantico and get a sample of his handwriting.”


    I tried to buck myself up for a field trip. “Yay.”


    “But first, we are going to the arena to get a fork. And then you’re going to
    make a little bargain with the foremost profiler in the FBI.”


    # 16


    In minutes, we were rocketing up Seventh Street into Chinatown between an endless
    row of fast-casual restaurants for tourists interspersed with high-end steakhouse
    chains and fusion restaurants for the office workers in the buildings above.


    But before we got to the arena, we hit the crowd.'
