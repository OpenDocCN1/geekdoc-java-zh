    “Orange!” Hassan said with a smile. “Good afternoon.”


    “What are you doing here?” I asked. “I mean, it’s nice to see you.”


    “My daughter is next door. She takes piano lessons.”


    I vaguely remembered that Mrs. Bao taught piano.


    “Best teacher in the city,” Hassan said and then sobered, his gaze pinging between
    the two of us. “Please, what’s wrong?”


    “Umm,” Scharf began.


    He looked at me. “Some of your problems?”


    “Probably?” I said, my voice unnaturally high.


    “It’s okay.” Scharf looked around at, for all intents and purposes, a quiet afternoon
    at an Italian restaurant. “It’s okay.”


    “Should I get my daughter?” The fear in his voice tipped it an octave higher than
    usual.


    “Wouldn’t be a bad idea,” Scharf said.


    “It’s not an emergency,” I added, “Or anything like that. Probably. But maybe
    not a bad idea to be as far away as possible from here as soon as you possibly
    can… If possible.” I shut up when Scharf elbowed my side.


    He just nodded. I realized he was like Scharf: the worse the situation, the calmer
    he got. It made me slightly sick to know how he learned to do that. He shrugged
    back into his jacket and ducked outside.


    We followed him out in time to watch him enter the teashop next door to a tinkle
    of chimes. Scharf ducked under the awning of the music shop next door, and I followed
    her to get out of the downpour. It was tipped slightly towards rain this morning
    instead of sleet, which didn’t hurt so much when it hit your face but got just
    as miserable fast if you stood out in it too long and let it soak you.


    Scharf opened her mouth, but I held up a finger and dug for my phone.


    I called the one person I thought might have any expertise in miracles. A demon.


    “Jack?”


    “Do I now have to flee to the East Coast or stay off the third floor?”


    “The third floor of what? Never mind. What do you know about miracles?” There
    was no answer. “Jack?”


    “You''re asking `me` about miracles?”


    I shrugged, fighting the fear in the pit of my stomach. “Do they have anything
    to do with the weather or music?”


    “Depends on the saint.”


    “But there’s no saint of weather `and` music? Who maybe had a fondness for pasta?”


    “Cecilia is the patron saint of music,” he said slowly. “And she was Italian,
    so one assumes she ate pasta. Third century. Nice lady. Untemptable.”


    “Jack.” My stomach dropped to my toes. I realized I did not want him to explain,
    nor did we have the time. “What about the weather?”


    “Sorry, I don’t remember.”


    “Medard,” Scharf said quietly.


    I looked at her, remembering she’d gone to Catholic school.


    “The patron saint of weather is Medard,” Scharf said louder. I sighed and swiped
    at my phone to put it on speaker.


    “The FBI lady is right,” Jack confirmed.


    “Don’t call her…”


    Scharf put a finger on my arm. “Did you know him?”


    “Never had the pleasure,” Jack said. “But if I remember right, an eagle sheltered
    him from a storm. Don’t know why he was sainted when it was the eagle doing all
    the work…”


    Scharf snickered.


    “What was the last one you asked about?” Jack asked.


    “Miracles,” I said.


    He guffawed. “Orange!”


    “What?”


    “That’s the definition of a saint. Miracle worker. They all did miracles.”


    “So this Cecilia and Medard never met each other?” I asked, but I knew this was
    a dead end.


    “No,” Scharf said. “Different time. Country. Not possible.”


    “Okay, thanks. Just out of curiosity, when you said untemptable…”


    No answer. I glanced at my phone. He’d hung up on me. I sighed. “Goodbye, Jack.”


    “Miracles?” Scharf asked.


    “Joe mentioned something about his Catholic granny. And how Jesus toast got all
    their money.”


    “What? Never mind.” She crossed her arms. “Am I supposed to continue to ignore
    the fact that you’re dating a demon?”


    Everything in me got a little colder. “Look, I know they have a reputation.”


    “Reputation is one word for it.”


    “But honestly, all your priests do terrible things, too. I don’t think it’s fair
    to write off somebody because of what they are. I think we should wait for them
    to steal an old granny’s inheritance because of Jesus toast and then judge them.”


    “Orange…” She sighed and cycled through a couple of different things to say before
    she settled on, “Okay.”


    “Okay? That''s it, just okay?”


    “You have a point. I know a bunch of `people` who might as well be demons. I will
    drop it, pending further evidence.”


    “Thank you!” I thought through her statement. “Hey!”


    “Are we dropping it or not?” she asked.


    I rocked back on my heels. “It’s dropped!” I squeegeed the water out of my hair,
    an almost automatic gesture by this time, and said, “Maybe I should go ask the
    waitress. But she didn’t strike me as a massive magical creature that can cancel
    all the music in the city.”


    Scharf looked up at the teashop and said, “Music…”


    “Or, you know, start an ice storm for fun.”


    I dawdled at the other end of the counter near the window. I looked back at Scharf
    through the window, who made a shooing gesture. I shook my head and turned around.


    David approached me from the other side of the counter. “Can I help you?”


    I winced. “Um,” I cast about for a reason to be there and almost rolled my eyes.
    *You’re in a teashop, Orange.* “Can I have some tea?”


    “Hey, don’t I know you?”

