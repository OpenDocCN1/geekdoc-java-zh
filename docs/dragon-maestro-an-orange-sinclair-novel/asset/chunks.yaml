    “No,” Scharf repeated.


    He shrugged. “I can quote you. You said it.”


    Scharf ignored that and repeated, “How did you make the leap?”


    I was getting increasingly nervous, standing here so close to the dragon in a
    confrontational interview with a kid with a microphone and Scharf’s face growing
    paler and paler.


    When nobody said anything, Scharf started fishing for her handcuffs and he backed
    up, “Okay, okay… On the night of the murder, somebody saw a woman run out of the
    alleyway.”


    “Who?”


    “Oh, you couldn’t find them? How fascinating.”


    “Who?” Scharf said even more calmly.


    The kid gulped. I gave him props; it took some law enforcement professionals much
    longer to recognize her voice of death. “Somebody who was at the game was running
    this way to escape the riot. They called my podcast last week about a woman in
    the alley.”


    Scharf rolled her eyes. “I need their name.”


    “I don’t have to reveal my sources.”


    I scoffed. “You’re not a journalist.”


    “Well, I… I still don’t have to reveal my sources. And I have proof!” He clutched
    at his battered messenger bag, a tell even I could recognize. Scharf’s eyes zeroed
    in on his white knuckles. This time, she took the handcuffs off her belt, opened
    one of them, and stepped forward.'
