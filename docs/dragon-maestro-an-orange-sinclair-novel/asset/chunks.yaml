    “Assault? Battery? Possibly with a deadly? No, it isn’t!”


    Somebody from the opposing team decked that guy, and then the rest of the players
    piled on, both benches emptying onto the ice. Soon, it was an all-out brawl. The
    announcer called for calm, but nobody listened.


    As the pile on the ice heaved to reveal the ref on the ground with a bloody streak
    across his head, the crowd roared. They rushed towards the ice, held only by a
    few sheets of plastic around the rink. It didn’t stop them long.


    A crash and a screech of sparks heralded a falling barrier, and angry fans joined
    the players.


    Someone grabbed my left shoulder, and I screamed. The teenager screamed too, leaping
    away from us, but it was Jack. “Come on!”


    As I stood up, Scharf followed, muttering to herself, “Why did this go bad so
    fast?”


    “She’s right.” Jack grabbed my hand and snapped at the dude between us and the
    door, who froze. We shimmied around the suddenly comatose lawyer.


    “What *is* he?” Scharf asked, peering into the lawyer’s expressionless face.


    “You weren’t going to ask,” I shouted as we made it to the double doors.


    Jack could hardly open the doors against the crowd outside. Fans with a better
    sense of self-preservation were already fleeing.


    Jack looked at me, squished up against him, and snapped his fingers again. The
    people behind the doors pivoted and moved in unison away. He got it open and dragged
    me between the human statues. I whispered, “Don’t compel them!”


    “What?” Scharf yelled.


    “Never mind!”


    The three of us staggered towards the stairs as the arena was lost to the mob.


    Jack acted as a battering ram through the crowds, and we reached the concourse
    in front of the concession stand in record time, but not quickly enough. Hundreds
    of people crowded the open space, trying to get away, and I couldn’t see the stairs
    to the ground at all.


    Scharf grabbed my free hand. “Don’t let go.”


    I swallowed and nodded. Jack grabbed my other hand, and we surged towards the
    stairs that would take us down and out.


    Then Scharf tried to go one way, and Jack went the opposite around a family trying
    to protect their popcorn buckets, and Jack lost the tug of war on my arm as I
    tried to decide which way to follow.


    Between one moment and the next, he was gone, and I couldn’t turn around because
    people were crowding us from behind, trying to get through us. I shouted his name
    and tried to jump, even levitating myself a bit off the ground.


    Since I was made mostly of earth, I could lift my body, but it took an insane
    amount of energy, and I thumped down. No sign of him. I’d looked away for five
    seconds; it was all it took to lose him. I turned to Scharf. “I can’t find Jack!”


    She didn’t hear me. She had her cell phone pressed to her ear and shouted, “Talk
    to Metro, because a massive, angry, crazy crowd is about to hit the streets. I
    don’t know why! It doesn’t make any sense... No, I said, ‘*any sense*!’ Never
    mind!”


    The current carried us along: me trying to find Jack, Scharf trying to keep her
    phone against her ear, our hands gripped together. I tried for my phone but couldn’t
    get enough space to get it out of my back pocket.


    “I can’t find Jack!” I shouted again.


    “He can take care of himself!”'
