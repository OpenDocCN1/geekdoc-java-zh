    why you’re so intent on hearing me say it yet again.”


    I waited for the chime in my head, half hopeful we were already amusing him, but
    nothing. Clueless, I surveyed the room. What on earth would amuse him? Why did
    I agree to such a thing?


    I stared at Scharf, who didn’t take her eyes off Hastings.


    Suddenly, I got an idea. I knew something I could show him that was pretty unusual.
    Without preamble, I dropped my glamour. My skin tint turned darker. My nails elongated.
    My ears flopped. My eyes grew larger, and my teeth sharpened.


    He blinked at me and tensed. Again, I got the impression of bottled fury before
    he smoothed his body language. “Neat trick. I’ll admit that I’m more than a little
    disgusted. But not amused.”


    I very carefully told him, but not the guard or Scharf, not to notice me. When
    I went invisible, he jerked in his chair, but his expression never changed.


    I faded into view, this time trying to exaggerate my features. I had a picture
    in my mind of my father, with his deep orange skin and elongated ears, and sharpened
    incisors. Hastings leaned forward, his eyes round. “Horrifying but not amusing.
    Is this an illusion? A mirror? Psychotropic drugs slipped into my food? A puzzle
    I’ll have to puzzle out more.”


    I stuck my tongue out at him, and he leaped to his feet, the chair toppling behind
    him. He slammed his cuffed hands onto the table and barked at Scharf, “Your creature
    won’t disrespect me.”


    Scharf’s hand shot to her belt, where her gun normally rested, while her other
    arm flew across my chest as if she could protect me. I gripped her wrist, intent
    on pushing her behind *me* when the guard reached him and pushed him into his
    chair.


    Hastings swung around to face me, and I met his gaze. I knew enough about challenges
    not to look down.


    “I believe I’ll eventually be amused,” he said, looking at me with keen eyes.
    “You’ve given me a lifetime of assumptions to reevaluate. I have believed one
    thing about the world.” Finally, he looked down and examined his nails. Did that
    mean I’d won the staring contest? I didn’t know. “I was incorrect. There is so
    much more *inhumanity* in the world to deal with.”


    As he faked toward me again, I leaped behind the chair to get away. Scharf said,
    “We’re done.”


    # 13


    I heard nothing. No chime. Only deafening silence as the guard led Hastings from
    the room. I’d bargained his amusement for the truth. I hadn’t gotten it.


    As I pounded the table in frustration, he laughed heartily, and the door closed.
    Scharf stood up. “Come on, Orange. Let’s go.”


    I stared at the closed door in shock. I’d *never* failed at my end of a bargain.
    What was wrong with the world? When a door clanged somewhere deep in the building,
    I lunged to my feet. “Let’s go.”


    I jogged through the exit protocols, pulling her along. Fresh air couldn’t come
    soon enough.


    When we reached the final gate, I had to hold back from using magic to wrench
    it open as a guard let us out. I burst out into the rain. I paced and told people
    not to notice me, disappointed in myself and furious.


    Scharf rolled her neck and her shoulders and kept one hand gripped around the
    base of her gun like she’d missed it. “Well?”


    I scuffed one shoe against the pavement. “He’s crazy.”


    “A psychiatrist examined Hastings—two of them. I believe the diagnosis was sociopath.
    Competent to stand trial, though, thankfully.”


    I growled and kept pacing.


    “Orange, calm down. You got him to make a deal! You did it.”


    I nodded maniacally. “Yeah. I did. We had a deal. And I couldn’t fulfill my half.
    He out-bargained a goblin.” I muttered a curse and kicked a random car tire.


    Scharf glanced at the prison. “Not here. Get in the car.”


    “What?”'
