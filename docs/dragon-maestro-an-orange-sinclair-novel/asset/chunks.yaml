    When I stepped closer, my feet flew across a thin layer of ice, and I landed on
    my back in a flail of arms. I gazed at the grey sky as rain sprinkled my face.
    How was the sun coming up and the temperature dropping?


    The `goblin’s head replaced the sky as he leaned over me, his `club` dangling
    on the ground. “It’s no fun if you die on your own.”


    I curled my body to sit up. “Ow.”


    He leaped out of the way and asked, “Not dead?”


    “There’s no dying! None of us are really dying here, right?”


    The little guy ignored my question and hefted his `club`.


    I climbed to my feet, reasonably sure nothing was busted. “He said nobody would
    die unless… Are you the `Lubber Fiend`?”


    His skin lightened from maroon to pink and he spun around three times, water flinging
    out from his clothes and sopping hair. “The Fiend is coming?”


    My breath whooshed out. If this wasn’t the `Fiend` and if `Everglades` was correct
    that they were coming in reverse order of power, this creature was one step up.
    He really had no chance at all.


    He was wearing homemade hand-spun clothes, and his maroon hair dangled around
    him in oily clumps. Whatever hole he’d crawled out of, it hadn’t been a vaunted
    park near the `Everglades`. This dude hadn’t been near civilization in a while.
    I had to find the `Lubber Fiend` to stop disturbing poor, powerless `gobins`.


    “He’s on his way as we speak,” I said, hoping he’d flee at that.


    For a moment, he looked like he was going to. Instead, he squeezed his `club`
    and squared his feet with an audible gulp. He said again in a quavering voice,
    “I am Mert, and I challenge thee.”


    He swung his `club`.


    I leaped out of the way, called my magic, and tossed a chunk of `cement` at him.
    His `club` went slack in his hands as `cement` crumbled and pelted him. “You made
    no bargain!”


    “No bargain required.” I cracked my knuckles in satisfaction.


    “No bargain?”


    “I bargain with myself.”


    “Well… Well, we’ll just see who the best is!” His voice grew higher and higher
    with every word.


    “The best what?” I took a careful step forward, searching for a spot of `cement`
    without ice.


    “The best goblin!”


    He swung his `club` again, and I dodged again.


    “Yeah, but by what criteria are we judging? Who’s the best fighter?” I leaped
    backward when he attacked, forgetting the ice, and landed in another heap. “Ow.
    Why would fighting matter?”


    His bushy brows furrowed as he considered that. “The best!”


    The door to `Juya’s` opened and `Osman` peeked out.


    “Stay inside!” I shouted as I climbed to my feet again.


    Mert swung his `club` and clipped me on my collarbone.


    “Ow! Stop that!” I faced him and knocked his `club` away again. “Can we skip to
    the end? You will not land a punch. I’m human.”


    “And you dare claim to be—”


    “Half. My father was the `Peallaidh`, and I am his heir.” I let out a long breath,
    fighting my fury. “I’m so sick of this! Why didn’t one of you stop by just to
    say hi?”


    Anger heated my chest. I didn’t want to keep getting attacked and falling on the
    ice. I brushed my sopping hair out of my eyes. “Just give up!”


    He came at me again and pounded his `club` into the `concrete` at my feet. It
    fractured.


    The rocks beneath my feet had always been wonderful allies, but they parted for
    him, and I found myself in an icy mass of mud. “This is my friend’s front step,”
    I said. “Stop destroying things!”


    I tried to leave the courtyard and draw him away from `Juya’s townhouse`, but
    he’d found my weak point. Grinning, he pounded at the door with his `club`.


    “Stop it!”


    The door splintered and flew off its hinges. He dashed in, and someone screamed
    inside. I raced after him, a sick sense of foreboding joining my anger and roiling
    my stomach.


    Mert advanced on `Teresa`, who only had a `rolling pin` in one hand for defense.


    He lunged for her. I lunged for him.


    I missed. He didn’t.


    The `club` hit her arm with a wicked crack. The `rolling pin` clattered to the
    floor, and Mert landed on her at the base of the stairs.


    `Teresa` whimpered as Mert roared.


    A red haze veiled my vision, and all the anger building in my body flowed into
    my fists. I launched into the air and landed on the `goblin’s back`.


    He choked `Teresa`, and I pulled his matted, dirty hair. Hard.


    “Don’t you dare!” I screeched. I reared up and backhanded him in the temple. It
    stunned him enough for me to maneuver him off `Teresa`, who looked even more shocked.


    “Get out of here!” I screamed as I hauled Mert away by his neck.


    `Osman` jumped down the stairs muttering about `duende` as he pulled her up with
    him.


    I turned Mert around so I could hit him again. His nose cracked and spurted blood
    that looked almost black. I followed that first punch with a few more, reveling
    in the feel of my knuckles meeting his cheekbone.


    When he stopped resisting, I didn’t register it. I didn’t care.


    Even as my brain told me `Teresa` was safe, I kept hitting him until `Osman` jumped
    down and tried to grab a fist. As I reared back to hit him too, his screams finally
    penetrated.

