    table tomorrow?”


    Scharf looked at me. I started to nod, but an uncharacteristic caution gripped
    me. “I have no idea.” I tried to stop talking but couldn’t help myself. “But I
    don’t think so. I don’t know if this is…”


    “If this is your area of expertise?” Scharf prompted.


    “Sorry. Like I said, your thief could just be stealing all of this and messing
    with us by replacing it with dirt. It’s kind of poetic.”


    “Sir!”


    We turned to see a tall guy in a brown police uniform that looked nothing like
    the dark blue Metro PD wore.


    He waved from the stairs. “Sir, there’s something you should see.”


    Lee said, “This is Adelman from park police.”


    I frowned. “What park?”


    The young man pivoted again, flashing me a gap-toothed smile that made him look
    younger than me. “The National Mall. America’s front lawn.”


    “Cool!” I said when he clearly expected a response. He grinned, and he pivoted
    to bound up the stairs.


    “This museum has its own police?”


    Scharf smiled. “All of the Smithsonians.”


    We followed him out of the exhibit around an old ship propped up on similar white
    pedestals. Apparently, the robbers were only interested in arts and crafts. We
    walked back up wide white stairs to the main foyer of the shuttered museum as
    Adelman regaled me with the reason he joined the park police and not Metro PD.


    “I mean, with the protests, I’m not sorry, you know?”


    I nodded vigorously. I’d been way too close to the recent dragon-induced riots
    that had gripped the city. Not that he knew that part.


    When we reached the foyer, I goggled at the three banners dangling from the ceiling:
    one of the American flag, one with a neon pink leotard whose antecedents weren’t
    clear, and one with an infinity knot in spun glass stamped with the words special
    exhibit and St. Patrick’s Day.


    “This way,” Adelman gestured us over to an unmarked door painted white to match
    the walls near the metal detectors and huge glass entry.


    Inside, a guy in jeans and a sweatshirt stood at a bank of monitors behind an
    old-school beige computer with a tricked-out black keyboard, plus a few TV remotes.
    He looked at us through thick glasses and blinked owlishly. “Uh, just give me
    a second.”


    Adelman was shifting from foot to foot with excitement. His body was concave in
    his mud-brown uniform. This close, I could see the fuzz of his beard as well.
    He really might be younger than me.


    “What are we going to see?” Lee asked.


    “It’s weird,” Adelman said with relish.


    “*It* is?” Scharf repeated with alarm.


    “It’s a tape,” Adelman said and flung out a hand. “This is Mr. Turner, one of
    our digital security experts.”


    “And this is my day off,” he offered the room without looking at us. “Don’t know
    what the hell happened to O’Connor.”


    Lee shifted. “O’Connor?”


    “O’Connor called out,” Adelman said.


    Lee fished out his cell phone. “We have another missing security guard.” Someone
    mumbled something in the receiver. “No, he called out. He wasn’t on the schedule
    we used.”


    Turner straightened. “You think O’Connor pulled off the biggest art heist in the
    history of this museum? O’Connor. He could barely find the breakroom.”


    “We need to find them, sir,” Lee said in his matter-of-fact voice which meant
    that this was an emergency. To his phone, he said, “Get the suit on the phone
    from the main museum office and send squad cars ASAP to his house.”


    The guy blinked at us and then went back to the screens, typing away at the computer
    as cameras speeded up and changed to various exhibits around the museum on the
    monitors. I saw a military helicopter on a dais, bizarre heavy curtains in the
    shape of a dress, and others that went by too quickly to see.


    “*Another* security guard?” Scharf asked Lee.


    “Yeah, one no-showed, and one called out.”


    Turner hit one of the buttons on a remote with the very tip of his index finger,
    like it was going to shock him or something. Adelman bounced on the balls of his
    feet and said, “Here’s what you need to see.”


    The screens stopped cycling and settled on different views of an intact Irish
    American Arts and Crafts exhibit. I whistled, impressed despite myself. I’d joked
    about infinity knots on a jug but most of the stuff on the screen was exquisite.
    A panel of tiles, green with a gold patina in an intricate pattern dominated the
    wall opposite the entrance while a multitude of smaller displays held glasswork
    and ceramic goblets without an obvious Celtic theme. I could see why it was called
    crafts, not just art. These were practical pieces, meant to be used, not just
    stuck in a museum.


    “What time is this?” Lee asked.


    Turner pointed to the running clock in the bottom corner: 3:03 AM.


    We watched the silent exhibit for a few more minutes when a figure in black tiptoed
    into the display carrying a bag, followed by a lot more men in black. I gasped
    and the assembly looked sharply at me.


    “What did you see?” Lee asked.


    I frantically scanned the faces of the others: Turner was fidgeting with his phone,
    but the rest watched without expression. Nobody said, *Look at all the people
    running through the display. I guess we found our thieves.*


    “Nothing, just, uh, rolled my ankle.” I stood on one leg for a second.


    Scharf frowned but the rest went back to the screen.


    The room onscreen was *crawling* with people — short, fair, dark-haired men wearing
    black clothes and hats and grinning. They were carrying heavy bags into the exhibit,
    already full, which confused me until I remembered the dirt. It had to get in
    there somehow.


    I tugged on Scharf’s sleeve. “Nothing is happening,” she said to me with a raised
    eyebrow.


    “No shit,” Lee echoed.'
