  \n\n\n\n\n## 灵感产生 (Idea Generation)\n\n我们在书中已经涵盖了大量的理论知识。由于每天都会产生新问题，涵盖所有是不可能的。因此，我们应该知道如何处理新问题。即使你知道面试官提出的问题的解决方案，你也需要与面试官进行讨论并达成解决方案。你还需要分析问题，因为面试官可能会对问题进行微调，而解决问题的方法也会随之改变。\n\
  \n那么，如何解决新问题呢？这个问题的答案是你需要进行大量的练习，练习得越多，你就越能解决出现在眼前的任何新问题。当你解决了足够多的问题后，你就能看出题目中的模式，并轻松地解决新问题。\n\
  \n以下是你在解决未知问题时需要遵循的策略：\n\n1. 尝试简化手头任务。\n2. 尝试几个例子。\n3. 思考合适的数据结构。\n4. 回想你已经解决过的相似问题。\n\
  \n### 尝试简化手头任务\n\n让我们来看以下问题：丈夫和妻子随机站在一队队伍中。丈夫们被编号为 `H1`、`H2`、`H3` 等，相应的妻子被编号为 `W1`、`W2`、`W3`\
  \ 等。你需要对他们进行排序，使得 `H1` 排在第一，后面是 `W1`，然后是 `H2` 后面跟着 `W2`，依此类推。\n\n乍一看这似乎很难，但它是一个简单的问题。尝试找到最终位置的关系。\n\
  \n`P(Hi) = i*2 – 1, P(Wi) = i*2`\n\n算法的其余部分留给你完成类似 `Insertion-Sort`（插入排序）的操作，你就完成了。\n\
  \n### 尝试几个例子\n\n在上述相同的问题中，如果你针对 3 对丈夫妻子尝试了某些例子，你可能得出了我们在上一节展示的相同公式。有时，通过多想几个例子来尝试解决手头的问题。\n\
  \n### 思考合适的数据结构\n\n对于某些问题，哪种数据结构最合适是一而易见的。例如，如果我们有一个找到给定值之最小/最大值的问题，那么 `heap`（堆）可能是我们正在寻找的数据结构。我们在整书中看到了许多数据结构。我们必须弄清楚哪种数据结构适合我们的需求。\n\
  \n来看这个问题：我们给你一个数据流，任何时候我们都可以被要求告诉数据的中位数，可能还会被要求弹出中位数数据。\n\n我们可以思考某种树，可能是平衡树，其中根节点是中位数。等等，要确保树根节点是中位数并不容易。\n\
  \n`heap` 可以给我们提供最小值或最大值，因此我们无法从中获得预期的结果。然而，如果我们使用两个堆，一个最大顶堆和一个最小顶堆呢？较小的值进入最小顶堆，较大的值进入最大顶堆。此外，我们可以记录每个堆中元素的数量。算法的其余部分你可以自己思考。\n\
  \n对于每个新问题，思考你所知道的数据结构，可能其中一个或它们的组合将解决你的问题。\n\n### 回想你已经解决过的相似问题\n\n假设你被给了两个链表的头引用，它们在某处相交，需要找到交点。然而，两个链表末尾的的不是\
  \ `null` 引用，而是一个环（`loop`）。\n\n你知道如何找到两个相交链表的交点，也知道如何判断一个链表是否有环（三引用解决方案）。因此，你可以同时应用这两个解决方案来找到手头问题的答案。\n\
  \n## 复杂度 (Complexities)\n\n解决问题不仅仅是找到一个正确的答案。解决方案应该是快速的，并且具有合理的内存需求。你已经在之前的章节中读过关于大\
  \ O 表示法。你应该能够进行大 O 分析。如果你认为你提供的解决方案并非最优，并且存在更高效的解决方案，请重新思考并尝试找出这些信息。\n\n大多数面试官期望你能够找到算法的时间复杂度和\
  \ `Space Complexity`（空间复杂度）。你应该能够立即计算时间及 `Space Complexity`。每当你解决某个问题时，都应该找到与之相关的复杂度，这样你就能选择最佳解决方案。在某些问题中，空间和\
  \ `Time Complexity`（时间复杂度）之间存在权衡，所以你应该了解这些权衡。有时多花一点空间可以节省大量时间并让你的算法快得多。\n\n## 编码\
  \ (Coding)\n\n到此时，你已经掌握了问题的所有约束条件，提出了几个解决方案，评估了各种方案的复杂度，并选择了一个方案进行最终编码。千万不要在与面试官讨论约束条件、灵感产生和复杂度之前直接跳入编码。\n\
  \n我们习惯在像 `visual studio` 这样的 IDE 中编码。当被要求在白板或空白纸上写代码时，许多人感到很困难。因此，我们应该稍微练习在纸上写代码。在编码之前你应该思考，因为纸上没有后退键。始终尝试编写模块化的代码。需要创建小函数以保持代码整洁易于管理。如果有一个\
  \ `swap` 函数，直接使用这个函数并告诉面试官你稍后会写它。大家都知道你可以写 `swap` 代码。\n\n## 测试 (Testing)\n\n代码写完后，你的工作并没有结束。最重要的是用几个小测试用例测试你的代码。这显示了你理解测试的重要性，也能让面试官相信你不会写出\
  \ bug 代码。完成编码后，一个良好的习惯是逐行过一遍测试用例。这只是为了确保你的代码按预期工作。\n\n你应该测试一些用例。\n\n常规测试用例（Normal\
  \ test cases）：这些是包含常见场景的测试用例，重点是代码的基础逻辑。例如，如果我们为链表编写某些算法，那么这可能包含给定 3 或 4 个节点的情况。在认为完成之前，你应该在脑中运行这些测试用例。\n\
  \n边界用例（Edge cases）：这些是测试代码边界的用例。对于同样的链表算法，边界用例可能是当传入空列表或仅一个节点时代码的行为如何。在认为完成之前，你应该在脑中运行这些测试用例。边界用例可能有助于让你的代码更健壮。只需要在代码中添加一些检查来考虑这些情况。\n\
  \n压力测试（Load testing）：在这种测试中，你的代码将使用大量数据进行测试。这将允许我们测试代码是否缓慢或内存密集型。\n\n始终遵循这五个步骤，不要在进入编码之前进行约束分析、灵感产生和复杂度分析：至少不要错过测试阶段。\n\
  \n## 示例 (Example)\n\n假设面试官要求你给出一个排序算法。\n\n有些面试者会直接跳到 `Quick-Sort` O(nlogn)`。糟糕，在开始解决这个问题之前，你需要问很多问题。\n\
  \n问题 1：我们讨论的是什么类型的数据？它们是 `integer` 吗？\n\n答案：是的，它们是 `integer`。\n\n问题 2：我们要排序多少数据？\n\
  \n答案：几千个。\n\n问题 3：这些数据具体关于什么？\n\n答案：它们存储人的年龄。\n\n问题 4：使用什么的数据结构来存储这些数据？\n\n答案：数据以数组的形式给出。\n\
  \n问题 5：我们可以修改给定的数据结构吗？此外，还有很多、很多……？\n\n\n\n\n回答：不，你不能修改提供的数据结构。\n\n根据第一个回答，我们可以推导出数据类型是\
  \ `integer`（整数）。数据并不大，只包含几千条记录。第三个回答很有意思，我们从此推推出数据范围是 1-150。数据以数组的形式提供。从第五个回答中推推出我们必须创建自己的数据结构，而不能修改提供的数组。因此最后我们得出结论：可以使用桶排序来对数据进行排序。范围仅为\
  \ 1-150，所以我们需要一个容量为 151 的整数数组。数据量在数千以内，因此我们不需要担心数据溢出，并且可以在线性时间 `O(N)` 内获得解决方案。\n\
  \n注意：我们将在下来的章节中学习排序。\n\n## 总结\n\n到此为止，你已经非常熟悉处理新问题的流程了。在接下来的章节中，我们将介绍许多不同的数据结构以及它们解决的问题。这本书中解决了大量问题。然而，建议先尝试自己解决它们，然后再寻找答案。始终考虑问题的复杂度。在面试中，关键在于完整地描述问题，并与面试官讨论你的方法。\n\
  \n# 第 4 章：抽象数据类型与 JAVA 集合\n\n## 抽象数据类型 (ADT)\n\n抽象数据类型（ADT）是对我们如何看待数据以及允许对数据进行的操作的逻辑描述。ADT\
  \ 定义为从用户的角度来看数据类型。ADT 关注数据的可能值以及它暴露的接口。\n\nADT 不涉及数据结构的实际实现。\n\n例如，一个用户想要存储一些 `integers`（整数）并找到它们的平均值。这并没有涉及到具体将如何实现。\n\
  \n![](img/image00860.jpeg)\n\n## 数据结构\n\n数据结构是数据的具体表示，是从程序员的角度定义的。数据结构代表了数据将如何存储在内存中。所有数据结构都有其优缺点。根据当前的问题，我们选择最适合的数据结构。\n\
  \n例如，我们可以将数据存储在数组、链表、栈、队列、树等结构中。\n\n## JAVA 集合框架 (JAVA Collection Framework)\n\n\
  JAVA 编程语言提供了 JAVA 集合框架（Collection Framework），它是一组高质量、高性能且可复用的数据结构和算法。\n\n![](img/image00861.jpeg)\n\
  \n使用 JAVA 集合框架的优点如下：\n\n1. 程序员不需要反复实现基础的数据结构和算法，从而避免了重复造轮子。因此程序员可以投入更多精力在业务逻辑上。\n\
  2. JAVA 集合框架的代码经过良好测试，是高质量、高性能的代码，从而提高了程序的质量。\n3. 由于基础数据结构和算法已经在集合框架中实现，降低了开发成本。\n\
  4. 易于审查和理解其他程序，因为其他开发者也使用集合框架。此外，集合框架有完善的文档。\n\n## 数组\n\n![](img/image00862.jpeg)\n\
  \n数组代表相同数据类型的多个元素的集合。数组是固定大小的数据结构，其大小在创建时就已经确定了。数组是用于存储数据最常用的数据结构。\n\n由于我们无法更改数组的大小，通常会声明一个大尺寸数组来处理未来的任何数据扩展。这会导致创建一个大尺寸数组，其中大部分空间是未使用的。\n\
  \n注意：数组可以存储固定数量的元素，而集合（collection）动态存储对象，因此没有大小限制，它会自动增长和收缩。\n\n### 数组 ADT 操作\n\n\
  以下是数组的 API：\n\n1. 在 kth 个位置添加元素\n值可以在 `O(1)` 常数时间内存储在数组的第 K 个位置。我们只需要将值存储在 `arr[k]`。\n\
  \n2. 读取存储在 kth 个位置的值\n访问数组中某位置存储的值也是 `O(1)` 常数时间。我们只需要读取存储在 `arr[k]` 的值。\n\n**示例\
  \ 4.1**\n\n```java\npublic class ArrayDemo {\n    public static void main(String[]\
  \ args) {\n        int[] arr = new int[10];\n        for (int i = 0; i < 10; i++)\
  \ {\n            arr[i] = i;\n        }\n    }\n}\n```\n\nJAVA 标准数组是固定长度的。有时我们不知道需要多少内存，所以创建一个更大的数组。为了避免这种浪费空间的情况，JAVA\
  \ 集合实现了 `ArrayList` 来解决这个问题。\n\n### JAVA 中的 ArrayList 实现\n\nCollections 中的 `ArrayList<E>`\
  \ 是一个实现了 `List<E>` 接口的数据结构，这意味着它可以包含重复元素。ArrayList 是作为一种动态数组的实现，可以根据需要增长或收缩。（内部使用数组，当数组满额时，会分配一个更大的数组并将旧数组复制过去。）\n\
  \n**示例 4.2**\n\n```java\nimport java.util.ArrayList;\npublic class ArrayListDemo\
  \ {\n    public void main(String[] args) {\n        ArrayList<Integer> al = new\
  \ ArrayList<Integer>();\n        al.add(1); // 向列表末尾添加 1\n        al.add(2); //\
  \ 向列表末尾添加 2\n        al.add(3); // 向列表末尾添加 3\n        al.add(4); // 向列表末尾添加 4\n\
  \        System.out.println(\"Contents of Array: \" + al); // 转换为字符串并打印到屏幕\n   \
  \     al.add(2,9); // 在索引 2 处添加 9\n        al.add(5,9); // 在索引 5 处添加 9\n       \
  \ System.out.println(\"Contents of Array: \" + al);\n        System.out.println(\"\
  Array Size: \" + al.size());\n        System.out.println(\"Array IsEmpty: \" + al.isEmpty());\n\
  \        al.remove(al.size() -1); // 数组最后一个元素\n        System.out.println(\"Array\
  \ Size: \" + al.size());\n        al.removeAll(al); // 移除所有元素\n        System.out.println(\"\
  Array IsEmpty: \" + al.isEmpty());\n    }\n}\n```\n\n**输出**\n```\nContents of Array:\
  \ [1, 2, 3, 4]\nContents of Array: [1, 2, 9, 3, 4, 9]\nArray Size: 6\nArray IsEmpty:\
  \ false\nArray Size: 5\nArray IsEmpty: true\n```\n\n## 链表\n\n![](img/image00863.jpeg)\n\
  \n链表是动态数据结构，在运行时内存。链表的概念不是连续存储数据，而是指向下一个元素的链接。\n\n从性能来说，链表比数组慢，因为无法直接访问链表元素。\n\n\
  当我们提前不知道要存储的元素数量时，链表是有用的数据结构。\n\n你会看到许多类型的链表：线性、循环、双向和双向循环链。\n\n### 链表 ADT 操作\n\n\
  以下是链表的 API。\n\n`Insert(k)`：在列表开头插入 k\n在列表开头插入元素。只需创建一个新元素并移动引用，使得该新元素成为列表的新元素。该操作将在\
  \ `O(1)` 常数时间内完成。\n\n`Delete()`：删除列表开头的元素\n删除列表开头的元素。我们只需要移动一个引用。该操作也是 `O(1)` 常数时间。\n\
  \n`PrintList()`：显示列表的所有元素。\n从第一个元素开始，然后跟随引用。该操作将需要 `O(N)` 时间。\n\n`Find(k)`：查找值为\
  \ k 的元素的位置\n\n\n\n\n从第一个元素开始并沿着引用，直到找到我们寻找的值或到达列表末尾。此操作将需要 `O(N)` 时间。\n\n*注意：* 二分查找不适用于链表。\n\
  \n`FindKth(k)`：找到位置在 k 处的元素。\n\n从第一个元素开始并沿着链接移动，直到你到达第 k 个元素。此操作将需要 `O(N)` 时间。\n\
  \n`IsEmpty()`：检查列表中的元素数量是否为零。\n\n只需检查链表的头引用，它应该为 `Null`。这意味着列表为空。此操作将需要 `O(1)` 时间。\n\
  \n### JAVA Collections 中的 LinkedList 实现\n\nJAVA Collections 中的 `LinkedList<E>` 是一种数据结构，它也实现了\
  \ `List<E>` 接口。\n\n### 示例 4.3\n\n```java\nimport java.util.LinkedList;\n\npublic\
  \ class LinkedListDemo {\n    public LinkedListDemo() {\n    }\n\n    public static\
  \ void main(String[] args) {\n        LinkedList<Integer> ll = new LinkedList<Integer>();\n\
  \        ll.addFirst(8); // 8 被添加到列表中\n        ll.addLast(9); // 9 被添加到列表末尾\n  \
  \      ll.addFirst(7); // 7 被添加到列表头部\n        ll.addLast(20); // 20 被添加到列表末尾\n \
  \       ll.addFirst(2); // 2 被添加到列表头部\n        ll.addLast(22); // 22 被添加到列表末尾\n\
  \        System.out.println(\"Contents of Linked List: \" + ll);\n        ll.removeFirst();\n\
  \        ll.removeLast();\n        System.out.println(\"Contents of Linked List:\
  \ \" + ll);\n    }\n}\n```\n\n**输出：**\nContents of Linked List: [2, 7, 8, 9, 20,\
  \ 22]\nContents of Linked List: [7, 8, 9, 20]\n\n## 栈 (Stack)\n\n![](img/image00864.jpeg)\n\
  \n栈是一种特殊的数据结构，遵循后进先出（LIFO）策略。这意味着最后添加到栈的元素将第一个被移除。\n\n栈的各种应用包括：\n\n1. 递归：使用系统栈执行递归调用。\n\
  2. 表达式的后缀表达式求值。\n3. 回溯。\n4. 树和图的深度优先搜索。\n5. 将十进制数转换为二进制数等。\n\n### 栈 ADT 操作\n\n`Push(k)`：栈顶添加一个新项。\n\
  \n`Pop()`：从栈顶移除一个元素并返回其值。\n\n`Top()`：返回栈顶元素的值。\n\n`Size()`：返回栈中元素的数量。\n\n`IsEmpty()`：确定栈是否为空。如果栈为空则返回\
  \ 1，否则返回 0。\n\n*注意：* 以上所有栈操作均在 `O(1)` 时间复杂度内实现。\n\n### JAVA Collection 中的栈实现\n\n\
  栈是通过调用 `ArrayDeque<T>` 类的 `push` 和 `pop` 方法来实现的。\n\nJDK 同时也提供了 `Stack<T>`，但我们不应该使用这个类，而是优先使用实现集合接口的\
  \ `Deque`。\n\n1. 第一个原因是 `Stack<T>` 没有继承自 Collection 接口。\n2. 第二，`Stack<T>` 继承自 `Vector<T>`，因此可以随机访问，这破坏了抽象。\n\
  3. 第三，与 `Stack<T>` 相比，`ArrayDeque` 效率更高。\n\n**示例 4.4**\n\n```java\nimport java.util.ArrayDeque;\n\
  \npublic class DequeStack<T> {\n    private ArrayDeque<T> deque = new ArrayDeque<T>();\n\
  \n    public void push(T obj) {\n        deque.push(obj);\n    }\n\n    public T\
  \ pop() {\n        return deque.pop();\n    }\n\n    public T top() {\n        return\
  \ deque.peekLast();\n    }\n\n    public int size() {\n        return deque.size();\n\
  \    }\n\n    public boolean isEmpty() {\n        return deque.isEmpty();\n    }\n\
  }\n```\n\n**注意：** 在接下来的章节中，我们将直接使用 `ArrayDeque` 对象。我们不会再创建 `DequeStack` 包装类。当我们使用\
  \ `push()` 和 `pop()` 方法从 `ArrayDeque` 中插入和移除元素时，我们就是在执行栈操作。\n\n## 队列 (Queue)\n\n\
  ![](img/image00865.jpeg)\n\n队列是一种先入先（FIFO）的数据结构。首先添加到队列的元素将第一个从队列中移除，依此类推。\n\n队列有以下应用：\n\
  \n1. 共享资源的访问（例如打印机）。\n2. 多程序设计。\n3. 消息队列。\n\n### 队列 ADT 操作\n\n`Add()`：在队列尾部添加新元素。\n\
  `Remove()`：从队列头部移除一个元素并返回其值。\n`Front()`：返回队列头部元素的值。\n`Size()`：返回队列内部元素的数量。\n`IsEmpty()`：如果队列为空返回\
  \ 1，否则返回 0\n\n*注意：* 以上所有队列操作均在 `O(1)` 时间复杂度内实现。\n\n### JAVA Collection 中的队列实现\n\n\
  `ArrayDeque<T>` 是双端队列的类实现。如果我们使用 `add()`、`remove()` 和 `peekFirst()`，它将表现为一个队列。（如果我们使用\
  \ `push()`、`pop()` 和 `peekLast()`，它则表现为一个栈。）\n\n**示例 4.5**\n\n```java\nimport java.util.ArrayDeque;\n\
  \npublic class DequeQueue<T> {\n    private ArrayDeque<T> deque = new ArrayDeque<T>();\n\
  \n    public void add(T obj) {\n        deque.add(obj);\n    }\n\n    public T remove()\
  \ {\n        return deque.remove();\n    }\n\n    public T peek() {\n        return\
  \ deque.peekFirst();\n    }\n\n    public int size() {\n        return deque.size();\n\
  \    }\n\n    public boolean isEmpty() {\n        return deque.isEmpty();\n    }\n\
  }\n```\n\n## 树 (Trees)\n\n![](img/image00866.jpeg)\n\n树是一种层次化数据结构。树的顶部元素被称为树的根。除了根元素外，树中的每个元素都有父节点以及零或多个子元素。当你有层次化信息需要存储时，树是最用的的数据结构。\n\
  \n树有很多类型，例如二叉树、红黑树、AVL 树等。\n\n## 二叉树\n\n二叉树是树的一种，每个节点最多有两个孩子，称为左孩子和右孩子。\n\n## 二叉搜索树\
  \ (BST)\n\n![](img/image00867.jpeg)\n\n二叉搜索树（BST）是一种按照以下方式排序的二叉树：\n\n1. 左子树的键小于其父节点的键。\n\
  2. 右子树的键大于或等于其父节点的键。\n\n### 二叉搜索树 ADT 操作\n\n`Insert(k)`：向树中插入元素 k。\n`Delete(k)`：从树中删除元素\
  \ k。\n`Search(k)`：在树中搜索特定的值 k，判断其是否存在。\n`FindMax()`：找到树中存储的最大值。\n`FindMin()`：找到树中存储的最小值。\n\
  \n在二叉搜索树上执行上述所有操作的平均时间复杂度*为 O(log n)，即树平衡的情况。\n\n当树倾斜时，最坏的*时间复杂度*将为 `O(n)`。当树不平衡时，二叉树就是倾斜的。\n\
  \n### 平衡二叉搜索树\n\n有一些二叉搜索树可以始终保持平衡。其中最重要的是红黑树（RB-Tree）和 AVL 树。\n\n\n\n\n标准模板库 (`STL`)\
  \ 是使用这种 `红黑树 (RB-Tree)` 实现的。\n\n### JAVA Collections 中的 TreeSet 实现\n\n`TreeSet<>`\
  \ 是实现 `Set<>` 接口的类，这意味着它只存储唯一元素。在 JAVA Collections 中，`TreeSet<>` 是使用红黑平衡二搜索树实现的。由于\
  \ `TreeSet<>` 是使用二搜索树实现的，因此它的元素是顺序顺序存储。\n\n**示例 4.6**\n\n```java\nimport java.util.TreeSet;\n\
  \npublic class TreeSetDemo {\n    public static void main(String[] args) {\n   \
  \     // 创建一个树集合。\n        TreeSet<String> ts = new TreeSet<String>();\n       \
  \ // 向树集合中添加元素。\n        ts.add(\"India\");\n        ts.add(\"USA\");\n        ts.add(\"\
  Brazil\");\n        ts.add(\"Canada\");\n        ts.add(\"UK\");\n        ts.add(\"\
  China\");\n        ts.add(\"France\");\n        ts.add(\"Spain\");\n        ts.add(\"\
  Italy\");\n        System.out.println(ts);\n    }\n}\n```\n\n**输出**\n\n`[Brazil,\
  \ Canada, China, France, India, Italy, Spain, UK, USA]`\n\n**注意**:- `TreeSet` 是使用二搜索树实现的，因此\
  \ `add`、`remove` 和 `contains` 方法的时间复杂度为 `O(log (n))`，其中 `n` 是集合中元素的数量。\n\n### JAVA\
  \ Collection 中的 TreeMap 实现 实现\n\n`Map<>` 是一个将键映射到值的接口。也称为字典。`TreeMap<>` 是 `Map<>`\
  \ 的一种实现，并使用红黑平衡二搜索树实现，因此键值对按排序顺序存储。\n\n**示例 4.7**\n\n```java\nimport java.util.TreeMap;\n\
  \npublic class TreeMapDemo {\n    public static void main(String[] args) {\n   \
  \     // 创建一个树形映射。\n        TreeMap<String, Integer> tm = new TreeMap<String, Integer>();\n\
  \        // 将元素放入映射中\n        tm.put(\"Mason\", new Integer(55));\n        tm.put(\"\
  Jacob\", new Integer(77));\n        tm.put(\"William\", new Integer(99));\n    \
  \    tm.put(\"Alexander\", new Integer(80));\n        tm.put(\"Michael\", new Integer(50));\n\
  \        tm.put(\"Emma\", new Integer(65));\n        tm.put(\"Olivia\", new Integer(77));\n\
  \        tm.put(\"Sophia\", new Integer(88));\n        tm.put(\"Emily\", new Integer(99));\n\
  \        tm.put(\"Isabella\", new Integer(100));\n        System.out.println(\"\
  Total number of students in class :: \" + tm.size());\n        for (String key :\
  \ tm.keySet()) {\n            System.out.println(key + \" score marks :\" + tm.get(key));\n\
  \        }\n        System.out.println(\"Emma score present::\" + tm.containsKey(\"\
  Emma\"));\n        System.out.println(\"John score present:: \" + tm.containsKey(\"\
  John\"));\n        tm.remove(\"Emma\");\n        System.out.println(\"Emma score\
  \ present::\" + tm.containsKey(\"Emma\"));\n    }\n}\n```\n\n**输出**\n\nTotal number\
  \ of students in class :: 10\nAlexander score marks :80\nEmily score marks :99\n\
  Emma score marks :65\nIsabella score marks :100\nJacob score marks :77\nMason score\
  \ marks :55\nMichael score marks :50\nOlivia score marks :77\nSophia score marks\
  \ :88\nWilliam score marks :99\nEmma present in class :: true\nJohn present in class\
  \ :: false\n\n## 优先级队列 (堆)\n\n![](img/image0068.jpeg)\n\n![](img/image0069.jpeg)\n\
  \n优先级队列是使用二堆数据结构实现的。在堆中，记录存储在数组中，使得每个键都大于其两个子节点。堆中的每个节点遵循相同的规则，即父节点的值大于它的两个子节点。\n\
  \n堆数据结构有两种：\n\n1. 最大堆 (Max heap)：每个节点应该大于或等于它的每个子节点。\n2. 最小堆 (Min heap)：每个节点应该小于或等于它的每个子节点。\n\
  \n当你想要从数据集中获取最大/最小值时，堆是一种非常有用的数据结构。堆排序使用最大堆按升序/降序排序数据。\n\n### 堆 ADT 操作\n\n`Insert()`\
  \ - 向堆中添加新元素。该操作的`Time Complexity` 为 `O(log(n))`。\n\n`remove()` - 在最大堆情况下提取最大值（在最小堆情况下提取最小值）。该操作的`Time\
  \ Complexity` 为 `O(log(n))`。\n\n`Heapify()` – 将数组中的一组数字列表转换为堆。该操作的`Time Complexity`\
  \ 为 `O(n)`。\n\n### JAVA Collection 中的 PriorityQueue 实现\n\n优先级队列的最小堆实现。\n\n**示例 4.8**\n\
  \n```java\nimport java.util.PriorityQueue;\n\npublic class PriorityQueueDemo {\n\
  \    public static void main(String[] args) {\n        PriorityQueue<Integer> pq\
  \ = new PriorityQueue<>();\n        int[] arr = {1,2,10,7,3,4,6,8,9,5};\n      \
  \  for (int i: arr) {\n            pq.add(i);\n        }\n        System.out.println(\"\
  Priority Queue Heap :: \" + pq.remove());\n        while (!pq.isEmpty()) {\n   \
  \         System.out.println(\"Priority Queue elements :: \" + pq.remove());\n \
  \       }\n    }\n}\n```\n*(注: 原文中的示例 4.8 代码存在语法错误且括号未闭合，已修正为符合 Java 逻辑的结构。)*\n\n\
  \n\n\n\n```java\npublic static void main(String[] args) {\n    // Create a hash\
  \ set.\n    HashSet<String> hs = new HashSet<String>();\n    // Add elements to\
  \ the hash set.\n    hs.add(\"India\");\n    hs.add(\"USA\");\n    hs.add(\"Brazil\"\
  );\n    hs.add(\"Canada\");\n    hs.add(\"UK\");\n    hs.add(\"China\");\n    hs.add(\"\
  France\");\n    hs.add(\"Spain\");\n    hs.add(\"Italy\");\n    System.out.println(hs);\n\
  \    System.out.println(\"Hash Table contains USA : \" + hs.contains(\"USA\"));\n\
  \    System.out.println(\"Hash Table contains Russia : \" +\n    hs.contains(\"\
  Russia\"));\n    hs.remove(\"USA\");\n    System.out.println(hs);\n    System.out.println(\"\
  Hash Table contains USA : \" + hs.contains(\"USA\"));\n}\n```\n\n**输出**\n[Canada,\
  \ USA, UK, China, Italy, Brazil, France, India, Spain]\nHash Table contains USA\
  \ : true\nHash Table contains Russia : false\n[Canada, UK, China, Italy, Brazil,\
  \ France, India, Spain]\nHash Table contains USA : false\n\n### JAVA Collections\
  \ 中的 LinkedHashSet 实现\n\n`LinkedHashSet<>` 是一个实现了 `Set<>` 接口的类，这意味着它只存储唯一元素。`LinkedHashSet<>`\
  \ 是使用哈希表和链表实现的。`Linked list` 用于根据插入顺序保留元素的顺序。遍历哈希表的元素是按照插入顺序完成。\n\n**示例 4.11**\n\
  \n```java\nimport java.util.HashSet;\nimport java.util.LinkedHashSet;\n\npublic\
  \ class LinkedHashSetDemo {\n    public static void main(String[] args) {\n    \
  \    // Create a hash set.\n        HashSet<String> hs = new HashSet<String>();\n\
  \        // Add elements to the set.\n        hs.add(\"India\");\n        hs.add(\"\
  USA\");\n        hs.add(\"Brazil\");\n        hs.add(\"Canada\");\n        hs.add(\"\
  UK\");\n        hs.add(\"China\");\n        hs.add(\"France\");\n        hs.add(\"\
  Spain\");\n        hs.add(\"Italy\");\n        System.out.println(\"HashSet value::\
  \ \" + hs);\n        // Create a linked hash set.\n        LinkedHashSet<String>\
  \ lhs = new LinkedHashSet<String>();\n        // Add elements to the linked hash\
  \ set.\n        lhs.add(\"India\");\n        lhs.add(\"USA\");\n        lhs.add(\"\
  Brazil\");\n        lhs.add(\"Canada\");\n        lhs.add(\"UK\");\n        lhs.add(\"\
  China\");\n        lhs.add(\"France\");\n        lhs.add(\"Spain\");\n        lhs.add(\"\
  Italy\");\n        System.out.println(\"LinkedHashSet value:: \" + lhs);\n    }\n\
  }\n```\n\n**输出**\nHashSet value:: [Canada, USA, UK, China, Italy, Brazil, France,\
  \ India, Spain]\nLinkedHashSet value:: [India, USA, Brazil, Canada, UK, China, France,\
  \ Spain, Italy]\n\n各种 Set 类的比较。\n\n| | TreeSet | HashSet | LinkedHashSet |\n| :---\
  \ | :--- | :--- | :--- |\n| 存储 | 红黑树 | 哈希表 | 带有链表的哈希表 |\n| 性能 | 比 HashSet 慢，O(log(N))\
  \ | 最快，常数时间 | 比 HashSet 贵，需要维护链表 |\n| 迭代顺序 | 升序排序 | 不保证顺序 | 插入顺序 |\n\n### JAVA Collection\
  \ 中的 HashMap 实现\n\n`Map<>` 是一个将键（key）映射到值（value）的数据结构。也称为字典。`HashMap<>` 是 `Map<>`\
  \ 的实现，使用哈希表实现，因此键值对不是按排序存储的。`Map<>` 不允许重复键，但值可以重复。\n\n**示例 4.12**\n\n```java\nimport\
  \ java.util.HashMap;\npublic class HashMap {\n    public static void main(String[]\
  \ args) {\n        // Create hash map.\n        HashMap<String, Integer> hm = new\
  \ HashMap<String, Integer>();\n        // Put elements into the map\n        hm.put(\"\
  Mason\", 5);\n        hm.put(\"Jacob\", 77);\n        hm.put(\"William\", 99);\n\
  \        hm.put(\"Alexander\", 80);\n        hm.put(\"Michael\", 50);\n        hm.put(\"\
  Emma\", 65);\n        hm.put(\"Olivia\", 77);\n        hm.put(\"Sophia\", 88);\n\
  \        hm.put(\"Emily\", 99);\n        hm.put(\"Isabella\", 100);\n        System.out.println(\"\
  Total number of students in class :: \" + hm.size());\n        for (String key :\
  \ hm.keySet()) {\n            System.out.println(key + \" score marks :\" + hm.get(key));\n\
  \        }\n        System.out.println(\"Emma score present::\" + hm.containsKey(\"\
  Emma\"));\n        System.out.println(\"John score present:: \" + hm.containsKey(\"\
  John\"));\n    }\n}\n```\n\n**输出**\n班级总人数 :: 10\nOlivia score marks : 77\nEmily\
  \ score marks : 99\nAlexander score marks : 80\nMason score marks : 55\nMichael\
  \ score marks : 50\nIsabella score marks : 100\nWilliam score marks : 99\nEmma score\
  \ marks : 65\nSophia score marks : 88\nJacob score marks : 77\nEmma present in class\
  \ : true\nJohn present in class : false\n\n## 字典 / 符号表\n\n符号表（Symbol Table）是 `string(key)`\
  \ 与 `value` 之间的映射，`value`可以是任意数据类型。`value` 可以是整数，例如出现次数、单词的字典释义等。\n\n### 用于字符串的二叉搜索树\
  \ (BST)\n\n二叉搜索树 (BST) 是实现符号表最简单的方法。可以使用简单的字符串比较函数来比较两个字符串。如果所有的键都是随机的，并且树是平衡的。那么平均情况下键查找可以在对数时间内完成。\n\
  \n\n\n\n\nTrie 是一种高效的数据结构。使用 `Trie`，我们可以在 `O(M)` 时间内搜索键，其中 `M` 是字符串的最大长度。`Trie`\
  \ 也适用于解决部分匹配和范围查询问题。\n\n![](img/image00873.jpeg)\n\n### 三元搜索树 (Ternary Search Trie/\
  \ Ternary Search Tree)\n\nTrie 具有非常良好的 `O(M)` 搜索性能，其中 `M` 是搜索字符串的最大长度。然而，Trie 的空间要求非常高。每个\
  \ `Trie` 节点包含指向多个节点的引用，每个引用对应键的可能字符。为了避免这种高空间需求，使用了三元搜索树 (`TST`)。\n\nTST 避免了传统 `Trie`\
  \ 对空间的高昂需求，同时保留了其许多优势。在 `TST` 中，每个节点包含一个字符、一个结束指示以及三个引用。三个引用分别对应等于、小于和大于字符。三元搜索树的操作的时间复杂度与搜索树的高度成正比。在最坏的情况下，我们需要遍历\
  \ 3 次链接。然而，这种情况很少见。因此，`TST` 是实现符号表、部分匹配和范围查询的非常好的解决方案。\n\n![](img/image0874.jpeg)\n\
  \n## 图 (Graphs)\n\n![](img/image0875.jpeg)\n\n图是一种表示网络的数据结构，它连接了一组节点，这些连接被称为边。边可以是有向的或无向的。如果是有向，则只能向一个方向移动；如果是无向，则可以在两个方向移动。\n\
  \n## 图算法 (Graph Algorithms)\n\n![](img/image076.jpeg)\n\n### 深度优先搜索 (DFS)\n\n在 `DFS`\
  \ 算法中，我们从起点开始进入深度，直到到达尽头再搜索下一个顶点。或者，我们可以使用递归来实现同样的。\n\n![](img/image077.jpeg)\n\n\
  ### 广度优先搜索 (BFS)\n\n在 `BFS` 算法中，图按层层遍历，靠近起点的地方。使用队列来实现 `BFS`。\n\n![](img/image078.jpeg)\n\
  \n## 排序算法 (Sorting Algorithms)\n\n![](img/image079.jpeg)\n\n排序是将集合中的元素按升序或降序排列的过程。排序将数据排序，使得搜索变得更容易。有很多可用的排序函数，在\
  \ `O(nlogn)` 时间内完成排序，当我们需要排序时将使用 `sort()` 函数，假设排序是在 `O(nlogn)` 时间内完成的。\n\n[计数排序\
  \ (Counting Sort)](http://www.bogotogo.com/Algorithms/countingsort.php)\n\n计数排序是最简单高效的排序类型。计数排序对数据的预定义范围有严格要求，例如年龄组。\n\
  \n![](img/image080.jpeg)\n\n如果我们知道输入的范围，可以使用 `O(n+k)` 完成计数。\n\n## 结语 (End note)\n\
  \n本章提供了各种数据结构、算法及其复杂性的要介绍。在接下来的章节中，我们将详细研究这些数据结构。如果你了解各种数据结构的接口，就可以在不知道其实现细节的情况下解决其他问题。\n\
  \n# 第 5 章：搜索 (Chapter 5: Searching)\n\n## 引言 (Introduction)\n\n在计算机科学中，搜索是在项目列表中查找特定项目的算法过程。该项目可以是文件中的关键字、数据库中的记录、树中的节点或数组中的值等。\n\
  \n## 为什么要搜索？ (Why Searching?)\n\n想象你在一个拥有百万本书的图书馆里。你想找一本特定标题的书。你会如何找到？你将从书名的首字母开始搜索。然后继续匹配整个书名，直到找到所需的书籍（通过这种简单的启发式方法，你将搜索空间缩小了\
  \ 26 倍，假设我们有相同特定字符开头的书）。\n\n同样，计算机存储了大量信息，为了有效地检索这些信息，我们需要高效的搜索算法。为了提高搜索效率，我们将数据保持某种良好的顺序。组织数据的方法有很多。如果你保持数据的良好顺序，搜索所需的元素很容易。例如，排序就是组织数据的方法。\n\
  \n##不同的搜索算法 (Different Searching Algorithms)\n\n* 线性搜索 – 无序输入（Linear Search – Unsorted\
  \ Input）\n* 线性搜索 – 有序输入（Linear Search – Sorted Input）\n* 二分查找（有序输入）（Binary Search\
  \ (Sorted Input)\n* 字符串搜索：Trie、后缀树、三元搜索（String Search: Tries, Suffix Trees, Ternary\
  \ Search.）\n* 哈希与符号表（Hashing and Symbol Tables）\n\n## 线性搜索 – 无序输入 (Linear Search\
  \ – Unsorted Input)\n\n当数组元素没有顺序或排序时，且我们要搜索某个特定值，我们必须扫描整个数组，除非找到所需值。这种算法被称为无序线性搜索。该算法的主要问题是性能较低或最坏情况下时间复杂度较高。\n\
  \n**示例 5.1**\n\n```cpp\nboolean linearSearchUnsorted(int[] arr, int size, int value)\
  \ {\n    int i = 0;\n    for (i = 0 ; i < size ; i++) {\n        if (value == arr[i])\
  \ {\n            return true;\n        }\n    }\n}\n```\n\n时间复杂度：`O(n)`。因为我们需要遍历整个数组。最坏的情况是所需的元素位于数组的最后一个位置。空间复杂度：`O(1)`。没有使用额外内存。\n\
  \n## 线性搜索 – 有序 (Linear Search – Sorted)\n\n如果数组元素按升序或降序排序，搜索一个元素将比无序搜索高效得多。在很多情况下，我们不需要遍历整个数组。以下示例解释了当遇到较大的元素时停止。这节省了时间。\n\
  \n**示例 5.2**\n\n```cpp\nboolean linearSorted(int[] arr, int size, int value) {\n\
  \    int i = 0;\n    for (i = 0 ; i < size ; i++) {\n        if (value == arr[i])\
  \ {\n            return true;\n        } else if ( value < arr[i] ) {\n        \
  \    return false;\n        }\n    }\n}\n```\n\n时间复杂度：`O(n)`。因为我们需要遍历整个数组。最坏的情况是所需的元素位于排序数组的最后一个位置。然而，尽管增长率与无序相同，但在平均情况下这种算法更高效。空间复杂度：`O(1)`。没有使用额外内存分配数组。\n\
  \n## 二分查找 (Binary Search)\n\n我们如何在字典中查找单词？通常，我们去某个近似页面（通常是中间）并从那里开始搜索。如果我们搜索的单词相同，则搜索完成。否则，如果我们发现页面在选定页面之前，则对前半应用相同的相同的，否则对后半部分。二分查找也同样的方式工作。我们从排序数组获取中间点并与目标值进行比较。\n\
  \n注意：二分查找要求数组是有序的，否则无法应用二分查找。\n\n**示例 5.3**\n\n```cpp\n// 二分查找算法 – 迭代方式\nboolean\
  \ Binarysearch(int[] arr, int size, int value)\n    int low = 0;\n    int high =\
  \ size-1;\n    int mid;\n    while (low <= high) {\n```\n\n\n\n\n\n```java\nmid\
  \ = low + (high-low)/2; // 防止溢出\nif (arr[mid] == value)\n    return true;\nelse\
  \ if (arr[mid] < value)\n    low = mid + 1;\nelse\n    high = mid - 1;\n}\nreturn\
  \ false;\n}\n```\n\n时间复杂度：`O(logn)`。我们总是取输入的一半并丢弃另一部分。因此，二分查找的递归关系为 `T(n) = T(n/2)\
  \ + c`。使用主定理（分治法），我们得到 `T(n) = O(logn)`。\n\n空间复杂度：`O(1)`\n\n## 示例 5.4\n\n### 二分查找算法\
  \ – 递归方式\n\n```java\nboolean BinarySearchRecursive(int[] arr, int low, int high,\
  \ int value)  \n{\n    if(low > high)\n        return false;\n    int mid = low\
  \ + (high-low)/2; // 防止溢出\n    if (arr[mid] == value)\n        return true;\n  \
  \  else if (arr[mid] < value)\n        return BinarySearchRecursive (arr, mid +\
  \ 1, high, value);\n    else\n        return BinarySearchRecursive (arr, low, mid\
  \ - 1 , value);\n}\n```\n\n时间复杂度：`O(logn)`。空间复杂度：递归时的系统栈为 `O(logn)`。\n\n## 字符串搜索算法\n\
  \n请参字符串章节。\n\n## 哈希与符号表\n\n请参阅哈希表章节。\n\n## 排序在选择算法中有什么用？\n\n选择问题可以转换为排序问题。一旦数组经过排序，就可以很容易地从排序数组中找到最小/最大值（或所需的元素）。`先排序后选择`的方法对于选择单个元素来说效率很低，但当需要从数组中进行多次选择时，它是非常高效的。这是因为只需要进行一次昂贵的初始排序，随后是多次廉价的选择操作。\n\
  \n例如，如果我们想从数组中获取最大元素。对数组排序后，我们可以直接返回数组的最后一个元素。如果我们想获取第二大元素呢？现在我们不需要再次排序数组，只需返回排序数组中的倒数第二个元素。同样，我们可以通过对排序后的列表进行一次扫描来返回第\
  \ `kth` 个最大元素。\n\n因此，通过上述讨论，排序被用于提高性能。通常，这种方法需要 `O(nlogn)` 时间（用于排序）。通过初始排序，我们可以在一次扫描\
  \ `O(n)` 内内回答任何查询。\n\n## 搜索中的问题\n\n### 打印数组中的重复元素\n\n给定一个包含 `n` 个数字的数组，打印数组中的重复元素。\n\
  \n*方法一*：穷举搜索或暴力法，对于数组中的每个元素，查找是否存在另一个具有相同元素。这通过两个 `for` 循环完成，第一个循环选择元素，第二个循环查找它的重复项。\n\
  \n### 示例 5.5\n\n```java\nvoid printRepeating(int[] arr, int size)\n{\n    int i,\
  \ j;\n    System.out.println(\" Repeating elements are \");\n    for(i = 0; i <\
  \ size; i++)\n        for(j = i+1; j < size; j++)\n            if(arr[i] == arr[j])\n\
  \                System.out.println(\" \" + arr[i]);\n}\n```\n时间复杂度为 ![](img/image0081.jpeg)，空间复杂度为\
  \ ![](img/image0082.jpeg)。\n\n*方法二*：对数组中的所有元素进行排序，之后通过单次扫描即可找到重复元素。\n\n### 示例 5.6\n\
  \n```java\nvoid printRepeating2(int[] arr, int size) {\n    int i;\n    Arrays.sort(arr);\
  \ // 排序(arr,size);\n    System.out.println(\" Repeating elements are \");\n    for(i\
  \ = 1; i < size; i++)\n    {\n        if(arr[i] == arr[i-1])\n            System.out.println(\"\
  \ \" + arr[i]);\n    }\n}\n```\n排序算法需要 ![](img/image0083.jpeg)时间，单次扫描需要 ![](img/image0084.jpeg)。算法的时间复杂度为\
  \ ![](img/image0085.jpeg)，空间复杂度为 ![](img/image0082.jpeg)。\n\n*方法三*：哈希表，使用哈希表我们可以跟踪已经过的元素，并只需一次扫描即可找到重复元素。\n\
  \n### 示例 5.7\n\n```java\nvoid printRepeating3(int[] arr, int size)\n{\n    HashSet<Integer>\
  \ hs = new HashSet<Integer>();\n    int i;\n    System.out.println(\" Repeating\
  \ elements are \");\n    for(i = 0; i < size; i++)\n    {\n        if(hs.contains(arr[i]))\n\
  \            System.out.println(\" \" + arr[i]);\n        else\n            hs.add(arr[i]);\n\
  \    }\n}\n```\n哈希表的插入和查找需要常数时间 ![](img/image0086.jpeg)，因此总时间复杂度为 ![](img/image0087.jpeg)。空间复杂度为\
  \ ![](img/image0088.jpeg)。\n\n*方法四*：计数，这种方法只有在知道输入范围时可行。如果我们知道数组中的元素范围在 0 到 `n-1`\
  \ 之间，我们可以留出一个长度为 `n` 的数组，当我们看到一个元素时，增加它的计数。只需一次扫描即可知道重复元素。如果我们知道元素的范围，这就是查找重复元素最快的方法。\n\
  \n### 示例 5.8\n\n```java\nvoid printRepeating4(int[] arr, int size)\n{\n    int[]\
  \ count = new int[size];\n    int i;\n    for(i = 0; i < size; i++)\n        count[i]=0;\n\
  \    System.out.println(\" Repeating elements are \");\n    for(i = 0; i < size;\
  \ i++)\n    {\n        if(count[arr[i]] == 1)\n            System.out.println(\"\
  \ \" + arr[i]);\n        else\n            count[arr[i]]++;\n    }\n}\n```\n计数方法仅使用一个数组，插入和查找需要常数时间\
  \ ![](img/image0089.jpeg)，因此总时间复杂度为 ![](img/image0087.jpeg)。创建计数数组的空间复杂度为 ![](img/image0088.jpeg)。\n\
  \n### 数组中出现最多的元素\n\n给定一个包含 `n` 个数字的数组，找到次数最多的元素。\n\n*方法一*：穷举搜索或暴力法，对于数组中的每个元素，查找该特定值出现的次数。跟踪\
  \ `maxCount`，当某个元素的计数大于它时更新 `maxCount`。这通过两个 `for` 循环完成，第一个循环选择元素，第二个循环统计该元素的出现次数。时间复杂度为\
  \ ![](img/image0090.jpeg)，空间复杂度为 ![](img/image0091.jpeg)。\n\n### 示例 5.9\n\n```java\n\
  int getMax(int[] arr, int size)\n{\n    int i, j;\n    int max = arr[0], count =\
  \ 1, maxCount = 1;\n    for (i = 0; i < size; i++)\n    {\n        count = 1;\n\
  \        for (j = i + 1; j < size; j++)\n            if (arr[i] == arr[j])\n   \
  \             count++;\n        if (count > maxCount)\n        {\n            max\
  \ = arr[i];\n            maxCount = count;\n        }\n    }\n    return max;\n\
  }\n```\n\n*方法二*：排序，对数组中的元素进行排序，之后通过单次扫描即可找到计数。\n\n### 示例 5.10\n\n```java\nint getMax2(int[]\
  \ arr, int size)\n{\n    int max = arr[0], maxCount = 1;\n    int curr = arr[0],\
  \ currCount = 1;\n    int i;\n}\n```\n\n\n\n\n```\nArrays.sort(arr); // Sort(arr,size);\n\
  \nfor (i = 1; i < size; i++)\n{\n    if (arr[i] == arr[i - 1])\n        currCount++;\n\
  \    else\n    {\n        currCount = 1;\n        curr = arr[i];\n    }\n    if\
  \ (currCount > maxCount)\n    {\n        maxCount = currCount;\n        max = curr;\n\
  \    }\n}\nreturn max;\n```\n\n### 第三种方法：计数法\n这种方法仅在知道输入范围时才可行。如果知道这一点，那么数组中的元素范围在\
  \ `0` 到 `n-1` 之间。我们可以预留一个长度为 `n` 的数组，当我们看到一个元素时，就可以增加它的计数。只需通过一次扫描，我们就能知道重复元素。如果我们知道元素的范围，那么这是找到最大次数最快的方法。\n\
  \n计数法仅使用数组，因此增加计数需要常数时间![](img/image00889.jpeg)，所以算法的总体*时间复杂度*为 ![](img/image00887.jpeg)时间。创建计数数组的空间复杂度也为\
  \ ![](img/image00888.jpeg\n\n### 示例 5.11\n```java\nint getMax(int[] arr, int size,\
  \ int range)\n{\n    int max = arr[0], maxCount = 1;\n    int[] count = new int[range];\n\
  \    int i;\n    for (i = 0; i < size; i++)\n    {\n        count[arr[i]]++;\n \
  \       if (count[arr[i]] > maxCount)\n        {\n            maxCount = count[arr[i]];\n\
  \            max = arr[i];\n        }\n    }\n    return max;\n}\n```\n\n### 数组中的多数元素\n\
  给定一个包含 `n` 个元素的数组。找到多数元素，即出现次数超过 `n/2` 次的元素。如果没有多数元素，返回 0。\n\n**第一种方法**：穷举搜索或暴力破解，对于数组中的每个元素，查找该特定值出现的次数。跟踪\
  \ `maxCount`，当某个元素的计数大于它时，则更新 `maxCount`。这是通过两个循环实现的：第一个循环用于选择元素，第二个循环用于统计该元素的出现次数。一旦我们得到了最终的\
  \ `maxCount`，就可以检查它是否大于 `n/2`，如果是，则有多数元素；如果不是，则。时间复杂度为 ![](img/image0892.jpeg)，空间复杂度为\
  \ ![](img/image00882.jpeg)\n\n### 示例 5.12\n```java\nint getMajority(int[] arr, int\
  \ size)\n{\n    int i, j;\n    int max=0, count=0, maxCount=0;\n    for(i = 0; i\
  \ < size; i++)\n    {\n        for(j = i+1; j < size; j++)\n        {\n        \
  \    if(arr[i] == arr[j])\n                count++;\n            if(count > maxCount)\n\
  \            {\n                max = arr[i];\n                maxCount = count;\n\
  \            }\n        }\n    }\n    if (maxCount > size/2)\n        return max;\n\
  \    else\n        return Integer.MIN_VALUE;\n}\n```\n\n**第二种方法**：排序，对数组中的所有元素进行排序。如果有多数元素，那么索引\
  \ `n/2` 处的中间元素必须是多数数字。因此，只需一次扫描即可找到它的计数并判断是否存在多数元素。\n\n排序算法需要 ![](img/image00883.jpeg)时间，单次扫描需要\
  \ ![](img/image00884.jpeg)时间。\n\n算法的*时间复杂度*为 ![](img/image00885.jpeg)，*空间复杂度*为 ![](img/image00882.jpeg)\n\
  \n### 示例 5.13\n```java\nint getMajority2(int[] arr, int size)\n{\n    int majIndex\
  \ = size/2, count = 1;\n    int i;\n    int candidate;\n    Arrays.sort(arr);\n\
  \    candidate = arr[majIndex];\n    count = 0;\n    for (i = 0; i < size; i++)\n\
  \        if(arr[i] == candidate)\n            count++;\n    if (count > size/2)\n\
  \        return arr[majIndex];\n    else\n        return Integer.MIN_VALUE;\n}\n\
  ```\n\n**第三种方法**：这是抵消法（摩尔投票算法），如果所有元素都反对多数元素，且每个元素与多数元素中的一个元素抵消，则存在多数元素。\n- 将数组的第一个元素设置为候选元素，并将计数初始化为\
  \ 1。\n- 开始扫描数组。\n- 如果我们得到的某个元素值与多数元素相同，则增加计数。\n- 如果我们得到的元素值与多数元素不同，则减少计数。\n- 如果计数为\
  \ 0，意味着我们有了一个新的多数元素。将当前候选元素设置为多数元素并将计数重置为 1。\n- 最后，我们将得到一个唯一的可能候选元素。\n- 现在再次扫描数组，检查上面找到的候选元素出现次数是否超过了\
  \ `n/2` 次。\n\n计数法只需两次扫描。算法的*时间复杂度*为 ![](img/image0884.jpeg)时间。创建计数数组的空间复杂度也为 ![](img/image0893.jpeg\n\
  \n### 示例 5.14\n```java\nint getMajority(int[] arr, int size)\n{\n    int majIndex\
  \ = 0, count = 1;\n    int i;\n    int candidate;\n    for (i = 1; i < size; i++)\n\
  \    {\n        if(arr[majIndex] == arr[i])\n            count++;\n        else\n\
  \            count--;\n        if(count == 0)\n        {\n            majIndex =\
  \ i;\n            count = 1;\n        }\n    }\n    candidate = arr[majIndex];\n\
  \    count = 0;\n    for (i = 0; i < size; i++)\n        if(arr[i] == candidate)\n\
  \            count++;\n    if (count > size/2)\n        return majIndex; // 注意：原始逻辑返回\
  \ majIndex，通常返回 candidate\n}\n```\n\n### 示例 5.15\n```java\nint findMissing(int[]\
  \ arr, int size)\n{\n    int i, j, found = 0;\n    for (i = 1; i <= size; i++)\n\
  \    {\n        found = 0;\n        for (j = 0; j < size; j++)\n        {\n    \
  \        if (arr[j] == i)\n            {\n                found = 1;\n         \
  \       break;\n            }\n        }\n        if (found == 0)\n            return\
  \ i;\n    }\n}\n```\n\n\n\n\n\n### 第三种方法：哈希表 (Hash-Table)\n\n使用哈希表，我们可以跟踪已经过的元素，只需一次扫描即可找到缺失的元素。\n\
  \n`Hash-Table` 的插入和查找需要常数时间![](img/image00886.jpeg)，因此算法的总*时间复杂度*为 ![](img/image00887.jpeg)。*空间复杂度*也是\
  \ ![](img/image00895.jpeg)\n\n### 第四种方法：计数法\n\n我们知道输入的范围，因此使用计数法是可行的。众所周知，数组中的元素在\
  \ 0 到 `n-1` 范围内。我们可以预留一个长度为 `n` 的数组，当我们看到一个元素时，增加它的计数。只需一次扫描，我们就能知道缺失的元素。\n\n计数法仅使用一个数组，因此插入和查找需要常数时间![](img/image00886.jpeg)，因此算法的总*时间复杂度*为\
  \ ![](img/image00884.jpeg)。创建计数数组的*空间复杂度*也是 ![](img/image00888.jpeg)\n\n### 第五种方法：修改法\n\
  \n允许修改给定的输入数组。修改给定的输入数组，以便在下次扫描时可以找到缺失的元素。\n\n当你遍历数组时，当索引为 `index` 时，数组中存储的值为 `arr[index]`，将数字\
  \ `n + 1` 加到 `arr[arr[index]]`。始终使用取模运算符 `%%` 从数组中读取值。当你第一次扫描数组并修改所有值后，只需再次扫描，就可以查看数组中是否存在某个小于\
  \ `n+1` 的值，该索引就是缺失的数字。\n\n在这种方法中，数组被扫描两次，该算法的*时间复杂度*为 ![](img/image00887.jpeg)。*空间复杂度*为\
  \ ![](img/image00896.jpeg)\n\n### 第六种方法：求和公式\n\n使用求和公式找到从 1 到 `n` 的 `n` 个数字的和。减去数组中存储的值，你就得到了缺失的数字。\n\
  \n该算法的*时间复杂度*为 ![](img/image00887.jpeg)。*空间复杂度*为 ![](img/image00893.jpeg)\n\n###\
  \ 第七种方法：异或法 (XOR)\n\n使用异或法找到从 1 到 `n` 的 `n` 个数字的和。异或数组中存储的值，你就得到了缺失的数字。\n\n该算法的*时间复杂度*为\
  \ ![](img/image00884.jpeg)。*空间复杂度*为 ![](img/image00893.jpeg)\n\n### 示例 5.16\n\n\
  ```java\nint findMissingNumber(int[] arr, int size, int range)\n{\n    int i;\n\
  \    int xorSum = 0;\n    //获取从 1 到 range 所有数字的异或结果\n    for (i = 1; i <= range;\
  \ i++)\n        xorSum ^= i;\n    // 遍历数组并获取元素的异或结果\n    for (i = 0; i<size; i++)\n\
  \        xorSum ^= arr[i];\n    return xorSum;\n}\n```\n\n注意：相同的问题可能以多种形式出现（有时你必须对范围进行异或，有时不需要）：\n\
  \n1. 在 1-n 范围内的数字中，其中所有数字都出现一次，但有一个数字出现了两次。\n2. 1-n 范围内的所有元素都出现了 16 次，一个元素出现了 17\
  \ 次。找到出现 17 次的元素。\n\n### 在数组中寻找配对\n\n给定一个包含 `n` 个数字的数组，找到两个元素，使得它们的和等于 `value`。\n\
  \n### 第一种方法：穷举搜索\n\n暴力法，对于数组中的每个元素，查找是否存在另一个元素，其和等于目标值。这是通过两个 `for` 循环实现的，第一个循环选择元素，第二个循环寻找另一个元素。\n\
