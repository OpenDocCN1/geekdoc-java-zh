  \n![](img/image01116.jpeg)\n\n## 分治算法算法问题\n\n### 合并排序算法\n\n![](img/image01117.jpeg)\n\
  \n```text\n// 使用归并排序对给定数组排序\n// 输入：一个可排序元素的数组 A\n// 输出：升序的数组 A[0..n − 1]\nAlgorithm\
  \ Mergesort(A[0..n − 1])\nif n ≤ 1 then\n    return;\ncopy A[0..⌊n/2⌋ − 1] to B[0..⌊n/2⌋\
  \ − 1]\ncopy A[⌊n/2⌋..n − 1] to C[0..⌈n/2⌉ − 1]\nMergesort(B)\nMergesort(C)\nMerge(B,\
  \ C, A)\n\n// 将两个排序数组合并成一个数组\n// 输入：排序后的数组 B 和 C\n// 输出：排序后的数组 A\nAlgorithm Merge(B[0..p\
  \ − 1], C[0..q − 1], A[0..p + q − 1])\ni = 0\nj = 0\nfor k = 0 to p + q − 1 do\n\
  \    if i < p and (j = q or B[i] ≤ C[j]) then\n        A[k] = B[i]\n        i =\
  \ i + 1\n    else\n        A[k] = C[j]\n        j = j + 1\n```\n\n时间复杂度：`O(nlogn)`\n\
  \n空间复杂度：`O(n)`\n\n合并排序在所有 3 种情况（最坏、平均和最好）下的`时间复杂度` 均为 `O(nlogn)`，因为合并排序始终将数组分为两半，并花费线性时间合并这两个部分。\n\
  \n它所需的额外空间与未排序列表的等。因此，完全不建议用于在大型未排序列表中搜索。\n\n### 快速排序\n\n![](img/image01118.jpeg)\n\
  \n![](img/image01119.jpeg)\n\n```text\n// 使用快速排序对子数组排序\n// 输入：A 的子数组\n// 输出：升序的数组\
  \ A[l..r]\nAlgorithm Quicksort(A[l..r])\nif l < r then\n    p ← Partition(A[l..r])\
  \ // p 是基值的索引\n    Quicksort(A[l..p − 1])\n    Quicksort(A[p + 1..r])\n\n// 使用 A[..]\
  \ 作为基准划分子数组\n// 输入：A 的子数组\n// 输出：基值的最终位置\nAlgorithm Partition(A[], left, right)\n\
  pivot = A[left]\nlower = left\nupper = right\nwhile lower < upper\n    while A[lower]\
  \ <= pivot\n        lower = lower + 1\n    while A[upper] > pivot\n        upper\
  \ = upper – 1\n    if lower < upper then\n        swap A[lower] and A[upper]\nswap\
  \ A[lower] and A[upper] //upper 是基值的位置\nreturn upper\n```\n\n最坏情况`时间复杂度`：`O(n²)`\n\
  \n最好情况时间复杂度：`O(nlogn)`\n\n平均时间复杂度：`O(nlogn)`\n\n空间复杂度：`O(nlogn)`\n\n快速排序所需的空间非常少，只需要\
  \ `O(nlogn)` 的额外空间。\n\n快速排序不是一种稳定的排序技术，因此在排序过程中可能会改变列表中两个相似元素的顺序。\n\n### 外部排序\n\n\
  外部排序也是使用分治完成的![](img/image01120.jpeg)\n\n### 二分查找\n\n我们从数组获取中间点并开始与目标值进行比较。\n注意：二分查找要求数组是排序的，否则无法应用二分查找。\n\
  \n```text\n// 使用二分查找在排序数组中搜索值\n// 输入：一个排序的数组 A 和一个键 K\n// 输出：K 的索引或 −1\nAlgorithm\
  \ BinarySearch(A[0..N − 1], N, K) // 迭代解\nlow = 0\nhigh = N-1\nwhile low <= high\
  \ do\n    mid = ⌊ (low + high)/2⌋\n    if K = A[mid] then\n        return mid\n\
  \    else if A[mid] < K\n        low = mid + 1\n    else\n        high = mid - 1\n\
  return −1\n\n// 使用二分查找在排序数组中搜索值\n// 输入：一个排序的数组 A 和一个键 K\n// 输出：K 的索引或 −1\nAlgorithm\
  \ BinarySearch(A[], low, high, K) // 递归解\nif low > high\n    return -1\nmid = ⌊\
  \ (low + high)/2⌋\nif K = A[mid] then\n    return mid\nelse if A[mid] < K\n    return\
  \ BinarySearch(A[], mid + 1, high, K)\nelse\n    return BinarySearch(A[], low, mid\
  \ - 1, K)\n```\n\n`时间复杂度`：`O(logn)`。如果你注意到上面的程序，你会发现我们总是取另一半。因此二分查找的递推关系为 `T (n)\
  \ = T(n/2) + c`。使用分治主定理得到 `T (n) = O(logn)`。\n\n空间复杂度：`O(1)`\n\n### 幂函数\n\n```text\n\
  // 使用递归分治计算 X 的 N 次方\n// 输入：值 X 和幂 N\n// 输出：Power( X, N)\nAlgorithm Power( X, N)\n\
  if N = 0\n    return 1\nelse if N % 2 == 0\n    Value = Power(X, N/2)\n    return\
  \ Value * Value\nelse\n    Value = Power(X, N/2)\n    return Value * Value * X\n\
  ```\n\n### 凸包\n\n按 X 坐标排序\n将点分为相等的两半 A 和 B\n递归计算 HA 和 HB\n合并 HA 和 HB  CH ![](img/image01121.jpeg)\n\
  \n```text\nLowerTangent(HA, HB)\nA = HA 的右侧点\nB = HB 的左点\nWhile ab 不是 HA 和 HB 的下切线\
  \ do\n    While ab 不是 HA 的下切线 do\n        a = a − 1 (顺时针移动 a)\n    While ab 不是 HB\
  \ 的下切线 do\n        b = b + 1 (逆时针移动 b)\nreturn ab\n```\n\n同样地寻找上切线并合并两个凸包![](img/image01122.jpeg)\n\
  \n初始排序花费 `O(nlogn)` 时间\n递推关系 `T (N) = 2T (N/2) + O(N)`\n其中，合并过程中计算切线花费了 `O(N)` 时间\n\
  最终`时间复杂度`将是 `T (N) = O(nlogn)`。\n\n\n\n\n由于我们已经传递了一个函数 Y 坐标列表，因此只需要通过一次遍历，在时间复杂度为\
  \ `O(N)` 的情况下，就能在 Y 坐标中找到按 Y 坐标排序的 `δ` 区域点。\n\n`T(N) = 2T(N/2) + N + N + 6N = O(nlogn)`\n\
  \n```cpp\n// Finds closest pair of points\n// Input: A set of n points sorted by\
  \ coordinates\n// Output: Distance between closest pair\n\nAlgorithm ClosestPair(P)\n\
  if n < 2 then\n    return ∞\nelse if n = 2 then\n    return distance between pair\n\
  else\n    m = median value for x coordinate\n    δ 1 = ClosestPair(points with x\
  \ < m)\n    δ 2 = ClosestPair(points with x > m)\n    δ  = min(δ 1, δ 2)\n    δ\
  \ 3 = process points with m −δ < x < m + δ\n    return min(δ, δ 3)\n```\n\n首先通过按\
  \ X 和 Y 坐标对点进行排序来预处理。使用两个独立的列表来保存这些排序后的点。\n\n在递归求解子问题之前，传递该子问题的排序后列表。\n\n# 第 19\
  \ 章：动态规划\n\n## 引言\n\n在使用分治法解决问题时，可能会出现递归求解子问题导致某些计算被重复执行的情况。当递归中反复出现相同的子问题时，就会产生这个问题。\n\
  \n动态规划用于避免重复计算相同子问题的需求。在这种方法中，我们通常将子问题的结果存储在某些数据结构（如表）中，并在再次计算之前引用它来查找我们之前是否已经计算过该子问题的解。\n\
  \n动态规划适用于具有以下属性的问题：\n\n1. **最优子结构**：由子问题的最优解构造出的最优解。\n2. **重叠子问题**：在计算子问题的最优解时，相同的计算被反复重复。\n\
  \n示例：\n\n*   通过迭代计算的斐波那契数。\n*   流水线调度\n*   矩阵链乘法\n*   0/1 背包问题\n*   最长公共子序列\n* \
  \  最优二叉树\n*   通过迭代实现的用于计算传递闭包的 Warshall 算法\n*   用于所有顶点对最短路径的 Floyd 算法\n*   最优多边形三角剖\n\
  *   Floyd-Warshall 算法\n\n求解/识别是否适用 DP 的步骤：\n\n1) 优性子结构：尝试寻找问题与子问题之间是否存在递归关系。\n2)\
  \ 写出问题的递归关系。（在此步骤中观察重叠子问题。）\n3) 以自底上的方式计算子问题的值，并将该值存储在某些表中。\n4) 根据步骤 3 中存储的值构造出最优解。\n\
  5) 重复步骤 3 和 4，直到得到你的解。\n\n## 动态规划算法问题\n\n### 斐波那契数\n\n```cpp\nint fibonacci(int\
  \ n) {\n    if (n <= 1)\n        return n;\n    return fibonacci(n - 1) + fibonacci(n\
  \ - 2);\n}\n```\n\n![](img/image01130.jpeg)\n\n使用分治法会导致相同的子问题被反复求解，这降低了算法的性能。该算法具有指数级的时间复杂度。\n\
  \n如果对子问题的结果进行排序，则可以在线性时间内解决相同的斐波那契问题。\n\n```cpp\nint fibonacci(int n) {\n    int\
  \ first = 0, second = 1;\n    int temp, i;\n    if (n == 0)\n        return first;\n\
  \    else if (n == 1)\n        return second;\n    for (i = 2; i <= n; i++) {\n\
  \        temp = first + second;\n        first = second;\n        second = temp;\n\
  \    }\n    return temp;\n}\n```\n\n使用该算法，我们获得了线性时间复杂度和常数空间复杂的斐波那契数。\n\n### 流水线调度\n\
  \n![](img/image01131.jpeg)\n\n我们考虑使用两条装配线的制造链构建汽车所需的最少时间，如图所示。问题变量：\n\n*   `e[i]`：进入装配线\
  \ `i` 的时间\n*   `x[i]`：离开装配线 `i` 的时间\n*   `a[i,j]`：在站点 `S[i,j]`（装配线 `i`，阶段 `j`）所需的时间\n\
  *   `t[i,j]`：从站点 `S[i,j]` 转移到另一条装配线所需的时间\n\n你的程序必须计算：\n*   构建汽车的最少时间\n*   为了尽快组装汽车需要遍历的站点列表。\n\
  \n制造链将不超过 50 个站点。如果我们想用暴力破解法解决这个问题，将会有总共组合 ![](img/image01084.jpeg)，因此时间复杂度将为 `O\
  \ ![](img/image01084.jpeg)。\n\n步骤 1：描述最优解的结构。为了计算最快装配时间，我们只需要知道到达 `S1n` 的快速时间和到达\
  \ `S2n` 的快速时间，包括第 n 个部分的装配时间。然后通过考虑所需的额外时间 `x1` 和 `x2` 在出口点之间进行选择。计算到达 `S1n` 的最快时间只需要到达\
  \ `S1n1` 和 `S2n1` 的快速时间。只有两个选择……\n\n步骤 2：待计算值的递归定义 ![](img/image01132.jpeg) ![](img/image01133.jpeg)\n\
  \n步骤 3：计算最快时间，计算 `f*`\n\n步骤 4：计算最快路径，计算 `li[j]` 作为 `fi[j]` 的选择（第一项或第二项给出最小值）。同时计算\
  \ `f*` 的选择。\n\n```text\nFASTEST-WAY(a, t, e, x, n)\nf1[1] ← e1 + a1,1\nf2[1] ← e2\
  \ + a2,1\nfor j ← 2 to n\n    do if f1[j-1] + a1,j] ≤ f2[j-1] + t2,j-1] + a1,j\n\
  \        then f1[j] ← f1[j-1] + a1, j\n             l1[j] ← 1\n        else \n \
  \           f1[j] ← f2[j-1] + t2,j-1] + a1,j\n             l1[j] ← 2\n    \n   \
  \ if f2[j-1] + a2,j] ≤ f1[j-1] + t1,j-1] + a2,j\n        then f2[j] ← f2[j-1] +\
  \ a2,j\n             l2[j] ← 1\n        else \n            f2[j] ← f1[j-1] + t1,j-1]\
  \ + a2,j\n             l2[j] ← 2\n\nif f1[n] + x1 ≤ f2[n] + x2\n    then f* = f1[n]\
  \ + x1\n    else f* = f2[n] + x2\n```\n\n### 矩阵链乘法\n\n相同的问题也称为矩阵排序问题或最优括号化。\n\n\
  给定一系列矩阵 `M1, M2,...,Mn`。该问题的目标是找到这些矩阵的最有效方法。目标不是执行实际乘法，而是决定乘法的顺序，使得运算最少。\n\n为了计算维度为\
  \ `pq` 和 `qr` 的两个矩阵，需要 `pqr` 次操作。矩阵乘法具有结合律。因此矩阵乘法有许多方式进行。\n\n例如，`M1, M2, M3` 和 `M4`\
  \ 可以完全括号化为：\n\n*   `( M1· (M2· (M3·M4)))`\n*   `( M1· ((M2·M3)· M4))`\n*   `(( M1·M2)·\
  \ (M3·M4))`\n*   `((( M1·M2)· M3)· M4)`\n*   `(( M1· (M2·M3))· M4)`\n\n例如，\n\n假设\
  \ `M1` 的维度为 `10 × 100`，`M2` 的维度为 `100 × 10`，而 `M3` 的维度为 `10 × 50`。\n\n`((M1·M2)·\
  \ M3) = (10*100*10) + (10*10*50) = 15000`\n\n`(M1· (M2·M3) = (100*10*50) + (10*100*50)\
  \ = 100000`\n\n\n\n\n暴力法方法存在局限性。以 $M1, M2, \\dots, Mn$ 为例。当你计算出 $((M1\\cdot M2)\
  \ \\cdot M3)$ 优于 $(M1\\cdot (M2\\cdot M3))$ 时，没有必要再去计算 $(M1\\cdot (M2\\cdot M3))$\
  \ 与 $(M4, M5…. Mn)$ 的组合。\n\n### 最优子结构\n\n假设 $M(1, N)$ 是产生 $M1, \\dots, Mn$ 的最优成本。\n\
  \n使用数组 `p []` 记录矩阵的维度。\n- `p[0]` = $M1$ 的行数\n- `p[i]` = $Mi$ 的列数，$1\\le i\\le N$\n\
  \n对于某个 $k$：\n$M(1,N) = M(1,K) + M(K+1,N) + p0\\cdot pk\\cdot pn$\n\n如果 $M (1, N)$\
  \ 是最小的，那么 $M (1, K)$ 和 $M (K+1, N)$ 也都是的。\n否则，如果存在某个 $M’(1, K)$，其成本小于 $M (1.. K)$，那么\
  \ $M (1.. N)$ 就不可能是最小的，且存在更优解。\n\n对于对于用的 $i$ 和 $j$：\n$M(i,j) = M(i,K) + M(K+1,j)\
  \ + pi-1\\cdot pk\\cdot pj$\n\n#### 递归关系\n$M(i,j) = \\text{Images/image01134.jpeg}$\n\
