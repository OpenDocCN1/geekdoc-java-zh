  如果我们可以通过一次只改变一个字符（不添加/删除）从起始字符串到达结束字符串，则路径存在。限制条件是更改一个字符后生成的新字符串必须在集合中。\nstart:\
  \ \"cog\"\nend: \"bad\"\nset: [\"bag\", \"cag\", \"cat\", \"fag\", \"con\", \"rat\"\
  , \"sat\", \"fog\"]\n路径之一: \"cog\" -> \"fog\" -> \"fag\" -> \"bag\" -> \"bad\"\n\
  \n# 第 14 章：字符串算法\n\n## 引言\n\n在 JAVA 编程中，字符串是字符的序列。String 在 JAVA 中被极广泛使用，以至于它们有自己的类，该类包含了许多创建和操作字符串的方法。String\
  \ 是一个对象，如果没有被初始化，它将指向 `null`。我们可以使用字符串字面量（两个双引号内的文本）来初始化字符串。也可以使用 String 类提供的许多构造函数之一来初始化字符串。\n\
  \n在本章中，我们将查看 String 类中经常使用且在本章中使用的构造函数和方法的实现。\n\n如果字符串只是被声明而没有初始化，它将指向 `null`。就像\
  \ JAVA 中的任何其他对象变量一样。\n\n```java\nString text;\n```\n\n创建 String 最简单的方法是使用双引号下的字符串字面量。\n\
  \n```java\nString text = \"Hello, World!\";\n```\n\n另一种创建 String 的重要方法是使用字符数组作为参数的\
  \ String 构造函数。\n```java\nchar[] arr = {'H','e','l','l','o','W','o','r','d','!'};\n\
  String hello = new String(arr);\n```\n\n`length()` 用于查找字符串的长度。\n```java\nhello.length();\n\
  ```\n\n字符串的拼接是通过 String 提供的 `concat()` 函数或使用 `+` 运算符完成的。\n```java\nString first\
  \ = \"Hello, \";\nString second = \"World!\";\nString helloworld = first + second;\n\
  ```\n下面的代码片段也这样做：\n```java\nString helloworld = first.concat(second);\n```\n\n字符串中特定索引的字符可以通过调用\
  \ `charAt()` 方法提取。下面的代码将输出 W’。\n```java\nString text = \"Hello, World!\";\nSystem.out.println(text.charAt(7));\n\
  ```\n\n很多时候我们需要逐字符处理整个字符串并想要修改/交换等。因此字符串可以转换为字符数组。`toCharArray()` 方法返回对象的字符数组。\n\
  ```java\nString text = \"Hello, World!\";\nchar[] array = text.toCharArray();\n\
  ```\n\n记住字符串是一个对象，如果我们调用 `==` 来比较两个字符串，它将比较字符串的内存位置，如果两个字符串对象指向相同的内存位置，则会失败。但许多我们需要比较内容是否相同，因此字符串类提供了\
  \ `equals()` 方法，它将比较给定字符串的内容与调用 `equals()` 方法的字符串的内容是否相同。\n\n`equals()` 方法是大小敏感的，它会区分大写和小写字母。下面的代码在比较\
  \ str1 和 str2 时给出 true。但同时在比较 str1 和 str3 时会返回 false。\n```java\nString str1 = \"\
  hello\";\nString str2 = \"hello\";\nString str3 = \"Hello\";\nSystem.out.println(\"\
  str1 equals str2 :\" + str1.equals(str2));\nSystem.out.println(\"str1 equals str3\
  \ :\" + str1.equals(str3));\n```\n**输出**:\nstr1 equals str2 :true\nstr1 equals str3\
  \ :false\n\n另一个方法 `equalsIgnoreCase()` 忽略大小写。\n```java\nString str1 = \"hello\"\
  ;\nString str2 = \"Hello\";\nSystem.out.println(\"str1 equals str2 :\" + str1.equalsIgnoreCase(str2));\n\
  ```\n**输出**:\nstr1 equals str2 :true\n\n## 字符串匹配\n\n\n\n\n每个文字处理程序都带有搜索功能，你可以在长文本文件中搜索特定单词的所有出现处。为了实现这一点，我们需要字符串匹配算法。\n\
  \n### 暴力搜索 (Brute Force Search)\n\n我们有一个要在文中搜索的模式。模式的长度为 `m`，文本的长度为 `n`。其中 `m <\
  \ n`。\n\n暴力搜索算法将检查文本中所有可能的 `i` 值，`i` 的值范围从 `0` 到 `n-m`。模式从左到右逐字符与文本进行比较。当检测到不匹配时，将比较窗口向移动一个字符并再次比较。\n\
  \n#### 示例 14.1:\n\n```\nint BruteForceSearch(String text, String pattern){\n   \
  \ return BruteForceSearch(text.toCharArray(), pattern.toCharArray());\n}\n\nint\
  \ BruteForceSearch(char[] text, char[] pattern)\n{\n    int i=0, j=0;\n    final\
  \ int n = text.length;\n    final int m = pattern.length;\n    while (i<=n-m)\n\
  \    {\n        j=0;\n        while (j<m && pattern [j]== text [i+j])\n        \
  \    j++;\n        if (j==m)\n            return(i);\n        i++;\n    }\n    return\
  \ -1;\n}\n```\n\n该算法的最坏情况时间复杂度为 `O(m*n)`，即我们在文本末尾找到了模式，或者根本没有找到模式。\n\n该算法的最优情况时间复杂度为\
  \ `O(m)`。\n\n该算法的平均时间复杂度为 `O(n)`。\n\n### Robin-Karp 算法\n\nRobin-Karp 算法与暴力算法有些相似。因为它也对每个文本块进行比较。它不是在每个位置比较模式，而是比较哈希值（hash\
  \ code），仅进行此类比较。模式的哈希值与文本的哈希值进行比较。我们尝试保持哈希值尽可能唯一。\n\n一个良好的哈希值的特征是：\n- 尽可能排除冲突。\n\
  - 文本的哈希值必须在常数时间内计算。\n- 当哈希值匹配但模式不匹配时发生冲突。\n- 在常数时间内进入窗口。\n- 乘以 `m-1` 次是为了存储它。\n\
  - 使用质数进行取模运算。\n\n#### 示例 14.2:\n\n```\nint Karp(String text, String pattern) {\n\
  \    return Karp(text.toCharArray(), pattern.toCharArray());\n}\n\nint Karp(char[]\
  \ text, char[] pattern) {\n    int n=text.length;\n    int m=pattern.length;\n \
  \   int i, j;\n    int prime = 0;\n    int powm=1;\n    int TextHash=0, PatternHash=0;\n\
  \    if(m==0 || m>n)\n        return -1;\n    for (i = 0; i < m-1; i++)\n      \
  \  powm = (powm << 1) % prime;\n    for (i = 0; i < m; i++)\n    {\n        PatternHash\
  \ = ((PatternHash << 1) + pattern[i]) % prime;\n        TextHash = ((TextHash <<\
  \ 1) + text[i]) % prime;\n    }\n    for (i=0;i<=(n-m);i++)\n    {\n        if(TextHash\
  \ == PatternHash)\n        {\n            for (j = 0; j < m; j++)\n            {\n\
  \                if (text[i+j] != pattern[j])\n                    break;\n    \
  \        }\n            if (j == m)\n                return i;\n        }\n    \
  \    TextHash = (((TextHash-text[i]*powm)<<1)+text[i+m])%prime;\n        if (TextHash\
  \ < 0)\n            TextHash + prime;\n    }\n    return -1;\n}\n```\n\n### Knuth-Morris-Pratt\
  \ 算法\n\n暴力搜索在移动后丢失了所有之前匹配符号的信息。其最坏情况时间复杂度为 `O(mn)`。Knuth-Morris-Pratt 算法利用了之前比较中计算的信息。它不需要比较整个文本。它对模式进行预处理。预处理需要\
  \ `O(m)` 时间，整个算法为 `O(n)`。\n\n预处理步骤：我们在模式的不同前缀寻找模式的边界（border）。\n- 前缀（prefix）是字符串开头的字符串。\n\
  - 真前缀（proper prefix）不是完整的字符串本身，其长度小于字符串长度。\n- 后缀（suffix）是字符串结尾的字符串。\n- 真后缀（proper\
  \ suffix）不是完整的字符串本身，其长度小于字符串长度。\n- 边界（border）既是真前缀也是真后缀的字符串。\n\n#### 示例 14.3:\n\n\
  ```\nvoid KMPprocess(char[] pattern, int[] ShiftArr) {\n    final int m = pattern.length;\n\
  \    int i = 0, j = -1;\n    ShiftArr[i] = -1;\n    while(i < m) {\n        while(j\
  \ >= 0 && pattern[i] != pattern[j])\n            j = ShiftArr[j];\n        i++;\n\
  \        j++;\n        ShiftArr[i] = j;\n    }\n}\n```\n\n我们需要对文本使用外层循环，对模式使用内层循环。当我们匹配文本遇到不匹配时，我们移动文本以考虑最宽边界，然后在继续继续模式。如果再次发生不匹配，则处理下一个不匹配。\n\
  \n#### 示例 14.4:\n\n```\nint KMP(String text, String pattern){\n    return KMP(text.toCharArray(),\
  \ pattern.toCharArray());\n}\n\nint KMP(char[] text, char[] pattern)\n{\n    int\
  \ i=0, j=0;\n    final int n = text.length;\n    final int m = pattern.length;\n\
  \    int[] ShiftArr = new int[m+1];\n    KMPprocess(pattern,ShiftArr);\n    while\
  \ (i<n)\n    {\n        while (j>=0 && text[i]!=pattern[j])\n            j=ShiftArr[j];\n\
  \        i++;\n        j++;\n        if (j==m)\n        {\n            return (i\
  \ - m);\n        }\n    }\n    return -1;\n}\n```\n\n#### 示例 14.5: 使用相同的 KMP 算法查找模式在文本中的出现次数。\n\
  \n```\nint KMPCount(char[] text, char[] pattern) {\n    int i=0, j=0, count = 0;\n\
  \    final int n = text.length;\n    final int m = pattern.length;\n    int[] ShiftArr\
  \ = new int[m+1];\n    KMPprocess(pattern,ShiftArr);\n    while (i<n)\n    {\n \
  \       while (j>=0 && text[i]!=pattern[j])\n            j=ShiftArr[j];\n      \
  \  i++;\n        j++;\n        if (j==m)\n        {\n            count++;\n    \
  \        j=ShiftArr[j];\n        }\n    }\n    return count;\n}\n```\n\n## 字典 /\
  \ 符号表 (Dictionary / Symbol Table)\n\n符号表是字符串与值之间的映射。值可以是整数，例如出现次数、单词的字典含义等。\n\n\
  ### 用于字符串的二叉搜索树 (BST)\n\n二叉搜索树 (BST) 是实现符号表最简单的方法。可以使用简单的 `strcmp()` 函数来比较两个字符串。如果所有的键都是随机的，并且树是平衡的。那么平均键查找可以在\
  \ `O(logn)` 时间内完成。\n\n\n\n\n\n![](img/image01069.jpeg)\n\n以下是一个使用字符串作为键的二叉搜索树的实现。这将用于统计文本中单词出现的次数。\n\
  \n### 示例 14.6\n\n```java\npublic class StringTree {\n    class Node{\n        String\
