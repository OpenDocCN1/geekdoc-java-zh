  \            return frequency(curr.lChild,value);\n        else\n            return\
  \ frequency(curr.rChild,value);\n    }\n}\n\nvoid freeTree() {\n    root =null;\n\
  }\n\npublic static void main(String[] args) {\n    StringTree tt = new StringTree();\n\
