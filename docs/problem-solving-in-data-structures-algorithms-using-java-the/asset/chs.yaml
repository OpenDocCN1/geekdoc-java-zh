  - 返回值为负数表示第一个字符串小于第二个字符串。\n- 返回值为正表示第一个字符串大于第二个字符串。\n\n示例 14.19:\n```java\nint myStmp(String\
  \ a, String b) {\n    int index =0;\n    int len1 = a.length();\n    int len2 =\
  \ b.length();\n    int minlen = len1;\n    if(len1 > len2)\n        minlen=len2;\n\
  \    while(index < minlen && a.charAt(index) == b.charAt(index)) {\n        index++;\n\
  \    }\n    if (index == len1 && index == len2)\n        return 0;\n    else if(len1\
