  \  //其他方法。\n}\n\npublic void StackPush1(int value) {\n    if (top1 < top2 - 1) {\n\
  \        data[++top1] = value;\n    } else {\n        System.out.print(\"栈已满!\"\
  );\n    }\n}\n\npublic void StackPush2(int value) {\n    if (top1 < top2 - 1) {\n\
  \        data[--top2] = value;\n    } else {\n        System.out.print(\"栈已满!\"\
  );\n    }\n}\n\npublic int Stack1() {\n    if (top1 >= 0) {\n        int value =\
  \ data[top1--];\n        return value;\n    } else {\n        System.out.print(\"\
  栈空!\");\n        return -999;\n    }\n}\n\npublic int StackPop2() {\n    if (top2\
  \ < MAX_SIZE) {\n        int value = data[top2++];\n        return value;\n    }\
  \ else {\n        System.out.print(\"栈空!\");\n        return -999;\n    }\n}\n\n\
  public static void main(String[] args) {\n    TwoStack st = new TwoStack();\n  \
  \  for (int i = 0; i < 10; i++) st.StackPush1(i);\n    for (int j = 0; j < 10; j++)\
  \ st.StackPush2(j + 10);\n    for (int i = 0; i < 10; i++) {\n        System.out.println(\"\
  栈一弹出的值是： \" + st.Stack1());\n        System.out.println(\"栈二弹出的值是： \" + st.StackPop2());\n\
