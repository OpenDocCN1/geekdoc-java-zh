  \ (end < start)\n        return -1;\n    mid = (start + end) / 2;\n    if (1 ==\
  \ arr[mid] && 0 == arr[mid - 1])\n        return mid;\n    if (0 == arr[mid])\n\
  \    {\n        return BinarySearch01(arr, mid + 1, end);\n    }\n    else\n   \
  \ {\n        return BinarySearch01(arr, start, mid - 1);\n    }\n}\n```\n\n### 在有序数组中搜索\n\
  \n给定一个包含 `n` 个整数的有序数组 `s`。该数组 `s` 被旋转了任意次数。在数组中找到一个元素。\n\n*第一种方法*：由于数组是有序的，我们可以使用改进后的二分查找来找到该元素。\n\
  \n算法的时间复杂度是 ![](img/image00910.jpeg)空间复杂度是 ![](img/image00891.jpeg)\n\n### 示例 5.31\n\
  \n```java\nint BinarySearchRotateArray(int[] arr, int start, int end, int key)\n\
  {\n    int mid;\n    if (end < start)\n        return -1;\n    mid = (start + end)\
  \ / 2;\n    if (key == arr[mid])\n        return mid;\n    if (arr[mid] > arr[start])\n\
  \    {\n        if (arr[start] <= key && key < arr[mid])\n        {\n          \
  \  return BinarySearchRotateArray(arr, start, mid - 1, key);\n        }\n      \
  \  else\n        {\n            return BinarySearchRotateArray(arr, mid + 1, end,\
  \ key);\n        }\n    }\n    else\n    {\n        if (arr[mid] < key && key <=\
  \ arr[end])\n        {\n            return BinarySearchRotateArray(arr, mid + 1,\
  \ end, key);\n        }\n        else\n        {\n            return BinarySearchRotateArray(arr,\
  \ start, mid - 1, key);\n        }\n    }\n}\n\nint BinarySearchRotateArrayWrapper(int[]\
  \ arr, int size, int key)\n{\n    return BinarySearchRotateArray(arr, 0, size -\
  \ 1, key);\n}\n```\n\n### 数组中的首次元素\n\n给定一个包含 `n` 个元素的无序数组，找到重复的元素。\n\n*第一种方法*：穷举搜索（Brute\
  \ force），对于数组中的每个元素查找是否存在另一个相同的值。这是通过两个循环完成的，第一个循环选择元素，第二个循环查找其重复。\n\n时间复杂度为 ![](img/image0906.jpeg)空间复杂度为\
  \ ![](img/image0891.jpeg)\n\n### 示例 5.32\n\n```java\nint FirstRepeated(int[] arr,\
  \ int size)\n{\n    int i, j;\n    for (i = 0; i < size; i++)\n        for (j =\
  \ i + 1; j < size; j++)\n            if (arr[i] == arr[j])\n                return\
  \ arr[i];\n    return 0;\n}\n```\n\n*第二种方法*：哈希表（Hash-Table），使用哈希表我们可以跟踪元素在数组中出现的次数。第一次扫描只需填充哈希表。第二次扫描只需查看元素的出现次数。如果元素出现超过一次，时间复杂度为\
  \ ![](img/image0087.jpeg)，空间复杂度为 ![](img/image0084.jpeg)用于维护哈希。\n\n### 数组转换\n\n\
  你将如何交换类似 `[a1 a2 a3 a4 b1 b2 b4]` 的数组元素，将其转换为 `[a1 b1 a2 b2 a3 b3 a4]`？\n\n方法：\n\
  \n- 首先交换中间对\n- 接下来交换中间的两对\n- 接下来交换中间的三对\n- 迭代 `n-1` 步。例如当 `n = 4` 时。\n\n### 示例 5.33\n\
  \n```java\nvoid transformArrayAB(int[] arr, int size)\n{\n    int N = size/2, i,\
  \ j;\n    for (i = 1; i < N; i++) {\n        for (j = 0; j < i; j++) {\n       \
  \     swap(arr, N-i+2*j, N-i+2*j+1);\n        }\n    }\n}\n\nvoid swap(int[] arr,\
  \ int i, int j) {\n    int temp = arr[i];\n    arr[i] = arr[j];\n    arr[j] = temp;\n\
  }\n```\n\n### 用最少比较找到数组中的第二大数\n\n假设你给出一个包含 `n` 个不同元素的无序数组。你将如何以最少的比较次数识别第二大元素？\n\
  \n*第一种方法*：找到数组中的最大元素。然后用最大元素替换最后一个元素。然后在剩余的 n-1 个元素中搜索第二大元素。\n\n总比较次数为：`(n-1) +\
  \ (n-2)`\n\n*第二种方法*：对数组排序，然后给出 `(n-1)` 元素。这种方法仍然更低效。\n\n\n\n\n\n*第三种方法*：使用优先级队列\
  \ / 堆。我们将在堆章节中介绍这种方法。使用 `buildHeap()` 函数从数组构建堆。这通过 n 次比较完成。`Arr[0]` 是最大的数，而 `arr[1]`\
  \ 和 `arr[2]` 中较大的那个是次大数。\n\n总比较次数为：`(n-1) + 1 = n`\n\n### 检查两个数组是否为互排列\n\n给定两个整数数组。你需要检查它们是否为互排列。\n\
  \n*第一种方法*：排序。对两个数组的所有元素进行排序，并从头到尾比较两个数组的每个元素。如果没有差异，返回 true。否则返回 false。\n\n排序算法消耗\
  \ ![](img/image00911.jpeg)时间，比较消耗 ![](img/image00887.jpeg) 时间。\n\n算法的*时间复杂度*为 ![](img/image00898.jpeg)，*空间复杂度*为\
  \ ![](img/image00891.jpeg)。\n\n### 示例 5.34\n\n```java\nboolean checkPermutation(int[]\
  \ array1, int size1, int[] array2, int size2){\n    if (size1 != size2)\n      \
  \  return false;\n    Arrays.sort(array1); // Sort(array1, size1);\n    Arrays.sort(array2);\
  \ // Sort(array2, size2);\n    for (int i = 0; i < size1; i++) {\n        if (array1[i]\
  \ != array2[i])\n            return false;\n    }\n    return true;\n}\n```\n\n\
  *第二种方法*：哈希表（假设：没有重复元素）。\n\n1. 为第一个数组的所有元素创建一个哈希表。\n2. 从头到尾遍历另一个数组，并在哈希表中查找每个元素。\n\
  3. 如果所有元素都在哈希表中被找到，则返回 true，否则返回 false。\n\n哈希表的插入和查找需要常数时间![](img/image00886.jpeg)，因此算法的总*时间复杂度*为\
  \ ![](img/image00887.jpeg) 时间。*空间复杂度*为 ![](img/image00884.jpeg)。\n\n*时间复杂度* = `O(n)`（用于创建哈希表和查找），*空间复杂度*\
  \ = `O(n)`（用于创建哈希表）。\n\n**示例 5.35**\n\n```java\nboolean checkPermutation2(int[]\
  \ array1, int size1, int[] array2, int size2) {\n    int i;\n    if (size1 != size2)\n\
  \        return false;\n    ArrayList<Integer> al = new ArrayList<Integer>();\n\
  \    for (i = 0; i < size1; i++)\n        al.add(array1[i]);\n    for (i = 0; i\
  \ < size2; i++) {\n        if (al.contains(array2[i]) == false)\n            return\
  \ false;\n        al.remove(array2[i]);\n    }\n    return true;\n}\n```\n\n###\
  \ 移除整数数组中的重复元素\n\n第一种方法：排序，步骤如下：\n1. 排序数组。\n2. 使用两个引用。创建一个从 0 到第一个引用的包含唯一元素的子数组（第一个引用指向子数组的最后一个索引）。第二个引用从\
  \ 1 直到结尾遍历数组。唯一的数字将从第二个引用复制到第一个引用。\n\n*时间复杂度*计算：排序数组的时间 = `O(nlogn)`。移除的时间 = `O(n)`。整体*时间复杂度*\
  \ = `O(nlogn)`。不需要额外空间，因此*空间复杂度*为 `O(1)`。\n\n**示例 5.36**\n\n```java\nint removeDuplicates(int[]\
  \ array, int size) {\n    int j = 0;\n    int i;\n    if (size == 0)\n        return\
  \ 0;\n    Arrays.sort(array); // Sort(array,size);\n    for (i = 1; i < size; i++)\
  \ {\n        if (array[i] != array[j]) {\n            j++;\n            array[j]\
  \ = array[i];\n        }\n    }\n    return j + 1;\n}\n```\n\n### 在二维排序数组中搜索元素\n\
  \n给定一个二维数组。每行和每列都按升序排列。你如何在其中找到一个元素？\n\n算法原理如下：\n1. 从最后列和第一行的元素开始。\n2. 如果该元素是我们要找的值，返回\
  \ true。\n3. 如果该元素大于我们要找的值，移动到前一列但同一行的元素。\n4. 如果该元素小于我们要找的值，移动到下一行但同一列的元素。\n5. 如果到达第一列最后一行的元素后仍未找到元素，则返回\
  \ false。条件 `(row < r && column >= 0)` 为假。\n\n运行时间 = `O(N)`。\n\n### 示例 5.37\n\n```java\n\
  int FindElementIn2DArray(int[] arr[], int r, int c, int value) {\n    int row =\
  \ 0;\n    int column = c - 1;\n    while (row < r && column >= 0){\n        if (arr[row][column]\
  \ == value)\n            return 1;\n        else if (arr[row][column] > value)\n\
  \            column--;\n    }\n}\n```\n\n## 练习\n\n1. 给定数组，找到重复元素。以下方法哪些有效？哪些不有效？\n\
  - 暴力穷举搜索。\n- 使用哈希表记录元素的索引。\n- 排序。\n- 如果我们知道输入范围，可以使用计数。\n\n2. 给定包含 n 个元素的数组，找到三个和等于给定值的元素。尝试使用暴力法完成。然后尝试应用排序法。\n\
  \n3. 给定一个包含负数和正数的数组，编写一个程序将负数与正数分开。\n\n4. 给定一个包含 1 和 0 的数组，编写一个程序将 0 和 1 分开。\n\n\
  5. 给定一个包含 0、1 和 2 的数组，编写一个程序将 0、1 和 2 分开。\n\n6. 给定一个单调递增且包含正负数的数组。编写一个算法找到列表变为正数的点。\n\
  \n7. 给定一个排序数组，查找给定的数字。如果找到，返回索引；如果未找到，找到该数字插入数组后的索引。\n\n8. 找到旋转数组中的最大值。\n\n9. 找到旋转数组中的最小值。\n\
  \n**10.** 找到两个排序数组并集中的第 k 小元素。\n\n\n\n\n\n还有其他算法可以处理无法完全存储在内存中的海大数据集，为此开发了外部排序技术。\n\
  \n在我们开始逐一讨论各种算法之前，首先我们应该查看用于比较两个值的比较函数。\n\n`Less function` 如果 `value1` 小于 `value2`，则返回\
  \ 1，否则它返回 0。\n\n```java\nprivate boolean less(int value1, int value2)\n{\n    return\
  \ value1 < value2;\n}\n```\n\n`More function` 如果 `value1` 大于 `value2`，则返回 1，否则它返回\
  \ 0。\n\n```java\nprivate boolean more(int value1, int value2)\n{\n    return value1\
  \ > value2;\n}\n```\n\n在各种排序算法中的值通过使用上述函数之一进行比较，并根据这些函数的返回值进行交换。如果使用 `more()` 比较函数，则排序后的输出将是升序的；如果使用\
  \ `less()`，则结果的输出将是降序排列。\n\n## 排序类型\n\n### 内部排序\n所有元素都可以同时读入内存，并在内存中进行排序。\n\n1.\
  \ `Selection-Sort`（选择排序）\n2. `Insertion-Sort`（插入排序）\n3. `Bubble-Sort`（泡沫排序）\n4.\
  \ `Quick-Sort`（快速排序）\n\n### 外部排序\n在这种情况下，数据集非常大，无法将整个数据集加载到内存中，因此分块进行排序。\n\n1. `Merge-Sort`（合并排序）\n\
  \n在选择应用排序算法时需要考虑的三个因素：\n\n1. 列表中元素的数量\n2. 所需的列表不同顺序数量\n3. 移动数据或不移动数据所需的时间\n\n###\
  \ 泡沫排序\n\n`Bubble-Sort` 是排序中最慢的算法，但因为它容易实现而被广泛使用。\n\n在 `Bubble-Sort` 中，我们比较每一对相邻的值。我们希望按升序排列值，因此如果第二个值小于第一个值，我们就交换这两个值。否则，我们将移动到下一对。\n\
  \n因此，较小的值会“浮”到数组的开头。\n\n我们需要 N 轮传递来完全排序数组。\n\n第一轮传递之后，最大值将位于最右侧的位置。\n\n![](img/image00913.jpeg)\n\
  \n**示例 6.1**\n\n```java\npublic class BubbleSort {\n    private int[] arr;\n   \
  \ public BubbleSort(int[] array)\n    {\n        arr = array;\n    }\n    private\
  \ boolean less(int value1, int value2)\n    {\n        return value1 < value2;\n\
  \    }\n    private boolean more(int value1, int value2)\n    {\n        return\
  \ value1 > value2;\n    }\n    public void sort()\n    {\n        int size = arr.length;\n\
  \        int i, j, temp;\n        for (i = 0 ; i < ( size - 1 ); i++)\n        {\n\
  \            for (j = 0 ; j < size - i - 1; j++)\n            {\n              \
  \  if (more(arr[j], arr[j+1]))\n                {\n                    /* Swapping\
  \ */\n                    temp = arr[j];\n                    arr[j] = arr[j+1];\n\
  \                    arr[j+1] = temp;\n                }\n            }\n      \
  \  }\n    }\n}\n```\n\n**分析：**\n\n- 外层 `for` 循环表示为了比较数据而进行的交换次数。\n- 内层循环实际上用于对数据进行比较。在每次内层循环结束时，最大值会被移动到数组的末尾。第一次迭代中是最大值，第二次迭代中是第二大值，依此类推。\n\
  - 使用 `more()` 函数进行比较，这意味着当第一个参数的值大于第二个参数的值时，执行交换。通过这种方式，我们是在按升序排序；如果我们我们用 `less()`\
  \ 函数代替 `more()`，则会得到降序排序。\n\n如果你忘记了，请查看 `more()` 函数\n\n```java\nprivate boolean\
  \ more(int value1, int value2)\n{\n    return value1 > value2;\n}\n```\n\n**复杂度分析：**\n\
  每次内层循环执行次数 (n-1), (n-2), (n-3)…\n`(n-1) + (n-2) + (n-3) + ..... + 3 + 2 + 1 = n(n-1)/2`\n\
  \n| 最坏情况性能 | O![](img/image00914.jpeg)) |\n| :--- | :--- |\n| 平均情况性能 | O![](img/image00915.jpeg))\
  \ |\n| 空间复杂度 | O(1) 因为我们只需要一个临时变量 |\n| 稳定排序 | 是 |\n\n## 修改（改进）的泡沫排序\n\n当外层循环的某一次传递不再有交换时，这表明所有元素已经就绪，因此我们应该停止排序。这种\
  \ `Bubble-Sort` 的排序改进在我们知道数组除了少数元素外其余部分已经排好序时非常有用。\n\n**示例 6.2**\n\n```java\npublic\
  \ void sort()\n{\n    int size = arr.length;\n    int i, j, swapped=1;\n    for\
  \ (i = 0; i < (size - 1) && swapped == 1; i++)\n    {\n        swapped = 0;\n  \
  \      for (j = 0; j < size - i - 1; j++)\n        {\n            if (more(arr[j],\
  \ arr[j + 1]))\n            {\n                /* Swapping */\n                temp\
  \ = arr[j];\n                arr[j] = arr[j+1];\n                arr[j+1] = temp;\n\
  \            }\n        }\n    }\n}\n```\n\n通过应用此改进，当数组接近有序时，该算法的最佳情况得到了改进。\n最佳情况为\
  \ `O(n)`。\n\n**复杂度分析：**\n\n| 最坏情况性能 | O![](img/image00915.jpeg)) |\n| :--- | :---\
  \ |\n| 平均情况性能 | O![](img/image00914.jpeg)) |\n| 空间复杂度 | O(1) |\n| 自适应：当数组接近有序时 |\
  \ O(n) |\n| 稳定排序 | 是 |\n\n## 插入排序\n\n`Insertion-Sort` 的 *时间复杂度* 为 `O(Images/image0015.jpeg)`，与\
  \ `Bubble-Sort` 相同但性能更好。这是我们整理扑牌的方式。我们保持一个有序子数组。每个值都被插入到其左侧有序子数组的正确位置。\n\n![](img/image0016.jpeg)\n\
  ![](img/image0017.jpeg)\n\n**示例 6.3**\n\n```java\npublic class InsertionSort {\n\
  \    private int[] arr;\n    public InsertionSort(int[] array) {\n        arr =\
  \ array;\n    }\n    private boolean more(int value1, int value2)\n    {\n     \
  \   return value1 > value2;\n    }\n    public void sort()\n    {\n        int size\
  \ = arr.length;\n        int temp,j;\n        for(int i=1; i<size; i++)\n      \
  \  {\n            temp=arr[i];\n            for(j=i; j>0 && more(arr[j-1], temp);\
  \ j--)\n            {\n                arr[j]=arr[j-1];\n            }\n       \
  \     arr[j]=temp;\n        }\n    }\n}\npublic class InsertionSortDemo\n{\n   \
  \ public static void main(String[] args)\n    {\n        int[] array = {9,1,8,2,7,3,6,5};\n\
  \        InsertionSort bs = new InsertionSort(array);\n        bs.sort();\n    \
  \    for(int i=0;i<array.length ;i++)\n        {\n            System.out.print(array[i]\
  \ + \" \");\n        }\n    }\n}\n```\n\n**分析：**\n\n- 外层循环用于选取我们想要插入到左有序数组中的值。\n\
  - 我们想要插入的值已经选取并保存在了一个临时变量中。\n\n\n\n\n\n- 内层循环使用 `more()` 函数进行比较。值不断向右移动，直到找到当前迭代中\
  \ `temp` 值的正确位置。\n- 最后，将该值放置在正确的位置。在外层循环的每次迭代中，排序数组的长度增加一。当我们退出外层循环时，整个数组就完成了排序。\n\
  \n### 复杂度分析\n\n| 最坏情况时间复杂度 | O(n²) |\n| :--- | :--- |\n| 最优情况时间复杂度 | O(n) |\n| 平均时间复杂度\
  \ | O(n²) |\n| 空间复杂度 | O(1) |\n| 稳定排序 | 是 |\n\n### 选择排序 (Selection-Sort)\n\n选择排序遍历整个未排序数组，并将最大值放在数组的末尾。该算法的时间复杂度相同，但由于所需的比较次数较少，性能优于冒泡排序和插入排序。在选择排序中，数组是从后往前创建的。\n\
  \n![](img/image00918.jpeg)\n\n#### 示例 6.4:\n\n```java\npublic class SelectionSort\
  \ {\n    private int[] arr;\n    public SelectionSort(int[] array) {\n        arr\
  \ = array;\n    }\n    //后向数组\n    public void sort() {\n        int size = arr.length;\n\
  \        int i, j, max, temp;\n        for (i = 0; i < size - 1; i++) {\n      \
  \      max = 0;\n            for (j = 1; j < size - 1 - i ; j++) {\n           \
  \     if (arr[j] > arr[max]) {\n                    max = j;\n                }\n\
  \            }\n            temp = arr[size - 1 - i];\n            arr[size - 1\
  \ - i] = arr[max];\n            arr[max] = temp;\n        }\n    }\n}\n```\n\n**分析：**\n\
  - 外层循环决定内层循环迭代的次数。对于 N 个元素的输入，内层循环将迭代 N 次。\n- 在内层循环的每次迭代中，计算最大值并将其放在数组末尾。\n- 这是将最大值替换到正确的位置。排序数组随之创建。\n\
  \n**复杂度分析：**\n\n| 最坏情况时间复杂度 | O(n²) |\n| :--- | :--- |\n| 最优情况时间复杂度 | O(n²) |\n\
  | 平均时间复杂度 | O(n²) |\n| 空间复杂度 | O(1) |\n| 稳定 | 否 |\n\n可以通过在数组前端创建排序数组来实现相同的算法。\n\n\
  #### 示例 6.5 前向变体：\n\n```java\nvoid sort2() {\n    int size = arr.length;\n    int\
  \ i, j, temp;\n    for (i = 0; i < size - 1; i++) {\n        min = i;\n        for\
  \ (j = i + 1; j < size; j++) {\n            if (arr[j] < arr[min]) {\n         \
  \       min = j;\n            }\n        }\n        temp = arr[i];\n        arr[i]\
  \ = arr[min];\n        arr[min] = temp;\n    }\n}\n```\n\n## 合并排序 (Merge-Sort)\n\
  \n![](img/image00919.jpeg)\n\n合并排序在每一步中递归地将输入分为两半。它递归地排序两个部分，最后将结果合并成最终的排序输出。\n\n\
  ### 示例 6.6\n\n```java\npublic class MergeSort {\n    private int[] arr;\n    private\
  \ void merge(int[] arr, int[] tempArray, int lowerIndex, int middleIndex, int upperIndex)\
  \ {\n        int lowerStart = lowerIndex;\n        int lowerStop = middleIndex;\n\
  \        int upperStart = middleIndex + 1;\n        int upperStop = upperIndex;\n\
  \        int count = lowerIndex;\n        while (lowerStart <= lowerStop && upperStart\
  \ <= upperStop) {\n            if (arr[lowerStart] < arr[upperStart]) {\n      \
  \          tempArray[count++] = arr[lowerStart++];\n            } else {\n     \
  \           tempArray[count++] = arr[upperStart++];\n            }\n        }\n\
  \        while (lowerStart <= lowerStop) {\n            tempArray[count++] = arr[lowerStart++];\n\
  \        }\n        while (upperStart <= upperStop) {\n            tempArray[count++]\
  \ = arr[upperStart++];\n        }\n        for (int i = lowerIndex; i <= upperIndex;\
  \ i++) {\n            arr[i] = tempArray[i];\n        }\n    }\n    private void\
  \ mergeSrt(int[] arr, int[] tempArray, int lowerIndex, int upperIndex) {\n     \
  \   if (lowerIndex >= upperIndex)\n            return;\n        int middleIndex\
  \ = (lowerIndex + upperIndex) / 2;\n        mergeSrt(arr, tempArray, lowerIndex,\
  \ middleIndex);\n        mergeSrt(arr, tempArray, middleIndex + 1, upperIndex);\n\
  \        merge(arr, tempArray, lowerIndex, upperIndex);\n    }\n    public void\
  \ sort() {\n        int size = arr.length;\n        int[] tempArray = new int[size];\n\
  \        mergeSrt(arr, tempArray, 0, size - 1);\n    }\n    public MergeSort(int[]\
  \ array) {\n        arr = array;\n    }\n}\n\npublic class MergeSortDemo {\n   \
  \ public static void main(String[] args) {\n        int[] array = {3, 4, 2, 6, 5,\
  \ 7, 8, 1};\n        MergeSort m = new MergeSort(array);\n        m.sort();\n  \
  \      for (int i = 0; i < array.length; i++) {\n            System.out.print(array[i]\
  \ + \" \");\n        }\n    }\n}\n```\n\n- 合并排序在所有情况下（最优、平均和最坏）的时间复杂度均为 `O(n log\
  \ n)`，因为它总是将数组分为两半，并花费线性时间合并这两个部分。\n- 它需要与未排序列表等量的额外空间。因此，不建议用于大型未排序列表。\n- 它是链表的最佳排序技术。\n\
  \n**复杂度分析：**\n\n| 最坏情况时间复杂度 | O(n log n) |\n| :--- | :--- |\n| 最优情况时间复杂度 | O(n log\
  \ n) |\n| 平均时间复杂度 | O(n log n) |\n| 空间复杂度 | O(n) |\n| 稳定 | 是 |\n\n## 快速排序 (Quick-Sort)\n\
  \n![](img/image00920.jpeg)\n![](img/image00921.jpeg)\n\n快速排序也是递归算法。\n- 在每一步中，我们选择一个基值（假设是数组的第一个元素）。\n\
  - 然后我们遍历数组剩余部分，并将所有小于基值的元素复制到数组的左侧。\n- 我们将所有大于基值的元素复制到数组的右侧。显然，基值处于其正确的排序位置。\n-\
  \ 然后我们分别对左右子数组进行排序。\n- 当算法返回时，整个数组就完成了排序。\n\n### 示例 6.7\n\n```java\npublic class\
  \ QuickSort {\n    private int[] arr;\n    public QuickSort(int[] array) {\n   \
  \     arr = array;\n    }\n    private void swap(int[] arr[], int first, int second)\
  \ {\n        int temp = arr[first];\n        arr[first] = arr[second];\n       \
  \ arr[second] = temp;\n    }\n    private void quickSortUtil(int[] arr[], int lower,\
  \ int upper) {\n        if (upper <= lower)\n            return;\n        int pivot\
  \ = arr[lower];\n        int start = lower;\n        int stop = upper;\n       \
  \ while (lower < upper) {\n        }\n    }\n}\n```\n\n\n\n\n```java\nwhile (arr[lower]\
  \ <= pivot && lower < upper)\n{\n    lower++;\n}\nwhile (arr[upper] > pivot && lower\
  \ <= upper)\n{\n    upper--;\n}\nif (lower < upper)\n{\n    swap(arr,upper,lower);\n\
  }\n```\n\nswap(arr, upper, start); // upper is the pivot position\n\nquickSortUtil\
  \ (arr, start, upper - 1); // pivot -1 is the upper for left sub array.\nquickSortUtil\
  \ (arr, upper + 1, stop); // pivot + 1 is the lower for right sub array.\n\npublic\
  \ void sort(){\n    int size = arr.length;\n    quickSortUtil (arr, 0, size - 1);\n\
  }\n\npublic class QuickSortDemo {\n    public static void main(String[] args) {\n\
  \        int[] array={3,4,2,1,6,5,7,8,1,1};\n        QuickSort m = new QuickSort(array);\n\
  \        m.sort();\n        for(int i=0;i<array.length ;i++) {\n            System.out.print(array[i]\
  \ + \" \");\n        }\n    }\n}\n```\n\n- 快速排序所需的空间非常少，只需要`O(logn)` 的额外空间。\n- 快速排序不是一种稳定算法，因此它在排序过程中可能会改变两个元素的出现顺序。\n\
  \n复杂度分析：\n| 最坏情况复杂度 | `O(n²)` |\n| 最优时间复杂度 | `O(logn)` |\n| 平均时间复杂度 | `O(logn)`\
  \ |\n| 空间复杂度 | `O(logn)` |\n| 稳定 | 否 |\n\n## 快速选择 (Quick Select)\n\n快速选择与快速排序非常相似，不同在于它不是排序整个数组，而在快速排序的每一步中忽略数组的一半，只关注我们感兴趣的数组区域。\n\
  \n示例 6：\n```java\nclass QuickSelect {\n    public static void swap(int arr[], int\
  \ first, int second){\n        int temp = arr[first];\n        arr[first] = arr[second];\n\
  \        arr[second] = temp;\n    }\n    public static void quickSelect(int arr[],\
  \ int lower, int upper, int k)\n    {\n        if (upper <= lower)\n           \
  \ return;\n        int pivot = arr[lower];\n        int start = lower;\n       \
  \ int stop = upper;\n        while (lower < upper)\n        {\n            while\
  \ (arr[lower] <= pivot && lower < upper)\n                lower++;\n           \
  \ while (arr[upper] > pivot && lower <= upper)\n                upper--;\n     \
  \       if (lower < upper)\n                swap(arr, upper, lower);\n        }\n\
  \        swap(arr, upper, start); //upper is the pivot position\n        if (k<upper)\n\
  \            quickSelect(arr, start, upper - 1, k); //pivot -1 is the upper for\
  \ left sub array.\n        if (k>upper)\n            quickSelect(arr, upper + 1,\
  \ stop, k); // pivot + 1 is the lower for right array.\n    }\n    public static\
  \ void quickSelect(int arr[], int k){\n        quickSelect(arr, 0, arr.length -\
  \ 1, k);\n    }\n}\n\nclass QuickSelectDemo {\n    public static void main(String[]\
  \ args) {\n        int[] array={3,4,2,1,6,5,7,8,0,9};\n        quickSelect(array,\
  \ 5);\n        System.out.print(\"value at index 5 is : \"+ array[4]);\n    }\n\
  }\n```\n\n复杂度分析：\n| 最坏情况复杂度 | `O(n²)` |\n| 最优时间复杂度 | `O(logn)` |\n| 平均时间复杂度 | `O(logn)`\
  \ |\n| 空间复杂度 | `O(logn)` |\n\n## 桶排序 (Bucket Sort)\n\n桶排序是最简单且高效的排序类型。排序对数据的预定义范围有严格要求，例如年龄组。我们知道人的年龄可以在\
  \ 1 到 30 之间之间（Images/image0922.jpeg）。\n\n示例 9：\n```java\nclass BucketSort {\n  \
  \  int[] array ;\n    int range;\n    int lowerRange;\n    public BucketSort (int[]\
  \ arr, int lowerRange, int upperRange){\n        array = arr;\n        range = upperRange\
  \ - lowerRange;\n        this.lowerRange = lowerRange;\n    }\n    public void sort()\n\
  \    {\n        int i, j;\n        int size = array.length;\n        int[] count\
  \ = new int[range];\n        for (i = 0; i < range; i++)\n        {\n          \
  \  count[i] = 0;\n        }\n        for (i = 0; i < size; i++)\n        {\n   \
  \         count[array[i] - lowerRange]++;\n        }\n        j = 0;\n        for\
  \ (i = 0; i < range; i++)\n        {\n            for (; count[i]>0; count[i]--)\n\
  \            {\n                array[j++] = i + lowerRange;\n            }\n  \
  \      }\n    }\n}\n\nclass BucketSortDemo {\n    public static void main(String[]\
  \ args) {\n        int[] array={3,4,2,1,6,5,7,8,1,1};\n        BucketSort m = new\
  \ BucketSort(array, 20, 30);\n        m.sort();\n    }\n}\n```\n\n\n\n\n当需要排序的数据量巨大时。此外，对于此类数据集，无法将其完全加载到内存（`RAM`）中，因此我们使用外部排序。特定的数据使用外部\
  \ `Merge-Sort` 算法进行排序。首先选取数据分块并在内存中进行排序。然后将这些排序后的数据写回磁盘。使用 `Merge-Sort` 对整个数据分块进行排序。现在，我们需要将这些排序后的块合并成最终的排序数据。\n\
  \n然后我们为数据创建队列，从这些排序后的块中读取数据。每个块都有它自己的队列。我们将从这些队列中弹出元素，这些队列负责从排序后的块中读取数据。假设我们有 `K`\
  \ 个长度为 `M` 的不同排序数据块。\n\n第三步是使用 `Min-Heap`，它将从每个队列中获取输入数据。它从每个队列中取一个元素。从 `Heap` 中取出最小值并添加到最终的排序元素输出中。然后，插入该最小元素的队列将再次弹出，并从该队列中取另一个元素添加到\
  \ `Heap` 中。最后，当某个队列的数据耗尽时，该队列将从输入列表中移除。最后，我们将得到从堆中输出的排序数据。\n\n我们可以通过添加输出缓冲区来进一步优化此过程，它将存储从\
  \ `Heap` 输出的数据，并在最终的 `Disk` 空间执行有限次数的写操作。\n\n![](img/image00924.jpeg)\n\n**注意**：面试中没有人会要求实现外部排序，但了解它是有好处的。\n\
  \n## 各种排序算法的比较。\n\n等等，标题是：各种排序算法的比较。\n\n| 排序 | 平均时间 | 最佳时间 | 最坏时间 | 空间复杂度 | 稳定性\
  \ |\n| :--- | :--- | :--- | :--- | :--- | :--- |\n| [泡排序](http://www.cprogramming.com/tutorial/computersciencetheory/sorting1.html)\
  \ | O(n²) | O(n²) | O(n²) | O(1) | 稳定 |\n| 修改后的[泡排序](http://www.cprogramming.com/tutorial/computersciencetheory/sorting1.html)\
  \ | O(n²) | O(n) | O(n²) | O(1) | 稳定 |\n| [选择排序](http://www.cprogramming.com/tutorial/computersciencetheory/sorting2.html)\
  \ | O(n²) | O(n²) | O(n²) | O(1) | 不稳定 |\n| [插入排序](http://www.cprogramming.com/tutorial/computersciencetheory/sorting2.html)\
  \ | O(n²) | O(n) | O(n²) | O(1) | 稳定 |\n| [堆排序](http://www.cprogramming.com/tutorial/computersciencetheory/heapsort.html)\
  \ | O(n*log(n)) | O(n*log(n)) | O(n*log(n)) | O(1) | 不稳定 |\n| [合并排序](http://www.cprogramming.com/tutorial/computersciencetheory/mergesort.html)\
  \ | O(n*log(n)) | O(n*log(n)) | O(n*log(n)) | O(n) | 稳定 |\n| [快速排序](http://www.cprogramming.com/tutorial/computersciencetheory/quicksort.html)\
  \ | O(n*log(n)) | O(n*log(n)) | O(n²) | O(n) 最坏情况 O(log(n)) 平均情况 | 不稳定 |\n| 桶排序\
  \ | O(n k) | O(n k) | O(n k) | O(n k) | 稳定 |\n\n## [最佳排序算法的选择](https://stackoverflow.com/questions/1933759/when-is-best-sorting-algorithm)\n\
  \n等待，标题是：最佳排序算法的选择。\n\n当数据已经是排序时。\n\n- **快速排序**：当平均性能优于最坏情况时。它是随机完美的。\n\n- **堆排序**：不需要稳定性。\n\
  \n ** **合并排序**：当不需要稳定性且更关心最坏情况时。其时间复杂度为 `O(logn)`，使用递归的栈空间。\n\n## 练习题\n\n1. **给定一个文本文件，打印单词及其频率。**\n\
  \   - **第一方法**：可以使用优先队列。\n   - **第二方法**：可以使用快速选择。\n   - **第三方法**：使用哈希表获取频率。\n\n\
  2. **给定 K 个有序流。你需要合并成一个输出流。输入流支持 `ReadNumber()` 操作，输出流支持 `WriteNumber()` 操作。**\n\
  \   - **a.** 从所有输入流读取第一个数字并将其加入 PQ。\n   - **b.** 从 PQ 中弹出一个元素，将该值放入输出流，从输入流读取另一个元素加入\
  \ PQ。\n   - **c.** 如果流为空，则继续。\n   - **d.** 重复直到 PQ 为空。\n\n3. **给定 K 个长度为 M 的数组。同时也给定一个长度为\
  \ M*K 的最终输出数组。给出一个高效算法合并所有数组，不使用任何额外空间。**\n   - 使用最终数组来创建 PQ。\n\n4. **如何排序 1 PB\
  \ 数字？1 PB = 1000 TB。**\n\n5. **上述解决方案的复杂度是多少？**\n\n6. **如果核心数为 8，对第 3 题有什么改进？**\n\
  \n7. **给定一个支持三个函数 findMin, findMax, findMedian 的整数数组。对该数组排序。**\n\n8. **给定一组高、中、低优先级的患者文件。对这些文件进行排序，使得高优先级在前面，然后是中优先级，最后是低优先级。**\n\
  \   - **提示**：桶排序。\n\n\n\n[content]\n\n# 15. 编写一个方法对字符串数组进行排序，使得所有的字母异位词都相邻。\n\n\
  ### 提示：\na. 遍历数组。\nb. 对于每个单词，对字符进行排序并将其添加到哈希表中，键（key）为排序后的单词，值（value）为原始单词。循环结束后，你将获得所有的字母异位词作为一个键的值（该键根据其组成字符排序）。\n\
  c. 遍历哈希表，一起打印一个键的所有值，然后移动到下一个键。\n\n*空间复杂度*: O(n), *时间复杂度*: O(n)\n\n# 第 7 章：链表 (Linked\
  \ List)\n\n## 引言\n假设我们有一个包含以下五个元素 1, 2, 4, 5, 6 的数组。我们想在“2”和“4”之间插入一个值为“3”的新元素。在数组中，我们无法轻松这样做。我们需要创建另一个足够长的数组来存储当前值，并为“3”\
  \ 留出一个额外的空间。然后我们需要将这些元素复制到新空间中。这种复制操作是低效的。为了消除这种固定长度限制限制使用了链表。\n\n## 链表\n链表是一个由节点（nodes）组成的列表。节点包含两个部分：值部分和链接部分。值部分用于存储数据。节点的值部分可以是基本数据类型（如整数），也可以是其他数据类型（如某个类的对象）。\n\
  \n链接部分是一个引用，用于存储链列表中下一个元素的地址。\n\n![](img/image00925.jpeg)\n\n## 链表的类型\n有不同类型的链表。它们之间的主要区别在于节点是如何相互引用的。\n\
  \n### 单链表 (Singly Linked List)\n每个节点（最后一个节点除外）都有一个指向链表中下一个节点的引用。节点的链接部分包含下一个节点的地址。最后一个节点的链接部分的值为\
  \ `null`。\n\n![](img/image00926.jpeg)\n\n### 双向链表 (Doubly Linked list)\n这种类型的链表中的节点具有指向列表中前驱节点和后继节点的引用。\n\
  \n![](img/image00927.jpeg)\n\n### 环形链表 (Circular Linked List)\n这种类型与单链表相似，不同在于最后一个元素指向列表中第一个节点的引用。最后一个节点的链接部分包含第一个节点的地址。\n\
  \n![](img/image00928.jpeg)\n\n## 链表的各个部分\n1. 头节点 (Head)：头节点是一个持有链表中第一个节点地址的引用。\n\
  2. 节点 (Nodes)：链表中的称为节点。\n3. 值 (Value)：存储在链表每个节点中的数据。\n4. 链接 (Link)：节点的链接部分用于存储其他节点的引用。\n\
  \na. 我们将使用 `next` 和 `prev` 来存储下一个或上一个节点的地址。\n\n## 单链表\n![](img/image00929.jpeg)\n\
  \n让我们来看一个 `Node` 的示例，在这个示例中，值为 `int` 类型，但它可以是其他数据类型。在类定义中链接命名为 `next`。\n\n```java\n\
  private static class Node {\n    private int value;\n    private Node next;\n  \
  \  public Node(int v, Node n) {\n        value = v;\n        next = n;\n    }\n\
  \    public Node(int v) {\n        value = v;\n        next = null;\n    }\n}\n\
  ```\n\n![](img/image00930.jpeg)\n\n注意：对于单链表，在说代码没问题之前，我们应该始终测试这三个测试用例。这种单节点和零节点的情况用于捕获边界情况。在将代码提交给审查人员之前，务必考虑这些情况。\n\
  \n* 零元素 / 空链表。\n* 单元素 / 仅节点情况。\n* 通用情况。\n\n我们可以在链表上执行的各种基本操作：\n* 在列表中插入元素，此操作用于用于创建链表。\n\
  * 打印列表的各种元素。\n* 在列表中搜索一个元素。\n* 从列表中删除一个元素。\n* 反转链表。\n\n你不能使用 `Head` 来遍历链表，因为如果我们使用头节点，就会丢失链表中的节点。我们必须使用另一个相同数据类型的引用。\n\
  \n```java\npublic class LinkedList {\n    private static class Node {\n        private\
  \ int value;\n        private Node next;\n        public Node(int v, Node n) {\n\
  \            value = v;\n            next = n;\n        }\n    }\n    private Node\
  \ head;\n    private int size = 0;\n    //其他方法。\n}\n```\n\n### 列表大小 (Size of List)\n\
  ```java\npublic int size() {\n    return size;\n}\n```\n\n### 是否空函数 (IsEmpty function)\n\
  ```java\npublic boolean isEmpty() {\n    return size == 0;\n}\n```\n\n### 在链表中插入元素\n\
  元素可以按各种顺序插入链表中。以下是一些示例用例：\n1. 在链表的头部插入元素。\n2. 在链表的末尾插入元素。\n3. 在链表的第 $N^{th}$ 位置插入元素。\n\
  4. 按排序顺序在链表中插入元素。\n\n![](img/image00931.jpeg)\n![](img/image00932.jpeg)\n![](img/image00933.jpeg)\n\
  \n### 在头部插入元素\n```java\npublic void addHead(int value) {\n    head = new Node(value,\
  \ head);\n    size++;\n}\n```\n分析：\n* 我们使用参数传递值创建一个节点。\n* 新节点指向原来的 `head`。\n* 新节点将成为链表的头。\n\
  * 列表的大小增加一个。\n\n### 在末尾插入元素\n**示例 7.5**: 在链表末尾插入元素\n```java\npublic void addTail(int\
  \ value) {\n    Node newNode = new Node(value, null);\n    Node curr = head;\n \
  \   if (head == null)\n        head = newNode;\n    while (curr.next != null) {\n\
  \        curr = curr.next;\n    }\n    curr.next = newNode;\n}\n```\n分析：\n* 创建一个节点并将值存储其中。如果列表为空。新节点的下一个是\
  \ `null`。\n* 如果列表为空，`head` 将存储新创建的节点。\n* 如果不为空我们将遍历到末尾。\n* 最后，新节点添加到末尾。\n\n注意：这种操作是低效的，因为每次你想插入元素时都要遍历列表末尾。因此，创建链表的复杂度为\
  \ $n²$。为了提高效率，我们需要通过保持一个`tail`引用来跟踪最后一个元素。因此，如果需要在链表末尾插入，我们需要跟踪`tail`引用。\n\n###\
  \ 遍历链表\n示例 7.2：打印链表的各种元素\n```java\npublic void print() {\n    Node temp = head;\n\
  \    while (temp != null) {\n        System.out.print(temp.value + \" \");\n   \
  \     temp = temp.next;\n    }\n}\n```\n分析：\n* 我们将`head`的引用存储在临时变量 `temp` 中。\n*\
  \ 我们通过打印列表内容并始终指向其下一个节点来遍历链表。\n\n### 创建并打印链表的完整代码\n示例 7.3：\n```java\npublic class\
  \ LinkedListDemo {\n    public static void main(String[] args) {\n        LinkedList\
  \ ll = new LinkedList();\n        ll.addHead(1);\n        ll.addHead(2);\n     \
  \   ll.addHead(3);\n        ll.addHead(1);\n        ll.addHead(2);\n        ll.addHead(3);\n\
  \    }\n}\n```\n\n\n\n\n```java\nll.print();\n}\n```\n\n## Analysis\n\n创建了链表的新实例。\n\
  \n通过调用 `addHead()` 方法向列表中添加各种元素。\n\n最后，通过调用 `print()` 方法将列表的所有内容打印到屏幕上。\n\n### 排序插入\n\
  \n在给定 `Head` 引用的情况下，在链表中按顺序插入元素。\n\n![](img/image00934.jpeg)\n![](img/image00935.jpeg)\n\
  ![](img/image00936.jpeg)\n\n#### 示例 7.4:\n\n```java\npublic void sortedInsert(int\
  \ value){\n    Node newNode = new Node(value, null);\n    Node curr = head;\n  \
  \  if(curr == null || curr.value > value){\n        newNode.next = head;\n     \
  \   head = newNode;\n        return;\n    }\n    while(curr.next != null && curr.next.value\
  \ < value){\n        curr = curr.next;\n    }\n    newNode.next = curr.next;\n \
  \   curr.next =newNode;\n}\n```\n\n#### Analysis:\n\n- 链表的 `Head` 存储在 `curr` 中。\n\
  - 创建一个链表的新空节点。通过将参数值存储到其 `value` 中进行初始化。该节点的 `Next` 将指向 `null`。\n- 检查列表是否为空，或者第一个节点中存储的值是否大于当前值。如果是，则此新创建的节点将添加到列表头部。并且需要修改\
  \ `head`。\n- 我们遍历链表以找到插入节点的合适位置。\n- 最后，该节点将添加到列表中。\n\n### 在链表中查找元素\n\n在链表中查找元素。给定一个\
  \ `head` 引用和一个 `value`。如果在列表中找到 `value`，则返回 `true`，否则返回 `false`。\n\n**Note**：单链表中的搜索只能向一个方向进行。因为列表中的所有元素都有指向列表中下一个项的引用。因此，链表的遍历在性质上是线性的。\n\
  \n#### 示例 7.5:\n\n```java\npublic boolean isPresent(int data){\n    Node temp =\
  \ head;\n    while(temp != null){\n        if(temp.value == data)\n            return\
  \ true;\n        temp = temp.next;\n    }\n    return false;\n}\n```\n\n#### Analysis:\n\
  \n- 我们创建一个 `temp` 变量，它将指向链表的 `head`。\n- 使用 `while` 循环遍历链表。\n- 将列表中每个元素的 `Value`\
  \ 与给定的 `value` 进行比较。如果找到了 `value`，则函数将返回 `true`。\n- 如果没有找到 `value`，则函数最后将返回 `false`。\n\
  \n### 从链表中删除元素\n\n![](img/image00937.jpeg)\n\n### 删除链表中的第一个元素。\n\n#### 示例 7.6:\n\
  \n```java\npublic int removeHead() throws IllegalStateException {\n    if(isEmpty())\n\
  \        throw new IllegalStateException(\"EmptyList\");\n    int value = head.value;\n\
  \    head = head.next;\n    size--;\n    return value;\n}\n```\n\n#### Analysis:\n\
  \n- 首先，我们需要检查列表是否为空。如果列表已经为空，则抛出 `IllegalStateException`。\n- 如果列表不为空，则将 `head` 的\
  \ `value` 存储在临时变量 `value` 中。\n- 我们需要找到列表的第二个元素并将其赋值为链表的 `head`。\n- 由于第一个节点不再被引用，它将被删除。\n\
  - 减少列表的 `size`。并返回存储在临时变量中的 `value`。\n\n#### 给定值从链表中删除节点。\n\n![](img/image0938.jpeg)\n\
  \n#### 示例 7.7:\n\n```java\npublic boolean deleteNode(int delValue){\n    Node temp\
  \ = head;\n    if(isEmpty())\n        return false;\n    if(delValue == head.value){\n\
  \        head=head.next;\n        size--;\n        return true;\n    }\n    while(temp.next\
  \ != null){\n        if(temp.next.value == delValue){\n            temp.next = temp.next.next;\n\
  \            size--;\n            return true;\n        }\n        temp = temp.next;\n\
  \    }\n    return false;\n}\n```\n\n#### Analysis:\n\n- 如果列表为空，我们从从函数返回 `false`，表示\
  \ `deleteNode()` 方法执行错误。\n- 如果需要删除的节点是 `head` 节点，则需要修改 `head` 引用并指向下一个节点。\n- 在 `while`\
  \ 循环中，我们将遍历链表并尝试找到需要删除的节点。如果找到了节点，我们将它的引用指向它的下一个节点。并返回 `true`。\n- 如果没有找到节点，我们将返回\
  \ `false`。\n\n### 删除链表中特定值的所有出现情况。\n\n#### 示例 7.8:\n\n```java\npublic void deleteNodes(int\
  \ delValue)\n{\n    Node currNode = head;\n    Node nextNode;\n    while(currNode\
  \ != null && currNode.value == delValue)/*first node */\n    {\n        head = currNode.next;\n\
  \        currNode = head;\n    }\n    while(currNode != null)\n    {\n        nextNode\
  \ = currNode.next;\n        if(nextNode != null && nextNode.value == delValue)\n\
  \        {\n            currNode.next = nextNode.next;\n            size--;\n  \
  \      }\n        else\n        {\n            currNode = nextNode;\n        }\n\
  \    }\n}\n```\n\n#### Analysis:\n\n- 在第一个 `while` 循环中，我们将删除列表开头所有等于 `delValue`\
  \ 的节点。在此，我们需要更新 `head`。\n- 在第二个 `while` 循环中，我们将删除所有等于 `delValue` 的节点。请记住我们没有返回正在查找的节点。\n\
  \n### 删除单链表\n\n在给定链表 `head` 引用的情况下，删除链表的所有元素。\n\n#### 示例 7.9:\n\n```java\npublic\
  \ void freeList(){\n    head = null;\n    size = 0;\n}\n```\n\n#### Analysis:\n\n\
  - 我们只需要将 `head` 指向 `null`。链表的引用丢失，因此会被自动删除。\n\n### 反转链表。\n\n使用三个指针迭代反转单链表\n\n####\
  \ 示例 7.10:\n\n```java\npublic void reverse(){\n    Node curr=head;\n    Node prev=null;\n\
  \    Node next=null;\n    while(curr!=null)\n    {\n        next = curr.next;\n\
  \        curr.next = prev;\n        prev=curr;\n        curr=next;\n    }\n    head\
  \ = prev;\n}\n```\n\n#### Analysis:\n\n- 链表被迭代。使 `next` 等于 `curr` 节点的下一个节点。使 `curr`\
  \ 节点的 `next` 指向 `prev`。然后通过让 `prev` 指向 `curr`  `curr` 指向 `next` 来遍历列表。\n\n### 递归反转单链表\n\
  \n示例 7.11: 递归反转单链表。参数为当前节点和它的下一个值。\n\n```java\npublic Node reverseRecurseUtil (Node\
  \ currentNode, Node nextNode){\n    Node ret;\n    if(currentNode == null)\n   \
  \     return null;\n    if(currentNode.next == null)\n    {\n        currentNode.next\
  \ = nextNode;\n        return currentNode;\n    }\n    ret= reverseRecurseUtil(currentNode.next,\
  \ currentNode);\n    currentNode.next = nextNode;\n    return ret;\n}\n\npublic\
  \ void reverseRecurse() {\n    head=reverseRecurseUtil(head,null);\n}\n```\n\n####\
  \ Analysis:\n\n- `reverseRecurse` 函数将调用 `reverseRecurseUtil` 函数来反转列表，`reverseRecurseUtil`\
  \ 返回的引用将是反转后链表的头部。\n- `current node` 将指向 `nextNode`，即旧链表的前一个节点。\n\n\n\n\n\n注意：链表可以通过两种方法反转：一种方法是使用三个引用；第二种方法是使用递归。两者都是线性解法，但三引用的解决方案效率更高。\n\
  \n## 移除链表中的重复项\n\n从链表中删除重复的数值。该链表是有序的，并且包含一些重复值，你需要删除这些重复值。（你可以使用 `SortedInsert()`\
  \ 函数来创建所需的链表）\n\n### 示例 7.12:\n\n```java\npublic void removeDuplicate() {\n    curr\
  \ = head;\n    while(curr!= null)   {\n        if(curr.next!=null && curr.value\
  \ == curr.next.value)\n            curr.next = curr.next.next;\n        else\n \
  \           curr = curr.next;\n    }\n}\n```\n**分析**：使用 `while` 循环遍历链表。每当某个节点的值与下一个节点的值相等时，当前节点的\
  \ `next` 将指向下一个节点的下一个节点。这将从列表中删除下一个节点。\n\n## 反转复制链表\n\n以反向顺序将链表的内容复制到另一个链表中。如果原始链表中的元素顺序为\
  \ 1,2,3,4，则新链表的元素顺序应为 4,3,2,1。\n\n### 示例 7.13:\n\n```java\npublic LinkedList CopyListReversed()\
  \ {\n    Node tempNode = null;\n    Node tempNode2 = null;\n    Node curr = head;\n\
  \    while (curr != null) {\n        tempNode2 = new Node(curr.value, tempNode);\n\
  \        curr = curr.next;\n        tempNode = tempNode2;\n    }\n    LinkedList\
  \ ll2 = new LinkedList();\n    ll2.head = tempNode;\n    return ll2;\n}\n```\n**分析**：遍历链表并将节点的值添加到新列表中。由于链表是正向遍历的，且每个节点的值都被添加到另一个列表头部，因此形成的列表是给定链表的反转。\n\
  \n## 将给定链表的内容复制到另一个链表中\n\n将给定链表的内容复制到另一个链表中。如果原始链表中的元素顺序为 1,2,3,4，则新链表的元素顺序应为 1,2,3,4。\n\
  \n### 示例 7.14:\n\n```java\npublic LinkedList copyList() {\n    Node headNode = null;\n\
  \    Node tailNode = null;\n    Node tempNode = null;\n    Node curr = head;\n \
  \   if (curr == null)\n        return null;\n    headNode = new Node(curr.value,\
  \ null);\n    tailNode = headNode;\n    curr = curr.next;\n    while (curr != null)\
  \ {\n        tempNode = new Node(curr.value, null);\n        tailNode.next = tempNode;\n\
  \        tailNode = tempNode;\n        curr = curr.next;\n    }\n    LinkedList\
  \ ll2 = new LinkedList();\n    ll2.head = headNode;\n    return ll2;\n}\n```\n**分析**：遍历链表并将节点的值添加到新列表，但这次始终添加到列表末尾。由于链表是正向遍历的，且每个节点的值都被添加到另一个列表中，因此形成的列表与给定列表相同。\n\
  \n## 比较列表\n\n### 示例 7.15: 比较两个列表\n\n```java\npublic boolean compareList(LinkedList\
  \ ll) {\n    return compareList(head, ll.head);\n}\n\npublic boolean compareList(Node\
  \ head1, Node head2) {\n    if (head1==null && head2==null )\n        return true;\n\
  \    else if (head1==null) || (head2==null) || (head1.value!=head2.value))\n   \
  \     return false;\n    else\n        return compareList(head1.next,head2.next);\n\
  }\n```\n**分析**：\n* 递归地比较列表。此外，如果我们到达列表末尾且两个列表都为空空，则两个列表相等，返回 true。\n* 递归地比较列表。如果其中一个列表为空，或者对应节点的值不相等，则该函数将返回\
  \ false。\n* 递归地为当前节点的节点调用 `compare list` 函数。\n\n## 查找长度\n\n### 示例 7.16: 查找给定链表的长度。\n\
  \n```java\npublic int findLength() {\n    Node curr=head;\n    int count = 0;\n\
  \    while (curr!=null)   {\n        count++;\n        curr = curr.next;\n    }\n\
  \    return count;\n}\n```\n**分析**：通过遍历链表直到到达列表末尾来查找链表的长度。\n\n### 从开始的第 N 个节点\n\n\
  ### 示例 7.17: 查找从开始的第 N 个节点\n\n```java\npublic int nthNodeFromBegining(int index)\
  \ {\n    if (index > size() || index < 1)\n        return Integer.MAX_VALUE;\n \
  \   int count = 0;\n    Node curr = head;\n    while (curr != null && count < index\
  \ - 1) {\n        count++;\n        curr = curr.next;\n    }\n    return curr.value;\n\
  }\n```\n**分析**：通过遍历链表 N-1 次找到第 N 个节点并返回该节点。如果列表不包含 N 个元素，则返回 null。\n\n## 从尾的第 N\
  \ 个节点\n\n### 示例 7.18: 查找从尾的第 N 个节点\n\n```java\npublic int nthNodeFromEnd(int index)\
  \ {\n    int size = findLength();\n    int startIndex;\n    if (size != 0 && size\
  \ < index) {\n        return Integer.MAX_VALUE;\n    }\n    startIndex = size -\
  \ index + 1;\n    return nthNodeBegining(startIndex);\n}\n```\n**分析**：首先找到链表长度，然后从尾的第\
  \ N 个节点就是从开始的第 startIndex 个。\n\n### 示例 7.19:\n\n```java\npublic int nthNodeEnd(int\
  \ index) {\n    int count = 1;\n    Node forward = head;\n    Node curr = head;\n\
  \    while (forward != null && count <= index ) {\n        count++;\n        forward\
  \ = forward.next;\n    }\n    if (forward == null)\n        return Integer.MAX_VALUE;\n\
  \    while (forward != null) {\n        forward = forward.next;\n        curr =\
  \ curr.next;\n    }\n    return curr.value;\n}\n```\n**分析**：第二种方法是使用两个引用，一个领先另一个\
  \ N 个节点，当正向引用到达列表末尾时，后一个引用将指向目标节点。\n\n\n\n\n\n```java\nSystem.out.println(\"loop\
  \ found\" );\n\nreturn true;\n\n}\n}\nSystem.out.println(\"loop not found\" );\n\
  \nreturn false;\n```\n\n### 分析：\n\n· 使用两个引用遍历列表，一个是慢指针，另一个是快指针。慢指针每次移动一步。快指针每次移动两步。如果没有循环，控制流将跳出\
  \ `while` 循环。因此返回 false。\n\n· 如果存在循环，那么在循环中会有某一点，快指针会到达并尝试追过慢指针，它们会在某一点相遇。当到达这个点时，我们就知道列表中存在循环。因此返回\
  \ true。\n\n### 反转列表环检测\n\n**示例 7.21**: 查找链表中是否存在循环。使用反转列表的方法。\n\n```java\npublic\
  \ boolean reverseListLoopDetect()\n{\n    Node tempHead=head;\n    reverse();\n\
  \    if(tempHead==head)\n    {\n        reverse();\n        System.out.println(\"\
  loop found\" );\n        return true;\n    }\n    else\n    {\n        reverse();\n\
  \        System.out.println(\"loop not found\" );\n        return false;\n    }\n\
  }\n```\n\n### 分析：\n\n· 将列表头部的引用存储在一个临时变量中。\n· 反转列表。\n· 比较反转后的列表头部引用与当前列表的头部引用。\n\
  · 如果反转后的列表头部与原始列表头部相同，则将列表反转回去并返回 true。\n· 如果反转后的列表头部与原始列表头部不同，则将列表反转回去并返回 false。这意味着没有循环。\n\
  \n### 循环类型检测\n\n查找链表中是否存在循环。如果没有循环，返回 0；如果存在循环，返回 1；如果是环形列表，则返回 2。使用慢指针快指针的方法。\n\
  \n**示例 7.22**:\n\n```java\npublic int loopTypeDetect()\n{\n    Node slowPtr;\n \
  \   Node fastPtr;\n    slowPtr = fastPtr = head;\n    while(fastPtr.next != null\
  \ && fastPtr.next.next != null)\n    {\n        if(head == fastPtr.next || head==fastPtr.next.next)\n\
  \        {\n            System.out.println(\"circular list found\" );\n        \
  \    return 2;\n        }\n        slowPtr = slowPtr.next;\n        fastPtr = fastPtr.next.next;\n\
  \        if(slowPtr == fastPtr)\n        {\n            System.out.println(\"loop\
  \ found\" );\n            return 1;\n        }\n    }\n    System.out.println(\"\
  loop not found\" );\n    return 0;\n}\n```\n\n分析：此程序与环检测相同，区别在于如果是环形列表，快指针会在列表头部到达慢指针，这说明列表开头处有一个循环。\n\
  \n### 移除循环\n\n**示例 7.23**: 给定链表中存在循环，请移除该循环。\n\n```java\npublic Node loopPointDetect()\n\
  {\n    Node slowPtr;\n    Node fastPtr;\n    slowPtr = fastPtr = head;\n    while(fastPtr.next\
  \ != null && fastPtr.next.next != null)\n    {\n        slowPtr=slowPtr.next;\n\
  \        fastPtr=fastPtr.next.next;\n        if(slowPtr==fastPtr)\n        {\n \
  \           return slowPtr;\n        }\n    }\n    return null;\n}\n\npublic void\
  \ removeLoop()\n{\n    Node loopPoint = loopPointDetect();\n    if(loopPoint ==\
  \ null)\n        return;\n    Node firstPtr = head;\n    if(loopPoint == head) //\
  \ 环形列表情况\n    {\n        while(firstPtr.next != head)\n        {\n            firstPtr\
  \ = firstPtr.next;\n        }\n        firstPtr.next = null;\n        return;\n\
  \    }\n    Node secondPtr = loopPoint;\n    while(firstPtr.next != secondPtr.next)\
  \ // 普通循环情况\n    {\n        firstPtr = firstPtr.next;\n        secondPtr = secondPtr.next;\n\
  \    }\n    secondPtr.next = null;\n}\n```\n\n### 分析：\n\n· 使用两个引用遍历列表，一个快指针和一个慢指针。快指针每次跳过两个节点，慢指针每次移动一个节点。这两个引用相交的点就是循环中的一点。\n\
  · 如果该相交点是列表头部，则属于环形列表情况，你需要再次遍历列表并将头部的前一个节点置为 null。\n· 在其他情况下，你需要使用两个引用，一个从头部开始，另一个从循环点开始。它们会在循环的入口点相遇。（你可以从数学上证明这一点\
  \ ;)）\n\n### 查找交点\n\nImages/image0941.jpeg\n\n**示例 7.24**:\n\n```java\npublic Node\
  \ findIntersection(Node head, Node head2)\n{\n    int l1 = 0;\n    int l2 = 0;\n\
  \    Node tempHead = head;\n    Node tempHead2 = head2;\n    while(tempHead != null)\n\
  \    {\n        l1++;\n        tempHead = tempHead.next;\n    }\n    while(tempHead2\
  \ != null)\n    {\n        l2++;\n        tempHead2 = tempHead2.next;\n    }\n \
  \   int diff;\n    if(l1<12)\n    {\n        Node temp = head;\n        head = head2;\n\
  \        head2 = temp;\n        diff = l2-l1;\n    }\n    else\n    {\n        diff\
  \ = l1-l2;\n    }\n    for(;diff>0;diff--)\n    {\n        head = head.next;\n \
  \   }\n    while(head!=head2)\n    {\n        head = head.next;\n        head2 =\
  \ head2.next;\n    }\n    return head;\n}\n```\n\n分析：查找两个列表的长度。计算两个列表长度的差。让较长列表移动\
  \ diff 次，然后同时移动两个列表获取交点。\n\n## 双向列表\n\n在双向列表中，每个节点有两个引用。这些引用被称为 `prev` 和 `next`。节点的\
  \ `prev` 引用指向它的前一个节点，`next` 引用指向它的下一个节点。\n\nImages/image0942.jpeg\n\n让我们看一个 Node\
  \ 的示例，在这个示例中值的类型是 int，但它也可以是其他类型。\n\n**示例 7.25**:\n\n```java\nprivate static class\
  \ Node {\n    private int value;\n    private Node next;\n    private Node prev;\n\
  \n    public Node(int v, Node nxt, Node prv)\n    {\n        value = v;\n      \
  \  next = nxt;\n        prev = prv;\n    }\n\n    public Node(int v)\n    {\n  \
  \      value = v;\n        next = null;\n        prev = null;\n    }\n}\n```\n\n\
  \n\n\n\n*注*：任何可能改变头部引用或尾部引用的程序都应该作为双引用传递，该引用指向头部或尾部引用。\n\n## 链表的基本操作\n\n链表的基本操作需要遍历链表。我们可以在链表上执行各种操作，其中许多操作都需要遍历链表：\n\
  \n* 在列表中插入元素，此操作用于创建链表。\n* 打印列表的各种元素。\n* 在列表中查找元素。\n* 从列表中删除元素。\n* 反转链表。\n\n对于任何链表，都只有三种情况：零元素、一个元素，以及通常的通用情况。\n\
  \n对于双向链表，我们还有多出的几种情况：\n\n1. 空值（`head` 和 `tail` 均可以修改）\n2. 单元元素（`head` 和 `tail` 均可以修改）\n\
  3. 第一个元素（`head` 可以修改）\n4. 一般情况\n5. 最后一个元素（`tail` 可以修改）\n\n### 示例 7.26\n\n```java\n\
  public class DoublyLinkedList {\n    private static class Node {\n        ………………\n\
  \    }\n    private Node head;\n    private Node tail;\n    private int size = 0;\n\
  }\n```\n\n### 示例 7.27\n\n```java\npublic int size() {\n    return size;\n}\n```\n\
  \n### 示例 7.28\n\n```java\npublic boolean isEmpty() {\n    return size == 0;\n}\n\
  ```\n\n### 示例 7.29\n\n```java\npublic int peek() {\n    if (isEmpty())\n       \
  \ throw new IllegalStateException(\"EmptyListException\");\n    return head.value;\n\
  }\n```\n\n### 在头部插入\n\n![](img/image00944.jpeg)\n![](img/image00945.jpeg)\n\n###\
  \ 示例 7.30\n\n```java\npublic void addHead(int value) {\n    Node newNode = new Node(value,\
  \ null, null);\n    if (size == 0)\n        tail = head = newNode;\n    } else {\n\
  \        head.prev = newNode;\n        newNode.next = head;\n        head = newNode;\n\
  \    }\n    size++;\n}\n```\n\n分析：在双向链表中的插入与在单向链表中的插入相同。\n\n* 创建一个节点，并将该节点的 `prev`\
  \ 引用赋值 `null`。\n* 如果列表为空，则 `tail` 和 `head` 将指向新节点。\n* 如果列表不为空，`head` 的 `prev` 将指向\
  \ `newNode`，`newNode` 的 `next` 将指向 `head`。然后将 `head` 修改为指向 `newNode`。\n\n### 在尾部插入\n\
  \n示例 7.31：在列表末尾插入元素。\n\n```java\npublic void addTail(int value) {\n    Node newNode\
  \ = new Node(value, null, null);\n    if (size == 0)\n        head = tail = newNode;\n\
  \    } else {\n        newNode.prev = tail;\n        tail.next = newNode;\n    \
  \    tail = newNode;\n    }\n    size++;\n}\n```\n\n分析：找到节点合适的位置并将其添加到列表中。管理节点的\
  \ `next` 和 `prev` 引用，以列表始终是双向链表。\n\n### 删除双向链表的头部\n\n### 示例 7.32\n\n```java\npublic\
  \ int removeHead() {\n    if (isEmpty())\n        throw new IllegalStateException(\"\
  EmptyList\");\n    int value = head.value;\n    head = head.next;\n    if (head\
  \ == null)\n        tail = null;\n    else\n        head.prev = null;\n    size--;\n\
  \    return value;\n}\n```\n\n分析：\n\n* 如果列表为空，将抛出 `EmptyListException`。\n* 现在 `head`\
  \ 将指向它的 `next`。\n* 如果 `head` 为 `null`，则这个单节点列表的 `tail` 也需要设为 `null`。\n* 在所有一般情况下，`prev`\
  \ 将被设置为 `null`。\n* 列表的 `Size` 将减一，并返回节点的 `value`。\n\n### 给定值删除节点\n\n![](img/image00946.jpeg)\n\
  ![](img/image00947.jpeg)\n\n### 示例 7.33：在链表删除删除节点\n\n```java\npublic boolean removeNode(int\
  \ key) {\n    Node curr = head;\n    if (curr == null) // 空列表\n        return false;\n\
  \    if (curr.value == key) // head 是值为 key 的节点\n    {\n        head = head.next;\n\
  \        size--;\n        if (head == null)\n            head.prev = null;\n   \
  \     else\n            tail = null; // 列表中只有一个元素。\n        return true;\n    }\n\
  \    while (curr.next != null) {\n        if (curr.next.value == key)\n        {\n\
  \            curr.next = curr.next.next;\n            if (curr.next == null) //\
  \ 最后一个元素\n                tail = curr;\n            else\n                curr.next\
  \ = curr;\n            size--;\n            return true;\n        }\n        curr\
  \ = curr.next;\n    }\n    return false;\n}\n```\n\n分析：遍历列表找到需要删除的节点。然后移除它，并调整前一个节点的\
  \ `next` 引用和后一个节点的 `prev` 引用。\n\n### 查找列表\n\n### 示例 7.34\n\n```java\npublic boolean\
  \ isPresent(int key) {\n    Node temp = head;\n    while (temp != null) {\n    \
  \    if (temp.value == key)\n            return true;\n        temp = temp.next;\n\
  \    }\n    return false;\n}\n```\n\n分析：遍历列表查找某个值是否存在。\n\n### 释放列表\n\n### 示例 7.35\n\
  \n```java\npublic void freeList() {\n    head = null;\n    tail = null;\n    size\
  \ = 0;\n}\n```\n\n分析：只需将 `head` 和 `tail` 引用指向 `null`。列表其余部分将被垃圾回收自动删除。\n\n### 打印列表\n\
  \n### 示例 7.36\n\n```java\npublic void print() {\n    Node temp = head;\n    while\
  \ (temp != null) {\n        System.out.print(temp.value + \" \");\n        temp\
  \ = temp.next;\n    }\n}\n```\n\n分析：遍历列表并打印节点的值。\n\n### 反转双向链表\n\n### 示例 7.37\n\n\
  ```java\npublic void reverseList() {\n    Node curr = head;\n    Node temp;\n  \
  \  while (curr != null) {\n        temp = curr.next;\n        curr.next = curr.prev;\n\
  \        curr.prev = temp;\n        if (curr.next == null)\n            tail = curr;\n\
  \        curr = temp;\n    }\n}\n```\n\n分析：遍历列表。交换 `next` 和 `prev`，然后移动到交换前的 `next`（即\
  \ `curr.prev`）。如果到达列表末尾，则设置 `tail`。\n\n### 反向拷贝列表\n\n示例 7.38：将列表的内容反序拷贝到另一个列表中。\n\
  \n```java\npublic DoublyLinkedList copyListReversed() {\n    DoublyLinkedList dll\
  \ = new DoublyLinkedList();\n    Node curr = head;\n    while (curr != null) {\n\
  \        dll.addHead(curr.value);\n        curr = curr.next;\n    }\n    return\
  \ dll;\n}\n```\n\n分析：\n\n* 创建 `DoublyLinkedList` 类对象 `dll`。\n* 遍历列表并通过调用 `addHead()`\
  \ 方法将节点值复制到另一个列表中。\n* 由于新节点被添加到列表头部，新形成的列表节点顺序是反转的，从而实现了反转列表。\n\n\n\n\n\n```java\n\
  DoublyLinkedList dll = new DoublyLinkedList();\nNode curr = head;\nwhile(curr !=\
  \ null)\n{\n    dll.addTail(curr.value);\n    curr=curr.next;\n}\nreturn dll;\n\
  ```\n\n**分析：**\n- 创建一个 `DoublyLinkedList` 类对象 `dll`。\n- 遍历列表并通过调用 `addTail()` 方法将节点的值复制到另一个列表中。\n\
  - 由于新节点被添加到列表的尾部，形成的新列表节点顺序与原始列表相同。\n\n### 排序序插入\n\n![](img/image00948.jpeg)\n\n\
  **示例 7.40：**\n\n```java\n//SORTED INSERT DECREASING\npublic void sortedInsert(int\
  \ value)\n{\n    Node temp=new Node(value);\n    Node curr=head;\n    if(curr ==\
  \ null)  //只有一个元素\n    {\n        head=temp;\n        tail=temp;\n    }\n    if(head.value\
  \ <= value)  //在开头\n    {\n        temp.next=head;\n        head.prev=temp;\n  \
  \      head=temp;  \n    }\n    while(curr.next != null && curr.next.value > value)\
  \  //遍历\n    {\n        curr=curr.next;\n    }\n    if(curr.next == null)  //在末尾\n\
  \    {\n        tail=temp;\n        temp.prev=curr;\n        curr.next=temp;\n \
  \   }\n    else //其他情况\n    {\n        temp.next=curr.next;\n        temp.prev=curr;\n\
  \        curr.next=temp;\n        temp.next.prev=temp;\n    }\n}\n```\n\n**分析：**\n\
  - 我们首先需要考虑只有一个元素。在这种情况下，`head` 和 `tail` 都会被修改。\n- 我们需要考虑新节点添加到列表开头的情况。\n- 我们需要考虑一般情况。\n\
  - 最后，我们需要考虑 `tail` 会被修改的情况。\n\n### 去重\n\n**示例 7.41：** 假设列表是有序的，移除列表中重复的节点。\n\n```java\n\
  public void removeDuplicate() {\n    Node curr = head;\n    Node deleteMe;\n   \
  \ while(curr!=null)    {\n        if((curr.next != null) && curr.value==curr.next.value)\n\
  \        {\n            deleteMe=curr.next;\n            curr.next=deleteMe.next;\n\
  \            curr.next.prev=curr;\n            if(deleteMe == tail)\n          \
  \      tail = curr;\n        }\n        else\n            curr=curr.next;\n    }\n\
  }\n```\n\n**分析：**\n- 去重与单链表的情况相同。\n- `head` 永远不会被修改，只有当移除最后一个节点时 `tail` 会被修改。\n\n\
  ## 循环链表\n\n这种类型与单链表相似，但最后一个元素指向列表的第一个节点。最后一个节点的链接部分包含第一个节点的地址。\n\n![](img/image0928.jpeg)\n\
  \n**示例 7.42：**\n\n```java\nprivate static class Node {\n    private int value;\n\
  \    private Node next;\n    public Node(int v, Node n) {\n        value = v;\n\
  \        next = n;\n    }\n    public Node(int v) {\n        value = v;\n      \
  \  next = null;\n    }\n}\n```\n\n**示例 7.43：**\n\n```java\npublic class CircularLinkedList\
  \ {\n    private static class Node {\n        // Node 方法和字段\n    }\n    private\
  \ Node tail;\n    private int size = 0;\n    public int size() {\n        return\
  \ size;\n    }\n    public boolean isEmpty() {\n        return size == 0;\n    }\n\
  \    public int peek() {\n        if(isEmpty())\n            throw new IllegalStateException(\"\
  EmptyList\");\n        return tail.next.value;\n    }\n    // 其他方法\n}\n```\n\n**分析：**\
  \ 在循环链表中，我们只需要指向 `tail` 节点的指针。从 `tail` 节点可以轻松到达 `head` 节点。`size()` 和 `peek()` 函数保持。\n\
  \n### 在头部插入元素\n\n![](img/image0949.jpeg)\n![](img/image0950.gif)\n\n**示例 7.44：**\n\
  \n```java\npublic void addHead(int value){\n    Node temp = new Node(value, null);\n\
  \    if(isEmpty())\n    {\n        tail=temp;\n        temp.next = temp;\n    }\n\
  \    else\n    {\n        temp.next = tail.next;\n        tail.next = temp;\n  \
  \  }\n    size++;\n}\n\npublic class CircularLinkedListDemo {\n    public static\
  \ void main(String[] args) {\n        CircularLinkedList ll = new CircularLinkedList();\n\
  \        ll.addHead(1);\n        ll.addHead(2);\n        ll.addHead(3);\n      \
  \  ll.addHead(1);\n        ll.addHead(2);\n        ll.addHead(3);\n        ll.print();\n\
  \    }\n}\n```\n\n**分析：**\n- 首先，我们创建一个带有给定值的节点，其 `next` 指向 `null`。\n- 如果列表为空，则列表的\
  \ `tail` 将指向它。节点的 `next` 将指向自己。\n- 如果列表不为空，则新节点的 `next` 将是 `tail` 的 `next`。因此，新节点被添加到列表的头部。\n\
  - 演示创建了一个 `CircularLinkedList` 类的实例。然后向它添加一些值，最后打印内容。\n\n### 在尾部插入元素\n\n**示例 7.45：**\n\
  \n```java\npublic void addTail(int value){\n    Node temp = new Node(value, null);\n\
  \    if(isEmpty())\n    {\n        tail=temp;\n        temp.next = temp;\n    }\n\
  \    else\n    {\n        temp.next = tail.next;\n        tail.next = temp;\n  \
  \      tail=temp;\n    }\n    size++;\n}\n```\n\n**分析：** 在尾部添加节点与在开头添加相同。只需要修改 `tail`\
  \ 引用代替 `head` 引用。\n\n### 移除头部元素\n\n**示例 7.46：**\n\n```java\npublic int removeHead()\
  \ throws IllegalStateException {\n    if(isEmpty()) {\n        throw new IllegalStateException(\"\
  EmptyList\");\n    }\n    int value = tail.next.value;\n    if(tail == tail.next)\
  \  //单节点\n        tail=null;\n    else\n        tail.next = tail.next.next;\n  \
  \  size--;\n    return value;\n}\n```\n\n**分析：**\n- 如果列表为空，则将抛出异常。然后 `head` 中的值被存储在局部变量\
  \ `value` 中。\n- 如果 `tail` 等于它的下一个节点，意味着列表中只有一个节点，因此 `tail` 将变为 `null`。\n- 在所有其他情况下，`tail`\
  \ 的 `next` 将指向头部（head）的下一个元素。\n- 最后，返回该值。\n\n### 在列表中查找元素\n\n**示例 7.47：**\n\n```java\n\
  public boolean isPresent(int data){\n    Node temp = tail;\n    for(int i=0; i<size;i++){\n\
  \        if(temp.value == data)\n            return true;\n        temp = temp.next;\n\
  \    }\n    return false;\n}\n```\n\n**分析：** 遍历列表以查找特定值是否存在。\n\n### 打印列表内容\n\n**示例\
  \ 7.48：**\n\n```java\npublic void print(){\n    if(isEmpty()){\n        return;\n\
  \    }\n    Node temp = tail.next;\n    while(temp != tail){\n        System.out.print(temp.value+\"\
  \ \");\n        temp = temp.next;\n    }\n}\n```\n\n\n\n\n\n```java\nSystem.out.print(temp.value);\n\
  }\n```\n\n**分析：** 在循环列表中，没有列表末尾，因此我们无法通过 `null` 来检查。相反，使用 `tail` 来检查列表的末尾。\n\n###\
  \ 删除列表\n\n**示例 7.49：**\n\n```java\npublic void freeList() {\n    tail = null;\n\
  \    size = 0;\n}\n```\n\n**分析：** 列表的引用是 `tail`。通过将 `tail` 设为 `null`，整个列表都会被删除。\n\
  \n### 根据值删除节点\n\n![](img/image00951.jpeg)\n\n![](img/image00952.jpeg)\n\n![](img/image00953.jpeg)\n\
  \n**示例 7.50：**\n\n```java\npublic boolean removeNode(int key) {\n    if (isEmpty())\
  \ {\n        return false;\n    }\n    Node prev = tail;\n    Node curr = tail.next;\n\
  \    Node head = tail.next;\n    if (curr.value == key)//头部和单节点情况。\n    {\n    \
  \    if (curr == curr.next)//单节点情况\n            tail = null;\n        else // 头部情况\n\
  \            tail.next = tail.next.next;\n        return true;\n    }\n    prev\
  \ = curr;\n    curr = curr.next;\n    while (curr != head)\n    {\n        if (curr.value\
  \ == key)\n        {\n            if (curr == tail)\n                tail = prev;\n\
  \            prev.next = curr.next;\n            return true;\n        }\n     \
  \   prev = curr;\n        curr = curr.next;\n    }\n    return false;\n}\n```\n\n\
  **分析：** 找到需要释放的节点。唯一的区别在于，遍历列表末尾时，使用 `head` 引用代替 `null` 进行追踪。\n\n### 复制列表\n\n**示例\
  \ 7.1：**\n\n```java\npublic CircularLinkedList copyListReversed() {\n    CircularLinkedList\
  \ cl = new CircularLinkedList();\n    Node curr = tail.next;\n    Node head = curr;\n\
  \    if (curr != null)\n    {\n        cl.addHead(curr.value);\n        curr = curr.next;\n\
  \    }\n    while (curr != head)\n    {\n        cl.addHead(curr.value);\n     \
  \   curr = curr.next;\n    }\n    return cl;\n}\n```\n\n**分析：** 遍历列表并将节点添加到新列表的头部。从而使新列表成为给定列表的反转列表。\n\
  \n**示例 7.2：**\n\n```java\npublic CircularLinkedList copyList() {\n    CircularLinkedList\
  \ cl = new CircularLinkedList();\n    Node curr = tail.next;\n    Node head = curr;\n\
  \    if (curr != null)\n    {\n        cl.addTail(curr.value);\n        curr = curr.next;\n\
  \    }\n    while (curr != head)\n    {\n        cl.addTail(curr.value);\n     \
  \   curr = curr.next;\n    }\n    return cl;\n}\n```\n\n**分析：** 遍历列表并将节点添加到新列表的末尾。从而产生一个值与输入列表相同的列表。\n\
  \n### 双向循环列表\n\n1. 对于任何一个链表，只有三种情况：零元素、一个元素、一般情况。\n2. 对于双向链表，我们还有几点注意：\n    a) `null`\
  \ 值\n    b) 单元素（它通常会引入一个带有 `null` 的 `if` 语句）\n    c) 在 `while` 之前总有一个 `if`，从该头部开始检查。\n\
  \    d) 一般情况（使用保留的头部头部检查）\n    e) 避免使用递归解，这会让情况变得复杂\n\n![](img/image00954.jpeg)\n\
  \n**示例 7.3：**\n\n```java\nstatic class Node {\n    int value;\n    Node next;\n\
  \    Node prev;\n    public Node(int v, Node nxt, Node prv) {\n        value = v;\n\
  \        next = nxt;\n        prev = prv;\n    }\n    public Node(int v) {\n   \
  \     value = v;\n        next = this;\n        prev = this;\n    }\n}\n\npublic\
  \ class DoublyLinkedList {\n    static class Node {\n        …..\n    }\n    Node\
  \ head = null;\n    Node tail = null;\n    int size = 0;\n    public int size()\
  \ {\n        return size;\n    }\n    public boolean isEmpty() {\n        return\
  \ size == 0;\n    }\n    public int peekHead() {\n        if (isEmpty())\n     \
  \       throw new IllegalStateException(\"EmptyListException\");\n        return\
  \ head.value;\n    }\n}\n```\n\n### 查找值\n\n**示例 7.4：**\n\n```java\npublic boolean\
  \ isPresent(int key) {\n    Node temp = head;\n    if (head == null)\n        return\
  \ false;\n    do {\n        if (temp.value == key)\n            return true;\n \
  \       temp = temp.next;\n    } while (temp != head);\n    return false;\n}\n```\n\
  \n**分析：** 遍历列表并查看 `key` 是否存在。我们使用 `do..while` 循环是因为初始状态就是我们的状态。\n\n### 删除列表\n\n\
  **示例 7.5：**\n\n```java\npublic void freeList() {\n    head = null;\n    tail = null;\n\
  \    size = 0;\n}\n```\n\n**分析：** 移除引用，列表将被释放。\n\n### 打印列表\n\n**示例 7.6：**\n\n```java\n\
  public void print() {\n    if (isEmpty()) {\n        return;\n    }\n    Node temp\
  \ = head;\n    while (temp != tail) {\n        System.out.print(temp.value + \"\
  \ \");\n        temp = temp.next;\n    }\n    System.out.print(temp.value);\n}\n\
  ```\n\n**分析：** 遍历列表并打印内容。使用 `do..while` 是因为我们希望在 `temp` 为头部时终止，并且处理一次头部。\n\n###\
  \ 在头部插入节点\n\n**示例 7.7：** 在列表头部插入值。\n\n```java\npublic void addHead(int value) {\n\
  \    Node newNode = new Node(value, null, null);\n    if (size == 0) {\n       \
  \ tail = head = newNode;\n        newNode.next = newNode;\n        newNode.prev\
  \ = newNode;\n    }\n    else {\n        newNode.next = head;\n        newNode.prev\
  \ = head.prev;\n        head.prev = newNode;\n        newNode.prev.next = newNode;\n\
  \        head = newNode;\n    }\n    size++;\n}\n```\n\n**分析：**\n* 创建新节点，如果列表为空，则\
  \ `head` 和 `tail` 将指向它。新创建的 `newNode` 的 `next` 和 `prev` 也指向 `newNode`。\n* 如果列表不为空，则调整指针并将新节点添加到列表头部。在这种情况下，只需要更改\
  \ `head`。\n* 列表的大小增加一。\n\n### 在尾部插入节点\n\n**示例 7.8：**\n\n```java\npublic void addTail(int\
  \ value) {\n    Node newNode = new Node(value, null, null);\n    if (size == 0)\
  \ {\n        tail = head = newNode;\n        newNode.next = newNode;\n        newNode.prev\
  \ = newNode;\n    }\n    else {\n        newNode.next = tail.next;\n        newNode.prev\
  \ = tail;\n        tail.next = newNode;\n        newNode.next.prev = newNode;\n\
  \        tail = newNode;\n    }\n}\n```\n\n\n\n\n\n列表的大小增加了一一。\n\n### 删除节点\n\n示例\
  \ 7.59:\n```java\npublic int removeHead() {\n    if (size == 0)\n        throw new\
  \ IllegalStateException(\"EmptyListException\");\n    int value = head.value;\n\
  \    size--;\n    if (size == 0) {\n        head = null;\n        tail = null;\n\
  \        return value;\n    }\n    Node next = head.next;\n    next.prev = tail;\n\
  \    tail.next = next;\n    head = next;\n    return value;\n}\n```\n**分析：** 在双向环链表中删除节点与在环形链表中删除节点相同。只需要调整几个额外的\
  \ `next` 引用。\n\n### 删除尾节点\n\n示例 7.60:\n```java\npublic int removeTail() {\n    if\
  \ (size == 0)\n        throw new IllegalStateException(\"EmptyListException\");\n\
  \    int value = tail.value;\n    size--;\n    if (size == 0) {\n        head =\
  \ null;\n        tail = null;\n        return value;\n    }\n    Node prev = tail.prev;\n\
  \    prev.next = head;\n    head.prev = prev;\n    tail = prev;\n    return value;\n\
  }\n```\n**分析：** 在双向环链表中删除节点与在环形链表中删除节点相同。只需要调整几个额外的 `prev` 引用。\n\n## 练习\n\n1) 从链表开始第\
  \ `k^(th)` 位置插入一个元素。如果成功返回 1，如果列表长度不足则返回 -1。\n*提示：* 获取一个引用并将其向前移动 `K` 步，然后插入节点。\n\
