  设 $X = \\{x1, x2, \\dots, xm\\}$ 是一个字符序列。$Y = \\{y1, y2, \\dots, yn\\}$ 是另一个序列。$Z$\
  \ 是 $X$ 的子序列，如果它可以通过删除 $X$ 中的某些元素得到。$Z$ 是 $Y$ 的子序列，如果它可以通过删除 $Y$ 中的某些元素得到。$Z$ 是\
  \ $X$ 和 $Y$ 的 LCS（最长公共序列），且没有子序列的长度大于 $Z$。\n\n#### 最优子结构\n设 $X = x1, x2, \\dots,\
  \ xm$ 和 $Y = y1, y2, \\dots, yn$ 为两个序列，设 $Z = z1, z2, \\dots, zk$ 为 $X$ 和 $Y$ 的\
  \ LCS。\n- 如果 $xm = yn$，则 $zk = yn \\Rightarrow Zk-1$ 是 $Xm-1$ 和 $Yn-1$ 的 LCS\n-\
  \ 如果 $xm \\neq yn$，则：\n    - $zk \\neq xm \\Rightarrow Z$ 是 $Xm-1$ 和 $Y$ 的 LCS\n\
  \    - $zk \\neq yn \\Rightarrow Z$ 是 $X$ 和 $Yn-1$ 的 LCS\n\n#### 递归关系\n设 `c[i, j]`\
  \ 为 $X = \\{x1, x2, \\dots, xi\\}$ 和 $Y = \\{y1, y2, \\dots, yj\\}$ 之间最长公共序列的长度。`c[n,\
  \ m]` 包含 $X$ 和 $Y$ 的 LCS 长度。\n![Text Box](img/image01144.jpeg)\n\n#### 算法 LCS(X[],\
  \ m, n)\n\n```text\nAlgorithm LCS(X[], m, n)\nfor i = 1 to m\n    c[i,0] = 0\nfor\
  \ j = 1 to n\n    c[0,j] = 0;\nfor i = 1 to m\n    for j = 1 to n\n            if\
  \ X[i] == Y[j]\n                c[i,j] = c[i-1,j-1] + 1\n                b[i,j]\
  \ = ↖\n            else\n                if c[i-1,j] ≥ c[i,j-1]\n              \
  \      c[i,j] = c[i-1,j]\n                    b[i,j] = ↑\n                else\n\
  \                    c[i,j] = c[i,j-1]\n                    b[i,j] = ←\n```\n\n\
  #### 算法 PrintLCS(b[], i, j)\n\n```text\nAlgorithm PrintLCS(b[], i, j)\n    if i\
  \ = 0\n        return\n    if j = 0\n        return\n    if b[i, j] = ↖\n      \
  \  PrintLCS(b[], i-1, j-1)\n        print X[i]\n    else if b[i, j] = ↑\n      \
  \  PrintLCS(b[], i-1, j)\n    else\n        PrintLCS(b[], i, j-1)\n```\n\n### 找零问题\n\
  \n如何用最少的硬币 $D = \\{d1 \\dots dn\\}$ 组成金额 $N$？例如印度货币系统 $\\{5, 10, 20, 25, 50, 100\\\
  }$。假设我们要找 40 paisa 的零。我们可以通过重复选择 $\\le$ 当前金额的硬币得到解。贪心解是总是选择尽可能大的硬币。对于 40 paisa：$\\\
  {25, 10, 5\\}$。这是全球数十亿每天找零的方式。但这不是最优解，上述问题的最优解是 $\\{20, 20\\}$。\n\n#### 步骤 (I):\
  \ 刻画找零解的结构\n定义 `C[j]` 为找 $j$ 分所需的最小硬币数量。\n如果我们知道找 $j$ 分的最优未使用面值为 $di$ 的硬币，则有：$C[j]\
  \ = 1+C[j-di]$\n\n#### 步骤 (II): 递归定义最优解的值。\n![Text Box](img/image01145.jpeg)\n\n\
  #### 步骤 (III): 以自底向的方式计算。\n\n```text\nAlgorithm CoinExchange(n, d[], k)\nC[0] =\
  \ 0\nfor j = 1 to n\n    C[j] = infinite\nfor i = 1 to k\n        if j < di and\
  \ 1+C[j-di] < C[j]\n            C[j] = 1+C[j-di]\nreturn C\n```\n复杂度：$O(nk)$\n\n\
  #### 步骤 (iv): 构建最优解\n我们使用一个额外的数组 `Deno[1.. n]`，其中 `Deno[j]` 是最优解中硬币面值。\n\n```text\n\
  Algorithm CoinExchange(n, d[], k)\nC[0] = 0\nfor j = 1 to n\n    C[j] = infinite\n\
  for i = 1 to k\n        if j < di and 1+C[j-di] < C[j]\n            C[j] = 1+C[j-di]\n\
  \            Deno[j] = di\nreturn C\n```\n\n#### 算法 PrintCoins(Deno[], j)\n\n```text\n\
  Algorithm PrintCoins( Deno[], j)\nif j > 0\n    PrintCoins(Deno, j-Deno[j])\n  \
  \  print Deno[j]\n```\n\n# 第 20 章：回溯与分支限界\n\n## 引言\n\n假设锁在选择任何一级正确数字时都会发出“咔哒”声。你只需要找到第一个数字，然后第二个，然后第三个即可完成。这是一个贪心算法，你会很快找到解。\n\
  但让我们假设锁是旧式的，它不仅在正确数字处发出声音，在某些数字处也会发出声音。所以当你尝试寻找第一个数字时，它可能会在多个地方产生声音。此时，你并不是直接走向解决方案，而是需要测试各种状态，如果这些状态不是你寻找的解，你就需要回溯一步并找到下一个解。但确实，这种咔哒声的智能/启发式将帮助你更快到达目标。这些函数被称为剪枝函数或边界函数。\n\
  \n## 回溯问题\n\n#### 女皇后问题\n\n给出 $N$ 个女皇后，你需要将它们排列在 $N \\times N$ 的棋盘上，使得每个皇后之间互不攻击。\n\
  \n```java\npublic static void NQueens(int[] Q, int k, int n) {\n    if (k == n)\
  \ {\n        print(Q, n);\n        return;\n    }\n    for (int i = 0; i < n; i++)\
  \ {\n        Q[k] = i;\n        if (Feasible(Q, k))\n            NQueens(Q, k+1,\
  \ n);\n    }\n}\n\npublic static boolean Feasible(int[] Q, int k) {\n}\n```\n\n\n\
  \n\n```java\nfor (int i = 0; i< k; i++) {\n    if(Q[k] == Q[i] || Math.abs(Q[i]\
  \ - Q[k]) == Math.abs(i-k)) {\n        return false;\n    }\n}\nreturn true;\n}\n\
  \npublic static void print(int[] Q, int n) {\n    for (int i = 0; i< n; i++)\n \
  \       System.out.print(\" \" + Q[i]);\n    System.out.println(\" \");\n}\n\npublic\
  \ static void main(String[] args) {\n    int[] Q=new int[8];\n    NQueens(Q,0,8);\n\
  }\n```\n\n## 汉诺塔\n\n汉诺塔游戏，本质上需要将圆盘从一个柱子移动到另一个柱子，使得任何大盘都不能放在任何小盘之上。\n\n这是编程界一个著名的谜，它的起源可以追溯到印度。\n\
  \n“关于卡西维斯瓦纳的一座印度寺庙，有一个传说：那里有一个大房间，里面有三根古旧的柱子，周围环绕着 64 个金色圆盘。婆罗门祭司遵循古代印度教预言的指令，自混沌之初按照宇宙创造者梵不可违越的规则在移动这些圆盘。因此，这个游戏也被称为布拉玛塔。根据预言，当这个游戏的最后一次移动完成后，世界将会终结。”\
  \ ;) ;) ;)\n\n![](img/image01146.jpeg)\n\n```java\npublic static void TOHUtil(int\
  \ num, char from, char to, char temp) {\n    if (num < 1)\n        return;\n   \
  \ TOHUtil(num - 1, from, temp, to);\n    System.out.println(\"Move disk \"+num+\"\
  \ from peg \"+from+\" to peg \"+to);\n    TOHUtil(num - 1, temp, to, from);\n}\n\
  \npublic static void TowersOfHanoi(int num) {\n    System.out.println(\"The moves\
  \ involved in the Tower of Hanoi are :\");\n    TOHUtil(num, 'A', 'C', 'B');\n}\n\
  ```\n\n# 第 21 章：复杂度理论与 NP 完全性\n\n## 引言\n\n计算复杂度是衡量解决某个问题需要多少资源的度量。\n\n资源有两种类型：\n\
  \n1. **时间**：解决一个问题需要多少步骤。\n2. **空间**：解决一个问题需要多少内存。\n\n## 决策问题\n\n复杂度理论大部分涉及决策问题。决策问题总会有一个“是”或“否”的答案。\n\
  \n许多问题可以转换为具有“是”或“否”作为回答的决策问题。例如：\n\n1. **搜索**：如果我们询问列表中是否存在某个特定的数字，搜索元素的问题就可以作为一个决策问题。\n\
  2. **列表排序**：为了判断列表是否已排序，你可以构造一个决策问题：列表是否按升序排列的？\n3. **图着色算法**：这也可以转换为决策问题。我们是否可以使用\
  \ X 种颜色完成图着色？\n4. **哈密顿圈**：是否存在一条穿过所有节点的路径，每个节点恰好被访问一次，并且在不中断的情况下返回起始节点？\n\n## 复杂度类\n\
  \n问题被分为许多类，取决于解决它们的困难程度，或者验证给定的解是否正确的困难程度。\n\n## P 类问题\n\nP 类由一组可以在多项式时间内解决的问题组成。P\
  \ 问题的复杂度为 `O(![](img/image01147.jpeg))`，其中 `n` 是输入规模，`k` 是某个常数（它不能依赖于 `n`）。\n\n\
  **P 类定义**：P 类包含所有存在图灵机算法的决策问题能够在多项式函数限制的确定步数内得出“是/否”答案。\n\n例如：\n\n给定序列 `a1, a2,\
  \ a3…. an`。找到数字 `X` 是否在该数组中。\n\n我们可以在线性时间（多项式时间）在数组中搜索数字 `X`。\n\n另一个例子：\n给定序列 `a1,\
  \ a2, a3…. an`。如果我们被要求排序，可以使用冒泡排序在多项式时间内对数组，这也是线性时间。*注：* `O(logn)`![](img/image01147.jpeg)\
  \ 也是多项式的。P 类的一些问题是：\n\n1. 最短路径\n2. 最小生成树\n3. 最大流\n4. 凸壳\n\n## NP 类问题\n\n一组存在多项式时间检查算法的问题。给定一个解，我们可以在多项式时间内检查该解是否正确，那么该问题就是\
  \ NP。\n\n**NP 类定义**：NP 类包含所有决策问题，给定一个解，存在一个多项式时间的“证明”或“证书”，可以验证该解是否是正确的“是/否”答案![](img/image01148.jpeg)。\n\
  \n*注：这并不保证你能够在多项式时间内解决这个问题。但如果一个问题是 NP，那么你可以在多项式时间内验证答案。NP 并不意味着多项式。实际上，它是非确定性类型的问题。它们是那些可以通过非确定性图灵机在多项式时间内解决的问题。在每一点，所有可能性都并行执行。如果有\
  \ `n` 个选择，所有情况将并行执行。我们没有确定性的计算机。不要将其与并行计算混淆，因为并行计算中的 CPU 数量是有限的。简单来说，NP 问题是指给定一个解，可以在多项式时间内验证其正确性的问题。\n\
  \n### 布尔可满足性问题\n\n一个布尔公式如果存在对其变量进行 0 和 1 的赋值以使其成立![](img/image0149.jpeg)，它是满足的。总共有\
  \ `N` 种变量 `A1, A2… AN`。存在 `M` 个括号。每个括号有 `K` 个变量。因此验证方程是否真的成立总需要![](img/image0150.jpeg)\
  \ 步，给定该问题的解。\n\n### 哈密顿圈\n\n哈密顿圈是穿过所有节点的路径，每个节点恰好被访问一次并且在不中断的情况下返回起始节点。这是一个 NP 问题，如果你有一个解，你只需要检查所有节点是否都在路径中并且返回了起点即可。检查在线性时间内完成。判断有向图是否存在哈密顿圈没有多项式时间算法\
  \ `O(n!)`。然而，如果有人给你顶点序列，判断该序列是否形成哈密顿圈可以在多项式时间内完成。哈密顿圈属于 NP。\n\n### 团问题\n\n在图中是否存在大小为\
  \ `K` 或更大的团。团是全连接的节点子集。这个问题是 NP。给定一个节点集合，你可以很容易地判断它是否是一个团。例如：![](img/image0151.jpeg)\n\
  \n\n\n\n\n# 图论拥有一系列精彩的问题\n\n- 最短路径算法？\n- 最长路径是 NP 完全的。\n- 欧拉图遍历是一个多项式时间问题。\n- 哈密顿回路是\
  \ NP 完全的。\n\n## co-NP 类\n\n对于存在多项式时间检查算法的问题集合。给定一个解，如果我们可以在多项式时间内检查出该解是错误的，那么该问题就是\
  \ co-NP 问题。\n\n**`co-NP` 类定义：** `co-NP` 类包含所有决策问题，使得存在一个多项式时间的证明，可以验证该问题是否没有正确的“是/否”答案。\n\
  \n![](img/image01153.jpeg)\n\n## P 类是 NP 类的子集\n\n所有 `P` 类的问题也是 `NP` 类 (![](img/image01154.jpeg))\
  \ 问题集 `P` 是问题集 `NP` 的子集。\n\n### 搜索\n\n如果我们有一个数字序列 `a1, a2, a3…. an`。我们已经知道在该数组中搜索数字\
  \ `X` 属于 `P` 类型。\n\n如果给定数字 `X` 在这个序列中，那么我们可以通过重新查看每一个条目，并在多项式时间内（线性时间）找到答案是否正确。\n\
  \n### 排序\n\n数字序列排序的另一个例子，如果给定数组 `b1, b2, b3.. bn` 是有序的，那么我们可以遍历这个给定的数组，并在多项式时间内找到该列表是否真的是有序的（再次是线性时间）。\n\
  \n## NP-Hard:\n\n如果 `NP` 中的所有问题都可以在多项式时间内归约一个问题，那么该问题就是 `NP-Hard`。\n\n![](img/image01155.jpeg)\n\
  \n## NP-完全问题\n\n如果一个问题集合既是 `NP` 问题又是 `NP-Hard` 问题，那么该问题集合就是 `NP-Complete`。\n\n它必须同时符合两个属性：\n\
  \n1) 它的解可以在多项式时间内被验证。\n2) 所有 `NP` 问题都可以在多项式时间内归约为 `NP 完全` 问题。\n\n你始终可以在多项式时间内将任何\
  \ `NP` 问题归约为 `NP-Complete` 问题。当你得到问题的答案时，你可以在多项式时间内验证这个解。\n\n![](img/image01156.jpeg)\n\
  ![](img/image01157.jpeg)\n\n任何 `NP` 问题都可以多项式归约为 `NP-Complete` 问题，如果我们能在多项式时间内找到单个\
  \ `NP-Complete` 问题的解，那么我们就可以在项式时间内解决所有的 `NP` 问题。但目前还没有人能够在多项式时间内找到任何 `NP-Complete`\
  \ 问题的解。\n\n`P ≠ NP`\n\n## 归约\n\n将一个问题转换为另一个问题的。转换时间应该是多项式的。如果问题 `A` 转换为 `B` 且我们在多项式时间内知道\
  \ `B` 的解，那么 `A` 也可以在多项式时间内解决。\n\n例如，\n\n**二次方程求解器：** 我们有一个`二次方程求解器`，用于求解形式为 `a![](img/image01158.jpeg)bx+c\
  \ = 0` 的方程。它接受输入 `a, b, c` 并生成输出 `r1, r2`。\n\n现在尝试求解线性方程 `2x+4=0`。通过归约，第二个方程可以转换为第一个方程。\n\
  \n`2x+4 = 0![](img/image01158.jpeg)2x+4 = 0`\n\n**地图集：** 我们有一张地图，我们需要为地图上色，使得任意两个国家没有相同的颜色。假设下面是不同的国家。不同的图案代表不同的颜色。\n\
  \n![](img/image01159.jpeg)\n\n我们可以看到，地图着色的相同问题可以归约为图着色，如果我们知道图着色的解，那么同样的解也适用于地图着色。其中图的每个节点代表一个国家，相邻国家的关系由节点之间的边表示。\n\
  \n![](img/image01160.gif)\n\n排序问题归约 (`≤`) 到 `凸壳` 问题。\n\n`SAT` 归约 (`≤`) 到 `3SAT`\n\
  \n### 旅行商问题 (TSP)\n\n旅行商问题试图在一个给定的 `n` 个城市集合中找到最短回路，在返回起点城市之前，每个城市恰好被访问一次。\n\n或者：在加权连通图中寻找最短的哈密顿回路。一个恰好通过图所有顶点的环路。\n\
  \n**TSP 算法**\n\n```\n选择一个城市\nMinTourCost = infinite\nFor ( 所有城市的排列 ) do\n    If(\
  \ LengthOfPathSinglePermutation < MinTourCost )\n        MinTourCost = LengthOfPath\n\
  所有可能的组合总数 = (n-1)!\n计算路径的成本? Θ(n)\n所以寻找最短路径的总成本? Θ(n!)\n```\n\n它是一个 `NP-Hard` 问题，没有高效的算法来找到它的解。即使给出了某个解，验证这个解是否正确也同样困难。但确实有一些近似算法可以用来找到一个相当好的解。我们不会总是得到最优解，但会得到一个相当完的解。\n\
  \n我们的近似算法基于最小生成树问题。在那个问题中，我们必须从图中构建一棵树，使得每个节点都通过图中的边连接，并且所有边的成本总和为最小。\n\n![](img/image01161.jpeg)\n\
  \n在上面的图中，我们有一组城市（每个城市用一个圆圈表示），它们位于网格中，城市之间的距离与实际情况相同。\n\n![](img/image01162.jpeg)\n\
  \n在上面的图中，我们有一组城市（每个城市用一个圆圈表示），它们位于网格中，城市之间的距离与实际情况相同。\n\n![](img/image01163.jpeg)\n\
  \n在上面的图中，我们有一组城市（每个城市用一个圆圈表示），它们位于网格中，城市之间的距离与实际情况相同。\n\n![](img/image01164.jpeg)\n\
  \n在上面的图中，我们有一组城市（每个城市用一个圆圈表示），它们位于网格中，城市之间的距离与实际情况相同。\n\n**结语**\n\n还没有人提出过这样的解决\
  \ NP 完全问题的多项式时间算法。许多重要的算法都依赖于此。但同时，也没有人证明无时间算法是不可能的。对于任何能在多项式时间内解决任何 NP 完全问题的人，有百万美元奖励。世界经济将会崩溃，因为大多数银行依赖的公钥加密如果发现了\
  \ `P=NP` 的解将很容易破解。\n\n# 第 22 章：面试策略\n\n## 引言\n\n技术面试的成功取决于许多因素，你的非技术技能、技术技能等。但最重要的是，面试官应该确信与你一起工作会愉快。\n\
  \n## 简历\n\n最好的简历是那些清晰有效地展示你技能和成就的简历。\n\n良好的简历格式具有以下属性：\n\n1. **多栏：** 多栏使得人们能够快速浏览你的公司名称、职位、大学和其他关键事实。\n\
  2. **简洁明了：** 面试官只会花费 30 秒阅读你的简历。你只需要关注重点。一页就足够了，但如果你有 10 年以上的经验，那么两页也是合理的。\n3. **无垃圾内容：**\
  \ 不需要目标，不需要誓言，总结部分/关键技能部分可以接受，但如果你的简历已经简洁，就不需要总结部分。\n4. **使用表格：** 你可以使用表格，但它不应该浪费空间。\n\
  \n\n\n\n\n# 6. 整洁：保持你的简历整洁、干净。使用合适的字体和格式。使用**粗体**表示重点，在某些地方可以使用*斜体*。\n\n## 非技术问题\n\
  \n为各种非技术性问题做好准备。要做的第一件事是为与简历相关的任何问题准备答案。面试官会深入研究并问几个问题以了解你的情况。因此，请回顾所有过去和现在的工作以及项目，确保你了解它们的内容以及你的角色。\n\
  \n这些问题可能如下：\n\n1. 在 ABC 项目中你过的过的挑战性的活动是什么？\n2. 你从 ABC 项目中学习到了什么？\n3. 你在当前工作中职责是什么？\n\
  4. 你在目前工作中做过最有趣的事情是什么？\n5. 你大学期间最喜欢哪门课程？为什么？\n\n## 技术问题\n\n解决技术问题不仅关乎了解算法和设计一个良好的软件系统。面试官想知道你处理任何给定问题的方法。\n\
  \n许多人会犯这样的错误，比如他们不对给定的问题提澄清性问题？他们假设了很多事情并以此开始工作。事实上，面试官实际上期望你提出关于限制条件的问题。在开始解决问题之前，你需要从面试官那里收集大量缺失的数据。\n\
  \n例如：假设面试官要求你给出一个排序算法。\n\n有些面试者会直接跳到 `Quick-Sort` `O(nlogn)`。哎，错误了，在开始解决这个问题之前，你需要问很多问题。\n\
  \n问题：\n\n1. 我们讨论的是什么类型的数据？它们是 `integer` 吗？\n2. 我们要排序多少数据？\n3. 这些数据具体是关于什么的？\n4.\
  \ 使用什么数据结构来存储这些数据？\n5. 我们可以修改给定的数据结构吗？还有很多很多……\n\n答案：\n\n1. 是的，它们是 `integer`。\n\
  2. 可能是几千个。\n3. 它们存储人的年龄。\n4. 数据是以数组的形式提供的。\n5. 不，你不能修改提供的数据结构。\n\n好的，从第一个答案我们可以推断数据是\
  \ `integer`。数据并不大，只包含几千条记录。第三个答案很有意思，我们此推断出数据范围是 1-150。数据以数组形式提供。从第五个答案我们推断出必须创建自己的数据结构，而不能修改提供的数组。所以最后得出结论，我们可以直接使用桶排序来排序数据。范围只是\
  \ 1-150，所以我们只需要一个容量为 151 的整数数组。数据在千以内，所以我们不需要担心数据溢出，我们在线性时间 `O(N)` 内得到解决方案。\n\n\
  # 第 23 章：系统设计\n\n## 系统设计\n\n我们将介绍这类面试官要求设计任何软件系统的高层架构的问题。\n\n**注意**：这是一个高级章节，用户可能无法完全理解。我建议花些时间阅读这一章节，并尝试在线阅读。你在这个章节上花费的时间越多，理解得越深。进行多轮阅读可能也会帮助。\n\
  \n这里有两种类型的问题，问到哪种取决于公司的类型。第一类问题是设计某种电梯系统、代客泊系统等。在这些情况下，面试官只是想测试你设计系统的能力如何，特别是你的类之间的交互表现得如何。\n\
  \n第二类系统设计问题更有趣，面试官要求你设计某种网站、某种服务或某些 API 接口。例如，设计 Google 搜索引擎或设计 Facebook 的某些功能（如\
  \ Facebook 上如何进行朋友关系映射），设计一个允许 4 人玩扑克游戏的网页游戏等。这些很有趣，而且面试官可以询问关于可扩展性方面的问题。\n\n现在脑海中出现了一个问题，你如何在\
  \ 10-15 分钟内设计 Google 搜索引擎？答案是你做不到。一群聪明的工程师设计 Google 搜索引擎需要很多，甚至数年。面试官期望的是系统的更高级层架构，能够处理给定的用例和手头问题的限制条件。没有唯一的正确答案。同一个问题可以用多种方法解决。最重要的是，你应该能够为你的解决方案提供合理的理由。\n\
  \n## 系统设计流程\n\n让我们来看解决系统设计问题的 5 步法：\n\n1. 用例生成（Use Cases）\n2. 限制条件与分析\n3. 基础设计\n\
  4. 瓶颈\n5. 可扩展性\n\n### 用例\n\n就像算法设计题一样，系统设计问题也可能定义得很模糊。缺失了大量信息，没有这些信息，设计是不可能的。因此，设计过程中的首要任务是你应该收集所有可能的用例。你应该向面试官提问以找到系统的用例。面试官想看到你的**需求收集能力**。和算法题一样，永远不要假设未说明的事项。\n\
  \n### 限制条件与分析\n\n在这一步中，你将定义系统的各种限制条件并对其进行分析。你的系统设计将取决于你在这一步中进行的分析。在这一步中，你需要找到这类问题的答案：有多少用户将使用该系统？我们要存储什么的数据？等等。\n\
  \n### 基础设计\n\n在这一步中，你将设计系统的最基础设计。画出你的主要组件并在它们之间建立连接。在这一步中，你需要设计一个假设没有限制且所有数据都能放入机器的系统。你应该为你的想法提供理由。在这一步中，你需要处理所有的用例。\n\
  \n### 瓶颈分析\n\n在这一步中，你将发现你提出的基础设计中的一个或多个瓶颈。下文的可扩展理论有助于识别瓶颈。你需要了解专家随时间发展的以下理论。在这一步中，你将考虑你提出的系统可以处理多少数据、内存限制等。\n\
  \n### 可扩展性\n\n在这一步中，你将移除系统的所有瓶颈，然后完成。在“瓶颈分析”和“可扩展性”之间可能会有多次迭代，直到我们达到最终解决方案。我们在本章中学习各种概念，如垂直扩展、水平扩展、负载均衡、冗余和缓存。下文的可扩展理论将帮助你理解这些概念。\n\
  \n### 可扩展性理论\n\n在本节中，我们将设计一个通用的 Web 服务器，它将处理大量的请求。你可以将其想象为像 Facebook 这样的网站，大量用户正在访问它。\n\
  \n![](img/image01165.jpeg)\n\n### 垂直扩展\n\n垂直扩展意味着向现有机器添加更多资源（更快的 CPU、更大的内存等）来扩展扩展。\n\
  \n垂直扩展有其局限性，它可以帮助你处理更多负载，但在达到其限制之前，我们必须转向水平扩展。\n\n### 水平扩展\n\n水平扩展意味着向你的资源池中添加更多机器来扩展扩展。\n\
  \n通过在多个 Web 服务器之间分发请求来分配负载。这样做我们需要一个负载均衡器，它将在服务器之间分发请求。\n\n### 负载均衡（应用层）\n\n负载均衡器必须决定由哪个服务器处理下一个请求。因此，可以使用不同的策略来分发负载：\n\
  \n\n\n\n\n### 1) `Round Robin`: 轮询算法是一种按顺序分发请求的方法。请求被发送到服务器 `1`，然后下一个请求发送到服务器 `2`，依此类推，直到到达服务器列表的结尾。当我们到达结尾时，它再次发送到服务器\
  \ `1`。轮询算法存在的问题是，已经繁忙的服务器可能会接收另一个请求。轮询算法在会话保持（sticky sessions）方面也存在问题。我们希望下次请求发送到同一个服务器。\n\
  \n### 2) 另一种方法是选择对应数据哈希值的服务器。找到数据的哈希值，哈希值对服务器数量取模。将任务分配给取模后得到的值的机器。哈希值方法已经解决了会话保持问题。然而，存在负载分布不均的问题，可能会有更多负载被发送到一个已经繁忙的服务器。\n\
  \n### 3) 负载均衡器可能知道每个服务器负载多少负载，或者每个服务器有多忙。此外，它会将下一个请求发送给最不忙的服务器。\n\n### 4) 服务器可以是专门的，某些提供图像，某些提供视频，某些提供其他数据。\n\
  \n![](img/image01166.jpeg)\n\n### 负载均衡的问题\n\n考虑一个在亚马逊购物车中选择了一些物品的客户。当他选择另一个物品时，它应该被添加到同一个购物车中，因此它应该发送到同一个服务器。同样，保存到一个服务器上的用户配置，如果用户请求到达另一个服务器，他的个人配置将是空的，这也是一个不好的主意。\n\
  \n这个问题可以通过让负载均衡器决定特定的用户请求始终流向到同一个服务器来解决。用户配置和购物车详情应该保存在某些数据库中。\n\n**会话保持 (Stick\
  \ session)**：相同的会话应该引导到同一个服务器。如何实现这一点？第一种方法是将负载均衡返回的 IP 地址存储在 cookie 中，然后在后续请求中使用该\
  \ IP 地址。然而，这向世界暴露了服务器的 IP 地址，而我们并不希望这样做。因此，另一种解决方案是使用某些会话 ID，负载均衡器知道该 ID 属于哪个服务器。通过这种方式，我们防止了服务器暴露在外部世界，并防止受到攻击。\n\
  \n### 负载均衡器（数据库层）\n\n1. 最基本的方法是 `Round Robin`。数据以循环方式分布。首先，数据进入第一个数据库，第二个将进入第二个数据库，依此类推。每个数据库服务器的负载相等。然而，它的缺点是数据查询很复杂，并且需要一个巨大的查找表。\n\
  \n2. 另一种方法是对数据进行划分，所有数据进入第一台机器，直到其达到最大容量。当达到最大容量时，数据进入第二台机器，依此类推。这种方法的优点是只使用了所需的机器数量。然而，它的缺点是数据查询很复杂，并且需要巨大的查找表。\n\
  \n3. 另一种方法是选择对应数据哈希值的数据库。找到数据的哈希值。哈希值对数据库数量取模。数据然后存储在取模后得到的数据库值中。对于哈希值方法，我们不需要任何查找表。我们可以通过寻找哈希值来找到存储数据的数据库。然而，存在数据分布不均的问题，可能会有更多数据被发送到一个已经达到最大容量的数据库。在这种情况下，我们需要找到一个更好的负载均衡键，或者将数据从数据库拆分成多个数据库。\n\
  \n4. 在基于哈希值的数据分布中，存储在特定数据库中的数据之间没有关系。关于数据的信息可以用于使数据库访问更快。例如，在像 Facebook 这样的社交网络中，住在印度的人更有可能有来自印度的朋友。而居住在美国的人更有可能有美国的朋友。\n\
  \n5. 也许位置感知（方法 4）和基于哈希值（方法 3）的数据分布方法可能是存储数据的最佳方法，这样可以利用这两种方法的优点。国家代码和用户 ID 可以用于获取数据库的位置。\n\
  \n### 冗余\n\n我们的系统中有一个问题，服务器之间存在冗余，但我们的负载均衡器现在是我们的单点故障。我们添加了一个备用负载均衡器以防主负载均衡器失效，此时备用负载均衡器将成为主均衡器，然后所有请求将由它处理。\n\
  \n![](img/image01167.jpeg)\n\n**RAID (冗余磁盘阵列)**：RAID 是一项在数据库中创建冗余的技术。使用多个硬盘来复制数据，从而提供冗余。\n\
  \n### 缓存\n\n缓存是一个简单的键值存储器，它应该作为你的应用程序和数据存储之间的缓冲层存在。每当你的应用程序想要读取数据时，它首先尝试从缓存中检索数据。只有当缓存不存在数据时，它才会尝试从主数据库获取数据。\n\
  \n缓存通过将部分数据存储在内存中进行低延迟访问，提高了应用程序的性能。我们需要数据库而访问数据库很慢，所以我们使用多种类型的缓存使我们的系统更快。数据库服务器本身进行缓存，用户和数据库之间的其他实体也是如此。\n\
  \n**Memcached**：这是一个服务器软件，它的作用是将你访问的任何内容保存在内存中。它可以运行在同一台服务器上，也可以运行在单独的机器上。Redis：它是一个基于\
  \ `NoSQL` 的数据结构服务器，是一个键值存储器。Redis 用于缓存时，存储整个对象可以让我们更接近 Web 服务器。\n\n由于内存有限，缓存会满。过期的对象将被删除，所有被访问的对象过期时间将重置，如果一段时间未未使用则被删除。当我们设计的网站读多写少时，缓存更为重要。\n\
  \n![](img/image0168.jpeg)\n\n### 完整的 Web 服务器实现\n\n上述系统的总结。\n\n1. 可扩展 Web 服务的服务器隐藏在负载均衡器后面。负载均衡器将负载均匀分布到所有服务器。\n\
  \n2. 无论哪个服务器实际服务，用户都应该获得相同的结果。因此，每个服务器应该是相同的。服务器不应包含会话信息或用户配置。\n\n3. 会话需要存储在集中数据存储器（DB）中，所有服务器都可以访问。数据可以存储在某些外部数据库中。数据库冗余由\
  \ RAID 技术提供。\n\n4. 数据库很慢，所以我们需要缓存。基于内存的缓存如 Redis 或 Memcached。\n\n5. 然而，缓存存在过期问题。当表更改时，缓存就过时了。\n\
  \n6. 对于 Memcached 有两种选择：\n\na. 我们可以保存查询到数据库\n\nb. 我们可以保存整个对象以让我们更接近 Web 服务器。\n\n\
  7. CDN（内容分发网络）可以用于提供预处理的 Web 页面。\n\n下面的图表将为你提供整个系统的完整视图。\n\n![](img/image0169.jpeg)\n\
  \n\n\n\n\n# 设计一个简化的 Facebook，用户可以添加其他人为好友。此外，用户可以发布消息，且这些消息会在他们朋友的页面上显示。设计应能够处理\
  \ 1000 万用户。平均每人有 100 个朋友。每人平均每天发布大约 10 条消息。\n\n### 用例\n\n1. 用户可以创建自己的个人资料。\n2. 用户可以将其他用户添加到自己的好友列表中。\n\
  3. 用户可以在自己的时间线（timeline）发布消息。\n4. 系统应该在展示板/时间线上显示朋友的消息。\n5. 人可以对消息点赞。\n6. 人可以将朋友的消息分享到自己的自己的展示板/时间线上。\n\
  \n## 约束条件\n\n1. 将整个个人网络考虑为一个图。每个人是一个节点，每种好友关系是图的一条边。\n2. 独立用户/节点总数：1000 万。\n3. 图中独立好友关系/边总数：`100\
  \ * 1000 万`。\n4. 单个用户每天发布的消息数：`10`。\n5. 整个网络每天发布的消息总数：`10 * 1000 万`。\n\n## 设计\n\n\
  我们的系统架构分为两个部分：\n\n1. 首先是处理所有传入请求的 Web 服务器。\n2. 第二是数据库，用于存储所有用户的个人资料、好友关系和帖子。\n\n\
  ![](img/image01170.jpeg)\n\n首先，创建个人资料、添加好友、发布消息这三个需求向数据库写入了一些信息。而最后的操作是从数据库读取数据。\n\
  \n系统将如下所示：\n\n1. 每个用户将有一个个人资料。\n2. 每个用户的个人资料中都有好友列表。\n3. 每个用户都有自己的主页，其帖子在那里可见。\n\
  \n用户可以对其朋友的任何消息点赞，这些点赞将反映在其朋友分享的实际消息上。\n\n如果用户分享了某个帖子，该帖子将被添加到用户的主页，用户的所有其他朋友会将此帖子视为一条新动态。\n\
  \n## 瓶颈\n\n每天发布的请求数量为 1 亿次。大约每秒发布 1000 次请求。负载分布将不均匀，因此我们设计的系统能够处理每秒几千次请求。\n\n##\
  \ 可扩展性\n\n由于负载很重，我们需要进行水平扩展，许多 Web 服务器将处理请求。在此过程中，我们需要一个负载均衡器，它将在服务器之间分发请求。\n\n\
  ![](img/image01171.jpeg)\n\n这种方法赋予了我们活性，当负载增加时，我们可以添加更多的 Web 服务器来处理增加的负载。\n\n这些\
  \ Web 服务器负责处理用户添加的新帖子。它们负责生成各种用户主页和时间线页面。在我们的图中，客户端是 浏览器，它为用户渲染页面。\n\n我们需要存储用户资料、用户好友列表、用户生成的帖子、用户对帖子的赞状态的数据。\n\
  \n让我们计算存储所有这些数据需要多少存储。用户总数为 1000 万。假设每个用户使用 Facebook 5 到 6 年，那么一个用户在整个时间内产生的帖子总数大约为\
  \ 2000 亿（或 200 十亿）。假设每条消息由 100 个单词或 500 个字符组成。假设每个字符占用 2 字节。\n\n总所需内存 = `20 * 500\
  \ * 2000 亿 bytes`\n= `20000 亿 bytes`\n= `20000 GB`\n= `20 TB`\n\n1 吉字节 (GB) = 10\
  \ 亿字节\n1000 吉字节 (GB) = 1 太字节 (TB)\n\n大部分内存被帖子和用户资料占用。\n\n## 实现细节与优化\n\n大部分内存被帖子和用户资料占用。\n\
  \n响应速度对于社交网站是关键。\n\n![](img/image01172.jpeg)\n\n用户资料更新不频繁，因此读多写少。所以单写入者-多读者架构最适用于此应用程序。\n\
  \n应用程序服务器可以处理数据；可以通过积累待处理的用户列表来进行优化，减少对数据库的查询。\n\n```java\nclass system {\n    private\
  \ map<int, int> personIdToMachineId;\n    private map<int, Machine> machineIdToMachineMap;\n\
  \n    Machine getMachine(int machineId);\n\n    Person getPerson(int personId) {\n\
  \        int machienId = personIdToMachineIdMap[personId];\n        Machine m =\
  \ machineIdToMachineMap[machienId];\n        return m.getPersonWithId(personId);\n\
  \    }\n}\n```\n\n![](img/image01173.jpeg)\n\n### 数据库架构\n\n| 表 Users | User Id |\
  \ First Name | Last Name | Gender | Birthday |\n|---|---|---|---|---|---|\n| 表 Posts\
  \ | Post Id | Author Id | Date of Creation | | |\n| 表 Friends | Relation Id | Friend\
  \ Id | Second Friend Id | | |\n| 表 Likes | Id | User Id | | | |\n\n\n\n\n\n# 优化\n\
  \n通过首先查找个人位于同一台机器上的朋友列表来减少跳转次数。然后发送“查找下一度朋友”的查询，这将返回下一层朋友列表。通过这种方式，这项工作被分布在不同的机器上。最后，将各种查询的结果进行合并，然后推荐朋友列表。\n\
  \n更好的结果：你可以根据朋友列表计算朋友的“度”。一个我许多朋友的朋友，比一个仅仅只是我某一个朋友的人更有可能成为我的朋友。我们需要通过为朋友列表维护一个 `Hash-Table`\
  \ 来跟踪朋友的引用计数，每当我们发现一个新人时，将计数设为 `1`，否则将计数加 `1`。\n\n如果我们想利用缓存，则需要在中间添加一些数据库缓存。\n\n\
  ![](img/image01174.jpeg)\n\n可能会有多个 Web 服务器，它们将查询数据库，并且会有多个用户访问他们的 Facebook 个人页，每一个人都会收到新的朋友列表，因此最终架构与可扩展性理论中实现的完整\
  \ Web 服务器的方案相同。\n\n# 设计一个类似 Bitly 的短链接服务\n\n### 用例\n\n基础用例：\n1. 缩短：接收一个 URL 并返回一个短\
  \ URL。\n2. 重定向：接收一个短 URL 并重定向到原始 URL。\n3. 自定义 URL。\n4. 系统的高可用性。\n\n额外用例：\n1. 分析\n\
  2. 链接自动过期。\n3. 手动删除链接。\n4. 特定公司的 URL。\n5. UI 或仅限 API。\n\n### 需求分析/数学计算\n\n首先我们需要找到使用模式。\n\
  \n你可以直接向面试官询问这些数据，或者使用面试官提供的一些数据进行推导。假设面试官告诉每月会有 10 亿次请求。此外，其中 `10%` 的情况是新请求，`90%`\
  \ 的情况是对已缩短 URL 的重定向。让我们记录下得到的数据。\n\n1. 每 `1BN` 请求。\n2. `10%` 用于新 URL/缩短，`90%` 用于重定向。\n\
  3. 每月新 URL 为 `100MLN`。\n4. 每秒请求数：`1BN/ (30*24*3600) = 385`。大约可以假设为每秒 `400` 次请求。\n\
  5. 5 年内存储的 URL 总数：`5* 12* 100 MLN = 6BN` 个 URL。\n6. 假设每个 URL 需要的空间为 `500bytes`。\n\
  7. 假设每个对应 URL 的 `Hash` 代码所需的空间为 `6byte` 长。\n8. 五年内需要存储的总数据：所有 URL 为 `3TBs`，哈希为 `36gb`。\n\
  \n```\n6,000,000,000 * 500 bytes = 3 terabytes\n6,000,000,000 * 6 bytes = 36 gigabytes\n\
  ```\n9. 每秒新数据写入请求：`40 * (500+6): 20k`\n\n### 基础设计\n\n**Web 服务器**：为 Bitly 服务提供网站，用户可以在那里生成短\
  \ URL。\n\n**应用服务器**：提供以下服务：\n1. 缩短服务\n2. 重定向服务\n3. `Key = Hash Function(URL)`\n\n\
  **数据库服务器**：\n1. 跟踪哈希到 `URL` 的映射。\n2. 像一个巨大的 `Hash-Table` 一样，存储新映射并根据 `key` 获取旧映射。\n\
  \n### 瓶颈\n1. 流量不大。\n2. 数据存储可能是一个问题。\n\n### 可扩展性\n\n**应用服务器**：\n1. 从单机开始。\n2. 测试它能支撑多大程度。\n\
  3. 进行一段时间的垂直扩展？\n4. 添加负载均衡器和机器集群来处理峰值流量并提高可用性。\n\n**数据存储**：\n1. 数十亿个对象。\n2. 每个对象都较小。\n\
  3. 对象之间没有关系。\n4. 读多写少。\n5. `3TBs` 的 URL 和 `36GB` 的哈希。\n\n**MySQL**：\n1. 广泛使用。\n\
  2. 技术成熟。\n3. 清晰的扩展范式（`master/slave`、`master/master`）。\n4. 被 Facebook、google、twitter\
  \ 等使用。\n5. 索引查询非常快。\n\n**映射**：`<Hash, URL>`\n1. 仅使用带有两个字段的 `MySQL` 表。\n2. 在我们想要在内存中保留的\
  \ `hash` 上创建唯一索引以加速查找。\n3. `6,000,000,000 * 500 bytes = 3 terabytes`\n4. `6,000,000,000\
  \ * 6 bytes = 36 gigabytes`\n\n# 股票查询服务器\n\n实现一个可以提供开盘价、收盘价、最高价、最低价的股票查询。\n\n###\
  \ 用例\n\n会有数千个用户。\n1. 添加股票的第一个接口。\n2. 根据 `stock id` 读取股票的第二个接口。\n\n### 限制\n\n假设系统将被用户使用。每天只有一个写操作。\n\
  \n### 基础设计\n\n我们可以使用像 SQL 的数据库来存储数据。上面的架构将展示基础。\n\n![](img/image0175.jpeg)\n\n在上述架构中，用户可以使用\
  \ Web 服务访问数据库。例如，某些月份的最高是多少。\n\n### 可扩展性\n\n由于我们有数千个用户，因此单个 Web 服务器和单个数据库是不可扩展的。我们需要将数据分布在\
  \ N 个分区中。此外，多个 Web 服务器将位于某些负载均衡器之后。每个负载均衡器都需要提供一些冗余，因为它们是单点故障。最后，解决方案将如下图所示。（详情请参见可扩展性理论）\n\
  \n![](img/image0176.jpeg)\n\n# 设计一个基础搜索引擎数据库\n\n你被给了数百万个 URL；你会如何创建你的数据库，以便给定一个单词查询字符串，如何找到包含查询字符串中所有单词的\
  \ URL。单词可以任何顺序出现。\n\n### 用例\n1. 我们拥有数百万个 URL。\n2. 系统用户提供查询字符串。我们需要返回包含查询字符串中所有单词的\
  \ URL。\n3. 它是某种搜索引擎，所以我们可以预处理数据并构建我们的数据库。\n\n### 需求分析\n\n在需求步骤中，你需要找出有多少用户将使用这个搜索引擎。在我们的案例中，假设没有很多用户使用我们的系统，因此我们主要关注的问题是数据库。\n\
  \n也许我们有 N 台机器可以加速我们的数据预处理。\n\n### 基础设计\n\n在这一步中，我们将进行基础设计，让我们用几个 URL 构建一个运行的系统。你如何从给定的\
  \ URL 中找到包含输入查询字符串所有单词的所需 URL？\n\n我们可以创建一个 `Hash-Table`，其中单词是键，文档 ID 是值。\n\n`Hello`\
  \ -> `{url1, url2, url3}`\n`World` -> `{url2, url4, url5}`\n\n\n\n\n要搜索包含“hello\
  \ world”的文档，我们可以找到这两个列表的交集。此外，`url2` 就是结果。\n\n### 瓶颈\n\n在这一步中，我们回到最初的问题，即有数百万个 `URLs`\
  \ 需要我们进行预处理。可能会有很多不同的单词，因此可能无法将整个 `Hash-Table` 保留在单台机器上。因此，我们需要划分 `Hash-Table` 并将其保存在单独的机器上。\n\
  \n我们需要高效地检索与给定单词匹配的 `URLs`，这样我们才能找到它们的交集。\n\n通过单台机器处理所有数百万个 `URLs` 会非常慢。我们需要找到一种并行处理预处理步骤的方法。\n\
  \n### 可扩展性\n\n让我们来看看在不同数据库中维护 `Hash-Table` 的问题。一种解决方案是按字母顺序划分单词。我们可以为每个单词创建创建的表。每个数据库包含某些范围内的单词表。例如，`DB1`\
  \ 包含所有以字母“a”开头的单词，`DB2` 包含所有以字母“b”开头的单词，以此此类推。数据存储在数据库中，当某个数据库达到最大容量时，数据将存储到下一台机器，并建立一种树形结构。找到与某些单词对应的\
  \ `URLs` 列表很容易，我们可以去相应的数据库找到该表并获取该表的所有数据。最后，我们可以对各种单词的结果取交集。此外，结果将作为输出给出。\n\n用单台机器处理数百万个\
  \ `URLs` 速度很慢。因此，我们可以将大量的 `URL` 处理任务分配给 `N` 台机器，每个 `URL` 处理都是相互独立的，最终的 `URLs` `Hash-Table`\
  \ 最终可以被合并。。这种处理独立数据并最终合并结果的方法被用于 `MapReduce` 中。\n\n`MapReduce`：`MapReduce` 将输入数据集划分为独立的块，并进行并行处理。然后将它们的输出合并以得到结果。\n\
  \n![](img/image01177.jpeg)\n\n### 百万文档中的重复整数\n\n给定数百万个具有不同数字的文档，找到出现多次的数字。\n\n####\
  \ 基本设计\n\n假设只有几个数字，我们想要找到重复的数字。\n\n第一个方法是维护一个排序后的数字列表，查看下次读取的数字是否与列表中的某个数字匹配。\n\n\
  另一种更好的方法是找到与数字对应的哈希值，并将该数字添加到 `Hash-Table` 中。\n\n#### 限制\n\n数百万文档且数字没有范围，因此我们无法将所有内容保存在内存中。\n\
  \n#### 可扩展性\n\n我们可以找到所有整数的哈希值，然后将该整数添加到其对应的哈希值文件或数据库中。如果有重复，它们将落在同一个文件中。在第一遍遍历中，会创建各种文件并分配整数。\n\
  \n在第二遍遍历中，可以将所有单个文件的数据加载到内存中并进行排序，以找到是否存在重复值。\n\n我们可以使用上述相同的技术，通过不同的机器并行处理各种整数文档，然后合并它们的输出以更快地获得结果。\n\
  \n### 设计一个基础搜索引擎缓存\n\n给定一个搜索引擎数据库实现，它支持 `QuerySearch()` 函数，该函数将根据查询单词返回最佳的 `URLs`\
  \ 列表。这次你需要为该功能设计 Web 服务器实现，使得有 `N` 台 Web 服务器响应用户查询。可以随机选择任一个 Web 服务器。`QuerySearch()`\
  \ 是一个耗时操作，因此你需要为该系统设计缓存，以减少对数据库的访问。\n\n### 用例\n\n1) 系统用户将提供查询字符串，系统将返回与其请求匹配的 `URLs`\
  \ 列表。\n2) 鉴于数据库操作非常耗时，我们需要通过在 Web 服务器上缓存查询来最小化这些操作。\n3) 我们需要将频繁查询保留在缓存中，并从缓存中移除过期查询。\n\
  4) 我们需要为每个查询提供某种适当的刷新机制。\n\n#### 基本设计\n\n让我们暂时忘记 N 台机器，假设 `QuerySearch()` 操作发生在单台机器上。现在我们想要缓存查询。每个查询将由某些字符串组成。查询的结果是一个\
  \ `URLs` 列表。\n\n我们需要一个快速的缓存查找，以便如果缓存中存在，我们可以从缓存中获取查询结果。此外，还需要为每个查询提供某种适当的刷新机制。\n\
  \n`Hash-Table` 是保留缓存最有效的方法。通过哈希，表查找非常快。但是，如果缓存满了，你如何从缓存中移除最少使用的数据呢？\n\n可以使用链表来删除旧数据。你可以使用双向链表来管理旧数据的删除。每当数据被访问时，它可以移动到链表的前端，并在链表的末尾进行删除。\n\
  \n利用这两种方案的优点，可以将缓存保留在链表中，并将其引用添加到 `Hash-Table` 中。\n\n现在最后一个问题是在数据过期时如何删除数据。例如，最频繁访问的查询结果将始终留在链表中，即使该结果已经发生变化，如果再次从数据库访问它，它将提供某些更新后的结果。对于这一点，我们需要为每个查询关联一个\
  \ `TTL`（生存时间），取决于我们从每个查询中获得的 `URLs` 结果。例如，某些天气或即时新闻相关的查询应该具有特定的 `TTL`。\n\n#### 瓶颈\n\
  \n有 `N` 台不同的服务器。任何特定的查询都可以由任何服务器提供。\n\n数据访问应该是快速的。\n\n#### 可扩展性\n\n我们可以考虑的各种解决方案有：\n\
  \n方案一：\n\n服务器可以拥有自己的缓存。如果某个查询发送到 `Machine1`，它会被捕获；当相同的查询再次发送给它时，它将从缓存返回。然而，如果某个查询发送到\
  \ `Machine2`，它将再次执行数据库查找并将其缓存到自己的缓存中。这种实现并不是最优的，因为它执行数据库查找次数大于所需的。\n\n方案二：\n\n另一种方法是每台机器存储相同的缓存。每当发生数据库访问时，所有\
  \ Web 服务器都会更新相同的缓存。这种方法的缺点是所有缓存都存储相同的数据，因此浪费了宝贵的缓存空间。\n\n方案三：\n\n在这种方法中，我们将划分缓存，使得每个\
  \ Web 服务器持有缓存的不同部分。当查询到达某个 Web 服务器时，它知道哪台 Web 服务器实际上持有该查询的缓存，或者至少知道哪台服务器应该保留该查询的缓存。\n\
  \n为了实现这一点，我们需要一种基于哈希的方法。我们通过对哈希（查询）取模 N 来找到服务的服务器。\n\n当查询请求到达某个 Web 服务器时，它通过应用公式向特定的服务器请求\
  \ `QuerySearch()` 函数。该服务器反将根据需要查询数据库或从自己的缓存中提供结果。\n\n\n\n\n此外，结合链表和 `Hash-Table`\
  \ 被用于维护缓存，以便在缓存几乎满额时剔除访问频率较低的数据。\n\n作为进一步的改进，我们可以考虑某种地理位置感知的 Web 服务器选择和缓存策略，使得与印度相关的查询更多在印度完成，而与中国查询查询则更多地来自中国。\n\
  \n## Zomato\n\n### 用例\n\n1. 给定一个位置，需要显示该地区的酒店列表。\n2. 给定一个酒店名称，需要显示该酒店的评分、评论和菜单。\n\
  3. 应该有一个选项可以查找酒店是否有外送服务。\n4. 应该有一个选项可以根据素食/非素食类别选择酒店。\n5. 应该有一个选项可以选择提供酒精的酒店。\n\
  6. 用户应该能够添加评论，为酒店添加个人评分。\n7. 用户拥有账户或可以以访客身份访问。\n8. 用户/管理员应该能够向系统添加新酒店。\n\n### 限制条件\n\
  \n1. 每秒查询数，假设每秒 100 次查询。\n2. 读取次数多于写入次数。\n3. 90% 的时间是读取操作，只有 10% 的时间是写入操作。\n4. `100\
  \ * 60 * 60 * 24 = 8,640,000`\n\n### 基础设计\n\n![](img/image01178.jpeg)\n\n可扩展性与上述基础\
  \ Facebook 案例中的示例相同。相同的冗余、负载均衡、可扩展性等概念。\n\n### 抽象设计\n\n每家酒店都有与其关联的 `hotel id`。\n\
  \n1. 酒店的数据可以是名称、地址、评分、评论列表、素食/非素食以及酒精等。\n2. 是地址中的一个字段。\n3. 搜索：当用户进行基于区域的查询时，需要向用户显示该区域的所有酒店记录。\n\
  4. 搜索：用户应该能够搜索特定的酒店。\n5. 添加评论/评分：当用户评估酒店时，他应该能够为酒店添加评论和评分。\n6. 显然，图片存储在 CDN 中。\n\
  \n#### 应用服务层\n\n1. 从较少的机器开始。\n2. 随着时间的推移，使用所有负载均衡器 + 一群机器。\n3. 流量峰值处理。\n4. 高可用性。\n\
  \n#### 数据存储层：\n\n1. 数千家酒店。\n2. 对象之间没有关系。\n3. 读取多于写入。\n4. 关系型数据库选项是 `MySQL`。\n5.\
  \ 广泛使用。\n6. 清晰的扩展范式。（主-主复制，主-从复制）\n7. 索引查找非常快。\n\n一种优化方法是为酒店分配一个 `id`，该 `id` 可以从地区推导出，这样更容易找到该地区的酒店。\n\
  \n## YouTube\n\n### 场景\n\n1. 用户拥有根据其显示内容的配置。\n2. 当用户打开 YouTube 网页时，显示内容缩略图。\n3.\
  \ 当用户点击某个缩略图时，视频将在 flash 播放器上播放。\n\n### 限制条件\n\n1. 数百万用户将使用此服务。\n2. 每天提供 2 亿次视频请求。\n\
  3. 读取多于写入。\n\n### 设计\n\n1. YouTube 需要提供海量视频，为此它拥有视频服务集群。单个视频可以从集群中的多个服务器提供，并从多个集群提供，从而分配磁盘读取，提高系统性能。\n\
  2. 最热门的视频从 CDN 提供，CDN 更贴用户，可以减少响应时间，并减轻视频服务集群的负载。\n3. 视频的其余元数据从其他服务器提供，因为用户对元数据并不感兴趣。\n\
  4. 应用程序的其他部分将相同，将会有应用服务器、数据库服务器、负载均衡器、缓存等。\n5. 读取多于写入，因此将使用主服务器拓扑。因此，可以有一个主节点用于写入和多个从机用于读取。\n\
  6. 主数据复制到从机。由于从机与主机相同，如果主机宕机，从机可以提升为主机。\n7. 显示给用户的页面取决于他订阅的页面、历史等。\n8. 信息缓现在数据库负载均衡器附近实现的\
  \ `Memcached` 中。\n\n![](img/image01179.gif)\n\n## 设计 IRCTC\n\n### 场景\n\n1. 用户应该能够查询两个站之间的火车。\n\
  2. 查询应该基于日期、配额、出发站和到达站。\n3. 用户应该能够从上述查询获取的火车列表中查看余票情况。\n4. 用户应该能够为可用座位订票。\n\n###\
  \ 限制条件\n\n1. 将会有大量人员请求该服务。让我们假设人口的 0.01% 每天使用一次。\n2. 应该提供地理冗余。\n3. 读取查询/请求多于写入请求。\n\
  \n### 设计\n\n1. 这里也可以使用扩展性理论主题中的基础架构。\n2. 应该有大量的服务器为用户提供服务。\n3. 应该在多个地理位置有多个服务器以提供地理冗余。数据库应该在这些多个地理位置复制。在特定区域内也可能有多多个服务器。\n\
  4. 有大量的读取查询，用户通常查询想要订的座位。读取多于写入，所以使用主-从架构。\n5. 查询可以缓存；旧数据即可。\n6. 所有搜索都将由从服务器处理。\n\
  7. 只有获得锁后才能订票。\n8. 每个站都有配额，并从中分配。第一个符合条件的分配该座位。\n9. 使用负载均衡器来分配流量。\n10. 可能有多个服务器向主服务器请求预约令牌。主服务器为该服务器分配令牌并预留一段时间。当所有用户信息填写并完成支付后，才会根据用户偏好分配真实座位。\n\
  11. 从服务器处理请求直到结束。带有用户支付和完整信息的最终请求将发送到主服务器并锁定相应的机票。\n\n## 闹钟\n\n如何设计一个闹钟？\n\n###\
  \ 用例\n\n闹钟应该拥有钟的所有功能。能够显示时间。\n用户可以设置闹钟时间。\n用户可以重置闹钟。\n用户可以设置闹钟。\n\n### 限制条件\n\n\
  闹钟的粒度可以是 15 分钟。\n\n### 测试用例\n\n在早上 6:00 设置闹钟并设置。\n闹钟应该在 6:00 工作。\n停止闹钟，闹钟应该停止响铃。\n\
  \n### 设计\n\n可以有一个 `clock` 类，用于管理时间和向屏幕显示时间。\n它有 `getTime()` 和 `setTime()` 函数。\n\
  `Alarm Clock` 继承自 `Clock`，并有一些更多函数如 `startAlarm()`、`stopAlarm()`、`setAlarmTime()`、`ring()`。\n\
  \n![](img/image01180.jpeg)\n\n### 实现\n\n一个定时项将按 15 分钟的粒度运行。或者每分钟一次，取决于客户需求。\n它将检查\
  \ `当前时间 == 闹钟时间`，如果是则响铃。并且闹钟是开启的，\n如果调用 `start Alarm`，它将设置闹钟开启。\n\n\n\n\n\n如果调用\
  \ `stop alarm`，它将关闭报警。\n\n# 楼大电梯设计\n\n### 场景\n\n典型的电梯在轿厢内有按钮（`Elevator buttons`），让进入电梯的用户选择他们想要的楼层。同样，每层楼都有按钮（`Floor\
  \ buttons`），用于召唤电梯前往上方楼层或下方楼层。按钮会亮起表示请求已接受。此外，当电梯到达请求楼层时，按钮会停止亮起。\n\n用例：\n\n**用户**\n\
  * 按楼层按钮召唤电梯\n* 按电梯按钮移动到目标楼层\n\n**楼层按钮与电梯按钮**\n* 被用户按下时亮起\n* 按下时提交一个电梯请求\n\n**电梯**\n\
  * 根据指令向上/向下移动\n* 打开/关闭门\n\n### 设计\n每次按下按钮都会产生一个需要处理的电梯请求。这些请求中的每一个都在一个集中的地方进行跟踪。`Elevator\
  \ Requests` 是存储电梯请求的类，电梯可以使用不同的算法来调度这些请求。电梯由一个控制器类管理，我们称之为 `Elevator Controller`。`Elevator\
  \ controller` 类为电梯提供指令。`Elevator controller` 读取下一个要待处理和服务的电梯请求。![](img/image01181.jpeg)\n\
  \n`button` 是一个抽象类，定义了通用行为如 `illuminate`（亮起）、`doNotIlluminate`（不亮起）。`FloorButton`,\
  \ `Elevator Button` 继承自 `Button` 类型并定义了按下按钮时调用的 `placeRequest()` 方法。按下楼层按钮或电梯按钮时，请求会被添加到公共队列中。\n\
  \n`ElevatorController` 读取下一个请求并指示电梯下一步操作。\n\n#### 如何将其扩展到多部电梯？\n在单电梯场景下，有一个电梯、一个电梯控制器和一个存储楼层请求和电梯按钮请求的公共服务器。这些请求根据调度算法进行处理。\n\
  \n要将其扩展到多电梯场景，仍然有一个电梯控制器。基于楼层的请求可以由任何电梯服务，而电梯按钮请求将仅由该按钮所属的电梯服务。\n\n`FloorButton`\
  \ 的 `placeRequest()` 将请求添加到公共队列中，电梯控制器访问该队列并将请求分配给其中一台电梯。`ElevatorButton` 的 `placeRequest`\
  \ 将请求直接添加到电梯，因为它应该由该电梯服务。`Elevator controller` 将运行诸如最短寻（shortest seek）等算法，以决定哪部电梯应该处理哪个请求。\n\
  \n# 代泊停车系统\n\n设计一个代泊停车系统。\n\n### 用例\n代泊停车系统的需求应满足：\n1. 给定一个具有固定数量车位的 `Parking lot`。\n\
  2. 如果有空位，车辆可以进入该车位，然后将获得空位的方向指示。\n3. 出车时，必须支付车辆在车位内停留时间的费用。\n\n### 约束条件\n1. 停车位有多种尺寸——小型、中型和大型\n\
  2. 三种车辆：小型、中型、大型\n3. 小型车辆可以停在小型、中型或大型位上\n4. 中型车辆可以停在中型或大型位上\n5. 大型车辆只能停在大型位上\n\n\
  ### 设计与实现\n停车场场将具有以下接口：\n\n```java\npublic class parkingLot {\n    private Map<int,Space>\
  \ unreservedMap;\n    private Map<int,Space> reservedMap;\n    public boolean reserveSpace(Space)\
  \ {\n        // 它将查找未预留 map 中是否有空间\n        // 如果有，我们将选取该元素并\n        // 将放入预留 map\
  \ 中，带有当前时间值。\n    }\n    public int unreserveSpace(Space) {\n        // 它将查找预留 map\
  \ 中的条目。如果找到值，\n        // 我们选取该元素并将其放入未预留 map。\n        // 并返回当前时间值的费用单位。\n    }\n\
  }\n```\n\n# 麦当劳门店 OO 设计\n\n让我们从麦当劳门店如何工作的描述开始。\n1. 在麦当劳店内，`Customer` 选择汉堡并直接向收银员下单。\n\
  2. 在麦当劳店内，`Customer` 等待订单准备好的通知。`Customer` 在收到订单准备好的通知后自己去取汉堡。\n\n我们的场景中有三个不同的参与者，以下是他们执行的操作列表。\n\
  \n**顾客**\n1. 向收银员付款，获取令牌和收据\n2. 等待订单准备好的通知\n3. 收到订单准备好的通知后取汉堡并享受饮料\n\n**收银员**\n\
  1. 接受顾客的订单和付款\n2. 付款后，创建订单并将其放入队列\n3. 向顾客提供令牌\n\n**厨师**\n1. 从队列中获取下一个订单\n2. 准备汉堡\n\
  3. 将订单放入完成队列\n4. 发送订单准备好的通知\n\n![](img/image0182.jpeg)\n\n# 餐厅面向对象设计\n\n让我们描述餐厅是如何工作的。\n\
  1. 在餐厅里，服务员从顾客处点餐。\n2. 服务员等待订单准备好，一旦准备好就为顾客上菜。\n\n这些是模型中不同的参与者，我列出了每个参与者对应的操作：\n\
  \n**顾客**\n1. 从菜单选择菜肴并呼叫服务员\n2. 下单\n3. 菜肴上到盘子中后享受用餐\n4. 要账单\n5. 支付服务费\n\n**服务员**\n\
  1. 响应其负责区域的顾客呼叫\n- 接收订单\n- 将订单放入待处理队列\n- 等待订单准备好的通知\n- 收到通知后，取菜并为相应的顾客上菜\n- 接收顾客的账单请求\n\
  - 请求收银员准备账单\n- 将账单交给顾客并接受付款\n\n**收银员**\n1. 接受服务员针对给定订单详情提出的账单请求\n2. 准备账单并交给服务员\n\
  3. 接受服务员针对订单的现金\n\n**厨师**\n1. 从待处理队列中获取下一个订单\n2. 准备菜肴并将订单推入完成队列\n3. 发送订单准备好的通知\n\
  \n![](img/image0183.jpeg)\n\n餐厅类图。\n\n# 图书系统面向对象设计\n\n图书馆有一组书籍，用户可以在规定时间内借阅并归。如果用户觉得需要更多时间阅读书籍，可以选择延长归还日期。\n\
  \n用户与在线图书馆的典型操作为\n* 登录/注册\n* 搜索书籍\n* 借书\n* 续借\n* 还书\n* 查看个人资料\n\n在线图书馆必须跟踪图书馆当前可供用户借阅的不同书籍以及用户已借出的书籍。简单来说，需要管理库存。\n\
  \n系统的各个组件：\n1. 用户 (User)\n2. 图书管理员 (Librarian)\n3. 图书馆 (Library)\n4. 书籍 (Book)\n\
  5. 交易 (Transection)\n6. 事件管理器 (Event Manager)\n\n下方的类图描述了这些组件是如何相互工作的。\n\n![](img/image0184.jpeg)\n\
  \n\n\n\n\n用户与管理员（Librarian）交互，用户可以请求、归还或续借书籍。如果图书馆有该书籍，管理员将进行搜索并发放给用户。将创建一个 `Transection`（事务）并将其添加到\
  \ `Event Manager`（事件管理器）中。`Event Manager` 将支持 `add transaction` 添加事务和 `send return\
  \ request` 发送归还请求的接口。一旦书籍过期，事件管理器将向学生发送归还指示。当书籍续借时，图书馆的状态不会改变，但 `Event Manager`\
  \ 中的 `Transection` 详情会被更新。\n\n# 建议最短路径\n\n### 用例\n用户通过按名称搜索获取了一些坐标。\n\n以该坐标为中心显示整张地图。\n\
  \n建议两点之间的最短路径。\n\n### 约束条件\n所有路径的代价均为正数。\n\n为了简单起见，我考虑所有路径仅限车辆，不考虑行人（行人即使在单行道上也可以双向行走）。\n\
  \n### 设计\n整个城市地图以图的形式存储在 `google` 中。\n\n我们需要通过查看浏览器显示范围内的对象来查找地图。\n\n相同的路径以有向图的形式存储。需要渲染的图取决于缩放级别。该应用的优算法是\
  \ `a*`，用于获取最短路径。\n\n`Weight = h(x, y) + g(x, y)`\n\n## 练习\n\n1. 设计一个系统来实现类似于 `Facebook`\
