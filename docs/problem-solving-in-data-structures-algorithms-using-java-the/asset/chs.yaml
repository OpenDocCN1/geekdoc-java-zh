  \ `N` 个元素数组进行排序的整体 `Time Complexity` 是多少？\n\n\n\n解决冲突的一种方法是哈希表（Hash-Table）并找到另一个空槽来存放引起冲突的对象。一种简单的方法是某种顺序从一个槽移动到另一个槽，直到找到空位。这种冲突解决过程被称为开放地址法（Open\
  \ Addressing）。\n\n### 线性探测\n\n在线性探测中，我们尝试通过顺序搜索哈希表的空闲位置来解决索引的冲突。假设 `k` 是从哈希函数获取的索引。如果第\
  \ `k` 个索引已填充，我们将查找 `(k+1) %M`，然后是 `(k+2) %M`，以此此类推。当我们找到一个空槽时，我们将该对象插入到该空槽中。\n\n\
  **示例 12.2**：线性探测的解析函数\n\n```java\nint resolverFun(int i) {\n    return i;\n}\n```\n\
  \n### 二次探测\n\n在二次探测中，我们尝试通过二次方式增加搜索索引的空闲位置来解决索引的索引冲突。假设 `k` 是从哈希函数获取的索引。如果第 `k`\
  \ 个索引已填充，我们将查找 `(k+1²) %M`，然后是 `(k+2²) %M`，以此此类推。当我们找到一个空槽时，我们将该对象插入到该空槽中。\n\n**示例\
  \ 12.3**：二次探测的解析函数\n\n```java\nint resolverFun(int i) {\n    return i * i;\n}\n\
  ```\n\n表的大小应该是一个质数，以防止过早循环，且不应太接近 2powN。\n\n### 线性探测实现\n\n**示例 12.4：以下是线性探测解决冲突解决的哈希表实现。**\n\
  \n```java\npublic class HashTable {\n    private static int EMPTY_NODE = -1;\n \
  \   private static int LAZY_DELETED = -2;\n    private static int FILLED_NODE =\
  \ 0;\n    private int tableSize;\n    int[] Arr;\n    int[] Flag;\n\n    public\
  \ HashTable(int tSize) {\n        tableSize = tSize;\n        Arr = new int[tSize\
  \ + 1];\n        Flag = new int[tSize + 1];\n        for (int i = 0; i <= tSize;\
  \ i++) {\n            Flag[i] = EMPTY_NODE;\n        }\n    }\n}\n```\n\n表数组的大小为\
  \ 50，我们定义了两个常量值 `EMPTY_NODE` 和 `LAZY_DELETED`。\n\n```java\nint ComputeHash(int key)\
  \ {\n    return key % tableSize;\n}\n```\n\n这是最简单的哈希生成函数，它仅仅是对键进行取模。\n\n```java\n\
  int resolverFun(int index) {\n    return index;\n}\n```\n\n当哈希索引被某些元素占用时，值将放置在其他位置，为了找到该新位置，会使用解析函数。哈希表有两个组件：一个是表的大小，另一个是对数组的引用。\n\
  \n**示例 12.5：**\n\n```java\nboolean InsertNode(int value) {\n    int hashValue =\
  \ ComputeHash(value);\n    for (int i = 0; i < tableSize; i++) {\n        if (Flag[hashValue]\
  \ == EMPTY_NODE || Flag[hashValue] == LAZY_DELETED) {\n            Arr[hashValue]\
  \ = value;\n            Flag[hashValue] = FILLED_NODE;\n            return true;\n\
  \        }\n        hashValue += resolverFun(i);\n        hashValue %= tableSize;\n\
  \    }\n    return false;\n}\n```\n\n插入节点函数用于向数组添加值。首先计算哈希。然后我们尝试将该值放入哈希表中。我们寻找空节点或已删除的节点来插入值。如果插入失败，我们使用解析器尝试新位置。\n\
  \n**示例 12.6：**\n\n```java\nboolean FindNode(int value) {\n    int hashValue = ComputeHash(value);\n\
  \    for (int i = 0; i < tableSize; i++) {\n        if (Flag[hashValue] == EMPTY_NODE)\
  \ {\n            return false;\n        }\n        if (Flag[hashValue] == FILLED_NODE\
  \ && Arr[hashValue] == value) {\n            return true;\n        }\n        hashValue\
  \ += resolverFun(i);\n        hashValue %= tableSize;\n    }\n    return false;\n\
  }\n```\n\n查找节点函数用于在数组中搜索值。首先计算哈希。然后我们尝试在哈希表中查找该值。我们寻找所需的值或空节点。如果找到了正在找的值，我们返回该值；否则，我们返回\
  \ -1。我们使用解析函数来找到下一个可能的搜索索引。\n\n**示例 12.7：**\n\n```java\nboolean DeleteNode(int value)\
  \ {\n    int hashValue = ComputeHash(value);\n    for (int i = 0; i < tableSize;\
  \ i++) {\n        if (Flag[hashValue] == EMPTY_NODE) {\n            return false;\n\
  \        }\n        if (Flag[hashValue] == FILLED_NODE && Arr[hashValue] == value)\
  \ {\n            Flag[hashValue] = LAZY_DELETED;\n            return true;\n   \
  \     }\n        hashValue += resolverFun(i);\n        hashValue %= tableSize;\n\
  \    }\n    return false;\n}\n```\n\n删除节点函数用于从哈希表中删除值。我们并不真正删除值，只是将该值标记为 `LAZY_DELETED`。与插入和搜索一样，我们使用\
  \ `resolverFun` 找到键下一个可能的位置。\n\n**示例 12.8：**\n\n```java\nvoid Print() {\n    for\
  \ (int i = 0; i < tableSize; i++) {\n        if (Flag[i] == FILLED_NODE) {\n   \
  \         System.out.println(\"Node at index [\" + i + \"] :: \" + Arr[i]);\n  \
  \      }\n    }\n}\n```\n\nPrint 方法打印哈希表的内容。\n\n```java\npublic static void main(String[]\
  \ args) {\n    HashTable ht = new HashTable(1000);\n    ht.InsertNode(89);\n   \
  \ ht.InsertNode(18);\n    ht.InsertNode(49);\n    ht.InsertNode(58);\n    ht.InsertNode(69);\n\
  \    ht.InsertNode(89);\n    ht.InsertNode(18);\n    ht.InsertNode(49);\n    ht.InsertNode(58);\n\
  \    ht.InsertNode(69);\n    ht.Print();\n    System.out.println(\"\");\n    ht.DeleteNode(89);\n\
  \    ht.DeleteNode(18);\n    ht.DeleteNode(49);\n    ht.DeleteNode(58);\n    ht.DeleteNode(69);\n\
  \    ht.Print();\n}\n```\n\n### 二次探测实现\n\n一切与探测实现相同，只有解析函数会改变。\n\n```java\nint resolverFun(int\
  \ index) {\n    return index;\n}\n```\n\n### 链法哈希\n\n另一种解决冲突的方法基于将冲突的键放在链表中。这种方法被称为拉链法。为了加速搜索，我们使用插入排序或保持链表有序。\n\
  \n### 链法实现\n\n**示例 12.9：以下是哈希表的链法实现。**\n\n```java\npublic class HashTableSC {\n\
  \    class Node {\n        private int value;\n        private Node next;\n    \
  \    Node(int v, Node n) {\n            value = v;\n            next = n;\n    \
  \    }\n    }\n\n    private int tableSize;\n    Node[] listArray; //双指针\n\n   \
  \ HashTableSC() {\n        tableSize = 512;\n        listArray = new Node[tableSize];\n\
  \        for (int i = 0; i < tableSize; i++) {\n            listArray[i] = null;\n\
  \        }\n    }\n}\n```\n\n```java\nprivate int ComputeHash(int key) {\n    int\
  \ hashValue = 0; // 除除法\n}\n```\n\n\n\n\n\n```java\nhashValue = key;\nreturn hashValue\
  \ % tableSize;\n}\n\npublic void insert(int value) {\n    int index = ComputeHash(value);\n\
  \    listArray[index] = new Node(value, listArray[index]);\n}\n\npublic boolean\
  \ find(int value) {\n    int index = ComputeHash(value);\n    Node head = listArray[index];\n\
  \    while (head != null) {\n        if (head.value == value)\n            return\
  \ true;\n        head = head.next;\n    }\n    return false;\n}\n\npublic boolean\
  \ delete(int value) {\n    int index = ComputeHash(value);\n    Node nextNode, head\
  \ = listArray[index];\n    if (head != null && head.value == value) {\n        listArray[index]\
  \ = head.next;\n        return true;\n    }\n    while (head != null) {\n      \
  \  nextNode = head.next;\n        if (nextNode != null && nextNode.value == value)\
  \ {\n            head.next = nextNode.next;\n            return true;\n        }\
  \ else {\n            head = nextNode;\n        }\n    }\n    return false;\n}\n\
  \npublic void print() {\n    for (int i = 0; i < tableSize; i++) {\n        System.out.println(\"\
  Printing for index value :: \" + i + \"List of value printing :: \");\n        Node\
  \ head = listArray[i];\n        while (head != null) {\n            System.out.println(head.value);\n\
  \            head = head.next;\n        }\n    }\n}\n\npublic static void main(String[]\
  \ args) {\n    HashTable ht = new HashTable();\n    for (int i = 0; i < 10; i++)\n\
  \        ht.insert(i);\n    System.out.println(\"search 0 :: \" + ht.find(0));\n\
  \    System.out.println(\"remove 0 :: \" + ht.delete(0));\n    System.out.println(\"\
  search 0 :: \" + ht.find(0));\n    System.out.println(\"remove 0 :: \" + ht.delete(0));\n\
  }\n```\n\n注意：重要的一点是跳的大小必须使得表中的所有槽位最终都被占用。否则，表的部分将不会被使用。为了确保这一点，通常建议表的大小为质数。这就是我们在示例中使用质数的原因。\n\
  \n### 计数 (Count)\n\n以下是基于 `HashMap<T>` 的 `CountMap<T>` 实现，如果你有重复的值并想要计数，这非常重要。`CountMap<T>`\
  \ 是我们用于解决许多问题的实现。\n\n### 示例 2.1\n\n```java\nimport java.util.HashMap;\n\nclass CountMap<T>\
  \ {\n    HashMap<T, Integer> hm = new HashMap<T, Integer>();\n\n    public void\
  \ add(T key) {\n        if (hm.containsKey(key)) {\n            int count = hm.get(key);\n\
  \            hm.put(key, count + 1);\n        } else {\n            hm.put(key,\
  \ 1);\n        }\n    }\n\n    public void remove(T key) {\n        if (hm.containsKey(key))\
  \ {\n            if (hm.get(key) == 1)\n                hm.remove(key);\n      \
  \      else {\n                int count = hm.get(key);\n                hm.put(key,\
  \ count - 1);\n            }\n        }\n    }\n\n    public int get(T key) {\n\
  \        if (hm.containsKey(key))\n            return hm.get(key);\n        return\
  \ 0;\n    }\n\n    public boolean containsKey(T key) {\n        return hm.containsKey(key);\n\
  \    }\n\n    public int size() {\n        return hm.size();\n    }\n\n    public\
  \ static void main(String[] args) {\n        CountMap<Integer> cm = new CountMap<Integer>();\n\
  \        cm.add(2);\n        cm.add(2);\n        cm.remove(2);\n        System.out.println(\"\
  count is : \" + cm.get(2));\n        System.out.println(\"count is : \" + cm.get(3));\n\
  \    }\n}\n```\n输出：\ncount is : 1\ncount is : 0\n\n## 哈希问题 (Problems in Hashing)\n\
  \n### 字母异位词 (Anagram)\n\n异位词是通过重新排列另一个单词或短语的字母形成的单词或短语。\n\n### 示例 2.1\n\n如果两个单词的长度相同且字符相同，则它们是异位词。\n\
  \n```java\npublic static boolean isAnagram(char[] str1, char[] str2) {\n    int\
  \ size1 = str1.length;\n    int size2 = str2.length;\n    if (size1 != size2)\n\
  \        return false;\n    CountMap<Character> cm = new CountMap<Character>();\n\
  \    for (char ch : str1)\n        cm.add(ch);\n    for (char ch : str2)\n     \
  \   cm.remove(ch);\n    return (cm.size() == 0);\n}\n```\n\n### 去除重复 (Remove Duplicate)\n\
  \n删除数字数组中的重复项。解决方案：我们可以使用第二个数组或同一个数组作为输出数组。在下面使用了哈希表来解决这个问题。\n\n### 示例 2.12\n\n\
  ```java\npublic static void removeDuplicate(char[] str) {\n    int index = 0;\n\
  \    HashSet<Character> hs = new HashSet<Character>();\n    for (char ch : str)\
  \ {\n        if (hs.contains(ch) == false) {\n            str[index++] = ch;\n \
  \           hs.add(ch);\n        }\n    }\n    str[index] = '\\0';\n}\n```\n\n###\
  \ 查找缺失 (Find Missing)\n\n### 示例 2.13：有一个整数列表，我们需要找到列表中缺失的数字。\n\n```java\npublic\
  \ static int findMissing(int[] arr, int start, int end) {\n    HashSet<Integer>\
  \ hs = new HashSet<Integer>();\n    for (int i : arr)\n        hs.add(i);\n    for\
  \ (int curr = start; curr <= end; curr++) {\n        if (hs.contains(curr) == false)\n\
  \            return curr;\n    }\n    return Integer.MAX_VALUE;\n}\n```\n将列表元素添加到哈希表，然后通过查找哈希表找到元素。\n\
  \n### 打印重复 (Print Repeating)\n\n### 示例 2.14：打印整数列表中的重复整数。\n\n```java\npublic static\
  \ void printRepeating(int[] arr) {\n    HashSet<Integer> hs = new HashSet<Integer>();\n\
  \    System.out(\"Repeating elements are:\");\n    for (int val : arr) {\n     \
  \   if (hs.contains(val))\n            System.out(\" \" + val);\n        else\n\
  \            hs.add(val);\n    }\n}\n```\n将所有值添加到哈希表，当某个值已经在哈希表中时，则它就是重复值。\n\n###\
  \ 打印首次重复 (Print First Repeating)\n\n### 示例 2.15：与上面的问题相同，但我们需要打印第一个重复的数字。需要小心找到第一个重复的数字。它应该是第一个重复的数字。例如，1,\
  \ 2, 3, 2, 1。答案应该是 1，因为它是第一个重复的数字。\n\n```java\npublic static void printFirstRepeating(int[]\
  \ arr) {\n    int i;\n    int size = arr.length;\n    CountMap<Integer> hs = new\
  \ CountMap<Integer>();\n    for (i = 0; i < size; i++)\n        hs.add(arr[i]);\n\
  \    for (i = 0; i < size; i++)\n        hs.remove(arr[i]);\n}\n```\n\n\n\n\n\n\
  ```java\nif (hs.containsKey(arr[i])) {\n    System.out.println(\"First Repeating\
  \ number is : \" + arr[i]);\n    return;\n}\n}\n```\n\n将值添加到计数映射中，重复的数字将拥有多个计数。现在再次遍历数组并检查计数是否大于\
  \ 1。那么它就是第一个重复的数字。\n\n## 练习题\n\n1. 设计一个数字（ID）生成系统，用于生成 0-99999999（8 位数）之间的数字。\n\n\
  该系统应支持两个函数：\n\na. `int getNumber();`\n\nb. `int requestNumber();`\n\n`getNumber()`\
  \ 函数应该找到一个未被分配的数字，将其标记为已分配并返回该数字。\n\n`requestNumber()` 函数检查该数字是否已分配。如果已分配，则返回 0；否则将其标记为已分配并返回\
  \ 1。\n\n*提示：*你可以维护一个计数器来分配数字。每当调用 `getNumber()` 时，你将检查该数字是否在 `Hash-Table` 中已标记分配。如果已分配，则增加计数器并再次检查。如果你发现一个数字不在\
  \ `Hash-Table` 中，则将其添加到 `Hashtable` 并增加计数器。\n\n`requestNumber()` 将在 `Hash-Table`\
  \ 中查找数字是否已被占用，如果是，则返回 0；否则返回 1 并在 `Hash-Table` 中将该数字标记为已占用。\n\n2. 给定长字符串，找到字符串中出现频率最高的单词。上述解决方案的\
  \ `Time Complexity`（时间复杂度）是什么？\n\n提示:-\n\na. 创建一个 `Hashtable` 来记录 `<word, frequency>`。\n\
  \nb. 遍历字符串并通过插入 `Hash-Table` 来跟踪单词频率。\n\nc. 当我们遇到一个新单词时，我们将以频率 1 将其插入 `Hashtable`。对于该单词的所有重复，我们将增加其频率。\n\
  \nd. 每当我们增加频率时，我们都可以跟踪出现频率最高的单词，检查这是否是出现频率最高的单词。\n\ne. `Time Complexity` 为 `O(n)`，其中\
  \ n 是字符串中的单词数，`Space Complexity`（空间复杂度）为 `O(m)`，其中 m 是字符串中的唯一单词数。\n\n3. 在上述问题中，如果给你的是\
  \ OSCAR WILDE 的全部作品（19 世纪 90 年代初期最受欢迎的剧作家之一），会如何？\n\n提示:-\n\na. 谁知道有多少本书呢，假设有很多且我们无法将所有内容放入内存。首先，我们需要一个\
  \ `Streaming Library`，以便能够逐节读取每个文档。然后我们需要一个 `tokenizer` 为我们的程序提供单词。我们还需要某种字典，假设我们使用\
  \ `HashTable`。\n\nb. 你需要的是 1. 一个流式库分词器 2. 一个分词器 3. 一个 `hashmap`\n\n方法：\n\n1. 使用流处理器找到给定单词的流\n\
  2. 对输入文本进行分词\n3. 如果词干后的单词在 hash map 中，则增加其频率计数，否则以频率 1 将单词添加到 hash map 中\n\nc. 我们可以通过研究并行计算来提高性能。我们可以使用\
  \ `map-reduce` 来解决这个问题。多个节点将读取并处理多个文档。一旦它们完成处理，我们就可以使用 `reduce` 将它们合并。\n\n4. 在上述问题中，如果我们想找到他作品中最常见的\
  \ PHRASE（短语）会如何？\n\n提示:- 我们可以维护一个 `<phrase, frequency>` `Hash-Table` 并执行第 2 和第 3\
  \ 题相同的过程。\n\n5. 为字符串编写一个哈希算法。\n\n*提示：* 使用霍纳迭代法（Horner's method）\n\n```java\nint\
  \ hornerHash (char[] key, int tableSize) {\n    int size = key.length;\n    int\
  \ h = 0;\n    int i;\n    for (i=0; i < size; i++) {\n        h = (32 * h + key[i])\
  \ % tableSize;\n    }\n    return h;\n}\n```\n\n计算完成后，`h` 是字符串 `key` 的哈希值。\n\n\n\
  \n\n表示图的方法之一是使用二维矩阵。每一行和每一列的组合代表图中的一个顶点。存储在行 `v` 和列 `w` 处的值是从顶点 `v` 到顶点 `w` 的边。由边连接的节点被称为相邻节点。该矩阵用于存储相邻关系，因此被称为**邻接矩阵**。在下面的图中，我们有一个图及其对应的邻接矩阵。\n\
  \n![](img/image01057.jpeg)\n\n在上面的图中，每个节点的权重为 1，因此邻接矩阵只包含 1 或 0。如果边的权重不同，则会将该权重值填充在矩阵中。\n\
  \n- **优点**：邻接矩阵的实现简单。在两个顶点之间添加/删除边只需要 `O(1)`。查询两个顶点之间是否存在边也只需要 `O(1)`。\n- **缺点**：它总是消耗\
  \ `O(V²)` 的空间，当图是稀疏图时，这是一种低效的存储方式。\n\n**稀疏矩阵**：在一个巨大的图中，每个节点连接的节点较少。因此，邻接矩阵中的大部分位置都是空的。这种矩阵被称为稀疏矩阵。在大多数现实问题中，邻接矩阵不是存储稀疏数据的良好选择。\n\
  \n## 邻接列表\n\n一种更节省空间的存储图的方法是邻接列表。在邻接列表中，存储的是指向链表节点的引用。每个引用对应图中的一个顶点。每个引用将指向与它连接的顶点，并将其存储为列表。\n\
  \n在下方的图中，节点 2 连接到 1、3 和 4。因此，位置 2 处的引用指向一个包含 1、3 和 4 的列表。\n\n![](img/image01058.jpeg)\n\
  \n邻接列表有助于我们紧凑地表示稀疏图。邻接列表的表示法还允许我们仅通过一次链表扫描，就能找到与任何顶点直接连接的所有顶点。在我们的所有程序中，都将使用邻接列表来存储图。\n\
  \n以下是无向图邻接列表表示的代码：\n\n### 示例 13.1:\n\n```java\npublic class Graph {\n    private\
  \ static class AdjNode {\n        private int source;\n        private int destination;\n\
  \        private int cost;\n        private AdjNode next;\n\n        public AdjNode(int\
  \ src, int dst, int cst) {\n            source = src;\n            destination =\
  \ dst;\n            cost = cst;\n            next = null;\n        }\n\n       \
  \ public AdjNode(int src, int dst) {\n            this(src, dst, 1);\n        }\n\
  \    }\n\n    private static class AdjList {\n        private AdjNode head;\n  \
  \  }\n\n    int count;\n    AdjList[] array;\n\n    public Graph(int cnt) {\n  \
  \      count = cnt;\n        array = new AdjList[cnt];\n        for (int i = 0;\
  \ i < cnt; i++) {\n            array[i] = new AdjList();\n            array[i].head\
  \ = null;\n        }\n    }\n\n    public void AddEdge(int source, int destination,\
  \ int cost) {\n        AdjNode node = new AdjNode(source, destination, cost);\n\
  \        node.next = array[source].head;\n        array[source].head = node;\n \
  \   }\n\n    public void AddEdge(int source, int destination) {\n        AddEdge(source,\
  \ destination, 1);\n    }\n\n    public void AddBiEdge(int source, int destination,\
  \ int cost) {\n        AddEdge(source, destination, cost);\n        AddEdge(destination,\
  \ source, cost);\n    }\n\n    public void AddBiEdge(int source, int destination)\
  \ {\n        AddBiEdge(source, destination, 1);\n    }\n\n    public void Print()\
  \ {\n        AdjNode ad;\n        for (int i = 0; i < count; i++) {\n          \
  \  ad = array[i].head;\n            if (ad != null) {\n                System.out.print(\"\
  Vertex \" + i + \" is connected to:\");\n                while (ad != null) {\n\
  \                    System.out.print(ad.destination + \" \");\n               \
  \     ad = ad.next;\n                }\n                System.out.println(\"\"\
  );\n            }\n        }\n    }\n}\n```\n\n## 图的遍历\n\n深度优先搜索（DFS`）和广度优先搜索（BFS`）是用于遍历图的两种算法。这些算法也可以用于查找图中的节点、判断节点是否可达等。遍历是通过检查所有的边和顶点来探索图的过程。使用遍历解决的一些问题列表如下：\n\
  \n1. 确定从顶点 `u` 到顶点 `v` 的路径，如果没有这样的路径则报告错误。\n2. 给定一个起始顶点 `s`，找到从顶点 `s` 到图中所有其他顶点的最小边数。\n\
  3. 测试图 `G` 是否连通。\n4. 寻找图的生成树。\n5. 查找图中是否存在环。\n\n### 深度优先遍历\n\n`DFS` 算法从起点开始进入图的深度，直到遇到死路，然后移动回父节点（回溯）。在\
  \ `DFS` 中，我们使用栈来获取下一个开始的顶点。或者我们使用递归（系统栈）来实现相同的操作。\n\n![](img/image01059.jpeg)\n\n\
  DFS 的算法步骤：\n1. 将起始节点推入栈中。\n2. 循环直到栈为空。\n3. 在循环内部从栈中弹出节点并作为当前节点。\n4. 处理当前节点。\n5.\
  \ 遍历当前节点的所有子节点并将它们推入栈。\n6. 重复步骤 3 到 5 直到栈为空。\n\n#### 栈实现 DFS\n\n#### 示例 13.2:\n\n\
  ```java\npublic void DFSStack(Graph gph, int start) {\n    int count = gph.count;\n\
  \    int[] visited = new int[count];\n    int curr;\n    Stack<Integer> stk = new\
  \ Stack<Integer>();\n    for (int i = 0; i < count; i++) {\n        visited[i] =\
  \ 0;\n    }\n    visited[start] = 1;\n    stk.push(start);\n    while (stk.isEmpty()\
  \ == false) {\n        curr = stk.pop();\n        AdjNode head = gph.array[curr].head;\n\
  \        while (head != null) {\n            if (visited[head.destination] == 0)\
  \ {\n                visited[head.destination] = 1;\n                stk.push(head.destination);\n\
  \            }\n            head = head.next;\n        }\n    }\n}\n```\n\n### 递归实现的\
  \ DFS\n\n#### 示例 13.3:\n\n```java\npublic static void DFSRec(Graph gph, int start,\
  \ int[] visited) {\n    AdjNode head = gph.array[start].head;\n    while (head !=\
  \ null) {\n        if (visited[head.destination] == 0) {\n            visited[head.destination]\
  \ = 1;\n            DFSRec(gph, head.destination, visited);\n        }\n       \
  \ head = head.next;\n    }\n}\n```\n\n### 广度优先遍历\n\n在 BFS 算法中，图按层级进行遍历。遍历的方式更靠近起点。使用队列来实现\
  \ BFS。\n\n![](img/image01060.jpeg)\n\n\n\n\n## BFS 算法步骤\n\n1. 将起始节点推入 `Queue` 中。\n\
  2. 循环直到 `Queue` 为空。\n3. 在循环内部从 `Queue` 中移除一个节点，将该节点命名为 `current`。\n4. 处理 `current`\
  \ 节点。（打印等）\n5. 遍历 `current` 节点的所有子节点，并将它们推入 `Queue`。\n6. 重复步骤 3 到 5，直到 `Queue` 为空。\n\
  \n### 示例 13.4:\n\n```java\npublic void BFSQueue(Graph gph, int start, int[] visited)\n\
  {\n    int curr;\n    LinkedList<Integer> que= new LinkedList<Integer>();\n    visited[start]\
  \ = 1;\n    que.add(start);\n    while (que.isEmpty() == false)\n    {\n       \
  \ curr=que.remove();\n        AdjNode head = gph.array[curr].head;\n        while(head\
  \ != null)\n        {\n            if(visited[head.destination] == 0)\n        \
  \    {\n                visited[head.destination] = 1;\n                que.add(head.destination);\n\
  \            }\n            head = head.next;\n        }\n    }\n}\n```\n\nDFS 和\
  \ BFS 遍历的运行时分析为 `O(n+m)`，其中 `n` 是从源节点可达的边数，`m` 是连接到 `s` 的边数。\n\n以下问题具有 `O(m+n)`\
  \ 的时间性能：\n\n1. 确定从顶点 `u` 到顶点 `v` 的路径，如果不存在此类路径则报告错误。\n2. 给定一个起始顶点 `s`，找到从顶点 `s`\
  \ 到图中所有其他顶点的最小边数。\n3. 测试图 `G` 是否连通。\n4. 寻找图 `Graph` 的生成树。\n5. 寻找图中是否存在环。\n\n## 图中的问题\n\
  \n### 确定从顶点 u 到顶点 v 的路径\n\n如果从 `u` 到 `v` 存在路径且我们正在从 `u` 执行 DFS，那么 `v` 一定会被访问。如果没有路径，则报告错误。\n\
  \n### 示例 13.5:\n\n```java\npublic static int PathExist(Graph gph, int source, int\
  \ destination)\n{\n    int count = gph.count;\n    int[] visited = new int[count];\n\
  \    for (int i = 0; i < count; i++)\n        visited[i] = 0;\n    visited[source]\
  \ = 1;\n    DFSR(gph, source, visited);\n    return visited[destination];\n}\n```\n\
  \n### 给定一个起始顶点 s，找到从顶点 s 到图中所有其他顶点的最小边数\n\n寻找每条边作为单位的单最短路径算法。\n\n### 测试图 G 是否连通。\n\
  \n我们只需从任何顶点开始执行 DFS 搜索，查看是否有某些顶点未被访问。如果所有顶点都被访问了，那么它是一个连通图。\n\n#### 示例 13.6:\n\n\
  ```java\npublic booleanConnected(Graph gph)\n{\n    int count = gph.count;\n   \
  \ int[] visited = new int[count];\n    for (int i = 0; i < count; i++)\n       \
  \ visited[i] = 0;\n    visited[0] = 1;\n    DFSR(gph,0, visited);\n    for (int\
  \ i = 0; i < count; i++)\n        if(visited[i] == 0)\n            return false;\n\
  \    return true;\n}\n```\n\n### 寻找图中是否存在环。\n\n修改 DFS 问题即可完成任务。\n\n## 有向无环图\n\n\
  有向无环图（DAG）是一种没有环的有向图。DAG 表示了比树更通用的关系。下面是一个 DAG 的示例，展示了某人如何准备好工作。现实生活中还有其他 DAG 的例子，例如课程选择到大学毕业。\n\
  \nImages/image01061.jpeg\n\n## 拓扑排序\n\n拓扑排序是一种对有向图节点排序的方法，节点代表活动，边表示这些任务之间的依赖关系。要使拓扑排序生效，图必须是\
  \ DAG，这意味着它不包含任何环。只需使用 DFS 获取拓扑排序即可。\n\n### 示例 13.7:\n\n```java\npublic static void\
  \ TopologicalSort(Graph gph)\n{\n    Stack<Integer> stk = new Stack<Integer>();\n\
  \    int count = gph.count;\n    int[] visited = new int[count];\n    for (int i\
  \ = 0; i < count; i++)\n        visited[i] = 0;\n    for (int i = 0; i < count;\
  \ i++)\n    {\n        if (visited[i] == 0)\n        {\n            visited[i] =\
  \ 1;\n            TopologicalSortDFS(gph, i, visited, stk);\n        }\n    }\n\
  \    while (stk.isEmpty() != true)\n        System.out.print(\" \" + stk.pop());\n\
  }\nprivate void TopologicalSortDFS(Graph gph, int index, int[] visited, Stack<Integer>\
  \ stk)\n{\n    AdjNode head = gph.array[index].head;\n    while(head != null)\n\
  \    {\n        if(visited[head.destination] == 0)\n        {\n            visited[head.destination]\
  \ = 1;\n            TopologicalSortDFS(gph, head.destination, visited, stk);\n \
  \       }\n    }\n    stk.push(index);\n}\n```\n\n拓扑排序是有向图的 DFS 遍历。节点被入栈进行拓扑排序。读者请求运行一些示例以理解此算法。\n\
  \n## 最小生成树 (MST)\n\n图 `G` 的生成树是包含图中所有边的树。最小生成树是边权之和最小的树。例如，如果你想要一组城市之间的通信，可能希望使用最少的布线。\n\
  \nImages/image102.jpeg\n\n### 用于 MST 的 Prim 算法\n\nPrim 算法增长树 `T`，每次增加一条边，直到它成为生成树。我们初始化\
  \ `T` 为空边，`U` 为单个节点。`T` 是生成树的边，`U` 是生成的顶点集。在每一步中，Prim 算法添加一个端点在 `U` 中另一个端点不在 `U`\
  \ 中的最小权重边。在 `n-1` 次添加后，`U` 包含树的所有顶点。\n\n#### 示例 13.8:\n\n```\n// 使用 Prim 算法返回 MST\n\
  // 输入：加权连通图 G = (V, E)\n// 输出：构成 MST 的边\nAlgorithm Prim(G)\n    T = {}\n    令 r\
  \ 为 G 中的任意顶点\n    U = {r}\n    for i = 1 to |V| - 1 do\n        e = 最小权重边 (u, v)\n\
  \        u ∈ U 且 v ∈ V-U\n        U = U + {v}\n        T = T + {e}\n    return T\n\
  ```\n\n使用优先级队列（最小堆）获取最近顶点的 Prim 算法时间复杂度为 `O(m log n)`，其中 n 是顶点，m 是边。\n\n#### 示例\
  \ 13.9:\n\n```java\npublic static void Prims(Graph gph) {\n    int[] previous =\
  \ new int[gph.count];\n    int[] dist = new int[gph.count];\n    int source = 1;\n\
  \    for (int i = 0; i < gph.count; i++) {\n        previous[i] = -1;\n        dist[i]\
  \ = Integer.MAX_VALUE;\n    }\n    dist[source] = 0;\n    previous[source] = -1;\n\
  \    AdjNodeComparator comp = new AdjNodeComparator();\n    PriorityQueue<AdjNode>\
  \ queue= new PriorityQueue<AdjNode>(100,comp);\n    AdjNode node = new AdjNode(source,\
  \ source, 0);\n    queue.add(node);\n    while (queue.isEmpty() != true) {\n   \
  \     node = queue.peek();\n        queue.remove();\n    }\n}\n```\n\n\n\n\n\n```java\n\
  if (dist[node.destination] < node.cost) {\n    continue;\n}\ndist[node.destination]\
  \ = node.cost;\nprevious[node.destination] = node.source;\nAdjList adl = gph.array[node.destination];\n\
  AdjNode adn = adl.head;\nwhile (adn != null) {\n    if (previous[adn.destination]\
  \ == -1) {\n        node = new AdjNode(adn.source, adn.destination, adn.cost);\n\
  \        queue.add(node);\n    }\n    adn = adn.next;\n}\nAdjNodeComparator comp\
  \ = new AdjNodeComparator();\nPriorityQueue<AdjNode> queue = new PriorityQueue<AdjNode>(100,comp);\n\
  AdjNode node = new AdjNode(source, source, 0);\nqueue.add(node);\nwhile (queue.isEmpty()\
  \ != true) {\n    node = queue.peek();\n    queue.remove();\n    AdjList adl = gph.array[node.destination];\n\
  \    AdjNode adn = adl.head;\n    while(adn != null) {\n        int alt = adn.cost;\n\
  \        if (alt < dist[adn.destination]) {\n            dist[adn.destination] =\
  \ alt;\n            previous[adn.destination] = adn.source;\n            node =\
  \ new AdjNode(adn.source, adn.destination, alt);\n            queue.add(node);\n\
  \        }\n        adn = adn.next;\n    }\n}\n// 打印结果\nint count = gph.count;\n\
  for (int i = 0; i < count; i++) {\n    if (dist[i] == Integer.MAX_VALUE) {\n   \
  \     System.out.println(\" node id \" + i + \" prev \" + previous[i] + \" distance\
  \ : Unreachable\");\n    } else {\n        System.out.println(\" node id \" + i\
  \ + \" prev \" + previous[i] + \" distance : \" + dist[i]);\n    }\n}\npublic static\
  \ void main(String[] args) {\n    Graph gph = new Graph(9);\n    gph.AddBiEdge(\
  \ 0, 2, 1);\n    gph.AddBiEdge( 1, 2, 5);\n    gph.AddBiEdge( 1, 3, 7);\n    gph.AddBiEdge(\
  \ 1, 4, 9);\n    gph.AddBiEdge( 3, 2, 2);\n    gph.AddBiEdge( 3, 5, 4);\n    gph.AddBiEdge(\
  \ 4, 5, 6);\n    gph.AddBiEdge( 4, 6, 3);\n    gph.AddBiEdge( 5, 7, 5);\n    gph.AddBiEdge(\
  \ 6, 7, 7);\n    gph.AddBiEdge( 7, 8, 17);\n    // Dijkstra(gph,1);\n    Prims(gph);\n\
  }\n```\n\n### Kruskal 算法\nKruskal 算法反复选择不形成环的最小权重边。按照代价非递减顺序对边进行排序 `c(e1) ≤ c(e2)\
  \ ≤ · · ≤ c(em)`。将 `T` 设置为空树。如果边不产生环，则逐个添加到树中。\n\n#### 示例 13.10:\n```\n// 使用 Kruskal\
  \ 算法返回最小生成树 (MST)\n// 输入：连通图 G = (V, E)\n// 输出：构成 MST 的边集\nAlgorithm Kruskal(G)\n\
  \  按权重对边 E 进行排序\n  T = {}\n  while |T | + 1 < |V | do\n    e = E 中的下一条边\n    if\
  \ T + {e} 不产生环则\n      T = T + {e}\n  return T\n```\n使用高效的环检测算法时，Kruskal 算法的时间复杂度为\
  \ O(E log V)。\n\n## 图中的最短路径算法\n\n### 单源最短路径\n对于图 `G= (V, E)`，单源最短路径问题是找到从给定的源顶点\
  \ `s` 到所有顶点 `V` 的最短路径。\n\n### 无权图的单源最短路径\n为无权图或所有顶点权重相同的图找到单源最短路径。\n\n#### 示例 13.11:\n\
  ```java\npublic void ShortestPath(Graph gph, int source)// 无权图\n{\n    int curr;\n\
  \    int count = gph.count;\n    int[] distance= new int[count];\n    int[] path=\
  \ new int[count];\n    Queue<Integer> que= new LinkedList<Integer>();\n    for (int\
  \ i = 0; i < count; i++)\n        distance[i] = -1;\n    que.add(source);\n    distance[source]=0;\n\
  \    while(que.isEmpty() == false) {\n        curr=que.remove();\n        AdjNode\
  \ head = gph.array[curr].head;\n        while(head != null) {\n            if(distance[head.destination]\
  \ == -1) {\n                distance[head.destination] = distance[curr] + 1;\n \
  \               path[head.destination]=curr;\n                que.add(head.destination);\n\
  \            }\n            head = head.next;\n        }\n    }\n    for(int i=0;i<count;i++)\n\
  \        System.out.println(path[i] + \" to \" + i +\" weight \" + distance[i]);\n\
  }\n```\n\n### Dijkstra 算法\nDijkstra 算法用于无负权边的加权图单源最短路径问题。给定一个加权连通图 `G`，找到从源顶点 `s`\
  \ 到其他每个顶点的短路径。Dijkstra 算法与 Prim 算法相似。它维护一个已知最短路径的节点集合。\n\n![](img/image01063.jpeg)\n\
  \n该算法通过跟踪每个节点的距离及其父节点开始。最初，所有距离都被设置为无穷，因为我们不知道到顶点的实际路径，且所有顶点的父节点都为空。所有顶点都被添加到优先队列（最小堆实现）。在每一步中，算法从优先队列中取出一个顶点（最初为源顶点）。然后更新所有相邻顶点对应的距离数组。当队列为空时，我们就得到了完全填充的距离和父节点数组。\n\
  \n#### 示例 13.12:\n```\n// 使用 Dijkstra 算法解决单源最短路径 (SSSP)\n// 输入：无负权的加权连通图 G = (V,\
  \ E)\n// 以及源顶点 v\n// 输出：从 s 到每个 v 的长度和路径\nAlgorithm Dijkstra(G, s)\n  对于 V 中的每个\
  \ v\n    D[v] = infinite // 未知的距离\n    P[v] = null    // 未知的父节点\n    将 v 加入 PQ //\
  \ 将所有节点加入优先队列\n  D[source] = 0 // 源到源距离\n  while (PQ 不空)\n    u = PQ 中 D[u] 最小的顶点\n\
  \    从 PQ 移除 u\n    对于 u 的每个 v\n      alt = D[u] + length ( u , v)\n      if alt\
  \ < D[v] 则\n        D[v] = alt\n        P[v] = u\n  return D[], P[]\n```\n时间复杂度将为\
  \ O(|E|log|V|)。Dijkstra 算法不带有负边的图。适用于无向图和有向图。\n\n#### 示例 13.13:\n```java\npublic\
  \ static void Dijkstra(Graph gph, int source) {\n    class AdjNodeComparator implements\
  \ Comparator<AdjNode> {\n        public int compare(AdjNode x, AdjNode y) {\n  \
  \          if (x.cost < y.cost) {\n                return -1;\n            }\n \
  \           if (x.cost > y.cost) {\n                return 1;\n            }\n \
  \           return 0;\n        }\n    }\n    int[] previous= new int[gph.count];\n\
  }\n```\n\n\n\n\n\n```java\nint[] dist=new int[gph.count];\n\nfor(int i=0;i<gph.count;i++)\n\
  \n{\n    previous[i]=-1;\n    dist[i]=Integer.MAX_VALUE; //infinite\n}\ndist[source]\
  \ = 0;\nprevious[source]= -1;\nAdjNodeComparator comp = new AdjNodeComparator();\n\
  PriorityQueue<AdjNode> queue = new PriorityQueue<AdjNode> (100,comp);\nAdjNode node\
  \ = new AdjNode(source, source, 0);\nqueue.add(node);\nwhile (queue.isEmpty()!=\
  \ true)\n{\n    node = queue.peek();\n    queue.remove();\n    AdjList adl = gph.array[node.destination];\n\
  \    AdjNode adn = adl.head;\n    while(adn != null)\n    {\n        int alt = adn.cost\
  \ + dist[adn.source];\n        if(alt < dist[adn.destination]){\n            dist[adn.destination]=\
  \ alt;\n            previous[adn.destination]=adn.source;\n            node = new\
  \ AdjNode(adn.source, adn.destination, alt);\n            queue.add(node);\n   \
  \     }\n        adn = adn.next;\n    }\n}\nint count = gph.count;\nfor (int i =\
  \ 0; i < count; i++)\n{\n    if(dist[i] == Integer.MAX_VALUE){\n        System.out.println(\"\
  \ node \" + i + \" prev \" + previous[i] + \" distance :Unreachable\" );\n    }\n\
  else{\n        System.out.println(\" node \" + i + \" prev \" + previous[i] + \"\
  \ distance : \" + dist[i] );\n    }\n}\n```\n\n### 最短路径\n\nBellman 算法即使在图中存在负权边时也有效。如果图中存在总权重为负的环路，它将无法工作。\n\
  \n#### 示例 13.14:\n```java\npublic void BellmanShortestPath(Graph gph, int source)\n\
  {\n    int count = gph.count;\n    int[] distance=new int[count];\n    int[] path=new\
  \ int[count];\n    for (int i = 0; i < count; i++)\n        distance[i] = Integer.MAX_VALUE;\n\
  \    distance[source]=0;\n    for (int i = 0; i < count -1; i++)\n    {\n      \
  \  for (int j = 0; j < count; j++)\n        {\n            AdjNode head = gph.array[j].head;\n\
  \            while(head!= null)\n            {\n                int newDistance\
  \ = distance[j]+ head.cost;\n                if(distance[head.destination] > newDistance)\n\
  \                {\n                    distance[head.destination] = newDistance;\n\
  \                    path[head.destination]=j;\n                }\n            \
  \    head = head.next;\n            }\n        }\n    }\n    for(int i=0;i<count;i++)\n\
  \        System.out.println(path[i] + \" to \" + i +\" weight \" + distance[i]);\n\
  }\n```\n\n### 所有最短路径\n\n给定一个加权图 `G(V, E)`，所有对最短路径问题是找到所有顶点对 `u, v ∈ V` 之间的最短路径。\n\
  \n对图中的每个顶点执行 `n` 次单源路径算法。该算法的复杂度为 ![](img/image0164.jpeg)\n\n## 练习\n\n1. 在我们创建的所有路径查找算法中，我们创建了一个路径数组，仅存储节点的直接父节点，请打印出它的完整路径。\n\
