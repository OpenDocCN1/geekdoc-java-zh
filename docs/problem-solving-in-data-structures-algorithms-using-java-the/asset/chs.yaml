  \ (stk.isEmpty() == false) {\n        curr = stk.pop();\n        vtd = visited.pop();\n\
  \        if (vtd == 1) {\n            System.out.print(curr.value + \" \");\n  \
  \      } else {\n            if (curr.rChild != null) {\n                stk.push(curr.rChild);\n\
