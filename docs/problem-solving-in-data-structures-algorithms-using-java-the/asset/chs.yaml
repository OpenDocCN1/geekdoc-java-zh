  \n#### 司机模块\n1. 司机能够注册成为 `Uber` 的司机。\n2. 当任务显示给司机时，他能够接受任务。\n3. 当司机到达客户处时，他能够开始行程。\n\
  4. 当司机将客户送到目的地后，他应该停止行程。\n5. 司机应根据应用中显示的金额收取费用。\n6. 司机能够给出客户反馈。\n注意：假设 2 分钟等于 1\
  \ 公里。\n\n11. 在线教学系统\n在在线教学系统中有 `n` 个老师，每个老师向任意数量的学生教授一个学科。学生可以加入任意数量的老师学习这些学科。每个学生可以提供一个偏好，通过获取学科或课程时间等更新。这些偏好可以通过\
