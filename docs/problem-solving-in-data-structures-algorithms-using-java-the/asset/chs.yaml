  \n7) 给定两个链表。我们需要找到其中一个链表的数据是另一个链表的反转。不应使用额外空间，且只能遍历一次链表。\n\n8) 找到单链表中的中间元素。说明你的解决方案的复杂度。\n\
  *提示：*\n* 方法 1：找到链表的长度。然后找到中间元素并返回它。\n* 方法 2：使用两个引用，一个移动得快，一个移动得慢，确保处理好边界情况（偶数长度和奇数长度的链表）。\n\
  \n9) 反序打印列表。\n*提示：* 使用递归。\n\n# 第 8 章：栈\n\n## 引言\n\n栈是一种按照后进先出（LIFO）方式组织元素的节点数据结构。最后插入栈的元素将第一个从栈中移除。栈在现实中的类比是“堆盘子”。\n\
  \n想象用餐区有一叠盘子，每个人从栈的顶部取一个盘子，从而为下一个人露出下一个盘子。栈允许访问栈顶元素。栈底的元素留在栈中的时间最长。\n\n计算机科学中也有常见的例子。函数调用栈是栈很好的例子。当我们从一个网页导航到另一个网页时，网页的\
  \ URL 保存在栈中，当前页面位于顶部。如果我们点击返回按钮，每个 URL 条目就会被逐一弹出。\n\n## 栈抽象类型\n\n栈抽象数据类型定义为一个类，对于添加的元素遵循\
  \ LIFO 或后进先出的原则。栈应该支持以下操作：\n\n1. `Push()`：在栈顶添加单个元素。\n2. `Pop()`：从栈顶移除单个元素。\n3.\
  \ `Top()`：读取栈顶元素的值（不移除它）。\n4. `isEmpty()`：如果栈为空则返回 1。\n5. `Size()`：返回栈中元素的数量。\n\n\
  在栈顶添加 `n`：`void push(int value);`\n移除栈顶元素并将其返回给调用函数：`int pop();`\n\n栈可以使用数组或链表来实现。在数组情况下，有两种实现方式：\n\
  * 一种是数组大小固定的，即栈的容量。\n* 另一种方法是变长大小数组，使用 `malloc` 分配数组内存，并在数组填满时使用 `realloc` 将大小翻倍（当栈的大小减到容量的一半以下时，再次减小）。\n\
  \n在链表情况下，它能包含的元素数量没有这种限制。当使用数组实现栈时，栈顶通过名为 `top` 的索引管理。当使用链表实现栈时，`push()` 和 `pop()`\
  \ 分别在头部插入和从头部移除。\n\n## 数组栈\n\n使用固定长度数组实现栈。\n\n示例 8.1:\n```java\npublic class Stack\
  \ {\n    private final int CAPACITY = 1000;\n    private int[] data;\n    private\
  \ int top = -1;\n\n    public Stack() {\n        this(CAPACITY);\n    }\n    public\
  \ Stack(int capacity) {\n        data = new int[capacity];\n    }\n}\n```\n如果用户未提供数组的最大容量，则创建一个包含\
  \ 1000 个元素的数组。top 是栈顶的索引。栈中元素的数量由 `top` 索引控制，在栈初始化时 top 初始化为 -1。顶索引值为 -1 表示初始时栈是空的。\n\
  \n```java\npublic boolean isEmpty(){\n    return (top == -1);\n}\n```\n`isEmpty()`\
  \ 函数在栈为空时返回 1，在所有其他情况下返回 0。比较顶索引值是否为 -1。\n\n```java\npublic int size() {\n    return\
  \ (top + 1);\n}\n```\n`size()` 函数返回栈中元素的数量。它只需返回 `top+1`。因为 top 指向变量的数组索引，所以我们需要对其加\
  \ 1。\n\n```java\npublic void print(){\n    for(int i=top;i>-1;i--)\n        System.out.print(\"\
  \ \" + data[i]);\n}\n```\n`print()` 函数将打印数组的元素。\n\n```java\npublic void push(int\
  \ value) throws IllegalStateException {\n    if (size( ) == data.length)\n     \
  \   throw new IllegalStateException(\"StackOvarflowException\");\n    }\n    top++;\n\
  \    data[top] = value;\n}\n```\n`push()` 函数检查栈是否有足够的空间存储另一个元素，然后将 top 增加 1。最后对栈\
  \ `data` 数组中的数据进行排序。情况下，如果栈满了，会打印“栈溢出”消息，该值将不会被添加到栈中并被忽略。\n\n\n\n\n\n```java\npublic\
  \ int pop() {\n    if (isEmpty()) {\n        throw new IllegalStateException(\"\
  StackEmptyException\");\n    }\n    int topVal = data[top];\n    top--;\n    return\
  \ topVal;\n}\n```\n`pop()` 函数已实现，它首先通过检查栈顶索引来确认栈中是否有元素。如果栈中存在元素，它将最顶端元素的值存储在变量 \"\
  value\" 中。栈顶索引减一。最后返回该值。\n\n```java\npublic int top() throws IllegalStateException\
  \ {\n    if (isEmpty()) {\n        throw new IllegalStateException(\"StackEmptyException\"\
  );\n    }\n    return data[top];\n}\n```\n`top()` 函数返回栈顶端元素中存储的值（不移除它）。\n\n```java\n\
  public static void main(String[] args) {\n    Stack s = new Stack(1000);\n    for(int\
  \ i=1;i<=100;i++) {\n        s.push(i);\n    }\n    for(int i=1;i<=50;i++) {\n \
  \       s.pop();\n    }\n    s.print();\n}\n```\n\n### 分析：\n- 栈的用户将创建一个栈的局部变量。\n\
  - 使用 `push()` 和 `pop()` 函数向栈中添加/移除变量。\n- 使用 `top()` 函数调用读取栈顶元素。\n- 使用 `size()` 函数调用查询栈的大小。\n\
  - 使用 `isEmpty()` 函数调用查询栈是否为空。\n\n## 使用数组实现的栈（容量增长与缩减实现）\n\n在上述栈的动态数组实现中。设置栈变量的容量，使得当它几乎满时，将栈的容量翻倍。\n\
  \n### 示例 8.2:\n```java\npublic class Stack {\n    private static final int MIN_CAPACITY\
  \ = 1000;\n    private int[] data;\n    private int top = -1;\n    private int minCapacity;\n\
  \    private int maxCapacity;\n\n    public Stack() {\n        this(MIN_CAPACITY);\n\
  \        maxCapacity = minCapacity = MIN_CAPACITY;\n    }\n\n    public Stack(int\
  \ capacity) {\n        data = new int[capacity];\n        maxCapacity = minCapacity\
  \ = capacity;\n    }\n}\n\npublic void push(int value) throws IllegalStateException\
  \ {\n    if (size() == maxCapacity) {\n        System.out.println(\"size doubled\"\
  );\n        int[] newData = new int[maxCapacity*2];\n        System.arraycopy(data,0,newData,maxCapacity);\n\
  \        data=newData;\n        maxCapacity=maxCapacity*2;\n    }\n    top++;\n\
  \    data[top] = value;\n}\n\npublic int pop() {\n    if (isEmpty()) {\n       \
  \ throw new IllegalStateException(\"StackEmptyException\");\n    }\n    int topVal\
  \ = data[top];\n    top--;\n    if (size() == maxCapacity/2 && maxCapacity > minCapacity)\
  \ {\n        System.out.println(\"size half\");\n        maxCapacity = maxCapacity/2;\n\
  \        int[] newData = new int[maxCapacity];\n        System.arraycopy(data,0,newData,maxCapacity);\n\
  \        data=newData;\n    }\n    return topVal;\n}\n```\n\n### 分析：\n- 在 `push()`\
  \ 函数中，当栈满时我们将栈的大小翻倍。首先，创建一个容量倍倍的数组。将旧数组的所有数据拷贝到新数组中。最后，将栈数组的引用改为新数组。\n- 在 `pop()`\
  \ 函数中，当栈的大小为栈最大容量的一半且大于最小阈值时，创建一个容量减半的数组，并将旧大数组的值拷贝到新创建的数组。\n- 除了 `push()` 和 `pop()`\
  \ 之外，所有其他函数与之前的固定大小栈实现相同。\n\n## 使用链表实现的栈\n\n### 示例 8.3: 使用链表实现栈\n```java\npublic\
  \ class Stack {\n    private static class Node {\n        private int value;\n \
  \       private Node next;\n        public Node(int v, Node n) {\n            value\
  \ = v;\n            next = n;\n        }\n    }\n    private Node head = null;\n\
  \    private int size = 0;\n    //其他方法\n\n    public int size() {\n        return\
  \ size;\n    }\n\n    public boolean isEmpty() {\n        return size == 0;\n  \
  \  }\n\n    public int peek() throws IllegalStateException {\n        if (isEmpty())\
  \ {\n            throw new IllegalStateException(\"StackEmptyException\");\n   \
  \     }\n        return head.value;\n    }\n\n    public void push(int value) {\n\
  \        head = new Node(value, head);\n        size++;\n    }\n\n    public int\
  \ pop() throws IllegalStateException {\n        if (isEmpty()) {\n            throw\
  \ new IllegalStateException(\"StackEmptyException\");\n        }\n        int value\
  \ = head.value;\n        head = head.next;\n        size--;\n        return value;\n\
  \    }\n\n    public void insertAtBottom(int value) {\n        if (isEmpty()) {\n\
  \            push(value);\n        } else {\n            int temp = pop();\n   \
  \         insertAtBottom(value);\n            push(temp);\n        }\n    }\n\n\
  \    public void print() {\n        Node temp = head;\n        while(temp != null)\
  \ {\n            System.out.print(temp.value + \" \");\n            temp = temp.next;\n\
  \        }\n    }\n    public static void main(String[] args) {\n        Stack s\
  \ = new Stack();\n        for(int i=1;i<=100;i++) {\n            s.push(i);\n  \
  \      }\n        for(int i=1;i<=50;i++) {\n            s.pop();\n        }\n  \
  \      s.print();\n    }\n}\n```\n\n### 分析：\n- 使用链表实现的栈本质是在单链表的头部进行插入和删除。\n- 在 `push()`\
  \ 函数中，为节点创建内存。然后将值存储到节点中。最后，将节点插入头部。\n- 在 `pop()` 函数中，通过链表头部指向第二个节点来释放分配给第一个节点的内存（垃圾回收）。\n\
  \n## 栈的问题\n\n### 括号示例 8.4: 栈可以用于检查程序的符号是否平衡（例如 `{}`、`[]`）。闭合符号应与最近的开启符号匹配。例如：`{}`\
  \ 是合法的，`()` 是合法的，但 `{}` 和 `()}` 是不合法的。\n\n```java\npublic static boolean isParenthesis(String\
  \ expn) {\n    ArrayDeque<Character> stk = new ArrayDeque<Character>();\n    for\
  \ (char ch : expn.toCharArray()) {\n        switch (ch) {\n            case '{':\n\
  \            case '[':\n            case '(':\n                stk.push(ch);\n \
  \               break;\n            case '}':\n                if (stk.pop() !=\
  \ '{') {\n                    return false;\n                }\n               \
  \ break;\n            case ']':\n                if (stk.pop() != '[') {\n     \
  \               return false;\n                }\n                break;\n     \
  \       case ')':\n                if (stk.pop() != '(') {\n                   \
  \ return false;\n                }\n                break;\n        }\n    }\n \
  \   return stk.isEmpty();\n}\n```\n\n\n\n\n\n```java\nboolean value = isBalancedParenthesis(expn);\n\
  System.out.println(\"Given Expn:\"+expn);\nSystem.out.println(\"Result after isParenthesisMatched:\"\
  +value);\n```\n\n## 分析\n\n- 遍历输入字符串，当我们遇到左括号时，将其推入栈中。当我们遇到右括号时，从栈中弹出一个括号，并比较它是否与右括号相对应。\n\
  - 如果括号不匹配，我们返回 `false`。\n- 如果在整个起始遍历结束时，我们到达了字符串末尾且栈为空，则括号是平衡的。\n\n## 中缀表达式、前缀表达式和后缀表达式\n\
  \n当我们有一个形如 `A + B` 这样的代数表达式时，我们知道变量被加到了变量 `B` 上。这种表达式被称为**中缀**表达式，因为运算符 `+` 位于操作数\
  \ `A` 和操作数 `B` 之间。\n\n现在考虑另一个中缀表达式 `A + B * C`。在该表达式中存在一个问题，即 `+` 和 `*` 的执行顺序是什么。是先将\
  \ `A` 和 `B` 相加，然后将结果相乘？还是先将 `B` 和 `C` 相乘，然后将结果加到 `A`？这使得表达式产生了歧。为了处理这种歧义，我们定义了优先级规则或使用括号来消除歧义。\n\
  \n所以，如果我们想先乘 `B` 和 `C` 然后将结果加到 `A`，那么同一个表达式可以使用括号无歧地写为 `A + (B * C)`。另一方面，如果我们想先加\
  \ `A` 和 `B`，然后将和乘以 `C`，我们将其写为 `(A + B) * C`。因此，在中缀表达式中为了使表达式无歧义，我们需要括号。\n\n**中缀表达式**：在这种表示法中，我们将运算符放在操作数的中间。\n\
  \n`< 操作数 > < 运算符 > < 操作数 >`\n\n**前缀表达式**：在这种表示法中，我们将运算符放在操作数的前。\n\n`< 运算符 > < 操作数\
  \ > < 操作数 >`\n\n**后缀表达式**：在这种表示法中，我们将运算符放在操作数的末尾。\n\n`< 操作数 > < 操作数 > < 运算符 >`\n\
  \n| 中缀表达式 | 前缀表达式 | 后缀表达式 |\n| --- | --- | --- |\n| A + B | + A B | A B + |\n| A\
  \ + (B * C) | + A * B C | A B C * + |\n| (A + B) * C | * + ABC | A B + C * |\n\n\
  现在有了一个最明显的问题：当我们已经有了运行运行良好的中缀表达式时，为什么还需要这些不自然的前缀或后缀表达式呢？\n\n答案是，中缀表达式是有歧义的，它们需要括号来消除歧义。而后缀和前缀表示法不需要任何括号。\n\
  \n## 中缀转后缀转换\n\n**示例 8.5**：\n\n```java\npublic static char[] infixToPostfix(char[]\
  \ expn)\n{\n    ArrayDeque<Character> stk = new ArrayDeque<Character>();\n    String\
  \ output=\"\";\n    char out;\n    for (char ch : expn) {\n        if (ch <= '9'\
  \ && ch >= '0') {\n            output = output + ch;\n        }\n        else {\n\
  \            switch (ch) {\n                case '+':\n                case '-':\n\
  \                case '*':\n                case '/':\n                case '%':\n\
  \                case '^':\n                    while (!stk.isEmpty() && precedence(ch)\
  \ <= precedence(stk.peek())) {\n                        out = stk.pop();\n     \
  \                   output = output + \" \" + out;\n                    }\n    \
  \                stk.push(ch);\n                    output = output + \" \";\n \
  \                   break;\n                case '(':\n                    stk.push(ch);\n\
  \                    break;\n                case ')':\n                    while\
  \ (!stk.isEmpty() && (out = stk.pop()) != '(') {\n                        output\
  \ = output + \" \" + out + \" \";\n                    }\n                    break;\n\
  \            }\n        }\n    }\n    while (!stk.isEmpty()) {\n        out = stk.pop();\n\
  \        output = output + out + \" \";\n    }\n    return output.toCharArray();\n\
  }\n\npublic static String infixToPostfix(String expn) {\n    String output=\"\"\
  ;\n    char[] out = infixToPostfix(expn.toCharArray());\n    for (char ch : out)\
  \ {\n        output = output + ch;\n    }\n    return output;\n}\n\npublic static\
  \ void main(String[] args) {\n    String expn = \"0+((3))*5/(16-4)\";\n    String\
  \ value = infixToPostfix(expn);\n    System.out.println(\"Infix Expn: \"+expn);\n\
  \    System.out.println(\"Postfix Expn: \"+value);\n}\n```\n\n**分析：**\n\n- 按照操作数到达的顺序打印它们。\n\
  - 如果栈为空或栈顶包含 `(`，我们应该将进入的运算符推入栈中。\n- 如果进入的符号是 `(`，将括号推入栈中。\n- 如果进入的符号是 `)`，从栈中弹出，直到看到\
  \ `(` 为止。丢弃这对括号。\n- 如果进入的符号的优先级高于栈上的运算符，则将其推入栈中。\n- 如果进入的符号的优先级与栈顶相等，则使用结合性。如果结合性是从左到右，则弹出并打印栈中的符号，然后推入进入的运算符。如果结合性是从右到左，则推入进入的运算符。\n\
  - 如果进入的符号的优先级低于栈上的运算符，则弹出并打印栈顶运算符。然后将进入的运算符与栈中的新运算符进行比较。\n- 在表达式结束时，弹出并打印栈上所有的运算符。\n\
  \n## 中缀转前缀\n\n**示例 8.6**：\n\n```java\npublic static String infixToPrefix(String\
  \ expn)\n{\n    char[] arr = expn.toCharArray();\n    reverseString(arr);\n    replaceanthesis(arr);\n\
  \    arr=infixToPostfix(arr);\n    reverseString(arr);\n    expn = new String(arr);\n\
  \    return expn;\n}\n\npublic static void replaceanthesis(char[] a)\n{\n    int\
  \ lower=0;\n    int upper=a.length-1;\n    while(lower<=upper) {\n        if(a[lower]\
  \ == '(')\n            a[lower] = ')';\n        else if(a[lower] == ')')\n     \
  \       a[lower] = '(';\n        lower++;\n    }\n}\n\npublic static void reverseString(char[]\
  \ expn)\n{\n    int lower=0;\n    int upper=expn.length - 1;\n    char tempChar;\n\
  \    while(lower<upper) {\n        tempChar=expn[lower];\n        expn[lower]=expn[upper];\n\
  \        expn[upper]=tempChar;\n        lower++;\n        upper--;\n    }\n}\n```\n\
  \n\n\n\n\n2. 在反转表达式表达式将 `(` 替换为 `)`，并将 `)` 替换为 `(`。\n3. 现在应用已经讨论过的中表达式转后缀表达式子程序。\n\
  4. 反转生成的后缀表达式，这将得到所需的前缀表达式。\n\n### 后缀表达式求值\n\n编写一个 `postfixEvaluate()` 函数来求后缀表达式的值。例如：`1\
  \ 2 + 3 4 + *`。\n\n**示例 8.7**:\n\n```java\npublic static int postfixEvaluate(String\
  \ expn) {\n    ArrayDeque<Integer> stk = new ArrayDeque<Integer>();\n    Scanner\
  \ tokens = new Scanner(expn);\n    while (tokens.hasNext()) {\n        if (tokens.hasNextInt())\
  \ {\n            stk.push(tokens.nextInt());\n        }\n        else {\n      \
  \      int num1 = stk.pop();\n            int num2 = stk.pop();\n            char\
  \ op = tokens.next().charAt(0);\n            switch (op) {\n                case\
  \ '+':\n                    stk.push(num1 + num2);\n                    break;\n\
  \                case '-':\n                    stk.push(num1 - num2);\n       \
  \             break;\n                case '*':\n                    stk.push(num1\
  \ * num2);\n                    break;\n                case '/':\n            \
  \        stk.push(num1 / num2);\n                    break;\n            }\n   \
  \ }\n    tokens.close();\n    return stk.pop();\n}\n\npublic static void main(String[]\
  \ args) {\n    String expn = \"6 5 2 3 + 8 * + 3 +\";\n    int value = postfixEvaluate(expn);\n\
  \    System.out.println(\"Given Postfix Expn: \" + expn);\n    System.out.println(\"\
  Result after Evaluation: \" + value);\n}\n```\n\n**分析:**\n1) 创建一个栈来存储值或操作数。\n2)\
  \ 遍历给定的表达式并对每个元素执行以下操作：\na) 如果元素是数字，则将其压入栈。\nb) 如果元素是运算符，则从栈中弹出值。对这些值执行运算符操作，并将结果压入栈。\n\
  3) 当表达式完全扫描完毕时，栈中的数字即结果。\n\n### 最小栈栈\n\n设计一个栈，其中获取栈内最小值的操作应在 `O(1)` 时间内完成。\n*提示：*\
  \ 保留两个栈，一个是普通栈，用于存储元素；另一个存储最小值。\n1. 入栈（Push）：将一个元素压入 `stack1` 顶部。将新值与 `stack2` 顶部的值进行比较。如果新值较小，则将新值压入\
  \ `stack2`；或者将 `stack2` 顶部的值再次压入。\n2. 出栈（Pop）：从 `stack1` 顶部弹出一个元素并返回。同时也从 `stack2`\
  \ 顶部弹出一个元素。\n3. 最小（Min）：从 `stack2` 顶部读取，该值即最小值。\n\n### 回文字符串\n\n使用栈判断给定字符串是否为回文。\n\
  回文的定义：回文是一个正读和反向读都相同的字符序列。\n例如：“AAABBBCCCBBAA”、“ABA” 和 “ABBA”。\n*提示：* 将字符压入栈直到达到字符串的一半长度。然后弹出这些字符进行比较。确保处理好奇数长度和偶数长度的情况。\n\
  \n### 反转栈\n\n给定一个栈，如何在不使用任何其他数据结构的情况下反转栈中的元素。你不能使用另一个栈。\n*时间复杂度*和*空间复杂度*是错误的，两种情况均为\
  \ `O(n)`。\n*提示：* 使用递归（系统栈）。当你进入栈内部时，在随后的每次调用中从栈中弹出元素，直到栈为空。当从递归返回时逐个压入这些元素。元素将变为反转。\n\
  \n**示例 8.8**:\n\n```java\npublic static <T> void reverseStack (ArrayDeque<T> stk)\
  \ {\n    if (stk.isEmpty()) {\n        return;\n    }\n    else {\n        T value\
  \ = stk.pop();\n        reverseStack(stk);\n        insertAtBottom(stk, value);\n\
  \    }\n}\n```\n\n### 插入底部\n\n**示例 8.9**:\n\n```java\npublic static <T> void insertBottom\
  \ (ArrayDeque<T> stk, T value) {\n    if (stk.isEmpty()) {\n        stk.push(value);\n\
  \    }\n    else {\n        T out = stk.pop();\n        insertBottom(stk, value);\n\
  \        stk.push(out);\n    }\n}\n```\n\n### 使用栈实现的深度优先搜索\n\n在深度优先搜索中，我们沿一条路径向下遍历直到遇到死胡同；然后通过弹出栈来回溯以获取另一种路径。\n\
  * 创建一个栈\n* 创建起点\n* 将起点压入栈\n* 当（未找到值且栈不为空）时\n    o 弹出栈元素\n    o 找到刚刚尝试过的点之后的所有可能点\n\
  \    o 将这些点压入栈\n\n### 使用队列实现的栈\n\n如何使用队列实现栈。分析栈操作的运行时间。关于此请参阅队列章节。\n\n### 股票跨度问题\
  \ (Stock Span Problem)\n\n给定数组 `A[i]` 中的每日价格列表。找到每天股票的跨度。股票跨度是指价格低于该当天价格的天数。\n\n\
  示例 8.10: 方法 1\n```java\npublic static int[] StockSpanRange(int[] arr) {\n    int[]\
  \ SR = new int[arr.length];\n    SR[0] = 1;\n    for (int i = 1; i < arr.length;\
  \ i++) {\n        SR[i] = 1;\n        for (int j = i - 1; (j >= 0) && (arr[i] >=\
  \ arr[j]); j--) {\n            SR[i]++;\n        }\n    }\n    return SR;\n}\n```\n\
  \n示例 8.11: 方法 2:\n```java\nint[] StockSpan2 (int[] arr) {\n    ArrayDeque<Integer>\
  \ stk = new ArrayDeque<Integer>();\n    int[] SR = new int[arr.length];\n    stk.push(0);\n\
  \    SR[0] = 1;\n    for (int i = 1; i < arr.length; i++) {\n        while (!stk.isEmpty()\
  \ && arr[stk.peek()] <= arr[i]) {\n            stk.pop();\n        }\n        SR[i]\
  \ = stk.isEmpty() ? (i + 1) : (i - stk.peek());\n        stk.push(i);\n    }\n \
  \   return SR;\n}\n```\n\n### 直方图中的矩形面积\n\n给定一个宽度均为 1 的直方图。找到直方图的最大面积。\n\n示例 8.12:\
  \ 方法 1\n```java\npublic static int GetArea(int[] arr) {\n    int size = arr.length;\n\
  \    int maxArea = -1;\n    int currArea;\n    int minHeight = 0;\n    for (int\
