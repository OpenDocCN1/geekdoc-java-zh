  );\n    System.out.println(\"Search results for apple, banana and mango :\");\n\
  \    tt.find(\"apple\");\n    tt.find(\"banana\");\n    tt.find(\"an\");\n    tt.find(\"\
  grapes\");\n    tt.find(\"mango\");\n    tt.print();\n    System.out.println(\"\
  frequency returned :: \" + tt.frequency(\"apple\"));\n    System.out.println(\"\
  frequency returned :: \" + tt.frequency(\"banana\"));\n    System.out.println(\"\
  frequency returned :: \" + tt.frequency(\"mango\"));\n    System.out.println(\"\
  frequency returned :: \" + tt.frequency(\"hemant\"));\n}\n```\n\n### 哈希表 (Hash-Table)\n\
  `Hash-Table` 是另一种可用于符号实现的数据结构。从下方的 `Hash-Table` 图中我们可以看到姓名被作为键，其含义是搜索的值。第一个键通过传递给适当哈希函数转换为哈希码。在哈希函数内部还会传递\
  \ `Hash-Table` 的大小，用于找到存储值的实际索引。最后，将名称的含义的值存储在 `Hash-Table` 中，或者你也可以将存储含义的字符串引用存储在\
  \ `Hash-Table` 中。\n\n![](img/image1070.jpeg)\n\n`Hash-Table` 具有极佳的查找效率 `O(1)`。\n\
  \n假设我们想要实现 Google 搜索的自动完成框。当你在 Google 搜索中输入字符串进行搜索时，它在你完成输入之前就会建议一些完整的字符串。`BST`\
  \ 无法解决这个问题，因为相关的字符串可能同时出现在右侧和子树中。`Hash-Table` 也不适合这项工作。你无法在 `Hash-Table` 上执行部分匹配或范围查询。哈希函数将字符串转换为数字，而一个良好的哈希函数即使对于部分字符串也会给出一个分布均匀的哈希码，`Hash-Table`\
  \ 中无法建立两个字符串之间的关联。`Trie`（字典树）和三元搜索树（Ternary Search tree）是能够很好解决部分匹配和范围查询问题的特殊树。\n\
  \n### Trie (字典树)\n`Trie` 是一种树，每个节点只存储一个字符。最终的键值对存储在叶节点中。每个节点有 `R` 个孩子，对应每个可能的字符。为了简单起见，我们假设字符集为\
  \ 26，对应英文字字母表中不同的字符。\n\n`Trie` 是一种高效的数据结构。使用 `Trie` 可以在 `O(M)` 时间内搜索键，其中 `M` 是字符串长度。`Trie`\
  \ 也适用于解决部分匹配和范围查询问题。\n\n![](img/image1071.jpeg)\n\n### 示例 14.7\n\n```java\npublic\
  \ class Trie {\n    private static int CharCount = 26;\n    Node root=null;\n  \
  \  private class Node{\n        boolean isLastChar;\n        char ch;\n        Node[]\
  \ child;\n        public Node(char c){\n            child = new Node[CharCount];\n\
  \            for(int i=0;i<CharCount;i++)\n                child[i]=null;\n    \
  \        isLastChar=false;\n            ch = c;\n        }\n    };\n    public Trie()\
  \ {\n        root=new Node(' '); // 哑根节点\n    }\n    void insert(String str) {\n\
  \        if(str==null)\n            return;\n        insert(root, str, 0);\n   \
  \ }\n    Node insert(Node curr, String str, int index) {\n        if(curr==null)\
  \ {\n            curr=new Node(str.charAt(index));\n        }\n        if(index\
  \ == str.length()) {\n            curr.isLastChar=true;\n        } else {\n    \
  \        curr.child[str.charAt(index)- 'a']=insert(curr.child[str.charAt(index)-\
  \ 'a'], str, index+1);\n        }\n        return curr;\n    }\n    boolean Find(String\
  \ str) {\n        if(str==null)\n            return false;\n        return Find(root,\
  \ str, 0);\n    }\n    boolean Find(Node curr, String str, int index) {\n      \
  \  if (curr == null)\n            return false;\n        if(str.length() == index)\n\
  \            return curr.isLastChar;\n        return Find(curr.child[str.charAt(index)-\
  \ 'a'], str, index+1);\n    }\n}\n```\n\n\n\n\n\n```java\nreturn;\n\nif (str.length()\
  \ == index ) {\n    if (curr.isLastChar) {\n        curr.isLastChar = false;\n \
  \   }\n    return;\n}\nRemove(curr.child[str.charAt(index)- 'a'], str, index+1);\n\
  }\n\npublic static void main(String[] args) {\n    Trie t = new Trie();\n    String\
  \ a=\"hemant\";         \n    String b=\"heman\";\n    String c=\"hemantjain\";\n\
  \    t.Insert(a);\n    t.Insert(c);\n    System.out.println(t.Find(a));\n    System.out.println(t.Find(b));\n\
  \    System.out.println(t.Find(c));\n}\n```\n\n## 三元搜索字典/ 三元树 (Ternary Search Trie/\
  \ Ternary Search Tree)\n\nTrie 的搜索性能非常好，为 O(M)，其中 M 是搜索字符串的最大长度。但 Trie 的空间要求非常高。每个\
  \ `Trie` 节点都包含指向多个节点的引用，每个引用对应于键中可能的字符。为了避免这种高空间需求，使用了三元搜索字典 (TST)。\n\nTST 在避免传统\
  \ Trie 高昂空间需求的同时，仍然保留了它的许多优点。在 TST 中，每个节点包含一个字符、一个键结束指示器三个引用。这三个引用分别对应节点持有的当前字符（相等）、小于该字符以及大于大于的字符。\n\
  \n三元搜索树操作的 `Time Complexity` 与三元搜索树的高度成正比。在最坏的情况下，我们需要遍历多达 3 倍的链接。然而，这种情况非常罕见。\n\
  \n因此，TST 是实现符号表、部分匹配和范围查询的非常好解决方案。\n\n![](img/image01072.jpeg)\n\n## 示例 14.8:\n\n\
  ```java\npublic class TST {\n    Node root;\n    private class Node {\n        char\
  \ data;\n        boolean isLastChar;\n        Node left, equal, right;\n       \
  \ private Node(char d) {\n            data = d;\n            isLastChar = false;\n\
  \            left = right = null;\n        }\n    };\n    public void insert(String\
  \ word)\n    {\n        root = insert(root, 0);\n    }\n    private Node insert(Node\
  \ curr, String word, int wordIndex)\n    {\n        if (curr == null)\n        \
  \    curr = new Node(word.charAt(wordIndex));\n        if (word.charAt(wordIndex)\
  \ < curr.data)\n            curr.left = insert(curr.left, word, wordIndex);\n  \
  \      else if (word.charAt(wordIndex) > curr.data)\n            curr.right = insert(curr.right,\
  \ word, wordIndex);\n        else\n        {\n            if (wordIndex < word.length()\
  \ -1)\n                curr.equal = insert(curr.equal, word, wordIndex + 1);\n \
  \           else\n                curr.isLastChar = true;\n        }\n        return\
  \ curr;\n    }\n    private boolean find(Node curr, String word, int wordIndex)\n\
  \    {\n        if (curr==null)\n            return false;\n        if (word.charAt(wordIndex)\
  \ < curr.data)\n            return find(curr.left, word, wordIndex);\n        else\
  \ if (word.charAt(wordIndex) > curr.data)\n            return find(curr.right, word,\
  \ wordIndex);\n        else\n        {\n            if ( wordIndex == word.length()-1)\n\
  \                return curr.isLastChar;\n            return find(curr.equal, word,\
  \ wordIndex + 1);\n        }\n    }\n    public boolean find(String word)\n    {\n\
  \        boolean ret = find(root,0);\n        System.out.print(word + \" :: \");\n\
  \        if(ret)\n            System.out.println(\" Found \");\n        else\n \
  \           System.out.println(\"Not Found \");\n        return ret;\n    }\n  \
  \  public static void main(String[] args) {\n        TST tt = new TST();\n     \
  \   tt.insert(\"banana\");\n        tt.insert(\"apple\");\n        tt.insert(\"\
  mango\");\n        tt.find(\"apple\");\n        tt.find(\"banana\");\n        tt.find(\"\
  mango\");\n        tt.find(\"grapes\");\n    }\n}\n```\n\n## 字符串问题\n\n### 正则表达式\n\
  \n实现支持 `?` 和 `*` 特殊字符的正则表达式匹配。\n`?` 匹配任意单个字符。\n`*` 匹配前一个元素的零个或多个。\n\n#### 示例 14.9:\n\
  \n```java\nboolean matchExp(char[] exp, char[] str)\n{\n    return matchUtil(exp,\
  \ str, 0, 0);\n}\nboolean matchUtil(char[] exp, char[] str, int i, int j)\n{\n \
  \   if (i == exp.length && j == str.length)\n        return true;\n    if ((i ==\
  \ exp.length && j != str.length) || (i != exp.length && j == str.length))\n    \
  \    return false;\n    if (exp[i] == '?' || exp[i] == str[j])\n        return matchUtil(exp,\
  \ str, i + 1, j + 1);\n    if (exp[i] == '*')\n        return matchUtil(exp, str,\
  \ i + 1, j) ||\n               matchUtil(exp, str, i, j + 1)||\n               matchUtil(exp,\
  \ str, i, j + 1);\n    return false;\n}\n```\n\n### 顺序匹配\n\n给定一个文本字符串和一个模式字符串。判断模式字符串的字符是否以相同的顺序出现在文本字符串中。例如文本字符串：ABCDEFGHIJKLMNOPQRSTUVWXYZ\n\
