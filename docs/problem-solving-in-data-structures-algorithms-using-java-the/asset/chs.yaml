  \ 11 章：优先队列\n\n## 引言\n优先队列也称为 `Binary-Heap`（二堆），是队列的一种变体。元素从队列头部移除。但在 `Priority-Queue`\
  \ 中，对象的逻辑顺序由它们的优先级决定。优先级最高的元素在最前面。当你向优先队列添加一个元素时，新元素可以位于队列头部。优先队列是一种非常重要的数据结构，用于各种图算法，如\
  \ [Prim 算法](http://en.wikipedia.org/wiki/Prim's_algorithm) 和 [Dijkstra 算法](http://en.wikipedia.org/wiki/Dijkstra's_algorithm)。优先队列使用\
  \ `Heap` 实现。`Heap` 结构是一个元素数组，可以看作是一棵完全二叉树。该树除可能的底层外，所有层都是完全填充的。`Heap` 满足堆属性。具有 `N`\
  \ 个节点的树的高度始终是 `O(logn)`。\n\n![](img/image01015.jpeg)\n\n`heap` 不是一个有序结构，可以被看作是部分有序。从图中所示，任何给定层上的节点之间没有关系。`Heap`\
  \ 使用数组实现。因为 `heap` 是完全二叉树，所以父节点（位于位置 `x`）的左子节点位于位置 `2x`。同样，父节点的右子节点位于位置 `2x+1`。要找到\
  \ `heap` 中任何节点的父节点，我们可以简单地除法。给定节点索引 `y`，父节点索引将为 `y/2`。\n\n![](img/image01016.jpeg)\n\
  \n## 堆的类型\n有两种 `heap`，类型取决于元素的排序。排序可以通过两种方式完成：`Min-Heap`（最小堆）和 `Max-Heap`（最大堆）。\n\
  \n### 最大堆\n最大堆：每个节点的值都小于其父节点的值。最大值位于根节点。\n\n![](img/image1017.jpeg)\n\n| 最大堆操作 |\
  \ |\n| :--- | :--- |\n| 插入 | `O(logn)` |\n| 删除 | `O(logn)` |\n|  | `O(logn)` |\n\
  | 查找最大值 | `O(1)` |\n\n### 最小堆\n最小堆：每个节点的值都大于或等于其父节点的值。最小值位于根节点。\n\n![](img/image1018.jpeg)\n\
  \n| 最小堆操作 | |\n| :--- | :--- |\n| 插入 | `O(logn)` |\n| 删除 | `O(logn)` |\n|  | `O(logn)`\
  \ |\n| 查找最小值 | `O(1)` |\n\n## 堆 ADT\n在本文中，“堆”将始终指的是最大堆。二叉堆的基本操作如下：\n\n| 二叉堆操作 |\
  \ |\n| :--- | :--- |\n| 创建 | `O(1)` |\n| 插入 | `O(logn)` |\n| 删除最大值 | `O(logn)` |\n\
  | 查找最大值 | `O(1)` |\n| 是否为空 | `O(1)` |\n| 大小 | `O(1)` |\n| 建堆 | `O(logn)` |\n\n##\
  \ 堆上的操作\n\n### 从数组创建堆\n1. 从将元素放入数组中。\n2. 从数组的中间开始向下移动。在每一步中，比较父节点与其子节点。通过将父节点值与其最大的子节点交换来恢复堆属性，使得父节点值始终大于或等于左子节点和右子节点。\n\
  3. 对于从中间开始的所有元素，我们进行比较直到到达堆的叶子节点。建堆的时间复杂度为 `O(N)`。\n\n| | |\n| :--- | :--- |\n|\
  \ ![](img/image1019.jpeg) | 给数组作为输入给创建堆函数。索引 `i` 的值与其子节点进行比较，子节点位于索引 `( i*2 + 1\
  \ )` 和 `( i*2 + 2 )`。数组中间 `N/2` 处的索引 3 与索引 7 进行比较。如果子节点的值大于父节点，则交换值。 |\n| ![](img/image1020.jpeg)\
  \ | 同样，索引 2 的值与索引 5 和 6 进行比较。最大值是 7，将将其与索引 2 的值交换。 |\n| ![](img/image1021.jpeg)\
  \ | 同样，索引 1 的值与索引 3 和 4 进行比较。最大值是 8，将将其与索引 1 的值交换。 |\n| ![](img/image1022.jpeg)\
  \ | 下滤函数被用于随后调整上一步中被替换的值，通过与其子节点进行比较来实现。 |\n| ![](img/image1023.jpeg) | 现在索引 0 处的值与索引\
  \ 1 和 2 进行比较。8 是最大值，所以它与索引 0 的值交换。 |\n\n\n\n\n\n| ![](img/image01024.jpeg) | `Percolate\
  \ down` 函数用于进一步比较索引 1 处的值与其索引为 3 和 4 的子节点的值。 |\n| ![](img/image01025.jpeg) | 最终创建了大顶堆。\
  \ |\n\n### 示例 11.1\n\n```java\npublic class Heap {\n    private static final int\
  \ CAPACITY = 16;\n    private int size;    // 堆中的元素数量\n    private int[] arr;  \
  \   // 堆数组\n    public Heap() {\n        arr = new int[CAPACITY];\n        size\
  \ = 0;\n    }\n    public Heap(int[] array) {\n        size = array.length;\n  \
  \      arr = new int[array.length+1];\n        //我们不使用索引 0 \n        System.arraycopy(array,\
  \ 0, arr, 1, array.length);\n        // 对数组进行堆化操作\n        for(int i=(size/2);i>0;i--)\n\
  \        {\n            percolateDown(i);\n        }\n    }\n    //其他方法。\n}\n\n\
  private void percolateDown(int position) {\n    int lChild=2*position;\n    int\
  \ rChild=lChild+1;\n    int small=-1;\n    int temp;\n    if ( lChild <= size )\n\
  \        small =lChild;\n    if ( rChild <= size && (arr[rChild] - arr[lChild])<0\
  \ )\n        small =rChild;\n    if ( small!=-1 && (arr[small] - arr[position])<0\
  \ ) {\n        temp=arr[position];\n        arr[position]=arr[small];\n        arr[small]=temp;\n\
  \        percolateDown(small);\n    }\n}\n```\n\n### 初始化空堆\n\n#### 示例 1.2\n\n```java\n\
  private void percolateUp(int position) {\n    int parent=position/2;\n    int temp;\n\
  \    if(parent==0)\n        return;\n    if((arr[parent] - arr[position])<0) {\n\
  \        temp = arr[position];\n        arr[position]=arr[parent];\n        arr[parent]\
  \ = temp;\n        percolateUp(parent);\n    }\n}\n```\n\n### 入队 / 插入\n\n1. 将新元素添加到数组末尾。这保持了结构为完全二树，但它可能不再是一个堆，因为新元素的值可能大于其父节点。\n\
  2. 将新元素与其父节点交换，直到它的值大于父节点。\n3. 当新元素到达根节点，或者新元素的父节点节点的值大于或等于新元素的值时，步骤 2 将终止。\n\n\
  让我们来看上面创建的大顶堆的例子。\n\n![](img/image1026.jpeg)\n\n让我们以向堆中插入一个值为 9 的元素作为例。该元素被添加到堆数组的末尾。现在，该值将通过与父节点比较进行上浮操作。该值被添加到索引\
  \ 8，其父节点将是 `(N-1)/2` = 索引 3。\n\n| ![](img/image01027.jpeg) | 由于值 9 大于 4，它将与之交换。\
  \ |\n| ![](img/image01028.jpeg) | 使用上浮操作，该值向上移动直到满足堆属性。 |\n| ![](img/image01029.jpeg)\
  \ | 现在，将索引 1 处的值与索引 0 进行比较，为了满足堆属性，它将进一步交换。 |\n| ![](img/image01030.jpeg) | 现在最终通过插入新节点创建了大顶堆。\
  \ |\n\n#### 示例 11.3\n\n```java\npublic void add(int value) {\n    if(size == arr.length\
  \ - 1)\n        doubleSize();\n    arr[++size]=value;\n    percolateUp(size);\n\
  }\nprivate void doubleSize() {\n    int[] old = arr;\n    arr = new int[arr.length\
  \ * 2];\n    System.arraycopy(old, 1, arr, 1, size);\n}\n```\n\n### 出队 / 删除\n\n\
  1. 将堆根部的值复制到用于返回值的变量中。\n2. 将堆的最后一个元素复制到根节点，然后将堆的大小减 1。这个元素被称为“离位”元素。\n3. 通过将离位元素与其值最大的子节点交换来恢复堆属性。重复此过程，直到离位元素到达叶子节点或其值大于或等于其所有子节点。\n\
  4. 返回存储在步骤 1 中的答案。\n\n要从堆中删除一个元素，将其顶部的值交换到堆数组的末尾，并缩小堆的大小。\n\n| ![](img/image01031.jpeg)\
  \ | 将堆的末尾复制到头部。 |\n| ![](img/image01032.jpeg) | 堆属性丢失了。 |\n| ![](img/image01033.jpeg)\
  \ | 需要与其节点比较。 |\n| ![](img/image01034.jpeg) | 下沉 |\n\n#### 示例 11.4\n\n```java\n\
  public int remove() {\n    if(isEmpty())\n        throw new IllegalStateException();\n\
  \    int value=arr[1];\n    arr[1]=arr[size];\n    size--;\n    percolateDown(1);\n\
  \    return value;\n}\n```\n\n### 堆排序\n\n1. 使用给定数组创建堆。此操作将需要 `O(N)` 时间。\n2. 从堆中取出最大值。最大值位于数组末尾。然后缩小堆的大小。这就是堆的排序。\n\
