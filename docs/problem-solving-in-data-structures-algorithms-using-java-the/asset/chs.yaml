  \    3. 转换为后缀表达式：`BCD^E`\n- **Ex 3**：编写 HTML 标签闭合匹配程序。*提示：*括号匹配。\n- **Ex 4**：编写一个执行`后缀表达式转中缀表达式`的函数。\n\
