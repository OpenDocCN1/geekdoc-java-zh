  \    }\n}\n\nboolean find(String value) {\n    boolean ret = find(root, value);\n\
  \    System.out.println(\"Find \" + value + \" Return \" + ret);\n    return ret;\n\
  }\n\nboolean find(Node curr, String value)\n{\n    int compare;\n    if (curr ==\
