  \ 方法 3\n```java\npublic static int GetMaxArea2(int[] arr) {\n    int size = arr.length;\n\
  \    ArrayDeque<Integer> stk = new ArrayDeque<Integer>();\n    int maxArea = 0;\n\
  \    int top;\n    int topArea;\n    int i = 0;\n    while (i < size) {\n```\n\n\
  \n\n\n```java\nwhile ((i < size) && (stk.isEmpty() || arr[stk.peek()] <= arr[i]))\
  \ {\n    stk.push(i);\n    i++;\n}\nwhile (!stk.isEmpty() && (i == size || arr[stk.peek()]\
  \ > arr[i])) {\n    top = stk.peek();\n    stk.pop();\n    topArea = arr[top] *\
  \ (stk.isEmpty() ? i : i - stk.peek() - 1);\n    if (maxArea < topArea)\n      \
  \  maxArea = topArea;\n}\n}\nreturn maxArea;\n}\n```\n\n### 使用单数组实现两个栈\n\n**示例 8.14：如何使用单个数组实现两个栈。**\n\
  \n```java\npublic class TwoStack {\n    private final int MAX_SIZE = 50;\n    int\
  \ top1;\n    int top2;\n    int[] data;\n\n    public TwoStack() {\n        top1\
