  \n```java\nvoid shuffle(char[] ar, int n) {\n    int count=0;\n    int k=1;\n  \
  \  char temp='\\0';\n    for(int i=1;i<n;i=i+2) {\n        temp=ar[i];\n       \
  \ k=i;\n        do {\n            k=(2*k)%(2*n-1);\n            temp^=ar[k]^=temp^=ar[k];\n\
  \            count++;\n        } while(i!=k);\n        if(count == (2*n-2)) {\n\
