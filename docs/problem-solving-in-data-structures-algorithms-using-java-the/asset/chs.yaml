  \ `ebay`）\n功能包括所有者上架商品、竞价者出价、中标。\n\n# 附录\n\n 附录 A\n\n| 算法 | 复杂度 |\n| :--- | :---\
  \ |\n| 排序数组中的二分查找 | `O(logN)` |\n| 反转长度为 `N` 的字符串 | `O(N)` |\n| 在未排序数组中的线性查找 | `O(N)`\
  \ |\n| 比较长度为 `L1` 和 `L2` 的字符串 | `O(min(L1, L2))` |\n| 使用动态规划计算斐斐波那契数 | `O(N)` |\n\
  | 检查长度为 `N` 的字符串是否为回文 | `O(N)` |\n| 使用 Aho-Corasick 算法在另一个字符串中查找字符串 | `O(N)` |\n\
  | 使用 `Merge-Sort`/`Quick-Sort`/`Heap-Sort` 排序 `N` 个元素 | `O(N * logN)` |\n| 使用 `Bubble-Sort`\
  \ 排序 `N` 个元素 | `O(N!)` |\n| 从 1 到 `N` 的嵌套循环 | `O(N!)` |\n| 容量为 `M` 的 `N` 元素背包问题\
  \ | `O(N * M)` |\n| 在另一个字符串中查找字符串的朴素方法 | `O(L1 * L2)` |\n| 从 1 到 `N` 的三层嵌套循环 | `O(N!)`\
  \ |\n| 二十八层嵌套循环……以此此类推 | `O(N!)` |\n| 栈 | |\n| 向栈顶添加值 | `O(1)` |\n| 从栈顶移除值 | `O(1)`\
  \ |\n| 反转栈 | `O(N)` |\n| 队列 | |\n| 向队列末尾添加值 | `O(1)` |\n| 从队列头部移除值 | `O(1)` |\n\
  | 反转队列 | `O(N)` |\n| 堆 | |\n| 向堆中添加值 | `O (logN)` |\n| 从堆顶移除值 | `O(logN)` |\n| 哈希\
  \ | |\n| 向哈希表中添加值 | `O(1)` |\n| 检查值是否在哈希表中 | `O(1)` |\n\n"
