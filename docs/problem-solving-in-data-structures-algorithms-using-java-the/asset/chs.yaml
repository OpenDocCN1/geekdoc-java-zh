  | 平均时间复杂度 | O(nlogn) |\n| 空间复杂度 | O(1) |\n\n*注：* 堆排序不是稳定排序，并且在排序列表时不需要任何额外空间。\n\n\
  ## 堆的用途\n\n1. **堆排序**：最好的排序方法之一，它是就地排序，且在所有场景下的时间复杂度均为 log(N)。\n2. **选择算法**：使用堆寻找最小值、最大值、同时寻找最小最大值、中位数，甚至第\
  \ k 大的元素都可以在线性时间（通常是常数时间）内完成。\n3. **优先级队列**：用堆实现的优先级队列用于图算法，如 [Prim 算法](http://en.wikipedia.org/wiki/Prim%27s_algorithm)\
  \ 和 [Dijkstra 算法](http://en.wikipedia.org/wiki/Dijkstra%27s_algorithm)。当你需要移除具有最高（或最低）优先的对象时，堆是一个非常有用的数据结构。调度器、定时器\n\
  4. **图算法**：通过使用堆作为内部遍历数据结构，可以将运行时间降低一个项阶。此类问题的示例包括 Prim 最小树\n5. 由于缺少引用，其操作比二叉树更快。此外，一些更复杂的堆（如二项堆）可以高效合并，这对二叉树很难。\n\
  \n## 堆的问题\n\n### 最小堆中的第 K 小\n只需调用 `DeleteMin()` 操作 K-1 次，然后再次调用 `DeleteMin()`，最后这次操作将得到第\
  \ K 小的值。*时间复杂度* `O(KlogN)`\n\n### 最大堆中的第 K 大\n只需调用 `DeleteMax()` 操作 K-1 次，然后再次调用\
  \ `DeleteMax()`，最后这次操作将得到第 K 大的值。*时间复杂度* `O(KlogN)`\n\n### 流中的前 100 大值\n流中不断产生数十亿个\
  \ `integers`，某些 `getInt()` 函数逐个提供这些 `integers`。你如何确定最大的 100 个数字？\n\n*解决方案：* 大百数（或最小百数等）这类问题可以使用堆非常容易地解决。在我们的情况下，我们将创建一个最小堆。\n\
  \n1. 首先用前 100 个整数构建一个最小堆。\n2. 然后对于每个进入的整数，比较它是否大于最小堆的顶端。\n3. 如果不是，则寻找下一个整数。如果是，则从最小堆中移除堆顶值，将新值插入到堆顶，使用\
  \ `procolateDown` 并将其移动到堆中适当的位置。\n4. 每次你都在头脑中都存储了最大的 100 个值。\n\n### 合并两个堆\n如何合并两个堆？\n\
  \n解决方案：这没有单一的解决方案。我们假设较大堆的大小为 N，较小堆的大小为 M。\n\n1. 如果两个堆的大小相当，则将两个堆数组放在同一个更大的数组中。或者如果数组足够大，放在其中一个数组中。然后应用\
  \ `CreateHeap()` 函数，该函数将消耗 `theta(N+M)` 时间。\n2. 如果 M 远小于 N，则将 M 数组的每个元素逐个添加到 N 堆中。这在最坏情况下需要\
  \ `O(MlogN)`，在最好情况下需要 `O(M)`。\n\n### 获取中位数函数\n**示例 11.6：** 给出一个可以在数时间内提供给定值中位数的数据结构。\n\
  \n**解决方案：** 我们将使用两个堆，一个最小堆和一个最大堆。首先，有一个最大堆包含数据的前半部分，最小堆包含数据的后半部分。最大堆包含数据的较小部分，其最大值（位于堆顶）将是中位数候选者。同样，最小堆包含数据的较大部分，其最小值（位于堆顶）将包含中位数候选者。我们将跟踪堆的大小。每当我们向堆中插入一个值时，我们会确保堆的大小差异最大为\
  \ 1，否则我们将弹出一个元素并插入到另一个堆中以保持平衡。\n\n```java\nimport java.util.Collections;\nimport\
  \ java.util.PriorityQueue;\n\nclass MedianHeap {\n    PriorityQueue<Integer> minHeap;\n\
  \    PriorityQueue<Integer> maxHeap;\n\n    public MedianHeap() {\n        minHeap\
  \ = new PriorityQueue<>();\n        maxHeap = new PriorityQueue<>(Collections.reverseOrder());\n\
  \    }\n\n    //其他方法\n    //此处省略具体实现细节以保持翻译逻辑一致\n```\n\n### 是否为最小堆\n**示例 11.7：**\
  \ 给出一个数组，判断它是否为二叉最小堆\n\n```java\nboolean IsMinHeap(int[] arr, int size) {\n    for\
  \ (int i = 0; i <= (size - 2) / 2; i++) {\n        if (2 * i + 1 < size) {\n   \
  \         if (arr[i] > arr[2 * i + 1]) {\n                return false;\n      \
  \      }\n        }\n        if (2 * i + 2 < size) {\n            if (arr[i] > arr[2\
  \ * i + 2]) {\n                return false;\n            }\n\n}\n        \n   \
  \ \n\n}\n```\n\n### 是否为最大堆\n**示例 11.8：** 给出一个数组，判断它是否为二叉最大堆\n\n```java\nboolean\
  \ IsMaxHeap(int[] arr, int size) {\n    for (int i = 0; i <= (size - 2) / 2; i++)\
  \ {\n        if (2 * i + 1 < size && arr[i] < arr[2 * i + 1]) {\n            return\
  \ false;\n        }\n        if (2 * i + 2 < size && arr[i] < arr[2 * i + 2]) {\n\
  \            return false;\n        }\n    }\n    return true;\n}\n```\n\n**分析：**\
  \ 如果每个父节点都大于其子节点，则堆属性成立。我们将从数组的一半开始并逐个减小尺寸，从而比较索引的值与其左子节点和右子节点的值。\n\n\n\n\n堆的设计并不是为了遍历来查找某个元素，而是为了快速获取最小或最大元素。尽管如此，如果你仍然想遍历堆，只需按顺序遍历数组即可。这种遍历将是层序遍历。这种遍历将具有线性的\
  \ `Time Complexity`。\n\n### 从最小堆堆中删除任意元素\n\n同样，堆的设计并不是为了删除任意元素，但如果你仍然想这样做：请在堆数组中通过线性查找找到该元素。用存储在\
  \ `Heap` 末尾的值替换它。将堆的大小减一。将新插入的值与父节点进行比较。如果它的值小于父节点的值，则向上调整（percolate up）。否则，如果它的值大于左右节点的值，则向下调整（percolate\
  \ down）。`Time Complexity` 为 `O(logn)`。\n\n### 从最小堆堆中删除第 K 个元素\n\n同样，堆的设计并不是为了删除任意元素，但如果你仍然想这样做：用存储在\
  \ `Heap` 末尾的值替换第 K 个位置的值。将堆的大小减一。将新插入的值与其父节点进行比较。如果它的值小于父节点的值，则向上调整（percolate up）。否则，如果它的值大于左右节点的值，则向下调整（percolate\
  \ down）。`Time Complexity` 为 `O(logn)`。\n\n### 在最小堆中打印范围内的值\n\n线性遍历堆并打印在给定范围内的值。\n\
