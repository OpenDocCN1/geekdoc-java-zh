  \n\n\n\n\n```java\nchar[] addBinary(char[] first, char[] second)\n{\n    int size1\
  \ = first.length;\n    int size2 = second.length;\n    int totalIndex;\n    char[]\
  \ total;\n    if(size1>size2)\n    {\n        total = new char[size1+2];\n     \
  \   totalIndex = size1;\n    }\n    else\n    {\n        total = new char[size2+2];\n\
  \        totalIndex = size2;\n    }\n    total[totalIndex + 1] = '\\0';\n    int\
  \ carry =0 ;\n    size1--;\n    size2--;\n    while(size1 >=0 || size2 >=0)\n  \
  \  {\n        int firstValue = (size1 < 0) ? 0 : first[size1]-'0';\n        int\
  \ secondValue = (size2 < 0)? 0: second[size2]-'0';\n        int sum = firstValue\
  \ + secondValue + carry;\n        carry = sum >> 1;\n        sum = sum & 1;\n  \
  \      total[totalIndex] = (sum==0) ? '0' : '1';\n        totalIndex--;\n      \
  \  size1--;\n        size2--;\n    }\n    total[totalIndex] = (carry==0) ? '0' :\
  \ '1';\n    return total;\n}\n```\n\n## 练习题\n\n1. 给定字符串，找到无重复字符的最长子串。\n2. 函数 `memset()`\
