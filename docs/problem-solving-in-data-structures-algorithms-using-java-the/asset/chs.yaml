  #### 数组和链表的优缺点\n- **链表**：列表实现在每个项目都使用额外的内存。没有大小限制。\n- **数组**：分配固定数量的空间；当数组几乎为空时，空间会被浪费。最大大小在创建时确定。\n\
  \n#### 栈的用途\n- 递归可以使用栈来实现。\n- 函数调用是使用栈实现的。\n- 当我们想要反转一个序列时，我们将所有内容推入栈并从中弹出。\n- 语法检查、括号平衡、中缀表达式转后缀表达式等。\n\
