  md: '# A University System


    What exactly will we be making? Let''s imagine a university scenario. We need
    a system to represent the university. We could create this entire system but we
    don''t want to do that, it''d be a ridiculously big project, a bit beyond what
    I have in mind. A university of, course, has many departments. Naturally, we''re
    going to focus on the Computing Department, since that would be most fitting.
    We shall create a system that represents a Computing Department at some university.


    Let''s consider what we will want our system to do, what will it need. Bear in
    mind that the list could be near endless so we will be focusing on a few things
    only.


    +   1. Each course taught by the department

    2. Each lecturer within the department

    3. students enrolled in a course taught by the department

    4. adding and removing the above


    That''s the leverages of what our system will be representing. Each of these points
    will have their own requirements too. This will be a console based program that
    we create but the functionality of the program will be usable within a graphical
    system too. The changes required would be how information is displayed and how
    data is input. This isn''t really relevant to you but it''s nice to know that
    console applications with purpose such as this can be expanded into the graphical
    universe. It makes the project feel all the more purposeful!


    Let''s create our package directory first. I''ll be calling mine DocC, for Department
    of Computing because calling CD for Computing Department doesn''t sound as cool
    plus typing "cd" in Windows'' console would be weird. Feel free to name your package
    whatever you like, using the same naming conventions as a variable, as long as
    you remember to change my package name to your name when writing your code! That''s
    the easy bit done. Now, what classes do we want? Well, sticking with our university
    scenario outlined above, the university will have multiple departments which means
    our computing department is one of them, we''re going to create a class to represent
    that. I''ll be naming this class Doc.java for simplicity. We could also create
    a parent class to represent all departments within the university but I won''t
    be doing that. Don''t worry, I''ll give a list of the classes we''ve walked through
    what we need. We will want a class to represent the courses within our department
    too. Each of which is taught by a lecturer. We also have students and there will
    definitely be some common ground between a student and a lecturer, they''re both
    people. So we can create a Person class for this common ground and a Student and
    Lecturer class that''ll inherit from Person.'
