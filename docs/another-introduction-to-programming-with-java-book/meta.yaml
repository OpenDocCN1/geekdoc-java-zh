    | / | y = y/10; or y /= 10; | Division operator |

    | * | y = y*10; or y *= 10; | Multiplication Operator |

    | % | y = y%10; or y %= 10; | The remainder operator which gives the remainder
    of a division sum; also known as the mod or modulo operator |


    Arithmetic expressions that are combined with the assignment operator to look
    like this:


    ```

