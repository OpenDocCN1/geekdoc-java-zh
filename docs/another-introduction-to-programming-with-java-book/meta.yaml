  md: "# Nested Loops\n\nNested loops are something you should know about but I don't\
    \ want to go into too much detail about them. They are simply loops within loops.\
    \ You may create as many as you wish, think of the movie Inception. Nesting for\
    \ loops is a common practice when iterating over multi-dimensional arrays, for\
    \ example. Or to create a grid within a 2D game. Nested loops don't have to be\
    \ of the same type. You can have a for loop inside a while loop and vice versa.\n\
    \nThe following code demonstrates a nested for loop:\n\n```\nfor (int i=0; i<\
    \ 10; i++) {\n    for (int j = 0; j < 10; j++) {\n        System.out.println(\"\
    i=\" + i + \", j=\" + + j);\n    }\n}\n```\n\nThis code will print out the value\
    \ of i and j at each iteration of each loop. This means we can expect to see i=0,\
    \ j=0, i=0, j=1, i=0, j=2 until both i and j reach 9. For each iteration of the\
    \ outer loop, the inner loop will run its full 10 iterations."
