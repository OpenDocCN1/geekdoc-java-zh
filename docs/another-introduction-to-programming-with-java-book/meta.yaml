  md: "# For each loops (enhanced for loops)\n\nThe for-each loop is the newer style\
    \ for loop that is much more elegant. You don't need to use it, the old style\
    \ for is perfectly fine. You should at least be familiar with it in case you see\
    \ it somewhere else. It's better to be prepared.\n\nThe for-each loop simply says\
    \ \"for each item, x, in y...\" and proceeds to iterate through the list until\
    \ it reaches the end. This does away with the need to know the length of the list\
    \ and the need to keep track of the current iteration if the loop. The only real\
    \ downside is if you need to know the iteration, you will have to add a counter\
    \ such as that seen with the while loop.\n\nA typical for-each loop looks like\
    \ this, imagining the array arr that I previously demonstrated above it exists\
    \ here:\n\n```\nfor (int i : arr) {\n  System.out.println(i);\n}\n```\n\nNow this\
    \ for-each loop does exactly the same as the for loop shown previous but it's\
    \ so much neater. It reads as \"for integer i in the array arr...\". For each\
    \ iteration of the loop, i takes the value stored in the element of the array\
    \ arr at the current index. We then access that value by referring to i and using\
    \ System.out.println() to print the value to a new line in the console."
  merge: -1
