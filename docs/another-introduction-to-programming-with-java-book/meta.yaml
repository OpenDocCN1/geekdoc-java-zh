    - 4. 访问修饰符的存在是为了减少其他程序员使用你的代码时产生的错误\n\n# 第 5 章：条件语句、流程控制\n\n什么是条件语句？\n\n在程序的某个时刻，你可能想要做出决定并据此采取行动。条件语句允许你做到这一点——可以说，你可以提一个问题，并根据答案是是还是否来执行某件事或另一件事。你可能几乎任何时候都需要使用条件语句，因此理解它们很重要。首先，条件语句可能被简单地称为\
    \ if 语句或 if-else 语句，因为在编写条件语句时会使用 if 和 else 关键字。这里我们使用了第 3 章中的关系运算符、相等运算符和条件运算符。\n\
    \n# if 语句\n\n简单的 if 看起来像这样：\n\n```\nif (true) {\n  //执行某些操作\n}\n```\n\n这表示如果 true\
    \ 为真，则执行代码块内（大括号内）的代码。当然，这个示例将始终为真，因为并没有实际的条件语句。\n\n这是一个实用的示例：\n\n```\nif (age\
