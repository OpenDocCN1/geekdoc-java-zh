    \ 18 or over and was not born in December\");\n}\nelse if (dob_month == 12) {\n\
    \    System.out.println(\"The user was born in December\");\n}\n```\n\n在这里我使用了上一个示例中的相同语句：如果变量\
    \ ‘age’ 的值大于或等于 18，或者 ‘dob_month’ 的值不等于 12，则执行 if 块中的代码；但现在我们在此基础上增加了……如果变量 ‘dob_month’\
    \ 的值等于 12，则执行 else-if 块中的代码。\n\n这为我们控制代码流提供了更大的灵活性，并允许我们在需要时提出更多的条件语句。\n\n## else\
    \ 语句\n\nelse 语句必须跟在 if 语句或 else-if 语句之后，不能单独使用。它们还必须是系列条件语句中的最后一个语句，例如，else-if\
    \ 语句不能跟在 else 语句之后。\n\n本质上，else 语句的意思是“如果 if 语句为假，则执行此操作”。参见下方的示例：\n\n### 有效\n\
    \n```\nif(age>=18) {\n    System.out.println(\"The user is 18 or over\");\n}\n\
    else if(age >= 10) {\n    System.out.println(\"The user is between 10 and 17 years\
    \ of age\");\n}\nelse {\n    System.out.println(\"The user is under 10 years of\
    \ age\");\n}\n```\n\n### 有效\n```\nif(age >=18) {\n    System.out.println(\"The\
    \ user is 18 or over\");\n} else {\n    System.out.println(\"The user is under\
    \ 18 years of age\");\n}\n```\n\n### 无效\n```\nelse {\n    System.out.println(\"\
    The user is under 18 years of age\");\n}\n```\n\n## 三元运算符\n\n三元运算符仅仅是 if-then-else\
    \ 代码的简写。它们可以嵌套；即在一个语句内部包含另一个语句，以此此类推。三元运算符是我个人的喜爱，因为它看起来很酷，而且通常写在一行代码上。三元运算符的一个典型特征是根据条件为变量分配特定的值。这里是这种操作的几个示例：\n\
    \n```\nint x = 10;\nint y = 15;\nint z = (y==x) ? x+y : x;\nz = (y==x) ? (y>x)\
    \ ? y : x;\n```\n\n让我们分析这段代码。前两行创建了变量 x 和 y，并给它们赋值（声明和初始化）。第三行也创建了一个整数，其值由使用三元运算符（:\
    \ ）的 if-then-else 语句决定。它的格式如下：\n\n(条件) ? 为真的结果: 为假时的结果\n\n因此，根据定义的值，z 的值变为 10，因为：\n\
    \n如果 (15==10) 为真，则 z 的值为 10+15；否则 z 的值为 10。\n\n最后一行代码再次使用三元运算符为 z 分配了一个新值，但这次包含了一个嵌套条件。如果原始条件为假，则会评估另一个条件。根据求值结果，z\
    \ 的新值变为 15；即 x 和 y 中较大的数。用简单的英语来说，这条语句可以这样读作：\n\n如果 (15 == 10) 为真，则 z 的值为 10；否则如果\
    \ 15 大于 10，则 z 的值为 15\n\n尽管这种编码方法看起来很复杂，但在我看来，这种编写条件的方法是非常优雅的。使用三元运算符与 if-then-else\
    \ 语句相比，性能上并没有提升。额外的益处是提供了简洁的代码。三元运算符作为唯一选择的一种特定场景是你需要根据条件初始化一个常量。正如第 3 章提到的，常量是一个一旦初始化值就不能改变的变量。\n\
    \n## switch 语句\n\nswitch 语句如第二章中的 Hello World boring! 程序所示，是另一种流程控制方式。它们与 if 和\
    \ if-else 语句不完全相同，但非常有用。\n\nswitch 语句并不是为真和假情况制定行动计划，而是有若干可能的行动情况（cases）。所选的方案取决于\
    \ switch，它本质上是一个变量。switch 可以使用 byte、int、char、short 和 String，以及一些包装了原始数据类型的特殊类，但我们将忽略这些，那超出了我们的讨论范围。我们将在\
    \ switch 语句中使用整数，因为它们最容易处理。\n\n现在假设你想根据用户输入打印特定的响应。你可以写几十个 if 语句来适应每种情况，这也能行得通。你应该根据你正在评估的数据来决定使用哪种，if\
    \ 语句可以评估范围，而 switch 只能评估一个值。以下是操作方法：\n\n```\nint switcher = 0;\nswitch(switcher)\
    \ {\n  case 1:\n    //do stuff\n    break;\n  case 2:\n    //do other stuff\n\
    \    break;\n  case 3:\n    //do other other stuff\n    break;\n  default:\n \
    \   //do default stuff\n    break;\n}\n```\n\n如你所见，switch 内部的每个决策都被称为一个 case。switch\
    \ 尝试将给定的值与任何 case 匹配；如果有匹配，将执行该 case 内的代码。case x: 和 break; 之间的任何代码都将被执行。break\
    \ 关键字在这里非常重要，如果没有它，任何执行的 case 都会发生穿透（fall through），这意味着匹配的 case 之后的每个 case 都会顺序执行，直到\
    \ switch 块结束。这可能会导致各种头疼！最后，还有一个 default: case，在没有匹配项时将执行，它不是强制的，但强烈建议使用。switch\
    \ 语句评估的数据可以来自任何地方。在这个示例中，我们使用了一个简单的整数变量，但可以根据用户输入、if 语句甚至计算来设置为不同的值。我们将在第 8 章看到使用\
    \ switch 语句的良好示例。\n\n## 第 6 章：循环\n\nJava 为我们提供了几种类型的循环可以使用。本章将查看每种循环类型以及循环的问题和优点。你会发现自己常用的两种主要循环类型是\
    \ for 循环和 while 循环，每种都有几种变体。\n\n## while 循环\n\nwhile 循环本质上是“当此条件为真时，执行下面的内容”。这是一个简单的\
    \ while 循环的伪示例：\n\n```\nwhile(condition) {\n  // some stuff\n}\n```\n\nwhile 循环最适合执行未知次数的代码块。条件可以是任何求值为真的的表达式，正如上一章关于条件判断所示。然而，与\
    \ if 语句不同，while 循环内部的表达式必须求值为真循环才能运行，没有 else while 循环。while 循环的主要优点是你可以根据条件重复执行同一段代码。这听起来可能很基础，但那是因为确实如此。你很快就会发现，并不是所有循环都是这样工作的。\n\
    \n等一下，废话就不多说了，这里有几个 while 循环来演示它们在各种场景下的用法。首先是一个简单的算术表达式，它在循环运行几次后将变为假：\n\n```\n\
    int age = 10;\nwhile(age < 18) {\n  //You cannot drink until you are 18, come\
    \ back next year.\n  age += 1; //给年龄加1。也可以写成 age++;\n  //或者写成 age = age + 1;\n\
    }\n```\n\n所以这个循环总共运行 8 次，直到 age 的值不再小于 18。注意，while 循环条件中使用的变量在循环体内被操纵了。这非常重要。如果没有发生这种情况，循环将永远不会结束，我们将陷入无限循环，稍后会详细介绍。\n\
    \n接下来是一个带有计数器的 while 循环，这样你可以跟踪循环运行的次数。\n\n"
