  md: '```

    class HelloWorld

    ```


    This first line is defining class. The word class is a keyword in Java and is
    followed by the name of the class, beginning with a capital letter as is convention.


    ```

    //start of class

    ```


    The next line is simply the start of the class. Think of this curly brace as an
    open gate that has to closed at a later stage. Opening braces always need matching
    closing braces. This line also shows a single line comment. Comments are included
    to remind you what particular code does or to help other programmers understand
    your code; the compiler ignores comments.


    ```

    public static void main(String[] args)

    ```


    This is the declaration of the main method within your HelloWorld class. The main
    method is the entry point of any program and is required for a Java class to be
    able to execute. The signature above (the way the method is defined) is how the
    main method should be defined and how Java identifies the method as your program''s
    entry point. The first two keywords public and static are referred to as modifiers
    and can be written in this order or swapped around, they will still work the same.
    The next word is void and, although this sounds sinister, it''s simply a return
    type - methods can return data but the main method does not and thus it has a
    return type of nothing or void. Next is the word main. This is the name of our
    method. You can create a main() method perfectly legally without any arguments
    that is not a program''s entry point but I would consider this bad practice simply
    because of the potential confusion. The String[] args is a parameter or argument
    of type String[] It does not require the name args or argv are the conventional
    names of choice for this particular argument. Finally, the [] [] denotes that
    the argument is an array and can contain more than one value. This explanation
    may come across as quite a mountain of information at first, for one little line,
    but will make much more sense once we look at variables and methods so try not
    to get caught up on it for now!'
