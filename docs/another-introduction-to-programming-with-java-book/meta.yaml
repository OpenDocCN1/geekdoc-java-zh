    # Chapter 4: Access Modifiers


    Access modifiers are keywords used to control access to a particular field (variable)
    or method of a class or the class itself. These keywords are public, private and
    protected. Classes are to be controlled by top level access control and member
    fields and methods by member access control.


    Top Level Access Control:


    This is intended to control access to classes and can either be public or package-private
    (which has no specific modifier keyword). A class declared with the public modifier
    is visible to all classes within a project, regardless of package, and if no modifier
    is used, package-private, the class is only visible to classes within the same
    package.


    Examples of this in use are as follows:


    ```

    public TestClass {

    }

    ```


    ```

    or, simply,

    TestClass {

    ```


    Member Level Access Control:


    Member level access control refers to controlling the access to methods and fields
    within a class. Firstly, you can use the public keyword or omit a keyword in the
    same way, and with the same meanings, as above. Further to this, you can use the
    protected or private modifiers. The private modifier allows access only from within
    the same class and the protected modifier gives access to methods and fields from
    the same package, similarly to package-private, but with the addition of allowing
    access via a subclass of the class in another package. Following is a table illustrating
    the levels of access, similar to that found within the Java documentation:


    | Modifier | Class | Package | Subclass | World |

    | --- | --- | --- | --- | --- |

    | public | Yes | Yes | Yes | Yes |

    | protected | Yes | Yes | Yes | No |

    | modifier not used | Yes | Yes | No | No |

    | private | Yes | No | No | No |


    The first column indicates which modifier is being referenced. This is followed
    by'
  - '[PAGE 53]


    whether or not the modifier provides access to the class it is used in (the class
    column) and then the package class it is contained in (the package column). If
    the modifier allows access within a subclass of the class it is used in (the subclass
    column) and finally whether the modifier allows access from any class within any
    package (the world column).


    One of the key purposes of access modifiers is to ensure errors from misuse of
    your class cannot happen if your class is used by other programmers. When deciding
    which access modifiers to use, you should always go with private unless you have
    a reason not to and avoid public fields except for constants or unless you have
    a reason to do so.


