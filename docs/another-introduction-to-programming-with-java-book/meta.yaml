    # Chapter 3: Variables and Operators


    # # What is a variable?


    Variables hold data. Different types of variable hold different types of data.
    I like to think of a variable as a toddler''s shape sorter; only the right shapes
    can fit into the right slots. It''s comes from the fact that usually, the value
    of a variable can vary/change. They are used to store data in programs. We have
    already seen variable declarations in the last chapter so we will look at them
    in more detail including primitive types and scope (from where your variables
    can be seen within your program). Variables may also be referred to as member
    variables or fields. A variable name may contain numbers but not start with them;
    underscores and the dollar sign can also be used within a variable name and can
    be used at the start of the variable name, however the dollar sign is never used
    and the underscore appears at the beginning of a variable, owing to convention.
    Finally, the typical convention for naming variables is non-crypt names that start
    with a lower case word and following word is capitalized, also known as camelcase.
    We see the examples below depicting how one would expect to see naming conventions
    used on a variable name, each separated by a comma.


    ```

    variableOne, variable1, VARIABLE_ONE, sensibleVariableName //acceptable

    var //illegal

    v, vOne //ok but cryptic

    _variable1 //ok but against convention

    VariableOne, Variable //ok but against convention (note the upper case V)

    ```


    Also, words defined as keywords in Java cannot be used as variable names, Java
    keywords are listed at https://wikipedia.org/wiki/List_of_Java_keywords if you
    want to take a look over them but the compiler will always let you know if you
    try to use a keyword as a variable name, although it might not be clear.'
