  md: '# Chapter 15: Interfaces


    Interfaces are so named based on the idea that methods within a class are the
    interface in which objects can be interacted with from the outside world. In Java,
    an interface is similar to a class in that they can declare methods and variables,
    with one difference. An interface method cannot have a body. Variables declared
    within an interface are final meaning that they cannot be changed. When you declare
    a method within an interface, you simply write the method signature and whack
    a semi-colon on the end. There''s no opening and closing curly brace and no code
    in between.


    So, what does an interface look like? A class, of course! The only difference
    is we replace the word class with interface. The filename will still have to match
    the interface name, a class name must match the filename.


    ```

    interface NewInterface {


    public void someMethod();

    }

    ```


    There we go, that''s the essence of an interface. To make use of an interface,
    we use the implements keyword. Like so:


    ```

    class NewClass implements NewInterface {

    }

    ```


    Go ahead and create these two files and compile NewClass.java and see what happens.


    The thing you''ll immediately notice is a compiler error telling you that NewClass
    is not abstract and does not override abstract method someMethod() in NewInterface.
    This is saying that your NewClass must have a method called someMethod(). That''s
    the beauty of interfaces. They define methods that must be implemented by any
    class that implements the interface, otherwise the class will not compile. On
    top of this, a class can implement as many interfaces as you want. You can only
    inherit from one class but you can use many interfaces. Interfaces are implemented
    after you inherit from a class so your class, inheriting from a parent class and
    implementing interfaces, will always look like this:


    ```

    class NewClass extends SomeParent implements NewInterface1, New2 extends first
    and then implements.

    ```


    Let''s take a look at a potential use for the interface:


    ```

    interface Car {

    ```'
