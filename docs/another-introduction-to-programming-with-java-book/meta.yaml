  - '[PAGE 132]


    # Exceptions


    Java utilises exceptions to handle errors. This refers to any exceptional event
    which, during execution of a program, disrupts the normal flow of a program’s
    instructions. The runtime errors described above are dealt with in this section.
    There are three kinds of exception in Java:- Checked, errors and runtime exceptions.
    When exceptions occur, they are said to be thrown. An object is created to represent
    an exception and something has to catch it. When any exception is thrown, the
    runtime system attempts to find something to handle it, this is known as an exception
    handler. An exception can either be caught at the point of occurrence in which
    the code is contained within a try-catch block, an exception handler, or the method
    that contains the code can throw the exception which then passes it up the call
    stack until an exception handler is found. If no exception handler is found then
    the runtime system and program will terminate. This is usually the case for errors
    and runtime exceptions, you will see why in the next section.'
  - '[PAGE 133]


    # Checked Exceptions and the catch or specify requirement


    Checked exceptions are those that a well-written program should be able to recover
    from. For example, attempting to open a file that does not exist would produce
    a checked exception. The program should cater for this scenario by catching the
    exception, notifying the user and perhaps allowing them to correct their mistake
    and continue with the program. Checked exceptions are subject to what Java refers
    to as the catch or specify requirement. This requirement means that code may throw
    certain types of exception must be enclosed in either a try-catch block or within
    a method that throws the exception. Neither errors or runtime exceptions are subject
    to this requirement.


    # Unchecked Exceptions


    The other two types of exception are collectively referred to as unchecked exceptions
    because they are not required to honour the catch or specify requirement which
    means code that may produce such errors will compile or not it is contained within
    a try-catch block or method which throws an exception.


    The error exception is a type of exception that is external to the program and
    the program may not be able to anticipate such errors or recover from them. For
    example, attempting to open a file could result in an error because the file exists
    but it cannot be opened. You may catch this type of exception in order to handle
    it but it is not a requirement. Of course, it would be sensible to handle such
    possibilities appropriately by letting your program crash is not good form and
    this would be the outcome of not handling error exceptions. so try not to worry
    too much about every unknown event; if an unhandled error exception is thrown
    then your program will terminate and print a stack trace to help you debug and
    resolve the cause.


    The runtime exception is the third type of exception. Unlike errors, runtime exceptions
    are exceptions that are internal to the program but unlikely to be anticipated
    and or recovered from. A typical example of this would be trying to access a variable
    or array that is not initialized. This will create a NullPointerException. Again,
    you may choose to catch these errors or let them play out which will result in
    program termination and a printout of a stack trace. Alternatively, and more sensibly,
    you can strive to eliminate these exceptions by rectifying the problems that cause
    them.


    Okay, enough rambling. That’s the “under the hood” version, let’s take a look
    at how to actually handle some exceptions!'
