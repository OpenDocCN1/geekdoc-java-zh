    \n## 嵌套类\n\n我只想简单提到一下嵌套类，尽管它稍微超出了本书的预定范围。但我觉得应该让你了解它们，以便在将来它们对你的工作有帮助时，你可以进行进一步研究。\n\
    \nJava 允许在类内部创建类。这些被称为嵌套类。嵌套类可以是两种类型之一：静态嵌套类或非静态嵌套类，后者简单地称为内部类。\n\n当你定义一个内部类时，它可以访问包含类的所有成员变量和方法，即使它们是私有的。这是使用嵌套类的原因之一，即以这种方式增加封装性。将较小的类嵌套在顶层类中，可以使内部类代码在位置上更靠近其被使用的地方，从而有助于开发。内部类的行为与顶层类（或外部类）中的其他成员变量类似。静态嵌套类则不然。它们等同于将一个顶层类嵌套在另一个顶层类内部。\n\
    \n```java\nclass outerClass {\n    class innerClass {\n}\n}\n```\n\n这基本上就是嵌套类的样子了。如果你需要关于嵌套类的更多信息，请参考在线\
    \ Java 文档。\n\n## 核心要点\n\n- 1. 类通常代表对象\n- 2. 你应该为所有成员变量和函数提供一个访问修饰符\n- 3. 你不需要定义类构造函数，但这样做是个好主意\n\
    - 4. 构造函数可以重载\n- 5. 当实例化一个类时，你是在创建它的实例，即它的副本\n- 6. 使用点符号法（点操作符）访问成员变量和方法\n- 7.\
    \ `this` 关键字指向代码所包含的类\n- 8. 利用 getter 和 setter 方法\n\n## 练习题\n\n创建一个类，用于表示提供的摄氏度和华氏度温度，类似于我们在第\
    \ 8 章中编写的程序。该类的构造函数应该接收单位类型（即摄氏度或华氏度）和一个温度值。然后它应该将该值转换为另一种单位类型并存储这两个值。每个值都应该有一个\
    \ getter 和 setter 方法。setter 方法还应该有权通过某些私有方法将温度转换为另一种格式，第 8 章中的 `toCelsius()` 和\
    \ `toFahrenheit()` 在这里会很有用。最后，你应该创建一个单独的类来包含程序的入口点，并创建并实例化你的温度对象，为它提供 30 摄氏度的值。你应该访问摄氏度和华氏度的\
    \ getter 方法并输出结果。你的结果应分别为 30 和 86。测试你用于摄氏度的 setter 方法并显示更新后的结果，然后再次测试用于华氏度的 setter\
    \ 方法并显示更新后的结果。一旦你研究了错误处理，我们将开始更多地使用第 8 章演示的 Scanner 类。这将结束第 12 章的练习。如果你想接受额外的挑战，使用\
    \ Scanner 类接收用户输入，并允许用户选择他们想要从哪个温度单位转换到哪个值。不过，我不会将此扩展内容包含在书后的答案中，因为我在第 8 章中演示过此功能，现在不想重复了！\n\
    \n## 第 13 章：错误处理\n\n错误处理对于任何健壮的程序都是至关重要的。编译错误是任何阻止你的程序编译的错误。还有检查异常，它们也会阻止 Java\
    \ 程序编译，但这些将在下文中讨论。本节专门处理非异常错误。例如，假设你忘记写了一个大括号。你可能会遇到：\n\n```\nerror: reached end\
    \ of file while parsing\n```\n\n这并不怎么帮助。它只是说编译器意外到达了文件末尾，是因为解析时没有结束。这是一个你漏掉了某个大括号的良好指示。它并没有指出具体位置，所以一个恰切的起点是你最近修改代码的地方。如果你找不到任何地方，你有一项细致的任务来定位问题，祝你好运！\n\
    \n其他 Java 编译错误包括忘记关闭字符串：\n\n```\nx: error: unclosed string literal\n```\n\nx 将代表发现未关闭字符串字面量的行号，或者在其之前的一两行。这是一个很容易找到的错误。\n\
    \n```java\nx: error: ';' expected\n```\n\n再次，x 将代表问题所在的行号，这次是缺少分号。如果你尝试使用关键字命名变量，你也可能看到这个错误。\n\
    \n```\nx: error: cannot find symbol\n```\n\n```\nsomeSymbol()\n```\n\n```\n^\n\
    ```\n\n此错误意味着你正在使用一个不存在的方法，或者你拼错了它的名称。同样的错误消息也适用于不存在或拼写错误的变量。错误源的行号会被指示。\n\n```\n\
    x: error: illegal start of expression\n```\n\n如果你在创建 for 循环时误写 `for()`，在 `if`\
    \ 语句中包含条件，或者在其他情况下，你可能会遇到这种编译错误。提供一个行号，这通常是定位问题的良好指标。\n\n"
