- md: "\n# Comparison (Equality and Relational) Operators\n\nThese operators are all\
    \ used for the comparison of one value vs another and as such the result will\
    \ return a boolean value of true or false.\n\n| Symbol | Example | Purpose |\n\
    |---|---|---|\n| == | x == 10 returns true | To determine whether two values are\
    \ equal (equal to) |\n| != | x != 10 returns false | to determine whether two\
    \ values are *not* equal (not equal to) |\n| > | x > z returns false | To determine\
    \ whether the left value is greater than the right value (greater than) |\n| >=\
    \ | x >= z returns false | To determine whether the left value is greater than\
    \ **or** equal to the right value (greater than **or** equal to) |\n| < | x <\
    \ 20 returns true | To determine whether the left value is less than the right\
    \ value (less than) |\n| <= | 15 <= y returns false | To determine whether the\
    \ left value is less than **or** equal to the right value (less than **or** equal\
    \ to) |\n\n# Conditional Operators\n\n| Symbol | Example | Purpose |\n| --- |\
    \ --- | --- |\n| && | x == 10 && !y returns true | The conditional AND operator\
    \ where both parts of the conditional statement have to be satisfied in order\
    \ for the statement to be true |\n| || | x == 15 || x == y | The conditional OR\
    \ operator where only one of two parts of the conditional statement have to be\
    \ satisfied in order for the statement to be true |\n| ?: | x == 10 ? : false\
    \ | The ternary operator which is effectively shorthand for if-then-else (if condition\
    \ is met, true else false) but you will most likely understand this better after\
    \ the Conditional Statements chapter |\n\nThe conditional AND operator takes precedence\
    \ over the conditional OR operator and as such it is evaluated first in the event\
    \ that you decide to use both operators within the same expression. Both of these\
    \ operators function on a short-circuit basis (according to Java documentation)\
    \ and this means that they will only evaluate as much as necessary as if the left\
    \ hand expression is false, the right hand expression will not be evaluated if\
    \ the conditional AND operator has been used, for example.\n\n![](img/ef6a16f18f5dfa49daafe188589229ff_50_0.png)\n\
    \n- 1. Variables are also called fields, members or member variables\n- 2. You\
    \ must select the correct data type for the data you will store in your variable\n\
    - 3. The plus sign (+) is also used for joining strings together (String concatenation)\n\
    - 4. Strings are not technically primitive data types but are generally thought\
    \ as such due to the support given to them by Java\n\n# Chapter 4: Access Modifiers\n\
    \nAccess modifiers are keywords used to control access to a particular field (variable)\
    \ or method of a class or the class itself. These keywords are public, private\
    \ and protected. Classes are to be controlled by top level access control and\
    \ member fields and methods by member access control.\n\nTop Level Access Control:\n\
    \nThis is intended to control access to classes and can either be public or package-private\
    \ (which has no specific modifier keyword). A class declared with the public modifier\
    \ is visible to all classes within a project, regardless of package, and if no\
    \ modifier is used, package-private, the class is only visible to classes within\
    \ the same package.\n\nExamples of this in use are as follows:\n\n```\npublic\
    \ TestClass {\n}\n```\n\n```\nor, simply,\nTestClass {\n```\n\nMember Level Access\
    \ Control:\n\nMember level access control refers to controlling the access to\
    \ methods and fields within a class. Firstly, you can use the public keyword or\
    \ omit a keyword in the same way, and with the same meanings, as above. Further\
    \ to this, you can use the protected or private modifiers. The private modifier\
    \ allows access only from within the same class and the protected modifier gives\
    \ access to methods and fields from the same package, similarly to package-private,\
    \ but with the addition of allowing access via a subclass of the class in another\
    \ package. Following is a table illustrating the levels of access, similar to\
    \ that found within the Java documentation:\n\n| Modifier | Class | Package |\
    \ Subclass | World |\n| --- | --- | --- | --- | --- |\n| public | Yes | Yes |\
    \ Yes | Yes |\n| protected | Yes | Yes | Yes | No |\n| modifier not used | Yes\
    \ | Yes | No | No |\n| private | Yes | No | No | No |\n\nThe first column indicates\
    \ which modifier is being referenced. This is followed by whether or not the modifier\
    \ provides access to the class it is used in (the class column) and then the package\
    \ class it is contained in (the package column). If the modifier allows access\
    \ within a subclass of the class it is used in (the subclass column) and finally\
    \ whether the modifier allows access from any class within any package (the world\
    \ column).\n\nOne of the key purposes of access modifiers is to ensure errors\
    \ from misuse of your class cannot happen if your class is used by other programmers.\
    \ When deciding which access modifiers to use, you should always go with private\
    \ unless you have a reason not to and avoid public fields except for constants\
    \ or unless you have a reason to do so.\n\n![](img/ef6a16f18f5dfa49daafe188589229ff_53_0.png)\n\
    \n- 1. Always use private unless you have a reason not to\n- 2. Only use public\
    \ for constants unless you have a reason to use it elsewhere\n- 3. Understand\
    \ the difference between the access modifiers\n- 4. Access Modifiers exist to\
    \ reduce errors when other programmers use your code\n\n# Chapter 5: Conditional\
    \ statements, Flow Control\n\nWhat are conditionals?\n\nAt some point in your\
    \ program you will want to make a decision and act on it accordingly. Conditionals\
    \ let you do this - you can ask a question, so to speak, and do one thing or another\
    \ depending on whether the answer is yes or no. You will probably need to use\
    \ conditionals almost all the time so understanding them is of some importance.\
    \ Firstly, conditionals may also simply be referred to as if-statements or if-else\
    \ statements and this is because of the keywords if and else that you will use\
    \ when writing your conditional statements. Here is where we use the relational\
    \ and equality operators and the conditional operators from the chapter 3.\n\n\
    # If statements\n\nThe straight forward if looks like this:\n\n```\nif (true)\
    \ {\n  //do something\n}\n```\n\nThis says if true is true then execute the code\
    \ within the code block (within the curly braces). Of course, this example will\
    \ always be true as there is not a conditional statement as such.\n\nHere is a\
    \ practical example:\n\n```\nif (age >= 18) {\n  System.out.println(\"User is\
    \ old enough to buy alcohol in the UK\");\n}\n```\n\nSo, if the variable age has\
    \ a value that is greater than or equal to the number 18 then the output of the\
    \ program will be “User is old enough to buy alcohol in the UK\". If the condition\
    \ is not met, nothing will happen. So in a nutshell, that’s the simple use of\
    \ an ifstatement. The expression is the conditional statement that comes between\
    \ the opening and closing bracket of the if. More complex statements can also\
    \ be written, see below:\n\n```\nif (age >= 18 && age < 70) {\n  System.out.println(\"\
    The user is between 18 and 69 years of age\");\n}\n```\n\n```\nif (age >= 18 &&\
    \ age < 70 && dob_month != 12) {\n  System.out.println(\"The user is between 18\
    \ and 69 years of age and was not born in December\");\n}\n```\n\n```\nif (age\
    \ >= 18 || dob_month != 12) {\n  System.out.println(\"The user is 18 or over or\
    \ was not born in December\");\n}\n```\n\nThese three examples here demonstrate\
    \ the use of the conditional AND and conditional OR operators.\n\nThe first of\
    \ the three says that if the variable ‘agehas a value that is greater than or\
    \ equal to 18 AND the variable ‘age’ has a value that is less than 70 then execute\
    \ the code within the if block. The expression is only true if both of the conditions\
    \ are met.\n\nThe second if extends the first and adds an extra condition to check\
    \ whether the user’s month of birth is December or not; the expression is false\
    \ if either condition is not met. This expression says if the variable ‘age’ has\
    \ a value that is greater than or equal to 18 AND the variable ‘age’ has a value\
    \ that is less than 70 AND the variable ‘dob_month’ has a value that does not\
    \ equal 12 then execute the code within the if block.\n\nFinally, the third example\
    \ uses the conditional OR operator within the expression. It can be read as follows:\
    \ if the variable ‘age’ has a value greater than or equal to 18 OR the variable\
    \ ‘dob_month’ has a value not equal to 12 then execute the code within the if\
    \ block.\n\nAs you can see, this only provides us a way of executing code if our\
    \ expression is true. If it is false, we may want to execute some alternative\
    \ code and this is where the else clause of an if statement comes in.\n"
  mdcn: "\n\n# 比较运算符（相等与关系运算符）\n\n这些运算符都用于比较一个值与另一个值，因此结果将返回布尔值 true（真）或 false（假）。\n\
