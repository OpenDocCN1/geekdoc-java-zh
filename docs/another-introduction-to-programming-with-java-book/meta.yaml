  md: '# Polymorphism


    Polymorphism, some find, is a rather complex topic to understand and explain so
    I will discuss the previous part of this chapter some more in order to portray
    the concept. Polymorphism means to take on many different forms (poly = many,
    morph = form, shape). in relation to programming, it simply means the overloading
    or overriding of methods and the declaration of objects. Inheritance and polymorphism
    go hand-in-hand, there would be no polymorphism without Inheritance. Let''s take
    our inheritance class from previous and change the following line:


    Cat dog = new Cat(4, "blue", true, "brown", 1);


    to


    Animal dog = new Cat(4, "blue", true, "brown", 1);


    This will not affect how the code functions because Cat is indeed an Animal and
    our class hierarchy represents this. Cat inherits the Animal class and is therefore
    both an Animal class and a Cat class. This is just a part of the concept of polymorphism,
    though. As I previously mentioned, method overloading is also a form of polymorphism.
    Method overloading is discussed in Chapter 7 on functions so please review the
    chapter if you need a refresher on function overloading. As it relates to polymorphism
    - well, a function does something, an overloaded function (should) do the same
    thing but with a different signature. i.e. an overloaded function will take different
    parameters. This alteration that allows the creation of an overloaded method is
    in itself polymorphism within Java.


    Another part of polymorphism in Java is method overriding. This means that we
    have a parent class with a particular method and we want our child class to have
    the same method but a slightly different process. For example, if we take a look
    at our Animal.java class above and note the method getEyeColor(), then we have
    our Dog.java class which inherits this method, we can give Dog.java its getEyeColor()
    method which would override the method that is written in Animal.java. To do this,
    we would simply write a getEyeColor() method within our Dog.java class and have
    it perform whatever functionality is desired. Change Dog.java to look like this
    and see the effect:'
