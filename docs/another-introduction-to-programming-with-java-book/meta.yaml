    # Comparison (Equality and Relational) Operators


    These operators are all used for the comparison of one value vs another and as
    such the result will return a boolean value of true or false.


    | Symbol | Example | Purpose |

    |---|---||

    | == | x == 10 returns true | To determine whether two values are equal (equal
    to) |

    | != | x != 10 returns false | to determine whether two values are *not* equal
    (not equal to) |

    | > | x > z returns false | To determine whether the left value is greater than
    the right value (greater than) |

    | >= | x >= z returns false | To determine whether the left value is greater than
    **or** equal to the right value (greater than **or** equal to) |

    | < | x < 20 returns true | To determine whether the left value is less than the
    right value (less than) |

    | <= | 15 <= y returns false | To determine whether the left value is less than
    **or** equal to the right value (less than **or** equal to) |'
