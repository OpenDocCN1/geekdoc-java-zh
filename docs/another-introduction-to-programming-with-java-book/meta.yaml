    # Dealing with Compiler Errors


    Compiler errors are any error that prevents your program from compiling. There
    are also checked exceptions which will prevent Java programs from compiling but
    these are discussed below. This section deals exclusively with non-exception errors.
    For example, let''s say you forget to use a closing curly brace in your code somewhere.
    You''ll likely get the message:


    ```

    error: reached end of file while parsing

    ```


    This isn''t very helpful. It simply says that the compiler has reached the end
    of the file unexpectedly, it''s due to parse some more stuff before finishing.
    This is a good indicator that you''ve missed a closing curly brace somewhere.
    It doesn''t really indicate where, though, so a good starting point is anywhere
    youve made recent changes. If you can''t find anything, you have a meticulous
    task of locating the issue on your hands, best of luck!


    Other compiler errors in Java including forgetting to close a String:


    ```

    x: error: unclosed string literal

    ```


    x will represent the line number where your unclosed string literal may be found,
    or perhaps a line or two before. A nice easy to find for error.


    ```

    x: error: '';'' expected

    ```


    Again, x will represent the line number where your problem lies, this time a missing
    semicolon. You may also see this error if you try to name variables with a keyword,
    for example.


    ```

    x: error: cannot find symbol

    ```


    ```

    someSymbol()

    ```


    ```

    ^

    ```


    This error means that you are trying to use a method that does not exist or you
    have mistyped the name of. The same error message will apply to variables that
    do not exist or you have mistyped the name of. The line number of the source of
    the error is indicated.


    ```

    x: error: illegal start of expression

    ```


    You''ll probably come across this compiler error if you mistype for() when creating
    a for loop, to include a condition in an if statement or perhaps some other scenarios.
    A line number will be provided which is generally a pretty good indicator in locating
    the problem.'
- md: "\nx: error: ‘else' without ‘if'\n\nA pretty self explanatory error, trying\
    \ to use else without an if clause.\n\nThe best way to resolve multiple compiler\
    \ errors is to start from the very first one. Every time you make a change to\
    \ your code, compile it again. If you're on the right track, the number of errors\
    \ should gradually reduce. You should always try and resolve the first error first\
    \ because it may be the cause of any other error that is occurring.\n\n# Exceptions\n\
    \nJava utilises exceptions to handle errors. This refers to any exceptional event\
    \ which, during execution of a program, disrupts the normal flow of a program’s\
    \ instructions. The runtime errors described above are dealt with in this section.\
    \ There are three kinds of exception in Java:- Checked, errors and runtime exceptions.\
    \ When exceptions occur, they are said to be thrown. An object is created to represent\
    \ an exception and some thing has to catch it. When any exception is thrown, the\
    \ runtime system attempts to find something to handle it, this is known as an\
    \ exception handler. An exception can either be caught at the point of occurrence\
    \ in which the code is contained within a try-catch block, an exception handler,\
    \ or the method that contains the code can throw the exception which then passes\
    \ it up the call stack until an exception handler is found. If no exception handler\
    \ is found then the runtime system and program will terminate. This is usually\
    \ the case for errors and runtime exceptions, you will see why in the next section.\n\
    \n# Checked Exceptions and the catch or specify requirement\n\nChecked exceptions\
    \ are those that a well-written program should be able to recover from. For example,\
    \ attempting to open a file that does not exist would produce a checked exception.\
    \ The program should cater for this scenario by catching the exception, notifying\
    \ the user and perhaps allowing them to correct their mistake and continue with\
    \ the program. Checked exceptions are subject to what Java refers to as the catch\
    \ or specify requirement. This requirement means that code may throw certain types\
    \ of exception must be enclosed in either a try-catch block or within a method\
    \ that throws the exception. Neither errors or runtime exceptions are subject\
    \ to this requirement.\n\n# Unchecked Exceptions\n\nThe other two types of exception\
    \ are collectively referred to as unchecked exceptions because they are not required\
    \ to honour the catch or specify requirement, which means code that may produce\
    \ such errors will compile or not it is contained within a try-catch block or\
    \ method which throws an exception.\n\nThe error exception is a type of exception\
    \ that is external to the program and the program may not be able to anticipate\
    \ such errors or recover from them. For example, attempting to open a file could\
    \ result in an error because the file exists but it cannot be opened. You may\
    \ catch this type of exception in order to handle it but it is not a requirement.\
    \ Of course, it would be sensible to handle such possibilities appropriately by\
    \ letting your program crash is not good form and this would be the outcome of\
    \ not handling error exceptions. So try not to worry too much about every unknown\
    \ event; if an unhandled error exception is thrown then your program will terminate\
    \ and print a stack trace to help you debug and resolve the cause.\n\nThe runtime\
    \ exception is the third type of exception. Unlike errors, runtime exceptions\
    \ are exceptions that are internal to the program but unlikely to be anticipated\
    \ and or recovered from. A typical example of this would be trying to access a\
    \ variable or array that is not initialized. This will create a NullPointerException.\
    \ Again, you may choose to catch these errors or let them play out which will\
    \ result in program termination and a printout of a stack trace. Alternatively,\
    \ and more sensibly, you can strive to eliminate these exceptions by rectifying\
    \ the problems that cause them.\n\nOkay, enough rambling. That’s the “under the\
    \ hood” version, let’s take a look at how to actually handle some exceptions!\n\
    \n# Throwing and Catching\n\n# Exception Handlers\n\nException handlers are simply\
    \ try-catch blocks which I've used several times in the previous chapters already.\
    \ The try-catch block is rarely called an exception handler—that's what it is.\
    \ So, let's take a closer look at try-catch.\n\nFirst of all, the kind of message\
    \ you can expect the compiler to spit out if you try to use code that may throw\
    \ a checked exception:\n\n```\nD:\\Windows\\system32\\cmd.exe Test.java\nTest.java:8:\
    \ error: unreported exception FileNotFoundException; must be caught or\ndeclared\
    \ to be thrown\nfile_in = new FileInputStream(\"C:\\some_file.txt\");\n      \
    \         ^\n1 error\nD:\\Desktop\\java>\n```\n\nThe FileNotFoundException is\
    \ a checked exception and the code will not compile without handling it correctly.\
    \ You'll see that the message is:\n\n> Test.java:8: error: unreported exception\
    \ FileNotFoundException; must be caught or\ndeclared to be thrown\n\nthis is our\
    \ problem. The next line shows us where the problem arises:\n\n```\nfile_in =\
    \ new FileInputStream(\"C:\\some_file.txt\");\n               ^\n```\n\n```\n\
    1 error\n```\n\nThe “1 error” text indicates how many errors the compiler has\
    \ found, the caret (^) shows where our problem is coming from. It’s pointing at\
    \ “new FileInputStream(...” which gives us a good indication that this line is\
    \ causing our error. To fix this, we need to handle the checked error and this\
    \ can be achieved with a try-catch block.\n\nA try-catch block looks like this:\n\
    \n```\ntry {\n    //do something\n} catch(Exception e) {\n    //handle exception\n\
    }\n```\n\nWe replace “//do something” with our code that throws a checked error\
    \ and “//handle exception” with some code that should execute if the exception\
    \ is thrown. We also replace the word Exception with the specific exception we\
    \ are targeting, in this case that’s a FileNotFoundException!\n\nFollowing is\
    \ the erroneous code and then the correct code respectively.\n\n```\nimport java.io.*;\n\
    \nclass Test {\n\n    public static void main(String[] args) {\n    FileInputStream\
    \ file_in = null;\n    file_in = new FileInputStream(\"C:/some_file.txt\");\n\n\
    }//end main()\n}\n```\n\nGo ahead and compile this code to get a grasp on what’s\
    \ going on.\n\n```\nimport java.io.*;\n\nclass Test {\n\n    public static void\
    \ main(String[] args) {\n\n    FileInputStream file_in = null;\n}\n```\n\n```\n\
    try {\n    file_in = new FileInputStream(\"C:/some_file.txt\");\n} catch(FileNotFoundException\
    \ e) {\n    e.printStackTrace();\n}\n\n// //end main()\n}\n```\n\nThe second code\
    \ sample will compile without error. It doesn't do much, though, if you run it\
    \ you'll see the stack trace which is basically a print out of the methods currently\
    \ in the call stack leading back to the source of the error. Unless, of course,\
    \ C:/sample_file.txt exists on your system!\n\nThat's not a particularly helpful\
    \ message to the user, though, so go ahead and change\n\n```\ne.printStackTrace();\n\
    ```\n\nto\n\n```\nSystem.out.println(e.getMessage());\n```\n\nand compare the\
    \ outputs.\n\nIn this particular example, you would probably opt to use the getMessage()\
    \ method and then ask the user to provide a new file path to an existing file\
    \ in order to allow the continuation of the program.\n\nSo, how do we know which\
    \ exceptions may be thrown? Well, you could just attempt to compile your code\
    \ and deal with each of the errors as and when they pop up or you could take a\
    \ look at the Java documentation which is what you'd be expected to do whenever\
    \ using new methods/or objects that are part of Java which you have not used before.\n\
    \nThat's how to handle checked exceptions but what about unchecked exceptions?\
    \ What if we wanted to convert user input to a number, which we do in a previous\
    \ chapter, but the user input is not numeric? Compile the following code and note\
    \ that no error occurs.\n\n```\nclass NotNumeric {\n```\n\n```\npublic static\
    \ void main(String[] args) {\n```\n\n```\nString str = \"a\";\n```\n\n```\nInteger.parseInt(str);\n\
    ```\n\n```\n} //end main\n```\n\n```\n}\n```\n\nThen run the code and observe\
    \ the exception!\n"
  mdcn: "\n\nx: error: ‘else' without ‘if'\n\n这是一个显而易懂的错误，尝试在没有 `if` 子句的情况下使用 `else`。\n\
    \n解决多个编译器错误的最佳方法是从第一个错误开始。每当你对代码进行更改时，都重新编译它。如果你的方向是正确的，错误数量应该逐渐减少。你应该始终尝试先解决第一个错误，因为它可能是导致其他任何发生错误的原因。\n\
    \n# 异常\n\nJava 利用异常（exceptions）来处理错误。这指的是在程序执行期间中断程序指令正常流的任何异常事件。上述描述的运行时错误在本节中处理。Java\
    \ 中有三种异常：检查异常（Checked）、错误（errors）和运行时异常（runtime exceptions）。当异常发生时，被称为被“抛出”（thrown）。系统会创建一个对象来表示异常，并且必须某种机制来捕获（catch）它。当抛出任何异常时，运行时系统尝试寻找某些东西来处理它，这被称为异常处理器（exception\
    \ handler）。异常可以在发生点被捕获（代码包含在 `try-catch` 块中）、通过异常处理器，或者包含代码的方法可以抛出异常，然后将其向上传递给调用栈，直到找到异常处理器为止。如果没有找到异常处理器，运行时系统和程序将终止。这对于错误和运行时异常通常是如此，你将在下一节中看到原因。\n\
    \n# 检查异常与捕获或指定要求\n\n检查异常是编写良好的程序应该能够从中恢复的异常。例如，尝试打开一个不存在的文件会产生检查异常。程序应该通过捕获异常来应对这种情况，通知用户，并可能允许他们纠正错误并继续运行程序。检查异常受\
    \ Java 所说的“捕获或指定要求”（catch or specify requirement）限制。该要求意味着可能抛出某些类型异常的代码必须封装在 `try-catch`\
    \ 块中，或者在一个抛出该异常的方法中。错误或运行时异常都不受此要求的限制。\n\n# 未检查异常\n\n另外两种异常统称为未检查异常（unchecked\
    \ exceptions），因为它们不需要遵守“捕获或指定要求”，这意味着可能产生此类错误的代码无论是否包含在 `try-catch` 块或抛出异常的方法中，都可以通过编译或无法通过。\n\
    \n错误异常（error exception）是程序外部的异常类型，程序可能无法预见到此类错误或从其恢复。例如，尝试打开文件可能会导致错误，因为文件存在但无法打开。你可以捕获此类类型的异常来处理它，但这不是强制要求的。当然，恰当地处理此类可能性是明智的，让你的程序崩溃不是良好的做法，而这将是不处理错误异常的结果。因此，尽量不要过度担心每个未知事件；如果抛出了未处理的错误异常，你的程序将终止并打印堆栈跟踪（stack\
    \ trace）以帮助你调试并解决原因。\n\n运行时异常（runtime exception）是第三种异常。与错误不同，运行时异常是程序内部的异常，但不太可能被预测或从中恢复。一个典型的例子是尝试访问未初始化的变量或数组。这将创建一个\
    \ `NullPointerException`。同样，你可以选择捕获这些错误或让它们发生，这将导致程序终止并打印堆栈跟踪。或者，更明智的方法是，你可以通过修正导致这些异常的问题来努力消除这些异常。\n\
    \n好了，闲话足够了。这是“底层”版本，让我们来看看实际上是如何处理某些异常的！\n\n# 抛出与捕获\n\n# 异常处理器\n\n异常处理器简单就是 `try-catch`\
    \ 块，我在之前的章节中已经使用了几次。`try-catch` 块很少被称为异常处理器——尽管它本身就是。所以，让我们仔细观察一下 `try-catch`。\n\
    \n首先，当你尝试使用可能抛出检查异常的代码时，你可以预期编译器会吐出这类消息：\n\n```\nD:\\Windows\\system32\\cmd.exe\
    \ Test.java\nTest.java:8: error: unreported exception FileNotFoundException; must\
    \ be caught or\ndeclared to be thrown\nfile_in = new FileInputStream(\"C:\\some_file.txt\"\
    );\n               ^\n1 error\nD:\\Desktop\\java>\n```\n\n`FileNotFoundException`\
    \ 是一个检查异常，如果不正确处理它，代码将无法编译。你会看到消息是：\n\n> Test.java:8: error: unreported exception\
    \ FileNotFoundException; must be caught or\ndeclared to be thrown\n\n这是我们的问题。下一行显示了问题出现的地方：\n\
    \n```\nfile_in = new FileInputStream(\"C:\\some_file.txt\");\n               ^\n\
    ```\n\n```\n1 error\n```\n\n“1 error”文本表示编译器找到了多少个错误，脱符号（^）显示了我们的问题来源。它指向“new\
    \ FileInputStream(...”，这很好地表明了这一行正在导致我们的错误。要修复此，我们需要处理这个检查错误，这可以通过 `try-catch`\
    \ 块来实现。\n\n一个 `try-catch` 块看起来如下：\n\n```\ntry {\n    //do something\n} catch(Exception\
    \ e) {\n    //handle exception\n}\n```\n\n我们将用抛出检查错误的代码替换“//do something”，并用在异常抛出时应该执行的某些代码替换“//handle\
    \ exception”。我们还把 `Exception` 单词替换为我们目标针对的特定异常，在这种情况下，那就是 `FileNotFoundException`！\n\
    \n下面分别是对应的错误的代码和正确的代码。\n\n```\nimport java.io.*;\n\nclass Test {\n\n    public\
    \ static void main(String[] args) {\n    FileInputStream file_in = null;\n   \
    \ file_in = new FileInputStream(\"C:/some_file.txt\");\n\n}//end main()\n}\n```\n\
    \n放心地编译这段代码以掌握正在发生什么。\n\n```\nimport java.io.*;\n\nclass Test {\n\n    public\
    \ static void main(String[] args) {\n\n    FileInputStream file_in = null;\n}\n\
    ```\n\n```\ntry {\n    file_in = new FileInputStream(\"C:/some_file.txt\");\n\
    } catch(FileNotFoundException e) {\n    e.printStackTrace();\n}\n\n// //end main()\n\
    }\n```\n\n第二个代码示例将无任何错误地通过编译。不过，它并没有做什么，如果你运行它，你将看到堆栈跟踪，这基本上是当前调用栈中方法的输出，追溯到错误源头。当然，除非\
    \ `C:/sample_file.txt` 在你的系统上存在！\n\n这对用户来说并不是一个特别有用的消息，所以请将\n\n```\ne.printStackTrace();\n\
    ```\n\n改为\n\n```\nSystem.out.println(e.getMessage());\n```\n\n并比较输出。\n\n在这一特定的示例中，你可能会选择使用\
    \ `getMessage()` 方法，然后要求用户提供现有文件的新路径，以便程序继续运行。\n\n那么，我们如何知道哪些异常可能会被抛出呢？嗯，你只需要尝试编译你的代码，并在错误出现时处理每一个，或者你可以查看\
    \ Java 文档，每当你使用以前没用过的 Java 新方法/或对象时，这就是你被要求做的。\n\n这就是处理检查异常的方法，但未检查异常呢？如果我们想将用户输入转换为数字（我们在之前的章节中做过），但如果用户输入不是数字怎么办？编译以下代码并注意没有发生错误。\n\
    \n```\nclass NotNumeric {\n```\n\n```\npublic static void main(String[] args)\
    \ {\n```\n\n```\nString str = \"a\";\n```\n\n```\nInteger.parseInt(str);\n```\n\
    \n```\n} //end main\n```\n\n```\n}\n```\n\n然后运行代码并观察异常！\n\n"
