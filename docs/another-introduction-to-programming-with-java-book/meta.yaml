  md: "# Timing Code Execution\n\nYou may recall that in the chapter on recursion,\
    \ I said that we'd take a look at timing the execution of our code to see which\
    \ is quicker. So let's get to it! In that chapter, we wrote a method for calculating\
    \ the nth Fibonacci number using recursion and I stated that, although a good\
    \ demonstration of recursion, it's not a computationally efficient technique for\
    \ the problem at hand and in fact would be better to sum up all the numbers between\
    \ 0 and n instead of n. So here's that original Fib class with an additional method\
    \ which does just that:\n\n```\nclass Fib {\n    static long startTime = 0;\n\
    \    static long endTime = 0;\n    static long duration = 0;\n    static long\
    \ duration2 = 0;\n\n    public static void main(String[] args) {\n        System.out.println(\"\
    Recursive: \");\n\n        startTime = System.nanoTime();\n        for(int i=1;\
    \ i<= 30; i++)\n            System.out.println(fibN(i));\n        }\n\n      \
    \  endTime = System.nanoTime();\n        duration = (endTime - startTime);\n\n\
    \        System.out.println(\"execution took \" + duration + \" nanoseconds\"\
    );\n\n        System.out.println(\"Non-Recursive: \");\n\n        startTime =\
    \ System.nanoTime();\n        for(int i=1; i<= 30; i++))\n            System.out.println(fibN2(i));\n\
    \        }\n\n        endTime = System.nanoTime();\n    }\n```"
