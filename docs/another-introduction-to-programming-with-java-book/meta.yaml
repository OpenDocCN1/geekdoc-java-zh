  - "[PAGE 146]\n\n# Custom Exceptions and Throwing New Exceptions\n\nAlthough beyond\
    \ the scope of this book, it's prudent to note that you can also create custom\
    \ exceptions to better suit your needs. This is more for larger scale projects\
    \ where the default Java exceptions are too vague or different from the type of\
    \ exception you wish to throw.\n\nThe previous section talks of throwing exceptions\
    \ further up the stack. These exceptions are initially thrown at some point, though.\
    \ Think of this as the first throw. This is achieved by using the throw keyword.\
    \ Notice the lack of an s. This is called throwing a new exception.\n\nStudy,\
    \ copy, compile and execute the following code:\n\n```\nclass ManualThrow {\n\
    \    public static void main(String[] args) {\n        try {\n            throw\
    \ new Exception(\"Test exception\");\n        }\n        catch (Exception e) {\
    \ System.out.println(e.getMessage());\n    }\n    }//end main()\n}\n```\n\nThis\
    \ code creates a new Exception object with a custom message and then throws it,\
    \ catches it and then shows the message to the user. This is how the initial throw\
    \ of an exception is done."
