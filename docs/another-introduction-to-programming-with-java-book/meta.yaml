  md: "# While loops\n\nwhile loops essentially say “while this condition is true,\
    \ do the stuff below”. Here is a pseudo example of a simple while loop:\n\n```\n\
    while(condition) {\n  // some stuff\n}\n```\n\nThe while loop is best utilized\
    \ to execute a block of code an unknown number of times. The condition can be\
    \ any expression that evaluates to true, as shown in the previous chapter regarding\
    \ conditionals. Unlike an if statement, however, an expression within a while\
    \ loop must evaluate to true in order for the loop to run, there are no else while\
    \ loops. The primary benefit of a while loop is that you can repeatedly execute\
    \ the same piece of code based on a condition. This may sound basic but that’s\
    \ because it is. You’ll see shortly that not all loops work in this way.\n\nwhile\
    \ loops may be disadvantageous for situations where you require keeping track\
    \ of the current iteration of the loop (i.e. how many times the loop has executed)\
    \ and for any code that needs to execute at least once before checking or not\
    \ it should repeat itself. That's not to say you cannot use them for such situations\
    \ though, you will find yourself requiring loops on a true/false condition and\
    \ keeping track of the current iteration of the loop. To do this, we create a\
    \ counter variable outside the loop. Counters should generally start at zero because\
    \ anything that requires an index in Java is zero based, think back to arrays!\n\
    \nEnough about, here is a couple of while loops to demonstrate their usage in\
    \ a variety of scenarios. First up is a simple arithmetic expression which will\
    \ become false after the loop runs several times:\n\n```\nint age = 10;\nwhile(age\
    \ < 18) {\n  //You cannot drink until you are 18, come back next year.\n  age\
    \ += 1; //add a year to age. Could also be written as age++;\n  //or as age =\
    \ age + 1;\n}\n```\n\nSo this loop will run a total of 8 times, until the value\
    \ of age is no longer less than 18. Notice that the variable used within the condition\
    \ of the while loop is manipulated within the body of the loop. This is incredibly\
    \ important. If this didn’t happen, the loop would never end and we’d be stuck\
    \ with an infinite loop, more on this soon.\n\nNext is a while loop with a counter,\
    \ so you can keep track of the number of iterations the loop has ran."
