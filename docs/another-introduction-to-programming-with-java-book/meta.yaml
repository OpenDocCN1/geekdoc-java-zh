    \    }\n\n    public int getYearOfStudy() {\n        return yearOfStudy;\n   \
    \ }\n\n    public double getAttendance() {\n        return attendance;\n    }\n\
    \n    public String getCourse() {\n        return course;\n    }\n\n    public\
