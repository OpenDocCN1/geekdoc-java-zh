  mdcn: "\n## 第 11 章：静态 (Static)\n\n你可能已经注意到 `static` 关键字无不在。但它意味着什么呢？如果某个东西是静态的，它只能存在一次。至少我是这么认为的。声明为\
    \ `static` 的成员无论类中存在多少个实例，它们在程序中只存在一次。因此，如果你有一个名为 `Dinosaur` 的类，它有一个名为 `legs`\
    \ 的静态变量，那么无论你有 1 个句还是 100 个 `Dinosaur` 类的实例，都只有一个 `legs` 变量实例被所有 `Dinosaur` 类共享。\n\
    \n简而言之，`static` 成员属于类而不是特定的实例。在编写小型模块时，这非常头疼，例如，当你想要在 `main()` 方法中使用几个全局变量时，就需要将这些变量声明为\
    \ `static`。这是因为 `static` 成员的特性意味着静态方法只能访问静态变量。当然，如果通过已实例化的对象进行操作，你也可以在静态方法中访问非静态成员。我们将在下一章介绍更多关于实例化的内容。\n\
    \n总之，快速进入主题。我只是想提一下 `static`，因为它很少被提及，否则你永远会疑惑为什么你不能从 `main()` 方法中访问非静态变量！\n\n\
    ## 第 12 章：类 (Classes)\n\n### 什么是类？\n\n正如你目前所见，我们用 Java 写的每一个程序都包含在一个类中，可以说我们一直在编写自己的类。但并不是每个类都必须包含\
    \ `main()` 方法，而且并不是每个类都是程序。事实上，大多数类的作用是将编程问题分解成更小的部分，这正是面向对象编程（OOP）大显身手的地方。从现在开始，我们将利用之前几章节中学到的知识开始定义并编写自己的类。\n\
    \n在规划程序时，我们必须查看需要解决的问题。然后我们将这些问题拆分成更小的部分来细分我们的程序。从 OOP 的角度来看，我们想要识别现实中任何可以代表对象的实体和物。一个典型的例子是一个存在动物的简单游戏。我们为每种类型的动物都需要一个对象。或者，银行系统可能有一个客户对象，另一个客户账户对象等。我们能想象到的每一个对象将由一个类来表示。\n\
    \n你应该记住的关键点是：类代表对象。\n\n### 定义一个类\n\n要定义一个类，我们使用到目前为止的相同语法。我们为类选择一个名称，并如下所示创建它：\n\
    \n#### 类定义\n\n```\nclass ClassName {\n}\n```\n\n这是一个名为 `ClassName` 的空类，它包含在一个名为\
    \ `ClassName.java` 的文件中。然后我们有变量。这些变量也照常声明。但现在是时候开始使用访问修饰符了。目前，我们将一切都视为私有的（private）。\n\
    \n### 声明变量\n\n```java\nclass ClassName {\nprivate int var1;\nprivate int var2;\n\
    }\n```\n\n我在 `ClassName` 类中添加了两个名为 `var1` 和 `var2` 的变量，都是尚未初始化的整数。接下来，让我们添加一个方法。类中的变量有时被称为成员变量。\n\
    \n### 类构造函数\n\n```java\nclass ClassName {\nprivate int var1;\nprivate int var2;\n\
    public ClassName() {\nvar1 = 0;\nvar2 = 0;\n}\n}\n```\n\n这是类的一个非常棒的特性：类构造函数。注意这个添加的方法与类名相同吗？这使其成为了类的构造函数。然而，同样重要的是该方法是\
    \ `public` 的且没有返回类型。\n\n类构造函数的目的是每当类被实例化时执行；每当类的实例（副本）被创建用作程序中代表对象的对象时执行。记住，实例化意味着创建一个……的实例。构造函数会自动执行，并用于为类的使用做准备，例如初始化变量、给定数据等。注意：如果未提供类构造函数，将在编译时自动创建一个空构造函数。\n\
    \n我们还可以重载类构造函数，这样我们就可以有多个版本。记得第 7 章中关于函数签名重载的讨论吗？同样的原理也适用于这里。\n\n### 重载构造函数\n\n\
    ```java\nclass ClassName {\n\n  private int var1;\n  private int var2;\n\n  public\
    \ ClassName() {\n    var1 = 0;\n    var2 = 0;\n  }\n\n  public ClassName(int var1,\
    \ int var2) {\n    this.var1 = var1;\n    this.var2 = var2;\n  }\n}\n```\n\n在这里我们添加了另一个构造函数方法，这次它接受\
    \ 2 个整数参数，然后将它们赋值给我们在类初创建的整数变量 `var1` 和 `var2`。\n\n### this 关键字\n\n注意 `this` 关键字。它在处理类时超级有用。它基本上的意思是“这个类”。所以，当我们在这里使用它时，我们实际上是在说\n\
    \n```\nClassName.var1 = var\nClassName.var2 = var\n```\n\n其中 `var1` 和 `var2` 是作为参数提供的值。这可以重写为不需要使用\
    \ `this` 关键字，但那样就不那么有趣了。\n\n```java\nclass ClassName {\n    private int var1;\n\
    \    private int var2;\n    public ClassName() {\n        var1 = 0;\n        var2\
    \ = 0;\n    }\n}\n```\n*(注：由于原始文本 OCR 存在碎片，此处已根据逻辑进行了清理整理)*\n\n### Getter 和 Setter\
    \ 方法 (Getters and Setters)\n\n```java\nclass ClassName {\n    private var var1;\n\
    \    private int var2;\n\n    public ClassName() {\n        var1 = 0;\n      \
    \  var2 = 0;\n    }\n\n    // ... (此处 OCR 文本很乱)\n}\n```\n\n让我们根据提供的文本流提供一个干净的版本。\n\
    \n从 OOP 的角度来看，我们想要识别现实中任何可以代表对象的实体和物。一个典型的例子是一个存在动物的简单游戏。我们为每种类型的动物都需要一个对象。或者，银行系统可能有一个客户对象，另一个客户账户对象等。我们能想象到的每一个对象将由一个类来表示。\n\
    \n你应该记住的关键点是：类代表对象。\n"
