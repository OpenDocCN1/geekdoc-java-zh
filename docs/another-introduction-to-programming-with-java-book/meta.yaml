    \ The compiler also gives you a good indication (usually) of what the problem\
    \ is so it's not too difficult to fix (usually).\n\nYou then have runtime errors\
    \ which generally cause your program to crash and burn (terminate prematurely).\
    \ These can be caused by trying to access elements in an array with an index that\
    \ is larger than the number of elements or running out of memory, for example.\
    \ Runtime errors can generally be anticipated and handled within your code to.\
    \ Finally, my least favourite type of error, the logic error. It isn't an error\
    \ as such but more of a problem. The compiler won't point it out, though bear\
    \ this mind.\n\n## Dealing with Compiler Errors\n\nCompiler errors are any error\
    \ that prevents your program from compiling. There are also checked exceptions\
    \ which will prevent Java programs from compiling but these are discussed below.\
    \ This section deals exclusively with non-exception errors. For example, let's\
