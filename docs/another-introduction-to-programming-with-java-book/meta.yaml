  md: "# Type Casting\n\nType casting or just casting is the process of converting\
    \ one variable to another, casting one variable type to another. For example,\
    \ if we have a floating-point number of 250.0F but we want to be an integer, we\
    \ can force it to become an integer with casting. The general syntax of casting\
    \ is:\n\n```\noldType var1 = some_value;\nnewType var2 = (newType) var1;\n```\n\
    \nHere, the variable var1 of type oldType is casted to the newType type in order\
    \ to assign the value to the new variable var2. This is much more easily demonstrated\
    \ in code with the example I mentioned above:\n\n```\nfloat var1 = 250.0F;\nint\
    \ var2 = (int) var1;\n```\n\nGive this a try and see what happens when you cast\
    \ a floating-point value to an integer when the value after the decimal is not\
    \ 0.\n\n```\nclass castExample {\n    public static void main(String[] args) {\n\
    \        float var1 = 250.152F;\n        int var2 = (int) var1;\n        System.out.println(\"\
    var 1 = \" + var1);\n        System.out.println(\"var 2 = \" + var2);\n    }\n\
    }\n//end class\n```"
