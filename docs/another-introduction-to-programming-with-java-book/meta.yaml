  md: '# The Ternary Operator


    The ternary operator is simply shorthand for if-then-else code. They can be nested;
    to have one statement inside another and so on. The ternary operator is a personal
    favourite of mine simply because it looks cool and is generally written on one
    line of code. A good typical of the ternary operator is to assign a variable a
    particular value based on a condition. Here are a couple of examples of this action.


    ```

    int x = 10;

    int y = 15;

    int z = (y==x) ? x+y : x;

    z = (y==x) ? (y>x) ? y : x;

    ```


    So let''s break this code. The first 2 lines create a couple of variables, x and
    y, and give them a value (declaration and initialization). The third line creates
    an integer too this time, the value is determined by an if-then-else statement
    using the ternary (:) operator. This is in the form of:


    (condition) ? result of true: if false


    So, based on the values defined, the value of z becomes 10 because:


    if (15==10) is true then the value of z is 10+15 otherwise the value of z is 10.


    The final line of code assigns a new value to z, again using the ternary operator
    but this time a nested condition is included. If the original condition is false,
    another condition is evaluated. Based on evaluations, the new value of z becomes
    15; the greater number out of x and y. In simple English, this statement can be
    read as follows:


    if (15 == 10) is true then the value of z is 10 otherwise if 15 is greater than
    10 then the value of z is 15


    Despite their apparent complexity, this method of coding conditions is quite elegant,
    in my opinion. There isn'' any massive performance increases from using ternary
    operations as opposed to if-then-else statements. The added benefit of providing
    concise code. One particular scenario where the ternary operator is the only option
    is if you need to initialize a constant based on a condition. A constant is a
    variable whose value cannot change once initialized, as mentioned in chapter 3.'
