  md: "# Overloading\n\nOverloading is a term used to describe multiple functions\
    \ with the same name but different signatures. Also referred to as method overloading\
    \ or function overloading. In some cases it will create confusion but there are\
    \ also situations where it's a very useful technique. Such as when you want to\
    \ provide a method that performs a calculation but you're not sure whether the\
    \ argument will be an integer or a float so you cater for both instances. See\
    \ the code snippet below for an example:\n\n```\nclass ScopeDemo {\n    //visible\
    \ to the whole program, global variables\n    static int num1=10;\n    static\
    \ float num2=10.1F;\n\n    static int multiplyBy(int number) {\n        //local\
    \ variables number, multiplier\n        return (number*10);\n    }\n\n    static\
    \ float multiplyBy(float number) {\n        return (number*10);\n    }\n\n   \
    \ public static void main(String[] args) {\n        System.out.println(\"int:\
    \ \" + multiplyBy(num1));\n        System.out.println(\"float: \" + multiplyBy(num2));\n\
    \    }\n} //end class\n```\n\nGo ahead and type out this code, compile and run\
    \ it. Your expected output is:\n\nint: 100"
