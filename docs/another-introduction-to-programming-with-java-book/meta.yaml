    ## 练习\n\n本章只有一个练习题，因为在不不久的将来会有另一个“间歇”章节，我不想让你在继承上花费太多时间，你懂的吧！那么，假设我们有一个三个类型账户的银行系统：\n\
    \n- 1. 个人\n- 2. 商业（小型企业）\n- 3. 贸易（大型企业）\n\n这些账户都必须存储以下共同信息：\n\n- 1. 账号\n- 2. 账户持有人\n\
    - 3. 账户余额\n- 4. 交易历史（使用 ArrayList）\n- 5. 取款手续费 (%)\n\n记住，类代表（通常是实体的）对象，因此每个账户类型都应该由自己的对象来表示。\n\
    \n这些共同信息之外，商业和贸易账户还应该存储该业务所代表的业务类型（例如汽车行业、食品行业、娱乐、计算等）。\n\n你的目标是使用继承创建一些表示此系统的类。创建一个\
