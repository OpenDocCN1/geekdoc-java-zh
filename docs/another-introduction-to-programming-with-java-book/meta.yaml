  - "[PAGE 76]\n\n# Nested Loops\n\nNested loops are something you should know about\
    \ but I don't want to go into too much detail about them. They are simply loops\
    \ within loops. You may create as many as you wish, think of the movie Inception.\
    \ Nesting for loops is a common practice when iterating over multi-dimensional\
