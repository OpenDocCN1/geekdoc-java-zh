  - "[PAGE 72]\n\n# For loops\n\nfor loops differ from the while loops that we have\
    \ looked previously in that they handle their own counting in the expression.\
    \ They allow the iteration of code based on a range of values as opposed to whether\
    \ or not a condition is true. The for loop is particularly useful for iterating\
    \ over arrays or simply repeating a block of code a known number of times.\n\n\
    The syntax of a for loop is as follows:\n\nNow you may be wondering why there\
    \ is so much going on where a conditional expression is expected. This is because\
    \ a for loop declares its own counter, its own evaluation and its own increment\
    \ (or decrement if you want to run a for loop backwards).\n\nHere’s the good ol’\
    \ 1-10 example using a for loop.\n\n```\nfor(int count=1; count < 11; count++)\
    \ {\n  System.out.println(count);\n}\n```\n\nAs you can see, we declare and initialize\
    \ a variable within the for loop! We have our condition and finally, the increment\
    \ of the variable. Prior to each iteration of the for loop, the condition is evaluated\
    \ and if it is satisfied, the loop terminates otherwise it will execute. At the\
    \ end of the code block, the increment takes place. The increment can also be\
    \ a decrement, as already mentioned, or it can be a specific value such as count+7,\
    \ for example. Then the process repeats until the condition is satisfied.\n\n\
    Traditionally, the for loop has been used to iterate over an array. You say you\
    \ have an integer array with 50 elements within it and you want the summation\
    \ of all elements within the array. It would be incredibly time consuming and\
    \ a pain in the ass to have what I have typed below:\n\n```\nint summation = arr[0]\
    \ + arr[1] + arr[2] + arr[3] + arr[4] ... + arr[49]\n```\n\nThat would be very\
    \ frustrating and a waste of time. With a for loop, we can write this instead:\n\
    \nint arr[] = new array[50]; //don’t forget that this array currently isn’t //initialised"
