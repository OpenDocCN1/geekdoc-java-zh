    # Why have Inheritance


    Some people find it challenging to wrap their head around inheritance I''m going
    to do away with the long winded explanations and just dive straight into it! Imagine
    we have a game, this is a typical example of inheritance. We won''t be making
    a game, by the way, this is just a demonstration of inheritance! Our game has
    **animals**. We have **dogs, cats, dinosaurs, lions and humans**. I calling a
    person an animal isn''t the nicest thing in the world but hey, humans do those
    animalistic tendencies, right?


