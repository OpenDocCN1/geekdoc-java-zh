  md: '# Arrays


    An array is simply a collection of variables under the same name with a unique
    index to select an element from the array of data. Any of the data types we have
    talked about so far can be used in an array. To declare an array, we use the following
    syntax:


    ```

    int[] a = new int[10];

    ```


