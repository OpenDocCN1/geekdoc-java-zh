  md: "# Parameters/Arguments\n\nSometimes, we might want to give a function some\
    \ data to work and to do this we use parameters, also referred to as arguments.\
    \ We give a function as many or as few arguments as necessary and their types\
    \ help determine the signature of a function. We've already seen arguments with\
    \ the main() function but let's create some of our own.\n\n```\nint multiplyBy(int\
    \ number, int multiplier) {\n    return (number*multiplier);\n}\n```\n\nThis integer\
    \ function will take two integers, multiply them and return the result. Remember\
    \ the little section on variable scope within chapter 3? Now is the time to bring\
    \ that to the forefront of your mind.\n\nLet's say we have a program that has\
    \ a variable called number and another multiplier which are to be passed to the\
    \ above function which also uses the same variable names.\n\n```\nclass ScopeDemo\
    \ {\n    //visible to the whole program\n    static int number=0;\n    static\
    \ int multiplier=0;\n\n    static int multiplyBy(int number, int multiplier) {\n\
    \        //local variables number, multiplier\n        return (number*multiplier);\n\
