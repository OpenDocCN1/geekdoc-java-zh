  mdcn: "\n\n## 图形用户界面\n\n也许你可能想要创建图形化的 Java 程序。Java 提供了一个名为 SWING 的 API，它让你具备了创建图形用户界的能力。你可以通过\
    \ Java 在线文档了解更多信息。\n\nJavaFX 是一个较新的 API，正在逐渐取代 SWING，因此如果你是 Java GUI 领域的新手，从那里开始是最好的。\n\
    \n## JavaServer 页面 (JSP)\n\nJava 提供了 JavaServer Pages，即 JSP。JSP 是一种用于 Web 开发的服务器端编程语言。在某方面它与\
    \ PHP 和 ASP ，区别在于它使用的是 Java。运行 JSP 代码需要一个通过 Apache Tomcat 等 servlet 容器支持 JSP 的\
    \ Web 服务器。我不建议仅仅为了 Web 开发而学习 Java，因为还有其他更适合该任务的技术。\n\n## Applets（Java 应用程序程序）\n\
    \nApplets 是通过网页传递给用户的 Java 应用程序。这些应用程序仍然运行在用户的本地 JVM 上，因此它们仍然需要安装 JVM，并获得用户的许可才能运行。\n\
    \n## 网络编程\n\n理解 Java 网络编程无疑是你编程知识库中值得增加的一项非常实用的技能。不过，我绝对建议在进行网络编程之前研究一下多线程。网络编程意味着通过你的代码跨互联网进行通信。例如，你会创建一个服务器并让它们进行通信。\n\
    \n## 代码执行计时\n\n你可能记得在递归章节中，我提到过我们将对代码的执行进行计时，看看哪种方法更快。那么让我们开始吧！在那个章节中，我们写了一个使用递归计算第\
    \ n 个斐波那契数的方法，我提到，尽管它是递归的一个良好演示，但对于当前的问题来说，它并不是一种计算高效的技术，实际上累加 0 到 n 之间的所有数字比计算\
    \ n 更好。这里是原始的 Fib 类，它增加了一个执行此操作的方法：\n\n```java\nclass Fib {\n    static long startTime\
    \ = 0;\n    static long endTime = 0;\n    static long duration = 0;\n    static\
    \ long duration2 = 0;\n\n    public static void main(String[] args) {\n      \
    \  System.out.println(\"Recursive: \");\n\n        startTime = System.nanoTime();\n\
    \        for(int i=1; i<= 30; i++)\n            System.out.println(fibN(i));\n\
    \        }\n\n        endTime = System.nanoTime();\n        duration = (endTime\
    \ - startTime);\n\n        System.out.println(\"execution took \" + duration +\
    \ \" nanoseconds\");\n\n        System.out.println(\"Non-Recursive: \");\n\n \
    \       startTime = System.nanoTime();\n        for(int i=1; i<= 30; i++))\n \
    \           System.out.println(fibN2(i));\n        }\n\n        endTime = System.nanoTime();\n\
    \        duration2 = (endTime - startTime);\n\n        System.out.println(\"execution\
    \ took \" + duration2 + \" nanoseconds\");\n\n        System.out.println(duration\
    \ + \" vs \\n\" + duration2);\n    }\n\n    static int fibN(int n) {\n      if(n\
    \ <= 1) {\n        return n;\n      }\n      else {\n        return fibN(n-1)\
    \ + fibN(n-2);\n      }\n    }\n\n    static int fibN2(int n) {\n      int current\
    \ = 1;\n      int previous = 0;\n      int next = 1;\n      int temp = 0;\n  \
    \    for(int i = 1; i < n; i++) {\n        temp = current;\n        next = previous+current;\n\
    \        current = next;\n        previous = temp;\n      }\n      return next;\n\
    \    }\n}\n```\n\n我不会解释那个额外的方法，因为它足够简单，我们从斐波那契序列的开始处并加直到 n 的所有数字。这里重要的是 `long`\
    \ 类型和 `System.nanoTime()` 的使用。`System.nanoTime()` 返回当前的纳秒级时间。我们在开始方法执行（在本例中是调用一个方法的循环）之前，将此值存储在\
    \ `long` 变量中，然后从 `System.nanoTime()` 获取一个新值，以获得以纳秒为单位的执行持续时间。有些人认为 `System.currentTimeMillis()`\
    \ 或多也准确，但许多因素会影响准确性，例如运行 JVM 的机器。总之，这就是代码执行计时的背后的通用逻辑。如果你想在比较不同技术的计时结果时获得一致的结果，最好对所有计时都使用同一台机器。不要用笔记本电脑为\
    \ `FibN()` 计时，然后用一台极高性能的电脑为 `FibN2()` 计时。尝试这个类来感受一下代码执行计时的感觉。\n\n## 结语\n\n感谢你购买这本书，我希望你发现它像我预想的那样有用。如果没有，或者即使如此，我也想知道为什么。欢迎随时通过以下邮箱给我提供反馈：\n\
    \naitpwbj@timtalbot\n\n## 附录\n\n### 第一章\n\n```java\nimport java.util.Scanner;\n\
    \nclass HelloWorldBoring {\n    // 声明读取控制的变量\n    static Scanner in = new Scanner(System.in);\n\
    \n    public static void main(String[] args) {\n        // 询问用户做什么\n        System.out.println(\"\
    What shall I do?\");\n        System.out.println(\"1)Repeat your name\");\n  \
    \      System.out.println(\"2)Repeat your age\");\n        System.out.println(\"\
