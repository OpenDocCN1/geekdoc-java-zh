- md: "\n[content]\nfloat: 101.0\n\nThe program should compile and run without any\
    \ issues at all, despite having two functions with the same name. This is the\
    \ beauty of function overloading. We have two functions here both multipliedBy()\
    \ but they are not of the same return type, although they could be (refer to type\
    \ casting in chapter 3 and the following code for an example). They also have\
    \ the same number of arguments, the only difference being the argument data type.\
    \ It is the difference in the argument data type that makes the function signature\
    \ different which in turn allows us to create overloaded functions.\n\nThis code\
    \ snippet demonstrates the same concept as previous but instead of returning a\
    \ float, the second multipliedBy() method returns an integer in the same way that\
    \ the first does. It still takes a float as its argument, however. The result\
    \ is cast from a float to an integer.\n\n```java\nclass ScopeDemo {\n    //visible\
    \ to the whole program, global variables\n    static int num1=10;\n    static\
    \ float num2=10.1F;\n\n    static int multiplyBy(int number) {\n        //local\
    \ variables number, multiplier\n        return (number*10);\n    }\n\n    static\
    \ int multiplyBy(float number) {\n        return (int)(number*10); //cast float\
    \ to int\n    }\n\n    public static void main(String[] args) {\n        System.out.println(\"\
    int: \" + multiplyBy(num1));\n        System.out.println(\"float: \" + multiplyBy(num2));\n\
    \    }\n}\n//end class\n```\n\n## Key Points\n\n- 1. Consider how you can break\
    \ your program up into functions before writing your code\n- 2. functions must\
