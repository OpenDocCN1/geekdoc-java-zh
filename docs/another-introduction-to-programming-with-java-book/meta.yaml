    The purpose of this is to ensure that you''re not running into problems whilst
    reading through the book, because I''ve read books with errors in the past and
    let''s face it, they suck!


    # Chapter 2: Where to Begin


    ## Quick Overview


    I''m sure that I know what Java is and the applications of it, but if not - here''s
    a quick overview. Java is a programming language that first came to light in 1995.
    It takes much of its syntax from C and C++ and was created with the specific intention
    of eradicating as many implementation dependencies as possible. It is an object
    oriented language and is completely platform independent. This is because, unlike,
    say, a native C++ program source code directly into machine code, when Java is
    compiled the source is converted into class files containing byte code which is
    then interpreted by the Java Virtual Machine (JVM) on whatever platform the class
    file is run on. The drawbacks here, of course, are that interpreted programs run
    a little slower (although this is virtually unnoticeable with modern processing
    power) than native programs and the requirement of the Java Runtime Environment
    (JRE) to be installed on a target computer.


    Due to the flexibility of the JVM, Java is used anywhere from mobile phones and
    web applications to ATMs, banks and televisions. Java is quite a popular choice
    when developing client-server applications such as high throughput chat systems.


    ## How to write a Java program


    Primarily, there are 2 ways you can go about writing a Java program and compiling
    it. You could use a simple text editor and compile it via the terminal / console
    / command line or you could use an Integrated Development Environment such as
    Eclipse or NetBeans. An IDE is simple enough to install so I haven''t detailed
    the process in this book but you can find Eclipse at www.eclipse.org which is
    what I recommend, simply because it''s what I use and maybe I am a little biased.
    I generally stick to a simple text editor when writing short programs and an IDE
    when working on larger projects and for this reason, throughout this book I have
    just used Windows Notepad. Java source files have a .java file extension.


    ## Setting up the Development Environment


    As previously mentioned, I will be working on Windows and this means I will be
    using the command line to compile and run my Java code. The first thing needed
    is the Java Development Kit (JDK) which you can get from here:


    http://www.oracle.com/technetwork/java/javas/downloads/


    by going to this URL and clicking the download link then by selecting the appropriate
    version. Once installed, we will add the JDK bin directory to the System Environment
    Variables called "Path". If you know how to do this, go ahead! If not, follow
    these instructions:


    You have right to right-click on the ''My Computer'' (or ''This PC'' as it says
    these days) icon on your desktop or start menu and select "properties":


    ![](img/ef6a16f18f5dfa49daafe188589229ff_20_0.png)


    This will open the System screen you then have to click “Advanced system settings”
    located in the left side panel:


    ![](img/ef6a16f18f5dfa49daafe188589229ff_20_1.png)


    Advanced System settings looks like this:


    ![](img/ef6a16f18f5dfa49daafe188589229ff_21_0.png)


    Finally, click "Environment Variables..." to get to the place we need to be.


    ![](img/ef6a16f18f5dfa49daafe188589229ff_21_1.png)


    Once at the “Environment Variables” screen, scroll down under the “System variables”
    section until you select “Path”, select it then click “Edit... The last thing
    on the string in the edit box needs to be a semi-colon so it isn''t, put one in
    there. Then we are going to add the absolute file path to the JDK bin directory
    which should look something like this:


    ```

    C:\Program Files\jdk<version>\bin

    ```


    Where jdk<version> is replaced with your Java version number such as jdk1.8.0_45
    for example. We''ve just gone through all this effort to save us the trouble of
    having to type that path every time we want to compile and/or run a Java via the
    command line. To test that we''ve done it correctly, launch cmd (hold the windows
