- md: "\n## else-if statements\n\nelse-if statements allow us to provide an additional\
    \ conditional statement in what is essentially a chain of conditional statements.\
    \ If our first if-statement condition is false the code can move on to another\
    \ else-if statement. If the else-if statement is false, the code can move on to\
    \ another else-if statement and you can have as many as you like. For example,\
    \ see the code:\n\n```\nif(age>=18 && dob_month != 12) {\n    System.out.println(\"\
    The user is 18 or over and was not born in December\");\n}\nelse if (dob_month\
    \ == 12) {\n    System.out.println(\"The user was born in December\");\n}\n```\n\
    \nSo here I have used the same statement from the previous example, if the variable\
    \ ‘age’ has a value greater than or equal to 18 OR the ‘dob_month’ has a value\
    \ not equal to 12 then execute the code within the if block, but now we add to\
    \ this ... else if the variable ‘dob_month’ has a value equal to 12 then execute\
    \ the code within the else-if block.\n\nThis gives us a lot more flexibility with\
    \ how to control the flow of our code and allows us to pose many more conditional\
    \ statements should we need them.\n\n## else statements\n\nelse statements must\
    \ follow an if-statement or an else-if statement, they cannot be used alone. They\
    \ also have to be the last statement in a series of conditional statements, an\
    \ else-if statement cannot follow an else statement, for example.\n\nEssentially,\
    \ an else statement says “if the if-statement is false, do this instead”. See\
    \ the examples below:\n\n### Valid\n\n```\nif(age>=18) {\n    System.out.println(\"\
    The user is 18 or over\");\n}\nelse if(age >= 10) {\n    System.out.println(\"\
    The user is between 10 and 17 years of age\");\n}\nelse {\n    System.out.println(\"\
    The user is under 10 years of age\");\n}\n```\n\n### Valid\n```\nif(age >=18)\
    \ {\n    System.out.println(\"The user is 18 or over\");\n} else {\n    System.out.println(\"\
    The user is under 18 years of age\");\n}\n```\n\n### Invalid\n```\nelse {\n  \
    \  System.out.println(\"The user is under 18 years of age\");\n}\n```\n\n## The\
    \ Ternary Operator\n\nThe ternary operator is simply shorthand for if-then-else\
    \ code. They can be nested; to have one statement inside another and so on. The\
    \ ternary operator is a personal favourite of mine simply because it looks cool\
    \ and is generally written on one line of code. A good typical of the ternary\
    \ operator is to assign a variable a particular value based on a condition. Here\
    \ are a couple of examples of this action.\n\n```\nint x = 10;\nint y = 15;\n\
    int z = (y==x) ? x+y : x;\nz = (y==x) ? (y>x) ? y : x;\n```\n\nSo let's break\
    \ this code. The first 2 lines create a couple of variables, x and y, and give\
    \ them a value (declaration and initialization). The third line creates an integer\
    \ too this time, the value is determined by an if-then-else statement using the\
    \ ternary (:) operator. This is in the form of:\n\n(condition) ? result of true:\
    \ if false\n\nSo, based on the values defined, the value of z becomes 10 because:\n\
    \nif (15==10) is true then the value of z is 10+15 otherwise the value of z is\
    \ 10.\n\nThe final line of code assigns a new value to z, again using the ternary\
    \ operator but this time a nested condition is included. If the original condition\
    \ is false, another condition is evaluated. Based on evaluations, the new value\
    \ of z becomes 15; the greater number out of x and y. In simple English, this\
    \ statement can be read as follows:\n\nif (15 == 10) is true then the value of\
    \ z is 10 otherwise if 15 is greater than 10 then the value of z is 15\n\nDespite\
    \ their apparent complexity, this method of coding conditions is quite elegant,\
    \ in my opinion. There isn' any any performance increases from using ternary operations\
    \ as opposed to if-then-else statements. The added benefit of providing concise\
    \ code. One particular scenario where the ternary operator is the only option\
    \ is if you need to initialize a constant based on a condition. A constant is\
    \ a variable whose value cannot change once initialized, as mentioned in chapter\
    \ 3.\n\n## Switch Statements\n\nSwitch statements, as shown in the Hello World\
    \ boring! program in the second chapter, are another type of flow control. Not\
    \ quite the same as the if and if-else statements but very extremely useful nonetheless.\n\
    \nA switch statement, instead of having a plan of action for true and false scenarios,\
    \ has a number of possible cases of action. The chosen course depends on a switch,\
    \ which is essentially a variable. The switch can use byte, int, char, short and\
    \ String with a few special classes that wrap primitive data types but we'll ignore\
    \ that, it's beyond our scope. We'll be using integers in our switch statements\
    \ because they're the easiest to work with.\n\nSo let's assume you want to print\
    \ out particular response depending on a user input. You could write a dozen if\
    \ statements that cater for each scenario which would work fine. You should decide\
    \ which to use based on the data you are evaluating, if statements can evaluate\
    \ ranges whereas switch can only evaluate one value. Here's how we go about that:\n\
    \n```\nint switcher = 0;\nswitch(switcher) {\n  case 1:\n    //do stuff\n    break;\n\
    \  case 2:\n    //do other stuff\n    break;\n  case 3:\n    //do other other\
    \ stuff\n    break;\n  default:\n    //do default stuff\n    break;\n}\n```\n\n\
    As you can see, each decision within the switch is called a case. The switch attempts\
    \ to match the given value to any cases; the code will be executed within the\
    \ case if there is a match. Any code between case x: and break; will be executed.\
    \ The break keyword is important here, without it, any cases that execute will\
    \ fall through which means every case after the matched case will execute sequentially\
    \ until the end of the switch block. This can cause all kinds of headache! Finally,\
    \ there is a default: case which will execute if there are no matches, it is not\
    \ compulsory absolutely recommended. The data your switch statements evaluate\
    \ can come from anywhere. In this example we use a simple integer variable but\
    \ this could be set to something different based on user input, if statements\
    \ or even even calculations. We’ll see a good example of using a switch statement\
    \ in chapter 8.\n\n## Chapter 6: Loops\n\nJava provides several types of loop\
    \ for us to use. This chapter will take a look at each type of loop and the problems\
    \ and benefits of loops. The two primary types of loop you will find yourself\
    \ using the for loop and the while loop, each having a couple of variations.\n\
    \n## While loops\n\nwhile loops essentially say “while this condition is true,\
    \ do the stuff below”. Here is a pseudo example of a simple while loop:\n\n```\n\
    while(condition) {\n  // some stuff\n}\n```\n\nThe while loop is best utilized\
    \ to execute a block of code an unknown number of times. The condition can be\
    \ any expression that evaluates to true, as shown in the previous chapter regarding\
    \ conditionals. Unlike an if statement, however, an expression within a while\
    \ loop must evaluate to true in order for the loop to run, there are no else while\
    \ loops. The primary benefit of a while loop is that you can repeatedly execute\
    \ the same piece of code based on a condition. This may sound basic but that’s\
    \ because it is. You’ll see shortly that not all loops work in this way.\n\nWait,\
    \ de-enough about, here is a couple of while loops to demonstrate their usage\
    \ in a variety of scenarios. First up is a simple arithmetic expression which\
    \ will become false after the loop runs several times:\n\n```\nint age = 10;\n\
    while(age < 18) {\n  //You cannot drink until you are 18, come back next year.\n\
    \  age += 1; //add a year to age. Could also be written as age++;\n  //or as age\
    \ = age + 1;\n}\n```\n\nSo this loop will run a total of 8 times, until the value\
    \ of age is no longer less than 18. Notice that the variable used within the condition\
    \ of the while loop is manipulated within the body of the loop. This is incredibly\
    \ important. If this didn’t happen, the loop would never end and we’d be stuck\
    \ with an infinite loop, more on this soon.\n\nNext is a while loop with a counter,\
    \ so you can keep track of the number of iterations the loop has ran.\n"
