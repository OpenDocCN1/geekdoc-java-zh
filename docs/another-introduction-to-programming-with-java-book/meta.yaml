    \ 12 月；如果任何一个条件不满足，表达式即为假。这个表达式表示，如果变量 age 值大于或等于 18 且 age 值小于 70 且变量 dob_month\
    \ 值不等于 12，则执行 if 块中的代码。\n\n最后，第三个示例在表达式使用了条件或运算符。它可以被读作：如果变量 age 值大于或等于 18 或者变量\
    \ dob_month 值不等于 12，则执行 if 块中的代码。\n\n正如你所见，这仅为我们提供了在表达式为真时执行代码的方法。如果它为假，我们可能想要执行某些替代代码，这就是\
    \ if 语句中 else 子句的用武所在。\n\n"
