    called ClassName.java. Then we have variables. These are declared as usual too.
    But now is the time we start making use of access modifiers. For now, we''ll treat
    everything as private.


    # Declaring Variables


    ```

    class ClassName {

    private int var1;

    private int var2;

    }

    ```


    I''ve added two variables to the ClassName class called var1 and var2, both integers
    which are yet to be initialized. Next, let''s add a method. Variables within a
    class are sometimes referred to as member variables.


    # Class Constructor


    ```

    class ClassName {

    private int var1;

    private int var2;

    public ClassName() {

    var1 = 0;

    var2 = 0;

    }

    ```'
