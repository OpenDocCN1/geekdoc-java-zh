    \ depends on a switch, which is essentially a variable. The switch can use byte,\
    \ int, char, short and String with a few special classes that wrap primitive data\
    \ types but we'll ignore that, it's beyond our scope. We'll be using integers\
    \ in our switch statements because they're the easiest to work with.\n\nSo let's\
    \ assume you want to print out particular response depending on a user input.\
    \ You could write a dozen if statements that cater for each scenario which would\
    \ work fine. You should decide which to use based on the data you are evaluating,\
    \ if statements can evaluate ranges whereas switch can only evaluate one value.\
    \ Here's how we go about that:\n\n```\nint switcher = 0;\nwitch(switcher) {\n\
    \  case 1:\n    //do stuff\n    break;\n  case 2:\n    //do other stuff\n    break;\n\
    \  case 3:\n    //do other other stuff\n    break;\n  default:\n    //do default\
    \ stuff\n    break;\n}\n```\n\nAs you can see, each decision within the switch\
    \ is called a case. The switch attempts to match the given value to any cases;\
    \ the code will be executed within the case if there is a match. Any code between\
    \ case x: and break; will be executed. The break keyword is important here, without\
    \ it, any cases that execute will fall through which means every case after the\
    \ matched case will execute sequentially until the end of the switch block. This\
    \ can cause all kinds of headache! Finally, there is a default: case which will\
    \ execute if there are no matches, it is not compulsory absolutely recommended.\
