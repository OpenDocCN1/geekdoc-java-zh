    # Chapter 17: Where to go from here


    Well, now you''ve made it to the final chapter which means you''ve probably studied
    the foundations of the Java programming language and should be able to go away
    and write your very own programs. But all we''ve done is look at the basics, what''s
    next?


    That''s a question best answered once you have decided what it is you want to
    be doing with your new found knowledge. If you''re just looking for a job as a
    Java programmer, I''d recommend looking learning about multithreading and then
    you''ll probably be ready. Experience is valued over knowledge in the industry
    but if you can show you the language, that''s all that really matters.


    # App Development


    Java is used for developing applications on the Android OS; mobile app development.
    If this is a path you want to take, you''ll need to look to the Android development
    tutorials provided by Google. There is some XML involved with app development
    but the functionality of apps will be written in Java, of course.


    # Storing Data


    A lot of programs, apps or otherwise, require the storage of data. There''s several
    ways you can go about storing data. Firstly, you could go forth and study reading
    and writing to files with Java. I originally planned to have a chapter on this
    but I decided against it because I felt it was a bit more than required for an
    introduction to Java. Then there''s property files, this is essentially reading
    and writing to a file with the specific intention of storing properties only in
    key-value format. Finally, there are databases. Java can communicate with MySQL,
    PostgreSQL, SQLite and other SQL servers with the aid of a Java database Connector
    Driver (JDBC). A JDBC is an external jar that you import into your projects in
    order to communicate with SQL servers, I am only familiar with the JDBC drivers
    for MySQL and PostgreSQL. This is a rather advanced topic but it is your alternative
    to storing data. Android apps use SQLite for local database storage, if needed.'
- md: "\n## Graphical User Interface\n\nPerhaps you want to create graphical Java\
    \ programs. Java provides an API called SWING which provides you with the ability\
    \ to create a Graphical User Interface. You can learn more about this via the\
    \ Java online documentation.\n\nJavaFX is a newer API that is slowly replacing\
    \ SWING so it is best to start there if you're new to the Java GUI scene.\n\n\
    ## JavaServer Pages (JSP)\n\nJava provides JavaServer Pages, known as JSP. JSP\
    \ is a server side programming language for web development. It is similar to\
    \ PHP and ASP in that respect, the difference being that it uses Java. A web server\
    \ that supports JSP by means of a servlet container as Apache Tomcat is required\
    \ in order to run JSP code. I wouldn't recommend learning Java for the sole purpose\
    \ of web development, there are other technologies more suited to the task.\n\n\
    ## Applets\n\nApplets are Java Applications that are delivered to the user via\
    \ a web page. These applications still run on the users' local JVM so they are\
    \ still required to have a JVM installed and acquire permission from the user\
    \ in order to run.\n\n## Network Programming\n\nUnderstanding network programming\
    \ with Java is definitely a useful skill to add to your arsenal of programming\
    \ knowledge. I'd definitely recommend researching multithreading before network\
    \ programming, though. Network programming means communicating across the internet\
    \ via your code. So you'd make a server and have them communicate, for example.\n\
    \n## Timing Code Execution\n\nYou may recall that in the chapter on recursion,\
    \ I said that we'd take a look at timing the execution of our code to see which\
    \ is quicker. So let's get to it! In that chapter, we wrote a method for calculating\
    \ the nth Fibonacci number using recursion and I stated that, although a good\
    \ demonstration of recursion, it's not a computationally efficient technique for\
    \ the problem at hand and in fact would be better to sum up all the numbers between\
    \ 0 and n instead of n. So here's that original Fib class with an additional method\
    \ which does just that:\n\n```java\nclass Fib {\n    static long startTime = 0;\n\
    \    static long endTime = 0;\n    static long duration = 0;\n    static long\
    \ duration2 = 0;\n\n    public static void main(String[] args) {\n        System.out.println(\"\
    Recursive: \");\n\n        startTime = System.nanoTime();\n        for(int i=1;\
    \ i<= 30; i++)\n            System.out.println(fibN(i));\n        }\n\n      \
    \  endTime = System.nanoTime();\n        duration = (endTime - startTime);\n\n\
    \        System.out.println(\"execution took \" + duration + \" nanoseconds\"\
    );\n\n        System.out.println(\"Non-Recursive: \");\n\n        startTime =\
    \ System.nanoTime();\n        for(int i=1; i<= 30; i++))\n            System.out.println(fibN2(i));\n\
    \        }\n\n        endTime = System.nanoTime();\n        duration2 = (endTime\
    \ - startTime);\n\n        System.out.println(\"execution took \" + duration2\
    \ + \" nanoseconds\");\n\n        System.out.println(duration + \" vs \\n\" +\
    \ duration2);\n    }\n\n    static int fibN(int n) {\n      if(n <= 1) {\n   \
    \     return n;\n      }\n      else {\n        return fibN(n-1) + fibN(n-2);\n\
    \      }\n    }\n\n    static int fibN2(int n) {\n      int current = 1;\n   \
    \   int previous = 0;\n      int next = 1;\n      int temp = 0;\n      for(int\
    \ i = 1; i < n; i++) {\n        temp = current;\n        next = previous+current;\n\
    \        current = next;\n        previous = temp;\n      }\n      return next;\n\
    \    }\n}\n```\n\nI won't explain the additional method because it's simple enough,\
    \ we start at the beginning of the Fibonacci sequence and add all numbers up to\
    \ n. What's important here is the use of long and System.nanoTime(); System.nanoTime()\
    \ returns the current time in nanoseconds. What do we store is this value in a\
    \ long before we begin our method execution, a loop that calls a method, in this\
    \ case, and then get a new value from System.nanoTime to get our duration of execution\
    \ in nanoseconds. Some folk argue that System.currentTimeMillis() is more or less\
    \ accurate but many things affect accuracy including the machine on which the\
    \ JVM is running, for example. Anyway, this is the general logic behind timing\
    \ code execution. If you want to have consistent results when comparing the timing\
    \ of different techniques, it's best to use the same machine for all timing. Don't\
    \ use a laptop to time FibN() and then an extremely high performance pc to time\
    \ FibN2(). Try this class to get a feel for timing code execution.\n\n## A Final\
    \ Word\n\nI'd like to say thank you to for purchasing this book and I hope you\
    \ have found it as useful as I intended it to be. If not, or even if so, I'd love\
    \ to know why. Feel free to drop me some feedback at:\n\naitpwbj@timtalbot\n\n\
    ## Appendix\n\n### Chapter 1\n\n```java\nimport java.util.Scanner;\n\nclass HelloWorldBoring\
