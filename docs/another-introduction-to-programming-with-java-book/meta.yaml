    # Throwing Exceptions


    Now we''ve caught some exceptions, what about throwing them? Moreover, what does
    that mean?!


    All the exceptions we catch are thrown. You can''t catch something if it''s not
    thrown, right? Right. Instead of catching an exception when it''s thrown, we can
    throw it further. If you have a method, methodName() for simplicity, which has
    some code that causes an exception, and you don''t want methodName() to handle
    that exception, you can throw the exception up the call stack to the point where
    the methodOne() method is called.


    Let''s see that in action so it''s a little easier to understand.


    ```

    class NotNumeric {


    public static void main(String[] args) {


    String str = "a";


    methodOne(str);


    } //end main


    static void methodOne(String s) throws NumberFormatException {

    Integer.parseInt(s);

    }

    n}

    ```


    Look at the declaration of the methodName() method. There are the words “throws
    NumberFormatException”. What this means is that any NumberFormatException is thrown
    within the method is thrown further up to where the method is called. If you compile
    and run this code, you''ll get the following stack trace:'
