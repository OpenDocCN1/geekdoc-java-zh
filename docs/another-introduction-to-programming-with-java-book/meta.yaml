  md: "# Infinite loops\n\nInfinite loops are exactly what they sound like, loops\
    \ loop for infinity. It's easy to accidentally create an infinite loop. Nothing\
    \ particularly catastrophic happens if you do, it'll just cause your program to\
    \ hang and become unresponsive until it eventually dies when your OS realises\
    \ it's not listening. If you don't want that to happen, make sure your loops can\
    \ terminate. This isn't so much of an issue with a *for* loop, unless you create\
    \ an infinite loop for purpose, the termination condition should be written within\
    \ the signature of the *for* loop.\n\nI'm sure you're curious, you can create\
    \ a *for* loop without an *initialization, termination or increment;*? The answer\
    \ is yes. You can omit any or all parts of the *for* loop signature. I've never\
    \ had a reason to do this but if you decide to do so, be sure to give a means\
    \ for the loop to exit.\n\n```\nint i = 0;\nfor(;; {\n  i++;\n  if(i>10) break;\n\
    }\n```\n\nThis is an example of an infinite *for* loop with the ability to exit\
    \ itself at some point, when *i>10* in this example. The break keyword will exit\
    \ any loop, as discussed below.\n\nFinally, in regards to infinite loops, as you've\
    \ seen with the *while* loop, the code within the loop must manipulate the variable\
    \ within the expression of the loop in order to make that expression evaluate\
    \ to false at some point, thus terminating the loop. If this does not happen,\
    \ an infinite loop is born!"
