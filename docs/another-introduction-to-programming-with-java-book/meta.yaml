  md: '# Do-While loops


    The do-while loop is almost identical to the while loop with one important difference.
    The do-while loop is guaranteed to execute at least one time, as a while loop
    is not. For this reason, the condition is placed at the end of the loop instead,
    so the syntax is slightly different. In fact, the Java documentation states that
    it is because of the location of the expression that the loop will always execute
    at least once. No matter which way you look at it, the do-while loop **will always
    execute at least once.**


