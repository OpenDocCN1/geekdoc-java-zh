    # Key Points


    +   1. Check the documentation if you''re not sure what type of exceptions may
    be thrown. This way you can be sure you can catch unchecked exceptions too, if
    necessary

    2. Use try-catch blocks whenever a piece of code may throw an exception, even
    if it is an unchecked exception

    3. Resolve compiler errors sequentially, starting at the beginning and recompiling
    after each error is resolved

    4. Use the information the compiler or stack trace gives you to debug your program
    and resolve exceptions'
