    \ a time when they’d benefit your work.\n\nJava allows you to create classes within\
    \ classes. These are referred to as nested classes. A nested class may be one\
    \ of two types, either a static nested class or a non-static nested class, the\
    \ latter is referred to simply as an inner class.\n\nWhen you define an inner\
    \ class, it has access to all member variables and methods of the containing class,\
    \ even if they are private. This is one of the reasons that nested classes are\
    \ used, to increase encapsulation in way. Nesting small classes within top-level\
    \ classes enables the inner class code to be located closer to where it is used\
    \ which aid development. Inner classes behave similarly to other member variables\
    \ within the top-level, or outer, class. Static nested classes do not. They are\
    \ equivalent to having a top-level class nested within another top-level class.\n\
    \n```\nclass outerClass {\n    class innerClass {\n}\n}\n```\n\nThis is essentially\
    \ how a nested class would look. If you require more information regarding nested\
    \ classes, please refer to the online Java documentation."
