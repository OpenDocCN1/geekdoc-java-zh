- md: "\n# Break and Continue\n\nThere are two Java keywords that you will find very\
    \ useful when working with loops. They are the break and continue keywords. We\
    \ have already seen the break keyword demonstrated in this chapter, it essentially\
    \ says to the containing loop “Stop right here, we’re done” and the loop terminates\
    \ at the point that the keyword is encountered. The continue keyword is similar\
    \ but instead of saying “we’re done” it says “Stop here, start a new iteration”.\
    \ It terminates only the current iteration of a loop and initiates the next iteration.\
    \ Both keywords terminate the loop at the point that they are encountered so if\
    \ there is any code below them, it won’t be executed.\n\n# Key Points\n\n- 1.\
    \ There are 3 types of loop: The while, do-while, and for-each\n- 2. The for-each\
    \ loop is a newer version of the for loop\n- 3. while loops are easy to end up\
    \ infinite\n- 4. for loops keep track of the number of iterations, while loops\
    \ do not\n- 5. break and continue help to control the flow of your loops\n- 6.\
    \ Nested loops can contain a mixture of types of loop\n\n# Exercises\n\n- 1. Write\
    \ a for loop that starts at 1 and ends at 10 which prints out the first numbers\
    \ of a triangle sequence starting at 1. The formula for this sequence is n = n(n+1)/2\n\
    - 2. Change your for loop to a while loop\n- 3. Write a for loop which achieves\
    \ the same result with:\n   - 1. no initialisation, just a termination and increment\n\
    \   - 2. no termination, just an initialisation and increment\n   - 3. no increment,\
    \ just an initialisation and termination\n   - 4. only an initialisation\n   -\
    \ 5. only a termination\n   - 6. only an increment\n   - 7. no initialisation,\
    \ termination or increment\n- 4. Declare an integer array with 10 elements and\
    \ use a for loop to initialize each element and use a for-each loop to cycle through\
    \ each element of the array\n- 5. Write any loop that prints from 1 to 10 but\
    \ skips all even numbers. Hint: use the modulo operator; [even number] % 2 = 0\n\
    \n## Chapter 7: Functions\nWhat is a function?\n\nFunctions, also called methods\
    \ and less frequently routines, are reusable blocks of code which can be written\
    \ once and called from anywhere within your code. We've already been using a function,\
    \ main(). But that's not really something we have a choice over, it's kind of\
    \ essential and we can't avoid invoking the main() method whenever we want to.\
    \ A function is a core part of programming it aids readability by segmenting your\
    \ code, increases efficiency because you're not rewriting the same code over and\
    \ over again and subtly emphasizes the DRY (Don't Repeat Yourself!) ideology.\n\
    \nFunctions will serve any purpose you write them for. When writing a program,\
    \ you should take a step back and look at everything you need to do such as “ask\
    \ a user for their name”, “generate a random String\", “sort an array” etc. All\
    \ tasks within a program can be broken down and segmented into functions.\n\n\
    When you write a function, it's header is typically referred to as its signature.\
    \ The main() function signature, for example, is:\n\n```\nvoid main(String[] args)\n\
    ```\n\nand this means that you can't get and create another function with the\
    \ same signature - the name main and one argument of the type String[].\n\nThe\
    \ syntax of a function in Java is as follows:\n\n```\naccess-modifier return-type\
    \ name(parameters) {\n    //code here\n}\n```\n\nAn average function may look\
    \ something like this:\n\n```\nint giveMeANNumber() {\n    return 10;\n}\n```\n\
    \nor\n\n```\nvoid sayHello() {\n    System.out.println(\"Hello\");\n}\n```\n\n\
    You don't have to explicitly provide an access modifier, please refer to chapter\
    \ 4 on Access Modifiers for more information on this. You do, however, have to\
    \ provide a return type when declaring a function. The return type indicates whether\
    \ or not the function should return any data, and if so, what type of data will\
    \ be returned. You can use any of the primitive types described in Chapter 3 as\
    \ a return type or void if you do not need to return any data. Notice in the first\
    \ example above, giveMeANumber(), within the body of the function there is a statement\
    \ - return 10; return is a keyword which, when encountered, will exit the function\
    \ and return the data that follows. If your function is not of type void statement.\
    \ You can use the return keyword on its own to exit a function of type void but\
    \ it is not required. When returning a value, it is returned to where the function\
    \ is called.\n\n```\nprivate int giveMeANumber() {\n    return 10;\n}\n\nint number\
    \ = giveMeANumber();\n```\n\nAs you can see here, to call a function we simply\
    \ write its name where we want to call it. When the machine interprets this piece\
    \ of code, it will refer to the function and execute the code therein and then\
    \ return to the point it was at and continue execution.\n\n# Parameters/Arguments\n\
    \nSometimes, we might want to give a function some data to work and to do this\
    \ we use parameters, also referred to as arguments. We give a function as many\
    \ or as few arguments as necessary and their types help determine the signature\
    \ of a function. We've already seen arguments with the main() function but let's\
    \ create some of our own.\n\n```\nint multiplyBy(int number, int multiplier) {\n\
    \    return (number*multiplier);\n}\n```\n\nThis integer function will take two\
    \ integers, multiply them and return the result. Remember the little section on\
    \ variable scope within chapter 3? Now is the time to bring that to the forefront\
    \ of your mind.\n\nLet's say we have a program that has a variable called number\
    \ and another multiplier which are to be passed to the above function which also\
    \ uses the same variable names.\n\n```\nclass ScopeDemo {\n    //visible to the\
    \ whole program\n    static int number=0;\n    static int multiplier=0;\n\n  \
    \  static int multiplyBy(int number, int multiplier) {\n        //local variables\
    \ number, multiplier\n        return (number*multiplier);\n    }\n\n    public\
    \ static void main(String[] args) {\n        number = 10;\n        multiplier\
    \ = 10;\n\n        System.out.println(multiplyBy(number, multiplier));\n    }\n\
    }\n```\n}//end class\n```\n\nFirstly, please ignore the static keyword for now.\
    \ So this program will print out 100 which is, hopefully, what you'd expect. What\
    \ if we changed our code to look like this:\n\n```\nclass ScopeDemo {\n    //visible\
    \ to the whole program\n    static int number=0;\n    static int multiplier=0;\n\
    \n    static int multiplyBy(int number, int multiplier) {\n        //local variables\
    \ number, multiplier\n        return (number*multiplier);\n    }\n\n    public\
    \ static void main(String[] args) {\n        number = 10;\n        multiplier\
    \ = 10;\n\n        System.out.println(multiplyBy(number, multiplier));\n    }\n\
    }\n```\n\nDoing, you'll see that the output is 80 and the multiplyBy() function\
    \ doesn't touch the global variables. Despite having the same name, this remains\
    \ true. If we wanted to access global variables within a function then we would\
    \ have to make use of the dot notation like so:\n\n```\nclass ScopeDemo {\n  \
    \  //visible to the whole program\nstatic int number=10;\nstatic int multiplier=10;\n\
    \nstatic int multiplyBy(int number, int multiplier) {\n    //local variables number,\
