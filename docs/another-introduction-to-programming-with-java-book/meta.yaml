  md: '# # Chapter 13: Error Handling


    Error handling is essential to any robust program. If your program rolls over
    and dies (aka becomes unresponsive when it crashes or just crashes) then it''s
    not a very good program, let''s be honest.


    Non-specific to Java, there are three types of error one encounters. You compile
    errors which prevent the program from being compiled - things like trying to use
    a variable that doesn''t exist, forgetting to end a line with a semi-colon or
    forgetting a closing curly brace.. These are the best errors. The compiler complains
    and won''t compile your program so the problem will never make it to a final product.
    The compiler also gives you a good indication (usually) of what the problem is
    so it''s not too difficult to fix (usually).


    You then have runtime errors which generally cause your program to crash and burn
    (terminate prematurely). These can be caused by trying to access elements in an
    array with an index that is larger than the number of elements or running out
    of memory, for example. Runtime errors can generally be anticipated and handled
    within your code to minimize their chance of occurrence but not every situation
    can be accounted for.


    Finally, my least favourite type of error, the logic error. It isn''t an error
    as such but more of a problem with the logic of your program. The compiler won''t
    point it out and it won''t cause a runtime error, you''ll just get different outcomes
    than you''d expect. For example, 1+1 always equals 2 but a logic error might result
    in 1+1 being equal to 7. That''s just a vague example, though. Anything that results
    in the incorrect functionality of your program, whether data output or clicking
    a button and ending up on the wrong screen, can be classified as a logic error.
    Some programmers do tend to refer only to the logic of code that results in output
    when referring to logic errors though bear this in mind.'
