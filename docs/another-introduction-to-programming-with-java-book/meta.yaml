  md: '# # Chapter 12: Classes


    # # What is a Class?


    As you''ve seen so far, every program we write in Java is contained within a class,
    it''s fair to say we''ve been writing our own classes. But not every class has
    to contain a main() method and not every class is a program. Most classes, in
    fact, serve to break down Programming problems into smaller chunks and that''s
    where Object-Oriented Programming comes in. From here on out we''ll begin to define
    and write our own classes using the knowledge we have learned from the previous
    chapters.


    When planning a program, we have to look at the problems that require a solution.
    We then break these problems down into smaller chunks to segment our program.
    When working from an OOP angle, we want to identify any and everything that could
    represent an object in reality. A prime example of this would be a simple game
    in which animals exist. We''d want an object for each type of animal. Or, a banking
    system may have an object for the customer, another for the customer account etc.
    Every object we can conceive will be represented by a class.


    The key point you should take away from this is that classes represent objects.'
