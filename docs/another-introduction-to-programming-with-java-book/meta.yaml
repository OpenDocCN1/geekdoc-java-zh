  md: '# Packages


    Before we start, we need a crash course on packages because we''re going to have
    several classes and it''s not very professional to have an unpacked project with
    multiple classes. The best way to describe a package is to compare it to a folder
    / directory on your system; If we had a package called ThePackage, for example,
    we would have a directory called ThePackage and all classes will be contained
    within this folder. That''s pretty much what we''ve done, right? Yes... BUT we
    must also declare the files to be a part of the package, too. To do this, we use
    the package keyword which is to be included at the start of any Java file that
    is within a package.


    ```

    package ThePackage;

    ```


    This is the line we would put at the very beginning of our classes within the
    package. Generally speaking, you don''t need to worry about the structure of packages
    when using an Integrated Development Environment (IDE) because the environment
    takes care of all that for you but for the next section of this chapter, we will
    be creating one package for our project. Now that you''re armed with that knowledge,
    let''s continue!'
