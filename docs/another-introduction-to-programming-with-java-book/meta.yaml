    # # Conditional Operators


    | Symbol | Example | Purpose |

    | --- | --- | --- |

    | && | x == 10 && !y returns true | The conditional AND operator where both parts
    of the conditional statement have to be satisfied in order for the statement to
    be true |

    | || | x == 15 || x == y | The conditional OR operator where only one of two parts
    of the conditional statement have to be satisfied in order for the statement to
    be true |

    | ?: | x == 10 ? : false | The ternary operator which is effectively shorthand
    for if-then-else (if condition is met, true else false) but you will most likely
    understand this better after the Conditional Statements chapter |


    The conditional AND operator takes precedence over the conditional OR operator
    and as such it is evaluated first in the event that you decide to use both operators
    within the same expression. Both of these operators function on a short-circuit
    basis (according to Java documentation) and this means that they will only evaluate
    as much as necessary as if the left hand expression is false, the right hand expression
    will not be evaluated if the conditional AND operator has been used, for example.


    ![](img/ef6a16f18f5dfa49daafe188589229ff_50_0.png)


