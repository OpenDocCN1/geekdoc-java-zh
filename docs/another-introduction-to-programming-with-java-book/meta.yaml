    # 第1章：引言

    ## 关于我以及我为什么决定写这本书


    我是 90 后代。我在拨号上网和在线文本游戏的时代长大。大约那时，我开始对计算机程序是如何运作的感兴趣。我第一次接触任何形式的编程是 IRC 客户端中的一种脚本语言，至少地说，简直糟糕透了。被它能实现的功能所吸引，我转向了我认为更有用的东西——HTML。我想制作出我当时正在玩的那些文本游戏。在初步学习
    HTML 之后，我深入研究了互联网的运作机制，并破解了许多对我来说未知且新奇的工具和概念，如网络服务器、数据库和服务器端脚本。我想说的是，作为一个试图学习这些技术的孩子，我第一次并没有能掌握它们，并且总是觉得它们可以解释得更清楚；例如，我曾多次尝试并花了大量时间来完全理解如何运行本地网络服务器。端口转发简直是一场噩梦！也许这就是为什么现在很多非虚构类作者会付诸文字的原因，


    在尝试了 Web 开发之后，我转向了 C++，并发现控制台（命令行）应用程序非常有趣，特别是当我掌握了之前的风格并开始接触面向对象编程（OOP）之后。当我在
    C++ 中遇到指针时，我决定第一次学习 Java，因为在那个年代，那是一个非常难以理解的概念。Java 学习起来相当容易，因为语法与 C++ 相似。当然，某个地方还混杂了一些
    Visual Basic，但我喜欢假装自己从没听过它！大学里几乎所有与编程相关的工作都是基于 Java 的。


    这导致了超过 12 年的自学，随后是 3 年的专业教育，在这段时期里，我对 Java 以及通用的编程有了深入的理解。所以，本质上，我决定写这本书的原因是希望为你提供一种更简洁、更有组织且更清晰的学习
    Java 基础的方法，这种方法我希望在我开始学习这门语言时就能用。我的意图是用尽可能少的内容尽可能好地获取 Java 的核心概念，直击主题，不加入过多的废话，以便让这本书读起来很快，同时不会遗掉任何重要内容。这是一个很难达成的折中，我希望我为你们做出了正确的！


    # 本书的读者群


    这本书适合任何想要学习 Java 的人。无论你是一个完全没有编程知识的初学者，还是一个中级 Java 程序员并想要更深入地理解书中某些更高级的话题，这本书都是为你准备的。它是为初学者编写的，但分段方式意味着示例代码和练习不会让你不得不去翻阅之前的章节来理解内容，除非你真的需要知道发生了什么！


    # 本书使用的约定


    在引用类、变量、方法名称名称时，我将使用*斜体*，除非我忘记了；


    # 练习


    如果你看到这个标题，说明针对你刚刚阅读的信息，有一些简单的练习供你完成。当然，没有人强迫你去做（除非你身边有一个正在施展戏法的绝地武士，但这样并不理想），但它们的目的是帮助你进一步理解所应用的信息。如果需要答案，可以在书末找到这些练习的解答。我知道，这很烦人而且总是让我抓狂，但如果答案就在同一页，那挑战的意义何在？！


    # 关键点


    如果你看到这个标题，你应该花几时间研究后面的观点，确保你清楚地理解了它们。与练习类似，这些内容的复杂性会逐渐增加，但我会在每个章节尽可能清晰地解释它们。


    有时我会直接给你甩几页代码。不要灰心，把它们复制出来并编译（在引入书籍之前，我检查了每一段源代码以确保它们可以运行，所以如果没有运行而你确定自己没写错，请给我发邮件！）并尝试理解它。这种方法是先给你代码，在你写出并亲自尝试之后再进行解释。这样，在我逐条剖析之前，你至少已经有了它的部分理解。有时根据我讨论的主题，我可能会反过来这样做。


    最后，你会发现书开头有很多表格——这是因为表格是呈现信息最有效、最清晰的方式，可以很容易找到并在需要时查阅。


    '
