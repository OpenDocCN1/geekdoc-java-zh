  - '[PAGE 177]


    Our FourFourCar class represents a 4x4, of course, but it implements the Car interface
    so it must implement the getSpeed(), toggleEngine() and getFuelLevel() methods
    in order to compile successfully. We create a boolean to represent whether or
    not the engine is running and a double to store the fuel level as a percentage
    and implement the required methods which return the top speed, defined and declared
    within the interface itself, return the fuel level and toggle the engine state.


    Of course, we could just write our FourByCar class without the Car interface and
    implement the methods anyway but the interface serves as a blueprint that must
    be followed. This blueprint, however, doesn''t define how something is done, just
    that it has to be done.


    ![](img/ef6a16f18f5dfa49daafe188589229ff_177_0.png)


    +   1. An interface can declare methods and variables but the variables are final
    and the methods do not have a body, just a signature

    2. A class can implement as many interfaces as you want

    3. the implements keyword must be used after the extends keyword if you are using
    both'
