  md: "# Hello, World! (Compiling your first program)\n\nSo, Hello, World! You may\
    \ be familiar with this if you have done any programming in the past. It is perhaps\
    \ the most iconic and notable programming introduction there is. It simply consists\
    \ of a short program that prints out the \"Hello, World!\" and contributes to\
    \ the satisfaction of writing your first program. So here it is:\n\n```\nclass\
    \ HelloWorld {//start of class\n    public static void main(String[] args) {\n\
    \        System.out.println(\"Hello, World!\");\n    }\n}//end of class\n```\n\
    \nThat's it! If you take this code and place it inside a text file named \"HelloWorld.java\"\
    \ within your Java directory, paying close attention to the capitalization and\
    \ spacing (lack of) the filename, you will be almost ready to compile and run\
    \ your program. Be sure to change the \"Save as type\" to \"All Files (*.*)\"\
    \ if using Windows to ensure your file is in fact .java file. First, though, you\
    \ must have the command line open and navigate to your Java directory. Once there\
    \ you will type javac HelloWorld.java to compile your .java file. It is ready\
    \ to run. Run it you must type java HelloWorld. The screenshot below shows this\
    \ process and if all is well, there should be no errors and you will see \"Hello,\
    \ World!\" printed into the command line console:\n\n![](img/ef6a16f18f5dfa49daafe188589229ff_25_0.png)\n\
    \nNotice the slight difference in command. The run command is \"java\" and the\
    \ compile command is \"javaC\""
