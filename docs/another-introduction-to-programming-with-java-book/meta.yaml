    \n成员级访问控制是指控制类内部方法和字段的访问。首先，你可以像上面一样使用 public 关键字或省略关键字，含义相同。此外，你还可以使用 protected\
    \ 或 private 修饰符。private 修饰符仅允许从同一个类内部访问，而 protected 修饰符允许从相同包内访问方法和字段（与包私有类似，但额外允许通过另一个包中该类的子类进行访问）。下表说明了访问级别，类似于\
    \ Java 文档中的内容：\n\n| 修饰符 | 类 | 包 | 子类 | 世界 |\n| --- | --- | --- | --- | --- |\n\
    | public | 是 | 是 | 是 | 是 |\n| protected | 是 | 是 | 是 | 否 |\n| 未使用修饰符 | 是 | 是 |\
    \ 否 | 否 |\n| private | 是 | 否 | 否 | 否 |\n\n第一列表示所引用的是哪种修饰符。随后是该修饰符是否提供了对其所用类的访问（类列），以及它所属的包（包列）。如果修饰符允许在所用类的子类中访问（子类列），最后是该修饰符是否允许从任何包中的任何类进行访问（世界列）。\n\
    \n访问修饰符的主要目的之一是确保当你的类被其他程序员使用时，不会发生误用类导致的错误。在决定使用何种访问修饰符时，除非有理由不这样做，否则始终使用 private，并避免使用\
    \ public 字段（除非是常量或你有理由这样做）。\n\n![](img/ef6a16f18f5dfa49daafe188589229ff_53_0.png)\n\
