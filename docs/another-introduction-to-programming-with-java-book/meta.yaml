    # Operators


    An operator is simply a special symbol that performs a function on one, two or
    three operands. The most common operator is the assignment operator and is used
    every time you assign a value to a variable; this operator is the equals (=) sign:


    ```

    int x = 10;

    ```


    This operator assigns a value on the right of the expression, 10, to the operand
    on the left, x.


    # Arithmetic Operators


    | Symbol | Example | Purpose |

    | --- | --- | --- |

    | + | y = y+10; or y += 10; | Addition operator; also used for string concatenation
    |

    | - | y = y-10; or y -= 10; | Subtraction operator |

    | / | y = y/10; or y /= 10; | Division operator |

    | * | y = y*10; or y *= 10; | Multiplication Operator |

    | % | y = y%10; or y %= 10; | The remainder operator which gives the remainder
    of a division sum; also known as the mod or modulo operator |


    Arithmetic expressions that are combined with the assignment operator to look
    like this:


    ```

    y += 10;

    ```


    They are called compound assignments.

    The arithmetic plus (+) can also be used to concatenate (link together, join)
    two or more strings together to form a single string, like so:


    ```

    String x = "hello";

    String y = "world";

    ```'
