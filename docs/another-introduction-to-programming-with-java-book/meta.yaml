- md: "\n## Chapter 11: Static\n\nYou may have noticed that the static keyword is\
    \ everywhere. But what does it mean? If something is static it can only exist\
    \ once. Or at least that's how I look at it. Members declared as static will only\
    \ exist once within a program no matter how many instances of the class exist.\
    \ So if you had a class called Dinosaur and it had a static variable called legs\
    \ then, no matter if you have 1 or 100 instances of the class Dinosaur, there\
    \ will only be one instance of the variable legs that is shared between all the\
    \ Dinosaur classes.\n\nIn a nutshell, static members belong to a class instead\
    \ of a specific instance. A big pain in the ass when writing small modules, for\
    \ example, where you want a couple of global variables available to you within\
    \ the main() method is needing to declare those variables as static. This is because\
    \ the very characteristics of a static member mean that a static method can only\
    \ access static variables. You can also access non-static members within a static\
    \ method if done through an instantiated object, of course. We'll see more on\
    \ instantiation in the next chapter.\n\nAnyway, quickly moving on. I just wanted\
    \ to touch on static because it's seldom ever mentioned and you'll forever wonder\
    \ why you can't access non-static variables from the main() method otherwise!\n\
    \n## Chapter 12: Classes\n\n### What is a Class?\n\nAs you've seen so far, every\
    \ program we write in Java is contained within a class, it's fair to say we've\
    \ been writing our own classes. But not every class has to contain a main() method\
    \ and not every class is a program. Most classes, in fact, serve to break down\
    \ Programming problems into smaller chunks and that's where Object-Oriented Programming\
    \ comes in. From here on out we'll begin to define and write our own classes using\
    \ the knowledge we have learned from the previous chapters.\n\nWhen planning a\
    \ program, we have to look at the problems that require a solution. We then break\
    \ these problems down into smaller chunks to segment our program. When working\
    \ from an OOP angle, we want to identify any and everything that could represent\
    \ an object in reality. A prime example of this would be a simple game in which\
    \ animals exist. We'd want an object for each type of animal. Or, a banking system\
    \ may have an object for the customer, another for the customer account etc. Every\
    \ object we can conceive will be represented by a class.\n\nThe key point you\
    \ should take away from this is that classes represent objects.\n\n### Defining\
    \ a Class\n\nTo define a class, we use the same syntax that we have up until now.\
    \ We choose a name for our class and proceed to create it like so:\n\n#### Class\
    \ Definition\n\n```\nclass ClassName {\n}\n```\n\nThis is an empty class called\
    \ ClassName which would be contained within a file called ClassName.java. Then\
    \ we have variables. These are declared as usual too. But now is the time we start\
    \ making use of access modifiers. For now, we'll treat everything as private.\n\
    \n### Declaring Variables\n\n```java\nclass ClassName {\nprivate int var1;\nprivate\
    \ int var2;\n}\n```\n\nI've added two variables to the ClassName class called\
    \ var1 and var2, both integers which are yet to be initialized. Next, let's add\
    \ a method. Variables within a class are sometimes referred to as member variables.\n\
    \n### Class Constructor\n\n```java\nclass ClassName {\nprivate int var1;\nprivate\
    \ int var2;\npublic ClassName() {\nvar1 = 0;\nvar2 = 0;\n}\n}\n```\n\nThis is\
    \ an awesome feature of classes. The class constructor. Notice that the method\
    \ added has the same name as the class? That makes it the class constructor. Equally\
    \ as important, however, is that this method is public and it has no return type.\n\
    \nThe purpose of the class constructor is to execute whenever a class is instantiated;\
    \ whenever an instance (copy) of the class is made to be used as an object that\
    \ represents within a program. Remember, instantiation means to create an instance\
    \ of. The constructor executes automatically and is used to prepare the class\
    \ for use such as by initiating variables, given data etc. Note: If no class constructor\
    \ is provided, an empty constructor will be automatically created at compile-time.\n\
    \nWe can also overload a class constructor so we can have more than one version\
    \ of it. Remember the discussion on function signatures in Chapter 7, regarding\
    \ overloading? That same applies here.\n\n### Overloading the Constructor\n\n\
    ```java\nclass ClassName {\n\n  private int var1;\n  private int var2;\n\n  public\
    \ ClassName() {\n    var1 = 0;\n    var2 = 0;\n  }\n\n  public ClassName(int var1,\
    \ int var2) {\n    this.var1 = var1;\n    this.var2 = var2;\n  }\n}\n```\n\nHere\
    \ we've added another constructor method, this time it takes 2 integer arguments\
    \ and then assigns them to the integer variables var1 and var2 that we created\
    \ at the beginning of our class.\n\n### The this keyword\n\nNotice the this keyword.\
    \ It is super useful when working with classes. It basically means “this class”.\
    \ So, when we use it here, we’re effectively saying\n\n```\nClassName.var1 = var\n\
    ClassName.var2 = var\n```\n\nwhere var1 and var2 are the values provided as arguments.\
    \ This could be rewritten so\ndon't have to use the this keyword but that's not\
    \ quite as fun.\n\n```java\nclass ClassName {\n    private int var1;\n    private\
    \ int var2;\n    public ClassName() {\n        var1 = 0;\n        var2 = 0;\n\
    \    }\n}\n```\nWait, let me re-examine the OCR for the \"this\" section. The\
