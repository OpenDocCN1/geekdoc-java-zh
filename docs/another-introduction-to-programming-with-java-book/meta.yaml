    ```\n\n这是我们 ClassName 对象的声明和实例化。看起来眼熟吗？它本质上只是另一个变量声明，但不是基本数据类型，我们的类型是我们正在定义的类名。`new`\
    \ 关键字告诉 Java 为我们要实例化的类在堆上分配足够的内存。随后，我们看到了看起来像函数调用的内容。确实。我们正在调用实例化类内部的构造方法，以创建一个新实例。你会看到第一行调用了无参数的构造函数，第二行调用了带参数的构造函数。我们现在有了两个名为\
    \ c1 和 c2 的 ClassName 类实例。这些都是对象。\n\n## 点符号表示法\n\n为了访问对象内部的方法，我们使用点符号法。有时被称为点操作符。在上述代码的每个\
