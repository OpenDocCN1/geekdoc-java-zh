    # Chapter 1: Introduction

    ## About Me and Why I Decided To Write This Book


    I was a 90''s kid. I grew up in the era of dial-up and online text based games.
    It was around time that I first took an interest in how a computer program does
    what it does. My first exposure to any form of programming was a scripting language
    within an IRC client and it was horrendous to say the least. Fascinated by what
    it could achieve, I moved on to something I considered to be much more useful
    - HTML. I wanted to make the text based games I was playing at the time. Shortly
    following my initial studies of HTML, I ventured deeper into the workings of the
    internet and deciphered tools and concepts unknown and new to me such as web servers,
    databases and server side scripting. My point is, as a child trying to learn these
    technologies I never managed to grasp the first time round and always felt they
    could be explained more clearly; for example, I met several attempts with plenty
    of time off to fully comprehend just how to go about running a local web server.
    Port forwarding was a nightmare! Perhaps this is the reason many non-fiction authors
    put to paper nowadays,


    Following my web development ventures, I moved on to C++ and found console (command
    line) applications quite interesting, especially once I mastered the past style
    and started touching on object oriented programming (OOP). I decided to start
    learning Java the first time round when I hit pointers in C++ as they were such
    a horrid concept to wrap my head around the time. Java was easy enough to pick
    up as the syntax is not unlike the syntax of C++. Of course, there was some Visual
    Basic thrown in somewhere but I like to pretend I''ve never heard of it! Pretty
    much all programming related work at university was based on Java.


    This has resulted in upwards of 12 years of self study followed by 3 years of
    professional education and over that length of time I gained a great understanding
    of Java and programming in general. So, in essence, the reason I decided to write
    this book was to hopefully provide you with a much more concise, organised and
    clear way of learning the basics of programming with Java in a way that I wish
    was available to me at the time I began learning the language. My intentions were
    to get the core concepts of Java as best I can with as little content as possible,
    getting straight to the point without too much crap in, in order to make the book
    a quick read without missing anything important. A difficult compromise to reach
    and I hope I have done right for you guys!


    # Who this book is for


    This book is for anyone wanting to learn Java. Whether you’re a beginner and have
    no knowledge of programming whatsoever, or you’re an intermediate Java programmer
    and want to better understand some of the more advanced topics in this book, this
    book is for you. It’s written with the beginner in mind but segmented in a way
    that means that the example code and exercises don’t make you searching through
    previous chapters to understand what’s on, unless you need to know what’s going!


    # Conventions used in this book


    When referring to names of classes, variables, methods I will use italic font
    unless I forget;


    # Exercises


    If you see this heading then there are simple exercises for you to do relating
    to the information you''ve just read. Of course, nobody is forcing you to do (unless
    you have a Jedi next to you working some tricks, but this isn''t ideal) but they
    are intended to help you further understand the information they are applied.
    Solutions to these exercises can be found at the back of the book if answers are
    needed. I know, it''s a pain in the ass and always drives me crazy but what''s
    the point in having a challenge if the answer is on the same page?!


    # Key Points


    If you see this heading then you should take a few moments to study the points
    following and make sure you understand them clearly. Similarly to the exercises,
    these will gradually increase in complexity but I will explain them in each section
    as clearly as possible.


    There will be times I just spam you with pages of code. Don''t be disheartened,
    copy it out and compile it (I check every piece of source code before introducing
    it to the book to ensure it works so if it doesn''t and you''re sure you''ve got
    right, email me!) and seek to understand it. The methodology is to give you the
    code and explain once you''ve written it out and tried it for yourself. That way,
    you will have at least a partial understanding of it before I dissect piece by
    piece. Sometimes I may do backwards, depending on what topics I''m discussing.


    Finally, you will notice a lot of tables in the beginning of this book - this
    is because tables are the most effective and clear way of presenting information
    that can be found easily and referred back to when needed.

