    # 本书的问题


    本书的末尾有一个邮箱地址，如果你在阅读过程中遇到任何错误、拼写错误或其他问题，可以使用该地址进行报告。如果确实存在错误，它们将发布在我的网站上：


    http://timtalbot.co.uk/aitpwjb/


    aitpwjb = Another Introduction to Programming with Java Book（另一本 Java 编程入门），以防你像我一样好奇。


    此举目的是为了确保你在阅读本书时不会遇到问题，因为我过去读过一些带有错误的书，坦率地说，那些书太糟糕了！


    # 第 2 章：从哪里开始


    ## 快速概述


    我确定自己 Java 是什么以及它的应用，但如果你还不——这里有一个快速的概述。Java 是一种首次于 1995 年问世编程语言。它的大部分语法继承自 C
    和 C++，创建的特定意图是尽可能消除实现实现依赖。它是一种面向对象的语言，并且完全独立于平台。这是因为，与例如原生的 C++ 程序源代码直接编译成机器码不同，Java
    在编译时会将源代码转换为包含字节码的类文件（class files），然后由 Java 虚拟机（JVM）在类文件运行的任何平台上进行解释。这里的缺点在于，解释型程序的运行速度比原生程序慢一点（尽管在现代处理能力下这几乎无法察觉），并且需要在目标计算机上安装
    Java 运行环境（JRE）。


    由于 JVM 的灵活性，Java 被从手机、Web 应用程序到 ATM、银行和电视的任何领域。在开发高吞吐聊天系统等客户端-服务器应用程序时，Java 是非常热门的选择。


    ## 如何编写 Java 程序


    主要，你有两种编写和编译 Java 程序的方法。你可以使用简单的文本编辑器并通过终端/控制台/命令行进行编译，也可以使用集成开发环境（IDE），如 Eclipse
    或 NetBeans。IDE 的安装非常简单，因此我没有在书中详细说明该过程，但你可以在 www.eclipse.org 找到 Eclipse，这也是我推荐的，仅仅因为我自己在使用它，也许我有一点偏见。在编写短程序时我通常使用简单的文本编辑器，而在处理较大的项目时使用
    IDE，正因如此，在本书中我一直使用 Windows 记事本。Java 源文件的扩展名为 `.java`。


    # 设置开发环境


    如前所述，我将在 Windows 上进行操作，这意味着我将使用命令行来编译和运行 Java 代码。首先需要的是 Java 开发包（JDK），你可以从这里获取：


    http://www.oracle.com/technetwork/java/javas/downloads/


    访问此 URL 并点击下载链接，然后选择相应的版本。安装完成后，我们将 JDK 的 `bin` 目录添加到名为“Path”的系统环境变量中。如果你知道如何操作，请继续！如果不知道，请遵循以下指令：


    你可以右键点击桌面或开始菜单上的“我的电脑”（现在称为“此电脑”）图标，并选择“属性”：


    ![](img/ef6a16f18f5dfa49daafe188589229ff_20_0.png)


    这将打开系统窗口，然后你需要点击左侧面板中的“高级系统设置”：


    ![](img/ef6a16f18f5dfa49daafe188589229ff_20_1.png)


    高级系统设置看起来如下：


    ![](img/ef6a16f18f5dfa49daafe188589229ff_21_0.png)


    最后，点击“环境变量...”到达我们需要的地方。


    ![](img/ef6a16f18f5dfa49daafe188589229ff_21_1.png)


    在“环境变量”界面上，向下滚动到“系统变量”部分，直到你选择“Path”，选中它然后点击“编辑...”。编辑框中字符串的最后一个末尾需要一个分号，如果不是，请加上它。然后我们将
    JDK `bin` 目录的绝对文件路径添加进去，它看起来应该像这样：


    ```

    C:\Program Files\jdk<version>\bin

    ```


    其中 `jdk<version>` 替换为你的 Java 版本号，例如 `jdk1.8.0_45`。我们费了这么多努力，是为了避免以后每次想通过命令行编译和/或运行
    Java 时都得手动输入该路径的麻烦。为了测试我们是否操作正确，启动 cmd（按住 Windows 键并按 R，输入“cmd”并按回车），然后输入“java”并按回车。你应该看到出现一大段文字列出了
    `java.exe` 可执行文件的用法选项；你不希望看到“''java''不是内部或外部命令、可运行程序或批文件”。如果是这样，请缓慢重复这些步骤，确保你没有遗漏任何内容。


    现在你可以关闭我们打开的所有对话框了。接下来，我们将...


    '
