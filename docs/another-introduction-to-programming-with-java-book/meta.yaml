  - "[PAGE 74]\n\n# For each loops (enhanced for loops)\n\nThe for-each loop is the\
    \ newer style for loop that is much more elegant. You don't need to use it, the\
    \ old style for is perfectly fine. You should at least be familiar with it in\
    \ case you see it somewhere else. It's better to be prepared.\n\nThe for-each\
    \ loop simply says \"for each item, x, in y...\" and proceeds to iterate through\
    \ the list until it reaches the end. This does away with the need to know the\
    \ length of the list and the need to keep track of the current iteration if the\
    \ loop. The only real downside is if you need to know the iteration, you will\
    \ have to add a counter such as that seen with the while loop.\n\nA typical for-each\
    \ loop looks like this, imagining the array arr that I previously demonstrated\
    \ above it exists here:\n\n```\nfor (int i : arr) {\n  System.out.println(i);\n\
    }\n```\n\nNow this for-each loop does exactly the same as the for loop shown previous\
    \ but it's so much neater. It reads as \"for integer i in the array arr...\".\
    \ For each iteration of the loop, i takes the value stored in the element of the\
    \ array arr at the current index. We then access that value by referring to i\
    \ and using System.out.println() to print the value to a new line in the console."
  - "[PAGE 75]\n\n# Infinite loops\n\nInfinite loops are exactly what they sound like,\
    \ loops loop for infinity. It's easy to accidentally create an infinite loop.\
    \ Nothing particularly catastrophic happens if you do, it'll just cause your program\
    \ to hang and become unresponsive until it eventually dies when your OS realises\
    \ it's not listening. If you don't want that to happen, make sure your loops can\
    \ terminate. This isn't so much of an issue with a *for* loop, unless you create\
    \ an infinite loop for purpose, the termination condition should be written within\
    \ the signature of the *for* loop.\n\nI'm sure you're curious, you can create\
    \ a *for* loop without an *initialization, termination or increment;*? The answer\
    \ is yes. You can omit any or all parts of the *for* loop signature. I've never\
    \ had a reason to do this but if you decide to do so, be sure to give a means\
    \ for the loop to exit.\n\n```\nint i = 0;\nfor(;; {\n  i++;\n  if(i>10) break;\n\
    }\n```\n\nThis is an example of an infinite *for* loop with the ability to exit\
    \ itself at some point, when *i>10* in this example. The break keyword will exit\
    \ any loop, as discussed below.\n\nFinally, in regards to infinite loops, as you've\
    \ seen with the *while* loop, the code within the loop must manipulate the variable\
    \ within the expression of the loop in order to make that expression evaluate\
    \ to false at some point, thus terminating the loop. If this does not happen,\
