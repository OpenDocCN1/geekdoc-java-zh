    # The final keyword


    All variables are subject to change either intentionally or otherwise but you
    may want to avoid this. For example, if you''re working on a collaborative project
    and add a new variable that shouldn’t be changed or you just want to avoid accidentally
    changing a variable within your projects, the final keyword comes in handy. To
    achieve this, variables can be prefixed with the keyword final. This is also referred
    to as a constant variable and means that once the variable is initialized (assigned
    a value) it cannot be changed and if you try to do so, you will get a compiler
    error. This keyword can also be used in relation to classes and methods.


    # Variable Scope


    The term ‘scope’ in programming is used to describe where, within code, a variable
    is visible, the accessibility of the variable throughout the program. Firstly,
    a variable can be declared one of 4 places:


    +   1. within the class body

    2. as a method argument

    3. within the body of a method

    4. within a code block such as an if-statement or while loop


    If a variable is declared within the class body, it is accessible from any point
    within the class, including within the body of a method or a code block. This
    is referred to as a variable or global scope. A variable declared as a method
    argument/parameter is only accessible to that method, the same is true of variables
    declared within the body of a method or a code block. These are called local variables.
    If a variable is declared within the class body and then another variable with
    the same name is declared within a method, for example, the local variable takes
    the lead role within the method. In order to access the variable declared within
    the class body, the ‘this’ keyword is used.


    A variable cannot be accessed before it is declared.'
