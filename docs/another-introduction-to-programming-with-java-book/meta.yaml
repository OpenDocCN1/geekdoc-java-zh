  md: '# Chapter 17: Where to go from here


    Well, now you''ve made it to the final chapter which means you''ve probably studied
    the foundations of the Java programming language and should be able to go away
    and write your very own programs. But all we''ve done is look at the basics, what''s
    next?


    That''s a question best answered once you have decided what it is you want to
    be doing with your new found knowledge. If you''re just looking for a job as a
    Java programmer, I''d recommend looking learning about multithreading and then
    you''ll probably be ready. Experience is valued over knowledge in the industry
    but if you can show you the language, that''s all that really matters.


    # App Development


    Java is used for developing applications on the Android OS; mobile app development.
    If this is a path you want to take, you''ll need to look to the Android development
    tutorials provided by Google. There is some XML involved with app development
    but the functionality of apps will be written in Java, of course.


    # Storing Data


    A lot of programs, apps or otherwise, require the storage of data. There''s several
    ways you can go about storing data. Firstly, you could go forth and study reading
    and writing to files with Java. I originally planned to have a chapter on this
    but I decided against it because I felt it was a bit more than required for an
    introduction to Java. Then there''s property files, this is essentially reading
    and writing to a file with the specific intention of storing properties only in
    key-value format. Finally, there are databases. Java can communicate with MySQL,
    PostgreSQL, SQLite and other SQL servers with the aid of a Java database Connector
    Driver (JDBC). A JDBC is an external jar that you import into your projects in
    order to communicate with SQL servers, I am only familiar with the JDBC drivers
    for MySQL and PostgreSQL. This is a rather advanced topic but it is your alternative
    to storing data. Android apps use SQLite for local database storage, if needed.'
  merge: -1
  pgno: 216
- img_proc: true
  md: '# Graphical User Interface


    Perhaps you want to create graphical Java programs. Java provides an API called
    SWING which provides you with the ability to create a Graphical User Interface.
    You can learn more about this via the Java online documentation.


    JavaFX is a newer API that is slowly replacing SWING so it is best to start there
    if you''re new to the Java GUI scene.


    # JavaServer Pages (JSP)


    Java provides JavaServer Pages, known as JSP. JSP is a server side programming
    language for web development. It is similar to PHP and ASP in that respect, the
    difference being that it uses Java. A web server that supports JSP by means of
    a servlet container as Apache Tomcat is required in order to run JSP code. I wouldn''t
    recommend learning Java for the sole purpose of web development, there are other
    technologies more suited to the task.


    # Applets


    Applets are Java Applications that are delivered to the user via a web page. These
    applications still run on the users'' local JVM so they are still required to
    have a JVM installed and acquire permission from the user in order to run.


    # Network Programming


    Understanding network programming with Java is definitely a useful skill to add
    to your arsenal of programming knowledge. I''d definitely recommend researching
    multithreading before network programming, though. Network programming means communicating
    across the internet via your code. So you''d make a server and have them communicate,
    for example.'
