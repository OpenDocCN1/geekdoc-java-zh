  md: I won't explain the additional method because it's simple enough, we start at
    the beginning of the Fibonacci sequence and add all numbers up to n. What's important
    here is the use of long and System.nanoTime(); System.nanoTime() returns the current
    time in nanoseconds. What do we store is this value in a long before we begin
    our method execution, a loop that calls a method, in this case, and then get a
    new value from System.nanoTime to get our duration of execution in nanoseconds.
    Some folk argue that System.currentTimeMillis() is more or less accurate but many
    things affect accuracy including the machine on which the JVM is running, for
    example. Anyway, this is the general logic behind timing code execution. If you
    want to have consistent results when comparing the timing of different techniques,
    it's best to use the same machine for all timing. Don't use a laptop to time FibN()
    and then an extremely high performance pc to time FibN2(). Try this class to get
    a feel for timing code execution.
