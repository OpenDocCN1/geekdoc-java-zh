    # Break and Continue


    There are two Java keywords that you will find very useful when working with loops.
    They are the break and continue keywords. We have already seen the break keyword
    demonstrated in this chapter, it essentially says to the containing loop “Stop
    right here, we’re done” and the loop terminates at the point that the keyword
    is encountered. The continue keyword is similar but instead of saying “we’re done”
    it says “Stop here, start a new iteration”. It terminates only the current iteration
    of a loop and initiates the next iteration. Both keywords terminate the loop at
    the point that they are encountered so if there is any code below them, it won’t
    be executed.'
