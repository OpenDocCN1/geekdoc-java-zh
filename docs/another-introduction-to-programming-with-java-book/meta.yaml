  mdcn: "\n在继续之前，它会等待积分完成，无论需要多久。我们声明了几个局部变量，用于存储用户输入的值，以便我们可以在 `switch` 语句中使用它们：一个\
    \ `double` 类型用于存储用户想要转换的温度，一个 `boolean` 标志用于标记在尝试将用户输入转换为整数的 `try-catch` 块中遇到任何错误。这听起来有点绕口。我的错。\n\
    \n在我们的 `try-catch` 块运行后，我们检查布尔值是否设置为 `true`（如果在 `try-catch` 中捕获到任何异常，就会发生这种情况）。因此，如果我们告诉用户问题，然后再次调用该方法。你会注意到这一行有一个注释，我们记录了这一点。这是因为在函数内部调用函数本身就是“递归”，我们将在下一章中详细介绍。如果没有错误，我们就直接进入\
    \ `switch` 语句。\n\n我们的 `switch` 中有四种情况：0、1、2 和 `default`。`Case 0` 调用 `System.exit(0)`\
    \ 优雅地终止程序。`Cases 1` 和 `2` 调用我们 Scanner 对象的 `nextLine()` 方法，然后通过调用 `getDoubleFromToStr()`\
    \ 方法尝试将输入转换为 `double`。如果返回值等于 `Double.isNaN()`（这是 `Double` 包装类的一个方法，用于识别值为“非数字”（Not-a-Number）的\
    \ double），则再次通知用户转换本身的结果。递归！否则，通过在 `System.out.println()` 中包含对相关转换方法的调用告知用户转换结果，然后再次调用\
    \ `getUserInput()` 方法重新创建循环。\n\n如果你是编程新手，这看起来会非常难以吸收，所以不要因为需要重读某些内容或无法立即理解某个特定概念而沮丧，特别是当它还是我们尚未检查的内容时。为了更好地理解某些东西而重读整个章节的次数不胜数。更不用说我查阅我正在使用的语言文档的时间了。顺便说一下，这很重要，我从未读过任何说经常查阅文档是没问题的书，我都是自学，直到我上大学才知道这是常态。\n\
    \n但是，如果你觉得你已经掌握了，那太棒了！\n\n尝试自己编写这个程序，不要复制代码。你只需要知道下方的公式。书中没有这个题的答案，因为每个程序都是不同的，解决任何问题都有无数种方法，因此探索自己的路径总是好的！\n\
    \n摄氏度转华氏度：\n\n```\nF = (C) × (9 ÷ 5) + 2\n```\n\n华氏度转摄氏度：\n\n```\nC = ((F) - 32)\
    \ × (5 ÷ 9)\n```\n\n不要忘记 double 值后面应该跟着一个 `d`。\n\n## 第 9 章：递归\n\n递归。去谷歌搜索“recursion\
    \ =)”。说真的，试一试。\n\n总之，递归。与技术计算相关的定义是一种方法，其中问题的解决方案取决于对相同问题的更小实例的解决方案。\n\n我所知的递归是在方法内部调用方法本身的行为。与我在第\
    \ 8 章中的例子相比，算法方法对递归会更有益，但它终究是递归。\n\n让我们看看编程中经典的递归示例——计算第 n 个斐波那契数。不过，这不是递归最实用的例子，所以我们还会查看其他内容，但请将其放入\
    \ `.java` 文件并编译它以满足你的好奇。\n\n```java\nclass Fib {\n    public static void main(String[]\
    \ args) {\n        for(int i=0; i<11; i++) {\n            System.out.println(fibN(i));\n\
    \        }\n    }\n\n    static int fibN(int n) {\n        if(n <= 1) {\n    \
    \        return n;\n        } else {\n            return fibN(n-1) + fibN(n-2);\n\
    \        }\n    }\n}\n```\n\n所以，就是这样。我们创建了 `Fib` 类并在 `main` 方法中启动循环，输出 `fibN`\
    \ 方法 11 次的结果，对应第 0 到 10 个斐波那契项。\n\n如果 `n` 小于等于 1，`fibN` 方法将返回 `n` 的值，这是因为斐波那契序列的第一项是\
    \ 1。嗯，技术上它是 0，但那是第 0 项，所以不计入。0 将返回 0，-1 将返回 -1，以此此类推。然而，如果 `n` 大于 1，递归开始。如果 `n`\
    \ 的值为 2，返回的值将是 `fibN(1)+fibN(0)` 的值，即 1。如果 `n` 的值为 3，则将发生以下情况：\n\n```\nreturn\
    \ fibN(2) + fibN(1)\nfibN(2) = fibN(1) + fibN(0)\nfibN(1) = 1\nfibN(0) = 0\nfibN(1)\
