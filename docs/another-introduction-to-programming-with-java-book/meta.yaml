    thrown, right? Right. Instead of catching an exception when it''s thrown, we can
    throw it further. If you have a method, methodName() for simplicity, which has
    some code that causes an exception, and you don''t want methodName() to handle
    that exception, you can throw the exception up the call stack to the point where
    the methodOne() method is called.


