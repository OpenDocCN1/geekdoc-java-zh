    ```java\nc2.getVar1()\n```\n\n这告诉 Java 检查对象 c1（它是我们 ClassName 类的一个实例），并执行 `getVar1()`\
    \ 方法，该方法返回整数变量 var1 的值。如果此方法是私有的或不存在，我们将遇到异常，稍后会详细介绍。不过，可以这样访问的不只是方法。如果变量显示了所需的访问修饰符，也可以访问。如果我们将\
