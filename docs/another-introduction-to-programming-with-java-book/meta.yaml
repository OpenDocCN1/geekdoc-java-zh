    \n## 多态\n\n有些人认为，多态是一个相当难以理解和解释的话题，因此我将进一步讨论本章的后续部分以描述这一概念。多态意味着采取许多不同的形式（poly\
    \ = 多，morph = 形式/形状）。在编程中，它简单来说意味着方法的重载或重写以及对象的声明。继承和多态是影不相形的，没有继承就没有多态。让我们从之前的继承类开始，并修改以下行代码：\n\
