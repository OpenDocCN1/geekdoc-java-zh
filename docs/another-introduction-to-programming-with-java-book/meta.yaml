    \ 的方法。这就是接口的魅力所在。它们定义了任何实现接口的类必须实现的方法，否则类将无法编译。此外，一个类可以实现任意数量的接口。你只能继承一个类，但可以使用许多接口。接口是在继承类之后实现的，所以你的继承自父类并实现接口的类看起来总是像这样：\n\
    \n```java\nclass NewClass extends SomeParent implements NewInterface1, New2\n\
    ```\n\n让我们来看接口的一个潜在用途：\n\n```java\ninterface Car {\n    int topSpeed = 100;\n\
