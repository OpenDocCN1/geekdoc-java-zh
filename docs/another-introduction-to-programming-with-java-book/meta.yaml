  mdcn: "\n接下来，我们需要创建一个 `Student` 类，请先保存 `Person.java` 并打开 `Student.java`。\n\n我们的学生将拥有一课程、平均分和预期成绩、出勤率以及当前的学习年级。同样，我们在这里需要\
    \ getters、setters 和构造函数。不过不要忘记，我们的 `Student` 将继承自 `Person`。\n\n- 变量：String avgGradeStr,\
    \ String projectedGradeStr, int avgGradeInt, int projectedGradeInt, double attendance,\
    \ int yearOfStudy\n\n```java\npackage DoC;\n\nclass Student extends Person {\n\
