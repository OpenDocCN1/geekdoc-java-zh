  md: '# Chapter 10: ArrayList


    I couldn''t decide where exactly was the best place to discuss ArrayList''s so
    I decided to just squeeze in a chapter about somewhere around the middle. The
    reason I have decided to include this chapter is because I will be using the ArrayList
    class in future chapters so you need to know about them. They are also kind of
    useful, so you need to know them.


    ArrayList, in Java, is an ordered collection of data which can be thought of as
    a *dynamic* array. it is considered an array that is *not fixed length*. Another
    way of looking at it is to call a resizable-array implementation of the List interface,
    and thus you should also consider looking into *List* and *Collection* which I
    won''t be covering here. The length of an ArrayList can change by adding and removing
    elements at runtime which is not possible with a normal array.


    When you declare a normal array:


    ```

    int [] arr = new int[10];

    ```


    You also declare how many elements the array will contain; this is to allow the
    Java Runtime System to allocate the appropriate amount of memory for the array.
    There will be situations you don''t know how many elements an array will need,
    keeping track of connected clients within a server, for example, and this is where
    the ArrayList will shine.

    Unlike the arrays you are familiar with, you declare an ArrayList like:


    ```

    ArrayList<Object> listName = new ArrayList<Object>();

    ```


    This is quite a strange concept at first, using the angle brackets (chevrons)
    like that and such. We replace *Object* with the type of object that will be stored
    in our ArrayList. Yes, objects will be stored as opposed to primitive data. That
    means if we want to store integers, for example, we would use the *Integer* object
    as opposed to the *int* type. You can, however, use primitive arrays (e.g. int[])
    as your object type. This also means we can store objects of our own in an ArrayList
    which is good news for us! Similarly to a normal array, the ArrayList does have
    indices to access the data, but we access it differently:


    ```

    listName.get(index);

    ```


    We call the *get()* method of the ArrayList and pass it an index as a parameter.
    There are several implementations of the *get()* method and you should study them
    in the Java documentation. We add data to the ArrayList in the same way:


    ```

    listName.add(Object of appropriate type);

    ```'
