    class Temperature {\n\n  // 摄氏和华氏的变量\n  private double c;\n  private double f;\n\
    \n  /** 用于 switch 语句的标志\n   * 识别摄氏或华氏\n   */\n  public static final int CELSIUS\
    \ = 0;\n  public static final int FAHRENHEIT = 1;\n\n  /**\n   * 构造函数。\n   * double\
    \ temp - 温度\n   * int type - 温度单位，摄氏或华氏\n   */\n  public Temperature(double temp,\
    \ int type) {\n\n    switch(type) {\n      case CELSIUS:\n        c = temp;\n\
    \        f = toFahrenheit(c);\n        break;\n      case FAHRENHEIT:\n      \
    \  f = temp;\n        c = toCelsius(f);\n        break;\n      default:\n    \
    \    c = 0;\n        f = 0;\n    }\n  }\n  //end 构造函数\n\n  private double toFahrenheit(double\
    \ c) {\n    double fahrenheit = (c * 9/5) + 32;\n    return fahrenheit;\n  }\n\
    \n  public double toCelsius(double f) {\n    return (f - 32) * 5/9;\n  }\n\n \
    \ public double getCelsius() {\n    return c;\n  }\n\n  public double getFahrenheit()\
    \ {\n    return f;\n  }\n\n  public void setCelsius(double c) {\n    this.c =\
    \ c;\n    this.f = toFahrenheit(c);\n  }\n\n  public void setFahrenheit(double\
    \ f) {\n    this.f = f;\n    this.c = toCelsius(f);\n  }\n}\n```\n\n# 第 14 章\n\
