  mdcn: "\n\n# break 和 continue\n\n在处理循环时，你会发现两个非常有用的 Java 关键字。它们是 `break` 和 `continue`\
    \ 关键字。我们已经在本章中看到过 `break` 关键字的演示，它本质上是告诉包含它的循环“停在这里，我们已经完成了”，并且循环会在遇到该关键字的地方终止。`continue`\
    \ 关键字与它很相似，但它说的不是“我们完成了”，而是“在这里停止，开始下一次迭代”。它只会终止循环的当前迭代，并启动下一次迭代。这两个关键字都会在它们所在的地方终止循环，因此如果它们正下方有任何代码，这些代码将不会被执行。\n\
    \n# 核心要点\n\n- 1. 循环有 3  类型：while、do-while 和 for-each\n- 2. for-each 循环是 for 循环的新版本\n\
    - 3. while 循环很容易变成死循环\n- 4. for 循环可以记录迭代次数，而 while 循环则不会\n- 5. `break` 和 `continue`\
    \ 有助于控制循环的流向\n- 6. 嵌套循环可以包含混合类型的循环\n\n# 练习题\n\n- 1. 编写一个从 1 开始到 10 结束的 for 循环，打印从1开始的三角形序列的前数字。该序列的公式为\
    \ n = n(n+1)/2\n- 2. 将你的 for 循环改为 while 循环\n- 3. 编写一个实现相同结果的 for 循环：\n   - 1.\
    \ 没有初始化，只有终止和递增\n   - 2. 没有终止，只有初始化和递增\n   - 3. 没有递增，只有初始化和终止\n   - 4. 只有初始化\n\
    \   - 5. 只有终止\n   - 6. 只有递增\n   - 7. 没有初始化、终止或递增\n- 4. 声明一个拥有 10 个元素的整数数组，并使用\
    \ for 循环初始化每个元素，然后使用 for-each 循环遍历数组的每个元素\n- 5. 编写任何循环来打印从 1 到 10 但跳过所有偶数。提示：使用取模运算符；[偶数]\
    \ % 2 = 0\n\n## 第 7 章：函数\n什么是函数？\n\n函数（也称为方法，较少称为例程）是可重用的代码块，可以编写一次并在代码的任何地方调用。我们已经在使用一个函数\
    \ `main()` 了。但这并不是我们有选择余地，它是必不可少的，我们无法避免在任何需要的时候调用 `main()` 方法。函数是编程的核心部分，它通过分段你的代码提高了可读性，因为你不需要反复编写相同的代码，从而提高了效率，并微妙地强调了\
    \ DRY（不要重复自己！）的理念。\n\n函数可以服务于你为它编写任何目的。在编写程序时，你应该后退一步，看看你需要做的所有事情，例如“向用户询问姓名”、“生成随机字符串”、“排序数组”等。程序中的所有任务都可以拆解并分割成函数。\n\
    \n当你编写一个函数时，它的头部通常被称为签名（signature）。例如，`main()` 函数的签名如下：\n\n```\nvoid main(String[]\
    \ args)\n```\n\n这意味着你不能获取并创建另一个签名相同的函数——即名为 `main` 且有一个 `String[]` 类型的参数。\n\n\
    Java 中函数的语法如下：\n\n```\naccess-modifier return-type name(parameters) {\n    //在此处编写代码\n\
    }\n```\n\n一个普通的函数可能看起来像这样：\n\n```\nint giveMeANNumber() {\n    return 10;\n}\n\
    ```\n\n或者\n\n```\nvoid sayHello() {\n    System.out.println(\"Hello\");\n}\n```\n\
    \n你不需要显式提供访问修饰符（access modifier），更多信息请参阅第4章的访问修饰符。但是，在声明函数时必须提供返回类型。返回类型指示函数是否应该返回数据，如果是，将返回什么类型的数据。你可以使用第3章中描述的任何原始类型作为返回类型，或者在不需要返回任何数据时使用\
    \ `void`。注意在第一个例子中，`giveMeANumber()` 函数体内有一个语句 - `return 10;`；`return` 是一个关键字，遇到它将退出函数并返回后续数据。如果你的函数类型不是\
    \ `void` ，你可以单独使用 `return` 关键字来退出 `void` 类型的函数，但这不是必须的。返回返回值时，它会返回到调用函数的地方。\n\n\
    ```\nprivate int giveMeANumber() {\n    return 10;\n}\n\nint number = giveMeANumber();\n\
    ```\n\n如你所见，要调用函数，我们只需要在想要调用的地方写它的名字。当机器解释这段代码时，它将引用该函数并执行其中的代码，然后返回原来的点并继续执行。\n\
    \n# 参数/变量\n\n有时，我们可能想给函数提供一些数据进行处理，为此我们使用参数（parameters），也称为变量（arguments）。根据需要给函数提供尽可能或尽可能少的参数，它们的类型有助于确定函数的签名。我们已经见过\
    \ `main()` 函数中的参数了，但让我们自己创建一些吧。\n\n```\nint multiplyBy(int number, int multiplier)\
    \ {\n    return (number*multiplier);\n}\n```\n\n这个整数函数将接受两个整数，将它们相乘并返回结果。记得第3章关于变量作用范围的小节吗？现在是时候把它回到脑海核心了。\n\
    \n假设我们有一个程序，其中有一个变量 `number` 和另一个 `multiplier`，并将传递给上面的函数，且它们使用了相同的变量名。\n\n```\n\
    class ScopeDemo {\n    //对整个程序可见\n    static int number=0;\n    static int multiplier=0;\n\
    \n    static int multiplyBy(int number, int multiplier) {\n        //局部变量 number,\
    \ multiplier\n        return (number*multiplier);\n    }\n\n    public static\
    \ void main(String[] args) {\n        number = 10;\n        multiplier = 10;\n\
    \n        System.out.println(multiplyBy(number, multiplier));\n    }\n}\n}//结束类\n\
    ```\n\n首先，请暂时忽略 `static` 关键字。所以这个程序将打印出 100，这应该是你预期的。如果我们把代码改成这样呢：\n\n```\nclass\
    \ ScopeDemo {\n    //对整个程序可见\n    static int number=0;\n    static int multiplier=0;\n\
    \n    static int multiplyBy(int number, int multiplier) {\n        //局部变量 number,\
    \ multiplier\n        return (number*multiplier);\n    }\n\n    public static\
    \ void main(String[] args) {\n        number = 10;\n        multiplier = 10;\n\
    \n        System.out.println(multiplyBy(number, multiplier));\n    }\n}\n```\n\
    \n执行后，你会发现输出是 80，且 `multiplyBy()` 函数没有碰到全局变量。尽管名字相同，事实依然如此。如果我们想在函数内部访问全局变量，我们就必须使用点符号法（dot\
    \ notation），如下：\n\n```\nclass ScopeDemo {\n    //对整个程序可见\nstatic int number=10;\n\
    static int multiplier=10;\n\nstatic int multiplyBy(int number, int multiplier)\
    \ {\n    //局部变量 number, multiplier\n    return (ScopeDemo.number*ScopeDemo.multiplier);\n\
    }\n\npublic static void main(String[] args) {\n    System.out.println(multiplyBy(8,\
    \ 10));\n}\n//结束类\n```\n\n代码中的此更改使得 `multiplyBy()` 函数通过点符号法直接引用全局变量。这导致无论传递什么值，`multiplyBy()`\
    \ 方法的输出都是 100。`ScopeDemo.number` 的意思是“从 ScopeDemo 类中获取变量 number”。尽管这在 OOP 中是不典型的。在第12章，我们将查看对象和\
    \ `this` 关键字作为解决此问题的替代方案。\n\n# 重载\n\n重载（Overloading）是一个描述同相同但签名不同的函数的术语。也称为方法重载或函数重载。在某些情况下会引起混淆，但在某些情况下它是一种非常有用的技术。例如，当你想要提供一个执行计算的方法，但你不确定参数是整数还是浮点数时，因此你兼顾了两种情况。参见下方的代码示例：\n\
    \n```\nclass ScopeDemo {\n    //对整个程序可见，全局变量\n    static int num1=10;\n    static\
    \ float num2=10.1F;\n\n    static int multiplyBy(int number) {\n        //局部变量\
    \ number, multiplier\n        return (number*10);\n    }\n\n    static float multiplyBy(float\
    \ number) {\n        return (number*10);\n    }\n\n    public static void main(String[]\
    \ args) {\n        System.out.println(\"int: \" + multiplyBy(num1));\n       \
    \ System.out.println(\"float: \" + multiplyBy(num2));\n    }\n} //结束类\n```\n\n"
