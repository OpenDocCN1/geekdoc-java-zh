  md: "# # Chapter 7: Functions\nWhat is a function?\n\nFunctions, also called methods\
    \ and less frequently routines, are reusable blocks of code which can be written\
    \ once and called from anywhere within your code. We've already been using a function,\
    \ main(). But that's not really something we have a choice over, it's kind of\
    \ essential and we can't avoid invoking the main() method whenever we want to.\
    \ A function is a core part of programming it aids readability by segmenting your\
    \ code, increases efficiency because you're not rewriting the same code over and\
    \ over again and subtly emphasizes the DRY (Don't Repeat Yourself!) ideology.\n\
    \nFunctions will serve any purpose you write them for. When writing a program,\
    \ you should take a step back and look at everything you need to do such as “ask\
    \ a user for their name”, “generate a random String\", “sort an array” etc. All\
    \ tasks within a program can be broken down and segmented into functions.\n\n\
    When you write a function, it's header is typically referred to as its signature.\
    \ The main() function signature, for example, is:\n\n```\nvoid main(String[] args)\n\
    ```\n\nand this means that you can't get and create another function with the\
    \ same signature - the name main and one argument of the type String[].\n\nThe\
    \ syntax of a function in Java is as follows:\n\n```\naccess-modifier return-type\
    \ name(parameters) {\n    //code here\n}\n```\n\nAn average function may look\
    \ something like this:\n\n```\nint giveMeANNumber() {\n    return 10;\n}\n```\n\
    \nor\n\n```\nvoid sayHello() {\n    System.out.println(\"Hello\");\n}\n```\n\n\
    You don't have to explicitly provide an access modifier, please refer to chapter\
    \ 4 on Access Modifiers for more information on this. You do, however, have to\
    \ provide a return"
