    \ this functionality in Chapter 8 and don't fancy repeating just yet!\n\n## Chapter\
    \ 13: Error Handling\n\nError handling is essential to any robust program. If\
    \ your program rolls over and dies (aka becomes unresponsive when it crashes or\
    \ just crashes) then it's not a very good program, let's be honest.\n\nNon-specific\
    \ to Java, there are three types of error one encounters. You compile errors which\
    \ prevent the program from being compiled - things like trying to use a variable\
    \ that doesn't exist, forgetting to end a line with a semi-colon or forgetting\
