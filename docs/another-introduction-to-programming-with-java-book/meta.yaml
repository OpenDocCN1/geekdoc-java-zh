  md: '# Primitive data types


    First of all, here''s a standard chart depicting primitive data types, examples
    of data stored within them and their limits in Java - there are 8 in total:


    | Type | Examples | Limits | Explanation |

    |---|---|---|--|

    | int (integer) | 1, 3, 5, 204, -19892 | -2³¹ to 2³¹-1 | A 32 bit signed integer
    |

    | byte | -128, 127 | -128-127 | 8 bit signed integer |

    | short | 328, -232, 232 | -32768-32767 | 16 bit signed integer |

    | long | 832, 3115,4851,-13515,-134 | -2⁶³ - 2⁶³ OR, in Java SE 8 and above, 0
    - 2⁶-¹ | a 64 bit signed integer but can also be used as a 64 bit unsigned integer
    in Java SE 8 and later |

    | float | 0.0102030f, 9.2384F | The limits of float and double exceed the scope
    of this chapter | single-precision 32 bit floating point number |

    | double | 3832.283828, 31.28383d | The limits of float and double exceed the
    scope of this chapter | double-precision 64 bit floating point number |

    | boolean | true, false | true, false | Represents a true/false condition |

    | char (character) | a, b, c, d, 1, e, k, m, z, 0 | \u0000-\ffff 0-65535 | single
    16 bit unicode character |


    Generally speaking, you''ll use int for integer type values - whole numbers, double
    for decimal numbers, char for single characters and boolean as a flag to determine
    a true/false'
