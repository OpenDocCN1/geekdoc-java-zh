    # # Chapter 14: Inheritance and Polymorphism


    Inheritance is a core feature of Object Oriented Programming. Think back to classes.
    Each class represents an object. Inheritance allows us to create a parent class
    which can pass on all methods and variables to child classes, similar to how a
    human parent would pass on DNA to their child. It is said that the child class
    inherits its parent''s members. Java tends to use the terms super class and subclass
    as opposed to parent class and child class respectively. I will probably use them
    interchangeably.'
