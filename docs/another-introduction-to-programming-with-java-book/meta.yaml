  md: '# Quick Overview


    I''m sure that I know what Java is and the applications of it, but if not - here''s
    a quick overview. Java is a programming language that first came to light in 1995.
    It takes much of its syntax from C and C++ and was created with the specific intention
    of eradicating as many implementation dependencies as possible. It is an object
    oriented language and is completely platform independent. This is because, unlike,
    say, a native C++ program source code directly into machine code, when Java is
    compiled the source is converted into class files containing byte code which is
    then interpreted by the Java Virtual Machine (JVM) on whatever platform the class
    file is run on. The drawbacks here, of course, are that interpreted programs run
    a little slower (although this is virtually unnoticeable with modern processing
    power) than native programs and the requirement of the Java Runtime Environment
    (JRE) to be installed on a target computer.


    Due to the flexibility of the JVM, Java is used anywhere from mobile phones and
    web applications to ATMs, banks and televisions. Java is quite a popular choice
    when developing client-server applications such as high throughput chat systems.'
  merge: -1
