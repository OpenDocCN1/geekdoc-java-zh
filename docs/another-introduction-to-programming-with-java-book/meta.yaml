    \ name, just the type, so we can save time for testing purposes:\n\n```java\n\
    class inheritanceTest {\n    public static void main(String[] args) {\n      \
    \  Cat dog = new Cat(4, \"blue\", true, \"brown\", 1);\n        System.out.println(\"\
    # legs: \" + dog.getNumOfLegs());\n        System.out.println(\"Eye color: \"\
