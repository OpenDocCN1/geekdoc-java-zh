    \ to Celsius or to Fahrenheit. A pretty basic program as far as programming goes,\
    \ it was one of the first real programs I wrote whilst and thoroughly enjoyed\
    \ the process of so I hope you feel the same.\n\nWithout further ado, let us begin!\n\
    \n```java\nimport java.util.Scanner;\n```\n\n```java\nclass IntermissionOne {\n\
    \n    //Create a scanner object to handle user input\n    static Scanner in =\
    \ new Scanner(System.in);\n\n    //main entry point method\n    public static\
    \ void main(String[] args) {\n        System.out.println(\"Simple Temperature\
    \ Converter\\n\");\n        getUserInput();\n    }\n\n    //convert fahrenheit\
    \ f to celsius\n    // temp (c) = (temp (f) - 32) * (5/9)\n    static double toCelsius(double\
    \ f) {\n        double celsius = (f - 32d) * (5d/9);\n        return celsius;\n\
    \    }\n\n    //convert celsius to farhenheit\n    // temp (f) = ((temp (c) x\
    \ (9/5)) + 32\n    static double toFahrenheit(double c) {\n        double fahrenheit\
