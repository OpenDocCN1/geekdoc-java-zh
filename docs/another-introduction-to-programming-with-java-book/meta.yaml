    \n接口（Interfaces）的命名基于类内部的方法可以与外部世界交互的想法。在 Java 中，接口与类相似，它们都可以声明方法和变量，但有一个区别。接口方法不能有方法体。当你在接口中声明方法时，只需编写方法签名并在结尾加上分号。没有起始大括号，中间也没有代码。\n\
