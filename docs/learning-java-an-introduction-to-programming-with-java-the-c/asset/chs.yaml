  到目前，你应该对多态的概念有了大致的理解。那么在面向对象编程（OOP）中，我们如何组织和使用这种多态属性呢？\n\n首先，多态与继承相关。而且，多态再次与方法重写（overriding）相关。因为如上面提到的，多态是指某个对象能够变成其他对象。因此，为了让一个对象变成某个对象，它必须是一个父对象。而为了让父对象在每情况下都是子对象之一，它必须定义方法供子类进行重写。这有助于系统在应用程序运行时确定实际运行的是哪些对象和方法。因此很多文档将多态称为“运行时多态”。\n\
  \n我们将通过下面的例子来使其更容易理解。这个例子非常简单。`Geometry` 类是父类，两个子类 `Circle` 和 `Rectangle` 都重写了父类的\
  \ `caculateArea()` 方法。\n\n![](img/Image00081.jpg)\n\n它们的代码也很简单，我们去除了所有其他无关内容，只关注重写的方法。\n\
  \n### `Geometry`\n```java\npublic class Geometry {\n    public void caculateArea()\
  \ {\n        System.out.println(\"Unknow shape\");\n    }\n}\n```\n\n### `Circle`\n\
  ```java\npublic class Circle extends Geometry {\n    @Override\n    public void\
  \ caculateArea() {\n        System.out.println(\"This is area of Circle\");\n  \
  \  }\n}\n```\n\n### `Rectangle`\n```java\npublic class Rectangle extends Geometry\
  \ {\n    @Override\n    public void caculateArea() {\n        System.out.println(\"\
  This is area of Rectangle \"); \n    }\n}\n```\n\n现在，多态的魔力在这里，请注意以下声明和使用上述重写方法的代码。\n\
  \n### `MainClass`\n```java\npublic class MainClass {\n    public static void main(String[]\
  \ args) { \n        Geometry geometry = new Geometry();\n        // 打印“Unknow Area”\
  \ \n        geometry.caculateArea();\n\n        // 有时，geometry 变成了另一种形状，这次是一个 Circle\
  \ \n        geometry = new Circle();\n        geometry.caculateArea(); // 这将打印“This\
  \ is area of Circle”\n\n        // 有时，geometry 变成了另一种形状，这次是一个 Rectangle \n     \
  \   geometry = new Rectangle();\n        geometry.caculateArea(); // 这将打印“This is\
  \ area of Rectangle”\n    }\n}\n```\n\n你看到，`Geometry` 对象本身有一个方法 `caculateArea()`。但与之前课程中使用的对象不同，之前当我们需要子类来执行面积计算时，我们会声明子类并调用子类上的重写方法。而在本节中，我们允许\
  \ `Geometry` 类充当子类，通过将对象重新初始化为其子类 `Geometry geometry = new Circle ()`，让它本身在那里作为子类。多态就在这里。\n\
  \n## • 在构建员工薪资应用中进行实践\n\n如果在上一节课中，我们为一家“大”公司构建了一个“复杂的”、“完整”工资系统。但那时候的代码并不非常实用，因为我们是“硬编码”的，预先知道了哪些是员工，谁是老板，谁是全职，谁是兼职，并声明了相应的\
  \ `FulltimeEmployee` 或 `ParttimeEmployee` 对象。因此，在本节课中，我们将完成上一节课的员工薪资计算应用，使系统更加真实。具体来说，在本节中，我们将让用户手动输入员工信息。因此程序中将有一个员工数组。`Employee`\
  \ 类将是使用多态属性的类，能够在每个特定情况下充当 `FulltimeEmployee` 或 `ParttimeEmployee`。\n\n### o 描述程序需求\n\
  \n工资程序的要求与上一节课没有变化。我刚才描述了。\n- 公司有两种类型的员工：全职员工和兼职员工。\n- 作为普通员工的全职员工每月获得 10M。作为老板的全职员工每月获得\
  \ 20M。\n- 全职员工如果任何某一天加班，无论职位如何，每天都将获得 800k。\n- 兼职员工无论职位如何，每小时只能赚 100k。多劳多得。\n\n\
  应用程序将允许用户输入员工的人数。然后对于每个员工，用户必须输入员工姓名、员工类型（全职或兼职）、全职员工是普通员工还是老板、是否有任何加班工作？你可以做多少小时季节性工作？最后根据这些信息，将显示所有员工的相应薪资界面。\n\
  \n### o 类图\n\n我们仍然依靠上一节课的类图。但对其进行修改，以便 `Employee` 类能在其子类中很好地“运行”。通过在类类中构造 `caculateSalary()`\
  \ 方法，那么在子类中将必须再次重写。\n\n![](img/Image00082.jpg)\n\n### o 构建类\n\n`Configs` 类没有变化。\n\
