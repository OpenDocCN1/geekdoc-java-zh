  \n### Geometry 类\n这是剩余类的超类，或者意味着最基础的类。由于它是一个基类，最好它包含对子类有用的属性或方法，或者说子类可以有效地继承这些值。例如，我将在这个类中声明常量\
  \ `PI`。`name` 属性是共享的，但将由子类根据它们的名称具体定义。`p`、`area`、`v` 是相同的，尽管它们是通用定义的，但子类将包含不同的值。此超类的方法也供子类使用，因此它们将具有特定的函数体，例如\
  \ `printName()` 将在控制台输出名称。或者 `printPerimeter()`、`printArea()`、`printVolume()` 将分别输出变量\
  \ `p`、`area`、`v`。\n\n### Circle 类\n`Geometry` 的子类。如你所知，`Circle` 将继承其父类的值。除了从父类获得的属性\
  \ `name`、`p`、`area`、`v` 之外，它还定义了自己的特殊属性 `radius`。你可以在 `Circle()` 构造函数中初始化 `Circle`\
  \ 的变量名。`enterRadius()`、`calculatePerimeter()`、`calculateArea()` 方法没有在父类中声明，由 `Circle`\
  \ 自己设计。\n\n### Cylinder 类\n这一层是 `Circle` 的子类，因为正如我上面提到的，`Cylinder` 有圆形面，这个圆形面与 `Circle`\
  \ 的属性没有区别，所以 `Circle` 应该是 `Cylinder` 的基类。因为 `Cylinder` 继承自 `Circle`，而 继承自 `Geometry`，所以\
  \ `Cylinder` 拥有 `Geometry` 和 `Circle` 的所有值。它只需要添加 `High` 属性以及自己的 `enterHeight()`、`calculateVolume()`\
  \ 方法。\n\n### Rectangle 和 Square\n`Rectangle` 和 `Square` 的关系类似。`Square` 类有一个特殊之处，即由于该形状的长和宽相等，正方形的\
  \ `enterSide()` 函数只需告诉用户输入一条边，然后你将相同的边值赋值给变量 `height` 和 `width`，`Square` 不需要再构建任何方法，完全是从其父类继承了完美的继承。\n\
