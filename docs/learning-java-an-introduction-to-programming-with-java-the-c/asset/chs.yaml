  \ this.coordinate.y = y;\n    }\n\n    public static class Coordinate {\n      \
  \  int x;\n        int y;\n        public void printInfo() {\n            System.out.println(\"\
  Shape: \" + name);\n            System.out.println(\"Coordinate: x = \" + x + \"\
  ; y = \" + y);\n        }\n    }\n}\n```\n\n\n\n\n正如你所见，由于 `Coordinate` 被定义为静态类，它只能访问绑定类的静态方法和属性。这与你学过的静态方法类似，静态方法只能调用声明为静态的属性。通过像这样声明\
  \ `Coordinate`，你仍然通过通常的 `Geometry` 对象来调用和使用它。\n\n```java\npublic class MainClass\
  \ {\n    public static void main(String[] args) {\n        Geometry geometry = new\
  \ Geometry(10, 20);\n        geometry.coordinate.printInfo();\n    }\n}\n```\n\n\
  或者，你也可以稍微不同的声明 `Coordinate`，这与上面将其声明为内部类时略有不同。\n\n```java\npublic class MainClass\
  \ {\n    public static void main(String[] args) {\n        Geometry.Coordinate coordinate\
  \ = new Geometry.Coordinate();\n        coordinate.printInfo();\n    }\n}\n```\n\
  \n尝试自己运行该应用程序，查看控制台打印的内容。\n\n## II. 我应该何时使用嵌套类及其用途是什么？\n\n根据我们对上述嵌套类的熟悉，我们已经有足够的经验来总结它的一些用途：\n\
  \n- 如果你有一个类 `A` 仅用于类 `B` 区域。即除了用户之外，没有其他人访问 `B`。那么你可能考虑组织 `B` 整合到类 `A` 中的方式。为了这种益处，你可以参考以下观点：\n\
  - 类的嵌套增加了数据封装性。例如，如果类 `B` 在类 `A` 中，你可以将 `B` 声明为 `private`，那么除了 `A` 之外，没有其他类可以知道\
  \ `B` 的存在及其值。可以说你从世界中“隐藏”了 `B`，除了 `A` ——\n- 反之。嵌套类 `B` 可以访问包装类 `A` 的所有成员（属性和方法），即使\
  \ `A` 的成员被声明为 `private`。当然，当有这样的嵌套类时，你的代码将更易于阅读（因为你不需要寻找和打开过多的类），从而更容易维护。\n\n###\
  \ 练习题 1\n\n我们通过这个练习来测试我们是否理解了课程。\n\n假设定义了以下包装类和嵌套类。\n\n```java\npublic class OuterClass\
  \ {\n    public void show() {\n        InnerClass innerClass = new InnerClass();\n\
  \        innerClass.show();\n    }\n\n    public class InnerClass {\n        public\
  \ void show() {\n            System.out.println(\"This is inner class\");\n    \
  \    }\n    }\n}\n```\n\n你尝试回答，使用如下 `main()` 方法中的代码，控制台的输出将会是什么：\n\n```java\npublic\
  \ class MainClass {\n    public static void main(String[] args) {\n        OuterClass\
  \ outerClass = new OuterClass();\n        outerClass.show();\n        InnerClass\
  \ innerClass = outerClass.new InnerClass();\n        innerClass.show();\n    }\n\
  }\n```\n\n**输出：**\n```\nThis is inner class\nThis is inner class\n```\n\n### 练习题\
  \ 2\n\n与练习 1 类似。假设你有有以下包装类和嵌套类的定义。\n\n```java\npublic class DateMonthYear {\n  \
  \  public int date, month, year;\n\n    public class HourMinuteSecond {\n      \
  \  public int hour, minute, second;\n        public void printInfo() {\n       \
  \     System.out.println(\"Date: \" + date + \"/\" + month + \"/\" + year);\n  \
  \          System.out.println(\"Time: \" + hour + \":\" + minute + \":\" + second);\n\
  \        }\n    }\n}\n```\n\n然后在 `main()` 方法中，我如下调用它们：\n\n```java\npublic class\
  \ MainClass {\n    public static void main(String[] args) {\n        DateMonthYear\
  \ date = new DateMonthYear();\n        date.date = 31;\n        date.month = 10;\n\
  \        date.year = 2017;\n        HourMinuteSecond time = date.new HourMinuteSecond();\n\
  \        time.hour = 10;\n        time.minute = 15;\n        time.second = 30;\n\
  \        time.printInfo();\n    }\n}\n```\n\n尝试回答控制台的输出是什么。答案在这里：\n```\nDate: 31/10/2017\n\
  Time: 10:15:30\n```\n\n这仅仅是嵌套类的知识。当你大量使用 Java 语言、阅读他人的代码或使用 Android 编程时，你会习惯使用这种嵌套类。\n\
  \n# 第 32 节：匿名类\n\n我们将带来一种更有趣的方式来在 Java 中使用类和对象。通过本节，你将学会并不总是需要声明一个显式类然后通过该类的对象声明来使用它。你可以从类中创建方便的对象，而没人知道该对象属于哪个类。\n\
  \n在本节之后，你将知道如何以更灵活、简洁的方式在 Java 中使用类，如果你觉得熟悉，理解起来会更容易。我们邀请你加入本节。\n\n## I. 什么是匿名类？\n\
  \n`Anonymous Class`，英语中称为 `Anonymous Class`，或者更地称为其全称 `Anonymous Inner Class`（匿名内部类）。当然，一个类被称为匿名类意味着它将没有特定的名称。匿名类将包含继承（包括从普通父类或抽象超类的继承），并附加到接口。由于匿名类也被称为匿名内部类，它也对嵌套类有一点点了解。所以，让我们发现匿名类究竟是什么，以及为什么涉及这么多知识。\n\
  \n## II. 识别匿名类\n\n你可以看到这一部分是在说论匿名类的语法。它将帮助你识别什么是正常声明的类，什么是匿名类。由于匿名类没有某些共同点，所以我们讨论的不是语法，而是识别。\n\
  \n你们都知道，要创建一个特定的类，你必须用 `class` 关键字声明该类，显然，然后你必须给它命名，就像你们在第一几节关于 OOP 中学的那样。\n\n```java\n\
  class class {\n    properties;\n    methods;\n}\n```\n\n从上面的类声明中，你以后将使用 `new` 关键字创建类的对象。\n\
  \n至于匿名类，你不需要声明类，但仍然可以创建它的对象。这听起来很模糊，没有类，对象将在哪里创建？首先，请看下面的匿名类的“语法”。通过编写以下内容，你将创建一个名为\
  \ `employee` 的对象，所以这个对象将是从某个类创建的，是 Employee 类？\n\n```java\nEmployee employee = new\
  \ Employee () {\n    properties;\n    methods;\n}\n```\n\n我想说匿名类是在某处。上面的例子是匿名类是一个带有属性和方法的代码块，在此之前。总结来说，如果你问\
  \ `employee` 是来自哪个类，答案只能是 `Anonymous`。\n\n如果你仍然完全理解匿名类的概念，可以阅读下面的内容，我将更具体地介绍。\n\n\
  ## III. 我应该何时使用匿名类？\n\n根据上面的观点，我想总结一下。匿名类通常用于你不想具体地声明某个类的子类（包括抽象类和普通的普通类），即使你不想具体地声明某个接口的实现类，但仍然想使用它们的对象。绕圈子说话就是如此。在这里我想给出一个使用匿名类的示例，让你更容易理解。\n\
  \n### 匿名类构建练习\n\n这个练习通过一个名为 `Geometry` 的内置接口帮助你理解什么是匿名类。我想回到声明你已知的接口的练习，首先创建一个名为\
  \ `Geometry` 的接口，这段代码与匿名类无关。\n\n```java\ninterface Geometry {\n    float PI = 3.14f;\n\
  \    void enterRadius(float radius);\n    float calculatePerimeter();\n    float\
  \ calculateArea();\n    void printInfo();\n}\n```\n\n有了上面的 `Geometry` 接口，如果用正常方式，你可以声明一个名为“具名”的类\
  \ `Circle`。这个 `Circle` 类实现了 `Geometry` 接口的抽象方法如下：\n\n```java\npublic class Circle\
  \ implements Geometry {\n    protected String name;\n    protected float radius;\n\
  \    // 构造函数\n    public Circle(float radius) {\n        this.name = \"Circle\"\
  ;\n    }\n}\n```\n\n\n\n\n```java\nthis.radius = radius; }\n\n@Override\npublic\
  \ void enterRadius(float radius) { \n    this.radius = radius;\n}\n\n@Override\n\
  public float calculatePerimeter() { \n    return 2 * PI * radius;\n}\n\n@Override\n\
  public float calculateArea() { \n    return PI * radius * radius; \n}\n\n@Override\n\
  public void printInfo() {\n    System.out.println(name);\n    System.out.println(\"\
  Perimeter: \" + calculatePerimeter());\n    System.out.println(\"Area: \" + calculateArea());\
  \ \n}}\n```\n\n继续下去，如果我们想使用上面的 `Circle` 类，我们将像往常一样声明对象并调用它。\n```java\npublic static\
  \ void main(String[] args) { \n    Circle circle = new Circle(10); \n    circle.printInfo();\n\
  }\n```\n\n你声明了一个名为 `Circle` 的类，这意味着你绝对已经声明了一个具名的类。现在我们来讨论如何使用声明任何 `Circle` 类，但你的你的父类。所以，忘记上面声明\
  \ `Circle` 类的语句，但现在使用它，并且对象始终在下面的代码中初始化。\n\n即匿名类。首先，你仍然需要 `Geometry` 接口作为基础：\n```java\n\
  public static void main(String[] args) {\n    Geometry randomShape = new Geometry()\
  \ { \n        protected float radius;\n\n        @Override\n        public void\
  \ enterRadius(float radius) { \n            this.radius = radius;\n        }\n\n\
  \        @Override\n        public float calculatePerimeter() { \n            return\
  \ 2 * PI * radius;\n        }\n\n        @Override\n        public float calculateArea()\
  \ { \n            return PI * radius * radius; \n        }\n\n        @Override\n\
  \        public void printInfo() {\n            System.out.println(\"Nameless Shape\"\
  );\n            System.out.println(\"Perimeter: \" + calculatePerimeter());\n  \
  \          System.out.println(\"Area: \" + calculateArea()); \n        }\n    };\n\
  \    randomShape.enterRadius(10); \n    randomShape.printInfo(); \n}\n```\n\n通过上面的代码，你必须密切注意，代码的副作用会让那些不熟悉它的人感到眼花。你看，通过声明\
  \ `Geometry randomShape = new Geometry {…}`，这个声明显然会创建一个对象 `randomShape`，但你知道 `randomShape`\
  \ 并不是从 `Geometry` 创建的对吧。这很容易解释，因为 `Geometry` 是一个接口，你已经知道接口不能用来创建对象！！！所以 `randomShape`\
  \ 是从一个匿名类创建的对象，这个匿名类通过它的代码块完全实现了接口 `Geometry`。上面方法中的后续几行代码是使用 `randomShape` 对象输入信息并将其输出到控制台，产生与不使用上面的匿名类相同的结果。你试一试。\n\
  \n## IV. 匿名类\n\n你已经很好地了解并理解了匿名类，对吧？为了方便检测和并将匿名类应用到现实中，我想总结一下匿名类的分类。\n\n### 1. 通过继承另一个类创建的匿名类\n\
  如果你有一个类，无论是普通类还是抽象类。那么，与其用一个特定的名称声明它的子类，你可以声明一个匿名的子类。你需要如下所示所示继承系统的 `Thread` 类。\n\
  ```java\npublic static void main(String[] args) {\n    // 匿名类示例 // 通过继承 Thread 类创建\n\
  \    Thread t = new Thread() { \n        @Override\n        public void run() {\n\
  \            System.out.println(\"You can test this code\"); \n        }\n    };\n\
  \    t.start();\n}\n```\n\n这个例子对你来说可能并不。你声明的对象 `t` 不是 `Thread` 类的对象，而只是继承自 `Thread`\
  \ 的匿名类对象。\n\n### 2. 通过实现另一个接口创建的匿名类\n这一部分与上面的课程示例类似。由于你有一个接口，与其从这个接口声明显式实现，你可以应用匿名类。下面的示例将从一个名为\
  \ `Runnable` 的接口部署。你将在以后关于多线程的课程中熟悉这段代码。\n```java\npublic static void main(String[]\
  \ args) { \n    // 匿名类的创建 // 通过实现接口 Runnable 创建\n    Runnable r = new Runnable()\
  \ { \n        @Override\n        public void run() {\n            System.out.println(\"\
  You can test this code \"); \n        }\n    };\n    Thread t = new Thread(r);\n\
  \    t.start();\n}\n```\n\n### 3. 匿名类作为参数传递\n下面的示例显示，与其将 `r` 传递给 `Thread()` 的构造函数，你可以创建一个匿名类作为参数，而不是声明\
  \ `r`。\n```java\npublic static void main(String[] args) { \n    // 匿名类的创建 // 作为传递的参数\n\
  \    Thread t = new Thread(new Runnable() {\n        @Override\n        public void\
  \ run() {\n            System.out.println(\"You can test this code\"); \n      \
  \  }\n    });\n    t.start();\n}\n```\n\n## V. 匿名类的特征\n\n下面我们将总结匿名类的一些难忘的特征。由于匿名类因其可用性会被频繁使用，你也应该尝试记住这些特征。\n\
  \n- 如果一个普通类可以实现你喜欢的多个接口，那么匿名类只能从一个接口部署。\n- 如果一个普通类既可以继承某个类又能从许多其他接口部署，那么匿名类只能选择继承或实现另一个类或接口。\n\
  - 对于普通类，你可以定义任意的构造函数。但匿名类没有任何构造函数。这很容易理解，因为构造函数必须与类名相同，但匿名类没有名字，所以你永远为它定义构造函数。\n\
  - 并且由于匿名类是在另一个类内部声明的，它与内部类有相似之处，在于它可以访问其包装类的成员。\n\n以上是与匿名类相关的知识。希望读完这节课后，你们中的许多人会大喊到直到为止这种类型一直被称为这种名称。因为我以前也是这样的。\n\
  \n\n\n\n\n关于不可变值，在第 13 节关于 `Immutable` 的知识中，被称为 `Immutable`。此外，`Wrapper` 类是 `final`\
  \ 类，因此你无法创建它们的子类。\n\n## II. 为什么要使用包装类？\n\n首先，这最根本的一点是，`Wrapper` 类帮助我们现在原始数据类型和对象数据类型之间转换，反之亦然。\n\
  \n你可以通过下面的示例看到使用原始数据类型及其包装类型的例子。\n\n```java\nint a = 20; // a 是原始数据类型 int 的变量\n\
  Integer i = Integer.valueOf(a); // i 是数据类型 Integer 的变量，由原始变量 a 创建\n```\n\n如你所见，变变量\
  \ `a` 的类型是 `int`，而变量 `i` 的类型是 `Integer`。关于这个问题的下一点是，对于原始数据类型，你只有一个选择：创建一个变量并使用它的值（如果你不赋值，它仍然创建一个变量。关于默认值，你可以复习原始数据类型）。对于对象类型，它的默认值是\
  \ `null`，这个 `null` 值在某些情况下可以利用，例如表示没有意义。此外，对象类型还带有许多实用的方法，丰富了数据类型的适用性。\n\n此外，Java\
  \ 语言中的其他构造（例如我们将会熟悉的列表构造，如 `ArrayList` 或 `Vector`）包含了对象数据类型的集合而不是原始类型，因此了解和操作 `Wrapper`\
  \ 类是必须的。此外，对象数据类型更适合实现多线程和同步，我们将在另一节课中讨论。\n\n## III. 在原始类型和包装类之间切换\n\n### 1. 将原始样式转换为包装样式\n\
  \n将原始类型转换为其包装样式被称为 `Boxing`（装箱）。并不是为了装箱。这里的 Boxing 是为了装箱，意味着将原始数据封装到它的包装箱中。就像你上面看到的示例，当一个\
  \ `int a` 被转换为 `Integer i` 时。你可以通过 `Wrapper` 构造函数进行装箱。\n\n```java\n// 装箱的类型\nint\
  \ a = 500;\nInteger i = new Integer(a);\nInteger j = new Integer(500);\nFloat f\
  \ = new Float(4.5);\nDouble d = new Double(5);\nCharacter ch = new Character('a');\n\
  Boolean b = new Boolean(true);\n```\n\n或者可以直接将原始值赋值给包装类，这种方式也称为 `Autoboxing`（自动装箱），意味着系统会自动转换。\n\
  \n```java\n// 自动装箱的类型\nint a = 500;\nInteger i = a;\nInteger j = 500;\nFloat f =\
  \ 4.5f;\nDouble d = 5d;\nCharacter ch = 'a';\nBoolean b = true;\n\n// 这也是你在学习集合\
  \ 章节时会知道的一种自动装箱\nArrayList<Integer> arrInt = new ArrayList<Integer>();\narrInt.add(25);\n\
  ```\n\n### 2. 将包装类转换为原始样式\n\n与上述相反，当从包装类型切换到其原始类型时，被称为 `Unboxing`（拆箱），意味着打开箱子，即打开包装箱以取出原始数据。你可以通过\
  \ `xxxValue()` 方法执行拆箱。其中 `xxx` 代表每种数据类型，如下例所示。\n\n```java\nint a = 500;\nInteger\
  \ i = a; // 自动装箱\nint i2 = i.intValue(); // 拆箱\nInteger j = 500; // 自动装箱\nint j2\
  \ = j.intValue(); // 拆箱\nFloat f = 4.5f; // 自动装箱\nfloat f2 = f.floatValue(); //\
  \ 拆箱\nDouble d = 5d; // 自动装箱\ndouble d2 = d.doubleValue(); // 拆箱\nCharacter ch =\
  \ 'a'; // 自动装箱\nchar ch2 = ch.charValue(); // 拆箱\nBoolean b = true; // 自动装箱\nboolean\
  \ b2 = b.booleanValue(); // 拆箱\nArrayList<Integer> arrInt = new ArrayList<Integer>();\n\
  arrInt.add(25);\nint arr0 = arrInt.get(0).intValue(); // 拆箱\n```\n\n与自动装箱类似，拆箱技术也可以这样写：\n\
  \n```java\nint a = 500;\nInteger i = a;\nint i2 = i.intValue();\nInteger j = 500;\n\
  int j2 = j.intValue();\nFloat f = 4.5f;\nfloat f2 = f.floatValue();\nDouble d =\
  \ 5d;\ndouble d2 = d.doubleValue();\nCharacter ch = 'a';\nchar ch2 = ch.charValue();\n\
  Boolean b = true;\nboolean b2 = b.booleanValue();\nArrayList<Integer> arrInt = new\
  \ ArrayList<Integer>();\narrInt.add(25);\nint arr0 = arrInt.get(0).intValue();\n\
  ```\n\n## IV. 包装类的实用方法\n\n上面，我说过 `Wrapper` 类帮助创建仅包含数据的原始数据类型，使其变成一个具有更多实用方法的对象。在这里我将列出它们的实用方法以供参考。\n\
  \n### 1. `parsexxx()`\n\n传递给这个静态方法的参数是一个字符串，结果是与该字符串对应的原始值。\n\n```java\nint i =\
  \ Integer.parseInt(\"10\");\nfloat f = Float.parseFloat(\"4.5\");\nboolean b = Boolean.parseBoolean(\"\
  true\");\nSystem.out.println(i);\nSystem.out.println(f);\n```\n\n#### 2. `toString()`\n\
  \n`toString()` 方法返回字符串表示。\n\n```java\nString sI = Integer.toString(10);\nSystem.out.println(sI);\n\
  ```\n\n### 3. `xxxValue()`\n\n`xxxValue()` 方法将包装类转换为原始类型。`xxx` 代表每种数据类型，如下例所示。\n\
  \n```java\nInteger i = 500;\nint a = i.intValue();\nInteger j = 500;\nint j2 = j.intValue();\n\
  Float f = 4.5f;\nfloat f2 = f.floatValue();\nDouble d = 5d;\ndouble d2 = d.doubleValue();\n\
  Character ch = 'a';\nchar ch2 = ch.charValue();\nBoolean b = true;\nboolean b2 =\
  \ b.booleanValue();\n```\n\n### 4. `compareTo()`\n\n`compareTo()` 方法比较两个包装类的值。它返回一个整数：如果第一个对象小于第二个对象，则返回负整数；如果第一个对象等于第二个对象，则返回零；如果第一个对象大于第二个对象，则返回正整数。\n\
  \n```java\nInteger i = 50;\nInteger i1 = Integer.parseInt(\"50\");\nInteger i2 =\
  \ Integer.valueOf(52);\nSystem.out.println(i.compareTo(i1)); // 输出 0\nSystem.out.println(i.compareTo(i2));\
  \ // 输出负数\n```\n\n### 5. `compare()`\n\n`compare()` 是一个静态方法，用于比较两个原始值。它与 `compareTo()`\
  \ 类似，但它可以直接通过类调用。\n\n```java\nSystem.out.println(Integer.compare(50, 52)); // 输出负数\n\
  ```\n\n### 6. `equals()`\n\n`equals()` 方法比较两个包装类的值。它返回一个布尔类型。\n\n```java\nInteger\
  \ i1 = Integer.parseInt(\"50\");\nInteger i2 = Integer.valueOf(50);\nSystem.out.println(i1.equals(i2));\
  \ // 输出 true\n```\n\n\n\n\n```java\nFloat f1 = new Float(\"20.25f\"); Float f2 =\
  \ new Float(\"2.43f\");\nSystem.out.println(\"Compare f1 & f2: \" + f1.equals(f2));\n\
  ```\n控制台的输出为。\n```\nCompare f1 & f2: false\n```\n```\nCompare i1 & i2: true\nCompare\
  \ f1 & f2: false\n```\n\n### 练习 1\n尝试执行以下代码，并找出为什么打印到控制台的数据是那样。\n```java\nint i\
  \ = Integer.parseInt(\"10\");\nfloat f = Float.parseFloat(\"4.5a\");\nSystem.out.println(i);\n\
  System.out.println(f);\n```\n\n### 练习 2\n请指出下面行代码在控制台的输出。\n```java\nint i = Integer.parseInt(\"\
  10.5\");\nSystem.out.println(i);\n```\n\n### 练习 3\n除了我上面列出的包装类（Wrapper classes）的实用方法外，请你自己查找其他方法，它们与我提到的一样有用。例如：\n\
  - `Integer`、`Long`、`Float` 和 `Double` 类的静态方法：`toHexString()`，`toOctalString()`，`toBinaryString()`，`max()`，`min()`，\
  \ ...\n- `Character` 类的静态方法：`isLowerCase()`，`isUpperCase()`，`isDigit()`，`toLowerCase()`，`toUpperCase()`，\
  \ ...\n\n通过这节课，你学习了 Java 中的基本数据类型是如何被包装类“封装”的，使得它们变得更加多样和方便。这节课带我们回到过去，增加了一些当时课程中相当“原始”的知识。当我们仍然熟悉\
  \ Java 基本数据类型时，过去就在这里。现在你知道 Java 有 8 种基本类型，包括 `int`、`short`、`long`、`byte`、`float`、`double`、`char`\
  \ 和 `boolean`。你可以回顾第 4 节以获取关于这些数据类型的更多信息。你将会熟悉被称为 `Wrapper` 的类。让我们看看这些类为上述基本数据类型添加了什么内容。\n\
  \n### V. 熟悉包装类\n`Wrapper` 类实际上是许多不同类的泛指名称。由于本节课中的所有类具有相同的功能，我们统称为 `Wrapper`。\n\n\
  而且，正如我所说，Java 有 8 种基本数据类型，因此每种基本类型也有对应的 8 种包装类。这些包括：\n- `Byte` 类是 `byte` 数据类型的包装类。\n\
  - `Short` 类是 `short` 数据类型的包装类。\n- `Integer` 类是数据类型 `int` 的包装类。\n- `Long` 类是 `long`\
  \ 数据类型的包装类。\n- `Float` 类是 `float` 数据类型的包装类。\n- `Double` 类是 `double` 数据类型的包装类。\n\
  - `Character` 类是 `char` 数据类型的包装类。\n- `Boolean` 类是 `boolean` 数据类型的包装类。\n\n如你所见，每个基本数据类型的包装类都是一个封装了其所支持的基本类型的对象。换句话说，每个包装类内部都包含一个基本类型。而且，包装类有助于构建其他方法来弥补原始基本类型的简单性。你可以记住的一点是，正如你已经对\
  \ `Strings` 的了解一样，包装类也是不可变值类，在本节课中称为 `Immutable`。此外，`Wrapper` 类是 `final` 类，因此你不能创建它们的子类。\n\
  \n### VI. 为什么要使用包装类？\n首先，这最根本的一点是，包装类帮助我们在基本数据类型和对象数据类型之间转换，反之亦然。\n\n你可以看到使用基本数据类型及其包装类型的示例下。\n\
  ```java\nint a = 20; // a 是基本数据类型 int 的变量\nInteger i = Integer.valueOf(a); // i\
  \ 是数据类型 Integer 的变量，由基本变量 a 创建\n```\n如你所见，变量 `a` 的类型是 `int`，变量 `i` 的类型是 `Integer`。这个问题的下一个关键点是，对于基本数据类型，你只有一种选择：创建一个变量然后使用它的值（如果你不赋值，它仍然会创建一个带有默认值的变量）。对于对象类型，它的默认值是\
  \ `null`，这个 `null` 值在某些情况下是可以利用的，例如表示没有意义。此外，对象类型还携带了许多实用的方法，丰富了数据类型的适用性。此外，Java\
  \ 语言中的其他一些结构，例如我们将熟悉的列表结构（如 `ArrayList` 或 `Vector`），包含对象数据类型的集合而不是基本类型，因此知道并操作包装类是必须的。此外，对象数据类型更适合实现多线程和同步，我们将在另一节课中讨论。\n\
  \n### VII. 在基本类型和包装类之间切换\n\n#### 1. 将原始转换为包装样式\n将基本类型转换为其包装样式被称为 `装箱`（Boxing）。这里的装箱是指装箱，意味着将原始数据封装进它的包装盒中。就像你上面看到的示例，当一个\
  \ `int a` 转换为 `Integer i` 时。你可以通过包装类的构造函数进行装箱。\n\n```java\n// 装箱的类型\nint a = 20;\n\
  Integer i = new Integer(a);\nInteger j = new Integer(500);\nFloat f = new Float(4.5);\n\
  Double d = new Double(5);\nCharacter ch = new Character('a');\nBoolean b;\n```\n\
  或者直接将基本值赋值给包装类，这种方式被称为自动装箱，意味着系统会自动转换。\n```java\n// 装箱的类型\nint a = 20;\nInteger\
  \ i = a;\nInteger j = 500;\nFloat f = 4.5;\nDouble d = 5;\nCharacter ch = 'a';\n\
  Boolean b = true;\n```\n\n#### 2. 将包装转换为原始样式\n与上述相反，从包装类型切换到其基本类型被称为 `拆箱`（Unboxing），意味着打开盒子，从包装盒中取出基本类型。你可以通过\
  \ `xxxValue()` 方法进行拆箱。`xxx` 代表每种类型的数据，如下所示。\n\n```\nint a = 500;\nInteger i = a;\
  \ // 自动装箱\nint i2 = i.intValue(); // 拆箱\n\nInteger j = 500; // 自动装箱\nint j2 = j.intValue();\
  \ // 拆箱\n\nFloat f = 4.5; // 自动装箱\nfloat f2 = f.floatValue(); // 拆箱\n\nDouble d\
  \ = 5; // 自动装箱\ndouble d2 = d.doubleValue(); // 拆箱\n\nCharacter ch = 'a'; // 自动装箱\n\
  char ch2 = ch.charValue(); // 拆箱\n\nBoolean b = true; // 自动装箱\nboolean b2 = b.booleanValue();\
  \ // 拆箱\n\nArrayList<Integer> arrInt = new ArrayList<Integer>();\narrInt.add(25);\
  \ // 自动装箱\nint arr0 = arrInt.get(0).intValue(); // 拆箱\n```\n类似于自动装箱，拆箱技术也可以这样写。\n\
  ```java\nint a = 500;\nInteger i = a;\nint i2 = i; // 拆箱\n\nInteger j = 500;\nint\
  \ j2 = j; // 拆箱\n\nFloat f = 4.5;\nfloat f2 = f; // 拆箱\n\nDouble d = 5;\ndouble\
  \ d2 = d; // 拆箱\n\nCharacter ch = 'a';\nchar ch2 = ch; // 拆箱\n\nBoolean b = true;\n\
  boolean b2 = b; // 拆箱\n\nArrayList<Integer> arrInt = new ArrayList<Integer>();\n\
  arrInt.add(25);\nint arr0 = arrInt.get(0); // 拆箱\n```\n\n### VIII. 包装类的辅助方法\n如上所述，我提到过包装类有助于创建只包含数据的新类型，使其变成更多实用方法的对象。在这里我将列出它们的实用方法供你参考。\n\
  \n#### 1. parseXxx ()\n传递给此静态方法的参数是一个字符串，结果是与所传字符串对应的基本值。\n```java\nint i = Integer.parseInt(\"\
  10\");\nfloat f = Float.parseFloat(\"4.5\");\nboolean b = Boolean.parseBoolean(\"\
  true\");\n```\n你也可以猜出上述代码在控制台的输出，对吧？\n\n\n\n\n\n#### 2. `toString()`\n与 `Object`\
  \ 类的静态方法 `toString()` 不同，`Wrapper` 类的这个 `toString()` 必须返回与传入的原始数据类型值对应的字符串。此示例以\
  \ `Integer` 类为例，其他的 `Wrapper` 类也类似。\n\n```java\nString sI = Integer.toString(10);\n\
  System.out.println(sI);\n```\n控制台的输出是字符串 `\"10\"`。\n\n### 3. `xxxValue()`\n你对这个方法已经熟悉了。具体来说，这类类型的方法有助于将\
  \ `Wrapper` 类的值转换为原始数据类型（拆箱）。有时该方法还能帮助转换数据类型，就像你显式强制转换值一样。你可以通过查看下面的示例更更容易地理解。\n\
  \n```java\nDouble d = 50.5;\nint i = d.intValue();\nbyte b = d.byteValue();\nSystem.out.println(d);\n\
  System.out.println(i);\nSystem.out.println(b);\n```\n控制台的输出分别为 `50.5`、`50` 和 `50`。\n\
  \n### 4. `compareTo()`\n如果你还记得，在字符串课程中我们也涵盖了用于比较两个字符串之间值的 `compareTo()` 方法。因此，对于我们熟悉的这些\
  \ `Wrapper` 类，它的功能仍然完全适用。也就是说，该方法将用于比较两个 `Wrapper` 类（相同数据类型）的两个值。具体来说，当你调用 `lopWrapper1.compareTo(lopWrapper2)`\
  \ 时，结果如下：\n\n- 如果方法的结果返回负数，则 `lopWrapper1` 的值小于 `lopWrapper2`。\n- 如果方法的结果返回 `0`，则\
  \ `lopWrapper1` 等于 `lopWrapper2`。\n- 如果方法的结果返回正数，则 `lopWrapper1` 的值大于 `lopWrapper2`。\n\
  \n你可以查看下面的示例以更好地理解。\n\n```java\nInteger i = 50;\nInteger i1 = Integer.parseInt(\"\
  50\");\nInteger i2 = Integer.valueOf(52);\nInteger i3 = 30;\nSystem.out.println(\"\
  CompareTo i & i1: \" + i.compareTo(i1));\nSystem.out.println(\"CompareTo i & i2:\
  \ \" + i.compareTo(i2));\nSystem.out.println(\"CompareTo i & i3: \" + i.compareTo(i3));\n\
  ```\n控制台的输出将是：\n```\nCompareTo i & i1: 0\nCompareTo i & i2: -1\nCompareTo i & i3:\
  \ 15\n```\n\n### 5. `compare()`\n该方法的用法与上述 `compareTo()` 。区别在于它是每个 `Wrapper` 类的静态方法，因此你可以直接从类调用它。同时，传递的参数是两个\
  \ `Wrapper` 类的两个值。`compare()` 的返回值与上面的 `compareTo()` 一样，也是三个值之一（负数、`0`、正数）。\n\n\
  ```java\nInteger i1 = Integer.parseInt(\"50\");\nInteger i2 = Integer.valueOf(52);\n\
  System.out.println(\"Compare i1 & i2: \" + Integer.compare(i1, i2));\n\nFloat f1\
  \ = new Float(\"20.25f\");\nFloat f2 = new Float(\"2.43f\");\nSystem.out.println(\"\
  Compare f1 & f2: \" + Float.compare(f1,f2));\n```\n控制台的输出是：\n```\nCompare i1 & i2:\
  \ -1\nCompare f1 & f2: 1\n```\n\n### 6. `equals()`\n类似于比较字符串时的 `equals()`，此方法将比较\
  \ `Wrapper` 类的值的值并返回一个布尔类型，其中 `true` 表示相等，`false` 表示不同。如下例所示。\n\n```java\nInteger\
  \ i1 = Integer.parseInt(\"50\");\nInteger i2 = Integer.valueOf(50);\nSystem.out.println(\"\
  Compare i1 & i2: \" + i1.equals(i2));\n\nFloat f1 = new Float(\"20.25f\");\nFloat\
  \ f2 = new Float(\"2.43f\");\nSystem.out.println(\"Compare f1 & f2: \" + f1.equals(f2));\n\
  ```\n控制台的输出是：\n```\nCompare i1 & i2: true\nCompare f1 & f2: false\n```\n\n#### 练习题\
  \ 1\n尝试执行以下代码，并尝试找出为什么控制台打印的数据是那样的。\n\n```java\nint i = Integer.parseInt(\"10\"\
  );\nfloat f = Float.parseFloat(\"4.5a\");\nSystem.out.println(i);\nSystem.out.println(f);\n\
  ```\n\n#### 练习题 2\n请指出以下行代码的控制台输出结果。\n\n```java\nint i = Integer.parseInt(\"10.5\"\
  );\nSystem.out.println(i);\n```\n\n#### 练习题 3\n除了我列出的 `Wrapper` 类有用方法外，请你自己寻找其他方法，它们与我提到的一样有用。例如：\n\
  - `Integer`、`Long`、`Float` 和 `Double` 类的静态方法：`toHexString()`、`toOctalString()`、`toBinaryString()`、`max()`、`min()`。\n\
  - `Character` 类的静态方法：`isLowerCase()`、`isUpperCase()`、`isDigit()`、`toLowerCase()`、`toUpperCase()`……\n\
  \n通过本节，你学习了 Java 中的原始数据类型是如何被 `Wrapper` 类“包裹”，从而使它们变得更加多样和方便。\n\n---\n\n# 第 34 节：异常\
  \ (部分 1)\n\n在开始详细讲解课程之前，我想让你知道，生活中没有人是完美的。当人变得足够老时，他们会开始犯错。生活中重要的一点不是你总是避免错误（因为，坦率地说，没有人想去添麻烦），而是学习如何克服错误。噢，为什么这节课这么哲学？实际上，我只是为了好玩稍微发挥一下。这节课的核心思想几乎相同：我们将严肃且深入地考虑我们编写的代码中出现的错误方面。\n\
  \n回到刚才那一点点哲学，当我们的应用程序足够大时（从代码行数和功能来说），要控制应用程序逻辑的稳定性确实是很困难的。当错误发生时，一个微小的错误会导致系统向用户发出一些奇怪的消息，导致他们恐慌；更严重的错误会导致应用程序意外终止。正如上面的哲学一样，你并不预期的错误会发生，但你应该理解并区分\
  \ Java 中的错误类型，以便为应用程序提供强大的脚本来克服错误，而不是直接终止，至少报告清晰的错误状态，而不是让它们失去对功能的控制。我们讨论的错误在 Java\
  \ 中被称为 `Exception`。由于其重要性，这个问题将在许多不同的章节中讨论。邀请你熟悉关于这种 `Exception` 系列的第一集。\n\n## I.\
  \ 异常概念\n\nExceptions 可以翻译为“异常”。为什么我们说 Exception 而不是 Error？Exception 实际上包含了 Error。Exception\
  \ 是用于描述应用程序逻辑受到某些问题（无论是错误还是其他）以坏的方式影响的影响的概念。当异常发生时，它会导致程序偏离我们编写的标准线程，导致应用程序无法处理其逻辑，或者可能突然中断（这种状态可以被称为“死亡”、“猝死”或“崩溃”）。异常是以一种意想不到的方式发生的。即使你已经仔细准备了各种情况，流偏离仍然潜伏着。你可以通过下面的示例更清楚地看到危险的来源：\n\
  \n当用户向应用程序输入错误数据时，可能会发生异常。无论是无意还是故意。正如上一个练习的练习 1，如果你想要程序一个实数，用户输入了 `!?!`。或者当应用程序查找并读取一个文件时，找不到该文件。也许该文件已经被删除了。\n\
  \n\n\n\n\n- 或者当应用程序运行时内存耗尽，导致应用程序无法执行其逻辑。许多其他情况也是如此。简而言之，正如我所说，`Exception`（异常）可以由某些错误产生，例如程序员的代码错误或用户输入错误。异常也产生于非错误的情况，例如内存耗尽、网络连接断开、如意外的用户干预等……你必须理解为什么它被称为\
  \ `Exception`（异常），对吧？为了更清楚地理解，我们来看看分类了哪些类型的异常。\n\n## II. 异常分类\n\n为了理解并方便地使用 `Exception`，Java\
  \ 将其分为以下 3 类。\n\n### 1. 检出异常 (Checked Exception)\n这些异常是无法通过编译器“门槛”的异常。也就是说，当编译器发现你正在编写某些可能发生异常的代码行时，你会从编译器那里获得错误信息。因为编译器已经为你发现了异常，所以它的名字是\
  \ `Checked`（检出的），意思是“受监管的”。\n\n如果你想尝试一下编译器，特别是 Eclipse，请尝试在 `main` 方法中输入以下命令。你不需要知道这些代码行的具体含义，只需尝试输入，并确保导入了\
  \ `java.io.File` 和 `java.io.FileReader`。\n\n![](img/Image00092.jpg)\n\n看，你已经看到编译器检测到了错误。与普通的错误不同，如果是一个错误（例如你将\
  \ `System.out` 误写为 `Ssytem.out`），你必须立即修复；但对于异常，我们不修复任何东西，而是找到方法来“捕获” Bug 并不同的方向打破应用程序的逻辑，我们稍后会详细查看。\n\
  \n### 2. 非检出异常 (Unchecked Exception)\n这种异常非常危险，因为编译器无法检查它来帮助你。当你的应用程序交付给用户时，当用户正在操作它时……砰！应用程序“猝死”。因为这种异常发生在应用程序执行期间，它也被称为\
  \ `RuntimeException`（运行时异常）。\n\n通常，当应用程序因此类问题崩溃时，系统仍然会有一个日志告诉我们错误是什么。你可以尝试在编译以下代码时创建此异常。\n\
  \n```java\nint num[] = {1, 2, 3, 4};\nSystem.out.println(num[5]);\n```\n\n代码看起来似乎无害（因为编写代码时没有错误）。但如果执行应用程序，系统将无法找到第\
  \ 5 个数组元素，因为我们的数组只声明了 4 个元素。因此，应用程序在不知道该如何处理的情况下崩溃了。你可以尝试执行上述代码并在控制台中查看日志。\n\n###\
  \ 3. 错误 (Error)\n这里的 `Error` 也是 `Exception`，但与 `Exception` 略有不同。我上面提到的两种 `Exceptions`\
  \ 实际上不是错误，因为你不应该避免它们，而应该面对并“打破”应用程序流，以便在遇到这种异常时，应用程序知道如何恰当响应。对吧。下节课我们将练习打破这个线程。\n\
  \n此外，`Error` 确实是无法做其他事情的事情。它超出了我们的处理范围。即使你预先知道可能会发生错误，当应用程序崩溃时，通常只能重新编写该部分并更新应用程序的新版本，而无能为力。例如，当系统内存耗尽时，或者当你使用某个库时，不幸某天该库的某个类或方法不再被找到。\n\
  \n## III. Java 异常类的层级树\n\n上述提到的异常都是 Java 中的类。当应用程序偏离线程时，系统还会将该错误专门分配给某个 `Exception`\
  \ 类进行管理。因为 `Exceptions` 像上面一样分为 3 类，你可以看到这些 `Exception` 类的分类也分为三个主组。\n\n![](img/Image00093.jpg)\n\
  \n如果你对 `Exception` 一无所知，只需看看即可。下节课开始，我们将根据图中层级结构的内部层次来“捕获”异常。我们也可以根据应用程序的要求创建自己的异常。\n\
  \n就层级结构而言，与所有这些课程相关的顶级类是 `Throwable` 类。我们将在下节课中熟悉 `Throwable` 以及这个超类的有用方法，因为我们已经知道如何捕获异常。\n\
  \n`Throwable` 的两个主类是 `Exception` 和 `Error`。在 `Exception` 中有两种子类类型。一种是 `RuntimeException`\
  \ 及其子类，它们是我上面提到的 `Unchecked Exceptions`（非检出异常），此分支中的异常不会被编译器审查，因此在真实世界运行的应用程序中具有潜在风险。在\
  \ `RuntimeException` 之外的 `Exception` 剩余子类就是其他其他异常，它们都是 `Checked Exception`（检出异常），如果你使用的代码“触碰”该分支中的异常，将是系统错误，正如你在其他地方看到的示例。\n\
  \n`Error` 分支上的 `Exceptions` 不会被系统报告，它会发现应用程序运行时我们无法预料的隐藏死亡风险，正如我们上面所提到的。\n\n###\
  \ 练习题 1\n尝试编写上一节课练习 1 的代码，但这次请密切关注控制台输出 `Exception`。\n\n```java\nint i = Integer.parseInt(\"\
  10\");\nfloat f = Float.parseFloat(\"4.5a\");\nSystem.out.println(i); System.out.println(f);\n\
  ```\n![](img/Image00094.jpg)\n\n尝试找出控制台显示的 `NumberFormatException` 是什么异常：`Checked\
  \ Exception`、`Unchecked Exception` 还是 `Error`？提示：你可以在 Eclipse 中对任何层级按 Ctrl + 左键（或\
  \ Mac 上按 Command + 左键）跳转到系统中该类的声明，你将更多了解该类与其他类之间的关系。\n\n### 练习题 2\n同样，你尝试编写以下代码并告诉它是什么异常，是哪种异常。\n\
  \n```java\nint value = 10 / 0;\nSystem.out.println(value);\n```\n\n#### 练习题 3\n\
  尝试弄清楚下面的代码将产生什么异常\n\n```java\nString s = null;\nSystem.out.println(s.length());\n\
  ```\n\n所以通过这节课，我们熟悉了 Java 中 `Exception` 是什么。我们还有几节课来讨论关于这种异常的所有知识，请跟进学习。\n\n# 第\
  \ 35 节：异常（部分 2）\n\n在上一节课中，你熟悉了 `Exception` 的概念，并尝试创建了一些异常来“一起玩玩”。然而，`Exception`\
  \ 产生的初衷不是让我们只能那样无助地看着。我们可以通过捕获它们来完全处理 `Exceptions `，阻止它们导致程序崩溃并执行我们想要的操作，正如上一节课中，我们使用了“破解”这个词。因此，异常系列的第二部分我们将讨论捕获这些\
  \ `Exceptions` 的技术。\n\n## I. 熟悉 Try Catch\n\n正如第一节课程有一个介绍，这里我们寻找捕获异常，或者有些文档称之为“Bug\
  \ 陷阱”。\n\n当然，无论是什么，如果我们想要做某些事情，就必须提供相应的工具。我们所讨论的捕获 `Exception` 的工具被称为 `Try Catch`。`Try\
  \ catch` 是一个帮助你封装可能发生异常的代码的工具。我们讨论的代码将被封装在 `try` 块中。然后，如果 `try` 块中发生了该异常，系统将迅速“打破”应用程序的逻辑流，转而执行\
  \ `catch` 块内部的代码。\n\n\n\n根据上面的解释，请看 `try catch` 的语法如下：\n\n```java\ntry {\n    //\
  \ 可能导致 Exception 的行\n\n} catch (ExceptionClass e) {\n}\n```\n\n\n\n\n\n// 如果发生异常，这些行代码将被调用\n\
  \n为了更容易理解，请尝试通过以下练习，对你在上一节中已经知道的某种可能的错误情况进行捕获。\n\n### 1. 练习构建 Try Catch\n\n我们来看一下可能导致异常的代码类型，你可以在这一节中复习它们。在这里我把它们写下来。\n\
  \n```java\nint num[] = {1, 2, 3, 4};\nSystem.out.println(num[5]);\n```\n\n你已经知道这段代码属于\
  \ `Unchecked Exception`（未检查异常），这意味着编译器不会为你识别并检查是否发生了异常。但如果编译器什么都不做，我们可不能坐待旁毙。为了确保我们的应用程序“健康”，你应该预判异常并在\
  \ `try catch` 块中包含“潜在致病性”的代码。如果你固执地执行程序，你将得到类似这样的错误信息。请注意 `Exception`，我们将在下文中捕获它们。\n\
  \n![](img/Image00095.jpg) 让我们这样用 `try catch` 块包裹可能导致错误的代码片段。\n\n```java\ntry {\n\
  \    int num[] = {1, 2, 3, 4};\n    System.out.println(num[5]);\n} catch (ArrayIndexOutOfBoundsException\
  \ e) {\n    System.out.println(\"无法打印，因为没有找到预期的数组元素。\");\n}\n```\n\n此时，如果你重新执行程序，用户将看到一个更“人性化”的错误信息，如下：`Cannot\
  \ print because the array element was not found as expected`。\n\n## 2. 练习验证 Try\
  \ Catch 的工作\n\n通过这个练习，你将更好地理解“捕获”错误的本质，以及当“陷阱”捕获到错误时，catch 行代码是如何立即执行的。\n\n你看到带有完整\
  \ `try catch` 的代码如下。猜猜控制台输出会是什么样。\n\n```java\ntry {\n    System.out.println(\"The\
  \ program is doing some divides:\");\n    int result = 10 / 2;\n    System.out.println(\"\
  10 divided by 2 equals \" + result);\n    result = 10 / 1;\n    System.out.println(\"\
  10 divided by 2 equals \" + result);\n    result = 10 / 0;\n    System.out.println(\"\
  10 divided by 0 equals \" + result);\n} catch (ArithmeticException e) {\n    System.out.println(\"\
  There is one divide doesn’t work \");\n}\n```\n\n结果如下：\n\n```\nThe program is doing\
  \ some divides:\n10 divided by 2 equals 5\n10 divided by 2 equals 5\nThere is one\
  \ divide doesn’t work\n```\n\n哦。打印控制台的 `System.out.println (\"10 divided by 0 equals\"\
  \ + result);` 一行在哪里？事实上，一旦系统检测到 `try` 块中发生异常，该 `try` 块之后的代码将不再执行，而是为下一个执行的 `catch`\
  \ 块留出空间。一个小有趣的插图是，当第 10 行的代码执行时，它导致了异常并跳转到第 13 行。\n\n## II. 关于 Try Catch 的规则\n\n\
  此时，你已经知道如何用 `try catch` 包裹可能导致异常的代码行了。然而，我知道对于刚开始接触 `try catch` 的你来说，会有很多问题，我想以以下规则的形式列出它们。\n\
  \n### 1. 异常并不总是进入 Catch\n正如你所熟悉的，`try` 块内部的语句并不总是会导致异常，因此，如果 `try` 中的逻辑执行安全，`catch`\
  \ 块内部的语句也不总是会被执行。正如上面的例子，如果你不将 10 除以 0，屏幕上就不会出现显示“There is an unworkable division”的语句。\n\
  \n### 2. 但如果你定义了 Try，就必须定义 Catch\n然而，`try` 中的代码并不总是导致异常。但如果有 `try` 定义，你就必须带有一个关联的\
  \ `catch` 定义。这保证了在发生异常时，你始终指定一个回退逻辑。\n\n### 3. 可以用异常类捕获吗？\n你不需要像上面的示例那样用 `ArrayIndexOutOfBoundsException`\
  \ 或 `ArithmeticException` 等特定子类进行捕获。你也可以使用异常父类。语句将变为 `try {…} catch (Exception e)\
  \ {…}`。因为你并不总是记得 `Exception` 的子类！但要小心！让我们学习使用特定的子异常，不要太懒于使用 `Exception` 类，甚至使用 `Throwable`\
  \ 类。当然，起初你的代码将更容易管理，向用户反馈的 bug 将更具体，当你习惯了同时捕获多个 bug 时，这一点会变得清晰，如下所示。\n\n## III.\
  \ Try 带多个 Catch\n\n有时我们将过多的代码塞进 `try` 块中，这可能导致产生多个异常。这时我们可以完全应用以下语法，在同一个 `try` 中捕获多个异常。\n\
  \n```java\ntry { \n    // 可能导致异常的代码行\n} catch (ExceptionClass1 e1) {\n    // 捕获\
  \ ExceptionClass1\n} catch (ExceptionClass2 e2) {\n    // 捕获 ExceptionClass2\n}\n\
  ```\n\n根据上述语法，我们可以在同一个 `try` 中捕获多个异常。\n\n```java\ntry {\n    // 可能导致异常的代码行\n} catch\
  \ (ExceptionClass1 e1) {\n    // 捕获 ExceptionClass1\n} catch (ExceptionClass2 e2)\
  \ {\n    // 捕获 ExceptionClass2\n} catch (ExceptionClass3 e3) {\n    // 捕获 ExceptionClass3\n\
  }\n```\n\n## 1. 练习构建带多个 Catch 的 Try\n\n在这个练习中，你将熟悉检查异常（Checked Exceptions），并学会如何在\
  \ Eclipse 中添加 try 块。\n\n首先，将以下代码放入方法中：\n\n```java\nFileOutputStream outputStream;\n\
  outputStream = new FileOutputStream(\"file.txt\");\noutputStream.write(65);\noutputStream.close();\n\
  ```\n\n你将立即看到编译器的信息。\n\n![](img/Image0096.jpg) 这并不是错误。因为当你点击左侧的灯泡图标时，你会看到如下修复方案。\n\
  \n![](img/Image0097.jpg) 显然这是一个检查异常，系统为你提供两个选项：\n\n- **Add throws declaration**：此选项允许你不创建\
  \ catch 块，而是继续“抛出”。这种技术将在下一节讨论。\n- **Surround with try / catch**：这是我们想要的选项，选择此选项后，系统将用带有\
  \ `FileNotFoundException` 的异常块包裹你的代码。\n\n你可以按照建议手动输入 try catch。但如果你选择第二个选项，系统会自动为你\
  \ try catch，但这种自动处理相当“笨拙”，你应该让代码看起来更美观，如下：\n\n```java\ntry {\n    FileOutputStream\
  \ outputStream;\n    outputStream = new FileOutputStream(\"file.txt\");\n    outputStream.write(65);\n\
  \    outputStream.close();\n} catch (FileNotFoundException e) {\n    // TODO 自动生成的\
  \ catch 块\n    e.printStackTrace();\n}\n```\n\n你可以看到，尽管对 `FileNotFoundException`\
  \ 进行了 try catch，系统仍然报错。让我们看看。\n\n![](img/Image0098.jpg) 结果系统需要你捕获另一个名为 `IOException`\
  \ 的异常。此时可能会更多选项。如上所示，它们包括：\n\n- **Add throws declaration**：如上所述。\n- **Add catch\
  \ clause to surrounding try**：添加更多的 catch，这种 形式就像本节中的第一种语法。\n- **Add exception to\
  \ existing catch clause**：在现有的 catch 中添加异常。try catch 形式 `(ExceptionClass1 | ExceptionClass2)`\
  \ 就像本节中的第二种语法。\n- **Surround with try / catch**：再嵌套一个 try catch 来捕获当前的，这种方法会让你的代码适用性降低，因为看起来很复杂。\n\
  \n\n\n\n在此时，你可以选择第二种方式，代码如下：\n\n```java\ntry {\n    FileOutputStream outputStream;\n\
  \    outputStream = new FileOutputStream(\"E://file.txt\");\n    outputStream.write(65);\n\
  \    outputStream.close();\n} catch (FileNotFoundException e) {\n    // TODO 自动生成的异常块\n\
  \    e.printStackTrace();\n} catch (IOException e) {\n    // TODO 自动生成的异常块\n   \
  \ e.printStackTrace();\n}\n```\n\n或者选择第三种方式生成这段代码：\n\n```java\ntry {\n    FileOutputStream\
  \ outputStream;\n    outputStream = new FileOutputStream(\"E://file.txt\");\n  \
  \  outputStream.write(65);\n    outputStream.close();\n} catch (FileNotFoundException\
  \ | IOException e) { // TODO 自动生成的异常块\n    e.printStackTrace();\n}\n```\n\n### 练习\
  \ 1\n假设我有如下程序。该程序将生成 10 个随机整数并将它们存储在一个 10 个元素的数组中。程序将让用户输入数组索引，然后将该数组的值输出到控制台。\n\
  \n```java\n// 创建一个包含 10 个随机整数的数组\nint randomIntNumbers[] = new int[10];\nRandom\
  \ rand = new Random();\nfor(int i = 0; i < 10; i++) {\n    randomIntNumbers[i] =\
  \ rand.nextInt(100);\n}\n// 让用户输入一个整数并打印到屏幕\n// 对应的数组元素\nScanner input = new Scanner(System.in);\n\
  System.out.println(\"你想打印哪个数组元素?\");\nint index = input.nextInt();\nSystem.out.println(\"\
  好的, 索引为 \" + index + \" 的数组元素 \" + randomIntNumbers[index]);\n```\n\n当然，这个程序在运行时有导致异常的可能。请尝试清理对应的\
  \ try catch，以便在发生异常时，程序能够及时通知用户错误信息。这里是答案代码，你应该在点击此答案之前自己编写代码并尝试“弄坏”程序。\n\n```java\n\
  // 创建一个包含 10 个随机整数的数组\nint randomIntNumbers [] = new int [10];\nRandom rand = new\
  \ Random ();\n\nfor (int i = 0; i <10; i ++) {\n    randomIntNumbers [i] = rand.nextInt\
  \ (100); \n}\ntry {\n    // 让用户输入一个整数并打印到屏幕\n    // 对应的数组元素\n    Scanner input =\
  \ new Scanner (System.in);\n    System.out.println (\"你想打印哪个数组元素?\");\n    int index\
  \ = input.nextInt ();\n    System.out.println (\"好的, 数组元素\" + index + \" 的值为\"+\
  \ + randomIntNumbers [index]);\n} catch (InputMismatchException e) {\n    System.out.println\
  \ (\"无效的数组元素，请输入整数!\"); \n} catch (ArrayIndexOutOfBoundsException e) {\n    System.out.println(\"\
  无效的数组索引，请输入 0 到 9 之间的值!\");\n}\n```\n\n### 练习 2\n我有如下代码，它已经经过了“谨慎”的 try catch，你看看这个\
  \ try catch 是否还会引起任何错误。\n\n```java\nScanner input = new Scanner(System.in);\nInteger\
  \ intNumber = null;\ntry {\n    System.out.println(\"请输入一个整数: \");\n    String strNumber\
  \ = input.nextLine();\n    intNumber = new Integer(strNumber);\n} catch (NumberFormatException\
  \ e) {\n    System.out.println(\"请输入一个整数 \"); \n}\nSystem.out.println(\"转换为十六进制:\
  \ \" + Integer.toHexString(intNumber));\n```\n\n我发现这并不好。因为如果在调用用户输入数字的部分发生了异常，那么\
  \ `intNumber` 还没有被初始化（值为 `null`），这会导致最后的代码会发生另一个异常。我修改了这段代码，如下：\n\n```java\ntry\
  \ {\n    Scanner input = new Scanner (System.in);\n    Integer intNumber = null;\n\
  \    System.out.println (\"请输入一个整数:\");\n    String strNumber = input.nextLine ();\n\
  \    intNumber = new Integer (strNumber);\n    System.out.println (\"转换为十六进制:\"\
  \ + Integer.toHexString (intNumber)); \n} catch (NumberFormatException e) {\n  \
  \  System.out.println(\"请输入一个整数\");\n}\n```\n\n你刚刚看完了关于异常系列的第 2 部分。通过这一节，我们习惯了如何通过\
  \ `try catch` 工具来捕获错误并中断程序的流程。`try catch` 再次会有“变体”，我将在下一部分继续介绍。\n\n# 课程 36：异常（部分\
  \ 3）\n通过两节关于异常的课程，你对于你创建的代码行的“命运”心里应该更有底气了，对吗？事实是，通过良好使用我在前两节中仔细介绍过的 `try catch`，可以说，当应用程序能够及时通知用户错误情况时，它将变得非常强大、安全且智能。\n\
  \n然而，当我们谈论 `Exception` 时，我们必须说……。不要掉以大意，错过这个工具提供的强大功能。我们将继续深入探讨异常，讨论带有 `finally`\
  \ 的 `try catch`、带资源的 `try catch` 以及 `Exception` 类的实用方法。\n\n## I. 带有 finally 的 Try\
  \ Catch\n我重复一下之前课程的内容，即当你熟悉了如何捕获异常后……当你熟悉了 `try catch` 的用法后，`try catch` 再次会有“变体”。\n\
  \n通过上述语法，你可以看到 `finally` 会伴随 `try catch`。无论发生异常，`finally` 都会执行。无论是否发生异常，`finally`\
  \ 帮助我们清理工作。\n\n```java\ntry { // 可能会导致异常的代码\n} catch (ExceptionClass1 e1) {\n  \
  \  // 捕获 ExceptionClass1\n} catch (ExceptionClass2 e2) { // 捕获 ExceptionClass2\n\
  } catch (ExceptionClass3 e3) { // 捕获 ExceptionClass3\n} finally {\n    // 释放资源\n\
  }\n```\n\n1. 仅有 Try - Finally（没有 Catch）也是的\n你可以理解在这种情况下 `finally` 用于清理某些东西，而不一定发生了异常发生。因为使用\
  \ `finally` 的需求很小，下面的示例并不实际，主要为了帮助你理解。\n\n```java\ntry {\n    System.out.println(\"\
  程序正在进行计算...\");\n    int result = 10 / 2;\n    System.out.println(\"10 除以 2 等于:\
  \ \" + result);\n} finally {\n    System.out.println(\"这是程序的结束\");\n}\n```\n\n2.\
  \ 你可能不需要 Finally，但如果代码中有 Finally，`finally` 总是会被最后调用的\n例如，`try catch` 并不需要 `finally`，你已经通过上一节课知道了。但如果你为\
  \ `try catch` 声明了 `finally`，那么 `finally` 块中的语句最终会被执行，在应用程序执行了 `try` 中未引起异常的语句， own\
  \ 执行了 `catch` 块中的语句之后。无论如何，`finally` 也会到达。\n\n\n\n\n```java\nSystem.out.println(\"\
  10 divided by 0 equal: \" + result);} catch (ArithmeticException e) {\n    System.out.println(\"\
  Can’t perform the code\");\n} finally {\n    System.out.println(\"This is the end\
  \ of program \");\n}\n```\n通过这些行代码，控制台将输出如下。可能我不需要太多的解释。\n\n应用程序正在进行数学运算\n无法执行代码\n\
  程序结束\n\n### 3. Finally 中仍然可以包含 Try Catch\n如果在 `try` 或 `catch` 块中，我们可以嵌套更多的 `try`\
  \ `catch` 块，那么 `finally` 块也允许这样做。尽管这看起来很复杂且有些不安全，但生活并不完美，在捕获错误的过程中发生错误是很常见的。通过下面的练习，你将熟悉\
  \ `finally` 以及在 `finally` 内部的 `try catch`。\n\n### 4. 练习构建带有 Finally 的 Try Catch\
  \ 结构\n这个练习帮助我们习惯 `try catch` 和 `finally` 更具实战性的用法。我们将继承上一个练习的代码。\n\n由于昨天的练习，我们刚刚学会了如何有效地捕获异常。事实上，你正在使用\
  \ `FileOutputStream` 从系统打开文件并操作该文件。这个文件是一个可以被其他程序共享的资源。正如我所，如果你使用了这个文件并且发生了某些而你没有释放所有权，那么你就是“自私”地只把文件留给自己，而其他应用程序无法读取这个文件。这就是为什么我们需要构建\
  \ `finally` 来如下释放此资源。\n\n首先，我们需要编写如下导致检出异常（Checked Exception）的代码行：\n```java\nFileOutputStream\
  \ outputStream = null;\noutputStream = new FileOutputStream(\"E://file.txt\");\n\
  outputStream.write(65);\noutputStream.close();\n```\n正如上一节课的练习一样，你已经知道系统手动为报告错误的行添加\
  \ `try catches` 块的最简单方法。在应用了 Eclipse 的提示（见上一节）后，我们的代码看起来像这样：\n```java\nFileOutputStream\
  \ outputStream = null;\ntry {\n    outputStream = new FileOutputStream(\"E://file.txt\"\
  );\n    outputStream.write(65);\n    outputStream.close();\n} catch (FileNotFoundException\
  \ e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n} catch\
  \ (IOException e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n\
  }\n```\n上述代码有什么问题吗？你知道名为 `file.txt` 的文件被视为共享资源。这意味着当你打开此文件写入值 `65` 时，同时可能有另一个程序尝试操作此文件。而发生的问题是，如果在向文件写入过程中发生了任何错误，导致程序跳转到下方\
  \ `catch` 块内部的代码行中，那么 `outputStream.close()` 语句将没有机会执行。你所操作的文件仍被系统认为正在使用中。因此，其他应用程序必须永远等待，而无法看到你的应用程序返回使用该文件的权限。关于文件操作的问题，我们将在接下来的课程中熟悉。现在，确保你正在使用的文件始终被安全关闭。将资源使用权返回其他程序。这很简单，让我们添加\
  \ `finally`，并在该块中关闭此文件的代码就完成了。如下所示。\n\n![](img/Image00099.jpg)\n\n噢但看，进入 `finally`\
  \ 的代码仍然受检出异常的管辖。很好，我们可能还需要一个 `try catch`。最终代码看起来如下：\n```java\nFileOutputStream outputStream\
  \ = null;\ntry {\n    outputStream = new FileOutputStream(\"E://file.txt\");\n \
  \   outputStream.write(65);\n    outputStream.close();\n} catch (FileNotFoundException\
  \ e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n} catch\
  \ (IOException e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n\
  } finally {\n    try {\n        outputStream.close();\n    } catch (IOException\
  \ e) {\n        // TODO Auto-generated catch block\n        e.printStackTrace();\n\
  \    }\n}\n```\n\n## II. 带有资源的 Try Catch\n这种类型的 `try catch` 自 Java 7 起就存在了。它是你刚刚熟悉的带有\
  \ `finally` 的 `try catch` 的升级。具体来说，通过上面的练习，你已经看到了释放系统资源的重要性，对吧。你还看到了如何在 `finally`\
  \ 块中关闭文件。但如果我们仔细观察上面的练习，可以发现无论 `FileInputStream` 初始化语句是否执行执行，`finally` 块都会被调用，因此在\
  \ `finally` 块中关闭文件可能会导致其他异常。而且由于这个原因，我们必须在 `finally` 内部添加 `try catch`。\n\n但像上面示例那样手动执行\
  \ `finally` 和 `finally` 内部的 `try catch` 也是不好的，如果 `try` 中的代码和 `finally` 中的代码都发生了异常，打印的错误行将会错乱。这就是为什么\
  \ Java 7 为我们提供了一个新工具，叫做“带有资源的 try catch”（Try With Resources）。它的语法如下：\n```java\n\
  try (// 初始化资源) {\n    // 使用创建的资源\n} catch (ExceptionClass1 e1) {\n    // 捕获 ExceptionClass1\n\
  } catch (ExceptionClass2 e2) {\n    // 捕获 ExceptionClass2\n} catch (ExceptionClass3\
  \ e3) {\n    // 捕获 ExceptionClass3\n}\n```\n你可以看到，这种 `try catch` 不再包含 `finally`。因为\
  \ `try` 括号内初始化的资源现在知道自己在块结束时如何关闭。\n\n在进入详细练习之前，让我们过 `try catch with resources` 的几个要点，以帮助更好地理解：\n\
  \n1. **并不是任何资源都可以在 Try Catch Resource 中使用**\n只有像示例中的 `FileOutputStream` 这样实现了 `java.lang.AutoCloseable`\
  \ 接口的对象，才能在 `try catch` 中。\n\n2. **在关闭系统资源期间发生错误将产生异常**\n这意味着，在使用上面的 `try catch\
  \ with finally` 时，假设初始化 `FileOutputStream` 失败，初始化异常会被抛出，程序跳转到对应的 `catch`，这一点你很清楚。但随后执行\
  \ `finally` 块的代码，如果通过 `outputStream.close()` 关闭文件仍然导致错误，关闭异常将再次释放，程序再次跳转到 `finally`\
  \ 中的 `catch`。但在 `try catch with resources` 中，情况就不同。如果 `FileOutputStream` 初始化失败，只有\
  \ `try` 的异常会被抛出，程序跳转到对应的 `catch`。这就是我们讨论的两种 `try catch` 之间的基本区别。\n\n3. **Try Block\
  \ 中可以生成多个资源**\n有时我们要在 `try` 块中安全一个多个资源，我们只需要初始化这些资源并用 `;` 分隔即可。关于这个想法的细节将在后续练习中显示。\n\
  \n### 4. 练习构建带有资源的 Try Catch\n我们将通过尝试捕获资源来修改上面的练习代码。这非常简单快速，你只需要将资源初始化代码封装在 `try`\
  \ 的括号中，并移除上述练习的 `finally` 块（以及所有关闭资源的代码）。\n```java\ntry(FileOutputStream outputStream\
  \ = new FileOutputStream(\"E://file.txt\")) {\n    outputStream.write(65);\n} catch\
  \ (FileNotFoundException e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n\
  } catch (IOException e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n\
  }\n```\n\n### 5. 练习构建带有多个资源的 Try Catch\n\n\n\n\n正如上面提到的，这个练习将帮助你理解在 `try` 括号内初始化多个资源时，`try\
  \ catch` 是如何工作的。你可能无法理解以下所有的语句，但只需练习即可，我们将在稍后的相关课程中详细讨论这些命令。以下命令将读取你指定的任何文件。由于接下来的代码包含了两个实现了\
  \ `java.lang.AutoCloseable` 接口的资源，即 `FileInputStream` 和 `BufferedInputStream`，我们将按照如下方式在\
  \ `try` 括号内初始化它们。这两个初始化的资源将在 `try catch` 块结束后后自动关闭。\n\n```java\ntry(FileInputStream\
  \ inputStream = new FileInputStream(\"E://file.txt\");BufferedInputStream bufferInputStream\
  \ = new BufferedInputStream(inputStream)) {\n    int data = bufferInputStream.read();\n\
  \    while(data != -1) {\n        System.out.print((char) data);\n        data =\
  \ bufferInputStream.read();\n    }\n} catch (FileNotFoundException e) {\n    //\
  \ TODO Auto-generated catch block\n    e.printStackTrace();\n} catch (IOException\
  \ e) {\n    // TODO Auto-generated catch block\n    e.printStackTrace();\n}\n```\n\
  \n## III. 异常类的一些有用方法\n这一部分是我在本课程中的额外内容。虽然我只提到了几个方法，但我希望你能更多了解如何使用 `Exception` 并将其应用于某些特定情况。\n\
  \n#### 1. `getMessage()`\n该方法返回一个描述刚刚发生的 `Exception` 的 `String`。你可以通过调用以下代码行进行实验。我刻意让这些代码行产生\
  \ `Exception`。\n\n```java\ntry(FileOutputStream outputStream = new FileOutputStream(\"\
  E://file_not_found.txt\")) {\n    outputStream.write(65);\n} catch (FileNotFoundException\
  \ e) {\n    System.out.println(e.getMessage());\n} catch (IOException e) {\n   \
  \ System.out.println(e.getMessage());\n}\n```\n这里是 `getMessage()` 方法返回的结果。\n![](img/Image00100.jpg)\n\
  \n#### 2. `toString()`\n返回抛出错误的 `Exception` 类的名称，以及上面 `getMessage()` 方法的内容。你可以尝试一下。\n\
  \n```java\ntry(FileOutputStream outputStream = new FileOutputStream(\"E://file_not_found.txt\"\
  )) {\n    outputStream.write(65);\n} catch (FileNotFoundException e) {\n    System.out.println(e.toString());\n\
  } catch (IOException e) {\n    System.out.println(e.toString());\n}\n```\n这是结果。\n\
  ![](img/Image00101.jpg)\n\n#### 3. `printStackTrace()`\n这是一个可以帮助你打印上面 `toString()`\
  \ 方法的内容的方法，以及堆栈跟踪（Stack Trace）日志行。让我们一起实验一下。\n\n```java\ntry(FileOutputStream outputStream\
  \ = new FileOutputStream(\"E://file_not_found.txt\")) {\n    outputStream.write(65);\n\
  } catch (FileNotFoundException e) {\n    e.printStackTrace();\n} catch (IOException\
  \ e) {\n    e.printStackTrace();\n}\n```\n结束。![](img/Image00102.jpg)\n\n你刚刚完成了关于\
  \ `Exception` 系列的第 3 部分。本课程帮助我们深入了解如何使用 `try catch` 来捕获异常并释放资源。我们还有另一个关于这个异常知识的章节，你应该看一看。\n\
  \n**第 37 课：异常（第 4 部分)**\n我通知你，这是关于这个“系列” `Exception` 的最后一节课了。回顾一下，我们关于 `Exception`\
  \ 的课程如下：\n- **认识 Exception**：这是关于 `Exception` 的开场课程。这节课将帮助你入门 Java 中的 `ERRORS` 概念。从那里开始，清楚地理解什么是\
  \ `Exception`。此外，课程还帮助你区分 Java 系统中 `Exceptions` 的类型。\n- **捕获（拦截）Exception**：在理解了什么是异常之后，你将知道如何捕获或拦截\
  \ `Exception`。掌握这些知识，你就可以通过 `try catch` 工具“编织”程序的逻辑。这种线程中断是为了确保你的应用程序始终“存活”，无即使它受到了\
  \ `ERRORS` 的影响。\n- **学习更多关于 try catch**：一旦你知道如何通过 `try catch` 捕获 `Exception`，你将通过\
  \ `Try Catch with Finally` 和 `Try Catch with Resource` 这两个概念学习该工具的进一步用法。我在本课程中还利用了\
  \ `Exception` 类的一些有用方法，帮助你更好地理解如何使用这个工具，并可以在本课应用这些方法。\n\n至此，我们来到了 `Exception` 的剩余知识。这节课将引导你进入一个无畏异常的领域。你甚至可以“玩弄它们它们将它们推到另一个地方处理，然后你甚至可以创建自己的\
  \ `Exception`。如果你觉得有趣，请加入课程。\n\n## I. Throw - 抛出一个异常\n到为止，我们所有人都理解 `Exception`。但我们仍然只是被动地“等待”\
  \ `Exception` 的发生。这意味着我们只是在尝试并等待（即使不想）捕获错误。但在实践中，某些情况下我们希望更快速地抛出一个 `Exception`。我使用“toss”（抛出）这个词是因为这正是\
  \ `throw` 词的含义：`throw`，toss, toss。这个释放的异常可以是 `Checked Exception`（受检异常），也可以是 `Unchecked\
  \ Exception`（运行时异常）。这个异常的释放取决于你的意愿。`throw` 的使用也非常简单。在方法内部使用 `throw` 来抛出异常。\n\n###\
  \ 使用 Throw 抛出异常\n我们开始尝试让程序在用户输入无效数据时崩溃。为了确保程序不会崩溃，我们应该在 `main()` 方法中使用合理的 `try catch`。当用户输入异常时使用\
  \ `throw`，方法如下所示。\n\n```java\nprivate static int enterEmployeeAge() {\n    Scanner\
  \ scanner = new Scanner(System.in);\n    System.out.print(\"Please enter employee’s\
  \ age: \");\n    int age = scanner.nextInt();\n    return age;\n}\n```\n你可以看到 `enterEmployeeAge()`\
  \ 返回类型为 `int`（返回输入的年龄）。这个方法也被声明为 `static`，以便我们在 `main()` 方法中调用它（这是一个静态方法）。接下来，在\
  \ `main()` 方法中，为了确保应用程序不崩溃，我们应该将对 `enterEmployeeAge()` 的调用封装在 `try catch` 中。\n\n\
  ```java\npublic static void main(String[] args) {\n    try {\n        int age =\
  \ enterEmployeeAge();\n        System.out.println(\"Age you entered: \" + age);\n\
  \    } catch (InputMismatchException e) {\n        System.out.println(\"Age you\
  \ entered isn’t valid. Error: \" + e.toString());\n    }\n}\n```\n通过之前的课程，你可以很容易猜到如果你输入\
  \ 28 岁，应用程序运行良好。但如果用户输入非数字，应用程序会立即向用户报告错误！哦，我多么喜欢 `try catch`。\n\nPlease enter employee’s\
  \ age: 28\nAge you entered isn’t valid. Error: java.util. InputMismatchException\n\
  \n但如果用户仍有借口，输入负值年龄，例如 -5。我们的应用程序仍然有点“愚蠢”，留下了这个漏洞。\n\nPlease enter employee’s age:\
  \ -5\nAge you entered: -5\n\n我没有这个年龄！为了提高应用程序的智能性，我们将利用 `throw` 关键字。正如我所说，这个关键字将被利用，以便我们随时可以发布异常，在这种情况下，当用户输入负数时，我们应该抛出一个异常。\n\
  \n\n\n\n```java\nif (age < 0) throw new InputMismatchException(\"Age entered can’t\
  \ bellow 0.\"); return age;}\n```\n你可以看到上方高亮的额外代码。我来简单解释一下。在 `enterEmployeeAge()`\
  \ 内部，一旦检查到用户输入的年龄小于 `0`，应用程序将抛出任何 `Exception`，在本例中抛出的是 `InputMismatchException`。你可以理解为可以抛出任何你想要的异常。除了抛出一个\
  \ `Exception` 之外，你还可以定义一个 `String` 类型的消息，并像上面的代码那样将 `Exception` 的构造函数传递进去。那么在调用\
  \ `enterEmployeeAge()` 的地方，如果该处有 `try catch`，它是合理的，并且符合 `Exception` 被抛出的条件（输入年龄小于\
  \ `0`），正如在之前的课程中提到的，应用程序的逻辑将在 `catch` 块处被中断。现在，通过这次升级，如果用户输入一个负值，看这里。\n\n请输入员工年龄：-5\n\
  \n你输入的年龄无效。错误：`java.util.InputMismatchException`: `Age entered can’t bellow 0.`\n\
  \n通过这次练习，你已经理解了如何使用 `throw`，对吧。在进入下一节之前，我有一个提示。在上面的示例中，当我们抛出一个 `Exception` 时，我们选择了\
  \ `InputMismatchException`。这是一个 `Unchecked Exception`（未检查异常）。因此，编译器不会强制要求抛出此 `Exception`\
  \ 的方法调用添加 `try catch`。但如果你尝试使用 `Checked Exception`（检查异常），那么会有很多值得讨论的内容，并且与 `throws`\
  \ 概念有关，所以我将在本案例以及接下来的节中进行详细说明。\n\n## II. Throws - 抛出异常以便在其他地方处理\n\n注意，不要误解。上面提到的项关于通过\
  \ `throw` 关键字自愿抛出的异常。而这一节是关于 `throws`（多了一个 s）。\n\n### throws（抛出声明）\n\n除了在方法或代码块内部使用的\
  \ `throw` 之外，`throws` 是在声明方法时立即使用的。\n\n当你不想在方法内部构建 `try catch` 时，使用 `throws`，你是将这个责任“推”给调用该方法的外部方法，让它来为你尝试处理。\n\
  \n让我们通过下面的练习，以充分利用 `throws` 的作用，并学习如何将 `throw` 和 `throws` 结合使用。\n\n#### 练习 #1：使用\
  \ Throw 触发检查异常\n\n你是否在奇怪为什么 `throws` 练习的标题是关于 `throw` 的？你只需尝试以下步骤即可看到真实的问题。我将返回上面练习源码。在\
  \ `enterEmployeeAge()` 方法中，我们尝试将抛出 `InputMismatchException` 替换为特定的 `Checked Exception`。我将尝试使用\
  \ `IOException`。该方法的代码看起来如下：\n\n```java\nprivate static int enterEmployeeAge() {\n\
  \    Scanner scanner = new Scanner(System.in);\n    System.out.print(\"Please enter\
  \ employee age: \");\n    int age = scanner.nextInt();\n    if (age < 0) throw new\
  \ IOException(\"Age entered can’t bellow 0.\");\n    return age;\n}\n```\n\n像上面一样抛出一个\
  \ `Checked Exception` 后，你会很容易发现系统会要求你执行以下两个操作之一。\n\n![](img/Image00103.jpg)\n\n\
  第一个选项 `Add throws` 声明将为这个 `enterAgeEmployee()` 方法声明 `throws`。正如我所说，如果方法声明了 `throws`，它就不再需要尝试捕获任何内容，而是可以将此\
  \ `try catch` 的责任推给其他方法。第二个选项 `Surround with try / catch`，你从之前的课程中也知道，它将帮助用 `try\
  \ catch` 块包裹这段代码。在这种情况下，我们应该选择第一个选项，这既符合课程要求，又让代码更容易管理，因为你只是抛出了异常并尝试捕获它，这看起来只是有点冗余。\n\
  \n使用第一个选项，我们的代码看起来如下：\n\n```java\nprivate static int enterEmployeeAge() throws IOException\
  \ {\n    Scanner scanner = new Scanner(System.in);\n    System.out.print(\"Please\
  \ enter employee age: \");\n    int age = scanner.nextInt();\n    if (age < 0) throw\
  \ new IOException(\"Age entered can’t bellow 0.\"); \n    return age;\n}\n```\n\n\
  由于将捕获此 `Checked Exception` 的责任推出去，调用 `enterEmployeeAge()` 的方法将报告如下熟悉的错误。\n\n![](img/Image00104.jpg)\
  \ 我打赌你已经知道该怎么做了。在这里，我已经按照你的要求进行了全部修正，使用了带有 `IOException` 的 `try catch`。\n\n```java\n\
  public static void main(String[] args) {\n    try {\n        int age = enterEmployeeAge();\n\
  \        System.out.println(\"Age you entered: \" + age);\n    } catch (IOException\
  \ e) {\n        System.out.println(\"Age you entered isn’t valid. Error: \" + e.toString());\n\
  \    }\n}\n```\n\n你理解如何使用 `throws` 来将 `try catch` 的责任推出去了吗？\n\n#### 练习 #2：使用 Throws\
  \ 将异常推出去\n\n通过上面的练习，你可能已经理解了如何使用 `throws`。然而，我想让你再做一个示例，专注于 `throws` 本身，且其中不出现 `throw`。\n\
  \n让我们回到构建 `try catch` 情况，就像上节节的练习一样。唯一的不同是这次我们构建了一个单独的文件写入方法，在这个方法中完全没有 `try catch`。现在，让我们开始构建文件记录方法（代码与之前相同）。\n\
  \n```java\nprivate static void writeFile() {\n    FileOutputStream outputStream;\n\
  \    outputStream = new FileOutputStream(\"E://file.txt\");\n    outputStream.write(65);\n\
  \    outputStream.close();\n}\n```\n\n我们将再次得到错误。\n\n![](img/Image00105.jpg) 当你点击左侧的灯泡图标时，你已经知道应该选择哪个选项。\n\
  \n当完全 `throws` 后，该方法看起来如下：\n\n```java\nprivate static void writeFile() throws FileNotFoundException,\
  \ IOException {\n    FileOutputStream outputStream;\n    outputStream = new FileOutputStream(\"\
  E://file.txt\");\n    outputStream.write(65);\n    outputStream.close();\n}\n```\n\
  \n最后，调用此方法将强制要求 `try catch`，或者在下一个方法中使用 `throws`。\n\n```java\npublic static void\
  \ main(String[] args) {\n    try {\n        writeFile();\n    } catch (FileNotFoundException\
  \ e) { // TODO TODO-generated catch block e.printStackTrace();\n    } catch (IOException\
  \ e) {\n        // TODO Auto-generated catch block e.printStackTrace();\n    }\n\
  }\n```\n\n\n\n\n- 所有自定义异常（Custom Exceptions）必须是 `Throwable` 类的子类（如果你忘记了 `Throwable`\
  \ 是什么类，可以回顾第 37 课的知识）。\n- 如果你想创建一个自定义异常，并希望系统在不尝试捕获它时报错，那么就创建一个类并继承 `Exception`\
  \ 类（你可以查看第 37 课来了解 `Exception` 是什么类）。当然，`Exception` 类是 `Throwable` 的子类，如果你这样做，你就满足了另一个命名要求。\n\
  - 如果你想创建一个自定义异常且不让系统报错，你只需要创建一个类并继承 `RuntimeException` 类即可（`RuntimeException` 也是\
  \ `Throwable` 的子类，上面的链接也讨论过这个类）。\n\n上面的这些想法只是基础，对吧？让我们一起进入实践吧。\n\n## 练习自建年龄测试异常\n\
  \n我们将重写一个程序，以输入员工年龄并像上面那样检查年龄。但是，我们不再使用 `IOException` 来检查和抛出错误（这看起来毫无意义），我们应该在这个练习中创建一个真正的异常。这个自定义异常将是**受检异常（Checked\
  \ Exception）**。而且这个自定义异常可以进行调整，使错误更加可见。\n\n我们讨论的自定义异常命名为 `AgeCheckingException`。按照如下所示创建一个新层。\n\
  \n```java\npublic class AgeCheckingException extends Exception {\n    public AgeCheckingException(String\
  \ message) { \n        super(message);\n    }\n\n    @Override\n    public String\
  \ getMessage() {\n        return \"输入年龄时出错: \" + super.getMessage(); \n    }\n}\n\
  ```\n\n非常简单。这个自定义异常继承自 `Exception` 类。所以它已经是一个受检异常了。你应该为它构建一个构造函数来接收消息，并通过 `super()`\
  \ 调用将消息传递给父类。最后，自定义异常将重写 `getMessage()` 方法以返回更多信息。\n\n我们将如下构建 `enterEmployeeAge()`\
  \ 方法。也许你已经理解并熟悉了以下使用 `Exception` 的方法，所以我就不再多解释了。\n\n```java\nprivate static int\
  \ enterEmployeeAge() throws AgeCheckingException {\n    Scanner scanner = new Scanner(System.in);\n\
  \    System.out.print(\"Please enter employee age: \");\n    int age = 0;\n    try\
  \ {\n        age = scanner.nextInt();\n        if (age < 0) throw new AgeCheckingException(\"\
  Age entered can’t bellow 0.\");\n    } catch (InputMismatchException e) {\n    \
  \    throw new AgeCheckingException(\"Age entered must be a number\");\n    }\n\
  \    return age;\n}\n```\n\n然后在调用 `enterEmployeeAge()` 的 `main()` 方法中，我们将如下进行进行捕获。\n\
  \n```java\npublic static void main(String[] args) {\n    try {\n        int age\
  \ = enterEmployeeAge();\n        System.out.println(\"Age entered: \" + age);\n\
  \    } catch (AgeCheckingException e) {\n        System.out.println(e.getMessage());\n\
  \    }\n}\n```\n\n如果你故意输入负数，结果将如下：\n\n`Please enter employee age: -5`\n`Error when\
  \ entering age: Age entered can’t bellow 0.`\n\n或者输入带有字符的数字时。\n\n`Please enter employee\
  \ age: 9s`\n`Error when entering age: Age entered must be a number`\n\n所以在本课的结束时，我们也完成了关于\
  \ `Exception` 的有趣知识的学习。下一课将是 Java 的另一个有趣知识，即 `Thread`（线程）的知识。\n\n# 第 38 课：线程 Part1\
  \ - 线程概念\n\n上次有很多你们在问自己 Java 知识什么时候结束。很好，我也想告诉你们，我们正在接近最后的课程了。然而，我也想让你们知道，事实上，这种结束仅仅就我的课程而言。关于\
  \ Java 有很多知识，我希望在其他主题中讨论关于 Java 的其他方面。虽然课程可能跟不上你们学习的欲望速度，但我希望你们也能为其他有价值的 Java 学习材料做好“准备”。\n\
  \n回到关于 `Thread` 的课程。正如我在第 1 课中说过的，一旦你知道 Java 是什么，我也提到过这种语言的优势之一，就是对多线程（Multithread）的支持非常好。直到这节课，我们才聚在一起共同澄清\
  \ Java 的这种健壮性。\n\n## I. 线程概念，或多线程\n\n`Thread` 或 `Multithread` 在本课的知识中具有相同的含义。`Thread`\
  \ 的越南语翻译是 `luồng`，而 `Multithread` 是 `đa luồng`。\n\n这里的线程是系统的处理线程。因为让 `Thread` 出生的一个理由也是让应用程序能够并发控制多个不同的\
  \ `Thread`，这许多线程也意味着多线程，或 `Multithread`。这就是为什么知识 `Thread` 或 `Multithread` 是一样的了。\n\
  \n`Thread` 或 `Multithread` 的角色显然与多线程（`Multithreading`）、多任务处理（`Multitasking`）有关。特别是它将支持系统我们将任务分成几个应用程序流（或\
  \ `thread`），系统将同时处理这些流的流动。所以，根据我们目前对 Java 的熟悉，如果我们有任务 `A`、`B`、`C`，用旧的编码方式，系统将始终按顺序处理任务。现在假设\
  \ `A` 将先处理，然后是 `B`，最后是 `C`。但在这节课之后，如果我们将 `A`、`B`、`C` 组织成每个线程，系统就可以同时处理它们，这太棒了。\n\
  \n\n\n\n这些将在多个 `Process` 内部进行实现和管理。当一个 `Process` 创建时，该 `Process` 内部的应用程序就可以创建许多\
  \ `Thread`。基本上，线程会像 `Process` 一样由系统管理，即它们可以并行运行，因此有了“多线程”这个新概念。但 `Process` 内部的线程只能在该\
  \ `Process` 的限制内操作。线程将使用其所属 `Process` 允许的资源。但有一个不同之处是，`Threads` 非常轻量，并且可以很容易与 `Process`\
  \ 内部的其它共享资源共享。就是这样。尽管对这些概念进行了一番闲谈，但请记住，在这一节中，我们只关注一种概念，即 `Thread`。\n\n### III. 何时使用\
  \ Thread\n\n这个问题很容易回答，但如果你仔细思考，它包含的信息比我们想象的要多得多。\n\n首先，我在很久以前就提到过，如果你有多个想要协同工作的任务，那么就使用\
  \ `Threads`。例如，你只想让应用程序将用户信息获取到对话框中，只需调用服务器检查输入结果。或者你编写一个游戏，你只想让游戏接收来自键盘的控制信号，并根据这些控制在屏幕上绘制字符，同时控制障碍物或控制投射物、分数显示等。\n\
  \n`Thread` 的第二个用途也类似于想要同时处理这些任务，但你希望以某种一致性来控制流程。例如，你在应用程序中启动了多个 `Threads`，但你希望其他\
  \ `Threads` 启动后等待，等待某个特定线程完成后再变为激活状态。在关于 `Thread` 的系列教程第三卷中，我将详细说明这种 `Thread` 的用法。\n\
  \n使用 `Thread` 的第三点同样不是为了处理并发任务，而是当你想让应用程序执行耗时巨大的任务时。这里的“大”通常是指时间上的大。例如，当应用程序必须从服务器下载文件，或者必须执行某些完成时间不是瞬时的操作时。如果没有线程，这些耗时任务会严重影响用户体验。\n\
  \n我们将通过下面的练习来学习 `Thread` 的示例，帮助你更好地理解。\n\n#### 构建随机数应用\n\n这个练习能让你对 `Thread` 是什么以及它是如何工作的有一个直观的。我不要求你完全理解这个练习的代码，但我希望你会尝试这些代码，并成功运行程序。如果你遇到了任何错误，请联系我或在本课程下方留言。\n\
  \n想象这个练习是在构建一个游戏。在这个游戏中，有一个转盘，上面有从 0 到 100 的数字。玩家将开始旋转转盘，转盘转动后，玩家看不到上面的数字，直到他们停止转盘，玩家停在哪一个数字就是他们选中的数字。\n\
  \n好了，我们的应用不会构建那种完整的游戏。相反，我们将专注于游戏的逻辑。我们将转盘替换为在控制台上输入任意字符的命令。在接收到刚刚输入的字符后，我们不再启动旋转器，而是启动一个\
  \ `Thread`，这个 `Thread` 将反过来“旋转”数字，使其从 0 计数到 100，然后再次拨回 0。我们的线程一直运行，直到玩家从控制台输入一个字符，线程结束。`Thread`\
  \ 刚刚“停止”的那个数字就是玩家选中的数字。\n\n你已经理解了构建这个游戏的要求，对吧。要开始构建游戏，你应该自己创建一个新项目。你也可以将此项目命名为 `ThreadLearning`。然后创建一个包含\
  \ `main()` 方法的新类。\n\n接下来，自己创建一个名为 `CountTheNumberThread` 的新类。等一下，先不要为这个类写任何代码。这个类就是我们所讨论的负责“旋转”数字的\
  \ `Thread`。通常，我们的应用程序有如下结构。![](img/Image00107.jpg) 现在，按照如下代码编写 `CountTheNumberThread`\
  \ 类体。\n\n```java\npublic class CountTheNumberThread extends Thread {\n\n    private\
  \ int count = 0;\n\n    private boolean isStop = false;\n\n    @Override\n    public\
  \ void run() {\n        while(!isStop) {\n            count++;\n            if (count\
  \ > 100) {\n                count = 0;\n            }\n        }\n    }\n\n    public\
  \ void end() {\n        isStop = true;\n    }\n\n    public int getCount() {\n \
  \       return count;\n    }\n}\n```\n\n虽然你可能还不熟悉 `Thread`，但也想稍微解释一下，这样在下一节中你就能轻松接触\
  \ `Thread`。首先，`CountTheNumberThread` 类想要成为一个 `Thread`，它必须继承 `Thread` 类（还有另一种将类转换为\
  \ Thread 的方法，我们将在下一节讨论）。然后在这个类内部必须重写 `run()` 方法。`run()` 方法内部的代码逻辑将是一个 `Flow`（流程），该\
  \ `Flow` 将并行系统中执行，如果系统中存在另一个 `Flow`，它将与之并行执行。就这些了，除了我提到的这两个大核心思想外，`CountTheNumberThread`\
  \ 的其余声明都非常熟悉，所以我没有过多介绍。\n\n到此时，`CountTheNumberThread` 仅仅是一个类。想要启动这个类使其成为一个 `Thread`，我邀请你参考如下的\
  \ `main()` 方法中的代码。\n\n```java\npublic static void main (String [] args) {\n    Scanner\
  \ scanner = new Scanner (System.in);\n    // 等待用户按键开始\n    System.out.println (\"\
  Press any key to start\");\n    scanner.nextLine ();\n    // 声明并启动 CountTheNumberThread\
  \ 作为 Thread\n    // 调用 start() 方法\n    CountTheNumberThread countingThread = new\
  \ CountTheNumberThread ();\n    countingThread.start ();\n    // 等待用户按键停止\n    System.out.println\
  \ (\"Press any key to stop\");\n    scanner.nextLine ();\n    // 停止线程并查看当前“旋转”的数字\n\
  \    countingThread.end ();\n\n    System.out.println (\"Lucky Number:\" + countingThread.getCount\
  \ ());\n}\n```\n\n观察上面的代码，你可以看到使用 `Thread` 与使用其他普通类之间的细小区别。实例化普通类和实例化线程是一样的。但对于线程，要启动该线程（即将其转换为系统中的流），必须调用它的\
  \ `start()` 方法，该方法是在 `Thread` 类中构建的。当 `start()` 被调用时，父线程将启动你在 `CountTheNumberThread`\
  \ 中定义的 `run()` 方法内部的代码。因此，在 `main()` 方法中接收键盘输入将与 `run()` 方法内部的循环并行，没有任何代码需要等待任何代码。如果你运行程序，在控制台中输入一个字符开始“拨号”，再次输入以结束，你将获得属于自己的幸运数字，如下所示：\n\
  Press any key to start\n\nf\n\nPress any key to stop\n\nr\n\n\n\n\n\n幸运数字：69。噢呀！我拨通了\
  \ 69，你呢？祝你好运。•\n\n## 练习\n在这个练习中，我希望你尝试忽略 `CountTheNumberThread` 类对 `Thread` 的继承，那么该类的\
  \ `run()` 方法将不再有 `override` 关键字，这样你已经将这个类变成了一个普通类。而 `run()` 只是另一个普通方法。然后在 `main()`\
  \ 方法中，不要再调用 `countingThread.start()`，而是调用 `countingThread.run()`。也就是说，在这种情况下你没有使用\
  \ `Thread`。你可以重新运行应用程序，并比较对这个游戏应用 `Thread` 与不应用 `Thread` 有何不同，结果将会如何。我们刚刚接触到关于 Java\
  \ 多任务的一个非常新且有趣的理解，即 `Thread`。本课只是初步的接触，`Thread` 还有许多有趣的知识点，我将在接下来的课程中依次介绍。\n\n#\
  \ 第 39 节：线程（部分 2）\n在发布关于 `Thread` 的第一集后，我收到了你们很多的分享和反馈。我感受你们对这一知识的浓厚兴趣。这真的很有趣。实际上，我以前对接触\
  \ `Thread` 非常感兴趣。尽管这只是 Java 知识海洋中的一小部分，但 `Thread` 为我们带来了一股新风，一种让我们能够构建多任务、更强大、更实用的应用程序的新能力，充分利用它们发挥更多的系统性能。更具体地说，在了解什么是\
  \ `Thread` 后，我们就可以开始学习构建 Java 游戏了。因此，我们将通过更具体的细节来继续加强我们对 `Thread` 的兴趣，我们将讨论声明和实例化\
  \ `Thread` 的方法。\n\n## I. 创建线程\n在上一节课中，你已经熟悉了创建线程的方法。但我想在这节课中，让你……忘记上一节课的知识，让我们反复回顾一遍。\n\
  \n在 Java 中，你有两种方法来创建 `Thread`。根据我的观察，两种方法的使用频率相同。你的任务是了解这两种方法。为什么要了解这两种方法？除了为了能够声明和使用所有方法之外，当别人使用和你不同的方法时，你还需要能够阅读并理解他们的源代码。那么创建\
  \ `Thread` 的两种方法是什么呢？\n\n#### 1. 方法 1 - 继承 Thread 类\n方法是上一节课提到的……噢，我叫你忘记了。所以，这种方法你需要执行以下操作。\n\
  \n- 你创建一个新类并继承自 `Thread` 父类。在新创建的类中，你重写 `run()` 方法。\n\n最后，在其他地方，当你想要从这个类创建一个 `Thread`\
  \ 时，为它声明一个对象，然后调用它的 `start()` 方法来启动线程初始化。很简单，对吧。没发现 `Thread` 知识会这么简单。正如你昨天课程中简要了解到的，要声明一个类为线程，只需继承父类\
  \ `Thread`，类内部的 `run()` 方法就会在外部调用该类的 `start()` 方法时，变成由系统处理的一个流（实际上 `start()` 是继承自超类\
  \ `Thread` 的）。让我们一起通过实践来更好地理解。\n\n#### 2. 练习通过继承 Thread 类创建线程\n在这个练习中，我们测试创建一个 10\
  \ 秒倒数的 `Thread`。启动时，`Thread` 将开始打印控制台值 10，每过去一秒 `Thread` 就会将这个数字减一并再次打印到控制台，直到减到数值\
  \ 0，`Thread` 将打印“Time Out”。你可以复用你在上一节课中创建的项目，创建一个名为 `CountDownThread` 的新类。该类将像我在上面的项目符号中那样继承\
  \ `Thread` 类：\n\n```java\npublic class CountDownThread extends Thread {\n    @Override\n\
  \    public void run() { // 我们稍后编写代码 }\n}\n```\n\n`Thread` 的框架就是这样。正如提到的，`CountDownThread`\
  \ 启动时将从 10 秒开始倒数，到 0 秒将显示字符串“Time Out”。控制台上的秒数，你知道的，我刚刚提到为了让这个数字每秒更新并显示一次，我们使用了\
  \ `Thread.sleep(1000)` 方法。该方法会导致运行中的线程“睡眠”几毫秒，在这种情况下我们传入 1000 毫秒，即 1 秒。在睡眠允许的最大时间后，`Thread`\
  \ 将“唤醒”并继续执行其 `run()` 方法，并带有一个名为 `InterruptedException` 的检查异常。注意，你必须尝试捕获这个 `Thread.sleep`。我将在接下来的课程中讲解\
  \ `Thread.sleep()` 方法。这里是 `CountDownThread` 的完整代码。\n\n```java\npublic class CountDownThread\
  \ extends Thread {\n    @Override\n    public void run() {\n        int count =\
  \ 10;\n        for (int i = count; i > 0; i--) {\n            System.out.println(i);\n\
  \            try {\n                Thread.sleep(1000);\n            } catch (InterruptedException\
  \ e) {\n                // TODO Auto-generated catch block\n                e.printStackTrace();\n\
  \            }\n        }\n        System.out.println(\"Time out\");\n    }\n}\n\
  ```\n\n要启动新创建的 `Thread`，我们将如下所示调用它的 `start()` 方法。\n\n```java\npublic static void\
  \ main(String[] args) {\n    CountDownThread countDownThread = new CountDownThread();\n\
  \    countDownThread.start();\n}\n```\n\n10。这是我们刚刚创建的“计时器”的控制台屏幕。每秒会出现一个数字，直到程序结束（以及\
  \ `CountDownThread` 结束）出现“Time Out”这个单词。\n\n#### 3. 方法 2 - 实现 Runnable 接口\n如果上面的方法必须继承\
  \ `Thread` 类，那么这种方法就是实现一个名为 `Runnable` 的接口。这种方法你需要执行以下操作。\n\n- 你创建一个新类并用 `Runnable`\
  \ 实现该类。在新创建的类中，你重写 `run()` 方法。最后，在其他地方，当你想要从这个类创建一个 `Thread` 时，首先为它声明一个对象，然后声明另一个\
  \ `Thread` 对象并通过 `Thread` 构造函数将该类的对象传递过去。当调用新创建的 `Thread` 类的 `start()` 方法时，派生类 `runnable`\
  \ 中的 `run()` 方法将被调用从而在系统中形成一个流。这听起来比上面的第一种方法复杂，对吧。但你也应该通过下面的练习尝试一下。\n\n#### 4. 练习通过实现\
  \ Runnable 接口创建线程\n我们通过通过第二种方法重建上面的 10 秒 `Thread` 示例。\n\n通过这种方法，你只需要对 `CountDownThread`\
  \ 类进行少量修改，将 `extends Thread` 改为 `implements Runnable` 即可。你会看到下面的代码很清晰。\n\n```java\n\
  public class CountDownThread implements Runnable {\n    @Override\n    public void\
  \ run() {\n        int count = 10;\n        for (int i = count; i > 0; i--) {\n\
  \            System.out.println(i);\n            try {\n                Thread.sleep(1000);\n\
  \            } catch (InterruptedException e) {\n                // TODO Auto-generated\
  \ catch block\n                e.printStackTrace();\n            }\n        }\n\
  \        System.out.println(\"Time out\");\n    }\n}\n```\n\n声明 `Thread` 的问题在两者之间没有太大，对吧。更大的区别在于启动\
  \ `Thread` 的方式。`main()` 方法中的代码需要修改如下：\n\n```java\npublic static void main(String[]\
  \ args) {\n    CountDownThread countDownThread = new CountDownThread();\n    Thread\
  \ thread = new Thread(countDownThread);\n    thread.start();\n}\n```\n\n\n\n\n请再次执行程序。这两种方法的结果是相同的。\n\
  \n## II. 在创建新线程时应用匿名类知识\n\n如果你忘记了 `Anonymous` 类是什么，可以再次阅读此链接中的课程。如果你好奇 `Thread`\
  \ 和 `Anonymous` 类之间到底有什么关系，那么我将这样简要地解释一下。线程基本上被视为系统（以及我们）执行并行任务的一种轻量级方式。为了让这种轻量化更加紧凑（在代码管理方面），`Thread`\
  \ 和 `Anonymous` 类的结合是实现这一想法的良好解决方案。因为这样我们完全不需要显式地声明一个 `Thread` 类，只需构造一个 `Anonymous`\
  \ 类并启动它。将 `Thread` 和 `Anonymous` 类结合起来是非常常见的，它们将这两个名字合并成了一个通用名称，称为“匿名线程”（`Anonymous\
  \ Threads`）。\n\n让我们看看“匿名化” `Thread` 的以下方法。我使用了上面的 `Thread` 倒计时示例供你查看。\n\n### 1.\
  \ 通过继承 Thread 类创建匿名线程\n\n让我们通过扩展 `Thread` 类重新创建一个 `Thread`，但按照如下方式对其进行“匿名化”。\n\n\
  ```java\npublic static void main(String[] args) {\n    Thread countDownThread =\
  \ new Thread() {\n        @Override\n        public void run() {\n            int\
  \ count = 10;\n            for (int i = count; i > 0; i--) {\n                System.out.println(i);\n\
  \                try {\n                    Thread.sleep(1000);\n              \
  \  } catch (InterruptedException e) { // TODO 自动生成的异常块\n                    e.printStackTrace();\n\
  \                }\n            }\n            System.out.println(\"Time out\");\n\
  \        }\n    };\n    countDownThread.start();\n}\n```\n\n看，上面就是一个 `Anonymous\
  \ Thread`（匿名线程）。此时，你们中的许多人会好奇 `Anonymous Thread` 是否真的有助于让代码管理更加紧凑。那么我还有几点想法可以后续讨论。\n\
  \n事实上，与普通的 `Thread` 相比，使用 `Anonymous Thread` 是否使代码紧凑取决于每个人的代码写法。你看，在那边构建普通 `Thread`\
  \ 的实践中（我将其简称为 `Thread-normal-Thread`），你必须构建一个非常明显的 `CountDownThread.java` 类，这段代码具有非常显式的内容。至于本节中的示例代码，我们不是从\
  \ `CountDownThread` 类或 `Thread` 类创建 `countDownThread` 对象，而是从一个继承自 `Thread` 类的 `Anonymous`\
  \ 类创建的。这种声明有助于减少创建另一个 Java 文件的需求，我们只需声明并使用它即可；此外，`Anonymous Thread` 还可以使用包含它的类的成员。\n\
  \n声明 `Thread` 和 `Anonymous Thread` 的另一个区别是，对于 `Thread` 你可以为它构建构造函数，因此你可以传递某些作为应用程序逻辑的变量给\
  \ `Thread`。而 `Anonymous Thread` 没有构造函数，所以你可能需要使用声明类的全局变量。但你也应该考虑，虽然使用 `Anonymous\
  \ Threads` 非常快速方便，但如果有这么多 `Anonymous Threads`，可能会导致该使用类中的代码膨胀，更难以管理。如下。\n\n回到 `Anonymous\
  \ Thread` 的知识，使用上面的代码，我们可以写得更加简洁。由于不需要声明对象名称，始终可以直接执行 `start()`，如下所示。\n\n```java\n\
  public static void main(String[] args) {\n    new Thread() {\n        @Override\n\
  \        public void run() {\n            int count = 10;\n            for (int\
  \ i = count; i > 0; i--) {\n                System.out.println(i);\n           \
  \     try {\n                    Thread.sleep(1000);\n                } catch (InterruptedException\
  \ e) {\n                    // TODO 自动生成的异常块\n                    e.printStackTrace();\n\
  \                }\n            }\n            System.out.println(\"Time out\");\n\
  \        }\n    }.start();\n}\n```\n\n### 2. 通过实现 Runnable 接口创建匿名线程\n\n如果你通过上述扩展\
