  \n# 第 19 节：this 和 super 关键字\n\n通过上一节，你已经熟悉了 Java 中的继承，通过它你已经知道如何声明继承关系、何时何时继承以及继承属性。以及子类从父类中获得什么值。在本节中，我们先不谈继承的话题，而是来看关键字\
  \ `this` 和 `super` 的定义和用法。它们非常重要，但如果你学得太早是没用的，因为它们与继承有关；如果你学得太晚，你将无法理解某些使用它们的场景。让我们开始吧。\n\
  \n## I. this 关键字\n\n你一定还记得。关键字 `this` 在第 17 节中的用法是，即当你想区分变量和类属性（如果它们具有相同的名称）时。在那个节中，我没有解释清楚这一点。这一部分将帮助你列出\
  \ `this` 的所有用途。\n\n如你所知，`this` 关键字意味着：这个对象。它反向引用对象，使得能够访问该对象的值。这里有 `this` 的几个有用作用，在今后的\
  \ Java 课程以及 Android 编程中也会经常看到它的用法。\n\n### 1. 在类中访问属性和方法时使用 this\n\n正如你在第 17 节中学到的，当你使用\
  \ `this` 访问类的属性时，当你使用 `this` 访问方法时，`this` 的作用是类似的。正如你所知，现在使用 `this` 的主要目的是当变量和类属性同名时，帮助区分它们。然而，你完全可以在任何时间任何访问这些属性和方法时使用\
  \ `this`，如下例所示。但你不应该随意使用 `this`，这会让我们的代码变得冗肿，下面的示例有点过度使用 `this`，我只是想多展示一些给你们看。\n\
  \n```java\npublic class Circle {\n    public float radius;\n\n    // 构造函数\n    public\
  \ Circle (float radius) {\n        this.radius = radius;\n    }\n\n    public void\
  \ calculatePerimeter() {\n        // 计算圆周并打印到控制台\n    }\n\n    public void calculateArea()\
  \ {\n        // 计算圆的面积并打印到控制台\n    }\n\n    public void printCircle() {\n      \
  \  System.out.println(\"Circle of radius =\" + this.radius);\n        this.calculatePerimeter();\n\
  \        this.calculateArea();\n    }\n}\n```\n\n### 2. 在类内部调用另一个构造函数时使用 this\n\n\
  根据构造函数那一节，我应该总是谈论这种用法，但我特意将其放在这一节中进行讨论。如果你的某个类中有多个构造函数，并且你想让某个构造函数调用另一个构造函数，通常这种调用可以帮助构造函数利用彼此的初始化代码，避免重复编写。`this`\
  \ 的用法与上面略有不同，即你必须带参数的形式进行调用，例如 `([parameter])`，就像调用方法一样。为了方便演示，我称之为 `this()`。\n\n\
  此时，调用时，`this()` 会根据其 `pass_parameter` 调用对应的构造函数。但调用另一个构造函数不会创建新类，而像在类内部调用某些函数一样利用该构造函数。请看这个例子。\n\
  \n```java\npublic class Rectangle extends Hoc {\n    public float height;\n    public\
  \ float width;\n\n    // 构造函数\n    public Rectangle() {\n        name = \"Rectangle\"\
  ;\n    }\n\n    // 构造函数\n    public Rectangle(float height, float width) {\n   \
  \     this(); // 调用 Rectangle ()\n        this.height = height;\n        this.width\
  \ = width;\n    }\n\n    // 构造函数\n    public Rectangle(float side) {\n        this(side,\
  \ side); // 调用 Rectangle (height, width)\n    }\n\n    public void calculatePerimeter()\
  \ {\n        p = 2 * (height + width);\n    }\n\n    public void calculateArea()\
  \ {\n        area = height * width;\n    }\n}\n```\n\n注意，在这种情况下 `this()` 关键字仅用于构造函数中，以便像上面示例那样利用其他构造函数；如果你把\
  \ `this()` 放在普通方法中，系统会报错。还有一点，如果使用 `this()`，那么它必须是构造函数内部的第一行代码，如果放在它后面，系统会报错，因为\
  \ `this()` 之前还有其他代码。\n\n```java\n// 构造函数\npublic Rectangle(float height, float width)\
  \ {\n    this.height = height;\n    this.width = width;\n}\n```\n\n### 3. 将 this\
  \ 作为参数传递给另一个方法或构造函数\n\n在这一部分，通过 Android 编程你会更多地使用它。正如 Java 节所示，这是将 `this` 作为参数传递给方法或构造函数。下面的例子展示了如何将\
  \ `this` 作为参数。在 `Foo` 类中，高亮的行显示了 `this`，因此你不需要使用 `new` 关键字来创建类。\n\n```java\npublic\
  \ class Foo {\n    public void useBarMethod() {\n        Bar theBar = new Bar();\n\
  \        theBar.barMethod(this);\n    }\n\n    public String getName() {\n     \
  \   return \"Foo\";\n    }\n}\n\npublic class Bar {\n    public void barMethod(Foo\
  \ obj) {\n        obj.getName();\n    }\n}\n```\n\n### 4. 将 this 作为返回值\n\n当结果为 `this`\
  \ 时，它返回该类的实例。这种 `this` 的用法可能会让你感到困惑。在看到我想讨论的困惑之前，先看这个示例，并且由于这种困惑，在这种情况下你可能不需要使用\
  \ `this`。如果你在在这种情况下知道 `this` 的真正含义，请自己留言。首先我有一个 `Student` 类。正如你所见，在 `getStudent()`\
  \ 方法中，该类返回了 `this` 关键字。\n\n```java\npublic class Student {\n    public String name;\n\
  \    public String age;\n\n    // 构造函数\n    public Student(String name, String age)\
  \ {\n        this.name = name;\n        this.age = age;\n    }\n\n    public Student\
  \ getStudent() {\n        return this;\n    }\n}\n```\n\n那么，在 `main()` 函数中，有一个 `Student`\
  \ 类声明，看 `main()` 如何使用 `getStudent()`。\n\n```java\npublic class MainClass {\n   \
  \ public static void main(String[] args) {\n        Student student = new Student(\"\
  Yellow\", \"20\");\n        System.out.println(\"Name: \" + student.getStudent().name);\n\
  \        System.out.println(\"Age: \" + student.getStudent().age);\n    }\n}\n```\n\
  \n\n\n\n\n```java\nStudent student = new Student(\"Yellow\", \"20\");\n\nSystem.out.println(\"\
  Name: \" + student.name); System.out.println(\"Age: \" + student.age);\n}\n```\n\
  \n## II. 关键字 super\n\n与 `this` 关键字不同，它帮助的是它自己。`super` 关键字帮助的是指向父类。也就是说，你可以愉快地理解为\
  \ `super` 不能用来指代“爷爷”类，而是指代当前对象的父类，即它最邻近的类。\n\n以下是 `super` 的的一些作用，你可以将 `this` 的作用与其他进行对比以查看差异，同时也便于记忆。\n\
  \n### 1. 在访问最近父父类的属性和方法时使用 `super`\n\n如果上述的第一个目的是为了在类中成员变量同名时区分哪些是变量，哪些是属性，那么 `super`\
  \ 的第一个目的就是当它们存在同名时，区分哪些是子类的值，哪些是最近的父类的值。子类方法与父类方法之间的同名情况比属性之间的同名更常见，而且这种同名是有意为之的，你可以预习否定课以更好地理解为什么会有这种同名。\n\
  \n接下来的示例展示了 `Circle` 类与其父类 `Geometry` 定义了相同的方法 `printName()`，然后 `super` 出现在 `Circle`\
  \ 的 `printName()` 中，帮助先调用父类的 `printName()`，然后执行剩余代码。同样，在 `Circle` 的括号内，你可以测试下面的代码。\n\
  \n```java\npublic class Geometry {\n    public String ten;\n\n    public void printName()\
  \ {\n        System.out.println(\"\\n\\n===== \" + name + \" =====\");\n    }\n\
  \    // 其他方法在此 // ...\n}\n\npublic class Circle extends Geometry {\n    // 构造函数\n\
  \    public Circle() {\n        ten = \"Circle\";\n    }\n    public void printName()\
  \ {\n        super.printName();\n        System.out.println(\"\\n Method from Circle\"\
  );\n    }\n    // 其他方法在此 // ...\n}\n\npublic class MainClass {\n    public static\
  \ void main(String[] args) {\n        // 对 Circle 进行简单测试\n        Circle circle\
  \ = new Circle();\n        circle.printName();\n    }\n}\n```\n\n### 2. 在调用最近父类的构造函数时使用\
  \ `super`\n\n与使用 `this` ([`传递参数`]) 的一样，`super` ([`传递参数`]) 帮助你调用，并利用最近父类中的初始化代码。就像关键字\
  \ `this()` 一样，`super()` 只在构造函数中使用，如果你在其他普通方法中放置 `this super()`，系统会产生错误。同样，如果存在关键字\
  \ `super()`，它必须在构造函数内部首先声明。\n\n```java\npublic class Geometry {\n    public String\
  \ name;\n\n    // 构造函数\n    public Geometry(String name) {\n        this.name =\
  \ name;\n    }\n    // 其他方法在此 // ...\n}\n\npublic class Circle extends Geometry\
  \ {\n    // 构造函数\n    public Circle() {\n        super(\"Circle\");\n    }\n   \
  \ // 其他方法在此 // ...\n}\n```\n\n所以我们刚刚看完了 `this` 和 `super` 这两个关键字的概念和用例。它们非常重要，并且在我们今后的项目或示例中会频繁出现，请慢慢掌握并练习使用它们。当然，这节课只有理论，与这两个关键字相关的实践将出现在接下来的课程中。\n\
  \n# 第 20 节：开始继承\n\n我们已经学习了面向对象编程中的许多重要知识，例如属性、方法、构造函数。但有一类知识可以被称为面向对象编程精髓，我们将从这节课开始接触它，它将给你一种以这种方式在应用程序中使用和组织类的方法。这种知识比你在之前课程中熟悉的方式完全更加先进和有效，那就是继承的知识。\n\
  \n如果你是 Java 和面向对象编程的新手，继承会让它变得稍微困难一点。在这一点上，Java 代码不再那么重要，你如何在应用程序中组织类或对象的结构才更重要。根据我的经验，在熟悉继承之后，会有无数问题向你袭来。是的，你会好奇什么时候该继承。也有理解继承的朋友，但继承的组织使得他们的“亲戚”关系广泛，导致继承变得更加混乱。那么我们什么时候应该阻止任何给定类的继承呢？等这些问题我将尝试在这系列继承课程中彻底涵盖，以便你有最好的方法将继承应用到你的产品中。\n\
  \n## I. 熟悉继承\n\n### 1. 什么是继承？\n\n面向对象编程中的继承指的是对象之间的关系，有些人说这种关系是父子关系，有些人说它是扩展关系。人们似乎更喜欢父子这个概念，但我认为开放性，而且最接近的，是理解为继承总是更好的。因为这本质上是一种重用，在某些情况下，它从其他对象扩展了对象的属性。\n\
  \n所以，为了理解一种实际的方法，假设我们首先有一个类，这个类可以由我们编写，或者从某处“采集”的，我们暂时将这个可用类命名为 `A`。然后，为了利用 `A`\
  \ 的功能或属性而不必重写（或复制，也许是盗版），我们构建继承自 `A` 的新类，我们称这个新类为 `B`。那么我们的 `B` 将拥有 `A` 拥有的方法和属性。有些时候继承并不是为了重用\
  \ `A` 的值，而是因为 `A` 的某些值不符合 `B` 的需求，也就是说继承自 `A` 也帮助 `B` 拥有（也被称为扩展的）那些不会改变 `A` 本质的值。这一点，我们关注的是重用，扩展目的我们将在下节课讨论。\n\
  \n### 2. 为什么要继承？\n\n通过我上面的观点，也许你也理解了必须继承的原因。\n\n嗯，继承的主要目的是重用，并进一步扩展从某个对象的可用属性和方法。仅此，继承的目的并不高深，但它带来的效果是非常巨大的。通过重用这些现有的东西，你的项目结构看起来会更专业，代码也更易读。\n\
  \n\n\n\n上述代码是继承的显式表示，其中 `Cylinder` 类使用 `extends` 关键字继承自 `Circle` 类。根据继承法则，`Cylinder`\
  \ 可以继承 `Circle` 声明的值（属性和方法）。通过这种继承关系，可以将 `Circle` 类称为“基类”（Base Class）或“父类”（Parent\
  \ Class），而 `Cylinder` 类被称为“派生类”（Derived Class）或“子类”（Subclass, Child Class）。\n\n\
  通常，超类（或基类）是为子类持有公共值（或基础值）的类。因此，如果你有多个具有相似性的层级，例如上述示例中的 `Circle` 和 `Cylinder`，这些层都具有圆形面（圆柱有两个圆形面），所以你可以使用\
  \ `Circle` 作为该层的基础（因为它包含了 `Cylinder` 可以利用的最小值，在本例中就是圆形面本身）。或者在某些情况下，有许多具有相似属性的类，你可以将它们合并为一个单一基类，然后子类只需继承并复用这些相似的值，而无需额外声明任何内容。在下方的练习中，我将创建一个最基础的类\
  \ `Geometry`，供 `Circle`、`Square`、`Rectangle` 等类使用。\n\n上面是一个需要继承的示例，但现在我想列出组织继承关系过程中的一些要点。\n\
  \n- 一个类只允许继承自且仅自一个父类。\n- 虽然不是继承自多个超类，但如果该继承对象可以从另一个超类继承，为了方便记忆，你可以将另一个超类称为“祖父类”，而且如果“祖父类”又继承了另一个类，那么肯定还存在“曾祖父类”。\n\
  - 如果一个类完全没有声明继承（如我们在之前课程中练习过的类），那么系统将默认它继承自 `Object` 类。在下节课程中，我们将讨论这个 `Object` 类。\n\
