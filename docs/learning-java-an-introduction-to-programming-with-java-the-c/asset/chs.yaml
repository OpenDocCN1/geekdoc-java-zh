  \ 类。通过检查此类系统中的某些 `Abstraction` 类，我们也得出了本节的结论。\n\n# 第 31 节：嵌套类\n\n看到标题，你可能已经知道本节的内容了。它是在另一个类内部声明类的知识。这不是父子关系，所以它不是继承，它只是在另一个类内部声明的类。所以，让我们找出什么是嵌套类，以及为什么要这样做。\n\
  \n## I. 什么是嵌套类？\n\n我重复一下上面的观点，嵌套类是在另一个类内部声明的类。\n\n包含其他类的类被称为 `Outer Class`（外部类），在越南语中可以理解为\
  \ `Bao class`。\n\n而 `Outer Class` 内部的类分为两个不同的类别：\n\n- 一个是非静态类（`non-static class`），它被称为\
  \ `Inner Class`（内部类）。\n- 另一种类型是静态类（`static class`），它被称为 `Static Nested Class`（静态嵌套类）。\n\
  \n先不谈每种类型 `Inner Class` 和 `Static Nested Class` 的角色，让我们来看每种声明语法，如下。\n\n这是 `Inner\
  \ Class` 的语法：\n```java\nclass OuterClass {\n    ...\n    class InnerClass {...\n\
  \    }\n}\n```\n\n这是 `Static Nested Class` 的语法：\n```java\nclass OuterClass {...\n\
  \    static class StaticNestedClass { ... } \n} \n```\n\n这两种语法的区别仅仅在于 `static` 关键字。通过上面的语法，我们有以下需要记住的观点。\n\
  \n然而，语法只有一个 `Outer Class` 包含一个 `Inner Class` 或内部的 `Static Nested Class`。但你应该知道，`Outer\
  \ Class` 内部可以包含多个 `Inner Class`、多个 `Static Nested Class`，或者同时包含 `Inner Class` 和\
  \ `Static Nested Class`。\n\n- 尽管语法仅提到嵌套类，但你可以在类中嵌套接口，或者将接口嵌套在一起，或者将类嵌套到接口中。\n- `Inner\
  \ class` 现在被视为 `Outer Class` 的成员，因此你可以为它指定访问权限，如 `private`、`public`、`protected`\
  \ 或 `default`（即没有访问权限声明）。这与你熟悉的 `Outer Class` 或类不同，类只能被声明为 `public` 或 `default`（此声明仅允许相同包中的类可见）。\n\
  \n## • 练习声明与使用内部类\n\n请记住，嵌套类的应用非常多，但是否使用它们是可选的，如果需要，这并不困难。\n\n在这个练习中，我们将看到如何定义和使用一个\
  \ `Inner Class`。在这个练习之后，我们将在以后更具体地讨论嵌套类的用途。\n\n以下代码声明了位于 `Geometry` 类内部的 `Coordinate`\
  \ 类。你也可以像在某些课程中做的那样在 `Geometry` 外部声明 `Coordinate` 类。\n\n```java\npublic class Geometry\
  \ {\n    public final float PI = 3.14f;\n    public String name;\n    public Coordinate\
  \ coordinate;\n\n    // 构造函数\n    public Geometry(int x, int y) {\n        this.name\
  \ = \"Geometry\";\n        this.coordinate = new Coordinate();\n        this.coordinate.x\
  \ = x;\n        this.coordinate.y = y;\n    }\n\n    public class Coordinate {\n\
  \        int x;\n        int y;\n        public void printInfo() {\n           \
  \ System.out.println(\"Shape: \" + name);\n            System.out.println(\"Coordinate:\
  \ x = \" + x + \"; y = \" + y);\n        }\n    }\n}\n```\n\n通过上面的代码，我们可以看到在 `Geometry`\
  \ 类中放置 `Coordinate` 类。你也可以在 `Geometry` 外部声明 `Coordinate` 类，正如你在某些课程中做的那样，但通过将 `Coordinate`\
  \ 放在 `Geometry` 中，你可以看到 `Geometry` 的属性。\n\n```java\npublic class MainClass {\n \
  \   public static void main(String[] args) {\n        Geometry geometry = new Geometry(10,\
  \ 20);\n        geometry.coordinate.printInfo();\n    }\n}\n```\n\n我们将收到以下信息：\n\
  ```\nShape: Geometry\nCoordinate: x = 10; y = 20\n```\n\n在 `main()` 方法的上述代码中，我们可以看到\
  \ `Geometry` 对象并使用它的变量。你也可以这样声明 `Coordinate` 类，如下：\n\n```java\npublic class MainClass\
  \ {\n    public static void main(String[] args) {\n        Geometry geometry = new\
  \ Geometry(10, 20);\n        Geometry.Coordinate coordinate = geometry.new Coordinate();\n\
  \        coordinate.printInfo();\n    }\n}\n```\n执行上述 `main()` 行，你将得到略有不同的输出如下。你能告诉自己为什么结果会有所不同吗？\n\
  \n```\nShape: Geometry\nCoordinate: x = 0; y = 0\n```\n\n上面的写法像一个私有对象让你觉得奇怪但熟悉？你可能理解\
  \ `Geometry`。因此 `Geometry` 对象只是 `Geometry`。在这一点上，`Coordinate` 被视为成员，你可以通过这种方式初始化独立的\
  \ `Coordinate`。我们在练习#2 节中处理 `Circle circle = new MyFirstClass(). Circle();`\n\n\
  ` 练习声明与使用静态嵌套类我也将使用上面练习的脚本，但将 `Geometry` 内部的 `Coordinate` 类替换为 `Static Nested Class`。看看是否有任何区别。\n\
  \n```java\npublic class Geometry {\n    public static final float PI = 3.14f;\n\
  \    public static String name;\n    public Coordinate coordinate;\n\n    // 构造函数\n\
  \    public Geometry(int x, int y) {\n        this.name = \"Geometry\";\n      \
