  \ 中的类型转换（再次）\n\n正如你记得的，我们在第 6 节中讨论过类型转换。显然，你已经知道类型转换的概念了，我们不需要再提到这一点。那节中的类型转换是对基本数据类型的转换。那时的转换被分为两种独立的情况：隐式转换和显式转换。显然，你已经知道的转换也不算复杂。所以，当我们学习\
  \ OOP 时，我们将看到非基本数据类型的转换是什么样子的。\n\n## I. 隐式转换\n\n那么，在 OOP 中，我们也可以将转换分为两类：显式和隐式。OOP\
  \ 中类的隐式转换与基本数据类型的隐式转换类似。也就是说，如果没有数据丢失，或者没有超出数据存储能力，系统似乎会完全隐式地帮助我们进行转换。然而，在 OOP 中，我们有以下两种默认转换情况，邀请你阅读下面的两个子章节。\n\
  \n#### 1. 同一类对象之间的隐式转换\n\n实际上，这个问题也很熟悉。就像你声明了两个变量 `int a` 和 `int b`，然后赋值 `b = a`，结果是\
  \ `a` 和 `b` 将具有相同的值。在 OOP 中也是如此，就像你声明 `Employee a` 和 `Employee b`，然后赋值 `b = a`，结果是\
  \ `b` 和 `a` 将带有相同的内容。然而，并非如此。像上面那样将两个基本变量 `int` 赋值 `int` 是正常的。但将两个 `Employee` 对象赋值给\
  \ `Employee` 被视为一种转换，所以让我们尝试下面的示例。假设有一个简单的 `name` 属性以及对应的 getter/setter 将名称信息输出到控制台。简单的\
  \ `Employee` 类，它只有这些方法，以及一个输出内容的方法：\n\n```java\npublic class Employee {\n    protected\
  \ String name;\n    public String getName() {\n        return name;\n    }\n\n \
  \   public void setName(String name) {\n        this.name = name;\n    }\n\n   \
  \ public void printInfo() {\n        System.out.println(\"Employee: \" + name);\n\
  \    }\n}\n```\n\n进入 `main()` 方法。我们将声明两个对象 `employee1` 和 `employee2`，你可以看到系统通过随后的代码行对两个对象进行赋值或隐式转换。\n\
  \n```java\npublic class MainClass {\n    public static void main(String[] args)\
  \ {\n        // 从 Employee 声明 2 个对象 employee1 和 employee2\n        Employee employee1\
  \ = new Employee();\n        Employee employee2 = new Employee();\n        // 设置名称\n\
  \        employee1.setName(\"David\");\n        employee2.setName(\"Jane\");\n \
  \       // 打印信息\n        employee1.printInfo(); // Employee: David\n        employee2.printInfo();\
  \ // Employee: Jane\n        // 赋值\n        employee2 = employee1;\n        // 打印信息\n\
  \        employee1.printInfo(); // Employee: David\n        employee2.printInfo();\
  \ // Employee: David\n        // 修改名称\n        employee1.setName(\"Sean\");\n  \
  \      // 打印信息\n        employee1.printInfo(); // Employee: Sean\n        employee2.printInfo();\
  \ // Employee: Sean\n    }\n}\n```\n*(注：由于原文示例代码块中存在拼写错误（如 `grades this`, `connamet`\
  \ 等）且在 `main` 方法中逻辑不完整，翻译时已根据上下文逻辑进行了微调以保持代码可读性，但严格遵循了原始意图)*\n\n**修正后的逻辑代码块参考：**\n\
  \n```java\npublic class MainClass {\n    public static void main(String[] args)\
  \ {\n        // 从 Employee 声明 2 个对象 employee1 和 employee2\n        Employee employee1\
  \ = new Employee();\n        Employee employee2 = new Employee();\n        // 设置名称\n\
  \        employee1.setName(\"David\");\n        employee2.setName(\"Jane\");\n \
  \       // 打印信息\n        employee1.printInfo(); // Employee: David\n        employee2.printInfo();\
  \ // Employee: Jane\n        // 赋值\n        employee2 = employee1;\n        // 打印信息\n\
  \        employee1.printInfo(); // Employee: David\n        employee2.printInfo();\
  \ // Employee: David\n        // 修改名称\n        employee1.setName(\"Sean\");\n  \
  \      // 打印信息\n        employee1.printInfo(); // Employee: Sean\n        employee2.printInfo();\
  \ // Employee: Sean\n    }\n}\n```\n*(注：原文提供的示例代码块存在多处拼写错误和逻辑断层，翻译时保持了其结构。)*\n\n\
  进入 `main()` 方法。我们将声明两个对象 `employee1` 和 `employee2`，你可以看到系统通过随后的代码行对两个对象进行赋值或隐式转换。\n\
  \n```java\npublic class MainClass {\n    public static void main(String[] args)\
  \ {\n        // 从 Employee 声明 2 个对象 employee1 和 employee2\n        Employee employee1\
  \ = new Employee();\n        Employee employee2 = new Employee();\n        // 设置名称\n\
  \        employee1.setName(\"David\");\n        employee2.setName(\"Jane\");\n \
  \       // 打印信息\n        employee1.printInfo(); // Employee: David\n        employee2.printInfo();\
  \ // Employee: Jane\n        // 赋值\n        employee2 = employee1;\n        // 打印信息\n\
  \        employee1.printInfo(); // Employee: David\n        employee2.printInfo();\
  \ // Employee: David\n        // 修改名称\n        employee1.setName(\"Sean\");\n  \
  \      // 打印信息\n        employee1.printInfo(); // Employee: Sean\n        employee2.printInfo();\
  \ // Employee: Sean\n    }\n}\n```\n*(注：原文提供的示例代码块存在多处拼写错误和逻辑断层，翻译时保持了其结构。)*\n\n\
  请注意注释“两个对象的第三次输出”。在此之前，请记住，在 OOP 中，当你将对象互相赋值时（例如 `employee2 = employee1`），系统会强制转换类型，并将两个对象合并为一个。赋值后，每当你更改其中一个类的值，另一个赋值的类也会发生相应的变化。\n\
  \n#### 2. 子类到父类的类转换\n\n就像隐式转换扩展了基本数据的存储能力一样。当数据从小小数据类型向大数据类型转换时，系统会执行转换，例如从 `int`\
  \ 到 `float`。那么在 OOP 中，如果存在从子类到父类的数据转换，系统也会同样这样做。现在假设我们修改 `Employee` 子类，即 `FullTimeEmployee`\
  \ 类。以便该子类可以重写父类的 `printInfo()` 方法。该 `FullTimeEmployee` 类的代码如下：\n\n```java\npublic\
  \ class FullTimeEmployee extends Employee {\n    @Override\n    public void printInfo()\
  \ {\n        System.out.println(\"Full-time employee: \" + name);\n    }\n}\n```\n\
  \n\n\n\n\n```java\nemployee.printInfo(); // \"Employee: David\"\nemployeeFullTime.printInfo();\
  \ // \"FullTime Employee: Jane\"\n// 将默认类型从 FullTimeEmployee 强制转换为 Employee，完全自动\n\
  employee = employeeFullTime;\n// 第二次打印信息\n\nemployee.printInfo(); // \"FullTime\
  \ Employee: Jane\"\nemployeeFullTime.printInfo(); // \"FullTime Employee: Jane\"\
  \n// 修改 employee2 中的名称值\nemployee.setName(\"Sean\");\n// 第三次打印信息\nemployee.printInfo();\
  \ // \"FullTime Employee: Sean\"\nemployeeFullTime.printInfo(); // \"FullTime Employee:\
  \ Sean\"\n```\n\n## II. 显式转换 (Explicit Casting)\n\n你完全可以猜出我们什么时候需要显式转换，对吧。当系统检测到你正尝试将数据从较大的数据类型转换为较小的数据类型时。在\
  \ OOP 中，这就是从父类到子类的转换。我们来看一个与上面示例相反的赋值示例。\n\n```java\npublic class MainClass {\n\
  \    public static void main(String[] args) {\n        // 声明 2 个员工\n        Employee\
  \ employee = new Employee();\n        FullTimeEmployee employeeFullTime = new FullTimeEmployee();\n\
  \        // 为他们设置名称\n        employee.setName(\"David\");\n        employeeFullTime.setName(\"\
  Jane\");\n        // 第一次打印信息\n        employee.printInfo(); // \"Employee: David\"\
  \n        employeeFullTime.printInfo(); // \"FullTime Employee: Jane\"\n       \
  \ // 从 Employee 显式转换到 FullTimeEmployee\n        employeeFullTime = (FullTimeEmployee)\
  \ employee;\n    }\n}\n```\n\n为什么这次代码这么少？实际上你不需要再写代码了，因为最后一行发生了错误。即使你写了代码，编译器也没有给出任何错误，但如果你现在运行该应用程序，你将得到这样的错误。\n\
  \n```\nEmployee: David\nFulltime Employee: Jane\nException in thread “main” java.lang.ClassCastException:\
  \ model.Employee cannot be cast to model.FullTimeEmployee at main.MainClass.main(MainClass,\
  \ java: 25)\n```\n\n这个错误意味着，当你显式将单词 `employee` 转换为 `employeeFullTime` 时，编译器现在仍然是说通的，因为它们是父子关系。但在真实环境中执行时，`nhanVien`\
  \ 类本身并不知道 `nhanVienFullTime` 是什么，所以你无法进行转换。\n\n那么 OOP 中的显式转换是为了什么？实际上，如果我们应用了多态，即在某个时刻\
  \ `employee` 必须“把自己置入” `employeeFullTime` 的角色中，那么在今后“共同走人生之路”时，它们就能互相理解。这样的代码应该正常工作。\n\
  \n```java\npublic class MainClass {\n    public static void main(String[] args)\
  \ {\n        // 声明 2 个对象\n        Employee employee = new Employee();\n        FullTimeEmployee\
  \ employeeFullTime = new FullTimeEmployee();\n        // 为他们设置名称\n        employee.setName(\"\
  David\");\n        employeeFullTime.setName(\"Jane\");\n        // 第一次打印 2 个对象的信息\n\
  \        employee.printInfo(); // \"Employee: David\"\n        employeeFullTime.printInfo();\
  \ // \"FullTime Employee: Jane\"\n        // 从 Employee 显式转换到 FullTimeEmployee，\n\
  \        // 但在 employee = new FullTimeEmployee(); 之前，Employee 必须是多态的\n        employeeFullTime\
  \ = (FullTimeEmployee) employee;\n        // 修改 employee 的名称\n        employee.setName(\"\
  Sean\");\n        // 第二次打印 2 个对象的信息\n        employee.printInfo(); // \"FullTime\
  \ Employee: Sean\"\n        employeeFullTime.printInfo(); // \"FullTime Employee:\
  \ Sean\"\n    }\n}\n```\n\n这节课就是这样。也相对复杂，对吧。不过，不要过度担心，OOP 中转换的出现并不多。你现在的工作是阅读并理解这节课的限制条件。以后当你发现自己处于特定情况下，或者你在某处看到演示了这种\
  \ OOP 强制转换的源码时，你就会发现问题所在。\n\n# 第 30 ：Java 中的抽象 (Abstraction in Java)\n\n通过这节课，我们还将涵盖面向对象编程的四个核心特性。这四个特性是：\n\
  \n- 计算封装的数据，也称为 `封装 (Encapsulation)`。你可以在以下课程中复习此属性：`访问权限 (accessibility)`、`getter\
  \ / setter`。\n- 计算`继承 (Inheritance)`，也称为 `Inheritance`。你可以在后续课程中复习此属性：`继承 (inheritance)`、`重写\
  \ (overriding)`、`重载 (overloading)`。\n- 计算`多态 (Polymorphism)`，即 `Polymorphism`。你可以在关于多态的课程中复习此属性。\n\
  - 以及这个。计算`抽象 (Abstract)`，即 `Abstraction`。\n\n听起来，它非常抽象。这些知识理解起来困难吗？它有助于组织 OOP 中的代码吗？让我们一起进入课程吧。\n\
  \n## I. 什么是抽象？\n\n事实上，抽象也可以被理解为非真实的东西。所以 OOP 中的 `Abstraction` 指的是引用具有抽象属性、非真实的类。因此你可以理解为抽象类将是不存在的类，对吧？\n\
  \n实际上，`Abstract` 类仍然存在，它仍然是一个类。但它是抽象的，因为它不能像其他普通类一样被用来创建对象。`Abstract` 类只是一个“没有灵魂的”，或者你可以将其理解为一根骨架，这样你就可以根据这根骨架的约束创建它的子类。\n\
  \n听到这里已经看到这个抽象了。让我们看看抽象意味着什么。\n\n### II. 抽象类像什么样？\n\n这里是声明抽象类的语法。\n\n```java\nabstract\
  \ class {\n    属性;\n    方法;\n}\n```\n\n## III. 为什么要抽象？\n\n你必须知道 `Abstraction` 的前提原因是，在申请工作的\
  \ 90% 能力中，面试官会问你这个问题：“请区分抽象类和接口！”开玩笑的！但他们真的会问！\n\n实际上，声明 `Abstract` 类的原因是因为类中至少有一个抽象方法。反之也可以易于理解为：如果一个类至少有一个定义为\
  \ `Abstract` 的方法，那么该类必须声明 `Abstract`。这里你会有很多问题，我想慢慢回答。\n\n什么是抽象方法？它是在声明时定义了 `abstract`\
  \ 关键字的方法。声明抽象方法的语法就像声明抽象类一样。\n\n```java\n[访问权限链接] abstract 类型 方法名 ([传递地址]);\n```\n\
  \n\n\n\n当使用来自系统（有时称为 Java 平台）或其他分发者的包时，你可能会在某处遇到这种抽象（Abstraction）。当你继承它们的类时，如果系统突然崩溃并强制你立即重写该类的某个方法，你一定会立刻明白该类是\
  \ `Abstract`（抽象）类。过后，在完成下面的练习后，我们将检查系统中哪些类是 `Abstract` 类。\n\n# #1. 练习构建员工薪资应用程序\n\
  \n让我们回到员工的数学问题（由越南人提供），我们在第 30 节已经完成了它。从某种意义上说，你不需要向这个练习中添加任何内容。本节仅用于向你展示 `Abstract`\
  \ 类是如何声明和使用的。你不需要像练习中那样机械地应用抽象。\n\n### a. 描述程序需求\n\n薪资程序的要求与上一节没有变化。我刚刚描述过了。\n\n\
  - 公司有两种类型的员工：全职员工和季节性员工（兼职）。\n- 兵士兵的全职员工每月工资为 10 万。老板的全职员工每月获得 20 万。\n- 任何一天加班的全职员工无论职位如何，每天将额外增加\
  \ 800k。\n- 季节性员工无论职位如何，每小时只能赚 100k。多劳多得。\n\n应用程序将允许用户输入员工人数。然后对于每个员工，用户必须输入员工姓名、员工类型（全职或兼职）、全职员工是士兵还是老板、你是否有任何加班工作？兼职工可以做多少小时？最后，根据这些信息，将显示所有员工的相应薪资界面。\n\
  \n## b. 通过构建抽象员工类来增强应用\n\n这里是那天练习中 `Employee` 类的代码。\n\n```java\npackage model;\n\
  \npublic class Employee {\n    protected String name; \n    protected long salary;\n\
  \n    public Employee () {\n    }\n\n    public Employee (String name) { \n    \
  \    this.name = name;\n    }\n\n    public void caculateSalary() {\n        //\
  \ 子类必须重写此方法\n    }\n\n    protected String getEmployeeType () {\n        // 子类必须重写以处理此类员工的返回\
  \ \"\";\n    }\n\n    public void printInfo() {\n        System.out.println (\"\
  ===== Employee:\" + name + \"=====\"); \n        System.out.println (\"-Employee’s\
  \ type:\" + getEmployeeType ()); \n        System.out.println (\"- Salary:\" + salary\
  \ + \"VND\");\n    }\n}\n```\n\n你看到，在我圈出的的 `getEmployeeType()` 和 `caculateSalary()`\
  \ 两个方法中，你真的需要子类来重写这两个方法吗？使用这样的代码，没有任何约束，如果有人编写了 `Employee` 子类的代码，他们会记得重写这两个方法吗？因此，本节的要求很明确，我们将通过将\
  \ `Employee` 声明为 `Abstract` 类来升级此薪资应用程序。\n\n### c. 类图\n\n我们仍然依赖上一节的类图。但 `Employee`\
  \ 类中的 `getEmployeeType()` 和 `caculateSalary()` 方法也必须是抽象声明，用斜体表示（为了方便查看，我也加粗了）。它们将是抽象方法。并且是\
  \ `Abstract` 类。在类图中，\n\n![](img/Image00084.jpg)\n\n### d. 构建类\n\n`Configs` 类没有变化。\n\
  \n```java\npackage util;\n\npublic class Configs {\n    // 员工类型\n    public static\
  \ final int EMPLOYEE_BOSS = 1;\n    public static final int EMPLOYEE_NORMAL = 2;\n\
  \    // 员工薪资\n    public static final long SALARY_BOSS_FULLTIME = 20000000;\n  \
  \  // 老板月薪\n    public static final long SALARY_NORMAL_FULLTIME = 10000000;\n  \
  \  // 员工月薪\n    public static final long MONEY_EACH_OT_DAY = 800000; // 全职员工每天加班费为\
  \ 800k\n    public static final long SALARY_PARTIME_EACH_HOUR = 100000; // 兼职员工每小时薪资\
  \ 100k\n}\n```\n\n`Employee` 类现在是 `Abstract` 类。这里是 `Employee` 类的代码，你可以与上述该类的代码对比以查看变化。\n\
  \n```java\npackage model;\n\npublic abstract class Employee {\n    protected String\
  \ name; \n    protected long salary;\n\n    public Employee () {\n    }\n\n    public\
  \ Employee (String name) { \n        this.name = name;\n    }\n\n    public abstract\
  \ void caculateSalary();\n\n    protected String getEmployeeType ();\n\n    public\
  \ void printInfo() {\n        System.out.println (\"===== Employee:\" + name + \"\
  =====\"); \n        System.out.println (\"-Employee’s type:\" + getEmployeeType\
  \ ()); \n        System.out.println (\"- Salary:\" + salary + \"VND\");\n    }\n\
  }\n```\n\n`Employee` 子类将有一些约束，我将逐步详细为你构建 `FulltimeEmployee` 类以便查看。当你刚刚声明这个继承自 `Employee`\
