  # 第 21 节：继承中的重写（Overriding）\n\n通过这节课，我将介绍继承知识中的下一个点。如果你在第 21 节中已经学会了如何使用 `extends`\
  \ 关键字来表示从一个类到另一个类的继承，并且你已经习惯了将从 `Parent` 类（或 `Base` 类）的所有值复用到 `Child` 类（或 `Derivative`\
  \ 类），那么那时我称之为“继承中的复用”。现在我们将来看继承的另一个方面，它不再是简单的复用，而是“重写”。\n\n## I. 什么是重写？\n\n覆盖（Veto/Override）也是继承的一个特性。我以前习惯使用\
  \ `veto` 这个词，可能是因为使用 `C++` 或 `C#` 时的习惯。当我来到 Java 语言时，我发现它被称为 `Override`。\n\n正如我之前提到的，如果你熟悉继承，你就知道这个概念意味着特性的复用，我们简要回顾了第\
  \ 21 节，这个特性允许子类默认获取其父类已声明（并允许）的方法和属性。\n\n覆盖（Veto）特性又是怎样的？这个属性允许子类声明与父类方法相同的方法，然后子类将重新定义该方法的内容，这意味着“不认可”父类的方法。正因为这种对父类的含义，人们经常称之为\
  \ Veto（或 `Overriding`，或 `Override`）。\n\n## II. 如何进行重写？\n\n如上所述，为了满足重写，你只需要在子类中声明一个与父类方法同名，并传递与父类方法相同的参数。然后，虽然不是强制性的，但为了代码的清晰性，你应该在每个重写方法上声明一个注解（英语中称为\
  \ `Annotation`），其内容为 `@Override`。\n\n通过子类中这个被重写的方法，你可以重新设计其内部逻辑。一旦在某处调用该子类的方法，根据继承原则，将使用子类的方法，而不是使用父类的方法。\n\
  \n让我们来看下面的示例。该示例将使用两个类 `Circle` 和 `Cylinder`，其中 `Cylinder` 继承自 `Circle`。让我们按照下面的类图，在两个类中都声明\
  \ `printInfo()` 方法![](img/Image00073.jpg)\n\n它们的代码简单如下。\n\n```java\npublic class\
  \ Circle {\n    public void printInfo() {\n        System.out.println(\"This is\
  \ Circle\");\n    }\n}\n\npublic class Cylinder extends Circle {\n    @Override\n\
  \    public void printInfo() {\n        System.out.println(\"This is Cylinder\"\
  );\n    }\n}\n```\n\n按照上述方式声明这两个类，你就可以看到如何在 `main()` 函数中调用它们。\n\n```java\npublic\
  \ class MainClass {\n    public static void main(String[] args) {\n        Circle\
  \ Circle = new Circle();\n        Cylinder Cylinder = new Cylinder();\n        Circle.printInfo();\n\
  \        Cylinder.printInfo();\n    }\n}\n```\n\n如果你执行该程序，你将看到两个类中的两个 `printInfo()`\
  \ 命令将在控制台上打印如下所示的内容：\n\nThis is Circle\nThis is Cylinder\n\n这是因为 `Circle` 中的 `printInfo()`\
  \ 被 `Cylinder` 中的 `printInfo()` 重写（或覆盖、改写）了。如果你尝试删除 `Cylinder` 中的 `printInfo()`，你将得到相同的两行打印到控制台的内容，这是因为如果没有这个重写，继承的复用将会发挥作用。你已经理解了重写的概念，对吧。\n\
  \n这里有一个开放思路给你。也就是说，如果你希望重写方法使用父类的重复方法，你可以像下面的示例一样使用 `super` 关键字。\n\n```java\npublic\
  \ class Cylinder extends Circle {\n    @Override\n    public void printInfo() {\n\
  \        super.printInfo();\n        System.out.println(\"This is Cylinder\");\n\
  \    }\n}\n```\n\n### 继承练习（负）\n\n重写的理论仅如此。很容易记忆，对吧。现在让我们尝试在 `Circle` 和 `Cylinder`\
  \ 两个层之间建立一个完整的关系。这仍然是继承，但你会看到复用和覆盖特性的完整范围。你可以为这个练习创建一个新项目。\n\n让我们来看下面的类图![](img/Image00074.jpg)\n\
  \n在 `Circle` 类中，我们不需要像之前的练习那样编写一个方法让用户从控制台输入半径，而是立即将此半径传递给构造函数。`calculateParimeter()`\
  \ 和 `calculateArea()` 方法根据从构造函数获取的半径返回计算结果。最后，`printInfo()` 方法将像上面的示例一样，该方法将被继承\
  \ `Cylinder` 类重写。\n\n```java\npublic class Circle {\n    public final float PI =\
  \ 3.14f;\n    public float radius;\n\n    // 构造函数\n    public Circle(float radius)\
  \ {\n        this.radius = radius;\n    }\n\n    public float calculateParimeter()\
  \ {\n        return 2 * PI * radius;\n    }\n\n    public float calculateArea()\
  \ {\n        return PI * radius * radius;\n    }\n\n    public void printInfo()\
  \ {\n        System.out.println(\"This is Circle\");\n        System.out.println(\"\
  Circle has Parimeter: \" + calculateParimeter() + \" and Area: \" + calculateArea());\n\
  \    }\n}\n```\n\n在 `Cylinder` 类中，该类继承了 `PI` 和 `radius` 属性，`calculateParimeter()`\
  \ 和 `calculateArea()` 方法。`Cylinder` 额外声明了属性 `height` 和方法 `calculateVolume()`。最后，`printInfo()`\
  \ 方法将重写父类。\n\n```java\npublic class Cylinder extends Circle {\n    public float\
  \ height;\n\n    // 构造函数\n    public Cylinder(float radius, float height) {\n  \
  \      super(radius);\n        this.height = height;\n    }\n\n    public float\
  \ calculateVolume() {\n        return calculateArea() * height;\n    }\n\n    @Override\n\
  \    public void printInfo() {\n        System.out.println(\"This is Cylinder\"\
  );\n        System.out.println(\"Cylinder has Volume: \" + calculateVolume());\n\
  \    }\n}\n```\n\n完成。现在我们将在 `main()` 函数中使用它们。\n\n```java\npublic class MainClass\
  \ {\n    public static void main(String[] args) {\n        Circle Circle = new Circle(10);\n\
  \        Cylinder Cylinder = new Cylinder(10, 20);\n        Circle.printInfo();\n\
  \        Cylinder.printInfo();\n    }\n}\n```\n\n这是运行程序的结果。\n\nThis is Circle\n\
  Circle has Parimeter: 62.800003 and Area: 314.0\nThis is Cylinder\nCylinder has\
  \ Volume: 6280.0\n\n我们刚刚看到了 OOP 知识系列中的又一个特性。通过这些重写的知识，我将其视为继承的一部分，它讨论了 Veto，除了我们在上一节课中已经熟悉的\
  \ Reuse。\n\n# 第 22 节：Object 类\n\n在此时出现 Object 类可能会让人有点困惑。但当你刚开始接触 Java 时，在你的几行代码中，这个类已经出现了。这个类名为\
  \ `Object`，由系统提供，并将其指定所有类的最高超类。为了更好地理解，让我们回顾一下之前课程中美丽的 Circle 类声明。\n\n```java\n\
  public class Circle {\n```\n\n\n\n你看到这个 `Circle` 类没有继承任何其他类，你认为它是最高父类，但如果有其他类声明继承自它又该呢？不，正如我上面提到的，在\
  \ Java 中，如果你没有为某个类指定父类，该类的默认系统会继承自一个类，即 `Object` 类。但由于它是其他类默认继承的（除了那些显式声明继承自另一个类的类，因为你已经知道一个类不能有多个父类），所以你不需要显式地声明它。显式地说明继承这个\
  \ `Object` 类的作用。下面的代码我想把它显式地写出来，目的是让你知道像这样的声明是隐式的，没人会那样写。\n\n```java\npublic class\
  \ Circle extends Object { }\n```\n\n## II. Object 类是干什么用的？\n\n嗯，你肯定会奇怪，这到底造了什么鬼，好让它能成为另一个类的父亲？\n\
  \n事实上，如果你读完我下述的思路，你会发现 `Object` 类非常重要。首先，`Object` 可以让你预先声明一个对象，但你还不知道那个对象是什么，在特定的情况下，之后你会将这种临时的\
  \ `Object` 类强制转换为对应的特定子类。这听起来很模糊，但请记住，在接下来的课程中你会理解这个好处。其次，正如你已经知道继承的主要用途，它有助于将具有相似值的类分组到同一个基类中，例如第\
  \ 21 课示例，`Geometry` 类是 `Circle`、`Rectangle`、`Square` 等类的基类。`Object` 类也是如此，这个类现在充当了你在\
  \ Java 项目中创建的任何类的基类。因此，这里的基类将包含对其他类最有用的公共值，请继续下看。\n\n## III. Object 类提供的方法\n\n`Object`\
  \ 类的以下方法没有直接的实际意义，也就是说，你只需要读一下并把它放在那儿即可，你以后可以使用。你应该记住，这些方法通过 `Object` 对所有类都是可用的，所以你简要读一下，然后记住，以后会有机会用到它，不要自己去重新设计它。拜托了。\n\
  \n### 1. `public final Class getClass ()`\n\n此方法返回一个 `Class` 类，`Class` 类包含了与被构造对象相关的可用信息。\n\
  \n你可以参考以下代码，你看，我们没有声明这些方法，它们在 `Object` 类中可用，我们只需要获取它们来使用。\n\n```java\npublic static\
  \ void main(String[] args) {\n    Circle Circle = new Circle();\n    System.out.println(\"\
  Infomation of object Circle: \" + Circle.getClass());\n    System.out.println(\"\
  Infomation of object Circle: \" + Circle.getClass().getName());\n    System.out.println(\"\
  Infomation of object Circle: \" + Circle.getClass().getSimpleName());\n}\n```\n\n\
  结果打印了关于此对象的一些有用信息，取决于你在 `Class` 中深度调用的方法。\n`Information of object Circle: class\
  \ shapes.Circle`\n`Information of object Circle: shapes.Circle`\n`Information of\
  \ object Circle: Circle`\n\n### 2. `int hashCode ()`\n\n此方法返回一个哈希值。我以前从未用过这个方法，但我想它可以作为区分不同对象的值。\n\
  \n如下代码所示，你可以看到打印同一类两个对象的哈希值的情况。\n\n```java\npublic static void main(String[] args)\
  \ {\n    Circle circle1 = new Circle();\n    Circle Circle2 = new Circle();\n  \
  \  System.out.println(\"Hashcode of Circle 1: \" + circle1.hashCode());\n    System.out.println(\"\
  Hashcode of Circle 2: \" + Circle2.hashCode());\n}\n```\n\n`Hashcode of Circle 1:\
  \ 1735600054`\n`Hashcode of Circle2: 21685669`\n\n### 3. `boolean equals (Object\
  \ obj)`\n\n这个 `equals()` 方法熟悉吗？不？记住它。实际上，在第 13 课关于 `String` 的课程中，我提到过 `String` 中的这个\
  \ `equals()` 方法，它可以帮助比较两个 `String` 是否相同。现在你知道 `String` 也是一个 `Object`，所以它也会从父类 `Object`\
  \ 继承这个 `equals()` 方法。但更有趣的是，`String` 的 `equals()` 重写了这个类的方法，而不是完全继承。所以类似于 `String`，这个\
  \ `equals()` 方法有助于比较任何两个对象以判断它们是否相同。两个对象被认为是恒等的，不是因为它们创建自同一个类，而是因为它们具有相同的引用值。这个引用问题实际上与指针知识有关，但\
  \ Java 不想让程序员知道指针，所以我稍后会谈论引用的概念。你肯定也能猜到后面两个比较方法的返回结果对吧？\n\n```java\npublic static\
  \ void main(String[] args) {\n    Circle circle1 = new Circle();\n    Circle Circle2\
  \ = new Circle();\n    System.out.println(circle1.equals(Circle2));\n}\n```\n\n\
  ```java\npublic static void main(String[] args) {\n    Circle circle1 = new Circle();\n\
  \    Circle Circle2 = circle1;\n    System.out.println(circle1.equals(Circle2));\n\
  }\n```\n\n你也可以打印它们之间的哈希值，这样你就可以看到 `equals()` 和 `hashCode()` 之间的关系。\n\n### 4. `Object\
  \ clone ()`\n\n此方法初始化并返回被调用对象的副本。本质上，我只是没有提到这个方法的具体示例，因为目前 `Object` 类声明该方法的访问权限是\
  \ `protected`。你稍会理解这种访问权限，但它是受保护的，并且仅在子类重写了该方法时有用。\n\n### 5. `String toString ()`\n\
  \n此方法帮助为此对象返回一个 `String` 类型的表达式。其内容是字符串组合（`getClass().getName() + \"@\" + Integer.toHexString(hashCode())`）。有趣的是，这个方法可能不需要显式调用。这就是为什么你熟悉的\
  \ `String` 对象不需要任何 `toString()` 语句，如下例所示，程序打印了两个对象，一个 `String`，外加图片 1\n\n```java\n\
  public static void main(String[] args) {\n    Circle circle1 = new Circle();\n \
  \   System.out.println(\"Don’t call toString() explicitly:\" + circle1);\n}\n```\n\
  \n这等同于显显式调用 `toString()`，但你不需要这样做。\n\n```java\npublic static void main(String[]\
  \ args) {\n    Circle circle1 = new Circle();\n    System.out.println(\"Call toString()explicitly:\
  \ \".toString() + circle1.toString());\n}\n```\n\n它们的执行结果是相同的。\n\n`Don’t call toString()\
  \ explicitly: shapes.Circle@677327b6`\n`Call toString()explicitly: shapes.Circle@677327b6`\n\
  \n\n\n\n\n### 6. `finalize()`\n\n`Object` 子类可以重写此方法，以便在垃圾回收（Garbage Collection）之前通过操作释放正在使用的资源——我提到了垃圾回收。打开清理这个未使用的对象。你还看到此方法是由系统自动调用的。而且它非常深入，有时当你使用它并想要释放与文件读取或网络相关的资源时会用到，我们将在后面的课程中熟悉这些内容。除了\
  \ `Object` 类为其子类带来的上述有用方法外，还有许多其他方法，如 `notify()`、`notifyAll()`、`wait()`，它们将在后的课程中提到并与此相关联。\n\
  \n# 第 23 课：访问权限（访问修饰符）\n\n我们将讨论一个长期以来承诺的问题，因为你刚刚熟悉了类的属性和方法，即访问类值能力的知识。那么什么是访问权限？它们又有多重要？请观看本课。\n\
  \n## I. 什么是访问修饰符？\n\n访问权限（Accessibility），也称为 `Access Modifier` 修饰符，是 Java 提供的定义。你或其他程序员将使用这些定义来表示访问类值的权限。在这里我想提到的类值包括类的属性、方法和构造函数。\n\
  \nJava 中的访问修饰符关键字是：`private`、`protected`、`public` 和 `default`（意味着没有定义）。\n\n## II.\
  \ 访问权限的定义是什么？\n\n让我们看看上述每种访问能力，但让我们回顾一下如何声明它们。\n\n记住，在类值声明相关的语法中，我已经说明了如何声明这些访问权限。\n\
  \n例如，在声明该类的属性时。\n\n```\n[acessibility] attribute_type_type [= initial_value];\n\
  ```\n\n或者在声明该类的方法时。\n\n```java\n[acessibility] payload type () {\n// 代码行\n}\n```\n\
  \n或者在声明此构造函数时。\n\n```java\n[accessibility] method name () {\n// 代码行\n}\n```\n\n\
  所以你可以理解如何定义类值的访问权限，对吧？下面是 `Circle` 类中访问权限定义的完整示例。\n\n```java\npublic class Circle\
  \ {\n    protected final float PI = 3.14f;\n    private float radius;\n\n    //\
  \ 构造函数\n    public Circle(float radius) { this.radius = radius; }\n    protected\
  \ float calculatePerimeter() { \n        return 2 * PI * radius;\n    }\n\n    protected\
  \ float calculateArea() { \n        return PI * radius * radius;\n    }\n\n    public\
  \ void xuatThongTin() {\n        System.out.println(\"This is Circle\");\n    }\n\
  }\n```\n\n## III. 访问权限的含义\n\n现在，让我们通过每种访问权限，看看它们的含义和作用。首先，我想根据下表总结访问权限，以便记忆。这张表如果定义在某些范围内是可访问的，则带有“Yes”，相反含义则带有“No”。\n\
  \n| | private | default | protected | public |\n| :--- | :--- | :--- | :--- | :---\
  \ |\n| 教室内部 | Yes | Yes | Yes | Yes |\n| 在另一个类中，但在同一包内 | No | Yes | Yes | Yes |\n\
  | 在子类中，在同一包内 | No | Yes | Yes | Yes |\n| 在子类中，不同包 | No | No | Yes | Yes |\n| 在包之外的任何其他类（非子类）\
  \ | No | No | No | Yes |\n\n访问权限含义表\n\n现在我将详细说明每种访问权限。\n\n#### 1. Private 访问权限\n\
  \n如果你将类的某个值（属性、方法或构造函数）指定为 `private`，如表所示，你只能在该类内部访问该值。\n\n这种私有能力是为了保护类内部的值不被外部类“可见”（读取和编辑）。\n\
  \n* • 如果对属性指定为 `private`，则该属性将不允许从其他类访问或修改，除非你为该属性构建了 getter 和 setter 方法，我们稍后会讨论。\n\
  * • 即使给方法分配了 `private`，该方法也不会被其他类访问或继承。\n* • 如果对构造函数指定为 `private`，则该构造函数无法用于实例化该类的对象。\n\
  \n据我所知，这种私有能力被广泛使用，如果你不确定某个值是否应该被调用或重用，只需为它指定 `private` 即可。\n\n* **练习 #1**\n在本次练习中，我们创建一个\
  \ `Circle` 类，将值声明为 `private`。你可以看到当这些值在 `Circle` 类内部使用时是非常好的，系统没有报错。\n\n```java\n\
  public class Circle {\n    private final float PI = 3.14f;\n    private float radius;\n\
  \    // 构造函数\n    private Circle() { }\n    private float calculatePerimeter() {\
  \ \n        return 2 * PI * radius;\n    }\n\n    private float calculateArea()\
  \ { \n        return PI * radius * radius;\n    }\n}\n```\n\n所以你可以自己测试，通过 `main()`\
  \ 函数调用这些 `Circle` 的值，以下代码行将会报错。\n\n```java\npublic class MainClass {\n    public\
  \ static void main(String[] args) { \n        Circle circle = new Circle();\n  \
  \      circle.radius = 20;\n        circle.calculateArea();\n    }\n}\n```\n\n结果行显示下面的错误。\n\
  第 4 行错误\n第 5 行错误\n第 6 行错误\n\n#### 2. default 访问权限\n\n正如我所说，这里的默认意味着完全没有访问权限定义，就像我们熟悉的介绍课程一样，我们暂时将访问权限声明留为空。这次更新。由于类值的访问权限为空，你可以看到，如果在该类内部或同一包的其他类中，将能够看到并访问那些值。只有当你从包外部的类调用这些值时，可见性和访问才会被阻止。这种能力不常用，因为大家都希望代码具有透明性。\n\
  \n* **练习 #2**\n在这里我省略了 `Circle` 类中所有值的访问权限声明。\n\n```java\npackage shapes;\n\npublic\
  \ class Circle {\n    final float PI = 3.14f;\n    float radius;\n    // 构造函数\n\
  \    Circle() { }\n    float calculatePerimeter() { \n        return 2 * PI * radius;\
  \ \n    }\n    float calculateArea() { \n        return PI * radius * radius; \n\
  \    }\n}\n```\n\n同样地，在 `main()` 函数中带有以下代码行，你可以猜哪一行会失败。\n\n```java\npackage main;\n\
  \nimport shapes.Circle;\n\npublic class MainClass {\n    public static void main(String[]\
  \ args) { \n        Circle circle = new Circle();\n        circle.radius = 20;\n\
  \        circle.calculateArea();\n    }\n}\n```\n\n错误行结果如下。\n第 8 行错误 第 9 行错误 第 10\
  \ 行错误 这些行报错的原因是因为它们在 \"main\" 包中，不同于 `Circle` 的 \"shapes\" 包。将它们带回同一个包进行验证。\n\n\
  #### Protected 访问\n\n这种能力是为了供子类重用或重写类值。因此，保护能力将赋予子类完全自由，无论是在相同包还是不同包。这种能力限于不是子类且在包外的类。\n\
  \n* **练习 #3**\n这次看 `Circle` 类内部的 `protected` 声明如下。\n\n```java\npackage shapes;\n\
  \npublic class Circle {\n    protected final float PI = 3.14f;\n    protected float\
  \ radius;\n\n    // 构造函数\n    public Circle(float radius) { this.radius = radius;\
  \ }\n    protected float calculatePerimeter() { \n        return 2 * PI * radius;\n\
  \    }\n\n    protected float calculateArea() { \n        return PI * radius * radius;\n\
  \    }\n}\n```\n\n并且在 `main()` 函数中的代码中，再次尝试猜哪行代码会出错。\n\n```java\npackage main;\n\
  \nimport shapes.Circle;\n\npublic class MainClass {\n    public static void main(String[]\
  \ args) { \n        Circle circle = new Circle(10); \n        circle.calculateArea();\n\
  \    }\n}\n```\n\n第 9 行报错。`calculateArea()` 是 `protected` 唯一的“NO”情况。因为它是从一个与 `Circle`\
  \ 类没有父子关系的类中调用的，而且处于与 `Circle` 不同的包。\n\n* **练习 #4**\n仍然使用练习 3 的代码，这次我声明了更多的 `Cylinder`\
  \ 继承自 `Circle`，以及 `main()` 函数如下。看看是否有任何错误信息。\n\n```java\npackage shapes;\n\npublic\
  \ class Cylinder extends Circle {\n}\n```\n\n\n\n\n\n```java\npublic class Cylinder\
  \ {\n    public float height; // 构造函数\n\n    public Cylinder(float radius, float\
  \ height) {\n        super(radius);\n        this.height = height;\n    }\n\n  \
  \  public float calculateTheTich() {\n        return calculateArea() * height;\n\
  \    }\n}\n```\n\n```java\npackage main;\nimport shapes.Cylinder;\n\npublic class\
  \ MainClass {\n    public static void main(String[] args) {\n        Cylinder cylinder\
  \ = new Cylinder(10, 20);\n        cylinder.calculateTheTich();\n    }\n}\n```\n\
  \n这些是错误行的结果。没有哪行报错，因为 `Cylinder` 继承了父类的方法并重新分配了这些方法的访问权限。\n\n### 3. 公有访问 (Public\
  \ Access)\n\n关于这种可能性可能不需要很多篇幅。如果你在类中指定一个值为 `public`（公有），那么假设所有其他类都可以访问这些值。\n\n所以我刚刚“偿还”了访问性（Accessibility）知识的债，它也称为访问修饰符（Access\
  \ Modifier）。从下节课开始，我们将使用许多关于这些访问性的知识。\n\n# 课程 24：final 关键字\n\n你可能记得关于常量的课程。到那时你已经知道，要声明一个常量必须使用\
  \ `final` 关键字。在 OOP 课程之前，如果你用这个 `final` 关键字声明了类的属性，常量仍然会保持原样使用。所以，除了作为常量之外，`final`\
  \ 在这些 OOP 关系中还能做什么。请观看本节课程以更好地理解 `final`。\n\n#### I. final 变量与 final 属性 (Final Variables\
  \ & Final Properties)\n\n正如我所说，当 `final` 关键字用于方法内部的变量时，它的含义与在类属性上使用 `this` 关键字含义相同。它都是一个不可变的常量。\n\
  \n下面是变量的 `final` 声明示例，这个古老的知识你可能已经掌握得非常好了。\n\n```java\nprotected float calculateParimeter()\
  \ {\n    final float PI = 3.14f;\n    return 2 * PI * radius;\n}\n```\n\n至于为属性声明\
  \ `final`，它同样古老，你在之前的课程在 `Circle` 类中声明 `PI` 时已经用过很多次了。然而，你应该记住，访问 `final` 或非 `final`\
  \ 属性的能力声明是完全相同的。\n\n```java\nclass Circle {\n    private final float PI = 3.14f;\n\
  \    protected float radius;\n\n    // 构造函数\n    public Circle(float radius) {\n\
  \        this.radius = radius;\n    }\n\n    protected float calculateParimeter()\
  \ {\n        return 2 * PI * radius;\n    }\n\n    protected float calculateArea()\
  \ {\n        return PI * radius * radius;\n    }\n}\n```\n\n正如我在讨论常量时建议的那样，你应该将所有带有\
  \ `final` 声明的变量或属性字符大写，这有助于我们的代码更加清晰、连贯。\n\n**final 属性空白 (Final Attribute Blank)**\n\
  \n在这一节中，我想更多关于用于变量或属性的 `final`。也就是说，当你将其声明为 `final` 时，你不需要立即为该属性或变量指定值，可以留空，这样当以后有特定值时，你可以将其赋值给属性或\
  \ `final` 变量，且只赋值一次。这使得看似非常僵板的 `final` 变得稍微灵活了一些。\n\n下面的示例模拟通过方法设置 `final` 的准确 `PI`\
  \ 值。\n\n**在我们找到更受保护的之后的 PI 变量**\n\n```java\nprotected float calculateParimeter()\
  \ {\n    final float PI;\n    PI = calculatePI();\n    return 2 * PI * radius;\n\
  }\n```\n\n下面的示例模拟设置 `final` 的官方 `PI` 值，但与上面的变量示例略有不同，对于 `final` 属性，你只允许在构造函数中为 `final`\
  \ 赋值以下值。\n\n**找到之后的 PI 属性值**\n\n```java\nclass Circle {\n    private final float\
  \ PI;\n    protected float radius;\n\n    // 构造函数\n    public Circle(float radius)\
  \ {\n        PI = (float) calculatePi();\n        this.radius = radius;\n    }\n\
  \n    protected float calculateParimeter() {\n        return 2 * PI * radius;\n\
  \    }\n\n    protected float calculateArea() {\n        return PI * radius * radius;\n\
  \    }\n\n    // 不要太关注下面的代码\n    private double calculatePi() {\n        return\
  \ Math.PI;\n    }\n}\n```\n\n#### II. final 方法 (Final Method)\n\n也很容易推断。如果属性在指定为\
  \ `final` 时意味着“钉住”该值，它是可以更改的。那么对于方法，当你为它指定 `final` 时，似乎该方法不能被重写，这等同于你不能从子类更改该方法。\n\
  \n回到 `Circle` 循环，假设 `calculateParimeter()` 和 `calculateArea()` 方法都被声明为 `final`。\n\
  \n```java\nclass Circle {\n    private final float PI = 3.14f;\n    protected float\
  \ radius;\n\n    // 构造函数\n    public Circle(float radius) {\n        this.radius\
  \ = radius;\n    }\n\n    protected final float calculateParimeter() {\n       \
  \ return 2 * PI * radius;\n    }\n\n    protected final float calculateArea() {\n\
  \        return PI * radius * radius;\n    }\n}\n```\n\n所以在 `Cylinder` 类中，对于继承自\
  \ `Circle` 的普通 `Cylinder()` 方法，你可以看到重用 `Circle` 的方法是完全可以。\n\n```java\npublic class\
  \ Cylinder extends Circle {\n    public float height;\n\n    public Cylinder(float\
  \ radius, float height) {\n        super(radius);\n        this.height = height;\n\
  \    }\n\n    public float calculateTheTich() {\n        return calculateArea()\
  \ * height;\n    }\n}\n```\n\n但是，正如我在讨论常量时所建议的，如果你将方法声明为 `final`，可以可以其他类类重方法，，确保重性。\n\
  \n```java\n@Override\nprotected float calculateParimeter() {\n    return super.calculateimeter();\n\
  }\n```\n\n通过方法封装性（正如我们声明为私私），），允许类类类方法方法。你看到 OOP 的 的吗。\n\n但是，你应该注意，你不能为构造函数指定 `final`，因为构造函数永远被重写。\n\
  \n#### III. final 类 (Final Class)\n\n`final` 对类的影响与对方法的影响相似。也就是说，当你将其声明为 `final`\
  \ 时，你将无法继承任何 `final` 类。\n\n假设 `Circle` 类有 `final` 声明，那么继承 `Circle` 的 `Cylinder`\
  \ 类将会报告“整个类”错误。\n\n```java\nfinal class Circle {\n    // ...\n}\n```\n\n\n\n\n\n\
  `methods makeonly` (通过上面的定义，你应该足够足够理解这种类型的方法是否正确。如果你真的不理解，请继续阅读后续章节。)\n\n## II.\
  \ 如何组织 Getter 和 Setterget？\n\n为了通过 getter 和 setter 为类中的属性创建封装，请遵循以下步骤：\n\n1. 在私有类中定义属性的访问权限。\n\
  2. 为每个私有属性构造 getter 或 setter 方法。\n3. 对于 setter，你应该将方法命名为 `setNameOfProperties()`。\n\
  4. 对于 getter，你应该将方法命名为 `getNameOfProperties()`。\n\n私有属性的 getter 和 setter 是否是可选的。如果你不希望属性被任何类看到，你可能不需要声明任何\
  \ getter 或 setter。如果你只想让该属性可见而不被修改，则只需为私有属性构建一个 getter。如果你只想让该属性在外部编辑而不可，则只需为私有属性构建一个\
  \ setter。\n\n现在，为了方便理解，让我们来看 `Point` 类示例。你可以看到，这个类中的 `x` 和 `y` 属性被指定为 `private`，然后在属性声明下方必须构建更多的\
  \ getter 和 setter 方法。\n\n```java\npublic class Point {\n    private int x;\n   \
  \ private int y;\n\n    // getter of property x\n    public int getX() {\n     \
  \   return x;\n    }\n\n    // setter of property x\n    public void setX(int x)\
  \ {\n        this.x = x;\n    }\n\n    // getter of property y\n    public int getY()\
  \ {\n        return y;\n    }\n\n    // setter of property y\n    public void setY(int\
  \ y) {\n        this.y = y;\n    }\n}\n```\n\n即使对于你已经熟悉的 `Circle` 类或其他几何类，我们也可以为它们构建\
  \ getter 和 setter。\n\n```java\nclass Circle {\n    private final float PI = 3.14f;\n\
  \    private float radius;\n\n    public float getRadius() {\n        return radius;\n\
  \    }\n\n    public void setRadius(float radius) {\n        this.radius = radius;\n\
  \    }\n\n    public float calculatePerimeter() {\n        return 2 * PI * radius;\n\
  \    }\n\n    public float calculateArea() {\n        return PI * radius * radius;\n\
  \    }\n}\n```\n\n所以从类外部调用 getter 和 setter 方法将如下所示。请注意下面的 `main()` 函数。在这个示例中，我通过调用类的\
  \ setter 替换了通过构造函数设置圆的半径。\n\n```java\npublic class MainClass {\n    public static\
  \ void main(String[] args) {\n        // Creat new circle object\n        Circle\
  \ circle = new Circle();\n        // set radius of circle by setter\n        circle.setRadius(10);\n\
  \        // Other methods\n        float perimeter = circle.calculatePerimeter();\n\
  \        float area = circle.calculateArea();\n        System.out.println(\"Perimeter\
  \ of this circle is: \" + perimeter + \", and area is: \" + area);\n    }\n}\n```\n\
  \n## III. 使用 Eclipse 声明 Getter 和 Setter\n\n你可以看到，类属性的 getter 和 setter 的命名没有特定的规则，它们应该是\
  \ `getXXX()` 和 `setXXX()`。\n\n首先，你可以使用 `Point` 类，或者在 Eclipse 中创建任何类。请为它声明一个或多个私有属性，如下所示。\n\
  \n![](img/Image00075.jpg)\n\n你可以看到编辑器左侧栏上有黄色警告图标，分别对应每个私有属性。由于系统看到我们为属性声明了 `private`\
  \ 但没有在类内部使用它们，这显然是一个问题，因为这些值在类外部是不可见的。\n\n当你反复点击这些警告之一时，会弹出一个对话框，选择 `Create getter\
  \ and setter for 'property_name'…`。当对话框出现在此选项旁边时，保持默认并点击 OK 完成。\n\n![](img/Image00076.jpg)\n\
  \n你可以自己验证。此选项的结果帮助你为相应的属性生成 getter 和 setter。你只需要对剩余属性重复操作即可。如果你想移除 getter 或 setter，只需在通过上述步骤创建后删除该方法即可。\n\
  \n## IV. Getter、Setter 和自定义\n\n到目前，你一定已经了 getter 和 setter 是什么。但你知道，这些 getter 和 setter\
  \ 方法并不是真的为了获取或设置类属性的输入。因为它们是方法，可以利用它们在获取或设置值之前进行一些操作。\n\n我的示例是一个类 `Student`，它对姓名和年龄的导入/导出有各种限制，如下所示。请注意测试返回的结果。\n\
  \n```java\npublic class Student {\n    private String name;\n    private String\
  \ age;\n\n    public String getName() {\n        return name;\n    }\n\n    public\
  \ void setName(String name) {\n        if (name == null || name.isEmpty()) {\n \
  \           // 如果 name 未被设置（null），或为空\n            // 将 name 设置为“Unknow”\n     \
  \       this.name = \"Unknow\";\n        } else {\n            this.name = name;\n\
  \        }\n    }\n\n    public String getAge() {\n        if (Integer.valueOf(age)\
  \ != -1) { // 年龄有效\n            return age;\n        } else {\n            return\
  \ \"Invalid age\";\n        }\n    }\n\n    public void setAge(int age) {\n    \
  \    // 检查年龄是否有效\n        // 如果有效，将其设置为 age；否则，将 age 设置为“-1”\n        if (age >\
  \ 18) {\n            this.age = String.valueOf(age);\n        } else {\n       \
  \     this.age = String.valueOf(-1);\n        }\n    }\n}\n```\n\n按照上述类声明。假设我在 `main()`\
  \ 函数中如下初始化了这些学生对象。\n\n```java\npublic class MainClass {\n    public static void\
  \ main(String[] args) {\n        // 创建学生对象\n        Student student1 = new Student();\n\
  \        Student student2 = new Student();\n        // 为他们设置姓名和年龄\n        student1.setName(\"\
  \"); // 未知姓名\n        student1.setAge(23);\n        student2.setName(\"Peter\");\n\
  \        student2.setAge(17);\n        // 输出学生信息\n        System.out.println(\"\
  Student 1 has name: \" + student1.getName() + \", age: \" + student1.getAge());\n\
  \        System.out.println(\"Student 2 has name: \" + student2.getName() + \",\
  \ age: \" + student2.getAge());\n    }\n}\n```\n\n猜猜控制台的输出是什么。这里是结果：\n\nStudent\
  \ 1 has name: Unknown, age: 23\nStudent 2 has name: Peter, age: Invalid age\n\n\n\
  \n\n\n- 关键字 `private`、`protected`、`public` - 用于定义访问类值的权限。\n- `Final` 关键字 - 有助于定义常量，或在面向对象编程（OOP）中防止方法重写。\n\
  - Getter 和 setter 名称 - 指通过 `get` / `set` 方法对 `private` 属性进行数据封装。\n\n因此，我们继续学习一个新关键字\
  \ `static`，看看这个关键字是什么以及它的作用是什么。\n\n## I. Static 概念\n\n可以说，编程语言中“static”字在越南语中的含义是最难理解的。“Tĩnh”——翻译为\
  \ Static（静态）。并没什么。\n\n实际上，当你像下面所示声明类的组件时，`static` 关键字就会被应用，我将清晰地展示。它对内存管理有重大影响。具体来说，`static`\
  \ 成员属于类的内存管理，而不是属于类实例（或对象）的管理。\n\n还不理解吗？我邀请你看下面的例子，也许通过这个例子你仍然不知道 `static` 关键字的用法，但让我们看看它是如何影响你提到的类内部值的管理的。注意\
  \ `Point` 类中的 `static` 组件和非 `static` 组件。\n\n```java\npublic class Point {\n    public\
  \ static String info; \n    public int x;\n    public int y;\n}\n```\n\n正如我所说，`info`\
  \ 属性是 `static` 的，属于 `Point` 类。属性 `x`、`y` 不是从 `Point` 声明的实例或对象。它们将由 `static` 管理。\n\
  \n当另一个类中使用这些 `Point` 的 `static` 值时，问题变得更清晰了。\n\n```java\npublic class MainClass\
  \ {\n    public static void main(String[] args) {\n        // 这些 x 和 y 属性只能通过 Point\
  \ 类的实例 point2 访问\n        Point point1 = new Point();\n        point1.x = 10;\n\
  \        point1.y = 20;\n\n        // 这些 x 和 y 属性只能通过 Point 类的实例 point2 访问\n   \
  \     Point point2 = new Point();\n        point2.x = 5;\n        point2.y = 6;\n\
  \n        // 再次通过 Point 类访问 info 属性\n        Point.info = \" Save coordinates of\
  \ the geometry\";\n    }\n}\n```\n\n你看到了吗，`x`、`y` 属性以及你所知的任何其他非静态值，必须通过类的实例调用，例如示例中的\
  \ `point1`、`point2`。此外，属性 `INFORMATION` 可以直接通过类 `Point` 访问，无需任何显示。到这里，你已经理解 `static`\
  \ 值是什么了，对吧。你确实猜到了 `static` 的一点含义。\n\n## II. Static 关键字的用途\n\n正如上面提供的一些信息，你可以看到，通过类名调用类的值而无需初始化该类的对象，使得值变得可行。`static`\
  \ 声明更容易访问。\n\n更具体地说，这些 `static` 值可以被应用程序中的其他类共享。它对整个应用程序具有全局影响。看一眼上面的例子，你尝试通过命令行\
  \ `Point.info = \"Save geometrical coordinates\";` 为 `Point` 中的静态值 `info` 赋值。然后在其他地方，例如另一个类中，你可以获取这个\
  \ `Point.info` 值，或重新给它赋一个新值。因此，`static` 值将在类内部或类外的任何地方共享（只要该值没有声明为 `private`）。\n\
  \n但像这样自由地访问和修改类值是一把双刃剑。如果你过度使用 `static` 关键字，你将无意中破坏 OOP 准则。OOP 最初诞生是为了划分每个对象的特征和职责，以便于管理。`static`\
  \ 关键字带来了某些本应由某个对象负责的、且通用的属性。因此，我建议你在为类的任何值声明 `static` 时要非常小心。\n\n那么，`static` 关键字到底用在什么地方？我邀请你阅读下面的章节。在\
  \ `static` 关键字的每个具体工具中，我将找到 `static` 关键字在构建应用程序过程中带来的最实用的示例。\n\n## III. Static 属性声明\n\
  \n也许没什么可说的了。`static` 属性就是声明了 `static` 关键字的属性。至于它们如何使用，我们看下面的例子，你就会得很清楚。\n\n### 1.\
  \ 项目中声明的几何计数\n\n让我们回到几何类型的示例。例如，我们有 `Geometry`，它是 `Circle` 和 `Rectangle` 两个类的父类。这个例子的要求是，每当我们创建一个几何对象时，有一个计数器会自动递增，表示程序中创建的形状数量。让我们看看\
  \ `Geometry` 类，假设我们对其他行的计算代码感兴趣，我们只关注在该类内部设置为 `static` 的计数。\n\n```java\npublic class\
  \ Geometry {\n    public static int count = 0;\n    public Geometry() { \n     \
  \   count++;\n    }\n    // 其他代码行 // ...\n}\n```\n\n然后，对于子类的每个构造函数，我们通过 `super()`\
  \ 方法调用其最近的父类。此调用会增加父类构造函数中的变量 `count`。\n\n```java\npublic class Circle extends Geometry\
  \ {\n    // 构造函数 \n    public Circle() { \n        super();\n    }\n    // 计算周长和面积的方法\
  \ // ...\n}\n\npublic class Rectangle extends Geometry {\n    // 构造函数\n    public\
  \ Rectangle() { \n        super();\n    }\n    // 计算周长和面积的方法 // ...\n}\n```\n\n\
  然后，在 `main()` 函数中，尝试声明 `Circle` 和 `Rectangle` 对象，并在控制台打印变量 `count`。\n\n```java\n\
  public class MainClass {\n    public static void main(String[] args) {\n       \
  \ // 创建对象\n        Geometry geometry = new Geometry(); \n        Circle circle1\
  \ = new Circle();\n        Circle circle2 = new Circle();\n        Rectangle rect\
  \ = new Rectangle();\n        System.out.println(\"Total \" + Geometry.count + \"\
  \ shapes in program\");\n    }\n}\n```\n\n应用程序中有 4 个图形。你看到 `static` 是如何共享的了吗？\n\n\
  ### 2. 应用程序静态配置值示例\n\n有没有想过如果你想让应用程序拥有共享固定值，这意味着应用程序的配置值。例如，声明此文件的 `static` 路径，或声明此网页的路径……对于所有静态配置，你可以将它们组合在一个文件中并关联\
  \ `static` 属性。\n\n继续几何计数示例。假设现在的问题是你不能超过 5 个图形。我们需要创建一个用于配置的类。我将这个类命名为 `Geometry`。\n\
  \n```java\npublic class Geometry {\n    // 声明最小形状数量和最大形状数量\n    public static final\
  \ int MINIMUM_SHAPE= 0;\n    public static final int MAXIMUM_SHAPES= 5;\n    //\
  \ 其他可用的配置\n    // public static final xxx xxx\n    // public static final xxx xxx\n\
  \    // ...\n}\n```\n\n回到 `main()` 函数，让我们尝试声明更多几何对象。以下是基于从 `Geometry` 类获取的静态配置值的约束检查。\n\
  \n```java\npublic class MainClass {\n    public static void main(String[] args)\
  \ {\n        // 创建类实例\n        Geometry geometry1 = new Geometry(); \n        Geometry\
  \ geometry2 = new Geometry(); \n        Circle circle1 = new Circle();\n       \
  \ Circle circle2 = new Circle();\n        Rectangle rect1 = new Rectangle(); \n\
  \        Rectangle rect2 = new Rectangle();\n\n        if (Geometry.count > Geometry.MAXIMUM_SHAPES)\
  \ {\n            System.out.println(\"你声明的数量超过了允许的几何数量！\");\n            System.out.println(\"\
  最小几何数量是：\"+ Geometry.MINIMUM_SHAPE);\n            System.out.println(\"最大几何数量是:\
  \ \" + Geometry.MAXIMUM_SHAPES);\n        }\n    }\n}\n```\n\n\n\n\n\n```java\n\
  } else {\n    System.out.println(\"Total \" + Geometry.count + \"shape in program.\"\
  );\n}\n}\n```\n\n现在你可以运行应用程序来验证它了。\n\n## IV. 静态方法声明\n\n静态方法的使用与上述静态属性具有相同的特性和目的。即：\n\
  \n- 静态方法仍然由类进行管理，而不是实例。\n- 当一个方法被应用程序中的所有对象共享时，该方法被设置为静态的。例如：检查某些值的正确性的方法、货币转换的方法、单位转换的方法、将数据存储到内存中的方法、连接到服务器的方法等。\n\
  \n然而，Java 中有一个非常特别的注意：所有的静态方法都只能调用声明为静态的属性。这可以很容易验证：在很久以前的第 8 节中，当变量位于 `main()`\
  \ 之外时，我必须将变量声明为 `static name`，因为 `main()` 被声明为静态的（`main(function)`），所以必须声明为静态函数，这样系统就可以通过类随时访问它，而不是声明包含\
  \ `main()` 函数的类实例。因此，如果 `main()` 想要使用 `name`，那么 `name` 也必须是静态的。\n\n### 几何系统单位转换示例\n\
  \n对于这个示例，假设我们的几何应用程序在输入和单位计算方面有更高的要求。假设我们接受两个输入单位：`inch`（英寸）和 `centimeter`（厘米）。\n\
  \n短期内，`Geometry` 类将需要构建一些静态配置值，并添加单位转换的静态方法。\n\n```java\npublic class Geometry {\n\
  \    public static final int MINIMUM_SHAPE = 0;\n    public static final int MAXIMUM_SHAPES\
  \ = 5; // 其他配置\n    public static final float PI = 3.14f;\n    public static final\
  \ float INCH_CM = 2.54f; // 1 英寸 = 2.54 \n    public static final int UNIT_CM =\
  \ 1; // 标记应用程序使用厘米\n    public static final int UNIT_INC = 2; // 标记应用程序使用英寸\n  \
  \  public static int unit = UNIT_CM; // 标记应用程序正在使用的单位\n\n    // 静态方法将厘米转换为英寸\n \
  \   public static float ConvertCentimetToInch(float cm) {\n        float inch =\
  \ cm / INCH_CM;\n        return inch;\n    }\n\n    // 静态方法将英寸转换为厘米\n    public\
  \ static float ConvertInchToCentimet(float inch) {\n        float cm = inch * INCH_CM;\n\
  \        return cm;\n    }\n}\n```\n\n那么，在任何几何类中，我为 `Circle` 类构建了以下示例：此类将询问用户正在使用什么几何单位，并输出相应的信息以及转换信息。另一个基于\
