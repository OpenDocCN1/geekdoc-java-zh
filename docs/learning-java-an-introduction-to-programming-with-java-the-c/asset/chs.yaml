  \ 是否易于使用。如果你有任何问题，请在课程下方留言。\n\n# 第 40 节：线程（第 3 部分）生命周期\n\n进入线程的这部分，我们将学习更多关于 `Thread`\
  \ 的知识，看看当你创建一个特定的 `Thread` 时，它的生命周期是怎样的？线程在整个生命周期中经历了哪些状态？基于这些状态，线程如何同步，或者可以理解为手动调整同一进程中线程之间任务执行的优先级？我们邀请你加入这段有趣的知识之旅。\n\
  \n首先，让我们回答第一个问题。\n\n## I. 对象的生命周期是什么？\n\n我稍微重复一下，这就是为什么我们考虑对象的“生命周期”，即当一个对象具有特定的寿命时，在对象的生命周期内，我想知道它可能经历许多不同的状态。这些状态是出生、衰老、生病还是死亡吗？简而言之，并不是我们都在谈论它的生命周期，只有那些寿命足够长、在生命过程中经历了许多状态的对象，我们才会看到。例如这个\
  \ Java 知识中的 `Thread`。那么，什么是生命周期，或者生命周期内的状态是什么呢。\n\n## II. 为什么人应该学习生命周期？\n\n我们应该知道对象生命周期的最好理由，除了它何时出生、何时死亡之外，理解对象在生命周期内经历的状态也同样重要。当你理解了生命周期的状态时，你会更好地理解对象，从而可以轻松地干预它，插入最相关的任务状态。最终目标是让我们的应用程序更强大，甚至更智能。更多细节请参阅更多。\n\
  \n## III. 理解线程的生命周期\n\n让我们回到课程的主体，一起探索 `Thread` 的生命周期。首先邀请你通过以下图查看此生命周期图。\n\n###\
  \ 1. 线程生命周期示意图\n\n![](img/Image00109.jpg)\n\n此图基于 `Thread` 类中 `enum` 声明定义的状态构建的。什么是\
  \ `Enum`，我们将在下一节中讨论。基本上，`enum` 帮助我们定义一组状态，并在这个情况下帮助我们理解 `Thread` 的生命周期。你可以看到 `Thread`\
  \ 的状态，你可以看到![](img/Image00110.jpg)\n\n### 2. 线程的生命周期描述\n\n正如我所说的，在这个部分我们将查看线程的概述。\n\
  \n### NEW\n![](img/Image0011.jpg)\n\n*   当你初始化一个线程但还没有调用 `start()` 方法时，它的状态是 `NEW`。\n\
  *   一旦你创建了线程并调用 `start()` 方法，它将进入 `RUNNABLE` 状态。![](img/Image00112.jpg)\n*   在运行期间，如果等待系统分配资源，它处于\
  \ `BLOCKED`、`WAITING` 或 `TIMED_WAITING` 状态。![](img/Image00113.jpg)\n*   最后，当线程结束时，它达到\
  \ `TERMINATED` 状态。![](img/Image00114.jpg)\n\n## IV. 生命周期内的状态\n\n在这一部分我们将仔细观察每个状态。在这个部分我们将查看\
  \ `Thread` 的生命周期，并邀请你查看状态。\n\n\n\n\n\n![](img/Image00116.jpg)\n注意，上述代码并不总是向控制台打印\
  \ `RUNNABLE` 状态。为什么呢？你可以看到在 `MyThread` 内部只打印了控制台字符串 \"Thread Start\"，在打印此字符串后，线程将结束其生命周期。因此，可能会出现\
  \ `main()` 方法中的 `getState()` 在 `MyThread` 已完成时调用，所以 `RUNNABLE` 可能不会被打印（但在接下来的项中你将看到其他某些状态）。\n\
  \n### 3. BLOCKED（阻塞）\n\n当线程进入 `BLOCKED` 状态时，意味着它不具备运行条件。为什么不具备运行条件？你可以理解，根据应用程序中线程的本质，它们在被\
  \ `start()` 启动后能够并行运行。因此，可能会发生一种情况：在某一时刻，会有多个 `Thread` 拥有编辑 `File` 或对象的“方案”，我们称这些\
  \ `Files` 或对象为“争用”状态。这些是共享资源。如果发生这种冲突，会导致应用程序崩溃，可能导致数据丢失或计算错误。因此，Java 中有一种控制线程的机制，确保在任何时候只有一个\
  \ `Thread` 可以干扰共享资源。这种机制与同步（Synchronization）的概念有关，我们将在专门的课程中介绍。所以，如果发生了这种同步，那么只有一个\
  \ `Thread` 有优先使用此共享资源，而剩余的 `Threads` 将被锁定并必须等待其他优先 `Thread` 完成资源的使用后才能运行，这些被锁定的线程将进入\
  \ `BLOCKED` 状态。因此，为了能够看到这种状态，我们将在下一个练习中熟悉一些关于同步的知识，然后在下节课中一起详细讨论它。\n\n#### 练习题 3\n\
  \n为了练习这一部分，让我们创建一个共享资源，即某个类，我们将这个共享类命名为 `DemoSynchronized`。在此类中，有一个标记为 `synchronized`\
  \ 的静态方法。该方法名为 `commonResource()`。不要过分关注 `synchronized` 关键字，下一节将会进行解释。你只需要理解这个标记为\
  \ `synchronized` 的 `commonResource()` 方法会被系统“赞助”，以便只有一个 `Thread` 可以访问它。\n\n让我们在构建这个类之前。\n\
  \n```java\npublic class DemoSynchronized {\n    public static synchronized void\
  \ commonResource() {\n        for (int i = 0; i < 100000; i++) {\n            //\
  \ 什么都不做，只运行循环以\n            // 确保这个方法存得久一点，\n            // 让有线程使用并让其他\n       \
  \     // 线程必须等待\n        }\n    }\n}\n```\n\n然后我们让 `MyThread`（在上面的练习中编写）有机会调用 `commonResource()`。如下：\n\
  \n```java\npublic class MyThread extends Thread {\n    @Override\n    public void\
  \ run() {\n        DemoSynchronized.commonResource();\n    }\n}\n```\n\n然后在 `main()`\
  \ 方法中，我们将创建多个 `MyThread` 对象，即 2 个对象，你也可以创建 3 个或 4 个 `MyThread` 来进行验证。在创建 `MyThreads`\
  \ 后，我们同时 `start()` 它们，以便它们在运行时调用 `commonResource()`。然后你只需要“随性”地调用它们的 `getState()`\
  \ 即可。\n\n```java\npublic class MainClass {\n    public static void main(String[]\
  \ args) {\n        // 声明多个 MyThread 对象\n        MyThread myThread1 = new MyThread();\n\
  \        MyThread myThread2 = new MyThread();\n        // 都 start 所有的 MyThread 对象\n\
  \        // 查看哪个线程将进入 commonResource()\n        myThread1.start();\n        myThread2.start();\n\
  \n        // 打印它们的状态\n        System.out.println(myThread1.getName() + \": \" +\
  \ myThread1.getState());\n        System.out.println(myThread2.getName() + \": \"\
  \ + myThread2.getState());\n    }\n}\n```\n\n结果是，现在只有一个 `Thread` 是 `RUNNABLE`，其余将是\
  \ `BLOCKED`。\n\n![](img/Image00117.jpg)\n\n### 4. WAITING（等待）\n\n这种状态发生在线程必须等待另一个线程完成其任务，且时间无限。这种状态与上面的\
  \ `BLOCKED` 状态不同，上述是指线程在共同访问同一个系统资源时被系统锁定。这种状态是线程之间的自我协商。`BLOCKED` 就像被交通警察拦截的车辆以让其他优先车辆通过。而\
  \ `WAITING` 是另一种自我妥协的方式，不需要那种警察来监管。由于线程会互相让让，如果一个 `Thread` 调用了以下方法之一，它将“让出”并进入这种\
  \ `WAITING` 状态，方法是：\n- `Object.wait()`\n- `Thread.join()`\n- `LockSupport.park()`\n\
  \n具体来说，上述方法是什么，将在接下来的课程中为你澄清。我们尝试用 `join()` 方法来练习。当一个 `Thread` 调用另一个 `Thread` 的\
  \ `join()` 方法时，它必须等待另一个 `Thread` 死亡后才能继续其剩余的任务。注意，我列出的这些方法没有传递参数。\n\n我们将通过练习更好地理解线程的这种状态。\n\
  \n#### 练习题 4\n\n首先，让我们修改如下类：\n\n```java\npublic class MyRunnable implements Runnable\
  \ {\n    @Override\n    public void run() {\n        System.out.println(\"Runnable\
  \ Start\");\n        for (int i = 0; i < 100; i++) {\n            try {\n      \
  \          Thread.sleep(100);\n            } catch (InterruptedException e) {\n\
  \                // 异常处理\n                e.printStackTrace();\n            }\n\
  \        }\n        System.out.println(\"Runnable End\");\n    }\n}\n```\n\n上述方法并不与让\
  \ `Thread` 进入 `WAITING` 状态有关，我们在下一节会详细讨论 `join()` 方法。\n\n```java\npublic class MyThread\
  \ extends Thread {\n    @Override\n    public void run() {\n        System.out.println(\"\
  MyThread Start\");\n        Thread myRunnableThread = new Thread(new MyRunnable());\n\
  \        myRunnableThread.start();\n        try {\n            myRunnableThread.join();\n\
  \        } catch (InterruptedException e) {\n            e.printStackTrace();\n\
  \        }\n        System.out.println(\"MyThread End\");\n    }\n}\n```\n\n然后在\
  \ `main()` 方法中，你只需要启动 `MyThread`，等待大约 100 毫秒，然后打印 `MyThread` 的状态。等待一会儿打印 `MyThread`\
  \ 状态是为了给 `MyThread` 足够的时间，打印太快很难看到状态。\n\n```java\npublic class MyThread {\n    public\
  \ static void main(String[] args) {\n        MyThread myThread = new MyThread();\n\
  \        myThread.start();\n        try {\n            Thread.sleep(100);\n    \
  \    } catch (InterruptedException e) {\n            e.printStackTrace();\n    \
  \    }\n        System.out.println(\"MyThread State: \" + myThread.getState());\n\
  \    }\n}\n```\n\n控制台输出如下。\n\n![](img/Image00118.jpg)\n\n### 5. TIMED_WAITING（超时等待）\n\
  \n这种状态与上面的 `WAITING` 相似，但当方法让一个 `Thread` “让出”给另一个线程执行时，传递了 `Thread` 经过的时间参数。这些方法是：\n\
  - `Thread.sleep(long milis)`\n- `Object.wait(int timeout)` 或 `Object.wait(int timeout,\
  \ int nanos)`\n- `Thread.join(long milis)`\n- `LockSupport.parkNanos()`\n- `LockSupport.parkUtil()`\n\
  \n嗯，`sleep()` 方法很熟悉吧？现在你理解了，在 `Thread` 某处调用此 `Thread.sleep()` 时，该 `Thread` 将进入 `TIMED_WAITING`\
  \ 状态，并让其他 `Threads` 在指定的毫秒时间内运行。然而，我们将在下一节课中也会讨论这些方法。现在让我们看看练习题的代码。\n\n\n\n\n\n\
  ## 练习 5\n对于这个练习，你只需要参考上面的代码 4。在 `MyThread` 启动 `MyRunnable` 并到 `MyRunnable` 的地方，将\
  \ `milliseconds` 的值传递给这个 `join()` 方法。这意味着尽管 `MyThread` 之前已经让 `MyRunnable` 运行，但仅持续指定的时间，在我运行期间，它都会被阻塞。\n\
  \n```java\npublic class MyThread extends Thread {\n    @Override\n    public void\
  \ run() {\n        System.out.println(\"MyThread Start\");\n        Thread myRunnableThread\
  \ = new Thread(new MyRunnable());\n        myRunnableThread.start();\n        try\
  \ {\n            myRunnableThread.join(500);\n        } catch (InterruptedException\
  \ e) {\n            e.printStackTrace();\n        }\n        System.out.println(\"\
  MyThread End\");\n    }\n}\n```\n\n如果你执行该程序，请注意，在打印 \"MyThread State: TIMED_WAITING\"\
  \ 后，`MyThread` 将等待剩余的 `milliseconds`，并为 `MyRunnable` 打印（少于 500 后）\"MyThread End\"\
  。问题在于 `MyRunnable` 还没有完成循环，所以它最终打印了 \"MyRunnable End\"。你看到线程之间的节奏了吗？！\n\n## 6. TERMINATED（已终止）\n\
  此状态标志着 `Thread` 生命周期的结束。当线程完成其 `run()` 方法中的所有操作，或者发生其他异常结束（例如掉异常）时就会发生。\n\n## 练习\
  \ 6\n本课的代码不多。你只需要获取上面练习 5 的代码。然后在 `main()` 方法中，让它 `sleep()` 一段时间，以等待 `MyThread`\
  \ 完成它的任务，然后打印它的状态。我设置了 20 秒的睡眠，如下：\n\n```java\npublic static void main(String[]\
  \ args) {\n    MyThread myThread = new MyThread();\n    myThread.start();\n    try\
  \ {\n        Thread.sleep(20000);\n        System.out.println(\"MyThread State:\
  \ \" + myThread.getState());\n    } catch (InterruptedException e) {\n        e.printStackTrace();\n\
  \    }\n}\n```\n\n控制台的输出如下。呼！我们刚刚接触了 `Thread` 生命周期的知识，通过它我们知道了 `Thread` 在生命周期中会经历哪些状态。你肯定也知道\
  \ `Thread` 并不总是经过上述所有状态，有些线程只有 `NEW`、`RUNNABLE` 和 `TERMINATED`。然而，通过这些生命周期的知识，你对线程如何同步、如何相互让让执行任务也有大致的想法，对吧？关于\
  \ `Thread` 的知识也非常多，而且同样有趣。下节课见。\n\n# 第 41 节：同步（部分 1）\n记得上一节课吗？我在课程结束时承诺过我们将查看 `Thread`\
  \ 的所有有用方法。但我意识到，`Thread` 带来的大多数酷炫方法都围绕着如何帮助在进程中共同同步 `Threads`。因此，为了方便整合我承诺的方法，我决定先介绍这个“线程同步”的知识。当你接近同步这个概念时，你将对\
  \ `Thread` 内部的有用方法有更好的理解。我们将开始熟悉早期的同步概念。欢迎加入课程。\n\n## I. 什么是同步？\n正如我在关于同步的介绍中简要提到的，但这并不是离线设备与云端数据之间的同步。这里的同步是指线程之间是如何工作的。所以它到底是什么？我将在关于\
  \ `Thread` 的章节，特别是 `Thread` 第 3 集中清楚地解释。现在你一定已经理解了 `Thread`，也知道 `Thread` 中有一个非常头疼的问题，即\
  \ `Thread` 是否是我们应用程序内部组织任务的好方法（由于它的并行处理特性更快、更流畅），但这反过来导致了风险：同时可能有多个线程想要干扰同一个共享资源。我们需要一种机制来帮助调节，以便同时只有一个\
  \ `Thread` 有权使用此共享资源，而其他 `Threads` 必须轮流等待。这种调节机制被称为同步（英语中 `Synchronized` 或 Synchronization）。\n\
  \n然而，我想再补充一个关于同步的问题。即，如果独立提到同步，那么你可以理解我上面提到的它的功能。如果将“同步”与“真实的同步”（当同步是同步的，而无同步是异步的）进行比较，会有其他背景问题。同步有助于按特定顺序组织\
  \ `Thread`，在一个线程完成后，另一个线程可以执行，按顺序且平滑地进行。而异步是无序的……无序，也就是说，我们不关心哪个 `Thread` 先完成，哪个线程后结束。而且我们这个同步系列只讨论\
  \ `Synchronized` 概念（即不比较同步和异步的区别）。\n\n## II. 什么时候会用到同步？\n正如我上面所说，同步有助于调节，以便一次时刻只有一个\
  \ `Thread` 可以使用某些共享资源。那么什么时候需要这种调整呢？事实上，应用程序内的资源（文件或对象）并不总是需要与系统保持同步。只有当资源存在冲突、在线程之间有共同线程，导致一个线程正在修改对象的值，而另一个线程也在对该对象进行修改，导致线程之间产生不必要的“误解”，并可能导致运行时崩溃……这时才使用同步。\n\
  \n一个实际的例子是银行的账户管理应用程序。假设你是这个账户管理应用程序的构建者，在你的应用程序中有一个对象负责读取和写入客户账户余额数据库。一天，一个客户去\
  \ ATM 提取款，假设他的账户有 2000 万越南盾，他需要提取 1500 万越南盾。你也知道为了取款，ATM（即你的应用程序）必须对该账户进行余额检查，然后该\
  \ ATM 接收客户的取款订单并准备取款（此时你的应用程序对象刚刚读取了余额数据，还没有余额校正）。但与此同时，在家里，客户的妻子与其丈夫共用同一个账户，她正通过丈夫的账户提取\
  \ 2000 万越南盾，在检查账户余额后，妻子发现钱还足够（因为 ATM 还没有扣款操作），妻子执行了转账订单。然后发生了什么？由于你的应用对象看到剩余金额（在丈夫的\
  \ ATM 和妻子的转账网站上都是），它在数据库中为丈夫扣减了 1500 万越南盾，为妻子扣减了 2000 万越南盾。丈夫和妻子收到了要取的钱，妻子的账户也收到了转账的钱。简而言之，银行亏了钱（1500\
  \ 万越南盾），你会被解雇。\n\n现在，现在，我只是假设，当然，在读完这个同步系列后，你就可以完全避免未来可能发生的错误，例如。为了方便理解，让我们把这个情况重构成为一个小项目，如下：\n\
  \n• 未同步的银行取款示例\n\n\n\n\n在这个示例中，我邀请你构建一个如上述模拟从银行取款的应用程序。\n\n我们首先构建一个持有客户账户余额信息的对象。这个对象由你经过仔细构建，它可以在允许取款之前检查账户余额（初始余额设置为\
  \ 2000 万）。在检查余额并确认允许取款后，它将扣除账户中的余额。假设检查账户余额和将新余额更新回数据库每次操作需要 2 秒。这些都通过下面的类代码进行模拟。我将这个类命名为\
  \ `BankAccount`。\n\n```java\npublic class BankAccount {\n    long amount = 20000000;\
  \ // The amount in the account\n    public boolean checkAccountBalance (long withDrawAmount)\
  \ { // Simulate time to read the database and check money\n        try {\n     \
  \       Thread.sleep (2000);\n        } catch (InterruptedException e) {\n     \
  \       e.printStackTrace();\n        }\n        if (withDrawAmount <= amount) {\
  \ // Allow to withdraw money\n            return true;\n        }\n        // No\
  \ withdrawal allowed\n        return false;\n    }\n\n    public void withdraw (String\
  \ threadName, long withdrawAmount) { // Print withdrawal information\n        System.out.println\
  \ (threadName + \"withdraw:\" + withdrawAmount);\n        if (checkAccountBalance\
  \ (withdrawAmount)) { // Simulate withdrawal time and\n        // update the remaining\
  \ amount into the database\n            try {\n                Thread.sleep (2000);\n\
  \            } catch (InterruptedException e) {\n                e.printStackTrace();\n\
  \            }\n            amount -= withdrawAmount;\n        }\n        // Print\
  \ out the account balance\n        System.out.println (threadName + \"see balance:\"\
  \ + amount);\n    }\n}\n```\n\n上面的代码很容易理解，对吧？你已经知道这个 `BankAccount` 是一个共享资源。既然是共享资源，你应该如下所示构建一个取款线程。该线程将允许访问这个共享资源并传递取款金额，然后调用该资源的取款方法。我将这个取款线程命名为\
  \ `WithdrawThread`。\n\n```java\npublic class WithdrawThread extends Thread {\n \
  \   String threadName = \"\";\n    long withdrawAmount = 0;\n    BankAccount bankAccount;\n\
  \    public WithdrawThread(String threadName, BankAccount bankAccount, long withdrawAmount)\
  \ {\n        this.threadName = threadName;\n        this.bankAccount = bankAccount;\n\
  \        this.withdrawAmount = withdrawAmount;\n    }\n\n    @Override\n    public\
  \ void run() {\n        bankAccount.withdraw(threadName, withdrawAmount);\n    }\n\
  }\n```\n\n最后，`main()` 方法的代码非常简单，我们只需要声明 2 个 `Thread` 来取款，并让它们使用同一个资源 `bankAccount`\
  \ 即可。\n\n```java\npublic static void main(String[] args) {\n    BankAccount bankAccount\
  \ = new BankAccount();\n    // 丈夫取 1500 万\n    WithdrawThread husbandThread = new\
  \ WithdrawThread(\"Husband\", bankAccount, 15000000);\n    husbandThread.start();\n\
  \    // 妻子取走所有钱 (2000 万)\n}\n```\n\n\n\n\n```java\nWithdrawThread wifeThread = new\
  \ WithdrawThread(\"Wife\", bankAccount, 20000000); wifeThread.start();}\n```\n当执行此程序时，你将看到如下所示的结果。这个结果是两个线程\
  \ `husbandThread` 和 `wifeThread` 检查账户并发现可以取款，然后它们都执行了取款订单，结果双方都看到执行成功。但是……它的余额变成了负数（意味着银行亏了钱）。![](img/Image00121.jpg)\n\
  \n我们先停在上面的示例，在下一节中，当我们开始了解同步（Synchronization）方法的细节时，我们将知道上述银行是如何不亏钱的，可能还能保命，不，保住你的工作。\n\
  \n# III. 同步方法\n\n在系列同步课程中，我将它们分为两种方式，这两种我们最容易实现和记忆的两种方式。\n\n第一种被称为 `Mutual Exclusive`（互斥）。可以理解为相互斥。这种方式系统将优先考虑一个线程，并帮助防止其他线程发生冲突的风险。因为这种机制的特性，它让我们想起了对系统的剧烈干预，所以被称为“消除（eliminates）”。这种方式将在下节中封装。\n\
  \n第二种被称为 `Cooperation`（协作）。它可以意味着共同协作。这种方式线程将相互握手，并共同调节优先级顺序以自我避免冲突。这种方式将在下一节关于上述互斥方法中讨论。\n\
  \n事实上，在上一节中，你已经简要地熟悉了这两种同步方式。记住它。这个链接是 `Mutual Exclusive` 方式，这个链接是 `Cooperation`。好了，这节课很简单，不是吗。本节的知识点仅集中于同步概念的介绍，以及我们将在后续章节中看到的两种主要的同步方式。\n\
  \n# 第 42 节：同步部分 2\n\n在在完成昨天关于同步线程的开场课程后，我说过会有两种方式同步线程。这些同步的共同目标都是限制线程访问同一个共享资源。在本节中，我将详细介绍上述两种方式中的第一种，这种方法被称为\
  \ `Mutual Exclusive`。在这些同步课程之后，你将学习如何在与多线程工作时避免系统资源冲突，并知道在什么时候使用哪种方法进行同步。欢迎加入课程。\n\
  \n## I. 什么是互斥同步？\n\n无疑，互斥同步是一种同步 `Thread` 的方法，帮助线程保持同步以便它们不会同时干扰共享资源。那么为什么被称为 `Mutual\
  \ Exclusive` 呢？这里的 Exclude（排除）意味着 `Block`（阻塞），意味着系统将阻塞调用同一个共享资源的线程，只允许一个线程使用该资源。那些阻塞的线程将等待直到它们停止后才能使用该资源。简而言之，这里的\
  \ Exclude 被理解为 `Prevent`（防止），而不是终止（Abort）线程。\n\n那么系统将如何执行这种消除或防止呢？为了最直观的可视化，让我们来看下面的实际示例（这是我看到很多文档使用的最易理解的\
  \ `Mutual Exclusive` 示例）。例如，在某次会议上有很多演讲者坐在一起，他们都在讨论关于如何最好地学习 Java 的话题（这个话题是我发起的）。和我们讨论的\
  \ `Thread` 问题相同的是，只有一个话题，每个演讲者都有自己的意见，每个人都争抢着提出意见。结果是，听众会收到杂乱的信息，没有人能听懂会议传达了什么![](img/Image00122.jpg)\n\
  \n如果你把每个演讲者看作一个 `Thread`，而他们讨论的话题是共享资源。演讲者本身是导致话题如此拥挤的因素。为了解决这个问题，你想了一种机制，这种机制被称为\
  \ `Mutual Exclusive`。该机制的想法是演讲者必须获得他们自己的发言权，排除其他演讲者的发言权，强制其他演讲者倾听，直到该演讲者发言。这就是故事。噢，那么该做呢，你不能介入并指定谁说话谁必须听，因为那会花费太多精力。不，你不需要。你给他们一个麦克风。砰！问题解决了。把一个麦克风放在桌子上，由演讲者拿自己的麦克风，演讲者就有发言权，其他人听直到演讲者交出麦克风。倾听的演讲者有权将发言加入一个列表，这样当另一个演讲者结束发言后，列表中的下一个人就可以使用麦克风![](img/Image00123.jpg)\n\
  \n上面的示例清楚地展示了执行 `Mutual Exclusive` 同步的方法。我们只需要考虑将上述示例应用到我们的线程同步知识时，系统将如何操作，欢迎进入下一节。\n\
  \n## II. 互斥同步是如何？\n\n这种演讲者只有在有麦克风时才被允许说话的机制应用于线程同步时，它被称为另一个名字 `Monitor & Lock`，或者许多文档称为\
  \ `Monitor Lock`。我不必理解 `Monitor` 是屏幕而 `Lock` 是锁。这种机制可以理解为麦克风或其他共享文档将被一个名为 `Monitor`\
  \ 的对象保护。对于每个想要使用麦克风（或共享资源）的演讲者（或 `Thread`），必须通过 `Monitor` 注册以获取一个 `Lock`。每个 `Monitor`\
  \ 将只有一个 `Lock`。哪个线程可以获得上述 `Monitor` 的 `Lock`，该线程就被允许使用共享资源，直到该 `Thread` 完成使用并返回\
  \ `Lock`。\n\n（注：原文此处有断句，此处衔接了麦克风）\n\n\n\n在这个练习中，我们将回到上节课中的银行取款示例。我在这个示例中对内容进行了简要总结。\n\
  \n在上一个示例中，你构建了一个 `BankAccount` 类。该类包含两个方法：`checkAccountBalance()` 和 `withdraw()`，它们分别是检查余额和在余额充足时从银行取款的方法。然后，我们声明了两个线程\
  \ `Thread`，即 `husbandThread` 和 `wifeThread`，并进行取款，上一节课第二天获得的结果如下。\n\n![](img/Image00121.jpg)\n\
  \n控制台上的行表示两个 `Threads` 想要取款，而两个 `Threads` 取款后的结果显示为负数，这表明余额检查出现了错误，因为两个线程都进行了余额检查。两个\
  \ `Threads` 都发现余额可用，并都执行了总额超过允许余额的取款。\n\n因此，我们需要同步这些 `Threads`，也就是说，对共享资源 `BankAccount`\
  \ 进行同步。让 `BankAccount` 对象受 `Monitor` 保护。然后当 `Thread` 想要使用该对象的方法时，它们必须请求 `Lock`。因此根据课程，我们只需要在\
  \ `BankAccount` 中如所示添加 `synchronized` 关键字（我更改了代码以打印控制台，使其比上一节课更清晰）。\n\n```java\n\
  public class BankAccount {\n    long amount = 20000000; // 账户金额\n\n    public synchronized\
  \ boolean checkAccountBalance (long withDrawAmount) { // 模拟读取数据库和检查金额的时间\n     \
  \   try {\n            Thread.sleep (2000);\n        } catch (InterruptedException\
  \ e) {\n            e.printStackTrace ();\n        }\n        if (withDrawAmount\
  \ <= amount) { // 允许取款\n            return true;\n        }\n        // 不允许取款返回\
  \ false;\n    }\n\n    public synchronized void withdraw (String threadName, long\
  \ withdrawAmount) { // 打印取款信息\n        System.out.println (threadName + \"check:\"\
  \ + withdrawAmount);\n        if (checkAccountBalance (withdrawAmount)) { // 模拟取款时间并\n\
  \            // 将剩余金额更新到数据库\n            try {\n                Thread.sleep (2000);\n\
  \            } catch (InterruptedException e) {\n                e.printStackTrace\
  \ ();\n            }\n            amount -= withdrawAmount;\n            System.out.println\
  \ (threadName + \"withdraw successful:\" + withdrawAmount);\n        } else {\n\
  \            System.out.println (threadName + \"withdraw error!\");\n        }\n\
  \        // 打印账户余额\n        System.out.println (threadName + \"see balance:\" +\
  \ amount);\n    }\n}\n```\n\n当涉及到性能时，比较一下结果。\n\n丈夫想要取 1500 万。丈夫成功取了 1500 万。余额为 500\
  \ 万。妻子想要取 2000 万 ![](img/Image00124.jpg) 妻子无法这样做。余额仍然是 500 万。\n\n![](img/Image00125.jpg)\n\
  \n你看，这种同步的结果是：`husbandThread` 先请求取款，它会先获得 `Lock`，直到 `husbandThread` 完成取款，`wifeThread`\
  \ 才能开始执行而不会发生竞争。\n\n## 2. 在代码块内部使用 synchronized 方法\n\n此时，你已经部分理解了 `synchronized`\
  \ 关键字是如何工作的，对吧？为了更清楚，当你在类内部的一个或多个方法中放置 `synchronized` 关键字时，该类的对象将由 `Monitor` 管理。一旦一个\
  \ `Thread` 注册使用带有 `synchronized` 关键字的方法，`Monitor` 就会授予该线程 `Lock`，直到它完成这些方法。\n\n\
  因此，有时你不需要为整个方法请求 `Lock`。如果你只需要方法的一个部分受 `Monitor` 保护，那么就对该项的块应用 `synchronized` 方法。你可以参考以下\
  \ `synchronized` 语句块在方法内部的语法结构：\n\n```java\nsynchronized (object) {\n    // 块内容\n\
  }\n```\n\n语法并不太困难，你只需要考虑传递给 `synchronized` 块的参数 `doi_tuong`。此参数告诉系统哪个对象应该仅由其 `Monitor`\
  \ 进行同步管理。为了更好地地理解，邀请你进行练习。\n\n### 练习 #2\n\n我们将获取上述练习 1 中 `BankAccount` 类的代码。但现在我们只需要同步稍后高亮的一个块代码。你会发现，除了在熟悉的代码行中封装这个同步块，并像练习\
  \ #1 那样从方法中移除 `synchronized` 项外，其他一切都没有变化。\n\n```java\npublic class BankAccount\
  \ {\n    long amount = 20000000; // 账户金额\n    public boolean checkAccountBalance\
  \ (long withDrawAmount) { // 模拟读取数据库和检查金额\n        try {\n            Thread.sleep\
  \ (2000);\n        } catch (InterruptedException e) {\n            e.printStackTrace\
  \ ();\n        }\n        if (withDrawAmount <= amount) { // 允许取款\n            return\
  \ true;\n        }\n        // 不允许取款返回 false;\n    }\n\n    public void withdraw\
  \ (String threadName, long withdrawAmount) { // 打印取款信息\n        System.out.println\
  \ (threadName + \"check:\" + withdrawAmount);\n        synchronized (this) {\n \
  \           if (checkAccountBalance (withdrawAmount)) { // 模拟取款时间并\n           \
  \     // 将剩余金额更新到数据库\n                try {\n                    Thread.sleep (2000);\n\
  \                } catch (InterruptedException e) {\n                    e.printStackTrace\
  \ ();\n                }\n                amount -= withdrawAmount;\n          \
  \      System.out.println (threadName + \"withdraw successful:\" + withdrawAmount);\n\
  \            } else {\n                System.out.println (threadName + \"withdraw\
  \ error!\");\n            }\n        }\n        // 打印账户余额\n        System.out.println\
  \ (threadName + \"see balance:\" + amount);\n    }\n}\n```\n\n\n\n使用上述代码，我只同步了一小块命令。屏幕打印是不同步的，当运行应用程序时，结果略有不同。然而，应用程序仍然运行正常。如上述语法所示，将此内容传递给\
  \ `synchronized` 块会告诉 `Monitor` 对该对象进行保护，但仅在块内进行保护。![](img/Image00126.jpg)\n\n如果按照练习\
  \ 1，同步是同时在“检查”和“取款”方法上进行的，那么当丈夫先进入时，系统会检查丈夫是否已完成所有为妻子提供服务的操作。因此，使用练习 1 的系统时，当妻子来使用系统时，需要很长时间才能看到系统响应，因为丈夫仍然需要等待丈夫完成。至于这个练习，你会发现系统会对两者都做出响应（在屏幕上打印可用余额），因为同步代码行尚未到达。直到丈夫正式进入检查金额的方法，新系统才会对妻子执行互斥操作（Mutual\
  \ Exclusive）。正如你在上面的控制台上看到的那样。\n\n所以我们查看了同步 `Thread` 的第一种方法。这个 `synchronized` 关键字的使用非常简单，我看到它被广泛用于多线程冲突避免场景。\n\
  \n# 第 43 课：同步部分 3 同步协作\n\n这篇 Java 续作已经有一段时间了。这可以看作是开启新年的 Java 课程，但是去年欠的话题。也许是因为长时间的等待会让你忘记一点。我们再次讨论\
  \ Java 编程中的 `Thread Synchronization` 方法。我们找到了一种让 `Threads` 在并行任务执行中“自由释放”的方法，让它们在共同使用对象状态（我们称之为资源）时知道要遵循某些顺序规则。上一节是一种方法，现在我们来看第二种。欢迎来到课程。\n\
  \n## 一. 什么是同步协作？\n\n同步协作（Synchronization Cooperation），某些文档称为“线程间通信”（Inter-Thread\
  \ Communication），这种同步方法的目的是无意中避免线程同时使用同一个对象或系统资源时发生冲突。那么，为什么被称为“协作”呢？与上一节概述的互斥同步方法不同，上一节的方法创建了一种排斥机制，帮助先使用资源的\
  \ `Threads` 优先考虑，后使用的 `Threads` 被排除并必须等待。这种方法恰恰相反。不再有“先来后得”，但它们之间有“协作”（`Cooperation`），以一种精神协作，即一个\
  \ `Thread` 可以完全“让出”另一个线程来使用它先“赢得”的资源，这样当另一个 `Thread` 完成使用该资源后，该线程就必须“唤醒”它，以便它继续在该资源上工作。\n\
  \n## 二. 如何进行同步协作？\n\n正如你所知，这种同步方法的核心是线程在资源使用上必须相互调整和让位。因此，我们必须熟悉涉及修改和让位的方法，而不仅仅像上一节那样仅使用关键字。我们讨论的是\
  \ `wait()`、`notify()` 和 `notifyAll()` 方法。\n\n在学习这 3 个方法的含义和用法之前，我想简单地重复一下上一节提到的\
  \ `Monitor` & `Lock` 机制。因为本节的同步并不是脱离这个 `Monitor` 和 `Lock` 的。如上一节所述，系统中的每个对象都有一个管理的\
  \ `Monitor`。每个 `Monitor` 只有一个 `Lock`。当线程想要使用该对象时，它必须通过该对象的 `Monitor` 进行注册，`Monitor`\
  \ 将 `synchronized` 关键字上的 `Lock` 授予有权使用该对象的线程。你所熟悉的：告诉 `Monitor` 如果你将 `Lock` 给某些线程，其他线程将留在\
  \ `Monitor` 中等待，直到 `Lock` 返回。\n\n所以仍然基于这个 `Monitor` & `Lock` 机制，本节的内容将如下。我们将结合上面提到的方法一起。请注意，这些方法是构建在\
  \ `Object` 超类中的，这意味着 Java 中的所有对象都有这些方法。\n\n1.  `wait()`：此方法被调用时，会导致持有该对象 `Lock`\
  \ 的 `Thread` 将该 `Lock` 返回给该对象的 `Monitor`。同时，该线程进入睡眠，等待另一个线程通过下面两种方法之一唤醒它。\n2.  `notify()`：如上所述，此方法帮助“唤醒”通过\
  \ `wait()` 方法进入睡眠的 `Thread`。\n3.  `notifyAll()`：此方法比 `notify()` 更具扩展性。它唤醒所有在该对象内调用过\
  \ `wait()` 的线程。\n\n如你看到的，使用本节同步方法的核心思想是“让出”。一个 `Thread` 先进入对象的 `Monitor`，获得了该对象的\
  \ `Lock`，但由于某些实际情况，该 `Thread` 还没有使用该对象。它执行 `wait()` 让某个线程先使用该对象，然后唤醒它，以便它可以继续当前正在进行的工作。为了更好地理解如何在同步中中使用这些方法，让我们进入接下来的练习。\n\
  \n## 三. 练习解决从银行取款\n\n我们继续构建银行相关的操作。你可以回顾之前的练习以复习旧的同步模式，并与本次练习的脚本进行比较。\n\n此前，你建立了一个“完美”的算法，丈夫和妻子在同一个账户上执行取款。你通过回顾之前的练习来复习旧的同步模式，并与本次练习的脚本进行比较。\n\
  \n假设你所工作的银行有一个新服务，即协助用户在账户余额充足时提交取款订单。这意味着，当客户提交取款订单且银行账户足以执行此操作时，客户将立即收到资金；但如果不足，它将等待账户恰好足够，然后执行取款订单。这部分的要求有点复杂。如果你不看本节，可以为应用程序构建一个定期检查账户的功能，例如每分钟检查一次，只要有足够的资金取款，订单就会立即执行。定期测试的想法似乎正确，但并不好。\n\
  \n\n\n\n```java\nlong amount = 5000000; // 账户金额\npublic synchronized boolean checkAccountBalance(long\
  \ withDrawAmount) {\n    // 参考上一节课的代码，请你自己复制/粘贴它，\n    // 本节不再再次显示它\n}\n\npublic\
  \ synchronized void withdraw(String threadName, long withdrawAmount) {\n    // 参考上一节课的代码，请你自己复制/粘贴它，\n\
  \    // 本节不再再次显示它\n}\n\npublic synchronized void withdrawWhenBalanceEnough(String\
  \ threadName, long withdrawAmount) {\n    // 打印检查取款信息\n    System.out.println(threadName\
  \ + \"check:\" + withdrawAmount);\n    while (!checkAccountBalance(withdrawAmount))\
  \ {\n        // 如果余额不足，则等待直到余额足够后再取款\n        System.out.println(threadName + \"\
  wait for balance enough\");\n        try {\n            wait();\n        } catch\
  \ (InterruptedException e) {\n            // TODO 自动生成的异常处理块\n            e.printStackTrace();\n\
  \        }\n    }\n    // 资金充足或不再等待，则允许取款\n    // 模拟取款时间并\n    // 将剩余金额更新到数据库\n\
  \    try {\n        Thread.sleep(2000);\n    } catch (InterruptedException e) {\n\
  \        e.printStackTrace();\n    }\n    amount -= withdrawAmount;\n    System.out.println(threadName\
  \ + \"withdraw successful:\" + withdrawAmount);\n}\n\npublic synchronized void deposit(String\
  \ threadName, long depositAmount) {\n    // 打印存款者信息\n    System.out.println(threadName\
  \ + \"deposit:\" + depositAmount);\n    // 模拟充值时间并\n    // 将新金额更新到数据库\n    try {\n\
  \        Thread.sleep(2000);\n    } catch (InterruptedException e) {\n        e.printStackTrace();\n\
  \    }\n    amount += depositAmount;\n    // 唤醒休眠的对象并等待取款\n    notify();\n}\n}\n\
  ```\n\n注意 `BankAccount` 方法中使用的 `wait()` 和 `notify()` 方法。首先，你应该知道，本节的同步方法必须保持在 `synchronized`\
  \ 块内部，以避免冲突。因此，`withdrawWhenBalanceEnough()` 和 `deposit()` 方法都是同步方法。如果你不理解 `synchronized`\
  \ 关键字的用途，请复习上一节。\n\n回到 `BankAccount`。`withdrawWhenBalanceEnough()` 方法刚刚进入检查余额阶段。如果余额不足，它会立即遇到\
  \ `wait()` 命令。话如此，该命令会导致持有当前 `Lock` 的 `Thread` 返回 `Lock` 并进入睡眠，等待其他 `Thread` 唤醒。此段落中检查余额的\
  \ `while` 循环有助于 `Thread` 在存活时仍然再次检查余额。如果唤醒时余额充足，将在下方的代码行执行取款。余额不足，则 `wait()` 并再次睡眠。你理解了吗？\n\
  \n`BankAccount` 中的 `deposit()` 方法是账户充值的方法。充值完成后，该方法会持续调用 `notify()` 来唤醒某些休眠的线程，并等待取款。实际上，`deposit()`\
  \ 中的 `notify()` 并不知道哪个 `thread` 在休眠并等待唤醒，所以如果你确定，只需调用 `notifyAll()` 来唤醒所有调用过 `wait()`\
  \ 的线程，这在 `BankAccount` 中是没问题的。\n\n然后，为了方便，我们构建了 2 个 `Threads`：一个用于余额足够时取款的 `Thread`，另一个用于充值的\
  \ `Thread`。`Thread` 的取款逻辑如下。\n\n```java\npublic class WithdrawThread extends Thread\
  \ {\n    String threadName = \"\";\n    long withdrawAmount = 0;\n    BankAccount\
  \ bankAccount;\n    public WithdrawThread(String threadName, BankAccount bankAccount\
  \ , long withdrawAmount) {\n        this.threadName = threadName;\n        this.bankAccount\
  \ = bankAccount;\n        this.withdrawAmount = withdrawAmount;\n    }\n\n    @Override\n\
  \    public void run() {\n        bankAccount.withdrawWhenBalanceEnough(threadName,\
  \ withdrawAmount);\n    }\n}\n```\n\n`WithdrawThread` 的取款很容易理解，对吧？并没有新内容。这里是充值的\
  \ `Thread`。\n\n```java\npublic class DepositThread extends Thread {\n    String\
  \ threadName = \"\";\n    long depositAmount = 0;\n    BankAccount bankAccount;\n\
  \    public DepositThread(String threadName, BankAccount bankAccount , long depositAmount)\
  \ {\n        this.threadName = threadName;\n        this.bankAccount = bankAccount;\n\
  \        this.depositAmount = depositAmount;\n    }\n\n    @Override\n    public\
  \ void run() {\n        bankAccount.deposit(threadName, depositAmount);\n    }\n\
  }\n```\n\n`Threads` 的取款和充值没有区别，我们只是将 2 个 `Threads` 分离到 `main()` 方法中以便观察。你仍然可以将这两个\
  \ 2 个线程合并为 1 个。你可以尝试一下。\n\n我们在 `main()` 方法中如下调用 2 个 `Thread`：\n\n```java\npublic\
  \ class MainClass {\n    public static void main (String [] args) {\n        BankAccount\
  \ bankAccount = new BankAccount ();\n        // 妻子想要取 1000 万越南盾\n        // （注意资金不足取款的情况）\n\
  \        WithdrawThread wifeThread = new WithdrawThread (\"Wife\", bankAccount,\
  \ 10000000);\n        wifeThread.start ();\n        // 丈夫存款 500 万越南盾\n        DepositThread\
  \ husbandThread = new DepositThread (\"Husband\", bankAccount, 5000000);\n     \
  \   husbandThread.start ();\n    }\n}\n```\n\n此时，你可以运行程序以查看结果是如何打印到控制台的。\n\n![](img/Image00127.jpg)\n\
  \n我们刚刚完成了 `Thread Synchronization` 系列知识的第 3 部分。但这已经是 `Thread` 知识系列中的第 6 个知识点了。你可以看到\
  \ `Thread` 的重要性。我们在这里结束 `Thread Synchronization` 系列。但并不是 `Thread` 知识链的终点。下一节我们将来到关于\
  \ `Thread` 的新知识。\n\n# 第 44 节：死锁\n\n通过上一节，我们完成了 `Thread Synchronization`。你已经看到了 `synchronized`\
  \ 关键字在确保共享资源不发生冲突方面的强大作用。确实，`synchronized` 非常有用，但如果你在错误的地方误用了它，就会出现本节所针对的情况。这种情况被称为\
  \ `死锁` (Deadlock)。\n\n\n\n\n虽然这种情况不会导致编程中那种“程序等死”，但它也让诉讼者不知道如何处理。下图显示了一名警察正抓着一名劫匪。警察希望另一个劫匪先交出人质，然后才释放他所抓持的那个劫匪。与此同时，另一个劫匪绝对不会归还人质，迫使警察先释放他的同伙。\n\
  \n![](img/Image00128.jpg)\n\n### 在现实中模拟死锁的可能性\n因此，在这种情况下，双方都持有着自己的人质，且都不会向对方归还人质。这种情况在短期内显然很难达成。这种情况发生时就产生了死锁。\n\
  \n## II. 编程中的死锁\n在编程中，死锁的情况与上述有趣的现实案例相似。假设 `Police` 和 `Robbery` 分别是两个 `Thread`。那么劫匪团和\
  \ `Hostages` 就是资源。`Police Thread` 正在通过 `synchronized` 关键字持有着 `Robber's` 的同伙，但 `Police\
  \ Thread` 真正想要的是 `Hostages`。我相信这些人质也被 `Thread Pirates` 通过 `synchronized` 关键字持有着，而\
  \ `Pirates` 也想要获得 `posse robbery`。在编程中，死锁也会发生。\n\n### III. 导致死锁的应用构建实践\n如果上述的实践和理论情况能让你更好地理解死锁，那么现在我邀请你构建一个能够导致死锁的真实应用程序。我们仍然回到银行应用的构建场景，就像你已经熟悉的\
  \ `Thread synchronization` 课程一样。假设银行老板来找你，让你构建账户间的转账功能。功能构建完成后，家里有一对夫妇。丈夫有自己的账户，妻子在同一银行也有一个独立的账户。某天，由于他们互不理解，丈夫从自己的账户向妻子转账了\
  \ 300 万越南盾，同时，妻子也从她的账户向丈夫转账了 200 万越南盾。讽刺的问题在于，这两个人在同时执行转账。奇怪的是，应用程序挂起了，这意味着这对夫妇一直在等待，而转账仍然失败了。为什么呢？让我们来看看你写的代码。\n\
  \n假设你的 `BankAccount` 类已经根据之前的课程构建了内置 `withdraw` 和 `deposit` 方法。这里我写的比上一节课短，忽略了余额检查，并尽可能简洁地模拟该类的取款/充值时间。\n\
  \n```java\npublic class BankAccount extends Object {\n    long amount = 5000000;\
  \ // 账户中的金额\n    String accountName = \"\";\n\n    public BankAccount (String accountName)\
  \ {\n        this.accountName = accountName;\n    }\n\n    public synchronized void\
  \ withdraw (long withdrawAmount) {\n        // 打印开始扣钱的状态\n        System.out.println\
  \ (accountName + \"withdrawing ...\");\n        // 扣除\n        amount -= withdrawAmount;\
  \ \n    }\n\n    public synchronized void deposit (long depositAmount) {\n     \
  \   // 打印开始充值的状态\n        System.out.println (accountName + \"depositting ...\"\
  );\n        // 充值\n        amount += depositAmount; \n    }\n}\n```\n\n现在你为这个类构建了更多转账方法。你将其命名为\
  \ `transferTo()`。由于过于谨慎，你在这个方法中加入了 `synchronized` 块。`BankAccount` 类的完整代码如下：\n\n\
  ```java\npublic class BankAccount extends Object {\n    long amount = 5000000; //\
  \ 账户中的金额\n    String accountName = \"\";\n\n    public BankAccount (String accountName)\
  \ {\n        this.accountName = accountName;\n    }\n\n    public synchronized void\
  \ withdraw (long withdrawAmount) {\n        // 打印开始扣钱的状态\n        System.out.println\
  \ (accountName + \"withdrawing ...\");\n        // 扣除\n        amount -= withdrawAmount;\n\
  \    }\n\n    public synchronized void deposit (long depositAmount) {\n        //\
  \ 打印开始充值的状态\n        System.out.println (accountName + \"depositting ...\");\n \
  \       // 充值\n        amount += depositAmount;\n    }\n\n    public void transferTo\
  \ (BankAccount toAccount, long transferAmount) {\n        synchronized (this) {\n\
  \            // 从此账户取钱钱\n            this.withdraw (transferAmount);\n         \
  \   synchronized (toAccount) {\n                // 存入 toAccount\n              \
  \  toAccount.deposit (transferAmount);\n            }\n            // 转账结束打印账户余额\n\
  \            System.out.println (\"The amount of\" + accountName + \"is:\" + amount);\n\
  \        }\n    }\n}\n```\n\n在 `main()` 方法中，按照如下方式调用转账指令。\n\n```java\npublic static\
  \ void main (String [] args) {\n    // 丈夫和妻子的账户\n    BankAccount husbandAccount\
  \ = new BankAccount (\"Husband's Account\");\n    BankAccount wifeAccount = new\
  \ BankAccount (\"Wife's Account\");\n\n    // 丈夫想从照片中的账户向妻子账户转账 300 万\n    Thread\
  \ husbandThread = new Thread () {\n        @Override\n        public void run ()\
  \ {\n            husbandAccount.transferTo (wifeAccount, 3000000);\n        }\n\
  \    };\n\n    // 妻子想从她的账户向丈夫账户转账 200 万\n    Thread wifeThread = new Thread () {\n\
  \        @Override\n        public void run () {\n            wifeAccount.transferTo\
  \ (husbandAccount, 2000000);\n        }\n    };\n\n    // 两个人几乎同时进行转账订单\n    husbandThread.start();\n\
  \    wifeThread.start();\n}\n```\n\n这里是程序执行的结果。\n\n![](img/Image00129.jpg)\n\n这些执行结果是在程序执行时打印到控制台的。正如你所理解的。你看，两个\
  \ `Thread` 启动后，只能执行对源账户自身的扣除操作。然后对目标账户的充值方法……无法被调用。此时应用程序仍在运行，证据是控制台标签页旁边的红色正方形停止按钮仍然开启，也就是说，应用程序仍在运行，且\
  \ Eclipse 仍然允许你随时停止应用程序。应用程序无法被永久终止，因为每个 `Thread` 自身在初始化时都持有某个账户的 `Monitor.` 的 `Lock`，其他\
  \ `Threads` 无法干扰每个线程持有的账户。每个 `Thread` 持有一个账户并等待使用另一个账户（由另一个 `Thread` 持有）的事实被称为死锁。\n\
  \n\n\n\n它与下图相似。![](img/Image00130.jpg) 上述示例的死锁产生图 III。\n\n### III. 死锁何时出现？\n\n正如你所了解的，当我们过度使用\
  \ `synchronized` 关键字时，经常会出现死锁。它导致 `Threads` 永久地持有共享对象，并且不将其归给其他对象使用。\n\n然而，这关于死锁的课程仅仅是一堂理论课程，在我看来它主要是一个警告。事实上，发生这样的死锁是非常困难的。但是，尽管不太可能发生，但它确实发生过，作为开发者，我们的职责仍然需要了解并准备好相关的必要知识。\n\
  \n### IV. 如何避免死锁以及如果遇到死锁该如何处理？\n\n正如我所说，死锁在实践中极少发生。实际上，在我的编程生涯中，从未遇到过这种情况。据我所知，我们的应用程序使用了许多\
  \ `Threads`，但还没有多到足够复杂到导致像上面示例那样的冲突。\n\n但即使不太可能发生，我们仍然需要知道如何最大限度地减少这种死锁现象的风险。即便避免了它，万一有一天死锁真的发生在你的应用程序上了呢？你仍然应该准备好相关知识，以修复源代码并立即发布补丁。本节将涵盖如何避免和修复死锁错误。\n\
  \n首先，在我看来，为了避免死锁，你仍然需要理解你的代码。你必须知道所使用的 `Threads` 使用了哪些资源。是否有大量线程占用共享资源？确保 `Threads`\
  \ 在消耗资源后最终尽快将资源返回给系统，以便其他 `Threads` 才有机会使用并结束这些线程的生命周期。最简单的方法是不像上面的示例那样嵌套 `synchronized`\
  \ 块，以确保死锁极不可能发生。\n\n然后，如果你的应用程序在真实环境中执行时遇到了死锁。如果你的项目相对较小，你也可以通过阅读代码和推理来检测它。但如果项目太大，你可以使用许多具有\
  \ `Thread Dump` 功能的工具。如下所示，感谢 JDK `/bin` 目录下提供的一个工具，名为 `jvisualvm` 的工具。关于如何使用该工具并找到\
  \ `Thread Dump`，你可以参考网上的更多信息，或者查看此链接以了解所有包括 `jvisualvm` 在内的工具![](img/Image00131.jpg)\
  \ 线程中的死锁检测工具及相关资源\n\n死锁课程到此结束。你可以看到死锁仍然与强大的线程知识链相关。借此，你已经看到了 Java 中 `Threads` 的重要性，对吧？\n\
  \n这是 Java 核心的最后一节课。我希望你现在对 Java 技能充满了信心。祝愿大家好运。\n"
