  md: '# 4 Quick Recursion


    using the phrase “any number of ..,” which can be implemented with a loop. This
    is true—we don’t need recursion. In fact, recursion is *never* absolutely necessary,
    merely useful.


    The definitions we have considered so far have all been examples of *direct recursion*.
    For an example of *indirect recursion*, consider the following pair of definitions
    (adapted from Lisp):


    **S-expression:** an identifier or a list.


    **List:** a sequence consisting of


    +   1. a left parenthesis,

    2. zero or more S-expressions separated by blanks,

    3. a right parenthesis.


    Thus, the following things are lists (and also S-expressions):


    ```

    ()

    (ZIP ZAP ZOT)

    (ONE TWO THREE) ((FOUR)) FIVE

    () IXOHOXI (

    ```


    These definitions are **mutually recursive**: each is defined in terms of the
    other. The basis for the S-expression is an identifier, while the basis for the
    list is the sequence (().


    To show that these definitions “work,” consider the S-expression (NOT HARD)).


    +   1. (NOT (HARD)) is an S-expression because it is a list.'
