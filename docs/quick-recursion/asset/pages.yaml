  md: '# Trick #1: Indent when you print method entries and exits. Often, the best
    debugging technique is to print every method call and return (or at least the
    most important ones). You probably want to print, for each method, what parameters
    it came in, and what value it leaves with. However, if you just print a long list
    of these, it''s hard to match up method exits with their corresponding entries.
    Indentation that shows the level of nesting can help.


    Indenting requires keeping track of the current level of indentation. This can
    be done with an additional parameter, or with the use of a global variable. The
    use of global variables is strongly discouraged in general, but if a global variable
    is used only for this purpose, it should not affect the proper functioning of
    the code.


    # Trick #2: Use specialized print methods for debugging. Don''t clutter your actual
    code more than you must. Also, remember that code inserted for debugging purposes
    can itself contain bugs, or (in the worst case) can affect the results, be very
    careful with it.


    When debugging, it is useful to see what arguments each function is called with,
    and what value it returns. This is some of the same information provided by a
