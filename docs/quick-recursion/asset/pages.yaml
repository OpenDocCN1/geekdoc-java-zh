  md: "# 8 ■ Quick Recursion\n\ncode that doesn't require a user response, a few simple\
    \ rules (to be described) must be followed.\n\n# 1.4 FACTORIAL\n\nThe usual first\
    \ example of recursion is the factorial function. We will use it for the same\
    \ reason everyone else does: It is simple.\n\nThe factorial of a positive integer\
    \ n, written n!, is the product of the positive integers from 1 up to and including\
    \ n. Thus, we have\n\n```\n1! == 1\n2! == 1 * 2 == 2\n3! == 1 * 2 * 3 == 6\n4!\
    \ == 1 * 2 * 3 * 4 == 24\n```\n\nand so on.\n\nNote that, for example, 4! == 1\
    \ * 2 * 3 * 4 == (1 * 2 * 3) * 4 == 3! * 4, and in general n! == (n-1)! * n. This\
    \ leads to the following recursive definition:\n\nThe factorial of a positive\
    \ integer n is\n\n+   1. 1, if n == 0 (base case), or\n2. (n - 1)! * n, if n >\
    \ 0 (recursive part).\n\nThis definition leads immediately to the following Python\
    \ program:\n\n```\ndef factorial(n):\n    \"Computes the factorial of its argument.\"\
    \n    if n == 0:\n        return 1\n    else:\n        return factorial(n - 1)\
    \ * n\n```"
