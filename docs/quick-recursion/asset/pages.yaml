  md: '# Understanding Recursion


    # 1.1 A NOTE ON LANGUAGES


    Any programming book needs examples, and examples have to be in some language.


    This book uses two well-known languages, Java and Python 3. The code is kept simple,
    without any language-specific “tricks,” so it should be accessible even programmers
    who know neither of these languages.


    That said, it is impossible to avoid all language-specific features and still
    have working code. Python uses indentation to show nesting of statements, while
    Java uses braces. To remove leading braces, Python uses strip() while Java uses
    trim(). Differences such as these should not greatly obscure the examples.


    # 1.2 RECURSIVE DEFINITIONS


    A recursive definition is a definition in which the thing being defined occurs
    as part of its own definition.'
