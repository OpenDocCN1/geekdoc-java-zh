  md: '# Understanding Recursion ■ 3


    This definition is recursive. The first part is an ordinary definition, and tells
    us that the letter “h” is a howl; this gives us a basis, or place to start. The
    second part is the recursive part; it tells us that, since “h” is a howl, so are
    “ha,” “he,” “hi,” “ho,” “hu,” and “hy.” But these are howls, so also must be “haa,”
    “hae,” …., “hyy,” …. “haaeeuooeea,” etc.


    Note that this is a “good” definition in the sense that some things are howls,
    some things are not howls, and it is easy to tell from the definition which are
    howls. The “circularity” of the second part of the definition causes no harm because
    the first part provides a basis.


    Recursion abounds in computer science. A typical definition of “identifier” (or
    “variable name”), for example, is as follows.


    # Identifier:


    +   1. a letter, or

    2. an identifier followed by a letter, digit, or underscore.


    Notice that the definitions of both “howl” and “identifier” allow arbitrarily
    long strings. It is possible to write recursive definitions which limit the size
    of the things being defined, but in general this is neither easy nor desirable.
    Instead, if there be limits, they are set by some external agency. Some programming
    languages, for example, allow arbitrarily long identifiers, but require that two
    different identifiers must differ in the first $k$ characters, where $k$ is set
    by the implementation. In the same way, the maximum length of a howl might be
    determined by your lung capacity.


    You have probably noticed that the above definitions don’t have to be recursive;
    they could be made into ordinary definitions by'
