  md: 'Quicksort was invented by one of the programming greats, Tony Hoare. At the
    time he was unable to implement the algorithm in Autocode, which did not support
    recursion. When attending a course on Algol 60, one of the first programming languages
    (after Lisp) to support recursion, he was able to do so.


    The trickiest part of writing a quicksort algorithm is not the recursive part,
    but is instead a nonrecursive method, usually called partition, that it uses.


    The partition method takes three parameters: an array, a smallest index, and a
    largest index. Then, the partition method:


    +   1. chooses any number from the given array interval (often the first number,
    because that''s easy), and uses this number as the pivot.


    +   2. rearranges the numbers in the array interval so that the numbers less than
    the pivot precede all the numbers larger than the pivot, and the pivot is in between
    the two groups (numbers equal to the pivot may be in either group); and


    +   3. returns the index at which the pivot value ended up.


    For example, given the array


    [5, 7, 1, 9, 8, 2, 3, 2, 9, 4, 5, 1, 3]


    the partition method might choose 5 as the pivot, produce the array


    [2, 3, 1, 1, 4, 2, 3, 5, 9, 8, 5, 9, 7]


    and return 7 as the index of the pivot.'
