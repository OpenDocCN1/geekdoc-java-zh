  md: '# Backtracking ■ 77


    As an example, suppose you want to get from Smallville to Metropolis. You have
    a map on which the cities are nodes, and two cities are neighbors if there is
    a highway from one to the other, with no intervening cities. A simple graph search
    will (eventually) find a path from one to the other.


    This example suggests a number of ways in which the search might be improved.
    We might have distances marked on each highway between two cities, and we would
    prefer to minimize distances. We might know that Metropolis is east of Smallville,
    so we would prefer to go in that direction. Some roads might be toll, which we
    can take if there isn''t a better alternative. Some roads might be one-way. And
    so on.


    Most libraries provide list, binary tree, and tree objects, but not graph objects.
    Because of the high variability in types and uses of graphs, there is not a “best”
    way to represent a graph, nor is there a best way to search a graph. Implementation
    of graph structures is usually left up to the individual programmer.


    # 3.8 DEBUGGING TECHNIQUES


    Often our first try at a program doesn’t work, and we need to debug it.


    We have emphasized that one should not “look down” into a recursion when trying
    to write or understand a recursive routine. Debuggers are sometimes helpful, but
    using one to debug a recursive routine strongly encourages this approach, because
    you can only see the state of the program from moment to moment. Using print statements
    can be much more helpful for this kind of debugging; they allow you to see the
    overall structure, and to match calls with results.


    There are some simple tricks to making effective use of print statements. These
    tricks can be applied to any program, but are especially useful when you are trying
    to debug recursive routines.'
