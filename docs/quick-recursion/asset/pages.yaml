    \ the node is a goal node,\n  return success.\n- for each child of the node:\n\
    \  if searching from that child succeeds,\n  return success.\n- return failure.\n\
    \nBinary trees and general trees do not contain cycles. That is, going \"down\"\
    \ into a tree, following links to children, you will never find yourself back\
    \ at the same node you started from."
