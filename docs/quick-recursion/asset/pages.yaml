  md: "# Backtracking ■ 61\n\nelse pop the node off the stack\nreturn false\n\nStarting\
    \ from the root, the only nodes that can be pushed onto the stack are the children\
    \ of the node currently on the top of the stack, and these are only pushed on\
    \ one child at a time; hence, the nodes on the stack always describe a valid path\
    \ in the tree. Nodes are removed from the stack only when it is known that they\
    \ have no goal nodes among their descendants. Therefore, if the root node gets\
    \ removed (making the stack empty), there must have been no goal nodes at all,\
    \ and no solution to the problem.\n\nWhen the stack algorithm terminates successfully,\
    \ the nodes on the stack form (in reverse order) a path from the root to a goal\
    \ node.\n\nSimilarly, when the recursive algorithm finds a goal node, the path\
    \ information is embodied (in reverse order) in the sequence of recursive calls.\
    \ Thus as the recursion unwinds, the path can be recovered one node at a time,\
