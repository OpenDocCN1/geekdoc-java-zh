  md: "Graphs may contain cycles. By going from one node to the next, you might find\
    \ yourself back where you started. Graphs are not hierarchically organized and\
    \ do not have one distinguished root node, so instead of referring to the children\
    \ of a node, we talk about its neighbors—the other nodes you can get to from this\
    \ node.\n\nSearching a graph is like searching a tree, except that we want to\
    \ avoid getting stuck in a cycle, visiting the same nodes over and over again.\
    \ In principle, this is simple—any time we visit a node we've been to before,\
    \ call that a failure. After all, we didn't find anything the last time we were\
    \ here, so we won't win this time, either.\n\n+   To search from a node:\nif the\
    \ node is a goal node,\n  return success.\nif we've been at this node before,\n\
    \  return failure.\nfor each neighbor of the node:\n  if searching from that neighbor\
    \ succeeds,\n  return success.\nreturn failure.\n\nThere are two basic ways to\
    \ tell if we've been at a node before.\n\n+   When we get to the node, look for\
    \ a mark. If there is one, we know we've been there before, so we don't need to\
    \ search from there again. Otherwise, mark it and continue the search.\n A **marking\
    \ algorithm** both looks at values in the graph and changes them. This is contrary\
    \ to our general advice not to do both in a recursion. However, in this case,\
    \ we don't have to consider other levels of the recursion—either we've been to\
    \ this node before, or we haven't.\\nKeep a set of all the nodes we've been to,\
    \ and look to see if this node is in that set. If not, add it to the set."
