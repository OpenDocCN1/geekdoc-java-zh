    Binary trees are defined recursively: A (non-empty) binary tree consists of a
    value and two other binary trees. The values in each node are the user data, while
    the (references to) other binary trees provide the structure.


    **Note:** Yes, this definition allows a binary tree to be empty (null or None).
    This lets us think of a node as always having two children, one or both of which
    may be empty, and this simplifies programming. In mathematics, an empty binary
    tree would be called a *degenerate case*.


    All nodes are reachable (by one or more steps) from the root node. In general,
    it is only possible to move “down” in the binary tree (from parent to child),
    not “up” (from child to parent). A node that has neither a left child nor a right
    child is called a *leaf* and is used as the base case in many applications.


