  md: "# Understanding Recursion ■ 9\n\nOr the equivalent Java program:\n\n```\npublic\
    \ static int factorial(int n) {\n    if (n == 0) return 1;\n    else return n\
    \ * factorial(n - 1);\n}\n```\n\nThis function has a base case (when n == 0) and\
    \ a recursive part (when n is positive), and it does part of the work (multiplying\
    \ by n) at each level of the recursion. Thus it seems as though the function might\
    \ possibly work. But if this is the first time you have seen recursion, you may\
    \ not be comfortable with it.\n\nSome authors suggest that the best way to understand\
    \ a recursive function is to trace through it, keeping track of what happens at\
    \ every call and every return of the function. By all means through such a trace,\
    \ doing so helps you believe recursion can actually work. But you should never\
    \ think of tracing through a recursive procedure as a means of understanding,\
    \ such as a procedure. “Tracing through” has probably kept thousands of people\
    \ from ever really understanding recursion. The purpose of this book is to describe\
    \ a better technique.\n\n# 1.5 THE PRINCIPLE OF INFORMATION HIDING\n\nPerhaps\
    \ the single most important tool we have for controlling the complexity of programs\
    \ is modularization: breaking a single complex program up into several simpler,\
    \ logically independent computations. Depending on the programming language, these\
    \ are called by various names: functions, methods, procedures, etc.\n\nWhenever\
    \ a program is broken into two parts, there comes into being an interface between\
    \ them. This interface consists of the parameter list, any global or common variables\
    \ they may share between them, any results returned or exceptions raised, and\
    \ often"
  merge: -1
  pgno: 23
- img_proc: true
  md: 'more subtle ways of information transmission. If modularization is to succeed
    in reducing complexity, this interface must be kept narrow and as explicit as
    possible.


    The best way to keep the interface narrow is to ensure that each routine does
    just one thing, and that thing can be easily described in an English sentence
    with few or no “buts” and “excepts” in it. Keeping parameter lists short and avoiding
    global variables can also help.


    The best way to make the interface explicit is to ensure, whenever possible, that
    all information transmission occurs via the parameter list, not through global
    variables. There are those who feel global variables should be avoided entirely,
    but I don''t take such an extreme position. It is often more convenient to have
    global access to arrays and other large data structures; just take special care
    it''s not to modify them accidentally.


    Side effects should also be avoided. The main effect of a routine is the thing
    it''s supposed to do; side effects are the little extra things it does. Side effects
    are dangerous when they''re intentional. For example, if a function factorial(n)
    computes n!, that''s its main effect; but if it also stores the result in a global
    variable, that''s a side effect. This is bad because it compensates in the factorial
    function, but errors from this side effect will show up in any code which calls
    factorial. Since these routines themselves may be correct, the likely result is
    that the programmer spends hours trying to debug the wrong routines.


    We are now in a position to state the Principle of Information Hiding: Every routine
    should mind its own business. No routine should meddle in the affairs of another.
    Or, somewhat more formally,'
