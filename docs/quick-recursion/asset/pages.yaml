  md: "```\npublic static int maximum(int[] numbers) {\n    return maxHelper(numbers,\
    \ 0, numbers.length - 1);\n}\n\nprivate static int maxHelper(int[] numbers,\n\
    \    int lo, int hi) {\n    if (lo == hi) return numbers[lo];\n    int mid = (lo\
    \ + hi) / 2;\n    int leftmax = maxHelper(numbers, lo, mid);\n    int rightmax\
    \ = maxHelper(numbers, mid + 1, hi);\n    if (leftmax > rightmax) return leftmax;\n\
    \    else return rightmax;\n}\n```\n\nDo these programs satisfy the four rules?\n\
    \n+   1. Do they handle the base case(s) first? Yes, if there is only one number\
    \ in the array interval, that number is returned.\n2. Do they recur only with\
    \ a simpler case? Yes, there are two recursions, each with either a smaller array\
    \ or an array of size 1.\n3. Do they have side effects that interfere with the\
    \ calling program? No, because every variable is local, and the numbers list or\
    \ array is not changed.\n4. Do we need to “look down” into the recursion, or otherwise\
    \ consider what is happening at some other level? No, we don’t.\n\nAnd we’re done.\n\
    \n# 2.1.2 Quicksort\n\nQuicksort is one of the most widely used sorting algorithms,\
    \ and it is inherently recursive."
