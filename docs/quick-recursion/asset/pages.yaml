    FIGURE 3.1 A tree with one good leaf.


    The following shows how backtracking might proceed on the tree in Figure 3.1:


    +   1. Starting at Root, your options are A and B. You choose A.

    2. At A, your options are C and D. You choose C.

    3. C is bad. Go back to A.

    4. At A, you have already tried C, and it failed. Try D.

    5. D is bad. Go back to A.

    6. At A, you have no options left to try. Go back to Root.

    7. At Root, you have already tried A. Try B.

    8. At B, your options are E and F. Try E.

    9. E is good. Congratulations!


    In this example we drew a picture of a tree. The tree is an abstract model of
    the possible sequences of choices we could make. There is also a data structure
    called a tree, but sometimes we don''t have a data structure to tell us what choices
    we make. (If we do an actual tree data structure, backtracking on it is called
    depth-first tree searching.)


