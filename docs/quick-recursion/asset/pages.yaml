    # 2.2 LISTS


    A list is either empty, or it has a head (a first element) and a tail (a list
    of all the remaining elements). This is a recursive definition with the list serving
    as a base case.


    The elements of a list may be a value of any sort, including other lists. This
    allows for some fairly complex structures to be built.


    Every list must come to an end, and that occurs when the tail is the empty list.
    An empty list can be represented by the value null (in Java) or None (in Python).'
