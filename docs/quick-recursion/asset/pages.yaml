  md: '# Preface


    RECURSION IS CONSIDERED TO BE AN “ADVANCED” TOPIC.

    It shouldn''t be.


    When my oldest daughter was in high school, she was deeply involved in a multiplayer
    dungeon (MUD) game. She implemented an email system for it, using a language called
    Forth, which uses recursion extensively.


    When she went to college, she took a programming class. After a week or so she
    called home and asked me, “Daddy, what are loops for?” When I explained, she said,
    “Why not just use recursion? It’s so much simpler.\”


    I agree.'
