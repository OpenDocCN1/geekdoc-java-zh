  md: "# Understanding Recursion 11\n\n+   - A routine should use only the information\
    \ provided to it, preferably via its parameter list. If it must access global\
    \ data, that fact must be clearly and unambiguously specified.\n\n+   - A routine\
    \ should return a single result (in Python, this could be a tuple of values) and\
    \ do nothing else. If it must modify global data, that fact must be clearly and\
    \ unambiguously specified.\n\n+   - A routine should be independent of its context.\
    \ For example, if some routine calls a sort method,\n\n+   - that routine should\
    \ neither know care just how the sort method operates, so long as the sorting\
    \ happens,\n\n+   - and in addition, the sort method should neither know nor why\
    \ its calling routine wants the sorting done.\n\nSimilar rules hold for classes\
    \ and objects. An object holds various kinds of data; the class of the object\
    \ holds methods to manipulate that data. An object's data should be accessed and\
    \ modified only by the methods given in its class, never from outside the class.\n\
    \nHere are three simple examples of violations of the Principle of Information\
