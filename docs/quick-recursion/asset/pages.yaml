  md: '# Understanding Recursion ■ 5


    +   2. (NOT (HARD)) is a list because it consists of a left parenthesis, the two
    S-expressions NOT and (HARD), and a right parenthesis.


    +   3. NOT is an S-expression because it is an identifier.


    +   4. (HARD) is an S-expression because it is a list.


    +   5. (HARD) is a list because it consists of a left parenthesis, the S-expression
    HARD, and a right parenthesis.


    +   6. HARD is an S-expression because it is an identifier.


    Q.E.D.


    Of course you don’t have to go through this complete process every time you see
    an S-expression, but we were being very formal.


    Now is a good time to put in a plug for the usefulness of recursion. The definition
    of “list” given above may seem confusing at first (if you’re not used to use recursive
    definitions), but I challenge anyone to write a reasonable definition of “list”
    which is equivalent to the one given above, yet not use any form of recursion.


    # 1.3 A SIMPLE RECURSIVE PROCEDURE


    A recursive procedure (or function, or method, or subroutine) is a procedure that
    calls itself to do part of the work.


    Again, the trick is in the use of the word “part.” If it called itself to do all
    of the work, the result would be an infinite recursion (the recursive equivalent
    of an infinite loop). Just as a loop does some part of the work during each iteration
    of the loop, so must a recursive procedure do some part of the work at each level
    of recursion, until eventually all the work is done.'
