    # Data Structures


    # 2.1 ARRAYS


    An array is a sequence of values, all of the same data type, stored in contiguous
    memory locations. Any element can be efficiently accessed by its index in the
    array. In most languages, the minimum index is zero and the maximum index is the
    size of the array minus one.


    # 2.1.1 Array Maximum


    This time we will devise a recursive Python program to find the maximum value
    in an array. Again, it would be better to do this without recursion, but it is
    difficult to find simple examples that really need recursion, at until we have
    discussed some recursively defined data structures.


    When looking for the maximum value in a nonempty array, what is a simpler problem
    of the same sort? Obviously, finding the maximum of a smaller array. So we will
    plan to recur only with smaller arrays, and our base case will be the smallest
    array—that is, an array of only one element.


