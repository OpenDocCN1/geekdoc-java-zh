  md: '# Author


    M DAVID MATUSZEK, known to most of my students as “Dr. Dave.”


    I wrote my first program on punched cards in 1963, and immediately got hooked.


    I taught my first computer classes in 1970, as a graduate student in Computer
    Science at The University of Texas in Austin. I eventually got my PhD from there,
    and I''ve been teaching ever since. Admitted, I spent over a dozen years in industry,
    but even then I taught as an adjunct for Villanova university.


    I finally escaped from industry and joined the Villanova faculty full time for
