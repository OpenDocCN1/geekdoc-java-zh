  md: '# 2 ■ Quick Recursion


    Sounds circular, doesn’t it? Circular definitions, in computer science as elsewhere,
    are valueless and should be avoided. The distinction between the recursive and
    a circular definition lies in the use of the work “part.” Any recursive definition
    has two parts:


    +   1. a noncircular part, or basis, which is like an ordinary definition, and
    directly specifies some objects that fit the definition; and


    +   2. a recursive (circular) part, which allows you to use the objects that fit
    the definition in determining whether new objects also fit the definition.


    Some examples should clarify these ideas.


    Here is an ordinary definition:


    Vowel: one of the letters “a,” “e,” “i,” “o,” “u,” or “y.”


    Clearly, there are exactly six things that fit the above definition of a vowel.
    Now consider the following circular definition:


    Yowl: any yowl followed by a vowel.


    By this definition, any yowl followed by a vowel is also a yowl, thus, if we could
    find one thing which is a yowl, then any things formed by adding vowels to that
    yowl themselves be be yowls. The problem is in finding that first yowl. Since
    we have no place to start, the definition is circular, and valueless.


    Now consider the following definition:


    Howl:


    +   1. the letter “h,” or


    +   2. any yowl followed by a vowel.'
