    # 3.3 KEEPING BACKTRACKING SIMPLE


    All of these versions of the backtracking algorithm are pretty simple, but when
    applied to a real problem, they can get pretty cluttered up with details. Determining
    whether the node is a leaf can be complex: for example, if the path represents
    a series of moves in a chess endgame problem, the leaves are the checkmate and
    stalemate solutions.


    To keep the program clean, therefore, tests like this should be encapsulated in
    methods. In a chess game, for example, you could test whether a node is a leaf
    by writing a gameOver method (or you could call it isLeaf). This method would
    encapsulate all the ugly details of figuring out any possible moves remain.


    Notice that the backtracking algorithms require us to keep track, for each node
    on the current path, which of its children have been tried already (so we don''t
    have to try again). In the above code, we made this look simple, by just saying
    for each child of n. In reality, it may be difficult to figure out what the possible
    children are, and there may be no obvious way to step through them. In chess,
    for example, a node can represent one arrangement of pieces on a chessboard, and
    each child of that node can represent the arrangement after some piece has made
    a legal move. How do you find these children, and how do you keep track of which
    ones you''ve already examined?


    The most straightforward way to keep track of which children of the node have
    been tried is as follows: Upon initial entry to the'
  - '[PAGE 77]


    # Backtracking ■ 63


    node (that is, when you first get there from above), make a list of all its children.
    As you try each child, take it off the list. When the list is empty, there are
    no remaining untried children, and you can return “failure.” This is a simple
    approach, but it may require quite a lot of additional work.


    There is an easier way to keep track of which children have been tried, if you
    can define an ordering on the children. If there is an ordering, and you know
    which child you just tried, you can determine which child to try next.


    For example, you might be able to number the children 1 through n, and try them
    in numerical order. Then, if you have just tried child k, you know that you have
    already tried children 1 through k - 1, and you have not yet tried children k
    + 1 through n. Or, if you are trying to color a map with four colors, you can
    always try red first, then yellow, green, then blue. If child fails, you know
    to try child green next. If you are searching a maze, you can try choices in the
    order left, straight, and right (or perhaps north, east, south, west).


    It isn’t always easy to find a simple way to order the children of a node. In
    the chess game example, you might number your pieces (or perhaps the squares of
    the board) and try them in numerical order; but in addition, each piece may also
    have several moves, and these must also be ordered.


    You can probably find some way to order the children of a node. If the ordering
    scheme is simple enough, you should use it; but if it is too cumbersome, you are
    better off keeping a list of untried children.


