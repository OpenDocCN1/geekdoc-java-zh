    so on.


    Most libraries provide list, binary tree, and tree objects, but not graph objects.
    Because of the high variability in types and uses of graphs, there is not a “best”
    way to represent a graph, nor is there a best way to search a graph. Implementation
    of graph structures is usually left up to the individual programmer.


    # 3.8 DEBUGGING TECHNIQUES


    Often our first try at a program doesn’t work, and we need to debug it.


    We have emphasized that one should not “look down” into a recursion when trying
    to write or understand a recursive routine. Debuggers are sometimes helpful, but
    using one to debug a recursive routine strongly encourages this approach, because
    you can only see the state of the program from moment to moment. Using print statements
    can be much more helpful for this kind of debugging; they allow you to see the
    overall structure, and to match calls with results.


    There are some simple tricks to making effective use of print statements. These
    tricks can be applied to any program, but are especially useful when you are trying
    to debug recursive routines.'
- md: "\n# Trick #1: Indent when you print method entries and exits. Often, the best\
    \ debugging technique is to print every method call and return (or at least the\
    \ most important ones). You probably want to print, for each method, what parameters\
    \ it came in, and what value it leaves with. However, if you just print a long\
    \ list of these, it's hard to match up method exits with their corresponding entries.\
    \ Indentation that shows the level of nesting can help.\n\nIndenting requires\
    \ keeping track of the current level of indentation. This can be done with an\
    \ additional parameter, or with the use of a global variable. The use of global\
    \ variables is strongly discouraged in general, but if a global variable is used\
    \ only for this purpose, it should not affect the proper functioning of the code.\n\
    \n# Trick #2: Use specialized print methods for debugging. Don't clutter your\
    \ actual code more than you must. Also, remember that code inserted for debugging\
    \ purposes can itself contain bugs, or (in the worst case) can affect the results,\
    \ be very careful with it.\n\nWhen debugging, it is useful to see what arguments\
    \ each function is called with, and what value it returns. This is some of the\
    \ same information provided by a debugger, but printed, so it can be seen all\
    \ at once. For tracing the binary tree search, we will use the following methods:\n\
    \n- void enter(BinaryTree node)—Prints the name of the function being entered\
    \ and the value of its parameter, then increases the indentation level. A call\
    \ to this method will be the first line of each function we want to trace.\n-\
    \ boolean yes()—Reduces the indentation level, prints an exit message, and returns\
    \ true. We will replace each return true with return yes().\n- boolean no()—Reduces\
    \ the indentation level, prints an exit message, and returns false. We will replace\
    \ each return false with return no().\n- String name(BinaryTree node)—A helper\
    \ method to return the name of the node, or null if given a null node.\n\nAs written,\
    \ these debugging methods are specific to the tree search problem; more general\
    \ versions are given in Appendix E for Java and Appendix F for Python.\n\nHere\
    \ is an implementation of the methods in Java.\n\n```\nstatic String indent =\
    \ \"\";\nstatic String name(BinaryTree node) {\n    if (node == null) return null;\n\
    \    else return node.name;\n}\nstatic void enter(BinaryTree node) {\n    System.out.println(indent\
    \ + \"Entering solvable(\" + name(node) + \")\");\n    indent = indent + \"| \"\
    ;\n}\nstatic boolean yes(BinaryTree node) {\n    indent = indent.substring(3);\n\
    \    System.out.println(indent + \"solvable(\" + name(node) + \") returns true\"\
    );\n    return true;\n}\nstatic boolean no(BinaryTree node) {\n    indent = indent.substring(3);\n\
    \    System.out.println(indent + \"solvable(\" + name(node) + \") returns false\"\
    );\n    return false;\n}\n```\n\nTo use this code, we modify solvable. Here is\
    \ the original version:\n\n```\nstatic boolean solvable(BinaryTree node) {\n \
    \ if (node == null) return false;\n  if (node.isGoalNode) return true;\n  if (solvable(node.leftChild))\
    \ return true;\n  if (solvable(node.rightChild)) return true;\n  return false;\n\
    }\n```\n\nHere is the modified version:\n\n```java\nstatic boolean solvable(BinaryTree\
    \ node) {\n  enter(node);\n  if (node == null) return no(node);\n  if (node.isGoalNode)\
    \ return yes(node);\n  if (solvable(node.leftChild)) return yes(node);\n  if (solvable(node.rightChild))\
    \ return yes(node);\n  return no(node);\n}\n```\n\nAnd here is the result:\n\n\
    ```\n| Entering solvable(Root)\n| | Entering solvable(A)\n| | | Entering solvable(C)\n\
    | | | | solvable(null) returns false\n| | | Entering solvable(null)\n| | | | solvable(null)\
    \ returns false\n| | | solvable(C) returns false\n| | Entering solvable(D)\n|\
    \ | | Entering solvable(null)\n| | | | solvable(null) returns false\n| | | | solvable(null)\
    \ returns false\n| | | solvable(D) returns false\n| solvable(A) returns false\n\
    | Entering solvable(B)\n| | Entering solvable(E)\n| | solvable(E) returns true\n\
    | solvable(B) returns true\nsolvable(Root) returns true\n```\n\n# Trick #3: Never\
    \ discard your debugging statements. Writing debugging statements is programming,\
    \ too. Often it's as much work to debug the debugging statements as it is to debug\
    \ the actual program. Once your program is working, why throw this code away?\n\
    \nObviously, you don't want to print out all this debugging information from a\
    \ program you are ready to submit (or turn over to your manager). You could comment\
    \ out the debugging calls, but that can be a lot of work. What's more, in the\
    \ above example, you would have to replace every return yes(node) with return\
    \ true, and every return no(node) with return false. All these changes might introduce\
    \ new bugs into your program.\n\nThe simple solution is to make your debugging\
    \ statements conditional. For example,\n\n```\nstatic final boolean debugging\
    \ = false;\nstatic void enter(BinaryTree node) {\n    if (debugging) {\n     \
    \   System.out.println(indent + \"Entering solvable(\" + \n            name(node)\
    \ + \")\");\n        indent = indent + \"| \";\n    }\n}\n```\n\n# Trick #4: Use\
    \ exceptions for errors. Instead of using print statements, you can use exceptions\
    \ to handle errors. This is often cleaner and provides more information, such\
    \ as a stack trace of where the error occurred.\n\n```java\nstatic class SolvableException\
    \ extends Exception {\n    public SolvableException(String message) {\n      \
    \  super(message);\n    }\n}\n\nstatic boolean solvable(BinaryTree node) throws\
    \ SolvableException {\n    if (node == null) throw new SolvableException(\"Node\
    \ is null\");\n    if (node.isGoalNode) return true;\n    if (solvable(node.leftChild))\
    \ return true;\n    if (solvable(node.rightChild)) return true;\n    return false;\n\
    }\n```\n\nWhen you want to search for a solvable tree, you can catch the exception\
    \ and handle it accordingly.\n\n```java\ntry {\n    if (solvable(root)) {\n  \
    \      System.out.println(\"Tree is solvable!\");\n    }\n} catch (SolvableException\
    \ e) {\n    System.out.println(\"Tree is not solvable: \" + e.getMessage());\n\
    }\n```\n\n# 3.9 FROG PUZZLE\n\nThe following puzzle is sometimes called the “frog\
    \ puzzle.” You have some number of frogs facing right and the same number of toads\
    \ facing left. The playing board consists simply of a line of 2n + 1 spaces on\
    \ which to put the frogs and toads. Start with the right-facing frogs on the left,\
    \ the left-facing toads at the right end, and a single free space between. The\
    \ goal is to reverse the positions of the frogs and toads.\n\nThe frogs and toads\
    \ can only move forward; they cannot back up. At each move, a frog or toad can\
    \ either:\n\n- move one space ahead, if that space is clear,\n- jump ahead over\
    \ exactly one frog or toad, if the space beyond that frog or toad is clear.\n\n\
    For example, you could make the sequence of moves shown in Figures 3.4C–3.4H.\n\
    \n![Figure 3.4C](https://example.com/3.4c.png)\n![Figure 3.4D](https://example.com/3.4d.png)\n\
    ![Figure 3.4E](https://example.com/3.4e.png)\n![Figure 3.4F](https://example.com/3.4f.png)\n\
    ![Figure 3.4G](https://example.com/3.4g.png)\n![Figure 3.4H](https://example.com/3.4h.png)\n"
  mdcn: "\n\n# 技巧 #1：在打印方法进入和退出时进行缩进。通常，最好的调试技术是打印每个方法的调用和返回（至少是打印最重要的那些）。你可能想打印每个方法进入时带有参数，以及它离开时带有什么值。然而，如果你只是简单地打印出这些长列表，很难将方法的退出与与其对应的入口对应起来。显示嵌套层级的缩进会有帮助。\n\
    \n缩进需要跟踪当前的缩进层级。这可以通过额外的参数来实现，也可以通过使用全局变量来实现。通常强烈不建议使用全局变量，但如果全局变量仅用于此目的，它不应该影响代码的正常运行。\n\
    \n# 技巧 #2：使用专门的打印方法进行调试。不要让你的实际代码产生不必要的混乱。此外，请记住，为了调试目的而插入的代码本身可能包含错误，或者（在最坏的情况下）影响结果，请务必对其小心。\n\
    \n在调试时，查看每个函数被调用时使用的参数以及它返回的值是有用的。这些信息与调试器提供的信息类似，但它是通过打印出来的，这样就可以一次性看到。对于追踪二叉树搜索，我们将使用以下方法：\n\
    \n- void enter(BinaryTree node)—打印正在进入的函数名称及其参数值，然后增加缩进层级。对此方法的调用将是我们想要追踪的函数的第一行。\n\
    - boolean yes()—减少缩进层级，打印退出消息并返回 true。我们将每个 `return true` 替换为 `return yes()`。\n\
    - boolean no()—减少缩进层级，打印退出消息并返回 false。我们将每个 `return false` 替换为 `return no()`。\n\
    - String name(BinaryTree node)—返回节点名称的辅助方法，如果给定空节点则返回 null。\n\n按照目前的写法，这些调试方法专门用于树搜索问题；更通用的版本见附录\
    \ E（Java）和附录 F（Python）。\n\n以下是这些方法的 Java 代码实现。\n\n```\nstatic String indent =\
    \ \"\";\nstatic String name(BinaryTree node) {\n    if (node == null) return null;\n\
    \    else return node.name;\n}\nstatic void enter(BinaryTree node) {\n    System.out.println(indent\
    \ + \"Entering solvable(\" + name(node) + \")\");\n    indent = indent + \"| \"\
    ;\n}\nstatic boolean yes(BinaryTree node) {\n    indent = indent.substring(3);\n\
    \    System.out.println(indent + \"solvable(\" + name(node) + \") returns true\"\
    );\n    return true;\n}\nstatic boolean no(BinaryTree node) {\n    indent = indent.substring(3);\n\
    \    System.out.println(indent + \"solvable(\" + name(node) + \") returns false\"\
    );\n    return false;\n}\n```\n\n要使用这段代码，我们修改了 `solvable`。这里是原始版本：\n\n```\nstatic\
    \ boolean solvable(BinaryTree node) {\n  if (node == null) return false;\n  if\
    \ (node.isGoalNode) return true;\n  if (solvable(node.leftChild)) return true;\n\
    \  if (solvable(node.rightChild)) return true;\n  return false;\n}\n```\n\n这是修改后的版本：\n\
    \n```java\nstatic boolean solvable(BinaryTree node) {\n  enter(node);\n  if (node\
    \ == null) return no(node);\n  if (node.isGoalNode) return yes(node);\n  if (solvable(node.leftChild))\
    \ return yes(node);\n  if (solvable(node.rightChild)) return yes(node);\n  return\
    \ no(node);\n}\n```\n\n这里是结果：\n\n```\n| Entering solvable(Root)\n| | Entering\
    \ solvable(A)\n| | | Entering solvable(C)\n| | | | solvable(null) returns false\n\
    | | | Entering solvable(null)\n| | | | solvable(null) returns false\n| | | solvable(C)\
    \ returns false\n| | Entering solvable(D)\n| | | Entering solvable(null)\n| |\
    \ | | solvable(null) returns false\n| | | | solvable(null) returns false\n| |\
    \ | solvable(D) returns false\n| solvable(A) returns false\n| Entering solvable(B)\n\
    | | Entering solvable(E)\n| | solvable(E) returns true\n| solvable(B) returns\
    \ true\nsolvable(Root) returns true\n```\n\n# 技巧 #3：永远不要丢弃你的调试语句。编写调试语句也是编程。通常，调试调试语句花费的工作量与调试实际程序本身一样大。一旦你的程序运行了，为什么要扔掉这些代码呢？\n\
    \n显然，你不想在你准备提交（或交给经理）的程序中打印出所有的调试信息。你可以注释掉调试调用，但那可能需要大量工作。此外，在上面的示例中，你必须将每个 `return\
    \ yes(node)` 替换为 `return true`，将每个 `return no(node)` 替换为 `return false`。所有这些更改可能为你的程序引入新的错误。\n\
    \n简单的解决方案是让你的调试语句条件化。例如：\n\n```\nstatic final boolean debugging = false;\nstatic\
    \ void enter(BinaryTree node) {\n    if (debugging) {\n        System.out.println(indent\
    \ + \"Entering solvable(\" + \n            name(node) + \")\");\n        indent\
    \ = indent + \"| \";\n    }\n}\n```\n\n# 技巧 #4：使用异常处理错误。与其使用打印语句，可以使用异常来处理错误。这通常更干净，并且提供更多信息，例如错误发生时的堆栈跟踪。\n\
    \n```java\nstatic class SolvableException extends Exception {\n    public SolvableException(String\
    \ message) {\n        super(message);\n    }\n}\n\nstatic boolean solvable(BinaryTree\
    \ node) throws SolvableException {\n    if (node == null) throw new SolvableException(\"\
    Node is null\");\n    if (node.isGoalNode) return true;\n    if (solvable(node.leftChild))\
    \ return true;\n    if (solvable(node.rightChild)) return true;\n    return false;\n\
    }\n```\n\n当你想要搜索可解树时，可以捕捉异常并进行处理。\n\n```java\ntry {\n    if (solvable(root)) {\n\
    \        System.out.println(\"Tree is solvable!\");\n    }\n} catch (SolvableException\
    \ e) {\n    System.out.println(\"Tree is not solvable: \" + e.getMessage());\n\
    }\n```\n\n# 3.9 青蛙游戏\n\n下面的谜有时被称为“青蛙游戏”。你有若干向右的青蛙和相同数量向左的乌龟。游戏板由2n+1个用于放置青蛙和乌龟的空间组成。开始时，将右右青蛙放在左侧，乌龟放在右侧，中间留出一个空位。目标是反转青蛙和乌龟的位置。\n\
    \n青蛙和乌龟只能向前，不能后退。在每次移动中，青蛙或乌龟可以：\n\n-向前移动一个空间，如果该空间是空的；\n- 跳过恰好一个青蛙或乌龟，如果该青蛙或乌龟之后的空间是空的。\n\
    \n例如，你可以执行图3.4C–3.4H所示的移动序列。\n\n"
