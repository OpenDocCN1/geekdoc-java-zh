    \ 2 放入栈中并调用了 `factorial(1)`。\n- 3. 值 1 被赋值给局部变量 `n`。\n  - n 不为 0，所以函数将 1 放入栈中并调用了\
    \ `factorial(0)`。\n- 4. 值 0 被赋值给局部变量 `n`。\n  - n 为 0，所以函数返回 1。\n- 5. 函数从栈中弹出 1（它是在第\
    \ 3 步被放入栈中的）。\n  - 函数将调用返回的结果 1 与栈中的 1 相乘，并返回 1。\n- 6. 函数从栈中弹出 2（它是在第 2 步放入栈中的）。\n\
    \  - 函数将调用返回的结果 1 与栈中的 2 相乘，并返回 2。\n- 7. 函数从栈中弹出 3（它是在第 1 步被放入栈中的）。\n  - 函数将调用返回的结果\
    \ 2 与栈中的 3 相乘，并返回 6。\n- 8. 函数返回 6 作为最终结果。\n\n根据许多教材的说法，这就是你应该理解递归的方式。这种方法对我没用，可能对你也不起。\n\
    \n## 1.10 消除递归\n\n正如前面提到的，递归永远不是必要的；任何用递归完成的任务，都可以使用栈和循环来实现。\n\n栈（Stack）是一种后入先出的数据结构。也就是说，值可以添加到栈中，也可以从栈中取出，但它们移除的顺序与添加的顺序相反。想象一叠书——你可以向栈的顶部添加一本书。如果你把几本书堆在栈上，第一本书会在栈的底部，它将是你最后才能拿到的那本书。\n\
    \nJava 有一个 `Stack` 类。Python 没有，但 Python 列表可以像栈一样使用。以下是 Java `Stack` 类的基本操作以及 Python\
    \ 中对应的列表操作。\n\n- `stack.push(value)`——将值添加到栈中。在 Python 中，使用 `list.append(value)`。\n\
    - `stack.pop()`——移除并返回栈顶值。在 Python 中，使用 `list.pop()`。\n- `stack.peek()`——返回栈顶值但不移除它。在\
    \ Python 中，使用 `list[-1]`。\n- `stack.empty()`——测试栈是否为空。在 Python 中，使用 `list == []`。\n\
    \n递归在“底层”的实现相当简单。当进行递归调用时，所有的局部值都会推入栈中，并在调用返回时从栈中恢复。这可以通过循环来模拟，在达到基本情况（base case）时退出循环。\n\
    \n这里又是递归版本：\n\n这里是一个使用栈来模拟递归的版本：\n\n```python\ndef factorial(n):\n    \"\"\"计算参数的阶乘.\"\
    \"\"\n    stack = []\n    while n != 0:\n        stack.append(n) # \"push\"\n\
