    # Author


    DAVID MATUSZEK, known to most of my students as “Dr. Dave.”


    I wrote my first program on punched cards in 1963, and immediately got hooked.
    I taught my first computer classes in 1970, as a graduate student at University
    of Texas in Austin.


    I eventually got my PhD from there, and I''ve been teaching ever since. Admitted,
    I spent over dozen years in industry, but even then I taught as an adjunct for
    Villanova.


    I finally escaped from industry and joined the Villanova faculty full time, then
    directed a master’s program (MCIT, master’s in computer and information technology)
    for students coming into computer science.


    Throughout my career, my main interests have been in artificial intelligence (AI)
    and programming languages. I''ve used a lot of programming languages.


    I retired in 2017, but I can''t stop teaching, so I''m writing a series of “quick
    start” books on programming and languages. I''ve also written two science fiction
    novels, Ice Jockey and All Value, and I expect to write more.


    If you find this book useful, it would be wonderful if you would post a review.
    Reviews, even critical ones, help to sell books.


    And hey, if you''re a former student or colleague of mine, drop me a note. I love
    to hear from you!


    david.matuszek@gmail.com


    # Preface


    RECURSION IS CONSIDERED TO BE “ADVANCED” TOPIC.

    It shouldn''t be.


    When my oldest daughter was in high school, she was deeply involved in a multiplayer
    dungeon (MUD) game. She implemented an email system for it, using a language called
    Forth, which uses recursion extensively.


    When she went to college, she took a programming class. After a week or so she
    called home and asked me, “Daddy, what are loops for?” When I explained, she said,
    “Why not just use recursion? It’s so much simpler.”


    I agree.


    # Understanding Recursion


    # 1.1 NOTE ON LANGUAGES


    Any programming book needs examples, and examples have to be in some language.


    This book uses two well-known languages, Java and Python 3. The code is kept simple,
    without any language-specific “tricks,” so it should be accessible even programmers
    who know neither of these languages.


    That said, it is impossible to avoid all language-specific features and still
    have working code. Python uses indentation to show nesting of statements, while
    Java uses braces. To remove leading braces, Python uses strip() while Java uses
    trim(). Differences such as these should not greatly obscure the examples.


    # 1.2 RECURSIVE DEFINITIONS


    A recursive definition is a definition in which the thing being defined occurs
    as part of its own definition.

