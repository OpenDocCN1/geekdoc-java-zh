    # 快速递归


    递归是处理树和图的绝佳工具。但也许你已经学过递归，并认为它太复杂了。你无法那样思考。这限制了你所能编写的程序类型。


    好消息是！递归其实很简单。它只是教得不好。


    听着，很多老师都在谈论计算机是如何操作的。他们没完没了地谈论递归的每一层发生了什么，以及每一层是如何与其他层联系的。问题在于，你无法在多个层级上思考。没有人能做到。而且你也不需要这样做。


    这本书将向你展示如何编写递归程序。一旦你理解了几个简单的规则，你就会怀疑自己为什么认为递归是复杂的。你将能够快速、轻松地编写递归程序。


    嗯，只要是编程所能达到的最快速、最简单的方式，如此。


    ![](img/2ad0b39d74b4c2e45524e36e29e21a47_2_0.png)


