    # 1.8.4 Rule 4. Don’t Look Down


    When you reach a recursive call, don''t go back to the top and start working over.
    Rule 4 simply says to treat all calls this way, even recursive ones.


    # 26 Recursion


    It may seem odd at first to assume the called routine works, when called routine
    happens to be the very one you''re checking. However, you must do so: the human
    mind does have limitations. Pretend, if it helps, you are not actually recurring,
    but rather calling an entirely different routine (which happens to have the same
    name) that you know correct.


    What is involved here is perhaps best described as a “leap of faith.” You have
    to learn to trust recursion; to believe that, if you get the routine correct at
    this level, then you don''t have to worry about any deeper levels. Until you can
    bring yourself to make this commitment, you will be compelled to look down into
    the recursion, and you will never untangle what you see.


    If the notion of “faith” bothers you, think about the novice programmer who complains
    that his program can''t be wrong, so the computer must have made a mistake. You
    may have once done this yourself. In time, all programmers learn to trust the
    computer; now you must learn to trust recursion.

