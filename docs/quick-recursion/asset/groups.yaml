    \ boolean deepMember(Object obj, List lst) {\n    if (lst == null) return false;\n\
    \    if (eq(obj, lst.head)) return true;\n    if (lst.head instanceof List &&\n\
    \        deepMember(obj, lst.head)) return true;\n    return deepMember(obj, lst.tail);\n\
    }\n```\n\n## 2.2.2 Lists in Python\n\nAccording to the usual definition, a singly\
    \ list (or briefly, list) is a linear data structure that has a head (first element)\
    \ and a tail (all the remaining elements, in some order). Access to these two\
    \ values, the head and the tail, is very efficient; access to any other values\
    \ involves stepping through the intervening values to get them.\n\nPython has\
    \ a data structure called a “list,” but it is actually a complex data structure\
    \ that has features of both arrays and lists.\n\n[PAGE 58]\n\nThis is convenient\
    \ for many applications, but using it as if it were a singly linked list would\
    \ be inefficient, and therefore inadvisable.\n\nIt is easy to write a List class\
    \ in Python that has the usual characteristics of a singly linked list. Such a\
    \ class could begin this:\n\nAs a first example of using the List class, we will\
    \ count the number of elements in a list, using the aforementioned mantra, \"\
    Do something with the head and recur with the tail.\" In this case, what we do\
    \ with the head is simply count it.\n\nIn order to print a list, we will need\
    \ a method to represent it as a string. Here is an implementation of the __str__\
    \ method, as it would occur inside the List class.\n\n```\ndef __str__(self):\n\
    \    \"\"\"Return a string representation of this List.\"\"\"\n    return '['\
    \ + self.contents() + '']\n```\n\n```\ndef contents(self):\n    \"\"\"Return a\
    \ string representation of the contents of this List.\"\"\"\n    s = str(self.head)\n\
    ```\n\n[PAGE 59]\n\n```\nif self.tail != None:\n    s += ', ' + self.tail.contents()\n\
    return s\n```\n\nIn this code, only the helper method contents is recursive;\n\
    the __str__ method simply add brackets around the result.\n\nAdditional list methods\
    \ in Python (equality testing, member,\ndeepMember) are provided in Appendix K.\n\
    \n## 2.2.3 Accumulators\n\nIt's easy to copy a list recursively; simply make a\
    \ new list with\ncopy of the head and a copy of the tail.\n\n```\ndef list_copy(lst):\n\
    \    if lst == None:\n        return None\n    return List(lst.head, list_copy(lst.tail))\n\
    ```\n\nThe above code makes a shallow copy, which is adequate for the\npurposes\
    \ of this section.\n\nNow consider the problem of creating a new list containing\
    \ the\nsame elements as a given list, but in reverse order. One way to\ndo this\
    \ is to use an accumulator: an additional parameter that incre-mente builds, or\
    \ accumulates, the final result.\n\nThe user of the reverse method should not\
    \ have to know about\nthe accumulator, and certainly should not have to provide\
    \ one\nthe correct form. Hence we provide a façade method that\ntakes a single\
    \ list parameter and calls another function to do the\nactual work.\n\n```\ndef\
    \ reverse(self):\n    return self.rev(self, None)\n```\n\n[PAGE 60]\n\n```\ndef\
    \ rev(self, lst, acc=None):\n    if lst == None:\n        return acc\n    return\
    \ lst.rev(lst.tail,\n        List(lst.head, acc))\n```\n\nEach call of rev plucks\
    \ an item from the original list (lst.head), adds it to the list being accumulated\
    \ (List(lst.head, acc)), and recurses with the shorter original list (lst.tail)\
    \ and the list being accumulated. When all the elements of the original list have\
    \ been processed (lst == None), the complete reversed list is in acc.\n\nThis\
    \ follows the conventional method for a recursive list method: Handle the base\
    \ case (lst == None) first, then do something with the head and recur with the\
    \ tail. The accumulator is simply another variable that goes along for the ride.\n\
    \nThe Java code is similar. Since Java allows methods to be overloaded (multiple\
    \ methods may have the same name if the parameter lists are different), we can\
    \ use the same name for both the façade method and the main method.\n\n```\npublic\
    \ List reverse() {\n    return rev(this, null);\n}\n\nprivate List rev(List lst,\
    \ List acc) {\n    if (lst == null) {\n        return acc;\n    }\n    return\
    \ lst.rev(lst.tail,\n        new List(lst.head, acc));\n}\n```\n\n## 2.3 BINARY\
    \ TREES\n\nWe will define a binary tree (2.1) as either empty or consisting of\
    \ a root node that contains three:\n\n[PAGE 61]\n\n* A value, which could be anything,\n\
    * A left child, which is binary tree; and\n* A right child, which is binary tree.\n\
    \nBinary trees are defined recursively: A (non-empty) binary tree consists of\
    \ a value and two other trees. Note: This allows a binary tree to be empty. This\
    \ lets us think of a node as always having children, and this simplifies programming.\
    \ All nodes are reachable (by one or more steps) from the root. In general, it\
    \ is only possible to move “down” in the binary tree (from parent to child), not\
    \ “up” (from child to parent). A node that has neither a left child nor a right\
    \ child is called a *leaf* and is used as the base case in many applications.\n\
    \n![](img/2ad0b39d74b42e45524e36e29e21a47_61_0.png)\n\nFIGURE 2.1 A binary tree.\n\
    \nThere are some other constraints that a binary tree must satisfy. A binary tree\
    \ is not allowed to contain cycles; that is, a node may not have one of its ancestors\
    \ as a child. In addition, some (but not all) implementations insist that each\
    \ node except the root has exactly one parent; this prevents shared subtrees,\
    \ in which there may be more than one path from the root to a given node. Other\
    \ implementations may have other kinds of constraints.\n\nChecking these constraints\
    \ are complicated. Library implementations of binary trees must do all this work,\
    \ but it isn't needed here. In this book, we need only the simplest implementations\
    \ to illustrate recursive techniques.\n\nHere’s a definition of a BinaryTree class\
    \ in Java:\n\n```\npublic class BinaryTree {\n    public Object value;\n    BinaryTree\
    \ left;\n    BinaryTree right = null;\n\n    BinaryTree(Object value,\n      \
    \  BinaryTree left,\n        BinaryTree right) {\n        this.value = value;\n\
    \        this.left = left;\n        this.right = right;\n    }\n\n    BinaryTree(Object\
    \ value) {\n        // shortcut for making a left\n        this(value, null, null);\n\
    \    }\n}\n```\n\nAs defined above, the “value” in each node is type String. To\
    \ make a more general binary tree, it could be Object. Even better, this class\
    \ could be genericized, so that the binary tree could contain values of only some\
    \ designated type. Our goal here, however, is to keep things simple, and that\
    \ means ignoring generics.\n"
