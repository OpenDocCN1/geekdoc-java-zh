    # Understanding Recursion 21


    - 2. If A calls B with arguments, the values of those arguments are copied into
    B’s parameters.

    - 3. New storage locations are allocated for all the local variables of B, including
    the variables in B’s parameter list. This storage allocation may happen immediately,
    or it may happen as needed by function B.

    - 4. Function B executes its code, using the values in its new storage locations.
    When done, function B returns a single result to A, and all storage used by all
    the local variables of B is recycled.

    - 5. When A receives a result from B, all its local variables are brought “out
    of hiding,” still with the same values they had when B was called.


    Here’s the key point: All those same actions occur when a function calls itself.
    The local variable names are reused for the new values, and their previous values
    are restored when the call returns.


    Global variables are different. Consider the following sequence:


    - 1. Compute a value for x,

    - 2. make a recursive call,

    - 3. use x, expecting it to have the value you computed in (1).


    If x is a local variable, there is no problem. Variable x will not be changed
    by the recursive call. but if x is a global variable, it will be changed by the
    recursive call. Step (1) above changes it.


    Local variables don’t cause any problems. They just don’t. They are safe from
    whatever happens at other levels of the recursion.


    # 22 Quick Recursion


    However, if a recursive routine uses and modifies an external variable, such as
    a global, then you can only understand and debug the routine by understanding
    how the calling routine manipulates the variable and also how the called routine
    manipulates the variable. This requires you to think about many levels of the
    recursive routine, all at the same time. For most programmers (and possibly all
    programmers), this is impossible.


    There are two ways in which you can safely use an external variable in a recursive
    routine:


    - Never change the value of an external variable, only look at it; or,

    - Never use the value of an external variable, only change it (a counter, for
    example).


    This doesn''t mean that you cannot both use and change a global variable in a
    recursive method; you can, but it becomes very difficult to reason about.


    It is helpful to understand that a variable can only hold a limited amount of
    information, typically four bytes (depending on the system). Four bytes are enough
    to hold quite large integers, floating point numbers, booleans, and pointers,
    but it isn''t enough to hold complex values like arrays, lists, sets, tuples,
    or dictionaries. These larger structures are stored elsewhere, and a pointer to
    them is stored in the variable.


    A recursive routine thus may access four types of variables:


    - Local variables, which are declared inside the routine itself, and are totally
    safe.

    - Parameters that are “passed by value,” that is, the actual value of the argument
    can fit in a single variable, and it is this value which is copied into the parameter.
    Such parameters act like local variables.

    - 3. Global variables, which are external to the routine. Any change to a global
    variable is visible everywhere. It is safe to only look at them, and it is safe
    to update them (for example, incrementing a counter), but trying to work with
    them in any meaningful way will quickly lead to incomprehensible code.

    - 4. Parameters that are “passed by reference.” Arrays, lists, and other data
    structures cannot fit in a single variable, so what is copied into the parameter
    is a reference (or pointer) to the actual value. These behave like global variables.


    **Moral:** Make sure all your variables are either local or by-value parameters.
    If you can''t, make sure you never change the value of a global variable or parameter.
    And if you alter global variables, think long and hard about what you''re doing.


    **Technical Note:** Starting in Python 3, integers can be of unlimited size. A
    variable holding a very large integer would normally hold a reference, rather
    than the actual value. However, large numbers are immutable, so integers continue
    to behave as they have always done, regardless of how large.


    Fortunately, it is easy to get into the habit of avoiding globals. You don''t
    have to think through the reasons each time. Just avoid them.


    # 1.8.3.1 Deep Copies


    You never need a complex data structure to be a global variable; it can always
    be passed around as a parameter. Doing so is efficient because what you are actually
    passing is a reference (pointer) to the data structure.


    # 24 Quick Recursion


    Modifying a data structure within a recursive function has the same problems as
    modifying a global variable. Since what you have a reference to the data structure,
    any modifications to it happen at all levels of the recursion.


    Sometimes the whole point of the recursive function is to modify the data structure.
    In this case, a simpler case (Rule 2) is usually to use just part of the data
    structure.


    Other times, a data structure might be modified on a trial-and-error basis, for
    example when searching for a solution, after which the changes must be undone.
    Undoing changes can be efficient but error-prone. Another approach is to pass
    a copy of the data structure rather than the original; the entire copy can be
    discarded when the function returns, leaving the original untouched.


    Copies can be *shallow* or *deep*. A *shallow copy* is a simple copy of all the
    top-level values in the data structure. For example, considering the following
    Python array:


    ```

    a = [1, [2, 3]]

    ```

