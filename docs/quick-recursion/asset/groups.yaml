    # Understanding Recursion ■ 15


    The last of these (maximum) deserves a little more explanation. As a general-purpose
    function, it is an error to assume that the input is not a list of negative numbers.
    As part of a program where this never occurs, the function will work, but it assumes
    too much about its context. At some future date, code may be added to the program
    which violates this assumption. The best solution is to fix the code; next best
    is to modify the comment to specify “… in a list of numbers, not all of which
    are negative.


    # 1.6 WHEN TO USE RECURSION


    It is easily proved that you never need recursion; any recursive program can be
    changed into a non-recursive one that uses a stack. (In the same way you can prove
    that any program could be written in absolute binary).


    The best answer to the question of when to use recursion is, simply, when you
    happen to find it useful. You never just set out to “use recursion,” any more
    than you set out to “use a loop.” Program; sometimes you use a loop, sometimes
    you use an array, sometimes you do input/output, and sometimes you recur.


    But that’s not a very useful answer when you’re first getting started. We’ll try
    to be more specific.


    One good rule of thumb is to use recursion when you are processing recursively
    defined data structures. If you try to evaluate an arithmetic expression, for
    example, parentheses may be used to enclose a “subexpression” which must be evaluated
    first, and is an expression in its own right. If you’re writing code to evaluate
    arithmetic expressions, there are only two reasonable ways to do this: recursively,
    or by “simulating” recursion with an explicit stack.


    Another (equivalent) rule is to handle nested structures with recursion. As an
    example, in many languages, any statement may be'
  - '[PAGE 30]


    # 16 ■ Quick Recursion


    nested in an if statement, even another if statement. There is a clear use for
    recursion in any processor (compiler, preprocessor, interpreter, debugger, pretty
    printer) for such a language.


    Finally, programs that use a single stack can be written more clearly as recursive
    programs which don''t use a stack. (Programs that use two or more stacks, however,
    often cannot be rewritten as recursive programs without any stacks; but the proof
    is beyond the scope of this manuscript.)


    # 1.7 WHEN TO USE RECURSION


    Every recursive call uses additional memory. The current values of the parameters
    and other variables at every level must be kept in storage. Modern computers have
    enough memory that this is usually not an issue—but it can be.


    Most programming languages will simply let a recursion run until memory is exhausted,
    at which point the program will crash. Python, however, sets an arbitrary, but
    very reasonable, maximum recursion depth of 1000.


    > Note: Python''s depth limit can be changed by calling `sys.setrecursionlimit(limit)`.


    Most recursively defined data structures are nowhere near this deep. For example,
    a balanced binary tree containing one billion nodes would only be about 30 levels
    deep.


    Lists, like arrays, may have thousands of elements. For these, a method that recurs
    for every element may be impractical, and a less storage-intensive loop should
    be used.


    # 1.8 THE FOUR RULES


    Here we propose four rules which, if understood and followed, will result in working
    recursive programs. Once you become'
