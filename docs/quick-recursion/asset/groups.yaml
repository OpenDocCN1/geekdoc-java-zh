    \                if (solveAndPrint(newBoard)) {\n                    printBoard(newBoard);\n\
    \                    return true;\n                }\n            }\n        }\n\
    \    }\n    return false;\n}\n```\n\n除了 `canMove` 和 `makeMove` 之外，我们使用的方法 `puzzleSolved`\
    \ 和 `printBoard`，其含义应该是显而易见的。\n\n这里是程序 Java 版本的输出；Python 的输出也类似：\n\n| Toad Toad\
    \ Toad [ ] Frog Frog Frog |\n| Toad Toad Toad Frog [ ] Frog Frog |\n| Toad Toad\
    \ [ ] Frog Toad Frog Frog |\n| Toad Toad Frog Toad [ ] Toad Frog Frog |\n| Frog\
    \ Toad Toad Frog Toad [ ] Toad Frog |\n| Toad Toad Frog Toad Toad Frog [ ] |\n\
    | Toad Toad Toad Frog [ ] Frog Toad |\n| Toad Frog [ ] Frog Toad Toad Frog |\n\
    | Frog [ ] Toad Toad Frog Toad Frog |\n| Frog Frog Toad Frog Toad [ ] Toad |\n\
    | Frog Frog Toad Frog [ ] Toad Toad |\n| Frog Frog [ ] Frog Toad Toad Toad |\n\
    | Frog Frog [ ] Toad Toad Toad |\n\n注意解决方案是反序给出的：青蛙起始于左侧和右侧，如最后一行所示。这是因为一旦找到解决方案，它就会在递归程序展开（回溯）时打印出来。为了返回解决方案而不仅仅是打印它，应该将步骤保存在栈中，并将栈返回给调用程序。\n\
    \n青蛙谜题的完整程序在附录 G（Java）和附录 H（Python）中。\n\n## 3.10 青蛙累加器\n\n在上一节中，我们实现了 `solveAndPrint`\
