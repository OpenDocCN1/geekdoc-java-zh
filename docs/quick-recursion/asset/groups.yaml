  - '[PAGE 105]


    # Afterword


    Recursion is all too often considered to be an “advanced” topic. While this little
    volume has covered a number of advanced topics that involve recursion—tail recursion,
    pruning, recursive data structures, the use of accumulators, and backtracking—recursion
    itself is simple.


    As an experiment, I began using some recursive examples in my introductory programming
    courses, without even mentioning the term “recursion.” The course had a laboratory
    setting where I and my assistants went from student to student, helping them with
    their problems, so it was easy to tell which concepts caused difficulty. Beginners
    had all the usual problems, such as getting loop indices correct and deciding
    when to use functions, but the occasional use of recursion caused no additional
    problems.


    As the saying goes, “When your only tool is a hammer, every problem looks like
    a nail.” Recursion is another tool in your programming toolbox. Sometimes it’s
    the right tool; sometimes it isn’t. Throughout this book, I’ve tried to suggest
    appropriate uses, but in the end, your own experience will be your best guide.'
