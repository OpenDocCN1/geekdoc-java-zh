    evolved considerably. Both have had an immense influence on the programming languages
    we use today. It can be argued that modern, conventional languages are structurally
    most like Fortran, but incorporate most of the ideas from Lisp.


    Fortran was used for numerical processing; it was built around numbers, arrays,
    and loops. Early versions had no symbols or lists and did not support recursion.


    Lisp was used for nonnumerical processing (in particular, what we today would
    call “artificial intelligence” applications). It was built around lists, symbols,
    and recursion. It had numbers (awkwardly) but not arrays or loops.


    It should therefore be no surprise that, while recursion can sometimes be useful
    for dealing with arrays, it is far more important in working with lists and other
    recursively defined data structures.'
