    \ logically independent computations. Depending on the programming language, these\
    \ are called by various names: functions, methods, procedures, etc.\n\nWhenever\
    \ a program is broken into two parts, there comes into being an interface between\
    \ them. This interface consists of the parameter list, any global or common variables\
    \ they may share between them, any results returned or exceptions raised, and\
    \ often more subtle ways of information transmission. If modularization is to\
    \ succeed in reducing complexity, this interface must be kept narrow and as explicit\
    \ as possible.\n\nThe best way to keep the interface narrow is to ensure that\
    \ each routine does just one thing, and that thing can be easily described in\
    \ an English sentence with few or no “buts” and “excepts” in it. Keeping parameter\
    \ lists short and avoiding global variables can also help.\n\nThe best way to\
    \ make the interface explicit is to ensure, whenever possible, that all information\
    \ transmission occurs via the parameter list, not through global variables. There\
    \ are those who feel global variables should be avoided entirely, but I don't\
    \ take such an extreme position. It is often more convenient to have global access\
    \ to arrays and other large data structures; just take special care it's not to\
    \ modify them accidentally.\n\nSide effects should also be avoided. The main effect\
    \ of a routine is the thing it's supposed to do; side effects are the little extra\
    \ things it does. Side effects are dangerous when they're intentional. For example,\
    \ if a function factorial(n) computes n!, that's its main effect; but if it also\
    \ stores the result in a global variable, that's a side effect. This is bad because\
    \ it compensates in the factorial function, but errors from this side effect will\
