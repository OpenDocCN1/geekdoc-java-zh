    # # Appendix F:

    Python Debugging


    THE DEBUGGING TECHNIQUE described in the text can also be employed in Python.
    Two global variables are used: indent, to control the indentation level; and debugging,
    to turn debugging on or off.


    +   - Put enter(args) at the entrance to any method you want to trace. Any number
    of arguments may be supplied.

    - Replace every return True with return yes().

    - Replace every return False with return no().

    - Replace every return or return None with return nothing().

    - Replace every return value with return result(value).


    This can result in a large number of changes in the code, but using the debugging
    variable means that these changes do not have to be reversed. For example, the
    solve method in the tree search example changes from:'
