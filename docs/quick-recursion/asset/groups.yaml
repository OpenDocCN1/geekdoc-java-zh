    \ do this without recursion, but it is difficult to find simple examples that\
    \ really need recursion, until we have discussed some recursively defined data\
    \ structures.\n\nWhen looking for the maximum value in a nonempty array, what\
    \ is a simpler problem of the same sort? Obviously, finding the maximum of a smaller\
    \ array. So we will plan to recur only with smaller arrays, and our base case\
    \ will be the smallest array—that is, an array of only one element.\n\nDOI: 10.1201/9781003359616-2\n\
    \n# 36 ■ Quick Recursion\n\nHere is one approach: Take a number from one end of\
    \ the array; recursively find the maximum of the remaining array; compare the\
    \ maximum to the number taken, and the maximum is the larger of these. For a base\
    \ case, the maximum of a single-element array is that element.\n\nWhile this approach\
    \ is workable, it isn't very interesting. Here's an approach I like better: Divide\
    \ the array (approximately) in half; recursively find the maximum of each half;\
    \ return the larger of these two maxima as the grand maximum. Again, the base\
    \ case is a one-element array, with that one element as the maximum.\n\nThis logic\
    \ translates easily into Python code.\n\n```python\ndef maximum(numbers):\n  \
    \  \"\"Find the maximum value in list 'numbers'.\"\"\n    if len(numbers) == 1:\n\
    \        return numbers[0]\n    mid = len(numbers) // 2 # integer division\n \
    \   leftmax = maximum(numbers[0:mid])\n    rightmax = maximum(numbers[mid:len(numbers)])\n\
    \    if leftmax > rightmax:\n        return leftmax\n    else:\n        return\
    \ rightmax\n```\n\n> Note: Array slicing (the [mid:len] syntax) makes a copy of\
    \ that part of the array, so the above function is much less efficient than it\
    \ might appear.\n\nThe same algorithm isn't quite as easy as Java, which does\
    \ not support passing in part of an array as an argument. Instead, we use a helper\
    \ method that takes two additional arguments, the lower bound and the upper bound\
    \ of an interval in the array. No copying is involved, so this will be much more\
    \ efficient than the Python version.\n\n```java\npublic static int maximum(int[]\
    \ numbers) {\n    return maxHelper(numbers, 0, numbers.length - 1);\n}\n\nprivate\
    \ static int maxHelper(int[] numbers,\n    int lo, int hi) {\n    if (lo == hi)\
    \ return numbers[lo];\n    int mid = (lo + hi) / 2;\n    int leftmax = maxHelper(numbers,\
    \ lo, mid);\n    int rightmax = maxHelper(numbers, mid + 1, hi);\n    if (leftmax\
    \ > rightmax) return leftmax;\n    else return rightmax;\n}\n```\n\nDo these programs\
    \ satisfy the four rules?\n\n- 1. Do they handle the base case(s) first? Yes,\
