  mdcn: "\n\n# 图 3.4H 蟾蜍已经向前移动；没有其他可能的移动。\n\n![](img/2ad0b39d74b4c2e45524e36e29e21a47_99_0.png)\n\
    \n现在我们来看程序。主程序将初始化棋盘，并调用一个递归回溯程序来尝试解决谜题。回溯程序要么成功并打印出获胜路径，要么失败，然后由主程序打印出坏消息。\n\n\
    下面的回溯方法命名为 `solveAndPrint`。它没有返回解决方案的方法；相反，它在找到目标状态并返回时直接打印结果。该方法必须检查自己是否处于叶子节点，在这种情况下，这意味着处于一个无法进一步移动的位置。\n\
    \n每一个可能的移动都会产生一个新的新棋盘位置，而这些新棋盘位置就是当前棋盘位置的*子节点*。要找到节点（即棋盘位置）的子节点，我们只需要找到该所有可能的移动。记住，为这些可能的移动找到一个顺序也是非常有益的。\n\
    \n在这里，是停下来思考的时候了。为了取得进展，我们必须在某种程度上对游戏进行分析。可能有很多方法可以实现，以下内容是基于我的推导方式。如果你要为这个谜题编写程序，可能会发现一种不同但同样有效的方法。\n\
    \n首先，注意到如果青蛙或蟾蜍可以移动，那么该移动是唯一的：如果它可以向前移动一格，它就不能跳跃；如果它可以跳跃，它就不能向前移动一格。这表明为了找到可能的移动，我们可能会给青蛙和蟾蜍赋值，并逐一检查。当我们查看所有的青蛙和蟾蜍后，我们就查看了所有可能的移动。这需要一个表格来跟踪每个青蛙或蟾蜍的位置，否则用某种方式用数字“标记”每一个，并在每次搜索棋盘以找到我们想要的。这两种方案都不理想。\n\
    \n接下来，注意到对于给定的棋盘位置，每个青蛙或蟾蜍占据一个唯一的空间。因此，与其讨论移动特定的青蛙或蟾蜍，不如讨论移动特定空间中的青蛙或蟾蜍。如果从给定空间可以移动，那么那必须是该空间唯一的可能移动，因为该空间内的青蛙或蟾蜍如果有移动，它是唯一的。这里有一点点复杂性，因为并不是每个空间都包含青蛙或蟾蜍，但至少一个地方的空间（不像青蛙和蟾蜍）是相同的。\n\
    \n现在我们有一个可以在程序中使用的简单移动排序。只需顺序检查棋盘的 $2n + 1$ 个空间。对于每个空间，要么恰好有一个移动，要么没有可能的移动。有了这种理解，我们可以写一个\
    \ `aMove` 方法来判断从给定位置是否可以移动：\n\n- 如果位置为空，则没有可能的移动；\n- 如果位置包含一只向右的青蛙，该方法检查向右的移动或跳跃；\n\
    - 如果位置包含一只向左的蟾蜍，该方法检查向左的移动或跳跃。\n\n我们写了另一个方法 `makeMove`，它接受一个棋盘和一个位置，从该位置移动，并返回一个新的棋盘作为其值。（我们可以通过修改旧棋盘而不是创建新棋盘来提高效率，但在这里我们更关注简单性。）\n\
    \n## 86 快速递归\n\n这是 Python 中的核心回溯方法：\n\n在 Java 中也是：\n\n```java\n/**\n * 递归地解决谜题并打印\n\
    \ * 反转的棋盘序列。\n */\nboolean solveAndPrint(String[] board) {\n    if (puzzleSolved(board))\
    \ {\n        return true;\n    }\n    for (int position = 0; \n        position\
