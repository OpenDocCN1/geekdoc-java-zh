    # 24 ■ Quick Recursion


    Modifying a data structure within a recursive function has the same problems as
    modifying a global variable. Since what you have a reference to the data structure,
    any modifications to it happen at all levels of the recursion.


    Sometimes the whole point of the recursive function is to modify the data structure.
    In this case, a simpler case (Rule 2) is usually to use just part of the data
    structure.


    Other times, a data structure might be modified on a trial-and-error basis, for
    example when searching for a solution, after which the changes must be undone.
    Undoing changes can be efficient but error-prone. Another approach is to pass
    a copy of the data structure rather than the original; the entire copy can be
    discarded when the function returns, leaving the original untouched.


    Copies can be *shallow* or *deep*. A *shallow copy* is a simple copy of all the
    top-level values in the data structure. For example, considering the following
    Python array:


    ```

    a = [1, [2, 3], 4]

    ```


    (Python calls this a list, but it''s actually more like an array). The variable
    now holds a reference to the array. If we do a simple assignment, b = a, the *reference*
    is copied into b, so that now a and both refer to the same array. Again, it is
    the reference that is copied, not the actual array. The same thing happens when
    a is passed to b as a parameter.


    ```

    b = a

    b[0] = 10

    b[1][0] = 20

    print(a) # prints [10, [20, 3], 4]

    ```


    Python has a copy method. The array has three values: the integer 1, a *reference*
    to the array [2, 3], and the integer 4. When'
  - '[PAGE 39]


    # Understanding Recursion ■ 25


    the array itself is copied, these three values are the ones that are copied into
    the new array.


    ```

    b = a.copy()

    b[0] = 10

    b[1][0] = 20

    print(a) # prints [1, [20, 3], 4]

    ```


    The value 1 in array a was not changed, but the value 2 was changed to 20. This
    happened because only the reference to the array [2, 3] was copied, not the complete
    array. A deep copy, on the other hand, copies the entire structure.


    ```

    import copy

    a = [1, [2, 3]]

    b = copy.deepcopy(a)

    b[0] = 10

    b[1][0] = 20

    print(a) # prints [1, [2, 3], 4]

    ```


    Copying a data structure can be expensive, and deep copying even more expensive,
    but if you must make tentative modifications to a data structure in a recursive
    function, you may need to work on a copy.


    # 1.8.4 Rule 4. Don’t Look Down


    When you reach a recursive call, don''t go back to the top of your routine and
    start working it over all again. Don''t try to “trace through” recursive calls.
    That way lies madness.


    Consider this: if you are working your through a complex but non-recursive routine,
    and it calls a sorting routine, do you drop everything and rush off to see if
    the sorting routine works? Of course not. Simply assume that the sorting routine
    works (if you have doubts you save them for later), and keep going in the routine
    you’re checking. Rule 4 simply says to treat all calls this way, even recursive
    ones.'
  - '[PAGE 40]


    # 26 Quick Recursion


    It may seem odd at first to assume the called routine works, when called routine
    happens to be the very one you''re checking. However, you must do so: the human
    mind does have limitations. Pretend, if it helps, you are not actually recurring,
    but rather calling an entirely different routine (which happens to have the same
    name) that you know to correct.


    What is involved here is perhaps best described as a “leap of faith.” You have
    to learn to trust recursion; to believe that, if you can get the routine correct
    at this level, then you don''t have to worry about any deeper levels. Until you
    can bring yourself to make this commitment, you will be compelled to look down
    into the recursion, and you will never untangle what you see there.


    Think about rules one to three, and try to convince yourself logically that a
    program written according to these rules ought to work. Then, even if you can''t
    manage rule four, pretend you do when you write your program.


    Now run your program. It will have errors, of course—programs always do—steadfastly
    refuse to look down. Over rules one, two, and three, and make sure you didn’t
    violate one of these. Next, go over the program the same way you always would,
    looking for errors that have nothing to do with the recursion itself (the error
    doesn''t have to be in the recursion, remember). If this too fails, get help.


    Don’t even think about looking down, for this simple reason: it doesn''t help.


    If the notion of “faith” bothers you, think about the novice programmer who complains
    that his program can''t be wrong, so the computer must have made a mistake. You
    may have once done this yourself. In time, all programmers learn to trust the
    computer; now you must learn to trust recursion.'
