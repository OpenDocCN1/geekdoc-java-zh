    \ form x.equals(y) will be in error if x could possibly be null.\n\nIt is surprisingly\
    \ difficult to write a single equals method for lists, but pulling the null tests\
    \ into a separate function (eq) results in readable code.\n\n```\n@Override\n\
    public boolean equals(Object obj) {\n    if (!(obj instanceof List)) return false;\n\
    \    List that = (List) obj;\n    return eq(this.head, that.head) &&\n       \
    \    eq(this.tail, that.tail);\n}\n```\n\nJava requires that the parameter to\
    \ equals be of type Object. Therefore, we must next check the type of the parameter\
    \ obj, and return false if it isn't a List. We can use a cache to save obj in\
    \ variable that of type List. Once the bureaucracy is satisfied, the actual work\
    \ is done in the return statement.\n\nThe helper function eq can be used to avoid\
    \ NullPointerExceptions with any types of objects, using the equals method defined\
    \ for obj1.\n\n[PAGE 57]\n\n```\nprivate static boolean eq(Object obj1, Object\
    \ obj2) {\n    if (obj1 == null) return obj2 == null;\n    return obj1.equals(obj2);\n\
    }\n```\n\nAnother important operation is to test whether a given value is a member\
    \ of a list. The method eq can again be used as a helper method.\n\n```\npublic\
    \ static boolean member(Object obj, List lst) {\n    if (lst == null) return false;\n\
    \    if (eq(obj, lst.head)) return true;\n    return member(obj, lst.tail);\n\
    }\n```\n\nThe member method tests whether a value is a top-level member of a list.\
    \ If we want to know whether a value exists anywhere in a list, possibly in a\
