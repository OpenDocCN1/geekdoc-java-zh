    \ solve：\n\n```java\nList solveAndPrint(String[] board) {\n    return solve(board,\
    \ null);\n}\n```\n\n```java\nprivate List solve(String[] board, List acc) {\n\
    \    if (puzzleSolved(board)) {\n        return new List(board);\n    }\n    for\
