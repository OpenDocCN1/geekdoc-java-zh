    \n```java\npublic class List {\n    public Object head;\n    public List tail;\n\
    \n    public List(Object head, List tail) {\n        this.head = head;\n     \
    \   this.tail = tail;\n    }\n}\n```\n\n上述代码包含一个构造函数，并提供了对头部和尾部的直接访问。测试列表是否为空，测试它是否等于\
