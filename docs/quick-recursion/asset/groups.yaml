    \ == 1 * 2 * 3 == 6\n4! == 1 * 2 * 3 * 4 == 24\n```\n\nand so on.\n\nNote that,\
    \ for example, 4! == 1 * 2 * 3 * 4 == (1 * 2 * 3) * 4 == 3! * 4, and in general\
    \ n! == (n-1)! * n. This leads to the following recursive definition:\n\nThe factorial\
