    +   1. Handle the base cases first.

    2. Only recurse with a simpler case.

    3. Don''t use external variables.

    4. Don''t look down.


    # 1.8.1 Rule 1. Handle the Base Cases First


    A base case is a task that can be computed directly with no need for recursion.
    For example, in the factorial program, the only base case is n == 0, and the result
    returned is 1. Other programs may have multiple base cases, each directly computable.
    The first thing any recursive program should do is test for base cases.


    Often there is a choice between using recursion and using a loop. If efficiency
    is critical, a loop is usually the better choice. Otherwise, the simpler alternative
    should be chosen.


    The purpose of a base case isn''t to avoid recursion altogether. The purpose of
    a base case is to stop a recursion. That brings us to the second rule.


