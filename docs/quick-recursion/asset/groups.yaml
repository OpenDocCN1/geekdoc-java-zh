  mdcn: "\n\n# 回溯\n\n回溯（Backtracking）是递归的一种形式。\n通常的情况是你面临一组选项，你必须选择其中一个。做出选择后，你将获得一组新的选项；你获得哪一组选项取决于你所做出的选择。这个过程会反复进行，直到你到达一个最终状态。如果你做出了一系列良好的选择，你的最终状态就是目标状态；如果没有，就不是。\n\
    \n从概念上说，你从树的根节点开始；这棵树可能有一些好的叶子和一些坏的叶子，尽管也可能所有叶子都是好的或都是坏的。你想到达一个好的叶子。从根节点开始，在每个节点，你选择它的一个子节点移动过去，并持续下去直到到达叶子。\n\
    \n假设你到达了一个坏叶子。你可以通过撤销最近一次选择并尝试该组中的下一个选项来回溯，继续寻找好的叶子。如果选项用尽了，撤销带你到达这里的选择，在该节点尝试另一个选择。如果你回到根节点且没有剩余选项，说明没有好的叶子了。\n\
    \n# 根节点\n\n![](img/2ad0b39d74b4c2e45524e36e29e21a47_72_0.png)\n\n图 3.1 一个有一个好叶子的树。\n\
    \n以下展示了回溯在图 3.1 的树上如何进行：\n\n- 1. 从根节点开始，你的选项有 A 和 B。你选择 A。\n- 2. 在 A，你的选项有 C 和\
    \ D。你选择 C。\n- 3. C 是坏的。回到 A。\n- 4. 在 A，你已经尝试过 C 且失败了。尝试 D。\n- 5. D 是坏的。回到 A。\n\
    - 6. 在 A，你没有剩余选项可以尝试了。回到根节点。\n- 7. 在根节点，你已经尝试过 A。尝试 B。\n- 8. 在 B，你的选项有 E 和 F。尝试\
    \ E。\n- 9. E 是好的。恭喜你！\n\n在这个例子中，我们画了一棵树。这棵树是我们可能做的选择序列的抽象模型。虽然有一种名为“树”的数据结构，但有时我们没有数据结构来告诉我们做了哪些选择。（如果我们有一个实际的树数据结构，在上面进行回溯被称为深度优先树搜索。）\n\
    \n# 3.1 回溯算法\n\n以下是从给定节点 `n` 开始执行回溯的算法（伪代码）：\n\n```\nfunction solvable(n):\n \
    \ if n is a leaf node:\n    if n is a goal node, return true\n    else return\
    \ false\nelse:\n  for each child c of n:\n    if solvable(c), return true\n  return\
    \ false\n```\n\n注意，该算法被表示为一个布尔函数。这对于理解该算法至关重要。如果 `solvable(n)` 为真，意味着节点 `n` 是解决方案的一部分——即节点\
    \ `n` 是从根节点到某个目标节点路径上的节点之一。我们称 `n` 为可解。如果 `solvable(n)` 为假，则不存在包含 `n` 且到达目标节点的路径。\n\
    \n它是如何工作的？\n\n- 如果 `n` 的任何子节点是可解的，那么 `n` 就是可解的。\n- 如果 `n` 没有任何子节点是可以解的，那么 `n`\
    \ 就是不可解的。\n\n因此，要判断任何非叶子节点 `n` 是否可解（即目标节点路径的一部分），你只需要测试 `n` 的任何子节点是否可解。这是对 `n`\
    \ 的每个子节点递归完成的。在上面的代码中，对 `n` 的每个子节点 `c` 操作通过以下行完成：\n\n```\nif solvable(c), return\
    \ true\nreturn false\n```\n\n最终，递归会在叶节点处“到底”。如果叶节点是目标节点，它是可解的；如果叶节点不是目标节点，它是不可解的。这是我们的基础情况。在上面的代码中，这通过以下行完成：\n\
    \n```\nif n is a leaf node:\n    n is a goal node, return true\n    return false\n\
    ```\n\n回溯算法简单且重要。你应该彻底理解它。另一种表述方式如下：\n\n搜索树：\n\n- 1. 如果树只由一个叶子组成，测试它是否为目标节点并返回结果；\n\
    - 2. 否则，搜索这棵树的子树，直到你找到一个包含目标节点的子树，或者你搜索了所有子树但未找到目标节点。\n\n在上述，我们假设任何目标节点都是叶子。该算法很容易适应到节点可能出现在树内部而不仅仅是叶子节点的情况。\n\
    \n# 3.2 非递归回溯\n\n回溯是一种相当典型的递归算法，任何递归算法都可以重写为栈算法。事实上，这正是你的递归算法翻译成机器语言或汇编语言的方式。\n\
    \n```\nboolean solve(Node n):\n    node n on the stack\n    while the stack is\
    \ not empty:\n        topnode = the node at the top of the stack\n        if topnode\
    \ is a leaf:\n            if it is a goal node, return true\n            else\
    \ pop it off the stack\n        else:\n            if topnode has untried children:\n\
    \                push the next untried child onto the stack\n```\n\n# 回溯 ■ 6\n\
    \n# 3.3 简化回溯\n\n简化二叉树搜索的方法之一是，在每个选择点，你都可以忽略之前所有的选择。\n\n"
