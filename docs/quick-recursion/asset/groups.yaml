    A CHAPMAN & HALL BOOK


    # Quick Recursion


    Recursion is the best tool for working with trees and graphs. But perhaps you''ve
    studied recursion and decided it''s too complicated. You can''t think that way.
    That limits the kind of programming you can do.


    Good news! Recursion is actually easy. It''s just badly taught.


    See, many instructors talk about how the computer does it. They go on and on about
    what happens at each level of the recursion and how each level relates to other
    levels. The problem is that you can''t think in multiple levels. Nobody can. And
    you don''t have to.


    This book will show you how you can write recursive programs. Once you understand
    a few simple rules, you will wonder why you ever thought recursion was complicated.
    You''ll be able to write recursive programs quickly and easily.


    Well, as quick and easy as programming ever is, anyway.


