  mdcn: "\n\n# 理解递归 ■ 9\n\n或者等效 Java 程序：\n\n```java\npublic static int factorial(int\
    \ n) {\n    if (n == 0) return 1;\n    else return n * factorial(n - 1);\n}\n\
    ```\n\n这个函数有一个基本情况（当 `n == 0` 时）和一个递归部分（当 `n` 为正数时），并且在递归的每一层都完成了部分工作（乘以 `n`）。因此，该函数似乎可能是可以工作的。但如果这是你第一次看到递归，你可能并不会习惯它。\n\
    \n有些作者建议，理解递归函数的最佳方法是对其进行追踪，记录函数每次调用和每次返回时发生的情况。务必通过这种追踪，这样做可以帮助你相信递归实际上是起作用的。但你永远不要将追踪递归过程视为理解此类过程的方法。“追踪过程”可能已经让成千上万的人从未真正理解过递归。本书的目的是描述一种更好的技术。\n\
    \n## 1.5 信息隐藏原则\n\n也许我们控制程序复杂性的单一最重要的工具就是模块化：将一个复杂的程序拆分成若干个更简单的、逻辑上独立的计算。根据编程语言的不同，这些有各种名称：函数、方法、过程等。\n\
    \n每当程序被拆分为两个部分，它们之间就会产生一个接口。这个接口由参数列表、它们之间可能共享的任何全局或公共变量、返回的任何或抛出的异常以及通常还有更微妙的信息传输方式组成。如果模块化要成功降低复杂性，这个接口必须保持尽可能窄且明确。\n\
    \n保持接口狭窄的最佳方法是确保每个例程只做一件事，并且这件事可以用一个英语句子轻松描述，且其中很少或完全没有“但是”和“除了”之类的词汇。保持短参数列表并避免全局变量也有帮助。\n\
    \n使接口明确的最佳方法是确保在尽可能的情况下，所有信息传输都通过参数列表发生，而不是通过全局变量。有些人认为应该完全避免全局变量，但我并不采取这种极端立场。对数组和其他大型数据结构进行全局访问通常更方便；只需特别注意不要意外修改它们即可。\n\
    \n也应该避免副作用。一个例程的主要效果是它本应该做的事；副作用是它所做的额外微小事情。当副作用是有意时，它们是危险的。例如，如果一个函数 `factorial(n)`\
    \ 计算 `n!`，那是它的主要效果；但如果它还将结果存储在一个全局变量中，那就是一个副作用。这是糟糕的，因为它在 `factorial` 函数中起到了补偿作用，但由于此副作用产生的错误将出现在调用\
    \ `factorial` 的任何代码中。由于这些例程本身可能是正确的，可能的结果是程序员花费几个小时尝试调试错误的例程。\n\n我们现在可以得出信息隐藏原则：每个例程都应该管好自己的事。没有哪个例程应该干涉另一个例程的事务。或者正式一点：\n\
    \n- 例程应该只使用提供它的信息，最好通过其参数列表。如果它必须访问全局数据，这一事实必须清楚且无歧地指定。\n- 例程应该返回单个结果（在 Python\
    \ 中，这可以是值的元组）并且不做其他任何事。如果它必须修改全局数据，这一事实必须清楚且无歧地指定。\n- 例程应该独立于它的上下文。例如，如果某个例程调用了一个排序方法，\n\
    - 该例程既不应该也不关心排序方法如何运作，只要排序发生了即可，\n- 此外，排序方法既知道也不需要知道为什么调用例程想要排序。\n\n类似的规则也适用于类和对象。对象持有各种类型的数据；对象的类持有操作这些数据的方法。对象的数据应仅通过其类给的方法进行访问和修改，而不能从类外部进行。\n\
    \n这里有三个违反信息隐藏原则的简单示例。在每种情况下，函数都应该返回非空整数列表中的最小值或最大值。你能识别出这些违规行为吗？\n\n```python\n\
    def minimum2(numbers):\n    \"\"\"返回列表中的最小数字。\"\"\"\n    global i\n    min = numbers[0]\n\
    \    for i in range(1, len(numbers)):\n        if numbers[i] < min:\n        \
    \    min = numbers[i]\n    return min\n```\n\n答案在本节的末尾。\n\n这些示例是微不足道的，而且在现实生活中不太可能导致重大问题。当程序的其余部分变得更有趣时，情况就会变得糟糕。\n\
    \n下面的骨架程序控制人类与计算机之间的双玩家游戏，玩家交替移动。在这个例子中，信息隐藏原则在很大程度上得到了尊重；事实上，从程序无法推断出正在玩哪种游戏。\n\
    \n```python\ndef main():\n    setup()\n    player = choose_who_goes_first()\n\
    \    game_over = False\n    while not game_over:\n        if player == 'human':\n\
    \            move = ask_human_for_move()\n            (game_over, result) = make_move(player,\
    \ move)\n            player = 'computer'\n        else: # player == 'computer'\n\
    \            move = decide_move()\n            (game_over, result) = make_move(player,\
    \ move)\n            player = 'human'\n```\n\n```python\ndef ask_human_for_move():\n\
    \    move = input('Enter your move: ')\n    if legal_move(move):\n        return\
    \ move\n    else:\n        print(\"That's not legal. Try again.\")\n        return\
    \ ask_human_for_move()\n```\n\n给定对调用例程的简单假设，就可以理解这个程序并验证其正确性。例如，我们期望 `choose_who_goes_first()`\
    \ 以某种方式决定谁先手，并将其设置为“human”或“computer”。与主程序相关的信息完全指定在参数列表中。我没有显示任何声明。可能有一个表示棋盘的结构化变量“board”；如果只有一个，并且被所有例程使用，那么将“board”作为一个全局变量可能是一个好主意，而不是放在每个例程的参数列表中。\n\
    \n现在考虑同一个程序的另一个版本。\n\n```python\ndef main():\n    global k\n    setup()\n    choose_who_goes_first()\n\
    \    while not game_over:\n        if player == 'human':\n            ask_human_for_move()\n\
    \            check_if_move_is_legal()\n        k = k - 1\n        make_move()\n\
    \        else: # player == 'computer'\n            decide_move()\n        k =\
    \ k + 1\n        make_move()\n    print(\"Game over!\")\n    print(result)\n```\n\
    \n由于大量违反信息隐藏原则，如果不引用调用例程，无法判断程序是否正确。\n\n- 哪个例程或哪些例程更新了 `player`？它们这样做的方式是否让主程序工作？\n\
    - 如果人类移动不合法，`player` 是否已经更新？\n- `make_move` 如何知道执行谁的移动？\n- `result` 在哪里确定的？\n\
    - 游戏何时结束？这在哪里确定的？\n- `k` 是否被正确初始化？计算是否正确？它到底是什么，在何处使用？\n\n到这里，我们似乎偏离了递归主题，也许我们确实偏了，因为信息隐藏原则适用于所有程序。然而，正如我们在稍后的章节中看到的，它对递归程序具有特殊重要。\n\
    \n关于信息隐藏违规问题的答案：\n\n1. `minimum1`：排序列表是一个剧烈的副作用。\n2. `minimum2`：函数改变了全局变量 `i`。\n\
    3. `maximum`：该函数假设列表不完全由负数组成。\n\n"
