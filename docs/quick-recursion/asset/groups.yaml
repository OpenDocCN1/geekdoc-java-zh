- md: "\n# Backtracking\n\nBACKTRACKING IS A form of recursion.\nThe usual scenario\
    \ is that you are faced with a number of options, and you must choose one of these.\
    \ After you make your choice you will get a new set of options; just what set\
    \ of options you get depends on what choice you made. This procedure is repeated\
    \ over and over until you reach a final state. If you made a good sequence of\
    \ choices, your final state is a goal state; if you didn't, it isn't.\n\nConceptually,\
    \ you start at the root of a tree; the tree probably has some good leaves and\
    \ some bad leaves, though it may be that the leaves are all good or all bad. You\
    \ want to get to a good leaf. At each node, beginning with the root, you choose\
    \ one of its children to move to, and you keep this up until you get to a leaf.\n\
    \nSuppose you get to a bad leaf. You can backtrack to continue the search for\
    \ a good leaf by revoking your most recent choice and trying out the next option\
    \ in that set of options. If you run out of options, revoke the choice that got\
    \ you here, and try another choice at that node. If you end up at the root with\
    \ no options left, there are no good leaves to be found.\n\n# Root\n\n![](img/2ad0b39d74b4c2e45524e36e29e21a47_72_0.png)\n\
    \nFIGURE 3.1 A tree with one good leaf.\n\nThe following shows how backtracking\
    \ might proceed on the tree in Figure 3.1:\n\n- 1. Starting at Root, your options\
    \ are A and B. You choose A.\n- 2. At A, your options are C and D. You choose\
    \ C.\n- 3. C is bad. Go back to A.\n- 4. At A, you have already tried C, and it\
    \ failed. Try D.\n- 5. D is bad. Go back to A.\n- 6. At A, you have no options\
    \ left to try. Go back to Root.\n- 7. At Root, you have already tried A. Try B.\n\
    - 8. At B, your options are E and F. Try E.\n- 9. E is good. Congratulations!\n\
    \nIn this example we drew a picture of a tree. The tree is an abstract model of\
    \ the possible sequences of choices we could make. There is also a data structure\
    \ called a tree, but sometimes we don't have a data structure to tell us what\
    \ choices we make. (If we do an actual tree data structure, backtracking on it\
    \ is called depth-first tree searching.)\n\n# 3.1 THE BACKTRACKING ALGORITHM\n\
    \nHere is the algorithm (in pseudocode) for doing backtracking, starting from\
    \ a given node n:\n\n```\nfunction solvable(n):\n  if n is a leaf node:\n    if\
    \ n is a goal node, return true\n    else return false\nelse:\n  for each child\
    \ c of n:\n    if solvable(c), return true\n  return false\n```\n\nNotice that\
    \ the algorithm is expressed as a boolean function. This is essential to understanding\
    \ the algorithm. If solvable(n) is true, means node n is part of a solution—that\
    \ is, node n is one of the nodes on a path from the root to some goal node. We\
    \ say that n is solvable. If solvable(n) is false, then there is no path that\
    \ includes n to any goal node.\n\nHow does this work?\n\n- If any child of n is\
    \ solvable, then n is solvable.\n- If no child of n is solvable, then n is not\
    \ solvable.\n\nHence, to decide whether any non-leaf node n is solvable (part\
    \ of a path to a goal node), all you have to do is test whether any child of n\
    \ is solvable. This is done recursively, on each child of n. In the above code,\
    \ each child c of n: is done by the lines\n\n```\nif solvable(c), return true\n\
    return false\n```\n\nEventually, the recursion will “bottom out” at a leaf node.\
