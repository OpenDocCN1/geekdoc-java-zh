    \  if n == 0:\n    return 1\n  else:\n    return factorial(n - 1) * n\n```\n\n\
    假设程序调用 `factorial(3)`。会发生什么？\n\n- 1. 值 3 被赋值给局部变量 `n`。\n  - n 不为 0，所以函数“记住”了 `n`\
