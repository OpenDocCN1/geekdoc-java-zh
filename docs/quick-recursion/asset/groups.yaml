- md: "\n## Appendix F: Python Debugging\n\nThe tracing methods used are displayed\
    \ below. All but enter have essentially the same structure. In fact, only enter\
    \ and result are needed; the others are more convenience functions.\n\n```python\n\
    indent = \" \"\"\ndebugging = True\n\ndef enter(*args):\n    if not debugging:\
    \ return\n    import inspect\n    global indent\n    fargs = [str(x) for x in\
    \ args]\n    print(indent + inspect.stack()[1].function + \n    str(fargs))\n\
    \    indent += \" \"\n```\n\n```python\ndef yes():\n    if not debugging: return\
    \ True\n    global indent\n    indent = indent[3:]\n    print(indent + \"True\"\
    )\n    return True\n```\n\n```python\ndef no():\n    if not debugging: return\
    \ False\n    global indent\n    indent = indent[3:]\n    print(indent + \"False\"\
    )\n    return False\n```\n\n```python\ndef result(value):\n    if not debugging:\
    \ return value\n    global indent\n    indent = indent[3:]\n    print(indent +\
    \ str(value))\n    return value\n```\n\n```python\ndef nothing():\n    if not\
    \ debugging: return None\n```\n\n```python\nglobal indent\nindent = indent[3:]\n\
    print(indent + \"None\") # can be omitted\nreturn None\n```\n\nThe call `inspect.stack()[1].function`\
