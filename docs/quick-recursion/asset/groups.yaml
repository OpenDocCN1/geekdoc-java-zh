    \ of Information Hiding: Every routine should mind its own business. No routine\
    \ should meddle in the affairs of another. Or, somewhat more formally,\n\n- A\
    \ routine should use only the information provided to it, preferably via its parameter\
    \ list. If it must access global data, that fact must be clearly and unambiguously\
    \ specified.\n- A routine should return a single result (in Python, this could\
