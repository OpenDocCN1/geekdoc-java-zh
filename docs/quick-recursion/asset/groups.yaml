    \       fac = fac * n\n    return fac\n```\n\n非递归版本将 `n` 放入栈中并将 `n` 设置为 `n - 1`，等同于保存局部变量\
    \ `n` 并使用 `n - 1` 进行递归调用。从栈弹出并将栈顶值放回 `n` 等同于从递归调用返回。\n\n显然，递归版本的 `factorial` 更简单；重点在于展示递归可以通过栈来实现。人们可能想这样做的主要原因是，递归（尤其是非常深的递归，数千层）由于栈所需的空间巨大，计算开销可能会很大。\n\
    \n## 1.11 尾递归\n\n如果递归是函数中执行的最后件事，那么该函数就是尾递归的。如果函数包含多个递归调用，只有当每个递归调用都是函数中的最后一个操作时，它才是尾递归的。\n\
    \n再次考虑阶乘函数。\n\n```python\ndef factorial(n):\n    \"\"\"计算参数的阶乘.\"\"\"\n    if\
    \ n == 0:\n        return 1\n    else:\n        return factorial(n - 1) * n\n\
    ```\n\n这个函数不是尾递归的。递归调用发生在函数的最后语句中，但它不是最后的操作；在递归调用之后，该调用的结果还会与 `n` 相乘。\n\n通过将乘法提取到一个额外的参数（累加器）并提供一个面向用户的函数（外壳）来调用它，可以将阶乘函数变为尾递归。这种技术将在以后详细讨论。目前：\n\
    \n```python\ndef factorial(n, acc=1):\n    \"\"\"计算参数的阶乘.\"\"\"\n    if n == 0:\n\
    \        return acc\n    else:\n        return factorial(n - 1, acc * n)\n```\n\
    \n"
