    \ $k$ 个字符上必须不同，其中 $k$ 由实现设置。同样地，嚎叫的最大长度可能由你的肺活量决定。\n\n你可能已经注意到，上面的定义不必是递归的；它们可以通过使用“任意数量的……”这类短语被转变为普通定义，而这可以通过循环来实现。这是事实的——我们并不需要递归。事实上，递归*从不是*绝对必要的，只是有用的。\n\
