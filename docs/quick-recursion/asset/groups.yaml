    \n## 1.3 一个简单的递归过程\n\n递归过程（或函数、方法、子程序）是某种通过调用自己来完成部分工作的过程。\n\n再次，技巧在于对“部分”一词的使用。如果它调用自己来完成所有工作，它就会变成无限递归（循环）。正如循环在递归的每一层中执行部分工作，直到最终所有工作完成。\n\
    \n## 6 快速递归\n\n我们将从一个简单的例子开始。显而易见的做法是将代码嵌入循环，设置某种标记来指示用户是否回答正确。相反，如果我们直接再次调用方法并返回它的结果呢？如果用户以\
