    \n递归在计算机科学中随处可见。例如，“标识符”（或“变量名”）的一个典型定义如下。\n\n## 标识符：\n\n- 1. 一个字母，或\n- 2. 一个标识符后面跟着一个字母、数字或下划线。\n\
