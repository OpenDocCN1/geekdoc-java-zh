    \ 的输出\n\n表达式语言使用了许多隐式对象。一些隐式对象列在表 10.9 中：\n\n| 序号 | 隐式对象 | 用法 |\n| :--- | :---\
    \ | :--- |\n| 1 | `pageScope` | 它将给定的属性名与页面作用域（page scope）中设置的值进行映射。 |\n| 2 |\
    \ `requestScope` | 它将给定的属性名与请求作用域（request scope）中设置的值进行映射。 |\n| 3 | `sessionScope`\
    \ | 它将给定的属性名与会话作用域（session scope）中设置的值进行映射。 |\n| 4 | `applicationScope` | 它将给定的属性名与应用作用域（application\
    \ scope）中设置的值进行映射。 |\n| 5 | `param` | 它将请求参数映射到单一值。 |\n| 6 | `paramValues` | 它将请求参数映射到值数组。\
