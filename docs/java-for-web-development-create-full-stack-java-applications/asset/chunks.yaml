  trans: "\n\n`include` 指令用于指定在 JSP 页面编译期间要插入的文件名（以相对 URL 的形式存在）。所包含的文件内容将成为 JSP 页面的一部分。`include`\
    \ 指令还可以用于插入多个页面共同通用的代码部分，以避免为每个代码实例单独使用 bean。被包含的文件可以是 HTML 文件、文本文件或用 Java 编程语言编写的代码。\n\
    \n例如，对于一个包含学院名称和 Logo 的 JSP 页面，用于包含头文件 `file(Instituteoflearning.xhtml)` 的代码行可以写如下所示：\n\
    \n```jsp\n<%@ include=\"Instituteoflearning.xhtml\" %>\n```\n\n### 以下是其优点\n- 代码的可重用性，适用于包含版权信息、脚本语言文件或任何你可能想在其他应用程序中重用的内容。\n\
    - 在指令所在的主 JSP 文件中插入另一个文件的内容。\n\n### 以下是一个示例\n```html\n<body>\n  <%@ include file=\"\
    instituteoflearning.xhtml\" %>\n  <h6> 今日日期和时间是 </h6>\n  <%= java.util.Calendar.getInstance().getTime()\
    \ %>\n</body>\n</html>\n```\n\n### Taglib 指令\nJSP `taglib` 指令用于定义包含许多标签的标签库。标签库由一组与功能相关的用户自定义\
    \ XML 标签组成，称为 `custom tags`（自定义标签）。自定义将在后续章节中描述。我们使用标签库描述符（`TLD`）文件来定义这些标签。\n\n\
    ### 语法如下\n```jsp\n<%@ taglib uri=\"uriofthetaglibrary\" prefix=\"prefixoftaglibrary\"\
    \ %>\n```\n\n### 结论\nJSP 指令用于指定特定页面的通用信息。`page` 指令定义了适用于整个 JSP 页面的属性，例如用于导入类的\
    \ `extends`、定义 JSP 是否线程安全的 `isThreadSafe`、处理异常的 `error-page` 和 `isErrorPage`，以及检查会话对象（session）是否可用\
    \ `session`。\n\n`include` 指令在指令所在的主 JSP 文件中插入另一个文件的内容。`Taglib` 指令用于定义包含许多标签的标签库。\n\
    \n在下一章中，我们将学习 JSP 动作（SP actions），如 `useBean`、`getProperty`、`setProperty` 和 `forward`，以执行插入文件、重用\
    \ bean、将用户转发到另一个页面以及实例化对象等任务。我们还将学习自定义标签库，它提供了一种机制，程序员可以封装重复的代码或任务并在多个应用程序中重用它们。\n\
    \n### 问题\n1. **JSP 使用 page 指令中的 _________________ 属性处理运行时错误。**\n   **答案：** 通过\
    \ `errorPage` 和 `isErrorPage` 属性\n\n2. **page 指令的主要属性有哪些？**\n   **答案：** `buffer`,\
    \ `ContentType`, `autoFlush`, `errorPage`, `isErrorPage`, `extends`, `isThreadSafe`,\
    \ `language`, `Session`, `import`, `info`, `isElIgnored`\n\n3. **JSP 页面是可扩展的。**\n\
    \   A. 正确\n   B. 错误\n   **答案：** 正确\n\n4. **page 指令的作用是什么？**\n   A. 指示翻译器在其包含的\
    \ JSP 页面内分配值。\n   B. 指示翻译器关于其包含的 JSP 页面的特征。\n   C. 指示翻译器关于此 JSP 页面使用的文件。\n   D.\
    \ 指示翻译器关于此 JSP 页面使用的模块。\n   **答案：** A\n\n5. **我们在 JSP 页面中将 page 指令放在哪里？**\n  \
    \ A. 在开头\n   B. 在中间\n   C. 在末尾\n   D. 任何地方\n   **答案：** D\n\n6. **一个 JSP 页面允许多少个\
    \ page 指令？**\n   A. 1\n   B. 2\n   C. 多个\n   **答案：** C\n\n7. **有多少个 page 指令属性？**\n\
    \   **答案：** 3\n\n8. **使用 page 指令，我们可以在 JSP 中包含什么类型的文件？**\n   A. HTML\n   B. JSP\n\
    \   C. 两者都不是\n   D. 都是\n   **答案：** D\n\n9. **使用 page 指令包含的页面通常称为？**\n   A. 组件\
    \ (Components)\n   B. 片段 (Fragments)\n   C. 模块 (Modules)\n   D. 包 (Parcels)\n\
    \   **答案：** A\n\n# 第 10 章 JSP 动作元素与自定义标签\n\n### 引言\nJSP 动作用于执行诸如插入文件、重用 bean、将用户转发到另一个页面以及实例化对象等任务。自定义标签提供了一种机制，程序员可以使用它来封装重复的代码或任务。\n\
    \n### 结构\n在本章中，我们将涵盖以下主题：\n- JSP 动作元素\n- 自定义标签\n- 模型-视图-控制器 (MVC) 架构\n\n### 目标\n\
    学习本章后，你将学习动作标签的使用，并学习如何创建自己的标签、在应用程序中使用它们，并查看表达式语言（Expression language）如何简化存储在\
    \ Java Bean 组件及其他对象（如 `request`、`session` 和 `application`）中的数据的访问性。在本章中，你还将学习将业务逻辑与表示逻辑分离的\
    \ MVC 架构。\n\n### JSP 动作标签\nJSP 提供了标准标签，用于插入、移除和重用 bean，将用户转发到另一个页面并实例化对象。\n\n\
    JSP 动作标签的语法如下：\n```xml\n<jsp:action_name attribute=\"attribute_value\"/>\n```\n\
    \n各种 JSP 动作如表 10.1 所示：\n\n| 序号 | JSP 动作 | 用途 | 属性 | 描述 |\n| :--- | :--- | :---\
    \ | :--- | :--- |\n| 1 | `<jsp:useBean>` | 用于查找并加载现有 bean | `id` | 唯一标识 bean 实例\
    \ |\n| | | | `class` | 指定实现 对象的类 |\n| | | | `scope` | 指定 bean 在页面、会话或应用程序中的生命周期\
    \ |\n| | | | `beanName` | 指定 bean 的引用名称 |\n| 2 | `<jsp:getProperty>` | 用于获取指定\
    \ bean 的属性并作为输出。获取的值在作为输出之前会转换为字符串值。 | `name` | 指定 bean 的名称 |\n| | | | `property`\
    \ | 指定要获取值的属性 |\n| 3 | `<jsp:setProperty>` | 用于设置指定 bean 的属性；要设置 bean 属性的值，可以指定显式值，也可以从请求参数获取。根据指定的请求属性值，调用\
    \ bean 中对应的 setter。 | `name` | 指定 bean 的名称 |\n| | | | `property` | 指定要设置值的属性。如果设置为\
    \ `*`，则表示调用所有指定值的 setter。 |\n| | | | `value` | 为 bean 属性指定显式值 |\n| | | | `param`\
    \ | 指定用于设置 bean 属性值的请求参数名称 |\n| 4 | `<jsp:forward>` | 用于将请求转发到另一个页面 | `page` |\
    \ 指定目标页面的相对 URL |\n| 5 | `<jsp:include>` | 用于向特定的 JSP 页面插入文件。文件包含发生在 JSP 页面的请求期间。\
    \ | `page` | 指定要包含的页面相对 URL |\n| | | | `flush` | 指定是否刷新缓冲区。声明包含动作时必须包含一个强制性的布尔属性。\
    \ |\n\n"
- fmt: "\n| 6 | `<jsp:param>` | Used as a sub-attribute with `jsp:include` and `jsp:forward`\
    \ to pass additional request parameters | `name` | Specifies the name of the reference\
    \ parameter |\n| `value` | Specifies the value for the reference parameter |\n\
    \n**Table 10.1: The various JSP Action tags**\n\nThere are many JSP action tags,\
    \ and each of them has its uses and characteristics.\n\n### [jsp:useBean action\
    \ tag](#toc.xhtml_aa150)\n\nIt is used to create a reference to specify the inclusion\
    \ of a predefined bean component in the JSP page. If the bean object of the `Bean`\
    \ class is already created, it doesn't create the bean depending on the scope.\
    \ But if an object of the bean is not created, it instantiates the bean.\n\n**Syntax**:\n\
    \n```jsp\n<jsp:useBean id=\"instanceName\" scope=\"page | request | session |\
    \ application\" class=\"packageName.className\" type=\"packageName.className\"\
    \ beanName=\"packageName.className | <%= expression %>\"> </jsp:useBean>\n```\n\
    \n**Example**:\n```jsp\n<jsp:useBean id=\"savAcc\" scope=\"application\" class=\"\
    savAccount\" />\n```\n\nThe preceding code line specifies the inclusion of a bean\
    \ referred to by the name `savAcc` of the class `savAccount`. The class is the\
    \ Java class that defines the bean. A JavaBean class should follow the following\
    \ conventions:\n\n* It should have a constructor with no argument.\n* It should\
    \ be serializable.\n* It should provide methods to set and get the values of the\
    \ properties, known as the getter and setter methods.\n\nOnce instantiated, a\
    \ bean can be reused using the same scope and `ID`.\n\nThe following are the attributes\
    \ of the `useBean` tag:\n\n* `id`: This attribute uniquely identifies the instance\
    \ of the bean.\n* `Class`: This attribute specifies the class from which the bean\
    \ objects are to be implemented.\n* `Scope`: This attribute specifies the life\
    \ of the object and takes the following values, as described in *[Table 10.2](#chap10.xhtml_tab10.2)*:\n\
    \n| Scope | Life of the object |\n| :--- | :--- |\n| page | The availability of\
    \ the object corresponds to the response of the particular page to the current\
    \ year’s request. The object is created with the initiation of a user request\
    \ and destroyed on its completion. |\n| session | The availability of the object\
    \ corresponds to the existence of a particular session. |\n| application | The\
    \ availability of the object exists throughout the application. |\n| request |\
    \ The availability of the object corresponds to the existence of the `HttpServletRequest`\
    \ object. |\n\n**Table 10.2: Value of scope attributes**\n\n* `beanName`: This\
    \ attribute specifies a referential name for the bean.\n* `type`: This attribute\
    \ provides the bean a data type if the bean already exists in the scope. It is\
    \ mainly used with the `class` or `beanName` attributes. If you use it without\
    \ `class` or `beanName`, no bean is instantiated.\n\n**Example**: In the following\
    \ example, a bean has a method `square` which is fetched with the help of the\
    \ `useBean` tag:\n\n**MyBean class:**\n```java\npackage IOL;\npublic class MyBean\
    \ {\n    public int square(int n) {\n        return n*n;\n    }\n}\n```\n\n**index.jsp**:\n\
    ```jsp\n<html>\n<body>\n    <jsp:useBean id=\"obj\" class=\"IOL.MyBean\"/>\n \
    \   <%\n        int m=obj.square(5);\n        out.print(\"squareof 5 is \"+m);\n\
    \    %>\n</body>\n</html>\n```\n\nThe following is the output, as shown in *[Figure\
    \ 10.1:](#chap10.xhtml_fig10.1)*\n\n![img](images/152.png)\n\n**Figure 10.1: Output\
    \ of index.jsp**\n\n### [jsp:setProperty and jsp:getProperty action tags](#toc.xhtml_aa151)\n\
    \nThese tags are used to set and get the property value in the bean class. It\
    \ is a reusable component that represents the data.\n\n**The syntax of the `setProperty`\
    \ action tag is as follows**:\n\n```jsp\n<jsp:setProperty name=\"instanceOfBean\"\
    \ property=\"*\" | property=\"propertyName\" param=\"parameterName\" | property=\"\
    propertyName\" value=\"{ string | <%= expression %>\"/>\n```\n\n**Example**:\n\
    ```jsp\n<jsp:setProperty name=\"savAcc\" property=\"*\" />\n```\nThe preceding\
    \ code line sets all the values of the upcoming request in the bean class.\n\n\
    **The syntax of `jsp:getProperty` action tag is as follows**:\n\n```jsp\n<jsp:getProperty\
    \ name=\"instanceOfBean\" property=\"propertyName\"/>\n```\n\n**Example**:\n```jsp\n\
    <jsp:setProperty name=\"savAcc\" name=\"accountNo\" />\n```\nThe `jsp:getProperty`\
    \ action tag returns the value of the property `accountNo`.\n\nThe following are\
    \ the attributes of the `setProperty` tag:\n\n* `name`: Specifies a name for the\
    \ bean.\n* `property`: Specifies the property for which values are to be set.\
    \ If set to `*`, it specifies that the set methods for all the values should be\
    \ called.\n* `Value`: Specifies an explicit value for the bean.\n* `Param`: Specifies\
    \ the name of the request parameter to set the value of the bean property.\n\n\
    The following are the attributes of the `getProperty` tag:\n\n* `Name`: Specifies\
    \ the name of the bean.\n* `Property`: Specifies the property that needs to be\
    \ retrieved.\n\n**Example**: In the following example, we set and get the name\
    \ and password from the bean class:\n\n**index.jsp**:\n```jsp\n<html>\n<body>\n\
    \    <form action=\"next.jsp\" method=\"post\">\n        User Name:<input type=\"\
    text\" name=\"userName\"><br>\n        Password:<input type=\"password\" name=\"\
    password\"><br>\n        <input type=\"submit\" />\n    </form>\n</body>\n</html>\n\
    ```\n\n**Bean class**:\n```java\npackage IOL;\npublic class NewClass implements\
    \ java.io.Serializable {\n    public String userName, password;\n    public String\
    \ getUserName() {\n        return userName;\n    }\n    public void setUserName(String\
    \ userName) {\n        this.userName = userName;\n    }\n    public String getPassword()\
    \ {\n        return password;\n    }\n    public void setPassword(String password)\
    \ {\n        this.password = password;\n    }\n}\n```\n\n**next.jsp**:\n```jsp\n\
    <html>\n<body>\n    <jsp:useBean id=\"myBean\" class=\"IOL.NewClass\"></jsp:useBean>\n\
    \    <jsp:setProperty property=\"*\" name=\"myBean\"/>\n    Record:<br>\n    User\
    \ name=<jsp:getProperty property=\"userName\" name=\"myBean\"/><br>\n    password=<jsp:getProperty\
    \ property=\"password\" name=\"myBean\"/><br>\n</body>\n</html>\n```\n\nThe following\
    \ is the output of index.jsp, as shown in *[Figure 10.2:](#chap10.xhtml_fig10.2)*\n\
    \n![img](images/155a.png)\n\n**Figure 10.2: Output of index.jsp**\n\nThe following\
    \ is the output of next.jsp, as shown in *[Figure 10.3:](#chap10.xhtml_fig10.3)*\n\
    \n![img](images/155b.png)\n\n**Figure 10.3: Output of next.jsp**\n\n### [Jsp:forward\
    \ action tag](#toc.xhtml_aa152)\n\nThis tag is used to forward the request to\
    \ another page.\n\n**Syntax**:\n\n```jsp\n<jsp:forward page=\"relativeURL | <%=\
    \ expression %>\">\n    <jsp:param name=\"parametername\" value=\"parametervalue\
    \ | <%=expression%> />\n</jsp:forward>\n```\n\n`page` is the attribute of the\
    \ forward tag.\n\n**Example**:\n\n**Index.xhtml**:\n```html\n<html>\n<body>\n\
    \    <form action=\"Next.jsp\" method=\"post\">\n        User Name:<input type=\"\
    text\" name=\"userName\"><br>\n        Password:<input type=\"password\" name=\"\
    password\"><br>\n        <input type=\"submit\" />\n    </form>\n</body>\n</html>\n\
    ```\n\n**Next.jsp**:\n```html\n<html>\n<body>\n    <jsp:forward page=\"next2.jsp\"\
    >\n        <jsp:param name=\"date\" value=\" 17 January 2022\"/>\n    </jsp:forward>\n\
    </body>\n</html>\n```\n\n**Next2.jsp**:\n```html\n<html>\n<body>\n    <h1> Record\
    \ <br>\n    User Name<%= request.getParameter(\"userName\") %><br>\n    password\
    \ = <%= request.getParameter(\"password\") %><br>\n    Date<%= request.getParameter(\"\
    date\") %>\n    </h1>\n</body>\n</html>\n```\n\nThe following is the output of\
    \ index.xhtml, as shown in *[Figure 10.4:](#chap10.xhtml_fig10.4)*\n\n![img](images/157a.png)\n\
    \n**Figure 10.4: Output of index.xhtml**\n\nThe following is the output of next2.jsp,\
    \ as shown in *[Figure 10.5:](#chap10.xhtml_fig10.5)*\n\n![img](images/157b.png)\n\
    \n**Figure 10.5: Output of Next2.jsp**\n"
  raw: '| 6 | **<jsp:​param>** | Used as a sub-attribute with jsp:include and jsp:forward
    to pass additional request parameters | **name** | Specifies the name of the reference
    parameter |


    | **value** | Specifies the value for the reference parameter |


    ***Table 10.1**: The various JSP Action tags*


    There are many JSP action tags, and each of them has its uses and characteristics.


    [**jsp:useBean action tag**](#toc.xhtml_aa150)


    It is used to create a reference to specify the inclusion of a predefined bean
    component in the JSP page. If the bean object of the Bean class is already created,
    it doesn''t create the bean depending on the scope. But if an object of the bean
    is not created, it instantiates the bean.


    **Syntax**:


    <jsp:useBean id= "instanceName" scope= "page | request | session | application"   class=
    "packageName.className" type= "packageName.className"  beanName="packageName.className
    | <%= expression >" >  </jsp:useBean>


    **Example**: **<jsp:useBean id=”savAcc” scope= “application” class= “savAccount”
    />**


    The preceding code line specifies the inclusion of a bean referred to by the name
    **savAcc** of the class **savAccount**. The class is the Java class that defines
    the bean. A JavaBean class should follow the following conventions:


    *   It should have a constructor with no argument.


    *   It should be serializable.


    *   It should provide methods to set and get the values of the properties, known
    as the getter and setter methods.


    Once instantiated, a bean can be reused using the same scope and ID.


    The following are the attributes of the **useBean** tag:


    *   **id**: This attribute uniquely identifies the instance of the bean.


    *   **Class**: This attribute specifies the class from which the bean objects
    are to be implemented.


    *   **Scope**: This attribute specifies the life of the object and takes the following
    values, as described in *[Table 10.2](#chap10.xhtml_tab10.2)*:


    | **Scope** | **Life of the object** |


    | **page** | The availability of the object corresponds to the response of the
    particular page to the current year’s request. The object is created with the
    initiation of a user request and destroyed on its completion. |


    | **session** | The availability of the object corresponds to the existence of
    a particular session. |


    | **application** | The availability of the object exists throughout the application.
    |


    | **request** | The availability of the object corresponds to the existence of
    the HttpServletRequest object. |


    ***Table 10.2**: Value of scope attributes*


    *   **beanName**: This attribute specifies a referential name for the bean.


    *   **type**: This attribute provides the bean a data type if the bean already
    exists in the scope. It is mainly used with the class or **beanName** attributes.
    If you use it without class or **beanName**, no bean is instantiated.


              **Example**: In the following example, a bean has a method square which
    is fetched with the help of the **useBean** tag:


              **MyBean class:**


          package IOL;


          public class MyBean


          {


          public int square(int n)


          {return n*n;}


          }


              **index.jsp**:


          <html>


           <body>


              <jsp:useBean id="obj" class="IOL.MyBean"/>


              <%


                int m=obj.square(5);


                out.print("squareof 5 is "+m);


                %>


          </body>


          </html>


    The following is the output, as shown in *[Figure 10.1:](#chap10.xhtml_fig10.1)*


    ![img](images/152.png)


    ***Figure 10.1**: Output of index.jsp*


    [**jsp:setProperty and jsp:getProperty action tags**](#toc.xhtml_aa151)


    These tags are used to set and get the property value in the bean class. It is
    a reusable component that represents the data.


    **The syntax of the** setProperty **action tag is as follows**:


    <jsp:setProperty name="instanceOfBean" property= "*"  |  property="propertyName"
    param="parameterName" | property="propertyName" value="{ string | <%= expression
    %>


    />


    **Example**:


    <jsp:setProperty name=””savAcc” property=”*” />


    The preceding code line sets all the values of the upcoming request in the bean
    class.


    **The syntax of the** **jsp:getProperty** **action tag is as follows**:


    <jsp:getProperty name="instanceOfBean" property= propertyName/>


    **Example**:


    <jsp:setProperty name =”savAcc” name=”accountNo” />


    The **jsp:getProperty** action tag returns the value of the property **accountNo**.


    The following are the attributes of the **setProperty** tag:


    *   **name**: Specifies a name for the bean.


    *   **property**: Specifies the property for which values are to be set. If set
    to “*”, it specifies that the set methods for all the specified values should
    be called.


    *   **Value**: Specifies an explicit value for the bean property.


    *   **Param**: Specifies the name of the request parameter to be used to set the
    value of the bean property.


    The following are the attributes of the **getProperty** tag:


    *   **Name**: Specifies the name of the bean.


    *   **Property**: Specifies the property that needs to be retrieved.


    **Example**: In the following example, we set and get the user name and password
    from the bean class:


    **index.jsp**:


    <html>


    <body>


        <form action="next.jsp" method="post">


            User Name:<input type="text" name="userName"><br>


            Password:<input type="password" name="password"><br>


         <input type="submit" />


         </form>


    </body>


    </html>


    **Bean class**:


    package IOL;


    public class NewClass implements java.io.Serializable


    {


        public String userName, password;


        public String getUserName()


           {


            return userName;


           }


        public void setUserName(String userName)


           {


    this.userName = userName;


           }


        public String getPassword()


           {


            return password;


           }


        public void setPassword(String password)


           {


    this.password = password;


            }


    }


    **next.jsp**:


    <html>


    <body>


      <jsp:useBean id="myBean" class="IOL.NewClass"></jsp:useBean>


      <jsp:setProperty property="*" name="myBean"/>


        Record:<br>


      User name=<jsp:getProperty property="userName" name="myBean"/><br>


      password=<jsp:getProperty property="password" name="myBean"/><br>


    <br>


    </body>


    </html>


    The following is the output of index.jsp, as shown in *[Figure 10.2:](#chap10.xhtml_fig10.2)*


    ![img](images/155a.png)


    ***Figure 10.2**: Output of index.jsp*


    The following is the output of next.jsp, as shown in *[Figure 10.3:](#chap10.xhtml_fig10.3)*


    ![img](images/155b.png)


    ***Figure 10.3**: Output of next.jsp*


    [**Jsp:forward action tag**](#toc.xhtml_aa152)


    This tag is used to forward the request to another page.


    **Syntax**:


    <jsp:forward page="relativeURL | <%= expression %>">


    <jsp:param name="parametername" value="parametervalue | <%=expression%>" /></jsp:forward>


    **page** is the attribute of the forward tag.


    **Example**:


    **Index.xhtml**:


    <html>


    <body>


    <form action="Next.jsp" method="post">


            User Name:<input type="text" name="userName"><br>


            Password:<input type="password" name="password"><br>


    <input type="submit" />


    </form>


    </body>


    </html>


    **Next.jsp:**


    <html>


      <body>


          <jsp:forward page="next2.jsp">


          <jsp:param name="date" value=" 17 January 2022"/>


          </jsp:forward>


      </body>


    </html>


    **Next2.jsp:**


    <html>


      <body>


    <h1> Record <br>


                User Name=<%= request.getParameter("userName") %><br>


                password = <%= request.getParameter("password") %><br>


                Date=<%= request.getParameter("date") %></h1>


         </body>


    </html>


    The following is the output of index.xhtml, as shown in *[Figure 10.4:](#chap10.xhtml_fig10.4)*


    ![img](images/157a.png)


    ***Figure 10.4**: Output of index.xhtml*


    The following is the output of next2.jsp, as shown in *[Figure 10.5:](#chap10.xhtml_fig10.5)*


    ![img](images/157b.png)


    ***Figure 10.5**: Output of Next2.jsp*


