    \n\nClass.forName (\"oracle.jdbc.driver.OracleDriver\")\nConnection con = DriverManager.\
    \ getConnection (url,\"system\",\"password\");\n```\n\n### Processing querying\
    \ in a database\n\nOnce a connection with the database is established, you can\
