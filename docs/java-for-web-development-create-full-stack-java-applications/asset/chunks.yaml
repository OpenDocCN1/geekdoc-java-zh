    [CHAPTER 9](#toc.xhtml_ch09)


    [**JSP Directives**](#toc.xhtml_ch09)


    A directive element in a JSP page provides global information about a particular
    page. It gives information to a Web Container while converting a JSP page into
    a corresponding servlet.


    [**Structure**](#toc.xhtml_aa124)


    In this chapter, we will cover the following topics:


    *   Page Directives


    *   Exception Handling via error page


    *   Include Directive


    *   Taglib Directive


    [**Objective**](#toc.xhtml_aa125)


    In this chapter, we will learn about the JSP Directives that are applied on a
    JSP Page. JSP Directives are used to define the variables and methods on a page.


    JSP Directives are used to specify general information about a particular page.


    [**Types Of Directives**](#toc.xhtml_aa126)


    The following are the types of directives:


    *   The page


    *   include


    *   taglib


    [**JSP directives**](#toc.xhtml_aa127)


    JSP directives are used to give messages to a web container about how to handle
    the client requests while converting a JSP page into servlet code.


    The syntax for adding a directive in a JSP page is as follows:


    <%@ directive type (attribute= “attribute value”) %>


    [**The page directive**](#toc.xhtml_aa128)


    The page directive defines the attributes that notify the servlet engine about
    the general settings of a JSP page. The page directive applies to the entire JSP
    page. The page directive has many attributes separated by commas as the key-value
    pairs. The attributes that can be specified for a page directive are listed in
    *[Table 9.1](#chap09.xhtml_tab9.1)*:


    | **S.No** | **Attribute** | **Used to Specify** |'
