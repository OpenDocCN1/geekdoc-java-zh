  trans: '


    Servlets 可用于开发各种 Web 应用程序。由于 Servlets 使用 Java 编写，它们可以使用 Java API 的强大功能，例如网络连接和
    URL 访问、多线程、数据库连接、国际化、`remote method invocation` (`RMI`) 以及对象序列化。Servlets 获得广泛认可的特性如下：


    * **Servlets 是高效的**：Servlet 的初始化代码仅在 Servlet 第一次执行时运行。随后，Servlet 的请求将由其 `service()`
    方法处理。这有助于通过避免创建不必要的进程来提高服务器的效率。

    * **Servlets 是健壮的**：Servlets 基于 Java；它们提供了 Java 的所有强大功能，如异常处理和垃圾回收，使它们非常健壮。

    * **Servlets 是可移植的**：由于 Servlets 用 Java 开发的，因此它们也具有移植性。这使得可以在不同的 Web 服务器之间轻松迁移。

    * **Servlets 是持久的**：Servlets 通过防止频繁的磁盘访问提高了系统性能。例如，如果客户登录 `www.EarnestOnline.com`，客户可以执行许多活动，如查询余额、申请贷款等。在每个阶段，客户都需要通过对比数据库中的账号来通过身份验证；Servlets
    无需每次都对比数据库检查账号，而是将账号保留在内存中，直到用户退出网站。


    ### Servlets 与 Applets 的比较


    Applets 是嵌入在 Web 页面中的 Java 程序。当打开包含 Applet 的 Web 页面时，applet 的字节码会被下载到客户端计算机。由于
    applet 的尺寸过大，这个过程变得非常耗时。由于 Servlets 在 Web 服务器上执行，它们有助于解决使用 applets 时面临的下载时间问题。与
    applets 不同，Servlets 不需要浏览器启用 Java 功能，因为它们在 Web 服务器上执行，并将结果返回给客户端或浏览器。Applet 是一项过时的技术。


    ### Servlets 与其他服务器端脚本技术的比较


    常见的网关接口 (`CGI`) 脚本、JSP 和 ASP 是 Servlets 的替代方案，它们各自有优缺点。


    #### CGI 脚本


    CGI 脚本是用 C、C++ 或 Perl 编写的程序。当服务器接收到客户端用于处理数据的请求时，CGI 脚本会在服务器上执行。服务器将请求传递给 CGI
    脚本。CGI 脚本处理请求并将以 HTML 形式的输出发送到服务器。服务器反过来将请求传递给客户端。


    使用 CGI 脚本的缺点如下：


    * 每当调用 CGI 脚本时，服务器都会为其创建一个单独进程。服务器对同时创建的进程数量有限制。如果请求数量过高，服务器将无法接受请求。此外，创建过多进程也会降低服务器的效率。

    * 编写 CGI 脚本最流行的平台是 Perl。尽管 Perl 是一种编写 CGI 应用程序非常强大的语言，但服务器需要为收到的每个请求加载 Perl 解释器。因此，对于每个传入的请求，需要加载
    CGI 脚本的可执行文件和 Perl 解释器，这会降低服务器的效率。


    与 CGI 脚本不同，Servlet 的初始化代码仅执行一次。在 Servlets 的情况下，每个请求都由 Web 服务器中的独立线程更高效地处理，避免了创建不必要的进程。


    #### Active Server Pages (ASP)


    ASP 是由微软开发的一种服务器端脚本语言。ASP 允许开发者在同一个 Web 页面上结合 HTML 和脚本语言。JavaScript 和 VBScript
    是 ASP 支持的两种脚本语言。通过 `<script runat=server>` 标签，VBScript 和 JavaScript 也可以用于服务器端脚本。ASP
    的局限性在于它不兼容所有的 Web 服务器。其他 Web 服务器需要安装特定的插件来支持 ASP。然而，添加插件可能会降低系统性能。


    ### Servlets 的工作原理


    客户端或浏览器使用 `GET` 或 `POST` 方法将请求传递给服务器。例如，可以通过点击用户界面组件（如表单上的按钮）或跟随 Web 页面上的链接来调用
    Servlet。Servlet 处理请求后，输出将以 HTML 页的形式返回给客户端。


    客户端请求由以下组件组成：


    * 服务器和客户端之间通信使用的协议，例如 `HTTP`。

    * 请求类型可以是 `GET` 或 `POST`。

    * 查询字符串包含附加信息，如登录名、密码和注册详情。


    **以下是一个示例**：`GET`


    ```

    http://www EarnestBank.com/login.xhtml?username="sarika"&passwd="3445H"

    ```


    前述 URL 用于显示用户名为 "Sarika" 的信箱。


    *[表 3.1]* 描述了 URL 的不同组件：


    | 组件 | 描述 |

    | :--- | :--- |

    | HTTP | 它是服务器和客户端之间通信的协议。 |

    | www.EarnestBank.com | 它是网站的。 |

    | login.xhtml | 它是显示给用户的表单名称。 |

    | Username="sarika"&passwd="3445H | 这些是传递给服务器端程序的值。 |


    ***表 3.1**: URL 的不同组件*


    ### GET 和 POST 方法


    当客户端向服务器发送请求时，客户端可以使用 `GET` 方法通过 URL 传递附加信息，以描述从服务器所需的确切输出。附加在 URL 后的额外字符序列称为
    `查询字符串`。然而，查询字符串的长度限制为 240 个字符。此外，查询字符串在浏览器上可见，因此存在安全风险。


    为了克服这些缺点，可以使用 `POST` 方法。在 `POST` 方法中，可以通过单独的套字连接发送大量数据。整个事务对客户端不可见。


    这种方法的缺点是比 `GET` 方法慢，因为数据是作为单独的数据包发送到服务器的。


    ### Javax.servlet 包


    Java 通过 `javax.servlet` 和 `javax.servlet.http` 包支持 Servlet 的实现。`javax.servlet`
    接口提供了创建 Servlet 的通用框架。Servlet 可以直接实现此接口，也可以通过扩展 `javax.servlet.GenericServlet`
    或 `Javax.Servlet.http.HttpServlet` 类来间接实现。


    '
- fmt: "\nThe `GenericServlet` class of the `javax.Servlet` package is used to create\
    \ Servlets that can work with any protocol. The `javax.Servlet.http` package is\
    \ used to create the HTTP Servlets that provide the output in the form of HTML\
    \ pages. The class that is used to create the HTTP Servlets is called `HttpServlet`\
    \ and is derived from the `GenericServlet` class. Serialization is also made possible\
    \ in Servlet and is derived from the `GenericServlet` class through the `serializable`\
    \ interface. Serialization is the process of writing an object into a persistent\
    \ storage medium, such as a hard disk. The hierarchies of the classes that are\
    \ used to create a Servlet are shown in `[Figure 3.1](#chap03.xhtml_fig3.1)`:\n\
    \n![img](images/59.png)\n\n**Figure 3.1**: The Servlet class Hierarchy\n\n`[Table\
    \ 3.2](#chap03.xhtml_tab3.2)` describes the classes and interfaces used for the\
    \ creation of Servlets:\n\n| Class/Interface Name | Description |\n| :--- | :---\
    \ |\n| `HttpServlet` class | Provides an HTTP-specific implementation of the Servlet\
    \ interface. This class extends the `GenericServlet` class that provides a framework\
    \ for handling the other types of network and web services. |\n| `HttpServletRequest`\
    \ Interface | It extends the `ServletRequest` interface to provide the methods\
    \ to process the requests from the clients. For example, assume that the client\
    \ browser consists of a form with two fields. When the values are submitted to\
    \ the server for processing, they are extracted using the methods in the `HttpServletRequest`\
    \ interface. |\n| `HttpServletResponse` interface | It extends the `ServletResponse`\
    \ interface to provide the methods to send a response. For example, it has methods\
    \ to access the HTTP headers and cookies. |\n\n**Table 3.2**: Classes and Interface\
    \ to create a Servlet\n\n### Lifecycle of a Servlet（#toc.xhtml_aa55)\n\nThe lifecycle\
    \ of a Servlet gives the states of Servlet. There are three states of Servlet\
    \ – new, ready, and end. The states of the servlets change with the help of the\
    \ calling of servlets method.\n\n### Servlet Interface（#toc.xhtml_aa56)\n\nThe\
    \ servlet interface provides a common functionality in all the Servlets. The servlet\
    \ interface defines the methods that all the Servlets must implement. `HttpServlet`\
    \ and `GenericServlet` implement servlet interface directly or indirectly. The\
    \ servlet interface provides three lifecycle methods used to implement any Servlet.\n\
    \nA Servlet is loaded only once in the memory and is initialized in the `init()`\
    \ method. After the Servlet is initialized, it starts accepting a request from\
    \ the client and processes them through the `service()` method until it is shut\
    \ down by the `destroy()` method. The `service()` method is executed for every\
    \ incoming request. The lifecycle of a Servlet is depicted as follows:\n\n1. Servlet\
    \ class is loaded.\n2. Servlet instance is created.\n3. The `init` method is invoked.\n\
    4. The `service` method is invoked.\n5. The `destroy` method is invoked.\n\nRefer\
    \ to `[Figure 3.2,#chap03.xhtml_fig3.2)` which illustrates the lifecycle of a\
    \ Servlet:\n\n![img](images/60.png)\n\n**Figure 3.2**: Lifecycle of a Servlet\n\
    \n`[Table 3.3](#chap03.xhtml_tab3.3)` describes the methods of the Servlet interface:\n\
    \n| S.No | Method name | Description |\n| :--- | :--- | :--- |\n| 1 | `public\
    \ void init(ServletConfig config) throws Servlet Exception` | It contains all\
    \ initialization codes for the Servlet and is invoked when the Servlet is first\
    \ loaded and created. |\n| 2 | `public void service(ServletRequest request,ServletResponse\
    \ response);` | It receives all the requests from clients, identifies the type\
    \ of requests, and dispatches them to the `doGet()` or `doPost()` methods for\
    \ processing. |\n| 3 | `public void destroy()` | It executes once when the Servlet\
    \ is removed from the server. The cleanup code for the Servlet must be provided\
    \ in this method. |\n| 4 | `public ServletConfig getServletConfig();` | It returns\
    \ the object of `ServletConfig`. |\n| 5 | `public String getServletInfo()` | It\
    \ returns the information about the Servlet, such as writer, copyright, version,\
    \ and so on. |\n\n**Table 3.3**: Methods of Servlet Interface\n\n### Creating\
    \ a Servlet（#toc.xhtml_aa57)\n\nAlong with three lifecycle methods(`init()`, `service()`\
    \ and `destroy()`), two more methods are also used to create a Servlet.\n\n`[Table\
    \ 3.4](#chap03.xhtml_tab3.4)` also describes two methods that are used in creating\
    \ a Servlet:\n\n| S.No | Method name | Description |\n| :--- | :--- | :--- |\n\
    | 1 | `ServletResponse.getWriter()` | It returns a reference to a `PrintWriter`\
    \ object. The `PrintWriter` class is used to write the formatted objects as a\
    \ text-output stream onto the client. |\n| 2 | `ServletResponse.setContentType(String\
    \ type)` | It sets the type of content sent as a response to the client browser.\
    \ For example, `setContentType(\"text/html\")` is used to set the response type\
    \ as text. |\n\n**Table 3.4**: Methods that are used in creating a Servlet along\
    \ with the life cycle method\n\n**The Servlet can be created in three of the following\
    \ ways:**\n\n* By implementing the `Servlet` interface\n* By inheriting `GenericServlet`\
    \ class\n* By inheriting `HttpServlet` class\n\n**1. The following is an example\
    \ of servlet created by implementing the:**\n\n```java\nimport java.io.*;\nimport\
    \ javax.servlet.*;\n\npublic class FirstServlet implements Servlet {\n    ServletConfig\
    \ config=null;\n\n    public void init(ServletConfig config) {\n        this.config=config;\n\
    \        System.out.println(\"Servlet is initialized\");\n    }\n\n    public\
    \ void service(ServletRequest req,ServletResponse res) throws IOException, ServletException\
    \ {\n        res.setContentType(\"text/html\");\n        PrintWriter out=res.getWriter();\n\
    \        out.print(\"<html><body>\");\n        out.print(\"<b>This is First Servlet</b>\"\
    );\n        out.print(\"</body></html>\");\n    }\n\n    public void destroy()\
    \ {\n        System.out.println(\"Servlet is destroyed\");\n    }\n\n    public\
    \ ServletConfig getServletConfig() {\n        return config;\n    }\n\n    public\
    \ String getServletInfo() {\n        return \"Institute of Learning- Advance First\
    \ Servlet via Servlet interface\";\n    }\n}\n```\n\n### Compile a Servlet\n\n\
    For compiling the Servlet, a JAR file is required to be loaded. Different servers\
    \ need different jar files.\n\n`[Table 3.5](#chap03.xhtml_tab3.5)` provides the\
    \ list of different servers and JAR files:\n\n| Jar File | Server |\n| :--- |\
    \ :--- |\n| `javaee.jar` | Glassfish/JBoss |\n| `weblogic.jar` | Weblogic |\n\
    | `servlet-api.jar` | Apache Tomcat |\n\n**Table 3.5**: List of different servers\
    \ and JAR files\n\n### Creating the deployment descriptor (web.xml file（#toc.xhtml_aa58)\n\
    \nThe deployment descriptor is an XML file, from which the web container gets\
    \ the information about the Servlet to be invoked. The web container uses the\
    \ parser to get the information from the **web.xml** file. There are many XML\
    \ parsers such as SAX, DOM, and Pull. For a Servlet or an HTML page (that might\
    \ contain a link to a Servlet) to be accessible from the client, it has to first\
    \ be deployed on the webserver.\n\nNOTE: The load-on-startup element of Servlet\
    \ in web.xml is used to load the Servlet at the time of deploying the project\
    \ or the server to start. This saves time for the response of the first request.\
    \ If you pass the positive value, the lower integer value Servlet will be loaded\
    \ before the higher integer value Servlet. In other words, the container loads\
    \ the Servlets in the ascending order of the integer values. The 0 value will\
    \ be loaded first, then 1, 2, 3, and so on.\n\nThe description of the basic element\
    \ used in the **web.xml** file is as follows:\n\n* `<web-app>` represents the\
    \ whole application.\n* `<Servlet>` is a sub-element of `<web-app>` and represents\
    \ the Servlet.\n* `<Servlet-name>` is a sub-element of `<Servlet>` and represents\
    \ the name of the Servlet.\n"
  raw: 'The **GenericServlet** class of the **javax.Servlet** package is used to create
    Servlets that can work with any protocol. The **javax.Servlet.http** package is
    used to create the HTTP Servlets that provide the output in the form of HTML pages.
    The class that is used to create the HTTP Servlets is called **HttpServlet** and
    is derived from the **GenericServlet** class. Serialization is also made possible
    in Servlet and is derived from the **GenericServlet** class through the serializable
    interface. Serialization is the process of writing an object into a persistent
    storage medium, such as a hard disk. The hierarchies of the classes that are used
    to create a Servlet are shown in *[Figure 3.1](#chap03.xhtml_fig3.1)*:


    ![img](images/59.png)


    ***Figure 3.1**: The Servlet class Hierarchy*


    *[Table 3.2](#chap03.xhtml_tab3.2)* describes the classes and interfaces used
    for the creation of Servlets:


    | **Class/Interface Name** | **Description** |


    | **HttpServlet** class | Provides an HTTP-specific implementation of the Servlet
    interface. This class extends the GenericServlet class that provides a framework
    for handling the other types of network and web services. |


    | **HttpServletRequest** Interface | It extends the ServletRequest interface to
    provide the methods to process the requests from the clients. For example, assume
    that the client browser consists of a form with two fields. When the values are
    submitted to the server for processing, they are extracted using the methods in
    the HttpServletRequest interface. |


    | **HttpServletResponse** interface | It extends the ServletResponse interface
    to provide the methods to send a response. For example, it has methods to access
    the HTTP headers and cookies. |


    ***Table 3.2**: Classes and Interface to create a Servlet*


    [**Lifecycle of a Servlet**](#toc.xhtml_aa55)


    The lifecycle of a Servlet gives the states of Servlet. There are three states
    of Servlet – new, ready, and end. The states of the servlets change with the help
    of the calling of servlets method.


    [**Servlet Interface**](#toc.xhtml_aa56)


    The servlet interface provides a common functionality in all the Servlets. The
    servlet interface defines the methods that all the Servlets must implement. HttpServlet
    and GenericServlet implement servlet interface directly or indirectly. The servlet
    interface provides three lifecycle methods used to implement any Servlet.


    A Servlet is loaded only once in the memory and is initialized in the **init()**
    method. After the Servlet is initialized, it starts accepting a request from the
    client and processes them through the **service()** method until it is shut down
    by the **destroy()** method. The **service()** method is executed for every incoming
    request. The lifecycle of a Servlet is depicted as follows:


         1.  Servlet class is loaded.


         2.  Servlet instance is created.


         3.  The init method is invoked.


         4.  The service method is invoked.


         5.  The destroy method is invoked.


    Refer to *[Figure 3.2,](#chap03.xhtml_fig3.2)* which illustrates the lifecycle
    of a Servlet:


    ![img](images/60.png)


    ***Figure 3.2**: Lifecycle of a Servlet*


    *[Table 3.3](#chap03.xhtml_tab3.3)* describes the methods of the Servlet interface:


    | **S.No** | **Method name** | **Description** |


    | 1 | public void init​(ServletConfig config) throws Servlet Exception | It contains
    all initialization codes for the Servlet and is invoked when the Servlet is first
    loaded and created. |


    | 2 | public void service​(ServletRequest request,​ServletResponse response);
    | It receives all the requests from clients, identifies the type of requests,
    and dispatches them to the doGet() or doPost() methods for processing. |


    | 3 | public void destroy() | It executes once when the Servlet is removed from
    the server. The cleanup code for the Servlet must be provided in this method.
    |


    | 4 | public ServletConfig getServletConfig(); | It returns the object of ServletConfig.
    |


    | 5 | public String getServletInfo() | It returns the information about the Servlet,
    such as writer, copyright, version, and so on. |


    ***Table 3.3**: Methods of Servlet Interface*


    [**Creating a Servlet**](#toc.xhtml_aa57)


    Along with three lifecycle methods(int(),service() and destroy() ), two more methods
    are also used to create a Servlet.


    *[Table 3.4](#chap03.xhtml_tab3.4)* also describes two methods that are used in
    creating a Servlet:


    | **S.No** | **Method name** | **Description** |


    | 1 | ServletResponse. getWriter () | It returns a reference to a PrintWriter
    object. The PrintWriter class is used to write the formatted objects as a text-output
    stream onto the client. |


    | 2 | ServletResponse.​setContentType (String type) | It sets the type of content
    sent as a response to the client browser. For example, SetContentType (“text/html”)
    is used to set the response type as text. |


    ***Table 3.4**: Methods that are used in creating a Servlet along with the life
    cycle method*


    **The Servlet can be created in three of the following ways:**


    *   By implementing the **Servlet** interface


    *   By inheriting **GenericServlet** class


    *   By inheriting **HttpServlet** class


         **1.  The following is an example of a servlet created by implementing the
    Servlet Interface**:


          import java.io.*;


          import javax.Servlet.*;


          public class FirstServlet implements Servlet{


          ServletConfig config=null;


          public void init(ServletConfig config)


          {


          this.config=config;


          System.out.println("Servlet is initialized");


          }


          public void service(ServletRequest req,ServletResponse res)


          throws IOException,ServletException


          {


          res.setContentType("text/html");


          PrintWriter out=res.getWriter();


          out.print("<html><body>");


          out.print("<b>This is First Servlet through Servlet Interface</b>");


          out.print("</body></html>");


          }


          public void destroy()


          {


          System.out.println("Servlet is destroyed");


          }


          public ServletConfig getServletConfig()


          {    return config;


          }


          public String getServletInfo()


          {


             return "Institute of Learning- Advance Java First Servlet via Servlet
    interface";


          }


          }


    **Compile a Servlet**


    For compiling the Servlet, a JAR file is required to be loaded. Different servers
    need different jar files.


    *[Table 3.5](#chap03.xhtml_tab3.5)* provides the list of different servers and
    JAR files:


    | **Jar File** | **Server** |


    | javaee.jar | Glassfish/JBoss |


    | weblogic.jar | Weblogic |


    | servlet-api.jar | Apache Tomcat |


    ***Table 3.5**: List of different servers and JAR files*


    [**Creating the deployment descriptor (web.xml file)**](#toc.xhtml_aa58)


    The deployment descriptor is an XML file, from which the web container gets the
    information about the Servlet to be invoked. The web container uses the parser
    to get the information from the **web.xml** file. There are many XML parsers such
    as SAX, DOM, and Pull. For a Servlet or an HTML page (that might contain a link
    to a Servlet) to be accessible from the client, it has to first be deployed on
    the webserver.


    | **NOTE: The load-on-startup element of Servlet in web.xml is used to load the
    Servlet at the time of deploying the project or the server to start. This saves
    time for the response of the first request. If you pass the positive value, the
    lower integer value Servlet will be loaded before the higher integer value Servlet.
    In other words, the container loads the Servlets in the ascending order of the
    integer values. The 0 value will be loaded first, then 1, 2, 3, and so on.** |


    The description of the basic element used in the **web.xml** file is as follows:


    *   **<web-app>** represents the whole application.


    *   **<Servlet>** is a sub-element of **<web-app>** and represents the Servlet.


    *   **<Servlet-name>** is a sub-element of **<Servlet>** and represents the name
    of the Servlet.'
