    [**Conclusion**](#toc.xhtml_aa59)


    In this chapter, you learned that Servlets are server-side Java programs that
    can be deployed on a web server. The Servlet interface provides the basic framework
    for coding the Servlets. Servlets are portable, extensible, persistent, and robust.
    The lifecycle of a Servlet is composed of the **init()**, **service()**, and **destroy()**
    methods. Servlets can be deployed in Glassfish, Weblogic, and Apache Tomcat.


    In the next chapter, you will learn about **HTTPServlet**. HTTP is a web-specific
    protocol and has rules for the conversation between the browser requests and the
    webserver responses. HTTP adds the header information to the top of whatever content
    is in the response sent by the server. The browser uses that header information
    to help process the HTML page. **HTTPServlet** provides a framework for handling
    the HTTP protocol, whereas **GenericServlet** is protocol-independent.


    [**Questions**](#toc.xhtml_aa60)


         1.  What is different between the web server and the application server?


         2.  What are the advantages of Servlets over CGI?


