  trans: "\n\n它用于将文件内容插入到特定的 JSP 文件中。该文件可以是 JSP、HTML 或 servlet。文件包含发生在 JSP 页面请求时。\n\
    \n以下是各个属性：\n\n- `page`：指定要包含的页面的相对 URL。\n- `flush`：指定是否刷新缓冲区。在声明 include 动作时，必须包含一个强制性的布尔属性。\n\
    \n### 语法\n\n```jsp\n<jsp:include page=\"relativeURL | <%= expression %>\">  <jsp:param\
    \ name=\"parametername\" value=\"parametervalue | <%=expression%>\" />  </jsp:include>\n\
    ```\n\n### 示例\n\n**printdate.jsp**\n\n```jsp\n<% out.print(\"Today is:\"+java.util.Calendar.getInstance().getTime());\
    \ %>\n```\n\n**Index.jsp**\n\n```html\n<html>\n  <body>\n    <h2>this is index\
    \ page</h2>\n    <jsp:include page=\"printdate.jsp\" />\n    <h2>end section of\
    \ index page</h2>\n  </body>\n</html>\n```\n\n### 示例\n\n在接下来的示例中，用户在 JSP 页面上输入账号和密码。如果数据库中存在该账号和密码，则用户通过验证；否则将生成错误消息，如下所示：\n\
    \n**Index.jsp**\n\n```html\n<html>\n  <body>\n    <form method=\"post\" action=\"\
    usebean.jsp\">\n      <table border=\"0\" cellspacing=\"1\" cellpadding=\"5\"\
    >\n        <tr>\n          <td width=\"100\">&nbsp;</td>\n          <td align=\"\
    right\">\n            <h1>\n              <font color=\"red\">\n             \
    \ Welcome to Famous bank</font>\n            </h1>\n          </td>\n        </tr>\n\
    \        <tr>\n          <td width=\"100\" align=\"right\"><b>\n            <font\
    \ color=\"blue\">User ID</font>\n            </b>\n          </td>\n         \
    \ <td align=\"left\">\n            <input type=\"text\" name=\"userId\" size=\"\
    30\">\n          </td>\n        </tr>\n        <tr>\n          <td width=\"100\"\
    \ align=\"right\"><b>\n            <font color=\"blue\">Password</font>\n    \
    \        </b>\n          </td>\n          <td align=\"left\">\n            <input\
    \ type=\"password\" name=\"pwd\" size=\"30\">\n          </td>\n        </tr>\n\
    \        <tr>\n          <td width=\"100\" &nbsp;</td>\n          <td align=\"\
    right\"></td>\n        </tr>\n        <tr>\n          <td width=\"100\" &nbsp;</td>\n\
    \          <td align=\"left\">\n            <input type=\"submit\" value=\"submit\"\
    \ />\n          </td>\n        </tr>\n      </table>\n    </form>\n  </body>\n\
    </html>\n```\n\n**bean.jsp**\n\n```html\n<html>\n  <head>\n    <meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=UTF-8\">\n    <title>JSP Page</title>\n\
    \  </head>\n  <body>\n    <jsp:useBean id=\"BA\" scope=\"application\" class=\"\
    IOL.MyBank\"/>\n    <jsp:setProperty name=\"BA\" property=\"\"/>\n    <%\n   \
    \   String userid=BA.getUserId();\n      String pwd=BA.getPwd();\n      boolean\
    \ valid=BA.validate();\n      if(valid == true)\n        out.println(\"The user\
    \ is valid\");\n      else\n        out.println(\"The user is not valid\");\n\
    \    %>\n  </body>\n</html>\n```\n\n**MyBank.java**\n\n```java\npackage IOL;\n\
    import java.sql.*;\npublic class MyBank {\n  private String userId,pwd;\n  public\
    \ Connection con;\n  public String getUserId() {\n    return userId;\n  }\n\n\
    \  public void setUserId(String userId) {\n    this.userId = userId;\n  }\n\n\
    \  public String getPwd() {\n    return pwd;\n  }\n\n  public void setPwd(String\
    \ pwd) {\n    this.pwd = pwd;\n  }\n\n  public MyBank()throws ClassNotFoundException,SQLException\
    \ {\n    Class.forName(\"com.mysql.cj.jdbc.Driver\");\n    con=DriverManager.getConnection(\"\
    jdbc:mysql://localhost:3306/MyBank\",\"root\",\"sailboat\");\n  }\n\n  public\
    \ boolean validate() {\n    String ppwd=\"\";\n    boolean valid=false;\n    try\
    \ {\n      userId=getUserId();\n      pwd=getPwd();\n      String strQuery=\"\
    select * from login where userid='\"+userId+\"'\";\n      Statement stat=con.createStatement();\n\
    \      ResultSet result=stat.executeQuery(strQuery);\n      System.out.println(result.next());\n\
    \      while(result.next()) {\n        ppwd=result.getString(1);\n        System.out.println(ppwd);\n\
    \      }\n      ppwd.trim();\n      pwd.trim();\n      if(ppwd.equals(pwd))\n\
    \        valid=true;\n    } catch(Exception e){}\n    return valid;\n  }\n}\n\
    ```\n\n### 总结\n\n以下是 `index.jsp` 的输出，如图 10.6 所示。\n\n以下是 `bean.jsp` 的输出，如图 10.7\
    \ 所示。\n\n`JSP 自定义标签`是用户定义的标签，可以封装表现逻辑和业务逻辑。JSP 在表现层与业务逻辑分离方面的贡献从功能上将设计人员从复杂的编程中解放出来。在很多情况下，代码结构使得某些部分是重复的并且需要重写。库的自定义标签为程序员提供了一种机制来封装重复性任务。一旦封装，这些代码就可以以更简单的形式重用。标签库由一组功能相关的自定义标签（称为自定义标签）组成。\n\
    \n由于 JSP `useBean` 元素促进了现有 bean 的重用，自定义库中的标签可以缩短应用程序开发周期并提高生产力。JSP 1.0 不支持标签库。然而，JSP\
    \ 1.1 支持在 JSP 文件中包含用户创建的标签。JSP 中自定义标签的结构与 `XML` 标签相似。\n\n### XML 的需求\n\n`可扩展标记语言`（`XML`）用于\
    \ Web 应用程序创建自定义或用户定义的标签。`XML` 标签与 `HTML` 标签无，因为它允许用户与浏览器之间的交互。考虑到 `HTML` 的支持，为什么需要新的标记语言？考虑一个显示账户持有人数据的\
    \ `HTML` 代码。显示这些数据的 `HTML` 代码如下：\n\n```html\n<html>\n<<body>\n  <table align=\"\
    center\">\n    <tr>\n      <td>Ms Anne Brown</td>\n    </tr>\n    <tr>\n     \
    \ <td>9, Sunley House, Gunthorpe Street</td>\n    </tr>\n    <tr>\n      <td>London\
    \ E1-7RW</td>\n    </tr>\n  </table>\n</body>\n</html>\n```\n\n以表现层为中心的 `HTML`\
    \ 输出如下：\n\nMs Anne Brown\n9, Sunley House, Gunthorpe Street\nLondon E1-7RW\n\n\
    `HTML` 代码的输出是以表现层为中心的，看起来就像任何文本数据。然而，在呈现账户持人的姓名和姓的数据上没有区分。也就是说，通过使用预定义的 `HTML`\
    \ 标签丢失了数据类型信息。\n\n相反，考虑使用自定义标签（用户定义）用 `XML` 编写的相同示例，如下：\n\n```xml\n<CUSTOMERDETAILS>\n\
    \  <NAME>\n    <TITLE>Ms</TITLE>\n    <FIRSTNAME>Anne</FIRSTNAME>\n    <LASTNAME>Brown</LASTNAME>\n\
    \  </NAME>\n  <ADDRESS>\n    <APTNAME>9, Sunley House</APTNAME>\n    <STREETNAME>Gunthorpe\
    \ Street</STREETNAME>\n    <COUNTRY>London</COUNTRY>\n    <ZIP>E1 – 7RW</ZIP>\n\
    \  </ADDRESS>\n</CUSTOMERDETAILS>\n```\n\n上述代码在 `XML` 中的重写如下：\n\n```xml\n<xml>\n\
    \  <CUSTOMERDETAILS>\n    <NAME>\n      <TITLE>Ms</TITLE>\n      <FIRSTNAME>Anne</FIRSTNAME>\n\
    \      <LASTNAME>Brown</LASTNAME>\n    </NAME>\n    <ADDRESS>\n      <APTNAME>9,\
    \ Sunley House</APTNAME>\n      <STREETNAME>Gunthorpe Street</STREETNAME>\n  \
    \    <COUNTRY>London</COUNTRY>\n      <ZIP>E1 – 7RW</ZIP>\n    </ADDRESS>\n  </CUSTOMERDETAILS>\n\
    </xml>\n```\n\n"
- fmt: "\n</CUSTOMERDETAILS>\n\nNeedless to say, in the output of the XML code, the\
    \ definition of the account holder’s details is presented in a format with emphasis\
    \ on the type of data. This is achieved by the use of specific custom tags such\
    \ as `Firstname`, `Lastname`, `street`, and `zip`. The use of these tags makes\
    \ it easier to differentiate the data. For example, the text enclosed within the\
    \ `<COUNTRY>AND</COUNTRY>` tags define the country to which the account holder\
    \ belongs. Although the presentation of this data is similar to that written in\
    \ HTML, the code of XML is more data-centric.\n\n### Advantages of using XML\n\
    \nThe advantages of using XML are as follows:\n\n- **Easy coding**: Being similar\
    \ to HTML, XML is easy to code, except for the inclusion of custom tags.\n- **Easy\
    \ data interchange**: Translating an XML document is easy due to explicit custom\
    \ tags. Therefore, the data can be exchanged at different levels without decoding\
    \ or interpreting its structure.\n- **Easy business communication**: The data\
    \ can be exchanged between organizations without the need to understand the intricacies\
    \ of the counterpart’s business, system organization, or structuring. However,\
    \ there needs to be a common understanding of the tags used in the data.\n\nThe\
    \ detailed rules and specifications followed in the XML code are written in the\
    \ `Document Type Definition` (`DTD`). The `DTD` defines the tags, tag structures,\
    \ attributes, and values that are used in a particular document.\n\n### Custom\
    \ Tags\n\nJSP 1.1 supports the creation of custom tags that enable the segregation\
    \ of business complexities to form the content presentation. The structure of\
    \ a custom tag in JSP, like those in XML and HTML, contains the start tags, end\
    \ tags, and a body. The structure of a custom tag can thus be represented as follows:\n\
    \n**Syntax**:\n\n```\n<start tag>\n    Body\n</end tag>\n```\n\nDepending upon\
    \ the presence or absence of the tag body, the custom tags can be categorized\
    \ as body tags or empty tags. In addition to this, the custom tags can also be\
    \ nested or include attributes. A nested tag contains tags of various levels.\
    \ A tag with an attribute uses the attribute parameters to customize the tag behavior.\n\
    \nThe attributes of a custom tag are listed as follows:\n\n- **name**: It is used\
    \ to specify the name used within the tag.\n- **required**: It is used to specify\
    \ the tag requirement. The values accepted by this attribute are true, false,\
    \ yes, or no.\n\n### Advantages of using Custom Tags\n\nScriptlets and custom\
    \ tags encapsulate the Java code snippets, and are hence, functionally quite similar.\
    \ However, by providing better packaging functionalities, the custom tags productively\
    \ contribute towards segregating the work profiles of the Web designers and developers.\
    \ The advantages of using custom tags are as follows:\n\n- **Reduction of scriptlets\
    \ in the code**: The attributes of a custom tag can be used to accept the parameters.\
    \ Therefore, the inclusion of the declarations (to define the variables) and scriptlets\
    \ (to set the properties of the Java components) can be avoided or reduced.\n\
    - **Reusability**: Contrary to scriptlets that are non-reusable Java code snippets,\
    \ the custom tags can be reused. This enables saving the time spent in the development\
    \ and deployment of codes.\n\n### Components of a Tag Library\n\nA JSP file use\
    \ custom tags that consists of the following:\n\n- **Tag handler**: Tag Handler\
    \ is used to define custom tags. The tag handler uses different methods and objects\
    \ to define the behavior of the tag.\n- **Tag Library Descriptor (TLD) file**:\
    \ The `TLD` file is an XML file that contains a descriptive list of the custom\
    \ tags.\n\nThe JSP file contains a tag along with the HTML code for the presentation\
    \ content. Considering this structure, it is evident that the developer is responsible\
    \ for coding the tag handler and the `TLD` file.\n\nThe web designer codes for\
    \ the static display content of the web page and the custom tag is then added\
    \ to the JSP file. Thus, the custom tag feature of JSP enhances the productivity\
    \ of the quality web applications by separating the work profiles of the web designer\
    \ and developer.\n\n### Steps to use tags in a JSP file\n\n1. Create a tag handler\
    \ containing the `Tag` and `BodyTag` interfaces. The tag handler file should define\
    \ the tasks to be performed by the tags.\n2. Map the tags and the tag handler\
    \ file by using the `TLD` file. The `TLD` file should define the inputs to the\
    \ tag handler.\n\nThe JSP file should include the `taglib` directive specifying\
    \ the use of tags and the definition of the tag.\n\nFor creating any custom tag,\
    \ we need to complete the following steps:\n\n- Create the Tag handler class and\
    \ perform an action at the start or the end of the tag.\n- Create the `Tag Library\
    \ Descriptor` (`TLD`) file and define the tags.\n- Create the JSP file that uses\
    \ the Custom tag defined in the `TLD` file.\n\n### Structure of Tag Handler\n\n\
    The Tag Handler is used to define the working of the custom tags. The class file\
    \ derives its methods from the `javax.servlet.tagext` package and implements the\
    \ `TagSupport` or the `BodyTag` Support interfaces. The `javax.servlet.jsp.tagext`\
    \ package contains classes and interfaces for the JSP custom tag API. The `JspTag`\
    \ is the root interface in the Custom Tag hierarchy. [Figure 10.8] shows the hierarchy\
    \ of the JSP tag; the JSP Tag interface is a marker interface, therefore, it does\
    \ not have any method:\n\n![img](images/168.png)\n\n**Figure 10.8**: Hierarchy\
    \ of JSP tag\n\nThe `TagSupport` interface is implemented for tags with an empty\
    \ body, and the `BodyTagSupport` interfaces are implemented for tags that use\
    \ a body. The tag handler definition can also include classes from other packages,\
    \ such as `javax.servlet.jsp`, and `java.io`. It is, therefore, essential to add\
    \ the corresponding import statements for the tag implementations.\n\nThe structure\
    \ of the tag handler can be categorized as that for a basic tag, a tag with attributes,\
    \ and a tag with a body. Therefore, the methods to be implemented in the tag handler\
    \ will depend upon the structure of the tag, as listed in [Table 10.3]:\n\n| Structure\
    \ of the Tag Handler | Methods to be implemented |\n| :--- | :--- |\n| Simple\
    \ Tag with no body and no attributes | `doStartTag()`, `doEndTag()`, and `release`\
    \ |\n| Tag with attributes | `doStartTag()`, `doEndTag()`, and the respective\
    \ `setAttribute()` and `getAttribute()` methods for each of the tags defined.\
    \ |\n\n**Table 10.3**: Method to be implemented in the Tag Handler class\n\nThe\
    \ functionality of the tag library is defined using the methods from the abstract\
    \ class `tag`. Some methods of the tag class and their return type are listed\
    \ in Table 10.4, Table 10.5, and [Table 10.6]:\n\n| S.No | Method | Description\
    \ |\n| :--- | :--- | :--- |\n| 1 | `public int doStartTag()` | Initializes the\
    \ tag handler and establishes connectivity with a database, if required. |\n|\
    \ 2 | `public int doEndTag()` | Performs post-tag tasks such as writing the output\
    \ and closing the database connection. |\n| 3. | `public void release()` | Removes\
    \ the instance of the tag handler. |\n| 4 | `public int doAfterBody()` | It is\
    \ invoked after the completion of the evaluation of the body tag. |\n| 5. | `public\
    \ int doBeforeTag()` | It is invoked before the evaluation of the Body Tag. |\n\
    | 6 | `Public void setPageContext (PageContext pc)` | It sets the given PageContext\
    \ object. |\n| 7 | `public Tag getParent()` | It sets the parent of the tag handler.\
    \ |\n\n**Table 10.4**: Methods of the Tag Interface\n\n| S.No | Field | Description\
    \ |\n| :--- | :--- | :--- |\n| 1 | `public static int SKIP_BODY` | Used in empty\
    \ tags to direct the JSP engine to skip the body of the tag and subsequently invoke\
    \ the next method, `doEndTag()`. |\n| 2 | `public static int EVAL_BODY_INCLUDE`\
    \ | Used to direct the JSP engine to process the body content of a Tag. This method\
    \ is used only if the interface is implemented as javax.servlet.tagext.Tag. |\n"
  raw: '</CUSTOMERDETAILS>


    Needless to say, in the output of the XML code, the definition of the account
    holder’s details is presented in a format with emphasis on the type of data. This
    is achieved by the use of specific custom tags such as Firstname, Lastname, street,
    and zip. The use of these tags makes it easier to differentiate the data. For
    example, the text enclosed within the <COUNTRY>AND</COUNTRY> tags define the country
    to which the account holder belongs. Although the presentation of this data is
    similar to that written in HTML, the code of XML is more data-centric.


    The advantages of using XML are as follows:


    *   **Easy coding**: Being similar to HTML, XML is easy to code, except for the
    inclusion of custom tags.


    *   **Easy data interchange**: Translating an XML document is easy due to explicit
    custom tags. Therefore, the data can be exchanged at different levels without
    decoding or interpreting its structure.


    *   **Easy business communication**: The data can be exchanged between organizations
    without the need to understand the intricacies of the counterpart’s business,
    system organization, or structuring. However, there needs to be a common understanding
    of the tags used in the data.


    The detailed rules and specifications followed in the XML code are written in
    the **Document Type Definition** (**DTD**). The DTD defines the tags, tag structures,
    attributes, and values that are used in a particular document.


    [**Custom Tags**](#toc.xhtml_aa157)


    JSP 1.1 supports the creation of custom tags that enable the segregation of business
    complexities to form the content presentation. The structure of a custom tag in
    JSP, like those in XML and HTML, contains the start tags, end tags, and a body.
    The structure of a custom tag can thus be represented as follows:


    **Syntax**:


    <start tag>


         Body


    </end tag>


    Depending upon the presence or absence of the tag body, the custom tags can be
    categorized as body tags or empty tags. In addition to this, the custom tags can
    also be nested or include attributes. A nested tag contains tags of various levels.
    A tag with an attribute uses the attribute parameters to customize the tag behavior.


    The attributes of a custom tag are listed as follows:


    *   **name**: It is used to specify the name used within the tag.


    *   **required**: It is used to specify the tag requirement. The values accepted
    by this attribute are true, false, yes, or no.


    **Advantages of using Custom Tags**


    Scriptlets and custom tags encapsulate the Java code snippets, and are hence,
    functionally quite similar. However, by providing better packaging functionalities,
    the custom tags productively contribute towards segregating the work profiles
    of the Web designers and developers. The advantages of using custom tags are as
    follows:


    *   **Reduction of scriptlets in the code**: The attributes of a custom tag can
    be used to accept the parameters. Therefore, the inclusion of the declarations
    (to define the variables) and scriptlets (to set the properties of the Java components)
    can be avoided or reduced.


    *   **Reusability**: Contrary to scriptlets that are non-reusable Java code snippets,
    the custom tags can be reused. This enables saving the time spent in the development
    and deployment of codes.


    **Components of a Tag Library**


    A JSP file use custom tags that consists of the following:


    *   **Tag handler**: Tag Handler is used to define custom tags. The tag handler
    uses different methods and objects to define the behavior of the tag


    *   **Tag Library Descriptor (TLD) file**: The TLD file is an XML file that contains
    a descriptive list of the custom tags.


    The JSP file contains a tag along with the HTML code for the presentation content.
    Considering this structure, it is evident that the developer is responsible for
    coding the tag handler and the TLD file.


    The web designer codes for the static display content of the web page and the
    custom tag is then added to the JSP file. Thus, the custom tag feature of JSP
    enhances the productivity of the quality web applications by separating the work
    profiles of the web designer and developer.


    **The following are the steps to use tags in a JSP file**:


    *   Create a tag handler containing the Tag and BodyTag interfaces. The tag handler
    file should define the tasks to be performed by the tags.


    *   Map the tags and the tag handler file by using the TLD file. The TLD file
    should define the inputs to the tag handler.


    The JSP file should include the **taglib** directive specifying the use of tags
    and the definition of the tag.


    For creating any custom tag, we need to complete the following steps:


    *   Create the Tag handler class and perform an action at the start or the end
    of the tag.


    *   Create the **Tag Library Descriptor** (**TLD**) file and define the tags.


    *   Create the JSP file that uses the Custom tag defined in the TLD file.


    **The structure of Tag Handler**


    The Tag Handler is used to define the working of the custom tags. The class file
    derives its methods from the **javax.servlet.tagext** package and implements the
    **TagSupport** or the **BodyTag** Support interfaces. The **javax.servlet.jsp.tagext**
    package contains classes and interfaces for the JSP custom tag API. The **JspTag**
    is the root interface in the Custom Tag hierarchy. *[Figure 10.8](#chap10.xhtml_fig10.8)*
    shows the hierarchy of the JSP tag; the JSP Tag interface is a marker interface,
    therefore, it does not have any method:


    ![img](images/168.png)


    ***Figure 10.8**: Hierarchy of JSP tag*


    The **TagSupport** interface is implemented for tags with an empty body, and the
    **BodyTagSupport** interfaces are implemented for tags that use a body. The tag
    handler definition can also include classes from other packages, such as **javax.servlet.jsp**,
    and java.io. It is, therefore, essential to add the corresponding import statements
    for the tag implementations.


    The structure of the tag handler can be categorized as that for a basic tag, a
    tag with attributes, and a tag with a body. Therefore, the methods to be implemented
    in the tag handler will depend upon the structure of the tag, as listed in *[Table
    10.3](#chap10.xhtml_tab10.3)*:


    | **Structure of the Tag Handler** | **Methods to be implemented** |


    | Simple Tag with no body and no attributes | doStartTag(), doEndTag(), and release
    |


    | Tag with attributes | doStartTag(), doEndTag(), and the respective setAttribute()
    and getAttribute() methods for each of the tags defined. |


    ***Table 10.3**: Method to be implemented in the Tag Handler class*


    The functionality of the tag library is defined using the methods from the abstract
    class tag. Some methods of the tag class and their return type are listed in *Table
    10.4, Table 10.5,* and *[Table 10.6](#chap10.xhtml_tab10.6)*:


    | **S.No** | **Method** | **Description** |


    | 1 | **public int doStartTag()** | Initializes the tag handler and establishes
    connectivity with a database, if required. |


    | 2 | **public int doEndTag()** | Performs post-tag tasks such as writing the
    output and closing the database connection. |


    | 3. | **public void release()** | Removes the instance of the tag handler. |


    | 4. | **public int doAfterBody()** | It is invoked after the completion of the
    evaluation of the body tag. |


    | 5. | **public int doBeforeTag()** | It is invoked before the evaluation of the
    Body Tag. |


    | 6 | **Public void setPageContext (PageContext pc)** | It sets the given PageContext
    object. |


    | 7 | **public Tag getParent()** | It sets the parent of the tag handler. |


    ***Table 10.4**: Methods of the Tag Interface*


    | **S.No** | **Field** | **Description** |


    | 1 | **public static int SKIP_BODY** | Used in empty tags to direct the JSP engine
    to skip the body of the tag and subsequently invoke the next method, doEndTag().
    |


    | 2 | **public static int EVAL_BODY_INCLUDE** | Used to direct the JSP engine
    to process the body content of a Tag. This method is used only if the interface
    is implemented as javax.servlet.tagext.Tag. |'
