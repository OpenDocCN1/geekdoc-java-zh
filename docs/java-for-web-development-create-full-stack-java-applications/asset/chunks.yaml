  trans: "\n\n| 1 | `contentType=”MIME type”` | 这是响应的 MIME 类型（多用途内部邮件扩展类型）。该属性的默认值为\
    \ `text/HTML`。 |\n| 2 | `extends “packagename.class\"` | 这是生成的 servlet 将继承的父类名。\
    \ |\n| 3 | `errorPage= “url”` | 这是用于处理异常的错误页 URL。 |\n| 4 | `isErrorPage= “False”`\
    \ | 如果某个特定的 JSP 页面可以作为另一个 JSP 页面的错误页。该属性的默认值为 `false`。 |\n| 5 | `import= “package\
    \ list\"` | 这些是特定 JSP 页面可用的包名。 |\n| 6 | `Language= “scripting language.”` | 这是编译\
    \ JSP 页面时使用的脚本语言。目前可选语言是 `Java`。 |\n| 7 | `Session= “true”` | 用于指定特定 JSP 页面会话数据的可用性。该属性的默认值为\
    \ `true`。 |\n| 8 | `Info` | 它设置 JSP 页面的信息，可以通过使用 `Servlet` 接口的 `getServletInfo()`\
    \ 方法来检索。 |\n| 9 | `Buffer` | 它设置以字节为单位的缓冲区大小，用于处理 JSP 页面生成的输出。缓冲区的默认大小为 `8KB`。\
    \ |\n| 10 | `isELIgnored` | 可以通过 `ELIgnored` 属性在 JSP 中忽略表达式语言 (`EL`）。默认情况下，它的值为\
    \ `false`，即默认启用表达式语言。 |\n| 11 | `isThreadSafe` | 它将 JSP 请求序列化。 |\n| 12 | `Autoflush`\
    \ | 它指定当缓冲区填充时是否自动刷新缓冲区输出，或者是否抛出异常来指示缓冲区溢出。 |\n| 13 | `PageEncoding` | 页面编码是文件编码的字符编码。\
    \ |\n\n***表 9.1: 隐式对象***\n\n## 隐式对象\n\n### contentType\n`contentType` 属性定义了响应的\
    \ MIME 类型。MIME 是一种规定不同系统之间交换消息时如何格式化的标准。MIME 消息可以包含不同类型的数据，如文本、图像、音频和视频。\n\n默认值为\
    \ `\"text/html\"`。\n\n**语法如下**：\n\n```jsp\n<%@page contentType=\"text/html\" pageEncoding=\"\
    UTF-8\"%>\n```\n\n### extends\n`extends` 属性扩展了 JSP 中的父类。必须指定生成的 servlet 将继承的父类名。\n\
    \n**语法如下**：\n```jsp\n<%@ page extends = \"package.ClassName\" %>\n```\n\n### errorPage\n\
    它用于处理异常。`errorPage` 属性用于定义错误页；如果当前页面发生异常，它将重定向到错误页。\n\n**语法如下**：\n```jsp\n<%@\
    \ page errorPage= “next.jsp” %>\n```\n\n### isErrorPage\n`isErrorPage` 属性用于声明当前页面为错误页。\n\
    \n**语法如下**：\n```jsp\n<%@ page isErrorPage=true %>\n```\n\n**示例**：在此示例中，`index.jsp`\
    \ 发生了 `Exception`，因为变量 `s` 指向空类型。异常在 `error.jsp` 页面中被处理。\n\n参考以下示例代码：\n\n**Index.jsp**:\n\
    ```jsp\n<%@page contentType=\"text/html\" pageEncoding=\"UTF-8\"%>\n<!DOCTYPE\
    \ html>\n<html\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html;\
    \ charset=UTF-8\">\n<title>JSP Page</title>\n</head>\n<body>\n<h> Welcome to the\
    \ is error page example </h1>\n<%@ page errorPage=\"error.jsp\" %>\n<%\n     \
    \ String s=null;\n      char j=s.charAt(0);\n      out.println(j);\n%>\n</body>\n\
    </html>\n```\n\n**error.jsp**:\n```jsp\n<%@page contentType=\"text/html\" pageEncoding=\"\
    UTF-8\"%>\n<!DOCTYPE html>\n<html\n<head>\n<meta http-equiv=\"Content-Type\" content=\"\
    text/html; charset=UTF-8\">\n<title>JSP Page</title>\n</head>\n<body>\n<h1> Welcome\
    \ to the error page </h1><br>\n<%@ page isErrorPage=\"true\" %>\n<%= exception\
    \ %>\n</body>\n</html>\n```\n\n以下是输出结果，如 [图 9.1] 所示。\n![img](img/140.png)\n***图\
    \ 9.1: 前述程序的输出***\n\n### import\n此属性导入接口和类。\n\n**语法如下**：\n```jsp\n<%@ page import=\
    \ “java.util.Date” %>\n```\n\n**示例**：此示例导入了 `java.util.Date` 并显示当前日期：\n```jsp\n\
    <%@page contentType=\"text/html\" pageEncoding=\"UTF-8\"%>\n<!DOCTYPE html>\n\
    <html\n<head>\n<meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    >\n<title>JSP Page</title>\n</head>\n<body>\n<%@ page import=\"java.util.Date\"\
    \ %>\n<h1>Today is: <%= Date() %></h1>\n</body>\n</html>\n```\n\n### Language\n\
    这指定编译 JSP 页面时使用的脚本语言。目前可选语言是 `Java`。\n\n**语法如下**：\n```jsp\n<%@ page language=\"\
    java\" %>\n```\n\n### Session\n用于指定特定 JSP 页面会话数据的可用性。该属性的默认值为 `true`。\n\n**语法如下**：\n\
    ```jsp\n<%@ page session=\"true\" %>\n```\n\n### Info\n它设置 JSP 页面的信息，可以通过使用 `Servlet`\
    \ 接口的 `getServletInfo()` 方法来检索。\n\n**语法如下**：\n```jsp\n<%@ page info=\"servlet\
    \ description\" %>\n```\n\n### Buffer\n设置以字节为单位的缓冲区大小，用于处理 JSP 页面生成的输出。缓冲区的默认大小为\
    \ `8KB`。\n\n**语法如下**：\n```jsp\n<%@ page buffer=\"8KB\" %>\n```\n\n### isELIgnored\n\
    此属性通过 JSP 2.0 引入的 `ELIgnored` 属性在 JSP 中禁用表达式语言 (`EL`)。它默认是用的。这意味着它的默认值为 `false`。\n\
    \n**语法如下**：\n```jsp\n<%@ page isELIgnored=\"true\" %>\n```\n\n### isThreadSafe\n\
    JSP 和 Servlet 默认都是多线程的，即 `isThreadSafe` 的值为 `true`。如果你想序列化客户端请求，必须将其设置为 `false`。在之前的序列化客户端请求完成之前，Web\
    \ 容器将不再接受任何后续请求。\n\n**语法如下**：\n```jsp\n<%@ page isThreadSafe=\"false\" %>\n```\n\
    \n### Autoflush\n此属性用于指定是否自动刷新缓冲区输出。默认值为 `true`，即当缓冲区满时会自动刷新。\n\n**语法如下**：\n```jsp\n\
    <%@ page autoFlush=\"true\" %>\n```\n\n"
- fmt: "\nThe `include` directive is used to specify the names of the files (in the\
    \ form of their relative URLs) to be inserted during the compilation of the JSP\
    \ page. The contents of the files so included become part of the JSP page. The\
    \ `include` directive can also be used to insert a part of the code that is common\
    \ to multiple pages, to avoid using a bean for each of the code instances separately.\
    \ The included file can be an HTML file, a text file, or a code written in the\
    \ Java programming language.\n\nFor example, the code line to include a header\
    \ `file(Instituteoflearning.xhtml)` for a JSP page containing the name and logo\
    \ of the institute can be written as follows:\n\n```jsp\n<%@ include=\"Instituteoflearning.xhtml\"\
    \ %>\n```\n\n### The following are the advantages\n- Reusability of code, useful\
    \ for including copyright information, scripting language files, or anything you\
    \ might want to reuse in the other applications.\n- Inserts the contents of another\
    \ file in the main JSP file, where the directive is located.\n\n### The following\
    \ is an example\n```html\n<body>\n  <%@ include file=\"instituteoflearning.xhtml\"\
    \ %>\n  <h6> Today Date and Time is </h6>\n  <%= java.util.Calendar.getInstance().getTime()\
    \ %>\n</body>\n</html>\n```\n\n### The Taglib directive\nThe JSP `taglib` directive\
    \ is used to define a tag library that defines many tags. A tag library consists\
    \ of a collection of functionality-related user-defined XML tags called `custom\
    \ tags`. Custom tags are described in further chapters. We use the `Tag Library\
    \ Descriptor` (`TLD`) file to define the tags.\n\n### The syntax is as follows\n\
    ```jsp\n<%@ taglib uri=\"uriofthetaglibrary\" prefix=\"prefixoftaglibrary\" %>\n\
    ```\n\n### Conclusion\nThe JSP directives are used to specify the general information\
    \ about a particular page. `page` directive defines the attributes that apply\
    \ to an entire JSP page such as `extends` to import class, `isThreadSafe` to define\
    \ if the JSP is thread-safe, `error-page` and `isErrorPage` to handle the exception,\
    \ and `session` to check if the session object is available or not.\n\nThe `include`\
    \ directive inserts the contents of another file in the main JSP file, where the\
    \ directives are located. The `Taglib` directive is used to define a tag library\
    \ that defines many tags.\n\nIn the next chapter, we will learn about JSP actions\
    \ such as `useBean`, `getProperty`, `setProperty`, and `forward` to perform tasks\
    \ such as inserting files, reusing beans, forwarding a user to another page, and\
    \ instantiating objects. We will also learn about a custom tag library that provides\
    \ a mechanism by which the programmer can encapsulate recurring code or tasks\
    \ and reuse them in multiple applications.\n\n### Questions\n1. **JSP handles\
    \ the runtime errors using _________________attribute in page directive.**\n \
    \  **Answer:** By `errorPage` and `isErrorPage` attributes\n\n2. **What are the\
    \ major attributes of page directives?**\n   **Answer:** `buffer`, `ContentType`,\
    \ `autoFlush`, `errorPage`, `isErrorPage`, `extends`, `isThreadSafe`, `language`,\
    \ `Session`, `import`, `info`, `isElIgnored`\n\n3. **The JSP Page is extensible.**\n\
    \   A. True\n   B. False\n   **Answer:** True\n\n4. **What is the page directive\
    \ used for?**\n   A. To instruct the translator about assigning values within\
    \ the JSP page it is contained within.\n   B. To instruct the translator about\
    \ the characteristics of the JSP page it is contained within.\n   C. To instruct\
    \ the translator about the files being used by this JSP page.\n   D. To instruct\
    \ the translator about the modules being used by this JSP page.\n   **Answer:**\
    \ A\n\n5. **Where do we place a page directive within a JSP page?**\n   A. At\
    \ the start\n   B. In the middle\n   C. At the end\n   D. Anywhere\n   **Answer:**\
    \ D\n\n6. **How many page directives are allowed within a JSP page?**\n   A. 1\n\
    \   B. 2\n   C. Multiple\n   **Answer:** C\n\n7. **How many page directive attributes\
    \ are there?**\n   **Answer:** 3\n\n8. **Using the page directive, what type of\
    \ files can we include in JSP?**\n   A. HTML\n   B. JSP\n   C. Neither\n   D.\
    \ Both\n   **Answer:** D\n\n9. **What are pages included using page directive\
    \ commonly referred to as?**\n   A. Components\n   B. Fragments\n   C. Modules\n\
    \   D. Parcels\n   **Answer:** A\n\n# CHAPTER 10 JSP Action Element and Custom\
    \ Tags\n\n### Introduction\nJSP actions are used to perform tasks such as inserting\
    \ files, reusing beans, forwarding a user to another page, and instantiating objects.\
    \ The custom tags provide a mechanism that the programmer can use to encapsulate\
    \ recurring code or tasks.\n\n### Structure\nIn this chapter, we will cover the\
    \ following topics:\n- JSP Action Elements\n- Custom Tags\n- Model view controller\
    \ (MVC) Architecture\n\n### Objectives\nAfter studying this chapter, you will\
    \ learn about the use of action tags, and also learn how to make your own tags,\
    \ use them in your application, and see how the Expression language simplifies\
    \ the accessibility of the data stored in the Java Bean component and other objects\
    \ like `request`, `session`, and `application`. In this chapter, you will also\
    \ learn about the MVC architecture that separates the business logic from presentation\
    \ logic.\n\n### JSP Action Tags\nJSP provides standard tags used to insert, remove,\
    \ and reuse beans, forward the users to another page and instantiate the objects.\n\
    \nThe syntax of the JSP action tag is as follows:\n```xml\n<jsp:action_name attribute=\"\
    attribute_value\"/>\n```\n\nThe various JSP actions are described in Table 10.1,\
    \ as follows:\n\n| S.No | JSP action | Usage | Attribute | Description |\n| :---\
    \ | :--- | :--- | :--- | :--- |\n| 1 | `<jsp:useBean>` | Used to find and load\
    \ an existing bean | `id` | Uniquely identifies the instances of the bean |\n\
    | | | | `class` | Specifies the class from which the bean objects are to be implemented\
    \ |\n| | | | `scope` | Specifies the bean's life in terms of a page, session,\
    \ or application |\n| | | | `beanName` | Specifies a referential name for the\
    \ bean. |\n| 2 | `<jsp:getProperty>` | Used to retrieve the property to the specified\
    \ bean and direct it as the output. The retrieved value is converted to a string\
    \ value before sending it as an output. | `name` | Specifies a name for the bean\
    \ |\n| | | | `property` | Specifies the property from which the values are to\
    \ be retrieved |\n| 3 | `<jsp:setProperty>` | Used to set the property of the\
    \ specified bean; to set the value of the bean property, either an explicit value\
    \ is specified, or the value is obtained from a request parameter. Corresponding\
    \ to the specified request property value, the set method in the bean is called\
    \ with the matching value. | `name` | Specifies the name of the bean |\n| | |\
    \ | `property` | Specifies the property for which the values are to be set. If\
    \ set to `*`, it specifies that the set methods for all the specified values should\
    \ be called. |\n| | | | `value` | Specifies an explicit value for the bean property\
    \ |\n| | | | `param` | Specifies the name of the request parameter to be used\
    \ to set the value of the bean property |\n| 4 | `<jsp:forward>` | Used to forward\
    \ a request to a different page | `page` | Specifies the relative URL of the target\
    \ page |\n| 5 | `<jsp:include>` | Used to insert a file into a particular JSP\
    \ page. The file inclusion takes place at the time of the request of the JSP page.\
    \ | `page` | Specifies the relative URL of the page to be included |\n| | | |\
    \ `flush` | Specify if the buffer is to be flushed. A mandatory Boolean attribute\
    \ must be included when declaring the included action. |\n"
  raw: 'The **include** directive is used to specify the names of the files (in the
    form of their relative URLs) to be inserted during the compilation of the JSP
    page. The contents of the files so included become part of the JSP page. The include
    directive can also be used to insert a part of the code that is common to multiple
    pages, to avoid using a bean for each of the code instances separately. The included
    file can be an HTML file, a text file, or a code written in the Java programming
    language.


    For example, the code line to include a header **fiile(Instituteoflearning.xhtml)**
    for a JSP page containing the name and logo of the institute can be written as
    follows:


    **<%@ include=”Instituteoflearning.xhtml” %>**


    **The following are the advantages**:


    *   Reusability of code, useful for including copyright information, scripting
    language files, or anything you might want to reuse in the other applications.


    *   Inserts the contents of another file in the main JSP file, where the directive
    is located.


    **The following is an example**:


    html>


    <body>


      <%@ include file=”instituteoflearning.xhtml" %>


      <h6> Today Date and Time is </h6>


    <%= java.util.Calendar.getInstance().getTime() %>


      </body>


    </html>


    [**The Taglib directive**](#toc.xhtml_aa143)


    The JSP **taglib** directive is used to define a tag library that defines many
    tags. A tag library consists of a collection of functionality-related user-defined
    XML tags called **custom tags**. Custom tags are described in further chapters.
    We use the **Tag Library Descriptor** (**TLD**) file to define the tags.


    **The syntax is as follows**:


    <%@ taglib uri="uriofthetaglibrary" prefix="prefixoftaglibrary" %>


    [**Conclusion**](#toc.xhtml_aa144)


    The JSP directives are used to specify the general information about a particular
    page. Page directive defines the attributes that apply to an entire JSP page such
    as extend to import class, isThreadSafe to define if the JSP is thread-safe, error
    page andisErrorPage to handle the exception, and session to check if the session
    object is available or not.


    The include directive inserts the contents of another file in the main JSP file,
    where the directives are located. The Taglib directive is used to define a tag
    library that defines many tags.


    In the next chapter, we will learn about JSP actions such as useBean, getProperty,
    setProperty, and forward to perform tasks such as inserting files, reusing beans,
    forwarding a user to another page, and instantiating objects. We will also learn
    about a custom tag library that provides a mechanism by which the programmer can
    encapsulate recurring code or tasks and reuse them in multiple applications.


    [**Questions**](#toc.xhtml_aa145)


         **1.  JSP handles the runtime errors using _________________attribute in
    page directive.**


         **Answer:** By errorPage and isErrorPage attributes


         **2.  What are the major attributes of page directives?**


         **Answer:** buffer, ContentType, autoFlush, errorPage, is ErrorPage, extends,
    isThreadSafe, language, Session, import, info, isElIgnored


         **3.  The JSP Page is extensible.**


                 A.  True


                 B.  False


         **Answer**: True


         **4.  What is the page directive used for?**


                 A.  To instruct the translator about assigning values within the
    JSP page it is contained within.


                 B.  To instruct the translator about the characteristics of the JSP
    page it is contained within.


                 C.  To instruct the translator about the files being used by this
    JSP page.


                 D.  To instruct the translator about the modules being used by this
    JSP page.


         **Answer**: A


         **5.  Where do we place a page directive within a JSP page?**


                 A.  At the start


                 B.  In the middle


                 C.  At the end


                 D.  Anywhere


         **Answer** : D


         **6.  How many page directives are allowed within a JSP page?**


                 A.  1


                 B.  2


                 C.  Multiple


         **Answer**: C


         **7.  How many page directive attributes are there?**


         **Answer**: 3


         **8.  Using the page directive, what type of files can we include in a JSP
    page?**


                 A.  HTML


                 B.  JSP


                 C.  Neither


                 D.  Both


         **Answer**: D


         **9.  What are pages included using the page directive commonly referred
    to as?**


                 A.  Components


                 B.  Fragments


                 C.  Modules


                 D.  Parcels


         **Answer**: A


    [CHAPTER 10](#toc.xhtml_ch10)


    [**JSP Action Element and Custom Tags**](#toc.xhtml_ch10)


    [**Introduction**](#toc.xhtml_aa146)


    JSP actions are used to perform tasks such as inserting files, reusing beans,
    forwarding a user to another page, and instantiating objects. The custom tags
    provide a mechanism that the programmer can use to encapsulate the complex recurring
    code or tasks.


    [**Structure**](#toc.xhtml_aa147)


    In this chapter, we will cover the following topics:


    *   JSP Action Elements


    *   Custom Tags


    *   Model view controller (MVC) Architecture


    [**Objectives**](#toc.xhtml_aa148)


    After studying this chapter, you will learn about the use of action tags, and
    also learn how to make your own tags, use them in your application, and see how
    the Expression language simplifies the accessibility of the data stored in the
    Java Bean component and other objects like request, session, and application.
    In this chapter, you will also learn about the MVC architecture that separates
    the business logic from presentation logic.


    [**JSP Action Tags**](#toc.xhtml_aa149)


    JSP provides standard tags used to insert, remove, and reuse beans, forward the
    users to another page and instantiate the objects.


    The syntax of the JSP action tag is as follows:


    <jsp:action_name attribute="attribute_value"/>


    The various JSP actions are described in *[Table 10.1](#chap10.xhtml_tab10.1)*,
    as follows:


    | **S.No** | **JSP action** | **Usage** | **Attribute** | **Description** |


    | 1 | **<jsp:​useBean>** | Used to find and load an existing bean | **id** | Uniquely
    identifies the instances of the bean |


    | **class** | Specifies the class from which the bean objects are to be implemented
    |


    | **scope** | Specifies the bean''s life in terms of a page, session, or application
    |


    | **beanName** | Specifies a referential name for the bean. |


    | 2 | **<jsp:​getProperty>** | Used to retrieve the property to the specified
    bean and direct it as the output. The retrieved value is converted to a string
    value before sending it as an output. | **name** | Specifies a name for the bean
    |


    | **property** | Specifies the property from which the values are to be retrieved
    |


    | 3 | **<jsp:​setProperty>** | Used to set the property of the specified bean;
    to set the value of the bean property, either an explicit value is specified,
    or the value is obtained from a request parameter. Corresponding to the specified
    request property value, the set method in the bean is called with the matching
    value. | **name** | Specifies the name of the bean |


    | **property** | Specifies the property for which the values are to be set. If
    set to “*”, it specifies that the set methods for all the specified values should
    be called. |


    | **value** | Specifies an explicit value for the bean property |


    | **param** | Specifies the name of the request parameter to be used to set the
    value of the bean property |


    | 4 | **<jsp:​forward>** | Used to forward a request to a different page | **page**
    | Specifies the relative URL of the target page |


    | 5 | **<jsp:include>** | Used to insert a file into a particular JSP page. The
    file inclusion takes place at the time of the request of the JSP page. | **page**
    | Specifies the relative URL of the page to be included |


    | **flush** | Specify if the buffer is to be flushed. A mandatory Boolean attribute
    must be included when declaring the included action. |'
