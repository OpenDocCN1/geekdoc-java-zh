    <body>\");\n            String name=request.getParameter(\"userName\");\n    \
    \        out.print(\"Welcome \"+name);\n            out.print(\"<form action='second'>\"\
    );\n            out.print(\"<input type='hidden' name='uname' value='\"+name+\"\
    '>\");\n            out.print(\"<input type='submit' value='Next'>\");\n     \
