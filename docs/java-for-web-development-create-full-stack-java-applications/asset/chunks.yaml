  trans: "\n\n# 姓名是 Agarwal\n\n与 `HttpServletRequest` 接口一起使用的方法列出如下：\n\n* `getCookies()`：用于随请求传递\
    \ cookie 信息。`Cookies` 是从服务器发送到浏览器的文本数据。因此，发送的数据可以在随后的事务中被检索。\n* `getSession()`：用于获取与请求对象关联的当前会。如果请求没有关联会，则会创建一个新会。\n\
    * `getMethod()`：用于返回一个 String 字符串，指定请求中是否存在 HTTP get、post 或 put 方法。\n* `getQueryString()`：用于返回随\
    \ `request(GET)` 传递的查询字符串。\n\n## 5. response\n这代表 `HttpServletResponse` 的响应对象，用于通过\
    \ `response.getWriter()` 等方法向浏览器写入 HTML 输出。\n\n与 `HttpServletResponse` 接口一起使用的方法列出如下：\n\
    \n* `addCookie()`：用于随响应添加 cookie。浏览器接受的 cookie 最大数量通常为 20 个。\n* `sendRedirect()`：用于为浏览器指定一个新的\
    \ URL。该方法的调用会终止之前的响应并将浏览器内容重定向到新 URL。\n\n## 6. session\n这代表 `HttpSession` 的会话对象，用于在客户端请求之间存储对象。\n\
    \n**示例**：以下代码使用 request 隐式对象访问用户输入的值；在会中设置参数并访问相同参数：\n\n**index.xhtml**:\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\">\n</head>\n<body>\n<form method=\"\
    post\" action=\"next.jsp\" >\n    First Name: <input type=\"text\" name=\"uname\"\
    >\n    Last Name: <input type=\"text\" name=\"lname\">\n    <input type=\"submit\"\
    \ value=\"Submit\"><br/>\n</form>\n</body>\n</html>\n```\n\n**表单底部：**\n点击 **Submit**\
    \ 按钮后，将运行以下代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<%\n    String str1=request.getParameter(\"\
    uname\");\n    String str2=request.getParameter(\"lname\");\n    HttpSession sess=request.getSession(true)\
    \ ;\n    sess.setAttribute(\"FName\", str1);\n    sess.setAttribute(\"LName\"\
    , str2);\n%>\n<body>\n<%\n    out.println(\"First name is \"+session.getAttribute(\"\
    FName\"));\n    out.println(\"<br>Last Name is\"+session.getAttribute(\"LName\"\
    ));\n%>\n</body></html>\n```\n\n以下是 `index.xhtml` 的输出，如 *图 8.6*所示：\n\n![img](img/131a.png)\n\
    \n**图 8.6**：上一个程序 (index.xhtml) 的输出\n\n以下是 `next.jsp` 的输出，如 *图 8.7*所示：\n\n![img](img/131b.png)\n\
    \n**图 8.7**：next.jsp 的输出（从会对象中检索）\n\n## 7. Config\n它是 `ServletConfig` 的隐式对象。Web\
    \ 容器创建此对象。用于设置或获取 JSP 页面的参数。\n## 8. exception\n它是 `java.lang.Throwable` 的隐式对象。用于打印\
    \ `exception`。\n## 9. pageContext\n它是 `PageContext` 的隐式对象。用于从页面、会和应用范围中设置、获取和删除属性。默认情况下，JSP\
    \ 具有页面范围。\n\n## 结论\n在本章中，我们学习了 JSP 页由 HTML 和 JSP 标签组成。JSP 标签包括注释、脚本段（scriptlets）、表达式和动作（actions）。JSP\
    \ 注释标签提供了关于代码部分的额外信息，并封装在 `<-- --` 标签中。脚本段标签由放在 `<%` 和 `%>` 标签内的有效代码组成。JSP 表达式用于将值插入输出中。JSP\
    \ 中有五个隐式对象。下一章，我们将学习如何提供特定页面的全局信息，以及在将 JSP 页转换为相应的 servlet 时向 Web 容器提供信息。\n\n\
    ## 问题\n1. 什么是 JSP 元素？\n2. 脚本段标签的作用是什么？\n3. JSP 脚本段标签和 JSP 声明标签有什么区别？\n4. 我们如何在\
    \ JSP 页中使用注释？\n5. JSP 中共有多少个隐式对象？\n6. JSP 中隐式对象的用途是什么？\n\n## 选择正确选项\n1. JSP 的哪种脚本不会将内容放入转换后的\
    \ servlet 的服务方法中？\nA. Scriptlets\nB. Declarations\nC. Expressions\nD. 以上均不是\n\
    **答案**: C\n\n2. 下列哪个标签用于在 JSP 中执行 Java 源代码？\nA. Scriptlets\nB. Declarations\n\
    C. Expressions\nD. 以上都不是\n**答案**: A\n\n3. 下面是 JSP 生命周期各阶段的正确顺序吗？\nA. 编译、初始化、执行、清理\n\
    B. 清理、编译、初始化、执行\nC. 初始化、清理、编译、执行\nD. 初始化、编译、清理、执行\n**答案**: A\n\n4. J2EE 包含以下哪些企业特有的\
    \ API？\nA. Java Message Service (JMS)\nB. Enterprise JavaBeans (EJB)\nC. JavaServer\
    \ Pages (JSP)\nD. 以上所有\n**答案**: 以上所有\n\n5. JSP 页被转换为 _。\nA. Java 类\nB. Java Servlet\n\
    C. Java Bean\n**答案**: Java Servlet\n\n6. JSP 页提供了一种使用 HTML 和 Java 语言创建动态网页面的方法。\n\
    A. 正确\nB. 错误\n**答案**: 正确\n\n"
- fmt: "\n| 1 | `contentType=”MIME type”` | This is the MIME type (Multipurpose Internal\
    \ Mail Extension type) of the response. The default value for the attribute is\
    \ `text/HTML`. |\n| 2 | `extends “packagename.class\"` | This is the name of the\
    \ parent class that the generated servlet will extend from. |\n| 3 | `errorPage=\
    \ “url”` | This is the URL of the error page that will be used to handle exceptions.\
    \ |\n| 4 | `isErrorPage= “False”` | If a particular JSP page can be used as an\
    \ error page for another JSP page. The default value for this attribute is `false`.\
    \ |\n| 5 | `import= “package list\"` | These are the names of the packages available\
    \ for the particular JSP page. |\n| 6 | `Language= “scripting language.”` | This\
    \ is the scripting language to be used when compiling the JSP page. The language\
    \ currently available is `Java`. |\n| 7 | `Session= “true”` | It is used to specify\
    \ the availability of the session data for the particular JSP page. The default\
    \ value for this attribute is `true`. |\n| 8 | `Info` | It sets the information\
    \ of the JSP page, which can be retrieved by using the `getServletInfo()` method\
    \ of the `Servlet` interface. |\n| 9 | `Buffer` | It sets the buffer size in kilobytes\
    \ to handle the output generated by the JSP page. The default size of the buffer\
    \ is `8KB`. |\n| 10 | `isELIgnored` | We can ignore the `Expression Language`\
    \ (`EL`) in JSP by the `ELIgnored` attribute. By default, its value is `false`,\
    \ that is Expression Language is enabled by default. |\n| 11 | `isThreadSafe`\
    \ | It serializes the JSP request. |\n| 12 | `Autoflush` | It specifies whether\
    \ the buffered output should be flushed automatically when the buffer is filled\
    \ or whether an exception should be raised to indicate the buffer overflow. |\n\
    | 13 | `PageEncoding` | The page encoding is the character encoding in which the\
    \ file is encoded. |\n\n***Table 9.1: Implicit Objects***\n\n## Implicit Objects\n\
    \n### contentType\nThe `contentType` attribute defines the MIME type of the response.\
    \ The MIME is a standard that specifies how the messages need to be formatted\
    \ when exchanged between the different systems. A MIME message can consume different\
    \ types of data like text, images, audio, and video.\n\nThe default value is `\"\
    text/html\"`.\n\n**The syntax is as follows**:\n\n```jsp\n<%@page contentType=\"\
    text/html\" pageEncoding=\"UTF-8\"%>\n```\n\n### extends\nThe `extends` attribute\
    \ extends the parent class in the JSP. The name of the parent class that the generated\
    \ servlet will extend from must be specified.\n\n**The syntax is as follows**:\n\
    ```jsp\n<%@ page extends = \"package.ClassName\" %>\n```\n\n### errorPage\nIt\
    \ is used to handle exceptions. The `errorPage` attribute is used to define the\
    \ error page; if the exception occurs on the current page, it will be redirected\
    \ to the error page.\n\n**The syntax is as follows**:\n```jsp\n<%@ page errorPage=\
    \ “next.jsp” %>\n```\n\n### isErrorPage\nThe `isErrorPage` attribute is used to\
    \ declare that the current page is the error page.\n\n**The syntax is as follows**:\n\
    ```jsp\n<%@ page isErrorPage=true %>\n```\n\n**Example**: In this example, `index.jsp`\
    \ has the `Exception` as `s` variable is pointed to the null type. The exception\
    \ is handled in `error.jsp` page.\n\nRefer to the following example code:\n\n\
    **Index.jsp**:\n```jsp\n<%@page contentType=\"text/html\" pageEncoding=\"UTF-8\"\
    %>\n<!DOCTYPE html>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"\
    text/html; charset=UTF-8\">\n<title>JSP Page</title>\n</head>\n<body>\n<h1> Welcome\
    \ to the is error page example </h1>\n<%@ page errorPage=\"error.jsp\" %>\n<%\n\
    \      String s=null;\n      char j=s.charAt(0);\n      out.println(j);\n%>\n\
    </body>\n</html>\n```\n\n**error.jsp**:\n```jsp\n<%@page contentType=\"text/html\"\
    \ pageEncoding=\"UTF-8\"%>\n<!DOCTYPE html>\n<html>\n<head>\n<meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=UTF-8\">\n<title>JSP Page</title>\n\
    </head>\n<body>\n<h1> Welcome to the error page </h1><br>\n<%@ page isErrorPage=\"\
    true\" %>\n<%= exception %>\n</body>\n</html>\n```\n\nThe following is the output,\
    \ as shown in [Figure 9.1].\n![img](images/140.png)\n***Figure 9.1: Output of\
    \ the preceding program***\n\n### import\nThis attribute imports interface and\
    \ class.\n\n**The syntax is as follows**:\n```jsp\n<%@ page import= “java.util.Date”\
    \ %>\n```\n\n**Example**: This example imports `java.util.Date` and displays the\
    \ current date:\n```jsp\n<%@page contentType=\"text/html\" pageEncoding=\"UTF-8\"\
    %>\n<!DOCTYPE html>\n<html>\n<head>\n<meta http-equiv=\"Content-Type\" content=\"\
    text/html; charset=UTF-8\">\n<title>JSP Page</title>\n</head>\n<body>\n<%@ page\
    \ import=\"java.util.Date\" %>\n<h1>Today is: <%= Date() %></h1>\n</body>\n</html>\n\
    ```\n\n### Language\nThis specifies the scripting language to be used when compiling\
    \ the JSP page. The language currently available is `Java`.\n\n**The syntax is\
    \ as follows**:\n```jsp\n<%@ page language=\"java\" %>\n```\n\n### Session\nIt\
    \ is used to specify the availability of the session data for the particular JSP\
    \ page. The default value for this attribute is `true`.\n\n**The syntax is as\
    \ follows**:\n```jsp\n<%@ page session=\"true\" %>\n```\n\n### Info\nIt sets the\
    \ information of the JSP page, which can be retrieved by using the `getServletInfo()`\
    \ method of the `Servlet` interface.\n\n**The syntax is as follows**:\n```jsp\n\
    <%@ page info=\"servlet description\" %>\n```\n\n### Buffer\nIt sets the buffer\
    \ size in kilobytes to handle the output generated by the JSP page. The default\
    \ size of the buffer is `8KB`.\n\n**The syntax is as follows**:\n```jsp\n<%@ page\
    \ buffer=\"8KB\" %>\n```\n\n### isELIgnored\nThis attribute is used to disable\
    \ the `Expression Language` (`EL`) in JSP by the `ELIgnored` attribute introduced\
    \ in JSP 2.0. It is enabled by default. It means that its value is set to `false`\
    \ by default.\n\n**The syntax is as follows**:\n```jsp\n<%@ page isELIgnored=\"\
    true\" %>\n```\n\n### isThreadSafe\nBoth JSP and Servlets are multithreaded by\
    \ default, that is, the value `isThreadSafe` is `true`. If you want to serialize\
    \ the client request, you have to make it `false`. Web container will not accept\
    \ any further client requests until the previous serialized client request is\
    \ fulfilled.\n\n**The syntax is as follows**:\n```jsp\n<%@ page isThreadSafe=\"\
    false\" %>\n```\n\n### Autoflush\nThis attribute is used to specify whether the\
    \ buffered output should be flushed automatically or not. By default, the value\
    \ is `true`, that is, it flushes automatically when the buffer is full.\n\n**The\
    \ syntax is as follows**:\n```jsp\n<%@ page autoFlush=\"true\" %>\n```\n"
  raw: '| 1 | **contentType=”MIME type”** | This is the MIME type (Multipurpose Internal
    Mail Extension type) of the response. The default value for the attribute is text/HTML.
    |


    | 2 | **extends “packagename.class”** | This is the name of the parent class that
    the generated servlet will extend from. |


    | 3 | **errorPage= “url”** | This is the URL of the error page that will be used
    to handle exceptions. |


    | 4 | **isErrorPage= “False”** | If a particular JSP page can be used as an error
    page for another JSP page. The default value for this attribute is false. |


    | 5 | **import= “package list”** | These are the names of the packages available
    for the particular JSP page. |


    | 6 | **Language= “scripting language.”** | This is the scripting language to
    be used when compiling the JSP page. The language currently available is Java.
    |


    | 7 | **Session= “true”** | It is used to specify the availability of the session
    data for the particular JSP page. The default value for this attribute is true.
    |


    | 8 | **Info** | It sets the information of the JSP page, which can be retrieved
    by using the getServletInfo() method of the Servlet interface. |


    | 9 | **Buffer** | It sets the buffer size in kilobytes to handle the output generated
    by the JSP page. The default size of the buffer is 8KB. |


    | 10 | **isELIgnored** | We can ignore the **Expression Language** (**EL**) in
    JSP by the ELIgnored attribute. By default, its value is false, that is, Expression
    Language is enabled by default. |


    | 11 | **isThreadSafe** | It serializes the JSP request. |


    | 12 | **Autoflush** | It specifies whether the buffered output should be flushed
    automatically when the buffer is filled or whether an exception should be raised
    to indicate the buffer overflow. |


    | 13 | **PageEncoding** | The page encoding is the character encoding in which
    the file is encoded. |


    ***Table 9.1**: Implicit Objects*


    [**Implicit Objects**](#toc.xhtml_aa129)


    [**contentType**](#toc.xhtml_aa130)


    The **contentType** attribute defines the MIME type of the response. MIME is a
    standard that specifies how the messages need to be formatted when exchanged between
    the different systems. A MIME message can consume different types of data like
    text, images, audio, and video.


    The default value is "text/html.


    **The syntax is as follows**:


    <%@page contentType="text/html" pageEncoding="UTF-8"%>


    [**extends**](#toc.xhtml_aa131)


    The **extends** attribute extends the parent class in the JSP. The name of the
    parent class that the generated servlet will extend from must be specified.


    **The syntax is as follows**:


    <%@ page extends = "package.ClassName" %>


    [**errorPage**](#toc.xhtml_aa132)


    It is used to handle exceptions. The **errorPage** attribute is used to define
    the error page; if the exception occurs on the current page, it will be redirected
    to the error page.


    **The syntax is as follows**:


    <%@ page errorPage= “next.jsp” %>


    [**isErrorPage**](#toc.xhtml_aa133)


    The **isErrorPage** attribute is used to declare that the current page is the
    error page.


    **The syntax is as follows**:


    <%@ page isErrorPage=true  %>


    **Example**: In this example, **index.jsp** has the Exception as ‘**s**’ variable
    is pointed to the null type. The exception is handled in **error.jsp** page.


    Refer to the following example code:


    **Index.jsp**:


    <%@page contentType="text/html" pageEncoding="UTF-8"%>


    <!DOCTYPE html>


    <html>


    <head>


    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


    <title>JSP Page</title>


    </head>


    <body>


    <h1> Welcome to the is error page example %>


    <%@ page errorPage="error.jsp" %>


    <%


             String s=null;


    char j=s.charAt(0);


    out.println(j);


             %>


    </body>


    </html>


    **error.jsp****:**


    <%@page contentType="text/html" pageEncoding="UTF-8"%>


    <!DOCTYPE html>


    <html>


    <head>


    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


    <title>JSP Page</title>


    </head>


    <body>


    <h1> Welcome to the error page  </h1><br>


    <%@ page isErrorPage="true" %>


    <%= exception %>


    </body>


    </html>


    The following is the output, as shown in *[Figure 9.1:](#chap09.xhtml_fig9.1)*


    ![img](images/140.png)


    ***Figure 9.1**: Output of the preceding program*


    [**import= “package list”**](#toc.xhtml_aa134)


    This attribute imports interface and class.


    **The syntax is as follows**:


    <%@ page import= “java.util.Date” %>


    **Example**: This example **import java.util****.Date** package and display the
    current date:


    <%@page contentType="text/html" pageEncoding="UTF-8"%>


    <!DOCTYPE html>


    <html>


       <head>


          <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


          <title>JSP Page</title>


       </head>


       <body>


          <h1> import attribute</h1>


          <%@ page import="java.util.Date" %>


          Today is: <%= new Date() %>


       </body>


    </html>


    The following is the output, as shown in *[Figure 9.2:](#chap09.xhtml_fig9.2)*


    ![img](images/141.png)


    ***Figure 9.2**: Output of the preceding program*


    [**language= “scripting language.”**](#toc.xhtml_aa135)


    It specifies the scripting language to be used when compiling the JSP page. The
    language currently available is Java.


    **The syntax is as follows**:


    <%@ page language= “java” %>


    [**Session=true/false**](#toc.xhtml_aa136)


    It is used to specify the availability of the session data for the particular
    JSP page. It indicates whether the JSP page uses the HTTP sessions or not. The
    default value for this attribute is **true**. If the value is **true**, the JSP
    page has access to a built-in session object. We can use the methods like **session.getCreationTime()**
    or **session.getLastAccessTime()**.


    **The syntax is as follows:**


    <%@ page session= “true” %>


    **The following is the example**:


      <%@ page language="java" contentType="text/html; charset=ISO-8859-1"


          session="false"%>


    [**info= “servlet information”**](#toc.xhtml_aa137)


    It specifies the servlet description. It defines the servlet information in the
    form of a string and can be accessed with the **getServletInfo()** method.


    **The syntax is as follows**:


    <%@ page info="servlet information" %>


    **The following is the example**:


    <%@ page info="page directive info explanation”%>


    [**Buffer**](#toc.xhtml_aa138)


    Client response should be stored. By default, we have an 8 KB buffer size to store
    the same. If we want to change the size, we can use this attribute.


    **The syntax is as follows**:


    <%@ page buffer="value" %>


    **The following is an example**:


      <%@ page language="java" contentType="text/html; charset=ISO-8859-1"


          buffer="16KB"%>


    [**isELIgnored= “true/false”**](#toc.xhtml_aa139)


    This attribute is used to disable the **Expression Language** (**EL**) in JSP
    by the **isELIgnored** attribute introduced in JSP 2.0\. It is enabled by default.
    It means that its value is set to **false** by default.


    **The syntax is as follows**:


    <%@ page is ELIgnored= “true” %>”


    | **NOTE: Expression Language will be ignored in this syntax.** |


    [**isThreadSafe**](#toc.xhtml_aa140)


    Both JSP and Servlets are multithreaded by default, that is, the value **isThreadSafe**
    is **true**. If you want to serialize the client request, you have to make it
    **false**. Web container will not accept any further client requests until the
    previous serialized client request is fulfilled. In such a case, the web container
    generates a servlet that implements the **SingleThreadModel** interface.


    **The syntax is as follows**:


    <%@ page isThreadSafe="false" %>


    [**autoFlush**](#toc.xhtml_aa141)


    This attribute is used to specify whether the buffered output should be flushed
    automatically or not. By default, the value is **true**, that is, it flushes automatically
    when the buffer is full. If the value is set to **false**, the buffer will not
    be flushed automatically, and if it is full, it will throw an exception.


    **The syntax is as follows**:


    <% @ page autoFlush="true/false" %>


    | **NOTE: If the user sets autoflush = “none”, the output will not be buffered.**
    |


