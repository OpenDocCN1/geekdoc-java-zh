              <session-timeout>


                          30


              </session-timeout>


    </session-config>


    </web-app>


    The following is the output of index.xhtml, as shown in *[Figure 10.15](#chap10.xhtml_fig10.15)*:


    ![img](images/185a.png)


    ***Figure 10.15**: Output of index.xhtml*


    The following is the output of logini-success.jsp, as shown in *[Figure 10.16](#chap10.xhtml_fig10.16)*:


    ![img](images/185b.png)


    ***Figure 10.16**: Output of logini-success.jsp*


    The following is the output of login-error.jsp, as shown in *[Figure 10.17](#chap10.xhtml_fig10.17)*:


    ![img](images/186.png)


    ***Figure 10.17**: Output of login-error.jsp*


    [**Conclusion**](#toc.xhtml_aa163)


    In this chapter, we learned that JSP actions such as **useBean**, **getProperty**,
    **setProperty**, **setProperty**, and forward are used to perform tasks such as
    inserting files, reusing beans, forwarding a user to another page, and instantiating
    objects. The custom tag library provides a mechanism by using which the programmer
    can encapsulate the recurring code or tasks and reuse them in multiple applications.
    Custom tags like XML and HTML tags contain the start and end tags and a body.
    Custom tags can be categorized as simple tags, body tags, tags with attributes,
    or nested tags. Attributes contain parameters that can be used to customize the
    behavior of the custom tags.


    The tag handler and TLD files are created to implement the functionality of the
    custom tags in a JSP file. The tag handler is used to define the custom tags and
    is derived from the **javax.servlet.tagext** package that implements the tag or
    the **TagBody** interfaces. The tag handler consists of the **doStartTag()**,
    **doEndTag()**, and **release()** methods.


    The **tag library definition** (**TLD**) file is an XML file that contains the
    tag library description and consists of the following tags:


    *   taglib


    *   tlibversion


    *   jspversion


    *   info


    *   name


    *   tagclass


    *   bodycontent


    The errors in JSP can be categorized as either translation time errors or request
    time errors. The error page is a separate file used to trap the runtime errors
    of a JSP page. A tag library can be deployed either by separate placements of
    files or by packaging the files. The package files created to contain the TLD
    file and the class files are jar and war files. Expression Language simplifies
    the accessibility of the data stored in the Java Bean component and other objects
    like request, session, application, and so on. MVC architecture separates business
    logic from presentation logic.


    In the next chapter, you will learn Structs Framework with a simple example.


    [**Questions**](#toc.xhtml_aa164)


         **1.  Which JSP action tag is used to include the content of another resource,
    be it JSP, HTML, or servlet?**


               a.  Jsp:include


               b.  Jsp:forward


               c.  Jsp:page


               d.  Jsp: param


         **Ans**: a


         2.  What is the requirement of a tag library?


         3.  What is a JSP Expression?


         4.  How do you include static files on a JSP page?


         5.  How is Taglib Directive used in JSP?


         6.  What are custom tags, how do you use them, and how do you create them
    in JSP?.


         7.  What is the difference between custom JSP tags and JavaBeans?


         8.  What is EL?


         9.  How does EL search for an attribute?


    [CHAPTER 11](#toc.xhtml_ch11)


    [**Introduction to Struts**](#toc.xhtml_ch11)


    [**Introduction**](#toc.xhtml_aa165)


    Struts is a framework based on an MVC pattern to develop web applications. The
    pattern is the way you can architect your application, whereas Framework provides
    the foundation classes and libraries. The Framework helps in the rapid development
    of common classes. It leverages industry best practices. Craig McClanahan built
    the Struts Framework and submitted it to the Apache Foundation in May 2000, and
    Struts 1.0 was released in June 2001\. Struts 2.5.22 is the most recent stable
    release, which was released on November 19, 2019. There is some difference between
    struts1 and struts2.


    *[Table 11.1](#chap11.xhtml_tab11.1)* provides the differences between Struts1
    and Struts2:


    | **No.** | **Struts1** | **Struts2** |


    | 1 | Action class is not POJO. You need to inherit the abstract class. | The
    action class is POJO. You don''t need to inherit any class or implement any interface.
    |


    | 2 | Front controller is ActionServlet. | Front Controller is StrutsPrepareAndExecuteFilter.
    |


    | 3 | It uses the concept of the RequestProcessor class while processing requests.
    | It uses the concept of **Interceptors** while processing the request. |


    | 4 | It has only JSP for the view component. | For the view component, it has
    JSP, Freemarker, Velocity, and so on. |


    | 5 | The configuration file name can be [anyname].xml, and it can be placed inside
    the WEB-INF directory. | The configuration file must be struts.xml and placed
    inside the classes directory. |


    | 6 | Action and Model are separate. | Action and Model are combined within the
    action class. |


    ***Table 11.1**: Difference between Struts1 and Struts2*


    [**Structure**](#toc.xhtml_aa166)


    In this chapter, we will cover the following topics:


    *   Features of Struts


    *   Architecture of Struts


    *   Components of Struts


    *   Create an application


    [**Objective**](#toc.xhtml_aa167)


    In this chapter, you will learn about the struts framework that simplifies the
    development and maintenance of web applications by providing predefined functionality.
    The features and components of Struts2 will also be learned. An application based
    on the framework will also be created to understand the Strust2 framework.


    [**Features of Struts2**](#toc.xhtml_aa168)


    The following are the main features of Struts2:


    *   **Configurable MVC components**: In the struts2 framework, we provide all
    the components'' (view components and Action) information in the struts.xml file.
    We may simply alter any information in the XML file if we need to.


    *   **POJO-based actions**: The action class in struts2 is a **Plain Old Java**
    **Object** (**POJO**), which is a simple Java class. You are not required to implement
    any interfaces or inherit any classes in this environment.


    *   **AJAX support**: Struts2 has the support of Ajax technology. It''s used to
    make asynchronous requests, which means it doesn''t keep the user waiting. It
    just sends the needed field data to the server, not all of it. As a result, the
    performance is quick.


    *   **Integration support**: We can simply integrate the struts2 Application with
    framework like hibernate, spring, tiles, and so on.'
