    \ time=df2.format(new java.util.Date());\n\nSystem.out.println(time);\n\n  }}\n\
    \n**The following is the output**:\n\nMay 10, 2020\n\n7:33:47 PM IST\n\n[**Internationalizing\
    \ with Numbers (I18N with Numbers)**](#toc.xhtml_aa39)\n\nWhenever a Locale is\
    \ changed, the format of the number also changes. The format of the numbers is\
    \ also different from region to region. The **java.text.NumberFormat** class is\
    \ used to format the number and the currency percent according to the specific\
    \ locale.\n\n**The following are the methods of the NumberFormat**:\n\n*   **public\
    \ static NumberFormat getNumberInstance(Locale locale)**: This returns the NumberFormat\
    \ object and is used to format the number according to the locale.\n\n*   **public\
    \ static NumberFormat getInstance(Locale locale)**: This returns a general-purpose\
    \ number format for the current default locale.\n\n*   **public static NumberFormat\
    \ getPercentInstance(Locale l)**: This returns a percentage format for the specified\
    \ locale.\n\n*   **public static NumberFormat getCurrencyInstance(Locale l)**:\
    \ This returns a currency format for the current default locale.\n\n**The following\
    \ is an example**:\n\nimport java.text.NumberFormat;\n\nimport java.util.Locale;\n\
    \npublic class FormatextDemo {\n\n  public static void main(String[] args)\n\n\
    {\n\n    Locale l=new Locale(args[0],args[1]);\n\n    NumberFormat nf=NumberFormat.getNumberInstance(l);\n\
    \n    String num=nf.format(123456789.12345);\n\nSystem.out.println(\"Number for\
    \ \"+args[0] +\" \" +args[1]+\" : \"+ num);\n\n    //Currency Format\n\n    NumberFormat\
    \ nf2=NumberFormat.getCurrencyInstance(l);\n\n    String num2=nf2.format(123456789.12345);\n\
    \n    System.out.println(\"Currency of  \"+args[0] +\" \" +args[1]+\" : \"+ num2);\n\
    \n    //Percent Format\n\n    NumberFormat nf3=NumberFormat.getPercentInstance(l);\n\
    \n    String num3=nf3.format(123456789.12345);\n\n    System.out.println(\"Percent\
    \ Format of   \"+args[0] +\" \" +args[1]+\" : \"+ num3);\n\n  }    }\n\n**The\
    \ following is the output (for the US region)**:\n\nNumber for en US : 123,456,789.123\n\
    \nCurrency of  en US : $123,456,789.12\n\nPercent Format of   en US : 12,345,678,912%\n\
    \n**The following is the output (for France)**:\n\nNumber for fr FR : 123 456\
    \ 789,123\n\nCurrency of fr FR: 123 456 789,12 €\n\nPercent Format of fr FR :\
    \ 12 345 678 912 %\n\n**The following is the output (for Japan)**:\n\nNumber for\
    \ ja JP : 123,456,789.123\n\nCurrency of ja JP : ?123,456,789\n\nPercent Format\
    \ of   ja JP : 12,345,678,912%\n\n[**Conclusion**](#toc.xhtml_aa40)\n\n1. **Localization**:\
    \ It is a mechanism to create an application in a specific language or region.\
    \ This can be done via the **Locale** object.\n\n2. **Locale:** It is a class\
    \ in **java.util** package that provides information about the country and the\
    \ region.\n\n3.  Resource Bundle stores the text and components that are Locale\
    \ sensitive and loads this information from the properties file that contains\
    \ the messages. The **java.util.ResourceBundle** class is an abstract class. **Properties**\
    \ file that contains the Locale sensitive information and is also called resource\
    \ Bundle.\n\n4.  The name of the properties file should be the **filename_languagecode_country**\
    \ code, for example, **MyMessage_hi_IN.propertie**s."
