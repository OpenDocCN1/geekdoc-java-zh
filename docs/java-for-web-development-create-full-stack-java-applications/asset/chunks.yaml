    as follows:


    • **addCookie()**: It is used to add a cookie along with the response. The maximum
    number of cookies accepted by the browser is 20.


    • **sendRedirect()**: It is used to specify a new URL to the browser. The invocation
    of the method terminates the prior response and redirects the browser contents
