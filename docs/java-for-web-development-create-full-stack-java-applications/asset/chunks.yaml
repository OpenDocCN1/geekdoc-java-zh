    ## 23. How does JSP add functionality to an application in the presence of the
    servlet technology?


    **Ans**: The basic importance of using JSP is the auto-generation of servlets.
    This feature simplifies a part of the coding phase. The positive implementation
    of JSP is also brought out when the response output contains both template and
    business-specific data.


    ## 24. How do you correlate JSP and XML?


    **Ans**: The HTML content representing the static content can also be coded by
    using XML. In addition to this, the JSP content or the scriptlets can also be
    represented within the XML tags `<jsp:scriplet>` and `</jsp:scriplet>`.


    ## 25. Is the Java platform API used with JSP?


    **Ans**: Since the compilation of JSP results in the generation of a servlet,
    JSP needs JVM support that fulfils the standard followed by the Java Servlets.


    ## 26. How do you define a JSP tag library?


    **Ans**: The JSP tag libraries contain user-defined custom tags that are used
    to write the XML-based codes containing the `javaBean` components. Tag libraries
    essentially aim at segregating the static and dynamic code content of a JSP file.


    ## 27. What are the advantages of using tag libraries?


    **Ans**: The features of a tag library are as follows:


    a. Tags created for the JSP pages are portable and can be easily used across projects.
    Once packaged as a `jar` or a `war` file, they can be reused.


    b. Tag libraries are maintainable. This is because the dynamic code is placed
    in the tag handler and the `javaBean` component. Any changes that need to be made
    to the code can thus be simply updated in the corresponding files.


    The reusability factor also explains the shortening of the debugging time and
    thus reduces the time taken to deploy a JSP application that uses tag libraries.


    ## 28. How can you restrict the page errors displayed on a JSP page?


    **Ans**: The errors can be stopped from getting displayed by setting up an `ErrorPage`
    attribute of the `PAGE` directory to the name of the error page in the JSP page,
    and then in the error JSP page, setting `isErrorpage="TRUE"`.


    ## 29. How can a thread safe JSP page be implemented?


    **Ans**: It can be done by having them implemented by the `SingleThreadModel`
    Interface. Add `<@page isThreadSafe="false" %>` directive in the JSP page.


    ## 30. How can the output of the JSP or servlet page be prevented from being cached
    by the browser?


    **Ans**: Using appropriate HTTP header attributes can help prevent the dynamic
    content output by a JSP page from being cached by the browser.


    ## 31. How can you disable scripting?


    **Ans**: Scripting can be easily disabled by setting the `scripting-invalid` element
    of the deployment descriptor as true. It is a sub-element of the property group.
    It can be false as well.


    ## 32. Is the JSP technology extensible?


    **Ans**: Yes, JSP is easily extensible by the use and modification of tags, or
    custom actions, encapsulated in the tag libraries.


