    # 第 1 章


    ## 数据库连接


    ### 引言


    大多数基于 Web 的应用程序都需要与数据库管理系统（DBMS）交互。这种 `DBMS` 用于从数据库仓库中检索信息。例如，在线购物邮件需要跟踪其客户和售出的商品。像
    [www.yahoo.com](http://www.yahoo.com) 这样的搜索网站需要跟踪用户访问的网页 URL。


    ### 结构


    在本章中，我们将涵盖以下主题：


    *   使用 Java 进行数据库编程的技术

    *   连接 Java 程序与数据库的驱动类型

    *   如何使用 `JDBC-ODBC` 桥接和 `ODBC` 驱动访问数据库


    ### 目标


    在本章中，您将能够建立数据库与 Java 程序之间的连接。您将在存储过程和光标的全支持下，从数据库读取和写入数据。


    ### 数据库管理


    数据库是相关信息的集合，而 `DBMS` 是提供一种机制让您检索、修改和向数据库添加数据的软件。目前有许多 `DBMS/RDBMS` 产品可用，例如 MS-Access、MS-SQL
    Server、Oracle、Sybase、Informix Progress 和 Ingress。这些`关系型数据库管理系统`（`RDBMS`）都以自己的形式存储数据。


    例如，MS-Access 以 `MDB` 文件格式存储数据，而 MS-SQL 以 `.DAT` 文件格式存储数据。


    假设您被分配了一项任务，为一家商店开发应用程序，允许店主维护每日交易记录。您设计了数据库，在店主的机器上安装了 MS-SQL 服务器/`Oracle`，并告诉他使用它。


    开发一个自定义的前端应用程序将是一个好主意，在其中客户可以按键获得检索、添加和修改数据的选项。


    为了实现这一点，您应该拥有一种机制，使应用程序与数据库的文件格式工作，即 `MDB` 或 `.DAT` 文件。


    为了让您的应用程序与数据库通信，它需要以下信息：


    *   数据库的位置

    *   数据库名称


    *图 1.1* 展示了数据库应用程序架构：


    ![img](img/19.png)


    **图 1.1**: 数据库应用程序架构


    这意味着您创建的应用程序将只能与一种数据库工作，并且编码和移植将非常困难。


    上述问题通过微软的一种与数据库进行高效通信的机制解决了，称为`开放数据库连接`（`ODBC`）。


    ### ODBC 应用程序编程接口 (API)


    `ODBC API` 是一组库例程，使您的程序能够访问各种数据库。您只需要安装特定于 DBMS 的 `ODBC` 驱动并编写您的程序。`图 1.2` 显示应用程序与
    `ODBC` 驱动管理器通信。


    以后，如果数据库升级到新版本或移植到不同的 `RDBMS`，您只需要更改 `ODBC` 驱动而不需要更改程序，如`图 1.2`所示（此处应为图 1.2）：


    ![img](img/20.png)


    **图 1.2**: ODBC 应用程序架构


    ### JDBC-API


    `Java 数据库连接（JDBC）为 Java 程序提供了数据库编程 API。由于 `ODBC API` 是用 C 语言编写的，并使用了 Java 不支持的指针等结构，Java
    程序无法直接与 `ODBC` 驱动通信。


    Sun 创建了 `JDBC-ODBC` 桥接驱动，将 `JDBC-API` 翻译为 `ODBC`。它与 `ODBC` 驱动一起使用。


    ### JDBC 驱动分类


    JDBC 驱动有几类，如下：


    *   `JDBC-ODBC` 桥接 + `ODBC` 驱动

    *   `原生 API` – 部分 Java 驱动

    *   `JDBC` – 网络纯 Java 驱动 / 网络协议

    *   网络协议 – 纯 Java 驱动 / 薄型驱动


    ### JDBC-ODBC 桥接 + ODBC 驱动


    `JDBC-ODBC` 桥接驱动使用 `ODBC` 驱动连接数据库。`JDBC-ODBC 桥接驱动`将 `JDBC` 方法调用转换为 `ODBC` 函数调用。由于薄型驱动的存在，现在不再建议这种做法。参考`图
    1.3`，它展示了 `JDBC` 应用程序架构：


    ![img](img/21.png)


    **图 1.3**: JDBC 应用程序架构


