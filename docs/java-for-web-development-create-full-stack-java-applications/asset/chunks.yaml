    \ contrary, consider the same example written in `XML` using the custom tags (user-defined),\
    \ as follows:\n\n```xml\n<CUSTOMERDETAILS>\n  <NAME>\n    <TITLE>Ms</TITLE>\n\
    \    <FIRSTNAME>Anne</FIRSTNAME>\n    <LASTNAME>Brown</LASTNAME>\n  </NAME>\n\
    \  <ADDRESS>\n    <APTNAME>9, Sunley House</APTNAME>\n    <STREETNAME>Gunthorpe\
    \ Street</STREETNAME>\n    <COUNTRY>London</COUNTRY>\n    <ZIP>E1 – 7RW</ZIP>\n\
    \  </ADDRESS>\n</CUSTOMERDETAILS>\n```\n\nThe rewriting of the preceding code\
    \ in `XML` is as follows:\n\n```xml\n<xml>\n  <CUSTOMERDETAILS>\n    <NAME>\n\
    \      <TITLE>Ms</TITLE>\n      <FIRSTNAME>Anne</FIRSTNAME>\n      <LASTNAME>Brown</LASTNAME>\n\
    \    </NAME>\n    <ADDRESS>\n      <APTNAME>9, Sunley House</APTNAME>\n      <STREETNAME>Gunthorpe\
    \ Street</STREETNAME>\n      <COUNTRY>London</COUNTRY>\n      <ZIP>E1 – 7RW</ZIP>\n\
    \    </ADDRESS>\n  </CUSTOMERDETAILS>\n</xml>\n```\n"
  raw: 'It is used to insert the content of the file into a particular JSP file. The
    file may be JSP, HTML, or servlet. The file inclusion takes place at the time
    of the request of the JSP page.


    The following are the attributes:


    *   **page**: It specifies the relative URL of the page to be included.


    *   **flush**: It specifies if the buffer is to be flushed. A mandatory Boolean
    attribute has to be included when declaring the include action.


    **Syntax**:


    <jsp:include page="relativeURL | <%= expression %>">  <jsp:param name="parametername"
    value="parametervalue | <%=expression%>" />  </jsp:include>


    **Example**:


    **printdate.jsp**


    <% out.print("Today is:"+java.util.Calendar.getInstance().getTime()); %>


    **Index.jsp**


    <html>


           <body>


                  <h2>this is index page</h2>


                  <jsp:include page="printdate.jsp" />


                  <h2>end section of index page</h2>


           </body>


    </html>


    **Example**:


    In the following example, the user enters the account number and password on a
    JSP page. If the account number and password exist in the database, then the user
    is validated, otherwise an error message will be generated, as shown as follows:


    **Index.jsp**


    <html>


       <body>


          <form method="post" action="usebean.jsp">


