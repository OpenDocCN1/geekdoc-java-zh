    \ 类用于根据特定的区域对以下进行格式化：\n\n* 格式化数字\n* 格式化货币\n* 格式化百分比\n\n## 多选题](#toc.xhtml_aa41)\n\
    \n### 1. 已：\n```java\nDate = new Date(); //line no 12\ndf.setLocale(Locale.ITALY);\
    \ //line no 13\nString s = df.format(date); // line no 14\n```\n变量 `df` 是 `DateFormat`\
    \ 类型的对象，已在第 11 行内联初始化。如果这段代码在 2000 年 12 月 14 日运行，结果是什么？\n\nA. `s` 的值为 `14-dec-2004`。\n\
    B. `s` 的值为 `Dec 14, 2000`。\nC. 运行时抛出异常。\nD. 因为第 13 行有错误导致编译失败。\n\n**答案**: D\n\n\
    ### 2. 已：\n```java\nNumberFormat nf = NumberFormat.getInstance(); // line no 12\n\
    nf.setMaximumFractionDigits(4); // line no 13\nnf.setMinimumFractionDigits(2);\
    \ // line no 14\nString a = nf.format(3.1415926); // line no 15\nString b = nf.format(2);\
    \ // line no 16\n```\n如果默认区域为 `Locale.US`，关于结果的哪两个陈是正确的？（选择两个。）\n\nA. `b` 的值为\
    \ `2`。\nB. `a` 的值为 `3.14`。\nC. `b` 的值为 `2.00`。\nD. `a` 的值为 `3.141`。\nE. `a` 的值为\
    \ `3.1415`。\nF. `a` 的值为 `3.1416`。\nG. `b` 的值为 `2.0000`。\n\n**答案**: C, F\n\n###\
    \ 3. 已：\n`d` 是一个有效的、非空的 `Date` 对象。`df` 是一个有效的、非空的 `DateFormat` 对象，并设置为当前区域。什么输出当前区域的国家名称和\
    \ `d` 日期的适当版本？\n\nA. `Locale loc = Locale.getLocale();`\n`System.out.println(loc.getDisplayCountry()+\
    \ \" \" + df.format(d));`\nB. `Locale loc = Locale.getDefault();`\n`System.out.println(loc.getDisplayCountry()+\
    \ \" \" + df.format(d));`\nC. `Locale loc = Locale.getLocale();`\n`System.out.println(loc.getDisplayCountry()+\
    \ \" \" + df.setDateFormat(d));`\nD. `Locale loc = Locale.getDefault();`\n`System.out.println(loc.getDisplayCountry()+\
    \ \" \" + df.setDateFormat(d));`\n\n**答案**: B\n\n### 4. 已：\n```java\nimport java.text.*;\n\
    class DateOne {\n    public static void main(String[] args) {\n        Date d\
    \ = new Date(123631685981L);\n        DateFormat df = new DateFormat();\n    \
    \    System.out.println(df.format(d));\n    }\n}\n```\n并且假设 `123631685981L` 是\
    \ 1970 年 1 月 1 日到 2005 年 8 月 9 日某时刻之间的毫秒数，结果是什么？（注意：选项 A 中的时间可能会变化。）\n\nA. `8/9/05\
    \ 5:54 PM`\nB. `123631685981L`\nC. 运行时抛出异常。\nD. 因为单个错误编译失败。\nE. 因为多个错误编译失败。\n\n\
    **答案**:\n-> E 是确的。`Date` 类位于 `java.util` 包中，因此需要导入，并且 `DateFormat` 对象必须使用静态方法（如\
    \ `DateFormat.getInstance()` 或 `DateFormat.getDateInstance()`）来创建。\n-> 根据上述，A、B、C\
    \ 和 D 都是错误的。\n\n### 5. 下述哪些是正确的？（选择所有适用。）\n\nA. `DateFormat.getDate()` 用于将 `String`\
    \ 转换为 `Date` 实例。\nB. `DateFormat` 和 `NumberFormat` 对象都可以被构造为特定区域的。\nC. `Currency`\
    \ 和 `NumberFormat` 对象都必须使用静态方法构造。\nD. 如果 `NumberFormat` 实例的 `Locale` 与当前 `Locale`\
    \ 不同，则必须在创建时指定。\nE. 单个 `NumberFormat` 实例可以从字符串创建数字对象，并从数字创建格式化后的数字。\n\n**答案**:\n\
    -> B, C, D 和 E 是正确的。\n-> A 是错误的，`DateFormat.parse()` 用于将 `String` 转换为 `Date`。\n\
    \n## 问题\n\n1. 你如何在 Java 中使用特定的 `Locale`？\n2. 如何区分本地化（Localization）和国际化（internationalization）？\n\
    3. 我该如何对现有程序进行国际化？\n4. `ResourceBundle` 是什么？如何提取字符串到 Resource Bundle？\n5. 解释 Java\
    \ 应用如何使用多个区域？\n\n## 第 3 章](#toc.xhtml_ch03)\n\n## Java Servlet 引言](#toc.xhtml_ch03)\n\
    \n### 引言](#toc.xhtml_aa42)\n\n考虑一种你想注册网站以获取免费订阅的情况。你需要提供的信息是名、姓和组织名称。输入详情并点击提交按钮后，输入的数据会被转发到服务器进行处理。处理可能包括检查\
    \ ID 是否已使用或在客户端检查无效值以减轻服务器负担。为这些目的编写的小程序被称为客户端脚本。VB 脚本和 Java 脚本是用于客户端脚本的两种语言。处理服务器数据的程序被称为服务端脚本。Web\
    \ 应用也需要服务器的功能。这促使了高效服务端编程工具的发展，如 Servlet、Java  Pages、ASP 等。\n\n### 结构](#toc.xhtml_aa43)\n\
    \n在本章中，我们将涵盖以下主题：\n\n* Web 服务器\n* Servlet 及其特点\n* Servlet 与 Applet 的区别\n* Servlet\
    \ 的工作\n* Servlet 的生命周期\n* Servlet 方法\n* 部署描述\n\n### 目标](#toc.xhtml_aa44)\n\n学习本章后，你将学会如何通过\
    \ Servlet 与服务器通信。你将理解 Servlet 的生命周期。你还将学习如何通过部署描述获取 Servlet 的信息。\n\n### Web 服务器](#toc.xhtml_aa45)\n\
    \nWeb 服务器接收客户端请求，找到资源（HTML 页面、图片、声音文件、记录），并向用户返回。当服务器找不到请求的资源时，会给出 404 “未找到”。Web\
    \ 服务器是硬件和软件的结合。硬件可以是任何物理机器，软件是服务器应用程序。\n\n### Servlet 引言](#toc.xhtml_aa46)\n\n\
    Servlet 是部署在支持 Java 的 Web 服务器上的 Java 程序，用于增强和扩展服务器的功能。例如，你可以编写一个 Servlet 为银行网站添加即时通讯服务。Servlet\
    \ 还可以用于为 页面添加动态内容。例如，你可以使用 Servlet 从信息数据库中检索银行提供的最新优惠，并显示在银行主页上。\n\n### Servlet\
    \ 的特点](#toc.xhtml_aa47)\n\n"
- fmt: '

    Servlets can be used to develop a variety of web-based applications. As Servlets
    are written using Java, they can use the extensive power of the Java API, such
    as networking and URL access, multithreading, database connectivity, internationalization,
    `remote method invocation` (`RMI`), and object serialization. The characteristics
    of Servlets that have gained them widespread acceptance are as follows:


    * **Servlets are efficient**: The initialization code for a Servlet is executed
    only when the Servlet is executed for the first time. Subsequently, the Servlet''s
    requests are processed by its `service()` method. This helps increase the efficiency
    of the server by avoiding the creation of unnecessary processes.

    * **Servlets are robust**: Servlets are based on Java; they provide all the powerful
    features of Java, such as exception handling and garbage collection, which make
    them robust.

    * **Servlets are portable**: Servlets are also portable because they are developed
    in Java. This enables easy portability across the web servers.

    * **Servlets are persistent**: Servlets increase the system''s performance by
    preventing frequent disk access. For example, if a customer logs on to `www.EarnestOnline.com`,
    the customer can perform many activities, such as checking for the balance, applying
    for a loan, and so on. In every stage, the customer needs to be authenticated
    by checking for the account number against the database; instead of checking for
    the account number against the database every time, Servlets retain the account
    number in the memory till the user logs out of the website.


    ### Comparison between Servlets and Applets


    Applets are Java programs that are embedded in web pages. When a web page containing
    an Applet is opened, the byte code of the applet is downloaded to the client’s
    computer. This process becomes time-consuming as the size of the applet is too
    large. As the Servlets execute on the web server, they help overcome problems
    with the download time faced while using applets. Servlets do not require the
    browser to be Java enabled, unlike the applets, because they execute on the webserver,
    and the results are sent back to the client or the browser. The applet is a depreciated
    technology.


    ### Comparison between Servlets and other server-side scripting technologies


    Common Gateway Interface (`CGI`) scripts, JSP, and ASP are alternatives to Servlets
    and have their advantages and disadvantages.


    #### CGI scripts


    A CGI script is a program that is written in C, C++, or Perl. A CGI script gets
    executed in a server when a server receives a request from the client for processing
    the data. The server passes the request to the CGI script. The CGI script processes
    the request and sends the output in the form of HTML to the server. The server,
    in turn, passes the request to the client.


    The disadvantages of using a CGI script are as follows:


    * Whenever a CGI script is invoked, the server creates a separate process for
    it. The server has a limitation on the number of processes that can be created
    simultaneously. If the number of requests is too high, the server will not be
    able to accept the requests. In addition, the creation of too many processes will
    also bring down the efficiency of the server.

    * The most popular platform for writing a CGI script is Perl. Even though Perl
    is a very powerful language for writing CGI applications, the server needs to
    load the Perl interpreter for each request that it receives. Thus, for an incoming
    request, the executable file of the CGI script and the Perl interpreter is loaded,
    which brings down the efficiency of the server.


    Unlike the CGI scripts, the Servlet initialization code is executed only once.
    In the case of Servlets, each request is handled by a separate thread in the webserver
    more efficiently by preventing the creation of unnecessary processes.


    #### Active Server Pages (ASP)


    ASP is a server-side scripting language that has been developed by Microsoft.
    ASP enables a developer to combine HTML and a Scripting language on the same web
    page. JavaScript and VBScript are two scripting languages that are supported by
    ASP. VBScript and JavaScript can also be used for server-side scripting by using
    the `<script runat=server>` tag. The limitation of ASP is that it is not compatible
    with all the web servers. The other web servers need specific plug-ins to be installed
    to support ASP. However, adding a plug-in can decrease the performance of the
    system.


    ### Working of Servlets


    The client or the browser passes the requests to the server using the `GET` or
    the `POST` methods. For example, a Servlet could be invoked by clicking a user-interface
    component, such as a button on a form or following a hyperlink on a web page.
    After the Servlet processes the request, the output is returned as an HTML page
    to the client.


    The client request consists of the following components:


    * The protocol used for the communication between the server and the client, such
    as `HTTP`.

    * The request type can be `GET` or `POST`.

    * The query string contains additional information such as login name, password,
    and registration details.


    **The following is an example**: `GET`


    ```

    http://www EarnestBank.com/login.xhtml?username="sarika"&passwd="3445H"

    ```


    The preceding URL is used to display a user''s mailbox called "Sarika".


    *[Table 3.1]* describes the different components of the URL:


    | Component | Description |

    | :--- | :--- |

    | HTTP | It is the protocol that is used for communication between the server
    and the client. |

    | www.EarnestBank.com | It is the name of the website. |

    | login.xhtml | It is the name of the form that is displayed to the user. |

    | Username="sarika"&passwd="3445H | These are the values that are passed to the
    server-side program. |


    ***Table 3.1**: Different components of the URL*


    ### The GET and POST methods


    When a client sends a request to the server, the client can also pass additional
    information with the URL to describe what exactly is required as the output from
    the server by using the `GET` method. The additional sequence of characters appended
    to the URL is called a `Query String`. However, the length of the query string
    is limited to 240 characters. Moreover, the query string is visible on the browser
    and is called, therefore, a security risk.


    To overcome these disadvantages, the `POST` method can be used. In the `POST`
    method, a large amount of data can be sent through a separate socket connection.
    The complete transaction is invisible to the client.


    The disadvantage of this method is that it is slower than the `GET` method because
    the data is sent to the server as separate packets.


    ### The Javax.servlet package


    Java supports the implementation of Servlets through the `javax.servlet` and `javax.servlet.http`
    packages. The `javax.servlet` interface provides the general framework for creating
    a Servlet. A Servlet can directly implement this interface or indirectly implement
    the same by extending the `javax.servlet.GenericServlet` or the `Javax.Servlet.http.HttpServlet`
    classes.

