    JDBC URL\")` method from the `DriverManager` class.\n\nThe `getConnection()` method\
    \ of the Driver Manager class attempts to locate the Driver that can connect to\
    \ the database represented by the JDBC URL passed to the `getConnection()` method.\n\
    \n### The JDBC URL\n\nThe JDBC-URL is a string that provides a way of identifying\
    \ a database. A JDBC URL is divided into the following three parts:\n\n`<protocol>:\
    \ <sub protocol> : <subname>`\n\nIn this, `<protocol>` in a JDBC URL is always\
