- fmt: "\nThe database is a repository of information used by the applications. `ODBC\
    \ API` is a set of library routines that enables your programs to access a variety\
    \ of databases. `JDBC` provides a database-programming API for Java programs.\
    \ The `JDBC-ODBC bridge driver` translates the `JDBC API` to the `ODBC API`. There\
    \ are several categories of `JDBC` drivers available, which are as follows:\n\n\
    * JDBC-ODBC bridge + ODBC driver\n* Native API, partly Java driver \n* JDBC-Net,\
    \ pure Java driver\n* Thin Driver\n\nThe `java.sql` package contains the classes\
    \ that help in connecting to a database, sending the embedded SQL statements to\
    \ the database, and processing the query results. The connection object represents\
    \ a connection to a database. The `PreparedStatement` object allows you to execute\
    \ the parameterized queries. The `ResultSet` object provides you with the methods\
    \ to access the data from a table.\n\nMany people do not understand English and\
    \ want messages, currencies, and time in their languages. Internationalization\
    \ helps to do the same. In the next chapter, we will study Internationalization,\
    \ which is the process of customizing an application according to specific languages\
    \ and regions.\n\n## Multiple Choice Questions\n\n1. **The JDBC-ODBC bridge is\
    \ which of the following?**\n   a. Single-Threaded\n   b. Multi-Threaded\n   c.\
    \ None of these\n\n2. **DriverManager is which of the following?**\n   a. Interface\n\
    \   b. Class\n   c. Method\n\n3. **Commit is a method of which of the following?**\n\
    \   a. Connection\n   b. ResultSet\n   c. Statement\n\n4. **Which of the following\
    \ methods are needed for loading a database driver in JDBC?**\n   a. `Class.forName()`\n\
    \   b. `RegisterDriver()`\n   c. None of these\n\n5. **How many JDBC driver types\
    \ does Sun define?**\n   a. One\n   b. Four\n   c. Three\n\n## Answers\n\n1. b\n\
    2. b\n3. a\n4. a\n5. b\n\n## Fill in the blanks\n\n1. ________ is an open-source\
    \ DBMS product that runs on UNIX, Linux, and Windows.\n   **Ans**: MYSQL\n2. `__________________Statement`\
    \ can execute the parameterized queries.\n   **Ans**: Prepared Statement\n3. The_________\
    \ object is returned by the `executeQuery()` method.\n   **Ans**: ResultSet\n\
    4. The __________Symbol is a placeholder that can be replaced by the INPUT parameters\
    \ at runtime.\n   **Ans**: \"?\"\n\n## State True/False\n\n1. JDBC is an API to\
    \ connect to relational-, object- and XML data sources.\n   **Ans**: False\n2.\
    \ The JDBC-ODBC Bridge supports multiple concurrent open statements per connection.\n\
    \   **Ans**: True\n3. JDBC is an API to access the relational databases.\n   **Ans**:\
    \ False\n4. `java.sql` and `javax.sql` packages contain the JDBC Classes and Interfaces.\n\
    \   **Ans**: True\n\n## Questions\n\n1. What is database and database driver?\n\
    2. How many types of drivers are available? Explain.\n3. Write the steps to connect\
    \ with the database.\n4. What is `ResultSet`? What is the return type of `ResultSet`?\n\
    \n## Interview Questions\n\n1. What are the main steps in Java to make JDBC connectivity?\n\
    2. What are the different types of `Statements`?\n3. What is `JDBC`?\n4. Which\
    \ type of `Statement` can execute parameterized queries?\n5. Does the JDBC-ODBC\
    \ Bridge support multiple concurrent open statements?\n\n# CHAPTER 2: Internationalization\
    \ (I18N)\n\n### Introduction\nMany people do not understand English and want messages,\
    \ currencies, and time in their languages. Internationalization helps in the same.\
    \ Internationalization is the process of customizing an application according\
    \ to specific languages and regions. Internationalization has 18 characters in\
    \ it, which is why it is abbreviated as I18N.\n\n### Structure\nIn this chapter,\
    \ we will cover the following:\n* Localization\n* Locale\n* Resource bundle\n\
    * Steps to develop I18N-based application\n* Internationalization\n\n### Objective\n\
    After studying this chapter, you will be able to develop an application and display\
    \ the messages according specific languages and regions.\n\n### Localization (L10N)\n\
    It is a mechanism to create an application in a specific language or region. This\
    \ can be done via the `Locale` object. An object of the `Locale` class represents\
    \ geographical or cultural region. `Locale` class is used to get the information\
    \ about the country language, variant, and so on. A variant represents operating\
    \ system-specific information.\n\n### Locale\nIt is a class in the `java.util`\
    \ package that provides information about the country and the region.\n\n### Constructors\
    \ of Locale Class\nThere are three constructors of the locale class, which are\
    \ as follows:\n* `Locale(String language)`\n* `Locale(String language, String\
    \ country)`\n* `Locale(String language, String country, String variant)`\n\n###\
    \ Commonly used methods of Locale class\nThe following are the commonly used methods\
    \ of the `Locale` class:\n* `public static Locale getDefault()`: It returns the\
    \ instance of current `Locale`.\n* `public static Locale[] getAvailableLocales()`:\
    \ It returns an array of available locales.\n* `public String getDisplayCountry()`:\
    \ It returns the country name of this locale object.\n* `public String getDisplayLanguage()`:\
    \ It returns the language name of this locale object.\n* `public String getDisplayVariant()`:\
    \ It returns the variant code of this locale object.\n* `public String getISO3Country()`:\
    \ It returns the three-letter abbreviation for the current locale's country.\n\
    * `public String getISO3Language()`: It returns the three-letter abbreviation\
    \ for the current locale's language.\n\nThe program to get the information of\
    \ India is as follows:\n\n```java\nimport java.util.Locale;\npublic class LocaleTest\
    \ {\n  public static void main(String[] args) {\n    Locale locale = new Locale(\"\
    hi\", \"IN\");\n    System.out.println(locale.getDisplayCountry());\n    System.out.println(locale.getDisplayLanguage());\n\
    \    System.out.println(locale.getDisplayName());\n    System.out.println(locale.getISO3Country());\n\
    \    System.out.println(locale.getISO3Language());\n    System.out.println(locale.getLanguage());\n\
    \    System.out.println(locale.getCountry());\n  }\n}\n```\n\n**The output is\
    \ as follows**:\nIndia\nHindi\nHindi (India)\nIND\nhin\nhi\nIN\n\n### Resource\
    \ Bundle\nIt is a good practice if the messages or labels used inside the application\
    \ are visible in the user's language, that is, if the user belongs to India, then\
    \ the message is in Hindi, or if the users belong to the United States the messages\
    \ are in English. `Resource Bundle` stores the text and components that are Locale\
    \ sensitive and loads this information from the properties file that contains\
    \ the messages.\n\nThe `java.util.ResourceBundle` class is an abstract class;\
    \ we cannot make the object of the `ResourceBundle` class. Its method helps us\
    \ manage locale-sensitive resources.\n\n### Constructor of ResourceBundle\n* `ResourceBundle()`:\
    \ This is the default constructor mainly designed for use by the subclasses and\
    \ the factory methods.\n\n### Methods of ResourceBundle Class\n* `public static\
    \ ResourceBundle getBundle(String basename)`: It loads the resource bundle with\
    \ the given name and returns the instance of the `ResourceBundle` class.\n"
