    </servlet>\n<servlet-mapping>\n    <servlet-name>Controller</servlet-name>\n \
    \   <url-pattern>/Controller</url-pattern>\n</servlet-mapping>\n<session-config>\n\
    \    <session-timeout>\n        30\n    </session-timeout>\n</session-config>\n\
    </web-app>\n```\n\n以下是 `index.xhtml` 的输出，如图 10.15 所示：\n\n![img](img/185a.png)\n\
    \n**图 10.15**: index.xhtml 的输出\n\n以下是 `logini-success.jsp` 的输出，如图 10.16 所示：\n\n\
    ![img](img/185b.png)\n\n**图 10.16**: logini-success.jsp 的输出\n\n以下是 `login-error.jsp`\
    \ 的输出，如图 10.17 所示：\n\n![img](img/186.png)\n\n**图 10.17**: login-error.jsp 的输出\n\
    \n## 结论\n\n在本章中，我们学习了 JSP 动作如 `useBean`、`getProperty`、`setProperty` 和 `forward`，它们用于执行插入文件、重用\
    \ bean、将用户转发到另一个页面以及实例化对象等任务。自定义标签库提供了一种机制，程序员可以通过该机制封装重复的代码或任务，并在多个应用程序中重用。像\
    \ XML 和 HTML 标签这样的自定义标签包含开始标签、结束标签和主体。自定义标签可以分为简单标签、体标签、带属性的标签或嵌套标签。属性包含可以用于自定义标签行为的参数。\n\
    \n创建标签处理器和 TLD 文件是为了在 JSP 文件中实现自定义标签的功能。标签处理器用于定义自定义标签，并源自 `javax.servlet.tagext`\
    \ 包，该包实现了 `TagBody` 接口。标签处理器 own 由 `doStartTag()`、`doEndTag()` 和 `release()` 方法组成。\n\
    \n标签库定义 (`TLD`) 是一个包含标签库描述的 XML 文件，它包含：\n* 标签库描述\n* TLD 版本\n* 标签名称\n* 属性\n\nJSP\
    \ 错误可以分为编译时错误或运行时错误。\n\n"
- fmt: "\n* **Various result types**: We can use `JSP`, `freemarker`, `velocity`,\
    \ etc technologies as a result in `struts2`. `Velocity` and `freemarker` is a\
    \ templating engine based on Java. Both are a free and open-source web framework\
    \ that's meant to be used as a view component in the MVC architecture.\n\n* **Various\
    \ tag supports**: To make the `struts2` applications easier, `Struts2` includes\
    \ many sorts of tags, such as UI tags, Data tags, Control tags, and so on.\n\n\
    * **Theme and Template support**: `Struts2` supports three different types of\
    \ themes – `XHTML`, `simple`, and `CSSXHTML`. The default theme for `struts2`\
    \ is `XHTML`. For a consistent appearance and feel, themes and templates can be\
    \ employed.\n\n## Components of Struts2\n\nThe Model-View-Controller pattern in\
    \ `struts2` is implemented with the following five core components:\n\n* **Actions**:\
    \ `Action` class. The `Action` class is responsible for maintaining the state\
    \ and request processing. `Action` class is a Plain Java class which has a `getter`,\
    \ `setter`, and an `execute` method. It represents the MODEL part of the MVC pattern.\n\
    \n* **Controller**: In `struts2`, a controller is responsible for identifying\
    \ the incoming requests, selecting the appropriate action classes for the processing,\
    \ and finally searching the `JSP` or `HTML` files to display the response. `Controller`\
    \ class (`org.apache.struts2.dispatcher.FilterDispatcher`) is provided by the\
    \ `struts` framework.\n\n* **Interceptors**: `Interceptors` are the helper component\
    \ for the container that contains the cross-cutting logic and can be extended\
    \ in the following two cases:\n    * Before the execution of `Action`\n    * After\
    \ the execution of `Action`\n\nTherefore, an interceptor is an object invoked\
    \ at the preprocessing and postprocessing of a request. In `Struts 2`, `Interceptor`\
    \ is used to perform operations such as validation, exception handling, internationalization,\
    \ displaying intermediate results, and so on.\n\n* **Value Stack**: A `Value Stack`\
    \ is simply a stack that contains the application-specific objects such as action\
    \ objects and other model objects. `Value stack` fetches the object through the\
    \ `struts` tag with the help of an expression called `OGNL` (Object Graph Navigation\
    \ language). A `value stack` is a storage area where the data is stored for processing\
    \ the client requests.\n\n* **Results/Result types**: In `struts2`, the result\
    \ component is responsible for identifying the appropriate `JSP` or `HTML` to\
    \ display the data to the client. We can also customize this component according\
    \ to the requirement.\n\n* **View technologies**. It is an `HTML` or `JSP` file\
    \ that is used to display the information to the user.\n\n## Architecture of Struts2\n\
    \n`Struts2` Architecture is different from the traditional MVC Pattern. Here,\
    \ `Action` is a Model, and the controller class is maintained by the `struts2`\
    \ Framework. In `Struts 2`, `Servlet Filter` (`Filter Dispatcher`) looks at the\
    \ request, and then as per the mapping of the `URL`, the request is forwarded\
    \ to the appropriate `Action Class`, as shown in [Figure 11.1]:\n\n![img](images/193.png)\n\
    \n**Figure 11.1**: Architecture of `Strut2`\n\nIn [Figure 11.1], **Browser** sends\
    \ a request. The request passes to the **Controller.** The Controller is implemented\
    \ with a `Struts2` dispatch servlet filter and the interceptors. The Controller\
    \ finds the appropriate action class, sends the request, sets the parameters,\
    \ and calls the `execute()` method. The configured interceptor functionalities\
    \ apply, such as validation, file upload, and so on. Finally, the view prepares\
    \ the result and returns it to the user.\n\n## Creating a Struts Application\n\
    \nThe following are the steps to create a Struts Application:\n\n1. Create the\
    \ `index.xhtml`.\n2. Create the action class `Login.java`.\n3. Create the view\
    \ `Welcome.jsp` and `Invalid.jsp`.\n4. Add the Struts configuration in `struts.xml`.\n\
    5. Add the filter in `web.xml`.\n6. Build the WAR file and run the application.\n\
    \nRefer to the following code example:\n\n**index.xhtml**\n\n```html\n<html>\n\
    \    <head>\n        <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    >\n        <title>JSP Page</title>\n    </head>\n    <body>\n        <form action=\"\
    login.action\">\n            User Name<input type=\"text\" name=\"uname\"/><br>\n\
    \            <input type=\"submit\" value=\"submit\"/>\n        </form>\n    </body>\n\
    </html>\n```\n\n**Action class-Login.java**:\n\n```java\npackage p1;\n\npublic\
    \ class Login\n{\n    private String uname;\n    public String execute()\n   \
    \ {\n        if(uname.equals(\"Sarika\"))\n            return(\"Success\");\n\
    \        else\n            return(\"Invalid\");\n    }\n    public String getUname()\n\
    \    {\n        return uname;\n    }\n    public void setUname(String uname)\n\
    \    {\n        this.uname = uname;\n    }\n}\n```\n\n**Welcome.jsp**\n\n```html\n\
    <%@page contentType=\"text/html\" encoding=\"UTF-8\"%>\n<!DOCTYPE html>\n<html>\n\
    \    <head>\n        <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    >\n        <title>JSP Page</title>\n    </head>\n    <body>\n        Welcome\n\
    \        <%@ taglib uri=\"/struts-tags\" prefix=\"s\" %>\n        <s:property\
    \ value=\"uname\"/>\n    </body>\n</html>\n```\n\n**Invalid.jsp**\n\n```html\n\
    <%@page contentType=\"text/html\" encoding=\"UTF-8\"%>\n<!DOCTYPE html>\n<html>\n\
    \    <head>\n        <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    >\n        <title>JSP Page</title>\n    </head>\n    <body>\n        Invalid\n\
    \        <s:property value=\"uname\"/>\n    </body>\n</html>\n```\n\n**struts.xml**\n\
    \n```xml\n<?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE struts PUBLIC\
    \ \"-////Apache Foundation//DTD Struts Configuration 2.0//EN\"\n\"http://struts.apache.org/dtds/struts-2.0.dtd\"\
    >\n<struts>\n    <package name=\"default\" extends=\"struts-default\">\n     \
    \   <action class=\"p1.Login\" name=\"login\">\n            <result name=\"Success\"\
    >welcome.jsp</result>\n            <result name=\"Invalid\">invalid.jsp</result>\n\
    \        </action>\n    </package>\n</struts>\n```\n\n**web.xml**\n\n```xml\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<web-app version=\"3.1\" xmlns=\"\
    http://java.jcp.org/xml/ns/javaee\" xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\"\
    \ xsi:schemaLocation=\"http://java.jcp.org/xml/ns/javaee http://xmlns.jcp.org/xml/ns/javaee/web-app_3_1.xsd\"\
    >\n    <filter>\n        <filter-name>struts2</filter-name>\n        <filter-class>org.apache.struts2.dispatcher.FilterDispatcher</filter-class>\n\
    \    </filter>\n    <filter-mapping>\n        <filter-name>struts2</filter-name>\n\
    \        <url-pattern>/*</url-pattern>\n    </filter-mapping>\n</web-app>\n```\n\
    \n**OUTPUT:**\n\nThe following is the output of index.jsp, as shown in [Figure\
    \ 11.2]:\n\n![img](images/196.png)\n\n**Figure 11.2**: Output of index.jsp\n\n\
    The following is the output of welcome.jsp, as shown in [Figure 11.3]:\n\n![img](images/197a.png)\n\
    \n**Figure 11.3**: Output of Welcome.jsp\n\nThe following is the output of index.xhtml,\
    \ as shown in [Figure 11.4]:\n\n![img](images/197b.png)\n\n**Figure 11.4**: Output\
    \ of index.xhtml\n\nThe following is the output of invalid.jsp, as shown in [Figure\
    \ 11.5]:\n\n![img](images/197c.png)\n\n**Figure 11.5**: Output of Invalid.jsp\n"
