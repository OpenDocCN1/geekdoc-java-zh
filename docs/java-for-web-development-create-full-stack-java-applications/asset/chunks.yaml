  trans: "\n\n*   `public abstract void includes (ServletRequest request, ServletResponse\
    \ response) throws ServletException, IOException`: 此函数也用于像 `forward()` 函数一样从一个\
    \ servlet 调用另一个 servlet；然而，你也可以将第一个 servlet 的输出与当前输出合并。第一个 servlet 在调用 `include()`\
    \ 方法后，仍然可以使用 `PrintWriter` 对象。\n\n| 注意事项 |\n| :--- |\n| Servlet 链（Servlet chaining）是一种按特定顺序执行多个\
    \ servlet 以完成某项事务的技术。一个 servlet 可以调用另一个 servlet 来执行事务的下一步。上一个 servlet 的输出将发送回给浏览器或客户端。这种技术可以与\
    \ Linux 中的管道（pipes）概念相比较，其中一个命令的输出被重定向到另一个命令。 |\n| . 在 Servlet 链的过程中：首先，我们必须为需要链链的资源创建一个\
    \ `RequestDispatcher`。然后，如果需要，必须为请求设置属性值。接下来，我们需要在 `RequestDispatcher` 对象上调用 `forward()`\
    \ 方法或 `include()` 方法。 |\n\n## 通过问题描述实现 Servlet 间通信\n\n你需要将钱存入账户。创建一个 servlet 来接收并验证用户的账号号码和\
    \ PIN。第一个 servlet 用于验证账号和 PIN。如果值有效，则创建并分配名为 account number 的属性并输入账号。否则，将向用户显示错误消息并包含\
    \ `index.xhtml`。如果账号和 PIN 有效，则将请求转发到第二个 servlet 并调用它。\n\n## 任务列表\n\n*   编写客户端界面（`index.xhtml`）：HTML\
    \ 表单接收用户的账号号码和 PIN。\n*   编写两个 servlet 的代码：点击提交按钮后，将调用 servlet 验证账号号码和 PIN，并将请求转发到第二个\
    \ servlet。然后，第二个 servlet 授予存款或取款金额的权限。\n*   编译并部署 servlet：在部署描述符 `web.xml` 中配置\
    \ servlet 的条目。编译并运行程序。\n*   验证 servlet 的功能：验证程序是否显示了有效结果。\n\n为了解决这个问题，我们将使用 `RequestDispatcher`\
    \ 接口。问题规定，第一个 servlet 需要接收用户的账号号码和 PIN 并对其进行验证。如果账号有效，则需要调用第二个 servlet。\n\n##\
    \ 客户端界面\n\nHTML 表单包含两个文本框，分别接收账号号码和 PIN。点击提交按钮后，将调用第一个 servlet。\n\n## index.xhtml\n\
    \n```html\n<html\n<head>\n    <title>Our Bank</title>\n</head>\n<body>\n    <div>\n\
    \        <CENTER>\n            <h1>MY BANK </h1>\n        </CENTER>\n        <FORM\
    \ action=\"firstServlet\">\n            <table>\n                <tr>\n      \
    \              <td>Enter the account Number</td>\n                    <td><input\
    \ type=\"text\" name=\"accnum\"></td>\n                </tr>\n               \
    \ <tr>\n                    <td>Enter the Pin Number </td>\n                 \
    \   <td><input type=\"password\" name=\"pinnum\"></td>\n                </tr>\n\
    \            </table>\n            <br>\n            <center><input type=SUBMIT\
    \ value=\"SUBMIT\"></center>\n        </FORM>\n    </div>\n</body>\n</html>\n\
    ```\n\n以下是输出，如图 6.1 所示：\n\n![img](img/103.png)\n**图 6.1：index.xhtml 的输出（客户端界面）**\n\
    \n## FirstServlet 的代码\n\n第一个 servlet 用于验证账号号码和 PIN。如果值有效，将创建一个名为 account number\
    \ 的属性并输入账号。否则，将向用户显示错误消息。如果账号和 PIN 有效，则将请求转发到第二个 servlet 并调用它，如下：\n\n```java\n\
