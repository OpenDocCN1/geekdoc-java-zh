    [**Model View Controller (MVC) Architecture in JSP**](#toc.xhtml_aa161)


    MVC is a software design pattern that separates presentation logic from business
    logic and data. It has three interconnected elements, which are as follows:


    *   Model


    *   View


    *   Controller


    The Model defines the business logic of the application. It is independent of
    the user interface. The Controller manages the flow of the application. The Controller
    fetches the data from the Model and gives it to the View. The View defines the
    presentation layer of the application. The Model consists of simple Java classes,
    the Controller consists of servlets, and the View consists of the JSP pages.


    **The following are the characteristics of MVC Pattern**:


    *   It separates the presentation layer from the business layer.


    *   The Controller invokes the Model and sends the data to View.


    *   The Model is not even aware that it is used by some web application or a desktop
    application.


    *   Navigation control is centralized.


    *   It is easy to maintain the large application.


    Refer to *[Figure 10.14](#chap10.xhtml_fig10.14)* that illustrates the MVC architecture:


    ![img](images/180.png)


    ***Figure 10.14**: MVC Architecture*


    [**MVC Example in JSP**](#toc.xhtml_aa162)


    In the preceding figure, we use a servlet as a controller, JSP as a view component,
    and Java Bean class as a model.


    In this example, we have created the following five pages:


    *   **index.xhtml**: A page that gets the input from the user.


    *   **Controller.java**: A servlet that acts as a controller.


    *   **login-success.jsp** and **login-error.jsp** files: Acts as view components.


    *   **web.xml**: File for mapping the servlet.


    **Example**:


    **index.xhtml****:**


    <html>


        <body>


                <form action="Controller" method="post">


                  Name:<input type="text" name="name"><br>


                  Password:<input type="password" name="password"><br>


                  <input type="submit" value="login">


                </form>


            </body>


    </html>


    **Controller.java**:


    package IOL;


    import java.io.IOException;


    import java.io.PrintWriter;


    import javax.servlet.RequestDispatcher;


    import javax.servlet.ServletException;


    import javax.servlet.http.HttpServlet;


    import javax.servlet.http.HttpServletRequest;


    import javax.servlet.http.HttpServletResponse;


    public class Controller extends HttpServlet


     {


        @Override


        protected void doPost(HttpServletRequest request, HttpServletResponse response)


                throws ServletException, IOException


     {


          response.setContentType("text/html");


          PrintWriter out=response.getWriter();


          String name=request.getParameter("name");


          String password=request.getParameter("password");


          LoginBean bean=new LoginBean();


          bean.setName(name);


          bean.setPassword(password);


          request.setAttribute("bean",bean);


          boolean status=bean.validate();


           if(status)


           {


              RequestDispatcher rd=request.getRequestDispatcher("logini-success.jsp");


              rd.forward(request, response);


            }


            else


            {


              RequestDispatcher rd=request.getRequestDispatcher("login-error.jsp");


              rd.forward(request, response);


            }


         }


        @Override


        public String getServletInfo() {  return "MVC"; }


    }


    **Login Bean.jsp**:


    package IOL;


    public class LoginBean


    {


      private String name,password;


      public String getName()


    {


        return name;


    }


    public void setName(String name)


     {


        this.name = name;


    }


    public String getPassword()


    {


        return password;


    }


    public void setPassword(String password)


     {


    this.password = password;


    }


    public boolean validate()


    {


        if(password.equals("admin"))


    {


            return true;


          }


        else


    {


            return false;


        }


    }


    }


