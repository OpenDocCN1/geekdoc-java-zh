    \        <session-timeout>\n            30\n        </session-timeout>\n    </session-config>\n\
    </web-app>\n```\n\n"
- fmt: "\nThe following is the output of `index.xhtml` as shown in [Figure 4.4](#chap04.xhtml_fig4.4):\n\
    \n![img](images/76a.png)\n\n**Figure 4.4**: Output of `index.xhtml`\n\nThe following\
    \ is the output of the action page as shown in [Figure 4.5](#chap04.xhtml_fig4.5)\
    \ and [Figure 4.6](#chap04.xhtml_fig4.6):\n\nActionPage\n\n![img](images/76b.png)\n\
    \n**Figure 4.5**: Output of Action Page*\n\n**Action Page**: ( If either user\
    \ name or password is incorrect):\n\n![img](images/76c.png)\n\n**Figure 4.6**:\
    \ Output of Action Page*\n\n## [Conclusion](#toc.xhtml_aa70)\n\nIn this chapter,\
    \ you learned that HTTP stands for HyperText Transfer Protocol, and it is a network\
    \ protocol used on the web. It runs on top of TCP/IP. `HttpServleterv` is an abstract\
    \ class that extends the generic servlet and adds the functionality of the HTTP\
    \ protocol. HTTP uses the request/response model – the user makes a request, and\
    \ the webserver gives an HTTP response to the browser, and the browser displays\
    \ it to the user. If the response from the server is an HTML Page, the HTML is\
    \ added to the HTTP Response. `HTTPSRequestRequest` and `HttpServletResponse`\
    \ are two interfaces used to exchange the information between the user and the\
    \ webserver. An HTTP request includes the request URL. The additional sequence\
    \ of characters that are appended to the URL is called a query string. The GET\
    \ request appends the query string at the end of the URL. The POST method appends\
    \ the query string or data in the body of the request.\n\nIn the next chapter,\
    \ you will learn about the sessions as HTTP cannot remember the activity of the\
    \ previous page. HTTP is a stateless protocol. This means it does not have any\
    \ information regarding the HTTP page. To remember the state or send the information\
    \ from one page to another, we need to maintain the sessions.\n\n## [Questions](#toc.xhtml_aa71)\n\
    \n1. What is the difference between the Get and Post methods?\n2. What is the\
    \ difference between `GenericServlet` and `HttpServlet`?\n3. How is `PrintWriter`\
    \ different from `ServletOutputStream`?\n4. Which HTTP method is non-idempotent?\n\
    \n## [Multiple Choice Questions](#toc.xhtml_aa72)\n\n**1. What type of servlets\
    \ use these methods – `doGet()`, `doPost()`, `doHead`, `doDelete()`, `doTrace()`?**\n\
    a. Generic Servlets\nb. `HttpServlets`\nc. All of the above\nd. None of the above\n\
    **Answer**: `HttpServlets`\n\n**2. Web server is used for loading the `init()`\
    \ method of the servlet.**\na. True\nb. False\n**Answer**: True\n\n**3. Which\
    \ packages represent the interfaces and classes for servlet API?**\na. `javax.servlet`\n\
    b. `javax.servlet.http`\nc. Both A & B\nd. None of the above\n**Answer**: `javax.servlet`\n\
    \n**4. Which class can handle any type of request so that it is protocol-independent?**\n\
    a. `GenericServlet`\nb. `HttpServlet`\nc. Both A & B\nd. None of the above\n**Answer**:\
    \ `Generic Servlet`\n\n**5. Which HTTP request method is non-idempotent?**\na.\
    \ GET\nb. POST\nc. BOTH A & B\nd. None of the above\n**Answer**: POST\n\n**6.\
    \ Which object is created by the web container at the time of deploying the project?**\n\
    a. `ServletConfig`\nb. `ServletContext`\nc. Both A & B\nd. None of the above\n\
    **Answer**: `ServletContext`\n\n## [CHAPTER 5](#toc.ch05)\n\n###Working with Servlet\
    \ Sessions](#toc.ch05)\n\n### [Introduction](#toc.aa73)\nHTTP cannot remember\
    \ the activity of the previous page. HyperText Transfer Protocol (HTTP) is a stateless\
    \ protocol. This means it does not have any information regarding the HTTP page.\
    \ To remember the state or send the information from one page to another, we need\
    \ to maintain the sessions.\n\n### [Structure](#toc.aa74)\nA session is a group\
    \ of activities performed by a user while accessing a particular website. The\
    \ process of keeping track of the settings across the sessions is called session\
    \ tracking. Consider the example of an online mall. The user can choose a product\
    \ and add it to the shopping cart. When the user moves to a different page, the\
    \ details in the shopping cart are still retained so the user can check the items\
    \ in the shopping cart and then place the order. If the user selected, then more\
    \ are displayed to the user.\n\n###Techniques to keep track of sessions in servlets](#toc.aa77)\n\
    By default, the data across the sessions cannot be stored using HTTP because it\
    \ is a stateless protocol. However, certain techniques help store the session\
    \ using HTTP. They are as follows:\n* URL rewriting\n* Hidden form\n* `HttpSession`\n\
    \n### [URL rewriting](#toc.aa78)\nThis is a technique by which the URL is modified\
    \ to include the session ID of a particular user and is sent back to the client.\
    \ In any transaction, the client is forced to use the session ID when it sends\
    \ a request to the server. If a session ID does not exist, then a session ID is\
