- fmt: "\n```xml\n<taglib version=\"2.1\" xmlns=\"http://java.sun.com/xml/ns/javaee\"\
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"\
    http://java.sun.com/xml/ns/javaee http://java.sun.com/xml/ns/javaee/web-jsptaglibrary_2_1.xsd\"\
    >\n  <tlib-version>1.0</tlib-version>\n  <jsp-version>1.0</jsp:version>\n  <uri>/WEB-INF/tlds/MYTLD</uri>\n\
    \  <tag>\n    <name>bank</name>\n    <tag-class>IOL.TagHandlerBank</tag-class>\n\
    \    <body-content>empty</body-content>\n    <attribute>\n      <name>Name</name>\n\
    \      <required>true</required>\n      <type>java.lang.String</type>\n    </attribute>\n\
    \  </tag>\n</taglib>\n```\n\n### JSP File\n```html\n<html>\n<body>\n  <%@ tagliburi=\"\
    WEB-INF/tlds/MYTLD.tld\" prefix=\"n\" %>\n  <n:bank Name=\"My Bank\"></n:bank>\n\
    </body>\n</html>\n```\n\n### Expression Language (EL)\nThe `Expression Language`\
    \ (`EL`) simplifies the accessibility of the data stored in the `Java Bean` component\
    \ and other objects like `request`, `session`, `application`, and so on. There\
    \ are many implicit objects, operators, and reserve words in `EL`. It is the newly\
    \ added feature in the JSP technology version 2.0.\n\n#### Syntax:\n`${ expression\
    \ }`\n\n#### Example: In the following example, `El.jsp` uses the `param` object\
    \ to get the request `Parameter`:\n\n**index.jsp**:\n```html\n<html>\n<body>\n\
    \  <form action=\"El.jsp\">\n    Enter Name :<input type=\"text\" name=\"name\"\
    \ /><br/><br/>\n    <input type=\"submit\" value=\"submit\"/>\n  </form>\n</body>\n\
    </html>\n```\n\n**el.jsp:**\n```jsp\n<%@page contentType=\"text/html\" pageEncoding=\"\
    UTF-8\"%>\n<!DOCTYPE html>\n<html>\n<body>\n    Welcome, ${ param.name }\n</body>\n\
    </html>\n```\n\nThe following is the output of `index.xhtml`, as shown in [Figure\
    \ 10.10:](#chap10.xhtml_fig10.10).\n\n![img](images/177a.png)\n**Figure 10.10**:\
    \ Output of index.xhtml\n\nThe following is the output of `el.jsp`, as shown in\
    \ [Figure 10.11:](#chap10.xhtml_fig10.11).\n\n![img](images/177b.png)\n**Figure\
    \ 10.11**: Output of El.jsp\n\nThere are many implicit objects used by the Expression\
    \ language. Some implicit objects are listed in [Table 10.9](#chap10.xhtml_tab10.9):\n\
    \n| S.No | Implicit Objects | Usage |\n| :--- | :--- | :--- |\n| 1 | `pageScope`\
    \ | It maps the given attribute name with the value set in the page scope. |\n\
    | 2 | `requestScope` | It maps the given attribute name with the value set in\
    \ the request scope. |\n| 3 | `sessionScope` | It maps the given attribute name\
    \ with the value set in the session scope. |\n| 4 | `applicationScope` | It maps\
    \ the given attribute name with the value set in the application scope. |\n| 5\
    \ | `param` | It maps the request parameter to the single value. |\n| 6 | `paramValues`\
    \ | It maps the request parameter to an array of values. |\n| 7 | `header` | It\
    \ maps the request header name to the single value. |\n| 8 | `headerValues` |\
    \ It maps the request header name to an array of values. |\n| 9 | `cookie` | It\
    \ maps the given cookie name to the cookie value. |\n| 10 | `initParam` | It maps\
    \ the initialization parameter. |\n| 11 | `pageContext` | It provides access to\
    \ many objects request, session, and so on. |\n\n**Table 10.9**: Implicit Objects\n\
    \n#### The following is an example of Session and Cookie:\n\n**index.jsp**:\n\
    ```jsp\n<%@page contentType=\"text/html\" pageEncoding=\"UTF-8\"%>\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n<%\n  session.setAttribute(\"user\",\"Sarika\");\n  Cookie\
    \ ck=new Cookie(\"pwd\",\"sailboat\");\n  response.addCookie(ck);\n%>\n  <a href=\"\
    process.jsp\">visit</a>\n</body>\n</html>\n```\n\n**Process.jsp**:\n```jsp\n<%@page\
    \ contentType=\"text/html\" pageEncoding=\"UTF-8\"%>\n<!DOCTYPE html>\n<html>\n\
    <head>\n  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    >\n  <title>JSP Page</title>\n</head>\n<body>\n    Name= ${ sessionScope.user\
    \ }\n    Your Password = ${cookie.pwd.value}\n</body>\n</html>\n```\n\nThe following\
    \ is the output of `index.jsp`, as shown in [Figure 10.12:](#chap10.xhtml_fig10.12).\n\
    \n![img](images/179a.png)\n**Figure 10.12**: Output of index.jsp\n\nThe following\
    \ is the output of `process.jsp`, as shown in [Figure 10.13:](#chap10.xhtml_fig10.13).\n\
    \n![img](images/179b.png)\n**Figure 10.13**: Output of Process.jsp\n\n### Model\
    \ View Controller (MVC) Architecture in JSP\nMVC is a software design pattern\
    \ that separates presentation logic from business logic and data. It has three\
    \ interconnected elements, which as follows:\n- `Model`\n- `View`\n- `Controller`\n\
    \nThe `Model` defines the business logic of the application. It is independent\
    \ of the user interface. The `Controller` manages the flow of the application.\
    \ It fetches the data from the `Model` and gives it to the `View`. The `View`\
    \ defines the presentation layer of the application. The `Model` consists of simple\
    \ Java classes, the `Controller` consists of servlets, and the `View` consists\
    \ of JSP pages.\n\n**The following are characteristics of MVC Pattern**:\n- It\
    \ separates the presentation layer from the business layer.\n- The `Controller`\
    \ invokes the `Model` and sends the data to `View`.\n- The `Model` is not even\
    \ aware it is used by some web application or a desktop application.\n- Navigation\
    \ control is centralized.\n- It is easy to maintain the large application.\n\n\
    Refer to [Figure 10.14](#chap10.xhtml_fig10.4) that illustrates the MVC:\n\n![img](images/180.png)\n\
    **Figure 10.4**: MVC Architecture\n\n#### Example in JSP\nIn the preceding figure,\
    \ we use a servlet as a controller, `JSP` as a view component, and Java Bean class\
    \ as a model. In this example, we have created the following pages:\n- `index.xhtml`:\
    \ A page that gets the input from the user.\n- `Controller.java`: A servlet that\
    \ acts as controller.\n- `login-success.jsp` and `login-error.jsp`: Acts as view\
    \ components.\n- `web.xml`: File for mapping the servlet.\n\n**Example:\n\nindex.xhtml**:\n\
    ```html\n<html>\n  <body>\n    <form action=\"Controller\" method=\"post\">\n\
    \      Name:<input type=\"text\" name=\"name\"><br>\n      Password:<input type=\"\
    password\" name=\"password\"><br>\n      <input type=\"submit\" value=\"login\"\
    >\n    </form>\n  </body>\n</html>\n```\n\n**Controller.java**:\n```java\npackage\
    \ IOL;\nimport java.io.IOException;\nimport java.io.PrintWriter;\nimport javax.servlet.RequestDispatcher;\n\
    import javax.servlet.ServletException;\nimport javax.servlet.http.HttpServletRequest;\n\
    import javax.servlet.http.HttpServletResponse;\npublic class Controller extends\
    \ HttpServlet {\n  @Override\n  protected void doPost(HttpServletRequest request,\
    \ HttpServletResponse response) throws ServletException, IOException {\n    response.setContentType(\"\
    text/html\");\n    PrintWriter out=response.getWriter();\n    String name=request.getParameter(\"\
    name\");\n    String password=request.getParameter(\"password\");\n    LoginBean\
    \ bean=new LoginBean();\n    bean.setName(name);\n    bean.setPassword(password);\n\
    \    request.setAttribute(\"bean\",bean);\n    boolean status=bean.validate();\n\
    \    if(status) {\n      RequestDispatcher rd=request.getRequestDispatcher(\"\
    logini-success.jsp\");\n      rd.forward(request, response);\n    } else {\n \
    \     RequestDispatcher rd=request.getRequestDispatcher(\"login-error.jsp\");\n\
    \      rd.forward(request, response);\n    }\n  }\n  @Override\n  public String\
    \ getServletInfo() { return \"MVC\"; }\n}\n```\n\n**Login Bean Bean**:\n```java\n\
    package IOL;\npublic class LoginBean {\n  private String name,password;\n  public\
    \ String getName() {\n    return name;\n  }\n  public void setName(String name)\
    \ {\n    this.name = name;\n  }\n  public String getPassword() {\n    return password;\n\
    \  }\n  public void setPassword(String password) {\n    this.password = password;\n\
    \  }\n  public boolean validate() {\n    if(password.equals(\"admin\")) {\n  \
    \    return true;\n    } else {\n      return false;\n    }\n  }\n}\n```\n\n**Logini-success.jsp**:\n\
    ```jsp\n<%@page contentType=\"text/html\" pageEncoding=\"UTF-8\"%>\n<!DOCTYPE\
    \ html>\n<html>\n  <head>\n    <meta http-equiv=\"Content-Type\" content=\"text/html;\
    \ charset=UTF-8\">\n```\n"
