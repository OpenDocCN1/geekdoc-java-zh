  trans: "\n\n当客户端向服务器发送请求时，客户端也可以使用 `GET` 方法通过 URL 传递额外信息，以描述服务器需要输出的具体内容。附加在 URL\
    \ 后的额外字符序列被称为 `query string`（查询字符串）。然而，查询字符串的长度限制为 240 个字符。此外，查询字符串在浏览器上可见可见，因此可能存在安全风险。\n\
    \n为了克服这些缺点，可以使用 `post` 方法。`POST` 方法通过独立的 socket 连接以数据包的形式发送数据。整个事务过程对客户端是不可见的。这种方法的缺点是比\
    \ `GET` 方法慢，因为数据是作为单独的数据包发送到服务器。\n\n*表 4.1* 显示了 GET 和 POST 方法之间的区别：\n\n| Get |\
    \ Post |\n| :--- | :--- |\n| 数据限制为 240 个字符 | 可以发送大量数据。 |\n| 不安全 | 安全。 |\n| 可以书签\
    \ | 不可以书签。 |\n| 等幂等的 | 非等等的。 |\n| 高效 | 效率较低且速度慢。 |\n\n**表 4.1：Get 和 Post 方法的区别**\n\
    \n以下是一个用于跟踪访问 Web 应用程序或网站的用户数的应用程序示例：\n\n```java\nimport java.io.IOException;\n\
    import java.io.PrintWriter;\nimport javax.servlet.ServletConfig;\nimport javax.servlet.ServletException;\n\
    import javax.servlet.http.HttpServlet;\nimport javax.servlet.http.HttpServletRequest;\n\
    import javax.servlet.http.HttpServletResponse;\n\n/**用于跟踪网站访问人数的计数器 */\npublic\
    \ class HitCountServlet extends HttpServlet {\n    static int count;\n\n    public\
    \ void init(ServletConfig config) throws ServletException {\n        super.init(config);\n\
    \    }\n\n    protected void doGet(HttpServletRequest request, HttpServletResponse\
    \ response)\n            throws ServletException, IOException {\n        count++;\n\
    \        response.setContentType(\"text/html;charset=UTF-8\");\n        try (PrintWriter\
    \ out = response.getWriter()) {\n            out.println(\"<!DOCTYPE html>\");\n\
    \            out.println(\"<html>\");\n            out.println(\"<head>\");\n\
    \            out.println(\"<title>Servlet HitCountServlet</title>\");\n      \
    \      out.println(\"</head>\");\n            out.println(\"<body>\");\n     \
    \       out.println(\"<h1>You are user \" + String.valueOf(count) + \" Visiting\
    \ our website</h1>\");\n            out.println(\"</body>\");\n            out.println(\"\
    </html>\");\n        }\n    }\n\n    @Override\n    public String getServletInfo()\
    \ {\n        return \"Hit count\";\n    }\n}\n```\n\n上述示例的输出如图 4.3 所示。\n\n**图\
    \ 4.3：前一个程序的结果**\n\n在例示例中，使用了以下方法：\n\n- 需要需要在 `HitCountServlet` 类中编写 `init()`\
    \ 方法，以将访问计数器初始化为零。当服务器启动时 servlet 加载到内存中，或者手动使用某些管理工具时，该方法会被自动调用。\n- 需要编写 `doGet()`\
    \ 方法，以便每当客户端请求主页时增加访问计数器。注意：如果客户端没有显式指定请求类型，则默认调用 `doGet()` 方法。\n\n`HttpServletRequest`\
    \ 接口扩展了 `ServletRequest` 接口，为 servlet 提供请求信息，例如内容类型、内容长度、参数名和值、头部信息等。它位于 `javax.servlet.http`\
    \ 包中。\n\n*表 4.2* 显示了 `ServletRequest` 接口的方法：\n\n| 方法 |  |\n| :--- | :--- |\n|\
    \ `public String getParameter(String name)` | 用于通过名称获取参数值。 |\n| `public String[]\
    \ getParameterValues(String name)` | 返回包含给定参数名所有值的 String 数组。主要用于获取多选择列表框的值。 |\n\
    | `java.util.Enumeration getParameterNames()` | 返回所有参数名的枚举器。 |\n| `public int\
    \ getContentLength()` | 返回请求实体数据的大小，如果未知则返回 -1。 |\n| `public String getCharacterEncoding()`\
    \ | 返回此请求输入的的字符集编码。 |\n| `public String getContentType()` | 返回请求实体数据的互联网媒体类型，如果未知则返回\
    \ null。 |\n| `public ServletInputStream getInputStream() throws IOException` |\
    \ 返回一个用于读取请求体中二进制数据的输入流。 |\n| `public abstract String getServerName()` | 返回接收请求的服务器主机名。\
    \ |\n| `public int getServerPort()` | 返回接收此请求的端口号。 |\n\n**表 4.2：ServletRequest\
    \ 接口的方法**\n\n借助 `ServletRequest` 接口的帮助，服务器可以获取用户传递的参数，对其进行处理，并将结果返回给用户。这可以通过登录表单示例来解释，用户输入用户名和密码。Servlet\
    \ 使用了 `getParameter` 方法返回用户名和密码的值，并检查用户名和密码是否有效。\n\n### 示例\n\n**index.xhtml**:\n\
    ```html\n<!DOCTYPE html>\n<html>\n<body>\n    <h1>The Login Form</h1>\n    <form\
    \ method=\"post\" action=\"/LoginForm/actionpage\">\n        <label for=\"fname\"\
    >User name:</label>\n        <input type=\"text\" id=\"uname\" name=\"Uname\"\
    ><br><br>\n        <label for=\"lname\">Password:</label>\n        <input type=\"\
    text\" id=\"pwd\" name=\"pwd\"><br><br>\n        <input type=\"submit\" value=\"\
    Submit\">\n    </form>\n</body>\n</html>\n```\n\n**Actionpage.java**:\n```java\n\
