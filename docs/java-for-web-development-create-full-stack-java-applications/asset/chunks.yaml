  trans: "\n数据库是应用程序使用的信息存储库。`ODBC API` 是一组库例程，允许你的程序访问各种数据库。`JDBC` 为 Java 程序提供了一个数据库编程\
    \ API。`JDBC-ODBC bridge driver` 将 `JDBC API` 翻译为 `ODBC API`。可用的 `JDBC` 驱动有几类，如下：\n\
    \n* JDBC-ODBC 桥接 + ODBC 驱动\n* 原生 API，部分为 Java 驱动\n* JDBC-Net，纯 Java 驱动\n* 薄型驱动\
    \ (Thin Driver)\n\n`java.sql` 包包含了帮助连接数据库、将嵌入 SQL 语句发送到数据库以及处理查询结果的类。连接对象表示与数据库的连接。`PreparedStatement`\
    \ 对象允许你执行参数化查询。`ResultSet` 对象提供了从表中访问数据的方法。\n\n许多人并不懂英语，并希望用自己的语言查看消息、货币和时间。国际化有助于实现这一点。在下一章中，我们将学习国际化（Internationalization），它是根据特定的语言和地区定制应用程序的过程。\n\
    \n## 单选题\n\n1. **JDBC-ODBC 桥接是以下哪一个？**\n   a. 单线程\n   b. 多线程\n   c. 以上都不是\n\n\
    2. **DriverManager 是以下哪一个？**\n   a. 接口\n   b. 类\n   c. 方法\n\n3. **Commit 是以下哪一个的方法？**\n\
    \   a. Connection\n   b. ResultSet\n   c. Statement\n\n4. **在 JDBC 中加载数据库驱动需要以下哪些方法？**\n\
    \   a. `Class.forName()`\n   b. `RegisterDriver()`\n   c. 以上都不是\n\n5. **Sun 定义了多少种\
    \ JDBC 驱动类型？**\n   a. 一种\n   b. 四种\n   c. 三种\n\n## 答案\n\n1. b\n2. b\n3. a\n4.\
    \ a\n5. b\n\n## 空选题\n\n1. ________ 是运行在 UNIX、Linux 和 Windows 上的开源 DBMS 产品。\n \
    \  **Ans**: MYSQL\n2. `__________________Statement` 可以执行参数化查询。\n   **Ans**: Prepared\
    \ Statement\n3. `executeQuery()` 方法返回 _________ 对象。\n   **Ans**: ResultSet\n4.\
    \ 的 __________ 符号是一个可以在运行时被输入 参数替换的占位符。\n   **Ans**: \"?\"\n\n## 判断题\n\n1. JDBC\
    \ 是用于连接关系型、对象和 XML 数据源的 API。\n   **Ans**: False\n2. JDBC-ODBC 桥接支持每个连接多个并发打开的语句。\n\
    \   **Ans**: True\n3. JDBC 是访问关系型数据库的 API。\n   **Ans**: False\n4. `java.sql` 和\
    \ `javax.sql` 包包含了 JDBC 类和接口。\n   **Ans**: True\n\n## 题\n\n1. 什么是数据库和数据库驱动？\n\
    2. 有多少种驱动？请解释。\n3. 编写连接数据库的步骤。\n4. 什么是 `ResultSet`？`ResultSet` 的返回类型是什么？\n\n##\
    \ 面试题\n\n1. Java 中建立 JDBC 连接的主要步骤有哪些？\n2. `Statements` 有哪些不同类型？\n3. 什么是 `JDBC`？\n\
    4. 哪种 `Statement` 可以执行参数化查询？\n5. JDBC-ODBC 桥接支持多个并发打开的语句？\n\n# 第 2 章：国际化 (I18N)\n\
    \n### 引言\n许多人并不懂英语，并希望用自己的语言查看消息、货币和时间。国际化有助于实现这一点。国际化是根据特定的语言和地区定制应用程序的过程。国际化（Internationalization）一词包含\
    \ 18 个字母，因此缩写为 I18N。\n\n### 结构\n在本章中，我们将涵盖：\n* 本地化 (Localization)\n* 区域语言 (Locale)\n\
    * 资源包 (Resource bundle)\n* 开发基于 I18N 应用程序的步骤\n* 国际化\n\n### 目标\n学习本章后，你能够开发应用程序并根据特定的语言和地区显示消息。\n\
    \n### 本地化 (L10N)\n这是在特定语言或区域创建应用程序的机制。可以通过 `Locale` 对象实现。`Locale` 类对象表示地理或文化区域。`Locale`\
    \ 类用于获取有关国家语言、变体等的信息。变体（variant）代表特定操作系统的信息。\n\n### Locale\n它是 `java.util` 包中的一个类，提供了有关国家和地区的信息。\n\
    \n### Locale 类的构造函数\n`locale` 类有三个构造函数，如下：\n* `Locale(String language)`\n* `Locale(String\
    \ language, String country)`\n* `Locale(String language, String country, String\
    \ variant)`\n\n### Locale 类的常用方法\n以下是 `Locale` 类的常用方法：\n* `public static Locale\
    \ getDefault()`：返回当前 `Locale` 的实例。\n* `public static Locale[] getAvailableLocales()`：返回可用区域语言环境的数组。\n\
    * `public String getDisplayCountry()`：返回该 locale 对象的国家名称。\n* `public String getDisplayLanguage()`：返回该\
    \ locale 对象的语言名称。\n* `public String getDisplayVariant()`：返回该 locale 对象的变体代码。\n\
    * `public String getISO3Country()`：返回当前 locale 国家的三字母缩写。\n* `public String getISO3Language()`：返回当前\
    \ locale 语言的三字母缩写。\n\n获取印度信息的程序如下：\n\n```java\nimport java.util.Locale;\npublic\
    \ class LocaleTest {\n  public static void main(String[] args) {\n    Locale locale\
    \ = new Locale(\"hi\", \"IN\");\n    System.out.println(locale.getDisplayCountry());\n\
    \    System.out.println(locale.getDisplayLanguage());\n    System.out.println(locale.getDisplayName());\n\
    \    System.out.println(locale.getISO3Country());\n    System.out.println(locale.getISO3Language());\n\
    \    System.out.println(locale.getLanguage());\n    System.out.println(locale.getCountry());\n\
    \  }\n}\n```\n\n**输出如下**：\nIndia\nHindi\nHindi (India)\nIND\nhin\nhi\nIN\n\n###\
    \ 资源包 (Resource Bundle)\n如果应用程序内部使用的消息或标签以用户的语言显示，这是一个良好的做法，例如，如果用户来自印度，消息是印地语；如果用户来自美国，消息是英语。`Resource\
    \ Bundle` 存储区域敏感的文本和组件，并从包含消息的属性文件中加载这些信息。\n\n`java.util.ResourceBundle` 类是一个抽象类；我们无法实例化该类。它的方法帮助我们管理区域敏感资源。\n\
    \n### ResourceBundle 的构造函数\n* `ResourceBundle()`：这是默认构造函数，主要设计供子类和工厂方法使用。\n\n\
    ### ResourceBundle 类的方法\n* `public static ResourceBundle getBundle(String basename)`：加载指定名称资源包并返回\
    \ `ResourceBundle` 类的实例。\n\n"
- fmt: "\n* `public static ResourceBundle getBundle(String basename, Locale locale)`:\
    \ It loads the resource bundle with the given name and the specified locale and\
    \ returns the instance of the `ResourceBundle` class.\n* `public String getString(String\
    \ key)`: It returns the value for the corresponding key from this resource bundle.\n\
    * `Locale getLocale()`: It returns the Locale associated with the current bundle.\n\
    * `static final clearCache()`: It deletes all the resource bundles from the cache\
    \ that were loaded by the default class loader.\n* `boolean containsKey()`: It\
    \ returns true if the passed string argument is a key within the invoking resource\
    \ bundle.\n* `protected void setParent()`: It sets the passed bundle as the parent\
    \ of the invoking bundle. In the case of a lookup, if the key is not found in\
    \ the invoking object, then it is looked up in the parent bundle.\n* `final Object\
    \ getObject()`: It retrieves and returns the object associated with the key passed\
    \ as an argument, either from the current resource bundle or the parent.\n\n|\
    \ Note: |\n| :--- |\n| The name of the properties file should be `filename_languagecode_country`,\
    \ for example, `MyMessage_hi_IN.properties`. |\n| The properties file containing\
    \ the Locale sensitive information is also called resource bundle. |\n\n### Steps\
    \ to develop the I18N-based application\n\nThe following are the steps to develop\
    \ the I18N-based application:\n\n1. Identify the Locale's sensitive information\
    \ for which you want to customize the application.\n2. Create properties files\
    \ for each Locale, and the name of the properties files must be `filename_languagecode_country`.\n\
    3. Get the `ResourceBundle` instance.\n4. Read the message from the properties\
    \ file with the help of the `ResourceBundle` methods.\n\n**The following are the\
    \ examples**:\n\n1. Create `MessageBundle_hi_IN.properties`, as follows:\n`welcome=Namaskar,Kaisehaiaap?`\n\
    \n2. Create `MessageBundle_en_US.properties`, as follows:\n`welcome=Hello, How\
    \ are you?`\n\n3. Create a Java class to get the instance of `ResourceBundle`\
    \ and read the message from the properties file according to their Locale, as\
    \ follows:\n\n```java\nimport java.util.Locale;\nimport java.util.ResourceBundle;\n\
    \npublic class I18NDemo {\n    public static void main(String[] args) {\n    \
    \    //Default Locale is the US\n        ResourceBundle bundle = ResourceBundle.getBundle(\"\
    MessageBundle\", Locale.US);\n        System.out.println(\"Message in \" + Locale.US\
    \ + \": \" + bundle.getString(\"welcome\"));\n\n        // Now the default locale\
    \ change to India\n        Locale.setDefault(new Locale(\"hi\", \"IN\"));\n  \
    \      bundle = ResourceBundle.getBundle(\"MessageBundle\");\n        System.out.println(\"\
    Message in \" + Locale.getDefault() + \": \" + bundle.getString(\"welcome\"));\n\
    \    }\n}\n```\n\n**The output is as follows**:\nMessage in en_US: Hello, How\
    \ are you?\nMessage in hi_IN: Namaskar, Kaise hai aap?\n\n### Internationalizing\
    \ Date and Time (I18N with Date and Time)\n\nWhenever Locale is changed, the format\
    \ of the date and time is also changed. This means that the format of the date\
    \ and time is different from region to region.\n\nThe `java.text.DateFormat` class\
    \ has the following methods that help in changing the date and time according\
    \ to the region.\n\n### Methods of java.text.DateFormat\n\nThe following are the\
    \ methods for `java.text.DateFormat`:\n\n1. `public static DateFormat getDateInstance(int\
    \ style, Locale locale)`: This method returns the object of `DateFormat` based\
    \ on the specified style and the `Locale.This` object is used to format the date\
    \ and not the time.\n2. `public static DateFormat getTimeInstance(int style, Locale\
    \ locale)`: This method is used to format the time according to the specified\
    \ style and Locale.\n3. `public String format(java.util.Date date)`: This method\
    \ formats the date into the date-time string.\n\n| NOTE: The DateFormat class\
    \ has the following styles to display the date and time: |\n| :--- |\n| • static\
    \ final int SHORT |\n| • static final int LONG |\n| • static final int FULL |\n\
    | • static final int MEDIUM |\n| • static final int DEFAULT |\n\n**The following\
    \ is an example**:\n\n```java\nimport java.util.Locale;\nimport java.text.DateFormat;\n\
    \npublic class DateFormatDemo {\n    public static void main(String[] args) {\n\
    \        // TODO Auto-generated method stub\n        String lang=\"en\";\n   \
    \     Locale l=new Locale(lang);\n        DateFormat df=DateFormat.getDateInstance(DateFormat.SHORT,\
    \ l);\n        System.out.println(df.format(new java.util.Date()));\n\n      \
    \  // Time\n        DateFormat df2=DateFormat.getTimeInstance(DateFormat.LONG,\
    \ l);\n        System.out.println(df2.format(new java.util.Date()));\n    }\n\
    }\n```\n\n### Internationalizing Numbers (I18N with Numbers)\n\nWhenever Locale\
    \ is changed, the format of the number is also changed. This means that the format\
    \ of the number is different from region to region. The `java.text.NumberFormat`\
    \ class has the following methods:\n\n* `public static NumberFormat getNumberInstance(Locale\
    \ locale)`: This method returns the `NumberFormat` instance for the specified\
    \ locale and style.\n* `public static NumberFormat getCurrencyInstance(Locale\
    \ locale)`: This method returns the `NumberFormat` instance for the specified\
    \ locale.\n* `public static NumberFormat getPercentInstance(Locale locale)`: This\
    \ method returns the `NumberFormat` instance for the specified locale.\n\n**The\
    \ following is an example**:\n\n```java\nimport java.util.Locale;\nimport java.text.NumberFormat;\n\
    \npublic class NumberDemo {\n    public static void main(String[] args) {\n  \
    \      Locale l = new Locale(\"US\");\n        NumberFormat nf = NumberFormat.getNumberInstance(l);\n\
    \        System.out.println(nf.format(1234567.89));\n\n        NumberFormat nf2\
    \ = NumberFormat.getCurrencyInstance(l);\n        System.out.println(nf2.format(1234567.89));\n\
    \n        NumberFormat nf3 = NumberFormat.getPercentInstance(l);\n        System.out.println(nf3.format(1234567.89));\n\
    \    }\n}\n```\n"
