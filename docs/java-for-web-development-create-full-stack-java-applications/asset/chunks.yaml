  trans: "\n\n* 它可以轻松地连接到任何数据库\n\n### 以下是缺点：\n\n* 性能下降，因为 JDBC 方法调用被转换为 ODBC 函数调用\n\
    * 客户端机器需要安装 ODBC 驱动\n\n### 原生 API 驱动 (Native-API driver)\n\nNative-API 驱动使用数据库的客户端库。驱动将\
    \ JDBC 方法调用转换为数据库 API 的原生调用。它不是完全用 Java 编写的。\n\n### 以下是优点：\n\n* 性能提升，优于 JDBC-ODBC\
    \ 桥接驱动\n\n### 以下是缺点：\n\n* 每个客户端机器上都需要安装原生驱动\n* 客户端机器上需要安装厂商的客户端库\n\n### 网络协议驱动\
    \ (Network protocol driver)\n\n它使用中间件（应用程序服务器）将 JDBC 调用直接或间接地转换为特定厂商的数据库协议。它完全完全用\
    \ Java 编写的。\n\n### 以下是优点：\n\n* 不需要客户端库\n\n### 以下是缺点：\n\n* 需要网络支持\n* 需要在中间层针对特定数据库进行编码\n\
    * 网络协议的维护变得变得昂贵，因为需要针对特定数据库进行编码\n\n### 薄型驱动 (Thin Driver)\n\n薄型驱动将 JDBC 调用直接转换为特定厂商的数据库协议。这就是为什么它被称为薄型驱动。它完全用\
    \ Java 语言编写。\n\n### 以下是优点：\n\n* 性能优于所有其他驱动程序\n* 客户端或服务器端都不需要软件\n\n### 以下是缺点：\n\
    \n* 驱动依赖于数据库\n\n### 查询数据库\n\n现在你已经理解了 JDBC 架构，就可以编写一个可以与数据库工作的 Java 应用程序。在本节中，你将学习\
    \ Java 中提供的包和类，这些类允许你向数据库发送查询并处理查询结果。\n\n### 连接数据库\n\n`java.sql` 包包含了帮助连接数据库、向数据库发送嵌入\
    \ SQL 语句以及处理查询结果的类。\n\n### 连接对象 (connection object)\n\n连接对象代表与数据库的连接。在一个连接一个或多个数据库的应用程序可能有多个连接对象。\n\
    \n### 加载驱动并建立连接\n\n要与数据库建立连接，请完成以下步骤：\n\n1. 通过 `Class` 类的 `forName()` 方法注册 ODBC\
    \ JDBC/薄型驱动。\n\n例如：\n```\nClass.forName(\"oracle.JDBC.driver.OracleDriver\");\n\
    ```\n\n2. 调用 `DriverManager` 类的 `getConnection(\"JDBC URL\")` 方法。\n\n DriverManager\
    \ 类的 `getConnection()` 方法尝试找到可以连接传递给 `getConnection()` 方法的 JDBC URL 所代表数据库的驱动。\n\
    \n### JDBC URL\n\nJDBC-URL 是提供标识数据库方式的字符串。JDBC URL 分为以下三个部分：\n\n`<protocol>: <sub\
    \ protocol> : <subname>`\n\n其中，JDBC URL 中的 `<protocol>` 始终是 `Jdbc<subprotocol>`，它是数据库连接机制的名称。如果获取数据的机制是\
    \ ODBC-JDBC 桥，则子协议必须是 ODBC。`<Subname>` 用于标识数据库。\n\n### 示例 JDBC URL\n\n以下是一个 JDBC\
    \ URL 示例：\n\n```java\nString url = \"jdbc:oracle:thin:@localhost:1521:xe\";\n\
    // 薄型驱动的 URL\n//\"jdbc:oracle:thin:@localhost:1521:xe\"\n\nClass.forName (\"oracle.jdbc.driver.OracleDriver\"\
    )\nConnection con = DriverManager. getConnection (url,\"system\",\"password\"\
    );\n```\n\n### 在数据库中处理查询\n\n一旦建立了与数据库的连接，就可以查询数据库并处理结果集。JDBC 不对可以发送的 SQL 语句类型实施任何限制，但作为程序员，你有责任确保数据库能够处理这些语句。\n\
    \nJDBC 提供了三个类向数据库发送 SQL 语句，如下所示：\n\n* **Statement 对象**：你可以通过调用连接对象的 `createStatement()`\
    \ 方法创建 statement 对象。\n* **paredStatement 对象**：你可以通过调用连接对象的 `preparedStatement()`\
    \ 方法创建 Prepared statement 对象。prepared statement 对象包含一组方法，可用于发送带有输入 参数的查询。\n* **CallableStatement\
    \ 对象**：你可以通过调用连接对象的 `prepareCall()` 方法创建 Callable Statement 对象。CallableStatement\
    \ 对象包含调用存储过程的功能。你可以使用 Callable Statement 对象处理输入和输出参数。\n\n#### 使用 Statement 对象\n\
    \n你可以像接下来的示例 Query-App 程序所示，使用 statement 对象向数据库发送简单的查询：\n\n```java\n//Query App.\
    \ java\nimport java.sql.*;\n\npublic class QueryApp {\n  public static void main\
    \ (String a []) {\n    try {\n      Class.forName(\"oracle.jdbc.driver.OracleDriver\"\
    );\n      Connection con = DriverManager.getConnection (\"jdbc:oracle:thin:@localhost:1521:xe\"\
    ,\"system\",\"password\");\n      Statement stat = con.createStatement();\n  \
    \    stat.executeQuery (\"select * from emp\");\n    } catch(Exception e) {\n\
    \      System.out.print (\"Error\" + e);\n    }\n  }\n}\n```\n\n在前面的 Query App\
    \ 示例中，发生了这些：\n1. 加载了薄型/Oracle 驱动。\n2. 使用 `getConnection()` 方法初始化了连接对象。\n3. 使用\
    \ `createStatement()` 方法创建了 statement 对象。\n4. 最后，使用 statement 对象的 `executeQuery()`\
    \ 方法执行了一个简单的查询。\n\n#### Statement 对象\n\n`Statement` 对象允许你执行简单的查询。它有三个可以用于查询的方法，如下：\n\
    \n* `executeQuery()` 方法执行简单的 select 查询并返回一个 `ResultSet` 对象。\n* `executeUpdate()`\
    \ 方法执行 INSERT、UPDATE 和 DELETE 语句。\n* `execute()` 方法执行可能返回多个结果的 SQL 语句。\n\n####\
    \ ResultSet 对象\n\n`ResultSet` 对象为你提供了访问表中数据的方法。执行一个语句通常会生成一个 `ResultSet` 对象。它维护一个指向当前行的游标。初始时，游标置在第一行之前。`next()`\
    \ 方法将游标移动到下一行；你可以通过调用 `getxxx()` 方法访问 ResultSet 中的数据，其中 `xxx` 是参数的数据类型。以下代码查询数据库并处理\
    \ ResultSet：\n\n```java\nimport java.sql.*;\n\npublic class QueryApp {\n  public\
    \ static void main (String a []) {\n    ResultSet result;\n    try {\n      Class.forName(\"\
    oracle.jdbc.driver.OracleDriver\");\n      Connection con = DriverManager.getConnection\
    \ (\"jdbc:oracle:thin:@localhost:1521:xe\",\"system\",\"password\");\n      Statement\
    \ stat = con.createStatement();\n      result=stat.executeQuery (\"select * from\
    \ emp\");\n      while(result.next()) {\n        System.out.println(result.getString(2));/*获取\
    \ emp 表第二列的数据*/\n      }\n    } catch(Exception e) {\n      System.out.println\
    \ (\"Error\" + e);\n    }\n  }\n}\n```\n\n在前面的 Query App 示例中，发生了这些：\n1. `executeQuery()`\
    \ 方法返回了 `ResultSet` 对象。\n2. 使用 while 循环中的 `next()` 方法处理 `ResultSet` 对象中的所有行。\n\
    3. 使用 `getString()` 方法获取第二列的值。\n\n"
