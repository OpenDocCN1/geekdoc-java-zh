    \ If the mechanism of retrieving the data is ODBC-JDBC bridge, the subprotocol\
    \ must be ODBC. `<Subname>` is used to identify the database.\n\n### A Sample\
    \ JDBC URL\n\nThe following is a sample JDBC URL:\n\n```java\nString url = \"\
