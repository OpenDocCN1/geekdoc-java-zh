  trans: "\n\n</CUSTOMERDETAILS>\n\n不言而明，在 XML 代码的输出中，账户持者详情的定义是以强调数据类型的格式呈现的。这是通过使用特定的自定义标签，如\
    \ `Firstname`、`Lastname`、`street` 和 `zip` 实现的。这些标签的使用更容易区分数据。例如，封装在 `<COUNTRY>AND</COUNTRY>`\
    \ 标签内的文本定义了账户持有人所属的国家。虽然这些数据的呈现方式与 HTML 中编写的样式类似，但 XML 代码更以数据为中心。\n\n### 使用 XML\
    \ 的优势\n\n使用 XML 的优势如下：\n\n- **易于编码**：与 HTML 相似，除了包含自定义标签外，XML 是非常易于编码的。\n- **易于数据交换**：由于使用了显式的自定义标签，翻译\
    \ XML 文档非常容易。因此，可以在不同级别交换数据，无需解码或解释其结构。\n- **易于业务通信**：组织之间交换数据时无需理解对方业务、系统组织或结构的复杂性。但是，需要对数据中使用的标签有共同的理解。\n\
    \nXML 代码中遵循的详细规则和规范写在 `Document Type Definition` (`DTD`）中。`DTD` 定义了特定文档中使用的标签、标签结构、属性和值。\n\
    \n### 自定义标签\n\nJSP 1.1 支持创建自定义标签，能够将业务复杂性分离以形成内容呈现。JSP 中自定义标签的结构与 XML 和 HTML 一样，包含起始标签、结束标签和正文。因此，自定义标签的结构可以表示如下：\n\
    \n**语法**：\n\n```\n<start tag>\n    Body\n</end tag>\n```\n\n根据标签正文是否存在，自定义标签可以分类为正文标签或空标签。此外，自定义标签还可以进行嵌套或包含属性。嵌套标签包含不同层级的标签。带有属性的标签使用属性参数来定制标签行为。\n\
    \n自定义标签的属性列如下：\n\n- **name**：用于指定标签内使用的名称。\n- **required**：用于指定标签是否性。此属性接受的值为\
    \ true、false、yes 或 no。\n\n### 使用自定义标签的优势\n\n脚本段（Scriptlets）和自定义标签封装了 Java 代码段，因此在功能上非常相似。然而，通过提供更好的封装功能，自定义标签能够有效地分离\
    \ Web 设计师和开发人员的工作职能。使用自定义标签的优势如下：\n\n- **减少代码中的脚本段**：自定义标签的属性可以用于接收参数。因此，可以避免或减少声明（定义变量）和脚本段（设置\
    \ Java 组件的属性）的包含。\n- **可重用性**：与不可重用的 Java 代码段脚本段相反，自定义标签是可以重用的。这使得开发和部署代码时花费的时间减少。\n\
    \n### 标签库的组件\n\nJSP 文件使用的自定义标签由以下部分组成：\n\n- **标签句柄 (Tag handler)**：标签句柄用于定义自定义标签。标签句柄使用不同的方法和对象来定义标签的行为。\n\
    - **标签库描述符 (TLD) 文件**：`TLD` 文件是一个 XML 文件，包含自定义标签的描述性列表。\n\nJSP 文件包含一个标签以及用于内容呈现的\
    \ HTML 代码。考虑到这种结构，显而易见的是开发者负责编写标签句柄和 `TLD` 文件代码。\n\nWeb 设计师为网页的静态显示内容编写代码，然后将自定义标签添加到\
    \ JSP 文件中。因此，JSP 的自定义标签功能通过分离 Web 设计师和开发者的工作职能，增强了高质量 Web 应用程序的生产力。\n\n### 在 JSP\
    \ 文件中使用标签的步骤\n\n1. 创建一个包含 `Tag` 和 `BodyTag` 接口的标签句柄。标签句柄文件应该定义由标签执行的任务。\n2. 使用\
    \ `TLD` 文件映射标签和标签句柄文件。`TLD` 文件应该定义到标签句柄的输入。\n\nJSP 文件应该包含 `taglib` 指令，用于指定标签的使用和标签的定义。\n\
    \n创建任何自定义标签，我们需要完成以下步骤：\n\n- 创建标签句柄类并在标签的开始或结束处执行操作。\n- 创建`标签库描述符` (`TLD`) 文件并定义标签。\n\
    - 创建使用 `TLD` 文件中定义的自定义标签的 JSP 文件。\n\n### 标签句柄的结构\n\n标签句柄用于定义自定义标签的工作。该类文件的方法派自\
    \ `javax.servlet.tagext` 包，并实现了 `TagSupport` 或 `BodyTag` 支撑接口。`javax.servlet.jsp.tagext`\
    \ 包包含了用于 JSP 自定义标签 API 的类和接口。`JspTag` 是自定义标签层次结构中的根接口。[图 10.8] 显示了 JSP 标签的层级结构；JSP\
    \ Tag 接口是一个标记接口，因此它没有任何方法：\n\n![img](img/168.png)\n\n**图 10.8**：JSP 标签的层级结构\n\n\
    `TagSupport` 接口用于空正文标签，`BodyTagSupport` 接口用于使用正文的标签。标签句柄定义还可以包含其他包的类，例如 `javax.servlet.jsp`\
    \ 和 `java.io`。因此，添加相应的导入语句是关重要的。\n\n标签句柄的结构可以分类为基础标签、带属性的标签和带正文的标签。因此，需要实现的方法取决于标签的结构，如表\
    \ 10.3 所示：\n\n| 标签结构 | 需要实现的方法 |\n| :--- | :--- |\n| 无正文无属性的简单标签 | `doStartTag()`、`doEndTag()`\
    \ 和 `release` |\n| 带属性的标签 | `doStartTag()`、`doEndTag()` 以及每个定义标签的 `setAttribute()`\
    \ 和 `getAttribute()` 方法 |\n\n**表 10.3**：在标签句柄类中实现的方法\n\n标签库的功能使用抽象类 `tag` 中的方法定义。标签类的一些方法及其返回类型列在表\
    \ 10.4、表 10.5 和表 10.6 中：\n\n| 序号 | 方法 | 描述 |\n| :--- | :--- | :--- |\n| 1 | `public\
    \ int doStartTag()` | 初始化标签句柄并在需要时连接数据库。 |\n| 2 | `public int doEndTag()` | 执行后任务，如输出和关闭数据库连接。\
    \ |\n| 3 | `public void release()` | 移除标签句柄实例。 |\n| 4 | `int doAfterBody()` |\
    \ 在正文标签评估完成后调用。 |\n| 5 | `public int doBeforeTag()` | 在正文标签评估之前调用。 |\n| 6 | `Public\
    \ void setContext (PageContext pc)` | 设置指定的 PageContext 对象。 |\n| 7 | `public Tag\
    \ getParent()` | 设置标签句柄的父级。 |\n\n**表 10.4**：Tag 接口的方法\n\n| 序号 | 字段 | 描述 |\n| :---\
    \ | :--- | :--- |\n| 1 | `public static int SKIP_BODY` | 用于空标签，指示 JSP 引擎跳过标签正文并随后调用下一个方法\
    \ `doEndTag()`。 |\n| 2 | `public static int EVAL_BODY_INCLUDE` | 用于指示 JSP 引擎处理标签的正文内容。此方法仅在实现为\
    \ javax.servlet.tagext.Tag 时使用。 |\n\n"
- fmt: "\n| 3 | `EVAL_BODY_TAG` | Used to direct the JSP engine to process the body\
    \ of a tag. This method is used only if the interface implemented is `javax.servlet.tagext.BodyTagSupport`.\
    \ |\n\n**Table 10.5**: Return type of `doStartTag()` method*\n\n| **S.No** | **Field**\
    \ | **Description** |\n| :--- | :--- | :--- |\n| 1 | `SKIP_PAGE` | Used to specify\
    \ skipping or omission of the evaluation of the rest of the JSP page. |\n| 2 |\
    \ `EVAL_PAGE` | Used to specify the evaluation of the rest of the JSP page. |\n\
    \n**Table 10.6**: Return type of `doEndTag()` method\n\nIn addition to the preceding\
    \ methods, the tag handler also includes the following classes and methods:\n\n\
    *   The `JspWriter()` method has to be explicitly mentioned in the tag to write\
    \ the output to a JSP page.\n*   The `getAttribute()` and `setAttribute()` methods\
    \ are used to retrieve the variable values from scriptlets. After processing the\
    \ variable, its value is then set by using the `setAttribute()` method. When using\
    \ the `getAttribute()` and `setAttribute()` methods, the details about the scripting\
    \ variables also need to be specified by using the `TagExtraInfo` class.\n*  \
    \ The `TagExtraInfo` class consists of methods such as `getVariableInfo()` to\
    \ return the information about the scripting values retrieved from scriptlets,\
    \ `TagExtraInfo()`, that is the default constructor for this class, and the `setTagInfo()`\
    \ and `getTagInfo()` methods to set and get the `TagInfo` object for this class.\n\
    \nThe execution cycle of a JSP file containing the Custom Tags is shown in [*Figure\
    \ 10.9](#chap10.xhtml_fig10.9)*:\n\n![img](images/171.png)\n\n**Figure 10.9**:\
    \ Execution cycle of JSP file having Custom Tag\n\nThe sequence of the execution\
    \ of a JSP file containing the custom tags is listed as follows:\n\n1.  When the\
    \ JSP engine identifies the `taglib` directive in the JSP page, it recognizes\
    \ the presence of a custom tag associated with the JSP file. The `Uniform Resource\
    \ Identifier` (`URI`) and the prefix for the tag act as the referential data for\
    \ specifying the unique `URI` and the name for the tag.\n2.  The specified tag\
    \ handler is initialized.\n3.  The `get()` and `set()` methods for each tag is\
    \ executed.\n4.  The `doStartTag()` method is invoked and used to perform tasks\
    \ such as opening a connection to a database.\n5.  The tag body is evaluated next,\
    \ but is skipped if the `SKIP_BODY` field constant is specified.\n6.  The tag's\
    \ output is stored in a special `PrintWriter` called the `JSPWriter`. The `pageContext.getOut()`\
    \ method is used to make the contents available to the subsequent methods. The\
    \ output is not forwarded to the client at this stage.\n7.  Next, the `doAfter()`\
    \ method is invoked to process the content generated after the evaluation of the\
    \ tag body. The `SKIP_BODY` and `EVAl_BODY_TAG` field constant can be returned\
    \ to estimate the exact stage of the life cycle.\n8.  The `doEndTag()` method\
    \ is invoked next. All connections created earlier are closed, and the output\
    \ is directed to the browser.\n\n## [The structure of the TLD file](#toc.xhtml_aa158\n\
    \nThe TLD file is an XML file that contains the tag library description. It contains\
    \ the list and description of all the custom tags in the library that are used\
    \ as a reference to validate the existence of the respective tags. The components\
    \ of the TLD file can be broadly classified into two groups. The first group placed\
    \ within the `taglib` tag contains the elements that are a part of the tag element,\
    \ written as `<tag>`.\n\nThe elements of the TLD file at the `taglib` level are\
    \ listed in [*Table 10.7](#chap10.xhtml_tab10.7)*:\n\n| **S.No** | **Component**\
    \ | **Description** |\n| :--- | :--- | :--- |\n| 1 | `<tlib-version>` | The version\
    \ of the tag library such as `<tlib-version>1.0</tlib-version>`. |\n| 2 | `<jsp-version>`\
    \ | The version of JSP that the tag library depends on, such as `<jsp-version>1.2</jsp-version>`.\
    \ |\n| 3 | `<short-name>` | The name for the tag library. |\n| 4 | `<uri>` | The\
    \ universal resource identifier, an optional component that is a unique ID for\
    \ the tag library. |\n| 5 | `<info>` | The detailed information about the tag\
    \ library. |\n\n**Table 10.7**: Elements of the TLD file at the Taglib level\n\
    \nThe elements of the TLD file at the tag level are listed in [*Table 10.8](#chap10.xhtml_tab10.8)*:\n\
    \n| **S.No** | **Component** | **Description** |\n| :--- | :--- | :--- |\n| 1\
    \ | `<name>` | Defines a name for the tag. |\n| 2 | `<tagclass>` | Specifies the\
    \ tag handler class. The format for this specification is `<tagclass>package.classname</tagclass>`.\
    \ |\n| 3 | `<info>` | Provides additional information about the tag and its functionality.\
    \ |\n| 4 | `<attribute>` | Specifies the attribute name and requirement specification\
    \ for the tag. |\n| 5 | `<bodycontent>` | Contains the definition of the body.\
    \ Specify empty if the body, specify JSP if the body, and nested if the body.\
    \ |\n\n**Table 10.8**: Elements of the TLD file at the tag level\n\nThe steps\
    \ to create the TLD file for a tag named first are listed as follows:\n\n1.  In\
    \ the Notepad, include the document type and definition as first line:\n    ```xml\n\
    \    <!DOCTYPE taglib PUBLIC \"-//Sunystems, Inc.//DTD Tag Library 1.2//EN\" \"\
    http://java.sun.com/dtd/taglibrary_1_2.dtd\">\n    ```\n2.  Add `tlibversion`,\
    \ `jspversion`, `short-name` within the `<taglib>` and `</taglib>` tags:\n   \
    \ ```xml\n    <taglib>\n      <tlib-version>1.0</tlib-version>\n      <jsp-version>1.2</jsp-version>\n\
    \      <short-name>simple</short-name>\n      <uri>http://tomcat.org/taglib</uri>\n\
    \    </taglib>\n    ```\n3.  Add the tag definitions within the `<tag>` and `</tag>`\
    \ tags:\n    ```xml\n    <tag>\n      <name>today</name>\n      <tag-class>IOL.TagHandler</tag-class>\n\
    \    </tag>\n    ```\n4.  Add the end tag for `taglib`:\n    ```xml\n    </taglib>\n\
    \    ```\n\n## [The structure of the JSP File](#toc.xhtml_159\n\nA JSP page using\
    \ custom tags from the library specifies the tag usage with the `taglib` directive.\
    \ The following code snippet declares a tag library:\n\n```jsp\n<%@ taglib uri=\"\
    WEB-INF/example.tld\" prefix=\"example\" %>\n```\n\nThe two attributes for the\
    \ `taglib` directive are `uri` and `prefix` which are used to specify the unique\
    \ identifier and a reference name for the particular library. When the JSP engine\
    \ encounters insertion of the `taglib` directive, it uses `uri` to locate the\
    \ descriptor file for the particular library. To specify the inclusion of a new\
    \ tag named first for the tag library, the tag would be written as follows:\n\n\
    ```jsp\n<example:today>\n```\n\n**Example**: **Tag Handler**\n\n```java\npackage\
    \ IOL;\n\nimport java.util.Calendar;\nimport javax.servlet.jsp.JspException;\n\
    import javax.servlet.jsp.JspWriter;\nimport javax.servlet.jsp.tagext.TagSupport;\n\
