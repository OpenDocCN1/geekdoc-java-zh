         **2.  Which of the following tags is used to execute the Java source code
    in JSP?**


                 A.  Scriptlets


                 B.  Declarations


                 C.  Expressions


                 D.  None of the above


         **Answer**: A


         **3.  Which of the following is the correct order of phases in the JSP life
    cycle?**


                 A.  Compilation, Initialization, Execution, Cleanup


                 B.  Cleanup, Compilation, Initialization, Execution


                 C.  Initialization, Cleanup, Compilation, Execution


