  trans: "\n\n| 6 | `<jsp:param>` | 作为 `jsp:include` 和 `jsp:forward` 的子属性使用，用于传递额外的请求参数\
    \ | `name` | 指定引用参数的名称 |\n| `value` | 指定引用参数的值 |\n\n**表 10.1: 各种 JSP Action 标签**\n\
    \n有很多 JSP Action 标签，每个标签都有其用途和特点。\n\n### jsp:useBean action 标签\n\n它用于创建一个引用，以指定在\
    \ JSP 页面中包含预定义的 bean 组件。如果 `Bean` 类的 bean 对象已经创建，则根据作用域（scope）不再创建 bean。但如果尚未创建\
    \ bean 对象，则实例化该 bean。\n\n**语法**:\n\n```jsp\n<jsp:useBean id=\"instanceName\" scope=\"\
    page | request | session | application\" class=\"packageName.className\" type=\"\
    packageName.className\" beanName=\"packageName.className | <%= expression %>\"\
    > </jsp:useBean>\n```\n\n**示例**:\n```jsp\n<jsp:useBean id=\"savAcc\" scope=\"\
    application\" class=\"savAccount\" />\n```\n\n上述代码行指定了包含一个名为 `savAcc`、类为 `savAccount`\
    \ 的 bean。该类是定义 bean 的 Java 类。 JavaBean 类应该遵循以下约定：\n\n* 它应该有一个无参的构造函数。\n* 它 应该是可序列化的。\n\
    * 它应该提供设置和获取属性值的方法，即 getter 和 setter 方法。\n\n一旦实例化，就可以可以使用相同的作用域和 `ID` 重用 bean。\n\
    \n以下是 `useBean` 标签的属性：\n\n* `id`: 此属性唯一标识 bean 的实例。\n* `Class`: 此属性指定用于实现 bean\
    \ 对象的类。\n* `Scope`: 此属性指定对象的生命周期，其取值如*表 10.2* 所示：\n\n| Scope | 对象的生命周期 |\n| :---\
    \ | :--- |\n| page | 对象的可用性对应特定页面对当前请求的响应。对象在用户请求开始时创建，在完成后销毁。 |\n| session |\
    \ 对象的可用性对应特定会话的存在。 |\n| application | 对象的可用性在整个应用程序范围内存在。 |\n| request | 对象的可用性对应于\
    \ `HttpServletRequest` 对象的存在。 |\n\n**表 10.2: scope 属性的值**\n\n* `beanName`: 此属性指定\
    \ bean 的引用名称。\n* `type`: 如果 bean 已经存在于作用域中，则此属性为 bean 提供数据类型。它主要与 `class` 或 `beanName`\
    \ 属性配合使用。如果不使用 `class` 或 `beanName` 而使用它，则不会实例化 bean。\n\n**示例**: 在下面的示例中，bean\
    \ 有一个方法 `square`，通过 `useBean` 标签辅助获取：\n\n**MyBean 类:**\n```java\npackage IOL;\n\
    public class MyBean {\n    public int square(int n) {\n        return n*n;\n \
    \   }\n}\n```\n\n**index.jsp**:\n```jsp\n<html>\n<body>\n    <jsp:useBean id=\"\
    obj\" class=\"IOL.MyBean\"/>\n    <%\n        int m=obj.square(5);\n        out.print(\"\
    squareof 5 is \"+m);\n    %>\n</body>\n</html>\n```\n\n以下是输出结果，如*图 10.1:* 所示\n\
    \n![img](img/152.png)\n\n**图 10.1: index.jsp 的输出**\n\n### jsp:setProperty 和 jsp:getProperty\
    \ action 标签\n\n这些标签用于设置和获取 bean 中的属性值。它是表示数据的重用组件。\n\n**setProperty action 标签的语法**:\n\
    \n```jsp\n<jsp:setProperty name=\"instanceOfBean\" property=\"*\" property=\"\
    propertyName\" param=\"parameterName\" value=\"{ <%= expression %>\"/>\n```\n\n\
    **示例**:\n```jsp\n<jsp:setProperty name=\"savAcc\" property=\"*\" />\n```\n上述代码行设置了\
    \ bean 类中后续请求的值。\n\n**jsp:getProperty action 标签的语法**:\n\n```jsp\n<jsp:getProperty\
    \ name=\"instanceOfBean\" property=\"propertyName\"/>\n```\n\n**示例**:\n```jsp\n\
    <jsp:setProperty name=\"savAcc\" name=\"accountNo\" />\n```\n`jsp:getProperty`\
    \ action 标签返回属性 `accountNo` 值。\n\n以下是 `setProperty` 标签的属性：\n\n* `name`: 指定 bean\
    \ 的名称。\n* `property`: 指定要设置的属性。如果设置为 `*`，则将调用所有设置方法。\n* `Value`: 指定 bean 的显式值。\n\
    * `Param`: 指定设置 bean 属性的请求参数。\n\n以下是 `getProperty` 标签的属性：\n\n* `Name`: 指定 bean\
    \ 的名称。\n* `Property`: 指定需要检索的属性。\n\n**示例**: 在下面的示例中，从 bean 类设置 name 和 password：\n\
    \n**index.jsp**:\n```jsp\n<html>\n<body>\n    <form action=\"next.jsp\" method=\"\
    post\">\n        User Name:<input type=\"text\" name=\"userName\"><br>\n     \
    \   Password:<input type=\"password\" name=\"password\"><br>\n        <input type=\"\
    submit\" />\n    </form>\n</body>\n</html>\n```\n\n**Bean 类**:\n```java\npackage\
    \ IOL;\npublic class NewClass implements java.io.Serializable {\n    public String\
    \ userName, password;\n    public String getUserName() {\n        return userName;\n\
    \    }\n    public void setUserName(String userName) {\n        this.userName\
    \ = userName;\n    }\n    public String getPassword() {\n        return password;\n\
    \    }\n    public void setPassword(String password) {\n        this.password\
    \ = password;\n    }\n}\n```\n\n**next.jsp**:\n```jsp\n<html>\n<body>\n    <jsp:useBean\
    \ id=\"myBean\" class=\"IOL.NewClass\"></jsp:useBean>\n    <jsp:setProperty property=\"\
    *\" name=\"myBean\"/>\n    Record:<br>\n    User name=<jsp:getProperty property=\"\
    userName\" name=\"myBean\"/><br>\n    password=<jsp:getProperty property=\"password\"\
    \ name=\"myBean\"/><br>\n</body>\n</html>\n```\n\n以下是 index.jsp 的输出，如*图 10.2:*\n\
    \n![img](img/155a.png)\n\n**图 10.2: index.jsp 的输出**\n\n以下是 next.jsp 的输出，如*图 10.3:*\n\
    \n![img](img/155b.png)\n\n**图 10.3: next.jsp 的输出**\n\n### Jsp:forward action 标签\n\
    \n此标签用于将请求转发到另一个页面。\n\n**语法**:\n\n```jsp\n<jsp:forward page=\"relativeURL | <%=\
    \ expression %>\">\n    <jsp:param name=\"parametername\" value=\"parametervalue\
    \ | <%=expression%> />\n</jsp:forward>\n```\n\n`page` 是 forward 标签的属性。\n\n**示例**:\n\
    \n**Index.xhtml**:\n```html\n<html>\n<body>\n    <form action=\"Next.jsp\" method=\"\
    post\">\n        User Name:<input type=\"text\" name=\"userName\"><br>\n     \
    \   Password:<input type=\"password\" name=\"password\"><br>\n        <input type=\"\
    submit\" />\n    </form>\n</body>\n</html>\n```\n\n**Next.jsp**:\n```html\n<html>\n\
    <body>\n    <jsp:forward page=\"next2.jsp\">\n        <jsp:param name=\"date\"\
    \ value=\" 17 January 2022\"/>\n    </jsp:forward>\n</body>\n</html>\n```\n\n\
    **Next2.jsp**:\n```html\n<html>\n<body>\n    <h1> Record <br>\n    User Name<%=\
    \ request.getParameter(\"userName\") %><br>\n    password = <%= request.getParameter(\"\
    password\") %><br>\n    Date<%= request.getParameter(\"date\") %>\n    </h1>\n\
    </body>\n</html>\n```\n\n以下是 index.xhtml 的输出，如*图 10.4:*\n\n![img](img/157a.png)\n\
    \n**图 10.4: index.xhtml 的输出**\n\n以下是 next2.jsp 的输出，如*图 10.5:*\n\n![img](img/157b.png)\n\
    \n**图 10.5: Next2.jsp 的输出**\n\n"
- fmt: "\nIt is used to insert the content of the file into a particular JSP file.\
    \ The file may be JSP, HTML, or servlet. The file inclusion takes place at the\
    \ time of the request of the JSP page.\n\nThe following are the attributes:\n\n\
    - `page`: It specifies the relative URL of the page to be included.\n- `flush`:\
    \ It specifies if the buffer is to be flushed. A mandatory Boolean attribute has\
    \ to be included when declaring the include action.\n\n### Syntax\n\n```jsp\n\
    <jsp:include page=\"relativeURL | <%= expression %>\">  <jsp:param name=\"parametername\"\
    \ value=\"parametervalue | <%=expression%>\" />  </jsp:include>\n```\n\n### Example\n\
    \n**printdate.jsp**\n\n```jsp\n<% out.print(\"Today is:\"+java.util.Calendar.getInstance().getTime());\
    \ %>\n```\n\n**Index.jsp**\n\n```html\n<html>\n  <body>\n    <h2>this is index\
    \ page</h2>\n    <jsp:include page=\"printdate.jsp\" />\n    <h2>end section of\
    \ index page</h2>\n  </body>\n</html>\n```\n\n### Example\n\nIn the following\
    \ example, the user enters the account number and password on a JSP page. If the\
    \ account number and password exist in the database, then the user is validated,\
    \ otherwise an error message will be generated, as shown as follows:\n\n**Index.jsp**\n\
    \n```html\n<html>\n  <body>\n    <form method=\"post\" action=\"usebean.jsp\"\
    >\n      <table border=\"0\" cellspacing=\"1\" cellpadding=\"5\">\n        <tr>\n\
    \          <td width=\"100\">&nbsp;</td>\n          <td align=\"right\">\n   \
    \         <h1>\n              <font color=\"red\">\n              Welcome to Famous\
    \ bank</font>\n            </h1>\n          </td>\n        </tr>\n        <tr>\n\
    \          <td width=\"100\" align=\"right\"><b>\n            <font color=\"blue\"\
    >User ID</font>\n            </b>\n          </td>\n          <td align=\"left\"\
    >\n            <input type=\"text\" name=\"userId\" size=\"30\">\n          </td>\n\
    \        </tr>\n        <tr>\n          <td width=\"100\" align=\"right\"><b>\n\
    \            <font color=\"blue\">Password</font>\n            </b>\n        \
    \  </td>\n          <td align=\"left\">\n            <input type=\"password\"\
    \ name=\"pwd\" size=\"30\">\n          </td>\n        </tr>\n        <tr>\n  \
    \        <td width=\"100\" align=\"right\">&nbsp;</td>\n          <td align=\"\
    right\"></td>\n        </tr>\n        <tr>\n          <td width=\"100\" &nbsp;</td>\n\
    \          <td align=\"left\">\n            <input type=\"submit\" value=\"submit\"\
    \ />\n          </td>\n        </tr>\n      </table>\n    </form>\n  </body>\n\
    </html>\n```\n\n**bean.jsp**\n\n```html\n<html>\n  <head>\n    <meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=UTF-8\">\n    <title>JSP Page</title>\n\
    \  </head>\n  <body>\n    <jsp:useBean id=\"BA\" scope=\"application\" class=\"\
    IOL.MyBank\"/>\n    <jsp:setProperty name=\"BA\" property=\"\"/>\n    <%\n   \
    \   String userid=BA.getUserId();\n      String pwd=BA.getPwd();\n      boolean\
    \ valid=BA.validate();\n      if(valid == true)\n        out.println(\"The user\
    \ is valid\");\n      else\n        out.println(\"The user is not valid\");\n\
    \    %>\n  </body>\n</html>\n```\n\n**MyBank.java**\n\n```java\npackage IOL;\n\
    import java.sql.*;\npublic class MyBank {\n  private String userId,pwd;\n  public\
    \ Connection con;\n  public String getUserId() {\n    return userId;\n  }\n\n\
    \  public void setUserId(String userId) {\n    this.userId = userId;\n  }\n\n\
    \  public String getPwd() {\n    return pwd;\n  }\n\n  public void setPwd(String\
    \ pwd) {\n    this.pwd = pwd;\n  }\n\n  public MyBank()throws ClassNotFoundException,SQLException\
    \ {\n    Class.forName(\"com.mysql.cj.jdbc.Driver\");\n    con=DriverManager.getConnection(\"\
    jdbc:mysql://localhost:3306/MyBank\",\"root\",\"sailboat\");\n  }\n\n  public\
    \ boolean validate() {\n    String ppwd=\"\";\n    boolean valid=false;\n    try\
    \ {\n      userId=getUserId();\n      pwd=getPwd();\n      String strQuery=\"\
    select * from login where userid='\"+userId+\"'\";\n      Statement stat=con.createStatement();\n\
    \      ResultSet result=stat.executeQuery(strQuery);\n      System.out.println(result.next());\n\
    \      while(result.next()) {\n        ppwd=result.getString(1);\n        System.out.println(ppwd);\n\
    \      }\n      ppwd.trim();\n      pwd.trim();\n      if(ppwd.equals(pwd))\n\
    \        valid=true;\n    } catch(Exception e){}\n    return valid;\n  }\n}\n\
    ```\n\n### Summary\n\nThe following is the output of `index.jsp`, as shown in\
    \ Figure 10.6.\n\nThe following is the output of `bean.jsp`, as shown in Figure\
    \ 10.7.\n\n`JSP custom tags` are user-defined tags and can encapsulate both presentation\
    \ and business logic. The contribution of JSP towards segregation of the presentation\
    \ and business logic has functionally detached the designers from the intricacies\
    \ of the programming. In many cases, the structure of the code is such that some\
    \ of its sections are repetitive and require rewriting. The custom tags of library\
    \ provide a mechanism that the programmer can use to encapsulate recurring tasks.\
    \ Once encapsulated, these codes can then be reused in a simpler form. A tag library\
    \ consists of a collection of functionally related, user-defined tags called custom\
    \ tags.\n\nAs the JSP `useBean` element facilitates the reuse of the existing\
    \ beans, the tags in the custom library can decrease the cycle for the development\
    \ of the application and improve productivity. JSP 1.0 does not support tag libraries.\
    \ However, JSP 1.1 supports the incorporation of user-created tags in a JSP file.\
    \ The structure of the custom tags in JSP is similar to `XML` tags.\n\n### Need\
    \ of XML\n\n`Extensible Markup Language` (`XML`) is used in Web applications to\
    \ create custom or user-defined tags. An `XML` tag is no different from an `HTML`\
    \ tag as it allows the interactions between the user and the browser. What was\
    \ the need for a new markup language considering the acceptance and support of\
    \ `HTML`? Consider a simple `HTML` code for displaying the data of an account\
    \ holder in a bank. The code for displaying this data in `HTML` would be as follows:\n\
    \n```html\n<HTML>\n<BODY>\n  <TABLE align=\"center\">\n    <tr>\n      <td>Ms\
    \ Anne Brown</td>\n    </tr>\n    <tr>\n      <td>9, Sunley House, Gunthorpe Street</td>\n\
    \    </tr>\n    <tr>\n      <td>London E1-7RW</td>\n    </tr>\n  </TABLE>\n</BODY>\n\
    </HTML>\n```\n\nThe Presentation-Centric `HTML` Output of the code is as follows:\n\
    \nMs Anne Brown\n9, Sunley House, Gunthorpe Street\nLondon E1-7RW\n\nAs displayed\
    \ in the output of the `HTML` code is presentation-centric and appears as any\
    \ textual data. However, there is no differentiation in the data presented for\
    \ the account holder's first name and last name. In other words, the information\
