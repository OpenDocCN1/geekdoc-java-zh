    >\n</head>\n<body>\n  <h3> 脚本段示例</h3>\n  <form action=\"test.jsp\">\n    您的姓名：\n\
    \    <input type=\"text\" name=\"user_name\" />\n    <input type=\"submit\" value=\"\
    提交\">\n  </form>\n</body>\n</html>\n```\n\n### Test.jsp\n\n```jsp\n<%@page contentType=\"\
