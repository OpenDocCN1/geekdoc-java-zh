    Java 作为当今唯一的纯面向对象语言，现在用于几乎所有的应用，从简单的家电到复杂的太空系统。本书旨在培养使用 `servlets` 和 `JSP` 进行
    Web 开发的专家。它也改变了从内网到互联网的应用。


    书中每一章都提供了良好的示例。第 1 章旨在学习 Java 程序与数据库的连接；第 2 章涵盖了国际化，即根据特定的语言和地区定制应用程序。第 3 至第 6
