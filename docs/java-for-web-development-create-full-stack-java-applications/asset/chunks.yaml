    width=device-width, initial-scale=1.0\">\n</head>\n<body>\n  <form method=\"post\"\
    \ action=\"submit.jsp\" >\n    <input type=\"text\" name=\"uname\">\n    <input\
    \ type=\"submit\" value=\"Submit\"><br/>\n  </form>\n</body>\n</html>\n<!DOCTYPE\
    \ html>\n<html>\n<body>\n  <%\n    out.print(\"Welcome \"+request.getParameter(\"\
    uname\"));\n    String pwd=application.getParameter(\"pwd\");\n    out.print(\"\
    Your Password is=\"+pwd);\n  %>\n</body>\n</html>\n```\n\n```xml\n<?xml version=\"\
    1.0\" encoding=\"UTF-8\"?>\n<web-app version=\"3.1\" xmlns=\"http://xmlns.jcp.org/xml/ns/ee\"\
    \ xmlns:xsi=\"http://www.w3.org/2001/XMLSchema-instance\" xsi:schemaLocation=\"\
    http://xmlns.jcp.org/xml/ns/ee http://xmlns.jcp.org/xml/ns/ee/web-app_3_1.xsd\"\
    >\n  <servlet>\n    <servlet-name>NewServlet</servlet-name>\n    <jsp-file>submit.jsp</jsp-file>\n\
    \  </servlet>\n  <servlet-mapping>\n    <servlet-name>NewServlet</servlet-name>\n\
    \    <url-pattern>/submit</url-pattern>\n  </servlet-mapping>\n  <context-param>\n\
    \    <param-name>pwd</param-name>\n    <param-value>SAILBOAT</param-value>\n \
    \ </context-param>\n  <session-config>\n    <session-timeout>30</session-timeout>\n\
    \  </session-config>\n</web-app>\n```\n\nThe following is the output for `index.xhtml`,\
    \ as shown in *[Figure 8.3](#chap08.xhtml_fig8.3)*:\n\n![img](images/126.png)\n\
    \n**Figure 8.3**: Output of the preceding program (index.xhtml)\n\nThe following\
    \ is the output of `submit.jsp`, as shown in *[Figure 8.4](#chap08.xhtml_fig8.4)*:\n\
    \n![img](images/127.png)\n\n**Figure 8.4**: Output of the preceding program (submit.jsp)\n\
    \n2. **out**: This represents a reference to a `JspWriter` to write to the output\
    \ stream and subsequently sent back to the user.\n   **The following is an example**:\n\
