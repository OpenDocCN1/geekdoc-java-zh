    [**Using the HttpSession Interface**](#toc.xhtml_aa80)


    The Servlet API consists of a few classes and interfaces that help implement session
    tracking in servlets. The Java Servlet API provides an interface called **HttpSession**
    that can be used to keep track of the sessions in the current servlet context.


    Every user who logs onto a website is automatically associated with an **HttpSession**
    object. The servlet can use this object to store the information about the user''s
    session. The **HttpSession** object enables the user to maintain two types of
    data – state and application.


    The state data is used to maintain and retrieve the details about the user''s
    connection. A user’s connection details could be the time at which the session
    was created or last accessed. The application data is used to store the details,
    such as the items that were added to the shopping basket by the user. The application
    data can be manipulated by using the **getValue()** and the **putValue()** methods
    of the **HttpSession** interface, as shown in *[Table 5.1](#chap05.xhtml_tab5.1)*:


    | **Method name** | **Functionality** |


    | getSession() | This method is used to retrieve the current HTTP session that
    is associated with the user. If a session does not exist, then a session can be
    created by using getSession(true). |


    | Object getValue (String name) | This function is used to retrieve the value
    in a session object. For example, if you have a session object named item selected,
    then you can retrieve the value in the session object by using getValue(itemselected).
    |


    | Void putValue (String name, Object value) | This function is used to add an
    item to the session. |


    | boolean isNew () | This function returns a true value if a new session ID has
    been created and has not been sent to the client. |


    | String getlD () | This function returns the session ID. If URL rewriting is
    used, the session can be retrieved using this function and padded onto the client.
    |


    | long getCreationTime () | This function returns the time in milliseconds when
    the session was first created. |


    | long getLastAccessedTime ( ) | This function returns the previous time a request
    was made with the same session ID. The return value of this function is used by
    the session manager to optimize the activity of the server. |


    ***Table 5.1**: Methods of HttpSession Interface*


