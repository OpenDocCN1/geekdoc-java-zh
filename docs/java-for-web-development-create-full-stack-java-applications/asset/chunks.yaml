    In addition to the preceding methods, the tag handler also includes the following
    classes and methods:


    *   The **JspWriter()** method has to be explicitly mentioned in the tag to write
    the output to a JSP page.


    *   The **getAttribute()** and **setAttribute()** methods are used to retrieve
    the variable values from scriptlets. After processing the variable, its value
    is then set by using the **setAttribute()** method. When using the **getAttribute()**
    and **setAttribute()** methods, the details about the scripting variables also
    need to be specified by using the **TagExtraInfo** class.


    *   The **TagExtraInfo** class consists of methods such as **getVariableInfo()**
    to return the information about the scripting values retrieved from scriptlets,
    **TagExtraInfo()**, that is the default constructor for this class, and the **setTagInfo()**
    and **getTagInfo()** methods to set and get the **TagInfo** object for this class.


    The execution cycle of a JSP file containing the Custom Tags is shown in *[Figure
    10.9](#chap10.xhtml_fig10.9)*:


    ![img](images/171.png)


    ***Figure 10.9**: Execution cycle of JSP file having Custom Tag*


    The sequence of the execution of a JSP file containing the custom tags is listed
    as follows:


    1.  When the JSP engine identifies the **taglib** directive in the JSP page, it
    recognizes the presence of a custom tag associated with the JSP file. The **Uniform
    Resource Identifier** (**URI**) and the prefix for the tag act as the referential
    data for specifying the unique URI and the name for the tag.


    2.  The specified tag handler is initialized.


    3.  The **get()** and **set()** methods for each tag is executed.


    4.  The **doStartTag()** method is invoked and used to perform tasks such as opening
    a connection to a database.


    5.  The tag body is evaluated next, but is skipped if the **SKIP_BODY** field
    constant is specified.


    6.  The tag''s output is stored in a special **PrintWriter** called the **JSPWriter**.
    The **pageContext.getOut()** method is used to make the contents available to
    the subsequent methods. The output is not forwarded to the client at this stage.


    7.  Next, the **doAfter()** method is invoked to process the content generated
    after the evaluation of the tag body. The **SKIP_BODY** and the **EVAl_BODY_TAG**
    field constant can be returned to estimate the exact stage of the life cycle.


    8.  The **doEndTag()** method is invoked next. All connections created earlier
    are closed, and the output is directed to the browser.


    [**The structure of the TLD file**](#toc.xhtml_aa158)


    The TLD file is an XML file that contains the tag library description. It contains
    the list and description of all the custom tags in the library that are used as
    a reference to validate the existence of the respective tags. The components of
    the TLD file can be broadly classified into two groups. The first group placed
    within the **taglib** tag contains the elements that are a part of the tag element,
    written as **<tag>**.


    The elements of the TLD file at the **taglib** level are listed in *[Table 10.7](#chap10.xhtml_tab10.7)*:


    | **S.No** | **Component** | **Description** |


    | 1 | **<tlib-version>** | The version of the tag library such as <tlib-version>1.0</tlib-version>.
    |


    | 2 | **<jsp-version>** | The version of JSP that the tag library depends on,
    such as **<jsp-version>1.2</jsp-version>**. |


    | 3 | **<short-name>** | The name for the tag library. |


    | 4 | **<uri>** | The universal resource identifier, an optional component that
    is a unique ID for the tag library. |


    | 5 | **<info>** | The detailed information about the tag library. |


    ***Table 10.7:** Elements of the TLD file at the Taglib level*


    The elements of the TLD file at the tag level are listed in *[Table 10.8](#chap10.xhtml_tab10.8)*:


    | **S.No** | **Component** | **Description** |


    | 1 | **<name>** | Defines a name for the tag. |


    | 2 | **<tagclass>** | Specifies the tag handler class. The format for this specification
    is <tagclass>​package.classname<​/tagclass>. |


    | 3 | **<info>** | Provides additional information about the tag and its functionality.
    |


    | 4 | **<attribute>** | Specifies the attribute name and requirement specification
    for the tag. |


    | 5 | **<bodycontent>** | Contains the definition of the body for the tag. Specify
    empty if the tag is empty, specify JSP if the body content is in JSP, and specify
    tag dependent if the tag itself controls any part of the body content. The default
    value for the body content is JSP. |


    ***Table 10.8**: Elements of the TLD file at the tag level*


    The steps to create the TLD file for a tag named first in the example tag library
    are listed as follows:


         1.  In the Notepad, include the following definitions for the document type
    and its definition (DTD) as a first line of the TLD file:


          <!DOCTYPE taglib   PUBLIC “//Sun Microsystems, Inc.//DTD JSP Tag Library
    1.2//EN”  “http://java.sun.com/j2ee/dtd/web-jsptaglibrary_1_2.dtd”>


    2.  Add the **tlibversion**, **jspversion**, and **uri**, **short-name** along
    with their relevant information within the **<taglib>** and **</taglib>** tags,
    as follows:


          <taglib>


              <tlib-version>1.0</tlib-version>


            <jsp-version>1.2</jsp-version>


            <short-name>simple</short-name>


            <uri>http://tomcat.apache.org/example-taglib</uri>


    3.  Add the tag definitions separating each element within the **<tag>** and **</tag>**
    tags, as follows:


          tag>


          <name>today</name>


          <tag-class>IOL.TagHandler</tag-class>


          </tag>


    4.  Add the end tag for **taglib**, as follows:


          </taglib>


    [**The structure of the JSP File**](#toc.xhtml_aa159)


    A JSP page using custom tags from the tag library specifies the tag usage with
    the **taglib** directive. The following code snippet declares a tag library usage:


    <%@ taglib uri="WEB-INF/example.tld" prefix="example" %>


    The two attributes for the **taglib** directive are **uri** and **prefix** which
    are used to specify the unique identifier and a reference name for the particular
    tag library. When the JSP engine encounters insertion of the **taglib** directive,
    it uses **uri** to locate the descriptor file for the particular library. To specify
    the inclusion of a new tag named first for the tag library example, the tag would
    be written as follows:


    <example:today>


