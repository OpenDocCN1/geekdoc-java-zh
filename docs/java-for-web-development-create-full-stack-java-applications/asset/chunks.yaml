  trans: "\n\n以下是 `index.xhtml` 的输出，如图图 4.4 所示：\n\n![img](img/76a.png)\n\n**图 4.4**:\
    \ `index.xhtml` 的输出\n\n以下是操作页的输出，如图图 4.5 和图 4.6 所示：\n\nActionPage\n\n![img](img/76b.png)\n\
    \n**图 4.5**: Action Page 的输出*\n\n**Action Page**: ( 如果用户名或密码任错误):\n\n![img](img/76c.png)\n\
    \n**图 4.6**: Action Page 的输出*\n\n## 结论\n\n在本章中，你学习了 HTTP 代表超文本传输协议（HyperText Transfer\
    \ Protocol），它是一种用于 Web 的网络协议。它运行在 TCP/IP 之上。`HttpServleterv` 是一个抽象类，它扩展了通用 servlet\
    \ 并增加了 HTTP 协议的功能。HTTP 使用请求/响应模型——用户发送请求，Web 服务器向浏览器提供 HTTP 响应，然后浏览器将其显示给用户。如果服务器的响应是\
    \ HTML 页面，则 HTML 会被添加到 HTTP 响应中。`HTTPSRequestRequest` 和 `HttpServletResponse`\
    \ 是用于在用户和 Web 服务器之间交换信息的接口。一个 HTTP 请求包含请求 URL。附加在 URL 后的额外字符序列被称为查询字符串。GET 请求将查询字符串附加在\
    \ URL 的末尾。POST 方法将查询字符串或数据添加到请求体中。\n\n在下一章中，你将学习会话（sessions），因为 HTTP 无法记住上一个面的活动。HTTP\
    \ 是一种无状态协议。这意味着它不包含任何关于 HTTP 页的信息。为了记住状态或将信息从一个页面传递到另一个页面我们需要我们需要会话。\n\n## 问题\n\
    \n1. Get 和 Post 方法之间有什么区别？\n2. `GenericServlet` 和 `HttpServlet` 之间有什么区别？\n3. `PrintWriter`\
    \ 和 `ServletOutputStream` 有什么不同？\n4. 哪种 HTTP 方法是非等等的？\n\n## 多选题\n\n**1. 哪些类型的\
    \ servlet 使用这些方法——`doGet()`、`doPost()`、`doHead`、`doDelete()`、`doTrace()`？**\n\
    a. Generic Servlets\nb. `HttpServlets`\nc. 以上所有\nd. 以上都不是\n**答案**: `HttpServlets`\n\
    \n**2. Web 服务器用于加载 servlet 的 `init()` 方法。**\na. 正确\nb. 错误\n**答案**: 正确\n\n**3.\
    \ 哪些包代表了 servlet API 的接口和类？**\na. `javax.servlet`\nb. `javax.servlet.http`\nc.\
    \ A 和 B 都是\nd. 以上都不是\n**答案**: `javax.servlet`\n\n**4. 哪类类可以处理任何类型的请求，使其与协议无关？**\n\
    a. `GenericServlet`\nb. `HttpServlet`\nc. A 和 B 都是\nd. 以上都不是\n**答案**: `Generic\
    \ Servlet`\n\n**5. 哪种 HTTP 请求方法是非等等的？**\na. GET\nb. POST\nc. A 和 B 都是\nd. 以上都不是\n\
    **答案**: POST\n\n**6. Web 容器在部署项目时创建哪个对象？**\na. `ServletConfig`\nb. `ServletContext`\n\
    c. A 和 B 都是\nd. 以上都不是\n**答案**: `ServletContext`\n\n## 第 5 章\n\n### 使用 Servlet\
    \ 会话](#toc.ch05)\n\n### 引言\nHTTP 无法记住上一个面的活动。超文本传输协议（HTTP）是一种无状态协议。这意味着它不包含任何关于\
    \ HTTP 页的信息。为了记住状态或将信息从一个页面传递到另一个页面，我们需要维护会话。\n\n### 结构\n会话是用户在访问特定网站时执行的一组活动。跨会话之间跟踪设置的过程被称为会话跟踪（session\
    \ tracking）。考虑在线商场的例子：用户可以选择一个产品并将其加入购物车。当用户移动到不同的页面时，购物车中的详情仍然会被保留，这样用户就可以检查购物车中的物品然后下单。如果用户选择了，则会向用户显示更多内容。\n\
    \n### 在 servlet 中跟踪会话的技术\n默认情况下，无法使用 HTTP 存储跨会话的数据，因为它是一种无状态协议。然而，某些技术可以帮助使用 HTTP\
    \ 存储会话。如下：\n* URL 重写（URL rewriting）\n* 隐藏表单（Hidden form）\n* `HttpSession`\n\n\
    ### URL 重写\n这通过修改 URL 以包含特定用户的会话 ID 并将其返回给客户端的技术。在任何事务中，客户端向服务器发送请求时强制使用会话 ID。如果不存在会话\
    \ ID，则会在客户端和服务器之间创建一个会话 ID 使用。\n\n以下是一个示例：\n原始 URL：`http://<host>:<port>/servlet`\n\
    我们可以随原始 URL 发送参数值和名称。\n语法：`Original URL?name1=value1&name2=value2`\n\n以下是一个示例：\n\
    `http://<host>:<port>=sarika&pwd=sailboat`\n\nURL 重写的优点：\n* 无论 Cookie 是否禁用都可以工作（浏览器无关）。\n\
    * 不需要表单。\n\nURL 重写的缺点：\n* 适用于链接。\n* 只能发送文本信息。\n\n以下是一个示例：使用 URL 重写在 `next2` 页面获取用户名。\n\
    \n**Index.xhtml**:\n```html\n<!DOCTYPE html>\n<html>\n<body>\n  <h1>Login Form</h1>\n\
    \  <form method=\"post\" action=\"/Sessions/next\">\n    <label>User name:</label>\n\
    \    <input type=\"text\" id=\"uname\" name=\"Uname\"><br><br>\n    <label for=\"\
    pwd\">Password:</label>\n    <input type=\"password\" id=\"pwd\" name=\"pwd\"\
    ><br><br>\n    <input type=\"submit\" value=\"Submit\">\n  </form>\n</body>\n\
    </html>\n```\n\n**Next Servlet**:\n```java\nimport java.io.IOException;\nimport\
    \ java.io.PrintWriter;\nimport javax.servlet.ServletException;\nimport javax.servlet.http.HttpServlet;\n\
    import javax.servlet.http.HttpServletRequest;\nimport javax.servlet.http.HttpServletResponse;\n\
    \npublic class URLRewritingExample extends HttpServlet {\n    protected void doPost(HttpServletRequest\
    \ request, HttpServletResponse response) throws ServletException, IOException\
    \ {\n        response.setContentType(\"text/html;charset=UTF-8\");\n        try\
    \ (PrintWriter out = response.getWriter()) {\n            out.println(\"<!DOCTYPE\
    \ html>\");\n            out.println(\"<html>\");\n            out.println(\"\
    <head>\");\n            out.println(\"<title>Servlet URLRewritingExample</title>\"\
    );\n            out.println(\"</head>\");\n            out.println(\"<body>hello\
    \    \");\n            String name = request.getParameter(\"Uname\");\n      \
    \      String pwd = request.getParameter(\"pwd\");\n            if(name.equals(\"\
    Sarika\") && pwd.equals(\"vivek\")) {\n                out.println(\"<h1>\" +\
    \ name + \" are successfully login </h1>\");\n                out.print(\"<a href='next2?name=\"\
    \ + name + \"'>visit</a>\");\n            } else {\n// ...\n        }\n    }\n\
    }\n```\n"
