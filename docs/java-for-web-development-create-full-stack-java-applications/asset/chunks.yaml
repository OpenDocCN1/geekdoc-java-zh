  trans: '

    请求-响应周期本质上包含两个阶段，即翻译阶段和请求处理阶段。翻译阶段由 JSP 引擎实现，并涉及 servlet 的生成。在内部，这些操作会为实现 servlet
    接口的 JSP 页面创建一个类文件。在请求处理阶段，根据请求规范生成响应。随后，`Servlet` 向接收到的请求发送回相应的响应。在 `Servlet`
    第一次被加载后，它将保持激活状态，并处理所有后续请求并返回响应，从而节省了每次请求都重新加载 servlet 所会浪费的时间。


    ## JSP 的生命周期


    JSP 生命周期是指将 JSP 翻译为 servlet 的过程，随后 servlet 的生命周期将开始发挥作用。


    JSP 页面生命周期通过以下步骤的完成：


    1. **JSP 页面翻译**：JSP 容器将 JSP 页面翻译为 `Servlet`。

    2. **编译**：像任何其他 Java 类一样，生成的 `Servlet` 被编译成字节码，并准备好被加载和执行。生成的 servlet 具有 `jspInit()`、`_jspService()`
    和 `jspDestroy()` 方法。

    3. **类加载**：一旦 JSP 被编译为 servlet 类，其生命周期就与 `Servlet` 类似，并被加载到内存中。

    4. **实例化**：创建生成的 `Servlet` 对象。

    5. **初始化**：Web 容器调用 `jspInit()` 方法。该方法只调用一次。初始化后，`ServletConfig` 和 `ServletContext`
    对象供 JSP 类访问。当 `Servlet` 加载时允许其初始化实例变量。

    6. 请求处理：容器调用 `_jspService()` 方法。

    7. **销毁**：容器调用 `jspDestroy()` 方法。生成的 `Servlet` 将从内存中卸载，并在其关闭时从内存中清理实例变量。


    | **注意：`jspInit()`、`_jspService()` 和 `jspDestroy()` 是 JSP 的生命周期方法。** |


    JSP 页面生命周期如图图 7.2 所示：


    ![img](img/115.png)


    **图 7.2**：JSP 页面的生命周期*


    ## JSP 页面的结构


    一个 JSP 页面由代表静态内容的普通 HTML 标签以及封装在特殊标签内的代表动态内容的代码组成。这些标签以 `<%` 开始，以 `%>` 结束，并包含脚本元素和指令元素。脚本元素由
    Java 代码段组成，而指令定义了整个 JSP 页面的规范。提供关于代码各个部分的附加信息的注释行被封装在 `<%--` 和 `--%>` 标签中。例如，以下
    JSP 代码在浏览器上显示服务器时间。它包含了 HTML 内容和分别放置在各自标签内的 JSP 内容。


    以下是一个示例：


    **index.jsp**


    ```jsp

    <%@page contentType="text/html" pageEncoding="UTF-8"%>

    <%@ page language="java" %>

    <!DOCTYPE html>

    <html>

    <head>

    <title>JSP Example</title>

    </head>

    <body>

    <h1>这是 JSP 标签内用于显示服务器时间的代码</h1>

    <%--I 这是使用 java.util.package 中的 Date 类来显示服务器时间的 JSP 内容----%>

    <% java.util.Date now=new java.util.Date(); %>

    <h2><%= now %></h2>

    </body>

    </html>

    ```


    以下是 `index.jsp` 的输出，如图图 7.3 所示：


    ![img](img/116.png)


    **图 7.3**：index.jsp 的输出*


    ## JSP 页面的目录结构


    JSP 页面放置在根目录下。它不应该放在 `WEB-INF` 目录下，因为我们无法从客户端直接访问它，如图图 7.4 所示：


    ![img](img/117.png)


    **图 7.4**：JSP 页面的目录结构*


    ## 总结


    JSP 代表 Java Server Pages（Java 页面）。它是一种用于创建动态 Web 应用程序的服务器端技术。JSP 的特点是表现层与业务逻辑的分离。


    一旦 Servlet 重新加载到服务器，代码的更改将自动更新并重新编译。


    在 JSP 中，我们可以使用许多标签，例如动作标签、Java 标准标签库 (JSTL)、自定义标签等，这些减少了 Servlet 和 JSP 之间的代码差异。


    在 JSP 的生命周期期间，JSP 页面被转换为 `Servlet`，创建 `Servlet` 对象，并调用 `jspInit()`、`_jspService()`
    和 `jspDestroy()` 来满足请求。


    JSP 页面与静态资源一起放置，即根目录。


    JSP 构建了各种元素和对象，允许 Web 设计师借助嵌入 JSP 元素和对象的帮助编写动态 Web 应用程序。


    在下一章中，我们将学习要嵌入 JSP 页面中的标签。


