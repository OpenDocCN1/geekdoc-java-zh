    Java 代码。当 JSP 转换为 servlet 时，代码会自动移动到 `jspService()` 方法。


    ## 结构


    在本章中，我们将涵盖以下主题：

    *   注释标签

    *   脚本元素

    *   隐式对象


    ## 目标


    学习本章后，你将了解如何在 Web 应用程序中嵌入 Java 代码并学习代码如何自动转换为 servlet。


    ## JSP 元素


    JSP 元素帮助开发者在标签内编写 Java 代码。当 JSP 转换为 servlet 时，代码会自动移动到 `jspService()` 方法。


    它包含以下标签。


    ## 注释标签


    注释标签提供了关于代码各个部分的附加信息，被封装在 `<%--` 和 `--%>` 标签中。当程序员想要从 Web 容器隐藏某些文本或语句时可以使用注释，如下：


    语法：`<% JSP 注释 %>`


    ## 脚本元素


    脚本标签帮助程序员在 Web 应用程序中编写 Java 代码。当 JSP 转换为 servlet 时，代码会自动移动到 `jspService()` 方法。每次请求都会调用
    `jspService` 方法。三种脚本元素如下：


    *   脚本标签

    *   表达式标签

    *   声明标签


    ## 脚本标签


