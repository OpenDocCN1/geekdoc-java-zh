  trans: "\n\n*   **各种结果类型**：在 `struts2` 中，我们可以使用 `JSP`、`freemarker`、`velocity` 等技术作为结果。`Velocity`\
    \ 和 `freemarker` 是基于 Java 的模板引擎。它们都是免费开源的 Web 框架，旨在作为 MVC 架构中的视图组件。\n\n*   **各种标签支持**：为了使\
    \ `struts2` 应用更易用，`Struts2` 包含了许多标签，例如 UI 标签、数据标签、控制标签等。\n\n*   **主题和模板支持**：`Struts2`\
    \ 支持三种不同的主题——`XHTML`、`simple` 和 `CSSXHTML`。`struts2` 的默认主题是 `XHTML`。为了保持一致的外观和感受，可以使用主题和模板。\n\
    \n## Struts2 的组件\n\n`struts2` 中的模型-视图-控制器（Model-View-Controller）模式通过以下五个核心组件实现：\n\
    \n*   **Actions（动作）**：`Action` 类。`Action` 类负责维护状态和处理请求。`Action` 类是一个普通的 Java 类，拥有\
    \ `getter`、`setter` 和 `execute` 方法。它代表了 MVC 模式中的 MODEL 部分。\n\n*   **Controller（控制器）**：在\
    \ `struts2` 中，控制器负责识别传入的请求，选择合适的动作类进行处理，并最终查找 `JSP` 或 `HTML` 文件来显示响应。`Controller`\
    \ 类（`org.apache.struts2.dispatcher.FilterDispatcher`）由 `struts` 框架提供。\n\n*   **Interceptors（拦截器）**：`Interceptors`\
    \ 是容器的辅助组件，包含横切关注点逻辑，并可以在以下两种情况下扩展：\n    *   在执行 `Action` 之前\n    *   在执行 `Action`\
    \ 之后\n\n因此，拦截器是在请求预处理和后处理期间调用的对象。在 `Struts 2` 中，`Interceptor` 用于执行验证、异常处理、国际化、显示中间结果等操作。\n\
    \n*   **Value Stack（值栈）**：`Value Stack` 简单来说包含特定特定对象的栈，如动作对象和其他模型对象。`Value stack`\
    \ 通过名为 `OGNL`（对象图导航语言）的表达式帮助，通过 `struts` 标签获取对象。`value stack` 是一个用于处理客户端请求的数据存储区域。\n\
    \n*   **Results/Result types（结果/结果类型）**：在 `struts2` 中，结果组件负责识别合适的 `JSP` 或 `HTML`\
    \ 来向客户端显示数据。我们也可以根据需要自定义此组件。\n\n*   **视图技术**：使用 `HTML` 或 `JSP` 文件来向用户显示信息。\n\n\
    ## Struts2 架构\n\n`Struts2` 架构与传统的 MVC 模式不同。在这里，`Action` 是一个模型，而控制器类由 `struts2`\
    \ 框架维护。在 `Struts 2` 中，`Servlet Filter`（`Filter Dispatcher`）查看请求，然后根据 `URL` 的映射将请求转发到相应的\
    \ `Action Class`，如图 11.1 所示：\n\n![img](img/193.png)\n\n**图 11.1**：`Strut2` 架构\n\
    \n在[图 11.1]中，**浏览器**发送请求。请求传递给**控制器**。控制器通过 `Struts2` 分发 servlet 过滤器和拦截器实现。控制器找到合适的动作类，发送请求，设置参数并调用\
    \ `execute()` 方法。配置的拦截器功能将生效，例如验证、文件上传等。最后，视图准备结果并将其返回给用户。\n\n## 创建 Struts \n\n\
    以下是创建 Struts 应用的步骤：\n\n1. 创建 `index.xhtml`。\n2. 创建动作类 `Login.java`。\n3. 创建视图 `Welcome.jsp`\
    \ 和 `Invalid.jsp`。\n4. 在 `struts.xml` 中添加 Struts 配置。\n5. 在 `web.xml` 中添加过滤器。\n\
    6. 构建 WAR 文件并运行应用程序。\n\n参考以下代码示例：\n\n**index.xhtml**\n\n```html\n<html>\n    <head>\n\
    \        <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    >\n        <title>JSP Page</title>\n    </head>\n    <body>\n        <form action=\"\
    login.action\">\n            User Name<input type=\"text\" name=\"uname\"/><br>\n\
    \            <input type=\"submit\" value=\"submit\"/>\n        </form>\n    </body>\n\
    </html>\n```\n\n**Action class-Login.java**:\n\n```java\npackage p1;\n\npublic\
    \ class Login\n{\n    private String uname;\n    public String execute()\n   \
    \ {\n        if(uname.equals(\"Sarika\"))\n            return(\"Success\");\n\
    \        else\n            return(\"Invalid\");\n    }\n    public String getUname()\n\
    \    {\n        return uname;\n    }\n    public void setUname(String uname)\n\
    \    {\n        this.uname = uname;\n    }\n}\n```\n\n**Welcome.jsp**\n\n```html\n\
    <%@page contentType=\"text/html\" encoding=\"UTF-8\"%>\n<!DOCTYPE html>\n<html>\n\
    \    <head>\n        <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\"\
    >\n        <title>JSP Page</title>\n    </head>\n    <body>\n        <%@ taglib\
    \ uri=\"/struts-tags\" prefix=\"s\" %>\n        <s:property value=\"uname\"/>\n\
    \    </body>\n</html>\n```\n\n**Invalid.jsp**\n\n```html\n<%@page contentType=\"\
    text/html\" encoding=\"UTF-8\"%>\n<!DOCTYPE html>\n<html>\n    <head>\n      \
    \  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\">\n \
    \       <title>JSP Page</title>\n    </head>\n    <body>\n        <s:property\
    \ value=\"uname\"/>\n    </body>\n</html>\n```\n\n**struts.xml**\n\n```xml\n<?xml\
    \ version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE struts PUBLIC \"-//Apache Foundation//DTD\
    \ Struts Configuration 2.0//EN\"\n\"http://struts.apache.org/dtd/struts-2.0.dtd\"\
    >\n<struts>\n    <package name=\"default\" extends=\"struts-default\">\n     \
    \   <action class=\"p1.Login\" name=\"login\">\n            <result name=\"Success\"\
    >welcome.jsp</result>\n            <result name=\"Invalid\">invalid.jsp</result>\n\
    \        </action>\n    </package>\n</struts>\n```\n\n**web.xml**\n\n```xml\n\
    <?xml version=\"1.0\" encoding=\"UTF-8\"?>\n<!DOCTYPE web-app PUBLIC \"-//Sun/DTD\
    \ Servlet Web Application 3.1//EN\"\n\"http://xmlns.jcp.org/xml/ns/javaee/web-app_3_1.xsd\"\
    >\n<web-app version=\"3.1\" xmlns=\"http://xmlns.jcp.org/xml/ns/javaee\">\n  \
    \  <filter>\n        <filter-name>struts2</filter-name>\n        <filter-class>org.apache.struts2.dispatcher.FilterDispatcher</filter-class>\n\
    \    </filter>\n    <filter-mapping>\n        <filter-name>struts2</filter-name>\n\
    \        <url-pattern>/*</url-pattern>\n    </filter-mapping>\n</web-app>\n```\n"
