    +(result.getString(2)));\n        }\n      }catch(Exception e){System.out.println(e);}\n\
    \    }\n    }\n  }\n}\n```\n\nIn the preceding example, the following happens:\n\
    \n1. The `main()` method creates an object of the `QueryApp` class.\n2. The constructor\
    \ of the `QueryApp` class places the controls on the window.\n3. The query is\
    \ then executed.\n4. When the user clicks the `Next` button, the action `actionPerformed()`\
    \ method moves the `Resultset` object to the next record and displays that record.\n\
    \nThe output of the preceding program is shown in *Figure 1.4](#chap01.xhtml_fig1.4)*:\n\
    \n![img](images/30.png)\n\n***Figure 1.4**: Output of the preceding program*\n\
    \n### Prepared Statement Object\n\nYou have to develop an application that queries\
    \ the database according to the search criteria specified by a user. For example,\
    \ the user supplies the employee-ID-eid and wants to see the details of that employee.\n\
    \n`Select * from employee where eid=?` **You do not know the id** \n\nTo make\
    \ it possible, you must prepare a query statement that receives an appropriate\
    \ value in the `where` clause at run time.\n\n#### Using the Prepared Statement\
    \ object\n\nThe `PreparedStatement` object allows you to execute the parameterized\
    \ queries. The `PreparedStatement` object is created using the `preparedStatement()`\
    \ method of the connection object, as follows:\n\n```java\nPreparedStatement stat\
    \ = con.preparedStatement(\"select * from emp where eid = ?\");\n```\n\nThe `preparedStatement()`\
    \ method of the connection object takes an SQL statement as a parameter. The SQL\
    \ statement can contain the placeholders that can be replaced by the INPUT parameters\
    \ at runtime.\n\n| **NOTE: The \"?\" Symbol is a placeholder that can be replaced\
    \ by the INPUT parameters at runtime.** |\n\n##### Passing Input Parameters\n\n\
    Before executing a `preparedStatement` object, you must set the value of each\
    \ `?` parameter. This is done by calling a `setxxx()` method, where `xxx` is the\
    \ datatype of the parameter. Look at the following code:\n\n```java\nstat.setString(1,\
    \ eid.getText());\nResultSet result = stat.executeQuery();\n```\n\nThe following\
    \ code makes use of the Prepared Statement:\n\n```java\nimport java.sql.*;\nimport\
    \ java.awt.*;\nimport java.awt.*;\n\npublic class QueryApp extends Frame implements\
    \ ActionListener\n{\n  TextField eid,ename;\n  Button query;\n  Panel p;\n  /*\
    \ These variables are declared as static because they have to be accessed in a\
    \ method */\n  static ResultSet result;\n  static Connection con;\n  static PreparedStatement\
    \ stat;\n\n  /* The constructor of the Query App */\n  public QueryApp()\n  {\n\
    \    super(\"The Query Application\");\n    setLayout(new GridLayout(5,1));\n\
    \    eid=new TextField();\n    ename=new TextField();\n    query=new Button(\"\
    Next\");\n    setSize(500,500);\n    p=new Panel();\n    add(new Label(\"Employee\
    \ ID\"));\n    add(eid);\n    add(new Label (\"Employee Name: \"));\n    add(ename);\n\
    \    add(p);\n    p.add(query);\n    query.addActionListener(this);\n    setVisible(true);\n\
    \  }\n\n  /* The main method creates an object of the QueryApp class */\n  public\
    \ static void main (String a [] )\n  {\n    QueryApp obj = new QueryApp();\n \
    \   try {\n      Class.forName(\"oracle.jdbc.driver.OracleDriver\");\n      con\
    \ = DriverManager.getConnection (\"jdbc:oracle:thin:@localhost:1521:xe\",\"system\"\
    ,\"sail_boat1\");\n      stat = con.prepareStatement(\"select * from emp where\
    \ eid = ?\");\n    } catch(Exception e) {\n      System.out.print (\"Error in\
    \ sql\" + e);\n    }\n  }\n\n  @Override\n  public void actionPerformed(ActionEvent\
    \ event) {\n    if(event.getSource()==query)\n    {\n      try{\n        while(\
    \ result.next())\n        {\n          eid.setText(eid.getText()+\"  \"+(result.getString(1)));\n\
    \          ename.setText(ename.getText()+\"  \"+(result.getString(2)));\n    \
    \    }\n      }catch(Exception e){System.out.println(e);}\n    }\n    }\n  }\n\
    }\n```\n\nIn the preceding example, the following happens:\n\n1. The `PreparedStatement`\
    \ object is created using the `preparedStatement()` method.\n2. The parameters\
    \ of the `PreparedStatement` object are initialized when the user clicks the `Next`\
    \ button.\n3. The query is then executed using the `actionPerformed()` method\
    \ and the result is displayed in the corresponding controls, as shown in *Figure\
    \ 1.5](#chap01.xhtml_fig1.5)*:\n\n![img](images/30.png)\n\n***Figure 1.5**: The\
    \ output of the preceding program*\n\n#### Adding Records\n\nYou can use the `executeUpdate()`\
    \ method of the statement object to execute simple INSERT statements, such as\
    \ the following:\n\n```java\nstat.executeUpdate(\"insert <tablename> values ()\"\
    );\n```\n\nThe return value of the `executeUpdate()` method is the number of rows\
    \ affected by the query, as follows:\n\n```java\npublic void addRecord () {\n\
    \  try {\n    stat.executeUpdate(\"Insert into publishers (“1020”, “New Employee”);\n\
    \  } catch (Exception e) { }\n}\n```\n\n| **Note: The Prepared Statement object\
    \ can be used for sending the parameterized INSERT statements to the database.**\
    \ |\n\n#### Modify Records\n\nYou can use the `executeUpdate()` method of the\
    \ statement object to execute simple UPDATE statements, such as the following:\n\
    \n```java\nstat.executeUpdate (\"update <tablename> set <Expr>\");\n```\n\nThe\
    \ return value of the `executeUpdate()` method is the number of rows affected\
    \ by the Query, as follows:\n\n```java\npublic void modifyRecord () {\n  try {\n\
    \    stat.executeUpdate(“update Employee set EName=‘NewEmployee' Where eid= '1234’”);\n\
    \  } catch(Exception e) {\n    System.out.println(\"exception ”+e);\n  }\n}\n\
    ```\n\n| **NOTE: The Prepared Statement object can be used for sending the parameterized\
    \ UPDATE Statements to the database.** |\n\n#### Deleting Records\n\nYou can use\
    \ the `executeUpdate()` method of the statement object to execute simple Delete\
    \ statements, such as the following:\n\n```java\nstat.executeUpdate (\"delete\
    \ <tablename> where <Expr>\");\n```\n\nThe return value of the `executeUpdate()`\
    \ method is the number of rows affected by the query, as follows:\n\n```java\n\
    public void deleteRecord () {\n  try {\n    stat.executeUpdate(“delete Employee\
    \ where Eid = '1234’);\n  } catch (Exception e)  { }\n}\n```\n\n| **NOTE: The\
    \ Prepared Statement object can be used for sending the parameterized DELETE Statements\
    \ to the database.** |\n\n[**Conclusion**](#toc.xhtml_aa19)\n"
