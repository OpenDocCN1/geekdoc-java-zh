    Hello \"+name);\n            out.println(\"</body>\");\n            out.println(\"\
    </html>\");\n        }}}}\n```\n\n`index.xhtml` 的输出如图 5.4 所示：\n\n![img](img/87a.png)\n\
    \n**图 5.4**: 上程序的输出\n\n第一个 Servlet 使用隐藏字段存储名称，如图 5.5 所示：\n\n![img](img/87b.png)\n\
    \n**图 5.5**: ActionServlet1 的输出\n\n第二个 Servlet 从隐藏字段获取名称，如图 5.6 所示：\n\n![img](img/87c.png)\n\
    \n**图 5.6**: Second servlet 的输出\n\n### 使用 HttpSession 接口\n\nServlet API 由一些有助于跟踪跟踪的类和接口组成。Java\
    \ Servlet API 提供名为 `HttpSession` 的接口，用于跟踪会话。\n\n每个登录网站的用户都会自动关联一个 `HttpSession`\
    \ 对象。servlet 可以使用该对象存储会话信息。`HttpSession` 对象允许用户维护两种类型的数据：状态（state）和应用（application）。\n\
    \n状态数据用于维护和检索用户的连接。用户的连接详情可以是会话创建或上次访问的时间。应用数据用于存储详情，例如添加到篮中的商品。可以通过使用 `HttpSession`\
    \ 接口的 `getValue()` 和 `putValue()` 方法来操作应用数据，如表 5.1 所示：\n\n| 方法名 | 功能 |\n| :---\
    \ | :--- |\n| `getSession()` | 获取与用户关联的当前 HTTP 会话。如果不存在会话，可以通过 `getSession(true)`\
    \ 创建会话。 |\n| `getValue(String name)` | 获取会话对象中的值。例如，有一个名为 `itemselected` 的会话对象，可以通过\
    \ `getValue(itemselected)` 获取会话对象中的值。 |\n| `putValue(String name, Object value)`\
    \ | 向会话添加项。 |\n| `isNew()` | 如果了新的会话 ID 尚未发送给客户端，则返回 true。 |\n| `getID()` | 返回会话\
    \ ID。如果使用了 URL 重写，可以使用此函数获取会话并附加到客户端。 |\n| `getCreationTime()` | 返回会话首次创建的时间（毫秒）。\
    \ |\n| `getLastAccessedTime()` | 返回上一次使用相同会话 ID 请求的时间。该函数的返回值会被会话管理器用于优化服务器的活动。\
    \ |\n\n**表 5.1**: HttpSession 接口的方法\n\n"
