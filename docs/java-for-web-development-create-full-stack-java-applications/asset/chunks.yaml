    \nIn this chapter, we learned that JSP actions such as `useBean`, `getProperty`,\
    \ `setProperty`, `setProperty`, and `forward` are used to perform tasks such as\
    \ inserting files, reusing beans, forwarding a user to another page, and instantiating\
    \ objects. The custom tag library provides a mechanism by using which the programmer\
    \ can encapsulate the recurring code or tasks and reuse them in multiple applications.\
    \ Custom tags like XML and HTML tags contain the start and end tags and a body.\
    \ Custom tags can be categorized as simple tags, body tags, tags with attributes,\
    \ or nested tags. Attributes contain parameters that can be used to customize\
    \ the behavior of the custom tags.\n\nThe tag handler and TLD files are created\
    \ to implement the functionality of the custom tags in a JSP file. The tag handler\
    \ is used to define the custom tags and is derived from the `javax.servlet.tagext`\
    \ package that implements the `TagBody` interfaces. The tag handler consists of\
    \ `doStartTag()`, `doEndTag()`, and `release()` methods.\n\nThe tag library definition\
    \ (`TLD`) is an XML file that contains the tag library description and consists\
    \ of the following:\n* taglib\n* tlibversion\n* jspversion\n* info\n* name\n*\
    \ tagclass\n* bodycontent\n\nThe errors in JSP can be categorized as either translation\
    \ time or request time. The error page is a separate file used to trap the runtime\
    \ errors of JSP page. A tag library can be deployed either by separate placements\
    \ of files or by packaging the files. The package files created to contain the\
    \ TLD file and the class files are jar and war files. Expression Language simplifies\
    \ the accessibility of the data stored in the Java Bean and other objects like\
    \ request, session, application, and so on. MVC separates business logic from\
    \ presentation logic. In the next chapter, you will learn Structs Framework with\
    \ a simple example.\n\n## Questions\n\n1. Which JSP action tag is used to include\
    \ the content of another resource, be it JSP, HTML, or servlet?\n   a. `jsp:include`\n\
    \   b. `jsp:forward`\n   c. `jsp:page`\n   d. `jsp:param`\n   **Ans**: a\n\n2.\
    \ What is the requirement of a tag library?\n3. What is a JSP Expression?\n4.\
    \ How do you include static files on a JSP page?\n5. How is Taglib Directive used\
    \ in JSP?\n6. What are custom tags, how do you use them, and how do you create\
    \ them in JSP?\n7. What is the difference between custom JSP tags and JavaBeans?\n\
    8. What is EL?\n9. How does EL search for attribute?\n\n# CHAPTER 11: Introduction\
    \ to Struts\n\n### Introduction\n\nStruts is a framework based on MVC pattern\
    \ to develop web applications. The pattern is the way you can architect your application,\
    \ whereas Framework provides the foundation classes and libraries. The Framework\
    \ helps in the rapid development of common classes. It leverages industry best\
    \ practices. Craig McClanahan built the Struts Framework and submitted it to the\
    \ Apache Foundation in May 2000, and Struts 1.0 was released in June 2001. Struts\
    \ 2.5.22 is the most recent stable release, which was released on November 19,\
    \ 2019. There is some difference between struts1 and struts2.\n\n[Table 11.1](#chap11.xhtml_tab11.1)\
    \ provides the differences between Struts1 and Struts2:\n\n| No. | Struts1 | Struts2\
    \ |\n| :--- | :--- | :--- |\n| 1 | Action class is not POJO. You need to inherit\
    \ the abstract class. | The action class is POJO. You don't need to inherit any\
    \ class or implement any interface. |\n| 2 | Front controller is `ActionServlet`.\
    \ | Front Controller is `StrutsPrepareExecuteFilter`. |\n| 3 | It uses the concept\
    \ of the `RequestProcessor` class while processing requests. | It uses the concept\
    \ of `Interceptors` while processing the request. |\n| 4 | It has only JSP for\
    \ the view component. | For the view component, it has JSP, Freemarker, Velocity,\
    \ and so on. |\n| 5 | The configuration file name can be `[anyname].xml`, and\
    \ it can be placed inside the WEB-INF directory. | The configuration file must\
    \ be `struts.xml` and placed inside the classes directory. |\n| 6 | Action and\
    \ Model are separate. | Action and Model are combined within the action class.\
    \ |\n\n**Table 11.1**: Difference between Struts1 and Struts2\n\n### Structure\n\
    \nIn this chapter, we will cover the following topics:\n* Features of Struts\n\
    * Architecture of Struts\n* Components of Struts\n* Create an application\n\n\
    ### Objective\n\nIn this chapter, you will learn about the struts framework that\
    \ simplifies the development and maintenance of web applications by providing\
    \ predefined functionality. The features and components of Struts2 will also be\
    \ learned. An application based on the framework will also be created to understand\
    \ the Strust2 framework.\n\n### Features of Struts2\n\nThe following are the main\
    \ features of Struts2:\n\n* **Configurable MVC components**: In the struts2 framework,\
    \ we provide all the components' (view components and Action) information in the\
    \ `struts.xml` file. We may simply alter any information in the XML file if we\
    \ need to.\n* **POJO-based actions**: The action class in struts2 is a `Plain\
    \ Old Java Object` (`POJO`), which is a simple Java class. You are not required\
    \ to implement any interfaces or inherit any classes in this environment.\n* **AJAX\
    \ support**: Struts2 has the support of Ajax technology. It's used to make asynchronous\
    \ requests, which means it doesn't keep the user waiting. It just sends the needed\
    \ field data to the server, not all of it. As a result, the performance is quick.\n\
    * **Integration support**: We can simply integrate the struts2 Application with\
    \ framework like hibernate, spring, tiles, and so on.\n"
