    \ 2 Servlet 的输出\n\n### 隐藏表单字段 (Hidden Form Fields)\n\n这是可以使用的技术之一，通过在表单中放置隐藏字段来跟踪用户。当用户提交表单时，这些字段中输入的值会被发送到服务器。对于服务器来说，隐藏表单字段与表单中的其他字段没有区别。\n\
    \n让我们考虑同一个购物场示例。可以使用隐藏表单字段记录用户选择的商品，并提交到服务器处理详细信息。\n\n#### 以下是一个示例\n\n**Hello.xhtml**:\n\
