  trans: "\n\n* `public static ResourceBundle getBundle(String basename, Locale locale)`：根据给定的名称和指定的\
    \ locale 加载资源包，并返回 `ResourceBundle` 类的实例。\n* `public String getString(String key)`：从此资源包中返回对应键的值。\n\
    * `Locale getLocale()`：返回与当前包关联的 Locale。\n* `static final clearCache()`：删除缓存中所有由默认类加载器加载的包。\n\
    * `boolean containsKey()`：如果传递的字符串参数是调用资源包中的一个键，则返回 true。\n* `protected void setParent()`：将传递的包设置为调用者资源包的父包。在查找时，如果在调用对象中未找到该键，则会在父资源包中查找。\n\
    * `final Object getObject()`：从当前资源包或父包中检索并返回与参数传递的键相关联的对象。\n\n| 注意： |\n| :---\
    \ |\n| 属性文件的命名应为 `filename_languagecode_country`，例如 `MyMessage_hi_IN.properties`。\
    \ |\n| 包含 Locale 敏感信息的属性文件也称为资源包。 |\n\n### 开发基于 I18N 应用的步骤\n\n以下是开发基于 I18N 应用的步骤：\n\
    \n1. 识别您想要自定义应用程序的 Locale 敏感信息。\n2. 为每个 Locale 创建属性文件，属性文件的命名必须为 `filename_languagecode_country`。\n\
    3. 获取 `ResourceBundle` 实例。\n4. 借助 `ResourceBundle` 的方法从属性文件中读取消息。\n\n**以下是示例**：\n\
    \n1. 创建 `MessageBundle_hi_IN.properties`，如下：\n`welcome=Namaskar,Kaisehaiaap?`\n\
    \n2. 创建 `MessageBundle_en_US.properties`，如下：\n`welcome=Hello, How are you?`\n\n\
    3. 创建一个 Java 类来获取 `ResourceBundle` 实例，并根据它们的 Locale 从属性文件中读取消息，如下：\n\n```java\n\
    import java.util.Locale;\nimport java.util.ResourceBundle;\n\npublic class I18NDemo\
    \ {\n    public static void main(String[] args) {\n        //Default Locale is\
    \ the US\n        ResourceBundle bundle = ResourceBundle.getBundle(\"MessageBundle\"\
    , Locale.US);\n        System.out.println(\"Message in \" + Locale.US + \": \"\
    \ + bundle.getString(\"welcome\"));\n\n        // Now the default locale change\
    \ to India\n        Locale.setDefault(new Locale(\"hi\", \"IN\"));\n        bundle\
    \ = ResourceBundle.getBundle(\"MessageBundle\");\n        System.out.println(\"\
    Message in \" + Locale.getDefault() + \": \" + bundle.getString(\"welcome\"));\n\
    \    }\n}\n```\n\n**输出如下**：\nMessage in en_US: Hello, How are you?\nMessage in\
    \ hi_IN: Namaskar, Kaise hai aap?\n\n### 日期和时间的国际化（带日期时间的 I18N）\n\n每当 Locale 改变时，日期时间的格式也会发生变化。这意味着日期格式在不同地区是不同的。\n\
    \n`java.text.DateFormat` 类具有以下方法，可以帮助根据地区更改日期时间。\n\n### java.text.DateFormat 的方法\n\
    \n以下是 `java.text.DateFormat` 的方法：\n\n1. `public static DateFormat getDateInstance(int\
    \ style, Locale locale)`：此方法根据指定的样式返回 `DateFormat` 对象，并且 `Locale.This` 对象用于格式化日期而不是时间。\n\
    2. `public static DateFormat getTimeInstance(int style, Locale locale)`：此方法用于根据指定的样式和\
    \ Locale 格式化时间。\n3. `public String format(java.util.Date date)`：此方法将日期格式化为日期时间字符串。\n\
    \n| 注意：DateFormat 类具有以下用于显示日期和时间的样式： |\n| :--- |\n| • static final int SHORT |\n\
    | • static final int LONG |\n| • static final int FULL |\n| • static final int\
    \ MEDIUM |\n| • static final int DEFAULT |\n\n**以下是一个示例**：\n\n```java\nimport\
    \ java.util.Locale;\nimport java.text.DateFormat;\n\npublic class DateFormatDemo\
    \ {\n    public static void main(String[] args) {\n        // TODO Auto-generated\
    \ method stub\n        String lang=\"en\";\n        Locale l=new Locale(lang);\n\
    \        DateFormat df=DateFormat.getDateInstance(DateFormat.SHORT, l);\n    \
    \    System.out.println(df.format(new java.util.Date()));\n\n        // Time\n\
    \        DateFormat df2=DateFormat.getTimeInstance(DateFormat.LONG, l);\n    \
    \    System.out.println(df2.format(new java.util.Date()));\n    }\n}\n```\n\n\
    ### 数字的国际化（带数字的 I18N）\n\n每当 Locale 改变时，数字的格式也会发生变化。这意味着数字格式在不同地区是不同的。`java.text.NumberFormat`\
    \ 类具有以下方法：\n\n* `public static NumberFormat getNumberInstance(Locale locale)`：此方法返回指定\
    \ locale 和样式的 `NumberFormat` 实例。\n* `public static NumberFormat getCurrencyInstance(Locale\
    \ locale)`：此方法返回指定 locale 的 `NumberFormat` 实例。\n* `public static NumberFormat\
    \ getPercentInstance(Locale locale)`：此方法返回指定 locale 的 `NumberFormat` 实例。\n\n**以下是一个示例**：\n\
    \n```java\nimport java.util.Locale;\nimport java.text.NumberFormat;\n\npublic\
    \ class NumberDemo {\n    public static void main(String[] args) {\n        Locale\
    \ l = new Locale(\"US\");\n        NumberFormat nf = NumberFormat.getNumberInstance(l);\n\
    \        System.out.println(nf.format(1234567.89));\n\n        NumberFormat nf2\
    \ = NumberFormat.getCurrencyInstance(l);\n        System.out.println(nf2.format(1234567.89));\n\
    \n        NumberFormat nf3 = NumberFormat.getPercentInstance(l);\n        System.out.println(nf3.format(1234567.89));\n\
    \    }\n}\n```\n\n"
