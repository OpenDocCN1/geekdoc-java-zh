            return "Login Form ";


        }}


    **Web.xml**:


    <?xml version="1.0" encoding="UTF-8"?>


    <web-app version="3.1"


        <servlet>


            <servlet-name>Actionpage</servlet-name>


            <servlet-class>Actionpage</servlet-class>


        </servlet>


        <servlet-mapping>


            <servlet-name>Actionpage</servlet-name>


            <url-pattern>/actionpage</url-pattern>


        </servlet-mapping>


