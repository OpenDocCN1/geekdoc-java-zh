    [CHAPTER 7](#toc.xhtml_ch07)


    [**Java Server Pages (JSP)**](#toc.xhtml_ch07)


    [**Introduction**](#toc.xhtml_aa100)


    With the advent of the Internet, the monolithic application architecture changed
    to a multi-tiered client-server architecture. The need for server-side scripting
    gradually began to dominate the aspects of web programming. Microsoft introduced
    Active Server Pages (ASP) to capture the market demand for server-side scripting.
    Working on similar lines, Sun Microsystems (now taken over by Oracle) released
    Java Server Pages (JSP) to add the server-side programming functionality. It can
    be considered an advancement of the Servlet, as it adds more functionality than
    Servlet, like custom tags and expression language (these will be discussed in
    subsequent chapters). We can write the HTML tags along with the JSP tags. But
    in Servlet, we embed the HTML tag with the help of the out.println() method of
    ServletResponse interface. JSP is platform-independent, whereas ASP is not platform-independent.


    [**Structure**](#toc.xhtml_aa101)


    In this chapter, we will cover the following topics:


    *   Need and features of JSP


    *   Difference between Servlet and JSP


    *   The life cycle of JSP: Example of JSP


    *   Directory Structure of JSP: Structure of Web.xml


    [**Objectives**](#toc.xhtml_aa102)


    After studying this chapter, you will understand the life cycle methods of JSP.
    After compilation, JSP is converted into Servlet and incorporates all functionalities
    of Servlet. You will understand the differences between JSP and Servlet and the
    advantages of JSP.


    [**Need for JSP**](#toc.xhtml_aa103)


    A typical web application consists of the presentation logic representing the
    static content used to design the web page structure in terms of the page layout,
    color, and text. The business logic or the dynamic content involves the application
    of business intelligence and diagnostics in terms of financial and business calculations.
    When developing a web application, time is often lost in situations where the
    developer is required to code for the static content.


    The JSP technology has facilitated the segregation of the work profiles of a web
    designer and a web developer. A web designer can design and formulate the layout
    for the web page by using HTML. On the other hand, a web developer, working independently,
    can use the Java code and other JSP-specific tags to code for the business logic.
    The simultaneous construction of static and dynamic content facilitates the development
    of quality applications with increased productivity.


    A JSP page, after compilation, generates a servlet, and therefore, incorporates
    all the servlet functionalities. Servlets and JSP, thus, share common features
    such as the following:


    *   They are platform-independent.


    *   They create database-driven web applications.


    *   Server-side programming capabilities.


    *   JSP needs no recompilation.


    *   In JSP, visual display and logic are separated.


    [**Difference between Servlet and JSP**](#toc.xhtml_aa104)


    The following are the differences between Servlets and JSP:


    1.  Servlets tie-up files (an HTML file for the static content and a Java file
    for the dynamic content) to handle the static presentation and dynamic business
    logic independently. Due to this, a change made to any file requires recompilation
    of the Servlet. On the other hand, JSP allows Java to be embedded directly into
    an HTML page by using special tags. The HTML content and the Java content can
    also be placed in separate files. Any change made to the HTML content is automatically
    compiled and loaded onto the server.


    2.  Servlet Programming involves extensive coding. Therefore, any change made
    to the code requires identification of the static code content (for the designer)
    and dynamic code content (for the developer) to facilitate the incorporation of
    the changes. On the other hand, a JSP page, by the separate placement of the static
    and dynamic content, facilitates both the web developers and the web designers
    to work independently.


    [**Advantages of JSP**](#toc.xhtml_aa105)


    The following are the advantages of JSP:


    *   Extension to Servlet: JSP is an extension to the Servlet. It supports both
    scripting and dynamic content and allows the developers to create custom tag libraries
    to satisfy the application-specific needs.


    *   Compilation: JSP is always compiled before the server processes it. There
    is no need to recompile and redeploy. If the JSP page is modified, we don''t need
    to recompile and redeploy the project. Whereas the Servlet code needs to be updated
    and recompiled if we have to change the look and feel of the application.


    *   JSP is platform-independent.


    *   There is no need to redeploy JSP.


    *   The length of the JSP code is less than Servlet.


    [**The JSP request-response cycle**](#toc.xhtml_aa106)


    The JSP files are stored on the webserver with an extension of JSP. When the client/browser
    requests for a particular JSP page, the server, in turn, sends a request to the
    JSP engine. *[Figure 7.1](#chap07.xhtml_fig7.1)* represents the process of the
    flow of events that occur after a client request:


    ![img](images/114.png)


    ***Figure 7.1**: The flow of events after client request*'
