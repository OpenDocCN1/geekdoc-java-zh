  raw: 'When a client sends a request to the server, the client can also pass additional
    information with the URL to describe what exactly is required as the output from
    the server by using the **GET** method. The additional sequence of characters
    that are appended to the URL is called a **query string**. However, the length
    of the query string is limited to 240 characters. Moreover, the query string is
    visible on the browser and can therefore be a security risk.


    To overcome these disadvantages, the post method can be used. The **POST** method
    sends the data as packets through a separate socket connection. The complete transaction
    is invisible to the client. The disadvantage of this method is that it is slower
    than the **GET** method because the data is sent to the server as separate packets.


    *[Table 4.1](#chap04.xhtml_tab4.1)* shows the difference between the GET and POST
    methods:


    | **Get** | **Post** |


    | Data is limited to 240 characters | A large amount of data can be sent. |


    | Not Secured | Secured. |


    | Can be bookmarked | Cannot be bookmarked. |


    | Idempotent | Non-Idempotent. |


    | Efficient | It is less efficient and slow. |


    ***Table 4.1**: Difference between Get and Post Method*


    An **example** to develop an application to keep track of the number of users
    visiting your web application or website is as follows:


    import java.io.IOException;


    import java.io.PrintWriter;


    import javax.servlet.ServletConfig;


    import javax.servlet.ServletException;


    import javax.servlet.http.HttpServlet;


    import javax.servlet.http.HttpServletRequest;


    import javax.servlet.http.HttpServletResponse;


      /**Counter to keep track of the number of users visiting the web site */


    public class HitCountServlet extends HttpServlet {


    static int count;


      public void init(ServletConfig config) throws ServletException


      {


    super.init(config);


       }


        protected void doGet(HttpServletRequest request, HttpServletResponse response)


                throws ServletException, IOException {


            count++;


            response.setContentType("text/html;charset=UTF-8");


            try (PrintWriter out = response getWriter()) {


                out.println("<!DOCTYPE html>");


                out.println("<html>");


                out.println("<head>");


                out.println("<title>Servlet HitCountServlet</title>");


                out.println("</head>");


                out.println("<body>");


                out.println("<h1> You are user Number"+String.valueOf(count)+"Visiting
    our website</h1>");


                out.println("</body>");


                out.println("</html>");


            }    }


        @Override


        public String getServletInfo() {


            return "Hit count servlet";}


    }


    The output for the preceding example is shown in *[Figure 4.3:](#chap04.xhtml_fig4.3)*


    ![img](images/72.png)


    ***Figure 4.3**: Result of the preceding program*


    In this example, the following methods are to be used:


    *   The **init()** method needs to be coded in the ***HitCountServlet*** class
    to initialize the hit counter to zero. This method gets invoked automatically
    when the servlet is loaded into the memory. The servlet gets automatically loaded
    on the web container either when the server is started or installed manually using
    some administrative tools.


    *   The **doGet()** method needs to be coded to increment the hit counter whenever
    a client browser requests for the [**http://localhost:8084/WebApplication1/HitCountServlet**](http://localhost:8084/WebApplication1/HitCountServlet)
    home page.


    | **NOTE: If the client does not explicitly specify the request type, then by
    default, the doGet() method is invoked.** |


    [**HttpServletRequest Interface**](#toc.xhtml_aa68)


    This interface extends the **ServletRequest** interface to provide the request
    information for a servlet, such as content type, content length, parameter names
    and values, header information, attributes, etc. It is in the **Javax.servlet.http**
    package.


    [**Method of ServletRequest Interface**](#toc.xhtml_aa69)


    *[Table 4.2](#chap04.xhtml_tab4.2)* shows the methods of the ServletRequest interface:


    | **Method** | **Description** |


    | public String getParameter(String name) | It is used to obtain the value of
    a parameter by name. |


    | public String[] getParameterValues(String name) | It returns an array of String
    containing all the values of the given parameter name. It is mainly used to obtain
    the values of a multi-select list box. |


    | java.util.Enumeration getParameterNames() | It returns an enumeration of all
    of the request parameter names. |


    | public int getContentLength() | It returns the size of the request entity data
    or -1 if not known. |


    | public String getCharacterEncoding() | It returns the character set encoding
    for the input of this request. |


    | public String getContentType() | It returns the Internet Media Type of the request
    entity data or null if not known. |


    | public ServletInputStream getInputStream() throws IOException | It returns an
    input stream for reading binary data in the request body. |


    | public abstract String getServerName() | It returns the host name of the server
    that received the request. |


    | public int getServerPort() | It returns the port number on which this request
    was received. |


    ***Table 4.2**: Methods of ServletRequest Interface*


    With the help of the **ServletRequest** interface, the server can get the parameter
    pass by the user, process it, and send the result back to the user.


    This can be explained with the help of an **example** of the login form where
    the user enters the user name and password. Servlet has used the **getParameter**
    method that returns the value username and password and checks whether the username
    and password are valid or not.


    **Example**


    **index.xhtml**:


    <!DOCTYPE html>


    <html>


    <body>


    <h1>The Login Form</h1>


    <form method="post" action="/LoginForm/actionpage">


    <label for="fname">User name:</label>


    <input type="text" id="uname" name="Uname"><br><br>


    <label for="lname">Password:</label>


    <input type="text" id="pwd" name="pwd"><br><br>


    <input type="submit" value="Submit">


    </form>


    </body>


    </html>


    **Actionpage.java**:


    import java.io.IOException;


    import java.io.PrintWriter;


    import javax.servlet.ServletException;


    import javax.servlet.http.HttpServlet;


    import javax.servlet.http.HttpServletRequest;


    import javax.servlet.http.HttpServletResponse;


    public class Actionpage extends HttpServlet {


     public void doPost(HttpServletRequest request, HttpServletResponse response)


                throws ServletException, IOException {


            response.setContentType("text/html;charset=UTF-8");


            try (PrintWriter out = response.getWriter()) {


    /* TODO output your page here. You may use following sample code. */


                out.println("<!DOCTYPE html>");


                out.println("<html>");


                out.println("<head>");


                out.println("<title>Servlet Actionpage</title>");


                out.println("</head>");


                out.println("<body>");


                String name=request.getParameter("Uname");


                String pwd=request.getParameter("pwd");


                if(name.equals("Sarika") && pwd.equals("vivek"))


                    out.println("<h1>You are successfully login </h1>");


                else


                    out.println("<h1>User Name or Password is Incorrect </h1>");


                out.println("</body>");


                out.println("</html>");


            }


        }


         @Override


