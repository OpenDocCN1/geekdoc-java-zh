    The request-response cycle essentially comprises of two phases, namely the translation
    phase and the request-processing phase. The translation phase is implemented by
    the JSP engine and involves the generation of a servlet. Internally, these result
    in the creation of a class file for the JSP page that implements the servlet interface.
    During the request-processing phase, the response is generated according to the
    request specifications. The `Servlet` then sends back a response corresponding
    to the request received. After the `Servlet` is loaded for the first time, it
    remains active and processes all the subsequent requests with responses, saving
    the time that would otherwise be lost in reloading a servlet at each request.


    ## [Lifecycle of JSP](#toc.xhtml_aa107)


    The JSP lifecycle is a process in which the JSP translates into servlets, and
    then the servlet lifecycle plays its role.


    The JSP page lifecycle completes the following steps:


    1. **Translation of JSP Page**: The JSP container translates the JSP page into
    `Servlet`. own2. **Compilation**: Like any other Java class, the generated `Servlet`
    is compiled into byte code, and is ready to be loaded and executed. The generated
    servlet has the method `jspInit()`, `_jspService()`, and `jspDestroy()`.

    3. **Classloading**: Once JSP is compiled as a servlet class, its lifecycle is
    similar to `Servlet` and it gets loaded into memory.

    4. **Instantiation**: The object of the generated `Servlet` is created.

    5. **Initialization**: The web container invokes the `jspInit()` method. The method
    is called once. After initialization, the `ServletConfig` and `ServletContext`
    objects become accessible to the JSP class. Allow the `Servlet` to initialize
    the instance variables when it''s loaded Request processing; the container invokes
    the `_jspService()` method.

    6. **Destroy**: The container invokes the `jspDestroy()` method. The generated
    `Servlet` is unloaded from memory and the cleanup instance variable from memory
    when it''s shut down.


    | **NOTE: `jspInit()`, `_jspService()`, and `jspDestroy()` are the lifecycle methods
    of JSP.** |


    The JSP page lifecycle is illustrated in [Figure 7.2](#chap07.xhtml_fig7.2):


    ![img](images/115.png)


    **Figure 7.2**: Lifecycle of JSP Page*


    ## [Structure of a JSP Page](#toc.xhtml_aa108)


    A JSP page consists of the regular HTML tags representing the static content and
    the code enclosed within the special tags representing the dynamic content. These
    tags begin with a `<%` and end with a `%>` and contain the scripting and directive
    elements. The scripting elements consist of java code snippets, while the directives
    define the specifications for the entire JSP page. The comment line entries that
    provide additional information about the various sections of the code are enclosed
    within the `<%--` and `--%>` tags. For example, the following JSP code displays
    the server time on the browser. It contains the HTML content and the JSP content
    placed separately within the respective tags.


    The following is an example:


    **index.jsp**


    ```jsp

    <%@page contentType="text/html" pageEncoding="UTF-8"%>

    <%@ page language="java" %>

    <!DOCTYPE html>

    <html>

    <head>

    <title>JSP Example</title>

    </head>

    <body>

    <h1>This is the code within the JSP tags to display the server time</h1>

    <%--IThis is the JSP content that displays the server time by using the Date class
    of the java.utilpackagel----

    <% java.util.Date now=new java.util.Date(); %>

    <H2><%= now %></H2>

    </body>

    </html>

    ```


    The following is the output of `index.jsp`, as shown in [Figure 7.3](#chap07.xhtml_fig7.3):


    ![img](images/116.png)


    **Figure 7.3**: Output of index.jsp*


    ## [The directory structure of the JSP Page](#toc.xhtml_aa109)


    The JSP page is placed in the root folder. It should not be placed in the `WEB-INF`
    directory as we won''t be able to access it directly from the client, as shown
    in [Figure 7.4](#chap07.xhtml_fig7.4):


    ![img](images/117.png)


    **Figure 7.4**: Directory Structure of the JSP page*


    ## [Conclusion](#toc.xhtml_aa110)


    JSP stands for Java Server Pages. It is a server-side technology used for creating
    dynamic web applications. The features of JSP are segregation of the presentation
    and business logic.


    The changes made to the code consecutively are automatically updated and recompiled
    once the Servlet is reloaded into the server.


    In JSP, we can use many tags, such as action tags, Java Standard Tag Library (JSTL),
    custom tags, and so on, that reduce the code difference between Servlet and JSP.


    During the lifecycle of JSP, the JSP page is converted into `Servlet`, the `Object`
    of `Servlet` is created, and `jspInit()`, `_jspService()`, and `jspDestroy()`
    are called to fulfil the request.


    A JSP page is placed with a static resource, i.e., in the root folder.


    JSP builds various elements and objects that allow the web designer to write dynamic
    web applications with the help of the embedded JSP elements and objects.


    In the next chapter, we will study tags to be embedded in the JSP page.


