    *   The vendor-client library needs to be installed on the client machine


    [**Network protocol driver**](#toc.xhtml_aa10)


    It uses middleware (application server) that converts the JDBC calls directly
    or indirectly into the vendor-specific database protocol. It is fully written
    in Java.


    **The following is the advantage**:


    *   No client-side library is required


    **The following are the disadvantages**:


    *   Network support is required


    *   Requires database-specific coding to be done in the middle tier


    *   Maintenance of Network Protocol becomes costly because it requires database-specific
    coding


    [**Thin Driver**](#toc.xhtml_aa11)


    The thin Driver converts the JDBC calls directly into the vendor-specific database
    protocol. That is why it is known as the thin Driver. It is fully written in the
    Java language.


    **The following are the advantages**:


    *   Better performance than all the other drivers


    *   No software is required at the client-side or server-side


    **The following is the disadvantage**:


    *   Drivers depend on the database


    [**Querying a database**](#toc.xhtml_aa12)


    Now that you have understood the JDBC architecture, you can write a Java application
    that can work with a database. In this section, you will learn about the packages
    and classes available in Java that allow you to send the queries to a database
    and process the query results.


    [**Connecting to a database**](#toc.xhtml_aa13)


    The **java.sql** package contains the classes that help in connecting to a database,
    sending embedded SQL statements to the database, and processing the query results.


    [**The connection object**](#toc.xhtml_aa14)


    The connection object represents a connection with a database. You may have several
    connection objects in an application that connects to one or more databases.


    [**Loading the Driver and establishing the connection**](#toc.xhtml_aa15)


    To establish a connection with a database, complete the following steps:


    1.  Register the ODBC JDBC/thin Driver by calling the **forName()** method from
    the Class **class**.


    For example, Class.forName(“oracle.JDBC.driver.OracleDriver”);


    2.  Call the **getConnection(“JDBC URL”)** method from the **DriverManager** class.


    The **getConnection()** method of the Driver Manager class attempts to locate
    the Driver that can connect to the database represented by the JDBC URL passed
    to the **getConnection()** method.


    [**The JDBC URL**](#toc.xhtml_aa16)


    The JDBC-URL is a string that provides a way of identifying a database. A JDBC
    URL is divided into the following three parts:


    <protocol>: <sub protocol> : <subname>


    In this, **<protocol>** in a JDBC URL is always **Jdbc<subprotocol>**, which is
    the name of the database connectivity mechanism. If the mechanism of retrieving
    the data is ODBC-JDBC bridge, the subprotocol must be ODBC. **<Subname>** is used
    to identify the database.


    [**A Sample JDBC URL**](#toc.xhtml_aa17)


    The following is a sample JDBC URL:


    String url = "jdbc:oracle:thin:@localhost:1521:xe";


    // URL For thin Driver


    //"jdbc:oracle:thin:@localhost:1521:xe"


    Class.forName ("**oracle.jdbc.driver.OracleDriver**")


    Connection con = DriverManager. getConnection (url,"system","password");


    [**Processing querying in a database**](#toc.xhtml_aa18)


    Once a connection with the database is established, you can query the database
    and process the result set. JDBC does not enforce any restriction on the type
    of SQL statements that can be sent, but as a programmer, it is your responsibility
    to ensure that the database can process the statements.


    JDBC provides three classes for sending the SQL statements to a database, which
    are as follows:


    *   **The Statement object**: You can create the statement object by calling the
    **create statement ( )** method from the connection object.


    *   **The Prepared Statement object**: You can create the Prepared statement object
    by calling the **preparedStatement ()** method from the connection object. The
    prepared statement object contains a set of methods that can be used for sending
    queries with the INPUT parameters.


    *   **The Callable Statement object**: You can create the Callable Statement object
    by calling the **prepareCall( )** method from the connection object. The CallableStatement
    object contains the functionality for calling a stored procedure. You can handle
    both the INPUT as well as the OUTPUT parameters using the Callable Statement Object.


    **Using the Statement object**


    You can use the statement object to send simple queries to the database as shown
    in the following sample Query-App program:


    //Query App. java


    import java.sql. *;


    public class QueryApp {


      public static void main (String a [] )


      {


       try  {


    Class. forName("oracle.jdbc.driver.OracleDriver");


      Connection con = DriverManager.getConnection ("jdbc:oracle:thin:@localhost:1521:xe","system","sail_boat1");


      Statement stat = con.createStatement();


      stat.executeQuery ("select * from emp");


      }


      catch(Exception e)


      {System.out.print ("Error" + e);


      }


      }


      }


    In the preceding Query App example, the following happens:


         1.  The thin/Oracle driver is loaded.


    2.  The connection object is initialized using the **getConnection()** method.


    3.  The statement object is created using the **createStatement()** method.


    4.  Finally, a simple query is executed using the **executeQuery()** method of
    the statement object.


    **The Statement Object**


    The **Statement** object allows you to execute the simple queries. It has three
    methods that can be used for the purpose of querying, which is as follows:


    *   The **executeQuery()** method executes a simple select query and returns a
    single **ResultSet** object.


    *   The **executeUpdate()** method executes the SQL INSERT, UPDATE, and DELETE
    statement.


    *   The **execute()** method executes an SQL statement that may return multiple
    results.


    **The ResultSet Object**


    The ResultSet object provides you with the methods to access the data from the
    table. Executing a statement usually generates a ResultSet object. It maintains
    a cursor pointing to its current row of data. Initially, the cursor is positioned
    before the first row. The **next()** method moves the cursor to the next row;
    you can access the data from the ResultSet rows by calling the **getxxx()** method,
    where xxx is the data type of the parameter. The following code queries the database
    and processes the ResultSet:


    import java.sql. *;


    public class QueryApp {


      public static void main (String a [] )


      { ResultSet result;


        try  {


      Class.forName("oracle.jdbc.driver.OracleDriver");


      Connection con = DriverManager.getConnection ("jdbc:oracle:thin:@localhost:1521:xe","system","sail_boat1");


      Statement stat = con.createStatement();


      result=stat.executeQuery ("select * from emp");


      while(result.next())


      {


    System.out.println(result.getString(2));/* retrieving data from 2nd Col. of emp
    table*/


      }


      }


      catch(Exception e)


      {System.out.println ("Error" + e);}  }}


    In the preceding Query App example, the following happens:


    1.  The ResultSet object is returned by the **execute****Query()** method.


    2.  All the rows in the ResultSet object are processed using the **next()** method
    in a while loop.


    3.  The values of the second column are retrieved using the **getString()** method.'
