    \n![img](images/122b.png)\n\n**Figure 8.2**: Output of test.jsp page\n\n### [Expression\
    \ Tag](#toc.xhtml_aa118)\n\nIt is used to insert the values directly into the\
    \ output. You need not write the `out.println()` statement to write the data.\n\
    \n**Syntax**: `<%= msg%>`\n\n**The following is an example**:\n\n```html\n<head>\n\
    \  <meta http-equiv=\"Content-Type\" content=\"text/html; charset=UTF-8\">\n \
    \ <title>JSP Page</title>\n</head>\n<body>\n  <%= \"value to be printed\" %>\n\
    </body>\n</html>\n```\n\n**The following is the output**:\n\n**Value to be printed**\n\
    \n### [Declaration tag](#toc.xhtml_aa119)\n\nIt is used to declare the fields\
    \ and methods. The code is written with the help of this tag placed outside the\
    \ service method and gets memory one time, not at every request. The scriptlet\
    \ tag can declare only variables, and all the variables are local variables to\
    \ the service method, whereas, in the declaration tag, both the variables and\
    \ methods can be declared outside the service method.\n\n**Syntax**: `<%! Variable\
    \ or method declaration %>`\n\n| **NOTE: The JSP scriptlet tag can only declare\
    \ the variables, and not the methods, whereas the JSP declaration tag can declare\
    \ both the variables and the methods.** |\n\n**Example**:\n\nIn the following\
    \ example, one variable `data` and method `square` is declared using a declaration\
    \ tag:\n\n```jsp\n%@page contentType=\"text/html\" pageEncoding=\"UTF-8\"%>\n\
    <!DOCTYPE html>\n<html>\n<head>\n  <meta http-equiv=\"Content-Type\" content=\"\
    text/html; charset=UTF-8\">\n  <title>JSP Page</title>\n</head>\n<body>\n  <%!\
    \ int data=120;\n  int square(int n) {return n*n;}\n  %>\n  <%= \"Value of the\
    \ variable is:\"+data %><br>\n  <%= \"square of 4 is:\"+square(4) %>\n</body>\n\
    </html>\n```\n\n**The following is the output**:\n\nValue of the variable is:120\n\
    square of 4 is:16\n\n### [Implicit Objects](#toc.xhtml_aa120)\n\nThe objects in\
    \ JSP can be created implicitly by using the directives, explicitly by using the\
    \ standard actions, or directly by declaring them within the scriptlets. JSP implicit\
    \ objects are certain predefined variables that can be included in the JSP expressions\
    \ and scriptlets. The implicit objects of JSP are implemented from the servlet\
    \ classes and interfaces.\n\nThere are nine implicit objects created by the web\
    \ container and are available in JSP; they are as follows:\n\n1. **application**:\
    \ The application object defines a web application. Usually, it is the `application`\
    \ in the current web context or instance of `ServletContext`. The instance of\
    \ `ServletContext` is created only once by the web container when the project\
    \ is deployed on the server. It is used to set or remove the attribute from the\
    \ application scope.\n   The `application` object can be used to get the initialization\
    \ parameter from the configuration file (`web.xml`). All the JSP pages can use\
