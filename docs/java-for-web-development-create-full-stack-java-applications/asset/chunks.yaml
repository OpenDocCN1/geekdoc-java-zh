    [**Expression Language(EL)**](#toc.xhtml_aa160)


    The **Expression Language** (**EL**) simplifies the accessibility of the data
    stored in the Java Bean component and other objects like request, session, application,
    and so on. There are many implicit objects, operators, and reserve words in EL.
    It is the newly added feature in the JSP technology version 2.0.


    **Syntax**:


    ${ expression }


    **Example**: In the following example, **El.jsp** uses the **param** object to
    get the request **Parameter**:


    **index.jsp**:


    <html>


    <body>


    <form action="El.jsp">


    Enter Name :<input type="text" name="name" /><br/><br/>


    <input type="submit" value="submit"/>


    </form>


    </body>


    </html>


    **el.jsp:**


    <%@page contentType="text/html" pageEncoding="UTF-8"%>


    <!DOCTYPE html>


    <html>


    <body>


          Welcome, ${ param.name }


    </html>


    The following is the output of index.xhtml, as shown in *[Figure 10.10:](#chap10.xhtml_fig10.10)*


    ![img](images/177a.png)


    ***Figure 10.10**: Output of index.xhtml*


    The following is the output of el.jsp, as shown in *[Figure 10.11:](#chap10.xhtml_fig10.11)*


    ![img](images/177b.png)


    ***Figure 10.11**: Output of El.jsp*


    There are many implicit objects used by the Expression language. Some implicit
    objects are listed in *[Table 10.9](#chap10.xhtml_tab10.9)*:


    | **S.No** | **Implicit Objects** | **Usage** |


    | 1 | **pageScope** | It maps the given attribute name with the value set in the
    page scope. |


    | 2 | **requestScope** | It maps the given attribute name with the value set in
    the request scope. |


    | 3 | **sessionScope** | It maps the given attribute name with the value set in
    the session scope. |


    | 4 | **applicationScope** | It maps the given attribute name with the value set
    in the application scope. |


    | 5 | **param** | It maps the request parameter to the single value. |


    | 6 | **paramValues** | It maps the request parameter to an array of values. |


    | 7 | **header** | It maps the request header name to the single value. |


    | 8 | **headerValues** | It maps the request header name to an array of values.
    |


    | 9 | **cookie** | It maps the given cookie name to the cookie value. |


    | 10 | **initParam** | It maps the initialization parameter. |


    | 11 | **pageContext** | It provides access to many objects request, session,
    and so on. |


    ***Table 10.9**: Implicit Objects*


    **The following is an example of Session and Cookie:**


    **index.jsp**:


    <%@page contentType="text/html" pageEncoding="UTF-8"%>


    <!DOCTYPE html>


    <html>


    <body>


    <%


    session.setAttribute("user","Sarika");


    Cookie ck=new Cookie("pwd","sailboat");


    response.addCookie(ck);


    %>


    <a href="process.jsp">visit</a>


    </html>


    **Process.jsp**:


    <%@page contentType="text/html" pageEncoding="UTF-8"%>


    <!DOCTYPE html>


    <html>


    <head>


    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">


    <title>JSP Page</title>


    </head>


    <body>


          Name= ${ sessionScope.user }


           Your Password = ${cookie.pwd.value}


    </body>


    </html>


