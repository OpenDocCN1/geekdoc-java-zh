  trans: "\n\n`javax.Servlet` 包中的 `GenericServlet` 类用于创建可以与任何协议协同工作的 Servlet。`javax.Servlet.http`\
    \ 包用于创建以 HTML 页面形式输出的 HTTP Servlet。用于创建 HTTP Servlets 的类被称为 `HttpServlet`，它继承自\
    \ `GenericServlet` 类。Servlet 中也支持序列化，它通过 `serializable` 接口继承自 `GenericServlet`\
    \ 类来实现化。序列化是将对象写入持久化存储介质（如硬盘）的过程。用于创建 Servlet 的类层次结构如图 `图 3.1` 所示：\n\n![img](img/59.png)\n\
    \n**图 3.1**: Servlet 类层次结构\n\n`表 3.2` 描述了用于创建 Servlet 的类和接口：\n\n| 类/接口名称 | 描述\
    \ |\n| :--- | :--- |\n| `HttpServlet` 类 | 提供 Servlet 接口的 HTTP 特定实现。该类扩展了 `GenericServlet`\
    \ 类，该类为处理其他类型的网络和 Web 服务提供了框架。 |\n| `HttpServletRequest` 接口 | 它扩展了 `ServletRequest`\
    \ 接口以提供处理客户端请求的方法。例如，假设客户端浏览器包含一个有两个字段的表单。当值被提交到服务器进行处理时，将使用 `HttpServletRequest`\
    \ 接口中的方法进行提取。 |\n| `HttpServletResponse` 接口 | 它扩展了 `ServletResponse` 接口以提供发送响应的方法。例如，它具有访问\
    \ HTTP Header 和 Cookie 的方法。 |\n\n**表 3.2**: 用于创建 Servlet 的类和接口\n\n### Servlet\
    \ 的生命周期（#toc.xhtml_aa55）\n\nServlet 的生命周期描述了 Servlet 的状态。Servlet 有三种状态：新创建（new）、就绪（ready）和结束（end）。Servlet\
    \ 的状态通过调用 servlet 方法发生变化。\n\n### Servlet 接口（#toc.xhtml_aa56）\n\nServlet 接口为所有\
    \ Servlet 提供了通用功能。Servlet 接口定义了所有 Servlet 必须实现的方法。`HttpServlet` 和 `GenericServlet`\
    \ 直接或间接地实现了 Servlet 接口。Servlet 接口提供了三个用于实现任何 Servlet 的生命周期方法。\n\nServlet 在内存中只加载一次，并在\
    \ `init()` 方法中初始化。Servlet 初始化后，开始接收来自客户端的请求，并通过 `service()` 方法处理它们，直到被 `destroy()`\
    \ 方法关闭。`service()` 方法会在每个传入的请求时执行。Servlet 的生命周期如下：\n\n1. 加载 Servlet 类。\n2. 创建\
    \ Servlet 实例。\n3. 调用 `init` 方法。\n4. 调用 `service` 方法。\n5. 调用 `destroy` 方法。\n\n\
    参考 `图 3.2,#chap03.xhtml_fig3.2)`，该图说明了 Servlet 的生命周期：\n\n![img\n\n**图 3.2**: Servlet\
    \ 的生命周期\n\n`表 3.3` 描述了 Servlet 接口的方法：\n\n| 序号 | 方法名 | 描述 |\n| :--- | :--- | :---\
    \ |\n| 1 | `public void init(ServletConfig config) throws Servlet Exception` |\
    \ 它包含 Servlet 的所有初始化代码，并在 Servlet 首次加载和创建时被调用。 |\n| 2 | `public void service(ServletRequest\
    \ request,ServletResponse response);` | 它接收来自客户端的所有请求，识别请求类型，并将其分发到 `doGet()`\
    \ 或 `doPost()` 方法进行处理。 |\n| 3 | `public void destroy()` | 当 Servlet 从服务器上移除时执行一次。必须在此方法中提供\
    \ Servlet 的清理代码。 |\n| 4 | `public ServletConfig getServletConfig();` | 返回 `ServletConfig`\
    \ 对象。 |\n| 5 | `public String getServletInfo()` | 返回关于 Servlet 的信息，如作者、版权、版本等。\
    \ |\n\n**表 3.3**: Servlet 接口的方法\n\n### 创建 Servlet（#toc.xhtml_aa57）\n\n除了三个生命周期方法（`init()`、`service()`\
    \ 和 `destroy()`）之外，还有两个方法也用于创建 Servlet。\n\n`表 3.4` 同样描述了了用于创建 Servlet 的两个方法：\n\
    \n| 序号 | 方法名 | 描述 |\n| :--- | :--- | :--- |\n| 1 | `ServletResponse.getWriter()`\
    \ | 它返回一个 `PrintWriter` 对象的引用。`PrintWriter` 类用于将格式化对象作为文本输出流写入客户端。 |\n| 2 | `ServletResponse.setContentType(String\
    \ type)` | 它设置发送到客户端浏览器响应的内容类型。例如，`setContentType(\"text/html\")` 用于将响应类型设置为文本。\
    \ |\n\n**表 3.4**: 与生命周期方法一起用于创建 Servlet 的方法\n\n**Servlet 可以通过以下三种方式之一创建：**\n\n\
    * 通过实现 `Servlet` 接口\n* 通过继承 `GenericServlet` 类\n* 通过继承 `HttpServlet` 类\n\n**1.\
    \ 以下是通过实现以下接口创建的 servlet 示例：**\n\n```java\nimport java.io.*;\nimport javax.servlet.*;\n\
    \npublic class FirstServlet implements Servlet {\n    ServletConfig config=null;\n\
    \n    public void init(ServletConfig config) {\n        this.config=config;\n\
    \        System.out.println(\"Servlet is initialized\");\n    }\n\n    public\
    \ void service(ServletRequest req,ServletResponse res) throws IOException, ServletException\
    \ {\n        res.setContentType(\"text/html\");\n        PrintWriter out=res.getWriter();\n\
    \        out.print(\"<html><body>\");\n        out.print(\"<b>This is First Servlet</b>\"\
    );\n        out.print(\"</body></html>\");\n    }\n\n    public void destroy()\
    \ {\n        System.out.println(\"Servlet is destroyed\");\n    }\n\n    public\
    \ ServletConfig getServletConfig() {\n        return config;\n    }\n\n    public\
    \ String getServletInfo() {\n        return \"Institute of Learning- Advance First\
    \ Servlet\";\n    }\n}\n```\n\n### 编译 Servlet\n\n编译 Servlet 需要加载 JAR 包。不同的服务器需要不同的\
    \ JAR 包。\n\n`表 3.5` 提供了不同服务器和 JAR 包的列表：\n\n| Jar 文件 | 服务器 |\n| :--- | :--- |\n\
    | `javaee.jar` | Glassfish/JBoss |\n| `weblogic.jar` | Weblogic |\n| `servlet-api.jar`\
    \ | Apache Tomcat |\n\n**表 3.5**: 不同服务器和 JAR 包的列表\n\n### 创建描述符（web.xml 文件）（#toc.xhtml_aa58）\n\
    \n描述符是一个 XML 文件，Web 容器从中获取要调用的 Servlet 信息。Web 容器使用解析器从 **web.xml** 文件获取信息。有很多\
    \ XML 解析器，如 SAX、DOM 和 Pull。对于 Servlet 或 HTML 页面（可能包含指向 Servlet 的链接），要从客户端访问，必须先部署在\
    \ Web 服务器上。\n\n注意：web.xml 中 Servlet 的 `load-on-startup` 用于在部署项目或启动服务器时加载 Servlet。这节省了首次请求响应的时间。如果你传递正值，较小整数值的\
    \ Servlet 将比较大整数值的 Servlet 先加载。换句话说，容器按照整数值的升序加载 Servlet。0 值先加载，然后是 1、2、3 等以此此类推。\n\
    \n**web.xml** 文件中使用的基本元素描述如下：\n\n* `<web-app>` 代表整个应用程序。\n* `<Servlet>` 是 `<web-app>`\
    \ 的子元素，代表 Servlet。\n* `<Servlet-name>` 是 `<Servlet>` 的子元素，代表 Servlet 的名称。\n\n"
- fmt: "\n*   `<Servlet-class>` is a sub-element of `<Servlet>` and represents the\
    \ class of the Servlet.\n\n*   `<Servlet-mapping>` is a sub-element of `<web-app>`.\
    \ It is used to map the Servlet.\n\n*   `<url-pattern>` is a sub-element of `<Servlet-mapping>`.\
    \ This pattern is used on the client-side to invoke the `Servlet.web.xml`, as\
    \ follows:\n\n*   `<load-on-startup>1</load-on-startup>.`. Servlet with less number\
    \ will be loaded first.\n\n### Web.xml\n\n```xml\n<web-app>\n    <Servlet>\n \
    \       <Servlet-name>FirstServlet</Servlet-name>\n        <Servlet-class>FirstServlet</Servlet-class>\n\
    \    </Servlet>\n    <Servlet-mapping>\n        <Servlet-name>FirstServlet</Servlet-name>\n\
    \        <url-pattern>/FirstServlet</url-pattern>\n    </Servlet-mapping>\n  \
    \  <session-config>\n        <session-timeout>30</session-timeout>\n    </session-config>\n\
    </web-app>\n```\n\nNow, start the server and run the Servlet. The output of the\
    \ Servlet is shown in [Figure 3.3](#chap03.xhtml_fig3.3):\n\n![img](images/65.png)\n\
    \n**Figure 3.3: Output of the Servlet**\n\n### 2. The following is an example\
    \ of a servlet created by extending the GenericServlet class\n\n**GenericServlet\
    \ class**: It is an abstract class that implements `Servlet`, `ServletConfig`,\
    \ `Serializable` interface. It has given body of all the methods of servlet interface\
    \ except `service()` method. Therefore, a programmer has to give the body of `service()`\
    \ method. It is protocol-independent.\n\n**Program:**\n\n```java\nimport java.io.*;\n\
    import javax.Servlet.*;\n\npublic class FirstServlet implements Servlet\n{\n \
    \   public void service(ServletRequest req,ServletResponse res)\n    throws IOException,ServletException\n\
    \    {\n        res.setContentType(\"text/html\");\n        PrintWriter out=res.getWriter();\n\
    \        out.print(\"<html><body>\");\n        out.print(\"<b>This is First Servlet\
    \ through Servlet Interface</b>\");\n        out.print(\"</body></html>\");\n\
    \    }\n}\n```\n\n**HttpServlet**: HTTP is a web-specific protocol and has rules\
    \ for the conversation between the browser requests and the webserver responses.\
    \ In the next chapter, you will learn about `HttpServlet`.\n\n### Conclusion (#toc.xhtml_aa59)\n\
    \nIn this chapter, you learned that Servlets are server-side Java programs that\
    \ can be deployed on a web server. The `Servlet` interface provides the basic\
    \ framework for coding the Servlets. Servlets are portable, extensible, persistent,\
    \ and robust. The lifecycle of a Servlet is composed of the `init()`, `service()`,\
    \ and `destroy()` methods. Servlets can be deployed in Glassfish, Weblogic, and\
    \ Apache Tomcat.\n\nIn the next chapter, you will learn about `HTTPServlet`. HTTP\
    \ is a web-specific protocol and has rules for the conversation between the browser\
    \ requests and the webserver responses. HTTP adds the header information to the\
    \ top of whatever content is in the response sent by the server. The browser uses\
    \ that header information to help process the HTML page. `HTTPServlet` provides\
    \ a framework for handling the HTTP protocol, whereas `GenericServlet` is protocol-independent.\n\
    \n### Questions (#toc.xhtml_aa60)\n\n1. What is different between the web server\
    \ and the application server?\n2. What are the advantages of Servlets over CGI?\n\
    3. Which class is used by a Servlet to receive a request from the client?\n4.\
    \ What is the difference between Applet and Servlet?\n5. How do we compile the\
    \ Servlet?\n6. Where does the Servlet store, and where does it run?\n7. What are\
    \ the life cycle methods for a Servlet?\n8. What is the use of URL-pattern in\
    \ `web-app.xml`?\n\n# CHAPTER 4 (#toc.xhtml_ch04)\n\n## HTTP Servlet (#toc.xhtml_ch04)\n\
    \n### Introduction (#toc.xhtml_aa61)\n\nThis chapter focuses on the things related\
    \ to what the HTTP servlets can do. HyperText Transfer Protocol (HTTP) is a stateless\
    \ protocol used to make the communication between the browser and the webserver.\
    \ For example, when a user sends a request to open a specific page, the rules\
    \ in the HTTP protocol are to be followed. `HTTPServlet` has implemented all the\
    \ rules of the HTTP protocol.\n\n### Structure (#toc.xhtml_aa62)\n\nIn this chapter,\
    \ we will cover:\n*   HTTP Request\n*   HTTP Response\n*   HTTP Methods\n\n###\
    \ Objectives (#toc.xhtml_aa63)\n\nIn this chapter, we will cover:\n*   HTTP Request\n\
    *   HTTP Response\n*   HTTP Methods (specifically `GET` and `POST`)\n\nAfter studying\
    \ this chapter, you will learn about `HTTPServlet`.\n\n### HTTP Servlet (#toc.xhtml_aa64)\n\
    \nIt is an abstract class that extends the generic servlet, as shown in [Figure\
    \ 4.1](#chap04.xhtml_fig4.1):\n\n![img](images/68.png)\n\n**Figure 4.1: Hierarchy\
    \ of HttpServlet**\n\n### Need of HttpServlet class (#toc.xhtml_aa65)\n\nA web\
    \ server takes the client request and gives something back to the browser in the\
    \ HTML format. HTTP is a web-specific protocol and has rules for the conversation\
    \ between the browser requests and the webserver responses. `HTTPServlet` provides\
    \ a framework for handling the HTTP protocol, whereas `GenericServlet` is protocol-independent.\n\
    \n### HTTP Request and Response (#toc.xhtml_aa66)\n\nThe browser sends a client's\
    \ request inside the HTTP Request, and the server passes the data inside the HTTP\
    \ Response, as shown in [Figure 4.2](#chap04.xhtml_fig4.2):\n\n![img](images/69.png)\n\
    \n**Figure 4.2: HTTP Request and Response**\n\nHTTP Protocol has several methods.\
    \ This method name tells the server the kind of request being made. For example,\
    \ the client sends an `HTTP Get` request to the server asking to get the page\
    \ from the specified resource. When a user sends an `HTTP Post` request to the\
    \ server, the user sends the data to the server or updates a resource. `HttpServlet`\
    \ provides various methods of HTTP specific, which are as follows:\n\n*   `public\
    \ void service(ServletRequest req, ServletResponse res)`: Dispatches the request\
    \ to the protected method by converting the request and response object into the\
    \ HTTP type.\n*   `protected void service(HttpServletRequest req, HttpServletResponse\
    \ res)`: Receives the request from the service method and dispatches the request\
    \ to the `doXXX()` method depending on the incoming HTTP request type.\n*   `protected\
    \ void doGet(HttpServletRequest req, HttpServletResponse res)`: Handles the `GET`\
    \ request. The web container invokes it.\n*   `protected void doPost(HttpServletRequest\
    \ req, HttpServletResponse res)`: Handles the `POST` request. The web container\
    \ invokes it.\n*   `protected void doGetHead(HttpServletRequest req, HttpServletResponse\
    \ res)`: Handles the `HEAD` request. The web container invokes it.\n*   `protected\
    \ void doOptions(HttpServletRequest req, HttpServletResponse res)`: Handles the\
    \ `OPTIONS` request. It is invoked by the web container.\n*   `protected void\
    \ doPut(HttpServletRequest req, HttpServletResponse res)`: Handles the `PUT` request.\
    \ It is invoked by the web container.\n*   `protected void doTrace(HttpServletRequest\
    \ req, HttpServletResponse res)`: Handles the `TRACE` request. It is invoked by\
    \ the web container.\n*   `protected void doDelete(HttpServletRequest req, HttpServletResponse\
    \ res)`: Handles the `DELETE` request. It is invoked by the web container.\n*\
    \   `protected long getLastModified(HttpServletRequest req)`: Returns the time\
    \ when `HttpServletRequest` was last modified since midnight January 1, 1970 GMT.\n\
    \n### The GET and POST methods (#toc.xhtml_aa67)\n"
