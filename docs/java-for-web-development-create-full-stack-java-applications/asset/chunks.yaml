    user_name\");\n    out.println(name);\n  %>\n</body>\n</html>\n```\n\n以下是 `index.xhtml`\
    \ 的输出，如*图 8.1**所示：\n\n![img](img/122a.png)\n\n**图 8.1**: index.xhtml 的输出\n\n点击\
    \ `submit` 后，我们得到以下输出，如*图 8.2**所示：\n\n![img](img/122b.png)\n\n**图 8.2**: test.jsp\
    \ 页面的输出\n\n### 表达式标签\n\n它用于直接将值插入到输出中。你不需要编写 `out.println()` 语句来写入数据。\n\n**语法**：`<%=\
    \ msg%>`\n\n**以下是一个示例**：\n\n```html\n<head>\n  <meta http-equiv=\"Content-Type\"\
    \ content=\"text/html; charset=UTF-8\">\n  <title>JSP 页面</title>\n</head>\n<body>\n\
    \  <%= \"要打印的值\" %>\n</body>\n</html>\n```\n\n**以下是输出**：\n\n**要打印的值**\n\n### 声明标签\n\
    \n它用于声明字段和方法。代码通过此标签的帮助写在服务方法（service method）之外，并且只在加载时分配一次内存，而不是每次请求都都分配。脚本段标签（scriptlet\
    \ tag）只能声明变量，且所有变量都是服务方法的局部变量；而在声明标签中，变量和方法都可以在服务方法之外声明。\n\n**语法**：`<%! 变量或方法声明\
    \ %>`\n\n| **注意：JSP 脚本段标签只能声明变量不能声明方法，而 JSP 声明标签可以同时声明变量和方法。** |\n\n**示例**：\n\n\
    在以下示例中，使用声明标签声明了一个变量 `data` 和方法 `square`：\n\n```jsp\n%@page contentType=\"text/html\"\
    \ pageEncoding=\"UTF-8\"%>\n<!DOCTYPE html>\n<html>\n<head>\n  <meta http-equiv=\"\
    Content-Type\" content=\"text/html; charset=UTF-8\">\n  <title>JSP 页面</title>\n\
    </head>\n<body>\n  <%! int data=120;\n  int square(int n) {return n*n;}\n  %>\n\
    \  <%= \"变量的值是:\"+data %><br>\n  <%= \"4 的平方是:\"+square(4) %>\n</body>\n</html>\n\
    ```\n\n**以下是输出**：\n\n变量的值是：120\n4 的平方是：16\n\n### 隐式对象\n\nJSP 中的对象可以通过指令（directives）隐式地创建，可以通过使用标准动作（standard\
    \ actions）显式地创建，或者直接在脚本段（scriptlets）中声明。JSP 隐式对象是某些预定义的变量，可以包含在 JSP 表达式和脚本段中。JSP\
    \ 隐式对象由 Servlet 类和接口实现。\n\nWeb 容器创建了九个隐式对象并在 JSP 中可用，如下：\n\n1. **application**:\
    \ application 对象定义了一个 Web 应用程序。通常，它是当前 Web 上下文中 `application` 或 `ServletContext`\
    \ 的实例。`ServletContext` 实例仅在项目部署到服务器时由 Web 容器创建一次。它用于从应用范围设置或删除属性。\n   `application`\
    \ 对象可以从配置文件（`web.xml`）获取初始化参数。所有的 JSP 页面都可以使用此初始化参数。\n   **示例**：密码存储在 `context-param`\
    \ 中，可以借助 `application` 对象获取。参考以下示例代码：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <title>隐式对象</title>\n  <meta charset=\"UTF-8\">\n  <meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\">\n</head>\n<body>\n  <form\
    \ method=\"post\" action=\"submit.jsp\" >\n    <input type=\"text\" name=\"uname\"\
    >\n    <input type=\"submit\" value=\"提交\"><br/>\n  </form>\n</body>\n</html>\n\
    ```\n\n"
- fmt: "\n# Last Name is Agarwal\n\nSome methods that can be used with the `HttpServletRequest`\
    \ interface are listed as follows:\n\n* `getCookies()`: It is used to pass the\
    \ cookie information along with the request. `Cookies` are textual data that are\
    \ sent from the server to a browser. The data thus sent is retrievable in subsequent\
    \ transactions.\n* `getSession()`: It is used to get the current session associated\
    \ with the request object. If a session is not associated with the request, it\
    \ creates a new session.\n* `getMethod()`: It is used to return a String specifying\
    \ the presence of HTTP get, post, or put methods to the request.\n* `getQueryString()`:\
    \ It is used to return the query passed along with the `request(GET)`.\n\n## 5.\
    \ response\nThis represents a response object of `HttpServletResponse` that is\
    \ used to write an HTML output onto the browser using methods such as `response.getWriter()`.\n\
    \nSome methods that can be used with the `HttpServletResponse` interface are listed\
    \ as follows:\n\n* `addCookie()`: It is used to add a cookie along with the response.\
    \ The maximum number of cookies accepted by the browser is 20.\n* `sendRedirect()`:\
    \ It is used to specify a new URL to the browser. The invocation of the method\
    \ terminates the prior response and redirects the browser contents to a new URL.\n\
    \n## 6. session\nThis represents a session object of `HttpSession` that is used\
    \ to store the object between client requests.\n\n**Example**: The following codes\
    \ use the request implicit object to access the values of the user input; set\
    \ the parameter in session and access the same:\n\n**index.xhtml**:\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"UTF-8\">\n<meta name=\"viewport\"\
    \ content=\"width=device-width, initial-scale=1.0\">\n</head>\n<body>\n<form method=\"\
    post\" action=\"next.jsp\" >\n    First Name: <input type=\"text\" name=\"uname\"\
    >\n    Last Name: <input type=\"text\" name=\"lname\">\n    <input type=\"submit\"\
    \ value=\"Submit\"><br/>\n</form>\n</body>\n</html>\n```\n\n**Bottom of Form:**\n\
    After clicking on the **Submit** button, the following code will run:\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<%\n    String str1=request.getParameter(\"uname\");\n\
    \    String str2=request.getParameter(\"lname\");\n    HttpSession sess=request.getSession(true)\
    \ ;\n    sess.setAttribute(\"FName\", str1);\n    sess.setAttribute(\"LName\"\
    , str2);\n%>\n<body>\n<%\n    out.println(\"First name is \"+session.getAttribute(\"\
    FName\"));\n    out.println(\"<br>Last Name is\"+session.getAttribute(\"LName\"\
    ));\n%>\n</body></html>\n```\n\nThe following is the output of `index.xhtml`,\
    \ as shown in *[Figure 8.6](#chap08.xhtml_fig8.6)*:\n\n![img](images/131a.png)\n\
    \n**Figure 8.6**: Output of the preceding program (index.xhtml)\n\nThe following\
    \ is the output of `next.jsp`, as shown in *[Figure 8.7](#08.xhtml_fig8.7)*:\n\
    \n![img](images/131b.png)\n\n**Figure 8.7**: Output of next.jsp (Retrieval from\
    \ Session Object)\n\n## 7. Config\nIt is an implicit object of `ServletConfig`.\
    \ The web container creates this object. It is used to set or get the parameter\
    \ for a JSP page.\n## 8. exception\nIt is an implicit object of `java.lang.Throwable`.\
    \ It is used to print the `exception`.\n## 9. pageContext\nIt is an implicit object\
    \ of `PageContext`. It is used to set, get, and remove the attribute from the\
    \ page, session and application scope. By default, JSP has Page scope.\n\n## Conclusion\n\
    In this chapter, we learned that a JSP page consists of HTML and JSP tags. The\
    \ JSP tags include comments, scriptlets, expressions, and actions. The JSP comment\
    \ tag provides additional information about the various sections of code and are\
    \ enclosed within `<-- --` tags. Scriptlet tag consists of valid code placed within\
    \ `<%` and `%>` tags. JSP expressions are used to insert values into the output.\
    \ There are nine implicit objects in JSP. In the next chapter, we will learn how\
    \ to provide global information about a particular page and how to give information\
    \ to Web Container while converting a JSP page to a corresponding servlet.\n\n\
    ## Questions\n1. What are JSP elements?\n2. What is the role of scriptlet tag?\n\
    3. What is the difference between JSP scriptlet tag and JSP declaration tag?\n\
    4. How do we use comments within a JSP page?\n5. How many implicit objects are\
    \ there in JSP?\n6. What is the use of implicit objects in JSP?\n\n## Select the\
    \ Correct Option\n1. Which of the scripting of JSP does not put content into service\
    \ method of the converted servlet?\nA. Scriptlets\nB. Declarations\nC. Expressions\n\
    D. None of the above\n**Answer**: C\n\n2. Which of the following tags is used\
    \ to execute the Java source code in JSP?\nA. Scriptlets\nB. Declarations\nC.\
    \ Expressions\nD. None of the above\n**Answer**: A\n\n3. Which of the following\
    \ is the correct order of phases in the JSP life cycle?\nA. Compilation, Initialization,\
    \ Execution, Cleanup\nB. Cleanup, Compilation, Initialization, Execution\nC. Initialization,\
    \ Cleanup, Compilation, Execution\nD. Initialization, Compilation, Cleanup, Execution\n\
    **Answer**: A\n\n4. J2EE includes which of the following enterprise-specific APIs?\n\
    A. Java Message Service (JMS)\nB. Enterprise JavaBeans (EJB)\nC. JavaServer Pages\
    \ (JSP)\nD. All of the above\n**Answer**: All of the above\n\n5. A JSP page is\
    \ transformed into_.\nA. Java Class\nB. Java Servlet\nC. Java Bean\n**Answer**:\
    \ Java Servlet\n\n6. JSP pages provide a means to create a dynamic web page using\
    \ HTML and Java language.\nA. True\nB. False\n**Answer**: True\n"
