    [CHAPTER 3](#toc.xhtml_ch03)


    [**Introduction to Java Servlets**](#toc.xhtml_ch03)


    [**Introduction**](#toc.xhtml_aa42)


    Consider a situation where you would like to register yourself with a website
    to get a free newsletter subscription. The information you are required to provide
    is your first name, last name, and your organization''s name. In addition, you
    can choose an ID for yourself to log in to the website. After entering the details
    and clicking on the Submit button, the entered data is forwarded to the web server
    for processing. Processing in this situation could consist of checking whether
    the ID you have entered is already in use or checking for invalid values. If the
    ID is already in use, the user is asked to choose a different ID. Validations
    such as checking for blank fields and negative values could be done on the client''s
    side itself to reduce the overhead of the server. Small programs that are written
    for such purposes are called client-side scripts. VB scripts and Java scripts
    are two languages that can be used for client-side scripting. The programs that
    take care of processing the web server''s data are called server-side scripts.
    The web applications also demand more functionality from the webserver. This has
    triggered the development of tools that enable efficient server-side programming,
    such as Servlets, Java Server Pages (JSP), Active Server Pages (ASP), and so on.


    [**Structure**](#toc.xhtml_aa43)


    In this chapter, we will cover the following topics:


    *   Webserver


    *   Servlets and their characteristics


    *   Comparison between Servlet and Applet


    *   Working of Servlet


    *   Lifecycle of Servlet


    *   Methods of Servlet


    *   Deployment descriptor


    [**Objectives**](#toc.xhtml_aa44)


    After studying this chapter, you will learn how to communicate with the webserver
    with the help of Servlets. You will understand the lifecycle methods of Servlets.
    You will also learn how the web container gets the information about Servlets
    with the help of the deployment descriptors.


    [**Webserver**](#toc.xhtml_aa45)


    A webserver takes the client request, finds the resource (HTML page, picture,
    sound file, records), and returns something to the user. When the server does
    not find a requested resource, it gives 404 “Not Found Error.” The webserver is
    a combination of the hardware and the software. Hardware can be any physical machine,
    and software is a web server application.


    [**Introduction to Servlets**](#toc.xhtml_aa46)


    Servlets are Java programs that can be deployed on a Java-enabled webserver to
    enhance and extend the functionality of the webserver. For example, you can write
    a Servlet to add a messenger service to the Earnest Bank website. Servlets can
    also be used to add dynamic content to web pages. For example, you can use a Servlet
    to retrieve the latest gift offers provided by the Earnest Bank from an information
    database and display it on the bank''s home page.


    [**Characteristics of Servlets**](#toc.xhtml_aa47)'
