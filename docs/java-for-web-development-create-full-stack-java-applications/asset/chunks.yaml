    In the preceding example, the following happens:


    1.  The **main()** method creates an object of the QueryApp class.


         2.  The constructor of the Query App class places the controls on the window.


         3.  The query is then executed.


    4.  When the user clicks the **Net** button, the action **Performed()** method
    moves the **Resultset** object to the next record and displays that record.


    The output of the preceding program is shown in *[Figure 1.4](#chap01.xhtml_fig1.4)*:


    ![img](images/30.png)


    ***Figure 1.4**: Output of the preceding program*


    **Prepared Statement Object**


    You have to develop an application that queries the database according to the
    search criteria specified by a user. For example, the user supplies the employee-ID-eid
    and wants to see the details of that employee.


    Select * from employee where eid=? **You do not know the id**


    To make it possible, you must prepare a query statement that receives an appropriate
    value in the where clause at run time.


    **Using the Prepared Statement object**


    The Prepared Statement object allows you to execute the parameterized queries.
    The Prepared Statement object is created using the **preparedStatement()** method
    of the connection object, as follows:


    PreparedStatement stat = con.preparedStatement("select * from emp where eid =
    ?");


    The **preparedStatement()** method of the connection object takes an SQL statement
    as a parameter. The SQL statement can contain the placeholders that can be replaced
    by the INPUT parameters at runtime.


    | **NOTE: The "?" Symbol is a placeholder that can be replaced by the INPUT parameters
    at runtime.** |


    **Passing Input Parameters**


    Before executing a **preparedStatement** object, you must set the value of each**?**
    parameter. This is done by calling a **setxxx()** method, where xxx is the datatype
    of the parameter. Look at the following code example:


    Stat. setString (1, eid.getText());


    ResultSet result = stat. executeQuery ();


    The following code makes use of the Prepared Statement Object:


    import java.sql.*;


    import java.awt.*;


    import java.awt. event.*;


    public class PreparedQuery extends Frame implements ActionListener


    {


    TextField eid, ename;


    Button query;


    Panel p;


    /* These variables are declared as static because they have to be accessed in
    a static method*/


    static ResultSet result;


    static Connection con;


    static PreparedStatement stat;


    /* The constructor of the Prepared Query App class */


    public  PreparedQuery()


    {


      super("The Query Application");


      setLayout(new GridLayout(5,1));


      eid=new TextField();


      ename=new TextField();


      query=new Button("QUERY");


      setSize(500,500);


      p=new Panel();


      add(new Label("Employee ID"));


      add(eid);


      add(new Label ("Employee Name: "));


      add(ename);


      add(p);


      p.add(query);


      query.addActionListener(this);


      setVisible(true);


    }


    /* The main method creates an object of the class and displays the first record*/


    public static void main (String a [] )


    {


      PreparedQuery obj = new PreparedQuery( );


    try {


      Class.forName("oracle.jdbc.driver.OracleDriver");


      con = DriverManager.getConnection ("jdbc:oracle:thin:@localhost:1521:xe","system","sail_boat1");


      stat = con.prepareStatement ("select * from emp where id= ?");


    }


    catch(Exception e)


    {


    System. out. print ("Error in sql" + e);


    }


    }


    @Override


    public void actionPerformed(ActionEvent event) {


      if(event.getSource()==query)


      {


        try{


          stat.setString(1,eid.getText());


          result=stat.executeQuery();


          while(result.next())


          {


            eid.setText(result.getString(1));


            ename.setText(result.getString(2));


          }


        }catch(Exception e){System.out.println(e);}


      }


      }


    }


    In the preceding example, the following happens:


    1.  The **PreparedStatement** object is created using the **prepared statement()**
    method.


    2.  The parameters of the **PreparedStatement** object are initialized when the
    user clicks on the **Query** button.


    3.  The query is then executed using the **execute** **Query()** method and the
    result is displayed in the corresponding controls, as shown in *[Figure 1.5](#chap01.xhtml_fig1.5)*:


    ![img](images/33.png)


    ***Figure 1.5**: The output of the preceding program*


    **Adding Records**


    You can use the **executeUpdate()** method of the statement object to execute
    simple INSERT statements, such as the following:


    Stat.executeUpdate("insert <tablename> values ( )");


    The return value of the **executeUpdate()** method is the number of rows affected
    by the query, as follows:


    public  void  addRecord (){try


    {


    stat. executeUpdate (“Insert into publishers values (“1020”, “New Employee”);


    } catch (Exception e) {  }


    | **Note: The PreparedStatement object can be used for sending the parameterized
    INSERT statements to the database.** |


    **Modify Records**


    You can use the **executeUpdate()** method of the Statement object to execute
    simple UPDATE statements, such as the following:


    stat.executeUpdate ("update <tablename> set <Expr>");


    The return value of the **executeUpdate()** method is the number of rows affected
    by the Query, as follows:


    public void modifyRecord ( ){


    try {


    stat.executeUpdate (“update Employee set EName=‘NewEmployee'' Where eid= ''1234''”),}


    catch(Exception e)


    {System.out.println("exception ”+e); }


    }


    | **NOTE: The Prepared Statement object can be used for sending the parameterized
    UPDATE Statements to the database.** |


    **Deleting Records**


    You can use the **executeUpdate()** method of the statement object to execute
    simple Delete statements, such as the following:


    stat.executeUpdate ("delete <tablename> where <Expr>");


    The return value of the **executeUpdate()** method is the number of rows affected
    by the query, as follows:


    public void  deleteRecord()


    {try


    {


    stat.executeUpdate(“delete Employee where Eid = ''1234'');


    }catch (Exception e)  {System.out.println("Exception”);}


    }


    | **NOTE: The Prepared Statement object can be used for sending the parameterized
    DELETE Statements to the database.** |


