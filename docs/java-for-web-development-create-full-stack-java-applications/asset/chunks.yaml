    [**JSP custom tags**](#toc.xhtml_aa154)


    Custom Tags are user-defined action tags and can encapsulate both presentation
    and business logic.


    [**Custom Tag Library**](#toc.xhtml_aa155)


    The contribution of JSP towards segregation of the presentation and business logic
    has functionally detached the designers from the intricacies of the programming
    constructs. However, a major part of the work involves writing lengthy and complex
    business-intrinsic code. In many cases, the structure of the code is such that
    some of its sections are repetitive and require rewriting.


    The custom tags of the tag library provide a mechanism that the programmer can
    use to encapsulate the complex recurring code or tasks. Once encapsulated, these
    codes can then be reused in a simpler form. A tag library consists of a collection
    of functionally related, user-defined XML tags called custom tags.


    Just as the JSP action element **useBean** facilitates the reuse of the existing
    beans, the tags in the custom library can be reused to decrease the cycle time
    for the development of the application and improve productivity. JSP 1.0 does
    not support tag libraries. However, JSP 1.1 supports the incorporation of the
    user-created custom tags in a JSP file. The structure of the custom tags in JSP
    is similar to the XML tags. They are user-defined and explicitly render information
    about the type of data. Therefore, before we delve into the details about tag
    libraries, let us appreciate the need for XML and the concept of tags in XML.


    [**Need of XML**](#toc.xhtml_aa156)


    **Extensible Markup Language** or (**XML**) is used in Web applications to create
    custom or user-defined tags. An XML tag is no different from an HTML tag as it
    allows the interactions between the user and the browser. What then was the need
    for a new markup language considering the acceptance and support of HTML? Consider
    a simple HTML code for displaying the data of an account holder in a bank. The
    code for displaying this data in HTML would be as follows:


    <HTML><BODY>


    <TABLE align= “center”>


    <TR>


    <TD>Ms Anne Brown</TD>


    </TR>


    <TR>


    <TD>9, Sunley House, Gunthorpe Street</TD>


    </TR>


    <TR>


    <TD>London E1-7RW</TD>


    </TR>


    </TABLE>


    </BODY></HTML>


    The Presentation-Centric HTML Output of the code is as follows:


    Ms Anne Brown


    9, Sunley House, Gunthorpe Street


    London E1-7RW


    As displayed in the output of the HTML code is presentation-centric and appears
    as any textual data. However, there is no differentiation in the data presented
    for the account holder''s first name and last name. In other words, the information
    about the type of data is lost by using the predefined HTML tags.


    On the contrary, consider the same example written in XML using the custom tags
    (user-defined), as follows:


    **XML**


    <CUSTOMERDETAILS>


    <NAME>


    <TITLE>Ms</TITLE>


    <FIRSTNAME>Anne</FIRSTNAME>


    <LASTNAME>Brown</LASTNAME>


    </NAME>


    <ADDRESS>


    <APTNAME>9, Sunley House</APTNAME>


    <STREETNAME>Gunthorpe Street</STREETNAME>


    <COUNTRY>London</COUNTRY>


    <ZIP>E1 – 7RW</ZIP>


    </ADDRESS>


    </CUSTOMERDETAILS>


    The rewriting of the preceding code in XML is as follows:


    -<xml>


    -<CUSTOMERDETAILS>


        -<NAME>


             <TITLE>Ms</TITLE>


             <FIRSTNAME>Anne</FIRSTNAME>


             <LASTNAME>Brown</LASTNAME>


        </NAME>


        -<ADDRESS>


             <APTNAME>9, Sunley House</APTNAME>


             <STREETNAME>Gunthorpe Street</STREETNAME>


             <COUNTRY>London</COUNTRY>


             <ZIP>E1 – 7RW</ZIP>


        </ADDRESS>'
