    \ 是 `<web-app>` 的子元素。它用于映射 Servlet。\n\n*   `<url-pattern>` 是 `<Servlet-mapping>`\
    \ 的子元素。该模式在客户端用于调用 `Servlet.web.xml`，如下：\n\n*   `<load-on-startup>1</load-on-startup>`。数字越小的\
    \ Servlet 越加载。\n\n### Web.xml\n\n```xml\n<web-app>\n    <Servlet>\n        <Servlet-name>FirstServlet</Servlet-name>\n\
    \        <Servlet-class>FirstServlet</Servlet-class>\n    </Servlet>\n    <Servlet-mapping>\n\
    \        <Servlet-name>FirstServlet</Servlet-name>\n        <url-pattern>/FirstServlet</url-pattern>\n\
    \    </Servlet-mapping>\n    <session-config>\n        <session-timeout>30</session-timeout>\n\
    \    </session-config>\n</web-app>\n```\n\n现在，启动服务器并运行 Servlet。Servlet 的输出显示在图\
    \ 3.3 中：\n\n![img](img/65.png)\n\n**图 3.3：Servlet 的输出**\n\n### 2. 以下是一个通过扩展 GenericServlet\
    \ 类创建的 servlet 示例\n\n**GenericServlet 类**: 它是一个实现了 `Servlet`、`ServletConfig``Serializable`\
    \ 接口的抽象类。它提供了 Servlet 接口除 `service()` 方法之外的所有方法的体。因此，程序员必须给出 `service()` 方法的体。它是协议无关的。\n\
    \n**程序：**\n\n```java\nimport java.io.*;\nimport javax.Servlet.*;\n\npublic class\
    \ FirstServlet implements Servlet\n{\n    public void service(ServletRequest req,ServletResponse\
    \ res)\n    throws IOException,ServletException\n    {\n        res.setContentType(\"\
    text/html\");\n        PrintWriter out=res.getWriter();\n        out.print(\"\
    <html><body>\");\n        out.print(\"<b>This is First Servlet through Servlet\
    \ Interface</b>\");\n        out.print(\"</body></html>\");\n    }\n}\n```\n\n\
    **HttpServlet**: HTTP 是一种 Web 特定的协议，对于浏览器请求和 Web 服务器响应之间的对话有规定。在下一章中，你将学习 `HttpServlet`。\n\
    \n### 结论 (#toc.xhtml_aa59)\n\n在本章中，你学习了 Servlets 是可以部署在 Web 服务器上的服务器端 Java 程序。`Servlet`\
    \ 接口为编写 Servlets 提供了基本的框架。Servlets 是可移植、可扩展、持久且健壮的。Servlet 的生命周期由 `init()`、`service()`\
    \ 和 `destroy()` 方法组成。Servlets 可以部署在 Glassfish、Weblogic 和 Apache Tomcat 中。\n\n\
    在下一章中，你将学习 `HTTPServlet`。HTTP 是一种 Web 特定的协议，对于浏览器请求和 Web 服务器响应之间的对话有规定。HTTP 在服务器发送的响应的任何内容顶部添加了头部信息。浏览器使用这些头部信息来帮助处理\
    \ HTML 页面。`HTTPServlet` 提供了一个处理 HTTP 协议的框架，而 `GenericServlet` 是协议无关的。\n\n### 问题\
    \ (#toc.xhtml_aa60)\n\n1. Web 服务器和应用程序服务器之间有什么区别？\n2. Servlets 相比 CGI 有什么优势？\n\
    3. Servlet 使用哪个类来接收来自客户端的请求？\n4. Applet 和 Servlet 之间有什么区别？\n5. 我们如何编译 Servlet？\n\
    6. Servlet 存储在哪里，在何处？\n7. Servlet 的生命周期方法有哪些？\n8. `web-app.xml` 中 URL-pattern\
    \ 的作用是什么？\n\n# 第 4 章 (#toc.xhtml_ch04)\n\n## HTTP Servlet (#toc.xhtml_ch04)\n\n\
    ### 引言 (#toc.xhtml_aa61)\n\n本章重点关注与 HTTP servlet 可以执行的功能相关的内容。超文本传输协议（HTTP）是一种用于浏览器和\
    \ Web 服务器之间通信的无状态协议。例如，当用户发送请求打开某个特定页面时，必须遵循 HTTP 协议中的规则。`HTTPServlet` 实现了 HTTP\
    \ 协议的所有规则。\n\n### 结构 (#toc.xhtml_aa62)\n\n在本章中，我们将涵盖：\n*   HTTP 请求\n*   HTTP 响应\n\
    *   HTTP 方法\n\n### 目标 (#toc.xhtml_aa63)\n\n在本章中，我们将涵盖：\n*   HTTP 请求\n*   HTTP\
    \ 响应\n*   HTTP 方法（特别是 `GET` 和 `POST`）\n\n学习本章后，你将学习 `HTTPServlet`。\n\n### HTTP\
    \ Servlet (#toc.xhtml_aa64)\n\n它是一个扩展了通用 servlet 的抽象类，如图 4.1\n\n**图 4.1：HttpServlet\
    \ 的层级结构**\n\n### HttpServlet 类的作用 (#toc.xhtml_aa65)\n\nWeb 服务器接收客户端请求并以 HTML 格式返回内容。HTTP\
    \ 是一种 Web 特定的协议，对于浏览器请求和 Web 服务器响应之间的对话有规定。`HTTPServlet` 提供了一个处理 HTTP 协议的框架，而\
    \ `GenericServlet` 是协议无关的。\n\n### HTTP 请求和响应 (#toc.xhtml_aa66)\n\n浏览器在 HTTP 请求中发送客户端请求，服务器在\
    \ HTTP 响应中传递数据，如图 4.2\n\n**图 4.2：HTTP 请求和响应**\n\nHTTP 协议有多种方法。该方法名称告诉服务器请求的类型。例如，客户端发送\
    \ `HTTP Get` 请求到服务器获取指定的页面。当用户向服务器发送 `HTTP Post` 请求时，用户向服务器发送数据或更新资源。`HttpServlet`\
    \ 提供了各种特定的 HTTP 方法，如下：\n\n*   `public void service(ServletRequest req, ServletResponse\
    \ res)`：通过将请求和响应对象转换为 HTTP 类型将请求分发到受保护的方法。\n*   `protected void service(HttpServletRequest\
    \ req, HttpServletResponse res)`：接收 service 方法的请求，并根据传入 HTTP 请求类型将请求分发到 `doXXX()`\
    \ 方法。\n*   `protected void doGet(HttpServletRequest req, HttpServletResponse res)`：处理\
    \ `GET` 请求。Web 容器调用它。\n*   `protected void doPost(HttpServletRequest req, HttpServletResponse\
    \ res)`：处理 `POST` 请求。Web 容器调用它。\n*   `protected void doGetHead(HttpServletRequest\
    \ req, HttpServletResponse res)`：处理 `HEAD` 请求。Web 容器调用它。\n*   `protected void\
    \ doOptions(HttpServletRequest req, HttpServletResponse res)`：处理 `OPTIONS` 请求。它由\
    \ Web 容器调用。\n*   `protected void doPut(HttpServletRequest req, HttpServletResponse\
    \ res)`：处理 `PUT` 请求。它由 Web 容器调用。\n*   `protected void doTrace(HttpServletRequest\
    \ req, HttpServletResponse res)`：处理 `TRACE` 请求。它由 Web 容器调用。\n*   `protected void\
    \ doDelete(HttpServletRequest req, HttpServletResponse res)`：处理 `DELETE` 请求。它由\
    \ Web 容器调用。\n*   `protected long getLastModified(HttpServletRequest req)`：返回自\
    \ GMT 1970 年 1 月 1 日午夜以来 `HttpServletRequest` 最后修改的时间。\n\n### GET 和 POST 方法 (#toc.xhtml_aa67)\n\
    \n"
- fmt: "\nWhen a client sends a request to the server, the client can also pass additional\
    \ information with the URL to describe what exactly is required as the output\
    \ from the server by using the `GET` method. The additional sequence of characters\
    \ that are appended to the URL is called a `query string`. However, the length\
    \ of the query string is limited to 240 characters. Moreover, the query string\
    \ is visible on the browser and can therefore be a security risk.\n\nTo overcome\
    \ these disadvantages, the post method can be used. The `POST` method sends the\
    \ data as packets through a separate socket connection. The complete transaction\
    \ is invisible to the client. The disadvantage of this method is that it is slower\
    \ than the `GET` method because the data is sent to the server as separate packets.\n\
