    [**Inter-Servlet Communication**](#toc.xhtml_ch06)


    [**Introduction**](#toc.xhtml_aa85)


    Inter-servlet communication means communication between servlets of a web application
    in the same server. Servlets on the same web server can communicate and share
    resources, such as variables, amongst each other. For example, when a user logs
    on to a website, user authentication can be done by a servlet. A different servlet
    can perform information processing after the user is authenticated. Dividing the
    tasks across the servlets also helps in implementing a structured approach to
    implementing tasks. Communication between servlets can be implemented by using
    the RequestDispatcher interface.


    [**Structure**](#toc.xhtml_aa86)


    In this chapter, we will cover the following topics:


    *   RequestDispatcher


    *   Servlet Context


    *   Method to get the object of RequestDispatcher


    *   Methods of RequestDispatcher interface


    *   sendRedirect() method of HttpServletResponse interface


    [**The RequestDispatcher Interface**](#toc.xhtml_aa87)


    The **RequestDispatcher** interface is used to forward or delegate a request from
    a servlet to other resources, such as a servlet, an HTML file, or a JSP page.
    In this case, the source servlet does some processing and delegates the request
    to another servlet. Moreover, this task delegation happens within servlets in
    the same servlet context.


    A servlet context is a directory in which the servlets are deployed in the webserver.
    Servlets that execute in the same server belong to the same servlet context. However,
    few web servers also enable the creation of more than one servlet context. You
    can get the reference of **ServletContext** with the help of the method of the
    **servletConfig** interface.


    **Syntax**: **public ServletContext getServletContext();**


    This function **getServletContext()** method of the **ServletConfig** interface
    is used to obtain a reference to the servlet context in which a servlet executes.


    [**Method of ServletContext Interface**](#toc.xhtml_aa88)


    The following are the methods of the ServletContext interface:


    1. **public abstract void setAttribute(String name, Object object)**: This function
    is used to set a value to an attribute available in the servlet Context. For example,
    **setAttribute(“name,” “Ram”)** is used to set the value of an attribute called
    **name**. In addition, this function can also be used to create an attribute that
    can be accessed by all the servlets in the same servlet context.


    2. **Public abstract Object getAttribute(String name)**: This function is used
    to obtain the value of an attribute.


    [**Method to get the object of RequestDispatcher**](#toc.xhtml_aa89)


    The **RequestDispatcher** interface encapsulates the URL of a resource (a servlet,
    a JSP page, or a **.xhtml** file) that exists in a particular servlet context.
    The **getRequestDispatcher()** method of the **ServletRequest** interface returns
    the object of **RequestDispatcher**.


    Syntax: **public RequestDispatcher getRequestDispatcher(String urlpath);**


    This method is used to get a reference to a servlet through a URL specified as
    the parameter. The dispatcher that is returned is used to invoke the servlet.
    If the dispatcher cannot be obtained for the URL specified, this function returns
    null.


    [**Methods of RequestDispatcher interface**](#toc.xhtml_aa90)


    The following are the methods of the RequestDispatcher interface:


    *   **public abstract void forward(HttpServletRequest request, HttpServletResponse
    response)** throws ServletException, IOException: This method is used to delegate
    a task to the resource encapsulated by a particular interface object. It forwards
    a request from one servlet to another. This method must be used when the output
    is completely generated by the second servlet or the servlet that is invoked.
    If the **PrintWriter** object is already accessed by the first servlet, then this
    method throws an exception.'
