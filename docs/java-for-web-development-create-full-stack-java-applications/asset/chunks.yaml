    [**Conclusion**](#toc.xhtml_aa121)


    In this chapter, we learned that a JSP page consists of HTML and JSP tags. The
    JSP tags include comments, scriptlets, expressions, and actions tags.


    The JSP comment tag provides additional information about the various sections
    of the code and are enclosed within the **<%--** and the **--%>** tags.


    Scriptlet tag consists of valid code snippets placed within the **<%** and the
    **%>** tags.


    JSP expressions are used to insert values into the output directly. There are
    nine implicit objects in JSP.


