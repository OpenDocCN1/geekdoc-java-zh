    \ xsi:schemaLocation=\"http://xmlns.jcp.org/xml/ns/javaee http://xmlns.jcp.org/xml/ns/javaee/web-app_3_1.xsd\"\
    >\n\n      <filter>\n\n            <filter-name>struts2</filter-name>\n\n            <filter-class>org.apache.struts2.dispatcher.FilterDispatcher</filter-class>\n\
    \n      </filter>\n\n      <filter-mapping>\n\n            <filter-name>struts2</filter-name>\n\
    \n            <url-pattern>/*</url-pattern>\n\n      </filter-mapping>\n\n</web-app>\n\
    \n**OUTPUT:**\n\nThe following is the output of index.jsp, as shown in *[Figure\
    \ 11.2](#chap11.xhtml_fig11.2)*:\n\n![img](images/196.png)\n\n***Figure 11.2**:\
    \ Output of index.jsp*\n\nThe following is the output of welcome.jsp, as shown\
    \ in *[Figure 11.3](#chap11.xhtml_fig11.3)*:\n\n![img](images/197a.png)\n\n***Figure\
    \ 11.3**: Output of Welcome.jsp*\n\nThe following is the output of index.xhtml,\
    \ as shown in *[Figure 11.4](#chap11.xhtml_fig11.4)*:\n\n![img](images/197b.png)\n\
    \n***Figure 11.4**: Output of index.xhtml*\n\nThe following is the output of invalid.jsp,\
    \ as shown in *[Figure 11.5](#chap11.xhtml_fig11.5)*:\n\n![img](images/197c.png)\n\
    \n***Figure 11.5**: Output of Invalid.jsp*\n\n[**Conclusion**](#toc.xhtml_aa172)\n\
    \nThe struts2 framework is used to develop an MVC-based web application. Struts\
    \ is an open-source framework that extends the Java Servlet API and employs a\
    \ Model-View-Controller (MVC) architecture. It enables you to create maintainable,\
    \ extensible, and flexible web applications based on standard technologies, such\
    \ as JSP pages, JavaBeans, resource bundles, and XML.\n\nThe components of struts\
    \ are Controller, Action, ValueStack, View, and ResultType. Struts.xml is used\
    \ to specify the configuration about the various components of the application,\
    \ that is, the type of result, Interceptor, information about JSP, and so on.\n\
    \nWeb.xml must have the entry of the filter class."
