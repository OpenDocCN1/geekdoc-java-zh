    \ used to convert a `String` to a `Date` instance.\nB. Both the `DateFormat` and\
    \ the `NumberFormat` objects can be constructed to be Locale specific.\nC. Both\
    \ the `Currency` and the `NumberFormat` objects must be constructed using the\
