    \n以下是 `index.xhtml` 的结果，如图 5.10 所示：\n\n![img](img/96a.png)\n**图 10**: 以上程序的输出\
    \ (index.xhtml)\n\n以下是第一个 Servlet 的输出，如图 5.11 所示：\n\n![img](img/96b.png)\n**图\
    \ 11**:第一个 Servlet 的输出\n\n以下是第二个 Servlet 的输出，如图 5.12 所示：\n\n![img](img/97.png)\n\
    **图 12**: 第二 Servlet 的输出\n\n### 结论\n\nSession（会话）是服务器与客户端在一段时间内发生的一组事务。以下任何方法可以实现会话跟踪：\n\
    * URL 重写 (URL Rewriting)\n* 隐藏表单字段 (Hidden Form fields)\n* Cookies\n* 使用 `HttpSession`\
    \ 接口\n\n### 问题\n1. 解释什么是 Session 及其重要性？\n2. 什么是会话跟踪 (Session Tracking)？会话跟踪有哪些不同类型？\n\
    3. 为什么在 `HttpServlet` 中使用会话跟踪？\n4. `Cookies` 相比 URL 重写有什么优势？\n5. `Cookie` 和 `Session`\
    \ 的作用是什么？它们之间有什么区别？你如何在 `Servlet` 中销毁 Session？（提示：你可以对会话对象调用 `invalidate()` 方法来销毁\
    \ Session。例如，`session.invalidate();`）\n6. 你如何在 Servlets 中跟踪用户会话？\n\n# 第 6 章：Servlet\
    \ 间通信\n\n### 介绍\n\n\n\nServlet 间通信是指同一服务器上 Web 应用程序中 Servlet 之间的通信。同一服务器上的 Servlet\
    \ 之间可以相互通信并共享资源，例如变量。例如，当用户登录网站时，由一个 Servlet 完成用户身份验证。用户通过验证后，另一个 Servlet 可以执行信息处理。将任务分配给不同的\
    \ Servlet 有助于实现结构化的任务处理。Servlet 之间的通信可以使用 `RequestDispatcher` 接口来实现。\n\n### 结构\n\
    \n在本章中，我们将涵盖以下主题：\n* `RequestDispatcher`\n* `ServletContext`\n* 获取 `RequestDispatcher`\
    \ 对象的方法\n* `RequestDispatcher` 接口的方法\n* `HttpServletResponse` 接口的 `sendRedirect()`\
    \ 方法\n\n### RequestDispatcher 接口\n\n`RequestDispatcher` 接口用于将请求从 Servlet 转发或委托给其他资源，例如\
    \ Servlet、HTML 文件或 JSP 页面。在这种情况下，源 Servlet 执行某些处理并将请求委托给另一个 Servlet。此外，这种任务委托发生在同一个\
    \ Servlet 上文（servlet context）的 Servlet 内部。\n\nServlet 上文 Web 服务器中部署 Servlet 的目录。在同一服务器上执行的\
    \ Servlet 属于同一个 Servlet 上文。然而，少数 Web 服务器也允许创建多个 Servlet 上文。你可以通过 `servletConfig`\
    \ 接口的方法获取 `ServletContext` 的引用。\n\n**语法**：`public ServletContext getServletContext();`\n\
    \n`ServletConfig` 接口的 `getServletContext()` 方法用于获取 Servlet 执行所在的 Servlet 上文引用。\n\
    \n### ServletContext 接口方法\n\n以下是 `ServletContext` 接口的方法：\n\n1. `public abstract\
    \ void setAttribute(String name, Object object)`：此函数用于为 Servlet 上文中可用的属性设置值。例如，`setAttribute(\"\
    name\", \"Ram\")` 用于设置名为 `name` 的属性值。此外，该函数还用于创建一个可以被同一 Servlet 上文中所有 Servlet\
    \ 访问的属性。\n2. Public abstract Object getAttribute(String name)`：此函数用于获取属性的值。\n\n\
    ### 获取 RequestDispatcher 对象的方法\n\n`RequestDispatcher` 接口封装了存在于特定 Servlet 上文中的资源（Servlet、JSP\
    \ 页面或 .xhtml 文件）的 URL。`ServletRequest` 接口的 `getRequestDispatcher()` 方法返回 `RequestDispatcher`\
    \ 对象。\n\n**语法**：`public RequestDispatcher getRequestDispatcher(String urlpath);`\n\
    \n该方法通过指定的 URL 获取 Servlet 的引用。返回的调度器用于调用该 Servlet。如果无法获取指定 URL 的调度器，函数返回 null。\n\
    \n### RequestDispatcher 接口的方法\n\n以下是 `RequestDispatcher` 接口的方法：\n\n* `public abstract\
    \ void forward(HttpServletRequest request, HttpServletResponse response)` throws\
    \ ServletException, IOException：此方法用于将任务委托给特定对象的资源。它将请求从一个 Servlet 转发到另一个 Servlet。当输出完全由第二个\
    \ Servlet 生成时，必须使用此方法。如果第一个 Servlet 访问了 `PrintWriter` 对象，则此方法将抛出异常。\n\n"
- fmt: "\n*   `public abstract void includes (ServletRequest request, ServletResponse\
    \ response) throws ServletException, IOException`: This function is also used\
    \ to invoke one servlet from another like the `forward()` function; however, you\
    \ can also include the output of the first servlet with the current output. The\
    \ first servlet can make use of the `PrintWriter` object even after calling the\
    \ `include()` method.\n\n| Note |\n| :--- |\n| Servlet chaining is a technique\
    \ by which multiple servlets are executed in a specific sequence to complete a\
    \ transaction. A servlet can invoke another servlet to perform the next step in\
    \ a transaction. The output of the previous servlet is sent back to the browser\
    \ or the client. This technique can be compared to the concept of pipes in Linux,\
    \ where the output of one command is redirected to the other. |\n| . In the process\
    \ of Servlet Chaining: Firstly, we must create a `RequestDispatcher` for a resource\
    \ that has to be chained. Then, must set the attribute values for the request\
    \ if required. Next, we need to call the `forward()` method or the `include()`\
    \ method on a `RequestDispatcher` object. |\n\n## Implementing Inter servlet communication\
    \ via a problem statement\n\nYou need to deposit the money into your account.\
    \ Create a servlet that accepts and validates the account number and PIN of a\
    \ user. The first servlet is used to validate the account number and the PIN.\
    \ If the values are valid, an attribute called account number is created and assigned\
    \ and the account number is entered. Otherwise, an error message is displayed\
    \ to the user and includes the `index.xhtml`. If the account number and PIN are\
    \ valid, then it forwards the request to the second servlet and is invoked.\n\n\
    ## Tasklist\n\n*   Write the client interface (`index.xhtml`): The HTML form accepts\
    \ the account number and PIN from the user.\n*   Write the code of two servlets:\
    \ After clicking on the submit button, the servlet will be invoked, validating\
    \ the account number and PIN, and forwarding the request to the second servlet.\
    \ Then, the second servlet grants the permission to deposit or withdraw the amount.\n\
    *   Compile and deploy the servlets: Make the entry of the servlet in deployment\
    \ descriptor `web.xml`. Compile and run the program.\n*   Verify the functionality\
    \ of servlets: Verify whether the program displays a valid result or not.\n\n\
    To solve the problem, we will use the `RequestDispatcher` interface. The problem\
    \ states that the first servlet needs to accept the account number and the PIN\
    \ from the user and validate them. If the account number is valid, then the second\
    \ servlet needs to be invoked.\n\n## Client Interface\n\nThe HTML form contains\
    \ two textboxes for accepting the account number and the PIN, respectively. Upon\
    \ clicking on the submit button, the first servlet is invoked.\n\n## index.xhtml\n\
    \n```html\n<html>\n<head>\n    <title>Our Bank</title>\n</head>\n<body>\n    <div>\n\
    \        <CENTER>\n            <h1>MY BANK </h1>\n        </CENTER>\n        <FORM\
    \ action=\"firstServlet\">\n            <table>\n                <tr>\n      \
    \              <td>Enter the account Number</td>\n                    <td><input\
    \ type=\"text\" name=\"accnum\"></td>\n                </tr>\n               \
    \ <tr>\n                    <td>Enter the Pin Number </td>\n                 \
    \   <td><input type=\"password\" name=\"pinnum\"></td>\n                </tr>\n\
    \            </table>\n            <br>\n            <center><input type=SUBMIT\
    \ value=\"SUBMIT\"></center>\n        </FORM>\n    </div>\n</body>\n</html>\n\
    ```\n\nThe following is the output, as shown in Figure 6.1:\n\n![img](images/103.png)\n\
    **Figure 6.1: Output of index.xhtml (Client Interface)**\n\n## Code of FirstServlet\n\
    \nThe first servlet is used to validate the account number and the PIN. If the\
    \ values are valid, an attribute called account number is created, and the account\
    \ number is entered. Otherwise, an error message is displayed to the user. If\
    \ account number and PIN are valid, then it forwards the request to second servlet\
    \ that is invoked, as shown follows:\n\n```java\nimport java.io.IOException;\n\
    import java.io.PrintWriter;\nimport javax.servlet.RequestDispatcher;\nimport javax.servlet.ServletException;\n\
    import javax.servlet.http.HttpServlet;\nimport javax.servlet.http.HttpServletRequest;\n\
    import javax.servlet.http.HttpServletResponse;\n\npublic class FirstServlet extends\
    \ HttpServlet {\n    protected void doGet(HttpServletRequest request, HttpServletResponse\
    \ response) throws ServletException, IOException {\n        response.setContentType(\"\
    text/html;charset=UTF-8\");\n        try {\n            PrintWriter out = response.getWriter();\n\
    \            out.println(\"<!DOCTYPE html>\");\n            out.println(\"<html>\"\
    );\n            out.println(\"<head>\");\n            out.println(\"<title>Servlet\
    \ First</title>\");\n            out.println(\"</head>\");\n            out.println(\"\
    <body>\");\n            String n = request.getParameter(\"accnum\");\n       \
    \     String p = request.getParameter(\"pinnum\");\n            if (p.equals(\"\
    201306\") && n.equals(\"AJ123456789\")) {\n                RequestDispatcher rd\
    \ = request.getRequestDispatcher(\"servlet2\");\n                rd.forward(request,\
    \ response);\n            } else {\n                out.print(\"Sorry account\
    \ Number or Password Error!\");\n                RequestDispatcher rd = request.getRequestDispatcher(\"\
    /index.xhtml\");\n                rd.include(request, response);\n           \
    \ }\n            out.println(\"</body>\");\n            out.println(\"</html>\"\
    );\n        } catch (Exception e) {\n            System.out.println(\"Exception\"\
    );\n        }\n    }\n}\n```\n\nThe following is the Second servlet code:\n\n\
    ```java\nimport java.io.IOException;\nimport java.io.PrintWriter;\nimport javax.servlet.ServletException;\n\
    import javax.servlet.http.HttpServlet;\nimport javax.servlet.http.HttpServletRequest;\n\
    import javax.servlet.http.HttpServletResponse;\n\npublic class SecondServlet extends\
    \ HttpServlet {\n    protected void doGet(HttpServletRequest request, HttpServletResponse\
    \ response) throws ServletException, IOException {\n        try {\n          \
    \  response.setContentType(\"text/html;charset=UTF-8\");\n            PrintWriter\
    \ out = response.getWriter();\n            out.println(\"<!DOCTYPE html>\");\n\
    \            out.println(\"<html>\");\n            out.println(\"<head>\");\n\
    \            out.println(\"<title>Servlet Second</title>\");\n            out.println(\"\
    </head>\");\n            out.println(\"<body>\");\n            String n = request.getParameter(\"\
    accnum\");\n            out.print(\"<font color=BLUE,size=20>Welcome \"+n+\"<br><center>\"\
    );\n            out.print(\" You can deposit/ withdraw the amount \");\n     \
    \       out.println(\"</body>\");\n            out.println(\"</html>\");\n   \
    \     } catch (Exception e) {\n            System.out.println(\"Exception occured\"\
    +e);\n        }\n    }\n}\n```\n\n## Output\n\nThe following is the output if\
    \ the Account Number and PIN are valid, as shown in Figure 6.2:\n\n![img](images/106a.png)\n\
    **Figure 6.2: Output if the Account Number and PIN are valid**\n\nThe following\
    \ is the output if the Account Number and PIN are invalid, as shown in Figure\
    \ 6.3:\n\n![img](images/106b.png)\n**Figure 6.3: Output if the Account Number\
    \ and PIN are invalid**\n\n## SendRedirect\n\nIn the `include()` and `forward()`\
    \ method of the `RequestDispatcher` class, the servlet is not making a new request.\
    \ It only includes the request in the same servlet or forwards it into another\
    \ servlet.\n\nThe `client` (browser) wants to create a new request to get to the\
    \ resource by using the `sendRedirect()` method; the user can see the new URL.\
    \ It takes both relative and absolute paths.\n\n**Syntax**:\n\n```java\npublic\
    \ void sendRedirect(String URL)throws IOException;\n```\n\n**Example**\n"
