         4.  What is the difference between Applet and Servlet?


         5.  How do we compile the Servlet?


         6.  Where does the Servlet store, and where does it run?


         7.  What are the life cycle methods for a Servlet?


         8.  What is the use of URL-pattern in web-app.xml?


    [CHAPTER 4](#toc.xhtml_ch04)


    [**HTTP Servlet**](#toc.xhtml_ch04)


    [**Introduction**](#toc.xhtml_aa61)


    This chapter focuses on the things related to what the HTTP servlets can do. HyperText
    Transfer Protocol (HTTP) is a stateless protocol used to make the communication
    between the browser and the webserver. For example, when a user sends a request
    to open a specific page, the rules in the HTTP protocol are to be followed. HTTPServlet
    has implemented all the rules of the HTTP protocol.


    [**Structure**](#toc.xhtml_aa62)


    In this chapter, we will cover the following topics:


    *   HTTP Servlet


    *   HTTP Request and Response


    *   Methods of HTTP Servlet


    *   GET and POST Methods


    [**Objectives**](#toc.xhtml_aa63)


    After studying this chapter, you will learn about the HTTP Protocol. You will
    also understand how HTTPServlet helps us communicate with the web container and
    handle the HTTP protocols.


    [**HTTP Servlet**](#toc.xhtml_aa64)


    It is an abstract class that extends the generic servlet and adds the functionality
    of the HTTP protocol, as shown in *[Figure 4.1](#chap04.xhtml_fig4.1)*:


    ![img](images/68.png)


    ***Figure 4.1**: Hierarchy of HttpServlet class*


    [**Need of HTTPServlet class**](#toc.xhtml_aa65)


    A web server takes a client request and gives something back to the browser in
    the HTML format to display it. When a web server sends an HTML page to the client,
    it sends it using **HyperText Transfer Protocol** (**HTTP**). HTTP is a web-specific
    protocol and has rules for conversation between browser requests and web-server
    responses. HTTP adds the header information to the top of whatever content is
    in the response sent by the server. The browser uses that header information to
    help process the HTML page. HTTPServlet provides a framework for handling the
    HTTP protocol, whereas GenericServlet is protocol-independent.


    [**HTTP Request and HTTP Response**](#toc.xhtml_aa66)


    The browser sends a client''s request inside the HTTP Request, and the server
    passes the data inside the HTTP Response, as shown in *[Figure 4.2](#chap04.xhtml_fig4.2)*:


    ![img](images/69.png)


    ***Figure 4.2:** HTTP Request and Response*


    HTTP Protocol has several methods. This method name tells the server the kind
    of request being made. For example, the client sends an **HTTP Get** request to
    the server asking to get the page from the specified resource. When a user sends
    an **HTTP Post** request to the server, the user sends the data to the server
    or updates a resource. HttpServlet provides various methods of HTTP specific,
    which are as follows:


    *   **public void service(ServletRequest req, ServletResponse res)**: Dispatches
    the request to the protected service method by converting the request and response
    object into the HTTP type.


    *   **protected void service(HttpServletRequest req, HttpServletResponse res)**:
    Receives the request from the service method and dispatches the request to the
    **doXXX()** method depending on the incoming HTTP request type.


    *   **protected void doGet(HttpServletRequest req, HttpServletResponse res)**:
    Handles the **GET** request. The web container invokes it.


    *   **protected void doPost(HttpServletRequest req, HttpServletResponse res)**:
    Handles the **POST** request. The web container invokes it.


    *   **protected void doHead(HttpServletRequest req, HttpServletResponse res)**:
    Handles the **HEAD** request. The web container invokes it.


    *   **protected void doOptions(HttpServletRequest req, HttpServletResponse res)**:
    Handles the **OPTIONS** request. It is invoked by the web container.


    *   **protected void doPut(HttpServletRequest req, HttpServletResponse res)**:
    Handles the **PUT** request. It is invoked by the web container.


    *   **protected void doTrace(HttpServletRequest req, HttpServletResponse res)**:
    Handles the **TRACE** request. It is invoked by the web container.


    *   **protected void doDelete(HttpServletRequest req, HttpServletResponse res)**:
    Handles the **DELETE** request. It is invoked by the web container.


    *   **protected long getLastModified(HttpServletRequest req)**: Returns the time
    when **HttpServletRequest** was last modified since midnight January 1, 1970 GMT.


    [**The GET and POST methods**](#toc.xhtml_aa67)'
