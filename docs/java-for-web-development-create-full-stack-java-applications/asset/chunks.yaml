    [CHAPTER 2](#toc.xhtml_ch02)


    [**Internationalization (I18N)**](#toc.xhtml_ch02)


    [**Introduction**](#toc.xhtml_aa26)


    Many people do not understand English and want messages, currencies, and time
    in their languages. Internationalization helps in doing the same. Internationalization
    is the process of customizing an application according to specific languages and
    regions. Internationalization has 18 characters in it, which is why it is abbreviated
    as I18N.


    [**Structure**](#toc.xhtml_aa27)


    In this chapter, we will cover the following topics:


    *   Localization


    *   Locale


    *   Resource bundle


    *   Steps to develop I18N-based application


    *   Internationalization


    [**Objective**](#toc.xhtml_aa28)


    After studying this chapter, you will be able to develop an application and display
    the messages according to specific languages and regions.


    [**Localization (L10N)**](#toc.xhtml_aa29)


    It is a mechanism to create an application in a specific language or region. This
    can be done via the Locale object. An object of the Locale class represents a
    geographical or cultural region. Locale class is used to get the information about
    the country language, variant, and so on. A variant represents operating system-specific
    information.


    [**Locale**](#toc.xhtml_aa30)


    It is a class in the **java.util** package that provides information about the
    country and the region.


    [**Constructors of Locale Class**](#toc.xhtml_aa31)


    There are three constructors of the locale class, which are as follows:


    • Locale(String language)


    • Locale(String language, String country)


    • Locale(String language, String country, String variant)


    [**Commonly used methods of Locale class**](#toc.xhtml_aa32)


    The following are the commonly used methods of the Locale class:


    *   **public static Locale getDefault()**: It returns the instance of current
    Locale.


    *   **public static Locale[] getAvailableLocales()**: It returns an array of available
    locales.


    *   **public String getDisplayCountry()**: It returns the country name of this
    locale object.


    *   **public String getDisplayLanguage()**: It returns the language name of this
    locale object.


    *   **public String getDisplayVariant()**: It returns the variant code of this
    locale object.


    *   **public String getISO3Country()**: It returns the three-letter abbreviation
    for the current locale''s country.


    *   **public String getISO3Language()**: It returns the three-letter abbreviation
    for the current locale''s language.


    The program to get the information of India is as follows:


    import java.util.Locale;


    public class LocaleTest {


      public static void main(String[] args) {


        Locale locale=new Locale("hi","IN");


        System.out.println(locale.getDisplayCountry());


        System.out.println(locale.getDisplayLanguage());


        System.out.println(locale.getDisplayName());


        System.out.println(locale.getISO3Country());


        System.out.println(locale.getISO3Language());


        System.out.println(locale.getLanguage());


        System.out.println(locale.getCountry());


    }}


    **The output is as follows**:


    India


    Hindi


    Hindi (India)


    IND


    hin


    hi


    IN


    [**Resource Bundle**](#toc.xhtml_aa33)


    It is a good practice if the messages or labels used inside the application are
    visible in the user''s language, that is, if the user belongs to India, then the
    message is in Hindi, or if the users belong to the United States the messages
    are in English. Resource Bundle stores the text and components that are Locale
    sensitive and loads this information from the properties file that contains the
    messages.


    The **java.util.ResourceBundle** class is an abstract class; we cannot make the
    object of the **ResourceBundle** class. Its method helps us manage locale-sensitive
    resources.


    [**Constructor of ResourceBundle**](#toc.xhtml_aa34)


    *   **ResourceBundle()**: This is the default constructor mainly designed for
    use by the subclasses and the factory methods.


    [**Methods of ResourceBundle Class**](#toc.xhtml_aa35)


    The following are the methods of the ResourceBundle class:


    *   **public static ResourceBundle getBundle(String basename)**: It loads the
    resource bundle with the given name and returns the instance of the **ResourceBundle**
    class.'
