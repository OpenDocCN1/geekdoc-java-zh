    [**Cookies**](#toc.xhtml_aa81)


    Cookies are small text files used by a web server to keep track of the users.
    A cookie has values in the form of *key-value* pairs. They are created by the
    server and sent to the client with the HTTP response headers. The client saves
    the cookies in the local hard disks and sends them along with the HTTP request
    headers to the server. If a cookie with the same name already exists, then the
    key is overwritten with the new value. A server can send one or more cookies to
    the client. A web browser, which is the client software, is expected to support
    20 cookies per host, and the size of each cookie can be a maximum of 4 bytes each.


    The following are the characteristics of cookies:


    *   Cookies are only sent back to the server that created them and not to any
    other server. For example, if a cookie was created by the webserver and sent to
    the client or the browser, the cookie can be sent back to the same server only.


    *   The server can use cookies to find out the computer name, IP address, or any
    other details of the client computer.


    **The following are the advantages of Cookies**:


    *   Cookies are the simplest technique of maintaining the state.


    *   Cookies are maintained at the client-side.


    **The following are the disadvantages of Cookies**:


    *   It will not work if the cookie is disabled from the browser.


    *   Only textual information can be set in the Cookie object.


    [**The javax.servlet.http.Cookie class**](#toc.xhtml_aa82)


    The Servlet API provides a class called Cookie, which is used to represent a cookie.
    The **Cookie** class is used for implementing session tracking in servlets. The
    values of the cookies are stored in the client computers. As discussed earlier,
    a cookie has a name, which is referred to as a key, and the data stored in the
    cookie is referred to as value.


    A cookie is sent by the client through an **HttpServletRequest** object. The servlet
    sends the cookie to the client through an **HttpServletRequest** object.


    **The constructor of the Cookie class**


    *   Cookie(): Constructs a new cookie.


    *   Cookie(String name, String value): Constructs a cookie with a specified name
    and value.


    *[Table 5.2](#chap05.xhtml_tab5.2)* lists some of the methods of **javax.servlet.http.Cookie**,
    **HttpServletResponse**, and **HttpServletRequest** class that are used to implement
    the concept of session tracking using cookies:


    | **Method Name** | **Functionality** |


    | Cookie.Cookie (String.String) | The constructor of the Cookie is a class used
    to create a cookie and assign a value to it. |


    | Cookie.getValue (String name) | Each cookie that gets created by a servlet is
    given a name and value. This function returns the value stored in the given cookie.
    |


    | Cookie.setValue (string) | This function is used to assign a value of a type
    string to the given cookie. |


    | Cookie.getName() | This method is used to retrieve the name of a cookie. |


    | Cookie.setMaxAge (int) | This method is used to specify the maximum amount of
    time for which the client browser retains the cookie value. |


    | Cookie.setName​(String name) | It changes the name of the cookie and sets the
    name of the cookie. |


    | HttpServletResponse.​addcookie () | Cookies are created by the server and passed
    onto the client through an HttpServletResponse object. The addCookie () method
    is used to add a cookie to the response. This method can be called more than once
    to add different cookies to the response that is sent to the client. |


    | HttpServletRequest.​getCookie() | The client sends the data to the server in
    the form of a request received by the server in the form of an HttpServletRequest
    object. This method is used to retrieve the cookie values in the request. |


    | public Cookie[] getCookies() | It is a method of the HttpServletRequest interface
    used to return all the cookies from the browser. |


    ***Table 5.2**: Method of Cookie, HttpServletResponse, and HttpServletRequest
    class*


