    # Questions


    1. What is Struts?

    2. What is the difference between struts1 and struts2?

    3. What are the features of Struts?

    4. Define Interceptors, ValueStack, and OGNL?

    5. How does FrontController help in maintaining the MVC pattern in struts2?


    # Interview Questions


    ### 1. What are server-side includes?

    **Ans**: A server-side enables you to embed a `Java Servlet` in an HTML document.
    The file that contains a server-side include must be saved with a `.shtml` extension
    to inform the server that the file contains a server-side include.


    ### 2. What are thread-safe servlets?

    **Ans**: In a typical environment, the webserver creates only a single instance
    of a servlet. The `service()` method of the `Servlet` acts as a dispatcher of
    the requests. If the `service` method is processing a request and, at the same
    time, receiving a different request, the webserver can create a different thread
    and execute the `service()` method in the newly created thread. In the process
    of execution, the threads need to be in synchronization and, thus, make the servlets
    thread-safe. Servlets can make use of the Java API to implement thread synchronization.


    ### 3. Can the address of the client that is sending a request be tracked in the
    Servlet?

    **Ans**: Yes, the address of the remote client can be tracked in the `Servlet`
    by using the `getRemoteAddr()` and `getRemoteHost()` functions of `HttpServletRequest`.


    ### 4. How can the client be intimated about the size of a file that is being
    sent by the server?

    **Ans**: The `content-length` attribute of the HTTP header can be used to set
    the file size and sent to the length.


    ### 5. Can I read cookies with a specific key?

    **Ans**: No. All the cookies need to be retrieved, and then the key name and value
    should be checked individually.


    ### 6. What are persistent cookies?

    **Ans**: Few cookies can get deleted after a session is over. To make the cookies
    persistent, you can set an expiry time for the cookies. These types of cookies
    are known as persistent cookies.


    ### 7. How do we get the absolute URL of a servlet at runtime?

    **Ans**: You can use the `getRequestURL()` method of the `HttpServletRequest`
    interface to obtain the URL of the request, excluding the query string. The `getQueryString()`
    function of the `HttpServletRequest` interface can be used to obtain the query
    string that was part of the request. In addition, you can also use the `getServerName()`
    and the `getServerPort()` methods of the `ServletRequest` interface to obtain
    the name of the server which received the request and the port number through
    which the Servlet receives the request.


    ### 8. What is the use of the `getScheme()` method?

    **Ans**: The `getScheme()` method is used to obtain the scheme based on which
    the URL is constructed and sent to the Servlet. The scheme can be ftp, http, or
    https.


    ### 9. What is the life cycle of a session?

    **Ans**: There are three stages in the life of a session, which are as follows:

    * a. **New**: Until the Session is being established with the client.

    * b. **Joins**: The Session will always be new if the client does not join a session.

    * c. **Destroyed**: The Session is invalidated or the session timeout period expires.


    ### 10. How is `PrintWriter` different from `ServletOutputStream`?

    **Ans**: `PrintWriter` is a character-stream class, whereas `ServletOutputStream`
    is a byte-stream class. The `PrintWriter` class can be used to write only character-based
    information, whereas the `ServletOutputStream` class can be used to write primitive
    values and character-based information.


    ### 11. Can a JSP be called using a Servlet?

    **Ans**: Yes, Servlet can call a JSP using the `RequestDispatcher` interface.

    The following is an example:

    ```

    RequestDispatcher reqdis=request.getRequestDispatcher("log.jsp");

    reqdis.forward(request,response);

    ```


    ### 12. What is load-on-startup in Servlet?

    **Ans**: The load-on-startup` element of Servlet in `web.xml` is used to load
    the Servlet at the time of deploying the project or the server to start. This
    saves time for the first request.


    ### 13. Can you refresh the Servlet in client and server-side automatically?

    **Ans**: Yes, there are a couple of primary ways that a servlet can be automatically
    refreshed. One way is to add a “Refresh” response header containing the number
    of seconds after which a refresh should occur.

    The following is an example:

    ```

    response.addHeader("Refresh", "5");

    ```


    ### 14. Can you send an Authentication error from a Servlet?

    **Ans**: Yes, we can use `setStatus(statuscode)` method of `HttpServletResponse`
    to send an authentication error. All we have to do is set an error code and a
    valid reason along with the error code.

    The following is an example:

    ```

    response.sendError(404, "Page not Found!!!" );

    ```


    ### 15. Why doesn’t a Servlet include `main()`? How does it work?

    **Ans**: Servlets don’t have a `main()` method, because servlets are executed
    using the web containers. When a client places a request for a servlet, the server
    hands the requests to the web container where the Servlet is deployed.


    ### 16. What is the difference between Context Parameter and Context Attribute?

    **Ans**: The main difference is that the Context Parameter is a value stored in
    the deployment descriptor, which is `web.xml` and is loaded during the deployment
    process. On the other hand, Context Attribute is the value that is set dynamically
    and can be used throughout the application.


    ### 17. What is servlet mapping?

    **Ans**: Servlet mapping is the process of defining an association between a URL
    pattern and a servlet. The mapping is used to map the requests to Servlets.


    ### 18. Which are the annotations that are used in Servlet?

    **Ans**: The three important annotations used in the servlets are as follows:

    * a. `@WebServlet`: For servlet class.

    * b. `@WebListener`: For listener class.

    * c. `@WebFilter`: For filter class.


    ### 19. What is the difference between a Generic Servlet and an HTTP Servlet?

    **Ans**: The similarity between Generic Servlet and HTTP Servlet is that both
    are `Abstract Classes`. However, the differences between them are as follows:


    | Generic Servlet | HTTP Servlet |

    | :--- | :--- |

    | Protocol Independent. | Protocol Specific. |

    | Belongs to `javax.servlet` package. | Belongs to `javax.servlet.http` package.
    |

    | Supports only `service()` method. | Supports `doGet()`, `doPost()`, `doHead()`
    methods. |


    ### 20. How can you get the server information in a servlet?

    **Ans**: We can retrieve the information of a server in a servlet. We can use
    the following code snippet to get the servlet information in a servlet through
    the servlet context object:

    ```

    getServletContext().getServerInfo();

    ```


    ### 21. What is the JSP technology?

    **Ans**: JSP technology or JavaServerPages technology is an extension of the Java
    programming technology. JSP includes a scripting language that is Java based.
    A JSP page upon compilation generates a servlet. Web applications that are developed
    by using JSP demonstrate the platform and web server independence.


    ### 22. How can you eliminate the task of reloading a JSP file?

    **Ans**: A good approach to eliminate the task of having to reload a JSP file
    is to separately place the static content. Create a separate JSP file for the
    static content and use directives such as `include` to attach the contents of
    the file.

