  \n第 ∞ 8 章 (包)\n\n### 引言\n\n当我们开发项目时，必须将程序拆分为几个类。为了组织这些类，我们使用 `Packages`（包）。包既是一种命名机制，也是一种可见性控制机制。包是相互相关的类和接口的集合。借助包的帮助，只要它们定义在不同的包中，就可以给多个类赋予相同的名称。\n\
  \n单个包不能包含两个同名的类。\n\n`PROGRAMS` 被组织为包的集合。每个包都有自己的自己的子包集合，这有助于防止命名冲突。顶层包只有在被声明为 `public`\
  \ 时，才能在包外访问。包的命名结构是层级的。包的成员是类类型、接口类型和子包。`java` 中的包是一种封装机制，可用于将相关的类、接口和子包组合在一起。\n\
  \n对于小型程序，包可以是未命名的或具有简单的名称，但如果代码要广泛分发，应该选择唯一的包名。\n\n这可以防止发生冲突——如果两个开发小组恰好选择了相同的包名，且这些包后来被在同一个程序中使用，就会产生冲突。如果我们没有为\
  \ `java` 类指定包，那么该类将成为 Java 默认包的一部分，称为无名包。但这要求每个类必须具有唯一的名称以避免冲突。\n\n### 无名包的示例\n\n\
  ```java\nclass A {\n    // - - - - - - -\n    // - - - - - - -\n}\n\nclass A_demo\
  \ {\n    public static void main(String args[]) {\n        // - - - - - -\n    \
  \    // - - - - - -\n    }\n}\n```\n\n### 如何定义包\n\n要创建一个包，请在源文件的第一个语句中包含 `package`\
  \ 命令。在该文件中声明的任何类都将属于指定的包。包语句定义了存储类的空间。如果我们省略了包语句，类将被放入默认包中，该包没有名称，称为无名包。Java 使用文件目录来存储包。请记住大小是敏感的，且目录名称必须与包名完全匹配。多个文件可以包含相同的包语句。\n\
  \n**语法：**\n```java\npackage_name; // 包声明\nclass A // 类声明\n{\n    // 类 A 的主体\n}\n\
  ```\n`package` 是一个关键字。`p1` 是类 `A` 将要存储的包名。\n\n**示例 8.1：**\n```java\npackage p1;\n\
  class A {\n    public static void main(String args[]) {\n        System.out.println(\"\
  First Package program.\");\n    }\n}\n```\n我们假设当前文件夹是 (`c:\\javaprg\\p1>`。\n```bash\n\
  C:\\javaprg\\p1>javac A.java\nC:\\javaprg\\p1>java p1.A\n```\n输出：\n`First Package\
  \ program.`\n\n注意：如果我们在 `c:\\javaprg>` 下使用 `javac -d .java` 编译上述程序，则文件夹 `p1` 将自动创建，上述程序的\
  \ `.class` 文件将保存在该文件夹中。但如果我们不带 `-d` 选项编译，则我们需要创建 `p1` 文件夹并将 `.class` 文件放在当前目录下。\n\
  \n### 导入包\n\nJava 的所有内置类都存储在命名的包中；包内的类必须使用全限定名，否则将为每个使用的类编写点分隔的长路径。因此，Java 提供了 `import`\
  \ 语句将某些类或整个包引入可见范围。一旦导入，就可以直接使用名称引用类。`import` 语句是对程序员的一种便利，它在技术上并不是必须的。如果我们要在应用程序中引用几个类，`import`\
  \ 语句将节省大量的输入工作。在 Java 源文件中，`import` 紧随包语句（如果存在）之后、类定义之前。这是 `import` 语句的通用形式。\n\n\
  ```java\nimport pkg1.classname;\nimport pkg1.*;\n```\n\n**示例 8.2：**\n// 使用 java.util\
  \ 包中的 Random 类打印 10 个随机数\n// 不使用 import 语句\n```java\npackage java.util\nclass RandomTest1\
  \ {\n    public static void main(String args[]) {\n        java.util.Random r1 =\
  \ new java.util.Random();\n        for(int i=1; i<=10; i++) {\n            System.out.println(Math.abs(r1.nextInt()));\n\
  \        }\n    }\n}\n```\n输出：\n```\n1588659525\n481996564\n210875677\n386971039\n\
  360473512\n1922641171\n393055462\n889442536\n1836112189\n320882863\n```\n\n**示例\
  \ 8.3**\n// 使用 java.util 包中的 Random 类打印 10 个随机数\n// 使用 import 语句\n```java\nimport\
  \ java.util.Random;\nclass RandomTest2 {\n    public static void main(String args[])\
  \ {\n        Random r1 = new Random();\n        for(int i=1; i<=10; i++) {\n   \
  \         System.out.println(Math.abs(r1.nextInt()));\n        }\n    }\n}\n```\n\
  \n\n\n\n\n```java\nSystem.out.println(Math.abs(r1.nextInt()));\n}\n}\n```\n\n###\
  \ 输出:\n```\n686722541\n1154462827\n452959606\n1235134497\n1421490552\n1065881855\n\
  424893046\n731473166\n1217844570\n437181304\n```\n\n#### 类路径 (CLASSPATH)\n\n如果在当前文件夹之外的任何文件夹运行上述程序，它将无法运行。默认情况下，Java\
  \ 运行时系统使用当前工作目录作为起点。\n\n因此，如果我们的包在当前目录下或当前目录的子目录下，它将会被找到。但要从任何其他文件夹运行上述程序，我们必须在命令提示符中使用命令\
  \ `SET CLASSPATH=.;C:\\JAVAPRG` 来设置类路径。`CLASSPATH` 是一个环境变量。我们每次第一次启动电脑时都需要输入此命令。但如果我们将此命令放在\
  \ `我的计算机属性高级环境变量` 中，那么就不需要再反复地输入此命令了。\n\n我们也可以在不设置 `CLASSPATH` 环境变量的情况下运行程序。为此只需输入：\n\
  \n```\njava –classpath c:\\javaprg p1.A\n```\n\n**注意 4**: 我们可以创建包的层级结构。要实现这一点，只需使用点\
  \ `.` 将每个包与其上面的包隔开。多级包语句的通用形式为：\n\n`package package_name1[.package_name2][.package_name3];`\n\
  \n包的层级结构必须在 Java 开发系统的文件系统中反映。例如，包 `java.awt.Image` 需要存储在 `java\\awt\\image`（WINDOWS）或\
  \ `java/awt/image`（UNIX）或 `java:swt:image`（MAC）文件系统中。\n\n包的层级结构代表了 Java 类和接口的组织。它并不代表类和接口的源代码组织。\n\
  \n每个 Java 源文件（也称为编译单元）可以包含零或多个类和接口的定义，但编译器会为它们生成一个包含 Java 字节码的独立类文件。类或接口可以使用包声明来指示其\
  \ Java 字节码被放在特定的包中。\n\n*   包 `java` 有子包 `awt`、`applet`、`io`、`lang`、`net` 和 `util`，但没有类或接口。\n\
  *   包 `java.awt` 有一个名为 `image` 的子包以及许多类和接口。\n*   因为包 `java.awt` 有子包 `image`，所以它不能包含名为\
  \ `image` 的类或接口类型的声明。\n*   如果一个包的全限定名是 `P`，且 `Q` 是 `P` 的子包，那么 `P.Q` 就是该子包的全限定名。\n\
  *   如果有一个名为 `mouse` 的包，且该包中有一个成员类 `Button`（这可能被称为 `mouse.Button`），则不能有任何全限定名为 `mouse.Button`\
  \ 或 `mouse.Button.Click` 的包。\n*   一个源文件中最多可以出现一个包语句，且它必须是 Java 源文件的第一条语句。\n\n###\
  \ 类成员的可见性\n\n类和包都是封装和包含变量及方法命名空间与范围的手段。包充当类和其他子包的容器。类充当数据和方法代码的容器。\n\n类是 Java 最小的抽象单元。由于类和包之间的相互作用，Java\
  \ 处理类成员有五类可见性：\n\n1. 类内部的可见性。\n2. 同一包中子类中的可见性。\n3. 同一包中非子类中的可见性。\n4. 不同包中子类中的可见性。\n\
  5. 既不在同一包中也不是子类的子类中的可见性。\n\n**注意 1**: 顶层类和接口只有两种可能的访问权限：默认的（default）和 `public`。\n\
  \n**注意 2**: 如果类被声明为 `public`，则可以通过其他代码访问。\n\n**注意 3**: 如果类具有默认访问权限，则它只能被同一包内的其他代码访问。\n\
  \n**注意 4**: 成员可见性只有在类可见的情况下才有意义。如果类的可见性修饰符是默认的，即使是类的 `public` 成员也仅在包内可见。\n\n###\
  \ 访问修饰符\n\n![](img/image01228.jpeg)\n\n### JAR 文件 (Java 归档文件)\n\n为了压缩文件，我们使用某些程序如\
  \ winzip。JAR 文件也可以用于压缩整个包。它提供了更好的安装体验。无需创建文件。JAR 技术使得分发变得容易得多。\n\nJAR 有以下可用选项：\n\
  \n| 选项 | 说明 |\n| :--- | :--- |\n| `c` | 创建新归档。 |\n| `C` | 执行期间更改目录。 |\n| `f` | 文件列表的第一个元素是要创建的归档名称。\
  \ |\n| `i` | 应提供索引信息。 |\n| `m` | 文件列表的第二个元素是外部清单文件的名称。 |\n| `M` | 不创建清单文件。 |\n|\
  \ `t` | 应该列出归档内容。 |\n| `u` | 更新现有归档。 |\n| `v` | 执行时提供详细输出。 |\n| `x` | 从归档中提取的文件。\
  \ |\n\n创建 JAR 文件：\n```\njar -cf Myjar.jar pack1\n```\n这将创建一个包含 `pack1` 所有文件的 `Myjar.jar`。\n\
  \n解压 JAR 文件：\n此命令用于提取文件（如 unzip）。\n```\njar -xf Myjar.jar\n```\n\n列出 JAR 文件内容：\n\
  以下命令列出 `Myjar.jar` 的内容。\n```\njar -tf Myjar.jar\n```\n\n更新现有 JAR 文件：\n以下命令用于更新 JAR\
  \ 文件。\n```\njar -uf Myjar.jar pack1\n```\n\n创建可执行的 JAR 文件：\n```\njar -cmf mainClass\
  \ Myjar.jar pack1\n```\n其中 `mainClass` 是包含 `Main-Class: pack1.pack2.pack3.A` 的文本文件，保存在\
  \ `javaprg` 文件夹中。\n\n执行 JAR 文件：\n```\njava -jar Myjar.jar\n```\n\n### 题：\n\n1. \
  \ 我们对包了解什么？\n2.  解释所有的修饰符及其在不同包、子包以及子类和其他类中的范围。\n3.  JAR 文件的作用是什么？\n4.  `import`\
  \ 语句的作用是什么？\n\n![](img/image01229.jpeg)\n在 Amazon.com 上搜索此书，ISBN 为 978-1500730413。\n\
  \n# 第 9 章\n## 接口 (Interface)\n\n### 引言\n接口本质上是一种类。和类一样，接口包含方法和变量，但有一个主要区别。区别在于接口只定义抽象方法和\
  \ final 变量（常量）。这意味着接口不编写任何代码来实现这些方法，且数据字段只包含常量。\n\n\n\n\n因此，类的职责是实现一个接口，定义实现这些方法的代码。接口在语法上与类相似，但它们缺乏实例变量，且其方法声明时没有方法体。在实践中，这意味着我们可以定义接口，而不对它们的实现方式做任何假设。接口的目的是将类的接口与其实现分离开。接口仅仅定义了类必须做什么，而不对实现进行任何说明。接口只定义方法签名，不包含任何实例变量。\n\
  \n嵌套接口是指任何声明在另一个类或接口体内的接口。顶层接口不是嵌套接口的接口。定义接口的语法与定义类非常相似。接口定义的通用形式如下：\n\n```java\n\
  interface interface_name {\n    variable declarations;\n    methods declarations;\n\
  }\n```\n\n在这里，`interface` 是关键字，`interface_name` 是任何有效的 java 标识符（就像类名一样）。\n\n**注意：**\
  \ 当我们定义接口时，默认情况下它是公共的（public）且抽象的（abstract）。\n\n### 接口修饰符\n顶层接口可使用的唯一修饰符是 `abstract`\
  \ 和 `public`。即使我们不使用 `abstract` 修饰符，接口也会隐式地声明为 `abstract`，因此不需要使用 `abstract` 修饰符。顶层接口的可见性可以是包级（package）或公共（public），就像顶层类一样。如果没有使用可见性修饰符，则接口的可见性假设为包。\n\
  \n### 数据变量成员声明\n接口中只能定义常量。接口中的所有变量都隐式地 `public`、`final` 和 `static`，这意味着它们不能被实现类更改。它们还必须用常量值初始化。\n\
  \n```java\npublic static final type variable_name=value;\n```\n\n在接口中声明的变量是 `public`、`static`\
  \ 且 `final`。这意味着它是具有公共访问权限的静态变量。该变量也被声明为 `final`，这意味着它必须在声明时赋值，并且之后不能再修改。`final`\
  \ 关键字类似于 C/C++ 中的 `const`。\n\n### 方法声明\n方法声明将仅包含方法列表，而不包含任何语句。它们在参数列表后以分号结束。它们本质上是抽象方法，接口中指定的任何方法都不能有默认实现。\n\
  \n接口中的所有方法默认都是 `public` 和 `abstract` 修饰符。我们不能在接口中声明 `static` 方法。\n\n```java\npublic\
  \ abstract return_type method_name(parameter_list);\n```\n\n这是一个包含两个变量和一个方法的接口定义示例。\n\
  \n```java\ninterface item {\n    static final int code =1001;\n    static final\
  \ String name = \"Matrix\";\n    abstract void display();\n}\n```\n\n**注意：** 方法的代码不包含在接口中，方法声明仅以分号结束。\n\
  \n另一个接口的示例：\n\n```java\ninterface area {\n    float pi = 3.14f;\n    float compute(float\
  \ x, float y);\n    void show();\n}\n```\n\n### 扩展接口\n与类一样，接口也可以被扩展，即一个接口可以从其他接口派生。新接口将以类似于子类的方式继承子接口的所有成员。这通过使用\
  \ `extends` 关键字来实现，如下：\n\n```java\ninterface interface_1 {\n    int code = 1001;\n\
  \    String name = \"Matrix\";\n}\n\ninterface interface_2 extends interface_1 {\n\
  \    void display();\n}\n```\n\n`interface_2` 将继承其中的常量 `code` 和 `name`。\n\n**注意：**\
  \ 变量 `name` 和 `code` 是像普通变量一样声明的。这在这里是被允许的，但接口中的所有变量都被视为常量和静态，尽管这里没有使用 `public`、`static`\
  \ 和 `final` 关键字。\n\n我们可以将多个接口组合在一个接口中。以下声明是有效的：\n\n```java\ninterface interface_1\
  \ {\n    int code = 1001;\n    String name = \"Matrix\";\n}\n\ninterface interface_2\
  \ {\n    void display();\n}\n\ninterface interface_3 extends interface_1, interface_2\
  \ {\n}\n```\n\n**注意：** 始终记住接口不能扩展类。这违反了接口只能有抽象方法和常量的规则。\n\n### 实现接口\n接口被用作“超类”，其属性被类继承。因此，有必要创建一个继承给定接口的类。一旦定义了接口，一个或多个类就可以实现该接口。\n\
  \n要实现接口，需要在类定义中包含 `implements` 子句，然后创建接口声明的方法。实现类必须提供所有接口中所有的方法体，否则必须被声明为抽象类。实现类还可以扩展一个类并实现多个接口。\n\
  \n```java\nclass <class-name> implements <interface-name> {\n    // body of class\n\
  }\n```\n\nJava 不支持多继承，但支持多接口继承，即一个类可以实现多个接口，如下：\n\n```java\nclass <class-name> implements\
  \ <interface-1>, <interface-2>, <interface-n> {\n    // body of class\n}\n```\n\n\
  **注意：** 当我们实现接口方法时，它必须声明为 `public`。实现接口方法类似于重写，因此我们不能降低可见性。\n\n**示例 9.1**\n```java\n\
  interface interface_1 {\n    void show(int x);\n}\n\nclass class_1 implements interface_1\
  \ {\n    public void show(int x) {\n    }\n}\n```\n\n**抽象类的 9.2 示例**\n```java\n\
  interface common {\n    void push(int x);\n    int pop();\n}\n\nabstract class stack\
  \ implements common {\n    abstract void disp();\n}\n```\n\n\n\n\n在这里，`stack` 类没有实现\
  \ `push()` 和 `pop()` 方法。因此，我们必须将 `stack` 类声明为抽象类，这种技术被称为部分实现。\n\n## 接口继承的各种形式：\n\
  \n(a)\n![](img/image01230.jpeg)\n(单级接口继承)\n\n(b)\n![](img/image01231.jpeg)\n(多级接口继承)\n\
  \n(c)\n![](img/image01232.jpeg)\n(层次结构接口继承)\n\n(d)\n![](img/image01233.jpeg)\n(混合接口继承)\n\
  \n## 通过接口引用访问实现类对象：\n\n我们可以将变量声明为使用接口而非类类型的对象引用。任何实现了所声明接口的类实例都可以通过这种变量进行引用。当我们通过这些引用之一调用方法时，将根据所引用的接口的实际实例来调用正确的版本。\n\
  \n这是接口的重要特性之一。要执行的方法将在运行时动态查找，这允许类在调用其方法的代码之后才创建。调用代码可以通过接口进行分发，而无需了解“被调用者”的任何信息。这个过程类似于使用父类引用来访问子类对象。\n\
  \n由于在运行时动态查找方法与 Java 中的普通方法调用相比会产生巨大的开销，因此我们应该注意不要在性能敏感的代码中随意使用接口。\n\n### 示例 9.3\n\
  \n```java\ninterface Math_function {\n    void display(int x);\n}\n\nclass Sqrt\
  \ implements Math_function {\n    public void display(int x) {\n        System.out.println(\"\
  sqrt of x =\"+Math.sqrt(x));\n    }\n}\n\nclass Log implements Math_function {\n\
  \    public void display(int x) {\n        System.out.println(\"log of x = \"+Math.log(x));\n\
  \    }\n}\n\nclass Math_Demo {\n    public static void main(String args[]) {\n \
  \       Math_function f1 = new Sqrt();\n        Math_function f2 = new Log();\n\
  \        f1.display(27);\n        f2.display(3);\n        Math_function f3;\n  \
  \      f3 = f1; // polymorphism (assign the reference)\n        f3.display(30);\n\
  \        f3 = f2; // polymorphism (assign the reference)\n        f3.display(5);\n\
  \    }\n}\n```\n输出：![](img/image1234.jpeg)\n\n## 接口的特性：\n\n- 接口是一个关键字。\n- 接口可以声明为抽象的，但它本身就是抽象的，因此不需要添加\
  \ `abstract` 关键字。\n- 所有变量始终是 `public static final`。\n- 接口的所有方法必须在类中实现。\n- 接口仅包含方法的声明。\n\
  - 接口方法不能声明为 `static`。它们始终被声明为实例方法。\n- 类既不能缩小接口方法的访问权限，也无法在 `throws` 子句中指定新的异常；尝试这样做等同于修改接口，这是非法的。重写方法的标准也适用于实现接口方法。\n\
  - 这里允许使用 `abstract` 关键字进行部分实现。\n- 无论类直接或间接实现了多少接口，它对一个在接口中可能有多个声明的方法提供单一的实现。\n-\
  \ 在类的情况下，方法原型声明也可以进行重载。\n- 接口常量可以通过任何客户端（类或接口）使用其完全限定名来访问，无论该客户端是否扩展或实现了该接口。然而，如果客户端实现此接口的类或扩展此接口的接口，则客户端也可以不使用完全限定名访问此类常量。此类客户端继承了接口常量。\n\
  - 在接口多继承的情况下，任何名称冲突可以使用相关常量的完全限定名解决。\n\n接口变量：接口中的所有变量始终是 `public static final`，因为它们是实现类访问数据类型和方法的公共部分。\n\
  \n接口变量的内存管理：静态变量在程序加载时始终获取内存，占用独立的内存且不与任何对象的内存共享。它们也被称为常量变量。可以使用接口名和 `.` 直接访问它们。\n\
  \n### 示例 9.4\n\n```java\ninterface Static_Var {\n    int sun=1;\n    int mon=2;\n\
  \    int tues=3;\n    int wed=4;\n    int thurs=5;\n    int fri=6;\n    int sat=7;\n\
  }\n\nclass Week_Day implements Static_Var {\n    public static void main(String\
  \ args[]) {\n        System.out.println(sun);\n        System.out.println(mon);\n\
  \        System.out.println(tues);\n        System.out.println(wed);\n        System.out.println(thurs);\n\
  \        System.out.println(fri);\n        System.out.println(sat);\n    }\n}\n\
  ```\n\n\n\n\n```java\nSystem.out.println(Static_Var.thurs);\nSystem.out.println(Static_Var.fri);\n\
  System.out.println(Static_Var.sat);\n```\n输出:\n```\n1\n2\n3\n4\n5\n6\n7\n```\n\n\
  ### 示例 9.5\n\n```java\ninterface Two_Methods {\n    void m1();\n    void m2();\n\
  }\n\nclass Three_Methods implements Two_methods {\n    public void m1() {\n    \
  \    // body of m1;\n    }\n    public void m2() {\n        // body of m2;\n   \
  \ }\n    public void m3() {\n        // body of m3;\n    }\n}\n\nclass Methods_Demo\
  \ {\n    public static void main(String args[]) {\n        Two_methods tm1 = new\
  \ Three_methods();\n        tm1.m1();\n        tm1.m2();\n        // tm1.m3(); error\n\
  \        Three_Methods tm2 = new Three_Methods();\n        tm2.m3();\n    }\n}\n\
  ```\n注：这里我们无法使用接口引用调用 `m3()`，因为 `methods` 没有在接口中声明。因此，接口引用只能访问在类自身块中声明的方法。否则，我们可以调用同类对象或扩展类对象。\n\
  \n### 示例 9.6 在类中实现的两个接口\n\n```java\ninterface Two_Methods {\n    void push(int x);\n\
  \    int pop();\n}\n\ninterface One_Method extends Two_Methods {\n    void m3();\n\
  }\n\nclass Three_Methods implements One_methods {\n    int arr[] = new int[5];\n\
  \    int top = -1;\n\n    public void push(int item) {\n        if (top == 4) {\n\
  \            System.out.println(\"Overflow\");\n            return;\n        }\n\
  \        top++;\n        arr[top] = item;\n    }\n\n    public int pop() {\n   \
  \     if (top == -1) {\n            System.out.println(\"Underflow\");\n       \
  \     return -1;\n        }\n        int item = arr[top];\n        top--;\n    \
  \    return (item);\n    }\n\n    void disp() {\n        for (int i = top; i >=\
  \ 0; i--) {\n            System.out.println(arr[i]);\n        }\n    }\n}\n\nclass\
  \ Stack_Demo {\n    public static void main(String args[]) {\n        Stack s1 =\
  \ new Stack();\n        s1.pop();\n        for (int i = 0; i < 5; i++) {\n     \
  \       s1.push(i + 10);\n        }\n        s1.push(60);\n        System.out.println(\"\
  ----Display All Item----\");\n        s1.disp(); // non methods\n        System.out.println(\"\
  ----Removing All Items----\");\n        for (int i = 0; i < 5; i++) {\n        \
  \    System.out.println(s1.pop()); // -1 underflow\n        }\n        Two_Methods\
  \ t1 = new Stack();\n        t1.push(10);\n        System.out.println(t1.pop());\n\
  \        // t1.disp(); error\n    }\n}\n```\n**非接口方法**：当任何类实现了接口的方法，同时在类中定义了未在接口中声明的额外方法，我们可以说这些额外方法为非接口方法。使用接口引用变量无法调用这些额外方法。\n\
  \n输出:\n```\nUnderflow\nOverflow\n----Display All Item----\n104\n103\n102\n101\n\
  100\n----Remove All Items----\n104\n103\n102\n101\n100\n10\n```\n\n![11](img/image01212.jpeg)\
