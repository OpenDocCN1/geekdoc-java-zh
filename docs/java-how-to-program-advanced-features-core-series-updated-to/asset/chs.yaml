  ∞ 22 ∞\n\n## 面向开发者的 Java 8 特性\n\n### Lambda、函数式接口\n\nJava 8 已于 2014 年 3 月 18 日发布，现在是时候为开发者寻找\
  \ Java 8 的特性了。目前关于 Java 8 的材料还足够的。但在经过大量努力后，我写了 Java 8 中引入的一些我非常期待的重要特性，包括：\n\n\
  1. `Iterable` 接口中的 `forEach()` 方法。\n2. 接口中的 `default` 和 `static` 方法。\n3. `函数式接口\
  \ (Functional Interfaces)` 和 `Lambda 表达式 (Lambda Expressions)`。\n4. 用于对 `Collections`\
  \ 进行批量数据操作的 `Java Stream API`。\n5. `Java Time API`。\n6. `Collection API` 的改进。\n\
  7. `Concurrency API` 的改进。\n8. `Java IO` 的改进。\n9. `其他核心 API` 的改进。\n\n让我们简单查看一下这些\
  \ Java 8 特性。我将提供一些代码片段以帮助更好地理解，因此如果你想在 Java 8 中运行程序，必须按照以下步骤设置 Java 8 环境。\n\n下载\
  \ `JDK8` 并安装它。安装过程与其他 Java 版本一样简单。在 Java 中编写、编译和运行程序需要安装 `JDK`。\n\n注意：当前的 Eclipse\
  \ IDE 不支持 Java 8，因此你必须从 eclipse.org 下载适用于 Java 8 的 Eclipse。针对 Mac OS、Windows 和 Linux\
  \ 系统有不同版本的稳定构建，请下载最新版本以获得大多数功能。\n\n我今天（2014 年 7 月 28 日）刚刚检查过，Eclipse Kepler 4.3.2\
  \ SR2 程序包可以用于 Java 8。你需要先下载它，然后从 Eclipse 市场中心安装 “Java 8 support for Eclipse Kepler\
  \ SR2” 插件。我试过了，它看起来运行良好。\n\n### 1. Iterable 接口中的 forEach() 方法-\n\n每当我们我们需要遍历 `Collection`\
  \ 时，都需要创建一个 `Iterator`，其全部目的就是迭代，然后我们在循环中为 `Collection` 中的每个元素编写业务逻辑。如果迭代器使用不当，可能会得到\
  \ `ConcurrentModificationException`。\n\nJava 8 在 `java.lang.Iterable` 接口中引入了 `forEach`\
  \ 方法，这样我们在编写代码时只需关注业务逻辑即可。`forEach` 方法接受 `java.util.function.Consumer` 对象作为参数，这有助于将我们的业务逻辑保持在独立的位置，以便我们复用。让我们通过简单的示例来看\
  \ `forEach` 的用法。\n\n| Java8ForEachExample.java |\n\n```java\npackage com.journaldev.java8.foreach;\n\
  import java.util.ArrayList;\nimport java.util.Iterator;\nimport java.util.List;\n\
  import java.util.function.Consumer;\nimport java.lang.Integer;\npublic class Java8ForEachExample\
  \ {\n    public static void main(String[] args) {\n        //creating sample Collection\n\
  \        List<Integer> myList = new ArrayList<Integer>();\n        for(int i=0;\
  \ i<10; i++) myList.add(i);\n        //traversing using Iterator\n        Iterator<Integer>\
  \ it = myList.iterator();\n        while(it.hasNext()){\n            Integer i =\
  \ it.next();\n            System.out.println(\"Iterator Value::\"+i);\n        }\n\
  \        //traversing through forEach method of Iterable with anonymous class\n\
  \        myList.forEach(new Consumer<Integer>() {\n            public void accept(Integer\
  \ t) {\n                System.out.println(\"forEach class Value::\"+t);\n     \
  \       }\n        });\n        //traversing with Consumer interface\n        MyConsumer\
  \ action = new MyConsumer();\n        myList.forEach(action);\n    }\n}\n//Consumer\
  \ implementation that can be reused\nclass MyConsumer implements Consumer<Integer>{\n\
  \    public void accept(Integer t) {\n        System.out.println(\"Consumer impl::\"\
  +t);\n    }\n}\n```\n\n行数可能会增加，但 `forEach` 方法有助于实现迭代逻辑。\n\n`forEach` 方法有助于实现关注点分离。\n\
  \n### 2. 接口中的 default 和 static 方法-\n\n每当我们我们需要遍历 `Collection` 时，我们都需要创建一个 `Iterator`，其全部目的就是迭代，然后我们在循环中为\
  \ `Collection` 中的每个元素编写业务逻辑。如果迭代器使用不当，可能会得到 `ConcurrentModificationException`。\n\
  \nJava 8 在 `java.lang.Iterable` 接口中引入了 `forEach` 方法，这样我们在编写代码时只需关注业务逻辑即可。`forEach`\
  \ 方法接受 `java.util.function.Consumer` 对象作为参数，这有助于将我们的业务逻辑保持在独立的位置，以便我们复用。让我们通过简单的示例来看\
  \ `forEach` 的用法。\n\n| Java8ForEachExample.java |\n\n```java\npackage com.journaldev.java8.foreach;\n\
  import java.util.ArrayList;\nimport java.util.Iterator;\nimport java.util.List;\n\
  import java.util.function.Consumer;\nimport java.lang.Integer;\npublic class Java8ForEachExample\
  \ {\n    public static void main(String[] args) {\n        //creating sample Collection\n\
  \        List<Integer> myList = new ArrayList<Integer>();\n        for(int i=0;\
  \ i<10; i++) myList.add(i);\n        //traversing using Iterator\n        Iterator<Integer>\
  \ it = myList.iterator();\n        while(it.hasNext()){\n            Integer i =\
  \ it.next();\n            System.out.println(\"Iterator Value::\"+i);\n        }\n\
  \        //traversing through forEach method of Iterable with anonymous class\n\
  \        myList.forEach(new Consumer<Integer>() {\n            public void accept(Integer\
  \ t) {\n                System.out.println(\"forEach class Value::\"+t);\n     \
  \       }\n        });\n        //traversing with Consumer interface\n        MyConsumer\
  \ action = new MyConsumer();\n        myList.forEach(action);\n    }\n}\n//Consumer\
  \ implementation that can be reused\nclass MyConsumer implements Consumer<Integer>{\n\
  \    public void accept(Integer t) {\n        System.out.println(\"Consumer impl::\"\
  +t);\n    }\n}\n```\n\n行数可能会增加，但 `forEach` 方法有助于实现迭代逻辑。\n\n`forEach` 方法有助于实现关注点分离。\n\
  \n`default` 和 `static` 方法。\n\n每当我们我们需要遍历 `Collection` 时，我们都需要创建一个 `Iterator`，其全部目的就是迭代，然后我们在循环中为\
  \ `Collection` 中的每个元素编写业务逻辑。如果迭代器使用不当，可能会得到 `ConcurrentModificationException`。\n\
  \nJava 8 在 `java.lang.Iterable` 接口中引入了 `forEach` 方法，这样我们在编写代码时只需关注业务逻辑即可。`forEach`\
  \ 方法接受 `java.util.function.Consumer` 对象作为参数，这有助于将我们的业务逻辑保持在独立的位置，以便我们复用。让我们通过简单的示例来看\
  \ `forEach` 的用法。\n\nJava 8 增强了接口方法体。\n\n`Iterable` 接口中的 `forEach` 方法如下：\n\n```java\n\
  default void forEach(Consumer<? super T> action) {\n    Objects.requireNonNull(action);\n\
  \    for (T t : this) {\n        action.accept(t);\n    }\n}\n```\n\n记住：\n\n我们知道\
  \ Java 不支持多重继承，因为这会导致“菱问题”。所以如何通过接口来处理，由于接口现在是抽象类。\n\n解决方案是编译器会抛出异常，我们需要在类中提供实现逻辑。\n\
  \n| Interface1.java |\n\n```java\npackage com.journaldev.java8.defaultmethod;\n\
  @FunctionalInterface\npublic interface Interface1 {\n    void method1(String str);\n\
  \    default void log(String str) {\n        System.out.println(\"I1 logging::\"\
  +str);\n    }\n    static void print(String str) {\n        System.out.println(\"\
  Printing \"+str);\n    }\n    //尝试覆盖 Object 方法会导致编译错误，“A default method cannot override\
  \ a method from java.lang.Object\"\n    // default String toString(){\n    //  \
  \   return \"i1\";\n    // }\n}\n```\n\n| Interface2.java |\n\n```java\npackage\
  \ com.journaldev.java8.defaultmethod;\n@FunctionalInterface\npublic interface Interface2\
  \ {\n    void method2();\n    default void log(String str) {\n        System.out.println(\"\
  I2 logging::\"+str);\n    }\n}\n```\n\n注意到两个接口都有公共方法 `log()` 的实现逻辑。\n\n| MyClass.java\
  \ |\n\n```java\npackage com.journaldev.java8.defaultmethod;\npublic class MyClass\
  \ implements Interface1, Interface2 {\n    @Override\n    public void method2()\
  \ {\n    }\n    @Override\n    public void method1(String str) {\n    }\n    //\
  \ 如果没有它自己的 log() 实现，MyClass 将无法编译\n    @Override\n    public void log(String str){\n\
  \        System.out.println(\"MyClass logging::\"+str);\n        Interface1.print(\"\
  abc\");\n    }\n}\n```\n\n你可以看到 `Interface1` 有一个静态方法实现，它被用于 `MYCLASS.LOG()` 方法实现。Java\
  \ 8 在 `Collection API` 中大量使用默认和静态方法，添加默认方法使我们的代码保持向后兼容。\n\n如果层次结构中的任何类具有相同签名的方法，那么默认方法将失效。由于任何实现接口的类已经以\
  \ `Object` 为父类，如果我们在接口中有 `equals()`、`hashCode()` 默认方法，它们将变得失效。这就是为什么为了清晰起见，接口不允许拥有\
  \ `Object` 类的默认方法。\n\n要了解 Java 8 接口更改的完整信息，请阅读下方的 Java 8 接口更改。\n\n\n\n\n\nJava 8\
  \ 最大的设计变化之一是接口概念引入。在 Java 7 之前，接口中只能包含方法声明。但从 Java 8 开始，我们可以在接口中拥有 `default methods`（默认方法）和\
  \ `static methods`（静态方法）。\n\n设计接口一直是一项辛苦的工作，因为如果我们想在接口中添加额外方法，将需要修改所有的实现类。\n\n随着接口变旧，实现它的类数量可能会增加到无法扩展接口的程度。这就是为什么在设计应用程序时，大多数框架都会提供一个基础实现类，然后我们扩展它并重写适用于我们应用程序的方法。让我们来看看接口默认方法、静态方法以及引入它们的原因。\n\
  \n### 接口默认方法 (Interface Default Method)\n\n要在接口中创建默认方法，我们需要在方法签名处使用 `default` 关键字。例如：\n\
  \n#### Interface1.java\n```java\npackage com.journaldev.java8.defaultmethod;\npublic\
  \ interface Interface1 {\n    void method1(String str);\n    default void log(String\
  \ str){\n        System.out.println(\"I1 logging::\"+str);\n        print(str);\n\
  \    }\n}\n```\n\n注意 `log(String str)` 是 `Interface1` 中的默认方法。现在当一个类实现 `Interface1`\
  \ 时，并没有强制为默认方法提供实现。这一特性将帮助我们通过添加额外方法来扩展接口，我们只需要提供默认实现即可。假设我们另一个带有以下方法的接口：\n\n####\
  \ Interface2.java\n```java\npackage com.journaldev.java8.defaultmethod;\npublic\
  \ interface Interface2 {\n    void method2();\n    default void log(String str){\n\
  \        System.out.println(\"I2 logging::\"+str);\n    }\n}\n```\n\n我们知道 Java 不允许继承多个类，因为这会导致“菱形问题”（Diamond\
  \ Problem），编译器无法决定使用哪一个父类的方法。有了默认方法，接口也会出现菱形问题。\n\n因为如果一个类同时实现了 `Interface1` 和 `Interface2`\
  \ 且没有实现公共的默认方法，编译器将无法选择哪一个。\n\n扩展多个接口是 Java 中不可或缺的一部分，你可以在 Java 核心类以及大多数企业级应用框架中发现它。因此，为了确保这个问题不会在接口中发生，强制要求为公共的默认方法提供实现。\n\
  \n所以，如果一个类同时实现了上述两个接口，它将必须为 `log()` 方法提供实现，否则编译器将抛出错误。一个实现了 `Interface1` 和 `Interface2`\
  \ 的简单类如下：\n\n#### MyClass.java\n```java\npackage com.journaldev.java8.defaultmethod;\n\
  public class MyClass implements Interface1, Interface2 {\n    @Override\n    public\
  \ void method2() {\n    }\n    @Override\n    public void method1(String str) {\n\
  \    }\n    @Override\n    public void log(String str){\n        System.out.println(\"\
  MyClass logging::\"+str);\n        Interface1.print(\"abc\");\n    }\n}\n```\n\n\
  **关于接口默认方法的要点：**\n\n- 默认方法将帮助我们扩展接口，而不必破坏实现类。\n- 默认方法缩小了接口和抽象类之间的差异。\n- 默认方法将帮助我们避免工具类，例如所有的\
  \ Collections 类方法都可以直接提供在接口本身中。\n- 默认方法将帮助我们移除基础实现类，我们可以提供默认实现，而实现类可以选择重写哪一个。\n\
  - 引入默认方法的主要原因之一是为了增强 Java 8 中的 Collections API 以支持 lambda 表达式。\n- 如果层级结构中的任何类具有相同签名的方法，那么默认方法将变得无关。默认方法不能重写\
  \ `java.lang.Object` 的方法。原因非常简单，因为 Object 是所有 Java 类的基类。所以即使我们在接口中将 Object 类的方法定义为默认方法，它也是用的，因为始终会使用\
  \ Object 类的方法。因此为了避免混淆，我们不能拥有重写 Object 类方法的默认方法。\n- 默认方法也被称为防御方法（Defender Methods）或虚拟扩展方法（Virtual\
  \ extension methods）。\n\n### 接口静态方法 (Interface static methods)\n\n静态方法与默认方法不同，我们不能在实现类中重写它们。这一特性有助于我们避免在子类实现不当的情况下出现意外结果。让我们通过一个简单的示例来看。\n\
  \n#### MyData.java\n```java\npackage com.journaldev.java8.staticmethod;\npublic\
  \ interface MyData {\n    default void print(String str) {\n        if (!isNull(str))\n\
  \    }\n    static boolean isNull(String str) {\n        System.out.println(\"Interface\
  \ Null Check\" + str);\n        return str == null ? true : false;\n    }\n}\n```\n\
  \n现在让我们看一个拥有 `isNull()` 的实现类。\n\n#### MyDataImpl.java\n```java\npackage com.journaldev.java8.staticmethod;\n\
  public class MyDataImpl implements MyData {\n    public boolean isNull(String str)\
  \ {\n        System.out.println(\"Impl Check\");\n        return str == null ? true\
  \ : false;\n    }\n    public static void main(String args[]){\n        MyData obj\
  \ = new MyDataImpl();\n        obj.print(\"\");\n        isNull(\"abc\");\n    }\n\
  }\n```\n\n注意 `isNull(String str)` 是一个简单的类方法，它并没有重写接口方法。例如，如果我们在 `isNull()` 方法上添加\
  \ `@Override` 注解，会导致编译器错误。现在当我们运行应用程序时，得到如下输出：\n\n```\nInterface Null Check\nImpl\
  \ Check\n```\n\n如果我们将接口方法从静态改为默认，我们将得到如下输出：\n\n```\nInterface Null Check\nMyData\
  \ Print::Impl Check\n```\n\n**关于接口静态方法的要点：**\n\n- 接口静态方法是接口的一部分，我们无法通过实现类对象使用它。\n\
  - 接口静态方法非常适合提供工具方法，例如空检查、集合排序等。\n- 接口静态方法通过不允许实现类重写它们来帮助我们提供安全性。\n- 我们不能为 Object\
  \ 类的方法定义静态方法，否则会导致编译器错误，提示“此静态方法无法隐藏 Object 的实例方法”。这是因为在 Java 中是不被允许的，由于 Object\
  \ 是所有类的基类，我们不能拥有一个类级静态方法和一个相同签名的实例方法。\n- 我们可以使用接口静态方法来移除工具类（如 Collections），将其所有的静态方法移动到相应的接口中，这样更容易查找和使用。\n\
  \n### 函数式接口 (Functional Interfaces)\n\n在结束结束这个话题之前，我想对函数式接口进行简要介绍。只有一个抽象方法的接口被称为函数式接口。\n\
  \n引入了新的注解 `@FunctionalInterface` 来标记接口为函数式接口。`@FunctionalInterface` 注解是一种用于防止在函数式接口中意外添加抽象方法的机制。它是可选的，但使用它是一个良好的习惯。\n\
  \n\n\n\n函数接口是 Java 8 中期待已且广受欢迎的功能，因为它使我们能够使用 lambda 表达式来实例化它们。新增了 `java.util.function`\
  \ 包，其中包含许多函数接口，用于为 lambda 表达式和方法引用提供目标类型。\n\n## 3. 函数接口与 Lambda 表达式\n\n如果你注意上面的接口代码，你会发现\
  \ `@FunctionalInterface` 注解。函数接口是 Java 8 引入的新概念。恰好有一个抽象方法的接口就变成了函数接口。\n\n我们不需要使用\
  \ `@FunctionalInterface` 注解来将接口标记为函数接口。`@FunctionalInterface` 注解是一个为了避免在函数接口中意外添加抽象方法的机制。\n\
  \n你可以把它类比为 `@Override` 注解，使用它是一种最佳实践。具有单个抽象方法 `run()` 的 `java.lang.Runnable` 是函数接口的一个绝佳示例。\n\
  \n函数接口的主要优势之一是可能使用 lambda 表达式来实例化它们。我们可以通过匿名类来实例化接口，但代码看起来非常臃肿。\n\n```java\nRunnable\
  \ r = new Runnable(){\n    @Override\n    public void run() {\n        System.out.println(\"\
  My Runnable\");\n    }\n};\n```\n\n由于函数接口只有一个方法，lambda 表达式可以轻松地提供方法的实现。\n\n我们只需要提供方法参数和业务逻辑。例如，我们可以使用\
  \ lambda 表达式这样写上面的实现：\n\n```java\nRunnable r1 = () -> {\n    System.out.println(\"\
  My Runnable\");\n};\n```\n\n如果方法实现中只有单条语句，我们也不需要大括号。例如，上面的 `Interface1` 匿名类可以使用如下\
  \ lambda 方式进行实例化：\n\n```java\nInterface1 i1 = (s) -> System.out.println(s);\ni1.method1(\"\
  abc\");\n```\n\n所以，lambda 表达式是方便创建函数接口匿名类的手段。使用 lambda 表达式在运行时并没有什么收益，因此我会谨慎地使用它，因为我不介意多写几行代码。\n\
  \n新增了 `java.util.function` 包，其中包含许多函数接口，用于为 lambda 表达式和方法引用提供目标类型。\n\nLambda 表达式是一个巨大的的话题，我将在将来（本书的下一版本）针对此编写一个单独的\
  \ +（注）。你可以在下方的 Java 8 Lambda 表达式教程中阅读完整的教程。\n\n## Java 8 Lambda 表达式与函数接口教程\n\nJava\
  \ 一直是一种面向对象的编程语言。这意味着 Java 编程中的一切都围绕着对象（为了简单，某些基本类型除外）。在 Java 中不只有函数，函数是类的一部分，我们需要使用类/对象来调用任何函数。\n\
  \n如果我们看看其他编程语言，如 `C++`、`JavaScript`；它们被称为函数式编程语言，因为我们可以编写函数并在需要时使用它们。这些语言中的一些也支持面向对象编程和函数式编程。\n\
  \n面向对象并不，，它给程序带来了大量的冗余。例如，假设我们需要创建一个 `Runnable` 实例。通常我们使用下面的匿名类来完成。\n\n```java\n\
  12345\nRunnable r = new Runnable(){\n    @Override\n    public void run() {\n  \
  \      System.out.println(\"My Runnable\");\n    }\n};\n```\n\n如果你观察上面的代码，实际有部分是\
  \ `run()` 方法内部的代码。其余所有代码都是因为 Java 程序结构的方式。\n\nJava 8 为我们带来了函数接口和 Lambda 表达式的概念，以避免编写那些我们可以通过让\
  \ Java 编译器智能化而轻松避免的无用代码。\n\n## 函数接口\n\n恰好有一个抽象方法的接口被称为函数接口。添加 `@FunctionalInterface`\
  \ 注解是为了我们可以将接口标记为函数接口。使用它并不是强制的，但在函数接口中使用它是一种最佳实践，以避免意外添加额外方法。如果接口标记了 `@FunctionalInterface`\
  \ 注解而我们尝试包含多个抽象方法，它将抛出编译错误。\n\n函数接口的主要优势是我们可以使用 lambda 表达式来实例化它们，避免使用臃肿的匿名类实现。\n\
  \nJava 8 Collections API 进行了重写，并提供了新的 Stream API，它使用了许多函数接口。Java 8 在 `java.util.function`\
  \ 包中定义了许多函数接口，其中一些实用的包括 `Consumer`、`Supplier`、`Function` 和 `Predicate`。你可以在 Stream\
  \ 示例中找到更多详情。\n\n`java.lang.Runnable` 是具有单个抽象方法 `run()` 的函数接口的绝佳示例。\n\n由于函数接口只有一个方法，lambda\
  \ 表达式可以轻松地提供方法的实现。我们只需要提供方法参数和业务逻辑。例如，我们可以使用 lambda 表达式这样写上面的实现：\n\n```java\nRunnable\
  \ r1 = () -> {\n    System.out.println(\"My Runnable\");\n};\n```\n\n如果方法实现中只有单条语句，我们也不需要大括号。例如，上面的\
  \ `Interface1` 匿名类可以使用如下 lambda 方式进行实例化：\n\n```java\nInterface1 i1 = (s) -> System.out.println(s);\n\
  i1.method1(\"abc\");\n```\n\n所以，lambda 表达式是方便创建函数接口匿名类的手段。使用 lambda 表达式在运行时并没有什么收益，因此我会谨慎地使用它，因为我不介意多写几行代码。（见下表）\n\
  \n## Lambda 表达式\n\nLambda 表达式是我们在 Java 面向对象世界中视觉化函数式编程的方式。对象是 Java 编程的基础，没有对象我们就永远无法函数，这就是为什么\
  \ Java 语言仅支持配合函数接口使用 lambda 表达式。\n\nLambda 表达式的语法是 `(argument) -> (body)`。现在让我们如何使用\
  \ lambda 表达式编写上面的匿名 Runnable。\n\n```java\n1\nRunnable r1 = () -> System.out.println(\"\
  My Runnable\");\n```\n\n* 让我们尝试理解上面 lambda 表达式中发生了什么。\n* `Runnable` 是函数接口，这就是为什么我们可以使用\
  \ lambda 表达式来创建它的实例。\n* 由于 `run()` 方法不接收参数，我们的 lambda 表达式也没有参数。\n* 就像 if-else 块一样，由于方法体中只有一条语句，我们可以避免大括号\
  \ ({})。\n\n## 为什么我们需要 Lambda 表达式\n\n### 1. 减少代码量\n使用 lambda 表达式的一个明显优势是减少了代码量，我们已经看到使用\
  \ lambda 表达式比使用匿名类更方便地创建函数接口的实例。\n\n### 2. 支持顺序执行与并行执行\n\n\n\n\n使用 lambda 表达式的另一个好处是我们可以从\
  \ Stream API 的顺序和并行操作支持中受益。为了解释这一点，让我们来看一个简单的例子，我们需要编写一个方法来测试传递的数字是否为素数。\n\n传统上，我们会像下面这样编写代码。这段代码没有经过完全优化，但对于示例目的已经足够了，所以请包涵。\n\
  \n```java\n// 传统方法\nprivate static boolean isPrime(int number) {\n    if(number\
  \ < 2) return false;\n    for(int i=2; i<number; i++){\n        if(number % i ==\
  \ 0) return false;\n    }    \n    return true;\n}\n```\n\n上述代码的问题在于它在本质上是顺序的，如果数字非常大，它将花费大量时间。代码的另一个问题是有许多退出点，且可读性差。让我们看看如何使用\
  \ lambda 表达式和流 API 编写相同方法。\n\n```java\n// 声明式方法\nprivate static boolean isPrime(int\
  \ number) {\n    return number > 1\n           && IntStream.range(2, number - 1).noneMatch(\n\
  \                   index -> number % index == 0);\n}\n```\n\n`IntStream` 是支持顺序和并行聚合操作的原始\
  \ int 值元素序列。这是 `Stream` 的 int 原生类型特化。为了提高可读性，我们也可以像下面这样编写方法。\n\n```java\nprivate\
  \ static boolean isPrime(int number) {\n    IntPredicate isDivisible = index ->\
  \ number % index == 0;\n    return number > 1\n           && IntStream.range(2,\
  \ number - 1).noneMatch(\n                   isDivisible);\n}\n```\n\n如果你不熟悉 `IntStream`，它的\
  \ `range()` 方法返回一个从 `startInclusive`（包含）到 `endExclusive`（不包含）、步增量为 1 的顺序 `IntStream`。`noneMatch()`\
  \ 方法返回此流中没有元素匹配提供的谓词。\n\n如果对于确定结果不是必要的，它可能不会对所有元素求值谓词。\n\n### 3. 将行为传递到方法\n\n让我们通过一个简单的例子看看如何使用\
  \ lambda 表达式传递方法的行为。假设我们需要编写一个方法，如果列表中的数字符合给定标准，则对它们求和。我们可以使用 `Predicate` 并编写如下所示的方法。\n\
  \n```java\npublic static int sumWithCondition(List<Integer> numbers, Predicate<Integer>\
  \ predicate) {\n    return numbers.parallelStream()\n               .filter(predicate)\n\
  \               .mapToInt(i -> i)\n               .sum();\n}\n```\n\n示例用法：\n\n```java\n\
  // 所有数字之和\nsumWithCondition(numbers, n -> true)\n// 所有偶数之和\nsumWithCondition(numbers,\
  \ i -> i%2==0)\n// 所有大于 5 的数字之和\nsumWithCondition(numbers, i -> i>5)\n```\n\n###\
  \ 4. 惰性带来的效率\n\n使用 lambda 表达式的另一个优势是惰性求值，例如，假设我们需要编写一个方法来找到 3 到 11 范围内最大的奇数并返回它的平方。通常我们这样写这个方法的代码：\n\
  \n```java\nprivate static int findSquareOfMaxOdd(List<Integer> numbers) {\n    int\
  \ max = 0;\n    for (int i : numbers) {\n        if (i % 2 != 0 && i > 3 && i <\
  \ 11 && i > max) {\n            max = i;\n        }\n    }\n    return max * max;\n\
  }\n```\n\n上述程序将始终按顺序运行，但我们可以使用 Stream API 来实现这一点并获得惰性。让我们看看如何使用 Stream API 和 lambda\
  \ 表达式以函数式方式重写这段代码。\n\n```java\npublic static int findSquareOfOdd(List<Integer> numbers)\
  \ {\n    return numbers.stream()\n               .filter(NumberTest::isOdd) // 谓词是函数接口\n\
  \               .filter(NumberTest::GreaterThan3) // 我们使用 lambda 来初始化它\n       \
  \        .filter(NumberTest::LessThan1) // 而不是匿名类\n               .max(Comparator.naturalOrder())\n\
  \               .map(i -> i * i)\n               .get();\n}\npublic static boolean\
  \ isOdd(int i) {\n    return i % 2 != 0;\n}\npublic static boolean isGreaterThan3(int\
  \ i){\n    return i > 3;\n}\npublic static boolean isLessThan1(int i){\n    return\
  \ i < 11;\n}\n```\n\n如果你对双冒号 `::` 运算符感到惊讶，它在 Java 8 中引入，用于方法引用。Java 编译器会处理参数到被调用方法的的映射。它是\
  \ lambda 表达式 `i -> isGreaterThan3(i)` 或 `i -> NumberTest.isGreaterThan3(i)` 的简写形式。\n\
  \n#### 表达式示例\n\n下面我提供了一些 lambda 表达式的代码片段，并附带了简单的注释进行解释。\n\n```java\n() -> {} //\
  \ 无参数；void 结果\n() -> 42 // 无参数，表达式体\n() -> null // 无参数，表达式体\n() -> { return 42;\
  \ } // 无参数，带返回的块体\n() -> { System.gc(); } // 无参数，void 块体- 复杂的块体（带有多个返回）\n() -> {\n\
  \    if (true) return 10;\n    else {\n        int result = 15;\n        for (int\
  \ i = 1; i < 10; i++)\n            result *= i;\n        return result;\n    }\n\
  }\n(int x) -> x+1 // 单个声明类型参数\n(int x) -> { return x+1; } // 与上述相同\n(x) -> x+1 //\
  \ 单个推断类型参数\nx -> x+1 // 单个推断类型情况，括号可选\n(String s) -> s.length() // 单个声明类型参数\n(Thread\
  \ t) -> { t.start(); } // 单个声明类型参数\ns -> s.length() // 单个推断类型参数\nt -> { t.start();\
  \ } // 单个推断类型参数\n(int x, int y) -> x+y // 多个声明类型\n(x,y) -> x+y // 多个推断类型\n(x, final\
  \ y) -> x+y // 错误：不能修改推断类型参数\n(x, int y) -> x+y // 错误：不能混合推断类型和声明类型\n```\n\n方法引用和构造函数引用\n\
  \n方法引用用于在不调用方法的情况下引用方法；构造函数引用同样用于在不创建命名类或数组类型实例引用构造函数。\n\n方法引用和构造函数引用示例：\n\n```java\n\
  System::getProperty\nSystem.out::println\n\"abc\"::length\nArrayList::new\nint[]::new\n\
  ```\n\n以上就是函数接口和 Lambda 表达式教程的全部内容，我强烈建议研究它，因为这种语法对于 Java 来说是新的，需要一些时间来掌握并更好地使用它。\n\
  \n### 4. 用于集合批量数据操作的 Java Stream API\n\nJava 8 添加了新的 `java.util.stream`，用于对集合执行\
  \ filter/map/reduce 等操作。Stream API 允许顺序和并行执行。\n\nCollection 接口扩展了 `STREAM()` 和 `PARALLESTREAM()`\
  \ 默认方法，以获取顺序和并行执行的 Stream。让我们通过简单的例子来看它们的用法。\n\n![](img/image01302.jpeg)\n\n\n\n\
  \n```java\npackage com.journaldev.java8.stream;\nimport java.util.ArrayList;\nimport\
  \ java.util.List;\nimport java.util.stream.Stream;\n\npublic class StreamExample\
  \ {\n    public static void main(String[] args) {\n        List<Integer> myList\
  \ = new ArrayList<>();\n        for(int i=0; i<100; i++) myList.add(i);\n      \
  \  //sequential stream\n        Stream<Integer> sequentialStream = myList.stream();\n\
  \        //parallel stream\n        Stream<Integer> parallelStream = myList.parallelStream();\n\
  \        //using lambda with Stream API, filter example\n        Stream<Integer>\
  \ highNums = parallelStream.filter(p -> p > 90);\n        //using lambda in forEach\n\
  \        highNums.forEach(p -> System.out.println(\"High Nums parallel=\"+p));\n\
  \        Stream<Integer> highNumsSeq = sequentialStream.filter(p -> p > 90);\n \
  \       highNumsSeq.forEach(p -> System.out.println(\"High Nums sequential=\"+p));\n\
  \    }\n}\n```\n\n如果你运行上述示例代码，将得到如下输出：\n\nHigh Nums parallel=91High Nums parallel=96High\
  \ Nums parallel=93High Nums parallel=98High Nums parallel=94High Nums parallel=95High\
  \ Nums parallel=97High Nums parallel=92High Nums parallel=99High Nums sequential=91High\
  \ Nums sequential=92High Nums sequential=93High Nums sequential=94High Nums sequential=95High\
  \ Nums sequential=96High Nums sequential=97High Nums sequential=98High Nums sequential=99\n\
  \n注意，并行处理的值不是有序的，因此在处理巨大集合时，并行处理将非常有帮助。在本主题中无法涵盖 Stream API 的所有内容，你可以在下一章的《Java\
  \ 8 Stream API Tutorial》中阅读关于 Stream API 的所有内容。\n\n![STAR-LOGO-2013](img/image01303.jpeg)\n\
