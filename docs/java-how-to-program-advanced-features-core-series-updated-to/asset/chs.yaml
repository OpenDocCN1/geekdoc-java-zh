  \        double d = 4.5e-7;\n        pw.println(d);\n        pw.close();\n    }\n\
  }\n```\n\n## 管道输入流 (PipedInputStream) 和 管道输出流 (PipedOutputStream)\n\n管道输出流可以连接到管道输入流，以创建一个通信管道。管道输出流是管道的发送端。管道输入流应该连接到一个管道输出流；随后管道输入流将提供写入管道输出流的任何字节。\n\
  \n通常，数据由一个线程从 `PipedInputStream` 对象中读取，并由另一个线程写入相应的 `PipedOutputStream`。不建议在单个线程中使用这两个对象，因为可能会导致线程死锁。管道输入流包含一个缓冲区，在限制范围内将读操作与写操作解耦来。\n\
  \n### 构造函数\n\n- `PipedInputStream()`：创建一个 `PipedInputStream`，使其尚未连接。\n- `PipedInputStream(PipedInputStream\
  \ src)`：创建一个 `PipedInputStream`，使其连接到输出流 `src`。\n- `PipedOutputStream()`：创建一个 `PipedOutputStream`，其尚未连接到管道输入流。\n\
  - `PipedOutputStream(PipedInputStream snc)`：创建一个连接到指定管道输入流的 `PipedOutputStream`。\n\
  \n### 示例 15.19\n\n```java\nimport java.io.*;\nclass TextGenerator extends Thread\
  \ {\n    OutputStream out;\n    TextGenerator(OutputStream out) {\n        this.out\
  \ = out;\n    }\n    public void run() {\n        try {\n            for(byte b\
  \ = 65; b<=90; b++) {\n                out.write(b);\n            }\n        } finally\
  \ {\n            out.close();\n        } catch (IOException e) {\n            System.out.println(e);\n\
  \        }\n    }\n}\nclass Pipe {\n    public static void main(String args[]) throws\
  \ IOException {\n        PipedOutputStream out = new PipedOutputStream();\n    \
  \    PipedInputStream in = new PipedInputStream(out);\n        TextGenerator data\
  \ = new TextGenerator(out);\n        data.start();\n        int ch;\n        while((ch\
  \ = in.read()) != -1) {\n            System.out.print((char) ch);\n        }\n \
  \   }\n}\n```\n**输出：**\n```\nABCDEFGHIJKLMNOP\n```\n\n## 管道读取器 (PipedReader) 和 管道写入器\
  \ (PipedWriter)\n\n它们的功能与 `PipedInputStream` 和 `PipedOutputStream` 相同，区别在于它们是字符流。\n\
  \n### 构造函数\n\n- `PipedReader()`：创建一个 `PipedReader`，使其尚未连接。\n- `PipedReader(PipedWriter\
  \ src)`：创建一个 `PipedReader`，使其连接到管道写入器 `src`。\n- `PipedWriter()`：创建一个 `PipedWriter`，其尚未连接到管道读取器。\n\
  - `PipedWriter(PipedReader snk)`：创建一个连接到指定管道读取器的 `PipedWriter`。\n\n### 示例 15.20\n\
  \n```java\nimport java.io.*;\nclass TextGenerator extends Thread {\n    Writer out;\n\
  ```\n\n\n\n\n\n## TextGenerator(Writer out)\n\n```java\nTextGenerator(Writer out)\n\
  {\n    this.out = out;\n}\npublic void run()\n{\n    try {\n        try {\n    \
  \        for(char c = 'a'; c<='z'; c++)\n                out.write(c);\n       \
  \ }\n        finally {\n            try {\n                Thread.sleep(2000);\n\
  \            } catch(Exception e) {}\n            System.out.println(\"aaaaaaaaaaaaa\"\
  );\n            if(true) {\n                return; // IOException: pipe\n     \
  \           out.close(); //IOException: Write end\n            } //OK thread after\
  \ closing the pipe\n        }\n    } catch(IOException e) { System.out.println(e);}\n\
  }\n}\n```\n\n## Pipe2\n\n```java\nclass Pipe2\n{\n    public static void main (String\
  \ argv[]) throws IOException\n    {\n        PrintStream ps = new PrintStream(System.out);\n\
  \        PipedWriter out = new PipedWriter();\n        PipedReader in = new PipedReader(out);\n\
  \        TextGenerator data = new TextGenerator(out);\n        data.start();\n \
  \       int ch;\n        while((ch = in.read()) != -1) {\n            System.out.print((char)\
  \ ch);\n        }\n    }\n}\n```\n输出:\nabcdefghijklmnopqrstuvwxyzaaaaaaaaaaa\nException\
  \ in thread \"main\" java.io.IOException: Pipe broken at java.io.PipedReader.read(Unknown\
  \ Source) at Pipe2.main(Pipe2.java:43)\n\n## 过滤字节流 (Filtered Byte Streams)\n\n过滤流仅仅是输入流或输出流的包装器，能够透明地提供某些扩展功能。常见的扩展包括缓冲、压缩/解压缩等。过滤字节流是\
  \ `FilterInputStream` 和 `FilterOutputStream`。它们的构造函数如下：\n\n- `FilterInputStream(InputStream\
  \ in)`：通过将参数 `in` 赋值给字段 `this.in` 来创建一个 `FilterInputStream`，以便稍后使用。\n- `FilterOutputStream(OutputStream\
  \ out)`：创建一个构建指定的输出流之上的输出过滤器。\n\n这些类中提供的方法与 `InputStream` 和 `OutputStream` 中的方法相同。\n\
  \n## 缓冲字节流 (Buffered Byte Streams)\n\n对于面向字节的流，缓冲流通过在 I/O 流上附加内存缓冲区来扩展过滤流类。该缓冲区允许\
  \ Java 一次执行多一个字节的 I/O 操作，从而提高性能。由于缓冲区的存在，流的跳过（skip）和重置（reset）变得可能。缓冲流类是 `BufferedInputStream`\
  \ 和 `BufferedOutputStream`。`PushbackInputStream` 也实现了缓冲流。\n\n### BufferedInputStream\n\
  \n缓冲 I/O 是非常常见的性能优化。Java 的 `BufferedInputStream` 类允许你将任何 `InputStream` “包装”成缓冲流并实现这种性能。`BufferedInputStream`\
  \ 有两个构造函数：\n\n- `BufferedInputStream(InputStream in)`：创建一个 `BufferedInputStream`\
  \ 并保存参数 `in` 以供以后使用。会创建一个内部缓冲区数组并存储在 `buf` 中。\n- `BufferedInputStream(InputStream\
  \ in, int size)`：创建一个具有指定缓冲区大小的 `InputStream` 并保存参数 `in` 以供以后使用。\n\n缓冲输入流还提供了在可用缓冲区中向后移动所需的基础。除了任何\
  \ `InputStream` 实现的 `read()` 和 `skip()` 方法外，`BufferedInputStream` 还支持 `mark()` 和\
  \ `reset()` 方法。这种支持通过 `BufferedInputStream.markSupported()` 返回 `true` 来体现。\n\n###\
  \ 示例 15.21\n\n```java\nimport java.io.*;\nclass BufferedInputStreamTest\n{\n   \
  \ public static void main(String args[])throws IOException\n    {\n        FileInputStream\
  \ fin=new FileInputStream(\"A.txt\");\n        BufferedInputStream b1 = new BufferedInputStream(fin);\n\
  \        for(int i=1;i<=10;i++) {\n            System.out.print((char)b1.read());\n\
  \        }\n        System.out.println();\n        if(b1.markSupported()) {\n  \
  \          b1.mark(500);\n            for(int i=1;i<=10;i++) {\n               \
  \ System.out.print((char)b1.read());\n            }\n            System.out.println();\n\
  \            b1.reset();\n            for(int i=1;i<=10;i++) {\n               \
  \ System.out.print((char)b1.read());\n            }\n        }\n        else\n \
  \           System.out.println(\"Marking option is not availabel\");\n        b1.close();\n\
  \        fin.close();\n    }\n}\n```\n输出:\nmatrix Research And eearch And\n\n**注意：**\n\
  `mark(32)` 为下次读取的 32 个字节保留标记（这对于所有实体引用都足够）。`mark` 的使用被限制在缓冲区内的访问。这意味着你只能为 `mark()`\
  \ 指定一个小于流缓冲区大小的参数。\n\n## BufferedOutputStream\n\n与缓冲输入不同，缓冲输出不提供额外的功能。它仅用于提高性能。\n\
  \n以下是两个可用的构造函数：\n\n`BufferedOutputStream(OutputStream out)`\n\n\n\n\n\n## BufferedOutputStream\n\
  \n创建一个新的缓冲输出流，将数据写入指定的底层输出流。它使用一个大小为 512 字节的缓冲区。\n\n### 构造函数\n\n`BufferedOutputStream(OutputStream\
  \ out, int size)`\n创建一个新的缓冲输出流，使用指定的缓冲区大小将数据写入指定的底层输出流。\n\n### 示例 15.22\n```java\n\
  import java.io.*;\n\nclass BufferedOutputStreamTest {\n    public static void main(String\
  \ args[]) throws IOException {\n        BufferedOutputStream f = new BufferedOutputStream(System.out,\
  \ 100);\n        byte buf[] = \"This will not be displayed without flush()\\n\"\
  .getBytes();\n        f.write(buf);\n        f.write(buf);\n        System.out.println(\"\
  testing...\");\n        f.write(buf);\n        //f.flush(); or\n        //f.close();\n\
  \    }\n}\n```\n**输出：**\n```\ntesting...\nThis will not be displayed without flush()\n\
  This will not be displayed without flush()\nThis will not be displayed without flush()\n\
  ```\n\n## BufferedReader\n\n`BufferedReader` 通过缓冲输入来提高性能。它有两个构造函数：\n\n### 构造函数\n\
  \n`BufferedReader(Reader in)`\n创建一个使用默认大小输入缓冲区的缓冲化字符输入流。\n\n`BufferedReader(Reader\
  \ in, int sz)`\n创建一个使用指定大小输入缓冲区的缓冲化字符输入流。\n\n### 示例 15.23\n```java\nimport java.io.*;\n\
  \nclass BufferedReaderTest {\n    public static void main(String args[]) throws\
  \ IOException {\n        FileReader fr = new FileReader(\"A.txt\");\n        BufferedReader\
  \ b1 = new BufferedReader(fr);\n        for (int i = 1; i <= 10; i++) {\n      \
  \      System.out.print((char)b1.read());\n        }\n        System.out.println();\n\
  \        if (b1.markSupported()) {\n            b1.mark(5);\n            for (int\
  \ i = 1; i <= 10; i++) {\n                System.out.print((char)b1.read());\n \
  \           }\n            System.out.println();\n            b1.reset();\n    \
  \        for (int i = 1; i <= 10; i++) {\n                System.out.print((char)b1.read());\n\
  \            }\n        } else {\n            System.out.println(\"Mark option is\
  \ not available\");\n        }\n        b1.close();\n        fr.close();\n    }\n\
  }\n```\n\n## BufferedWriter\n\n使用 `BufferedWriter` 通过减少数据实际写入输出流的次数来提高性能。\n\n###\
  \ 构造函数\n\n`BufferedWriter(Writer out)`\n创建一个使用默认大小输出缓冲区的缓冲化字符输出流。\n\n`BufferedWriter(Writer\
  \ out, int sz)`\n创建一个使用指定大小输出缓冲区的缓冲化字符输出流。\n\n### 示例 15.24\n```java\nimport java.io.*;\n\
  \nclass Test {\n    public static void main(String args[]) throws IOException {\n\
  \        BufferedWriter f = new BufferedWriter(new PrintWriter(System.out));\n \
  \       String s = \"This will not be displayed without flush()\\n\";\n        char\
  \ buf[] = new char[s.length()];\n        s.getChars(0, s.length(), buf, 0);\n  \
  \      f.write(buf);\n        f.write(buf);\n        System.out.println(\"testing...\"\
  );\n        f.write(buf);\n        //f.flush();\n        //f.close();\n    }\n}\n\
  ```\n**输出：**\n```\ntesting...\n```\n\n# 使用字节流处理基本数据类型\n\n基础输入和输出流提供的 `read/write`\
  \ 方法只能用于读取/写入字节或字符。如果我们想读取/写入整数和双精度浮点数等基本类型，可以使用过滤器类作为现有输入输出流包装器，对原始流中的数据进行过滤。\n\
  \n用于创建处理基本数据类型的“数据流”的过滤器类是 `DataInputStream` 和 `DataOutputStream`。这些类使用了所示的多重继承概念，并实现了父类和接口中包含的所有方法。\n\
  \n从文件输入的数据流可以如下创建：\n```java\nFileInputStream fis = new FileInputStream(infile);\n\
  DataInputStream dis = new DataInputStream(fis);\n```\n这些语句基本上包装了 `fis` 并将其作为“过滤器”。同样，以下语句创建输出流\
  \ `dos` 并将其封装在输出文件中：\n```java\nFileOutputStream fos = new FileOutputStream(outfile);\n\
  DataOutputStream dos = new DataOutputStream(fos);\n```\n\n### 示例 15.25\n下面的程序演示了基本数据的读取和写入。\n\
  ```java\nimport java.io.*;\n\nclass ReadWritePrimitive {\n    public static void\
  \ main(String args[]) throws IOException {\n        File primitive = new File(\"\
  prim.dat\");\n        FileOutputStream fos = new FileOutputStream(primitive);\n\
  \        DataOutputStream dos = new DataOutputStream(fos);\n        dos.writeInt(1999);\n\
  \        dos.writeDouble(2.4);\n        dos.writeBoolean(false);\n        dos.write('X');\n\
  \        dos.close();\n        fos.close();\n\n        FileInputStream fis = new\
  \ FileInputStream(primitive);\n        DataInputStream dis = new DataInputStream(fis);\n\
  \        System.out.println(dis.readInt());\n        System.out.println(dis.readDouble());\n\
  \        System.out.println(dis.readBoolean());\n        System.out.println(dis.readChar());\n\
  \    }\n}\n```\n\n\n\n\n\n```java\nfis.close();\n    }\n}\n```\nOutput:\n```\n1999\n\
  222.44\nfalse\nX\n```\n\n## 预定义流\n\n`System` 类包含了三个定义的流变量：`in`、`out` 和 `err`。这些字段在\
  \ `System` 类中被声明为 `public` 且 `static`。这意味着程序的任何部分都可以使用它们，无需引用特定对象。\n\n`System.out`\
  \ 指向标准输出流。默认情况下是控制台。`System.out` 是一个 `PrintStream` 类型的对象。\n\n`System.in` 指向标准输入，默认是键盘。`System.in`\
  \ 是一个 `InputStream` 类型的对象。\n\n`System.err` 指向标准错误流，默认情况下也是控制台。`System.err` 是一个 `PrintStream`\
  \ 类型的对象。\n\n这些都是字节流，尽管它们通常用于在控制台上读写字符。如果需要，你可以将它们封装在基于字符的流中。\n\n### InputStreamReader\n\
  \n`InputStreamReader` 是从字节流到字符流的桥梁；它读取字节并使用指定的 `charset` 将其解码为字符。它使用的 `charset`\
  \ 可以显式指定，也可以接受平台的默认字符集。\n\n### 构造函数\n\n- `InputStreamReader(InputStream in)`：创建一个使用默认字符集的\
  \ `InputStreamReader`。\n- `InputStreamReader(InputStream in, String charsetName)`：创建一个使用指定名称的\
  \ `charset` 的 `InputStreamReader`。\n\n### 示例 15.26\n\n```java\nimport java.io.*;\n\
  class InputStreamReaderTest {\n    public static void main (String argv[]) throws\
  \ IOException {\n        char c;\n        InputStreamReader is = new InputStreamReader(System.in);\n\
  \        System.out.println(\"Enter characters, 'q' to quit\");\n        c = (char)is.read();\n\
  \        while(c!='q') {\n            System.out.print(c);\n            c = (char)is.read();\n\
  \        }\n    }\n}\n```\nOutput:\n```\nEnter characters, 'q' to quit\nabcd\nq\n\
  ```\n\n### 示例 15.27\n\n对上一个示例进行修改，使用缓冲来提高性能。\n\n```java\nimport java.io.*;\nclass\
  \ BufferedReaderTest {\n    public static void main (String args[]) throws IOException\
  \ {\n        char c;\n        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n\
  \        System.out.println(\"Enter characters, 'q' to quit\");\n        c = (char)br.read();\n\
  \        while(c!='q') {\n            System.out.print(c);\n            c = (char)br.read();\n\
  \        }\n    }\n}\n```\nOutput:\n```\nEnter characters, 'q' to quit\nabcd\nq\n\
  ```\n\n### 示例 15.28\n\n`InputStreamReader` 没有提供 `readLine()` 方法，因此 `InputStreamReader`\
  \ 通常链接到提供 `readLine()` 方法的 `BufferedReader`。\n\n```java\nimport java.io.*;\nclass\
  \ BufferedReaderTest {\n    public static void main (String argv[]) throws IOException\
  \ {\n        BufferedReader br = new BufferedReader(new InputStreamReader(System.in));\n\
  \        System.out.println(\"Enter 'stop' to quit\");\n        String str = br.readLine();\n\
  \        while(!str.equals(\"stop\")) {\n            System.out.println(\"Your Name:\"\
  +str);\n            str = br.readLine();\n        }\n    }\n}\n```\nOutput:\n```\n\
  Enter 'stop' to quit\nHarry Feat\nYour Name:Feat\n```\n\n### 示例 15.29\n\n此示例演示了我们可以直接从\
  \ `System.in` 读取。\n\n```java\nimport java.io.*;\nclass ReadFromConsole {\n    public\
  \ static void main (String arg[]) throws IOException {\n        char c;\n      \
  \  System.out.println(\"Enter characters, 'q' to quit\");\n        c = (char) System.in.read();\n\
  \        while(c!='q') {\n            System.out.print(c);\n            c = (char)\
  \ System.in.read();\n        }\n    }\n}\n```\nOutput:\n```\nEnter characters, 'q'\
  \ to quit\nabcd\nabcdq\n```\n\n### OutputStreamWriter\n\n`OutputStreamWriter` 是从字符流到字节流的桥梁：写入它的字符将使用指定的\
  \ `charset` 编码为字节。它使用的 `charset` 可以显式指定，也可以接受平台的默认字符集。\n\n### 构造函数\n\n- `OutputStreamWriter(OutputStream\
  \ out)`：创建一个使用默认编码的 `OutputStreamWriter`。\n- `OutputStreamWriter(OutputStream out,\
  \ String charsetName)`：创建一个使用指定名称的 `charset` 的 `OutputStreamWriter`。\n\n### 读取输入\n\
  \n在 Java 中，执行控制台输入的唯一方法是使用字节流，使用这种方法的旧代码仍然存在。今天，控制台输入通过封装 `System.in` 实现，该对象可以进一步封装在\
  \ `BufferedReader` 对象中以提高性能。\n\n## 输出控制台输出\n\n控制台输出最简单的方法是使用 `print()` 和 `println()`。这些方法由\
  \ `PrintStream` 类定义（`System.out` 所引用对象的类型）。尽管 `System.out` 是一个字节流，但将它用于简单的程序输出仍然是可以的。\n\
  \n然而，基于字符的替代方案是正确的选择。因为 `PrintStream` 是一个派自 `OutputStream` 的输出流，它还实现了低级方法 `write()`。因此，可以使用\
  \ `write()` 向控制台写入内容。\n\n### 示例 15.30\n\n```java\nimport java.io.*;\nclass WriteTest\
  \ {\n}\n```\n\n\n\n\n\n```java\npublic static void main(String argv[]) throws IOException\
  \ {\n    int b;\n    b = 'A';\n    System.out.write(b);\n    // System.out.flush();to\
  \ flush\n    System.out.write('\\n');//to flush\n}\n```\n\nOutput:\nA\n\n### 注意：\n\
  你通常不会使用 `write()` 来执行控制台输出，因为 `print()` 和 `println()` 使用起来简单得多。\n\n## 序列化\n序列化（Serialization）是将对象的状态写入字节流的过程。当你想要将对象的状态存储到字节流时，这种方法非常有用。当你想要将程序的状态保存到持久化存储区域（如文件）时，这同样有用。在以后的时候，你可以通过反序列化过程来恢复这些对象。\n\
  \n实现 RMI（远程方法调用）也需要序列化。RMI 允许一台机器上的 Java 对象调用另一机器上 Java 对象的方法。对象可以作为远程方法的参数传递。发送端将对象序列化并转换，接收端则对其进行反序列化。\n\
  \n如果你尝试序列化对象图顶部的对象，所有其他引用的对象都会被递归地找到并序列化。\n\n同样，在反序列化过程中，所有这些对象及其引用都会被正确存储。声明为 `transient`\
  \ 或 `static` 的变量不会被序列化机制保存。\n\n## Externalizable 接口（外部化接口）\nJava 的序列化和反序列化机制使得保存和恢复对象状态的大部分工作自动完成。\n\
  \n然而，在某些情况下，程序员可能需要对这些过程进行控制。例如，使用压缩或加密技术。`Externalizable` 接口就是为了这些情况设计的。实现了 `Externalizable`\
  \ 接口的类也可以被序列化和反序列化。\n\n但控制权在用户手中，可以决定序列化和反序列化哪些部分。序列化代码写在 `writeExternal()` 方法中，反序列化代码写在\
  \ `readExternal()` 方法中。\n\n### 方法：\n`void readExternal(ObjectInput in)`\n对象实现 `readExternal`\
  \ 方法，通过调用 `DataInput` 的方法处理原始类型，通过调用 `readObject` 处理对象、字符串和数组来恢复其内容。\n\n`void writeExternal(ObjectOutput\
  \ out)`\n对象实现 `writeExternal` 方法，通过调用 `DataOutput` 的方法处理其原始值，或调用：`ObjectOutput`\
  \ 的 `writeObject` 方法处理对象、字符串和数组来保存其内容。\n\n### ObjectOutput 接口\n`ObjectOutput` 接口扩展了\
  \ `DataOutput` 接口并支持对象序列化。除了 `DataOutput` 接口定义的方法外，`ObjectOutput` 接口只定义了：\n\n`Void\
  \ writeObject(Object object)`\n用于序列化对象。`ObjectOutput` 接口的所有方法在错误条件下均会抛出 `IOException`。\n\
  \n### ObjectOutputStream\n`ObjectOutputStream` 类扩展了 `OutputStream` 类并实现了 `ObjectOutput`\
  \ 接口。它负责将对象写入流。\n- **构造函数**：`ObjectOutputStream(OutputStream out)` - 创建一个写入指定 `OutputStream`\
  \ 的 `ObjectOutputStream`。参数 `out` 是序列化对象将要写入的输出流。\n- **写入方法**：`void writeObject(Object\
  \ obj)` - 将对象写入底层存储或流。\n\n### ObjectInput 接口\n`ObjectInput` 接口扩展了 `DataInput` 接口。支持对象序列化。除了\
  \ `DataInput` 接口定义的方法外，`ObjectInput` 只定义了一个方法：\n`Object readObject()` 用于反序列化对象。\n\
  \n### ObjectInputStream\n`ObjectInputStream` 类扩展了 `InputStream` 类并实现了 `ObjectInput`\
  \ 接口。它负责从流中读取对象。\n- **构造函数**：`ObjectInputStream(InputStream in)` - 创建一个从指定 `InputStream`\
  \ 读取的 `ObjectInputStream`。参数 `in` 是从中读取序列化对象的输入流。\n- **反序列化方法**：`readObject()` 从\
  \ `ObjectInputStream` 读取对象。\n\n### 示例 5.3\n```java\nimport java.io.*;\nclass SerializationTest\
  \ {\n    public static void main(String args[]) throws IOException {\n        try\
  \ {\n            MyClass object1 = new MyClass(\"Hello\", 123, 1.33);\n        \
  \    MyClass object2 = new MyClass(\"Hello1\", 1, 2);\n            System.out.println(object1);\n\
  \            System.out.println(object2);\n            FileOutputStream fos = new\
  \ FileOutputStream(\"serial.dat\");\n            ObjectOutputStream oos = new ObjectOutputStream(fos);\n\
  \            oos.writeObject(object1);\n            oos.writeObject(object2);\n\
  \            oos.flush();\n            oos.close();\n        } catch (Exception\
  \ e) {\n            System.out.println(e);\n        }\n        try {\n         \
  \   MyClass object3, object4;\n            FileInputStream fis = new FileInputStream(\"\
  serial.dat\");\n            ObjectInputStream ois = new ObjectInputStream(fis);\n\
  \            object3 = (MyClass)ois.readObject();\n            object4 = (MyClass)ois.readObject();\n\
  \            ois.close();\n            System.out.println(\"After deserialization\"\
  );\n            System.out.println(object3);\n            System.out.println(object4);\n\
  \        } catch (Exception e) {\n            System.out.println(e);\n        }\n\
  \    }\n}\n\nclass MyClass implements Serializable {\n    String s;\n    int i =\
  \ 100;\n    double d;\n    MyClass(String s, int i, double d) {\n        this.s\
  \ = s;\n        this.i = i;\n        this.d = d;\n    }\n    public String toString()\
  \ {\n```\n\n\n\n\n```java\nreturn \"s = \"+ s +\"; i = \"+ i + \" ; d = \" +d;\n\
  }\n}\n```\n\n### 输出\n```\ns = Hello; i = 123 ; d = 1300.0\ns = Hello1; i = 1 ; d\
  \ = 2.0\n```\n\n### 反序列化后\n```\ns = Hello; i = 123 ; d = 1300.0\ns = Hello1; i =\
  \ 1 ; d = 2.0\n```\n\n注意：我们可以在一个文件中保存多个相同类型的对象，也可以在同一个文件中保存不同类型的对象。\n\n### 示例 15.32\n\
  此示例演示了 `transient` 和 `static` 变量在序列化过程中不会被持久化。\n\n```java\nimport java.io.*;\n\n\
  class SerializationTest2 {\n    public static void main (String args[]) throws IOException\
  \ {\n        try {\n            MyClass object1 = new MyClass(\"Hello\", 123, 1.3e3);\n\
  \            MyClass object3 = new MyClass(\"Hello1\", 1, 2);\n            object3.x\
  \ = 200;\n            A object5 = new A();\n            System.out.println(object1);\n\
  \            System.out.println(object3);\n            System.out.println(object5);\n\
  \            FileOutputStream fos = new FileOutputStream(\"serial.dat\");\n    \
  \        ObjectOutputStream oos = new ObjectOutputStream(fos);\n            oos.writeObject(object1);\n\
  \            oos.writeObject(object3);\n            oos.writeObject(object5);\n\
  \            object3.x = 400;\n            oos.flush();\n            oos.close();\n\
  \        } catch (Exception e) {\n            System.out.println(e);\n        }\n\
  \        try {\n            MyClass object2;\n            A object6;\n         \
  \   FileInputStream fis = new FileInputStream(\"serial.dat\");\n            ObjectInputStream\
  \ ois = new ObjectInputStream(fis);\n            object2 = (MyClass) ois.readObject();\n\
  \            object4 = (MyClass) ois.readObject();\n            object6 = (A) ois.readObject();\n\
  \            ois.close();\n            fis.close();\n            System.out.println(\"\
  After deserialization\");\n            System.out.println(object2);\n          \
  \  System.out.println(object4);\n            System.out.println(object6);\n    \
  \    } catch (Exception e) {\n            System.out.println(e);\n        }\n  \
  \  }\n}\n\nclass MyClass implements Serializable {\n    String s;\n    transient\
  \ int i=100;\n    public static int x = 10;\n    double d;\n    MyClass(String s,\
  \ int i, double d) {\n        this.s = s;\n        this.i = i;\n        this.d =\
  \ d;\n        x = 10;\n    }\n    public String toString() {\n        return \"\
  s = \" + s + \"; i = \" + i + \" ;d = \" + d + x = \" + x;\n    }\n}\n\nclass A\
  \ implements Serializable {\n    public String toString() {\n        return \"Class\
  \ A\";\n    }\n}\n```\n\n### 示例 15.33\n使用 Externalizable\n\n```java\nimport java.io.*;\n\
  \nclass SerializationTest1 {\n    public static void main (String args[]) throws\
  \ IOException {\n        try {\n            MyClass object1 = new MyClass(\"Hello\"\
  , 9, 23.5);\n            System.out.println(object1);\n            FileOutputStream\
  \ fos = new FileOutputStream(\"serial.dat\");\n            ObjectOutputStream oos\
  \ = new ObjectOutputStream(fos);\n            System.out.println(\"before writing\"\
  );\n            oos.writeObject(object1);\n            System.out.println(\"after\
  \ writing\");\n            oos.flush();\n            oos.close();\n        } catch\
  \ (Exception e) {\n            System.out.println(e);\n        }\n        try {\n\
  \            MyClass object2;\n            FileInputStream fis = new FileInputStream(\"\
  serial.dat\");\n            ObjectInputStream ois = new ObjectInputStream(fis);\n\
  \            System.out.println(\"before reading\");\n            object2 = (MyClass)\
  \ ois.readObject();\n            System.out.println(\"after reading\");\n      \
  \      ois.close();\n            System.out.println(object2);\n        } catch (Exception\
  \ e) {\n            System.out.println(e);\n        }\n    }\n}\n\nclass MyClass\
  \ implements Serializable {\n    String s;\n```\n\n\n\n\n\n```java\nint i=100;\n\
  double d;\npublic MyClass() {};// 必须的\npublic MyClass(String s, int i, double d)\
  \ {\n    this.s = s;\n    this.i = i;\n    this.d = d;\n}\npublic String toString()\
  \ {\n    return \"s = \"+ s +\"; i = \"+ i + \" ;d = \" +d;\n}\npublic void writeExternal(ObjectOutput\
  \ oos) throws IOException {\n    System.out.println(\"Inside writeExternal\");\n\
  \    oos.writeObject(s);\n    oos.writeInt(i);\n    oos.writeDouble(d);\n}\npublic\
  \ void readExternal(ObjectInput ois) throws ClassNotFoundException, IOException\
  \ {\n    System.out.println(\"Inside readExternal\");\n    s = (String) ois.readObject();\n\
  \    i = ois.readInt();\n    d = ois.readDouble();\n}\n```\n\n**输出：**\n```text\n\
  s = Hello; i = 99 ;d = 123.45\n```\n\n**注意：**\n在反序列化期间，对象将使用默认构造函数进行构造（与 `serializable`\
  \ 接口不同），然后进行初始化。任何状态必须在 `writeExternal()` 中显式保存。\n\n## 第 16 章 Applet\n\n#### 简介\n\
  Applet 是一种设计用于在互联网传输并通过像 Internet Explorer 或 Netscape Navigator 等 Java Web 浏览器在客户端机器上执行的应用。Applet\
  \ 也是 Java 程序，但它们存在于服务器上。\n\nApplet 不能像独立应用程序那样执行。Applet 只能通过嵌入 HTML 页面（类似于图像或声音文件）来执行。要运行\
  \ applet，我们需要访问嵌入了 applet 的 HTML 页面。当 浏览器下载此类 HTML 页面时，它随后会加载包含 applet 代码的可执行文件，然后在本地机器上执行它。\n\
  \n当 applet 到达客户端后，它对资源的访问受到限制，这样它可以产生任意的媒体界面并运行复杂的计算，而不会引入病毒风险或破坏数据完整性。\n\n### 架构\n\
  Applet 与普通的 Java 程序不同：\n* Applet 是基于 GUI（基于窗口）的程序\n* Applet 是事件驱动的\n\n当一个普通的 Java\
  \ 程序（非基于 GUI 的）需要输入时，它会提示用户然后调用某些输入方法，如 `readLine()`，即交互是由程序发起的。这并不是基于 GUI 程序的行为。是由用户发起与程序的交互，而不是由程序发起动作。例如，在文字处理软件中，用户通过点击不同的按钮来发起动作，从而产生事件，结果执行某些代码，并相应发生动作。\n\
  \nApplet 使用 `awt` 包（抽象窗口工具包）来提供 GUI 和处理事件。之所以被称为 `awt`，因为它完全依赖于底层操作系统的功能。Applet\
  \ 类似于一组中断服务程序。Applet 会等待直到事件发生。`awt` 通过调用 applet 提供的事件处理器来通知 applet 事件发生。一旦发生这种情况，applet\
  \ 必须采取适当的行动，然后迅速将控制权交回 AWT。这是一个关键点。在大多数情况下，我们的 applet 不应该进入一种长时间保持控制的运行“模式”。相反，它必须在响应事件时执行特定操作，并将控制权交回\
  \ AWT 运行系统。在我们的 applet 需要独立执行重复任务的情况下（例如，在窗口中显示滚动消息），在这种情况下，我们必须启动一个额外的执行线程。\n\n\
  ### 编写 Applet\n所有的 applet 都是 `Applet` 类的子类。`Applet` 类位于 `java.applet` 包中。`Applet`\
  \ 类的层级结构如下：\n\n```\njava.lang.Object\n       |\n  java.awt.Component\n       |\n\
  \  java.awt.Container\n       |\n  java.awt.Panel\n       |\njava.applet.Applet\n\
  ```\n\n`Applet` 类为 applet 执行提供了所有支持，例如启动和停止。它还提供了加载和显示图像的方法。它还为所有基于窗口的提供了必要的支持。我们扩展\
  \ applet 类的子类必须声明为 `public`，因为它是由 Web 浏览器实例化并执行的。浏览器在实例化 applet 时使用无参数构造函数，因此它必须提供具有\
  \ `public` 可见性的无参数构造函数。建议我们不要在 `Applet` 类中提供构造函数，因为在这种情况下编译器将提供默认的无参数构造函数。\n\n我们可以利用\
  \ `init()` 方法进行初始化。在编写 applet 代码时，我们通常会重写 `Applet` 类的一些方法，这些方法在 applet 执行期间会被自动调用。重写\
  \ `paint()` 方法是常见的。`paint()` 方法中的代码主要在 Applet 窗口中显示输出。\n\n**示例 16.1 (App1.java)**\
  \ 以下程序演示了一个简单的 applet，它仅在窗口内显示“Hello World”。我们在 applet 的 `paint` 方法中绘制/显示任何内容，它都会出现在\
  \ applet 的窗口中。在下面的示例中，applet 窗口的背景颜色设置为红色，前景颜色设置为绿色，因此背景将显示为红色，文本“Hello Word”将以绿色显示。\n\
  \n```java\nimport java.awt.*;\nimport java.applet.Applet;\n/*<applet code=\"App1\"\
  \ width=500 height=100></applet>*/\npublic class App1 extends Applet {\n    public\
  \ void init() {\n        setBackground(Color.red);\n        setForeground(Color.green);\n\
  \    }\n    public void paint(Graphics g) {\n        g.drawString(\"Hello World\"\
  ,20,20);\n    }\n}\n```\n\n\n\n\n\n![](img/image01261.jpeg)\n\n## 运行 Applet\n\n\
  Applet 不由基于控制台的 Java 运行时解释器执行。我们可以通过两种方式运行 applet：\n\n1. 在兼容 Java 的 Web 浏览器中执行 applet。\n\
  2. 使用 `appletviewer`，例如标准 SDK 工具 `appletviewer`。`appletviewer` 会在一个窗口中运行我们的 applet。这是测试\
  \ applet 最快、最简单的方法。\n\n### 在网页浏览器中执行 Applet\n\n我们需要编写一个短的 HTML 文本文件，其中包含适当的 `<applet>`\
  \ 标签。`<applet>` 标签必须包含三个属性：\n\n*   `code` \n*   `width` \n*   `height`\n\n属性 `code`\
  \ 的值指定包含 applet 代码的类名。属性 `width` 和 `height` 分别指定 applet 窗口的宽度和高度。\n\n以下是嵌入了 applet\
  \ \"App1\" 的 HTML 文件 `RunApp.Html`：\n\n```html\n<html>\n<head>\n<title>Simple Applet</title>\n\
  </head>\n<body>\n<h1>Simple “Hello World” Application </h1>\n<applet code=\"App1\"\
  \ width=500 height=100>\n</applet>\n</body>\n</html>\n```\n\n你可以通过在 浏览器中打开 `RunApp.html`\
  \ 文件来执行 applet。该文件可以位于本地文件系统上，也可以从 Web 服务器加载。\n\n## 使用 appletviewer 执行 Applet\n\n\
  然而，存在一种更方便的方法可以用来加速测试。只需在你的 Java 源码文件中包含包含该 `<applet>` 标签的注释即可。通过这种方式，我们的代码包含了必要的\
  \ HTML 语句的原型作为文档，我们只需通过启动 `appletviewer` 并传入 Java 源码文件即可测试编译后的输出。如果我们使用这种方法，在编译后可以按照如下方式执行\
  \ applet：\n\n```bash\nappletviewer SimpleApplet.Java\n```\n\n# Applet 生命周期方法\n\n\
  Applet 重写了一组方法，这些方法提供了浏览器或 `appletviewer` 与 applet 交互并控制其执行的基本级机制。\n\n这些方法也被称为生命周期方法，因为浏览器或\
  \ applet 查看器会在 applet 生命周期的不同阶段自动调用它们。总共有五个生命周期方法：\n\n*   `public void init()`\n\
  *   `public void start()`\n*   `public void stop()`\n*   `public void destroy()`\n\
  *   `public void paint(Graphics g)`\n\n这五个方法中的四个：`init()`、`start()`、`stop()` 和 `destroy()`\
  \ 是定义在 `applet` 类中的。\n\n`paint()` 是由 `Component` 类定义的；它提供了所有这些方法的默认实现。Applet 不需要重写它们没有用到的方法。然而，非常简单的\
  \ applet 不需要定义它们。\n\n### Applet 的初始化与终止\n\n当 applet 开始运行时，会按顺序调用以下方法：\n1. `init()`\n\
  2. `start()`\n3. `paint()`\n\n当 applet 终止时，会发生以下序列的调用调用：\n4. `stop()`\n5. `destroy()`\n\
  \n### `init()` 方法\n\n这是第一个被调用的方法。在这里我们应该初始化变量并为其他初始化活动编写代码。该方法在 applet 生命周期周期内仅被调用一次，紧接实例化之后。\n\
  \n### `start()` 方法\n\n`start()` 方法在 `init()` 之后被调用。它还用于在 applet 停止后重新启动它。`init()`\
  \ 在 applet 第一次加载时调用一次，而 `start()` 在每次 applet 的 HTML 文档显示在屏幕上时被调用。因此，如果用户离开网页后返回，`start()`\
  \ 会被调用。\n\n### `paint()` 方法\n\n`paint()` 在 `init()` 和 `start()` 之后被调用，当 applet 开始执行。每当\
  \ applet 需要重绘时，`paint()` 方法都会被调用。这种情况可能由于多种原因发生：例如窗口被覆盖，或者 applet 窗口被最小化后恢复。\n\n\
  ### `stop()` 方法\n\n`stop()` 方法在浏览器离开包含 applet 的文档时被调用。当调用 `stop()` 时，applet 不可见。我们应该在\
  \ `stop()` 中暂停那些不需要运行的线程，当不可见。\n\n### `destroy()` 方法\n\n`destroy()` 方法在环境确定 applet\
  \ 需要从内存中完全移除时被调用。此时，我们应该释放 applet 可能使用的资源。`stop()` 方法总是在 `destroy()` 之前调用。\n\n示例\
  \ 1：一个背景颜色设置为青色、前景颜色设置为红色并显示消息的简单 applet，它展示了 `init()`、`start()` 和 `paint()` 方法在\
  \ applet 开始时的调用顺序。\n\n```java\nimport java.awt.*;\nimport java.applet.*;\n/*<applet\
  \ code=\"App2\" width=500 height=100></applet>*/\nclass App2 extends Applet {\n\
  \    String msg=\"\";\n    public void init() {\n        System.out.println(\"Inside\
  \ init\");\n        setBackground(Color.cyan);\n        setForeground(Color.red);\n\
  \        msg = \"Inside init --\";\n    }\n    public void start() {\n        System.out.println(\"\
  Inside start\");\n        msg += \"start --\";\n    }\n    public void stop() {\n\
  \        System.out.println(\"Inside Stop\");\n        msg += \"stop --\";\n   \
  \ }\n    public void paint (Graphics g) {\n        System.out.println(\"Inside paint\"\
  );\n        msg += \"Inside paint --\";\n        g.drawString(msg,10,30);\n    }\n\
  \    public void destroy() {\n        System.out.println(\"Inside destroy\");\n\
  \    }\n}\n```\n\n输出：\n![](img/image01262.jpeg)\n\n### 动态 Applet\n\nApplet 窗口中显示的输出可以是动态的。例如，我们可以显示一个移动横幅。Applet\
  \ 还可以用于诸如通过从服务器获取显示比分和其他统计数据；股票价格等应用程序。\n\n1.3：以下示例展示了一个移动横幅。它使用 `repaint()` 方法来刷新显示。该\
  \ applet 在 applet 窗口上从右向左滚动消息。由于消息的滚动是一项重复任务，它由一个 applet 启动时创建的独立线程来执行。此程序还演示了可以在\
  \ `stop()` 方法中释放资源，并在 `start()` 方法中获取。\n\n```java\nimport java.awt.*;\nimport java.applet.*;\n\
  /*<applet code=\"App3\" width=500 height=100></applet>*/\nclass App3 extends Applet\
  \ implements Runnable {\n    String msg=\"A Simple Moving Banner.\";\n    Thread\
  \ t = null;\n    boolean stopFlag;\n    public void init () {\n```\n\n\n\n\n```java\n\
  {\n    setBackground(Color.cyan);\n    setForeground(Color.red);\n}\npublic void\
  \ start()\n{\n    t=new Thread(this);\n    stopFlag = false ;\n    t.start ();\n\
  }\npublic void stop()\n{\n    stopFlag=true;\n    t=null;\n}\npublic void paint(Graphics\
  \ g)\n{\n    g.drawString(msg, 50, 30);\n}\npublic void run()\n{\n    for (;;) {\n\
  \        repaint();\n        try {\n            Thread.sleep(50);\n        } catch\
  \ (InterruptedException e) {\n            System.out.println(e);\n        }\n  \
  \      msg = msg.substring (1) + msg.charAt(0);\n        if (stopFlag)\n       \
  \     break;\n    }\n}\n```\n!image0263.jpeg\n\n### 使用状态窗口\n\n除了在窗口中显示信息外，applet（小程序）还可以向运行它的浏览器状态窗口或\
  \ applet 状态窗口输出消息。要做到这一点，可以调用 `showStatus( )` 并传递我们想要显示的字符串。状态窗口是向用户提供 applet 中正在发生的情况反馈、建议选项或报告某些类型错误的好地方。状态窗口是一个极佳的辅助，因为它为我们提供了输出关于\
  \ applet 信息的简单方法。\n\n#### 示例 1.4：以下演示了如何使用状态窗口\n\n```java\nimport java.awt.*;\n\
  import java.applet.*;\n/*<applet code=\"App4\" width=500 height=100></applet*/\n\
  public class App4 extends Applet\n{\n    public void init( )\n    {\n        setBackground(Color.cyan);\n\
  \    }\n    public void paint(Graphics g)\n    {\n        g.drawString(\"This is\
  \ in the applet window\",10,20);\n        showStatus(\"This is shown in the status\
  \ window\");\n    }\n}\n```\n!image01264.jpeg\n\n### HTML 的 APPLET 标签\n\n`APPLET`\
  \ 标签用于从 HTML 文档和 `appletviewer` 启动 applet。`appletviewer` 会在单独窗口中执行它找到的每个 `APPLET`\
  \ 标签；而像 Netscape Navigator 和 Internet Explorer 这样的浏览器允许在单个页面上运行多个 applet。\n\n标准\
  \ `APPLET` 标签的语法为：\n\n```html\n< APPLET\n    CODE=applet class\n    CODEBASE=codebase\n\
  \    ALT=alternate\n    NAME=appletinstance\n    WIDTH=pixels\n    HEIGHT=pixels\n\
  \    ALIGN=alignment\n    SPACE=vertical space in pixels\n    HSPACE=horizontal\
  \ space in pixels>\n<PARAM NAME=attributeName-1 VALUE=Attribute Value-1>\n<PARAM\
  \ NAME=attributeName-2 VALUE=Attribute Value-2>\n-------------\n<PARAM NAME=attributeName-N\
  \ VALUE=Attribute Value-N>\n………在没有 Java 的情况下 HTML………\n</APPLET>\n```\n\n- `CODE`:\
  \ `CODE` 是一个性属性，提供包含我们 applet 编译类的文件名。该文件相对于 applet 的 `CODEBASE`，即 html 文件所在的目录，或者如果设置了\
  \ `CODEBASE` 则由该属性指定的目录。\n- `CODEBASE`: `CODEBASE` 是一个可选属性，指定 applet 可执行类所在的基础 URL，即\
  \ `CODE` 标签所在的目录。如果未指定该属性，则使用 HTML 文档所在的目录。\n- `ALT`: `ALT` 标签是一个可选属性，用于指定当浏览器不支持\
  \ applet 时应显示的短文本消息。这是为不支持 applet 的浏览器提供的替代 HTML。\n- `NAME`: `NAME` 是一个可选属性，用于指定\
  \ applet 实例名称。applet 必须命名，以便页面上的其他 applet 通过名称找到它们并与之通信。要通过名称获取 applet，使用 `getApplet()`，它由\
  \ `Applet Context` 接口定义。\n- `WIDTH` 和 `HEIGHT`: `WIDTH` 和 `HEIGHT` 是 applet 显示区域的像素大小。\n\
  - `ALIGN`: `ALIGN` 是一个指定 applet 对齐方式的属性。该属性的处理方式与 HTML `IMG` 标签相同，可能的值：LEFT, RIGHT,\
  \ BOTTOM, MIDDLE, BASELINE, TEXTTOP, ABSMIDDLE 和 ABSBOTTOM。\n- `SPACE` 和 `HSPACE`:\
  \ 这些是可选属性，`SPACE` 指定 applet 上下的空间（像素）。`HSPACE` 指定 applet 左右的空间（像素）。它们的处理方式与 `IMG`\
  \ 标签的 `SPACE` 和 `HSPACE` 属性相同。\n\n### PARAM 标签\n\n`PARAM` 标签允许我们在 HTML 页面中指定 applet\
  \ 特定参数。applet 通过 `getParameter()` 方法访问这些属性。`PARAM` 标签有两个属性：`NAME` 和 `VALUE`。\n\n\
  #### 示例 16.5 此示例演示了如何从 HTML 页面向 Applet 传递参数\n\n```java\nimport java.awt.*;\nimport\
  \ java.applet.*;\n/*<applet code=\"App5\" width=500 height=100>\n<param name=\"\
  fontName\" value=\"Arial\">\n<param name=\"fontSize\" value=\"30\">\n</applet>*/\n\
  public class App5 extends Applet\n{\n    String fName;\n    int fSize;\n    public\
  \ void init( )\n    {\n        fName = getParameter(\"fontName\");\n        if (fName\
  \ == null)\n            fName = \"Courier\";\n        fSize = Integer.parseInt(getParameter(\"\
  fontSize\"));\n        Font f1= new Font(fName, Font.PLAIN, fSize);\n        setFont(f1);\n\
  \    }\n    public void paint (Graphics g)\n    {\n        g.drawString (\"Font\
  \ Name : \" + fName, 0, 25 );\n    }\n}\n```\n\n\n\n\n```java\ng.drawString (\"\
  Font Size : \" + fSize, 0, 50 );\ng.drawString (\"Hello world\", 0,75);\n```\n\n\
  ![](img/image01265.jpeg)\n\n## 获取 DocumentBase 和 CodeBase:\n\n通常，我们会创建需要显式加载媒体和文本的\
  \ applet。Java 允许 applet 从启动 applet 的 HTML 文件所在的目录（文档基，document base）以及加载 applet\
  \ 类文件的目录（代码基，code base）加载数据。\n\n这些目录以 `URL` 对象的形式返回。它们可以与命名我们要加载的文件的字符串拼接。要实际加载另一个文件，我们将使用由\
  \ `Applet` 上下接口定义的 `showdocument()` 方法。\n\n### 示例 16.6 以下示例演示了如何在 applet 代码中获取文档基和代码基。\n\
  \n#### App6.java\n\n```java\nimport java.awt.*;\nimport java.applet.*;\nimport java.net.URL;\n\
  public class App6 extends Applet\n{\n    public void paint (Graphics g)\n    {\n\
  \        URL u1 = getCodeBase( );\n        g.drawString (\"Code base:-\" + u1, 10,20);\n\
  \        URL u2 = getDocumentBase();\n        g.drawString (\"Document base:-\"\
  +u2, 0,0);\n    }\n}\n```\n\n#### App6.html\n\n```html\n<html>\n<body>\n<applet\
  \ code=\"App6\" width=500 height=200></applet>\n</body>\n</</html>>\n```\n\n输出：\n\
  \n###Context 和 Document():\n\nJava 的应用之一是使用活动图像和动画提供一种图形化的网页导航手段，这比超文本使用的下划线更有趣。为了允许我们的\
  \ applet 将控制权转移到另一个 `URL`，我们必须使用由 `AppContext` 接口定义的 `showdocument()` 方法。\n\n`AppContext`\
  \ 是允许我们从 applet 的执行中获取信息的接口。当前执行的 applet 的上下文通过调用 applet 类定义的 `getContext()` 方法获取。在\
  \ applet 中，一旦我们获取了 applet 的上下文，就可以调用 `showDocument()` 方法将另一个文档引入视图。此方法没有返回值，并且在失败时不会抛出异常，因此请谨慎使用。有两个\
  \ `showDocument()` 方法：\n\n- `void showDocument(URL url)`：将正在查看的网页替换为给定的 `URL`。\n\
  - `void showDocument (URL url, String where)`：在浏览器窗口内的指定位置显示文档。`where` 的有效参数有：\n\
  \    - `\"_self\"`（在当前帧中显示）\n    - `\"_parent\"`（在父帧中显示）\n    - `\"_top\"`（在顶帧中显示），以及\n\
  \    - `\"_blank\"`（在新浏览器窗口中显示）\n\n### 示例 16.7 以下 applet 演示了 AppContext 和 showDocument\
  \ 的用法。执行时，它获取当前 applet 上下文并使用该上下文将控制权转移到名为 `A.html` 的文件。该文件必须与 applet 位于同一目录下。`Test.html`\
  \ 可以包含你喜欢的任何有效超文本。\n\n```java\nimport java.awt.*;\nimport java.applet.*;\nimport\
  \ java.net.*;\npublic class App7 extends Applet\n{ \n    AppContext ac;\n    URL\
  \ u1;\n    public void init()\n    {\n        setBackground(Color.cyan);\n    }\n\
  \    public void start()\n    {\n        ac = getContext();\n        u1 = getCodeBase();\n\
  \        try\n        {\n            Thread.sleep(300);\n            ac.showDocument(new\
  \ URL(u1 + \"A.html\"),\"_blank\");\n        }\n        catch(URLException e)\n\
  \        {\n            showStatus(\"Invalid URL\");\n            e.printStackTrace();\n\
  \        }\n        catch(InterruptedException e) \n        { \n            showStatus(\"\
  Invalid URL\");\n            e.printStackTrace();\n        }\n    }\n    public\
  \ void paint (Graphics g)\n    {\n        g.drawString(u1+\"A.html\",20,20);\n \
  \       try\n        {\n            Thread.sleep(300);\n        }\n        catch(InterruptedException\
  \ e)\n        {\n            System.out.println(e);\n        }\n    }\n}\n```\n\n\
  #### App7.html\n\n```html\n<html>\n<head>\n<Title>AppContext</Title>\n</head>\n\
  <body>\n<applet code=\"App7\" width=200 height=200></applet>\n</body>\n</html>\n\
  ```\n\n#### A.html\n\n```html\n<html>\n<head>\n<title>New Page</title>\n</head>\n\
  <body bgcolor=blue text=red>\n<h1>matrix</h1>\n</body>\n</html>\n```\n\n### 示例 16.8\n\
  \n```java\nimport java.applet.*;\nimport java.awt.*;\nimport java.awt.event.*;\n\
  /*<Applet code=\"CopyApp\" width=500 height=200></applet>*/\npublic class CopyApp\
  \ extends Applet implements ActionListener\n{\n    TextField tf1,tf2;\n    Button\
  \ b1;\n    public void init()\n    {\n        setForeground(Color.red);\n      \
  \  Font f1=new Font(\"Arial\", Font.BOLD+Font.ITALIC,20);\n        tf1=new TextField();\n\
  \        tf2=new TextField();\n        tf1.setFont(f1);\n        tf2.setFont(f1);\n\
  \        b1=new Button(\"Copy\");\n        b1.addActionListener(this);\n       \
  \ b1.setFont(f1);\n        add(tf1);\n        add(tf2);\n        add(b1);\n    }\n\
  \    public void paint(Graphics g)\n    {\n        g.drawString(\"Matrix\",0,150);\n\
  \    }\n    public void actionPerformed(ActionEvent ae)\n    {\n        String s1=tf1.getText();\n\
  \        tf2.setText(s1);\n    }\n}\n```\n\n\n\n\n\n![](img/image01266.jpeg)\n\n\
  ## 16.9 使用 Applet 计算两个数字之和\n\n```java\nimport java.applet.*;\nimport java.awt.*;\n\
  import java.awt.event.*;\n/*<applet code = \"SumApplet\" width=400 height=400></applet>\
  \  */\npublic class SumApplet extends Applet implements ActionListener\n{\n    TextField\
  \ tf1,tf2,tf3;\n    Label l1,l2,l3;\n    Button b1;\n    public void init()\n  \
  \  {\n        setLayout(new GridLayout(4,2));\n        l1 = new Label(\"No. 1\"\
  );\n        l2 = new Label(\"No. 2\");\n        l3 = new Label(\"Result\");\n  \
  \      tf1 = new TextField(8);\n        tf2 = new TextField(8);\n        tf3 = new\
  \ TextField(8);\n        b1 = new Button(\"Sum\");\n        b1.addActionListener(this);\n\
  \        add(l1);add(tf1);\n        add(l2);add(tf2);\n        add(l3);add(tf3);\n\
  \        add(b1);\n    }\n    public void actionPerformed(ActionEvent ae)\n    {\n\
  \        Button abc = (Button)ae.getSource();\n        if(abc == b1)\n        {\n\
  \            int a,b,c;\n            a = Integer.parseInt(tf1.getText());\n    \
  \        b = Integer.parseInt(tf2.getText());\n            c = a + b;\n        \
  \    tf3.setText(String.valueOf(c));\n        }\n    }\n}\n```\n\n# 第 17 章：（抽象窗口工具包\
  \ - AWT）\n\n### 引言\nJava 提供了大量的内置类，帮助我们设计图形用户界面（GUI）。这些类大部分属于 `java.awt` 包，并统称为抽象窗口工具包（AWT）。\n\
  \n我们对 `MS-WORD`、`MS-EXCEL` 等软件非常熟悉。所有这些软件都有 GUI，即当我们运行这些软件时，可以看到图形用户界面。我们通过键盘或鼠标选择不同的选项来访问这些软件的各种功能。显示用户界面需要大量的编程工作。\n\
  \nAWT 中帮助设计图形用户界面的三个重要部分是：\n* 组件（Components）\n* 容器（Containers）\n* 布局管理器（Layout Managers）\n\
  \n以上所有内容在设计 GUI 中都起着重要作用。\n\n### 组件\n组件是 Java 创建 GUI 的构建块。组件是一个具有图形表示的对象，它可以显示在屏幕上并与用户交互。组件的示例包括典型图形用户界面中的按钮、复选框和滚动条。`java.awt.Component`\
  \ 类是非菜单相关 AWT 组件的抽象父类。`Component` 类也可以被直接扩展以创建轻量级组件。轻量级组件是不与原生不透明窗口相关的组件。\n\n某些组件类型（如按钮和滚动条）直接用于\
  \ GUI 控制。其他类型的组件（继承自 `Container` 类的）提供了特殊的组织方式。而像 `TextField`、`TextArea`、`List`\
  \ 等组件用于接受用户输入。`label` 是一种不同类型的组件，其目的仅仅是显示适当标签以识别其他组件。\n\nJava 的组件通过 `java.awt.Component`\
  \ 和 `java.awt.Menu` 组件父类的许多子类来实现。组织这些大量类的一种方法是将它们分为几类：\n* 可视组件\n* 容器组件\n* 菜单组件\n\
  \n### 组件层次结构\n下图显示了 AWT 的组件层次结构。\n![](img/image01267.jpeg)\n\n### 容器\n下图描述了容器的层次结构\n\
  ![](img/image01268.jpeg)\n\n所有基于窗口应用程序都始于屏幕上可见的顶层窗口。同样，所有基于 GUI 的 Java 应用程序也从顶层窗口开始，在\
  \ Java 术语中被称为顶层容器（top-level container）。\n\n容器也是 Java 组件，可以包含其他组件。组件只有通过将其添加到容器或将其放入容器内部，才能变得可见。\n\
  \n所有的 Java GUI 都存在于 `applet` 或 `Frame` 中。`applets` 和 `frames` 是 Java 中的两个顶层容器。\n\
  \n\n\n\n\n在 Java 中可以使用绝对定位，但并不建议这样做。`AWT` 设计初衷是使用相对定位。我们可以通过相对规范来指定组件布局，例如：组件将添加到上一个组件的右侧、组件将添加到某个其他组件的下方、组件将出现在顶部、组件的大小将设为容器宽度的\
  \ `1/4` 等。即使在不知道组件尺寸的情况下，这些规范也是非常有用的。\n\nJava 鼓励使用相对定位，因为它是平台无关的，相同的 GUI 可以在无需修改的情况下运行在各种平台上。\n\
  \n名为“布局管理器”（layout managers）的 Java 内置类负责将相对位置映射到实际/物理位置的任务。Java 支持许多类型的布局管理器，我们将讨论以下布局管理器：\n\
  \n1. `FlowLayout`\n2. `GridLayout`\n3. `BorderLayout`\n4. `CardLayout`\n5. `GridBagLayout`\n\
  \n### 使用布局管理器时的两个观察结果\n\n- 我们不需要承担指定每个组件精确位置和尺寸的负担。\n- 我们不再拥有指定每个组件精确位置和尺寸的权力。\n\
  \n### 为什么 Java 使用布局管理器？\n\n原因有两个：\n\n1. 理论上的原因在于，精确布局（即每个组件尺寸和位置的像素规范）是一项重复且经常执行的任务；因此，根据面向对象编程（OOP），布局功能应当封装在一个或多个类中以实现任务的自动化。显然，布局管理器消除了许多开发中的琐工作。许多程序员最初不喜欢布局管理器，但随着繁琐选择的消除，他们越来越欣赏它们。\n\
  \n2. 使用布局管理器的实际原因源于 Java 的平台无关性。在 Java 中，`AWT` 组件的行为借自运行 `JVM` 的底层硬件的窗口系统。因此，在 Macintosh\
  \ 上，`AWT` 按钮就像其他 Mac 按钮一样；在 Motif 平台上，Java 按钮看起来就像其他 Motif 按钮，以此此类推。这里的问题在于，按钮和其他组件在不同平台上实例化时具有不同的尺寸。\n\
  \n如果 Java 鼓励精确的像素级尺寸和定位，那么会有很多 Java GUI 在其源平台上看起来很精美，但在其他平台上看起来非常糟糕甚至无法使用。如上所述，布局管理器通过使用相对定位解决了这个问题。\n\
  \n### 布局策略\n\n每个 Java 组件都有 `preferred size`（首选尺寸）。`preferred size` 表达了组件希望有多大，前提是不与布局管理器发生冲突。`Preferred\
  \ size` 通常是渲染组件以使其在视觉上具有意义所必需的最小尺寸；例如，一个按钮的 `preferred size` 是其标签文本的大小，加上文本周围的一小圈空白边框，再加上标记按钮边界的阴影装饰，因此，按钮的首选尺寸是“恰好足够”。`Preferred\
  \ size` 取决平台，因为组件的边界装饰随系统而异。\n\n当布局管理器对其容器的子组件进行布局时，它必须平衡两个考量：\n(i) 布局策略和\n(ii)\
  \ 每个组件的 `preferred size`\n\n首要任务是执行布局策略。如果尊重组件的 `preferred size` 意味着违反了布局策略，那么布局管理器将覆盖组件的\
  \ `preferred size`。理解布局管理器意味着理解它将把组件放置在什么位置，以及它将如何处理组件的 `preferred size`。\n\n###\
  \ FlowLayout\n\n流布局管理器的功能封装在 `java.awt.FlowLayout` 类中。流布局管理器将组件排列在水平行中。它是面板（panels）和\
  \ Applet 程序（applets）的默认布局管理器类型。\n\n流布局管理器尽可能将多个组件放入第一行，并将其他组件移动到第二行。如果第二行没有留空间，组件将移动到第三行，依此类推。这与在文档中输入文字非常。当我们到达当前行的末尾时，下一个单词将移动到下一行，以此此类推。如果我们更改了文档的宽度或高度，整个文档将重新格式化。\n\
  \n组件始终按照它们被添加到容器的顺序从左到右出现。\n\n默认情况下，流布局管理器在水平和垂直方向上的组件之间留有五个像素的间隙。可以通过调用 `FlowLayout`\
  \ 构造函数的重载版本并传入所需的水平和垂直间隙来更改此默认值。\n\n在每一行内，组件间距均匀，且组件簇居中。簇的对齐方式（有时称为“对齐线”）可以通过向流布局构造函数传递参数来控制。可能的值有：\n\
  \n- `FlowLayout.LEFT`\n- `FlowLayout.CENTER`\n- `FlowLayout.RIGHT`\n\n#### 示例 17.1\n\
  \n```java\nimport java.awt.*;\nclass MyFrame1 {\n    public static void main(String\
  \ args[ ]) {\n        Frame f=new Frame();\n        FlowLayout flow=new FlowLayout();\n\
  \        f.setLayout(flow);\n        Label l1 = new Label(\"Name \");\n        f.add(l1);\n\
  \        TextField tf1=new TextField(\"Matrix\");\n        f.add(tf1);\n       \
  \ tf1.setBackground(Color.green);\n        tf1.setForeground(Color.red);\n     \
  \   Button b1 = new Button(\"ok\");\n        Font f1 = new Font(\"Arial\", Font.BOLD,\
  \ 4);\n        b1.setFont(f1);\n        f.add(b1);\n        f.setSize(500,100);\n\
  \        f.setVisible(true);\n    }\n}\n```\n注意：如果我们减小上述窗口的大小且三个组件无法放入单行内，则组件将从最后一个组件开始移动到下一行。\n\
  \n输出：\n![](img/image01269.jpeg)\n\n#### 示例 17.2\n\n```java\nimport java.awt.*;\n\
  public class MyFrame2 extends Frame {\n    public static void main (String args\
  \ [] ) {\n        MyFrame2 f=new MyFrame2();\n        f.setLayout(new FlowLayout(FlowLayout.CENTER));\n\
  \        System.out.println();\n        Label l1 = new Label(\"Name \");\n     \
  \   f.add(l1);\n        TextField tf1=new TextField(\"Sample\");\n        f.add(tf1);\n\
  \        tf1.setBackground(Color.green);\n        tf1.setForeground(Color.red);\n\
  \        Button b1=new Button(\"OK\");\n        b1.setFont(new Font(\"Serif\",Font.BOLD,24));\n\
  \        b1.setEnabled(false);\n        Dimension d = b1.getSize();\n        System.out.println(\"\
  Button Size :\" + d.width + \" \" + d.height);\n        f.add(b1);\n    }\n}\n```\n\
  \n\n\n\n```java\n// f.setResizable(false);\n// f.setUndecorated(true);\nf.setVisible(true);\n\
