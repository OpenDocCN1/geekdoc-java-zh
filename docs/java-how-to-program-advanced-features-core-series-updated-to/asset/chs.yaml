- "# Java 程序设计：高级特性（核心系列）更新至 Java 8\n\n\n\n![](img/cover01308.jpeg)\n\n\n![](img/image01208.jpeg)\
  \ \n\n\n![very-small-rose](img/image01209.jpeg) ![fractal-tree2](img/image01210.jpeg)![very-small-rose](img/image01209.jpeg)\n\
  \n\n## 献词\n\n“本书献给所有每天做出牺牲的人，特别是那些为了确保我们的自由与安全而做出牺牲的人。”\n\n非常感谢湿婆神 Lord Shiva 在生命中赋予我写作的技术和一切能力。\n\
  \n亲爱的父亲，谢谢你 baauji，通过你的榜教教会了我基于原则生活的生活的意义。\n\n亲爱的两位妈妈，谢谢你们向我真实地展示如何根据最重要的原则和无条件的爱去生活。\n\
  \n亲爱的兄弟姐妹+Priya，谢谢你，你的笑容点亮了我的每一天。你的热情让我的心歌唱。我爱你们所有人。\n\n我特别提到生活中那些帮助我度过悲伤的美丽面孔：\n\
  \n谢谢 Priyanka，你是我生命的意义，是我眼中的明珠，我对你的爱溢于言表。\n\n谢谢你们 Hem Zizu, Navneet, Aman(Rajjo)\
  \ Eminem - 你们是我的灵感，让我想起“为运动而唱”。\n\n关于作者\n\nHarry.H. Chaudhary 是一位在技术领域拥有多年经验的资深专家。他担任\
  \ IT 经理，并是知名的黑客主义者。他在计算机安全和编程领域有着深厚的造诣。他曾在全球多个社区中分享他的技术知识。\n\n\n\n\n\n跟随畅销 Java\
  \ 编程书籍作者 Harry H. Chaudhary 快速掌握 Java 编程的所有基础和高级特性（已售出超过 167,000 本！）。本 Java 指南从基础开始，通过数千行\
  \ Java 代码详细带你进入 Java 的进阶特性，我承诺这本书将让你成为 Java 专家级冠军。任何人都可以通过这本书学习到专家水平的 Java。\n\n\
  工程类专业的学生和新手开发者也可以使用这本书。这本书涵盖了所有计算机科学专业学位共同的核心大纲。如果你非常认真，请尽管通过这本终极 Java 书来成就自己。\n\
  \n这本 Java 书的主要目标不仅仅是提供 Java 编程知识，我遵循了一种模式，即针对每个 Java 主题通过清晰的理论解释和不同的 Java 复杂度来改进数千个代码问题的解决方案，你会为复杂的\
  \ Java 问题找到多种解决方案。\n\n## 特别之处\n\n在书中，我为开发者和新手详细涵盖并介绍了最新的 Java 8 特性的几个主题，例如：\n- `Lambdas`\n\
  - `Java 8 函数式接口`\n- `Java 8` 中的 `Stream` 和 `Time API`\n\n如果你读过这本书，你就知道会有什么样的体验：一种专为你大脑工作方式设计的视觉丰富的格式。如果你没读过，那你大有福了。你会发现为什么人们说它与你读过的任何\
  \ Java 书不同。\n\n学习一门新语言并非易事，尤其是对于像 `Java` 这样面向对象的编程语言时。你可能认为问题出在你的大脑上。它似乎有自己的主意，它并不总是想要吸收你被迫学习的那些枯燥的技术内容。事实是，你的大脑渴望新奇。\n\
  \n它不断地寻找、扫描，等待异常情况的发生。毕竟，它是为了帮助你生存而这样构建的。它将所有常规、平凡、无聊的内容过滤到背景中，以免干扰大脑的真正工作——记录重要的事情。你的大脑是如何知道什么是重要的？\n\
  \n## 第 1 章：Java 概述\n\n### 引言\n这本 `Java` 书不需要之前的编程经验。然而，如果你有 `C` 或 `C++` 编程背景，你将能够学得更快。\n\
  \n出于这个原因，本 Java 书对 `Java` 的几个关键特性进行了快速的详细概述。这里描述的内容将为你提供一个脚点，让你能够编写和理解简单且典型的程序。大多数讨论的主题将在后续章节中通过数千个实时的\
  \ Java 代码示例进行更详细的检查。\n\n正如我们所知，过去几年文档记录了这样一个事实：Web 不可挽回地重塑了计算的面貌，不愿掌握其环境的程序员将被遗留。以上是一个强有力的陈述，也是事实。\n\
  \n越来越多的应用程序必须接入 Web 接口。应用程序本身已不再重要，几乎通用的 Web 访问正在拉动、推动并诱导程序员为在线世界编程，而 `Java` 是许多人将用来实现此点的语言。坦率地说，精通\
  \ `Java` 对于专业程序员来说不再是一个选项，而是一项要求。这本书将帮助你掌握。\n\n`Java` 是由 Sun Microsystems 公司于 1991\
  \ 年开发的强大面向对象编程语言。`Java` 最初是为消费电子设备开发的，但后来转向互联网。现在 `Java` 已成为互联网广泛使用的编程语言。`Java`\
  \ 是一种平台中性的语言（机器无关）。由 `Java` 开发的程序可以运行在世界上任何硬件或任何操作系统上。\n\nSun Microsystems（甲文）于\
  \ 1995 年 5 月的一次大会议上正式宣布了 `Java`。通常情况下，此类事件不会引起太大关注。然而，由于对万维网的极大兴趣，`Java` 引起了商业界的立即关注。\n\
  \n`Java` 现在用于创建具有动态交互内容的 Web 页面，开发大型企业应用，增强万维网的功能。\n\n### Java 的需求\n`Java` 的开发是因为需要一种平台中性的语言，可以用于创建嵌入到各种消费电子设备中的软件，如微波炉和遥控器。用\
  \ `C` 和 `C++` 编写的程序是针对特定特定硬件编译的，该程序不会在任何硬件上运行。因此需要一种平台中性的语言。\n\n### Java 类库\n`Java`\
  \ 程序由所谓的“类”（classes）组成。“类”由“方法”（methods）组成，方法执行任务并在完成任务时返回信息。程序员指定编辑器中的文件应如何被保存，程序存储在次级存储设备（如磁盘）上。Java\
  \ 程序文件名以 `.java` 扩展名结尾。\n\n###典型环境的基础\nJava 系统通常由几个部分组成：环境、语言、应用程序接口 (`API`）和各种类库。接下来的讨论解释了典型的\
  \ Java 开发环境，Java 程序通常通过五个阶段执行。这些阶段是：编辑、编译、加载、验证和执行。随后的描述使用了标准的 `Java SE 7` 开发工具包\
  \ (`JDK 7`)，它由 Oracle 提供。\n\n如果你使用的是不同的 Java 开发环境，你可能需要遵循不同的程序来编译和执行 Java 程序。在这种情况下，请咨询你的编译器的文档以获取详情。\n\
  \n阶段 1 包含编辑文件。这是通过编辑器程序（通常称为编辑器）完成的。程序员使用编辑器输入 Java 程序，并在必要进行修正。\n\n\n\n\nJava 集成开发环境（IDE），例如用于\
  \ Java 社区版的 Forte、NetBeans、Borland 的 `JBuilder`、Symantec 的 Visual Cafe 以及 IBM 的\
  \ Visual Age，都内置了集成到编程环境中的编辑器。\n\n我们假设读者知道如何编辑文件。像 `Java` 这样的语言是面向对象的——在这样的语言中编程被称为面向对象编程（`OOP`），它允许设计人员将面向对象的设计实现为运行的系统。相反，`C`\
  \ 等语言是过程化编程语言，因此编程倾向于以操作为中心。\n\n在 `C` 中，编程单元是 `function`（函数）。在 `Java` 中，编程单元是 `class`（类），最终从中实例化对象（这是“创建”的形象术语）。`Java`\
  \ 类包含 `methods`（实现类的行为）和 `attributes`（实现类的数据）。\n\n`C` 程序员专注于编写 `functions`。执行某些共同任务的动作组被组成\
  \ `functions`，而 `functions` 又被组合成程序。数据在 `C` 中固然重要，但其观点是，数据的存在主要是为了支持 `functions`\
  \ 执行的操作。系统规范中的动词帮助 `C` 程序员确定实现该系统所需的 `functions` 集合。\n\n`Java` 程序员专注于创建自己的名为 `classes`（类）和\
  \ `components`（组件）的自定义类型。每个 `class` 包含数据以及操作这些数据的 `functions` 集合。`Java` 类的数据组件被称为\
  \ `attributes`。\n\n`Java` 类的 `function` 组件被称为 `methods`。就像 `int` 等内置类型的实例被称为 `variable`（变量）一样，自定义类型（即\
  \ `class`）的实例被称为 `object`（对象）。程序员使用内置类型作为构建自定义类型的“构建块”。\n\n`Java` 的重点在于 `classes`（我们从中创建对象）而不是\
  \ `functions`。系统规范中的名词帮助 `Java` 程序员确定用于创建对象并以实现系统的 `classes` 集合，这些对象将协作工作来实现系统。\n\
  \n`Classes` 之于 `objects` 就像蓝图之于房子。我们可以从一张蓝图建造许多房子，也可以从一个 `class` 实例化许多 `objects`。`Classes`\
  \ 也可以与其他 `classes` 建立关系。\n\n例如，在银行的面向对象设计中，“银行柜员” `class` 需要与“客户” `class` 关联。这些关系被称为关联（associations）。我们将看到，当软件被封装成\
  \ `classes` 时，这些 `classes` 可以在未来的软件系统中被重用。相关的 `classes` 组通常被封装成可重用的组件。\n\n你创建的每一个新\
  \ `class` 都有成为有价值的软件资产的潜力，你和其他程序员可以使用这些资产来加速并提高未来软件开发工作的质量——这是一个令人兴奋的可能性。\n\n##\
  \ Java 与 C、C++ 及 C# 的关系\n\n`Java` 从 `C` 处继承了语法，从 `C++` 处继承了面向对象的特性。它不是 `C++` 的增强版。`Java`\
  \ 既不向上兼容 `C++` 也不向下兼容。我想告诉你们的一点重要的一点是，`Java` 语言的设计并不是为了取代 `C++` 和 `C#`。另一种由微软开发的用于支持\
  \ `.NET` 框架的语言 `C#` 与 `Java` 关系密切，因为它们都共享 `C++` 和 `C` 风格的语法，支持分布式编程，并使用相同的对象模型。\n\
  \n## Java 的主要目标是实现 -\n\n### 1. 安全性：\n\n当我们使用兼容 `Java` 的网络浏览器时，不存在病毒感染的威胁。此外，也没有恶意程序从本地机器收集隐私信息（如信用卡号、银行账户余额和密码）的威胁。\n\
  \n`Java` 在网络应用程序和计算机之间提供了一个防火墙。\n\n### 2. 可移植性：\n\n`Java` 程序可以从一台计算机移植到另一台运行不同操作系统且具有不同硬件的计算机。\n\
  \n## Java 字节码\n\n`Java` 编译器的输出是 `bytecode`（字节码）而不是机器码（`.class` 文件）。`bytecode` 是一高度优化的指令集，旨在由\
  \ `Java` 运行时系统执行，该系统被称为 `JVM`（Java 虚拟机）。\n\n`JVM` 是解释 `bytecode` 的解释器。编译后的程序运行更快，但\
  \ `Java` 仍然使用解释器来实现可移植性，因此 `Java` 程序的运行速度稍慢。现在，通过 `Java` 编译器编译的程序可以在任何环境中运行，但每个平台都需要实现一个\
  \ `JVM`。`Java` 程序是被解释的。这也有助于提高安全性，因为每个 `Java` 程序的执行都受到 `JVM` 的控制。\n\n## JIT (即时编译)：\n\
  \n`JIT` 是 `JVM` 使用的翻译器，用于将 `bytecode` 翻译成实际的机器码。它不翻译整个 `bytecodes`，而是按需逐段翻译。\n\n\
  ## Java 的版本：\n\n**Java 1**\n* `JDK 1.0`\n* `JDK 1.1`\n\n**Java 2**\n* `JDK 1.2`\n\
  * `JDK 1.3`\n* `JDK 1.4`\n* `JDK 1.5` 或 `JDK 5`\n* `JDK 1.6` 或 `JDK 6`\n* `Java\
  \ 1.7` 或 `SE 7`\n* `Java 8` (2014 年 4 月)\n\n注释 1- `JDK` (Java 开发工具包)\n注释 2- 旧版 Java\
  \ 的许多特性在新版本中被弃用\n\n## Java 可以开发的应用程序类型：\n\n### 1. 独立运行应用程序\n\n独立应用程序是运行在我们本地计算机上的程序，类似于\
  \ `C` 或 `C++` 程序。\n\n### 2. Applet\n\n`applet` 是一种跨越网络传输并在客户端机器上兼容 Java 的网络浏览器（如\
  \ `Internet Explorer` 或 `Netscape Navigator`）中执行的小程序。`applet` 实际上是一个微型 Java 程序，通过网络动态下载。`applet`\
  \ 程序存储在 Web 服务器上，并在客户端机器请求时传输到客户端。`applet` 无法像独立应用程序那样执行。`applet` 只能通过嵌入 HTML 页面来执行，类似于声音文件、图像文件或视频片段。\n\
  \n### 3. Web 应用程序\n\n这些是运行在 Web 服务器上的程序。当我们在网络浏览器中指定 `URL`（通用资源定位符）访问网站时，网络浏览器会向特定的\
  \ Web 服务器发送请求。接收此请求后，服务器运行一个程序，该程序被称为 Web 应用程序。我们使用 `Java Servlets` 和 `JSP`（Java\
  \ 页面）编写此类程序。\n\n### 4. 分布式应用程序\n\n`Java` 应用程序被分成运行在单独机器上的小程序。这些程序中的对象可以相互通信。这些应用程序被称为分布式应用程序。这允许两个不同计算机上的对象远程执行过程。为此使用了\
  \ `RMI`（远程方法调用）。\n\n\n\n\n\n## 1. 简单\nJava 的语法几乎与 C 和 C++ 相似，因此熟悉 C/C++ 的程序员不需要从头开始学习语法。但\
  \ C/C++ 中许多过于复杂或导致歧义的特性在 Java 中被移除了。\n\n1. Java 不支持多继承，因为这个概念有点复杂并且可能导致歧义。\n2. Java\
  \ 不支持全局变量，这也导致了 C/C++ 程序中出现许多 bug。\n3. Java 不使用指针，也不允许指针运算，由于其固有的复杂性，这是 C/C++ 程序中大多数\
  \ bug 的根源。\n4. Java 不支持运算符重载，因为可能会导致混淆。\n5. Java 中没有垃圾值的概念。我们必须在使用变量之前初始化它们。\n\n\
  ## 2. 安全\nJava 程序运行在 `JVM`（Java 虚拟机）中，其他部分无法访问它们。这很大地提高了安全性。由于这一特性，Java 程序很少挂起。这与频繁挂起的\
  \ C/C++ 程序大不相同。Java 的安全模型由三个主要部分组成：\n\n1. 类加载器（Class loader）。\n2. 字节码验证器（Bytecode\
  \ Verifier）。\n3. 安全管理器（Security Manager）。\n\nJava 使用不同的类加载器从本地机器和远程机器加载类文件（可执行文件）。从远程机器加载的类（如\
  \ Applet 类）不允许读取或写入本地机器上的文件。这防止了恶意程序破坏本地文件系统。字节码验证器在类加载器完成工作后立即对字节码进行验证。它确保字节码是有效的\
  \ Java 代码。它几乎消除了 Java 程序执行某些恶意活动（如访问 `JVM` 外部的内存）的可能性。安全管理器控制许多关键操作，如删除文件、创建线程等。只有当\
  \ Java 程序具有足够的权限，这些操作才被允许，否则安全管理器将不允许这些操作并生成 `Security Exception`。\n\n## 3. 可移植\n\
  Java 程序是平台无关的。它们遵循“一次编写，随运行”的策略。为 Windows 平台编写的 Java 程序只需拷贝字节码（`.class` 文件）即可运行在任何其他平台（Unix、Linux、Sun\
  \ Solaris 等）上。不需要像 C/C++ 程序那样复制源代码并重新编译。这一特性使 Java 成为了一门强大的语言。只要机器上有 `JVM`，我们就可以在任何机器上运行字节码。`JVM`\
  \ 本身是依赖平台的，但它让 Java 代码变得与平台无关。实际上是 `JVM` 将字节码转换为机器码并执行它们。\n\n因此我们可以说 Java 是一种可移植的语言。另一个让\
  \ Java 高度可移植的特性是原生数据类型的长度固定，与平台无关。例如，Java 中的 `int` 始终是 4 字节。这与 C/C++ 不同，在 C/C++\
  \ 中，`int` 的大小在某些机器上可能是 2 字节，而在另一些机器上可能是 4 字节。\n\n## 4. 面向对象\nJava Almost 是一门纯面向对象的语言，但出于性能考虑，它支持原生数据类型如\
  \ `byte`、short、int、long、float、double、char、boolean`。\n\n## 5. 健壮\n大多数程序失败源于两个原因之一：\n\
  \n1. 内存管理。\n2. 运行时的异常情况。\n\n在设计语言时，目标之一是确保 Java 程序尽可能健壮，即它们很少失败。因此，Java 特别重视上述两个因素。\n\
  \n在 Java 中，内存的分配和释放由语言本身处理，这消除了由于 C/C++ 中动态内存管理功能引起的许多问题。Java 还支持面向对象的异常处理特性来处理运行时发生的异常情况。这使得\
  \ Java 程序在发生异常情况后能够恢复并继续执行。\n\n## 6. 多线程\nJava 的设计是为了满足创建交互式网络化程序的现实世界需求。Java 提供了编写多线程程序的支持来实现这一目标。这允许程序员编写可以并发执行许多任务的程序。\n\
  \n例如，基于 GUI（图形用户界面）的应用程序可能正在监听用户事件并采取适当操作，另一个线程可能正在打印，另一个线程可能正在从网络上的某机器下载文件，这一切都是并发进行的。这导致了更好的性能和更高的\
  \ CPU 利用率。\n\n在其他语言中编写多线程程序也是可能的，但那仅通过使用 `System` 调用实现的，而在 Java 中，可以通过语言自身的特性来实现。\n\
  \n## 7. 体系中立\n程序员面临的主要问题之一是，无法保证如果我们今天写了一个程序，它明天是否还能运行——即使在同一台机器上。操作系统的升级、处理器升级以及核心系统资源的更改都可能导致程序发生故障。但\
  \ Java 程序的目标是“一次编写，随处运行”。\n\n## 8. 解释型与高性能\nJava 程序是解释执行的，但与其他解释器相比，它们的运行速度仍然很快。\n\
  \n## 9. 分布式\nJava 是为互联网的分布式环境设计的。Java 为此内置了对各种基于 TCP/IP 协议的支持。事实上，使用使用 `URL` 访问资源类似于访问本地机器上的文件。Java\
  \ 还具有远程方法调用（Remote Method Invocation）功能，这与远程过程调用（RPC）类似。这允许不同计算机上的对象远程执行过程。Java\
  \ 为此提供了内置 API，称为 `RMI`。\n\n## 10. 动态\n每个 Java 类都是一个独立的执行单元。类只有在需要时才会被加载。Java 绑定方法的默认机制也是动态的（运行时绑定）。\n\
  \n## 运行独立的 Java \n\n当 C 或 C++ 程序被编译时，它被直接翻译成机器码。\n\n\n\n\n\n## 执行步骤\n\n### 步骤 2\n\
  输入 `CD \\ JAPRG` 并按回车\n\n### 步骤 3\n输入 `Edit Sum.Java` 并按回车\n\n### 步骤 4\n输入 Java\
  \ 程序并点击 `FileSave` 然后点击 `FileExit`\n\n### 步骤 5\n输入 `javac Sum.Java` 并按回车编译。这将创建一个\
  \ `Sum.class` 文件。该文件被称为字节码。\n\n### 步骤 6\n输入 `java Sum` 并按回车运行。这将调用 `JVM`。\n\n###\
  \ 步骤 7\n输入 `Exit` 然后按回车退出命令提示符。\n\n**注意**：我们也可以通过上述步骤使用记事本运行 Java 程序，但我们将使用记事本代替\
  \ `Edit` 命令。输入 Java 程序后，在另存为对话框中选择“所有文件”，然后将其保存到文件夹 `C:\\JAVAPRG`。要编译和运行，我们需要遵循上述步骤。\n\
  \n---\n\n## Java 程序语法\n\n```java\nclass <class name> {\n    public static void main(String\
  \ args[]) or (String [] args) {\n        // - - - - - - - -\n    }\n}\n```\n\n---\n\
  \n## 第一个 Java 程序 - 两个数字相加 (Sum.Java)\n\n```java\nclass Sum {\n    public static\
  \ void main(String args[]) {\n        int a,b,sum;\n        a = 5;\n        b =\
  \ 6;\n        sum = a + b;\n        System.out.print(\"Sum is \" + sum);\n    }\n\
  }\n```\n**输出**：Sum is 11\n\n---\n\n## 示例 2 程序 - 交换两个数字 (Swap.Java)\n\n```java\n\
  class Swap {\n    public static void main(String args[]) {\n        int a=5,b=7;\n\
  \        t = a;\n        a = b;\n        b = t;\n        System.out.print(\"After\
  \ Swap Values are \" + a +\",\" + b);\n    }\n}\n```\n**输出**：After Swap Values are\
  \ 7,5\n\n---\n\n## 概念\n\n### 注释\n有 3 类型的注释：\n- 单行注释：`//`\n- 多行注释：`/* */`\n- 文档注释：`/**\
  \ ... */`\n\n### 程序规则\n- 每个 Java 程序都必须包含一个类。在 Java 中，`main()` 方法只能定义在类内部。\n- 源文件可以包含任意数量的类或接口定义，但最多只有一个公共类或接口。\n\
  - 源文件可能包含也不包含带有 `main()` 方法的类，但独立的 Java 程序始终从 `main()` 方法开始执行。想要开始执行的类必须在其中定义了 `main()`\
  \ 方法。\n- `main()` 方法必须具有以下签名：`public static void main(String args[])`\n- 关键字 `public`\
  \ 表示该方法可以从任何地方访问。`main()` 方法必须声明为 `public`，因为它是由代码调用的，而这些代码是 `JVM` 的且位于包含 `main()`\
  \ 方法的类之外。\n- 关键字 `static` 表示 `main()` 是一个类方法，可以在不创建任何对象的情况下调用，对象的创建只发生在 `main()`\
  \ 方法内部。\n- 在 `main()` 方法前的 `void` 关键字表示它不返回任何值。\n- `main()` 方法接收一个参数，即 `String`\
  \ 数组。数组的每个元素代表一个命令行参数。\n- `System` 是一个预定义的类，提供对系统的访问，`out` 是连接到控制台的输出流。`print()`\
  \ 方法可显示任何类型的信息。\n\n### Java 程序的结构\n所有 Java 源文件必须以 `.java` 结尾。Java 是一种大小敏感的语言。注意在上面的程序中，类\
  \ `Sum` 和 `System` 的首字母是大写的。最好使用与类相同的文件名保存 Java 程序，但这不是强制的。不过如果类被声明为 `public`，则必须将类保存到与类同名的文件中。一个文件只能包含一个公共类，但可以包含多个非公共类。如果文件包含多个类，则每个类被放在以类名命名的、使用\
  \ `.class` 扩展名的独立文件中。\n\n- **文档部分**：文档部分包含一组注释行，提供了程序名称、作者以及程序员可能在以后阶段参考的其他细节。注释解释了算法的原理和内容。除了单行、多行注释外，Java\
  \ 还使用了第三种风格的注释 `/**...*/`，即文档注释。\n- **包声明**：源文件最多有一个包声明。如果存在包声明，它必须是 Java 程序中的第一个语句。只有注释可以出现在包声明之前。\n\
  - **导入语句**：源文件可以有零个或多个导入语句。导入语句就像 C/C++ 中的 `#include`。如果存在，所有导入语句必须位于包声明之后、类/接口定义之前。\n\
  - **接口语句**：接口（Interface）类似于类，但它包含一组方法声明。这也是一个可选部分，仅当我们希望在程序中实现多继承特性时才使用。\n- **不包含\
  \ main 方法的类定义**：Java 程序可以包含多个类定义。类是 Java 程序中主要且基本的元素。这些类用于映射现实世界问题的对象。\n- **包含 main\
  \ 方法的类定义**：由于每个独立的 Java 程序都需要 `main` 方法作为起点，因此该类是 Java 程序的组成部分。一个简单的 Java 程序可能只包含这部分。`main`\
  \ 方法创建各种类的对象并建立它们之间的通信。当 `main` 执行结束时，程序终止并将控制交回操作系统。\n\n### 垃圾回收\nJava 对象的内存分配是完全动态的，但\
  \ Java 不支持像 C/C++ 那样的指针算术。每当我们运行 Java 程序时，`JVM` 也会在后台运行另一个名为 `Garbage Collector`（垃圾回收器）的程序（线程）。垃圾回收器会检查\
  \ Java 对象。当 Java 对象不再被使用时，会被垃圾回收器回收，即为对象的内存被加入空闲内存池/堆并可以重复使用。这在很大程度上简化了程序员的任务，消除了许多由于不当使用指针算术和显式释放内存等功能导致的错误。\n\
