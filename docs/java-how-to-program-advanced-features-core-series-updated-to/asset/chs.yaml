  \n`java SumCmd 5 6`\n\n**输出：** \n```\nSum is 11\n```\n\n### 示例 4.8 对从命令行输入的数组进行排序的程序。\n\
  \n```java\nclass SortCmd {\n    public static void main(String args[]) {\n     \
  \   int n=args.length;\n        int a[ ]=new int[n];\n        //将 args 数组复制到 a 数组\n\
