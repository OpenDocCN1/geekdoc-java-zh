  \ `removeListener()` 方法并传入要移除的监听器从组件的监听器列表中移除监听器。例如，代码通过 `btn.removeActionListener(al)`\
  \ 从按钮中移除监听器 `al`。\n\n## 处理事件\n\n### Example 18.5\n\n```java\nimport java.awt.*;\n\
