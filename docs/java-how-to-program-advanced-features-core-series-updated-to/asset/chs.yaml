  \ ![11](img/image01212.jpeg)\n\n![STAR-LOGO-2013](img/image01213.jpeg)\n\n# 第 ∞\
  \ 18 章\n## AWT 事件简介\n\n### 序言 -\n\n当一个普通的 Java 程序（非 GUI 的）需要输入时，它会提示用户并调用某些输入方法，例如\
  \ `readline()`，也就是说交互是由程序发起的。这并不是基于 GUI 的程序的行为方式。是由用户发起与程序的交互，而不是由程序发起动作。\n\n例如，在文字处理软件中，用户通过点击不同的按钮来启动动作，这产生一个事件并执行某些代码，相应地发生某些操作。点击保存按钮将调用将内容保存到文件的方法。\n\
  \n| 接口 | 事件(方法) | 类 | 方法 |\n| :--- | :--- | :--- | :--- |\n| `ActionListener` |\
  \ `actionPerformed()` | `ActionEvent ae` | `getSource` |\n| `ItemListener` | `itemStateChanged()`\
  \ | `ItemEvent ie` | `getItem` |\n| `AdjustmentListener` | `adjustmentValueChanged()`\
  \ | `AdjustmentEvent ae` | `getAdjustable()` |\n| `MouseListenerMouseAdapter` |\
  \ `mouseEnteredmouseExitedmouseClickedmousePressedmouseReleased` | `MouseEvent me`\
  \ | `getX()getY()getPoint()getClickCount()getButton()getModifiersEx()getModifiersExText()`\
  \ |\n| `MouseMotionListenerMouseMotionAdapter` | `mouseMovedmouseDragged` | `MouseEvent\
  \ me` | 同上 |\n| `KeyListenerKeyAdapter` | `keyTypedkeyPressedkeyReleased` | `KeyEvent\
  \ ke` | `getKeyChar()getKeyCode()` |\n| `FocusListenerFocusAdapter` | `focusGainedfocusLost`\
  \ | `FocusEvent fe` | `getSource()` |\n| `WindowListenerWindowAdapter` | `windowOpendwindowClosingwindowClosedwindowActivatedwindowDeactivatedwindowIconifiedwindowDeiconified`\
  \ | `WindowEvent we` | `getWindow()` |\n\nJava 使用事件委托模型进行事件处理。在事件委托模型中，可以告诉组件，当组件产生特定类型的事件时，应该通知哪个对象。\n\
  \n如果组件对某种类型的事件不感兴趣，那么该类型的事件将不会被传播。委托模型基于以下核心概念：\n\n*   事件类（Event classes）。\n*  \
  \ 事件监听器（Event listeners）。\n*   适配器（Adapters）。\n\n#### 事件类：\n\n点击按钮会产生一个事件。该事件关联有许多信息，例如：时间、产生事件的组件、发生点击点的坐标等。\n\
  \n这些信息被放在一个事件类中。这个概念与异常处理类似。每当发生异常时，都会创建一个相应异常类的对象并将所有异常相关信息放入此对象中。\n\n我们拥有事件类的层次结构，这与异常类的层次结构有些相似。每当发生某些事件时，会被事件处理机制检测到，该机制创建相应事件类的对象并将所有事件相关信息放入其中。\n\
  \n#### 事件监听器：\n\n事件监听器负责在事件发生时采取适当的动作。事件监听器是一个对象，组件将处理特定类型事件的任务委托给了该对象。\n\n当组件接收输入时，会构造一个相应类型的事件，然后该事件作为参数传递给监听器的方法调用。监听器必须实现包含该事件处理方法的接口。\n\
  \n我们可以将事件监听器与处理异常的 `catch` 块进行比较。我们需要提供一个与要处理的异常相对应的 `catch` 块。同样，如果我们想处理由某个组件生成的事件，我们需要提供相应的监听器。\n\
  \n监听器与组件相关联。不同的事件有不同的监听器。当事件发生时，会调用相应的监听器方法，并将事件对象作为参数传递。\n\n#### 适配器：\n\n在语言中定义的监听器只是接口。我们需要提供相应监听器的实现。某些监听器具有\
  \ 2 个或更多方法。\n\n为了实现一个具有多个方法的监听器，即使我们只对一个方法感兴趣，也需要提供所有方法的实现。适配器类为这个问题提供了解决方案。\n\n\
  适配器类提供了监听器所有方法的空实现（dummy implementation）。这有助于减少编程工作。如果我们只想使用包含 5 个方法的监听器类中的一个方法，只需简单的扩展适配器类并重写所需的方法。\n\
  \n#### 事件层次结构：\n\nAWT 拥有定义良好的事件层次结构。通常，事件层次结构中叶子节点对应的类代表实际事件。而非叶子节点的类则作为基类并封装。\n\
  \nAWT 事件层次结构在图中所示。\n\n![](img/image01290.jpeg)\n\n##### java.util.EventObject 类：\n\
  \n这是所有事件类的顶层父类。它是一个非常通用的类，有一个感兴趣的方法，返回产生事件的对象。\n\n`Object getsource()`\n\n#####\
  \ java.awt.AWTEvent 类：\n\n`EventObject` 的一个子类是 `java.awt.AWTEvent`，它是所有事件的父类。同样，只有一个感兴趣的方法，返回事件的\
  \ ID。\n\n`int getID()`\n\n事件的 ID 是一个指定确切性质的 int。例如，`MouseEvent` 类的实例可以表示七种情况之一：点击、拖拽、进入、退出、按下、释放。这些可能性都通过\
  \ `MouseEvent.MOUSE_CLICKED`、`MouseEvent.DRAGGED` 等整数表示。\n\n`java.awt.AWTEvent`\
  \ 的子类代表组件生成的各种事件类型，包含了与触发活动相关的所有信息。\n\n非超类的事件类型（即实际由组件触发的类型）包括：\n\n1. `ActionEvent`：组件激活时产生，例如点击按钮、双击列表项以及在\
  \ `TextField` 中按回车产生。\n2. `AdjustmentEvent`：可调节组件（如滚动条）调整时产生。\n3. `ContainerEvent`：组件添加到或从容器中移除时产生。\n\
  4. `FocusEvent`：组件接收或失去输入焦点时产生。\n5. `ItemEvent`：从列表、选择框或复选框选择项目时产生。\n6. `KeyEvent`：键盘活动产生。\n\
  7. `MouseEvent`：鼠标活动产生。\n8. `MouseWheelEvent`：指示在组件中旋转鼠标轮的事件。\n9. `WindowEvent`：窗口活动产生（如最小化或恢复最大化等）。\n\
  10. `TextEvent`：文本组件被修改时产生。\n\n##### java.awt.event 包：\n\n该包提供了用于处理 AWT 组件触发的不同类型事件的接口和类。事件由事件源触发。事件监听器向事件源注册以接收特定类型事件的通知。\n\
  \n该包定义了事件和事件监听器，以及事件监听器适配器，后者是简化编写事件监听器的便利类。\n\n#### 事件监听器接口：\n\n每个事件类都有对应的监听器接口并定义了一个或多个方法。常用的监听器接口将在后续章节中描述。\n\
  \nAction 监听器接口：\n\n\n\n\n\n这是用于接收动作事件的监听器接口。感兴趣处理动作事件的类实现此接口，并使用该类创建的对象通过组件的 `addActionListener()`\
  \ 方法注册到组件中。当动作事件发生时，将调用动作监听器的 `action performed()` 方法，其方法签名如下如下：\n\n| 方法 | 描述 |\n\
  | :--- | :--- |\n| `void actionPerfomed (ActionEvent e)` | 当动作发生时调用。 |\n\n## AdjustmentListerner\
  \ 接口\n\n这是用于接收调整事件的监听器接口。\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `void adjustmentValueChanged\
  \ (Adjustment event e)` | 当滑块/滑动条的值改变时调用。 |\n\n## ContainerListener 接口\n\n这是用于接收组件添加到容器或从容器中移除时的事件的监听器接口。\n\
  \n### 方法\n| 方法 | 描述 |\n| :--- | :--- |\n| `void componentAdded ( containerEvent\
  \ e)` | 当组件添加到容器时调用。 |\n| `void componentRemoved(containerEvent e)` | 当组件从容器中移除时调用。\
  \ |\n\n## FocusListener 接口\n\n这是用于接收组件获得或失去焦点的事件的监听器接口。\n\n### 方法\n| 方法 | 描述 |\n\
  | :--- | :--- |\n| `void focusGained( focusEvent e)` | 当组件获得键盘焦点时调用。 |\n| `void\
  \ focusLost (focusEvent e)` | 当组件失去键盘焦点时调用。 |\n\n## ItemListener 接口\n\n这是用于接收项目状态事件的监听器接口。\n\
  \n### 方法\n`void itemStateChanged (ItemEvent e)`\n当用户选中或取消选择某项时调用。\n\n## keyListener\
  \ 接口\n\n这是用于接收键盘事件（按键输入）的监听器接口\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `void keyPressed(\
  \ KeyEvent e)` | 当按键被按下时调用。 |\n| `void key Released (KeyEvent e)` | 当按键被释放时调用。 |\n\
  | `void keyTyped (KeyEvent e)` | 当输入按键（按下并释放）时调用。 |\n\n## MouseListener 接口\n\n这是用于接收组件上鼠标事件（按下、释放、点击、进入、和退出）的监听器接口。\n\
  \n### 方法\n`void mouseClicked(MouseEvent e)`\n当在 `Component` 上点击鼠标按钮（按下并释放）时调用。\n\
  \n`void mouseEntered(MouseEvent e)`\n当鼠标进入组件时调用。\n\n`void mouseExited( MouseEvent\
  \ e)`\n当鼠标离开组件时调用。\n\n`void mousePressed( MouseEvent e)`\n当在组件上按下鼠标按钮时调用。\n\n`void\
  \ mouseReleased(MouseEvent e)`\n当在组件上释放鼠标按钮时调用。\n\n## MouseMotionListener\n\n这是用于接收组件上鼠标移动量事件（移动和拖拽）的监听器接口。\n\
  \n### 方法\n`void mouseDragged(MouseEvent e)`\n当在组件上按下鼠标按钮并拖动时调用。\n\n`void mouseMoved(MouseEvent\
  \ e)`\n当鼠标光标在组件上移动但未按下任何按钮时调用。\n\n## MouseWheelListener 接口\n\n这是用于接收组件上鼠标滚轮事件的监听器接口。\n\
  \n### 方法\n`void mouseWheelMoved(MouseEvent e)`\n当旋转鼠标滚轮时调用。\n\n## WindowListener\
  \ 接口\n\n当窗口的状态由于打开、关闭、激活或取消激活、最小化或恢复正常而改变时，会调用监听器对象中的相关方法，并将 `windowevent` 传递给它。\n\
  \n### 方法\n`void windowAcitated(WindowEvent e)`\n当窗口被设置为活动窗口时调用。\n\n`void windowClosed(WindowEvent\
  \ e)`\n当由于对窗口调用 `Dispose` 导致窗口关闭时调用。\n\n`void windowClosing(WindowEvent e)`\n当用户尝试从窗口系统菜单关闭窗口时调用。\n\
  \n`void Deactivated(WindowEvent e)`\n当窗口不再是活动窗口时调用。\n\n`void Deiconified(WindowEvent\
  \ e)`\n当窗口从最小化恢复到正常状态时调用。\n\n`void windowIconified(WindowEvent e)`\n当窗口从正常状态变为最小化状态时调用。\n\
  \n`void windowOpended (WindowEvent e)`\n当窗口第一次变为可见时调用。\n\n## 处理事件\n\n以下示例解释了如何处理点击按钮产生的\
  \ actionev 事件。\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass A1\
