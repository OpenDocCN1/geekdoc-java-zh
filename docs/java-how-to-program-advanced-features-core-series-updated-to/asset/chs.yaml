  ```\n\n## 抽象类与抽象方法\n\n我们已经通过将方法标记为 `final` 来确保该方法在子类中不会重定义。Java 允许我们做与此完全相反的事情。即我们可以指示某个方法必须在子类中重定义，从而使重写成为强制性。这是通过在方法定义中使用关键字\
  \ `abstract` 实现的。\n\n在某些情况下，我们可能想要一个只声明结构而不提供完整实现的父类。也就是说，有时我们希望创建一个只定义所有子类共享的通用形式的父类，让每个子类去填充细节。这种类决定了子类必须实现的方法性质。\n\
