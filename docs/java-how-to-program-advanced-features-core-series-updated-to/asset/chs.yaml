  \ 绘图\n\n### 引言\n许多类型的 `AWT` 组件（例如 `buttons` 和 `scrollbars`）的外观是由底层窗口系统规定的。其他组件类型，特别是\
  \ `applets`、`frames`、`panels` 和 `canvases`，没有内在外观。如果我们不仅仅将这些类作为容器使用，并希望我们的组件看起来足够用，那么我们必须提供实现组件外观的代码。\n\
  \n每个组件都关联着一个图形上下文（graphics context）。该图形上下文与组件相关的帧缓冲区相对应。\n\n我们可以使用 `Graphics Context`\
  \ 支持的方法在组件上进行绘图。绘制在 `Graphics context` 上的任何内容都会显示在组件上。\n\n在任何组件上进行绘图的正确方法是重写它的 `paint()`\
  \ 方法并提供恰当的代码。\n\n`paint()` 方法有一个类型为 `Graphics` 的参数，它代表组件的 `Graphics Context`。也可以在不使用\
  \ `paint()` 方法的情况下在组件上绘图，尽管不建议这种做法。\n\n### `paint()` 方法与图形上下文\n在下面的示例中，关于 `frame`\
  \ 的一个有趣点是，没有显式地调用 `paint()` 方法；该方法被提供了。环境似乎在正确的时刻成功调用了 `paint()`。\n\n在组件上进行绘图是通过调用图形上下文来实现的，图形上下文是\
  \ `Graphics` 类的实例。图形上下文知道如何渲染到单个目标。`Graphics Context` 可以渲染到的三种介质是：\n\n1.  `Components`（组件）。\n\
  2.  `Images`（图像）。\n3.  `Printers`（打印机）。\n\n任何类型的组件都可以与一个图形上下文关联。这种关联是永久的；上下文无法重新分配给新的组件。\n\
  \n`Buttons`、`Choices`、`Checkboxes`、`Labels`、`Scrollbars`、`TextFields` 和 `TextAreas`\
  \ 通常不需要程序员级别的渲染。大多数情况下，这些组件仅使用从组件父类继承的 `paint()` 版本。\n\n这个版本什么都不做；组件由底层窗口系统进行渲染。然而，有四类“空白”组件，它们没有默认外观，将显示为空矩形，除非它们被子类化并赋予\
  \ `paint()` 方法。\n\n\n\n\n\n这四个组件类是：\n\n* `Applet`\n* `Canvas`\n* `Frame`\n* `Panel`\n\
  \n### 示例 19.1：扩展 `Frame` 类并重写 `paint()` 方法以改变框架的的外观。\n\n```java\nimport java.awt.*;\n\
  \npublic class SimplePaint extends Frame\n{\n    public static void main (String\
  \ args[])\n    {\n        Frame f=new SimplePaint();\n        f.setSize(200,200);\n\
  \        f.setVisible(true);\n    }\n    public void paint (Graphics g)\n    {\n\
  \        g.setColor(Color.white);\n        g.fillRect(0,0,300,300);\n        g.setColor(Color.grey);\n\
  \        g.fillOval(30,30,50,50);\n    }\n}\n```\n\n输出：\n![](img/image0293.jpeg)\n\
  \n当我们子类一个 `component` 类并为子类提供它自己的 `paint()` 方法时，环境会在适当的时间调用该方法，并传入一个适当的 `Graphics`\
  \ 实例。\n\n### `graphics` 类支持的操作\n\n`graphics` 类（上下文）提供的四大类操作操作是：\n* 选择颜色。\n* 选择字体。\n\
  * 绘制与填充。\n* 裁剪。\n\n#### 选择颜色\n通过调用 `setColor()` 方法选择颜色。所需的参数是 `color` 类的实例。有 13\
  \ 种预定义的颜色，可以通过 `color` 类的 `static final` 变量访问（这些变量本身就是 `color` 类的实例。这让一些人感到不安，但\
  \ Java 并没有问题）。这些预定义的颜色有：\n\n1. `Color.black`\n2. `Color.blue`\n3. `Color.cyan`\n\
  4. `Color.darkGray`\n5. `Color.gray`\n6. `Color.green`\n7. `Color.lightGray`\n8.\
  \ `Color.magenta`\n9. `Color.orange`\n10. `Color.pink`\n11. `Color.red`\n12. `Color.white`\n\
  13. `Color.yellow`\n\n如果我们需要一个不在此列表中的颜色，可以自己构造。`color` 构造函数有几个版本，最简单：`Color(int\
  \ redLevel, int greenLevel, int blueLevel)`。这三个参数是原色在 0 到 255 范围内的强度级。颜色是加色的，这意味着它们像光一样混合，而不是像\
  \ `paint`（颜料）。\n\n* `new Color(0,0,0)`（无光）\n* `new Color(255,0,0)`（仅包含红色调）\n* `new\
  \ Color(255,255,255)`（所有颜色同时发光）\n\n下面的代码片段列出了 `paint()` 方法的第一部分，该方法将其图形上下文的颜色设置为浅绿色：\n\
  \n```java\npublic void paint(Graphics g)\n{\n    Color c= new Color(170,255,170);\n\
  \    g.setColor(c);\n}\n```\n在上述代码调用 `setColor()` 之后，所有的图形都将绘制成浅绿色（绿色），直到下一次调用 `setColor()`。调用\
  \ `setColor(0)` 不会改变已经绘制内容的颜色；它只影响后续操作。\n\n#### 选择字体\n设置图形上下文的字体就像设置颜色一样；后续的绘制操作将使用新字体，而之前绘制的字符串不受影响。在我们设置字体之前，必须先创建一个。`font`\
  \ 类的构造函数看起来如下：`Font(string fontName, int style, int size)`。\n\n第一个参数是字体名称。字体的可用性取决于平台。我们可以通过这样调用工具包上的\
  \ `getFontList()` 方法来获取以字符串数组形式返回的可用字体名称列表：\n\n```java\nString fontNames[]= Toolkit.getDefaultToolkit().getFontList();\n\
  ```\n\n有三个与平台无关且我们鼓励使用的字体名称：\n1. \"Serif\"\n2. \"Sansserif\"\n3. \"Monospaced\"\n\
  \n在 JDK 的 1.0.X 版本中，这些分别被称为 \"TimesRoman\"\"Helvetica\" 和 \"Courier\"。\n\n`style`\
  \ 参数可以发送给以下任何一个 `int` 常量：\n1. `Font.PLAIN`\n2. `Font.BOLD`\n3. `Font.ITALIC`\n\n\
  下面的代码片段将图形上下文 `gc` 的字体设置为 24 点加粗无衬线字体：\n\n```java\nFont f =new Font(\"SansSerif\"\
  ,Font.BOLD,24);\ngc.setFont(f);\n```\n\n我们可以通过传递样式的和来指定样式的组合，例如加粗斜体字体，如下所示：`Font.BOLD\
  \ + Font.ITALIC`。\n\n#### 绘制与填充\n`graphics` 类的所有渲染方法都为它们渲染的形状指定了像素坐标位置。每个组件都有自己的坐标系，原点位于组件的左上角，x\
  \ 向右增加，y 向下增加。下图显示了组件坐标系：\n\n![](img/image01294.jpeg)\n\n`graphics` 上下文类没有广泛的绘制方法（复杂的渲染由扩展\
  \ API 如 2d, 3d 和动画处理）。\n\n我们需要了解的图形上下文类中的方法有：\n\n| 方法 | 说明 |\n| :--- | :--- |\n\
  | `void drawLine(int x1,int y1, int x2, int y2)` | 在此图形中使用当前颜色在点 `(x1, y1)` 和 `(x2,\
  \ y2)` 之间绘制一条线。 |\n| `void drawRect(int x, int y, int width, int height)` | 绘制指定矩形轮廓。\
  \ |\n| `void fillRect(int x, int y, int width, int height)` | 填充指定矩形。 |\n| `void\
  \ drawOval(int x, int y, int width, int height)` | 绘制指定矩形边界的椭圆轮廓。 |\n| `void fillOval(int\
  \ x, int y, int width, int height)` | 使用当前颜色填充指定矩形边界的椭圆。 |\n| `void drawArc(int\
  \ x, int y, int width, int height, int startAngle, int arcAngle)` | 绘制指定矩形内的圆形或椭圆弧轮廓。\
  \ |\n| `void fillArc(int x, int y, int width, int height, int startAngle, int arcAngle)`\
  \ | 填充指定矩形内的圆形或椭圆弧。 |\n| `void drawPolygon(int[] xPoints, int[] yPoints, int nPoints)`\
  \ | 绘制由 x 和 y 数组定义的闭合多边形。 |\n| `void fillPolygon(int[] xPoints, int[] yPoints, int\
  \ nPoints)` | 填充由 x 和 y 数组定义的闭合多边形。 |\n| `void drawPolyLine(int[] xPoints, int[]\
  \ yPoints, int nPoints)` | 绘制由 x 和 y 数组定义的一系列连接线。 |\n\n\n\n\n\n### 方法参考\n\n- `void\
  \ drawString(String str, int x, int y)`: 使用此图形上下文的当前字体和颜色绘制指定的字符串文本。`x`, `y` 参数指定字符串基线（baseline）的左边缘。带有下延伸部（descenders）的字符（在大多数字体中为\
  \ `g, j, p, q, 和 y`）会延伸到基线以下。文本坐标相对于基线这一事实非常重要。例如，在简单文本中，我们可能会尝试在 `(0,0)` 处绘制字符串，并期望它出现在区域的左上角。然而，由于基线的存在，我们只能看到字符串的下延伸部，这可能意味着我们什么也看不到。默认情况下，图形上下文使用关联组件的字体；但是，我们可以通过调用图形上下文的\
  \ `setFont()` 方法设置不同的字体。\n\n- `boolean drawImage(Image img, int x, int y, ImageObserver\
  \ observer)`: 绘制当前可用的指定图像。这里，`img` 是要渲染的图像，`x` 和 `y` 是目标组件内图像左上角的坐标。图像观察者必须是一个实现了\
  \ `ImageObserver` 接口的对象。图像是矩形像素值集合的离屏表示。Java 的图像支持非常复杂。现在，假设我们通过某种方式获取了图像（即 `java.awt.Image`\
  \ 类的实例），并想要使用特定的图形上下文将其渲染到屏幕上。实现的方法是调用图形上下文的 `drawImage()` 方法。\n\n### 示例 19.2\n\n\
  此示例演示了如何创建一个图像并使用其图形上下文在其进行绘制。然后可以使用 `drawImage()` 方法在 applet 窗口显示该图像。\n\n```java\n\
  import java.awt.*;\nimport java.applet.*;\nimport java.net.URL;\n/*applet code=\"\
  PaintImage\" width=200 height=100></applet>\npublic class PaintImage extends Applet\
  \ {\n    private Image im;\n    public void init() {\n        im = createImage(100,50);\n\
  \        Graphics imgc = im.getGraphics();\n        imgc.setColor(Color.gray);\n\
  \        imgc.fillRect(0,0,100,50);\n        imgc.setColor(Color.black);\n     \
  \   imgc.fillOval(0,0,50,40);\n    }\n    public void paint(Graphics g) {\n    \
  \    g.drawImage(im,10,10,this);\n    }\n}\n```\n\n### 示例 19.3\n\n此示例演示了如何从现有图像创建图像对象。然后可以使用\
  \ `drawImage()` 方法在 applet 窗口显示该图像。\n\n```java\nimport java.awt.*;\nimport java.applet.*;\n\
  import java.net.*;\n/*applet code=\"PaintImage\" width=50 height=50></applet>\n\
  public class PaintImage extends Applet {\n    private Image im;\n    public void\
  \ init() {\n        try {\n            im = getImage(new URL(\"file:///c:/logo.gif\"\
  ));\n            // im=getImage(new URL(\"http://127.0.0.1:8080/logo.gif\"));\n\
  \        } catch (MalformedURLException e) {\n            System.out.println(e);\n\
  \        }\n    }\n    public void paint(Graphics g) {\n        g.drawImage(im,10,0,this);\n\
  \    }\n}\n```\n\n### 裁剪 (Clipping)\n\n程序员在图形上下文上进行的大多数调用涉及颜色或绘制。一种不常用的的操作是裁剪。裁剪简单地限制上下文可以修改的区域。每个图形上下文、每个\
  \ `Graphics` 类的实例都有一个裁剪区域，该区域定义了关联组件的所有或部分。当我们调用 `Graphics` 类的 `draw()` 或 `fill()`\
  \ 方法时，只有位于上下文裁剪区域内的像素会被修改。图形上下文的默认裁剪区域是关联组件的整个可见区域。有方法可以获取和修改裁剪区域。考虑以下 `paint` 方法。\n\
  \n```java\nimport java.awt.*;\nclass Clip extends Frame {\n    public static void\
  \ main(String args[]) {\n        Frame f = new Clip();\n        f.setSize(300,330);\n\
  \        f.setVisible(true);\n    }\n    public void paint(Graphics g) {\n     \
  \   for(int i=0; i<300; i+=100) {\n            for(int j=30; j<330; j+=100) {\n\
  \                g.fillOval(i,j,100,100);\n            }\n        }\n    }\n}\n\
  ```\n\n上述程序的 `paint()` 方法绘制了一个点状图案。考虑一下当这是一个 200*200 像素帧的 `paint()` 方法时会发生什么。由于计数器一直到\
  \ 500，它尝试在帧边界之外绘制。这并不是一个问题，因为上下文默认的裁剪区域与帧本身重合。要为图形上下文设置矩形区域，我们可以调用 `setClip(x,y,\
  \ width, height)`，传入四个描述所需矩形位置和大小的整数。例如，上面的代码可以修改如下：\n\n```java\nimport java.awt.*;\n\
  class Clip2 extends Frame {\n    public static void main(String args[]) {\n    \
  \    Frame f = new Clip2();\n        f.setSize(300,330);\n        f.setVisible(true);\n\
  \    }\n    public void paint(Graphics g) {\n        g.setClip(50,80,200,200);\n\
  \        for(int i=0; i<300; i+=100) {\n            for(int j=30; j<330; j+=100)\
  \ {\n                g.fillOval(i,j,100,100);\n            }\n        }\n      \
  \  g.drawString(\"Hello! Kamal\", 50,50);\n        g.drawString(\"Bye! Kamal\",\
  \ 120,150);\n    }\n}\n```\n\n\n\n\n} }\n\nOutput:\n\n![](img/image01298.jpeg)\n\
  \n如所示，现在绘制被裁剪到 300 * 300 Applet 框架中心的 200 * 200 矩形内。\n\n裁剪（Clipping）本身是一个值得了解的知识。当环境需要修复组件的暴露部分时，裁剪也会发挥作用。\n\
  \n### 关于 `paint()` 方法和图形上下文的总结：\n\n`Graphics` 上下文是专属于单个组件的。要在组件上进行绘制，我们调用图形上下文的\
  \ `drawXXXX()` 和 `fillXXXX()` 方法。若要更改图形操作的颜色或字体，我们分别调用图形上下文的 `setColor()` 或 `setFont()`\
  \ 方法。\n\n### GUI 线程与绘制\n\nJava 运行时环境创建并控制其在后台运行的各个线程，其中一个线程负责 GUI 管理。\n\nGUI 线程是环境用于接受用户输入事件以及调用需要绘制的组件的\
  \ `paint()` 方法的工具。\n\n对 `paint()` 的调用并非都由环境生成。Java 程序当然可以进行自己的调用，无论是直接调用，还是通过 `repaint()`\
  \ 方法间接调用。\n\n还可以使用组件的图形上下文在组件上进行绘制。这种方法不需要调用 `paint()` 或 `repaint()` 方法。\n\n在组件上绘图的不同方法如下：\n\
  \n(i) 在获取组件的图形上下文后直接绘制。\n\n(ii) 自发绘制（由 GUI 线程隐式/自动调用 `paint()` 方法）。\n\n(iii) 显式调用\
  \ `paint()` 方法。\n\n(iv) 显式调用 `repaint()` 方法，由其间接调用 `paint()` 方法。\n\n### 在获取组件的图形上下文后直接绘制：\n\
  \n由于可以使用 `getGraphics()` 方法获取组件 `Graphics` 上下文的引用，人们可能认为可以地从任何方便的方法在组件上绘图。通常，这种方法存在严重缺陷。\n\
  \n假设我们有一个 Applet，想要在最近鼠标点击的位置画一个红点。Applet 的其余部分应该是黄色。假设该 Applet 正在处理自己的鼠标事件。我们可能会考虑创建这样的事件处理器：\n\
  \n**示例 19.6：**\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass PaintApproach\
  \ extends Frame implements MouseListener {\n    public static void main(String args[])\
  \ {\n        PaintApproach f = new PaintApproach();\n        f.setSize(300,300);\n\
  \        f.addMouseListener(f);\n        f.setVisible(true);\n    }\n    public\
  \ void mouseEntered(MouseEvent e) {}\n    public void mouseExited(MouseEvent e)\
  \ {}\n    public void mousePressed(MouseEvent e) {}\n    public void mouseReleased(MouseEvent\
  \ e) {}\n    public void mouseClicked(MouseEvent e) {\n        System.out.println(\"\
  Mouse Clicked...\");\n        Graphics g = getGraphics();\n        g.setColor(Color.yellow);\n\
  \        g.fillRect(0,0, getSize().width, getSize().height);\n        g.setColor(Color.Red);\n\
  \        g.fillOval(e.getX()-10, e.getY()-10,20,20);\n    }\n}\n```\n\n### 自发绘制（由\
  \ GUI 线程隐式/自动调用 `paint()` 方法）：\n\n“自发绘制”并不是一个正式术语，但也可以使用。例如，当浏览器启动时，在 `init()` 方法完成后不久就会调用\
  \ `paint()` 方法。此外，当浏览器的部分或全部被覆盖后又重新暴露时，GUI 线程会在发生以下任一情况后调用 `paint()`：\n\n*   暴露后。\n\
  *   最小化后。\n*   首次显示后。\n\n当浏览器返回到之前包含 Applet 的页面时（只要该 Applet 至少可见）。当 GUI 线程调用 `paint()`\
  \ 时，它必须提供一个图形上下文，因为 `paint()` 方法的输入参数是 `Graphics` 类的实例。\n\n前面的章节（“裁剪”）讨论了每个图形上下文都有裁剪区域的事。GUI\
  \ 线程确保传递给 `paint()` 的图形上下文已设置了裁剪区域。大多数情况下，默认裁剪区域是合适的。\n\n然而，当组件被暴露时，裁剪区域被设置为仅包含组件需要修复的部分。如果只暴露了组件的一小部分，裁剪区域将确保不会浪费时间去绘制已经是正确颜色的像素。\n\
  \n如果暴露区域不是矩形，则可能会发生多次 `paint()` 调用，每次的裁剪区域都会连续累积，以确保暴露区域最终被重绘。\n\n### 显式调用 `paint()`\
  \ 方法：\n\n如果在组件上的绘制操作是在 `paint()` 方法以外的方法中执行的，组件可能不会刷新。如果绘制是在 `paint` 方法中完成的，那么当我们显式调用\
  \ `paint()` 方法以及 GUI 线程隐式调用 `paint()` 方法时，它都会被显示出来。\n\n上一个示例中的 `mouseClicked()`\
  \ 方法被重写为每当发生鼠标点击时只需修改实例变量 `mouseX` 和 `mouseY`。\n\n红点仅在 `paint()` 方法中绘制，以便即使 Applet\
  \ 被覆盖并暴露，它也能得到修复。\n\n**示例 19.7：**\n\n上一节的示例经过了修改，使得组件显示在上述情况下可以得到刷新。这是因为红点是在 `paint()`\
  \ 方法中绘制的。\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n```\n\n\n\n\n\
  ### PaintApproach1 实现\n\n```java\npublic class PaintApproach1 extends Frame implements\
  \ MouseListener {\n    int mouseX, mouseY;\n\n    public static void main(String\
  \ arg[]) {\n        PaintApproach1 f = new PaintApproach2();\n        f.setSize(300,\
  \ 300);\n        f.addMouseListener(f);\n        f.setVisible(true);\n    }\n\n\
  \    public void mouseEntered(MouseEvent e) {}\n    public void mouseExited(MouseEvent\
  \ e) {}\n    public void mousePressed(MouseEvent e) {}\n    public void mouseReleased(MouseEvent\
  \ e) {}\n    public void mouseClicked(MouseEvent e) {\n        System.out.println(\"\
  MouseClicked...\");\n        mouseX = e.getX();\n        mouseY = e.getY();\n  \
  \      Graphics g = getGraphics();\n        paint(g);\n    }\n\n    public void\
  \ paint(Graphics g) {\n        g.setColor(Color.yellow);\n        g.fillRect(0,\
  \ 0, getSize().width, getSize().height);\n        g.setColor(Color.red);\n     \
  \   g.fillOval(mouseX-10, mouseY-10, 20, 20);\n    }\n}\n```\n\n### 显式调用 repaint()\n\
  \n显式调用 `repaint()` 方法（随后会间接调用 `paint()`）可能会导致严重的问题。第一个问题是 GUI 线程在需要处理区域暴露时调用了 `paint()`。这可能会导致线程问题。公平地说，我们会发现，即使使用首选方法，我们可能仍然需要处理其中的一些问题，因为\
  \ `paint()` 方法将使用我们在其他线程中修改的数据。\n\n第二个问题是关于 CPU 使用率的。考虑以下场景：我们的程序定期接收到通知，要求使用动画的下一帧或连续移动的图形来更新显示。假设绘图过程是复杂且耗时的。如果我们调用整个\
  \ `paint()` 方法，当新帧发生时，我们可能只完成了绘图的一部分。这将导致程序将所有时间花在绘图上。此外，绘图进度会越来越落后于预期。\n\n这些问题可以通过使用首选的处理方法简单地解决。其思想是：主程序维护一个描述应呈现给用户的绘图的数据集，但不调用绘图程序。相反，程序请求\
  \ GUI 线程运行绘图程序，其方式与该线程处理区域暴露时的操作大致相同。GUI 线程使用主程序提供的数据来决定画什么以及如何画。\n\n为了支持这种方法，GUI\
  \ 系统提供了名为 `repaint()` 的方法。该方法定义在 `Component` 类中，因此 GUI 中的任何可见对象都可以。当我们调用此方法时，我们是在向\
  \ GUI 线程发出一个请求，让它执行绘图程序。GUI 线程会在合理的时间范围内执行操作，尽管这可能会受到其他高优先级线程活动的限制。这种方法确保了 GUI 线程与用户线程之间的交互降至最低。我们自然必须确保在数据处于不一致状态时，GUI\
  \ 线程不会使用我们的数据集。然而，通过使用同步或双缓冲技术，可以很容易地实现这一点。这种行为的另一个结果是，无论程序尝试进行多少绘图，系统通常保持与当前帧的同步。例如，如果我们在\
  \ GUI 线程能够处理第一次调用之前调用了十次 `repaint()` 方法，那么结果将是绘图系统只执行了一次。\n\n因此，在过载的情况下，绘图系统会自动跳过主机\
  \ CPU 无法处理的帧。这意味着程序员可以编写代码，在给定平台上可靠地获得最佳可用视频性能，同时在任何其他平台上都能运行良好。以下代码实现了这种方案。\n\n\
  #### 示例 19.8\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\nclass PaintApproach2\
  \ extends Frame implements MouseListener {\n    int mouseX, MouseY;\n\n    public\
  \ static void main(String args[]) {\n        PaintApproach2 f = new PaintApproach2();\n\
  \        f.setSize(300, 300);\n        f.addMouseListener(f);\n        f.setVisible(true);\n\
  \    }\n\n    public void mouseEntered(MouseEvent e) {}\n    public void mouseExited(MouseEvent\
  \ e) {}\n    public void mousePressed(MouseEvent e) {}\n    public void mouseReleased(MouseEvent\
  \ e) {}\n    public void mouseClicked(MouseEvent e) {\n        System.out.println(\"\
  Mouse Clicked …\");\n        mouseX = e.getX();\n        mouseY = e.getY();\n  \
  \      Graphics g = getGraphics();\n        paint(g);\n    }\n\n    public void\
  \ paint(Graphics g) {\n        g.setColor(Color.yellow);\n        g.fillRect(0,\
  \ 0, getSize().width, getSize().height);\n        g.setColor(Color.red);\n     \
  \   g.fillOval(mouseX-10, mouseY-10, 20, 20);\n    }\n}\n```\n\n\n\n\n\n前台绘图线程与\
  \ GUI 线程之间的线程交互是受控且可预测的。\n\n虚拟机永远不会被绘图操作淹没。\n\n当所有代码按这种方式编写时，其他尝试调试代码的程序员就不会遇到任何“意外状况”。\n\
  \n尽管这种方法效果良好，但存在一种需要进一步改进的情况：动画。如果我们完全按照描述的方法来操作，可能会注意到动画在运行时会产生不愉快的闪烁。\n\n### 平滑动画\n\
  \n重绘机制的默认行为中有一个特性我们可能并不总是需要的，那就是系统在准备响应我们对 `repaint()` 调用的准备阶段，会清除我们的绘图区域。这会导致动画和其他实时绘制出现不愉快的闪烁。事实证明，当我们调用\
  \ `repaint()` 时，GUI 线程并没有调用 `paint()`；而是调用 `update()` 方法。`update()` 的默认行为是做两件事：清除背景然后调用\
  \ `paint`。如下所示：\n\n```java\npublic void update (Graphics g)\n{\n    g.clearRect\
  \ (0,0,width, height);\n    paint(g);\n}\n```\n\n我们可能会合理地问，为什么 `repaint()` 一开始就清除窗口，如果这会导致闪烁的话。嗯，在很多情况下，绘制是使用在背景上绘制线条、矩形、圆形等完成的。\n\
  \n如果我们正试图制作一个旋转的棒子，我们需要在绘制新线之前移除旧线。这种问题的另一种方式是：如果我们试图画一个新图，就应该先擦掉旧的。\n\n那么，我们如何能够在不先清除整个显示器的情况下让新图出现呢？我们只需要找到另一种移除旧图的方法。通用方法是确保我们在每次绘制帧时，都绘制整个图——包括背景和前景。如果我们能安排好这一点，就不需要清除组件，闪烁也会消失。\n\
  \n为了防止组件在调用 `paint()` 之前被清除，我们只需要重写 `update()` 方法，使其直接调用 `paint`，如下所示：\n\n```java\n\
  public void update (Graphics g)\n{\n    paint (g);\n}\n```\n\n这是一项标准技术且运行完美，前提是我们的\
  \ `paint()` 方法确实刷新了显示器的所有像素。处理这种问题的一种特别简单的方法是使用离屏图像来存储应该在显示器上显示的绘图。\n\n这种技术在速度或内存方面并不总是最高效的，但它简单易于实现，且\
  \ Java 程序员通常都能良好理解。\n\n![11](img/image01212.jpeg) ![11](img/image01212.jpeg) ![11](img/image01212.jpeg)\
  \ ![11](img/image01212.jpeg) ![11](img/image01212.jpeg)\n\n![STAR-LOGO-2013](img/image01213.jpeg)\n\
  \n# (Java.Lang.Object 类)\n\n#### 简介\n\n`Object` 类是 `java.lang` 包的根类，所有 Java 类的类。即使你写一个简单的类（即不继承任何基类），它也会继承\
  \ `Object`。因此，该类的功能在所有类中可用。\n\n### Object 类的方法\n\n`Object` 类定义了以下方法，被所有类继承：\n\n\
  1. `public int hashCode()`\n2. `public boolean equals(Object obj)`\n3. `final Class\
  \ getClass()`\n4. `public String toString()`\n5. `protected void finalize() throws\
  \ Throwable`\n6. `protected Object clone() throws CloneSupportedException`\n7. `final\
  \ void wait(long timeout) throws InterruptedException`\n8. `final void wait(long\
  \ timeout, int nanos) throws InterruptedException`\n9. `final void wait() throws\
  \ InterruptedException`\n10. `final void notify()`\n11. `final void notifyAll()`\n\
  \n#### 1. `public int hashCode()`\n在哈希表中存储对象时，可以使用此方法获取对象的哈希值。该值在程序执行期间保持一致。\n\n\
  #### 2. `boolean equals(Object obj)`\n如果每个对象都被认为是唯一的，那么没有必要重写 `Object` 类的 `equals`\
  \ 方法。该方法比较对象的引用。\n\n#### 3. `final Class getClass()`\n返回对象的运行时类，该类由 `java.lang.Class`\
