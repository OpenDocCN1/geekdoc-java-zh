  \ 示例 2.7\n\n```java\nclass Clicker implements Runnable {\n    long click = 0;\n\
  \    Thread t;\n    volatile boolean running = true;\n\n    Clicker(int p) {\n \
  \       t = new Thread(this);\n        t.setPriority(p);\n    }\n\n    public void\
  \ run() {\n        while (running) {\n            click++;\n        }\n    }\n\n\
  \    void stop() {\n        running = false;\n    }\n\n    void start() {\n    \
  \    t.start();\n    }\n}\n\nclass HiLoPri {\n    public static void main(String[])\
  \ {\n        Thread.currentThread().setPriority(Thread.MAX_PRIORITY);\n        Clicker\
  \ hi = new Clicker(Thread.NORM_PRIORITY + 1);\n        Clicker lo = new Clicker(Thread.NORM_PRIORITY\
  \ - 1);\n        lo.start();\n        hi.start();\n        try {\n            Thread.sleep(10000);\n\
  \        } catch (InterruptedException e) {\n            System.out.println(e);\n\
  \        }\n        lo.stop();\n        hi.stop();\n        try {\n            lo.join();\n\
  \            hi.join();\n        } catch (InterruptedException e) {\n          \
  \  System.out.println(e);\n        }\n        System.out.println(\"Low : \" + lo.click);\n\
  \        System.out.println(\"High : \" + hi.click);\n    }\n}\n```\n\n\n\n\n\n\
  高优先级线程获得了超过 98% 的 CPU 时间。但尽管线程既没有主动释放 CPU，也没有因为 I/O 而阻塞，它们仍然发生了上下文切换。当此相同的程序在非抢占式系统下运行时，将获得不同的结果。\n\
  \n**注意**:-变量 `running` 前面带有关键字 `volatile`，以确保在每次迭代以下循环时，都会检查 `running` 的句值。\n\n\
  ```java\nwhile (running) {\n    click++;\n}\n```\n\n如果不使用 `volatile`，Java 可以自由地对循环进行优化，创建一个\
  \ `running` 的局部副本。使用 `volatile` 可以防止这种优化，告诉 Java `running` 可能会以当前代码中无法直接看出的方式发生变化。\n\
  \n## 同步\n\n当两个或多个线程需要访问共享资源时，它们需要某种方式来确保资源一次只有一个线程使用。实现这一目标的过程被称为同步。\n\n同步的关键是监控器（monitor）的概念（也称为信号量\
  \ semaphore）。监控器是一个被用作互斥锁的对象。在任何时刻，只有一个线程可以拥有监视器。\n\n当线程获取锁时，可以说它进入了监视器。所有其他尝试进入被锁监视器的线程都将被挂起，直到第一个线程退出监视器。这些其他线程被称为等待监视器。拥有监视器的线程如果需要，可以重新进入同一个监视器。我们可以通过两种方式同步我们的代码：\n\
  \n(i) 使用 `synchronized` 方法\n(ii) 使用 `synchronized` 语句\n\n## 使用 synchronized 方法\n\
  \n在 Java 中同步是非常简单的，因为所有对象都关联有自己的隐式监视器。要进入对象的监视器，只需调用用 `synchronized` 关键字修改的方法。当线程在同步方法内部时，所有其他尝试调用该方法（或同一实例上的任何其他同步方法）的线程都必须\
  \ `wait()`。要退出监视器并将对象的控制权交给下一个等待线程，监视器的所有者只需从同步方法返回即可。\n\n### 示例 12.8\n\n以下程序说明了三个线程在并发运行时，它们生成的输出会发生混合。\n\
  \n```java\nclass A {\n    void display(String msg) {\n        System.out.print(\"\
  [\" + msg);\n        try {\n            Thread.sleep(1000);\n        } catch (InterruptedException\
  \ e) {\n            System.out.println(e);\n        }\n        System.out.println(\"\
  ]\");\n    }\n}\n\nclass B implements Runnable {\n    A obj;\n    String msg;\n\
  \    Thread t;\n    B(A obj1, String m) {\n        msg = m;\n        obj = obj1;\n\
  \        t = new Thread(this);\n        t.start();\n    }\n    public void run()\
  \ {\n        obj.display(msg);\n    }\n}\n\nclass Synch1 {\n    public static void\
  \ main(String args[]) {\n        A a1 = new A();\n        B b1 = new B(a1, \"Hello\"\
  );\n        B b2 = new B(a1, \"World\");\n        B b3 = new B(a1, \"Matrix\");\n\
  \    }\n}\n```\n\n**输出:**\n```\n[Hello[World[Matrix]\n]\n]\n```\n\n正如我们看到的，通过调用\
  \ `sleep()`，`display()` 方法允许执行切换到另一个线程。这导致了三个消息字符串的输出混合。在这个程序中，没有任何机制可以阻止所有三个线程同时在同一个对象上调用同一个方法。\n\
  \n这被称为竞态条件（race condition），因为这三个线程正在相互竞争以完成该方法。这个示例使用 `sleep()` 来使效果变得重复且显而。在大多数情况下，竞态条件更加微妙且难以预测，因为我们无法确定上下文切换何时发生。这可能导致程序在一次运行时是正确的，而在下一次运行时错误的。\n\
  \n要做到这一点，我们只需要在方法 `display()` 的定义之前加上 `synchronized` 关键字。这可以防止一个线程在另一个线程使用 `display()`\
  \ 时进入该方法。\n\n### 示例 12.9\n\n混合问题通过通过将 `display()` 方法声明为同步方法就简单解决了。\n\n```java\n\
  class A {\n    synchronized void display(String msg) {\n        System.out.print(\"\
  [\" + msg);\n        try {\n            Thread.sleep(100);\n        } catch (InterruptedException\
  \ e) {\n            System.out.println(e);\n        }\n        System.out.println(\"\
  ]\");\n    }\n}\n\nclass B implements Runnable {\n    A obj;\n    String msg;\n\
  \    Thread t;\n    B(A obj1, String m) {\n        msg = m;\n        obj = obj1;\n\
  \        t = new Thread(this);\n        t.start();\n    }\n    public void run()\
  \ {\n        obj.display(msg);\n    }\n}\n\nclass Synch2 {\n    public static void\
  \ main(String args[]) {\n        A a1 = new A();\n        B b1 = new B(a1, \"Hello\"\
  );\n        B b2 = new B(a1, \"World\");\n        B b3 = new B(a1, \"Matrix\");\n\
  \    }\n}\n```\n\n\n\n\n虽然在我们创建的类中创建同步方法是实现同步的一种简单且有效的方法，但在所有情况下它并不起作用。为了理解其原因，请考虑以下情况：假设我们想要对一个并非为多线程访问设计的类对象进行同步访问。也就是说，该类没有使用\
  \ `synchronized` 方法。此外，该类不是由我们创建，而是由第三方创建的；我们无法访问源代码。因此，我们无法在类内部适当的方法上添加 `synchronized`\
  \ 修饰符。那么如何通过 `synchronized` 对该类的对象进行访问呢？\n\n解决方案是将对该类定义的方法调用放在 `synchronized` 块内部。`synchronized`语句的一般形式如下：\n\
  \n```java\nsynchronized(object)\n{\n    //需要同步的语句\n}\n```\n\n在这里，`object` 是被同步对象的引用。`synchronized`\
  \ 块确保了对 `object` 成员方法的调用只有在当前线程成功进入 `object` 监器后才会发生。\n\n### 示例 12.10\n前一个示例的变体版本，在\
  \ `run()` 中使用 `synchronized` 块。\n\n```java\nclass A\n{\n    void display(String\
  \ msg) {\n        System.out.print(\"[\" + msg);\n        try {\n            Thread.sleep(1000);\n\
  \        } catch(InterruptedException e) {\n            System.out.println(e);\n\
  \        }\n        System.out.println(\"]\");\n    }\n}\n\nclass B implements Runnable\n\
  {\n    A obj;\n    String msg;\n    Thread t;\n    B(A obj1, String m) {\n     \
  \   msg = m;\n        obj = obj1;\n        t = new Thread(this);\n        t.start();\n\
  \    }\n    public void run() {\n        synchronized(obj) {\n            obj.display(msg);\n\
  \        }\n    }\n}\n\nclass Synch3\n{\n    public static void main(String args[])\
  \ {\n        A a1 = new A();\n        B b1 = new B(a1,\"Hello\");\n        B b2\
  \ = new B(a1,\"World\");\n        B b3 = new B(a1,\"Matrix\");\n    }\n}\n```\n\
  输出:-\n[Hello]\n[World]\n[Matrix]\n\n### 多线程在不同对象上调用同一方法\n#### 示例 12.11\n线程可以并发地在同类的不同对象上调用同一个同步实例方法，因为每个对象都有不同的锁。这再次导致输出混杂。\n\
  \n```java\nclass A\n{\n    synchronized void display(String msg) {\n        System.out.print(\"\
  [\" + msg);\n        try {\n            Thread.sleep(100);\n        } catch(InterruptedException\
  \ e) {\n            System.out.println(e);\n        }\n        System.out.println(\"\
  ]\");\n    }\n}\n\nclass B implements Runnable\n{\n    A obj;\n    String msg;\n\
  \    Thread t;\n    B(A obj1, String m) {\n        msg = m;\n        obj = obj1;\n\
  \        t = new Thread(this);\n        t.start();\n    }\n    public void run()\
  \ {\n        obj.display(msg);\n    }\n}\n\nclass Synch4\n{\n    public static void\
  \ main(String args[]) {\n        A a1 = new A();\n        A a2 = new A();\n    \
  \    A a3 = new A();\n        B b1 = new B(a1,\"Hello\");\n        B b2 = new B(a2,\"\
  World\");\n        B b3 = new B(a3,\"Matrix\");\n    }\n}\n```\n输出:\n[Hello[World[Matrix]\n\
  \n### 静态同步方法\n### 示例 12.2\n在以下示例中，尽管我们在不同的对象上调用了 `display()` 方法，但输出并没有被打乱。原因是 `display()`\
  \ 是 `static` 的，因此锁是针对整个类 `A` 获取的，而不是针对单个对象。\n\n```java\nclass A\n{\n    static synchronized\
