  \n## 第 4 章：Scanner 类与数组\n(命令行参数)\n\n### 引言\n### Scanner 类\n这是 Java 在 JDK1.5-6-7\
  \ 版本中添加的新类，用于从用户获取基本数据类型的输入。使用此类获取输入非常简单，因为我们只需要创建该类的对象并调用特定方法。该类位于 `java.util`\
  \ 包中。\n\n| `public java.util.Scanner(java.io.InputStream);` |\n| `public java.util.Scanner(java.io.File)\
  \ throws java.io.FileNotFoundException;` |\n| `public java.util.Scanner(java.lang.String);`\
  \ |\n| `public void close();` |\n| `public boolean hasNext();` |\n| `public java.lang.String\
  \ next();` 输入不包含空格的字符串。 |\n| `public java.lang.String nextLine();` 输入可能包含空格的字符串。\
  \ |\n| `public boolean hasNextBoolean();` |\n| `public boolean nextBoolean();` |\n\
  | `public boolean hasNextByte();` |\n| `public byte nextByte();` |\n| `public boolean\
  \ hasNextShort();` |\n| `public short nextShort();` |\n| `public boolean hasNextInt();`\
  \ 检查输入缓冲区中的下一个值是否为 `int`。 |\n| `public int nextInt();` 输入一个整数。 |\n| `public boolean\
  \ hasNextLong();` |\n| `public long nextLong();` |\n| `public boolean hasNextFloat();`\
  \ |\n| `public float nextFloat();` |\n| `public boolean hasNextDouble();` |\n| `public\
  \ double nextDouble();` |\n\n#### 示例 4.1\n```java\nimport java.util.*;\nclass SumInput\
  \ {\n    public static void main(String args[]) {\n        Scanner sc=new Scanner(System.in);\n\
  \        int a,b,sum;\n        System.out.print(\"Enter number\");\n        a =\
  \ sc.nextInt();\n        System.out.print(\"Enter 2nd number\");\n        b = sc.nextInt();\n\
  \        sum = a+b;\n        System.out.println(\"Sum is \" + sum);\n    }\n}\n\
  ```\n**输出：**\n```\nEnter number 45\nEnter 2nd number 55\nSum is 100\n```\n\n## 数组\n\
  Java 数组是相同类型变量或数据项目的有序集合。Java 允许任何维度的数组。Java 数组与 C/C++ 有些不同。我们不能在声明时指定数组的大小。内存分配总是动态的。Java\
  \ 中的每个数组都被视为一个对象，并有一个特殊的属性 `length`，该属性指定数组中的元素个数。\n\n## 一维数组\n**声明：**\n`type array_name[];`\
  \ // 声明时不发生内存分配。\n或者或者\n`type[] array_name;`\n\n需要注意的是，声明实际上并没有创建数组。它只是声明了一个可以指向数组对象的引用。\n\
  \n`int a1 [], a2;`\n`int [] a3, a4;`\n\n这两个声明将 `a1`、`a3` 和 `a4` 声明为指向 `int` 数组的引用变量，但变量\
  \ `a2` 不能指向 `int` 值的数组。它仅仅是一个 `int` 变量。当 `[]` 符号跟随类型之后时，声明中的所有变量都是数组。否则，`[]` 符号必须跟随声明中的每个单独数组名。\n\
  \n**借助 `new` 运算符进行内存分配：**\n`array_name = new type[SIZE];` // `SIZE` 可以是常量也可以是变量。\n\
  \n![Images/image1218.jpeg]\n1. 数组的所有元素将初始化为零，但要用不同值初始化数组，可以这样做：`int a[]={5,7,1};`\n\
  2. 数组索引从 0 开始。\n3. 在 Java 中，数组存储大小在一个名为 `length` 的变量中。我们可以通过属性 `array_name.length`\
  \ 获取数组长度。\n4. `a = b = new int[5];` 在上述步骤中，new 创建了一个数组，该数组的引用将存储在 `b` 中。因此 `a` 和\
  \ `b` 指向同一个数组。赋值引用不会创建副本。\n\n#### 示例 4.2 数组存储的所有数字之和\n```java\nclass SumArr {\n\
  \    public static void main(String args[]) {\n        int a[]={10,50,20,30};\n\
  \        int n=a.length,sum=0;\n        for(int i=0;i<n;i++) {\n            sum+=a[i];\n\
  \        }\n        System.out.println(\"Sum of numbers is \" + sum);\n    }\n}\n\
  ```\n**输出：**\n```\nSum of numbers is 150\n```\n\n#### 示例 4.3 使用选择排序法对数组进行排序\n```java\n\
  import java.util.Scanner;\nclass Sort {\n    public static void main(String args[])\
  \ {\n        int n;\n        Scanner sc = new Scanner(System.in);\n        System.out.println(\"\
  Enter many elements\");\n        n = sc.nextInt();\n        int a[] = new int[n];\n\
  \        // 输入数组\n        for(int i=0;i<n;i++) {\n            System.out.print(\"\
  Enter element \" + (i+1) + \" \");\n            a[i] = sc.nextInt();\n        }\n\
  \        // 排序\n        for(int i=0;i<n-1;i++) {\n            for(int j=i+1;j<n;j++)\
  \ {\n                if(a[i] > a[j]) {\n                    int t=a[i];\n      \
  \              a[i] = a[j];\n                    a[j] = t;\n                }\n\
  \            }\n        }\n        // 输出\n        for(int i=0;i<n;i++) {\n     \
  \       System.out.println(a[i]);\n        }\n    }\n}\n```\n\n\n\n\n\n#### 内存分配\n\
  \n```java\narray_name = new type[ROWS][COLUMNS];\n```\n// `ROWS` & `COLUMNS` 可以是常量或变量\
  \ \n\n到为止，我们讨论了可以存储值列表的数组变量。在某些情况下，必须存储一个值表。考虑以下数据表，它显示了三名销售人员三种商品的销售额。\n\n该表总共\
  \ 12 个值，每行 3 个。我们可以将此表看作由四行三列组成的矩阵。每行代表特定销售人员的销售额，每列代表特定商品的的销售额。\n\n## 示例 4.4 打印矩阵转置的程序\n\
  \n```java\nimport java.util.*;\n\nclass Transpose\n{\n    public static void main(String\
  \ args[])\n    {\n        Scanner sc=new Scanner(System.in);\n        int r,c;\n\
  \        System.out.print(\"Enter how many rows\");\n        r=sc.nextInt();\n \
  \       System.out.print(\"Enter how many cols.\");\n        c=sc.nextInt();\n\n\
  \        int m[][]=new int[r][c];\n        //input\n        for(int i=0;i<r;i++)\n\
  \            for(int j=0;j<c;j++)\n            {\n                System.out.print(\"\
  Enter\" + (i+1) + \",\" +(j+1));\n                m[i][j]=sc.nextInt();\n      \
  \      }\n        //transpose\n        for(int i=0;i<c;i++)\n        {\n       \
  \     for(int j=0;j<r;j++)\n                System.out.print(m[j][i]+\"\\t\");\n\
  \            System.out.println();\n        }\n    }\n}\n```\n\n## 示例 4.5 将两个矩阵相乘得到第三个矩阵的程序\n\
  \n```java\nimport java.util.*;\nclass MatrixMult\n{\n    public static void main(String\
  \ args[])\n    {\n        Scanner sc=new Scanner(System.in);\n        int r1,c1;\n\
  \        System.out.print(\"Enter how many rows\");\n        r1=sc.nextInt();\n\
  \        System.out.print(\"Enter how many cols.\");\n        c1=sc.nextInt();\n\
  \        int r2,c2;\n        System.out.print(\"Enter how many rows\");\n      \
  \  r2=sc.nextInt();\n        System.out.print(\"Enter how many cols.\");\n     \
  \   c2=sc.nextInt();\n        if(c1 != r2)\n        {\n            System.out.println(\"\
  Can't mult\");\n            System.exit(1);\n        }\n        int m1[][]=new int[r1][c1];\n\
  \        //input m1\n        for(int i=0;i<r1;i++)\n            for(int j=0;j<c1;j++)\n\
  \            {\n                System.out.print(\"Enter\" + \"element \" + (i+1)\
  \ + \",\" + (j+1));\n                m1[i][j]=sc.nextInt();\n            }\n   \
  \     int m2[][]=new int[r2][c2];\n        //input m2\n        for(int i=0;i<r2;i++)\n\
  \            for(int j=0;j<c2;j++)\n            {\n                System.out.print(\"\
  Enter\" + \"element \" + (i+1) + \",\" +(j+1));\n                m2[i][j]=sc.nextInt();\n\
  \            }\n        int m3[][]=new int[r1][c2];\n        //matrix mult\n   \
  \     for(int i=0;i<r1;i++)\n            for(int j=0;j<c2;j++)\n               \
  \ for(int k=0;k<c1;k++)\n                    m3[i][j]+=m1[i][k]*m2[k][j];\n    \
  \    //Output m3\n        for(int i=0;i<r1;i++)\n        {\n            for(int\
  \ j=0;j<c2;j++)\n                System.out.print(m3[i][j]+\"\\t\");\n         \
  \   System.out.println();\n        }\n    }\n}\n```\n\n## 3. 可变大小数组\n\n数组将多维数组视为“数组的数组”，可以按照如下方式声明二维数组：\n\
  \n```java\nint arr[ ] [ ] = new int [4][];\narr[0] = new int [1];\narr[1] = new\
  \ int [2];\narr[2] = new int [3];\narr[3] = new int [4];\n```\n\n这意味着数组共有 4 行，其列数从\
  \ 1 开始逐递增加 1。这就是它们在内存中的表示方式（内存分配）。\n\n**注意-1**：数组的所有元素都将自动初始化为零，但为了用不同的值初始化数组，我们可以在声明时进行初始化。数组的声明、内存分配和初始化步骤可以合并为：\n\
  \n```java\nint a[][]={ {5,7,1}, {1,7,9}, {4,5,7}, {1,1,1} };\n```\n\n**注意-2**：在上述数组中，`a.length`\
  \ 将显示行数，即 4；`a[0].length` 将显示第 0 行的列数，即 3。\n\n## 命令行参数\n\n有时我们希望在运行程序时向程序传递信息。这通过向\
  \ `main()` 方法传递命令行参数来实现。命令行参数是在执行程序时直接跟在程序名称后面的信息。\n\n要在 Java 程序内部访问命令行参数，我们必须使用传递给\
  \ `main()` 的 `String` 数组。\n\nJVM 调用 `main()` 方法并将命令行参数作为字符串数组传递给它。在示例中，数组的长度（即命令行参数的数量）通过\
  \ `length` 属性获取。\n\n`for` 循环在控制台/显示器上显示命令行参数。\n\n## 示例 4.6 从命令行参数输入名称的程序\n\n```java\n\
  class Hello\n{\n    public static void main(String args[])\n    {\n        for(int\
  \ i=0;i<args.length;i++)\n    }\n}\n```\n\n\n\n\n\n```\nSystem.out.println(\"Hello\
  \ \" + args[i]);\n}\n```\n\n`javac Hello.java`\n\n`java Hello Ravi Ajay Vijay`\n\
  \n**输出：**\n```\nHello Ravi\nHello Ajay\nHello Vijay\n```\n\n### 示例 4.7 通过命令行参数输入数字并打印它们的和的程序。\n\
  \n```java\nclass SumCmd {\n    public static void main(String args[]) {\n      \
