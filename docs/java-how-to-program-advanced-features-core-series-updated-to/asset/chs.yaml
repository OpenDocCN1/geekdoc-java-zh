  \        }\n    } else if(b==b3) {\n        String s[]=l2.getSelectedItems();\n\
  \        for(int i=0;i<s.length;i++) {\n            l1.add(s[i]);\n            l2.remove(s[i]);\n\
  \        }\n    } else if(b==b4) {\n        String s[]=l2.getItems();\n        for(int\
  \ i=0;i<s.length;i++) {\n            l1.add(s[i]);\n            l2.remove(s[i]);\n\
  \        }\n    } else if(b==b5) {\n        l1.add(tf1.getText());\n    } else if(b==b6)\
  \ {\n        l2.add(tf2.getText());\n    }\n}\n```\n\n### TextField 和 TextArea\n\
  \n`TextField` 和 `TextArea` 类实现了用于文本输入、显示和编辑的一维和二维组件。这两个类都继承了父类 `TextComponent`：\n\
  `Object` -> `Component` -> `TextComponent` -> (`TextField`, `TextArea`)。\n\n这两个类都拥有多种构造函数，提供了指定或不指定初始字符串或大小的选项。不指定大小的构造函数最适用于布局管理器将忽略组件尺寸的情况。\n\
  \n#### TextField 类的构造函数\n- `TextField()`: 构建一个新的文本字段。\n- `TextField(int columns)`:\
  \ 构建一个具有指定列数的新文本字段。\n- `TextField(String text)`: 构建一个带有指定文本的新文本字段。\n- `TextField(String\
  \ text, int columns)`: 构建一个带有指定文本的新文本字段，其宽度足够容纳指定的列数。\n\n#### TextArea 类的构造函数\n\
  - `TextArea()`: 构建一个带有空字符串的新文本区域。\n- `TextArea(int rows, int columns)`: 构建一个具有指定行数和列数且内容为空的文本区域。\n\
  - `TextArea(String text)`: 构建一个带有指定文本的文本区域。\n- `TextArea(String text, int rows,\
  \ int columns)`: 构建带有指定文本以及指定行数和列数的文本区域。\n- `TextArea(String text, int rows, int\
  \ columns, int ScrollPolicy)`: 构建带有指定文本以及指定的行、列和滚动策略的文本区域。\n\n`TextArea` 类定义了几个常量，可以作为\
  \ `scrollPolicy` 参数的值：\n- `SCROLLBARS_BOTH`\n- `SCROLLBARS_VERTICAL_ONLY`\n- `SCROLLBARS_HORIZONTAL_ONLY`\n\
  - `SCROLLBARS_NONE`\n\n对于这两个类，`columns` 参数都存在一些出人意料的问题。首先，列数是根据特定字体渲染的文本宽度的度量。一个使用微字体的\
  \ 25 列文本区域将非常窄，而一个使用巨大字体的 5 列文本区域将极其宽。其次，存在等比例字体的问题。对于等宽字体，列宽应该是多少显而易见。对于等比例字体，列宽取该字体所有字符宽度的平均值。这个平均值是集合中所有字符的简单平均值；并没有考虑使用频率。因此在大多数情况下，包含小写字母的文本组件显示的字符数将超过请求的数量。\n\
  \n#### TextComponent 类中的方法\n- `String selectText()`: 返回该文本组件显示的文本中的选定文本。\n- `String\
  \ getText()`: 返回该文本组件显示的文本。\n- `void setEditable(Boolean b)`: 设置决定此文本组件是否可编辑的标志。\n\
  - `void setText(String t)`: 将该文本组件显示的文本设为指定的文本。\n\n#### 示例 17.19\n```java\nimport\
  \ java.awt.*;\n\nclass TextFieldTest {\n    public static void main(String args[])\
  \ {\n        Frame f=new Frame ();\n        f.setLayout(new FlowLayout ());\n  \
  \      TextField tf1=new TextField();\n    }\n}\n```\n\n\n\n\n\n```java\nTextField\
  \ tf2 = new TextField(8);\nTextField tf3 = new TextField(\"matrix\");\nTextField\
  \ tf4 = new TextField(\"matrix\", 20);\nTextArea ta1 = new TextArea();\nTextArea\
  \ ta2 = new TextArea(3, 8);\nTextArea ta3 = new TextArea(\"abc\\nxyz\\naaa\");\n\
  TextArea ta4 = new TextArea(\"abc\\nxyz\\naaa\", 2, 2);\nTextArea ta5 = new TextArea(\"\
  abc\\nxyz\\naaa\", 4, 20, TextArea.SCROLLBARS_BOTH);\nf.add(tf1); f.add(tf2); f.add(tf3);\
  \ f.add(tf4);\nf.add(ta1); f.add(ta2); f.add(ta3); f.add(ta4);\nf.add(ta5);\ntf1.setText(\"\
  abc\");\nSystem.out.println(tf3.getText());\ntf3.setEditable(false);\nf.setSize(800,\
  \ 400);\nf.setVisible(true);\n```\n\n输出: ![](img/image0128.jpeg)\n\n### FileDialog\n\
  此类表示文件打开或保存对话框。文件对话框是一个模态对话框，这意味着只要对话框显示在屏幕上，来自父框架的输入将专门定向到对话框。当用户指定文件或点击取消按钮时，对话框会自动移除。最有用的\
  \ `FileDialog` 构造函数形式如下：\n\n`FileDialog(Frame parent, String title, int mode)`\n\
  \n对话框的 `parent` 是对话框将出现的帧。`title` 显示在对话框的标题栏中。`mode` 应该是以下：\n- `FileDialog.LOAD`\n\
  - `FileDialog.SAVE`\n\n在用户指定文件后，可以使用以下方法获取文件名或其目录：\n- `String getDirectory()` 获取此文件对话框选定的目录。\n\
  - `String getFile()` 获取此文件对话框选择的文件。\n\n#### 示例 17.20\n```java\nimport java.awt.*;\n\
  public class FileDialogTest {\n    public static void main(String args[]) {\n  \
  \      Frame f = new Frame();\n        f.setLayout(new FlowLayout());\n        f.setSize(200,\
  \ 200);\n        f.setVisible(true);\n        FileDialog fd = new Dialog(f, \"Load\
  \ file\", FileDialog.LOAD);\n        fd.setVisible(true);\n        System.out.println(fd.getFile());\n\
  \        System.out.println(fd.getDirectory());\n    }\n}\n```\n\n### ScrollPane\n\
  `ScrollPane` 可以包含单个组件，该组件可能比滚动面板本身更高或更宽。如果容器大于滚动面板，那么滚动面板的默认行为是根据需要获取水平/或垂直滚动条。\n\
  \n该类有两个构造函数：\n- `ScrollPane()` 创建一个滚动条策略为“按需”的滚动面板容器。\n- `ScrollPane(int scrollDisplayPolicy)`\
  \ 创建一个具有指定滚动条行为的新滚动面板。滚动面板的显示策略应该是以下之一：\n    - `ScrollPane.SCROLLBARS_AS_NEEDED`（默认）\n\
  \    - `ScrollPane.SCROLLBARS_ALWAYS`\n    - `ScrollPane.SCROLLBARS_NEVER`\n\n下面列出的代码创建了一个具有默认（`As_NEEDED`）滚动条行为的滚动面板。该滚动面板包含一个巨大的按钮；因此肯定需要滚动条。\n\
  \n#### 示例 17.21\n```java\nimport java.awt.*;\nclass SPaneTest {\n    public static\
  \ void main(String args[]) {\n        Frame f = new Frame();\n        f.setLayout(new\
  \ GridLayout(1, 2));\n        f.setSize(250, 150);\n        ScrollPane spane = new\
  \ ScrollPane();\n        spane.setBackground(Color.green);\n        f.add(spane);\n\
  \        f.add(new TextArea());\n        Button b1 = new Button(\"Push Me !\n  \
  \      b1.setFont(new Font(\"Serif\", Font.ITALIC, 100));\n        spane.add(b1);\n\
  \        f.setVisible(true);\n    }\n}\n```\n\n输出: ![](img/image01289.jpeg)\n\n\
  ### Scrollbar\n调整列表和滚动面板的 `Scrollbar` 组件可以作为一个独立的组件使用。有三个构造函数：\n- `Scrollbar()`\
  \ 构建一个新的垂直滚动条。\n- `Scrollbar(int orientation)` 构建一个具有指定方向的新滚动条。\n- `Scrollbar(int\
  \ orientation, int initialValue, int sliderSize, int minValue, int maxValue)` 构建一个具有指定方向、初始值、滑块大小以及最小值和最大值的新滚动条。`sliderSize`\
  \ 参数控制滑块的大小，但不是以像素为单位。\n\n对于接受方向参数的构造函数，该值应该是以下之一：\n- `Scrollbar.HORIZONTAL`\n-\
  \ `Scrollbar.VERTICAL`\n\n#### 示例 17.2\n```java\nimport java.applet.*;\nimport java.awt.*;\n\
  import java.awt.event.*;\n<applet code=\"RGB\" width=500 height=20> */\nclass RGB\
  \ extends Applet implements AdjustmentListener {\n    TextField tf1;\n    Scrollbar\
  \ sb1, sb2, sb3;\n    public void init() {\n        setLayout(new GridLayout(4,\
  \ 1));\n        sb1 = new Scrollbar(Scrollbar.HORIZONTAL, 0, 10, 0, 255);\n    \
  \    sb2 = new Scrollbar(Scrollbar.HORIZONTAL, 0, 10, 0, 255);\n        sb3 = new\
  \ Scrollbar(Scrollbar.HORIZONTAL, 0, 10, 0, 255);\n        sb1.addAdjustmentListener(this);\n\
  \        sb2.addAdjustmentListener(this);\n        sb3.addAdjustmentListener(this);\n\
  \        tf1 = new TextField(8);\n        add(tf1);\n        add(sb1);\n       \
  \ add(sb2);\n        add(sb3);\n    }\n    public void adjustmentValueChanged(AdjustmentEvent\
  \ ae) {\n        int a=0,b=0,c=0;\n        a = sb1.getValue();\n        b = sb2.getValue();\n\
  \        c = sb3.getValue();\n        Color c1 = new Color(a,b,c);\n    }\n}\n```\n\
  \n\n\n\n```java\n29. tf1.setBackground(c1);\n30. }\n31. }\n```\n\n![11](img/image01212.jpeg)\
