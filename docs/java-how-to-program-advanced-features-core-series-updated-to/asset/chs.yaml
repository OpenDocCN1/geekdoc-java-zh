  \ = msg + \"<F2>\"; break;\ncase KeyEvent.VK_F3:\n    msg = msg + \"<F3>\"; break;\n\
  case KeyEvent.VK_PAGE_DOWN:\n    msg = msg + \"<PgDn>\"; break;\ncase KeyEvent.VK_PAGE_UP\
