  \                if(a[i]>a[j]) {\n                    int t=a[i];\n            \
  \        a[i]=a[j];\n                    a[j]=t;\n                }\n        //输出数组\n\
  \        for(int i=0;i<n;i++)\n            System.out.print(a[i]+\"\\t\");\n   \
  \ }\n}\n```\n\n`javac SortCmd.java`\n\n`java SortCmd 5 4 1 3 2`\n\n**输出：**\n```\n\
  1 2 3 4 5\n```\n\n### 多选题：\n\n1. 如果将 `MyProg.java` 编译为应用程序并在命令行中通过 `java MyProg\
