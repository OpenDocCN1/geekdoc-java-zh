  它是 `InputStream` 类的直接子类。为了打开文件进行读取，你只需创建 `FileInputStream` 类的一个对象，并将文件名（直接或间接）作为构造函数的参数传递进去即可。\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `public FileInputStream(String) throws FileNotFoundException`\
  \ | 通过打开与实际文件的连接来创建 `FileInputStream`，该文件是由文件系统中路径名 `filePath` 命名的。 |\n| `public\
  \ FileInputStream(File) throws FileNotFoundException` | 通过打开与实际文件的连接来创建 `FileInputStream`，该文件是由文件系统中\
  \ `File` 对象 `file` 命名的。 |\n| `public native int read() throws IOException` | |\n\
  | `public int read(byte[ ]) throws IOException` | |\n| `public int read(byte[ ],\
  \ int, int) throws IOException` | |\n| `public native long skip(long) throws IOException`\
  \ | |\n| `public native int available() throws IOException` | |\n| `public void\
  \ close() throws IOException` | |\n\n### FileOutputStream\n它是 `OutputStream` 类的直接子类。为了打开文件进行写入，我们只需创建\
  \ `FileOutputStream` 类的一个对象，并将文件名（直接或间接）作为构造函数的参数传递即可。\n\n| 方法 | 描述 |\n| :--- |\
  \ :--- |\n| `public FileOutputStream(String) throws FileNotFoundException` | 创建一个向指定文件写入的输出流。\
  \ |\n| `public FileOutputStream(String, boolean) throws java.io.FileNotFoundException`\
  \ | 创建一个向指定文件写入的输出流。 |\n| `public FileOutputStream(File) throws FileNotFoundException`\
  \ | 创建一个向 `File` 对象代表的文件写入的输出流。 |\n| `public FileOutputStream(File, boolean) throws\
  \ FileNotFoundException` | 创建一个向 `File` 对象代表的文件写入的输出流。 |\n| `public native void\
  \ write(int) throws java.io.IOException` | |\n| `public void write(byte[]) throws\
  \ java.io.IOException` | |\n| `public void write(byte[ ], int, int) throws java.io.IOException`\
  \ | |\n| `public void close() throws java.io.IOException` | |\n\n#### 示例 5.2\n```java\n\
  import java.io.*;\nclass FileRead {\n    public static void main(String args[])\
  \ {\n        FileInputStream fin = null;\n        int a;\n        try {\n      \
  \      fin = new FileInputStream(args[0]);\n            System.out.println(\"No.\
  \ of characters to read=\"+fin.available());\n            fin.skip(3);\n       \
  \     a = fin.read();\n            while(a != -1) {\n                System.out.print((char)a);\n\
  \                a = fin.read();\n            }\n            System.out.println(\"\
  No. of characters to read=\"+fin.available());\n            fin.close();\n     \
  \   } catch (ArrayIndexException e) {\n            System.out.println(e);\n    \
  \    } catch (FileNotFoundException e) {\n            System.out.println(e);\n \
  \       } catch (IOException e) {\n            System.out.println(e);\n        }\n\
  \    }\n}\n```\n输出:\n```text\nA.txt\nNo. of characters to read=20\nComputers\nNo.\
  \ of characters to read=0\n```\n\n### 示例 5.3\n```java\nimport java.io.*;\nclass\
  \ FileCopy {\n    public static void main(String args[]) throws IOException {\n\
  \        FileInputStream fin = null;\n        FileOutputStream fout = null;\n  \
  \      fin = new FileInputStream(args[0]);\n        fout = new FileOutputStream(args[1]);\n\
  \        int a;\n        a = fin.read();\n        while(a != -1) {\n           \
  \ fout.write(a);\n            a = fin.read();\n        }\n        fin.close();\n\
  \        fout.close();\n    }\n}\n```\n\n#### 示例 5.4\n```java\nimport java.io.*;\n\
  class CopyFile {\n    public static void main(String args[]) throws IOException\
  \ {\n        int n;\n        FileInputStream fin = new FileInputStream(\"A.txt\"\
  );\n        FileOutputStream fout = new FileOutputStream(\"B.txt\");\n        byte\
  \ b[] = new byte[10];\n        n = fin.read(b);\n        while(n != -1) {\n    \
  \        fout.write(b,0,n);\n            n = fin.read(b);\n        }\n        fin.close();\n\
  \        fout.close();\n    }\n}\n```\n\n### FileReader\n\n\n\n\n\n### FileReader\n\
  `FileReader` 类创建了一个 `Reader`，你可以用它来读取文件的内容。它最常用的两个构造函数是：\n\n- `FileReader(File file)`：创建一个\
  \ `FileReader` 流，用于从指定的文件读取内容。\n- `FileReader(String fileName)`：创建一个 `FileReader`\
  \ 流，用于从指定的文件读取内容。\n\n**注意：** 如果文件不存在、是一个目录而不是普通文件，或者由于其他原因无法打开读取，任何一个构造函数都会抛出 `FileNotFoundException`。\n\
  \n## FileWriter\n`FileWriter` 类创建了一个写入器，你可以用它写入文件。它最常用的两个构造函数是：\n\n### 构造函数\n- `FileWriter(File\
  \ file)`：构造一个 `FileWriter` 对象以写入指定文件。\n- `FileWriter(String fileName)`：构造一个 `FileWriter`\
  \ 对象以写入指定文件。\n- `FileWriter(File file, boolean append)`：构造一个 `FileWriter` 对象，以追加模式写入指定文件。\n\
  - `FileWriter(String filename, boolean append)`：构造一个 `FileWriter` 对象，以追加模式写入指定文件。如果使用前两个构造函数，则总是创建一个新文件。如果存在同名的文件，它会被删除。如果使用后两个构造函数且\
  \ `append` 标志为 false，则它们的行为与前两个构造函数相同。\n\n如果 `append` 标志为 true，则以追加模式打开文件，即如果文件已存在，文件指针将指向文件末尾；如果文件不存在，则创建一个新文件。\n\
  \n**注意：**\n如果文件存在但是目录而不是普通文件、不存在但无法创建，或由于其他原因无法打开，这些构造函数可能会抛出 `IOException`。例如，当你尝试打开一个只读文件时，将抛出\
  \ `IOException`。\n\n### 示例 15.5\n```java\nimport java.io.*;\nclass FileCopy {\n\
  \    public static void main(String args[]) throws IOException {\n        FileReader\
  \ fin=null;\n        FileWriter fout=null;\n        fin=new FileReader(args[0]);\n\
  \        fout=new FileWriter(args[1]);\n        int a;\n        a = fin.read();\n\
  \        while(a != -1) {\n            fout.write((char)a);\n            a = fin.read();\n\
  \        }\n        fin.close();\n        fout.close();\n    }\n}\n```\n\n## RandomAccessFile\n\
  `RandomAccessFile` 封装了一个随机访问文件。`RandomAccessFile` 允许我们在使用适当访问权限的情况下，从文件的任意位置读取或写入写入字节、文本和原始数据类型。它没有继承自\
  \ `InputStream`，而是实现了 `DataInput` 和 `DataOutput` 接口，这两个接口定义了基本的 I/O 方法。它还支持定位请求——也就是说你可以将文件指针定位到文件的任何位置。\n\
  \n`mode` 参数指定打开文件时的访问模式。允许的值及其含义如下：\n\n| 值 | 含义 |\n| :--- | :--- |\n| \"r\" | 仅读打开。调用结果对象的任何写入方法都会导致抛出\
  \ `IOException`。 |\n| \"rw\" | 读写打开。如果文件不存在，则将尝试创建它。 |\n| \"rws\" | 读写打开，与 \"rw\"\
  \ 相同，并且要求对文件内容或元数据的每次更新都同步写入底层存储设备。 |\n| \"rwd\" | 读写打开，与 \"rw\" 相同。并且要求对文件内容（数据）的每次更新都同步写入底层存储设备。\
  \ |\n\n### RandomAccessFile 类的方法\n除了 `DataInput` 和 `DataOutput` 接口的方法外，该类的一些常用方法包括：\n\
  \n- `public RandomAccessFile(String, String) throws java.io.FileNotFoundException`：创建一个随机访问文件流，用于读取并可选地写入指定名称的文件。\n\
  - `public RandomAccessFile(File, String) throws FileNotFoundException`：创建一个随机访问文件流，用于读取并可选地写入\
  \ `File` 参数指定的文件。\n- `public native int read() throws java.io.IOException`\n- `public\
  \ int read(byte[], int)`\n- `public int read(byte[])`\n- `public int skip(int)`\n\
  - `public native void write(int)`\n- `public void write(byte[])`\n- `public void\
  \ write(byte[], int)`\n- `public native long getPointer()`\n- `public void seek(long)`\n\
  - `public native long length()`\n- `public void setLength(long)`\n- `public void\
  \ close()`\n- `public boolean readBoolean()`\n- `public byte readByte()`\n- `public\
  \ int readUnsignedByte()`\n- `public short readShort()`\n- `public int readUnsignedShort()`\n\
  - `public char readChar()`\n- `public int readInt()`\n- `public long readLong()`\n\
  - `public float readFloat()`\n- `public double readDouble()`\n- `public String readLine()`\n\
  - `public String readUTF()`\n- `public void writeBoolean(boolean)`\n- `public void\
  \ writeByte(int)` （逻辑中已列出）\n- `public void writeChar(int)`\n- `public void writeInt(int)`\n\
  - `public void writeLong(long)`\n- `public void writeFloat(float)`\n- `public void\
  \ writeDouble(double)`\n- `public void writeBytes(String)`\n- `public void writeChars(String)`\n\
  - `public void writeUTF(String)`\n\n### 示例 15.6\n```java\nimport java.io.*;\nclass\
  \ RandomIO {\n}\n```\n\n\n\n\n```java\npublic static void main(String args[]) throws\
  \ IOException {\n    RandomAccessFile file = null;\n    try {\n        file = new\
  \ RandomAccessFile(\"rand.dat\", \"rw\");\n        file.writeChar('X');\n      \
  \  file.writeInt(1999);\n        file.writeDouble(222.44);\n        System.out.println(\"\
  File pointer Pos:\"+file.getFilePointer());\n        file.seek(0);\n        System.out.println(file.readChar());\n\
  \        System.out.println(file.readInt());\n        System.out.println(file.readDouble());\n\
  \        System.out.println(\"File pointer Pos:\"+file.getFilePointer());\n    \
  \    file.seek(2);\n        System.out.println(\"File Pos:\"+file.getFilePointer());\n\
  \        System.out.println(file.readInt());\n        file.seek(file.length());\n\
  \        file.writeBoolean(false);\n        file.seek(4);\n        System.out.println(file.readBoolean());\n\
  \        System.out.println(\"File Pos:\"+file.getFilePointer());\n        System.out.println(file.readInt());//\
  \ Exception\n    } catch (EOFException e) {\n        System.out.println(\"Trying\
  \ to read after end of file\");\n    } finally {\n        file.close();\n    }\n\
  }\n```\n**输出：**\nFile Pos:14\nX\n1999\n222.4\nFile Pos:4\nfalse\nFile Pos:15\nTrying\
  \ to read after end of file\n\n注意：如果尝试在文件末尾之后进行读取，会发生 `EOFException`。\n\n### ByteArrayInputStream\n\
  `ByteArrayInputStream` 是一个使用字节数组作为源的输入流实现。它包含一个内部字节缓冲区，可以从流中中读取这些字节。该类有两个构造函数，每个构造函数都需要一个字节数组来提供数据。它实现了\
  \ `mark()` 和 `reset()` 方法。然而，如果没有调用 `mark()`，则 `reset()` 将指针置于流的开头。\n\n- `ByteArrayInputStream(byte[])`\n\
  - `ByteArrayInputStream(byte[], int, int)`\n- `synchronized int read()`\n- ` int\
  \ int read(byte[], int, int)`\n- `synchronized long skip(long)`\n- `synchronized\
  \ int available()`\n- `boolean markSupported()`\n- `void mark(int)`\n- `synchronized\
  \ void reset()`\n- `void close() throws IOException`\n\n#### 示例 5.7\n```java\nimport\
  \ java.io.*;\nclass ByteArrayInputStreamTest {\n    public static void main(String\
  \ args[]) throws IOException {\n        String s1=\"abcdefghijk\";\n        byte\
  \ b[]=s1.getBytes();\n        ByteArrayInputStream b1 = new ByteArrayInputStream(b);\n\
  \        int a;\n        while((a=b1.read())=-1) {\n            System.out.print((char)Character.toUpperCase(a));\n\
  \        }\n        b1.close();\n    }\n}\n```\n**输出：** ABCDEFGHIJK\n\n#### 示例 5.8\n\
  ```java\nimport java.io.*;\nclass ByteArrayOutputStreamTest {\n    public static\
  \ void main(String args[]) throws IOException {\n        ByteArrayOutputStream b1\
  \ = new ByteArrayOutputStream();\n        b1.write('a');\n        String s1 = \"\
  abcdefghijk\";\n        byte arr1[]= s1.getBytes();\n        b1.write(arr1);\n \
  \       System.out.println(b1);  //toString()\n        // 使用 for 循环显示\n        byte\
  \ arr2[] = b1.toByteArray();\n        for(int i=0;i<arr2.length;i++) {\n       \
  \     System.out.print((char)arr2[i]);\n        }\n        System.out.println();\n\
  \        // 使用 each 循环显示\n        for(int i:arr2) {\n            System.out.print((char)i);\n\
  \        }\n        b1.close();\n    }\n}\n```\n\n### ByteArrayOutputStream\n`ByteArrayOutputStream`\
  \ 实现了一个写入字节数组的输出流。`ByteArrayOutputStream` 是一个使用字节数组作为目的地的输出流实现。缓冲区存储在 `ByteArrayOutputStream`\
  \ 的 `buf` 字段中。如果需要，缓冲区的大小会自动增大。缓冲区持有的字节数包含在 `count` 字段中。\n\n- `ByteArrayOutputStream()`\n\
  - `ByteArrayOutputStream(int)`\n- `synchronized void write(int)`\n- `synchronized\
  \ void write(byte[], int, int)`\n- `synchronized void writeTo(io.OutputStream) throws\
  \ IOException`\n- `synchronized void reset()`\n- `synchronized byte[] toByteArray()`\n\
  - `synchronized int size()`\n- `synchronized String toString()`\n- `synchronized\
  \ String toString(String) throws UnsupportedEncodingException`\n- `synchronized\
  \ String toString(int)`\n- `void close() throws IOException`\n\n\n\n\n从指定的字符数组创建一个\
  \ `CharArrayReader`。生成的读取器将从指定的偏移量开始读取。从此读取器可以读取的字符值总数将是 `length` 或 `buf.length`。\n\
  \n### 示例 15.9\n\n```java\nimport java.io.*;\n\nclass CharArrayReaderTest {\n   \
  \ public static void main(String args[]) throws IOException {\n        String tmp\
  \ = \"abcdefghijklmnopqrstuvwxyz\";\n        int length = tmp.length();\n      \
  \  char c[] = new char[length];\n        tmp.getChars(0, length, c, 0);\n      \
  \  CharArrayReader input1 = new CharArrayReader(c);\n        CharArrayReader input2\
  \ = new CharArrayReader(c, 0, 5);\n        int i;\n        while ((i = input1.read())\
  \ != -1) {\n            System.out.print((char)i);\n        }\n        System.out.println();\n\
  \        while ((i = input2.read()) != -1) {\n            System.out.print((char)i);\n\
  \        }\n    }\n}\n```\n**输出：**\nabcdefghijklmnopqrstuvwxyz\nabcde\n\n### CharArrayWriter\n\
  \n`CharArrayWriter` 是一个写入流的实现，它使用字符数组缓冲区作为目标。\n\n### 构造函数\n- `CharArrayWriter()`\n\
  - `CharArrayWriter(int initialSize)`\n\n在第一种形式中，将创建一个具有默认大小的缓冲区。在第二种形式中，创建一个按参数\
  \ `initialSize` 指定大小的缓冲区。\n\n缓冲区存储在 `CharArrayWriter` 的 `buf` 字段中。如果需要，缓冲区的大小将会增加。缓冲区包含的字符数量由\
  \ `CharArrayWriter` 的 `count` 字段。`buf` 和 `count` 都是保护字段。\n\n#### 示例 15.10\n\n```java\n\
  import java.io.*;\n\nclass CharArrayWriterTest {\n    public static void main(String\
  \ args[]) throws IOException {\n        CharArrayWriter f = new CharArrayWriter();\n\
  \        String s = \"This should end up in the array\";\n        char buf[] = new\
  \ char[s.length()];\n        s.getChars(0, s.length(), buf, 0);\n        f.write(buf);\n\
  \        System.out.println(f.toString());\n        char c[] = f.toCharArray();\n\
  \        for (int i = 0; i < c.length; i++) {\n            System.out.print(c[i]);\n\
  \        }\n        FileWriter f2 = new FileWriter(\"test.txt\");\n        f.writeTo(f2);\n\
  \        f2.close();\n        f.reset();\n        System.out.println();\n      \
  \  System.out.println(\"After:\" + f.toString());\n        for (int i = 0; i < 3;\
  \ i++) {\n            f.write('A');\n            System.out.println(f.toString());\n\
  \        }\n    }\n}\n```\n**输出：**\nThis should end up in the array\nThis should\
  \ end up in the array\nAfter:AAA\n\n### 推回输入流 (Push back Input Stream)\n\n`PushbackInputStream`\
  \ 为另一个输入流增加了功能，即“推回”或“重读”一个字节的能力。缓冲区的用途之一就是实现推回。`pushback` 用于输入流，允许读取一个字节后将其返回流中。除了\
  \ `InputStream` 类常见的方法外，`PushbackInputStream` 还提供了此处所示的 `unread()` 方法：\n\n| `public\
  \ java.io.PushbackInputStream(java.io.InputStream, int);` 创建一个具有指定大小推回缓冲区的 `PushbackInputStream`，并保存其参数输入流以备后用。这允许将多个字节返回输入流。\
  \ |\n| `public java.io.PushbackInputStream(java.io.InputStream);` 创建一个 `PushbackInputStream`\
  \ 并保存其参数输入流以备后用。这允许将一个字节返回输入流。 |\n| `public int read() throws java.io.IOException;`\
  \ |\n| `public int read(byte[], int, int) throws java.io.IOException;` |\n| `public\
  \ void unread(int) throws java.io.IOException;` 通过将字节复制到推回缓冲区前端来推回一个字节。 |\n| `public\
  \ void unread(byte[], int, int) throws java.io.IOException;` 通过将字节数组的一部分复制到推回缓冲区前端来推回部分字节数组。\
  \ |\n| `public void unread(byte[]) throws java.io.IOException;` 通过将字节数组复制到推回缓冲区前端来推回整个字节数组。\
  \ |\n| `public int available() throws java.io.IOException;` |\n| `public long skip(long)\
  \ throws java.io.IOException;` |\n| `public boolean markSupported();` `PushbackInputStream`\
  \ 的副作用是会使用于创建它的 `InputStream` 的 `mark()` 或 `reset()` 方法失效。使用 `markSupported()` 方法检查你将要使用\
  \ `mark()/reset()` 的任何流。 |\n| `public synchronized void mark(int);` |\n| `public\
  \ synchronized void reset() throws java.io.IOException;` |\n| `public synchronized\
  \ void close() throws java.io.IOException;` |\n\n#### 示例 15.11\n\n```java\nimport\
  \ java.io.*;\n\nclass PushbackInputStreamTest {\n    public static void main(String\
  \ args[]) throws IOException {\n        FileInputStream fin = new FileInputStream(\"\
  A.txt\");\n        PushbackInputStream p1 = new PushbackInputStream(fin);\n    \
  \    int ch = p1.read();\n        System.out.println((char)ch);\n        ch = p1.read();\n\
  \        System.out.println((char)ch);\n        ch = p1.read();\n        System.out.println((char)ch);\n\
  \        p1.unread(ch); // or p1.unread('z')\n        ch = p1.read();\n        System.out.println((char)ch);\n\
  \    }\n}\n```\n**输出：**\nA.txt 包含 “Matrix Computers”\nm\na\nt\n\n\n\n\n\n| 方法签名\
  \ | 描述 |\n| :--- | :--- |\n| `public int read(char[], int, int) throws java.io.IOException;`\
  \ | |\n| `public void unread(int) throws java.io.IOException;` | 将单个字符推回。 |\n| `public\
  \ void unread(char[], int, int) throws java.io.IOException;` | 将字符数组的一部分拷贝到回退缓冲区头部，将其推回。\
  \ |\n| `public void unread(char[]) throws java.io.IOException;` | 将一个数组拷贝到回退缓冲区头部，将其推回。\
  \ |\n| `public boolean ready() throws java.io.IOException;` | |\n| `public void\
  \ mark(int) throws java.io.IOException;` | |\n| `public void reset() throws java.io.IOException;`\
  \ | |\n| `public boolean markSupported();` | |\n| `public void close() throws java.io.IOException;`\
  \ | |\n| `public long skip(long) throws java.io.IOException;` | |\n\n注意：当回退缓冲区满时尝试返回字符，将抛出\
  \ `IOException`。\n\n### 示例 15.12\n\n```java\nimport java.io.*;\nclass PushbackReaderTest\
  \ {\n    public static void main(String args[]) throws IOException {\n        FileReader\
  \ fr = new FileReader(\"A.txt\");\n        PushbackReader pr=new PushbackReader(fr);\n\
  \        int ch=pr.read();\n        System.out.println((char)ch);\n        ch=pr.read();\n\
  \        System.out.println((char)ch);\n        ch=pr.read();\n        System.out.println((char)ch);\n\
  \        pr.unread(ch);\n        ch=pr.read();\n        System.out.println((char)ch);\n\
  \    }\n}\n```\n**输出：**\n```\nm\na\nt\nt\n```\n\n### SequenceInputStream\n\n`SequenceInputStream`\
  \ 类是一个字节流，允许你连接多个 `InputStream`。序列 `InputStream` 的构造与其他任何 `InputStream` 都不同。`SequenceInputStream`\
  \ 构造函数使用一对 `InputStream` 类或 `InputStream` 类的 `Enumeration` 作为其参数：\n\n- `SequenceInputStream(InputStream\
  \ is1, InputStream is2)`：通过记住两个参数来初始化新的 `SequenceInputStream`，这两个参数将按顺序读取（先是 `is1`\
  \ 然后是 `is2`），以提供从该 `SequenceInputStream` 读取字节。\n- `SequenceInputStream(Enumeration\
  \ e)`：通过记住参数来初始化新的 `SequenceInputStream`，该参数必须是一个产生运行时类型为 `InputStream` 的对象的 `Enumeration`。\n\
  \n在操作上，该类会从第一个 `InputStream` 满足读取请求，直到其耗尽，然后切换到第二个。在 `Enumeration` 的情况下，它将继续遍历所有的\
  \ `InputStream` 直到达到最后一个的结束。\n\n### 示例 15.13\n\n在下面的示例中，将文件名作为命令行参数给出：\n\n```java\n\
  import java.io.*;\nclass SequenceInputStreamTest {\n    public static void main(String\
  \ args[]) throws IOException {\n        FileInputStream f1 = new FileInputStream(args[0]);\n\
  \        FileInputStream f2 = new FileInputStream(args[1]);\n        FileOutputStream\
  \ f3 = new FileOutputStream(args[2]);\n        SequenceInputStream sis = new SequenceInputStream(f1,f2);\n\
  \        int c;\n        while((c = sis.read()) != -1) {\n            f3.write(c);\n\
  \        }\n        f3.close();f1.close();f2.close();\n    }\n}\n```\n**执行：** `java\
  \ SequenceInputStreamTest A.txt B.txt C.txt`\n\n### PrintStream\n\n它是一个字节流类，继承自\
  \ `FilterOutputStream`。`PrintStream` 为另一个输出流增加了功能，即方便地打印各种数据值表示的能力。\n\n可选地，可以创建一个\
  \ `PrintStream` 以便自动刷新（flush）；这意味着在写入字节数组、调用其中一个 `println` 方法或写入换行符或字节 `('\\n')`\
  \ 后，会自动调用 `flush` 方法。\n\n`PrintStream` 打印的所有字符都将使用平台的默认字符编码转换为字节，然后写入构造函数中指定的 `OutputStream`\
  \ 或 `File`。\n\n#### 构造函数：\n\n- `PrintStream(File file)`：使用指定的文件创建一个新的打印流，且不进行自动行刷新。\n\
  - `PrintStream(String fileName)`：使用指定的文件名创建一个新的打印流，且不进行自动行刷新。\n- `PrintStream(OutputStream\
  \ out)`：连接到指定的 `OutputStream` 创建一个新的打印流。\n- `PrintStream(OutputStream out, boolean\
  \ autoFlush)`：连接到指定的 `OutputStream` 创建一个新的打印流。\n\n### 示例 15.4\n\n```java\nimport\
  \ java.io.*;\nclass PrintStream {\n    public static void main(String args[]) throws\
  \ IOException {\n        PrintStream ps = new PrintStream(System.out, true);\n \
  \       ps.println(\"This is a string\");\n        int i = -7;\n        ps.println(i);\n\
  \        double d = 4.5e-7;\n        ps.println(d);\n    }\n}\n```\n**输出：**\n```\n\
  This is a string\n-7\n4.5E-7\n```\n\n### 示例 15.15\n\n```java\nimport java.io.*;\n\
  class PrintStreamTest2 {\n    public static void main (String argv[]) throws IOException\
  \ {\n        FileOutputStream fout = new FileOutputStream(\"test.dat\");\n     \
  \   PrintStream ps = new PrintStream(fout, true);\n        ps.println(\"This is\
  \ a string\");\n        int i = -7;\n        ps.println(i);\n        double d =\
  \ 4.5e-7;\n        ps.println(d);\n    }\n}\n```\n\n\n\n\n\n## PrintWriter 构造函数\n\
  \n创建一个新的 `PrintWriter`，不自动刷新行缓冲区，用于写入指定的 `OutputStream`。\n\n`PrintWriter(OutputStream\
  \ out, boolean autoFlush)`\n\n创建一个新的 `PrintWriter`，用于写入指定的 `OutputStream`。\n\n`PrintWriter(Writer\
  \ out)`\n\n创建一个新的 `PrintWriter`，不自动刷新行缓冲区，用于写入指定的 `Writer`。\n\n`PrintWriter(Writer\
  \ out, Boolean autoFlush)`\n\n创建一个新的 `PrintWriter`，用于写入指定的 `Writer`。\n\n## 用法与方法\n\
  \n最常用的构造函数是：\n\n`PrintWriter(OutputStream os, boolean flushOnNewLine)` （等待，通常为 `autoFlush`）\
  \ \n\n在这里，`os` 是一个 `OutputStream` 类型的对象，而 `flushOnNewLine` 控制 Java 是否在每次调用 `println()`\
  \ 方法时刷新输出流。如果 `flushOnNewLine` 为 `true`，则会自动进行刷新。如果为 `false`，则不进行自动刷新。\n\n`PrintWriter`\
  \ 支持对所有类型（包括对象在内的所有类型）的 `print()` 和 `println()` 方法。如果参数不是简单类型，`PrintWriter` 方法将调用对象的\
  \ `toString()` 方法并打印结果。\n\n要使用 `PrintWriter` 写入控制台，请为输出流指定 `System.out` 并在新行后刷新流。例如，此行代码创建了一个连接到控制台输出的\
  \ `PrintWriter`。\n\n`PrintWriter pw = new PrintWriter(System.out, true)`\n\n## 示例\
