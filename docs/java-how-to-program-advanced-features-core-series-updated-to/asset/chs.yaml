  \n# 章节 ∞ 10 ∞\n## (String 和 StringBuffer)\n\n### 引言\n在 Java 中，`Strings` 是类对象，并通过两个类实现，即\
  \ `String` 和 `StringBuffer`。与 C 语言字符串相比，Java 的 `String` 更可靠且可预测。这基本上是因为 C 语言缺乏边界检查。Java\
  \ 的 `String` 不是字符数组，也不是以 NULL 结尾的。通常情况下，Java 不允许将运算符应用于 `String` 对象。\n\n该规则的唯一例外是\
  \ `+` 和 `+=` 运算符，它们可以连接两个字符串并产生一个 `String` 对象。在 Java 中，字符数组不被视为字符串。Java 的 `String`\
  \ 类用于执行所有的字符串操作。`String` 类和 `StringBuffer` 类是 `java.lang` 包的一部分。\n\n### String 类\n\
  \n```java\nString s1 = new String(\"matrix\");\nString s2 = \"matrix\";\nSystem.out.println(s1);\n\
  System.out.println(s1.length);\nSystem.out.println(\"matrix\".length);\n```\n\n\
  `String` 在 Java 中具有以下特性：\n\n#### [i] String 在 Java 中是一个对象\n`String` 表示一个字符序列，但与其他许多使用字符数组实现\
  \ `String` 的语言不同，Java 将字符串实现为 `string` 类型的对象。\n\n字符串操作是许多 Java 程序中最常见的部分。将字符串实现为内置对象允许\
  \ Java 提供全方位的特性，使得字符串处理变得方便。此外，字符串对象可以通过多种方式构建，以便在需要时易于获取字符串。\n\n#### [ii] String\
  \ 是不可变的\n`String` 是不可变的，也就是说我们无法在创建后更改字符串。然而，声明为 `String` 引用的变量可以随时更改指向其他字符串对象。\n\
  \n我们仍然可以执行所有类型的字符串操作。每当我们我们需要一个现有字符串的修改版本时，都会创建一个包含修改内容的新字符串对象。\n\n原始字符串保持不变。使用这种方法是因为固定的、不可变的字符串可以比可变的字符串实现得更高效。\n\
  \n对于那些需要修改字符串的情况，有一个名为 `StringBuffer` 的伴随类，其对象包含可以在创建后进行修改的字符串。\n\n#### [iii] String\
  \ 类是 final 的\n`String` 和 `StringBuffer` 类都是 `final` 的。这意味着我们不能在其他类中扩展 `String` 类。这允许某些优化，以提高常用字符串操作的性能。\n\
  \n### String 类的构造函数与方法\n\n| # | 方法 | 描述 | 示例 |\n|:---:|---|---|:---|\n| 1 | `public\
  \ String()` | 初始化新创建的 `String` 对象，使其表示空字符序列。 | `String s1 = new String();` |\n|\
  \ 2 | `public String(String str)` | 初始化新创建的 `String` 对象，使其表示与参数相同的字符序列；换句话说，新创建的字符串是参数字符串的拷贝。\
  \ | `String s1 = new String(\"Matrix\"); String s2 = new String(s1);` 字符串 `s2` 是字符串\
  \ `s1` 的拷贝。尽管内容相同，但 `s1` 和 `s2` 指向不同的字符串对象。 |\n| 3 | `public String(char ch[])`\
  \ | 分配一个新的 `String`，表示字符数组参数当前包含的字符序列。 | `char ch[] = {'a', 'b', 'c'}; String s1\
  \ = new String(ch);` // `s1` 将持有 \"abc\" |\n| 4 | `public String(char value[], int\
  \ offset, int count)` | 分配一个新的 `String`，包含来自字符数组参数子数组的字符。 | `char ch[] = {'a', 'b',\
  \ 'c', 'd', 'e', 'f'}; String s1 = new String(ch,2,3);` // `s1` 将持有 \"cde\" |\n\
  | 5 | `public String(int value[], int offset, int count)` | 分配一个新的 `String`，包含来自包含字符\
  \ Unicode 的整数数组参数子数组的字符。 | `int a[] = {97, 98, 99, 100, 101, 102}; String s1 = new\
  \ String(a,2,3);` // `s1` 将持有 \"cde\" |\n| 6 | `public String(byte b[], int offset,\
  \ int count)` | 使用平台默认字符集解码指定的字节子数组以构造新的 `String`。 | `byte b[] = {97, 98, 99, 100,\
  \ 101, 102}; String s1 = new String(b,2,3);` // `s1` 将持有 \"cde\" |\n| 7 | `public\
  \ String(byte[])` | 使用平台默认字符集解码指定的字节数组以构造新的 `String`。 | `byte b[] = {97, 98, 99};\
  \ String s1 = new String(b);` // `s1` 将持有 \"abc\" |\n| 8 | `public String(StringBuffer)`\
  \ | | |\n| 9 | `public int length()` | 显示字符串的字符数量。 | |\n| 10 | `public boolean isEmpty()`\
  \ | 如果字符串为空，则显示 true，否则显示 false。 | `String s1 = new String(); System.out.println(s1.isEmpty());`\
  \ |\n| 11 | `public char charAt(int index)` | 返回指定索引处的字符值。索引范围从 0 到 `length()`–1。\
  \ | `String s1 = \"matrix\"; System.out.println(s1.charAt(0));` // 输出 \"m\" |\n\
  | 12 | `public void getChars(int srcBegin, int srcEnd, char[] dst, int dstBegin)`\
  \ | 将字符从此字符串拷贝到目标数组。 | |\n| 13 | `public void getBytes(int srcBegin, int srcEnd,\
  \ byte dst[], int dstBegin)` | | |\n| 14 | `public byte[] getBytes()` | 使用平台默认字符集将字符串编码为字节序列。\
  \ | | |\n| 15 | `public boolean equals(Object)` | 将调用字符串与指定对象。当参数不为空且是表示调用字符串相同字符序列的\
  \ `String` 对象时，结果为 true。 | | |\n| 16 | `public boolean equalsIgnoreCase(String)`\
  \ | 在忽略大小写的情况下比较调用字符串与另一个字符串。 | | |\n| 17 | `public int compareTo(String)` | 按字典顺序比较调用字符串与作为参数的字符串。\
  \ | | |\n| 18 | `public int compareToIgnoreCase(String)` | 在忽略大小写的情况下按字典顺序比较两个字符串。\
  \ | | |\n| 19 | `public boolean regionMatches(int startIndex, String str2, int str2StartIndex,\
  \ int len)` | 测试两个字符串区域是否相等。 | | |\n| 20 | `public boolean regionMatches(Boolean\
  \ ignoreCase, int startIndex, String str2, int str2StartIndex, int len)` | 测试两个字符串区域是否相等。如果\
  \ `ignoreCase` 标志为 true，则忽略大小写差异。 | | |\n| 21 | `public boolean startsWith(String\
  \ prefix, int startIndex)` | 测试此字符串从指定索引开始是否以指定的前缀开头。 | | |\n\n\n\n\n\n## String\
  \ 方法参考\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `public boolean startsWith(String)` |\
  \ 测试此字符串是否以指定的前缀开头。 |\n| `public boolean endsWith(String suffix)` | 测试此字符串是否以指定的后缀结尾。\
  \ |\n| `public int indexOf(char ch)` | 返回指定字符在此字符串中第一次出现的索引。 |\n| `public int indexOf(char\
  \ ch, int fromIndex)` | 从指定的索引开始搜索，返回指定字符在此字符串中第一次出现的索引。 |\n| `public int indexOf(String\
  \ str)` | 返回指定子字符串在此字符串中第一次出现的索引。 |\n| `public int indexOf(String str, int fromIndex)`\
  \ | 从指定的索引开始搜索，返回指定子字符串在此字符串中第一次出现的索引。 |\n| `public int lastIndexOf(int ch)` | 返回指定字符在此字符串中最后一次出现的索引。\
  \ |\n| `public int lastIndexOf(int ch, int fromIndex)` | 从指定的索引开始向后搜索，返回指定字符在此字符串中最后一次出现的索引。\
  \ |\n| `public int lastIndexOf(String str)` | 返回指定子字符串在此字符串中最后一次出现的索引。 |\n| `public\
  \ int lastIndexOf(String str, int fromIndex)` | 从指定的索引开始向后搜索，返回指定子字符串在此字符串中最后一次出现的索引。\
  \ |\n| `public String substring(int)` | 获取从第 n 个字符开始的子字符串 |\n| `public String substring(int\
  \ n, int m)` | 获取从第 n 个字符开始到第 m 个字符（不包含第 m 个）的子字符串 |\n| `public String concat(String\
  \ str)` | 将字符串 `str` 拼接调用字符串对象的末尾。 |\n| `public String replace(char x, char y)`\
  \ | 将所有的 `x` 替换为 `y` |\n| `public String replaceFirst(String, String)` | |\n| `public\
  \ String replaceAll(String, String)` | |\n| `public String toLowerCase()` | 将字符串转换为小写\
  \ |\n| `public String toUpperCase()` | 将字符串转换为大写 |\n| `public String trim()` | 去除开头和结尾的空格\
  \ |\n| `public char[] toCharArray()` | 将调用的字符串转换为新的字符数组。提供此函数是为了方便，因为可以使用 `getChars()`\
  \ 达到相同的结果 |\n| `public static String valueOf(Object)` | 创建参数 `p`（简单类型或对象）的字符串对象\
  \ |\n\n## 字符串数组\n\n我们也可以创建并使用包含字符串的数组。\n\n### 示例 10.1\n\n```java\nimport java.util.Scanner;\n\
  class StringArrSort {\n    public static void main(String args[]) {\n        Scanner\
  \ sc = new Scanner(System.in);\n        System.out.print(\"Enter how many names\
  \ \");\n        int n = sc.nextInt();\n        String s[] = new String[n];\n   \
  \     // input\n        for (int i = 0; i < n; i++) {\n            System.out.println(\"\
  Enter \" + (i + 1));\n            s[i] = sc.next();\n        }\n        // sorting\n\
  \        for (int i = 0; i < n - 1; i++) {\n            for (int j = i + 1; j <\
  \ n; j++) {\n                if (s[i].compareTo(s[j]) > 0) {\n                 \
  \   String t = s[i];\n                    s[i] = s[j];\n                    s[j]\
  \ = t;\n                }\n            }\n        }\n        // output\n       \
  \ for (int i = 0; i < n; i++) {\n            System.out.println(s[i]);\n       \
  \ }\n    }\n}\n```\n\n## 字符串转换与 toString()\n\n当 Java 在拼接过程中将数据转换为其字符串表示时，它是通过调用\
  \ `String` 类定义的字符串转换方法的重载版本 `valueOf()` 实现的。`valueOf()` 是一个静态方法，针对所有简单类型和 `Object`\
  \ 类型进行了重载。\n\n对于简单类型，`valueOf()` 返回一个包含调用值的人类可读等价值的字符串。对于对象，`valueOf()` 会调用对象上的\
  \ `toString()` 方法。\n\n每个类都继承 `toString()`，因为它是由 `Object` 类定义的。然而，`toString()` 的默认实现很少是足够的。它显示类名，后跟符号“@”，然后是对象\
  \ ID（例如 `Box@ab1342`），这通常没有用处。对于我们创建的大多数重要类，我们希望重写 `toString()` 并提供我们自己的字符串表示。\n\
  \n### 示例 10.2\n\n```java\nclass A {\n    private int x,y;\n    A() {\n        x\
  \ = y = 0;\n    }\n    A(int x1, int y1) {\n        x = x1;\n        y = y1;\n \
  \   }\n}\nclass ToStringTest {\n    public static void main(String args[]) {\n \
  \       A a1 = new A(5,6);\n        System.out.println(a1); // 调用了 Object 类的 toString()\n\
  \        String s1=\"Object a1 is \" + a1; // 对象与字符串拼接\n        //再次调用了 Object 的\
  \ toString()\n        System.out.println(s1);\n    }\n}\n```\n**输出:**\n```\nA@3e25a5\n\
  Object a1 is A@3e25a5\n```\n\n### 示例 10.3\n\n```java\nclass A {\n    private int\
  \ x,y;\n    A() {\n        x = y = 0;\n    }\n    A(int x1, int y1) {\n        x\
  \ = x1;\n        y = y1;\n    }\n    public String toString() {\n        return\
  \ (x + \",\" + y);\n    }\n}\nclass ToStringTest2 {\n    public static void main(String\
  \ args[]) {\n        A a1 = new A(5,6);\n        System.out.println(a1); // 调用了\
  \ A 类的 toString()\n        String s1=\"Object a1 is \" + a1; // 对象与字符串拼接\n     \
  \   //再次调用了 A 的 toString()\n        System.out.println(s1);\n    }\n}\n```\n**输出:**\n\
  ```\n5,6\nObject a1 is 5,6\n```\n\n### 示例 10.4\n\n```java\nimport java.util.*;\n\
  class FindTest {\n    public static void main(String args[]) {\n        Scanner\
  \ sc = new Scanner(System.in);\n        String s1,s2;\n        System.out.print(\"\
  Enter a string\");\n    }\n}\n```\n\n\n\n\n\n\n## 代码示例\n\n```java\ns1=sc.next();\n\
  System.out.print(\"Enter string to search\");\ns2=sc.next();\nint ans = s1.indexOf(s2);\n\
  if(ans == -1)\n    System.out.println(\"Not Found\");\nelse\n    System.out.println(\"\
  found at pos \" + ans);\n```\n\n## StringBuffer\n\n`StringBuffer` 是 `String` 的对等类，提供了\
  \ `String` 的大部分功能。众所周知，`String` 代表固定长度且不可变的字符序列。与 `String` 不同，`StringBuffer` 代表可增长和可写的字符序列。`StringBuffer`\
  \ 可以在中间插入或在末尾追加字符和子字符串。\n\n`StringBuffer` 会自动扩展以为此类添加留出空间，通常分配的字符比实际需要的更多，以便允许增长。Java\
  \ 频繁使用该类，但许多程序员通过重载的 `+` 运算符在后台操作 `StringBuffer`。\n\n### 关于 `StringBuffer` 类的的一些要点\n\
  \n- `StringBuffer` 类似于 `Object` 类。\n- `StringBuffer` 类也是 `final` 类，类似于 `String`\
  \ 类。\n- `StringBuffer` 对象是可变的（可以修改），与 `String` 对象不同。\n\n### `StringBuffer` 构造函数和方法\n\
  \n| 方法 | 描述 |\n| :--- | :--- |\n| `public StringBuffer()` | 默认构造函数，不重新分配地预留 16 个字符的空间。\
  \ |\n| `public StringBuffer(int)` | 该构造函数接受一个整数参数，显式地设置缓冲区的大小。 |\n| `public StringBuffer(String)`\
  \ | 该构造函数接受一个 `String` 参数，设置 `StringBuffer` 对象的初始内容并在不重新分配的情况下预留 16 个字符。 |\n| `public\
  \ synchronized int length()` | 返回当前长度。 |\n| `public synchronized int capacity()`\
  \ | 返回当前容量，即新插入字符的可用存储空间。 |\n| `public synchronized void ensureCapacity(int)` |\
  \ 确保容量至少等于指定的最小值。如果我们预先知道将追加大量字符串，可以使用 `ensureCapacity()` 方法来预先留出空间。 |\n| `public\
  \ synchronized void trimToSize()` | 移除多余空间。现在容量将等于 `length`。 |\n| `public synchronized\
  \ void setLength(int newLength)` | 设置字符序列的长度。如果调用 `setLength()` 传入的值小于 `length()`\
  \ 返回的值，则新长度之外字符将会丢失。 |\n| `public synchronized char charAt(int index)` | 返回序列中指定索引处的\
  \ `char` 值。 |\n| `public synchronized void getChars(int srcBegin, int srcEnd, char[]\
  \ dst, int dstBegin)` | 从此序列复制字符到目标数组 `dst`。第一个拷贝的字符位于索引 `srcBegin`；最后一个位于索引 `srcEnd-1`。拷贝的字符总数为\
  \ `srcEnd-srcBegin`。确保目标数组足够大以容纳从 `dstBegin` 开始的字符。 |\n| `public synchronized void\
  \ setCharAt(int index, char ch)` | 将指定索引处的字符设置为 `ch`。如果索引为负或大于等于 `length()`，则发生\
  \ `IndexOutOfBoundsException`。 |\n| `public synchronized StringBuffer append(Object)`\
  \ | `append` 方法将任何其他类型的字符串表示追加到 `StringBuffer` 对象的末尾。 |\n| `public synchronized\
  \ StringBuffer delete(int start, int end)` | 删除从 `start` 到 `end-1` 的字符。 |\n| `public\
  \ synchronized StringBuffer deleteCharAt(int index)` | 删除指定位置的字符。 |\n| `public synchronized\
  \ StringBuffer replace(int start, int end, String str)` | 将 `start` 到 `end-1` 的字符替换为指定\
  \ `String` 中的字符。 |\n| `public synchronized String substring(int)` | 返回一个新的 `String`，包含此序列中包含的子序列。子字符串从指定索引开始到此序列末尾。\
  \ |\n| `public synchronized String substring(int start, int end)` | 返回一个新的 `String`，包含此序列中包含的子序列。子字符串从指定的\
  \ `start` 开始到 `end-1` 字符结束。 |\n| `public synchronized StringBuffer insert(int, Object)`\
  \ | 将一个 `String` 插入另一个 `String` 中。它被重载以接受所有简单类型和 `Objects`。 |\n| `public int indexOf(String)`\
  \ | |\n| `public int indexOf(String, int)` | |\n| `public int lastIndexOf(String)`\
  \ | |\n| `public int lastIndexOf(String, int)` | |\n| `public synchronized StringBuffer\
  \ reverse()` | 反转 `StringBuffer` 的内容。 |\n\n### 示例 1.5\n\n```java\nimport java.util.Scanner;\n\
  \nclass SortStr {\n    public static void main(String args[]) {\n        Scanner\
