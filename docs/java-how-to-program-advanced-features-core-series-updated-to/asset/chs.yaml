  frame0,20,20,123x100,layout=java.awt.FlowLayout,title=,resizable,normal\n```\n\n\
  ### 示例 17.3\n如果我们改变这一行，组件将左对齐：\n`f.setLayout(new FlowLayout(FlowLayout.LEFT));`\n\
  **输出：**\n![](img/image1271.jpeg)\n\n### 示例 17.4\n如果我们改变这一行，组件将右对齐：\n`f.setLayout(new\
  \ FlowLayout(FlowLayout.RIGHT));`\n**输出：**\n![](img/image1272.jpeg)\n\n### 示例 17.5\n\
  我们可以在设置布局时，使用重载的构造函数来更改行内组件之间的间距（水平间距）以及行之间的间距（垂直间距）：\n`f.setLayout(new FlowLayout(FlowLayout.CENTER,\
  \ 20 ,20));`\n**输出：**\n![](img/image1275.jpeg)\n\n### 3. GridLayout\n`GridLayout`\
  \ 的功能封装在 `java.awt.GridLayout` 类中。`GridLayout` 以表格格式按行和列排列组件。我们可以将容器空间视为由行和列组成的网格。在指定布局时，必须指定行数和列数。`GridLayout`\
  \ 根据行的大小（即布局中指定的列数）将尽可能多的组件放入第一行，并将其他组件移动到第二行，依此类推。这类似于电子表格，它被分为固定数量的行和列。流式布局管理器总是尊重组件的首选大小，而\
  \ `GridLayout` 管理器则处于另一个极端：当它在给定空间内执行布局时，它会忽略组件的首选大小。网格布局中的每一行和每一列的大小都相同，布局可用的总区域在行数和列数之间平分。当我们添加较少的组件（即远少于行乘以列数）或非常多的组件（即多于行乘以列数）时，`GridLayout`\
  \ 的表现会很奇怪。如果将相同的组件放置在一个更高更窄的框架中，那么每个组件都会按比例地变得更高、更窄，反之亦然。\n\n**示例 17.6：**\n```java\n\
  import java.awt.*;\npublic class MyFrame6 extends Frame {\n    public static void\
  \ main(String args[]) {\n        Frame f = new MyFrame6();\n        f.setLayout(new\
  \ GridLayout(5,3));\n        for(int row=0; row<5; row++) {\n            f.add(new\
  \ Label(\"Label\" + row));\n            f.add(new Button(\"Button\" + row));\n \
  \           f.add(new TextField(\"TextField\" + row));\n        }\n        f.setSize(500,200);\n\
  \        f.setVisible(true);\n    }\n}\n```\n**输出：**\n![](img/image01276.jpeg)\n\
  \n### 4. Border Layout（边界布局）\n`BorderLayout` 管理器的功能封装在 `java.awt.BorderLayout` 类中。`BorderLayout`\
  \ 管理器是框架的默认管理器，因此应用程序程序员迟早都会熟悉它。\n\n它强制执行非常实用的布局策略，但可能没有流式布局或网格布局管理器那样的直观。流式布局管理器总是尊重组件的首选大小；而网格布局管理器从不。`Border\
  \ layout` 管理器的做法介于两者之间。\n\n`Border Layout` 管理器将可用的容器空间分为五个部分：`North`（北）、`South`（南）、`East`（东）、`West`（西）和\
  \ `Center`（中心）。我们可以在每个区域添加一个组件。\n\n这五个区域可以是空的，也可以包含一个组件（即不是每个区域都需要包含组件，但每个区域只能包含一个组件）。\n\
  \n`Border layout` 管理器尊重 `North` 和 `South` 组件的首选高度，并强制它们的宽度与容器完全一致。`North` 和 `South`\
  \ 区域适用于工具栏、状态栏以及任何应该尽可能宽但高度不应超过所需的控件。\n\n`East` 和 `West` 区域与 `North` 和 `South` 相反。在\
  \ `East` 和 `West` 中，组件获得其首选宽度，但高度受到限制。\n\n在这里，组件垂直向上延伸到 `North` 组件的底部（如果存在）或容器的顶部（如果没有\
  \ `North`）。\n\n同样地，组件垂直向下延伸到 `South` 组件（如果存在）或容器的底部（如果没有 `South`）。\n\n\n\n\n- `BorderLayout.SOUTH`\n\
  - `BorderLayout.EAST`\n- `BorderLayout.WEST`\n- `BorderLayout.CENTER`\n\n`Border`\
  \ 布局管理器控制的第五个区域被称为 `Center`。`Center` 仅仅是容器在分配了 `North`、`South`、`East` 和 `West` 后剩余的部分。\n\
  \n在向 `center` 添加组件时，向 `add()` 调用传递第二个参数是合法的但非常不明智的。在 Java 平台上，`Border` 布局管理器假设我们的意思是\
  \ `center`。\n\n然而，在旧版本中，这种行为是不可预测的，通常会导致组件完全不可见。\n\n### Example 17.7\n\n```java\n\
  import java.awt.*;\npublic class MyFrame7 {\n    public static void main(String\
  \ args[]) {\n        Frame f=new Frame();\n        Scrollbar sbRight=new Scrollbar(Scrollbar.VERTICAL);\n\
  \        f.add(sbRight, BorderLayout.EAST);\n        Scrollbar sbLeft=new Scrollbar(Scrollbar.VERTICAL);\n\
  \        f.add(sbLeft, BorderLayout.WEST);\n        Label labelTop=new Label(\"\
  This is North\");\n        labelTop.setFont(new Font(\"Serif\", Font.ITALIC, 36));\n\
  \        labelTop.setForeground(Color.white);\n        labelTop.setBackground(Color.black);\n\
  \        f.add(labelTop, BorderLayout.NORTH);\n        Label labelBottom=new Label(\"\
  This is south\");\n        labelBottom.setFont(new Font(\"Monaced\", Font.BOLD,\
  \ 18));\n        labelBottom.setForeground(Color.white);\n        labelBottom.setBackground(Color.black);\n\
  \        f.add(labelBottom, BorderLayout.SOUTH);\n        f.setSize(50,20);\n  \
  \      f.setVisible(true);\n    }\n}\n```\n输出：![](img/image01277.jpeg)\n\n### Example\
  \ 17.8\n\n```java\nimport java.awt.*;\npublic class MyFrame8 extends Frame {\n \
  \   public static void main(String args[]) {\n        Frame f=new MyFrame8();\n\
  \        //f.setLayout(new BorderLayout());\n        f.add (new Button(\"N\"), BorderLayout.NORTH);\n\
  \        f.add (new Button(\"S\"), BorderLayout.SOUTH);\n        f.add (new Button(\"\
  E\"), BorderLayout.EAST);\n        f.add (new Button(\"W\"), BorderLayout.WEST);\n\
  \        Panel p=new Panel();\n        p.setBackground(Color.green);\n        f.add\
