  \ Example 17.9\n\n```java\nimport java.awt.*;\nclass BorderLayout3 extends Frame\
  \ {\n    public static void main (String args[]) {\n        Frame f=new BorderLayout3();\n\
  \        // f.setLayout(new BorderLayout());\n        Panel toolbar=new Panel();\n\
  \        toolbar.setLayout(new FlowLayout(FlowLayout.LEFT));\n        toolbar.setBackground(Color.lightGray);\n\
  \        toolbar.add(new Button(\"This\"));\n        toolbar.add(new Button(\"Is\"\
  ));\n        toolbar.add(new Button(\"The\"));\n        toolbar.add(new Button(\"\
  Toolbar\"));\n        f.add(toolbar, BorderLayout.NORTH);\n        TextField status=new\
  \ TextField(\"Status.\");\n        status.setFont(new Font(\"Monospaced\",Font.BOLD,48));\n\
  \        f.add (status, BorderLayout.SOUTH);\n        f.setSize(300,300);\n    \
  \    f.setVisible(true);\n    }\n}\n```\n输出：![](img/image01279.jpeg)\n\n### CardLayout\n\
  \n在 `CardLayout` 中，我们可以存储许多卡片，但一次只显示一张。一次只有一张卡片可见的，但你可以切换到另一一张。如果我们想一次显示多个卡片，必须为每张卡片创建一个\
  \ `Panel`，并创建一个包含它们的父 `Panel`。\n\n### 构造函数\n- `CardLayout()`\n- `CardLayout(int\
  \ h, int v)`\n\n### 方法\n- `first(Container parent)`：跳转到第一个卡片。\n- `next(Container\
  \ parent)`：跳转到下一张卡片。如果当前显示的卡片是最后一张，此方法将切换到第一张。\n- `previous(Container parent)`：跳转到上一个卡片。如果当前显示的卡片是第一张，此方法将切换到最后一张。\n\
  - `last(Container parent)`：跳转到最后一张卡片。\n- `show(Container parent, String name)`：跳转到使用\
  \ `name` 添加到布局的组件。如果不存在此类组件，则什么也不会发生。\n\n### 使用方法\n1. 创建一个新的 `Panel` 和一个 `CardLayout`\
  \ 对象。\n2. 使用第一步中创建的实例为 `Panel` 设置布局。\n3. 现在，为每张卡片创建一个单独的 `Panel`，并添加任何我们想添加的内容（按钮、复选框等）。\n\
  4. 将步骤 3 中创建的每个 `Panel` 添加到步骤 1 中创建的主 `Panel` 中，并为每个指定一个唯一的卡片名称。\n5. 最后，将主面板添加到\
  \ applet 窗口。\n\n### Example 17.10\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
  import java.applet.*;\n/*<applet code=\"CardLayoutTest\" width=500 height=100></applet>*/\n\
  public class CardLayoutTest extends Applet implements ActionListener, MouseListener\
  \ {\n    Panel mp;\n}\n```\n\n\n\n\n```java\nCardLayout c1;\n\npublic void init()\
  \ {\n    Button b1=new Button(\"First\");\n    Button b2=new Button(\"Second\");\n\
  \    b1.addActionListener(this);\n    b2.addActionListener(this);\n    add(b1);\n\
  \    add(b2);\n    Panel p1=new Panel();\n    Label l1=new Label(\"INDIA\");\n \
  \   p1.add(l1);\n    Panel p2=new Panel();\n    Label l2=new Label(\"USA\");\n \
  \   p2.add(l2);\n    mp=new Panel();\n    c1=new CardLayout();\n    mp.setLayout(c1);\n\
  \    mp.add(p1,\"Country1\");\n    mp.add(p2,\"Country2\");\n    add(mp);\n    addMouseListener(this);\n\
  }\n\npublic void actionPerformed(ActionEvent ae) {\n    Button b=(Button)ae.getSource();\n\
  \    if(b.getLabel().equals(\"First\"))\n        c1.show(mp,\"Country1\");\n   \
  \ else\n        c1.show(mp,\"Country2\");\n}\n\npublic void mousePressed(MouseEvent\
  \ me) {\n    c1.next(mp);\n}\n\npublic void mouseReleased(MouseEvent me){}\npublic\
  \ void mouseClicked(MouseEvent me){}\npublic void mouseEntered(MouseEvent me){}\n\
  public void mouseExited(MouseEvent me){}\n```\n\nOutput:\n![](img/image0280.jpeg)\n\
  \n### GridBagLayout\n`GridBagLayout` 是标准布局管理器中最复杂且最灵活的一种。尽管它听起来似乎应该是 `GridLayout`\
  \ 的子类，但实际上它完全不同。在 `GridLayout` 中，元素排列为\n\n### 示例 17.11\nAWT 组件可以分类为：\n1. 可视化组件。\n\
  2. 容器组件。\n3. 菜单组件。\n\n可视化组件和容器组件都是从 `java.awt.Component` 类开始的组件层次结构的一部分。\n\n####\
  \ `java.awt.Component` 类的方法\n由于继承自 `java.awt.component`，所有可视化组件和容器组件都实现了几个方法。（菜单组件继承自\
  \ `java.awt.MenuComponent`，因此它们不继承相同的父类功能）。这些方法在下文中进行了讨论：\n\n- `Dimension getSize()`：以\
  \ `Dimension` 对象的格式返回此组件的大小，该对象具有类型为 `int` 的公共数据成员 `height` 和 `width`。\n- `void\
  \ setBackground(Color c)`：设置组件的背景颜色。通常，背景颜色用于渲染组件的非文本区域。\n- `void setForeground(Color\
  \ c)`：设置组件的前景色颜色。通常组件的前景色用于渲染文本。如果我们不显式设置组件的前景色色或背景色，组件将使用其直接容器的前景色和背景色。\n- `void\
  \ setFont(Font f)`：`setFont()` 方法决定组件用于渲染任何需要显示的文本的字体。如果我们不显式设置组件的字体，组件将使用其容器的字体。\n\
  - `void setEnabled(Boolean b)`：如果参数为 true，则组件具有正常外观。如果参数为 false，则组件将变为灰色且不响应用户输入。\n\
  - `void setSize(Dimension d)`：设置组件的大小。\n- `void setSize(int width, int height)`：设置组件的大小。\n\
  - `void setBounds(int x, int y, int width, int height)`：尝试移动并调整组件的大小。左上角的新位置由 `x`\
  \ 和 `y` 指定，新大小由 `width` 和 `height` 指定。\n- `void setVisible(Boolean b)`：此方法接受一个布尔参数，用于决定组件是否在屏幕上可见。此方法通常用于帧（frames）。\n\
  \n**注意：** 如果我们尝试过调用 `setSize()` 或 `setBounds()`，会发现这通常是徒劳的。我们尝试赋予组件的大小和位置会被布局管理器覆盖。事实上，这两个方法大部分存在是为了供布局管理器使用的。该规则的一个主要例外是\
  \ `Frame` 类，它不属于布局管理器之下，并且完全接受设置其大小或边界。\n\n### 可视化组件\n可视化组件是用户可以直接看到并交互的组件。AWT 支持以下可视化组件：\n\
  - Canvas（画布）\n- Checkbox（复选框）\n- Choice（组合框）\n- Dialog（对话框）\n- Label（标签）\n- List（列表）\n\
  - ScrollPane（滚动面板）\n- TextField\n要在 GUI 中使用这些组件之一，我们首先通过调用相应的构造函数创建一个实例。然后将组件添加到容器中。\n\
  \n### Button\n`Button` 类实现了一个按钮。\n\n**构造函数：**\n- `Button()`\n- `Button(String)`：构造函数接受一个字符串参数，指定按钮的标签。当按钮按下时，它会发送一个\
  \ `ActionEvent`。\n\n**方法：**\n- `String getLabel()`：获取此按钮的标签。\n- `void setLabel(String\
  \ label)`：将按钮的标签设置为指定的字符串。\n- `void addActionListener(ActionListener l)`：添加指定的动作监听器以接收此按钮的动作事件。\n\
  \n#### 示例 17.2\n```java\nimport java.awt.*;\nclass ButtonTest {\n    public static\
  \ void main(String args[]) {\n        Frame f=new Frame(\"Testing Button Component\"\
  );\n        f.setLayout(new FlowLayout());\n        Font f1=new Font(\"Arial\",Font.BOLD,40);\n\
  \        Color c1=new Color(255,0,0);\n        Color c2=new Color(0,25,0);\n   \
  \     Button b1 = new Button();\n        Button b2 = new Button(\"Cancel\");\n \
  \       b1.setForeground(c1);\n        b2.setForeground(c1);\n        b1.setBackground(c2);\n\
  \        b2.setBackground(c2);\n        b1.setFont(f1);\n        b2.setFont(f1);\n\
  \        b1.setLabel(\"Ok\");\n        System.out.println(b2.getLabel());\n    \
  \    f.add(b1);\n        f.add(b2);\n        f.setSize(500,200);\n    }\n}\n```\n\
  \n\n\n\n```java\nf.setVisible(true);\n}\n}\n```\n\n输出：\n\n![](img/image0128.jpeg)\n\
  \n## Canvas\n\n`Canvas` 是一种组件，没有默认的显示或行为。我们可以通过子类 `canvas` 来创建自定义的绘制区域、工作区域、组件等。Canvas\
  \ 接收来自鼠标和键盘的输入事件，由程序员将这些输入转换为有意义的外观和感受。\n\n画布的默认尺寸（或更准确地说，首选尺寸）小得毫无用。处理这个问题的一种方法是使用可以调整画布大小的布局管理器。另一种方法是手动对画布调用\
  \ `setSize()`，画布是少数这种方法可能有效的案例之一，因为我们传递给 `setSize()` 方法的值将直接成为画布的首选尺寸。\n\n### 示例\
  \ 17.13\n\n```java\nimport java.awt.*;\nclass CanvasTest {\n    public static void\
  \ main (String args []) {\n        Frame f = new Frame() ;\n        f.setLayout(new\
  \ FlowLayout());\n        Canvas c=new MyCanvas();\n        c.setSize(100, 100);\n\
  \        f.add(c) ;\n        f.setSize(300, 300 );\n        f.setVisible(true);\n\
  \    }\n}\nclass MyCanvas extends Canvas {\n    public void paint(Graphics g ) {\n\
  \        setBackground(Color.green);\n        g.setColor(Color.red );\n        g.drawLine(0,\
  \ 0, 99, 99 );\n    }\n}\n```\n输出：\n![](img/image1282.jpeg)\n\n## Checkbox\n\n复选框是一个双状态的按钮。这两个状态分别是\
  \ `true`（已选中）和 `false`（未选中）。`checkbox` 构造函数的三个基本形式为：\n\n- `Checkbox()`：创建一个带标签为空字符串的复选框。\n\
  - `Checkbox(String label)`：创建一个带有指定标签的复选框。\n- `Checkbox(String label, boolean state)`：创建一个带有指定标签并设置指定状态的复选框。如果我们不指定初始状态，默认值为\
  \ `false`。\n\n方法：\n\n- `String getLabel()`：获取此复选框的标签。\n- `void setLabel(String label)`：将复选框的标签设置为字符串参数。\n\
  - `boolean getState()`：确定复选框处于“开启”还是“关闭”状态。\n- `void setState(boolean state)`：将此复选框的状态设置为指定的状态。\n\
  - `void addItemListener(ItemListener)`：添加指定的项监听器以接收来自此复选框的项事件。\n\n### 示例 17.14\n\
  \n```java\nimport java.awt.*;\nclass CheckboxTest {\n    public static void main(String\
  \ args[]) {\n        Frame f = new Frame(\"Testing Checkbox Component\");\n    \
  \    f.setLayout(new GridLayout(3,1));\n        Checkbox c1=new Checkbox();\n  \
  \      Checkbox c2=new Checkbox(\"Lunch\",true);\n        Checkbox c3=new Checkbox(\"\
  Dinner\");\n        c1.setLabel(\"Fast\");\n        c3.setState(true);\n       \
  \ f.add(c1);f.add(c2);f.add(c3);\n        if(c1.getState())\n            System.out.println(c1.getLabel());\n\
  \        if(c2.getState())\n            System.out.println(c2.getLabel());\n   \
  \     if(c3.getState())\n            System.out.println(c3.getLabel());\n      \
  \  f.setSize(100,100);\n        f.setVisible(true);\n    }\n}\n```\n输出：\n![](img/image1283.jpeg)\n\
  \n### 另一个示例\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass CheckboxTest\
  \ extends Frame implements ItemListener {\n    Checkbox c1;\n    TextField tf1;\n\
  \    CheckboxTest() {\n        setLayout(new GridLayout(2,1));\n        c1=new Checkbox(\"\
  Red\");\n        c1.addItemListener(this);\n        add(c1);\n        tf1=new TextField();\n\
  \        add(tf1);\n        setSize(100,100);\n        setVisible(true);\n    }\n\
  \    public static void main(String args[]) {\n        new CheckboxTest();\n   \
  \ }\n    public void itemChanged(ItemEvent ie) {\n        if(c1.getState())\n  \
  \          tf1.setBackground(Color.red);\n        else\n            tf1.setBackground(Color.white);\n\
  \    }\n}\n```\n\n## Radio button\n\n复选框可以被组成复选框组，它们具有单选行为。在单选行为下，框组中任何时候只能有一个成员状态为\
  \ `true`；选择新成员会将上一个成员的状态更改为 `false`。许多系统（例如 Motif）将单选组作为它们自身的组件来实现。\n\n我们可以通过创建多个复选框并使用\
  \ `java.awt.CheckboxGroup` 将它们进行分组来实现单选行为。在 Java 中，`java.awt.CheckboxGroup` 类并不是一个组件；它仅仅是一个用于组织复选框的类。这意味着\
  \ Java 对复选框组成员之间的空间关系没有加任何限制。如果我们愿意，可以将组中的一个成员放在框架的左上角，另一个成员放在右下角，第三个成员放在另一个框架中。当然，结果可能违背逻辑和大多数\
  \ GUI 指南。\n\n`CheckboxGroup` 两个方法支持获取和设置当前选中的成员或组：\n\n- `Checkbox getSelectedCheckbox()`：获取此复选框组的当前选择。\n\
  - `void setSelectedCheckbox(Checkbox box)`：将此组中当前选中的复选框设置为指定的复选框。\n\n### 示例 17.15\n\
  \n```java\nimport java.awt.*;\nclass CheckboxGroupTest {\n    public static void\
  \ main(String args[]) {\n    }\n}\n```\n\n\n\n\n```java\nf.setLayout(new GridLayout(3,1));\n\
  CheckboxGroup cbg=new CheckboxGroup();\nCheckbox c1=new Checkbox(\"BreakFast\",false,cbg);\n\
  Checkbox c2=new Checkbox(\"Lunch\",true,cbg);\nCheckbox c3=new Checkbox(\"Dinner\"\
  ,false,cbg);\nc3.setState(true);\nf.add(c1);f.add(c2);f.add(c3);\n\nif(c1.getState())\n\
  \    System.out.println(c1.getLabel());\nelse if(c2.getState())\n    System.out.println(c2.getLabel());\n\
  else if(c3.getState())\n    System.out.println(c3.getLabel());\n\nf.setSize(100,100);\n\
  f.setVisible(true);\n```\n\n输出：\n![](img/image0284.jpeg)\n\n### Choice\nChoice 是一个下拉列表。\n\
  \n### 方法\n- `void add (String item)`: 向此 Choice 菜单添加添加项。\n- `void addItemListener\
  \ (ItemListener i)`: 添加指定的项监听器以接收来自此选择菜单的项事件。\n- `String getItem (int index)`: 获取此\
  \ Choice 菜单中指定索引处的字符串。\n- `int getItemCount ()`: 返回此 Choice 菜单中项的数量。\n- `int getSelectedIndex\
  \ ()`: 返回当前选中项的索引。\n- `String getSelectedItem ()`: 获取当前选择的字符串表示形式。\n- `void insert\
  \ (String item, int index)`: 在指定位置将项插入到此选择框中。\n- `void remove (int position)`: 移除选择菜单中第一个出现的指定位置项。\n\
  - `void remove(String item)`: 从 Choice 菜单中移除第一个出现的指定项。\n- `void removeAll ()`: 移除选择菜单中的所有项。\n\
  - `void select (int pos)`: 将此选择中的选中项设置为指定位置的项。\n- `void select (String Str)`: 将此\
  \ Choice 中名称与指定字符串相同的项设置为选中。\n\n#### 示例 7.16\n```java\nimport java.awt.*;\nclass\
  \ Choice\n{\n    public static void main(String args[]) throws InterruptedException\n\
  \    {\n        Frame f = new Frame(\"Testing Choice\");\n        f.setLayout(new\
  \ FlowLayout());\n        f.setSize(100,100);\n        f.setVisible(true);\n   \
  \     Choice c1=new Choice();\n        c1.add(\"BreakFast\");\n        c1.add(\"\
  Lunch\");\n        c1.add(\"Dinner\");\n        f.add(c1);\n        c1.select(\"\
  Dinner\"); // c1.select(2);\n        Thread.sleep(100);\n        System.out.println(c1.getSelectedItem());\n\
  \        System.out.println(c1.getSelectedIndex());\n        System.out.println(c1.getItemCount());\n\
  \        System.out.println(c1.getItem(0));\n        c1.insert(\"Brunch\",1);\n\
  \        c1.remove(2); // c1.remove(\"Lunch\");\n    }\n}\n```\n输出：\n![](img/image0285.jpeg)\n\
  \n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass CheckboxItemTest\
