  \ \"<Left Arrow>\"; break;\ncase KeyEvent.VK_RIGHT:\n    msg = msg + \"<Right Arrow>\"\
  ; break;\ncase KeyEvent.VK_CONTROL:\n    msg = msg + \"<Ctrl>\"; break;\n}\nrepaint();\n\
  public void paint(Graphics g) {\n    g.setColor(Color.red);\n    g.drawString(msg,x,y);\n\
  }\n```\n\n### 示例 18.13: FocusListener 演示 TextField 在失去或获得焦点时颜色的变化\n\n```java\nimport\
