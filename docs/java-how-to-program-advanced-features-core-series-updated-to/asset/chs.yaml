  \ API 局限性`。\n\n## Stream API 概述 -\n\n在查看 Java 8 Stream API 示例之前，让我们看看为什么需要它。假设我们要遍历一个整数列表，并找到所有大于\
  \ 10 的整数之和。在 Java 8 之前，实现的方法是：\n\n```java\nprivate static int sumIterator(List<Integer>\
  \ list) {\n    Iterator<Integer> it = list.iterator();\n    int sum = 0;\n    while\
  \ (it.hasNext()) {\n        int num = it.next();\n        if (num > 10) {\n    \
  \        sum += num;\n        }\n    }\n    return sum;\n}\n```\n\n上述方法有三个主要问题：\n\
  \n1) 我们只想知道整数之和，但还必须提供如何进行迭代，这被称为 `外部迭代`（external iteration），因为客户端程序正在处理遍历列表的算法。\n\
  2) 程序本质上是顺序的，我们无法轻松以并行方式执行此。\n3) 即使是一个简单的任务，也有大量的代码。\n\n为了克服上述所有缺点，Java 8 引入了 Stream\
  \ API。我们可以使用 Stream API 来实现 `内部迭代`（internal iteration），这样更好，因为 Java 框架控制着迭代。`内部迭代`提供了许多功能，如顺序和并行执行、根据给定标准进行过滤、映射等。\n\
  \n大多数 Stream API 方法的参数都是函数式接口，因此 Lambda 表达式与它们配合得非常好。让我们看看如何用单行语句编写上述逻辑。\n\n```java\n\
  private static int sumStream(List<Integer> list) {\n    return list.stream().filter(i\
  \ -> i > 10).mapToInt(i -> i).sum();\n}\n```\n\n注意，上述程序利用了 Java 框架的迭代策略、过滤和映射方法并将提高效率。首先我们将查看\
