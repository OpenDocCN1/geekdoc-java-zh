  java DispClassMembers2 String\n```\n\n## 4. String toString()\n\n如果子类没有重写此方法，它将返回对象的文本表示，其格式如下：\n\
  “<类名>@<对象的哈希码值>\n\n该方法通常会被重写，并用于调试。方法调用 `System.out.println(Objref)` 会隐式地使用 `toString()`\
  \ 方法将其参数转换为文本表示。\n\n### 示例 20.3\n\n此示例演示了当我们尝试显示 Box 类对象时会显示什么内容。对象使用其所属类的 `toString`\
  \ 方法转换为文本表示。\n\n```java\nclass Box\n{\n    double w,h,d;\n    Box(double w, double\
  \ h, double d) {\n        this.w=w;\n        this.h=h;\n        this.d=d;\n    }\n\
  }\nclass ToString1\n{\n    public static void main(String args[]) {\n        Box\
  \ b= new Box(10,12,4);\n        String s=”Box:”+b;\n        System.out.println(b);\n\
  \        System.out.println(s);\n    }\n}\n```\n\n**输出：**\n```\nBox1@82b41\nBox1\
  \ b: Box1@82b41\n```\n\n### 示例 20.4\n\n此示例演示了如果我们在 Box 类中重写了 `toString()` 方法，则将使用重写后的方法将对象转换为文本表示。\n\
  \n```java\nclass Box\n{\n    double w,h,d;\n    Box(double w, double h, double d)\
  \ {\n        this.w=w;\n        this.h=h;\n        this.d=d;\n    }\n    public\
  \ String toString() {\n        return “Dimensions are ”+ w + “ by ”+ h + “ by ”+\
  \ d + “.”;\n    }\n}\nclass ToStringDemo2\n{\n    public static void main(String\
  \ args[]) {\n        Box b= new Box(8,11,13);\n        String s=”Box b:” + b; //\
  \ 拼接 box 对象并调用 toString() 方法\n        System.out.println(b); // 调用 toString() 方法\n\
  \        System.out.println(s);\n    }\n}\n```\n\n**输出：**\n```\nDimension are 8.0\
  \ by 11.0 by 13.0\nBox b: Dimension are 8.0 by 11.0 by 13.0\n```\n\n## 5. `protected\
  \ void finalize() throws Throwable`\n\n它在对象被垃圾回收之前被调用，以便可以进行任何清理工作。然而， `object`\
  \ 类中的默认 `finalize()` 方法并没有做任何有用的事情。这对于释放非 Java 资源可能有用，但不建议。如果可用内存足够，`finalize()`\
  \ 方法可能永远不会被调用，在这种情况下资源可能永远不会被释放。\n\n## 6. `protected Object clone() throws CloneNotSupportedException`\n\
  \n通过 `clone()` 方法可以创建与当前对象完全相同（即具有相同状态）的新对象，即原始值和引用值都会被复制，这被称为浅拷贝。\n\n类可以重写 `clone()`\
  \ 方法以提供其自己的克隆概念。例如，通过递归地克隆组成对象来克隆复合对象被称为深克隆。\n\n在重写时，子类中的该方法通常是公共的，以允许任何客户端进行克隆。\n\
  \n如果重写 `clone()` 方法依赖于 `Object` 类中的 `clone()` 方法，则子类必须实现 `cloneable` 接口以表明其对象可以安全地克隆。否则，`Object`\
  \ 类中的 `clone()` 方法将抛出 `CloneNotSupportedException`。\n\n### 使用 clone() 和 Cloneable\
  \ 接口\n\n`clone()` 方法生成调用它的对象的对象的副本。以下是关于 `clone()` 方法的一些重要事实：\n\n只有实现了 `Cloneable`\
  \ 接口的类才能被克隆。`Cloneable` 接口没有定义成员。它用于指示一个类允许对对象进行位位复制（即创建克隆）。\n\n如果你尝试对未实现 `cloneable`\
  \ 接口的类对象调用 `clone()`，将抛出 `CloneNotSupportedException`。\n\n`Cloneable` 接口是一个空接口。这种接口被称为标记接口。在创建克隆体时，被克隆对象的构造函数不会被调用。\n\
  \n克隆体只是原始对象的完全拷贝。克隆是一个潜在的危险操作，因为它会导致意外的副作用。\n\n例如，如果被克隆的对象包含一个名为 `objRef` 的引用变量，那么在创建克隆时，克隆体中的\
  \ `objRef` 将指向与原始对象的 `objRef` 相同的对象。如果克隆改变了 `objRef` 所指对象的内容，那么原始对象也会随之改变。\n\n###\
  \ 示例 20.5\n\n以下示例演示了 `clone()` 方法的使用。`CloneDemo1` 类通过间接通过 `clone2()` 方法调用 `clone()`\
  \ 方法，为 `TestClone1` 类对象创建克隆。\n\n\n\n\n```java\nclass TestClone1 implements Cloneable\n\
  {\n    int a;\n    float b;\n    public TestClone1 clone2() throws CloneNotSupportedException\n\
  \    {\n        return (TestClone1) clone();\n    }\n}\nclass CloneDemo1\n{\n  \
  \  public static void main(String a[]) throws CloneNotSupportedException\n    {\n\
  \        TestClone1 tc1 = new TestClone1();\n        TestClone1 tc2;\n        tc1.a\
  \ = 8; tc1.b = 4.5f;\n        tc2 = tc1.clone2();\n        System.out.println(tc2.a);\n\
  \        System.out.println(tc2.b);\n    }\n}\n```\n8\n4.5\n\n在这里，`clone2()` 方法调用了\
  \ `Object` 类的 `clone()` 并返回结果。注意，`clone()` 返回的对象必须强制转换为其适当类型，即 `TestClone1`。\n\n\
  ### 示例 20\n在以下示例中，`clone()` 方法被重写，以便可以从类外部调用。为了做到这一点，其修饰符必须是 `public`。\n\n```java\n\
  class TestClone2 implements Cloneable\n{\n    int a;\n    float b;\n    public Object\
  \ clone() throws CloneNotSupportedException\n    {\n        return super.clone();\n\
  \    }\n}\nclass CloneDemo2\n{\n    public static void main(String args[]) throws\
  \ CloneNotSupportedException\n    {\n        TestClone2 tc1 = new TestClone2();\n\
  \        TestClone2 tc2;\n        tc1.a = 8; tc1.b = 4.5f;\n        tc2 = (TestClone2)\
  \ tc1.clone();\n        System.out.println(tc2.a + \" , \" + tc2.b);\n    }\n}\n\
  ```\n输出: 8 , 4.5\n\n### 示例 207\n在以下示例中，`clone()` 方法被重写，使其没有使用 `Object` 类的 `clone()`\
  \ 方法。我们正在编写自己的 `clone()` 方法。\n\n```java\nclass TestClone3\n{\n    int a;\n    float\
  \ b;\n    public Object clone() throws CloneNotSupportedException\n    {\n     \
  \   TestClone3 tc = new TestClone3();\n        tc.a = a;\n        tc.b = b;\n  \
  \      return tc;\n    }\n}\nclass CloneDemo3\n{\n    public static void main(String\
  \ args[]) throws CloneNotSupportedException\n    {\n        TestClone3 tc1 = new\
  \ TestClone3();\n        TestClone3 tc2;\n        tc1.a = 8;\n        tc1.b = 4.5f;\n\
  \        tc2 = (TestClone3) tc1.clone();\n        System.out.println(tc2.a + \"\
  \ \" + tc2.b);\n    }\n}\n```\n输出: 8 , 4.5\n\n注意：在实现 `clone()` 方法时，你需要声明 `CloneNotSupportedException`\
  \ 并实现 `Cloneable` 接口。\n\n### 克隆的副作用\n克隆引起的副作用起初很难察觉。人们很容易认为一个类对于克隆是安全的，但实际上并非如此。通常，如果没有没有理由，你不应为任何类实现\
  \ `Cloneable` 接口。\n\n### 示例 208\n此示例演示了克隆的副作用。\n\n```java\nclass TestShallowClone\
  \ implements Cloneable\n{\n    int a;\n    float b;\n    int c[];\n    public Object\
  \ clone() throws CloneNotSupportedException\n    {\n        return super.clone();\n\
  \    }\n}\nclass ShallowCloneDemo\n{\n    public static void main(String arg[])\
  \ throws CloneNotSupportedException\n    {\n        TestShallowClone tc1 = new TestShallowClone();\n\
  \        TestShallowClone tc2;\n        tc1.a = 8;\n        tc1.b = 4.5f;\n    \
  \    int c[] = new int[4];\n        for(int i=0; i<4; i++)\n            c[i] = i;\n\
  \        tc1.c = c;\n        for(int i=0; i<4; i++)\n            System.out.println(\"\
  tc1.c[\" + i +]=\"=\" + tc1.c[i]);\n        tc2 = (TestShallowClone) tc1.clone();\n\
  \        System.out.println(\"tc2.a\"+tc2.a);\n        System.out.println(\"tc2.b\"\
  +tc2.b);\n        for(int i=0; i<4; i++)\n            System.out.println(\"tc2.c[\"\
  \ + i +]=\"=\" + tc2.c[i]);\n        for(int i=0; i<4; i++)\n            tc2.c[i]\
  \ = i+4;\n        for(int i=0; i<4; i++)\n            System.out.println(\"tc2.c[\"\
  \ + i +]=\"=\" + tc2.c[i]);\n        for(int i=0; i<4; i++)\n            System.out.println(\"\
  tc1.c[\" + i +]=\"=\" + tc1.c[i]);\n    }\n}\n```\n输出:\ntc1.c[0]=0\ntc1.c[1]=1\n\
  tc1.c[2]=2\ntc1.c[3]=3\ntc2.a=8\ntc2.b=4.5\ntc2.c[0]=0\ntc2.c[1]=1\ntc2.c[2]=2\n\
  tc2.c[3]=3\ntc2.c[0]=4\ntc2.c[1]=5\ntc2.c[2]=6\ntc2.c[3]=7\ntc1.c[0]=4\ntc1.c[1]=5\n\
  tc1.c[2]=6\ntc1.c[3]=7\n\n### 示例 209\n以下代码通过实现深克隆解决了上一个示例中面临的问题。\n\n```java\nclass\
  \ TestDeepClone implements Cloneable\n{\n    int a;\n    float b;\n    int c[];\n\
  \    public Object clone() throws CloneNotSupportedException\n    {\n        TestDeepClone\
  \ tc = (TestDeepClone) super.clone();\n        int d[] = new int[4];\n        for(int\
  \ i=0; i<4; i++)\n            d[i] = c[i];\n        tc.c = d;\n        return tc;\n\
  \    }\n}\nclass CloneDemo\n{\n    public static void main(String arg[]) throws\
  \ CloneNotSupportedException\n    {\n        TestDeepClone tc1 = new TestDeepClone();\n\
  \        TestDeepClone tc2;\n    }\n}\n```\n\n\n\n\n```java\ntc1.a = 8;\ntc1.b =\
  \ 4.5;\nint c[] = new int[4];\nfor(int i=0; i<4; i++)\n    c[i] = i;\ntc1.c = c;\n\
  for(int i=0; i<4; i++)\n    System.out.println(“tc1.c[”+ i +”]=” + tc1.c[i]);\n\
  tc2 = (TestDeepClone) tc1.clone();\nSystem.out.println(“tc2.a”+tc2.a);\nSystem.out.println(“tc2.b”+tc2.b);\n\
  for(int i=0; i<4; i++)\n    System.out.println(“tc2.c[” + i + “]=” + tc2.c[i]);\n\
  for(int i=0; i<4; i++)\n    tc2.c[i] = i+4;\nfor(int i=0; i<4; i++)\n    System.out.println(“tc2.c[”\
  \ + i + “]=” + tc2.c[i]);\nfor(int i=0; i<4; i++)\n    System.out.println(“tc1.c[”\
  \ + i + “]=” + tc1.c[i]);\n```\n\n输出： \ntc1.c[0]=0\ntc1.c[1]=1\ntc1.c[2]=2\ntc1.c[3]=3\n\
  tc2.a=8\ntc2.b=4.5\ntc2.c[0]=0\ntc2.c[1]=1\ntc2.c[2]=2\ntc2.c[3]=3\ntc2.c[0]=4\n\
  tc2.c[1]=5\ntc2.c[2]=6\ntc2.c[3]=7\ntc1.c[0]=0\ntc1.c[1]=1\n\n### 多线程环境下的有用方法\n\n\
  除了上述讨论的方法，`object` 类通过以下方法在同步代码中提供线程通信支持：导致当前线程等待，直到另一个线程调用该对象的 `notify()` 方法或 `notifyAll()`\
  \ 方法。\n\n8. `final void wait(long timeout) throws InterruptedException`\n\n9. `final\
  \ void wait(long timeout, long nanos) throws InterruptedException`\n导致当前线程等待，直到另一个线程调用该对象的\
  \ `notify()` 方法或 `notifyAll()` 方法，或者其他线程中断了当前线程，或者经过了指定的时间。\n\n10. `final void notify()`\n\
  唤醒等待在该对象监视器上的单线程线程。\n\n11. `final void notifyAll()`\n唤醒所有等待在该对象监视器上的线程。线程通过调用其中一个\
  \ `wait` 方法在对象的监视器上进行等待。线程在它持有的锁对应的对象上调用这些方法。线程等待另一个线程的通知。\n\n## 集合框架\n\n#### 简介\n\
  \nJava 集合框架标准化了你的程序处理对象组的方式。在 Java 2 之前，Java 提供了诸如 `Vector`、`Stack`、`Dictionary`、`Hashtable`\
  \ 和 `Properties` 等临时类来存储和操作对象组。\n\n尽管这些类非常有用，但它们缺乏一个核心的统一主题。我们使用 `Vector` 的方式与使用\
  \ `properties` 类的方式不同，此外，之前的临时方法并非设计为易于扩展或适应。集合就是这些（以及其他）问题的救星。\n\nJava 集合框架标准化了你的程序处理对象组的方式。在\
