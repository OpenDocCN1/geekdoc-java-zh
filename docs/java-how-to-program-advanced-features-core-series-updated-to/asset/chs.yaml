  \ 11 章：异常处理\n\n### 引言\n\n异常（Exception）是由程序中的运行时错误导致的条件，它会破坏程序的正常流程。当 Java 解释器遇到如整数除以零之类的错误时，它会创建一个\
  \ `Exception` 对象并将其抛出（即通知我们发生了错误）。\n\n每当运行时发生异常时，Java 异常/错误都是 `Exception` 类或其任一子类的对象。异常对象包含了有关异常的详细信息，可以使用为此目的提供的公共方法来访问这些信息。\n\
  \n在某些较旧的语言中，我们必须使用 `if`、`goto` 和 `return` 码来进行错误处理。\n\n异常是代码序列在运行时出现的异常状态。换句话说，异常是一种运行时错误。在不支持异常处理的计算机语言中，必须手动检查并处理错误——通常通过使用错误代码等。\n\
  \n这种方法既繁琐又麻烦。Java 的异常处理避免了这些问题，并在过程中将运行时错误管理引入了面向对象的世界。\n\n## 异常处理基础\n\nJava 异常是一个对象，描述了代码中发生的异常（即错误）条件。当出现异常条件时，会在引起错误的方法中创建并抛出一个代表该异常的对象。该方法可以选择自己处理该异常，也可以将其传递下去。\n\
  \n无论何种方式，异常在某一点会被捕获并处理。异常可以由 Java 运行时系统生成，也可以由你的代码手动生成。Java 抛出的异常与违反 Java 语言规则或\
  \ Java 执行环境限制的底层错误有关。手动生成的异常通常用于向方法的调用者报告某些错误状态。\n\nJava 异常处理通过五个关键字管理：`try`、`catch`、`throw`、`throws`\
  \ 和 `finally`。简而言之，它们的工作原理如下：你想要监控异常的程序语句包含在 `try` 块中。如果 `try` 块内部发生异常，异常会被抛出。你的代码可以捕获此异常（使用\
  \ `catch`）并以某种方式处理它。系统生成的异常由 Java 运行时自动抛出。要手动抛出异常，请使用关键字 `throw`。任何抛出方法的异常都必须由 `throws`\
  \ 子句指定。任何在 `try` 块完成后绝对必须执行的代码都放在 `finally` 块中。\n\n这是异常处理块的一般形式：\n\n```java\ntry\
  \ {\n    // 用于监控错误的代码块\n} catch (Exception ex) {\n    // 异常处理器\n} .........\nfinally\
  \ {\n    // 在 try 结束后必须执行的代码块\n}\n```\n\n### 异常类型\n\n所有异常类型都是内置类 `Throwable` 的子类。因此，`Throwable`\
  \ 位于异常层次结构的顶端。紧邻 `Throwable` 之下有两个子类，它们将异常分为两个不同的分支。一个分支由 `Exception` 引导。该类用于用户程序应该捕获的异常条件。你也将通过子化该类来创建自己的异常类型。`Exception`\
  \ 有一个重要的子类，称为 `RuntimeException`。这种类型的异常会为你编写的程序自动定义，包括如除以零和无效数组索引等内容。\n\n另一个分支由\
  \ `Error` 引导，它定义了在正常情况下不期望你的程序捕获的异常。`Error` 类型的异常由 Java 运行时系统使用，指示与运行时环境本身相关的错误。`Stack\
  \ overflow`（栈溢出）就是此类错误的示例。本章将不会处理 `Error` 异常，因为这些异常通常是为了灾难性故障创建的，你的程序通常无法处理。\n\n\
  顶层异常层次结构所示：\n![](img/image01235.jpeg)\n\n#### 示例 11.1\n```java\nclass ErrorTest1\
  \ {\n    public static void main(String args[]) {\n        int a=5,b=2,c=2,d;\n\
  \        d=a/(b-c); // 发生了 ArithmeticException(Divide by zero)\n        System.out.println(d);\n\
  \        System.out.println(\"This will not be printed\");\n    }\n}\n```\n程序将在除法操作期间终止，而不执行剩余的语句。\n\
  \n### 示例 1.2\n```java\nclass A {\n    void display() {\n    }\n}\nclass ErrorTest2\
  \ {\n    public static void main(String args[]) {\n        A a1=null;\n        a1.display();\
  \ // 发生了 NullPointerException\n    }\n}\n```\n在上述程序中将发生 `NullPointerException`。引用变量没有用\
  \ `new` 初始化。在这种情况下程序也会终止。\n\n#### 示例 11.3\n```java\nclass ErrorTest3 {\n    public\
  \ static void main(String args[]) {\n        int a[] = {10,20,30};\n        System.out.println(a[3]);\
  \ // 发生了 ArrayIndexOutOfBoundsException\n    }\n}\n```\n在上述情况下，数组长度为 3，索引从 0 到 2，所以如果我们打印\
  \ `a[3]`，那么这就是第 4 个元素，不是有效的索引。这将产生一个异常错误。在 C/C++ 中这是允许的，但在 Java 中不允许。\n\n### 注意\n\
  \nJDK 7 增加了 `try` 语句的新形式，支持自动资源管理。这种新的 `try` 形式称为 try-with-resources，在文件章节中描述了它，因为文件是常用资源之一。\n\
  \n如果异常对象没有被正确捕获和处理，解释器将显示错误信息并终止程序。如果我们想继续执行剩余代码，那么我们应该尝试捕获由错误条件抛出的异常对象。\n\n\n\n\
  \n\n## 异常处理\n\n此任务被称为异常处理。异常处理机制的目的是一种检测和报告“异常情况”的手段，以便采取适当的措施。该机制建议引入单独的错误处理代码，用以执行以下任务：\n\
  \n1. 发现问题（发生异常）。\n2. 通知错误已发生（`throw` 异常）。\n3. 接收错误信息（`catch` 异常）。\n4. 采取纠正措施（处理异常）。\n\
  \n## Java 关键字\n\nJava 异常处理通过五个关键字管理：`try`、`catch`、`throw`、`throws` 和 `finally`。\n\
  \n我们想要监控异常的程序语句包含在 `try` 块中，每当发生错误时，它就会被抛到 `catch` 块中。我们的代码可以捕获此异常（使用 `catch`）并以某种合理的方式处理它。系统生成的异常由\
  \ Java 运行时系统自动抛出。\n\n要手动抛出异常，请使用 `throw` 关键字。任何抛出方法的异常都必须通过 `throws` 子句进行指定。任何在方法返回之前必须执行的代码放在\
  \ `finally` 块中。\n\n## try 块\n\n`try` 块必须封装在括号之间，即使它只有一个语句。可以有一个或多个 `catch` 语句，以及零或一个\
  \ `finally` 语句。`catch` 和 `finally` 块都是可选的，但必须至少有一个 `catch` 块或一个 `finally` 块。\n\n\
  `try` 块中的代码像任何其他 Java 代码一样执行。如果 `try` 块中的代码执行成功，控制将转移到 `finally` 块（如果存在），然后从 `finally`\
  \ 块结束后的语句继续执行（即 `try` 语句结束之后）。如果不存在 `finally` 块，执行将从最后一个 `catch` 块结束后的语句继续（即 `try`\
  \ 语句结束之后）。\n\n如果在执行 `try` 块中的代码时发生某些运行时错误，JVM 将抛出一个 `Exception Error`。这意味着将根据运行时错误的类型创建一个\
  \ `Exception Error` 类型的对象或其子类之一。然后按照从上到下的顺序与 `catch` 块中的 `Exception`/`Error` 类型进行比较。\n\
  \n如果找到匹配的 `catch` 块，则处理该异常/错误，即程序不会终止。执行将从 `catch` 块中的第一个语句继续。在完成 `catch` 块后，执行将从\
  \ `try` 和 `catch` 语句结束后的语句继续。\n\n无论有多少个 `catch` 块，最多只有一个 `catch` 块会被执行。如果异常/错误与任何\
  \ `catch` 块的异常/错误类型都不匹配，则我们称其未被处理。\n\n执行将立即从 `try` 块返回。即使异常/错误未被处理，`finally` 块中的代码也将被执行。\n\
  \n如果有外层 `try` 块，异常/错误将由其处理，否则必须在调用当前方法的的方法中被处理。\n\n异常/错误将沿层次结构向上传递，直到被处理，或者即使在 `main()`\
  \ 方法（执行执行开始的第一个方法）中未被处理，也会作为未处理异常传递给 JVM。\n\nJVM 然后简单地终止程序并在显示器/控制台上显示异常/错误的细节。\n\
  \n## 使用 try 和 catch\n\n尽管 Java 运行时系统提供的默认异常处理器对于调试很有用，但你通常希望自己处理异常。这样做有两个益处：首先，它允许你修复错误；其次，它防止程序自动终止。如果你的程序每次发生错误就停止运行并打印堆栈跟踪，大多数用户会感到困惑（至少是这样）！幸运的是，防止这一点很容易。\n\
  \n为了防止和处理运行时错误，只需将你想要监控的代码封装在 `try` 块中。紧随 `try` 块之后，包含一个 `catch` 子句，指定你想要 `catch`\
  \ 的异常类型。\n\n为了说明如何轻松地完成这一点，以下程序包含一个 `try` 块和一个 `catch` 子句，用于处理由除零错误产生的 `ArithmeticException`：\n\
  \n```java\nclass Exc2 {\n    public static void main(String args[]) {\n        int\
  \ d, a;\n        try {\n            // 监控一段代码。\n            d = 0;\n           \
  \ a = 42 / d;\n            System.out.println(\"This will not be printed.\");\n\
  \        } catch (ArithmeticException e) {\n            // 捕获除零错误\n            System.out.println(\"\
  Division by zero.\");\n        }\n        System.out.println(\"After catch statement.\"\
  );\n    }\n}\n```\n\n该程序产生以下输出：\n```\nDivision by zero.\nAfter catch statement.\n\
  ```\n\n注意，`try` 块内部的 `println()` 调用从未被执行过。一旦抛出异常，程序就会跳出 `try` 块进入 `catch` 块。因此，`println()`\
  \ 未被调用。`catch` 的范围限制在 `try` 指定的语句上。\n\n构建良好的 `catch` 子句的目标应该是解决异常情况然后继续。例如，在下一个程序中，`for`\
  \ 循环的每次迭代都会获取两个整数。这两个整数相互相除，结果存入 `a` 中。如果任何一个操作导致除零错误，它将被捕获，`a` 的值设置为零，然后程序继续。\n\
  \n### 处理异常并继续。\n\n```java\nimport java.util.Random;\n\nclass HandleError {\n   \
  \ public static void main(String args[]) {\n        int a=0, b=0, c=0;\n       \
  \ Random r = new Random();\n        for(int i=0; i<3000; i++) {\n            try\
  \ {\n                b = r.nextInt();\n                c = r.nextInt();\n      \
  \          a = 12345 / (b/c);\n            } catch (ArithmeticException e) {\n \
  \               System.out.println(\"Division by zero.\");\n                a =\
  \ 0; // 设置 a 为零并继续\n            }\n            System.out.println(\"a: \" + a);\n\
  \        }\n    }\n}\n```\n\n## 显示异常描述\n\n`Throwable` 重写了由 `Object` 定义的 `toString()`\
  \ 方法，使其返回一个包含异常描述的字符串。你可以通过简单将异常作为参数在 `println()` 语句中显示此描述。例如，上述程序中的 `catch` 块可以重写为：\n\
  \n```java\ncatch (ArithmeticException e) {\n    System.out.println(\"Exception:\
  \ \" + e);\n    a = 0; // 设置 a 为零并继续\n}\n```\n\n当用此版本替换程序并运行程序时，每个除零错误都会显示以下消息：\n\
  `Exception: java.lang.ArithmeticException: / by zero`\n\n虽然这在这种语境下没有特殊价值，但显示异常描述在其他情况下非常有价值——特别是当你正在尝试异常或进行调试时。\n\
  \n| 异常类型 | 异常原因 |\n| :--- | :--- |\n| `ArithmeticException` | 算术错误，如 - 除以 0 |\n\n\
  \n\n\n\n| ArrayIndexOutOfBoundsException | 数组索引越界 |\n| ArrayStoreException | 在数组中存储了错误类型的数据\
  \ |\n| FileNotFoundException | 访问不存在的文件 |\n| IOException | 无法从文件中读取 |\n| NullPointerException\
  \ | 由引用空对象引起 |\n| NumberFormatException | 字符串与数字转换失败 |\n| OutOfMemoryException |\
  \ 内存不足，无法分配新对象 |\n| SecurityException | Applet 尝试执行浏览器安全设置不允许的操作 |\n| StackOverflowException\
  \ | 系统栈空间耗尽 |\n| StringIndexOutOfBoundsException | 程序尝试访问字符串中不存在的字符位置 |\n\n## Java\
  \ 内置异常\n\n在标准包 `java.lang` 中，Java 定义了多个异常类。其中一些在之前的示例中已经用过。这些异常中最通用的是其标准类型 `RuntimeException`\
  \ 的子类。\n\n正如之前解释的，这些异常不需要包含在任何方法的 `throws` 列表中。在 Java 语言中，这些异常被称为**未检查异常**（unchecked\
  \ exceptions），因为编译器不会检查方法是否处理或抛出了这些异常。在 `java.lang` 中定义的未检查异常如表 -1 所示。表 -2 列出了由\
  \ `java.lang` 定义的异常，如果该方法可能产生此类异常且自身不进行处理，则必须将其包含在方法的 `throws` 列表中。这些被称为**检查异常**（checked\
  \ exceptions）。Java 还定义了其他与其各种类库相关的异常类型。\n\n![ss](img/image01236.jpeg)\n\n# 异常处理的一形式\n\
  \n![](img/image01237.jpeg)\n(异常处理机制)\n\n### 语法：\n\n```java\ntry {\n    statement;\
  \ // 生成异常\n} catch (Exception-type e) {\n    statement; // 处理异常\n}\n```\n\n## 多个\
  \ catch 子句\n\n在某些情况下，单段代码可能会抛出多个异常。为了处理这种情况，你可以指定两个或多个 catch 子句，每个子句捕获不同类型的异常。\n\
  \n当异常被抛出时，会按顺序检查每个 catch 语句，并执行第一个与异常类型匹配的语句。在一个 catch 语句执行后，其他 catch 语句将被跳过，执行将在\
  \ `try / catch` 块之后继续。下面的示例捕获了两种不同的异常类型：\n\n```java\n// 演示多个 catch 语句。\nclass MultipleCatches\
  \ {\n    public static void main(String args[]) {\n        try {\n            int\
  \ a = args.length;\n            System.out.println(\"a = \" + a);\n            int\
  \ b = 42 / a;\n            int c[] = {1};\n            c[2] = 99;\n        } catch\
  \ (ArithmeticException e) {\n            System.out.println(\"Divide by 0: \" +\
  \ e);\n        } catch (ArrayIndexOutOfBoundsException e) {\n            System.out.println(\"\
  Array oob: \" + e);\n        }\n        System.out.println(\"After try/catch blocks.\"\
  );\n    }\n}\n```\n\n如果程序在没有命令行参数的情况下启动，它将导致除以零异常，因为 `a` 等于 0。如果你提供了命令行参数，将 `a`\
  \ 设置为大于 0 的值，程序将正常运行。但它会导致 `ArrayIndexOutOfBoundsException`，因为 int 数组 `c` 的长度为 1，但程序却尝试给\
  \ `c[2]` 赋值。\n\n以下是两种运行方式生成的输出：\n```\nC:\\java MultipleCatches\na = 0\nDivide by\
  \ 0: java.lang.ArithmeticException: / zero\nAfter try/catch blocks.\n\nC:\\java\
  \ MultipleCatchesArg\na = 1\nArray oob: java.lang.ArrayIndexOutOfBoundsException:2\
  \ After try/catch blocks\n```\n\n在使用多个 catch 语句时，必须记住：**异常子类必须在其任何父类之前**。这是因为使用父类的\
  \ catch 语句会捕获该类型的异常以及它的任何子类异常。因此，如果子类在父类之后，它将永远无法被访问。此外，在 Java 中，不可达代码是一个错误。例如，考虑以下程序：\n\
  \n```java\n/* 此程序包含一个错误。\n在系列 catch 语句中，子类必须排在其父类之前。如果不是，\n将创建不可达代码并导致编译时错误。 */\n\
  class SuperCatch {\n    public static void main(String args[]) {\n        try {\n\
  \            int a = 0;\n            int b = 42 / a;\n        } catch (Exception\
  \ e) {\n            System.out.println(\"Generic catch.\");\n        } /* 这个 catch\
  \ 永远不会被到达，因为 ArithmeticException 是 Exception 的子类。 */\n        catch (ArithmeticException\
  \ e) { // 错误 – 不可用\n            System.out.println(\"This is never reached.\");\n\
  \        }\n    }\n}\n```\n\n如果你尝试编译此程序，将收到一条错误消息，说明第二个 catch 语句是不可达的，因为异常已经被捕获。由于\
  \ `ArithmeticException` 是 `Exception` 的子类，第一个 catch 语句将处理所有基于 `Exception` 的错误，包括\
  \ `ArithmeticException`。要修复这个问题，请交换 catch 语句的顺序。\n\n## 嵌套 try 语句\n\n`try` 语句可以嵌套。也就是说，一个\
  \ `try` 语句可以位于另一个 `try` 块内部。每当进入一个 `try` 语句，该异常的上下文就会推入栈。\n\n如果内部 `try` 语句没有针对特定异常的\
  \ catch 处理器，栈将回溯并检查下一个 `try` 语句的 catch 处理器是否匹配。这将一直持续，直到某个 catch 语句执行成功，或者耗尽所有的嵌套\
  \ `try` 语句。如果没有 catch 语句匹配，Java 运行时系统将处理该异常。\n\n多个 catch 语句：当存在多个 catch 语句时，就称为多个\
  \ catch 语句。\n\n多个 catch 语句示例：\n\n```java\ntry {\n    statement; // 生成异常\n} catch\
  \ (Exception-type-1 e) {\n    statement 1; // 处理类型 1\n} catch (Exception-type-2\
  \ e) {\n    statement 2; // 处理类型 2\n} catch (Exception-type-n e) {\n    statement\
  \ n; // 处理类型 n\n}\n```\n\n#### 示例 1.4\n\n```java\nclass ErrorTest {\n    public\
  \ static void main(String args[]) {\n        int a=10,b=2,c=2,d;\n        System.out.println(\"\
  Before Exception \");\n        d=a/(b-c);\n        System.out.println(\"After Exception\
  \ \");\n    }\n}\n```\n\n输出：\n![](img/image01238.jpeg)\n\n在这里我们没有捕获异常，因此程序会在显示消息“Before\
  \ Exception”后终止。现在我们使用异常处理来解决这个问题。\n\n### 示例 11.5\n\n```java\nclass ErrorTest5 {\n\
  \    public static void main(String args[]) {\n    }\n}\n```\n\n\n\n\n\n![](img/image01239.jpeg)\n\
  \n## 异常的优势\n\n- 我们可以很容易地确定异常/错误将在哪里处理。异常/错误在运行时沿调用堆栈向上传播——首先到达外层的 `try` 块，然后返回到调用者方法——直到异常处理器\
  \ `catch` 捕获它们。\n- 异常/错误的位置是确定的，因为用户可以获取完整的堆栈跟踪信息。这对于调试非常有帮助。\n- 程序员有机会从错误/异常状态中恢复过来。\n\
  - 错误处理代码与正常程序流分离，以提高可读性和可维护性。\n- 在 Java 中，无需测试是否会发生异常/错误情况。添加更多的错误/异常处理器只需添加更多的\
  \ `catch` 子句，而无需触动原始程序流。\n\n## 异常类的层级结构\n\n所有 `Exception` / `Error` 类的根类是 `Throwable`\
  \ 类，它是 `Object` 类的直接子类。异常/错误在 Java 中也是对象。`Exception` 的子类带有后缀 `Exception`。`throwable`\
  \ 有两个直接子类：\n\n### Error (错误)\n`Error` 类基本上用于信号异常的系统状态，这些状态通常是不可恢复的且不应该被处理：\n- `OutOfMemoryError`\
  \ 信号 Java 虚拟机内存耗尽，且垃圾器无法回收任何可用内存。\n- `StackOverflowError` 信号解释器发生堆栈溢出。\n\n### Exception\
  \ (异常)\n`Exception` 类通常是可恢复的。例如：\n- `EOFException` 信号我们打开的文件没有更多数据可读。\n- `FileNotFoundException`\
  \ 信号我们想要打开的文件在路径中不存在。\n- **检异常 (Checked Exception)**：如果必须 `catch` 某个异常，则它被称为检异常。如果在\
  \ `try` 块中可能发生检异常且未被处理，则程序将无法编译。编译器确保如果一个方法可以直接或间接地 `throw` 检异常，那么该方法必须显式地处理它。该方法要么\
  \ `catch` 异常并采取适当措施，要么将异常传递给调用者。运行时异常（Runtime-exception）及其子类是受检的。\n- **未检异常 (Unchecked\
  \ Exception)**：如果不需要 `catch` 某个异常，则它被称为未检异常。如果程序中发生了未处理的未检异常，程序将可以编译。但如果异常被处理，程序执行将因异常在该点终止。运行时异常及其所有子类都是未检异常，不需要捕获。所有用户定义的\
  \ `Exception` 都是检异常。\n\n`Exception` 类中的可用方法：\n\n| 方法 |  |\n| :--- | :--- |\n| `getMessage()`\
  \ | 获取与异常相关的消息。 |\n| `printStackTrace()` | 打印异常/错误发生处的堆栈跟踪。 |\n| `toString()` |\
  \ 显示异常/错误的名称以及消息。 |\n\n#### 示例 1\n\n![](img/image240.jpeg)\n\n```java\nclass Test\
  \ {\n    public static void main(String[] arr) {\n        int a=10,b=2,c=2,d;\n\
  \        try {\n            System.out.println(\"Before Exception\");\n        \
  \    d=a/(b-c);\n            System.out.println(\"This Will Not Print\");\n    \
  \    } catch(ArithmeticException e) {\n            System.out.println(\"After Exception\"\
  );\n            System.out.println(\"error : Division by zero\");\n            System.out.println(e.getMessage());\n\
  \            System.out.println(e); // 调用了 toString()\n            e.printStackTrace();\n\
  \        }\n    }\n}\n```\n\n输出：\n```\nBefore Exception\nAfter Exception\nerror\
  \ : Division by zero\njava.lang.ArithmeticException: by zero\njava.lang.ArithmeticException:\
  \ by zero\nat Test.main(Test.java:10)\n```\n\n### 示例 1：多个 catch\n\n```java\nclass\
  \ ErrorTest {\n    public static void main(String args[]) {\n        try {\n   \
  \         int a=args.length;\n            System.out.println(\"Before Exception\"\
  );\n            int b=5/a;\n            int c[] = {};\n            c[4]=10;\n  \
  \          System.out.println(\"After Exception\");\n        } catch(ArithmeticException\
  \ e) {\n            System.out.println(\"Divide by zero :\"+e);\n        } catch(ArrayIndexOutOfBoundsException\
  \ e) {\n            System.out.println(\"Array Index oob :\"+e);\n        }\n  \
  \      System.out.println(\"After try/catch block\");\n    }\n}\n```\n\n输出 1：当我们使用\
  \ `java ErrorTest` 运行上述程序时\n```\nBefore Exception\nDivide by zero :java.lang.ArithmeticException:\
  \ / by zero\nAfter try/catch block\n```\n\n输出 2：当我们使用 `java ErrorTest 45` 运行上述程序时\n\
  ```\nBefore Exception\nArray Index oob :java.lang.ArrayIndexOutOfBoundsException:\
  \ 47\nAfter try/catch block\n```\n\n\n\n\n\n## 嵌套 try catch\n\n如果我们在另一个 `try` 块中使用\
  \ `try` 和 `catch` 语句，则称之为嵌套 try catch。\n\n### 语法\n\n```java\ntry // 外层 try\n{\n\
  \    try // 内层 try\n    {\n        statement ;\n    }\n    catch1() // 内层 catch\n\
  \    {\n        statement ;\n    }\n    catch2() // 内层 catch\n    {\n        statement\
  \ ;\n    }\n}\ncatch() // 外层 catch\n{\n    statement ;\n}\n```\n\n### 示例 11.8 嵌套的\
  \ try 和 catch\n\n```java\nclass Nested {\n    public static void main(String args[])\
  \ {\n        try {\n            int a = args.length;\n            int b = 58/a;\n\
  \            System.out.println(\"a=\"+a);\n            try {\n                if\
  \ (a == 1)\n                    a = a/(a-a);\n                if (a == 2) {\n  \
  \                  int c[] = {1};\n                    c[42] = 100;\n          \
  \      }\n            } catch (ArrayIndexException e) {\n                System.out.println(\"\
  ArrayIndex oob \"+e);\n            }\n        } catch (ArithmeticException e) {\n\
  \            System.out.println(e.getMessage());\n        }\n    }\n}\n```\n\n**输出\
  \ I:**\n当我们以 `java Error8` 运行程序时 / 除以零\n\n**输出 II:**\n当我们以 `java Error8 10` 运行程序时\n\
  `a=1 / by zero`\n\n**输出 III:**\n当我们以 `java Error8 10 20` 运行程序时\n`a=2`\n`ArrayIndex\
  \ oob java.lang.ArrayIndexOutOfBoundsException: 42`\n\n## finally 语句\n\nJava 支持另一种名为\
  \ `finally` 的语句，它可以用于处理未被之前的任何 `catch` 语句捕获的异常。`finally` 块可以用于处理在 `try` 块内部生成的任何异常。无论是否发生错误，它都会执行。它可以紧跟在\
  \ `try` 块之后，也可以跟在最后一个 `catch` 块之后，如下所示：\n\n### 语法：\n\n```java\ntry\n{\n    // ...\n\
  }\ncatch (...)\n{\n    // ...\n}\ncatch (...)\n{\n    // ...\n}\nfinally\n{\n  \
  \  // ...\n}\n```\n\n### 示例 1.9 finally 语句\n\n```java\nclass ErrorTest9 {\n    public\
  \ static void main(String args[]) {\n        int a[] = {5,10};\n        int b =\
  \ 5;\n        try {\n            int x = a[2]/b-a[1];\n        } catch (ArithmeticException\
  \ e) {\n            System.out.println(\"Division Zero\");\n        } catch (ArrayIndexException\
  \ e) {\n            System.out.println(\"Array Index error\");\n        } catch\
  \ (ArrayStoreException e) {\n            System.out.println(\"Wrong Data Type\"\
  );\n        } finally { // 始终执行\n            System.out.println(\"Always Execute\"\
  );\n            int y = a[1]/a[0];\n            System.out.println(\"y = \"+y);\n\
  \        }\n    }\n}\n```\n**输出:**\n`Array Index error`\n`Always Execute`\n`y =2`\n\
  \n到目前为止，我们只捕获由运行时系统抛出的异常。然而，我们的程序也可以使用 `throw` 语句显式地抛出异常，`throw` 的通用形式所示：\n\n`throw\
  \ instance;`\n\n这里，`instance` 必须是 `Throwable` 类型的对象或其子类。简单类型如 `int` 或 `char`，以及非\
  \ `Throwable` 类（如 `String` 和 `Object`）不能作为异常。我们有两种方法可以获取 `Throwable` 对象：使用 `catch`\
  \ 子句中的参数，或者使用 `new` 操作符创建一个。\n\n执行流在 `throw` 语句后立即停止；任何后续语句都不会执行。程序将检查最近的嵌套 `try`\
  \ 块，查看是否有匹配异常类型的 `catch` 语句。如果找到匹配，控制权将转移到该语句。如果没有，则检查下一个嵌套的 `try` 语句，以此此类推。如果没有找到匹配的\
  \ `catch`，则默认异常处理器将停止程序并打印堆栈跟踪。在这里我们取创建一个并抛出异常的程序。捕获异常的处理器将其重新抛出给外层处理器。\n\n### 示例\
  \ 1.10\n\n```java\nclass ErrorTest10 {\n    int age;\n    void setAge(int a) {\n\
  \        if (a > 0)\n            age = a;\n        else\n            throw new NullPointerException(\"\
  Invalid\");\n    }\n    public static void main(String args[]) {\n        ErrorTest10\
  \ a1 = new Error10();\n        try {\n            a1.setAge(20);\n            a1.setAge(-10);\n\
  \        } catch (NullPointerException e) {\n            System.out.println(e.getMessage());\n\
  \        }\n    }\n}\n```\n\n\n\n\n\n## throws\n\n如果一个方法可能会导致它未处理的异常，则它必须指定这种行为，以便该方法的调用者能够针对该异常进行防护。我们通过在方法的声明中包含\
  \ `throws` 子句来实现这一点。`throws` 子句列出了方法可能抛出的异常类型。\n\n这对于所有检查异常（checked exceptions）都是必须的。方法可以抛出的所有异常必须在\
  \ `throws` 子句中声明。否则，会导致编译时错误。这是一个包含 `throws` 子句的方法声明通用形式：\n\n### 语法\n```\ntype method-name(parameter\
  \ list)throws exception-list\n{\n    //方法体\n}\n```\n在这里，`exception list` 是方法可以抛出的异常的用逗号分隔的列表。\n\
  \n### 示例 11.11\n```java\nimport java.io.*;\n\nclass ErrorTest11 {\n    int age;\n\
  \    void setAge(int a) throws IOException {\n        if(a>0)\n            age =\
  \ a;\n        else {\n            IOException e = new IOException(\"Invalid Age\"\
  );\n            throw e;\n        }\n    }\n\n    public static void main(String\
  \ args[]) {\n        ErrorTest11 a1 = new ErrorTest11();\n        try {\n      \
  \      a1.setAge(20);\n            a1.setAge(-10);\n        } catch(IOException\
  \ e) {\n            System.out.println(e.getMessage());\n        }\n    }\n}\n```\n\
  **输出：**\n```\nInvalid Age\n```\n\n## 创建用户定义的异常/错误子类\n\n### 自己的异常子类\n这非常简单，只需定义 `Exception/Error`\
  \ 类的子类即可。我们的子类并不需要实际实现任何内容。`Exception/Error` 类本身没有定义任何方法。当然，它继承了 `Throwable` 类提供的方法。\n\
  \n尽管 Java 的内置异常处理了大多数常见错误，但你可能想要创建自己的异常类型来处理特定于你应用程序的情况。这非常简单：只需定义 `Exception` 的子类（当然，它是\
  \ `Throwable` 的子类）即可。\n\n你的子类并不需要实际实现任何内容——它们在类型系统中的存在就使得你能够将它们作为异常使用。\n\n`Exception`\
  \ 类本身没有定义任何方法。当然，它继承了由 `Throwable` 提供的方法。因此，所有异常（包括你创建的异常）都可以使用 `Throwable` 定义的方法。\n\
  \n`Exception` 定义了四个构造函数。其中两个支持链式异常（将在下一节中描述）。另外两个在此所示：\n- `Exception()`\n- `Exception(String\
  \ msg)`\n\n第一种形式创建一个没有描述的异常。第二种形式允许你指定异常的描述。虽然在创建异常时指定描述通常很有用，但有时重写 `toString()`\
  \ 更好。原因如下：`Throwable` 定义（并 `Exception` 继承）的 `toString()` 版本显示异常名称，后面跟着一个冒号，然后是你的描述。通过重写\
  \ `toString`，你可以防止异常名称和冒号显示。这使得输出更加整洁，在某些情况下是需要的。\n\n### 示例 1.2\n```java\nclass\
  \ AgeException extends Exception {\n    AgeException(String msg) {\n        super(msg);\n\
  \    }\n}\n\nclass ErrorTest2 {\n    int age;\n    void setAge(int a) throws AgeException\
  \ {\n        if(a>0)\n            age = a;\n        else {\n            AgeException\
  \ e = new AgeException(\"Invalid Age\");\n            throw e;\n        }\n    }\n\
  \n    public static void main(String args[]) {\n        ErrorTest2 a1 = new ErrorTest2();\n\
  \        try {\n            a1.setAge(20);\n            a1.setAge(-10);\n      \
  \  } catch(AgeException e) {\n            System.out.println(e.getMessage());\n\
  \        }\n    }\n}\n```\n**输出：**\n```\nInvalid Age\n```\n\n以下示例声明了一个 `Exception`\
  \ 的新子类，然后使用该子类在方法中指示错误条件。它重写了 `toString()` 方法，允许显示经过精心定制的异常描述。\n\n![sss](img/image01241.jpeg)\n\
  \n此示例定义了一个名为 `MyException` 的 `Exception` 子类。该子类非常简单：它只有一个构造函数以及一个重写的 `toString()`\
  \ 方法，用于显示异常的值。\n\n`ExceptionDemo` 类定义了一个名为 `compute()` 的方法，该方法抛出一个 `MyException`\
  \ 对象。当 `compute()` 的整数参数大于 10 时，会抛出该异常。`main()` 方法为 `MyException` 设置了异常处理器，然后用一个合法值（小于\
  \ 10）和一个不合法值调用 `compute()`，以展示代码中的两种路径。\n\n结果如下：\n```\nCalled compute(1)\nNormal\
  \ exit\nCalled compute(20)\nCaught MyException[20]\n```\n\n### 链式异常\n链式异常功能允许我们将另一个异常与异常相关联。第二个异常描述了第一个异常产生。例如，想象一种情况，方法由于尝试除以零而抛出\
  \ `ArithmeticException`。然而，问题的实际原因是发生了 I/O 错误，导致除数被设置不正确。\n\n\n\n\n\n```java\nThrowable(Throwable\
  \ causeExc)\nThrowable(String msg, Throwable causeExc)\n```\n\n在第一种形式中，`causeExc`\
  \ 是发生的异常。第二种形式允许我们在指定原因异常的同时指定一个描述信息。这两个构造函数也被添加到了 `Error`、`Exception` 和 `RuntimeException`\
  \ 类中。\n\n添加到 `Throwable` 类中的链式异常方法是 `getCause()` 和 `initCause()`。\n\n```java\nThrowable\
  \ getCause()\nThrowable initCause(Throwable causeExc)\n```\n\n`getCause()` 方法返回当前异常的底层异常。如果没有底层异常，则返回\
  \ `null`。`initCause()` 方法将 `causeExc` 与调用的异常关联，并返回该异常的引用。因此，我们可以在异常创建后为其关联一个原因。然而，原因异常只能设置一次。\n\
  \n因此，对于每个异常对象我们只能调用一次 `initCause()`。此外，如果原因异常是通过构造函数设置的，那么我们无法再次使用 `initCause()`\
  \ 方法来设置它。通常情况下，`initCause()` 用于为不支持前述两个额外构造函数的旧异常类设置原因。Java 大多数内置异常都没有定义额外的构造函数。因此，如果我们需要为这些异常添加异常链，将使用\
  \ `initCause()`。\n\n链式异常并不是每个程序都需要的。但在了解底层原因有用的情况下，它们提供了一种优雅的解决方案。\n\n### 示例 11.13\n\
  \n1. 类 `ErrorTest13`\n2. ```java\nclass ErrorTest13 {\n    int age;\n    void setAge(int\
  \ a) {\n        if(a>0)\n            age = a;\n        else {\n            NullPointerException\
  \ e = new NullPointerException(\"Admission Failed\");\n            e.initCause(new\
  \ ArithmeticException(\"Age is invalid\"));\n            throw e;\n        }\n \
  \   }\n    public static void main(String args[]) {\n        ErrorTest13 a1 = new\
  \ Error13();\n        try {\n            a1.setAge(20);\n            a1.setAge(-10);\n\
  \        } catch(NullPointerException e) {\n            System.out.println(e.getMessage());\n\
  \            System.out.println(e.getCause());\n        }\n    }\n}\n```\n**输出：**\n\
  ```\nAdmission Failed\nAge is Invalid\n```\n\n在这个示例中，顶层异常是 `NullPointerException`。在它上面添加了一个原因异常\
  \ `ArithmeticException`。当异常从 `setAge()` 抛出时，它被 `main()` 捕获。在那里，显示了顶层异常，随后是通过调用 `getCause()`\
  \ 获取的底层异常。链式异常可以延伸到任何必要的深度。因此，原因异常本身也可以有自己的原因。请注意，过长的异常链可能意味着设计不当。链式异常并不是每个程序都需要的。但在了解底层原因有用的情况下，它们提供了一种优雅的解决方案。\n\
  \n### 三个 JDK 7 新特性（已更新）\n\nJDK 7 为异常系统增加了三个有趣且实用的特性。第一个是自动化了释放资源（如文件）不再需要时的过程。它基于\
  \ `try` 语句的扩展形式，称为 `try-with-resources`，将在后续章节中描述。\n\n第二个新特性称为 `multi-catch`（多异常捕获），第三个有时被称为\
  \ `final rethrow`（最终重抛）或更精确的重抛。这里描述了后两个特性。\n\n`multi-catch` 特性允许两个或多个异常被同一个 `catch`\
  \ 句捕获。两个或多个异常处理程序使用相同的代码序列并不罕见，尽管它们响应的是不同的异常。与其逐个捕获每种异常类型，现在可以使用单个 `catch` 子句处理所有异常，而避免代码重复。\n\
  \n要使用 `multi-catch`，在 `catch` 子句中使用或运算符（`|`）分隔每个异常类型。每个 `multi-catch` 参数隐式地为 `final`（如果需要，你可以显式指定\
  \ `final`，但没有必要）。因为每个 `multi-catch` 参数隐式为 `final`，所以它们不能被赋予新值。\n\n这是一个使用 `multi-catch`\
  \ 特性同时捕获 `ArithmeticException` 和 `ArrayIndexOutOfBoundsException` 的 `catch` 语句：\n\
  \n```java\ncatch(ArithmeticException | ArrayIndexOutOfBoundsException e) {\n```\n\
  \n下面的程序展示了 `multi-catch` 特性的用法：\n\n```java\n// 展示 JDK 7 的 multi-catch 特性。\nclass\
  \ MultiCatch {\n    public static void main(String args[]) {\n        int a=10,\
  \ b=0;\n        int vals[] = { 1, 2, 3 };\n        try {\n            int result\
  \ = a / b; // 生成一个 ArithmeticException\n            // vals[10] = 19; // 生成一个 ArrayIndexOutOfBoundsException\n\
  \            // 这个 catch 子句捕获了这两个异常。\n        } catch(ArithmeticException | ArrayIndexOutOfBoundsException\
  \ e) {\n            System.out.println(\"Exception caught: \" + e);\n        }\n\
  \        System.out.println(\"After multi-catch.\");\n    }\n}\n```\n\n当尝试除以零时，程序将生成一个\
  \ `ArithmeticException`。如果你注释掉除法语句并移除下一行的注释符号，就会生成 `ArrayIndexOutOfBoundsException`。这两个异常都会被同一个\
  \ `catch` 语句捕获。\n\n更精确的重抛特性限制了可以重抛的异常类型，仅限于关联 `try` 块抛出的受检异常（checked exceptions）、未被之前的\
  \ `catch` 子句处理且是参数子类或超类的异常。虽然这种能力并不经常需要，但现在已经可以使用。为了使更精确的重抛特性生效，`catch` 参数必须是有效\
  \ final（即在 catch 块内部没有被赋值新值）或显式声明为 `final`。\n\n### 使用异常\n\n异常处理为具有许多动态特征复杂程序提供了一种强大的机制。将\
  \ `try`、`throw` 和 `catch` 视为处理程序逻辑中错误和异常边界条件的整洁方式。与其他某些使用错误返回码来指示失败的语言不同，Java 使用异常。因此，当方法可能失败时，让它抛出异常。\n\
  \n这是处理失败模式的一种更高的方法。最后一点：Java 的异常处理语句不应被视为非局部跳转的通用机制。如果你这样做，只会让代码变得混乱且难以维护。\n\n###\
  \ 理论题\n\n1. 什么是异常？\n2. 我们如何定义 `try` 块？\n3. 我们如何定义 `catch` 块？\n\n\n\n\n\n## 4. 列举\
  \ Java 中可能发生的一些常见异常类型。给出示例。\n\n## 5. 捕获所有类型的异常是必要的吗？\n\n## 6. 一个 try 块可以使用多少个 catch\
  \ 块。\n\n## 7. 创建一个可能产生三种异常的 try 块，并包含必要的 catch 块来捕获并适当地处理这些异常。\n\n## 8. 什么是 finally\
  \ 块？什么时候以及如何使用？给出一个合适的示例。\n\n## 9. 解释异常处理机制如何用于程序调试。\n\n![11](img/image01212.jpeg)\
  \ ![11](img/image01212.jpeg) ![11](img/image01212.jpeg) ![11](img/image01212.jpeg)\
  \ ![11](img/image01212.jpeg)\n\n![STAR-LOGO-2013](img/image01213.jpeg)\n\n# 章节：∞\
  \ 12 ∞\n(多线程编程)\n\n### 引言\n线程是程序中的单一控制流。线程与进程非常相似。事实上，线程也被称为轻量级进程。\n\n### 线程对比进程\n\
  通常情况下，不同的进程占用不同的内存空间。当 CPU 从一个进程切换到另一个进程时，当前运行进程的状态会被保存，另一个进程的状态会被恢复。在状态切换期间没有进行任何有用工作。状态切换时间应该尽可能短，以最大化\
  \ CPU 的利用率。\n\n线程也像独立的进程，但它们共享相同的内存和状态。各个线程也有独立的状态，但与进程状态相比，该状态非常小。状态可能只包含程序计数器和栈指针。因此，从一个线程切换到另一个线程所需的时间非常短。因此与进程相比，线程的上下文切换时间非常小。因此在多线程情况下，CPU\
  \ 的利用率高于多进程情况下的利用率。\n\n### 多线程程序\n多线程程序包含两个或多个可以并发运行的部分。此类程序的每个部分被称为线程，每个线程都定义了一条独立的执行路径。因此，多线程是多任务处理的一种特殊形式。\n\
  \n例如，一个程序可能有三个线程：\n* 一个负责打印。\n* 一个负责编辑。\n* 一个负责从互联网下载文件。\n\n所有这些线程可能都在并发运行，从而最大化\
  \ CPU 的利用率。\n\n### 基于进程的多任务处理\n大多数操作系统允许我们同时运行两个或多个程序。这被称为基于进程的多任务处理。例如，我们可以运行一个\
  \ Java 程序并同时编辑一个 Word 文档。基于进程的多任务处理确保了大部分时间会有程序在执行，从而增加了 CPU 的利用率。\n\n在基于进程的多任务处理中，程序是调度程序可以分派的最小代码单元。\n\
  \n### 基于线程的多任务处理\n线程是基于线程的多任务环境中执行的最小单元。一个进程可以被分成若干个并发执行的线程。这允许我们在单个程序中并发处理多个任务。\n\
  \n例如，我们可以在编辑 Word 文档的同时打印另一个文档。基于线程的多任务处理像基于进程的多任务处理一样提高了 CPU 的利用率。但同时，它通过在单独线程中并发执行程序的不同部分，有效地加快了单个程序的执行速度。\n\
  \n因此，基于进程的多任务处理处理“大局”，而基于线程的多任务处理处理“细节”。\n\n### Java 线程模型\nJava 运行时系统许多方面依赖线程，所有的类库在设计时都考虑了多线程。事实上，Java\
  \ 使用线程来使整个环境成为异步。这有助于通过防止 CPU 周期的浪费来降低效率。\n\n单线程系统使用一种称为“事件循环加轮询”的方法。在这种模型中，单一控制线程在无限循环中运行，轮询单个事件队列以决定下一步做什么。在单线程环境中，当线程因为等待某些资源而阻塞（即挂起执行）时，整个程序都会停止运行。\n\
  \nJava 多线程的优势在于消除了主循环/轮询机制。当 Java 程序中的线程被阻塞时，只有被阻塞的那个线程会暂停，所有其他线程继续运行。\n\n### 线程生命周期（线程状态）\n\
  线程存在多种状态。线程可以处于运行状态。它一旦获得 CPU 时间就可以进入就绪运行状态。运行中的线程可以被挂起，暂时停止其活动。被挂起的线程随后可以恢复，允许它从中断的地方继续。线程在等待资源时可能会被阻塞。在任何时候，线程都可以被终止，立即停止其执行。线程一旦终止，就无法恢复。\n\
  \n#### 1. 新生状态 (Newborn State)\n当我们创建一个线程时，线程就出生了，被称为新生状态。该线程尚未被调度运行。在此时状态下，我们只能对其执行以下操作之一：\n\
  1. 使用 `start()` 调度其运行。\n2. 使用 `stop()` 将其杀死。\n\n如果被调度，它将进入可运行状态。如果我们在此状态下尝试使用任何其他方法，将抛出异常。\n\
  \n#### 2. 可运行状态 (Runnable State)\n可运行状态意味着线程已准备好执行，并正在等待处理器的可用。也就是说，线程已加入等待执行的线程队列。如果所有线程的优先级相同，则它们被轮流分配执行时间片。\n\
  \n放弃控制权的线程会重新加入队列的末尾并再次等待运行。然而，如果我们想让线程在轮到它之前向其他线程放弃控制权，可以通过调用 `yield()` 实现。\n\n\
  #### 3. 运行状态 (Running State)\n运行状态意味着处理器已将时间分配给线程进行执行。运行中的线程在以下情况下可能会放弃控制权：\n* 其时间片结束。\n\
  * 被高优先级线程抢占。\n* 它让出（即主动放弃控制权）。\n* 它完成了执行。\n* 被其他线程停止。\n* 被 `suspend()` 挂起。被挂起的线程可以通过\
  \ `resume()` 恢复。这种方法在我们想要由于某些原因暂停线程一段时间但不想杀死它时非常有用。\n* 它被要求等待某些事件发生。这通过 `wait()`\
  \ 实现。线程可以通过 `notify()` 调度再次运行。\n* 它正在执行某些 I/O 操作。\n\n#### 4. 阻塞状态 (Blocked State)\n\
  当线程被阻止进入可运行状态随后进入运行状态时，被称为阻塞。这发生在线程挂起、睡眠或等待以满足某些需求时。阻塞线程被认为“不可运行”但未死亡，因此完全能够再次运行。\n\
  \n#### 5. 死亡状态 (Dead State)\n每个线程都有生命周期。运行的线程在执行完 `run()` 方法后结束生命。它有自然死亡。然而，我们可以在任何状态向它发送停止消息来杀死它，从而导致过早死亡。线程在刚出生时、运行期间甚至在处于“不可运行”（阻塞状态）时都可以被杀死。\n\
  \n### 线程优先级 (Thread Priorities)\nJava 为每个线程分配一个优先级，该优先级决定了如何对待该线程。线程优先级是整数，指定了一个线程相对于另一个线程的相对优先级。\n\
  \n\n\n\n\n作为一个绝对值，优先级是毫无意义的；如果一个线程是唯一运行的线程，那么高优先级线程的运行速度不会比低优先级线程快。相反，线程的优先级用于决定何时从一个正在运行的线程切换到下一个。这被称为上下文切换（context\
  \ switch）。决定上下文切换何时发生的规则非常简单：\n\n*   线程可以自愿地（自己）放弃控制权。这是通过显式地让出（yielding）、睡眠（sleeping）、阻塞（blocking）或等待\
  \ I/O 来。在这种情况下，系统会检查所有其他线程，通常会将 CPU 赋予就绪运行的最高优先级线程。\n*   线程可以被高优先级线程抢占（pre-empted）。在这种情况下，一个不释放处理器的低优先级线程无论正在做什么，都会会被高优先级线程直接抢占。基本上，只要有高优先级线程想要运行，它就会运行。这被称为抢占式多任务处理（preemptive\
  \ multitasking）。\n*   某些操作系统支持非抢占式优先级调度。在这种情况下，高优先级线程只有在低优先级线程完成后才能获得机会。\n*   当两个优先级相同的线程竞争\
  \ CPU 周期时，情况会变得稍微复杂一些。对于像 windows98 这样的操作系统，等优先级的线程必须自愿地（自己）向同级线程让出（放弃）控制权。如果它们这样做，其他线程将不会运行。\n\
  \n注意：操作系统处理等优先级线程上下文切换的方式可能会产生问题。\n\n### 同步 (Synchronization)\n\n由于多线程为我们的程序引入了异步行为，我们必须有某种方法在需要时强制同步。例如，如果我们想让两个线程进行通信并共享一个复杂的数据结构（如链表），我们需要某种方式来确保它们不会发生冲突。\n\
  \n也就是说，我们必须防止一个线程在另一个线程正在读取数据时写入数据。Java 使用监视器（monitor）进行线程间同步。我们可以将监视器想象成只能容纳一个线程的小盒子。一旦线程进入监视器，监视器就可以用来保护共享资源不被多个线程同时操作。\n\
  \n大多数多线程系统将同步暴露为对象，我们的程序必须显式地获取并锁定。Java 提供了一个更简洁的解决方案。\n\n这里没有 `monitor` 类，相反，每个对象都有自己的隐式监视器，当调用该对象的\
  \ `synchronized` 方法时，该监视器会自动进入。一旦线程进入 `synchronized` 方法，其他线程就无法调用该对象上的任何其他 `synchronized`\
  \ 方法。这使我们能够编写非常清晰且简洁的多线程代码，因为同步支持内置在语言中。\n\n## 消息传递 (Messaging)\n\n使用大多数其他语言编程时，我们必须依赖操作系统来建立线程之间的通信。\n\
  \n这无疑增加了开销。相比之下，Java 提供了一种简洁、低成本的方法让两个或多个线程通过调用所有对象都拥有的定义方法进行通信。Java 的消息传递系统允许线程进入对象的\
  \ `synchronized` 方法，然后在那里等待，直到其他某个线程显式通知退出。\n\n## Thread 类和 Runnable 接口\n\nJava\
  \ 的多线程系统构建在 `Thread` 类、其方法及其伴侣接口 `Runnable` 之上。该类属于 `java.lang` 包，因此不需要显式导入。\n\n\
  `Thread` 封装了一个执行线程，由于我们无法直接引用运行线程的内部状态，我们将通过它的代理（即产生它的 `Thread` 实例）来处理处理它。要创建一个新线程，我们的程序要么扩展\
  \ `Thread` 类，要么实现 `Runnable` 接口。`Thread` 类定义了几个有助于管理线程的方法：\n\n| 方法 | 描述 |\n| :---\
  \ | :--- |\n| `String getName()` | 返回此线程的名字 |\n| `int getPriority()` | 返回此线程的优先级\
  \ |\n| `boolean isAlive()` | 测试此线程是否仍在运行 |\n| `void join()` | 等待此线程死亡（终止） |\n| `void\
  \ run()` | 如果此线程在使用单独 `Runnable` 对象构造的，则调用该 `Runnable` 对象的 `run` 方法；否则，此方法什么都不做并返回；如果扩展了线程类并在子类中重写了\
  \ `run()` 方法，则调用被重写的 `run()` 方法。 |\n| `void setName(String name)` | 将此线程的名字更改为参数\
  \ name |\n| `static void sleep(long millis) throws InterruptedException` | 使当前执行的线程睡眠指定的毫秒数（临时停止执行）。(1\
  \ sec = 1000ms) |\n| `static void sleep(long millis, int nanos) throws InterruptedException`\
  \ | 使当前执行的线程睡眠指定的毫秒数加上指定的纳秒数（停止执行）。 |\n| `void start()` | 导致此线程开始执行，Java 虚拟机调用此线程的\
  \ `run` 方法。 |\n| `static void yield()` | 使当前执行的线程对象临时暂停并允许其他线程执行。 |\n| `static Thread\
  \ currentThread()` | 返回当前执行的线程对象的引用。 |\n\n### 主线程 (main thread)\n\n当 Java 程序启动时，一个线程会立即开始。这通常被称为我们程序的主线程（main\
  \ thread），因为它是程序开始时执行的线程。主线程是创建“子”线程的线程。虽然主线程是在程序启动时创建的，但可以通过 `Thread` 对象对其控制。要实现这一点，我们必须通过调用\
  \ `currentThread()` 获取引用，它是 `Thread` 类的 `public static` 成员。该方法返回调用它的方法的线程的引用。一旦我们有了主线程的引用，就可以像控制其他线程一样控制它。\n\
  \n示例 2：下面的示例演示了如何使用 `Thread` 类的方法获取主线程引用并访问其属性。\n\n```java\nclass CurrentTest {\n\
  \    public static void main (String args[]) {\n        Thread t = Thread.currentThread();\n\
  \        System.out.println(\"Current thread:\" + t);\n        System.out.println(\"\
  Name:\"+ t.getName());\n        System.out.println(\"Priority:\"+ t.getPriority());\n\
  \        t.setName(\"MyThread\");\n        t.setPriority(Thread.MAX_PRIORITY);\n\
  \        System.out.println(\"After name and priority change :\" + t);\n       \
  \ System.out.println(\"Name:\" + t.getName());\n        System.out.println(\"Priority:\"\
  \ + t.getPriority());\n        for (int n=1; n<=5; n++) {\n            System.out.println(n);\n\
  \            try {\n                Thread.sleep(1000);\n            } catch (InterruptedException\
  \ e) {\n                System.out.println(\"Main thread interrupted\");\n     \
  \       }\n        }\n    }\n}\n```\n\n\n\n\n\n注意 1：`Thread` 类中的 `sleep()` 方法可能会抛出\
  \ `InterruptedException`，这是一个检查异常。当其他线程想要中断这个正在睡眠的线程时，就会发生这种情况。\n\n注意 2：注意当 `t`（线程引用）作为\
  \ `println()` 的参数时产生的输出。它将按顺序显示：线程名称、其优先级以及其线程组名称。它的优先级为 5，这是默认值，`main` 也是该线程所属线程组的名称。线程组（thread\
  \ group）是一个用于控制一组线程状态的数据结构。\n\n### 创建线程\n\n从广义上说，我们通过实例化 `Thread` 类型的对象来创建一个线程。Java\
  \ 识别了两种实现这一目标的方法：\n\n1. 我们可以实现 `Runnable` 接口。\n2. 我们可以扩展 `Thread` 类本身。\n\n### 实现\
  \ Runnable\n\n创建线程最简单的方法是创建一个实现了 `Runnable` 接口的类。要实现 `Runnable`，类只需要实现一个名为 `run()`\
  \ 的方法。\n\n```java\npublic void run()\n```\n\n在 `run()` 方法内部，我们将定义构成新线程的代码。`run()`\
  \ 可以调用其他方法、使用其他类并声明变量，就像主线程一样。\n\n唯一的区别是，`run()` 为我们程序中的另一个并发执行线程建立了了入口点。该线程将在 `run()`\
  \ 返回时结束。\n\n在我们创建一个实现了 `Runnable` 的类后，我们将在该类内部使用以下构造函数之一实例化 `Thread` 类型的对象：\n\n\
  ```java\nThread(Runnable threadObj)\nThread(Runnable threadObj, String threadName)\n\
  ```\n\n在这里，`threadObj` 是被调用的 `run` 方法的对象，`threadName` 是新线程的名称。在新线程创建后，在我们调用 `start()`\
  \ 方法之前，它不会开始运行。\n\n`start()` 方法将线程放入就绪队列（可运行状态）。每当线程被调度时，它的执行将从 `run()` 方法开始。\n\n\
  ### 示例 12.2\n\n```java\nclass A implements Runnable {\n    public void run() {\n\
