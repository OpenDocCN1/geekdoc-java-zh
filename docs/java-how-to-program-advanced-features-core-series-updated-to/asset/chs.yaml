  \n1. 编写一个计算整数平均值的程序。\n2. 编写一个程序在不使用第三方变量的情况下交换两个数字。\n3. 编写一个程序将小时、分钟和秒转换为总秒数。\n\
  4. 编写一个程序计算给定圆的面积和周长。\n\n## 第二章 Java 语言\n\n### 标记 (Tokens)\n\n最小的单元被称为标记，如 `keywords（关键字）`、`identifiers（标识符）`、`strings（字符串）`\
  \ 和 `Operators（运算符）`。\n\nA. `Keywords（关键字）`是语言的保留名称，不能用变量、函数等的名称。\nB. `Identifier（标识符）`是指变量、数组、类、接口等的名称。\n\
  C. `Constants/Literals（常量）`是指我们在程序中无法改变的固定值。\nD. `Operators（运算符）`是作用于`variable（变量）`和`constants（常量）`并形成`expression（表达式）`的特殊符号。\n\
  E. `Separators（分隔符）`是用于分隔语句的特殊字符，如 `()`、`{}`、`[]`、`;`、`,`。\n\n### 关键字 (Keywords)\n\
  \n`abstract`, `assert`, `boolean`, `break`, `byte`, `case`, `catch`, `char`, `class`,\
  \ `default`, `do`, `double`, `else`, `extends`, `final`, `finally`, `float`, `goto`,\
  \ `if`, `if`, `implements`, `import`, `instanceof`, `int`, `interface`, `long`,\
  \ `native`, `package`, `private`, `public`, `return`, `short`, `strictfp`, `super`,\
  \ `synchronized`, `this`, `throw`, `throws`, `transient`, `try`, `void`, `volatile`.\n\
  \n\n\n\nJava 提供了丰富的运算符算集。运算符将常量、变量和子表达式组合成表达式。Java 中的大多数运算符的行为与 C/C++ 相似，但有少量不同之处，本文将在此介绍这些差异。\n\
  \n运算符可以分类为：\n\n### 算术运算符 (+, -, *, /, %)\n\n- 这些运算符与 C/C++ 中的相同。\n- `%` 运算符也可以作用于浮点数。\n\
  - 当二元运算符应用于两个不同类型的操作数时，低类型的操作数会在求值之前转换为高类型，结果的类型将与高类型操作数的类型相同。\n- 对于 `int` 类型，除以零或对零取模会导致\
  \ `ArithmeticException`（运行时错误），但对于浮点数则不会。\n- 当我们对 `int` 应用算术运算符且结果超出了 `int` 的范围时，额外的高位将被截断，这个新值将赋值给接收结果的变量；但在浮点类型中，如果发生溢出将导致\
  \ `Infinity` 或 `–Infinity`，如果发生下溢将导致 `0`。\n\n### 递增和递减运算符 (++, --)\n\n- 这些运算符与 C/C++\
  \ 中的相同。\n\n```\nint a=5,b;\nb = ++a*++a;\nSystem.out.print(b); //42\na = 5;\nSystem.out.print(++a*++a);\
  \ //42\n```\n\n### 关系运算符 (<, >, <=, >=, instanceof)\n\n- 这些运算符与 C/C++ 相同，但 `<`,\
  \ `<=`, `>`, `>= 不能应用于布尔类型和引用类型。\n\n### instanceof 运算符 -\n\n`instanceof` 运算符用于测试对象的类。`instanceof`\
  \ 运算符的通用形式为：\n\n```java\nif(object instanceof type)\n```\n\n在这里，`object` 是一个类的实例，`type`\
  \ 是类类型。如果 `object` 是指定类型的实例或指定类型任何子类的实例，则 `instanceof` 运算符返回 `true`，否则结果为 `false`。\n\
  \n### 赋值运算符 (=, +=, -=, *=, /=, %)\n\n- 这些运算符与 C/C++ 中的相同。\n\n### 等于运算符 (=, !=)\n\
  \n- 这些运算符与 C/C++ 中的相同。\n\n### 逻辑运算符 (&&, ||, !)\n\n- 这些运算符与 C/C++ 中的相同。\n\n### 条件运算符\
  \ (? :)\n\n- 该运算符与 C/C++ 中的相同。\n\n### 位运算运算符 (&, |, ^, ~, <<, >>, >>>)\n\n- 这些运算符与\
  \ C/C++ 相同，位移运算符除外。位移运算符仅适用于整数类型。\n\n### 左移 (<<) 运算符\n\n为了得到 `<<` 运算符的结果，左侧操作数中的位将根据右侧操作数指定的向左移动，右侧的空位将用零填充。左移\
  \ 1 位等于乘以 2。结果的符号可能与左侧操作数的符号不同。这可能是因为符号取决于最左位，该位可能会从 0 变为 1 或从 1 变为 0，从而改变符号。\n\n\
  示例 `b = a << 2;`。为了得到 `b` 的值，将 `a` 中的位左移 2 位，并用零填充右侧 2 位。\n\n### 右移 (>>) 运算符（有符号）\n\
  \n为了得到 `>>` 运算符的结果，左侧操作数中的位将根据右侧操作数指定的向右移动，左侧的空位将用符号位填充。右移 1 位等于除以 2。该运算符永远 way\
  \ 结果的符号，即它与左侧操作数的符号相同。\n\n示例 `b = a >> 2;`。为了得到 `b` 的值，将 `a` 中的位右移 2 位，并用符号填充右侧\
  \ 2 位（如果 `a` 为正则填充 0，如果 `a` 为负则填充 1）。\n\n### 零填充右移 (>>>) 运算符（无符号）\n\n为了得到 `>>>`\
  \ 运算符的结果，左侧操作数中的位将根据右侧操作数指定的向右移动，左侧的空位将用 0 填充。右移 1 位等于除以 2。如果发生了位移，结果将始终为正数，因为最右侧位将变为零。\n\
  \n示例 `b = a >>> 2;`。为了得到 `b` 的值，将 `a` 中的位右移 2 位，并用 0 填充右侧 2 位。\n\n![black_star_logo](img/image01215.jpeg)\n\
  ![black_star_logo](img/image01215.jpeg)\n![black_star_logo](img/image01215.jpeg)\n\
  \n### 运算符的优先级：\n\n| 级别 | 运算符 | 描述 | 结合性 |\n| :--- | :--- | :--- | :--- |\n| 1 |\
  \ `()[]` | 函数调用、下标、直接成员 | 从左到右 |\n| 2 | `++--~!!` | 递增、递减、位取反、逻辑取反 | 从右到左 |\n| 3\
  \ | `*/%` | 乘、除、取模 | 从左到右 |\n| 4 | `+-` | 加、减 | 从左到右 |\n| 5 | `>>><<` | 位右移、位左移、有符号右移、零填充右移\
  \ | 从左到右 |\n| 6 | `>>=<<=instanceof` | 大于、小于、大于等于、小于等于 | 从左到右 |\n| 7 | `!=` | 等于、不等于\
  \ | 从左到右 |\n| 8 | `&` | 位与 | 从左到右 |\n| 9 | `^` | 位异异 | 从左到右 |\n| 10 | `\\|` | 位或\
  \ | 从左到右 |\n| 11 | `&&` | 逻辑与 | 从左到右 |\n| 12 | `||` | 逻辑或 | 从左到右 |\n| 13 | `?:`\
  \ | 条件（三元运算符） | 从左到右 |\n| 14 | `-*&=^>>>==` | 加赋值、减赋值、乘赋值、除赋值、位与赋值、位异异赋值、位移赋值 |\
  \ 赋值 |\n\n| 符号 | 名称 | 用途 |\n| :--- | :--- | :--- |\n| `()` | 圆括号 | 参数定义和调用 |\n|\
  \ `{}` | 大括号 | 初始化数组、定义作用域 |\n| `[]` | 中括号 | 声明数组 |\n| `;` | 分号 | 终止语句 |\n| `,`\
  \ | 逗号 | 分隔标识符 |\n| `.` | 点 | 分隔包名与类 |\n\n![black_star_logo](img/image01215.jpeg)\n\
  \n## 数据类型\n\nJava 数据类型大致可分为两类：\n\n1. 基本数据类型 / 简单数据类型\n\nJava 是一种面向对象的语言，但基本数据类型不是对象，出于性能考虑保留了它们。它们是\
  \ Java 中定义的所有类型的基础。Java 是一种强类型语言。\n\n### 数值类型\n\n#### 整数类型\n- `byte` (1 字节)：范围 -128\
  \ 到 127\n- `short` (2 字节)：范围 -32768 到 32767\n- `int` (4 字节)：范围 -2147483648 到 2147483647\n\
  - `long` (8 字节)：范围 -9223372036854775808 到 9223372036854775807\n\n包含 `byte`、`short`、`int`\
  \ 的表达式会自动转换为 `int`。\n\n#### 浮点数类型\n- `float` (4 字节)：范围 1.401298464324817E-45f 到\
  \ 3.4028234663852886E38f\n- `double` (8 字节)：范围 4.9E-324d 到 1.7976931348623157E308d\n\
  \n#### 布尔类型\n- `boolean`\n\n#### 字符类型\n- `char` (2 字节)：范围 0 到 65535\n\n注意- Unicode\
  \ 集合的前 128 个字符与 7 位 ASCII 字符集相同，Unicode 的前 256 个字符对应 256 扩展 ASCII（8 位 ISO Latin-1）字符集。\n\
  \nJava 字符也可以用于整数表达式。当字符作为整数表达式的一部分时，使用其 Unicode 值。\n\n2. 非基本数据类型 / 派生数据类型或引用\n\n\
  \n\n\n\n## 数据类型\n\n引用数据类型也称为派生数据类型，因为它们源自原始数据类型。\n\n## 类 (Classes)\n1. 内置/库类\n2.\
  \ 用户定义类\n\n## 接口 (Interfaces)\n3. 内置/库类\n4. 用户定义类\n\n## 数组 (Arrays)\n数组在 Java 中也被视为对象。\n\
  \n## Java 的自动转换\n当满足以下条件时发生：\n1. 两个类型兼容。\n2. 目标类型大于源类型。\n\n## 变量 (Variables)\n变量是用于存储值的内存位置名称。在向其中存储值之前，必须声明变量。或者变量是主内存内部的内存位置，我们可以在其中存储数据或值。\n\
  \n有三种变量：\n\n### 局部变量 (Local Variables)\n局部变量用于块或方法内部。局部变量（也称为自动变量）默认不初始化。局部变量在使用之前之前必须显式初始化，否则会出现编译时错误“变量可能未被初始化”。\n\
  \n#### 示例\n```java\nint a,b=5;\n\nif(b>2)\n{\n    a = b;\n}\n\nSystem.out.print(a);\n\
  ```\n在上述程序中，如果 `if` 条件为假，则 `a` 的值未定义，因此编译器将给出错误“变量 a 可能未被初始化”。\n\n在 Java 中，我们不能在内部块中定义与外部块同名的变量。\n\
  ```java\nint a=5;\n{\n    int a=7; // Error\n}\n```\n\n### 实例变量 (Instance Variables)\n\
  实例变量用于定义对象的属性或状态。\n\n### 类变量 (Class Variables)\n类变量用于定义该类所有对象通用的属性/状态。\n\n## Math\
