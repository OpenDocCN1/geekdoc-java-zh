  \    }\n}\n\nclass B implements Runnable\n{\n    A obj;\n    String msg;\n    Thread\
  \ t;\n    B(A obj1, String m) {\n        msg = m;\n        obj = obj1;\n       \
  \ t = new Thread(this);\n        t.start();\n    }\n    public void run() {\n  \
  \      obj.display(msg);\n    }\n}\n\nclass Synch5\n{\n    public static void main(String\
  \ args[]) {\n    }\n}\n```\n\n\n\n\n```java\nA a1 = new A();\nA a2 = new A();\n\
  A a3 = new A();\nB b1 = new B(a1,\"Hello\");\nB b2 = new B(a2,\"World\");\nB b3\
  \ = new B(a3,\"Matrix\");\n```\n\nOutput:-\n```\n[Hello]\n[World]\n[Matrix]\n```\n\
  \n## 线程间通信\n\n如前所述，多线程通过将我们的任务划分为离散且逻辑的单元来取代事件循环编程。`Threads` 同时也证明了一个次要优点：它们消除了轮询。轮询通常通过一个循环实现，该循环用于反复检查某些条件。一旦条件为真，就会采取相应的行动。\n\
  \n这会浪费 CPU 周期。例如，考虑经典的队列问题，其中一个线程产生数据，另一个线程消费这些数据。为了让这个问题更具交互性，假设生产者必须等待消费者完成任务后才能生成更多数据。在轮询系统中，消费者在等待生产者生产时会浪费许多\
  \ CPU 周期。一旦生产者完成工作，它又会开始轮询，在等待消费者完成任务时浪费更多 CPU 周期，以此类推。\n\n为了避免轮询，Java 通过 `wait()`、`notify()`\
  \ 和 `notifyAll()` 方法包含了一种优雅（智能）的进程间通信机制。这些方法被实现为 `Object` 类中的 `final` 方法，因此所有类都拥有这些方法。这三个方法都只能在\
  \ `synchronized`（同步）上下文中调用。使用这些方法有特定的规则。\n\n- `wait()` 告诉调用线程释放监视器并进入睡眠，直到另一个线程进入同一个监视器并调用\
  \ `notify()`。\n- `notify()` 唤醒在同一个对象上调用过 `wait` 的线程（通常是第一个线程）。\n- `notifyAll()`\
  \ 唤醒所有在同一个对象上调用过 `wait()` 的线程。通常优先级最高的线程会首先运行。这些这些方法在 `Object` 类中声明，如下所示：\n\n```java\n\
  final void wait() throws InterruptedException\nfinal void notify()\nfinal void notifyAll()\n\
  ```\n\n### 示例 12.13\n\n以下示例程序错误地实现了一个简单的生产者/消费者问题形式。它包含四个类：`Q`，我们正尝试同步的队列；`Producer`，产生队列条目的线程对象；`Consumer`，消费队列条目的线程对象；以及\
  \ `PC`，创建实例 `Q`、`Producer` 和 `Consumer` 的微类。\n\n```java\nclass Q {\n    int n;\n\
  \    synchronized int get() {\n        System.out.println(\"Got:\"+n);\n       \
  \ return n;\n    }\n    synchronized void put(int n) {\n        this.n=n;\n    \
  \    System.out.println(\"Put:\"+n);\n    }\n}\nclass Producer implements Runnable\
  \ {\n    Q q1;\n    Producer(Q q2) {\n        q1=q2;\n        new Thread(\"Producer\"\
  ).start();\n    }\n    public void run() {\n        int i=0;\n        while(true)\
  \ {\n            q1.put(++i);\n        }\n    }\n}\nclass Consumer implements Runnable\
  \ {\n    Q q1;\n    Consumer(Q q2) {\n        q1=q2;\n        new Thread(this,\"\
  Consumer\").start();\n    }\n    public void run() {\n        while (true) {\n \
  \           q1.get();\n        }\n    }\n}\nclass PC {\n    public static void main(String\
  \ args[]) {\n        Q q1=new Q();\n        new Producer(q1);\n        new Consumer(q1);\n\
  \        System.out.println(\"Press Control-C to stop\");\n    }\n}\n```\n\n尽管 `Q`\
  \ 类上的 `put()` 和 `get()` 方法同步同步，但没有什么能阻止生产者超过消费者，也没有什么能阻止消费者两次消费同一个队列值。因此，我们可能会得到所示的错误输出：\n\
  \n```\nOutput: Press Control-C to stop\nPut :1\nPut :2\nPut:3\nPut:4\nPut:5\nPut:6\n\
  Put:7\nGot:7\nGot:7\nGot:7\nGot:7\nGot:7\nGot:7\nGot:7\nGot:7\nPut:8\nPut:9\nPut:10\n\
  Put:11\nPut:12\nPut:13\nPut:14\nPut:15\nGot:15\nGot:15\nGot:15\nGot:5\nGot:5\nGot:5\n\
  ```\n\n在 Java 中编写此程序的正确方法是使用 `wait()` 和 `notify()` 在两个方向上信号，如下所示：\n\n```java\nclass\
  \ Q {\n    int n;\n    boolean valueSet=false;\n    synchronized int get () {\n\
  \        if(!valueSet) {\n            try {\n                wait();\n         \
  \   } catch (InterruptedException e) {\n                System.out.println(e);\n\
  \            }\n        }\n        System.out.println(\"Got :\" + n);\n        valueSet\
  \ = false;\n        notify();\n        return n;\n    }\n    synchronized void put\
  \ (int n) {\n        if(valueSet) {\n            try {\n                wait();\n\
  \            }\n        }\n    }\n}\n```\n\n\n\n\n\n```java\n        }\n\n     \
  \   this.n=n;\n\n        valueSet =true;\n        System.out.println(\"Put :\" +\
  \ n);\n        notify ();\n    }\n}\n\nclass Producer implements Runnable {\n\n\
  \    Q q1;\n\n    Producer (Q q2) {\n        q1 = q2;\n        new Thread(this,\
  \ \"Producer\").start ();\n    }\n\n    public void run ( ) {\n        int i = 0;\n\
  \        while (true) {\n            q1.put (++i);\n        }\n    }\n}\n\nclass\
  \ Consumer implements Runnable {\n    Q q1;\n\n    Consumer (Q q2) {\n        q1\
  \ =q2;\n        new Thread (this, \"consumer\").start ( );\n    }\n\n    public\
  \ void run ( ) {\n        while (true) {\n            q1.get ( );\n        }\n \
  \   }\n}\n\nclass PC2 {\n    public static void main (String args []) {\n      \
  \  System.out.println(\"Press Control-C to stop\");\n        Q q1 = new Q( );\n\
  \        new Producer(q1);\n        new Consumer(q1);\n    }\n}\n```\n\n**输出:**\n\
  ```\nPress Control-C to stop\nPut:1\nGot:1\nPut:2\nGot:2\nPut:3\nGot:3\nPut:4\n\
  Got:4\nPut:5\nGot:5\n```\n\n## 死锁\n\n在多任务处理中，我们需要避免的一种特殊类型错误是死锁。当两个线程对一对同步对象产生循环依赖时，就会发生死锁。例如，假设一个线程进入对象\
  \ `X` 的监控器，而另一个线程进入对象 `Y` 的监控器。如果 `X` 中的线程尝试调用 `Y` 上的任何同步方法，它将如预期般被阻塞。然而，如果 `Y`\
  \ 中的线程反过来尝试调用 `X` 上的任何同步方法，线程将永远等待，因为为了访问 `X`，它必须释放对 `Y` 的锁，以便第一个线程能够完成。死锁是一种很难调试的错误，因为：\n\
  \n(i) 通常情况下，当两个线程的切片方式正确时，这种情况很少发生。\n(ii) 它可能涉及两个以上的线程和对象。\n\n**示例 1:**\n```java\n\
  class A {\n    synchronized void foo(B b1) {\n        System.out.println(\"Method\
  \ called then blocked\");\n        try {\n            Thread.sleep(1000);\n    \
  \    } catch(InterruptedException e) {\n            System.out.println(e.getMessage());\n\
  \        }\n        System.out.println(\"Trying to call b1.last()\");\n        b1.last();\n\
  \    }\n\n    synchronized void last() {\n        System.out.println(\"This not\
  \ be printed\");\n    }\n}\n\nclass B {\n    synchronized void bar(A a1) {\n   \
  \     System.out.println(\"Method called then blocked\");\n        try {\n     \
  \       Thread.sleep(1000);\n        } catch(InterruptedException e) {\n       \
  \     System.out.println(e.getMessage());\n        }\n        System.out.println(\"\
  Trying to call a1.last()\");\n        a1.last();\n    }\n\n    synchronized void\
  \ last() {\n        System.out.println(\"This not be printed\");\n    }\n}\n\nclass\
  \ DeadLock implements Runnable {\n    A a1= new A();\n    B b1 = new B();\n\n  \
  \  DeadLock() {\n        Thread t = new Thread(this);\n        t.start();\n    \
  \    a1.foo(b1);\n    }\n\n    public void run() {\n        b1.bar(a1);\n    }\n\
  \n    public static void main(String args[]) {\n        new DeadLock();\n    }\n\
  }\n```\n**输出:**\n```\nMethod called then blocked\nMethod called then blocked\n```\n\
  \n### 在 Java 中挂起、恢复和停止线程\n\n`suspend()` 和 `resume()` 是 类定义的方法，用于暂停和重启线程的执行。它们的用法所示：\n\
  \n**示例 2:**\n```java\nclass A implements Runnable {\n    String name;\n    Thread\
  \ t;\n\n    A(String threadname) {\n        name = threadname;\n        t = new\
  \ Thread(this, name);\n        System.out.println(\"Child Thread: \" + t);\n   \
  \     t.start();\n    }\n\n    public void run() {\n        for(int i=1; i<=30;i++)\
  \ {\n            System.out.println(name + \": \" + i);\n            try {\n   \
  \             Thread.sleep(100);\n            }\n        }\n    }\n}\n```\n\n\n\n\
  \n\n# Java 线程挂与恢复示例\n\n此示例展示了如何在 Java 中通过 `suspend()` 和 `resume()` 方法控制线程的执行。\n\n\
  ## 代码实现\n\n```java\nclass A implements Runnable {\n    String name;\n    Thread\
  \ t;\n    boolean suspendFlag;\n\n    A(String threadname) {\n        name = threadname;\n\
  \        t = new Thread(this, name);\n        System.out.println(\"Child Thread:\
  \ \" + t);\n        suspendFlag = false;\n        t.start();\n    }\n\n    void\
  \ myspend() {\n        suspendFlag = true;\n    }\n\n    synchronized void myresume()\
  \ {\n        suspendFlag = false;\n        notify();\n    }\n\n    public void run()\
  \ {\n        for (int i = 1; i <= 15; i++) {\n            System.out.println(name\
  \ + \": \" + i);\n            try {\n                Thread.sleep(200);\n      \
  \      } catch (InterruptedException e) {\n                System.out.println(e);\n\
  \            }\n            synchronized (this) {\n                if (suspendFlag)\
  \ {\n                    wait();\n                }\n            }\n        }\n\
  \        System.out.println(name + \"exiting\");\n    }\n}\n\nclass SuspendResume\
  \ {\n    public static void main(String args[]) {\n        A ob1 = new A(\"One\"\
  );\n        A ob2 = new A(\"Two\");\n        try {\n            Thread.sleep(100);\n\
  \            ob1.t.suspend();\n            System.out.println(\"Suspending Thread\
  \ one\");\n            Thread.sleep(100);\n            ob1.t.resume();\n       \
  \     System.out.println(\"Resuming Thread one\");\n            ob2.t.suspend();\n\
  \            System.out.println(\"Suspending Thread two\");\n            Thread.sleep(1000);\n\
  \            ob2.t.resume();\n            System.out.println(\"Resuming Thread two\"\
  );\n        } catch (InterruptedException e) {\n            System.out.println(e);\n\
  \        }\n        try {\n            System.out.println(\"Waiting for threads\
  \ to finish\");\n            ob1.t.join();\n            ob2.t.join();\n        }\
  \ catch (InterruptedException e) {\n            System.out.println(e);\n       \
  \ }\n    }\n}\n```\n\n## 预期输出\n\n```text\nChild Thread: Thread[Thread-0]\nChild\
  \ Thread: Thread[Thread-1]\nOne: 1\nTwo: 1\nOne: 2\nTwo: 2\nOne: 3\nTwo: 3\nOne:\
  \ 4\nTwo: 4\nOne: 5\nTwo: 5\nOne: 6\nTwo: 6\nSuspending Thread one\nOne: 7\nTwo:\
  \ 7\nOne: 8\nTwo: 8\nOne: 9\nTwo: 9\nOne: 10\nTwo: 10\nResuming Thread one\nOne:\
  \ 11\nTwo: 11\nSuspending Thread two\nOne: 12\nTwo: 12\nOne: 13\nTwo: 13\nOne: 14\n\
  Two: 14\nOne: 15\nTwo: 15\nResuming Thread two\nOne: exiting\nTwo: exiting\nWaiting\
  \ for threads to finish\n```\n\n## 注意事项\n\n- `thread` 类也定义了一个名为 `stop()` 方法来停止线程。其签名如下：`final\
  \ void stop()`。\n- 一旦线程被停止，无法使用 `resume()` 方法重启。\n- `suspend()`、`resume()` 和 `stop()`\
  \ 在 Java 中已不再推荐使用。\n\n\n\n\n\n```java\ncatch(InterruptedException e) {\n    System.out.println(e);\n\
  }\nSystem.out.println(\"main exiting\");\n}\n```\n\nOutput:\n```\nChild Thread:\
  \ Thread[One,5,main]\nChild Thread: Thread[Two,5,main]\nOne: 1\nTwo: 1\nOne: 2\n\
  Two: 2\nOne: 3\nTwo: 3\nOne: 4\nTwo: 4\nOne: 5\nTwo: 5\nSuspending Thread one\n\
  Two: 6\nTwo: 7\nTwo: 8\nTwo: 9\nTwo: 10\nResuming Thread one\nOne: 6\nSuspending\
  \ Thread two\nOne: 7\nOne: 8\nOne: 9\nOne: 10\nResuming Thread two\nTwo: 11\nWaiting\
  \ for threads to finish\nOne: 11\nTwo: 12\nOne: 12\nTwo: 13\nOne: 13\nTwo: 14\n\
  One: 14\nTwo: 15\nOne: 15\nTwoexiting\nOneexiting\nmain exiting\n```\n\n![STAR-LOGO-2013](img/image01213.jpeg)\n\
  \n# 章节：∞ 13 ∞\n\n## (修饰符 / 可见性模式)\n\n### 引言\n修饰符是 Java 关键字，用于向编译器提供有关代码、数据、类或接口性质的信息。例如，我们一直在使用可见性修饰符\
  \ `public`、`private`、`protected`、`package public` 等来指定类成员的可见性。除了可见性，我们还使用了修饰符 `static`、`final`\
  \ 和 `abstract`。\n\n为了便于理解，可以将修饰符分为：\n\n1. 顶级访问权限修饰符。\n2. 类的访问权限/可见性修饰符。\n3. 接口的访问权限/可见性修饰符。\n\
  4. 顶级类的其他修饰符。\n5. 顶级接口的其他修饰符。\n6. 接口成员的其他修饰符。\n7. 类成员的其他修饰符。\n\n### 1. 顶级类和接口的访问权限修饰符：\n\
  * `public`\n* `default`（包级）访问权限\n\n### 2. 类的成员访问权限/可见性修饰符：\n通过指定成员访问权限修饰符，类可以控制客户端（即其他类）可以访问的信息。这些修饰符帮助类定义契约，使用户确切知道该类提供了哪些服务。\n\
  \n成员的访问权限/可见性可以是以下之一：\n* `public`\n* `protected`\n* `default`（也称为包访问权限）\n* `private`\n\
  \n注意：成员访问权限修饰符只有在类（或其某个子类）对客户端可见时才有意义。另请注意，一个成员可以指定一个访问权限修饰符。\n\n该讨论适用于类的实例成员和静态成员。\n\
  \n### 3. 接口的成员访问权限/可见性修饰符：\n可以与接口数据成员和方法使用的唯一访问权限/可见性修饰符是 `public`。\n\n`public`\
  \ 也是接口成员的隐式访问权限/可见性修饰符，即成员始终隐式地认为是 `public`，即使我们不使用 `public` 修饰符。\n\n### 4. 顶级类的其他修饰符：\n\
  除了可见性修饰符，我们还可以在顶级类之前使用以下修饰符：\n\n**(a) `abstract`**\n可以使用 `abstract` 关键字指定类，表示它不能被实例化。包含\
  \ `abstract` 方法的类必须如此。\n\n**(b) `final`**\n可以使用 `final` 关键字指定类，表示它不能被扩展。\n\n###\
  \ 5. 顶级接口的其他修饰符：\n**(a) `abstract`**\n这是除可见性修饰符外唯一可用于接口的修饰符。接口指定方法原型而不包含任何实现：它们从本质上说是隐式抽象的。\n\
  \n### 6. 接口成员的其他修饰符：\n**数据成员：**\n除了可见性修饰符 `public` 外，我们还可以使用修饰符 `static` 和 `final`。虽然可以使用这些修饰符，但它是多余的，因为数据成员隐式为\
  \ public 和 final。\n\n**方法：**\n除了可见性修饰符 `public` 外，我们还可以使用 `abstract`。虽然可以使用 abstract，但它是多余的，因为所有方法都是隐式的\
  \ public 和 abstract。\n\n### 7. 类成员的其他修饰符：\n可以通过以下关键字在声明中指定字段和/或方法的特定特性：\n1. `static`\n\
  2. `final`\n3. `abstract`\n4. `synchronized`\n5. `native`\n6. `transient`\n7. `volatile`\n\
  \n#### A. `static` 修饰符：\n静态成员属于它们声明的类，而不是类的任何实例的一部分。根据类中静态成员的访问权限修饰符，客户端可以通过类名或通过类的对象引用来访问这些成员。\n\
  \n静态变量（也称为类变量）：\n这些变量只存在于它们定义的类中。当类加载时，如果没有指定显式的初始化表达式，静态变量将初始化为默认值。静态成员变量通常用于跟踪有关实例的全局信息。\n\
  \n静态方法：\n这些也被称为类方法。类中的静态方法可以直接访问该类中的其他静态成员。它不能访问类的实例（即非静态）成员，因为静态方法没有与与之关联的对象的概念。\n\
  \n然而，请注意，类中的静态方法始终可以使用类类型的引用来访问其成员，无论这些成员是否是静态的。典型的静态方法可能会代表整个类和/或类的对象执行某些任务。\n\n\
  \n\n\n\n* 它们只能调用其他静态方法。\n* 它们只能访问静态数据成员。\n* 它们无法以任何方式引用 `this` 或 `super`。\n\n###\
  \ 静态初始化块\n\n一个 Java 类可以有一个或多个静态初始化块。静态初始化块的语法如下：\n\n```java\nstatic {\n    code\n\
  }\n```\n\n静态初始化块可以被视为静态方法，它在类加载时就会被隐式/自动地调用。\n\n静态块在以下情况下非常有用：\n* 静态变量的动态初始化。\n\
  * 在类加载时执行一次性活动。例如，加载 JDBC 驱动类。\n* 在 `Hashtable`、`HashMap`、`Properties` 等中加载小型数据库/配置文件。\n\
  \n### B. final 修饰符\n\n`final` 修饰符可以用于：\n* 局部变量\n* 实例变量/数据成员\n* 静态变量/数据成员\n* 实例方法\n\
  \n### final 变量\n\n`final` 变量通常在声明时初始化，赋值后后值不能被修改。以下是与 `final` 变量的一些重要点：\n\n* `final`\
  \ 变量是一个常量，尽管被称为变量。一旦初始化，它的值就不能改变。这适用于实例、静态和局部变量，包括声明为 `final` 的参数。\n* `final` 是唯一适用于局部变量或形式参数的修饰符。\n\
  * 原始数据类型的 `final` 变量一旦初始化，其值就不能改变。\n* 引用类型的 `final` 变量一旦初始化，其引用值就不能改变，但它所指代的对象的状态仍然可以改变。\n\
  * 通常情况下，`final` 变量在声明时初始化，但并非必须。这种 `final` 变量也称为空白 final 变量（blank final variable），它们必须在使用之前被初始化一次。\n\
  * `final static` 变量通常用于定义命名常量，例如 `Integer.MAX_VALUE`，它是 int 的最大值。\n\n### 局部 final\
  \ 变量\n\n#### 示例 13.1\n以下示例说明了如上所述，局部 final 变量可以留空，但在首次使用之前必须初始化。变量 `x` 是在显示器上显示其值之前才进行初始化的。\n\
  \n```java\nclass FinalTest1 // 使用空白 final\n{\n    public static void main(String\
  \ args[])\n    {\n        final int x; // 声明时不必须初始化\n        x = 50;\n        System.out.println(x);\n\
  \    }\n}\n```\nOutput: 50\n\n#### 示例 13.2\n以下代码将由于 final 变量被初始化了两次而无法编译。\n\n```java\n\
  class FinalTest2 // 使用空白 final\n{\n    public static void main(String args[ ])\n\
  \    {\n        final int x;\n        x=0;\n        System.out.println(x);\n   \
  \     x = 60;\n    }\n}\n```\n\n### 实例 final 变量\n\n实例 final 可以留空，但在获取该类对象的引用之前必须初始化。因此，如果不在声明时进行初始化，那么可以对\
  \ final 变量初始化的其他地方是：\n* 构造函数\n* 初始化块\n\n#### 示例 13.3\n以下程序将无法编译，因为 final 变量已经初始化了。默认初始化的概念不适用于\
  \ final 变量，因为它们在初始化后不能被修改。\n\n```java\nclass FinalTest3 // 使用空白 final\n{\n    final\
  \ int x; // final 实例变量没有初始化\n}\nclass MyClass\n{\n    public static void main(String\
  \ args[])\n    {\n        FinalTest3 f=new FinalTest3();\n        System.out.println(f.x);\n\
  \    }\n}\n```\nOutput: (编译时错误): x 可能未被初始化\n\n#### 示例 13.4\n以下程序也将无法编译，因为 final\
  \ 在获取引用后才初始化。\n\n```java\nclass FinalTest4\n{\n    final int x;\n}\nclass MyClass\n\
  {\n    public static void main(String args[])\n    {\n        FinalTest4 f=new FinalTest4();\n\
  \        f.x = 10;\n        System.out.println(f.x);\n    }\n}\n```\n\n#### 示例 13.5\n\
  以下示例说明了空白实例变量可以在构造函数中初始化。\n\n```java\nclass FinalTest5\n{\n    final int x;\n  \
  \  public static void main(String args[])\n    {\n        FinalTest5 f=new FinalTest5();\n\
  \        System.out.println(f.x);\n    }\n    FinalTest5()\n    {\n        x=10;\n\
  \    }\n}\n```\nOutput: 10\n\n#### 示例 13.6\n以下程序说明了空白 final 变量可以使用动态值初始化，并可以使用 `this`\
  \ 关键字引用。因此，同一类的不同对象可以有不同的 final 变量值。\n\n```java\nclass FinalTest6\n{\n    final\
  \ int x;\n    FinalTest6(int x1)\n    {\n        x = x1;\n    }\n    public static\
  \ void main(String args[])\n    {\n        FinalTest6 f1=new FinalTest6(10);\n \
  \       FinalTest6 f2=new FinalTest6(20);\n        System.out.println(f1.x);\n \
  \       System.out.println(f2.x);\n    }\n}\n```\nOutput:\n10\n20\n\n\n\n\n初始化块可以被视为构造函数，它在对象创建时就会被隐式地/自动调用。事实上，如果一个类包含初始化块，它们将按照定义的顺序从上到下，在任何构造函数之前执行。\n\
  \n### 示例 13.7:\n\n```java\nclass FinalTest7 {\n    final int x;\n    public static\
  \ void main(String args[]) {\n        FinalTest7 f=new FinalTest7();\n        System.out.println(f.x);\n\
  \    }\n    {\n        x=20;\n    }\n}\n```\n\n初始化块在以下情况下非常有用：\n* 实例变量的动态初始化。\n\
  * 定义所有构造函数通用的代码。这会增加代码的可用性并减少维护工作。\n\n### static final 变量：\n\n`static final` 变量可以留空，但必须在类对程序可用之前完成初始化。因此，如果我们不在声明时进行初始化，那么\
  \ `static final` 变量唯一可以初始化的地方就是：\n* `static` 初始化块\n\n### 示例 13.8\n\n以下示例说明了空白的 `static\
  \ final` 变量可以在 `static` 块中初始化。\n\n```java\nclass FinalTest8 {\n    static final\
  \ int x;\n    public static void main(String args[]) {\n        System.out.println(FinalTest8.x);\n\
  \    }\n    static {\n        x=20;\n    }\n}\n```\n输出：`20`\n\n### final 方法：\n\n\
  * 类中的 `final` 方法是完整的（即具有实现），并且不能在任何子类中被重写。因此，子类在更改方法行为方面受到了了限制。\n* 编译器能够对 `final`\
  \ 方法执行某些优化，因为可以对此类成员做出某些假设。当调用非静态方法时，运行时系统会确定对象的实际类，将方法调用绑定到该类型的正确实现上，然后调用它。\n*\
  \ 对于 `final` 方法，我们确定子类不能重写该方法，因此绑定像 `private` 和 `static` 方法一样，是在编译时完成的，这极地提升了性能。\n\
  * 对于 `final` 方法，编译器可以将调用替换为方法的实际体，类似于宏。这种机制被称为“内联”（inlining）。在 C++ 中，我们可以选择将函数声明为\
  \ `inline`（尽管决定由编译器做出），但在 Java 中，由编译器做决定。\n\n### abstract 修饰符：\n\n`abstract` 修饰符只能用于实例方法。`abstract`\
  \ 方法没有实现，也就是说，为 `abstract` 方法没有定义方法体，在类定义中仅提供方法原型。它的类也必须是 `abstract`（即不完整的），并且必须显式声明为\
  \ `abstract`。`abstract` 类的子类必须提供方法的实现；否则，它们也是 `abstract` 的。\n\n以下是与抽象方法的一些重要点：\n\
  * `abstract` 方法不能声明为 `private`。这是显而易见的，因为我们无法无法重写 `private` 方法，而在 `abstract` 方法的情况下，方法体总会在子类中提供。\n\
  * 只有实例方法可以声明为 `abstract`，因为 `static` 方法不能被重写；声明一个 `abstract static` 方法将毫无意义，并会导致编译错误。\n\
  * `final` 方法不能是 `abstract` 的，反之亦然。\n* 关键字 `abstract` 不能与方法的任何非访问权限的修饰符组合。\n* 在接口中指定的方法隐式为\
  \ `abstract`，因为接口中只定义了方法原型。\n\n### synchronized 修饰符：\n\n`synchronized` 关键字可以用于方法和代码块。程序中可以多个线程同时执行。它们可能会尝试同时在同一个对象上执行多个方法。如果希望一次只有一个线程可以执行对象中的某个方法，可以将这些方法声明为\
  \ `synchronized`。它们的执行在所有线程之间是互斥的。\n\n在任何给定时刻，最多有一个线程可以执行对象上的某个 `synchronized` 方法。此讨论也适用于类的\
  \ `static synchronized` 方法。\n\n注意：`synchronized` 修饰符不适用于类或成员变量。\n\n### native 修饰符：\n\
  \n`native` 修饰符只能引用方法。像 `abstract` 关键字一样，`native` 表示方法的体将在其他地方找到。`native` 方法体完全位于\
  \ JVM 之外，位于库中。`native` 代码用非 Java 语言（通常是 C 或 C++）编写，并针对单一目标机器类型编译。因此，违反了 Java 的平台独立性。将\
  \ Java 移植到新平台的人会实现大量的 `native` 代码来支持 GUI 组件、网络通信以及广泛其他特定平台的功能。然而，应用程序和 applet 程序员很少需要编写\
  \ `native` 代码。\n\n### transient 修饰符：\n\n对象可以使用序列化进行存储。序列化将对象转换为有利于存储对象的输出格式。稍后可以以序列化时相同的状态检索对象，这意味着包含在序列化中的所有字段将具有与序列化时相同的值。此类对象被称为持久化对象。\n\
  \n在类声明中，可以将某个字段指定为 `transient`，表示当类的对象被写入持久化存储时，其值不应被保存。\n\n```java\nclass Experiment\
  \ implements Serializable {\n    transient int currentTemperature; // transient\n\
  \    double mass; // 持久化值\n}\n```\n对 `static` 变量指定 `transient` 修饰符是多余的，因此不建议这样做。`static`\
  \ 变量不是序列化对象持久化状态的一部分。\n\n### volatile 修饰符：\n\n在执行期间，编译代码可能会为了效率缓存字段的值。由于多个线程可以访问同一个字段，确保缓存不会在读取和写入值时导致不一致是非常关重要的。可以使用\
  \ `volatile` 修饰符来告知编译器不要尝试对该字段进行优化。\n\n\n\n\n\n# 包装类 (Wrapper Classes)\n\nJava 为每个基本数据类型都有对应的包装类，如下表所示：\n\
  \n| 基本数据类型 | 包装类 |\n| :--- | :--- |\n| boolean | Boolean |\n| char | Character |\n\
  | byte | Byte |\n| short | Short |\n| int | Integer |\n| long | Long |\n| float\
  \ | Float |\n| double | Double |\n\n## Number 类\n\n抽象类 `Number` 定义了一个父类，封装数值类型 `byte`、`short`、`int`、`long`、`float`\
  \ 和 `double` 的类都实现了该类。`Number` 类具有抽象方法，用于返回不同数值格式的对象值。这些方法是：\n\n| 方法 | 说明 |\n| :---\
  \ | :--- |\n| `byte byteValue()` | 将指定的数字作为 `byte` 类型返回 |\n| `short shortValue()`\
  \ | 将指定的数字作为 `short` 类型返回 |\n| `abstract int intValue()` | 将指定的数字作为 `int` 类型返回 |\n\
  | `abstract long longValue()` | 将指定的数字作为 `long` 类型返回 |\n| `abstract float floatValue()`\
  \ | 将指定的数字作为 `float` 类型返回 |\n| `abstract double doubleValue()` | 将指定的数字作为 `double`\
  \ 类型返回 |\n\n**注意**：`byteValue()`、`shortValue()`、`intValue()`、`longValue()`、`floatValue()`\
  \ 和 `doubleValue()` 方法返回值可能涉及舍入或截断。\n\n### 示例 14.1\n\n下面的示例演示了调用 `Number` 类的方法时是如何发生舍入和截断的。\n\
  \n```java\nclass Wrapper {\n    public static void main(String args[] ) {\n    \
  \    Integer iObj = new Integer(128);\n        System.out.println(iObj.byteValue());\
  \ // truncation\n        Long lObj = new Long(123456789123456789L);\n        System.out.println(lObj);\n\
  \        System.out.println(lObj.doubleValue());\n        Float fObj = new Float(3.99f);\n\
  \        System.out.println(fObj.intValue()); // truncation\n    }\n}\n```\n\n**输出：**\n\
  ```\n-128\n123456789123456789\n1.23456789123456784E17\n3\n```\n\n## 使用包装类的构造函数将基本数字转换为对象，并将数值对象转换回基本数字\n\
  \n### 示例 14.2\n\n下面的示例演示了如何将基本类型封装成对象，以及如何将它们转换回基本类型。\n\n```java\nclass Convert\
  \ {\n    public static void main(String args[]) {\n        System.out.println(\"\
  primitive numbers to objects using constructors\");\n        byte b = 15;\n    \
  \    Byte bObj = new Byte(b);\n        System.out.println(bObj); // toString()\n\
  \        short s = 205;\n        Short sObj = new Short(s);\n        System.out.println(sObj);\n\
  \        int i=32717;\n        Integer iObj = new Integer(i);\n        System.out.println(iObj);\n\
  \        long l = 234543335565675L;\n        Long lObj = new Long(l);\n        System.out.println(lObj);\n\
  \        float f = 3.145f;\n        Float fObj = new Float(f);\n        System.out.println(fObj);\n\
  \        double d = 3.1415;\n        Double dObj = new Double(d);\n        System.out.println(dObj);\n\
  \n        System.out.println(\"numeric objects to primitive numbers\");\n      \
  \  byte b1 = bObj.byteValue();\n        short s1 = sObj.shortValue();\n        int\
  \ i1 = iObj.intValue();\n        long l1 = lObj.longValue();\n        float f1 =\
  \ fObj.floatValue();\n        double d1 = dObj.doubleValue();\n        System.out.println(b1);\n\
  \        System.out.println(s1);\n        System.out.println(i1);\n        System.out.println(l1);\n\
  \        System.out.println(f1);\n        System.out.println(d1);\n    }\n}\n```\n\
  \n**输出：**\n```\nprimitive numbers to objects using constructors\n15\n205\n32717\n\
  234543335565675\n3.145\n3.1415\nnumeric objects to primitive numbers\n15\n205\n\
  32717\n234543335565675\n3.145\n3.1415\n```\n\n## 使用包装类的 `toString()` 静态方法将基本数字转换为字符串的示例\
  \ 14.3：\n\n```java\nclass ConvertPrimitiveToString {\n    public static void main(String\
  \ args[]) {\n        System.out.println(\"primitive numbers to String using toString()\
  \ static method of wrapper class:\");\n        byte b = 105;\n        String str=Byte.toString(b);\n\
  \        System.out.println(str);\n        short s=303;\n        str = Short.toString(s);\n\
  \        System.out.println(str);\n        int i=100;\n        str = Integer.toString(i);\n\
  \        System.out.println(str);\n        long l=45444444444l;\n        str = Long.toString(l);\n\
  \        System.out.println(str);\n        float f=3.444f;\n        str=Float.toString(f);\n\
  \        System.out.println(str);\n        double d=3.44444;\n        str=Double.toString(d);\n\
  \        System.out.println(str);\n    }\n}\n```\n\n**输出：**\n```\nprimitive numbers\
  \ to String using toString() static method of wrapper class:\n105\n303\n100\n45444444444\n\
  3.444\n3.14444\n```\n\n## 使用包装类的 `toString()` 方法将对象转换为字符串\n\n```java\nclass ObjectDemo\
  \ {\n    public static void main(String args[]) {\n        System.out.println(\"\
  numeric objects to Strings using toString() method of wrapper class\");\n      \
  \  byte b = 105;\n        Byte bObj = new Byte(b);\n        String str=bObj.toString();\n\
  \        System.out.println(str);\n        short s = 203;\n        Short sObj=new\
  \ Short(s);\n        str = sObj.toString();\n        System.out.println(str);\n\
  \    }\n}\n```\n\n\n\n\n\n使用相应包装类的 `toString()` 方法将对象数字转换为字符串：\n\n```java\nSystem.out.println(str);\n\
  Integer iObj = new Integer(32000);\nstr = iObj.toString();\nSystem.out.println(str);\n\
  str = new Long(4544444444444l).toString();\nSystem.out.println(str);\nstr = new\
  \ Float(3.1444f).toString();\nSystem.out.println(str);\nstr = new Double(4.1444).toString();\n\
  System.out.println(str);\n```\n\n输出：\n```\n103\n203\n32000\n4544444444444\n3.1444\n\
  4.1444\n```\n\n使用相应包装类的静态 `valueOf()` 方法将字符串对象（数字字符串）转换为数值对象\n\n### 示例 14.5\n\n\
  1. `StringToNumericObjectDemo`\n\n```java\nclass StringToNumericObjectDemo {\n \
  \   public static void main(String args[]) {\n        String str = \"30\";\n   \
  \     String str2 = \"30.33\";\n        Byte bObj = Byte.valueOf(str);\n       \
  \ System.out.println(bObj);\n        //Byte bObj = new Byte(str2); //NumberFormatException\n\
  \        Short sObj = Short.valueOf(str);\n        System.out.println(sObj);\n \
  \       Integer iObj = Integer.valueOf(str);\n        System.out.println(iObj);\n\
  \        Long lObj = Long.valueOf(\"344324232432\");\n        System.out.println(lObj);\n\
  \        Float fObj = Float.valueOf(\"3.333\");\n        System.out.println(fObj);\n\
  \        Double dObj = Double.valueOf(str2);\n        System.out.println(dObj);\n\
  \    }\n}\n```\n\n输出：\n```\n30\n30\n344324232432\n3.33\n30.33\n```\n注：如果字符串不包含可解析的数字，所有\
  \ `valueOf()` 方法都会抛出 `NumberFormatException`。\n\n使用相应包装类的构造函数将字符串对象（数字字符串）转换为数值对象\n\
  \n### 示例 4.6\n\n```java\nclass StringToNumericDemo1 {\n    public static void main(String\
  \ args[]) {\n        String str = new String(\"30\");\n        //str = \"30\";\n\
  \        String str2 = new String(\"30.333\");\n        Byte bObj = new Byte(str);\n\
  \        System.out.println(bObj);\n        //Byte bObj=new Byte(str2); //NumberFormatException\n\
  \        Short sObj=new Short(str);\n        System.out.println(sObj);\n       \
  \ Integer iObj = new Integer(str);\n        System.out.println(iObj);\n        Long\
  \ lObj = new Long(str);\n        System.out.println(lObj);\n        Float fObj =\
  \ new Float(str);\n        System.out.println(fObj);\n        Double dObj = new\
  \ Double(str);\n        System.out.println(dObj);\n    }\n}\n```\n\n输出：\n```\n30\n\
  30\n30\n30\n30.333\n30.333\n```\n注：如果字符串不包含可解析的数字，上述构造函数将抛出 `NumberFormatException`。\n\
  \n使用相应包装类的解析方法将字符串对象（数字字符串）转换为基本类型数字\n\n### 示例 14.7：\n\n```java\nclass StringToPrimitiveDemo\
  \ {\n    public static void main(String args[]) {\n        String str = new String(\"\
  30\");\n        //str = \"30\";\n        String str2 = new String(\"30.33\");\n\
  \        byte b = Byte.parseByte(str);\n        System.out.println(b);\n       \
  \ //byte b1=Byte.parseByte(str2); //NumberFormatException\n        short s = Short.parseShort(str);\n\
  \        System.out.println(s);\n        int i = Integer.parseInt(str);\n      \
  \  System.out.println(i);\n        long l = Long.parseLong(str);\n        System.out.println(l);\n\
  \        float f = Float.parseFloat(str2);\n        System.out.println(f);\n   \
  \     double d = Double.parseDouble(str2);\n        System.out.println(d);\n   \
  \ }\n}\n```\n（注：示例 14.7 的原始文本在源代码块中存在格式不一致的问题；我已根据提供的代码逻辑对其结构进行了清理）。\n\n\n\n\n\n\
  ## Byte 类\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `static Byte decode(String nm)` | 返回一个包含字符串\
  \ `nm` 所指定值的 `Byte` 对象。接受由以下语法提供的十进制、十六进制和八进制数：`DecodableString:[-] DecimalNumerical[-]\
  \ 0x HexDigits[-] 0X HexDigits[-] # HexDigits[-] 0 OctalDigits` |\n| `boolean equals(Object\
  \ obj)` | 将 `this` 对象与指定的对象进行比较。 |\n| `int hashCode()` | 返回此 `Byte` 的哈希码。 |\n\n\
  ## Short 类中的其他方法\nShort 方法\n`Short` 类的方法与 `Byte` 类的方法相同，仅在上述表格中使用 `short` 和 `Short`\
  \ 单词代替了 `byte` 和 `Byte` 单词。\n\n## Integer 类中的其他方法\n某些方法与 `Byte` 或 `Short` 类的方法相同。其他方法描述如下所示：\n\
  \n| 方法 | 说明 |\n| :--- | :--- |\n| `static String toBinaryString(int i)` | 返回整数参数作为\
  \ 2 进制无符号整数的字符串表示。 |\n| `static String toHexString(int i)` | 返回整数参数作为 16 进制无符号整数的字符串表示。\
  \ |\n| `static String toOctalString(int i)` | 返回整数参数作为 8 进制无符号整数的字符串表示。 |\n\n##\
  \ Long 类中的其他方法\n`Long` 类的方法几乎与 `Integer` 类的方法相同。\n\n## Character 类\n`Character`\
  \ 类将原始类型 `char` 的值封装在对象中。\n\n### 构造函数\n```\nCharacter(char value)\n```\n构造一个新分配的\
  \ `Character` 对象，用于表示指定的 `char` 值。\n\n示例：`Character chObj = new Character('A');`\n\
  \n### 方法\n`Character` 类的一些方法下表所示：\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `char charValue()`\
  \ | 返回此 `Character` 对象的的值。 |\n| `static boolean isDefined(char ch)` | Determine\
  \ 指定的字符是否在 Unicode 中。 |\n| `static boolean isDigit(char ch)` | 确定指定的字符是否为数字。 |\n\
  | `static boolean isJavaIdentifierPart(char ch)` | 确定指定的字符是否可以作为 Java 标识符的一部分（第一个字符外）。\
  \ |\n| `static boolean isJavaIdentifierStart(char ch)` | 确定指定的字符是否允许作为 Java 标识符的首字符。\
  \ |\n| `static boolean isLetter(char ch)` | 确定指定的字符是否为字母。 |\n| `static boolean isLetterorDigit(char\
  \ ch)` | 确定指定的字符是否为字母或数字。 |\n| `static boolean isLowerCase(char ch)` | 确定指定的字符是否为小写字母。\
  \ |\n| `static boolean isSpaceChar(char ch)` | 确定指定的字符是否为 Unicode 空格字符。 |\n| `static\
  \ boolean isTitleCase(char ch)` | 确定指定的字符是否为标题大写字符。 |\n| `static boolean isUpperCase(char\
  \ ch)` | 确定指定的字符是否为大写字母。 |\n| `static boolean isWhitespace(char ch)` | 根据 Java 确定指定的字符是否为空白字符。\
  \ |\n| `static char toLowerCase(char ch)` | 将字符参数转换为小写。 |\n| `static char toUpperCase(char\
  \ ch)` | 将字符参数转换为大写。 |\n| `static char toTitleCase(char ch)` | 将字符参数转换为标题大写。 |\n\
  | `int compareTo(Character anotherCharacter)` | 数值上比较两个 `Character` 对象。 |\n| `int\
  \ hashcode()` | 返回此 `Character` 的哈希码。 |\n| `boolean equals(Object obj)` | 将 `this`\
  \ 对象与指定的对象进行比较。 |\n\n## Boolean 类\n`Boolean` 类将原始类型 `Boolean` 的值封装在对象中。\n\n### 构造函数\n\
  | 构造函数 | 说明 |\n| :--- | :--- |\n| `Boolean(Boolean value)` | 分配一个表示值参数的 `Boolean`\
  \ 对象。 |\n| `Boolean(String s)` | 如果字符串参数不为空且在忽略大小写的情况下等于字符串“true”，则分配一个表示值 `true`\
  \ 的 `Boolean` 对象。 |\n\n### Boolean 类的方法\n| 方法 | 说明 |\n| :--- | :--- |\n| `boolean\
  \ booleanValue()` | 将此 `Boolean` 对象的值作为 `Boolean` 原始类型返回。 |\n| `int compareTo(Boolean\
  \ b)` | 将此实例与另一个比较。 |\n| `boolean equals(Object obj)` | 当且仅当参数不为空且是一个与 `this` 表示相同布尔值的\
  \ `Boolean` 对象时，返回 true。 |\n| `static Boolean getBoolean(String name)` | 当且仅当由参数命名的系统属性存在且等于字符串“true”时，返回\
  \ true。 |\n| `int hashCode()` | 返回此 `Boolean` 对象的哈希码。 |\n| `static boolean parseBoolean(String\
  \ s)` | 将字符串参数解析为布尔值。 |\n| `String toString()` | 返回表示此 `Boolean` 值的 `String` 对象。\
  \ |\n| `static String toString(boolean b)` | 返回表示指定布尔值的 `String` 对象。 |\n| `static\
  \ Boolean valueOf(boolean b)` | 返回表示指定布尔值的 `Boolean` 实例。 |\n| `static Boolean valueOf(String\
  \ s)` | 返回一个表示指定字符串值的 `Boolean`。 |\n\n# 章节：Java 输入/输出\n\n### 引言\n### 流\nJava 程序通过流进行输入/输出。流是一个产生或消耗信息的抽象。流通过物理设备连接到系统。\n\
  \n所有流的行为都是相同的，即使它们连接的实际物理设备不同。相同的输入输出类和方法可以应用于任何类型的设备。\n\n## 输入流和输出流\nJava 流分为两种基本类型：输入流和输出流。输入流从源提取（即读取）数据并将其发送到程序。\n\
  \n程序连接并打开输入流，然后顺序读取数据。同样，程序连接并打开到数据目的地的输出流，并顺序写入数据。在这两种情况下，程序都不知道端点的细节（即源和目的地）。\n\
  \n## 字节流和字符流\nJava2 定义了两种流：字节流和字符流。字节流为处理字节输入输出提供了方便的方法。字节流通常用于读取或写入二进制数据。字符流使用\
  \ Unicode，因此可以进行国际化。此外，在某些情况下，字符流比字节流更高效。Java 的原始版本（Java 1.0）不包含字符流，因此，所有的输入/输出都是面向字节的。\n\
  \n\n\n\n我们还可以根据流读取或写入的源或目的类型对流进行跨组分类。源（或目的地）可能是内存、文件或管道。\n\n![C:\\Users\\Made Man\
  \ Harry\\Desktop\\Stars\\black_star_logo.jpg](img/image01245.jpeg)\n\n![sss](img/image01246.jpeg)\n\
  \n(Java 流类的分类)\n\n## 字节流类概述\n\n字节流类通过两个类层次结构来定义。顶端是两个抽象类：\n\n(1) `InputStream` 和\
  \ (2) `OutputStream`\n\n这些抽象类中的每一个都有多个具体的子类，用于处理各种设备之间的差异，例如磁盘文件、网络连接甚至内存缓冲区。\n\n\
  #### InputStream 类\n\n用于读取 8 字节字节的 `InputStream` 类包括一个名为 `InputStream` 的父类，以及若干支持各种输入相关函数的子类。\n\
  \n![C:\\Users\\Made Man Harry\\Desktop\\Stars\\black_star_logo.jpg](img/image01247.jpeg)\n\
  \n![abc](img/image01248.jpeg)\n\n输入流类的层次结构。\n\n![ab](img/image01249.jpeg)\n\n输入流类的层次结构。\n\
  \n#### InputStream 类\n\n父类 `InputStream` 是一个抽象类，它定义了执行输入功能的方法，例如：\n\n*   读取字节。\n\
  *   关闭流。\n*   在流中标记位置。\n*   在流中跳过。\n*   查找流中的字节数。\n\n##### InputStream 类的方法：\n\n\
  | 方法 | 说明 |\n| :--- | :--- |\n| `int available()` | 提供输入中可用字节数（必须由子类重写）。`InputStream`\
  \ 类的 `available` 方法始终返回 0。 |\n| `void close()` | 关闭此输入流并释放与流相关的任何系统资源。`InputStream`\
  \ 的 `close` 方法没有任何操作。 |\n| `void mark(int readlimit)` | 标记此输入流中的当前位置。`InputStream`\
  \ 的 `mark` 方法没有任何操作。\n| `boolean markSupported()` | 测试此输入流是否支持 mark 和 reset 方法。`InputStream`\
  \ 的 `markSupported` 方法返回 false。 |\n| `abstract int read()` | 从输入流中读取下一个字节数据。子类必须提供此方法的实现。\
  \ |\n| `int read(byte[] b)` | 从输入流中读取若干字节并将其存储在缓冲区数组 `b` 中。实际读取的字节数作为整数返回。 |\n|\
  \ `int read(byte[] b, int offset, int len)` | 从输入流中读取若干字节并从参数 `off` 指定的位置开始存储到缓冲区数组\
  \ `b` 中。实际读取的字节数作为整数返回。 |\n| `void reset()` | 将此流重新定位到上次对此输入流调用 `mark` 方法时的位置。`InputStream`\
  \ 的 `reset` 方法没有任何操作并始终抛出 `IOException`。 |\n| `long skip(long n)` | 跳过并丢弃此输入流最多\
  \ `n` 个字节的数据，并返回实际跳过的字节数。 |\n\n#### DataInput 接口\n\n`DataInput` 是一个接口，它定义了从 `InputStream`\
  \ 读取原始数据类型的方法。\n\n##### DataInput 接口的方法：\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `boolean\
  \ readBoolean()` | 读取一个输入字节，如果该字节非零则返回 true，如果为零则返回 false。 |\n| `byte readByte()`\
  \ | 读取并返回一个字节输入。 |\n| `char readChar()` | 读取一个输入字符并返回其值。 |\n| `double readDouble()`\
  \ | 读取八个输入字节并返回一个 double 值。 |\n| `float readfloat()` | 读取四个输入字节并返回一个 double 值。 |\n\
  | `void readFully(byte[] b)` | 从输入流中读取若干字节并存储在缓冲区数组 `b` 中。如果此流在读取所有字节之前到达末尾，该方法将抛出\
  \ `EOFException`。 |\n| `void readFully(byte[] b, int off, int len)` | 从输入流中读取 `len`\
  \ 个字节并从 `off` 指定的位置开始存储在缓冲区数组 `b` 中。如果此流在读取所有字节之前到达末尾，该方法将抛出 `EOFException`。 |\n\
  | `int readInt()` | 读取四个输入字节并返回一个 `int` 值。 |\n| `String readLine()` | 从输入流中读取下一行。\
  \ |\n| `long readLong()` | 读取八个输入字节并返回一个 `long` 值。 |\n| `short readShort()` | 读取两个输入字节并返回一个\
  \ `short` 值 |\n| `Strig readUTF()` | 读取使用修改后的 UTF-8 格式编码的字符串。 |\n| `int skipBytes(int\
  \ n)` | 尝试从输入流中跳过 `n` 个字节的数据，忽略跳过的字节。返回实际跳过的字节数。 |\n\n#### InputStream 类总结\n\n|\
  \ 类 |get |\n| :--- | :--- |\n| `InputStream` | 此抽象类是所有表示字节输入流类的父类。 |\n| `BufferedInputStream`\
  \ | `BufferedInputStream` 为另一个输入流增加了功能，即缓冲输入并支持 mark 和 reset 方法。 |\n| `ByteArrayInputStream`\
  \ | `ByteArrayInputStream` 包含一个内部缓冲区，其中包含可以从流中读取的字节。 |\n| `DataInputStream` | `DataInputStream`\
  \ 允许应用程序从输入流读取原始数据类型。 |\n| `FileInputStream` | `FileInputStream` 包含来自文件的输入字节。 |\n\
  | `FilterInputStream` | `FilterInputStream` 包含另一个输入流并将其作为基本数据源，可能在此过程中转换数据。 |\n\
  | `PipedInputStream` | `PipedInputStream` 应该连接到管道输出流，管道输入流随后提供管道输出流写入的数据。 |\n| `PushbackInputStream`\
  \ | `PushbackInputStream` 为另一个输入流增加了功能，即“回退”或未读回一个字节。 |\n| `SequenceInputStream`\
  \ | `SequenceInputStream` 代表类的逻辑连接。 |\n| `ObjectInputStream` | `ObjectInputStream`\
  \ 读取之前使用 ObjectOutputStream 写入的原始数据对象。 |\n\n注意 `DataInputStream` 类继承自 `FilterInputStream`\
  \ 并实现了 `DataInput` 接口。因此，`DataInputStream` 在继承 `FilterInputStream` 并在其使用 `InputStream`\
  \ 类的方法外，还实现了 `DataInput` 中描述的方法。\n\n#### OutputStream 类\n\nOutputStream 类派生自基类 `OutputStream`，它是一个抽象类并有若干支持各种输出功能的子类。\n\
  \n#### OutputStream 类\n\n父类 `OutputStream` 是一个抽象类，它定义了执行输出功能的方法，例如：\n\n*   写入字节\n\
  *   关闭流\n*   刷新流\n\n##### OutputStream 类的方法：\n\n| 方法 | 说明 |\n| :--- | :--- |\n|\
  \ `void close()` | 关闭此输出流并释放与流相关的任何流资源。 |\n| `void flush()` | 刷新此输出流并强制将缓冲的输出字节写出。\
  \ |\n| `void write(byte[] b)` | 从指定的字节数组写入 `b. length` 个字节到其输出流。 |\n| `void write(byte[]\
  \ b, int off, int len)` | 从指定的字节数组从偏移量 `off` 开始写入 `len` 个字节到其输出流。 |\n| `abstract\
  \ void write(int b)` | 将指定的字节写入其输出流。 |\n\n#### DataOutput 接口\n\n`DataOutput` 是一个接口，它定义了向\
  \ `OutputStream` 写入原始数据类型的方法。\n\n![IO_LayeredInput](img/image01252.jpeg)\n\n\n\n\
  \n\n![C:\\Users\\Made Man Harry\\Desktop\\Stars\\black_star_logo.jpg](img/image01253.jpeg)\n\
  \n## DataOutput 接口方法\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `void writeBoolean(boolean\
  \ v)` | 将一个布尔值写入其输出流。 |\n| `void writeByte(int v)` | 向输出流写入参数 `v` 的八个低位。 |\n| `void\
  \ writeBytes(string s)` | 将字符串写入输出流。按照顺序对字符串 `s` 中的每个字符向输出流写入一个字节。 |\n| `void writeChar(int\
  \ v)` | 将一个由两个字节组成的字符值写入输出流。 |\n| `void writeChars(string s)` | 将字符串 `s` 中的每个字符按每个两个字节的顺序写入输出流。\
  \ |\n| `void writeDouble(double v)` | 将一个由八个字节组成的双精度浮点数值（double）写入输出流。 |\n| `void\
  \ writeFloat(float v)` | 将一个由四个字节组成的单精度浮点数值（float）写入输出流。 |\n| `void writeInt(int\
  \ v)` | 将一个由四个字节组成的整数值（int）写入输出流。 |\n| `void writeLong(long v)` | 将一个由八个字节组成的长整数值（long）写入输出流。\
  \ |\n| `void writeShort(int v)` | 将一个由两个字节组成的短整数值（short）写入输出流。 |\n| `void writeUTF(String\
  \ str)` | 向输出流写入两个字节的长度信息，随后是字符串 `s` 中每个字符的修改后的 UTF-8 表示。 |\n\n### OutputStream\
  \ 类总结\n\n`DataOutputStream` 是 `DataInputStream` 的对等类。`DataOutputStream` 类在使用 `OutputStream`\
  \ 类方法外，还实现了 `DataOutput` 接口中描述的方法。\n\n### OutputStream 类总结\n\n| 类 | 说明 |\n| :---\
  \ | :--- |\n| `OutputStream` | 此抽象类是所有表示字节输出流的类的父类。 |\n| `BufferedOutputStream`\
  \ | 该类实现了一个带输出输出流。 |\n| `ByteArrayOutputStream` | 该类实现了一个输出流，其中数据被写入字节数组中。 |\n|\
  \ `DataOutputStream` | 数据输出流允许应用程序以可移植的方式将 Java 原始数据类型写入输出流。 |\n| `FileOutputStream`\
  \ | 文件输出流是用于向 `File` 写入数据的输出流。 |\n| `PipedOutputStream` | 管道输出流可以连接到管道输入流以创建通信管道。\
  \ |\n| `FilterOutputStream` | `FilterOutputStream` 包含一些其他输出流，它将其作为目标，并可能在传输过程中对数据进行转换或提供额外功能。\
  \ |\n| `PrintStream` | `PrintStream` 为另一个输出流增加了功能，即方便地打印各种数据值的表示的能力。 |\n\n## 字符流类概览\n\
  \n字符流通过使用两个类层次结构定义。顶端是两个抽象类：`Reader` 和 `Writer`。这些抽象类处理 Unicode 字符流。\n\nJava 拥有这些每个抽象类的几个具体子类。抽象的\
  \ `Reader` 和 `Writer` 类定义了其他流类实现的几个关键方法。其中最重要的两个方法是 `read()` 和 `write()`，它们分别读取和写入字符数据。这些方法被派生流类重写。\n\
  \n### Reader 流类\n\nReader 流类设计用于从文件中读取字符。`Reader` 类是此组中所有其他类的基类。这些类在功能上与输入流类非常相似，但输入流使用字节作为信息的根本单位，而\
  \ reader 流使用字符。\n\n`Reader` 类包含了与 `InputStream` 类中提供的相同的方法。因此，`Reader` 类可以执行输入流类实现几乎的所有功能。\n\
  \n![](img/image01254.jpeg)\n\n(Reader 流类层次结构)\n\n## Reader 类\n\n`Reader` 是一个抽象类，定义了\
  \ Java 的字符输入流模型。该类中的所有方法都将抛出 `IOException`。\n\n### Reader 类方法\n\n| 方法 | 说明 |\n|\
  \ :--- | :--- |\n| `abstract void close()` | 关闭流。一旦流被关闭，进一步的 `read()`、`ready()`、`mark()`\
  \ 或 `reset()` 调用将抛出 `IOException`。然而，关闭一个已经关闭的流将没有任何影响。 |\n| `void mark()` | 标记流中的当前位置。随后调用\
  \ `reset()` 将尝试将流重置到此点。并不是所有的字符输入流都支持 `mark()` 操作。 |\n| `boolean markSupported()`\
  \ | 告诉此流是否支持 `mark()` 操作。 |\n| `int read()` | 读取单个字符并返回来自调用输入流的下一个可用字符的整数表示。当遇到文件末尾时返回\
  \ -1。 |\n| `int read(char[] buffer)` | 尝试读取最多 `buffer` 长度的字符到 `buffer` 中，并返回成功读取的字符数。当遇到文件末尾时返回\
  \ -1。reader 子类必须实现此方法。 |\n| `abstract int read(char[] buffer, int offset, int numChar)`\
  \ | 尝试从 `buffer[offset]` 开始读取最多 `numChar` 个字符到 `buffer` 中，返回成功读取的字符数。当遇到文件末尾时返回\
  \ -1。reader 子类必须实现此方法。 |\n| `boolean ready()` | 告诉是否准备好读取。如果读取请求将等待则返回 true，否则返回\
  \ false。 |\n| `void reset()` | 重置流。并不是所有字符输入流都支持此方法。 |\n| `long skip(long n)` |\
  \ 跳过 `n` 个字符并返回跳过的字符数。如果 `n` 为负则抛出 `IllegalArgumentException` | |\n\n### Reader\
  \ 类总结\n\n| 类 | 说明 |\n| :--- | :--- |\n| `Reader` | 读取字符流的抽象类。 |\n| `BufferedReader`\
  \ | 从字符输入流读取文本，缓冲字符以便高效读取字符和行。 |\n| `CharArrayReader` | 实现一个可以作为字符输入流缓冲区。 |\n| `FileReader`\
  \ | 读取字符的便利类。 |\n| `FilterReader` | 读取过滤字符流的抽象类。 |\n| `InputStreamReader` | 字节流到字符流的桥接：它使用指定的字符将字节解码为字符。\
  \ |\n| `PipedReader` | 管道字符输入流。 |\n| `PushbackReader` | 允许将字符推回流的字符读取器。 |\n| `StringReader`\
  \ | 源自字符串的字符流。 |\n\n## Writer 类\n\nWriter 流类设计用于向文件/输出设备写入字符。`Writer` 类是一个抽象类，作为其他写入流类的基类。通过定义与\
  \ `OutputStream` 类相同的方法提供了对所有输出操作的支持。\n\n`Writer` 类包含了与 `OutputStream` 类提供的相同的方法。因此，`Writer`\
  \ 类可以执行输出类实现几乎的所有功能。\n\n![](img/image01255.jpeg)\n\n(Writer 流类层次结构)\n\n## Writer\
  \ 类\n\n`Writer` 是一个抽象类，定义了字符输出流。该类中的所有方法都返回 void 值并在发生错误时抛出 `IOException`。\n\n###\
  \ Writer 类方法\n\n| 方法 | 说明 |\n| :--- | :--- |\n| `abstract void close()` | 关闭流并先刷新。\
  \ |\n| `abstract void flush()` | 刷新流。 |\n| `void write(char[] cbuf)` | 写入字符数组。 |\n\
  | `abstract void write(char[] cbuf, int off, int len)` | 从指定的偏移量开始写入数组的一部分。子类必须实现此方法。\
  \ |\n\n\n\n\n\n## Writer 方法\n\n| `void write(int c)` | 向调用的输出流写入单个字符。请注意该参数类型为 `int`，这允许你直接对表达式调用\
  \ `write`，而无需将其强制转换回 `char`。 |\n| `void write(String str)` | 写入一个字符串。 |\n| `void\
  \ write(String str, int off, int len)` | 写入字符串从指定偏移量开始的部分。 |\n\n![C:\\Users\\Made\
  \ Man Harry\\Desktop\\Stars\\Star_logo_yellow.jpg](img/image01257.jpeg)\n\n## Writer\
  \ 类摘要\n\n| 类 | 描述 |\n| :--- | :--- |\n| `Writer` | 用于写入字符流的抽象类。 |\n| `BufferedWriter`\
  \ | 向字符输出流写入文本，通过对字符进行缓冲，提供单个字符、数组和字符串的高效写入。 |\n| `CharArrayWriter` | 该类实现了一个可以作为\
  \ `Writer` 的字符缓冲区。 |\n| `FileWriter` | 用于写入字符文件的便利类。 |\n| `FilterWriter` | 用于写入过滤字符流的抽象类。\
  \ |\n| `OutputStreamWriter` | `OutputStreamWriter` 是字符流到字节流的桥梁：写入它的字符将使用指定的 `charset`\
  \ 编码为字节。 |\n| `PipedWriter` | 管道字符输出流。 |\n| `PrintWriter` | 向文本输出流打印对象的格式化表示。 |\n\
  | `StringWriter` | 一种字符流，将其输出收集在字符串缓冲区中，然后可以使用它来构造字符串。 |\n\n## File 类\n\n尽管 `java.io`\
  \ 中定义的大多数类都是对流的操作，但 `File` 类并不是。它直接处理文件和文件系统。也就是说，`File` 类并没有指定如何从文件中检索信息或将其存储在文件中。它描述的是类本身的属性。\n\
  \n文件对象用于获取或操作与磁盘文件相关的信息，例如权限、时间、日期和目录路径，并导航子目录层次结构。\n\n虽然出于安全考虑，文件在 applet 中的使用受到严格限制，但文件仍然是存储持久性和共享信息的核心资源。\n\
  \nJava 中的目录被简单地视为一个文件，额外多了一个属性——一个可以通过 `list()` 方法检查的文件名列表。\n\n| 构造函数 | 描述 |\n|\
  \ :--- | :--- |\n| `public File(String)` | 构造函数 |\n| `public File(String, String)`\
  \ | 构造函数 |\n| `public File(File, String)` | 构造函数 |\n| `public File(URI)` | 此构造函数在\
  \ Java 2（版本 1.4）中被添加 |\n\n### File 方法\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `public\
  \ String getName()` | 返回 `file` 或目录的名字 |\n| `public String getParent()` | 返回从对象创建期间指定的\
  \ `path` 的 `file` 的父目录；如果该 `pathname` 未命名父目录，则返回 `null`。 |\n| `public String getPath()`\
  \ | 返回相对路径。 |\n| `public boolean isAbsolute()` | 测试此抽象 `pathname` 是否为绝对路径。 |\n|\
  \ `public String getAbsolutePath()` | 返回从根开始的绝对（完整）路径。 |\n| `public boolean canRead()`\
  \ | 测试应用程序是否可以读取此抽象 `pathname` 所指示的文件。 |\n| `public boolean canWrite()` | 测试应用程序是否可以修改此抽象\
  \ `pathname` 所指示的文件。 |\n| `public boolean exists()` | 测试此抽象 `pathname` 所指示的文件或目录是否存在。\
  \ |\n| `public boolean isDirectory()` | 测试此抽象 `pathname` 所指示的是否为目录。 |\n| `public\
  \ boolean isFile()` | 测试此抽象 `pathname` 所指示的是否为普通文件。 |\n| `public boolean isHidden()`\
  \ | 测试此抽象 `pathname` 命的文件是否为隐藏文件。 |\n| `public long lastModified()` | 返回此抽象 `pathname`\
  \ 所指示的文件最后修改的时间。 |\n| `public long length()` | 返回此抽象 `pathname` 所指示的文件长度。 |\n| `public\
  \ boolean createNewFile() throws java.io.IOException` | 仅当不存在名为此名称的文件时，自动创建一个由此抽象\
  \ `pathname` 命名的新空文件。 |\n| `public boolean delete()` | 删除此抽象 `pathname` 所指示的文件或目录。\
  \ |\n| `public String[] list()` | 返回表示此抽象 `pathname` 所指示目录中的文件和目录名称的字符串数组。如果 `File`\
  \ 对象对应文件，则返回 `null`。 |\n| `public boolean mkdir()` | 创建由此抽象 `pathname` 命名的目录。 |\n\
  | `public boolean mkdirs()` | 创建由此抽象 `pathname` 命名的目录，包括任何必要的但不存在的父目录。 |\n| `public\
  \ boolean setLastModified(long)` | 设置此抽象 `pathname` 命名的文件或目录的最后修改时间。 |\n| `public\
  \ boolean setReadOnly()` | 标记此抽象 `pathname` 命名的文件或目录，使其只允许读操作。 |\n| `public boolean\
  \ setWritable(boolean)` | |\n| `public boolean setReadable(boolean)` | |\n| `public\
  \ boolean canExecute()` | |\n| `public long getTotalSpace()` | |\n| `public long\
  \ getFreeSpace()` | |\n| `public long getUsableSpace()` | |\n| `boolean renameTo(File)`\
  \ | 重命名此抽象 `pathname` 所指示的文件。 |\n\n#### 示例\n\n```java\nFile f1 = new File(\"/\"\
  );\nFile f2 = new File(\"/\", \"autoexec\");\nFile f3 = new File(f1, \"autoexec\"\
  );\n```\n\n### 注意\nJava 在所有平台上的路径分隔符都使用正斜杠 `/`。在 Windows 版本中，反斜杠 `\\` 也是路径分隔符。如果你在\
