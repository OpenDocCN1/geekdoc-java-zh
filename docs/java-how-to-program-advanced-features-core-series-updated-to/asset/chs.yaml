  \ we) {\n        System.out.println(\"Window Iconified\");\n    }\n    public void\
  \ windowDeiconified(WindowEvent we) {\n        System.out.println(\"Window Deiconified\"\
  );\n    }\n}\n```\n\n### 适配器 (Adapters)\n\n某些事件监听器接口包含多个方法。最大的接口 `WindowListener`\
  \ 有七个方法。假设我们要捕获 `windowClosing()` 事件，以便执行关闭窗口的代码。虽然我们在实现 `WindowListener` 的类中只需要\
  \ `windowClosing()` 一个方法，但我们必须为所有方法提供空实现（dummy implementation）。\n\n\n\n\n`java.awt.event`\
  \ 包提供了几个适配器类，每个适配器都对应一个定义了多个单一方法的监听器接口。\n\n适配器（Adapter）简单来说就是一个通过提供空方法来实现接口的类。例如，`WindowAdapter`\
  \ 类实现了 `WindowListener` 接口，并包含了七个空方法。\n\n### 适配器类及其接口\n\n| 适配器类 | 监听器接口 |\n| :---\
  \ | :--- |\n| `ContainerAdapter` | `ContainerListener` |\n| `FocusAdapter` | `FocusListener`\
  \ |\n| `KeyAdapter` | `KeyListener` |\n| `MouseAdapter` | `MouseListener` |\n| `MouseMotionAdapter`\
  \ | `MouseMotionListener` |\n| `WindowAdapter` | `WindowListener` |\n\n### 示例 18.6\
  \ WindowAdapter 类的用法。\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
  \nclass A6 {\n    public static void main (String args[]) {\n        Frame f = new\
  \ Frame();\n        f.setLayout(new FlowLayout());\n        f.setSize(300,300);\n\
  \        f.addWindowListener(new B( ));\n        f.setVisible(true);\n    }\n}\n\
  \nclass B extends WindowAdapter {\n    public void windowClosing(WindowEvent we)\
  \ {\n        System.out.print(\"Window Closing\");\n        Frame f = (Frame) we.getWindow();\n\
  \        f.dispose();\n    }\n}\n```\n\n### InputEvent 类\n\n这是组件级输入事件的根事件类。输入事件在由产生源进行正常处理之前，会被派送给监听器。这允许监听器和子类“消耗”事件，使得源不会以默认方式处理这些事件。例如，在\
  \ `Button` 组件上消耗鼠标事件将防止 `Button` 被激活。\n\n### 方法\n- `void consume()`: 消耗此事件，使其由产生源以默认方式处理。\n\
  - `int getModifiers()`: 返回此事件的修饰符掩码（Modifier mask）。\n- `int getModifiersEx()`: 返回此事件的扩展修饰掩码。\n\
  - `static String getModifiersExText(int modifiers)`: 返回描述扩展修饰键的字符串，例如“shift”、“Ctrl\
  \ + Shift”等。\n- `long getWhen()`: 返回事件发生的时间戳。\n- `boolean isAltDown()`: 返回此事件发生时\
  \ Alt 修饰符是否被按下。\n- `boolean isConsumed()`: 返回此事件是否已被消耗。\n- `boolean isControlDown()`:\
  \ 返回此事件发生时 Control 修饰符是否被按下。\n- `boolean isShiftDown()`: 返回此事件发生时 Shift 修饰符是否被按下。\n\
  \n### Mouse Event\n\n这是 `Event` 类的子类。该事件表示组件中发生了鼠标操作。当且仅当光标位于组件子的未遮挡部分或顶层窗口时，才认为鼠标操作发生在特定组件中。此事件用于鼠标事件（点击、按下、释放）和移动事件（移动和拖拽）。\n\
  \n### 方法\n- `int getButton()`: 返回哪个鼠标按钮状态发生了变化（如果有）。\n- `int getClickCount()`: 返回与此事件相关的鼠标点击次数。\n\
  - `static String getModifiersText(int modifiers)`: 返回描述事件发生期间按下的修饰键的字符串，例如“Shift”或“Ctrl\
  \ + shift”。\n- `point getPoint()`: 返回事件相对于源组件的 x, y 位置。\n- `int getX()`: 返回事件相对于源组件的水平\
  \ x 位置。\n- `int getY()`: 返回事件相对于源组件的垂直 y 位置。\n- `boolean isPopupTrigger()`: 返回此鼠标事件是否为该平台的弹出菜单触发事件。\n\
  \n**注意：** 弹出菜单在不同系统上的触发方式不同。因此，为了实现良好的跨平台功能，应该在 `mousePressed` 和 `mouseReleased`\
  \ 中都检查 `isPopupTrigger()`。\n\n### 处理鼠标事件：示例 18.7\n\n```java\nimport java.awt.*;\n\
  import java.awt.event.*;\n\nclass A7 {\n    public static void main(String args[])\
  \ {\n        Frame f = new Frame();\n        f.setLayout(new FlowLayout());\n  \
  \      f.setSize(300,30);\n        Button b1 = new Button(\"Push Me\");\n      \
  \  b1.addMouseListener(new B());\n        b1.addMouseMotionListener(new C());\n\
  \        b1.addActionListener(new D());\n        f.add(b1);\n        f.setVisible(true);\n\
  \    }\n}\n\nclass B implements MouseListener {\n    public void mouseEntered(MouseEvent\
  \ me) {\n        System.out.println(\"Mouse Entered...\");\n        System.out.println(me.getX());\n\
  \        System.out.println(me.getY());\n    }\n\n    public void mouseExited(MouseEvent\
  \ me) {\n        System.out.println(\"Mouse Exited...\");\n        Point p1 = me.getPoint();\n\
  \        System.out.println(p1.x);\n        System.out.println(p1.y);\n    }\n\n\
  \    public void mousePressed(MouseEvent me) {\n        System.out.println(\"Mouse\
  \ pressed...\");\n        int ms = me.getModifiersEx();\n        String s = me.getModifiersText(ms);\n\
  \        System.out.println(s);\n    }\n\n    public void mouseReleased(MouseEvent\
  \ me) {\n        System.out.println(\"Mouse Released...\");\n        System.out.println(\"\
  ClickCount-->\" + me.getClickCount());\n    }\n}\n```\n\n\n\n\n### 代码实现\n\n```java\n\
  public void mouseClicked(MouseEvent me)\n{\n    System.out.println(\"Mouse Clicked...\"\
  );\n    System.out.println(\"Button-->\"+me.getButton());\n}\n\nclass C implements\
  \ MouseMotionListener\n{\n    public void mouseMoved(MouseEvent me)\n    {\n   \
  \     System.out.println(\"Mouse Moved...\");\n    }\n    public void mouseDragged(MouseEvent\
  \ me)\n    {\n        System.out.println(\"Mouse Dragged...\");\n    }\n}\n\nclass\
  \ D implements ActionListener\n{\n    public void actionPerformed(ActionEvent ae)\n\
  \    {\n        System.out.println (\"Button Pressed...\");\n    }\n}\n```\n\n###\
  \ ActionEvent 类\n这是一种语义化事件，表示发生了组件动作。这种高层事件在特定动作发生（如被按下）时，由组件（如 `Button`）生成。该事件通过组件的\
  \ `addActionListener` 方法传递给每个注册用于接收此类事件的 `ActionListener` 对象。当事件发生时，实现 `ActionListener`\
  \ 接口的对象将获取此事件。监听器无需处理处理个别鼠标移动和点击的细节，转而处理诸如“按钮被按下”等“有意义的”（语义）事件。\n\n注意：使用键盘在 `Button`\
  \ 上触发 `ActionEvent`，请使用空格键。\n\n#### ActionEvent 的方法：\n- `String getAction()`：返回与此动作关联的命令字符串。\n\
  - `int getModifiers()`：返回动作事件期间期间按的修饰键。\n- `long getWhen()`：返回事件发生的时间戳。\n\n### 示例\
  \ 18.8\n此示例说明了如何识别在 `ActionEvent` 发生时有效的按修饰符。\n\n```java\nimport java.awt.*;\nimport\
  \ java.awt.event.*;\npublic class KeyModifierDemo extends Frame implements ActionListener\n\
  {\n    Button b;\n    KeyModifierDemo ()\n    {\n        b = new Button (\"Button\"\
  );\n        b.addActionListener (this);\n        setLayout (new FlowLayout ( ) );\n\
  \        add (b);\n        setBounds (100,0,20,20);\n        setVisible (true);\n\
  \    }\n    public static void main (String args[])\n    {\n        new KeyModifierDemo\
  \ ();\n    }\n    public void actionPerformed (ActionEvent ae )\n    {\n       \
  \ System.out.println (\"Button Pressed\");\n        int ms = ae.getModifiers ();\n\
  \        if (ms & InputEvent.CTRL_DOWN_MASK)!=0)\n        {\n            System.out.println\
  \ (\"CTRL key was pressed\");\n        }\n        if (ms & InputEvent.SHIFT_DOWN_MASK)!=0)\n\
  \        {\n            System.out.println (\"Shift Key was pressed\");\n      \
  \  }\n        if (ms & InputEvent.ALT_DOWN_MASK)!=0)\n        {\n            System.out.println\
  \ (\"ALT key was pressed\");\n        }\n    }\n}\n```\n\n### 处理多个 Action 命令\nAction\
  \ 事件是最简单的。当我们发现滚动条发送了调整事件时，显而易的问题是：“现在滚动条的值是多少？”。当我们发现鼠标被点击时，自然会想知道：“鼠标的 x 和 y 坐标是什么？”但当我们发现一个按钮发送了\
  \ `ActionEvent` 时，似乎没有额外的信息需要寻找；按钮已经通过点击了，这似乎就是全部的已知信息。\n\n然而，`ActionEvent` 还关联着一个额外信息。这条信息是一个字符串，被称为\
  \ Action 命令（Action command）。我们可以通过 `getActionCommand()` 方法提取 `ActionEvent` 的 Action\
  \ 命令。如果 `ActionEvent` 是由文本字段发送的，`getActionCommand()` 返回文本字段当前的内容（用户输入回车键时文本字段会发送\
  \ `ActionEvent`）。如果 `ActionEvent` 是由按钮发送的，默认行为是 `getActionCommand()` 返回按钮的标签字符串。然而，我们可以通过调用\
  \ `setActionCommand(String)` 方法显式地设置按钮的 `ActionCommand`。\n\n```java\nButton btn\
  \ = new Button (\"Hello\");\nbtn.setActionCommand (\"Hello\");\n```\n\n当按钮的 `ActionListener`\
  \ 需要决定如何响应 `ActionEvent` 时，按钮 Action 命令的优势就显而易见了。单个监听器作为多个组件的监听器是常见的；在我们的语境下，一个对象可能是多个或按钮的\
  \ `ActionListener`。在这种情况下，对象的 `actionPerformed()` 方法必须开始判断哪个按钮被命中了。以下示例演示了这一点：\n\
  \n### 示例 18.9\n```java\nimport java.awt.*;\nimport java.awt.event.*;\nclass ButtonTest\n\
  {\n    Button b1,b2,b3;\n    ButtonTest()\n    {\n        Frame f=new Frame();\n\
  \        f.setLayout(new FlowLayout ( ) );\n        f.setSize(300,300);\n      \
  \  b1=new Button(\"Push Me\");\n        b2=new Button(\"Click Me\");\n        b3=new\
  \ Button(\"Hit Me\");\n        f.add(b1); f.add(b2); f.add(b3);\n        B obj=\
  \ new B(b1,b2,b3);\n        b1.addActionListener(obj);\n        b2.addActionListener(obj);\n\
  \        b3.addActionListener(obj);\n        f.setVisible(true);\n    }\n    public\
  \ static void main (String args[])\n    {\n        new ButtonTest();\n    }\n}\n\
  class B implements ActionListener\n{\n    Button b4,b5,b6;\n    B(Button b1, Button\
  \ b2, Button b3)\n}\n```\n\n\n\n\n\n```java\n{\n    b4 = b1;\n    b5 = b2;\n   \
  \ b6 = b3;\n}\npublic void actionPerformed(ActionEvent ae)\n{\n    Button b = (Button)ae.getSource();\n\
  \    if (b == b4)\n        System.out.println(\"First Button was pressed\");\n \
  \   else if (b == b5)\n        System.out.println(\"Second Button was pressed\"\
  );\n    else if (b == b6)\n        System.out.println(\"Third Button  was pressed\"\
  );\n}\n```\n\n### 示例 18.10:\n\n```java\nimport java.awt.*;\nimport java.awt.event.*;\n\
