  \ `isAlive()`。该方法由 `Thread` 定义，其通用形式为：`boolean isAlive()`。如果调用该方法的线程仍在运行，则它返回 true；否则返回\
  \ false。虽然 `isAlive()` 有时很有用，但我们通常用于等待线程完成的方法是 `join()`，如下所示：`void join() throws\
  \ InterruptedException`。该方法会等待直到调用它的线程终止为止。`join()` 的其他形式允许我们指定等待特定线程终止的最长时间。接下来的示例使用了\
  \ `join()` 来确保主线程是最后一个执行的。它还演示了 `isAlive()` 方法。\n\n示例 2.6\n\n```java\nclass A implements\
