  area() of Circle\ndisplay() of Circle\ngetdata() of Rectangle\narea() of Rectangle\n\
  display() of Rectangle\n```\n\n### Final 方法 (Final method)\n如果我们不希望一个方法被派生类重写，可以将基类定义为\
  \ `final`。任何重写该方法的尝试都会导致编译错误。\n\n```java\nclass A {\n    final void method1() {\n\
  \        //\n    }\n}\nclass B extends A {\n    void method1() // 错误\n}\n```\n\n\
  ### Final 类 (Final class)\n有时出于安全考虑，我们可能希望防止类被进一步子化。不能被子类的类被称为 `final class`。在 Java\
  \ 中通过如下使用 `final` 关键字来实现：\n\n```java\nfinal class A1 {\n    //\n}\n```\n将类声明为 `final`\
  \ 可以防止对该类的任何意外扩展。任何继承 `A` 的尝试都会导致错误，编译器将不允许这样做。\n\n### 题 (Theory Questions)\n1.\
