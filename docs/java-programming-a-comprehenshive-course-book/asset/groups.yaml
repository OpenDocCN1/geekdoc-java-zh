    \n# 12.8 布局管理器 (LAYOUT MANAGER)\n\n为了创建布局，我们使用布局管理器。布局管理器是现代 GUI 编程中最困难的部分之一。并不是非要使用布局管理器，但为了创建真正可移植、复杂的应用程序，我们需要布局管理器。没有布局管理器，我们可以使用绝对值来放置组件。\n\
    \n使用布局管理器涉及的一些常见任务包括：\n\n- 设置布局管理器\n- 向容器中添加组件\n- 提供尺寸和对齐提示\n- 在组件之间留出空间\n- 设置容器的取向\n\
    - 选择布局管理器的提示\n- 第三方布局管理器\n\nJava 布局管理器类实现了 `LayoutManager` 接口。它用于确定容器内各个组件的位置和大小。组件可以提供尺寸和对齐提示，但容器的布局管理器对容器内组件的大小和位置具有最终决定权。\n\
    \nFlowLayout（流布局）：这是 Java Swing 工具包中最简单的布局管理器。它主要与其他布局管理器结合使用。在计算其子组件大小时，流布局允许每个组件假设其自然（首选）尺寸。\n\
    \n管理器按照它们添加的顺序将组件放入行中。如果它们无法放入一行，则将进入下一行。组件可以从左到右添加，反之亦然。管理器允许对组件进行对齐。\n\nGridLayout（网格布局）：GridLayout\
    \ 布局管理器在矩形网格中布局组件。容器被划分为等等大小的矩形。每个矩形中放置一个组件。\n\nBorderLayout（边框布局）：BorderLayout\
    \ 管理器是一个非常实用的布局管理器。它将空间分为五个区域：北、西、南、东和中心。每个区域只能有一个组件。如果我们需要在某个区域放入更多组件，我们可以简单地放入一个带有我们选择的管理器的面板。N、W、S、E\
    \ 区域的组件获得其首选尺寸。中心组件占据整个空间。\n\n# BoxLayout（框框布局）：BoxLayout 是一种强大的管理器，可用于创建复杂的布局。这种布局管理器将组件放入行中或一列中。它启用了嵌套，这是一项强大的功能，使得该管理器非常灵活。这意味着我们可以将一个框布局放入另一个框框布局中。\n\
