  mdcn: "\n\n# Java 模块1 (BCA) 第4单元 (证明 1)\n\n所需的构造函数。如果一个构造函数调用另一个构造函数，它必须作为第一条语句执行：this()\
    \ 调用同一类中的另一个构造函数。下面的程序段展示了“this”关键字的使用。\n\n```\nclass Triangle {\n    double base,\
    \ height;\n    Triangle(double b, double h) {\n        base = b;\n        height=h;\n\
    \    }\n    Triangle(double b) {\n        this(b, 20.50);\n    }\n}\n```\n\n在这里，`Triangle`\
    \ 类有两个构造函数。第一个接受指定三角形底边和高度的参数。第二个构造函数仅接受底作为参数，并用默认值 20.50 作为高度调用第一个构造函数。这种方法的优点是单个构造函数可以调用其他构造函数。它必须作为第二个构造函数的第一条语句出现。需要记住，我们只能作为另一个构造函数的第一条语句调用第二个构造函数。\n\
    \n# 4.5 向方法传递参数\n\n在 Java 中，我们可以将任何有效 Java 数据类型的参数传递到方法中，类似于 C、C++ 等其他编程语言中的函数。这包括简单数据类型如字符、整数、浮点数、双精度浮点数和布尔，以及所需的类型如数组、对象等。参数为方法范围之外的方法提供信息。Java\
    \ 方法始终指定一个返回类型。返回的值可以是基本类型、引用类型或 void（表示无返回值）。\n\n方法或构造函数的声明定义了该方法或构造函数的参数的数量和类型。\n\
    \n例如，让我们考虑以下这个计算矩形面积的方法：\n\n```\nint computeArea(int width, int height)    //方法头\n\
    {\n    int area; // area 是局部变量\n    area = width * height;\n    return area;\n\
    }\n```\n\n在这里，第一个部分表示该方法返回一个整数。方法名称为 \"computeArea\"，它有两个参数——长度和宽度。方法体以左大括号 \"\
    {\" 开始，以右大括号 \"}\" 结束。可以使用以下语法调用该方法：\n\n```\nint a=r1.computeArea(16,8);    //方法调用\n\
    ```\n\n- **形式参数与实际参数**：用于定义方法的参数被称为形式参数。在上面的示例中，`width` 和 `height` 是形式参数。我们使用实际参数一术语指代方法调用中的变量。它们被称为“实际”的是因为它们决定了发送到方法的实际值。\n\
    \n- 让我们考虑当向方法传递参数时会发生什么。在 Java 中，所有基本数据类型（例如 `int`、`char`、`float`）都是按值传递的。引用类型（即任何对象，包括数组和字符串）通过引用使用。重要的区别在于，引用本身（指向这些对象的指针）实际上是基本类型，也是按值传递的。\n\
    \n- **按值传递 (Pass-by-Value)**：按值传递意味着当我们调用方法时，每个实际参数值的副本被传递到方法中。我们可以在方法内部更改副本，但这对实际参数不会产生任何影响。与许多其他语言不同，Java\
    \ 没有改变实际参数值的值的机制。Java 有八种基本数据类型。让我们考虑以下示例来演示按值传递：\n\n```\n//Program 4.6 : PassPrimitiveByValue.java\n\
    class PassPrimitiveByValue {\n    public static void main(String[] args) {\n \
    \       int p = 3;\n        System.out.println(\"Before calling passValue, p =\
    \ \" + p);\n        passValue(p); //call passValue() with p as argument\n    \
    \    System.out.println(\"\\nafter calling passValue, p = \" + p);\n    }\npublic\
    \ static void passValue(int p)//passValue() definition of {\n        //change\
    \ the value of parameter\n        p = 10;\n    }\n}\n```\n\n当我们运行此程序时，输出将是：\n\n\
    ![](img/2b1351fdf3659b78e3b160b1f4f9bfd6_62_0.png)\n\n在这里，我们看到调用方法 `passValue()`\
    \ 之前后的输出。当 Java 调用方法时，它会创建实际参数值的副本并将副本发送到方法中，它们在方法中成为形式参数的值。然后方法返回，这些副本被丢弃，而实际参数保持不变。\n\
    \n# Java 模块1 (BCA) 第4单元 (证明 1)\n\n第 4 单元\n\n按值传递变量为程序员提供了一定的安全性。方法无法无意中修改其范围之外的变量。然而，我们通常希望方法能够修改其一个或多个参数。在\
    \ `passValue` 方法中，调用者希望方法通过其参数更改值。然而，方法无法修改其参数，而且，一个方法只能通过其返回值返回一个值。因此，有必要学习方法如何返回多个值，或者在它的范围之外产生影响（修改某些值）。\n\
    \n为了允许方法修改参数，我们必须传递一个对象。Java 中的对象也是按值传递的；但是，对象的值是一个引用。因此，效果是对象是按引用传递的。当按引用传递参数时，方法获取该对象的引用。对象的引用是该对象在内存中的地址。现在，方法内部的局部变量与调用者内部变量指向同一个内存位置。\n\
    \n例如，如果方法的参数是一个对象引用。我们可以以任何方式操作对象，但不能让引用指向不同的对象。\n\n```\n//Program 4.7 : Record.java\
    \ (demonstration of passing object to method)\nclass Record\n{\n    int roll;\n\
    \    String name;\n    static void tryObject(Record r)//parameter is an object\n\
    {\n        //reference\n        r.roll = 1;\n        r.name = \"Anuj\";\n}\npublic\
    \ static void main(String [] args)\n{\n    Record obj = new Record();//object\
    \ obj of Record class\n    obj.roll = 2;\n}\n}\n```\n\nJava 中的类\n\n76\n\nJava\
