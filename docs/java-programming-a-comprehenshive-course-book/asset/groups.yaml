    # Java Block 1 (BCA) Unit-5 (Proof 1)


    Inheritance


    An abstract method is one that is intended to be overridden in each subclass.
    The abstract method specifies what its subclasses have to implement, but leaves
    the actual implementation up to them. Then an abstract method can be regarded
    as an outline or a specification contract.


    # 6.6 STATIC MEMBERS


    There may be some situation where we want to define a class member that will be
    used independently without any object of that class. Generally, a class member
    must be accessed only in conjunction with object of its class. However, it is
    possible to create a member that can be used by itself, without reference to a
    specific instance. To create such a member, we have precede its declaration with
    the keyword static. When a member is declared as static, it can be accessed before
    creating any objects of its class. We can declare both methods and variables to
    be static.


    Static methods (class methods), like static variables, belong to the class and
    not to an individual instance of the class. It can be invoked by the method name
    and through the class name without any object. Because it is not bound to a particular
    object instance, a static method can directly access any static members of the
    class. It cannot directly see any instance variables or any instance methods.


    The most common example of a static member is main(). Method main() is static
    because it must be called before any objects exist. Instance variables declared
    as static are, essentially, global variables. When objects of class are declared,
    no copy of a static variable is made. Instead, all instances of class share the
    same static variable. Methods declared as static have several restrictions:


    +   - They can only call other static methods.

    - They must only access static data.'
