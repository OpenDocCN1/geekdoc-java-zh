    \ 2*length*breadth;\n    }\n}\n```\n\n//Rectangle 类有两个指定长度和宽度的字段，\n//一个构造函数和两个方法。两个方法\
    \ Circumference()\n// 和 Area() 实现了父类中声明的对应的抽象方法。\n\n```java\nclass Demo\n{\n \
    \   public static void main(String[] args) {\n        Rectangle r = new Rectangle(10.0,\
    \ 6.0);\n        Circle c = new Circle(4.0);\n        System.out.println(\"The\
    \ area of the rectangle is \"+ + r.Area());\n        System.out.println(\"The\
    \ circumference of the rectangle is \"+ + r.Circumference());\n        System.out.println(\"\
    The area of the circle is \"+ + c.Area());\n        System.out.println(\"The circumference\
    \ of the circle is \"+ + c.Circumference());\n    }\n}\n```\n\n输出将如下：\n![](img/2b1351df3659b78e3b160b1f4fd6_107_png)\n\
    图 6.3：程序 6.3 的输出。在程序中，在类中声明了抽象方法 Area()，是因为我们希望每个子类都拥有一个完整的方法来返回其实例的面积，并且我们希望所有这些方法具有相同的签名\
    \ `double Circumference()`。\n\n抽象方法是一种没有实现的方法。它仅仅被声明，并将方法的体留给子类来实现。\n\n## 6.6\
    \ 静态成员 (STATIC MEMBERS)\n\n静态成员可以在没有创建对象的情况下被使用。通常情况下，通过类名访问它们。静态方法与静态变量一样，属于类，而不是实例。静态方法可以访问类。\n\
