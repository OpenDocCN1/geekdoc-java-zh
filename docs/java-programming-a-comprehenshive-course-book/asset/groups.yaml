    \n### 引言\n\n在上一个单元中，我们讨论了 Java 中的类和对象。数组是一种线性且同构的数据结构。在本单元中，我们将讨论数组以及在 Java 语言中如何声明和初始化数组。此外，本单元还涵盖了字符串和向量的概念。在下一个单元中，我们将探索与继承和多态相关的概念。\n\
    \n### 数组\n\n在基本数据类型中，每个标识符对应一个单一的值。当你需要处理一组相同类型的值时，数组是必不可少的。数组是存储在共同名称下的连续位置上的相关数据的集合。要引用数组中的特定元素，你可以使用数组名结合称为索引（index）的整数值。你已经熟悉了如何在\
