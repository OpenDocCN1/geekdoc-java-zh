  mdcn: "\n\n# Java 模块 1 (BCA) 第4单元 (证明 1)\n\n## Java 中的第4单元类\n\n命名为 Area.java。如果我们使用上述数据执行程序，输出将如下所示：\n\
    \n```\nCommand Prompt\nC:\\j2dk\\4.1.01\\bin>java Area\nArea of the first triangle\
    \ is = 31.7\nArea of the second triangle is = 225.0\n```\n\n图 4.2：程序 4.2 的输出\n\
    \n如果我们将这两个类 Triangle 和 Area 分别写入到两个独立的文件，即 `Triangle.java` 和 `Area.java`，那么这两个文件应该保存在计算机的同一个文件夹中。编译\
    \ `Area.java` 程序之前，我们必须首先编译 `Triangle` 类：\n\n```\njavac Triangle.java\n```\n\n\
    这将在相同文件夹中创建字节码文件 `Triangle.class`。现在，我们可以使用以下语句编译并执行 `Area.java` 文件：`javac Area.java`\n\
    \n`java Area`\n\n如果我们查看文件夹的内容，将发现四个文件：`Triangle` 的源码和字节码，以及 `Area` 的源码和字节码。以下语句\n\
    \n```\nt1=new Triangle();\nt2=new Triangle();\n```\n\n将在内存中创建两个 `Triangle` 对象\
    \ `t1` 和 `t2`，它们为两个基底字段、两个高度字段、两个 `readData()` 方法和两个 `findArea()` 方法预留了内存。它们通过我们使用的引用来区分区分。每个字段都使用点运算符通过以下语句在两个对象中初始化：\n\
    \n```\nt1.base=20.5;\nt1.height=15.5;\n```\n\n`Triangle` 引用 `t1` 指向 `Triangle`\
    \ 对象，其基底为 20.5，高度为 15.5。`t2` 对象的基底和高度字段通过语句初始化为 30.0 和 15.0：\n\n```\nt2.readData(30.0,15.0);\n\
    ```\n\n要计算三角形 `t1` 的面积，我们可以使用以下语句中的任意一个：\n\n```\narea1= t1.height;\n```\n\n```\n\
    area1=t1.findArea();\n```\n\n同样，对于 `t2`，我们可以使用\n\n```\narea2=t2.base * t2.height;\n\
    ```\n\n```\narea2=t2.findArea();\n```\n\n# 4.4 构造函数\n\n在创建对象时对其进行初始化会更加简单简洁。Java\
    \ 支持构造函数，允许对象在创建时进行自我初始化。本节简要介绍了构造函数以及在 Java 中如何对构造函数进行重载。\n\n构造函数始终由 `new` 运算符调用。构造函数的声明与方法相似，不同之处构造函数没有返回类型。构造函数的名称必须与它声明所在的类名相同。它在创建新类实例时被调用，为该类提供了一个设置对象供使用的机会。构造函数像其他方法一样可以接受参数并可以重载，但不能被继承。例如，让我们考虑同一个\
    \ `Triangle` 类。我们可以用构造函数替换 `readData()` 方法。可以通过以下方式实现：\n\n```java\n//程序 4.3 :\
    \ TriangleArea.java\n```\n\n```java\nclass Triangle\n{\n  double base, height;\n\
    \  Triangle(double b, double h) // 带两个参数的构造函数\n  {\n    base=b;\n    height=h;\n\
    \  }\n  double findArea() // findArea() 方法定义\n  {\n    double area = 0.5* (base\
    \ *height);\n    return area;\n  }\n}\nclass TriangleArea // 带有 main() 方法的类\n\
    {\n    public static void main(String args[]) {\n        Triangle t1=new Triangle(20.5,\
    \ 15.5); // 调用构造函数\n        double area1= t1.findArea();\n        System.out.println(\"\
    Area of the triangle is \"+area1);\n    }\n}\n```\n\n程序的输出将是：Area of the triangle\
    \ is 31.7\n\n`Triangle` 类包含构造函数。我们可以识别出构造函数，是因为它的声明使用了与类相同的名称且没有返回类型。`Triangle`\
    \ 类中的构造函数接受两个参数。语句 `t1= new Triangle(20.5, 15.5);` 提供了 20.5 和 15.5 作为这些参数的值。\n\
    \n# 4.4.1 默认构造函数和拷贝构造函数\n\n一个类可能具有两种特殊的构造函数：默认构造函数和拷贝构造函数。默认构造函数是我们通过调用不带参数的构造函数创建对象时被调用的构造函数。它将实例变量初始化为默认值（数值类型为零，对象引用为\
    \ `null`，布尔类型为 `false`）。一个类中可能只有一个默认构造函数。\n\n拷贝构造函数是一种构造函数，其唯一参数是与构造函数所属同类对象的引用。它被称为拷贝，是因为它用于复制该类的现有对象。让我们考虑另一个例子来说说明这些构造函数：\n\
    \n```java\n//程序 4.4 : CircleArea.java\nclass Circle\n{\n    double radius;\n \
    \   Circle() // 默认构造函数\n    {\n        radius=10.0;\n    }\n    Circle(Circle\
    \ c) // 拷贝构造函数\n    {\n        radius = c.radius;\n    }\n    double findArea()\
    \ // 面积计算\n    {\n        double area = 3.14 * radius *radius;\n        return\
    \ area;\n    }\n}\nclass CircleArea // 带有 main() 方法的类\n{\n    public static void\
    \ main(String args[])\n    {\n        Circle p=new Circle(); // 调用默认构造函数\n   \
    \     Circle q=new Circle(p); // 调用拷贝构造函数\n        double p_area=p.findArea();\n\
    \        double q_area=q.findArea();\n        System.out.println(\"Area of circle\
    \ p = \"+p_area);\n        System.out.println(\"Area of circle q = \"+q_area);\n\
    \    }\n}\n```\n\n上述程序的输出将是：\n\n![](img/2b131fdf3659b78e3b160b1f4f9bfd6_57_0.png)\n\
    \n图 4.3：程序输出\n\n`Circle p = new Circle();` 调用默认构造函数并创建一个半径为 10.0 的对象 `p`。语句 `Circle\
    \ q = new Circle(p);` 调用拷贝构造函数并创建另一个半径为 10.0 的对象 `q`。在输出中可以看到 `p` 和 `q` 的字段是相同的，使用了默认值。\n\
    \n# 4.4.2 构造函数重载\n\n构造函数重载意味着同一个类中存在多个构造函数。程序 4.5 是构造函数重载的示例，因为该程序具有多个构造函数。编译器根据传递给构造函数的参数来区分构造函数。让我们考虑下面的\
    \ `Rectangle` 类来演示构造函数重载。通过学习它，构造函数重载的概念将更加清晰。在示例程序 4.5 中，我们编写了具有不同类型的构造函数。\n\n\
    ```java\n//程序 4.5 : ConstructorOverloading.java\nclass Rectangle\n{\n    int l,\
    \ b;      // int 类型长和宽\n    float p, q; // float 类型长和宽\n    Rectangle(int x, int\
    \ y) // 构造函数 1\n    {\n        l = x;\n        b = y;\n    }\n    int first()\
    \ { // 方法\n        return(l * b);\n    }\n    Rectangle(int x) // 构造函数 2\n   \
    \ {\n        l = x;\n        b = x;\n    }\n    int second() { // 方法\n       \
    \ return(l * b);\n    }\n    Rectangle(float x) { // 构造函数 3\n    {\n        p\
    \ = x;\n        q = x;\n    }\n    float third()\n    {\n        return(p * q);\n\
    \    }\n    Rectangle(float x, float y) // 构造函数 4\n    {\n        p = x;\n   \
    \     q = y;\n    }\n    float fourth() { // 方法\n        return(p * q);\n    }\n\
    }\nclass ConstructorOverloading {\n    public static void main(String args[])\
    \ {\n        Rectangle r1=new Rectangle(2,4);\n        int area1=r1.first();\n\
    \        System.out.println(\"\\nArea in first constructor: \" + area1);\n   \
    \     Rectangle r2=new Rectangle(5);\n        int area2=r2.second();\n       \
    \ System.out.println(\"\\nArea in second constructor: \" + area2);\n        Rectangle\
    \ r3=new Rectangle(2.0);\n        float area3=r3.third();\n        System.out.println(\"\
    \\nArea in third constructor: \" + area3);\n        Rectangle r4=new Rectangle(3.0,2.0);\n\
