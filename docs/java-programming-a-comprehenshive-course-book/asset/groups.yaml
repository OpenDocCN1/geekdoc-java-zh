    # 10.4 THE APPLET CLASS


    The java.applet package is the smallest package in the Java API. The Applet is
    contained in the java.applet package. Applet contains several methods that we
    gave detailed control over the execution of the applet. In addition, java.applet
    also define three interfaces: AppletContext, AppletStub, and AudioClip.


    All applets are subclasses of Applet. Thus, all applets must import java.applet.
    applets must also import java.awt. All applets run in a window, it is necessary
    to include support for window. Applets are not executed by the console-based Java
    run-time interpreter, they are executed by either a Web Browser or an applet viewer.


    The Applet contains a single default parameterless constructor, which is generally
    not used. Applets are constructed by the runtime environment when they are loaded
    and do not have to be explicitly constructed.


    Applet provides necessary support for applet execution, such as starting and stopping.
    It also provides methods that load and display images, and methods that load and
    play audio clips.


    # 10.4.1 Basic Methods of Applet Class


    void init():This method is called once by the browser or applet viewer when the
    applet is loaded into the system. It performs the initialization of an applet.


    void start(): This method is called after the init method completes execution
    and every time the user of the browser returns to the HTML on which the applet
    resides (after browsing to another HTML page).'
