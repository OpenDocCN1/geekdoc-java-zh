    \n# 12.8 LAYOUT MANAGER\n\nTo create layouts, we use layout managers. Layout managers\
    \ are one of the most difficult parts of modern GUI programming. It is not necessary\
    \ to use layout manager. But to create truly portable, complex applications, we\
    \ need layout managers. Without layout manager, we can place the components using\
    \ absolute values.\n\nThere are some common tasks associated to use layout managers:\n\
    \n- Setting layout manager\n- Adding components to a container\n- Providing size\
    \ and alignment hints\n- Putting space between components\n- Setting the container's\
    \ orientation\n- Tips on choosing a layout manager\n- Third-party layout managers\n\
    \nIn Java layout manager class implements the LayoutManager interface. It is used\
    \ to determine the position and size of components within a container. Components\
    \ can provide size and alignment hints, still the container's layout manager has\
    \ the final authority on the size and position of the components within the container.\n\
    \nFlowLayout: This is the simplest layout manager in the Java Swing toolkit. It\
    \ is mainly used in combination with other layout managers. When calculating its\
    \ children size, a flow layout lets each component assume its natural (preferred)\
    \ size.\n\nThe manager puts components into a row. In the order, they were added.\
    \ If they do not fit into one row, they go into the next one. The components can\
    \ be added from the left to the right or versa. The manager allows aligning the\
    \ components.\n\nGridLayout: The GridLayout layout manager lays out components\
    \ in a rectangular grid. The container is divided into equally sized rectangles.\
    \ One component is placed in each rectangle.\n\nBorderLayout : A BorderLayout\
    \ manager is a very handy layout manager. It divides the space into five regions.\
    \ North, West, South, East, and Centre. Each region can have only one component.\
    \ If we need to put more components into a region, we can simply put a panel with\
    \ a manager of our choice. The components in N, W, S, E regions get their preferred\
    \ size. The component in the centre takes up the whole space.\n\n# BoxLayout :\
    \ BoxLayout is a powerful manager that can be used to create sophisticated layouts.\
    \ This layout manager puts components into a row or into a column. In enables\
    \ nesting, a powerful feature, which makes this manager very flexible. It means\
    \ that we can put a box layout into another box layout.\n\n![](img/2b1351fdf3659b78e3b160b1f4f9bfd6_178_0.png)\n\
