  mdcn: "\n\n# Java 模块 1 (BCA) 单元-5 (证明 1)\n\n## 第 6 单元\n## 继承\n\n`final` 是一个不会且无法改变的常量。它可以被设置一次（例如在对象构造时，但之后不能再更改）。尝试更改它将产生编译时错误。\n\
    \n**final 参数：** 我们可以将方法参数声明为 `final`。这意味着该方法将不会直接修改这些参数。由于所有参数都是按值传递的，这并不是绝对要求的，但有时是有帮助的。\n\
    \n## 6.5 抽象类和方法\n\n**抽象类**是具有至少一个**抽象方法**的类。抽象类不能实例化。**抽象方法**在类中并没有实际实现。它仅仅是在类中进行声明。该方法的体体会在该类的子类中实现。Java\
    \ 允许通过 `abstract` 修饰符将声明的类和方法标记为抽象的。\n\n让我们考虑以下示例来演示抽象类和方法。程序 6.3 定义了一个抽象类 **Shape**\
    \ 和两个普通类 **Circle** 和 **Rectangle**。\n\n```java\n//Program 6.3 : 显示使用抽象类的程序\n\
    abstract class Shape                   //抽象类\n{\n    abstract double Area(); \
    \            //抽象方法\n    abstract double Circumference();   //抽象方法\n}\n//抽象类 Shape\
    \ 有两个抽象方法：Area() 和\n//Circumference()。作为抽象方法，它们仅通过\n//它们的原型进行声明。\nclass Circle\
