    # Introduction to JAVA


    # Unit 1


    "Java" in 1994 as the Web emerged. Then after Java was used as the basis for a
    Web browser, called WebRunner. WebRunner was successfully demonstrated, and the
    Java/HotJava project took off.


    ![](img/2b1351fdf3659b78e3b160b1f4f9bfd6_8_0.png)


    HotJava, Java, and the Java documentation and source code were made available
    over the Web, as an alpha version, in early 1995. Initially Java was hosted on
    SPARC Solaris, and then on Windows NT. In the fall of summer of 1995, Java Beta
    1 release was released through Sun''s Web site, and Java support was introduced
    in the Netscape 2.0 browser.


    HotJava : HotJava is a Web browser that is written in Java. HotJava is a Java-enabled
    browser. This means that Java can execute Java applets contained on Web. In order
    to accomplish this, HotJava calls the Java runtime system. Netscape 2.0 browser,
    like HotJava, is also contains a copy of the Java runtime system embedded within.


    The Java Beta 1 led scores of vendors to license Java technology, and Java portant
    efforts were initiated for all major operating systems.


    In 1995 the Java Beta 2 release was released, and JavaScript was announced by
    Sun and Netscape. Java''s success became inevitable, in early December, both Microsoft
    and IBM announced their intention to license Java technology.


    On January 23, 1996, Java 1.0 was officially released and made available for download
    over the Internet. JavaScript was also released. Netscape 2.0 now provides support
    for both Java and JavaScript.


    # 1. BASIC FEATURES OF JAVA


    The team has summed up the basic features of Java with the following list of buzzwords
    :


    +   Simple : Java was designed to be easy for the professional programmer to learn
    and use effectively. Assuming that you have some programming experience, you will
    not find Java to master. If you already understand the basic concepts of object-oriented
    programming, learning Java will be even easier. Best of all, if you are an experienced
    C++ programmer, moving to Java will require very little effort. Because Java inherits
    the C/C++ syntax and many of the object-oriented features of C++, most programmers
    have little trouble learning Java.'
