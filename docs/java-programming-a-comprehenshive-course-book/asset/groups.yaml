    \    }\n    double Area() //方法\n    {\n        return 3.14*radius*radius;\n  \
    \  }\n}\n```\n\n//Circle 类有一个字段、一个构造函数和两个方法。\n// 方法 Circumference() 和 Area() 实现了父类\
    \ Shape 中声明的\n//对应的抽象方法。\n\n```java\nclass Rectangle extends Shape//派生类 Rectangle\n\
    {\n    double length; // 用于指定长度的字段\n    double breadth; // 用于指定宽度的字段\n    Rectangle(double\
