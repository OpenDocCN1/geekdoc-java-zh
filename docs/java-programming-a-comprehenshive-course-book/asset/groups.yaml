    # 5.5 STRINGS


    Strings are sequence of characters. In Java, strings are objects of the class
    ''String''. The ''String'' and ''StringBuffer'' classes are standard class that
    comes with Java, and they are specifically designed for creating and processing
    strings. A sequence of characters separated by double quotes are called String
    constants. Java handles String constants in the same way that other computer languages
    handle normal strings. Objects of type String are immutable it means that once
    a String object is created, its contents cannot be altered.


    As String is a class, we can create an instance and object and give it a name.
    For example,


    String name;

    name = new String("KKHHSOU");


    Unlike in other classes, the explicit use of new to create an instance or object
    is optional for the String class. So, we can create a new String object in this
    way:


    String name;

    name = "KKHHSOU";


    or String name = "KKHHSOU";

    Once you have created a String object, you can use it anywhere where a string
    is allowed. For example, the following statement displays ''KKHHSOU'':


    ```

    System.out.println(name);

    We are already using the length method which is under the String class to get
    the length of an array. In case of finding the length of a string we can also
    use it. For example,

    int i = name.length();

    Java defines one operator for String objects: +. It is used to concatenate two
    strings.

    String myString = "I" + " like " + "Java";

    results in myString containing "I like Java.".

