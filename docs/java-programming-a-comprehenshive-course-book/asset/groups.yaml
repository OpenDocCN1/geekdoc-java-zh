    \n此外，还有异或运算符 `^`，它仅在两个操作数不同（一个真一个假，反之亦然）时返回真，否则返回假（即使两者都为真）。\n\n对于非，使用带有单个表达式参数的\
    \ `!` 符号。非表达式的值是表达式的取反；如果 `x` 为真，则 `!x` 为假。\n\n位位运算符：位位运算符用于对整数中的单个位进行操作。表 2.5\
    \ 总结了 JAVA 编程语言中的位位运算符。当操作数是布尔值时，位位与运算符 `&` 执行的操作与逻辑与 (`&&`) 相同。然而，它总是评估两个操作数，并在两者都为真时返回真。同样，当操作数是布尔值时，位位或运算符\
    \ `|` 执行的操作与逻辑或 (`||`) 相似。该运算符始终评估两个操作数，当至少有一个操作数为真时返回真。当操作数是数字时，`&` 和 `|` 执行位位操作。\n\
    \n| 运算符 | 含义 |\n|---|---|\n| & | 位位与 |\n| | | 位位或 |\n| ^ | 位位异或 |\n| << | 左移 |\n\
    | >> | 右移 |\n| >>> | 无符号位右移 |\n| ~ | 位取反 |\n| <= | 左移赋值 (x = x << y) |\n| >= |\
    \ 右移赋值 (x = x >> y) |\n| === | 无符号位右移赋值 (x = x >>> y) |\n| x&=y | 与赋值 (x = x &\
    \ y) |\n| x|=y | 或赋值 (x = x | y) |\n| x^=y | 异或赋值 (x = x ^ y) |\n\n"
