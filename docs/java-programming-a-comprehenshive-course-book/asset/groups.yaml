    # 3.3 CONTROL FLOW STATEMENTS


    When we write a program, we type statements into a file. Without control flow
    statements, the compiler executes these statements in the order they appear in
    the file from left to right, top to bottom in a sequence. We can use control flow
    statements in our programs to conditionally execute statements, to repeatedly
    execute a block of statements, and to otherwise change the normal, sequential
    flow of control.


    Flow control in Java uses similar syntax as in C and C++. The Java programming
    language provides several control flow statements, as listed :


    +   - Decision making : if, if-else, switch-case

    - Looping : while, do-while, for

    - Branching : break, continue, label, return


    # 3.3.1 Decision Making Statements


    While programming, we have a number of situations where we may have to change
    the order of execution based on certain conditions or decisions. This involves
    a kind of decision making to see whether a particular condition has occurred or
    not and then direct the computer to execute certain statements accordingly. The
    statements used to handle those situation are called decision statement.


    The if and if-else Statements : The if statement enables a program to selectively
    execute other statements, based on some criteria. The syntax of if (boolean_expression)
    is:


    ```

    if (boolean_expression)

    {

    statement-block;

    }

    ```'
  - "[PAGE 37]\n\n# statement;\n\nThe statement-block may be a single statement or\
    \ a group of statements. If the boolean-expression evaluates to true, then the\
    \ block of code inside the if statement will be executed. If not the first set\
    \ of code after the if statement(after the closing curly brace) will be executed.\
    \ For example,\n\n```\nif (percentage>=40)\n{\n    System.out.println(\"Pass\"\
    );\n}\n```\n\nIn this case, if percentage contains a value that is greater than\
    \ or equal to 40, the expression is true, and println() will execute. If percentage\
    \ contains a value less than 40, then the() method is bypassed. What if we want\
    \ to perform a different set of statements if the expression is false? We use\
    \ the else statement for that. The general syntax of if-else statement is:\n\n\
    ```\nif ( Boolean_expression )\nstatement; //executes when the expression is true\n\
    else\nstatement; //executes when the expression is false\n```\n\nLet us consider\
    \ the example with Pass or Fail depending on percentage of marks. i.e., if percentage\
    \ is equal to or more than 40 then the output should be Pass; otherwise Fail.\
    \ This can be done by using an if statement with an else statement. Here is the\
    \ segment of code:\n\n```\nif (percentage>=40)\n    System.out.println(\"Pass\"\
    );\nelse\n    System.out.println(\"Fail\");\n```\n\nWhen a series of decisions\
    \ are involved, we may have more than one if-else statements in nested form."
