    # Unit 2


    A shift operator performs bit manipulation on data by shifting the bits of its
    first operand right or left. For example if op1 and op2 are operands, then the
    statement


    ```

    op1 << op2;

    ```


    shift bits of op1 by distance op2; fills with zero on the right-hand side and
    op1 >> op2; shift bits of op1 right by distance op2; fills with highest (sign)
    bit by the left-hand side.


    ```

    op1 >>> op2;

    ```


    shift bits of op1 by distance op2; fills with zero bits on the left-hand side.
    Each operator shifts the bits of the left-hand operand by the number of positions
    indicated by the right-hand operand. The shift occurs in the direction indicated
    by the operator itself.


    For example, the statement 25 >> 1; shifts the bits of the number 25 is to the
    right by one. The binary representation of the number 25 is 11001. The result
    of the shift operation of 11001 shifted to the right by position is 1100, or 12
    in decimal.


