    # 7.3.2 User Defined Packages


    A user defined package is developed by programmers to simplify the task of the
    java programming to keep set of classes, interfaces and sub packages which are
    commonly used. If any class or interface is commonly used by many java programmer
    that class or interface must be placed in packages.


    Creating package is very easy, just include a package command as the first statement
    in a Java source file. The general form of the package statement is:


    ```

    package <package name>;

    ```


    The following statement creates a package called MyFirstPackage MyFirstPackage;


    To store packages Java use file system directories. For example, the .class files
    of any classes declare as part of MyPackage must be stored in a directory called
    MyPackage and directory name must match the package name exactly.


    We can create a hierarchy of packages. multilevel package statement is :


    ```

    pack1[pack2[pack3.....packn]].

    ```


    # 7.3.3 Creating Your Own Packages


    To create a package of classes, you have to follow three basic steps. They are
    explained below :


    a) Select a Package Name


    The first step is to give a name of the package. The name you choose for your
    package depends on how you are going to use those classes. Package name should
    be select in such a way that uniquely identifies your work.


    One convention for naming packages that has been recommended by Sun is to use
    your domain name with the elements reversed. So, for example, packages of sun
    would be referred to using the name com.sun.java rather than just java. By convention,
    package names tend to begin with a lowercase letter to distinguish them'
  - '[PAGE 120]


    from class names. Thus, for example, in the full name of the built-in String class,
    java.lang.String, it''s easier to separate the package name from the class name
    visually. This convention helps reduce conflicts.


    # b) Create the Directory Structure


    Step two in creating packages is to create a directory structure on your disk
    that matches the package name. If your package has just one name (mypackage),
    you''ll only have to create a directory for that one. If the package name has
    several parts, you have to create directories within directories. For the package
    name kkh.edu.csc.eng.assam, you''ll need to create an kkh directory and then create
    a edu directory inside kkh, an csc directory inside edu, and an assam directory
    inside eng. Your classes and source files can then go inside the inside directory.


    # c) Use package to Add Your Class to a Package


    The final step is putting your class inside packages is to add the package command
    to your source files. The package command says "this class goes inside this package,"
    and is used like this:


    ```

    package myclasses;

    package kkh.edu.csc.eng.assam;

    package java.awt;

    ```


    The single package command, if any, must be the first line of code in your source
    file, after any comments or blank lines and before any import.


    If your class does not have a package command in it, that class is contained in
    the default package and can be used by any other classes. But once you using packages,
    you should make sure all your classes belong to some package to reduce the chance
    of confusion about where your classes belong.


    # 7.4 UNDERSTANDING CLASSPATH


    Once you installed Java on your machine it is required to set the PATH'
  - '[PAGE 121]


    # Packages and Interfaces


    environment variable to run the executables (java.exe, javac exe and so on) from
    any location without having to type the full path of the command. For example
    :


    ```

    C:\java TestClass.java

    ```


    Otherwise you need to specify the full path every time you run it, as C:\Java\jdk
    17.0.0\bin\javac TestClass.java


    How does Java run-time system know to look for packages that we created? By default,
    the Java run-time system uses the current working directory as its starting point.
    Thus, if your package is in a subdirectory of the current directory, it will be
    found. Or you have to specify a directory path or paths by setting the CLASPATH.
    CLASPATH is an environment variable which is used by Java virtual machine to locate
    defined classes. Java compiler and JVM is used Classpath to determine the location
    of required file. Another option is to use the -classpath option with java and
    javac to specify the path to your classes. consider the following package


    Package MyPackage


    For a program to find MyPackage, one of the above three methods is true. The program
    can be executed from a directory immediately above MyPackage, or the CLASPATH
    must be set to include the path of MyPackage, or the -classpath option must specify
