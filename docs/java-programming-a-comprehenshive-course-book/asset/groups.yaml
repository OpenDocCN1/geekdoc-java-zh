    # JAVA 简介


    ## 第一单元


    “Java”随着 1994 年 Web 技术的兴起而诞生。随后，Java 被用作名为 WebRunner 的 Web 浏览器基础。WebRunner 的成功演示使得
    Java/HotJava 项目随之兴起。


    ![](img/2b1351fdf3659b78e3b160b1f4f9bfd6_8_0.png)


    1995 年初，HotJava、Java 以及 Java 的文档和源代码以 Alpha 版本的形式通过 Web 发布。最初，Java 托管在 SPARC Solaris
    上，随后迁移到 Windows NT 上。1995 年秋季，Java Beta 1 通过 Sun 网站发布，Netscape 2.0 浏览器也引入了对 Java
    支持。


    HotJava：HotJava 是一个用 Java 编写的 Web 浏览器。HotJava 是一个支持 Java 的浏览器。这意味着 Java 可以执行 Web
    上包含的 Java 小程序（applets）。为了实现这一点，HotJava 调用了 Java 运行时系统。Netscape 2.0 浏览器像 HotJava
    一样，内置了一个 Java 运行时系统的副本。


    Java Beta 1 的发布导致大量厂商许可了 Java 技术，并针对所有主流操作系统启动了 Java 可移植性工作。


    1995 年发布了 Java Beta 2，Sun 和 Netscape 宣布了 JavaScript。Java 的成功变得不可避免，12 月初，微软和 IBM
    均宣布了许可 Java 技术的意愿。


    1996 年 1 月 23 日，Java 1.0 正式发布并可在网上下载。JavaScript 也被发布。Netscape 2.0 现在同时支持 Java
    和 JavaScript。


    # 1. JAVA 的基本特性


    团队通过以下流行术语总结了 Java 的基本特性：


    - **简单 (Simple)**：Java 的设计目标是让专业程序员易于学习并有效使用。假设你具有某些编程经验，你会发现掌握 Java 并不。如果你已经理解了面向对象编程的基本概念，学习
    Java 将更加简单。最棒的是，如果你是一位经验 C++ 程序员，转向 Java 只需要花费极少的精力。因为 Java 继承了 C/C++ 的语法以及 C++
    的许多面向对象特性，大多数程序员在学习 Java 时都不会遇到太大困难。


    - **面向对象 (Object-oriented)**：Java 是一种真正的面向对象语言。Java 的许多面向对象概念继承自其基础语言 C++，但也借用了其他面向对象语言的许多概念。像大多数面向对象语言一样，Java
    包含了一组类库，提供了基本数据类型、系统输入输出能力以及其他实用函数。这些基础类是 Java 开发包（JDK）的一部分，该包还包含支持网络、常用 Internet
    协议和用户界面工具包函数的类。


    - **健壮 (Robust)**：Java 是一种健壮的语言。Web 的多平台环境对程序提出了极高要求，因为程序必须在各种系统中可靠地执行。因此，在 Java
    的设计中，创建健壮程序的能力被赋予高优先级。为了获得可靠性，Java 在几个领域限制了你的操作，迫使你在程序开发早期发现错误。同时，Java 让你无需担心许多最常见的编程错误原因。因为
    Java 是一种强类型语言，它会在编译时检查你的代码。然而，它在运行时检查你的代码。


    - **安全 (Secure)**：大多数用户不会从网上下载可执行程序，而下载的用户在执行前会扫描病毒。尽管如此，大多数用户仍然担心系统可能被病毒感染。除了病毒外，还有另一种必须防范的恶意程序。这类程序可以通过搜索你计算机本地文件系统的内容来收集隐私信息，如信用卡号、银行账户余额和密码。Java
    通过在网络应用程序和你的计算机之间提供一个“防火墙”回答了这两个忧虑。当你使用兼容 Java 的 Web 浏览器时，你可以安全地下载 Java 小程序，而不必担心病毒感染或恶意意图。Java
    通过将 Java 程序限制在 Java 执行环境中，并不允许其访问计算机的其他部分，实现了这种保护。


    - **多线程 (Multithreaded)**：Java 的设计是为了满足创建交互式网络程序的现实需求。为了实现这一点，Java 支持多线程编程，允许你同时执行多项任务。


    - **架构无关 (Architecture-neutral)**：Java 的设计是为了满足创建交互式网络程序的现实需求。为了实现这一点，Java 支持多线程编程，允许你同时执行多项任务。


    - **可移植 (Portable)**：除了架构无关之外，Java 代码是可移植的。开发者的目标是“编写一次，随处运行”。


    - **分布式 (Distributed)**：Java 是为分布式环境设计的，它处理 TCP/IP 协议。事实上，使用 URL 资源与访问文件没有区别。


    - **动态 (Dynamic)**：Java 程序带有大量的运行时信息，用于验证和解析。这使得以安全且高效的方式链接代码成为可能。


    # 1.5 C/C++ 与语言家族


    C 语言是为了满足通用系统编程需求而开发的。它很快被广泛领域并获得广泛认可。C++ 是一种高级过程化语言，具有许多低级特性。这些特性有助于它变得多功能且高效。然而，许多这些特性使其带有晦涩和难以维护的声。C++
    扩展了 C 语言以提供面向对象的特性。该语言与 C 兼容，两种语言的代码可以很容易地互相使用。


    # 1.6 Java 的平台独立性


    我们已经熟悉如何编译 C 或 C++ 程序。对于大多数编程语言，你要么编译程序要么解释程序以便在计算机上运行。Java 编程语言的独特之处在于程序既被编译又被解释。这意味着
    Java 结合了这些方法，成为了一个双阶段系统。


    所有的源代码首先编写在以 .java 结尾的纯文本文件中。那些源文件随后由 javac 编译器编译成 .class 文件。通过编译器，你首先将程序翻译成称为
    Java 字节码的中间代码。


    '
