    \ computer system and embed it into a web page. A remote applet that is developed\
    \ by someone else and stored on a remote computer (web) connected to the Internet.\
    \ In order to locate and load a remote applet, we must know the applets address\
    \ on the web. This address is known as the URL and must be specified in the applet's\
    \ HTML document as the value of the CODEBASE attribute.\n\nDrawing Shapes Example:\
    \ This program will see how to draw different types of shapes like line, circle\
    \ and rectangle. There are different types of methods in the Graphics class of\
