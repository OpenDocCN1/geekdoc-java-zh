  mdcn: "\n\nJava Block 1 (BCA) Unit-5 (证明 1)\n\n# 第 6 单元：继承\n\n# 单元结构\n\n- 6.1 学习目标\n\
    - 6.2 引言\n- 6.3 继承\n- 6.3.1 单继承\n- 6.3.2 多级继承\n- 6.4 Final 关键字\n- 6.5 抽象类与方法\n\
    - 6.6 静态成员\n- 6.7 总结\n- 6.8 扩展阅读\n- 6.9 进度检查答案\n- 6.10 题\n\n# 6.1 学习目标\n\n在学习完本单元后，你将能够：\n\
    \n- 定义 Java 中的继承\n- 描述 Java 中不同类型的继承\n- 描述抽象方法和抽象类\n- 描述静态成员\n\n# 6.2 引言\n\n在上一个单元中，我们学习了数组、字符串和向量的概念。本单元的重点是继承和抽象类。继承是一种机制，一个对象可以获取父对象的所有属性和行为。通过使用继承，我们可以创建基于现有类的新类。当我们继承一个现有的类时，我们可以重用父类的方法和数据成员，也可以添加新的方法和数据成员。本单元还详细涵盖了抽象类和静态成员的概念。这是该模块的最后一个单元。因此，在下一个模块中，我们将探索与包、Java\
    \ I/O、Applets 等更多内容相关的概念。\n\n# 6.3 继承\n\n可靠性是面向对象编程的重要特征之一，可以通过继承来实现。Java 支持继承的概念。通过使用继承，信息可以按照层次顺序变得易于管理。继承可以定义为一个对象获取另一个对象的属性的过程。当我们想要创建一个新类时，可以从现有类派生出新类。通过这样做，我们可以重用现有类的字段和方法，而无需重新编写它们。\n\
    \n从另一个类派生出的类被称为子类（也称为派生类、扩展类或子类）。子类继承其超类的所有成员（字段、方法和嵌套类）。子类所派生的那个类被称为超类（也称为基类或父类）。子类不能继承构造函数，但可以从子类中调用超类的构造函数。在\
    \ Java 中，继承是通过扩展过程实现的。要定义一个新类作为现有类的扩展，我们只需要在新类定义的头部使用 `extend` 子句。继承的概念被用于将事物从通用推向具体。\n\
    \n例如，当我们听到“vehicle”（车辆）这个词时，我们脑海中会出现一个形象，它从一个地方移动到另一个地方，用于旅行或运货，但这个词并没有指定它是两轮、三轮还是四轮，这是一个通用词。但“car”（汽车）这个词比\
    \ vehicle 提供了一个更具体的形象，即汽车有四个轮。这个例子说明 car 是具体的词，而 vehicle 是一般的。如果我们从技术角度考虑这个例子，vehicle\
    \ 是超类（或基类或父类），而 car 是子类，因为每辆汽车都具有其父类（在本例中为 vehicle）的特征。现在，我们将描述继承的类型。\n\n# 6.3.1\
    \ 单继承\n\n当子类从其父类派生出来时，这种机制被称为单继承。在单继承的情况下，只有一个子类及其父类。它也被称为单级继承。单继承的图示表示如图 6.1\
    \ 所示。\n\n![](img/2b1351fdf3659b78e3b160b1f4f9bfd6_101_0.png)\n\n图 6.1：单继承\n\n\
    例如，让我们考虑一个简单的示例来演示单继承：\n\n**程序 6.1**：显示单继承的程序\n\n```java\nclass A // 超类 A\n{\n\
    \    int x;\n    int y;\n    int getValue(int p, int q)\n    {\n        x = p;\n\
    \        y = q;\n        return(0);\n    }\n    void Show() {\n        System.out.println(x);\n\
    \    }\n}\nclass B extends A // 子类 B 继承了 A 的 getValue\n{\n    public static void\
    \ main(String args[]) {\n        A a = new A();\n        a.getValue(5,10);\n \
    \       a.Show();\n    }\n    void display() {\n        System.out.println(\"\
    I am in B\");\n    }\n}\n```\n\n输出将只显示 5。`getValue()` 和 `show()` 是超类 A 的成员。通过语句\
    \ `a.getValue(5,10);`，`getValue()` 是从类 A 继承的。由于类 A 的 `Show()` 方法只显示第一个参数，因此当在类\
    \ B 中通过语句 `a.Show()` 调用时，它只显示了一个值，尽管它接收了两个值 5 和 10。\n\n# 6.3.2 多级继承\n\n这是继承的增强。当子类从父类派生出来时，这种机制被称为多级继承。派生类对于其父类（父类）被称为子类或子类。多级继承可以达到任何层级。多级继承的图示表示如下：\n\
    \n![](img/2b1351fdf3659b78e3b160b1f4f9bfd6_102_0.png)\n\n图 6.2：多级继承\n\n```java\n\
    // 程序 6.2：显示多级继承的程序\nclass A\n{\n    int x;\n    int y;\n    int get(int p, int\
    \ q)\n    {\n        x = p;\n        y = q;\n        return(0);\n    }\n    void\
    \ show() {\n        System.out.println(x);\n    }\n}\nclass B extends A // 子类\
    \ B 继承自 A\n{\n    void Showb() {\n        System.out.println(\"I am in B\");\n\
    \    }\n}\nclass C extends B // 子类 C 继承自 B\n{\n    void Display() {\n        System.out.println(\"\
    I am in C\");\n    }\n    public static void main(String[] args) {\n        A\
    \ a = new A();\n        a.get(5,10);\n        a.show();\n    }\n}\n```\n\n上述程序的输出将是\
    \ 5。这里 a 是超类 A 的对象，它继承了 `get()` 和 `show()` 方法。子类 B 有方法 `Showb()`。类 C 是 B 的子类有一个方法\
    \ `Display()`。我们可以创建 B 和 C 类并使用这两个方法 `Showb()` 和 `Display()` 分显示“I am in B”和“I\
    \ am in C”。\n\n将多个基类的特征继承到单个类的机制被称为多重继承。Java 不支持多重继承。但多重继承可以通过在类中实现多个接口来实现。\n\n\
    # 6.4 Final 关键字\n\n`final` 关键字在不同的上下文中使用。下面描述了一些用法：\n\n- final 类：有时出于安全考虑，我们可能防止类被进一步派生。如果我们在类声明前面写\
    \ `final` 关键字，那么该类就不能被继承，也就是说无法从该类创建子类。如下所示：\n\n```java\nfinal class A // A 不能被进一步扩展\n\
    {\n//语句\n}\n```\n\n- final 方法：我们可以用 `final` 关键字声明方法。声明为 `final` 的方法不能在子类中重写。声明\
    \ final 方法的主要原因是保证它不会被更改。为此，我们必须在访问修符之后、返回类型之前放置 `final` 关键字，如下：\n\n```java\n\
    public final String convertText()\n{\n//语句\n}\n```\n\n- final 字段：我们还可以声明字段为 `final`。这与将方法或类声明为\
    \ `final` 不是一回事。当一个字段被声明为 `final` 时...\n\n"
