    # 10.6 THE LIFE CYCLE OF AN APPLET


    In this section we will learn about the lifecycle of an applet. Applet runs in
    the browser and its lifecycle method is called by JVM when it is loaded and destroyed.
    The lifecycle of an applet are:


    +   - init(): This method is called to initialize an applet

    - start(): This method is called after the initialization of the applet.

    - stop(): This method can be called multiple times in the life cycle of an applet.

    - destroy(): This method is called only once in the life cycle of the applet when
    applet is destroyed.


