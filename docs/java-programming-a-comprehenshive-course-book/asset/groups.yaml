    \ to Events\n- 10.8 Using Window Components\n- 10.9 Adding Audio and Animation\n\
    - 10.10 Let Us Sum Up\n- 10.11 Further Readings\n- 10.12 Answers to Check Your\
    \ Progress\n- 10.13 Model Questions\n\n## 10.1 LEARNING OBJECTIVES\n\nAfter going\
    \ through this unit, you will be able to:\n\n- write applets in Java\n- describe\
    \ the life cycle of applet\n- describe event handling\n- add windows components\
    \ to applets\n- add audio file as well as animation to applets.\n\n## 10.2 INTRODUCTION\n\
    \nIn the previous unit, we discussed the io package as well as the different stream\
    \ classes in Java. Besides these, we also presented how to read and write console\
    \ input/output and handle files in Java.\n\nToday internet has become an inevitable\
    \ part of life. It is used for accessing libraries, getting information on latest\
    \ happening, to transfer information formation, send email and communicate with\
    \ others. Java has become a prime language today in making web pages interactive\
    \ and user friendly. Java programs written to run on World Wide Web (WWW) are\
    \ known as applets.\n\nIn this unit we will learn how to write applets and how\
    \ to include them in web pages. The life cycle of applet will also be discussed\
    \ in this unit. It is possible to change the colors, font of the text, set different\
    \ background-colors for different applets and make them look more attractive.\
    \ In the next unit, we will learn about concepts related to AWT.\n\n## 10.3 APPLETS\
    \ AND THE WORLD WEB\n\nAn applet is a Java program that we can embed in a web\
    \ page. Java applications are run using a Java interpreter. Applets can run on\
    \ any browser that supports Java. Applet can also be tested using the applet viewer\
    \ included in the Java Development Kit. To run an applet it must be included in\
    \ a web page, using HTML tags. Java's bytecode is platform independent, Java applets\
    \ can be executed by browsers for many platforms, including Windows, Unix, Mac\
    \ OS and Linux. When a Java-enabled web browser views a page that contains an\
    \ applet, the applet's code is transferred to the clients system and executed\
    \ by the browser's Java Virtual Machine (JVM).\n\nAdvantages of Applet:\n\n- Applets\
    \ are cross platform and can run on Windows, Mac OS and Linux\n- Applets can work\
    \ all the version of Java Plug-in\n- Applets are supported by most web browsers\n\
    - Applets are cached in most web browsers, so will be quick to load when returning\
    \ to a web page.\n- User can also have full access to the machine if user allows.\n\
    \nDisadvantages of Applet:\n\n- Java plug-in is required to run applet.\n- Java\
    \ applet requires JVM so first time it takes significant startup time.\n- If applet\
    \ is not already cached in the machine, it will be downloaded from internet and\
    \ will take time.\n\nProgramming in Java (Block 2)\n\nIntroduction to Applets\n\
    \n- It is difficult to design and build good user interface in applets compared\
    \ to HTML technology.\n\n## 10.4 THE APPLET CLASS\n\nThe java.applet package is\
    \ the smallest package in the Java API. The Applet is contained in the java.applet\
    \ package. Applet contains several methods that we gave detailed control over\
    \ the execution of the applet. In addition, java.applet also define three interfaces:\
    \ AppletContext, AppletStub, and AudioClip.\n\nAll applets are subclasses of Applet.\
    \ Thus, all applets must import java.applet. applets must also import java.awt.\
    \ All applets run in a window, it is necessary to include support for window.\
    \ Applets are not executed by the console-based Java run-time interpreter, they\
    \ are executed by either a Web Browser or an applet viewer.\n\nThe Applet contains\
    \ a single default parameterless constructor, which is generally not used. Applets\
    \ are constructed by the runtime environment when they are loaded and do not have\
    \ to be explicitly constructed.\n\nApplet provides necessary support for applet\
    \ execution, such as starting and stopping. It also provides methods that load\
    \ and display images, and methods that load and play audio clips.\n\n### 10.4.1\
    \ Basic Methods of Applet Class\n\nvoid init(): This method is called once by\
    \ the browser or applet viewer when the applet is loaded into the system. It performs\
    \ the initialization of an applet.\n\nvoid start(): This method is called after\
    \ the init method completes execution and every time the user of the browser returns\
    \ to the HTML on which the applet resides (after browsing to another HTML page).\n\
    \nvoid paint(Graphics g): This method is called automatically every time the applet\
    \ needs to be repainted. For example, if the user of the browser covers the applet\
    \ with another open window on the screen.\n\nvoid stop(): This method is called\
    \ when the user leaves the HTML page containing the applet.\n\nvoid destroy():\
    \ This method is called when the applet is being removed from memory.\n\nvoid\
    \ play(URL url): If an audio clip is found at the location, it is played.\n\n\
    void resize(Dimension dim): Resizes the applet according to dim.\n\n## 10.5 APPLETS\
    \ AND HTML\n\nIn order to run applet, it is first necessary to have a web page.\
    \ The <Applet> tag supplies the name of the applet.\n\nSyntax:\n```html\n<APPLET\
    \ CODE=\"name of the class that extends java.applet\"\n      CODEBASE=\"path of\
    \ the class file\"\n      HEIGHT=\"maximum height of the applet, in pixels\"\n\
    \      WIDTH=\"maximum width of the applet, in pixels\"\n      VSPACE=\"vertical\
    \ space between the applet and the rest of HTML\"\n      HSPACE=\"horizontal space\
    \ between the applet and the rest of HTML\"\n      ALIGN=\"alignment of the applet\
    \ with respect to the rest of the page\"\n      ALT=\"alternate text to be displayed\
    \ if the browser cannot run the Java Applet\">\n    <PARAM NAME=\"parameter_name\"\
    \ value=\"value_of_parameter\">\n</APPLET>\n```\n"
