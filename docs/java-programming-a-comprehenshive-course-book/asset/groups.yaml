    # Introduction to JAVA


    Bytecodes are not machine instructions and therefore, in the second stage,

    Java interpreter generates machine code that can be directly executed by the machine
    that is running the Java program. The interpreter parses and runs each Java bytecode
    instruction on the computer. Compilation happens just once; interpretation occurs
    each time the program is executed.


    ![](img/2b1351fdf3659b78e3b160b1f4f9bfd6_12_0.png)


    # Figure 1.1 : A Java program first compiled and then interpreted


    Java bytecodes help make "write once, run anywhere" possible. You can compile
    your program into bytecodes on any platform that has a Java compiler. The bytecodes
    can then be run on any implementation of the Java Virtual Machine (JVM). That
    means as long as a computer has a Java VM, the same program written in the Java
    programming language can run on Windows 2000, a Unix workstation, or on an iMac,
    as shown in fig 1.2.


    Normally, when you compile a program written in C or C++ or in most other languages,
    the compiler translates your program into machine codes or processor instructions.
    These instructions are specific to the processor your computer is running—so,
    for example, if you compile your code on a Pentium system, the resulting program
    will run only on other Pentium systems. If you want to use the same program on
    another system you have to go back to your original source, get a compiler for
    that system, and recompile your code.


    > Java Virtual Machine (JVM) : Java compiler produces an intermediate code known
    as bytecode for a machine that does not exist. This machine is called the JVM
    and it exists only inside bytecode are also known as virtual machine code which
    are not the actual machine code. The actual machine codes are generated by the
    Java interpreter only.


