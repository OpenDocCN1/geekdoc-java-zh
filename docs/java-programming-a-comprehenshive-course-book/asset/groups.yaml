    CODEBASE : This is an optional attribute, that specifies the base URL of the applet
    code.


    HEIGHT AND WIDTH : These are required attributes that give the size in pixels
    of the applet display area.


    VSPACE AND HSPACE : These attributes are optional. VSPACE specifies the space,
    in pixels, above and below the applet. HSPACE specifies the space, in pixels,
    on each side of the applet.


    ALIGN : This is an optional attribute that specifies the alignment of the applet.
    The possible values are LEFT, RIGHT, TOP, BOTTOM, BASELINE, TEXTTOP, ABSMIDDLE
    AND ABSBOTTOM.


    ALT : This is also an optional attribute used to specify a short text message
    that should be displayed if the browser cannot run the Java Applet.


    PARAM NAME AND VALUE : the PARAM tag allows to specify applet specific arguments
