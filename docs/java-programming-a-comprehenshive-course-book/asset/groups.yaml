    Reusing Array Variables : You can use an array variable to reference different
    arrays at different points in your program. Suppose you have declared and defined
    the variable primes before:

    int[] primes = new int[10]; // Allocate an array of 10 integer elements

    This produces an array of 10 elements. Perhaps you want the array variable primes
    to refer to a larger array, with 50 elements. You would simply:

    primes = new int[50]; // Allocate an array of 50 integer elements

    Now the variable primes refer to a new array of values of type that is entirely
    separate from the original. When this statement is executed, the previous array
    of 10 elements is discarded, along with all the data values you may have stored
    in it. The variable primes can now only be used to reference elements of the new
    array.


