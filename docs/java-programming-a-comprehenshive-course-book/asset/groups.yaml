    \ 允许我们使用以下语法创建数组：\n\n```java\narrayname = new 类型[size];\n```\n\n例如，\n```java\n\
    sum = new int[4];\npercentage = new float[10];\nroll_number = new float[15];\n\
    primes = new int[10];\n```\n关键字 `new` 表示正在为数组分配新内存，`int[4]` 指定你想为数组中的 4 个 `int`\
    \ 类型变量提供容量。由于 `sum` 数组中的每个元素都是需要 4 字节的整数，整个数组将占用 16 字节，再加上 4 字节用于存储数组的引用。当像这样创建数组时，所有数组元素都被初始化为默认值。同样，对于\
    \ `percentage`、`roll_number` 和 `primes` 数组也会分配固定的大小。声明并创建的数组是一维数组，因为它的每个元素都是通过一个索引引用的。\n\
