    # 11.3 AWT BASICS


    AWT (Abstract Window Toolkit) is an API to develop GUI or window-based applications
    in java. It contains all classes to write the program that interface between the
    user and different windowing toolkits. We can use the AWT package to develop user
    interface objects like buttons, checkboxes, radio buttons and menus etc.The java.awt
    package provides classes for AWT api such as TextField, Label, TextArea, RadioButton,
    Checkbox, Choice, List.


    ![](img/2b1351fdf3659b78e3b160b1f4f9bfd6_162_0.png)'
  - '[PAGE 163]


    # Basic Terminologies:


    **Component**: Component is an object having a graphical representation that can
    be displayed on the screen and that can interact with the user like buttons, checkboxes,
    list etc.


    **Container**:Container object is a component in AWT that can contain one or more
    components like buttons, textfields, labels etc. The classes that extends Container
    class are known as container such as Frame, Dialog and Panel.


    **Window**: Window is a rectangular area which is displayed on the screen.A window
    must have either a frame, dialog or another window defined as its owner when it
    is constructed.


    **Panel**: The Panel is the container that doesn''t contain title bar and menu
    bars. Panel provides space in which an application can attach any other components,
    including other panels. It can have components like button, textField etc.


    **Frame**: Frame is the container that contain title bar,menu bar, borders, and
    resizing corners. It can have other components like button, textfield etc.


    # 11.4 AWT COMPONENTS


    In this section, we will learn about the different components available in the
    Java AWT package for developing user interface for our program. Following are
    some of the components of Java AWT:


    **Labels**: This is the simplest component of Java Abstract Window Toolkit. This
    component is generally used to show the text or string in our application label
    can never perform any type of action. Syntax for defining the label is:


    ```

    Label label_name = new Label ("This is the label text");

    ```


    Above code simply represents the text for the label.


    ```

    Label label_name = new Label ("This is the label text.");

    ```


    Label.CENTER); can be left, right or centered. Above declaration used the center
    justification of the label using the Label.CENTER'
  - '[PAGE 164]


    Buttons : This is the component of Java Abstract Window Toolkit and is used to
    trigger actions and other events required for our application. The syntax of defining
    the button is as follows:


    ```

    Button button_name = new Button("This is the label of the button.");

    ```


    We can change the Button''s label or get the label''s text by using the Button.setText(String)
    and Button.getLabel() method. Buttons are added to its container using the add
    (button_name) method.


    Check Boxes : This component of Java AWT allows us to create check boxes in our
    applications. The syntax for declaring a Checkbox is as follows:


    ```

    Checkbox checkbox_name = new Checkbox("Optional check box 1", false);

    ```


    Above code constructs the unchecked checkbox by passing the Boolean valued argument
    false with the checkbox label through the checkbox() constructor. Defined Checkbox
    is added to its container using add (checkbox_name) method. We can change and
    get the checkbox''s label using the setLabel (String) and getLabel() method. We
    can also set and get the state of the checkbox using the setState(boolean) and
    getState() method provided by the Checkbox class.


    Radio Button : This is the special case of the Checkbox component of Java AWT
    package. This is used as a group of checkboxes which group name is. Only one from
    a Checkbox Group can be selected at at. Syntax for creating radio buttons is as
    follows:


    ```

    CheckboxGroup chkgp = new CheckboxGroup();

    add (new Checkbox ("One", chkgp, false);

    add (new Checkbox ("Two", chkgp, false);

    add (new Checkbox ("Three", chkgp, false);

    ```


    In the code we are making three check boxes with the label "One", "Two" and "Three".
    If we mention more than one true valued for checkboxes then our program takes
    the last true and show the last check as checked.'
