    # 5.6 VECTORS


    You can consider a vector as an expandable array. Before using an array, you need
    to know the maximum number of elements in order to declare it. If the array is
    full and it requires to add another element, you need to declare a bigger one,
    copy all the elements and add that element.


    A vector hides all these things. a vector stores its elements also in an array
    but it will increase its capacity automatically to ensure all elements are stored
    before. So, use a vector when you don''t know the number of elements ahead of
    time. A vector is a standard class that resides in the java.util package.


    The key difference between arrays and vectors in Java is that vectors are dynamically-allocated.
    They are not declared to contain a type of variable; each vector stores a dynamic
    list of references or pointers to other objects. Since vector stores pointers
    to the objects, and not the objects themselves, these vector items could be any
    kind of object. We can add and delete objects from the list as when required.
