  md: 'necessary to use layout manager. But to create truly portable, complex applications,
    we need layout managers. Without layout manager, we can place the components using
    absolute values.


    There are some common tasks associated to use layout managers:


    +   * Setting layout manager

    * Adding components to a container

    * Providing size and alignment hints

    * Putting space between components

    * Setting the container''s orientation

    * Tips on choosing a layout manager

    * Third-party layout managers


    In Java layout manager class implements the LayoutManager interface. It is used
    to determine the position and size of components within a container. Components
    can provide size and alignment hints, still the container''s layout manager has
    the final authority on the size and position of the components within the container.


    FlowLayout: This is the simplest layout manager in the Java Swing toolkit. It
    is mainly used in combination with other layout managers. When calculating its
    children size, a flow layout lets each component assume its natural (preferred)
    size.


    The manager puts components into a row. In the order, they were added. If they
    do not fit into one row, they go into the next one. The components can be added
    from the left to the right or versa. The manager allows aligning the components.


    GridLayout: The GridLayout layout manager lays out components in a rectangular
    grid. The container is divided into equally sized rectangles. One component is
    placed in each rectangle.


    BorderLayout : A BorderLayout manager is a very handy layout manager. It divides
    the space into five regions. North, West, South, East, and Centre. Each region
    can have only one component. If we need to put more components into a region,
    we can simply put a panel with a manager of our choice. The components in N, W,
    S, E regions get their preferred size. The component in the centre takes up the
    whole space.'
