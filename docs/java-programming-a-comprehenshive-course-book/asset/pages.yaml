    +   - Identifier name must not begin with a digit.


    +   - Upper case and lowercase letters are distinct.


    +   - Blank space is not allowed in an identifier name.


    +   - They can be of any length.


    While writing Java programs, the following naming conventions should be followed
    by programmers :


    +   - All local and private variables use only lower-case letters. Underscore
    is used to combine words if required. For example, total_marks average


    +   - When more than one word are used in a name, the second and subsequent words
    are marked with a leading upper-case letter. For example, Date of Birth, Total
    Marks, Student Name


    +   - Names of all public methods and interface variables start with a lower-case
    letters. For example: total, average.


