  md: '# 4.2 INTRODUCTION


    We have already learnt the concepts of tokens, data types, variables, constants,
    decision and control statements, operators etc. along with types as they relate
    to Java language.


    Anything we wish to represent in a Java program must be encapsulated in a class.
    Classes are the building blocks of a Java application. In this unit, we will explore
    the object-oriented aspects of Java. We will learn about the concept of classes
    in Java, how to access class members, how to create instance of classes etc. Some
    other important concepts like super classes, constructors etc. are also covered
    in this unit. At the end of this unit, we will acquaint you with the concept of
    recursion. In the next unit, we will discuss arrays, strings and vectors.


    # 4.3 CLASS FUNDAMENTALS


    Classes provide a convenient way for grouping data items and functions. A class
    can basically contain data and methods or functions. In case of Java, the data
    items are termed as **fields** and the functions are termed as **methods**.


    **Class** serves as a blueprint for making class *instances*, which are runtime
    objects that implement the class structure. Thus, an **object** is defined to
    be an instance of a class. An object consists of data called *attributes* and
    methods called *behaviors*. An attribute is a feature of the object, something
    the object "has." A behavior is something the object "does".


    # 4.3.1 Declaring and Defining a Class


    A class in Java is declared using the **class** keyword. A source code file in
    Java can contain exactly one public class, and the name of the file must match
    the name of the public class with a . **java** extension.


    We can declare more than one class in a .java file, but at'
