  md: '# Java Block 2 (BCA) Unit-10 (Proof 1)


    Unit 10


    Introduction to Applets


    formation, send email and communicate with others. Java has become a prime language
    today in making web pages interactive and user friendly. Java programs written
    to run on World Wide Web (WWW) are known as applets.


    In this unit we will learn how to write applets and how to include them in web
    pages. The life cycle of applet will also be discussed in this unit. It is possible
    to change the colors, font of the text, set different background-colors for different
    applets and make them look more attractive. In the next unit, we will learn about
    concepts related to AWT.


    # 10.3 APPLETS AND THE WORLD WEB


    An applet is a Java program that we can embed in a web page. Java applications
    are run using a Java interpreter. Applets can run on any browser that supports
    Java. Applet can also be tested using the applet viewer included in the Java Development
    Kit. To run an applet it must be included in a web page, using HTML tags. Java''s
    bytecode is platform independent, Java applets can be executed by browsers for
    many platforms, including Windows, Unix, Mac OS and Linux. When a Java-enabled
    web browser views a page that contains an applet, the applet''s code is transferred
    to the clients system and executed by the browser''s Java Virtual Machine (JVM).


    Advantages of Applet:


    +   - Applets are cross platform and can run on Windows, Mac OS and Linux

    - Applets can work all the version of Java Plug-in

    - Applets are supported by most web browsers

    - Applets are cached in most web browsers, so will be quick to load when returning
    to a web page.

    - User can also have full access to the machine if user allows.


    Disadvantages of Applet:


    +   - Java plug-in is required to run applet.

    - Java applet requires JVM so first time it takes significant startup time.

    - If applet is not already cached in the machine, it will be downloaded from internet
    and will take time.


