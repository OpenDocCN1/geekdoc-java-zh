    # 8.2 INTRODUCTION


    In the previous unit, we have learnt about packages and interfaces. In this unit,
    we will explore the different concepts related to exception handling. Exception
    handling are related to errors. There are two types of errors in a computer program
    i.e., system error and logic errors. Syntax error causes due to typing mistake
    of the programmer. On the other hand, logic errors occur due to poor understanding
    of the problem in the language. Some logic errors can be controlled during the
    execution of a program.'
