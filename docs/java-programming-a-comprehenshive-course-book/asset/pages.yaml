    +   **static** : The modifier static is used to specify that a method is a class
    method. Without it, the method is an instant method. An instance method is a method
    that can be invoked only when it is bound to an object of the class. A class method
    (also called static method) is a method that is invoked without being bound to
    any specific object of the class.


    +   **final** : The modifier final has different role depending upon which kind
    of entity it modifies. If it modifies a class, it indicates that class cannot
    have subclasses. If it modifies a field or local variable, it means that the variable
    must be initialized and cannot be changed (i.e., it is a constant).


