  md: "# Java Block 1 (BCA) Unit-4 (Proof 1)\n\nUnit 4\n\nClass in Java\n\nOne of\
    \ the suitable examples of recursion is the computation of the factorial of a\
    \ number. The factorial of a number N is the product of all the numbers between\
