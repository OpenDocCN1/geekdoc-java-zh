  md: '# 2.5 CONSTANTS


    While a program is running, different values may be assigned to a variable at
    different times (thus the name *variable*, since the values it contains can vary),
    but in some cases we do not want this to happen. If we want a value to remain
    fixed, then we use a constant. **Constants** in Java refer to fixed values that
    do not change during the execution of a program. A constant is declared in a manner
    similar to a variable but with additional reserved word **final**. A constant
    must be assigned a value at the time of its declaration.

    Thus, the general syntax is:


    final type name = value ;


    Here''s an example of declaring some constants:

    final double PI = 3.14159;

    final int PASS_MARK = 200 ;


    Java supports several types of constants such as *integer constants, real constants,
    character constants, string constants, backlash constants*


    +   - **Integer constant**: An integer constant refers to a sequence of digits.
    For example, Decimal integer constants: 5, -5, 0, 254321

    Octal: 0, 025, 0125

    Hexadecimal: 0X2, 0X9F, Oct etc.


    +   - **Real constant**: Real or floating point constants are represented by numbers
    containing fractional parts. For example,

    .125, -25, 124.7, .8, 450.-85 etc.

    Exponential notation: 1.5e+4, 0.554e2.


    +   - **Character constant**: Character constant contains a single character enclosed
    within a pair of single quote marks. For example,

    ''1'', ''A'', ''c'', ''\'''', etc.


    +   - **String constant**: It is a sequence of characters enclosed between double
    quotes. Characters may be alphabets, digits, special characters, blank spaces.
    For example,

    "2018", "KKSHOU", "3+4", "Hello Java", "$5", "A"'
