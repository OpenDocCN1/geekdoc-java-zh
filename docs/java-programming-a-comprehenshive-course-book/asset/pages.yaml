  md: '# 7.3 PACKAGES


    classes. The benefits of organising classes into packages for reusability. Packages
    also provide a way for separating "design" from coding. Like a header file in
    C language packages are also required at the beginning of a Java program.


    Using interface you can achieve the concept of multiple inheritance in java as
    Java does not support multiple inheritance. In the next unit we will learn about
    exception handling.


    A package is a collection of classes, interfaces and sub-packages. That means,
    packages act as "containers" for classes. There are two types of packages in java,
    they are predefined or built-in or core packages and user custom packages.


    Let us see some of the features of packages :


    +   - Reusability: Reusability of code is one of the most important requirements
    in the software industry. Reusability saves time, effort and also ensures consistency.
    A class once developed can be used in any number of programs.

    - Easy to locate files.

    - In real life situation there may arise scenarios where we need to define files
    of the same name. This may lead to "name-space collisions". Packages are a way
    of avoiding "name-space collisions".


    # 7.3.1 Built-in Packages


    Built-in packages are those which are supplied as a part of JDK (Java Development
    Kit) to simplify the task of java programming. Core packages of java starts with
    java. For example: java.lang.*. We have nine predefined packages which are described
    in table 7.1.'
