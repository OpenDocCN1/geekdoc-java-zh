    that it moves from one place to another and that is used for traveling or carrying
    goods but the word does not specify whether it is two or three or four wheeled
    is a general word. But the word car makes a more specific image in mind than vehicle,
    that the car has four wheels. It includes from the example that car is a specific
    word and vehicle. If we think technically about this example then vehicle is the
    super class (or base class or parent class) and car is the subclass or child class
    because every car has the features of its parent (in this case vehicle) class.
