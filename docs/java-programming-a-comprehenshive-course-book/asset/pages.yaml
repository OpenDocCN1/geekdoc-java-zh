  md: '# Java Block 2 (BCA) Unit-10 (Proof 1)


    Unit 10 Introduction to Applets


    void paint(Graphics g):This method is called automatically every time the applet
    needs to be repainted. For example, if the user of the browser covers the applet
    with another open window on the screen, uncovers the applet, the paint method
    is called. (inherited from Container)


    void stop():This method is called by the browser or applet viewer when the applet
    should stop its execution, normally when the user of the browser leaves the HTML
    page on which the applet resides.


    void destroy():This method is called by the browser or applet viewer when the
    applet is being removed from memory, normally when the user of the browser exits
    the browsing session.


    void play(URL url): If an audio clip is found at the location specified by url,
    the clip is played.


    void resize(Dimension dim): Resizes the applet according to the dimensions specifiedby
    dim. Dimension is a class stored inside java.awt. It contains two integer fields:
    width and height.


    # # 10.5 APPLETS AND HTML


    In order to run a Java applet, it is first necessary to have a web page that refer
    to the applet. The <Applet> tag supplies the name of the applet to be loaded and
    tells the browser how much space the applet requires. Applet takes zero or more
    parameters.


    +   Syntax :

    <APPLET

    CODE="name of the class file that extends java.applet.Applet"

    CODEBASE="path of the class file" HEIGHT="maximum height of the applet, in pixels"

    WIDTH="maximum width of the applet, in pixels"

    VSPACE="vertical space between the applet and the rest of the HTML"

    HSPACE="horizontal space between the applet and the rest of the HTML"

    ALIGN="alignment of the applet with respect to the rest of the web page"'
