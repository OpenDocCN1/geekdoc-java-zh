  md: '# Swings


    # Unit 12


    An application reacts to different event types which are generated during its
    life. Events are generated mainly by the user of an application. But they can
    be generated by other means as well, e.g., internet connection, window manager,
    timer iter. In the event model, there are three participants:


    +   - event source

    - event object

    - event listener


    The event source is the object whose state changes. It generates events. The event
    object (Event) encapsulates the state changes in the event source. The object
    that wants to be notified. Event source object delegates the task of handling
    an event to the event listener. Event handling in Java Swing toolkit is very powerful
    and flexible. Java uses the following steps in event handling


    +   1. The user performed an activity and the event is generated.

    2. The object of concerned event class is created automatically and information
    about the source and the event generated within the same object.

    3. Event object is forwarded to the method of the registered listener class.

    4. The method is executed and returns.


    Table 12.2: Important event class and interface


    | Event Class | Description | Listener Interface |

    |---|---|---|

    | ActionEvent | Generated when button is pressed, menu-item is selected, ist-item
    is double clicked | ActionListener |

    | MouseEvent | generated when mouse is dragged, moved,clicked,pressed or released
    also when the enters or exit a component | MouseListener |

    | KeyEvent | generated when input is received from keyboard | KeyListener |


    Programming in Java (Block 2)


