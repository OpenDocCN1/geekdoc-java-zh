- pgno: 128
  md: 'Packages and Interfaces


    Unit 8


    Exception is a problem arises during execution of a Java program. The normal flow
    of the program is disrupted and the program is terminated. This is not recommended
    procedure in a programme or application. That is why exception need to be handled.
    There is a list of built in exception classes which is under Java''s standard
    package java.lang. Java also support defined exception handling classes which
    is discussed later this unit. In the next unit, we explore the different issues
    related to I/O in Java programming.


    # 8.3 EXCEPTION HANDLING FUNDAMENTALS


    During execution of a program (an event) arises. When an exception occurs the
    normal flow of the program is disrupted and the program or the application terminates
    abnormally, which is not recommended, therefore these exceptions need to be handled.
    An exception can occur for many different reasons. Some of the probable scenarios
    for an exception is given below


    +   - Divide by zero, accessing arrays of its bounds, running out of memory, overflow
    and under.

    - When a user entered an invalid data.

    - A file that needs to be opened but cannot be found.

    - A network connection has been lost in the middle of communications or the JVM
    has run out of memory.


    Some of these exceptions are caused by user error, by some programmer error, and
    others by physical resources that have failed in some manner.


    # 8.4 EXCEPTION TYPES


    There are three categories of exceptions. They are errors, compile exceptions
    and runtime exceptions.


    +   - Errors


    Some error are beyond the control of the programmer. Errors are typically ignored
    in the coding phase because the programmer cannot do anything coding. For example,
    if a stack overflow occurs, an error will arise. They are also ignored at the
    time of compilation. Some of the common errors are OutMemoryError and StackOverflowError.


    Programming in Java (Block 2)


