- pgno: 10
  md: '+   **Multithreaded**: Java was designed to meet the real-world requirement
    of creating interactive, networked programs. To accomplish this, Java supports
    multithreaded programming, which allows you to write programs that do many things
    simultaneously. The Java run-time system comes with an elegant yet sophisticated
    solution for multiprocess synchronization that enables you to construct smoothly
    running interactive systems.


    +   **Architecture-neutral**: A central issue for the Java designers was of code
    longevity and portability. One of the main problems facing programmers is that
    no guarantee exists that if you write a program today—even on the same machine.
    Operating system upgrades, processor upgrades, and changes in core system resources
    can all combine to make a program malfunction. Java designers made several hard
    decisions in the Java language and the Java Virtual Machine in an attempt to alter
    this situation. Their goal was “write once, run anywhere, any time, forever.”
    To a great extent, this goal was accomplished.


    +   **Portable**: In addition to being architecture-neutral, Java code is portable.
    It is an important design goal of Java.


    +   **Distributed**: Java is designed for the distributed environment in the Internet,
    because it handles TCP/IP protocols. In fact, accessing a resource using a URL
    is not much different from accessing a file. The original version of Java (Oak)
    included features for intra-address space messaging. This allowed objects on two
    different computers to execute procedures remotely. Java has recently revived
    these interfaces in a package called *Remote Method Invocation (RMI)*. This feature
    brings an unparalleled level of abstraction to client/server programming.


    +   **Dynamic**: Java programs carry with substantial amounts of run-time type
    information that is used to verify and resolve accesses at runtime. This makes
    it possible to dynamically link code in a safe and expedient manner. This is crucial
    to the robustness of the applet environment, in which small fragments of bytecode
    may be dynamically updated on a running system.'
  merge: -1
