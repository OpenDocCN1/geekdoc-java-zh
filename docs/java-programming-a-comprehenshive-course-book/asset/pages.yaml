  md: '# 1.5 C/C++ AND JAVA LANGUAGE FAMILY


    C was developed to meet general system programming needs. It was quickly adapted
    for general use and found widespread acceptance. C++ is a high-level procedural
    language that has many low-level features. These features help to make it versatile
    and efficient. However, many of these features give it a reputation for being
    cryptic and hard to maintain. C++ extends the C language to provide object-oriented
    features. The language is backward compatible with C, and code from the two languages
    can be used with each other with little difficulty. C++ has found quick acceptance
    and is supported by a number of pre-built specialized classes.


    Java can be considered the third generation of the C/C++ family. It is not backward
    compatible with C/C++ but was designed to be very similar to these languages.
    The creators of Java intentionally left out some of the features of C/C++ that
    have been problematic for programmers. Java is strongly object-oriented. In fact,
    one cannot create Java that is not object-oriented. Java’s portability is a key
    advantage and the reason why Java is used for Web development.


    # 1.6 PLATFORM INDEPENDENCE OF JAVA


    We are already familiar how to compile a C or C++ program. With most programming
    languages, you either compile or interpret a program so that you can run it on
    your computer. The Java programming language is unusual in that a program is both
    compiled and interpreted. It means - Java combines these approaches making Java
    a two-stage system. The Java development environment has two parts: a java compiler
    and a Java interpreter.


    Java combines these approaches making Java a two-stage system.


    Inall source code is first written in plain text files ending with the .java extension.
    Those source files are then compiled into .class files by the javac compiler.
    With the compiler, first you translate a program into an inter-mediate code called
    Java bytecode.'
  merge: -1
