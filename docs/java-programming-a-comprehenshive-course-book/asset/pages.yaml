  md: '# 1.8 INSTALLING THE JAVA SDK


    Java is a programming language that allows programs to be written that can be
    run on more than one type of operating system. A program written in Java can run
    on Windows, UNIX, Linux etc. as long as there is a Java runtime environment installed.


    For the first time, you just want to run Java programs, download the Java Runtime
    Environment, or JRE. Suppose, you want to develop applications for Java, download
    the Java Development Kit, or JDK. The JDK includes the JRE, so you do not have
    to download both separately.


    You can download the JDK from the Sun Microsystems, free of charge by using this
    URL http://www.sun.com/javase/downloads/index.jsp.


    The first download page should look like the top page in fig 1.3.


