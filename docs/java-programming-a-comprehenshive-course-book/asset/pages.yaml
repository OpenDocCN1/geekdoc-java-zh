    # 2.3 JAVA TOKENS


    The smallest individual units in a program are known as tokens. A

    Java program is basically a collection of tokens. There are five types of

    tokens in Java language. They are: Keywords, Identifiers, Literals,

    Operators and Separators.


    +   * Keywords : Keywords are some reserved words which have some

    definite meaning. Java language has 60 reserved words as

    keywords. They cannot be used as variable name and they are written

    in-case letter. Since Java is case-sensitive, one can use these

    word as identifiers by changing one or more letters to upper-case.

    But generally it should be avoided. Java does not use many keywords

    of C/C++ language but it has some new keywords which are not

    present in C/C++. A list of Java keywords are given table 2.1.


    Table 2.1 : Java Keywords


    | abstract | boolean | break | byte | byvalue |

    | case | cast | char | class |

    | const | continue | default | do | double |

    | else | extends | false | final | finally |

    | float | for | future | generic | goto |

    | if | implements | import | inner | instanceof |

    | int | interface | long | native | new |'
