    \ Java, the break statements have two forms: unlabelled and labelled. We have\
    \ seen the unlabelled form of the break statement used with switch earlier. As\
    \ noted, an unlabelled break terminates the enclosing switch statement, and the\
    \ flow of control transfers to the statement immediately following the switch.\
    \ It can be used to terminate a for, while, or do-while loop. A break (unlabelled)\
    \ form, causes an immediate jump out of a loop to the first statement after its\
    \ end. When the break statement is encountered inside a loop, the loop is immediately\
    \ exited and the program continues with the statement immediately following the\
    \ loop. When the loop is nested, the break would only exit the loop containing\
    \ it. This means, the break will exit only a single loop."
