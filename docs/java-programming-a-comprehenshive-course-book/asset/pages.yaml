  md: '# BLOCK INTRODUCTION


    This is the second block of the course ‘Programming in Java’. After completing
    this block, learners will be able to write Java programs using different packages
    and interfaces. Learners will also be able to write Java programs using Applets,
    AWT and Swings.


    This block comprises the following six units :


    +   - Unit - 7 introduces us to packages and interfaces. Concepts like defining
    and importing packages are covered in this unit. The unit also gives an introduction
    to defining interfaces and how to apply interfaces.


    +   - Unit - 8 introduces us to exception handling. Topics like build in exception
    and user defined exception classes are discussed in this unit.


    +   - Unit - 9 describes different I/O streams in Java. Reading console input,
    writing console output along with reading and writing files are covered in this
    unit.


    +   - Unit - 10 introduces us to Java applets. Topics like applet class, life
    cycle of an applet, adding audio and responding to events are described in this
    unit.


    +   - Unit - 11 deals with AWT in Java. AWT basic and components along with event
    handling are discussed in this unit. Application and menus are also covered in
    this unit.


    +   - Unit - 12 gives us an introduction to swings. Concepts related to swing
    components and displaying text and images in window along with layout manager
    are described in this unit.'
