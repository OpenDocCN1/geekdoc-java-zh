  md: '# I/O In Java


    stream, byte, and character. In Java 1.0, the only way to perform console input
    was to use a byte stream. The preferred method of reading console input for Java
    2 is use a character oriented stream, which makes the program easier to internationalize
    and maintain.


    Java provides a number of classes and methods that allow to read and write files.
    In Java files are byte oriented, and Java provides method to read and write bytes
    from to a file.


    # 9.3 I/O BASICS : STREAMS


    A stream can be defined as a sequence of data. There are two kinds of Streams.


    InputStream - The InputStream is used to read data from a source.


    OutputStream - The OutputStream is used for writing data to a destination.


    | Source | Program | Destination |

    |---|---|---|


    **Figure 9.1:Data flow in Java Program**


    Java views each file as a sequential stream of bytes. Each operating system provides
    a mechanism to determine the end of a file, such as an end-of-file marker or count
    of the total bytes in the file that is recorded in a system-maintained administrative
    data structure.


    | 0 | 1 | 2 | 3 | 4 | ... | n-1 |

    |---|---|---|---|---|---|-|

    | | | | | | | End-of-file-marker |


    **Figure 9.2: Java''s view of a file**


    A Java program process a stream of bytes after receiving an indication from the
    operating system that the end of the stream reaches. the program does not need
    to know how the underlying platform represents files or streams.Now, we will discuss
    some notion of streams.


    **Byte streams:** Programs use byte streams to perform input and output of 8-bit
    bytes.


    **Character streams:** Java character streams are used to perform input and output
    for 16-bit unicode.'
