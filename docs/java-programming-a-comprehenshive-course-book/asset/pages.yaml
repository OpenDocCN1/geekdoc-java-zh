  md: '# 3.3 CONTROL FLOW STATEMENTS


    When we write a program, we type statements into a file. Without control flow
    statements, the compiler executes these statements in the order they appear in
    the file from left to right, top to bottom in a sequence. We can use control flow
    statements in our programs to conditionally execute statements, to repeatedly
    execute a block of statements, and to otherwise change the normal, sequential
    flow of control.


    Flow control in Java uses similar syntax as in C and C++. The Java programming
    language provides several control flow statements, as listed :


    +   - Decision making : if, if-else, switch-case

    - Looping : while, do-while, for

    - Branching : break, continue, label, return


    # 3.3.1 Decision Making Statements


    While programming, we have a number of situations where we may have to change
    the order of execution based on certain conditions or decisions. This involves
    a kind of decision making to see whether a particular condition has occurred or
    not and then direct the computer to execute certain statements accordingly. The
    statements used to handle those situation are called decision statement.


    The if and if-else Statements : The if statement enables a program to selectively
    execute other statements, based on some criteria. The syntax of if (boolean_expression)
    is:


    ```

    if (boolean_expression)

    {

    statement-block;

    }

    ```'
