  md: "# Java Block 1 (BCA) Unit-4 (Proof 1)\n\nUnit 4\n\nPassing variables by value\
    \ affords the programmer some safety.\nMethods cannot unintentionally modify a\
    \ variable that is outside of its scope. However, we often want a method to be\
    \ able to modify one or more of its arguments. In the passValue method, the caller\
    \ wants the method to change the value through its arguments. However, the method\
    \ cannot modify its arguments, and furthermore, a method can only return one value\
    \ through its return value. So, it is necessary to learn how a method can return\
    \ more than one value, or have an effect (modify some value) outside of its scope.\n\
    \nTo allow a method to modify an argument, we must pass in an object. Objects\
    \ in Java are also passed by value; however, the value of an object is a reference.\
    \ So the effect is that the object is passed by reference. When passing an argument\
    \ by reference, the method gets a reference to the object. A reference to an object\
    \ is the address of the object in memory. Now, the local variable within the method\
    \ refers to the same memory location as the variable within the caller.\n\nFor\
    \ example, if a parameter to a method is an object reference. We can manipulate\
    \ the object in any way, but we cannot make the reference refer to a different\
    \ object.\n\n```\n//Program 4.7 : Record.java (demonstration of passing object\
