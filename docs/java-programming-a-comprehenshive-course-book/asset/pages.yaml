    # 7.5 IMPORTING PACKAGES


    Classes within packages must be fully qualified with their package name or names,
    it could become tedious to type the dot-separated package path name for every
    class you want to use. For this reason, Java includes the import statement to
    bring certain classes, or entire packages, into visibility. Once imported, a class
    can be referred to directly, using only its name.


    The import keyword is used to import built-in and user-defined packages into java
    source file. This will allow your class refer to a class that is in another package
    by directly using its name.


    > Syntax : import pack1 [.pack2 [..packn]].*;


    For example:


    +   1. import p1.*;

    2. import p1.p2.*;

    3. import p1.p2.p3.*;


    When statement 1 is executing we can import or access all the classes and interfaces
    of package p1 but not its sub packages p2 and p3 classes and interfaces.


    When statement 2 is executing we can import all the classes and interfaces of
    package p2 but not p1 and p3 classes and interfaces.


    When statement 3 is executing we can import all the classes and interfaces of
    package p3 but not p1 and p2 classes and interfaces.'
