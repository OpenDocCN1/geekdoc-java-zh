- pgno: 7
  md: '# Introduction to JAVA


    transformed the online world. Through a system of hypertext, users of the Web
    were able to select and view information from all over the world. However, while
    this system of hypertext gave users a high degree of selectivity over the information
    they chose to view, their level of interactivity with that information was low.
    Moreover, the Web lacked true interactivity—real-time, dynamic, and visual interaction
    between the user and application.


    Sun Microsystems, a company best known for its high-end Unix workstations, developed
    a programming language named Java to create software that can run on many different
    kinds of devices. Java language was designed to be small, simple, and portable
    across operating systems, both at the source and at the binary level.


    Java brings this missing interactivity to the Web. With a Java-enabled browser,
    it is possible to encounter animations and interactive applications. Java programmers
    can make customized media formats and information protocols that can be displayed
    in any Java-enabled browser. Java''s features enrich the communication, information,
    and interaction on the Web by enabling users to distribute executable content—rather
    than just HTML pages and multimedia files—to users. This ability to distribute
    executable content is the power of Java.


    In this unit, we will introduce you to the Java programming language. We will
    discuss the basic features of Java and how to install the Java Development Kit.
    We will also discuss how to write a Java program and the procedure for compiling
    and running a Java program.


    # 1.3 OVERVIEW OF JAVA


    Java was conceived by James Gosling, Patrick Naughton, Chris Warth, Ed Frank,
    and Mike Sheridan at Sun Microsystems, in 1991. It took 18 months to develop the
    first working version. Java began with the goal of creating a platform-independent
    language and operating system for consumer electronics. The original intent was
    to use C++, but as work progressed in this direction, the Java developers realized
    that they would be better served by creating their own language rather than extending
    C++. This language was initially called "Oak" but was renamed'
