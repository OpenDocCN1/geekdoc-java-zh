  md: "# 4.8MODIFIERS\n\nModifiers are keywords that are used to those definitions\
    \ to change meaning. To use a modifier, we include its keyword in the definition\
    \ of a class, method, or variable etc. The Java language has a wide variety of\
    \ modifiers as listed in Table 4.1.\n\nSome of the modifiers listed in the Table\
    \ 4.1 are used to set access levels in the declaration of classes, fields, methods,\
    \ constrctors and local variables etc. These are termed as access control modifiers\
    \ which include :\n\n+   **private**: (Visible to the class only)\n* **public**:\
    \ (Visible to all)\n* **protected**: (Visible to the package and all subclasses.)\n\
    \nIf none of these three is specified, i.e., the default, which means (class,\
    \ field, constructor or method) has package access, which means it can be accessed\
    \ from any class in the same package.\n\n+   **private**: Private access modifier\
    \ is the most restrictive access level. Variables, methods and constructors that\
    \ are declared private can only be accessed within the declared class itself.\
    \ Class and interfaces cannot be private.\n* **public**: A class, method, constructor,\
    \ interface etc: declared public can be accessed from any other class. Therefore,\
    \ methods, blocks declared inside a public class can be accessed from any other\
    \ class. However, if the public class we are trying to access is in a different\
    \ package, the public class still need to be imported. Because of class inheritance,\
    \ all public methods and variables of a class are inherited by its subclasses.\
    \ For example, The main() method of an application has to be public. Otherwise,\
    \ it could not be called by a java interpreter (such as java) to run the class.\
    \ Thus we write:\n\n```\npublic static void main(String[] arguments)\n{\n    //\
    \ statements\n}\n```"
