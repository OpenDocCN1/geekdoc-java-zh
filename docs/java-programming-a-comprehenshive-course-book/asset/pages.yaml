    # 6.3  INHERITANCE


    Reability is one of the important feature of object-oriented-programming and it
    can be achieved through inheritance. Java supports the concepts of inheritance.
    With the use of inheritance the information is made manageable in a hierarchical
    order. Inheritance can be defined as the process where one object acquires the
    properties of another. When we want to create a new class we can derive the new
    class from the existing class. In doing this, we can reuse the fields and methods
    of the existing class without rewriting them again.


    A class that is derived from another is called a subclass (also a derived class,
    extended class, or child class). A subclass inherits all the members (fields,
    methods, and nested classes) from its superclass. The class from which the subclass
    is derived is called a superclass (also a base class or a parent class). Constructors
    cannot be inherited by subclasses, but the constructor of the superclass can be
    invoked from the subclass. In Java, inheritance is implemented by the process
    of extension. To define a new class as an extension of an existing class, we simply
    use an extend clause in the header of the new classes definition. The concept
    of inheritance is used to make the things from general to more specific.


