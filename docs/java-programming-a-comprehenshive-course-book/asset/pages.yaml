    +   * Exception Hierarchy


    All exception classes are subclasses of the built-in class Throwable. Other than
    the exception class there is another subclass Error which is derived from the
    Throwable class. As discussed above, errors are abnormal conditions that happen
    in case of severe failures, these are not handled by the Java programs. Some of
    the Errors are OutOfMemoryError and StackOverflowError.


    This classes is used for exceptional conditions that user programs should catch.
    There is another subclass of Exception, called RuntimeException. Exceptions of
    this type are automatically defined for the programs that you write and include
    things such as division by zero and invalid array indexing.


    Checked Exceptions are exceptional scenarios that we can anticipate in a program
    and to recover from it, for example FileNotFoundException. We should catch this
    exception and provide useful message to user and log it properly for debugging
    purpose. Exception is the parent class of all Checked Exceptions and if we are
    throwing a checked exception, we must catch it in the same method or we have to
    propagate it to the caller using throws keyword. Figure 8.1 shows the hierarchy
    of exception.


