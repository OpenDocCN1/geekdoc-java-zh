  md: '# COURSE INTRODUCTION


    Since computers cannot understand human languages, programming languages are designed
    for this purpose. Java is a high-level programming language originally developed
    by Sun Microsystems by James Gosling and released in 1995. Java was originally
    developed by Sun Microsystems and released in 1995 as a core component of Sun
    Microsystems’ Java platform. The language derives much of its syntax from C and
    C++. Having prerequisite knowledge of C and C++ programming languages helps get
    a much quicker understanding of Java.


    Java runs on a variety of platforms, such as Windows, Mac OS, and the various
    versions of UNIX. This course introduces its objective to introduce the learners
    to the Java programming language and enable them to apply these concepts for solving
    problems. Programming is a skill best developed by rigorous practice. So, time
    needs to be devoted for better understanding of this course.


    This book is divided into two blocks :


    +   Block 1 deals with the fundamental concept of Java programming language like
    data types, operators, decision making statements like If, If-else, switch, break,
    continue etc. Class and Arrays are also covered in this block. Concepts like inheritance
    and polymorphism are also covered in this block.


    +   Block 2 concentrates on some of the most important concepts of Java programming
    language packages and interfaces. Applets, AWT and swings are also discussed in
    this block. Exception handling and I/O are also discussed in this block.


    Each unit of these blocks includes along-side boxes to help you know some of the
    difficult, unseen terms. Some “EXERCISES” have been included to help you apply
    your thoughts. You may find boxes marked with: “LET US KNOW”. These boxes will
    provide you with some interesting and relevant information. Again, you will get
    “CHECK YOUR PROGRESS” questions. These have been designed to self-check your progress
    of study. It will be helpful if you solve the problems put in these boxes immediately
    after you go through the sections of the units and match your answers with “ANSWERS
    TO CHECK YOUR PROGRESS” given at the end of each unit.'
  merge: -1
  img_proc: true
- pgno: 4
  md: '# BLOCK INTRODUCTION


    This is the first block of the course ‘Programming in Java’. After completing
    this block, learners will be able to write basic Java programs using various decision
    control statements and also using concepts like inheritances and polymorphism.


    This block comprises the following six units :


    +   **Unit - 1** gives us an overview of Java. A comparison of Java with C programming
    language is also provided in this unit. The unit also gives an introduction to
    Java applets and Java script.


    +   **Unit - 2** introduces us to Java programming basics. Concepts like data
    types, class libraries, variables and operators are discussed in this unit.


    +   **Unit - 3** describes different decision and control statements. Different
    types of decision statements if, if-else, switch, for, while and do-while are
    discussed in this unit.


    +   **Unit - 4** introduces us to class fundamentals like class, accessing class
    members etc. declaring objects, passing arguments to methods etc are described
    in this unit.


    +   **Unit - 5** deals with arrays, strings and vectors. Different topics like
    creating and initializing arrays, string arrays are discussed in this unit. Vectors
    along with constructors and copy constructors are also covered in this unit.


    +   **Unit - 6** gives us an introduction to inheritance and polymorphism. Different
    types of inheritances with concept of polymorphism are described in this unit.'
