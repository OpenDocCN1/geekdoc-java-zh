    is the variable''s scope. The variable''s scope is determined implicitly by the
    location of the variable declaration, that is, where the declaration appears in
    relation to other code elements. We will learn more about the scope of Java variables
    in this section.


    Java variables are categorized into three groups according to their scope. These
    are: local variable, instance variable and class variable.


    +   - Local variables are variables which are declared and used inside methods.Outside
    the method definition they are not available for use and so they are called local
    variables. Local variables can also be declared inside program blocks that are
    defined between an opening { and a closing brace }. These variables are visible
    to the program only.


    +   - Instance variables are created when the class objects are instantiated.
    They can take different values for each object.


    +   - Class variables are global to a class and belong to the entire set of object
    that class creates. Only one memory location is reserved for each class variable.
    Instance and class variables are declared inside a class.


