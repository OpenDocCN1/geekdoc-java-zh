  md: 'Buttons : This is the component of Java Abstract Window Toolkit and is used
    to trigger actions and other events required for our application. The syntax of
    defining the button is as follows:


    ```

    Button button_name = new Button("This is the label of the button.");

    ```


    We can change the Button''s label or get the label''s text by using the Button.setText(String)
    and Button.getLabel() method. Buttons are added to its container using the add
    (button_name) method.


    Check Boxes : This component of Java AWT allows us to create check boxes in our
    applications. The syntax for declaring a Checkbox is as follows:


    ```

    Checkbox checkbox_name = new Checkbox("Optional check box 1", false);

    ```


    Above code constructs the unchecked checkbox by passing the Boolean valued argument
    false with the checkbox label through the checkbox() constructor. Defined Checkbox
    is added to its container using add (checkbox_name) method. We can change and
    get the checkbox''s label using the setLabel (String) and getLabel() method. We
    can also set and get the state of the checkbox using the setState(boolean) and
    getState() method provided by the Checkbox class.


    Radio Button : This is the special case of the Checkbox component of Java AWT
    package. This is used as a group of checkboxes which group name is. Only one from
    a Checkbox Group can be selected at at. Syntax for creating radio buttons is as
    follows:


    ```

    CheckboxGroup chkgp = new CheckboxGroup();

    add (new Checkbox ("One", chkgp, false);

    add (new Checkbox ("Two", chkgp, false);

    add (new Checkbox ("Three", chkgp, false);

    ```


    In the code we are making three check boxes with the label "One", "Two" and "Three".
    If we mention more than one true valued for checkboxes then our program takes
    the last true and show the last check as checked.'
