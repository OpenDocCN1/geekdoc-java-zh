  md: '# Java Block 1 (BCA) Unit-10 (Proof 1)


    Loading the Applet: As a result of the applet being loaded, you should see the
    text "initializing... starting...". When an applet is loaded, here''s what happens:


    +   - An instance of the applet''s controlling class (an Applet subclass) is created.

    - The applet initializes itself.

    - The app starts running.


    Leaving and Returning to the Applet''s Page : When the user leaves the page, for
    example, to another page, the browser stops and destroys the applet. The state
    of the applet is not preserved. When the user returns to the page, the browser
    inialize and starts a new instance of the applet.


    Reloading the Applet : When you refresh or reload a browser page, the current
    instance of the applet is stopped and destroyed and a new instance is created.


    Quitting the browser : When the user quits the browser, the applet has the opportunity
    to stop itself and perform a final cleanup before the browser exits.


