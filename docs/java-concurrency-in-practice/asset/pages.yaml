  md: '# 6BPart III: Liveness, Performance, and Testing - 24Chapter12. Testing Concurrent
    Programs


    Sleeping while waiting for a lock. Calling sleep with a lock can prevent other
    threads from making progress for a long time and is therefore a potentially serious
    liveness hazard. Calling.wait or condition.await with two locks holds a similar
    hazard.


    Spin locks do not nothing (spin wait) checking for an expected value can waste
    CPU time and, if the field is not volatile, it is not guaranteed to change. Latches
    or condition waits are often a better technique when waiting for a state transition
    to occur.


    # 12.4.3. Aspect-Oriented Testing Techniques


    As of this writing, aspect-oriented programming (AOP) techniques have only limited
    applicability to concurrency, because most AOP tools do not support points at
    synchronization points. However, AOP can be used to insert invariants or aspects
    of compliance with synchronization policies. For example, (Ladd, 2003) provides
    an example of using aspect to wrap all locks to non-thread-safe Swing methods
    with the assertion that the lock is occurring in the event. As it requires no
    code changes, this technique is easy to apply and can disclose publication and
    thread-conflict errors.


    # 12.4.4. Profilers and Monitoring Tools


    Most commercial profiling tools have some support for threads. They vary in feature
    and effectiveness, but can often provide insight into what your program is doing
    (although profiling tools are usually intrusive and can affect performance timing
    and debugging). Most offer a displaying timeline for thread with different colors
    for the various states (runnable, blocked waiting for a lock, blocked waiting
    for IO, etc.). Such a display can show how effectively your program is using the
    available CPU resources, and if it is doing badly, where to look for the cause.
    (Profilers also offer features for identifying which locks are causing contention,
    but in practice these features are often a blunt instrument than is desired for
    analyzing a program''s locking behavior.)


    The built-in JVM agent also offers some limited features for monitoring thread
    behavior. The ThreadInfo class includes the thread''s current state and, if the
    thread is blocked, the lock or condition queue on it is blocked. If the "thread
    contention monitoring" feature is enabled (it is disabled by default because of
    its performance impact), ThreadInfo includes the number of times that the thread
    has blocked waiting for a lock or notification, and the cumulative amount of time
    it has spent waiting.


    # Summary


    Testing concurrent programs for correctness can be extremely challenging because
    many of the possible failure modes of concurrent programs are low-probability
    events that are sensitive to timing, load, and other hard-to-reproduce conditions.
    Furthermore, the testing infrastructure can introduce additional synchronization
    or timing constraints that can make concurrency problems in the code being tested.
    Testing concurrent programs for performance can be equally challenging; Java programs
    are more difficult to test programs written in statically compiled languages like
    C, because time measurements can be affected by dynamic compilation, garbage collection,
    and adaptive optimization.


    To have the best chance of finding latent bugs before they occur in production,
    combine traditional testing techniques (being careful to avoid the pitfalls here)
    with code reviews and automated analysis tools. Each of these techniques finds
    problems that others are likely to miss.'
