    ```\n```\n\n# 12.1. Testing Safety\n\nThe tests in 12.2 and 12.3 test properties\
    \ of the buffer, but are unlikely to disclose errors stemming from data races.\
    \ To test a concurrent class performs correctly under unpredictable access, we\
    \ need to set up multiple threads performing put and take operations over some\
    \ amount of time and then test that nothing went wrong.\n\nConstructing tests\
    \ to disclose safety errors in concurrent classes is a chicken-and-egg problem:\
    \ the tests themselves are concurrent programs. Developing good concurrent tests\
    \ can be more difficult than developing the classes they test.\n\n> The challenge\
    \ of constructing effective safety tests for concurrent classes is identifying\
    \ easily checked properties that, with high probability, fail if something goes\
    \ wrong, at the same time letting the failing-auditing code run concurrently.\
    \ It is best checking if the property does not require synchronization.\n\nOne\
    \ approach that works with classes used in producer-consumer designs (like BoundedBuffer)\
    \ is to check that everything put into a queue or buffer comes out of it, and\
    \ that nothing else does. A naive implementation of this approach would insert\
    \ the element into a \"shadow\" list when it is on the queue, remove it from the\
    \ list when it is removed from the queue, and assert that the shadow list is empty.\
    \ This approach would distort the scheduling of the test threads because modifying\
    \ the shadow list would require synchronization and possibly blocking.\n\nA better\
    \ approach is to compute checksums of the elements that are enqueued and dequeued\
    \ using an order-sensitive function, and compare them. This approach works best\
    \ when there is a single producer putting elements into the buffer and a single\
    \ consumer taking them out, because it can test not only that the right elements\
    \ but that they came out in the right order.\n\nExtending this to a multiple-producer,\
    \ multiple-consumer scenario requires using a checksum function that is insensitive\
    \ to the order in which elements are combined, and so multiple checksums can be\
    \ composed after the test. Otherwise, (Any commutative operation, such as addition\
    \ or XOR, meets these requirements.)\n\nTo ensure that your tests test what you\
    \ think they do, it is important that the checksum themselves are not biased by\
    \ the generator. A bad use of generator could be ideal, and a small checksum could\
    \ deceptively pass.\n\nTo avoid this, test data should be generated randomly,\
    \ but many otherwise effective tests are compromised by a poor choice of random\
    \ number generator (RNG). Random number generation can create couplings between\
    \ classes and artifacts because most random number generators are threadsafe and\
    \ introduce additional synchronization. [4] Giving each test its own non-thread-safe\
    \ RNG is useful.\n\n[4] Many benchmarks are unknown to their developers or users,\
    \ it is better to use simple pseudorandom functions. You don't need high quality\
    \ randomness; all you need enough to ensure the numbers change from run to run.\
    \ The xor-shift function in 12.4 (Marsaglia, 2003) is the cheapest medium-quality\
    \ random number functions. Starting with\n\nwith"
