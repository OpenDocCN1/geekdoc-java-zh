    \ between the set of mouse listeners and key listeners; the two are independent,\
    \ and therefore visualComponent can delegate its thread safety obligations to\
    \ two underlying thread-safe lists.\n\nvisualComponent uses a CopyOnWriteArrayList\
    \ to store each listener list; this is a thread-safe List implementation particularly\
    \ suited for managing listeners (see Section 5.2.3). Each List is thread-safe,\
    \ and because there are no constraints coupling the state of one to the state\
    \ of the other, visualComponent can delegate its thread safety responsibilities\
    \ to the underlying mouseListeners and keyListeners objects."
