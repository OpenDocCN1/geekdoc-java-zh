  md: "Listing 7.9 addresses the exception-handling of asoundPrimes and the problems\
    \ with the previous attempt. The thread created to run the task can have its own\
    \ execution policy, and if the task doesn't respond to the input, the timed run\
    \ method can return to its caller. After starting the thread, timedRun executes\
    \ a join with the newly created thread. After join returns, it checks if an exception\
    \ was thrown from the task and if so, it rethrows it in the calling timedRun.\
    \ The saved Throwable is shared between the two threads, and is declared volatile\
    \ to safely publish it from the task to the timedRun.\n\nThis version addresses\
    \ the problems in the previous examples, because it relies on a timed join, which\
    \ has a deficiency: we don't know if control was returned because the thread exited\
    \ normally or because the join timed out [2]\n\n[2] This is a flaw in the Thread\
    \ API, whether or not the join completes successfully has memory visibility concerns\
    \ in the Java Memory Model, join does not return a status indicating whether it\
    \ was successful.\n\n# 7.1.5. Cancellation Via Future\n\nWe have already used\
    \ asynchronous for managing the lifecycle of a task, dealing with exceptions,\
    \ and facilitating cancellationFuture. Following the general principle that it\
    \ is better to use existing library classes than to roll your own, let's build\
    \ timedRun using Future and the task execution framework.\n\n# Listing 7.9. Interrupting\
    \ a Task in a Dedicated Thread.\n\n![](img/c64daf12e0d6c877213813fc53c890a4_107_0.png)\n\
    \n```\npublic static void timedRun(final Runnable r,\n        long timeout, TimeUnitUnit\
    \ unit)\n    throws InterruptedException {\n    class RethrowableTask implements\
    \ Runnable {\n        private Throwable t;\n        public void run() {\n    \
    \        try {\n                r.run();\n            } catch (Throwable t) {\n\
    \                    this.t = t;\n            }\n        }\n        void throwable()\
    \ {\n            if (t != null)\n                throw throwable(t);\n       \
    \ }\n    }\n    RethrowableTask task = new RethrowableTask();\n    Future<?> taskFuture\
    \ = new Future<>(task);\n    taskExecutor.schedule(new Runnable() {\n        public\
    \ void run() {\n            taskThread.interrupt();\n        }\n    }, timeout,\
    \ unit);\n    taskFuture.join(unit.toMillis(timeout));\n    task.throwable();\n\
    }\n```\n\nExecutor.submit returns a Future describing the task. Future has a cancel\
    \ method that can tell whether the cancellation was successful. (This tells you\
    \ only whether it was able to deliver the interruption, not whether the task detected\
    \ and on it.) WhenInterruptingFuture is true and the task is running in some thread,\
    \ then that thread is interrupted. Setting the interrupt flag is enough for the\
    \ task to handle the interruption.\n\nSince you don't interrupt a thread unless\
    \ you know its interruption policy, is it OK to cancel with an argument of True?\
    \ The task execution threads created by the Standard Executor implement an interruption\
    \ policy that lets tasks to be cancelled when interrupting, so it is safe to mayInterruptFuture\
    \ when they are running in a standard Executor. You should not interrupt a pool\
    \ directly when attempting to cancel a task, because you don't know what is running\
    \ when the interrupt request is delivered - only through the task's Future. This\
    \ is another reason to use codes to test interruption as a cancellation request:\
    \ then they can be cancelled by their Futures.\n\nListing 7.10 shows a version\
    \ of timedRun that submits the task to an Executor and returns a timed Future.\
    \ If it terminates with a TimeoutException, the task is cancelled via its Future.\
    \ (To simplify coding, this version calls Future.cancel unconditionally in a finally\
    \ block, taking advantage of the fact that cancelling a completed task has no\
    \ effect.) if the underlying computation throws an exception prior to cancellation,\
    \ it is rethrown from timedRun, which is the most convenient way for the caller\
    \ to deal with the exception. Listing 7.10 shows"
