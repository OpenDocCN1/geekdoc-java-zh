    \                }\n        });\n    }\n}\n```\n\n# 3.2.1. Safe Construction Practices\n\
    \nThisEscape illustrates an important special case of escape - when this reference\
    \ escapes during construction. When the inner EventListener is published, so is\
    \ the enclosing thisEscape instance. But an object is in a predictable, consistent\
    \ state only after its constructor returns, so publishing an object from its constructor\
    \ an incompletely constructed object. This is true if the reference is the last\
    \ in the constructor. If this reference escapes during construction, the object\
    \ is considered not properly constructed.[8]\n\n[8] More specifically, this reference\
    \ should not escape from the thread until the constructor returns. This reference\
    \ can be stored somewhere by the constructor as long as it is not used by another\
    \ thread until after construction. Safelistener in Listing 3.8 uses this technique.\n\
    \nDo not allow this reference to escape during construction.\n\nA common mistake\
    \ to let this reference escape during construction is to start a thread from a\
    \ constructor. When an object creates a thread from its constructor, it almost\
    \ always shares its reference with the new thread, either explicitly (passing\
    \ it to the constructor) or implicitly (because the Thread or Runnable is an inner\
    \ class of the owning object). The new thread might then be able to see the object\
    \ before it is fully constructed. Instead, expose a start or initialize method\
    \ that starts the thread. It is best not to start the thread immediately. (See\
    \ Chapter 7 for more on lifecycle issues). Overriding an instance method (one\
    \ that is neither private nor final) from the constructor can also allow this\
    \ reference to escape.\n\nIf you are tempted to register an event listener or\
    \ start a thread from a constructor, you can improve the construction by using\
