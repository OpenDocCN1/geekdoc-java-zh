    # ### 9.4.1. Thread-safe Data Models


    As long as responsiveness is not unduly affected by blocking, the problem of multiple
    threads on the data can be addressed with a thread-safe data model. If the data
    model supports fine-grained concurrency, the event thread and background threads
    are able to share it without problems. For example, delegatingTracker on page
    65 uses unchanging retrieval operations for a high degree of concurrency. The
    downside is it does not offer a consistent snapshot of the data, which may not
    be a requirement. Thread-safe data models must also generate events when the model
    has been updated, so that views can be updated when the data changes.


    It may be possible to get thread safety, consistency and good responsiveness with
    a versioned data model such as CopyOnWriteArrayList [2.2.3.3]. When you create
    an iterator for a copy-write collection, the iterator traverses it as if the iterator
    was created. However, copy-write collections perform poorly when traverses greatly
    modifications, which would probably not be the case in say, a vehicle tracking
    application. More specialized versioned data structures may avoid this restriction,
    but building versioned structures that provide both efficient concurrency and
    do not retain old versions of data more than needed is, and so should be considered
    when others are not practical.


    # ### 9.4.2. Split Data Models


    From the perspective of the GUI, the switch table model classes are TableModel
    and treeModel are the official repository for data to be displayed. However, these
    objects are themselves "views" of other managed by the application. A program
    that has a presentation-domain and an applicationdomain data model is said to
    have a split-model design (Fowler, 2005).


    In a split-model, the presentation model is confined to the event thread and the
    other, the shared model, is thread-safe and may be accessed by the event thread
    and applications. The presentation model registers listeners with the shared model
    so it can be notified of updates. The presentation model can be updated from the
    shared model by embedding a snapshot of the relevant state in the update message
    or by having the presentation model retrieve directly from the shared model when
    it receives an update.


    The snapshot approach is simple, but has limitations. It works well when the data
    model is small, updates are not too frequent, and the split is not. If one or
    both sides of the split contain information that is not visible to the other side,
    it can be more efficient to send incremental updates instead of snapshots. This
    approach has the effect of serializing updates on the shared model and recreating
    them in the event thread against the presentation model. Another advantage of
    incremental updates is finer-grained information about what can improve the perceived
    quality of the display only when one vehicle moves, we don''t have to repaint
    the entire display, just the affected regions.


    Consider a split-model design when a data model must be shared by more than one
    thread and implementing a thread-safe data model would be inadmissible because
    of blocking, consistency, or complexity reasons.


    # ### 9.5. Other Forms of Single-Threaded Subsystems


    Thread confinement is not restricted to GUIs: it is whenever a facility is implemented
    as a single-threaded subsystem. Sometimes thread confinement is forced on the
    developer for reasons that have nothing to do with synchronization or deadlock.
    For example, some native libraries that all access to the library, even loading
    the library with system.library, must be made from the same thread.


    Borrowing from the approach taken by GUI frameworks, you can easily create a dedicated
    thread or single-threaded executor for accessing the native library, and provide
    a proxy object that intercepts calls to the thread-confined object and submits
    them to the dedicated thread. Future and Future work together to make this easy;
    the proxy method can submit the task and immediately call Future.get for the result.
    (If the class is thread-confined implements an interface, you can automate the
    process of having each method submit a callable to a background thread executor
    and waiting for the result using dynamic proxies.)'
