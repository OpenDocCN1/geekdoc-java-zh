    \ (Atomic variables provide atomic read-modify-write operation and can be used\
    \ as \"better volatile\" (see Chapter 15).\n\n> Locking can guarantee both visibility\
    \ and atomicity; volatile variables can only guarantee visibility.\n\nYou can\
    \ use volatile variables only when all the following criteria are met:\n\n+  \
    \ * Writes to the variable do not depend on its current value, or you can ensure\
    \ that only a single thread updates the value;\n* The variable does not participate\
    \ in other state variables;\n* Locking is not required for any other reason while\
    \ the variable is being accessed.\n\n# 3.2. Publication and Escape\n\nPublishing\
    \ an object making it available to code out of its current scope, by sharing a\
    \ reference to it where other code could find, returning it from a non-private\
    \ method, or passing it to a method. In many cases, we want to ensure that objects\
    \ and their internals are not published. In other situations, we want to publish\
    \ an object for general use, but so in a thread-safe manner which may require\
    \ synchronization. Publishing state variables can compromise encapsulation and\
    \ make it more difficult to preserve invariants; publishing objects before they\
