    \ in? Can cancel cancel which will set the cancellation flag but the producer\
    \ will never check because it never returns from the blocking put (because the\
    \ consumer has stopped retrieving primes from the queue).\n\nAs hinted in Chapter\
    \ 5, certain locking libraries support interruption. Interruption is a cooperative\
    \ mechanism for a thread to signal another thread that it should, at its convenience\
    \ and if it feels like it, stop what it is doing and do so effectively.\n\nThere\
