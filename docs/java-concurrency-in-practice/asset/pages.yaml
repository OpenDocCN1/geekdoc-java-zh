  md: 'ConcurrentHashMap is a hash-based Map, but it uses a different locking strategy
    that offers concurrent access to a single lock at a time, instead of synchronizing
    every method on a common lock (see Section 44.3) to allow a greater degree of
    shared access. Arbitrarily making many readers can access the map concurrently,
    readers can access the map concurrently with writers, and a limited number of
    writers can modify the map concurrently, with little penalty for single-threaded
    access.


    ConcurrentHashMap, with all other concurrent collections, has improved on the
    synchronization by providing iterators that do not throw ConcurrentModificationException,
    eliminating the need to lock the collection during iteration. The iterators returned
    by ConcurrentHashMap are weakly consistent instead of fail-fast. A weakly consistent
    iterator can tolerate concurrent modification, traverses the collection as it
    existed when the iterator was constructed, and may (but is not guaranteed to)
    reflect modifications to the collection after the construction of the iterator.


    With all improvements, there are a few tradeoffs. The semantics of methods that
    operate on the entire map, such as size and isEmpty, have slightly weakened to
    reflect the concurrent nature of the collection. Since the result of size could
    be out of date by the time it is computed, it is only an estimate, to return an
    approximation of an exact count. While this at first seem disorienting, in reality
    these quantities are moving targets. The requirements for these iterators were
    weakened to enable performance optimizations for the most important operations,
    primarily get, put, contains, and remove.


    The one feature offered by the synchronized Maps but not by ConcurrentHashMap
    is the ability to lock the map for exclusive access. With Hashtable and synchronizedMap,
    acquiring the map prevents any other from accessing it. This might be necessary
    in unusual cases such as adding several mappings atomically, or iterating the
    map several times and needing the same elements in the same order. On whole, this
    is a tradeoff: concurrent collections should be expected to change their contents
    continuously.


    Because it has so many advantages and so few disadvantages compared to Hashtable
    or synchronizedMap, replacing synchronized Map implementations with ConcurrentHashMap
    in most cases only results in better scalability. If your application needs the
    map for exclusive access it is not an appropriate drop-in replacement.


    If you are relying on the synchronization effects offered by the synchronized
    Map.


    # 5.2.2. Additional Atomic Map Operations


    Since a ConcurrentHashMap cannot be locked for exclusive access, we cannot use
    client-side locking to create atomic operations such as put-if-absent, as we discussed
    in Section 44.1. Instead, a number of common operations such as put-if-absent,
    remove-if-present, and replace-if-abs are implemented as atomic operations and
    specified by the ConcurrentMap interface. If you find adding such functionality
    to an existing synchronized Map, it is probably that you should consider using
    a ConcurrentMap instead.


    # 5.2.3. CopyOnWriteArrayList


    CopyOnWriteArrayList is a replacement for a synchronized List that offers better
    concurrency in some common situations and eliminates the need to lock or copy
    the collection during iteration. (Similarly, CopyOnWriteArraySet is a concurrent
    replacement for a synchronized Set.)


    The copy-on-write collections derive their thread safety from the fact that as
    long as an effectively immutable object is properly published, no further synchronization
    is required when accessing it. Implement immutability by creating and publishing
    a new copy of the collection every time it is modified. The iterators for the
    copy-write collections retain a reference to the backing array that was current
    at the start of iteration, and this will never change, so they need to synchronize
    only to briefly ensure visibility of the array contents. As a result, multiple
    threads can iterate the collection without interference from one another or from
    threads wanting to modify the map. The iterators returned by the copy-write collections
    return the elements exactly as they were at the time the iterator was created,
    regardless of subsequent modifications.'
