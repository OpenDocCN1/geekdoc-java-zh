  md: "# 1.3. Risks of Threads\n\nJava's built-in support for threads is a double-edged\
    \ sword. While it simplifies the development of concurrent applications by providing\
    \ language and library support and a formal cross-platform memory model (it is\
    \ formal cross-platform memory model that makes the development of write-once,\
    \ run-anywhere applications in Java, it also raises the bar for developers because\
    \ more programs will use threads. When threads were more esoteric, concurrency\
    \ was an \"advanced\" topic; now, mainstream developers must be aware of thread-safety\
    \ issues.\n\n# 1.3.1. Safety Hazards\n\nThread safety can be unexpectedly subtle\
    \ because, in the absence of sufficient synchronization, the ordering of operations\
    \ in multiple threads is unpredictable and something surprising. unsafeSequence\
    \ Listing 1.1, which is supposed to generate a sequence of unique integer values,\
    \ offers a simple illustration of how the interleaving of operations in multiple\
    \ threads can lead to undesirable results. It behaves correctly in a single-threaded\
    \ environment, but in a multithreaded environment does not.\n\nListing 1.1. Non-safe\
    \ Sequence Generator.\n\n```\n@NotThreadSafe\npublic class unsafeSequence {\n\
    \    private int value;\n\n    /** Returns a unique value. */\n    public int\
    \ getNext() {\n        return value++;\n    }\n}\n```\n\nThe problem with unsafeSequence\
    \ is that with some unlucky timing, two threads could getNext and receive the\
    \ same value. Figure 1.1 shows how this can happen. The increment notation, nextvalue++,\
    \ may appear to be a single operation, but in fact three separate operations:\
    \ read the value, add one to it, and then write out the new value. Sequence of\
    \ operations in multiple threads can be arbitrarily interleaved by the runtime,\
    \ it is possible for two threads to read the value at the same time, both see\
    \ the same value, and then add one to it. The result is that the same sequence\
    \ number is returned from multiple threads.\n\nFigure 1.1 Unlucky Execution of\
    \ unsafeSequence.nextvalue.\n\n| A | value→9 | 9+1→10 | value=10 |\n|---|---|---|---|\n\
    | B | value→9 | 9+1→10 | value=10 |\n\nDiagrams like Figure 1.1 depict possible\
    \ interleaving of operations in threads. These diagrams, from left to right, and\
    \ each line represents the activities of a different thread. These interleaving\
    \ diagrams usually depict the worst case and are intended to show the danger of\
    \ incorrectly assuming things happen in a particular order.\n\n> [2] As we'll\
    \ see in Chapter 3, the worst case can be even worse than these diagrams show\
    \ the possibility of reordering. unsafeSequence uses a redundant annotation @ThreadSafe.\
    \ This is one of several custom annotations used in this book to document concurrency\
    \ properties of classes and members. (Other-class annotations used in this are\
    \ @SafeAndImmutable; see Appendix A for details.) Annotations documenting thread\
    \ safety are useful to multiple audiences. If a class is annotated @ThreadSafe,\
    \ users can use it with confidence in a multithreaded environment, maintainers\
    \ are put on notice that it makes thread safety guarantees that must be preserved,\
    \ and software analysis tools can identify possible coding errors."
