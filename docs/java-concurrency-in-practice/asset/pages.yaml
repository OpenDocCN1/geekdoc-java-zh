    \ background thread that periodically expires entries from an in-memory cache.\n\
    \n> Daemon threads are not a good substitute for properly managing the lifecycle\
    \ of services within an application.\n\n# 7.4.3. Finalizers\n\nThe garbage collector\
    \ does a good job of reclaiming memory resources when they are no longer needed,\
    \ but resources such as file or socket objects, must be explicitly returned to\
    \ the operating system when no longer needed. To assist in this, the garbage collector\
    \ detects objects that have a nontrivial finalize method: after they are reclaimed\
    \ by the collector, finalize() is called so that persistent resources can be released.\n\
    \nFinalizers can run in a thread managed by the JVM, any state accessed by a finalizer\
    \ will be accessed by more than one thread and therefore must be accessed with\
    \ synchronization. Finalizers offer no guarantees on when or if they run, and\
    \ they impose a significant performance cost on objects with nontrivial finalizers.\
    \ They are also extremely difficult to write correctly.[9] In most cases, the\
    \ combination of finally and explicit close methods does a better job of resource\
    \ management than finalizers; the sole exception is when you need to manage objects\
    \ that hold resources acquired by native methods. For these reasons and others,\
    \ work is hard to avoid writing or using classes with finalizers (other than the\
    \ program library classes) [EJ Item 6].\n\n[9] See Boehm, 2005) for some of the\
    \ challenges involved in writing finalizers.\n\n# Summary\n\nEnd-of-life issues\
    \ for threads, services, and applications can add complexity to their design and\
    \ implementation. Java does not provide a preemptive mechanism for cancelling\
    \ activities or terminating threads. Instead, it provides a cooperative interruption\
    \ mechanism that can be used to facilitate cancellation, but it is up to you to\
    \ construct protocols for cancellation and use them consistently. Using FutureTask\
    \ and the Executor framework simplifies cancellable tasks and services."
