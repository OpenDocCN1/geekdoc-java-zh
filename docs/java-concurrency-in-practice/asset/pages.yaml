  md: '# Chapter 15. Atomic Variables and Non-blocking Synchronization


    Many of the classes in java.util.concurrent, such as semaphore and concurrent.linkedqueue,
    provide better performance and alternatives using synchronized. In this chapter,
    we take a look at the primary source of this performance boost: atomic variables
    and non-blocking synchronization.


    Most of the recent research on algorithms has focused on non-blocking algorithms,
    which use low-level atomic machine instructions such as compare-and-swap instead
    of locks to ensure data integrity under concurrency. Non-blocking algorithms are
    used extensively in operating systems and JVMs for process and scheduling, garbage
    collection, and to implement locks and other concurrent data structures.


    Non-blocking algorithms are much more complicated to design and lock-based alternatives,
    but they can offer significant scalability and leverage advantages. They coordinate
    at a finer level of granularity and greatly reducing overhead because when multiple
    threads compete for the same data, however, they are immune to deadlock and livelock
    problems. In lock-based algorithms, threads are suspended or spin waiting for
    a lock, whereas non-blocking algorithms are impervious to individual failures.


    Atomic variables can also be used as "volatile variables" even if you are not
    developing non-blocking algorithms. Atomic variables offer the same semantics
    as volatile variables, but with additional support for atomic updates - making
    them ideal for counters, sequence generators, and statistics gathering while offering
    better scalability than lock-based alternatives.


    # 15.1. Disadvantages of Locking


    Coordinating to share state using a consistent locking protocol ensures that while
    thread holds the lock guarding a set of variables has exclusive access to those
    variables, and any changes made to those variables are visible to other threads
    that subsequently acquire the lock.


    Modern JVMs can optimize lock acquisition and release effectively, but if multiple
    threads request the lock at the same time the JVM helps the help of the operating
    system. If it gets to this point, some unfortunate thread will be suspended and
    have to be resumed. When that thread is resumed, it may have to wait for other
    threads to finish their scheduling before it is actually scheduled. For lock-based
    fine-grained classes (such as the synchronized collections, which methods contain
    only a few operations), the ratio of overhead over useful work can be high when
    the lock is frequently contended


    > [1] A smart JVM not necessarily suspend a thread if it contends for a lock,
    could use profiling data to adaptively decide between suspension and spin locking
    based on how long the lock has been held during previous acquisitions.


    Volatile variables are a lightweight synchronization mechanism because they do
    not involve context switches or scheduling. However, volatile variables have some
    limitations compared to locking: while they provide similar visibility guarantees,
    they cannot be used to construct atomic operations. This means that volatile variables
    cannot be used when one value of a variable depends on its old value. When volatile
    variables are appropriate, they can be used to implement simple counters or mutexes.[2]


