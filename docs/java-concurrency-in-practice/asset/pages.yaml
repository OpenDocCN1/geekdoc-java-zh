    \    public void log(String msg) {\n        try {\n            service.execute(new\
    \ WriteTask(msg));\n        } catch (RejectedException ignored) {}\n    }\n}\n\
    ```\n\n# 7.2.3. Poison Pills\n\nOnce convince a consumer-service to shut down\
    \ with a poison pill: a recognized object on the queue that means \"when you get\
    \ this, stop.\" With a FIFO queue, poison pills ensures that consumers finish\
    \ the work on their queue before shutting down, any work submitted prior to submitting\
    \ the poison pill will be retrieved before the pills; producers should not submit\
    \ any work after putting a poison pill on the queue. IndexService in Listing 17.7,\
    \ 17.18, and 17.19 shows a single-producer,-consumer version of the desktop search\
    \ example from Listing 5.8 on page 91 that uses a poison pill to shut down the\
    \ server.\n\n# Listing 17.17. Shutdown with Poison Pill.\n\n```\npublic class\
    \ IndexService {\n    private static final File POISON = new File(\"\");\n   \
    \ private final IndexThread consumer = new IndexThread();\n    private final CrawlerThread\
    \ producer = new CrawlerThread();\n    private final BlockingQueue<File> queue;\n\
    \    private final FileFilter fileFilter;\n    private final File root;\n}\n\n\
    class CrawlerThread extends Thread { /* Listing 17.18 */ }\nclass IndexThread\
    \ extends Thread { /* Listing 17.19 */ }\n\npublic void start() {\n    producer.start();\n\
    \    consumer.start();\n}\n\npublic void stop() { consumer.interrupt(); }\n\n\
    public void awaitTermination() throws InterruptedException {\n    consumer.join();\n\
    }\n```\n\nPoison pills work only when the number of producers and consumers is\
    \ known. The approach in IndexService can be extended multiple producers by having\
    \ each producer place a pill on the queue and the consumer stop when it receives\
    \ N pills. It can be extended to multiple consumers by having each producer N\
    \ consumers on the queue, which can get unwieldy with large numbers of producers\
    \ and consumers. Poison pills work reliably on unbounded queues.\n\n# 7.2.4. Example:\
    \ A One-shot Execution Service\n\nIf a method needs to process a tasks and does\
    \ not return until all the tasks are finished, it can simplify lifecycle management\
    \ by using a private Executor whose lifetime is bounded by that method. The invokeAll\
    \ and invokeAny methods can be useful in such situations.\n\nThe checkmail in\
    \ Listing 7.20 checks for new mail in parallel on a number of hosts. It creates\
    \ a private executor and submits a task for each host: it then shuts down the\
    \ executor and waits for termination, which occurs when all the checkmail tasks\
    \ have completed.[4]\n\nan AtomicBoolean is used instead of a volatile boolean\
    \ in order to access the hasNewMail flag from the inner Runnable, it would have\
    \ to be final, which would preclude modifying it."
