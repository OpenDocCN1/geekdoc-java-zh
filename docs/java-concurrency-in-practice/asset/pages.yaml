  md: "# 5BPart II: Structuring Concurrency Applications - 9BChapter 7. Cancellation\
    \ and Shutdown\n\nthread fails abnormally the framework is informed of and can\
    \ take corrective action. This is one of the times you might want to consider\
    \ catching RuntimeException when you are calling, uncontrolled code through an\
    \ abstraction such as Runnable.[7]\n\n> [7] There is some controversy over the\
    \ safety of the technique; when a thread throws an unchecked exception, the entire\
    \ application may be compromised. The alternative - shutting down the entire application\
    \ - is usually not practical.\n\nListing 7.23 illustrates a way to structure a\
    \ worker thread within a thread pool. If a thread throws an unchecked exception,\
    \ it allows the thread to die, but without notifying the framework that the thread\
    \ has died. The framework may replace the worker with a new thread, or may choose\
    \ not to because the pool is shut down or there are already enough workers to\
    \ meet current demand. ThreadExecutor and Switch to ensure that a poorly behaved\
    \ thread doesn't prevent tasks from executing. If you are writing a worker thread\
    \ try to catch unchecked external code (such as dynamically loaded plugins), one\
    \ of these approaches to prevent a poorly written task or taking down the thread\
    \ that happens to call it.\n\n# Listing 7.23. Typical Thread-pool Worker Thread\
    \ Structure.\n\n```\npublic void run() {\n  try {\n    while (!currentThread().isInterrupted())\
    \ {\n      task = getTaskFromQueue();\n    }\n  } catch (Throwable e) {\n  } finally\
    \ {\n    threadExited(this, thrown);\n  }\nn\n```\n\n# 7.3. Uncaught Exception\
    \ Handler\n\nThe previous section offered a proactive approach to the problem\
    \ of unchecked exceptions. The Thread API provides the uncaughtExceptionHandler\
    \ facility, which lets you detect when a thread dies due to an unchecked exception.\
    \ The two approaches are complementary: taken together, they provide defense-in-depth\
    \ against thread leakage.\n\nWhen a thread exits due to an unc exception, the\
    \ JVM reports this to an application-defined UncaughtExceptionHandler (see Listing\
    \ 7.24); if no handler exists, the default behavior is to print the stack trace\
    \ to System.err.[8]\n\n> [8] Before Java 5.0, the only way to control the UncaughtExceptionHandler\
    \ was by subclassing Thread. In Java 5.0 and later, you can set an UncaughtExceptionHandler\
    \ on a per-thread basis with Thread.setUncaughtExceptionHandler, and can also\
    \ set the default UncaughtExceptionHandler with Thread.setDefaultUncaughtExceptionHandler.\
    \ However, only one of these handlers is called by the JVM for a per-thread handler,\
    \ and for a ThreadGroup handler. The handler implementation in ThreadGroup handles\
    \ the uncaught exception or it bubbles up to the top level thread handler. The\
    \ top level ThreadGroup handler deals with the exception (if one exists), otherwise\
    \ prints the stack trace to the console.\n\n# Listing 7.24. UncaughtExceptionHandler\
    \ Interface.\n\n```\npublic interface UncaughtExceptionHandler {\n  void uncaughtException(Thread\
    \ t, Throwable e);\n}\n\n```\n\nWhat the handler should do with an uncaught exception\
    \ depends on your quality-of-service requirements. The most common response is\
    \ to write an error message and stack trace to the application log, as in Listing\
    \ 7.25. Handlers can take more direct action, such as trying to restart the thread,\
    \ shutting down the application, paging an operator, or other corrective action.\n\
    \n# Listing 7.25. UncaughtExceptionHandler that Logs the exception.\n\n```\npublic\
    \ class LoggerExceptionHandler implements UncaughtExceptionHandler {\n  public\
    \ void uncaughtException(Thread t, Throwable e) {\n    Logger logger = Logger.getLogger(AnonymousLogger());\n\
    \    logger.log(Level.SEVERE,\n      \"Thread terminated with exception: \" +\
    \ t.getName(),\n      e);\n  }\n}\n\n```\n\nIn long-running applications, always\
    \ use uncaught exception handlers for all threads that at last the exception."
