  md: '# Java Concurrency In Practice


    To make matters worse, our intuition may be wrong on which classes are "probably
    thread-safe" and which are not. For an example, java.SimpleDateFormat is not thread-safe,
    the Javadoc neglected to mention this in JDK 1.4. This particular class is not
    thread-safe as a surprise to many developers. Many programs mistakenly create
    a shared instance of a non-thread-safe object and use it from multiple threads,
    unaware that this might cause erroneous results under heavy load?


    The problem with SimpleDateFormat could be avoided by not assuming a class is
    thread-safe if it doesn''t say so. On the other hand, it is impossible to develop
    a servlet-based application without making some questionable assumptions about
    the thread safety of container-provided objects like HttpServlet. Do not make
    your customers or colleagues have to make guesses like this.


    # 4.5. Interpreting Vague Documentation


    Many technology specifications are silent, or at least forthcoming, about thread
    safety and guarantees for interfaces like servletContext, HttpServlet, and datasource.
    Since these interfaces are implemented by your container or database vendor, you
    don''t want to look at what it does. Besides, you want to have your code work
    properly with any JDBC driver - but the words "thread" and "concurrent" do not
    appear at all in the JDBC specification, and appearing frustrating rarely in the
    servlet specification. What do you do?


    > [9] We will find that these omissions persist despite major revisions of the
    specification.


    You are going to have. One way to improve the quality of your guess is to interpret
    the specification from the perspective of someone who will implement it (as a
    container or database vendor), as opposed to someone who will merely use it. Servlets
    are all called from a container-managed thread, and it is safe to assume that
    if there is more than one thread, the container knows this. The servlet container
    makes certain objects that provide service to servlets, such as HttpServlet or
    servletContext. The servlet container should expect that if these objects are
    accessed concurrently, it has created multiple threads and methods like servlet.service
    from them that can be called safely.


    Since it is possible to imagine a single-threaded context in which these objects
    would be used, unless the specification does not explicitly require this. Besides,
    if they require client-side locking, on what lock should the container synchronize?
    The documentation doesn''t say, and it seems absurd to. This "reasonable assumption"
    is further bolstered by the examples in the specification and official tutorials
    that show how ServletContext or HttpServlet do not use any client-side synchronization.


    On the other hand, the objects placed in the servletContext or HttpServlet with
    setAttribute are ordered by concurrent access. The servlet specification does
    not suggest any mechanism for controlling concurrent access to these attributes.
    Attributes stored by the container of the web application should be thread-safe
    or effectively immutable. If all the container does store these attributes of
    the web application, another option would be to ensure that they are guarded by
    a lock when accessed from servlet application code. But the container can''t know
    your locking protocol, so how to make them thread-safe?


    One can make a similar reference to the JDBC datasource interface, which represents
    a pool of reusable database connections. A datasource provides service to an application,
    and it doesn''t make sense in the context of a single-threaded application. It
    is hard to imagine a case that doesn''t involve getting connection from multiple
    threads. And, with servlets, the JDBC specification does not suggest the need
    for any client-side locking in the many examples you use datasource is thread-safe
    or require vendors to provide a thread-safe implementation, by the same "it would
    be absurd if it weren''t" argument, we have no choice but to assume that datasource.connection
    does not require any client-side locking.


    On the other hand, we would not make the same argument about the JDBC Connection
    objects dispensed by the container, since these are not necessarily intended to
    be shared by other activities until they are returned to the pool. So if an activity
    that obtains a JDBC connection spans multiple threads, it must take responsibility
    for ensuring that access to the Connection is guarded by synchronization. (In
    many applications, that that use a JDBC Connection are implemented so to confine
    the servlet to a specific thread away.)


