  md: '# Java Concurrency In Practice


    When a variable is guarded by a lock - meaning that access to that variable is
    performed with lock held - you''ve ensured that only one thread at a time can
    access that variable. When a class has invariants that involve more than one variable,
    there is an additional requirement: every variable participating in the invariant
    be guarded by the same lock. This allows you to access or update them in a single
    atomic operation, preserving the invariant. synchronizedfactorizer demonstrates
    this: both the cached and the cached factors are guarded by the servant''s intrinsic
    lock.


    For every invariant that involves more than one variable, all the variables involved
    in that invariant be guarded by the same lock.


    If synchronization is the cure for race conditions, why not declare every method
    synchronized? It turns out that such indiscriminate application of synchronization
    might be too much or too little synchronization. Merely synchronizing every method,
    is not enough to render compound operations on a vector atomic:


    ```

    if (vector.contains(element))

    vector.add(element);

    ```


    This attempt at a put-if operation has a race condition, even though both contains
    and are atomic. While synchronized methods make individual operations atomic,
    additional locking is required - when multiple operations are combined into a
    compound operation (See Section 4.4 for techniques for safely adding atomic operations
    to thread-safe objects). At the same time, synchronizing every method can lead
    to looseness or performance problems, as we saw in Synchronizedfactorizer.


    # 2.5 Liveness and Performance


    In UnsafeFactorizer, we introduced caching in our factoring servlet for method
    of improving performance. Caching required shared state, which in turn required
    synchronization to maintain the integrity of that state. But the way we used synchronization
    in Synchronizedfactorizer makes it perform badly. The synchronization policy for
    synchronizedfactorizer is to guard each state variable with the servant''s intrinsic
    lock, and that policy implemented the entirety of the service method. This simple,
    coarse-grained approach restored safety, but at a high price.


    Because service is synchronized, only one thread may execute it once. This subverts
    the use of the servlet framework - that servlets are able to handle multiple requests
    simultaneously - and can result in frustrated users if load is high. If the servlet
    is busy factoring a large number, other clients will have to wait until the current
    request is complete before the servlet can start the new number. If the system
    has multiple CPUs, processors may remain idle even if the load is high. In any
    case an unexpectedly long time because they must wait for long-running requests
    to complete.


    Figure 2.1 shows what happens when multiple requests arrive for the synchronized
    servlet being: they queue up and are handled sequentially. We would describe this
    as application exhibiting poor concurrency: the number of simultaneous invocations
    is limited not by availability of processing resources, but by the structure of
    the application itself. It is easy to improve the concurrency of the servlet by
    narrowing the scope of the synchronized block. You should be careful not to make
    the scope of the synchronized block too small you would not want to divide an
    operation that should be atomic into more than one synchronized block. But it
    is reasonable to exclude from synchronized blocks long-running operations that
    do not affect shared state, so that other threads are not prevented from accessing
    the shared state while the long-running operation is progress.'
