  md: '# Java Concurrency In Practice


    To set an uncaught exception for thread pools, provide a Factory to the ThreadExecutor
    constructor. With all thread manipulation, only the thread''s owner should change
    its uncaughtExceptionHandler. The standard thread pools allow an uncaught exception
    to terminate the thread pool, but use a try-finally block to be notified when
    this happens to the thread. Without an uncaught exception handler or failure notification
    mechanism, tasks can appear to fail silently, which can be very confusing. If
    you want to be notified when a task fails due to an exception so that you can
    take some task-specific action, wrap the task with a Runnable or callable that
    catches the exception or override the execute hook in ThreadExecutor.


    Sometimes confusing, exceptions from tasks make it to the uncaught exception handler
    only for tasks submitted with execute; for tasks submitted with submit, any exception,
    checked or not, is considered to be part of the task''s return status. If a task
    terminates with an exception, it is returned by Future.get as an ExecutionException.


    # 7.4 Shutdown


    The JVM can shut down in either an orderly or abrupt manner. An orderly shutdown
    is initiated when the "normal" (non-daemon) threads terminate, calls System.exit,
    or by other platform-specific means (such as sending a SIGINT or hitting Ctrl-c).
    While this is the standard and preferred way for the JVM to shut down, it can
    also be shut down by calling Runtime.halt or by killing the JVM process over the
    operating system (such as sending a SIGKILL).


    # 7.4.1 Shutdown Hooks


    In an orderly shutdown, the JVM starts all registered shutdown hooks. Shutdown
    hooks are unstarted threads that are registered with Runtime.addShutdownHook.
    The JVM makes no guarantees on the order in which shutdown hooks are started.
    If application threads (daemon or nondamon) are still running at shutdown time,
    they continue to run concurrently with the shutdown process. When all shutdown
    hooks have completed, the JVM may choose to run finalizers if finalExit is true,
    and then halts. Any application threads that are still running at shutdown time
    are abruptly terminated when the JVM eventually halts. If the shutdown hooks or
    finalizers do not complete, the orderly shutdown process "hangs" and the JVM is
    not required to do anything other than halt the JVM; shutdown hooks will not run.


    Shutdown hooks should be thread-safe; they must use synchronization when accessing
    shared data and be careful to avoid deadlock, like any other concurrent code.
    Further, they should not make assumptions about the state of the application (such
    as whether other services have shut down already or all normal threads have completed)
    or whether the JVM is shutting down, and must be coded extremely carefully. Finally,
    they should exit as quickly as possible, since their existence delays JVM termination
    at a time when the user is expecting the JVM to terminate.


    Shutdown hooks can be used for service application cleanup, such as deleting temporary
    files or clearing resources that are not automatically cleaned by the OS. Listing
    7.26 shows how LogService in Listing 7.16 could register a shutdown hook on exit.


    Because shutdown hooks run concurrently, the log file could cause trouble for
    other shutdown hooks who want to use the logger. To avoid this problem, shutdown
    hooks should not rely on services that can be shut down by the application or
    other shutdown hooks. One way to accomplish this is to use a single shutdown hook
    for all services, rather than one for each, and have it call a series of shutdown
    actions. This ensures shutdown actions execute sequentially in a single thread,
    avoiding the possibility of race conditions or deadlock between shutdown actions.
    This technique can be used whether not you use shutdown hooks; executing shutdown
    actions sequentially rather than concurrently eliminates many potential sources
    of failure. In applications that maintain dependency information among services,
    this technique can also ensure that shutdown actions are performed in the right
    order.'
