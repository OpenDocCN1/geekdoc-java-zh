  md: '# 9.2. Short-running GUI Tasks


    In a GUI application, events originate in the event thread and bubble up to application-provided
    listeners, which probably perform some computation that affect the presentation
    objects. For simple, short-running tasks, the entire action can stay in the event
    thread; for longer-running tasks, the task of processing should be offloaded to
    another thread.


    In the simple case, confining presentation objects to the event thread is completely
    natural. Listing 9.3 creates a button whose color changes randomly when pressed.
    When the user clicks on the button, the toolkit delivers an ActionEvent in the
    event thread to all registered action listeners. In response, the action listener
    picks a new color and changes the application modifies the GUI in response to
    the user''s action. Control never has to leave the event thread, as illustrated
    in Figure 9.1.


    Figure 9.1. Control Flow of a Simple Button Click.


    ![](img/c64daf12e0d6c877213813fc53c890a4_135_0.png)


    This trivial example characterizes the majority of interactions between GUI applications
    and GUI toolkits. So long as tasks are short-lived and access only GUI objects
    (or other thread-confined or thread-safe application objects), you can almost
    totally ignore threading concerns and do everything from the event thread, and
    the right thing happens.'
