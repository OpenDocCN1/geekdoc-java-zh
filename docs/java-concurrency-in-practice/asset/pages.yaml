  md: "# 2.1. Example: A Stateless\n\nIn Chapter 1, we have listed a number of frameworks\
    \ that create threads and call your components from those threads, leaving you\
    \ with the responsibility of making your code thread-safe. Very often, thread-safety\
    \ requirements stem not from a decision but from a facility like the Servlets\
    \ framework. We will develop a simple example and extend it to add features while\
    \ preserving thread safety.\n\nListing 2.1 shows our stateless factorizer. It\
    \ unpacks the number to be factored from the servlet request, factors it, and\
    \ packages the result into the servlet response.\n\nListing 2.1. A Stateless Servlet.\n\
    \n```\n@Threadsafe\npublic class Stateless extends Servlet {\n    public BigInteger\
    \ service(ServletRequest req, ServletResponse resp) {\n        BigInteger factor\
    \ = extractFrom(req);\n        BigInteger result = factor.pow(i);\n        encodeResponse(resp,\
    \ result);\n    }\n}\n```\n\nStatelessFactorizer is, like most servlets, stateless:\
    \ it has no fields and references to no other classes. The transient state for\
    \ a particular computation exists solely in local variables that are only accessible\
    \ to the executing thread. One accessing a statelessFactorizer cannot influence\
    \ the result of another thread accessing the same StatelessFactorizer; because\
    \ the two threads do not share state, it is as if they were accessing different\
    \ instances. The actions of the threads of a stateless object cannot affect the\
    \ correctness of operations in other threads, stateless objects are thread-safe.\n\
    \n| Stateless objects are always thread-safe. |\n\nThe fact that most servlets\
    \ can be implemented with no state reduces the burden of making servlets thread-safe.\
    \ It is only when servlets need to remember things from one request to another\
    \ that the thread-safety requirement becomes an issue.\n\n# 2.2. Atomicity\n\n\
    What happens when we add one element to a stateless object? Suppose we want to\
    \ add a \"counter\" to the number of requests processed. The obvious approach\
    \ is to add a long field to the servlet and increment it on each request,\n\n\
    Unfortunately, unsafeCountingFactorizer is not thread-safe, though it would work\
    \ fine in a single-threaded environment. Just like unsafesequence on page 6, it\
    \ is susceptible to lost updates. While the increment operation, count++, might\
    \ look like a simple operation because of its syntax, it is not atomic, which\
    \ means that it does not execute as a single, indivisible operation. Instead,\
    \ it stands shorthand for a sequence of three discrete operations: fetch the current\
    \ value, add one to it, and write the new value back. This is an example of a\
    \ read-modify-write operation, in which the resulting state is derived from the\
    \ previous state."
