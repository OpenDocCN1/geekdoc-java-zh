  md: 'Semaphores for implementing resource database connection pools. It is easy
    to construct a fixed-sized pool that if you request a resource from the pool,
    what you really want is to block if the pool is empty and becomes nonempty. If
    you initialize a semaphore to pool size, acquire a permit before trying to fetch
    a resource from the pool, and release the permit after putting a resource back
    in the pool, acquire blocks when the pool becomes nonempty. This technique is
    used in bounded buffer in Chapter 12. An easy way to construct a blocking object
    pool would be a `blockingqueue` to hold the pooled resources.


    Similarly, you can use a semaphore to turn any collection into a blocking collection,
    as illustrated by Boundedlist in Listing 5.14. The semaphore is initialized to
    the desired maximum size of the collection. The add operation acquires a permit
    before adding the item to the underlying collection. The underlying add operation
    does not actually adding it, it releases the permit immediately. Similarly, a
    successful removal operation releases a permit, enabling more elements to be added.
    The underlying implementation knows nothing about the bound; this is handled by
    Boundedlist.


    # 5.5.4.Barriers


    We have seen how latches in that they are single-use objects; once a latch enters
    the terminal state, it cannot reset.


    Barriers are similar to latches in that they block a group of threads until some
    event has occurred. The key difference is that with a barrier, all the threads
    must come together at a barrier point at the same time in order to proceed. Latches
    are waiting for events; barriers are waiting for other threads. A barrier implements
    the protocol some families use to rendezvous during a day at the mall: "Everyone
    meet at McDonald''s at 6:00; once you get there, stay until everyone shows up,
    and then well figure out what we''re doing next."


    cyclicBarrier allows parties to rendezvous repeatedly at a barrier point and is
    useful in parallel iterative algorithms that break down a problem into a fixed
    number of independent subproblems. Threads await when they reach the barrier point,
    and await blocks until the barrier has been successfully passed, in which case
    all threads are released and the barrier is reset so it can be used again. If
    any call to wait timeout or a thread blocked in await is interrupted, the barrier
    is considered broken and await throws BrokenBarrierException. If the barrier is
    successfully passed, the barrier action takes some special action in the next
    iteration. CyclicBarrier also lets you pass a barrier to the constructor; this
    is a runnable that is executed (in one of the subtask threads) when the barrier
    is successfully passed but before the blocked threads are released.'
