  md: "# Java Concurrency In Practice\n\nUnsafe illustrates a common hazard caused\
    \ by a race condition. Whether or not next returns a unique value from multiple\
    \ threads, as required by its specification, depends on how the runtime interleaves\
    \ the operations - which is not a desirable state of affairs.\n\nBecause threads\
    \ share the same memory address and run concurrently, they can access or modify\
    \ variables that other threads might be using. This is a tremendous convenience,\
    \ because it makes data sharing much easier than other inter-thread communication\
    \ mechanisms. It is also a significant risk: threads can be confused by data changing\
    \ unexpectedly. Multiplex threads to access and modify the variables introduces\
    \ an element of nonlinearity into an otherwise sequential programming model, which\
    \ can be confusing and difficult to reason about. For a multithreaded program\
    \ to be predictable, and shared variables must be properly coordinated so that\
    \ threads do not interfere with one another. Frankly, Java provides synchronization\
    \ mechanisms to coordinate access.\n\n[3]GuardedBy is described in Section 2.4;\
    \ it documents the synchronization policy for Sequence.\n\n```\nListing 1.2. Thread-safe\
    \ Sequence Generator.\n@ThreadSafe\npublic class Sequence {\n    @GuardedBy(\"\
    this\") private int nextValue;\n\n    public synchronized int get() {\n      \
    \  return nextValue++;\n    }\n}\n```\n\nIn the absence of synchronization, the\
    \ compiler, hardware, and runtime take liberties with the timing and order of\
    \ operations, such as caching variables in processor-level caches which are temporarily\
    \ (or permanently) invisible to other threads. These tricks are in aid of better\
    \ performance and generally desirable, but they place a burden on the developer\
    \ to clearly identify where data is shared across threads so that these optimizations\
    \ do not undermine safety. (Chapter 16 gives the gory details on exactly what\
    \ ordering the JVM guarantees, but if you follow the rules in Chapters 2 and 3,\
    \ you can avoid these low-level details.)\n\n# 1.3.2. L Hazards\n\nIt is critically\
    \ to pay attention to thread safety when developing concurrent code: safety cannot\
    \ be compromised. The importance of safety is not unique to multithreaded programs\
    \ - single-threaded programs also need to care for safety and correctness - but\
    \ the use of threads introduces additional hazards not present in single-threaded\
    \ programs. Similarly, the use of threads introduces additional forms of failure\
    \ that do not occur in single-threaded programs.\n\nWhile safety means \"nothing\
    \ bad ever happens\", liveness complements the guaranty that \"something eventually\
    \ happens\". A liveness failure occurs when an activity gets into a state where\
    \ it is permanently impossible to make progress. One form of liveness failure\
    \ that occur in sequential programs is an infinite loop, where the code that follows\
    \ the loop never executes. The use of threads introduces additional liveness risks.\
    \ For example, if A is waiting for a resource that thread B holds, and B never\
    \ returns it, A will wait forever. Chapter 10 describes various forms of liveness\
    \ failure and how to avoid them, including deadlock (Section 10.1), starvation\
    \ (Section 10.3), and livock. Like many concurrency hazards, bugs that cause liveness\
    \ failures can be elusive because they depend on the timing of events in different\
    \ threads, and therefore do not always manifest in development or testing.\n\n\
    # 1.3.3. Performance Hazards\n\nRelated to it is performance. While liveness means\
    \ that something good eventually happens, eventually may not be good enough -\
    \ we want things to happen quickly. Performance issues subsum a broad range of\
    \ problems, including service time, responsiveness, throughput, resource consumption,\
    \ or scalability. Just as safety and liveness, multithreaded programs are subject\
    \ to all the performance hazards of single-threaded programs, and to others as\
    \ well that are introduced by the use of threads."
