  md: '# Java Concurrency in Practice


    doesn''t vary any execution cost. On the other hand, executing a CAS from the
    application level involves no JVM system calls, or scheduling activity. What looks
    like a longer path at the application level is in a much shorter path when JVM
    and OS activity are taken into account. The primary disadvantage of CAS is that
    it forces the caller to deal with contention (by retrying, backing off, or giving
    up), whereas locks deal with contention by blocking until the lock is available.
    [5]


    [5] Actually, the disadvantage of CAS is the difficulty of constructing the surrounding
    algorithms.


    CAS performances vary widely across processors. On a single-CPU system, CAS takes
    on the order of a hundred clock cycles, with no synchronization overhead. As of
    writing, the cost of an uncontended CAS on multiple CPU systems ranges from about
    to 150 cycles; CAS is a rapidly moving target and varies not only across architectures
    but even across versions of the same processor. Competitive forces will likely
    continue in CAS performance improvement over the next several years. A good rule
    of thumb is that the cost of the "fast path" for lock acquisition on most processors
    is approximately twice the cost of a CAS.


    # 15.2. CAS Support in the JVM


    So, how does Java come to execute a CAS on its behalf? Prior to Java 5.0, there
    was no way to do this without native code. In Java 5.0, low-level support was
    added to expose CAS operations on int, long, and object references, and the JVM
    compiles the runtime inlines into the appropriate machine instruction(s); in the
    worst case, if a CAS-like instruction is not available the JVM uses a spin lock.
    This low-level support is provided by the atomic variable classes (Atomic in java.util.concurrent.atomic)
    to provide an efficient CAS operation on numeric and reference types; these atomic
    variables are used, directly or indirectly, to implement most of the classes in
    java.util.concurrent.


    # 15.3. Atomic Variable Classes


    Atomic variables are finer-grained and lighter-weight than locks, and are critical
    for implementing high-performance concurrent on multiprocessor systems. Atomic
    variables limit the scope of contention to a single variable; this is as fine-grained
    as you can get (assuming your algorithm can be implemented with such fine granularity).
    The fast (uncontended) path for updating an atomic variable is no slower than
    the fast path for acquiring a lock, and usually faster; the slow path is definitely
    faster than the path for locks because it does not involve suspending and rescheduling.
    With algorithms based on atomic variables instead of locks, threads are much more
    likely to be processed without delay and have an easier recovering time if they
    experience contention.


    The atomic variable classes provide a generalization of volatile variables to
    support atomic read-write operations. AtomicInteger represents an int value, and
    provide get and set methods with the same memory semantics as and writes to a
    volatile int. It also provides an atomic compareSet method(which replaces as add,
    increment, and decrement methods). AtomicInteger provides a sufficient replacement
    for an atomic counter, but offers greater flexibility than a volatile variable
    by explicitly utilizing hardware for concurrency.


    There are twelve atomic variable classes, divided into four groups: counters,
    fluctuators, and compound variables. The most used atomic variables are the: AtomicInteger,
    AtomicLong, AtomicBoolean, and AtomicReference. All support CAS; the Int and Long
    versions provide arithmetic well. (To simulate variables of other primitive types,
    you can short or byte values to int, and use floatIntBitsToLong for floating-point
    numbers).


    The atomic array classes (available in Integer, Long, and Reference versions)
    are arrays whose elements can be updated atomically. The atomic array classes
    provide volatile semantics to the elements of the array, a feature not available
    for ordinary arrays—a volatile has volatile semantics only for the reference,
    not for its elements. (The other types of atomic variables are discussed in Sections
    15.4.3 and 15.4.4).


    While the atomic classes extend number, they do not extend the primitive wrapper
    classes as Integer or Long. In fact, they cannot: the primitive wrapper classes
    are immutable whereas the atomic variables are mutable. The atomic variables also
    do not redefine hashCode or equals; each instance is distinct. Like most mutable
    objects, they are not good candidates for keys in hash-based collections.'
