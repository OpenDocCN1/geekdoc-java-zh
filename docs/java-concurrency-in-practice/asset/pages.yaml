  md: "# Java Concurrency in Practice\n\nanother good practice: cancelling tasks whose\
    \ result is no longer needed. (This technique was also used in 6.13 on page 128\
    \ and 6.16 on page 132).\n\n# Listing 7.10. Cancelling a Task Using Future.\n\n\
    ```\npublic static void timedRun(Runnable task,\n                            \
    \   long timeout, TimeUnit unit) {\n    Future<?> f = executor.submit(task);\n\
    \    try {\n        f.get(timeout, unit);\n    } catch (InterruptedException e)\
    \ {\n        // task will be cancelled\n        f.cancel(true);\n    } catch (ExecutionException\
    \ e) {\n        // exception in task: rethrow as RuntimeException\n        throw\
    \ new RuntimeException(e.getCause());\n    } finally {\n         Harmless if task\
    \ already completed\n        f.cancel(true); // Interrupt if running\n    }\n\
    }\n```\n\nFuture.get() throws InterruptedException or TimeoutException if you\
    \ know that the result is no longer needed by the program, cancel the task with\
    \ Future.cancel.\n\n# 7.1.6. Dealing with Noninterruptible Blocking\n\nMany library\
    \ methods respond to interruption by returning early and throwing InterruptedException,\
    \ which makes it easier to build tasks that are responsive to cancellation. However,\
    \ not all blocking or blocking mechanisms are responsive to interruption; if a\
    \ thread is blocked performing synchronous I/O or holding an intrinsic lock, interruption\
    \ has no effect other than setting the threads' interrupted status. This requires\
    \ greater awareness of why the thread is blocked.\n\nSynchronous I/O in java.io.\
    \ a common form of blocking I/O in server applications is reading or writing to\
    \ a socket. Unfortunately, the read and write methods in InputStream and OutputStream\
    \ are not responsive to interruption, so the underlying socket makes any throws\
    \ blocked in read or write throw SocketException.\n\nAsynchronous I/O in java.nio.\
    \ A writing thread on an InterruptedChannel causes it to closeByInterrupt and\
    \ close the channel (which also causes all other threads on the channel to closeByInterruptedException).\
    \ Closing the channel causes threads blocked on the channel operations to throw\
    \ asynchronousCloseException. Most methods implement InterruptedException.\n\n\
    Asynchronous I/O with Selector. If a thread is blocked waiting for an intrinsic\
    \ lock, there is nothing you can do to stop it unless you ensures it acquires\
    \ the lock and makes enough progress that you can get its attention other way.\
    \ However, the explicit lock classes offer the lockInterruptibly method, which\
    \ allows you to wait for a lock and still be responsive to interrupts - Chapter\
    \ 13.\n\nReaderThread in Listing 7.11 shows a technique for encapsulating standard\
    \ cancellation. ReaderThread handles a single connection, reading synchronously\
    \ any data received to processBuffer. To facilitate a turning connection or shutting\
    \ down the server, ReaderThread overrides interrupt to deliver a standard interrupt\
    \ and close the unsettling thread; ReaderThread makes what it is doing to report\
    \ whether it is blocked or in a noninterruptible blocking method.\n\n# 7.1.7.\
    \ Encapsulating Noninterruptible Cancellation with NewTaskFor\n\nThe technique\
    \ used in ReaderThread to encapsulate noninterruptible cancellation can be refined\
    \ using the newTaskFor added to ThreadPoolExecutor in Java 6. When a callable\
    \ is submitted to an ExecutorService, returns a Future that can cancel the task.\
    \ The newTaskFor is a factory method that creates the Future representing the\
    \ task. It returns a Runnable, interface that extends Future and Runnable, and\
    \ is implemented by FutureTask.\n\nCustomizing the Future allows you to override\
    \ Future.cancel. Cancellation code can perform logging or gather statistics on\
    \ cancellation, and also be used to cancel activities that are not responsive\
    \ to interruption."
