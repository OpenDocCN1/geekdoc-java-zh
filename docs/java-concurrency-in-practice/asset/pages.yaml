  md: "# Java Concurrency in Practice\n\n```\nListing 14.1. Binary Latch using AbstractQueuedSynchronizer.\n\
    ```java\n@ThreadSafe\npublic class OneHotLatch {\n    private final Sync sync\
    \ = new Sync();\n\n    public void signal() {\n        sync.releaseShared(0);\n\
    \    }\n\n    public void await() throws InterruptedException {\n        sync.acquireShared(0);\n\
    \    }\n\n    private class Sync extends AbstractQueuedSynchronizer {\n      \
    \  protected int tryAcquire(int ignored) {\n            // Success if latch is\
    \ open (state == 1), else fail\n            return (getState() == 1) ? 1 : -1;\n\
    \        }\n\n        protected boolean releaseShared(int ignored) {\n       \
    \     setState(1); // Latch is now open\n            return true; // Other threads\
    \ may be able to acquire\n        }\n    }\n}\n```\n```\n\nIn OneHotLatch, the\
    \ AQS handles the latch state - closed (zero) or open (one). The await method\
    \ calls acquireSharedInAQS, which in turn calls tryAcquireShared in OneHotLatch.\
    \ The tryAcquireShared-implementation must return a value indicating whether or\
    \ not acquisition can proceed. If the latch has been previously opened, tryAcquireShared\
    \ returns success, otherwise it returns a value indicating the acquisition failed.\
    \ The interrupted method interprets failure as that the thread should be on the\
    \ queue of waiting threads. Similarly, signal calls releaseShared, which unconditionally\
    \ sets the latch to open and returns true. The TryReleaseShared implementation\
    \ returns true. AQS allows all waiting threads to attempt to acquire the synchronizer,\
    \ and acquisition will now succeed because tryAcquireShared returns success.\n\
    \nOneHotLatch is a fully functional, usable, performant synchronizer, implemented\
    \ in twenty or so lines of code. It is missing some useful feature-- as timed\
    \ acquisition or the ability to inspect the latch state but it is easy to implement\
    \ as well, since AQS provides timed versions of acquisition and utility methods\
    \ for common inspection operations.\n\nOneHotLatch could have been implemented\
    \ by extending AQS rather than delegating to it, but this is undesirable for several\
    \ reasons [Ej Item 14]. Doing so would make the simple (two-) interface of onehotatch,\
    \ and the public methods of AQS wouldn't allow callers to corrupt the latch state,\
    \ callers could easily use them incorrectly. None of the synchronizers in java.util.concurrent\
    \ extend AQS directly - they delegate to primitive inner subclasses of AQS instead.\n\
    \n# 14.6. AQS in java.util.concurrent Synchronizer Classes\n\nMany of the blocking\
    \ classes in java.util.concurrent, such as ReentrantLock, Semaphore, ReentrantReadWriteLock,\
    \ CountDownLatch, SynchronousQueue, and FutureTask, are built using AQS. Without\
    \ getting too deeply into the details (the source code is part of the JDK download^{13}),\
    \ let's take a quick look at how each of these uses AQS.\n\n> [13] Or with fewer\
    \ licensing at http://ge.oswego.edu/currency-interest-\n\n# 14.6.1. ReentrantLock\n\
    \nReentrantLock supports only exclusive acquisition, as it implements tryAcquire,\
    \ tryRelease, and isHeld for the non-fair version shown in Listing 14.1. ReentrantLock\
    \ uses the synchronization state to hold the lock acquisition count, and maintains\
    \ another owner variable holding the identity of the owning thread that has acquired\
    \ the lock or is about to release it^{14}. In tryRelease, it checks the owner\
    \ field to ensure that the current thread owns the lock before allowing an unlock\
    \ to proceed; in tryAcquire, it uses this to differentiate between a reentrant\
    \ acquisition and a contended acquisition attempt."
