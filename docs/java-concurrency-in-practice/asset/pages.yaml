    \ List<BigInteger> get() {\n        return new ArrayList<>(primes);\n    }\n}\n\
    ```\n\nListing 7.2. Generating a Sequence of Word's Primes.\n\n```\nList<BigInteger>\
    \ sequenceOfPrimes() throws InterruptedException {\n    PrimeGenerator generator\
    \ = new PrimeGenerator();\n    new Thread(generator).start();\n    try {\n   \
    \     SECONDS.sleep(1);\n    } finally {\n        generator.cancel();\n    }\n\
    \    return generator.get();\n}\n```\n\nPrimeGenerator uses a simple cancellation\
    \ policy: client requests cancellation by calling cancel, PrimeGenerator checks\
    \ for cancellation once per prime and exits when it detects cancellation has been\
    \ requested.\n\n# 7.1.1. Interruption\n\nThe cancellation mechanism in PrimeGenerator\
    \ will eventually cause the prime-seeking task to exit, but it might take a while.\
