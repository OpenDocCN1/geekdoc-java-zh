  md: "# Java Concurrency in Practice\n\n```\nListing 5.14. Using Semaphore to Bound\
    \ a Collection.\npublic class boundedHashSet<T> {\n    private final Set<T> set;\n\
    \    private final Semaphore sem;\n\n    public boundedHashSet(int bound) {\n\
    \        this.set = Collections.synchronizedSet(new HashSet<T>());\n        sem\
    \ = new Semaphore(bound);\n    }\n\n    public boolean add(T o) throws InterruptedException\
    \ {\n        sem.acquire();\n        boolean wasAdded = false;\n        try {\n\
    \            wasAdded = set.add(o);\n            return wasAdded;\n        } finally\
    \ {\n            if (wasAdded) {\n                sem.release();\n           \
    \ }\n        }\n    }\n\n    public boolean remove(Object o) {\n        boolean\
    \ wasRemoved = set.remove(o);\n        if (wasRemoved) {\n            sem.release();\n\
    \        }\n        return wasRemoved;\n    }\n}\n```\n\nBarriers are used in\
    \ simulations, where the workload of one step can be done in parallel but all\
    \ the threads with a given step must complete before advancing to the next step.\
    \ For example, in n-body simulations, each step updates the position of each particle\
    \ based on the location and attributes of the other particles. Waiting on a barrier\
    \ between each update ensures that all updates for k have complete before moving\
    \ on to k+1.\n\ncellularAutomaton in Listing 5.15 demonstrates using a barrier\
    \ to compute a cellular automata simulation, such as Conway's Game of Life (Gardner,\
    \ 1970). When parallelizing a simulation, it is generally impractical to assign\
    \ a separate thread to each element (in the case of Life, a cell) would require\
    \ too many threads, and the overhead of coordination would dwarf the computation.\
    \ It makes sense to partition the problem into a number of parts, each thread\
    \ to solve a subset, and then merge the results. cellularAutomaton partitions\
    \ the board into N_parts, where each part, the worker calculates new values for\
    \ all the cells in its part of the board. When all workers have reached the barrier,\
    \ the workers are released to compute the next step of the calculation, which\
    \ includes consulting an isbone to determine whether further iterations are required.\n\
    \n> [5] For problems that have no I/O and access to shared data, N_parts = N_threads\
    \ yield optimal throughput; more threads do not help, and may degrade performance\
    \ due to CPU and memory contention.\n\nAnother example of barrier is the two-party\
    \ barrier in which the parties exchange data at the barrier point (CP). Exchanges\
    \ are useful when the threads perform asymmetric activities, for example when\
    \ one thread fills a buffer with data and the other consumes the data from the\
    \ buffer; these threads meet and exchange a full buffer for an empty one. Two\
    \ threads exchange data via an Exchanger, the exchange constitutes a safe publication\
    \ of both objects to the other party.\n\nThe timing of the exchange depends on\
    \ the responsiveness of the application. The simplest approach is that the filling\
    \ thread exchanges when the buffer is full, and the emptying thread exchanges\
    \ when the buffer is empty; this minimizes the number of exchanges but can delay\
    \ processing of some data if the arrival rate of new data is unpredictable. Another\
    \ approach would be that the filler threads exchange when the buffer is full,\
    \ but also when the buffer is partially filled and a certain amount of time has\
    \ elapsed.\n\n# 5.6. Building an Efficient, Scalable Result Cache\n\nNearly every\
    \ application uses some form of caching. Reusing the results of a previous computation\
    \ can reduce latency and increase throughput, at the cost of some additional memory\
    \ usage.\n\nListing 5.15. Coordinating Computation in a Cellular Automaton with\
    \ CyclicBarrier."
