    dramatically improves concurrency on a system with many processors. The lock splitting
    in the ServerStatus classes does not offer any obvious opportunity for splitting
    the locks further.


    Lock splitting can be extended to partitioning a variized set of independent objects,
    in case it is called lock stripping. For example, the implementation of concurrentHashMap
    uses an array of 16 locks, each of which guards 1/16 of the hash buckets; bucket
    N is guarded by lock mod 16. Assuming the hash function provides reasonable spreading
    characteristics and keys accessed uniformly, this should reduce the density for
    any given lock by approximately a factor of 16. This technique enables concurrentHashMap
    to support up to 16 writers. The number of locks could be increased to provide
    even better concurrency under heavy access on multiprocessorprocessor systems,
    but the number of stripes should be increased beyond the default of 16 only when
    you have evidence that writers are generating enough contention to warrant the
    limit.


    One of the disadvantages of lock splitting is locking the collection for exclusive
    access is more difficult and costly than with a single lock. Usually an operation
    can be performed by acquiring at most one lock, but occasionally you need to lock
    the entire collection, as concurrentHashMap needs to expand the map and rehash
    the values into a larger set of buckets. This is typically done by acquiring all
    of the locks in the stripe set.[10]


    +   [10] The only way to acquire an arbitrary set of intrinsic locks is via recursion.


    StripedMap in Listing 11.8 illustrates implementing a hash-based map using lock
    stripping. There are N_LOCKS, each guarding a subset of the buckets. Most methods,
    like get acquire only a single lock. Some methods may need to acquire all the
    locks but, as the implementation for clear, may not need to acquire them all simultaneously.[11]


    Clearing the map in this way is not atomic, so there is no necessary time when
    the Striped-Map is empty if threads are concurrently adding elements; making the
    atomic operation would require all the locks at once. However, for concurrent
    collections that clients typically cannot lock for exclusive access, the results
    of size or isEmpty may be out of date by the time they return away, so this behavior,
    perhaps somewhat surprising, is usually acceptable.


    # 11.4.4. Avoiding Hot Fields


    Lock splitting and lock stripping can improve scalability because they allow different
    threads to operate on different data (or different portions of the same data structure)
    without interfering with each other. A program that would benefit from lock splitting
    necessarily exhibits contention for a lock more often than for the data guarded
    by that. If a lock guards two independent variables X and Y, and thread A wants
    to access X while B wants to access Y (as would be the case if one thread called
    adduser while another called addQuery in ServerStatus), then the threads are not
    contending for any data, even though they are contending for a lock.'
