  md: '# Java Concurrency in Practice


    models architectures, Java provides its own memory model, the JVM deals with the
    differences between the JMM and the underlying platform model by inserting memory
    barriers at the appropriate places.


    A convenient mental model for program execution is to imagine that there is a
    single order in which the operations happen in a program, regardless of what process
    execute them, and that each read of a variable will see the last write in the
    execution order to that variable. If this happy, unrealistic, model sequential
    consistency. Software developers often assume sequential consistency, but no multiprocessor
    processor sequential consistency and the JMM does not. The classical computing
    model, the von Neumann model, is only a vague approximation of how multiprocessors
    behave.


    The bottom line is that modern shared-memory-multiprocessors (and compilers) can
    do some things when data is shared across threads, unless you''ve not to them
    through the use of memory barriers. Fortunately, Java programs need not specify
    the placement of memory barriers; they only identify when shared state is accessed,
    through the proper use of synchronization.


    # 16.1. Reordering


    In describing cases and atomicity in Chapter 2, we used interactions depicting
    "unlucky timing" when the scheduler interleaved operations so as cause incorrect
    results in insufficiently synchronized programs. To make matters worse, the JVM
    can permit actors to execute in different orders from the perspective of different
    threads, making reasoning about the absence of synchronization even more complicated.
    The various reasons why operations might be delayed or appear to execute out of
    order can be grouped into the general category of reordering.


    Possible reordering in Listing 16.1 illustrates how difficult it is to reason
    about the behavior of the simplest concurrent programs unless they are correctly
    synchronized. It is fairly easy to imagine how possible reordering could print
    (1,0), or (0,1), or (0,1): thread A could run to completion before B, B could
    run to completion before A, or their actions could be interleaved. But, strangely,
    possible reordering could also print (0,0). The actions of each thread have no
    data dependency on each other, and accordingly can be executed out of order. (Even
    if they are executed in order, the timing by which they are flushed to memory
    can make it appear, from the perspective of B, that the assignments to A occurred
    in the opposite order.) Figure 16.1 shows a possible interleaving with reordering
    that results in printing (0,0).


    Figure 16.1. Interleaving Showing Reordering in Possible reordering.


    | ThreadA | y=b | reorder | a=1 |

    |---|---|---||

    | ThreadB | | b=1 | x=a (0) |


    Possible reordering is a trivial thing, and it is still surprisingly tricky to
    enumerate its possible results. Reordering at the memory level can make programs
    behave unexpectedly. It is prohibitively difficult to reason about the absence
    of synchronization; it is much easier to ensure that programs use synchronization
    appropriately. Synchronization inhibits the compiler, runtime, and hardware from
    reordering memory operations in ways that would violate the guarantees provided
    by the JMM.[1]


    > [1] On most processor architectures, the memory model is strong enough to ensure
    the performance cost of a volatile read is in line with a nonvolatile read.


    # 16.1.3. The Java Memory Model in 500 Words or Less


    The Java Memory Model is specified in 500 words, which include read and writes
    to variables, locks and unlocks of monitors, and joining with threads. The JMM
    defines a partial ordering.[2] happens-before all actions within the program.
    To guarantee that the thread action B can see the results of action A (whether
    not A and B in different threads), there must a happens-before relationship between
    A and B. In the absence of a happens-before order between threads, the JVM is
    free to reorder as it pleases.


    > [2] A partial ordering is a relation on that is antisymmetric, reflexive, and
    transitive; for any two elements x and y, it may not be the case that x is y or
    y is x. We use ordering every day to prefer preferences; we may prefer sushi over
    cheesurgers and Mozart to Mahler, but we don''t necessarily have a clear preference
    between cheesurgers and Mozart.'
