  md: "# Java Concurrency in Practice\n\n```\nA: transferMoney(myAccount, yourAccount,\
    \ 10);\nB: transferMoney(yourAccount, myAccount, 20);\n```\n\nWith unlucky timing,\
    \ A will acquire a lock on myAccount and wait for the lock on yourAccount, while\
    \ B is holding the lock on yourAccount and waiting for the lock on myAccount.\n\
    \nDeadlocks like one can be spotted the same way as in Listing.10 for nested locks.\
    \ Since the order of arguments is out of control, the problem is to induce an\
    \ ordering on the locks and acquire them according to the induced ordering consistently\
    \ throughout the application.\n\nOne way to induce ordering on objects is to use\
    \ system.identityHashCode, which returns the value that would be returned by object.hashCode().\
    \ Listing.10 shows a version of transfer method that uses system.identityHashCode\
    \ to induce a lock ordering. It introduces a few extra lines of code, but eliminates\
    \ the possibility of deadlock.\n\nIn the case that two objects have the same hash\
    \ code, we must use an arbitrary ordering of the acquires, and rethink the reindisibility\
    \ of deadlock. To prevent inconsistent lock ordering in this case, a third \"\
    breaking\" lock is used. By acquiring the tie-breaking lock before acquiring either\
    \ account, we ensure that one thread at a time performs the risky of acquiring\
    \ two accounts in an arbitrary ordering, eliminating the possibility of deadlock\
    \ (so long as this mechanism is used). If collisions occur, this technique might\
    \ become a bottleneck (just having a single, program-wide lock), but because collisions\
    \ with System.identityHashCode are infrequent, this technique provides that last\
    \ bit of safety at little cost.\n\n# Listing 10.3 Inducing a Lock Ordering to\
    \ Avoid Deadlock.\n\n```\nprivate final Object tieLock = new Object();\npublic\
    \ void transferMoney(final Account fromct,\n                           final Account\
    \ toct,\n                           final Dollar amount) {\n    class Helper {\n\
    \        public void transfer() throws InsufficientFundException {\n         \
    \   if (fromct.getBalance().compareTo(amount) < 0)\n                throw new\
    \ InsufficientFundException();\n            else {\n                fromct.debit(amount);\n\
    \                toct.credit(amount);\n            }\n        }\n    }\n    int\
    \ fromhash = System.identityHashCode(fromct);\n    int tohash = System.identityHashCode(toct);\n\
    \    if (fromhash < tohash) {\n        synchronized (fromct) {\n            synchronized\
    \ (toct) {\n                new Helper().transfer();\n            }\n    } else\
    \ if (fromhash > tohash) {\n        synchronized (toct) {\n            synchronized\
    \ (fromct) {\n                new Helper().transfer();\n            }\n    } else\
    \ {\n        synchronized (tieLock) {\n            synchronized (fromct) {\n \
    \               synchronized (toct) {\n                    new Helper().transfer();\n\
    \                }\n            }\n        }\n    }\n}\n```\n\nIf Account has\
    \ a unique, immutable, key such as an account number, inducing a lock ordering\
    \ is even easier: order objects by key, thus eliminating the need for the tie-breaking\
    \ lock.\n\nYou may think we are overestimating the risk of deadlock because locks\
    \ are only held briefly, but deadlocks are a serious problem in real systems.\
    \ A production application may perform billions of lock-acquire cycles per day.\
    \ Only one of these needs to be just right to bring the application to deadlock,\
    \ and even a thorough load-testing regimen may not disclose all deadlocks.[17]\
    \ Demonstrated deadlock in Listing 10.4[2] deadlocks fairly quickly on most systems."
