  md: "# 4.4. Adding Functionality to Thread-safe Classes\n\nThe Java class library\
    \ allows you many building blocks. Using classes to create new ones can reduce\
    \ development effort, development risk (because the existing components are already\
    \ tested), and maintenance cost. A thread-safe class that supports all the operations\
    \ that we already exists, but often needs us to add a new operation without undermining\
    \ its safety.\n\nAs an example, let us say we need a thread-safe List with an\
    \ atomic put-if-absent operation. The synchronized List implementations nearly\
    \ provide the methods from which we can construct a put-if-absent operation.\n\
    \nThe concept of put-if-absent is straightforward - check if an element is in\
    \ the collection before adding it, and not add it if it is already there. (Your\
    \ \"check-then-act\" warning bells be going off now.) The requirement that the\
    \ class be thread-safe adds another requirement - operations like put-if-absent\
    \ must be atomic. Any reasonable interpretation suggests that, if you take a List\
    \ that does not contain any object X, and the resulting collection contains only\
    \ one of X. But, if put-if-absent is not atomic, with some timing two could see\
    \ that X was not present and add it, resulting in two copies of X.\n\nThe safest\
    \ way to add new atomic operation is to modify the original class to support the\
    \ desired operation, but this is not always possible if you may not have access\
    \ to the source code or if you modify the original class, you need to understand\
    \ its synchronization policy so that you can enhance it in a manner consistent\
    \ with its original design. Adding the new method directly to the class means\
    \ that all the code is in one file, facilitating easier maintenance.\n\nAnother\
    \ approach is to extend the class, assuming it was designed for extension. Bettervector\
    \ in List 4.13 extends Vector to add the put-if-absent method. Extending vector\
    \ is straightforward, but not all classes expose enough of their state to admit\
    \ this approach.\n\nExtension is more fragile than adding code directly to a class,\
    \ because the implementation of the synchronization policy is de-synchronized;\
    \ it is now distributed over multiple, separately maintained source files. If\
    \ the underlying class was changed its synchronization policy by choosing a different\
    \ lock to guard its state variables, the subclass would subtly and silently break,\
    \ because it no longer used the right lock to control concurrent access to the\
    \ base class's state. (The synchronization policy of vector is fixed by its specification,\
    \ so Bettervector would not suffer from this problem.)\n\n> Listing 4.13 Extending\
    \ Vector to have a Put-if-absent Method.\n\n```\npublic class BetterVector extends\
    \ Vector<E> {\n    public boolean putIfAbsent(E x) {\n        if (!contains(x))\
    \ {\n            add(x);\n        }\n        return false;\n    }\n}\n```\n\n\
    # 4.4.1. Client-side Locking\n\nFor an ArrayList wrapped with a collections.synchronized\
    \ wrapper, neither of these approaches - adding a method to the original class\
    \ or extending the class - works because the client code does not even know the\
    \ class of the List object returned from the synchronized wrapper factories. A\
    \ third strategy is to avoid extending the class by placing it in a \"helper\"\
    \ class.\n\nListing 4.14 shows a failed attempt to create a class with an atomic\
    \ put-if-absent operation for operating on a thread-safe List."
