  md: "# Chapter 13 - Explicit Locks\n\nBefore Java 5.0, the only mechanisms for coordinating\
    \ access to shared data were synchronized and volatile. Java 5.0 adds another\
    \ option: ReentrantLock. Contrary to what some have written, ReentrantLock is\
    \ not a replacement for intrinsic locking, but rather an alternative with advanced\
    \ features for intrinsic locking purposes.\n\n# 13.1. ReentrantLock\n\nThe Lock\
    \ interface, in Listing 13.1, defines a number of abstract locking operations.\
    \ Unlike intrinsic locking, Lock offers a choice of unconditional, polled, timed,\
    \ and interruptible lock acquisition, and all lock and unlock operations are explicit.\
    \ Implementations must provide the same memory-visibility semantics as intrinsic\
    \ locks, but can differ in their scheduling algorithms, ordering guarantees, and\
    \ performance characteristics. (Lock.condition covered in)\n\nListing 13.1. Lock\
    \ Interface.\n\n```\npublic interface Lock {\n    void lock();\n    void lockInterruptibly()\
    \ throws InterruptedException;\n    boolean tryLock();\n    boolean tryLock(long\
    \ timeout, TimeUnit unit)\n        throws InterruptedException;\n    void unlock();\n\
    \    Condition condition();\n}\n```\n\nReentrantLock implements Lock, providing\
    \ the same mutual exclusion and memory-visibility guarantees as synchronized.\
    \ Acquiring a ReentrantLock has the same memory semantics as a synchronized block.\
    \ (Memory visibility is covered in Section 3.1 and in Chapter 16.) And, like synchronized,\
    \ Reentrantlocks offer reentrant locking (Section 2.3.2). ReentrantLock supports\
    \ all of the lock-acquisition modes defined by Lock, providing more flexibility\
    \ for dealing with unavailable locks than synchronized.\n\nCreate a new lock mechanism\
    \ that is not similar to intrinsic locking. Intrinsic locks work fine in most\
    \ situations but have functional limitations: it is not possible to interrupt\
    \ a thread waiting to acquire a lock, or to attempt to acquire a lock without\
    \ being willing to wait for it. Intrinsic locks must also be released in the same\
    \ block of code they were acquired. This simplified coding interacts nicely with\
    \ exception handling, but makes non-structured locking disciplines impossible.\
    \ None of these are reasons to abandon synchronized, but in some cases a more\
    \ flexible locking discipline offers better performance or versatility.\n\nListing\
    \ 13.2 shows the canonical for using a Lock. This idiom is more complicated than\
    \ using intrinsic locks: the lock must be released in a finally block. Otherwise,\
    \ the lock would never be released if the guarded code were to throw an exception.\
    \ When using lock, you must also consider what happens if an exception is thrown\
    \ out of the try block; if it is possible for the object to be left in an inconsistent\
    \ state, Try-catch or Try-finally blocks may be needed. (You should always consider\
    \ the effects of using any form of locking, including intrinsic locking.)\n\n\
    Failure to release a lock is a ticking time bomb. If you go off, you will have\
    \ a hard time tracing its origin back as there is no record of where or when the\
    \ lock has been released. This is reason not to use ReentrantLock as a blanket\
    \ substitute for synchronized: it is \"dangerous\" because it does not automatically\
    \ clean the lock when code guards the block. While remembering to release the\
    \ lock from a finally block is not difficult, it is also not impossible to forget.[1]\n\
    \n> [1]Findbugs has an \"unreleased lock\" identifying when a Lock is not released\
    \ in all code paths out of the block in which it was acquired.\n\nListing 13.2.\
    \ Guarding Object Using ReentrantLock.\n\n```\nLock lock = new ReentrantLock();\n\
    try {\n    // update object state\n} catch {\n    // catch exceptions and restore\
    \ invariants if necessary\n} finally {\n    lock.unlock();\n}\n```"
