  md: "# 6BPart III: Liveness, Performance, and Testing - 22BChapter 10. Avoiding\
    \ Liveness Hazards\n\nThe deadlock came about because the two threads attempted\
    \ to acquire the locks in a different order. If they asked for the locks in the\
    \ same order, there would be no cyclic locking dependency and therefore no deadlock.\
    \ If you guarantee that every thread that needs L and M at the same time acquires\
    \ L and M in the same order, there will be no deadlock.\n\n> A program will be\
    \ free of lock-ordering deadlocks if all threads acquire the locks they need in\
    \ a fixed global order.\n\nVerifying consistent lock ordering requires a global\
    \ analysis of your program's locking behavior. It is not sufficient to inspect\
    \ code paths that acquire multiple locks individually; both left and right are\
    \ \"reasonable\" ways to acquire the two locks, they are not compatible. When\
    \ it comes to locking, the left hand needs know what the right hand is doing.\n\
    \n# Listing 10.1. Simple Lock-ordering Deadlock. Don't Do this.\n\n![](img/c64daf12e0d6c877213813fc53c890a4_145_0.png)\n\
    \n```\n// Warning: deadlock-prone!\npublic class LeftrightDeadlock {\n    private\
    \ final Object left = new Object();\n    private final Object right = new Object();\n\
    \n    public void leftRight() {\n        synchronized (left) {\n            synchronized\
    \ (right) {\n                doSomething();\n            }\n        }\n    }\n\
    \    public void rightLeft() {\n        synchronized (right) {\n            synchronized\
    \ (left) {\n                doSomethingElse();\n            }\n        }\n   \
    \ }\n}\n```\n\n# 10.1.2. Dynamic Lock Order Deadlocks\n\nSometimes it is not obvious\
    \ that you have sufficient control over lock ordering to prevent deadlocks. The\
    \ harmful-locking code in Listing 10.2 that transfers funds from one account to\
    \ another. It acquires the locks on Account objects before executing the transfer,\
    \ ensuring that the balances are updated atomically and without violating invariants\
    \ such as \"an account cannot have a negative balance\"\n\nHow can transferMoney\
    \ appear as if all the threads acquire their locks in the same order, but in fact\
    \ the lock order depends on the order of arguments passed to transferMoney, and\
    \ in this turn might depend on external inputs. Deadlock can occur if two threads\
    \ call transferMoney at the same time, transferring from X to Y, and the other\
    \ doing the opposite:\n\n# Listing 10.2. Dynamic Lock-ordering Deadlock. Don't\
    \ Do this.\n\n![](img/c64daf12e0d6c877213813fc53c890a4_145_1.png)\n\n```\n// Warning:\
    \ deadlock-prone!\npublic void transferMoney(Account fromAccount,\n toAccount,\n\
    \ double amount)\nthrows InsufficientFundsException {\n    synchronized (fromAccount)\
    \ {\n        synchronized (toAccount) {\n            if (fromAccount.getBalance().compareTo(amount)\
    \ < 0)\n                throw new InsufficientFundsException();\n            else\
    \ {\n                fromAccount.debit(amount);\n                toAccount.credit(amount);\n\
    \            }\n        }\n    }\n}\n```\n\n![](img/c64daf12e0d6c877213813fc53c890a4_145_2.png)"
