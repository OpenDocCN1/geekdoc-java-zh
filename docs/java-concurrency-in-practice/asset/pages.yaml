  md: '# Chapter 7. Cancellation and Shutdown


    It is easy to start tasks and threads. Most of the time we allow them to stop
    by letting them run to completion. Completions, however, we want to stop tasks
    or threads earlier than they would on their own, perhaps because the user used
    a cancellation or an operation that needs to shut down.


    Getting tasks and threads to stop safely, quickly, and reliably is not always
    easy. Java does not provide any mechanism for forcing a thread to stop what it
    is doing.[11] Instead, provides interruption, a cooperative mechanism that lets
    one thread ask another what it is doing.


    > [11] The Deprecated Thread. Stop and suspend methods were attempt to provide
    such a mechanism, but were quickly realized to be seriously flawed and should
    be avoided. See http://java.sun.com/j2se/1.5.0/docs/guide/misc/threadPrimitiveDeprecation.html
    for an explanation of the problems with these methods.


    The cooperative approach is required because we want a task, thread, or service
    to stop. Instead, tasks and services can be coded so that, when requested, they
    clean up any work currently in progress and terminate. This provides greater flexibility,
    the task code itself is better able at stress cleanup than the code requesting
    cancellation.


    End-of-lifecycle issues can impact the design and implementation of tasks, services,
    and applications, and this important element of program design is too often ignored.
    Dealing with failure, shutdown, and cancellation is one of the characteristics
    that distinguish well-behaved approach from one that others works. This chapter
    addresses mechanisms for cancellation and interruption, and how to code tasks
    and services to be responsive to cancellation


    # 7.1. Task Cancellation


    An activity is cancellable if external code can move it to completion before its
    normal completion. There are a number of reasons why you might want to cancel
    the activity:


    User-requested cancellation. The user clicked on the "cancel" in a GUI application,
    or requested cancellation through a management interface such as JMX (Java Management
    Extensions).


    Time-limited activities. An application searches a problem space for a finite
    amount of time and chooses the best solution found within that time. When the
    timer expires, any tasks still searching are cancelled.


    Application events. An application searches a problem space by decomposing it
    into so that the different tasks search regions of the problem space. When one
    task finds a solution, all other tasks searching are cancelled.


    Errors. A web crawler searches for relevant pages, storing pages or summary data
    to disk. When a crawler encounters an error (for example, the disk is full), other
    crawling tasks are cancelled, possibly recording their current state so that they
    can be restarted.


    Shutdown. When an application or service is shut down, something must be done
    about what is currently being processed or queued for processing. In a graceful
    shutdown, tasks in progress may be allowed to complete; in an immediate shutdown,
    currently executing tasks must be cancelled.


    There is no way to preemptively stop a thread in Java, and therefore no safe way
    to preemptively stop a task. There are only cooperative mechanisms, by which the
    task and the code requesting follow an agreed-upon protocol.


    One cooperative mechanism is setting a "cancellation requested" flag that the
    task checks periodically; if the flag is set, the task terminates early. PrimeGenerator
    in Listing 7, which enumerates prime numbers until is cancelled, illustrates this
    technique. The cancel method sets the cancelled flag, and the main loop polls
    it before searching for the next prime. (For this to work, cancellation must be
    volatile).


    Listing 7.2 shows a sample of this class that lets the prime generator run for
    one second before cancelling it. The generator not necessarily stop after exactly
    one second, since there may be some delay between the time the cancellation is
    requested and the run loop next checks for cancellation. The cancel method is
    called from a finally block to ensure the prime generator is cancelled even if
    the call to sleep is interrupted. If cancel not called, the prime-seeking thread
    would run forever, consuming CPU cycles and preventing the JVM from exiting.'
