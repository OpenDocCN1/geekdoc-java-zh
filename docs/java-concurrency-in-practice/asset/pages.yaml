  md: '# Java Concurrency In Practice


    # 3.5.6. Sharing Objects Safely


    Whenever you acquire a reference to an object, you should know what you are allowed
    to do with it. Do you need to acquire a lock before using it Are you allowed to
    modify its state, or only to read it? Many concurrency errors stem from failing
    to understand these "rules of engagement" for a shared object. When you publish
    an object, you should document how the object can be accessed.


    The most useful policies for using and sharing objects in a concurrent program
    are:

    Thread-confined. A thread-confined object is owned exclusively by and confined
    to one thread, and can be modified by its owning thread.

    Shared read-only. A shared read-only object can be accessed concurrently by multiple
    threads without additional synchronization, but cannot be modified by any thread.
    Shared read-only objects include immutable and effectively immutable objects.

    Thread-safe. A thread-safe object performs synchronization internally, so multiple
    threads can freely access it through its public interface without further synchronization.

    Guarded. A guarded object can be accessed only with a specific lock held. Guarded
    objects include those that are encapsulated within other thread-safe objects and
    published objects that are known to be guarded by a specific lock.'
