    \    }\n}\n```\n```\n\n# 5.1.2. Iterator and ConcurrentModificationException\n\
    \nWe use vector for the sake of clarity in many of our examples, even though it\
    \ is considered a \"legacy\" class. But the more \"modern\" collection does not\
    \ eliminate the problem of compound actions. The standard way to iterate a collection\
    \ is with an Iterator, either explicitly or through the for-each loop syntax in\
    \ Java 5.0, but using Iterators does not need to use the lock during iteration\
    \ if other threads concurrently modify it. The iterators returned by the synchronized\
    \ collections are not designed to deal with concurrent modification, and they\
    \ are fail-safe—meaning that if they detect the collection has changed since last\
    \ iteration, they throw the unchecked ConcurrentModificationException.\n\nThese\
    \ fail-fast iterators are not designed to be foolproof; are designed to catch\
    \ concurrency errors on a \"good-fail-effort\" basis and thus act as early-warning\
    \ for concurrency problems. They are implemented by associating a modification\
    \ count with the collection: if the count changes during iteration, hasNext or\
    \ next throws ConcurrentModificationException. However, this check is done without\
    \ synchronization, so there is a risk of seeing a stale value of the modification\
    \ count and therefore the iterator does not realize a modification has been made.\
    \ This is a deliberate tradeoff to reduce the performance impact of the concurrent\
    \ modification detection code."
