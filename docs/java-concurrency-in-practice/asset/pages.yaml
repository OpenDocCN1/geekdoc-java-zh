    \ there is no way of knowing the state of the tasks in progress unless the tasks\
    \ perform some sort of checkpointing. To know which tasks have not completed,\
    \ you need to know which tasks didn't start, or which tasks were in progress when\
    \ the executor was shut down [6]\n\n[6] Furthermore, there is no shutdown option\
