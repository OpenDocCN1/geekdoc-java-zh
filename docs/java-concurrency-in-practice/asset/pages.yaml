  md: '# Java Concurrency in Practice


    For very large or unbounded pools, you can bypass queuing entirely and instead
    hand off tasks from producers to workers using a SynchronousQueue. A Synchronous
    is not really a queue at all, but a mechanism for managing handoffs between threads.
    In order to put an element on a synchronousqueue, another thread must be waiting
    to accept the handoff. If no thread is waiting but the current pool size is less
    than the maximum, ThreadPool creates a new thread; otherwise the task is rejected
    to the saturation policy. Using a direct handler is more efficient because the
    task can be handed to the thread that it will execute, rather than placing it
    in a queue and then having the worker fetch it from the queue. SynchronousQueue
    is a practical choice if the pool is unbounded or if rejecting tasks is acceptable.
    The newcachedThreadPool uses a synchronousqueue.


    Using a LinkedBlockingQueue or ArrayBlockingQueue tasks are started to be in the
    order they arrived. For more control over execution order, you can use a PriorityBlockingQueue
    which orders tasks by priority. Priority can be defined by natural (if tasks implement
    comparable) or by a comparator.


    The newThreadPool is a good choice for an Executor, providing better performance
    than a fixed thread pool.[5] A fixed thread pool is a good choice when you need
    to limit the number of tasks for resource-management purposes, as in a server
    application that accepts requests from network clients and would be vulnerable
    to overload.


    > [5] This performance difference comes from the use of SynchronousQueue implementation
    of LinkedBlocking-Queue. SynchronousQueue was replaced with a non-blocking algorithm
    that improved throughput in Executor benchmarks by a factor of three over the
    Java 5.0 SynchronousQueue implementation (Scher et al., 2006).


    Bounding the thread pool or the queue is suitable only when threads are independent.
    Tasks that depend on other tasks, bounded thread pools or queues can cause thread
    deadlock; otherwise, use an unbounded pool configured like newThreadPool.[6]


    > [6] An alternative for queues that submit other tasks and wait for its results
    is to use a bounded pool, SynchronousQueue as the queue, and the caller-runs saturation
    policy.


    # 8.3.3. Saturation Policies


    When a queue fills up, the saturation policy comes into play. The saturation policy
    for a ThreadPoolExecutor can be modified by setting ExecutionHandler when a task
    is submitted to an Executor that has been shut down. Several implementations of
    RejectedExecutionHandler are provided, each implementing a different strategy:
    AbortPolicy, CallerRunsPolicy, discardPolicy, and discardOldPolicy.


    The default policy, abort, causes execute to throw the unrejected Rejected-ExecutionException;
    the caller can catch this exception and implement its overflow handling as it
    fits. The discard policy discards the newly submitted task if it cannot be queued;
    the discardOldPolicy discards tasks that would otherwise be executed next and
    tries to submit the new task. (If the queue is a priority queue, this discards
    the highest-priority element, the combination of a discard-old policy and a priority
    queue is not a good one).


    The caller-runs policy implements a form of throttling that neither discards tasks
    nor exception, but slows down the flow of tasks by pushing the work back to the
    caller. It executes the newly submitted task not in a thread pool, but in the
    thread that calls it. If we modified our webserver example to use a bounded queue
    and the caller-runs policy, after all pool threads were occupied and the queue
    filled up the task would be executed in the main thread during the call. This
    would probably take some time as the main thread cannot submit any more tasks
    for a little while, while the worker threads have time to catch up on the backlog.
    The main thread would not also be calling during this time, so incoming requests
    would queue in the TCP layer instead of application. If this persisted, eventually
    the TCP layer would decide it has queued connection requests by discarding connection
    requests. As the server becomes overloaded, the overload is gradually pushed out
    - from the pool threads to the queue to the application and eventually to the
    client - making more graceful degradation under load.


    Choosing a saturation policy or making other changes to the execution policy can
    be done when the Executor is listed. 8.3 illustrates creating a fixed size thread
    pool with the caller-runs saturation policy.'
