  md: "# 6BPart III: Liveness, Performance, and Testing - 24BChapter12. Testing Concurrent\
    \ Programs\n\noff with values based on hashcode and nanoTime makes the sums so\
    \ unguessable and almost always different for\nrun.\n\n**Listing 12.4. Medium-quality\
    \ Random Number Generator Suitable for Testing.**\n\n```\nstatic int xorshift(int\
    \ y) {\n    y ^= (y << 6);\n    y ^= (y >> 21);\n    y ^= (y << 7);\n    return\
    \ y;\n}\n```\n\nPutTestSuite in 12.5 and 12.6 starts N producer threads that generate\
    \ elements and enqueue, and N\nconsumer threads dequeue them. Each thread updates\
    \ the checksum of the elements as they go in or out, using a\nthread checksum\
    \ that is combined at the end of the test run so that no synchronization or contention\n\
    ner required to test the buffer.\n\nDepending on your platform, creating and starting\
    \ a thread can be a heavyweight operation. If your is\nshort-running and you start\
    \ a number of threads in one, the threads run sequentially than concurrently in\n\
    the worst case. Even in the non-quite-worst case, the fact that the first thread\
    \ has a head on the others means\nwe may get fewer interleaves than expected:\
    \ the test run itself for some amount of time, and then the\nfirst two threads\
    \ run concurrently for some amount of time, and eventually are all the threads\n\
    concurrently. (the same thing happens at the end of the run: the threads have\
    \ a head start early finish.)\n\nWe presented a technique for this problem in\
    \ Section 5.5.1, using a countDownLatch as a starting gate andnasas a finish.\
    \ Another way to get the effect is to use a CyclicBarrier, initialized with the\
    \ number of\nworker threads plus one, and the worker threads and the test driver\
    \ wait at the barrier in the beginning and end of\nrun. This ensures that all\
    \ threads are up and running before any work start. PutTestSuite uses this technique\
    \ to\ncoordinate and stopping the worker threads, creating more potential concurrent\
    \ interleavings. We still can\ngarantee that the scheduler won't run each thread\
    \ to completion sequentially, but making the runs long enough\nreduces the extent\
    \ to which scheduling distorts our results.\n\nThe final trick is to use a deterministic\
    \ termination criterion so that no additional inter-\threads coordination is needed\
    \ to figure out when the test is finished. The test method starts exactly as many\
    \ producers\nconsumers and each of them takes the same number of elements, the\
    \ total number of items added and\nremoved is the same.\n\nTests like PutTestSuite\
    \ tend to be good at finding safety violations. For example, a common error in\
    \ implementing\nsemaphore-controlled buffers is to forget that the code actually\
    \ doing the insertion and extraction requires mutual\nclusion (using synchronized\
    \ or reentrantLock). A run of PutTestSuite with a version of Boundedbuffer that\n\
    makes doing correct synchronized PutTestSuite with a few dozen\nthreads iterating\
    \ a few million times on buffers of various capacity on various systems increases\
    \ our confidence about\nthe lack of data corruption in put and take.\n\nTests\
    \ should be run on multiprocessor systems to increase the diversity of potential\
    \ interleavings. However, having\nmore than a few CPUs not necessarily make tests\
    \ more effective. To maximize the chance of detecting timing-\nsensitive data\
    \ races, there should be more active threads than CPUs, so that at any given time\
    \ some threads are running\nand some are switched out, thus reducing the predictability\
    \ of interactions between threads."
