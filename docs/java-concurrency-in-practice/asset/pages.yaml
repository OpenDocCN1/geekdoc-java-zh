  md: "# Java Concurrency in Practice\n\nefficiency and responsiveness. If you have\
    \ high responsiveness requirements, you cannot call potentially long-running methods\
    \ that are not responsive to interruption, potentially restricting your options\
    \ for calling library code.\nnCancellation can involve state other than the interruption\
    \ status; interruption can be used to get the thread's attention, and information\
    \ stored by the interrupting thread can be used to provide further instructions\
    \ for the interrupted thread (Be sure to use synchronization when accessing that\
    \ information).\n\n# Listing 7.7. Non-cancelable Task that Restores Interruption\
    \ Before Exit.\n\n```\npublic Task getNext(BlockingQueue<Task> queue) {\n  boolean\
    \ interrupted = false;\n  try {\n    while (true) {\n      try {\n        return\
    \ queue.take();\n      } catch (InterruptedException e) {\n        interrupted\
    \ = true;\n        // fall through and retry\n      }\n    }\n    if (interrupted)\
    \ {\n      Thread.currentThread().interrupt();\n    }\n  }\n}\n```\n\nFor example,\
    \ when a worker thread by a ThreadPoolExecutor interruption, it checks the pool\
    \ is shut down. If so, it performs pool cleanup before returning; otherwise it\
    \ may create a new thread to restore the pool to the desired size.\n\n# 7.1.4.\
    \ Timed Run\n\nMany people can take forever to solve (e.g., enumerate all the\
    \ prime numbers); for others, the answer might be found reasonably quickly but\
    \ also take longer. Being able to \"spend up to ten minutes looking for the answer\"\
    \ or \"enumerate all answers in ten minutes\" can be useful in these situations.\n\
    ThesecondMethod in Listing 7.2 uses a PrimeGenerator and interrupts it after a\
    \ second. The PrimeGenerator might take longer than a second to start, it will\
    \ eventually notice the interrupt and stop, allowing the thread to terminate.\
    \ But after executing such a task is what you want to find out if the task threw\
    \ an exception. If PrimeGenerator throws an unchecked exception before the timeout\
    \ expires, it will probably go unnoticed, since the prime generator runs in a\
    \ separate thread that does not explicitly handle exceptions.\nListing 7.8 shows\
    \ an approach at running task for a given amount of time. It schedules a cancellation\
    \ task to interrupt it after a given time interval. This addresses the problem\
    \ of unchecked exceptions thrown from the task, since they can then be caught\
    \ by the caller of timedRun.\n\nThis is an apparently simple approach, but it\
    \ violates the rules: you cannot know a thread's interruption policy before interrupting\
    \ it. If the task completes before the timeout, the cancellation task interrupts\
    \ the thread in which timedRun was called off after the result has returned to\
    \ its caller. We don't know what is running when that happens, but the result\
    \ won't be good. (It is possible but surprisingly tricky to eliminate this by\
    \ using the scheduleFuture to cancel the cancellation task).\n\n# Listing 7.8.\
    \ Scheduling an Interrupt on a Borrowed Thread. Don't do this.\n\n![](img/c64daf12e0d6c877213813fc53c890a4_106_0.png)\n\
    \n```\nprivate static final ScheduledExecutorService cancelExec = ...;\npublic\
    \ static void timedRun(Runnable runnable,\n  long timeout, TimeUnit unit) {\n\
    \  final Thread taskThread = Thread.currentThread();\n  cancelExec.schedule(new\
    \ Runnable() {\n    public void run() { taskThread.interrupt(); }\n  }, timeout,\
    \ unit);\n  runnable.run();\n}\n```\n\nFurther, if the task is not responsive\
    \ to interruption, timedRun will not return until the task finishes, which may\
    \ be long after the desired timeout (or not at all). A timed run service that\
    \ doesn't return after the specified time is likely to be beating to its callers."
