  md: '# 12.1.2. Testing Blocking Operations


    Tests of concurrency properties require introducing more than one thread. Most
    testing frameworks are not concurrency-friendly; rarely include features to create
    threads or monitor them to ensure they do not fail unexpectedly. If a thread created
    by a test fails, the framework usually does not know which thread the test was,
    so work may be required to relay or failure information to the main thread so
    it can be reported.


    For the conformance tests of java.util.concurrent


    ```

    http://ge.c.oswepe.org/cgi-bin/viewcs/jsr16/asr/test/tck/JSR166TestCase.java

    ```


    If a method is blocked under certain conditions, then a test for blocking should
    succeed only if the thread does not proceed. Testing that method blocks is similar
    to testing that a method throws an exception; if the method returns null, the
    test has failed.


    Testing that a method blocks introduces an additional complication: once the method
    successfully blocks, how to interrupt it, and then assert that the blocking operation
    completes. Of this is a blocking activity in a separate thread, until the timeout
    requires your blocking methods to respond to interruption by returning early or
    throwing InterruptedException.


    > "Wait until the thread blocks" part is easier said than; in practice, you have
    to make an arbitrary decision of how long the few instructions could possibly
    take, and wait longer than that. You should be prepared to increase this value
    if you are wrong (in which case you will see spurious tests);


    List 12.3 shows an approach to testing blocking operations. A «taker» that attempts
    to take an element from an element buffer. If it succeeds, it registers a failure.
    The test runner thread starts the taker, waits a long time, and then interrupts
    it. If the thread has correctly blocked in the take operation, it will throw InterruptedException,
    and the catch block for this exception treats this as success and leaves the exit.
    The test runner thread then attempts to join with the taker thread and verifies
    that the join returned successfully by calling Thread.isAlive; if the thread responded
    to the interruption, the join should finish completely.


    The timed join ensures that the test completes if it gets stuck in some unexpected
    way. This test method tests several properties of takenot only that it blocks
    but, when interrupted, it throws InterruptedException. This is one of the cases
    in which it is appropriate to subclass Thread explicitly instead of using a runnable
    in a pool: or to test proper termination with join. The same approach can be used
    to test that the taker blocks after an element is placed in the queue by the main
    thread.


    It is tempting to use Thread.getState to verify that the thread is actually blocked
    on a condition wait, but this approach is not reliable. There is nothing that
    prevents a blocked thread from entering the WAITING or TIMED_WAITING state, as
    the JVM can choose to implement blocking by spin-waiting. Similarly, spurious
    wakeups from object.wait or condition.await are permitted (Chapter 14), a thread
    in the WAITING or TIMED_WAITING state may temporarily transition to RUNNABLE even
    if the condition for which it is waiting is not yet true. ignoring these implementation
    options, it may take some time for the target thread to settle into a blocking
    state. The result of Thread.getState should not be used for concurrency control,
    or of limited usefulness for testing - its is a source of debugging information.'
