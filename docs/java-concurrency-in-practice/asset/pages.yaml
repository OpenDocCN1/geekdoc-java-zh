  md: "# 58Part II: Structuring Concurrent Applications - 18Chapter 6. Execution\n\
    \nA less annoying but still sequential approach involves rendering the elements\
    \ first, leaving rectangular placeholders for the images, and after completing\
    \ the initial pass on the document, going back and downloading the images and\
    \ drawing them into the associated placeholder. This approach is shown in SingleThreadRenderer\
    \ Listing 6.10.\n\nDownloading an image mostly waits for I/O, and during this\
    \ time the CPU does little work. The sequential approach may underutilize the\
    \ CPU, and also makes the user wait longer to see the finished page. We can achieve\
    \ better utilization and responsiveness by breaking the problem into independent\
    \ tasks that can execute concurrently.\n\n# Listing 6.10. Rendering Elements Sequentially.\n\
    \n```\npublic class SingleThreadRenderer {\n    void render(CharSequence source)\
    \ {\n        renderPlaceholder(source);\n        List<ImageData> imageData = new\
    \ ArrayList<>();\n        for (Image imageInfo : scanForImage(source)) {\n   \
    \         imageData.add(imageInfo.downloadImage());\n        }\n        renderImage(imageData);\n\
    \    }\n}\n```\n\n![](img/c64daf12e0d6c877213813fc53c890a4_95_0.png)\n\n# 6.3.2.Result-returning\
    \ Tasks: Callable and Future\n\nThe Executor framework uses Runnable as its basic\
    \ task representation. Runnable is a fairly limiting abstraction; run cannot return\
    \ a value or throw checked exceptions, although it can have side effects such\
    \ as writing to a log file or producing a result in a shared data structure.\n\
    \nMany tasks are effectively deferred computations - executing a database query,\
    \ fetching a resource over the network, or computing a complex function. For these\
    \ types of tasks, Callable is a better abstraction: it expects that its entry\
    \ point, call(), will return a value and anticipates that it might throw exception.[7]\
    \ Executors includes several utility methods for wrapping other types of tasks,\
    \ including Runnable and java.security.PrivilegedAction, with a Callable.\n\n\
    > [7]To express a non-value-returning task with Callable, use Callable<Void>.\n\
    \nRunnable and callable describe abstract computational tasks. Tasks are usually\
    \ finite: they have a clear starting point and they eventually terminate. Since\
    \ tasks can take a long time to run, we also want to be able to cancel a task.\
    \ A task that has been submitted but not yet started can always be cancelled,\
    \ and tasks that have started can be cancelled if they are responsive to interruption.\
    \ Cancelling a task that has already completed has no effect. (Cancellation is\
    \ covered in detail in chapter 7).\n\nFuture represents the lifecycle of a task\
    \ and provides methods to test whether a task has completed or cancelled, retrieve\
    \ its result, and cancel the task. Callable and Future are shown in Listing 6.11.\
    \ The specification of Future is that task lifecycle can only move forward, not\
    \ backwards - just like the ExecutorService\n\nThe behavior of get varies depending\
    \ on the task state (not started, running, completed). It returns immediately\
    \ or throws an Exception if the task has already completed, but if it blocks until\
    \ the task completes. If the task completes by throwing an exception, get rethrows\
    \ it wrapped in an ExecutionException; if it was cancelled, it throws CancellationException.\
    \ If get throws ExecutionException, the underlying exception can be retrieved\
    \ with getCause."
