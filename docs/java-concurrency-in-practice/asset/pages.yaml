  md: "# Java Concurrency in Practice\n\nListing 4.14. Non-thread-safe Attempt to\
    \ Implement Put-if-absent. Don't do this.\n\n```\npublic class ListHelper<E> {\n\
    \    public List<E> list =\n        Collections.synchronizedList(new ArrayList<E>());\n\
    \n    public synchronized boolean putIfAbsent(E x) {\n        boolean absent =\
    \ !list.contains(x);\n        if (absent) {\n            list.add(x);\n      \
    \  }\n        return absent;\n    }\n}\n```\n\nWhy wouldn't this work? After putIfAbsent\
    \ is synchronized, right? The problem is that it synchronizes on the wrong lock.\
    \ Whatever the List uses to guard its state, it's not the lock on the ListHelper.\
    \ ListHelper provides only the illusion of synchronization; the various list operations,\
    \ all synchronized, use different locks, which means that putIfAbsent is not atomic\
    \ relative to other operations the List. There is no guarantee that another thread\
    \ would not modify the list while putIfAbsent is executing.\n\nTo make this approach\
    \ work, we have to use the List by using client-side locking or external locking.\
    \ Client-side locking entails guard classes that use some object X with the List\
    \ to guard its own state. In order to use client-side locking, we must know what\
    \ List X uses.\n\nThe documentation for vector and the synchronized wrapper classes\
    \ states, albeit obliquely, they support client-side locking, by using the intrinsic\
    \ lock for the wrapper (not the wrapped collection). Listing 4.15 shows a putIfAbsent\
    \ operation on a thread-safe List that uses client-side locking.\n\nListing 4.15.\
    \ Implementing Put-if-absent with Client-side Locking.\n\n```\npublic class ListHelper<E>\
    \ {\n    public List<E> list =\n        Collections.synchronizedList(new ArrayList<E>());\n\
    \n    public synchronized boolean putIfAbsent(E x) {\n        boolean absent =\
    \ !list.contains(x);\n        if (absent) {\n            list.add(x);\n      \
    \  }\n        return absent;\n    }\n}\n```\n\nIf extending another atomic operation\
    \ is fragile because it distributes the locking code for a class over multiple\
    \ classes in an object hierarchy, client-side locking is even more fragile because\
    \ it entails putting locking code for class C into classes that are totally unrelated\
    \ to C. Exercise when using client-side locking on classes that do not commit\
    \ to their strategy.\n\nClient-side locking has a lot in common with class extension\
    \ - they both control the behavior of the derived class to the implementation\
    \ of the base class. Just as views encapsulation of implementation [EJ Item 14],\
    \ client-side locking violates encapsulation of synchronization policy.\n\n# 4.4.2.\
    \ Composition\n\nThere is a false alternative for adding an atomic operation to\
    \ an existing class: ImprovedList in 4.16 shows the List operations by delegating\
    \ them to an underlying List instance, and adds an atomic putIfAbsent method.\
    \ ImprovedList assumes that once a List is passed to its constructor, the client\
    \ will not use the underlying list directly, after all\n\nImprovedList adds an\
    \ additional level of locking using its own intrinsic lock. It does not care whether\
    \ the List is thread-safe, because it provides its own consistent locking that\
    \ provides thread safety even if the List is not thread-safe or changes its locking\
    \ implementation. With the extra layer of synchronization may add some performance\
    \ penalty,[7] the implementation in ImprovedList is less fragile than attempting\
    \ to mimic the locking"
