  md: "# 5BPart II: Structuring Concurrent Applications - 19BChapter 7. Cancellation\
    \ and Shutdown\n\nInterruptedException or otherwise indicating interruption. This\
    \ technique can protect structures from corruption when an activity is interrupted\
    \ in the middle of an update.\n\nA task should not make assumptions about the\
    \ interruption policy of its executing thread unless it is explicitly designed\
    \ to run within a service that has a specific interruption policy. Whether a task\
    \ interprets interruption as cancellation or takes some other action on interruption,\
    \ it should take care to preserve the executing thread's status. If it is not\
    \ going to propagate InterruptedException to its caller, it should restore the\
    \ interruption status after catching InterruptedException:\n\n```\nThread.currentThread().interrupt();\n\
    ```\n\nJust as task code should not make assumptions about what interruption means\
    \ to its executing thread, cancellation code should not make assumptions about\
    \ the interruption policy of arbitrary threads. A thread should be interrupted\
    \ only by its owner; the owner can encapsulate knowledge of the thread's policy\
    \ in an appropriate cancellation mechanism such as a shutdown method.\n\nBecause\
    \ each thread has its own interruption policy, you should not interrupt a thread\
    \ unless you know what interruption means to that thread.\n\nCritics have debated\
    \ the Java interruption mechanism because it does not provide a preemptive interruption\
    \ capability and yet developers do. However, the ability to postpone an interruption\
    \ request enables developers to create flexible interruption policies that balance\
    \ responsiveness and robustness as appropriate for the application.\n\n# 7.1.3.\
    \ Responding to Interruption\n\nAs mentioned in Section 5.4, when you call an\
    \ interruptible blocking method as Thread.sleep or BlockingQueue.put, there are\
    \ two practical strategies for handling InterruptedException:\n\n+   * Propagate\
    \ the exception (possibly after some task-specific cleanup), making your method\
    \ an interruptible blocking method, or;\n* Restore the interruption status so\
    \ code higher up on the stack can deal with it.\n\nPropagating InterruptedException\
    \ can be as easy as adding InterruptedException to the clause, as shown by getNext\
    \ in Listing 7.6.\n\n# Listing 7.6. Propagating InterruptedException to Callers.\n\
    \n```\nBlockingQueue<Task> queue;\npublic Task getNext() throws InterruptedException\
    \ {\n    return queue.take();\n}\n```\n\nIf you don't want to propagate InterruptedException\
    \ (perhaps because your task is defined by a Runnable), you need to find another\
    \ way to restore the interruption request. The standard way to do this is to restore\
    \ the interruption status by calling interrupt. You should not swallow the InterruptedException\
    \ by catching it and doing nothing in the catch, unless you are actually implementing\
    \ the interruption policy for your thread. Prime allows interrupts, but so that\
    \ you know the thread is interrupted and therefore there is no code higher up\
    \ on the stack that needs to know about the interruption. Most code does not know\
    \ what thread will run in and so should restore the interrupted status.\n\nOnly\
    \ code that implements a thread's interruption policy may swallow an interruption\
    \ request. General-purpose task and library code should never swallow interruption\
    \ requests.\n\nActivities that do not support cancellation but still interruptible\
    \ blocking methods will have to call them in a loop, when interruption is detected.\
    \ In this case, they should save the interruption status locally and restore it\
    \ after returning, as shown in Listing 7.7, rather than after immediately calling\
    \ InterruptedException. Setting the interruption status too early could result\
    \ in an infinite loop, so interruptible blocking methods must check the interrupted\
    \ status on entry and throw InterruptedException if it is. (Interruptible methods\
    \ usually poll for interruption before or doing any significant work, so as to\
    \ be responsive to interruption as possible.)\n\nIf your code does not interruptible\
    \ blocking methods, it can still be responsive to interruption by polling the\
    \ current thread's interrupted status throughout the task code. Choosing a polling\
    \ frequency is a tradeoff"
