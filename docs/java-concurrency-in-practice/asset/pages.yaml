  md: '# Java Concurrency In Practice


    In programs that use fine-grained locking, audit your code for deadlock freedom
    using a two-part strategy: first, identify where multiple locks could be acquired
    (try to make this small set), and then perform a global analysis of all such instances
    to ensure that lock ordering is consistent across your entire program. Using open
    calls wherever possible simplifies this analysis. With no open calls, finding
    where multiple locks are acquired is fairly easy, either by review or by automated
    bytecode or source code analysis.


    # 10.2.1. Timed Lock Attempts


    Another technique for detecting and recovering from deadlocks is to use the tryLock
    feature of the explicit lock (see Chapter 13) instead of intrinsic locking. Intrinsic
    locks wait forever if they acquire the lock, explicit locks let you specify a
    timeout until tryLock returns. By using a timeout that is much longer than you
    expecting the lock to take, you can regain control when something unexpected happens.
    (13.3 on page 280 shows an alternative implementation of using the polled tryLock
    with retries for probabilistic avoidance.)


    When a lock attempt fails, you do not necessarily know why. Maybe there was a
    deadlock; thread may erroneously enter an infinite loop while holding the lock;
    or some thread is running a lot slower than you expected. Still, at least you
    have the opportunity to recover that failed attempt, any useful information about
    what you were trying to do, and restart the computation somewhat gracefully while
    killing the process.


    Using lock acquisition to acquire multiple locks can be effective against deadlock
    when locking is not used consistently throughout the program. If a lock acquisition
    times out, you can release the locks, back off and wait for a while, and try again,
    possibly clearing the deadlock condition and allowing the program to recover.
    (This technique works only when two locks are acquired; if multiple locks are
    acquired due to the nesting of method calls, you cannot just release the outer
    lock, even if you know it)


    # 10.2.2. Deadlock Analysis with Thread Dumps


    While preventing deadlocks is important, the JVM can help identify when they happen
    using thread dumps. A thread dump includes a trace for each running thread, similar
    to the stack that accompanies an exception. Thread dumps also include locking
    information, such as locks are held by each thread, in which stack they were acquired,
    and which lock blocked is waiting to acquire. [4] Before generating a thread dump,
    the JVM searches the is-waiting for graph to find deadlocks. If it finds one,
    it includes deadlock identification which locks and threads are involved, and
    in where the program the offending locks are acquired.


    > [4] This information is useful for debugging even when you don''t have a deadlock;
    periodically triggering thread dumps lets you observe your program''s behavior.


    To trigger a thread dump, you can send the JVM process SIGQUIT (kill -11) on Unix
    platforms, or press the Ctrl-~ key on Ctrl-Break on Windows platforms. Many IDs
    can recover a thread dump with


    If you are using explicit locking, Java 5 has no support for supporting lock information
    with the thread dump; Explicit Locks do not show up in all thread dumps. Java
    6 includes thread dump support deadlock detection with explicit locks, but the
    information on where locks is acquired is less precise than intrinsic locks. Intrinsic
    locks are associated with the stack in which they were acquired; Explicit Locks
    are associated only with the acquiring thread.


    Listing 10.7 portions of the thread dump from a production JEE application. The
    failure that caused the deadlock involves three componentsa JEE application, a
    JEE container, and a JDBC viewer, each from different vendors (The names have
    been protected to protect the privacy.)All three were commercial products that
    had been through extensive testing cycles; each had a bug that was hanging until
    all they interacted and caused a fatal server failure.


    We''ve shown only the portion of the thread dump relevant to the deadlock. The
    JVM has done a lot of work for diagnosing the deadlock which are causing the program,
    which threads are involved, which other locks they hold, and other threads are
    indirectly inconvenienced. One thread holds the lock on the MumbleDBConnection
    and is waiting to acquire the lock on the MumbleBCallableStatement; the other
    holds the lock on the MumbleBCallableStatement and is waiting for the lock on
    the MumbleDBConnection.'
