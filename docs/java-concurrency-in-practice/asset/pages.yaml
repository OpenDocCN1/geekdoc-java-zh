    this\") private int count;\n\n    protected BoundedBuffer(int capacity) {\n  \
    \      this.buf = (V[]) new Object[capacity];\n    }\n\n    protected synchronized\
    \ final void doPut(V v) {\n        buf[tail] = v;\n        if (++tail == buf.length)\
    \ {\n            tail = 0;\n        }\n        count++;\n    }\n\n    protected\
    \ synchronized final V doTake() {\n        V v = buf[head];\n        if (++head\
    \ == buf.length) {\n            head = 0;\n        }\n        count--;\n     \
    \   return v;\n    }\n\n    public synchronized final boolean isFull() {\n   \
    \     return count == buf.length;\n    }\n\n    public synchronized final boolean\
    \ isEmpty() {\n        return count == 0;\n    }\n}\n```\n\n# Listing 14.3. Bounded\
    \ Buffer that Blarks When Preconditions are Not Met.\n\n![](img/c64daf12e0d6c877213813fc53c890a4_196_0.png)\n\
    \n```\n@ThreadSafe\npublic class GrumpyBoundedBuffer<V> extends BoundedBuffer<V>\
    \ {\n    public GrumpyBoundedBuffer(int size) { super(size); }\n\n    public synchronized\
    \ void put(V v) throws BufferFullException {\n        if (isFull()) {\n      \
    \      throw new BufferFullException();\n        }\n        doPut(v);\n    }\n\
    \n    public synchronized V take() throws BufferEmptyException {\n        if (isEmpty())\
