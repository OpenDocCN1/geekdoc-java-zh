  md: "# Java Concurrency in Practice\n\nBoundedbuffer meets the one-one, one-out\
    \ requirement, but does not meet the waiters requirement because waiting threads\
    \ might be waiting for the \"full\" or \"not empty\" condition. A \"starting gate\"\
    \ latch like used in testHashMap on page 96, in which a single event releases\
    \ a set of threads, does not meet the one-one, one-out requirement because the\
    \ starting gate lets multiple threads.\n\nMost classes do not meet these requirements,\
    \ so the prevailing wisdom is to use notifyAll() in preference to notify(). While\
    \ not efficient, it is much safer to ensure that your classes behave correctly\
    \ when using notifyAll() instead of notify.\n\n\"This prevailing wisdom\" makes\
    \ some people uncomfortable, and for good reason. Using notifyAll() when only\
    \ one thread can make progress is inefficient sometimes, little quite so. If threads\
    \ are waiting on a condition, calling notifyAll() causes each of them to wake\
    \ up and contend for the lock; most or all of them will go back to sleep. This\
    \ makes a lot of context switches and a lot of lock acquisitions for each event\
    \ that (enables) a single thread to progress. In the worst case, notifyAll results\
    \ in O(n) wakeups where n would suffice. This is another situation where performance\
    \ concerns support one approach and safety concerns support the other.\n\nThe\
    \ notification by put and take in Boundedbuffer is conservative: a notification\
    \ is performed every time an object is put or removed from the buffer. This could\
    \ be optimized by observing that a thread can be released only if the buffer goes\
    \ from empty to full or full to empty, and not only if a put or take one of these\
    \ states transitions. This is called conditional notification. While conditional\
    \ notification can improve performance, it is tricky to get right (and complicates\
    \ the implementation of subclasses) and should be carefully used. Caring uses\
    \ conditional notification in BoundedBuffer.\n\nSingle notification and conditional\
    \ notification are optimizations. Always, follow the \"First make it right, and\
    \ then make it if it is not fast enough\" when using these; it is easy to introduce\
    \ strange failures by following them incorrectly.\n\nList 14.8. Using Conditional\
    \ Notification in BoundedBuffer.put.\n\n```\npublic synchronized void put(V v)\
    \ throws InterruptedException {\n    while (full()) {\n        wait();\n    }\n\
    \    boolean isEmpty = isEmpty();\n    put(v);\n    if (isEmpty) {\n        notifyAll();\n\
    \    }\n}\n```\n\n# 14.2. Example: A Gate Class\n\nThe starting gate in TestHashMap\
    \ on page 96 was constructed with an initial count of one, creating a binary gate:\
    \ one with two states, the initial state and the terminal state. The gate prevents\
    \ passing the starting gate until it is opened, at which point all the threads\
    \ can pass through. This latching mechanism is often exactly what is needed, sometimes\
    \ it is a drawback that a gate constructed in this manner cannot be reopened once.\n\
    \nIt is easy to develop a recloseable ThreadGate using condition waits, as shown\
    \ in List 14.9. ThreadGate lets gate be opened and closed, providing an open method\
    \ that blocks until the gate is opened. The open method uses notifyAll() because\
    \ because the semantics of this class follow the \"one-in, one-out\" test for\
    \ notification.\n\nThe condition predicate used by await is more complicated than\
    \ simply testing isEmpty. This is necessary if N threads are waiting at the gate\
    \ at the time it is opened, they should all be allowed to proceed. If the gate\
    \ is opened and closed in rapid succession, all threads might not be released\
    \ if await examines only isEmpty; by the time the threads receive the notification,\
    \ reacquire the lock, and emerge from wait, the gate may have closed again. So\
    \ Threadgate uses a somewhat complicated predicate: every time the gate is incremented,\
    \ and a thread may pass if the gate is open or if the gate has opened since this\
    \ thread arrived at the gate.\n\nSince Threadgate only supports waiting for the\
    \ gate to open, it performs notification only in open; to support \"wait for open\"\
    \ and \"wait for close\" operations, one have to notify in both open and close.\
    \ This illustrates why state-dependent classes are fragile to maintain the addition\
    \ of a new statedependent operation may require modifying code paths that modify\
    \ the object state so that the appropriate notifications can be performed."
