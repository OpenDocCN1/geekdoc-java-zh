    +   - Placing a key or value in a Hashtable, synchronizedMap, or Concurrent-Map
    publishes it to any thread that retrieves it from the Map (whether directly or
    via its iterator);

    - Placing an element in a CopyOnWriteArrayList, synchronizedList, or synchronizedSet
    publishes it to any thread that retrieves it from the collection;

    - Placing an element in a BlockingQueue or a concurrentLinkedQueue publishes it
    to any thread that retrieves it from the queue.


    Other mechanisms in the class library (such as Future and Exchanger) also constitute
    safe publication; we will identify these as providing safe publication as they
    are introduced.


    Using a static initializer is the easiest and fastest way to publish objects that
    can be statically constructed:


    ```

    public static Holder holder holder = new Holder(42);

    ```


    Static initializers are executed by the JVM at class initialization time; because
    of internal synchronization in the JVM, the mechanism is guaranteed to publish
    any objects initialized in this way [JLS 12.4.2].


    # 3.5.4. Effectively Immutable Objects


    Safe publication is sufficient for threads to access objects that are not going
    to be modified after publication without additional synchronization. The safe
    publication mechanisms guarantee that the as-published state of an object is visible
    and, if state is not going to be changed again, it is sufficient to ensure that
    any access is safe.


    Objects that are not truly immutable, but will not be modified after publication,
    are called effectively immutable. They merely need to be treated by the program
    as if they were immutable after they are published. Using effectively immutable
    objects can simplify software development and improve performance by reducing
    the need for synchronization.


    Safely published effectively immutable objects can be used by any thread without
    additional synchronization.


    For example, Date is mutable,[17] but if you use it as it were immutable, you
    would be able to eliminate the lock that would otherwise be required when shared
    a date across threads. Suppose that you want to maintain a Map storing the last
    login time of each user:


    > [17] This was probably a mistake in the class library design.


    ```

    public Map<String, Date> lastLogin = synchronizedMap(new HashMap<String, Date>());

    ```


    If the date values are not modified after they are in the Map, then the synchronization
    in the synchronizedMap implementation is sufficient to publish the date values,
    and no additional synchronization is needed when accessing them.


    # 3.5.5. Mutable Objects


    If an object may be modified after construction, safe publication ensures only
    the visibility of the as-published state, but every time the object is accessed
    to ensure visibility of subsequent modifications. To share mutable objects, they
    must be safely published and either thread-safe or guarded by a lock.


    The publication requirements for an object depend on its mutability:


    +   - Immutable objects can be published through any mechanism;

    - Effectively immutable objects must be safely published;

    - Mutable objects must be safely published, and must be either thread-safe or
    guarded by a lock.'
