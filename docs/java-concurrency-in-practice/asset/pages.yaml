  md: "# 13.4. Choosing Between Synchronized and ReentrantLock\n\nReentrantLock provides\
    \ the same locking and memory semantics as intrinsic locking, as well as additional\
    \ features such as timed locks, interruptible lock waits, fairness, and the ability\
    \ to implement non-block-structured locking. The performance of reentrantLock\
    \ appears to dominate that intrinsic locking, slightly winning on Java 6 and dramatically\
    \ on Java 5.0. So why not deprecate synchronization and encourage all new concurrent\
    \ code to use ReentrantLock? Some authors have found this, synchronizing as a\
    \ \"legacy\" construct. But this is making a good thing too far.\n\nIntrinsic\
    \ locks have significant advantages over explicit locks. The notation is familiar\
    \ and compact, and many existing programs already use intrinsic locking making\
    \ it confusing and error-prone. ReentrantLock is definitely a more dangerous tool\
    \ than synchronization; if you forget to unlock the lock in a finally block, your\
    \ code will badly appear to run properly, but you've created a time bomb that\
    \ will hurt innocent bystanders. Save ReentrantLock for situations where you need\
    \ ReentrantLock which provides intrinsic locking doesn't.\n\nReentrantLock is\
    \ an advanced tool for situations where intrinsic locking is not practical. Or\
    \ if you need its features: timed, ordered, or interruptible lock acquisition,\
    \ fairness, or non-block-structured locking. Otherwise, prefer synchronized.\n\
    \nUnder Java 5.0, intrinsic locking has another advantage over ReentrantLock:\
    \ thread dumps show which classes acquired locks. The JVM knows nothing about\
    \ which threads hold ReentrantLocks and therefore cannot help in debugging problems\
    \ with ReentrantLock. This disparity is addressed in Java 6 by providing a management\
    \ and monitoring interface with which locks register, enabling locking information\
    \ for reentrantLocks to appear in thread dumps and other management and debugging\
    \ interfaces. The availability of this information for debugging is a substantial,\
    \ if mostly, advantage for synchronized; locking information in thread dumps has\
    \ saved many programmers from utter contention. The non-structured nature of ReentrantLock\
    \ still means that lock acquisitions cannot be tied to specific frames, as with\
    \ intrinsic locks.\n\nFuture improvements are likely to favor synchronization\
    \ over ReentrantLock. Because synchronized is built into the JVM, it can perform\
    \ optimizations such as lock elision for overlapping locks and coarsening to eliminate\
    \ synchronization with intrinsic locks (see Section 13.3.2); doing this with library-based\
    \ locks seems far less likely. Unless you are deploying on Java 5.0 for the foreseeable\
    \ future and you have a demonstrated need for ReentrantLock's scalability benefits\
    \ on platform, it is not a good idea to choose ReentrantLock over synchronized\
    \ for performance reasons.\n\n# 13.5. Read-Write Locks\n\nReentrantLock implements\
    \ a standard mutual-exclusion lock: at most one at a time can hold a ReentrantLock.\
    \ But mutual exclusion is a stronger locking discipline than needed to preserve\
    \ data integrity, and thus limits concurrency than necessary. Mutual exclusion\
    \ is a conservative locking strategy that protects writer/writer and reader/writer\
    \ accesses as \"read-mostly\". In many cases, data structures are \"read-mostly\"\
    \ and are mutable and sometimes modified, but most accesses involve only reading.\
    \ In these cases, it would be nice to relax the locks which allows multiple readers\
    \ to access the data structure at once. As long as each read is guaranteed an\
    \ up-to-date view of the data and no other thread modifies the data while the\
    \ readers are viewing it, there will be no problems. What this read-write locks\
    \ use: a resource can be accessed by multiple readers or a writer at a time, not\
    \ both.\n\nReadWriteLock, shown in Listing 13.6, exposes two Lock objects for\
    \ reading and for writing. To read data guarded by a ReadLock you must first acquire\
    \ the lock, and to modify data guarded by a WriteLock you must first acquire the\
    \ lock. There may appear to be two separate locks, the read lock and write lock\
    \ are simply different views of an integrated read-write lock object.\n\nListing\
    \ 13.6. ReadWriteLock Interface.\n\n```\npublic interface ReadWriteLock {\n  \
    \  Lock readLock();\n    Lock writeLock();\n}\n```"
