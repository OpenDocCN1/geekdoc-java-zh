  md: '# # Chapter 10. Avoiding Liveness Hazards


    There is often a tension between safety and liveness. We use locking to ensure
    thread safety, but indiscriminate use of locking can cause lock-ordering deadlocks.
    Similarly, we use thread pools and semaphores to bound resource consumption, but
    failure to understand the activities being bounded can cause resource deadlocks.
    Java applications do not recover from deadlock, so it is worthwhile to ensure
    your design prevents the conditions that could cause it. This chapter explores
    some of the cases of liveness hazards and what can be done to prevent them.


    # 10.1. Deadlock


    Deadlock is illustrated by the classic, if somewhat unpleasant, "dining philosophers"
    problem. If five philosophers go for Chinese food and are seated at a circular
    table, there are five chopsticks (not five pairs), one placed between each diner.
    The philosophers alternate between thinking and eating. Each needs to acquire
    two chopsticks to eat, but then puts the chopsticks back and return to thinking.
    There are some chopstickmanagement algorithms that let everyone eat on or less
    busy (a hungry philosopher tries to grab both chopsticks, but if one is not available,
    puts the one that is available and waits a minute or so before trying), and some
    can result in one or all of the philosophers dying of hunger (a philosopher immediately
    grabs the chopstick to his left and waits for the chopstick to his right to be
    put down). The situation, where each has a resource needed by another and is waiting
    for a resource held by another, and will not proceed, is a deadlock.


    When a thread holds a lock, other threads attempting to acquire that lock will
    block forever waiting. When thread A holds lock L and tries to acquire M, at the
    same time B holds M and tries to acquire L, both will wait forever. This situation
    is the simplest case of deadlock (or deadly embrace), where multiple threads are
    represented as the nodes of a directed graph and whose-edges represent the relation
    "Thread A is waiting for a resource held by B". If this graph is cyclic, there
    is a deadlock.


    Database systems are designed to detect and recover from deadlock. A transaction
    may acquire many locks, and locks are held until the transaction commits. So it
    is possible, and in fact not uncommon, for two transactions to deadlock (as well).
    Without intervention, they would wait forever (holding locks that are probably
    needed by other transactions (as well)). But the database server is not going
    to let this happen. When it detects that a set of transactions is deadlocked (which
    it does by checking the is-waiting-graph for cycles), it picks a victim and aborts
    that. This releases the locks held by the victim, allowing the other transactions
    to proceed. The application can then retry the transaction, which may be able
    to complete now that competing transactions have completed.


    The JVM is not capable of resolving deadlocks as database servers. When a set
    of Java threads deadlock, that''s the end of the threads threads of communication.
    Depending on what those threads do, the application may stall, a particular subsystem
    may crash, or performance may suffer. The only way to restore the application
    to health is to abort and restart the whole thing so it doesn''t happen again.


    Like other concurrency hazards, deadlocks rarely manifest themselves immediately.
    The fact that a class has a potential deadlock doesn''t mean that it will deadlock,
    just that it can. When deadlocks manifest themselves, it is often at the worst
    possible time heavy load production.


    # 10.1.1. Lock-ordering Deadlocks


    LeftDeadlock in Listing 10.1 is at risk for deadlock. The leftLeft and right methods
    each acquire the left and right locks. If one thread calls left and another calls
    right, and their actions are interleaved as shown in Figure 10.1, they will deadlock.


