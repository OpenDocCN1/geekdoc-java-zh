  md: "# 7BPart iv: Advanced Topics - 28BChapter 16. The Memory Model\n\nInitialization\
    \ safety means Safestates in Listing 18 could be safely published through unsafe\
    \ lazy initialization or storing a reference to Safestates in a public static\
    \ field with no synchronization, even it uses no synchronization and relies on\
    \ the non-thread-safe has.\n\n```\nListing 16.8. Initialization Safety for Immutable\
    \ Objects.\n@ThreadSafe\npublic class Safestates {\n    private final Map<String,\
    \ String> states;\n\n    public Safestates() {\n        states = new HashMap<String,\
    \ String>();\n        states.put(\"alaska\", \"AK\");\n        states.put(\"alabama\"\
    , \"AL\");\n        states.put(\"wyoming\", \"WY\");\n    }\n\n    public String\
    \ getabbreviation(String s) {\n        return states.get(s);\n    }\n}\n```\n\n\
    However, a small number of changes to Safestates would take away its thread safety.\
    \ If states were not final, or if any other than the constructor modified its\
    \ contents, initialization safety would not be strong enough to safely access\
    \ Safestates without synchronization. If Safestates had other non-final fields,\
    \ threads might still see incorrect values of those fields. And allowing the object\
    \ to escape during construction invalidates the initialization-safety guarantee.\n\
    \nInitialization safety makes visibility guarantees only for the values that are\
    \ reachable through final fields as of the time the constructor finishes. For\
    \ values reachable through non-final fields, or values that may change after construction,\
    \ you must use synchronization to ensure visibility.\n\n# Summary\n\nThe Java\
    \ Memory Model specifies when the actions of one thread on memory are guaranteed\
    \ to be visible to another. The specifics involve ensuring that operations are\
    \ ordered by a partial ordering called happens-before, which is specified at the\
    \ level of individual memory and synchronization operations. In the absence of\
    \ sufficient synchronization, some very strange things can happen when threads\
    \ access shared data. However, the higher-level rules offered in Chapters 2 and\
    \ 3, such as @GuardedBy and safe publication, can be used to ensure thread safety\
    \ without resorting to the low-level details of happens-before."
