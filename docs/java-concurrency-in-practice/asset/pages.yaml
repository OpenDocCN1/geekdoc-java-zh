  md: '# Java Concurrency In Practice


    although not as often as many developers believe - it is always a good practice
    first to make your code right, and make it even. Then, use optimization only if
    your performance measurements and requirements tell you that you must, and if
    those same measurements tell you your optimizations actually make a difference
    under realistic conditions. [1]


    [In] concurrent code, this practice should be adhered to more than usual. Because
    concurrency bugs are so difficult to reproduce and debug, the benefit of a small
    performance gain on infrequently used code may be dwarfed by the risk that the
    program will fail in the field.


    If you decide to break encapsulation, all is not lost. It is still possible to
    make your thread safety, it is just a lot harder. Moreover, the thread safety
    of your program will be more fragile, increasing not only development cost but
    also maintenance cost and risk. Chapter 4 describes the conditions under which
    it is safe to relax encapsulation of state variables.


    We''ve used terms "thread-safe" and "thread-program" interchangeably thus. Is
    a thread-safe program one constructed entirely of thread-safe classes? Not necessarily
    - a program that consists entirely of thread-safe classes may not be thread-safe.
    The issues surrounding the composition of thread-safe classes are also taken up
    in Chapter 4. In any case, the concept of a thread-safe class makes sense only
    if the class encapsulates its own state. Thread safety may be a term that is applied
    to code, but it also to state, and it can only be applied to the entire body of
    code that encapsulates that state, which may be an object or an thread.


    # 2.1. What is Thread Safety?


    Defining safety is surprisingly tricky. The more formal attempts are so complicated
    as to offer practical guidance or intuitive understanding, and the rest are informal
    definitions that can seem downright circular. A quick Google search turns up numerous
    "definitions" like this:


    +   - can be called from multiple threads without unwanted interactions between
    the threads.


    +   - may be called by more than one thread at a time without requiring any other
    action on the caller''s.


    Given definitions like this, it''s no wonder we find thread safety confusing!
    They sound suspiciously like "a class is thread-safe if it can be used from multiple
    threads." You can''t really agree with such a statement, but it doesn''t offer
    much practical help. How do we define a thread-safe class from an unsafe one?
    What do we mean by "safe?


    At least any reasonable definition of thread safety is the concept of correctness.
    Our definition is fuzzy, it is because we lack a clear definition of correctness.


    Correctness means that a class conforms to its specification. A good specification
    defines invariants constraining an object''s state and postconditions describing
    the effects of its operations. If we don''t write adequate specifications for
    our classes, how can we possibly know that they are correct? We can''t stop from
    using them away unless we''ve convinced ourselves that the "code works". This
    "code confidence" is as close as many of us get to correctness, so let''s assume
    that single-threaded correctness is something that "we know it when we see it".
    Optimistically defining "correctness" as something that can be recognized, we
    can now define safety in a less circular way: a class is thread-safe when it continues
    to behave correctly when accessed from multiple threads.


    A class is thread-safe if it behaves correctly when accessed from multiple threads,
    regardless of the scheduling or interleaving of the execution of those threads
    by the runtime environment, and with no synchronization or other coordination
    on the part of the calling code.


    Since any single-threaded program is also a multithreaded program, it cannot be
    thread-safe if it is not correct in a single-threaded environment. [2] If an object
    is correctly implemented, no sequence of operations - calls to public methods
    and writes of public fields - should violate any of its invariants or post-conditions.
    No set of operations performed sequentially or concurrently on instances of a
    thread-safe class can cause an instance to be in invalid state.


    [2] If the use of "correctness" here bothers you, you may prefer to define a thread-safe
    class as one that is not broken in a concurrent environment than in a single-threaded
    environment.'
