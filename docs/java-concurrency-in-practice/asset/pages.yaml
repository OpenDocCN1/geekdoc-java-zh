  md: "# Java Concurrency and Future Interfaces.\n\n**Listing 6.11.** callable and\
    \ Future Interfaces.\n\n```\npublic interface callable<{\n    V call() throws\
    \ Exception;\n}\n\npublic interface Future<V>{\n    boolean cancel(boolean interruptIfRunning);\n\
    \    boolean isCancelled();\n    boolean isDone();\n    V get() throws InterruptedException,\
    \ ExecutionException;\n    V get(long timeout, TimeUnit unit) throws InterruptedException,\
    \ ExecutionException, TimeoutException;\n}\n```\n\nThere are several ways to create\
    \ a Future to describe a task. The submit methods in ExecutorService return a\
    \ Future, so that you can submit a Runnable or callable to an executor and get\
    \ a Future that can be used to retrieve the result or cancel the task. You can\
    \ also explicitly a FutureTask for a given Runnable or callable. (Because Future\
    \ implements Runnable, it can be submitted to an Executor for execution or directly\
    \ by calling its method.)\n\nAs of Java 6, ExecutorService implementations override\
    \ NewTaskFor in AbstractExecutor to control instantiation of the Future for a\
    \ submitted callable or Runnable. The default implementation creates a new FutureTask,\
    \ as shown in Listing 6.12.\n\n**Listing 6.12.** Default Implementation of newTaskFor\
    \ in ThreadPoolExecutor.\n\n```\nprotected Future<T> newTaskFor(Callable<T> task)\
    \ {\n    return new FutureTask<T>(task);\n}\n```\n\nSubmitting a Runnable or callable\
    \ to an executor creates a safe publication (Section 3.5) of the Runnable or callable\
    \ by submitting to the thread that will execute it. Similarly, the result returned\
    \ by a Future constitutes a safe publication of the result from the thread in\
    \ which it was computed to any thread that retrieves it get.\n\n# 6.3.3. Example:\
    \ Page-Renderer with Future\n\nAs a first step toward making the page renderer\
    \ more concurrent, let's divide it into two tasks, one that renders the text and\
    \ one that downloads all the images (Because one is largely CPU-bound and the\
    \ other is I/O-bound, this approach may improve even on single-core systems).\n\
    \ncallable and Future help us express the interaction between these cooperating\
    \ tasks. In FutureRenderer in Listing 6.13, we use a callable to download all\
    \ the images, and submit it to an ExecutorService. This returns a Future describing\
    \ the task's execution; when the main thread gets to the point where it needs\
    \ the images, it waits for the Future calling get(). If we're lucky, the results\
    \ will be ready by the time we need; otherwise, we get a head start on downloading\
    \ the images.\n\nThe state-dependent nature of Future means that the caller need\
    \ not know the state of the task, and the function properties of submission and\
    \ result retrieval make this thread-safe. The exception handling code surrounding\
    \ get() deals with two possible problems: the task encountered an Exception, or\
    \ the thread was interrupted before the results were available (See Sections 5.5.2\
    \ and 5.4).\n\nFutureRenderer allows the text to be rendered concurrently with\
    \ downloading the data. When all the images are downloaded, they are rendered\
    \ onto the page. In an implementation that uses a series result quickly and it\
    \ exploits some parallelism, we can also consider better. There is no need for\
    \ users to wait for all the images to be downloaded; they would probably prefer\
    \ to see all images as they are drawn.\n\n# 6.3.4. Limitations of Parallelizing\
    \ Heterogeneous Tasks\n\nIn the last example, we tried to execute two types of\
    \ tasks in parallel - downloading the images and rendering the page. But obtaining\
    \ significant performance improvements by trying to parallelize heterogeneous\
    \ tasks can be tricky.\n\nTwo people can do the cleaning of the dishes far efficiently:\
    \ one person washes the dishes while the others dry. However, a different type\
    \ of task to each worker does not scale well; if several people show up, it is\
    \ obvious how they can help without getting in the way or significantly restricting\
    \ the division of labor. Without finding fine-grained parallelism among tasks,\
    \ this approach will yield diminishing returns."
