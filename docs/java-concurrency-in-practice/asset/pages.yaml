  md: '# 1.4. Threads are Everywhere


    Even if your program never explicitly creates a thread, frameworks create threads
    upon your behalf, and code called these threads must be thread-safe. This can
    cause a significant design and implementation burden on developers, developing
    thread-safe classes requires more care and analysis than non-thread-safe classes.


    Every Java application uses threads. When the JVM starts, it creates threads for
    JVM housekeeping tasks (garbage collection, finalization) and a main thread for
    running the main method. The AWT (Abstract Window Toolkit) and Swing user interface
    frameworks create threads for managing user interface events. Timer threads create
    threads for executing deferred tasks. Component frameworks, such as servlets and
    RMI create pools of threads and invoke methods in these threads.


    If you use these - as many developers do - you have to be familiar with concurrency
    and thread safety, because these frameworks create threads and call your components
    from them. It would be nice to believe that concurrency is an "optional" or "advanced"
    language feature, but the reality is nearly all Java applications are multithreaded
    and these frameworks do not insulate you from the problem of properly coordinate
    access to state.


    When concurrency is introduced into an application by a framework, it is nearly
    impossible to restrict the concurrency awareness to your code, because frameworks
    by their nature make callbacks to application components that in turn access application
    state. Similarly, the need for thread safety does not end with the components
    called by the framework - it extends to all code paths that access the state accessed
    by those components. Thus, the need for thread safety is constant.


    Frameworks introduce concurrency into applications by calling components from
    framework threads. Components invariably access application state, thus requiring
    that all code paths accessing that state be thread-safe.


    The facilities described below all application code could be called by threads
    not managing the application. While the need for thread safety may start with
    these facilities, it rarely ends there; it ripples through the entire program.


    Timer is a convenient mechanism for scheduling tasks to a later time


    Even if you could guarantee that a servlet is called from one thread at a time,
    you would still have to pay attention to thread safety when building a web application.
    Servlets often access state information shared with other threads, such as application-objects
    (stored in the ServletContext) or session-objects (stored in the per-http session).
    When a servlet accesses objects shared by servlets or requests, it must coordinate
    access to these objects properly, as multiple requests could be accessing them
    simultaneously from multiple threads. Servlets and JSPs, as well as filters and
    objects stored in containers like ServletContext and session, must be thread-safe.


    Remote Method Invocation. RMI invokes methods on objects running in another JVM.
    When you call a method with RMI, the method arguments are packaged (marshaled)
    into a stream and passed over the network to the remote JVM, where they are unmarshaled
    (unpacked) and passed to the method. When the RMI code calls your object, in what
    thread does that call happen? You don''t know, but it''s definitely not in a thread
    you created - your object gets called in a thread managed by RMI. How many threads
    does RMI create? Could the same method on the same remote object be called simultaneously
    in multiple RMI threads?[3]'
