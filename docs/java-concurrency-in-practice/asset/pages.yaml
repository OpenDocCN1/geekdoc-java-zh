  md: '# Java Concurrency In Practice


    Single-threaded GUI frameworks achieve safety via thread confinement; all GUI
    objects, including components and data models, are accessed exclusively by the
    event thread. Of course, this pushes some of the safety burden back onto the developer,
    who must make sure these objects are properly confined.


    # 9.1. Sequential Event Processing


    GUI applications are oriented around processing fine-grained events such as mouse
    clicks, key presses, or timer expirations. Events are a kind of task; the event
    handling provided by AWT and Swing is structurally similar to an Executor.


    Because there is only one thread for processing GUI tasks, they are processed
    sequentially - one task finishes before the next one, and no two tasks overlap.
    Knowing this makes writing code easier - you do not have to worry about interference
    from other threads.


    The downside of sequential task processing is that if one task takes long time
    to execute, other tasks must wait until it is finished. If other tasks are responsible
    for responding to input or providing visual feedback, the application will appear
    to have frozen. If a lengthy task is running in the event thread, the user cannot
    even click "Cancel" as the cancel button listener is not called until the lengthy
    task completes. Therefore, tasks that execute in the event thread must return
    to the event thread. To initiate a progress task such as spelling a long document,
    searching the file system, or fetching a resource on a network, you must run in
    another thread and communicate back to the event thread. To update progress while
    a long-running task executes or provide visual feedback when it completes, you
    again need to execute code in the event thread. This can get complicated.


    # 9.2. Thread Confinement in Swing


    All components (such as JButton and Table) and data objects (such as TableModel
    and TreeModel) are confined to the event thread, so any code that accesses these
    objects must run in the event thread. GUI objects are kept consistent without
    synchronization, but by thread confinement. The upside is that tasks run in the
    event thread need not worry about synchronization when presenting objects; the
    downside is that you cannot access presentation objects outside the event thread.


    The Swing single-thread rule: Swing components and models should be created, modified,
    and queried only from the event-dispatching thread.


    With all rules, there are a few exceptions. A small number of Swing methods may
    be called safely from any thread; these are clearly identified in the Javadoc
    as the single-thread rule:


    +   * SwingUtilities.isDispatchThread, which determines whether the thread is
    the event thread;

    * SwingUtilities.invokeLater, which schedules a Runnable for execution on the
    event thread (callable from any thread);

    * SwingUtilities.invokeAndWait, which schedules a Runnable for execution on the
    event thread and blocks the current thread until it completes (callable only from
    non-GUI thread);

    * methods to enqueue a request or validation request on the event queue (callable
    from any thread);

    * methods for adding and removing listeners (can be called from any thread, but
    listeners will be invoked in the event thread).


    The invokeLater and invokeAndWait function like an Executor. In fact, it is trivial
    to implement the threading-related methods from SwingUtilities using a single-threaded
    Executor, as shown in Listing 9.1. This is how SwingUtilities is actually implemented,
    as Swing predates the Executor framework, but how would it be if Swing were implemented
    today.


    The Swing event thread can be thought of as a single-threaded Executor that processes
    tasks on the event queue. With thread pools, the worker thread dies and is replaced
    by a new one, which would be transparent to readers. Sequential, single-threaded
    execution is a sensible policy when tasks are short-lived, predictability is not
    important, or it is imperative that tasks do not execute concurrently.


    GuiExecutor in Listing 9.2 is an Executor that delegates tasks to SwingUtilities
    for execution. It could be implemented in terms of other GUI frameworks as well;
    for example, SWT provides the Display.asyncExec method, which is similar to Swing''s
    invokeLater.'
