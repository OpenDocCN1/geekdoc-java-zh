  md: "# Java Delegating Thread Safety in Practice\n\nListing 4.9. Delegating Thread\
    \ Safety to Multiple Underlying State Variables.\n\n```\npublic class VisualComponent\
    \ {\n    private final List<KeyListener> keyListeners;\n        keyListeners =\
    \ new CopyOnWriteArrayList<KeyListener>();\nn    private final List<MouseListener>\
    \ mouseListeners;\n        mouseListeners = new CopyOnWriteArrayList<MouseListener>();\n\
    n\n    public void addKeyListener(KeyListener listener) {\n        keyListeners.add(listener);\n\
    \    }\n\n    public void addMouseListener(MouseListener listener) {\n       \
    \ mouseListeners.add(listener);\n    }\n\n    public void removeKeyListener(KeyListener\
    \ listener) {\n        keyListeners.remove(listener);\n    }\n\n    public void\
    \ removeMouseListener(MouseListener listener) {\n        mouseListeners.remove(listener);\n\
    \    }\n}\n```\n\n# 4.3.3. When Delegating Fails\n\nMost classes are not as simple\
    \ as VisualComponent; they have invariants that relate their component state variables.\
    \ NumberRange in Listing 4.10 uses two AtomicIntegers to manage its state, but\
    \ it imposes an additional constraint that the first number is not less than or\
    \ to the second.\n\nNumberRange is not thread-safe; it does not preserve the invariant\
    \ that constrains lower and upper. The lower and setter methods attempt to respect\
    \ this invariant, but do so poorly. Neither uses synchronized locking to make\
    \ them atomic. If the number range holds (0, 10), and one thread calls lower(5)\
    \ while another calls upper(4), with some unlucky timing both pass the checks\
    \ in the setters and both modifications will be applied. The result is that the\
    \ range now holds (5, 4) invalid state. While the underlying AtomicIntegers are\
    \ thread-safe, the composite class is not. Because the underlying state variables\
    \ lower and upper are not independent, NumberRange cannot simply delegate thread\
    \ safety to its thread-safe state variables.\n\nNumberRange could be made thread-safe\
    \ by using locking to maintain its invariants, such as guarding lower and upper\
    \ with a common lock. It must also avoid publishing lower and upper to prevent\
    \ clients from subverting its invariants.\n\nIf a class has compound actions,\
    \ as NumberRange does, delegation alone is again not a suitable approach for thread\
    \ safety. In these cases, the class must provide its own locking to ensure that\
    \ compound actions are atomic, unless the entire compound action can also be delegated\
    \ to the underlying state variables.\n\n> If a class is composed of multiple independent\
    \ thread-safe state variables and no operations that have any invalid state transitions,\
    \ it can delegate thread safety to the underlying state variables."
