  md: '# 16 Java Concurrency In Practice


    you are exactly starting. In HotSpot, running your program with -XX:+Compilation
    puts a message when dynamic compilation runs, so you can verify that this is prior
    to, rather than during, measured tests.


    Running the test several times in the same JVM instance can be used to validate
    the testing methodology. The first group of results should be discarded as warm-up;
    inconsistent results in the remaining groups suggests that the test should be
    examined further to determine why the timing results are not realistic.


    The JVM uses various background threads for housekeeping tasks. When measuring
    multiple unrelated compilation intensive activities in a single run, it is a good
    idea to place explicit pauses between the measured trials to give the JVM a chance
    to catch up with background tasks with minimal interference from measured tests.
    (When measuring related activities, such as multiple runs of the same test, excluding
    JVM tasks in this way may make unrealistic performance)


    # 12.3.3. Realistic Sampling of Code Paths


    Runtime compilers use profiling information to optimize the code being. The JVM
    is permitted to use information specific to the execution in order to produce
    better code, which means that compiling method M in one run may generate different
    code than compiling M in others. In some cases, the JVM may make assumptions based
    on what may only be true temporarily, and later back by invalidating the compiled
    code if they become untrue.


    The JVM can use polymorphic transformation to convert a virtual method to a direct
    method if no classes override that method, but it invalidates the code if a class
    is loaded that overrides the method.


    As a result, it is important that your tests not adequately represent the usage
    of a typical application, but also represent the set of code paths used by such
    an application. Otherwise, a dynamic compiler could make special optimizations
    to a purely single-threaded test that would not be applied in applications containing
    at least occasional parallelism. Furthermore, tests of multithreaded performance
    should be normally met with tests of single-threaded performance, even if you
    want to measure only single-threaded performance. )


    # 12.4.1 Realistic Inscription of Contention


    Concurrent applications need to interleave two different sorts of work: accessing
    shared data, such as fetching the next task from a work queue, and thread communication
    (executing the task, assuming the task does not access shared data). Depending
    on the relative proportions of the two types of work, the application will experience
    different levels of contention and exhibiting behaviors.


    If N threads are fetching from a shared queue and executing them, the tasks are
    compute-intensive and long-running (or do not access shared data much), there
    will be no contention; throughput is limited by the availability of CPU resources.
    On the other hand, if the tasks are short-lived, there will be a lot of contention
    for the work queue and throughput is dominated by synchronization.


    To obtain realistic results, performance tests should try to emulate the thread-communication
    contention by a typical application in addition to the contention under study.
    If the work for each task in an application is significantly different in nature
    or scope from the test, it is easy to arrive at unwanted conclusions about where
    the bottlenecks lie. We see in Section 15.4, that lock-based classes such as the
    Map have an effect on throughput. The tests show that doing nothing but the Map,
    even with two threads, all attempts to access the Map are contended. However,
    if an application did a significant amount of thread-local computation for each
    task it accesses the shared data, the contention level may be low enough to show
    good performance.


    In this regard, ThroughputTest might be a poor model for some applications. Since
    the workers do not work much, throughput is dominated by coordination overhead,
    and this is not necessarily in all applications that exchange data between producers
    and consumers buffers.


    # 12.3.2. Dead Code Elimination


    One of the challenges of using good benchmarks (in any language) is that optimizing
    compilers are adept at spotting and eliminating dead code - that has no effect
    on the outcome. Since benchmarks often don''t compute anything, they are an easy
    target for the optimizer. Most of the time, it is high when the optimizer prunes
    code from a program, but for a benchmark this is a big problem because you are
    measuring the execution less than you actually do. If you''re lucky, the optimizer
    will prune your entire program, and it will be obvious that your data is bogus.'
