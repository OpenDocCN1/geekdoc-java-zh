  md: '# Chapter 12. Testing Concurrent Programs


    Concurrent programs employ simple design principles and patterns to sequential
    programs. The difference is that concurrent programs have a degree of non-determinism
    that sequential programs do not, increasing the number of potential interactions
    and failure modes that must be planned for and analyzed.

    nSimilarly, concurrent programs use and extends from testing sequential ones.
    The same techniques for testing correctness and performance in sequential programs
    can be applied to concurrent programs, but the space of things that can go wrong
    is larger. The major challenge in constructing concurrent programs is that potential
    failures may be probabilistic occurrences rather than deterministic ones; tests
    that disclose such failures must be exhaustive and longer than typical sequential
    tests.

    Most of concurrent programs fall into one or both of the classic categories of
    safety and liveness. In Chapter 1, we defined safety as "nothing bad happens"
    and liveness as "something good eventually happens"

    Tests of safety, when verifying that a class conforms to its specification, usually
    take the form of testing invariants. For a linked list implementation that caches
    the size of the list every time it is modified, one safety test would be to check
    the count against the actual number of elements in the list. But in a concurrent
    program, since the size does not change while you are testing its properties,
    you can observe the count and elements in a single atomic operation. This can
    be done by locking for exclusive access, employing some of "atomic semaphores"
    or by using "test points" provided by the implementation that asserts invariants
    after your tests execute test case code.


    In this book, we have used diagrams to detect "unlucky" interactions that could
    cause failures in incorrectly constructed classes; test programs attempt search
    enough of the space that such liveness eventually occurs. Unfortunately, test
    can introduce timing or synchronization artifacts that can mask bugs that might
    otherwise manifest themselves.[1]


    > [1] Bugs that disappear when you are debugging or test code are called Heisenbugs.


    Liveness properties present their own challenges. Liveness tests include tests
    of progress and non-progress, which are hard to quantify - how do you verify that
    a method is blocking and not running slowly? Similarly, how do you test that an
    algorithm does not deadlock? How long do you wait before you declare it have failed?

    Related to liveness tests are performance tests. Performance can be measured in
    a number of ways, including:

    Throughput: the rate at which set of concurrent tasks is completed;

    Responsiveness: the delay between a request for and completion of some action
    (also called latency); or

    Scalability: the improvement in throughput (or lack thereof) as more resources
    (usually CPUs) are available.


    # 12.1. Testing for correctness


    Developing unit tests for a concurrent class starts with the same analysis as
    for a sequential class - identifying invariants and post-conditions that are amenable
    to checking. If you are lucky, many of these are present in the specification;
    the result of writing, unit tests is an adventure in iterative discovery.

    As a concrete example, we are going to build a set of tests for a bounded buffer.
    Listing 12.1 shows our BoundedBuffer implementation, using semaphore to implement
    the required bounding and locking.

    BoundedBuffer implements a fixed-length array-based queue with blocking put and
    take methods controlled by a pair of counting semaphores. The availableItems semaphore
    represents the number of elements that can be removed from the buffer, and is
    initially empty (zero since the buffer is initially empty). availableSpaces represents
    how many items can be inserted into the buffer, and is initialized to the size
    of the buffer.

    A operation first requires that a permit be obtained from availableItems. This
    succeeds immediately if the buffer is nonempty, otherwise the block waits until
    the buffer becomes nonempty. Once a permit is obtained, the next element from
    the buffer is released to the availableSpaces semaphore[2] The operation is performed
    conversely, so that on exit from either the put or take methods, the sum of both
    semaphores always equals. In particular, if you need a bounded buffer you should
    use ArrayBlockingQueue rather than locking queue, but the technique here illustrates
    how insertions and removals can be controlled in other data structures as well.'
