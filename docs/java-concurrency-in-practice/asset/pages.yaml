  md: '# 18 Java Concurrency In Practice


    Ironically, some of the tricks that improve performance in single-threaded programs
    are bad for scalability (see Section 14.4 for an example).


    The three-tier application model - in which presentation, business, logic, and
    persistence are separated and may be handled by different systems - illustrates
    how improvements in scalability often come at the expense of performance. A monolithic
    application where presentation, business, logic and persistence are intertwined
    almost certainly provide better performance for the first unit of work than a
    well-factored multier implementation distributed over multiple systems. Could
    it not? The monolithic application would not have the network latency inherent
    in handing off between tiers, nor would it have to pay the costs inherent in a
    computational process inside distinct layers (such as queuing, overhead, and data
    copying).


    However, the monolithic system reaching its capacity, could have a serious problem:
    it may be prohibitive to significantly increase capacity. So we often pay the
    performance of longer service time or greater computing resources used per unit
    of work to do that our application can handle load by adding more resources.


    Of the various aspects of performance, the "how much" aspects - scalability, throughput,
    and capacity - are usually of greater concern for servers than the "how fast"
    aspects. (For interactive applications, latency tends to be more important, than
    so wait not for indicators of progress and what is going on.) This chapter focuses
    primarily on scalability rather than single-threaded performance.


    # 11.1.2. Evaluating Performance Tradeoffs


    Nearly all engineering decisions involve some form of tradeoff. Using thicker
    steel in a bridge span may increase its capacity and safety, but also its cost.
    While software engineering decisions don''t involve tradeoffs between money and
    human life, we have less information with which to make the right tradeoffs. For
    example, the "quicksort" algorithm is highly efficient for large data sets, but
    the bubbled "sort" is also much efficient for small sets. If you implement an
    efficient sort, you need to know something about the size of data sets it will
    to process, with metrics that tell you whether you are trying to optimize average-case,
    time-cost, or predictability. Unfortunately, information is not part of the requirements
    to get the use of a library sort routine. This is one of the reasons why most
    optimizations are premature; they often happen before a clear set of requirements
    is available.


    > Avoid premature optimization. First make it right, then make it fast - if it
    is not already fast.


    When making engineering decisions, sometimes you are trading one form of cost
    (for using versus memory consumption); you are trading cost for safety. Many performance
    optimizations come at the cost of readability or maintainability - the more "clever"
    or non-obvious the code, the harder it is to understand and maintain. Sometimes
    optimizations entail good object-oriented design principles, such as breaking
    encapsulation; sometimes they involve greater risk of error, because faster algorithms
    are also risky. (If you can''t spot the costs, or you might haven''t thought it
    carefully enough to proceed.)


    Most performance decisions involve multiple variables and are highly subjective.
    Before deciding which approach is "faster" than another, ask yourself some questions:


    +   - What do you mean by "faster"?


    +   - Under what conditions will this approach be faster? Under light or heavy
    load? With large or small data sets? Can you support your answer with measurements?


    +   - How often are these conditions linked to your situation? Can you support
    your answer with measurements?


    +   - Is this code likely to be used in other situations where the conditions
    might be different?


    +   - What hidden costs, such as increased development or maintenance risk, are
    you trading for this performance? Is this a good tradeoff?


    These considerations apply to any performance-related engineering decision, but
    this is a book about concurrency. Why are we recommending such a conservative
    approach to optimization? The quest for performance is probably the single greatest
    source of currency bugs. The belief that synchronization is "too slow" led to
    many clever-locking dangerous idioms for reducing synchronization (such as double-checked
    locking, discussed in Section 16.2.4), and is often cited as an excuse for not
