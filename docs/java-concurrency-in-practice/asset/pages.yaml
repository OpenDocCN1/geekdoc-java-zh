    \ an existing List, and this guarantees thread safety as long as we hold the only\
    \ reference to the underlying list.\n\n# List 4.16. Implementing If-Absent-Using\
    \ Composition.\n\n```\npublic class improvedList<T> implements List<T> {\n   \
    \ private List<T> list;\n\n    public improvedList(List<T> list) { this.list =\
    \ list; }\n\n    public synchronized boolean putIfAbsent(Object x) {\n       \
    \ boolean contains = list.contains(x);\n        if (!contains) {\n           \
    \ list.add(x);\n        }\n        return contains;\n    }\n\n    public synchronized\
    \ void clear() { list.clear(); }\n    // ... similarly delegate other methods\n\
    ```\n\n> [7] The penalty will be small because the synchronization on the underlying\
    \ list is guaranteed to be uncontended and thread safe; see Chapter 11.\n\n# 4.5\
    \ Documenting Synchronization Policies\n\nDocumentation is one of the most powerful\
    \ (and, sadly, underutilized) tools for managing thread safety. Users look to\
    \ the documentation to find out if it is thread-safe, and maintainers look to\
    \ the documentation to understand the implementation strategy they can maintain\
    \ without inadvertently compromising safety. Unfortunately, both of these constituencies\
    \ usually find less information than they'd like.\n\nDocument a class's thread\
    \ safety guarantees for its clients; its synchronization policy for its maintainers.\n\
    \nEach use of synchronized, volatile, or other thread-safe class requires a synchronization\
    \ policy defining a strategy for ensuring the integrity of data in the face of\
    \ concurrent access. This is an element of your program design, and should be\
    \ documented. Of course, the best time to document design decisions is at design\
    \ time. Weeks or months later, the details may be blurry - so write it before\
    \ you forget.\n\nCrafting a synchronization policy requires a number of decisions:\
    \ which variables are volatile, which variables are guarded with locks, which\
    \ variables are immutable or confined to a thread, which operations must be atomic.\
    \ Some of these are tricky implementation details and should be documented for\
    \ the sake of future maintainers, but affect the publicly observable locking behavior\
    \ of your class should be documented as part of its specification.\n\nAt the very\
    \ least, document the thread safety guarantees made by a lock. Is it thread-safe?\
    \ Does it make callbacks with a lock held? Are there any specific locks that affect\
    \ behavior? Don't force clients to make guesses. If you don't want to support\
    \ omitting synchronization on our operations, refer to Section 4.4, you document\
    \ which classes they should acquire to do so safely. If you use locks to guard\
    \ the trick, document this for future maintainers, because it's so easy - the\
    \ @guarded annotation will help.\n\nThe current state of thread safety documentation,\
    \ even in the platform classes, is not encouraging. Many times have you looked\
    \ at the JavaDoc for a class and wondered whether it was thread-safe?[8] Most\
    \ classes don't offer any clear hint. Many official Java technology specifications,\
    \ and libraries like JDBC, willowed underdocument their thread safety promises\
    \ and requirements.\n\n> [8] If you suggest that we do not assume behaviors that\
    \ aren't part of the specification, we have to get done, and\n\nwhile prudence\
    \ suggests that we do not assume behaviors... we are often faced with a choice\
    \ of bad assumptions. We should assume an object is thread-safe because it seems\
    \ that it ought to be? Should we check every access to an object that can be made\
    \ thread-safe by acquiring its lock first? (This risky risky technique works only\
    \ if we control all the code that accesses that object; it provides only the Illusion\
    \ of thread safety.) Neither choice is very satisfying."
