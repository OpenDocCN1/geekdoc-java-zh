  md: "# 5BPart II: Structuring Concurrent Applications - 18Chapter.6. Task Execution\n\
    \nIn some situations, sequential processing may offer a simplicity or safety advantage;\
    \ most GUI frameworks process sequentially using a single thread. We return to\
    \ the sequential model in Chapter 9.\n\n# 6.1.2. Explicitly Creating Threads for\
    \ Tasks\n\nA more responsive approach is to create a new thread for servicing\
    \ each request, as shown in ThreadTaskWebserver in 6.2.\n\n# Listing 6.2. Web\
    \ Server that Starts a New Thread for Each Request.\n\n```\nclass ThreadTaskWebServer\
    \ {\n    public static void main(String[] args) throws IOException {\n       \
    \ ServerSocket socket = new ServerSocket(80);\n        while(true) {\n       \
    \     Final Socket connection = socket.accept();\n            Runnable task =\
    \ new Runnable() {\n                public void run() {\n                    handleRequest(connection);\n\
    \                }\n            };\n            new Thread(task).start();\n  \
    \      }\n    }\n}\n```\n\nThreadTaskWebServer is similar to the single-threaded\
    \ version - the main thread alternates between accepting an incoming connection\
    \ and dispatching the request. The difference is that for each connection, the\
    \ main loop creates a new thread to process the request instead of within the\
    \ main thread. This has three main consequences:\n\n+   - Task processing is offloaded\
    \ from the main thread, enabling the main loop to resume waiting for the incoming\
    \ connection more quickly. This enables new connections to be accepted before\
    \ previous requests complete, improving responsiveness.\n- Tasks can be processed\
    \ in parallel, allowing multiple requests to be serviced simultaneously. This\
    \ may improve throughput if there are multiple processors, or tasks need to block\
    \ for any I/O operation, lock acquisition, or resource availability.\n- Task-handling\
    \ must be thread-safe, because it may be invoked concurrently for multiple tasks.\n\
    \nUnder light load, the thread-task-approach is an improvement over sequential\
    \ execution. As long as the request arrival rate does not exceed the server's\
    \ capacity to handle requests, this approach offers better responsiveness and\
    \ throughput.\n\n# 6.1.3. Disadvantages of Unbounded Thread\n\nFor production,\
    \ however, the thread-task-approach has some practical drawbacks, especially when\
    \ a large number of threads may be created:\n\nThread lifecycle overhead are not\
    \ free. The overhead varies across platforms, and thread creation takes time,\
    \ introducing latency into request processing, and requires some processing activity\
    \ by the JVM and OS. If requests are frequent and lightweight, creating a new\
    \ thread for each request can consume significant computing resources.\n\nResource\
    \ contention consumes system resources, especially memory. When there are more\
    \ runnable threads than processors, threads can tie up a lot of memory, putting\
    \ pressure on the garbage collector, and having many threads compete for the CPUs\
    \ can impose other performance costs. If you have enough threads to keep all the\
    \ CPUs busy, creating more threads won't help and may even hurt.\n\nStability.\
    \ There is limit on how many threads can be created. The limit varies by platform\
    \ and is affected by factors including JVM invocation parameters, the requested\
    \ stack size in the Thread constructor, and threads placed by the underlying operating\
    \ system.[23] When you hit this limit, the most likely result is an OutMemoryError;\
    \ it is easier to recover from such an error than to avoid it.\n\nOn 32 bit machines,\
    \ a limiting factor is address space for thread stacks. Each thread maintains\
    \ two execution stacks, one for Java and one for native. JVM defaults stack size\
    \ of about half a megabyte (You can change this by the -XSS JVM flag or through\
    \ the Thread constructor.) If you divide the per-thread stack size into 232, you\
    \ get a few hundred or thousands of threads to work. Other factors, such as OS,\
    \ may impose stricter limits."
