  md: '# Java Concurrency In Practice


    mistakes; taking the time to have else review the code is almost always worthwhile.
    Expert concurrent programmers are better at finding subtle races than most tests.
    Also, platform issues as JVM implementation details or processor memory models
    can prevent bugs from showing up on particular hardware or software configurations..
    Code review has other benefits; not only can it find errors, but it improves the
    quality of comments describing the implementation details, reducing future maintenance
    cost and risk.


    # 12.4.2. Static Analysis Tools


    As of writing, static analysis tools are rapidly emerging as an essential complement
    to testing and code review. Static analysis is the process of analyzing code without
    executing it, and code auditing tools classify classes to issues of common patterns.
    Static tools such as the open-source FindBugs[9] contain pattern detectors for
    many common errors, of which many can be easily missed by testing or code review.


    ```

    http://findbugs.sourceforge.net

    ```


    Static tools provide a list of warnings that must be examined by hand to determine
    whether they represent actual errors. Historically, tools like lint produced many
    false warnings as to scare developers, but tools like FindBugs have been used
    to prevent many false alarms. Static analysis tools are somewhat primitive (especially
    in their integration with development tools and lifecycle), but they are already
    effective enough to be valuable addition to the testing process.


    As of writing, FindBugs includes detectors for the concurrency-related bugs, and
    more are added all the time:


    Inconsistent synchronization. Many objects follow the synchronization policy of
    guarding all variables with the object''s intrinsic lock. An inconsistent access
    may indicate that the synchronization policy is not consistently followed.

    Analysis tools must guess the synchronization policy because Java classes do not
    have concurrency specifications. In the future, if annotations as @Guarded are
    standardized, auditing tools could interpret annotations rather than having to
    guess the relationship between variables and locks, improving the quality of analysis.


    Invoking Thread.run. Thread implements Runnable and therefore has a run method.
    However, it is always a mistake to call Thread.run directly; unless the programmer
    meant to call Thread.start.


    Unreleased lock. Unlike intrinsic locks, explicit locks (see Chapter 13) are not
    automatically released when control exits the scope in which they were acquired.
    The standard idiom is to release the lock from finally block; otherwise the lock
    can remain unreleased in the event of an exception.


    Empty synchronized block. Empty synchronized blocks have semantics under the Java
    Memory Model, they are frequently used incorrectly, and there are better solutions
    to whatever the problem the developer was trying to solve.


    Double-checked locking. Double-checking is a broken idiom for reducing synchronization
    overhead in lazy initialization (see Section 16.2.4) that involves reading a shared
    mutable without appropriate synchronization.


    Starting a thread from a constructor. Starting a thread from a constructor introduces
    the risk of subclassing problems, and can allow this reference to escape the constructor.


    Notification errors. The notify and notifyAll methods indicate that an object''s
    state has changed in a way that would unlock threads that are waiting on the condition
    queue. These methods should be called only when the state associated with the
    condition has changed. A synchronized block that calls notify or notifyAll without
    modifying any state is likely to be an error (see Chapter 14).


    Condition wait. When waiting on a condition queue, Object.wait or condition should
    be called in a loop, with the appropriate lock held, after testing some predicate
    (see Chapter 14). Calling Object.wait without the lock, not in a loop, or without
    testing some predicate is almost an error.


    Missense of lock and condition. Using the lock as the argument for a synchronized
    block is likely to be a typo'
