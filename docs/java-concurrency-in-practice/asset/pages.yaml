  md: "# # Chapter 6. Task Execution\n\nMost concurrent applications are organized\
    \ around the execution of tasks: abstract, discrete units of work. Dividing the\
    \ work of an application into tasks simplifies program organization, facilitates\
    \ error recovery by providing natural transaction boundaries, and promotes concurrency\
    \ by providing a natural structure for parallelizing work.\n\n# ## 6.1. Executing\
    \ Tasks in Threads\n\nThe first step in organizing a program around execution\
    \ is identifying sensible boundaries. Ideally, tasks that don't depend on the\
    \ state, result, or side effects of other tasks. Independence facilitates concurrency,\
    \ as independent tasks can be executed in parallel if there are adequate processing\
    \ resources. For greater flexibility in scheduling and load balancing, each task\
    \ should also represent a small fraction of the application's processing capacity.\n\
    \nServer applications should exhibit both good throughput and good responsiveness\
    \ under normal load. Application requires supporting as many users as possible,\
    \ so as to reduce contention costs per user; when overloaded, rather than simply\
    \ failing over heavy load. Choosing good task boundaries, coupled with a task\
    \ execution policy (see Section 6.2.2), can help them achieve these goals.\n\n\
    Most server applications offer a natural choice of task boundary: individual client\
    \ requests. Web servers, mail servers, file servers, EIB containers, and database\
    \ servers all accept requests via network connections from clients. Using individual\
    \ requests as task boundaries usually offers both independence and appropriate\
    \ task sizing. For example, the result of submitting a message to a server is\
    \ not acknowledged as it appears being processed at the same time, and handling\
    \ a single message usually requires a very small percentage of the server's total\
    \ capacity.\n\n# ### 6.1.1. Executing Tasks Sequentially\n\nThere are a number\
    \ of possible policies for scheduling tasks within an application, some of which\
    \ might expose the potential for concurrency between others. The simplest is to\
    \ execute tasks sequentially in a single thread.SingleThreadwebserver processes\
    \ its tasks - HTTP requests arriving on port 80 -. The details of processing are\
    \ not important; we're interested in characterizing the concurrency of various\
    \ scheduling policies.\n\n# #### Listing 6.1. Sequential Web Server.\n\n![](img/c64daf12e0d6c877213813fc53c890a4_88_0.png)\n\
    \n```\nclass SingleThreadWebServer {\n    public void main(String[] args) throws\
    \ IOException {\n        ServerSocket socket = new ServerSocket(80);\n       \
    \ while (true) {\n            Socket connection = socket.accept();\n         \
    \   handleRequest(connection);\n        }\n    }\n}\n```\n\nSingleThreadWebServer\
    \ is simple and theoretically correct, but would perform poorly in production\
    \ because it can handle only one request at a time. The main thread alternates\
    \ between accepting connections and processing the associated request. While the\
    \ server is handling a request, new connections must wait until it finishes the\
    \ request and accepts them. This might work if request were so fast that handleRequest\
    \ effectively returned immediately, but it doesn't describe any web server in\
    \ the real world.\n\nProcessing a request involves a mix of computation and I/O.\
    \ The server must perform I/O to read the request and write the response, which\
    \ can be blocked by network congestion or connectivity problems. It may perform\
    \ I/O or make database requests, which can also block. In a single-threaded server,\
    \ blocking not only delays completing the current request, but prevents other\
    \ requests from being processed at all. If one request lasts an unusually long\
    \ time, the server becomes unavailable as it appears unresponsive. The resource\
    \ utilization is poor, since the CPU units sit idle while the server waits for\
    \ I/O to complete.\n\nIn server applications, sequential processing rarely provides\
    \ either good throughput or good responsiveness. There are exceptions - when tasks\
    \ are few and long-lived, or when the server serves a single client that makes\
    \ only a single request at a time - but most server applications do not work this\
    \ way."
