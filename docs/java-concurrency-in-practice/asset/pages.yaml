  md: '# Objects


    If you are porting a single-threaded application to a multithreaded environment,
    can preserve safety by converting global variables into Thread.local, if the semantics
    of the shared object permits it; an inline code would not be as effective if it
    were turned into one thread-local code.


    ThreadLocal is widely used in application frameworks. For example, JEE containers
    contain a transaction context for the duration of an EJB call. This is implemented
    using a Thread-Local context: when the framework needs to determine what transaction
    is running, it fetches the transaction context from Thread.local. This is convenient
    in that it reduces the need to pass execution context into every method, but couples
    any code that uses this mechanism to the framework.


    It is easy to abuse ThreadLocal by treating its confinement property as a license
    to use global variables or by creating "hidden methods". Like thread-local variables
    can detract from refractability and introduce hidden couplings among classes,
    and should therefore be used with care.


    # 3.4. Immutability


    The other end-run around the synchronize we''ve described so far is immutable
    objects [EJ Item 13]. Nearly all the immutability and visibility barriers for
    seeing state values, updating, or observing an object in an inconsistent state
    vanish with the vagaries of multiple threads trying to access the same mutable
    state at. If an object''s state cannot be modified, these risks and complexities
    simply go away.


    An immutable object is inherently threadsafe; their invariants are established
    by the constructor, and if their state cannot be changed, these invariants always
    hold.


    Immutable objects are always thread-safe.


    Immutable objects are simple. They can only be controlled by the constructor.
    The one of the most difficult elements of program design is reasoning about the
    possible complex states of objects. Reasoning about the state of immutable objects,
    on the other hand, is vital.


    Immutable objects are also safer. Passing a mutable object to untrusted code,
    or otherwise publishing it where untrusted code could fail, is dangerous-the untrusted
    code could modify its state or, worse, return a reference to it and modify its
    state later from another thread. On the other hand, immutable objects cannot be
    subverted by malicious or buggy code so you can share and publish freely without
    the need for defensive copies [EJ Item 24].


    Neither the Java Language Specification nor the Java Memory Model formally defines
    immutability, but immutability is not equivalent to declaring all fields of an
    object final. An object whose fields are all final may still be mutable to mutable
    objects.


    An object is immutable if:


    +   * Its state cannot be modified after construction

    * All its fields are final.[12] and

    * It is properly constructed (this reference does not escape during construction).


    > [12] it is technically possible to have an immutable object without all fields
    being final. String is such a class - but relies on delicate reasoning about being
    data that requires a deep understanding of the Java Memory Model. (For the curious:
    String lazy computes the hash code for the first hashCode is cached and it can
    take only one non-default value that is the every time it is computed because
    it is derivatively immutable from state. Don''t try this at home)


    Immutable objects can still use mutable objects to manage their state, as in ThreeStores
    in Listing 31. While the state stores names is mutable, the design of ThreeStores
    makes it impossible to modify after construction. The stores are final so object
    state is reached through a final field. The last requirement, proper construction,
    is easily met since the constructor that would cause this reference to become
    accessible to code other than the constructor or its caller.'
