  md: '# Chapter 11. Performance and Scalability


    One of the primary reasons to use threads is to improve performance. [1] Using
    threads can improve resource utilization by letting applications easily exploit
    available processing capacity, and can improve responsiveness by letting applications
    begin new tasks while existing tasks are still running.


    > Some might argue this is the only reason we put up with the complexity threads
    introduce.


    This chapter explores techniques for analyzing, monitoring, and improving the
    performance of concurrent programs. Unfortunately, the techniques for improving
    performance also increase complexity, increasing the likelihood of safety and
    lively failures. Worse, some techniques intended to improve performance are counterproductive
    or trade one of performance problem for another. While better performance is desirable
    - improving performance can be very satisfying—safety always comes first. When
    writing your program, make it fast - and then only if your performance requirements
    tell you it needs to be. Designing a concurrent application, squeezing the last
    bit of performance is often the least of your concerns.


    # 11.1. Thinking about Performance


    Improving performance means doing work with fewer resources. The number of “resources”
    can vary; for a given activity, some specific resource is in shortest supply,
    whether it is CPU cycles, memory, network bandwidth, I/O bandwidth, database requests,
    disk space, or any other of resources. When the performance of an activity is
    limited by availability of a particular resource, we say it to be CPU-bound, database-bound,
    etc.


    While the goal is to improve performance overall, using multiple threads introduces
    some performance costs compared to the single-threaded approach. Include the overhead
    of coordinating between threads (locking, signaling, and memory synchronization),
    increased context switching, thread creation and destruction, and scheduling overhead.
    When threading is effectively employed, these costs are more than made for by
    greater throughput, responsiveness, or capacity. On the other hand, poorly designed
    concurrent application can perform worse than a sequential one.


    > [2] A colleague assured me this anecdote: he had been in the testing of an expensive
    and complex application that managed via a tunable thread pool. After some work
    was complete, testing showed that the optimal number of threads for the pool was
    ...1. This should have been obvious from the outset; your system was a single-CPU
    system and the application was almost entirely CPU-bound.


    In concurrency to achieve better performance, we are trying to do two things:
    utilize the resources we have more effectively, and to exploit processing resources
    if they become available. From a performance monitoring perspective, we are looking
    to keep the CPUs busy with useful work. If the program is CPU-bound, this doesn’t
    mean burning cycles with useless computation; we may be able to increase our capacity
    by adding more processors; if it can’t keep the processors busy, adding more wont
    help. Threading offers a means to keep the CPU(s) “hotter” or by decomposing the
    application so there is always work to be done by an available processor.


    # 11.1.1. Performance Versus Scalability


    Application performance can be measured in a number of ways, such as service time,
    latency, throughput, efficiency, or capacity. Some of these (service time, latency)
    are of “how fast” a unit of work is processed or acknowledged; others (capacity,
    throughput) are of “how much” work can be performed with a given quantity of computing
    resources.


    Scalability describes the ability to improve throughput or capacity when additional
    computing resources (such as additional CPUs, memory, storage, or I/O bandwidth)
    are added.


    Designing and tuning for scalability can be very different from traditional performance
    optimization. When tuning for performance, the goal is to do the same work with
    less effort, such as using previously computed results through caching or replacing
    an O(n!) algorithm with an O(n log n). When tuning for scalability, you are instead
    trying to find ways to parallel the problem so you can take advantage of processing
    resources to do more work with more resources.


    These two aspects of performance — how fast and how much — are separate, and sometimes
    they exist at odds with each other. In order to achieve higher scalability or
    better hardware utilization, we end up increasing the amount of work done to process
    each individual task, such as when we divide tasks into “pipelined” subtasks.'
