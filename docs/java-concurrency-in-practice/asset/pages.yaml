  md: "# Chapter 3. Sharing Objects\n\nWe are at the beginning of working concurrent\
    \ programs is primarily about managing access to shared, mutable state. That chapter\
    \ was about using synchronization to prevent multiple threads from accessing the\
    \ same data at the same time; this chapter examines techniques for sharing and\
    \ publishing objects so they can be safely accessed by multiple threads. Together,\
    \ they lay the foundation for building thread-safe classes and structuring concurrent\
    \ applications using the java.util.concurrent library.\n\nWe have seen how synchronized\
    \ blocks and methods ensure that operations execute atomically, but a common misconception\
    \ is that synchronization is only about atomicity or decorating \"critical sections\"\
    . Synchronization also has another, subtle and, aspect: memory visibility. We\
    \ want not only to prevent one thread from modifying the state of an object but\
    \ also to ensure that when a thread modifies the state of an object, others can\
    \ see the changes that were made. Without synchronization, this may not happen.\
    \ You can ensure that objects are published safely by using explicit synchronization\
    \ or by taking advantage of synchronization built into library classes.\n\n# ##\
    \ 3.1 Visibility\n\nVisibility is about the things that go so counterintuitive.\
    \ In a single-threaded environment, if you write to a variable and read it later\
    \ with no intervening writes, you can expect to get the same value back. This\
    \ might seem natural, but it is hard to accept that, when the reads and writes\
    \ occur in different threads, this is not simply the case. In general, there is\
    \ no guarantee that the value you wrote on one thread will be seen by another\
    \ thread, or even at all. To ensure visibility of memory writes across threads,\
    \ you must use synchronization.\n\nvisibility in Listing 3.1 illustrates what\
    \ goes wrong when threads share data without synchronization. The two threads,\
    \ the main and the reader thread, access the shared variables ready and number.\
    \ The main thread sets number to 42 and reads. The reader thread spins until it\
    \ sees ready is true, and then prints out. While it may seem all because it does\
    \ not use adequate synchronization, there is no guarantee that the values of read\
    \ and written by the main thread will be visible to the reader thread.\n\n> Listing\
    \ 3.1 Sharing Variables without Synchronization. Do Not do this.\n\n```\npublic\
    \ class Novibility {\n    private static boolean ready;\n    private static int\
    \ number;\n\n    public static class ReaderThread extends Thread {\n        public\
    \ void run() {\n            while (!ready) {\n                Thread.yield();\n\
    \            }\n            System.out.println(number);\n        }\n    }\n\n\
    \    public static void main(String[] args) {\n        new ReaderThread().start();\n\
    \        number = 42;\n        ready = true;\n    }\n}\n```\n\nnovibility could\
    \ loop forever because visibility could print zero because the write to ready\
    \ might be made visible to the reader thread before the write to a number, a phenomenon\
    \ known as reordering. There is no guarantee that operations in one thread will\
    \ be performed in the order given by the program, as long as the ordering is not\
    \ detectable from within that thread - even if the ordering is apparent to other\
    \ threads.[1] When the main thread sets ready first and then number without synchronization,\
    \ the reader thread could see these writes in the opposite order - or not at all.\n\
    \n[1] This may seem like a broken design, but it is meant to allow JVMs to take\
    \ full advantage of the performance of modern multiprocessor hardware. In the\
    \ absence of synchronization, the Java Memory Model allows the compiler to reorder\
    \ operations and cache values in registers, and permits CPUs to reorder and cache\
    \ values in processor-specific caches. For more details, see Chapter 16."
