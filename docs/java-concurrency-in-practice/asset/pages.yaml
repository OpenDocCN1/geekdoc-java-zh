    \ {\n                queue.put(p.nextProbablePrime());\n            }\n      \
    \  } catch (InterruptedException exception) {\n        }\n    }\n\n    public\
    \ void cancel(boolean cancelled) {\n        cancelled = true;\n    }\n}\nnvoid\
    \ consumePrimes() throws InterruptedException {\n    BlockingQueue<Integer> primes\
    \ = ...;\n    BrokenPrimeProducer producer = new BrokenPrimeProducer(primes);\n\
    \    try {\n        while (needPrimes()) {\n            consume(primes.take());\n\
    \        }\n    } finally {\n        producer.cancel();\n    }\n}\n```\n\n**Listing\
    \ 7.4.** Interruption Methods in Thread.\n\n```\npublic class Thread {\n    public\
    \ void interrupt() { ... }\n    public boolean isInterrupted() { ... }\n    public\
    \ static boolean interrupted() { ... }\n}\n```\n\nIf a interrupt is received when\
    \ it is not blocked, its interrupted status is set, and it is up to the activity\
    \ being cancelled to poll the interrupted status to detect interruption. In this\
    \ way is \"sticky\" if it doesn't trigger an InterruptedException, evidence of\
    \ interruption persists until someone deliberately clears the interrupted status.\n\
    \nCalling interrupt does not necessarily stop the target thread from doing what\
    \ it is doing; it merely delivers the message that interrupt has been requested.\n\
    \nA good way to think about interruption is that it does not actually stop a running\
    \ thread; it just requests the thread interrupt itself at the next convenient\
    \ opportunity. (These opportunities are cancellation points.) Methods, such as\
    \ wait, sleep, and join take such requests, throwing an exception when they receive\
    \ an interrupt request or encounter an already set interrupt status upon entry.\
    \ Well behaved methods may ignore the interrupt request so long as they leave\
    \ the interrupt request in place so that calling code can do something with it.\
    \ Poor behaved methods swallow the interrupt request, denying code further up\
    \ the stack the opportunity to act on.\n\nThe static interrupted method should\
    \ be used with caution, because it clears the current thread's interrupted status.\
    \ If you call interrupt and it returns True, unless you are planning to swallow\
    \ the interruption, you should do something"
