    Chapter 6 explored identifying logical boundaries for decomposing applications
    into tasks. But in order to predict what kind of speedup is possible from running
    your application on a multiprocessor system, you also need to identify the sources
    of serialization in your tasks.


    Imagine an application where N threads execute work in Listing 11.1, fetching
    tasks from a shared work queue and processing them; assume that tasks do not depend
    on the results or side effects of other tasks. For a moment how the tasks get
    onto the queue, how well will this application scale as we add processors? At
    first glance, it may appear that the application is completely parallelizable:
    tasks do not wait for each other, and the more processors available, the more
    tasks can be processed concurrently. However, there is a serial component well
    - fetching the task from the work queue. The work queue is shared by all the worker
    threads, and it will require some amount of synchronization to maintain its integrity
    in the face of concurrent access. If locking is used to guard the state of the
    queue, then while one thread is dequeuing a task, other threads need to dequeue
    their next task must wait - and this is where task processing is serialized.


    This example also ignores another common source of serialization: result handling.
    All useful computations produce some sort of result or side effect, which can
    be eliminated as dead code. Since Runnable provides for no explicit result handling,
    these tasks must have some sort of side effect, writing their results to a log
    file or putting them in a data structure. Log files and result containers are
    usually shared by multiple worker threads and therefore are also a source of serialization.
    If instead each thread maintains its own data structure for results that are merged
    after all the tasks are performed, then the final merge is a sort of serialization.'
