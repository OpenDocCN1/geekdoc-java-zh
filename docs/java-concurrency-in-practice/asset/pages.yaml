    \ area after the open call completes. Thus, by keeping the lock up that other\
    \ threads of a critical section, this technique relies on constructing protocols\
    \ that other threads don't try to get in.\n\n# 10.5. Resource Deadlocks\n\nJust\
    \ as deadlocks occur when they are waiting for a lock that the other holds and\
    \ will not release, they can also deadlock when waiting for resources.\n\n> Listing\
    \ 10.6. Using Open Calls to Avoiding Deadlock Between Cooperating Objects.\n\n\
    ```\n@threadsSafe\nclass Class {\n    @GuardedBy(\"this\") private Point location,\
    \ destination;\n    private final Dispatcher dispatcher;\n\n    public synchronized\
    \ Point getLocation() {\n        return location;\n    }\n\n    public synchronized\
    \ void setLocation(Point location) {\n        boolean reachedDestination;\n  \
