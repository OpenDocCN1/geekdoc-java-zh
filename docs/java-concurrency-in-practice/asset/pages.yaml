  md: '# 5.4.3. Deques and Working Steel


    Java has two classes of deque, one called ''array'' and ''linked'', both extend
    Deque. A deque allows efficient insertion and removal from both the head and tail.
    The implementations are ArrayDeque and LinkedDeque.


    Just as blocking deques lend to the producer-consumer pattern, deques lend to
    a related pattern called working steel. A producer-consumer design has one work
    queue for all consumers; in a working steel design, every consumer has its own
    deque. A worker can take from the tail of some else''s deque. Working steel can
    be more scalable than a producer-consumer design because workers don''t contend
    for the same work queue; if they need to access another''s deque, it does so from
    the tail rather than the head, reducing contention.


    Working steel is well suited to problems in which consumers are also producers
    - when performing a unit of work is likely to result in the identification of
    more work. For example, processing a page in a web crawler results in the identification
    of new pages to be crawled. Similarly, marking garbage collection can be efficiently
    parallelized using steel. When a worker identifies a new unit of work, it places
    it at the end of its own deque (or alternatively, in a work sharing design, of
    another); when its own deque is empty, it works at the end of else''s deque, ensuring
    that every worker stays busy.


    # 5.4. Interruptible Methods


    Threads may block, or for several reasons: waiting for I/O completion, waiting
    to acquire a lock, waking to wait for a computation in another thread. When a
    thread blocks, it is suspended and placed in one of the blocked states (BLOCKED,
    WAITING, or TIMED). The difference between a blocking operation and an operation
    that takes a long time to finish is that a blocked thread must wait for an event
    that is within its control before it proceeds - the I/O completes, the lock becomes
    available, or the external computation finishes. When external events occur, the
    thread is placed back in the RUNNABLE state and


    The put and take methods of BlockingDeque throw checked InterruptedException,
    as a number of other library methods such as Thread.sleep. When a method can throw
    InterruptedException, it is telling you that if it is interrupted, it must make
    an effort to stop blocking early.


    Thread provides the mechanism for interrupting a thread and for querying whether
    a thread has been interrupted. Each thread has a boolean property that represents
    its interrupt status; interrupting a thread sets this status to true.


    Interruption is a cooperative mechanism. One thread cannot force another thread
    to stop what it is doing and do something else; when thread A interrupts thread
    B, A is requesting that B to do something when it''s getting to a point where
    it can. The nature of interruption in the API or language that specifies any application-level
    semantics for interruption, is to cancel an activity. Threads that are responsive
    to interrupt make it easier to cancel long-running activities on a thread.


    When your code calls a method that throws InterruptedException, then it is a blocking
    method too, and must have a plan for responding to it. For library code, there
    are basically two choices:


    Propagate the InterruptedException. This is the most sensitive policy if you can
    get away with it - just propagate the InterruptedException to your caller; instead
    of catching InterruptedException, catch it and throw it again after performing
    some basic-activity-cleanup.


    Restore the interrupt. Sometimes you cannot throw InterruptedException, for instance
    when your code is part of a Runnable. In these cases, you must catch InterruptedException
    and restore the interrupt status by calling interrupt on the current thread, so
    that higher up the call stack can see that an interrupt was issued, and


    You can get much more sophisticated with interruption, but these two approaches
    work in the vast majority of situations. But there is one where you should not
    throw InterruptedExceptioncatch and do nothing in response. This deprives the
    code higher up the call stack of the opportunity to act on the interruption, because
    the evidence that the thread was interrupted is lost. The only situation in which
    it is acceptable to swallow an interrupt is when you are extending Thread and
    therefore control the control higher up on the call stack. Cancellation and interruption
    are covered in greater detail in Chapter 7.'
