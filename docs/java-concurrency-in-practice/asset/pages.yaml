  md: "# 5BPart II: Structuring Concurrent Applications - 19BChapter 7. Cancellation\
    \ and Shutdown\n\ninterrupt method interrupts the target thread, and isInterrupted\
    \ returns the interrupted status of the target thread. The poorly named static\
    \ method clears the interrupted status of the current thread and returns its previous\
    \ value; this is the only way to clear the interrupted status.\n\nBlocking libraries\
    \ like Thread.sleep and object.wait try to detect when a thread has been interrupted\
    \ and return early. They respond to interruption by clearing the interrupted status\
    \ and throwing InterruptedException indicating that the operation completed early\
    \ during the interruption. The JVM makes no guarantees on how quickly a blocking\
    \ method will detect interrupt, but in practice it handles this reasonably.\n\n\
    **Listing 7.3.** Unreliable Cancellation that can Leave Producers Stuck in a Blocking\
    \ Operation. Do not do this.\n\n![](img/c64daf12e0d6c877213813fc53c890a4_103_0.png)\n\
    \n```\nclass BrokenPrimeProducer extends Thread {\n    private final BlockingQueue<Integer>\
