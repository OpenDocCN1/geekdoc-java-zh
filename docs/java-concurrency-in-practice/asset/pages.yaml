    \ consistency, meaning that all actions in the program appear to happen in a fixed,\
    \ global order.\n\nThe rules for happens-before are:\n\n+   - Program order rule.\
    \ Each action in a thread happens-before every action in that thread that comes\
    \ later in the program order.\n- Monitor lock rule. An unlock on a monitor lock\
    \ happens-before every subsequent lock on that same monitor lock.[3]\n- Volatile\
    \ variable rule. A write to a volatile field happens-before every subsequent read\
    \ of that field.[4]\n- Thread start rule. A call to .start on a thread happens-before\
    \ every action in the started thread.\n- Thread termination rule. Any action in\
    \ a thread happens-before every thread that has terminated, either by successfully\
    \ return from thread.join or by thread.isAlive returning false.\n- Intersection\
    \ rule. A thread calling interrupt on another thread happens-before the interrupted\
    \ thread detects the interrupt (either by having InterruptedException thrown or\
    \ by invoking isInterrupted).\n- Finalizer rule. The end of a constructor for\
    \ an object happens-before the start of the finalizer for that object.\n- Transitivity.\
    \ If A happens-before B, and B happens-before C, then A happens-before C.\n\n\
    > [3] Locks and unlocks on Lock objects have the same memory semantics as intrinsic\
    \ locks.\n[4] Reads and writes of atomic variables have the same memory semantics\
    \ as volatile variables.\n\nEven actions are only partially ordered, synchronization\
    \ actions - lock acquisition and release, and reads and writes of volatile variables\
    \ - totally ordered. This makes it sensible to define happens-before in terms\
    \ of \"subsequent\" actions and reads of volatile variables.\n\nFigure 16.2 illustrates\
    \ the happens-relation when two threads synchronize using a common lock. All the\
    \ actions within A are ordered by the program order, as are the actions within\
    \ B. Because B acquires M, all actions in A releasing lock are therefore ordered\
    \ before the actions in B after acquiring the lock. When threads synchronize on\
    \ different locks, we can't say anything about the ordering of actions between\
    \ them - there is no happens-before relation between the actions in the two threads."
