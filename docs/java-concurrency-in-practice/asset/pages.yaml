  md: "# FutureTask\n\n# S.5.2. FutureTask\n\nFutureTask also implements Future, which\
    \ describes an abstract result-bearing computation [CP 4.3.3]. A Future represented\
    \ by a FutureTask is implemented with a callable equivalent of Runnable, and can\
    \ be in one of three states: waiting for result, running, or completed. Completion\
    \ subsumes all ways computation can complete, including normal completion, cancellation,\
    \ and exception. Once a Future enters the completed state, it stays in that state\
    \ forever.\n\nThe behavior of FutureTask depends on the state of the task. If\
    \ it is completed, get the results immediately, and otherwise blocks until the\
    \ task reaches the completed state and then returns the results or an exception.\
    \ FutureTask conveys the result from executing the computation to the thread(s)\
    \ retrieving the result; the specification of FutureTask guarantees that this\
    \ transfer constitutes a publication of the result.\n\n**Listing 5.11. Using CountDownLatch\
    \ for Starting and Stopping Threads in Timing Tests.**\n\n```\npublic class CountDownLatch\
    \ {\n    public long timeTest(int nThreads, final Runnable task) {\n        throws\
    \ InterruptedException\n    }    {\n        final CountDownLatch startGate = new\
    \ CountDownLatch(1);\n        final CountDownLatch endGate = new CountDownLatch(nThreads);\n\
    \n        for (int i = 0; i < nThreads; i++) {\n            Thread t = new Thread(()\
    \ -> {\n                public void run() {\n                    try {\n     \
    \                   startGate.await();\n                        try {\n      \
    \                      task.run();\n                        } finally {\n    \
    \                        endGate.countDown();\n                        }\n   \
    \                 } catch (InterruptedException ignored) {}\n                }\n\
    \            });\n            t.start();\n        }\n\n        long start = System.nanoTime();\n\
    \        startGate.countDown();\n        endGate.await();\n        long end =\
    \ System.nanoTime();\n        return end - start;\n    }\n}\n\n```\n\nFutureTask\
    \ is used by the Executor framework to represent any asynchronous tasks, and can\
    \ also be used to represent any potentially lengthy computation that can be started\
    \ before the results are needed. Preloader in Listing 5.12 uses FutureTask to\
    \ perform an expensive computation whose results are needed later; by starting\
    \ the computation early, you reduce the time you would have to wait later when\
    \ you actually need the results."
