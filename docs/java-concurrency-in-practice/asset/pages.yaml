  md: '# # Chapter 2. Thread Safety


    Perhaps surprisingly, concurrent programming is not as much about threads or locks,
    as civil engineering is about rivets and i-beams. Of course, building bridges
    that don''t fall under load requires the correct use of a rivet of i-beams, but
    these are mechanisms to an end. Writing thread-safe code is, at core, managing
    access to, in particular, and to shared, mutable state.


    Informally, an object''s state is its data, stored in variables such as instance
    or static fields. An object''s state may also include fields from other, dependent
    objects; a HashMap''s state is partially stored in the HashMap itself, but also
    within any Map. An object''s state encompasses any data that can affect its externally
    visible behavior.


    By shared, we mean a variable can be accessed by multiple threads; by mutable,
    we mean its value can change during its lifetime. We may talk about thread safety
    if it were about code, but what we are actually trying to do prevent damage from
    uncontrolled access.


    Whether an object needs to be thread-safe depends on whether it will be accessed
    from multiple threads. not what it does. It is a property of the object used.
    Making an object thread-safe requires synchronization to coordinate access to
    its state; failing to do so will result in data corruption and unintended consequences.


    Whenever more than one thread accesses a given state, and one of them might try
    to write it, all must coordinate their access to it using synchronization. The
    primary mechanism for synchronization in Java is the synchronized keyword, which
    provides exclusive locking, but the term "synchronization" also includes the use
    of volatile variables, explicit locks, and atomic variables.


    You should avoid the temptation to think that there are "special" situations where
    this rule does not apply. A program that omits synchronization might appear correct,
    passing tests and performing well for years, but it will be broken and fail at
    any moment.


    +   If multiple threads access the same mutable state variable without appropriate
    synchronization, your program is broken.

    - Don''t share the state variable across threads;

    - Make the state variable immutable; or

    - Use synchronization whenever accessing the state variable.


    If you haven''t considered concurrent access in your class of design, some of
    these approaches can require significant design modifications, so fixing the problem
    might not be as trivial as this advice makes sound. It is far easier to design
    a class to be thread-safe than to retrofit it for thread safety.


    In a large program, identifying which threads might access a given variable can
    be complicated. Frankly, the same object-oriented techniques that help write well-organized,
    maintainable classes - such as encapsulation and data hiding - can also help create
    thread-safe classes. The less code has access to a particular variable, the easier
    it is to ensure all of it uses proper synchronization, and the easier it is to
    reason about the conditions under which a variable is made. The Java language
    does not prevent you to encapsulate - it is perfectly allowable to store state
    in private fields (even static fields) or publish a reference to an otherwise
    internal object - but the better encapsulated the easier it is to make your program
    thread-safe and to help maintainers keep it that way.


    When designing thread-safe classes, good object-oriented techniques - encapsulation,
    immutability, and clear specification of invariants - are your best friends.


    There will be times when good object-oriented design techniques are at odds with
    real-world requirements; it may be necessary in these cases to compromise the
    rules of design for the sake of performance or for the sake of backward compatibility
    with legacy code. Abstraction and encapsulation are at odds with -'
