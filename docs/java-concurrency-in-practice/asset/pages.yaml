    \ were implementing HashMap, you would have a choice of how size counts the number\
    \ of entries in the Map. The simplest approach is to count the number of entries\
    \ every time it is called. A common optimization is to update a separate counter\
    \ as entries are added or removed; this increases the cost of a put or remove\
    \ operation to keep the counter up-to-date, but reduces the cost of the size operation\
    \ from O(n) to O(1).\n\nKeeping a counter to speed up operations like size and\
    \ isEmpty works fine for a single-threaded or highly synchronized implementation,\
    \ but it makes it harder to improve the scalability of the implementation because\
    \ every operation that the map must now update the shared counter. If you use\
    \ lock stripping for hashes, synchronizing to the counter introduces the scalability\
