  md: "# Chapter 14 - Building Custom Synchronizers\n\nThe classes library include\
    \ a number of state-dependent classes - those operations with state-based preconditions\
    \ as FutureTask, Semaphore, and BlockingQueue. For example, you cannot remove\
    \ from an empty queue or retrieve the result of a task that has not yet finished;\
    \ before these operations can proceed, you must wait until the queue enters the\
    \ \"nonempty\" state or the task completes the \"completed\" state.\n\nThe easiest\
    \ way to construct a state-dependent class is to build on top of an existing state-dependent\
    \ library class; we did this in ValueLatch on page 187, using CountDownLatch to\
    \ provide the required library behavior. If the library classes do not provide\
    \ the functionality you need, you can build your own synchronizers using the low-level\
    \ mechanisms provided by the language and libraries, including intrinsic queues,\
    \ explicit condition objects, and the AbstractuedSynchronizer framework. This\
    \ chapter explores the various options for implementing state dependence and the\
    \ rules for using the state dependence mechanisms provided by the platform.\n\n\
    # 14.1. Managing State Dependence\n\nIn a single-threaded program, if a state-dependent\
    \ (like the connection pool is nonempty) does not hold when a method is called,\
    \ it will never be true. Therefore, in sequential programs it can be coded to\
    \ fail when their preconditions do not hold. But in a concurrent program, state-dependent\
    \ conditions can change through the actions of other threads: a pool that may\
    \ become empty. State-dependent methods on concurrent objects can sometimes get\
    \ away with failing when their preconditions are not met, but then there is a\
    \ better alternative: wait for the precondition to become true.\n\nState-dependent\
    \ operations that block the operation can proceed are more convenient and less-prone\
    \ than those that simply fail. The built-in queue mechanism enables threads to\
    \ block an object until a state that allows progress and wake blocked threads\
    \ when they may be made to make further progress. We cover the details of queue\
    \ operations in Section 14.2, but to motivate the value of efficient queue mechanism,\
    \ we show how state dependence might be (painfully) achieved using polling and\
    \ signaling.\n\n14.1. Structure of Blocking State-dependent Actions.\n\n```\n\
    void acquire() throws InterruptedException {\n    while (precondition does not\
    \ hold) {\n        release lock;\n        wait(); // precondition might hold\n\
    \        optionally fail if interrupted or timeout expires\n        acquire lock;\n\
    \    }\n    perform action\n}\n```\n\nBounded buffers are commonly used in producer-consumer\
    \ designs. A bounded buffer provides put and take operations, each of which has\
    \ preconditions: you cannot take an element from an empty buffer, nor put an element\
    \ into a full buffer. State-dependent operations can cause failure by either returning\
    \ or returning an error status (making the caller's problem), or by blocking the\
    \ operation transitions to the right state.\n\nWe're going to develop several\
    \ implementations of a bounded buffer that take different approaches to precondition\
    \ failure. Each example basedBoundedBuffer in Listing 14.2, which implements a\
    \ class-based circular buffer where the buffer variables (buf, head, tail, and\
    \ count) are guarded by the buffer's intrinsic lock. It provides synchronized\
    \ put and take methods that are used by subclasses to implement the put and take\
    \ operations; the underlying state is hidden from the subclasses.\n\n# 14.1.1.\
    \ Example: Propagating Precondition Failure to Callers\n\nBoundedBuffer in Listing\
    \ 14.3 is a crude attempt at implementing a bounded buffer. The put and take methods\
    \ are synchronized to ensure exclusive access to the buffer state, since both\
    \ employ check-then-act logic in accessing the buffer."
