    \ {\n    private static final int THREADS = 100;\n    private static final Executor\
    \ exec = Executors.newFixedThreadPool(THREADS);\n\n    public static void main(String[]\
    \ args) throws IOException {\n        ServerSocket socket = new ServerSocket(80);\n\
    \        while (true) {\n            final Socket connection = socket.accept();\n\
    \            Runnable task = new Runnable()(){\n                public void run()\
    \ {\n                    handleRequest(connection);\n                }\n     \
    \       };\n            exec.execute(task);\n        }\n    }\n}\n```\n\nWe can\
    \ easily modify TaskExecutionwebserver to behave like ThreadPer-TaskWebserver\
    \ by substituting an Executor for each request. Writing such an Executor is trivial,\
    \ as shown in ThreadPerTaskExecutor in Listing 6.5.\n\n# Listing 6.5. Executor\
    \ that Starts a New Thread for Each Task.\n\n```\npublic class ThreadPerTaskExecutor\
    \ implements Executor {\n    public void execute(Runnable r) {\n        new Thread(r).start();\n\
    \    }\n}\n```\n\nSimilarly, it is as easy to write an Executor that would make\
    \ TaskExecutionwebserver behave like the single-threaded version, executing each\
    \ task synchronously before returning from execute, as shown within ThreadExecutor\
    \ in Listing 6.6.\n\n# 6.2.2. Execution Policies\n\nThe value of decoupling submission\
    \ from execution is that lets lets easily specify, and subsequently change without\
    \ great difficulty, the execution policy for any class of tasks. An execution\
    \ policy specifies the \"what, where, when, and \"how\" of task execution, including:\n\
    \n# Listing 6.6. Executor that Executes Tasks Synchronously in the Calling Thread.\n\
    \n```\npublic class ThreadExecutor implements Executor {\n    public void execute(Runnable\
    \ r) {\n        r.run();\n    }\n}\n```\n\n+   - In what tasks will be executed?\n\
    - In what order should tasks be executed (FIFO, LIFO, priority)?\n- How many tasks\
    \ may be queued execution?\n- If a task has to be rejected because the system\
    \ is overloaded, which task should be selected as the victim, and how should the\
    \ application be notified?\n- What actions should be taken before or after executing\
    \ a task?\n\nExecution policies are a resource management tool, and the optimal\
    \ policy depends on the available resources and requirements. By limiting the\
    \ number of concurrent tasks, we can ensure that the application does not fail\
    \ due to resource exhaustion or performance problems due to contention for resources.\
    \ [3] Separating the execution policy from task submission makes it practical\
    \ to select an execution policy at deployment time that matches to the available\
    \ hardware.\n\n> [3] This is analogous to one of the roles of a transaction monitor\
    \ in an enterprise application: it can throttle the rate at which transactions\
    \ are allowed to proceed so as not to exhaust or overwhelm limited resources.\n\
    \nWhenever you see this code of:\n\n```\nnew Thread(runnable).start()\n```"
