  md: "# Java Concurrency in Practice\n\n```\nListing 8.17. Result-batch Latch Used\
    \ by ConcurrentPuzzle.\n@ThreadSafe\npublic class valueLatch<T> {\n    @guardedBy(\"\
    this\") private T value = null;\n    private final CountDownLatch latch = new\
    \ CountDownLatch(1);\n    public boolean isSet() {\n        return (latch.getCount()\
    \ == 0);\n    }\n    public synchronized void setValue(T newValue) {\n       \
    \ if (!isSet()) {\n            value = newValue;\n            latch.countDown();\n\
    \        }\n    }\n    public T getValue() throws InterruptedException {\n   \
    \     latch.await();\n        synchronized (this) {\n            return value;\n\
    \        }\n    }\n}\n```\n\nConcurrentPuzzleSolver does not deal well with the\
    \ case where there is no solution: if all possible moves and positions have been\
    \ evaluated and no solution has been found, solve waits forever in the call to\
    \ getSolution. The sequential version would terminate when it had exhausted the\
    \ search space, but getting concurrent to terminate can be more difficult. One\
    \ possible solution is to keep a count of active tasks and set the solution to\
    \ null when the count drops to zero, as in Listing 8.18.\n\nFinding the solution\
    \ may also take longer than we are willing to wait; there are several additional\
    \ termination conditions we could impose on the solver. One time is the limit;\
    \ this is easily done by putting a timeout on valueLatch(which would use the timed\
    \ version of await), and shutting down the Executor and failing if it times out.\
    \ We can also provide a cancellation mechanism and let the client make its decision\
    \ on when to stop searching.\n\n```\nListing 8.18. Recognizing when No Solution\
    \ Exists.\npublic class PuzzleSolver<P,M> extends ConcurrentPuzzleSolver<P,M>\
    \ {\n    private final AtomicInteger timeCounter = new AtomicInteger(0);\n   \
    \ protected Runnable newTask(P p, M m, Node<P,M> n) {\n        return new CountingSolverTask(p,\
    \ m, n);\n    }\n    class CountingSolverTask extends SolverTask {\n        CountingSolverTask(P\
    \ pos, M move, Node<P,M> prev) {\n            super(pos, move, prev);\n      \
    \      taskCount.incrementAndGet();\n        }\n        public void run() {\n\
    \            try {\n                super.run();\n            } finally {\n  \
    \              if (taskCount.decrementAndGet() == 0)\n                    solution.setValue(null);\n\
    \            }\n        }\n    }\n}\n\n```\n\n# Summary\n\nThe Executor framework\
