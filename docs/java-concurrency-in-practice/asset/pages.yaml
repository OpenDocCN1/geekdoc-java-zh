  md: "Reader encapsulates cancellation of socket-threading by overriding the interrupt;\
    \ the same can be done for tasks by overriding Future.cancel.\n\ncancelableTask\
    \ in Future defines a cancelableTask interface that extends cancelable and adds\
    \ a cancel method and a new factory method for constructing a RunnableFuture.\
    \ CancellingExecutor extends Executor and overrides newTaskFor to let a cancelableTask\
    \ create its own Future.\n\n# 7.11. Encapsulating Normal in a Thread by Overriding\
    \ Interrupt.\n\n```\npublic class ReaderThread extends Thread {\n    private final\
    \ Socket socket;\n    private final InputStream in;\n\n    public ReaderThread(Socket\
    \ socket) throws IOException {\n        this.socket = socket;\n        this.in\
    \ = socket.getInputStream();\n    }\n\n    public void interrupt() {\n       \
    \ try {\n            socket.close();\n        } catch (IOException ignored) {\
    \ }\n        finally {\n            super.interrupt();\n        }\n    }\n\n \
    \   public void run() {\n        try {\n            byte[] buf = new byte[BUFSIZE];\n\
    \            int count;\n            while ((count = in.read(buf)) {\n       \
    \         if (count < 0)\n                    break;\n                else if\
    \ (count > 0)\n                    processBuffer(buf, count);\n            }\n\
    \        } catch (IOException e) { /* Allow thread to exit */ }\n    }\n}\n```\n\
    \nsocketUsingTask implements cancelableTask and defines Future.cancel to close\
    \ the socket as well as call super.cancel. if socketUsingTask is cancelled during\
    \ its Future, the socket is closed and the executing thread is interrupted. This\
    \ increases the task's responsiveness to cancellation: not only can it safely\
    \ call interruptible methods while maintaining responsive to cancellation, but\
    \ it can also blocking socket I/O methods.\n\n# 7.2. Stopping a Thread-based Service\n\
    \nApplications create services that spawn threads, as thread pools, and the lifetime\
    \ of these services is usually longer than that of the method that creates them.\
    \ If the application is to shut down gracefully, the threads owned by these services\
    \ need to be terminated. Since there is no preemptive way to shut a thread, one\
    \ must be persuaded to shut down itself.\n\nSensible encapsulation dictate that\
    \ you should not manipulate a thread - interrupt it, modify its priority, etc.\
    \ - unless you it. The thread API has no formal concept of thread ownership: a\
    \ thread is represented with a thread object that can be shared like any other\
    \ object. However, it makes sense to think of a thread as having an owner, and\
    \ this is usually the class that created the thread. So thread pool owns its workers,\
    \ and if those threads need to be interrupted, the thread pool should take care\
    \ of it.\n\nWith any other encapsulated object, thread ownership is not transitive:\
    \ the application may own the service and the service may doesn't own the worker\
    \ threads and therefore should not attempt to shut them down. Instead, the service\
    \ should provide lifecycle methods for shutting itself down and also shut down\
    \ the owned threads. ExecutorService provides the shutdown and shutdownNow methods;\
    \ other thread-owning services provide a similar shutdown mechanism.\n\nProvide\
    \ lifecycle methods whenever a thread-service has a lifetime longer than that\
    \ of the method that created it."
