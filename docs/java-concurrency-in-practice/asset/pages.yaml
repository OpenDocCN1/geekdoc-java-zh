    \ unique among the collections: not only do they act as containers for objects,\
    \ but they can also coordinate the control flow of producer and consumer threads\
    \ because they put and block until the desired state (not empty or full).\n\n\
    A synchronizer is any object that coordinates the control flow of threads based\
    \ on its state. Blocking queues can act as synchronizers; other types of synchronizers\
    \ include semaphores, barriers, and latches. There are a number of synchronizer\
    \ classes in the platform library; if you do not need them, you can also create\
    \ your own using the mechanisms described in Chapter 14.\n\nAll synchronizers\
    \ share certain structural properties: they encapsulate state that determines\
    \ whether threads arriving at the synchronizer should be allowed to pass or forced\
    \ to wait, provide methods to manipulate that state, and provide methods to wait\
    \ for the desired state.\n\n# 5.5.1. Latches\n\nA latch can delay the progress\
    \ of threads until it reaches its terminal state (CPJ 3.4).2). A latch can act\
    \ as a gate: until the latch reaches the terminal state it is closed and no thread\
    \ can pass, and until the state opens, allowing all threads to pass. Once the\
    \ latch reaches the terminal state, it cannot change state again, and remains\
    \ open forever. Latches can be used to ensure that certain activities do not proceed\
    \ until other one-time activities complete, such as\n\n+   - Ensuring that computation\
    \ does not proceed until resources have been initialized. A simple binary (two-way)\
    \ latch could be used to identify \"Resource R has initialized\", and any activity\
    \ that requires R would wait on this latch.\n- Ensuring that a service does not\
    \ start until other services have been started. Each service would have an associated\
    \ binary latch; starting service would involve waiting on the other services on\
    \ which S depends, then releasing the S latch after startup completes so all services\
    \ that depend on S can proceed.\n- Waiting until all parties involved in an activity,\
    \ for the players in a multi-player game, are ready to proceed. In this case,\
    \ the latch reaches the terminal state after all the players are ready.\n\nCountDownLatch\
    \ is a flexible implementation that can be used in any of these situations; it\
    \ one or more threads wait for a set of events to occur. The latch state consists\
    \ of a counter initialized to a positive number, representing the number of events\
    \ to wait for. The count method decrements the counter, until reaching zero, which\
    \ happens when all the events have occurred. If the counter is not on zero, await\
    \ blocks until the counter reaches zero, the waiting thread is interrupted, or\
    \ it times out.\n\nTestarness in Listing 5.11 shows us common uses for latches.\
    \ Testarness creates a number of threads for a given task. It uses two latches,\
    \ a \"starting gate\" and an \"ending gate\". The gate is initialized with a count\
    \ of one; each worker waits on the starting gate; this ensures that no threads\
