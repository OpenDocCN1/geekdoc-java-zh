  md: '# Java Concurrency in Practice


    # 13.1.1. Polled and Tilled Lock Acquisition


    The timed and polled lock-acquisition modes by TryLock allow more sophisticated
    recovery than unconditional acquisition. With intrinsic locks, a deadlock is fatal
    - the only way to recover is to restart the application, and the only defense
    is to construct your program so that lock ordering is impossible. Timed and polled
    locking offer another option: probabilistic deadlock avoidance.


    Using timed or polled lock acquisition (TryLock) lets you regain control if you
    acquire all the required locks, release the ones you did acquire, and try again
    (at least log the failure and so on). Listing 13.3 shows an alternative way of
    addressing the dynamic lock ordering from Section 10.1.2: use TryLock to attempt
    to acquire both locks, but also back off and retry if they cannot be acquired.
    The sleep has a fixed time and a random component to reduce the likelihood of
    deadlock. If the locks cannot be acquired within the specified time, transfer
    returns a failure status so that the operation can fail gracefully (see [CPI 2.5.2]
    and [CPI 2.5.3] for more examples of using polled locks for deadlock avoidance


    Timed locks are also useful in implementing activities that manage a time budget
    (see Section 6.3.7). When an activity with a time budget calls a blocking method,
    it can timeout corresponding to the remaining time in the budget. This lets activities
    terminate early if they cannot deliver a result within the desired time. With
    intrinsic locks, there is no way to cancel a lock acquisition if it started, so
    intrinsic locks put the implementation of time-budget activities at risk.


    The travel portal example in Listing 6.17 on page 134 creates a separate task
    for each car-rental company from which it was soliciting bids. Soliciting a bid
    probably involves some sort of network-based request mechanism, such as a web
    service request. Soliciting a bid might also require exclusive access to a resource,
    such as a direct communications line guarded by a Lock, but fails gracefully if
    it cannot do so within its time budget. The timed TryLock


    # 13.1.2. Interruptible Lock Acquisition


    Just as timed lock acquisition allows exclusive locking to be used within time-limited
    activities, interruptible lock acquisition allows locking to be used within cancellable
    activities. Section 7.1.6 identified several mechanisms, such as acquiring an
    intrinsic lock, that are not responsive to interruption. These non-interruptible
    blocking mechanisms complicate the implementation of cancellable tasks. The lockInterruptibly
    method allows you to acquire a lock while remaining responsive to interruption,
    and in Lock avoids creating another category of non-interruptible blocking mechanisms.'
