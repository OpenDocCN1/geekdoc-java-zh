  md: "# 5BPart II: Structuring Concurrent Applications - 19BChapter 7. Cancellation\
    \ and Shutdown\n\ntechnique to work, the tasks must preserve the interrupted status\
    \ when they return, which well behaved tasks will do anyway.\n\n# **Listing 7.21.\
    \ ExecutorService that Keeps Track of Cancelled Tasks After Shutdown.**\n\n```\n\
    public class TrackingExecutor extends AbstractExecutor {\n    private final Set<Runnable>\
    \ tasksCancelledAfterShutdown = \n        Collections.synchronizedSet(new HashSet<Runnable>());\n\
    \n    public List<Runnable> getCancelledTasks() {\n        if (exec.isInterrupted())\
    \ {\n            throw new IllegalStateException(...);\n        }\n        return\
    \ new ArrayList<>(tasksCancelledAfterShutdown);\n    }\n\n    public void execute(final\
    \ Runnable runnable) {\n        exec.execute(new Runnable() {\n            public\
    \ void run() {\n                try {\n                    runnable.run();\n \
    \               } finally {\n                    if (isShutdown()\n          \
    \              && Thread.currentThread().isInterrupted())\n                  \
    \      tasksCancelledAfterShutdown.add(runnable);\n                }\n       \
    \     }\n        });\n    }\n});\n\n    // delegate other ExecutorService methods\
    \ to exec\n```\n\nwebCrawler in Listing 7.22 shows an application of tracking-executor.\
    \ The work of a web crawler is often unbounded, so if a crawler must be shut down\
    \ we might want to save its state so it can be restarted. CrawlTask provides a\
    \ get method that identifies what page it is working on. When the crawler is shut\
    \ down, both the tasks that did not start and those that were cancelled scanned\
    \ and their URLs recorded, so that page-crawling tasks for those URLs can be added\
    \ to the queue when the crawler restarts.\n\nTrackingExecutor has an unavoidable\
    \ race condition that could make it yield false positives: tasks that are identified\
    \ as cancelled but actually completed. This arises because the thread pool could\
    \ be shut down between the last instruction of the task executes and when the\
    \ pool records the task as complete. This is not a problem if tasks are idempotent\
    \ (if performing them twice has the same effect as performing them once), as they\
    \ are typically in a web crawler. Otherwise, the application retrieving the cancelled\
    \ tasks must be aware of this risk and be prepared to deal with false positives."
