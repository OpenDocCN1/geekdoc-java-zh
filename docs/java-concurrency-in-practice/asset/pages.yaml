  md: 'The locking strategy implemented by read-write locks allows multiple simultaneous
    readers but only a single writer. Like ReadWriteLock admits multiple implementations
    that can vary in performance, scheduling guarantees, acquisition fairness, or
    locking semantics.


    Read-write locks are a performance optimization designed to allow greater concurrency
    in certain situations. Read-write locks can improve performance for frequently
    accessed read-mostly structures in multiprocessor systems; under other conditions
    they perform poorly versus exclusive locks due to their greater complexity. Whether
    they are an improvement in any given situation is best determined by profiling;
    because ReadWriteLock uses lock for the read and write points, it is relatively
    easy to swap out a read-write lock for an exclusive one if profiling that a read-write
    lock is not what.


    The interaction between the read and write locks allows for a number of possible
    implementations. Some of the implementation options for a ReadWriteLock are:


    +   Release preference. When a writer releases the lock and both readers and writers
    are queued up, who should be given preference - readers, writers, or whoever asked?


    +   Reader banging. If the lock is held by readers but there are waiting writers,
    newly arriving readers be granted immediate access, or should they wait behind
    the writers? Allowing readers to barge ahead of writers enhances concurrency but
    runs the risk of starving writers.


    +   Reentrancy. Are read and write locks reentrant?


    Downgrading. If a thread holds the lock, can it acquire the read lock without
    releasing the write lock? This would require a "downgrade" to a read lock without
    letting other modifiers access the resource in the meantime.


    Upgrading. Can a read lock be upgraded to a write lock in preference to other
    waiting readers or writers? Most-write lock implementations do not support upgrading,
    because without an explicit upgrade operation it will deadlock. (If two threads
    simultaneously attempt to upgrade to a lock, neither will release the lock.)


    ReentrantReadLock provides reentrant locking semantics for both locks. Like ReentrantLock,
    a ReentrantReadLock can be constructed as non-fair (the default) or fair. With
    a fair lock, preference is given to the thread that has been waiting the longest;
    if the lock is held by readers and a thread requests the lock, no readers are
    allowed to acquire the read lock until the writer has been serviced and releases
    the write lock. With a non-fair lock, the order in which threads are granted access
    is unspecified. Dowgrading from writer to reader is permitted; upgrading from
    reader to writer is not (attempting to do so results in deadlock).


    Like ReentrantLock, the write lock in ReentrantReadWriteLock has a unique owner
    and is released only by the thread that acquired it. In Java 5.0, the lock behaves
    more like a Semaphore than one, maintaining the count of active readers, not their
    identities. This behavior was changed in Java 6 to keep track of which threads
    have been granted the lock. [6]


    [6] One reason for this change is that under Java 5.0, the lock implementation
    cannot distinguish between a requesting the lock for the first time and a reentrant
    request, which would make fair read-write locks deadlock-prone.


    Read-write locks improve concurrency when locks are typically held for a longer
    time and most operations do not modify the guarded resources. ReadWriteMap in
    Listing 13.7 uses a ReentrantReadWriteLock to wrap a Map so that it can be shared
    by multiple readers and still prevent reader-writer-writer conflicts. [17] In
    ConcurrentHashMap''s performance is so good that you would probably use it rather
    than this approach if you needed a concurrent hash-based map, but this technique
    would be useful if you want to provide more concurrent access to an alternate
    implementation such as LinkedHashMap.


    [7] ReadWriteMap does not implement Map because implementing the view methods
    such as entrySet and values would be difficult and the "easy" methods are usually
    sufficient.'
