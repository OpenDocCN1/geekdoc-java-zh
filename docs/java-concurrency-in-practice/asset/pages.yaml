  md: "A further problem with dividing heterogeneous tasks among multiple workers\
    \ is that the tasks have disparate sizes. If you divide tasks A and B between\
    \ two workers but A takes ten as long as B, you've sped up the total process by\
    \ 9%. By dividing a task among multiple workers always involves some amount of\
    \ coordination overhead; for the division to be worthwhile, this overhead must\
    \ be more compensated by productivity improvements due to parallelism.\n\nFutureRenderer\
    \ uses two tasks: one for rendering text and one for downloading images. If rendering\
    \ the text is much faster than downloading the images, as is possible, the resulting\
    \ performance is not different from the sequential version, but code is a lot\
    \ more complicated. And the best we can do when two threads are speed up by a\
    \ factor of two. Thus, trying to increase concurrency by parallelizing heterogeneous\
    \ activities can be a lot of work, and there is a limit to how much additional\
    \ concurrency you can get out of (See Sections 11.4.2 and 11.4.3 for another example\
    \ of the same phenomenon).\n\n# Listing 6.3. Waiting for Image Download with Future.\n\
    \n```\npublic class FutureRenderer {\n    private final Executor executor = ...;\n\
    \n    void renderPage(CharSequence source) {\n        final List<ImageInfo> imageInfos\
    \ = scanForImage(source);\n        Callable<List<ImageData>> task = new Callable<List<ImageData>>(){\n\
    \            public List<ImageData> call() {\n                List<ImageData>\
    \ result = new ArrayList<>();\n                for (ImageInfo imageInfo : imageInfos)\
    \ {\n                    result.add(imageCache.downloadImage(imageId));\n    \
    \            }\n                return result;\n            }\n        };\n  \
    \      Future<List<ImageData>> future = executor.submit(task);\n\n        try\
    \ {\n            List<ImageData> imageData = future.get();\n            for (ImageData\
    \ data : imageData) {\n                renderImage(data);\n            }\n   \
    \     } catch (InterruptedException e) {\n            // Re-assert the interrupted\
    \ status\n            Thread.currentThread().interrupt();\n            // we don't\
    \ need the result, so cancel the task too\n            future.cancel(true);\n\
    \        } catch (ExecutionException e) {\n            throw RuntimeException(e.getCause());\n\
    \        }\n    }\n}\n```\n\nThe real payoff of dividing a program into tasks\
    \ when there are a large number of independent, heterogeneous tasks that can be\
    \ processed concurrently.\n\n# 6.3.5. completionService: Executor Meets BlockingQueue\n\
    \nIf you have batches of computations to submit to an Executor and you want to\
    \ retrieve their results as they become available, you could retain the Future\
    \ associated with each task and repeatedly poll for completion by calling with\
    \ a timeout of zero. This is possible, but tedious. Fortunately there is a better\
    \ way: a completion service.\n\nService combines the functionality of an Executor\
    \ and a BlockingQueue. You can submit callable tasks to it execute and use the\
    \ queue-like methods to poll for completed results, as packaged as Futures, as\
    \ they become available. ExecutorCompletionService implements completionService,\
    \ delegating the computation to an Executor.\n\nThe implementation of ExecutorCompletionService\
    \ is straightforward. The constructor creates a BlockingQueue to hold the completed\
    \ results. Future has a done method that is called when the computation completes.\
    \ When a task is submitted, it is wrapped in a FutureTask that a subclass of Task\
    \ that overrides the done method, as shown in Listing 6.14. The take and poll\
    \ methods delegate to the Blockingqueue, if results are not yet available."
