  md: '# Chapter 9. GUI Applications


    If you''ve tried to use a simple GUI application using Swing, know that GUI applications
    have their own peculiar issues. To maintain safety, tasks must run in the event
    thread. But you cannot execute long-running tasks in the event thread, the UI
    becomes unresponsive. And Swing data structures are not thread-safe, so you must
    be careful to confine them to the event thread.


    Nearly all GUI toolkits, including Swing and SWT, are implemented as single-threaded
    subsystems in all GUI activity is confined to a single thread. If you are not
    planning to be a totally single-threaded program, there will be activities that
    run partially in an thread and partially in the event thread. Like many other
    threading bugs, giving this division wrong may not make your program crash immediately;
    it could behave badly under-to-identify conditions. Even though GUI frameworks
    themselves are single-threaded subsystems, your application may not be, and you
    still need to consider threading issues carefully when writing code.


    # 9.1. Why are GUIs Single-threaded?


    In the old days, GUI applications were single-threaded and GUI events were processed
    from a "main event loop". Modern GUI frameworks use a model that is slightly different:
    the dedicated dispatch event thread (EDT) for handling GUI events.


    Single-threaded GUI frameworks are not unique to Qt; NextStep, MacOS Cocoa, X
    Windows, and many others are also single-threaded. This is not for lack of logic;
    there have been many attempts to write multithreaded GUI frameworks, but because
    the event queue model fetches events off a queue and dispatches them to application-defined
    event handlers (AWT introduced to support a greater degree of multithreading,
    and the decision to make Swing single-threaded was largely influenced by AWT).


    Multithreaded GUI frameworks tended to be particularly susceptible to deadlock,
    partially because of the unfortunate interaction between event processing and
    any sensible object-oriented modeling of GUI components. Actions initiated by
    the user to "bubble up" to the OS - a mouse click is detected by the OS, is turned
    into a "mouse click" event and is delivered to an application listener at a higher
    level as a "button" event. On the other hand, application-initiated actions "bubble
    down" from the application to the OS - changing the background color of a component
    is dispatched to a specific component and eventually into the OS for rendering.
    Combining this tendency for activity to access the same GUI objects in the opposite
    order with the requirement of making each object thread-safe yields a recipe for
    inconsistent locking ordering, which leads to deadlock (see Chapter 10). And this
    is exactly what every GUI toolkit has encountered throughout its history and development.


    Another factor leading to deadlock in multithreaded GUI frameworks is the prevalence
    of the model-view-controller (MVC) pattern. Following user interactions in cooperating
    model, view, and controller objects simplifies implementing GUI applications,
    but also raises the risk of inconsistent locking order. The controller calls the
    model, which notifies the view that something has changed. But the controller
    can also call the view, which may turn a callback back into the model to query
    the state. The result is inconsistent locking order, with the attendant risk of
    deadlock.


    > Sun VP Graham Hamilton nicely sums the challenges, describing why the multithreaded
    GUI toolkit is one of the recurring "failed dreams" of computer science.


    [1]https://blogs.java.net/khg/archive/2004/10


    I believe you can program successfully with multithreaded GUI toolkits if the
    toolkit is carefully designed; and if you are very smart, very careful, and have
    a global understanding of the structure of the toolkit. If you get one of these
    things wrong, things will work, but you will get occasional hangs (due to deadlocks)
    or glitches (due to races). This multithreaded approach works best for people
    who have been intimately involved in the design of the toolkit.


    Unfortunately, I don''t think this of characteristics scales to widespread application
    use. What intend to use with normal smart programmers building that doesn''t work
    reliably for reasons that are not at all obvious. The authors get very disgruntled
    and frustrated and use bad work based on the poor toolkit.'
