  md: '# Java Concurrency in Practice


    mostly computation, I/O, or some combination? Do they require a scarce resource,
    such as a JDBC connection? If you have different categories of tasks with different
    behaviors, consider using multiple thread pools so each can be tuned to its workload.


    For compute-intensive tasks, an Ncpu-processor system usually achieves optimum
    utilization with a thread pool of Ncpu+1 threads. (Even compute-intensive threads
    occasionally take a page fault or pause for some other reason, so an "extra" runnable
    thread prevents CPU cycles from going unused when this happens.) For tasks that
    also include I/O or other blocking operations, you want a larger pool, since not
    all of the threads will be scheduled at all times. In order to size the pool,
    you must estimate the ratio of waiting time to compute time for your tasks; this
    estimate might not be precise and can be obtained through profing or instrumentation.
    Alternatively, the size of the thread pool can be tuned by running the application
    using several different pool sizes under a benchmark load and observing the level
    of CPU utilization.


    Given these definitions:


    +   - number of CPUs

    - target CPU utilization, 0 ≤ Ucpu ≤ 1

    - ratio of wait time for keeping the pools at the desired utilization:


    > Nthreads = Ncpu * Ucpu * (1 + W/C)


    You can determine the number of CPUs using Runtime:


    ```

    int N_CPUS = Runtime.getRuntime().availableProcessors();

    ```


    Of course, CPU cycles are not the only resource you might want to manage using
    thread pools. Other resources that can contribute to sizing constraints are memory,
    file handles, sockets, and database connections. Calculating pool sizes for these
    types of resources is easier: just add how much of resource each task requires
    and divide that by the total quantity available. The result will be an upper bound
    on the pool size.


    When tasks require a pooled resource such as database connections, thread pool
    size and resource pool size affect each other. If each task requires a connection,
    the effective size of the thread pool is limited by the connection pool size.
    Similarly, when the only consumers of connections are thread pools, the effective
    size of the connection pool is limited by the thread pool size.


    # 8.3. Configuring ThreadExecutor


    ThreadExecutor provides the implementation for the executors returned by the newCachedThreadPool,
    newFixedThreadPool, and newScheduledThreadPool factories in Executors. ThreadPoolExecutor
    is a flexible, robust implementation that allows a variety of customizations.


    If the default execution policy does not meet your needs, you can instantiate
    a ThreadExecutor through its constructor and customize it as you fit; you can
    consult the source code for Executors to see the execution policies and ThreadExecutor
    has several constructors, the most general of which is shown in Listing 8.2.


    # 8.3.1. Thread Creation and Teardown


    The core size, maximum pool size, and keep-alive time govern creation and teardown.
    The core size is the target size; the implementation attempts to maintain the
    pool at this size even when there are no tasks to execute, and will not create
    more threads than the work queue is full. The maximum pool size is the upper bound
    on how many threads can be active at once. A thread that has been idle longer
    than the keep-alive time becomes a candidate for reaping and can be terminated
    if the current pool size exceeds the core size.'
