  md: '# # Appendix A. Annotations for Concurrency


    We''ve used annotations such as @Guarded and @ThreadSafe to show how thread-safety
    promises and synchronization policies can be documented. This appendix documents
    these annotations; their source code can be downloaded from this book''s website.
    (There are, of course, additional thread-safety promises and implementation details
    that should be documented but are not captured by this minimal set of annotations.)


    # ## A.1. Class Annotations


    We use class-level annotations to describe a class''s intended thread-safety promises:
    @Immutable, @ThreadSafe, and @NotThreadSafe. @Immutable means, of course, that
    the class is immutable and implies @ThreadSafe. @NotThreadSafe is optional - if
    a class is not annotated as thread-safe, it is presumed not to be thread-safe,
    but if you want to make it clear, use @NotThreadSafe.


    These annotations are relatively unobtrusive and are beneficial to both users
    and maintainers. Users can see immediately whether a class is thread-safe, and
    maintainers can see immediately whether thread-safety guarantees must be preserved.
    Annot are also useful to a third constituency: Static analysis tools may be used
    to verify that the code complies with the contract indicated by the annotation,
    such as verifying that a class annotated with @Immutable is actually immutable.


    # ## A.2. Field and Method Annotations


    The class-level annotations are part of the public documentation for the class.
    Other aspects of a class''s threadsafety strategy are entirely for maintainers
    and are not part of its public documentation.

    Classes that use locking document which state variables are guarded with locks,
    and which locks are used to guard those variables. A common source of inadvertent
    non-threadsafety is when a thread safe class consistently uses locking to guard
    its state, but is later modified to add new state variables that are not adequately
    guarded by locking, or new methods that do not use locking to guard the existing
    state variables. Documenting which variables are guarded by which locks can prevent
    both types of omissions.

    @GuardedBy(lock) documents that a field or method should be accessed only with
    a specific lock. The lock argument identifies which lock should be held when accessing
    the annotated field or method. The possible values for lock are:


    +   - @GuardedBy("this")


    Using @GuardedBy to identify each state variable that needs locking and which
    lock guards it can assist in maintenance and code reviews, and help automated
    analysis tools spot potential thread-safety errors.'
