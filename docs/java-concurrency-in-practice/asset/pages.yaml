  md: "# 7BPart IV: Advanced - 26BChapter14 - Building Custom Synchronizers\n\ndon't\
    \ do anything you can with sleeping and notify[5], but they make it at easier\
    \ and more efficient to express and manage state dependence.\n\n[5] This is not\
    \ quite true; a fair condition queue can guarantee the relative order in which\
    \ threads are released from the wait. Intrinsic condition queues, unlike locks,\
    \ do not offer any choice of fair or non-fair queue.\n\nL14. BoundedBuffer uses\
    \ Condition Queues.\n\n```\n@ThreadSafe\npublic class BoundedBuffer<V> extends\
    \ BoundedBuffer{\n    // CONDITION: not-full (!isFull())\n    // CONDITION: not-empty\
    \ (!isEmpty())\n    public BoundedBuffer(int size) { super(size); }\n\n    //\
    \ BLOCKS-UNTIL: not-full\n    public synchronized void put(V v) throws InterruptedException\
    \ {\n        while (isFull()) {\n            wait();\n        }\n        doPut(v);\n\
    \        notifyAll();\n    }\n\n    // BLOCKS-UNTIL: not-empty\n    public synchronized\
    \ V take() throws InterruptedException {\n        while (isEmpty()) {\n      \
    \      wait();\n        }\n        V v = doTake();\n        notifyAll();\n   \
    \     return v;\n    }\n}\n```\n\nBoundedBuffer is finally enough to use - it\
    \ is easy to use and manages state dependence sensibly.[6] A production version\
    \ should also include timed versions of put and take, so that blocking operations\
    \ can time out if they cannot complete within a time. The timed version of...wait\
    \ makes this easy to implement.\n\n[6] ConditionBuffer in Section 14.3 is even\
    \ better: it is more efficient it can use single notification instead of notifyAll.\n\
    \n# 14.2 Using Condition Queues\n\nCondition queues make it easier to build and\
    \ efficient state-dependent-dependent classes, but they are still easy to use\
    \ incorrectly; there is a lot of rules relating their proper use that are not\
    \ enforced by the compiler or platform. This is one of the reasons to build on\
    \ top of classes like LinkedBlockingQueue, CountDownLatch, Semaphore, and FutureTask\
    \ when you; if you can get away with it, is a lot easier.\n\n# 14.2.1. The Condition\
    \ Predicate\n\nThe key to using condition queues is identifying the condition\
    \ predicates that one may wait for. The condition predicate that causes much of\
    \ confusion surrounding wait and notify, because it has no instantiation in the\
    \ API and not either in the language specification or the JVM implementation ensures\
    \ its correct. In fact it is not mentioned directly in all the language specification\
    \ or the Javadoc. Without it, condition waits would not work.\n\nThe condition\
    \ predicate can proceed only if the predicate asserts the first-place. In a bounded\
    \ buffer, the predicate if the buffer is not empty; otherwise it must wait. For\
    \ take, the condition predicate is \"buffer is not empty\", which test must be\
    \ done before proceeding. Similarly, the condition predicate for \"put\" is \"\
    buffer not full\". Condition predicates are constructed from the state variables\
    \ of the class;BoundedBuffer tests for \"buffer not empty\" by comparing count\
    \ to zero, and tests for \"buffer not full\" by comparing count to the buffer\
    \ size.\n\n> Document the condition predicate(state) associated with a condition\
    \ queue and the operations that wait on them.\n\nThere is an important three-relationship\
    \ in a condition wait involving locking, the wait method, and a condition predicate.\
    \ The condition predicate involves state variables, and the state variables are\
    \ guarded by a lock, so before testing the condition predicate, we must hold it.\
    \ The lock object and the condition object (the object on which wait and notify\
    \ are invoked) must also be the same object.\n\nIn BoundedBuffer, the state is\
    \ guarded by the buffer lock and the buffer object is used as the condition queue.\
    \ The take method acquires the buffer lock and then tests the condition predicate\
    \ (that the buffer is nonempty). If the\n\n![](img/c64daf12e0d6c877213813fc53c890a4_199_0.png)"
