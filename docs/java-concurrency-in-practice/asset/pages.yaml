  md: "# Java Concurrency in Practice\n\nA task that can be cancellable must have\
    \ a cancellation policy that specifies the 'how', 'when', and 'what' of cancellation\
    \ - how each order can request cancellation, when the checks whether cancellation\
    \ has been requested, and what actions the task takes in response to a cancellation\
    \ request.\n\nConsider the real-world example of stopping payment. Banks have\
    \ rules about how to stop a stop-payment request, what responsiveness guarantees\
