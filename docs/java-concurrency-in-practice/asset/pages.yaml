  md: "# # Building Blocks\n\nThe last chapter explores various techniques for building\
    \ blocks, including delegating thread safety to creating thread-safe classes.\
    \ Where practical, delegation is one of the most effective strategies for creating\
    \ thread-safe classes: let just use thread-safe classes to manage all.\n\nThe\
    \ platform library includes a rich set of building blocks, thread-safe collections\
    \ and a variety of synchronizers that can coordinate the control flow of cooperating\
    \ threads. This chapter covers the most useful concurrent building blocks, especially\
    \ those introduced in Java 5.0 and Java 6, and some patterns for them to use structure\
    \ concurrent applications.\n\n# ## 5.1. Synchronized Collections\n\nThe synchronized\
    \ collections include vector and Hashtable, part of the original JDK, as well\
    \ as their cousins added in JDK 1.2, the synchronized wrapper classes created\
    \ by the collections.synchronized factory methods. These classes achieve thread\
    \ safety by synchronizing their state and every public method so that only one\
    \ thread at a time can access the collection state.\n\n# ### 5.1.1. Problems with\
    \ Synchronized Collections\n\nThe synchronized collections are thread-safe, but\
    \ you may sometimes need to use additional client-side locking to guard compound\
    \ actions. Compound actions on collections include iteration (repeatedly fetching\
    \ elements until collection is exhausted), navigation (the next element after\
    \ this one according to order), and operations such as put-if-abs (if a Map has\
    \ a mapping for key K, then adding the mapping (K,V)). With a synchronized collection,\
    \ these compound actions are still thread-safe even without client-side locking,\
    \ may not behave as you might expect when others concurrently modify the collection.\n\
    \nListing 5.1 shows two methods that operate on a vector, getLast and delete,\
    \ both of which are thread-safe sequences. Each call calls size to determine the\
    \ size of the array and the resulting value to retrieve or remove the last element.\n\
    \n> Listing 5.1. Compound Actions on a Vector that may throw ConcurrentModificationException.\n\
    \n```\npublic static Object getLast(Vector list) {\n    int lastIndex = list.size()\
    \ - 1;\n    return list.get(lastIndex);\n}\n\npublic static void delete(Vector\
    \ list) {\n    int lastIndex = list.size() - 1;\n    list.remove(lastIndex);\n\
    }\n```\n\nThese methods seem harmless and in sense they are - they won't corrupt\
    \ the vector, no matter how many threads call them simultaneously. But the caller\
    \ of these methods might find that thread A calls getLast on a vector with ten\
    \ elements, thread B calls delete on the same vector, and the operations are interleaved\
    \ as in Figure 5.1, getLast throws ArrayOutOfBoundsException. This is because\
    \ the vector shrunk and the index computed for is no longer valid. This is perfectly\
    \ consistent with the specification of vector it throws ArrayOutOfBoundsException.\
    \ But this is not what a caller expects to do, even in the face of concurrent\
    \ modification, unless perhaps the vector is empty to begin with.\n\nFigure 5.1.\
    \ Interleaving of getLast and delete that throws ArrayOutOfBoundsException.\n\n\
