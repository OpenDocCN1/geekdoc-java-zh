    Some tasks have characteristics that could preclude a specific execution policy.
    Tasks that require the pool to be large enough that tasks are never queued or
    rejected; tasks that exploit confinement require sequential execution. Document
    these requirements so that future maintainers do not undermine safety or liveliness
