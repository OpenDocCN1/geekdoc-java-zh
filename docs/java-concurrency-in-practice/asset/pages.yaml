  md: "# 6BPart III: Liveness, Performance, and Testing - 24BChapter 12. Testing Concurrent\
    \ Programs\n\nWhile there is deftly overlap between performance and functionality\
    \ tests, they have different goals. Performance tests seek to measure end-to-end\
    \ performance metrics for representative cases. Picking a representative set of\
    \ scenarios is not easy; ideally, tests should reflect how the objects are actually\
    \ used in your application.\n\nIn some cases an appropriate test scenario is.\
    \ Bounded buffers are nearly always used in producer-consumer designs, so it is\
    \ essential to measure the throughput of producers feeding data to consumers.\
    \ We can easily extend PutTest to become a performance test for this scenario.\n\
    \nA secondary goal of performance testing is to select sizes empirically for thousands\
    \ of threads, buffer capacities, and so on. While these values might turn out\
    \ be sensitive to platform characteristics (such as processor type or even processor\
    \ stepping level, number of CPUs, or memory size) to require dynamic configuration,\
    \ it is common that these scenarios for tests work well across a wide range of\
    \ systems.\n\n# 12.2. Extending PutTest to Add Timing\n\nThe primary extension\
    \ we have to make to PutTest is to measure the time taken for a run. Rather than\
    \ attempting to measure the time for a single operation, we get more accurate\
    \ measure by timing the entire run and dividing by the number of operations to\
    \ get per-operation time. We are already using a CyclicBarrier to start and stop\
    \ the worker threads, so we can extend this by using a barrier action that starts\
    \ and ends time, as shown in Listing 12.11.\n\nWe can modify the initialization\
    \ of the barrier to use this barrier action by using the constructor for CyclicBarrier\
    \ that accepts an action.\n\n```\nListing 12.11. Barrier-timed Timer.\nthis.barrier\
    \ = new CyclicBarrier(pairs * 2 + 1, timer);\npublic class BarrierTimer implements\
    \ Runnable {\n    private boolean started;\n    private long startTime, endTime;\n\
    \n    public synchronized void run() {\n        long t = System.nanoTime();\n\
    \        if (!started) {\n            started = true;\n            startTime =\
    \ t;\n        } else\n            endTime = t;\n        }\n    }\n    public synchronized\
    \ void clear() {\n        started = false;\n    }\n    public synchronized long\
    \ getTime() {\n        return endTime - startTime;\n    }\n}}\n```\n\nThe modified\
    \ method using the barrier-timed timer is shown in Listing 12.12.\nWe can learn\
    \ several things from running TimedPutTaskTest. One is the throughput of the producer-consumer\
    \ handoff operation for various combinations of parameters; another is how the\
    \ bounded buffer scales with different numbers of threads; a third is how we must\
