  md: '# Java Concurrency In Practice


    > Avoid the temptation to use thread priorities, since they affect platform dependence
    and can cause liveness problems. Most concurrent applications can use the default
    priority for all threads.


    # 10.3.2. Poor Responsiveness


    One removed from starvation is poor responsiveness, which is not uncommon in GUI
    applications using background threads. Chapter 9 developed a framework for offloading
    long-running tasks onto background threads so as not to freeze the user interface.
    CPU-intensive background tasks still affect responsiveness because they compete
    for CPU cycles with the event thread. This is one where threading priorities makes
    sense; compute-intensive background computations can affect responsiveness. If
    the work is done by other threads or background tasks, lowering their priority
    can make the foreground tasks more responsive.


    Poor responsiveness can also be caused by lock management. If a thread holds a
    lock for a long time (perhaps while iterating a collection and performing substantial
    work for each element), others that need to collect may have to wait a long time.


    # 10.3.3. LiveLock


    Livelock is a form of l failure in a thread, while not blocked, still cannot make
    progress because it keeps retrying an operation that will always fail. Livelock
    often occurs in transactional applications, where the messaging interface rolls
    back a transaction if it cannot be processed, and puts it at the head of the queue.
    If a bug in the message handler for a particular type of message causes it to
    fail, every time the message is dequeued and passed to the buggy handler, the
    transaction is rolled back. Since the message is now at the head of the queue,
    the handler is called over and over with the same result (This is sometimes called
    the poison problem). The message handling is not blocked, but it will never make
    progress either. This form of livelock often occurs due to overager recovery code
    that treats an unrecoverable error as a recoverable one.


    Livelock can also occur when multiple cooperating threads change their state to
    the others in such a way that no thread can make progress. This is similar to
    what happens when two overly polite people are walking in opposite directions
    in a hallway; each steps out of the other''s way, and now they are again in each
    other''s way. So they step aside again, again, and again...


    The solution for livelock is to introduce some randomness in the retry mechanism.
    For example, when two stations try to send on the shared packet at the same time,
    the packets collide. The stations detect the collision, and each tries to send
    their packet again later. If they each retry every one second, they collide over
    and over, and neither ever goes out, even if there is plenty of available bandwidth.
    To avoid this, we make each wait an amount of time that introduces a random component.
    (The Ethernet protocol also includes exponential back-off after repeated collisions,
    reducing both congestion and the risk of repeated failure with multiple colliding
    stations.) Retrying with random waits and back-offs can be effective for avoiding
    livelock in concurrent applications.


    # Summary


    Liveness failures are a serious problem because there is no way to recover from
    them without aborting the application. The most common form of liviveness failure
    is lock-ordering deadlock. Avoiding lock ordering deadlock starts at design time:
    when threads acquire multiple locks, they do so in a consistent order. The best
    way to do this is by using calls throughout your program. This greatly reduces
    the number of places where multiple locks are held at once, and makes it more
    obvious where those places are.'
