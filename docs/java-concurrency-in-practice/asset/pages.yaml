  md: "# Java Concurrency in Practice\n\nIn the absence of synchronization, the compiler,\
    \ processor, and runtime can do some downright things to the order in which operations\
    \ execute. Attempts to reason about the order in which memory actions “must” happen\
    \ in insufficiently synchronized multithreaded programs will almost certainly\
    \ be incorrect.\n\nNovisibility is about as simple as a concurrent program can\
    \ - two threads and two shared variables - and it is still too easy to come to\
    \ the wrong conclusions what it does or whether it is volatile. Reasoning about\
    \ insufficiently synchronized concurrent programs is prohibitively difficult.\n\
    \nThis all may sound a little scary, and fortunately, there's an easy way to avoid\
    \ these complex issues: always use the proper synchronization whenever data is\
    \ shared across threads.\n\n# 3.1. Stale Data\n\nnovisibility demonstrated one\
    \ of the ways that insufficiently synchronized programs can cause surprising results:\
    \ stale data. When the reader thread reads, it may see an out-of-date value. Unless\
    \ synchronization is used every time a variable is accessed, it is possible to\
    \ see a stale value for that. Worse, staleness is all-or-nothing: a thread can\
    \ see an up-to-date value of one variable but a stale value of another that was\
    \ written first.\n\nWhen food is stale, it is usually still - just less enjoyable.\
    \ But stale data can be more dangerous. When an out-of-date counter in a web application\
    \ might not be so bad; stale values can cause safety or fairness failures. In\
    \ multibility, stale values could cause it to print the wrong value or prevent\
    \ the program from terminating. Threads can get even more complicated with stale\
    \ values of object references, such as the link pointers in a linked list implementation.\
    \ Stale data can cause confusing and following failures such as unexpected exceptions,\
    \ corrupted data structures, inaccurate computations, and infinite loops.\n\n\
    > [2] Without synchronization is analogous to using the READ_UNCOMMITTED isolation\
    \ in a database, where you are willing to trade accuracy for performance. However,\
    \ in the case of unsynchronized threads, you are trading away a greater degree\
    \ of accuracy, as the visible value for a shared variable can be arbitrarily stale.\n\
    \nMutableInteger in Listing 3.2 is not thread-safe because the value is accessed\
    \ from both get and set without synchronization. Other hazards, it is susceptible\
    \ to stale values: if one thread sets, other threads may or may not update.\n\n\
    We can make MutableInteger thread safe by synchronizing the getter and setter\
    \ as shown in SynchronizedInteger in Listing 3.3. Synchronizing only the setter\
    \ would not be sufficient: threads would still be able to see stale values.\n\n\
    # Listing 3.2. Non-thread-safe Mutable Integer.\n\n```\n@NoThreadSafe\npublic\
    \ class MutableInteger {\n    private int value;\n\n    public int get() { return\
    \ value; }\n    public void set(int value) { this.value = value; }\n}\n```\n\n\
    # Listing 3.3. Thread-safe MutableInteger.\n\n```\n@ThreadSafe\npublic class SynchronizedInteger\
    \ {\n    @GuardedBy(\"this\") private int value;\n\n    public synchronized int\
    \ get() { return value; }\n    public synchronized void set(int value) { this.value\
    \ = value; }\n}\n```\n\n# 3.2. Non-atomic 64-bit Operations\n\nWhen a thread reads\
    \ without synchronization, it may see a stale value, but at least a value that\
    \ actually placed there by some thread rather than some random value. This safety\
    \ guarantee is called out-of-thin air safety.\n\nOut-of-air safety applies to\
    \ all variables, except for 64-bit numeric (double and long) that are not declared\
    \ volatile (see Section 3.4). The Java Memory Model requires fetch and store operations\
    \ to be atomic, but for nonvolatile long and double variables, the JVM is permitted\
    \ to treat a 64-bit read or write as two separate 32-bit operations."
