    \n# 5.2. Concurrent Collections\n\nJava 5 improves on the synchronized collections\
    \ by providing several concurrent collection classes. Synchronized collections\
    \ achieve safety by serializing all access to the collection's state. The cost\
    \ of this approach is poor; when multiple threads contend for the collection-lock,\
    \ throughput suffers.\n\nThe concurrent collections, on the other hand, are designed\
    \ for concurrent access from multiple threads. Java 5 adds ConcurrentHashMap,\
    \ a replacement for synchronized hash-based Maps, and CopyWriteArrayList, a replacement\
    \ for synchronized List implementations for cases where traversal is the dominant\
    \ operation. The ConcurrentMap interface adds support for common actions such\
    \ as put-if-abs, replace, and conditional remove.\n\n> Replacing synchronized\
    \ collections with concurrent collections can offer dramatic improvements with\
    \ little risk.\n\nJava 5 also adds two new collection types, Queue and BlockingQueue.\
    \ A queue is intended to hold a set of elements temporarily while awaiting processing.\
    \ Several implementations are provided, ConcurrentLinkedDeque, a traditional FIFO\
    \ queue, and PriorityQueue (a non-concurrent) priority ordered queue. Queue operations\
    \ do not block; if the queue is empty, the retrieval returns null. While the behavior\
    \ of a LinkedList admits null, the queue classes were added because eliminating\
    \ the random-access requirements of List admits more efficient concurrent collections.\n\
    \nBlockingQueue extends Queue to add blocking insertion and retrieval operations.\
    \ If the queue is empty, a retrieval blocks until an element is available, and\
    \ if the queue is full (for bounded queues) an insertion blocks until there is\
    \ space. Blocking queues are extremely useful in producer-consumer designs, and\
    \ are covered in greater detail in Section 5.3.\n\nJust as ConcurrentHashMap is\
    \ a replacement for a synchronized hash-based Map, Java 6 adds ConcurrentListMap\
    \ and ConcurrentListSet, which are replacements for a synchronized SortedMap or\
    \ SortedSet (as The TreeMap or TreeSet with synchronizedMap).\n\n# 5.2.1. ConcurrentHashMap\n\
    \nThe synchronized collections hold a lock for the duration of an operation. Some\
    \ operations, such as Map.get or contains, may involve more than initially obvious:\
    \ traversing a hash bucket or list to find a specific object equals (which may\
    \ involve a fair amount of computation) on a number of candidate objects. In a\
    \ hash-based collection, hashCode does not spread out hash values well, elements\
    \ may be unevenly distributed among objects. In the degenerate case, a poor hash\
    \ function will turn a table into a linked list. Traversing a list and calling\
    \ equals on all or some of the elements can take a long time, and during that\
    \ time no other thread can access the collection."
