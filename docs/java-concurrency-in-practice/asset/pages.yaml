  md: "# 5BPart II: Structuring Applications - 18BChapter 6. Execution\n\nA secondary\
    \ problem when using tasks is to stop them when they run out of time, so they\
    \ do not waste computing resources to continue producing a result that will not\
    \ be used. This can be accomplished by having the task manage its own time budget\
    \ if it runs out of time, or by cancelling the task if the timeout expires. Again,\
    \ if a future completes with a TimeoutException, you can cancel the task without\
    \ interrupting the Future (see Chapter 7), it can be terminated early so not to\
    \ consume excessive resources. This technique is used in Listings 6.13 and 6.16.\n\
    \nListing 6.16 shows a typical application of using Future. It generates a web\
    \ page that contains the requested content from an ad server. The ad-fetching\
    \ task is an executor, fetches the content of the page, and then waits for its\
    \ time budget to run out[8]. If it times out, it cancels[9] the ad-fetching task\
    \ and uses a default advertisement instead.\n\n# 6.3. Example: A Travel Reservations\
    \ Port\n\nThe time-budget application in the previous section can be easily generalized\
    \ to any number of tasks. A travel reservation portal fetches the travel dates\
    \ and prices from various portals and displays them by a number of airlines, hotels\
    \ or car rental companies. Depending on the company, fetching a bid might involve\
    \ a web service, calling a database, or some other transaction. Rather than wait\
    \ for time for the page by the slowest response, it would be preferable to present\
    \ only the information available within a given time budget. For those that do\
    \ not respond in time, the page could either omit them or display a placeholder\
    \ such as \"Did not hear from Air Java in time.\"\n\n# Listing 6.16. Fetching\
    \ Applications with a Time Budget.\n\n```\nPage page = new Page();\nlong timeout\
    \ = System.nanoTime() + budget;\nFuture<Ad> ad = executor.submit(fetchTask(page));\n\
    // wait for the ad\nAd ad = ad.get();\nPage page = ad.renderBody();\n// wait for\
    \ the remaining time budget\nlong timeLeft = endTime - System.nanoTime();\nad\
    \ = ad.get(timeLeft, TimeUnit.NANOSECONDS);\ncatch (ExecutionException e) {\n\
    \  ad = DEFAULT_AD;\n} catch (TimeoutException e) {\n  ad = DEFAULT_AD;\n  ad.cancel(true);\n\
    }\npage.set(ad);\nreturn page;\n```\n\nFetching a bid from one company is independent\
    \ of fetching bids from another, so a single bid is a task boundary that could\
    \ prevent proceeding concurrently. It would be easy to execute n tasks, submit\
    \ them to a thread pool, and use a get to fetch each result sequentially via its\
    \ Future, but there is no easier way—invokeall.\n\nListing 6.17 uses the timed\
    \ version of invokeall to submit multiple tasks to an ExecutorService and return\
    \ the results. The invokeall method adds a collection of tasks and returns a collection\
    \ of Futures. The two collections have identical structures; invokeall adds the\
    \ futures to the returned collection in the order imposed by the task iterator,\
    \ allowing the caller to call a Future that it represents. The timed version of\
    \ invokeall will return when all the tasks have completed, the calling thread\
    \ is interrupted, or the timeout expires. Any tasks that are not complete when\
    \ the timeout expires are cancelled. On return invokeall, each task will have\
    \ completed normally or be cancelled; the client can call get or isCancelled to\
    \ find out.\n\n# Summary\n\nStructuring applications around the execution of tasks\
    \ can simplify development and facilitate concurrency. The Executor framework\
    \ permits you to decouple task submission from execution policy and supports a\
    \ variety of execution policies; whenever you find creating threads to perform\
    \ tasks, consider using an Executor. To maximize the benefit of decomposing an\
    \ application into tasks, you must identify task boundaries. In some"
