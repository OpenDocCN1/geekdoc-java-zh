  md: "# 7.2.1: A Logging Service\n\nMost servers use logging, which can be as simple\
    \ as inserting println statements into the code. Stream classes like Printer are\
    \ thread-safe, so this simple approach would require no synchronization.[1] However,\
    \ as we see in Section 11.6, inline logging can have some performance costs in\
    \ highvolume applications. Another alternative is to log queue the log message\
    \ for processing by another thread.\n\n> [1] If you log multiple lines as part\
    \ of a single log message, you may need to use client-side locking to prevent\
    \ interleaving of output from multiple threads. If threads logged multiple stack\
    \ traces to the stream with one println per line, the results would be interpreted\
    \ unpredictably, and could look out like one meaningless stack trace.\n\nListing\
    \ 7.12: Encapsulating NonCancellation in a Task with Newtaskfor.\n\n```\npublic\
    \ interface cancellableTask<T> extends Cancellable<T> {\n    RunnableFuture<T>\
    \ newTask(Runnable task) {\n        return new FutureTask<T>(task).newTaskForcancel();\n\
    \    }\n}\n\n@ThreadSafe\npublic class CancellingExecutor extends ThreadPoolExecutor\
    \ {\n    protected RunnableFuture<T> newTaskFor(Callable<T> callable) {\n    \
    \    if (instance instanceof CancellableTask)\n            return ((CancellableTask)\
    \ callable).newTask();\n        else\n            return super.newTask(callable);\n\
    \    }\n}\n\npublic abstract class SocketUsingTask<T>\nimplements CancellableTask<T>\
    \ {\n    @GuardedBy(\"this\")\n    private Socket socket;\n\n    protected synchronized\
    \ void setSocket(Socket s) { socket = s; }\n\n    public synchronized void cancel()\
    \ {\n        try {\n            if (socket != null)\n                socket.close();\n\
    \        } catch (IOException ignored) {}\n    }\n\n    public RunnableFuture<T>\
    \ newTask() {\n        return new FutureTask<T>(this);\n    }\n    public boolean\
    \ cancel(boolean mayInterruptIfRunning) {\n        try {\n            SocketUsingTask.this.cancel();\n\
    \        } finally {\n            return super.cancel(mayInterruptIfRunning);\n\
    \        }\n    }\n}\n```\n\nLogwriter in Listing 7.13 shows a simple logging\
    \ service in which the logging activity is moved to a separate logger thread.\
    \ Instead of having the thread that produces the message write directly to the\
    \ output stream, Logwriter hands it off to the logger via a BlockingQueue and\
    \ the logger thread writes it out. This is a multiple-producer, single-consumer\
    \ design: any activity logging is acting as a producer, and the background logger\
    \ thread is the consumer. If the logger thread falls behind, the BlockingQueue\
    \ eventually blocks the producers until the logger thread catches up."
