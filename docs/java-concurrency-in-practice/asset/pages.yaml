  md: "# Java Concurrency Practice\n\n```\nListing 6.14. QueueFuture Class Used By\
    \ ExecutorCompletionService.\nprivate class QueueFuture<V> extends FutureTask<V>\
    \ {\n    QueueFuture(Callable<V> v) { super(v); }\n    QueueFuture(Runnable r,\
    \ V v) { super(r, v); }\n\n    protected void done() {\n        completionQueue.add(this);\n\
    \    }\n}\n```\n\n6.3.6. Example: Page Renderer with CompletionService\nWe can\
    \ use a completionService to improve the performance of the page renderer in two\
    \ ways: shorter runtime and improved responsiveness. We can create a separate\
    \ task for downloading each image and execute them in a thread pool, the sequential\
    \ download into a parallel one this reduces the time of download to all images.\
    \ By fetching results from the CompletionService and rendering each image as soon\
    \ as it is available, we can give the user a more dynamic and responsive interface.\
    \ This implementation is shown in Renderer 6.15.\n\n```\nListing 6.15. Using CompletionService\
    \ to Render Page Elements as They Become Available.\npublic class Renderer {\n\
    \    private ExecutorService executor;\n\n    Renderer(ExecutorService executor)\
    \ { this.executor = executor; }\n\n    void renderPage(CharSequence source) {\n\
    \        List<ImageInfo> images = scanForImages(source);\n        completionService<ImageData>\
    \ completionService = new ExecutorCompletionService<>(executor);\n        for\
    \ (ImageInfo info : images) {\n            completionService.submit(new Callable<ImageData>()\
    \ {\n                @Override\n                public ImageData call() {\n  \
    \                  return info.downloadImage();\n                }\n         \
    \   });\n        }\n        renderText(source);\n        try {\n            for\
    \ (int i = 0; i < images.size(); i++) {\n                ImageData imageData =\
    \ completionService.take().get();\n                renderImage(imageData);\n \
    \           }\n        } catch (InterruptedException e) {\n            Thread.currentThread().interrupt();\n\
    \        } catch (ExecutionException e) {\n            throw RuntimeException(e.getCause());\n\
    \        }\n    }\n}\n```\n\nMultiple ExecutorServices can share a single Executor,\
    \ so it is perfectly sensible to create an ExecutorCompletionService that is private\
    \ to a particular computation while sharing a common Executor. When used this\
    \ way, a completionService acts as a handler for batch of computations in the\
    \ same way that a Future acts as a handler for a single computation. By remembering\
    \ how many tasks were submitted to the completionService and counting how many\
    \ results are retrieved, you can know when all the results for a batch have been\
    \ retrieved, if you used a shared Executor.\n\n6.3.7. Placing Limits on Tasks\n\
    Sometimes, if an activity does not complete within a certain amount of time, the\
    \ result is no longer needed and the activity can be abandoned. For example, a\
    \ web application might fetch advertisements from an external server, or if the\
    \ ad is not available within two seconds, it instead displays a default advertisement\
    \ so that unavailability does not undermine the site's responsiveness requirements.\
    \ A small portal might fetch data in parallel from multiple sources, but may be\
    \ worth waiting only a certain amount of time for data to be available before\
    \ rendering the page without it.\n\nThe primary challenge in executing tasks is\
    \ making a budget that is sure you will not wait longer than the budget to get\
    \ an answer and one that is not forthcoming. The timed version of Future supports\
    \ this requirement: it returns as soon as the result is ready, but throws TimeoutException\
    \ if the result is not within the timeout period."
