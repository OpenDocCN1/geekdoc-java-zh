  md: "# 7BPart IV: Advanced Topics - 26BChapter14 - Building Synchronizers\n\n[14]\
    \ Because the protected state-manipulation methods have the memory semantics of\
    \ a volatile read or write and ReentrantLock can read the owner after only calling\
    \ getState and before calling setState, ReentrantLock can piggyback on the memory\
    \ semantics of the synchronization, and thus avoid further synchronization - Section\
    \ 16.4.\n\nWhen a thread attempts to acquire a lock, tryacquire first consumes\
    \ the lock. If it is unset, it tries to update the lock state to indicate that\
    \ it is held. Because the lock state could have changed since it first inspected\
    \ a few instructions, tryacquire compareAndSet to atomically update the state\
    \ to indicate that the lock is now held and has not changed since last (See the\
    \ description of compareAndSet in Section 15.3). If the lock state is already\
    \ held, if the current thread is the owner of the lock, the acquisition count\
    \ is incremented; if the current is not the owner of the lock, the acquisition\
    \ attempt fails.\n\nList 14.5. tryacquire Implementation From Non-fair Reentrantlock\n\
    \n```\nprotected boolean tryacquire(int ignored) {\n    Thread current = Thread.current();\n\
    \    int c = getState();\n    if (c != 0) {\n        if (compareAndSetState(0,1))\
    \ {\n            owner = current;\n            return true;\n        }\n    }\
    \ else if (current == owner) {\n        setState(c+1);\n        return true;\n\
    \    }\n    return false;\n}\n```\n\nReentrantlock also takes advantage of AQS's\
    \ built-in support for multiple condition variables and waits sets. Lock.newcondition\
    \ returns new instance of ConditionObject, an inner class of AQS.\n\n# 14.6.2\
    \ Semaphore and CountDownLatch\n\nSemaphore uses the AQS synchronization state\
    \ to hold the count of permits remaining, and if there are not enough, returns\
    \ a value indicating that the acquire failed. (See method 14.6) If sufficient\
    \ permits appear to be held, it attempts to atomically reduce the count using\
    \ compareAndSet. If that succeeds (meaning that the permit count had not changed\
    \ since it last), it returns a value indicating the acquire succeeded. The return\
    \ value also indicates whether other acquisition attempts might succeed, in which\
    \ case waiting threads will also be unlocked.\n\nThe loop continues to collect\
    \ acquisition either when there are not enough permits or when tryAcquire can\
    \ atomically update the permit count due to contention with another thread (See\
    \ Section 15.3), causing it to retry. Given any given call to compareAndSetstate\
    \ one of these two criteria will become true a reasonable number of retries. Similarly,\
    \ tryRelease increases the count, potentially unblocking threads, and retries\
    \ until the succeeds. The return value of tryRelease indicates whether other threads\
    \ may have been unlocked by the release.\n\nCountDownLatch uses AQS in a similar\
    \ manner to semaphore: the synchronization state holds the current count. The\
    \ countdown method release, which causes the counter to be decremented and waits\
    \ threads until the counter has reached zero; await calls, which returns immediately\
    \ if the counter has reached zero and otherwise blocks.\n\nList 14.6. tryacquireShared\
    \ and tryReleaseShared from Semaphore.\n\n```\nprotected int tryacquireShared(int\
    \ acquires) {\n    while (true) {\n        int available = getState();\n     \
    \   int remaining = available - acquires;\n        if (remaining < 0)\n      \
    \      if (compareAndSetState(available, remaining))\n                return remaining;\n\
    \    }\n}\n}**\n```\n\n```\nprotected boolean tryReleaseShared(int releases) {\n\
    \    while (true) {\n        int p = getState();\n        if (compareAndSetState(p,\
    \ p + releases))\n            return true;\n    }\n}\n**\n```\n\n![](img/c64daf12e0d6c877213813fc53c890a4_209_0.png)"
