    # 16.1.4. Piggybacking on Synchronization


    Because of the strength of the happens-before ordering, you can sometimes piggy
    on the visibility properties of an existing synchronization. This entails combining
    the program order rule for happens-before with one of the other ordering rules
    (usually the monitor lock or volatile variable rule) to order accesses to a variable
    not otherwise guarded by a lock. This technique is very sensitive to the order
    in which statements occur and are therefore quite fragile; it is an advanced technique
    that should be reserved for squeezing the last drop of performance out of the
    most performance-critical classes like ReentrantLock.


    The implementation of the protected AbstractqueuedSynchronizer methods in FutureTask
    illustrates piggybacking. AQS maintains an integer synchronizer state that FutureTask
    uses to store the task state: running, completed, or cancelled. When one thread
    sets the result and other threads call retrieve, the two better ordered by happens-before.
    This could be done by making the reference to the volatile variable, but it is
    possible to exploit synchronization to achieve the same result at lower cost.


    FutureTask is carefully crafted to ensure that a successful call to releaseShared
    happens-before a subsequent call to tryReleases always writes to a volatile variable
    that is read by TRAcquireShared-Shared. Listing 16.2 shows the inner and innerGet
    methods that are called when the result is saved or retrieved; since innerSet
    writes result after releaseShared (which calls releaseShared) and innerGet reads
    result after calling acquireShared (which calls TRAcquireShared), the program
    order rule combines with the volatile variable rule to ensure that the write of
    result in innerGet happens-before the read of result in innerGet.'
