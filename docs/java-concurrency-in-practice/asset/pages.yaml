  md: '# 150 Java In Practice


    [14] In addition to being a loss in terms of CPU cycles, object pooling has another
    number of problems, among them the challenge of setting pools correctly (too small,
    and pooling has no effect; it puts pressure on the garbage collector, retaining
    memory that could be used for something else); the risk that an object will not
    be properly reset to its newly allocated state, introducing subtle bugs; the risk
    that a thread will return an object to the pool but continue using it; and that
    it makes more work for general garbage collectors by increasing the frequency
    of old-generation references.


    In concurrent applications, pooling fares even worse. When threads use thread-local
    allocation to eliminate synchronization on heap structures, coordination is avoided.
    If those threads request an object from the pool, some synchronization is necessary
    to access the data structure, creating the possibility that a thread will block.
    Because blocking a thread due to lock contention is hundreds of times more expensive
    than an allocation, even a small amount of pool-induced contention could be a
    bottleneck. (Even an uncontended synchronization is usually more expensive than
    allocating an object.) This is yet another technique intended as a performance
    optimization that turned into a scalability hazard. Pooling has its,¹ but is of
    limited utility as a performance optimization.


    [15] In constrained environments, such as JNI or RTOS tasks, object pooling may
    be required for effective memory management or to manage responsiveness.


    Allocating objects is usually cheaper than synchronizing.


    # ## 11.5. Comparing Map Performance


    The single-threaded performance of ConcurrentHashMap is slightly better than that
    of a synchronized HashMap, but it is in concurrent use that it really shines.
    The implementation of ConcurrentHashMap assumes the most common operation is retrieving
    a value that already exists, and is therefore optimized to provide high performance
    and concurrency for successful get-operations.


    The major scalability issue for the synchronized Map implementations is that it
    uses a single lock for the entire map, so only one thread can access the map at
    a time. On the other hand, ConcurrentHashMap does no locking for successful read
    operations, and uses lock stripping for write operations and those few operations
    that require locking. As a result, multiple threads can access the map without
    blocking.


    Figure 11.3 illustrates the differences in scalability between several Map implementations:
    ConcurrentHashMap, ConcurrentSkipListMap and TreeMap wrapped with synchronized.
    The first two are thread-safe by design; the latter are made thread-safe. In each
    run, N threads concurrently execute a tight loop that selects a random key and
    attempts to retrieve that key. If the value is not present, it is added to the
    map with probability p = .6, and if it is, removed with probability p = .02. The
    tests were run under a pre-release build of Java 6 on an 8-way SPARC V880, and
    the graph displays throughput normalized to the onthread case for ConcurrentHashMap.
    (The scalability gap between the concurrent and synchronized collections is even
    larger on Java 5.0.)


    The data for ConcurrentHashMap and ConcurrentSkipListMap show that they scale
    well to large numbers of threads; throughput continues to increase as threads
    are added. While the numbers of threads in Figure 11.3 may not seem large, this
    test program generates more contention per thread than a typical application because
    it does little other than on the map; a real program would do additional thread-local
    work in each iteration.


