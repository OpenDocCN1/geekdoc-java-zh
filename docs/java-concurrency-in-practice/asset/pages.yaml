  md: "# Listing 7.13. Producer-Consumer Logging Service with No Shutdown Support.\n\
    \n```\npublic class LogWriter<String> {\n    private final BlockingQueue<String>\
    \ queue;\n    private final Logger logger;\n\n    public LogWriter(Writer writer)\
    \ {\n        this.queue = new LinkedBlockingQueue<String>(CAPACITY);\n       \
    \ this.logger = new Logger(writer);\n    }\n\n    public void start() { logger.start();\
    \ }\n\n    public void put(String msg) throws InterruptedException {\n       \
    \ queue.put(msg);\n    }\n\n    private class loggerThread extends Thread {\n\
    \        private final PrintWriter writer;\n\n        public void run() {\n  \
    \          try {\n                while (true) {\n                    writer.println(queue.take());\n\
    \                }\n            } catch (InterruptedException ignored) {\n   \
    \         } finally {\n                writer.close();\n            }\n      \
    \  }\n    }\n}\n```\n\nFor a service LogWriter to be useful in production, we\
    \ need a way to terminate the logger thread so it does not prevent the JVM from\
    \ shutting down. Stopping the logger thread is easy enough, since it repeatedly\
    \ calls take, which is responsive to interruption; if the logger thread is modified\
    \ to catch InterruptedException, interrupting the logger thread stops the service.\n\
    \nHowever, making the logger exit is not a very satisfying shutdown mechanism.\
    \ An abrupt shutdown discards logs that might be waiting to be written to the\
    \ log, but more importantly, threads blocked in log because the queue will never\
    \ be opened. Interrupting the logger thread deals with the consumer, but because\
    \ the producers in this case are not dedicated, cancelling them is harder.\n\n\
    Another approach to shutting down LogWriter would be to use a \"shutdown request\"\
    \ to flag messages from being emitted, as shown in Listing 7.14. The consumer\
    \ could drain the queue upon being notified that shutdown has been requested,\
    \ out sending any pending messages and unblocking any producers blocked in log.\
    \ However, this approach has race conditions that make it unreliable. The implementation\
    \ of log is a check-then-atomic-sequence: producers could observe that the service\
    \ has not yet shut down but still queue messages after shutdown, again with the\
    \ risk that the producer might get blocked in log and never become un. There are\
    \ tricks to reduce the likelihood of this (like having the consumer wait several\
    \ seconds before declaring the queue drained), but these do not solve the fundamental\
    \ problem, merely the likelihood that it will cause a failure.\n\n# Listing 7.14.\
    \ Unreliable Way to Add Shutdown Support to the Logging Service.\n\n```\npublic\
    \ void log(String msg) throws InterruptedException {\n    if (shutdownRequested)\
    \ {\n        queue.put(msg);\n    } else {\n        throw new IllegalStateException(\"\
    logger is shut down\");\n    }\n}\n```\n\nTo provide a reliable shutdown for LogWriter\
    \ is to fix the race condition, which means the submission of a new log message\
    \ atomic. We don't want to hold a lock while trying to encode the message, since\
    \ put could block. Instead, we can atomically check for shutdown and conditionally\
    \ increment a counter to \"reserve\" the right to submit a message, as shown in\
    \ LogService in Listing 7.15."
