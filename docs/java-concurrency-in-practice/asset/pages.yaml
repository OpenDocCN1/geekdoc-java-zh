    # ## 2.3. Thread Pools


    A pool, as its name suggests, manages a homogeneous pool of worker threads. A
    thread pool is tightly bound to a work queue holding threads waiting to be executed.
    Worker threads have a simple life: request the next task from the work queue,
    execute it, and go back to waiting for another task.


    Executing tasks in pools has advantages over the thread-per-task approach. Reusing
    an existing thread instead of creating a new one already exists at the time the
    request arrives, the latency with creation does not delay execution, improving
    responsiveness. By properly tuning the size of the thread pool, you can have enough
    threads to keep the processors busy without having so many that your application
    runs out of memory or crashes due to contention among threads for resources.


    The library provides a flexible thread pool implementation with some useful predefined
    configurations. You can create a thread pool by calling one of the factory methods
    in Executors:


    *newFixedThreadPool*. A fixed-size thread pool creates threads as they are submitted,
    up to the maximum pool size, and then attempts to keep the pool size constant
    (adding new threads if a thread dies due to an unexpected Exception).


    *newCachedThreadPool*. A cached pool has more flexibility to reap idle threads
    when the current size of the pool exceeds the demand for processing, and to add
    new threads when demand increases, but places no bounds on the size of the pool.


    *newSingleThreadExecutor*. A single-threaded executor creates a single worker
    thread to process tasks, replacing it if it dies unexpectedly. Tasks are guaranteed
    to be processed sequentially according to the order imposed by the task queue
    (FIFO, LIFO, priority order).[4].


    > [4] Single-threaded executors provide sufficient internal synchronization to
    guarantee that any writes made by tasks are visible to subsequent tasks; this
    means that object task may be replaced with another from time to time.


    The *FixedThreadPool* and *CachedThreadPool* return instances of the general-purpose
    *ThreadPoolExecutor*, which can be used directly to construct more specialized
    executors. We discuss thread pool configuration options in Chapter 8 (See Section
    6.2.5).


    The server in *TaskExecutor* uses an Executor with a bounded pool of worker threads.
    Submitting a task with execute adds it to the work queue, and the worker threads
    repeatedly deque tasks from the queue and execute them.


    Switching from a thread-per-task policy to a pool-based policy has a big effect
    on application stability: the web server will no longer fail under heavy load.[5]
    It degrades gracefully, but does not create thousands of threads that compete
    for CPU and memory resources. When an Executor does to do all sorts of opportunities
    for tuning, management, monitoring, logging, error reporting, and other possibilities
    that would be far more difficult to add without a task execution framework.


    # ## 6.2.4. Executor Lifecycle


    We''ve seen how to create an Executor but not how to shut down one. An Executor
    implementation is likely to create threads for processing tasks. The JVM cannot
    exit until all the (non-daemon) threads have terminated, so failing to shut down
    an Executor could prevent the JVM from exiting.


    Because an Executor processes tasks asynchronously, at any time the state of submitted
    tasks is not immediately obvious. Some have completed, some may be currently running,
    and others may be queued execution. In shutting down an application, there is
    a spectrum from graceful shutdown (finish what you''ve started but don''t accept
    any new work) to abrupt shutdown (turn off the power to the machine run), and
    various points in'
