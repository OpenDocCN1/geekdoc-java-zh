  md: "# 14.6. Subclass Safety Issues\n\nUsing conditional or single notification\
    \ introduces constraints that can complicate subclassing [CPJ 3.3.3.3]. If you\
    \ want to support subclassing at all, you must structure your class so that subclasses\
    \ add the appropriate notification of the base class in a way that violates none\
    \ of the requirements for single or conditional notification.\n\n14.9. Releaseable\
    \ Gate wait and notifyall.\n\n```\n@ThreadSafe\npublic class Threadsafe {\n  \
    \  @CONDITION-PREDICATE: opened-since(n isOpen || generation>n)\n    @GuardedBy(\"\
    this\") private boolean isOpen;\n    @GuardedBy(\"this\") private int generation;\n\
    \n    public synchronized void close() {\n        isOpen = false;\n    }\n\n \
    \   public synchronized void open() {\n        generation++;\n        isOpen =\
    \ true;\n        notifyAll();\n    }\n\n    // BLOCKS-UNTIL: opened-since(generation\
    \ on entry)\n    public synchronized void await() throws InterruptedException\
    \ {\n        int arrivalGeneration = generation;\n        while (!isOpen && arrivalGeneration\
    \ == generation) {\n            wait();\n        }\n    }\n}\n```\n\nA state-dependent\
    \ class should either expose (and document) its waiting and notification protocols\
    \ to subclasses, or prevent subclasses from subclassing at all. This is an extension\
    \ of \"design and document for inheritance, or perhaps prohibit it\" [EJ Item\
    \ 15]. At the very least, designing a state-dependent class for inheritance requires\
    \ exposing the condition queues and locks and synchronization policy; it may also\
    \ require exposing the underlying state variables.(The worst state-dependent class\
    \ is to expose its state variables but not document its protocols for waiting\
    \ and notification; i.)\n\nOne option for this is effectively prevent subclassing,\
    \ by making the class final or hiding the condition queues, locks, state variables\
    \ from subclasses. If the subclass does something to undermine the base class\
    \ then the pop operation blocks empty, creating an unbounded blocking stack in\
    \ which the push operation can always proceed. This meets the requirements for\
    \ single notification. If this class uses single notification and a subclass adds\
    \ a \"pop\" two consecutive \"elements\", then there are now two types of waiters:\
    \ those waiting to pop one element and those waiting to pop two. But if the base\
    \ class protects the condition queue and documents its protocols for using it,\
    \ the subclass can override push method to notifyAll(), restoring safety.\n\n\
    # 14.7. Encapsulating Conditions\n\nIt is generally better to encapsulate the\
    \ condition so that it is not accessible to the class hierarchy in which it is.\
    \ Otherwise, callers might think they understand your waiting and notification\
    \ in a more consistent manner with your design.(It is impossible to enforce the\
    \ uniform waiters requirement for single notification unless the condition queue\
    \ is inaccessible to control; if any code mistakenly waits could revert your notification\
    \ protocol and cause a hijacked signal.)\n\nUnfortunately, this - encapsulate\
    \ objects as condition queues - is not consistent with the common design pattern\
    \ for thread-safe classes, in which an object's intrinsic lock is used to guard\
    \ its state. Boundedbuffer illustrates this common idiom, where the buffer object\
    \ itself is the lock and condition queue; the only difference would be that it\
    \ could easily be restricted to using a private lock and condition queue; no longer\
    \ support any form of client-side locking.\n\n# 14.8. Entry and Exit Protocols\n\
    \nWellings (2004) characterizes the proper use of wait and notify in entry and\
    \ exit protocols. For each state-dependent operation and for each operation that\
    \ modifies a state on which another operation has a dependency, you should define\
    \ and document an entry and exit protocol. The entry protocol is the operation's\
    \ condition predicate; the exit protocol examines any state variables that have\
    \ been changed by the operation"
