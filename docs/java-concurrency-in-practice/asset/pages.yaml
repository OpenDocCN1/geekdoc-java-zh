    Larry\");\n    stooges.add(\"Curry\");\n}\n    public boolean isStooge(String\
    \ name) {\n    return stooges.contains(name);\n}\n```\n\nBecause program state\
    \ changes all the time, you might be tempted to think that immutable objects are\
    \ of limited use, but this is not the case. There is a difference between an object\
    \ being immutable and the reference to it immutable. Program state stored in immutable\
    \ objects can be updated by \"replacing\" immutable objects with a new instance\
    \ holding new state; the next section offers an explanation of this technique\
    \ [13]\n\n[13] Many developers fear this approach will create performance problems,\
    \ but these fears are usually unwarranted. Allocation is cheaper than you might\
    \ think, and immutable objects offer additional performance advantages such as\
    \ reduced locking or defensive copies and reduced impact on garbage collection.\n\
    \n# 3.4.1. Final Fields\n\nThe final keyword, a more limited version of the constraint\
    \ mechanism from C++, supports the construction of immutable objects. Final fields\
    \ cannot be modified (although the objects they refer to can be modified if they\
    \ are mutable), but they have special semantics within the Java Memory Model.\
    \ It is the use of final that makes the guarantee of initialization (see Section\
    \ 3.5) that immutable objects be freely accessed and shared without synchronization.\n\
    \nEven if an object is mutable, making fields final can still simplify reasoning\
    \ about its state, since the mutability of an object restricts its set of possible\
    \ states. An object that is \"mostly immutable\" has but one or two mutable variables\
    \ is still simpler than one that has many mutable variables. Declaring fields\
    \ final also helps maintain that these fields are not expected to change.\n\n\
    > Just as is a good practice to make all fields private unless they need greater\
    \ visibility [EJ Item 12], it is a good practice to make all fields final unless\
    \ they need to be mutable.\n\n# 3.4.2: Using Volatile to Publish Immutable Objects\n\
    \nIn UsingCachingFactorizer on page 24, we use two atomicReferences to store the\
    \ last and number factors, but this was not thread-safe because we could not fetch\
    \ or update the two values atomically. Using volatile variables for these values\
    \ would not be thread-safe for the same reason. However, immutable objects sometimes\
    \ provide a weak form of atomicity.\n\nThe servlet performs two operations that\
    \ must be atomic: updating the cached and conditionally fetching the cached factors\
    \ if the cache matches the requested number. Whenever a group of related items\
    \ must be acted upon, creating an immutable class holder for them, such as volatilecache\
