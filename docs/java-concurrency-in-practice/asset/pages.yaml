  md: "# Java Concurrency Practice\n\nbecause tasks share mutable state, such as the\
    \ set of positions). If multiple processors are available, this could reduce the\
    \ time it takes to find a solution.\n\nConcurrentPuzzleSolver in Listing 8.16\
    \ uses an inner Solver class that extends Node and implements Runnable. Most of\
    \ the work is done in evaluating the set of possible next positions, pruning already\
    \ searched, evaluating whether such even has been achieved (by this task or some\
    \ other task), and submitting unfinished results to an Executor.\n\nTo avoid infinite\
    \ loops, the sequential version maintains a set of previously searched positions;\
    \ ConcurrentPuzzleSolver uses a ConcurrentHashMap for this purpose. This thread\
    \ safety and avoids the race condition inherently in updating a shared collection\
    \ by using putAbsent to atomically add a position if it was not previously known.\
    \ ConcurrentPuzzleSolver uses the internal work queue of the thread pool to avoid\
    \ the stack to hold the state of the search.\n\nListing 8.14. Link Node for the\
    \ Puzzle Solver Framework.\n\n```\n@Immutable\nstatic class Node<P> {\n    final\
    \ P pos;\n    final M move;\n    final Node<P, M> prev;\n\n    Node(P pos, M move,\
    \ Node<P, M> prev) {...}\n\n    List<M> moveList() {\n        List<M> solution\
    \ = new LinkedList<>();\n        for (Node<P, M> n = this; n.move != null; n =\
    \ n.prev) \n            solution.add(0, n.move);\n        return solution;\n \
    \   }\n}\n```\n\nThe concurrent approach also trades one form of limitation for\
    \ another that might be more suitable to the problem domain. The sequential version\
    \ performs a breadth-first search and is therefore free of the stack size restriction\
    \ (but can still run out of memory if the set of positions searched or already\
    \ searched exceeds the available memory).\n\nIn order to stop searching when we\
    \ find a solution, we also need a way to update the solution only if no other\
    \ task has already found one. If we want to accept the first solution found, we\
    \ also need to determine whether that has has a solution yet. These requirements\
    \ describe a sort of latch (see Section 5.5.1) and in particular, a result-bearing\
    \ latch. We could easily build a blocking resultbearing latch using the techniques\
    \ in Chapter 14, but it is often easier and less error-prone to use existing libraries\
    \ rather than low-level language mechanisms. Valuelatch in Listing 8.17 provides\
    \ a way to hold such a value; for readers, callers can wait until it has been\
    \ set, and writers can block waiting for it to be. On the first call to setValue,\
    \ the solution is updated and the CountDownLatch is decremented, releasing the\
    \ main thread from getValue().\n\nEach task first constructs the solution and\
    \ stops if a solution has already been found. The main thread needs to wait until\
    \ a solution is found; getValue inlatch blocks until the first call actually sets\
    \ the value.\n\nThe first thread to find a solution also shuts down the Executor,\
    \ to prevent new tasks from being accepted. Avoid having to deal with RejectedExecutionException,\
    \ discard submitted tasks. Then, all unfinished tasks run to completion and any\
    \ subsequent tasks execute no new tasks silently, allowing the executor to terminate.\
    \ (If the tasks take longer to run, we might want to interrupt them instead of\
    \ letting them finish.)"
