  md: '# 2.4. Guarding With Locks


    Serialized access to an object has nothing to do with object serialization (turning
    an object into a byte stream); serialization means that threads take turns accessing
    the object exclusively, rather than doing so concurrently. Following these protocols
    can ensure state consistency.


    Compound actions on state, must be atomic to avoid race conditions. For instance
    incrementing a counter (read-modify-write) or lazy initialization (check-then-act),
    holding a lock for the entire duration of a compound action can make compound
    action atomic. however, just wrapping the compound action with a synchronized
    block is not enough; synchronization is needed everywhere that variable is accessed.
    Further, when using locks to coordinate access to a variable, the variable must
    be used wherever variable is accessed.


    it is a common mistake to assume that synchronization needs to be used only when
    writing shared variables; this is simply not true.(The reasons for this will become
    clearer in Section 3.1.)


    > For each mutable variable that may be accessed by more than one thread, all
    accesses to that variable must be performed with the same lock held. In this case,
    we say that the variable is guarded by that lock.


    In SynchronizedFactorizer Listing 2.6, lastName and lastFactors are guarded by
    their object''s intrinsic lock, and object''s fields need not be guarded by its
    intrinsic lock, there is no inherent relation between them this is a perfectly
    valid lock convention that is used by many classes. Acquiring a lock associated
    with an object prevents other threads from acquiring that - the only thing that
    acquiring a lock prevents other thread from acquiring that same lock. Every object
    that has a lock is just a convenience so that you don''t explicitly create lock
    objects. [9] it is up to you to construct locking protocols or synchronization
    policies that let you access shared state, and use them consistently throughout
    your program.


    In [9] respect, this design decision was probably a bad one: not only can it be
    confusing, but for JVM implementations to make tradeoffs between object size and
    locking performance.


    > Every shared, mutable variable should be guarded by exactly one lock. it makes
    clearer to maintain which lock is that.


    A common locking convention is to encapsulate all mutable state within an object
    and to prevent it from concurrent access by synchronizing any code path that accesses
    it. This pattern is used by many thread-safe classes, such as vector and synchronized
    collections. In all cases, the variables in an object''s state are guarded by
    the object''s intrinsic lock. however, there is nothing special about this pattern,
    and neither the compiler nor the runtime enforces this (or any other pattern)
    of locking. [10] it is easy to subvert this locking protocol accidentally by adding
    code path or forgetting to use synchronization.


    [10] Code auditing tools like FindBugs identify when a variable is frequently
    but not accessed with a lock held, which might indicate a bug.


    Not all data needs to be guarded by locks - only mutable data that will be accessed
    from multiple threads. In Chapter 1, we described how adding a simple asynchronous
    event such creates thread safety requirements that ripple through your program,
    especially if your program is poorly encapsulated. Consider a single-threaded
    program that processes a large amount of data. Data is shared across threads.
    Single-threaded programs require no synchronization, because no data is shared
    across threads. Imagine that you want to add a feature to create periodic snapshots
    of your progress, so that it does not start from the beginning if it crashes or
    must be stopped. You might choose to do this with a TimerTask that goes off every
    minutes, saving the program state to a file.


    Since the TimerTask will be called from another thread (one managed by Timer),
    any data in the snapshot is now accessed by two threads: the main program thread
    and the Timer thread. This means that not only the TimerTask use synchronization
    when accessing the program, but so any code path in the rest of the program that
    touches that same data. What used to require no synchronization now requires synchronization
    throughout the program.'
