  md: '# 13.3. Fairness


    The ReentrantLock offers a choice of two fairness options: a nonfair lock (the
    default) or a fair lock. Threads acquire a fair lock in the order in which they
    requested it, whereas a nonfair lock permits barging: a requesting lock can jump
    ahead of the queue of waiting threads if the lock becomes available when it is
    requested (Semaphore also offers the choice of fair or nonfair ordering). ReentrantLocks
    do not go out of their way to promote simply prevent a thread from showing up
    at the right time. With a fair lock, a newly requesting thread is queued if the
    lock is held by another or if threads are waiting for the lock; with a nonfair
    lock, the thread is queued only if it is currently held.¹


    +   [4] The TRLLock always barges, even for fair locks.

    Wouldn''t we all locks to be fair? After all, fairness is good and unfair, right?
    (Ask your kids). When it comes to locking, though, fairness has a significant
    performance cost because of the overhead of suspending and resuming threads. In
    practice, a statistical guarantee - promising that a thread will eventually acquire
    the lock - is good enough, and far less expensive to deliver. Some algorithms
    rely on fair queuing to ensure their correctness, which is unnecessary. In most
    cases, the performance benefits of nonfair locks outweighs the benefits of fair
    queuing.


    Figure 12 shows the map performance test, this time comparing HashMap with fair
    and nonfairentrantLocks on a four-way Opter system running Solaris, on a log scale.
    The fairness penalty is nearly orders of magnitude. Dont pay for fairness if you
    don''t need it.


    +   [5] For the ConcurrentHashMap it is fairly in the region between four and
    eight threads. These variations almost certainly come from measurement noise,
    which could be introduced by interactions with the hash codes of the elements,
    thread scheduling, mapping, resizing, collection or memory-system effects, or
    by the OS deciding to run some housekeeping task around the time that test run.
    The reality is that there are all sorts of variations in performance tests that
    aren''t worth bothering to control. We made no attempt to clean up our graphs,
    but real-world performance measurements are also full of noise.


    # Figure 12. Fair Versus Non-fair Performance.


    ![](img/c64daf12e0d6c877213813fc53c890a4_191_0.png)


    One reason barging locks perform so much better than fair locks under heavy contention
    is that there can be a significant delay when a suspended thread is resumed and
    when it actually runs. Let''s say thread A holds a lock and thread B requests
    it. Since the lock is busy, B is suspended. When A releases the lock, B is resumed
    so it can try again. In the meantime, though, if C requests the lock, there is
    a good chance that C can acquire the lock, use it, and release it before B finishing
    up. In this case, everyone wins: B gets the lock no later than it otherwise would,
    C gets it much earlier, and barging is improved


    Fair locks tend to work best when they are held for a relatively long time or
    when the mean time between requests is relatively long. In these cases, the condition
    where barging provides a throughput advantage - when the lock is held by another
    that is currently locking up to claim - it is less costly to us.


    Like the ReentrantLock, intrinsic locking of most implementations are enough no
    deterministic fairness guarantees, but the statistical guarantees are enough for
    all situations. The language specification does not require the JVM to implement
    intrinsic fair locks, and no production JVMs do. ReentrantLock does depress fairness
    to few unless only makes explicitly something that was present all long.'
