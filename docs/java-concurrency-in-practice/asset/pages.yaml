  md: "# 10.7. Portion of Thread Dump After Deadlock.\n\nFound one Java-level deadlock:\n\
    \n```\n\"ApplicationServerThread\"\n  waiting to lock monitor 0x008f0fdcd (a MumbleDBConnection),\n\
    \  which is held by \"ApplicationServerThread\"\n\"ApplicationServerThread\"\n\
    \  waiting to lock monitor 0x008f0fdce (a MumbleDBCallableableStatement),\n  which\
    \ is held by \"ApplicationServerThread\"\nJava stack information for the threads\
    \ listed above:\n\"ApplicationServerThread\"\n  at MumbleDBConnection.remove_statement\n\
    \    waiting to lock <0x60ff7fd0> (a MumbleDBConnection)\n  at MumbleDBStatement.close\n\
    \    locked <0x6024ffb0> (a MumbleDBCallableStatement)\n\"ApplicationServerThread\"\
    \n  at MumbleDBStatement.rollbackstatement.sendback\n    waiting to lock <0x6024ffb0>\
    \ (a MumbleDBCallableStatement)\n  at MumbleDBConnection.commit\n    locked <0x60ff7fd0>\
    \ (a MumbleDBConnection)--\n```\n\nThe JDBC driver we used has a lock-ordering\
    \ bug: different calls to the JDBC driver acquire multiple locks in different\
    \ order. But this problem would have manifested itself if it were not for another\
    \ bug: multiple threads were trying to use the same JDBC connection at the same\
    \ time. This was not how the application was supposed to work the developers saw\
    \ the same connection caused by two threads. There is noting in the JDBC specification\
    \ that requires a connection to be thread-safe, and it is common to use of a connection\
    \ to a single thread, as was intended. The vendor tried to deliver a thread-safe\
    \ JDBC driver, as evidenced by the synchronization on multiple JDBC objects within\
    \ the driver code. Unfortunately, the vendor did not take locking into account,\
    \ the driver was prone to deadlock, but it was the interaction of the deadlock-prone\
    \ driver and the incorrect connection sharing by the application that caused the\
    \ problem. Neither bug was fatal in isolation, although persisted despite extensive\
    \ testing.\n\n# 10.3. Other Lifetime Hazards\n\nWhile deadlock is the most widely\
    \ encountered lifetime hazard, there are several other hazards you may encounter\
    \ in concurrent programs including starvation, missed signals, and livelock.(Missed\
    \ signals are covered in Section 14.2.3).\n\n# 10.1. Starvation\n\nStarvation\
    \ occurs when a thread is perpetually denied access to resources in order to make\
    \ progress; the most commonly starved resource is CPU cycles. Starvation in Java\
    \ applications can be caused by inappropriate use of thread priorities. It can\
    \ also be caused by nonterminating constructs (infinite loops or waits that do\
    \ not terminate) with a lock, since other threads that need the lock will never\
    \ be able to acquire it.\n\nThe thread priorities in the Thread API are merely\
    \ hints. The Thread API defines priority levels that the JVM maps to operating\
    \ system scheduling priorities as it sees fit. This is platform-specific, so Java\
    \ priorities can map to the same OS priority on one OS and different OS on others.\
    \ Some operating systems have fewer than ten priority levels, in which multiple\
    \ Java priorities map to the same OS priority.\n\nOperating systems could have\
    \ great lengths to provide scheduling fairness and fairness beyond what is required\
    \ by the Java Language Specification. In most applications, all threads have the\
    \ same priority. Thread.NORM_PRIORITY. The thread priority mechanism is a blunt\
    \ instrument, and it's not always obvious what effect changing priorities will\
    \ have; boosting a thread priority might do nothing or always cause one thread\
    \ to be scheduled in preference to the other, causing starvation.\n\nIt is generally\
    \ wise to resist the temptation to vary thread priorities as you start modifying\
    \ priorities, you introduce the risk of starvation. You can often spot a program\
    \ that is trying to recover from thread prioritizing or other responsiveness problems\
    \ by the presence of thread.sleep or thread yields in all places, in an attempt\
    \ to get more time to lower-priority threads.[5]\n\n[5] The semantics of Thread.yield(and\
    \ Thread.sleep(0)) are undefined in JLS 17:9; the JVM is free to interpret or\
    \ not treat them as hints. they are not required to have the semantics of sleep.sleep(0)\
    \ on Unix systems - put the current thread at the end of the run queue for priority,\
    \ which yields to other threads of the same priority - though some JVMs implement\
    \ yield this way."
