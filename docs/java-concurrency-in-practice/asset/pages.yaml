  md: "# Java Concurrency in Practice\n\n[2] In release a semaphore, the permits are\
    \ not explicitly represented or associated with an owner thread; a release operation\
    \ creates a permit and an acquire operation consumes one.\n\nListing 12.1. Bounded\
    \ Buffer Using Semaphore.\n\n```\n@ThreadsSafe\npublic class BoundedBuffer<E>\
    \ {\n    private final Semaphore availableItems;\n    private final Semaphore\
    \ availableSpaces;\n    @GuardedBy(\"this\") private E[] items;\n    @GuardedBy(\"\
    this\") private int takePosition = 0;\n\n    public BoundedBuffer(int capacity)\
    \ {\n        availableItems = new Semaphore(0);\n        availableSpaces = new\
    \ Semaphore(capacity);\n        items = (E[]) new Object[capacity];\n    }\n\n\
    \    public boolean isEmpty() {\n        return availableItems.availablePermits()\
    \ == 0;\n    }\n\n    public boolean isFull() {\n        return availableSpaces.availablePermits()\
    \ == 0;\n    }\n\n    public void put(E x) throws InterruptedException {\n   \
    \     availableSpaces.acquire();\n        doInsert(x);\n        availableItems.release();\n\
    \    }\n\n    public E take() throws InterruptedException {\n        availableItems.acquire();\n\
    \        E item = doExtract();\n        availableSpaces.release();\n        return\
    \ item;\n    }\n\n    private synchronized void doInsert(E x) {\n        items[takePosition]\
    \ = x;\n        takePosition = ((takePosition + 1) == items.length) ? 0 : takePosition;\n\
    \    }\n\n    private synchronized E doExtract() {\n        E x = items[takePosition];\n\
    \        items[takePosition] = null;\n        takePosition = ((takePosition +\
    \ 1) == items.length) ? 0 : takePosition;\n        return x;\n    }\n}\n```\n\n\
    # 12.1. Basic Unit Tests\n\nThe most basic tests for BoundedBuffer are similar\
    \ to what we'd use in a sequential contextbounded a buffer, call its methods,\
    \ and assert post-conditions and invariants. Some invariants that quickly come\
    \ to mind are that a freshly created buffer should itself be empty, and not as\
    \ full. A slightly more complicated version would be to test insert N items into\
    \ a buffer with capacity N (which succeeds without blocking), and test that the\
    \ buffer recognizes that it is full (and not empty). Junit tests for these properties\
    \ are shown in Listing 12.2.\n\nListing 12.2. Basic Unit Tests for BoundedBuffer.\n\
    \n```\nclass BoundedBufferTest extends TestCase {\n    void testConstructor()\
    \ {\n        BoundedBuffer<Integer> bb = new BoundedBuffer<>(10);\n        assertTrue(bb.isEmpty());\n\
    \        assertFalse(bb.isFull());\n    }\n\n    void testFullAndEmpty() throws\
    \ InterruptedException {\n        BoundedBuffer<Integer> bb = new BoundedBuffer<>(10);\n\
    \        for (int i = 0; i < 10; i++) {\n            bb.put(i);\n        }\n \
    \       assertTrue(bb.isFull());\n        assertFalse(bb.isEmpty());\n    }\n\
    }\n```\n\nThese simple test methods are entirely sequential. Including a set of\
    \ sequential tests in your test suite is often helpful, since they can disclose\
    \ when a problem is not related to concurrency issues before you start looking\
    \ for data races."
