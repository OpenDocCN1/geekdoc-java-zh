    \ Locks\n@ThreadSafe\npublic static class stripedMap {\n    // Synchronization\
    \ policy: buckets[n] guarded by locks[n%N_LOCKS]\n    private static final int\
    \ N_LOCKS = 16;\n    private final Node[] buckets;\n    private final Object[]\
    \ locks;\n\n    private static class Node { ... }\n\n    public stripedMap(int\
    \ numBuckets) {\n        buckets = new Node[numBuckets];\n        locks = new\
    \ Object[N_LOCKS];\n        for (int i = 0; i < N_LOCKS; i++) {\n            locks[i]\
    \ = new Object();\n        }\n    }\n\n    private int hash(Object key) {\n  \
    \      return Math.abs(key.hashCode() % buckets.length);\n    }\n\n    public\
    \ Object get(Object key) {\n        int hash = hash(key);\n        synchronized\
    \ (locks[hash % N_LOCKS]) {\n            for (Node m = buckets[hash]; m != null;\
    \ m = m.next) {\n                if (m.key.equals(key))\n                    return\
    \ m.value;\n            }\n        }\n        return null;\n    }\n\n    public\
