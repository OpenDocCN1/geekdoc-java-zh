  md: "# Listing 14.4. Circuit Logic for GrumpyBoundedBuffer.\n\n```\nwhile (true)\
    \ {\n    try {\n        var item = buffer.take();\n        // use item\n    }\
    \ catch (BufferEmptyException e) {\n        Thread.sleep(SLEEP_GRANULARITY);\n\
    \    }\n}\n```\n\nA variant of this approach is to return an error value when\
    \ the buffer is in the wrong state. This is a minor improvement because it doesn't\
    \ abuse the exception mechanism by throwing an exception that means \"sorry, try\
    \ again\", but it does not address the fundamental problem: that callers must\
    \ deal with preemption failures. [2]\n\nQueue offers both of these options - poll\
    \ returns null if the queue is empty, and throws an exception - Queue is not intended\
    \ for producer-consumer devices. BlockingQueue, where operations block until the\
    \ queue is in the right state, is a better choice when producers and consumers\
    \ execute concurrently.\n\nThe client code in Listing 14.4 is not the only way\
    \ to implement the retry logic. The caller could retry the retry immediately without\
    \ waiting or spinning. This could consume a lot of CPU time if the buffer state\
    \ does not change for while. On the other hand, the caller decides to sleep so\
    \ as not to consume so much CPU time, it could also \"oversleep\" if the buffer\
    \ state changes shortly after the call to sleep. The client code is left with\
    \ both busy waiting and spinning would be calling.yield in each iteration, which\
    \ is a hint to the scheduler that would be a reasonable time to let another thread\
    \ run. If you are waiting for another thread to do something, something might\
    \ happen later if the processor faster than your scheduling quantum.\n\n# 14.1.2.\
    \ Crude: Blocking by Polling and Sleeping\n\nSleepyBoundedBuffer in Listing 14.5\
    \ spares callers from the inconvenience of implementing the retry logic on each\
    \ caller by encapsulating the simple \"poll and sleep\" retry mechanism within\
    \ the take and put operations. If the buffer is empty, it sleeps until another\
    \ thread puts some data into the buffer; if the buffer is full, it sleeps until\
    \ another thread removes some data. This approach encapsulates preconditioning\
    \ management and simplifies the buffer - definitely a in the right direction.\n\
    \nThe implementation of SleepyBoundedBuffer is more complicated than the previous\
    \ attempt. [3] The buffer code must test the appropriate state with the buffer\
    \ lock, because the variables that represent the state are guarded by the buffer\
    \ lock. If the lock fails, the executing thread sleeps for a while, first releasing\
    \ the lock so other threads can access the buffer. [4] Once the lock is acquired,\
    \ it reacquires the lock and tries again, alternating between sleeping and the\
    \ state condition until the operation can proceed.\n\n[3] We will provide the\
    \ details of Snow White's other five buffer implementations, especially SnezyBoundedBuffer.\n\
    [4] It is usually a bad idea to go to sleep or oversleep with a lock held, but\
    \ this is also worse because the danger (buffer full/empty) can become never if\
    \ the lock is not released!\n\nFrom the perspective of the caller, this works\
    \ well - if the operation can proceed immediately, and otherwise it blocks - the\
    \ caller need not deal with the mechanics of failure and retry. Choosing the sleep\
    \ granularity is a tradeoff between responsiveness and CPU usage; the more granular,\
    \ the more resources consumed. Figure 14.1 shows how sleep granularity can affect\
    \ responsiveness: there may be a delay between buffer space becomes available\
    \ and when the thread wakes up and checks again.\n\n# Figure 14.1. Oversleep Because\
    \ the Condition Became True Just After It Went to Sleep.\n\n![](img/c64daf12e0d6c877213813fc53c890a4_197_0.png)"
