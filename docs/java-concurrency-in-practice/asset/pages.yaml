  md: "# 6BPart III: Liveness, Performance, and Testing - 22BChapter 10. Avoiding\
    \ Liveness Hazards\n\n[1] Ironically, holding locks for periods of time, as you\
    \ are supposed to do to reduce lock contention, increases the likelihood that\
    \ testing will not disclose deadlock locks.\n\n[2] For simplicity, DemonstrateDead\
    \ ignores the issue of account balances.\n\n# Listing 10.4. Driver Loop that Deadlocks\
    \ Under Typical Conditions.\n\n```\npublic class DemonstrateLock {\n    private\
    \ static final int NUM_THREADS = 20;\n    private static final int NUM_ACCOUNTS\
    \ = 5;\n    private static final int NUM_ITERATIONS = 100000;\n\n    public static\
    \ void main(String[] args) {\n        Random rnd = new Random();\n        Account[]\
    \ accounts = new Account[NUM_ACCOUNTS];\n\n        for (int i = 0; i < accounts.length;\
    \ i++) {\n            accounts[i] = new Account();\n        }\n\n        class\
    \ TransferThread extends Thread {\n            public void run() {\n         \
    \       for (int i = 0; i < NUM_ITERATIONS; i++) {\n                    int fromaccount\
    \ = rnd.nextInt(NUM_ACCOUNTS);\n                    int toaccount = rnd.nextInt(NUM_ACCOUNTS);\n\
    \                    Dollar amount = new Dollar(rnd.nextInt(1000));\n        \
    \            transferMoney(accounts[fromaccount], accounts[toaccount], amount);\n\
    \                }\n            }\n        }\n\n        for (int i = 0; i < NUM_THREADS;\
    \ i++) {\n            new TransferThread().start();\n        }\n    }\n}\n```\n\
    \n# 10.3. Deadlocks Between Cooperating Objects\n\nMultiple lock acquisition is\
    \ not as obvious as in LeftRightLock or TransferMoney; the two locks need not\
    \ be acquired by the same method. Consider the cooperating classes in List 10.5,\
    \ which might be used in a taxic dispatching application. Taxi represents an individual\
    \ taxi with a location and destination; Dispatcher represents a fleet of taxis.\n\
    \nWhile no method acquires two locks, callers of location and getimage acquire\
    \ two locks just the same. If a thread setLocation in response to an update from\
    \ a GPS receiver, it first updates the taxi's location and then checks to see\
    \ if it has reached its destination. If it has, informs the dispatcher that needs\
    \ a new destination. Since both location and notifying are synchronized, the thread\
    \ calling setLocation acquires the taxi and the dispatcher lock. Similarly, a\
    \ thread getting image acquires the dispatcher and each taxi lock. As in Leftrightlock,\
    \ two locks are acquired in different orders, risking deadlock.\n\nIt is easy\
    \ to spot the deadlock possibility in LeftRightLock or TransferMoney by looking\
    \ for methods that acquire two locks. Spotting the deadlock possibility in taxi\
    \ and dispatcher is simpler: the warning is that you are holding a lock.\n\nInvoking\
    \ an alien method with a lock held is risky for liveness. The alien method might\
    \ acquire other locks (risking deadlock) or for an unexpectedly long time, stalling\
    \ other threads that need the lock.\n\n# 10.4. Open Calls\n\nOf course, taxi and\
    \ dispatcher didn't know that they were each half of a deadlock waiting to happen.\
    \ They shouldn't have to be; a method call is an abstraction barrier intended\
    \ to shield you from the details of what happens on the other side of you.\n\n\
    Calling a method with no locks held is an open call (CPJ 2.1.4.3), and thus open\
    \ calls are more behaved and manageable than classes that make calls with locks.\
    \ Using encapsulation to avoid deadlock is analogous to encapsulation to provide\
    \ thread safety: the thread-safe program without encapsulation, the thread safety\
    \ analysis of a program that makes effective use of encapsulation is easier than\
    \ that of one that does not. The liveness analysis of a program that relies exclusively\
    \ on open calls is easier than that that does not. Restricting to open calls makes\
    \ it easier to identify the code paths that acquire multiple locks and ensure\
    \ they are acquired in a consistent order."
