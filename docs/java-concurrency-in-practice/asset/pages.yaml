    # 4.1.2. State-dependent Operations


    Class invariants and postconditions constrain the valid states and state transitions
    for an object. Some objects also have methods with state-based preconditions.
    For example, you cannot remove an item from an empty queue; a queue must be in
    the "nonempty" state before you can remove it. Operations with state-based preconditions
    are called state-dependent (CP 3).


    In a single-threaded program, if a precondition does not hold, the operation has
    no choice but to fail. But in a concurrent program, the precondition may become
    true due to the action of another thread. Concurrent programs allow the possibility
    of waiting until the precondition becomes true, and then proceeding with the operation.


    The built-in mechanisms for efficiently waiting for a condition to become true
    and notify are tightly bound to intrinsic locking, and can be difficult to use.
    To create operations that wait for a precondition to become true before proceeding,
    it is easier to use existing library classes, such as blocking queues or semaphores,
    to provide the desired state-dependent behavior. Blocking library classes such
    as BlockingQueue, Semaphore, and others are covered in Chapter 5; creating state-dependent
    classes using the low-level mechanisms provided by the platform and library is
    covered in Chapter 4.


