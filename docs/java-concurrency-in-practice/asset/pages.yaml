    \    reachedDestination = location.equals(destination);\n        }\n        if\
    \ (reachedDestination)\n            dispatcher.notifyAvailable(this);\n    }\n\
    }\n\n@Threads\nclass Dispatcher {\n    @GuardedBy(\"this\") private final Set<Taxi>\
    \ taxis;\n    @GuardedBy(\"this\") private final Set<Taxi> availableTaxis;\n\n\
    \    public synchronized void notifyAvailable(Taxi taxi) {\n        availableTaxis.add(taxi);\n\
    \    }\n\n    public Image getImage() {\n        Set<Taxi> copy;\n        synchronized\
    \ (this) {\n            copy = new HashSet<Taxi>(taxis);\n        }\n        Image\
    \ image = new Image();\n        for (Taxi t : copy) {\n            image.drawWorker(t.getLocation());\n\
    \        }\n        return image;\n    }\n}\n```\n\nSay you have two pooled resources,\
    \ such as connection pools for two databases. When the pool is empty, if a task\
    \ requires connection to both databases and these two resources are not requested\
    \ in the same order, thread A could be holding a connection to database D1 while\
    \ waiting for a connection to database D2, and thread B could be holding a connection\
    \ to D2, while waiting for a connection to D1. (The larger the pools, the less\
    \ likely this is to occur; if each thread has N connections, deadlock requires\
    \ S sets of cyclical threads and a lot of unlucky timing.)\n\nAnother form of\
    \ resource-based deadlock is thread-starvation deadlock. We saw an example of\
    \ this hazard in Section 8.1.1, where a task submits and waits for its execution\
    \ in a single-threaded Executor. In that case, the first task will wait, permanently\
    \ stalling the task and all others that want to execute in Executor. Tasks that\
    \ wait for the results of the other tasks are the primary source of thread-starvation\
    \ deadlock; bounded pools and interdependent tasks do not mix.\n\n# 10.2. Avoiding\
    \ and Diagnosing Deadlocks\n\nA program that requires more than one lock at a\
    \ time can experience lock-ordering deadlock. Of course, this is not always practical,\
    \ but if you can get away with it, it's a lot of work. If you acquire multiple\
    \ locks, lock ordering must be a part of your design: to minimize the number of\
    \ potential lock interactions, and follow and document a lock-ordering protocol\
    \ for locks that are acquired together."
