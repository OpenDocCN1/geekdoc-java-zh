  md: "# Java Concurrency In Practice\n\nwith it either InterruptedException or restore\
    \ the interrupted status by calling interrupt again, as in Listing 5.10 on page\
    \ 94.\n\nBrokenProducer illustrates how custom cancellation mechanisms do not\
    \ always interact well with blocking library methods. If you code your tasks to\
    \ respond to interruption, you can use interruption as your cancellation mechanism\
    \ and take advantage of the interruption support provided by many library classes.\n\
    \n> Interruption is usually the most sensible way to implement cancellation.\n\
    \nBrokenProducer can be easily fixed (and simplified) by using interruption instead\
    \ of a boolean flag to prevent cancellation, as in Listing 7.5. There are two\
    \ points in each loop where interruption might be detected: in the blocking call,\
    \ and by explicitly testing the interrupted status in the loop header. The explicit\
    \ test is not strictly necessary because the blocking call works, but makes BrokenProducer\
    \ more responsive to interruption because it checks for interruption before the\
    \ lengthy task of searching for a prime, rather than after. When calls to interruptible\
    \ blocking methods are not frequent enough to deliver the desired responsiveness,\
    \ explicitly testing the interrupted status\n\nListing 7.5: Using Interruption\
    \ for Cancellation.\n\n```\nclass BlockingProducer extends Thread {\n    private\
    \ final BlockingQueue<BigInteger> queue;\n\n    BlockingProducer(BlockingQueue<BigInteger>\
    \ queue) {\n        this.queue = queue;\n    }\n    public void run() {\n    \
    \    try {\n            BigInteger p = BigInteger.ONE;\n            while (Thread.currentThread().isInterrupted())\
    \ {\n                queue.put(p = p.nextProbablePrime());\n            }\n  \
    \      } catch (InterruptedException consumed) {\n            // Allow thread\
    \ to exit \"\n        }\n    }\n    public void cancel() {\n        interrupt();\n\
    \    }\n}\n```\n\n# 7.1.2. Interruption Policies\n\nJust as tasks should have\
    \ a cancellation policy, threads should have an interruption policy. An interruption\
    \ policy determines how a thread interprets an interrupt - what it does (if anything)\
    \ when one is detected, what units of work are considered with respect to interruption,\
    \ and how quickly it reacts to interruption.\n\nThe most sensible interruption\
    \ policy is one of thread-level or service-level cancellation: exit as quickly\
    \ as possible, cleaning up if necessary, and notifying some owning entity that\
    \ the thread is exiting. It is possible to establish other interruption policies,\
    \ such as pausing or resuming a service, but threads or thread pools with non\
    \ interruption interruption policies may be restricted to tasks that have been\
    \ written with an awareness of the policy.\n\nIt is important to distinguish between\
    \ how tasks and threads react to interruption. A single interrupt may have more\
    \ than one desired recipient a worker thread in a thread pool can mean \"cancel\
    \ the current task\" and \"shut down the worker\".\n\nTasks do not execute in\
    \ their threads; they borrow threads from a service as a thread pool. Code should\
    \ be careful to preserve the interrupted status so that the owner can act on it,\
    \ even if the \"guest\" acts on the interruption as well. (If you are house-sitting\
    \ for someone, do not throw out the mail when they're away - you save it and deal\
    \ with them when they get back, if you do read their magazines.)\n\nThis is why\
    \ blocking library methods simply throw Interruptedexception in response to an\
    \ interrupt. They implement the most reasonable cancellation policy for task or\
    \ library code: get out of the way as quickly as possible and communicate the\
    \ interruption back to the caller so that higher code on the stack can take further\
    \ action.\n\nA task not necessarily drop everything when it detects an interrupt\
    \ request - it can choose to postpone until one more opportunity by remembering\
    \ that it was interrupted, finishing the task it was performing, and then showing"
