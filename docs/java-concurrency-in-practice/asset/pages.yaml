  md: "# Java Concurrency In Practice\n\nto see if they have caused some condition\
    \ predicate to become true, and if so, notifying of the associated condition queue.\n\
    \nAbstractQueuedSynchronizer, upon which the state-dependent classes in java.util.concurrent\
    \ are built (Section 14.4), explores the concept of exit protocol. Rather than\
    \ letting synchron classes perform their notification, it instead replaces synchron\
    \ methods to return a value indicating whether its action has unlocked one or\
    \ more waiting threads. This explicit API requirement makes it harder to \"forget\"\
    \ to notify on some state transitions.\n\n# 14.3. Condition Objects\n\nAs shown\
    \ in Chapter 13, explicit locks can be useful in some situations where intrinsic\
    \ locks are too inflexible. Lock is a generalization of intrinsic locks, condition\
    \ (see Listing 14.0) is a generalization of intrinsic condition queues.\n\nIntrinsic\
    \ condition queues have several drawbacks. Each intrinsic lock can have only one\
    \ associated condition queue, which means that in classes buffer multiple threads\
    \ wait on the same condition queue for different condition predicates, and the\
    \ most common pattern is impossible to enforce the unit wait requirement for notifyAll().\
    \ If you want to create a concurrent object with multiple predicates, or you want\
    \ to exercise more control over the visibility of the condition queue, the explicit\
    \ lock and condition classes offer a more flexible alternative to intrinsic locks\
    \ and condition queues.\n\nA condition is associated with a single lock, just\
    \ as a condition is associated with a single intrinsic lock; to create it call\
    \ lock.newCondition on the associated lock. And as locks offer a richer feature\
    \ set than intrinsic lock, condition offers a richer feature set than condition\
    \ queues: multiple sets per lock, uninterruptible condition queues, deadline-based\
    \ waiting, and choice of fair or nonfair queuing.\n\n```\nListing 14.10.condition\
    \ Interface.\npublic interface Condition {\n    void await() throws InterruptedException;\n\
    \    boolean await(long time, TimeUnit unit) throws InterruptedException;\n  \
    \  long awaitNanos(long nanos) throws InterruptedException;\n    void awaitInterruptibly()\
    \ throws InterruptedException;\n    boolean awaitUntil(Date deadline) throws InterruptedException;\n\
    \    void signal();\n    void signalAll();\n}\n```\n\nListing 14.10.condition\
    \ Interface.\n\nUnlike intrinsic condition queues, you can have as many condition\
    \ objects per lock as you want. Condition objects inherit the fairness settings\
    \ of their associated lock; for fair locks, threads are released from condition.await\
    \ in FIFO order.\n\n> **Warning**: The equivalents of wait, notify, and notifyAll()\
    \ for condition objects are await, signal, and signalAll(). However, condition\
    \ extends object, which means that it has wait and notify methods. Be sure to\
    \ use the proper versions - await and signal - instead\n\nListing 14.11 shows\
    \ how another bounded buffer implementation, is the same as boundedBuffer, but\
    \ its use of two conditions, notFull and empty, explicitly makes the \"not full\"\
    \ and \"empty\" predicates. When blocks because the buffer is empty, it notifies\
    \ notFull, and unblocks any threads that were blocked by notifying empty.\n\n\
    The behavior of concurrentBuffer is easier to analyze a class that uses multiple\
    \ conditions than one that uses a single intrinsic condition with multiple predicates.\
    \ By separating the two conditions into separate wait sets, condition makes it\
    \ easier to meet the requirements for single notification. The more efficient\
    \ signal instead of signalAll() reduces the number of context switches and lock\
    \ acquisitions by each buffer operation.\n\nWith just as built-in locks and condition\
    \ queues, the three-way relationship between the lock, the condition predicate,\
    \ and the condition variable is also held when using explicit Locks and conditions.\
    \ The variables in the condition predicate must be guarded by the Lock, and the\
    \ Lock must be tested when the condition predicate and when calling and signal.[11]\n\
    \n[11] ReentrantLock requires the Lock to be held when calling signal or signalAll,\
    \ but Lock implementations are permitted to construct Conditions that do not have\
    \ this requirement.\n\n![](img/c64daf12e0d6c877213813fc53c890a4_204_0.png)"
