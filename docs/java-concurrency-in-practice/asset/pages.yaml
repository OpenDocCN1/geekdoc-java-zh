    Another common approach is the use of connection pooling (JDBC - Database Connectivity
    Connection). The JDBC specification does not require that connection objects be
    thread-safe. [9] In typical servers, a thread acquires a connection from the pool,
    to process a single request, and returns it. Most connections, such as servlet
    requests are synchronized by a single thread, and the pool will not dispose of
    the connection until it has been returned, this pattern of connection management
    confines the connection to thread for the duration of the request.


    [9] The connection pool implementations provided by application servers are thread-safe;
    connection pools are never accessed from multiple threads, so a non-thread-safe
    implementation would not suffice.


    Just as the language has no mechanism for enforcing that a variable is guarded
    by a lock, it has no means of confining an object to a thread. The implementation
    and core libraries provide mechanisms that can help in maintaining thread confinement
    - local variables and the ThreadLocal - even with these, it is the programmer''s
    responsibility to ensure that thread-confined objects do not escape from their
    thread.


    # 3.3.1. Ad-hoc Thread Confinement


    Ad-hoc thread confinement describes when the responsibility for maintaining thread
    confinement falls entirely on the implementation. Ad hoc thread confinement can
    be fragile because none of the language features


    The decision to use thread confinement is a consequence of the decision to implement
    a subsystem, such as the GUI, as a single-threaded subsystem. Single-threaded
    subsystems sometimes offer a simplicity benefit that outweighs the fragility of
    ad-hoc thread confinement.[10]


    [10] Another reason to use confinement is deadlock avoidance; this is one of the
    primary reasons why GUI frameworks are single-threaded. Single-threaded subsystems
    are covered in Chapter 9.


    A special case of thread confinement applies to volatile variables. It is safe
    to perform read-modify-write operations on shared volatile variables as long as
    you ensure that the volatile variable is only written from a single thread to
    prevent race conditions. In this case, you are confining the modification to a
    thread and the visibility variables ensure that other threads see the most up-to-date
    value.


    Because of its fragility, ad-hoc thread confinement should be used sparingly;
    if possible, use one of the stronger forms of thread confinement (stack confinement
    or ThreadLocal) instead.


    # 3.3.2. Stack Confinement


    Stack confinement is a special case of thread confinement in which an object can
    only be reached through local variables. As encapsulation can make it easier to
    preserve invariants, local variables can make it easier to confine objects to
    a thread. Local variables are intrinsically confined to the executing thread;
    they exist on the thread''s stack, which is not accessible to other threads. Stack
    confinement (also called within-the-thread or thread-local usage, is simpler to
    maintain and less fragile than ad-hoc thread confinement.


    For primitives local variables, such as Pairs in loadTheThread in Listing 3.9,
    you cannot violate stack confinement if you tried. There is no way to obtain a
    reference to a primitive variable, so the language semantics ensure that primitive
    local variables are always stack confined.'
