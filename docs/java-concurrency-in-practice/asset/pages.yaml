    Between these two operations, the queue is in the intermediate state, shown in
    Figure 15.4. After the second update, the queue is again in the quiescent state,
    shown in Figure 15.5.


    # Figure 15.4. Queue in Intermediate State During Insertion.


    ![](img/c64daf12e0d6c877213813fc53c890a4_220_0.png)


    # Figure 15.5. Queue Again in Quiescent State After Insertion is Complete.


    ![](img/c64daf12e0d6c877213813fc53c890a4_220_1.png)


    The key observation that enables all of the required tricks is that if the queue
    is in the quiescent state, the next field of the link node to tail is null, and
    if it is in the intermediate state, tail.next is non-null. So any thread can immediately
    tell the state of the queue by examining tail.next. Further, if the queue is in
    the intermediate state, it can be restored to the quiescent state by advancing
    the tail pointer forward one node, finishing the operation for whichever thread
    is in the middle of inserting an element.[7]


    > [7] For a full account of the correctness of this algorithm, see (Michael and
    Scott, 1996) or (Herilly and Shavit, 2006).


    Linkedqueue first checks to see if the queue is in the intermediate state before
    attempting to insert a new element (step A). If it is, some other thread is already
    in the process of inserting an element (between its steps C and D). Rather than
    wait for that to finish, the current thread helps it by finishing the operation
    for it, advancing the tail pointer (step B). It repeats this check in case another
    thread has started inserting a new element, advancing the tail pointer until it
    finds the queue in the quiescent state so it can begin its own insertion.


    The CAS at step C, which links the new node at the tail of the queue, could fail
    if two threads try to insert an element at the same time. In case no harm is done:
    no changes have been made, and the current thread can reload the tail pointer
    and try again. Once C succeeds, the insertion is considered to have taken effect;
    the second CAS (step D) is considered "cleanup", since it can be performed either
    by the inserting thread or by any other thread. If D fails, the inserting thread
    returns without retrying the CAS, because no retry is needed - another thread
    has already finished the job in its step B! This works before any tries tries
    to link a new node into the queue, the current thread checks to see if the queue
    needs cleaning up by checking if tail.next is non-null. If it is, it advances
    the tail pointer first (perhaps multiple times) until the queue is in the quiescent
    state.'
