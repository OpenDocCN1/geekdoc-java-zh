    \ published that, because any code can iterate the set and obtain a reference\
    \ to the new secret. Similarly, returning a reference from a non-private method\
    \ also publishes the returned object. UnsafeStates in Listing 3.6 publishes the\
    \ supplied mutable state of array of abbreviations.\n\n# Listing 3.6. Allowing\
    \ Internal Mutable State to Escape. Don't do this.\n\n![](img/c64daf12e0d6c877213813fc53c890a4_43_0.png)\n\
    \n```\nclass UnsafeStates {\n    private String[] states = new String[]{\n   \
    \     \"AK\", \"AL ...\"\n    };\n        public String[] getStates() { return\
    \ states; }\n}\n```\n\nPublishing in this way is problematic because any caller\
    \ can modify its contents. In this case, the states array has escaped its intended\
    \ scope, because what was supposed to be private state has has been made public.\n\
    \nPublishing an object also publishes any objects referred to by its non-private\
    \ fields. More generally, any object that is reachable from a published object\
    \ by following some chain of non-private references and method calls can also\
    \ be published.\n\nFrom the perspective of a class C, an alien method is one whose\
    \ behavior is not fully specified by C. This includes methods in other classes\
    \ as well as overridable methods (neither private nor final) in C. Passing an\
    \ object to an alien method means you don't know what code will actually be invoked,\
    \ thus publishing a reference to it that might later be used from another thread.\n\
    \nWhether another thread does something with the published reference doesn't really\
    \ matter, because the risk of misuse is still present. Once an object escapes,\
    \ you have to assume that another class or thread may, maliciously or carelessly,\
    \ misuse it. This is a compelling reason to use encapsulation: it makes it practical\
    \ to analyze programs for correctness and rarely violate design constraints accidentally.\n\
    \n> [7] If someone steals your password and posts it on the all-free newsgroup,\
    \ that information has escaped: whether or not someone has (yet) used those credentials\
    \ to create your account, that has still been compromised. Publishing a reference\
    \ poses the same sort of risk.\n\nA final mechanism by which an object or its\
    \ internal state is published is to publish an inner class instance, as shown\
    \ in ThisEscape in Listing 3.7. When ThisEscape publishes the Event, it implicitly\
    \ publishes the enclosing ThisEscape instance as well, because inner class instances\
    \ contain a hidden reference to the enclosing instance."
