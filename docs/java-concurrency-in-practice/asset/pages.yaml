  md: "[6] Timer has support for scheduling based on absolute, not relative time,\
    \ so that tasks can be sensitive to changes in the system clock;\nScheduledThreadPoolExecutor\
    \ supports relative time.\n\nA Timer creates a single thread for executing timer\
    \ tasks. If a timer task takes too long, the timing accuracy\nof OtherTasks can\
    \ suffer. If a recurring Timer is scheduled to run every 10 ms and another Timer-Task\n\
    40 ms to run, the second task (depending on whether it is scheduled at fixed rate\
    \ or relative delay) gets four times in rapid succession after the long-running\
    \ task completes, or \"misses\" four invocations. Scheduled\nthread pool addresses\
    \ this limitation by using multiple threads for executing delayed and periodic\
    \ tasks.\n\nAnother problem with Timer is that it behaves poorly if a TimerTask\
    \ throws an unchecked exception. The thread\ndoes't catch the exception, so an\
    \ unexpected exception from a TimerTask terminates the thread. Timer\ndoes doesn't\
    \ restore the thread in this situation; it erroneously assumes the Timer was cancelled.\
    \ In this case,\nTimerTasks that are scheduled but never executed remain never,\
    \ and now cannot be scheduled. This problem, called \"thread leakage\" is described\
    \ in Section 7.3, with techniques for avoiding it.\n\nOutOfTime Figure 6.9 shows\
    \ how a Timer can become confused in this manner, and as causes confusion lovely,\n\
    hhow the Timer shares its confusion with the next caller that tries to submit\
    \ a TimerTask. You might expect the\nprogram to run for six seconds, but what\
    \ actually happens is that it terminates after one second with an\nIllegalStateexception\
    \ message text is \"Timer already cancelled\". ScheduledExecutor deals\npoorly\
    \ with ill-behaved tasks; there is little reason to use Timer in Java 5.0 or later.\n\
    \nIf you need your scheduling service, you may be able to take advantage of the\
    \ library by using a\nDelayQueue blocking implementation that provides the scheduling\
    \ functionality of\nScheduledThreadPoolExecutor manages a collection of delayed\
    \ objects. A has delay\nassociated with it; DelayQueue takes you an element only\
    \ if its delay has expired. Objects are returned from a\nDelayQueue by the time\
    \ associated with them.\n\n# 6.3. Finding Exploitable Parallelism\n\nThe Executor\
    \ framework makes it easy to specify an execution policy, but in order to use\
    \ an Executor, you have to\ndescribe your task as a runnable. In many server applications,\
    \ there is an obvious boundary task: a single client\nrequest. But some boundaries\
    \ are not quite obvious, as in many desktop applications. There are also\nexploitable\
    \ parallelism within a single client request in server applications, as is sometimes\
    \ the case in database\nservers. (For a further discussion of the competing design\
    \ forces in choosing task boundaries, [CPJ 4.4.1.1])\n\nListing 6.9. Class Illustrating\
    \ Confusion Timer Behavior.\n\n```\npublic class OutOfTime {\n    public static\
    \ void main(String[] args) throws Exception {\n        Timer timer = new Timer();\n\
    \        timer.schedule(new TimerTask(), 0);\n        SECONDS.sleep(1);\n    \
    \    timer.schedule(new TimerTask(), 0);\n        SECONDS.sleep(5);\n    }\n //\
    \ Note: SECONDS.sleep(5);\n    }\n\n    static class TimerTask extends TimerTask\
    \ {\n        public void run() throws new RuntimeException();\n    }\n}\n```\n\
    \n![](img/c64daf12e0d6c877213813fc53c890a4_94_0.png)\n\nIn this section we develop\
    \ several versions of a component that admits varying degrees of concurrency.\
    \ Our sample\ncomponent is the page-rendering portion of a browser application,\
    \ which takes a page of HTML and renders it into an\nimage buffer. To keep it\
    \ simple, we assume that the HTML consists only of marked text interspersed with\
    \ image\nelements with pre-specified dimensions and URLs.\n\n# 6.3.1. Example:\
    \ Page Renderer\n\nThe simplest approach is to process the HTML sequentially.\
    \ As text markup is encountered, render it into the\nimage buffer; as image references\
    \ are encountered, fetch the image over the network and draw it into the image\
    \ buffer\nas well. This is easy to implement and requires fetching each element\
    \ of the input only once (it doesn't even require\nbuffering the document), but\
    \ is likely to annoy the user, who may have to wait a long time before all the\
    \ text is\nrendered."
