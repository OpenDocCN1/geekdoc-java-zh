  md: "# 7BPart IV: Advanced Topics - 26BChapter14 - Building Count Synchronizers\n\
    \nAcquisition and release in AQS takes the form in Listing 14.13. Depending on\
    \ the synchronizer, acquisition might be exclusive, as with ReentrantLock, or\
    \ nonexclusive, as with Semaphore and countdown. An acquisition has two parts.\
    \ The synchronizer decides whether current state permits acquisition; if so, the\
    \ thread is allowed to proceed, and if not the acquisition blocks or fails. This\
    \ decision is determined by the synchronizer semantics; for example, a acquisition\
    \ can succeed if the latch is held, and unacquiring a latch can succeed if the\
    \ latch is in its terminal state.\n\nThe second part involves possibly updating\
    \ the synchronizer state; one whether other threads can acquire it. For example,\
    \ a latch changes the latch state from \"unheld\" to \"held\", and the acquisition\
    \ of a latch by one thread does not affect whether other threads can acquire it,\
    \ so acquiring a latch does not change its state.\n\nListing 14.13. Canonical\
    \ Forms for Acquisition and Release in AQS.\n\n```\nboolean acquire() throws Exception\
    \ {\n    while (doesNot acquire()) {\n        IF (acquisition requested) {\n \
    \           current thread not already queued\n            block thread\n    \
    \    } else\n            return failure\n    }\n    possibly update synchronization\
    \ state\ndequeue thread if it was queued\n    return success\n}\n\nvoid release()\
    \ {\n    update synchronization state\n    IF (new state may permit a thread to\
    \ acquire)\n    unlock one or more queued threads\n}\n```\n\nA synchronizer supporting\
    \ exclusive acquisition should implement the protected methods TryAcquire, TryRelease,\
    \ and isExclusive(), and those supporting shared acquisition should implement\
    \ tryAcquireShared and tryReleaseShared. The acquire, acquireRelease, and releaseShared\
    \ methods in AQS take the form of these methods in the synchronizer subclass to\
    \ determine if the operation can proceed. The synchronizer subclass can use getState,\
    \ setState, and compareAndSetState to examine and update the state according to\
    \ its acquire and release semantics, and informs the base class For example, returning\
    \ a negative value from TryAcquire indicates acquisition was successful. returning\
    \ zero indicates the synchronizer was acquired exclusively; and returning a positive\
    \ value indicates the release may have unblocked threads attempting to acquire\
    \ the synchronizer.\n\nTo simplify implementation of locks that support acquisition\
    \ queues (like ReentrantLock), AQS provides machinery for constructing condition\
    \ variables with synchronizers.\n\n# 14.5.1. A Simple Latch\n\nOneLatch in Listing\
    \ 14.14 is a binary latch implemented using AQS. It has two public methods, await\
    \ and signal, that correspond to acquisition and release. Initially, the latch\
    \ is closed; any thread calling await blocks until the latch is opened. Once the\
    \ latch is opened by a call to signal, waiting threads are released and threads\
    \ that subsequently arrive at the latch will be allowed to proceed."
