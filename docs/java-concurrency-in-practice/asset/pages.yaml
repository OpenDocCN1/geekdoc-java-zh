  md: "# 7BPart IV: Advanced Topics - 26BChapter14 - Building Synchronizers\n\nChoose\
    \ using explicit conditions and intrinsic queues in the same way as you would\
    \ choose between ReentrantLock and synchronized: condition if you use its advanced\
    \ features such as fair queuing or multiple wait sets per lock, and otherwise\
    \ prefer intrinsic condition (If you already used ReentrantLock because you need\
    \ your advanced features, the choice is already made).\n\n#  14.4. Anatomy of\
    \ a Synchronizer\n\nThe interfaces of ReentrantLock and synchronized have a lot\
    \ in common. Both class as a \"gate\", allowing only a limited number of threads\
    \ to pass at a time; threads arrive at the gate and are allowed through (lock\
    \ or acquire blocks returns successfully), or are turned away (tryLock or acquire\
    \ false, indicating that the lock or permit did not become available in the time).\
    \ Furthermore, both allow interruptible, uninterruptible, and timed acquisition\
    \ attempts, and both allow a choice of fair or nonfair queuing of threads.\n\n\
    Given this commonly, you might think that semaphore was implemented on ReentrantLock,\
    \ or ReentrantLock was implemented as a semaphore with one. This would be practical;\
    \ it is a common exercise to prove that a counting semaphore can be implemented\
    \ using a lock (as in Semaphore in Listing 14.12) and that a lock can be implemented\
    \ using a counting semaphore.\n\nIn actually, both are implemented using a common\
    \ base class, AbstractQueuedSynchronizer(AQS) as many other synchronizers. AQS\
    \ is a framework for both locks and synchronizers, and a surprisingly broad range\
    \ of synchronizers can be built easily and efficiently using it. Not only are\
    \ ReentrantLock and Semaphore built using AQS, but both are countable, ReentrantReadLock,\
    \ SynchronousQueue, and FutureTask.\n\n12 replaces the AQS-based QueuedQueue (a\
    \ more scalable) non-blocking version.\n\nListing 14.11. Bounded Buffer Using\
    \ Exception Conditions.\n\n```\n@ThreadSafe\npublic class BoundedBuffer<T> {\n\
    \    private Lock lock = new ReentrantLock();\n    // CONDITION PREDICATE: notFull(count\
    \ < items.length)\n    private final Condition notFull = lock.condition();\n \
    \   // CONDITION PREDICATE: notEmpty(count > 0)\n    private final Condition notEmpty\
    \ = lock.condition();\n    @GuardedBy(\"lock\")\n    private final T[] items =\
    \ (T[]) new Object[BUFFER_SIZE];\n    @GuardedBy(\"lock\")\n\n    // BLOCKS-UNTIL:\
    \ notFull\n    public void put(T item) throws InterruptedException {\n       \
    \ lock.lock();\n        try {\n            while (count == items.length) {\n \
    \               notFull.await();\n            }\n            items[tail] = item;\n\
    \            tail = (tail + 1) % items.length;\n            count++;\n       \
    \     notEmpty.signal();\n        } finally {\n            lock.unlock();\n  \
    \      }\n    }\n\n    // BLOCKS-UNTIL: notEmpty\n    public T take() throws InterruptedException\
    \ {\n        lock.lock();\n        try {\n            while (count == 0) {\n \
    \               notEmpty.await();\n            }\n            T item = items[head];\n\
    \            items[head] = null;\n            head = (head + 1) % items.length;\n\
    \            count--;\n            notFull.signal();\n            return item;\n\
    \        } finally {\n            lock.unlock();\n        }\n    }\n}\n```"
