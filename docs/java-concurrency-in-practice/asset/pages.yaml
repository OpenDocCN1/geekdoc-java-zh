  md: 'When using condition waits (object.wait or Condition.await):


    +   - Always have a condition predicate test of object state that must hold before
    proceeding;

    - Always test the condition predicate before calling wait, and again after returning
    from wait;

    - Always call wait in a loop;

    - Ensure that the state variables making up the condition predicate are guarded
    by the lock associated with the condition queue;

    - Hold the lock associated with the condition queue when wait, notify, or notifyAll;

    - Do not release the lock after checking the condition predicate before acting
    on it.


    # 14.2.3. Missed Signals


    Chapter 10 discusses issues such as deadlock and livestream. Another possible
    failure is missed signals. A missed signal occurs when a thread waits for a specific
    condition that is already true, but fails to check the condition predicate before
    waiting. Now the thread waits to be notified of an event that has already occurred.
    This is like starting to go out to news, the bell ringing while you are outside,
    and then sitting down at the kitchen table waiting for the toast. You could wait
    indefinitely. Unlike the marmalade for wait, notification is not "sticky" if A
    notifies on a condition queue and thread B waits on that same condition, B does
    not awaken unless notification is required to wake B. Missed signals are the result
    of coding errors like those warned in the list above, such as failing to test
    the condition predicate before waiting. If your structure condition waits as in
    Listing 14.7, you will not have problems with missed signals.


    > [10] In error for this wait, someone else would have to toast, but this will
    just make waters worse; when the bell rings, you have then a agreement about toast
    ownership.


    # 14.2.4. Notification


    So we''ve discussed half of what goes in a condition wait: the other half is notification.
    In a bounded buffer, takes blocks when the buffer is full. In order to unlock
    wait when the buffer becomes nonempty, we must ensure every code path in the buffer
    could become nonempty a notification. In boundedbuffer, there is only one placeafter
    a put. Put calls notifyAll after successfully adding an object to the buffer.
    Likewise, calls notifyAll after removing an element to indicate that the buffer
    may no longer be full, in any cases where there are the "full" condition.


    Whenever you wait on a condition, make sure that someone performs a notification
    before the condition predicate becomes true.


    There are two notifications in the condition queue notify() and notifyAll(). To
    call either, you must hold the lock associated with the condition queue. Calling
    notify() causes the JVM to select one waiting on the condition queue to wake up;
    notifyAll() wakes all the threads waiting on that condition queue. Because you
    must hold the lock on the condition queue when calling notify() or notifyAll,
    and waiting threads cannot wait without requiring the lock, the notify should
    release the lock to ensure that the waiting threads are unlocked as soon as possible.


    Multiple threads could be waiting on the same condition queue for different condition
    predicates, using notify instead of notifyAll can be dangerous, primarily because
    single notification is a problem akin to missed signals.


    Boundedbuffer provides a good illustration of why notifyAll should be preferred
    to single notification in most cases. The condition queue is used for two conditions:
    "not full" and "not empty". Suppose A waits on a condition queue for predicate
    PA, B waits on the same condition queue for predicate PB. Now, suppose B performs
    a single signal; the JVM will wake up one of its choosing. If A is chosen, it
    will wake up, see that PA is not yet true, and go back to waiting. Meanwhile,
    B, could make progress, which does not wait yet. This is not exactly a missed
    signal''s of a "hijacked signal" but the problem is that a thread is waiting for
    a signal that (or should have) already occurred.


    Single notify can be used instead of notifyAll only when one of the following
    conditions holds:


    +   - Uniform waiters. Only one condition predicate is associated with the condition
    queue, and each thread executes the same logic only returning from wait;

    - One-in, one-out. A notification on the condition variable enables at most one
    thread to proceed.'
