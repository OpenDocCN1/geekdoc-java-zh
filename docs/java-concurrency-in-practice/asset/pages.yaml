    exclusively. For read-only data structures, readlock can offer greater concurrency
    than exclusive locking; for read-only data structures, immutability can eliminate
    the need for locking.


    Atomic variables (see Chapter 15) offer a mean of reducing the cost of updating
    "hot fields" such as counters, sequence generators, or the reference to a node
    in a linked data structure. We used Atomic to maintain the hit counter in the
    servlet examples in Chapter 2. The atomic variable class provides fine-grained
    (and therefore more scalable) atomic operations on objects or references, and
    is implemented using low-concurrency primitives (such as compare-and-swap) provided
    by most modern processors. If your class has a small number of hot fields that
    do not participate in atomic variables, changing your algorithm to have fewer
    hot fields may improve scalability - yet atomic variables reduce the cost of updating
    hot fields, but they don''t eliminate it.


    # 11.4.6. Monitoring CPU Utilization


    When testing for scalability, the goal is usually to keep the processors fully
    utilized. You can use vstat and mstat on Unix systems or perf on Windows systems
    to tell you how "hot" the processors are running.


    If the CPUs are asymmetrically utilized (some CPUs running hot but not others)
    your first goal should be to find increased parallelism in your program. Symmetric
    utilization indicates that the computation is going on a small set of threads,
    and your utilization will not be able to take advantage of additional processors.


    If the CPUs are not fully utilized, you need to figure out why. There are several
    likely causes:


    Insufficient load. It may be that the application being tested is not subjected
    to enough load. You can test this by increasing the load and measuring changes
    in, utilization, response time, or service time. Generating enough load to saturate
    an application requires substantial power; the problem may be the client systems,
    the system itself being tested, or network.


    I/O-bound. You can determine whether an application is disk-bound using iostat
    or perf, and whether it is bandwidth-limited by network.


    Extern bound. If your application depends on external services such as a database
    or web server, the bottleneck may not be in your code. You can test this by using
    a profiler or database administration tools to determine how much time is spent
    waiting for answers from the external service.


    # 11.4.7. Say No to Object Polling


    In early JVM, object allocation and garbage collection were slow,[13] but their
    performance has improved substantially since. Then, allocation in Java is now
    fast[14] in C: the common code path for new objects in HotSpot 1.4.x and 5 is
    approximately ten instructions.


    [13] As was everything else - synchronization, graphics, JVM reflection - predictably
    possibly in the first version of an experimental technique.

    To work around -soft- object life cycles, many developers turned to object pooling,
    where objects are recycled instead of being garbage collected and allocated anew
    when. Even taking into account its reduced garbage overhead, object pooling has
    been shown to be a performance loss[14] for all but the most expensive objects
    (and a serious loss for light- and medium-weight objects) in single-threaded threads
    (Click, 2005).'
