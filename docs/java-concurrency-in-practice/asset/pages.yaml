  md: "# Java Concurrency In Practice\n\n# Listing 12.8. Thread Factory for Testing\
    \ ThreadPoolExecutor.\n\n```\nclass TestingThreadFactory implements ThreadFactory\
    \ {\n    public final AtomicInteger numCreated = new AtomicInteger();\n    private\
    \ final ThreadFactory factory = Executors.defaultThreadFactory();\n\n    public\
    \ Thread newThread(Runnable r) {\n        numCreated.incrementAndGet();\n    \
    \    return factory.newThread(r);\n    }\n}\n```\n\nIf the core pool size is smaller\
    \ than the maximum size, the thread pool should grow as demand for execution increases.\
    \ Submitting long-running tasks to the pool makes the number of tasks staying\
    \ long enough to make them more reliable. With few assertions, such as testing\
    \ that the pool is expanded, as shown in Listing 12.9.\n\n# Listing 12.9. Test\
    \ Method to Verify Pool Expansion.\n\n```\npublic void testPoolExpansion() throws\
    \ InterruptedException {\n    int MAX_SIZE = 10;\n    ExecutorService service\
    \ = Executors.newFixedThreadPool(MAX_SIZE);\n\n    for (int i = 0; i < MAX_SIZE;\
    \ i++) {\n        service.execute(new Runnable() {\n            try {\n      \
    \          Thread.sleep(MAX_VALUE);\n            } catch (InterruptedException\
    \ e) {\n                Thread.currentThread().interrupt();\n            }\n \
    \       });\n    }\n    for (int i = 0; i < 20 && threadFactory.numCreated.get()\
    \ < MAX_SIZE) {\n        Thread.sleep(100);\n        assertEquals(threadFactory.numCreated.get(),\
    \ MAX_SIZE);\n    }\n    service.shutdownNow();\n}\n```\n\n# 12.6. Generating\
    \ More Interleavings\n\nSince many of the potential failures in concurrent code\
    \ are low-probability events, testing for concurrency errors is a numbers game,\
    \ but there are some things you can do to improve your chances. We've already\
    \ mentioned how running on multiprocessor systems with fewer processors than active\
    \ threads can generate more interleavings than a single-processor system or one\
    \ with many processors. Similarly, testing on a variety of systems with different\
    \ processor counts, operating systems, and processor architectures can disclose\
    \ problems that might not occur on all systems.\n\nA useful trick for increasing\
    \ the number of interleavings, and therefore more effectively exploring the state\
    \ space of your programs, is to use yield(). The effectiveness of this technique\
    \ is platform-specific; the JVM is free to treat yield() as a no-op [JS 17:9].\
    \ Using a short sleep would be better but less reliable. The method in Listing\
    \ 12.10 transfers from one account to another, between the two operations, invariants\
    \ such as \"sum of all accounts equals zero\" do not hold. By inserting a sleep\
    \ between the operations, you may make time-sensitive bugs occur in code that\
    \ does not use synchronization to access state. The inconvenience of adding these\
    \ calls is for testing and removing them for production by adding them using aspect-oriented\
    \ programming (AOP) tools.\n\n# 12.10. Using yield to Generate More Interleavings\n\
    \n```\npublic void transferCredits(Account from, Account to) {\n    int amount\
    \ = random.nextInt(100);\n    from.setBalance(from.getBalance() - amount);\n \
    \   if (random.nextInt() > THRESHOLD) {\n        yield();\n    }\n    to.setBalance(to.getBalance()\
    \ + amount);\n}\n```\n\n# 12.2. Testing for Performance\n\nPerformance tests are\
    \ extended versions of functionality testing. In fact, it is always worthwhile\
    \ to include some functionality testing within performance tests to ensure you\
    \ are not testing the performance of broken code."
