  md: "In tests that run until they complete a fixed number of operations, it is possible\
    \ the test case will fail if the code being tested encounters exception due to\
    \ a bug. The most common way to handle this is to have the test framework abort\
    \ that do not terminate within a certain amount of time; how long to wait should\
    \ be determined empirically, and failures must then be analyzed to ensure the\
    \ problem wasn't just that you didn't wait enough. (This problem is not to testing\
    \ concurrent classes; sequential tests will not distinguish between long-running\
    \ and infinite loops.)\n\n# 12.4. Testing Resource Management\n\nThe tests so\
    \ far have been concerned with a class's adherence to its specification - that\
    \ is it does what it is supposed to do, like leak resources. Any object that manages\
    \ or holds other objects should not continue to make references to objects longer\
    \ than necessary. Such leaks prevent collectors from reclaiming memory (threads,\
    \ file handles, sockets, database connections, or other resources) and can lead\
    \ to resource exhaustion and failure.\n\nResource management is especially important\
    \ for classes with bounded the entire reason for bounding a buffer is to prevent\
    \ failure due to resource exhaustion when producers get too ahead of consumers.\
    \ Bounding cases may overly productive producers to block rather than continue\
    \ to work what will consume and more memory or other resources.\n\n[5] is is to\
    \ force a garbage collection: System.gc only suggests to the JVM that this is\
    \ a good time to force a garbage collection. HotSpot can be instructed to ignore\
    \ System.gc calls with -XX:+DisableExplicitGC.\n\nThe test method inserts several\
    \ objects into a bounded buffer and removes them; memory usage at heap snapshot\
    \ #2 should be approximately the same as at snapshot #1. Not on the other hand,\
    \ if doExtract forgot to null the returned element (items[i]-null), the reported\
    \ memory usage at the snapshot would not be the same. (This is one of the times\
    \ where explicit null is necessary; most of the time, it is either not nor harmful\
    \ [EI Item 5]).\n\n# 12.5. Using Callbacks\n\nCallbacks to provided-code can be\
    \ helpful in constructing test cases; callbacks are often made at known points\
    \ in an object's lifecycle that are great opportunities to assert invariants.\
    \ For example, ThreadPoolExecutor makes calls to run the tasks and to the ThreadFactory.\n\
    \nList 12.7. Testing for Resource Leaks.class B { data = new double[100000];\n\
    \n```\nvoid testLeak() throws InterruptedException {\n    ByteBuffer buffer =\
    \ new BoundedBuffer<Big>(CAPACITY);\n    int heapSize1 = // snapshot #1;\n   \
    \ for (int i = 0; i < CAPACITY; i++) {\n        buffer.put(new Big(i));\n    }\n\
    \    for (int i = 0; i < CAPACITY; i++) {\n        buffer.take();\n    }\n   \
    \ int heapSize2 = // snapshot #2;\n    assertTrue(Math.abs(heapSize1-heapSize2)\
    \ < THRESHOLD);\n}\n```\n\nThe testing pool involves a number of elements of execution\
    \ policy: that additional threads are created when they are supposed to, but not\
    \ when not supposed to; that idle threads get reaped when they are supposed, etc.\
    \ Constructing a comprehensive test suite that covers all the possibilities is\
    \ a major effort, but many of them can be tested fairly independently.\n\nWe can\
    \ instrument thread creation by using a custom factory. ThreadFactory in 12.8\
    \ maintains a count of created threads; test cases can then verify the number\
    \ of threads created during a run. TestingFactory could be extended to use a custom\
    \ Thread that records when the thread terminates, so that test cases can verify\
    \ that threads are reaped with the execution policy."
