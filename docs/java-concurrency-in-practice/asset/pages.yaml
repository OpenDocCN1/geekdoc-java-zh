  md: 'Blocking queues also provide an offer method, which returns a failure if the
    item cannot be enclosed. This enables you to create more flexible policies for
    dealing with overload, such as shedding, serializing excess items and writing
    them to disk, reducing the number of producers, or throttling producers in some
    other manner.


    # Bounded queues are a powerful resource management tool for building applications:
    they make your program more robust to throttling activities that produce more
    than you can handle.


    While the producer-consumer pattern allows producer and consumer to be decoupled
    from each other, their behavior is still coupled directly through the work queue.
    It is tempting to keep the consumers always up, but not to place any bounds on
    the side of work queues; this is a prescription for refactoring your system under
    design by using blocking queues - it is much easier to retrofit later. Blocking
    queues make this possible for a number of situations, but if blocking queues don''t
    fit your needs, you can create other blocking data structures using semaphore
    (see Section 5.5.3).


    The class library contains several implementations of BlockingQueue. LinkedBlocking
    and ArrayBlocking are FIFO queues, linked to LinkedList and Array but with better
    performance than a synchronized queue. PriorityBlockingQueue is a priority-ordered
    queue, which is useful when you want to present elements in an other order than
    FIFO. Like just other sorted queues, PriorityBlockingQueue can compare elements
    to their natural order (if they implement comparable) or using a comparator.


    The last BlockingQueue implementation, SynchronousQueue, is not really a queue
    at all, in that it maintains no space for queued elements. It maintains a list
    of threads waiting to enqueue or dequeue an element. In the dish-washing analogy,
    this would be like having no dish rack, but instead handing the washed dishes
    to the next available dryer. While this might seem a strange way to implement
    a queue, it reduces the latency with moving data from producer to consumer because
    the enqueue and dequeue operations must complete sequentially before a unit is
    handed off. The handoff also brings more information about the state of the task
    to the producer; when the handoff is accepted, it knows consumer has responsibility
    rather than simply putting it on a queue somewhere - much like the difference
    between handing a dish to a colleague and merely putting it in her mailbox so
    she gets it. Since a SynchronousQueue has no storage capacity, put() will block
    unless another thread is already waiting to participate in the handoff. Synchronous
    queues are generally suitable only when there are enough consumers that nearly
    one will always be ready to take the handoff.


    # 5.3.1. Example: Desktop Search


    One type of program that needs for decomposition into producers and consumers
    is an agent that scans for documents and indexes them for searching, similar to
    Google Desktop or the Windows search index. DiskCrawler in Listing 5.8 shows a
    producer task that searches a file hierarchy for an indexing criterion and puts
    their names on the work queue; Indexer in Listing 5.8 shows the consumer that
    takes file names from the queue and indexes them.


    The producer-consumer pattern offers a thread-friendly way of decomposing the
    desktop search problem into simpler components. Filing-crawler and indexing results
    in code that is more readable and reusable than a monolithic approach where the
    activity has only one task to do, and the blocking queue handles all the control,
    which is much simpler and cleaner.


    The producer-consumer pattern also enables several performance benefits. Producers
    and consumers can execute concurrently; if one is I/O-bound and the other is CPU-bound,
    executing them concurrently yields better throughput than executing them sequentially.
    The producer and consumer activities are parallelizable to different degrees,
    coupling parallelism to that of the parallelizable activity.


    Listing 5.9 shows several crawlers and indexers, each in their own thread. As
    written, the consumers never exit; we will examine several examples for addressing
    this problem in Chapter 7. While this example uses explicitly managed threads,
    many producer-consumer designs can be expressed using the Executor task framework,
    which itself uses the producer-consumer pattern.


