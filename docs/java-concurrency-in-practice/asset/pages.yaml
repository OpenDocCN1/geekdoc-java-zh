    # 15.2. Hardware Support for Concurrency


    Exclusive locking is a pessimistic technique - it assumes the worst (if you don''t
    lock your door, gremlins will come in and rearrange your stuff) and doesn''t proceed
    until you guarantee, by acquiring the appropriate locks, that others will not
    interfere.


    For fine-grained operations, there is an alternate approach that is often more
    efficient - the optimistic approach, whereby you proceed with an update, hoping
    that you can complete it without interference. This approach relies on collision
    detection to determine if there was interference from other parties during the
    update, in which the operation fails and can be retired (or not). The optimistic
    approach is like the old saying, "It is easier to earn forgiveness than permission,"
    which "easier" means "more efficient."


    Processors designed for multiprocessor operation provide special instructions
    for managing access to shared variables. Early processors had atomic test-and-set,
    fetch-and-increment, or swap instructions for implementing mutexes could be used
    in order to manage concurrent objects. Today, every modern processor has some
    form of atomic read-modify-write instruction, such as compare-and-swap or linked/store-conditional.
    Operating systems and JVMs use these instructions to implement locks and concurrent
    data structures, until Java 5.0 they had not been available to Java classes.


    # 15.2.1. Compare and Swap


    The approach taken by most processor architectures, IA32 and Sparc, is to implement
    a compare-and-swap (CAS) instruction. (Other processors, such as PowerPC, implement
    the same functionality with a pair of instructions: loadlinked/storeconditional.)
    CAS has three operands - a memory location V on which operate, the expected value
    A, and the new value B. CAS atomically updates V to the new value B, if the value
    in V matches the expected value A; otherwise it does nothing. In either case,
    it returns the value currently in V. (The variant compare-and-set returns nothing.)
    CAS means "I V should have the value A; if it does P, then value B." CAS is an
    optimistic technique - it proceeds with the update in hope of success, and can
    detect if another thread has updated the variable since it was last examined.
    Simulated CAS in Listing 15.1 illustrates the mechanics (but not the implementation
    or performance) of CAS.


    When multiple threads attempt to update the same variable using CAS, one wins
    and updates the variable''s value, and the rest lose. The losers are not punished
    by suspension, as they could be if they failed to acquire a lock; instead, they
    are told they didn''t win the race but can try again. Because a thread that loses
    a CAS is not blocked, it can decide whether it wants to try again, take some other
    recovery action, or do nothing. This flexibility eliminates many of the hazards
    associated with locking (though in unusual cases can introduce the risk of livelock
    - see Section 10.3.3).


    > [3] Doing nothing may be a perfectly sensible response to a failed CAS; in some
    non-blocking algorithms, such as the linked queue algorithm in Section 15.4.2,
    a CAS means that someone else already did the work you were planning to do.'
