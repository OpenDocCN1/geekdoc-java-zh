  md: '# 12.3. Avoiding Testing Pitfalls


    In theory, developing performance tests is easyfind a typical usage scenario,
    write a program that executes that scenario

    times many, and in practice, you have to watch out for a number of coding pitfalls
    that prevent performance

    yield meaningful results.


    # 12.3.1. Garbage Collection


    The timing of garbage collection is unpredictable, so there is always the possibility
    that the garbage collector will

    run during a measured test. If a program performs iterations and triggers no garbage
    collection then Iteration N

    would trigger a garbage collection, a small variation in the size of the run could
    have a big (but spurious) effect on

    the measured time.


    There are two strategies for preventing garbage collection from biasing your results.
    One is to ensure that garbage

    collection does not run all during your test (you can invoke the JVM with -verbose:gc
    to output); alternatively, you

    an make sure that the garbage collector runs many times during your run so that
    the test program adequately

    reflects the cost of ongoing allocation and garbage collection. The latter strategy
    is often better a longer test\and is more likely to reflect real-world performance.


    Most-producer allocations involve a amount of allocation and garbage collection
    producers allocate new

    objects that are used and discarded by consumers. Running the bounded buffer test
    for long enough to incur multiple

    gebage collections yields more accurate results.


    # 12.3.2. Dynamic Compilation


    Writing and interpreting benchmarks for dynamically compiled languages like Java
    is far more difficult than

    st statically compiled languages like C or C++. The Hot JVM (and other modern
    JVMs) use a combination of

    bytecode interpretation and dynamic compilation. When a class is loaded, the JVM
    executes it by interpreting the

    bytecode. At some point, if a method is run often, the dynamic compiler kicks
    in and converts it to machine

    code; when compilation completes, it switches from interpretation to direct execution.


    The timing of compilation is unpredictable. Your timing tests run only after all
    code has been compiled; there

    no value in measuring the speed of interpreted code since most programs run long
    enough that all executed

    paths are compiled. Allowing the compiler to run during a measured test can bias
    results in twoways: compilation consumes CPU resources, and measuring the run
    of a combination of interpreted and compiled

    code is not a meaningful performance metric. Figure 12.5 shows how this can bias
    your results. The timelines

    represent the execution of the same number of iterations: timeline A represents
    interpreted execution, B represents

    compilation halfway through the run, and C represents compilation early in the
    run. The point at which compilation

    sيريا affects the measured performance runtime.


    > [7] The JVM may choose to perform compilation in the application thread or in
    the background thread; each can bias timing results in different

    ways.


    Figure 12.5. Biased by Dynamic Compilation.


    ![](img/c64daf12e0d6c877213813fc53c890a4_181_0.png)


    Code may also be deoptimized (reverting to interpreted execution) and for various
    reasons, such as loading a

    class that invalidates assumptions made by prior compilations, or gathering sufficient
    profiling data to decide that a

    code path should be recompiled with different optimizations.


    One way to prevent compilation from biasing your results is to run your program
    for a long time (at least several

    minutes) so that compilation and interpreted execution represent a small fraction
    of the total run time. Another

    approach is to use an unmeasured "warm-up" run, in which your code is executed
    to be fully compiled when'
