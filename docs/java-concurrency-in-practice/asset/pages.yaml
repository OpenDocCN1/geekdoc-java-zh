  md: "# 56 Java Concurrency In Practice\n\n```\nListing 5.7 ConcurrentMap interface\n\
    public interface ConcurrentMap<K,V> extends Map<K,V> {\n    // insert putAbsent\
    \ if no value is mapped from K\n    V putAbsent(K key, V value);\n    // remove\
    \ only if K is mapped to V\n    boolean remove(K key, V value);\n    // Replace\
    \ value only if K is mapped to oldvalue\n    boolean replace(K key, V oldValue,\
    \ V newValue);\n    // Replace value only if K is mapped to some value\n    V\
    \ replace(K key, V newValue);\n}\n```\n\nObviously, there is some cost to copying\
    \ the backing array every time the collection is modified, especially if the collection\
    \ is large; the copy-on-write collections are reasonable only when iteration is\
    \ far more common than modification. This criterion describes many event-notification\
    \ systems: delivering a notification requires the list of registered listeners\
    \ and calling each of them, and in most cases registering or unregistering an\
    \ listener is faster than receiving an event (see CP 2.4) for more information\
    \ on copy-on-write.\n\n# 5.3. Blocking Queues and the Producer-consumer Pattern\n\
    \nBlocking queues provide put and take methods as well as timed equivalents and\
    \ poll. If the queue is full, put blocks until space becomes available; Queues\
    \ can be bounded or unbounded; unbounded queues are never full, so a put on an\
    \ unbounded queue never blocks.\n\nBlocking queues support the producer-consumer\
    \ design. A producer-consumer design separates the identification of work to be\
    \ done from the execution of that work by placing items on a \"do list\" for later,\
    \ rather than processing them immediately as they are identified. The producer-consumer\
    \ pattern simplifies development because it removes code dependencies between\
    \ producer and consumer, and simplifies workload by decoupling activity that produce\
    \ or consume data at different rates.\n\nIn a producer-consumer design built around\
    \ a blocking queue, producers place data items on the queue as they become available,\
    \ and consumers retrieve data from the queue when they are ready to take the action\
    \ producers. Producers don't need to know anything about the identity of consumers,\
    \ or whether they are the producer - all they have to do is place data items on\
    \ the queue. Similarly, consumers need not to know who the producers are or where\
    \ the work came from. Blocking queue simplifies the implementation of producer-consumer\
    \ designs with any number of producers and consumers. One of the most common producer-consumer\
    \ designs is a thread pool with a work queue; this pattern is embedded in the\
    \ Executor task execution framework which is the subject of Chapters 6 and 7.\n\
    \nThe familiar division for two people washing the dishes is an example of a producer-consumer\
    \ design: one washes the dishes and places them in the dish rack, and the other\
    \ retrieves them from the rack and dries them. In this scenario, the dish rack\
    \ acts as a blocking queue; if there are no dishes in the rack, the consumers\
    \ wait until there are dishes, and if the rack fills up, the producer waits until\
    \ there is more space. This architecture extends to many producers (there may\
    \ be contention for the lock) and multiple consumers; no one needs to know how\
    \ many producers or consumers are, or who produced a given item of work.\n\nThe\
    \ labels \"producer\" and \"consumer\" are relative; an activity that acts as\
    \ a consumer in one context may be a producer in another. The person who \"consumes\"\
    \ clean dishes and \"produces\" dry dishes. A third person might want to help\
    \ dry the dishes, in which case the dish rack becomes both a producer and a consumer,\
    \ and two shared work queues (each of which may block the producer depending).\n\
    \nBlocking queues simplify the coding of consumers, as they block until data is\
    \ available. If the producers don't generate fast work to keep the consumers busy,\
    \ the consumers just wait until more work is available. Sometimes this is perfectly\
    \ acceptable (as in a server application when no client is requesting), and it\
    \ indicates that the ratio of producers to consumers should be adjusted to achieve\
    \ better utilization (as in a web crawler or other application in which there\
    \ is effectively work to do).\n\nIf producers consistently generate work faster\
    \ than the consumers can process it, eventually the application will run out of\
    \ memory. Again, the blocking nature of queues purely simplifies coding; if we\
    \ use a bounded queue, then when the queue fills up the producers block, giving\
    \ the consumers time to catch up as a blocked producer cannot generate more work."
