  md: "# 2.1. Power of Synchronized Factorizer.\n\n![](img/c64daf12e0d6c877213813fc53c890a4_37_0.png)\n\
    \nCachedFactorizer in Listing 2.8 restricts the use to two separate synchronized\
    \ blocks, each limited to a short section of code. One guards the check-then-act\
    \ sequence that tests whether we just return the cached result, and the other\
    \ guards updating the counter and the cached factors. As a bonus, we reintroduced\
    \ the counter and a \"cache hit\" counter as well, updating them within the synchronized\
    \ block. Because these parts of the code constitute shared mutable state, we must\
    \ use synchronization everywhere they are accessed. The synchronized blocks operate\
    \ exclusively on local (stack-based) variables, which are not shared across threads\
    \ and do not require synchronization.\n\n# Listing 2.8. Safe that Caches its Request\
    \ and Result.\n\n```\n@ThreadsSafe\npublic class CachedFactorizer implements Server\
    \ {\n    @GuardedBy(\"this\") private Integer lastNumber;\n    @GuardedBy(\"this\"\
    ) private Integer[] lastFactors;\n    @GuardedBy(\"this\") private long hits;\n\
    \    @GuardedBy(\"this\") private long cacheHits;\n\n    public long getHits()\
    \ { return hits; }\n    public synchronized double getHitRatio() {\n        return\
    \ (double) cacheHits / hits;\n    }\n\n    public synchronized void serveRequest(Request\
    \ req, ServerResponse res) {\n        Integer i = extractFrom(req);\n        Integer[]\
    \ factors = null;\n        synchronized (this) {\n            hits++;\n      \
    \      if (i.equals(lastNumber)) {\n                cacheHits++;\n           \
    \     factors = lastFactors.clone();\n            }\n            if (factors ==\
    \ null) {\n                factors = factor(i);\n                synchronized\
    \ (this) {\n                    lastNumber = i;\n                    lastFactors\
    \ = factors.clone();\n                }\n            }\n        }\n        encodeResponse(res,\
    \ factors);\n    }\n}\n```\n\nCachedFactorizer now uses AtomicLong for the hit\
    \ counter, reverting to using a long field. It is safe to use AtomicLong here,\
    \ but there is less benefit than there in CountingFactorizer. Atomic variables\
    \ are useful for performing atomic operations on a single variable, but since\
    \ we are already using synchronized blocks to construct atomic operations, two\
    \ different synchronization mechanisms would be confusing and offer no performance\
    \ or safety benefit.\n\nThe restructuring of CachedFactorizer provides a balance\
    \ between simplicity (synchronizing the entire method) and concurrency; releasing\
    \ a lock has some overhead, so it is undesirable to break down synchronized blocks\
    \ too far (as factoring++ into its own synchronized block), even if this would\
    \ not compromise atomicity. CachedFactorizer holds the lock when accessing state\
    \ variables and for the duration of compound actions, but releases it before the\
    \ potentially long-running factorization operation."
