    \ (Static synchronized methods use the Class object of the lock).\n\n```\nsynchronized\
    \ (lock) {\n    // Access or modify shared state guarded by lock\n```\n\nEvery\
    \ Java object can implicitly act as a lock for purposes of synchronization; these\
    \ built-in locks are called intrinsic locks or monitor locks. The lock is automatically\
    \ acquired by the synchronized block before entering the synchronized block and\
    \ automatically released when control exits the block by the normal path or by\
    \ throwing an exception of the block. The only way to acquire an intrinsic lock\
    \ is to enter a synchronized block or method guarded by that lock.\n\nIntrinsic\
    \ locks in Java act as mutexes (mutual exclusion locks), which means that only\
    \ one thread may own the lock. When thread A attempts to acquire a lock held by\
    \ thread B, A must wait, or until B releases the lock. If B never releases the\
    \ lock, A waits forever."
