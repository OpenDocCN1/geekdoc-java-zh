  md: '# Java Concurrency in Practice


    # 1.1. A (Very) Brief History of Concurrency


    In the ancient past, computers did not have operating systems; they executed a
    single program from beginning to end, and that program had direct access to all
    the resources of the machine. Not only was it difficult to write programs that
    run on the bare metal, but running only one program at a time was an inefficient
    use of expensive and scarce computer resources.


    Operating systems evolved to have more than one program to run at once, running
    individual programs in processes: isolated, independently executing programs which
    the operating system allocates resources such as memory, file handles, and credentials.
    If needed to, processes could communicate with one another through a variety of
    coarse-grained communication mechanisms: sockets, shared handlers, shared memory,
    semaphores, and files.


    Several factors led to the development of operating systems that allowed multiple
    programs to execute simultaneously:


    Resource utilization. Programs sometimes had to wait for external operations such
    as input or output, and while waiting can do no useful work. It is more efficient
    to wait time to let another program


    Fairness. Multiple users and programs may have equal claims on the machine''s
    resources. It is preferable to let them share the machine via finer-grained slicing
    time than to let one program run and then start another.


    Convenience. It is either easier or more desirable to write several programs that
    perform a single task and have them coordinate with each other as necessary than
    to write a single program that performs all the tasks.


    In early times systems, each process was a virtual von Neumann computer; it had
    memory space storing instructions and data, executing instructions according to
    the semantics of the machine language, and interacting with the outside world
    via the operating system through a set of I/O primitives. For each instruction
    executed there was clearly defined "next", and control flowed through the program
    according to the rules of the instruction set. Nearly all widely used programming
    languages today define "what comes next after an action is executed. Get out of
    bed, put on your bath robe, go downstairs and start the tea. As programming languages,
    each of these real-world actions is an abstraction for sequence of finer-grained
    actions like open cupboard, select teapot, measure tea into the pot, if you see
    water in the kettle, if not put more water in, set it on the stove, turn the stove
    on, wait for water to boil, and so on. This last step waiting for the water to
    boil involves a degree of asynchrony. While the water is heating, you have a choice
    of what to do - wait, or do other tasks in time such as stirring the toast (another
    asynchronous task) or fetching the newspaper, while making aware that your attention
    will be seen by the kettle. The manufacturers of teakeets and kettles know their
    products are out in an asynchronous manner, so that they receive an audible signal
    when they complete their task. Finding the right balance of sequentiality and
    asynchrony is a characteristic of efficient people - and the same is true of programs.


    The same concerns (resource utilization, fairness, and convenience) that motivated
    the development of processes also motivated the development of threads. Threads
    allow multiple streams of program control to coexist within a process. They share
    resources such as memory and files, but each has its own counter, stack, and local
    variables. Threads provide a natural decomposition for exploiting hardware parallelism
    on multiprocessor systems; threads within the same program can be scheduled simultaneously
    on multiple CPUs.


    Threads are sometimes lightweight processes, and most modern operating systems
    treat threads, not processes, as the basic units of scheduling. In the absence
    of explicit coordination, threads execute simultaneously and asynchrous with respect
    to one another. Since threads share the memory address space of their owning process,
    threads within a process have access to the same variables and allocate objects
    from the same heap, which allows finer-grained data sharing than inter-process
    mechanisms. But without explicit synchronization to coordinate access to shared
    data, a thread may modify variables that another thread is in the middle of using,
    with unpredictable results.'
