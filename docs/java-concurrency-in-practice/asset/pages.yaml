  md: "# Java Concurrency In Practice\n\nUp to a certain point, more threads can improve\
    \ throughput, but beyond that creating threads just slows your application, and\
    \ creating one thread too can cause your entire application to crash horribly.\
    \ The way to stay out of order is to place some bound on how many threads your\
    \ application creates, and to test your application thoroughly to ensure that,\
    \ even when this bound is reached, it does not run out of resources.\n\nThe problem\
    \ with the thread-per-task approach is that it places no limit on the number of\
    \ threads created except the rate at which users threads request it. Other concurrency\
    \ hazards, unbounded thread creation may appear when just prototyping and development,\
    \ with problems surfacing only when the application is deployed and under heavy\
    \ load. So a malicious user, or enough ordinary users, can make your server crash\
    \ if the traffic load reaches a certain threshold. For a server application that\
    \ is supposed to provide high availability and graceful degradation under load,\
    \ this is a serious failing.\n\n# 6.2. The Executor Framework\n\nTasks are logical\
    \ units of work, and threads are the mechanism by which tasks can run asynchronously.\
    \ We examined two policies for executing tasks sequentially in a single thread,\
    \ each task in its own. Both have severe limitations: the sequential approach\
    \ suffers from poor responsiveness and throughput, and the thread-per-task approach\
    \ suffers from poor resource management.\n\nIn Chapter 5, we saw about bounded\
    \ queues to prevent an overloaded application from running out of memory. Thread\
    \ pools offer the same benefit for thread management, and java.util.concurrent\
    \ provides a flexible thread pool implementation as part of the Executor framework.\
    \ The primary abstraction for task execution in the Java class library is not\
    \ Thread, but Executor, shown in Listing 6.3.\n\nListing 6.3. Executor Interface.\n\
    \n```\npublic interface Executor {\n    void execute(Runnable command);\n}\n```\n\
    \nExecutor may be a simple interface, but it forms the basis for a flexible and\
    \ powerful framework for asynchronous task execution that provides a standard\
    \ method of decoupling task submission from task execution, decoupling tasks with\
    \ Runnable. The Executor implementations also provide lifecycle support and hooks\
    \ for adding statistics gathering, application management, and monitoring.\n\n\
    Executor is based on the producer-consumer pattern, where activities that submit\
    \ tasks are the producers (producing units of work to be done) and the threads\
    \ that execute tasks (consuming these units of work). Using an Executor is usually\
    \ the easiest path to implementing a producer-consumer design in your application.\n\
    \n# 6.2.1. Example: Web Server Executor\n\nBuilding a web server with an Executor\
    \ is easy. TaskWebServer in Listing 6.4 replaces the hard-coded thread with an\
    \ Executor. In this case, we use one of the standard Executor implementations,\
    \ a fixed-size thread pool with 100 threads.\n\nIn TaskSubmission, the request-handling\
    \ task is decoupled from its execution using an Executor, and its behavior can\
    \ be changed merely by substituting a different Executor implementation. Changing\
    \ Executor implementations or configuration is far less invasive than changing\
    \ the ways tasks are submitted; Executor configuration is generally a one-time\
    \ event and can easily be exposed for deployment-time configuration, whereas task\
    \ submission code tends to be strewn throughout the program and hard to expose."
