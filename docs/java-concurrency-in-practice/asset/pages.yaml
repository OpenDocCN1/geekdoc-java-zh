    another thread has added or removed elements since we started), the CAS fails
    and updates the new node based on the current state and tries again. In either
    case, the stack is still in a consistent state after the CAS.


    CASCounter ConcurrentStack illustrate characteristics of all non-blocking algorithms:
    some done speculatively and may have to redo. In ConcurrentStack, when we construct
    the Node representing the new element, we are hoping the value of the next reference
    will be correct by the time it is installed on the stack, but prepared to retry
    in the event of contention.


    Non-blocking algorithms like ConcurrentStack derive their thread safety from the
    fact that, like locking, compareAndSet changes the state of the stack, it does
    so with a compareAndSet, which has the memory effects of a volatile write. When
    a thread examines the stack, it does so by calling get on the same atomicReference,
    which has the memory effects of a volatile read. So any changes made by one thread
    are published to any other thread that examines the state of the list. And the
    list is modified with compareAndSet that either updates the top reference or fails
    if it detects interference from another thread.


    # 15.4.2. A Non-blocking Linked List


    The two non-blocking algorithms we''ve seen so far, the counter and the stack,
    illustrate the basic pattern of CAS to update a value speculatively, retrying
    if the update fails. The trick to building non-blocking algorithms is to limit
    the scope of atomic changes to a single variable. With counters this is trivial,
    and with a stack it is straightforward enough, but for more complicated data structures
    such as queues, hash tables, or trees, it can get lot tricky.


    A linked queue is more complicated than a stack because it must support fast access
    to both the head and the tail. To do this, it maintains separate head and tail
    pointers. Two pointers refer to the node at the tail: the next pointer of the
    current last element. To insert a new element successfully, both of these pointers
    must be updated atomically. At first glance, this cannot be done with atomic variables;
    separate operations are required to update the two pointers, and if the first
    succeeds but the second fails the queue is left in an inconsistent state. And,
    even if both operations succeed, another thread could try to access the queue
    between the first and the second. Building a non-blocking algorithm for a linked
    queue requires a plan for both these situations.'
