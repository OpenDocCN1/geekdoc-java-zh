  md: '# 3.1.3. Locking and Visibility


    Intrinsic locking is used to guarantee that one thread sees the effects of another
    in a predictable manner, as illustrated by Figure 3.1. When thread A executes
    a synchronized block, and subsequently thread B enters a synchronized block guarded
    by the same lock, the variables that were visible to A before releasing the lock
    are guaranteed to be visible to B upon acquiring the lock. In other words, variable
    A or i prior to a synchronized block is visible to B when it executes a synchronized
    block guarded by the same lock. Without synchronization, there is no guarantee


    Figure 3.1. Visibility Guarantees for Synchronization.


    ![](img/c64daf12e0d6c877213813fc53c890a4_41_0.png)


    We now give the other reason for requiring all threads to synchronize on the same
    lock when accessing a shared mutable variable - to guarantee that values written
    by one thread are made visible to other threads. Otherwise, if a thread reads
    a variable without holding the appropriate lock, it might see a stale value.


    Locking is not just about mutual exclusion; it is also about memory visibility.
    To ensure that all threads see the most up-to-date values of shared mutable variables,
    the reading and writing must synchronize on a common lock.


    # 3.1.4. Volatile Variables


    The Java language provides an alternative, weaker form of synchronization, volatile
    variables, to ensure that updates to a variable are propagated predictably to
    other threads. When a field is declared volatile the compiler and runtime ensure
    that operations on this variable are not reordered with memory operations. Volatile
    variables are not cached in registers or caches where they are hidden from other
    processors, so a read of a volatile variable always returns the most recent value
    written by any thread.


    A good way to think about volatile variables is to imagine them like the Integer
    class in Listing 3.3, replacing reads and writes of the volatile variable with
    calls to get and set. Yet a volatile variable performs no locking and so cannot
    cause the executing thread to block, making volatile variables a lighter-weight
    synchronization mechanism than synchronized.'
