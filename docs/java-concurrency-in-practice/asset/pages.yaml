  md: '# Java Concurrency in Practice


    If an application goes to read from a socket when no data is available, read blocks
    until some data is available. In a single-threaded application, this means that
    not only does processing the concurrent request stall, but all requests wait while
    the single thread is blocked. To avoid this problem, single-threaded server applications
    are forced to use non-blocking I/O, which is more complicated and error-prone
    than synchronous I/O. However, if each request has its own thread, blocking does
    not affect the processing of other requests.


    Historically, operating systems as resulted, operating systems developed facilities
    low on the number of threads that could create, as well as hundred (or less).
    As a result, the Unix select and poll systems, and to access these features, the
    Java class libraries acquired a set of packages (java.input). However, operating
    system support for larger numbers of threads has improved significantly, making
    the thread-client model practical for large numbers of clients on some platforms


    +   [1] The NIO package, was designed to support hundreds of thousands of threads.
    Non-blocking I/O has its own benefits, but better OS support for threads means
    that there are fewer situations for which it is essential.


    # 1.2.4. More Responsive User Interfaces


    GUI applications used to be single-threaded, which meant that you had to either
    frequently throughout the code for input events (which is messy and intrusive)
    or execute all code indirectly through a "main event loop" until that code called
    from the main event loop takes too long to execute, the user interface appears
    to "freeze" until code finishes, because subsequent user events cannot be processed
    until control is returned to the main event loop.


    Modern GUI frameworks, such as the SWT and Swing toolkits, replace the main event
    loop with an event dispatch thread (EDT). When a user interface event such as
    a button press occurs, application-defined event handlers are called in the event
    thread. Most GUI frameworks are single-threaded subsystems, so the main event
    loop is effectively still present, but it runs in its own thread under the control
    of the GUI toolkit rather than the application.


    If only short-lived tasks execute in the event thread, the interface remains responsive
    because the event thread is always able to process user actions quickly. However,
    processing a long-running task in the event thread, such as spellchecking a large
    data or fetching a resource over the network, impairs responsiveness. If the user
    performs an action while this task is running, there is a long delay before the
    event thread can process or even acknowledge it. To add to injury, not only does
    the UI become unresponsive, but it is impossible to cancel the offending task
    even if the UI provides a cancel button because the event thread is busy and cannot
    handle the cancel button-press event until the lengthy task completes! If, however,
    the long-running task is instead executed in a separate thread, the event thread
    remains free to process UI events, making the UI more responsive.'
