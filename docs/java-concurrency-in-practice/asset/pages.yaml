  md: "# Java Concurrency in Practice\n\n```\nListing 14.2: Counting Semaphore Implemented\
    \ Using Lock.\n```java\n// Not really how java.util.concurrent.Semaphore is implemented\n\
    @ThreadSafe\npublic class SemaphoreLock {\n    private final Lock lock = new ReentrantLock();\n\
    \    private final Condition permitsAvailable = (permits > 0) ? lock.newCondition();();\n\
    \    @GuardedBy(\"lock\") private int permits;\n\n    public SemaphoreLock(int\
    \ initialPermits) {\n        lock.lock();\n        try {\n            permits\
    \ = initialPermits;\n        } finally {\n            lock.unlock();\n       \
    \ }\n    }\n\n    // BLOCKS-UNTIL: permitsAvailable\n    public void acquire(int\
    \ permits) throws InterruptedException {\n        lock.lock();\n        try {\n\
    \            while (permits <= 0)\n                permitsAvailable.await();\n\
    \            permits--;\n        } finally {\n            lock.unlock();\n   \
    \     }\n    }\n\n    public void release() {\n        lock.lock();\n        try\
    \ {\n            ++permits;\n            permitsAvailable.signal();\n        }\
    \ finally {\n            lock.unlock();\n        }\n    }\n}\n```\n```\n\nAQS\
    \ handles many of the details of implementing a synchronizer, such as FIFO queuing\
    \ of waiting threads. Individual synchronizers can define flexible criteria for\
    \ whether a thread should be allowed to pass or to wait.\n\nUsing AQS to build\
    \ synchronizers offers several benefits. Not only does it substantially reduce\
    \ the implementation effort, but you also don't need to pay for multiple points\
    \ of contention, as you would when constructing one synchronizer on top of another.\
    \ In SemaphoreLock, acquiring a permit has two places where it might block - once\
    \ at the lock and the semaphore state. Synchronizers built with AQS have only\
    \ one point where they might block, preventing context-switch overhead and improving\
    \ throughput. AQS was designed for scalability, and all the synchronizers in java.util.concurrent\
    \ are built with AQS will benefit from this.\n\n# 14.5. AbstractQueuedSynchronizer\n\
    \nMost developers will probably use AQS; the standard set of synchronizers covers\
    \ a wide range of situations. But seeing how the standard synchronizers are implemented\
    \ can help clarify how they work.\n\nThe basic operations that an AQS-based synchronizer\
    \ performs are variants of acquire and release. Acquisition is the state-dependent\
    \ operation and can always lock. With a lock or a semaphore, the meaning of acquire\
    \ is to acquire the lock or a permit and the caller may have to wait until the\
    \ synchronizer is in a state where that can happen. With CountDownLatch, acquire\
    \ \"wait until the latch has reached its terminal state\", and with Future, it\
    \ \"wait until the task has completed\". Release is not a blocking operation;\
    \ a release may allow threads blocked in acquire to proceed.\n\nFor a class to\
    \ be state-dependent, it must have some. AQS takes on the task of some of the\
    \ state for the synchronizer class: it manages a single integer of information\
    \ that can be manipulated through the getState, setState, and compareAndSet methods.\
    \ These can be used to represent arbitrary state; for example, ReentrantLock uses\
    \ it to represent the count of times the thread has acquired the lock, Semaphore\
    \ uses it to represent the number of permits, and Future uses it to represent\
    \ the state of the task (not started, running, completed, cancelled). Synchronizers\
    \ can also manage additional state variables themselves; for example, ReentrantLock\
    \ keeps track of the current lock owner so it can distinguish between reentrant\
    \ and contended acquisition requests."
