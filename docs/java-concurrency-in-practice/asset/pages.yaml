    # 11.6. Reducing Context Switch Overhead


    Many tasks involve operations that may block; transitioning between the running
    and blocked states entails a context switch. One source of blocking in server
    applications is logging messages in the course of processing requests; to illustrate
    how throughput can be improved by reducing context switches, we analyze the behavior
    of two logging approaches.


    Most logging frameworks are wrappers around print(); when you have something to
    log, just write it out then and there. Another approach was using Logwriter on
    page 52: the logging in a dedicated background thread of the requesting thread.
    From the developer''s perspective, both approaches are roughly equivalent. While
    there may be a difference in performance, depending on the volume of logging,
    how many threads are doing logging, and other factors as the cost of context switching.


    > [16] Building a logger that moves the I/O to another thread may improve performance,
    but it also introduces a number of design complexities, such as interruption (what
    happens if a thread in a logging operation is interrupted?), service guarantees
    (do the logger guarantee that a successfully logged message will be logged before
    shutdown?), saturation policy (what happens when the producers are faster than
    the lock can handle?), and efficiency (how do we shut down the logger, how do
    we communicate service status).


    The service time for a logging operation includes whether it is synchronous with
    the I/O classes; if the I/O operation blocks, it includes the duration for which
    thread is blocked. The operating system blocks the blocked thread until the I/O
    completes, and a little longer. When the I/O completes, other threads are probably
    active and will be allowed to finish their scheduling quantum, and threads may
    already be waiting ahead of us on the scheduling queue - further adding to service
    time. Alternatively, if multiple threads are logging simultaneously, there may
    be contention for the output stream, which is the result as with blocking I/O
    - the threads waiting for the lock and getting out. Inline logging reduces I/O
    and contention, which can lead to increased context switching and increased service
    time.


    Increasing service time is undesirable for several reasons. First, service time
    affects quality of service: longer service time means waiting for longer. But
    more significantly, longer times mean more contention. The "get, get out" principle
    of Section 14.1 tells us that we should hold locks as long as possible, because
    the longer a lock is held, the more likely the lock will be contended. If a thread
    is waiting for a lock while holding a lock, another thread is more likely to wait
    the lock that the first thread is holding. Concurrent systems perform best when
    lock acquisitions are uncontended, because contended lock acquisition means more
    context switches. A coding style that avoids context switches yields lower overall
    throughput.


    Moving the I/O of the request-processing thread is likely to shorten the mean
    service time for request processing. Threads no longer block for the output stream
    lock or for I/O to complete; they only need the message and can return to their
    task. On the other hand, we have the introduction of contention for the message
    queue, the buffer is lighter-weight than the I/O (which requires system calls)
    and is less likely to be locking (as long as the queue is not full). The request
    thread is now less likely to block, is less likely to be context-switched in the
    middle of a request. We''ve done turning a complicated and uncertain code path
    for I/O and possible lock contention into a straight-line code path.


    To extent, we have moved the work around, moving the I/O to a thread where its
    cost isn''t perceived by the user (which may be itself). By moving all the logging
    I/O to a single thread, we also eliminate the chance of contention for the output
    stream and eliminate a sum of blocking. This improves overall throughput because
    fewer resources are consumed in scheduling, context switching, and lock management.


    Moving the I/O from many request-processing threads to a single logger is similar
    to the difference between a bucket brigade and a collection of individuals fighting
    a fire. In the "hundreds guys running around with buckets" approach, we have a
    greater chance of contention at the water source and at the fire (resulting in
    overall'
