  md: '# 14 Java Concurrency in Practice


    # ### 11.3. Blocking


    Unsynchronized contention can be handled entirely within the JVM (Bacon et al.,
    1998); contended synchronization may require OS activity, which adds to the cost.
    When contended, the losing thread(s) must lock. The JVM can implement blocking
    either spin-waiting (repeatedly trying to acquire the lock until it succeeds)
    or by suspending the blocked thread through the operating system. Which is more
    efficient depends on the relationship between context switch and the time until
    the lock becomes available; spin-waiting is preferable for short waits and suspension
    is preferable for long waits. Some JVMs choose between the two adaptive based
    on profiling data of wait times, but must just suspend waits for a lock.


    Suspending a thread could cause it not get a lock, or if it blocked on a condition
    wait or blocking I/O operation, entails two context switches and all the attendant
    OS and cache activity: the blocked thread is switched out before its quantum expires,
    and then is switched back later after the lock or other resource becomes available.(Blocking
    due to lock contention also has a cost for the thread holding the lock: when it
    releases the lock, it must then ask the OS to resume the blocked.)


    # ### 11.4. Reducing Contention


    We''ve seen that serialization hurts scalability and context switches hurt performance.
    Contention locking causes both, so reducing contention can improve both performance
    and scalability.


    Access to resources guarded by an exclusive lock is serialized only one at a time
    may access. Of course, we use locks for good reasons, such as preventing corruption,
    but this safety comes at price. Persistent contention for a lock limits scalability.


    > The principal threat to scalability in concurrent applications is the resource
    lock.


    Two factors influence the likelihood of contention for a lock: how often the lock
    is requested and how long it is once acquired.[17] If the product of these factors
    is sufficiently small, then most attempts to acquire the lock will be uncontended,
    and lock contention will not pose a significant scalability impediment. however,
    if the lock is in high demand, threads will block waiting for it; in the extreme
    case, processors will idle even though there is plenty of work.


    > This is a consequence of Little''s Law, a result from queuing theory that "the
    average number of customers in a stable system is equal to their arrival rate
    multiplied by their average time in the system."(Little, 1961)


    There are three ways to reduce contention:


    +   - Reduce the duration for which locks are held;

    - Reduce the frequency with which locks are requested;

    - Replace exclusive locks with mechanisms that permit greater concurrency.


    # ### 11.4.1. Narrowing Lock Scope "Get in, Get Out")


    An effective way to reduce the likelihood of contention is to hold the lock as
    briefly as possible. This can be done by moving code that doesn''t lock out of
    synchronized blocks, for expensive operations and potentially blocking operations
    over I/O.


    It is easy to see how holding a "hot" lock for too long can limit scalability:
    we see an example of this in SynchronizedIterator in Chapter 2. If an operation
    holds a lock for 2 milliseconds and every operation requires that lock, throughput
    can be no greater than 500 operations per second, no matter how many processors
    are available. Reducing the lock time to 1 millisecond improves the lock-throughput
    to 1000 operations per second[8]


    [8]Actually, this underestimates the cost of holding locks for too long it doesn''t
    take into account the context switch overhead generated by lock contention.


    Attributestore in Listing 11.4 shows an example of holding a lock longer than
    necessary. The locationMatches method uses the user''s location in a Map and regular
    expression matching to see if the result value matches the supplied pattern. The
    entire locationMatches method is synchronized, but only the portion of the code
    that actually needs the lock is the call to Map.get.'
