    \ may seem that fields set in a constructor are the first values written to those\
    \ fields and that there are no \"older\" values to see as late, the Object constructor\
    \ first writes the default values to all fields before subclasses run. It is therefore\
    \ possible to see the default value for a field as a value.\n\nAt the risk of\
    \ repeating ourselves, some strange things can happen when data is shared across\
    \ threads without sufficient synchronization.\n\n# 3.5.2 Immutable Objects and\
    \ Initialization Safety\n\nBecause immutable objects are so important, the MemoryModel\
    \ offers a guarantee of initialization safety for sharing immutable objects. As\
    \ we have seen, that an object becomes visible to another thread does not necessarily\
    \ mean the state of that object is visible to the consuming thread. In order to\
    \ guarantee a consistent view of the object's state, synchronization is needed.\n\
    \nImmutable objects, on the other hand, can guarantee this initialization safety\
    \ to hold, all of the requirements for immutability must be met: unmodifiable\
    \ state, all fields are final, and proper construction. (If the Holder in Listing\
    \ 3.15 were immutable, assertion could not throw AssertionError, even if the holder\
    \ was not properly published.)\n\nImmutable objects can be used safely by any\
    \ thread without additional synchronization, even when synchronization is not\
    \ used to publish them.\n\nThis guarantee extends to all final fields of properly\
    \ constructed objects; final fields can be safely accessed without additional\
    \ synchronization. However, if final fields refer to mutable objects, synchronization\
    \ is still required to access the state of the objects they refer to.\n\n# 3.5.3.\
    \ Safe Publication Idioms\n\nObjects that are not immutable must be published,\
    \ which usually entails synchronization by both the publishing and the consuming\
    \ thread. For the moment, let's focus on ensuring that the consuming thread can\
    \ see the object in its published state; we will deal with modifications made\
    \ after publication later.\n\nTo publish an object safely, both the reference\
    \ to the object and the object's state must be visible to other threads at the\
    \ same time. A properly constructed object can be published by:\n\n+   * Initializing\
