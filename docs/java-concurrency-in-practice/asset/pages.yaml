    # 9.3.3. Swingworker


    We''ve built a simple framework using FutureTask and Executor to execute longrunning
    tasks in background threads without undermining the responsiveness of the GUI.
    These techniques can be applied to any single-threaded GUI framework, not just
    Swing. In Swing, many of the features developed here are provided by the Swingworker
    class, including cancellation, completion notification, and progress indication.
    Various versions of swingworker have been published in The Swing Connection and
    The Java Tutorial, and an updated version is included in Java 6.


    # 9.4. Shared Data Models


    Swing presentation objects, including data model objects such as TableModel or
    treeModel, are confined to the event thread. In simple GUI programs, all the mutable
    state is held in the presentation objects and the only thread besides the event
    thread is the main thread. In these programs enforcing the single-thread rule
    is easy: don''t access the data model or presentation components from the main
    thread. More complicated programs may use other threads to move data to or from
    a persistent store, such as a file system or database, so as not to compromise
    responsiveness.


    In the simplest case, the data entered by the user or loaded statically from a
    file or other data source at application startup, in which case the data is never
    touched by any thread other than the event thread. But sometimes the presentation
    object is only a view onto another data source, such as a database, file system,
    or remote service. In this case, more than one thread is likely to touch the data
    as it goes into or out of the application.'
