  md: "# Java Concurrency in Practice\n\nbuffer is indeed needed, it removes the first\
    \ element, which it can do because it still holds the lock guarding the buffer\
    \ state.\nIf the condition predicate is not true (the buffer is empty), take wait\
    \ until another thread puts an object in the buffer. It does this by calling wait\
    \ on the intrinsic condition queue, which requires holding the lock on the condition\
    \ queue object. Careful design would have it, already held that lock, which is\
    \ needed to test the condition predicate (and if the condition predicate was true,\
    \ modify the buffer state in the same atomic operation).\nThe wait method releases\
    \ the lock, blocks the current thread, and waits until the specified expires,\
    \ is interrupted, or the thread is awakened by a notification. After the thread\
    \ wakes up, it reacquires the lock before returning. A waking up thread wait no\
    \ special priority in reacquiring it; for the lock just like any other thread\
    \ attempting to enter a synchronized block.\n\nEvery call to wait is implicitly\
    \ associated with a specific condition predicate. When calling wait regarding\
    \ a particular condition predicate, the caller must already hold the lock associated\
    \ with the condition queue, and lock must also guard the state variables from\
    \ which the condition predicate is composed.\n\n# 14.2.2. Waking Up Too Soon\n\
    \nAs if the two-way relationship among the lock, the condition predicate, and\
    \ the condition queue were not complicated enough, that wait does not necessarily\
    \ mean that the condition it was waiting for is true.\n\nA single condition queue\
    \ may be used by more than one condition. When your thread is awakened because\
    \ someone notifyAll(), that doesn't mean the condition predicate you were waiting\
    \ for is now true.(This is like having your toaster and coffee maker share a single\
    \ bell; when one rings, you still have to look to see which device raised the\
    \ signal).[7] Additionally, wait is allowed to return \"spuriously\" not in response\
    \ to any thread call notify()[8].\n\n> [7] This accurately describes Tim's kitchen\
    \ petty reality: so many devices beat when you hear one, you have to inspect the\
    \ toaster, the microwave, the coffee maker, and never others to determine the\
    \ cause of the signal.\n\n> [8] To boost the breakfast anyway too far, this is\
    \ like a toaster with a loose connection that makes the bell go off when the toast\
    \ is ready already or sometimes when it is not.\n\nWhen re-enter the code calling\
    \ wait, it has reacquired the lock associated with the condition queue. Is the\
    \ condition predicate now true? Maybe. It might have been true at the time the\
    \ thread called notifyAll(), could have become false between your thread was awakened\
    \ and when wait reacquired the lock. Or maybe other threads have acquired the\
    \ lock and changed the object's state since your wait was called. You don't know\
    \ why another thread called notify or notifyAll(); maybe it wasn't true since\
    \ since called wait but another condition predicate associated with the same condition\
    \ queue became true. Multiple predicates per condition queue are common - BoundedBuffer\
    \ uses the same condition queue for the \"not full\" and \"not empty\" predicates.[9].\n\
    \n> [9] It is acceptable for threads to be waiting for both \"not full\" and \"\
    not empty\" at the same time. This can help when the number of producers/consumers\
    \ exceeds capacity.\n\nFor all these reasons, when you wake up you must test the\
    \ condition predicate again, and go back to wait (if it is not true). Since you\
    \ can wake up repeatedly without your condition predicate being true, you must\
    \ always call wait from within a loop, testing the condition predicate in each\
    \ iteration. The canonical form for a condition wait is shown in Listing 14.7.\n\
    \n# Listing 14.7. Canonical Form for State-dependent Methods.\n\n```\nvoid stateDependentMethod()\
    \ throws InterruptedException {\n    synchronized (lock) {\n        while (!conditionPredicate())\
    \ {\n            lock.wait();\n        }\n        object is now in desired state\n\
    \    }\n}\n```"
