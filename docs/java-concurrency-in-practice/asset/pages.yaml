  md: 'In Chapter 11, we saw how reducing granularity can enhance scalability. Lock
    stripping allows different hash chains in a hash-based collection to use different
    locks. We can apply a similar principle to reducing granularity in a linked list
    by using a lock for each link node, allowing threads to operate independently
    on different portions of the list. For a given node when traversing the link pointers
    we must hold the lock on one node until we acquire the lock on the next node;
    only then can we release the lock on the first node. An example of this technique,
    called hand-over-hand locking or lock coupling, in [CP 2.5.1].


    # 13.2. Performance Considerations


    When ReentrantLock was added in Java 5.0, it offered better contended performance
    than intrinsic locking. For synchronization primitives, contended performance
    is the key to scalability: if more resources are expended on lock management and
    scheduling, fewer are available for the application. A better implementation makes
    fewer system calls, fewer context switches, and initiates less memory-synchronization
    traffic on the shared memory bus, operations that are time-consuming and divert
    resources from the program.


    Java 6 uses an improved algorithm for managing intrinsic locks, similar to that
    used by ReentrantLock, that closes the scalability gap. Figure 13.1 shows the
    performance difference between intrinsic locks and ReentrantLock on Java 5.0 and
    a prerelease build of Java 6 on a four-wayter system running Solaris. The curves
    represent the "speedup" of ReentrantLock over intrinsic locking on a single JVM
    version. Java 5.0, ReentrantLock offers considerably better throughput, but on
    Java 6, the two are quite close.[10] The test program is the same used in Section
    11.5, this time comparing the hashmap generated by an intrinsic lock and a ReentrantLock.


    ![](img/c64daf12e0d6c877213813fc53c890a4_190_0.png)


    On Java 5.0, the performance of intrinsic locking drops dramatically in going
    from one thread (no contention) to more than one thread; the performance of ReentrantLock
    drops far less, showing its better scalability. But on Java 6, locks no longer
    fall under contention, and the two scale fairly similarly.


    Graphs like 13.1 remind us that statements of the form "X is better than Y" are
    best short-lived. Performance and scalability are sensitive to platform factors
    such as CPU, processor count, cache size, and JVM characteristics, all of which
    can change over time.[11]


    Performance is a moving target; yesterday''s benchmark showing that X is better
    than Y may already be out of date.'
