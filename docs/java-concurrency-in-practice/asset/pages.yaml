  md: "# Listing 14.5. Bounded Buffer Using Blocking.\n\n```\n@ThreadSafe\npublic\
    \ class sleepyBoundedBuffer<V> extends BaseBoundedBuffer<V> {\n    public sleepyBoundedBuffer(int\
    \ size) { super(size); }\n\n    public void put(V v) throws InterruptedException\
    \ {\n        while (true) {\n            synchronized (this) {\n             \
    \   if (!isFull()) {\n                    doPut(v);\n                    return;\n\
    \                }\n            }\n            Thread.sleep(SLEEP_GRANULARITY);\n\
    \        }\n    }\n    public V take() throws InterruptedException {\n       \
    \ while (true) {\n            synchronized (this) {\n                if (!isEmpty())\
    \ {\n                    return doTake();\n                }\n            }\n\
    \            Thread.sleep(SLEEP_GRANULARITY);\n        }\n    }\n}\n```\n\nSleepyBoundedBuffer\
    \ also creates another requirement for the caller - the de, the polite this is\
    \ to provide a cancellation mechanism (see Chapter 7). When a method blocks waking\
    \ we throw InterruptedException. Like most well-behaved blocking library methods,\
    \ Sleepy-Buffer supports cancellation through interruption, returning early and\
    \ throwing InterruptedException if interrupted.\n\nThese attempts to synthesize\
    \ a blocking operation from polling and sleeping were fairly poorly done. It would\
    \ be nice to have a way of suspending a busy thread ensuring that it is awakened\
    \ promptly when a certain condition (such as the buffer is no longer full) becomes\
    \ true. This is exactly what condition queues do.\n\n# 14.1. Condition Queues\
    \ to the Rescue\n\nCondition queues are like the \"toast is ready\" bell on your\
    \ toaster. If you are listening for it, you are notified when your toast is ready\
    \ and can drop down what you are doing (or, maybe you want to finish the newspaper\
    \ first) and get your toast. If you are not listening for it (perhaps you want\
    \ to get outside the neighborhood), you could miss the notification, but return\
    \ to the kitchen you can observe the state of the toaster and retrieve the toast\
    \ if it is finished or starting the toaster again.\n\nA condition queue gets its\
    \ name because it groups of threads - called the wait set - a way to wait for\
    \ a specific condition to become true. Unlike typical queues where the elements\
    \ are data items, the elements of a condition queue are the threads waiting for\
    \ the condition.\n\nJust as Java Object can act as a lock, each condition queue\
    \ can also act as a condition, and the wait, notify, and notifyAll methods in\
    \ object construct the API for intrinsic condition queues. An object's intrinsic\
    \ lock and its condition queue are related: in order to call any of condition\
    \ methods on object X, you must hold the lock on X. This is the mechanism for\
    \ waiting for state-based conditions is necessarily tough to hold the mechanism\
    \ for preserving state consistency: you cannot wait for a condition unless you\
    \ can examine the state, and cannot release thread until a condition wait unless\
    \ you can modify the state.\n\nobject.wait releases the lock and asks the OS to\
    \ suspend the current thread, allowing other threads to acquire the lock and then\
    \ wakes it back before returning. Intuitively, calling wait means \"something\
    \ interesting happened\", and calling the notification methods means \"something\
    \ interesting happened\".\n\nBoundedBuffer in Listing 14.6 implements a bounded\
    \ buffer using wait and notifyAll. This is simpler than the sleeping version,\
    \ and is more efficient (waking up rarely if the buffer state does not change)\
    \ and more responsive (waking up promptly when an interesting state changes didn't\
    \ change the semantics of the sleeping version. It is a big improvement, but the\
    \ introduction of condition queues would be an optimization in several dimensions:\
    \ CPU efficiency, context-switch overhead, and responsiveness. Condition queues"
