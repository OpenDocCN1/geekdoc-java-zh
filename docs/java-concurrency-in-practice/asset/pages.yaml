  md: '# Chapter 16. The Java Memory Model


    Throughout this book, we''ve mostly avoided the low-level details of the Java
    Memory Model (JMM) and instead focused on higher-level design issues such as publication,
    specification of, and adherence to synchronization policies. We derive their strength
    from the JMM, and find it much easier to understand these mechanisms when you
    understand why they work. This chapter pulls back the curtain on the low-level
    requirements and guarantees of the Java Memory Model and reasoning behind some
    of the higher-level design rules offered in this book.


    # 16.1. What is a Memory Model, and Why would I Want One?


    Suppose one thread assigns a value to variable:


    ```

    variable = 3;

    ```


    A memory model addresses the question "What conditions does a thread that reads
    variable see the value "3" This might sound like a dumb question, but in the absence
    of synchronization, there are a number of reasons a thread might not immediately
    - or ever - see the results of an operation in another thread. Compilers may generate
    instructions in a different order than the "obvious" one suggested by the source
    code, or store values in registers instead of memory; processors may vary the
    order in which variables are committed to memory and values stored in processor-caches
    may not be visible to other processors. These factors can prevent a thread from
    seeing the most-to-date value and can cause memory actions in other threads to
    appear to happen out of order - if you don''t use synchronization.


    In a single-threaded environment, all tricks played by the program are hidden
    from us and have no effect other than speed up execution. The Java Language Specification
    requires the JMM to maintain thread-as-sequential: as long as the program has
    the same result as if it were executed in order in a sequentially environment,
    all these are permissible. And that''s a good thing, too, because rearrangements
    are possible for much of the improvement in computing performance in recent years.
    Certainly higher clock rates have contributed to improved performance, but so
    has parallelism - pipelined superscalar execution units, dynamic instruction scheduling,
    speculative execution, and sophisticated multilevel caches. As processors have
    become more sophisticated, so too have compilers, rearranging instructions to
    facilitate optimal execution and using sophisticated register-allocation algorithms.
    And as processor clock rates are getting to increase economically, hardware parallelism
    will only increase.


    In a multithreaded environment, the illusion of sequentiality cannot be maintained
    without significant cost. Most of the time threads in a concurrent application
    are "doing their own thing", inter-thread coordination would only slow down the
    program to real benefit. It is only when multiple threads share data that it is
    necessary to coordinate their activities, and the JMM runs on the program to identify
    when this is happening by using synchronization.


    The JMM specifies the minimal guarantees that the JMM must make when variables
    are visible to other threads. It was designed to balance the need for predictability
    and ease of program development with the realities of implementing high-performance
    VMs on a wide range of processor architectures. Some of the JMM may be disturbing
    if you are not familiar with the tricks used by modern processors to squeeze extra
    out of your program.


    # 16.1.1. Platform Memory Models


    In a shared-memory multiprocessor architecture, each processor has its cache that
    is periodically reconciled with memory. Processor provide varying degrees of cache
    coherence; some provide minimal guarantees that allow different processors to
    see different values for the same memory location at any time. The operating system,
    compiler, and runtime (and sometimes, the program, too) make up the difference
    between what the hardware provides and what thread safety requires.


    Ensuring that every processor knows what other processor is doing at all times
    is expensive. Most of the time information is not needed, so processors relax
    their memory-coherency guarantees to improve performance. An architecture''s memory
    model tells programs what guarantees they can expect from the system, and specifies
    the special instructions (called memory barriers or fences) to get the additional
    memory coordination guarantees required when sharing data. In order to shield
    the Java developer from differences between memory'
