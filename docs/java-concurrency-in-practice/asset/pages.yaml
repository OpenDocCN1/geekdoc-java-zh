  md: "# Java Concurrency in Practice\n\nFor mutable objects, producer-consumer designs\
    \ and blocking queues facilitate thread confinement for handling ownership of\
    \ objects from producers to consumers. A thread-confined object is owned exclusively\
    \ by a single thread, but ownership can be \"transferred\" by publishing safe\
    \ where only one thread will gain access to it and ensuring that the publisher\
    \ does not access it afterwards. The safe publication ensures that the object's\
    \ state is visible to the new owner, and since the original will not touch it,\
    \ it is now confined to the new thread. The new owner may modify freely since\
    \ it has exclusive access.\n\nObject pools exert serial thread confinement, \"\
    lending\" to a requesting thread. As long as the pool contains sufficient synchronization\
    \ to publish the pooled object safe, and as long as the clients do not publish\
    \ the pooled object or use it after returning to the pool, ownership can be transferred\
    \ through thread\n\nOne could also use other mechanisms for transferring ownership\
    \ of a mutable object, but it is necessary to ensure only one thread receives\
    \ the object handed off. Blocking queues make this easy, with a little work like\
    \ the atomic remove method of ConcurrentMap or the compareAndAtomicReference.\n\
    \nListing 5.8. Producer and Consumer Tasks in a Desktop Search Application.\n\n\
    ```\npublic class Filecrawler implements Runnable {\n    private final BlockingQueue<File>\
    \ fileQueue;\n    private final FileFilter fileFilter;\n    private final File\
