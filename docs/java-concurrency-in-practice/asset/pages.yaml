  md: "# Java Concurrency In Practice\n\n# 7.2.2 ExecutorService Shutdown\n\nIn Section\
    \ 6.2, we saw that ExecutorService offers two ways to shut down: graceful shutdown\
    \ with shutdown(), and abrupt shutdown with shutdownNow(). In an abrupt shutdown,\
    \ shutdownNow returns the list of tasks that had not started after attempting\
    \ to cancel all executing.\n\nListing 7.15. Adding Reliable Cancellation to LoggerService\n\
    \n```\npublic class LoggerService {\n    private final BlockingQueue<String> queue;\n\
    \    private final LoggerThread loggerThread;\n    private final PrintWriter writer;\n\
    \    private final boolean isShutdown;\n    @GuardedBy(\"this\") private int reservations;\n\
    \n    public void start() {\n        loggerThread.start();\n    }\n\n    public\
    \ void stop() {\n        synchronized (this) { isShutdown = true; }\n        loggerThread.interrupt();\n\
    \    }\n\n    public void log(String msg) throws InterruptedException {\n    \
    \    synchronized (this) {\n            if (isShutdown)\n                throw\
    \ new IllegalStateException(...);\n            ++reservations;\n        }\n  \
    \      queue.put(msg);\n    }\n\n    private class class LoggerThread extends\
    \ thread {\n        public void run() {\n            try {\n                while\
    \ (true) {\n                    synchronized (this) {\n                      \
    \  if (isShutdown && reservations == 0)\n                            break;\n\
    \                    }\n                    String msg = queue.take(); --reservations;\n\
    \                    synchronized (this) {\n                        writer.println(msg);\n\
    \                    }\n                }\n            } catch (InterruptedException\
    \ e) { /* retry * */ }\n            } finally {\n                writer.close();\n\
    \            }\n        }\n    }\n}\n```\n\nThe different termination options\
    \ offer a tradeoff between safety and responsiveness: abrupt termination is faster\
    \ but riskier because tasks may be interrupted in the middle of execution, and\
    \ normal termination is slower because the ExecutorService does not shut down\
    \ until all queued tasks are processed. Other thread-owning services should consider\
    \ providing a simple choice of shutdown methods.\n\nSimple programs can get away\
    \ with starting and shutting down a global ExecutorService from main. More sophisticated\
    \ programs are likely to encapsulate an ExecutorService behind a higher-level\
    \ service that provides its own lifecycle methods, like the variant of LoggerService\
    \ in Listing 7.16 that delegates to an ExecutorService instead of managing its\
    \ own threads. Encapsulating an ExecutorService extends the ownership chain from\
    \ application to service to thread by adding another link; each member of the\
    \ chain manages the lifecycle of the services or threads it owns."
