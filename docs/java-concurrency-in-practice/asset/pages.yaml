  md: "# Java Concurrency In Practice\n\nrequires synchronization. But at the time,\
    \ synchronization was slow, and more importantly, not completely understood: the\
    \ exclusion aspects were well understood, but the visibility aspects not.\n\n\
    DCL proposed to offer the best of both worlds - lazy initialization without paying\
    \ the synchronization penalty of the common path. The way it worked was to check\
    \ initialization was needed without synchronization, and if the resource was not\
    \ null, use it. Otherwise, synchronize and check if the Resource is initialized,\
    \ ensuring that only one thread initialized the shared Resource. The common path\
    \ - fetching to an already constructed Resource doesn't use synchronization. And\
    \ that's where the problem is: as described in Section 16.2.1, it is possible\
    \ to see a partially constructed Resource.\n\nThe real problem with DCL is that\
    \ the worst thing that can happen when reading a shared object without synchronization\
    \ is erroneously see a stale value (in this case, null) that the DCL idiom compensates\
    \ for by trying again with the lock. But the worst case is actually worse - it\
    \ is possible to see a correct value of the reference but stale values for the\
    \ object's state, making the object could be to be in an invalid or incorrect\
    \ state.\n\nSubsequent changes in the JVM (since 5.0 and later) have enabled DCL\
    \ to work if the resource is made volatile, and the performance of this impact\
    \ is slightly more than nonvolatile reads. However, this is an old idiom whose\
    \ utility has largely passed - the forces that motivated it (such uncontended\
    \ synchronization, JVM startup) are no longer playing, making it less effective\
    \ as an optimization. The lazy initialization holder offers the same benefits\
    \ and is easier to understand.\n\n# Listing 16.7. Double-checked-locking Anti-pattern.\
    \ Do not do this.\n\n![](img/c64daf12e0d6c877213813fc53c890a4_230_0.png)\n\n```\n\
    @NotThreadSafe\npublic class DoubleCheckedLocking {\n    private static Resource\
    \ resource;\n\n    public static Resource getInstance() {\n        if (resource\
    \ == null) {\n            synchronized (DoubleCheckedLocking.class) {\n      \
    \          if (resource == null) {\n                    resource = new Resource();\n\
    \                }\n            }\n        }\n        return resource;\n    }\n\
    }\n```\n\n# 16.3. Initialization Safety\n\nThe guarantee of initialization safety\
    \ allows properly constructed immutable objects to be safely shared across threads\
    \ without synchronization, regardless of how they are published using a data race.\
    \ (This means UnsafeInitialization is safe if Resource is immutable).\n\nWithout\
    \ initialization safety, supposedly immutable objects like string can change their\
    \ value if synchronization is not used by both the publishing and consuming threads.\
    \ The security architecture relies on the immutability of string; the lack of\
    \ initialization safety could create security vulnerabilities that allow malicious\
    \ code to bypass security checks.\n\nInitialization safety guarantees that for\
    \ properly constructed objects, all threads will see the correct values of final\
    \ fields that were set by the constructor. Further, any variables that can be\
    \ reached through a final field of a properly constructed object (such as the\
    \ elements of an array or the contents of a HashMap referenced by a final field)\
    \ are also guaranteed to be visible to other threads. [6]\n\n> [6] This applies\
    \ only to objects that are reachable only through final fields of the object under\
    \ construction.\nFor objects with final fields, initialization safety prohibits\
    \ reordering any part of construction with the initial load of a reference to\
    \ that object. All writes to final fields by the constructor as well as any variables\
    \ reachable through those fields, become \"frozen\" when the constructor completes,\
    \ and any thread that obtains a reference to that object is guaranteed to see\
    \ a value that is at least as up to date as the frozen value. Writes that initialize\
    \ reachable through final fields are not reordered with operations following the\
    \ post-construction freeze."
