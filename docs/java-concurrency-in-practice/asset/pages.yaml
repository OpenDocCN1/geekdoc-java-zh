  md: "# Java Concurrency in Practice\n\nSince only one thread can execute a block\
    \ of code guarded by a lock, the synchronized blocks guarded by the same lock\
    \ execute atomically with respect to one another. In the context of concurrency,\
    \ atomicity means that a group of statements to execute as a single, indivisible\
    \ unit. No thread executing a synchronized block can observe another thread to\
    \ be in the middle of a synchronized block guarded by the same lock.\n\nThe machinery\
    \ of synchronization makes it easy to restore thread safety to the fetching servlet.\
    \ Listing 2.6 makes the method synchronized, so that only one thread may enter\
    \ the servlet at a time. Synchronizerizer is now thread-safe; however, this approach\
    \ is fairly extreme, since it inhibits multiple clients from using the servlet\
    \ simultaneously at all - resulting in poor responsiveness. This problem - a thread\
    \ safety issue - is addressed in Section 2.5.\n\nListing 2.6. Servlet with Unacceptably\
    \ Poor Concurrency. Don't do this.\n\n```\n@ThreadSafe\npublic class SynchronizedFactorizer\
    \ implements Servlet {\n    @GuardedBy(\"this\") private Integer lastNumber;\n\
    \    @GuardedBy(\"this\") private Integer[] lastFactors;\n\n    public synchronized\
    \ void service(ServletRequest req) {\n        Integer i = extractFromRequest(req);\n\
    \        if (i.equals(lastNumber)) {\n            encodeResponse(resp, lastFactors);\n\
    \        } else {\n            Integer[] factors = factor(i);\n            lastNumber\
    \ = i;\n            lastFactors = factors;\n            encodeResponse(resp, factors);\n\
    \        }\n    }\n}\n```\n\n# 2.3.2. Reentrancy\n\nWhen a request is already\
    \ held by another thread, the requesting thread blocks. But because intrinsic\
    \ locks are reentrant, if a thread tries to acquire a lock that it already holds,\
    \ the request succeeds. Reentrancy is implemented by associating each lock with\
    \ an lock acquisition count and an owning thread. When the count is zero, the\
    \ lock is considered unheld. When a thread acquires a previously unheld lock,\
    \ the JVM records the owner and sets the acquisition count to one. If that same\
    \ thread acquires the lock again, the count is incremented, and when the thread\
    \ exits the synchronized block, the count is decremented. When the count reaches\
    \ zero, the lock is released\n\n> [7] This differs from the locking behavior for\
    \ threads (POSIX threads) mutexes, which are granted on a per-invocation basis.\n\
    \nReentrancy facilitates encapsulation of locking, and thus simplifies the development\
    \ of object-oriented concurrent code. Without reentrant locks, the very natural-looking\
    \ code in Listing 2.7, where a subclass overrides a synchronized method and then\
    \ calls the superclass method, would deadlock. Because the desomething methods\
    \ in Widget and Loggingwidget are both synchronized, they each tries to acquire\
    \ the lock on the widget before proceeding. But if intrinsic locks were not reentrant,\
    \ the call to super.desomething() would never be able to acquire the lock because\
    \ it would be considered already held, and the thread would be perpetually stalling\
    \ for a lock to never acquire. Reentrancy saves us from deadlock in situations\
    \ like this.\n\nListing 2.7. Code that would deadlock if Intrinsic Locks Were\
    \ Not Reentrant.\n\n```\npublic class Widget {\n    public synchronized void desomething()\
    \ {\n    }\n}\n\npublic class Loggingwidget extends Widget {\n    public synchronized\
    \ void desomething() {\n        System.out.println(toString() + \": calling desomething\"\
    );\n        super.desomething();\n    }\n}\n```\n\n![](img/c64daf12e0d6c877213813fc53c890a4_34_0.png)"
