    \        try {\n            saveUncrawled(exec.shutdownNow());\n            if\
    \ (!exec.awaitTermination(TIMEOUT, UNIT)) {\n                saveUncrawled(exec.getCancelledTasks());\n\
    \            }\n        } finally {\n            exec = null;\n        }\n   \
    \ }\n\n    protected abstract List<Runnable> processPage(URL url);\n    private\
    \ void saveUncrawled(List<Runnable> unrawled) {\n        for (Runnable task :\
    \ unrawled) {\n            urlToCrawl.add(((CrawlTask)task).getPage());\n    \
    \    }\n    }\n    private synchronized void submitCrawlTask(URL u) {\n      \
    \  exec.execute(new CrawlTask(u));\n    }\n\n    private class CrawlTask implements\
    \ Runnable {\n        private final URL url;\n        public void run() {\n  \
    \          for (URL link : processPage(url)) {\n                if (Thread.currentThread().isInterrupted())\
    \ {\n                    return;\n                }\n                submitCrawlTask(link);\n\
    \            }\n        }\n        public URL getPage() { return url; }\n    }\n\
    }\n```\n\n# 7.3. Handling Abnormal Termination\n\nIt is obvious when a single-threaded\
    \ console terminates due to an unexpected exception the program stops and runs\
    \ a stack trace that is very different from typical program output. Failure of\
    \ a thread in a concurrent application is not always obvious. The stack trace\
    \ may be printed on the console, but no one is watching the console. Also, when\
    \ a thread fails, the application may appear to continue to work, so its failure\
    \ could go unnoticed. Fortunately, there are many forms of premature thread death\
    \ that prevent \"leaking\" from an application.\n\nThe leading cause of thread\
    \ death is runtimeException. Because these exceptions are a programming error\
    \ or other unrecoverable problem, they are not generally caught. They will propagate\
    \ all the way up the stack, at which point the default behavior is to print a\
    \ stack trace on the console and let the thread terminate.\n\nThe consequences\
    \ of abnormal thread death range from benign to disastrous, depending on the role\
    \ of the thread in the application. Losing a thread from a thread pool can have\
    \ performance consequences, but an application that runs with a 50-thread pool\
    \ will probably run fine. But losing the dispatch thread in a GUI application\
    \ would be quite noticeable - the application would stop processing events and\
    \ the GUI would disappear. Outftime on page 124 showed a serious consequence of\
    \ thread service: the service we reported by the Timer was permanently out of\
    \ commission.\n\nJust about any code can throw a RuntimeException. Whenever you\
    \ call another method, you are taking a leap of faith that it will return normally\
    \ or one of the checked exceptions its signature declares. The less familiar you\
    \ are with the code being called, the more skeptical you should be about its behavior.\n\
    \nTask-processing threads such as the worker in a thread pool or the event dispatch\
    \ thread spend their life unknown code under an abstraction barrier like Runnable,\
    \ and these threads should be very skeptical that the code will be well behaved.\
    \ It would be very bad if a service like the Swing event failed just because some\
    \ poorly written event handler threw a NullPointerException. Accordingly, these\
    \ facilities should catch tasks within a try-catch block that catches unchecked\
    \ exceptions, or in a try-finally block to ensure that"
