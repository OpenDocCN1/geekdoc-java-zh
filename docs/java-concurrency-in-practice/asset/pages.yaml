    Response-time tasks. GUI applications are sensitive to response times: users are
    annoyed by long delays between a click and the corresponding visual feedback.
    Binding a long-running task to a single-threaded executor, or submitting a thread
    pool with a small number of threads, may impair the responsiveness of the service
    managed by that executor.


    Tasks that use ThreadLocal. ThreadLocal allows each thread to have its own "version"
    of a variable. However, executors are free to reuse threads. The standard Executor
    implementations reap idle threads when demand is low and add new ones when demand
    comes, and replace a worker with a fresh one if an unexpected exception occurs
    from a task. ThreadLocal makes sense to use in thread pools only if the thread-local
    value is bounded by that of task; ThreadLocal should not be used in pools to communicate
    between tasks


    Thread pools work best when tasks are homogeneous and independent. Long-running
    and short-running tasks "clogging the pool when it is large; tasks that depend
    on other tasks deadlock the pool is unbounded. Fortunately, requests in typical
    network-based server applications - web servers, mail servers, file servers -
