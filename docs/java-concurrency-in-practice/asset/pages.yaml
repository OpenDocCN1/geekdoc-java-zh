  md: "# Java Concurrency In Practice\n\n[4] This analogy is not exact; the memory\
    \ effects of Synchronizedinteger are actually slightly stronger than those of\
    \ volatile variables. Chapter 16.\n[5] Volatile variables are only slightly more\
    \ expensive than volatile reads on most processor architectures.\n\nThe visibility\
    \ effects of volatile variables extend beyond that of the volatile variable itself.\
    \ When thread A writes to a volatile and subsequently thread B reads that variable,\
    \ all of the values that were visible to A prior to writing to the volatile variable\
    \ become visible to B after reading the volatile variable. From a memory perspective,\
    \ writing a volatile variable is like leaving a synchronized block and reading\
    \ a volatile variable is like entering a synchronized block. However, we do not\
    \ recommend relying too on volatile variables for visibility; code that relies\
    \ on volatile variables for arbitrary state is more fragile and harder to understand\
    \ than that code uses.\n\nUse volatile variables only when implementing and verifying\
    \ your synchronization policy; avoid using volatile variables unless ensuring\
    \ the visibility of their state, of the object they refer to, or indicating an\
    \ important lifecycle event (such as initialization or shutdown).\n\nList 3.4\
    \ illustrates a typical use of volatile variables: checking a sleep flag to determine\
    \ when to exit a loop. In this example, our asleep thread is trying to get sleep\
    \ by the time-honored method of counting sleep. For this example to work, the\
    \ asleep must be volatile. Otherwise, the thread might not notice when asleep\
    \ has been set by another. We could have used locking to ensure visibility of\
    \ changes to asleep, but that would have made the code more complex.\n\n# List\
    \ 3.4. Counting Sleep.\n\n```\nvolatile boolean asleep;\nwhile (asleep) {\n  \
    \  countSleep();\n}\n```\n\nVolatile variables are convenient, but they have limitations.\
    \ The most common use for volatile variables is a completion, interruption, or\
    \ status flag as in List 3.4. Volatile variables can be used for other kinds of\
    \ state, but more is required when updating them. For example, the semantics of\
