    \ Using HashMap and Synchronization.\n\n```\npublic interface Computable<A,V>\
    \ {\n    V compute(A arg) throws InterruptedException;\n}\n\npublic class ExpensiveFunction\n\
    \    implements Computable<String, BigInteger> {\n    public BigInteger compute(String\
    \ arg) {\n        // after deep thought...\n        return new BigInteger(arg);\n\
    \    }\n}\n\npublic class Memorizer<A,V> implements Computable<A,V> {\n    @GuardedBy(\"\
    this\")\n    private final Map<A,V> cache = new HashMap<A, V>();\n    private\
    \ final Computable<A,V> c;\n\n    public Memorizer(Computable<A,V> c) {\n    \
    \    this.c = c;\n    }\n\n    synchronized V compute(A arg) throws InterruptedException\
    \ {\n        V result = cache.get(arg);\n        if (result == null) {\n     \
    \       result = c.compute(arg);\n            cache.put(arg, result);\n      \
    \  }\n        return result;\n    }\n}\n```\n\nMemorizer in Listing 5.16 shows\
    \ a first attempt: using a HashMap to store the results of previous computations.\
    \ The compute method first checks whether the desired result is already cached,\
    \ and returns the pre-computed value if it is. Otherwise, the result is computed\
    \ and cached in the HashMap before returning.\n\nHashMap is not thread-safe, so\
    \ to ensure that two threads do not access the HashMap at the same time, Memorizer\
    \ takes the conservative approach of synchronizing the entire method: only one\
    \ thread at a time can execute compute at all. If another thread is busy computing\
    \ a result, other threads calling compute may be blocked for a long time. If multiple\
    \ threads are queued waiting to compute values not already computed, compute may\
    \ actually take longer than it would have without Memorization. Figure 5.2 illustrates\
    \ what could happen when several threads attempt to use a function memoized with\
    \ this approach. This is not the sort of performance improvement we have hoped\
    \ to achieve through caching.\n\n# Figure 5.2. Poor Concurrency of Memorizer.\n\
    \n![](img/c64daf12e0d6c877213813fc53c890a4_82_0.png)\n\nMemorizer2 in Listing\
    \ 5.17 improves on the awful concurrent behavior of Memorizer by replacing the\
    \ HashMap with a ConcurrentHashMap. Since ConcurrentHashMap is thread-safe, there\
    \ is no need to synchronize when accessing the backing Map, eliminating the serialization\
    \ induced by synchronizing compute in Memorizer1."
