    # The Writing of Daily Life


    # Introduction


    The convergence of capitalism and English prose—the subject of the first chapter
    of this study—appears with particular clarity in one genre: the English diary.
    This literary form, which first emerged in the late sixteenth century and became
    widely disseminated in the seventeenth century was a close genealogical relation
    of the account book, and the two remained linked in both theory and practice throughout
    the era. Samuel Pepys, the exemplary diarist in English, was a devotee of accounting:
    “a regular accountant,” he reassured himself at one tricky juncture, “never ought
    to fear anything.” Pepys composed his journal in a series of steps that began
    with a jotted list of expenses; these rough reckonings formed the basis of the
    diary entries, which he first wrote on loose sheets of paper, and only later copied
    into specially ordered notebooks. Because of their overlap with accounts, diaries
    are an especially revealing style for examining how new monetary relations came
    to influence not only the style of English prose, as I argued previously, but
    its content, the subject of what follows. Financial imperatives will select what
    was set down on paper. As wage laborers or employers, renters or rentiers, sellers
    of produce or consumers, English men and women having compelling reasons to remember
    and record quotidian diaries. A new prose of the everyday, concerned with the
    routine and memory, was a direct consequence of England’s increasingly monetized
    economy and the literate practices on which it was predicated.


