    # The Problem of Popular Culture


    As a form of literature that depicted the lives of working people and their labor,
    I have argued, the ballad introduced new currents into literary history. Yet this
    analysis leaves a central question unanswered. To what extent did the depiction
    of working people actually reflect their preferences, interests, values, or experiences?
    In older studies, which viewed ballads as a folk form, scholars took it granted
    that they represented the authentic voice of the people, at least to the extent
    that any literary form could be. Viewed as a product of the world of cheap print,
    however, the question is more complicated. As ballads came to be understood as
    a commercial form, debates opened between scholars who viewed ballad and broadside
    literature as a vehicle for the imposition of elite values and those who argued
    that the form really does capture elements of the experience of ordinary people—with
    many, inevitably, adopting a compromise position.⁷¹


