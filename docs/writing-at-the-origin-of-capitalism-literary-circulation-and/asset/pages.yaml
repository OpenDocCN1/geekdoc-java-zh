  md: '# 26 WRITING AT THE ORIGIN OF CAPITALISM


    Chaucer wrote at the beginning of one of the most profound social as well as linguistic
    transformations in English history. Just as the fate of English in the earlier
    Middle Ages was conditioned by the country''s political and economic structure,
    so, too, the rise of a literate vernacular. In the middle of the fourteenth century,
    English history was set on a new course after approximately half of England''s
    population died by the ravages of plague. So rapid loss of population had profound
    consequences for the economy and its imperatives. By giving workers a more favorable
    bargaining position, this demographic change hastened the disappearance of serfdom;
    by the fifteenth century, the English peasantry had won their long struggle for
    freedom. With an expanding economy, the pace of trade quickened, and the circle
    of well-off commoners, including merchants and artisans, widened. By the beginning
    of the fifteenth century, there were many more persons with the leisure and the
    means for education outside the restricted enclaves of the clergy and government
    than in the centuries prior.


    As new groups of men and women gained resources, they also gained a powerful motive
    for literacy. In all periods, the desire to manage property serves as one of the
    essential reasons people learn to read and write—indeed, some scholars have argued
    that the origin of writing is in account keeping. The late fourteenth and fifteenth
    centuries were no exception, as more began to keep deeds, contracts, and the plethora
    of paperwork that goes into recording and managing property. But many of the better-off
    commoners who found it necessary to use documents knew only English. Without a
    formal education in Latin or French, they tended to write in their own language.
    As a result, not only were there more documents, but there were more documents
    in the native vernacular. The first caches of vernacular correspondence date from
    the fifteenth century, such as the Paston and Cely letters. English wills, too,
    began to proliferate in this period. As Laura Wright has shown, London merchants
    switched their accounts from Latin to the fifteenth century—a habit that, in their
    view, had a decisive effect on the form of the language.


