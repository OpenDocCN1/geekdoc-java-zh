  md: '# Practical Writing and the Plain Style


    With the development of a simple, functional prose, the new stylistic movement
    took hold in England. This was the rise of the plain style, which would come to
    supplant more rhetorical modes until it was seen as the core form of English prose
    writing. Less a distinctive literary style in its own right than a new system
    of literary values, advocates of the plain style praised simplicity, concision,
    and coherence against eloquence, copiousness, and ornament.


    By the end of the seventeenth century, the plain style had come to be seen as
    a kind of proxy for Englishness, a translation of nations mores into the medium
    of writing. In many respects, this movement represented a recognition of the social
    and historical conditions underlying the development of the standard vernacular.
    It suggested that contemporaries perceived the interpenetration of function and
    style that had always characterized—that had indeed created—the language itself.


    The origins of the plain style were once an exciting topic of scholarly debate,
    which was at best, united social and stylistic analysis. Scholars invoked European
    literary trends, scientific and technical contexts, religious belief, and the
    decline of courtly culture as explanatory variables in this movement in the history
    of prose.¹ Debate, has largely peter out, perhaps due to the difficulty of defining
    a style with so few characteristics or—depending on how one held it—so. One exception
    is a thoughtful recent article by John Guillory, who situates the plain style
    within the history of media, in keeping with the emphasis of his research. Guillory
    argues that the demand for a plain style represented “an intuition about the nature
    of prose itself,” that it is, the recognition that had begun to function as a
    medium of communication.² The plain style, he suggests, was a way of articulating
    the ideal of transparency demanded of media.


    Guillory’s approach captures the the continuities between the growth of literacy,
    the standardization of the language, and the changing character of prose, aspects
    of the history of style that are not enough considered together. So far as it
    goes, his analysis is convincing. By bracketing or


