    # A Working Audience


    Ballads, then, represented a new kind of literary entity. They did precisely because
    of the class of persons whom they addressed, in which dictated their logic of
    sale and distribution. It also had implications for their content. As a form of
    writing oriented towards working people, ballads moved outside literature’s conventional
    frame of reference, taking on a set of concerns and mores that had not been central
    to literary history so long as it was solely the province of the educated elite.


    Exactly how did ballads respond to the fact of their popular audience? One answer
    to the question has been proposed by Patricia Fumerton One argues that ballads’
    address to the lower orders allowed them to depict a different kind of subjectivity
    from high literary culture: an “unsettled” and variable point of view that featured
    a multiplicity of perspectives, composed “of many for the many.” Taking the widespread
    dislocations caused by economic development as her premise, as well as the literary’s
    relentless creation of variety, Fumerton depicts a popular consciousness and a
    popular culture that are fluid, mobile, and heterogeneous. There is more to recommend
    this thesis, and Fumerton is an adroit literary interpreter. Nevertheless, in
    what follows I wish to emphasize a different aspect of the connection between
    the primary audience and content of ballads, focusing on the way in which they
    represent subjective experience and more on how they depict the conditions of
    working people in this era. What I am interested in here is how ballads addressed
    the working people as working people—as laborers. The appearance of an incipient
    national group of laborers was, after all, the other side of the creation of natural
    markets of commodities. If more people relied on markets for commodities, they
    depended on them equally for payment for their labor, whether as wages or through
    the sale of produce. For working people, markets began to link labor and consumption
    in a relentless cycle.


    Early modern men and women were well aware of the role labor played in the lives
    of the many. No social distinction was more important than that constituted by
    physical labor. It was essential to both the culture of early modern England and
    its political organization. As Andy Wood writes, “for


