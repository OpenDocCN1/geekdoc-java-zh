    To write in English in the High Middle Ages, then, was to work within a language
    that was fluid, heterogeneous, and deeply marked by its social and class history.
    The implications of this situation were not lost on the most famous poet of Middle
    English, Geoffrey Chaucer. In the conclusion to his Troilus and Criseyde, the
    poet obliviously addressed a plea to future poets:


    For that ther is so great diversitee

    In English, and in writing of our tongue,

    So pray I God noon miswrite thee.¹¹⁴


    Chaucer, that is, feared that in a language whose rules varied greatly across
    regions and social groups, copies working with a different set of conventions
    might easily “miswrite” his manuscript.


    Yet in this case, as in others, Hegel''s dictum that the owl of Minerva flies
    at dusk holds true. Chaucer''s ability to perceive linguistic diversity as a problem
    signaled that this very diversity was in the process of disappearing. His complaint
    is, to begin with, in his native language. While he had composed his earliest
    lyrics in French, in his manner he turned to English, a circumstance that testifies
    to the growth of a literary public for the language. There is then the fact that
    in this passage, as in many others throughout his works, Chaucer understands his
    verse as a written form, meant to be read, not heard. In general, notions of correction
    or incorrect writing only arise within a highly literate context; so long as writing
    is understood primarily as a transcript of speech rather as a form in its own
    right, it tends to vary with accents and dialects, which it naturally records.
    In the very act of decloring the fluid and varying character of English, then,
    this passage points to the process by which it became a standard language, and
    a written vernacular English came to dominate England''s literary culture.


