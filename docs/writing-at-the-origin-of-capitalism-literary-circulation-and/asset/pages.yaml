  md: '# INTRODUCTION: CAPITALISM AND COMMUNICATIONS 5


    In England, this explosion of writing was inseparably connected with the country''s
    transition to an agrarian capitalist economy. From the deeds, titles, and contracts
    that regulated people''s relationship to property and labor to the streams of
    information necessary to merchant enterprise, the birth of a competitive national
    economy relied on writing. In another sense, too,


    capitalism shaped the production and dissemination of texts: that is, insofar
    as books and broadsides were commodity objects like any other, they were subject
    to some of the same trends in production and consumption, and were distributed
    through many of the same channels, as goods of other kinds. As the necessary instrument
    of trade and government, or potentially profitable commodities, texts circulated
    along lines directed by English society as a whole. As a result, the most important
    changes that occurred in the English textual system over the sixteenth and seventeenth
    centuries


    reflected the rise of a competitive, integrated national economy. It is in this
    sense that early modern English literature reflects an arc of transition toward
    modernity—that is, toward a world shaped by capitalism. And it is for this reason
    that research on the material history of texts in early modernity, in particular,
    can gain clarity and depth from entering into dialogue with Marxist historical
    and theoretical research on the rise of capitalism.


    The contact between these two methods, however, should not be one-sided. The vast
    and growing body of research on the material history of texts in early modernity
    also the method he used for the study of culture turned cultural materialism,
    Raymond Williams called for an approach to the study of culture that would be
    thoroughly integrated with economic history—one in which the “means of communication”
    are understood as a vital component of “means of production.”¹¹ Media, that, should
    be seen as part of the infrastructure of society. In its theoretical framework,
    the history and economics of communication, from the English language to television,
    were one of the points where Marxist politics and literary interpretation most
    obviously coincided. Despite this influential example, however, the vast majority
    of Marxist literary scholarship does not focus on the material history of texts,
    but rather on their coordinates. A recent, excellent introduction to Marxist literary
    theory contains sections on aesthetic terms such as beauty, formal unity, and


    > ¹¹ Raymond Williams, "Means of Communication as Means of Production," Culture
    and Materialism (New York: Verso, 1980), 50; Raymond Williams, The Long Revolution
