  md: '# ENGLISH LITERATURE ABROAD 157


    in translation in the Netherlands, as well as fourteen in France and in German-speaking
    lands.⁸¹ Robinson Crusoe, one of the best-selling novels of the eighteenth century,
    was translated into French, German, and Dutch within two years of its publication,
    and into Italian, Danish, and Swedish by the middle of the century.⁸² At the end
    of the nineteenth century, it had been published in at least 110 translated editions.
    At the same time, an older English canon was discovered by Europe; the impact
    of Shakespeare on German literature, in particular, is well known. English had
    been added to the small number of European languages that formed for, for most
    European men, their modern literary canon. Writers working in English could expect
    that, if they achieved sufficient celebrity in their own language, they might
    also become famous in their own tongues.


    This transition was, as I have argued, inseparable from the political and linguistic
    organization of Europe, including England. From the Renaissance outward, Europe
    became ever more connected by trade, and at the same time, divided more sharply
    into territorial states. The modern literary system was predicated on both European
    contact and European division. But it was only over the course of the seventeenth
    century that England’s ascent to the leading economic power of Europe as the pioneer
    of capitalism, as an imperial power, led it to play a role in the European milieu.
    Ultimately, the spread of English through colonialism to the Americas, India,
    and elsewhere ensured that its literature would be read not only in Europe but
    around the globe. Writing in praise of the Royal Society, Thomas Sprat captured
    the interlinked nature of English imperialism and its literary history. London,
    he wrote, “is the head of a mighty Empire, the greatest that ever commanded the
    Ocean: It is composed of Gentlemen, as we as Traders: It has a large intercourse
    with all the Earth: It is, as the Poets describe their House of Fame, a City,
    where all the noises and business of the world do meet.”⁸³ For writers, the growth
    of England’s “empire,” its crucial role in the “business of the world,” influenced
    their works’ dissemination and its reception. For readers—and scholars—it shapes
    what we read and study.


