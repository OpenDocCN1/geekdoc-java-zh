  md: '# THE RISE OF ENGLISH PROSE 37


    “prose.” As the linguist M.A.K. Halliday notes, written language is not merely
    “conversation written down.\”49 Rather, it has its own features and conventions.
    The organization of the page differs from the organization of spoken language.
    Writing has different units, such as the sentence, paragraph, section, and chapter.
    Its grammar, too, differs systematically from speech. As England developed a broader
    and deeper culture in early modernity, writing drifted further from speech along
    a number of axes, taking on its distinctive features. To read over the writing
    of the early sixteenth century, from the powerful but meandering prose of the
    late Elizabethan period, is to see distintive norms of writing develop, not through
    the inspiration of one or another writer, but as the common medium of the educated
    elite.


    Perhaps the clearest example of the way that writing came to differ systematically
    in early modernity lies in the sentence. The sentence is a unit of writing: although
    we may refer colloquially to spoken “sentences,” many linguists argue that words
    or phrases, not sentences, are the basic component of speech.50 Sentences, by
    contrast, form the basis of modern prose. Even in writing, however, sentences
    are not universal. Rather, they represent a prose sufficiently developed to make
    use of a fundamentally different form of organization—a prose that is no longer
    a transcription of the oral. As a result, Ian Robinson argued that the modern
    form of the sentence only evolved in European languages in early modernity.51
    It is clear that the sentence was still developing in English prose in the sixteenth
    century, a fact that is apparent in the ambiguity of the word. When writers of
    this time referred to “sentences,” they typically meant sententiae, aphoristic
    formulae, rather than the newer meaning of the term, a grammatical unit delimited
    by punctuation. As is so often the case, the use of the word slightly steered
    the development of the entity it denotes.


