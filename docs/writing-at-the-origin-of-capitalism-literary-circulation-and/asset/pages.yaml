    goods. Their purchasing power, however minute individually, cumulatively had the
    greatest impact. This, of course, is one of the defining features of capitalism:
    a shift from a commercial system to one based on the mass production and sale
    of cheap commodities. In England, the growth of markets affected how goods of
    all kinds were produced and consumed, including grain and other foodstuffs, cloth
    and the accouterments of millinery—and literature. In opening new commercial pathways,
    the English economy created new patterns of literary circulation and new forms
    of demand. As the people became consumers of commodities on a new scale, they
    also came to make up a commercial audience for literary art.


    The rise of thegoing power in London is the most obvious and best studied instance
    of this phenomenon. The theaters grew in size from the 1580s, relying on large
    audiences whose numbers included many working people. Theater historians have
    shown in impressive detail how the theatres imperative for profit shaped every
    aspect of the dramas that were staged within them, from their plots and characters
    to their presentation and advertising. The theater, perhaps the most powerful
    art form of Renaissance England, developed together and in response to a paying
    audience consisting in part of the common people.


