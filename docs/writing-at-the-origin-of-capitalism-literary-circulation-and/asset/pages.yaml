    Already at the start of the Carolina era, then, signs of an opposition between
    two rival perspectives could be seen. On the one hand, there was a model of royal
    prerogative control of the economy that was intermeshed with the structure of
    courtly life and the monarch’s authority. On the other, there was a new impulse
    to release markets from traditional sources of constraint in order to allow them
    to function as efficiently as possible in the interests of the propertied. This
    dispute had been long in the making, and its aftershocks were felt for much of
    the century. In the 1630s, it gained new urgency on both sides, as Charles heightened
    prerogative control of the economy.


