  md: '# THE BEGINNINGS OF LITERARY MASS CULTURE 79


    repetitive and difficult, but it is also “honest.” Echoing the Protestant

    language of vocation, the porter insists, “my calling is not base.”


    I have included this chapter with a discussion of Parker’s ballad because

    it so obviously illustrates the two-sided effects of the rise of a literate,

    commercial, popular culture. It is easy to see how, for persons who lost

    parallelled by the porter, a ballad could hold an appeal. In a culture

    in which working people were constantly accused of idleness and vice,

    or made the butt of vicious satire, it is a piece of popular literature that

    proclaims there is dignity, value, and honor in their lives and pursuits.

    At the same time, it is equally easy to see how its message could be viewed as

    pure cant: a moralistic fiction designed to quell the complaints of working

    about the onerous, unremunerative labor they performed for the

    benefit of the propertied. In this ballad, then, the ambivalent relation of a

    commercial popular culture to working people is clear—perhaps too clear.

    But even in subtler cases—even, in fact, in those ballads that seem to adopt

    dangerously subversive perspectives—the same principle applies. The rise of

    a commercial popular literature inaugurated a shift from a popular culture

    produced by the people to one produced for them. It gave them a new place

    in literary history, and a new impact on it, but only in the highly constrained

    role of consumers.


    This new form of culture emerged as part of what perhaps the single

    most important transformation in early modern socioeconomic history: the

    increasing prevalence of market-based forms of production and consum-

    tion, fueled by the labor and purchasing power of working people. At this

    key point, then, the impact of working people can be felt on literary and

    social history alike.'
