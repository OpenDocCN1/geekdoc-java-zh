    # A Commercial Form


    Popularity is an ambiguous idea: it implies widespread consumption, but also consumption
    by the most numerous class—the common people or the lower orders. There is little
    question that ballads were popular in the first sense; they were, as I noted above,
    the best-selling literary form in the second half of the sixteenth century to
    three four million, but only increased in the seventeenth century, reaching their
    peak after 1660.¹⁰ But what evidence is there that they were popular in the second
    sense, that is, in the class of persons to whom they appealed? Contemporaries,
    certainly, were convinced that they were. Books of the age were full of derision
