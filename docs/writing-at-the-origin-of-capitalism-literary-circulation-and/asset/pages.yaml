    It was not simply that more people were writing English, however. New patterns
    of textual circulation, influenced by England''s economic and institutional history,
    converged to elevate one particular variant of English to the level of a standard
    language, one that, increasingly, spread across the country as a whole. The commercial
    and political conditions of the Middle Ages gave England''s capital city a new
    preeminence—and ultimately conferred some preeminence on London English. With
    the growth of London as a center of trade, linking surrounding areas through its
    markets, streams of documents began between the capital and the peripheries. Merchants
    in the capital exchanged letters and accounts with factors and trading partners
    in smaller cities, and vice versa. England''s expanding bureaucracy also played
    a role in the proliferation of English-language documents originating in i, or
