    Whig policies both at home and abroad.\63 Whether he wished it to be or not, by
    the Restoration, Milton’s reputation as a writer was closely bound up both the
    domestic and foreign aspects of English policy. Milton’s late writings offer a
    glimpse of what it might mean for English writers to work in this milieu, in which
    a capitalist England was taking a new role on the world stage. Milton’s post-Restoration
    poems are, of course, closely concerned with domestic problems—above all, the
    aftermath of revolution and “the experience of defeat.” Perhaps more subtly, scholars
    have shown that they are concerned with England’s turn outward as a colonial empire.64
    They also, reflect the position of England, and an English literary culture, nearly
    poised to enter the European area.


    Milton’s final two works, Paradise Regained and Samson Agonistes, are the compositions
    of a writer returning to familiarity of literary circulation, but within a changed
    environment. Paradise Regained is, among other things, a meditation on authorship,
    with implications for the history of the vernacular. The idea of imitatio Christi
    does not usually extend to questions of authorship and publication. In the person
    of Jesus, Milton depicts a figure with suggestive parallels to the modern writer.
    Rather than selecting a more dramatic incident, Milton describes Jesus’s temptation
    in the wilderness, a period in which he retreats from the world, encounters Satan
    in an intellectual combat whose conclusion is foregone, and is finally ready to
    reveal his nature to the world, inaugurating the rise of Christianity.65 It is
    a structure that places the crucial emphasis on the new order of knowledge, rather
    than the concrete possibility of salvation. It is not difficult to discern connections
    between this episode and the work of the writer. For Jesus, as literary writers,
    a period of solitary labor and reflection forms the basis for public revelation


