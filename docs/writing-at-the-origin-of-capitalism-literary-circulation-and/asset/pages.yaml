    # Literary Consequences


    As a genre of writing, the seventeenth-century social diary seems to exemplify
    the values typically associated with the emergence of a capitalist literary culture
    in a number of important respects. In the diaries, lives of ordinary individuals
    became the subject of writing. Theoretically any man or woman could be the protagonist
    of his or her own diary, although in practice the requirement of literacy meant
    that diary writing was generally limited by class and, to an extent, sex. In their
    style, modern diaries were a rule decidedly simple and monotone. They did not
    make use of elaborate or variegated styles or exhibit a sense of literary decorum,
    a stylistic convention that, as I argued in the second chapter of this study,
    the literary culture of capitalism would ultimately erode. Diaries, further, compelled
    to focus on the everyday. Fundamentally anti-Aristotelian in form, they did not
    show the beginning, middle, and end of a single action, It was this focus on daily
    life, arranged day-by-day rather


