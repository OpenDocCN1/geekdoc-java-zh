    In paratexts, courtly writers imported elements of courtesy into print. They placed
    poems within networks of sociability and patronage, linking them to concrete occasions
    or physical locations as they reached a wider, decontextualized commercial public.
    In doing so, they sought to reproduce courtly or aristocratic modes of evaluation
    on the printed page. The judgment of the monarch himself, could be indicated through
    paratextual material of various kinds, signaling that the work in question had
    already been favorably received. The print market ought, ideally, simply to convey
    this judgment to a wider readership rather than seeking to their opinion—a hope
    that was, of course, doomed to be disappointed.


