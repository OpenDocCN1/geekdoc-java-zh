    # The Courtiers and the Market


    Caroline poetry crystallized in this  political climate. The literary identity
    of its courtly writers was formed in response to tensions between the court and
    market and the corresponding battles over the regulation of print. In what is
    only an apparent irony, the apogee of courtly literature in England was, among
    other things, a reaction to the growth of capitalism. The style of the courtly
    poets of this era developed in part as a result of the challenge of the market.
    Metacaphysical, meticulously concerned with questions of taste and judgment, elegant
    and amusing in style, personal and occasional in the theme, the poetry of the
    court looked outward to the challenges of an incipient bourgeois politics and
    culture inward to a literary model constructed around courtly sociability and
    hierarchy. It was this that gave it its unity, despite considerable differences
    in outlook and style on the part of individual poets⁴⁷


    The idea that the book market offered a contrast, and perhaps a rival, to the
    elite milieu of courtly literary circulation was not a new; it originated with
    print. By the 1630s, however, the relative status of print, and the print public,
    had shifted. En hostile writers shared a growing recognition that the book market,
    and the commercial public now played an essential role in the circulation, preservation,
    and even canonization of literature within their society.⁴⁸ Michael Drayton, writing
    in the 1620s, already refused to consider whose work circulated by “transcription,”
    that is, manuscript, as significant English authors, confirming his discussion


    ⁴⁷ Many recent studies emphasize the differences between the courtly writers of
    the 1630s, arguing that viewing them as a single group of “Cavalier” poets is
    anachronistic. See, for example, Smyth Pugh, Herrick, Fanshawe, and the Politics
    of Popularity: Classical Literature and Seventeenth-Century Romanticism (London:
    Routledge, 2010); Philip Major, Sir John Denim (1614/15–1669) Reessed: The State’s
    Poet (London: Routledge, 2016). Nicholas McDowell, attempting to recover the common
    identity of group, has suggested that theiralities lie in their use of Continental
    forms and allusions. McDowell is right to note the Continental affinities of the
    courtly literature of the period, especially its debt to French poets. The court
    was by its nature an international institution, and France exemplified the high
    courtly culture to which Charles argued—including, for opponents, absolutism.
    Nicholas McDowell, “Towards a Redefinition of Cavalier Poets,” The Seventeenth
    Century, Vol. 32, No. 4 (2017), 413–31. Neil Smith also offers insights into the
    international perspective of this “Cross-Channel Cavaliers.” The Seventeenth Century,
    Vol. 32, No. 4 (2017), 433–53.


