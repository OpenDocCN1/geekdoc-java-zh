    # Writing and Social Change


    Many of the most influential accounts of early modernity have revolved around
    questions of the social order and the relationships within it. As a primary site
    of capitalist development, early modern England was held to exemplify the point
    in human history at which market relations, and the legal infrastructure that
    supported them, began to supplant customary forms of association, including the
    lineal claims to status of the aristocracy. England always had a comparatively
    permeable aristocracy, with fewer legal distinctions between noble and non-noble
    status than was drawn on the Continent. But by early modernity, not hereditary
    judicial or military rights, had come to serve openly as the ultimate dividing
    line between gentle and non-gentle status. As E.P. Thompson writes, by this early
    Enlightenment "valued each other not in the sense of breed and antiquity but in
    annual sums."34 One seventeenth-century writer could describe a gentleman as anyone
    "by his wealth can live and bear the port of a Gentleman”—a formula that collapses
    gently into influence.35 If emergence of capitalism meant anything for English
    society, it surely meant the reconfiguration of class relations and social hierarchies.36


    For literature, this transition was to entail the flow of what might be roughly
    termed a court to a bourgeois register—a shift that, among other things, was well
    to have prompted the emergence of new standards of taste and sensibility, the
    gradual decline of heroic forms such as romance, and the rise of middle-class,
    realistic fashions; and the transformation of the reader into an individualistic
    literary consumer. As the art historian Arnold Hauser put it, "the bourgeoisie
    gradually took possession of all the instruments of culture—it not only wrote
    the books, it also read them, it not only painted the pictures, it also bought
    them."37 The contention that the period saw the emergence of a new culture of
    capitalism has been much disputed, and scholars have successfully demonstrated
    the complexity, and flux of cultural evolution within this era.


