    Beale''s scrawled notes record a list of words and phrases that would have been
    incorporated into the letters he wrote in his government position. It was designed
    for an epistolary as well as a practical context, featuring designed to note the
    receipt of information. Such phrases were apparently not already routine for Beale;
    rather, they had to be gathered and written down in order to help him navigate
    the demands of his position. Even a single, telling word, such as “adverteth”,
    was worth recording. For Beale, as most everyday writers, letters, documents,
    accounts, and business writing were the primary site of vernacular composition.
    Their writing was not highly rhetorical or literary, but it nevertheless had a
    profound impact on English prose.


    It is not easy, in any of these contexts, to draw a clear line between the grammar
    of writing and its style. In the sixteenth century in particular, a period in
    which prose was rapidly evolving, the two frequently converged. Work on Shakespeare
    had led the way in describing how a process of linguistic change detailed shaped,
    and was shaped by literary style and the cultivation of eloquence. But to gain
    a broader sense of this relationship, one that is grounded in the use of writing
    across the entirety of English society, it is necessary to look outside the theater,
    and inside literary writing, to the conventions developing in prose of practical
    documents. In addition to the sheer preponderance of such writings, they reveal
