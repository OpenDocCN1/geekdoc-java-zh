    their publishers to profit.$^{21}$ Thus the logic of the market dictated the fusion
    of the two senses of the word.


    Other aspects of the black-letter ballad trade followed from its commercial imperatives,
    including its comparatively broad geographic distribution. The ballad trade sought
    the largest number of consumers, who also could mean the most widely dispersed.
    This unique mode of distribution reflected this ambition. While many ballads were
    purchased in London, like other forms of print, peddlers also took ballads into
    the countryside. This practice is vividly illustrated by the ballad-seller, peddler,
    and pick-pocket Autolycus in Shakespeare’s Winter’s Tale, and was widespread at
    the time; by the end of the seventeenth century, there were at least 2,880 licensed
    peddlers working in England.$^{22}$ The distribution of ballads through peddlers
    marked an important difference between ballads and books geared an elite market.
    More expensive volumes made their way into the periphery via efforts of those
    who wished to read them, or by means of booksellers in provincial cities. Ballads,
    however, were able to seek out their own customers across the countryside.


    As a result, publishers of ballads could anticipate a popular audience that was
    supral—an audience that, potentially, include any of the working people of England,
    not just the people of one particular district or county. It was precisely this
    feature of the ballad with which the dramatist and pamphleteer Henry Chestle took
    issue in his polemic Kind-Harts Dreame (1592). His character Anthony New Now’s
    chief complaint was not the dissemination of ballads in London. Well aware that
    “these lascious songs” began in the nation’s capital, he objected to the fact
    that “then they spread as from a spring...in every peddler pack sent to publish
    meetings in other places.$^{23}$ For Chestle, as for many of his contemporaries,
    London was the source of a vast of ballads spreading over the countryside. The
    ballad, Chestle grasped, was creating a national market for popular literature.


    What is striking about each of these aspects of the ballad trade is how closely
    it reflects the fundamental dynamics of an emerging capitalism.


