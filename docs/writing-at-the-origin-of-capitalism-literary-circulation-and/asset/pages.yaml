  md: '# INTRODUCTION: CAPITALISM AND COMMUNICATIONS 3


    it has considerable power in illuminating dynamics and interests that of of necessity
    extend across social spheres—and across modern disciplinary boundaries.


    There are particular benefits to considering the production of books and manuscripts
    within the history of labor, class conflict, and consumption more broadly. The
    prices of books and broadsides are routinely calculated—but can the meaning of
    those figures be understood without comparing them to that of other commodities,
    or, for that matter, without reflecting on the changing wages and shifting forms
    of property in sixteenth- and seventeenth-century England? Can the effects of
    the circulation of print from London outward to the rest of England be comprehended
    without reference to the capital''s role as the principal hub of commerce in an
    increasingly centralized market? Can the significance of changing literacy rates
    be grasped without considering the new importance attached to reading a world
    of contracts, leases, and bonds? This study suggests that they cannot; rather,
    the logic of literary production in this period must be interpreted as part of
    the socioeconomic history of early modern England in an age of capitalist transition.


    The phrase "capitalist transition" raises a second sense in which Marxist methods
    run counter to influential tendencies in literary history today. Decades of critique
    have taught literary scholars that historical theology must be avoided at all
    costs. The sweeping narratives that once structured interpretations of early modern
    England—some, admitted, earlier simplistic or triumphant—are no longer embraced,
    although influence influence lingers in a shadowy form. As one Renaissance scholar
    notes approving in a recent survey of the field, "literary scholars have largely
    left behind non-Marxist or Foucauldian masters, and instead closely scrutinize
    the contexts that produced the texts they study, often drawing on up-to-the-minute
    historical research."


    Marxist theory, by contrast, offers what is the prototypical "grand narrative"
    in its account of the rise of capitalism. It shows how the transition to capitalism
    must be understood as a systematic transformation rather than an example of simple
    continuity or even the slow accretion of contingent changes. Like the period designation
    "early modernity," the idea of capitalist transition proposes that history has
    a directionality; unlike "early modernity," it has a causal edge, implying that
    the engine of historical change can


