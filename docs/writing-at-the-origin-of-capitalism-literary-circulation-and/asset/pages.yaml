    # # The Problem of a Courtly Literature


    # ## Introduction


    The rise of capitalism in seventeenth-century England prompted the birth of a
    new aesthetics—and the death of an old. Like the literature of much of Europe,
    sixteenth-century English literature was written in proximity to the court; even
    writers working outside its charmed circle typically cast an eye in its direction.
    A courtly ethos shaped the writing of the Elizabethans, producing a literary theory
    that collapsed style into decorum, and skill into aristocratic elegance.¹ Unlike
    the Early Stairs, courtly aesthetics retained a powerful influence on the wider
    literary culture. And already in the beginning of the seventeenth century, it
    was evident that a rival set of literary values was gaining ground.


    In the 1630s, the decade on which I focus in this chapter, courtly literature
    at once reached its most developed and precarious form. Poets working in and around
    the Caroline court, such as Thomas Carew, John Suckling, William Davenant, and
    Ben Jones, produced exquisitely refined lines infused with monarchical symbolism,
    much of it adapted from France. Many poets also wrote masques, quintessential
    form of the court, which reached its greatest height of accomplishment and display
    in this decade, its last. Yet despite their dazzling skill, the lyrics of the
    1630s betray that they were all too aware of the formidable challenge posed by
    the book market and commercial theater to a literature predicated on the importance
    of rank, interpersonal connection, and patronage. Their poetics was, in part,
    a retort to the wider environment in which they wrote. The courtly poetry of the
    Caroline era was thus a poetry of reaction, as the values of a commodified, market-driven
    literature began to overtake aristocratic forms of style, taste, and decorum.


    >  Daniel Javitch describes how Puttenham adapted elements of Castiglione to English
    poets suited to courtiers in “Poetry and Court Conduct: Puttenham’s Art of English
    Poets in the Light of Castiglione’s Cortegiano,” MLN, Vol. 87, No. 7 (1972), 865–82.


