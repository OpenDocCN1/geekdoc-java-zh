    In England, literary property emerged from an extended process of negotiation
    between the government and trading interests, which attempted to accommodate the
    overlapping but far from identical interests of each. The crucial element was
    the 1557 grant of exclusive rights to print to the Stationers'' Company—that is,
    a government monopoly. From the perspective of the Crown, the restriction of printing
    rights to a single entity enabled a stricter, although imperfect, control of expression.
    For the Stationers, monopoly was the precondition for intellectual property. As
    a result of their exclusive right, the Stationers were able to coordinate amongst
    themselves avoid infringing on one another''s property, using company ordinances
    and the adjudication of their governing body, the Court of Assistants. Monopoly
    and the grant of royal privileges, therefore, were foundational aspects of the
    early modern market.


    By the early Stuart, the book trade was in a bricolage of monopolies. Beyond the
