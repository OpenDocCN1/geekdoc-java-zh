  md: '# # Introduction


    # ## Capitalism and Communications


    # ### The Method


    This book is an experiment in joining two approaches to early modern English literature
    which, despite a seemingly obvious affinity, are rarely pursued together: the
    material history of texts and Marxist historical analysis. No trend in scholarship
    on sixteenth- and seventeenth-century literature in the past three decades has
    been more important than the rise of research on media, not confined to the history
    of the book or even manuscript, but encompassing communications as a whole. A
    wide variety of phenomena, including by many means limited to methods of papemaking
    and bookbinding, readers'' habits of annotation, and the development of the postal
    system, have been shown to be relevant to early modern textual and literary history.¹
    There is now an abundance of detailed, empirical research, which of it extremely
    illuminating, how texts were made, circulated, and read. Scholarship even extends
    to the reuse, waste, and decay of books and papers.³ As one leading book historian
    remarks, “attention to the material form has grown so pervasive among literary
    critics” that it now appears to be an “inevitable” set of questions and interests.³


    +   ¹ A comprehensive citation of work in this field would not be possible, but
    landmark studies in book history include Elizabeth Eisen, The Printing Press as
    an Agent of Change: Communications and Cultural Transformations in Early Modern
    Europe (Cambridge: Cambridge University Press, 1979); Roger Charter, The Order
    of Books: Readers, Authors, and Libraries in Europe Between the Fourteenth and
    Eighteenth Centuries, Lydia G. Cochrane (Stanford: Stanford University Press,
    1994); Adrian Johns, Nature of the Book: Print and Knowledge in the Making (Chicago:
    The University of Chicago, 1998); and more recently, Anthony Gray, Inky Fingers:
    The Making of Books in Early Modern Europe (Cambridge, MA: Harvard University
    Press, 2000).


    +   ² Anna Reynolds, “Such dispersive pasiquette: Early Modern Encounters with
    Bounding Waste,” Journal of the Northern Renaissance, Vol. 8 (2017), 1–43; Emily
    Butterworth, “Apothecaries’ Cornets: as Waste in the Renaissance,” MLN, Vol. 133,
    No. 4 (2018), 891–913.


    +   ³ Adam Smith, Material Texts in Early Modern English (Cambridge: Cambridge
    University Press, 2017),


    Writing at the Origin of Capitalism: Literary Communication and Social Change
    in Early Modern English, Julian Werlein, Oxford University Press. Julian Werlein
    2021. DOI: 10.1093/9780198869467.001.000'
