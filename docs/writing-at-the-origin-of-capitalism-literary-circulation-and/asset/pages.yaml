  md: '# ENGLISH LITERATURE ABROAD 155


    Milton, Spenser, Shakespeare, and Jonson—a version of the Renaissance canon persists
    to this day. As Daniel’s formulation suggests, Milton’s place in that illustrious
    company was largely the result of Paradise Lost. By importing the character of
    the classical epic into a national idiom, Paradise Lost simultaneously looked
    backward to a literary sphere united by a single language, and forward to an era
    in which Europe was divided into distinct languages and polities. Milton, living
    most of the seventeenth century, encapsulated the changing position of English
    literature within his period. John Denham, the author of the famous poem “Cooper’s
    Hill,” is said to have ever entered parliament with sheets of the newly published
    Paradise Lost in his hands, saying that it was“part of the Noblest Poem that was
    ever wrote in Any Language, or Any Age”—a formation that simultaneously suggests
    growing confidence and residual insecurity about the place of English literature
    among the ancient and modern languages. Writing on the border of two eras, Paradise
    Lost marked Milton as once a “Renaissance” and an “early modern” poet. As Jack
    Lynch has remarked, it was precisely the transitional character of Paradise Lost
    ensured its “classic status” within a few decades of Milton’s death, perhaps prior
    to any other English literary work.$^{75}


    By the time Milton wrote his influential series of articles on Paradise Lost,
    it was clear that Milton had achieved the literary status in English to which
