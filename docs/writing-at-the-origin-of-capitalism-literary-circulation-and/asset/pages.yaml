  md: '# 160 WRITING AT THE ORIGIN OF CAPITALISM


    vanished.2 Contemporary bestsellers often focus on work or domestic relationships,
    the stuff of ordinary life, described in equally commonplace prose—although the
    increasing prominence of genre fiction may signal yet another transformation.3


    Above all, the continuities between literary style and the modes of production
    through which literature is published and circulated are more obvious than ever.
    No one seeks to hide the entanglement of cultural commodities and commerce—on
    the contrary, a vast industry of publicists and journalists constantly call attention
    to it. In a moment in which capitalism and media are so obviously connected, examining
    the literature of early modern England reveals a culture that is both familiar
    and strange. The era shows that the contemporary social system, the economy and
    culture of capitalism, has a long history and a deep logic. But it also suggests
    that it is neither inevitable nor immutable.


