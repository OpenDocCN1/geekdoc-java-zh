  md: '# WRITING AT THE ORIGIN OF CAPITALISM


    found in a new set of social and economic relations and the conflicts and competition
    they produced. Insofar as scholars have begun to doubt this proposition, they
    have ceased to use the term “capitalism,” preferring adjectives like “industrial,”
    or “modern,” or conversely, “traditional” or “premodern”—words that, by E.P. Thompson
    wrote, “offer themselves with a specious scientism, as if they were value-free.”
    An emphasis on the gradual nature, complexity, and contingency of the historical
    process has seemed to warrant the rejection not only of Marxist analysis, but
    of the account of a transition to capitalism itself.


    Yet the idea that early modernity the emergence of capitalism has immense power
    for the analysis of early modern literary history, and this is perhaps why, though
    it has often been critiqued, it has never been discarded. Here, as elsewhere,
    the implications of this approach for the history of texts is particularly suggestive.
    England’s economic transition coincided with the transformation of its textual
    culture. The most important aspect of that transformation was the incredible and
    unprecedented proliferation of texts that occurred in the period. Like other European
    polities, England saw an exponential leap in the quantity of writing in circulation—a
    fact that contemporaries noted incessantly. As one writer observed, “the world
    is full of idle books, and frivolous youths.” To extent, the increased amount
    of writing in circulation must be attributed to the technological miracle of print,
    whose adoption and refine constitute of the clearest watersheds in the history
    of literature. But the rise of English writing was never merely a question of
    the printing press: quantities of manuscript soared. As Mark Bland has shown,
    in 1600 only a quarter of the paper imported into England was used for print;
    the rest went to manuscripts. At the same time, new channels of distribution and
    new methods of organization, from commercial publishers to government archives,
    arose in tandem with the growth of written matter.


