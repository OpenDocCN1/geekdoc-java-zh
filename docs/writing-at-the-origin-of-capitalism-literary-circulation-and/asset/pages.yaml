    # From Italy Northward


    Even in its earliest beginnings, the evolution of the diary was connected with
    the history of money. Although the diary is, strictly speaking, a sixteenth-century
    form, many of the techniques diarists would use first appeared in the late medieval
    Mediterranean, at a turning point in the economic history of Europe. By the end
    of the Middle Ages, the city states of the Italian peninsula pioneering new forms
    of commerce, some borrowed from the Arab world, others created through the demands
    of use. Florence, in particular, established itself as the trade and banking capital
    of Europe, the central node in a network of commercial relations that spanned
    the continent and extended outward into Africa, the Middle East, and Asia. Because
    the trade of Europe was conducted not merely in coin, but on paper, new commercial
    forms necessarily implied new forms of writing. Merchants began to use sophisticated
    financial instruments and to maintain detailed records. To keep track of their
    finances, they adopted double-entry keeping, making it possible to distinguish
    income from capital. Legal paper multiplied, to be used—if necessary—in commercial
    courts. Currency itself was altered as merchant bankers accepted deposits and
    issued loans for their fellow citizens and the merchants and princes of Europe,
    using bills of exchange as both means of transferring funds and issuing credit.
    These paper instruments—“ghost money,” as Braudel evocatively described them—“gradually
    invaded the economic life of Europe.”^10


