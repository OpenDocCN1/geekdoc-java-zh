    The tenuous position of courtly poetry was only a species of a larger issue, however.
    Between 1629 and 1640, Charles I ruled without a parliament, asserting his prerogative
    powers of government and putting forward a patriarchal ideology of kingship, bolstered
    by Arminian religion. A decade of heightening tensions followed—by many of them
    in character, as the Crown sought—and ultimately rule a society increasingly organized
    around market relations. Courtly literature participated in this wider context
    and derived much of its meaning from it.


    In this chapter, I seek to shed light on the character, and ultimately the eclipse,
    of courtly poetry by situating it within the history of economic conflict between
    the court and a nascent capitalist society. Tensions over the book trade, its
    intellectual influence, and its royal regulation recounted controversies between
    the prerogative control and the growing commodity market. In my approach, I draw
    upon the research of historians of the book trade even as I attempt to recontextualize
    it. For Marxist scholars, linking literary form and socioeconomic change is one
    of the core tasks of literary history, and there is no shortage of interpretations
    of the ideology of the writing composed in the period leading to the English Revolution.
    With some important exceptions, historians have generally been more reluctant
    to draw such connections, whether because of the discipline’s emphasis on empiricism
    or for this rise in a period when economic explanations of social change, Marxist
    or otherwise, had come to be reductive.


    Perhaps more to the point, Marxist interpretations of the causes of the English
    Revolution, including the period of Caroline rule, today have few adherents in
    the academy. With the rise of revisionist historiography, historical materialist
    explanations of the Revolution received a formidable setback. For Revisionists,
    such explanations were too simple and too teleological—they were seen, in Conrad
    Russell’s memorable phrase, through “the distorting medium of hindsight.”³ Via
    the work of scholars such as Kevin Sharpe, revisionism shifted scholarly perceptions
    of the literature of the 1630s, promoting an Namierite understanding of the court
    as a site of individual interests and rather than


