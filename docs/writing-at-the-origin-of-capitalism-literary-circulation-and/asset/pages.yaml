    have an evident bearing on the history of style and form, such as we writes, who
    reads, in what circumstances, and why. Knowing whether a particular genre circulated
    among trades or nobleman—or whether it was sold on an open market where it might
    be purchased by either—is of course essential to analyzing its formal development.
    More than that, in such cases the question of textual circulation can serve as
    the most direct point of connection between the economy, on one hand, and literary
    style, on the other. It was with this understanding of the social basis of literature
    that I sought to write a literary history grounded in the production and circulation
    of writing across society as a whole, not in the political content of individual
    works.


    Taken together, the case studies in this book, then make an argument for the seventeenth
    century as an era of transition in the style and form of literature, as well as
    its material history. In particular, occupying many of its pages. The first is
    the emergence of a simple, practical, descriptive English prose. It was through
    the却是 character of practical writing within a market society where new conventions
    of prose emerged—and more fundamentally, that prose triumphed over move to the
    heart of literary history. A basic English prose, concerned with precise description
    and the forms of production and consumption that structure daily life, developed
    in texts at the threshold of literary forms and forms of documentation. The second
    is the rise of a new kind of literary value, mediated by the literary market,
    which placed a theoretically vast, yet in practice highly highly circumscribed,
    power in the hands of the literary consumer. The slow attenuation of rival sites
    of literary circulation, including local literary cultures and aristocratic coterie
    writing, and the erosion of their codes of composition and evaluation, was one
    consequence.


