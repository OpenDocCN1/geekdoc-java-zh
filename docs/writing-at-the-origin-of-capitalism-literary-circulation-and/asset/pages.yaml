    foundations of English life that the modern English word for an agricultural proprietor,
    “farmer,” originated as the term for a middleman: “one who undertakes the collection
    of taxes, revenues, etc., paying a fixed sum for the proceeds.”—25 Here, too,
    capitalism left its imprint on the language.


    At the base of the social pyramid, change was no less radical. For those who worked
    on the land, the introduction of a competitive, commercial agriculture had profound
    effects. In many areas peasant life was altered,” Jan de Vries, and “and in one
    country, England, lost many of its essential characteristics.”—26 Rather than
    producing goods for their own households or for their landowners'' estates, many
    peasants were forced to produce primarily for the market in order to pay rising
    rents—and so they ceased to be, in the classic sense, peasants began to work as
    wage laborers on others’ property. The mobile supply of needy workers who emerged
    in this period would become a permanent feature of modern life, laying the basis
    for a later industrial workforce.


