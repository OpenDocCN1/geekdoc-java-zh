    Taking the development of a standard English as part of a larger history also
    helps to explain features of literary style and genre. Many scholars have noted
    that in early modern English, prose gradually eclipsed verse as the essential
    medium. A few, such as Franco Moretti, argued that the prose was connected to
    the rise of a bourgeois literary culture. It is impossible, he writes, “to imagine
    the medium of prose without immediately having of work” (18). But although Moretti’s
    point make intuitive sense, the mechanism linking prose to bourgeois society and
    argue that its ethos of work has left rather vague. In what follows, I argue that
    the standardization of English prose through capitalist practice, including mercantile,
    legal, and bureaucratic documents, had an impact on its form in every other sphere
    as well. At the same time, the great practical utility of prose—for those who
    could read—granted it new prestige in the culture as a whole, including in its
    literature. As I will suggest in the concluding sections of this chapter, readings
    of the plain style and of the emergence of new prose genres around 1600 follow
    from this claim.


    # The Medieval Origins of Early Modern English


    In order to grasp the significance of the transformation of the English language
    that occurred in the late Middle Ages and the early modern period, it is necessary
    to glance at the situation that preceded it. In the middle of the fourteenth century,
    English was not yet a standard language. Standard languages, in one influential
    formulation, are those that combine “minimal variation in function.” That is to
    say, they are codified across the geographic area in which they are used, with
    a single set of norms governing spelling, grammar, syntax, and vocabulary. Relatively
    stable across time as well as space, they do not tend to undergo rapid fluctuations.
    As a result, standard languages are typically written


