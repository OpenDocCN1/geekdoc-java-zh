    illustrating some aspect of the ballad''s subject. These images made ballads attractive
    as material objects, rather than simply as songs or performances, an element of
    their construction that led to their frequent use as a form of interior décor
    or wallpaper, especially in ale houses. Another element of their design pointed
    toward the partially oral character of the genre: they began uniformly to be printed
    with the name of the tune to which they were set.


