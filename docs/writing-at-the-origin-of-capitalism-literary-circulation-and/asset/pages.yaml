    As a popular literary market was emerging, ordinary people were coming to depend
    on the market for a growing share of their consumption. In the early seventeenth
    century, such markets were widening their geographic reach, linking more regions
    together: in some cases, such as the cattle trade, markets became national or
    quasi-national in character. In the print trade, so in commerce as the growth
    of nonlocal markets enabled, and was driven by, the growth of London. By the seventeenth
    century, the metropolis was the hub of England and Wales, a major market for agriculture,
    and the point from which imported goods and many specialized products were disseminated
    to the rest of the country.² Even when goods did not actually pass through London,
    its size as a market helped to set uniform prices for the country as a whole.²⁵
    The effect was measurable: one economic historian has calculated that in seventeenth-century
    England, the average gap between prices of wheat in different cities was thirty
    percent, compared to thirty-one percent in Spain, twenty-four percent in France,
    and twenty percent in the Netherlands, suggesting a precocious degree of market
    integration.²⁶


    It would, of course, be a mistake to think that the markets of early England as
    fully national, much less frictionless. They were far from the ideals of economic
    theory, or even the powerful and predictable markets of the eighteenth century.
    Regional variation was not the exception but rule; much of the economy, like the
    culture, was still local. Yet it was still possible to speak of a process of market
    development as society moved toward a new era in its economic history: “the dominant
    impression of much of England and Wales in the early seventeenth century,”²⁷ Keith
    Wrightson notes, “is that of a society which was interconnected by commercial
    transactions as never before.”²⁸ To understand the patterns of these markets,
    it is necessary to look beyond the accumulation of expensive or exotic objects
    and their wealthy purchasers to cheap commodities and the ordinary man and women
    who bought them.


