    entered a new phase. In some respects, the development of the vernacular was an
    extension of late medieval trends. Yet there was novelty as well as continuity
    in the literary and linguistic culture of Renaissance Europe: here, as elsewhere,
    changes in quantity produced changes in quality, defining a new epoch in the history
    of the vernacular. So evident is the expansion of textual culture in the sixteenth
    century that many scholars have sought to equate it with reference to forces that
