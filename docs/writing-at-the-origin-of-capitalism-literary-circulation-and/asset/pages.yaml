    In order to illustrate this point, I take one writer as a case study: John Milton.
    Milton’s career and reputation were intimately intertwined with England’s international
    endeavors. In his work as a poet and translator for the Council of State, Milton
    presented the case for the revolutionary English government to the Continent in
    Latin and translated official correspondence from English to Latin and vice versa.
    He lived and worked at the interface of an international, European, Latin tradition
