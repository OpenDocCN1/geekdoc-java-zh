    In this respect, the literary culture of the vernacular was part of a broader
    pattern of European development in the sixteenth century. Over the course of the
    period, new connections and divisions simultaneously appeared across the European
    continent. Individual communities were united by increasingly dense ties of trade,
    which brought disparate regions into contact. Many areas became economically interdependent,
    as a number of regional specializations developed, from Baltic timber to Eastern
    European grain. Yet new trade meant competition as well as exchange; it could
    lead to widening economic disparities as well as shared material cultures. In
    politics, a similar pattern held. New networks of communication and diplomacy
    spanned the capitals of Europe, yet at the same time, in an age of state formation,
    religious hostilities, and near-constant warfare, the separating polities were
    etched ever more deeply. Some of the regions that were united into what J.H. Elliot
    described as “composite monarchies” in the sixteenth century would become territorial
    states in the seventeenth century, whose borders were, at least in theory, permanent
    divisions separating one people from another.


    The literary culture of the vernacular participated in the simultaneous centripetal
    and centrifugal tendencies of the period. Writers wrote with a keen awareness
    of cultural, political, and linguistic difference. They knew, of course, that
    Europe was not monolingual, and that their compositions would be unintelligible
    to many of their neighbors. Yet this did not mean that they wrote merely for a
    domestic audience. As vernacular culture created rapid growth of translation meant
    that writers might well be read in another language than their own. The era thus
    inaugurated, in the formula of Franco Moretti, the “unity at the price of diversity”
    that would characterize European literature.


    The first vernacular works to receive significant currency outside their language
    of origin come from the most economically advanced region, the Italian city states.
    Already in the fourteenth century, Italian authors were read in translation abroad.
    Gradually, Italian writers would become icons of authorship for the rest of Europe.
