    By the end of the sixteenth century, the sentence had become a much clearly defined
    grammatical unit than it had been a century earlier. Still, its development was
    gradual and uneven: it was a process of evolution driven by new habits of composition
    and the influence of new media, not a sudden transformation. Although by 1600
    everyone used punctuation to delimit sentences, the distinction between periods
    and semicolons was much less clear-cut than it is today. The extraordinarily long
    sentences of Renaissance prose can be attributed to the indefinite of sentence
    boundaries. In addition, the heavy use of sentence-initial conjunctions, such
    as “for,” “and,” or “but,” suggests an attempt to distinguish sentences lexically
    rather than punctuation—a conception of the sentence as still partially oral than
    wholly literate.⁵² The slow character of this process notwithstanding, this era
    marked the rise of the sentence as the organizational unit of English prose.


    Many other features of English prose were closely connected to the development
    of sentences, and in turn revealed the increasingly literate character of English
    writing at this moment. As the part of speech responsible for linking units of
    prose, conjunctions necessarily responded to the redefinition of linguistic units.
    Oral discourse is highly paractic, marked by a much higher use of “and” than writing,
    and a great deal of fifteenth and sixteenth-century writing, even by relatively
    well-educated writers, shared this characteristic. Over the course of the seventeenth
    century, it is possible to see the regular use of a wider range of coordinating
    conjunctions; in the largest digitized corpus of English letters from the period,
    it has been shown that the use of “but” prose in proportion to “and” in this era.³³
    At the same time, subordination became more common, creating the possibility of
    more complex sentences. Such small shifts had profound consequences for the organization
    of writing. They created something a baseline literate style, a set of common
    grammatical devices and syntactic forms that were part of the appearance of a
    standard, written English.


