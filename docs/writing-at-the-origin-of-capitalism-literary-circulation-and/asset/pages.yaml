    # Capitalism and the Rise of Prose


    The rise of a standardized English prose had pervasive effects on literature,
    the full implications of which only became apparent after the bulk of linguistic
    standardization had been achieved. By the end of the seventeenth century, if not
    earlier, prose and verse would emerge as the core of the English literary system.
    In the same period, the importance of prose for literature would become clearer
    with Bunyan’s Pilgrim’s Progress and, early in the eighteenth century, with the
    novels of Defoe, including Robinson Crusoe and A Journal of the Plague Year. The
    emergence of stylistic and linguistic correctness as a prevailing ideal would
    with periodical culture, new forms of literary criticism, and a growing consumer
    market in the eighteenth century. Yet all of these changes were associated with
    a later period, their roots can all be traced to the end of the sixteenth century,
    at a moment when vernacular writing became central to the organization of society,
    the administration of the state, and the creation of a unified, national market.


    Around 1600, English literature saw a sudden efflorescence of short, ostensibly
    factual forms of prose. The late Elizabethan and early Stuart era was, in general,
    a period of concentrated literary invention in England; the novelty of the drama
    and poetry written in these years is well known and much celebrated. But the new
    forms of prose that emerged at this moment, while less overtly eloquent, proved
    equally important for cultural history. The diary, the essay, the character book,
    the printed familial letter, and the news sheet or coranto emerged roughly contemporaneously
    in English to become influential forms; with the exception of the character book,
    which disappeared despite an attempt by no less than George Eliot to revive the
    form, all had long legacies.³⁷⁷³ The diary, whose evolution took its modern form
