    # The Restoration and Europe


    When the Restoration was restored in 1660, the Crown and its supporters attempted
    to create the illusion of an unbroken continuity between the reign of Charles
    I and that of his son. Through the Act of Oblivion, they sought to draw a veil
    over nearly two decades of English history. In some respects, the Restoration
    did really an uneasy return to older modes of power. By many of the innovations
    of the Interregnum could not be undone. Older political forms and property relations,
    in particular, could not be reestablished. The remaining Restoration parliament
    moved quickly to confirm the abolition of the remaining feudal tenants and the
    institutions associated with them as the Court of Wards, for which William Blackstone
    thought “a greater acquisition to the civil property of this Kingdom than even
    Magna Carta itself.”^59 Instead trying to “live off one,” the monarch was to be
    funded by regular taxes, a mode of financing made his dependence on


