    plural but economically interconnected Europe. This is particularly true of his
    post-Restoration poems. In one crucial respect, these works can claim priority
    in English literature: they were surely the first major works of English literature
    to be written by an author who already possessed, and he possessed, a European
    literary reputation, albeit a highly ambivalent one. Taken as both an exemplar
    of English literature, then, and as a theorist of literary renown in his own right,
    Milton helps to place England’s literary history within the framework of its seventeenth-century
    political and economic expansion. “Pastures new,” in the phrase of Lycidas, were
    precisely what awaited early modern English letters.


    # The International Author


    In the first chapter of this study, I described the rise of a single vernacular,
    showing how the making of a standard English prose was connected with the country’s
    capitalist development. The rise of the vernaculars, however, was a process that
    occurred in the plural, and it is to the consequences of this plurality—that is,
    the case given to European literary history by the multiplicity of languages and
    politics in Europe—that I now turn. By the end of the seventeenth century, the
    process of vernacularization was well underway throughout Europe. Dialects onto
    a written form, received the acceptance of communities and the sanction of the
    authorities, and became languages. Writers endeavored to make full use of their
    native tongues, and indeed so, expand their resources of eloquence and copiousness.
    In doing so, they looked to the example of their neighbors, in a literary culture
    characterized at once by heightened exchange and increasing rivalry.


