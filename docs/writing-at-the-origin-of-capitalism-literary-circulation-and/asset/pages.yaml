  md: '# WRITING AT THE ORIGIN OF CAPITALISM


    view of fame is mistaken. Among enemy nations and warring religions, as among
    angels and devils, fame is indeed double-mouthed. Her mistake, rather lies in
    making a relativistic equation between the variability of fame and an underlying
    instability of values.


    What response should we take to a fame that is so variable and partial? The answer,
    Milton imples in Samson Agonistes, is simply to ignore human fame in favor of
    divine judgment. For writers, this task is not so simple as it might seem. Writers
    work within a public world. That is structured by divisions, by reputation inevitably
    varies by people and by region, that fact cannot help but be crucial for literary
    history. Milton, that is, in a milieu in which he anticipates and preemptively
    reacts to opposition and incomprehension. In, the alien environment he expects
    his writing to encounter is the world of Restoration England. But it is also,
    for all writers who seek to the European canon, the intricately partitioned world
    outside the domestic sphere. For Milton, who had more experience of this world—and
    its potential for hostility—most of his contemporaries, this is one reason the
    nation becomes so salient a theme for literary history and literary fame in his
    final verse compositions.


    In different ways, both of Milton''s final works reflect the problem of literary
    reception within an international arena. In the second half of the seventeenth
    century, Milton saw that it was not possible to serve literary history from his
    relationship to particular nations, as he had done from his earliest writing.
    But what his own experience had led him to intuit that was, even for England,
    the national need not be insular; rather, it could be the privileged pathway to
    the international. Of course, in the 1670s this possibility coulded only dimly.
    Yet there was a long way to go before English authors could expect immediate translation
    and reception in neighboring vernaculars, the situation was already considerably
    different from what it had been when Milton published his first poem in Shakespeare''s
    second folio.


    # Europe and Beyond


    In the decades following his death, Milton became a canonical author in England.
    “The British Muse,” the poet Richard Daniel wrote in 1706, launch English literature
    with Chaucer, before inspiring “An Eden lost and won, A Fairy Queen / A More to
    Dubts betray, and lofty Cataline.”74


    > 74 Richard Daniel, The British Warrior, a Poem. In a Letter to his Excellency
    the Lord Cutts, occasion''d by the late glorious Success of her Majesty''s Arms
    (London, 1706).'
