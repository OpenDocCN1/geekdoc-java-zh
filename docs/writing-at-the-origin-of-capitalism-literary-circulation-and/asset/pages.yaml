  md: '# # Conclusion


    # ## The Arc of Change


    The formation of a national market in sixteenth- and seventeenth-century England
    was both predicated on and entailed a revolution of communications, which altered
    the patterns of circulation, form, and character of English writing. Many aspects
    of the literature of early England, in turn, developed in response to these changes
    in the use and dissemination of texts. Taken together, these two simple assertions
    outline the argument of this book, while investigations of its implications make
    up its substance.


    In this approach, I have sought to make use of the now considerable of book and
    textual history, as well as to honor the spirit of empiricism that drives that
    subfield—even if I have used it for some practitioners will surely see as unorthodox
    purposes. Above all, however, I have attempted to write a Marxist literature that
    considers textual history, rather than ideology, as an essential connection between
    capitalism and literature. This is not to deny that the analysis of ideology can
    be highly illuminating for the study of literature. The social and political orientation
    of writers shapes their work deeply, and is a major part of why we find literature
    interesting to read, even if we read across the chasms opened by the passage of
    centuries. But readings of the ideology of literary work can become readings of
    the literary work as defined solely by its textual coordinates. This, goes without
    saying, is a mistake; “literature,” as Terry Eagleton writes, "is not some form
    of documentary access to ideology."¹


    Paradoxically, the more crude materialist perspective I have adopted in drawing
    connections between a national market and a national sphere of textual circulation
    may, in the end, leave greater scope for literary interpretation than some overtly
    intellectual modes of analysis. Many of the


