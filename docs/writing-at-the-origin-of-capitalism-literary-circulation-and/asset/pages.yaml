    # # The Beginnings of Literary Mass Culture


    # ## Introduction


    In any account of the origin of capitalism, the transformation of the lives of
    the common people necessarily plays a central role. The labor of the masses, their
    use of land and money, their modes of reproduction, and their acts of resistance
    are obviously matters of the greatest importance for understanding broad patterns
    of social change. To attempt to describe the growth and reconfiguration of the
    English economy without reference to the ordinary people whose daily work and
    habits of consumption drove it would be a self-evidently hopeless enterprise.


    Yet studying the lives and experiences of the common people raises notorious difficulties.
    In early modernity, in prior periods, working people left few written remains.
    Though rising rates of literacy were found among rural laborers, the majority
    of them still could not read, much less write or publish books. The traces oral
    culture left behind suggest that it was rich and varied; such although influenced
    early modern texts in innumerable ways—but more often than not, it is impossible
    to reconstruct. As a result, in the scholarship of early modern as elsewhere,
    working people are seen rather than heard, glimpsed—typically in distorted form—in
    the pages of elite writers. Even for early modern historians, silence raises challenging
    problems of method and interpretation. As Tim Harris cautions, "we must not confuse
    what the elite perceived and feared with what ordinary people actually believed
    and practised."^1 For literary scholars, whose focus is on grasping the reality
    revealed by texts, the texts themselves, this state of affairs ensures that the
    common people are at best marginal to any account of the period''s literature.


    And there is one sense in which working people could be said to have had a decisive,
    indeed transformative, effect on the literary history of the seventeenth and eighteenth
    centuries.


    ^1 Tim Harris, "Problematising Popular Culture," in Tim Harris, ed., Popular Culture
    in England c.1500–1800 (London: Macmillan, 1995), 6.


    Writing at the Origin of Capitalism: Literary Circulation and Social Change in
    Early Modern England. Julianne Werlin, Oxford University Press. © Julianne Werlin
    2021. DOI: 10.1093/oso/978018869467.0003'
