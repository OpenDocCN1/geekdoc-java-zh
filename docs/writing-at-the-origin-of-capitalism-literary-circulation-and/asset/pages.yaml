    a quid pro quo for his financial support of the Scottish campaign. It was an illustration
    of how a dense network of courtly connections spanned politics and trade, including
    the book trade, as well as an instance of how English politics had become intermeshed
    with archipelagic conflict in the years immediately preceding the revolution.


    In the 1630s, the print trade came to be a site of controversy. In opposition
    response to questions of Church government and royal revenue, Charles strove to
    suppress expressions of dissent, preventing “seditious” books and pamphlets from
    reaching press or from publishers after the fact. In doing so, he was behaving
    as his predecessors and peers had done; all European monarchies attempted to control
    the press. By the era of the Personal Rule, however, controversies took a new
    significance, as began to be absorbed into wider divisions over the role and scope
    of Charles''s administration. Gradually, freedom of expression came to be seen
    as aligned with market freedoms, censorship, conversely, with prerogative control.


    To some extent, this history has been elided by the fact that the most influential
    early essays focused on either the political or the economic foundations of press
    censorship, rather than the two jointly. In a landmark essay, Christopher Hill
    argued that seventeenth-century censorship was designed “to prevent the circulation
    of dangerous ideas among the masses of the population.” For Hill, the system was
    largely effective, at least for time: dissent could not be absolutely stamped
    out, it could be largely suppressed.³34 By contrast, Sheila Lambert and D. F.
    Mackenzie concentrated on the economic aspects of press control in


