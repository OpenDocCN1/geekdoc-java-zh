    and abroad, was closely connected to his time in office. As a result of his political
    writing for a European audience, as Miltonists including Leo Miller, John Raymond,
    and Cedric Brown have shown, Milton first became a well-known English author abroad.
    In part of his initial fame as a Latin poet, after his death Milton became one
    of the first English vernacular poets to achieve currency in Europe. Milton, J.G.
    Robertson observed, “was the first English poet to inspire and win fame for our
    literature on the Continent of Europe, the first poet to be known and to be adjudged
    worthy of knowing by continental critics.” Milton’s literary fame not only trailed,
    but was directly shaped, England’s changing role as an international power.


