    Wood has argued, was a matter of compulsion, not choice: for tenants confronted
    with rising rents, survival meant selling enough to pay their landlords. Nor was
    it only the poor who were enmeshed in monetary relations and subject to their
    forceful imperatives. Wealthy farmers, for instance, relied on the sale of their
    produce to pay the costs of rent and labor.


    In these conditions, financial records and methods of account-keeping proliferated,
    least among the literate or semi-literate population. Merchants typically kept
    the most sophisticated accounts, but even some farmers in this era, as Robert
    Loder of Berkshire, began to embrace capitalist modes of accounting—methods that
    aimed to track profit and loss on capital, not merely income and expenditure.²
    Moreover, in a country by which, the ebb and flow of money was a matter of survival
    for nearly everyone, financial practices were widely disseminated. And as in Europe,
    many features of writing associated with the management of money shaped other
    literary forms. Lives shaped by money were also, necessarily, lives recorded in
    documents.


    The English diary developed, in part, out of these circumstances. Needless to
    say, the demands of a commercial culture were not the only factor in the diary’s
    development—professional, domestic, educational, and spiritual pursuits played
    a part in various examples of the genre. Students kept educational diaries; lawyers
    kept legal diaries; office holders kept political diaries; and the nobility carefully
    noted the details of birth, death, and marriage for the benefit of posterity.²
    Yet despite wide-ranging influences, the diary deserves its reputation as one
    of the literary forms accommodated to a monetary culture and an incipient bourgeois
    individualism. Its structural links to accounting practices were at least obvious
    in the period as they are today. “It is a very profitable course to have such
    a Journal or Diary by us,” John Beadle wrote in the first published manual for
    diarists, “and you know, who will use us any? Who will bring us profit is the
    great question of the world, and prevails very far.³ The “profitable” character
    of the diary made it well adapted to the values and of an increasingly monetized
    society.


