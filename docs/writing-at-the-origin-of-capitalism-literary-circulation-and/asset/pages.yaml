    # English Literature Abroad


    # Introduction


    In previous chapters of this study, I argued that the emergence of capitalism
    shaped patterns of textual circulation within England. As the expanding state
    and economy linked English society ever more tightly through texts and documents,
    the character of the literate language, its genres and its values, all responded
    to the formation of a national sphere of writing. Yet English capitalism did not,
    or course, affect the dissemination of documents within England alone. Today,
    we live, work, and read in a world deeply marked by the spread of English across
    the globe, by the British Empire and the economic development of England, its
    colonies, and former colonies. Just as the nature of English capitalism is of
    historical interest far outside England''s own territorial limits, so English
    patterns of literary circulation have implications for other cultures. In this
    concluding chapter, then, my argument turns outward to consider the increasing
    potential for English literary circulation in early modern Europe and its consequences
    for English writers'' reception and reputations.


    By the beginning of the seventeenth century, vernacular literature acquired a
    new prestige across Europe. The modern literary system of native tongues and translations
    was crystallizing, reinforced by, though never perfectly aligned with the national
    ideology of an emerging territorial state system. But if the authority of the
    vernacular had risen in general terms, its cachets were nevertheless unevenly
    distributed. While authors of French, Spanish, or Italian texts could have a reputation
    within their own languages lead to translation and fame abroad, the same could
    not said for most other vernaculars, including English. Working within a language
    that was notoriously obscure in Europe, English writers found the possibility
    of a European readership, either in the original or via translation, virtually
    foreclose. Yet as contemporary experience makes all evident, English did not remain
    unknown, and it was in the course of the seventeenth century that its position
    first shifted to start. Slowly, English literature took on a new place within
    the European literary system. By the eighth'
