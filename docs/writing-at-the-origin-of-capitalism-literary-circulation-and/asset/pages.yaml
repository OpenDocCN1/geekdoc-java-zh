  md: '# 2 WRITING AT THE ORIGIN OF CAPITALISM


    The same cannot be said, however, although the complex legacy of Marxist thought
    can still be felt in many aspects of literary and historical scholarship, the
    general tendency over the course of the same three decades is one of decline.
    Even the growing interest in capitalism and its history sparked by the 2008 financial
    crisis was not enough to reverse its overall downward trajectory. Perhaps the
    still-unfolding economic devastation caused by a global pandemic, with its markedly
    asymmetric effects on the population, will do what market failure on its own could
    not. As of yet, however, there is no resurgent of Marxist analysis of early modernity.
    Yet such analysis has a great deal to offer the study of early modern literature
    in general and book and media history in particular. It can provide a clear and
    coherent method for thinking about the history of culture in material terms. Marxist
    historians of England have also produced an abundance of empirical and theoretical
    research on economic and social history, much of which has not been fully integrated
    into literary history, despite its relevance to core research questions.


    The most important advantages of Marxist analysis, however, may lie at precisely
    those points where it fights the grain of longstanding practices in literary and
    historical scholarship. To begin with, it insists on an uncompromising perspective
    on the past. It is in sharp distinction to recent trends in literary history,
    which has become more fragmented as it has become more nuanced and empirical.
    As different aspects of textual production have been explored in ever greater
    detail, there has been a gentle but seemingly irreversible tendency toward plurality
    and ecumenism. Even the objects under analysis tend to split and multiply; the
    study of culture becomes the study of cultures, of literacy, literacies. A Marxist
    approach, by contrast, situated the investigation of individual elements of a
    given era within the socioeconomic structure as a whole. All that encompasses
    the conditions of labor and the struggle between classes shape every aspect of
    society. This approach undoubtedly challenges in practice,


