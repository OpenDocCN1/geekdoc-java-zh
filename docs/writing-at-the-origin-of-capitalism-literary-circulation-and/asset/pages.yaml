    It received its best and most influential spokesman in Francis Bacon, the prophet
    of scientific discovery, material progress, and a functional approach to knowledge.
    Despite his own literary elegance, Bacon would emerge as the single most prominent
    advocate of the idea that style was simple, routine, and plain, serving the needs
    of content. Writers, he considered, should avoid “oratorial embellishment, similitudes,
    and like emptiness,” taking care that their materials were “serviceable and good”
    and arranged so as to “take up as little space as possible in the warehouse,”
