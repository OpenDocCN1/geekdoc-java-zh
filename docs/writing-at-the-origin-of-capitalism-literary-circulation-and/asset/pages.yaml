    # A Changing Economy


    Because even those who argued that capitalism marked a new epoch disagree about
    its timing, location, and causes, the term can not be used without some clarification.
    In this study, I focus on a coherent set of changes concentrated in the period
    from the late sixteenth century to the late seventeenth century. Although continu
    span every historical era, this slice of time was a fateful one for the history
    of capitalism. Across Europe, the sixteenth century was an era of expansion, as
    a growing population finally began to match, and then exceed, the medieval totals
    reached before the Black Death. More sophisticated markets and a quicker pace
    of trade linked European ports and capitals, while colonial conquests created
    global forms of commerce, including the beginnings of the transatlantic slave
    trade. Wherever there were new commodities—books among them—new trade routes,
    and new systems of communication and exchange.


    Although England was geographically, economically, and culturally peripheral to
    the core European countries, it participated in all of these trends. As a result
    of its own social configuration and complex history, it responded to them in a
    distinctive way. It was this response that made it a precocious site of economic
    development—the place where, Marx wrote, the transition to capitalism took “the
    classic form.\¹⁵ This is a rather ambiguous formulation, and scholars have used
    it on both sides to debate whether England was a true economic outlier or a variant
    of a larger European pattern. In addition, there is considerable disagreement
    as to whether England is the relevant unit of social analysis. It is, on one hand,
    too small. Many patterns of culture and trade reached unevenly over the British
    Isles, to Wales, Scotland, and Ireland, and as well across the English Channel
    to continental Europe.¹⁶ On the other hand, it is large:


