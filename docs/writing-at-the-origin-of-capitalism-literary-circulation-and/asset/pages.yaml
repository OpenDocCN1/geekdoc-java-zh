    Today, most of the examples of these early prose forms are little read except
    by scholars of early modernity. Despite their peripheral place in the literary
    canon, they do help to reveal something vital about English literary history.
    They are clues to a turning point in the history of English prose, as writers
    began to explore the possibilities of a newly consolidated literary style. Considered
    together, these new prose forms help to make the case for a different history
    of English literature, in which continuities can be traced from the standardization
    of English that began in the late fourteenth century to the rise of a plain style
    and new genres of prose that confirmed its success at the end of the sixteenth
    century. In this history, a longer relation between capitalism and literature
    can be seen than the one that is customarily traced through the rise of the novel
    and the bourgeois reading public, or it is also a different one on ideology but
    rather on the even earlier emergence of the commercial theater and the mass London
    audiences. It is English writing helped to make possible a national market and
    unified political territory, and it was through this process that the language
    took on its modern form. The consolidation of English prose, like the creation
    of road networks, law courts, and new monetary instruments, was part of the formation
    of a capitalist infrastructure. From spelling to syntax to style, the history
    of language and literacy is a political history. It is also part of the history
    of literature: there is no clear line that divides the basic conditions of literacy
    from literary forms. Rather, the uses of literacy continue to underpin the history
    of literature in every era.


