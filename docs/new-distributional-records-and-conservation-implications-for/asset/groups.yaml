    在本研究中，我们报告了来自亚齐东南亚地区（Aceh Tenggara Raya）山区的两个 *N. lovistuba* 新地点，以及该物种在每个地点的种群数据和特征。本文介绍并讨论了这些新增分布记录地点以及种群数据对该物种保护的意义。


    在观测个体附近：海拔 (m asl)、坡度 (°)、坡度 (° 和地形特征（山谷、坡或山脊）。为了评估不同地点之间环境变量的差异，我们使用 Passab Statistics
    18.0 (SPSS Inc., Chicago, Illinois) 使用独立样本 T 检验，并记录了种群的任何迹象。


    # 2. 材料与方法


    ## 2.1. 研究区域


    *N. lovistuba* 的野外调查在印度尼西亚亚齐县（Aceh Regency）的 Gegarang 村和 Bur Ni Pepanji 的山坡上进行。在两个地点，我们收集了苏门答山地植物样本，这些代表了贯穿岛屿南北的山脉沿海拔
    1000 米以上的森林。研究地的地形为山地，最高海拔为 260 m asl。平均气温和湿度为 21.38°C 和 89.91%（IPS Kabupaten
    Merah, 2021）。


    由于数据可用性限制，我们根据 IUCN 红色名录（IUCN, 2012）的本地数据 B（地理范围）、C（种群数量小或种群限制）重新评估了 *N. lovistuba*
    的现状。使用 GeoCat (http://geocat.org/; Bachman, 2011) 利用 5 × 2 km 网格计算了发生范围 (EOO)
    和占据面积 (AOO)。对于 C 和 D，根据个体数量估计了物种的种群数量。


    ## 2.3. 保护现状


    # 3. 结果


    ## 3.1. 种群状况和栖地偏好


    在调查期间，我们共发现了 449 个 *N. lovistuba* 个体，大部分 (88.2%)位于 Gegarang（图 2）。*N. lovistuba*
    在两个地点的种群结构遵循 J 型模式（图 3）。种群由叶片小于 50 cm 的个体组成，且较小尺寸的个体更多。


    我们在 Gegarang 观察到 8 个开花个体（6 雄，2 雌），株长从 60 cm 到 80 cm；而在 Bur Ni Pepanji 有 13 个开花个体（1
    雄，12 雌），株长从最短个体到我们估计的最长的 210 cm。


    所有 *N. lovistuba* 个体均偏好 Bur Ni Pepanji 的开阔区域（平均高度 35.5 ± 0.6 m），且坡度明显陡峭（1127.5
    ± 7.9 m）。Gegarang 的个体生长在北部 (56.6%) 和西坡 (43.18%)，而它们分布在南部 (22.6%) 和东部 (20.75%)。海拔方面，Gegarang
    的 *N. lovistuba* 个体生长在海拔 1689 至 1785 米之间（平均 1738 ± 1.38），显著低于 Bur Ni Pepanji（范围
    1916–1994 米，平均 1953 ±）。


    **图 2.** *Nepenthes lovistuba* 的形态：(A) 栖息地中的植物；(B) 植物；(C) 带有叶基的茎；(D) 开花的活植物；(E)
    带长萼雄花序；(F) 花序的一部分；(G) 被长萼保护的花序蕾；(H) 上笼；(I) 下笼；(J) 下侧；(K) 盖的上侧带附件。摄影：E. Primanda。


    3.2. 威胁与灭绝风险评估


    我们观察到 *N. lovistuba* 种群的主要威胁是栖息地转化为大规模咖啡园和非法采伐。部分森林的转化导致了两个地点 *N. lovistuba* 栖息地的减少和退化。非法采挖也已知威胁到这两个地点的种群。当地猎人经常出现在当地，定期采集植物。他们根据买家的直接要求或通过在线商店在国内外销售。


