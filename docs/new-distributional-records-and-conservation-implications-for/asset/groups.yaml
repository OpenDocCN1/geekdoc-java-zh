    ## 3.2. Threats and extinction risk assessment


    We observed that the main threats to the populations of N. lovistuba were habitat
    conversion into large-scale coffee plantations and illegal logging. A set area
    of forests was converted to the reduction and degradation of habitats of N. lovistuba
    in both locations. Illegal harvesting is also known to threaten the populations
    in both locations. Local poachers are often seen on the locals, regularly collect
    the plants. They sell both nationally and abroad based on direct requests from
    buyers or it through online stores.


