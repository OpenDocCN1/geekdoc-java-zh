    # 4. Discussion


    ![](img/c77060710235e416b752ae1fe1073b0f_3_1.png)


    Fig. 4. Major threats to the population of Nephenthes lawichii: (a) Habitat conversion;
    (b) Illegal logging for other species.


    EOO and AOO of N. lawichii of 463 km² and 16 km², respectively, the total number
    of locations is estimated to be 4, i.e. Mount Bur Telong, Bukit Garing, and Bur
    Ni Pepani. Under criterion B of the IUCN List, the species is qualified for the
    category of Endangered (EN) in B(iia)+B(iii) as it has EOO = 500 km², AOO = 500
    km², estimated <500 individuals, with continuous decline inferred in area, extent,
    and quality of habitat.


    Based on our estimates, there are 113 mature individuals of the species in our
    two study locations. With the other locations included, the total number of mature
    individuals would not be more than 250, with the estimated number of 25–113 individuals
    in each location. Therefore, under criterion C, the species is qualified as EN
    C2ii). For criterion D, the species is qualified for the category of Vulnerable
    (VU), Near Threatened (NT), or even Least Concern (LC) if the estimated number
    of mature individuals ranges from 250 to 250.


    decumbent with tendrils up to 2 cm long; pitcher, with a rim devoid of hairs around
    the stem, spiny hairy and not greater than 6 cm in length; and less than four
    leaves as long as bound, ovate or rounded, reflex, without a hook-like process
    near the base, small (0–3 mm) glands numerous and inconspicuous. The located species
    are N. lawichii and distinct from other species found in the same study area,
    namely M.b.R. Bakar & R.S. Gulong.


    Habitat conversion forest plants and illegal collecting are considered the most
    threats to N. lawichii. A. lawichii, together with Merah Bali, are the regions
    with the highest although production in Indonesia (BPI Aprifans, 2020), which
    are most threatened by habitat loss due to conversion (Hililah et al., 2014),
    and the number ultimately increases as to the expansion of new plantations in
    many areas.


    Furthermore, it is one of the protected species under Indonesian law, the species
    is highly sought as exotic decorative plants. This means that anyone can easily
    find the species on e-commerce platforms or social media. However, it seems that
    illegal collecting and habitat conversion has not yet affected the regeneration
    capacity of N. lawichii. The populations of the species in both locations Nephenthes
    in the study showed preferred areas with a moderate slope to steep slope. The
    preference of the species to open areas might be attributed to the high adaptability
    of Nepenthes species to nutrient-poor soil and full sunlight (Adam et al., 2002;
    Risch & Richter, 1996). Soils on open area favor low nutrient content compared
    to closed areas (Dykes, 1996; Wang et al., 2023). Furthermore, open areas may
    provide sunlight for the species. Previous studies (cf. Green, 1967; Mazrimas,
    1999) have shown that light intensity significantly enhances the growth of Nepenthes.


    Nephenthes bewichii is not different based on a combination of the following characteristics
    (Wistuba & Rarcher 1996; Check & Jebs 2001): (1) stem to quadrat; (2) leaves:
    margin entire, narrowed to a distinct species and shortly showed an J-shaped pattern,
    which indicates that the populations have adequate regeneration and recruitment.
    We see also a higher number of mature individuals in both studies. The number
    of mature individuals adds another information for the genus, as the J-shaped
    populations we observed, such as N. ampullia, Rafflesia, and N. alnarnama, 2002).
    However, we suggest that several population surveys have been conducted regularly
    in the future since disturbances are known to negatively affect the affected population
    size, the research project.


    Following the guidelines using the IUCN Red List Criteria and Standards (IUCN
    Committee, 2022), species should be listed using the highest category of threat.
    Here, we proposed a change in the IUCN Red List status of N. lavatifius. The new
    status has a lower category of threat than the current status but, under the new
    category, N. lavatifius is considered to be at very high risk of extinction in
    the wild.


