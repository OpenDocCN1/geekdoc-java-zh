    # 摘要


    *   关键词：

    世界自然保护联盟红色名录

    猪笼草

    苏门答

    受威胁植物


    *Nepenthes lovistuba* & Rischer (Nepentacheis) 是一种特产于印度尼西亚苏门答北部的猪笼草。由于地理分布狭窄，且受到火山爆发和猪笼草猎人破坏栖息地的威胁，*N.
    lovistuba* 根据 IUCN 红色名录的 B1 + 2c 标准被评估为极临濒危 (CR)。2020 年，我们在亚齐东南亚县（Aceh Tenggara
    Regency）报告了 *N. lovistuba* 的两个新发现，并介绍了该物种在每个地点的种群密度和栖息地特征。基于这些发现，我们建议将濒危 (EN)
    [B1(a)(ii)(iii) + 2c(a)(ii)(iii)] 作为 *N. lovistuba* 的新保护现状。建议的状态包含了当前栖息地状况和新类别的注释。*N.
    lovistuba* 仍被认为面临野外极高的灭绝风险。需要采取全面且紧时的保护行动以防止物种灭绝。


    # 引言


    苏门答岛是猪笼草生物多样性热点之一，该植物属有超过194 种（POWO, 2023）。该岛拥有 39 种猪笼草的栖息地，由于非法采挖以及森林变为农田和种植园，其中超过76%
    处于濒危状态（Herrnaux et al., 2022）。在本研究中，我们确定了 5 种极临濒危 (CR)、3 种濒危 (EN) 和 4 种易危 (VU)
    植物（Davis, 2022）。


    *Nepenthes lovistuba* & Rischer (Nepentacheis) 是特产于苏门答北部的唯一植物种。该物种首次于 1996 年根据亚齐省
    Bukit Lawang (Kulon Teleng) 的栖息地描述，那里是位于亚齐省 Bera Aceh 的火山地区（Wistuba & Rischer,
    1996）。据报道，该植物在海拔 2000 至 2600 米 (m) 的开阔坡地上非常常见。*Nepenthes lovistuba* 代表了苏门答最北部的物种，尽管它是生长在火山土壤上的物种之一（Wistuba
    & Rischer, 1996），但它受地理分布以及火山爆发和植物猎人非法采集威胁的限制。*N. lovistuba* 根据 IUCN 的 B1 + 2c
    标准被评估为 CR（Schnell et al., 2020）。


    我们报告了位于亚齐省纳加亚县（Naga Raya Regency）海拔 800 米处发现的 *N. lovistuba* 新地点。文中未报告该物种在新地点的种群状况。


