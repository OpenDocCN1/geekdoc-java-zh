    (C) stem with leaf base; (D) living plant bearing inflorescence; (E) male inflorescence
    with long bract; (F) part of inflorescence; (G) inflorescence flower buds subtended
    by a long bract; (H) upper pitcher; (I) lower pitcher; (J) lower side; (K) upper
