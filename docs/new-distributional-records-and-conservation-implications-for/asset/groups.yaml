    ![](img/c77060710235e416b752ae1fe1073b0f_3_0.png)


    图 3. Garing (A) 和 Bur Ni Pepani (B) 根据茎长分类的猪笼植物 lawichii 种群结构。


    # 4. 讨论


    ![](img/c77060710235e416b752ae1fe1073b0f_3_1.png)


    图 4. 对笼植物 lawichii 种群的主要威胁：(a) 栖地转化；(b) 其它物种的非法砍伐。


    N. lawichii 的 EOO（分布范围）和 AOO（活动范围）分别为 463 km² 和 16 km²，估计位于4 个地点，即 Bur Telong
    山、Bukit Garing 和 Bur Ni Pepani。根据 IUCN 红色名录 B 标准，该物种被归入极危 (EN) 类别 B(iia)+B(iii)，因为其
    EOO = 500 km²，AOO = 500 km²，估计数量小于 500 只，且推断其栖地面积、范围和质量正在持续下降。


    根据我们的估计，在两个研究地点该物种有 113 株成年个体。如果加上其他地点，成年个体总数将不超过 250 株，每个地点的估计数量为 25–113 株。因此，根据
    C 标准，该物种被评定为极危 (EN C2ii)。对于 D 标准，如果估计成年个体数量在 250 到 250 之间，该物种被归为易危 (VU)、近危 (NT)
    甚至无极缘 (LC)。


    匍生，卷须长达 2 cm；捕虫笼缘在茎部周围无毛，有刺毛且长度不大于 6 cm；与柄等长的叶少于四片，卵圆形或圆形，反折，基部无钩状突起，小型（0–3 mm）腺体众多且不明显。位于的物种为
    N. lawichii，与同一研究区域发现的其他物种不同，即 M.b.R. Bakar & R.S. Gulong。


    栖地转化、森林植物和非法采集被认为是对 N. lawichii 最大威胁。A. lawichii 与 Merah Bali 一同是印度尼西亚产量最高的地区（BPI
    Aprifans, 2020），它们受栖地转化导致栖地流失的威胁最大（Hililah 等人，2014），且随着许多地区新种植园的扩张，其数量最终在增加。


    此外，由于它是印度尼西亚法律保护的物种之一，该物种作为观赏植物备受追捧。这意味着任何人都可以轻松地在电子商务平台或社交媒体上找到该物种。然而，似乎非法采集和栖地转化尚未影响到
    N. lawichii 的再生能力。研究中两个地点的猪笼植物种群显示，它们偏好坡度中等至陡坡的区域。该物种对开阔地区的偏好可能归因于猪笼植物属对贫瘠土壤和充足阳光的高适应性（Adam
    等人，2002；Risch & Richter,1996）。与闭合区域相比，开阔地区的土壤有利于低营养含量（Dykes, 1996；Wang 等人，2023）。此外，开阔地区可能为该物种提供阳光。以往的研究（参见
    Green, 1967; Mazrimas, 1999）显示光照显著增强了猪笼植物的生长。


    Nepenthes bewichii 在以下特征组合上没有区别（Wistuba & Rarcher 1996; Check & Jebs 2001）：(1)
    茎呈方形；(2) 叶：边缘全缘，收缩至明显的物种并简短地显示出 J 形图案，这表明种群具有充足的再生和补充能力。我们在两项研究中也看到了较多的成年个体。成年个体的数量为该属提供了另一个信息，正如我们观察到的
    J 形种群，如 N. ampullia、Rafflesia 和 N. alnarnama（2002）。然而，我们建议未来以后定期进行多次种群调查，因为众，干扰会对受影响的种群数量产生负面影响，研究项目。


    遵循 IUCN 红色名录标准和规范（IUCN 委员会，2022），物种应使用最高威胁类别进行列名。在这里，我们建议更改 N. lavatifius 的 IUCN
    红色名录状态。新状态的威胁类别低于当前状态，但在新类别下，N. lavatifius 被认为在野外面临极高的灭绝风险。


