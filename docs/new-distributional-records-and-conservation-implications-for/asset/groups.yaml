    In the present study we report two new locations of N. lovistuba from the mountainous
    region of Aceh Tenggara Raya alongside population data and characteristics of
    the species in each location. The locations of these new additional distributional
    records and population data on the conservation of the species are presented and
    discussed in this article.


    Near the located individuals: elevation (m asl), slope (°), slope (°), and terrain
    features (valley, slope, or ridge). To evaluate the differences in environmental
    variables between the locations, we used the independent-sample T Test using Passab
    Statistics 18.0 (SPSS Inc., Chicago, Illinois), any signs of the populations were
    also recorded.


    # 2. Materials and methods


    ## 2.1. Study area


    The field surveys for N. lovistuba were conducted on mountain slopes of Gegarang
    Village and Bur Ni Pepanji, both in Aceh Regency, Province, Indonesia. In both
    locations we collected samples of Sumatran mountain vegetation, which represents
    the forests above 1000 m asl along the Mountain Range which runs from the north
    to the south of the island. The topography of the study sites is mountainous with
    the highest elevation of 260 m asl. The average air temperature and humidity are
    21.38°C and 89.91%, (IPS Kabupaten Merah, 2021).


    We reassessed the status of N. lovistuba based on local data B (geographic range),
    C (small population size or restricted population) of the IUCN Red List (IUCN,
    2012) due to data availability constraints. The extent of occurrence (EOO) and
    area of occupancy (AOO) were calculated using GeoCat (http://geocat.org/; Bachman,
    2011) using the 5 × 2 km grid cell. For C and D, the population size of the species
    was estimated based on the number of individuals.


    ## 2.3. Conservation status


    # 3. Results


    ## 3.1. Population status and habitat preferences


    During the surveys, we located a total of 449 individuals of N. lovistuba (Fig.
    2) with most of them (88.2%) found in Gegarang. The population structure of N.
    lovistuba in both locations follows an J-shaped pattern (Fig. 3). The populations
    are dominated by individuals with leaves shorter than 50 cm, and the number of
    individuals were greater in smaller size classes.


    We observed 8 flowering individuals (6 male and 2 female) in Gegarang with stem
    from 60 cm to 80 cm, whereas Bur Ni Pepanji were 13 flowering individuals (1 male
    and 12) with stem range from the shortest-producing individual, we estimated the
    longest to be 210 cm.


    All individuals of N. lovistuba prefer open areas with slopes in Bur Ni Pepanji
    (height mean = 35.5 ± 0.6 m) found on a significantly steeper slope (elevation
    1127.5 ± 7.9 m) than in Gegarang (range = 20–45, mean = 29.9 ± 0.46). Most of
    the individuals in Gegarang grow on the north (56.6%) and west-facing slopes (43.18%),
    whereas they were distributed on the south (22.6%) and east (20.75%). In terms
    of elevation, the individuals of N. lovistuba in Gegarang grew at an elevation
    range from 1689 to 1785 m (mean = 1738 ± 1.38), which is significantly lower (r
    = -547, p < 0.00) than those of Bur Ni Pepanji (range = 1916–1994, mean = 1953
    ±).


