    # ABSTRACT


    +   Keywords:

    A IUCN Red List

    Pitcher plant

    Sumatra

    Threatened plants


    Nepenthes lovistuba & Rischer (Nepentacheis) is a pitcher plant endemic to the
    northern tip of Sumatra, Indonesia. Due to its narrow geographic distribution
    and threats from volcanic eruption and habitat loss by pitcher plant hunters,
    N. lovistuba was assessed as Critically Endangered (CR) under criteria B1 + 2c
    of the IUCN Red List. In 2020, we report two new locations of N. lovistuba in
    Aceh Tenggara Regency, along with the population density and habitat characteristics
    of the species in each location. Based on these findings, we proposed Endangered
    (EN) [B1(a)(ii)(iii) + 2c(a)(ii)(iii)] as the new new conservation status of N.
    lovistuba. The new proposed status includes a comment on the current habitat status
    and the new category. N. lovistuba is still considered to be facing very high
    risk of extinction in the wild. Comprehensive and immediate conservation actions
    are required to halt the species from extinction.


    # Introduction


    Sumatra is one of the biodiversity hotspots of Nepenthes, a plant genus with more
    than 194 species (POWO, 2023). The island has a habitat for 39 species of Nepenthes,
    of which more than 76% are endangered (Herrnaux et al., 2022) due to illegal harvesting
    and forest conversion for agricultural lands and plantations. In this study we
    have identified with five species as Critically Endangered (CR), 3 as Endangered
    (EN), and 4 as Vulnerable (VU) (Davis, 2022).


    Nepenthes lovistuba & Rischer (Nepentacheis) is the only plant species endemic
    to the northern tip of Sumatra. The species was first described in 1996 based
    on habitat found in Bukit Lawang (Kulon Teleng), an volcanic area located in Bera
    Aceh, Aceh Province (Wistuba & Rischer, 1996). The plant was reported to be very


    common on open slopes ranging from 2000 to 2600 m above sea level (m). Nepenthes
    lovistuba represents the northernmost species of Sumatra and although it is one
    of the species found growing on volcanic soil (Wistuba & Rischer, 1996), it is
    limited by its geographic distribution and threats from volcanic eruption and
    illegal collection by plant hunters. N. lovistuba was assessed as CR under criteria
    B1 + 2c of the IUCN (Schnell et al., 2020).


    We report a new location of N. lovistuba in Naga Raya Regency, Aceh Province at
    an elevation of 800 m above sea. The population status of the species in this
    new location was not reported.


