  \ 类。在这种情况下，`Honda` 类通过组合使用了 `HondaEngine` 类对象和 `start()` 方法。你现在可以说 `Honda` 类拥有一个\
  \ `hondaEngine`：\n\n![image](img/image167.png)\n\n### 步骤 #3\n\n接下来，你必须创建一个 `HondaEngine`\
  \ 类，通过该类我们将使用上面 `Honda` 类中的类对象：\n\n![image](img/image128.png)\n\n### 步骤 #4\n\n现在我们构建一个\
  \ `CompositionDemo` 类，在其中创建一个 `Honda` 类对象并按如下方式初始化：\n\n![image](img/image199.png)\n\
  \n输出如下：\n\n![image](img/image207.png)\n\n## 组合的重要性何？\n\n在组合中，你可以控制其他对象对客户端类的可见性，并且仅重用你需要的部分。\n\
  \n组合允许你在需要时创建后端类。\n\n| ![image](img/chapter_title_corner_decoration_left.png) |\
  \  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)\n\
  \n## 组合和继承如何比较？\n\n我的假设是你已经知道继承和组合的比较，并想知道哪种是最好的选择。\n\n更改后端类（或组合）的接口比更改父类（或继承）要容易得多。正如上一个示例所示，只要前端接口保持不变，更改后端类的接口将导致前端类接口发生必要变化。相反，更改父类的接口不能简单地向下影响继承层次结构中的子类，但它也可能影响到仅使用子类接口的代码中。\n\
  \n你还会发现，与继承或子类相比，更改前端组合/类的接口更为简单。类类类是脆弱的，它们也可能是僵硬的。你不能在不确保子类的新接口与其父类型兼容的情况下直接更改子类的接口。例如，你不能向子类中添加一个具有相同签名的方法，但该方法（方法）的返回类型与从父类继承的方法不同。另一方面，组合允许你在不影响后端类的情况下更改前端类的接口。\n\
  \n组合允许你在需要之前推迟后端对象的创建，并且在前端对象的整个生命周期内动态地更改后端对象。继承允许你在子类构建完成后，在子类对象中获取父类的映像，并在子类的整个生命周期内一直是子类对象的一部分。\n\
  \n你会发现，添加一个新的子类或继承比添加新的前端类或组合要简单，因为继承具有多态性。如果你有一些依赖父类接口的代码，这些代码可以在不更改的情况下与新子类一起运行。至于组合，除非你配合接口使用，否则并非如此。当结合使用时，组合和接口是非常出的设计工具。\n\
  \n显式委托或方法调用转发的组合方法通常会有性能开销，这通常与继承中对父类方法实现的单次调用相比。这里通常意味着性能完全取决于许多因素，其中一个就是 Java\
  \ 虚拟机在执行过程中优化程序的方式。\n\n对于继承和组合，更改任何类的实现（而不是接口）都是简单的。实现更改的波动效应保持在同一个类中。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n## 在继承和组合之间选择\n\
  \n继承和组合的比较如何帮助你的设计？以下反映我通常如何在继承和组合之间选择的一些原则。\n\n### 确保继承符合“是”关系\n\n主要的指导思想是，只有当子类是父类时，你才使用继承。例如，橙子是水果，因此我很可能会选择继承。\n\
  \n当你认为拥有“是”关系时，需要问自己一个很好的问题是：这种“是”关系是否贯穿整个应用程序的生命周期，如果运气好，还包括代码的周期。例如，你可能认为 `employee`\
  \ 是 `person`，但本质上，`employee` 指的是一个人在特定时期内扮演的角色。如果这个人被解雇了呢？如果他既是 `supervisor` 又是\
  \ `employee` 呢？在处理这些不持久的“是”关系时，你应该考虑它们必须通过组合来建模。\n\n### 不要仅仅为了代码重用而使用继承\n\n如果你只想重用代码且仅此而已，而且没有可见的“是”关系，你可以使用组合。\n\
  \n### 不要仅仅为了获取多态性而使用继承\n\n如果多态性是你唯一想要的，而且没有自然的“是”关系，你只需要配合接口使用组合。\n\n\n\n\n\n在开始之前，你需要安装一个名为\
  \ [Java processing](https://atom.io/packages/processing) 的程序，它对于构建像我们今天今天要构建的这样的应用程序非常有用。简单解释一下，processing\
  \ 是一个开源工具，可以使用基本语法创建动画、交互式程序和绘图。它还包含一个基础的 IDE，作为你编程的界面。通过 Processing，你可以创建一个额外的抽象层，来遮盖某些普通初学者认为难以理解的\
  \ Java 编程元素。\n\n**注意**：抽象让你能够更轻松地完成工作，尤其是当你对该主题没有太多背景知识时。如果你用原生 Java 来构建或处理图像，你会感到非常头疼。\n\
  \n![使用 Processing 语言编写一个简单的游戏。](img/image119.png)\n\n我们在这这一节中要构建的游戏是 Pong（弹球游戏）、Flappy\
  \ bird（飞翔的小鸟）和打砖块游戏的某种结合。我特别选择这个游戏是因为它包含了简单的概念，并且有助于他人理解，而这些概念往往让初学者在游戏开发方面感到困扰。你需要注意的是，首先，制作像具有多个关卡、实体、玩家等的平台类游戏是非常困难的。随着我们的继续，你会发现代码变得非常复杂，但好处是它通常组织良好且简单。只需只需缓慢阅读每一部分，对于需要明确的概念参考书中的相关区域，获取整个代码并在你尽早思考自己的游戏时自己玩玩它，并开始实现它。让我们从基础开始。\n\
  \n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)\n\
  \n## 如何构建 Flappy Pong\n\n### 初始化不同的屏幕\n\n我们将从初始化项目开始。首先，我们将像大家通常做的那样编写 `setup` 和\
  \ `draw` 块——所以这里没什么新奇花哨的！之后，我们将处理各种屏幕——这些包括游戏屏幕、初始屏幕、游戏结束屏幕等。但可能会出现问题：如何确保在正确的时间显示正确的页面呢？\n\
  \n完成任务非常简单。我们将使用一个全局变量来存储当前活跃屏幕的信息。然后我们绘制正确屏幕的内容——但这取决于该变量。在 `draw` 块中，我们将包含一个 `if\
  \ statement`，它基本上检查该变量并相应地呈现屏幕内容。每当你更改屏幕时，我们就会将变量更改你要更改的屏幕，你需要将变量更改为你想要显示的标识符。如此，让我们概述一下你的骨架代码结构：\n\
  \n![image](img/image109.png)\n\n事实上，起初看起来可能很吓人，但我只是创建了基础结构并用注释块分隔了不同的部分。如你所见，对于每个显示的屏幕，我们都定义了一个独特的方法。在你的\
  \ `draw` 块中，只需在调用相应方法之前简单地检查变量 `gameScreen` 的值。当涉及到 `void mousepressed() {...}`\
  \ 部分时，你基本上是在监听鼠标点击，并且如果活动屏幕是 0（即初始屏幕），你就调用 `startGame()` 方法，它将如你预期的那样开始游戏。该方法的第一行将变量\
  \ `gameScreen` 改为 1——即游戏屏幕。当你理解了这一点，下一步需要做的就是实现你的初始屏幕。你将通过编辑 `initScreen()` 方法来实现。代码如下：\n\
  \n![image](img/image048.png)\n\n初始屏幕现在有一个黑色背景，中间有一行写着“点击开始”的简单文本，并且居中对齐。尽管如此，当你点击时，什么都没有发生。你还没有为你的游戏屏幕指定任何内容，`gameScreen()`\
  \ 方法内部是空的——这意味着你没有通过将 `draw` 的第一行设为 `background()` 来覆盖从上一个屏幕绘制的内容（即文本）。这就是为什么文本仍然在那里，尽管\
  \ `text()` 行已经不再被调用的原因。由于相同的原因，背景仍然是黑色的。我们将开始实现游戏屏幕。\n\n![image](img/image008.png)\n\
  \n一旦你完成了此更改，你会发现背景变成了白色，且文本消失了。\n\n### 创建球并实现重力\n\n我们现在开始在游戏屏幕上进行操作。我们将从创建球开始。现在，你必须为它的颜色、坐标和大小定义变量，因为你以后可能想要更改这些值。例如，如果你想随着玩家得分的增加而增大球以增加游戏难度，你就需要修改它的尺寸，因此它必须是一个变量。一旦你实现了重力，你还将定义球的速度。从添加下面的代码开始：\n\
  \n![image](img/image043.png)\n\n我们将坐标定义为全局变量，构建了一个绘制球的方法（该方法从自 `gameScreen` 方法），但我们在\
  \ `setup()` 中定义了它们。这样做的主要原因是为了让球从左侧四分之一处和从顶部的五分之一处开始。我无法就为什么想要那样给出特定原因，但通常来说，那是球开始的绝佳位置。因此，我们需要在画布上动态地获取\
  \ `height` 和 `width`。`setup()` 在第一行之后定义了画布的大小。`height` 和 `width` 在 `setup()` 运行之前还没有设置，这就是为什么如果你在顶部定义变量就无法做到这一点。\n\
  \n### 重力\n\n进入简单部分：让我们使用一些技巧来实现重力——以下首先是实现代码。\n\n![image](img/image005.png)\n\n\
  [点击此处](https://uploads.toptal.io/blog/image/125581/1520329291432-3a4c567c0a904389c4c4f1b860675d94.gif)\
  \ 查看预期结果。\n\n\n\n\n\n我确定你可能在怀疑你对物理的理解是否受到了威胁。我知道在现实生活中，重力的作用原理并非如此。请将此视为一个动画过程。变量\
  \ `Gravity` 只是一个数值——一个 `float` 类型，这使得我们可以使用小数而不仅仅是整数——在每个循环中，我们将其加到 `ballSpeedVert`\
  \ 上。实际上，`ballSpeedVert` 代表球的垂直速度，它在所有循环中都会作用于球的 Y 坐标（`bally`）。你通过观察球的坐标来确保它留在屏幕内，如果你不这样做（你可能已经知道了），球将一直掉落到无限。不过，目前球只在垂直方向上移动。这意味着我们在监控屏幕上地板和天花板的边界。\n\
  \n通过 `keepInScreen ()` 方法，我们检查 `bally` 或 `+` 半径是否小于 `height`，同样地，检查 `bally` 或半径是否大于\
  \ 0。如果条件不满足，你可以使用方法：`makeBounceTop ()` 和 `makeBounceBottom ()` 让球反弹（直接从底部或顶部）。我们可以让球移动到它必须反弹的位置，然后将垂直速度或\
  \ `ballSpeedVert` 与 `-1` 相乘（注意当乘以 `-1` 时符号会发生变化）。当速度值带有 `-` 符号时，意味着当你加上 Y 坐标时，速度将变为\
  \ `bally–ballSpeedVert`，这是通过 `bally+(-ballSpeedVert)` 得到的。在这种情况下，球会以相同的速度立即改变方向。现在，当我们把\
  \ `gravity` 加入 `ballSpeedVert` 且它具有负值时，它将开始接近 0，最终变为 0 然后再次开始增加。这会让球上升，然后上升变慢，停止，然后开始下降。\n\
  \n![球在球拍上无限反弹。](img/image226.png)\n\n如果你足够仔细，你会发现我们的动画过程存在一个问题——球没有停止反弹。如果我们用现实世界的场景来看，我们会说球在每次接触表面时都会面临摩擦力和空气阻力。这正是我们希望动画过程具备的行为。实现这一点非常简单。只需添加下面的代码：\n\
  \n![image](img/image170.png)\n\n动画过程将产生[类似这样的效果](https://uploads.toptal.io/blog/image/125583/toptal-blog-image-1520329370572-9eebf4ce6165cb48c6a534ff74f8fe63.gif)。\n\
  \n`Friction` 顾其实义，指的是表面摩擦；而 `airfriction` 指的是空气摩擦。因此，`friction` 需要在球每次接触任何表面时应用。因此，这正是我们所做的。`applygravity\
  \ ()` 方法在每个循环中运行，因此你在所有循环中都会从 `ballSpeedVert` 中减去其当前值的 0.0001%。方法 `makeBounceTop\
  \ ()` 和 `makeBounceBottom ()` 会在球接触任何表面时运行。因此，我们在这些方法中执行了相同的操作，只是这次我们使用了 `friction`。\n\
  \n## 创建球拍\n\n你现在需要一个球会反弹的球拍。你还应该能够控制球拍。我们将使用鼠标来使其可控。代码如下：\n\n![image](img/image229.png)\n\
  \n我们将球拍的宽度、高度和颜色定义为全局变量。你可能想看到它们在游戏过程中发生变化。我们实现了 `drawRacket ()` 方法，其功能正如其名。你必须将\
  \ `rectMode` 设置为中心（center），这样球拍就能对齐到光标的中心。创建球拍后，下一步是让球在它上面反弹。\n\n![image](img/image196.png)\n\
  \n点击[此处](https://uploads.toptal.io/blog/image/125584/toptal-blog-image-1520329478351-575615f763bbbe38ee94503fb81f700d.gif)\
  \ 查看结果：\n\n所以，`watchRacketBounce ()` 确保球拍和球碰撞。你需要检查球和球拍是否在水平和垂直方向上对齐。初始的 if 语句检查球右侧的\
  \ X 坐标是否大于左侧，反之亦然。如果是，第二个语句将检查球和球拍之间的距离是否等于或小于球的半径。如果满足这些条件，就会调用 `BounceBottom ()`\
  \ 方法让球在球拍上反弹。\n\n变量 `pmouseY` 和 `pmouseX` 存储上一帧的鼠标坐标。由于鼠标移动速度非常快，如果鼠标向球移动足够快，你可能无法在帧之间检测到球拍和球之间的距离。因此，我们获取帧与帧之间鼠标坐标的差值并在检测距离时考虑到这一点。鼠标移动越快，可允许的距离越大。\n\
  \n现在，当我们把 `gravity` 加入 `ballSpeedVert` 且它具有负值时，它将开始接近 0，最终变为 0 然后再次开始增加。这会让球上升，然后上升变慢，停止，然后开始下降。\n\
  \n## 水平移动并控制球\n\n我们将为球添加水平移动并使其变得可控制。\n\n![image](img/image176.png)\n\n查看[这里](https://uploads.toptal.io/blog/image/125585/toptal-blog-image-1520329453372-234159ab9f)。\n\
  \n思路与垂直移动相同。我们创建了 `ballSpeedHorizon` 速度变量。然后我们创建了水平速度变量 ballSpeedHorizon，并实现了一个将水平速度应用到球上移除空气摩擦的方法。此外，我们在\
  \ `keepInScreen ()` 中增加了两个 if 语句，用于监控球是否撞击左右边缘。最后，我们确保从左到右的反弹由 `makeBounceRight\
  \ ()` 和 `makeBounceLeft ()` 处理。\n\n## 创建墙\n\n我们将添加向左移动的墙。\n\n![image](img/image045.png)\n\
  \n![image](img/image192.png)\n\n[这是结果](https://uploads.toptal.io/blog/image/125587/toptal-blog-image-1520330276517-1ff10f2d45712eb1d582e1fd6b308115.gif)。\n\
  \n你首先注意的是 `ArrayList`，它是列表的一种实现，行为类似于数组。但它是可缩放的，并且包含了非常棒的方法，如 `list.remove (index)`、`list.add\
  \ (index)` 和 `list.get (index)`。我们将墙数据以整数数组的形式存储在 arraylist 中。存储在数组中的数据是为了用于两面墙之间的间隙。我们的数组具有这些值：\n\
  \n![image](img/image022.png)\n\n\n\n\n\n实际墙体是根据间隙墙（gap wall）的值绘制的。你需要注意，使用类（classes）来处理这些内容会更整洁、更好。不过我们将这样处理：我们有两个用于管理墙的基础方法：`wallHandler`\
  \ 和 `wallHandler()`。后者每隔 `wallInterval` 毫秒向 `arraylist` 添加一个新墙体。我们有一个全局变量 `lastAddTime`，用于存储最后添加的墙。如果当前毫秒数\
  \ `millis()` 减去上次添加的毫秒——`lastAddTime`——大于间隔值——`wallInterval`——这本质上意味着你必须添加一个新墙。然后根据顶部定义的全局变量生成随机间隙变量。随后，新墙被添加到\
  \ `arraylist` 中，并将 `lastAddTime` 设置为当前的 `millis()`。`wallHandler()` 遍历 `arraylist`\
  \ 中的当前墙体，并根据 arraylist 的索引值对每个项目调用 `wallRemover(i)`、`wallDrawer(i)` 和 `wallMover(i)`。\n\
  \n`wallDrawer` 根据间隙墙数据绘制墙体。`wallDrawer` 通常会在从 `arraylist` 中获取墙体数据后，调用 `rect()` 方法将墙体绘制到它们所需的位置。`wallMover`\
  \ 直接从 `arraylist` 获取元素，并根据全局变量 `wallSpeed` 改变其 X 坐标。`wallRemover` 从 `arraylist`\
  \ 中移除超出屏幕的墙体。因此，当墙体从 `arraylist` 中移除时，它就不会在后续的所有循环中被绘制。\n\n我们现在必须检测墙体和球之间的任何碰撞：\n\
  \n![image](img/image112.png)watc\n\n在所有循环中，每个墙体都会调用 `hWallCollision()` 方法。你获取间隙墙的坐标，计算实际墙的坐标（从上到下），然后检查球的坐标是否与墙体碰撞。\n\
  \n## 健康与得分\n\n我不知道你们怎么想，但我认为顶部应该有一个血条。当球碰到墙壁时，它应该损失生命值。不过，让球从墙壁反弹回来的逻辑并不合理。当生命值为\
  \ 0 时，游戏应该结束。\n\n![image](img/image161.png)\n\n简单的运行可以在[这里](https://uploads.toptal.io/blog/image/125588/toptal-blog-image-1520330296635-cc0246c60c78d04e1de1bf597ca0124f.gif)看到。\n\
  \n我们创建了全局变量 `health`，然后创建了方法 `drawHealthBar()` 来在球上方绘制两个矩形。第一个是基础血条，另一个是显示当前生命值的激活条。第二个宽度是动态的，通过公式\
  \ `healthBarWidth*(health/maxHealth)` 来计算，即当前生命值相对于血条宽度的比例。填充颜色现在根据生命值的值设置。现在关于得分：\n\
  \n![image](img/image068.png)\n\n![image](img/image107.png)\n\n每当球穿过墙体时，我们需要得分。我们还需要确保每面墙最多只得\
  \ 1 分。这意味着如果球穿过一面墙然后又回来再次穿过，不应该再次增加分数。为了实现这一点，我们在 `arraylist` 的间隙墙数组中添加了另一个变量。如果球还没有穿过该墙，新变量将存储\
  \ 0；如果已经穿过，则存储 1。然后，我们对 `watchWallCollision()` 方法进行了修改。我们包含了一个条件，当球穿过一面它之前没有穿过的墙时，会触发\
  \ `score()` 方法并将该墙标记为已通过。\n\n我们现在需要做的最后一件事是在屏幕上实现“点击重启”。我们必须将所有使用的变量恢复到初始值，然后重启游戏：\n\
  \n![image](img/image164.png)\n\n我们现在[添加一些颜色](https://uploads.toptal.io/blog/image/125589/toptal-blog-image-1520330324780-fc506d34607110fd1c14f57150cac7b8.gif)。\n\
  \n成功！我们现在拥有了我们自己的 flappy pong。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
  \n# 结论\n\n![image](img/chapter_title_below.png)\n\n我们已经到达本书的结尾。感谢你的阅读，并祝贺你读到了最后。\n\
