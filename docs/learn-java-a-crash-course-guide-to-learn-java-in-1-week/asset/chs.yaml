  \n## 类的一些基础\n\n类（Class）或分类是对实体或由行为和状态构成的某种表示。类的状态是与其相关的数据，而类的行为是类可以执行的操作。\n\n例如，在对一个简单的车辆进行分类时，我们可以说它具有模型名称、制造商名称和生产年份。你也可以说你的汽车能够加速和减速。在这种情况下，你可以通过下面的规则定义行为和状态：\n\
  \n类的状态仅仅是类包含的内容，而类的行为是类能够做的事。你可以使用我刚刚给出的示例为你的类创建一个简单的规范：\n\n![image](img/image033.png)\n\
  \n你需要注意的是，几乎所有的编程语言对状态条目名称（state entry names）和行为名称（behavior names）都有空格的限制。例如，manufacturer\
  \ name 不是一个有效的状态条目名称，而 `manufactuerName` 则是。后者的写法使用了所谓的“驼峰命名法”（camel case），即首字母小写，其余字母大写。\n\
  \n我们已经对车辆进行了基础描述，尽管它的细节还不足以被认为重要。例如，当你想要加速车辆时会执行什么操作？在这里，我们类的行为已经声明，但尚未定义。行为声明是关于可以执行何种行为的陈。行为定义是关于如何执行该行为的陈。例如，添加一个名为\
  \ `currentSpeed` 的新状态条目可以让你定义你的行为 `accelerate` 和 `decelerate`。\n\n![image](img/image148.png)\n\
  \n有了上面的行为定义，我们能够对类执行一些有用的工作。正如你所注意到的，行为的目的是改变类的状态。这引出了关于类行为的通用规则：与类关联的行为的目的要么是访问类的修改类的状态。这条规则非常重要——重要到有一个专门的设计来衡量它的指标：内聚性（cohesion）。内聚性指的是类的状态和行为相互关联并朝着共同目标努力的程度。\n\
  \n尽管你知道车辆加速和减速的方法，但你只给了一个简单的定义，没有考虑到意外的操作。例如，如果你从小于零的当前速度开始并减速会怎样？通常，你不应该处于当前速度低于零的情况。这条关于类状态的规则被称为不变性（invariant）。不变性在行为完成之前和之后都需要保持真实。这种逻辑可以通过如下所示扩展当前的减速定义来支持：\n\
  \n![image](img/image024.png)\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n## 类型\n\n我们现在有了类的规范，但缺少一个主要元素。当你检查状态条目时，这种缺陷就变成了：当前速度的单位是什么？每小时公里？每小时英里？在这种情况下，我们还没有将其限制为距离/时间。我们需要为每个状态条目链接类型，以便更好地指定我们的类。\n\
  \n在提供类型之前，必须创建一个连接：类和类型是等一的。例如，如果你说当前速度是一个数字，那么究竟如何定义一个数字呢？\n\n如果你愿意，你本质上可以为数字创建一个类规范。\n\
  \n![image](img/image220.png)\n\n现在对类型有了理解，我们现在可以更新我们的车辆类，使其具有正确类型的状态条目（我们将使用 `type\
  \ StateName` 表示），类型名称位于状态条目名称之前。\n\n![image](img/image143.png)\n\n你需要注意的是，字符串是字符序列，我们将忽略当前速度的单位。目前，将当前速度限制为数字就足够了。当你继续描述类型时，你遇到了两个在继续装饰和完善车辆类之前需要解决的问题：原始类型和行为参数。\n\
  \n![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)\n\
  \n## 原生类型\n\n当你用其他类声明类的状态条目时，我们最终将面临一个点，无法在不形成循环层次的情况下引用另一个类。例如，如果你尝试给 `currentSpeed`\
  \ 状态分配 `number` 类型，那么你究竟如何定义 `number` 类呢？如果你尝试用其他类来定义它，那么你又如何定义那些类呢？由于你不能允许允许这种无限递归的类型系统，你需要声明一个或多个值的存在。这种公理类型被称为原生类型（primitive\
  \ types）。\n\n\n\n\n大多数编程语言都有一组基础的原始类型，包括小数值（如单精度浮点数）、整数、字符串、字符和布尔值（这些值可以是 true 或\
  \ false）。这些类型以位集的形式存在，不需要定义类的回溯结构。这些原始类型可以作为构建块，用于在类的创建方面创建更复杂的类型。为了讨论起见，我们必须假设\
  \ `string`、`number`、`Boolean` 和 `character` 类型已经存在。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)\n\
  \n## 行为参数\n\n你需要考虑的另一件事是关于执行行为时向类传递信息。例如，当你想加速到 80 公里/小时时，你必须成功执行 80 次 `vehicle`\
  \ 类的 `accelerate` 行为。对于真实系统来说，这显然太混乱了。取而代之的是，你应该尝试指示 `vehicle` 应该加速多少。例如，当你执行 `accelerate\
  \ by 30` 然后执行 `accelerate by 15` 时，你将得到 45 公里/小时的速度。为了做到这一点，你需要声明你的 `accelerate`\
  \ 行为实际上可以接受一个值，该值作为参数之一紧密地表示增加的速度。为此，你需要在关联类型之前用括号括起参数，并使用与类状态相同的表示法。正如你所注意到的，参数需要命名，否则你将无法在行为定义内部使用或访问该参数。你还需要注意，当行为没有任何参数时，你将使用空参数集。例如，如果\
  \ `drive` 行为不接受任何参数，它的声明将是 `drive()`。结果，你为你的 `vehicle` 得到了以下类：\n\n![image](img/image177.png)\n\
  \n如果你现在指示 `vehicle` 加速 30，你就能将车辆当前的速度增加 30。现在这个值 (30) 在执行时被传递给你的行为，它被称为参数（argument）。尽管参数（argument）和参数（parameter）这两个术语密切相关，但你会得到一个关键的区别：参数（parameter）是行为定义中引用的值；而参数（argument）是在执行时传递给行为的实际值。\n\
  \n我特意选择了执行表示法，是因为它将提供的参数映射到声明的形参数上。例如，`accelerate(30)` 在执行期间将值 (30) 映射到 `amount`（`number`\
  \ 类型）。这种参数的表示法可以扩展到多个参数，方法是在列举一个以逗号分隔的列表形式列出多个参数，形式如 `doSomething(number valueOne,\
  \ Number valueTwo)`。在参数按位置映射的情况下，这种参数表示法会非常有用——例如，`doSomething(15, 37)` 将 37 映射到\
  \ `valueTwo`。\n\n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)\n\
  \n## 声明类\n\n让我们从一个类定义的示例开始：\n\n![image](img/image200.png)\n\n这是类声明的一种形式。大括号之间的区域——或类体——包含了从该类创建的对象的生命周期所需代码——即用于初始化新对象的构造函数、提供类及其对象状态的字段声明，以及实现类及其对象行为的方法。上述的类声明是一个极简的——它基本上拥有了类声明的所有必要组件。你可以在类声明的开头提供更多关于类的信息，例如，它的父类名称、它是否实现了任何表面等等等。例如：\n\
  \n![image](img/image233.png)\n\n这意味着 `MyClass` 是 `MySuperClass` 的子类，它实现了接口 `YourInterface`。你可以在开头添加诸如\
  \ `private` 或 `public` 这样的修饰符——你可以看到类声明的第一行可能会变得有点复杂。通常，类声明可以按顺序包含以下组件：\n\n*   修饰符，如\
  \ `private` 和 `public`，以及你以后会遇到的其他修饰符。\n*   类名，首字母按照习惯大写。\n*   类的父类或超类名称（如果有），在其前面有\
  \ `extends` 关键字。一个类只能扩展一个父类。\n*   该类实现的接口列表，用逗号分隔（如果有），前面有 `implements` 关键字。一个类可以实现多个接口。\n\
  *   类体，由大括号 {} 括定。\n\n| ![image](img/chapter_title_corner_decoration_left.png) |\
  \  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)\n\
  \n## 声明成员变量\n\n我们有不同类型的变量：\n\n*   类中的成员变量称为字段（fields）\n*   代码块或方法中的变量称为局部变量\n* \
  \  方法声明中的变量称为参数\n\n`bicycle` 类使用以下代码行定义其字段：\n\n![image](img/image86.png)\n\n字段声明由三个部分组成，包括：\n\
  \n*   零或多个修饰符，例如 `private` 或 `public`\n*   字段的类型\n*   字段名称\n\n`bicycle` 字段名为 `gear`\
  \ 和 `speed`，它们的数据类型都是 `int`。关键字 `public` 标识这些字段为公共成员，任何能够访问类的对象都可以访问。\n\n## 访问修饰符\n\
  \n第一个最左侧的修饰符允许你控制哪些类可以访问字段。目前，你可以考虑 `private` 和 `public`。\n\n`public` 修饰符的字段可以被所有类访问。\n\
  \n`private` 修饰符的字段只能在其所属类内部访问。\n\n\n\n\n\n![image](img/image174.png)\n\n方法声明所需的元素包括返回类型、括号\
  \ `()`、名称以及位于方法大括号 `{}` 之间的方法体。通常，方法声明包含以下六个组件，顺序如下：\n\n*   修饰符，如 `private`、`public`\
  \ 等。\n*   返回类型，即方法返回的值的数据类型，如果方法没有返回值，则为 `void`。\n*   方法名——字段命名规则同样适用于方法名，但惯例略有不同。\n\
  *   括号内的参数列表——一个输入参数列表，用逗号分隔，每个参数前面是其对应的数据类型，这些数据类型通常被包含在括号中。在没有参数的情况下，可以使用空括号 `()`。\n\
  *   异常列表\n*   封装在不同大括号之间的方法体——方法的代码，其中包含了局部变量的声明。\n\n方法声明组件中有两个部分包含了方法签名（signature），即方法的名称和参数的类型。上面定义的方法具有以下签名：\n\
  \n![image](img/image146.png)\n\n### 方法的命名\n\n尽管方法名可以是任何合法的标识符，但代码规范倾向于限制方法名。按照惯例，方法名需要是小写的动词，或者是以小写动词开头、后接名词、形容词等的多词短语。对于多词短语，第二个及后续每个单词的首字母需要大写。看下面的示例：\n\
  \n![image](img/image168.png)\n\n方法在所属类中通常有一个特殊的名称。尽管如此，由于下文将讨论的方法重载（overloading），方法可能与其他方法具有相同的名称：\n\
  \n### 方法重载\n\nJava 支持方法重载；程序还可以区分具有不同方法签名的方法。这简单意味着，类中的方法如果包含不同的参数列表，它们可以有相同的名称。\n\
  \n假设你有一个类，能够使用书法绘制各种数据类型——包括整数、字符串等——并且它拥有一个绘制每种数据类型的方法。为所有方法使用一个新名称会非常麻烦。例如，`drawInteger`、`drawString`、`drawFloat`\
  \ 等。在 Java 中，你允许对所有绘制方法使用相同的名称，但为这些方法中的每一个传递不同的参数列表。因此，该数据绘制类可以声明四个名为 `draw` 的方法，每个方法都包含不同的参数列表。\n\
  \n![image](img/image002.png)\n\n传入方法的参数类型和数量有助于区分重载方法。当你查看代码示例时，`draw(int i)` 和\
  \ `draw(string s)` 是唯一且不同的方法，因为它们需要不同类型的参数。\n\n你不能声明多个具有相同名称、相同类型和数量参数的方法，因为编译器无法区分它们。编译器在区分方法时通常不考虑类型。这本质上意味着，即使每个方法使用不同的返回类型，你也无法使用相同的签名声明\
  \ 2 个方法。\n\n在移动到下面关于创建对象的章节之前，如果你能研究一下这两个部分将是极好的的，因为它们超出了本书的范围：\n\n*   为你的类提供构造函数\n\
  *   向方法或构造函数传递信息\n\n| ![image](img/chapter_title_corner_decoration_left.png) | \
  \ | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)\n\
  \n## 创建对象\n\n在 Java 中，对象是数据和处理可用数据的过程的结合。对象包含行为和状态。这两者都存储在变量或字段中，而函数或方法则显示对象的行为。类作为创建对象的模板。在\
  \ Java 中，使用 `new` 关键字来创建对象。\n\n类为不同的对象提供了蓝图。在这种情况下，你从类创建对象，程序中的以下每条语句都会构建一个对象并为其分配一个变量。\n\
  \n![image](img/image115.png)\n\n第一行创建了 `point` 类对象；第二行和第三行各创建了一个 `rectangle` 类对象。这些语句中的每一个都由如下三个部分组成：\n\
  \n*   **声明 (Declaration)**：加粗格式的代码是变量声明，将变量名与对象类型关联起来。\n*   **实例化 (Instantiation)**：如我提到的，关键字\
  \ `new` 是 Java 中的一个运算符，用于构建对象。\n*   **初始化 (Initialization)**：运算符之后是类构造函数的调用，用于初始化新对象。\n\
  \n### 如何声明变量来引用对象\n\n你已经知道声明变量需要编写类型名称：\n\n编译器被通知你将在引用类型为 `type` 的数据时使用 `name`。在处理原始变量时，这种声明也倾向于预留足够的变量内存。你可以单独的一一行中声明引用变量——例如：`point\
  \ originOne;`\n\n通过这种方式声明 `originOne`，它的值在创建对象并赋值给它之前保持未确定状态。声明给定的引用变量的操作并不止于创建对象。要实现这一点，你需要使用\
  \ `new` 运算符，我稍后会描述。如果不给它分配对象，就会接收到错误。这种状态下未引用任何内容的变量如下所示：\n\n![originOne 为 null](img/image091.png)\n\
  \n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n### 类实例化\n\n`new` 运算符为新对象分配内存并返回该内存的引用以实例化类。你需要注意的是，“实例化类”与“创建对象”没有区别。通过创建对象，你是在构建类的实例，因此是在实例化类。\n\
  \n`new` 运算符需要一个后置参数——即对构造函数的调用，构造函数名给出了要实例化的类。`new` 运算符返回它创建的对象引用。该引用通常赋值给相应的类型变量，例如：\n\
  \n![image](img/image137.png)\n\n`new` 运算符返回的引用不需要赋值给变量。你也可以在任何表达式中使用它——参考示例：\n\n\
  ![image](img/image222.png)\n\n该语句将在后面的章节中讨论。\n\n### 初始化\n\n查看下面 `point` 类的代码：\n\n\
  ![image](img/image049.png)\n\n该类有一个构造函数。你可以识别出构造函数是因为它的声明使用了与类相同的名称，并且没有任何返回类型。`point`\
  \ 类中的构造函数接收两个整数参数，代码声明为 `(int a, int b)`。下面的语句为这些参数提供了 23 和 94 的值：\n\n![image](img/image193.png)\n\
  \n当你执行此语句时，结果所示：\n\n![originOne 现在指向一个 Point 对象。](img/image191.png)\n\n`rectangle`\
  \ 类的包含四个构造函数的代码如下：\n\n\n\n\n\n![image](img/image061.png)\n\n所有的构造函数都允许你为矩形的原点、其高度和宽度提供初始值，并支持引用类型和原始类型。在一个类有多个构造函数的情况下，它们需要具有唯一（不同）的签名。Java\
  \ 编译器根据参数的数量及其类型来区分这些构造函数。当该编译器遇到下面的代码时，它知道要调用 `rectangle` 类中需要一个 `point` 参数的构造函数，其后是两个双型整数参数。\n\
  \n![image](img/image178.png)\n\n这调用了 `rectangle` 的构造函数，该构造函数将 `origin` 初始化为 `originOne`。此外，构造函数将宽度设置为\
  \ `100`，将高度设置为 `200`。你现在有两个指向同一个点对象的引用——注意，一个对象能够包含许多指向它的引用，正如随后的图所示：\n\n![现在矩形的原点变量也指向了\
  \ Point。](img/image231.png)\n\n下面的代码行调用了 `rectangle` 构造函数——该构造函数需要两个整数参数，它们提供了高度和宽度的初始值。检查构造函数内部的代码可以让你看到它创建了一个新的点对象，其\
  \ `x` 和 `y` 值被初始化为 `0`：\n\n![image](img/image160.png)\n\n下面语句使用的 `rectangle` 构造函数不接受任何参数，因此，它被称为无参数构造函数：\n\
  \n![image](img/image072.png)\n\n所有的类都不少少于一个构造函数。在类类没有显式声明任何构造函数的情况下，Java 编译器会自动提供一个无参数构造函数，称为默认构造函数。默认构造函数通常会调用父类的无参数构造函数，或者在类没有其他父类的情况下调用对象的构造函数。如果父类没有构造函数（`object`\
  \ 有一个），程序将会被编译器拒绝。\n\n随着我们接近书籍的末尾，让我们来看看一些面向对象编程中更酷的话题，我信它们会让你感兴趣！\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
  \n# Java 中的继承\n\n![image](img/chapter_title_below.png)\n\n在 Java 中，面向对象编程的原则之一是继承；继承允许我们重用现有代码或扩展已经存在的类型或扩展现有类型。简单来说，Java\
  \ 允许一个类继承另一个类以及许多接口，而接口能够继承其他接口。\n\n在今天的讨论中，我们将开始研究为什么你需要继承，以及它是如何与接口和类工作的。然后涵盖方法或变量名，以及继承成员如何受访问修饰符的影响等重要内容。\n\
  \n## 为什么要继承？\n\n花一点时间想象你是一个汽车制造商，为客户提供多种汽车型号。虽然不同的汽车型号可以提供防弹窗或天窗等功能，但它们都有共同的特征和组件，如轮子和引擎。构建一个基础设计并扩展它来构建它们的特殊版本，而不是尝试从零单独设计每个汽车型号，这是唯一合理的。同样，继承是为了帮助你创建一个具有简单特征和行为的类，并通过构建继承基类的类来创建其专用版本。同样，接口的设计也是为了扩展现有的接口。你会注意到多个术语被用来指代被另一个类型继承的类型：更具体地说；\n\
  \n- 基类型也称为父类型或超类型\n- 派生类型被称为子类型或子类型，或扩展类型\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)\n\
  \n## 类的继承\n\n### 扩展类\n\n一个类可以继承另一个类并定义额外的成员。让我们从定义一个名为 `Car` 的基类开始：\n\n![image](img/image131.png)\n\
  \n`ArmoredCar` 类在声明中使用 `extends` 关键字能够继承 `Car` 类的成员：\n\n![image](img/image021.png)\n\
  \n在 Java 中，类支持单继承；`ArmoredCar` 类不能扩展多个类。当 `extends` 关键字不可用时，类隐式地继承 `java.lang.Object`\
  \ 类。\n\n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)\n\
  \n## 继承了什么？\n\n派生类基本上继承（从基类）公共和保护的成员——这些成员不是静态的。此外，当两个类位于同一个包时，具有包权限和默认权限的成员也会被继承。\n\
  \n派生类基本上继承（从基类）非静态的公共和保护成员。派生类静态不会继承静态和私有成员。\n\n### 从派生类访问父成员\n\n这样做非常简单；你只需要使用它们。看这个简短的示例：\n\
  \n![image](img/image206)\n\n### 基类中的成员\n\n如果基类和派生类都定义了相同的方法或变量会发生什么？在这种情况下你不需要担心，因为你仍然能够访问它们。然而，你需要通过在方法或变量前加上\
  \ `super` 和 `this` 来明确你的意图。`this` 关键字指向实例。`super` 关键字表示父类实例：\n\n![image](img/image127.png)\n\
  \n许多开发者使用 `super` 和 `this` 关键字来表示他们所指的变量或方法。然而，对所有成员使用它们会让你的代码看起来很杂乱。\n\n### 隐藏的基类静态成员\n\
  \n如果派生类以及基类和派生类实际上定义了不同的静态方法和变量会发生什么？是否可以在类类内部访问静态成员，就像我们经常访问实例变量那样？\n\n我们将在示例中找到答案：\n\
  \n![image](img/image003.png)\n\n不，不可以。静态成员通常属于类而不是类实例。这意味着我们不能在 `msg()` 中使用非静态关键字\
  \ `super`。\n\n考虑到静态成员通常属于特定的类，你可以按照以下方式修改之前的调用：\n\n![image](img/image152.png)\n\n\
  考虑下面的示例，其中基类和派生类都描述了一个静态方法：\n\n`msg()` 具有相同的签名\n\n![image](img/image227.png)\n\n\
  以下是调用它们的方式：\n\n![image](img/image158.png)\n\n之前的代码 `first.msg()` 输出 `car`，而 `second.msg()`\
  \ 输出 `ArmoredCar`。调用的静态消息取决于用于引用 `ArmoredCar` 实例的变量类型。\n\n## 接口的继承\n\n实现多个接口\n\n\
  \n\n\n\n试着想象我们在前面的章节中定义的“装甲汽车”（ArmoredCar）被一个超级间谍需要。因此，制造该“汽车”的公司认为添加漂浮和飞行功能是最好的选择：\n\
  \n![image](img/image208.png)\n\n在上面的示例中，你已经注意到 `implements` 关键字被用于继承接口。\n\n### 多重继承的问题\n\
  \nJava 允许通过接口进行多重继承。在 Java 7 之前这并不是一个问题，因为接口只能定义抽象方法（那些缺乏实现的方法）。因此，如果一个类使用相同的方法签名实现了多个接口，这并没有问题；因为实现类最终只有一个方法需要实现。\n\
  \n现在，让我们来看看当 Java 8 在引入中引入接口的 `default` 方法后，简单的等式发生了什么变化。\n\n从 Java 8 开始，接口有了一个定义其方法默认实现的选项——也就是说，接口仍然能够定义抽象方法。这意味着当一个类实现多个定义了相同签名方法的接口时，子类实际上会继承不同的实现。这正如听起来很复杂一样，是不被允许的。\n\
  \nJava 不允许对不同接口中定义的相同方法进行多个实现的继承。让我用一个例子来解释：\n\n![image](img/image141.png)\n\n如果你想实现这两个接口，你必须重写\
  \ `repair()` 方法。如果前面的示例中的接口定义了同名的变量——例如 `duration`，在不加接口名前名前缀的情况下，你无法访问它们：\n\n![image](img/image151.png)\n\
  \n### 继承其他接口的接口\n\n接口基本上可以扩展多个接口，如下例所示：\n\n![image](img/image235.png)\n\n接口通过 `extends`\
  \ 关键字继承其他接口。类使用 `implements` 关键字继承接口。\n\n### 类型继承\n\n当一个类继承另一个类或接口时，除了继承它们的成员外，它倾向于也继承它们的类型。这同样适用于接口继承其他接口。这是一个非常强大的概念，它允许开发者面向接口（即接口或基类）编程，而不是面向它们的实现（无论是派生类还是具体类）。\n\
  \n例如，试着想象这样一个场景：一个组织维护着一份其员工拥有的汽车列表。所有员工显然拥有不同的型号。在这种情况下，你如何引用不同的汽车实例？解决方案在下面的示例中：\n\
  \n![image](img/image149.png)\n\n由于所有的 `Car` 派生类都继承类型 `Car`，因此派生的类实例可以使用 `Car` 类变量来引用。\n\
  \n![image](img/image202.png)\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
  \n# Java 中的封装\n\n![image](img/chapter_title_below.png)\n\n封装（Encapsulation）是指将相关的行为封装在一个对象束中，并控制或限制其他对象对其功能和数据的访问。它本质上全都是关于将相关的内容打包在一起，并将它们与外部元素隔离开。你会注意到，“封装”（encapsulation）与“数据隐藏”（data\
  \ hiding）这两个词在各处是互换使用的。你不应该误认为封装仅仅是关于数据隐藏。当你说封装时，你应该强调将相关数据以及行为进行分组、打包甚至捆绑。\n\n\
  ![encapsulation](img/image060.jpg)\n\n在面向对象编程中，当你分配一个类时，据说你应该考虑的首要原则是封装。将相关的数据及其行为分在一个桶里。封装的主要益处是可维护性。\n\
  \n信不信由，关于封装大体如此了！你可以让它保持这么简单，不多也不少。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)\n\
  \n## Java 封装\n\n任何在其上下文域域内定义良好的 Java 类都是 Java 封装的良好示例。因此，这里的本质基本上是在突出数据隐藏之后，将方法和数据捆在一起。在这种情况下，数据隐藏术语与\
  \ Java 中的访问修饰符有关。使用访问修饰符 `private` 可以更容易从外部世界隐藏属性或方法。\n\n因此，隐藏是非常直白简单的。但打包方法和数据呢？这尤为重要。你必须充分理解业务领域，并据此设计类，并将属性及其方法组合在一起。这个过程在封装中至关重要。\n\
  \n参考下方的 Java 封装概要示例。当你谈论一种动物时，你应该列出它所有的属性以及它的行为，例如它如何奔、交配、狩猎等等。当你把所有的行为和数据封装在一个类中时，你本质上是在遵循封装的原则。\n\
  \n![image](img/image013.png)\n\n注意：封装与抽象（abstraction）之间存在细微差别。你通过一个简单的例子就能轻松理解，下一个关于抽象的教程将为你提供更深入的见解。在设计类时，请确保练习封装。\n\
  \n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)\n\
  \n## Java 中的抽象\n\n抽象是在隐藏实现细节并只显示功能的情况下；在 Java 中，抽象通过接口和抽象类来实现。接口为你提供 100% 的抽象，而抽象类为你提供\
  \ 0-100% 的抽象。\n\n当你在街上看到一辆漂亮的汽车时，你只能看到整体；汽车只是一个单一单元。你看不到它的核心：它背后的复杂机械工程。\n\n现在想象你去展厅买车。你现在看到了什么？你看到的是强大的引擎、四个轮子和方向盘等等。你现在可以看到汽车的真面目——它的高级组件。但尽管如此，它内部还有许多东西赋予了汽车完整性。现在想象你是一个要维修车辆的技师，你将获得更深一层的信息。\n\
  \n当你设计软件时，你需要考虑上下文。在上面的例子中，你要问自己是在为普通观众、购买者还是技师设计软件。在这方面，抽象水平根据设计的应用。\n\n### 面向对象中的抽象\n\
  \n通常来说，软件语言本身就是抽象概念的良好示例。当你以以下方式编写语句时：\n\n```a=b+c\n```\n\n你正在将存储在两个不同位置的两个值相加，然后将结果存储在一个全新的位置。你只是用一种人类易于理解的形式来描述它。底层发生了什么？涉及到指令集、寄存器、程序计数器、存储单元等。涉及到\
  \ `POP`、`PUSH` 等的操作。我们使用的高级语言倾向于抽象这些复杂的细节。\n\n\n\n\n\n当我们谈论 Java 中的抽象时，指的是面向对象编程（OOP）中的抽象以及在\
  \ Java 中的实现方式。抽象从一个类开始构思的那一刻就开始了。我不能简单地说使用 Java 访问修饰符限制给定对象的属性就可以称为抽象，因为其中包含更多内容。你会发现抽象在面向对象编程和软件中被频繁使用。\n\
  \n### 抽象与封装\n\n当一个类被概念化时，根据上下文，你可以在其中拥有哪些属性？如果你想设计一个名为 `animal` 的类，且上下文是 `zoo`（动物园），你需要一个\
  \ `animalType` 属性来定义是野外还是宠物。当你在另一个语境下设计该类时，这个属性可能就没有意义了。\n\n同样，问问你自己你打算在类中拥有哪些行为。抽象在这里同样被应用。重要的信息与过载的信息是不同的。从类中剔除掉某些信息，这个过程就是使用或应用抽象。\n\
  \n当被问及封装和抽象之间的区别时，你可以说封装是将抽象作为一个概念来应用的。因此，这仅仅是封装。但抽象是一个概念，它甚至被应用于多态（后文讨论）和继承中。你需要从面向对象编程其他概念（包括多态、继承和封装）的更高层次来审视抽象。\n\
  \n### 抽象与继承\n\n让我们也尝试在讨论中引入继承。当你设计类的层次结构时，你应用了抽象，然后在层级之间创建了很多层。以第一级类 `cell` 为例；下一级将是\
  \ `LivingBeing`，之后是 `animal`。你根据为编程设计的上下文所创建的这种层级本身就使用了抽象。现在，对于每一级，你具体将拥有哪些属性和行为？抽象在确定这些内容方面也起着非常重要的作用。哪些属性可以暴露给更高层，以便低级类继承它？某些属性不需要保留在较高层。这种决策过程无非是使用抽象来构建不同的层级。\n\
  \n现在你已经读完了这个短章节，你应该对 Java 中实现抽象的方式有了了了。\n\n*   当你构思类时\n*   当你编写接口（interfaces）时\n\
  *   当你编写抽象类方法时\n*   当你编写 `extends` 时\n*   当你应用如 `private` 等修饰符时\n\n你在上述识别的领域将抽象作为一个概念使用。\n\
  \n![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\n\
  \n![image](img/chapter_title_above.png)\n\n# Java 中的多态\n\n![image](img/chapter_title_below.png)\n\
  \n多态从字面意思上具有许多形状的状态或采取各种形式的能力。当它被用于 Java 这样的面向对象编程语言时，它描述的是语言通过统一的单一接口处理各种类和类型对象的能力。\n\
  \n多态分为两种：运行时多态和静态绑定（也称为编译时多态）。前者以方法重载（method overloading）作为例子，而后者包含在动态多态中。\n\n可能你需要注意，多态包含一个非常重要的例子，即父类如何引用子类对象。事实上，任何满足多一个\
  \ IS-A 关系的对象在本质上都是多态的。\n\n例如，我们可以考虑 `animal` 类，并让它的一个子类成为 `cat`。因此，任何 `cat` 都是一个\
  \ `animal`。在这种情况下，`cat` 满足其自身类型的 IS-A 关系，也满足其父类 `animal` 的关系。你还需要注意，说 Java 中的每个对象在本质上都是多态的是非常合法的，因为每一个对象都通过了自身的\
  \ IS-A 测试以及对 `object` 类的测试。\n\n![image](img/chapter_title_corner_decoration_left.png)\
  \ |  | ![image](img/chapter_title_corner_decoration_right.png)\n\n![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)\n\
  \n## 静态多态\n\n对于 Java 语言，我们通过所谓的方法重载来实现静态多态。方法重载简单意味着类中存在多个方法，它们具有相同的名称，但参数类型、顺序或数量不同。\n\
  \nJava 在编译时通过查看方法签名（method signatures）知道要调用哪种方法。因此，这被称为静态绑定或编译时多态。\n\n让以下示例让你对这个概念更清晰：\n\
  \n![image](img/image211.png)\n\n在上面的示例中，我们有四种 `add` 方法。第一个接收两个参数，第二个接收三个。第 3 个和第\
  \ 4 个方法提供了参数顺序的变化。编译器通常会检查方法签名，随后在某个方法调用的编译时，决定调用哪种方法。\n\n![image](img/chapter_title_corner_decoration_left.png)\
  \ |  | ![image](img/chapter_title_corner_decoration_right.png)\n\n![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)\n\
  \n## 动态多态\n\n假设你有一个子类重写（override）了父类的某个方法。假设你在程序中创建了一个子类对象，并将其赋值给父类引用。在这种情况下，如果你在父类引用上调用被重写的方法，意味着将调用子类版本。看下面的示例：\n\
  \n![image](img/image234.png)\n\n你需要注意的是，当你第一次调用 `move()` 时，引用类型是 `vehicle`，而 `Motorbike`\
  \ 是被引用的对象。在这种情况下，当你调用 `move()` 时，程序将等到运行时来确定引用指向的对象。在我们的案例中，对象是 `MotorBike` 类。因此，将调用\
  \ `MotorBike` 类的 `move()` 方法。第二次调用 `move()` 的对象是 `vehicle` 类。因此，将调用 `vehicle` 的\
  \ `move()` 方法。\n\n注意在运行时确定要调用的方法被称为晚绑定或动态绑定。\n\n回顾一下，现在你应该知道：\n\n*   在 Java 中，通过了多个\
  \ IS-A 测试的对象在本质上都是多态的\n*   在 Java 中，所有对象至少通过两个 IS-A 测试——即一个针对 `object` 类的测试以及另一个针对自身的测试\n\
  *   在 Java 中，静态多态通过方法重载实现\n*   在 Java 中，动态多态通过方法重写实现。\n\n\n\n\n\n我们讨论了继承的概念，在代码重用、改进面向对象系统的整体结构以及减少数据冗余方面，继承无疑是一种强大的机制。当类与类之间存在关联关系（即子类本质上是父类）时，继承是理想的选择。例如，“汽车”是一种“车辆”，因此，`car`\
  \ 类包含了 `vehicle` 类的所有属性或特征，其自身的特征除外。尽管如此，不同类之间的对象之间并不总是存在“是一个（is-a）”的关系。让我们举个例子说明：“汽车不是某种引擎”。你有另一种替代方案称为“组合（composition）”，用来表示这种关系。它应用于类与类之间存在关系，且父类被包含在子类中的情况。\n\
  \n组合基本上通过对它想要使用的类对象进行引用，使类重用该功能——这与子类扩展父类功能的继承完全不同。例如，门上有一个按钮，动物园有一只狮子，汽车有一个引擎。\n\
  \n组合是聚合（aggregation）的一种特例——这意味着受限制的聚合被称为组合。当一个对象拥有另一个（对象），且被包含的对象在没有另一个对象的情况下无法存在时，我们可以称之为组合。\n\
  \n## 使用程序的示例\n\n我们将考虑下面一个展示组合概念的程序。请按照指示的步骤操作：\n\n### 步骤 #1\n\n我们首先创建一个 `Bike` 类，你可以按照如下方式声明并定义数据成员和方法：\n\
