  \n# Java 基础概念\n\n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n![image](img/chapter_title_above.png)\n\n# Java 标记\n\n![image](img/chapter_title_below.png)标记基本上是\
  \ Java 的最小逻辑组件。编译器的第一步是将整个程序分成称为标记的小块部分。你可以将它们理解为程序的构建块。让我们看看以下类型的标记：\n\n*   关键字\n\
  *   操作符\n*   字面量\n*   分隔符\n*   注释\n*   字面量\n\n让我们对每一个进行简要描述，以便有更好的理解。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
  \ |  | ![image](img/chapter_title_corner_decoration_right.png) |\n\n![image](img/chapter_title_above.png)\n\
  \n## 关键字\n\n关键字是特殊的词，或者在 Java 中被称为“保留”字，因为它们具有特殊的含义。我们有 50 个关键字，如下所示：\n\n![image](img/image223.png)\n\
  \n| ![image](img/chapter_title_above.png) |\n\n| 标识符\n\n| ![image](img/chapter_title_below.png)\
  \ |\n\n## 标识符\n\n标识符是程序员在 Java 程序中任何方法、类、变量、包、对象、标签或接口使用的名称（稍后学习这些术语的含义）。\n\n我们有标识符命名规则，包括：\n\
  \n*   Java 标识符除了符号 `$` 和下划线 `_` 之外不能包含任何特殊符号\n*   标识符需要从数字开始\n*   关键字已被保留并具有特殊含义——因此不能作为标识符使用\n\
  *   保留字面量也可以作为标识符；例如- `null`、`false` 和 `true`\n*   你不能为多个标识符使用同一个名称。标识符对大小敏感，因此\
  \ `Mf` 和 `mf` 变量是不同的。\n\n在这种情况下，有效标识符的良好示例包括：\n\n![image](img/image132.png)\n\n\
  无效标识符将包括类似：\n\n![image](img/image139.png)\n\n注意：Java 中的保留字面量和关键字是你不能作为变量或函数名称使用的词。\n\
  \n\n\n\n\n运算符是你在应用于某些操作数时产生某些结果所使用的符号。在 Java 中，我们有不同类型的运算符。正如你所看到的，某些字符串也可以用作运算符。本质上，运算符在构建表达式和语句时非常重要——其中包含：`-`、`+`、`*`、`=`、`>=`\
  \ 等。\n\n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n![image](img/chapter_title_above.png)\n\n# 分隔符\n\n![image](img/chapter_title_below.png)\n\
  \n分隔符也被称为标点（punators）。这些特殊字符和符号将代码的不同部分与其他部分隔离开。有时，它们会连接和分离一个或多个标记（tokens），或者组织代码块——这就是为什么我们称之为分隔符。\n\
  \n在 Java 中，使用的标点符号包括分号（`;`）、句号（`.`）、逗号（`,`）、一对方括号（`[`，`]`）、一组圆括号（`(`，`)`）、一对大括号（`{`，`}`）。\n\
  \n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)\n\
  \n## 字面量\n\n字面量是指 Java 编程执行过程中不会变化的任何值。你可以将它们视为字面量的常量。这些是某些字符串类型或原始类型的常量值。任何在 Java\
  \ 中使用的字面量必须是下面提到的类型之一：\n\n*   字符\n    这是在内存中存储 `Character` 常量的内容。它基本上占用 2 字节的大小，但只能存储一个字符，因为\
  \ `char` 存储的是 Unicode 字符集。它包含最大值 65535 和最小值 0。\n\n*   整数\n    整数类型基本上可以存储像 `-96`\
  \ 和 `123` 这样的整数。可以存储的值的大小主要取决于我们选择的整数类型。\n\n![image](img/image015.png)\n\n此计算 `−\
  \ (2^(n−1))` 到 `(2^(n−1)) −1` 用于值的范围。在这里，`n` 代表所需的位数——例如，`byte` 数据类型需要 1 字节= 8 位。因此，在\
  \ `byte` 数据类型中可以保留的值值范围如下：\n\n`−(2^(8−1))` 到 `(2^(8−1))−1= −2⁷ 到 (2⁷) -1`\n\n* \
  \  浮点数/数据类型\n    这些是我们用来表示带有小数部分的数字的数据类型。单精度浮点数通常占用 4 字节，而双精度浮点数占用 8 字节。这里有两个子类型：\n\
  \n![image](img/image031.png)\n\n*   布尔\n    布尔数据类型基本上存储具有两种状态的值：`false` 或 `true`。\n\
  \n通过下例可以更 get 的理解：\n\n*   `34.43`\n*   `5322`\n*   `‘d'`\n*   `Null`\n*   `True`\n\
  \n| ![image](img/chapter_title_corner_decoration_left.png) |  | ![image](img/chapter_title_corner_decoration_right.png)\
  \ |\n\n![image](img/chapter_title_above.png)![image](img/chapter_title_below.png)\n\
