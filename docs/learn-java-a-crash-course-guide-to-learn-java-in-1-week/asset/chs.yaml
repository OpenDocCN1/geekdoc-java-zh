  \ |\n\n![image](img/chapter_title_above.png)\n\n# Java 编程：背景\n\n![image](img/chapter_title_below.png)\n\
  \n在我们进入 Java 编程之前，让我们先确保你理解什么是计算机编程（或编码）。\n\n## 什么是编程？\n\n根据定义，编程是构建软件的过程，它由指令组成，这些指令通常被称为\
  \ `source code`。在本书中，我们将学习这些基础。\n\n### 源代码像什么样？\n\n`source code` 基本上是计算机可以理解的指令。在开始之前，我们需要理解这一点。请查看以下代码：\n\
  \n![image](img/image187.png)\n\n在某些情况下，代码是正确的，遵循自然语言的。请查看以下代码：\n\n![image](img/image171.png)\n\
  \n### 编程还包括测试和调试\n\n在编写代码时，必须进行测试，因为代码可能会崩溃或显示错误结果。专业程序员通常使用不同的方法来测试代码，以避免此类问题。最后，我们有一个术语叫做\
  \ `debugging` -这是调查、诊断和修复问题的过程。在本书的过程中，你将会发现。\n\n### 所以，什么是 Java 编程语言？\n\nJava 编程语言是一种计算机编程语言，它独特地允许你使用英语来编写计算机指令，而不是编写机器代码。就像英语一样，Java\
  \ 有一些规则决定这些指令如何编写；这些规则被称为 `syntax`。基本上，当编写程序时，高级指令会被转换为计算机可以理解并执行的代码。\n\n## 是谁创建了\
  \ Java？\n\nJava 是 90 年代初由名为 James Gosling 的人为 Sun Microsystems（现由 [Oracle](https://www.oracle.com/sun/index.html)\
  \ 所有）创建的。该程序最初被称为 `Oak`。\n\nJava 最初设计用于编写由不同计算机处理器控制的家电器，随后是手机等设备。很快，人们意识到这种语言需要被各种计算机处理器访问。1994\
  \ 年，这种语言被认为非常适合用于浏览器，很快，它与互联网的联系开始了。1995 年，Netscape 发布了能够运行 Java 程序的最新版本 Netscape\
  \ 浏览器，1996 年当 Java 1.0 发布时，它的主要重点已经转向互联网使用，从而通过为开发者提供创建动态网页的好方法来实现与用户的交互性。\n\n自\
  \ 1.0 版本以来，我们看到了许多更新和发展，例如：\n\n*   `J2SE 1.3` 发布于 2000 年\n*   `J2SE` 发布于 2004 年\n\
  *   `Java SE 8` 发布于 2014 年\n*   `Java SE 10` 发布于 2018 年\n\n多年 Java Java 无疑演变成了一种可以在互联网内外使用的优秀且成功的语言。让我们接触一下使用\
  \ Java 编程语言的优点：\n\n\n\n\n\n每种编程语言的引入都有其目的，并具有某些优点。尽管每种语言都提供了开启蓬勃职业生涯的机会，但 Java 通常更受青睐。Java\
  \ 的优点确实数不胜数，但我将简要提到几点。\n\n### ✓ 你可以获得丰富的信息\n虽然现有的编程语言之间没有明显的竞争，但 Java 凭借其丰富的信息，有时被认为是最好的。Java\
  \ 已经存在多年，因此对于你脑海中出现的关于编程的所有查询，你都可以快速获得答案。因此，在磨练技能的过程中，你可以轻松地解决每一个问题。\n\n### ✓ 易于学习\n\
  有时初学者倾向于认为，语言越好，可能越难学。然而，事实并非如此——至少对于 `Java` 来说不是。确实有一些不可避免的初始障碍，但该语言使用普通的简单英语，而不是泛型或多重括号，这使得该语言变得易于学习。当你学会了如何正确安装\
  \ `JDK` 和配置 `PATH` 后，剩下的学习和实现过程将非常有趣。\n\n### ✓ 你将获得强大的工具集\n你经常会听到，在编程中，语言的工具集对于决定其整体成功起着主要作用。`Java`\
  \ 在这方面无疑具有优势，因为它对开源系统提供了完整的支持。这意味着作为用户，你可以获得几乎满足你所需一切的工具。我们有许多开源库，提供了有关与 `Java`\
  \ 编程相关的所有主题的信息。此外，还有许多社区（尤其是在线社区）来指导新程序员。\n\n### ✓ 你可以从自己的错误中学习\n我们有几种语言设计用于教导或允许你从自己的错误中学习，并让你建立基础。`Java`\
  \ 包含一些出色的 `IDE`（`IDE` 指的是集成开发环境——参见术语表），这些工具会在你犯错时立即提醒你。此外，该语言还建议你重新格式化代码并给出这样做的理由。这样，你从基础阶段开始对编码有清晰的理解，在开始职业旅程时几乎不会犯任何错。\n\
  \n### ✓ 语言是免费的\n获取 `Java` 从一开始开始就不需要产生任何费用。因此，无论你处于学习阶段还是专业阶段，都可以使用 `Java` 创建或开发应用程序，而无需向任何人支付现金。你只需要学习如何获取程序、设置它并开始即可。\n\
  \n### ✓ 为专业人士提供更好的前景\n作为打算学习编程语言以开启职业生涯的人，`Java` 仍然是你的最佳选择。它被应用于大多数现有程序中，其应用范围仍在进一步扩大。因此，通过学习这种语言，与其他专门学习语言的程序员相比，你可以预期在行业中拥有更好的职业。\n\
  \n考虑到所有这些，让我们开始实际学习 `Java`。\n\n# 基础知识/先决条件\n\n本节描述了你在开始编写任何代码之前需要准备的东西。要开始，你应该下载\
  \ `Java`（Java 运行环境 -JRE/ Java 开发工具包-`JDK`）以及集成开发环境 `IDE`。\n\n## 如何下载和安装 Java\n\n\
  对于任何操作系统，下载和安装 `Java` 都是简单的。我将向你展示如何以 Linux 和 Windows 操作系统为例下载并安装此程序。\n\n# 1: Linux\n\
  \n在本节结束时，你将为你的 Linux 机器安装并配置好 `Java`——无论是 Debian、Mint 还是 Ubuntu。不过，在整个指南期间我将使用 Ubuntu\
  \ 14.04，并提到终端和非终端的操作方法，以帮助完全的新手跟进。\n\n你将安装 Oracle `JRE` 或 Oracle `JDK`，因此你需要真正理解两者之间的区别。\n\
  \n### Oracle JRE (Java 运行环境)\n`JRE` 是执行 `Java` 程序的最低要求。它包含了 `JVM`（Java 虚拟机）、支持文件和核心类。换句话说，如果你只关乎在计算机或浏览器上运行\
  \ `Java` 程序，你将安装 `JRE`。\n\n### Oracle JDK (Java 开发工具包)\n这是一个软件开发工具包，包含了 `JVM`、`JRM`（Java\
  \ 运行环境）以及生产环境中用于构建和编译程序的整个类库列表。因此，如果你想进行一些 `Java` 开发，你就需要 `JDK`。\n\n话虽如此，让我们开始吧。\n\
