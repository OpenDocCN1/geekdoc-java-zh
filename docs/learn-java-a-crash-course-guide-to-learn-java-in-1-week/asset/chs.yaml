  \ project”（Java 项目）（或者“file”然后“new”然后“project”然后“java project”。）\n*   弹出“new java\
  \ project”对话框。\n*   在“project name”（项目名称）中输入 `firstproject`。\n*   勾选“user default\
  \ location”（用户默认位置）。\n*   在 JRE 中选择“use default JRE”（使用默认 JRE）。\n*   在“project layout”（项目布局）中勾选“use\
  \ project folder as the root for sources and class files”（使用项目文件夹作为源文件和类的根目录），然后点击“finish”（完成）按钮。\n\
  \n在我们继续（编写我们的第一个项目）之前，让我们过一遍 Java 的一些基本概念。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
