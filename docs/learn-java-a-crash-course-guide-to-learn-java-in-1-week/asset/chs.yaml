  \n下一步涉及将解压下载的文件以进行安装。将文件解压到指定目录（例如，`c:\\javaproject`）。\n\n你不需要运行任何安装程序。更重要的是，当你不再需要它时，可以直接删除整个\
  \ eclipse 目录（而无需运行“卸载程序”）。可以随意重命名或移动该目录。此外，请注意，你可以在同一台机器上解压（安装）多个副本。\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
