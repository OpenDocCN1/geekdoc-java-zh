  \n# 引言\n\n![image](img/chapter_title_below.png)\n\n我想感谢你并祝贺你下载了《Java 初学者：1 周学会 Java\
  \ 的速成指南》这本书。\n\n这本书是针对 Java 编程的终极学者速成课程，因为它将帮助你在最短 1 周内掌握该语言的足够知识！\n\n我们都有梦想。我的梦想可能是成为一名伟大的老师，而你的梦想可能是在\
  \ IT 领域拥有辉煌的职业，或者通过提升 IT 领域的技能和知识来实现自我价值（或类似的目标）。毫无疑问，`Java Programming Language`\
  \ 提供的实践经验和专业知识，是任何渴望成为专业程序员的人的必备要求。\n\n但虽然你可能有动力去学习这门语言，但我确定你多次问过自己一些问题：为什么要编程？或者为什么要选择\
  \ Java？你学习编程——特别是学习 Java——有许多原因，其中大部分我确定你已经知道了。不过如果你问我的话，我可能会直率地说，我们中有些人学习是为了赚钱。学习编程这门艺术和职业确实会带来许多与自我实现和成就感相关的收益，但经济上的收益实在太明显了，无法忽视。\n\
  \n首先，Java 可能是最受推崇的技能，几乎在任何地方都需要它。IBM、Infosys、Twitter、Netflix、Google、Spotify、Uber、Amazon、Target、Yelp、Square\
  \ 以及[其他大厂](https://siftery.com/java) 始终需要优秀的 Java 程序员。根据 `PayScale.com`（提供薪资信息的网站），Java\
  \ 开发人员的平均年约为约为 70,000 美元。作为该领域的专业人士，你可以在全球范围内工作，因为需求不受限于特定的地理区域。\n\n这本书是专为设计的终极指南，旨在帮助你从一个对编程完全陌生的人转变为一个能够教授该学科并完成良好编程项目的人。酷的地方在于：你可以在一个周内学会所有内容！它已更新到最新版本（8\
  \ 和 10），书中将涵盖的主题包括：\n\n* 变量\n* 条件\n* 循环\n* 数组\n* 运算符\n* 用户输入\n* 类\n* 对象\n* 方法\n\
  * 面向对象编程，包括：\n    * ✓ 继承\n    * ✓ 封装\n    * ✓ 多态\n    * ✓ 组合\n\n以及更多、更多更多的内容！让我们开始学习吧。\n\
  \n再次感谢下载本书。我希望你喜欢它！\n\n\n\n\n\n\n\n\n\n\n6. 如何下载和安装 Java\n\n| ![image](img/chapter_title_corner_decoration_left.png)\
