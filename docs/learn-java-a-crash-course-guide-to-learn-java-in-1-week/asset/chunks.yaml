    ## 类变量或静态变量


    类变量也被称为静态变量，在类中使用 `static` 关键字声明，但位于方法、块或构造函数之外。无论从该类创建了多少个对象，每个类都只有一个类变量副本。


    静态变量很少被使用——除了被声明为常量之外。常量本质上是声明为 `private`/`public`、`static` 和 `final` 的变量。常量变量永远不会从其初始值发生改变。


    静态变量存储在静态内存中，通常不会将静态变量作为 `private` 或 `public` 常量。静态变量在程序启动时创建，程序停止时销。


    可见性与实例变量相似。然而，大多数静态变量被声明为 `public`，因为它们需要对类用户可用。默认值与实例变量相似，对于数字，零代表默认值。对于 `Booleans`
    为 `false`，对于对象引用为 `null`。值可以在构造函数内部或在声明期间赋值。此外，值可以在特定的静态初始化块中赋值。


    访问静态变量需要使用类名进行调用——`className.VariableName`。


    最后，如果我们将类变量声明为 `public static final`，这本质上意味着常量或变量名全部大大写。此外，如果静态变量既不是 `public`
    也不是 `final`，这意味着命名语法与实例变量和局部变量相似。


