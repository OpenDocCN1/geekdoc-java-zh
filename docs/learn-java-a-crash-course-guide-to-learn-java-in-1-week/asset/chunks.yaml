    # Loops In Java


    ![image](d2d_images/chapter_title_below.png)


    In Java or any other programming language, looping is a feature that facilitates
    the execution of a set of instructions or functions recurrently as some condition
    evaluates to true. Java offers three ways to execute the loops.


    Even as all the ways offer the same basic functionality, they usually differ in
    terms of syntax and the condition checking time.


    ### While Loop


    The while loop, to begin with, is a flow control statement that lets code to be
    repeatedly executed according to a particular Boolean condition. You can think
    of the while loop as repeating the `IF` statement.


    ![image](d2d_images/image073.png)


    Take a look at the flowchart below:


    ![while loop](d2d_images/image218.png)


    The while loop begins by checking the condition. If it evaluates to true, the
    loop body statements automatically become executed, if not, the first statement
    following the loop becomes executed. Therefore, it is for this reason that it
    is known as entry control loop.


    When the condition evaluates to true, the loop statements get executed. Usually,
    the statements have what’s known as an update value for the specific variable
    that is under processing for the subsequent iteration.


    If the condition turns false, the loop then terminates thus killing its life cycle.


    ![image](d2d_images/image108.png)


    When you run it on IDE, you get the following output:


    ![image](d2d_images/image181.png)


    ### For Loop


    This type of loop offers a concise way to write the loop structure. Unlike the
    while loop, the `for` statement uses up the initialization, increment and decrement,
    and condition in one line, thus giving a shorter, easy to debug looping structure.


    ![image](d2d_images/image184.png)


    The flowchart is as follows:


    ![for-loop-in-java](d2d_images/image205.png)


    #### Initialization condition

    In this case, you initialize the variable being used. It marks the beginning of
    a for loop. A variable that is already declared can be put to use or a variable
    can get declared, that is local to loop alone.


    #### Testing condition

    This one is used to test a loop’s exit condition. It must take back a Boolean
    value. It also acts as an entry control loop as the condition gets checked before
    the loop statements are executed.


    #### Statement execution

    When the condition evaluates to true, the loop body statements become executed.


    #### Increment/decrement

    This one is used to update the variable for the subsequent iteration.


    #### Loop termination

    If the condition is false, what happens is that the loop terminates to mark the
    end of its lifecycle:


    ![image](d2d_images/image071.png)


    When you run it on IDE, you get the following output:


    ![image](d2d_images/image075.png)


    #### The Enhanced For Loop


    Java also entails another for loop version that was introduced in Java 5. Enhanced
    for loop offers an easier way of iterating through the elements of a collection
    or array. It is rigid and you should use it only when you really need to iterate
    through the elements in a sequence without being aware of the index of the currently
    processed element.


    ![image](d2d_images/image179.png)


    As an example (a demonstration of how you can use the enhanced for loop to simplify
    the work), assume you have an array of names and want to print all the names contained
    in the array. Let’s take a look at the difference between these two examples.
    The enhanced for loop makes things easier in the following manner:


    Running it on IDE will give you the following output:


    ![image](d2d_images/image082.png)


    ### Do while


    The do while loop is largely the same as the while loop. The only difference however
    is that it checks for condition once it executes the statements and thus, it is
    a good example of the exit control loop.


    ![image](d2d_images/image006.png)


    The flowchart is as follows:


    ![do-while](d2d_images/image147.png)


    The do while loop begins with the statement(s’) execution. For the first time,
    there usually isn’t any checking of any condition.


    Once the statements are executed, and there is the update of the variable value,
    the condition gets checked for a true or false value. In case it gets evaluated
    to true, the next loop iteration commences.


    When the condition turns out to be false, the loop is terminated and just like
    that, its life cycle ends.


    ![image](d2d_images/image17.png)


    When you run it on IDE, you get the following output:


    ![image](d2d_images/image36.png)


