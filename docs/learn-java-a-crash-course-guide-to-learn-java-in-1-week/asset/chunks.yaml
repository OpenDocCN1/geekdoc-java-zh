    # Variables


    ![image](d2d_images/chapter_title_below.png)


    Variables are containers that store data in programming. When a variable is declared,
    it is initialized with some value and then changed to another value later on.
    A variable can be further used to do any calculations, printing and so forth.
    Each variable needs to have a datatype such as Boolean, int and so on, and that
    type needs to be specified at the time the variable was declared. Each variable
    needs to have a non-duplicate or unique name to identify it.


    Let’s take an example of a student program. In such, we can have a single variable
    to store ‘the student section’, another one for ‘student roll number’ and so forth.


    ![image](d2d_images/image239.png)


    In this case, ‘char’ is used to specify the variable’s data type while the ‘section’
    is used to specify the variable name. That’s not all; ‘int’ is the datatype and
    ‘roll_number’ is the variable name. You can assign some value to a variable at
    the same moment it is declared, in a process known as initialization.


    ![image](d2d_images/image195.png)


    In this case, ‘int’ is used to define the variable data type while the ‘roll_number’
    is defined by the variable name, where 76 is the variable’s current number. As
    seen above, one variable- or roll_number in your program can store numerical data
    whereas another variable- or section can store the char data. The special keywords
    in Java signify the type of data that every variable stores. This means that we
    can actually declare variables with the types/keywords and initialize the variable’s
    value.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)![image](d2d_images/chapter_title_below.png)


    ## The Types of Variables In Java


    In Java, variables can be divided into four categories namely:


    *   Static variable


    *   Instance variable


    *   Method parameter


    *   Local variable


    ### Instance Variable


    Also known as non-static fields, instance variables are used to store states of
    objects. The variables that are defined without the static keyword, and are outside
    any declaration method automatically are object-specific, and are referred to
    as instance variables due to the fact that their values are instance specific
    and their values don’t get shared among instances. Some people look at non-static
    fields as instance variables because their values tend to be unique to each class
    instance. For instance, the currentSpeed of a certain bicycle is independent from
    another’s currentSpeed.


    Further, you need to note the following:


    *   When a space is assigned for an object in the heap (see glossary), a slot
    for every instance variable value is made.


    *   These variables are made when objects are created using the keyword ‘new’
    and destroyed when the object gets destroyed.


    *   Instance variables hold values that have to be referenced by multiple methods,
    block or constructor, or the essential parts of the state of an object that need
    to be present throughout the class.


    *   Instance variables could as well be declared within the class level right
    before use or after use.


    *   Keywords used to specify accessibility of a class or type and its members,
    which are also known as access modifiers could be given for different instance
    variables.


    *   Instance variables contain default values. For the numbers, zero is the default
    value; it’s false for the Booleans and null for the object references. During
    declaration (or within the constructor), the values can be assigned.'
