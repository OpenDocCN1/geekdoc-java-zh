    ## The Bitwise Operators


    We basically have six bitwise operators which include: ![image](d2d_images/image057.png)


    ![image](d2d_images/image040.png)


    I’m sure you’ve heard that bitwise operators perform processing bit by bit.


    Num 1 & num 2 essentially compare their corresponding bits (of num1 and num2)
    before generating 1- if the two bits are equal, otherwise, else would return 0\.
    In the case here, it would return: 2 which is just 00000010 since in num 1 and
    num 2 binary form, it’s only the second last bits that are matching.


    Num 1 | num 2 compares num 1 and num 2 bits and then generates 1, that is if either
    bit is 1, otherwise it returns zero. In the case here, it returns 31, which essentially
    is 00011111.


    Num 1^ num 2 on the other hand compares the corresponding bits of num 2 and num
    1 before generating a 1; that is if they are not equal, otherwise it returns 0\.
    In our example here, it would return 29, which is equal to 00011101.'
