    body- has all the code that offers for the life cycle of the objects made from
    the class- that is constructors to initialize new objects, the declarations for
    the fields providing the class’ state and its objects, as well as methods to implement
    the behavior of both the class and its objects. The class declaration that precedes
    is a minimal one- it basically has all the required components of a class declaration.
    You can offer more information concerning the class, for instance, its super class’
    name, whether it implements any surfaces, and so forth, at the beginning of the
    class declaration. For instance:


    ![image](d2d_images/image233.png)


    This means that `MyClass` is `MySuperClass`’ subclass which implements the interface
    `YourInterface`. You can add such modifiers like `private` or `public` at the
    start- so you can see that the first line of a class declaration can get a bit
    complicated. Generally, class declarations can comprise the following components
    in order:


    *   Modifiers, like `private` and `public`, as well as a couple of others that
    you’ll come across later.

    *   The class name along with the initial letter conventionally capitalized

