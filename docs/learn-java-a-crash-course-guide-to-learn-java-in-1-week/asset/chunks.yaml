- fmt: "\nBefore we get to the specifics, let’s start by learning some of the common\
    \ terms that you will encounter as you learn about Java, whether in this book\
    \ or in any other learning material.\n\n| ![image](d2d_images/chapter_title_corner_decoration_left.png)\
    \ |  | ![image](d2d_images/chapter_title_corner_decoration_right.png) |\n\n![image](d2d_images/chapter_title_above.png)\n\
    \n# Understanding the Lingo: A Glossary\n\n![image](d2d_images/chapter_title_below.png)\n\
