    ## 类型


    我们现在有了类的规范，但缺少一个主要元素。当你检查状态条目时，这种缺陷就变成了：当前速度的单位是什么？每小时公里？每小时英里？在这种情况下，我们还没有将其限制为距离/时间。我们需要为每个状态条目链接类型，以便更好地指定我们的类。


    在提供类型之前，必须创建一个连接：类和类型是等一的。例如，如果你说当前速度是一个数字，那么究竟如何定义一个数字呢？


    如果你愿意，你本质上可以为数字创建一个类规范。


