    现在对类型有了理解，我们现在可以更新我们的车辆类，使其具有正确类型的状态条目（我们将使用 `type StateName` 表示），类型名称位于状态条目名称之前。


    ![image](img/image143.png)


    你需要注意的是，字符串是字符序列，我们将忽略当前速度的单位。目前，将当前速度限制为数字就足够了。当你继续描述类型时，你遇到了两个在继续装饰和完善车辆类之前需要解决的问题：原始类型和行为参数。


