    # Java 编程：背景


    ![image](img/chapter_title_below.png)


    在我们进入 Java 编程之前，让我们先确保你理解什么是计算机编程（或编码）。


    ## 什么是编程？


    根据定义，编程是构建软件的过程，它由指令组成，这些指令通常被称为 `source code`。在本书中，我们将学习这些基础。


    ### 源代码像什么样？


    `source code` 基本上是计算机可以理解的指令。在开始之前，我们需要理解这一点。请查看以下代码：


    ![image](img/image187.png)


    在某些情况下，代码是正确的，遵循自然语言的。请查看以下代码：


    ![image](img/image171.png)


    ### 编程还包括测试和调试


    在编写代码时，必须进行测试，因为代码可能会崩溃或显示错误结果。专业程序员通常使用不同的方法来测试代码，以避免此类问题。最后，我们有一个术语叫做 `debugging`
    -这是调查、诊断和修复问题的过程。在本书的过程中，你将会发现。


    ### 所以，什么是 Java 编程语言？


    Java 编程语言是一种计算机编程语言，它独特地允许你使用英语来编写计算机指令，而不是编写机器代码。就像英语一样，Java 有一些规则决定这些指令如何编写；这些规则被称为
    `syntax`。基本上，当编写程序时，高级指令会被转换为计算机可以理解并执行的代码。


    ## 是谁创建了 Java？


    Java 是 90 年代初由名为 James Gosling 的人为 Sun Microsystems（现由 [Oracle](https://www.oracle.com/sun/index.html)
    所有）创建的。该程序最初被称为 `Oak`。


    Java 最初设计用于编写由不同计算机处理器控制的家电器，随后是手机等设备。很快，人们意识到这种语言需要被各种计算机处理器访问。1994 年，这种语言被认为非常适合用于浏览器，很快，它与互联网的联系开始了。1995
    年，Netscape 发布了能够运行 Java 程序的最新版本 Netscape 浏览器，1996 年当 Java 1.0 发布时，它的主要重点已经转向互联网使用，从而通过为开发者提供创建动态网页的好方法来实现与用户的交互性。


    自 1.0 版本以来，我们看到了许多更新和发展，例如：


    *   `J2SE 1.3` 发布于 2000 年

    *   `J2SE` 发布于 2004 年

    *   `Java SE 8` 发布于 2014 年

    *   `Java SE 10` 发布于 2018 年


    多年 Java Java 无疑演变成了一种可以在互联网内外使用的优秀且成功的语言。让我们接触一下使用 Java 编程语言的优点：


