  raw: 'Each programming language has been introduced with a purpose and has some
    benefits. Even though each language creates the opportunity to begin a flourishing
    career, Java is usually given preference. The benefits of Java in particular are
    indeed countless but I will mention a few briefly.


    ✓  You get rich information


    While there is no obvious competition between existing programming languages,
    Java is considered the best-sometimes owing to its wealth of information. Java
    has been existing for many years so you can expect a quick answer to nearly all
    queries that come to mind with regards to programming. Thus, you can solve each
    one of your problems easily as you hone your skills in the process.


    ✓  Ease of learning


    Sometimes beginners tend to think that the better a language is, the harder it’s
    probably going to be to learn it. However, that is not true- at least not with
    Java. There are definitely some unavoidable initial hurdles but the fact that
    the language uses ordinary and simple English in place of generics or multiple
    brackets makes the language easy to learn. When you learn how to install JDK and
    the installation of PATH the right way, the rest will be fun to learn and implement.


    ✓  You get a great toolset


    You will often hear that in programming, the toolset of a language has a major
    role to play in determining its overall success. Java undeniably has an upper
    hand in this respect because it comes with a complete support for open source
    systems. This means that as a user, you can get tools for nearly everything you
    require. We have a number of open source libraries that provide information on
    all topics to do with Java programming. Also, there are a number of communities-
    especially online to guide new programmers.


    ✓  You get to learn from your mistakes


    We have a few languages that are designed to teach or allow you to learn from
    your own mistakes and let you build up your base. Java contains some great IDEs
    (IDE refers to Integrated Development Environment – see glossary) that are tasked
    with updating you of your errors as soon as you make them. Besides that, the language
    also suggests for you to reformat the codes and gives you the reason for doing
    that. That way, you get a clear understanding of coding right from the basic stage
    and barely get yourself making any mistakes as you begin your journey as a professional.


    ✓  The language is free


    To get Java, you don’t have to incur any cost from the very beginning. Therefore,
    whether you are in the learning stage or professional stage, you can create or
    develop an application using Java without paying anybody any cash at all. All
    you need to learn is how to get the program, set it up and begin.


    ✓  Better scope for the professionals


    As you intend to learn a programming language to start a professional career,
    Java remains your best bet. It is applied in most existing apps and its scope
    is still being increased further. Therefore, by learning this language, you can
    expect a better career in the industry compared to another programmer specialized
    in another language.


    With all that in mind, let’s move on to actually getting started with Java.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # The Fundamentals/Prerequisites


    ![image](d2d_images/chapter_title_below.png)


    This section describes the things you need to get before you begin coding anything.
    To get started, you should download Java (Java runtime environment -JRE/ Java
    Development Kit- JDK), and the Integrated Development Environment -IDE.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)![image](d2d_images/chapter_title_below.png)


    ## How To Download And Install Java


    Downloading and installing Java is simple for any kind of operating system. I
    will show you how you can download and install this program using Linux and Windows
    operating systems as examples.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # 1: Linux


    ![image](d2d_images/chapter_title_below.png)


    By the end of this section, you will have Java well installed and configured for
    your Linux machine- whether it’s Debian, Mint or Ubuntu. I will, however, be using
    Ubuntu 14.04 for the duration of the guide and also mention the terminal and non-terminal
    ways of going about the process to help you follow in case you are a complete
    newbie.


    You are going to be installing either Oracle JRE or Oracle JDK so you need to
    really understand the difference between the two.


    ### Oracle JRE (Java Runtime Environment)


    JRE is the minimum requirement to be able to execute a Java program. It entails
    the JVM (Java Virtual Machine), supporting files and core classes. In other words,
    when all you care about is running Java programs on your computer or browser,
    you’ll install JRE.


    ### Oracle JDK (Java Development Kit)


    This is a software development kit that comprises the JVM, JRM (Java Runtime Environment),
    as well as the entire list of class libraries present in the production environment
    to build and compile programs. Thus, if you want to do some Java development,
    you’ll require JDK.


    Having said that, let’s start.


    Create the Java Folder


    As an example, we’ll begin by creating an empty folder called ‘Java’ for your
    JRE/JDK files in the directory /usr/local which makes the path of the folder:
    /usr/local/java. Get to the terminal and type the command below then press okay:


    ![image](d2d_images/image035.png)![image](d2d_images/image011.png)


    Check the Linux version


    Before you download the java files, you have to understand the Linux version you
    are running (32 bit or 64 bit).


    The terminal method


    Open the terminal and type the command below, then press okay:


    file /sbin/init 


    ![image](d2d_images/image124.jpg)


    For instance, you can see in the above image that the result received before the
    command execution informs me that the Linux version I am running is 64 bit.


    Try doing the same without the terminal:


    Non-terminal method


    As a user of Ubuntu, you can check your version by checking the details under
    systems panel in the system settings.


    ––––––––


    ![image](d2d_images/scene_break.png)


    ![image](d2d_images/image230.jpg)


    As you can see, the dialog box called ‘details’ will pop up. You’ll see the Linux
    version beside the OS type in the ‘overview’ tab.


    ![image](d2d_images/image153.jpg)


    Download Oracle JRE/JDK


    Head on to the Java [Download Page](http://www.oracle.com/technetwork/java/javase/downloads/index.html)
    and choose either JRE. Since you are only running Java programs on your computer
    (as I mentioned earlier) and don’t require the full-featured Software Development
    Kit for Java in JDK (even though it also includes JRE) which is only useful for
    application development like android development, JRE (and not JDK) is good enough.


    ![image](d2d_images/image204.png)


    ![image](d2d_images/image103.png)


    If you choose Java JRE, a screen like the one below will pop up. Just below Java
    SE Runtime Environment, you’ll see ‘Accept License Agreement’; check the box.


    ![image](d2d_images/image114.png)


    If you are running a 32-bit Linux, choose the Linux x86 link. If you are running
    a 64-bit Linux, choose the Linux x64 link.


    The file will be downloaded to the directory: home/unsername/downloads. For instance,
