    我确定你可能在怀疑你对物理的理解是否受到了威胁。我知道在现实生活中，重力的作用原理并非如此。请将此视为一个动画过程。变量 `Gravity` 只是一个数值——一个
    `float` 类型，这使得我们可以使用小数而不仅仅是整数——在每个循环中，我们将其加到 `ballSpeedVert` 上。实际上，`ballSpeedVert`
    代表球的垂直速度，它在所有循环中都会作用于球的 Y 坐标（`bally`）。你通过观察球的坐标来确保它留在屏幕内，如果你不这样做（你可能已经知道了），球将一直掉落到无限。不过，目前球只在垂直方向上移动。这意味着我们在监控屏幕上地板和天花板的边界。


    通过 `keepInScreen ()` 方法，我们检查 `bally` 或 `+` 半径是否小于 `height`，同样地，检查 `bally` 或半径是否大于
    0。如果条件不满足，你可以使用方法：`makeBounceTop ()` 和 `makeBounceBottom ()` 让球反弹（直接从底部或顶部）。我们可以让球移动到它必须反弹的位置，然后将垂直速度或
    `ballSpeedVert` 与 `-1` 相乘（注意当乘以 `-1` 时符号会发生变化）。当速度值带有 `-` 符号时，意味着当你加上 Y 坐标时，速度将变为
    `bally–ballSpeedVert`，这是通过 `bally+(-ballSpeedVert)` 得到的。在这种情况下，球会以相同的速度立即改变方向。现在，当我们把
    `gravity` 加入 `ballSpeedVert` 且它具有负值时，它将开始接近 0，最终变为 0 然后再次开始增加。这会让球上升，然后上升变慢，停止，然后开始下降。


    ![球在球拍上无限反弹。](img/image226.png)


    如果你足够仔细，你会发现我们的动画过程存在一个问题——球没有停止反弹。如果我们用现实世界的场景来看，我们会说球在每次接触表面时都会面临摩擦力和空气阻力。这正是我们希望动画过程具备的行为。实现这一点非常简单。只需添加下面的代码：


    ![image](img/image170.png)


    动画过程将产生[类似这样的效果](https://uploads.toptal.io/blog/image/125583/toptal-blog-image-1520329370572-9eebf4ce6165cb48c6a534ff74f8fe63.gif)。


    `Friction` 顾其实义，指的是表面摩擦；而 `airfriction` 指的是空气摩擦。因此，`friction` 需要在球每次接触任何表面时应用。因此，这正是我们所做的。`applygravity
    ()` 方法在每个循环中运行，因此你在所有循环中都会从 `ballSpeedVert` 中减去其当前值的 0.0001%。方法 `makeBounceTop
    ()` 和 `makeBounceBottom ()` 会在球接触任何表面时运行。因此，我们在这些方法中执行了相同的操作，只是这次我们使用了 `friction`。


    ## 创建球拍


    你现在需要一个球会反弹的球拍。你还应该能够控制球拍。我们将使用鼠标来使其可控。代码如下：


    ![image](img/image229.png)


    我们将球拍的宽度、高度和颜色定义为全局变量。你可能想看到它们在游戏过程中发生变化。我们实现了 `drawRacket ()` 方法，其功能正如其名。你必须将
    `rectMode` 设置为中心（center），这样球拍就能对齐到光标的中心。创建球拍后，下一步是让球在它上面反弹。


    ![image](img/image196.png)


    点击[此处](https://uploads.toptal.io/blog/image/125584/toptal-blog-image-1520329478351-575615f763bbbe38ee94503fb81f700d.gif)
    查看结果：


    所以，`watchRacketBounce ()` 确保球拍和球碰撞。你需要检查球和球拍是否在水平和垂直方向上对齐。初始的 if 语句检查球右侧的 X 坐标是否大于左侧，反之亦然。如果是，第二个语句将检查球和球拍之间的距离是否等于或小于球的半径。如果满足这些条件，就会调用
    `BounceBottom ()` 方法让球在球拍上反弹。


    变量 `pmouseY` 和 `pmouseX` 存储上一帧的鼠标坐标。由于鼠标移动速度非常快，如果鼠标向球移动足够快，你可能无法在帧之间检测到球拍和球之间的距离。因此，我们获取帧与帧之间鼠标坐标的差值并在检测距离时考虑到这一点。鼠标移动越快，可允许的距离越大。


    现在，当我们把 `gravity` 加入 `ballSpeedVert` 且它具有负值时，它将开始接近 0，最终变为 0 然后再次开始增加。这会让球上升，然后上升变慢，停止，然后开始下降。


    ## 水平移动并控制球


    我们将为球添加水平移动并使其变得可控制。


    ![image](img/image176.png)


    查看[这里](https://uploads.toptal.io/blog/image/125585/toptal-blog-image-1520329453372-234159ab9f)。


    思路与垂直移动相同。我们创建了 `ballSpeedHorizon` 速度变量。然后我们创建了水平速度变量 ballSpeedHorizon，并实现了一个将水平速度应用到球上移除空气摩擦的方法。此外，我们在
    `keepInScreen ()` 中增加了两个 if 语句，用于监控球是否撞击左右边缘。最后，我们确保从左到右的反弹由 `makeBounceRight
    ()` 和 `makeBounceLeft ()` 处理。


    ## 创建墙


    我们将添加向左移动的墙。


    ![image](img/image045.png)


    ![image](img/image192.png)


    [这是结果](https://uploads.toptal.io/blog/image/125587/toptal-blog-image-1520330276517-1ff10f2d45712eb1d582e1fd6b308115.gif)。


    你首先注意的是 `ArrayList`，它是列表的一种实现，行为类似于数组。但它是可缩放的，并且包含了非常棒的方法，如 `list.remove (index)`、`list.add
    (index)` 和 `list.get (index)`。我们将墙数据以整数数组的形式存储在 arraylist 中。存储在数组中的数据是为了用于两面墙之间的间隙。我们的数组具有这些值：


    ![image](img/image022.png)


    '
- fmt: '

    The actual walls are drawn according to the values of the gap wall. You need to
    note that these can be handled cleaner and better with classes. This is however
    how we’ll handle it: we’ve got two base methods for management of the walls: `wallHandler`
    and `wallHandler()`. The latter adds to the `arraylist` new walls per `wallInterval`
    millisecond. We’ve got a global variable `lastAddTime` that stores the last wall
    you added. In case the present millisecond `millis()` deducting the last millisecond
    added–`lastAddTime`– is bigger than the interval value–`wallInterval`– this essentially
    means that you have to add a new wall. Random gap variables then get generated
    according to the global variables defined at the top. A mew wall is then added
    into the `arraylist` and `lastAddTime` set to the current `millis()`. The `wallHandler()`
    loops through the current walls that’s in the `arraylist` and calls `wallRemover(i)`,
    `wallDrawer(i)` and `wallMover(i)` for each item by the index value of the arraylist.


    The `wallDrawer` draws the walls according to the gap wall data. The `wallDrawer`
    will usually grab the wall data array from `arraylist` before it can call the
    method `rect()` for drawing the walls to where they need to be. The `wallMover`
    takes the element right from the `arraylist` and alters its X location according
    to the `wallSpeed` global variable. The `wallRemover` gets the walls off the `arraylist`,
    which are out of the screen. When a wall is thus removed from `arraylist`, this
    eliminates it from being drawn in all the following loops.


    We now have to detect any collisions between the walls and the balls:


    ![image](d2d_images/image112.png)watc


    The method `hWallCollision()` is called for every wall on all the loops. You get
    the coordinates of the gap wall and calculate the actual walls’ coordinates (from
    top to bottom) and then check whether the ball’s coordinates are colliding with
    the walls.


    ## Health and score


    I don’t know about you but I think we should have a health bar on top. When the
    ball touches the walls, it should lose health. This logic however doesn’t make
    sense to have the ball bouncing back from the walls. When the health is 0, the
    game should end.


    ![image](d2d_images/image161.png)


    The simple run is right [here](https://uploads.toptal.io/blog/image/125588/toptal-blog-image-1520330296635-cc0246c60c78d04e1de1bf597ca0124f.gif).


    We made `health`, a global variable and then the method `drawHealthBar()` to draw
    two rectangles over the ball. The first one is the base health bar and the other
    one is the active one that displays the current health. The width of the second
    one is pretty dynamic and the formula `healthBarWidth*(health/maxHealth)` calculates
    it, the current health’s ratio with respect to the health bar’s width. The fill
    colors are now set based on the value of the health. Now for the scores:


    ![image](d2d_images/image068.png)


    ![image](d2d_images/image107.png)


    We need to score whenever our ball passes through the wall. We also need to create
    a maximum of 1 score per wall. This means that in case the ball passes a wall
    and then goes back to pass it again, there shouldn’t be another added score. To
    do that, we included another variable to the gap wall array inside the `arraylist`.
    The new variable will store 0 in case the ball did not pass that wall yet and
    a 1 in case it did. Then, we made a modification to the method `watchWallCollision()`.
    We included a condition which fires method `score()` and marks the wall as having
    been passed in the instance the ball passes a wall which it hadn’t passed earlier.


    The last thing we now have to do is have `click to restart` implemented over the
    screen. We have to have all variables we used to their first value, and then restart
    the game:


    ![image](d2d_images/image164.png)


    We’ll [now add a few colors](https://uploads.toptal.io/blog/image/125589/toptal-blog-image-1520330324780-fc506d34607110fd1c14f57150cac7b8.gif).


    Success! We now have our very own flappy pong.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Conclusion


    ![image](d2d_images/chapter_title_below.png)


    We have come to the end of the book. Thank you for reading and congratulations
    for reading until the end.


    I truly hope you now have enough information about Java that you can use as a
    stepping stone for more learning.


    Thank you and good luck!

    '
