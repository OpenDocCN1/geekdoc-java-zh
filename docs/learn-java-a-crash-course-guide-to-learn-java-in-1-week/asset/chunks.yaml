    What if the base class and the derive class both define a method or variable that
    has a similar name? What happens? You should not worry in this case, as you can
    still be able to access the two. Nonetheless, you need to make your intent clear
    to Java, by prefixing the method or variable with the ‘super’ and ‘this’ keywords.
    The keyword ‘this’ refers to the instance which it is used in. The keywords ‘this’
    refers to the instance which it is used in. The keyword ‘super’ denotes the parent
    class instance:


    ![image](d2d_images/image127.png)


    Many developers use the keywords ‘super’ and ‘this’ keywords to state the variable
    or method that they are referring to explicitly. Nonetheless, using them with
    all the members can make your code appear cluttered.


