    We discussed the concept of inheritance, which is undeniably a powerful mechanism
    when it comes to reusing code, improving the general organization of object oriented
    system and minimizing data redundancy. Inheritance is ideal when the classes are
    related to each other whereby the child class is essentially a parent class. For
    instance, a ‘Car’ is a ‘vehicle’ and as such, the class `car` contains all the
    properties or features of the `vehicle` class apart from its very own features.
    Nonetheless, you cannot always be having is a relationship in between object that
    are of different classes. Let’s say with an example that ‘a car isn’t some kind
    of an engine’. You have an alternative referred to as composition to represent
    such a relationship. It is applied when the classes are related to each other
    in which the parent class is contained in the child class.


    Composition basically makes a class reuse the functionality by making a reference
    to the class object that it wants to use- which is nothing like inheritance where
    a sub class extends the super class’ functionality. For instance, a door has a
    button, a zoo has a lion, a car has an engine.


    Composition is a special case of aggregation-this means that a restricted aggregation
    is known as composition. When an object has the other one (object) and the object
    that is contained does not exist without the other object, we can call that composition.


    ## An example using a program


    We’ll consider a program that shows the concept of composition below. Follow the
    steps as indicated:


    ### Step #1


    We begin by creating a class `Bike` which you can declare and define the data
    members and methods as follows:


    ![image](d2d_images/image140.png)


    ### Step #2


    Now create a class called `Honda` that extends the `Bike` class above. In this
    case, `Honda` class uses the `HondaEngine` class, object `start()` method via
    composition. You can now say that class `Honda` has-a `hondaEngine`:


    ![image](d2d_images/image167.png)


    ### Step # 3


    Next, you have to create a class `HondaEngine` through which we’ll use the class
    object in the `Honda` class above:


    ![image](d2d_images/image128.png)


    ### Step #4


    Now we have to build a class `CompositionDemo` whereby we make a `Honda` class
    object and initialize it as follows:


    ![image](d2d_images/image199.png)


    The output is as follows:


    ![image](d2d_images/image207.png)


    ## So what is the importance of composition?


    You can be able to control other objects’ visibility to client classes in composition
    and only reuse what you need.


    Composition lets you create back-end class when it is required.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)![image](d2d_images/chapter_title_below.png)


    ## How Does Composition And Inheritance Compare?


    My assumption is that you know how inheritance as well as composition compare,
    and want to know which one is the best to choose.


    It is easier to change the back-end class’ (or composition’s) interface than a
    superclass (or inheritance). As illustrated in the previous example, changing
    the interface of a back-end class makes a change necessary to the front-end class
    interface provided that front-end interface stays the same. Conversely, changing
    the interface of a superclass can’t just ripple down the hierarchy of inheritance
    to subclasses, but could as well ripple out to code, which only uses the interface
    of the subclass.


    You’ll also find it simpler to change the interface of the front-end composition/class
    compared to an inheritance or subclass. The same way superclasses are fragile,
    they can also be rigid. You cannot just change the interface of subclass without
    ensuring the new interface of the subclass is compatible with its super type.
    For instance, you cannot add a method that has the same signature to a subclass
    and yet it (the method) has a different return type as a method that is inherited
    from a superclass. On the other hand, composition lets you change the front-end-class’
    interface without affecting the back-end classes.


    Composition lets you slow down the making of back-end objects unless and until
    they are required, and also altering the back-end objects throughout the front-end
    object’s lifetime dynamically. Inheritance allows you to get the superclass’ image
    in the object image of your subclass once the subclass is built, and it stays
    part of the subclass object throughout the subclass’ lifetime.


    You’d find it simpler to add a new subclass or inheritance that you’d find it
    to add new front-end classes or composition simply because inheritance has polymorphism.
    If you’ve got some code that depends on the interface of a superclass, the code
    can operate with a new subclass without changing. When it comes to composition,
    that is not true unless you are using composition with interfaces. When used together,
    composition and interfaces make very good design tools.


    The explicit delegation or method-invocation forwarding composition approach will
    have a good performance cost often compared to the single invocation (in inheritance)
    of a superclass method implementation that has been inherited. Often here means
    that the performance entirely depends on many factors one which includes how the
    Java virtual machine optimizes the program in the process of executing it.


    With both inheritance and composition, altering the implementation of any class
    (and not the interface) is simple. The implementation change’s ripple effect stay
    within the same class.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ## Selecting Between Inheritance And Composition


    How do the comparisons between inheritance and composition assist in your design?
    The following are a few guidelines reflecting how I typically choose between inheritance
    and composition.


    ### Ensure the inheritance models the relationship ‘is-a’


    The main guiding philosophy is that you should only use inheritance when a subclass
    is a super class. For instance, an orange likely is-a fruit, thus, I would most
    likely go with inheritance.


    A good question you need to ask yourself when you think you have is-a relationship
    is definitely whether the ‘is-a’ relationship is constant throughout the application’s
    lifetime and, perhaps when lucky, the code’s lifecycle. For instance, you could
    think that `employee` is a `person` when essentially, the term `employee` denotes
    a role a `person` plays only during a given period of time. What if the person
    is fired? What if he is a `supervisor` as well as an `employee`? When dealing
    with impermanent is-a relationships like these, you should consider that they
    have to be modelled with composition.


    ### Do not just use inheritance to get code reuse


    If you want to reuse code and that’s all, and also there is no ‘is-a’ that you
    can see, you can use composition.


    ### Do not use inheritance if all you want is to get at polymorphism


    When polymorphism is all you want, and there isn’t any natural ‘is-a’ relationship,
    you just use composition with interfaces.


    # A Simple Game With Java


    The following guide will show you how you can make your own game in a simple step-by-step
    manner.

