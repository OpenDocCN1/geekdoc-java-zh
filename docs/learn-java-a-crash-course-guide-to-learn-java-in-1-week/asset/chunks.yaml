    Nonetheless, the most important factor it offers- according to me, is speed (days
    of sitting around and waiting for stuff to compile or load are long gone). An
    good IDE such as Eclipse is is extremely fast, doesn’t suck up memory and takes
    short time to load, and doesn’t take lots of time to synchronize changes. A good
    programming expert would also mention other features you get to enjoy such as
    ‘integration with code repositories’ (see glossary) and checking of errors- such
    as static code analysis and highlighting unused references.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)![image](d2d_images/chapter_title_below.png)


    ## Steps Of Installing Eclipse For Java On Windows


    ### Download Eclipse


    Go to [this link](https://www.eclipse.org/downloads/) and download the latest
    version:


    ![image](d2d_images/image094.png)


    Click ‘download packages’ under ‘get eclipse photon’. As a beginner, you should
    select the fourth entry ‘eclipse IDE for Java Developers’ (32-bit or 64-bit).


    ![image](d2d_images/image093.png)


    Click download.


    The next step entails unzipping the downloaded file to install it. Unzip the file
    into a designated directory (for instance, `c:\javaproject`).


    You don’t need to run any installer. What’s more, you can just delete the whole
    eclipse directory when you don’t need it anymore (without having to run the ‘un-installer’).
    Feel free to rename or move the directory. Also, note that you can unzip (install)
    more than one copy in the same machine.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)![image](d2d_images/chapter_title_below.png)


    ## Installing Eclipse on Mac OS X


    Repeat the same process of downloading and installing Eclipse for windows explained
    above using [this link](http://www.eclipse.org/downloads/). Just ensure to select
    Mac OS X (cocoa). When you select ‘eclipse IDE for Java Developers’, you’ll get
    a DMG file. Double click this downloaded file (DMG) and follow the instructions
    given thereafter to install the program. The program will be installed in the
    location: `/applications/eclipse`.


    Note that you may alternatively download a TAR ball (`.tar.gz`); double click
    to be able to expand into a folder known as ‘eclipse’ and then drag this expanded
    folder into the ‘applications’ folder.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)![image](d2d_images/chapter_title_below.png)


    ## Installing Eclipse on Ubuntu Linux


    Install Eclipse for java by downloading from [this page](http://www.eclipse.org/downloads/).
    As usual, download the ‘packages’ and for platform, select ‘Linux’, then ‘eclipse
    IDE for Java developers’ for Java SE program development. You will get a .tar
    ball in the downloads folder and the installation will be under `/usr/local`.


    ![image](d2d_images/image173.png)


    To run Eclipse, just open the folder `/usr/local/eclipse` and then click on the
    icon ‘Eclipse’; or just start a terminal and enter `Eclipse`.


    ### Lock Eclipse on the launcher


    Just start the program and right click the Eclipse icon and then click lock to
    launcher. If you are using an older version (and thus the above is not working),
    just create a file `/usr/share/applications/eclipse.desktop` with the contents
    below:


    ![image](d2d_images/image084.png)


    You can now write your first Java program or project in Eclipse


    Launch Eclipse (run `eclipse.exe`) from the Eclipse installed directory and then
    select an appropriate directory for your workspace- i.e. where you would want
    to save your files (such as `c:\javaproject\eclipse` for windows).


    If the screen named ‘welcome’ pops up, click the button labelled ‘cross’ next
    to the ‘welcome’ title.


    For all Java applications, you have to create a project to have all the classes
    (discussed in a bit), source files and important resources.


    Do the following to create the project:


    *   Select ‘file’ menu then ‘new’, then ‘java project’ (or ‘file’ then ‘new’ then
    ‘project’ then ‘java project.’)

    *   The dialog named ‘new java project’ will pop up.

    *   Enter `firstproject` in the ‘project name’

    *   Check the ‘user default location’

    *   Select ‘use default JRE’ in JRE.

    *   Check the ‘use project folder as the root for sources and class files’ in
    the ‘project layout’ and then push the button labeled ‘finish’.


    Before we continue (write our first project), let’s go over some of the basic
    concepts of Java.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)![image](d2d_images/chapter_title_below.png)


    ## Basic Concepts In Java


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    # Java Tokens


    ![image](d2d_images/chapter_title_below.png)


    Tokens are basically the tiniest logical components of Java. The first step of
    the compiler is to separate the whole program into smaller bits known as tokens.
    You can think of them as the building blocks of a program. Let’s take a look at
    the types of:


    *   Keywords

    *   Operators

    *   Literals

    *   Separators

    *   Comments

    *   Literals


    Let’s have a brief description of each one so you get a better understanding.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)


    ## Keywords


    Keywords are special words or what are known as ‘reserved’ words in Java as they
    have a special meaning. We have a list of 50 keywords, which are highlighted below:


    ![image](d2d_images/image223.png)


    | ![image](d2d_images/chapter_title_above.png) |


    | Identifiers


    | ![image](d2d_images/chapter_title_below.png) |


    ## Identifiers


    Identifiers are those names programmers use in program to any method, class, variable,
    packages, objects, labels or interfaces in Java programs (you’ll learn more on
    the meaning of these terms in due course).


    We have rules of naming identifiers, which include the following


    *   You cannot have any special symbols in Java identifiers apart from the dollar
    sign `$` and the underscore `_`

    *   Identifiers need to begin from digits

    *   The keywords are reserved already and contain special meaning – so they can’t
    be used as identifiers.

    *   The reserved literals are also allowed as identifiers; for instance- `null`,
    `false` and `true`

    *   You cannot use one name for multiple identifiers. Identifiers also have to
    be case-sensitive thus the `Mf` and `mf` variables are very different.


    Some good examples of valid identifiers in this case include the following:


    ![image](d2d_images/image132.png)


    Invalid identifiers would include something like:


    ![image](d2d_images/image139.png)


    NOTE: reserved literals and keywords in Java are those words you cannot use as
    variables or function names.

