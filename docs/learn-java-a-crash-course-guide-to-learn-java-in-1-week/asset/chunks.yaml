    ## Behavior Parameters


    Another thing you have to look at is concerned with passing information to the
    class when you execute behaviors. For instance, when you want to accelerate to
    80 kilometers per hour, you’d have to execute the `accelerate` behavior of the
    `vehicle` class successfully 80 times. That is definitely unruly for a real system.
    In place of that, you should try instructing the `vehicle` how much to accelerate
    by. For instance, when you execute `accelerate by 30` and then `accelerate by
    15` gives you a speed of 45 kilometers per hour. To do this, you need to declare
    that your `accelerate` behavior can actually a value, which closely represents
    the increased speed as one of the parameters. For this, you’ll border the parameter
    with a parenthesis before associating a type with the same notation as that for
    your class’ state. As you would note, the parameter needs to be named, otherwise
    you would not be able to use or access the parameter inside your definition of
    the behavior. You also need to note that when a behavior fails to have any parameters,
    you’ll use an empty set of parameters. For instance, if the `drive` behavior doesn’t
    take any parameters, its declaration will be `drive()`. As a result, you’ll get
    the following class for your `vehicle`:


    ![image](d2d_images/image177.png)


    If right now you instruct the `vehicle` to accelerate by 30, you’d be able to
    increase the current speed of the vehicle by 30. Now that the value (30) is passed
    to your behavior at execution, it is referred to as an argument. Even though the
    argument and the terms parameter are closely related, you’ll get a vital distinction:
    a parameter is a value referenced in the behavior definition. The argument on
    the other hand is the actual value passed to the behavior upon execution.


    I deliberately selected the execution notation because it maps the arguments that
    are supplied to the declared parameters. For instance, `accelerate(30)` maps the
    value (30) to `amount` (of the `number` type) during execution. This parameters’
    notation can be extended for more than a single parameter by enumerating the multiple
    parameters in a list with comma-separation taking the form of `doSomething(number
    valueOne, Number valueTwo)`. In instances when the arguments are positionally
    mapped, this very argument notation can come in handy- for instance `doSomething(15,
    37)` maps 37 to `valueTwo`.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


