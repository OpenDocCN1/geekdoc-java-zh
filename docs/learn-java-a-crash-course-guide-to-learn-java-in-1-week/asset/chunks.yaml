    ## 原生类型


    当你用其他类声明类的状态条目时，我们最终将面临一个点，无法在不形成循环层次的情况下引用另一个类。例如，如果你尝试给 `currentSpeed` 状态分配
    `number` 类型，那么你究竟如何定义 `number` 类呢？如果你尝试用其他类来定义它，那么你又如何定义那些类呢？由于你不能允许允许这种无限递归的类型系统，你需要声明一个或多个值的存在。这种公理类型被称为原生类型（primitive
    types）。


