    ## Conditional Statements In Java


    Every day in life, we come in contact with different kinds of objects as you try
    to get things done; at the same time, we use these objects to carry out different
    tasks. The one type of objects we tend to come in contact with are digital or
    analog devices such as phones, computers, cars, self-opening doors in malls and
    offices, and televisions.


    In relation to the example above, you’ll realize that the concept of conditional
    statements in Java depicts the way we go about our daily lives. Conditional statements,
    with regards to Java programming, are all about making decisions that are directed
    towards a desired result. Each day, we make decisions, and for these decisions,
    we get particular result.


    In Java programming, we have two types of decision making statements to use when
    programming a software or device that you can run on any device like the ones
    I’ve stated above. These statements basically assist the device and the device’s
    user as to do something according to a particular state or condition.


    The `IF-STATEMENT` is the first conditional statement. You need to note that the
    `if-statement` contains three versions, which include the following:


    * `IF — STATEMENTS`

    * `ELSE — IF STATEMENTS`

    * `IF / ELSE STATEMENTS`


    Let’s see how an `IF-statement` works using the first device we mentioned.


    ![image](d2d_images/image023.png)


