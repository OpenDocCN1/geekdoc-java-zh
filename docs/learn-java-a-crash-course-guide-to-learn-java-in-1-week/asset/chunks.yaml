    # Inheritance in Java


    ![image](d2d_images/chapter_title_below.png)


    In Java, one of the principles of Object Oriented Programming is inheritance;
    inheritance lets us reuse existing code or extend a type that already exists or
    extend a type that is already existing. Put simply, Java allows a class to inherit
    another class and many interfaces, and interfaces are able to inherit other interfaces.


    In our discussion today, we’ll begin with looking at why you need inheritance
    and how it works with interfaces and classes. And then cover how the method or
    variable names and how the inherited members are affected by access modifiers,
    among other important things.


    ## Why Inheritance?


    Take a moment and imagine you are a car manufacturer offering multiple car models
    to your customers. While the different car models could provide features such
    as bulletproof windows or sunroof, they all have common features and components
    such as wheels and engine. It’s only sensible to build a basic design and extend
    it to build their specialized versions instead of trying to design the car models
    individually, from scratch. Similarly, inheritance is here to assist you create
    a class that has simple features as well as behavior, and make its dedicated versions
    by building classes that inherit the base class. Similarly, interfaces are designed
    to extend the existing interfaces. You’ll notice how multiple terms have been
    used to refer to a type which is under inheritance by another type: more specifically;


    - A base type is also known as a parent or super type

    - A derived type is known as a child or sub type, or an extended type


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)![image](d2d_images/chapter_title_below.png)


    ## Inheritance With A Class


    ### Extending a class


    A class can inherit another class and define extra members. Let’s begin by defining
    a base class known as `Car`:


    ![image](d2d_images/image131.png)


    The `ArmoredCar` class is able to inherit the `Car` class members in its declaration
    with the keyword `extends`:


    ![image](d2d_images/image021.png)


    In Java, the classes support single inheritance; the class `ArmoredCar` cannot
    extend many classes. When the keyword `extends` is not available, a class inherits
    the class `java.lang.Object` implicitly.


    | ![image](d2d_images/chapter_title_corner_decoration_left.png) |  | ![image](d2d_images/chapter_title_corner_decoration_right.png)
    |


    ![image](d2d_images/chapter_title_above.png)![image](d2d_images/chapter_title_below.png)


    ## What Is Being Inherited?


    A derived class basically inherits (from the base class) the public and protected
    members –which are not static. Additionally, the members with package and default
    access get inherited in the instance the two classes are in one package.


    A base class cannot allow its entire code to be accessed by the classes that are
    derived. A derived class static does not inherit the static and private members.


    ### Access Parent Members—From A Derived Class


    Doing this is pretty simple; you only need to use them. Take the brief example:


    ![image](d2d_images/image206.png)


    ### Members In The Base Class


    What if the base class and derived class both define a method or variable with
    the same name? What happens? You should not worry in this case, as you can still
    be able to access the two. Nonetheless, you need to make your intent clear, by
    prefixing the method or variable with `super` and `this`. The keyword `this` refers
    to the instance which is used in. The keyword `super` denotes the parent class
    instance:


    ![image](d2d_images/image127.png)


    Many developers use the keywords super and this keywords to state the variable
    or method that they are referring to. Nonetheless, using them with all the members
    can make your code appear cluttered.


    ### Hidden Base Class Static Members


    What if the derived classes as well as base class and derived classes actually
    define different static methods and variables? What happens? Is it possible to
