    ## Logical Operators


    A logical operator is used together with binary variables. They are mostly used
    in loops and conditional statements to evaluate a condition.


    Essentially, Java’s logical operators are ||, &&, !


    Consider the case that we have two Boolean variables: b1 and b2\. In this case,
    b1 && b2 will return true in the instance b1 as well as b2 are true; otherwise,
    it would definitely return false.


    On the other hand, b1 || b2 returns false in the instance b1 as well as b2 are
    false, otherwise else would definitely return true.


    !b1 would, on the other hand, return the opposite of b1, meaning that it would
    return true in the instance b1 is false and return false in case b1 is true.


