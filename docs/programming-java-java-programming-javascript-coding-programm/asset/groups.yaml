    # Introduction to Java


    Java – one of the most popular programming languages of the Internet age was conceived
    and developed in 1991 at Sun Microsystems. The evolution of any programming language
    is driven by necessity that arises due to development in the computing ecosystem
    – and java was no exception.


    Though code written in C or C++, the powerful predecessors of Java could also
    run on all devices, the effort required to compile them each time to make it work
    on specific devices was very expensive.


    Java overcame this by simply taking the text source code (.java) and compiling
    it to an intermediate byte code (.class) file, which can then be interpreted by
    any device running an interpreter - Java Virtual machine (JVM). The idea of byte
    code meant the code became architecture neutral, needs to be compiled only once
    and can be interpreted on any device which can run a JVM on it.


    Today, Java has grown into an important programming language and it has become
    almost imperative for anyone interested in programming to know at the basics of
    Java. This book has been written exactly for this purpose. I want to help anyone
    with little or no prior programming experience get an easy and effective introduction
    to java programming.'
