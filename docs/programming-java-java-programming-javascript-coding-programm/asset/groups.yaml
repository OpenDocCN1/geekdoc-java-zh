    # List of Wrapper classes


    In the Java language, there are 8 data types present and for each of them have
    their own wrapper classes.


    | Primitive data type | Wrapper class |

    |---|--|

    | byte | Byte |

    | short | Short |

    | int | Integer |

    | long | Long |

    | float | Float |

    | double | Double |

    | char | Character |

    | Boolean | Boolean |


    All the wrapper classes can be found in the java.lang package. They are placed
    so that they can be made available implicitly to the programmer whenever imported.
    To avoid inheritance, the Java designers made these wrapper classes as final.


    Importance of Wrapper classes

    We use wrapper classes for serving two purposes.


    +   - For converting simple data types into objects. This is done by giving the
    object form to a given data type.

    - For converting the strings into data types. For this type of conversion we use
    the methods like parseXXX().


    Here there is an example program showing the conversion of a datatype to an object
    and also retrieving the data type from at the same time.'
