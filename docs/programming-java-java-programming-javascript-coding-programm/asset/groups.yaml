  mdcn: "\n\n```javascript\n//-->\n</script>\n```\n\n**示例**: 在下方的示例中，有一个简单的函数程序。\n\
    \n```javascript\n<script type='text/javascript\">\n<!--\nfunction simplefunction()\n\
