    \ 简介\n\nJava —— 互联网时代最流行的编程语言之一，于1991年在太阳微型系统公司（Sun Microsystems）构思并开发。任何编程语言的演进都是由计算生态系统发展的需求驱动的——Java也不例外。\n\
    \n虽然用 C 或 C++ 编写的代码（Java 的强大前身）也可以在所有设备上运行，但为了让它们在特定设备上运行而每次都需要编译，成本是非常昂贵的。\n\n\
    Java 解决了这个问题，只需获取文本源代码 (.java) 并将其编译为中间字节码 (.class) 文件，然后该文件可以由任何运行解释器的设备——Java\
    \ 虚拟机 (JVM) 解释。字节码的想法意味着代码变得与架构中性，只需要编译一次，就可以在任何运行 JVM 的设备上进行解释。\n\n今天，Java 已经成为一种重要的编程语言，对于任何对编程感兴趣的人来说，了解\
    \ Java 基础是必不可少的。这本书正是为此目的而编写的。我想帮助任何几乎或没有之前编程经验的人轻松、有效地接触 Java 编程。\n\n# 第1章：入门\n\
    \n# 安装\n\n首先，我们需要准备好开发环境。初学者可以使用在线开发环境（https://ideone.com/）来执行小型代码段，但如果要执行的代码是一个完整的程序，则必须安装。在任何事情之前，我们需要准备好开发环境。初学者可以使用在线开发环境执行小代码片段。Java\
    \ 分为三种：\n\n- 微型版 (J2ME)\n- 标准版 (JSE)\n- 企业版 (JEE)\n\n对于个人使用，可以通过安装 java 来显示终端的版本。运行程序意味着指令\
    \ JVM 加载从源码编译的 .class 文件并从 main 方法开始执行。\n\n# 代码结构\n\n![](19cb7751e839eebf53a5a37b4de4031)\n\
    \n每个 Java 代码以 .java 结尾保存。每个 Java 程序包含一个或多个类。每个类包含一些方法定义。\n\n# 语法与关键字的含义\n\n```java\n\
    import java.io.*;\npublic class FirstProgram {\n    public static void main(String[]\
    \ args) {\n        // 这是我的第一个 Java 程序\n        System.out.println(\" Hello World!\"\
    );\n    }\n}\n```\n\n**import java.io.*;** - 关键字 \"import\" 用于包含“包”，这些包包含了可以使用的预定义函数。\n\
    \n**public class FirstProgram** - 这是类定义，关键字 \"public\" 表示该类对所有人可见，“class\" 表示一个类定义。\n\
    \n**FirstProgram** – 这是类的名称。具有 main () 函数的类名应文件名相同。\n\n类定义封装在 {} 中。\n\n**public\
    \ static void main(String[] args) :** 这是程序的主部分。由于 main () 是驱动函数，它应该始终是 \"public\"\
    。\n\n**static:** 你需要记住 main() 方法始终应该是 \"static\" 的，因为这提高了内存效率。\n\n**void:** 这是方法的返回类型。这意味着\
    \ main() 方法不会返回任何内容。\n\n**main:** 方法名称。解释器从 main 方法开始执行。\n\nmain 方法的两个用途总结如下：\n\
    \n- String[] args : 是传递给“main” 方法的参数。该方法始终接收字符串数组作为输入参数，数组名称应始终为“args”。注意数据类型大大写“S”，因为\
    \ Strings 是 Java 中的一个类，所有类名都以大写开头。\n\n要在标准输出控制台打印语句，使用 “System.out.println(\"\"\
    );”。注意所有语句必须以分号 ( 结尾。\n\n你也可以使用 System.out.print () 显示输出，区别在于 print 在它打印的每个语句结束引入一个新行。\n\
    \n我们程序中 main() 方法内的另一个语句被称为“注释”语句。这些语句不会被编译，以 “//” 开头的语句仅用于向程序员提供有关代码的更多。\n\n\
    # 使用 Java 库\n\n在处理 Java 工作时，你可以看到许多预定义的类。所有这些类都可以在 Java 程序中使用，从而避免了用户重复发明轮子的任务。但要使用这些类的任何一个，你应该对需要使用什么以及在哪里使用有一些最少知识。\n\
    \n"
