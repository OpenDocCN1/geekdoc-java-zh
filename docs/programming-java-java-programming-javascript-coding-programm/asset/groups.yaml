    \n在 JavaScript 中调用函数，应该按照如下方式编写函数的名称。\n\n```javascript\n<script type=\"text/javascript\"\
    >\n<!--\nsimplefunction();\n-->\n</script>\n```\n\n# 函数参数：\n\n在 JavaScript 中，函数也可以带有参数传递。在调用函数时，JavaScript\
    \ 可以传递不同的参数。可以通过传递的参数在函数内部进行操作。函数中使用逗号来分隔函数中的多个参数。\n\n# 示例：\n\n在接接的示例中，我们将修改 `simplefunction`\
    \ 函数。现在我们将使用两个参数。\n\n```javascript\n<script type=\"text/javascript\">\n<!--\n\
    function simplefunction(name, age)\n{\n  alert(name + \" \" + age + \" years old.\"\
    );\n}\n-->\n</script>\n```\n\n该函数可以被调用。可以如下所示进行调用。\n\n```javascript\n<script type=\"\
    text/javascript\">\n<!--\nsimplefunction('Zara', 7 );\n-->\n</script>\n```\n\n\
    # return 语句：\n\n如果用户希望该函数返回一个值，可以向 JavaScript 函数中添加一个可选的 `return` 语句。`return`\
    \ 语句始终应该是函数的最后一个语句。\n\n例如，用户可以在特定函数中传递两个不同的数字，并期望该函数在程序中返回这两个数字的乘积。\n\n# 示例：\n\
    \n```javascript\n<script type=\"javascript\">\n<!--\nfunction concatenate(first,\
    \ last)\n{\nvar full;\nfull = first + last;\nreturn full;\n}\n-->\n</script>\n\
    ```\n\n现在可以如下所示调用该函数：\n\n```javascript\n<script type=\"javascript\">\n<!--\nvar\
    \ result;\n\nresult = concatenate('Zara', 'Ali')\n\nalert( result );\n//-->\n\
    </script>\n```\n\n# JavaScript 中的事件\n\n事件（EVENT）：\n\n事件处理 JavaScript 和 HTML 之间的交互。当用户或浏览器操作页面时，就会发生这种交互。\n\
    \n一切都是事件。页面加载是一个事件。当用户通过点击选择内容时，该点击也被视为一个事件。事实上，用户执行的任何操作如关闭窗口、选择链接、按键、关闭标签页、调整窗口大小等，都是事件的示例。\n\
    \n在 JavaScript 中编写的响应通过这些事件执行，例如关闭窗口、要显示的文本、显示的警报、确认消息或任何可能发生的响应。\n\n事件是文档对象模型（DOM）Level\
    \ 3 的一部分。每个 HTML 元素都提供一组事件。这些事件会触发 JavaScript 中的代码。\n\n`onclick` 事件类型：\n\n这是一个事件，在点击时会显示所需的验证或警告等。这被广泛使用。\n\
    \n示例：下面的代码在点击 `onclick` 上的 hello 按钮时，它会触发 `events` 函数。\n\n```html\n<html>\n<head>\n\
    <script type=\"text/javascript\">\n<!--\nfunction events() {\nalert(\"Hello World\"\
    )\n}\n-->\n</script>\n</head>\n<body>\n<input type=\"button\" onclick='sayHello()\"\
    \ value=\"Say Hello\"/>\n</body>\n</html>\n```\n\n# onsubmit 事件类型：\n\n`onsubmit`\
    \ 事件是另一个重要的事件类型。在此处提交表单时会发生验证。只有当函数返回 `true` 时，文本才会被发送。\n\n示例：\n\n```html\n<html>\n\
    <head>\n<script type='text/javascript'>\n<!--\nfunction validation() {\n  // 所有验证逻辑都在这里\n\
    \n  ........\n\n  return either true or false\n}\n//-->\n</script>\n</head>\n\
    <body>\n<form method=\"POST\" action=\"t.cgi\" onsubmit=\"return validate()\"\
    >\n......\n<input type=\"submit\" value=\"Submit\" />\n</form>\n</body>\n</html>\n\
    ```\n\n# 第12 章：JavaScript 调试\n\n在编写程序时有很多机会犯错。\n脚本中的此类错误被称为 bug（缺陷）。\n\n调试是修复\
    \ bug 的过程。开发过程中，调试是正常工作的一部分。\n我们编写的代码可能存在逻辑错误或语法错误，这些是很难识别的。很多时候，当 JavaScript\
    \ 代码包含错误时，什么都不会发生。没有消息指示程序中存在错误。\n\n# 使用 JavaScript 验证器\n\n如果有人想检查代码中的 bug，必须确保它是有效代码，并通过运行一个名为验证解析器（Validating\
    \ parsers，简称验证器 Validators）的程序来检查它是否遵循语言的官方语法规则。这些验证器通常带有 JavaScript 编辑器和商业 HTML\
    \ 编辑器。\n\n访问网页后，将代码粘贴到文本区域中，点击 jslint 按钮。该程序将解析我们的 JavaScript 代码，以确保所有变量和函数定义符合正确的语法。\n\
    \n# 在程序中添加调试代码：\n\n`alert()` 或 `document.write()` 方法有助于调试你的代码。例如：\n\n```javascript\n\
    var debugging = true;\nvar whichImage = \"widget\"\nif ( debugging )\nalert(\"\
    Calls swapImage() with argument: \" + whichImage );\nvar swapStatus = swapImage(\
    \ whichImage );\nif( debugging )\nalert(\"Exits swapImage() with swapStatus=\"\
    \ + swapStatus );\n```\n\n*\n\n# 使用 JavaScript 调试器\n\n调试器（debugger）是一个允许程序员控制脚本执行的应用程序。\n\
    \n调试器可以帮助用户检查脚本的执行流。调试器逐行运行脚本，并可以在特定的断点（breakpoints）处停止。在执行完成后，程序员可以检查变量的状态。\n\
    \n# 表单验证\n\n当用户输入所需信息并点击提交按钮时，会发生表单验证。如果用户未能输入所有信息或输入了无效数据，JavaScript 允许在向  发送表单之前之前在客户端对表单数据进行验证。\n\
    \n表单验证通常由两个函数执行：\n\n- 基础验证 - 为了确保每个字段都提供了数据，首先需要检查表单。\n- 数据格式验证 —— 这是为了检查是否是否输入了正确或有效的数据。\n\
    \n# 基础表单验证：\n\n让我们看看基础表单验证。当提交事件发生时，我们调用 `validate()` 函数来验证数据。`validate()` 函数实现如下：\n\
    \n```javascript\n<script type=\"text/javascript\">\n//\n表单验证代码在这里。\nfunction validate()\
    \ {\nif( document.myForm.Name.value == \"\") {\nalert(\"请输入姓名！\");\ndocument.myForm.Name.focus();\n\
    return false;\n}\nif( document.myForm.EMail.value == \"\") {\nalert(\"请输入邮箱 ID！\"\
    );\ndocument.myForm.EMail.focus();\nreturn false;\n}\nif( document.myForm.Zip.value\
    \ == \"\" ||\n    isNaN(document.myForm.Zip.value) ||\n    document.myForm.Zip.value.length\
    \ != 5 )\n{\nalert(\"请以 ##### 格式输入邮编。\");\ndocument.myForm.Zip.focus();\nreturn\
    \ false;\n}\nif( document.myForm.Country.value == \"-1\")\n{\n    alert(\"请输入国家名称！\"\
    );\n    return false;\n}\nreturn( true );\n}\n//-->\n</script>\n```\n\n# 数据格式验证\n\
