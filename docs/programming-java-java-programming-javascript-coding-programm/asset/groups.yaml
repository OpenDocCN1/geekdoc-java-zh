- md: "\n# Chapter 13: Objects in JavaScript\n\nJavaScript- objects:\n\nObjects in\
    \ JavaScript consist of attributes. An attribute is considered a method, if it\
    \ has a function, or else an attribute is considered a property.\n\n## Object\
    \ Properties:\n\nThe properties of the object can be in any of the data types.\n\
    \nThe following syntax is used when one has to add property to an object\n\n```\n\
    objectName.objectProperty = propertyValue;\n```\n\n## Example:\n\nThe next example\
    \ showcases how to use the \"title\" property of the document object:\n\n```\n\
    var strg = document.title;\n```\n\n## Object Methods:\n\nThe functions allowing\
    \ the object to do a particular task.\n\n## Example:\n\nThe following example\
    \ shows how the write() method is used:\n\n```\ndocument.write(\"This is text\"\
    );\n```\n\n## User-Defined Objects:\n\n### The new Operator\n\nThe new operator\
    \ helps in creating instances of an object. For creating an object, the constructor\
    \ method follows the new operator.\n\nIn the below given example, Object(), Array(),\
    \ and Date() are the constructor methods, which are in-built functions of JavaScript.\n\
    \n```\nvar emp = new Object();\nvar textbooks = new Array(\"C\", \"Python\", \"\
    Java\");\nvar day = new Date(\"August 21, 1987\");\n```\n\n## The Object() Constructor:\n\
    \nAn object can be created and initialized by a constructor. Object() is a special\
    \ constructor function that helps to build an object.\n\nThe following example\
    \ shows to create an object:\n\n```html\n<html>\n<head>\n<title>objects defined\
    \ by the user </title>\n<script type=\"text/javascript\">\n var book = new Object();\
    \ // Creates the object\nbook.subject = \"Perl\", // Assign properties to the\
    \ object\nbook.author = \"Yashwanth\";\n</script>\n</head>\n<body>\n<script type=\"\
    text/javascript\">\n document.write(\"Book name is : \" + book.subject + \"<br>\"\
    );\ndocument.write(\"Book author is : \" + book.author + \"<br>\");\n</script>\n\
    </body>\n</html>\n```\n\n## JavaScript Native Objects\n\nJavaScript consists of\
    \ many in-built native objects. Their behavior is not affected by the browser\
    \ or the platform on which they run.\n\nThe following is a list of most widely\
    \ used native objects in JavaScript:\n\n- 1. Number Object\n- 2. Boolean Object\n\
    - 3. String Object\n- 4. JavaScript Math Object\n\n## The Number Object\n\nThe\
    \ number objects in JavaScript are used to represent numerical values. It can\
    \ hold both integers and floating point values.\n\nWhenever encountered with numerical\
    \ values, the web browser converts those values into the number class instances\
    \ automatically.\n\nSyntax:\n\nThe syntax for creating a number object is as follows:\n\
    \n```\nvar value = new Number(number);\n```\n\n## Number Methods\n\nThe following\
    \ are the methods that are consisted in the number object.\n\n| Method | Description\
    \ |\n| --- | --- |\n| constructor() | This method is used to return the function\
    \ that created the instance of the object. |\n| toExponential() | This methods\
    \ results in the display of a standard range number in the exponential form. |\n\
    | toLocaleString() | This method takes a number and returns a string version for\
    \ the number It is done in a format that varies with the locale settings of the\
    \ browser. |\n| toPrecision() | This method defines the number of digits to be\
    \ displayed in a given number. This includes the digits that are present on either\
    \ side of the decimal. |\n| toString() | This method helps to convert a number\
    \ into a string value. |\n| valueOf() | This method represents the value of the\
    \ number. |\n\n## The Boolean Object\n\nThe Boolean object is used to represent\
    \ a value that can be either a ‘True’ value or a ‘False’ value.\n\nSyntax:\n\n\
    A boolean object can be created using the following syntax:\n\n```\nvar bval =\
    \ new Boolean(value);\n```\n\nThe Boolean object’s initial value is false if the\
    \ value parameter holds any of the following values: empty string, null, 0, NaN,\
    \ -0, null or undefined.\n\nBoolean Methods:\n\nThe following are the methods\
    \ that are consisted in the Boolean object.\n\n| Method | Description |\n| ---\
    \ | --- |\n| toSource() | This method is used to return a string which consists\
    \ of the Boolean object’ source. An equivalent object can be created using that\
    \ string. |\n| toString() | This method is used to return a ‘true’ string or a\
    \ ‘false’ string based on the object’s value. |\n| valueOff() | This method is\
    \ used to return the Boolean object’s primitive value. |\n\n## The String Object:\n\
    \nThe string object allows the user to work with a group of characters and wraps\
    \ the string primitives of JavaScript with the helper methods.\n\nSyntax:\n\n\
    A String object can be created using the following syntax\n\n```\nvar value =\
    \ new String(string);\n```\n\nThe string parameter represents a group of properly\
    \ encoded characters.\n\nString Methods\n\nThe following are the methods that\
    \ are consisted in the String object.\n\n| Method | Description |\n| --- | ---\
    \ |\n| charAt() | This method is used to return a number, that indicates a character's\
    \ Unicode value at a given index. |\n| concat() | This method is used to combine\
    \ characters of two strings and return a newly created string. |\n| match() |\
    \ This method is used for matching a string with a regular expression. |\n| toLowerCase()\
    \ | Used to convert a string to lower case while maintaining the locale. |\n|\
    \ toUpperCase() | Used to convert a string to upper case while maintaining the\
    \ locale. |\n| toLowerCase() | Returns a string in which all uppercase letters\
    \ are converted into lowercase letters |\n| toUpperCase() | Returns a string in\
    \ which all lowercase letters are converted into uppercase letters. |\n\n## Math\
    \ Object\n\nIt allows the user to perform many common mathematical calculations.\
    \ The object methods are called by writing the object's name and then a dot followed\
    \ by the method's name. The argument(s) are written in method parenthesis.\n\n\
    Ex: document.writeln(Math.sqrt(81));\n\nFollowing some widely used functions of\
    \ Math object:\n\n| Methods | Description |\n| --- | --- |\n| abs(x) | Absolute\
    \ value of x |\n| ceil(x) | Rounds x to the smallest integer not less than x.\
    \ |\n| round(x) | Round x to closest integer. |\n| pow(x, y) | X raised to the\
    \ power of y |\n| floor(x) | Rounds x to the largest integer not greater than\
    \ x. |\n\n## Conclusion\n\nWe’ve come to the end of the book on learning the basics\
    \ of Java and JavaScript programming.\n\nI want to thank you for purchasing this\
    \ book. I hope you found this book useful and it helped you in understanding the\
    \ concepts of programming using Java and JavaScript. Being a high-level programming\
    \ language, it makes it easy to learn the basics and then start writing programs\
    \ on your own.\n\nNo language is rocket-science if studied properly. So is the\
    \ case with the two languages covered in this book. Dive in and know the basics\
    \ for these languages.\n\nThank you!\n\n## You May Enjoy My Other Books!\n\n-\
    \ [PYTHON: Programming Guide For Beginners: LEARN IN A DAY!]\n- [C++ Programming\
    \ : Programming Language For Beginners: LEARN IN A DAY!]\n- [SQL: Programming\
    \ Guide: Javascript and Coding: LEARN IN A DAY!]\n- [Programming: HTML: Programming\
    \ Guide: Computer Programming: LEARN IN A DAY!]\n"
  mdcn: "\n\n# 第 13 章：JavaScript 中的对象\n\nJavaScript - 对象：\n\nJavaScript 对象由属性组成。如果一个属性包含函数，则它被视为方法，否则该属性被视为属性值。\n\
    \n## 对象属性 (Properties)：\n\n对象的属性可以是任何数据类型。\n\n当需要向对象添加属性时，使用以下语法：\n\n```\nobjectName.objectProperty\
    \ = propertyValue;\n```\n\n## 示例：\n\n下一个示例展示了如何使用文档对象的 \"title\" 属性：\n\n```\n\
    var strg = document.title;\n```\n\n## 对象方法 (Methods)：\n\n允许对象执行特定任务的函数。\n\n##\
    \ 示例：\n\n以下示例展示了如何使用 write() 方法：\n\n```\ndocument.write(\"This is text\");\n```\n\
    \n## 用户定义对象：\n\n### new 运算符 (Operator)\n\n`new` 运算符有助于创建对象的实例。创建对象时，构造方法跟在 `new`\
    \ 运算符之后。\n\n在下面的示例中，`Object()`、`Array()` 和 `Date()` 是构造方法，它们是 JavaScript 的内置函数。\n\
    \n```\nvar emp = new Object();\nvar textbooks = new Array(\"C\", \"Python\", \"\
    Java\");\nvar day = new Date(\"August 21, 1987\");\n```\n\n## Object() 构造函数：\n\
    \n对象可以通过构造函数进行创建和初始化。`Object()` 是一个帮助构建对象的特殊构造函数。\n\n以下示例展示了如何创建一个对象：\n\n```html\n\
    <html>\n<head>\n<title>用户定义的对象</title>\n<script type=\"text/javascript\">\n var\
    \ book = new Object(); // 创建对象\nbook.subject = \"Perl\", // 为对象分配属性\nbook.author\
    \ = \"Yashwanth\";\n</script>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\n document.write(\"Book name is : \" + book.subject + \"<br>\");\ndocument.write(\"\
    Book author is : \" + book.author + \"<br>\");\n</script>\n</body>\n</html>\n\
    ```\n\n## JavaScript 原生对象\n\nJavaScript 包含许多内置的原生对象。它们的行为不受运行其对象的浏览器或平台的影响。\n\n\
    以下是 JavaScript 中最常用的原生对象列表：\n\n- 1. 数字对象 (Number Object)\n- 2. 布尔对象 (Boolean Object)\n\
    - 3. 字符串对象 (String Object)\n- 4. JavaScript 数对象 (Math Object)\n\n## 数字对象 (Number\
    \ Object)\n\nJavaScript 中的数字对象用于表示数值。它可以包含整数和浮点值。\n\n每当遇到数值时，网络浏览器会自动将这些值转换为数字类的实例。\n\
    \n语法：\n\n创建数字对象的语法如下：\n\n```\nvar value = new Number(number);\n```\n\n## 数字方法\
    \ (Number Methods)\n\n以下是数字对象中包含的方法。\n\n| 方法 | 描述 |\n| --- | --- |\n| constructor()\
    \ | 此方法用于返回创建对象实例的函数。 |\n| toExponential() | 此方法的结果是以指数形式显示标准范围的数字。 |\n| toLocaleString()\
    \ | 此方法接收一个数字并返回数字的字符串版本。其格式随浏览器的本地设置变化。 |\n| toPrecision() | 此方法定义在给定数字中显示的位数。这包括小数点两侧的数字。\
    \ |\n| toString() | 此方法帮助将数字转换为字符串值。 |\n| valueOf() | 此方法表示数字的值。 |\n\n## 布尔对象\
    \ (Boolean Object)\n\n布尔对象用于表示可以是“真”（True）或“假”（False）值的值。\n\n语法：\n\n可以使用以下语法创建布尔对象：\n\
    \n```\nvar bval = new Boolean(value);\n```\n\n如果 `value` 参数包含以下任何一个值：空字符串、null、0、NaN、-0、null\
    \ 或 undefined，则布尔对象的初始值为 `false`。\n\n布尔方法 (Boolean Methods)：\n\n以下是布尔对象中包含的方法。\n\
    \n| 方法 | 描述 |\n| --- | --- |\n| toSource() | 此方法用于返回一个由布尔对象源码组成的字符串。可以使用该字符串创建一个等效对象。\
    \ |\n| toString() | 此方法根据对象的值返回 'true' 字符串或 'false' 字符串。 |\n| valueOff() | 此方法用于返回布尔对象的原始值。\
    \ |\n\n## 字符串对象 (String Object)：\n\n字符串对象允许用户处理一组字符，并用辅助方法封装 JavaScript 的字符串原始类型。\n\
    \n语法：\n\n可以使用以下语法创建字符串对象：\n\n```\nvar value = new String(string);\n```\n\n`string`\
    \ 参数表示一组编码适当的字符。\n\n字符串方法 (String Methods)\n\n以下是字符串对象中包含的方法。\n\n| 方法 | 描述 |\n\
    | --- | --- |\n| charAt() | 此方法返回一个数字，表示指定索引处字符的 Unicode 值。 |\n| concat() | 此方法用于合并两个字符串的字符并返回新创建的字符串。\
    \ |\n| match() | 此方法用于用正则表达式匹配字符串。 |\n| toLowerCase() | 用于在保持本地设置的同时将字符串转换为小写。\
    \ |\n| toUpperCase() | 用于在保持本地设置的同时将字符串转换为大写。 |\n| toLowerCase() | 返回一个字符串，其中所有大写字母都转换为小写字母。\
    \ |\n| toUpperCase() | 返回一个字符串，其中所有小写字母都转换为大写字母。 |\n\n## Math 对象\n\n它允许用户执行许多数学计算。通过编写对象名称后跟一个点，然后是方法名称来调用方法。参数写在方法的括号中。\n\
    \n示例：document.writeln(Math.sqrt(81));\n\n以下是 Math 对象的常用函数：\n\n| 方法 | 说明 |\n| ---\
    \ | --- |\n| abs(x) | x 的绝对值 |\n| ceil(x) | 将 x 向上舍入为不小于 x 的最小整数。 |\n| round(x)\
    \ | 将 x 四舍五入到最近整数。 |\n| pow(x, y) | x 的 y 次 |\n| floor(x) | 将 x 向下舍入为不大于 x 的最大整数。\
    \ |\n\n## 结语\n\n我们学习 Java 和 JavaScript 编程基础的书已经到了最后。\n\n我要感谢你购买这本书。我希望这本书对你有所帮助，并帮助你理解使用\
    \ Java 和 JavaScript 的编程概念。作为一种高级编程语言，它让学习基础并开始自己编写程序变得简单。\n\n只要学习得当，没有任何语言是火箭科学。本书涵盖的两种语言也是如此。深入学习并掌握这些语言的基础知识。\n\
    \n谢谢！\n\n## 你可能喜欢我的其他书籍！\n\n- [Python：初学者编程指南：一天内掌握!]\n- [C++ 编程：初学者语言：一天内掌握!]\n\
    - [SQL：编程指南：JavaScript 与编码：一天内掌握!]\n- [编程：HTML：编程指南：计算机编程：一天内掌握!]\n\n"
