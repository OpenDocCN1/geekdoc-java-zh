    # Chapter 12: Debugging in JavaScript


    There are many chances of making a mistake while writing a program.

    Such mistakes in a script are referred as bugs.


    Debugging is a process of fixing bugs. In the development process debugging is
    a normal part.

    The code we write might have logical errors or syntax errors, which are difficult
    to identify. Many times, nothing will happen when JavaScript code contains errors.
    No messages will indicate that there’s an error in the program.'
