    # Garbage collection in Java


    Garbage, in Java can be defined as the unreferenced objects in Java. And the process
    of clearing garbage for reclaiming the unused runtime memory is called garbage
    collection. In simple words garbage collection means to destroy the objects that
    are on used. Unlike C and C++, garbage collection is an automatic process in Java.
    This is one of the reasons why Java provides the user with a better and efficient
    memory management.


    # Advantages of garbage collection:


    +   - Garbage collection makes the memory efficient by removing all the objects
    that are not referred. These objects use of heap memory and garbage collection
    clears this memory.

    - There is no need for the user to perform garbage collection manually as the
    process of garbage collection is automatic in Java. So we don''t have to make
    extra efforts for managing memory. The Java virtual machine takes care of clearing
    this memory.


