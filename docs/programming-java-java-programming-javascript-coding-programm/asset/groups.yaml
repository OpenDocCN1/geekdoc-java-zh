    to find it. These are called as the Java APIs. The library is nothing but a huge
    pile of predefined classes that can be used anywhere within the program. They
    contain predefined code and all the user needs to know is how to use it. These
    libraries believe the user by typing long lines of code. This is also called as
    the Java standard code library. Within the Java platform, the Java standard library
    serves three main purposes. They are


    - Just like other library is the Java libraries facilitate the programmer with
    a set of useful facilities. These facilities include regular expression processing,
    container classes etc.


    - The standard code library provides the user with abstract interfaces with which
    he can execute tasks independently. With this user need not write the complete
    code for complex processes like file access and network access.


    - There are a few underlying platforms that do not support all of the Java applications.
    In such cases you can use the Java library to emulate those features or you can
    use it to provide a way by which you check for specific features presence.


    ## Implementation and configuration of the Java standard code library.


    Most of the code in the standard library is written in Java. The code, which is
    needed for the direct access of the operating system or the hardware are exceptions.
    The Java native interface wrappers are used in such cases for accessing the APIs
    of the operating system. Almost all of the Java code are stored in a single archive
    called as the "rt.jar". This file is distributed by the JDK and the JRE distributions.
    The Java class library can be found in the bootstrap class path.


    ## Main features of the Java class Library.


    We use classes to access the Java class library features. These come under packages.
    Some of the main features of the Java class library are given below.


    - java.lang has all the fundamental interfaces and classes. They are closely tied
    to the runtime system and the language.


    - There is a special package for mathematical operations which includes mathematical
    expressions, evaluations and arbitrary precision decimal numbers. They are all
    present in the java.math.library.


    - Utilities and collections: Java provides the user with its built-in Utility
    classes and data structures. These utility classes and data structures can be
    used for data compression, blogging, concurrency and regular expressions.

    - 2D graphics and graphical user interface: The users can use the AWT package
    which provides the graphical user interface operations. This package binds to
    the native system. You can use this for designing platform independent toolkits
    and pluggable feel and look. This package can also be used for dealing text components
    that are editable and non-editable.

    - Sound: this package provides the user with classes and interfaces that can be
    used for writing, reading, synthesising and sequencing of sound data.

    - Text: the java.text interface is used for dealing with text, numbers, messages
    and dates.

    - Databases: user can access the database (sql) using the java.SQL library.

    - The Java.Security provides security along with encryption services. There are
    encryption services are present in the javax.crypto library.

    - Java also enables you to access scripting engines. You can use any conforming
    scripting language using the javax.script package.

    - Applets: the Java.applet package allows to download applications using the network
    and allows you to run them in a guarded sandbox.


    ## Chapter 2: Object Oriented Programming


    Java has its syntaxes similar to C while programming philosophy from C++ - that
    is, java is an object-oriented language.


    In the first example that we saw, we had a class declaration and said that the
