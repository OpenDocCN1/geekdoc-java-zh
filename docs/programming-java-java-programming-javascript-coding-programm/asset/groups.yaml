    # Events in JavaScript


    EVENT:


    Events handle the interactions between JavaScript and HTML. This is done when
    a page is manipulated by the user or a browser.


    Everything is an event. The loading of the page is an event. When the user selects
    something by clicking, that click is considered an event too. Infact any action
    done by the user like closing a window, selecting a link, pressing a key, closing
    a tab, resizing a window, etc. are all examples of events.


    The responses are coded in JavaScript are executed using these events like closing
    windows, text to be displayed, alerts displayed, confirmation messages or any
    type of response that is possible to happen.


    The events are part of the Document Object Model (DOM) Level3. A set of events
    are provided to every HTML element. Those events trigger the code in JavaScript.


    The onclick event type:


    This is an event, when clicked, displays desired validation or a warning etc.
    This very widely used.


