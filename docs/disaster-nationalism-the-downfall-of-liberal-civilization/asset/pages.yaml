  md: 'Nor is it only in union organising such that radical needs may be formed. Anyone
    who has participated in a social movement of any depth and duration will have
    experienced adversity, defeats, betrayals and sacrifices and yet still be able
    to say, as a former communist organiser Tavian Gornick: ‘I sacrificed nothing.
    I was doing what I wanted to be doing. They were great years, the best of my life,
    they gave me meaning and focus, and knowing that like this is ever come my way
    again.²25 It is in historical movement that consciousness is raised and democratic
    life is built.


    For all they are adroit at gaming attention and exploiting the media’s preoccupations,
    on few of their agitating issues are disaster nationalists cutting with the grain
    of majority opinion. They appear larger than they are thanks to the long shadow
    cast by the glare of media attention. They depend substantially on the paralysis
    or tacit complicity of their opponents. They thrive on what Mark Fisher referred
    to as ‘consciousness deflation’ of late capitalism, wherein the constant message
    of the system is ‘any positive state, any hope, is a dangerous illusion’. Or,
    to quote British home Suella Braverman in polemic against liberals and the left,
    hopes among to ‘luxury beliefs’. The far right prospers, as do aficionados of
    the ‘cultural Marxism’ conspiracy theory like deflationary politics. They thrive
    on the internalised defeat and political timidity born of that Braverman. They
    succeed insofar as such defeat is institutionalised in the expressions of the
    electoral left, as it is in today’s centre-left parties which anxiously tail the
    right on most major social questions.²⁶


    To defeat and marginalise the new far right, it is necessary first to decisively
    go of the resignation that has characterised the left and the labour movement
    for three decades. There are, in this direction, encouraging straws in the wind:
    a resurgence of a radical left in electoral terms, after all these years and militancy
    in the labour movement. These trends, representing significant cracks in a cold
    and oppressive consensus, show that disastrous need not be the only ones to benefit
    from the crisis of liberalism.


