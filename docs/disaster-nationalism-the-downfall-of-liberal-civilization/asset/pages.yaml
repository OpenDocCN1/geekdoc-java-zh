    to which the ‘extremes’ are closer to one another than liberalism, is trite. But
    it is obvious that the basic passions which drive the left can always, under pressure
    of sufficient despair and decay, in the atmospheric pall of defeat, be perverted
    and inverted into their fascist opposite.


    Disaster nationalism is not yet fascist. But at its past zenith, it thundered
    along fixed rails towards total war, towards ecological cataclysm and human annihilation
    and towards the installation of that ‘other kingdom’ with its ‘own peculiar fatality’
    that Buchenwald survivor David Rousset called the ‘univers concentrationnaire’²⁹'
