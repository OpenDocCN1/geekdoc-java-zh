    Nor does disaster nationalism make any claim to revolutionary anti-capitalism,
    as fascism did before taking power. To the contrary, it suggests that the problems
    of capitalist development – in rising middle-income countries like the Philippines,
    India or Brazil, as much as in declining powers like the United States – can be
    overcome by dispensing with human rights laws, climate controls, parliamentary
    bartering and enfeebling international agreements. Its leaders, from Trump to
    Modi, frequently represent themselves as hardheaded, macho corporates capable
    of knocking heads together and ‘getting things done’. Muscular capitalism is their
    weak utopian prospectus.


    This new far right may be ‘post-fascist’ as Enzo Traverso argues, or it may represent
    a spectral imitation of fascism as Samir Gandhese suggests. I think disaster nationalist
    leaders are pathfinders for a new type of fascism, because in a manner of speaking
    we are always pre-fascist as long as the conditions for fascism have not been
    abolished. But whatever emerges will not be cosplay of the 1920s and 1930s. Apart
    from anything else, the fascist experience did not begin and end with the interwar
    crisis. According to Rick Saul, the distinctive right-model of politics, combining
    paramilitarism and charismatic leadership, can be traced to 1848 and the backlash
    against the revolutions that swept Europe in that year. The popularisation of
    irrationalist, anti-democratic nationalism can likewise be traced to the lower
    half of the nineteenth century. Arthur Rosenberg, writing shortly after Hitler
    took power, observed that before fascism became a party-state it had to be a ‘mass
    movement’ rooted in the feelings of millions. Before it was a mass movement, millions
    had to be infected with völkisch, racial-nationalist ideas. If interwar fascism
    is to be the historical benchmark against which we are measuring the new nationalism,
    then it would be appropriate to begin where fascism begins. It begins, in the
    words of philosophers Gilles Deleuze and Félix Guattari, as a ‘molecular’'
