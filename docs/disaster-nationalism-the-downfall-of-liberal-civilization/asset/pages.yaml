  md: 'These would-be putsch are for the most part politically inexperienced volunteers
    mobilised online. The organised core of those who stormed the US capitol building
    were heavily armed ex-military and ex-police officers who were inured to the ‘moralizing
    violence’ that Michael Mann describes in the formation of classical fascism, and
    who also therefore displayed some tactical intelligence. However, most participants
    were new activists disproportionately drawn from the downwardly mobile business
    and professional classes.6 Like far-right voters in Brazil and the United Kingdom,
    it was not deprivation but a trajectory of decline that fuelled their radicalisation
    to the right. They had done well out of the boom years, only to be hurled into
    debt and bankruptcy. They were at risk of being relegated to the status of ordinary,
    struggling humanity.


    Organised by online networks, the ersatz insurrectionists in the United States,
    Brazil and Germany were no intellectually or logistically prepared for the coup
    d’état for which they yielded. Their actions resembled nothing so much as armed
    versions of the online shitstorm which in no way mitigated their seriousness.
    The ‘red-pilled’ and red-pill curious turned out drives on 6 January 2021 hoping
    to materialise their fantasy of a ‘Great Awakening’, a ‘storm’, or a ‘day of the
    rope’. In a snap poll taken after the ‘insurrection’, before the ideological deflections
    blaming the event on ‘Antifa’ took root, some 45 per cent of Republican voters
    said they supported the action.7 To linger on the garish idiocy of these ideologies
    and the fusion of media infantilism and commercial cynicism that helps them circulate
    would be to succumb to the compensation of feeling superior. It would miss their
    explosive psychological power, and their potential to bring about a far more dangerous
    cataclysm. Graves have been filled with those who ‘knew better’.


    # II.


    If you think any of this woniness is going to deal with this dark psychic force
    of collectivized hatred that is bringing up in the country, then I’m afraid Democrats
    are going to see some very dark days.


    > – Marianne Williamson8'
