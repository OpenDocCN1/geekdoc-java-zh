- img_proc: true
  md: 'uprising, with microfascisms fizzing away in masses of people. We are, today,
    in the early days of a new fascism.19


    The appropriate model for analysing the current phase of nationalist politics
    is not, therefore, the ‘strongman’, the military dictatorship or the party-state.
    It is the contagious outbreak: the ‘brown plague’, as Daniel Guerin called it.
    (It was partly from Guerin’s observations of the nature of fascism in Germany
    that Deleuze and Guattari derived their concept of microfascism.) In today’s times,
    the diffusion of lone-wolf murders and mass shootings, of DIY vigilantes, networked
    militias, conspiracist witchfinders and proponents can be called a social contagion.


    An innovative theory of social contagion was developed towards the end of the
    nineteenth century by the French sociologist Gabriel Tarde. The ‘transmission
    of movement from one node to another’, he wrote, took place first in the microrelations
    below the radar of representation. It was at that point neither conscious nor
    cognitive. A fashion trend, or a microism, might begin with an involuntary, happenstance
    process of encounter between two nodes in a network, sparking a desire-event.
    From there, the desire spreads in a molecular flow of ‘imitative rays’, challenging
    coded beliefs and values, forcing adaptation to a new fashion, producing new hybrids.
    The novel virus: social invention. Since Tarde’s work, research into social and
    emotional contagions has verified that transmission processes often occur below
    the radar of consciousness. People in conversation, for example, tend to mimic
    and synchronise their movements without thinking about it, adjusting to new stimuli
    within 125 to 200 milliseconds. In the same way, emotional states tend to be synchronised
