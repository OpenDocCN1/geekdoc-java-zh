  md: '# III.


    Hitler massaced three million Jews ... there’s three million drug addicts ...nI’d
    be happy to slaughter them.


    – Rodrigo Duterte¹⁷


    This thumbnail sketch deliberately does not start by describing the rise of

    Trump, Modi, Duterte and Bolsonaro as a takeover by ‘strongmen’,

    ‘authoritarians’ or ‘fascists’. The gravity-defying ascent of right-wing

    nationalists is of enormous importance. Their techniques of online celebrity,

    the cynical gaming of stalemate political systems and their politics of

    cruelty have been widely and justly studied. The major states in which they

    have won office – India, the United States, the Philippines and Brazil – are

    among the world’s most populous. Together, they comprise over 2 billion

    people.


    Though the ‘strongman’ tendency is real, these rulers are far-right

    celebrities, not despots. They have been propelled to power by electoral

    means, not by the military or paramilitaries. They have tended to conserve

    the majoritarian electoral system rather than trying to overthrow it. With the

    exception of Modi, whose grip on Indian public life is bolstered by a mass

    party (the BJP) and a paramilitary Hindu nationalist movement (the

    Rashtriya Swayamsevak Sangh, RSS), they don’t have a strong civil base

    on which to rely. The conditions of their rise are negative: the stalemate of

    parliamentary institutions, the declining authority of the old establishment

    and the breakdown of social life (as documented, in the United States, by

    Robert Putnam and Thea Skopol.


    It is common to compare their politics with fascism, particularly in

    American bestsellers about Trump. Historical fascism, however, was the

    product of a world long gone. In Europe, it was the product of a class civil

    war from Russia to France, turbulent processes of modernisation and

    urbanisation, racial tyranny in the form of segregation and colonialism, and

    presses towards world war. That garrison, highly stratified world is

    gone, even if movements like Black Lives Matter are urgently raising

    awareness about their violent overtures. Today’s disaster nationalism is not,

    with the exception of the Israeli far right, colonialist. The allure of

    imperism for fascist movements is their vindication of race and violence as

    principles of life, in its affirmation of counter-democratic hierarchy, in its'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'promise of reconstruction through what Bismarck called ‘blood and iron’ (Blut
    und Eisen) and in its promise of spiritual meaning achieved through an encounter
    with death. Today’s right far has a much more ambiguous relationship to imperialism:
    while many American soldiers have been radicalised on the frontlines in Iraq and
    Afghanistan, the institutions of US imperialism at least are seen being ‘woke’
