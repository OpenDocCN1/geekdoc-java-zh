  md: 'White House explained all: the cracks and strains of civilization, the diminished
    self-assurance of the United States, the sudden frights and shocks of a world
    in crisis. Here was a local manifestation of what Christian theologians call ‘kairos’:
    the contraction and intensification of time.


    These ruptures are not isolated events. They are too consistent over time, and
    too global, to be explained by local factors such as the backlash of a fading
    white supremacy, or Russian troll farms, or ‘bad actors’ spreading disinformation.
    They are part of a longer political cycle in which we can see what Gramsci referred
    to as ‘the molecular accumulation of elements destined to produce an ‘explosion’.¹¹⁵
    It is useful to distinguish between what historian Fernand Braudel described as
    the event, the cycle and the *longue durée*.¹¹⁶ The event is the familiar subject
    of the daily news and adrenalised social media feeds. The *longue durée* describes
    an underlying structure of human behaviour that is sustained for centuries, such
    as capitalism or colonialism. When we think of how those structures keep repeating
    certain patterns—economic crisis, political chaos, violence—over time. This is
    one of the reasons why the 1930s seem such a rich for us: there are arresting
    similarities with the Great Depression following the 1929 stock market crash,
    with its tumultuous political fallout, and the Great Recession following the credit
    crunch.


    The medium-term duration, the cycle, describes a period of some decades in which
    a set of social changes or conflicts germinate, develops and matures. Examples
    of a cycle would include the industrial revolution (1760–1840), the European civil
    war (1914–45), or the era of neoliberal globalisation (1980–2008). Political outcomes
    over the last few years tell us what kind of cycle we’re entering, and the comparative
    weakness of leftfi-stist upsurges, we’re entering a cycle of nationalist revanchism.
    The long-standing pathologies of cruelty and deprivation built into daily life,
    a version of what environmentalist Rob Nixon calls ‘slow violence’, have erupted
    into spectacular violence.


    It isn’t the economy, stupid. It isn’t physical survival. In India, the Philippines,
    Brazil and the United States, pogroms, death-squad populism, far-right militias
    and police and paramilitary violence are the driving force of nationalist success.
    They offer not growth, but the chance to destroy a neighbour. Isn’t this what
    happens civilization falls away?'
