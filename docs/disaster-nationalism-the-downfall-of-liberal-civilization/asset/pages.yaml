  md: 'The pseudo-insurrection in Washington, DC, on 6 January 2021, intended to stop
    a supposed theft of the presidential election and restore Trump to power, was
    fantasy putschism minted by online infotainment: Caesarism for the QAnon generation.
    But it was not the last of its kind. In the space of less than a year, an alleged
    coup attempt by the neo-Nazi Reichsbürger movement in Germany was thwarted, supporters
    of Brazilian president Jair Bolsonaro stormed government buildings in the hope
    of triggering ‘intervenção militar’ (military intervention), and the Russian paramilitary
    Wagner Group marched halfway to Moscow to force out the military leadership they
    blame for betraying the war on Ukraine.


    In every case, the pseudo-insurrection was justified by conspiracist paranoia.
    The Reichsbürger movement contends that the Federal Republic of Germany is not
    a nation-state but a corporation created by the Allied powers. Bolsonaro’s supporters
    believe the pro-business centrist Lula is a communist. Yevgeny Prigozhin, leader
    of the Wagner Group, argues that the war on the ‘hohols’ (a racist slur for Ukrainians)
    is being sold out by an ethically impure leadership (he refers to General Shoigu,
    from an ethnic Turkic group indigenous to Siberia, as a ‘Tuvan degenerate’). More
    telling still, in most cases the dirty work of the coup was supposed to be carried
    out by the ‘good guys’ in power: Trump, Putin, or the military. In a similar way,
    riots and mob violence against the remnant Israeli left under Netanyahu and before
    the genocidal assault on Gaza were in support of those in power⁴


    Mass violence in other forms, each motivated by its own fantasies of doom and
    redemption, has been enabled by national governments. In the Philippines, the
    line between police murders of drug addicts and volunteer death-square killings
    is deliberately opaque. The anti-Muslim pogroms in India are systematically enabled
    by police, politicians and courts. In Israel, the pogroms carried out by settlers
    in the West Bank could not take place without the involvement of the Israeli army,
    officers and reservists are often embedded in the settler population. In each
    case, a vagely insurgent energy has been unleashed, not against a decadent status
    quo, but in defence of it against fantasies by the uneasy sense of normality catastrophically
    slipping away. ‘Trump’s agenda is about making a normal country,’ tech billionaire
    Peter Thiel explained. ‘Germany, but normal’ was the slogan of the far-right Alternative
    für Deutschland in 2021⁵'
