  md: '# Introduction


    One of the lessons of the Hitler period is the stupidity of cleverness. How many
    were the expert arguments with which Jews dismissed the likelihood of Hitler’s
    rise, when it was already as clear as daylight ... According to the clever people,
    fascism was impossible in the West. Clever people have always made things easy
    for barbarians, because they are so stupid ... That cleverness is becoming stupidity
    is inherent in the historical tendency.


    > Max Horkheimer and Theodor Adorno, Dialectic of Enlightenment


    1.


    The far right is enthralled by images of disaster. ‘Death panels’. White genocide’.
    The ‘great replacement’ of whites by immigrants. The Jews who ‘will not replace
    us’. ‘Cabals’ of Satanist paedophiles and communists. ‘Islamisation’, ‘FEMA camps’,
    Immigration ‘invasion’. ‘Traitors’ in office. Climate hoax. ‘Pandemic’. Chinese-style
    communism. An election stolen by the deep state. A nation under attack by left-wing
    terrorists. Civil war is here, right now.


    Such scenarios segue swiftly into violent exhortation. ‘I can’t sit by and watch
    my people get slaughtered. Screw your optics, I’m going in.’ Storm the capitol.
    ‘Armed march on capitol hill and all state capitols.’ Come armed with rifle, handgun,
    2 knives and as much ammo as can carry.’ ‘Do not let them disarm someone without
    staking bodies.’ Bring handcuffs and zip ties.’ ‘Fuck zip ties, I’m bringing rope!’
    Cross the Rubicon. Declare a dictatorship. Invoke the Insurrection Act of 1807,
    deploy the military and national guards, and put down the leftist conspiracy.
    Invoke Executive Order 13848 and investigate the election fraud. The corrupt cabal,
    as a bestselling QAnon book had put it, must ‘be permanently eradicated from the
    earth’ Hail Trump.'
