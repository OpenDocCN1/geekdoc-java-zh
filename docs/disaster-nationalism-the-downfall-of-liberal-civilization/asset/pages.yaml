  md: 'The outbursts of demotic violence accompanying the catastrophes of war and
    depression, though neighbourly not new in type, were elevated in wild and whirling
    winds of neighbourhoods hate. Alain Berth documents a surge in worldwide terror
    events since the 2003 invasion of Iraq, and a crescendo of civic violence since
    the 2008 financial crash. Lone wolf murders increased 143 per cent between the
    1970s and 2000s (by 45 per cent in the United States, and by 412 per cent in fourteen
    other countries affected). By 2016, the number of people killed in lone wolf attacks
    was already more than double what it had been in the 2000s: a contagion spread
    mimetically, on gamer forums and far-right social industry channels. White supremacist
    violence has surged since 2010, while mass shootings were occurring in the United
    States at a rate of more than one per day by 2019. The growth of rightist paramilitaries
    could be seen from Eastern and Central Europe to the United States, alongside
    apocalyptic religious ideologies and millenarian cults, from the widely popular
    ‘Left Behind’ to QAnon.¹¹


    The rise in political violence, even as other forms of violent crime fell over
    thirty years, Bertha, indicates a severe crisis of political action. Since 2008,
    this crisis has been exacerbated by the sudden, acute awareness of inequality,
    inflamed by the aggravation of ‘horizontal inequalities’ as racism in the United
    States or communal oppression in India. As Gudrun Ø of Oslo’s Peace Research Institute
    documents, political violence is strongly correlated to the magnitude of these
    sorts of inequalities, especially when democratic mechanisms don’t work to mitigate
    them.¹² And the more that already weaken democratic systems degrade and become
    incapable of absorbing these crises, the greater risk of violent explosions. This
    is what produced the brooding, simmering, violent landscape that produced a string
    of breakthroughs through a motive association for far-right demagues, networks
    and parties, from Orbán’s landslide in Hungary in the 2010 parliamentary elections,
    to Narendra Modi’s victory in the 2014 Indian general election, Britain’s right-driven
    exit even from the European Union (Brexit) and Trump’s ascent to the White House
    in 2016, Jair Bolsonaro’s shock in Brazil in 2018, and the rise of Italy’s far-right
    Lega Nord to government in coalition with the populist Five Star Movement in the
    same year.


    Incumbency has been extremely forgiving to these forces. In 2019, Narendra Modi
    was re-elected in India, with a 6 per cent swing in his for favour, on an agenda
    of stripping citizenship rights from Muslims and violently crushing opposition
    in occupied Kashmir. The ruling coalition'
