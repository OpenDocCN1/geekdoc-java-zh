  md: '‘Fascism seems to come from the outside,’ Félix Guattari warned, ‘but it finds
    its energy right at the heart of everyone’s desire.’ Foucault likewise cautioned
    that the issue was the ‘fascism in us all … in our heads and in our everyday behavior,
    the fascism that causes us to love power, to desire the very thing that dominates
    and exploits us’,27


    Before fascism becomes a movement, it must circulate in everyday life, in the
    nascent form of every paranoia and victimhood, fantasies of restitution and revenge,
    for domination, the authoritarian need to be right, the capacity to humiliate,
    approval-seeking ingroup conformity and converse towards malice and social childish.
    These are the ordinary fantastic jouissances, or microfactions, that, when given
    an appropriate ideological shape, announce themselves loudly in moments of crisis.


    Crises of capitalism are generally also crises of the left in its habitual modes
    of thinking and reproduction. And in the ‘diagonal’ politics of recent years,
    an assortment of declassé intellectuals and others from the left has flipped to
    a version of far-right politics. The axis of this transition has been a perceived
    threat to the body and its relative freedom of movement, whether it is transgender
    rights threatening ‘women’s spaces’, or Covid interventions and vaccines crushing
    popular sovereignty. It would be comforting to say that the seeds of apostasy
    were evident along, but that isn’t true. It would also be nice if we could put
    it down to the left unnecessarily alienating people through its neglect of issues
    that the right exploit, docile online censoriousness and reactive moral simplicity.
    That is a real issue, on which Naomi Klein is bracingly in doppelganger. But to
    blame it entirely on that would imply that the defectors were easily startled
    rabbits. The truth, I suspect, is closer to Guattari’s hunch, the desire for fascism
    is a latent temptation from which no one is exempt. There may always prove to
    be attachments that matter more, not only than our most deeply held beliefs, but
    our commitment to reality as such. In this sense, we might think of the ‘fascism
    in us all’ much as we were encouraged to see the Covid-19 virus: we might be contagious
    knowing it.


    There is a warning from history here, described in Alf Lütke’s essay asking of
    German workers under Nazism: ‘What Happened to the “Fiery Red Glow’?’ Lütke tracks
    the shock of Social Democrats and Communists in March 1933 as working-class neighbourhoods
    were decked out with'
