  md: 'Disaster nationalism, the apocalyptic nationalism that swept several far-right
    leaders to power and is even now ready more breakthroughs, has mounted a spectacular
    critique of political orthodoxy.


    The law of political gravity was expressed by Bill Clinton''s aide James Carville
    during the 1992 election: ''It''s the economy, stupid.'' The slogan summed up
    a whole world: if voters were treated as consumers, their rational choices would
    keep politics in the consensual middle ground. Competent politicians could secure
    just enough prosperity, however staggering the inequalities became, to blunt persecuting
    passions. An example of this type of thinking was summed up by Benjamin Friedman,
    in The Moral Consequences of Economic Growth: ''Economic growth—meaning a rising
    standard of living for the clear majority of citizens—more often than not fosters
    greater opportunity, tolerance of diversity, social mobility, commitment to fairness,
    and dedication to democracy.''10 This axiom, from classical political economy,
    has never described real human behaviour. And now righteous politicians proved
    that millions will gladly, sometimes self-consciously, hurt what they are told
    is their best interest: income, employment, health and even their lives can be
    sacrificed for the chance to destroy an enemy.


    The convection cells of this storm have long gathering in plain view. As early
    as 1996, the Hindu supremacist Bharatiya Janata Party (BJP) became the biggest
    party in the Indian parliament four years after its illegal mob-led demolition
    of the Babri Masjid. The same year, Pat Buchanan''s far-right campaign did far
    better than expected in the US Republican primaries. In 1998, the young anti-communist
    nationalist Viktor Orbán, a legatee of Hungary''s interwar ruler Admiral Miklós
    Horthy, swept to power in Hungary''s general election. Jörg Haider''s Freedom
    Party came second in Austria''s legislative elections. There followed a string
    of surges for far-right parties, as the disasters of war and then financial ruin
    accelerated the deeply rooted unhappiness, distrust and social resentment already
    circulating in these societies, directing them towards Muslims and migrants. The
    neo-fascist Front National came second in France''s 2002 presidential race, the
    anti-Muslim Pim Fortoyen to 17 per cent of the vote in the 2002 general election,
    and the BJP swept the elections in Gujarat following an anti-Muslim pogrom. There
    followed breakthroughs for the Belgian Vlaams Blok, the Swiss People''s Party,
    the British National Party and, in the United States, the birth of the Tea Party
    movement.'
