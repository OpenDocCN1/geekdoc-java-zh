  md: 'Another way to use annotation interfaces is to include an interface "method"
    in its declaration. However, an annotation interface method is actually used more
    like a class field that stores data. For example, the following annotation interface
    definition declares a method that has a return type of String, and it is used
    in source code like a field that holds a String value:


    ```

    // Custom Annotation Interface Definition

    @interface ProgrammedBy

    {

    String value();

    }

    ```


    ```

    // Using the annotation type to mark a class

    @ProgrammedBy (value = "Bortus")nclass SomeClass

    {}

    ```


    Finally, I want to bring your attention to a fun fact, which is that Java allows
    the annotation of annotation interface definitions, in order to apply some special
    properties to that annotation interface. In other words, it is an annotation of
    an annotation!


    ```

    @AnnotationOfTheAnnotation

    @interface ModifiedAnnotationInterfaceDefinition

    {}

    ```


    So annotations can get confusing, but just remember they are not required in any
    way for your program to function normally. They are really designed for use by
    professional software companies to keep track of version information and code
    meta-structure. So if you see an annotation, you can ignore it if you want to.'
