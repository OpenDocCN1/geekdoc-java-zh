  md: 'This 3-step process described above always happens when you run the javac Java
    compiler. In the command prompt, you feed javac the name of the .java source code
    file. You also use the -d option to tell the compiler where to deposit any package
    folders and the compiled class files. The javac program takes these command line
    options, reads the java source code to get the package name, creates the appropriate
    folder hierarchy, and puts the compiled class files there.


    In the example above, the package is a single, simple package, which is indicated
    by the package name being a single word. If Java wanted to, it could leave package
    complexity at this level, and force classes to be grouped in simple packages like
    this. This would be a nice and easy way to do it, and programmers would just get
    used to putting all their classes within one package folder. For example, here
    are five unique classes, having five fully qualified names, made by three different
    programmers. Each programmer chooses a unique package name, so they don''t have
    to worry about their classes having the same simple names:


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_126_0.png)


    However, Java classes are often not organized in such a simple manner. In reality,
    classes are organized in a much more complicated package hierarchy, and this is
    because of Java''s support for sub-packages.


    A sub-package is a package within a package, and this can be repeated on and on,
    with many sub-packages within sub-packages. But let''s examine the scenario with
    just one additional layer of sub-packages.'
