- img_proc: true
  md: 'Before starting, a quick introduction - this book is intended for intermediate
    level Java learners, because it gets into the weeds of .class files and how the
    JVM works. However, I believe studying the .class files and JVM is the best way
    to learn Java, so I think beginners could benefit as well.


    This book assumes you know how to make a .java file and compile to a .class file,
    as well as the basic Java source code commands, like static and non-static initialization
    blocks, fields, and methods.


    As you will see, many of these basic Java programming concepts are not explicitly
    included in this book. The reason is because there are already good books and
    websites that will teach you these basic Java operations and commands. One very
    important website you should definitely check out is the official Java Language
    Specification:


    https://docs.oracle.com/javase/specs/index.html


    Which has a guide for the Java source code language, and another guide for the
    Java Virtual Machine. These official documents might be the best source of information
    you can find, but they are very technical and hard to read. Hopefully this book
    will bridge gap, at least a little bit, by covering some of these technical topics
    in a way that is easier to absorb.


    Let''s jump right in, by examining a simple Java class, and see how its source
    code is represented in a compiled .class file:'
  merge: -1
  pgno: 3
- img_proc: true
  md: "Empty.java is an example of class, written in Java source code:\n\n```\n//\
    \ Empty.java\nclass Empty {\n    static public void main(String[] args) {\n  \
    \  }\n}\n```\n\nclass :: the Java keyword class declares that the following word\
    \ will be the name of a class template\n\nEmpty{ } :: the word Empty is not a\
    \ Java keyword, it is simply some text that will be used to identify this class\
    \ template - it is common to make the first letter of a class name capitalized,\
    \ but you could use all lowercase letters if you want; the curly brackets enclose\
    \ everything inside the Empty class\n\nstatic public void main(String[ args){}\
    \ :: this is a method, the name of the method main, it takes String array named\
    \ args as a parameter, void means the method returns no value, public means any\
    \ code can use this method, static means this method's information is stored in\
    \ MethodArea memory; also this method is required as the program's entry point\
    \ if we want to run this class as a program in JVM\n\nCompared to other classes,\
    \ this Empty class is very simple. It only declares one method, which does nothing.\
    \ There is nothing else in the class. But it does compile to a .class file, and\
    \ this .class file contains all the information needed to run this class as a\
    \ Java program."
  merge: -1
  pgno: 4
