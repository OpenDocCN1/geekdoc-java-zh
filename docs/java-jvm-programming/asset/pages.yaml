  md: 'To create a sub-package, the process is basically the same as before. You simply
    write package.sub-package when you declare the class''s package affiliation in
    its source code file. Take a look at this example class file:


    ```

    //myClass.java

    package pkg.subpkg;


    class myClass

    {}

    ```


    The package keyword is used exactly the same as before, and we have the top-level
    package written too. Now however, there is a dot, followed by another word, and
    simply writing this packagename+dot+subpackagename structure in the source file
    tells the compiler that there is a nested hierarchy of packages. Pkg is the top-level
    package, and that package has a sub-package within it called subpkg.


    How would this be handled by the compiler? Javac actually handles the sub-package
    hierarchy automatically, just as before. I can see that you have a sub-package
    within another package, so when it creates the package folders, the package hierarchy
    is reflected in the folder directory structure.


    The command prompt instruction is even the same as in the simpler case. You simply
    include the "-d path" option to tell the compiler where to create the more complex
    folder hierarchy, like this:


    ```

    javac -d C:/classes/ C:/source/myClass.java

    ```


    And you can see, the command is exactly the same as before. For the class written
