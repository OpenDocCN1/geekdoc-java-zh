  md: 'The hard part of JVM memory storage is over, now to see at what the data in
    these various parts of memory are created. JVM basically creates structures in
    memory as needed. This means that the JVM gets an instruction to reference a field
    or a method from a class that hasn''t been used before, the JVM will find the
    .class file for that method and load it into the MethodArea memory on-the-fly.
    Right after the class''s template is loaded into memory, JVM runs code to initialize
    any (and only!) class (static) fields, and it also runs any code within the static{}
    initialization code block. These initialization steps only occur once, since the
    class template is only loaded in the MethodArea memory once.


    Once in MethodArea memory, a class template can be used to create multiple new
    class instances in the HeapArea, and these new instances will be created in the
    HeapArea whenever JVM executes the opcode new, which is used to create instance
    copies. If the class template contains any instance (non-static) fields, these
    are initialized immediately after the class is created in HeapArea memory - note
    that instance fields do not exist before an instance is created in HeapArea memory!
    Also, any code within the non-static initialization block {} is executed right
    after instance creation. Because a class instance is a separate data entity from
    its class template, initializing instance (non-static) fields in the HeapArea
    instance does not overwrite the class (static) fields in the class template in
    the MethodArea.


    Finally, the ThreadData data of methods are only created after the method is called
    via a JVM invoke instruction. Once the method is invoked, a new frame in the ThreadArea
    frame is created and initialized with: (1) a reference to the constant pool table
    of the class template that the invoked method is associated with; (2) an array
    of local variables including a reference to the invoking class object, method
    parameters, variables declared in the method body, and a reference to wherever
    the return value should go; and (3) some stack space for the operands of JVM instructions.
    When the method''s instructions hit a return opcode, the frame and all its opcodes
    and local variables are deleted. This is the reason why the static keyword is
    not allowed by Java inside a method code block, because any static variable declared
    inside a method would be deleted anyways, thus it doesn''t make sense to have
    them.'
