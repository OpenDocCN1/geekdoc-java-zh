  md: 'The constant pool is finished now, the new data in the ClassFile is other information.
    Namely, the first 2 bytes after the pool contain information about what kind of
    structure is represented by this ClassFile, because it''s not always a Java class,
    and also access permissions for the ClassFile does in fact represent a Java class.


    The 16 bits found in these two bytes each represent a "flag", which is either
    ON (1) or OFF (0). Sometimes more than one flag is turned on, and sometimes not.


    For this particular example, the two bytes are 0x0_0_2_0:


    ```

    CA FE BA BE 00 00 3C 00 0F 0A 00 02 00 03 07 00 04 00

    05 00 06 01 00 10 6A 71 76 61 72 6F 61 67 2F 4F 4F 62\653 74 01 05 06 3C 69 76
    74 3E 01 00 03 28 29 56 07 00 08

    01 01 05 45 6D 74 79 78 01 00 04 63 65 61 01 00 04 6F 4C 69 6E

    62 65 47 75 6D 62 72 61 61 6C 6F 61 61 67 2F 54 74 72 69 011 01 11 16 28 5B 5B
    6A 61 61 61 00 20 6F 61 61 27 54 74 72 69 n69 67 37 39 29 2E 2A 61 61 00 00 65
    75 63 63 65 69 6C 65 01 00

    00 45 45 7D 70 74 29 00 00 00 00 00 00 00 00 00 00 00 00 n0

    00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00

    00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00

    00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 00

    00 00 00 00 00 00 00 00 00 00 00 00 00 00 00 0E

    ```


    These two bytes represent the 16 bits:


    ```

    0b0000_0000_0010_0000

    ```


    You can see that the sixth bit from the right is on. This "flag" happens to tell
    the JVM about how it should invoke superclass methods, and it is always set to
    ON. All other flags are set to OFF.


    The right-most bit happens to be the public/default class access bit. A public
    class can be used by any other class, while a default (non-public) class can be
    used only within the same package. Access flags are discovered later on.


    You can see all the flag bits do in section 4.1 of the Java Virtual Machine Specification:


    https://docs.oracle.com/javase/specs/jvm/se17/html/index.html'
  merge: -1
  pgno: 28
