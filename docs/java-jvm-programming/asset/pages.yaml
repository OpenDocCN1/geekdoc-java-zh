  md: "One common error message when learning Java is \"Non-static variable cannot\
    \ be referenced from a static context\". For example, this code does not compile:\n\
    \n```\nclass Hello\n{\n    String instField = \"Hi\";\n    static public void\
    \ main(String[])\n{\n        System.out.println(instField);\n    }\n}\n```\n\n\
    Why does this error happen? It is a result of the order in which class (static)\
    \ fields and instance (non-static) fields are created in memory. Class fields\
    \ are created and initialized to their values as soon as they are referenced in\
    \ source code, because JVM finds the class template, loads it into MethodArea\
    \ memory, and initializes any class fields immediately. Instance fields on the\
    \ other hand, are created and initialized only when a new class instance is built\
    \ within the HeapArea after the opcode new is executed by JVM.\n\nIn the Hello\
    \ class above, there is an instance field written into the source code. But this\
    \ source code is simply the template of the class. Instance fields are only created\
    \ after an instance copy of the class template is built via the new opcode. If\
    \ you were able to run the above class in the JVM, the memory layout at the moment\
    \ the printline command would look like this:\n\n| MethodArea | HeapArea | ThreadArea\
    \ |\n| --- | --- | --- |\n| Hello.class Template | | static main() |\n\nAnd the\
    \ instance field instField does not exist! Somehow, the compiler is smart enough\
    \ to predict this would happen, and so it doesn't let you compile this class."
