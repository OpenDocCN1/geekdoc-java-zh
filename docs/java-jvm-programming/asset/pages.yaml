    00 00 01 00 00 01 01 01 01 01 01 00 00 00 06 00

    01 01 00 00 05 01 01 01 00 00 00 02 00 00 0


    Pool entry #2 holds the name of the superclass of this class. It actually points
    to another pool entry, entry #4, which contains the text string "java/lang/Object".


    **java/lang/Object** is the "fully qualified" name of the superclass of the Empty
    class. In the source code for Empty, there is no superclass explicitly specified,
    which would have been done via the **inherits** keyword.


    It turns out that when you write a new class that does not explicitly inherit
    from any other class, the compiler automatically adds **java.lang.Object**, as
    the superclass. However, you cannot see this in the source code, as the compiler
    simply adds this to the .class file.


