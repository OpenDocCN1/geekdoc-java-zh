- img_proc: true
  md: 'A side effect of inheriting from the Object class however is that your class
    contains several fields and methods that you also didn''t explicitly write in
    your source code!


    These fields and methods are inherited from Object, but you can''t see this in
    your source code, because it all happens within the JVM system.


    Therefore, this Empty class, which seems to contain no fields or methods, actually
    does have fields and methods, namely the same ones found in Object.


    The fields must be initialized to some default values, because that is how Java
    works. Our Empty class has no constructor or initialization code, so JVM simply
    goes up one level to the super class Object and looks for initialization code
    there.


    That is the reason why this class, Empty, which contains no initialization code
    or constructor methods, calls a constructor from the java.lang.Object class.'
