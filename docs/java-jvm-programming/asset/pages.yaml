    where a new object of lang.type ClassOne is created:


    ```

    public static void main(java.lang.String[])

    descriptor: ([Ljava/lang/String;)V

    flags: (0x0009) ACC_PUBLIC, ACC_STATIC

    stack=2, locals=2, args_size=1

    0: new #7 // class pkg/ClassOne

    3: dup

    4: invokespecial #9 // Method pkg/ClassOne.<init>:()V

    7: astore_1

    8: getstatic #10 // Field java/lang/System.out:java/io/PrintStream;

    11: load_1

    12: getfield #16 // Field pkg/ClassOne.instanceField:I

    15: invokevirtual #20 // Method java/io/PrintStream.println:(I)V

    18: return

    LineNumberTable:

    line 8: 0

    line 9: 0

    line 10: 18

    ```


    The **new** is the first opcode in the method. The **new** command creates a new
    instance of the type named in constant pool entry #7, pkg.ClassOne, and afterwards
    it pushes a memory pointer to the object onto the operand stack.


    The **dup** command simply copies the value on top of the operand stack and pushes
    that copy back onto the operand stack. Now there are two memory pointers to the
    object on the operand stack.


    Once the object is made, the JVM calls the **invokespecial** command, which calls
    the constructor method of the object pointed at by the memory pointer on top of
    the operand stack, which is of course the pointer to the new object, and **invokespecial**
    also takes the value held in the constant pool entry #9, which is the new object''s
    class type, the name of the constructor method `<init>`, and the constructor''s
    signature, which here is (V meaning there are no parameters passed into the constructor
    and value returned.


    The remaining opcodes, indexes 7 through 15, are used to fetch the value of the
    new object''s field, set up the println() method, and then print the object field
    value to the console, as you saw in the source code.'
