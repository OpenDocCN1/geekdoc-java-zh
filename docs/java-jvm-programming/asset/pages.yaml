  md: 'The next two bytes in the .class file are a reference to the constant pool,
    pointing at a pool entry that gives the name of the class that ClassFile represents.
    In Java source code, a reference within a class to itself is known by the keyword
    this, so typing the this in a java source file will link to these two bytes, pointing
    to a constant pool entry naming itself.


    For this example class, which is named Empty, the two bytes are 0x00_07, which
    has the decimal value 0D7, meaning that the ClassFile is represented by the class
    name in constant pool entry #7:


    ```

    CA FE BA BE 00 00 00 3C 00 0F 0A 00 02 03 07 00 04 0C 00

    05 06 06 01 01 10 6A 61 71 76 21 2F 6C 6E 67 2F 4F 62 6A 65

    73 74 01 01 06 3C 69 66 74 79 01 00 01 03 28 29 56 07 00 08

    01 01 05 45 6D 70 74 79 01 00 04 63 64 01 01 00 0F 4C 69

    6E 65 4E 75 6D 62 75 72 61 61 61 61 61 61 61 00 04 69 69 69\ 05 00 74 74 79 29
    00 00 00 00 00 00 07 2F 53 74 72 69

    6E 67 38 29 56 01 00 01 00 00 01 00 00 00 00 00 00 00 00 00 n00 00 00 00 00 00
    00 00 00 00 00 00 00 00 00 00 00 00

    00 01 00 00 01 00 00 00 00 00 01 00 00 00 00 00 00 06

    00 01 00 00 01 00 00 00 00 00 0C 01 00 00 00 00 00 19

    00 00 00 00 01 00 00 00 00 00 00 00 00  0  00 00 00 00

    01 00 00 00 05 01 01 00 00 00 00 00 00 02 02 0E

    ```


    A few pages ago we looked at the #7 constant pool entry, and it is a reference
    to the #8 entry, which is a UTF8 entry containing the string "Empty", which is
