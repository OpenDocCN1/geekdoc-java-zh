    \ the memory pointer itself.\n\nSo to summarize the main points about Java's ability\
    \ to handle problems encountered during program execution:\n\n+   * Throwable\
    \ is the name of the class that Java uses to categorize any problem that is detected\
    \ during a program's run\n\n+   * classes that inherit from Throwable, i.e. subclasses\
