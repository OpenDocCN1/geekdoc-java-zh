    ```


    Entry type 12 is known as a NameAndType, because it contains both the name and
    the last type of a variable or method. NameAndType constant pool entry is five
    bytes long, the first is the ID, the next two refer to another constant pool entry
    containing a name, and the last refer to a pool containing a type descriptor:


    ```

    CONSTANT_NameAndType_info {

    u1 tag;

    u2 name_index;

    u2 descriptor_index;

    }

    ```


    So the tag byte is 0x0C, the two bytes pointing to the name in the constant pool
    entry are 0x00_05 (0d5), and the type descriptor constant pool entry is two other
    constant pool entries, 5 and 6:


    ```

    CA FE BA BE 00 00 3C 00 0F 0A 00 02 00 03 07 00 04 0C 00

    05 00 06 01 00 10 6A 61 76 61 2F 6C 61 6E 67 2F 4F 62 6A 65

    63 74 01 01 00 06 3C 69 6E 74 3E 01 00 03 28 29 56 07 08 00

    01 01 05 45 6D 70 74 79 01 08 43 6F 64 65 01 00 04 63 69 6E

    EE 65 45 45 65 62 62 52 52 61 61 61 05 00 00 64 61 69 69 n11 01 16 28 28 4C 4C
    61 61 71 61 6F 2F 6C 61 67 61 01 74 72 62

    6E 67 3B 29 29 01 01 00 0A 53 6F 75 65 63 45 49 69 60 00 00

    0\ 05 64 64 79 29 21 61 61 71 01 00 00 00 02 00 00 00

    0\ 02 00 00 00 00 05 00 01 01 00 00 00 00 01 01 01 01\ 01 00 00 00 06

    01 00 00 01 00 01 01 00 00 00 00 01 01 01 00 00 00 00 00 19

    01 00 00 01 00 00 01 01 00 00 00 00 00 00 00 00 00 001 00  0  0  0  00 01 01 05
    00 00 00 00 00  0  0  02 00",

    ```'
