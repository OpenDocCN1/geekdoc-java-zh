  md: "In this file tree the module directory folder is called sourcemod/, and this\
    \ folder contains the base folders for two modules. In this simple example, there\
    \ is only one package per module, and one class in each package. Note that the\
    \ packages have unique names, even though they are in different modules.\n\nI\
    \ have written a simple program that demonstrates how the requires and exports\
    \ keywords in the module-info file. Let's have a look at each of the .java files\
    \ to see what this little Java program will do. First is the ClassOne.java file:\n\
    \n```\n// ClassOne.java\npackage pkgone;\n\npublic class ClassOne {\n    static\
    \ public void main(String[]) {\n        System.out.println(pkgtwo.ClassTwo.classTwoField);\n\
    \    }\n```\n\nThis file contains a class definition for a class called ClassOne,\
    \ which is part of the pkgone package. This class contains the main() entry method\
    \ for the Java program. Inside the main() method, the System.out.println() method\
    \ is called, and the thing it will print is a field from the ClassTwo class, which\
    \ is located in the package called pkgtwo, which is in the module called moduletwo.\
    \ Let's have a look at the ClassTwo class to see the field that will be printed:\n\
    \n```\n// ClassTwo.java\npackage pkgtwo;\n\npublic class ClassTwo {\n    static\
    \ public String classTwoField = \"Hello there\";\n}\n```\n\nClassTwo is very simple.\
    \ It is listed as part of the pkgtwo package, and it is a public class. There\
    \ is only one class member, which is a static field holding the String value “Hello\
    \ there!\".\n\nSo this Java program contains two classes. ClassOne is the starting\
    \ point for code execution, because it has the main() entry method."
