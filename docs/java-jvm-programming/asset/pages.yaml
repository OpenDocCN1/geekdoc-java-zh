  md: 'memory area is called ThreadArea because each thread in a program has its own
    personal ThreadArea memory. Some programs use several execution threads, but multi-threading
    is an advanced programming technique that is beyond this book, so I will consider
    only single-thread programs. However, the ThreadArea memory is identical in structure
    for each thread, so if you understand how the ThreadArea memory works for single-thread
    programs, then you will also understand programs with several ThreadArea memory
    chunks. ThreadArea memory chunk is itself divided into two smaller chunks: (1)
    a program counter and (2) a method stack.


    +   - The program opcode counter is an incrementing ticker that points to the
    JVM opcode that is currently being executed by the JVM computer. Only one opcode
    can be executed at any given time by a single thread, which is why JVM has one
    program opcode counter per thread.


    +   - The method frame stack is basically a list of so-called method frames. Each
    method gets called in your Java code, a new frame is created in this stack area.
    This implies that there can be multiple frames representing the method, if the
    method gets invoked multiple times. Each method frame is divided into three method
    areas: (1) a reference to the constant pool (which is in MethodArea memory) of
    the class that defined that frame''s method; (2) a list of so-called local variables
    that can be used only by the same frame; and (3) a stack of operand values that
    are to be used, i.e. operated on, by JVM opcode instructions.


