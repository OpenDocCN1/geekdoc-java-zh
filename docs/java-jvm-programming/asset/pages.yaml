    To me it would seem a better choice to not allow any layering of packages, since
    the sub-packages all get treated as different packages by JVM anyways. It would
    make things much easier for people who are learning Java. In any case, this is
    how packages in Java work, and it is kind of nice to have things organized conceptually.
