  md: "Inside the main() method, the System println method is called with the static\
    \ field from ClassTwo as its argument. Therefore, for this project to run properly,\
    \ ClassOne needs access to ClassTwo's field.\n\nThis is a problem, because ClassOne\
    \ and ClassTwo are located in different modules. However, access can be granted\
    \ by setting up the module-info files for both modules appropriately. Namely,\
    \ ClassOne's module needs to request access to ClassTwo's module. And ClassTwo's\
    \ module needs to allow its pkgtwo package to be accessible by other modules.\n\
    \nFirst, let's look at how moduleone can set up its module-info file to request\
    \ access to moduleletwo's code:\n\n```\n// moduleone's module-info.java\nmodule\
    \ moduleone\n{\n    requires moduleletwo;\n}\n```\n\nYou can see that moduleone\
    \ uses the requires keyword to tell JVM it wants to get access to the packages\
    \ contained in the moduleletwo module. If moduleletwo has any public classes,\
    \ then code from moduleone can use them. Now let's look at the module-info file\
    \ from moduleletwo:\n\n```\n// moduleletwo's module-info.java file\nmodule moduleletwo\n\
    {\n    exports pkgtwo;\n}\n```\n\nAnd you can see that moduleletwo uses the exports\
    \ keyword to tell the JVM that it is okay if code from other modules want to use\
    \ the classes from its pkgtwo package.\n\nSo, these four java files comprise a\
    \ simple Java program. Of course it would be easier to put the two classes in\
    \ the same module, inside the same package, but this is specifically an example\
    \ of how to use the module system, so they are in different modules."
