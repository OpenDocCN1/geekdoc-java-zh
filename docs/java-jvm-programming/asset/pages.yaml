  md: "Annotation interfaces are tricky, because they can come in three varieties,\
    \ have several uses, and can in fact interact with the java compiler.\n\nAnnotation\
    \ interfaces are a special subtype of java interfaces, which we will cover in\
    \ more detail later, to but to briefly explain, an interface is similar in appearance\
    \ to a class, and it cannot have any fields, only methods. Also, the methods cannot\
    \ have any code written inside of them, the only thing you can define about the\
    \ methods are their return types, names, and parameters. In other words, only\
    \ method signatures are allowed in interfaces. This is because interfaces are\
    \ intended to be inherited by other classes, in which case those classes will\
    \ add code to the interface methods.\n\nTo create your own annotation interface,\
    \ you write what appears to be a regular interface, but with the \"at\" symbol\
    \ in front of the interface keyword, like so:\n\n```\n@interface FieldAnnotation\n\
    {}\n```\n\nNow you can use this annotation interface in your source code. When\
    \ you do, you must always add it to a specific code element, like a class, field,\
    \ or method. For example:\n\n```\nclass ExampleClass\n{\n  @FieldAnnotation int\
    \ someNumber = 1;\n  //\n  @FieldAnnotation\n  int anotherNumber = 2;\n}\n```\n\
    \nYou can see in the above example class that the annotation type goes directly\
    \ **in front of the thing** that you want to associate with the annotation. You\
    \ can put it on the same line if you want, or you can put it on the line above,\
    \ which is a common way to write them too."
