- img_proc: true
  md: 'Empty.java source code file is of course easy to read since it''s written in
    the plaintext Java programming language. The compiled Empty.class file is not
    easy to read however, and because it is information is arranged in the special
    ClassFile format, which is not human readable. However, the ClassFile file format
    is posted on the Java Virtual Machine Specification here:


    https://docs.oracle.com/javase/specs/index.html


    And it is possible to walk through a .class file in a hex editor to view the data.
    That is exactly what we are going to do. This is the general format of a .class
    file:


    ```

    ClassFile {

    u4 magic;

    u2 minor_version;

    u2 major_version;

    u2 constant_pool_count;

    u2 cp_info constant_pool[constant_pool_count-1];

    u2 access_flags;

    u2 this_class;

    u2 super_class;

    u2 interfaces[interfaces_count];

    u2 fields_count;

    u2 field_info fields[fields_count];

    u2 methods_count;

    u2 method_info methods[methods_count];

    u2 attributes_count;

    u2 attribute_info attributes[attributes_count];

    }

    ```


    It is the template to store information about a Java class. Some parts have a
    set length, but other parts can be expanded with entries needed. The expandable
    parts are the lists: constant_pool[], interfaces[], fields[], methods[], attributes[].


    Of special note are attributes. These are not written explicitly in source code.
    They are created by the compiler, and give additional information about the class.


    We will now take a tour of this Empty.class file, which is a very simple class
    with no explicit constructors, no fields, and one method. The goal is to learn
    how the .class file mirrors the .java source code.'
  merge: -1
  pgno: 6
