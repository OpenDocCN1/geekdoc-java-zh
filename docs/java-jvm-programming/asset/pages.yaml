  md: "There are three meta-information structures that you might see in a class.\
    \ These are single-line comments, multi-line comments, and annotation interfaces.\
    \ All of these structures are used to store useful, but unnecessary information\
    \ about a Java program. That is to say, these structures can be typed into your\
    \ source code file, but they never affect fields, methods, or the execution of\
    \ your program in any way. They are simply a nice way of keeping things organized\
    \ and documented.\n\n# Single line comments are simple. Anything coming after\
    \ two forward slashes is commented out of the program:\n\n```\nclass SomeClass\
    \ {\n  // this is a comment\n  int field = 1; // this is also a comment\n}\n```\n\
    \nMulti-line comments are easy too. You put two asterisks between two forward\
    \ slashes and then anything in between is commented out:\n\n```\nclass SomeClass\
    \ {\n  /*This is\n  a multi-line\n  comment*/\n\n  /*\n  *You can do*\n  *this\
    \ too *\n  */\n}\n```"
  merge: -1
