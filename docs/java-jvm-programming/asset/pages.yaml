  md: 'As mentioned in the class components section, there are seven things, known
    as the class members, that you can put inside of your classes. They are:


    +   - classes

    - interfaces

    - fields

    - methods

    - static initialization code blocks

    - instance initialization code blocks

    - constructors


    Except for the two types of initialization blocks, these components are all tagged
    with their own personal level of access restriction. That means five of the class
    components have access restriction:


    +   - classes

    - interfaces

    - fields

    - methods

    - constructors


    There are four possible access restriction levels for these components. Three
    are indicated by typing a special keyword into your source code, and one is the
    default level of access restriction, which is indicated by not having a keyword:


    +   - public

    - protected

    - default (no keyword)

    - private


    Access restriction is actually mandatory for all five class members, meaning that
    every class component in every class that you ever make has some level of access
    restriction. The reason why this isn''t obvious in the source code is because
    the default access level does not have a keyword associated with it, so if you
    simply ignore access restrictions, your code will still work because the JVM is
    automatically assigning your variables to the default access restriction.


    With five class components and four access restriction levels, there are a finite
    number of combinations of these:'
