  md: 'You should now have a pretty good understanding of how different types of primitive
    data are dealt with by JVM. I think there are two main points to understand about
    Java primitive data.


    First, that the overall strategy for creating and assigning values to variables
    is the same for all primitive types, namely pushing the value onto the operand
    stack, moving it to the location of the field or local variable, wherever that
    is in JVM''s memory.


    And second, that the specific opcode used to push the primitive value onto the
    operand stack within JVM actually depends on what that value is, which is surprising.
    It appears that JVM has special single-byte opcodes that are used to push simple
    values that are used often by programmers, like -1, 0, and 1. But for larger or
    more complicated values, presumably slower opcodes are used for those more complex
    values.


    We''re not quite done with Java''s value types yet, because we still have to cover
    the reference types, but hang in there, it''s not too much longer before finishing
    this chapter.'
