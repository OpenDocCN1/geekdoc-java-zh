    The first byte is 0x0A, which has the decimal value 10, indicating this is a Methodref
    entry, which has a total size of 5 bytes, mentioned just above.


    The next two bytes are 0x00_02, decimal value = 2, pointing to the constant pool
    entry #2, which should be a class name.


    The final two bytes are 0x00_03, decimal value = 3, pointing to constant pool
    entry #3, which should have name and type information. So taken together, this
    Methodref entry combines the class, name, and type information of a method found
    in the Empty class.'
