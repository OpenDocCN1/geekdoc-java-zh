    \n```\nclass OuterClass {\n  interface Interface {\n    // method signatures\n\
    \  }\n}\n```\n\nAt least when starting out with Java, I would recommend avoiding\
    \ nested classes and nested interfaces. They are probably useful in some specific\
    \ situations, like increased code security, but they add a"
