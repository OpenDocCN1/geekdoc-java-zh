  md: 'Here is a breakdown by data type of where JVM stores data:


    | Class Templates | MethodArea |

    | Constant Pool | MethodArea |

    | Class (static) Fields | MethodArea |

    | Class (static) Methods | MethodArea |


    | Class Instance Objects | HeapArea |

    | Instance (non-static) Fields | HeapArea |

    | Instance (non-static) Methods | HeapArea |

    | Instance (non-static) Constructors | HeapArea |


    | Method Parameters | ThreadArea\n-->Local Variables |

    | Method Variables | ThreadArea\n-->Local Variables |


    Note that for methods, it is the template of the method that is stored in the
    MethodArea (class methods) or HeapArea (instance methods). When a method of either
    kind is actually invoked, a new frame is created in the ThreadArea that holds
    all the variables and opcode instructions in that method. The JVM then uses the
    data stored in the ThreadArea frame to actually execute instructions.'
