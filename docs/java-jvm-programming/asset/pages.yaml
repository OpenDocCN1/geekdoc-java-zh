    access flags (static).


    When used with fields or methods, the static keyword tells the JVM that these
    are class fields and class methods, and that they should be stored in the so-called
    MethodArea of the JVM memory. The JVM memory layout will be discussed more later,
    but in brief the MethodArea memory is a storage area that every JVM execution
    can access. So it can be thought of as a shared, global, memory area.


    A second change that occurred in the .class file as a result of adding a class
    field is added to the class''s methods table. The name of this method is <clinit>,
    seen in constant pool entry #I7, although in the jav method summary description,
    the <clinit>'
