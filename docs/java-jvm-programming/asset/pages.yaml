  md: 'And you can see that all you need to do to access the class field of ClassOne
    is to write the word ClassOne in your source code, and then put the period afterwards,
    which tells JVM that you want to access a member of that class. JVM is smart enough
    to know that ClassOne is not an instance object, rather it is stored as a template
    in MethodArea memory.


    # (B) References to Objects


    Objects stored in HeapArea memory can be referenced by creating a variable that
    stores a memory address pointer to the object. The variable must be declared with
    the same type or a superclass type of the object itself. The address stored in
    the variable is unfortunately not visible to you, the programmer, so you have
    to trust that the JVM is doing the right thing. I think the reason why the actual
    memory address is not visible is it changes over the course of program execution,
    due to JVM cleaning up and rearranging its HeapArea memory to free up more space
    as needed. In any case, the result of having a variable that points to an object
    is that you can type the variable''s name in source code to tell JVM that you
    want to access the object''s data structure. The JVM will understand that you
    are accessing the object data by reference, and will point your code to the correct
    object in HeapArea memory.


    The creation of a HeapArea object is always a result of Java''s new keyword. The
    new keyword causes the execution of a JVM opcode that:


    +   - creates a new HeapArea object,

    - initializes it with default values, then

    - returns a memory pointer to the object it just made.


    The memory pointer is then stored in the field or local variable that you declared.
    And this is the reason why typing the name of that field or variable in source
    code allows you to access the data structure object.


    In source code these things are all accomplished with one line of code. This line
    of code can be broken down into three main sections:


    +   - object creation, initialization, pointer return'
