- img_proc: true
  md: 'I feel like this topic is not explained very clearly in the Java Language Specification,
    so I wanted to add this section to show how Exceptions and Error are represented
    in the .class files. I think looking at the class file information makes this
    topic much easier to understand.


    First of all, what are Exceptions and Errors? In a general sense, these are simply
    problems that the computer encounters while executing your program. For example,
    if you try to divide a number by zero, the computer will generate an error message
    telling you it can''t store the number infinite as an integer data type, or something
    like that. Other errors might be trying to open a file that doesn''t exist, or
    opening a network connection to a website that is not accepting connections. There
    are many more types of problems that can occur too.


    Unlike some programming languages, which may just exit your program or crash,
    Java allows you to handle errors that your program encounters within your source
    code! I don''t know how this is possible, but it is likely because your program
    is being run in a simulated computer, the JVM, so there is some amount of meta-control
    over the execution of your program. In other words, the JVM is probably built
    in such a way that it is able to observe and detect when your program encounters
    a problem.


    The system that Java uses to handle these problems is all based around three concepts:


    +   * Throwable class

    * try{\70} / catch{\70} source code commands

    * JVM opcode hopping


    **Throwable** is the name of a Java class that comes preinstalled with Java. The
    class is part of the java.lang package, which is the base package that is automatically
    imported into every class that you write. Either the Throwable class itself or
    some other class that inherits Throwable is required for use in the try{\70} /
    catch{\70} construct.


    The **try and catch** code blocks are used in source code. If you have a piece
    of source code that might fail, like trying to divide by zero for example, you
    put that code inside the try{\70} code block. Immediately after the try{\70} block,
    you write the catch{\70} block, with a parameter passed to catch having the data
    type of Throwable or some subclass.'
  merge: -1
  pgno: 202
- img_proc: true
  md: "The reason for the try/catch construct is that the compiled .class file will\
    \ mark all the opcodes within the try block as needing to be watched over by the\
    \ JVM, in case it throws an error. If there is an error, the JVM will look at\
    \ the catch block to see if the particular subtype of the error matches one of\
    \ the types passed into the catch block. If the error matches the catch block\
    \ parameter's type, then JVM hops to the opcode in that particular catch block\
    \ and restarts program execution.\n\nHere is an example. Notice how I put the\
    \ suspicious code inside the try{} block. Also notice that I used the top-most\
    \ level class that Java has, i.e. Throwable, instead of any one of the more specific\
    \ subclasses. This makes it so that any kind of error occurring within the try\
    \ block results in JVM's program execution to jump, or hop, into that catch block:\n\
    \n```\nclass ClassName\n{\n    static public void main(String[] args) {\n    \
    \    try {\n            int x = 1/0;\n        }\n        catch(Throwable e) {\n\
    \            System.out.println(\"catch\");\n        }\n    }\n}\n```\n\nHere\
    \ is the relevant portion of the javap output, showing the method main():\n\n\
    ```\npublic static void main(java.lang.String[])V\ndescriptor: ([Ljava/lang/String;)V\n\
    flags: (0x0009) ACC_PUBLIC, ACC_STATIC\nCode:\nstack=2, locals=2, args_size=1\n\
    0: icon_1\n1: icon_0\n2: idiv\n3: istore_1\n4: goto\n7: astore_1      16\n8: getstatic\
    \     #9 // Field java/lang/System.out:Ljava/io/PrintStream;\n11: ldc        \
    \     #15 // String catch\n13: invokevirtual #17 // Method java/io/PrintStream.println:(Ljava/lang/String;)V\n\
    16: return\nException table:\n```\n\n![](img/c8857ea016f1259bfbfe6939f1314dc2_203_0.png)"
