- img_proc: true
  md: "interface, you simply write the name of the interface in your source code file:\n\
    \n```\n// declare an interface\ninterface InterfaceName\n{\n  void interfaceMethod()\n\
    }\n```\n\n```\n// class that uses the interface\nclass SomeClass inherits InterfaceName\n\
    {\n  void interfaceMethod() {\n    System.out.println(\"howdy partner!\");\n \
    \ }\n}\n```\n\nSo you can see that there is no need to declare a variable having\
    \ the data type of the interface, you just need to write the name of the interface\
    \ directly in your source code file and JVM know how to find it and access the\
    \ data structure associated with that name.\n\n(A.2) Class Templates Class templates\
    \ work the same. You don't need to declare a variable to hold the memory pointer\
    \ to a class template, you just need to write the name of the class itself in\
    \ source code and JVM can find it. For example, if you want to access a static\
    \ class field, which is defined in the class template data structure in MethodArea\
    \ memory, then you just have to write the name of the class, followed by a period,\
    \ which is the way JVM knows that you want to access a member of that class:\n\
    \n```\n// class with a static class field\nclass ClassOne\n{\n  static int classField\
    \ = 5;\n}\n```\n\n```\n// class that references the first class\nclass ClassTwo\n\
    {\n  static public void main(String[] str) {\n    System.out.println(ClassOne.classField);\n\
    \  }\n}\n```"
