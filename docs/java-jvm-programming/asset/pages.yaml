  md: 'A few years ago, Java was updated in a major way by adding a completely new
    concept called modules. The reason why this concept was added to Java is because
    previous versions of Java didn''t have any way to block access to entire packages
    of classes. Of course, it was always possible to label each class in a package
    as default access, meaning it could not be used by classes from outside packages.
    But this system didn''t account for the fact that a class might be needed by only
    some outside packages, but not all.


    In other words, classes marked non-public were inaccessible to any and all outside
    packages. Conversely, if you wanted a single outside package to have access to
    your class, then you had to mark it as a public class, and then every class in
    all of Java had access to your class, not just the one you had in mind. Therefore,
    a new system was added that can grant permission for the use of specific packages
    to some, but not all, other packages.


    Another way to conceptualize modules is to think of it as just one more barrier
    to access a class''s members, one that sits above the class level:


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_132_0.png)'
  merge: -1
  pgno: 132
- img_proc: true
  md: 'A more realistic diagram would show that there are several different packages
    within a module, and also that there are multiple classes within a package:


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_133_0.png)


    Which is all just to show you that several layered types of access restriction
    exist in Java. Modules is just one more way to do access restriction in addition
    to packages, class access modifiers, and member access modifiers.'
  merge: -1
