  pgno: 203
- img_proc: true
  md: 'For this main() method, there are two attributes. The Code attribute contains
    the method''s opcodes. The Exception Table attribute contains a list of table
    entries that give instructions to the JVM where to hop if there is a problem during
    execution of the opcodes.


    The first thing to point out is which opcodes correlate with which lines in source
    code:


    Reading the try{} block, you can see that all the source code contained in the
    try is located in opcode indexes 0 - 4, inclusive. The iconst_1 and iconst_0 opcodes
    load the values 1 and 0 onto the operand stack. The divid pops those two values,
    divides them, and pushes the result onto the operand stack. The istore_1 command
    pops the quotient, and moves it into the second slot in the local variable array.
    Finally, the goto 1 command tells the JVM that the next opcode executed should
    be the one at index 16, the return opcode, instead of continuing on the opcode
    at byte 7.


    Notice that these five opcodes, index 0 - 4, are also listed in the Exception
    Table attribute. This means that the .class file is telling JVM to be on the lookout
    for any exception problems that occur in any of these five opcodes. You will also
    notice the number 7 on the same line, listed as the target. This means that if
    the JVM detects an error during these five opcodes, then it will jump to the opcode
    instruction located at the opcode by byte index 16 as would occur if there were
    no error. Finally, you can see that this table entry in the Exception Table also
    notes the type of error that would result in the JVM hopping to that target 7
    opcode, which is the Throwable, written as the parameter in the catch(){} statement
    in source code.


    So if there is any error encountered by the watchful eye of the JVM during any
    of the opcodes labeled 0 - 4, i.e the source code within the try statement, then
    the JVM will transfer program execution to the opcode at index 7, which is the
    istore_1 opcode, and continue program execution from there.


    What is this istore_1 opcode? It stores an address pointer passed into the parameter
    of the catch() block, which is an object of class Throwable in this case. The
    next three opcodes,'
