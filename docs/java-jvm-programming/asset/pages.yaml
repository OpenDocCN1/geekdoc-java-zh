  md: 'Earlier in this book when we dissected the .class file, you may have noticed
    a section of the class file referred to access flags. This is the two byte section
    immediately following constant pool entries, and the flags it contains are each
    one. Every bit has a different meaning, and the very last bit on the right is
    called the public flag. This bit is set to 1 if you declare the class to be a
    public class, and it is set to the default 0 if you don''t. But what does it mean
    for a class to be public or non-public?


    In short, a public class can be used by code in a package that is different from
    the package your public class is. And a non-public (default) class can only be
    used by code that is labeled as part of the same package. We will cover packages
    much later, but basically they are a way to arbitrarily group classes together.
    Every class in Java is part of a package, whether you explicitly declare it or
    not. You explicitly declare a class to be part of a package by putting the keyword
    package plus the package name in front of your class''s source code. If you don''t
    explicitly declare a package for your class, then the JVM will automatically create
    a package for you and put your class in without telling you.


    Now about class-level restriction, let''s first look at a default access (package-private)
    class by writing one in Java source code. We will also explicitly declare this
    class''s package, since every Java class is required to be inside a package, and
    we might as well be clear about it:


    package testpackage;


    ```

    class DefaultAccessClass {

    }

    ```


    This class has default access restriction, meaning it can only be used by other
    classes in the testpackage package. The javap output for this class is:


    ```

    class DefaultAccessClass

    minor version: 0

    major version: 60

    flags: (0x0020) ACC_SUPER

    this_class: #7 // DefaultAccessClass

    super_class: #2 // java/lang/Object

    interfaces: 0, fields: 0, methods: 1, attributes: 1

    Constant pool:

    #1 = Methodref #2.#3 // java/lang/Object.\<init>():V

    #2 = Class #4 // java/lang/Object

    ```'
