    01 01 05 45 6D 62 75 74 79 01 00 04 63 64 65 52 01 00 04 6D 69 6E

    6E 65 75 6D 01 58 64 6A 71 21 2F 6C 61 67 29 69 69 63 01 00 00 001n01 01 26 28
    5B 64 6A 61 21 61 6C 61 67 4F 53 74 72 69

