- img_proc: true
  md: 'Now, each in the list of constant pool entries has its own byte-format, as
    the entries themselves will change size depending on what they hold. There are
    only 17 unique types of constant pool entries, which isn''t many, but we will
    only discuss the particular types present in this class for now. The important
    thing to know about the constant pool entries is that the first byte of every
    entry tells you what it is, and then you can look up the format for that particular
    entry.


    The type of the first constant pool entry is the hexadecimal value 00A, which
    is equivalent to the decimal value 10:


    ```

    CA FE BA BE 00 00 00 3C 69 76 01 0F 8A 00 02 00 03 07 00 04 0C 00

    05 00 06 01 00 6A 61 72 2F 6C 65 61 67 2F 4F 62 6A 65

    73 74 01 00 06 69 6E 74 3E 01 22 28 59 00 56 07 08

    01 00 05 45 63 70 74 79 01 00 04 65 65 01 01 00 61 61 09 0F 4C 69

    65 45 75 65 72 54 62 75 61 61 65 65 01 00 04 64 61 69 6E

    01 00 16 28 58 54 6A 61 71 71 2F 6C 61 61 27 53 74 72 79 69

    66 37 39 29 50 00 03 73 75 75 63 65 65 01 01 08 00

    05 6D 70 70 79 29 2E 05 75 75 07 02 02 00 00 n0

    00 00 02 00 00 00 06 01 01 00 00 01 00 01 01 01 01 01

    01 00 00 00 05 01 01 01 01 00 00 00 00 01 00 00 00 00 10

    00 00 01 00 00 00 01 01 01 00 00 00 00 00 00 00

    01 00 00 00 00 01 00 00 00 00 00 00 02 0E

    ```


    Entry type #10 is a Methodref type


    ```

    u1 tag;

    u2 class_index;

    u2 name_and_type_index;

    }

    ```


    Which shows that the first byte is the ID, the next two bytes hold the number
    of other constant pool entry, and that entry will have the ID of class. These
    two entries are reference to the constant pool table, and this entry should be
    a name_and_type entry. This constant pool entry contains numbers that point to
    other constant pool entries. Therefore, the total number of bytes in this Methodref
    constant pool entry is 5, so we know how many bytes in the hex file are associated
    with this entry:'
  merge: -1
  pgno: 11
