  md: 'It turns out that adding static to a class component does not affect its access
    restriction level in any way. Static fields are still declared within a class,
    and the class is still part of a package. So the same access restrictions apply
    to static fields just as they do to non-static fields.


    The only thing that the static keyword changes is the ability of that member to
    be accessed from other code that is marked as non-static. You will see this error
    message frequently in Java, and it is because the Java compiler is built to look
    for any MethodArea (static) methods, fields, etc., that is trying to access HeapArea
    (non-static) things. Java simply flags this as a potential problem and your file
    will not compile.


    So static can restrict access to code in some cases, namely that static code can''t
    use non-static code. However, this fact does not change the four keywords of the
    access restriction system in any way. They are two independent systems.


    Now let''s examine each of the four levels of access restriction to see how they
    operate (next page):'
