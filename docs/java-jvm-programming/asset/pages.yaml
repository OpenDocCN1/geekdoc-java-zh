    This concludes the section on Java''s data types. It is a long section, but knowing
    what types of data you can store in your Java programs and how to access them
    is critical to any program.


    Your computer program, and your computer itself, really just does two things:
    store information and manipulate information. This section covers the first thing
    that your program does. The next section, which focuses on methods, deals with
    the second thing.


    Of course, you can write expressions in your source code anywhere, and these will
    be evaluated by the JVM. So manipulating information doesn''t take place only
    inside methods. However, most of the opcodes that your programs will execute are
    probably coming from inside methods, so a simplified way to think about your Java
    programs is:


    Fields source data.


    Methods manipulate fields.'
