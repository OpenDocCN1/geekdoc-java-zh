  md: "The fourth constant pool entry has an ID of 0x01 (0d1), which is the ID for\
    \ the UTF8 entry. The byte format for a UTF8 entry is:\n\n```\nCONSTANT_Utf8_info\
    \ {\n  u1 tag;\n  u2 length;\n  u1 bytes[length];\n}\n```\n\nSo this pool entry\
    \ contains a string, and you can see the constant pool entry ID as the first byte:\n\
    \nCA FE BA BE 00 00 3C 00 0F 0A 00 02 00 03 07 00 04 0C 00\n05 06 00 01 00 10\
    \ 61 76 61 2F 6C 61 6E 67 2F 4F 42 6A 65\n63 74 01 00 01 06 3C 69 6E 74 3E 01\
    \ 00 01 03 28 29 56 07 00 08\n01 01 05 45 6D 70 74 79 01 00 04 43 6F 64 65 01\
    \ 01 0F 4C 69\n6E 45 74 65 6D 72 75 74 61 61 65 65 01 00 00 04 61 69 69 69\n01\
    \ 01 28 58 5C 4C 61 71 61 61 6F 6C 61 6E 67 2F 7F 74 72 69\n6E 67 3B 29 56 01\
    \ 00 0A 53 6F 75 72 63 63 45 46 69 6C 65 01 00\n0A 45 63 74 79 02 6E 71 66 01\
    \ 00 20 07 00 02 00 00 00\n0\n00 02 00 00 00 05 00 00 06 01 00 09 00 00 00 1D\
    \ 00 01 00\n01 00 00 00 05 2A B7 00 01 B1 00 00 01 01 00 00 00 00 00\n01 00 00\
    \ 00 05 01 00 09 00 00 01 00 00 00 00 00 00 n01 00 00 00 01 01 00 00 00 00 00\
    \ 00 00 00 00 00 00 00 00  00 00 00  0 00  00 00 00 00 00 0  0  0 00 00 00 02\
    \ 0E\n\nThe two bytes after the initial ID byte give the length, in number of\
    \ bytes, of string. These two length-indicating bytes are 0x00_, which is decimal:\
    \ 16\n\nTherefore the following sixteen bytes contain the UTF8 string information:"
