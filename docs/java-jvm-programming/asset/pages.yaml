  md: "lot of complexity, and they are never required for a program to function correctly.\n\
    \nFields Next are fields, which we have seen before. Fields that are declared\
    \ with the static keyword are known as class fields, because they are created\
    \ and initialized when the class template is loaded in the MethodArea memory.\
    \ Fields declared without the static keyword are known as instance fields, and\
    \ they are created and initialized when a class copy is made in the HeapArea memory.\
    \ The source code for fields looks like this:\n\n```\nclass OuterClass\n{\n  \
    \  static boolean classField = true;\n    boolean instanceField = true;\n}\n```\n\
    \nMethods can be declared as either static or non-static as well. Although methods\
    \ are not initialized with a value after they are loaded into memory like fields,\
    \ they are still loaded into memory somewhere. Class methods are stored in MethodArea\
    \ memory, and they are created as soon as their class template is loaded into\
    \ MethodArea memory. Thus they can be called by referencing the class template\
    \ itself. Instance methods are stored in HeapArea memory, and they are created\
    \ when a new class instance copy is loaded into HeapArea memory. Thus, instance\
    \ methods must be called by referencing the address of a class instance. Methods\
    \ are written into classes like so:\n\n```\nclass OuterClass\n{\n    static void\
    \ className()\n    {\n        //\n    void instanceMethod()\n    {\n    }\n```\n\
    \nThe previous four components: nested classes, nested interfaces, fields, and\
    \ methods; are special because they all can be inherited by subclasses. The remaining\
    \ three structures, explained next, cannot be inherited by subclasses."
