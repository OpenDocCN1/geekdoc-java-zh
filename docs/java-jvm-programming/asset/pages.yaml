- img_proc: true
  md: 'There are a total of twelve unique types of variables that you can use to store
    data in Java. They are usually grouped into two main categories, **primitive**
    and **reference**.


    # Primitive Types


    **Primitive** data is stored in fields and local variables directly as bits, and
    Java has special keywords that you can use to create, store, and operate on primitive
    types of data. The primitive data types are:


    +   - boolean

    - char

    - byte

    - short

    - int

    - long

    - float

    - double


    These are discussed in more detail on the following pages:'
  merge: -1
  pgno: 148
- img_proc: true
  md: "Boolean data can be thought of as the values of a single bit, 1 or 0, ON or\
    \ OFF. Interestingly, inside the JVM the boolean is actually stored as a 32 bit\
    \ chunk, but for all practical Java programming you can treat it like a single\
    \ bit.\n\nLet's take a look at how the boolean primitive is handled by the JVM,\
    \ by using the javap command to examine the .class file of a simple class:\n\n\
    ```\nclass ClassName\n  static boolean instField = true;\n}\n```\n\nI've written\
    \ a very simple class that has one static field of the primitive boolean type.\
    \ Of course, the JVM secretly adds the instance constructor method <init>, also\
    \ called ClassName() in the javap output. And because the boolean field is static,\
    \ JVM secretly adds the static initialization block <clinit>, since I set the\
    \ value of the boolean variable in the source code. Below is the javap output\
    \ for this class:\n\n```\nclass ClassName\nminor version: 0\nmajor version: 50\n\
    flags: (0x020) ACC_SUPER\nthis_class: #8 // ClassName\nsuper_class: #2 // java/lang/Object\n\
    interfaces: 0\n```"
  merge: -1
  pgno: 149
- img_proc: true
  md: "```\nClassName():\ndescriptor: (V)\nflags: (0x0000)\nCode:\nstack=1, locals=1,\
    \ args_size=1\n0: aload_0\n1: invokespecial #1    // Method java/lang/Object.\"\
    <init>\":V\n4: return\nLineNumberTable:\n line 1: 0\n```\n\n```\nstatic {};\n\
    descriptor: (V)\nflags: (0x0008) ACC_STATIC\nCode:\nstack=1, locals=0, args_size=0\n\
    0: const_1\n1: putstatic #7    // Field field:Z\n4: return\nLineNumberTable:\n\
    \ line 3: 0\n```\n\nSourceFile: \"ClassName.java\"\n\nThe static boolean field\
    \ is listed as the only field, just after the constant pool. The entry tells you\
    \ the name, data type, and any flags set for this field.\n\nIn the source code,\
    \ a value is assigned to this static boolean field, and this is reflected in the\
    \ .class file by the fact that the static initialization block, which is in fact\
    \ turned into a method in the .class file, has some opcode instructions that do\
    \ the assignment. Let's step through the opcodes so you can see how it works:\n\
    \nThe first opcode is const_1. This opcode is one byte in size, and it pushes\
    \ an integer value of 1 onto the method frame's operand stack.\n\n![](img/c8857ea016f1259bfbfe6939f1314dc2_150_0.png)"
  merge: -1
  pgno: 150
- img_proc: true
  md: 'The second opcode is **putstatic #7**. This command is three bytes in size.
    The first byte is the putstatic opcode, and the next two bytes are a pointer to
    the constant pool entry #7, ClassName.field:Z, which tells the location where
    the static boolean field resides in JVM memory. This putstatic command also uses
    the top value on the operand stack, which is now 1 after the previous opcode,
    and transfers it to the variable indicated by the constant pool reference. In
    summary, the putstatic command takes the value off the top of the operand stack,
    which is 1, and moves it into the memory location pointed at by the constant pool
    reference, ClassName.field:Z, which was given by the two bytes immediately following
    the putstatic opcode.


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_151_0.png)


    The third opcode is **return**. This command is one byte long, and it is the command
    to return void, meaning no actual return value, from a method. This is the final
    opcode in the <clinit> static initialization block, and it returns program execution
    control to whatever code that called this method in the first place.'
