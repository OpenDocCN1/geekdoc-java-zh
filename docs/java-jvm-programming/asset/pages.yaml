    The bytes are 0x00_02 (0d2), pointing to the 2nd pool entry:


    CA FE BA BE 00 00 3C 00 0F 0A 00 02 03 07 07 04 0C 0C

    05 00 06 01 00 10 6A 71 61 2F 6C 61 6E 67 2F 4F 62 6A 65

    63 74 01 01 00 63 69 6E 79 74 3E 01 00 23 28 59 56 07 00 08

    01 01 05 45 6D 70 74 01 01 00 04 43 64 65 05 01 00 04 0F 4F 4C 4C

    6E 45 45 75 62 62 62 51 61 65 01 01 00 04 61 69 69

