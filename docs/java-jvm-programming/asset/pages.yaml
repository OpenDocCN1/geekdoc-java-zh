  md: '# Organizing Classes into Packages'
  merge: -1
  pgno: 119
- img_proc: true
  md: 'The fundamental unit of Java coding is the class. All of the data and all of
    the operations that you want to include in your programs go inside of Java''s
    classes. The compilation of .java source code is discretized into .class compilation
    units, where each compilation is either a class or an interface (which is basically
    a special subtype of class). And the Java Virtual Machine operates on units of
    classes, because it loads information into its memory .class file at a time.


    One problem that comes up with classes however is that you can make an infinite
    number of them, which may or may have the same name. Anyone in the world can create
    a Java class, so if there is any sharing of Java classes over the internet, and
    of course there, there would have to be some central database or naming authority
    so to prevent people from making classes with the same names.


    But Java does not have a central naming authority. Instead, Java has a system
    called packages that groups classes together underneath the package name. This
    system essentially makes the name of a class longer, because the class name includes
    its package name. This packagename +man is known as the fully qualified name of
    the class, and these fully qualified names are how JVM searches for and finds
    classes.


    Appending the package name in front of the class does not 100 % solve the problem
    of identical class names, since two people could also use the same package name,
    but it does make the issue of overlapping names less likely to occur. In fact,
    Java makes the recommendation that people give their package the same name as
    their organization or company, because organizations tend to have unique names.


    Packages are so important to Java that it is mandatory for every class to be part
    of a package.


    If you don''t write your class''s package name into source code, then when you
    run your .class file with JVM, the JVM will automatically create a package for
    you and add your class to it without letting you know. JVM''s choice of package
    name is something arbitrary, unnamedpackage, but the point is that your class
    must be associated with a package in order to be used by JVM.'
  merge: -1
  pgno: 120
- img_proc: true
  md: 'Because package affiliation is required by the JVM, I recommend explicitly
    declaring your class''s package in its source code file. Way it is clear that
    your class is indeed part of a package, as it must be. Another benefit of explicitly
    placing your class inside a package is that you will become more familiar with
    how Java packages work in general, and this will come handy if you do any professional
    Java coding, making Android apps, because the classes you use when writing those
    apps are all part of package hierarchy developed by a third party.


    To explicitly declare your own class to be part of a package, all you have to
    do is type the package''s name into your source code file after the keyword package.
    This package declaration is usually put at the very top of the source code file,
    like so:


    ```

    package pkg;


    class myClass

    {

    ```


    The name of the package itself is completely arbitrary, so you can write anything.
    There is no master list of allowed package names. The reason this works is because
    by writing the package''s name after the package keyword in source code, the JVM
    sees this and simply assumes that a package of this name now exists and is valid.


    The package name is not simply a piece of information that is used by the JVM
    to help find your class however. It also affects your computer''s file system
    directly, because your class will be stored within a file folder that has the
    same name as the package. In fact, when you run the javac compiler to convert
    your .java source code into .class files, the compiler will automatically create
    a new folder hierarchy that reflects your package name.


    Technically, the data structure that holds a package''s classes could be some
    type of database, like a compressed ZIP file, as well as a regular computer file
    system, but if you are writing Java classes on your personal computer, the .class
    files you make with the javac compiler will be put in your computer''s regular
    folder structure on your hard drive.'
  merge: -1
  pgno: 121
- img_proc: true
  md: "As mentioned, a folder hierarchy on your hard drive is created automatically\
    \ when you run the Java compiler. The new folder will have the same name as your\
    \ package name.\n\nThe way this works is when the compiler reads your .java source\
    \ file, it will see that you have declared the class part of a package, and it\
    \ gets the package name. Now it knows the name of the new folder it must make,\
    \ and in this folder will go the .class file. One piece of information is needed\
    \ by the compiler before it this, which is that you must tell java where on your\
    \ hard drive to create the package folder hierarchy. You can do this by adding\
    \ the \"-d folderpath\" option when running the javac compiler at the command\
    \ prompt. The compiler will then create a new folder at the hard drive location\
    \ folderpath/classname, and deposit the .class file inside.\n\nThis is a bit confusing,\
    \ so let's go through a simple example. Here is a java class, written in Java\
    \ source code, with its package explicitly defined. It is the same one as\n\n\
    ```\n//myClass.java\npackage pkg;\n\nclass myClass\n{}\n```\n\nNow you need to\
    \ use the javac compiler to convert the .java source code file into a .class file.\
    \ So you could write the command:\n\n```\njavac C:/sourcepath/myClass.java\n```\n\
    \nWhere \"C:/sourcepath/\" is the path to the folder where you saved the myClass.java\
    \ file. This command does work and will make the class file, unfortunately it\
    \ saves the .class file in the same folder as the .java file, and also it doesn't\
    \ create the package folder hierarchy. This is a problem, because the package\
    \ folders are required by JVM in order to find the .class file. Therefore, you\
    \ must add the \"-d c:/depositpath/\" option to the javac command to tell the\
    \ compiler where to create the package folder and compiled .class file. The compiler\
    \ now looks like this: \n\n```\njavac -d c:/depositpath/ c:/sourcepath/myClass.java\n\
    ```"
