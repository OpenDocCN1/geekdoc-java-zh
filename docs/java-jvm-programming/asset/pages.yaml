    SourceFile: "ClassName.java"


    You can see the method() information in the ClassFile output of javap, and that
    this method will execute three opcodes. Let''s walk through these opcodes:


    The first opcode is **const_0**. Similar to the istore_1 opcode from above, this
    opcode does the thing, which is to load a value onto the top of the operand stack
    of the method''s frame. This time however, instead of loading the value of one,
    0x00000001, the const_0 command loads the value of zero, 0x00000000. This is because
    in the source code the boolean local variable is being assigned the value of false,
    which is represented by the integer zero in JVM.


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_153_0.png)


    The second opcode is **istore_1**. This opcode is used to store a value into the
    local variable array of the method frame. The local variable array is indexed
    starting at 0, so this command stores value into the second entry, at index 1,
    of the local variable array. The value transferred into the array is whatever
    value is at the top of the frame''s operand stack. In this case, this top value
    of the operand stack is 0, which was put there by the previous opcode, const_0.'
