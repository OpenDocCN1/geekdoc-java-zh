  md: 'Now when you run the compiler like this, it creates a new folder within the
    depositpath that has the same name as the class''s package. Then it puts the .class
    file inside the folder with the package name.


    Let''s look at a cartoon of this process.


    **Step 1:** You write a .java source file and save it on the C: drive in the folder
    called source/. Your class declares itself part of a package called pkg.


