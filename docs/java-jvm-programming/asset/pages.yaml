    The opcode instructions are the instructions that will be executed by the JVM
    when the method gets.


    These JVM instructions are the magic of JVM. Your source code programming is always
    converted by the compiler into the .class format, regardless of which platform
    you are using, be it Windows, Mac, or Linux.


    The JVM is itself a software, but is specific for particular platforms, meaning
    there is a Windows version, and Mac version, and a Linux version of the JVM. However,
    each JVM program, can read the opcode instructions in the .class file.


    So in theory you could copy any .class data from a Java program compiled on Windows,
    and run it unchanged on Mac. The JVM opcodes will be identical. This is the central
    idea Java''s of the intermediate virtual computer, the JVM.'
