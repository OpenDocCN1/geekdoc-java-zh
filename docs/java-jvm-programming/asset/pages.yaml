    Pool entry #1 is a methodref, which points to entries that

    contain the relevant information. So pool entry #1 has the value

    "java/lang/Object.<init>()", where the dot and colon are added by

    JVM. This text string identifies a class (java/lang/Object), a method

    name (<init>), and a method signature (V), which is all the

    information needed for JVM to find and execute the method.


    ..


    You might be wondering why JVM is running the <init> method from a

    Java class object?


    The reason is because every class in Java must inherit from some

    other class, even if you don''t write this in your source code file.


    If you don''t explicitly write in your source code that your class

    herits from another class, then JVM will automatically make your

    class inherit from the top Java class called Object.


    This automatic addition of class inheritance is all done behind the

    curtain, so your code will still work even though you didn''t explicitly

    include class inheritance in your source code.'
