    \    * public interface I {}\n    * protected interface I {}\n    * default interface\
    \ I {}\n    * private interface I {}\n\n+   * Field\n    * public boolean boolField;\n\
    \    * protected boolean boolField;\n    * default boolean boolField;\n    * private\
    \ boolean boolField;\n\n+   * Method\n    * public void Method()\n    * protected\
    \ void Method()\n    * default void Method()\n    * private void Method()\n\n\
    +   * Constructor\n    * public ClassName()\n    * protected ClassName()\n   \
    \ * default ClassName()\n    * private ClassName()\n\nAt this point, you might\
    \ be wondering how the static keyword affects the access restriction system. Recall\
    \ that the static keyword can be associated with each of the five class components,\
    \ and its purpose is to tell the JVM to store that component in the MethodArea\
    \ memory, which is a shared, global memory location that is always present. Non-static\
    \ components are stored in the HeapArea memory, and they are only created when\
    \ a class instance or array object is made with the new keyword."
