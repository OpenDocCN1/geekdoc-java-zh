    \ #13 // field:[L;]\n    #11 = Utf #14 ClassName\n    #12 = Utf Code\n    #13\
    \ = Utf LineNumberTable\n    #14 = Utf <clinit>\n    #15 = Utf SourceFile\n  \
    \  #16 = Utf ClassName.java\n    #17 = Utf\n```\nstatic java.lang.String[] field;\n\
    descriptor: [Ljava/lang/String;\nflags: (0x0008) ACC_STATIC\n\nClassName();\n\
    descriptor: ()V\nflags: (0x0000)\nCode:\nstack:1, locals:1, args_size=1\n0: load_0\n\
    1: invokespecial #1 // Method java/lang/Object.\"<init>()V\n4: return\nLineNumberTable:\n\
    1: 0\n\n```\nstatic {};\ndescriptor: ()V\nflags: (0x0008) ACC_STATIC\nCode:\n\
    stack=1, locals=0, args_size=0\n0: bipush\n2: anewarray #7 // class java/lang/String\n\
    5: putstatic #9 // Field field:[L;]\n8: return\nSourceFile: \"ClassName.java\"\
    \n```\n\n你可以看到类字段的类型描述符 `[Ljava/lang/String;`。这看起来很复杂但实际上并不是。最左侧是方括号，表示这是一个一维数组。数组元素持有的数据类型是\
    \ `String`，它实际上是基于 `String` 模板的类对象的内存指针。JVM 以这种格式持有引用信息：“L” + 类名 + \";\"\n\n在这种情况下，由于数组元素中持有的数据类型是\
    \ `String`（即定义该数据结构的类），使用了该类的完全限定名。该名称是 `java.lang.String`，其中 `java.lang` 是包名，`String`\
    \ 是该包内定义的类名。JVM 在其内部表示类名时会将点替换为斜杠，但这就是它的样子。\n\n你应该能够理解操作码是如何创建这个持有地址指针的数组的：\n\n\
