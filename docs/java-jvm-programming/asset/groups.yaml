    # So what exactly is a module?


    It is a collection of packages and their classes, placed into the same folder,
    and with a special type of .java file called the module-info file. This special
    file must be located in the base folder of the module. It says which of the module''s
    packages are available to code in other modules. It also says which code from
    which other modules are required for its own classes to run properly.


    The basic structure of a module-info.java file is:


    ```

    module modulename // keyword + the name of the module

    exports package; // allow outside code to use this package

    requires module; // access code from another module

    ```


    module :: this is a Java source keyword, and it tells the compiler you are writing
    a module-info definition


    modulename :: this is the name of your module, it can be only letters, or a combination
    of letters and dots, but it is always treated as being a single word regardless
    of how many dots it has


    exports :: tells the JVM that module should allow other modules to access the
    classes in a particular package from this module


    package :: the name of the package that is visible to outside code


    requires :: tells the JVM that some classes within this module need access to
    code from another module in order to function properly


    module :: the name of the other module that contains the code required for this
    module


    A module has an organized file structure with packages and their classes, and
    its module-info.java file is in the root folder of the module. The root folder
    of the module should be named the same name as the module. This is what a module
    looks like on your hard drive:'
