    Pool entry #5 is a UTF-8 string, which holds the string "init". An <init> method
    can be called by the JVM in response to different code structures, the main idea
    is that an <init> method is called when a class instance object is first created
    in order to initialize its fields with values.


    The <init> method, as it is called in this .class file, is usually a result of
    a special type of method called the object constructor. A constructor is called
    only once in the lifetime of a class instance object, at the very start, because
    it is designed to initialize that object with any values it needs. This is the
    reason why this method is referred to as the <init> method within .class file.


    Object constructors are not regular methods. Although constructors can accept
    parameters within parentheses, they do not return any values. Regular methods
    can have a return value.'
