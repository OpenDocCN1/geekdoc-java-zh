    These two bytes represent the 16 bits:


    0000_0000_1000


    You can see that the sixth bit from the right is on. This "flag" happens to tell
    the JVM how it should invoke superclass, and it is always set to ON. All other
    flags are set to OFF. The rightmost bit happens to be the public/default access
    bit. A public class can be used by any other class, while a default (non-public)
    class can be used only within the same package. Access flags are discovered later.


    You can see all the flag bits in section 4.1 of the Java Virtual Specification:

    https://docs.oracle.com/javase/specs/jvm/se17/html/index.html


