    ## (B.1) Class Instance Objects\nLet's now look at an actual example of how you\
    \ can create a class object. The following source code declares two class templates,\
    \ and then it instantiates an object based on the first class, from within the\
    \ second class. The first class template simply holds a value in an instance field.\
    \ The second class template contains a main entry method and also creates an object\
    \ based on the first class:\n\n```java\n/**ClassOne.java**/\npackage pkg;\npublic\
    \ class ClassOne\n{\n    public int instanceField = 1;\n}\n```\n\n```java\n/**ClassTwo.java**/\n\
    package pkg;\nimport pkg.*;\nimport java.lang.*;\nclass ClassTwo\n{\n    public\
    \ static void main(String[] args) {\n        ClassOne objectName = new ClassOne();\n\
    \        System.out.println(objectName.instanceField);\n    }\n}\n```\n\nIn this\
    \ example, the ClassOne.java source code defines a class template for a class\
    \ that has one field. The ClassTwo.java file has the main entry method that the\
    \ JVM needs to start program execution, and in this method, the ClassOne template\
    \ is used to create a class instance object. After the ClassOne object is created,\
    \ the variable objectName that stores the memory address pointer to this newly\
    \ made Class object is held by the variable objectName, which is declared to have\
    \ a type that is the same as the object's template, ClassOne. Now that the reference\
    \ pointer is stored in objectName, a dot operator can be used to query members\
    \ from the object. In this case, the ClassOne object has a field, so the source\
    \ code keywords objectName.instanceField retrieve the value stored by the object's\
    \ field.\n\nHere is the javap output for the main() method of ClassTwo.java, which\
    \ is method where a new object of lang.type ClassOne is created:\n\n```\npublic\
    \ static void main(java.lang.String[])\ndescriptor: ([Ljava/lang/String;)V\nflags:\
    \ (0x0009) ACC_PUBLIC, ACC_STATIC\nstack=2, locals=2, args_size=1\n0: new #7 //\
    \ class pkg/ClassOne\n3: dup\n4: invokespecial #9 // Method pkg/ClassOne.<init>:()V\n\
    7: astore_1\n8: getstatic #10 // Field java/lang/System.out:java/io/PrintStream;\n\
    11: load_1\n12: getfield #16 // Field pkg/ClassOne.instanceField:I\n15: invokevirtual\
    \ #20 // Method java/io/PrintStream.println:(I)V\n18: return\nLineNumberTable:\n\
    line 8: 0\nline 9: 0\nline 10: 18\n```\n\nThe **new** is the first opcode in the\
    \ method. The **new** command creates a new instance of the type named in constant\
    \ pool entry #7, pkg.ClassOne, and afterwards it pushes a memory pointer to the\
    \ object onto the operand stack.\n\nThe **dup** command simply copies the value\
    \ on top of the operand stack and pushes that copy back onto the operand stack.\
    \ Now there are two memory pointers to the object on the operand stack.\n\nOnce\
    \ the object is made, the JVM calls the **invokespecial** command, which calls\
    \ the constructor method of the object pointed at by the memory pointer on top\
    \ of the operand stack, which is of course the pointer to the new object, and\
    \ **invokespecial** also takes the value held in the constant pool entry #9, which\
    \ is the new object's class type, the name of the constructor method `<init>`,\
    \ and the constructor's signature, which here is (V meaning there are no parameters\
    \ passed into the constructor and value returned.\n\nThe remaining opcodes, indexes\
    \ 7 through 15, are used to fetch the value of the new object's field, set up\
    \ the println() method, and then print the object field value to the console,\
    \ as you saw in the source code.\n\n## (B.2) Java Array Objects\nJava has a specially\
    \ designed, built-in system for creating arrays of values in your source code.\
    \ The system uses square brackets as special operators that help you create the\
    \ array and change its values. On the surface, Java arrays don't seem related\
    \ to class instances, but in fact these arrays are \"objects\" located in the\
    \ HeapArea of JVM's memory, just like class instance \"objects\" are. In source\
    \ code however, you don't have to bother about where the array is stored in memory,\
    \ because that's all taken care of the hood by the JVM.\n\nYou will likely use\
    \ Java's built-in array objects at some point when writing your projects, so while\
    \ we're talking about the address references to arrays, we should probably discuss\
    \ the actual function of arrays themselves as well. The first thing to understand\
    \ about arrays is that making an array object and assigning its memory pointer\
    \ to a variable is a three step process, just like class instance objects:\n\n\
    - use the new keyword to JVM create the array object in HeapArea memory and return\
    \ a memory pointer to this object\n- declare a variable with the same data type\
    \ as the array object you want to make\n- assign the memory pointer to the declared\
    \ variable with the assignment operator =\n\nThis is the source code looks like\
    \ to make a Java array:\n\n```java\nint[] objectName = new int[3]\n```\n\nThe\
    \ assignment operator is the equals sign, in the middle.\n\nTo the right of the\
    \ assignment operator is the new keyword, followed by the constructor of the integer\
    \ array object, int[ ]. The number 3 inside the square brackets tells JVM that\
    \ to store integer primitive numbers. Also, you can't see it in the source code,\
    \ but when JVM creates this integer array, it sets each slot in the array equal\
    \ to zero, initializing the array with default values.\n\nTo the left of the assignment\
    \ operator is the declaration of the variable and its type. Now, this portion\
    \ is different from creating an object based on a class template. These Java array\
    \ types are not normal class template names. The type of a Java array is the type\
    \ of the type that will be stored within the array, followed by one or more sets\
    \ of square brackets. For example:\n\n- int[]\n- char[][]\n- String[][][][]\n\n\
    These are all \"types\" of valid Java array objects.\n\nThe first is a 1-dimensional\
    \ array of integer primitive type values.\n\nThe second is a 1-dimensional array\
    \ of char[] types (analogous to a class template), and the char[] is a 1-dimensional\
    \ array of char types. So this is an array of array objects, and the inner array\
    \ holds char primitives.\n\nThe third is an array of type String[][][], which\
    \ holds objects of type String[][], which holds objects of type String[], which\
