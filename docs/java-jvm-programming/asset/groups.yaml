  - '[PAGE 87]


    The ClassFile examples showing the two <init> and <clinit> initialization methods
    are related to the issue of where and when data is stored by the JVM. I would
    say JVM memory has two major concepts, (1) where in memory is data stored, and
    (2) when is that data created? Before answering these questions, we should take
    a quick tour of JVM''s memory areas.


    JVM is a simulated computer (Java Virtual Machine), and so it uses artificially
    separated pieces of memory. A computer doesn''t have to have memory like this,
    it''s just how the JVM is designed to work. JVM has three separate chunks of memory:
    MethodArea, HeapArea, and ThreadArea.


    MethodArea memory is where class templates are stored. All the fields, methods,
    constructors, and everything else inside a class gets saved in this MethodArea
    memory. Basically everything in the .class byte-formatted ClassFiles like when
    we are analyzing are stored in the MethodArea memory. Critically, if a field or
    method is marked as static in source code, that field or method is only in the
    are not stored as part of class instances in a different memory location called
    the HeapArea. The main thing to understand the MethodArea memory is that it is
    a permanent storage area that holds a single, template copy of every class used
    in your code. Static fields and methods have their values or code stored in this
    memory area.


    HeapArea is where class instances are stored. An instance is basically a copy
    of a class, based on the class template that is stored in the MethodArea. These
    copies are their own objects in memory, and do not share any values in real-time
    with either the class template or other instance copies. In other words, updating
    the value of a field in one instance copy does not change the value of the same
    field in any other instance copy, because they are different instances and thus
    the memory addresses are different. Unique entities in HeapArea memory, each class
    instance has its own address, which is used to access the fields and methods within
    that instance, and this is the reason why fields in separate instance copies are
    truly different even though their simple names are identical.


    ThreadArea memory is all about invoking methods and the variables declared inside
    those methods, which are called local variables. This'
  - '[PAGE 88]


    memory area is called ThreadArea because each thread in a program has its own
    personal ThreadArea memory. Some programs use several execution threads, but multi-threading
    is an advanced programming technique that is beyond this book, so I will consider
    only single-thread programs. However, the ThreadArea memory is identical in structure
    for each thread, so if you understand how the ThreadArea memory works for single-thread
    programs, then you will also understand programs with several ThreadArea memory
    chunks. ThreadArea memory chunk is itself divided into two smaller chunks: (1)
    a program counter and (2) a method stack.


    +   - The program opcode counter is an incrementing ticker that points to the
    JVM opcode that is currently being executed by the JVM computer. Only one opcode
    can be executed at any given time by a single thread, which is why JVM has one
    program opcode counter per thread.


    +   - The method frame stack is basically a list of so-called method frames. Each
    method gets called in your Java code, a new frame is created in this stack area.
    This implies that there can be multiple frames representing the method, if the
    method gets invoked multiple times. Each method frame is divided into three method
    areas: (1) a reference to the constant pool (which is in MethodArea memory) of
    the class that defined that frame''s method; (2) a list of so-called local variables
    that can be used only by the same frame; and (3) a stack of operand values that
    are to be used, i.e. operated on, by JVM opcode instructions.


    +     - Class Template Constant Pool Reference - this is an address to the constant
    pool of the class template, which is stored in the MethodArea memory. This is
    needed for opcode execution because the names of fields and methods are only stored
    by reference in the constant pool table.


    +     - Local Variables Array - this is an array of variables, which are called
    local variables by definition of them being in this array. There are four distinct
    types of information stored in this local variables array:'
  - '[PAGE 89]


    +   - Memory address to the class template or instance copy where the method was
    invoked from.


    +   - Method parameters that were passed into the method within the parentheses.


    +   - Variables declared within the method''s code block.


    +   - Memory address where any values returned from the method should be returned
    to.


    +   - The Operand Stack - this is an empty list that has values added and removed
    to it during the execution of JVM instructions. For example, adding two numbers
    together first requires the two input values to be ''pushed'' onto this operand
    stack. Then during execution of the JVM add instruction, these values are ''popped''
    off the stack, and when the add instruction is finished, the summed value is ''pushed''
    onto the operand stack for use by other instructions.


    +   - The Opcode Instructions - JVM does not specify where the actual instructions
    that comprise your program are stored. However, you can read the instructions
    of a method by using the jav tool to read a .classFile. Each method has a code-type
    attribute which lists the opcode instruction for that method, and the opcodes
    are listed by javap for each method.


    Now you know how the JVM virtual computer uses its memory.


    +   - It stores the templates of classes as well as any static fields and methods
    in the confusingly-named MethodArea.


    +   - It stores class instance objects and their non-static fields and methods
    in the HeapArea.


    +   - It stores all the information needed to execute code found within method
    frames in the ThreadArea. Each time a method is invoked, that invocation gets
    a new frame, which contains a'
  - '[PAGE 90]


    "local variable" list of important memory addresses, method parameters, and variables.
    These local variables are destroyed when all the code in the method frame completes
    and method returns.


    Here is a diagram showing the different memory areas in JVM:


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_90_0.png)'
  - '[PAGE 91]


    Here is a breakdown by data type of where JVM stores data:


    | Class Templates | MethodArea |

    | Constant Pool | MethodArea |

    | Class (static) Fields | MethodArea |

    | Class (static) Methods | MethodArea |


    | Class Instance Objects | HeapArea |

    | Instance (non-static) Fields | HeapArea |

    | Instance (non-static) Methods | HeapArea |

    | Instance (non-static) Constructors | HeapArea |


    | Method Parameters | ThreadArea\n-->Local Variables |

    | Method Variables | ThreadArea\n-->Local Variables |


    Note that for methods, it is the template of the method that is stored in the
    MethodArea (class methods) or HeapArea (instance methods). When a method of either
    kind is actually invoked, a new frame is created in the ThreadArea that holds
    all the variables and opcode instructions in that method. The JVM then uses the
    data stored in the ThreadArea frame to actually execute instructions.'
  - '[PAGE 92]


    The hard part of JVM memory storage is over, now to see at what the data in these
    various parts of memory are created. JVM basically creates structures in memory
    as needed. This means that the JVM gets an instruction to reference a field or
    a method from a class that hasn''t been used before, the JVM will find the .class
    file for that method and load it into the MethodArea memory on-the-fly. Right
    after the class''s template is loaded into memory, JVM runs code to initialize
    any (and only!) class (static) fields, and it also runs any code within the static{}
    initialization code block. These initialization steps only occur once, since the
    class template is only loaded in the MethodArea memory once.


    Once in MethodArea memory, a class template can be used to create multiple new
    class instances in the HeapArea, and these new instances will be created in the
    HeapArea whenever JVM executes the opcode new, which is used to create instance
    copies. If the class template contains any instance (non-static) fields, these
    are initialized immediately after the class is created in HeapArea memory - note
    that instance fields do not exist before an instance is created in HeapArea memory!
    Also, any code within the non-static initialization block {} is executed right
    after instance creation. Because a class instance is a separate data entity from
    its class template, initializing instance (non-static) fields in the HeapArea
    instance does not overwrite the class (static) fields in the class template in
    the MethodArea.


    Finally, the ThreadData data of methods are only created after the method is called
    via a JVM invoke instruction. Once the method is invoked, a new frame in the ThreadArea
    frame is created and initialized with: (1) a reference to the constant pool table
    of the class template that the invoked method is associated with; (2) an array
    of local variables including a reference to the invoking class object, method
    parameters, variables declared in the method body, and a reference to wherever
    the return value should go; and (3) some stack space for the operands of JVM instructions.
    When the method''s instructions hit a return opcode, the frame and all its opcodes
    and local variables are deleted. This is the reason why the static keyword is
    not allowed by Java inside a method code block, because any static variable declared
    inside a method would be deleted anyways, thus it doesn''t make sense to have
    them.'
- md: "\nOne common error message when learning Java is \"Non-static variable cannot\
    \ be referenced from a static context\". For example, this code does not compile:\n\
    \n```java\nclass Hello\n{\n    String instField = \"Hi\";\n    static public void\
    \ main(String[])\n{\n        System.out.println(instField);\n    }\n}\n```\n\n\
    Why does this error happen? It is a result of the order in which class (static)\
    \ fields and instance (non-static) fields are created in memory. Class fields\
    \ are created and initialized to their values as soon as they are referenced in\
    \ source code, because JVM finds the class template, loads it into MethodArea\
    \ memory, and initializes any class fields immediately. Instance fields on the\
    \ other hand, are created and initialized only when a new class instance is built\
    \ within the HeapArea after the opcode new is executed by JVM.\n\nIn the Hello\
    \ class above, there is an instance field written into the source code. But this\
    \ source code is simply the template of the class. Instance fields are only created\
    \ after an instance copy of the class template is built via the new opcode. If\
    \ you were able to run the above class in the JVM, the memory layout at the moment\
    \ the printline command would look like this:\n\n| MethodArea | HeapArea | ThreadArea\
    \ |\n| --- | --- | --- |\n| Hello.class Template | | static main() |\n\nAnd the\
    \ instance field instField does not exist! Somehow, the compiler is smart enough\
    \ to predict this would happen, and so it doesn't let you compile this class.\n\
    \nSo if you want to reference an instance variable in source code, you must first\
    \ create an instance of the class, which causes JVM to initialize any instance\
    \ variables in the instance object. Once the instance variable exists in the instance\
    \ in HeapMemory, then you can use that instance as an address reference to get\
    \ its instance field. Simply add the code to create a class instance before trying\
    \ to access the instance field, and include the instance ID to let JVM know where\
    \ in memory to look for the instance field:\n\n```java\nclass Hello {\n  String\
    \ instField = \"Hi\";\n\n  static public void main(String[] args) {\n    Hello\
    \ instance1 = new Hello();\n\n    System.out.println(instance1.instField);\n \
    \ }\n}\n```\n\nWhen code execution reaches the the printline command, JVM looks\
    \ for an instance field residing at the address associated with the name ID instance.\
    \ This instance copy exists in HeapArea memory, and it has an instance field of\
    \ that name, so JVM fetches the value of that instance field, and the printline\
    \ command produces:\n\n| MethodArea | HeapArea | ThreadArea |\n| --- | --- | ---\
    \ |\n| Hello.class Template | Hello instance1 instField = \"Hi\" | static main()\
    \ |\n\nIf you are still reading this far, congratulations! There is still a long\
    \ way to go, but I hope you have learned some interesting and useful things about\
    \ Java and the JVM. The next section deals specifically with classes and their\
    \ components. We have already seen fields and methods, but there are several other\
    \ things that can be put in classes.\n\n# Class Members\n\nClasses are the fundamental\
    \ building blocks of Java. Almost all the source code you write in Java will happen\
    \ inside of classes. So what can go inside a class? There are a total of 7 different\
    \ things that you can include in your class. They are:\n\n- classes\n- interfaces\n\
    - fields\n- methods\n- static initialization code blocks\n- instance initialization\
    \ code blocks\n- constructors\n\n### Nested Class\nAlthough strange, a class can\
    \ have another class nested inside of it. I don't know why anyone should do this,\
    \ but it is technically possible. For this book, which just covers the basic functions\
    \ of Java, we will not analyze these at all. This is what the source code would\
    \ look like:\n\n```java\nclass OuterClass {\n  class InnerClass {\n    // fields\
    \ & methods\n  }\n}\n```\n\nInterfaces\nInterfaces are a list of methods that\
    \ are intended for inheritance classes. Like nested classes, it seems odd to declare\
    \ an interface inside a class, since they are really meant to be declared in their\
    \ own .classFiles. However, it is technically possible to declare an interface\
    \ inside of a class, and that would go like this:\n\n```java\nclass OuterClass\
    \ {\n  interface Interface {\n    // method signatures\n  }\n}\n```\n\nAt least\
    \ when starting out with Java, I would recommend avoiding nested classes and nested\
    \ interfaces. They are probably useful in some specific situations, like increased\
    \ code security, but they add a lot of complexity, and they are never required\
    \ for a program to function correctly.\n\n### Fields\nNext are fields, which we\
    \ have seen before. Fields that are declared with the static keyword are known\
    \ as class fields, because they are created and initialized when the class template\
    \ is loaded in the MethodArea memory. Fields declared without the static keyword\
    \ are known as instance fields, and they are created and initialized when a class\
    \ copy is made in the HeapArea memory. The source code for fields looks like this:\n\
    \n```java\nclass OuterClass\n{\n    static boolean classField = true;\n    boolean\
    \ instanceField = true;\n}\n```\n\nMethods\nMethods can be declared as either\
    \ static or non-static as well. Although methods are not initialized with a value\
    \ after they are loaded into memory like fields, they are still loaded into memory\
    \ somewhere. Class methods are stored in MethodArea memory, and they are created\
    \ as soon as their class template is loaded into MethodArea memory. Thus they\
    \ can be called by referencing the class template itself. Instance methods are\
    \ stored in HeapArea memory, and they are created when a new class instance copy\
    \ is loaded into HeapArea memory. Thus, instance methods must be called by referencing\
    \ the address of a class instance. Methods are written into classes like so:\n\
    \n```java\nclass OuterClass\n{\n    static void className()\n    {\n        //\n\
    \    }\n    void instanceMethod()\n    {\n    }\n}\n```\n\nThe previous four components:\
    \ nested classes, nested interfaces, fields, and methods; are special because\
    \ they all can be inherited by subclasses. The remaining three structures, explained\
    \ next, cannot be inherited by subclasses.\n\n### Static initialization code blocks\n\
    Static initialization code blocks indicate code that should be run only once,\
    \ when a class template is first loaded into MethodArea memory. As we saw above,\
    \ the code in the static initialization block is incorporated into a special method\
    \ called the <clinit> method, which JVM runs immediately after loading a class\
    \ template. In source code, the static class block looks like this:\n\n```java\n\
    class Class {\n  static {\n    // local variables\n  }\n}\n```\n\nAnalogous to\
    \ static initialization blocks, there are also non-static code initialization\
    \ blocks, which are run every time a new class instance is created in the HeapArea\
    \ memory. The code inside an instance initialization block goes inside an <init>\
    \ method in the .class file. It looks like this:\n\n```java\nclass Class {\n \
    \ // local variables\n}\n```\n\n### Constructors\nThe final non-inheritable structure\
    \ is a constructor. Constructors are a special type of method which are executed\
    \ every time a class instance is created with the new keyword. They are run at\
    \ the same time as a non-static initialization block, and the code inside a constructor\
    \ also goes inside an <init> method for JVM. Constructors in source code are different\
    \ from static initialization blocks however, because a constructor can take parameters\
    \ via its parentheses. Thus, a constructor is more flexible than an instance initialization\
    \ block. Despite being able to take parameters however, constructors are very\
    \ different from methods, because:\n\n- They have no return type and cannot return\
    \ values\n- Their name is always the name of the class it itself\n- A constructor\
    \ must be invoked every time class instance object is created\n\nIf you don't\
    \ explicitly write a constructor into your class, then JVM will automatically\
    \ add one for you in the ClassFile, which will be a call to the constructor of\
    \ your class's superclass. Also, if you inherit any superclass fields that need\
    \ initialization, and you don't initialize them in your class, then JVM will automatically\
    \ call the superclass constructor. Constructors look like this:\n\n```java\nclass\
    \ MyClass\n{\n    MyClass() // default constructor\n    {\n        super();\n\
    \    }\n    MyClass(int a, int b) // passing data into a constructor\n    {\n\
    \        int c = a + b;\n    }\n}\n```\n\nThe super keyword is a variable that\
    \ points to the memory address of the class template of your class's super class.\
    \ You can read what your class's superclass is in the javap output. Except for\
    \ Java's topmost class, java/lang/Object, every class has a superclass.\n"
  mdcn: "\n\n学习 Java 时一种常见的错误信息是“无法从静态文中引用非静态变量”（Non-static variable cannot be referenced\
    \ from a static context）。例如，这段代码无法编译：\n\n```java\nclass Hello\n{\n    String instField\
    \ = \"Hi\";\n    static public void main(String[])\n{\n        System.out.println(instField);\n\
    \    }\n}\n```\n\n为什么会发生这个错误？这是由于类静态字段和实例字段在内存中创建的顺序导致的。类字段在源代码中被引用时就会创建并初始化为它们的值，因为\
    \ JVM 会找到类模板，将其加载到方法区（MethodArea）内存，并立即初始化任何类字段。另一方面，实例字段只有在 JVM 执行 `new` 字节码后，在堆区（HeapArea）中构建新的类实例时才会被创建和初始化。\n\
    \n在上面的 `Hello` 类中，源代码里确实写了一个实例字段。但这段代码仅仅是类的模板。实例字段只有在通过 `new` 字节码构建了类模板的实例副本后才会被创建。如果你能够在\
    \ JVM 中运行上述类，在执行打印命令瞬间的内存布局将如下所示：\n\n| MethodArea | HeapArea | ThreadArea |\n\
    | --- | --- | --- |\n| Hello.class Template | | static main() |\n\n此时实例字段 `instField`\
    \ 并不存在！某种程度上，编译器足够智能，可以预测到这种情况，因此它不允许你编译这个类。\n\n所以，如果你想在源代码中引用实例变量，必须先创建类的实例，这会导致\
    \ JVM 初始化实例对象中的任何实例变量。一旦实例变量在堆内存（HeapMemory）的实例中存在，你就可以使用该实例作为地址引用来获取它的实例字段。只需在尝试访问实例字段之前添加创建类实例的代码，并包含实例\
    \ ID 以让 JVM 知道去内存的哪个位置查找该实例字段：\n\n```java\nclass Hello {\n  String instField =\
    \ \"Hi\";\n\n  static public void main(String[] args) {\n    Hello instance1 =\
    \ new Hello();\n\n    System.out.println(instance1.instField);\n  }\n}\n```\n\n\
    当代码执行到打印命令时，JVM 会寻找位于与名称 `instance1` 关联地址的实例字段。该实例副本存在于堆区内存中，并且拥有一个同名的实例字段，因此\
    \ JVM 获取该实例字段的值，打印命令产生输出：\n\n| MethodArea | HeapArea | ThreadArea |\n| --- | ---\
    \ | --- |\n| Hello.class Template | Hello instance1 instField = \"Hi\" | static\
    \ main() |\n\n如果你一直读到了这里，恭喜你！还有很长的路要走，但我希望你已经学习了一些关于 Java 和 JVM 的有趣实用的知识。下一节将专门讨论类及其组件。我们已经看到了字段和方法，但还有其他几种东西可以放入类中。\n\
    \n# 类成员 (Class Members)\n\n类是 Java 的基本构建块。你在 Java 中编写几乎的所有代码都会发生在类内部。那么，类里面可以放什么呢？你的类中可以包含\
    \ 7 种不同的内容。它们是：\n\n- 类 (classes)\n- 接口 (interfaces)\n- 字段 (fields)\n- 方法 (methods)\n\
    - 静态初始化代码块 (static initialization code blocks)\n- 实例初始化代码块 (instance initialization\
    \ code blocks)\n- 构造方法 (constructors)\n\n### 嵌套类 (Nested Class)\n虽然很奇怪，但一个类内部嵌套另一个类。我不知道为什么有人要这样做，但在技术上是可能的。对于这本仅涵盖\
    \ Java 基础功能的书，我们完全不会分析这些。源代码看起来如下：\n\n```java\nclass OuterClass {\n  class InnerClass\
    \ {\n    // 字段 & 方法\n  }\n}\n```\n\n### 接口 (Interfaces)\n接口是一组旨在供类继承的方法列表。和嵌套类一样，在类内部声明接口似乎很奇怪，因为它们实际上应该声明在各自的\
    \ `.class` 文件中。然而，在技术上在类内部声明接口是可行的，写法如下：\n\n```java\nclass OuterClass {\n  interface\
    \ Interface {\n    // 方法签名\n  }\n}\n```\n\n至少在刚开始 Java 时，我建议避免使用嵌套类和嵌套接口。它们在某些特定情况下（如增加代码安全性）可能有用，但它们增加了大量的复杂性，而且对于程序的正常运行来说，永远都不需要它们。\n\
    \n### 字段 (Fields)\n接下来是字段，我们之前见过过了。使用 `static` 关键字声明的字段被称为类字段，因为它们在类模板加载到方法区内存时就会被创建并初始化。没有使用\
    \ `static` 关键字声明的字段被称为实例字段，它们在堆区内存中创建类副本时被创建和初始化。字段的源代码如下：\n\n```java\nclass OuterClass\n\
    {\n    static boolean classField = true;\n    boolean instanceField = true;\n\
    }\n```\n\n### 方法 (Methods)\n方法也可以被声明为静态（static）或非静态。虽然方法在加载到内存后不会像字段那样初始化值，但它们仍然会被加载到内存的某处。类方法存储在方法区内存中，并在其类模板加载到方法区内存时立即创建。因此，可以通过引用类模板本身来调用它们。实例方法存储在堆区内存中，并在新的类实例副本加载到堆区内存时被创建。因此，实例方法必须通过引用类实例的地址来调用。方法这样写入类中的：\n\
    \n```java\nclass OuterClass\n{\n    static void className()\n    {\n        //\n\
    \    }\n    void instanceMethod()\n    {\n    }\n}\n```\n\n上述四个组件：嵌套类、嵌套接口、字段和方法是特殊的，因为它们都可以被子类继承。接下来的三个结构是无法被子类继承的。\n\
    \n### 静态初始化代码块 (Static initialization code blocks)\n静态初始化代码块指示在类模板首次加载到方法区内存时运行一次的代码。正如我们上面看到的，静态初始化块中的代码被整合到一个名为\
    \ `<clinit>` 的特殊方法中，JVM 在加载类模板后立即运行它。在源代码中，静态块如下：\n\n```java\nclass Class {\n\
    \  static {\n    // 局部变量\n  }\n}\n```\n\n类似于静态初始化块，还有非静态代码块，它们在堆内存中创建新的类实例时运行。实例初始化块内部的代码进入\
    \ `.class` 文件中的 `<init>` 方法。它看起来如下：\n\n```java\nclass Class {\n  // 局部变量\n}\n\
    ```\n\n### 构造方法 (Constructors)\n最后的不可继承结构是构造方法。构造方法是在每次使用 `new` 关键字创建类实例时执行的特殊方法类型。它们与非静态初始化块同时运行，构造方法内部的代码也进入\
    \ JVM 的 `<init>` 方法中。源代码中的构造方法与静态初始化块不同，因为构造方法可以通过括号接收参数。因此，构造方法比实例初始化块更灵活。尽管能够接收参数，但构造方法与方法非常不同，因为：\n\
    \n- 它们没有返回类型且不能返回值\n- 它们的名称始终是类本身的名称\n- 每当创建类实例时都必须调用构造方法\n\n如果你没有在类中显式编写构造方法，JVM\
    \ 会在 ClassFile 中自动为你添加一个，这将是对你的类的父类的构造方法的调用。此外，如果你继承了任何需要初始化的父类字段，而没有没有在类中对其初始化，那么\
    \ JVM 将自动调用父类的构造方法。构造方法如下：\n\n```java\nclass MyClass\n{\n    MyClass() // 默认构造方法\n\
    \    {\n        super();\n    }\n    MyClass(int a, int b) // 向构造方法传递数据\n    {\n\
    \        int c = a + b;\n    }\n}\n```\n\n`super` 关键字是一个指向父类类模板内存地址的变量。你可以在 `javap`\
    \ 输出中看到你的类的父类是什么。除了 Java 的顶级类 `java/lang/Object` 之外，每个类都有一个父类。\n\n"
