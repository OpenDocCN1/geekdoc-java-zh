    \ Java 程序时，你会看到 `java.lang.ArithmeticException: / by zero`，这是 Java 决定打印的字符串，而不是内存指针的值。\n\
    \n总结 Java 处理程序执行期间遇到问题的几个要点：\n\n- `Throwable` 是 Java 用于分类运行期间检测到的任何问题的类名。\n- 继承自\
    \ `Throwable` 的类（即 `Throwable` 的子类）也可以用于标记错误。\n- Java 具有内置的检测和分类问题的能力，JVM 会扫描你的代码，寻找参数类型匹配错误类型的\
    \ `catch{}` 块。\n- JVM 将指向 `Throwable` 对象的内存指针推入操作栈，因此你可以根据需要直接处理该错误。\n- 在源代码中使用\
    \ `try{}` 代码块来告诉 JVM 监控闭闭代码中出现的任何问题，并在之后放置 `catch{}` 块。\n\n"
