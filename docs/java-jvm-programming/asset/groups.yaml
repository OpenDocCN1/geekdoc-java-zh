    The constant pool is finished now, the new data in the ClassFile is other information.
    Namely, the first 2 bytes after the pool contain information about what kind of
    structure is represented by this ClassFile, because it''s not always a Java class,
    and also access permissions for the ClassFile does fact represent a Java class.
    The 16 bits found in these two bytes represent a "flag", which is either ON (1)
    or OFF (0). Sometimes more than one flag is turned on, and sometimes not. For
    this particular example, the two bytes are 0x00_02_0:


    ```

    CA FE BA BE 00 00 00 00 3C 00 0F 0A 00 02 03 07 00 04 0C 00

    05 00 06 01 00 10 6A 61 76 61 72 0F 6C 61 6E 67 2F 4F 4F 62 65 74 01 05 06 3C
