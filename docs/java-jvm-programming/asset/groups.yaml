    That wraps up the content for this chapter, and also for this book! If you made
    it all the way, give yourself a huge pat on the back, because going through the
    nitty-gritty of Java and the JVM is not an easy task.


    I hope you found this material as interesting as I have - Certainly did not think
    that I would be able to understand how the JVM implements Java source code, at
    least prior to writing this book, but I think I have learned a few useful concepts
    that I can apply to my Java programming, and my goal is to have you pick up a
