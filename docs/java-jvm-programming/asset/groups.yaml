    \n\n对于更复杂的值，JVM 使用了 `ldc2_w` 操作码，这是一个更长的三字节指令，用于从常量池条目中检索双 值并将其推入操作数栈。\n\n现在你应该对\
    \ JVM 如何处理不同类型的原始数据有了相当好的理解。我认为关于 Java 原始数据有两个主要点需要理解。\n\n首先，创建和为变量赋值的整体策略对于所有原始类型都是相同的，即将值推入操作数栈，然后移动到字段或局部变量的位置，无论它位于\
    \ JVM 内存的哪个位置。\n\n其次，在 JVM 中将原始值推入操作数栈时使用的特定操作码实际上取决于该值，这令人惊讶。JVM 似乎有特殊的单字节操作码，用于推送程序员经常使用的简单值，如\
    \ -1、0 和 1。但对于较大或更复杂的值，可能使用了速度较慢的操作码来处理这些复杂值。\n\n我们还没有完全介绍 Java 的值类型，因为我们仍然需要涵盖引用类型，但请坚持下去，完成本章已经不远了。\n\
    \n# 引用类型\n\n引用数据是通过间接访问的数据，即通过引用访问。一个被引用的数据结构可以是以下四种之一：\n\n- 接口模板，存储在方法区（MethodArea）内存中\n\
    - 类模板，存储在方法区（MethodArea）内存中\n- 类实例对象，存储在堆区（HeapArea）内存中\n- 数组对象，存储在堆区（HeapArea）内存中\n\
    \n![](img/c8857ea016f1259bfbfe6939f1314dc2_173_0.png)\n\n这四种数据结构通过内存指针访问，因为它们太大了，无法直接存储在分配给字段或局部变量的空间中。\n\
    \n为了在源码中使用这些结构，使用关键字或变量作为引用，JVM 知道该引用指向所需的数据结构。\n\n# (A) 模板引用\n\n如果数据结构是接口模板或类模板，则访问模板使用的引用是接口或类本身的名称。\n\
    \n### (A.1) 接口模板\n\n例如，接口设计用于被类继承，因此要告诉 JVM 你想使用接口，只需在源文件中编写接口的名称：\n\n```java\n\
    // 声明一个接口\ninterface InterfaceName\n{\n  void interfaceMethod()\n}\n```\n\n```java\n\
    // 使用接口的类\nclass SomeClass implements InterfaceName\n{\n  void interfaceMethod()\
    \ {\n    System.out.println(\"howdy partner!\");\n  }\n}\n```\n\n你可以看到，不需要声明一个数据类型为接口的变量，你只需要在源文件中直接编写接口名称，JVM\
    \ 就知道如何找到并访问与该名称关联的数据结构。\n\n### (A.2) 类模板\n\n类模板的工作原理相同。你不需要声明一个变量来持有类模板的内存指针，只需要在源码中编写类本身的名称，JVM\
    \ 就能找到它。例如，如果你想访问定义在方法区内存中类模板数据结构中的静态类字段，你只需要编写类名，后面跟一个点（），这是 JVM 知道你想访问该类成员的方式：\n\
    \n```java\n// 带有静态字段的类\nclass ClassOne\n{\n  static int classField = 5;\n}\n```\n\
    \n```java\n// 引用第一个类的类\nclass ClassTwo\n{\n  static public void main(String[]\
    \ str) {\n    System.out.println(ClassOne.classField);\n  }\n}\n```\n\n你可以看到，访问\
    \ ClassOne 的类字段只需要在源码中写下 `ClassOne` 单词，然后在后面加一个点，这告诉 JVM 你想访问该类的成员。JVM 足够智能，能够知道\
    \ ClassOne 不是一个实例对象，而是存储在方法区内存中的一个模板。\n\n# (B) 对象引用\n\n存储在堆区（HeapArea）内存中的对象可以通过创建一个存储指向对象内存地址指针的变量来引用。该变量必须声明为与对象本身相同的类型或其父类类型。遗憾的是，存储在变量中的地址对你（程序员）来说是不可见的，因此你必须信任\
    \ JVM 正在执行正确的操作。我认为实际内存地址不可见的原因是它在程序执行过程中会发生变化，因为 JVM 会清理并重排其堆区内存，以根据需要释放更多空间。无论如何，拥有指向对象的变量的结果是，可以在源码中输入变量名来告诉\
    \ JVM 你想访问对象的数据结构。JVM 会理解你正在通过引用访问对象数据，并将你的代码指向堆区内存中正确的对象。\n\n堆区对象的创建始终是 Java\
    \ `new` 关键字的结果。`new` 关键字会导致 JVM 执行：\n\n- 创建一个新的堆区对象\n- 使用默认值对其进行初始化\n- 返回指向对象的内存指针\n\
    \n然后，将该内存指针存储在声明的字段或局部变量中。\n\n"
