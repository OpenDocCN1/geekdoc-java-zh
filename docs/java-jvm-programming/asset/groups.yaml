    class field. There is a way however, to explicitly call a <clinit> method, in
    order to run code only at the very start of a class''s lifecycle. In the Java
    source file, you can use the static keyword + code block curly brackets, static
    {}, to create a block of code that is run only once, when the class is first loaded
    into MethodArea memory. Inside the curly brackets is where you put the code you
    want to run.


    You might think that you could put a static field variable inside that static
    code block, and it would be identical to just putting the class field directly
    in the static{}. Unfortunately, it does not work this way. The curly brackets
    in static{} indicate that any code inside the brackets is treated as local variables,
    exactly as if static{} was a method, and JVM prohibits declaring local variables
    to be static. In other words, it simply does not work.


