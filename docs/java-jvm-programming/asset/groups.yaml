  mdcn: "\n\n# JVM 内存区域\n\n展示两个 `<init>` 和 `<clinit>` 初始化方法的 ClassFile 示例与 JVM 在何处以及何时存储数据的问题有关。我认为\
    \ JVM 内存有两个主要概念：(1) 数据存储在内存的哪个位置，以及(2) 这些数据是何时创建的？在回答这些问题之前，我们应该快速浏览一下 JVM 的内存区域。\n\
    \nJVM 是一个模拟计算机（Java 虚拟机），因此它使用了人工划分的内存区域。计算机并不一定有这样的内存，这只是 JVM 的设计工作方式。JVM 拥有三个独立的内存块：方法区（MethodArea）、堆区（HeapArea）和线程区（ThreadArea）。\n\
    \n方法区内存是存储类模板的地方。类内部所有的字段、方法、构造函数和其他所有内容都保存在这个方法区内存中。基本上，我们正在分析的这种 `.class` 字节格式\
    \ ClassFile 中的几乎所有内容都存储在方法区内存中。至关重要的一点是，如果源代码中的某个字段或方法被标记为静态（static），那么该字段或方法只存在方法区中，而不会作为类实例的一部分存储在名为堆区（HeapArea）的另一个内存位置中。理解方法区内存的关键在于，它是一个永久存储区域，持有你代码中使用的每个类的单一模板副本。静态字段和方法的数值或代码就存储在这个内存区域中。\n\
    \n堆区是存储类实例的地方。实例基本上是基于存储在方法区中的类模板的类副本。这些副本在内存中是它们自己的对象，并且不会与类模板或其他实例副本实时共享任何值。换句话说，更新其中一个实例拷贝中字段的值不会改变任何其他实例拷贝中相同字段的值，因为它们是不同的实例，因此内存地址也是不同的。堆区内存中的每个实体都是独有的，每个类实例都有自己的地址，该地址被用于访问该实例内部的字段和方法，这就是为什么即使不同实例拷贝中的字段简单名称相同，但它们也是真正不同的原因。\n\
    \n线程区内存主要关于方法的调用以及在这些方法内部声明的变量（称为局部变量）。这个内存区域之所以被称为线程区，是因为程序中的每个线程都有自己私有的区区内存。有些程序使用多个执行线程，但多线程是一种超出现本书范范围的高级编程技术，因此我将只考虑单线程程序。然而，每个线程的线程区内存结构是相同的，所以如果你理解了单线程程序的线程区内存是如何工作的，你也能理解具有多个线程区内存块的程序。线程区内存块本身分为两个更小的块：(1)\
    \ 程序计数器和(2) 方法栈。\n\n- 程序操作码计数器是一个不断递增的计时器，指向 JVM 计算机当前正在执行的 JVM 操作码（opcode）。单个线程在任何给定时间内只能执行一个操作码，这就是为什么\
    \ JVM 每个线程都有一个操作码计数器。\n- 方法帧栈基本上是一个所谓的“方法帧”的列表。每当在 Java 代码中调用一个方法时，该栈区域就会创建一个新帧。这意味着如果一个方法被调用多次，则可能存在多个表示该方法的帧。每个方法帧被分为三个方法区域：(1)\
    \ 指向定义该帧方法的类的常量池（位于方法区内存中）的引用；(2) 一个只能由同一帧使用的所谓局部变量列表；以及(3) 一个将供 JVM 操作码指令使用（即进行操作）的操作数值栈。\n\
    \n  - 类模板常量池引用 - 这是指向类模板常量池的地址，该常量池存储在方法区内存中。操作码执行需要此引用，因为字段和方法的名称仅通过引用存储在常量池表中。\n\
    \  - 局部变量数组 - 这是一个变量数组，根据它们位于此数组中的定义，被称为局部变量。局部变量数组中存储了四种不同类型的信息：\n    - 指向调用该方法的类模板或实例拷贝的内存地址。\n\
    \    - 括号内传递给方法的参数。\n    - 在方法代码块内部声明的变量。\n    - 方法返回的任何值应该返回到的内存地址。\n  - 操作数栈\
    \ - 这是一个必须被 JVM 操作码指令使用（即进行操作）的空列表。\n\n- 操作数栈 - 这是一个必须被 JVM 操作码指令使用（即进行操作）的空列表。\n\
    \n- 方法返回的任何值应该返回到的内存地址。\n\n- 操作数栈 - 这是一个必须被 JVM 操作码指令使用（即进行操作）的空列表。\n\n- 操作数栈\
    \ - 这是一个必须被 JVM 操作码指令使用（即进行操作）的空列表。\n\n- 操作数栈 - 这是一个必须被 JVM 操作码指令使用（即进行操作）的空列表。\n\
