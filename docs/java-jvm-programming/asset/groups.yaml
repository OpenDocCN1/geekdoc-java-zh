    \n\nWith the more complicated value, JVM uses the opcode ldc2_w, which is a longer\
    \ three byte command that retrieves the double value stored in a constant pool\
    \ entry and pushes value onto the operand stack.\n\nYou should now have a pretty\
    \ good understanding of how different types of primitive data are dealt with by\
    \ JVM. I think there are two main points to understand about Java primitive data.\n\
    \nFirst, that the overall strategy for creating and assigning values to variables\
    \ is the same for all primitive types, namely pushing the value onto the operand\
    \ stack, moving it to the location of the field or local variable, wherever that\
    \ is in JVM's memory.\n\nAnd second, that the specific opcode used to push the\
    \ primitive value onto the operand stack within JVM actually depends on what that\
    \ value is, which is surprising. It appears that JVM has special single-byte opcodes\
    \ that are used to push simple values that are used often by programmers, like\
    \ -1, 0, and 1. But for larger or more complicated values, presumably slower opcodes\
    \ are used for those more complex values.\n\nWe're not quite done with Java's\
    \ value types yet, because we still have to cover the reference types, but hang\
    \ in there, it's not too much longer before finishing this chapter.\n\n# Reference\
    \ Types\n\nReference data is data that is accessed indirectly, i.e. by reference.\
    \ A referenced data structure can be one of four things:\n\n- interface templates,\
    \ stored in MethodArea memory\n- class templates, stored in MethodArea memory\n\
    - class instance objects, stored in HeapArea memory\n- array objects, stored in\
    \ HeapArea memory\n\n![](img/c8857ea016f1259bfbfe6939f1314dc2_173_0.png)\n\nThese\
    \ four data structures are accessed via memory pointers because they are too large\
    \ to store directly in the space allotted for fields or local variables.\n\nIn\
    \ order to use the structures in source code, a keyword or variable is used as\
    \ the reference, and the JVM knows that the reference points toward the desired\
    \ data structure.\n\n# (A) References to Templates\n\nIf the data structure is\
    \ an interface template or a class template, the reference used to access the\
    \ template is the name of the interface or class itself.\n\n### (A.1) Interface\
    \ Templates\n\nFor example, interfaces are designed to be inherited by classes,\
    \ so to tell the JVM that you want to use the interface, you simply write the\
    \ name of the interface in your source code file:\n\n```java\n// declare an interface\n\
    interface InterfaceName\n{\n  void interfaceMethod()\n}\n```\n\n```java\n// class\
    \ that uses the interface\nclass SomeClass implements InterfaceName\n{\n  void\
    \ interfaceMethod() {\n    System.out.println(\"howdy partner!\");\n  }\n}\n```\n\
    \nSo you can see that there is no need to declare a variable having the data type\
    \ of the interface, you just need to write the name of the interface directly\
    \ in your source code file and JVM know how to find it and access the data structure\
    \ associated with that name.\n\n### (A.2) Class Templates\n\nClass templates work\
    \ the same. You don't need to declare a variable to hold the memory pointer to\
    \ a class template, you just need to write the name of the class itself in source\
    \ code and JVM can find it. For example, if you want to access a static class\
    \ field, which is defined in the class template data structure in MethodArea memory,\
    \ then you just have to write the name of the class, followed by a period, which\
    \ is the way JVM knows that you want to access a member of that class:\n\n```java\n\
    // class with a static class field\nclass ClassOne\n{\n  static int classField\
    \ = 5;\n}\n```\n\n```java\n// class that references the first class\nclass ClassTwo\n\
    {\n  static public void main(String[] str) {\n    System.out.println(ClassOne.classField);\n\
    \  }\n}\n```\n\nAnd you can see that all you need to do to access the class field\
    \ of ClassOne is to write the word ClassOne in your source code, and then put\
    \ the period afterwards, which tells JVM that you want to access a member of that\
    \ class. JVM is smart enough to know that ClassOne is not an instance object,\
    \ rather it is stored as a template in MethodArea memory.\n\n# (B) References\
    \ to Objects\n\nObjects stored in HeapArea memory can be referenced by creating\
    \ a variable that stores a memory address pointer to the object. The variable\
    \ must be declared with the same type or a superclass type of the object itself.\
    \ The address stored in the variable is unfortunately not visible to you, the\
    \ programmer, so you have to trust that the JVM is doing the right thing. I think\
    \ the reason why the actual memory address is not visible is it changes over the\
    \ course of program execution, due to JVM cleaning up and rearranging its HeapArea\
    \ memory to free up more space as needed. In any case, the result of having a\
    \ variable that points to an object is that you can type the variable's name in\
    \ source code to tell JVM that you want to access the object's data structure.\
    \ The JVM will understand that you are accessing the object data by reference,\
    \ and will point your code to the correct object in HeapArea memory.\n\nThe creation\
    \ of a HeapArea object is always a result of Java's new keyword. The new keyword\
    \ causes the JVM to:\n\n- creates a new HeapArea object\n- initializes it with\
    \ default values\n- returns a memory pointer to the object\n\nThe memory pointer\
    \ is then stored in the field or local variable that you declared. And this is\
    \ the reason why typing the name of that variable in source code allows you to\
    \ access the data structure.\n\nIn source code these things are all accomplished\
    \ with one line of code. This line of code can be broken down into three main\
    \ sections:\n\n- keyword new\n- object constructor (with parameters)\n- assignment\
    \ operator\n- variable declaration (with type and name)\n\nThese three sections\
    \ have this general format in source code:\n\n# Type variableName = new Type(parameters)\n\
    \nObject creation, initialization, and pointer return happens on the right side\
    \ of the assignment operator. When you write the keyword new in source code, you\
    \ are telling the JVM that it should execute one of the opcodes that creates objects,\
    \ which gets the ball rolling. The kind of object the JVM should is created by\
    \ the constructor method you put after the new keyword. The constructor method\
    \ is a bit confusing, because it actually shares the same name as the Type reference\
    \ keyword. The difference is that the constructor method has parenthesis attached\
    \ to it, Type(). Inside the constructor methods parenthesis, you may or may not\
    \ need to put some information. It depends on the object. The result of the new\
    \ Type() expression is that the JVM makes an object in HeapArea memory, initializes\
    \ it with default values, and produces a memory address that points to the object.\
    \ This memory pointer is what gets assigned to the variableName variable.\n\n\
    The variable declaration is relatively straightforward. You just write a name\
    \ for your variable, which is conventionally a letters-only identifier, and with\
    \ the first word in all lowercase if the variable name is more than one word.\
    \ In front of the variable name is written the\n"
