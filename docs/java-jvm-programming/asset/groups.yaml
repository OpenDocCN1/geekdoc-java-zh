- md: "\nputstatic #9\nPops the array reference pointer from the operand stack, and\
    \ puts it in the variable pointed at by the constant pool reference #9,\n\"ClassName.field:[Ljava/lang/String;;\"\
    . Now that the address pointer to the array object is stored in the class field,\
    \ you can manipulate the array object by the field's name in your source code.\n\
    \n![](img/c8857ea016f1259bfbfe6939f1314dc2_191_0.png)\n\nThis concludes the section\
    \ on Java's data types. It is a long section, but knowing what types of data you\
    \ can store in your Java programs and how to access them is critical to any program.\n\
    \nYour computer program, and your computer itself, really just does two things:\
    \ store information and manipulate information. This section covers the first\
    \ thing that your program does. The next section, which focuses on methods, deals\
    \ with the second thing.\n\nOf course, you can write expressions in your source\
    \ code anywhere, and these will be evaluated by the JVM. So manipulating information\
    \ doesn't take place only inside methods. However, most of the opcodes that your\
    \ programs will execute are probably coming from inside methods, so a simplified\
    \ way to think about your Java programs is:\n\nFields source data.\n\nMethods\
    \ manipulate fields.\n\n## Manipulating Information\n\nTechnically, you can operate\
    \ on data pretty much anywhere in your source code. For example, mathematical\
    \ expressions can be placed directly in variable declarations, and methods that\
    \ return a value can be invoked anywhere a value is needed. However, a simple\
    \ way of thinking about performing operations is that these activities occur within\
    \ methods. In fact, a common way to approach Java programming is to think of fields\
    \ storing data, while methods are used to \"set\" or \"get\" that data.\n\nYou\
    \ can do more operations besides getting and setting field data of course, like\
    \ doing complex math calculations, connecting to other computers over the internet,\
    \ or anything else. This section is really about methods, how they work, and the\
    \ different ways that you can manipulate data or perform operations within them.\n\
    \nLet's start with a simple method that returns an integer:\n\n```java\nclass\
    \ ClassName\n{\n    int methodName()\n    {\n        return 5;\n    }\n}\n```\n\
    \nThe javap output for this class is:\n\n```\nclass ClassName\nminor version:\
    \ 0\nmajor version: 60\nflags: (0x0020) ACC_SUPER\nthis_class: #7 // ClassName\n\
    super_class: #2 // java/lang/Object\ninterfaces: 0, fields: 2, attributes: 1\n\
    Constant pool:\n#1 Methodref #8 // java/lang/Object.\"init>():V\n#2 Class #4 //\
    \ java/lang/Object\n#3 NameType #5:6 // <init>():V\n#4 Utf8 java/lang/Object\n\
    #5 Utf8 <init>\n#6 Utf8 ()\n#7 Class ClassName\n#8 Utf8 Code\n#9 Utf8 LineNumberTable\n\
    #10 Utf8 methodName\n#11 Utf8 ()\n#12 Utf8 SourceFile\n#13 Utf8 ClassName.java\n\
    ```\n\n```\n{\nClassName():\n  descriptor: ()V\n  flags: (0x0000)\n  Code:\n \
