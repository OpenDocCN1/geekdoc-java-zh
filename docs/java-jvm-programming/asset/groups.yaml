    \ 文件中的对象指针。结合你对 Java 访问限制的知识，以及静态类成员与非静态实例对象成员之间的区别，了解方法的工作原理应该让你有足够的知识来设计源码来实现你的目标。\n\
    \n## 异常与错误处理\n\n我觉得这个主题在《Java 语言规范》中解释得并不清楚，所以我想添加这一部分来展示异常（Exception）和错误（Error）如何在\
    \ .class 文件表示。查看类信息会让这个主题更容易理解。\n\n首先，什么是异常和错误？简单来说，这些都是计算机在执行你的程序时遇到的问题。例如，如果你尝试除以零，计算机将生成一条错误消息，告诉它无法将无限作为整数数据类型存储或类似。其他错误可能是尝试打开一个不存在的文件，或者打开一个不接受连接的网站的网络连接。还有许多类型的问题可能发生。\n\
    \n与某些直接退出程序或崩溃的编程语言不同，Java 允许你在源代码中处理程序遇到的错误！我不知道这是如何实现的，但可能是因为你的程序运行在一个模拟计算机即\
    \ JVM 中，所以对你程序的执行具有某种程度的元控制。换句话说，JVM 的构建方式可能能够观察并检测你的程序何时遇到问题。\n\nJava 用来处理这些问题的系统完全基于三个概念：\n\
    \n-   *Throwable 类*\n-   try{} / catch{} 源代码命令\n-   JVM 字节码跳转\n\n**Throwable**\
    \ 是 Java 预装的一个 Java 类名称。该类是 Java 虚拟机抛出的所有错误和异常的基类。Throwable 的子类分为 Error（错误）和 Exception（异常）。错误代表合理的应用程序不尝试捕获的严重问题。异常代表应用程序可能想要捕获的情况。\n\
    \ntry 块用于封装可能会抛出异常的代码。catch 块用于处理异常。finally 块用于无论是否抛出异常都执行代码。\n\n```java\ntry\
    \ {\n    int result = 10 / 0;\n} catch (ArithmeticException e) {\n    System.out.println(\"\
    Division by zero: \" + e.getMessage());\n} finally {\n    System.out.println(\"\
    This will always execute.\");\n}\n```\n\nJVM 使用字节码来处理异常。当抛出异常时，JVM 在当前方法中查找异常处理程序。如果没有找到，它将返回调用方法并重复该过程。一直持续到找到处理程序或程序终止。\n\
    \n.class 文件中的异常表包含有关异常处理程序的信息。表中的每个条目由：\n\n-   可以抛出异常的代码指令范围的起始偏移量。\n-   代码指令范围的结束偏移量。\n\
    -   处理偏移量（异常处理程序开始的地址）。\n-   处理程序处理的异常类型。\n\n这里是上述代码的异常表示例：\n\n```\nexception\
    \ table:\n  from 0 to 5 by 12 to java/lang/ArithmeticException\n```\n\n该条目意味着如果偏移量\
    \ 0 到 5 的任何指令抛出了 `ArithmeticException`，则执行偏移量 12 的处理器。\n\n| 起始偏移量 | 结束偏移量 | 处理偏移量\
    \ | 异常类型 |\n| :--- | :--- | :--- | :--- |\n| 0 | 5 | 12 | ArithmeticException\
    \ |\n\n在这个示例中，如果在偏移量 0 到 5 之间的指令抛出了 `ArithmeticException`，JVM 将跳转到偏移量 12 的代码，即\
    \ catch 块的开始。\n\n异常表是 Java 类文件的至关部分，因为它允许 JVM 知道如何高效处理异常，而无需对每条指令都检查潜在的异常。\n\n"
