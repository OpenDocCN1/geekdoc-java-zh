    # Class Members'
  - "[PAGE 96]\n\nClasses are the fundamental building blocks of Java. Almost all\
    \ the source code you write in Java will happen inside of classes. So what can\
    \ go inside a class? There are a total of 7 different things that you can include\
    \ in your class. They are:\n\n+   - classes\n- interfaces\n- fields\n- methods\n\
    - static initialization code blocks\n- instance initialization code blocks\n-\
    \ constructors\n\nNested Class Although strange, a class can have another class\
    \ nested inside of it. I don't know why anyone should do this, but it is technically\
    \ possible. For this book, which just covers the basic functions of Java, we will\
    \ not analyze these at all. This is what the source code would look like:\n\n\
    ```\nclass OuterClass {\n  class InnerClass {\n    // fields & methods\n  }\n\
    }\n```\n\nInterfaces are a list of methods that are intended for inheritance classes.\
    \ Like nested classes, it seems odd to declare an interface inside a class, since\
    \ they are really meant to be declared in their own .classFiles. However, it is\
    \ technically possible to declare an interface inside of a class, and that would\
    \ go like this:\n\n```\nclass OuterClass {\n  interface Interface {\n    // method\
    \ signatures\n  }\n}\n```\n\nAt least when starting out with Java, I would recommend\
    \ avoiding nested classes and nested interfaces. They are probably useful in some\
    \ specific situations, like increased code security, but they add a"
  - "[PAGE 97]\n\nlot of complexity, and they are never required for a program to\
    \ function correctly.\n\nFields Next are fields, which we have seen before. Fields\
    \ that are declared with the static keyword are known as class fields, because\
    \ they are created and initialized when the class template is loaded in the MethodArea\
    \ memory. Fields declared without the static keyword are known as instance fields,\
    \ and they are created and initialized when a class copy is made in the HeapArea\
    \ memory. The source code for fields looks like this:\n\n```\nclass OuterClass\n\
    {\n    static boolean classField = true;\n    boolean instanceField = true;\n\
    }\n```\n\nMethods can be declared as either static or non-static as well. Although\
    \ methods are not initialized with a value after they are loaded into memory like\
    \ fields, they are still loaded into memory somewhere. Class methods are stored\
    \ in MethodArea memory, and they are created as soon as their class template is\
    \ loaded into MethodArea memory. Thus they can be called by referencing the class\
    \ template itself. Instance methods are stored in HeapArea memory, and they are\
    \ created when a new class instance copy is loaded into HeapArea memory. Thus,\
    \ instance methods must be called by referencing the address of a class instance.\
    \ Methods are written into classes like so:\n\n```\nclass OuterClass\n{\n    static\
    \ void className()\n    {\n        //\n    void instanceMethod()\n    {\n    }\n\
    ```\n\nThe previous four components: nested classes, nested interfaces, fields,\
    \ and methods; are special because they all can be inherited by subclasses. The\
    \ remaining three structures, explained next, cannot be inherited by subclasses."
  - "[PAGE 98]\n\nStatic initialization code blocks indicate code that should be run\
    \ only once, when a class template is first loaded into MethodArea memory. As\
    \ we saw above, the code in the static initialization block is incorporated into\
    \ a special method called the <clinit> method, which JVM runs immediately after\
    \ loading a class template. In source code, the static class block looks like\
    \ this:\n\n```\nclass Class {\n  static {\n    // local variables\n  }\n}\n```\n\
    \nAnalogous to static initialization blocks, there are also non-static code initialization\
    \ blocks, which are run every time a new class instance is created in the HeapArea\
    \ memory. The code inside an instance initialization block goes inside an <init>\
    \ method in the .class file. It looks like this:\n\n```\nclass Class {\n  // local\
    \ variables\n}\n```\n\nConstructors The final non-inheritable structure is a constructor.\
    \ Constructors are a special type of method which are executed every time a class\
    \ instance is created with the new keyword. They are run at the same time as a\
    \ non-static initialization code block, and the code inside a constructor also\
    \ goes inside an <init> method for JVM. Constructors in source code are different\
    \ from static initialization blocks however, because a constructor can take parameters\
    \ via its parentheses. Thus, a constructor is more flexible than an instance initialization\
    \ code block. Despite being able to take parameters however, constructors are\
    \ very different from methods, because:\n\n+   * They have no return type and\
    \ cannot return values\n* Their name is always the name of the class it itself"
  - "[PAGE 99]\n\n+   • A constructor must be invoked every time class instance object\
    \ is created\n\nIf you don't explicitly write a constructor into your class, then\
    \ JVM will automatically add one for you in the ClassFile, which will be a call\
    \ to the constructor of your class's superclass. Also, if you inherit any superclass\
    \ fields that need initialization, and you don't initialize them in your class,\
    \ then JVM will automatically call the superclass constructor. Constructors look\
    \ like this:\n\n```\nclass MyClass\n{\n    MyClass() // default constructor\n\
    \    {\n        super();\n    }\n    MyClass(int a, int b) // passing data into\
    \ a constructor\n    {\n        int c = a + b;\n    }\n}\n```\n\nThe super keyword\
    \ is a variable that points to the memory address of the class template of your\
    \ class's super class. You can read what your class's superclass is in the javap\
    \ output. Except for Java's topmost class, java/lang/Object, every class has a\
    \ superclass."
- md: "\n## Class Meta-Members\n\nThere are three meta-information structures that\
    \ you might see in a class. These are single-line comments, multi-line comments,\
    \ and annotation interfaces. All of these structures are used to store useful,\
    \ but unnecessary information about a Java program. That is to say, these structures\
    \ can be typed into your source code file, but they never affect fields, methods,\
    \ or the execution of your program in any way. They are simply a nice way of keeping\
    \ things organized and documented.\n\nSingle line comments are simple. Anything\
    \ coming after two forward slashes is commented out of the program:\n\n```java\n\
    class SomeClass {\n  // this is a comment\n  int field = 1; // this is also a\
    \ comment\n}\n```\n\nMulti-line comments are easy too. You put two asterisks between\
    \ two forward slashes and anything in between is commented out:\n\n```java\nclass\
    \ SomeClass {\n  /* This is a\n     multi-line comment\n  * You can do this too\n\
    \  */\n}\n```\n\nAnnotation interfaces are tricky because they can come in three\
    \ varieties, have several uses, and can interact with the java compiler. To explain\
    \ briefly, an interface is similar in appearance to a class, but it cannot have\
    \ any fields, only methods. The only thing you can define about the methods are\
    \ their return types, names, and parameters. Method signatures are allowed because\
    \ interfaces are intended to be inherited by classes. To create your own annotation\
    \ interface, you write what appears to be a regular interface, but with the `@`\
    \ symbol in front of the keyword, like so:\n\n```java\n@interface FieldAnnotation\
    \ {}\n```\n\nNow you can use this annotation interface in source code. When you\
    \ do, you must always add it to a specific element, like a class, field, or method.\
    \ For example:\n\n```java\nclass ExampleClass {\n  @FieldAnnotation int someNumber\
    \ = 1;\n  @FieldAnnotation int anotherNumber = 2;\n}\n```\n\nYou can see in the\
    \ above example that the annotation goes directly in front of the thing you want\
    \ to associate with. You can put it on the same line if you want, or the line\
    \ above, which is a common way to write them. Another way to use annotation interfaces\
    \ is to include a method in its declaration. However, an annotation interface\
    \ is actually used like a field that stores data. For example, the following annotation\
    \ interface declares a method that has a return type of String, and it is used\
    \ in source code like a field:\n\n```java\n// Custom Annotation Interface Definition\n\
    @interface Programmed {\n  String value();\n}\n```\n\n```java\n// Using the annotation\
    \ type to mark a class\n@Programmed(value = \"B\")\nclass SomeClass {}\n```\n\n\
    Finally, I want to bring your attention to a fun fact: Java allows annotation\
    \ interface definitions in order to apply some properties to that interface. In\
    \ other words, it is metadata!\n\n```java\n@interface AnnotationInterfaceDefinition\
    \ {}\n```\n\nSo annotations can get confusing, but just remember they are not\
    \ required in any way for your program to function normally. They are really designed\
    \ for use by professional software companies to keep track of version information\
    \ and metadata. If you see an annotation, you can ignore it if you want.\n\n##\
    \ Restricting Access to Classes\n\nEarlier in this book when we dissected the\
    \ .class file, you may have noticed a section of the class file referred as access\
    \ flags. This is the two-byte section following the constant pool entries, and\
    \ the flags it contains are bits. Every bit has a different meaning, and the very\
    \ last bit on the right is called the public flag. This bit is set to 1 if you\
    \ declare the class to be a public class, and it is set to 0 if you don't. What\
    \ does it mean for a class to be public or non-public?\n\nIn short, a public class\
    \ can be used by code in a package that is different from the package your class\
    \ is. And a non-public (default) class can only be used by code that is labeled\
    \ as part of the same package. We will cover packages much later, but basically\
    \ they are a way to group classes together. Every class in Java is part of a package,\
    \ whether you explicitly declare it or not. You explicitly declare a class to\
    \ be part of a package by putting the `package` keyword plus the package name\
    \ in front of your class's source code. If you don't explicitly declare a package\
    \ for your class, then the JVM will automatically create a package for you and\
    \ put your class in without telling you.\n\nNow about class-level restriction,\
    \ let's first look at a default access (package-private) class by writing one\
    \ in Java source code. We will also explicitly declare this class's package, since\
    \ every Java class is required to be inside a package, and we might as well be\
    \ clear about it:\n\n```java\npackage testpackage;\n\nclass DefaultAccessClass\
    \ {\n}\n```\n\nThis class has default access restriction, meaning it can only\
    \ be used by other classes in the testpackage package. The javap output for this\
    \ class is:\n\n```\nclass DefaultAccessClass\n  minor version: 0\n  major version:\
    \ 60\n  flags: (0x0020) ACC_SUPER\n  this_class: #7 // DefaultAccessClass\n  super_class:\
    \ #2 // java/lang/Object\n  interfaces: 0, fields: 0, methods: 1, attributes:\
    \ 1\n  Constant pool:\n    #1 = Methodref #2.#3 // java/lang/Object.<init>():V\n\
    \    #2 = Class #4 // java/lang/Object\n    #3 = NameAndType\n    #4 = Utf\n \
    \   #5 = Utf\n    #6 = Utf\n    #7 = Class\n    #8 = Utf\n    #9 = Utf\n    #10\
    \ = Utf\n    #11 = Utf\n    #12 = Utf\n    #5:#6 // \"init\":():V\n    java/lang/Object\n\
    \    <init>\n    #8:#7 // DefaultAccessClass\n```\n"
  mdcn: "\n\n## 类元成员 (Class Meta-Members)\n\n在类中你可能会看到三种元信息结构。这些是单行注释、多行注释和注解接口。所有这些结构都用于存储关于\
    \ Java 程序有用但非必需的信息。也就是说，这些结构可以写在你的源文件中，但它们永远不会以任何方式影响字段、方法或你程序的执行。它们仅仅是保持组织整洁和记录的一种良好方法。\n\
    \n单行注释非常简单。在两个正斜杠 `//` 之后的任何内容都会被程序注释掉：\n\n```java\nclass SomeClass {\n  // this\
    \ is a comment\n  int field = 1; // this is also a comment\n}\n```\n\n多行注释也很简单。你在两个正斜杠之间放置两个星号，其之间的任何内容都会被注释掉：\n\
    \n```java\nclass SomeClass {\n  /* This is a\n     multi-line comment\n  * You\
    \ can do this too\n  */\n}\n```\n\n注解接口比较复杂，因为它们有三种变体，有多种用途，并且可以与 Java 编译器交互。简单来说，接口的外观与类相似，但它不能包含任何字段，只能有方法。你对方法唯一定义的是它们的返回类型、名称和参数。接口允许方法签名，因为接口旨在被类继承。要创建你自己的注解接口，你只需要编写一个看起来像普通接口的内容，但在关键字前面加上\
    \ `@` 符号，如下所示：\n\n```java\n@interface FieldAnnotation {}\n```\n\n现在你可以在源代码中使用这个注解接口了。当你使用它时，必须始终将其添加到特定的元素上，例如类、字段或方法。例如：\n\
    \n```java\nclass ExampleClass {\n  @FieldAnnotation int someNumber = 1;\n  @FieldAnnotation\
    \ int anotherNumber = 2;\n}\n```\n\n你从上面的示例中看到，注解直接放在你想要关联的物体前面。如果你愿意，可以将其放在同一行，也可以放在上方的一行，这是编写注解的常用方式。使用注解接口的另一种方法是在其声明中包含一个方法。然而，注解接口实际上的使用方式像存储数据的字段一样。例如，下面的注解接口声明了一个返回类型为\
    \ `String` 的方法，并在源代码中像字段一样使用它：\n\n```java\n// Custom Annotation Interface Definition\n\
    @interface Programmed {\n  String value();\n}\n```\n\n```java\n// Using the annotation\
    \ type to mark a class\n@Programmed(value = \"B\")\nclass SomeClass {}\n```\n\n\
    最后，我想请你注意一个有趣的知识：Java 允许注解接口定义是为了给该接口应用某些属性。换句话说，它是元数据！\n\n```java\n@interface\
    \ AnnotationInterfaceDefinition {}\n```\n\n所以注解可能会让人困惑，但请记住，程序的正常运行完全不需要它们。它们真正的设计目的是供专业软件公司用于跟踪版本信息和元数据。如果你看到注解，可以忽略忽略它。\n\
    \n## 限制类的访问权限 (Restricting Access to Classes)\n\n在本书前面的部分解析 `.class` 文件时，你可能注意到类文件中有一个被称为访问标志（access\
    \ flags）的区域。这是常量池条目后的双字节区域，它包含的标志是位（bits）。每个位都有不同的含义，最右边的最后一个位被称为公共标志（public flag）。如果你将类声明为公共类，该位被设置为\
    \ 1；如果不是，则设置为 0。类是公共或非公共意味着什么？\n\n简而言之，公共类可以被与该类所在包不同的包的代码使用。而非公共（默认）类只能被标记为同一包一部分的代码使用。我们将在稍后详细介绍包，但基本上，它们是将类分组在一起的方法。无论你是否显式声明，Java\
    \ 中的每个类都是某个包的一部分。你通过在类源码前面加上 `package` 关键字和包名来显式声明一个类属于某个包。如果你不显式为类声明包，JVM 将自动创建一个包并将你的类放入其中。\n\
    \n关于类级限制，让我们先通过在 Java 源码中写一个默认访问（包私有）类来看。我们也会显式声明该类的包，因为每个 Java 类都要求位于包内部，我们最好明确这一点：\n\
    \n```java\npackage testpackage;\n\nclass DefaultAccessClass {\n}\n```\n\n该类有默认访问限制，意味着它只能被\
    \ testpackage 包中的其他类使用。该类的 `javap` 输出如下：\n\n```\nclass DefaultAccessClass\n  minor\
    \ version: 0\n  major version: 60\n  flags: (0x0020) ACC_SUPER\n  this_class:\
    \ #7 // DefaultAccessClass\n  super_class: #2 // java/lang/Object\n  interfaces:\
    \ 0, fields: 0, methods: 1, attributes: 1\n  Constant pool:\n    #1 = Methodref\
    \ #2.#3 // java/lang/Object.<init>():V\n    #2 = Class #4 // java/lang/Object\n\
    \    #3 = NameAndType\n    #4 = Utf\n    #5 = Utf\n    #6 = Utf\n    #7 = Class\n\
    \    #8 = Utf\n    #9 = Utf\n    #10 = Utf\n    #11 = Utf\n    #12 = Utf\n   \
    \ #5:#6 // \"init\":():V\n    java/lang/Object\n    <init>\n    #8:#7 // DefaultAccessClass\n\
    ```\n\n"
