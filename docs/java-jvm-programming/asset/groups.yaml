  mdcn: "\n\n![](img/c8857ea016f1259bfbfe6939f1314dc2_108_0.png)\n\n这张图中两个要点。第一是同一个包内的类始终可以相互访问。第二是包外部的类只能访问标记有\
    \ `public` 关键字的类。\n\n- 包内部的类无论访问限制如何，都可以可以相互访问。\n- 只有标记为 `public` 的类才能被从其包外部访问。\n\
    - 默认（无关键字）标记的类对其他包的类不可用。\n\n关于类访问唯一需要知道的另一点是，它是类内部字段和方法的第一道屏障，每个字段和方法都有自己的访问限制！你将在下一节中发现，字段和方法被标记为四个访问限制级别之一。因此，即使字段或方法被标记为可供外部类访问，如果类整体是被禁止的，它们仍然无法被访问。\n\
    \n## 限制类成员的访问\n\n正如在类组件部分提到的，有七种被称为类成员的内容可以放在你的类中。它们是：\n\n- 类 (classes)\n- 接口\
    \ (interfaces)\n- 字段 (fields)\n- 方法 (methods)\n- 静态初始化代码块 (static initialization\
    \ code blocks)\n- 实例初始化代码块 (instance initialization code blocks)\n- 构造函数 (constructors)\n\
    \n除了两种初始化块类型，这些组件都标记有各自的访问限制级别。这意味着五个类组件具有访问限制：\n\n- 类\n- 接口\n- 字段\n- 方法\n- 构造函数\n\
    \n这些组件有四种可能的访问限制级别。其中三个通过在源代码中输入特殊的关键字指示，一个是默认访问限制级别，它通过没有关键字来指示：\n\n- public\n\
    - protected\n- default（无关键字）\n- private\n\n对于所有五个类成员来说，访问限制实际上是强制性的，这意味着你创建的每个类中的每个类组件都有某种程度的访问限制。之所以这在源代码中并不显而易见，是因为默认访问级别没有关联的关键字，所以如果你简单地忽略访问限制，你的代码仍然可以工作，因为\
    \ JVM 会自动将你的变量分配给默认访问限制。\n\n由于五个类组件和四个访问限制级别，它们的组合数量是有限的：\n\n- 嵌套类 (Nested Class)\n\
    \    - public class C {}\n    - protected class C {}\n    - default class C {}\n\
    \    - private class C {}\n\n- 嵌套接口 (Nested Interface)\n    - public interface\
    \ I {}\n    - protected interface I {}\n    - default interface I {}\n    - private\
    \ interface I {}\n\n- 字段 (Field)\n    - public boolean boolField;\n    - protected\
    \ boolean boolField;\n    - default boolean boolField;\n    - private boolean\
    \ boolField;\n\n- 方法 (Method)\n    - public void Method()\n    - protected void\
    \ Method()\n    - default void Method()\n    - private void Method()\n\n- 构造函数\
    \ (Constructor)\n    - public ClassName()\n    - protected ClassName()\n    -\
    \ default ClassName()\n    - private ClassName()\n\n此时，你可能在想 `static` 关键字如何影响访问限制系统。回想\
    \ `static` 关键字可以与五个类组件中的每一个关联，其目的是告诉 JVM 将该组件存储在 MethodArea（方法区）内存中，这是一个共享的、全局的始终存在的内存位置。非静态组件存储在\
    \ HeapArea（堆区）内存中，只有当使用 `new` 关键字创建类实例或数组对象时，它们才会被创建。\n\n事实证明向类组件添加 `static` 不会任何方式影响其访问限制级别。静态字段仍然声明在类内部，而类仍然是包的一部分。因此，相同的访问限制适用于静态字段，就像适用于非静态字段一样。\n\
    \n`static` 关键字唯一改变的是该成员能够被其他标记为非静态的代码访问的能力。你会在 Java 中频繁地看到此错误消息，这是因为 Java 编译器的设计是寻找任何\
    \ MethodArea（静态）方法、字段等，并尝试访问 HeapArea（非静态）内容。Java 仅仅会将此标记为潜在问题且无法编译。\n\n因此，`static`\
    \ 可以在某些情况下限制对非静态代码的访问。但这一事实并没有以任何方式改变访问限制系统。它们是两个独立的系统。现在让我们检查访问限制的四种级别，看看它们是如何运作的：\n\
    \n`public` 成员限制意味着任何地方的代码都可以使用此组件。无论代码是否在不同的包、不同的类或继承的子类中：![](img/c8857ea016f1259bfbfe6939f1314dc2_113_0.png)\n\
    \n对于这个示例，此类包含一个 `String` 类型的 public 字段：\n\n```\npublic class C1\n{\n    public\
    \ String s = \"hello\";\n}\n```\n\n如果你编译这个类并使用 `jav` 检查 `.class` 文件，你会看到：\n\n\
    ```\npublic class C1\nminor version: 0\nmajor version: 6\nflags: (0x021) ACC_PUBLIC\n\
    super_class: #10\ninterfaces: 0, fields: 1, methods: 1\nConstant pool:\n#1 = Methodref\
    \      #2.#3      // java/lang/Object.<init>():V\n#2 = Class           // java/lang/Object\n\
    #3 = NameAndType     #5:6       // <init>():V\n#4 = Utf           java/lang/Object\n\
    #5 = <init>\n#6 = Utf           (V)\n#7 = String #8 // hello\n#8 = Utf\n#9 = Fieldref\
    \ #10.#11 // C1.s:Ljava/lang/String;\n#10 = Class #12 // C1\n#11 = NameType #14\
    \ // s:L/lang/String;\n#12 = Utf 8\n#13 = Utf C1\n#14 = Utf Ljava/lang/String;\n\
    #15 = Utf Code\n#16 = Utf LineNumberTable\n#17 = Utf C1.java\n\n{\npublic java.lang.String\
    \ s;\ndescriptor: Ljava/lang/String;\nflags: (0x0001) ACC_PUBLIC\n\npublic C1();\n\
    descriptor: ()V\nflags: (0x0001) ACC_PUBLIC\nstack=2, locals=1, args_size=1\n\
    0: aload_0 // Method\n1: invokespecial #1\njava/lang/Object.<init>():V\n4: aload_0\
    \ #7 String\n5: ldc\n7: putfield #9 Field s:Ljava/lang/String;\n10: return\nLineNumberTable:\n\
    line 1: 0\nline 3: 4\n}\n```\n\nSourceFile: \"C1.java\" 是你在源代码中输入的字段（类型为 `java/lang/String`\
    \ 的变量 `s`）。该字段被标记为 public，与字段关联的 flags 显示了 `.class` 文件中的该字段访问位。输出显示该类有一个方法（自动的\
    \ `<init>` 实例构造器方法），还有一个属性（SourceFile 字段）。\n\n我们可以通过二进制检查这两个 flags，查看 `.class`\
    \ 文件是如何存储字段的。`0x0001` 的表示是：\n\n```\n0000000000000001\n```\n\n最右边的位是 PUBLIC 访问位，它确实被设置为\
    \ 1。\n\n`protected` 成员限制意味着此组件可以被同一个包内的任何代码以及来自其他包的子类代码使用。未继承该成员类的包外部类无法访问此成员：![](img/c8857ea016f1259bfbfe6939f1314dc2_115_0.png)\n\
    \n对于具有 `protected` 字段的类，源代码是：\n\n```java\npublic class C1\n{\n  protected String\
    \ s = \"hello\";\n}\n```\n\n在 Class 文件的 jalap 输出中，该字段被列为：\n\n```\nprotected java.lang.String\
    \ s;\ndescriptor: Ljava/lang/String;\nflags: (0x0004) ACC_PROTECTED\n```\n\n其二进制为：0000000000000100\n\
    \n所以你可以看到从右侧数起第三位被设置为 1，表示该字段具有 protected 访问限制。\n\n`default`（无关键字）成员限制防止另一个包中的任何代码访问此成员，无论另一个包中的类是否继承自该成员的类：![](img/c8857ea016f1259bfbfe6939f1314dc2_116_0.png)\n\
    \n对于默认类成员访问，你不需要在源代码中输入任何特殊的关键字：\n\n```java\npublic class C1\n{\n  String s =\
