- md: "\n## So what exactly is a module?\n\nIt is a collection of packages and their\
    \ classes, placed into the same folder, and with a special type of .java file\
    \ called the module-info file. This special file must be located in the base folder\
    \ of the module. It says which of the module's packages are available to code\
    \ in other modules. It also says which code from which other modules are required\
    \ for its own classes to run properly.\n\nThe basic structure of a module-info.java\
    \ file is:\n\n```\nmodule modulename // keyword + the name of the module\nexports\
    \ package; // allow outside code to use this package\nrequires module; // access\
    \ code from another module\n```\n\n- module :: this is a Java source keyword,\
    \ and it tells the compiler you are writing a module-info definition\n- modulename\
    \ :: this is the name of your module, it can be only letters, or a combination\
