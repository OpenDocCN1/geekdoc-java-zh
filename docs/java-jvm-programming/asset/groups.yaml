    CA FE BA BE 00 00 3C 00 0F 0A 00 02 03 07 07 04 0C 0C\n05 00 06 01 00 10 6A 71\
    \ 61 2F 6C 61 6E 67 2F 4F 62 6A 65\n63 74 01 01 00 63 69 6E 79 74 3E 01 00 23\
    \ 28 59 56 07 00 08\n01 01 05 45 6D 70 74 01 01 00 04 43 64 65 05 01 00 04 0F\
    \ 4F 4C 4C\n6E 45 45 75 62 62 62 51 61 65 01 01 00 04 61 69 69\n01 01 06 28 28\
    \ 4C 6C 61 71 61 2F 6C 61 6E 67 2F 5F 74 74 62 n9E 6E 37 39 26 51 01 00 53 53\
    \ 61 75 73 63 65 65 61 01 00 00\n0A05 00 74 70 79 61 61 61 61 01 00 00 02 00 00\
    \ 00 00\n00 00 00 00 00 00 00 01 01 00 00 00 00 01 01 01\n01 01 01 00 00 05 27\
    \ 01 01 00 00 01 01 00 00 06\n00 01 01 00 00 01 09 00 00 0C 01 00 09 00 19\n00\
    \ 00 01 00 00 01 01 01 01 01 00 00 00 01 01 01 00 00 00 00 02 0 0\n```\n\n池项 #2\
    \ 存储了该类的父类名称。它实际上指向另一个池项 #4，该项包含字符串 \"java/lang/Object\"，即 Empty 类的全限定名。在 Empty\
