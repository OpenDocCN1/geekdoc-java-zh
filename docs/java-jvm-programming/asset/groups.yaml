    \ labeled public can be accessed from outside of its package.\n- Default (no keyword)\
    \ labeled classes are not available to classes from other packages.\n\nThe only\
    \ other thing to know about class access is that it serves as the first barrier\
    \ to the fields and methods within a class, which each have their own access restrictions!\
    \ As you will find in the next section, fields and methods are marked with one\
    \ of four levels of access restriction. Therefore, even if a field or method is\
    \ marked as accessible to outside classes, they are still not accessible if the\
    \ class as a whole is off-limits.\n\n## Restricting Access to Class Members\n\n\
    As mentioned in the class components section, there are seven things, known as\
    \ the class members, that you can put inside of your classes. They are:\n\n- classes\n\
    - interfaces\n- fields\n- methods\n- static initialization code blocks\n- instance\
    \ initialization code blocks\n- constructors\n\nExcept for the two types of initialization\
    \ blocks, these components are all tagged with their own personal level of access\
    \ restriction. That means five of the class components have access restriction:\n\
    \n- classes\n- interfaces\n- fields\n- methods\n- constructors\n\nThere are four\
    \ possible access restriction levels for these components. Three are indicated\
    \ by typing a special keyword into your source code, and one is the default level\
    \ of access restriction, which is indicated by not having a keyword:\n\n- public\n\
    - protected\n- default (no keyword)\n- private\n\nAccess restriction is actually\
    \ mandatory for all five class members, meaning that every class component in\
    \ every class that you ever make has some level of access restriction. The reason\
    \ why this isn't obvious in the source code is because the default access level\
    \ does not have a keyword associated with it, so if you simply ignore access restrictions,\
    \ your code will still work because the JVM is automatically assigning your variables\
    \ to the default access restriction.\n\nWith five class components and four access\
    \ restriction levels, there are a finite number of combinations of these:\n\n\
    - Nested Class\n    - public class C {}\n    - protected class C {}\n    - default\
    \ class C {}\n    - private class C {}\n\n- Nested Interface\n    - public interface\
    \ I {}\n    - protected interface I {}\n    - default interface I {}\n    - private\
    \ interface I {}\n\n- Field\n    - public boolean boolField;\n    - protected\
    \ boolean boolField;\n    - default boolean boolField;\n    - private boolean\
    \ boolField;\n\n- Method\n    - public void Method()\n    - protected void Method()\n\
    \    - default void Method()\n    - private void Method()\n\n- Constructor\n \
    \   - public ClassName()\n    - protected ClassName()\n    - default ClassName()\n\
    \    - private ClassName()\n\nAt this point, you might be wondering how the static\
