- md: "\n# Java & JVM\n\n```\ntry\n{\n    int x = 1/0;\n}\n0: iconst_1\n1: iconst_0\n\
    2: idiv\n3: istore_1\n```\n\nJava Programming Language and its representation\
    \ in the Java Virtual Machine\n\nChristopher Panaretos\nISBN 9798777210463\n\n\
    - Analysis of a .class file 2\n- JVM Memory Areas 86\n- Class Members 95\n- Class\
    \ Meta-Members 100\n- Restricting Access to Classes 104\n- Restricting Access\
    \ to Class Members 109\n- Organizing Classes into Packages 119\n- Organizing Packages\
    \ into Modules 131\n- Storing Information in Fields 147\n- Manipulating Information\
    \ with Methods 192\n- Exception and Error Handling 201\n\n## Analysis of a class\
    \ File\n\nBefore starting, a quick introduction - this book is intended for intermediate\
    \ level Java learners, because it gets into the weeds of .class files and how\
    \ the JVM works. However, I believe studying the .class files and JVM is the best\
    \ way to learn Java, so I think beginners could benefit as well.\n\nThis book\
    \ assumes you know how to make a .java file and compile to a .class file, as well\
    \ as the basic Java source code commands, like static and non-static initialization\
    \ blocks, fields, and methods.\n\nAs you will see, many of these basic Java programming\
    \ concepts are not explicitly included in this book. The reason is because there\
    \ are already good books and websites that will teach you these basic Java operations\
    \ and commands. One very important website you should definitely check out is\
    \ the official Java Language Specification:\n\nhttps://docs.oracle.com/javase/specs/index.html\n\
    \nWhich has a guide for the Java source code language, and another guide for the\
    \ Java Virtual Machine. These official documents might be the best source of information\
    \ you can find, but they are very technical and hard to read. Hopefully this book\
    \ will bridge gap, at least a little bit, by covering some of these technical\
    \ topics in a way that is easier to absorb.\n\nLet's jump right in, by examining\
    \ a simple Java class, and see how its source code is represented in a compiled\
    \ .class file:\n\nEmpty.java is an example of class, written in Java source code:\n\
    \n```java\n// Empty.java\nclass Empty {\n    static public void main(String[]\
    \ args) {\n    }\n}\n```\n\n- `class`: the Java keyword class declares that the\
    \ following word will be the name of a class template\n- `Empty{}`: the word Empty\
    \ is not a Java keyword, it is simply some text that will be used to identify\
    \ this class template - it is common to make the first letter of a class name\
    \ capitalized, but you could use all lowercase letters if you want; the curly\
    \ brackets enclose everything inside the Empty class\n- `static public void main(String[]\
    \ args){`: this is a method, the name of the method main, it takes String array\
    \ named args as a parameter, void means the method returns no value, public means\
    \ any code can use this method, static means this method's information is stored\
    \ in MethodArea memory; also this method is required as the program's entry point\
    \ if we want to run this class as a program in JVM\n\nCompared to other classes,\
    \ this Empty class is very simple. It only declares one method, which does nothing.\
    \ There is nothing else in the class. But it does compile to a .class file, and\
    \ this .class file contains all the information needed to run this class as a\
    \ Java program.\n\nEmpty.class is the bytes produced by the Java compiler. Below\
    \ is an image of the file's data when viewed with a hex editor. The data do not\
    \ seem to make any sense, but this file does in fact have a specific format, called\
    \ the Class format. This file, and its information, can be directly executed by\
    \ the Java Virtual Machine, JVM. Being able to read a .class file and understand\
    \ its data is critical to understanding how the Java programming language and\
    \ the JVM work together. Therefore, in the next 75 pages, we will examine the\
    \ information stored about this simple Java class, Empty.class:\n\n## Empty.class\n\
    \n| Offset (h) | 00 01 02 03 04 05 06 07 | Decoded text |\n|---|---|---|\n| 00000000\
    \ | CA FE BE 00 00 00 3C | Ëþ¤...< |\n| 00000008 | 00 0F 0A 00 02 00 03 07 | ..\
    \ |\n- 00000010 | 00 04 0C 00 05 00 06 01 | .. |\n- 00000018 | 00 10 6A 61 76\
    \ 61 2F 6C | ..java/ |\n- 00000020 | 61 6E 67 7F 42 6A 65 6A | ang/Obje |\n- 00000028\
    \ | 63 74 01 60 00 3C 69 6E | ct...in |\n- 00000030 | 69 74 3E 01 00 03 28 29\
    \ | it...)... ( |\n- 00000038 | 56 07 00 08 01 00 05 45 | V....E |\n- 00000040\
    \ | 6D 70 74 79 01 00 04 43 | mpyty...C |\n- 00000048 | 6F 64 65 01 00 0F 4C 69\
    \ | ode...Li |\n- 00000050 | 6E 65 4E 74 65 62 65 72 | neNumber |\n- 00000058\
    \ | 54 61 62 6C 65 01 00 04 | Table.... |\n- 00000060 | 6D 64 69 6E 61 01 16 28\
    \ | main... ( |\n- 00000068 | 61 6E 67 2F 53 74 72 26 | [Java/1 |\n- 00000070\
    \ | 6E 6E 67 7F 53 74 72 69 | ang/Stri |\n- 00000078 | 6E 67 3B 29 56 01 00 0A\
    \ | ng);V |\n- 00000080 | 53 6F 72 63 65 46 69 | SourceFI |\n- 00000088 | 65 01\
    \ 00 04 45 63 64 70 | le...Emp |\n- 00000090 | 74 79 2E 65 61 76 61 | ty.java.\
    \ |\n- 00000098 | 20 00 07 00 02 00 00 | |\n- 000000A0 | 00 00 02 00 00 00 05\
    \ 00 | |\n- 000000A8 | 06 00 01 01 09 00 00 00 | |\n- 000000B0 | 01 0D 00 01 01\
    \ 00 00 00 | |\n- 000000B8 | 05 2A B7 00 01 B1 00 00 | |\n- 000000C0 | 00 01 01\
    \ 00 00 00 06 | |\n- 000000C8 | 00 01 00 00 00 01 00 09 | |\n- 000000D0 | 00 0B\
    \ 00 0C 00 01 00 09 | |\n- 000000D8 | 00 00 00 19 00 00 01 | |\n- 000000E0 | 00\
    \ 00 00 01 B1 00 00 | |\n- 000000E8 | 01 00 0A 00 00 06 00 | |\n- 000000F0 | 01\
    \ 01 00 00 05 01 00 00 | |\n- 000000F8 | 0D 00 00 02 02 00 0E | ..\n\nEmpty.java\
    \ source code is of course easy to read since it is written in plaintext. The\
    \ compiled .class file is not easy to read because information is arranged in\
    \ ClassFile format, not human readable. However, the ClassFile format is posted\
    \ on the Java Virtual Machine Specification: https://docs.oracle.com/javase/specs/index.html\n\
    \nAnd it is possible to walk through a .class file in a hex editor to view the\
    \ data. That is exactly what we are going to do. This is the general format of\
    \ a .class file:\n\n```java\nClassFile {\n    4 magic;\n    2 minor_version;\n\
    \    2 major_version;\n    2 constant_pool_count;\n    constant_pool cp[];\n \
    \   2 access_flags;\n    2 super_class;\n    2 interfaces_count;\n    field_info\
    \ fields[];\n    2 methods_count;\n    method_info methods[];\n    2 attributes_count;\n\
    \    attribute_info attributes[];\n}\n```\n\nTo store information about a Java\
    \ class, some parts have a length, but other parts can be expanded. The expandable\
    \ parts are the lists: constant_pool[], interfaces[], methods[], attributes[].\
    \ Special note: attributes are not written in source code. They are created by\
    \ the compiler, and give additional information about the class.\n\nTo break down\
    \ a class file you must start at the start. The first 4 bytes (32 bits) of the\
    \ file must be Hex values 0xCAFEBABE, and you can see that away:\n\n```\nCA FE\
    \ BA BE 00 00 3C 00 0F 0A 00 02 03 07 04 0C 00\n05 00 06 01 00 10 6A 61 76 61\
    \ 2F 6C 61 6E 03 03 28 59 57 00 08\n63 74 01 75 6D 62 65 72 54 61 62 65 01 00\
    \ 04 6D 69 6E\n01 00 45 6D 70 74 79 01 00 04 63 64 65 01 01 00 4C 69\n6E 65 4E\
    \ 73 69 51 61 71 61 71 75 75 62 65 65 65 61 55 74 72 61\n01 00 16 28 5B 4A 6A\
    \ 61 76 25 61 61 61 67 53 74 72 69\n6E 67 3B 29 56 01 00 6A 61 76 76 75 73 63\
    \ 69 65 61 00 00 00 02 00 00 05 00 06 01 01 09 00 00 00 10 00 00 06\n0A 45 6D\
    \ 70 74 79 2E 6A 61 76 61 00 20 07 00 02 00 00\n00 00 00 00 00 00 00 00 00 00\
    \ 01 01 01 01 00 00 00 00 00 01 01 01 01 00 00 00 01 00 00 09 00 00 00 00\n00\
    \ 01 00 00 01 00 00 00 B1 00 00 00 01 00 00 00 00 00 00 00\n01 00 00 00 00 00\
    \ 01 00 00 00 00 00 00 00 00 00 E\n```\n"
  mdcn: "\n\n# Java & JVM\n\n```\ntry\n{\n    int x = 1/0;\n}\n0: iconst_1\n1: iconst_0\n\
    2: idiv\n3: istore_1\n```\n\nJava 语言及其在 Java 虚拟机（JVM）中的表示\n\nChristopher Panaretos\n\
    ISBN 9798777210463\n\n- .class 文件分析 2\n- JVM 内存区域 86\n- 类成员 95\n- 类元数据成员 100\n\
    - 限制对类的访问 104\n- 限制对类成员的访问 109\n- 将类组织成包 119\n- 将包组织成模块 131\n- 在字段中存储信息 147\n\
    - 使用方法操纵信息 192\n- 异常与错误处理 201\n\n## 类文件分析\n\n在开始之前，先简要介绍一下——这本书面向中级水平的 Java 学习者，因为它深入探讨了\
    \ .class 文件的细节以及 JVM 的工作原理。然而，我相信学习 .class 文件和 JVM 是学习 Java 的最佳方式，因此我认为初学者也能从中受益。\n\
    \n本书假设你已经如何创建一个 .java 文件并将其编译为 .class 文件，并且熟悉基本的 Java 源代码命令，如静态和非静态初始化块、字段和方法。\n\
    \n正如你将看到的，这些许多基础的 Java 编程概念并没有显式地包含在书中。原因是已经有很多优秀的书籍和网站会教你这些基础的 Java 操作和命令了。你绝对应该查看的一个非常重要的网站是\
    \ Java 官方语言规范：\n\nhttps://docs.oracle.com/javase/specs/index.html\n\n它包含了一份 Java\
    \ 源代码语言指南和另一份关于 Java 虚拟机的指南。这些官方文档可能是你能找到的最详尽的信息源，但它们非常技术化且难以阅读。希望这本书能够通过更易吸收的方式涵盖其中一些技术话题，至少能弥补一点鸿沟。\n\
    \n让我们直接进入主题，通过检查一个简单的 Java 类，看看它的源代码在编译后的 .class 文件是如何表示的：\n\nEmpty.java 是用 Java\
    \ 源代码编写的类示例：\n\n```java\n// Empty.java\nclass Empty {\n    static public void\
    \ main(String[] args) {\n    }\n}\n```\n\n- `class`：Java 关键字 `class` 声明后面的单词将作为类模板的名字\n\
    - `Empty{}`：单词 Empty 不是 Java 关键字，它只是用于标识此类模板的某些文本——通常将类名的首字母大写，但如果你愿意也可以使用全小写字母；大括号包含了\
    \ Empty 类内部的所有内容\n- `static public void main(String[] args){`：这是一个方法，方法名为 main，它接受一个名为\
    \ args 的 `String` 数组作为参数，`void` 表示方法没有返回值，`public` 表示任何代码都可以使用此方法，`static` 表示此方法的信息存储在方法区（MethodArea）内存中；此外，如果我们想在\
    \ JVM 中作为程序运行此类，则该方法是程序的入口点。\n\n与其他类相比，这个 Empty 类非常简单。它只声明了一个方法，且该方法什么都不做。类中没有其他内容。但它确实可以编译为\
    \ .class 文件，而这个 .class 文件包含了运行该类作为 Java 程序所需的所有信息。\n\nEmpty.class 是 Java 编译器产生的字节。下面是使用十六进制编辑器查看时该文件的数据图像。这些数据看起来没有任何意义，但这个文件确实有一种特定的格式，称为类格式（Class\
    \ format）。该文件及其信息可以被 Java 虚拟机 JVM）直接执行。能够读取 .class 文件并理解其数据对于理解 Java 编程语言和 JVM\
    \ 如何协同工作至关重要。因此，在接下来的 75 页中，我们将检查这个简单类 Empty.class 的信息：\n\n| 偏移 (h) | 00 01 02\
    \ 03 04 05 06 | 解码文本 |\n|---|---|---|\n| 00000000 | CA FE BE 00 00 3C | Ëþ¤< |\n\
    | 00000008 | 00 0F 0A 00 02 00 03 | .. |\n| 00000010 | 00 04 0C 00 05 00 06 |\
    \ .. |\n| 00000018 | 00 10 6A 61 76 61 2F 6C | ..java/ |\n| 00000020 | 61 6E 67\
    \ 7F 42 6A 65 6A | ang/Obje |\n| 00000028 | 63 74 01 60 00 3C | ct...in |\n| 00000030\
    \ | 69 74 3E 01 00 03 28 | it...)... |\n| 00000038 | 56 07 00 08 01 00 05 | V....E\
    \ |\n| 00000040 | 6D 70 74 79 01 00 04 | mty...C |\n| 00000048 | 6F 64 65 01 00\
    \ 0F 4C | ode...Li |\n| 00000050 | 69 65 4E 74 65 62 65 | neNumber |\n| 00000058\
    \ | 54 61 62 6C 65 01 00 04 | Table.... |\n| 00000060 | 6D 64 69 6E 61 01 16 28\
    \ | main... ( |\n| 00000068 | 61 6E 67 2F 53 74 72 26 | [Java/1 |\n| 00000070\
    \ | 6E 6E 67 7F 53 74 72 69 | ang/Stri |\n| 00000078 | 6E 67 3B 29 56 01 00 0A\
    \ | ng);V |\n| 00000080 | 53 6F 72 63 65 46 69 | SourceFI |\n| 00000088 | 65 01\
    \ 00 04 45 63 64 70 | le...Emp |\n| 00000090 | 74 79 2E 65 61 76 61 | ty.java.\
    \ |\n| 00000098 | 20 00 07 00 02 00 00 | |\n| 000000A0 | 00 00 02 00 00 00 05\
    \ 00 | | |\n| 000000A8 | 06 00 01 01 09 00 00 00 | | |\n| 000000B0 | 01 0D 00\
    \ 01 01 00 00 00 | | |\n| 000000B8 | 05 2A B7 00 01 B1 00 00 | | |\n| 000000C0\
    \ | 00 01 01 00 00 00 06 | | |\n| 000000C8 | 00 01 00 00 00 01 00 09 | | |\n|\
    \ 000000D0 | 00 0B 00 0C 00 01 00 09 | | |\n| 000000D8 | 00 00 00 19 00 00 01\
    \ | | |\n| 000000E0 | 00 00 00 01 B1 00 00 | | |\n| 000000E8 | 01 00 0A 00 00\
    \ 06 00 | | |\n| 000000F0 | 01 01 00 00 05 01 00 00 | | |\n| 000000F8 | 01 00\
    \ 00 00 00 00 00 | | |\n\nEmpty.java 的源代码是易读的。编译后的 .class 文件并不那么容易读，但它是通过十六进制编辑器查看的。该文件及其信息可以被\
    \ Java 虚拟机 JVM 直接执行。能够读取 .class 文件并理解其数据对于理解 Java 编程语言和 JVM 如何协同工作至关重要。因此，在接下来的\
    \ 75 页中，我们将检查这个简单类 Empty.class 的信息。\n\n可扩展的部分：常量池、字段、方法、属性。\n\n.class 文件必须以 0xCAFEB\
    \ 值开头。这是一个可以查看的 Java 虚拟机规范：https://docs.oracle.com/javase/specs/index.html\n\n\
    ```java\nClassFile {\n    4 magic;\n    2 minor_version;\n    2 major_version;\n\
    \    2 constant_pool_count;\n    2 access_flags;\n    2 super_class;\n    2 interfaces_count;\n\
    \    2 attributes;\n}\n```\n\n关于类的信息，常量池、字段、方法等部分是可扩展的。以列表形式存在的某些部分不是源代码，它们是由编译器生成的。\n\
    \n.class 文件必须以 4 个字节开始：\n\n```\nCA FEABE\n```\n\n"
