    \ of how to use the module system, so they are in different modules."
  - '[PAGE 138]


    To run the code in these modules with the JVM, you must first compile them into
    their .class compilation unit files.


    Fortunately, you can instruct the compiler to compile all four of the .java files
    in one command, telling it where the module directory folder is, and then giving
    it a list of source code files. You must tell the compiler where it should create
    a new module directory folder, this one containing the .class files. The compiler
    command is typed on a single line, but I have placed each of the javac arguments
    on separate lines so you can see them better:


    ```

    javac

    -d C:/classesmoddir/

    --module-source-path C:/sourcemoddir/

    C:/sourcemoddir/moduleone/module-info.java

    C:/sourcemoddir/moduleone/pkgone/ClassOne.java

    C:/sourcemoddir/moduletwo/module-info.java

    c:/sourcemoddir/moduletwo/pkgtwo/ClassTwo.java

    ```


    javac :: <path> :: command to run the compiler


    -d <path> :: says where to create the new folder tree and deposit all the .class
    compilation units


    --module-<path> :: says what folder contains the modules and their source files


    list of java files :: this is a list of all the class source files and the module-info
    files that you want to compile into the .class Class format


    So this javac command creates a new module directory folder called C:/classesmoddir
    and puts all the compiled .class files in it, while also mirroring the original
    folder structure. After running this command, you should have on your hard drive
    the following folder tree with the new module directory of .class files:'
  - '[PAGE 139]


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_139_0.png)'
  - '[PAGE 140]


    Now that you have a directory tree within the C:/classesmoddir/folder containing
    the .class compilation units, you can execute the code in JVM using the java command
    in the command line. To do this, you need to feed JVM the directory that contains
    all the compiled modules, meaning the C:/classesmoddir/ folder, and you also need
    to tell JVM which of the classes is the one containing the static main() method,
    which is the entry point to the code. The command line arguments are:


    ```

    java

    --module-path C:/classesmoddir/

    --module moduleone/pkgone.ClassOne

    ```


    java :: command that starts the JVM


    --module-path <path> :: tells the JVM where it can find all the modules, packages,
    and class files that it needs


    --module <modulename/packagename.ClassName> :: tells JVM what class contains the
    static main() entry method


    This java command will begin execution of the Java program by calling the JVM.
    You feed JVM the directory folder where all the modules'' compilation units are
    stored, and you also have to tell it which class has the required static main()
    program entry method


    This is a generic strategy that you can use for any project with modules. It works
    for projects that have several modules, and it also works with only one module.


    The whole purpose of having modules is to restrict class access between the classes
    located in separate modules, so if you have just one module, you could forget
    about modules altogether and simply pretend they don''t exist. In case, you could
    just think about packages and how to access classes from other packages. Your
    Java program will still run fine, if modules didn''t exist.


    However, the reason why your programs will run even if you don''t explicitly set
    up a module is because JVM will automatically put your code inside a module for
    you, without telling you. It is another of those ways that Java secretly adds
    things to your program to get them to run properly, even if you don''t realize
    it''s happening. So if you'
- md: "\ndon't explicitly create a module, then the JVM will create an \"unnamed\"\
    \ module, and put your code in it.\n\nTherefore, I highly recommend that you just\
    \ go ahead and put your code in a module, since it is in fact required by Java.\
    \ It is more work, but I think it's better to operate your Java programs with\
    \ full knowledge of how the JVM is actually working.\n\nAnother benefit of making\
    \ and using modules explicitly is that you will become more familiar with how\
    \ modules work in general. If you are to do any professional Java development\
    \ or Android app development in the future, you will see that modules are always\
    \ used. Sometimes, even raw data like jpeg images and XML files will be included\
    \ in a module along with .class compilation units. This turns a module into a\
    \ self-contained application, like a phone app, that has all the data and code\
    \ it needs to operate independently.\n\nGetting back to modules, I think it would\
    \ be good to show an example of how to set up a folder directory and Java files\
    \ when there is only one module, since at the early stages of learning Java you\
    \ will only need one module. It is the same strategy as the above example, just\
    \ simpler.\n\nFirst, you should manually create a directory structure on your\
    \ hard drive with a module directory folder named sourcemoddir/ that will hold\
    \ the module's base folder. Then, you can make a folder for the module itself,\
    \ then the required module-info.java file inside the module folder, a folder for\
    \ a package, and inside the package folder a .java source code file. The tree\
    \ should look like this:\n\n```\nC:/\n|\nsourcemoddir/\n|\nmodulename/\n|\nmodule-info.java\
    \ pkgname/\n|\nClassName.java\n```\n\nAs before, the module-info.java file is\
    \ required. It must be named module-info, and it must be placed inside the module's\
    \ base folder alongside the package folders. It contains the information telling\
    \ which of the packages from its module can be accessed by other modules, and\
    \ what other Java modules are needed by this module's code.\n\nSo the general\
    \ format of a module-info.java file is:\n\n```\nmodule modulename {\n  exports\
    \ package;\n  requires module;\n}\n```\n\nIn the case of this single module example,\
    \ we don't need to export any packages from this module. However, if we want to\
    \ use any of Java's other classes, like printing text to the console or some other\
    \ basic functions, we do need to require some other modules that come with Java.\n\
    \nIn fact, if you leave the module info file blank, and not specify any required\
    \ modules, like this:\n\n```\nmodule modulename {\n}\n```\n\nThen the JVM will\
    \ automatically add the line:\n\n```\nrequires java.base;\n```\n\nBecause \"java.base\"\
    \ is the name of a module that comes pre-installed with Java, and it contains\
    \ 51 packages that all have useful things for programmers use all the time, like\
    \ the ubiquitous \"System.out.println()\" command.\n\nSince JVM will automatically\
    \ add the \"requires java.base\" to all of your module-info.java files, I recommend\
    \ that you type it into your module-info.java files yourself. If you do, then\
    \ the module-info file will be:\n\n```\nmodule modulename {\n}\nrequires java.base;\n\
    }\n```\n\n- module :: Java keyword that tells the JVM this is a module-info structure\n\
    \n- modulename :: the name of the module, it can be a single word, or it can have\
    \ dots in it, like \"com.app.base\", even though the dots don't have special significance\
    \ in a module name like they do in a package name\n\n- requires java.base :: tells\
    \ the JVM this module needs access to the package module named \"java.base\",\
    \ because code in this module uses code in that module\n\nTo actually run any\
    \ Java code, of course you need your source code file tool, which you can put\
    \ in a folder of the same name as whatever you decide to call your package. The\
    \ source code file needs to declare itself part of that package, and it also needs\
    \ the static main method that the JVM uses as the entry point to your program:\n\
    \n```\n// ClassName.java source code file\npackage pkgname;\n```\n\n```\nimport\
    \ pkgname.*; // automatically imported by JVM!\nimport java.lang.*; // automatically\
    \ imported by JVM too!\n```\n\n```\nclass ClassName {\n    static public void\
    \ main(String[] str) {\n        System.out.println(\"Howdy!\");\n    }\n}\n```\n\
    \nI have mentioned it in previous sections, but notice that if you don't add them\
    \ yourself, JVM will add two package imports to your source code file. The first\
    \ is the package this is part of, so that it can access any other classes in its\
    \ own package. The second is the package named \"java.lang\", which is located\
    \ in the module \"java.base\" that gets automatically added to the module-info\
    \ file. The asterisk means that all public classes from these packages will be\
    \ imported. (The automatic import of \"java.lang\" is the reason why you can use\
    \ the System class in the System.out.println() method. System is the name of one\
    \ of the classes in the \"java.lang\" package.)\n\nSo the hard drive folder tree\
    \ and source files for a single module project looks like:\n\n![](img/c8857ea016f1259bfbfe6939f1314dc2_144_0.png)\n\
    \nThen you can run the compiler just like before, by treating the project as a\
    \ module:\n\n```\njavac\n-d C://classesmoddir/\n--module-source-path C://sourcemoddir/\n\
    C://source/modulename/module-info.java\nC://source/modulename/pkgname/ClassName.java\n\
    ```\n\n- **-d <path>** :: that option tells the compiler to deposit the compiled\
    \ files into that folder, creating the folder if it doesn't exist already\n\n\
    - **--module-source-path** :: option that tells the compiler where to look for\
    \ the module's base folder, and thus its module-info file and all of its packages\n\
    \n- **java files** :: location and file names of the module-info and class source\
    \ files, which the compiler will convert to the .class format\n\nAfter running\
    \ this command, your hard drive should look like this:\n\n![](img/c8857ea016f1259bfbfe6939f1314dc2_145_0.png)\n\
    \nNow you can run the code in the module in JVM with the command:\n\n```\njava\n\
    --module-path C:/classesmoddir/\n--module modulename/pkgname.ClassName\n```\n\n\
    - **--module-path <path>** :: tells JVM where to look for the module .class files.\n\
    \n- **--module <module/pkgClass>** :: tells JVM the name of the module, package,\
    \ and Class that contains the static main entry method needs to start executing\
    \ your code.\n\nAfter running this program, you should see the string \"Howdy!\
    \ print to the console.\n\nCongratulations on finishing this section on Java modules!\
    \ I think modules is one of the most confusing parts of Java, so if you've made\
    \ it far then you are well on your way to being a Java expert.\n\nThis section\
    \ on modules is also the last section that really deals with the \"meta\"structure\
    \ of Java. Understanding the organization of Java code into modules, packages,\
    \ and classes is critically important, which is why I put those sections first\
    \ in this book.\n\nNow that you have a solid understanding of Java's meta-organization,\
    \ it is time to start looking at what goes inside classes and methods. This is\
    \ the \"coding\" part of writing Java programs, and it is also the typical material\
    \ that beginner books on Java cover comprehensively. Not wanting to repeat the\
    \ material again here, I will take a slight different approach to Java coding\
    \ elements, by showing you how the source code correlates with the .class ClassFile\
    \ data. Hopefully, this will give you a better understanding of how Java code\
    \ elements are represented and dealt with by the JVM.\n\nWith that, let's dive\
    \ into Java's data structures\n\n# Storing Information\n\nThere are a total of\
    \ twelve unique types of variables that you can use to store data in Java. They\
    \ are usually grouped into two main categories, **primitive** and **reference**.\n\
    \n# Primitive Types\n\n**Primitive** data is stored in fields and local variables\
    \ directly as bits, and Java has special keywords that you can use to create,\
    \ store, and operate on primitive types of data. The primitive data types are:\n\
    \n- boolean\n- char\n- byte\n- short\n- int\n- long\n- float\n- double\n\nThese\
    \ are discussed in more detail on the following pages:\n"
  mdcn: "\n如果你不显式地创建模块，JVM 将创建一个“未命名”模块，并将你的代码放入其中。\n\n因此，我强烈建议你直接将代码放入一个模块中，因为这实际上是\
    \ Java 要求的。虽然这需要多花一些精力，但我认为在完全了解 JVM 实际工作原理的情况下来操作你的 Java 程序会比较好。\n\n显式创建和使用模块的另一个用处是，你将更熟悉模块的通用工作原理。如果你将来要进行任何专业的\
    \ Java 开发或 Android 应用开发，你会发现模块是无处不在的。有时甚至像 jpeg 图像和 XML 文件这样的原始数据也会与 .class 编译单元一起被包含在模块中。这使得模块变成了一个自包含的应用程序，就像手机\
    \ App 一样，拥有独立运行所需的所有数据和代码。\n\n回到模块，我认为在只有一个模块的情况下，展示一个如何设置文件夹目录和 Java 文件的示例会很好，因为在学习\
    \ Java 的早期，你只需要一个模块。这与上面的示例策略相同，只是更简单一些。\n\n首先，你应该在硬盘上手动创建一个目录结构，其中包含一个名为 `sourcemoddir/`\
    \ 的模块目录文件夹，它将存放模块的根目录。然后，你可以为模块本身创建一个文件夹，然后在模块文件夹内创建所需的 `module-info.java` 文件、一个包的文件夹，以及在包文件夹内部的一个\
    \ .java 源码文件。树形结构看起来应该是这样的：\n\n```\nC:/\n|\nsourcemoddir/\n|\nmodulename/\n|\n\
    module-info.java pkgname/\n|\nClassName.java\n```\n\n和之前一样，`module-info.java`\
    \ 文件是必须的。它必须命名为 `module-info`，并且必须放在模块的根目录中，与包文件夹并列。它包含了信息，告知该模块的哪些包可以被其他模块访问，以及该模块的代码需要哪些其他\
    \ Java 模块。\n\n因此，`module-info.java` 文件的通用格式为：\n\n```\nmodule modulename {\n  exports\
    \ package;\n  requires module;\n}\n```\n\n在这个单模块示例中，我们不需要从该模块导出任何包。然而，如果我们想使用\
    \ Java 的其他任何类（例如向控制台打印文本或其他基本功能），我们确实需要引用某些 Java 随带的其它模块。\n\n事实上，如果你将模块信息文件留空，并且不指定任何所需的模块，如下所示：\n\
    \n```\nmodule modulename {\n}\n```\n\n那么 JVM 将自动添加该行：\n\n```\nrequires java.base;\n\
    ```\n\n因为 \"java.base\" 是预装于 Java 的模块名称，它包含了 51 个包，这些包包含了程序员经常使用的有用内容，例如无处不在的\
    \ \"System.out.println()\" 命令。\n\n由于 JVM 会自动在你所有的 `module-info.java` 文件中添加 `requires\
    \ java.base`，我建议你自己手动将其输入到 `module-info.java` 文件中。如果你这样做，那么 `module-info` 文件将是：\n\
    \n```\nmodule modulename {\n}\nrequires java.base;\n}\n```\n\n- **module** ::\
    \ Java 关键字，告诉 JVM 这是一个 module-info 结构。\n\n- **modulename** :: 模块的名称，它可以是一个单词，也可以包含点（例如\
    \ \"com.app.base\"），尽管点在模块名中不像在包名中那样具有特殊意义。\n\n- **requires java.base** :: 告诉\
    \ JVM 该模块需要访问名为 \"java.base\" 的包模块，因为该模块中的代码使用了该模块中的代码。\n\n要实际运行任何 Java 代码，你当然需要源码文件工具，你可以将其放在与你决定的包同名的文件夹中。源码文件需要声明自己是该包的一部分，并且还需要\
    \ JVM 用作程序入口的静态 main 方法：\n\n```\n// ClassName.java 源码文件\npackage pkgname;\n```\n\
    \n```java\nimport pkgname.*; // JVM 自动导入！\nimport java.lang.*; // JVM 也会自动导入这个！\n\
    ```\n\n```\nclass ClassName {\n    static public void main(String[] str) {\n \
    \       System.out.println(\"Howdy!\");\n    }\n}\n```\n\n我在之前的章节中提到过它，但请注意，如果你不手动添加它们，JVM\
    \ 会向你的源码文件添加两个包导入。第一个是它所属的包，以便它可以访问同包内的任何其他类。第二个是名为 \"java.lang\" 的包，它位于自动添加到\
    \ module-info 文件中的 \"java.base\" 模块中。星号（*）意味着这些包中的所有公共类都将被导入。（自动导入 \"java.lang\"\
    \ 是你之所以可以在 `System.out.println()` 方法中使用 `System` 类的原因。`System` 是 \"java.lang\"\
    \ 包中的类之一之一。）\n\n所以，单模块项目的硬盘文件夹树和源文件看起来如下：\n\n![](img/c8857ea016f1259bfbfe6939f1314dc2_144_0.png)\n\
    \n然后你可以像以前一样运行编译器，将项目视为一个模块：\n\n```\njavac\n-d C://classesmoddir/\n--module-source-path\
    \ C://sourcemoddir/\nC://source/modulename/module-info.java\nC://source/modulename/pkgname/ClassName.java\n\
    ```\n\n- **-d <path>** :: 该选项告诉编译器将编译后的文件存放在该文件夹中，如果文件夹不存在则创建它。\n\n- **--module-source-path**\
    \ :: 选项告诉编译器去哪里寻找模块的根目录，从而寻找它的 module-info 文件及其所有的包。\n\n- **java files** :: module-info\
    \ 和类源文件的位置和文件名，编译器将把它们转换为 .class 格式。\n\n运行此命令后，你的硬盘看起来应该是这样：\n\n![](img/c8857ea016f1259bfbfe6939f1314dc2_145_0.png)\n\
    \n现在你可以使用以下命令在 JVM 中运行模块中的代码：\n\n```\njava\n--module-path C:/classesmoddir/\n\
    --module modulename/pkgname.ClassName\n```\n\n- **--module-path <path>** :: 告诉\
    \ JVM 去哪里寻找模块的 .class 文件。\n\n- **--module <module/pkgClass>** :: 告诉 JVM 模块、包和包含静态\
    \ main 入口方法的类名称，以便它开始执行你的代码。\n\n运行该程序后，你应该看到字符串 \"Howdy!\" 打印到控制台。\n\n恭喜你完成了 Java\
    \ 模块的这一章节！我认为模块是 Java 最令人困惑的部分之一，所以如果你已经读到了这里，说明你正朝着成为 Java 专家的道路迈进。\n\n关于模块的章节也是最后一个真正涉及\
    \ Java “元（meta）”结构的章节。理解将 Java 代码组织成模块、包和类至关重要，这就是为什么我将这些章节放在书的最前面的原因。\n\n现在你已经对\
    \ Java 的元结构有了坚实的理解，是时候开始查看类和方法内部的内容。这是编写 Java 程序的“编码”部分，也是初学者 Java 书籍涵盖的典型内容。不想在这里重复这些内容，我将采用稍微不同的方法处理\
    \ Java 代码元素，展示源码与 .class ClassFile 数据如何关联。希望这能让你更好地理解 Java 代码元素是如何表示和处理的。\n"
