    \n```\n\n静态类字段被列为类的唯一字段，你可以看到它的类型描述符是一个左括号，后面跟着大字母 `I`，`[I]`。括号表示一维数组，`I` 表示数组持有整数数据。\n\
    \n`<init>` 静态初始化方法包含了在堆内存中创建整数数组的操作指令。数组的创建随后是将数组元素初始化为某个默认值。对于整数原型，默认值为 0。让我们走一下这三个操作码看看它们是如何工作的：\n\
