    \ `[[I]` 的类名，与数组描述符相同。命令的最后一个字节是数字 2，表示数组的维度数。\n\n`multianewarray` 命令取操作数栈顶的两个值，并将它们作为数组对象的维度，因此第一维有\
    \ 2 个元素，第二维有 3 个元素。来自常量池的值 `[[I]` 决定了每个维度将存储什么类型的数据（外部数组中是对象引用，内部数组中是整数原始类型）。`multianewarray`\
    \ 命令的第四个字节持有值 2，表示数组的维度。最后，在创建数组后，`multianewarray` 将一个 `arrayref` 内存指针推送到栈。\n\n\
    - 6: putstatic #9\n第四个操作码是 `putstatic`，我们之前见过。该命令从操作数栈中取出值（现在栈中包含指向新创建数组的内存地址），并将其存储在常量池项\
    \ #9 列出的变量中，即静态字段。\n\n# 内存地址的一维数组\n\n数组部分快结束了，我想向你展示最后一个数组创建的示例。这是一个一维数组，但它持有指向堆对象的引用值。源代码如下：\n\
