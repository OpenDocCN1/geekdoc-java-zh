    \n## Organizing Classes into Packages\n\nThe fundamental unit of Java coding is\
    \ the class. All of the data and all of the operations that you want to include\
    \ in your programs go inside of Java's classes. The compilation of .java source\
    \ code is discretized into .class compilation units, where each compilation is\
    \ either a class or an interface (which is basically a special subtype of class).\
    \ And the Java Virtual Machine operates on units of classes, because it loads\
    \ information into its memory .class file at a time.\n\nOne problem that comes\
    \ up with classes however is that you can make an infinite number of them, which\
    \ may or may have the same name. Anyone in the world can create a Java class,\
    \ so if there is any sharing of Java classes over the internet, and of course\
    \ there, there would have to be some central database or naming authority so to\
    \ prevent people from making classes with the same names.\n\nBut Java does not\
    \ have a central naming authority. Instead, Java has a system called packages\
    \ that groups classes together underneath the package name. This system essentially\
    \ makes the name of a class longer, because the class name includes its package\
    \ name. This pack name + name is known as the fully qualified name of the class,\
    \ and these fully qualified names are how JVM searches for and finds classes.\n\
    \nAppending the package name in front of the class does not 100% solve the problem\
    \ of identical class names, since two people could also use the same package name,\
    \ but it does make the issue of overlapping names less likely to occur. In fact,\
    \ Java makes the recommendation that people give their package the same name as\
    \ their organization or company, because organizations tend to have unique names.\n\
    \nPackages are so important to Java that it is mandatory for every class to be\
    \ part of a package.\n\nIf you don't write your class's package name into source\
    \ code, then when you run your .class file with JVM, the JVM will automatically\
    \ create a package for you and add your class to it without letting you know.\
    \ JVM's choice of package name is something arbitrary, unnamedpackage, but the\
    \ point is that your class must be associated with a package in order to be used\
    \ by JVM.\n\nBecause package affiliation is required by the JVM, I recommend explicitly\
    \ declaring your class's package in its source code file. Way it is clear that\
    \ your class is indeed part of a package, as it must be. Another benefit of explicitly\
    \ placing your class inside a package is that you will become more familiar with\
    \ how Java packages work in general, and this will come handy if you do any professional\
    \ Java coding, making Android apps, because the classes you use when writing those\
    \ apps are all part of package hierarchy developed by a third party.\n\nTo explicitly\
    \ declare your own class to be part of a package, all you have to do is type the\
    \ package's name into your source code file after the keyword package. This package\
    \ declaration is usually put at the very top of the source code file, like so:\n\
    \n```java\npackage pkg;\n\nclass myClass\n{\n```\n\nThe name of the package itself\
    \ is completely arbitrary, so you can write anything. There is no master list\
    \ of allowed package names. The reason this works is because by writing the package's\
    \ name after the keyword, the JVM knows where to look for the class. Appending\
    \ the package name in front of the class does not 100% solve the problem of identical\
    \ class names, since two people could also use the same package name, but it does\
    \ make the issue of overlapping names less likely to occur. In fact, Java makes\
    \ the recommendation that people give their package the same name as their organization\
    \ or company, because organizations tend to have unique names.\n\nPackages are\
    \ so important to Java that it is mandatory for every class to be part of a package.\n\
    \nIf you don't write your class's package name into source code, then when you\
    \ run your .class file with JVM, the JVM will automatically create a package for\
    \ you and add your class to it without letting you know. \n\nBecause package affiliation\
    \ is required by the JVM, I recommend explicitly declaring your class's package\
    \ in its source code file. Way it is clear that your class is indeed part of a\
    \ package, as it must be. Another benefit of explicitly placing your class inside\
    \ a package is that you will become more familiar with how Java packages work\
    \ in general, and this will come handy if you do any professional Java coding,\
    \ making Android apps, because the classes you use when writing those apps are\
    \ all part of package hierarchy developed by a third party.\n\nTo explicitly declare\
    \ your own class to be part of a package, all you have to do is type the package's\
    \ name into your source code file after the keyword package. This package declaration\
    \ is usually put at the very top of the source code file, like so:\n\n```java\n\
    package pkg;\n\nclass myClass\n{\n```\n"
  mdcn: "\n私有成员限制意味着只有来自同一个类模板内部的代码才能访问该成员！这是对象可以拥有的最安全的访问类型：\n\n![](img/c8857ea016f1259bfbfe6939f1314dc2_117_0.png)\n\
    \n私有类成员使用 `private` 关键字标明：\n\n```java\npublic class C1\n{\n    private String\
    \ s = \"hello\";\n}\n```\n\n要查看此类中的私有字段，你必须在 `javap` 命令中添加额外的 `-p` 设置，否则你将看不到私有字段（`javap\
    \ -cp ../classes/ -v -p C1`）：\n\n```java\nprivate java.lang.String s;\ndescriptor:\
    \ Ljava/lang/String;\nflags: (0x0002) ACC_PRIVATE\n```\n\n16位标志位是：0000_0000_0000_0010\n\
    \n你可以看到类成员的私有限制是从右起第二个比特位表示的。\n\n关于访问限制的另外一点是，只有在允许访问组件的整个类时，组件访问级别才有效。换句话说，访问限制是分层的。例如，默认访问权限（即包保护）类中的公有字段是不可访问的：\n\
    \n- 访问类 (C2) 与被访问类 (C1)不在同一个包中\n- 但 C1 是一个公共类，因此它对 C2 是可见的\n- 因此，C1 的字段将决定访问限制\n\
    \n# pkg1\n# pkg2\n\n![](img/c8857ea016f1259bfbfe6939f1314dc2_118_0.png)\n\n- 访问类\
    \ (C2) 与被访问类 (C1)不在同一个包中\n- 但现在 C1 具有默认限制，因此它对 C2 是不可可见的\n- 因此，C2 无法访问 C1 的任何字段\n\
    \n# pkg1\n# pkg2\n\n![](img/c8857ea016f1259bfbfe6939f1314dc2_118_1.png)\n\n关于访问限制最后需要了解的一点是，它也适用于在方法内定义的变量。在方法内定义的任何变量都是局部变量，局部变量无法被方法外部的代码访问。因此，访问限制的概念在方法内部并不适用。\n\
    \n## 将类组织到包中\n\nJava 编码的基本单元是类。你想要包含在程序中的所有数据和所有操作都在 Java 类内部。`.java` 源代码的编译被离散化为\
    \ `.class` 编译单元，每个编译单元要么是一个类，要么是一个接口（本质上是类的特殊子类型）。Java 虚拟机以类为单位进行操作，因为它一次只向内存中加载一个\
    \ `.class` 文件。\n\n然而，类出现的一个问题是，你可以创建无限数量的类，它们的名称可能相同也可能不同。世界上上的任何人都可以创建 Java 类，所以如果互联网上存在任何\
    \ Java 类的共享，当然，必须有一个中央数据库或命名权威机构，以防止人们创建同名的类。\n\n但 Java 并没有中央命名权威机构。相反，Java 有一种名为“包（packages）”的系统，它将类在包名下分组在一起。这个系统本质上使类名变长了，因为类名包含了它的包名。这种包名\
    \ + 类名被称为类的全限定名（fully qualified name），JVM 正通过这些全限定名来搜索并找到类。\n\n在类名前面加上包名并不能100%地解决同名类的问题，因为两个人也可能使用相同的包名，但它确实降低了名称冲突发生的可能性。事实上，Java\
    \ 建议人们将包命名为与其组织或公司相同的名称，因为组织往往具有独特的名称。\n\n包对 Java 来说如此重要，以至于每个类必须属于一个包是强制性的。\n\
    \n如果你不在源代码中编写类的包名，那么当你用 JVM 运行你的 `.class` 文件时，JVM 会自动为你创建一个包并将你的类添加到其中，而不会通知你。JVM\
    \ 选择的包名是任意的——`unnamedpackage`，但要点是，你的类必须与一个包关联才能被 JVM 使用。\n\n由于 JVM 要求包归属关系，我建议在源文件文件中显式声明你的类的包名。这样可以清楚地看出你的类确实是包的一部分，正如它必须是的那样。显式将你的类放在包内的另一个好处是，你将更熟悉\
    \ Java 包的般工作原理，这在你进行任何专业的 Java 编码、开发 Android 应用时会非常有帮助，因为你在编写这些应用时使用的类都是由第三方开发的包层次结构的一部分。\n\
    \n要显式声明你自己的类属于一个包，你只需要在源文件中 `package` 关键字后输入包名。这种包声明通常放在源文件的顶部，如下所示：\n\n```java\n\
    package pkg;\n\nclass myClass\n{\n```\n\n包名本身是完全任意的，所以你可以写任何名称。并没有允许的包名列表。之所以有效，是因为通过在关键字后写入包名，JVM\
    \ 知道去哪里查找类。在类名前面加上包名并不能100%地解决同名类的问题，因为两个人也可能使用相同的包名，但它确实降低了名称冲突发生的可能性。事实上，Java\
    \ 建议人们将包命名为与其组织或公司相同的名称，因为组织往往具有独特的名称。\n\n包对 Java 来说如此重要，以至于每个类必须属于一个包是强制性的。\n\
    \n如果你不在源代码中编写类的包名，那么当你用 JVM 运行你的 `.class` 文件时，JVM 会自动为你创建一个包并将你的类添加到其中，而不会通知你。\n\
    \n"
