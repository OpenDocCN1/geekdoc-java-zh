    \n# anewarray #7\n\n从操作数栈中弹出值 10，用它在堆内存中创建一个持有 10 个信息的数组对象。信息的类型由操作码的参数常量池项 #7\
    \ `java/lang/String` 决定，它是数组元素可以设置的类模板名。目前，元素尚未指向任何特定对象，因此它们都被设置为引用指针的默认值，即 `null`。最后，一个指向整个数组对象的引用指针被推送到操作数栈上。\n\
