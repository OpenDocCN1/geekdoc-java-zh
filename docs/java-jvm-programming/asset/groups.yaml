    # Reference Types


    Reference data is data that is accessed indirectly, i.e. by reference. A referenced
    data structure can be one of four things:


    +   - interface templates, stored in MethodArea memory

    - class templates, stored in MethodArea memory

    - class instance objects, stored in HeapArea memory

    - array objects, stored in HeapArea memory


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_173_0.png)


    These four data structures are accessed via memory pointers because they are too
    large to store directly in the space allotted for fields or local variables.


    In order to use the structures in source code, a keyword or variable is used as
    the reference, and the JVM knows that the reference points toward the desired
    data structure.


    # (A) References to Templates


    If the data structure is an interface template or a class template, the reference
    used to access the template is the name of the interface or class itself.


    (A.1) Interface Templates For example, interfaces are designed to be inherited
    by classes, so to tell the JVM that you want to use the'
