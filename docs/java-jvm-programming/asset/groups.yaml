    \ 关键字告诉 JVM 这些是类字段，它们应该存储在所谓的 MethodArea 中。JVM 内存布局将在稍后讨论，但简之，MethodArea 是每个 JVM\
    \ 执行都可以访问的共享全局内存区域。\n\n第二个变化是由于添加了类字段，方法表中增加了方法。该方法的名称为 `<clinit>`，在常量池项 #7 中可见，尽管在方法摘要中\
    \ `<clinit>` 方法被术语 `static` 替换。`<clinit>` 方法或类初始化方法，是类生命周期内只运行一次的方法，并且在 .class\
    \ 文件加载到全局 MethodArea 时最先执行。因此，由于类字段在 ClassFileData 加载到 `<init>` 方法时也会初始化一次，JVM\
    \ 字节码知道在 `<init>` 方法中进行类初始化，这意味着我们不需要显式告诉 JVM 初始化类字段的正确时间。不过，有一种方法可以显式在类生命周期最开始时运行代码。在\
    \ Java 源代码中，可以使用 `static` 关键字 + 代码块 `{}` 来创建一个在类首次加载到 MethodArea 内存时仅运行一次的代码。大括号内部就是你想要运行代码的地方。\n\
    \n你可能认为可以在该静态代码块中放置静态字段变量，并且与直接将类字段放在 `static {}` 中是相同的。遗憾的是，并不是这样。`static {}`\
    \ 中的大括号表示其中的任何代码都被视为局部变量，就像 `{}` 是一个方法一样，而 JVM 禁止将局部变量声明为静态。换句话说，这行不通。\n\n但这引发了一个问题：如果我有一个静态类字段，并在源码中也写了一个静态初始化块，ClassFile\
