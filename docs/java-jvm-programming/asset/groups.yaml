    type of database, like a compressed ZIP file, as well as a regular computer file
    system, but if you are writing Java classes on your personal computer, the .class
    files you make with the javac compiler will be put in your computer''s regular
    folder structure on your hard drive.'
  - "[PAGE 122]\n\nAs mentioned, a folder hierarchy on your hard drive is created\
    \ automatically when you run the Java compiler. The new folder will have the same\
    \ name as your package name.\n\nThe way this works is when the compiler reads\
    \ your .java source file, it will see that you have declared the class part of\
    \ a package, and it gets the package name. Now it knows the name of the new folder\
    \ it must make, and in this folder will go the .class file. One piece of information\
    \ is needed by the compiler before it this, which is that you must tell java where\
    \ on your hard drive to create the package folder hierarchy. You can do this by\
    \ adding the \"-d folderpath\" option when running the javac compiler at the command\
    \ prompt. The compiler will then create a new folder at the hard drive location\
    \ folderpath/classname, and deposit the .class file inside.\n\nThis is a bit confusing,\
    \ so let's go through a simple example. Here is a java class, written in Java\
    \ source code, with its package explicitly defined. It is the same one as\n\n\
    ```\n//myClass.java\npackage pkg;\n\nclass myClass\n{}\n```\n\nNow you need to\
    \ use the javac compiler to convert the .java source code file into a .class file.\
    \ So you could write the command:\n\n```\njavac C:/sourcepath/myClass.java\n```\n\
    \nWhere \"C:/sourcepath/\" is the path to the folder where you saved the myClass.java\
    \ file. This command does work and will make the class file, unfortunately it\
    \ saves the .class file in the same folder as the .java file, and also it doesn't\
    \ create the package folder hierarchy. This is a problem, because the package\
    \ folders are required by JVM in order to find the .class file. Therefore, you\
    \ must add the \"-d c:/depositpath/\" option to the javac command to tell the\
    \ compiler where to create the package folder and compiled .class file. The compiler\
    \ now looks like this: \n\n```\njavac -d c:/depositpath/ c:/sourcepath/myClass.java\n\
    ```"
  - '[PAGE 123]


    Now when you run the compiler like this, it creates a new folder within the depositpath
    that has the same name as the class''s package. Then it puts the .class file inside
    the folder with the package name.


    Let''s look at a cartoon of this process.


    **Step 1:** You write a .java source file and save it on the C: drive in the folder
    called source/. Your class declares itself part of a package called pkg.


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_123_0.png)'
- md: '

    Step 2: You want to use the java compiler to create the .class byte formatted
    file to run in JVM. You know that the compiler will automatically make a folder
    called pkg and put the .class file inside, you just need to tell it where to put
    everything. So you run the compiler with the -d option and make its path classes/,
    since that is a reasonable name for a folder that holds .class files:


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_124_0.png)


    ```

    javac -d C:/classes/ C:/source/myClass.java

    ```


    Step 3: The compiler gets the package name from the myClass.java source file,
    and it decides to make a new folder with the package name to put the myClass.class
    file inside. Since you told the compiler to deposit things in the C:/classes/
    folder, it makes this folder as well:


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_125_0.png)


    ```

    javac -d C:/classes/ C:/source/myClass.java

    ```


    This 3-step process described above always happens when you run the javac Java
    compiler. In the command prompt, you feed javac the name of the .java source code
    file. You also use the -d option to tell the compiler where to deposit any package
    folders and the compiled class files. The javac program takes these command line
    options, reads the java source code to get the package name, creates the appropriate
    folder hierarchy, and puts the compiled class files there.


    In the example above, the package is a single, simple package, which is indicated
    by the package name being a single word. If Java wanted to, it could leave package
    complexity at this level, and force classes to be grouped in simple packages like
    this. This would be a nice and easy way to do it, and programmers would just get
    used to putting all their classes within one package folder. For example, here
    are five unique classes, having five fully qualified names, made by three different
    programmers. Each programmer chooses a unique package name, so they don''t have
    to worry about their classes having the same simple names:


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_126_0.png)


    However, Java classes are often not organized in such a simple manner. In reality,
    classes are organized in a much more complicated package hierarchy, and this is
    because of Java''s support for sub-packages.


    A sub-package is a package within a package, and this can be repeated on and on,
    with many sub-packages within sub-packages. But let''s examine the scenario with
    just one additional layer of sub-packages.


    To create a sub-package, the process is basically the same as before. You simply
    write package.sub-package when you declare the class''s package affiliation in
    its source code file. Take a look at this example class file:


    ```

    //myClass.java

    package pkg.subpkg;


    class myClass

    {}

    ```


    The package keyword is used exactly the same as before, and we have the top-level
    package written too. Now however, there is a dot, followed by another word, and
    simply writing this packagename+dot+subpackagename structure in the source file
    tells the compiler that there is a nested hierarchy of packages. Pkg is the top-level
    package, and that package has a sub-package within it called subpkg.


    How would this be handled by the compiler? Javac actually handles the sub-package
    hierarchy automatically, just as before. I can see that you have a sub-package
    within another package, so when it creates the package folders, the package hierarchy
    is reflected in the folder directory structure.


    The command prompt instruction is even the same as in the simpler case. You simply
    include the "-d path" option to tell the compiler where to create the more complex
    folder hierarchy, like this:


    ```

    javac -d C:/classes/ C:/source/myClass.java

    ```


    And you can see, the command is exactly the same as before. For the class written
    just above, which is grouped under the sub-package called subpkg, the folder structure
    on your hard drive after running the compiler would look like this:


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_128_0.png)


    ```

    javac -d C:/classes/ C:/source/myClass.java

    ```


    So you still have to tell the compiler where on your hard drive you want it to
    put the class files it generates and how to organize them, which is conventionally
    in a folder classes/, but after that the compiler will infer the correct folder
    structure based on the package declaration from the source code file.


    Of course, you can add as many sub-packages as you like within a top-level package,
    as long as their names are different. You could have one class in the package
    pkg.sub1, and another class part of pkg.sub2, etc.


    It is important to note however, that classes stored in different sub-packages
    of the same top-level package are still considered to be in totally separate packages!


    This means that for the access restrictions mentioned in the previous sections
    for class level access (public / default) or for class member level access (public
    / protected / default / private), classes in two separate sub-packages, regardless
    of whether they are in the same or completely different package hierarchies, are
    considered to be completely different packages.


    An additional variation on this is that you can store assign your classes to multiple
    levels of a package hierarchy. This doesn''t really mean for writing source code.
    Classes that are in different packages are treated as being in completely different
    packages, whether that means one sub-package vs another sub-package, or a sub-package
    vs a top-level package. JVM only considers two classes to be part of the package
    if the package name is exactly the same.


    Because of Java''s system of packages and the file system hierarchy it requires,
    you will see every variation of class storage. In fact, it is very common for
    developers to have classes stored at every level of a package hierarchy, despite
    the fact that every level in the hierarchy is really treated as a separate package
    by the JVM. Therefore, it is common to see classes store in a folder structure
    like this (next page):


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_130_0.png)


    Where the classes C1, C2, and C3 are in completely different packages, as far
    as JVM is concerned, even though they are all in the same package.


    To me it would seem a better choice to not allow layering of packages, since sub-packages
    all get treated as different packages anyways. In any case, this is how packages
    work in Java, and it is kind of nice to have things organized. The main thing
    to remember is that sub-packages have no meaningful relation to the packages above
    or below, except in name and the folder structure on the hard drive.


    ## Organizing Packages into Modules


    A few years ago, Java was updated in a major way by adding a completely new concept
    called modules. The reason why this concept was added to Java is because previous
    versions of Java didn''t have any way to block access to entire packages of classes.
    Of course, it was always possible to label each class in a package as default
    access, meaning it could not be used by classes from outside packages. But this
    system didn''t account for the fact that a class might be needed by some outside
    packages, but not all.


    In other words, classes marked non-public were inaccessible to any and all outside
    packages. Conversely, if you wanted a single outside package to have access to
    your class, then you had to mark it as a public class, and then every class in
    all of Java had access to your class, not just the one you had in mind. Therefore,
    a new system was added that can grant permission for the use of specific packages
    to some, but not all, other packages.


    Another way to conceptualize modules is to think of it as just one more barrier
    to access a class''s members, one that sits above the class level:


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_132_0.png)


    A more realistic diagram would show that there are several different packages
    within a module, and also that there are multiple classes within a package:


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_133_0.png)


    Which is all just to show you that several layered types of access restriction
    exist in Java. Modules is just one more way to do access restriction in addition
    to packages, class access modifiers, and member access modifiers.

    '
  mdcn: '


    第 2 步：你想使用 Java 编译器来创建 `.class` 字节码格式文件以便在 JVM 中运行。你知道编译器会自动创建一个名为 `pkg` 的文件夹并将
    `.class` 文件放在其中，你只需要告诉它将所有内容放在哪里。因此，你使用 `-d` 选项运行编译器，并将路径设置为 `classes/`，因为这是存放
    `.class` 文件的合理文件夹名称：


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_124_0.png)


    ```

    javac -d C:/classes/ C:/source/myClass.java

    ```


    第 3 步：编译器从 `myClass.java` 源文件中获取包名，并决定创建一个与包名同名的文件夹，将 `myClass.class` 文件放在其中。由于你告诉了编译器将文件存放在
    `C:/classes/` 文件夹，它也会创建这个文件夹：


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_125_0.png)


    ```

    javac -d C:/classes/ C:/source/myClass.java

    ```


    上述的 3 步过程在你运行 `javac` Java 编译器时总是发生。在命令行提示符中，你向 `javac` 提供 `.java` 源代码文件名。你还使用
    `-d` 选项告诉编译器将任何包文件夹和编译后的类文件放在哪里。`javac` 程序获取这些命令行选项，读取 Java 源以获取包名，创建相应的文件夹层级结构，并将编译后的类文件放在那里。


    在上面的示例中，包是一个单一且简单的包，这通过包名是一个单词来指示。如果 Java 愿意，它可以将包的复杂性保持在这一水平，并强制类分组在这样的简单包中。这是一种非常方便且简单的方法，程序员只需习惯于将所有的类都放在一个包文件夹中。例如，这里有五个独特的类，拥有五个完全限定类名，由三个不同的程序员编写。每个程序员都选择一个唯一的包名，这样他们就不必担心它们的类具有相同的简单名称了：


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_126_0.png)


    然而，Java 类通常不是以这种简单的方式组织的。在现实中，类组织在复杂复杂的包层级结构中，这是因为 Java 支持子包。


    子包是包中的包，这种结构可以不断重复，在子包中还可以包含许多许多子包。但让我们来看一个只增加一层子包的情况。


    要创建一个子包，过程基本上与之前相同。你只需要在源文件中声明类的包所属关系时，编写 `package.sub-package` 即可。看看这个示例类文件：


    ```

    //myClass.java

    package pkg.subpkg;


    class myClass

    {}

    ```


    `package` 关键字用法与之前完全相同，我们也写了顶层包。但现在这里有一个点，后面跟着另一个单词，只需在源文件中编写这种 `packagename+点+subpackagename`
    的结构就会告诉编译器存在嵌套的包层级结构。`pkg` 是顶层包，该包内部有一个名为 `subpkg` 的子包。


    编译器如何处理这种情况？`javac` 实际上像之前一样自动处理子包层级结构。我看到你在另一个包内部有一个子包，因此当它创建包文件夹时，包层级结构会反映在文件夹目录结构中。


    命令行提示符的指令与简单情况完全相同。你只需要包含 `"-d path"` 选项来告诉编译器在哪里创建更复杂的文件夹层级结构，如下：


    ```

    javac -d C:/classes/ C:/source/myClass.java

    ```


    你可以看到，命令与之前完全相同。对于上面写的类（它被分组在名为 `subpkg` 的子包下），在运行编译器后，你硬盘上的文件夹结构看起来如下：


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_128_0.png)


    ```

    javac -d C:/classes/ C:/source/myClass.java

    ```


    因此，你仍然需要告诉编译器你想让它在硬盘的什么位置放置生成的类文件，以及如何组织它们（习惯上是放在 `classes/` 文件夹中），但在之后，编译器将根据源文件中的包声明推导出正确的文件夹结构。


    当然，你可以在顶层包内添加你喜欢的任意数量的子包，只要它们的名称是不同的即可。你可以在 `pkg.sub1` 中有一个类，在 `pkg.sub2` 中另一个类，以此类推。


    但重要的是，存储在同一个顶层包的不同子包中的类仍然被认为位于完全不同的包中！


    这意味着，对于之前章节提到的类级访问限制（`public` / `default`）或类成员级访问限制（`public` / `protected` / `default`
    / `private`），两个独立子包中的类，无论它们是在同一个包层级结构还是完全不同的包层级结构中，都被认为是完全不同的包。


    另一种变体是，你可以将类分配到包层级结构的多个层级中。这实际上并不意味着编写源码。位于不同包的类被视为位于完全不同的包，无论这意味着一个子包对比另一个子包，还是一个子包对比一个顶层包。只有当包名完全相同时，JVM
    才会认为两个类属于同一个包。


    由于 Java 的包系统以及它要求的文件系统层级结构，你会看到类存储的所有变体。事实上，开发者将类存储在包层级结构的每一层是非常常见的，尽管层级结构中的每一层在
    JVM 看来实际上都被视为一个独立的包。因此，看到类存储在如下文件夹结构中是很（下一页）：


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_130_0.png)


    对于 JVM 来说，类 `C1`、`C2` 和 `C3` 在完全不同的包中，尽管它们都在同一个包中。


    对我来说，不允许包的分层似乎是一个更好的选择，因为子包反正会被视为不同的包。无论如何，这就是 Java 中包的工作方式，而且让事物井齐是件好事。要记住的主要点是，子包与其上方或下方的包之间没有意义上的关系，除了名称和硬盘上的文件夹结构之外。


    ## 将包组织成模块


    几年前，Java 通过引入一个名为“模块（modules）”的完全新概念进行了重大更新。之所以向 Java 添加这个概念，是因为之前的 Java 版本没有方法可以阻止对整个类包的访问。当然，一直可以将包中的每个类标记为默认访问权限（default
    access），这意味着它不能被包外部的类使用。但这个系统没有考虑到一个类可能被某些外部包需要，但不需要被所有包需要。


    换句话说，标记为非公共的类对任何和所有外部包都是不可见的。相反，如果你想让某个外部包访问你的类，你就必须将其标记为公共类（public class），那么
    Java 中所有的类都可以访问你的类，而不仅仅是你心中的那一个。因此，增加了一个新系统，可以授予某些而非所有其他包使用特定包的权限。


    模块的另一种概念化方式是将其视为访问类成员的另一个障碍，一个位于类级之上的障碍：


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_132_0.png)


    一个更真实的图会显示模块内有多个不同的包，而且一个包内有多个类：


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_133_0.png)


    这一切都是为了向你展示 Java 中存在多种分层的访问限制。除了包、类访问修饰符和成员访问修饰符之外，模块只是实现访问限制的另一种方式。


    '
