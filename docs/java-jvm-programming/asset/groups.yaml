    \ :: tells the JVM that some classes within this module need access to code from\
    \ another module in order to function properly\n- module :: the name of the other\
    \ module that contains the code required for this module\n\nA module has an organized\
    \ file structure with packages and their classes, and its module-info.java file\
    \ is in the root folder of the module. The root folder of the module should be\
    \ named the same name as the module. This is what a module looks like on your\
