    \ = ClassName\n#5 = NameType:6 // \"init\":()V\n#6 = ()\n#7 = ClassName\n#8 =\
    \ Fieldref // field:[I]\n#9 = <init>\n#10 = ClassName\n#11 = field\n#12 = I\n\
    #13 = Code\n#14 = LineNumberTable\n#15 = <init>\n#16 = SourceFile\n#17 = ClassName.java\n\
    static int[] field;\ndescriptor: [I]\nflags: (0x0008) ACC_STATIC\n\nClassName()<()\n\
    descriptor: ()V\nCode:\nstack=1, locals=1, args_size=1\n0: aload_0\n1: invokespecial\
    \ #1 // Method java/lang/Object.\"init\":()V\n4: return\nLineNumberTable:\nline\
    \ 3: 0\n\ndescriptor ()V\nflags: (0x0008) ACC_STATIC\nCode:\nstack=1, locals=0,\
