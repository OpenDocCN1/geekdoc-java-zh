    \ s;\ndescriptor: Ljava/lang/String;\nflags: (0x0000)\n```\n\n在二进制中，两个 flags 字节为：0000000000000000\n\
    \n你可以看到，默认类成员限制通过不设置任何其他访问位来指示，这些位是最右侧的前三个位。\n\n"
