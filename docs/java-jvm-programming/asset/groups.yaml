    So the hard drive folder tree and source files for a single module project looks
    like:


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_144_0.png)'
  - '[PAGE 145]


    Then you can run the compiler just like before, by treating the project as a module:


    ```

    javac

    -d C://classesmoddir/

    --module-source-path C://sourcemoddir/

    C://source/modulename/module-info.java

    C://source/modulename/pkgname/ClassName.java

    ```


    +   - **-d <path>** :: that option tells the compiler to deposit the compiled
    files into that folder, creating the folder if it doesn''t exist already


    +   - **--module-source-path** :: option that tells the compiler where to look
    for the module''s base folder, and thus its module-info file and all of its packages


    +   **java files** :: location and file names of the module-info and class source
    files, which the compiler will convert to the .class format


    After running this command, your hard drive should look like this:


    ![](img/c8857ea016f1259bfbfe6939f1314dc2_145_0.png)'
  - '[PAGE 146]


    Now you can run the code in the module in JVM with the command:


    ```

    java

    --module-path C:/classesmoddir/

    --module nodename/pkgname.ClassName

    ```


    --module-path <path> :: tells JVM where to look for the module

    .class files.


    --module <module/pkgClass> :: tells JVM the name of the module,

    package, and Class that contains the static main entry method

    needs to start executing your code.


    After running this program, you should see the string "Howdy! print

    to the console.


    Congratulations on finishing this section on Java modules! I think

    modules is one of the most confusing parts of Java, so if you''ve made it

    far then you are well on your way to being a Java expert.

    This section on modules is also the last section that really deals with the

    "meta"structure of Java. Understanding the organization of Java code

    into modules, packages, and classes is critically important, which is

    why I put those sections first in this book.


    Now that you have a solid understanding of Java''s meta-organization,

    it is time to start looking at what goes inside classes and methods.

    This is the "coding" part of writing Java programs, and it is also the

    typical material that beginner books on Java cover comprehensively.

    Not wanting to repeat the material again here, I will take a

    slight different approach to Java coding elements, by showing you

    how the Java source code correlates with the .class ClassFile data.

    Hopefully, this will give you a better understanding of how Java source

    code elements are represented and dealt with by the JVM.


    With that, let''s dive into Java''s data structures ~'
  - '[PAGE 147]


    # Storing Information'
  - '[PAGE 148]


    There are a total of twelve unique types of variables that you can use to store
    data in Java. They are usually grouped into two main categories, **primitive**
    and **reference**.


    # Primitive Types


    **Primitive** data is stored in fields and local variables directly as bits, and
    Java has special keywords that you can use to create, store, and operate on primitive
    types of data. The primitive data types are:


    +   - boolean

    - char

    - byte

    - short

    - int

    - long

    - float

    - double


    These are discussed in more detail on the following pages:'
- md: "\nBoolean data can be thought of as the values of a single bit, 1 or 0, ON\
    \ or OFF. Interestingly, inside the JVM the boolean is actually stored as a 32\
    \ bit chunk, but for all practical Java programming you can treat it like a single\
    \ bit.\n\nLet's take a look at how the boolean primitive is handled by the JVM,\
    \ by using the javap command to examine the .class file of a simple class:\n\n\
    ```java\nclass ClassName {\n  static boolean instField = true;\n}\n```\n\nI've\
    \ written a very simple class that has one static field of the primitive boolean\
    \ type. Of course, the JVM secretly adds the instance constructor method <init>,\
    \ also called ClassName() in the javap output. And because the boolean field is\
    \ static, JVM secretly adds the static initialization block <clinit>, since I\
    \ set the value of the boolean variable in the source code. Below is the javap\
    \ output for this class:\n\n```\nclass ClassName\nminor version: 0\nmajor version:\
    \ 50\nflags: (0x020) ACC_SUPER\nthis_class: #8 // ClassName\nsuper_class: #2 //\
    \ java/lang/Object\ninterfaces: 0\n```\n\n```\nClassName():\ndescriptor: (V)\n\
    flags: (0x0000)\nCode:\nstack=1, locals=1, args_size=1\n0: aload_0\n1: invokespecial\
    \ #1    // Method java/lang/Object.\"<init>\":V\n4: return\nLineNumberTable:\n\
    \ line 1: 0\n```\n\n```\nstatic {};\ndescriptor: (V)\nflags: (0x0008) ACC_STATIC\n\
    Code:\nstack=1, locals=0, args_size=0\n0: const_1\n1: putstatic #7    // Field\
    \ field:Z\n4: return\nLineNumberTable:\n line 3: 0\n```\n\nSourceFile: \"ClassName.java\"\
    \n```\n\nThe static boolean field is listed as the only field, just after the\
    \ constant pool. The entry tells you the name, data type, and any flags set for\
    \ this field.\n\nIn the source code, a value is assigned to this static boolean\
    \ field, and this is reflected in the .class file by the fact that the static\
    \ initialization block, which is in fact turned into a method in the .class file,\
    \ has some opcode instructions that do the assignment. Let's step through the\
    \ opcodes so you can see how it works:\n\nThe first opcode is **const_1**. This\
    \ opcode is one byte in size, and it pushes an integer value of 1 onto the method\
    \ frame's operand stack.\n\n![](img/c8857ea016f1259bfbfe6939f1314dc2_150_0.png)\n\
    \nThe second opcode is **putstatic #7**. This command is three bytes in size.\
    \ The first byte is the putstatic opcode, and the next two bytes are a pointer\
    \ to the constant pool entry #7, ClassName.field:Z, which tells the location where\
    \ the static boolean field resides in JVM memory. This putstatic command also\
    \ uses the top value on the operand stack, which is now 1 after the previous opcode,\
    \ and transfers it to the variable indicated by the constant pool reference. In\
    \ summary, the putstatic command takes the value off the top of the operand stack,\
    \ which is 1, and moves it into the memory location pointed at by the constant\
    \ pool reference, ClassName.field:Z, which was given by the two bytes immediately\
    \ following the putstatic opcode.\n\n![](img/c8857ea016f1259bfbfe6939f1314dc2_151_0.png)\n\
    \nThe third opcode is **return**. This command is one byte long, and it is the\
    \ command to return void, meaning no actual return value, from a method. This\
    \ is the final opcode in the <clinit> static initialization block, and it returns\
    \ program execution control to whatever code that called this method in the first\
    \ place.\n\nLet's look at one more example of a boolean primitive, where we create\
    \ a boolean value inside a method. Here is the source code for a simple class\
    \ that does this:\n\n```java\nclass ClassName {\n  void method() {\n    boolean\
    \ local = false;\n  }\n}\n```\n\nIn this source code there is an instance method\
    \ called method(), and inside the method a boolean variable named local is assigned\
    \ the value false. Let's look at the jav output for this simple class and see\
    \ how this boolean is created:\n\n```\nclass ClassName\nminor version: 0\nmajor\
    \ version: 60\nflags: (0x0020) ACC_SUPER // ClassName\nthis_class: #7\nsuper_class:\
    \ #2 // java/lang/Object\ninterfaces: 0, fields: 2, attributes: 1\nConstant pool:\n\
    #1 = Methodref #2.#3 // java/lang/Object.\"<init>():V\n#2 = Class #4 // java/lang/Object\n\
    #3 = NameAndType #5.#6 // <init>():V\n#4 = Utf8 java/lang/Object\n#5 = Utf8 <init>\n\
    #6 = Utf8 (V)\n#7 = Class // ClassName\n#8 = Utf8 Code\n#9 = Utf8 LineNumberTable\n\
    #10 = Utf8 method\n#11 = Utf8 SourceFile\n#12 = Utf8 ClassName.java\n#13 = Utf8\n\
    ClassName():\ndescriptor: ()V\nflags: (0x0000)\nCode:\nstack:1, locals=1, args_size=1\n\
    0: load_0\n1: invokespecial #1 // Method java/lang/Object.\"<init>():V\n2: return\n\
    LineNumberTable:\nline 1: 0\n```\n\n```\nvoid method();\ndescriptor: ()V\nflags:\
    \ (0x0000)\n```\n\n```\nCode:\nstack=1, locals=2, args_size=1 opcode\n0: const_0\n\
    1: istore_1\n2: return\nLineNumberTable:\nline 5: 0\nline 6: 2\n}\n```\n\nSourceFile:\
    \ \"ClassName.java\"\n\nYou can see the method() information in the ClassFile\
    \ output of javap, and that this method will execute three opcodes. Let's walk\
    \ through these opcodes:\n\nThe first opcode is **const_0**. Similar to the istore_1\
    \ opcode from above, this opcode does the thing, which is to load a value onto\
    \ the top of the operand stack of the method's frame. This time however, instead\
    \ of loading the value of one, 0x00000001, the const_0 command loads the value\
    \ of zero, 0x00000000. This is because in the source code the boolean local variable\
    \ is being assigned the value of false, which is represented by the integer zero\
    \ in JVM.\n\n![](img/c8857ea016f1259bfbfe6939f1314dc2_153_0.png)\n\nThe second\
    \ opcode is **istore_1**. This opcode is used to store a value into the local\
    \ variable array of the method frame. The local variable array is indexed starting\
    \ at 0, so this command stores value into the second entry, at index 1, of the\
    \ local variable array. The value transferred into the array is whatever value\
    \ is at the top of the frame's operand stack. In this case, this top value of\
    \ the operand stack is 0, which was put there by the previous opcode, const_0.\n\
    \n![](img/c8857ea016f1259bfbfe6939f1314dc2_154_0.png)\n\nSo you can see in these\
    \ examples of the boolean type that the boolean itself, written as true or false,\
    \ is actually 32-bit set equal to 1 or 0. Now onto the char primitive...\n\nChar\
    \ data is a bit unique, because it is technically a number, even though the purpose\
    \ of char is to represent letters. Char data is 16 bits unsigned. Unsigned means\
    \ 16 bits can only represent positive numbers, not negative numbers. Regardless\
    \ of the sign allowed, 16 bits give a total of 2^16=65,536 possible values. This\
    \ is fine for char because it is not used for mathematics, it is simply a number\
    \ that maps to a character. Since char is for representing letters and characters,\
    \ you can use single quotes around letters in source code to reference characters\
    \ directly, instead of having to use their number representation. For example:\
    \ char c=65, and char='A' do the exact same thing, because the letter A is indexed\
    \ by the number 65.\n\nLet's look how the JVM treats char primitives by writing\
    \ a simple class that stores a char as a static field. This is the source code:\n\
    \n```java\nclass ClassName {\n    static char field = 'A';\n}\n```\n\nI won't\
    \ include the entire jav output, because it is similar to the one shown above\
    \ for boolean. Here is the important part, the <init> static initialization method:\n\
    \n```\nstatic {};\ndescriptor: (0x0008) ACC_STATIC\nCode:\nstack=1, locals=0,\
    \ args_size=0\n0: bipush 65\n2: putstatic #7 // Field field:C\n5: return\nLineNumberTable:\n\
    \ line 3:0\n```\n\nThere are three opcodes in this initialization method, but\
    \ the last two are identical to the ones shown above for the boolean static field.\
    \ The putstatic opcode takes the top value off the operand stack and puts it into\
    \ the memory location indicated by the constant pool reference #7, which is ClassName.field:C,\
    \ indicating the location in memory where the operand popped from the stack should\
    \ go as well as the type, C for char. The return opcode returns nothing back to\
    \ the calling frame as it exits the static initialization method frame.\n"
  mdcn: "\n布尔（Boolean）数据可以被视为单位的值，即 1 或 0，开启（ON）或关闭（OFF）。有趣的是，在 JVM 内部，boolean 实际上被存储为\
    \ 32 位的块，但对于所有的实际 Java 编程，你可以将其视为单位。\n\n让我们通过使用 `javap` 命令检查简单类的 `.class` 文件，来看看\
    \ JVM 是如何处理 `boolean` 原始类型的：\n\n```java\nclass ClassName {\n  static boolean instField\
    \ = true;\n}\n```\n\n我写了一个非常简单的类，包含一个原始 `boolean` 类型的静态字段。当然，JVM 秘密地添加了实例构造器方法\
    \ `<init>`，在 `javap` 输出中也称为 `ClassName()`。由于布尔字段是静态的，而且我在源代码中设置了该布尔变量的值，JVM 还会秘密地添加静态初始化块\
    \ `<clinit>`。以下是该类的 `javap` 输出：\n\n```\nclass ClassName\nminor version: 0\nmajor\
    \ version: 50\nflags: (0x020) ACC_SUPER\nthis_class: #8 // ClassName\nsuper_class:\
    \ #2 // java/lang/Object\ninterfaces: 0\n```\n\n```\nClassName():\ndescriptor:\
    \ (V)\nflags: (0x0000)\nCode:\nstack=1, locals=1, args_size=1\n0: aload_0\n1:\
    \ invokespecial #1    // Method java/lang/Object.\"<init>\":V\n4: return\nLineNumberTable:\n\
    \ line 1: 0\n```\n\n```\nstatic {};\ndescriptor: (V)\nflags: (0x0008) ACC_STATIC\n\
    Code:\nstack=1, locals=0, args_size=0\n0: const_1\n1: putstatic #7    // Field\
    \ field:Z\n4: return\nLineNumberTable:\n line 3: 0\n```\n\nSourceFile: \"ClassName.java\"\
    \n```\n\n静态布尔字段被列为唯一的字段，紧跟常量池之后。该条目告诉了字段的名称、数据类型以及为该字段设置的任何标志。\n\n在源代码中，一个值被赋值了这个静态布尔字段，这在\
    \ `.class` 文件中体现为：静态初始化块（实际上在 `.class` 文件中转换为一个方法）包含了一些执行赋值操作的操作码指令。让我们逐步查看这些操作码，以便你看到它是如何工作的：\n\
    \n第一个操作码是 **const_1**。该操作码的大小为一字节，它将一个整数值 1 推送到（push）方法帧的操作数数栈上。\n\n![](img/c8857ea016f1259bfbfe6939f1314dc2_150_0.png)\n\
    \n第二个操作码是 **putstatic #7**。该命令的大小为三个字节。第一个字节是 `putstatic` 操作码，接下来两个字节是指向常量池条目\
    \ #7 (`ClassName.field:Z`) 的指针，它告诉了静态布尔字段在 JVM 内存中的位置。此 `putstatic` 命令还使用了操作数栈顶部的值（在上一个操作码之后现在是\
    \ 1），并将其转移到常量池引用所指示的变量。简而言之，`putstatic` 命令从操作数栈顶端取出值 1，并将其移动到常量池引用所指向的内存位置 `ClassName.field:Z`，该位置是由紧随\
    \ `putstatic` 操作码的两个字节提供的。\n\n![](img/c8857ea016f1259bfbfe6939f1314dc2_151_0.png)\n\
    \n第三个操作码是 **return**。该命令长度为一字节，它是从方法返回 `void` 的命令，意味着没有实际的返回值。这是 `<clinit>` 静态初始化块中的最后一个操作码，它将程序执行控制返回给最初调用此方法的代码。\n\
    \n让我们看另一个 `boolean` 原始类型的例子，我们在方法内部创建了一个布尔值。以下是执行此操作的简单类的源代码：\n\n```java\nclass\
    \ ClassName {\n  void method() {\n    boolean local = false;\n  }\n}\n```\n\n\
    在该源代码中有一个名为 `method()` 的实例方法，在方法内部，名为 `local` 的布尔变量被赋值为 `false`。让我们看看这个简单类的 `javap`\
    \ 输出，看看这个布尔值是如何创建的：\n\n```\nclass ClassName\nminor version: 0\nmajor version:\
    \ 60\nflags: (0x0020) ACC_SUPER // ClassName\nthis_class: #7\nsuper_class: #2\
    \ // java/lang/Object\ninterfaces: 0, fields: 2, attributes: 1\nConstant pool:\n\
    #1 = Methodref #2.#3 // java/lang/Object.\"<init>():V\n#2 = Class #4 // java/lang/Object\n\
    #3 = NameAndType #5.#6 // <init>():V\n#4 = Utf8 java/lang/Object\n#5 = Utf8 <init>\n\
    #6 = Utf8 (V)\n#7 = Class // ClassName\n#8 = Utf8 Code\n#9 = Utf8 LineNumberTable\n\
    #10 = Utf8 method\n#11 = Utf8 SourceFile\n#12 = Utf8 ClassName.java\n#13 = Utf8\n\
    ClassName():\ndescriptor: ()V\nflags: (0x0000)\nCode:\nstack:1, locals=1, args_size=1\n\
    0: aload_0\n1: invokespecial #1    // Method java/lang/Object.\"<init>\":V\n4:\
    \ return\nLineNumberTable:\n line 1: 0\n```\n\n"
