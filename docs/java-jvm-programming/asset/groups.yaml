    flags: (0x0009) ACC_PUBLIC, ACC_STATIC\nCode:\nstack=2, locals=2, args_size=1\n\
    0: icon_1\n1: icon_0\n2: idiv\n3: istore_1\n4: goto\n7: astore_1      16\n8: getstatic\
    \     #9 // Field java/lang/System.out:Ljava/io/PrintStream;\n11: ldc        \
