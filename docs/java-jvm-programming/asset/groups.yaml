    The **try and catch** code blocks are used in source code. If you have a piece
    of source code that might fail, like trying to divide by zero for example, you
    put that code inside the try{\70} code block. Immediately after the try{\70} block,
    you write the catch{\70} block, with a parameter passed to catch having the data
    type of Throwable or some subclass.'
  - "[PAGE 203]\n\nThe reason for the try/catch construct is that the compiled .class\
    \ file will mark all the opcodes within the try block as needing to be watched\
    \ over by the JVM, in case it throws an error. If there is an error, the JVM will\
    \ look at the catch block to see if the particular subtype of the error matches\
    \ one of the types passed into the catch block. If the error matches the catch\
    \ block parameter's type, then JVM hops to the opcode in that particular catch\
    \ block and restarts program execution.\n\nHere is an example. Notice how I put\
    \ the suspicious code inside the try{} block. Also notice that I used the top-most\
    \ level class that Java has, i.e. Throwable, instead of any one of the more specific\
    \ subclasses. This makes it so that any kind of error occurring within the try\
    \ block results in JVM's program execution to jump, or hop, into that catch block:\n\
    \n```\nclass ClassName\n{\n    static public void main(String[] args) {\n    \
    \    try {\n            int x = 1/0;\n        }\n        catch(Throwable e) {\n\
    \            System.out.println(\"catch\");\n        }\n    }\n}\n```\n\nHere\
    \ is the relevant portion of the javap output, showing the method main():\n\n\
