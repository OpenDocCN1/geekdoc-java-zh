  mdcn: "\n\n## 模块到底什么是模块？\n\n它是包及其类的集合，放置在同一个文件夹中，并包含一个特殊类型的 .java 文件，称为 `module-info`\
    \ 文件。这个特殊文件必须位于模块的根目录。它说明了该模块中的哪些包可以供其他模块的代码使用。它还说明了自己的类为了正常运行需要哪些其他模块的代码。\n\n\
    `module-info.java` 文件的基本结构如下：\n\n```\nmodule modulename // 关键字 + 模块名称\nexports\
    \ package; // 允许外部代码使用此包\nrequires module; // 访问另一个模块的代码\n```\n\n- module :: 这是一个\
    \ Java 源码关键字，它告诉编译器你正在编写一个 module-info 定义。\n- modulename :: 这是你模块的名称，它可以只包含字母，或者字母与点的组合，但无论包含多少个点，它始终被视为单个单词。\n\
    - exports :: 告诉 JVM 应该允许其他模块访问该模块中特定包的类。\n- package :: 外部可见的包名。\n- requires ::\
    \ 告诉 JVM 该模块内的某些类需要访问另一个模块的代码才能正常工作。\n- module :: 包含该模块所需代码的另一个模块的名称。\n\n模块具有组织良好的文件结构，包含包及其类，其\
    \ `module-info.java` 文件位于模块的根文件夹。模块的根文件夹名称应与模块名称相同。这是模块在你的硬盘上的样子：\n\n![](img/c8857ea016f1259bfbfe6939f1314dc2_135_0.png)\n\
    \n如果模块尚未编译，那么 `module-info` 和类文件将以源文本的形式存在，其文件类型为 \"java\"。\n\n一旦你编译了模块，`module-info`\
    \ 和类文件将转换为它们的 `ClassFile` 格式，其文件类型将变为 \"class\"。\n\n如果你正在编写一个较小的项目，你可能需要将文件放在一个单一模块中。然而，你可以为多个模块编写代码，然后将所有模块放在一个大文件夹中。这个大文件夹被称为模块目录（module\
    \ directory folder），你告诉编译器和 JVM 在需要查找模块时去那里查找。例如，如果你创建了两个模块，可以这样做：\n\n```\nC:/\n\
    sourcemoddir/\nmoduleone/ moduletwo/\nmodule-info.java pkgone/ module-info.java\
    \ pkgtwo/\nClassOne.java ClassTwo.java\n```\n\n在这个文件树中，模块目录被称为 `sourcemod/`，该文件夹包含两个模块的根文件夹。在这个简单的示例中，每个模块只有一个包，每个包中有一个类。注意，尽管它们在不同的模块中，但包名是唯一的。\n\
    \n我写了一个简单的程序，来演示 `module-info` 文件中的 `requires` 和 `exports` 关键字。让我们来看看每个 .java\
    \ 文件，看看这个小小的 Java 程序将做什么。首先是 `ClassOne.java` 文件：\n\n```\n// ClassOne.java\npackage\
    \ pkgone;\n\npublic class ClassOne {\n    static public void main(String[]) {\n\
    \        System.out.println(pkgtwo.ClassTwo.classTwoField);\n    }\n}\n```\n\n\
    该文件包含一个名为 `ClassOne` 的类的定义，它是 `pkgone` 包的一部分。该类包含 Java 程序的入口方法 `main()`。在 `main()`\
    \ 方法内部，调用了 `System.out.println()` 方法，它打印的内容是来自 `ClassTwo` 类的一个字段，该字段位于 `pkgtwo`\
    \ 包中，而该包位于 `moduletwo` 模块中。让我们来看看 `ClassTwo` 类中将被打印的字段：\n\n```\n// ClassTwo.java\n\
    package pkgtwo;\n\npublic class ClassTwo {\n    static public String classTwoField\
    \ = \"Hello there\";\n}\n```\n\n`ClassTwo` 非常简单。它被列为 `pkgtwo` 包的一部分，并且是一个公共类。它只有一个类成员，一个持有字符串值“Hello\
    \ there!”的静态字段。\n\n所以，这个 Java 程序包含两个类。`ClassOne` 是代码执行的起点，因为它有 `main()` 入口方法。\n\
    \n在 `main()` 方法内部，调用了 `System.println` 方法并将 `ClassTwo` 的静态字段作为其参数。因此，为了让这个项目正常运行，`ClassOne`\
    \ 需要访问 `ClassTwo` 的字段。\n\n这是一个问题，因为 `ClassOne` 和 `ClassTwo` 位于不同的模块中。然而，可以通过适当设置两个模块的\
    \ `module-info` 文件来授予访问权限。也就是说，`ClassOne` 模块需要请求对 `ClassTwo` 模块的访问权限。而 `ClassTwo`\
    \ 模块需要允许其 `pkgtwo` 包被其他模块访问。\n\n首先，让我们看看 `moduleone` 如何设置其 `module-info` 文件以请求对\
    \ `moduleletwo` 代码的访问：\n\n```\n// moduleone's module-info.java\nmodule moduleone\n\
    {\n    requires moduleletwo;\n}\n```\n\n你可以看到 `moduleone` 使用 `requires` 关键字告诉\
    \ JVM 它想要访问 `moduleletwo` 模块包含的包。如果 `moduleletwo` 有任何公共类，那么来自 `moduleone` 的代码就可以使用它们。现在来看看\
    \ `moduleletwo` 的 `module-info` 文件：\n\n```\n// moduleletwo's module-info.java\
    \ file\nmodule moduleletwo\n{\n    exports pkgtwo;\n}\n```\n\n你可以看到 `moduleletwo`\
    \ 使用 `exports` 关键字告诉 JVM，允许其他模块使用其 `pkgtwo` 包中的类。\n\n所以，这四个 java 文件组成了一个简单的 Java\
    \ 程序。当然，将两个类放在同一个模块的同一个包中会更容易，但这是一个关于如何使用模块系统的示例，它们位于不同的模块。\n\n要用 JVM 运行这些模块中的代码，你必须首先将它们编译为\
    \ `.class` 单元。幸运的是，你可以指示编译器在一个命令中编译所有的四个 .java 文件，告诉它模块目录在哪里，然后给它一个源代码列表。你必须告诉编译器它应该创建一个新的模块目录，这个目录包含\
    \ .class 文件。编译器命令通常写在一行，但我将每个 `javac` 参数分行写，以便你看得更清楚：\n\n```\njavac\n-d C:/classesmoddir/\n\
    --module-source sourcemoddir/\n--module-path C:/sourcemoddir/\nsourcemoddir/moduleone/module-info.java\
    \ sourcemoddir/moduleone/pkgone/ClassOne.java sourcemoddir/moduletwo/module-info.java\
    \ sourcemoddir/moduletwo/pkgtwo/ClassTwo.java\n```\n（注：命令行的 OCR 严重乱码；我根据上下文重构了逻辑\
    \ javac 命令）。\n\n"
