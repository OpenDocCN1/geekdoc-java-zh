- md: "\n# JVM Memory Areas\n\nThe ClassFile examples showing the two `<init>` and\
    \ `<clinit>` initialization methods are related to the issue of where and when\
    \ data is stored by the JVM. I would say JVM memory has two major concepts, (1)\
    \ where in memory is data stored, and (2) when is that data created? Before answering\
    \ these questions, we should take a quick tour of JVM's memory areas.\n\nJVM is\
    \ a simulated computer (Java Virtual Machine), and so it uses artificially separated\
    \ pieces of memory. A computer doesn't have to have memory like this, it's just\
    \ how the JVM is designed to work. JVM has three separate chunks of memory: MethodArea,\
    \ HeapArea, and ThreadArea.\n\nMethodArea memory is where class templates are\
    \ stored. All the fields, methods, constructors, and everything else inside a\
    \ class gets saved in this MethodArea memory. Basically everything in the .class\
    \ byte-formatted ClassFiles like when we are analyzing are stored in the MethodArea\
    \ memory. Critically, if a field or method is marked as static in source code,\
    \ that field or method is only in the MethodArea and is not stored as part of\
    \ class instances in a different memory location called the HeapArea. The main\
    \ thing to understand the MethodArea memory is that it is a permanent storage\
    \ area that holds a single, template copy of every class used in your code. Static\
    \ fields and methods have their values or code stored in this memory area.\n\n\
    HeapArea is where class instances are stored. An instance is basically a copy\
    \ of a class, based on the class template that is stored in the MethodArea. These\
    \ copies are their own objects in memory, and do not share any values in real-time\
    \ with either the class template or other instance copies. In other words, updating\
    \ the value of a field in one instance copy does not change the value of the same\
    \ field in any other instance copy, because they are different instances and thus\
    \ the memory addresses are different. Unique entities in HeapArea memory, each\
    \ class instance has its own address, which is used to access the fields and methods\
    \ within that instance, and this is the reason why fields in separate instance\
    \ copies are truly different even though their simple names are identical.\n\n\
    ThreadArea memory is all about invoking methods and the variables declared inside\
    \ those methods, which are called local variables. This memory area is called\
    \ ThreadArea because each thread in a program has its own personal ThreadArea\
    \ memory. Some programs use several execution threads, but multi-threading is\
    \ an advanced programming technique that is beyond this book, so I will consider\
    \ only single-thread programs. However, the ThreadArea memory is identical in\
    \ structure for each thread, so if you understand how the ThreadArea memory works\
    \ for single-thread programs, then you will also understand programs with several\
    \ ThreadArea memory chunks. ThreadArea memory chunk is itself divided into two\
    \ smaller chunks: (1) a program counter and (2) a method stack.\n\n- The program\
    \ opcode counter is an incrementing ticker that points to the JVM opcode that\
    \ is currently being executed by the JVM computer. Only one opcode can be executed\
    \ at any given time by a single thread, which is why JVM has one program opcode\
    \ counter per thread.\n- The method frame stack is basically a list of so-called\
    \ method frames. Each method gets called in your Java code, a new frame is created\
    \ in this stack area. This implies that there can be multiple frames representing\
    \ the method, if the method gets invoked multiple times. Each method frame is\
    \ divided into three method areas: (1) a reference to the constant pool (which\
    \ is in MethodArea memory) of the class that defined that frame's method; (2)\
    \ a list of so-called local variables that can be used only by the same frame;\
    \ and (3) a stack of operand values that are to be used, i.e. operated on, by\
    \ JVM opcode instructions.\n\n  - Class Template Constant Pool Reference - this\
    \ is an address to the constant pool of the class template, which is stored in\
    \ the MethodArea memory. This is needed for opcode execution because the names\
    \ of fields and methods are only stored by reference in the constant pool table.\n\
    \  - Local Variables Array - this is an array of variables, which are called local\
    \ variables by definition of them being in this array. There are four distinct\
    \ types of information stored in this local variables array:\n    - Memory address\
    \ to the class template or instance copy where the method was invoked from.\n\
    \    - Method parameters that were passed into the method within the parentheses.\n\
    \    - Variables declared within the method's code block.\n    - Memory address\
    \ where any values returned from the method should be returned to.\n  - The Operand\
    \ Stack - this is an empty list that has to be used, i.e. operated on, by JVM\
    \ opcode instructions.\n\n- The Operand Stack - this is an empty list that has\
    \ to be used, i.e. operated on, by JVM opcode instructions.\n\n- Memory address\
    \ where any values returned from the method should be returned to.\n\n- The Operand\
    \ Stack - this is an empty list that has to be used, i.e. operated on, by JVM\
    \ opcode instructions.\n\n- The Operand Stack - this is an empty list that has\
    \ to be used, i.e. operated on, by JVM opcode instructions.\n\n- The Operand Stack\
