    What is an attribute you ask?


    The best way to think about an attribute is that it is simply a catch-all way
    to recover important information about a Java code structure. I think that attributes
    are confusing because they are attached to code structures at different levels
    of abstraction. For example:


    A class has class attributes.


    An interface has interface attributes.


    A method has method attributes.


    A field has field attributes.


    An attribute can have attributes


    In JVM documentation, all these different kinds of attributes are lumped together.
    There is a grand total of 30 attributes. Some attributes can be used for any code
    structure. Other attributes are specific for one type of code structure, like
    methods.


    Each of the 30 attributes has its own byte formatting, but the first 2 bytes is
    always a constant pool reference that tells which of the 30 types of attributes
    it is. This is demonstrated on the next page.'
