    \n现在，为了操作你创建的数组，你将使用类字段变量名作为指向实际数组数据的引用。这些 Java 数组使用了方括号的特殊语法，你可以用它来更改存储在数组元素中的值。不过，我不会详细介绍获取和设置数组值的方法，因为网上有很多资源会教你如何操作。\n\
    \n相反，让我们在下一页继续另一个 Java 数组对象的示例：\n\n# 二维数组，内部数组包含整数原始类型\n\n此示例将是一个整数原始类型的二维数组。\n\
