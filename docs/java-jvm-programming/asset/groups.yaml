    \ around letters in source code to reference characters directly, instead of having\
    \ to use their number representation. For example: char c=65, and char='A' do\
    \ the exact same thing in source code, because the letter A is indexed by the\
    \ number positive 65.\n\nLet's look how the JVM treats char primitives by writing\
    \ a simple class that stores a char as a static field. This is the source code:\n\
    \n```\nclass ClassName\n{\\    static char field = 'A';\n}\n```\n\nI won't include\
    \ the entire jav output, because it is similar to the one shown above for boolean.\
    \ Here is the important part, the <init> static initialization method:\n\n```\n\
    static {};\ndescriptor: (0x0008) ACC_STATIC\nCode:\n stack=1, locals=0, args_size=0\n\
    \ 0: bipush 65\n 2: putstatic #7 // Field field:C\n 5: return\nLineNumberTable:\n\
    \ line 3:0\n```\n\nThere are three opcodes in this initialization method, but\
    \ the last two are identical to the ones shown above for the boolean static field.\
    \ The putstatic opcode takes the top value off the operand stack and puts it into\
    \ the memory location indicated by the constant pool reference #7, which is ClassName.field:C,\
    \ indicating the location in memory where the operand popped from the stack should\
    \ go as well as the type, C for char. The return opcode returns nothing back to\
    \ the calling frame as it exits the static initialization method frame."
- md: "\nThat leaves at first opcode, bipush. The complete bipush opcode command is\
    \ two bytes long, with the first byte being the bipush opcode itself, and the\
    \ second byte being the value that will be pushed onto the operand stack of the\
    \ method frame. In this example, the value pushed onto the operand stack is the\
    \ integer number 65, which is the number that stands for the capital letter A.\n\
    \nThe choice of opcode bipush is interesting because it technically takes one\
    \ byte (8 bits) of information, converts that value to an integer (32 bits), and\
    \ then pushes it onto the operand stack. However, the char primitive data type\
    \ is supposed to be two bytes (16 bits) long, so JVM must use a different opcode\
    \ if the character is represented by a number larger than 255, the maximum positive\
    \ number for 8 bits. Let's look at an source code example where the char is a\
    \ character represented by the integer number 937, which represents the omega\
    \ character Ω, which is hex value 0x03A9, and which can be represented in source\
    \ code with the unicode indicator \\u, like this:\n\n```\nclass ClassName {\n\
    \  static char field = '\\u03A9';\n}\n```\n\nThe <init> static initialization\
    \ method from the javap output:\n\n```\nstatic <init>;\ndescriptor: (0x0002) ACC_STATIC\n\
    Code:\n  stack=1, locals=0, args_size=0\n  0: bipush             937\n  3: putstatic\
    \          // Field field:C\n  6: return\nLineNumberTable:\n  line 3: 0\n```\n\
    \nIf you look at the first opcode command in the method's Code attribute, you\
    \ can see that the bipush command has been replaced by the sipush command. Being\
    \ from the same family, the sipush opcode takes 16 bits of information, and pushes\
    \ it onto the operand stack of the method frame. In this example, you can see\
    \ that the value pushed onto the operand stack is decimal 937, which is the same\
    \ value as hex 0x03A9, the value written in the source code. So this value pushed\
    \ onto the operand stack is the numerical value that represents the character\
    \ written in source code. And because we made the variable to be a static class\
    \ field, this value gets transferred by the putstatic command into the memory\
    \ location for the static field in MethodArea memory.\n\nNext up is the Byte primitive\
    \ type...\n\nByte data is a signed 8 bits. Signed means that byte type data can\
    \ represent both negative or positive numbers, but within limit. What is the limit?\
    \ Eight bits of binary information can store 2^8=256 unique values, so the allowed\
    \ values are -128 up through +127. Including zero, this is 128 negative values,\
    \ and 128 positive values, for a total of 256 unique numbers, centered around\
    \ zero.\n\nSimilar to the previous example, we will use a static class field as\
    \ an example structure to see how JVM creates a byte primitive type. Here is the\
    \ source code class:\n\n```\nclass ClassName\n{\n  static byte field = -1;\n}\n\
    ```\n\nAnd the static initialization method from javap output is:\n\n```\nstatic\
    \ {};\ndescriptor:(V)\nflags:(0x0008) ACC_STATIC\nCode:\nstack=1, locals=0, args_size=0\n\
    0: iconst_m1\n1: putstatic #7 // Field field:B\n4: return\nLineNumberTable:\n\
    line 3: 0\n```\n\nHere the byte data is pushed onto the method frame's operand\
    \ stack using the iconst_m1 opcode. iconst_m1 pushes the 8-bit value Ob1111111\
    \ onto the stack. This value actually represents the decimal number -1 because\
    \ the byte type is a signed type, and it uses the two's complement system to represent\
    \ negative numbers.\n\nWhat about other negative numbers - how are they created?\n\
    \nThis source code:\n\n```\nclass ClassName\n{\n  static byte field = -127;\n\
    }\n```\n\nGives a javap output for the <init> static initialization method of:\n\
    \n```\nstatic {};\n```\n\ndescriptor: ()V\nflags: (0x0008) ACC_STATIC\nCode:\n\
    stack=1, locals=0, args_size=0\n0: bipush             -127\n2: putstatic     \
    \     #7 // Field field:B\n5: return\nLineNumberTable:\nline 3: 0\n```\n\nAnd\
    \ the iconst_m1 opcode is replaced by the opcode bipush. The entire bipush command\
    \ is actually two bytes long. The first byte is the bipush opcode itself. The\
    \ second byte holds the value to be pushed onto the frame's operand stack. Because\
    \ the source code assigns the value -127 to the class field, that value is given\
    \ as the argument to the bipush command.\n\nNext up is short primitives...\n\n\
    Short data is a signed 16 bits. So it holds a total of 2^16 = 65,536 unique values,\
    \ spread around zero, meaning the possible values for a Java short are -32,768\
    \ up to 32,767.\n\nYou are probably getting the hang of primitive representation\
    \ in JVM by now, so let's speed up a bit. Here is a class with a short primitive\
    \ type:\n\n```\nclass ClassName\n{\n    static short field = -1;\n}\n```\n\nAnd\
    \ this is the javap output for the <clinit> static init method:\n\n```\nstatic\
    \ {};\ndescriptor: ()V\nflags: (0x0008) ACC_STATIC\nCode:\nstack=1, locals=0,\
    \ args_size=0\n  0: const_m1\n  1: putstatic      # // Field field:S\n  4: return\n\
    LineNumberTable:\nline 3: 0\n```\n\nEven though the field's type is a primitive\
    \ short in source code, the same JVM opcode as for the byte type is used to push\
    \ the value -1 onto the operand stack. The values are the same, -1 for either\
    \ the byte or short fields in these examples, so the same opcode works just fine.\
    \ Let's find out which opcode is used for the largest number possible with a primitive\
    \ short, 32,767.\n\nThe class source is:\n\n```\nclass ClassName\n{\n    static\
    \ short field = 32767;\n}\n```\n\nAnd the javap output shows:\n\n```\nstatic {};\n\
    descriptor: ()V\nflags: (0x0008) ACC_STATIC\nCode:\nstack=1, locals=0, args_size=0\n\
    \  0: sipush      32767\n3: putstatic      #7              // Field field:S\n\
    6: return\nLineNumberTable:\nline 3: 0\n```\n\nNow the opcode used to push the\
    \ assignment value is sipush, a three byte command. The first byte names sipush\
    \ as the opcode, and two bytes following hold the value of the number that will\
    \ be assigned to the class field.\n\nInt data is a signed 32 bits. With a total\
    \ of 2^32 = 4,294,967,296 possible unique values, the Java int can be any number\
    \ from -2,147,483,648 up to 2,147,483,647.\n\nThis class assigns the value 1 to\
    \ the integer field:\n\n```\nclass ClassName{\n    static int field = -1;\n}\n\
    ```\n\nThe jav output for the <clinit> static int method is:\n\n```\nstatic {};\n\
    descriptor: ()V\nflags: (0x0008) ACC_STATIC\nCode:\nstack=1, locals=0, args_size=0\n\
    0: iconst_m1\n1: putstatic          // Field field:I\n4: return\nLineNumberTable:\n\
    line 3: 0\n```\n\nAgain the iconst_m1 command is used to push this value onto\
    \ the operand stack. Now, this class assigns a much larger number (the underscores\
    \ are ignored) to the integer field:\n\n```\nclass ClassName\n{\n    static int\
    \ field = 1;\n}\n```\n\nWe need the jav output for this one, so it is:\n\n```\n\
    static {};\ndescriptor: ()V\nflags: (0x0008) ACC_STATIC\nCode:\n    stack=1, locals=0,\
    \ args_size=0\n    0: iconst_1\n    1: putstatic #7 // Field field:I\n    4: return\n\
    LineNumberTable:\n    line 3: 0\n```\n```\n"
  mdcn: "\n剩下的第一个操作码是 `bipush`。完整的 `bipush` 操作码长度为两个字节，第一个字节是 `bipush` 操作码本身，第二个字节是将要推入方法帧操作数栈（operand\
    \ stack）的值。在这个示例中，推入操作数栈的值是整数 65，即代表大写字母 A 的数字。\n\n选择操作码 `bipush` 非常有趣，因为它在技术上它取一个字节（8位）的信息，将该值转换为整数（32位），然后将其推入操作数栈。然而，`char`\
    \ 原始数据类型应该是两个字节（16位）长，因此如果字符表示的数字大于 255（8位的最大正数），JVM 必须使用不同的操作码。让我们来看源代码示例，其中\
    \ `char` 是由整数 937 表示的字符，代表 Omega 字符 Ω，其十六进制值为 0x03A9，在源代码中可以使用 unicode 指示符 `\\\
    u` 表示，如下：\n\n```\nclass ClassName {\n  static char field = '\\u03A9';\n}\n```\n\
    \n`javap` 输出中的 `<init>` 静态初始化方法：\n\n```\nstatic <init>;\ndescriptor: (0x0002)\
    \ ACC_STATIC\nCode:\n  stack=1, locals=0, args_size=0\n  0: bipush           \
    \  937\n  3: putstatic          // Field field:C\n  6: return\nLineNumberTable:\n\
    \  line 3: 0\n```\n\n如果你查看方法 `Code` 属性中的第一个操作码命令，你会发现 `bipush` 命令被 `sipush` 命令替换了。由于属于同一家族，`sipush`\
    \ 操作码取 16 位的信息，并将其推入方法帧的操作数栈。在这个示例中，你可以看到推入操作数栈的值是十进制 937，这与源代码中编写的十六进制 0x03A9\
    \ 相同。因此，这个推入操作数栈的数值是代表源代码中所写字符的数值。由于我们将变量设为静态类字段，该值通过 `putstatic` 命令传输到方法区（MethodArea）内存中静态字段的内存位置。\n\
    \n接下来是 `Byte` 原始类型……\n\n`Byte` 数据是有符号的 8 位。有符号意味着字节类型的数据可以同时表示负数或正数，但在限制范围内。限制是什么？8\
    \ 位的二进制信息可以存储 $2^8=256$ 个唯一值，因此允许的值范围是从 -128 到 +127。包括零，这里有 128 个负数和 128 个正数，总共\
    \ 256 个唯一数字，以 0 为中心。\n\n与上一个示例类似，我们将使用静态类字段作为示例结构，查看 JVM 如何创建 `byte` 原始类型。这里是源代码类：\n\
    \n```\nclass ClassName\n{\n  static byte field = -1;\n}\n```\n\n`javap` 输出的静态初始化方法为：\n\
    \n```\nstatic {};\ndescriptor:(V)\nflags:(0x0008) ACC_STATIC\nCode:\nstack=1,\
    \ locals=0, args_size=0\n0: iconst_m1\n1: putstatic #7 // Field field:B\n4: return\n\
    LineNumberTable:\nline 3: 0\n```\n\n在这里，使用 `iconst_m1` 操作码将字节数据推入方法帧的操作数栈。`iconst_m1`\
    \ 将 8 位值 `Ob1111111` 推入栈中。这个值实际上代表十进制数字 -1，因为 `byte` 类型是有符号类型，它使用补码系统来表示负数。\n\n\
    那么其他负数呢——它们是如何创建的？\n\n这段源代码：\n\n```\nclass ClassName\n{\n  static byte field =\
    \ -127;\n}\n```\n\n对于 `<init>` 静态初始化方法提供了 `javap` 输出：\n\n```\nstatic {};\n```\n\
    \ndescriptor: ()V\nflags: (0x0008) ACC_STATIC\nCode:\nstack=1, locals=0, args_size=0\n\
    0: bipush             -127\n2: putstatic          #7 // Field field:B\n5: return\n\
    LineNumberTable:\nline 3: 0\n```\n\n`iconst_m1` 操作码被 `bipush` 操作码替换。整个 `bipush`\
    \ 命令实际上是两个字节长。第一个字节是 `bipush` 操作码本身。第二个字节持有要推入帧操作数栈的值。因为源代码将值 -127 分配给类字段，该值被作为参数传递给\
    \ `bipush` 命令。\n\n接下来是 `short` 原型……\n\n`short` 数据是有符号的 16 位。因此它总共持有 $2^{16} =\
    \ 65,536$ 个唯一值，分布在零周围，这意味着 Java `short` 的可能值范围是从 -32,768 到 32,767。\n\n你现在可能已经掌握了\
    \ JVM 中原始类型的表示方法，所以让我们加快速度。这里有一个包含 `short` 原始类型的类：\n\n```\nclass ClassName\n{\n\
    \    static short field = -1;\n}\n```\n\n这是 `<clinit>` 静态初始化方法的 `javap` 输出：\n\n\
    ```\nstatic {};\ndescriptor: ()V\nflags: (0x0008) ACC_STATIC\nCode:\nstack=1,\
    \ locals=0, args_size=0\n  0: const_m1\n  1: putstatic      # // Field field:S\n\
    \  4: return\nLineNumberTable:\nline 3: 0\n```\n\n尽管源代码中字段的类型是原始 `short`，但仍使用了与\
    \ `byte` 类型相同的 JVM 操作码将值 -1 推入操作数栈。这些值是相同的，在这些示例中，`byte` 或 `short` 字段都是 -1，所以相同的操作码完全可以工作。让我们看看使用哪个操作码处理原始\
    \ `short` 可能的最大数字，即 32767。\n\n源代码如下：\n\n```\nclass ClassName\n{\n    static short\
    \ field = 32767;\n}\n```\n\n`javap` 输出显示：\n\n```\nstatic {};\ndescriptor: ()V\n\
    flags: (0x0008) ACC_STATIC\nCode:\nstack=1, locals=0, args_size=0\n  0: sipush\
    \      32767\n3: putstatic      7 // Field field:S\n6: return\nLineNumberTable:\n\
    line 3: 0\n```\n\n现在用于推送值的操作码是 `sipush`，这是一个三个字节的命令。第一个字节指定 `sipush` 为操作码，后续的两个字节持有要赋值给类字段的值。\n\
    \n`int` 数据是有符号的 32 位。由于总共有 $2^{32}=4,294,967,296$ 个可能的唯一值，Java `int` 可以是 -2,147,483,648\
    \ 到 2,147,483,647 之间的任何数字。\n\n这个类将值 1 分配给整数字段：\n\n```\nclass ClassName\n{\n  \
    \  static int field = -1;\n}\n```\n\n静态 int 方法的 `jav` 输出为：\n\n```\nstatic {};\n\
    descriptor: ()V\nflags: (0x0008) ACC_STATIC\nCode:\nstack=1, locals=0, args_size=0\n\
    0: iconst_m1\n1: putstatic          // Field field:I\n4: return\nLineNumberTable:\n\
    line 3: 0\n```\n\n再次使用 `iconst_m1` 命令将此值推入操作数栈。现在，这个类将一个较大的数字（下划线被忽略）赋值给整数字段：\n\
    \n```\nclass ClassName\n{\n    static int field = 1_000;\n}\n```\n\n我们需要这一个的 `jav`\
    \ 输出，结果如下：\n\n```\nstatic {};\ndescriptor: ()V\nflags: (0x0008) ACC_STATIC\nCode:\n\
    stack=1, locals=0, args_size=0\n0: bipush             1000\n1: putstatic #7 //\
    \ Field field:I\n4: return\nLineNumberTable:\nline 3: 0\n```\n"
