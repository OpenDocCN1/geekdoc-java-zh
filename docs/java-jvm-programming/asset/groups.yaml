    \ [I]\nflags: (0x0008) ACC_STATIC\n\nClassName()<()\ndescriptor: ()V\nCode:\n\
    stack=1, locals=1, args_size=1\n0: aload_0\n1: invokespecial #1 // Method java/lang/Object.\"\
    init\":()V\n4: return\nLineNumberTable:\nline 3: 0\n\ndescriptor ()V\nflags: (0x0008)\
