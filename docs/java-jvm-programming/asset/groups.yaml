    # (B.2) Java Array Objects Java has a specially designed, built-in system for
    creating arrays of values in your source code. The system uses square brackets
    as special operators that help you create the array and change its values. On
    the surface, Java arrays don''t seem related to class instances, but in fact these
    arrays are "objects" located in the HeapArea of JVM''s memory, just like class
    instance "objects" are. In source code however, you don''t have to bother about
    where the array is stored in memory, because that''s all taken care of the hood
    by the JVM.


    You will likely use Java''s built-in array objects at some point when writing
    your projects, so while we''re talking about the address references to arrays,
    we should probably discuss the actual function of arrays themselves as well. The
    first thing to understand about arrays is that making an array object and assigning
    its memory pointer to a variable is a three step process, just like class instance
    objects:


    +   - use the new keyword to JVM create the array object in HeapArea memory and
    return a memory pointer to this object

    - declare a variable with the same data type as the array object you want to make

    - assign the memory pointer to the declared variable with the assignment operator
    =


    This is the source code looks like to make a Java array:


    ```

    int[] objectName = new int[3]

    ```


    The assignment operator is the equals sign, in the middle.


    To the right of the assignment operator is the new keyword, followed by the constructor
    of the integer array object, int[ ]. The number 3 inside the square brackets tells
    JVM that to store integer primitive numbers. Also, you can''t see it in the source
    code, but when JVM creates this integer array, it sets each slot in the array
    equal to zero, initializing the array with default values.


    To the left of the assignment operator is the declaration of the variable and
    its type. Now,this portion is different from creating an object based on a class
    template. These Java array types are not normal class template names. The type
    of a Java array is the type of'
