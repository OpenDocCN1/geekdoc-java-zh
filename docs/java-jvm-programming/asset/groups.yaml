    - 使用赋值运算符 `=` 将内存指针赋值给声明的变量\n\n这是创建 Java 数组的源代码形式：\n\n```java\nint[] objectName\
    \ = new int[3]\n```\n\n赋值运算符是中间的等号。\n\n赋值运算符的右侧是 `new` 关键字，后面是整数数组对象的构造函数 `int[]`。方括号内的数字\
    \ `3` 告诉 JVM 要存储整数原型数字。此外，你从源代码中看不到这一点，但当 JVM 创建此整数数组时，它会将数组中的每个槽位都设置为零，用默认值初始化数组。\n\
    \n赋值运算符的左侧是变量及其类型的声明。现在，这部分与基于类模板创建对象不同。这些 Java 数组类型不是普通的类模板名称。Java 数组的类型是存储在数组内部的类型，后面跟着一个或多个一组方括号。例如：\n\
    \n- int[]\n- char[][]\n- String[][][][]\n\n这些都是有效 Java 数组对象的“类型”。\n\n第一个是整数原型值的一维数组。\n\
    \n第二个是 `char[]` 类型的一维数组（类似于类模板），而 `char[]` 是 `char` 类型的一维数组。因此，这是一个数组对象的数组，内部数组持有\
    \ `char` 原型。\n\n第三个是类型为 `String[][][]` 的数组，它持有 `String[][]` 类型的对象，该对象持有 `String[]`\
    \ 类型的对象，该对象持有 `String` 类型的值。`String` 本身是一种引用类型，所以你可以看到 Java 数组可以包含内存地址指针，就像它们包含原型值一样。\n\
    \n在接几页中，我们将查看 Java 数组的一些示例，以及它们是如何被 JVM 创建的。\n\n## 原型数据类型的一维数组\n\n现在让我们来看示例类的\
    \ `.class` 文件，看看 JVM 是如何创建数组对象并分配内存指针的。这里是一些源代码：\n\n```java\nclass ClassName\n\
    {\n    static int[] field = new int[3];\n}\n```\n\n对应的 `.class` 编译单元的 `javap`\
    \ 输出为：\n\n```\nclass ClassName\nminor version: 0\nmajor version: 60\nflags: (0x020)\
