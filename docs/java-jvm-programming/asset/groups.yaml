    for any MethodArea (static) methods, fields, etc., that is trying to access HeapArea
    (non-static) things. Java simply flags this as a potential problem and your file
    will not compile.


    So static can restrict access to code in some cases, namely that static code can''t
    use non-static code. However, this fact does not change the four keywords of the
    access restriction system in any way. They are two independent systems.


    Now let''s examine each of the four levels of access restriction to see how they
    operate (next page):'
