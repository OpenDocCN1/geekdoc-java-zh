- md: "\nPrivate member restriction means that only code from within the very same\
    \ class template can access that member! This is the most secure access type that\
    \ something can have:\n\n![](img/c8857ea016f1259bfbfe6939f1314dc2_117_0.png)\n\
    \nA private class member is indicated using the private keyword:\n\n```java\n\
