    \n## (B.2) Java 数组对象\nJava 有一套专门设计的内置系统，用于在源代码中创建值数组。该系统使用方括号作为特殊操作符，帮助你创建数组并更改其值。从表面上看，Java\
    \ 数组似乎与类实例没有关系，但实际上，这些数组是位于 JVM 内存堆区（HeapArea）的“对象”，就像类实例“对象”一样。然而在源代码中，你不需要担心数组存储在内存的什么位置，因为这些都由\
    \ JVM 在底层处理好了。\n\n在编写项目时，你可能会在某些时刻 Java 的内置数组对象，因此当我们讨论数组的地址引用时，可能也应该讨论一下数组本身的功能。理解数组的第一点是，创建一个数组对象并将其内存指针赋值给变量是一个三步过程，就像类实例对象一样：\n\
