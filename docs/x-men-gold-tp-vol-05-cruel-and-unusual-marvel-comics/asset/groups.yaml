    ## 布鲁克林社区学院，布鲁克林。


    几个月前。


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_6_0.png)


    没关系的。

    儿子...


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_6_1.png)


    我在这里

    是为了

    帮助你。

    我叫查尔——


    是的，我从

    新闻中认出你了。


    你本该

    已经死了。


    --查维尔。


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_6_2.png)


    我是，一个变形战队，

    儿子。


    我们

    从未

    死过


    我只是——发生了

    什么？


    突然

    一切

    都在着火...


    你的特殊能力的

    表现，我很遗憾。


    特殊的...

    能力？


    是的，你。

    西蒙。是一个

    变异人。


    但帮助像你这样的人是我一生的工作。


    我曾认识一个特殊能力的变异人。他的名字叫普罗。你想让我帮他吗？

    是的...谢谢你...别担心。

    一切都会很完美的。


    ## “盒子”高级监狱。


    我不是偏执者，我不反感对合同的任何暗示。

    撒谎...兄弟。

    你想向你报复吗？说出时间和地点梅墨罗。

    为什么这么生气，西蒙？我所做的只是你的

    潜力。


    你利用了我；你操纵了我们！

    你搞乱了我们的大脑！！！

    冷静点，雪崩（Avalanche）！

    别那样叫我！

    我所做的，莉迪亚·南斯也操纵了我。

    而且我不习惯被操纵。

    这全是废话。

    我们被困在这里。没有人能对任何人报仇。

    被困在这里是因为我们签署了——意味着。

    那么，你想因为我离开这里吗？


    我花了一些时间才破解了让我们保持正常的项圈。

    鬼扯。信不信由你决定。

    我的选择是从门出去。

    你怎么看？

    我觉得他是个谎子。如果他的力量真的有效，他现在可能正在操纵我们。但我比任何事情都想离开这里。


    如果目标是向南斯报仇，那也可以。

    换班，我该走了。

    没问题。

    只需要使用视网膜扫描。

    噢，我想为你打开门。

    我想为你打开门。

    这不可能简单...

    你怎么锁上项圈的？这些应该是不可破的吗？

    这些不是你寻找的监狱。

    当然是。

    当你在这里时...


    ...谁准备好开始他们的人生新篇章？

    儿子--

    罗根（Logan）。


    该死的，狂狼（Rogue），你觉得你在做什么？

    我正要问你同样的问题。

    呼

    中央公园，

    纽约市。


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_12_0.png)


    因为看起来你打算不跟任何人说就离开。

    是的，那是因为我打算不跟任何人说就离开。

    我老了，狂狼。一切都不像以前了。

    特别是我的自愈能力。

    在负物质区域发生的一切都付出了代价。

    X变形战队金刚第5至第20期。


    我不认为离开团队是答案，

    因为这让我免成为负担。

    我们所做的事情极其危险。链的强度取决于最薄弱的一环。我不只是弱了，我是精疲力竭。

    我是个老头。

    你会去哪里？

    去加拿大待呆，然后去日本。

    我想我渴望回到熟悉的土地。

    我们会想你的。我也会想你们的。麻烦总会发生。我只是来打个招呼。

    你说的刚离开是什么意思？


    正如我所说，瑞切尔·凯奇森（Rachel Katzzen）离开了医务室。

    她当时昏迷的——

    危险屋。

    而且她编写了这个场景？

    是的。

    我不认为这有什么好处。

    为什么？

    这样你可以想象雷耶斯博士（Dr. Reyes）有多惊讶！

    脑脑电脑将她的位置设在这里...

    因为她一直出现她作为“猎犬”（Hound）——一个变异人猎人的闪回。

    我很抱歉。我以为你知道。我想她告诉你是是因为——

    没关系的，凯奇森，我只是...

    你觉得这个新造型怎么样？

    ...担心她。

    嘿，伙计们...

    我不明白这些服装的意义...


    - 根据梅墨罗告诉我们的，它们属于两个死人。

    - 你懂我的意思。

    - 没，这些衣服是新的。


