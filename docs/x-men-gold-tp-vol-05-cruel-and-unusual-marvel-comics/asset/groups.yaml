    她才六岁，一个巨大的物体撞击了她的家园，杀死了她的父母。


    将她困在狭小的空间里是这座监狱最不该做的事。


    她选择了愤怒，而非恐惧。


    我……绝不会：


    我绝不会为了一个笼子丧失理智。


    不。


    好几天了，她被困在废墟之中……


    我是疾风行者。我是风暴……


    还有她父母的遗骸。


    那股愤怒是如此剧烈……


    ……压倒了那些试图否认她身份的低劣科技。


