    她还要从某些真正的X变人身上取下一两个来。


    妈死的，没错，没有什么能像除掉三个真正的X-普ux那样能稳固我顶尖的地位。


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_68_0.png)


    你的？主意？我不能说不是。


    虽然我不能说我不会很享受这场戏。


    他们叫我“疯狂的梅西”。


    你们这群娘们很快就会知道为什么了。


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_68_1.png)


    # 罗伯特·凯利矫正设施，又名“小盒子”。#1号监狱。


    花了九包烟只为了和你们三个人单独待五分钟。


    听起来像是一道数学题。


    我认识这些。


    听起来像有很多香烟。


    “极乐”、“电光眼”和“阿尼克斯”。


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_69_0.png)


    我的团队。带走你们三个中的一个会让我的状态在这里看起来很好。


    “疯狂的梅西”……我不乐观能和你讲通的可能性……


    但你应该知道，我们可能没有超能力，但我们受过大量的战斗训练。


    不在乎。


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_70_1.png)


    > 我认为你站在哪一边是没有疑问的，对吗？

    > 正在——

    > 永远的宠物。我的。

    > 监狱院里的战斗。

    > 看起来我可以从我的愿清单上划掉一项了。

    > 在我把它加入愿清单之后。

    > 琴蒂是对的。

    > 我们是狼人亲自教我们战斗的……

    > ……你凭什么认为我们解决掉那些无能力者？

    > 确实如此。

    > 噢！


    我不能说我没警告过你们。


    闭嘴……


    实际上可能有一件事是我没警告过你们的。


    我的战斗训练不是学校的标准吗吗？


    我还是个忍者。


    你们三个！！！


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_73_0.png)


