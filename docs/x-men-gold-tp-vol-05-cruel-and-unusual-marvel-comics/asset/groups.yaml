    > 我只是来这里透透新鲜空气的

    > 每个人都要关禁禁三天。

    > 你们难道看不见我很忙吗？

    > 先生！先生，我们出问题了……

    > 是曼哈顿，先生……


    *有些东西正在袭击曼哈顿。*


    如此奇异。


    如此美丽。


    波士顿完全不同。


    失去控制了……


    还是……


    我应该为此准备一下。


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_75_0.png)


    伊万·格雷罗，非人类和环保疯子。


    根据他的档案，格雷罗可以产生他能控制的孢子。


    这就是为什么我们带了线人的抗毒剂。


    你确定它在他身上有效吗？


    上次效果很不错。


    盔甲，玛玛保护他。玛玛支持盔甲。


    下下，格雷罗先生。


    《不羁复仇者》（2016）#4 德雅感（似曾相识）


    ![](img/4914d1_76_0.png)


    我只能请求一次。


    “权威”，遗憾的是我发现自己缺乏这种东西，


    缺乏这个。


    啊，是的。未来人的“治愈”。


    我记得那种感觉。


    但恐怕，现在情况不同了。


    你也应该感到恐惧的。


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_77_0.png)


    盔甲！魔法！


    线人的治愈没用……


    没有什么事是容易的，不是吧？


    你得问问，不是吧，宝贝？


    格雷罗自己种出来的……


    那些藤蔓看起来是从地底出来的，你想让我们把它们烧掉吗？搞定。


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_78_0.png)


    我知道这只是植物植物，但这些东西简直像钢铁一样。


    等一下……


    让我试试。


    看起来结了。你想让我把它砸碎吗？我想让你们两个都把它砸碎。


    无效。计划是什么？玛玛和火点。


    他们要从源头烧掉这个东西。


    妈死的。这些藤蔓是从哪里来的？


    古老的生长，和这座城市一样老。甚至更老。如果它遍布曼哈顿，我们就出问题了。


    如果你不认为我们已经出问题了，说明你没在注意。这些态度是怎么回事？如果它对兄弟会中的我有什么意见，记得你也在其中。


    违背我的意愿，他控制了我的大脑。


    当我去报仇时，他击晕了我，导致我的朋友被送进了监狱。所以我们是哥们儿。我还以为你永远不会问呢。我猜它确实有。


    试着烧掉它，以为它还是生长植物和藤蔓。但它们现在是某种别的东西。它们变了。变异了。不可能了……我从未见过任何这样的东西……我知道这听起来很疯狂，但也许那些图像向我展示了我母亲的肺部。


    # X 学院医疗室。


    有我们可以交流的医生吗？雷耶斯医生……你看到了吗？

