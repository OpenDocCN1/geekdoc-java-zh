    ## BROOKBOROUGH COMMUNITY COLLEGE, BROOKLYN.


    MONTHS AGO.


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_6_0.png)


    IT''S ALL RIGHT.

    SON...


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_6_1.png)


    I''M HERE

    TO HELP

    YOU.

    MY NAME IS

    CHARLES--


    YEAH, I

    RECOGNIZED

    YOU FROM

    THE NEWS.


    YOU''RE

    SUPPOSED TO

    BE DEAD.


    --XAVIER.


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_6_2.png)


    I''M,

    AN X-MAN,

    SON.


    WE

    NEVER

    DIE


    I JUST--WHAT

    HAPPENED?


    SUDDENLY

    EVERY WAS

    ON FIRE...


    THE

    MANIFESTATION

    OF YOUR SPECIAL

    ABILITIES, I''M

    AFRAID.


    SPECIAL...

    ABILITIES?


    YES, YOU.

    SIMON. ARE

    A MUTANT.


    *.


    BUT IT IS MY LIFE''S WORK TO HELP MUTANTS SUCH AS YOURSELF.


    THERE WAS A MUTANT WITH YOUR ABILITIES I USED TO KNOW. HIS NAME WAS PRO. WOULD
    YOU LIKE ME TO HELP YOU AS I HELPED HIM?

    YES... I THANK YOU... DON''T WORRY.

    EVERYTHING''S GOING TO BE WONDERFUL.


    ## THE "BOX" SUPERIOR PRISON.


    I''M NOT A BIGOT AND I RESENT ANY IMPLICATION TO THE CONTRACT.

    LYING... BROTHER.

    WOULD YOU CARE TO GET SOME PAYBACK ON YOU? NAME THE TIME AND PLACE MESMERO.

    WHY SO ANGRY, SIMON? ALL I DID WAS YOUR TRUE POTENTIAL.


    YOU USED ME; YOU MANIPULATED US!

    YOU MESSED WITH OUR HEADS!!!

    CALM YOURSELF AVALANCHE!

    DON''T CALL ME THAT!

    WHAT I DID, I DID LYDIA NANCE MANIPULATED ME, AS WELL.

    AND I AM NOT ACCUSTOM TO BEING THE ONE MANIPULATED.

    THIS IS ALL JUST TALK.

    NOBODY''S GETTING PAYBACK AGAINST ANYBODY WE''RE STUCK IN HERE.

    STUCK IN HERE BECAUSE WE SIGNED ON YOU- MEANS.

    WELL, WOULD YOU LIKE TO GET OUT OF HERE BECAUSE OF ME, THEN?


    IT TOOK SOME TIME I MANAGED TO HACK THE COLLAR THAT KEEPS US NORMAL.

    BULL. BELIEVE ME OR DON''T. YOUR CHOICE.

    MINE IS TO WALK OUT THE FRONT.

    WHAT DO YOU THINK?

    I THINK HE''S A LIAR. I THINK IF HIS POWERS ARE REALLY WORKING, HE COULD BE MANIPULATING
    US RIGHT NOW.

    BUT I WANT TO GET OF HERE MORE THAN ANYTHING.


    AND IF THE GAME IS TO GET EVEN WITH NANCE, THAT''S ALL RIGHT, TOO.

    SHIFT CHANGE, TIME FOR ME TO GO.

    NO PROBLEM.

    JUST GOTTA USE THE RETINAL SCAN.

    OH, I THINK YOU WANT TO OPEN THE DOOR FOR US.

    I WANT TO OPEN THE DOOR FOR YOU.

    NO WAY IT''S EASY...

    HOW''D YOU LOCK YOUR COLLAR? THESE ARE SUPPOSED TO BE UNBREAKABLE?

    THESE AREN''T THE PRISON YOU''RE LOOKING FOR.

    OF COURSE IT IS.

    HERE WHEN YOU DON''T A GUARD TO HELP YOU...


    ...WHO''S READY TO START THE NEXT CHAPTER OF THEIR LIVES?

    SON--

    LOGAN.


    DAMN, ROGUE, WHAT DO YOU THINK YOU''RE DOING?

    I WAS ABOUT TO ASK YOU THE SAME QUESTION.

    WHOOSH

    CENTRAL PARK,

    NEW YORK CITY.


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_12_0.png)


    BECAUSE IT LOOKS AS IF YOU WERE PLANNING ON LEAVING WITHOUT A WORD TO ANYONE.

    YEAH, THAT''S ONLY BECAUSE I WAS PLANNING ON LEAVING WITHOUT SAYING A WORD TO
    ANYONE.

    I''M OLD, ROGUE. NOTHING WORKS THE WAY IT USED TO.

    Especially MY HEALING factor.

    EVERYTHING THAT WENT DOWN IN THE NEGATIVE ZONE TOOK ITS TOLL.

    X-MEN GOLD #5 THRU 20.


    I DON''T SEE HOW LEAVING THE TEAM IS THE ANSWER

    CAUSE IT KEEPS ME FROM BEING A LIABILITY.

    WHAT WE DO IS DANGEROUS AS IT GETS. WE''RE A CHAIN THAT''S ONLY STRONG AS ITS
    WEAKEST LINK. AND IIN''T JUST WEAK, I''M BONE-TIRED.

    I''M AN OLD MAN.

    WHERE WILL YOU GO?

    CANADA FOR A BIT, THEN JAPAN.

    GUESS I''M HANKERING FOR SOME FAMILIAR TERRAIN.

    YOU''LL BE MISSED. AND''LL MISS YOU GUYS. TROUBLE HAPPENS. I''M JUST HERE TO CALL
    AWAY.

    WHAT DID YOU MEAN, JUST LEFT?


    EXACTLY WHAT I SAID, RACHEL KATCHZEN LEFT THE INFIRMARY.

    SHE WAS COMATOSE-

    THE DANGER ROOM.

    AND SHE PROGRAMMED THIS SCENARIO?

    JA.

    I DON''T SEE ANY WAY THAT''S A GOOD THING.

    WHY?

    SO YOU CAN IMAGINE DR. REYES'' SURPRISE!

    CEREBRO PLACES HER LOCATION HERE...

    BECAUSE SHE''S BEEN HAVING ''FLASHES'' OF HER AS A HOUND, A MUTANT HUNTER.

    I''M SORRY. I THOUGHT YOU KNEW. I FIGURED SHE TOLD YOU BECAUSE--

    IT''S ALL RIGHT, KATCHZEN, I AM JUST...

    WHAT DO YOU THINK OF THE NEW LOOK?

    ...WORRIED FOR HER.

    HEY, GUYS...

    I DON''T UNDERSTAND THE POINT OF THESE COSTUMES...


    - FROM WHAT MESERO TOLD US, THEY BELONG TO A PAIR OF DEAD GUYS.

    - YOU KNOW WHAT I MEAN.

    - NAH, THESE SUITS ARE NEW.

    - WHAT THE HELL ARE WE DOING HERE?

    - I DON''T KNOW ABOUT YOU, BUT I''M LOOKING TO GET PAYBACK FOR NANO'' SCREWING
    WITH OUR LIVES.

    - BUT IT''S MESMERO WHO SCREWED WITH OUR HEAPS.

    - HER IDEA, HE SAID, AND YOU''VE SEEN HER ON TV--BEAST HATES MUTANTS.

    - AND LIKE YOU SAID-MESMERO COULD BE MANIPATING US RIGHT NOW AND WE''D NEVER KNOW
    IT, RIGHT?

    - THAT SIMON... IS VERY TRUE.

    - SO WHAT''S DOING ON HEAVY?


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_15_0.png)


    HOUND markings RETURNED.

    I DECIDED I NEEDED A NEW LOOK TO GO WITH THEM.

    I''M NOT TALKING ABOUT THE COSTUME MAKEOVER. RACHEL I MEANT WHAT WAS GOING ON
    HERE WITH YOU.


    *X-MEN GOLD #18. --PREVIOUSLY PANICIA


    ACTUALLY PERHAPS KATZCHEN RACHEL AND I...


    OH.

    COUPLES STUFF. GOT IT.

    ARE YOU ALL RIGHT?

    KURT I''M FINE. I''M BETTER.


    I WISH THAT WERE TRUE.

