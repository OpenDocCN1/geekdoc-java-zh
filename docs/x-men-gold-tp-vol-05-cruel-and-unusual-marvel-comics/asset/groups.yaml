    领域，奥洛洛的痛苦与力量在这里也能感受到。


    由风暴法师打造。


    这把由艾崔受受恶作剧之神洛基之托而锻造的魔法锤。


    它听见了它女主人的

    哭泣。它感受到了她的痛苦……


    ……并被迫

    做出回应。


    我说我们应该回到巴黎时，布莱恩，这可不是我预想的。


    快点，亲爱的梅格根，巴黎的一切切都是浪漫的。


    无论这件东西是什么，它都强大到仅仅是存在就能影响当地的天气。


    还好你只带来了一个能控制元素的人。


    那么，我们要不要给我们的这位新朋友一个小“小吻”？


    梅格根！砰！


    这到底是什么东西？


    它叫“塞西提亚”。


    梅格根！


    可能我的“小吻”稍微用力过猛了。


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_99_0.png)


    他是一个来自负面区域的神灵。


    “我现在正在通过心灵感应给你们所有的详细信息。”


    噢天哪。


    是啊，为什么我们没在这里被彻底完蛋？


    我们正在赶往你们的位置。


    在我们到达之前，设法拖住他。


    明白。


    你建议我们怎么做？


    “你没在听我说话。”


    # 典长办公室。


    除了你们那五个已经阻止了它的超级英雄，他们已经锁在这里了。


    “那家伙在杀人。”


    是啊，而且其中一个刚刚在我的监狱上炸了一个洞。


    在巴黎，我这儿有一堆问题。


    无论如何，我上次检查时，世界并不缺少超级英雄来阻止它。


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_101_0.png)


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_101_1.png)


    哇，时机真不错，风暴。


    凯什曼典长……我需要谈谈。


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_101_2.png)


    我已经和你们的几个守卫谈过了。


    他们正在小睡一会儿。


    你们这群蠢蛋在下面在干什么？我办公室里有守卫……


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_101_3.png)


    X战员一直很有耐心，因为这是正确的做法。


    我们同意让正义发挥作用，因为这是正确的做法。


    然后你们把我关进了笼子里。


    奥洛洛

    我知道你经历了一些事，但我们这儿确实遇到了一些小状况。


    什么样的“状况”？


    就是这种状况。


    我和我的队友们将离开这一幕。


    毫无疑问，我的朋友凯蒂此刻会给出一些见解。


    关于我们如何成为世界对抗这种黑暗的唯一希望。


    但看看我的脸。

    我看起来像是有什么发人人心的话要说吗？


    --我们还有18秒到达。英国队长和梅格根已经到位。


    我们的先锋——墨水和野盗——将带上岩浆和装甲……让我们来个“快球特技”吐吐吧。


    我呢，冰人？


    我可以开启自动驾驶。你保持开启状态。


    我曾是邪恶变异兄弟会的成员，所以你让我坐冷板？


    我是在保护你的安全。


    你是这里受过训练最少、测试最少的人。


    只有在情况变得非常糟糕时才会涉及你。


    我又怎么知道情况是否真的很糟糕呢？


    嘎啦啦啊！


    你非要问，不是吧？


    野盗！


    我正在办法……


    啊啊啊啊啊！！！


    干得好。

    我所说的都会做到。我可不是在开玩笑。


    为了打败这家伙，我们之前基本上把他扔进了等同于黑洞的地方。


    而且即使那样也没能阻止他。


    好吧，我们现在没有任何黑洞了。所以我们只能打算把他痛揍一顿。


    蛮力解决不了这个问题。


    ……我带了一些相当强壮的猛汉。


    而他们只是热身动作。


    行动吧。你和我们一起。


    收到。


    我一直好奇的一件事。


    我的吸收能力对外星神灵有效吗？


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_106_0.png)


    答案是肯。


    她吸收所接触之人的能量和力量的能力是不可估量的。


    太清楚了。


    而野盗发现自己无法招敌。


    野盗！


    我抓住她了。继续猛攻这家伙。


    但你不会飞。


    现在你会告诉我了


