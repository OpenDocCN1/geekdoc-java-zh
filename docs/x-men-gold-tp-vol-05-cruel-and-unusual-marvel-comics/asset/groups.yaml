    ...让我来帮你。


    奥洛罗，你有什么什么想告诉我的惊人事情吗？


    我的朋友，我满脑子都是时机来得太好了。小猫……


    现在交给你了。


    大家准备掩护。这里会发生巨大的爆炸。


    卡雅……


    > 卡雅！

    卡雅！


    > 别担心，亲爱的。我没有忘记进行相位位移。

    奥洛罗，你能处理一下这些烟雾和火光吗？


    > 停下（SHATTOHOOM）


    > 谢谢。

    大家都还好吗？


    > 赛提亚（SCYTHIAN）的大部分被困在了混沌中，但我掩护了他的其余。真恶心。


    > 尽管如此……还是诚实的工作。

    这让我们面临了下一个小问题……


    > ……我们打算如何处理这十二名X变形战员？


    ## 纽约，沙地角。

    莉迪亚·南斯的故乡。


    在X变形战员昨天于巴黎展现了英雄壮举后，参议院民主党领袖表示，《变异人驱逐法》在参议院的进展已经陷入停滞。


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_120_0.png)


    愚痴。胆骨的愚痴。


    这不重要。


    人类的法律。毫无意义。


    它们必须被铲除。抹除。彻底毁灭。


    变异人是一个你无法通过立法来解决的问题。


    正如我们正要做的那样。


    ![](img/8717bc5912ff46f3de6fe90fa49144d1_120_1.png)


    你以前尝试过，但彻底失败了。


    我不喜欢用那个词。


    那不一样。那是波莉（POLLY）。


    我已经进化了，或者如果你愿意的话，可以说是变异了。


    *参阅 X-MEN GOLD #4-6。*


    不要在词汇选择上浪费感情。


    专注于眼下的任务。


    利用这个变异人，利用这个星球上任何携带X基因的生物。


    下期：直到死亡分离。*


