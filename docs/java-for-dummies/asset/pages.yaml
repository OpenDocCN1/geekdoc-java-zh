  md: '# 178 Part III: Working with the Big Picture: Object-Oriented Programming


    # Cutting it


    Listing 8-1 has three printf calls. Each printf call has a format string (" %s$")
    and a variable (like jobTitle). Each format string has a placeholder (like %s)
    that determines where and how the variable''s value is displayed.


    For example, the second printf, the format string has a %s placeholder. This %s
    holds a place for the jobTitle''s value. According to Java''s rules, the notation
    %s always holds a place for a string and, sure enough, the variable jobTitle is
    declared to be of type String in Listing 8-1. Parents and some other characters
    around the % placeholder, the program''s output. (See Figure 8-2.)


    | Figure 8-2 | Configuration Listing081-02 - JDK version 1.6.0 <Default> - <Default>
    ---- |

    |---|---|

    | Everybody gets paid. | Pay to the order of Berry Buy (CBO) ***$4,500.00

    Pay to the order of Harriet Reese (Captain) ***$67,000.00

    Pay to the order of Your Name (Honorary of the Day) ***$10,000.00 |


    Back in Listing 8-1, notice the comma inside the %,.2f placeholder. The comma
    tells the program to use grouping separators. That''s why, in Figure 8-2, you
    see $5,000.00, $7,000.00, and $10,000.00 instead of $5000.00, $7000.00, and $10000.00.


    > TIP Grouping separators vary from one country to another. For instance, in France,
    to write the number one thousand (mille), you can Frenchify your number automatically
    with a statement like: print(new java.util.Formatter().format(java.util.Locale.FRANCE,
    "%,2f", 1000.00)). For details, see the API (Application Programming Interface)
    documentation for Java''s Formatter and Locale classes.


    # Working with Disk Files (A Brief Detour)


    In this chapter, programs read readers from the computer''s keyboard. But the
    code in Listing 8-2 reads characters from a specific file. The file named (EmployeeInfo.txt)
    lives on your computer''s hard drive.


