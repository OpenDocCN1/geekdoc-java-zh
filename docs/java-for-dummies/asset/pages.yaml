  md: '# Chapter 5: Controlling Program Flow with Decision-Making Statements


    Computers aren''t much better than coins and human thumbs. A computer mimics the
    generation of random sequences but, in the end, the computer does what it is told
    and all this is in a purely deterministic fashion. In Listing 5-1, java.util.Random:


    ```

    import java.util.Random;


    int randomNumber = new Random().nextInt(10) + 1;

    ```


    the computer appears to give us a randomly generated number — between 1 and 10.
    But it''s all a fake. The computer just follows instructions. It''s not really
    random, but without bending a computer over backwards, it''s the best that you
    can do.


    Once again, I ask you to take this code to blind faith. Don''t worry about new
    Random().nextInt until you have more experience with Java. Just copy this code
    into your programs and have fun with it. And if the numbers from 1 to 10 aren''t
    in your flights, don''t fret. To roll an imaginary dice, write


    ```

    int rollEmaby = new Random().nextInt(6) + 1;

    ```


    With the execution of this statement, the variable rollEmbaby gets a value from
    1 to 6.


    # The if statement


    At the core of Listing 5-1 is a Java statement. If this statement represents a
    fork in the road. (See Figure 5-2). The computer follows one of two prongs — the
    prong that prints You or the prong that prints You lose. The computer decides
    which prong to take by testing the truth or falsehood of a condition. In Listing
    5-1, the condition being tested


    ```

    inputNumber == randomNumber

    ```


    Does the value of inputNumber equal value of randomNumber? When the condition
    is true, the computer does the stuff between the condition and the word else.
    When the condition turns out to be false, the computer does the stuff after the
    word else. Either way, the computer goes to execute the last call, which displays
    Thank for playing.


    The condition in an if statement must be enclosed in parentheses. However, a line
    like if (inputNumber == randomNumber) is not a complete statement (just ''If I
    had a hammer'' isn''t a complete sentence). So this line if (inputNumber == randomNumber)
    shouldn''t end with a semicolon.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_125_0.png)'
