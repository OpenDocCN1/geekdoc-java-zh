    # All about generics


    One of Java''s original design goals was to keep the language as simple as possible.
    The language''s developer took some unnecessarily complicated features of C++
    and tossed them out the window. Result was a language that was elegant and sleek.
    Some said that after years of discussion and squabbling, Java became a bit more
    complicated. By the year 2004, Java had enums, enhanced for loops, and some other
    interesting new features. The most talked-about new feature was the introduction
    of generics.


    ```

    things.add(new Account());

    myAccount =

    tthings.get(0);

    //DONT USE THIS. IT''S BAD CODE.

    ```


    ```

    ArrayList<String> things =

    ew ArrayList<String>();

    ```


    The use of like <String> was new in Java 5.0. In old-style Java, you''d write


    ```

    ArrayList people = new

    ArrayList();

    ```


    In those days, an ArrayList could store almost anything you wanted to put in —
    a number, a Room, or something anything. The ArrayList class was versatile, but
    with very costly overhead. If you couldn''t predict exactly what you would get
    out of an ArrayList, in particular, you couldn''t easily write code that assumed
    you had stored certain types of values in ArrayList. Here''s an example:


    ```

    ArrayList things = new

    ArrayList();

    ```


    The introduction of generics fixes this problem:


    ```

    ArrayList<Account> things =

    ew ArrayList<Account>();

    tthings.add(new Account());

    myAccount =

    tthings.get(0);

    //USE THIS INSTEAD. IT''S GOOD CODE.

    ```


    Adding <Account> in two places tells the compiler that things instances—nothing
    else. So, in the third line of the preceding code, you get a value from the things
    collection. Then, because things stores only Account objects, you can make myAccount
    refer to that new value. It works!'
