  md: '# 126 Part II: Writing Your Own Java Programs


    When you look over Listing 6-1, you see the code that does all this work. At the
    core of the code is a thing called a *while* statement (also known as a *while
    loop*). Rephrased in English, the while statement says:


    ```

    while the inputNumber is not equal to the randomNumber

    keep doing all the stuff in curly braces: {

    n}

    ```


    The stuff in curly braces (the stuff that repeats over and over again) is the
    code that prints Try again. Enter an int ... gets a value from the keyboard and
    adds 1 to the counter of the user''s guesses.


    When you''re dealing with counters, like numGuesses in Listing 6-1, you may easily
    become confused and be off by 1 in either direction. You can avoid this headache
    by making sure that the ++ statements stay close to the statements you''re counting.
    For example, in Listing 6-1, the variable numGuesses starts with a value of 0.
    That is because, when the program starts, the user hasn''t made any guesses. Later
    in the program, right after each call to myScanner.nextInt(), is a numGuesses++
    statement. That''s how you do it -- you increment the counter as soon as the user
    enters guess.


    The statements in curly braces are repeated as inputNumber != randomNumber keeps
    being true. Each repetition of the statements in the loop is called an *iteration*
    of the loop. In Figure 6-1, the loop undergoes three iterations. If you don''t
    believe that Figure 6-1 has exactly three iterations, count the number of *Try
    again* printings in your output. A Try again appears for each correct guess.


    When at last, the user enters the correct guess, the computer goes back to the
    top of the while loop, checks the condition in parentheses, and finds itself in
    double negative logic. The not equal (!=) relationship between inputNumber and
    randomNumber no longer holds. In other words, the while''s statement, inputNumber
    != randomNumber, becomes false. Because the while''s statement is false, the computer
    jumps past the while loop and goes on to the statements just below the while loop.
    The computer prints Win after 4 guesses.


    With the code shown in Listing 6-1, the computer never jumps mid-loop. When the
    computer finds that inputNumber is not equal to randomNumber, the computer marches
    on and executes all five statements inside the loop''s curly braces. The computer
    performs the test again (to see whether inputNumber is still not equal to randomNumber)
    only after it executes all five statements in the loop.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_146_0.png)'
