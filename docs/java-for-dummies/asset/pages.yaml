    message.


    When I write the code in Listing 9-3, use of the final keyword is absolutely necessary.
    But when I initialize format to %5.2f degrees \n, I intend to use this same format
    just as I like, over and over again. I know well that I don''t intend to change
    the format variable''s value. Of course, in a 10,000-line program, I can become
    confused and try to assign a new value to format somewhere down in the code. So
    to prevent me from accidentally changing the format string, I declare the format
    variable to be final. It''s just good, safe programming practice.


