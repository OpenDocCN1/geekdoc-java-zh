  md: '# Chapter 2: Running Canned Java Programs 31


    # # JCreator


    The programs in this book work with almost any Java IDE. But in this chapter,
    I show you how to use JCreator LE (Lite Edition). I chose JCreator over other
    IDEs for several reasons:


    +   * JCreator LE is free.

    * Among all the Java IDEs, JCreator represents a nice compromise between power
    and simplicity.

    * Unlike other Java IDEs, JCreator works with almost any version of Java, from
    the ancient version 1.0.2 to the new Java SE 6, and onward to Java SE 7.

    * JCreator LE is free. (It''s worth mentioning twice.)


    ![](img/cd0a178910e21af6e9ed167dca0579cd_51_0.png)


    If you''re the kind of person who prefer plain text editors and command prompts
