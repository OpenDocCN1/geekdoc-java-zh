  md: '# Chapter 12: Looking Good When Things Take Unexpected Turns 311


    ![](img/cd0a178910e21af6e9ed167dca0579cd_331_0.png)


    A statement in a method can throw an exception that''s not matched by a catch
    clause. This includes situations in which the statement throwing the exception
    isn''t even inside a try block. When this happens, execution of the program jumps
    out of the method that contains the offending statement. Execution jumps back
    to whatever code called the method in the first place.


    A method can name more than one exception type in its throws clause. Just use
    commas to separate the names of the exception types, as in the following example:


    ```

    throws InterruptedException, IOException,

    ArithmeticException

    ```


    The Java API has hundreds of exception types. Several of them are subclasses of
    the RuntimeException class. Anything (or a sub-class, sub-sub-class, and so on)
    is unchecked. Any exception that isn''t a descendant of RuntimeException is checked.
    The unchecked exceptions include things that would be hard for the computer to
    predict. Such things include the NumberFormatException (Listings 12-2, 12-4),
    and others, the ArithmeticException, IndexOutOfBounds, the infamous NullPointerException,
    and many others. When you write Java code, much of your code is susceptible to
    these exceptions, but including the code in try clauses (or passing the with throws
    clauses) is completely optional.


    The Java API also has its share of checked exceptions. The computer can readily
    detect exceptions of this kind. Java insists that, for an exception of this kind,
    any exception-throwing statement is acknowledged with either a statement or a
    throws clause. Java''s checked exceptions include the InterruptedException (Listings
    12-9 and 12-10), the IOException, the SQLException, and a gang of other interesting
    exceptions.


    # Finishing the Job with a finally Clause


    Once upon time, I was a young fellow, living with my parents in Philadelphia,
    just starting to drive a car. I was heading towards a friend''s house and thinking
    about knows what when another car came from nowhere and banished my car''s passenger
    driver. This kind of thing is called RunARedLightException.


    Anyway, both cars were still drivable, and we were right in the middle of a busy
    intersection. To avoid causing a traffic jam, we pulled over to the nearest curb.
    I fumbled for my driver''s license (which had a very young picture of me on it),
    and opened the door to get out of my car.'
