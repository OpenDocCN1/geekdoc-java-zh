  md: "# 312 Part IV: Savvy Java Techniques\n\nAnd that's when the second accident\
    \ happened. As I was getting out of my car, a city bus was coming. The bus hit\
    \ me and rolled me against my car a few times. This kind of thing is called a\
    \ DealWithLawyersException.\n\nThe truth is that everything out just fine. I was\
    \ bruised but not battered. My parents paid for the damage to the car, so I suffered\
    \ any financial consequences. (I managed to pass on the financial burden by putting\
    \ the RunAReadLightException into my throws clause.)\n\nThis incident helps to\
    \ explain why I want to do exception handling. In particular, I wonder, \"What\
    \ happens if, while the computer is recovering from one exception, a second exception\
    \ is thrown?\" After all, the statements in a catch clause aren't immune to calamities.\n\
    \nWell, to answer this question is quite simple. For starters, you can put a try\
    \ inside a catch clause. This protects you against unexpected, potentially embarrassing\
    \ incidents that can crop up during the execution of the catch clause. But when\
    \ you start worrying about cascading exceptions, you open a very slim can of worms.\
    \ The number of scenarios is large, and things can become complicated very quickly.\n\
    \nOne-to-too complicated thing that you can do is create a finally clause. Like\
    \ a catch clause, a finally clause comes after a try clause. The big difference\
    \ is that the statements in a finally clause are executed whether or not an exception\
    \ is thrown. The idea is, \"No matter what happens, good or bad, execute the statements\
    \ inside this finally clause.\" Listing 12-11 has an example\n\n+   Listing 12-11:\
    \ Jumping Around\n\n```\nimport java.lang.System.out;\nclass DemoFinal {\n   \
    \ public static void main(String[] args[]) {\n        try {\n            doSomething();\n\
    \        } catch (Exception e) {\n            out.println(\"Exception caught in\
    \ main.\");\n        }\n    }\n    static void doSomething() {\n        try {\n\
    \            out.println(0 / 0);\n        } catch (Exception e) {\n    }\n}\n\
    ```"
