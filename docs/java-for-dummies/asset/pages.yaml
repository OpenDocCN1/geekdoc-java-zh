    # Using generics (hot stuff!)


    Look again at Listing 11-8, and notice the funky ArrayList declaration:


    ```

    ArrayList<String> people = new ArrayList<String>();

    ```


    Starting with Java 5.0, each collection class is genericified. That ugly-sounding
    word that every declaration should contain <SomeTypeName>. The thing''s sandwiched
    between < and > tells Java what kind of values of the new collection may contain.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_306_0.png)


    The material in this section applies to Java 5.0, Java 6, or whatever version
    number comes along in the next few years. For more about Java''s versioning, see
    Chapter 2.


    For example, in Listing 11-8 the words ArrayList<String> people say that the people
    variable can refer to a collection of String values. So from that point on, any
    reference to an item from the people collection is treated exclusively as a String.
    If you write


    ```

    people.add(new Room());

    ```


    then the compiler cough up your code and spits it out because a Room isn''t the
    same as a String. This coughing and spitting happens even if the compiler has
    the same Room class''s code — the code in Listing 11-5) But the statement


    ```

    people.add("George Gow");

    ```


    is just fine. Because "George Gow" has type String, the compiler smiles happily.


    # Testing for the presence of more data


    Here''s a pleasant surprise. When you write a program like the one shown previously
    in Listing 11-8, you don''t have to know how many names are in the input file.
    Having to know the names may defeat the purpose of using the easily expandable
    ArrayList class. Instead of looping until you read exactly nine names, you can
    loop until you run out of data.


    The Scanner class has several nice methods like hasInt, nextDouble, and means
    hasNext. Each of these methods checks for more input data. If there''s more data,
    the method returns true. Otherwise, the method returns false.'
