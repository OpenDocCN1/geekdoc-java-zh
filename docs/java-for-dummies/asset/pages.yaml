  md: '# Chapter 3: Using the Basic Building Blocks


    # What''s Barry''s excuse?


    For years, I''ve been telling my students to put comments in their code, and for
    years I''ve been creating sample code (like the code in Listing 3-1) with no comments
    in it. Why?


    Three little words: "Know your audience." When you write complicated, real-life
    code, your audience is other programmers, information technology managers, and
    people who need help deciphering what you''ve done. When I write simple samples
    of code for this book, my audience is — the novice programmer. Instead of reading
    my comments, your best strategy is to stare at my Java statements — the statements
    that Java''s compiler deciphers. That''s why I put so few comments in this book''s
    listings.


    Besides, I''m a little lazy.


    # Findingavadoc pages


    In Chapter 2, I encourage you to download a copy of the official Java API documentation.
    This documentation is a huge collection of Web pages created automatically from
    javadoc comments. To access this documentation, do the following:


    +   1. Follow Steps 1 and 2 in the step list that comes immediately after Listing
    3-1 in this chapter.


    The code of Listing 3-1 appears in JCreator''s Editor pane.


    +   2. In the Editor pane, right-click the word System. In the resulting menu,
    choose Show JDK Help.


    The javadoc page for System appears in JCreator''s Editor pane. To see more of
    this page, use the pane''s scrollbar. The stuff on this page may not make much
    sense to you now, but as you read more of this book, things become clearer.


    For tips on reading and understanding Java''s API documentation, see this book''s
