    # What''s a name?


    The numbering of Java''s SDK versions is really confusing. Instead of "Java 1",
    "Java 2", and "Java 3", the numbering of Java versions winds through an obstacle
    course. Here''s how it works:


    +   - Java JDK 1.0 (1996)

    - Java JDK 1.1 (1997)

    - Java SDK 2.1 (1998): Sun Microsystems added an additional "2" and changed "JDK"
    (Java Development Kit) to "SDK" (Software Development Kit)

    - Java SDK 1.3 (2000)

    - Java SDK 1.4 (2002)


    +   - Java 2 JDK, 5.0 (2004): Sun reverts to "JDK" and gives up on the silly 1.x
    numbering scheme.

    - Java 6 JDK (2006): Drops the unnecessary 2 and gets rid of .0.


    To make things worse, the file-numbering scheme isn''t consistent with the product
    numbering scheme. So when you install Java 6 JDK, you get a directory named jdk1.6.0.
    The 1.x numbering returns to you haunt, and so the .0 decimal point business.


