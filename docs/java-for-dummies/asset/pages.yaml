    \ on object-oriented programming in Chapter 1.2.)\n\nOn those special days when\
    \ I'm feeling sentimental, I tell people that Java is more pure in its object-orientation,\
    \ than most other so-called oriented languages. In Java, you can't do anything\
    \ unless you've created a class of some kind. It's like being on *Jeopardy*; Alex\
    \ Trebec says, \"Let's go to a commercial,\" and interrupting him by saying, \"\
    I'm sorry, Alex. You can't issue an instruction without putting your instruction\
    \ inside a class.\"\n\nIn Java, the entire program is a class. I wrote the program\
    \ so to get a name for my new class. I chose the name *Display*, because the program\
    \ displays a line of text on the computer screen. That's why the code in Listing\
    \ 3-1 starts with `class Display`. (See Figure 3-2.)\n\n![](img/cd0a178910e21af6e9ed167dca0579cd_71_0.png)\n\
    \n| The entire program |\n| The class Display |\n\n```\nclass Display {\n  public\
    \ static void main(String[] args[]) {\n    System.out.println(\"You'll love Java!\"\
    );\n  }\n}\n```\n\nThe first word in Listing 3-1, the word *class* is a Java keyword.\
    \ (See section \"The words in a Java program,\" earlier in this chapter.) No matter\
    \ who writes a Java program, the word *class* is always used the same way. On\
    \ the other hand, the word *Display* in Listing 3-1 is an identifier. I made up\
    \ the word *Display* while I was writing this class. The word *Display* is the\
