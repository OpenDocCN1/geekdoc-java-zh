  md: '# Chapter 9: Constructing New Objects


    The code in Listing 9-12 is made up mostly of calls to Java API (Application Programming
    Interface) methods. What this means to you is that the code lots of names that
    are probably unfamiliar to you. When I was first becoming acquainted with Java,
    I foolishly believed that knowing Java meant knowing these names. Quite the contrary:
    These names are just carry-on baggage. The real Java is the way the language implements
    object-oriented concepts.


    # Packages and import declarations


    Java has a feature that lets you lump classes into groups of classes. Each lump
    of classes is called a `package`. In the Java world, programmers customarily give
    these packages dot-dotted names. For instance, if I''ve desired the name `com.burdbrain.util`,
    I may name a package that. The Java API is actually a collection of packages with
    names like `java.lang`, `java.util`, `java.awt`, `java.swing`, and so on.


    of the package in which the class is defined. (You can find out all this about
    java.util` and `Scanner` by reading Java''s API documentation. For tips on reading
    the documentation, see Chapter 3 and this book''s Web site.)


    Here''s another example. The declaration


    ```

    import java.swing.*;

    ```


    is valid because `java.swing` is the name of a package in the Java API, and the
    asterisk refers to all classes in the `java.swing` package. With this import declaration
    at the top of your Java class, you can use abbreviated names for classes in the
    `java.swing` package — names like `JFrame`, `JButton`, `JCheckBox`, and many others.


    With this information about packages, I can clear up some of the confusion about
    import declarations. Any import declaration that doesn''t use the `static` word
    must start with the name of a package and end with either the following:


    +   * The name of a class within that package


    +   * An asterisk (including all classes within that)


    For example, the declaration


    ```

    import java.util.Scanner;

    ```


    is valid because `java.util` is the name of a package in the Java API, and Scanner
    is the name of a class in the `java.util` package. The dotted name `java.util.Scanner`
    is the *fully qualified name* of the `Scanner` class. A class''s fully qualified
    name includes the


    Here''s more example. A line like


    ```

    import java.swing.*; // Bad!!

    ```


    is not a valid declaration. The API has no package with the one-word name `java`.
    You might think that this line allows you to abbreviate all names with `java`
    (like `java.swing.JFrame`, `java.sound.midi`), but that''s not the way the import
    works. Because `java` isn''t the name of a package, the line import `java.*` just
    angers the compiler.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_243_0.png)'
