  md: '# Chapter 7: Thinking in Terms of Classes and Objects


    # Public lives and private dreams: Making a variable name inaccessible


    Notice the addition of the word private in front of the Account class''s variable
    declarations. The word *private* is a Java keyword. When a variable is declared
    to be private, no code outside of the class can make direct reference to that.
    So if you put `myAccount.name = "Barry Burd"` in the UseAccount class of Listing
    7-9, you will get the error message has no access in Account.


    Instead of refactoring `myAccount.name`, the UseAccount programmer must call `myAccount.setName`
    or `myAccount.getName`. These methods, setName and getName, are called accessor
    methods, because they provide access to the Account class''s variable. (Actually,
    the term accessor method isn''t formally a part of the Java programming language.
    It is just the term we use for methods that do this sort of thing.) To zoom in
    more, setName is called a setter, and getName is called a getter method. I bet
    you won''t forget terminology!)


    Another used term for an accessor method is a bean method. The phrase bean method
    comes from the world of JavaBeans — a way of plugging Java programs into existing
    graphical user interface (GUI) environments. Because JavaBeans relies heavily
    on accessor methods, many people associate accessor methods with the JavaBeans
    specification.


    With the Pro version of JCreator, you don''t have to type your own accessor methods
    First you type a variable declaration like *private String name*. Then, in JCreator
    Pro''s menu bar, you choose Tool>Insert Bean Methods. After you approve the defaults
    in a small dialog box, JCreator creates accessor methods and adds them to your
    code.


    Notice that all the setter and getter methods in Listing 7-8 are declared to be
    public. This ensures that anyone from anywhere can call these two methods. The
    idea is that manipulating actual variables from outside is impossible, but you
    can easily reach the approved setter and getter methods for using those variables.


    To read more about the public and private keywords, see Appendix B and Chapter
    15. (Chapter 15 is on the CD-ROM.)


    Think again about the automatic teller machine. Someone using the ATM can''t type
    a command that changes the value in his or her account''s'
