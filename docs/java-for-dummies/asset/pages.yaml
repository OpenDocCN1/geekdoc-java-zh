  md: "# 308 Part IV: Savvy Java Techniques\n\nNow, the Java programming language\
    \ has two different kinds of exceptions.\nThey're called checked and unchecked\
    \ exceptions:\n\n+   - The potential throwing of a checked exception must be acknowledged\
    \ in the code.\n\n+   - The potential throwing of an unchecked exception doesn't\
    \ need to be acknowledged in the code.\n\nAn InterruptedException is one of Java's\
    \ checked exception types. When you call a method that has the potential to throw\
    \ an InterruptedException, you need to acknowledge that exception in the code.\n\
    \nNow, when I say that an exception is acknowledged in the code, what do I really\
    \ mean?\n\n```\n// The author wishes to thank InterruptedException,\n// without\
    \ this code could not have been written.\n```\n\nNo, that's what it means to be\
    \ acknowledged in the code. Acknowledging an exception in the code means one of\
    \ two things:\n\n+   - The statements (including method calls) that can throw\
    \ the exception inside a try clause. That try has a catch clause with a matching\
    \ exception type in its parameter list.\n\n+   - The statements (including method\
    \ calls) that can throw the exception are inside a method that has a throws clause\
    \ in its header. The throws clause contains a matching exception type.\n\nIf you're\
    \ confused by the wording of these two bullets, don't worry. The next two listings\
    \ illustrate the points made in the bullets.\n\nIn 12-9, the method that can throw\
    \ an InterruptedException is inside a try clause. That try has a catch clause\
    \ with exception InterruptedException.\n\n# Listing 12-9: Acknowledging with a\
    \ try-catch Statement\n\n```\nimport static java.lang.System.sleep;\n\nclass GoodNightsSleepA\
    \ {\n\n    public static void main(String[] args[]) {\n        out.out.print(\"\
    Excuse me while I nap\");\");\"\n```"
