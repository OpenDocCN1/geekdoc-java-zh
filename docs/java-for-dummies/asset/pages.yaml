    myFrame to be of type JFrame, you''re reserving the use of the name myFrame. This
    reservation tells the computer that myFrame can refer to an actual JFrame-type
    object. In other words, myFrame can become a nickname for one of the windows that
    appears on the computer screen. The situation is illustrated in Figure 4-8.


    When you declare ClassName variableName;, you''re saying that a certain variable
    can refer to an instance of a particular class.


    In Listing 4-6, the phrase JFrame myFrame reserves the use of the name myFrame.
    On that line of code, the phrase new JFrame() creates a new object (an instance
