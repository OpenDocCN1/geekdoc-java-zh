    First you need some Java development software. You can choose from several products.
    In fact, you may already have one of these products on your computer. If you don''t,
    you can download the basic software by visiting a Sun Microsystems Web site. The
    product that you want to download is known by a few different names. It''s called
    the Java Development Kit (JDK), the Java Software Kit (SDK), and the Java Standard
    Edition (Java SE). You may even see a 2 in a name like Java 2 Standard Edition
    (J2SE), but the 2 doesn''t mean anything. (Sun Microsystems added the 2 years
    ago and then dropped the 2 in 2006.)


    This section tells you how to download and install the Java SDK. First, I give
    a condensed, quick-start set of instructions. Then, I present a detailed, read-every-step-carefully
    version.'
