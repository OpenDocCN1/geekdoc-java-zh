  md: '# Chapter 10: Putting Variables and Methods Where They Belong 251


    The improper use of parameter passing caused the problem. In Java, when you pass
    a parameter that has one of the eight primitive types to a method, that parameter
    is passed by value.


    For a review of Java''s eight primitive types, see Chapter 4.


    Here''s what this means in plain English: Any changes that the method makes to
    the value of its parameter doesn''t affect the values of variables in the calling
    code. In Listing 10-10, the birth method can apply the ++ operator to cityPop
    whatever it wants—the application of the cityPop parameter has absolutely no effect
    on the value of the smackoverARpop variable in the main method.


    Technically, what''s happening is the copying of a value (See Figure 10-11.) When
    the main method calls the birth method, the value stored in smackoverARpop is
    copied to another memory location—a location reserved for the cityPop parameter''s
    value. During the birth method''s execution, 1 is added to the cityPop parameter.
    But the place where the original 2232 value was stored—the memory location for
    the smackoverARpop variable—remains unaffected.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_271_0.png)


    When you do parameter passing with any of the eight primitive types, the computer
    uses pass by value. The value stored in the calling code''s variable remains unchanged.
    This happens even if the calling code''s variable and the called method''s parameter
    happen to have the exact same name.'
