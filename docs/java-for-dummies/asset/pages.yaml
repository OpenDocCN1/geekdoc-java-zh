  md: '# Part I: Getting Started


    I put on my robe and rush to the front of my house''s driveway. I pick up the
    morning paper, I glance at the front page and see the two-inch headline:


    Burd calls Java "A Great Object-Oriented Language"


    # Object-oriented languages


    Java is object-oriented. What does that mean? Unlike languages, such as FORTRAN,
    which focuses on giving the computer imperative "Do this/Do that" commands, object-oriented
    languages focus on data. Of course, object-oriented programs tell the computer
    what to do. They start, however, by organizing the data, and the commands come
    later.


    Object-oriented languages are better than "Do this/Do that" languages because
    they organize data in a way that lets people do all kinds of things with it. To
    modify the data, you can build on what you already have, rather than scrap everything
    you''ve done and start each time you need to do something new. Although computer
    programmers are generally smart people, they took awhile to figure this out. For
    the full history lesson, see the sidebar "The winding road for FORTRAN to Java"
    (but I won''t make you feel guilty if you don''t read it).


    # Objects and their classes


    In an object-oriented language, you use objects and classes to organize your data.


    Imagine you''re writing a computer program to keep track of the houses in a condominium
    development (still under construction). The houses differ slightly from one another.
    Each house has a distinctive color, an indoor paint color, a kitchen cabinet style,
    and so on. In your object-oriented program, each house is an object.


    But objects aren''t the whole story. Although the houses differ differently all
    the share the same list of characteristics. For instance, each house has a characteristic
    known as siding color. Each house has another characteristic known as kitchen
    cabinet style. In your object-oriented program, you need a master list containing
    all the characteristics that a house object possesses. This master list of characteristics
    is called a class.


    So there you have it. Object-oriented programming is misnamed. It should really
    be called "programming with classes and objects."'
