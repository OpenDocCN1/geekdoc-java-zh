    that, I (try) to keep a fairly up-to-date list of useful Java links.


    Finally, if you need more information on basic hardware and software issues, check
    out these books published by Wiley Publishing, Inc.: PCs For Dummies, 10th Edition,
    by Dan Goookin; Mac For Dummies, 9th Edition, by Edward C. Baig; Windows XP 2000
    Professional For Dummies, by Andy Rathbone and Sharon Crawford; Windows XP All-in-One
    Desk Reference Dummies, 2nd Edition, by Woody Leonhard, Windows 98 For Dummies,
    Microsoft Windows Millennium Edition For Dummies, and Windows Vista For Dummies,
    all by Andy Rathbone.


    # Using the CD with Microsoft Windows


    To install items from the CD to your hard drive (with the Autorun feature enabled),
    follow these steps:


    +   1. Insert the CD into your computer''s CD-ROM drive.


    A window appears with the following options: HTML Interface, Browse CD, and Exit.


    +   2. Select one of the options, as follows:


    +   * HTML Interface: Click this button to view the contents of the CD in Standard
    For Dummies presentation. It looks like a Web page. Here you can also find a list
    of Web links from the book.


    +   * Browse CD: Click this button to skip the fancy presentation and simply view
    the CD contents from the directory structure. This means that you just see a list
    of folders — plain and simple.


    +   * Exit: Well, what can I say? Click this button to quit.


    If you don''t have the Autorun feature enabled, or if the Autorun window doesn''t
    appear, follow these steps to access the CD:


    +   1. Insert the CD into your computer''s CD-ROM drive.


    +   2. Click the Start button and choose Run from the menu.


    +   3. In the dialog box that appears, type d:\start.htm.


    Replace d with the proper drive letter for your CD-ROM if it uses a different
    letter. (If you don''t know the letter, double-click the My Computer icon on your
    desktop and see what letter is listed for your CD-ROM drive.)'
  merge: -1
