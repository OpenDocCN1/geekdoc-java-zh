  md: '# 182 Part III: Working with the Big Picture: Object-Oriented Programming


    You want to read data from a file. You start by imagining that you''re reading
    from the keyboard. The usual Scanner and next codes into your program. And add
    some extra items from the Listing 8-2:


    +   - Add two new import declarations — one for java.io.File and another for java.IOException.

    - Type throws IOException in your method''s header.

    - Type new File("") in your call to new Scanner.

    - Take a file that''s already on your hard drive. Type that filename inside the
    quotation marks.

    - Take the word that you use for the name of your scanner. Reuse that in calls
    to next, nextInt, nextDouble, and so on.


    Occasionally, copying and pasting code can get you into trouble. Maybe you''re
    writing a program that doesn''t fit the simple Listing 8-2 pattern. You need to
    tweak the pattern a bit. But in order to tweak the pattern, you need to understand
    some of the ideas behind the pattern.


    That''s how the next section connects to your rescue. It covers some of these
    ideas.


