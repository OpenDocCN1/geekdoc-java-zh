    Yes to continue the installation.


    # Using the CD with Mac OS


    To install items from the CD to your hard drive, follow these steps:


    +   1. Insert the CD into your computer''s CD-ROM drive.


    In a moment, an icon representing the CD that you just inserted appears on your
    Mac desktop. Chances are that the icon looks like a CD-ROM.


    +   2. Double-click the CD icon to show the CD''s contents.


    +   3. Double-click start.htm to open your browser and display the license agreement.


    If your browser doesn''t open automatically, open it as you normally would by
    choosing File:Open File (in Internet Explorer) or File:Open:Location in Netscape
    and select Java 2 For Dummies. The license agreement appears.


    +   4. Read through the license agreement, nod your head, and click the Accept
    button if you want to use the CD.


    After you click Accept, you are taken to the Main menu. This is where you can
    browse through the contents of the CD.'
