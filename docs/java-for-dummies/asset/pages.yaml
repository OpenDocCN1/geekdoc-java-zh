    # Loops Made Painless


    I''ll never forget the first time I played Clue. We bought the board game during
    a vacation in Niagara Falls. (Niagara Falls?) Cousin Alan and I sat in the hotel
    room playing the game for hours on end. Scribbled complicated assertions in my
    little detective''s notebook.


    At one point, I bluffed by suggesting three cards that I had in my hand. Alan
    took the bait and made an accusation that was wrong on all three counts. Because
    he''d lost the game, and I was being so smug about it, he beat the daylight out
    of me. If I had the chance, I''d do it over again.


    The material in this section applies to Java 5, Java 6, or whatever version number
    comes in the next few years. But this section''s material doesn''t work with older
    versions of Java—versions such as 1.3, 1.4, and so on. For a bit more about Java''s
    version numbers, see Chapter 2.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_156_1.png)


    # Don''t need stinking counters


    The loop in Listing 6-2 counts from 1 to 10. And its friend (the loop in Listing
    6-3) counts 1, 2, 3. This counting is very nice, but sometimes it''s not the natural
    way to think about a problem. For instance, the listing of all possible accusations
    in the board game Clue. The suspects are numbered from 1 to 6, and neither are
    the rooms or weapons. You can number these things, but why bother with numbering
    when the programming language provides a simpler solution?


    Java''s enhanced for loop lets you cycle through groups of things withoutating
    a counting variable. All you have to do is define the group. Listing 6-5 shows
    you what to do.'
