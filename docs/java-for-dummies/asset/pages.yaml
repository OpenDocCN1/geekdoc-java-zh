    In Java, static variables and methods show up all over the place. When they''re
    declared in someone else''s code, and you''re making use of them in your code,
    you hardly have to worry about them. But when you''re declaring your own variables
    and must decide whether to make them static, you have to think a little harder.


    # Could cause static; handle with care


    When I first started Java, I had recurring dreams about getting a certain error
    message. The message was non-static variable or method cannot be referenced from
    a static context. So often I saw this message, thoroughly I was perplexed, that
    the memory of this message became buried in my subconscious existence.


    These days, I know why I got that error message so often. I can even make the
    message occur if I want. But I still feel a little shiver whenever I see this
    message on my screen.


    Before you can understand why the error occurs and how to fix the problem, you
    need to get some terminology under your belt. If a variable or method isn''t static,
    it''s called non-static. (Real surprising, huh?) Given that terminology, there
    are at least two ways to make the dreaded message'
