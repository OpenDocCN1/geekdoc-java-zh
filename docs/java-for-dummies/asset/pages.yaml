    # The conditional operator


    Listing 11-5 uses an interesting doodad called the conditional operator. This
    conditional operator takes three expressions and returns the value of just one
    of them. It''s like a mini if statement. When you use the conditional operator,
    it looks like this:


    ```

    conditionToToBeTested ? expression1 : expression2

    ```


    The computer evaluates the conditionToBeTested condition. If the condition is
    true, the computer returns the value of expression1. But if the condition is false,
    the computer returns the value of expression2.


    So, in the code


    ```

    smoking ? "yes" : "no"

    ```


    the computer checks whether smoking has the value true. If so, the whole three-part
    expression stands for the first string, "yes". If not, the whole expression stands
    for the second string, "no".


