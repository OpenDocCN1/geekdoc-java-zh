    # Constructors for subclasses


    By far, the biggest news in Listing 9-5 is the way the code constructors. The
    TemperatureNice class has four of its constructors. If you''ve gotten in quite
    thinking about subclass inheritance, why might wonder why these constructor declarations
    are necessary. Doesn''t TemperatureNice inherit the parent Temperature class''s
    constructors? No, subclasses don''t inherit constructors.


    Subclasses don''t inherit constructors.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_236_2.png)


    That''s right. Subclasses don''t inherit constructors. In one oddball case, a
    constructor might look like it''s being inherited, but that oddball situation
    is a fluke, not the norm. In general, when you define a subclass, you declare
    new constructors to go with the subclass.'
