  md: '# Chapter 1: All About Java


    # The winding roost from FORTRAN


    Back in the mid-1950s, a team of people created a programming language named FORTRAN.
    It was a good language, but based on the idea that you should issue direct, imperative
    commands to the computer. Do this, then do that. (Of course, the commands in a
    real FORTRAN program were much more precise than "Do this" or "Do that.")


    In the 1970s, object-oriented languages like SIMULA and Smalltalk became buried
    in the computer hobbyist magazines. In the meantime, languages based on the old
    TRAN model were multiplying alike.


    In 1986, a fellow James Broustrup created a language named C++. C++ language became
    very popular because it mixed the old C terminology with the improved object-oriented
    structure. Many turned back on the old TRAN/C programming style and adopted C++
    as their standard.


    In the years that followed, teams developed many new computer languages, and many
    of the languages copied the FORTRAN "Do this/that" model. Of the most popular
    "Do this/that" languages were the one-letter name C. Of those, the "Do this/do
    that" camp had some regrets. In languages named SIMULA and Smalltalk, programmers
