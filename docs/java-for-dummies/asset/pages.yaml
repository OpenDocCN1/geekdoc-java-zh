  md: '# 106 Part II: Writing Your Own Java Programs


    ![](img/cd0a178910e21af6e9ed167dca0579cd_126_0.png)


    Figure 5-2: An if statement is like a fork in the road.

    *You win.* You lose. The random number was... Thank you for playing.


    Sometimes, when I''m writing about a condition that''s being tested, I slip into
    using the word expression instead of *condition*. That''s okay, because every
    condition is an expression. An expression is something that has a value and, sure
    enough, every condition has a value which is either **true** or **false**. (For
    revealing information about expressions and values like *true* and *false*, see
    Chapter 4.)


    # The double equal sign


    In Listing 5-1, in if statement''s condition, notice the use of the double equal
    sign. Comparing two numbers to see whether they''re the same isn''t the same as
    setting something to something else. That''s the symbol to compare for equality
    isn''t the symbol that used in an assignment or an initialization. In if statement''s
    condition, you can''t replace the double equal with a single equal sign. If you
    do, your program just won''t work. (You always get an error message when you try
    to compile your code.)


    On the other hand, if you never make the mistake of using a single equal sign
    in a condition, you''re not normal. Not long ago, while I was teaching an introductory
    Java course, I promised that I''d swallow my laser pointer if no one made the
    single equal sign mistake during any of the lab sessions. This wasn''t an ideal
    promise. I never had to keep it. As turned out, if I had ignored the first ten
    times anybody made the single equal mistake during those lab sessions, I would
    still be laser-pointer free. Everybody mistakenly uses the single equal several
    times in his or her programming career. The trick is not to avoid making the mistake,
    the trick is to catch the mistake whenever you make it.'
