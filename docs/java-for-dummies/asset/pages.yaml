  md: '# 188 Part III: Working with the Big Picture: Object-Oriented Programming


    This time last year, your company paid $10 million for a piece of software. That
    software came in the Employee.class file. People at Brain Consulting (the company
    that created the software) don''t want you to know about the innards of the software
    (otherwise, you may steal theirs). In other words, you don''t have the Java program
    file that the software came from. (In other words, you don''t have Employee.class
    file. You can also read the documentation in a Web page named Employee.html. But
    you can''t see the statements inside the Employee.java program, and you can''t
    change any of the code.


    Since this time last year, your company has grown. Unlike the old days, your company
    now has two kinds of employees: full-time and part-time. Each fulltime employee
    is on a fixed, weekly salary. (If the employee works nights and weekends, then
    in return for this monumental effort, the employee receives a hearty handshake.)
    In contrast, part-time employee works for an hourly wage. Your company deducts
    an amount from each full-time employee''s paycheck to pay for the company''s benefits
    package. Part-time employees, however, don''t get benefits.


    The question is, how can the software that your company bought last year keep
    up with your company''s growth? You invested in a project to handle employees
    and their payroll, but the program doesn''t differentiate between full-time and
    part-time employees. You have several options:


    +   - Call your next-neighbor, whose 12-year-old child knows about computer programming
    than anyone in your company. This gets upset little brat to take the employee
    software apart, rewrite it, and hand back to you with all the changes and additions
    your company requires.

    - On second thought, do that. No matter how smart that kid is, the complexities
    of the employee software will probably confuse the kid. By the time you get the
    software back, it''ll be filled with bugs and inconsistencies. Besides, you don''t
    even have the Employee.java file to hand to the kid with a text editor. (See Chapter
    2.) Besides, your kid just just beat up the neighbor''s kid. You don''t want to
    give your neighbor the satisfaction of seeing you beg for kid''s help.

    - Scrap the $10 million employee software. Get someone in your company to rewrite
    the software from scratch.'
