  md: '# Chapter 12


    # Looking Good When Things Take

    Unexpected Turns


    In This Chapter


    +   - Recovering from bad input and other nasty situations

    - Making your code (more or less) crash proof

    - Defining your own exception class


    September 19, 1945: A moth flies into one of the relays of the Harvard Mark

    II computer gums up the works. This becomes the first recorded

    case of a real computer bug.


    April 19, 1957: Herbert Bright, manager of the data processing center at

    Westhouse in Pittsburgh, receives an unmarked deck of computer punch

    cards in the mail (which is like getting an unlabeled CD-ROM in the mail

    today). Mr. Bright guesses that this deck comes from the development team

    for FORTRAN — the computer programming language. He has been waiting

    a few years for this software. (No Web downloads were available at the time).


    Armed with nothing but this good guess, Bright writes a small FORTRAN pro-

    gram and tries to compile it on his IBM 704. The IBM 704 lives in its own

    specially built, 2000-square-foot room. With vacuum tubes instead of transistors,

    the machine has a whopping 32K of RAM. The operating system has to be

    loaded from tape before the running of each program, and a typical program

    takes between two and four hours to run). After the usual waiting time,

    Bright''s attempt to compile a FORTRAN program comes back with a single

    er — a missing comma in one of the statements. Bright corrects the error,

    and the program runs like a charm.


    July 22, 1962: Mariner I, the first U.S. spacecraft aimed at another planet, is

    destroyed when it behaves badly four minutes after launch. The bad behavior

    is attributed to a missing bar (like a hyphen) in the formula for the

    rocket''s velocity.'
