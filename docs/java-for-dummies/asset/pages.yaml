  md: "# Chapter 9: Constructing New Objects\n\n```\nthis.number = number;\nscale\
    \ = ScaleName.fahrenheit;\n}\n../ but don't put both constructors in your code.\n\
    ```\n\nListing 9-4 has two constructors in it. In the first constructor, I use\
    \ two different names — number and whatever. In the second constructor, I don't\
    \ need two names. Instead of making up a new name for the constructor's parameter,\
    \ I reuse an existing name by writing this.number.\n\nSo here's what is going\
    \ on in Listing 9-1:\n\n+   - In the statement this.number = number, the name\
    \ this.number refers to the new object's number variable — the variable that declared\
    \ near the very top of Listing 9-1. (See Figure 9-2).\n\n+   - In the statement\
    \ this.number = number, the word number (on its own, with this) refers to the\
    \ constructor's parameter. (Again, see Figure 9-2).\n\n```\nclass Temperature\
    \ {\n  private double number;\n  private ScaleName scale;\n\n  public Temperature(double\
    \ number) {\n    this.number = number;\n    scale = ScaleName.fahrenheit;\n  }\n\
    ```\n\n![](img/cd0a178910e21af6e9ed167dca0579cd_231_0.png)\n\nIn general, this.someName\
    \ refers to a variable belonging to the object that contains the code. In contrast,\
    \ plain old someName refers to the closest place where someName happens to be\
    \ declared. In the statement this.number = number (Listing 9-1), that closest\
    \ place happens to be the Temperature constructor's parameter list."
