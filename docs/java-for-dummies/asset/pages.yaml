  md: '# Chapter 4: Making the Most of Variables and Their Values


    type amountInAccount has and whatever value amountInAccount (currently represents)
    is the variable itself. If you think this distinction between variable and variable
    name is too subtle for you to worry about, join the club.


    Every variable name is an identifier — a name that you can make up in your code.
    In preparing Listing 4-1, I made up the name amountInAccount.


    For more information on the kind of names in a Java program, see Chapter 3.


    Before the sun sets on Listing 4-1, you need to notice one more part of the listing.
    The listing is 50.22 and 1000000.00 in it. Anybody in his or her right would call
    these numbers, but in a Java program it helps to call these literals.


    And what''s so literal over 50.22 and 1000000.00? Well, think about the variable
    amountInAccount in Listing 4-1. The variable amountInAccount stands for 50.22
    of the time, but it stands for 1000050.22 the rest of the time. You could use
    the word literal to talk about amountInAccount. But really, what amountInAccount
    stands for depends on the fashion of the moment. On the other hand, 50.22 literally
    stands for the value 50%


    A variable''s value changes; a literal''s value doesn''t.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_95_0.png)


