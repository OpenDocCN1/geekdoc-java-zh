  md: "# Chapter 12: Looking Good When Take Unexpected Turns 313\n\n```\nout.println(\"\
    Exception caught in\ndosoSomething.\");\nout.println(0 / 0);\nfinally {\n    out.println(\"\
    I'll get printed.\");\n}\n\nout.println(\"I won't get printed.\");\n```\n\nNormally,\
    \ when I think about a try statement, I think about the computer recovering from\
    \ an unpleasant situation. The recovery takes place inside a catch clause, and\
    \ then the computer marches on to whatever statements come after the try statement.\
    \ Well, if something goes wrong during execution of a catch clause, this picture\
    \ can start looking different.\n\nListing 12-11 gets a workout in Figure 12-14.\
    \ First, the main method calls something. The stupid doSomething goes out of its\
    \ ways to cause trouble. The doSomething method divides 0 by 0, which is illegal\
    \ and undoable in anyone's programming language. This foolish action by the doSomething\
    \ method throws an ArithmeticException, which is caught by the try statement's\
    \ one and only catch clause.\n\ninside the catch clause, that lowlife doSomething\
    \ method divides by 0 again. This time, the statement that does the division isn't\
    \ inside a by 0 try clause. That's okay, because an ArithmeticException isn't\
    \ checked. (It's one of RuntimeException subclasses. It's an exception that doesn't\
    \ have to be acknowledged in a try or a throws clause. For details, see the previous\
    \ section.)\n\nWell, checked or not, the throwing of another ArithmeticException\
    \ causes to jump out of the doSomething method. But, before leaving the doSomething\
    \ method, the computer executes the try statement's last will and testament —\
    \ That's why, in Figure 12-14, you see the words I'll get printed.\n\nFigure 12-14:\
    \ Running the code from Listing 12-11.\n\n| General Output | Configuration |\n\
    |---|---|\n| Exception caught in doSomething | I'll get printed |\n| Exception\
    \ caught in main | Process completed. |"
