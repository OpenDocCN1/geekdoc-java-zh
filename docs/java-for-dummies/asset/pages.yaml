  md: '# Chapter 3: Using the Basic Building Blocks


    The first /* (after Intentionally displays) ends the traditional comment prematurely.
    Then the battles and carefully statements aren''t commented out, and the last
    /* chokes the compiler.


    So the best way to comment code is to use end-of-line comments. But typing two
    slashes for each of ten lines can be tedious. Fortunately, JCreator has a good
    shortcut. Here''s how it works:


    +   1. Select the lines that you want to comment out.


    +   2. From the JCreator menu bar, choose Edit:Format:Increase Indent.


    When you do this, each selected line becomes an end-of-line comment. End-of-line
    comments can contain traditional comments (and other end-of-line comments) so
    you can comment the Parents, pick your battles carefully; code with no unwanted
    side effects. If you decide to uncomment the code, that''s easy, too:


    +   1. Select the lines that you no longer want to be commented out.


    +   2. From the JCreator menu bar, choose Edit:Format:Decrease Indent.


