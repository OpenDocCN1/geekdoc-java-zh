  md: '# Chapter 8: Saving Time and Money: Reusing Existing Code


    To understand Listing 8-6, you need to keep an eye on three classes: Employee,
    FullTimeEmployee, and PartTimeEmployee. (For a look at the code that defines these
    classes, see Listings 8-1, 8-3, and 8-5).


    The first half of Listing 8-6 deals with a full-time employee. Notice how many
    methods are available for use with the ftEmployee variable. For instance, you
    can call ftEmployee.setWeeklySalary because ftEmployee has type FullTimeEmployee.
    You can also call ftEmployee.setName because the FullTimeEmployee class extends
    the Employee class.


    Because cutCheck is declared in the Employee class, you can call ftEmployee.cutCheck.
    You can also call ftEmployee.findPaymentAmount as findPaymentAmount method is
    in the FullTimeEmployee class.


    # Matching types


    Look again at the first half of Listing 8-6. Take special notice of that last
    statement— the one which the full-time employee is actually a check. The statement
    forms a nice, long chain of values and their types. You can see this by reading
    the statement from the inside out.


    +   - Method ftEmployee.findPaymentAmount is called with an empty parameter list
    (Listing 8-6). That''s good, because findPaymentAmount method takes no parameters
    (Listing 8-3).


    +   - The findPaymentAmount method returns a value of type double (again, Listing
    8-3).


    +   - The double value that ftEmployee.findPaymentAmount returns is passed to
    method ftEmployee.cutCheck (Listing 8-6). That''s good, because the cutCheck method
