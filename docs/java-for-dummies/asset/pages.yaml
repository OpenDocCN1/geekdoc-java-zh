  md: '# Chapter 8: Saving Time and Money: Reusing Code


    The EmployeeInfo.txt file is like a word processing document. The file can contain
    letters, digits, and other characters. Unlike a word processing document, the
    EmployeeInfo.txt file contains no formatting — no italics, no bold, no fixed sizes,
    nothing of that kind.


    The EmployeeInfo.txt file contains only ordinary characters — the kinds of keystrokes
    that you type while playing a guessing game from Chapters 5 or 6. Of course, getting
    guesses from a user''s keyboard and reading employee data from a disk file aren''t
    exactly the same. In a guessing game, the program displays prompts, such as Enter
    int from 1 to 10. The game conducts a back-and-forth dialogue with the person
    sitting at the keyboard. In contrast, Listing 8-2 has no dialogue. This DoPayroll
    program reads from a hard drive and doesn''t prompt or interact with anyone.


    Most of this is about code reuse. But Listing 8-2 stumbles upon an important idea
    — an idea that''s not directly related to code reuse. Unlike the examples in previous
    chapters, Listing 8-2 reads data from a stored disk file. In this section, I take
    a short side to explore files.


