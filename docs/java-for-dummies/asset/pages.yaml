  md: "# Chapter 6: Controlling Program Flow with Loops 129\n\n![](img/cd0a178910e21af6e9ed167dca0579cd_149_0.png)\n\
    \nEach of the three items in parentheses plays its own distinct role:\n\n+   -\
    \ The initialization is executed once, when the run of your program first reaches\
    \ the for statement.\n- The expression is evaluated several times (before each\
    \ iteration).\n- The update is also evaluated several times (at the end of each\
    \ iteration).\n\nIf it helps, think of the loop as if its text is shifted around:\n\
    \n```\nint count = 1\nfor count <= 10 (\n    out.print(\"The value of count is\
    \ \");\n    out.print(count);\n    out.println(\".\");\n)\n```\n\nYou can't write\
    \ a real for statement this way. Even so, this is the order in which the parts\
    \ of the statement are executed.\n\n> If you declare a variable in the initialization\
    \ of a for loop, you can't use that variable outside the loop. For instance, in\
    \ Listing 6-2, you get an error message if you are trying out out.println(count)\
    \ after the end of the loop.\n\n> Anything that can be done with a for loop can\
    \ also be done with a while loop. Choosing to use a for loop is a matter of style\
    \ and convenience, not necessity."
