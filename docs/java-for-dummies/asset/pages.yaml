    +   - If I''m being lazy, refer to the code in Listing 3-2 as a method. If I''m
    not being lazy, refer to this code as a method declaration.

    - The method declaration in Listing 3-2 has two parts. The first line (the part
    with FixTheAlternator in it, up to but opening the open curly brace) is called
    a method header. The rest of Listing 3-3 (the part surrounded by curly braces)
    is a method body.

    - The term method declaration distinguishes the list of instructions in Listing
    3-2 from the instruction in Listing 3-3, which is known as a method call.


    A method declaration tells the computer what happens if you call the method into
    action. A method call (a separate piece of code) tells the computer to call the
    method into action. A method''s declaration and the method''s call tend to be
    in different parts of the Java program.


