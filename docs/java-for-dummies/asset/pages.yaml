    Like many other methods and constructors of its kind, the PrintStream constructor
    fussys around files. If it can''t find a GuestList.txt file, the constructor creates
    one and prepares to write into it. But, if a GuestList.txt file already exists,
    the constructor clobbers the existing file and prepares to write to a new, empty
    GuestList.txt file. If you don''t like it when files are clobbered, take precautions
    before calling the PrintStream constructor.


    In Listing 11-4, the condition roomNum < 10 && guests[roomNum] != 0 can be really
    tricky. If you move things around, and write guests[roomNum]!== 0 && roomNum <
    10, you can get yourself into lots of trouble. For details, see this book''s Web
    site.


