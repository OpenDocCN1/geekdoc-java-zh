  md: "# Chapter 2: Running Canned Java Programs 39\n\n# Compiling and running a Java\
    \ program\n\nWhat does it mean for JCreator to \"compile your project?\" A compiler\
    \ is a tool that translates code from one format to another. In instance, in my\
    \ Program0201 project, I have a file named MortgageText.java. If you look inside\
    \ the `MortgageText.java` file, you see code like this:\n\n```\nimport java.text.NumberFormat;\n\
    import\npublic class MortgageText {\n    public static void main(String[] args)\
    \ throws IOException\n```\n\nAlthough this is not easy reading, it clearly uses\
    \ letters and other characters that English-speaking people can understand. This,\
    \ `MortgageText.java`, is called Java source code. It's the kind of code that\
    \ you figure out how to write by reading this book. It's the code that you have\
    \ before you've done any compiling—before you choose `Build-Compile` from JCreator's\
    \ main menu.\n\nWhen you choose `Build-Compile`, the computer takes your source\
    \ code and translates it into something called `bytecode`. The newly created bytecode\
    \ is automatically given a name like `MortgageText.class`. You can then open it\
    \ and look at the file in your `Program0201` directory. Unlike the original `.class`\
    \ file has no recognizable characters in it and isn't suitable for human consumption.\
    \ Instead, the `class` file is streamlined so that the computer can carry out\
    \ your program's commands quickly and easily.\n\nIn the case code, Java represents\
    \ a stark departure from most other programming languages. When you compile a\
    \ program in another language (COBOL or C++, for instance), you create a file\
    \ that can be run on only one operating system. For example, if you compile a\
    \ C++ program on a Windows computer and then move the translated file to a Mac,\
    \ the Mac treats the translated file as pure garbage. The Mac can't interpret\
    \ any of the instructions in the translated file. This is bad for many reasons.\
    \ One of the most striking reasons is that you can't send this kind of code to\
    \ the Wide Wide Web and expect anyone with a different kind of computer to run\
    \ the code.\n\nBut with Java, you can take a bytecode file that you created with\
    \ a Windows computer, who-knows what kind of bytecode it, and then run it with\
    \ no trouble at all. This is one of the reasons why Java has become so popular—standing\
    \ feature, which gives you the ability to run on many different kinds of computers,\
    \ is portability.\n\nAfter compiling your Java project, choose `Build-Compile`\
    \ from the main menu. In normally, I say that your computer starts running a Java\
    \ program. But to be really, your computer actually runs \"Runs a program.\" Your\
    \ computer runs something called the Java Virtual Machine (JVM). The of a virtual\
    \ machine is another way in which Java is different from other computer programming\
    \ languages.\n\nThe Java Virtual Machine is a piece of software. Think of the\
    \ JVM as an interpreter, a go-between between Java's run-anywhere and computer's\
    \ system. As it runs, the JVM walks through the execution of bytecode instructions.\
    \ The JVM executes your bytecode, bit by bit, and carries out the instructions\
    \ described in the bytecode. The JVM interprets bytecode for your Windows system,\
    \ your Linux box, or whatever kind of computer you're using. That's a good thing.\
    \ What makes Java programs more portable than programs in any other language.\n\
    \n![](img/cd0a178910e21af6e9ed167dca0579cd_59_0.png)"
