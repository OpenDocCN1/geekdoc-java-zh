    > Hello, again. You''re listening to radio station WWW, and I''m your host, Sam
    Burd. It''s the start again of the big baseball season, and today that station
    WWW brought you live coverage of the Hankees versus Socks game. At this moment,
    I''m awaiting news of the game''s final score.


    If you remember from earlier this afternoon, the Socks looked like they were going
    to take those Hankees to the cleaners. Then, the Hankees were belting ball after
    ball, giving the Socks a run for their money. Those Socks! I''m glad I wasn''t
    in their shoes.


