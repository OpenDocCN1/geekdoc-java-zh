    # Declaring variables and creating objects


    In the first, the two lines inside the main method of Listing 7-2 are misleading.
    Some people read Account yourAccount as if it''s supposed to mean, "yourAccount
    is an Account," or "The variable yourAccount refers to an instance of the Account
    class." That''s not really what that first line means. Instead, the line Account
    yourAccount means, "If and I make the variable yourAccount refer to something,
    something will be an instance of the Account class." So, what''s the difference?


    The difference is that simply declaring Account yourAccount doesn''t make the
    yourAccount variable refer to an object. All declaration reserves the variable
    yourAccount so that name can eventually refer to an instance of the Account class.
    The creation of an actual object doesn''t come until later in the code, when the
    computer executes Account().


