  md: "# Part IV: Savvy Java Techniques\n\n# Passing Parameters\n\nA method can communicate\
    \ with another part of your Java program in several ways. One of the ways is through\
    \ the method's parameter list. Using a parameter list, you pass on-the-fly information\
    \ to a method as the method is being called.\n\nSo imagine that the information\
    \ you pass to the method is stored in one of your program's variables. What, if\
    \ anything, does the method actually do with that variable? This section presents\
    \ a few interesting case.\n\n# Pass by Value\n\nAccording to my Web research,\
    \ the town of Smackover, Arkansas, has 2,232 people in it. But my research isn't\
    \ current. Just yesterday, Dora Kermongoos celebrated a joyous occasion over Smackover\
    \ General Hospital — the birth of her healthy, blue-eyed baby girl. (The girl\
