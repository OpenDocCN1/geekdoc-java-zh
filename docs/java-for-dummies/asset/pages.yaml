    # Assignment Statements


    Statements like the ones in Listing 4-1 are called assignment statements. In an
    assignment statement, you assign a variable to something. In many cases, this
    is a variable.


    I recommend getting into the habit of reading assignment statements from right
    to left. For instance, the first line in Listing 4-1 says,


    ```

    "Assign 50.22...

    amountInAccount =

    50.22;

    ...to the

    amountInAccount

    variable."

    ```


    The second line in Listing 4-1 is just a bit more complicated. Reading the second
    line from right to left, you get


    ```

    "Add 1000000.00 to the value that''s

    already in the amountInAccount

    variable..."

    ```'
