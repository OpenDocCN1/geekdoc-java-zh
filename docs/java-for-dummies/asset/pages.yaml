    You are trying to decide between using preincrement or postincrement? No longer.
    Most programmers use postincrement. In a typical Java program, you often see things
    like numberOfBunnies++. You seldom see things like ++numberOfBunnies.


    In addition to preincrement and postincrement, Java has two operators that use
    --. These operators are called predecrement and postdecrement.


    +   - With predecrement(--numberOfBunnies), the counter subtracts 1 from the value
    before the variable is used in the rest of the statement.

    - With postdecrement(numberOfBunnies--), the counter subtracts 1 after the value
    is used in the rest of the statement.


    Instead of using numberOfBunnies, you could achieve the same effect by writing
    numberOfBunnies = numberOfBunnies + 1. So some people call Java''s ++ and -- operators
    keystrokes to keep those poor fingers from overworking themselves. This is entirely
    incorrect.

    The best reason for using is to avoid the inefficient and error-prone practice
    of writing the same variable name, such as numberOfBunnies twice in the same statement.
    If you write numberOfBunnies only once (as you do when you ++ or --), the computer
    has to figure out what numberOfBunnies means only once. On top of that, when you
    write numberOfBunnies only once, you have only one chance (instead of two


    ![](img/cd0a178910e21af6e9ed167dca0579cd_117_0.png)


    ![](img/cd0a178910e21af6e9ed167dca0579cd_117_1.png)'
