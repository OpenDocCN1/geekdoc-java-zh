    named dataFiles. Then move EmployeeInfo.txt file to the new datafiles. To read
    numbers and words from the file that you moved, modify Listing 8-2 with the code
    File("dataFiles\\EmployeeInfo.txt");


    ![](img/cd0a178910e21af6e9ed167dca0579cd_206_0.png)


    # Reading a line at a time


    In 8-2, the payOneEmployee method illustrates some useful tricks for reading data.
    In particular, every scanner that you create has a nextLine method (You may not
    use this nextLine method, but the method is available nonetheless). When you call
    a scanner''s nextLine method, the method grabs everything up to the end of the
    current line. In Listing 8-2 nextLine reads a whole line from the EmployeeInfo.txt
    file. In another program, a scanner''s nextLine may read everything up to the
    end of the current line by the pressing of the Enter key.


    Notice my careful choice of words — nextLine reads everything up to the end of
    the current line. Unfortunately, what it means to read up to the end of the current
    line isn''t always what you think it means. Intermingling nextInt, nextDouble,
    and nextLine can be messy. You have to watch what you''re doing and check your
    program''s output carefully.


    To understand this, you need to be painfully aware of a data file''s breaks. Think
    of a line break as an extra character, stuck between one line of text and the
    next. Imagine that calling nextLine means to read everything up to including the
    line break.


    Now take a look at Figure 8-4.


    +   * If one call to nextLine reads Barry Burd[LineBreak], the subsequent call
    to nextLine reads CEO[LineBreak].

    * If one call to nextDouble doubles the number 5000.00, the subsequent call to
    nextLine reads the [LineBreak] that comes immediately after the 5000.00. (That''s
    all the nextLine reads — a [LineBreak] and nothing more.)

    * If a call to nextLine reads the [LineBreak] after the number 5000.00, the subsequent
    call to nextLine reads Harriet Ritter[LineBreak].'
