  md: '# 48 Part I: Getting Started


    The word Sam is like a Java identifier because Sam is a name for a particular
    person. Words like Sam, Dinswald, and McGillimaroo don''t come prepacked with
    meaning in the English language. These words apply to different people depending
    on the context and become names when parents pick one for their newborn kid.


    Now consider "Julius Caesar is a person." If you utter this sentence, you''re
    probably talking about the fellow who ruled Rome until the Ides of March. Almost
    everyone uses the name Julius Caesar isn''t hard-wired into the English language,
    almost everyone uses the name to refer to the same person. If English were a programming
    language, the name would be an API identifier.


    So here''s I, in my own mind, divide the words in a Java program into categories:


    +   Keywords: A keyword is a word that has its own special meaning in the Java
    programming language, and that meaning doesn''t change from one program to another.
    Examples of keywords include if, else, and do. The Cheat Sheet in the front of
    this book has a complete list of Java keywords.


    The JCP members, who have the final say on what constitutes a Java program, have
    chosen all Java keywords. If you think about the two parts of Java, which I discuss
    in "Grammar and the common names" section earlier in this chapter, the Java keywords
    belong solidly to the Java Specification.


    +   Identifiers: An identifier is a name for something. The identifier''s meaning
    can change from one program to another, but some identifiers'' meaning tend to
    change more than others.


    +   Identifiers created by you and me: As a Java programmer (yes, even as a novice
    Java programmer), you create new names for classes and other things that you describe
    in your programs. Of course, you may make something Prime, and the writing code
    you double thinks the hall can name something else. That''s because Java doesn''t
    have a predetermined name for the word Prime. In your program, you can make Prime
    stand for the Federal Reserve''s prime rate. And the guy down the hall can make
    Prime stand for the "bread, roll, preserves, and rib." A conflict doesn''t arise
    because you and your co-worker are writing two different Java programs.


    +   Identifiers from the API: The JCP members have created names for many things
    and there least 3,000 of these names into the Java API. The API comes with each
    version of Java, so these names are available to anyone who writes a Java program.
    Examples of such names are String, Integer, J, JButton, JTextField.


