    The program in Listing 4-6 uses two reference types. These types are defined in
    the Java API. One of the types (the one that you''ll use all the time) is called
    String. The other type (the one that you use to create GUIs) is called JFrame.


    A String is a bunch of characters. It''s like having several char values in a
    row. So the myTitle variable declared to be of type String, assigning "Blank Frame"
    to the myTitle variable makes sense in Listing 4-6. The String class is declared
    in the Java API.


    In a program, double quote surrounds the letters in a String literal.


    A JFrame is like a window. The only difference is that you call it a JFrame instead
    of a window. To Keeping Listing 4-6 short and sweet, I decided not to put anything
    in my frame — no buttons, no fields, nothing.


    Even with a completely empty frame, Listing 4-6 uses tricks that I don''t describe
    until later in this. So don''t try reading and interpreting every word of Listing
    4-6. The big thing to get from Listing 4-6 is that the program has two variables.
    In writing the program, I made up two variables — myTitle and myFrame. According
    to the declarations, myTitle is of type String, and myFrame is of type JFrame.


    You can look up String and JFrame in Java''s API documentation, but before you
    do, I can tell you what you''ll find. You''ll find that String and JFrame are
    the names of Java classes. So, that''s the big news. Every class is the name of
    a reference type. You can reserve amountInAccount for double values by writing


