  md: '# Chapter 7: Thinking in Terms of Classes and Objects


    came along. But object-oriented programming involved a big shift in thinking.
    With object-oriented programming, each account can have a name, an address, a
    balance, and a way of being displayed.


    In object-oriented programming, each object has its own built functionality. An
    account knows how to display itself. A string can tell you whether it has the
    characters inside it as another string. A PrintStream instance, such as System.out,
    knows how to print. In object-oriented programming, each object has its own methods.
    These methods are little programs that you can have an account object do things
    (or for) itself.


    And why is this a good idea? It''s good because you''re making pieces of data
    take responsibility for themselves. With object-oriented programming, all the
    functionality''s associated with an account is collected inside the code for the
    Account class. Everything you have to know how a string is located in the file
    String.java Anything having to do with year numbers (whether they have two or
    digits, for instance) is handled inside the Year class. So, if anybody has problems
    with your Account class or your Year class, he or she knows just to look for all
    the code. That''s great!


    So imagine an enhanced account. In this new table, each object has built-in functionality.
    Each account knows how to display itself on the screen. Each row of the table
    has its own copy of a display method. Of course, you don''t need much imagination
    to picture this table. I just happen to have a table you can look at. It is Table
    7-2.


    | Table 7-2 Name | Address | Balance | Display |

    |---|---|---||}{

    | Barry Burd | 222 Cyberspace Lane | 24.02 | out.print. . . |

    | Jane Q. Public | 111 Consumer Street | 55.63 | out.print. . . |


    # An account that displays itself


    In Table 7-2, each account object has four — a name, an address, and a way of
    displaying itself on the screen. After you make the jump to object-oriented thinking,
    you''ll never turn back. A program that implements the ideas in Table 7-2 is shown
    in Listings 7-3 and 7-4.'
