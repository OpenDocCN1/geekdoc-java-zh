  md: '# Chapter 10: Putting Variables and Methods Where They Belong


    # Another way to beautify your numbers


    The last method in Listing 10-1 takes the value from the average variable (a player''s
    batting average), converts that value (normally of type double) into a String,
    and then sends that String value back to the method caller. The use of DecimalFormat,
    which comes right from the Java API (Application Programming Interface), makes
    sure that the String value looks like a base-ball player''s batting average. That
    is, the String value starts with lots of blank spaces, no digits to the left of
    the decimal point, and has exactly three digits to the right of the decimal point.
    (The blank spaces ensure a gap between the batting average and whatever text appears
    before it.)


    Java''s DecimalFormat class can be quite handy. For example, to display the values
    345 and -345 with an accounting-friendly format, you can use the following code:


    ```

    DecimalFormat decFormat =

    newDecimalFormat("####.00; ($####.00)");

    System.out.println(decFormat.format(345));

    System.out.println(decFormat.format(-345));

    ```


    In this example''s format string, everything before the semicolon dictates the
    way positive numbers are displayed, and everything after the semicolon determines
    the negative numbers are displayed. So with this format, the numbers 345 and -345
    appear as:


    ```

    $345.00

    ($345.00)

    ```


    To discover some other tricks with numbers, visit the DecimalFormat page of Java''s
    API documentation.


