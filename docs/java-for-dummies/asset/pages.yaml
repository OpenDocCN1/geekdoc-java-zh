  md: '# 108 Part II: Writing Your Own Java Programs


    ![](img/cd0a178910e21af6e9ed167dca0579cd_128_0.png)


    When you write if statements, you may be tempted to chuck all the curly braces
    out the window and just rely on indentation. Unfortunately, this seldom works.
    If you indent three statements after the word else and forget to enclose those
    statements in curly braces, the computer thinks that the else part includes only
    the first of the three statements. What''s worse, the indentation mislead you
    into believing that the else part includes all three statements. This makes it
    more difficult for you to figure out why your code isn''t behaving the way it
    should behave. So watch those braces!


    # Elseless in Ifrica


    Okay, so the title of this section is contrived. Big deal! The idea is that you
    can create an if statement without the else part. For instance, the code in Listing
    5-1. May''ve rather not rub the game. The modified code in Listing 5-2 shows you
    however in whenever to do this (and Figure 5-3 shows you the result).


    Listing 5-2: A Kinder, Gentler Guessing Game


    The if statement in Listing 5-2 has no else part. When inputNumber is the same
    as randomNumber, the computer prints You win. When inputNumber is different from
    randomNumber, the computer doesn''t print You win.'
