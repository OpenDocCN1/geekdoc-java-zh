  md: '# 268 Part IV: Savvy Java Techniques


    Each run of 11-4''s code writes a brand-new GuestList.txt file. If you use JCreator,
    you can easily monitor the changes to GuestList.txt. Keep GuestList.txt showing
    in JCreator''s Editor pane. After running the code in 11-4, switch to some other
    window on your screen (your Web browser), or to some other document in JCreator''s
    Editor pane. Return to the display of GuestList.txt in JCreator. Upon your, JCreator
    tells you that GuestList.txt has been modified. "Do you want to reload it?" "Yes,
    you can." Then JCreator displays the updated version of GuestList.txt.


    The code in 11-4 uses tricks from other chapters and sections of this book. The
    code''s only brand-new feature is the use of PrintStream to write to a disk file.
    Think about any example in this book that calls System.out.println, or their variants.
    What''s really going on when you call one of these methods?


    The thing called System.out is an object. The object is defined in the Java API.
    In fact, PrintStream is an instance of a class named java.io.PrintStream (or its
    close friends). Now each object created from the PrintStream class has methods
    named print and println. Just as each Account object in listing 7-3 has a display
    method, and just as the DecimalFormat object in listing 10-1 has a format method,
    the PrintStream object named out has print and println methods. When you call
    System.out.println, you''re calling a method that belongs to a PrintStream instance.


    Okay, so what of it? System.out always stands for some area on your computer screen.
    If you create your own PrintStream object and make that object refer to a disk
    file, then that PrintStream object refers to the disk file. When you call that
    object''s print method, you write text to your hard drive.


    So in 11-4, when you say


    ```

    PrintStream listOut =

    new PrintStream("GuestList.txt");


    listOut.print(guests[roomNumber]);

    listOut.print(" ");

    ```


    you''re telling Java to write text to a file on your hard drive — the GuestList.txt
    file.


    That''s how you update the count of guests staying in the hotel. When you call
    listOut.print for the number of guests in Room 3, you may print the number 5.
    So, between Figures 11-5 and 11-6, a number in the GuestList.txt file'
