    \n# # And Now, a Few Comments\n\nPeople gather around campfires to hear the old\
    \ legend about a programmer\nwhose laziness got her into trouble. To maintain\
    \ this programmer's anonym-\nity. I call her Jane Pro. Jane worked many months\
    \ to create the holy grail of\ncomputing — a program that thinks on its own. If\
    \ completed, this program\ncould work independently, learning new things without\
    \ human intervention.\nDay after day, after night, she labored to give the program\
    \ that spark of\nreative, independent thought.\n\nOne day, when she was almost\
    \ finished with the project, she received a dis-\nturbing piece of mail from her\
