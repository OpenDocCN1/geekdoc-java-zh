    code handles number 15 (number of hours worked) to the findPayment method. Compare
    this with the earlier call to findPaymentAmount — the call for the full-time employee
    in the first half of Listing 8-6. Between the two subclasses, FullTimeEmployee
    and PartTimeEmployee, are different findPaymentAmount methods. The two methods
    have two kinds of parameters methods.


