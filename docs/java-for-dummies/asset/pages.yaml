  md: '# Chapter 9: Constructing New Objects 217


    I describe the oddball case (in which a constructor looks like it''s being inherited)
    later in this chapter, in the section “The default constructor.”


    So the code in Listing 9-5 has four constructors. Each constructor has the name
    TemperatureNice, and each constructor has its own, uniquely identifiable parameter
    list. That''s the boring part. The interesting part is that each constructor makes
    a call to something named `super`, which is a Java keyword.


    In Listing 9-5, `super` stands for a constructor in the parent class.


    +   - The statement `super()` in Listing 9-5 calls the parameterless `Temperature()`
    constructor that''s in Listing 9-1. Parameterless constructor assigns `0.0` to
    the number variable and ScaleName.fahrenheit to the scale variable.

    - The statement `super(number, scale)` in Listing 9-5 calls the constructor `Temperature(double
    number, ScaleName scale)` in 9-1. In turn, the constructor assigns values to the
    number and scale variables.

    - In a similar way, the statements `super(number)` and `super(scale)` in Listing
    9-5 call constructors from Listing 9-1.


    The computer decides which of the `Temperature` class''s constructors is being
    called by looking at the parameter list after the word `super`. For instance,
    when the computer executes


    ```

    super(number, scale);

    ```


    From Listing 9-5, the computer says to itself, “The number and scale variables
    in parentheses have types `double` and `ScaleName`. But only one of the `Temperature`
    constructors in Listing 9-1 has two parameters with `double` and `ScaleName`.
    The constructor''s header looks like this:


    ```

    public Temperature(double number, ScaleName scale);

    ```


    So, I guess I''ll execute the statements inside that particular constructor.


