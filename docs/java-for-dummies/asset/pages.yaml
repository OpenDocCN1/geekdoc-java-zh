  md: '# Creating an array in two easy steps


    Once look again at the two lines that you can use to create an array:


    ```

    int guests[];

    guests = new int[10];

    ```


    Each line serves its own distinct purpose:


    +   **int guests[];** This first line is a declaration. The declaration reserves
    the array name (a name like guests) for use in the rest of the program. In the
    Java Motel metaphor, this line says, "I plan to build a motel and have a certain
    number of guests in each room." (See Figure 11-2)


    Never mind what the declaration `int guests` does. It''s more important to notice
    what the declaration `int guests[]` does. The declaration does not reserve ten
    memory locations. Indeed, a declaration like `int guests()` doesn''t really create
    an array. All the `guests` variable. At that point in the code, the `guests` vari-is
    still doesn''t refer to a real array. (In other words, the motel hasn''t built
    yet.)


    +   **guests = new int[10]:** This second line is an assignment statement. The
    assignment statement reserves space in the computer''s memory for ten `int` values.
    In terms of real estate, this line says, "I finally built the motel. Go ahead
    and put guests in each room." (Again, see Figure 11-2.)


    ![](img/cd0a178910e21af6e9ed167dca0579cd_280_0.png)'
