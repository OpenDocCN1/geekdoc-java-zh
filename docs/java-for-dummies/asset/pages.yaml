  md: '# Chapter 10: Putting Variables and Methods Where They Belong


    When you plop stuff onto frames, you have quite a bit of leeway with the order
    in which you do things. For instance, you can set the layout or after you''ve
    added labels and other stuff to the frame. If you call setLayout and then add
    labels, the labels appear in nice, orderly positions on the frame. If you reverse
    this order (add labels and then call setLayout), the calling of setLayout rearranges
    the labels in a nice, orderly fashion. It works fine either way.


    In setting up a frame, the one thing you shouldn''t do is violate the following-sequence:


    ```

    Add things to the frame, then

    pack();

    setVisible(true);

    ```


    If you call pack and add more things to the frame, the pack method doesn''t take
    the most recent things that you''ve added into consideration. If you call setVisible
    before you add or call pack, the user sees the frame as being constructed. Finally,
    if you forget to set the frame''s size (by calling pack or some other sizing method),
    the frame that you see like the one in Figure 10-4. (Normally, I wouldn''t show
