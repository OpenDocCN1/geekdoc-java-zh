  md: 'setDefaultCloseOperation: Calling setDefaultCloseOperation tells Java what
    do when you click the little x in the frame''s upper-right corner. Without this
    method call, the frame itself disappears, but the Java Virtual Machine (JVM) keeps
    running. If you use JCreator, to halt the JVM by choosing Tools:Stop Tool.


    Calling setDefaultCloseOperation [EXIT_ON_CLOSE] tells Java to shut down when
    you click the x in the frame''s upper-right corner. The alternatives to EXIT_ON_CLOSE
    are HIDE_ON_CLOSE, DISPOSE_ON_CLOSE, and my personal favorite, DO_NOTHING_ON_CLOSE.


    +   JButton: The JButton class lives in the javax.swing package. One of the class''s
    constructors takes a String instance (such as "Panic") for its parameter. Calling
    this constructor makes String instance into the label on the face of the new button.


    +   add: The new SimpleFrame object calls its add method. Calling the add method
    places the button on the object''s surface (in this case, the surface of the frame).


    +   setSize: The frame becomes 300 pixels wide and 100 pixels tall. (In the javax.swing
    package, whenever you specify two dimension numbers, the width number always comes
    before the height number.)


    +   setVisible: When it''s first created, a frame is invisible. But when the new
    frame calls setVisible(true), the frame appears on your computer screen.'
