    Listing 4-1: Using a Variable


    | amountInAccount = 50.22;

    amountInAccount = amountInAccount + 1000000.00;


    The code in Listing 4-1 makes the use of amountInAccount variable. A variable
    is a placeholder. You can stick a number like 50.22 into a variable. After you
    place a number in the variable, you can change its number and put a different
    number in the variable. (That varies in a variable.) Of course, when you put a
    number in a variable, the old number is no longer there. If you didn''t save the
    old number somewhere else, the old number is gone.


    Figure 4-1 gives before-and-after picture of the code in Listing 4-1. After the
    first statement in Listing 4-1 is executed, the variable amountInAccount has the
    number 50.22 in it. After, the second statement of Listing 4-1 is executed, amountInAccount
    suddenly has 1000050.22 in it. When you think about a variable, place a place
    in the computer''s memory where wires and transistors store that. In the left
    side of Figure 4-1, imagine that the box with the 50.22 in it is surrounded by
    millions of other such boxes.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_94_0.png)


    You now need some terminology. The thing stored in a variable is called a value.
    A variable''s value can change during the run of a program (when Meredith gives
    you a million bucks, for instance). The value that''s stored in a variable isn''t
    necessarily a variable. (You, for instance, create a variable that always stores
    a letter.) The kind of value that''s stored in a variable is a variable of type.


    You can read more about types in the section "Understanding the Types of Values
    That Variables May Have", later in this chapter.


    A subtle, almost undetectable difference exists between a variable and a variable''s
    name. In formal writing, I often use the word variable when I mean variable name.
    Strictly speaking, amountInAccount is a variable name, and the memory storage
    associated with amountInAccount (including the'
