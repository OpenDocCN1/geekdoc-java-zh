  md: "# 292 Part IV: Savvy Java Techniques\n\n+   - throw: Creates a new exception\
    \ object.\n- throws: Passes the buck from a method up to whatever code called\
    \ the method.\n- try: Encloses code that has the potential to create a new exception\
    \ object. In the usual scenario, the code inside a try clause contains calls to\
    \ methods whose code can create one or more exceptions.\n- catch: Deals with the\
    \ exception, buries it, and then moves on.\n\nSo, the truth is. Through some chain\
    \ of events like the one shown in Figure 12-2, the method Integer.parseInt can\
    \ throw a NumberFormatException. When you call Integer.parseInt, this NumberFormatException\
    \ is passed on to you.\n\nThe Java API (Application Programming Interface) documentation\
    \ for the parseInt method says, \"Throws: NumberFormatException — if the string\
    \ does not contain a parsable integer.\" Once in a while, reading the documentation\
    \ actually pays.\n\n![](img/cd0a178910e21af6e9ed167dca0579cd_312_0.png)\n\n```\n\
    void method1() {\n  try {\n    method2(); ⬅\n  } catch (Exception e) {\n}\n}\n\
    ```\n\n```\nvoid method2() throws Exception {\n  method3(); ⬅\n}\n```\n\n```\n\
    void method3() throws Exception {\n  method4(); ⬅\n}\n```\n\n```\nvoid method4()\
    \ throws Exception {\n  throw new Exception();\n}\n```"
