    Java has two different types that have digits beyond the decimal point: type double
    and float. So what''s the difference? When you declare a variable to be of double,
    you''re telling the computer to keep track of 64 bits when it stores the variable''s
    values. When you declare a variable to be of float, the computer keeps track of
    only 32 bits.


