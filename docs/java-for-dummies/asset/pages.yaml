    My guess is if you took a typical Java programmer and kept that from looking up
    anything in the API documentation, the programmer would be able to use less than
    2 percent of all the tools in the Java API.


    Sure, may you for the Dummies style. But unfortunately, Java''s official API documentation
    isn''t written for you. The API documentation is both concise and precise. For
    some help deciphering the API documentation''s language, and style, see this this
    Web site.


    In a way, nothing about the Java API is special. Whenever you create a Java program—even
    the smallest, Java program—you create a class that''s on par with any of the classes
    defined in the official Java API. The API is just a set of classes and other tools
    that were created by ordinary programmers who have to participate in the official
    JCP—the Java Community Process. Unlike the tools you create yourself, the tools
    in the API are distributed with every version of Java. (I''m assuming that you,
    the reader, are not a participant in the Java Community Process. But then, with
    a fine book like For Dummies, 4th Edition, ever known.)


    If you''re interested in the JCP''s activities, visit www.jcp.org.


    The folks at the JCP don''t keep the Java programs in the official Java API a
    secret. If you want, you can look at all these programs. When you install Java
    on your computer, the installation puts a file named src.zip on your hard drive.
    You can open src.zip with your favorite unzipping program. Before your eyes, is
    all the Java API code.


    # The words in a Java program


    A hard-core Javaatee will say that the Java programming language has two different
    kinds of words: keywords and identifiers. This is true. But the bare truth, without
    any other explanation, is sometimes misleading. So I recommend dressing the truth
    bit and thinking in three kinds of words: keywords, identifiers that ordinary
    programmers like you and me create, and identifiers from


    The differences between these three kinds of words are similar to the differences
    among words in the English language. In the sentence "Sam is a person," the word
    person is like a Java keyword. No matter who uses the word, it always means roughly
    the same thing. (Sure, you can think of bizarre exceptions in English usage, but
    please don''t.)'
