  md: "# Part III: Working with the Picture: Object-Oriented Programming\n\n# What's\
    \ this all about?\n\nSuppose your code contains a constructor — the first of two\
    \ constructors in Listing 9-4. The whatever variable is passed a number like 32.0,\
    \ then the first statement in the constructor's body assigns value, 32.0, to the\
    \ new object's variable. The code works. But in writing this, you had to make\
    \ up a new number for a parameter- whatever. And the only purpose for this new\
    \ name is to hold a value for the object's variable. To distinguish between the\
    \ parameter and the number variable, you gave a name something that was just memory\
    \ storage for the number value.\n\nI picked a confusing misspelling of the original\
    \ variable name. (I'd name the parameter something like numr or number.) I've\
    \ also tried changing a variable name's capitalization to come up with a parameter\
    \ name. (I use parameter names like Like or Number.) In Chapter 8, I name all\
