  md: "# 270 Part IV: Savvy Java Techniques\n\n![](img/cd0a178910e21af6e9ed167dca0579cd_290_0.png)\n\
    \nListing 11-5 shows the code that describes the Room class. As promised, each\
    \ instance of the Room class has three variables: the guests, rate, and smoking\
    \ variables. (A false value for the boolean variable, smoking, indicates a non-smoking\
    \ room.) In addition, the entire Room class has a static variable named currency.\
    \ This currency object makes rooms look like dollar amounts.\n\nTo find out what\
    \ static means, see Chapter 10.\n\n# Listing 11-5: So This is What a Room Looks\
    \ Like!\n\n```\nimport static java.lang.System.out;\nimport java.util.Scanner;\n\
    import java.text.NumberFormat;\n\nclass Room {\n    private int guests;\n    private\
    \ double rate;\n    private boolean smoking;\n    private static NumberFormat\
    \ currency = NumberFormat.getCurrencyInstance();\n\n    public void readRoom(Scanner\
    \ diskScanner) {\n        guests = diskScanner.nextInt();\n        rate = diskScanner.nextDouble();\n\
    \        smoking = diskScanner.nextBoolean();\n    }\n\n    public void writeRoom()\
    \ {\n        out.print(guests);\n        out.print(\"\\t\");\n        out.print(currency.format(rate));\n\
