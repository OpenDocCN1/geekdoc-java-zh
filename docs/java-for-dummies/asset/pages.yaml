    # # Foolish Assumptions


    In this book, I make a few assumptions about you, the reader. If one of these

    assumptions is incorrect, you''re probably okay. If all these assumptions are

    incorrect ... well, buy the book anyway.


    +   - I assume that you have access to a computer. Here''s the good news:

    You can run the code in this book on almost any computer. The only

    computers that you can use to run this code are ancient things that are

    more than six years old (give or take a few years).


    +   - I assume that you can navigate through your computer''s common

    menus and dialog boxes. You don''t have to be a Windows, Unix, or

    Macintosh power user, but you should be able to start a program, find a

    file, put it into a certain directory ... that sort of. Most of the

    time, when you practice the stuff in this book, you''re typing on

    your keyboard, not pointing and clicking your mouse.


    On these occasions when you need to drag, cut, and paste,

    or plug or play, I guide you carefully through the steps. Your com-

    puter be configured in any of several billion ways, and my instructions

    may quite fit your special situation. So, when you reach one of these

    personal-specific tasks, try following the steps in this book. If the steps

    don''t fit, consult a book with instructions tailored to your system.


    +   - I assume that you can think logically. That''s all there is to programming

    in Java — thinking logically. If you can think logically, you''ve got it.

    If you don''t believe that you can think logically, read on. You will be

    asantly surprised.


    +   - I make very few assumptions about your computer programming

    experience (or your lack of such experience). In writing this book, I

    tried to do the impossible. I''ve tried to make the book interesting for

    experienced programmers, yet accessible to people with little or no-

    programming experience. This means that I don''t assume any particular

