  md: '# 336 Java For Dummies, 4th Edition


    # Jindent


    Trial version


    Platform independent. When it comes to writing code, beauty is more than skin
    deep. An ugly program is hard to read. If anything goes wrong, no one, not even
    the program''s author, can wade through lines and lines of cryptic, poorly formatted
    classes and methods.


    To make code look good, you can follow some clear, uniform style guidelines. Always
    indent by a certain number of spaces, always arrange curly braces a certain way,
    always do this, never do that. You can memorize lots of rules, or you can have
    software do it for you.


    So write code any way that want. Then hand your code to Jindent. The Jindent beautifies
    your code, making it easier to read, easier to understand, and (yes!) cheaper
    to maintain.


    For more information, visit www.jindent.com.


    # NetCaptor


    Freeware version


    For Windows. NetCaptor uses tabs to keep track of several open Web pages. These
    tabs replace the need to open several browser windows. Sure, lots of Web browsers
    use tabs, but NetCaptor is my favorite. When I visit a search engine. I keep the
    results page open while I investigate some of the page''s entries. When I do Java
    development, I keep the API documentation open while I use one or more of my own
    documents.


    For more information, visit www.netcaptor.com.


    # WinOne


    Evaluation


    For Windows. If you use Windows, and you''re a real geek, you know how clumsy
    MS-DOS can be. The years I''ve wasted retyping commands is dwarfed only by the
    time that I''ve spent drilling for items in deeply-nested menus and Explorer trees.
    To make your life simpler, try WinOne. The WinOne shell is'
  merge: -1
  pgno: 356
- img_proc: true
  md: '# Appendix A: Using the CD-ROM


    like the built-in Windows command prompt. But WinOne has multicolored text, smart
    filename completion, a scroll bar, command grouping, smart delete, macros, command
    history, extended batch commands, and (best of all) delightfully easy access to
    directories.


    For more information on WinOne, visit www.winone.com.au.


    # And, If You Run into Any Trouble . . .


    I tried to find shareware programs that work on most computers with the minimum
    system requirements. Alas, your computer may differ, and some programs may not
    work properly for some reason.


    If you have problems with the shareware on this CD-ROM, the two likeliest problems
    are that you don''t have enough memory (RAM) or that you have other programs running
    are affecting installation or running of a program. If you get an error message
    such as Not enough memory or Setup cannot continue, try one or more of the following
    suggestions and then using the following again:


    +   Turn off any antivirus software running on your computer. Installation programs
    sometimes mimic virus activity and may make your computer incorrectly believe
    that a virus is infecting it.


    +   Close all running programs. The programs that you have running, the less memory
    is available to other programs. Installation programs typically update files and
    programs. If you keep other programs running, installation may not work properly.


    +   Have your local computer store add more RAM to your computer. This is, admittedly,
    a drastic and somewhat expensive step. However, adding more memory can really
    help the speed of your computer and allow more programs to run at the same time.


    If you still have trouble installing the items from the CD, please call the Wiley
    Publishing, Inc. Customer Service phone number at 800-762-2974 (outside the U.S.:317-572-3993)
    or send an e-mail to the address of your choice: JavaForDummies@BurdBrain.com
    or techsupdum@wiley.com.'
