  md: '# Chapter 7: Thinking in Terms of Classes and Objects


    # Compiling and Running More Than One Class


    Each program in Chapters 3 to 6 consists of a single class. That’s great for a
    book’s introductory chapters. But in real life, a typical program consists of
    hundreds or even thousands of classes. The program that spans Listings 7-1 and
    7-2 consists of two classes. Sure, having two classes isn''t like having thousands
    of classes, but it''s a step in that direction.


    In practice, most programmers put each class in a file of its own. When you create
    a program like the one in Listings 7-1 and 7-2, you create two files on your computer’s
    hard drive. So the code that comes from this book’s CD-ROM has two separate files
    — Account.java and UseAccount.java. (See Figure 7-4).


    ![](img/cd0a178910e21af6e9ed167dca0579cd_171_0.png)


    To run the code, just do you do to run any old single-file program?


    +   - Open the Chapter07 workspace.

    - Set Listings:0701-02 as the active project.

    - Choose Build:Compile Project.

    - Choose Build:Execute Project.


    For details on compiling and running code that is copied from the CD-ROM, see
    Chapter 2.


    Creating a new program with two or more classes is also pretty easy. (All you
    have to do flip back and forth a million times between this chapter and Chapter
    3.)


    +   - Follow Steps 1 through 7 in the “Typing Your Own Code” section of Chapter
    3.


    With these steps, you create a new project.'
