    # Yet another way to beautify your numbers


    You can make numbers look nice in plenty of ways. For instance, Listing 7-7 uses
    printf and Listing 10-1 uses a DecimalFormat. But for, in Listing 11-5, I display
    a currency amount. I use the NumberFormat class with its CurrencyInstance method.


    If you compare the formatting statements in Listings 10-1 and 11-5, you don''t
    see much difference.


    +   One list uses a constructor; the other list get CurrencyInstance.


    The getCurrencyInstance method is a good example of what''s called a factory method.
    A factory method is a convenient tool for creating many objects. People all need
    code that displays amounts. The getCurrencyInstance method creates a dollar format
    without forcing you to write new DecimalFormat ($###.00; ($#.00)).


    Like a constructor, a factory method returns a brand-new object. Unlike a constructor,
    a factory method has no special status. When you create a factory method, you
    can name it anything you want. When you call a factory method, you don''t use
    the keyword new.


    +   One list uses DecimalFormat; the other list uses NumberFormat.


    A decimal number is a certain kind of number. (In fact, a decimal number is written
    in the base-10 system.) Accordingly, the DecimalFormat class is a subclass of
    the NumberFormat class. The DecimalFormat is more specific, so for most purposes,
    I use DecimalFormat. But it''s harder to use the DecimalFormat class''s getCurrencyInstance.
    For programs that involve money, I tend to use NumberFormat.


    +   Both listings use format methods.


    In the end, you just write something like currency.format(rate) or decFormat.format(average).
    After that, Java does the work for you.'
