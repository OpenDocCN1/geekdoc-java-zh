    # Understanding the Types of Values

    That Variables May Have


    Have you seen the TV commercials that make you think you''re flying around the
    circuits inside a computer? Pretty cool, eh? These commercials show 0s (zeros)
    and 1s because 0s and 1s are the only things that computers can really deal with.
    When you think a computer is storing the letter J, the computer is really storing
    01001010. Everything inside the computer is a sequence of 0s and 1s. As every
    computer knows, a 0 or 1 is called a bit.


    As turns out, the sequence 01001010 which stands for the letter J, can also stand
    for the number 74. The same sequence can also stand for 1.036908630063646×10⁻⁴.
    In fact, the bits are interpreted as screen pixels, the same sequence can be used
    to represent the dots in Figure 4-2. The meaning of 01001010 depends on the way
    the software interprets 0s and 1s.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_96_1.png)


    How do you tell the computer what 01001010 stands for? The answer is in the concept
    of type. The type of a variable is the range of values that the variable is permitted
    to store.'
