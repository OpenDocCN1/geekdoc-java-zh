    +   **When computers do work, they feel no resistance, stress, no boredom, and
    no fatigue.** Computers are our electronic slaves. I have my computer working
    24/7 doing calculations for SETI@home — the search for extraterrestrial intelligence.
    Do I feel sorry my computer because it''s working hard? Does the computer complain?
    Will the computer report me to the National Labor Relations Board? No.


    I can make demands, give the computer orders, and crack the whip.

    Do I (or should) feel the least bit guilty? Not at the time.


    +   **Computers move ideas, not paper.** Not long ago, when you wanted to send
    a message to someone, you hired a messenger. The messenger went on his or her
    horse and delivered your message personally. The message was on paper, parchment,
    a clay tablet, or whatever physical was available at the time.


    This whole process seems wasteful, but that''s because you and I are sitting comfortably
    at the dawn of the electronic age. The thing is that messages are ideas. Physical
    things like ink, paper and horses have little or nothing to do with real ideas.
    These physical things are just carriers for ideas (temporary because people used
    them to carry ideas for several centuries). But, in truth, the ideas themselves
    are paperless, horseless, and messengerless.


    So the neat thing about computers is that they carry ideas efficiently. They carry
    nothing but the ideas, a couple of photons, and a little electrical power. They
    do this with no muss, no fuss, and no extra physical baggage..'
