  md: '# Chapter 8


    # # Saving Time and Money:

    Reusing Existing Code


    In This Chapter


    +   - Adding new life to old code

    - Tweaking your code

    - Making changes without spending a fortune


    Once upon a time, there was a beautiful princess. When the princess turned 25
    (the optimal age for strength, good looks, and fine moral character), her kind
    father brought her a gift in a lovely golden box. Anxious to know what was in
    the box, the princess ripped off the golden wrapping paper.


    When the box was finally opened, the princess was thrilled. To her surprise, her
    father had given her what she had always wanted — a computer program that always
    ran correctly. The program did everything the princess wanted and did it all the
    way she wanted it to be. The princess was happy, and so was her kind, old father.


    As time went on, the computer program never failed. For years on end, the princess
    changed her needs, expected more out of life, making demands, expanded her career,
    reached for more and more fulfillment, judged the desires of her husband and her
    kids, stretched the budget, and sought peace within her soul. Through all this,
    the program remained steady, faithful companion.


    As the princess grew old, the program became old along with her. One evening,
    as she sat by the fireside, she posed a daunting question to the program. "How
    do you do it?" she asked. "How do you manage to keep giving the right answers,
    time after time, year after year?"'
