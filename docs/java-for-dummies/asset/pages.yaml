    attempt to loop through all the dir values fails. You get a big NullPointerException,
    and the program comes crashing around you.


    To avoid this kind of calamity, check Java''s API documentation. If you''re calling
    a method that can return null, exception-handling code to your program.


    For the story on handling exceptions, see Chapter 12. For some advice on reading
    the API documentation, see Chapter 3 and this book''s Web site.


    # Helping Java Find Its Files


    You''re compiling code, mind your own business, the computer finds you a NoClassFoundError.
    All kinds of things can be going wrong, but chances are that the computer can''t
    find a particular Java file. To fix this, you must align all the planets correctly.


    +   - Your directory has to contain all the Java files whose names are used in
    your code.

    - If you named packages, your project directory has to have appropriately named
    subdirectories.

    - Your CLSPATH must be set properly.


    For specific guidelines, see Chapter 15 (on the CD-ROM) and this book''s Web site.'
