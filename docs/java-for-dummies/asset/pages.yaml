    In Listing 5-3, the myScanner.next() grabs whatever word the user types on the
    computer keyboard. The code shows this word into the variable-named password.
    The program''s if statements use de-fact-two different techniques to compare password
    with "swordfish".


    The more appropriate of the two techniques uses Java''s equals method. The equals
    method looks funny when you call it a dot after one string and put the other in
    parentheses. But that''s the way you have to do it.


    In Java''s equals method, it doesn''t matter what string gets dot and gets the
    parentheses. For instance, in Listing 5-3, you could have written


    ```

    if ("swordfish",equals(password))

    ```


    The method would work just as well.


    A call to a''equals method looks imbalanced, but it''s not. There''s a reason
    behind the apparent imbalance between the two objects and the parentheses. The
    idea is that you have two objects: the password object and the "swordfish" object.
    Each of these two objects is of type String. (However, password is a variable
    of type String, and "swordfish" is a String literal.) When you write password.equals("swordfish"),
    you''re calling an equals method that belongs to the password object. As you call
    method, you''re feeding "swordfish" to the method as the method''s parameter (pun
    intended).


    You can read more about methods belonging to objects in Chapter 7.


    When comparing strings with one another, use the equals method — not the double
    equals sign.'
