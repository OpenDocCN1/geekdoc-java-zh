  md: "# Part IV: Savvy Java Techniques\n\n# Our friends, the good exceptions\n\n\
    A rumor is going around that Java exceptions always come from unwanted, erroneous\
    \ situations. Although there's some truth to this rumor, the rumor isn't entirely\
    \ accurate. Occasionally, an exception arises from a normal, expected occurrence.\
    \ Take, for instance, the detection of the end of a file. The following code makes\
    \ a copy of a file:\n\n```\ntry {\n    while (true) {\n        dataOut.writeByte(dataIn.readByte());\n\
    \    }\n} catch (EOFException) {\n    numFilesCopied = 1;\n}\n```\n\nCopy bytes\
    \ from dataIn to dataOut, you just go into a while loop. With its true condition,\
    \ the while loop is seemingly endless. But eventually, you reach the end of the\
    \ dataIn file. When this happens, the read method throws an EOFException (an end-of-file\
    \ exception). The throwing of this exception sends the computer out of the try\
    \ clause and out of the while loop. From there, you do whatever you want to do\
    \ in the catch clause, and then proceed with normal processing.\n\n# Handle an\
    \ Exception or Pass the Buck\n\nSo you're getting to know Java, hey? What? You\
    \ say you're all the way up to Chapter 12?\n\nI'm impressed. You must be a harder\
    \ worker. But remember, all work and play. . . .\n\nSo, how about taking a break?\
    \ A little nap could do a world of good. Is ten seconds okay? Or is that too long?\
    \ Better make it five seconds.\n\nListing 12-8 has a program that's supposed to\
    \ pause its execution for five seconds. The problem is that the program in Listing\
    \ 12-8 is incorrect. Take a look at Listing 12-8 for a minute, and then I'll tell\
    \ you what's wrong with it."
