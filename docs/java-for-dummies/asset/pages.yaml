    # Four ways to store whole numbers


    Java has four different types of whole numbers. The types are called byte, short,
    int, and long. Unlike the complicated story about the accuracy of types float
    and double, the only thing that matters when you choose the whole number types
    is the size of the number you''re trying. If you want to use numbers larger than
    127, don''t use byte.


    To store numbers larger than 32767, don''t use short. Most of the time, you''ll
    use int. But if you need to store numbers larger than 2147483647, for sake in
    favor of long. (A long number can be as big as 922337203685477807.) For the whole
    story, see Table 4-1.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_102_0.png)


    At the core of the Brickchenbacker elevator problem, you''ve got whole numbers
    — no digits beyond the decimal point. When you divide 140 by 150, you get 9%,
    but you shouldn''t take the ‰ seriously. No matter how hard you try, you can''t
    squeeze an extra 50 pounds without Brickchenbacker duplicating the elevator. This
    fact is reflected in Java. In Listing 4-3, all variables (weightAPerson, elevatorWeightLimit,
    and numberOfPeople) are of type int. An value is a whole number. When you divide
    one int value by another (as you do with the slash in Listing 4-3), you get another
    int. When you divide 1,400 by 150, you get 9 — not 9% see this in Figure 4-4.
    Together, the following statements put the number 9 on your computer:


    ```

    numberOfPeople =\ elevatorWeightLimit / weightAPerson;


    print(numberOfPeople);

    ```


    # Combining Declarations and Initializing Variables


    Look back at Listing 4-3. In listing, you see three variable declarations — one
    for each of the program''s three int variables. I could have the same thing with
    one declaration:


    ```

    int weightAPerson, elevatorWeightLimit, numberOfPeople;

    ```


    If we have completely different types, you can''t create both variables in the
    same declaration. For instance, to create an int variable named weightFred and
    a double variable named amountInFundsAccount, you need two separate variable declarations.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_102_1.png)'
