  md: "# 200 Part III: Working with the Big Picture: Object-Oriented Programming\n\
    \n+   - Well, you can dig right into the PartTimeEmployee class code, make a few\
    \ changes, and hope for the best. (Not a good idea!)\n- You can follow the previous\
    \ section's advice and create a subclass of the existing PartTimeEmployee class.\
    \ \"But wait,\" you say. \"The existing PartTimeEmployee class already has a findPaymentAmount\
    \ method. Do I need some trick of bypassing this findPaymentAmount method for\
    \ each double-pay-for-overtime employee?\"\n- At this point, you can thank your\
    \ lucky stars that you are doing object-oriented programming in Java. With object-oriented\
    \ programming, you can create a subclass that overrides the functionality of its\
    \ parent class. Listing 8-8 has just such a subclass.\n\n# Listing 8-8: Another\
    \ Subclass\n\n```\nclass PartTimeWithOver extends PartTimeEmployee (\n    public\
    \ double findPaymentAmount(int hours) (\n        if(hours <= 40) {\n         \
    \   return getHourlyRate() * hours;\n        } else {\n            return getHourlyRate()\
    \ * 40 +\n                   getHourlyRate() * 2 * (hours - 40);\n        }\n\
    \    )\n)\n```\n\nFigure 8-8 shows the relationship between the code in Listing\
    \ 8-8 and other pieces of code in this chapter. In particular, PartTimeWithOver\
    \ is a subclass of a subclass. In object-oriented programming, a chain of this\
    \ kind is not the least unusual. In fact, as subclasses go, this chain is rather\
    \ short.\n\nThe PartTimeWithOver class extends the PartTimeEmployee class, but\
    \ PartTimeWithOver picks and chooses what it wants to inherit from the PartTimeEmployee\
    \ class. Because PartTimeWithOver has its own declaration for the findPaymentAmount\
    \ method, the PartTimeWithOver class doesn't inherit a findPaymentAmount method\
    \ from its parent. (See Figure 8-11)."
