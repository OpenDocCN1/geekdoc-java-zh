  md: '# Chapter 7: Thinking in Terms of Classes and Objects


    # # Returning a value from

    the getHeight method


    When the getHeight is called, the method executes the one statement that''s in
    the method''s body: a return statement. The return statement computes the value
    of balance * percentageRate / 100.0. If balance happens to be 24.02, and percentageRate
    is 5.00, the value of the expression is 1.201 — around 1.20. Because the computer
    works exclusively with 0s and 1s, the computer gets this number wrong by ever
    so tiny amount. The computer gets 1.2009999999999998. That''s just some-thing
    that has to live with.


    Anyway, after this value is calculated, the computer executes the return, which
    sends the value back to the place in main where getHeight was called. At that
    point in the process, the method call — myAccount.getInterest(5.00) — takes the
    value 1.2009999999999998. The call itself is inside a println:


    ```

    out.println(myAccount.getInterest(5.00));

    ```


    So the println ends up with the following meaning:


    ```

    out.println(1.2009999999999998);

    ```


    The whole process, in which a value is passed back to the method call, is illustrated
    in Figure 7-9.


    If a method returns anything, a call to the method is an expression with a value.
    That value can be printed, assigned to a variable, added to something else, or
    whatever. Anything you can do with any other kind of value, you can do with a
    method call.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_181_0.png)


    | double getInterest(double percentageRate) { |

    | return balance * percentageRate / 100.0; |

    | } |

    | Account out.println(myAccount.getInterest(5.00)); |'
