  md: '# 46 Part I: Getting Started


    The Java programming language has all the aspects of a spoken language English.
    Java has words, grammar, commonly used names, stylistic idioms, and other such
    things.


    # The grammar and the common names


    The people at Sun Microsystems created Java thought of as coming in two parts.
    Just as English has its grammar and commonly used names, the Java programming
    language has its specification (its grammar) and its Application Programming Interface
    (its commonly used names). Whenever I write programs, I keep two important pieces
    of documentation — one each part of the language — on my desk:


    +   * The Language Specification: Always put an open parenthesis after the word
    for” and “Use an asterisk to multiply two numbers."


    +   * The Application Programming Interface: Java Application Programming Interface
    (API) contains thousands of tools that were added to Java after the language was
    defined. These tools range from commonplace to exotic. For instance, the tools
    include a routine named JFrame displays a window on your computer screen. Other
    tools listen for the user''s buttons, click query databases, and all- kind of
    useful things.


    You can download the Language Specification, the API documents, and all the other
    Java documentation (or view the documents online) by poking around a moving target.
    java.com/javase/downloads. But watch watch out! This Web page is probably out
    of date. The safest thing to do is to start at java.com, and then look for links
    to things like “Java SE” and “documentation."


    The first part of Java — the Language Specification, is relatively small. That
    doesn''t mean you won''t plenty of time figuring out how to use the rules in the
    Language Specification. Other programming languages, however, have double, triple,
    or ten times the number of rules.


    The second part of Java — the API — can be intimidating because it''s large. The
    APIs contain at least 3,000 tools and keeps growing with each new Java release.
    Pretty scary, eh? The good news is that you don''t have to memorize everything
    in the API. None of it is. You can look up the stuff you need to use in the documentation
    and ignore the stuff you don''t need. What you use often, you''ll remember. What
    you don''t use often, you''ll forget (like any other programmer).


    For information on how to find things in Java''s API documentation, see the section
    entitled “Finding javadoc pages” later in this chapter.


