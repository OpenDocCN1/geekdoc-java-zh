    # Using comments to experiment with your code


    You may hear programmers talk about commenting certain parts of their code. When
    you are writing a program and something''s not working correctly, it often helps
    to try removing some of the code. If nothing else, you find out what happens when
    suspicious code is removed. O course, you may find what happens when the code
    is removed, so you don''t want to delete the code completely. Instead, you turn
    your ordinary Java statements into comments. For instance, you turn the statement


    ```

    System.out.println("I love Java!")

    ```


    into the comment


    ```

    // System.out.println("I love Java!")

    ```


    This keeps the Java compiler from seeing the code while you figure out what''s
    wrong with your program.


    Traditional comments aren''t very useful for commenting code. The big problem
    is that you can''t put one traditional comment inside of another. For instance,
    suppose you want to comment out the following statements:


    ```

    System.out.println("Parents,");

    System.out.println("pick your you");

    /*

    * Intentionally displays on four separate lines

    */

    System.out.println("battles");

    System.out.println("carefully!");

    ```


    If you try to turn this code into one traditional comment, you get the following
    mess:


    ```

    /*

    System.out.println("Parents,");

    System.out.println("pick your you");

    /*

    * Intentionally displays on four separate lines

    */

    System.out.println("battles");

    System.out.println("carefully!");

    */

    ```'
