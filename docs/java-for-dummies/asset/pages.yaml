  md: '# 332 Java For Dummies, 4th Edition


    Your browser opens, and the license agreement appears. If you don''t have a browser,
    Microsoft Internet Explorer is included on the CD.


    +   4. Read through the license agreement, nod your head, and click the Agree
    button if you want to use the CD.


    After you click Agree, you are taken to the Main menu, where you can browse through
    the contents of the CD.


    +   5. To navigate the interface, click a topic of interest to take you to an
