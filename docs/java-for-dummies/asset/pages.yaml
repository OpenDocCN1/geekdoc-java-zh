  md: '# Chapter 11: Using Arrays and Collections to Juggle Values 259


    In the lingo of this chapter, the entire row of rooms is called an array. Each
    room in the array is called a component of the array (also known as an array element).
    Each component has two numbers associated with it:


    +   - The room (a number from 0 to 9), which is called an index of the array

    - A number of guests, which is a value stored in a component of the array


    Using an array saves you from the repetitive nonsense shown at the beginning of
    this section. For instance, to declare an array with ten values in it, you can
    write one fairly short statement:


    ```

    int guests[] = new int[10];

    ```


    If you''re especially verbose, you can expand this statement so that it becomes
    two separate statements:


    ```

    int guests[];

    guessts = new int[10];

    ```


    In either of these code snippets, notice the use of the number 10. This number
    tells the computer to make guests ten components. Each component of the array
    has a name of its own. The starting component is named guests[0], the next is
    guests[1], and so on. The last of the ten components is named guests[9].


    In creating an array, you always specify the number of components. The array''s
    indices start with 0 and the number''s one less than the total number of components.


    The snippets I show give you two ways to create an array. The first way uses two
    lines. The second way uses one line route, you can put that line inside or outside
    a method. The choice is yours. On the other hand, if you use two separate lines,
    the second line, guests new int[10], should be inside a method.


    In an array declaration, you can put the square brackets before or after the variable
    name. In other words, you can write int guests[] or int[] guests. The computer
    creates the same guests variable no matter which form you use.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_279_0.png)'
