  md: '# 98 Part II: Writing Your Java Programs


    chances) to type the variable name incorrectly. With simple expressions like numberOfBunnies++,
    these advantages hardly make a difference. But with more complicated expressions,
    like inventoryItems[(quantityReceived--itemsPerBox+17)]++, the efficiency and
    accuracy that you gain by using ++ and -- are significant.


    # Statements and expressions


    You can describe the pre- and postdecrement operators in two ways: the way everyone
    understands them and the right way. The way that I explain the concept in most
    of this story (in terms of time, with *before* and *after*) is the way that everyone
    understands it. Unfortunately, the way one understands isn''t really the


    First, remember that a statement tells the computer to do something, and an expression
    has a value. (I discuss statements in Chapter 3, and I describe expressions elsewhere
    in this chapter.) Which category does numberOfBunnies++ to belong to? The surprising
    answer is both. The Java code `numberOfBunnies++` is both a statement and an expression.


    Assume that, the computer executes the code `out.println(numberOfBunnies);`, the
    value of `numberOfBunnies` is 28.


    +   - As a statement, numberOfBunnies++ tells the computer to add 1 to `numberOfBunnies`


    +   - As an expression, the value of `numberOfBunnies++` is 29.


    So, even when the computer adds 1 to `numberOfBunnies`, the code `out.println(numberOfBunnies)`
    really means out.


    Now, almost everything you just read about numberOfBunnies++ is true about `++numberOfBunnies`.
    The only difference is that as an expression, `++numberOfBunnies` behaves in a
    more intuitive way.


    +   - As a statement, `++numberOfBunnies` tells the computer to add 1 to `numberOfBunnies`


    +   - As an expression, the value of `++numberOfBunnies` is 29.


    So, with `out.println(++numberOfBunnies)`, the computer adds 1 to the variable
    `numberOfBunnies`, and the code `out.println(++numberOfBunnies)` really means
    out.println(29).'
