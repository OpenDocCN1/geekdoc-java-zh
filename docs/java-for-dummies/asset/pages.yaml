    # Good programming


    When it comes to good programming practice, one word stands above all others —
    simplicity. When you''re writing complicated code, the last thing you want is
    to deal with somebody''s misnamed variables; convoluted solutions to problems;
    or clever, last-minute kludges. You want a clear interface that solves your own
    problems and no one''s.


    In the automatic teller scenario that I describe earlier, the big problem is that
    the machine''s design forces you to worry about other people''s concerns. When
    you should be thinking about getting money for lunch, while thinking instead about
    storage locations. Someone has to work out the teller machine''s engineering problems.
    But the banking customer isn''t the person to solve these problems.


    This section is about safety, not security. Safe code keeps you from making accidental
    programming errors. Secure code (a completely different story) keeps malicious
    hackers from damaging your intention.


    So this means that everything connected with every aspect of a computer program
    has be simple. Right? Well, no. That''s not right. Sometimes, to make things simple
    in the long run, you have to do lots of preparatory work up front. The people
    who built the automated teller machine worked to make sure that the machine is
    consumer-proof. The machine''s interface, with its screen messages and buttons,
    makes the machine very complicated, but carefully designed, device.


    The point is that making things look simple takes some planning. In the case of
    object-oriented programming, one of the ways to keep code outside a class from
    directly using variables inside the class. Take a peek at the code in Listing
    7-1. You''re working at a company that has just spent $10 million for the code
    in the Account class. (That''s more than a million and a half per line!) Your
    job is to write


    ```

    myAccount.name = "Barry Burd";

    ```


    but doing so would be getting you too far inside the Account class. After all,
    people who use an automatic teller machine aren''t allowed to


