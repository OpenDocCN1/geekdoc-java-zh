  md: "# Part III: Working with the Big Picture: Object-Oriented Programming\n\n#\
    \ Making numbers look good\n\nLooking back at Figure 7-5, you may be concerned\
    \ that the interest on my account is only $1.20099999999998. Seemingly, the bank\
    \ is cheating me out of 200-trillions of a cent. I should go straight ahead and\
    \ demand my fair interest. Maybe you and I should go together. We'll kick up some\
    \ for for that old bank and bust this scam right now. If my guess is correct,\
    \ this is part of a big salami scam. In a salami scam, someone has slices millions\
    \ of accounts. People don't notice their tiny losses, but the person doing the\
    \ shoveling enough for a quick escape to Barbados (or for a whole truck of salami).\n\
    \nWait, a minute! Nothing is motivating to you to come to the bank. Checking back\
    \ at Figure 7-5, I see that you're ahead of the game. According to my calculations,\
    \ the program overpays by 300-trillions of a cent. Between the two of us, we are\
    \ ahead by a hundred-trillion of a cent. What gives?\n\nWell, because computers\
    \ use 0s (zeros) and 1s and don't have an infinite amount of space to do calculations,\
    \ inaccuracies like the ones shown in Figure 7-5 are inevitable. The best that\
    \ you can do is display numbers in a more sensible fashion. You can round the\
    \ numbers and display only two digits beyond the decimal point, and some tools\
    \ from Java's API (Application Programming Interface) can help. The code is shown\
    \ in Listing 7-7, and the pleasant result is displayed in Figure 7-10.\n\n# Listing\
    \ 7-7: Making Your Numbers Look Right\n\n```\nimport java.lang.System;\nclass\
    \ UseAccount {\n    public static void main(String[] args[]) {\n        Account\
    \ myAccount = new Account();\n        Account yourAccount = new Account();\n\n\
    \        myAccount.balance = 24.02;\n        yourAccount.balance = 55.63;\n\n\
    \        double myInterest = myAccount.getInterest(5.00);\n        double yourInterest\
    \ = yourAccount.getInterest(7.00);\n\n        out.printf(\"$%4.2f\\n\", myInterest);\n\
    \        out.printf(\"$%5.2f\\n\", myInterest);\n        out.printf(\"$%2.2f\\\
    n\", myInterest);\n        out.printf(\"$%3.2f\\n\", myInterest);\n        out.printf(\"\
    $%.2f $%.2f\\n\", myInterest, \n               yourInterest);\n    );\n    }\n\
    }\n```"
