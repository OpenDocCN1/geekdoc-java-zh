  md: '# Chapter 3: Using the Basic Building Blocks


    The Java programming language has three different kinds of comments:


    +   - Traditional comments: The first five lines of Listing 3-6 form one traditional
    comment. The comment begins with /* and ends with /. Everything between the opening
    /* and the closing /* is for human eyes only. No information about "Java For Dummies"
    or Wiley Publishing, Inc. is translated by the compiler.


    To read about comments, see Chapter 2


    - The second, third, and fourth lines in Listing 3-6 have extra asterisks (*).
    I call them extra asterisks aren''t required when you create a comment. They just
    make the comment look pretty. I include them in Listing 3-6, for some reason that
    I don''t understand, most Java programmers add these extra asterisks.


    +   - End-line comments: The text //Changed to "I" is an end-of-line comment.
    An end-of-line comment starts with two slashes, and goes to the end of a line.
    Once again, no text inside the end-of-line comment gets translated by the compiler.


    +   - Javadoc comments: A Javadoc comment begins with a slash and two asterisks
    (**). Listing 3-6 has two javadoc comments — one with the Dispatcher class . and
    another with Execution of the program.


    A Javadoc comment is a special kind of traditional comment. A Javadoc comment
    is meant to be read by people who never even look at the Java code. But that doesn''t
    make sense. How can you see the javadoc comments in Listing 3-6 if you never look
    at Listing 3-6?


    Well, a program called javadoc (what else?) can find all the javadoc comments
    in Listing 3-6 and turn these into a nice-looking Web page. The page is shown
    in Figure 3-8.


    Javadoc comments are great. Here are several great things about them:


    +   - The only person who looks at a piece of Java code is the programmer who
    writes it. Other people who use the code can find out what the code does by viewing
    the automatically generated Web page.


    +   - Because other people don''t look at the Java code, other people don''t make
    changes to the Java code. (In other words, other people don''t introduce errors
    into the existing Java code.)


    +   - Because other people don''t look at the Java code, other people don''t have
    to decipher the inner workings of the Java code. All these people need to know
    about the code is what they read in the code''s Web page.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_81_0.png)'
