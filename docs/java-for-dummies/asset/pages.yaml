    # Freeware, Shareware, and Just Plain Ware


    The following sections provide a summary of the software and other goodies that
    you can find on the CD. If you need help installing the items provided on the
    CD, refer to the installation instructions in the preceding section.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_354_0.png)


    Shareware programs are fully functional, trial versions of copyrighted programs.
    If you like particular programs, register with their authors for a nominal fee
    and receive licenses, enhanced versions, and technical support. Freeware programs
    are free, copyrighted games, applications, and utilities. You can copy them to
    as many computers as you like — for free but they offer no technical support.
    GNU software is governed by its own license. The distribution of GNU software
    is not restricted. See the GNU license at the root of the CD for more details.
    Trial, demo, or evaluation versions of software are usually limited by time or
    functionality (such as not letting you save a project after you create it).


    # JCreator


    Special edition


    For Windows. When I started working on this book''s second edition, I went looking
    for the right Java development environment. I needed something that would satisfy
    all your needs:'
  merge: -1
  pgno: 354
- img_proc: true
  md: '# Appendix A: Using the CD-ROM 335


    +   - Easy to use: You want to use Java. You don''t want to memorize sands of
    ways to point and click.


    +   - Powerful: You want a scalable tool. As you write bigger and better programs,
    you want an environment that can support your growing, complex requirements.


    +   - Efficient: Memory hogs and CPU hogs need not apply.


    +   - Inexpensive: Hey, how about free?


    I found all these qualities in one only product: JCreator from Xinos Software.


    As if this list of demands wasn''t enough, I needed a company that could work
    with me to customize it tool. Based on the examples found in this book''s second
    edition, I had certain specialized needs. I wanted to change this default and
    change that option. I wanted to install my book''s code along with the development
    environment. Once again, the people at Xinos Software came through for me then
    - and came for me again when I updated my examples for the present edition.


    JCreator was a wonderful product for this book''s second edition and is equally
    wonderful for the fourth edition of Java For Dummies. I hope that you enjoy using
    it.


    For more information and a free trial of JCreator PRO, visit www.jcreator.com.


    # Adobe Acrobat Reader


    Commercial version


    For Windows and Mac. Talk about added value! This book has several extra chapters
    on its CD-ROM. To view these chapters, you need a program called Adobe Acrobat
    Reader. That''s no problem, because a free copy of Reader is on the CD-ROM.


    For more information, visit www.adobe.com/acrobat.


    If you''re on the road, and you need some light reading, just pull into a nearby
    cybercafe. You can find the extra chapters on this book''s Web site.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_355_0.png)'
