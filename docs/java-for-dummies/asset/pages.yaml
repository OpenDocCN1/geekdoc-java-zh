  md: '# Chapter 5: Controlling Program Flow with Decision-Making Statements


    # Importing everything in one fell swoop


    The first line of Listing 5-3 illustrates a lazy way of importing both System
    out and System. To import everything System has to offer, you use the asterisk
    wildcard character (*). In fact, importing java.lang.System.* is like having about
    30 separate import declarations, including System.out, System.nanoTime, and many
    other System things.


    The use of an asterisk in an import declaration is generally considered bad programming
    practice, so I don''t do it in this book''s examples. But for larger programs
    — programs that use dozens of names from the Java API — the wacky trick is handy.


    You can toss an asterisk anywhere you want inside an import declaration. For example,
    you can''t import everything with java by writing import java.* You can substitute
    an asterisk only for the name of a class or for the name of something static that''s
    tucked inside a class. For more information about import declarations, see Chapter
    9. For information about static things, see Chapter 10.


    # Java''s logical operators


    Mr. Spock would be pleased. Java has all the operators that you need for mixing
    and matching logical tests. The operators are shown in Table 5-2.


    | Table 5-2 | Logical Operators |

    | --- | --- |

    | Operator Symbol | Meaning | Example |

    | && | and | 5 < x && x < 10 |

    | || | or | x < 5 || 10 < x |

    | ! | not | !password.equals("swordfish") |


    You can use these operators to form all kinds of elaborate conditions. Listing
    5-4 has an example.


    Some runs of the program of Listing 5-4 are shown in Figure 5-5. When the username
    is oburd and the password is swordfish or when the username is hitter and the
    password is prestock, the user gets a nice message. Otherwise, the user is a bum
    who gets the nasty message that he or she deserves.'
