  md: "# 102 Part II: Writing Your Own Java Programs\n\n# Making Decisions (Java if\
    \ Statements)\n\nWhen you're writing computer programs, you're constantly hitting\
    \ forks in roads. Did the user correctly type his or her password? If yes, let\
    \ the user work, if no, kick the bum out. So the Java programming language needs\
    \ a way of making a program branch in one of two directions. Unfortunately, the\
    \ language has a way. It's called an if statement.\n\n# Guess the number\n\nThe\
    \ use of an if statement is illustrated in Listing 5-1. Two runs of the pro-gram\
    \ are shown in Figure 5-1.\n\n+   Listing 5-1: A Guessing Game\n\n```\nimport\
    \ static java.lang.System.out;\nimport java.util.Scanner;\nimport java.util.Random;\n\
    \nclass GuessingGame {\n    public static void main(String[] args[]) {\n     \
    \   Scanner myScanner = new Scanner(System.in);\n\n        out.print(\"Enter an\
    \ int from 1 to 10: \");\n\n        int inputNumber = myScanner.nextInt();\n \
    \       int randomNumber = new Random().nextInt(10) + 1;\n\n        if (inputNumber\
    \ == randomNumber) {\n            out.println(\"************\");\n           \
    \ out.println(\"You win.\");\n            out.println(\"************\");\n   \
    \     } else {\n            out.println(\"You lose.\");\n            out.print(\"\
    The random number was \");\n            out.println(randomNumber + \".\");\n \
    \       }\n\n        out.println(\"Thank you for playing.\");\n    }\n}\n```"
