  md: "# 310 Part IV: Savvy Java Techniques\n\nListing 12-10 (continued)\n\n```\n\
    out.print(\"Excuse me while I nap \");\nout.println(\"for just five seconds...\"\
    );\n\ntry {\n    takeNap();\n} catch (InterruptedException e) {\n    out.println(\"\
    Hey, who woke me up?\");\n}\n\nout.println(\"Ah, that was refreshing.\");\n\n\
    static void takeNap() throws InterruptedException {\n    sleep(5000);\n}\n```\n\
    \nFor a run of the code in Listing 12-10, refer to Figure 12-13. Once again, Figure\
    \ 12-13 fails to capture the true essence of the run, but that is okay. Remember\
    \ that in Figure 12-13, the computer pauses for five seconds before it displays\
    \ Ah, that was refreshing.\n\nThe important part of Listing 12-10 is in the takeNap\
    \ method header. That header ends with InterruptedException. By announcing that\
    \ it throws an InterruptedException, method takeNap passes the bus. What this\
    \ throws clause says is, \"I realize that inside this method has the potential\
    \ to throw an InterruptedException, but I'm not acknowledging the exception in\
    \ a try-catch statement. Java compiler, please don't bug me about this. Instead\
    \ of having a try-catch statement, I am passing the responsibility for acknowledging\
    \ the exception to the main method (the method that called the takeNap method).\n\
    \nIn this method, the call to takeNap is a try clause. That try clause has a catch\
    \ class with a parameter of type InterruptedException. Everything is okay. Method\
    \ takeNap passes the responsibility to the main method, and the main method accepts\
    \ the responsibility with an appropriate try-catch statement. Everybody's happy.\
    \ Even the Java compiler is happy.\n\nTo better understand the throws clause,\
    \ imagine a volleyball game in which the volleyball is on. When a player on the\
    \ other team serves, the player is throwing the exception. The ball crosses the\
    \ net and comes right to you. If you pound the ball back across the net, you're\
    \ catching the exception. But if you pass the ball to another player, you're using\
    \ the throws clause. In essence, you're saying, \"Here, other player. You deal\
    \ with this exception.\""
