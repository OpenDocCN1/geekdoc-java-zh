  md: '# 272 Part IV: Savvy Java Techniques


    Say what you want about the code in Listing 11-6. As far as I''m concerned, only
    one issue in the whole listing should concern you. And what, you ask, is that
    issue? Well, to create an array of objects, you have to do three things: make
    the array variable, make the array itself, and construct each object in the array.
    This is different from creating an array of int values or an array containing
    any other primitive type values. When you create an array of primitive type values,
    you do only the first two of these three.


    To help make sense of all this, follow along in Listing 11-6 and Figure 11-11
    as you read the following points.


    +   * **rooms[];** This declaration creates a rooms variable. This variable is
    destined to refer to an array (but does not refer to anything at all)

    * **rooms = new Room[10];** This statement reserves slots of storage in the computer''s
    memory. The statement also makes the rooms variable refer to the group of storage
    slots. Each slot is destined to refer to an object (but does not refer to anything
    at all)

    * **rooms[roomNum] = new Room();** This statement is inside a for loop. The statement
    is executed once for each of ten room numbers. For example, the first time through
    the loop, this statement says rooms[0] refer to an actual object (instance of
    the Room class).


