  md: '# Chapter 11: Using Arrays and Collections to Juggle Values 283


    One day, a brand-new customer shows up. Because your customers are stored in order
    (alphabetically by last name, numerically by Social Security number, whatever),
    you want to squeeze this customer into the correct component of your array. The
    trouble is that this customer belongs very early on in the array, at the customer
    with index 7. What happens next?


    You take the name in component number 824 and move it to component 825. Then you
    take the name in component 823 and move it to component 824. Take the name in
    component 822 and move it to component 823. You keep doing this until you''ve
    moved the name in component 7. Then you put the new customer''s name into component
    7. What a pain! Sure, the computer doesn''t complain. (If the computer has feelings,
    it probably likes this kind of busy work.) As you move around all these names,
    you waste processing time, you waste power, and you waste kinds of resources.


    "In my next life, I''ll leave three empty components between every two names."
    And of course, your business expands. Eventually you find that they aren''t enough.


    # Collection classes to the rescue


    The issues in the previous few paragraphs aren''t new. Computer scientists have
    been working on these issues for a long time. They haven''t discovered any magic
    one-size-fits-all solution, but they''ve discovered clever classes.


    The Java API has a bunch of classes known as collection classes. Each collection
    class''s methods use some clever tricks. For you, the bottom line is as follows:
    Collection classes deal as easily as possible with the issues raised in the previous
    paragraphs. If you''re writing code, and you know you have to deal with such issues,
    you can use these collection classes and call the classes'' methods. Instead of
    inserting a customer whose name belongs in position 7, you can just call a class''
    add method. The method inserts the name at a position of your choice, and deals
    reasonably with whatever ripple effects have to take place. In the best circumstances,
    the worst circumstances, you can rest assured that the code does everything the
    best way it can.


    # Using an ArrayList


    The most useful of Java''s collection classes is the ArrayList. Listing 11-8 shows
    you it works.'
