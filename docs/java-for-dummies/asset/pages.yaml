    either have to eat it (as you can see in Chapter 12) or use a throws clause to
    toss it to someone else. If you toss an exception with a throws clause, some-one
    is stuck with the exception just the way you were.


    The constructor in Listing 10-2 throws an IOException, but to whom is this exception
    thrown? Well, who in this code calls the bearer of responsibility for the problematic
    IOException? Well, who called the constructor in Listing 10-2? — That was the
    main method in Listing 10-3 — that who called the TeamFrame constructor throws
    hot potato to the main method in Listing 10-3, the main method has to deal with
    it. As shown in Listing 10-3, the main method deals with it by tossing the IOException
    (by having a throws clause of its own). That''s how the throws clause works in
    Java programs.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_256_0.png)


    If a method calls another method, and the called method has a throws clause, the
    calling method must contain code that deals with the exception. To find out more
    about dealing with exceptions, read Chapter 12.


    At this point in the book, the astute For Dummies reader may follow a question
    or two. "When a main method has a throws clause, someone else has to deal with
    the exception in that throws clause. But who called the main method? Who deals
    with the IOException in the throws clause of Listing 10-3? The answer is that
    the Java Virtual Machine (or, JVM, the thing that runs all your code) called the
    main method. In Listing 10-3 If the program has any trouble reading the Hankees.txt
    file, the responsibility ultimately falls on the JVM. The JVM takes care of things
    by displaying an error message and then ending the run of your program.


