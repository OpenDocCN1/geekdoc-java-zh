  md: '# Appendix A


    # Using the CD-ROM


    In This Appendix


    +   - Knowing system requirements

    - Installing software from the CD-ROM

    - Finding this book''s listings on the CD-ROM

    - Playing with the toys (that is, the software) on this CD-ROM

    - Troubleshooting


    Sure, you can read, read, read until your eyes bug out. But you won''t get to
    know Java until you write and run some code. Besides, it''s no fun to just read
    about programming. You''ve got to experiment, try things, make some mistakes,
    and discover some things on your own.


    This book''s CD-ROM has everything you need to get going interactively. First,
    read the little warning about all the legal consequences of breaking the seal
    on this book''s disc pack. Then, throw caution to the wind and rip that open.
    Put the CD-ROM in the drive, and you''re ready to go.


    # What You Can Expect to Find on the CD-ROM


    This CD-ROM has four kinds of files on it:


    +   - Files that 1, the author, created: For the most part, these files contain
    the listings in this book (Listing 3-1 in Chapter 3, for instance). Most of these
    listings are Java program files.

    - The JCreator integrated development environment: A free copy of the software,
    specially customized for this book.'
  merge: -1
  pgno: 349
- img_proc: true
  md: '# 330 Java For Dummies, 4th Edition


    +   - Extra chapters in PDF format: When I start writing, I can''t stop.

    Eventually, the folks at Wiley Publishing ran out of paper, so they put additional
    chapters on the CD-ROM.


    +   - Various pieces of freeware, shareware, and haverware: I generally lapse
    into laziness and call all these things by the name shareware, and the legal department
    tells me that I should be more careful.


    # System Requirements


    Your system requirements depend on the kind of computer that you have and the
    kind of operating system that you use. To run the Java 1.5 Software Development
    Kit on a typical Windows computer, you need at least the following resources:


    +   - A Pentium II processor. (A processor''s older and clunkier than a Pentium
    II may be okay, but I make no guarantees.)


    +   - Microsoft Windows (98, Me, 2000, XP, Server 2003, or Vista).


    +   - ENOUGH, whatever that means. The official word from Sun Microsystems is
    not specific about this, but I suspect that 128MB is the bare minimum.


    > You''d better have a CD-ROM drive. Otherwise, you''ll have difficulty grabbing
    software off this book''s CD-ROM.


    +   - For the basic tools to write and run your Java programs, you need about
    140MB of disk space. If you want to store Sun''s documentation, the source files,
    demos, and other goodies, you need over 400MB.


    If your computer doesn''t match up to most of these requirements, you may have
    problems getting your Java programs to run. But remember, "may have problems"
    doesn''t mean that Java won''t work. For more information on Windows configurations,
    visit java.sun.com/j2se/1.5.0/install-windows.html (And be prepared to change
    1.5.0 in the Web address to 1.6-something-else). These version numbers are targets.


    If you''re not a user of Microsoft Windows, visit java.sun.com/j2se/1.5.0/system-configurations.html
    for a list of supported configurations (Once again, be prepared to change 1.5.
    to 1.6.something-else).


    ![](img/cd0a178910e21af6e9ed167dca0579cd_350_0.png)


    Additional Java compiler versions (for computers not officially supported by the
    folks at Sun Microsystems) appear frequently on the Web. So if your computer runs
    Macintosh OS, OpenVM, or FLK (Fred''s Little Known Operating System), search the
    Web for the compiler that you need. Who You may just find it.'
  merge: -1
  pgno: 350
