  md: '# Chapter 5: Controlling Program Flow with Decision-Making Statements


    # Brace yourself


    The statement in Listing 5-1 has two halves — a top half and a bottom half. I
    have names for these two parts of an if statement. I call them the if part (the
    top half) and the else part (the bottom half).


    The if part in Listing 5-1 seems to have more than one statement in it. I make
    this by enclosing the three statements of the if part in a pair of curly braces.
    When I do this, I form a block. A block is a bunch of statements scunched together
    by a pair of curly braces.


    With this, calls to println are tucked away inside the if part. With the curly
    braces, the rows of asterisks and the You are displayed only when the user''s
    guess is correct.


    This business with blocks and curly braces applies to the else part as well. In
    Listing 5-1, whenever inputNumber does not equal randomNumber, the computer executes
    three print/println calls. To convince the computer that all three of these calls
    are inside the else clause, I put these calls into a block. That is, I enclose
    these three calls in a pair of curly braces.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_127_0.png)


    Strictly speaking, Listing 5-1 has only one statement between the if and the else
    statements and only one statement after the else statement. The trick is that
    when you place a bunch of statements inside curly braces, you get a block; and
    behaves, in respects, like a single statement. In fact, the official Java documentation
    lists blocks as one of the many kinds of statements. So, in Listing 5-1, the block
    that prints You win and asterisks is a single statement. That is a statement that
    has, within it, smaller statements.


    # Indenting if statements in your code


    Notice how, in Listing 5-1, the print and println calls are indented. (This includes
    both the You win and Lose statements. The print and println calls that come after
    the part of the if statement are still there) Strictly speaking, you don''t have
    to indent the statements that are inside an if statement. For all compilers, you
    can write your code on a single line or place all statements in some logical fashion.
    The problem is that if you don''t indent you lose sense of your code. In Listing
    5-1, the indenting of the print and println statements helps you see that these
    statements are subordinate to the overall if/else flow.


    In a small program, unindented or poorly indented code is barely tolerable. But
    in a complicated program, indentation doesn''t follow a neat, logical pattern
    is a big, ugly nightmare.'
