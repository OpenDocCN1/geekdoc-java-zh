  md: "# 96 Part II: Writing Your Own Java Programs\n\nThe word before has two different\
    \ meanings:\n\n+   - You put ++ before the variable.\n\n+   - The computer adds\
    \ 1 to the variable's value before the variable is used in any other part of the\
    \ statement.\n\nTo understand this, look at the bold line in Figure 4-10. The\
    \ computer adds 1 to numberOfBunnies (raising the value of numberOfBunnies to\
    \ 29), and then the computer prints the number 29 on-screen.\n\nWith out.println(numberOfBunnies),\
    \ the computer adds 1 to numberOfBunnies before printing the new value of numberOfBunnies\n\
    \nAn alternative to preincrement is postincrement. (The post stands for after).\n\
    The word after has two different meanings:\n\n+   - You put ++ after the variable.\n\
    \n+   - The computer adds 1 to the value after the variable is used in any other\
    \ part of the statement.\n\nTo see more clearly how postincrement works, look\
    \ at the bold line in Figure 4-12. The computer prints the old value of numberOfBunnies\
    \ (which is 28) on the screen, and then the computer adds 1 to numberOfBunnies,\
    \ which raises the value of numberOfBunnies to 29.\n\n![](img/cd0a178910e21af6e9ed167dca0579cd_116_0.png)\n\
    \n```\n| import static java.lang.System.out;\n class preIncrementDemo() {\n public\
    \ static void main(String args[]) {\n int numberOfBunnies = 27;\n numberOfBunnies++;\n\
    \ out.println(numberOfBunnies);\n out.println(numberOfBunnies++);\n out.println(numberOfBunnies);\n\
    \ }\n\n```\n\n| numberOfBunnies becomes 28. |\n| 28 printed. |\n| 28 printed,\
    \ and then numberOfBunnies becomes 29. |\n| 29 printed. |\n\nWith out.println(numberOfBunnies++),\
