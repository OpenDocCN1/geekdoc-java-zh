  md: '# 294 Part IV: Savvy Java Techniques


    An entire try-catch assembly — complete with a try clause, catch clause, and what
    have you — is called a try statement. Sometimes, for emphasis, I call it a try-catch
    statement.


    # The parameter in a catch clause


    Take a look at the catch clause in Listing 12-2 and pay particular attention to
    the words (NumberFormatException e). This looks like a method''s parameter list,
    doesn''t it? In fact, every catch clause is like a little method with its own
    parameter list. The parameter list has an exception type name and then a parameter.


    In 12-2, I don''t do anything with the catch clause''s e parameter, but I could
    certainly if I wanted to. Remember, the exception that''s thrown is an object
    — an instance of the NumberFormatException class. When an exception is caught,
    the catch clause''s parameter refer to that exception. In other words, the name
    e stores a bunch of information about the exception. To take advantage of this,
    you can call some of the exception''s methods.


    ```

    catch (NumberFormatException e) {

    out.println("*That''s not a number.");


    out.println("*Message: " + e.getMessage());


    out.println("*Here comes a stack trace: ");

    e.printStackTrace();

    out.println("*Did you like the stack trace?");

    }

    ```


    With this enhanced catch clause, a run of the inventory program may like the run
    shown in Figure 12-4. When you call getMessage, you fetch some detail about the
    exception. (In Figure 12-4, the display is the fact that the user mistakenly threw
    the word three.) When you call printStackTrace, you get a display showing the
    methods that were running at the moment the exception was thrown. (In Figure 12-4,
    the display includes Integer.parseInt and the main method.) Both getMessage and
    printStackTrace present information to help you find the source of the program''s
    difficulties.'
