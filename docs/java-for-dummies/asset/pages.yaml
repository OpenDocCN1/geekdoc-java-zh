  md: '# Chapter 8: Saving Time and Money: Reusing Existing Code 187


    ![](img/cd0a178910e21af6e9ed167dca0579cd_207_0.png)


    So after reading the number 5000.0, you need two calls to nextLine in order to
    scoop the name Harriet Ritter. The mistake that I usually make is to forget the
    first of those two calls.


    Look again at the file in Figure 8-3. For this section to work correctly, you
    must have a line break after the last 10000.0. If you don''t, a final call to
    nextLine makes your program crash and bound. The error message reads NoElementName:
    No line found.


    I''m always surprised by the number of quirks that I find in each programming
    language''s scanning methods. For example, the first nextLine that reads from
    the file in Figure 8-3 devours Barry Burd[LineBreak] from the file. But that nextLine
    delivers Barry Burd (without any line break) in the running code. So nextLine
    looks for a line break, and nextLine loses the line break. Yes, this is a point.
    And no, this point hardly ever causes problems for anyone.


    If this business about nextDouble and nextLine confuses you, please don''t blame
    the Java. Mixing input calls in computer programming language. And the really
    nasty thing is that each programming language approaches the problem a little
    differently. When you find out nextLine in Java helps you understand the issues
    when you get to know C++ or Visual Basic, but it doesn''t tell you all the details.
    Each language''s details are unique to that language. (Yes, it''s a big pain.
    But because computer programmers become rich and famous, the pain eventually pays
    off.)'
