    (Listing 8-5).


    This is for the course. Finding the payment amount for a part-time employee isn''t
    the same as finding the payment amount for a full-time employee. A part-time employee''s
    pay changes each week, depending on the number of hours the employee works in
    a week. So the FullTimeEmployee and PartTimeEmployee classes both stay the same
    each week. findPaymentAmount methods, but each class''s method works quite differently.


