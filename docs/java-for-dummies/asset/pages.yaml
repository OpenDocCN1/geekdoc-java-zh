    # 185


    # # Who moved my file?


    If you installed JCreator from this book''s CD-ROM, your MyProjects directory
    has a subdirectory named Listings0801-02. That Listings0801-02 directory comes
    with files named Employee.java and DoPayroll.java — the code in Listings 8-1 and
    8-2. The Listings0801-02 directory also contains the EmployeeInfo.txt file. That
    good, because if the Employee doesn''t run properly. Instead, you get a FileNotFoundException.


    In general, when you get a FileNotFoundException, some file that your program
    needs is not available. This is an easy mistake to make. It can be frustrating
    because of you, a file such as EmployeeInfo.txt may look like it''s available
    to your program. Remember — computers are stupid. If you make a mistake, the computer
    can''t read the lines for you. So if your EmployeeInfo.txt file isn''t in the
    right directory on your hard drive or the filename is spelled incorrectly, the
    computer chooses when it tries to run your code.


    Sometimes you darn know well that an EmployeeInfo.txt (or whatever) file is on
    your hard drive. But when you run your program, you will get a mean-looking FileNotFoundException.
    When this happens, the file is usually in the wrong directory on your hard drive.
    (Of course, it depends on your point of view. Maybe the file is in the right directory;
    but you''ve told your Java program to look for the file in the wrong directory.)
    When this happens, pens copying the file to some other directories on your hard
    drive and rerunning your code. (Subdirectories of JCreator''s MyProjects directory
    are always good places to put files.) St carefully at the names and locations
    of files on your hard drive until you figure out what''s wrong.


    #  Adding directory names to your filenames


    You can specify a file''s exact location in your Java code. Code like File("C:\Program
    Files\Xinois Software\JCreatorV3 LE\MyProjects\Listings0801-02\EmployeeInfo.txt")
    really looks ugly, but it works.


    In the previous paragraph, notice the double backslashes in "C:\Program Files\Xinois
    Software . If you are a Windows MS-DOS user, you''d be tempted to write C:\Program
    Files\Xinois Software with single backslashes. But in Java, the single backslash
    has its own special meaning. (For example, in Listing 7-7, \n means to go to the
    next line.) So in Java, to indicate a backslash inside a quoted string, you use
    a double backslash'
