  md: '# 134 Part II: Writing Your Own Java Programs


    Figure 6-6 shows the flow of control in the loop of Listing 6-4. With a do loop,
    the situation in the twoPlusTwo program (shown earlier) can never happen. Because
    the do loop carries out its first action without testing a condition, every do
    loop is guaranteed to perform at least one iteration.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_154_0.png)


    # Reading a single character


    In Listing 5-3, the user types a word on the keyboard. The myScanner.next method
    gets the word and places it into a String variable named password. Everything
    works nicely because a String variable can store many characters at once and the
    next method can read many characters at once.


    But in Listing 6-4, you are not interested in reading several characters. You
    expect the user to type one letter — either y or n. So you do not create a String
    variable to store the user’s response. Instead, you create a char variable that
    stores one symbol at a time.


    The Java API doesn''t have a nextChar method. To read something for storage in
    a char variable, you have to improvise. In Listing 6-4, the improvement looks
    like this:


    ```

    myScanner.findWithinHorizon(".", 0).charAt(0)

    ```


    You can use this code exactly as it appears in Listing 6-4 when you want to read
    a single character.


    A String variable can contain many characters or just one character. A String
    variable that contains only one character is not the same as a char variable.
    No matter what you put in a String variable, String variables and char variables
    have to be treated differently.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_154_1.png)'
