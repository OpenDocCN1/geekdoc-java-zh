    site, you can read the latest proposals for improving Java. Who knows? You may
    even want to contribute.'
  merge: -1
  pgno: 343
- img_proc: true
  md: '# 324 Part V: The Part of Tens


    # Finding News, Reviews,

    and Sample Code


    The Web has plenty of sites devoted exclusively to Java. Many of these sites feature
    reviews, links to other sites, and best of all, ooodles of sample Java code. Some
    also offer free mailing lists that keep you informed of the latest Java developments.
    Here''s a brief list of such sites:


    +   - Java Boutique: javaboutique.internet.com

    - JavaRanch: www.javaranch.com

    - Jalavobby: www.javalobby.org

    - Gamelan: www.developer.com/java


    # Improving Your Code with Tutorials


    To find out about Java, you can visit Sun''s online training pages. The Web address
    is java.sun.com/developer/onlineTraining. Some other nice tutorials are available
    at the following Web sites:


    +   - Richard Baldwin''s Web site: www.dickbaldwin.com

    - IBM developerWorks: www-106.ibm.com/developerworks/training

    - ProgrammingTutorials: www.programmingtutorials.com


    # Finding Help on Newsgroups


    A roadblock that you just can''t get past? Try posting your question on an Internet
    newsgroup. Almost always, some friendly expert posts just the right reply.


    With or without Java, you should definitely start exploring newsgroups. You can
    find thousands of newsgroups — newsgroups on just about every conceivable topic.
    (There, are more newsgroups than For Dummies titles!) To get started with newsgroups,
    visit groups.google.com. For postings specific to Java, look for the groups whose
    names begin with comp.lang.java. For a novice, the following three groups are
    probably the most useful:'
  merge: -1
  pgno: 344
- img_proc: true
  md: '# Chapter 14: Ten Sets of Web Resources for Java 325


    +   - comp.lang.java.programmer

    - comp.lang.java.help

    - comp.lang.java.gui


    # Checking the FAQs for Useful Info


    Has the acronym FAQ made it to the Oxford English Dictionary yet? Everybody seems
    to be using FAQ as an ordinary English word. In case you don''t already know


    You can find several FAQs at the official Sun Web site. You can also check www.net.com/java/faq—a
    page that links to several Java FAQs.


    # Reading Documentation with Additional Commentary


    When programmers write documentation, they ask themselves questions and then answer
    those questions as best they can. But sometimes, they don''t ask themselves all
    the important questions. And often, they assume that the reader knows certain
    things. If you''re a reader who doesn''t already know these things, you may be
    out of luck.


    One or another, all documentation omits some details. That''s why other people''
    comments about the documentation can be helpful. At www.jd.com experienced Java
    programmers annotate documentation with their own comments. The comments include
    tips and tricks, but they also add useful pieces of information—pieces the documentation''s
    original authors omitted. If you need help with an aspect of the Java API, this
    is a great Web site to visit.


    # Opinions and Advocacy


    Blogs are hot stuff nowadays. Business people, politicians, and others write blogs
    to draw attention to their ideas. And many people write blogs just for fun.


    When it comes to reading about Java, I have a few favorite blogs. I list them
    here in alphabetical order:'
  merge: -1
  pgno: 345
- img_proc: true
  md: '# 326 Part V: The Part of Tens


    +   ✓ Simon Philipps’ blog — www.webmink.net/minkblog.htm

    Simon is Chief Technology Evangelist at Sun Microsystems. No matter what subject
    he chooses, Simon always speaks his mind.

    ✓ Jonathan Schwartz’s blog — blogs.sun.com/jonathan

    Jonathan is Chief Operating Officer at Sun Microsystems. When Jonathan speaks,
    people listen. And when Jonathan writes, people read.

    ✓ Mary Smaragdis’s blog — blogs.sun.com/mary

    Mary is Marketing Manager at Sun Microsystems. When you read Mary’s blog, her
    enthusiasm gushes from the computer screen. I’ve met her at several conferences.
    She’s even livelier in person.


    # Looking for Java Jobs


    Are you looking for work? Would you like to have an exciting, lucrative career
    as a Java programmer? Try visiting a Web site that’s specially designed for people
    like you. Point your Web browser to www.javajobs.com or java.computerwork.com.


    # Becoming Certified in Java


    These days, everybody is anxious to be certified. If you are one of these people,
    you can find plenty of resources about Java certification on the Web. Just start
    by visiting www.javaprepare.com and www.javaranch.com/ring.jsp. Both of these
    sites link to other interesting sites, including sites with practice certification
    exams.


    # Everyone’s Favorite Sites


    It’s true — these sites aren’t devoted exclusively to Java. However, no geek-worthy
    list of resources would be complete without Slashdot and SourceForge.


    Slashdot’s slogan, “News for nerds, stuff that matters,” says it all. Slashdot.org
    you find news, reviews, and commentary on almost anything related to computing.
    There’s even a new word to describe a Web site that was reviewed or discussed
    on the Slashdot site. When a site becomes overwhelmed with hits from Slashdot
    referrals, one says that the site has been slashdotted.'
  merge: -1
  pgno: 346
- img_proc: true
  md: Although it's not quite as high-profile, sourceforge.net is the place to look
    for open source software of any kind. The SourceForge repository contains over
    80,000 projects. At the SourceForge site, you can download software, read about
    works in process, contribute to existing projects, and even start a project of
    your own. SourceForge is a great site for programmers and developers at all levels
    of experience.
  merge: -1
