    # # Running a GUI on a Web page (a Java applet)


    Java''s big splash came onto the scene in the mid-1990s. The people at Sun Microsystems
    had managed to work Java programs into Web pages, and the results were dazzling.
    The infusion of Java into the Web was powerful, efficient, portable, and secure.
    The trick was to create a part of a program, called an applet to display the applet
    inside a rectangle on the Web page.


    These days, applets are passé. Real Java programmers roll their eyes when they
    hear the word applet. Three reasons for these are:


    +   - Since the mid-1990s, better technologies have emerged for putting eyecatching
    content onto Web pages.

    - Microsoft, the maker of the world''s most powerful Web browser, refused to give
    its browser the most-to-date Java tools.

    - For programmers, the real money isn''t in creating glittery Web pages. The real
    money is in business applications with Java EE.


    For more information on Java EE, see Chapter 3.


    Passé or not, some people still wait to create applets. In this section, we show
    a simple Java applet. Just follow these steps:


    +   1. If you haven''t already done so, follow Steps 1 to 4 from the section entitled
    "Running a text-based program."


    When you finish with these steps, the Chapter02 workspace is open.


    +   2. In the File View''s, right-click the branch labeled Program0203. In the
    resulting context menu, choose Sets As Active Project.


    This makes Program0203 the active project.


