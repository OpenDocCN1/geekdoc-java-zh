    # The Java method


    You''re working as an auto mechanic in an upscale garage. Your boss,

    who''s in a hurry and has a habit of running words together, says,

    "FixTheAlternator on junkyOldFord." Mentally, you run through a list of

    tasks. Drive the car into the lift, the hood with a wrench, loosen the alter-

    ator," and so on. Three things are on here:


    +   - You have a name for the thing you''re supposed to do. The name is

    FixTheAlternator.


    +   - In your mind, you have a list of tasks associated with the name

    FixTheAlternator. The list includes "Drive the car into the lift, the

    hood, a wrench, loosen the alternator belt," and so on.


    +   - You have a grumpy boss who''s telling you to do all this work. Your

    boss gets you working by saying, "FixTheAlternator." In other words,

    boss gets you working by saying the name of you''re sup-

    posed to do.


    In this scenario, using the word method wouldn''t be a big stretch. You have a

    method for doing something with an alternator. Your boss calls method

    to action, and you respond by doing all the things in the list of instructions

    that''ve associated with the method.


    If you believe (and I hope you do), then you''re ready to read about

    Java methods. In Java, a method is a list of things to do. Every method has a

    name, and you tell the computer to do the things in the list by using

    method''s name in your program.


    I''ve never written a program to get a robot to fix an alternator. But, if I did,

    t program may include a FixTheAlternator method. The list of instruc-

    tions my FixTheAlternator method would look something like the text

    in Listing 3-2.


    # Listing 3-2: A Method Declaration


    ```

    void FixTheAlternator() {

    DriveInto(car, bay);

    Lift (hood);

    Get (wrench);

    Loosen(alternatorBelt);

    ...

    n}

    ```


    Somewhere else in my Java code (somewhere outside of Listing 3-2), I need

    an instruction to call my FixTheAlternator method into action. The

    instruction to call the FixTheAlternator method into action may look like

    the line in Listing 3-3.'
