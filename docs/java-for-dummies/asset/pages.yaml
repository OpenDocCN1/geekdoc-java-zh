  md: "# Chapter 5: Controlling Program Flow with Decision-Making Statements\n\n#\
    \ # To break or not to break\n\nIn every Java programmer's life, a time comes\
    \ when he or she forgets to use break statements. At first, the resulting output\
    \ is confusing, but then the programmer remembers fallthrough. The term fall-through\
    \ describes what happens when you end a case without a break statement. What happens\
    \ is execution of the code falls right through to the next case in line. Execution\
    \ keeps falling through until you reach a break statement or the end of the switch\
    \ statement.\n\nUsually, when you're using a switch statement, you don't fall-through,\
    \ so you pepper break statements throughout the switch statements. But, occasionally,\
    \ fall-through is just the thing you need. Take, for instance, 'Al's All Wet'\
    \ (The classics lyrics are shown in the sidebar bearing the song's name). Each\
    \ verse adds new lines in addition to the lines from previous verses. This situation\
    \ (accumulating lines from one verse to another) cries out for a switch statement\
    \ with fall-through. Listing 5-7 demonstrates the idea.\n\n# 5-7:\n\nA Switch\
    \ Statement with Fall-Through\n\n```\nimport static java.lang.System.out;\nimport\
    \ java.util.Scanner;\n\nclass FallingForAllYou {\n    public static void main(String\
    \ args[]) {\n        Scanner myScanner = new Scanner(System.in);\n        out.print(\"\
    Which verse? \");\n        int verse = myScanner.nextInt();\n\n        switch\
    \ (verse) {\n            case 3:\n                out.print(\"Last refrain, \"\
    );\n                out.println(\"last refrain, \");\n            case 2:\n  \
    \              out.print(\"He's a pain, \");\n                out.println(\"he's\
    \ a pain, \");\n            case 1:\n                out.print(\"Has no brain,\
    \ \");\n                out.println(\"has no brain, \");\n        }\n\n      \
    \  out.println(\"In the rain, in the rain, \");\n        out.println(\"Ohhhhhhhh...\"\
    );\n        out.println();\n    }\n}\n```"
