  md: '# 90 Part II: Writing Your Own Java Programs


    Every Java class is a reference type. If you declare a variable to have some type
    that''s not a primitive type, the variable''s type is (most of the time) the name
    of a Java class.


    Now, when you declare a variable to have type int, you can visualize what that
    declaration means in a fairly straightforward way. It means that, somewhere inside
    the computer''s memory, a storage location is reserved for that variable''s value.
    In that storage location is a bunch of bits. The arrangement of the bits ensures
    that certain whole number is represented.


    That explanation is fine for primitive types like int or double, but what does
    it mean when you declare a variable to have a reference type? What does it mean
    to declare your variableFrame to be of type JFrame?


    Well, what does it mean to declare I thank You God to be an E. Cummings poem?
