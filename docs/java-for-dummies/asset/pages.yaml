  md: '# Chapter 10: Putting Variables and Methods Where They Belong


    You also want the methods findTeamAverage and findTeamAverageString to be static.
    Without the word static, there would be nine findTeamAverage methods — one for
    each instance of the PlayerPlus class. This wouldn''t make sense. Each instance
    would have the code to calculate totalOfAverages/playerCount on its own, and each
    of the calculations would yield the same answer.


    In general, any task that all the instances have in common (and yields the result
    for each instance) should be coded as a static method.


    Constructors are never static.


    In Listing 10-4, the decFormat variable is static. This makes sense, because decFormat
    makes totalAverages / playerCount look nice, and both in the expression totalAverages
    / playerCount are static. Thinking more directly, the code needs only one thing
    for formatting numbers. If you have several numbers to format, the same decFormat
    that belongs to the entire class can format each number. Creating a decFormat
    for each player is not only inconvenient but also wasteful.


    In this book, my first use of the word static was back in Listing 3-1. I use the
    static keyword as part of every main method (and lots of main methods are in this
    book''s lists). Well, why does main have to be static? Well, remember that non-static
    things belong to objects, not classes. You cannot have a main method until you
    create an object. When you start up a Java program, no objects are created yet.
    The statements that are executed in the main method start creating objects. So,
    if the main method is not static, you have a big chicken-and-egg problem.


