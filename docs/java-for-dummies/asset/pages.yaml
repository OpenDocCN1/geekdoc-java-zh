    program crashes. The inventory program''s message says java.lang.NumberFormatException.
    That means a class named NumberFormatException is in the java.lang API. However,
    the call to Integer.parseInt brought this NumberFormatException out of hiding.


    For a brief explanation of the Integer.parseInt method see Chapter 11.


    Well, here''s what''s going on. Java programming language has a mechanism called
    exception handling. With handling exception, a program can detect that things
    are about to go wrong and respond by creating a new object. In the official terminology,
    the program is said to be throwing an exception. That object, an instance of the
    Exception class, is passed to catch. When the exception is caught, the program
    executes some recovery code, buries the exception, and moves on to the next normal
    state as if nothing had ever happened. The process is illustrated in Figure 12-2.


