    Figure 5-1: Two runs of the guessing game.


    The program in List 5-1 plays a guessing game with the user. The program gets
    a number (a guess) from the user and then generates a random number between 1
    and 10. If the user entered is the same as the random number, the user wins. Otherwise,
    the user loses. In either case, the program tells the user what the random number
    was.


    # She controlled keystrokes from the keyboard


    Taken together, the lines


    ```

    import java.util.Scanner;


    Scanner myScanner = new Scanner(System.in);


    inputNumber = myScanner.nextInt();

    ```


    In List 5-1 get whatever number the user types on the keyboard. The last of the
    three lines puts this number into a variable named inputNumber. If these lines
    look complicated, don''t worry. You can copy these lines almost word for word
    whenever you want to read. Include the first two lines (import and Scanner lines)
    just once in your program. Later in your program, wherever the user types an int
    value, include a line with a call to nextInt(as in the last of the preceding three
    lines of code).


    Of all the names in these three lines of code, the only two names that I coined
    myself are inputNumber and myScanner. All the other names are part of Java. So,
    if I want to be creative, I can write these lines this way:


    ```

    import java.readingThie;


    Scanner readingThie = new Scanner(System.in);


    int valueTypedIn = readingThie.nextInt();

    ```'
