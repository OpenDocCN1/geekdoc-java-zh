    \ Listing 12-2. When a misguided user types three instead of 3, the program maintains\
    \ its cool by displaying That's not a number. The trick is to enclose the call\
    \ to Integer.parseInt inside a try clause. If you do this, the computer watches\
    \ for exceptions when any statement inside the try clause is executed. If an exception\
