    Figure 6-3 shows what you get when you run the program of Listing 6-2. (You exactly
    what you deserve.) The for statement in Listing 6-2 starts by setting the count
    variable equal to 1. Then the statement starts to make sure that count is less
    than equal to 10 (which it certainly is). Then the for statement dives and executes
    the printing statements between the curly braces. (At this early stage of the
    game, the computer prints The value of count is 1). Finally, the for statement
    does that last thing inside its parentheses — it adds 1 to the value of count.


    ![](img/cd0a178910e21af6e9ed167dca0579cd_148_0.png)


    With count now equal to 2, the for statement checks again to make sure that count
    is less than equal to 10. (Yes, 2 is smaller than 10.) Because the test turns
    out, the for statement marches back into the curly braced statements and prints
    The value of count is 2 on the screen. Finally, the for statement does that last
    thing inside its parentheses — it adds 1 to the value of count, increasing the
    value of count to 3.


    And so. This whole thing keeps repeated over over and again until, after 10 iterations,
    the value of count reaches 11. When this happens, the check for count being less
    than or equal to 10 fails, and the loop''s execution ends. The computer jumps
    to whatever statement comes immediately after the for statement. In Listing 6-2,
    the computer prints Done! The whole process is illustrated in Figure 6-4.


    # The anatomy of a for statement


    After the word for, you always put three things in parentheses. The first of these
    three things is called an initialization, the second is an expression, and the
    third is called an update.


    ```

    for ( initialization ; expression ; update )

    ```'
