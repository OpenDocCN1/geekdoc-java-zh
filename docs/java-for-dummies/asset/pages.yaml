  md: "# Curly braces\n\nLong ago, or maybe not so long ago, your schoolteachers told\
    \ you how useful outlines are. With an outline, you can organize thoughts and\
    \ ideas, help people see forests instead of trees, and generally show that you're\
    \ a member of the Tidy Persons Club. Well, a Java program is like an outline.\
    \ The program in Listing 3-1 starts with a big header that says, \"Here comes\
    \ a class named Displayer.\" After that first big header is a subheader that announces,\
    \ \"Here comes a method named main.\"\n\nNow, if a Java program is like an outline,\
    \ why doesn't a program look like one? What takes the place of the Roman numerals,\
    \ capital letters, and other things? The answer is twofold:\n\n+   - In a Java\
    \ program, curly braces enclose meaningful units of code.\n- You, the programmer,\
    \ can (and) indent lines so that other programmers can see the outline form of\
    \ your code at a glance.\n\nIn an outline, everything is subordinate to the item\
    \ in Roman numeral I. In a Java program, everything is subordinate to the top\
    \ line — the line with the word class in. To indicate that everything else in\
    \ the code is subordinate to this class line, you use curly braces. Everything\
    \ else in the code goes inside these curly braces. (See Listing 3-4)\n\n# Listing\
    \ 3-4: Curly Braces for a Java Class\n\n```\nclass Displayer {\n\n    public static\
    \ void main(String[] args[]) {\n        System.out.println(\"You'll love Java!\"\
    );\n    }\n}\n```\n\nIn an outline, some stuff is subordinate to a capital letter\
    \ A. In a Java program, some lines are subordinate to the method header. To indicate\
    \ that something is subordinate to a method header, you use curly braces. (See\
    \ Listing 3-5)\n\n# Listing 3-5: Curly Braces for a Java Method\n\n```\nclass\
    \ Displayer {\n\n    public static void main(String[] args[]) {\n        System.out.println(\"\
    You'll love Java!\");\n    }\n}\n```"
