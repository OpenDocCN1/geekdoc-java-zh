    \ 软件列表可在 http://support.sas.com/software/products/university-edition/index.html\
    \ 获取。\n\n# 书中的输出和图形\n\n书中所有的输出和 SAS 图都是在 SAS Studio 中执行相关程序代码产生的。\n\n# 更多帮助\n\n\
    尽管本书说明了各行业经常执行的分析，但可能会出现与你的目标和问题的问题。为了给你提供全面支持，SAS 和 SAS Press 为你提供了以下资源：\n\n\
    - 有关书中涵盖主题的问题，通过 SAS Press 联系作者：\n  - 将问题发送至 saspress@sas.com；在邮件中注明书名。\n  - 在\
    \ http://support.sas.com/author_feedback 页面上提交反馈。\n- 有关书中范围内或之外主题的问题，请在 https://communities.sas.com/welcome\
    \ 的 SAS 支持社区提问。Base SAS 编程社区是讨论 DS2 的合适社区。\n\n"
