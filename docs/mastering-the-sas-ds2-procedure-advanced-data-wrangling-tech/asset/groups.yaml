  - "[PAGE 38]\n\n# 22 Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\
    \n```\nput '*********';\nend;\n\n/* Section 2 */\nset crs.banks=last;\nput Bank\
    \ Rate;\n\n/* Section 3 */\nif last then\ndo\n    put '*********';\n    put 'Ending';\n\
    \    put '*********';\nend;\nrun;\n```\n\n# 2.3.2 Considerations\n\n+   1. Section\
    \ 1 consists of a DO group of statements that will be executed only when _N=1.\
    \ The automatic variable _N counts the number of times the DATA step has iterated,\
    \ so this block will execute only one time, when the DATA step starts execution.\n\
    2. Section 2 consists of unconditionally executed statements. These statements\
    \ should execute once for every observation in the input data set. In this section,\
    \ the SET statement uses the END= to create last, a temporary variable containing\
    \ an end-of-file indicator. The variable last is initialized to zero and remains\
    \ 0 until the SET statement reads the last observation of the last set listed,\
    \ when it is set to 1. As an automatic variable, last is automatically flagged\
    \ for DROP, and will not appear in the output data set.\n3. Section 3 consists\
    \ of a DO group of statements that will execute only if the variable last contains\
    \ a value other than 0 or missing.\n\nIf we think about this, Section 1 code sounds\
    \ like a great candidate for the INIT system method, Section 2 for the RUN method,\
    \ and Section 3 for the TERM method.\n\n# 2.3.3 The Equivalent DS2 Data Program\n\
    \nHere is a DS2 data program equivalent to the original SAS DATA step:\n\n```\n\
    proc ds2;\ndata _null_;\n\n/* Section 1 */\nmethod init();\n    put '*********';\n\
    \    put 'Starting';\n    put '*********';\nend;\n\n/* Section 2 */\nmethod run();\n\
    \    set crs.banks;\n    put Bank Rate;\nend;\n```"
  - "[PAGE 39]\n\n# Chapter 2: Introduction to the DS2 Language 23\n\n```\n/* Section\
    \ 3 */\nmethod term();\nput '*********';\nput 'Ending';\nput '*********';\nend;\n\
    enddata;\nrun;\nquit;\n```\n\n#  2.4 Review of Key Concepts\n\n+   * All DS2 programs\
    \ are structured in blocks: data, package, and thread.\n* There are three types\
    \ of DS2 program blocks: A program block begins with the appropriate DATA, PACKAGE,\
    \ or THREAD statement, and with the corresponding ENDDATA, ENDPACKAGE, or ENDTHREAD\
    \ statement. The remainder of the program consists of a combination of global\
    \ declarative statements and method definitions. All executable statements must\
    \ be part of a method block definition.\n* There are three system methods: INT,\
    \ RUN, and TERM. Every data and thread program must contain explicit coding for\
    \ one of these methods. System methods execute automatically and do not accept\
    \ parameters.\n* You can write user-defined methods, keeping the following in\
    \ mind:\n  * User-defined methods do not execute automatically; they only when\
    \ called.\n  * User-defined methods can accept parameters with values passed either\
    \ by value or by reference (IN_OUT parameters).\n* A method that has no IN_OUT\
    \ parameters can return a value, like a SAS function.\n  * Method IN_OUT parameter\
    \ values can be modified at the local site, like a SAS CALL routine.\n  * User-defined\
    \ methods can be stored for reuse in a DS2 package.\n* Variables created in a\
    \ DS2 program should be declared using a DECLARE (DCL) statement. Where the variable\
    \ is declared determines the variable's scope.\n* Variables introduced to a DS2\
    \ program via a SET statement, declared in the global program space (before method\
    \ definitions begin), or which appear undeclared in the program code have global\
    \ scope. Global variables can be referenced anywhere inside the DS2 program, are\
    \ part of the PDV, and are included in the program result set by default.\n* Variables\
    \ declared inside a METHOD block and method parameter variables are local in scope,\
    \ and can be referenced only within that method. Local variables are never included\
    \ in the PDV and cannot become part of the program result set."
