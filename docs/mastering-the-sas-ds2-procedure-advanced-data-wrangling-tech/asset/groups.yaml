    # Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques


    # 2.2.3.2 Package Programs


    A DS2 package program begins with a PACKAGE statement, ends with an ENDPACKAGE
    statement, and generates a package as a result. DS2 packages are used to reuse
    code, including user-defined methods and variables. Packages are stored in SAS
    libraries and look like data sets. However, the contents of the package are a
    couple of rows of clear text header followed by more rows containing encrypted
    source code. Packages make creating and sharing platform-independent reusable
    code modules easy and secure, and provide an excellent means for users to extend
    the capabilities of the DS2 language.


    Packages can be used for more than just user-defined methods—they are the "objects"
    of the DS2 programming language. Global package variables (variables declared
    outside the package methods) act as state variables for each time you instantiate
    a package, the instance has a private set of variables that it can use to keep
    track of its state. Packages can also accept constructor arguments to initialize
    the package when it is instantiated. DS2 packages allow SAS users to easily create
    and reuse objects in their DS2 programs.


    # 2.2.3.3 Thread Programs


    A DS2 program begins with a THREAD statement, ends with an ENDTHREAD statement,
    and generates a thread as a result. Like DS2 packages, threads are stored in SAS
    libraries as data sets and their contents consist of clear text header information
    followed by encrypted source code. Threads are much like a DS2 program, in that
    they contain at least one system method definition and can include package references
    and user-defined methods. Once a thread is created, it can be executed from a
    DS2 program using the SET statement. The THREADS=option from the SET statement
    allows several copies of the thread program to run in parallel on the SAS compute
    platform for parallel processing, with each thread returning observations to the
    data program as soon as computations are complete.


    # 2.2.4 Methods


    Methods are named code blocks within a DS2 program, delimited by a METHOD statement
    and an end statement. Method blocks contain not nested method blocks, and all
    identifier (names) must be unique within their DS2 data, package, or thread program
    block. There are two types of methods:


    +   - system methods execute automatically at prescribed times in a DS2 program.
    They cannot be called.

    - user-defined methods execute only when called.


    # 2.2.5 System Methods


    There are three system methods that are included in every DS2 data program, either
    implicitly or explicitly. These methods provide a DS2 data program with a more
    structured framework than the SAS DATA step. In the Base SAS DATA step, the entire
    program is included in the implicit, data-driven loop. In a DS2 program, the RUN
    method provides the implicit, data-driven loop that will be more familiar to the
    traditional DATA step programmer. The INIT and TERM methods are not included in
    the loop, and provide a place to execute program initialization and finalization
    code.'
- md: "\n# Chapter 2: Introduction to the DS2 Language\n\nSystem methods execute automatically\
    \ and do not accept parameters. You must explicitly define at least one of these\
    \ methods in your data or thread program or the program will not execute. You\
    \ do not write explicit code for one or more system method blocks, the DS2 compiler\
    \ will create an empty version of the missing system method for you at compile\
    \ time. An empty method contains only the appropriate METHOD statement followed\
    \ by an END statement.\n\n## 2.2.5.1 The INIT Method\n\nThe INIT method executes\
    \ once and only once, immediately after commencement of program execution. It\
    \ provides a standard place to execute program initialization routines. The following\
    \ DATA step and DS2 data program produce the same results, but the DS2 data program\
    \ does not require any conditional logic:\n\nDATA step:\n\n```\ndata _null;\n\
    if _n=1 then do;\nput 'Execution is beginning';\nend;\nrun;\n```\n\nDS2 data program:\n\
    \n```\nproc ds2;\ndata _null;\nmethod init();\nput 'Execution is beginning';\n\
    enddata;\nrun;\nquit;\n```\n\n## 2.2.5.2 The RUN Method\n\nThe RUN method emulates\
    \ the performance of a traditional SAS DATA step. It begins operation as soon\
    \ as the INIT method has completed execution and acts as a data-driven loop. The\
    \ RUN method iterates once for every row (observation) in the input data set.\
    \ The RUN method is the only method that includes an implicit output at the END\
    \ statement. The DATA step and DS2 data program produce the results:\n\n```\n\
    data new_data;\nif _n=1 then do;\nput 'Execution is beginning';\nend;\nset crsone_day;\n\
    run;\n```\n\n```\nproc ds2;\ndata new_data;\nmethod init();\nput 'Execution is\
    \ beginning';\nend;\nmethod run();\nset crs.one_day;\nend;\nenddata;\nrun;\nquit;\n\
    ```\n\n## 2.2.5.3 The TERM Method\n\nThe TERM method executes once, and only once,\
    \ immediately after the RUN method completes execution and before the data or\
    \ thread program terminates execution. It provides an appropriate place to execute\
    \ program finalization code. This DATA step and DS2 data program produce the same\
    \ results, but the DATA step requires the use of the END= statement option, the\
    \ associated automatic variable, and a conditional logic decision to accomplish\
    \ the DS2 data program without requiring any additional resources or code:\n\n\
    ```\ndata new_data;\nif _n=1 then\n  put 'Execution is beginning';\nend;\nset\
    \ crs.one_day end=last;\nif last=1 then\n  put 'Execution is ending';\nend;\n\
    run;\n```\n\n```\nproc ds2;\ndata _null_;\nmethod init();\n  put 'Execution is\
    \ beginning';\nend;\nmethod run();\n  set crs.one_day;\nend;\nmethod term();\n\
    \  put 'Execution is ending';\nend;\nenddata;\nrun;\nquit;\n```\n\n## 2.2.6 User-Defined\
    \ Methods\n\nIn DS2, you can easily define and use your own reusable code blocks.\
    \ These code blocks are called user-defined methods, and they can accept parameter\
    \ values either by reference or by value. When all parameters are passed into\
    \ a method by value, the values are available inside the method for use in calculations,\
    \ and the method can return a single value to the calling process--much like a\
    \ Base SAS function. This data program uses a user-defined method to convert temperatures\
    \ from Celsius to Fahrenheit.\n\n```\nproc ds2;\n/* No output DATA set. Results\
    \ returned as a report (like SQL) */\ndata;\n  dcl double DegF;\n  /* Method returns\
    \ a value */\nmethod c2f(double Tc) returns double;\n  /* Celsius to Fahrenheit\
    \ */\n  return ((Tc*9)/5+32);\nend\nmethod init();\n  do DegC=0 to 30 by 15;\n\
    \    DegF=c2f(DegC);\n    output;\nend;\nenddata;\nrun;\nquit;\n```\n\nFigure\
    \ 2.2: Output of Temperature Conversion\n\n| DegC | DegF |\n|---|---|\n| 15 |\
    \ 59 |\n| 30 | 86 |\n\nOne or more parameters are passed by reference, the values\
    \ are available inside the method for use in calculations, and those values can\
    \ be modified by the method at the call site, like a Base SAS routine. In DS2,\
    \ parameters passed by reference are called IN_OUT parameters. A method that has\
    \ IN_OUT parameters cannot return a value, but can modify several of IN_OUT parameters\
    \ during execution. This data program uses a user-defined method to convert temperatures\
    \ from Fahrenheit to Celsius, but passes the temperature by reference:\n\n```\n\
    proc ds2;\ndata;\n  dcl double Tf;\n  /* Method modifies a value at call site\
    \ */\n  method f2c(inout double T);\n  /* Fahrenheit to Celsius (rounded) */\n\
    \  T=round((T-32)*5/9);\nend;\nmethod init();\n  do Tf=0 to 100 by 10;\n    f2c(Tf);\n\
    \    output;\nend;\nenddata;\nrun;\nquit;\n```\n\nIn DS2 program, all objects,\
    \ variables, and code blocks must have identifiers (names). An identifier's scope\
    \ is either global or local, and identifiers are unique within their scope. An\
    \ identifier's scope determines where in the program it can be referenced. Figure\
    \ 2.4 shows a DS2 program with identifiers of both global and local scope and\
    \ indicates which values will be returned when referenced.\n\nFigure 2.4: DS2\
    \ Data Program Variable Scope\n\n```\nproc ds2;\n  data null;\n  dcl varchar(6)\
    \ var1 var2;\n  retain var2 'Global';\n  method init();\n    dcl varchar(5) var1;\n\
    \    var1='Local';\n    put 'INIT method ' var1;\n    put 'INIT method ' var2;\n\
    \  end;\n  method run();\n    put 'RUN method ' var1;\n    put 'RUN method ' var2;\n\
    \  end;\n  method term();\n    put 'TERM method ' var1;\n    put 'TERM method\
    \ ' var2;\n  end;\n  enddata;\n  run;\nquit;\n```\n\nGlobal identifiers can be\
    \ referenced anywhere in the data program. Local identifiers can only be referenced\
    \ within the method in which they were defined. (img/ef05c3db8dda15abd0741dd2063f.png)\n\
    \nLegend:\n- Global Scope\n- Local Scope\n\nIf the program illustrated in Figure\
    \ 2.4 is executed, the following results are produced in the SAS log:\n\n```\n\
    INIT method var1=Local\nINIT method var2=Global\nRUN method var1=Global\nRUN method\
    \ var2=Global\nTERM method var1=Global\nTERM method var2=Global\n```\n\nVariable\
    \ identifiers are also global scope if the variable is undeclared or introduced\
    \ to the program via a SET statement, as an assignment statement. In DS2, an undeclared\
    \ variable is created whenever a variable is first referenced. The use of undeclared\
    \ variables in DS2 is discouraged; doing so will produce warnings in the SAS log.\
    \ This might first seem strange to a SAS data programmer, if you execute a long-running\
    \ SAS program only to be greeted by the dreaded **NOTE: var is uninitialized**\
    \ in the SAS log, you will understand the benefit of this behavior. Generally,\
    \ that means you've mistyped a variable name somewhere in your code, and the processing\
    \ time for this run of the STEP has been wasted.\n\nYou can control DS2 behavior\
    \ for undeclared variables with the system option in the PROC DS2 statement. The\
    \ default is WARNING, but NONE, and ERROR are all valid. When writing, prototyping,\
    \ or testing code, I prefer to have this option to ERROR, so DS2 programs containing\
    \ undeclared variables will fail to compile, will not execute, and will produce\
    \ this message in the SAS log:\n\n```\nERROR: Compilation error.\nERROR: Line\
    \ n: No DECLARE for referenced variable var; creating as a global variable of\
    \ type double.\n```\n\n# Mastering the SAS DS2 Procedure: Advanced Data Wrangling\
    \ Techniques\n\nIn a DS2 data program, variable scope plays one important role:\
    \ only global variables are included in the PDV, and only PDV variables are eligible\
    \ to become part of the program result set. You can explicitly remove global variables\
    \ from the program result using DROP or KEEP statements. Variables with local\
    \ scope are not included in the PDV, so there is no need to drop them—they will\
    \ never appear in the program result set.\n\nFor example, in the following DS2\
    \ program, the variables Total and Count are declared globally and have global\
    \ scope. The variables Amount are introduced via the SET statement and also have\
    \ global scope. All of these variables can be referenced in both the RUN and TERM\
    \ methods, and all are included in the program result set.\n\n```\nproc ds2;\n\
    data;\n  dec Total Count;\n  method run();\n    set crs.one_day (keep=(Payee Amount));\n\
    \    Total+Amount;\n    Count+1;\n  end;\n  method term();\n    put Total= Count=;\n\
    \  end;\nenddata;\nrun;\nquit;\n```\n\nSAS Log:\n\nTotal=7230.5 Count=6\n\nFigure\
    \ 2.5: Report Produced by the Data Program\n\n| Obs | Total | Payee | Amount |\n\
    |---|---|---|---|\n| 1 | 9.60 | 1 Misc | $9.60 |\n| 2 | 19.91 | 2 Ice Cream |\
    \ $10.31 |\n| 3 | 37.91 | 3 Services | $18.00 |\n| 4 | 230.50 | 4 Big Retailer\
    \ | $192.59 |\n| 5 | 3230.50 | 5 Misc | $3,000.00 |\n| 6 | 7230.50 | 6 Misc |\
    \ $4,000.00 |\n"
  mdcn: "\n\n# 第 2 章：DS2 语言简介\n\n系统方法会自动执行且不接受参数。你必须在数据或线程程序中显式地定义至少一个此类方法，否则程序将无法执行。你不需要为一个或多个系统方法块编写显式代码，DS2\
    \ 编译器会在编译时自动为你创建一个缺失的系统方法的空版本。一个空方法只包含适当的 `METHOD` 语句，随后紧跟一个 `END` 语句。\n\n## 2.2.5.1\
    \ INIT 方法\n\nINIT 方法执行一次且仅执行一次，在程序启动后立即执行。它为执行程序初始化例提供了一个标准位置。以下 DATA 步和 DS2 数据产生产生的结果，但\
    \ DS2 数据程序不需要任何条件逻辑：\n\nDATA 步：\n\n```\ndata _null;\nif _n=1 then do;\nput 'Execution\
    \ is beginning';\nend;\nrun;\n```\n\nDS2 数据程序：\n\n```\nproc ds2;\ndata _null;\n\
    method init();\nput 'Execution is beginning';\nenddata;\nrun;\nquit;\n```\n\n\
    ## 2.2.5.2 RUN 方法\n\nRUN 方法模拟传统 SAS DATA 步的性能。它在 INIT 方法执行完毕后立即开始运行，并作为一个数据驱动的循环。RUN\
    \ 方法为输入数据集中的每一行（观测值）迭代一次。RUN 方法是唯一在 `END` 语句中包含隐式输出的方法。DATA 步和 DS2 数据程序产生的结果：\n\
    \n```\ndata new_data;\nif _n=1 then do;\nput 'Execution is beginning';\nend;\n\
    set crsone_day;\nrun;\n```\n\n```\nproc ds2;\ndata new_data;\nmethod init();\n\
    put 'Execution is beginning';\nend;\nmethod run();\nset crs.one_day;\nend;\nenddata;\n\
    run;\nquit;\n```\n\n## 2.2.5.3 TERM 方法\n\nTERM 方法执行一次且仅执行一次，在 RUN 方法完成执行后、数据或线程程序终止前立即执行。它为执行程序终止代码提供了一个合适的位置。此\
    \ DATA 步和 DS2 数据程序产生相同的结果，但 DATA 步需要使用 `END=` 语句选项、关联的自动变量以及条件逻辑判断来实现 DS2 数据程序的功能，而无需任何额外的资源或代码：\n\
    \n```\ndata new_data;\nif _n=1 then\n  put 'Execution is beginning';\nend;\nset\
    \ crs.one_day end=last;\nif last=1 then\n  put 'Execution is ending';\nend;\n\
    run;\n```\n\n```\nproc ds2;\ndata _null_;\nmethod init();\n  put 'Execution is\
    \ beginning';\nend;\nmethod run();\n  set crs.one_day;\nend;\nmethod term();\n\
    \  put 'Execution is ending';\nend;\nenddata;\nrun;\nquit;\n```\n\n## 2.2.6 用户定义方法\n\
    \n在 DS2 中，你可以轻松地定义并使用自己的可重用代码块。这些代码块被称为用户定义方法，它们可以通过引用或值来接收参数值。当所有参数都通过值传递到方法时，这些值在方法内部可用作计算，且方法可以向调用进程返回一个单值——类似于\
    \ Base SAS 函数。此数据程序使用用户定义方法将温度从摄氏度转换为华氏度。\n\n```\nproc ds2;\n/* No输出 DATA set.\
    \ Results returned as a report (like SQL) */\ndata;\n  dcl double DegF;\n  /*\
    \ 方法返回一个值 */\nmethod c2f(double Tc) returns double;\n  /* 摄氏度转华氏度 */\n  return\
    \ ((Tc*9)/5+32);\nend\nmethod init();\n  do DegC=0 to 30 by 15;\n    DegF=c2f(DegC);\n\
    \    output;\nend;\nenddata;\nrun;\nquit;\n```\n\n图 2.2：温度转换输出\n\n| DegC | DegF\
    \ |\n|---|---|\n| 15 | 59 |\n| 30 | 86 |\n\n一个或多个参数通过引用传递，这些值在方法内部可用作计算，且这些值可以在调用处被方法修改，类似于\
    \ Base SAS 程。在 DS2 中，通过引用传递的参数被称为 IN_OUT 参数。具有 IN_OUT 参数的方法不能返回值，但在执行期间可以修改多个\
    \ IN_OUT 参数。此数据程序使用用户定义方法将温度从华氏度转换为摄氏度，但通过引用传递了温度：\n\n```\nproc ds2;\ndata;\n\
    \  dcl double Tf;\n  /* 方法在调用处修改值 */\n  method f2c(inout double T);\n  /* 华氏度转摄氏度（四舍五入）\
    \ */\n  T=round((T-32)*5/9);\nend;\nmethod init();\n  do Tf=0 to 100 by 10;\n\
    \    f2c(Tf);\n    output;\nend;\nenddata;\nrun;\nquit;\n```\n\n在 DS2 程序中，所有对象、变量和代码块必须具有标识符（名称）。标识符的作用域是全局或局部的，标识符在其作用域内是唯一的。标识符的作用域决定了可以在程序的哪个部分引用它。图\
    \ 2.4 显示了一个具有全局和局部作用域标识符的 DS2 程序，并指示了引用时将返回哪些值。\n\n图 2.4：DS2 数据程序变量作用域\n\n图 2.4：具有全局和局部作用域标识符的\
    \ DS2 程序，并指示了引用时将返回哪些值。\n\n```proc ds2;\ndata _null_;\nmethod init();\n  put 'Execution\
    \ is beginning';\nend;\nmethod run();\n  set crs.one_day;\nend;\nmethod term();\n\
    \  put 'Execution is ending';\nend;\nenddata;\nrun;\nquit;\n```\n\n"
