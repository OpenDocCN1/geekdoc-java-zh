  - "[PAGE 45]\n\n# Chapter 3: DS2 Data Program Details 29\n\n# 3.2.2.3 All Variables\
    \ Not Introduced via the SET Statement Should Be Declared\n\nBy default, failure\
    \ to declare a new variable results in a warning in the SAS log. This behavior\
    \ can be controlled globally with the SAS system option DS2SCOND. The system option\
    \ can be overridden for a particular DS2 instance using the PROC DS2 SCOND.\n\n\
    Table 3.1: DS2SCOND and SCOND Option Values and Effects\n\n| Option Setting |\
    \ Effect for Undeclared Variables |\n|---|---|n NONE | Program compiles and executes\
    \ normally. There is no entry in the log. |\n NOTE | Program compiles and executes\
    \ normally. A note is generated in the SAS log for each declared variable. |\n\
    \ WARNING (default) | Program compiles and executes normally. A warning is generated\
    \ in the SAS log for each declared variable. |\n ERROR | An error is generated\
    \ in the SAS log for each declared variable. Program fails to compile and not\
    \ execute. |\n\nHere is an example of the system option DS2SCOND to ERROR:\n\n\
    ```\noptions ds2cond=ERROR;\nproc ds2;\ndata _null_;\nmethod run();\nText='Hello,\
    \ world';\nx=1;\nput Text= X=\\;\n;\nenddata;\nrun;\nquit;\n```\n\nSAS Log:\n\n\
    ```\nERROR: Compilation error.\nERROR: Line 92: No DECLARE for assigned-to-variable\
    \ text; creating it as a global variable of type char.\nERROR: Line 93: No DECLARE\
    \ for assigned-to-variable x; creating it as a global variable of type double.\n\
    \nNOTE: The SAS stopped processing this step because of errors.\n```\n\nHere is\
    \ an example of overriding the system option using the PROC DS2 option SCOND:\n\
    \n```\noptions ds2cond=ERROR;\nproc ds2 scond=NONE;\ndata _null_;\nmethod run();\n\
    ```"
