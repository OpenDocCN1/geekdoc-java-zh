    # 3.2.3.3 ATTRIB, LABEL, LENGTH, FORMAT, and INFORMAT Statements


    Although DS2 does not include ATTRIB, LABEL, LENGTH, FORMAT, and INFORMAT

    statements, the same functionality is provided by the DECLARE statement HAVING
    clause.

    Because each of those statements had their own syntax, I consider it a great benefit
    to have only

    one one statement used to accomplish all of these things!


    ```

