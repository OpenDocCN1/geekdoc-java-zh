    \ | 51.6% | -$2,597.20 |\n| Nautilus SportsWear Inc | Capy Hood | 24100100031\
    \ | 5000 | 7083 | $24,050.00 | $8,450.00 | 22098.6 | 64.9% | -$6,498.60 |\n| Top\
    \ Sports Inc | Baseball White Small | 240702020007 | 5000 | 5862 | $33,150.00\
