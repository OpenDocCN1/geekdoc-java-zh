    # Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques


    Figure 1.3: Parallel Processing with Threads: SAS Compute Platform versus In-Database


    # DS2 threads parallel processing on the SAS compute platform

    # DS2 threads parallel processing in-database


    ![](img/ef05c3db88dda150abd07414dd206d3f_20_0.png)


    As you can see in Figure 1.3, using DS2 and data programs with the SAS In-Database
    Code Accelerator allows the DS2 code to compile and execute on the massively parallel
    DBMS hardware. If the process reads from a DBMS table and also writes to a DBMS
    table, then only the DS2 code goes into the DBMS, and only the SAS log comes out.
    All processing takes place in the DBMS. This concept "taking the code to the data"
    instead of the traditional "bringing the data to the code" greatly reduces the
    amount of data movement required for processing, extends the computational capabilities
    of the DBMS to include SAS functions and processing logic, and takes full advantage
    of the massively parallel processing (MPP) capabilities of the DBMS. If you are
    a SAS programmer or a data scientist in an environment that includes SAS, you
    will find that DS2 quickly becomes a go-tool for data manipulation.


    ## 1.1.1 What to Expect from This Book


    Data wrangling, as I use the term, is more than cleaning up data to prepare it
    for analysis. A data wrangler acquires data from diverse sources, and then structures,
    organizes, and combines it in unique ways to facilitate analysis and obtain new
    insights. This book teaches you to wrangle data using DS2, highlighting the similarities
    and differences between DS2 data programs and traditional DATA step processing
    as well as using DS2’s parallel-processing power to boost your data-wrangling
    speed.


    ## Chapter 1: Getting Started 5


    Here is what you will be able to do after you finish this book:


    - identify the types of processes for which the language was designed and understand
    the conditions indicating that DS2 is a good choice when attempting to improve
