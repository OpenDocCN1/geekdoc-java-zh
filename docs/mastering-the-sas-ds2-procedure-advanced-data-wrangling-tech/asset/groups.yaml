- md: "\n## 3.3.4 Processing SAS Missing and ANSI Null Values\n\nSAS missing values\
    \ and ANSI null values are two very different representations of unknown values\
    \ in a data store. ANSI null values are actually not at zero: zeros of data are\
    \ stored when the actual value for a variable is not known. As a result, nothing\
    \ can be determined about the unknown value. So a null value is an unknown value.\n\
    \nSAS takes a different approach to missing data. It stores special codes for\
    \ missing values in each variable where the actual value is unknown. Although\
    \ the actual value for this variable is not known, MISSING itself is a known value\
    \ of sorts. There are three types of missing values in SAS:\n\n- character missing\
    \ value, represented by a blank (' ') when displayed in reports\n- standard numeric\
    \ missing, represented by a period ('.') when displayed in reports\n- special\
    \ numeric values (27 levels), represented by '_' and 'A' through 'Z'\n\n### 3.3.4.1\
    \ SAS Missing versus Null: The Rest of the Story\n\nIf the idea of special values\
    \ is news to you, SAS might see a bit of obsessive in its focus for missing values.\
    \ However, there is a good reason for all of this focus. Consider a scenario where\
    \ you are tasked with collecting demographic data in a neighborhood. Here is a\
    \ copy of your questionnaire:\n\n| House # | Question | Response |\n|---|---|---|\n\
    | | How many people reside in this home? | |\n| | How long have you lived here?\
    \ | |\n| | What is the total household annual income? | |\n\nWith your clipboard\
    \ in hand, you valiantly set forth on your mission to collect data. You knock\
    \ on the first door and ask your questions. When asked about household income,\
    \ the first respondent answers, \"How should I know? My spouse works-I just stay\
    \ home and drink beer all day! Well, it seems our survey is off to a very poor\
    \ start! At house number 3, you are still rattled from the encounter at house\
    \ number one that you forgot to ask the income question at. And, just to make\
    \ the day more \"interesting,\" the respondent at house number 5 becomes aggressive.\
    \ The rest of your day goes reasonably, with respondents answering all of the\
    \ questions. When the survey is complete, there are several item data points for\
    \ which we don't have a value, but we know the reasons why the data is missing:\
    \ some respondents refused to answer, others were clueless, and at times, we forgot\
    \ to ask the household income question.\n\nIf we store data in SAS, we can code\
    \ each of the missing values to know why the data is missing. .R could indicate\
    \ that refused to answer, .C that the respondent was reluctant, .F that I forgot\
    \ to ask for the salary value. The cls.survey data contains our income survey\
    \ data stored in SAS and uses special missing values to indicate the reason for\
    \ the data is missing. The tblr.survey contains the data stored in a Microsoft\
    \ Access database that provides only NULL as a means of storing unknown data.\
    \ Executing program Ch3.4.1.sas to analyze the data reveals that the descriptive\
    \ statistics produced by PROC MEANS are the same, no matter what the data source,\
    \ PROC MEANS ignores all of the missing values when computing statistics. Figure\
    \ 3.7 demonstrates that running a PROC MEANS analysis of the survey data produces\
    \ the results for data stored as SAS data sets with special missing values and\
    \ data stored in DBMS tables with null values:\n\nFigure 3.7: PROC MEANS Results\n\
    \n| Analysis Variable: Salary | Analysis of Database survey data | | | | | | |\
    \ | | |\n| --- | --- | --- | --- | --- | --- | --- | --- | --- | --- |\n| Minimum\
    \ | Mean | Median | Maximum | Std Dev | Minimum | Mean | Median | Maximum | Std\
    \ Dev |\n| 19603 | 34783 | 34806 | 50870 | 4896 | 19603 | 34783 | 34806 | 50870\
    \ | 4896 |\n\nExecuting FREQ against salary values in SAS provides significant\
    \ information about why the values are missing. The same code executed against\
    \ database provides no information at all, because all missing values are stored\
    \ as null in the database. I think of null as information blank hole-no what you\
    \ put into a null, no information comes out. Figure 3.8 demonstrates that PROC\
    \ FREQ analysis of the SAS data set containing special missing values can help\
    \ us determine why the data items were missing, but the same analysis on data\
    \ stored in a DBMS gives no information about why the data was missing because\
    \ all missing values are stored as null in a DBMS.\n\nFigure 3.8: PROC FREQ Results\
    \ Using Custom Forms\n\n| Formatted Frequencies of SAS Salary Values | Formatted\
    \ Frequencies of Database Values | | |\n| --- | --- | --- | --- |\n| Salary |\
    \ Frequency | Percent | Salary | Frequency | Percent |\n| clueless | 1 | 0.1 |\
    \ missing | 42 | 4.2 |\n| forgot | 10 | 1.0 | obtained | 958 | 9.8 |\n| refused\
    \ | 31 | 3.1 | | |\n| obtained | 95 | 9.8 | | |\n\nThe concepts of null and missing\
    \ are so fundamental to how data is processed and so radically different from\
    \ each other, PROC DS2 actually has two separate operating modes on which concept\
    \ handling nonexistent data is given: SAS mode and ANSI mode. But before I launch\
    \ a detailed description of missing null, I want to make clear that, in DS2, only\
    \ those data types are available in both Base SAS DATA step and DS2 programs (DOUBLE\
    \ and CHAR) are capable of containing SAS missing values. Variables of any other\
    \ data type are strictly ANSI in their behavior. They will always contain null\
    \ when assigned a nonexistent value.\n\n### 3.3.4 PROC DS2 SAS Mode\n\nSAS mode\
    \ is the default mode for PROC DS2, and thus it is never specified in the PROC\
    \ DS2 statement. In SAS mode, expressions resolving to an unknown value produce\
    \ SAS missing values as an intermediate result. When those values are assigned\
    \ to CHAR or DOUBLE variables, those variables will contain a SAS missing value.\n\
    \n### Chapter 3: DS2 Data Program Details\n\nHere are the other pertinent rules\
    \ for missing and null values while operating DS2 in SAS mode:\n\n1. Missing values\
    \ are automatically converted to null when assigned to a variable of any data\
    \ type other than CHAR or DOUBLE.\n2. Other times when null values are automatically\
    \ converted to missing:\n   a. used in expressions containing CHAR or DOUBLE values\n\
    \   b. when assigned to a CHAR or DOUBLE type variable\n   c. when passed to a\
    \ Base SAS function as a parameter value\n3. In expressions comparing a character\
    \ value to a single blank, the single blank is interpreted as a SAS character\
    \ missing value.\n\nExecuting program Ch3.3.4.2.sas demonstrates the handling\
    \ of SAS missing and ANSI null values in PROC DS2 operating in SAS mode.\n\nSAS\
    \ Log:\n\n```\n*** From Data Set ***\n*** DS2 CHAR Values - SAS Mode ***\nC is\
    \ =\nmissing(C) is true.\nnull(C) is not true.\n\n*** DS2 DOUBLE Values - SAS\
    \ Mode ***\nN is =\nmissing(N) is true.\nnull(N) is not true.\n\n*** SAS Mode\
    \ Using Varchar and Decimal Variables ***\n*** DS2 VARCHAR Values ***\nVar is\
    \ =\nmissing(Var) is true.\nnull(Var) is true.\n\n*** DS2 DECIMAL Values ***\n\
    Dec is =\nmissing(Dec) is true.\nnull(Dec) is true.\n```\n\nBasically, the behavior\
    \ of null and missing values in DS2 SAS mode are just as we would expect.\n\n\
    ### 3.3.4.3 PROC DS2 ANSI Mode\n\nYou invoke PROC DS2 in ANSI mode by including\
    \ the ANSIMODE option in the DS2 statement. In ANSI mode, expressions resolving\
    \ to an unknown value produce ANSI null values as an intermediate result. Numeric\
    \ missing values are immediately converted to ANSI null, so DOUBLE variables never\
    \ contain SAS missing values.\n\nHere are the other pertinent rules for missing\
    \ and null values while operating DS2 in ANSI mode:\n\n- Numeric missing values\
    \ are automatically converted to null when read from a SAS data set.\n- SAS character\
    \ variables read from SAS data sets are actually stored with space filling the\
    \ entire length of the variable. In ANSI mode, these variables appear to be character\
    \ strings padded entirely with ANSI null values, and even the SAS MISSING function\
    \ will not evaluate them as missing.\n- Numeric null values are automatically\
    \ converted to missing when passed to a Base SAS function as a parameter value.\n\
    - In comparisons a character value to a single blank, the single blank is interpreted\
    \ as an ANSI space character, not null.\n\nExecuting program Ch3_3.43.sas demonstrates\
    \ the handling of SAS missing and ANSI null values in PROC DS2 operating in ANSI\
    \ mode.\n\nSAS Log:\n\n```\n*** From SAS Data Set ***\n*** DS2 CHAR Values - ANSI\
    \ Mode ***\nC is not =\nmissing(C) is not true.\nnull(C) is not true.\n\n*** DS2\
    \ DOUBLE Values - ANSI Mode ***\nN is not =\nmissing(N) is true.\nnull(N) is true.\n\
    \n*** ANSI Mode Using Varchar and Decimal Variables ***\n*** DS2 VARCHAR Values\
    \ ***\nVar is not =\nmissing(Var) is true.\nnull(Var) is true.\n\n*** DS2 DECIMAL\
    \ Values ***\nDec is not =\nmissing(Dec) is true.\nnull(Dec) is true.\n```\n\n\
    Note that the VARCHAR and DECIMAL null values evaluate exactly the same as they\
    \ did in SAS mode, but the CHAR and DOUBLE values behave differently.\n"
  mdcn: "\n\n## 3.3.4 处理 SAS 缺失值与 ANSI 空值\n\nSAS 缺失值和 ANSI 空值是数据存储中未知值的两种非常不同的表示方式。ANSI\
    \ 空值实际上并不是零：当变量的实际值未知时，存储的是数据的零。因此，无法对该未知值得出任何结论。所以，空值就是一个未知值。\n\nSAS 对缺失数据采取了不同的方法。它在每个实际值未知的变量中存储了缺失值的特殊代码。虽然该变量的实际值未知，但\
    \ `MISSING` 本身是某种已知的值。SAS 中有三种缺失值：\n\n- 字符缺失值，在报告中显示为为空格（' '）\n- 标准数值缺失值，在报告中显示为句号（'.'）\n\
    - 特殊数值值（27 级），在报告中显示为 '_' 和从 'A' 到 'Z'\n\n### 3.3.4.1 SAS 缺失值与空值：故事的后续\n\n如果特殊值这个概念对你来说是新鲜的，那么\
    \ SAS 可能会对其对缺失值的关注显得有些执着。然而，这种关注是有充分理由的。考虑这样一个场景：你被要求在某个社区收集人口统计学数据。以下是你的问卷副本：\n\
    \n| 门牌号 | 问题 | 回答 |\n|---|---|---|\n| | 这个家里住了多少人？ | |\n| | 你在这里住了多久了？ | |\n|\
    \ | 家庭年总收入是多少？ | |\n\n你手里拿着写板，英勇地开始了收集数据的任务。你敲了第一扇门并提问。当被问及家庭收入时，第一个受访者回答道：“我怎么知道？我配偶在工作——我整天呆在家喝啤酒！噢，我们的调查有了一个非常糟糕的开头！”在\
    \ 3 号房，你还在为 1 号房的遭遇感到心神未定，以至于忘记询问收入问题。而且，为了让这一天更有“趣”，5 号房的受访者变得具有攻击性。你剩下的时间过得相当顺利，受访者回答了所有问题。当调查完成时，有几个项目数据点没有值，但我们知道数据缺失的原因：有些受访者拒绝回答，另一些完全不清楚，有时我们忘记了询问家庭收入问题。\n\
    \n如果我们在 SAS 中存储数据，可以对每个缺失值进行编码，以知道数据缺失的原因。`.R` 可能表示拒绝回答，`.C` 表示受访者犹豫，`.F` 表示我忘记询问工资值。`cls.survey`\
    \ 数据包含了存储在 SAS 中的收入调查数据，并使用特殊缺失值指示数据缺失的原因。`tblr.survey` 包含存储在 Microsoft Access\
    \ 数据库中的数据，它仅提供 NULL 作为存储未知的方法。执行程序 `Ch3.4.1.sas` 分析数据发现，无论数据源如何，由 PROC MEANS 产生的描述性统计结果都是相同的，因为\
    \ PROC MEANS 在计算统计数据时会忽略所有的缺失值。图 3.7 显示，对调查数据运行 PROC MEANS 分析会产生存储为具有特殊缺失值的 SAS\
    \ 数据集以及存储在具有空值的 DBMS 表中的数据的结果：\n\n图 3.7：PROC MEANS 结果\n\n| 分析变量：薪水 | 数据库调查数据分析\
    \ | | | | | | | | | | |\n| --- | --- | --- | --- | --- | --- | --- | --- | ---\
    \ | --- |\n| 最小值 | 平均值 | 中位数 | 最大值 | 标准差 | 最小值 | 平均值 | 中位数 | 最大值 | 标准差 |\n| 19603\
    \ | 34783 | 34806 | 50870 | 4896 | 19603 | 34783 | 34806 | 50870 | 4896 |\n\n\
    在 SAS 中对薪水值执行 FREQ 可以提供关于这些值缺失原因的重要信息。在数据库上执行相同的代码则无法提供任何信息，因为数据库中的所有缺失值都存储为 null。我将\
    \ null 视为一个信息黑洞——无论你向 null 中存入什么，都不会有信息输出。图 3.8 显示，对包含特殊缺失值的 SAS 数据集进行 PROC FREQ\
    \ 分析可以帮助我们确定数据项缺失的原因，但对存储在 DBMS 中的数据进行相同分析则无法提供关于数据缺失原因的信息，因为 DBMS 中的所有缺失值都存储为\
    \ null。\n\n图 3.8：使用自定义表单 PROC FREQ 结果\n\n| SAS 薪水值的格式化频率 | 数据库值的格式化频率 | | |\n\
    | --- | --- | --- | --- |\n| 薪水 | 频率 | 百比 | 薪水 | 频率 | 百比 |\n| 不清楚 | 1 | 0.1 |\
    \ 缺失 | 42 | 4.2 |\n| 忘记 | 10 | 1.0 | 已获得 | 958 | 9.8 |\n| 拒绝 | 31 | 3.1 | | |\
    \ |\n| 已获得 | 95 | 9.8 | | | |\n\nnull 和缺失的概念对于数据处理方式来说是如此基础，且彼此之间截然不同，PROC DS2\
    \ 实际上有两个独立的运行模式，对于处理不存在的数据概念给出了不同的处理方式：SAS 模式和 ANSI 模式。但在我详细描述缺失空值之前，我想明确，在 DS2\
    \ 中，只有那些在 Base SAS DATA 步和 DS2 程序中都可用的数据类型（DOUBLE 和 CHAR）能够包含 SAS 缺失值。任何其他数据类型的变量在行为上都是严格遵循\
    \ ANSI 标准的。当它们被分配一个不存在的值时，它们将始终包含 null。\n\n### 3.3.4 PROC DS2 SAS 模式\n\nSAS 模式是\
    \ DS2 的默认模式，并且在 DS2 语句中未指定。在 SAS 模式下，解析未知值的表达式会产生 SAS 缺失值。第 3 章：DS2 细节\n\n在 SAS\
    \ 模式下处理缺失和空值的其他规则如下：\n\n1. 当分配给非 CHAR 或 DOUBLE 类型变量时，缺失值会自动转换为 null。\n2. 空值会自动转换为缺失：\n\
    \   a. 在表达式中使用空值时\n   b. 分配给 CHAR 或 DOUBLE 类型变量时\n   c. 作为参数值传递给 Base SAS 函数时\n\
    执行程序 `Ch3.4.2.sas` 显示了 SAS 模式下对缺失值和空值的处理。\n\nSAS 日志：\n\n```\n*** 数据 ***\n*** 字符值\
    \ - SAS 模式 ***\nC 等于\nmissing(C) 为真。\nnull(C) 为假。\n\n*** 数值值 - SAS 模式 ***\nN 等于\n\
    missing(N) 为真。\nnull(N) 为假。\n\n*** 使用字符型和数值型的 SAS 模式 ***\n*** 字符型值 ***\nVar 等于\n\
    missing(Var) 为真。\nnull(Var) 为真。\n\n*** 数值型值 ***\nDec 等于\nmissing(Dec) 为真。\nnull(Dec)\
    \ 为真。\n```\n\n基本上，SAS 模式下 null 和缺失值的行为正如我们预期的那样。\n\n### 3.3.4.3 PROC DS2 ANSI\
    \ 模式\n\n通过在 DS2 语句中包含 ANSIMODE 选项来调用 ANSI 模式。在 ANSI 模式下，解析未知值的表达式产生 ANSI 空值。数值缺失值立即转换为\
    \ ANSI 空，因此 DOUBLE 变量永远包含 SAS 缺失值。\n\n在 ANSI 模式下运行 DS2 的其他相关规则如下：\n\n- 从 SAS 数据集中读取的数值缺失值会自动转换为\
    \ null。\n- 从 SAS 数据集中读取的 SAS 字符实际上是用空格填充整个长度。在 ANSI 模式下，这些变量似乎完全由 ANSI 空填充，即使\
    \ SAS MISSING 函数也不会将它们评估为缺失。\n- 数值空作为参数值传递给 Base SAS 函数时会自动转换为缺失。\n- 在字符值与单个空格的比较中，单个空格被解释为\
    \ ANSI 空格字符，而不是 null。\n\n执行程序 `Ch3_3.43.sas` 显示了 ANSI 模式下 PROC DS2 对 SAS 缺失值和\
    \ ANSI 空值的处理。\n\nSAS 日志：\n\n```\n*** SAS 数据集 ***\n*** 字符值 - ANSI 模式 ***\nC 不等于\n\
