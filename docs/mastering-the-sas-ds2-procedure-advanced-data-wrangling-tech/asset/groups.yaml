- md: "\n## 3.2.2.5 Keywords Are Reserved Words\n\nThe Base SAS DATA step language\
    \ has very few reserved words. By examining the context, the compiler decides\
    \ whether a keyword should be interpreted as code or as an identifier. For example,\
    \ it is perfectly OK to name your data set or a Variable Character:\n\n```\ndata\
    \ Data;\nCharacter='A';\nput 'The character is ' Character;\nrun;\n```\n\nSAS\
    \ Log:\n\n```\nThe character is A\n```\n\nHowever, the same code in DS2 generates\
    \ syntax errors, because DS2 all keywords are reserved:\n\n```\nproc ds2;\ndata\
    \ Data/overwrite=yes;\ndcl char(1) Character;\nmethod run();\nCharacter='A';\n\
    put 'The character is ' Character;\nend;\nadddata;\nrun;\nquit;\n```\n\nSAS Log:\
    \ ERROR: Compilation error.\nERROR: Parse encountered DATA when expecting ';';\n\
    ERROR: Line 457: Parse failed: data >>> Data << /overwrite=yes;\n\n> NOTE: The\
    \ SAS System stopped processing this because of errors.\n\nFollowing ANSI SQL\
    \ standards, you can use a keyword as an identifier only if you enclose it in\
    \ double quotation marks:\n\n```\nproc ds2;\ndata \"Data\"/overwrite=yes;\ndcl\
    \ char(1) \"Character\"\nmethod run();\n\"Character\"='A';\nput 'The character\
    \ is ' \"Character\"\nend;\nadddata;\nrun;\nquit;\n```\n\nSAS Log:\n\nThe character\
    \ is A\nNOTE: Execution succeeded. One row affected.\n\n## 3.2.2.6 DS2 Uses ANSI\
    \ SQL Quoting Standards\n\nIn DS2, double quotation marks are used only to delimit\
    \ an identifier. Single quotation marks are required to delimit:\n\n```\nproc\
    \ ds2;\ndata _null;\ndcl char(25) \"Character\";\nmethod run();\n  \"Character\"\
    ='This is the message.';\n  put \"Character\";\nend;\nenddata;\nrun;\nquit;\n\
    ```\n\nSAS Log:\n\nThis is the message.\nNOTE: Execution succeeded. No rows affected.\n\
    \nThis requirement can be problematic when trying to resolve macro variables as\
    \ all or part of a character constant value in DS2. If the macro reference is\
    \ placed in the single quotation marks that are required for constant text in\
    \ DS2, the macro variable fails to resolve. That is because single quotation marks\
    \ prevent tokenization of the enclosed text:\n\n```\n%let msg=This is the message;\n\
    proc ds2;\ndata _null;\ndcl char(25) \"Character\";\nmethod run();\n  \"Character\"\
    ='&msg';\n  put \"Character\";\nend;\nenddata;\nrun;\nquit;\n```\n\nSAS Log:\n\
    \n&msg\nNOTE: Execution succeeded. No rows affected.\n\nIf you place the macro\
    \ reference in double quotation marks so that it can be tokenized and resolved,\
    \ DS2 will interpret the resolved text as identifier instead of constant text:\n\
    \n```\n%let msg=This is the message;\nproc ds2;\ndata _null;\ndcl char(25) \"\
    Character\";\nmethod run();\n  \"Character\"=&msg;\n  put \"Character\";\nend;\n\
    enddata;\nrun;\nquit;\n```\n\nSAS Log:\n\n> WARNING: Line nnn: No DECLARE for\
    \ referenced variable \"this is the message. creating it as a global variable\
    \ of type double.\nNOTE: Execution succeeded. No rows affected.\n\nAs we can see\
    \ from the log, DS2 interpreted \"This is the message.\" as a variable name. Because\
    \ there was no indication of what type of variable to create, DS2 created a double-precision,\
    \ floating-point numeric (SAS numeric) variable name \"this is the message\".\
    \ The value of this new variable was assigned to the \"Character\" variable, which\
    \ is a text variable. The automatic conversion from numeric to character produced\
    \ the '.' that we then see in the log. We can tell well what happened because\
    \ of the warning message produced by the use of an undeclared variable.\n\nTo\
    \ facilitate macro-generated text in DS2 literals, SAS provides the autocall macro\
    \ %TSLIT. This allows all numeric strings to resolve, and then takes the resulting\
    \ text and applies a real single quote mark to the beginning and end of the text\
    \ text. Finally, SAS sends the resulting text back to the word scanner. This makes\
    \ macro variable resolution as expected in DS2:\n\n```\n%let msg=This is the message;\n\
    proc ds2;\ndata _null;\ndcl char(25) \"Character\";\nmethod run();\n  \"Character\"\
    =%tslit(&msg);\n  put \"Character\";\nend;\nenddata;\nrun;\nquit;\n```\n\nSAS\
    \ Log:\n\n> This is the message.\nNOTE: Execution succeeded. No rows affected.\n\
    \n## 3.2.3 DS2 \"Missing\" Features\n\nAlthough the similarity of DS2 data program\
    \ syntax to that of the Base SAS step is helpful in getting started with DS2 programming,\
    \ you will eventually notice that some of beloved DATA step statements and functions\
    \ are not available in DS2. You'll also notice that several new, unfamiliar statements\
    \ and functions will pop up in the DS2 lexicon. In most cases, there is no loss\
    \ of functionality-DS2 has a different approach to resolving the problem.\nWe\
    \ will examine several cases where it appears Base SAS DATA step functionality\
    \ lost well as the new approaches DS2 takes to get the job done.\n\n### 3.2.3.1\
    \ WHERE Statement\n\nI was shocked when I realized that DS2 did not include a\
    \ WHERE statement.\n\n```\nproc ds2;\ndata test/overwrite=yes;\nmethod run();\n\
    \  set crs.one_day;\n  where amount<15;\nenddata;\nrun;\nquit;\n```\n\nSAS Log:\n\
    \n```\nERROR: Compilation error.\nERROR: Missing END statement for the method\
    \ run.\nERROR: Parse encountered WHERE when expecting end of input.\nERROR: Line\
    \ nnn: Parse failed: >>> where amount<15;\n```\n\nI couldn't find a WHERE statement\
    \ in any of the DS2 documentation. But while researching this \"problem\" I made\
    \ a delightful discovery-DS2 allows you to write an SQL query in the SET statement,\
    \ ing the SQL result set as if it were a data set! Now I begin to understand just\
    \ \"tight integration between DS2 and SQL\" can accomplish. For example, I can\
    \ join data sets, order the results, and use a SET statement to ingest the SQL\
    \ result set and perform DATA-step BY grouping process. Using this technique,\
    \ I can produce detail and summary output data, all in a single DS2 data step:\n\
    \n```\nproc ds2;\ndata detail (Keep=Employee_ID Dept_Total) \nsummary (Keep=Department)\n\
    overwrite=yes;\ndcl double Dept_Total 0;\nmethod run();\nset crs.one_day\nwhere\
    \ amount<15;\nby Department;\nif first.Department then Dept_Total=0;\nDept_Total\
    \ = Dept_Total+1;\nif last.Department then output;\nenddata;\nrun;\nquit;\n```\n"
  mdcn: "\n\n## 3.2.2.5 关键字是保留字\n\nBase SAS DATA 步语言的保留字非常少。通过检查上下文，编译器会决定将关键字解释为代码还是标识符。例如，将你的数据集或变量命名为\
    \ `Character` 是完全可以的：\n\n```\ndata Data;\nCharacter='A';\nput 'The character is\
    \ ' Character;\nrun;\n```\n\nSAS Log:\n\n```\nThe character is A\n```\n\n然而，相同的代码在\
    \ DS2 中会产生语法错误，因为 DS2 的所有关键字都是保留字：\n\n```\nproc ds2;\ndata Data/overwrite=yes;\n\
    dcl char(1) Character;\nmethod run();\nCharacter='A';\nput 'The character is '\
    \ Character;\nend;\nadddata;\nrun;\nquit;\n```\n\nSAS Log: ERROR: Compilation\
    \ error.\nERROR: Parse encountered DATA when expecting ';';\nERROR: Line 457:\
    \ Parse failed: data >>> Data << /overwrite=yes;\n\n> NOTE: SAS 系统由于错误停止了处理。\n\
    \n遵循遵循 ANSI SQL 标准，只有在将关键字包含在双引号中时，你才能将其用标识符：\n\n```\nproc ds2;\ndata \"Data\"\
    /overwrite=yes;\ndcl char(1) \"Character\"\nmethod run();\n\"Character\"='A';\n\
    put 'The character is ' \"Character\"\nend;\nadddata;\nrun;\nquit;\n```\n\nSAS\
    \ Log:\n\nThe character is A\nNOTE: Execution succeeded. One row affected.\n\n\
    ## 3.2.2.6 DS2 使用 ANSI SQL 引用标准\n\n在 DS2 中，双引号仅用于界定标识符。单引号用于界定：\n\n```\nproc ds2;\n\
    data _null;\ndcl char(25) \"Character\";\nmethod run();\n  \"Character\"='This\
    \ is the message.';\n  put \"Character\";\nend;\nenddata;\nrun;\nquit;\n```\n\n\
    SAS Log:\n\nThis is the message.\nNOTE: Execution succeeded. No rows affected.\n\
    \n当尝试在 DS2 中将宏变量解析为字符常量值或其部分时，这一要求可能会产生问题。如果将宏引用放在 DS2 常量文本所需的单引号中，则宏变量将无法解析。这是因为单引号会阻止所包含文本的标记标记化：\n\
    \n```\n%let msg=This is the message;\nproc ds2;\ndata _null;\ndcl char(25) \"\
    Character\";\nmethod run();\n  \"Character\"='&msg';\n  put \"Character\";\nend;\n\
    enddata;\nrun;\nquit;\n```\n\nSAS Log:\n\n&msg\nNOTE: Execution succeeded. No\
    \ rows affected.\n\n如果你将宏引用放在双引号中以便其进行标记化化并解析，DS2 将把解析后的文本解释为标识符而不是常量文本：\n\n```\n\
    %let msg=This is the message;\nproc ds2;\ndata _null;\ndcl char(25) \"Character\"\
    ;\nmethod run();\n  \"Character\"=&msg;\n  put \"Character\";\nend;\nenddata;\n\
    run;\nquit;\n```\n\nSAS Log:\n\n> WARNING: Line nnn: No DECLARE for referenced\
    \ variable \"this is the message. creating it as a global variable of type double.\n\
    NOTE: Execution succeeded. No rows affected.\n\n如我们从日志所示，DS2 将 \"This is the message.\"\
    \ 解释为了变量名。因为没有指示要创建什么类型的变量，DS2 创建了一个双精度浮点数值型（SAS 数值型）变量名 \"this is the message\"\
    。此新变量的值被赋值给 \"Character\" 变量，而这是一个文本变量。从数值到字符的自动转换产生了我们在日志中看到的 `.`。由于使用了未声明的变量而产生的警告信息，我们可以很清楚地知道发生了什么。\n\
    \n为了在 DS2 字面量中方便处理宏生成的文本，SAS 提供了自动调用宏 `%TSLIT`。这允许所有数值字符串进行解析，然后获取生成的文本，并在文本的开头和结尾处应用真实的单引号。最后，SAS\
    \ 将生成的文本传回给单词扫描器。这使得宏变量解析在 DS2 中如预期所示：\n\n```\n%let msg=This is the message;\n\
    proc ds2;\ndata _null;\ndcl char(25) \"Character\";\nmethod run();\n  \"Character\"\
    =%tslit(&msg);\n  put \"Character\";\nend;\nenddata;\nrun;\nquit;\n```\n\nSAS\
    \ Log:\n\n> This is the message.\nNOTE: Execution succeeded. No rows affected.\n\
    \n## 3.2.3 DS2 “缺失”功能\n\n尽管 DS2 数据程序语法与 Base SAS 步的相似有助于开始 DS2 编程，但你最终会发现某些喜爱的\
    \ DATA 步语句和函数在 DS2 中不可用。你还会注意到 DS2 词汇表中会出现几个新的、不熟悉的语句和函数。在大多数情况下，功能并没有丢失——DS2\
    \ 有一种不同的解决问题的方法。\n我们将检查几个似乎丢失了 Base SAS DATA 步功能的案例，以及 DS2 为完成任务采取的新方法。\n\n###\
    \ 3.2.3.1 WHERE 语句\n\n当我发现 DS2 并不包含 WHERE 语句时，我感到震惊。\n\n```\nproc ds2;\ndata test/overwrite=yes;\n\
    method run();\n  set crs.one_day;\n  where amount<15;\nenddata;\nrun;\nquit;\n\
    ```\n\nSAS Log:\n\n```\nERROR: Compilation error.\nERROR: Missing END statement\
    \ for the method run.\nERROR: Parse encountered WHERE when expecting end of input.\n\
    ERROR: Line nnn: Parse failed: >>> where amount<15;\n```\n\n我在任何 DS2 文档中都找不到 WHERE\
    \ 语句。但在研究这个“问题”时，我有了一个令人惊喜的发现——DS2 允许你在 SET 语句中编写 SQL 查询，将 SQL 结果集像数据集一样导入！现在我开始理解“DS2\
    \ 和 SQL 之间的深度集成”可以实现什么。例如，我可以连接数据集、对结果排序，并使用 SET 语句导入 SQL 结果集并执行 DATA 步 BY 分组处理。使用这种技术，我可以在单个\
    \ DS2 数据步中产生明细和汇总输出数据：\n\n```\nproc ds2;\ndata detail (Keep=Employee_ID Dept_Total)\
    \ \nsummary (Keep=Department)\noverwrite=yes;\ndcl double Dept_Total 0;\nmethod\
    \ run();\nset crs.one_day\nwhere amount<15;\nby Department;\nif first.Department\
    \ then Dept_Total=0;\nDept_Total = Dept_Total+1;\nif last.Department then output;\n\
    enddata;\nrun;\nquit;\n```\n\n"
