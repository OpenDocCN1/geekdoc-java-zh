    system commands represents an unacceptable stability risk to the host platform.


    And this concludes our comparison between the traditional DATA step language and
    DS2.

    Looking back. Now let''s dive into the new and exciting features and capabilities
    of the DS2 language!


    # 3.3 Data Types in DS2


    # 3.3.1 DS2 and ANSI Data Types


    Most SAS processes access database data via the SAS LIBNAME engine. When you are
    using a SAS/ACCESS interface engine to retrieve data from a database, all database
    data types are'
  - '[PAGE 55]


    # Chapter 3: DS2 Data Program Details 39


    converted to either fixed-width character or 8-byte floating-point numeric values
    before the data is presented to SAS for processing. This is necessary because
    Base SAS DATA steps and PROCs are designed to process SAS data, and SAS data can
    contain only those two data types.


    However, databases can contain a rich palette of ANSI data types, some of which
    have much greater precision than that achievable with an 8-byte, floating-point
    numeric. Because of the limitations of the 8-byte, floating point numeric, we
    have never been able to process these values at full precision in Base SAS. However,
    because DS2 uses its own driver to access data and does not rely on the LIBNAME
    engine engine mechanism, for the first time we can retrieve and process a wide
    variety of ANSI data types at full precision in Base SAS. The following table
    lists the ANSI data types that DS2 can process natively:


    # Table 3.2: DS2 Data Types


    | Data Type | Class | Description |

    | CHAR(n) | Character (Fixed width) | One byte per character, n = maximum number
    of characters, uses the same number of bytes in every row of data. |

    | NCHAR(n) | Character (Fixed width) | Unicode character data, two to four bytes
    per character, n = maximum number of characters, uses the same number of bytes
    in every row of data. |

    | VARCHAR(n) | Character (Variable width) | One byte per character, uses enough
    bytes to store the actual value in each row of data up to a maximum of n characters.
    |

    | NVARCHAR(n) | Character (Variable width) | Unicode character data, two to four
    bytes per character, uses just enough bytes to store the actual value in each
    row of data up to a maximum of n characters. |

    | DOUBLE | Approximate fractional numeric | 8-byte (64-bit) signed, approximate
    floating-point numeric with a maximum of 16 significant digits of precision on
    ANSI systems. |

    | REAL | Approximate fractional numeric | 4-byte (32-bit) signed, approximate
    floating-point numeric with a maximum of 9 significant digits of precision on
    ANSI systems. |

    | FLOAT(p) | Approximate fractional numeric | Signed, approximate, floating-point
    numeric with user-defined precision (p). The precision determines whether the
    value will be stored as DOUBLE or REAL. |'
  - '[PAGE 56]


    # 40 Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques


    | Data Type | Class | Description |

    |---|---|---|

    | DECIMAL(p,s) | Exact fractional numeric | Signed, exact, fixed decimal point
    numeric value of user-defined precision and scale. (p) determines the maximum
    number of significant digits, up to a maximum of 52. Scale (s) determines how
    many of the significant digits are reserved for the fractional portion of the
    value. NUMERIC(p,s) is an alias for DECIMAL. |

    | BIGINT | Integer numeric | Signed, exact whole numbers up to 19 significant
    digits. |

    | INTEGER | Integer numeric | Signed, exact whole numbers up to 10 significant
    digits. |

    | SMALLINT | Integer numeric | Signed, exact whole numbers up to 5 significant
    digits. |

    | TINYINT | Integer numeric | Single-byte signed, exact whole numbers between
    -128 and 127. |

    | BINARY(n) | Binary | Fixed-length binary data, $n$ = number of bytes allocated
    to store data in every row. |

    | VARBINARY(n) | Binary | Variable-length binary data, uses just enough bytes
    to store the actual value in each row of data up to a maximum of $n$. |

    | TIME | Time | Stores ANSI time values. |

    | DATE | Date | Stores ANSI date values. |

    | TIMESTAMP | Datetime | Stores ANSI timestamp (datetime) values. |


    ANSI TIME, DATE, and TIMESTAMP values should not be confused with SAS TIME, DATE,
    and DATETIME values are all stored as double-precision, floating-point numbers
    and adherence to external rules to be properly interpreted. SAS TIME values are
    actually SAS numeric values indicating the number of seconds between midnight
    and the time being expressed. SAS DATE values indicating the number of days between
    January 1, 1960, and the date being expressed. SAS DATETIME values are SAS numeric
    values indicating the number of seconds since midnight, January 1, 1960, and the
    date and time being expressed. These values are not interchangeable with ANSI
    DATE, TIME, and TIMESTAMP values.


    # 3.3.2 Automatic Data Type Conversion


    In programming language, all values in an expression must be presented as values
    of the same type before the expression can be resolved. With 17 different data
    types available, you can begin to see that automatic data type conversion will
    be happening more frequently in a DS2 program than it ever did in a traditional
    SAS DATA step. Because of this, by default DS2 does not write a note to the SAS
    log when automatic data type conversions occur, which might make troubleshooting
    subtle problems that were caused by data type conversion a bit'
- md: "\n# Chapter 3: DS2 Data Program Details 41\n\ndifficult. You can force DS2\
    \ to write the log whenever automatic data type conversions take place by using\
    \ the global DS2 statement DS2_OPTIONS TYPEWARN immediately before the data program\
    \ that you want to debug.\n\n### 3.3.2.1 When Data Types Are Converted\n\nIn SAS\
    \ programming, a numeric value is used in a character context or a character value\
    \ is used in a numeric context, automatic data type conversion occurs. For example,\
    \ using a numeric value as one of the arguments to the CATX concatenation function\
    \ causes the number to be converted to the BEST16 format, and the resulting text\
    \ is used in concatenation. Adding a character value to a number causes the text\
    \ to be converted to a standard SAS numeric format. If the automatic conversion\
    \ doesn't meet our requirements, we can always use explicit conversions the PUT\
    \ and INPUT functions. With DS2 and its myriad of data types, the process will\
    \ be more complex. For example, what happens if you add integer value to a DOUBLE?\
    \ There is a long and lengthy discussion in the DS2 documentation around automatic\
    \ data type conversion in a wide variety of situations, based on a hierarchy of\
    \ data priorities. The truth is, we will primarily be concerned with numeric conversions.\
    \ I use the \"rule of thumb\", which works in the majority of situations:\n\n\
    - 1. In DS2, the DOUBLE (Base SAS numeric) is king of the hill. Any expression\
    \ involving a DOUBLE or an undeclared variable will produce a DOUBLE as a result.\n\
    \    - Undeclared numeric variables are always DOUBLE.\n    - Any expression involving\
    \ a DOUBLE causes all numeric values to convert to DOUBLE. This is important to\
    \ remember when processing BIGINT or DECIMAL values in conjunction with DOUBLE,\
    \ as loss of precision can occur.\n    - Text values converted to numeric produce\
    \ DOUBLE values.\n    - All values passed to Base SAS functions are converted\
    \ to DOUBLE, if necessary, before being passed to the function.\n\n- 2. In numeric\
    \ expressions that do not involve a DOUBLE, all convert to the highest precision\
    \ data type involved in the expression. For example, if you are adding an INTEGER\
    \ value to a BIGINT, the INTEGER value will convert to BIGINT, and the expression\
    \ is resolved, producing a BIGINT value as the result.\n\n- 3. Any value passed\
    \ as a parameter to a DS2 method will be converted to the type specified for that\
    \ parameter when the method was defined. For earlier we expects to be a single\
    \ DOUBLE value. If the c2f method is defined as an INTEGER, if i call c2f(MyTemp)\
    \ the value of MyTemp will be converted to DOUBLE before being passed to the c2f\
    \ method.\n\n### 3.3.2.2 Troubleshooting Automatic Type Conversion Issues\n\n\
    As you can see, automatic data type conversions happen with great frequency during\
    \ DS2 processing. In order to prevent saturating the log with data conversion\
    \ notes, DS2 programs do not produce notes unless the TYPEWARN statement is used\
    \ to help troubleshooting problems. DS2_OPTIONS settings remain in effect only\
    \ for the next program, and they should be placed immediately before the DS2 data\
    \ program:\n\n```\nproc ds2;\nds2 options TYPEWARN;\n```\n\n# 4 Mastering the\
    \ SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\n```\ndata null;\ndcl\
    \ decimal(52,5) Dec;\ndcl double SASNum;\ndcl char(5) SASChar;\nmethod init();\n\
    \  Dec=12345678901234567890.9n;\nSASNum=1.1;\nSASChar='1.1';\nDec=Dec+SASChar;\n\
    put 'dec=12345678901234567892.00000';\nput dec=\\nput;\nDec=12345678901234567890.99999n;\n\
    Dec=Dec+SASNum;\nput 'dec=12345678901234567892.00000';\nput dec=\\nput;\nendata;\n\
    run;\nquit;\n```\n\nSAS Log:\n\n```\ndec=12345678901234567892.00000\nDec=123456789012340000000.00000\n\
    \ndec=12345678901234567892.00000\nDec=123456789012340000000.00000\n\nWARNING:\
    \ Implicit conversion of char type to double type. Statement\n145.\nWARNING: Implicit\
    \ conversion of decimal type to double type.\nStatement 145.\nWARNING: Implicit\
    \ conversion of double type to decimal type.\nStatement 145.\nWARNING: Implicit\
    \ conversion of decimal type to double type.\nStatement 150.\nWARNING: Implicit\
    \ conversion of double type to decimal type.\nStatement 150.\nNOTE: Execution\
    \ succeeded. No rows affected.\n```\n\n### 3.3.3 Non-coercible Data Types\n\n\
    Binary and time-related data types will not automatically be converted to any\
    \ other data type except character. These data types are classified as non-coercible:\n\
    \nTable 3.3: Non-coercible Data Types\n\n| Data Type | Class | Comments |\n|---|---|---|\n\
    | BINARY(n) | Binary | Non-coercible and no explicit conversion method is available.\
    \ |\n\n# Chapter 3: DS2 Data Program Details\n\n| Data Type | Class | Comments\
    \ |\n|---|---|---|\n| BINARY(n) | Binary | Non-coercible and no explicit conversion\
    \ method is available. |\n| TIME | Time | Non-coercible. TO_DOUBLE allows explicit\
    \ conversion to a double SAS value. |\n| DATE | Date | Non-coercible. TO_DOUBLE\
    \ allows explicit conversion to a double SAS value. |\n| TIMESTAMP | Datetime\
    \ | Non-coercible. TO_DOUBLE allows explicit conversion to a double SAS value.\
    \ |\n\n### 3.3.3.1 Explicit Conversion for Non-coercible Data Types\n\nDS2 provides\
    \ functions for conversion of ANSI TIME, DATE, and TIMESTAMP values to the corresponding\
    \ SAS TIME, DATE, and TIMESTAMP values.\n\n### 3.3.3.2 TO_TIMESTAMP, TO_DATE,\
    \ and TO_TIME Functions\n\nThe TO_TIMESTAMP function accepts a single DATETIME\
    \ value and returns the corresponding ANSI TIMESTAMP. Similarly, the TO_DATE and\
    \ TO_TIME functions accept a single DATE or TIME value respectively.\n\n```\n\
    proc ds2;\n  dcl timestamp ANSI_Timestamp;\n  dcl date ANSI_Date;\n  dcl time\
    \ ANSI_Time;\n  double SAS_Datetime format datetime25.6;\n  double SAS_date format\
    \ yymmdd10.;\n  double SAS_Time format tod15.6;\n  method ();\n    ANSI_Timestamp='2017-09-07\
    \ 07:09:17.090717';\n    ANSI_Date='2017-09-07';\n    ANSI_Time='07:09:17';\n\
    \    SAS_Datetime=to_double(ANSI_Timestamp);\n    SAS_date=to_double(ANSI_Date);\n\
    \    SAS_Time=to_double(ANSI_Time);\n    put 'SAS: ' SAS_Datetime SAS_date SAS_Time;\n\
    \  end;\nenddata;\nrun;\nquit;\n```\n\n# Mastering the SAS DS2 Procedure: Advanced\
    \ Data Wrangling Techniques\n\nFigure 3.5: Date and Time Conversion\n\n| ANSI_Timestamp\
    \ | ANSI_Date | ANSI_Time | SAS_Datetime | SAS_date | SAS_Time |\n|---|---|---|---|---|---|\n\
    | 07SEP2017:07:09:17.090717 | 07SEP2017 | 07:09:17 | 07SEP2017:07:09:17.090717\
    \ | 2017-09-07 | 07:09:17 |\n\nSAS Log:\n\n| | |\n||---|---|\n| ANSI: | 2017-09-07\
    \ 07:09:17.0907170000 2017-09-07 07:09:17.0907170000 |\n| SAS: | 07SEP2017:07:09:17.090717\
    \ 2017-09-07 07:09:17.090717 |\n\nFrom the SAS log, we see that the ANSI values\
    \ look different from the way they do in the report. This is because the ANSI\
    \ values were converted to SAS DATETIME, DATE, and TIME values and formatted by\
    \ ODS.\n\n### 3.3.3.3 TO DOUBLE Function\n\nThe TO DOUBLE function accepts a single\
    \ ANSI TIME, DATE, or TIMESTAMP value and returns the corresponding SAS TIME,\
    \ DATE, or DATETIME value.\n\n```\nproc ds2;\n  data;\n    dcl timestamp ANSI_Timestamp;\n\
    \    dcl date ANSI_Date;\n    dcl time ANSI_Time;\n    double SAS_Datetime format\
    \ datetime25.6;\n    double SAS_date format yymmdd10.;\n    double SAS_Time format\
    \ tod15.6;\n    method ();\n      SAS_Datetime=to_double(ANSI_Timestamp);\n  \
    \    SAS_date=to_double(ANSI_Date);\n      SAS_Time=to_double(ANSI_Time);\n  \
    \    put 'SAS: ' SAS_Datetime SAS_date SAS_Time;\n      put 'ANSI: ' ANSI_Timestamp\
    \ ANSI_Date ANSI_Time;\n    end;\n  end;\nquit;\n```\n\nFigure 3.6: Results of\
    \ Explicit Conversion of SAS and ANSI Date, and Time\n"
  mdcn: "\n\n# 第3 章：DS2 数据程序详情 41\n\n……困难的。你可以通过在要调试的数据程序之前立即使用全局 DS2 语句 `DS2_OPTIONS\
    \ TYPEWARN`，来强制 DS2 在每次发生自动数据类型转换时写入日志。\n\n### 3.3.2.1 当数据类型被转换时\n\n在 SAS 编程中，当数值值在字符上下文中使用或字符值在数值上下文中使用时，就会发生自动数据类型转换。例如，将数值值作为\
    \ `CATX` 拼接函数的一个参数，会导致该数字被转换为 `BEST16` 格式，并将生成的文本用于拼接。将字符值加到数字上则会导致文本被转换为标准的 SAS\
    \ 数值格式。如果自动转换不能满足我们的需求，我们始终可以使用 `PUT` 和 `INPUT` 函数进行显式转换。由于有了 DS2 及其众多的数据类型，该过程将变得更加复杂。例如，如果将整数值加到\
    \ `DOUBLE` 上会发生什么？DS2 文档中围绕各种情况下的自动数据类型转换（基于数据优先级层次）进行了长且详细的讨论。事实是，我们主要关注数值转换。我使用在大多数情况下都有效的“经验法则”：\n\
    \n- 1. 在 DS2 中，`DOUBLE`（Base SAS 数值型）是王者之王。任何涉及 `DOUBLE` 或未声明变量的表达式都会产生 `DOUBLE`\
    \ 结果。\n    - 未声明的数值型变量始终是 `DOUBLE`。\n    - 任何涉及 `DOUBLE` 的表达式会导致所有数值值转换为 `DOUBLE`。在与\
    \ `DOUBLE` 配合处理 `BIGINT` 或 `DECIMAL` 值时记住这一点很重要，因为可能会发生精度丢失。\n    - 文本转换为数值会产生\
    \ `DOUBLE` 值。\n    - 传递给 Base SAS 函数的所有值在传递给函数之前，必要时转换为 `DOUBLE`。\n\n- 2. 在不涉及\
    \ `DOUBLE` 的数值表达式中，所有值将转换为表达式中涉及的最高精度数据类型。例如，如果你将一个 `INTEGER` 值加到 `BIGINT` 上，`INTEGER`\
    \ 值将转换为 `BIGINT`，表达式被解析并产生一个 `BIGINT` 值作为结果。\n\n- 3. 作为参数传递给 DS2 方法的任何值都将转换为方法定义时为该参数指定的类型。例如，我们期望一个单个\
    \ `DOUBLE` 值。如果 `c2f` 方法被定义为 `INTEGER`，当我调用 `c2f(MyTemp)` 时，`MyTemp` 的值在传递给 `c2f`\
    \ 方法之前将转换为 `DOUBLE`。\n\n### 3.3.2.2 故障排除自动类型转换问题\n\n如你所见，自动数据类型转换在 DS2 处理过程中频繁发生。为了防止日志被大量的数据转换说明填满，除非使用\
    \ `TYPEWARN` 语句来帮助排查问题，否则 DS2 程序不会产生此类说明。`DS2_OPTIONS` 设置仅对下一个程序有效，它们应该放置在 DS2\
    \ 数据程序正之前：\n\n```\nproc ds2;\nds2 options TYPEWARN;\n```\n\n# 4 掌握 SAS DS2 过程：高级数据抓取技术\n\
    \n```\ndata null;\ndcl decimal(52,5) Dec;\ndcl double SASNum;\ndcl char(5) SASChar;\n\
    method init();\n  Dec=12345678901234567890.9n;\nSASNum=1.1;\nSASChar='1.1';\n\
    Dec=Dec+SASChar;\nput 'dec=12345678901234567892.00000';\nput dec=\\nput;\nDec=12345678901234567890.99999n;\n\
    Dec=Dec+SASNum;\nput 'dec=12345678901234567892.00000';\nput dec=\\nput;\nendata;\n\
    run;\nquit;\n```\n\nSAS 日志：\n\n```\ndec=12345678901234567892.00000\nDec=123456789012340000000.00000\n\
    \ndec=12345678901234567892.00000\nDec=1234567890123400000000.00000\n\nWARNING:\
    \ Implicit conversion of char type to double type. Statement\n145.\nWARNING: Implicit\
    \ conversion of decimal type to double type.\nStatement 145.\nWARNING: Implicit\
    \ conversion of double type to decimal type.\nStatement 145.\nWARNING: Implicit\
    \ conversion of decimal type to double type.\nStatement 150.\nWARNING: Implicit\
    \ conversion of double type to decimal type.\nStatement 150.\nNOTE: Execution\
    \ succeeded. No rows affected.\n```\n\n### 3.3.3 非强制转换数据类型\n\n二进制和时间相关的数据类型不会自动转换为字符以外的任何数据类型。这些数据类型被分类为非强制转换：\n\
    \n表 3.3：非强制转换数据类型\n\n| 数据类型 | 类别 | 注释 |\n|---|---|---|\n| BINARY(n) | 二进制 | 非强制转换，且没有显式转换方法。\
    \ |\n\n# 第3 章：DS2 数据程序详情\n\n| 数据类型 | 类别 | 注释 |\n|---|---|---|\n| BINARY(n) | 二进制\
    \ | 非强制转换，且没有显式转换方法。 |\n| TIME | 时间 | 强制转换。 |\n| DATE | 日期 | 强制转换。 |\n| TIMESTAMP\
    \ | 时间戳 | 强制转换。 |\n\n### 3.3.3.1 强制转换数据类型\n\nDS2 提供了将 ANSI TIME、DATE 和 TIMESTAMP\
    \ 值转换为相应 SAS TIME、DATE 和 TIMESTAMP 值的函数。\n\n### 3.3.3.2 TO_TIMESTAMP、TO_DATE 和\
    \ TO_TIME 函数\n\n`TO_TIMESTAMP` 函数接受单个 DATETIME 值并返回相应的 TIMESTAMP。`TO_DATE` 和 `TO_TIME`\
    \ 函数分别接受单个 DATE 或 TIME 值。\n\n```\nproc ds2;\n  dcl timestamp ANSI_Timestamp;\n\
    \  dcl date ANSI_Date;\n  dcl time ANSI_Time;\n  double SAS_Datetime format datetime25.6;\n\
    \  double SAS_date format yymmdd10.;\n  double SAS_Time format tod15.6;\n  method\
    \ ();\n    ANSI_Timestamp=12345678901234567890.9n;\n    ANSI_Date='2017-09-07';\n\
    \    ANSI_Time='07:09:17';\n    SAS_Datetime=to_double(ANSI_Timestamp);\n    SAS_date=to_double(ANSI_Date);\n\
    \    SAS_Time=to_double(ANSI_Time);\n    put 'SAS: ' SAS_Datetime SAS_date SAS_Time;\n\
    \    put 'ANSI: ' ANSI_Timestamp ANSI_Date ANSI_Time;\n  end;\nend;\nquit;\n```\n\
    \n# 掌握 SAS DS2 过程：高级数据抓取\n\n图 3.5：日期和时间转换\n\n| ANSI_Timestamp | ANSI_Date | ANSI_Time\
    \ | SAS_Datetime | SAS_date | SAS_Time |\n|---|---|---|---|---|---|\n| 07SEP2017:07:09:17.090717\
    \ | 2017-09-07 | 07:09:17 | 07SEP2017:07:09:17.090717 | 2017-09-07 | 07:09:17\
    \ |\n\nSAS 日志：\n\n| | |\n|---|---|\n| ANSI: | 2017-09-07 07:09:17.090717 2017-09-07\
    \ 07:09:17 |\n| SAS: | 07SEP2017:07:09:17.090717 2017-09-07 07:09:17 |\n\n从 SAS\
    \ 日志中，我们看到 ANSI 值与报告中的显示不同。这是因为 ANSI 值被转换为 SAS DATETIME、DATE 和 TIME 值并由 ODS 格式化。\n\
    \n### 3.3.3.3 TO DOUBLE 函数\n\n`TO DOUBLE` 函数接受单个 ANSI TIME、DATE 或 TIMESTAMP 值，并返回相应的\
    \ SAS TIME、DATE 或 DATETIME 值。\n\n```\nproc ds2;\n  data;\n    dcl timestamp ANSI_Timestamp;\n\
    \    dcl date ANSI_Date;\n    dcl time ANSI_Time;\n    double SAS_Datetime format\
    \ datetime25.6;\n    double SAS_date format yymmdd10.;\n    double SAS_Time format\
    \ tod15.6;\n    method ();\n      SAS_Datetime=to_double(ANSI_Timestamp);\n  \
    \    SAS_date=to_double(ANSI_Date);\n      SAS_Time=to_double(ANSI_Time);\n  \
    \    put 'SAS: ' SAS_Datetime SAS_date SAS_Time;\n      put 'ANSI: ' ANSI_Timestamp\
    \ ANSI_Date ANSI_Time;\n    end;\n  end;\nquit;\n```\n\n图 3.6：SAS 和 ANSI 日期及时间的显式转换结果\n\
    \n"
