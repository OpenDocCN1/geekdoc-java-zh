    # 5.6.1.1 Declaring, Instantiating, and Using an SQLSTMT Package


    At instantiation, the SQLSTMT package can accept either one or two parameters.
    The first parameter is required and defines the query the package will execute.


    ```

    dcl package sqlstmt drop (''drop crs.new_prices'');

    ```


    The SQLSTMT query may be dynamic by inserting question marks (?) as placeholders
    indicating where PDV variables will be automatically inserted when the query is
    executed. Dynamic queries require a second parameter that provides the ordered
    list of PDV variables that will supply the placeholders when the query is executed.
    The SQL statement will be built and customized when the DS2 program can execute
    the EXECUTE method.


    ```

    dcl package sqlstmt upd (''update crs_db.prices set Price=? where Product_ID=?'',
    [Price Product_ID]);

    ```


    The code in the first SQLSTMT package parameter is checked for correct syntax
    when the package is instantiated. You might want to create a table in the INIT
    method of a data program and query that table with the SQLSTMT later in the same
    data program. Because the table does not exist at compile time, the syntax of
    the SQLSTMT code at compile would produce syntax errors, and the code would not
    execute.


    ```

    dcl package sqlstmt make (''create table work.dates (DTM double, DT double, T
    double)'');

    dcl package sqlstmt apnd (''insert into work.dates (DTM, DT,T) VALUES (?,?,?)'',
    [SAS Datetime SAS Date SAS Time]);

    ```


    You can circumvent this by declaring the SQLSTMT package at compile time and instantiating
    it at execution using the _NEW_operator, as we discussed in the previous section
    with the matrix package.


    ```

    dcl package sqlstmt make;

    dcl package sqlstmt apnd;

    init() (

    make=NEW_sqlstmt (''create table work.dates (DTM double, DT double,T double)'');

    make.execute();

    apnd=_NEW_sqlstmt (''insert into work.dates (DTM, DT,T) VALUES (?,?,?)'', [SAS
    Datetime SAS Date SAS Time]);

    end;

    ```'
  - "[PAGE 116]\n\nTo execute the SQL statement using a SQLMT package, we use the\
    \ EXECUTE method.\n\n```\nproc ds2;\ndata _null;\n  dcl package sqlstmt make (\n\
    \    'create table work.dates(DTM double, DT double, T double)');\n  dcl package\
    \ sqlstmt apnd (\n    'insert into work.dates(DT,T) VALUES (?,?,?)'\n    ,;SAS_Datetime\
    \ SAS_Date SAS_Time]);\n  method init();\n    make.execute();\n  end;\n  method\
    \ run();\n    set crs.dates;\n    apnd.execute();\n  end;\nenddata;\nrun;\nquit;\n\
    ```\n\nThe SQLSTMT package also provides the FETCH method for interrogating a\
    \ result set produced by executing a query, as well as the BINDRESULTS method\
    \ for populating an ordered list of PDV variables by the query results.\n\nThe\
    \ BINDRESULTS method need only called once. It uses the information provided via\
    \ the second argument during SQLSTMT package instantiation to create a map for\
    \ populating PDV variables from columns in the query results. You must execute\
    \ this method once before using FETCH to retrieve values.\n\nThe FETCH method\
    \ reads a row from the query result and produces a zero (0) return code if a row\
    \ was retrieved. A nonzero result indicates either that there was an error (1)\
    \ or that no more results are available (2). This method is typically used in\
    \ a DO WHILE or DO UNTIL expression.\n\n```\nproc ds2;\ndata _null;\ndcl package\
    \ sqlstmt qry(\n  'select * from crs.dates'\n  dcl double DTM having format datetime;\n\
    \  dcl double DT having format mmddyy10;\n  dcl double T having format timeampm.\n\
    \  method init();\n    qry.execute();\n    qry.bindresults({DT T});\n    do while\
    \ (qry.fetch(DT) = 0);\n      put dt= dt= t=;\n  end;\nenddata;\nrun;\nquit;\n\
    ```"
