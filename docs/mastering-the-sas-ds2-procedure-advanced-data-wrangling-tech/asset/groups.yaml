    # Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques


    # 6.2 Understanding Threaded Processing


    # 6.2.1 The Need for Speed


    We humans are such an impatient species! Since the inception of the computer,
    extraordinary effort has been expended to increase processing speed. There are
    many factors affecting processing speed that we won''t be able to address the
    problem in realistic detail in this book. However, to simplify we, we''ll break
    down the problem into two major categories: moving data from off-line storage
    into system memory (RAM) and back to off-line storage, and processing data that
    is resident in memory.


    # 6.2.2 Loading Data to and from RAM


    Memory and storage have traditionally been limited assets, requiring careful conservation
    of the part of the programmer. Off-line storage has taken many forms over the
    years, from punch cards to paper tape, magnetic tape, floppy disks, hard drives,
    thumb drives, and today''s solid state disk (SSD) drives. Until the invention
    of solid state devices, moving data to and from off-line storage has always been
    an electro-mechanical process and has always been orders of magnitude slower than
    processing data in RAM. And even data retrieval can be exacerbated by the need
    to draw data to the compute platform a busy network. When it takes longer to retrieve
    the data than it takes to perform the computations, the process is referred to
    as input/output bound, or more typically as I/O bound. If you have a long-running
    data step and the SAS logs indicate significantly elapsed time CPU time, the process
    is likely to be I/O bound.


    With off-line storage, the goal is to move the data into and out of RAM as quickly
    as possible. Many strategies have evolved to address this issue. Some of the most
    significant improvements come from redundant arrays of independent disks (RAID)
    and the rise of SSDs. Caching strategies with physically parallel data storage
    and retrieval schemes like RAID have greatly increased data throughput rates.
    SSD stores in memory chips that don''t require constant power to retain their
    data instead of the spinning platters and moving heads of the traditional hard
    drive. Because the process is completely electronic, the data transfer rates of
    SSDs are much faster than those of hard drives, though they usually consume a
    bit more than hard drives.s are slower than the dynamic memory technologies used
    in RAM, but the gap is narrowing.


    All of these technologies and strategies present data to a CPU in the same order
    as it would have appeared read sera from a single disk. Because of this, any modifications
    required to accomplish Read/Write operations affect the operating system and are
    transparent to the applications that are consuming the data.


    # 6.2.3 Manipulating Data in RAM


    As data was moved into RAM at even faster rates and as the computations for processes
    to receive additional data faster than the CPU could accomplish the calculations
    on the current row. This type of process is described as CPU bound. You can identify
    long-CPU-bound DATA steps in SAS by looking at the log. If the CPU time is consistently
    the same as the elapsed time, the process is probably CPU bound.


    Like the field of off-line storage, our CPU and supporting systems were evolving
    to meet the new demand, becoming ever faster and more efficient. From the 8-bit
    processors with ~3.5K'
- md: "\n## Chapter 6: Parallel Processing in DS2\n\nTransistors operating at 1-2\
    \ MHz clock speeds in the first Apple computers to today's 64-bit processors with\
    \ over 1.5T transistors operating at clock speeds greater than 4 GHz, we pushed\
    \ the CPU speed envelope to it. Eventually, making a single CPU with smaller transistors\
    \ and a faster clock no longer produced dramatic processing speeds, we needed\
    \ to rethink our approaches to boosting speed. And, as the age of parallel processing\
    \ was born. Instead of a single CPU, today's processor chips boost multiple CPU\
    \ cores, each capable of simultaneously separate tasks in parallel. This task\
    \ is normally referred to as a thread. Frequently, a core is capable of processing\
    \ two threads at once, so a chip with four cores can process eight threads simultaneously.\
    \ Today, even our smart phones boast multiple-cored CPUs and the associated parallel\
    \ processing capabilities.\n\nHaving more than one CPU available opened up new\
    \ ways of approaching to improve the speed of operations. Those wishing to redesign\
    \ programs from the ground up can identify program tasks that could be accomplished\
    \ independently of each other and rewrite the program to do these tasks in parallel,\
    \ greatly reducing the clock time required to complete the entire program. As\
    \ you might imagine, greatly increases the complexity of writing software, but\
    \ can provide dramatic speed boosts. This is the world in which DS2 was created\
    \ to operate.\n\n## 6.3 DS2 Thread Programs\n\n### 6.3.1 Writing DS2 Thread Programs\n\
    \nDS2 threads are stored programs that can be executed in parallel. They are in\
    \ some ways similar to data programs in that they must contain at least one explicit\
    \ system method (INIT, RUN, or TERM), can declare local and global variables that\
    \ affect the PDV, and can instantiate and use packages.\n\nThreads are also similar\
    \ to packages: they are stored in SAS libraries as encrypted source code and can\
    \ include user-defined methods. Threads can accept parameters, but unlike packages,\
    \ they do not use user-defined constructor methods and thus do not accept parameter\
    \ input upon instantiation. Instead, parameter values are set using the SETPARMS\
    \ method, which must be called before executing the thread with a SET FROM statement.\
    \ Like a package, parameter variables are private to the thread program, but globally\
    \ available within the thread.\n\nLet's write our first thread program and take\
    \ a look at the results.\n\n```\nproc ds2;\nthread work.myThread(double flag)/overwrite=y;\n\
    \  dcl int ThreadNo;\n  dcl int Count;\n  method run();\n    set crs.banks;\n\
    \    count+1;\n  end;\n  method term();\n    ThreadNo=_threadid;\n    put ThreadNo=Count=;\n\
    \  end;\nendthread;\nrun;\nquit;\n```\n\nA quick look at the thread set reveals\
    \ that it looks much like a package, but the column that contains the exerted\
    \ source is SAS_TEXTTHREAD_ instead of SAS_TEXTPACKAGE_, as shown in Figure 6.1:\n\
    \nFigure 6.1: Viewing the Contents of a Stored DS2 Thread Program\n\n![](img/ef05c3db88dda150abd07414dd206d3f_128_0.png)\n\
    \nTo execute the thread, we must first declare an instance in a ds2 program. Because\
    \ the thread requires a parameter, we will call the SETPARMS method before we\
    \ use a SET statement to execute the thread. The THREADS=3 option will cause three\
    \ copies of the thread program to execute in parallel.\n\n```\ndata null;\n  decl\
    \ thread work.myThread t;\n  method init();\n    t.setparms(1);\n  end;\n  method\
    \ run();\n    set from t threads=3;\n  end;\n  method term();\n    put 'DATA Program:\
    \ ';\n    put _all_;\n    put;\n  end;\nenddata;\n```\n\nSAS Log:\n\n```\nThreadNo=0\
    \ Count=3\nThreadNo=1 Count=0\nThreadNo=2 Count=0\nDATA Program:\nNAME-National\
    \ Savings and Trust Count=3 ThreadNo= N_=4 RATE=0.0328\n```\n\nThe log reveals\
    \ that the thread program variable flag is available for processing in the thread\
    \ program, but not in the data program. The thread's globally declared ThreadNo\
    \ and Count variables appear in the data program's PDV, and this can be confusing.\
    \ Count was incremented with a SUM statement, its value is retained in the PDV.\
    \ So, by the time Count method is executed, ThreadNo has been reinitialized to\
    \ missing—even though _n_ is 4! In this case, it might have been a better idea\
    \ to drop ThreadNo and Count in the thread program, as we really have no use for\
    \ them in the output result set.\n\nIt is also clear from the log that although\
    \ three threads were spawned, threads 1 and 2 didn't process any data. Because\
    \ cls.banks is very small, there was really one block of data, and therefore all\
    \ of the data was sent to thread 0. Threads 1 and 2 executed and terminated without\
    \ processing any data.\n\nWhen executing DS2 on the SAS compute platforms with\
    \ realistically sized data, I visualize the process as shown in Figure 6.2:\n\n\
    ## Figure 6.2: DS2 Threaded Processing on the SAS Compute Platform\n\n![](img/ef05c3db88dda150abd07414dd206d3f_129_0.png)\n\
    \nThe SET statement spans a single read thread that distributes the source data\
    \ to the prescribed number of compute threads. The single read thread ensures\
    \ that a row of data is never passed to more than one thread.\n\n### 6.3.2 Parallel\
    \ Processing with DS2 Threads\n\nWhen considering DS2 on the SAS compute platform,\
    \ we ask two questions:\n- Is the process I/O bound?\n- Is the process CPU bound?\n\
    \nThe SET statement spans a single read thread that distributes the source data\
    \ to the prescribed number of compute threads. The single read thread ensures\
    \ that a row of data is never passed to more than one thread.\n\nThe multi-threaded\
    \ version also ran without error, and cut execution time in half!\n"
  mdcn: "\n\n## 第 6 章：DS2 中的并行处理\n\n从第一代 Apple 中主频为 1-2 MHz 的晶体管，到如今拥有超过 1.5 万亿晶体管且主频超过\
    \ 4 GHz 的 64 位处理器，我们一直在推 CPU 速度的极限。最终，当更小的晶体管和更快的频率使得单个 CPU 不再产生显著的性能提升时，我们需要重新思考提升速度的方法。于是，并行时代诞生了。现在的处理器芯片不再是单个\
    \ CPU，而是增强多个 CPU 核心，每个核心都能并行处理不同的任务。这种任务通常被称为线程（thread）。一个核心通常可以同时处理两个线程，因此一个四核芯片可以同时处理八个线程。今天，即使是智能手机也拥有多核\
    \ CPU 和相关的并行处理能力。\n\n可用多个 CPU 为提高操作速度提供了新方法。那些希望从头开始设计程序的人可以识别出可以独立完成的任务，并重写程序以并行执行这些任务，从而大幅缩短完成整个程序所需的时钟时间。正如你想象的，这大大增加了软件编写的复杂性，但可以提供显著的速度提升。这正是\
    \ DS2 设计运行的环境。\n\n## 6.3 DS2 线程程序\n\n### 6.3.1 编写 DS2 线程程序\n\nDS2 线程是可以并行执行的存储程序。它们在某些方面与数据程序相似，因为必须包含至少一个显式系统方法（INIT、RUN\
    \ 或 TERM），可以声明影响 PDV 的局部和全局变量，并可以实例化和使用包（packages）。\n\n线程也与包相似：它们以加密源码的形式存储在 SAS\
    \ 库中，并可以包含用户定义的方法。线程可以接受参数，但与包不同，它们不使用用户定义的构造方法，因此在实例化时不接受参数输入。相反，参数值通过 `SETPARMS`\
    \ 方法设置，该方法必须在使用 `SET FROM` 语句执行线程之前调用。类似于包，参数变量对于线程程序是私有的，但在线程内部全局可用。\n\n让我们编写第一个线程程序并查看结果。\n\
    \n```\nproc ds2;\nthread work.myThread(double flag)/overwrite=y;\n  dcl int ThreadNo;\n\
    \  dcl int Count;\n  method run();\n    set crs.banks;\n    count+1;\n  end;\n\
    \  method term();\n    ThreadNo=_threadid;\n    put ThreadNo=Count=;\n  end;\n\
    endthread;\nrun;\nquit;\n```\n\n快速查看线程集可以发现它看起来非常像包，但包含源码的列是 `SAS_TEXTTHREAD_`\
    \ 而不是 `SAS_TEXTPACKAGE_`，如图 6.1 所示：\n\n图 6.1：查看存储的 DS2 线程的内容\n\n![](img/ef05c3db88dda150abd07414dd206d3f_128_0.png)\n\
    \n要执行该线程，我们必须在 ds2 程序中声明一个实例。因为线程需要参数，我们在使用 `SET` 语句执行线程之前将调用 `SETPARMS` 方法。`THREADS=3`\
    \ 选项会导致三个线程程序副本并行执行。\n\n```\ndata null;\n  decl thread work.myThread t;\n  method\
    \ init();\n    t.setparms(1);\n  end;\n  method run();\n    set from t threads=3;\n\
    \  end;\n  method term();\n    put 'DATA Program: ';\n    put _all_;\n    put;\n\
    \  end;\nenddata;\n```\n\nSAS Log：\n\n```\nThreadNo=0 Count=3\nThreadNo=1 Count=0\n\
    ThreadNo=2 Count=0\nDATA Program:\nNAME-National Savings and Trust Count=3 ThreadNo=\
    \ N_=4 RATE=0.0328\n```\n\n日志显示，线程程序变量 `flag` 在线程程序中可用，但在数据程序中不可用。线程中全局声明的 `ThreadNo`\
    \ 和 `Count` 变量出现在数据程序的 PDV 中，这可能会引起困惑。`Count` 通过 `SUM` 语句增加的，其值保留在 PDV 中。因此，当执行\
    \ `Count` 方法时，`ThreadNo` 已经重新初始化为空——尽管 `_n_` 是 4！在这种情况下，在线程程序中丢弃 `ThreadNo` 和\
    \ `Count` 可能是更好的主意，因为我们实际上在输出结果集中不需要它们。\n\n从日志也可以清楚地看出，尽管启动了三个线程，但线程 1 和 2 没有处理任何数据。因为\
    \ `cls.banks` 非常小，实际上只有一个数据块，因此所有数据都发送到了线程 0。线程 1 和 2 执行并终止，没有处理任何数据。\n\n在 SAS\
    \ 计算平台上对具有实际大小的数据执行 DS2 时，我将过程可视化如图 6.2 所示：\n\n## 图 6.2：SAS 计算平台上的 DS2 线程处理\n\n\
    ![](img/ef05c3db88dda150abd07414dd206d3f_129_0.png)\n\n`SET` 语句跨越单个读取线程，该线程将源数据分到指定的计算线程数量。单个读取线程确保行数据不会被传递给超过一个线程。\n\
    \n### 6.3.2 使用 DS2 线程进行并行处理\n\n在考虑 SAS 计算平台上的 DS2 时，我们问两个问题：\n- 是 I/O 密集型的吗？\n\
    - 过程是 CPU 密集型的吗？\n\n`SET` 语句跨越单个读取线程，该线程将源数据分到指定的计算线程数量。单个读取线程确保行数据不会被传递给超过一个线程。\n\
    \n多线程版本也运行没有错误，并将执行时间缩短了一半！\n\n"
