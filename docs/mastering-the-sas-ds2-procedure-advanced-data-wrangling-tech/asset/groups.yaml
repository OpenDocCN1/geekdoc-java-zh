- md: "\n## 7.3 Analyzing Performance with the SAS Log\n\n### 7.3.1 Obtaining Performance\
    \ Statistics\n\nThe default option settings in SAS provide a modicum of performance\
    \ reporting in the SAS log. Here is an example of the default performance statistics\
    \ reported under Linux (the operating system used by SAS University Edition):\n\
    \nHere is an example of standard performance statistics in the SAS log:\n\n```\n\
    NOTE: PROCEDURE DS2 used (Total process time):\n  real time                2.35\
    \ seconds\n  cpu time                 0.17 seconds;\n```\n\nYou will notice that\
    \ SAS produces performance statistics only after the QUIT statement for PROC DS2\
    \ session, so if you have included several DS2 steps, you only get aggregate results\
    \ for the entire process. For troubleshooting and tuning, try placing each DS2\
    \ program in its own PROC DS2 session to obtain more granular results.\n\nWhen\
    \ your program is performing poorly, the problem usually boils down to one or\
    \ more factors:\n\n- CPU\n- memory\n- I/O\n- network latency\n\nWhen tracking\
    \ down performance issues, or trying to tune your code, setting OPTIONS FULLSTIMER\
    \ can provide more detailed information that can help you narrow down the areas\
    \ where the system might be having problems. You can then try writing code in\
    \ different ways with the intent of mitigating performance problems by alleviating\
    \ any problems detected.\n\nHere is an example of the performance statistics reported\
    \ using FULLSTIMER:\n\n| PROCEDURE DS2 used (Total process time): | |\n| :---\
    \ | :--- |\n| real time | 2.35 seconds |\n| cpu time | 0.10 seconds |\n| system\
    \ cpu time | 0.07 seconds |\n| memory | 5738.84k |\n| OS Memory | 30268.00k |\n\
    | Timestamp | 02/14/2016 10:23:11 AM |\n| Step Count | 87 Switch Count 50 |\n\
    | Page Faults | 0 |\n| Page Reclaims | 1925 |\n| Page Swaps | 0 |\n| Voluntary\
    \ Context Switches | 2648 |\n| Involuntary Context Switches | 191 |\n| Block Input\
    \ Operations | 0 |\n| Block Output Operations | 0 |\n\n## Mastering the SAS DS2\
    \ Procedure: Advanced Data Wrangling Techniques\n\nAs you can see, the information\
    \ that is reported is much richer with FULLSTIMER on. Here is some descriptive\
    \ information for selected performance statistics:\n\nTable 7.1: Performance Statistics\
    \ in the SAS Log\n\n| Statistic | Significance |\n| :--- | :--- |\n| Real Time\
    \ | This is the \"wall clock\" time elapsed while your job was executing—for example,\
    \ the time you spent waiting for the step to complete. If any other programs are\
    \ running on your system beside SAS, real time can fluctuate significantly for\
    \ the same job depending on how long SAS has to wait for system resources in use\
    \ by other processes. |\n| CPU Time | When FULLSTIMER is not in effect, SAS reports\
    \ the sum of CPU time and system time as CPU time. When FULLSTIMER is in effect,\
    \ CPU time and system time are reported separately. When parallel processing is\
    \ in effect, CPU time can be greater than real time. |\n| User CPU Time | This\
    \ is CPU time expended while executing user-written code, including the SAS program\
    \ that you wrote and the built-in SAS processes that support its execution. |\n\
    | System CPU Time | This is the CPU time expended by the operating system in support\
    \ of user-written code. |\n| Memory | This is the memory allocated to this job\
    \ or step, not including SAS system overhead. |\n| Involuntary Context Switches\
    \ | This is the number of times a process releases its CPU time-slice involuntarily.\
    \ Causes include running out of CPU time before your job is finished or having\
    \ another task grab your time-slice because it has higher priority. |\n| Page\
    \ Swaps | This is the number of times a process was swapped out of main memory.\
    \ |\n\nWhen benchmarking performance, it is necessary to run each version of a\
    \ process several times in separate SAS sessions and average the performance results\
    \ before making comparisons. It is very helpful to be able to extract statistics\
    \ from the SAS log and save them to a SAS data set for later analysis. The experimental\
    \ %LOGPARSE is available for download from the SAS Support website and can automate\
    \ this process for you to some extent.\n\nIf these techniques do not identify\
    \ your problem, configuring the SAS logging facility to use some of the DS2 loggers\
    \ might be useful. Setting up SAS to use these loggers can be a bit intimidating\
    \ at first, but a lot of detailed information can be gained using this technique.\
    \ See the SAS DS2 Language Reference titled “DS2 Loggers.” Also see SAS Logging:\
    \ Configuration and Programming Reference.\n\n## Chapter 7: Performance Tuning\
    \ in DS2\n\n### 7.3.2 Analyzing Performance Statistics\n\nOne of the first comparisons\
    \ to make is real CPU time. If your task is performing real and time CPU time\
    \ are consistently within 10 to 15% of each other, the limiting factor is probably\
    \ CPU time, and your task is CPU bound. If there is a large difference between\
    \ real time and CPU time, the limiting factor is probably I/O, and your process\
    \ is probably I/O bound. Other valuable information from FULLSTIMER can be gained\
    \ by analyzing the remaining statistics. A search of support.sas.com for \"FULLSTIMER\
    \ SAS option\" will provide more in-depth guidance on how to proceed.\n\nAs a\
    \ general rule, if your task reads from a table in a DBMS that has the SAS In-Database\
    \ Code Accelerator installed, it will run much faster if you rewrite the data\
    \ program as a thread and execute the thread from a data program using the SET\
    \ statement. Performance will be even better if the data output is also a database\
    \ table and your database is.\n\n- CPU\n- memory\n- I/O\n- network latency\n\n\
    When tracking down performance issues, or trying to tune your code, setting OPTIONS\
