    \ | Florida | Tarja, Bolivia | Clothing | 1 | $0 | $4000 |\n| 100283 | Luis Group\
    \ | Santa Cruz, Bolivia | Used Clothing | 8 | $125 | $4650 |\n\n# 5.4.2.3 Using\
