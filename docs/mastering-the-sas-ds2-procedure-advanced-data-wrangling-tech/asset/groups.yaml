    \n## 7.5 核心概念回顾\n\n-   SAS 系统选项 `FULLSTIMER` 可以在 SAS 日志中提供比通常更详细的性能信息。\n-   带有\
    \ `TRACE` 选项的 `DS2_OPTIONS` 语句可以就运行运行的 DS2 程序如何实现数据库处理提供额外的见解。\n-   对于基准测试，有必要对同一个问题编写几种实现方法，在实际大小的数据上运行它们，并比较性能统计数据，以便更好地优化你的\
    \ DS2 程序。\n-   SAS 用户可以在网上获得很多帮助，包括免费在线学习课程、教程视频、SAS 用户社区论坛以及 SAS 技术支持。\n-   在联系\
    \ SAS 支持之前进行适当准备将使交流更加顺畅，并让你的问题得到更快的解答。\n\n## 7.6 与作者联系\n\n我简直无法相信——我完成了我的第一本书！撰写这本书对我来说是一次非常奇妙的经历。感谢你花时间阅读它，希望你像我发现它一样发现\
    \ DS2 既有趣又有用。我很听听你的反馈，也许是关于你如何使用它解决自己的现实问题的反馈。请随时在 LinkedIn (http://linkedin.com/in/sasjedi)\
