    \ Union | 0.0321 |\n| $5,887.13 | 5 | | National Savings and Trust | 0.0328 |\n\
    | $5,890.77 | 5 | 52 | National Savings and Trust | 0.0328 |\n\nNow we have a\
    \ dilemma. If everyone in the company is using our v1.0 interest method, which\
