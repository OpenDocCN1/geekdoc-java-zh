    - identify which programming statements and functions are shared between DATA
    steps and DS2 programs

    - identify the DATA step functionality not available in DS2 and why it is not
    included in the DS2 language

    - know what DS2 program functionality is not available in the traditional DATA
    step

    - directly manipulate ANSI data types in a DS2 program

