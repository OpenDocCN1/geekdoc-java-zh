    # Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques


    compares and contrasts traditional Base SAS DATA step processing with DS2 data
    processing, illustrated by a basic example.


    Figure 1.1: Traditional DATA Step versus DS2 Data Program Processing


    | Traditional Base SAS DATA step | DS2 data program in Base SAS |

    | --- | --- |

    | SAS | SAS -> DS2 |

    | PDV | PDV |

    | ID Name Salary | ID Name Salary

    | Num Char Num | Bigint VarChar Decimal |


    | SAS/ACCESS LIBNAME engine | DBMS driver |

    | --- | --- |

    | DBMS Table | DBMS Table |

    | ID Name Salary | ID Name Salary

    | Bigint VarChar Decimal | BIGINT VarChar Decimal |


    As we see in Figure 1.1, when the traditional SAS DATA accesses DBMS via the SAS/ACCESS
    engine using a LIBENAME statement, DBMS data types are automatically converted
    to fixed-width character or double-precision, floating-numeric. In contrast, the
    DS2 data program accesses the RDBMS data via a special driver associated with
    the SAS/ACCESS product and can therefore process the data in its native data.


    The SAS step is essentially a data-driven loop: reading, manipulating, and writing
    out one observation at a time. If the process is computationally complex, it can
    easily become CPU bound; that is, data can be read into memory faster than it
    can be processed. If the STEP elapsed (clock) time in the SAS log is the same
    as the CPU time, your process is most likely CPU bound. DS2 can accelerate CPU-bound
    processing by processing data rows in parallel using DS2 threads. Figure 1.2 contrasts
    traditional SAS DATA step, single-threaded processing with multi-threaded processing
    using DS2 thread and data programs.'
  - '[PAGE 19]


    # Figure 1.2: Serial Processing in the DATA Step versus DS2 Parallel Processing


    Single-threaded DATA step


    ![](img/ef05c3db88dda150abd07414dd206d3f_19_0.png)


    DS2 threads parallel processing on the SAS compute platform


    ![](img/ef05c3db88dda150abd07414dd206d3f_19_1.png)


    SAS/ACCESS LIBENAME engine


    DS2 threaded DBMS driver


    ![](img/ef05c3db88dda150abd07414dd206d3f_19_2.png)


    As can be seen in Figure 1.2, the traditional SAS DATA step must process each
    row of data sequentially. By contrast, DS2 can use thread and data programs to
    process multiple rows of data simultaneously.


    Notice that both processes use a single-read thread, so if getting data from disk
    or the DBMS into memory on the SAS compute platform for processing is the bottleneck,
    threaded processing on the SAS compute platform will not improve overall performance.
    This situation is referred to as an “I/O bound” operation. DS2 uses a single read
    thread to feed multiple compute threads when processing in Base SAS to ensure
    that each row of data is distributed to only one compute thread for processing.
    If I/O is the bottleneck and computations are taking place on the SAS, DS2 is
    unlikely to improve performance.


    However, because today’s DBMS data is enormous, data movement should be completely
    avoided whenever possible. With DS2, in a properly provisioned and configured
    SAS installation that includes the SAS In-Database Code Accelerator, your DS2
    programs can actually execute on the database hardware in the SAS Embedded Process
    without having to move data to the SAS compute platform at all. Figure 1.3 compares
    DS2 program thread processing on the SAS compute platform to in-database processing
    with DS2 and the SAS In-Database Code Accelerator.'
