    \ 49\n\n## 3.1 引言\n\n在本章中，我们将关注 DS2 数据程序的基础知识，首先通过对传统的 DATA step 与 DS2 数据程序进行进一步的对比分析，并深入探讨\
    \ DS2 中的一些新特性。在此过程中，我们将把复杂的 Base SAS DATA step 转换为 DS2 数据程序，并引入几个 DS2 特有的概念和技术。具体而言，我们将涵盖以下要点：\n\
    \n- 更多的 DS2 数据程序语法和结构\n- 使用 FedSQL 查询直接为 DS2 数据程序的 SET 语句提供输入\n- DS2 可以处理的各种 ANSI\
    \ 数据类型\n- DS2 自动数据类型转换规则\n- 独特的 DS2 程序语句\n- 独特的 DS2 表达式\n- 选定的 DS2 函数\n\n## 3.2\
    \ DS2 数据程序与 Base SAS DATA Step对比\n\n### 3.2.1 通用注意事项\n\nDS2 数据程序语法与 Base SAS DATA\
    \ step 语法的相似性对于经验丰富的 SAS 程序员来说是一个优势。这种相似性在 Base SAS DATA step 和 DS2 数据程序共享的语句语法中表现得非常明显。例如，这些语句在两种语言中的工作方式基本相同：\n\
    \n- SET\n- BY 组处理，包括 First.variable 和 Last.variable\n- DO 组和 DO 循环\n  - DO i=\
    \ start TO BY interval\n  - DO WHILE ()\n  - DO UNTIL ()\n  - 循环控制语句 CONTINUE,\
    \ LEAVE 和 END\n- 程序流控制语句\n  - RETURN\n  - OUTPUT\n  - GOTO\n  - STOP\n- 声明语句\n\
    \  - KEEP 和 DROP\n  - RETAIN\n\n请记住，在任何 DS2 程序中，全局声明语句必须出现在全局程序空间中——即在 DATA、THREAD\
    \ 或 PACKAGE 语句之后，且在第一个方法定义之前。\n\n## 3.2.2 “六大细微差异”\n\n尽管在传统的 DATA step 和 DS2 数据程序中许多功能的工作原理完全相同，但存在一些非常细微的差异，在\
    \ DS2 中编程时必须记住这些差异。让我们来看看主要的区别，我称之为“六大细微差异”。\n\n### 3.2.2.1 所有可执行语句必须是方法代码块的一部分\n\
    \n全局程序空间中的可执行语句会导致语法错误：\n\n```\nproc ds2;\ndata _null;\nset crs.one_day;\nput\
    \ _all;\nenddata;\nrun;\nquit;\n```\n\nSAS Log：\n\n```\nERROR: Compilation error.\n\
    ERROR: Parse encountered SET when expecting end of input.\nERROR: Line n: Parse\
    \ failed; >>> set crs.one_day;\n```\n\n将可执行语句封装在方法中可以解决此问题：\n\n```\nproc ds2;\n\
    data  _null_;\nmethod run()\n    set crs.one_day;\n    put  _all_;\nend;\nenddata;\n\
    run;\nquit;\n```\n\nSAS Log:\n\n> NOTE: 执行成功. 影响了 6 行数据.。\n\n### 3.2.2.2 DS2 程序默认不会覆盖数据\n\
    \n如果你提交此程序，它将正常运行。如果你第二次提交完全相同的程序，它将导致语法错误：\n\n```\nproc ds2;\ndata test1 test2;\n\
    method run()\n    set crs.one_day;\nend;\nenddata;\nrun;\n\nproc ds2;\ndata test1\
    \ test2;\nmethod run()\n    set crs.one_day;\nend;\nenddata;\nrun;\n```\n\nSAS\
    \ Log:\n\n```\n683 proc ds2;\n684 data test1 test2;\n685 method run();\n686  \
    \   set crs.one_day;\n687 end;\n688 enddata;\n689 run;\n690 NOTE: 执行成功. 影响了 12\
    \ 行数据.。\nquit;\nNOTE: 使用过程 DS2 (总处理时间):\n```\n\n| real time | 0.05 seconds |\n\
    |-----------|---------------\n| cpu time | 0.04 seconds |\n\n```\n691\n692 proc\
    \ ds2;\n693 data test1 test2;\n694 method run();\n695\n696 set crs.one_day;\n\
    697 end;\n698 enddata;\n699 run;\n700 NOTE: 执行成功. 影响了 12 行数据.。\nquit;\nNOTE: 使用过程\
    \ DS2 (总处理时间):\n```\n\n## 3.2.2.3 所有通过 SET 引入的变量都应该声明\n\n默认情况下，未声明变量会导致日志中出现警告。这种行为可以通过\
    \ DS2 系统选项进行全局控制。\n\n| 选项设置 | 影响 |\n|----------------|--------|\n| NONE | 程序正常编译并执行。\
    \ | |\n| WARNING | 程序正常编译并执行。 | |\n| ERROR | 程序编译失败。 |\n\n以下是 DS2 系统选项的示例：\n\n\
    ```\noptions ds2=ERROR;\nproc ds2;\ndata _null_;\nmethod run();\nText='Hello,\
    \ world';\nx=1;\nput Text=;\nend;\nenddata;\nrun;\nquit;\n```\n\nSAS Log:\n\n\
    ```\nERROR: 编译错误。\nERROR: Line 92: 赋值变量 text 没有 DECLARE; 正在将其创建为 char 类型的全局变量。\n\
    ERROR: Line 93: 赋值变量 x 没有 DECLARE; 正在将其创建为 double 类型的全局变量。\n\nNOTE: SAS 系统由于错误停止处理此步骤。\n\
    ```\n\n以下是覆盖系统选项的示例：\n\n```\noptions ds2=NONE;\nproc ds2;\ndata _null_;\nmethod\
    \ run();\nText='Hello, world';\nx=1;\nput Text=;\nend;\nenddata;\nrun;\nquit;\n\
    ```\n\nSAS Log:\n\n```\nText=Hello, world\nNOTE: 执行成功. 影响了 0 行数据。\n```\n\n###\
    \ 3.2.2.4 PUT 语句不支持光标和行指针\n\n此 Base SAS 数据 step 使用光标控制 (@) 和换行 (/) 在日志中写入了整齐的信息：\n\
    \n```\ndata_null;\nText='Hello, world';nX=1;\nput @7 Text = /7 X =\nrun;\n```\n\
    \nSAS Log:\n\n```\nText=Hello, world\nX=1;\nNOTE: 使用 DATA语句 (总处理时间):\nreal time\
    \ 0.00 seconds\ncpu time 0.01 second\n```\n\n然而，DS2 中的相同代码会产生语法错误，因为 DS2 的 PUT\
    \ 语句不接受光标和行控制：\n\n```\nproc ds2;\ndata_null\nmethod run();\nText='Hello, world';nX=1;\n\
    put @6 Text = / @6 X=\nenddata;\nrun;\nquit;\n```\n\nSAS Log:\n\n```\nERROR: 编译错误。\n\
    ERROR: 在期望 ';' 时遇到无效字符；；\nERROR: Line 212: 解析失败：put >>> <<< 6 Text = / @6 X=;\n\
    NOTE: SAS 系统由于错误停止处理此步骤。\n```\n\n"
