    # 1.1 引言


    今天的数据科学家正在处理来自日益广泛的数据源越来越越来越数据集，而处理这些数据所需的计算也变得越来越复杂。随着 SAS 系统在每次新发布中不断现代化，SAS
    过程（ProCs）已被重写为支持多线程，允许它们使用多台计算机，甚至推入大规模并行处理（MPP）环境，例如 Teradata、Hadoop 或 SAS 高性能分析网格。但数据
    step 凭借其顺序的、逐条观测的数据处理方法，仍然顽固地……


    在 2013 年夏天，SAS 发布了 SAS 9.4，其中包含了一种名为 DS2 的革命性新编程语言。DS2 基本上是从从头开始重新设计的 DATA step
    编程，具有几个重要目标。


    以下是 DS2 能够做到的：


    -   原生处理美国国家标准协会（ANSI）SQL 数据类型，以便与外部存储进行更好的集成

    -   提供现代的结构化编程结构，使得使用可用代码模块扩展 DS2 语言的功能变得简单

    -   与 SQL 紧密集成

    -   为多线程处理提供简单、安全的语法以加速 CPU 密集型任务


    我喜欢将 DS2 视为一种语言，它保留了 Base SAS DATA step 编程语言的力量和控制力，结合了 SAS 的简单性，并带有对象特征，使简单、可重用的代码模块成为现实。


