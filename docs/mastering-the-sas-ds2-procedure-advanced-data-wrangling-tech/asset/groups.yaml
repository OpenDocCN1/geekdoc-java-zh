  - "[PAGE 120]\n\n# 104 Mastering the SAS DS2 Procedure: Advanced Data Wrangling\
    \ Techniques\n\nAfter the update program runs, we have a PROC APPEND step that\
    \ adds the audit information generated by this program to a master data set in\
    \ the cls library. A report generated from the audit data set shows it contains\
    \ an excellent record of the changes made.\n\nFigure 5.18: Audit Set Produced\
    \ While Updating with the SQLSTMT Package\n\n# Price Change Audit Trail\n\n| Row\
    \ | Changed_On | Changed_By | Prod_ID | Original_Price | Updated_Price |\n|---|---|---|---|---|--|\n\
    | 1 | 16JAN16:11:37:08 | Student | 22020100012 | $58.70 | $61.64 |\n| 2 | 16JAN16:11:37:08\
    \ | Student | 23010500006 | $8.40 | $8.82 |\n| 3 | 16JAN16:11:37:08 | Student\
    \ | 24010100366 | $16.30 | $17.12 |\n| 4 | 16JAN16:11:37:08 | Student | 24050100039\
    \ | $34.50 | $36.23 |\n\n21020010009 and 24080200063 Should Not Be Updated\nOriginal\
    \ Prices were $34.70 and $36.90\n\nThe final section of the program resets the\
    \ values to the original values. Because the table containing values that we want\
    \ to use for updating already exists, we use a SET statement to read in the values\
    \ used for mappings. However, we will still need an SQLSTMT package to update\
    \ the values in the big table. Because we are now using the RUN method to read\
    \ in our data, we don't have to write a DO loop to read the data rows, and we\
    \ will need to code an EXPLICIT OUTPUT statement because the RUN method's END\
    \ statement includes an implicit output. While this code still circumvents the\
    \ usual cross-library problems, it is even simpler to write and update.\n\n```\n\
    proc ds2;\ndata work.Price_Change_Audit /overwrite=yes;\ndeclare double Changed\
    \ having format datetime;\ndeclare char(15) Changed_By;\n  retain Changed_By =\
