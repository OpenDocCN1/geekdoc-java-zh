    # Figure 6.2: DS2 Threaded Processing on the SAS Compute Platform


    ![](img/ef05c3db88dda150abd07414dd206d3f_129_0.png)


    The SET statement spans a single read thread that distributes the source data
    to the prescribed number of compute threads. The single read thread ensures that
    a row of data is never passed to more than one thread. As each thread completes
    its computations on a row of data, it returns the result to the data program''s
    PDV. The data program processes the data and writes it to the data set in a single-threaded
    process.


    # 6.3.2 Parallel Processing Data with DS2 Threads


    When are are considering whether DS2 on the SAS compute platform will improve
    performance, we ask two primary questions:


    +   - Is the process CPU bound? If the process is I/O bound we have to remember
    that there will be only one read thread for our process and adding additional
    compute threads will probably actually degrade performance, not improve it.

    - The data set we are processing large enough to produce several blocks that can
    be distributed to more than one thread? Even if the process is CPU bound, if the
    data is small that all it sends to a single compute thread, we shouldn''t expect
    improved performance.


