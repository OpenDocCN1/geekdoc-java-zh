    # 7.6 Connecting with the Author


    I can''t believe it - I''ve completed my very first book! Writing this book has
    been quite an amazing experience for me. I thank you for taking the time to read
    it and hope you find DS2 delightful and useful as I have found it to be my own
    work. I''d love to hear from you, perhaps with feedback on how you''ve been using
    your own real-world problems. Please feel free to connect with me on LinkedIn
    (http://linkedin.com/in/sasjedi), follow me on Twitter (http://twitter.com/sasjedi),
    read my sporadic “Jedi SAS Tricks” posts on The SAS Training Post blog (http://go.sas.com/jedi)
    or contact me via my author page at http://support.sas.com/Jordan. Of course,
    your reviews on Amazon, Goodreads, etc. are always appreciated.


    I wish you the best in all your SAS endeavors – and may the SAS be with you!'
