    \ 49\n\n## 3.1 Introduction\n\nIn this chapter, we'll focus on DS2 data program\
    \ fundamentals, first by further comparing and contrasting the traditional DATA\
    \ step with the DS2 data program, and by diving into some of the things that are\
    \ new in DS2. In the process, we'll convert more complex Base SAS DATA steps into\
    \ DS2 data programs, and we will introduce several concepts and techniques that\
    \ are unique to DS2. Specifically, we will cover these points:\n\n- more DS2 data\
    \ program syntax and structure\n- using FedSQL queries to provide input directly\
    \ to a DS2 data program SET statement\n- the wide variety of ANSI data types that\
    \ can be processed in DS2\n- DS2 automatic data type conversion rules\n- unique\
    \ DS2 program statements\n- unique DS2 expressions\n- selected DS2 functions\n\
    \n## 3.2 DS2 Data Programs versus Base SAS DATA Steps\n\n### 3.2.1 General Considerations\n\
    \nThe DS2 data program syntax's similarity to Base SAS DATA step syntax is an\
    \ advantage for seasoned SAS programmers. This similarity clearly shows in the\
    \ statement syntax that is shared between the Base SAS DATA step and the DS2 data\
    \ program. For example, these statements work essentially the same in both languages:\n\
    \n- SET\n- BY-group processing, including First.variable and Last.variable\n-\
    \ DO groups and DO loops\n  - DO i= start TO BY interval\n  - DO WHILE ()\n  -\
    \ DO UNTIL ()\n  - loop flow control statements CONTINUE, LEAVE, and END\n- Program\
    \ flow control statements\n  - RETURN\n  - OUTPUT\n  - GOTO\n  - STOP\n- Declarative\
    \ statements\n  - KEEP and DROP\n  - RETAIN\n\nRemember that in any DS2 program,\
    \ global declarative statements must appear in the global program space—that is,\
    \ after the DATA, THREAD, or PACKAGE statement and before the first method definition.\n\
    \n## 3.2.2 The “Six Subtle Dissimilarities”\n\nThough many things work exactly\
    \ the same in a traditional DATA step and a DS2 data program, there are some differences\
    \ that are quite subtle and must be kept in mind when programming in DS2. Let’s\
    \ go over the primary cuts, which I’ve come to refer to as the six subtle dissimilarities.\n\
    \n### 3.2.2.1 All Executable Statements Must Be Part of a Method Code Block\n\n\
    Executable statements in the global program space result in a syntax error:\n\n\
    ```\nproc ds2;\ndata _null;\nset crs.one_day;\nput _all;\nenddata;\nrun;\nquit;\n\
    ```\n\nSAS Log:\n\n```\nERROR: Compilation error.\nERROR: Parse encountered SET\
    \ when expecting end of input.\nERROR: Line n: Parse failed; >>> set crs.one_day;\n\
    ```\n\nEnclosing the executable statements in a method resolves the issue:\n\n\
    ```\nproc ds2;\ndata  _null_;\nmethod run()\n    set crs.one_day;\n    put  _all_;\n\
    end;\nenddata;\nrun;\nquit;\n```\n\nSAS Log:\n\n> NOTE: Execution succeeded. 6\
    \ rows affected.\n\n### 3.2.2.2 DS2 Programs Do Not Overwrite Data by Default\n\
    \nIf you submit this program, it runs normally. If you submit the exact same program\
    \ a second time, it results in a syntax error:\n\n```\nproc ds2;\ndata test1 test2;\n\
    method run()\n    set crs.one_day;\nend;\nenddata;\nrun;\n\nproc ds2;\ndata test1\
    \ test2;\nmethod run()\n    set crs.one_day;\nend;\nenddata;\nrun;\n```\n\nSAS\
    \ Log:\n\n```\n683 proc ds2;\n684 data test1 test2;\n685 method run();\n686  \
    \   set crs.one_day;\n687 end;\n688 enddata;\n689 run;\n690 NOTE: Execution succeeded.\
    \ 12 rows affected.\nquit;\nNOTE: PROCEDURE DS2 used (Total process time):\n```\n\
    \n| real time | 0.05 seconds |\n|-----------|---------------\n| cpu time | 0.04\
    \ seconds |\n\n```\n691\n692 proc ds2;\n693 data test1 test2;\n694 method run();\n\
    695\n696 set crs.one_day;\n697 end;\n698 enddata;\n699 run;\n700 NOTE: Execution\
    \ succeeded. 12 rows affected.\nquit;\nNOTE: PROCEDURE DS2 used (Total process\
    \ time):\n```\n\n## 3.2.2.3 All Variables Introduced via SET Should Be Declared\n\
    \nBy default, failure to declare a variable results in a warning in the log. This\
    \ behavior can be controlled globally with the DS2 system option.\n\n| Option\
    \ Setting | Effect |\n|----------------|--------|\n| NONE | Program compiles and\
    \ executes normally. |\n| WARNING | Program compiles and executes normally. |\n\
    | ERROR | Program fails to compile. |\n\nHere is an example of the DS2 system\
    \ option:\n\n```\noptions ds2=ERROR;\nproc ds2;\ndata _null_;\nmethod run();\n\
    Text='Hello, world';\nx=1;\nput Text=;\nend;\nenddata;\nrun;\nquit;\n```\n\nSAS\
    \ Log:\n\n```\nERROR: Compilation error.\nERROR: Line 92: No DECLARE for assigned-variable\
    \ text; creating it as a global variable of char.\nERROR: Line 93: No DECLARE\
    \ for assigned-variable x; creating it as a global variable of double.\n\nNOTE:\
    \ The SAS System stopped processing this step because of errors.\n```\n\nHere\
    \ is an example of overriding the system option:\n\n```\noptions ds2=NONE;\nproc\
    \ ds2;\ndata _null_;\nmethod run();\nText='Hello, world';\nx=1;\nput Text=;\n\
    end;\nenddata;\nrun;\nquit;\n```\n\nSAS Log:\n\n```\nText=Hello, world\nNOTE:\
    \ Execution succeeded. No rows affected.\n```\n\n### 3.2.2.4 PUT Statement Cursor\
    \ and Line Pointers Are Not Supported\n\nThis Base SAS data step writes neatly\
    \ organized information in the log using cursor controls (@) and line feeds (/):\n\
    \n```\ndata_null;\nText='Hello, world';nX=1;\nput @7 Text = /7 X =\nrun;\n```\n\
    \nSAS Log:\n\n```\nText=Hello, world\nX=1;\nNOTE: DATA statement used (Total process\
    \ time):\nreal time 0.00 seconds\ncpu time 0.01 second\n```\n\nHowever, the same\
    \ code in DS2 generates syntax errors, because the PUT statement in DS2 does not\
    \ accept cursor and line controls:\n\n```\nproc ds2;\ndata_null\nmethod run();\n\
    Text='Hello, world';nX=1;\nput @6 Text = / @6 X=\nenddata;\nrun;\nquit;\n```\n\
    \nSAS Log:\n\n```\nERROR: Compilation error.\nERROR: Parse encountered invalid\
    \ character when expecting ';';\nERROR: Line 212: Parse failed: put >>> <<< 6\
    \ Text = / @6 X=;\nNOTE: The SAS System stopped processing this step because of\
    \ errors.\n```\n"
