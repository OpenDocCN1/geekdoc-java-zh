    \ 108\n\n# 5.1 引言\n\n第 4 章介绍了 DS2 包的概念以及如何使用这些包来扩展 DS2 语言和面向对象的应用设计。SAS 的开发者选择选择包作为在\
    \ DS2 中提供新功能的手段，这并不意外，特别是当这些功能被用作对象时。尽管每个预定义的 DS2 包都为数据处理提供了强大的新技术，但你的 SAS 会话中可用的包取决于你正在使用的版本，如表\
    \ 5.1 所示。在本章中，我们将深入研究 SAS 9.4M3 版本中随 DS2 一起的所有预定义包。\n\n70 精通 SAS DS2 过程：高级数据处理技术\n\
    \n# 表 5.1：按 SAS 版本划分的22预定义包\n\n| 包 | SAS 版本 | 目的 |\n| --- | --- | --- |\n| FCMP\
    \ | SAS 9.4 M0 | 允许从 DS2 程序中调用 FCMP 函数和子程序。 |\n| Hash | SAS 9.4 M0 | 允许你在 DS2\
    \ 程序中使用 hash 对象。Hash 允许你根据查找键快速、高效地存储、搜索和检索数据。Hash 记录还可以在 DS2 程序中轻松地操作、排序并保存到表中。\
    \ |\n| Hiter | SAS 9.4 M0 | 允许你在 DS2 程序中对相关的 hash 对象进行迭代处理。你必须在声明相关的 hiter 之前声明\
    \ hash。 |\n| HTTP | SAS 9.4 M2 | 提供一个 HTTP 客户端，其方法允许你访问 HTTP Web 服务并在 DS2 程序中捕获返回的结果。\
    \ |\n| JSON | SAS 9.4 M3 | 提供解析和写入 JSON 文本所需的方法，对于解码 HTTP 包返回的结果非常有用。 |\n| Logger\
    \ | SAS 9.4 M0 | 提供方法来检测当前 SAS 会话中哪些哪些 SAS 日志设施的消息级别，并按用户选择的级别写入消息。此包非常易用，但目前在客户端/服务器模式下运行时它不会产生输出。因此，在\
    \ SAS Studio 或 SAS Enterprise Guide 中编程时它并不可用。由于这些原因，书中不会有 logger 包章节，但在这里提到它是为了让我们不忘记它的存在。\
    \ |\n| Matrix | SAS 9.4 M0 | 在 DS2 中实现 SAS/IML 能力，提供强大灵活的矩阵编程工具。使用 matrix 包不需要\
    \ Base SAS 授权。 |\n| SQLSTMT | SAS 9.4 M0 | 提供方法将动态 FedSQL 语句传递给数据库进行执行，并在不使用 SET\
    \ 语句的情况下访问任何生成的结果行。 |\n| TZ | SAS 9.4 M3 | 提供方法以便在 DS2 程序中处理本地和国际日期时间值。 |\n\n\
    # 5.2 在 DS2 中执行 FCMP 函数\n\n# 5.2.1 FCMP 包\n\nSAS 编译过程 (PROC FCMP) 允许你创建 SAS 函数和\
    \ CALL 例程，这些例程随后可以在其他 SAS 或 DATA 步中使用。PROC FCMP 使用类于 DATA 步的语法构建自定义函数，并将结果存储在数据集中。在\
    \ SAS 数据集中，FCMP 函数被分组为相关的“包”。这些 FCMP 包不应与 DS2 包混淆。FCMP 包是存储在单个 SAS 数据中的函数子集。DS2\
    \ 包是用于收集方法和数据类型的整个数据集。\n\n当存储在持久性 SAS 库时，FCMP 函数可以像原生 SAS 函数一样在随后的程序中重用。在指定 CMPLIB\
    \ 系统选项以识别 FCMP 数据集后，你就可以像使用原生函数一样在代码中使用这些函数。\n\n# 5.2.2 FCMP 包示例\n\n让我们使用 PROC\
    \ FCMP 构建几个自定义函数，并在 DS2 程序中使用它们。随后我们将修改其中一个 PROC FCMP 函数，然后检查修改是否自动反映在我们的 DS2\
    \ 程序中而无需任何维护。\n\n# 5.2.2.1 使用 PROC FCMP 创建自定义函数\n\n以下 PROC FCMP 步创建了自定义函数：\n\n\
    ```\n* 创建 FCMP 函数 */\nproc fcmp outlib = crs.fcmp_functions.ourFuncs;\nfunction\
    \ ourGMP(GS, Cog);\n  /* 毛利率 % */\n  return ((GS-Cog)/GS);\nendsub;\nfunction\
    \ forBE(GS, Fix, Units);\n  /* 盈亏点（单位） */\n  return (ceil(Fix/(GS/Units)) - (Cog/Units)));\n\
    endsub;\nrun;\nquit;\n```\n\n好奇的人（像我一样！）可能会想查看 PROC FCMP 创建的数据集内部。该数据集包含指示名称的变量。\n\
    \n"
