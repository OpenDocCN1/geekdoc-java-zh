    \      NetRevenue=GrossSales-CostOfGoods-Fixed;\n    end;\n  enddata;\n  run;\n\
    quit;\n\ntitle \"Underperforming Sales Items - DS2 Data Step\";\n  proc data=work.underperforming_ds2\
    \ noobs label;\n    var SupplierName ProductName Product_ID UNITS;\n    var BreakEven;\n\
    \    var GrossSales CostOfGoods Fixed GrossMargin NetRevenue;\n  run;\n  title;\n\
    ```\n\n### 5.2.2 Reported Using FCMP Functions in DS2\n\nUnderperforming Sales\
    \ Items - DS2 Program\n\n| SupplierName | ProductName | Product ID | Units | Gross\
    \ Sales | Cost of Goods | Gross Margin % | NetRevenue |\n|---|---|---|---|---|---|---|---|\n\
    | Carolina Sports | Bat-5-Py | 24040200003 | 10000 | 1065 | $80,600.00 | $39,000.00\
    \ | 51.6% | -$2,597.20 |\n| NautilusWear Inc | Capy Hood | 24100100031 | 5000\
    \ | 7083 | $24,050.00 | $8,450.00 | 64.9% | -$6,498.60 |\n| Top Sports Inc | Baseball\
    \ White | 240702020007 | 5000 | 5862 | $33,150.00 | $14,300.00 | 56.9% | -$3,248.60\
    \ |\n| Van Dammeren International | Tee Holder | 240200100021 | 5000 | 11333 |\
    \ $17,550.00 | $7,800.00 | 55.6% | -$12,348.60 |\n\nBy comparing this report to\
    \ the report shown in Figure 5.1, we can see that the results are identical. Therefore\
    \ we can conclude that the FCMP functions are working in DS2.\n\n### 5.2.2.3 Testing\
    \ FCMP Modifications in DS2\n\nIf we modify the FCMP function, we would expect\
    \ the modification to be immediately reflected in traditional SAS as in DS2 programs.\
    \ Let's modify the ourBE function so that it no longer rounds to the next number\
    \ but instead returns values. After the modification, we will rerun the traditional\
    \ SAS and DS2 process and compare the results:\n\n```sas\ntitle=\"Underperforming\
    \ Sales Items After Mod - Base Data Step\";\ntitle2=\"ourBE returns fractions\
    \ instead of CEIL value\";\nproc print data=work.underperforming_base noobs label;\n\
    var SupplierName ProductName Product_ID UNITS;\nvar BreakEven /style=[BACKGROUND=blue];\n\
    var GrossSales CostOfGoods Fixed GrossMargin NetRevenue;\nrun;\n```\n\n```sas\n\
    proc ds2;\ndata work.underperforming_ds2 (overwrite=yes);\ndcl package crs.fcmp_funcs\
    \ myPkg();\ndcl double Product_ID having format label12. label 'Product ID';\n\
    dcl double GrossSales having format dollar1.2\nlabel 'Gross Sales';\ndcl double\
    \ CostOfGoods having format dollar1.2\nlabel 'Cost of Goods';\ndcl double GrossMargin\
    \ having format percent7.1\nlabel 'Gross Margin %';\ndcl double Fixed having format\
    \ dollar1.2 label 'Fixed Costs';\ndcl double Units having label 'Units Sold';\n\
    dcl double BreakEven having label 'Break Even (Units)';\ndcl double GrossProfit\
    \ having format dollar1.2\nlabel 'Gross Profit (Total)';\ndcl double NetRevenue\
    \ having format dollar1.2\nlabel 'Net Revenue';\nrun();\nset crs.Sales_2014;\n\
    /*This code uses the ourBE method from myPkg*/\nBreakEven=myPkg.ourBE(GrossSales,CostOfGoods,Fixed,Units);\n\
    if breakeven > units;\n/*This code uses the custom GMP function */\nGrossMargin=myPkg.ourGMP(GrossSales,CostOfGoods);\n\
    NetRevenue=GrossSales-CostOfGoods-Fixed;\nend;\nenddata;\nrun;\nquit;\n```\n\n\
    title \"Underperforming Sales Items After Mod - DS2 Data Step\";\ntitle2 \"ourBE\
