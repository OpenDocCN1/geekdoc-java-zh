  mdcn: "\n\n## 7.3 使用 SAS 日志分析性能\n\n### 7.3.1 获取性能统计数据\n\nSAS 的默认选项设置可以在 SAS 日志中提供少量的性能报告。以下是在\
    \ Linux 下（SAS University Edition 使用的操作系统）报告的默认性能统计示例：\n\n以下是 SAS 日志中标准性能统计的示例：\n\
    \n```\nNOTE: PROCEDURE DS2 used (Total process time):\n  real time           \
    \     2.35 seconds\n  cpu time                 0.17 seconds;\n```\n\n你会发现，SAS\
    \ 只有在执行 PROC DS2 会话的 `QUIT` 语句后才会生成性能统计数据，因此如果你包含了多个 DS2 步骤，你只能获得整个过程的汇总结果。为了故障排除和调优，尝试将每个\
    \ DS2 程序放在单独的 PROC DS2 会话中，以获得更粒度的结果。\n\n当你的程序运行不佳时，问题通常归结为一个或多个因素：\n\n- CPU\n\
    - 内存\n- I/O\n- 网络延迟\n\n在追踪性能问题或尝试优化代码时，设置 `OPTIONS FULLSTIMER` 可以提供更详细的信息，帮助你缩小系统可能出现问题的范围。然后，你可以尝试以不同的方式编写代码，通过缓解检测到的任何问题来减轻性能问题。\n\
    \n以下是使用 FULLSTIMER 报告的性能统计数据示例：\n\n| PROCEDURE DS2 used (Total process time):\
    \ | | |\n| :--- | :--- |\n| real time | 2.35 seconds |\n| cpu time | 0.10 seconds\
    \ |\n| system cpu time | 0.07 seconds |\n| memory | 5738.84k |\n| OS Memory |\
    \ 30268.00k |\n| Timestamp | 02/14/2016 10:23:11 AM |\n| Step Count | 87 Switch\
    \ Count 50 |\n| Page Faults | 0 |\n| Page Reclaims | 1925 |\n| Page Swaps | 0\
    \ |\n| Voluntary Context Switches | 2648 |\n| Involuntary Context Switches | 191\
    \ |\n| Block Input Operations | 0 |\n| Block Output Operations | 0 |\n\n## 精通\
    \ SAS DS2 过程：高级数据处理技术\n\n如你所见，开启 FULLSTIMER 后，报告的信息要丰富得多。以下是某些选性能统计数据的描述性信息：\n\
    \n表 7.1：SAS 日志中的性能统计\n\n| 统计量 | 意义 |\n| :--- | :--- |\n| 真实时间 (Real Time) | 这是作业执行期间经过的“挂钟”时间——例如，你等待步骤完成花费的时间。如果系统中除\
    \ SAS 之外还运行其他程序，真实时间可能会根据 SAS 等待其他进程使用的系统资源的长短对同一作业产生显著波动。 |\n| CPU 时间 (CPU Time)\
    \ | 在未启用 FULLSTIMER 时，SAS 将 CPU 时间和系统时间之和报告为 CPU 时间。启用 FULLSTIMER 时，CPU 时间和系统时间分开报告。在启用并行处理时，CPU\
    \ 时间可能大于真实时间。 |\n| 用户 CPU 时间 (User CPU Time) | 这是执行用户代码时消耗的 CPU 时间，包括你编写的 SAS\
    \ 程序以及支持其执行的内置 SAS 过程。 |\n| 系统 CPU 时间 (System CPU Time) | 这是操作系统支持用户编写的代码时消耗的\
    \ CPU 时间。 |\n| 内存 (Memory) | 这是分配给此作业或步骤的内存，不包括 SAS 系统开销。 |\n| 非自愿上下文切换 (Involuntary\
    \ Context Switches) | 进程非自愿释放 CPU 时间切片的次数。原因包括在作业完成前用完 CPU 时间，或另一个任务因为优先级更高而抢占时间切片。\
    \ |\n| 页面交换 (Page Swaps) | 进程被交换出主内存的次数。 |\n\n在进行性能基准测试时，必须在单独 SAS 会话中多次运行进程的每个版本，并在比较之前平均性能结果。能够从\
    \ SAS 日志中提取统计数据并保存到 SAS 数据集中以供以后分析非常有帮助。实验性的 `%LOGPARSE` 可以从 SAS 支持网站下载，它可以在一定程度上为你自动化此过程。\n\
    \n如果这些技术未能识别你的问题，配置 SAS 日志设施使用某些 DS2 日志记录器可能会帮助。设置 SAS 使用这些日志记录器初可能令人生畏，但使用这种技术可以获得大量详细信息。参见标题为“DS2\
    \ Loggers”的 SAS DS2 语言参考。另请参见 SAS Logging: Configuration and Programming Reference。\n\
    \n## 第 7 章：DS2 中的性能调优\n\n### 7.3.2 分析性能统计数据\n\n要进行的第一个比较之一是实际 CPU 时间。如果你的任务执行时，真实时间和\
    \ CPU 时间始终在彼此的 10% 到 15% 以，那么限制因素可能是 CPU 时间，你的任务是 CPU 密集型的。如果真实时间与 CPU 时间之间存在巨大差异，限制因素可能是\
    \ I/O，你的进程可能是 I/O 密集型的。通过分析其余统计数据可以从 FULLSTIMER 获取其他有用信息。在 support.sas.com 上搜索“FULLSTIMER\
    \ SAS option”将提供关于如何操作的更深入的指导。\n\n通常情况下，如果你的任务从安装了 SAS 数据库内代码加速器的 DBMS 表中读取数据，如果将数据程序重写为线程，并使用\
    \ `SET` 语句从数据程序执行该线程，其运行速度将快得多。如果数据输出也是数据库表且你的数据库也是如此，性能会更好。\n\n- CPU\n- 内存\n\
    - I/O\n- 网络延迟\n\n在追踪性能问题或尝试优化代码时，设置 `OPTIONS FULLSTIMER` 可以提供更详细的信息，帮助你缩小系统可能出现问题的范围。然后，你可以尝试以不同的方式编写代码，通过缓解检测到的任何问题来减轻性能问题。以下是使用\
    \ FULLSTIMER 报告的性能统计数据示例：\n\n| PROCEDURE DS2 used (Total process time): | | |\n\
    | :--- | :--- |\n| real time | 2.35 seconds |\n| cpu time | 0.10 seconds |\n|\
    \ system cpu time | 0.07 seconds |\n| memory | 5738.84k |\n| OS Memory | 30268.00k\
    \ |\n| Timestamp | 02/14/2016 10:23:11 AM |\n| Step Count | 87 Switch Count 50\
    \ |\n| Page Faults | 0 |\n| Page Reclaims | 1925 |\n| Page Swaps | 0 |\n| Voluntary\
    \ Context Switches | 2648 |\n| Involuntary Context Switches | 191 |\n| Block Input\
    \ Operations | 0 |\n| Block Output Operations | 0 |\n\n## 精通 SAS DS2 过程：高级数据处理技术\n\
