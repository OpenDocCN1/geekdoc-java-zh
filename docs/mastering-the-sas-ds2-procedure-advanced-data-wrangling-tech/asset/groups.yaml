    \ interest that returns the total after compounding for a user-specified number\
    \ of periods each year. The new interest algorithm looks like this:\n\n```sas\n\
    do i=1 to Years;\n  do j=1 to Periods;\n```\n\nWe'll need to add a parameter to\
