    # 1.1 Introduction


    Today''s data scientists deal with ever larger data sets from a widening variety
    of data sources, and the computations required to process that data are continually
    becoming more complex. As the SAS System has been modernized with each new release,
    SAS procedures (ProCs) have been rewritten to be thread-enabled, allowing them
    to use multiple computers or even to push into massively parallel processing (MPP)
    environments such as Teradata, Hadoop, or the SAS High-Performance Analytics grid.
    But the data step, with its sequential, observation-by-observation approach to
    data manipulation, has remained stubbornly


    In the summer of 2013, SAS released SAS 9.4, which included a revolutionary new
    programming language named DS2. DS2 is basically DATA step programming redesigned
    from the ground up with several important goals.


    Here is what DS2 can do:


    +   - natively process American National Standards Institute (ANSI) SQL data types
    for better integration with external stores

    - provide modern structured programming constructs, making it simple to extend
    the functionality of the DS2 language with reusable code modules

    - tightly integrate with SQL

    - provide simple, safe syntax for multi-threaded processing to accelerate CPU-intensive
    tasks


    I like to think of DS2 as a language that retains the power and control of the
    Base SAS DATA step programming language combined with the simplicity of SAS and
    with just object-oriented features to make simple, reusable code modules a reality.


    If you have a SAS/ACCESS license for a supported database management system (DBMS),
    the traditional SAS DATA step can process DBMS data, but native data types are
    first translated to SAS 8-byte floating-point numeric or fixed-width character
    types by the LIBNAME engine. This causes a loss of precision when dealing with
    higher-precision ANSI data types, as BIGINT or DECIMAL. DS2 is capable of directly
    manipulating ANSI data types—including multi-byte character types—even when processing
    on the SAS compute platform. Figure 1.1'
