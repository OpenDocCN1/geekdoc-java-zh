  - '[PAGE 64]


    # 48 Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques


    Basically, the behavior of null and missing values in DS2 SAS mode are just as
    we would expect in traditional Base SAS processing.


    # 3.3.4.3 PROC DS2 ANSI Mode


    You invoke PROC DS2 in ANSI mode by including the ANSIMODE option in the PROC
    DS2 statement. In ANSI mode, expressions resolving to an unknown value produce
    ANSI null values as an intermediate result. Numeric missing values are immediately
    converted to ANSI null values, so DOUBLE variables never contain SAS missing values
    in ANSI mode.


    Here are the other pertinent rules for missing and null values while operating
    DS2 in ANSI mode:


    +   * Numeric missing values are automatically converted to null when read from
    a SAS data set.

    * SAS character variables read from SAS data sets are actually stored with space
    filling the entire length of the variable. In ANSI mode, these variables appear
    to be character strings padded entirely with blanks of ANSI null values, and even
    the SAS MISSING function will not evaluate them as missing.

    * Numeric null values are automatically converted to missing when passed to a
    Base SAS function as a parameter value.

    * In comparisons a character value to a single blank, the single blank is interpreted
    as an ANSI space character, not null.


    Executing program Ch3_3_3.43.sas demonstrates the handling of SAS missing and
    ANSI null values in PROC DS2 operating in ANSI mode.


    SAS Log:


    ```

    *** From SAS Data Set ***

    *** DS2 CHAR Values - ANSI Mode ***

    C is not ''=''

    missing(C) is not true.

    null(C) is not true.


    *** DS2 DOUBLE Values - ANSI Mode ***

    N is not ''=''

    missing(N) is true.

    null(N) is true.


    *** ANSI Mode Using ANSI Varchar and Decimal Variables ***

    *** DS2 VARCHAR Values ***

    Var is not ''=''

    missing(Var) is true.

    null(Var) is true.


    *** DS2 DECIMAL Values ***

    Dec is not ''=''

    missing(Dec) is true.

    null(Dec) is true.

    ```


    Note that the VARCHAR and DECIMAL null values evaluate exactly the same as they
    did in SAS mode, but the CHAR and DOUBLE values behave differently.'
