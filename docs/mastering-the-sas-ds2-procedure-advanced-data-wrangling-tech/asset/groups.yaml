  - "[PAGE 122]\n\n106 Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\
    \n# 5.7 The TZ (Time Zone) Package\n\n# 5.7.1 General\n\nDS2 can process ANSI\
    \ date and time values of the data types DATE, TIME, and TIMESTAMP. These data\
    \ types are non-coercible, which means that, when processing SAS and RDBMS data\
    \ together, it will be necessary to explicitly convert SAS date, and datetime\
    \ values to ANSI dates, time, and timestamp values using the TO_DATE, TO_TIME,\
    \ and TO_TIMESTAMP functions. However, these functions do not take time zones\
    \ into consideration. You can think of each instance of the TZ package as a clock\
    \ for a specific time zone, with methods to easily obtain details about local\
    \ time such as:\n\n+   - current time\n- coordinated universal time (UTC) time\n\
    - time zone ID\n- time zone name\n- time zone offset from UTC for a specified\
    \ local time\n- time offset from local time for a specified UTC time\n\nThe TZ\
    \ package processed and returns DOUBLE type SAS date, and datetime values.\n\n\
    # 5.7.1.1 Declaring, Instantiating, and Using a TZ Package\n\nOnce instantiated,\
    \ package methods are used to obtain information about time. As a quick example,\
    \ this program uses two instances of the TZ package to provide the local time\
    \ on my computer and the time in my hometown of Fortaleza, Ceará, Brazil.\n\n\
    ```\ndcl package tz L();\n  dcl package tz F('America/Fortaleza');\n  dcl double\
    \ Local Fortaleza having format datetime;\n  method init();\n    Local=L.getLocalTime();\n\
    \    Fortaleza=F.getLocalTime();\n    put Local= Fortaleza=;\n  end;\nendata;\n\
    run;\nquit;\n```\n\nSAS Log:\n\n```\nLocal=17JAN16:09:21:30 Fortaleza=17JAN16:11:21:30\n\
    ```"
- md: "\n## 5.7.2 TZ Package Example\n\nWe have a data set, crs.cities, that contains\
    \ information about all of the cities in which we have brick and mortar stores.\
    \ We would like to report a report that shows the local time on the SAS server,\
    \ as well as the local time and UTC offset for each of those cities.\n\n### 5.7.2.1\
    \ All Executable Statements Must Be Part of METHOD Code Block\n\nOur solution\
    \ code uses two instances of the TZ package to do the work. The TZ package for\
    \ the local server will be instantiated at compile time, the city TZ package will\
    \ be instantiated at runtime using the _NEW keyword and information from the TimeZone\
    \ variable in the crs.cities data\n\n```sas\nproc ds2;\ndata;\n /* Instantiate\
    \ the TZ package */\ndcl package tzServer();\n/* Declare but do not instantiate\
    \ the city TZ package */\ndcl package tzCity;\ndcl double DTCity DTServer having\
    \ format datetime.;\ndcl int TimeDifference;\ndcl varchar(20) TimeZoneID;\ndrop\
    \ TimeZone long;\nmethod run();\n set crs.cities;\n/* Instantiate the city TZ\
    \ package */\n/* using TimeZone variable from data set */\ntzCity_new = tz(TimeZone);\n\
    /* Get server current time */\nDTServer=tzServer.getLocalTime();\n/* Get city\
    \ current time and time zone ID */\nDTCity-dtCity=tzCity.getLocalTime();\nTimeZone=tzCity.getTimeID();\n\
    /* Calculate offset from server time in hours */\nTimeDifference=tzServer.getoffset(time(),\
    \ TimeID)/3600;\nend;\nnadata;\nrun;\nquit;\n```\n\nFigure 5.21: Date/Time Information\
    \ Produced with the TZ Package\n\n| DTCity | DTServer | TimeDifference | TimeZone\
    \ | AU | City |\n|---|---|---|---|---|---|\n| 20JAN16:23:42:22 | 20JAN16:07:42:22\
    \ | | 11 | Australia/Melbourne | Melbourne |\n| 20JAN16:23:42:22 | 20JAN16:07:42:22\
    \ | | 11 | Australia/Sydney | Sydney |\n| 20JAN16:07:42:22 | 20JAN16:07:42:22\
    \ | | -5 | America/New_York | Miami |\n| 20JAN16:07:42:22 | 20JAN16:07:42:22 |\
    \ | -5 | America/New_York | Philadelphia |\n| 20JAN16:04:42:22 | 20JAN16:07:42:22\
    \ | | -8 | America/Los_Angeles | San Diego |\n\n## 5.8 Review of Key Concepts\n\
    \n- *SAS uses predefined DS2 packages to extend the capabilities of the DS2 language.*\n\
    - PROC FCMP can create custom functions for use in traditional SAS DATA step and\
    \ PROC SQL processing.\n- The FCMP package allows DS2 to use FCMP functions as\
    \ if they were methods stored in a DS2 package, without requiring copying or extra\
    \ maintenance.\n- Hash and h objects provide speedy lookup features in a DS2 program\
    \ when implemented using the hash and hiter packages.\n- The HTTP package enables\
    \ querying Internet APIs from a DS2 program, and the JSON package provides the\
    \ methods necessary to parse the JSON returned from an API query.\n- The matrix\
    \ package provides powerful matrix programming capabilities for your DS2 programs.\n\
    - The SQLSTMT package makes it possible to perform cross-library table updates\
    \ without requiring both tables to reside in the same DBMS, without the need for\
    \ correlated subqueries, and without the need to learn DBMS-specific SQL.\n- The\
    \ TZ package makes dealing with date, time, and timestamp data from multiple time\
    \ zones a snap\n\n## Chapter 6: Parallel Processing in DS2\n\n6.1 Introduction\
    \ ................................................................. 109\n\n6.2\
    \ Understanding Threaded Processing ............................................\
    \ 110\n\n6.2.1 The Need for Speed..................................................................\
    \ 110\n\n6.2.2 Loading Data to and from RAM......................................................\
    \ 110\n\n6.2.3 Manipulating Data in RAM.........................................................\
    \ 110\n\n6.3 DS2 Thread Programs................................................................\
    \ 111\n\n6.3.1 Writing DS2................................................................\
    \ 111\n\n6.3.2 Parallel Data...............................................................\
    \ 113\n\n6.4 Running DS2................................................................\
    \ 116\n\n6.5 Review of Key Concepts .................................................\
    \ 117\n\n### 6.1 Introduction\n\nIn Chapter 1 we noted that off-line storage has\
    \ always been the bottleneck for processing data. But with the evolution of memory,\
    \ we'll break down the problem into two major categories: moving data from-line\
    \ storage into system memory (RAM) and processing data that is resident in memory.\
    \ Specifically, we will cover these points:\n"
  mdcn: "\n\n## 5.7.2 TZ 包示例\n\n我们有一个数据集 `crs.cities`，其中包含了我们所有拥有实体店的城市信息。我们希望生成一份报告，显示\
    \ SAS 服务器的本地时间，以及这些城市中每个城市的本地时间和 UTC 偏移量。\n\n### 5.7.2.1 所有可执行语句必须是 METHOD 代码块的一部分\n\
    \n我们的解决方案代码使用了两个 TZ 包的实例来完成工作。本地服务器的 TZ 包将在编译时实例化，而城市 TZ 包将将在运行时使用 `_NEW` 关键字和来自\
    \ `crs.cities` 数据集中 `TimeZone` 变量的信息进行实例化。\n\n```sas\nproc ds2;\ndata;\n /* Instantiate\
    \ the TZ package */\ndcl package tzServer();\n/* 声明但不实例化城市 TZ 包 */\ndcl package\
    \ tzCity;\ndcl double DTCity DTServer having format datetime.;\ndcl int TimeDifference;\n\
    dcl varchar(20) TimeZoneID;\ndrop TimeZone long;\nmethod run();\n set crs.cities;\n\
    /* 实例化城市 TZ 包 */\n/* 使用数据集中的 TimeZone 变量 */\ntzCity_new = tz(TimeZone);\n/* 获取服务器当前时间\
    \ */\nDTServer=tzServer.getLocalTime();\n/* 获取城市当前时间和时区 ID */\nDTCity-dtCity=tzCity.getLocalTime();\n\
    TimeZone=tzCity.getTimeID();\n/* 计算与服务器时间的小偏移（小时） */\nTimeDifference=tzServer.getoffset(time(),\
    \ TimeID)/3600;\nend;\nnadata;\nrun;\nquit;\n```\n\n图 5.21：使用 TZ 包生成的日期/时间信息\n\
    \n| DTCity | DTServer | TimeDifference | TimeZone | AU | City |\n|---|---|---|---|---|---|\n\
    | 20JAN16:23:42:22 | 20JAN16:07:42:22 | | 11 | Australia/Melbourne | Melbourne\
    \ |\n| 20JAN16:23:42:22 | 20JAN16:07:42:22 | | 11 | Australia/Sydney | Sydney\
    \ |\n| 20JAN16:07:42:22 | 20JAN16:07:42:22 | | -5 | America/New_York | Miami |\n\
    | 20JAN16:07:42:22 | 20JAN16:07:42:22 | | -5 | America/New_York | Philadelphia\
    \ |\n| 20JAN16:04:42:22 | 20JAN16:07:42:22 | | -8 | America/Los_Angeles | San\
    \ Diego |\n\n## 5.8 关键概念回顾\n\n- *SAS 使用预定义的 DS2 包来扩展 DS2 语言的能力。*\n- PROC FCMP\
    \ 可以创建自定义函数，用于传统的 SAS DATA 步和 PROC SQL 处理。\n- FCMP 包允许 DS2 使用 FCMP 函数，就像它们是存储在\
    \ DS2 包中的方法一样，而无需进行复制或额外的维护。\n- 当使用 `hash` 和 `hiter` 包实现时，Hash 和 h 对象为 DS2 程序提供了快速查找功能。\n\
    - HTTP 包允许从 DS2 程序查询 Internet API，而 JSON 包提供了解析从 API 查询中返回的 JSON 所需的方法。\n- 矩阵包为您的\
    \ DS2 程序提供了强大的矩阵编程能力。\n- SQLSTMT 包使得执行跨库表更新成为可能，而不需要两个表都位于同一个 DBMS 中，也不需要相关子查询，更不需要学习特定\
    \ DBMS 的 SQL。\n- TZ 包使得处理来自多个时区的日期、时间和时间戳数据变得轻而易举。\n\n## 第 6 章：DS2 中的并行处理\n\n\
