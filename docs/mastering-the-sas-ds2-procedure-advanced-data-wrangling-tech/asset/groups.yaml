    \ 127\n\n# 前言\n\n在多年管理 SAS 产品某些核心数据处理语言（如 DATA step、DS2、PROC SQL 和 FedSQL）开发的过程中，我深体会到教育的价值。如果一项技术无法被其受益的人所理解，那么它再好也无意义。而且仅仅将事实汇集成册并不等同于教学生。\n\
    \nMark 在他的新书《精通 SAS DS2 过程：高级数据处理技术》中，成功地为 SAS DS2 语言的语法，更重要的是为该语言的目标提供了一个极其简洁的介绍。他系统地构建了示例，使读者能够以一种令人愉快的节奏不断翻页。他在书中包含的\
    \ DATA-step-to-DS2 比较有助于经验丰富的 SAS 程序员快速在新语言中找到方向，同时并不要求先成为 DATA step 专家才能学习 DS2。\n\
    \n他对 DS2 程序包库的覆盖特别别有价值，因为这些大型功能块说明了 DS2 的核心设计原则之一：程序包允许通过 SAS 提供的或用户编写的大型组件来扩展语言功能。在数据量爆炸和网格计算的时代，对并行执行的关注是非常及时的，而\
    \ DS2 非常适合这个新的并行世界。\n\n最后，我特别喜欢 Mark 关于他与该语言历程的个人轶事，他发现了缺失的内容、不同之处、独特之处以及原因。我将\
    \ Mark 视为 DS2 设计团队的延伸部分，并重视他关于未来如何改进语言的意见。\n\nRobert Ray\n研发部总监\nSAS Institute\
    \ Inc.\n北卡罗来纳州卡里\n\n# 关于本书\n\n# 目的\n\n本书将带你从一个完全的新手变为对新的 SAS 编程语言 DS2 的熟练运用。\n\
    \n# 这本书适合你吗？\n\n你对传统的 Base SAS DATA step 和 SQL 处理感到熟悉吗？想要增强你的数据准备能力吗？那么 DS2 这种集成了\
    \ DATA step 的力量和控制以及 SQL 的易用性、活性和丰富数据类型面板的新型 SAS 编程语言可能正是你正在寻找的！DS2 可以与多个数据源良好地协作，非常适合在\
    \ Hadoop、Greenplum 和 Teradata 等大规模并行平台 (MPP) 上处理数据。\n\nDS2 赋予了你完成此类任务的能力：\n\n\
    - 传统的数据准备\n- 在海量并行平台 (MPP) 上操作数据\n- 在数据库内执行程序\n- 在并行平台上处理数据\n\n# 前提条件\n\n本书假设你精通以下内容：\n\
    - 传统的 Base SAS DATA step\n- SQL 处理\n- DATA step 编程\n- SAS 库\n\n# 本书范围\n\n本书涵盖以下主题：\n\
    - DATA step 的力量和控制\n- SQL 的易用性、活性和丰富的数据类型面板\n- 多数据源\n- 在 Hadoop、Greenplum 和 Teradata\
    \ 等大规模并行平台 (MPP) 上操作数据\n- 在数据库内执行程序\n- 并行执行\n- 面向编程\n\n# 开发本书使用的软件\n\n书中大部分程序仅使用\
    \ Base SAS，并使用 SAS University Edition 开发。然而，有少数程序读取或写入 Teradata 表。这些程序无法在 SAS\
    \ University Edition 中执行，因为没有包含 SAS/ACCESS Teradata 接口。\n\n# 参考文献\n\n编写本书的主要参考是在线文档的以下章节：\n\
    - SAS® 9.4 DS2 语言参考\n- SAS® 9.4 语句\n- SAS® 9.4 函数和 CALL 例程\n- SAS® 9.4 FedSQL\
    \ 语言参考\n\n# 示例代码和数据\n\n要访问书中的示例代码和数据，请访问 http://support.sas.com/publishing/authors\
    \ 上的作者页面。选择作者姓名。然后。\n\n如果你无法通过网站访问代码，请发送电子邮件至 saspress@sas.com。\n\n# SAS University\
    \ Edition\n\n如果使用 SAS University Edition 访问数据并运行程序，请检查 SAS University Edition\
    \ 页面以确保软件包含运行代码所需的组件。书中大部分程序仅需 Base SAS 即可在 SAS University Edition 中运行。然而，少数程序读取或写入\
