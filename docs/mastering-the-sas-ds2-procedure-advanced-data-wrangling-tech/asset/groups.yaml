    \ have global scope. All of these variables can be referenced in both the RUN\
    \ and TERM methods, and all are included in the program result set.\n\n```\nproc\
    \ ds2;\ndata;\n  dec Total Count;\n  method run();\n    set crs.one_day (keep=(Payee\
    \ Amount));\n    Total+Amount;\n    Count+1;\n  end;\n  method term();\n    put\
    \ Total= Count=;\n  end;\nenddata;\nrun;\nquit;\n```\n\nSAS Log:\n\nTotal=7230.5\
    \ Count=6\n\nFigure 2.5: Report Produced by the Data Program\n\n| Obs | Total\
    \ | Payee | Amount |\n|---|---|---|--|\n| 1 | 9.60 | 1 Misc | $9.60 |\n| 2 | 19.91\
    \ | 2 Ice Cream | $10.31 |\n| 3 | 37.91 | 3 Services | $18.00 |\n| 4 | 230.50\
    \ | 4 Big Retailer | $192.59 |\n| 5 | 3230.50 | 5 Misc | $3,000.00 |\n| 6 | 7230.50\
    \ | 6 Misc | $4,000.00 |\n\nIn the next DS2 program, the variables Total and Count\
    \ are locally declared in the RUN method. As a result, their scope is local to\
    \ RUN and can be referenced only by the RUN method. When the TERM method attempts\
    \ to reference variables Total and Count, they are not available in the PDV, so\
    \ the DS2 compiler treats these as new, undeclared variables. Warning messages\
    \ are produced in the SAS log and, and because undeclared variables have global\
    \ scope, Total and Count"
- md: "\n## Chapter 2: Introduction to the DS2 Language\n\nare included in the PDV\
    \ and the program result set. However, because the global variables of these variables\
    \ were never assigned a value, Total and Count contain missing values in the output:\n\
    \n```\nproc ds2;\ndata;\n  method run();\n    declare double Total Count;\n  \
    \  set crs.one_day (keep=(Payee Amount));\n    Total+Amount;\n    Count+1;\n \
    \ end;\n  method term();\n    put Total= Count=;\n  end;\nendata;\nrun;\nquit;\n\
    ```\n\nSAS Log:\nTotal=. Count=.\nWARNING: Line nn: No DECLARE for referenced\
    \ variable total; creating it as a global variable of type double.\nWARNING: Line\
    \ nn: No DECLARE for referenced variable count; creating it as a global variable\
    \ of type double.\n\nFigure 2.6: Report Produced by the Data Program Showing Missing\
    \ Values\n\n| Obs | Payee | Amount | Total | Count |\n|---|---|---|---|---|\n\
    | 1 | Misc | $9.60 | . | . |\n| 2 | Ice Cream | $10.31 | . | . |\n| 3 | Services\
    \ | $18.00 | . | . |\n| 4 | Big Retailer | $192.59 | . | . |\n| 5 | Misc | $3,000.00\
    \ | . | . |\n| 6 | Misc | $4,000.00 | . | . |\n\nIf we delete the TERM method\
    \ from the program, the only reference to the variables Total and Count are the\
    \ local variables in the RUN method, they will not be included in the PDV at all.\
    \ No warnings about undeclared variables are issued in the SAS log, and the result\
    \ set contains only the global variables Payee and Amount:\n\n```\nproc ds2;\n\
    data;\n  method run();\n    declare double Total Count;\n    set crs.one_day (keep=(Payee\
    \ Amount));\n    Total+Amount;\n    Count+1;\n  end;\n```\n\n## Mastering the\
    \ SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\n```\nenddata;\nrun;\n\
    quit;\n```\n\nFigure 2.7: Report Produced by the Data Program with Local Variables\
    \ Excluded\n\n| Obs | Payee | Amount |\n|---|---|---||\n| 1 | Misc | $9.60 |\n\
    | 2 | Ice Cream | $10.31 |\n| 3 | Services | $18.00 |\n| 4 | Big Retailer | $192.59\
    \ |\n| 5 | Misc | $3,000.00 |\n| 6 | Misc | $4,000.00 |\n\nUser-defined methods\
    \ can accept parameters. Parameters passed by value are treated as variables with\
    \ local scope within the method. For example, in the following program, the user-defined\
    \ fullname has two parameters, first and last, which act as local variables. There\
    \ is also one locally declared variable, FinalText. The main data program has\
    \ three globally declared variables, WholeName, GivenName, and Surname, which\
    \ will be included in the PDV. The result set contains only the global variables\
    \ WholeName, GivenName, and Surname.\n\n```\nproc ds2;\ndata;\n  declare varchar(100)\
    \ WholeName;\n  method fullname(varchar(50) first, varchar(50) last)\n    returns\
    \ varchar(100);\n    dcl varchar(100) FinalText;\n    FinalText=catx(', ',last,first);\n\
    \    Return FinalText;\n  end;\n  method run();\n    set crs.customer_sample (keep=(GivenName\
    \ Surname));\n    FullName=fullname(GivenName, Surname);\n  end;\nenddata;\nrun;\n\
    quit;\n```\n\n## Chapter 2: Introduction to the DS2 Language\n\nFigure 2.8: Report\
    \ Produced by the Data Program\nIncome levels\n\n| WholeName | GivenName | Surname\
    \ |\n|---|---|---|\n| Schmidt, William | | Schmidt |\n| Laverty, Daniel | | Laverty\
    \ |\n| Grayson, Sarah | | Grayson |\n| Hastings, Eldon | | Hastings |\n\nIf you\
    \ have stored snippets of code in a SAS program for inclusion in a traditional\
    \ DATA step, you have probably experienced what I refer as PDV contamination.\
    \ When the included code references a variable that already existed in the main\
    \ program, or when it includes new variables, PDV values for existing variables\
    \ can be inadvertently modified by the included code. Also, unwanted variables\
    \ can be added to the PDV and appear in the output data set. When using DS2 methods,\
    \ the method's local variables never affect the PDV, a concept often referred\
    \ to as variable encapsulation. Because method parameters and locally declared\
    \ variables are local scope, they are encapsulated in your method and will not\
    \ contaminate the PDV. In a later chapter, we will store our user-defined methods\
    \ in a DS2 package for simple reuse in future programs. Because of variable encapsulation,\
    \ you will never need to worry about PDV contamination when properly written DS2\
    \ methods.\n\n## 2.2 Data Execution\n\nDS2 data programs are delivered by the\
    \ compiler for syntax checking, compilation, and execution. At compile time, resources\
    \ are reserved for the PDV, the code is compiled for execution, and an output\
    \ data set is produced, the descriptor is written. After compilation, execution\
    \ begins with the INIT method, and is automatically followed by the RUN and TERM\
    \ method. Only system methods execute automatically; any user-defined method must\
    \ be called from the INIT, RUN, or TERM methods to be executed.\n\n## 2.3 Converting\
    \ a SAS DATA Step to DS2 Program\n\n### 2.3.1 A Traditional DATA Step\n\nHere\
    \ is a traditional DATA step with three subsections, which we will convert into\
    \ a DS2 data program:\n\n```\ndata null;\n/* Section 1 */\nif n_=1 then\ndo\n\
    \  put '*********';\n  put 'Starting';\n\n/* Section 2 */\nset crs.banks=last;\n\
    \  put Bank Rate;\n\n/* Section 3 */\nif last then\ndo\n    put '*********';\n\
    \    put 'Ending';\nend;\nend;\nrun;\n```\n\n### 2.3.2 Considerations\n\n1. Section\
    \ 1 consists of a DO group of statements that will be executed only when N=1.\
    \ The automatic variable N counts the number of times the DATA step has iterated,\
    \ so this block will execute only one time when the DATA step starts.\n2. Section\
    \ 2 consists of unconditionally executed statements. These statements should execute\
    \ for every observation in the input data set. In this section, the SET statement\
    \ uses END= to create last, a temporary variable containing an end-of-file indicator.\
    \ The variable last is initialized to zero and remains 0 until the SET statement\
    \ reads the last observation of the set, when it is set to 1. As an automatic\
    \ variable, last is automatically flagged for DROP, and will not appear in the\
    \ output data set.\n3. Section 3 consists of a DO group of statements that will\
    \ execute only if the variable last contains a value other than 0 or missing.\n\
    \nIf we think about this, Section 1 code sounds like a great candidate for the\
    \ INIT system method, Section 2 for the RUN method, and Section 3 for the TERM\
    \ method.\n\n### 2.3.3 The Equivalent DS2 Data Program\n\nHere is a DS2 data program\
    \ equivalent to the original SAS DATA step:\n\n```\nproc ds2;\ndata null_;\n\n\
    /* Section 1 */\nmethod init();\n    put '*********';\n    put 'Starting';\n \
    \   put '*********';\nend;\n\n/* Section 2 */\nmethod run();\n    set crs.banks;\n\
    \    put Bank Rate;\nend;\n\n/* Section 3 */\nmethod term();\n    put '*********';\n\
    \    put 'Ending';\n    put '*********';\nend;\nenddata;\nrun;\nquit;\n```\n\n\
    ## 2.4 Review of Key Concepts\n\n- All DS2 programs are structured in blocks:\
    \ data, package, and thread.\n- There are three types of DS2 program blocks: A\
    \ program block begins with the appropriate DATA, PACKAGE, or THREAD statement,\
    \ and with the corresponding ENDDATA, ENDPACKAGE, or ENDTHREAD statement. The\
    \ remainder of the program consists of a combination of global declarative statements\
    \ and method definitions. All executable statements must be part of a method block\
    \ definition.\n- There are three system methods: INIT, RUN, and TERM. Every data\
    \ and thread program must contain explicit coding for one of these methods. System\
    \ methods execute automatically and do not accept parameters.\n- You can write\
    \ user-defined methods, keeping the following in mind:\n  - User-defined methods\
    \ do not execute automatically; they only when called.\n  - User-defined methods\
    \ can accept parameters with values passed either by value or by reference (IN_OUT\
    \ parameters).\n  - A method that has no IN_OUT parameters can return a value,\
    \ like a SAS function.\n  - Method IN_OUT parameter values can be modified at\
    \ the local site, like a SAS CALL routine.\n  - User-defined methods can be stored\
    \ for reuse in a DS2 package.\n- Variables created in a DS2 program should be\
    \ declared using a DECLARE (DCL) statement. Where the variable is declared determines\
    \ the variable's scope.\n- Variables introduced to a DS2 program via a SET statement,\
    \ declared in the global program space (before method definitions begin), or which\
    \ appear undeclared in the program code have global scope.\n"
  mdcn: "\n\n## 第 2 章：DS2 语言简介\n\n这些被包含在 PDV 和程序结果集中。然而，由于这些变量的全局变量从未被赋过值，因此 Total\
    \ 和 Count 在输出中包含缺失值：\n\n```\nproc ds2;\ndata;\n  method run();\n    declare double\
    \ Total Count;\n    set crs.one_day (keep=(Payee Amount));\n    Total+Amount;\n\
    \    Count+1;\n  end;\n  method term();\n    put Total= Count=;\n  end;\nendata;\n\
    run;\nquit;\n```\n\nSAS Log:\nTotal=. Count=.\nWARNING: Line nn: No DECLARE for\
    \ referenced variable total; creating it as a global variable of type double.\n\
    WARNING: Line nn: No DECLARE for referenced variable count; creating it as a global\
    \ variable of type double.\n\n图 2.6：数据程序生成的显示缺失值的报告\n\n| Obs | Payee | Amount\
    \ | Total | Count |\n|---|---|---|---|---|\n| 1 | Misc | $9.60 | . | . |\n| 2\
    \ | Ice Cream | $10.31 | . | . |\n| 3 | Services | $18.00 | . | . |\n| 4 | Big\
    \ Retailer | $192.59 | . | . |\n| 5 | Misc | $3,000.00 | . | . |\n| 6 | Misc |\
    \ $4,000.00 | . | . |\n\n如果我们从程序中删除 TERM 方法，Total 和 Count 变量的唯一引用就是 RUN 方法中的局部变量，它们将完全不会包含在\
    \ PDV 中。SAS Log 中不会发出关于未声明变量的警告，结果集仅包含全局变量 Payee 和 Amount：\n\n```\nproc ds2;\n\
    data;\n  method run();\n    declare double Total Count;\n    set crs.one_day (keep=(Payee\
    \ Amount));\n    Total+Amount;\n    Count+1;\n  end;\n```\n\n## 精通 SAS DS2 过程：高级数据处理技术\n\
    \n```\nenddata;\nrun;\nquit;\n```\n\n图 2.7：排除局部变量后数据程序生成的报告\n\n| Obs | Payee |\
    \ Amount |\n|---|---|---||\n| 1 | Misc | $9.60 |\n| 2 | Ice Cream | $10.31 |\n\
    | 3 | Services | $18.00 |\n| 4 | Big Retailer | $192.59 |\n| 5 | Misc | $3,000.00\
    \ |\n| 6 | Misc | $4,000.00 |\n\n用户定义方法可以接受参数。按值传递的参数被视为方法内部局部作用域的变量。例如，在以下程序中，用户定义的\
    \ fullname 有两个参数 first 和 last，它们作为局部变量运行。还有一个局部声明的变量 FinalText。主数据程序有三个全局声明的变量\
    \ WholeName、GivenName 和 Surname，它们将会被包含在 PDV 中。结果集仅包含全局变量 WholeName、GivenName\
    \ 和 Surname。\n\n```\nproc ds2;\ndata;\n  declare varchar(100) WholeName;\n  method\
    \ fullname(varchar(50) first, varchar(50) last)\n    returns varchar(100);\n \
    \   dcl varchar(100) FinalText;\n    FinalText=catx(', ',last,first);\n    Return\
    \ FinalText;\n  end;\n  method run();\n    set crs.customer_sample (keep=(GivenName\
    \ Surname));\n    FullName=fullname(GivenName, Surname);\n  end;\nenddata;\nrun;\n\
    quit;\n```\n\n## 第 2 章：DS2 语言简介\n\n图 2.8：数据程序生成的报告\n收入水平\n\n| WholeName | GivenName\
    \ | Surname |\n|---|---|---|\n| Schmidt, William | | Schmidt |\n| Laverty, Daniel\
    \ | | Laverty |\n| Grayson, Sarah | | Grayson |\n| Hastings, Eldon | | Hastings\
    \ |\n\n如果你在 SAS 程序中存储了代码段以包含在传统的 DATA step 中，你可能经历过我所说的 PDV 污染。当包含的代码引用了主程序中已存在的变量，或者当它包含了新变量时，现有变量的\
    \ PDV 值可能会被包含的代码无意修改。此外，不必要的变量可能会被添加到 PDV 并出现在输出数据集中。当使用 DS2 方法时，方法的局部变量永远不会影响\
    \ PDV，这个概念通常被称为变量封装。因为方法参数和局部声明变量是局部作用域，它们被封装在你的方法中，不会污染 PDV。在随后的章节中，我们将用户定义方法存储在\
    \ DS2 数据包中，以便在未来的程序中简单复用。由于变量封装，只要编写得当 DS2 方法，你就永远不需要担心 PDV 污染。\n\n## 2.2 数据执行\n\
    \nDS2 数据程序由编译器交付用于语法检查、编译和执行。在编译时，为 PDV 预留资源，代码被编译以执行，并生成输出数据集，写入描述符。编译完成后，执行从\
    \ INIT 方法开始，随后自动执行 RUN 和 TERM 方法。只有系统方法会自动执行；任何用户定义方法必须从 INIT、RUN 或 TERM 方法调用才能执行。\n\
    \n## 2.3 将 SAS DATA Step 转换为 DS2 程序\n\n### 2.3.1 传统的 DATA Step\n\n这是一个带有三个部分的传统的\
    \ DATA step，我们将将其转换为 DS2 数据程序：\n\n```\ndata null;\n/* Section 1 */\nif n_=1 then\n\
    do\n  put '*********';\n  put 'Starting';\n\n/* Section 2 */\nset crs.banks=last;\n\
    \  put Bank Rate;\n\n/* Section 3 */\nif last then\ndo\n    put '*********';\n\
    \    put 'Ending';\nend;\nend;\nrun;\n```\n\n### 2.3.2 考虑因素\n\n1. 第 1 部分包含一个 DO\
    \ 组语句，这些语句仅在 N=1 时执行。自动变量 N 统计 DATA step 迭代的次数，因此该块在 DATA step 开始时仅执行一次。\n2. 第\
    \ 2 部分包含无条件执行的语句。这些语句应该对输入数据集中的每个观测值执行一次。在此部分中，SET 语句使用 END= 创建了 last，这是一个包含文件结束指示的临时变量。变量\
    \ last 初始化为 0，直到 SET 语句读取集合的最后一个观测值，此时它被设置为 1。自动变量 last 被标记为 DROP，不会出现在输出数据集中。\n\
    3. 第 3 部分包含一个 DO 组语句，仅当 last 包含非 0 或缺失值时执行。\n\n如果我们考虑这一点，第 1 部分代码看起来是 INIT 方法的理想人选，第\
    \ 2 部分是 RUN 方法，第 3 部分是 TERM 方法。\n\n### 2.3.3 等效的 DS2 程序\n\n下面是与原始 DATA step 等效的\
    \ DS2 程序：\n\n```\nproc ds2;\ndata null_;\n\n/* Section 1 */\nmethod init();\n\
    \    put '*********';\n    put 'Starting';\n    put '*********';\nend;\n\n/* Section\
    \ 2 */\nmethod run();\n    set crs.banks;\n    put Bank Rate;\nend;\n\n/* Section\
    \ 3 */\nmethod term();\n    put '*********';\n    put 'Ending';\n    put '*********';\n\
    end;\nenddata;\nrun;\nquit;\n```\n\n## 2.4 核心概念回顾\n\n- DS2 程序通过块来交付：data、package\
    \ 和 thread。\n- 有三种类型的 DS2 程序块：程序块以相应的 DATA、PACKAGE 或 THREAD 语句开始，以 ENDDATA、ENDPACKAGE\
    \ 或 ENDTHREAD 结束。程序的剩余部分由全局声明语句和方法定义组成。\n- 有三种系统方法：INIT、RUN 和 TERM。每个数据和线程程序必须包含这些方法之一的显式代码。系统方法自动执行且不接受参数。\n\
    - 可以编写用户定义方法，需注意以下几点：\n  - 用户定义方法不会自动执行；只有在调用时才执行。\n  - 用户定义方法可以接受按值或按引用（IN_OUT\
    \ 参数）传递的参数。\n  - 没有 IN_OUT 参数的方法可以返回值，类似于 SAS 函数。\n  - 方法 IN_OUT 参数可以在本地修改，类似于\
    \ SAS CALL 程序。\n  - 用户定义方法可以存储在 DS2 数据包中以便复用。\n- DS2 程序中创建变量应使用 DECLARE (DCL)\
    \ 语句进行声明。声明的位置决定了变量的作用域。\n- 通过 SET 语句引入 DS2 程序的变量、在方法定义开始之前的全局程序空间声明的变量，以及在程序代码中未声明的变量具有全局作用域。\n\
    \n"
