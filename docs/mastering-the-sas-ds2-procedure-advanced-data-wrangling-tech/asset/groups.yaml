    community online as SAS Analytics U. From the SAS Analytics U website, you can
    download a free, up-to-date, and fully functional copy of SAS University Edition,
    which is provided as a virtual machine (VM). The SAS University Edition includes
    a completely installed, configured, well-proven SAS server. The examples in this
    book were all created and executed using SAS University Edition, with the exceptions
    of the sections requiring DBMS access. You can get your own free copy of SAS University
