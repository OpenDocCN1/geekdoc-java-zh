    \ entity or you can stream the response. With the HTTP package you can also retrieve\
    \ status codes from HTTP responses, socket timeout-values, and log the HTTP traffic\
    \ between the HTTP client and server using the SAS logging facility.\n\n#### 5.4.2.1\
    \ Understanding the GET, HEAD, and POST Methods\n\nMost APIs on the Internet consist\
    \ of a collection of methods properly formed Uniform Resource Identifiers (URIs).\
    \ The API will have a base URL to which additional information is appended. To\
    \ access the desired API method, specify the desired response format and pass\
    \ in the parameters required by the method.\n\nThe API calls can be for GET, HEAD,\
    \ or POST methods.\n\n- The GET method is used to retrieve information from the\
    \ server. GET requests are used to only retrieve data, and have no effect on the\
    \ server's data.\n- The HEAD method works just like GET, but a HEAD request will\
    \ return only the status and header information from the request without returning\
