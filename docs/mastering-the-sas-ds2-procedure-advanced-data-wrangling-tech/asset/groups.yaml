    \ Bank and Trust | 0.0318 |\n| $5,160.50 | 1 | Big Federal Credit Union | 0.0321\
    \ |\n| $5,855.70 | 5 | Big Federal Credit Union | 0.0321 |\n| $5,164.00 | 1 |\
    \ National Savings and Trust | 0.0328 |\n| $5,875.59 | 5 | National Savings and\
    \ Trust | 0.0328 |\n\n## 4.2.2.3 The Interest Method – V1.1\n\nNow that everyone\
    \ in the company is using our new method to do their interest calculations, we\
    \ detect a flaw: interest can be compounded annually. What if we need to compound\
