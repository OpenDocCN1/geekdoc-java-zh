    and test to see whether the lamp is on or off. Consider our QA testing a session.


    The beauty of objects in programming is that, once defined, we can reuse them
    over and over as building blocks for new objects or new applications without having
    to repeat QA testing on the established objects. We can now use the lamp package
    as an object for building a more complex house package. Let''s build a house object
    that contains four lamps and control the house from another DATA program:


    ```

    proc ds2;

    package work.house /homewrite=yes;

    cl varchar(15) houseName;

    cl package work.lamp desk(''Desk'',''On'');

    cl package work.lamp floor(''Floor'',''Off'');

    cl package work.lamp oven(''Oven'',''Off'');

    cl package work.lamp task(''Task'',''On'');

    method house();

    houseName=''****Unnamed'';

    put ''**** Instantiating house '' houseName$quote. ''****'';

    end;

    method house(varchar(15) name);

    houseName=name;

    put ''**** Instantiating house '' houseName$quote. ''****'';

    end;

    method statusCheck();

    cl varchar(33) Status;

    put;

    put ''The status of the lamps in '' houseName ''house:'';

    status=desk.lampgetStatus();

    put ''Desk lamp is ''; status;

    status=floor.lampgetStatus();

    put ''Floor lamp is ''; status;\nstatus=oven.lampgetStatus();

