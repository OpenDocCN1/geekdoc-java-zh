    ## 3.2.3.5 COMMENT, LINK, and DELETE Statements


    There are many documented ways of writing comments in traditional base languages,
    but the DS2 documentation lists only /* * style comments. Therefore, if you find
    you can “get away” with other styles, I''d recommend sticking with the documented
    style. LINK statements were used to process subroutine blocks of code and are
    not necessary in DS2; we have the more flexible and user-defined method. And if
    you are using the DELETE statement instead of the subsetting IF, you''ll be disappointed—only
    the subsetting IF works in DS2. All of this is in keeping with a design philosophy
    I admire: if you already have a good way of doing something in a language, you
    shouldn''t spend a lot of resources creating other, similar processes. Use those
    resources to add new features!


    ## 3.2.3.6 Traditional DATA Features Missing from DS2


    Some traditional SAS DATA functionality is actually missing from DS2, but usually
    for very reasons that we could anticipate. For example, DS2 does not include any
    of these statements: FILE, INFILE, INPUT, LIST, LISTCARD, DS, and DATALINES. Because
    DS2 is built to manage structured data, it''s not surprising that these statements
    were designed for processing raw data are not included. And because DS2 executes
    in a process separate from the SAS process, statements that were designed to control
    the SAS session, including DISPLAY, ABORT, ENDSAS, ERROR, DESCRIBE, and MISSING
    are also not found in the DS2 lexicon. Finally, that execution of arbitrary operating
    system commands, such as EXECUTE and X, will probably not become part of DS2.
    As DS2 is capable of executing in-database, the ability to execute arbitrary operating
    system commands represents an unacceptable stability risk to the host platform.


    And this concludes our comparison between the traditional DATA step language and
    DS2.

    Looking back. Now let''s dive into the new and exciting features and capabilities
    of the DS2 language!


    ## 3.3 Data Types in DS2


    ### 3.3.1 DS2 and ANSI Data Types


    Most SAS processes access database data via the SAS LIBNAME engine. When you are
    using a SAS/ACCESS interface engine to retrieve data from a database, all database
    data types are


    Chapter 3: DS2 Data Program Details 39


    converted to either fixed-width character or 8-byte floating-point numeric values
    before the data is presented to SAS for processing. This is necessary because
    Base SAS DATA steps and PROCs are designed to process SAS data, and SAS data can
    contain only those two data types.


    However, databases can contain a rich palette of ANSI data types, some of which
    have much greater precision than that achievable with an 8-byte, floating-point
    numeric. Because of the limitations of the 8-byte, floating point numeric, we
    have never been able to process these values at full precision in Base SAS. However,
    because DS2 uses its own driver to access data and does not rely on the LIBNAME
    engine engine mechanism, for the first time we can retrieve and process a wide
    variety of ANSI data types at full precision in Base SAS. The following table
    lists the ANSI data that DS2 can process:


    Table 3.2: ANSI Data Types


    | Data Type | Class | Description |

    |---|---|---|

    | CHAR(n) | Character | Fixed width, one byte per character, same number of bytes
    in every row. |

    | NCHAR(n) | Character | Fixed width, Unicode data, two to four bytes, same number
    of bytes in every row. |

    | VARCHAR(n) | Character | Variable width, one byte per character, uses enough
    bytes to store the actual value in each row up to a maximum of $n$. |

    | NVARCHAR(n) | Character | Variable width, Unicode data, uses enough bytes to
    store the actual value in each row up to a maximum of $n$. |

    | DOUBLE | Approximate numeric | 8-byte (64-bit) signed, approximate floating-point,
    maximum of 16 significant digits. |

    | REAL | Approximate numeric | 4-byte (32-bit) signed, approximate floating-point,
    maximum of 9 significant digits. |

    | FLOAT(p) | Approximate numeric | Signed, approximate user-defined precision.
    |


    40 Mastering the SAS DS2: Advanced Data Wrangling Techniques


    | Data Type | Class | Description |

    |---|---|---|

    | DECIMAL(p,s) | Exact numeric | Signed, exact decimal point user-defined precision.
    (p) determines the maximum number of significant digits, (s) determines how many
    of the significant digits are reserved for the fractional portion. NUMERIC(p,s)
    is an alias for DECIMAL. |

    | BIGINT | Integer | Signed, exact whole numbers up to 19 significant digits.
    |

    | INTEGER | Integer | Signed, exact whole numbers up to 10 significant digits.
    |

    | SMALLINT | Integer | Signed, exact whole numbers up to 5 significant digits.
    |

    | TINYINT | Integer | Single-byte signed, exact whole numbers between -128 and
    127. |

    | BINARY(n) | Binary | Fixed-length binary data, $n$ = number of bytes allocated
    to store data in every row. |

    | VARBINARY(n) | Binary | Variable-length binary data, uses just enough bytes
    to store data in each row up to a maximum of $n$. |

    | TIME | Time | Stores ANSI time values. |

    | DATE | Date | Stores ANSI date values. |

    | TIMESTAMP | Datetime | Stores ANSI timestamp (datetime) values. |


    ANSI TIME, DATE, and TIMESTAMP values should not be confused with SAS TIME, DATE,
    and DATETIME values are all stored as double-precision, floating-point numbers
    and adherence to external rules to be properly interpreted. SAS TIME values are
    actually SAS numeric values indicating the number of seconds between midnight
    and the time being expressed. SAS DATE values indicating the number of days between
    January 1, 1960, and the date being expressed. SAS DATETIME values are SAS numeric
    values indicating the number of seconds since midnight, January 1, 1960, and the
    date and time being expressed.


