    ## 3.2.3.5 COMMENT、LINK 和 DELETE 语句


    在传统的底层语言中，有很多记录在案注释方法，但 DS2 文档仅列出了 /* * 样式的注释。因此，如果你发现其他样式也能“行得通”，我建议坚持使用文档记录的样式。LINK
    语句用于处理子程序代码块，在 DS2 中并不是必须的；我们有更灵活且由用户定义的方法。而且如果你使用 DELETE 语句代替子集 IF 语句，你将会很失望——在
    DS2 中，只有子集 IF 是起作用的。所有这些都符合我所推崇的设计哲学：如果你在某种语言中已经有了实现某项功能的好方法，就不应该花费大量资源去创建其他相似的进程。利用这些资源来添加新功能吧！


    ## 3.2.3.6 DS2 中缺失的传统 DATA 功能


    某些传统的 SAS DATA 功能实际上在 DS2 中是缺失的，但通常是因为我们可以预料到的原因。例如，DS2 不包含以下任何语句：FILE、INFILE、INPUT、LIST、LISTCARD、DS
    和 DATALINES。因为 DS2 是为了管理结构化数据而构建的，这些为处理原始数据设计的语句未包含在内并不意外。而且由于 DS2 在与 SAS 进程独立的进程中执行，设计用于控制
    SAS 会话的语句（包括 DISPLAY、ABORT、ENDSAS、ERROR、DESCRIBE 和 MISSING）在 DS2 词表中也找不到。最后，执行任意操作系统的命令（如
    EXECUTE 和 X）可能不会成为 DS2 的一部分。由于 DS2 能够在数据库内部执行，执行任意操作系统命令的能力对于宿主平台来说是一个不可接受的稳定性风险。


    到此，我们对传统 DATA 步语言与 DS2 的对比就结束。

