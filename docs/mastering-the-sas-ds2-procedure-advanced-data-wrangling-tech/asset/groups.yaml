    \ 68\n\n## 4.1 引言\n\n在本章中，我们将编写用户定义方法来创建自定义的、可重用的 DS2 代码块。首先，我们将探索在 DS2 DATA 程序中内联编写的用户定义方法，然后学习学习如何在\
    \ DS2 包中存储、共享和重用这些用户定义方法。具体而言，我们将涵盖以下几点：\n\n- 定义用户定义方法\n  - 定义内联方法\n  - 设置参数\n\
    \  - 返回值与在处修改参数值的区别\n  - 方法重载\n- 对用户定义方法进行封装以供重用\n  - 在包中存储用户定义方法\n  - 定义构造器方法\n\
    \  - 定义全局和局部包变量\n  - 在后续的 DS2 程序中使用包\n  - 在 DS2 程序中声明并实例化包\n  - 编译时实例化与执行时实例化\n\
    \  - 使用包构造器参数设置状态\n  - 使用私有包全局变量跟踪状态\n  - 使用点符号表示执行包方法\n\n- 包的文档化记录与维护\n- 使用 DS2\
    \ 包进行面向对象编程\n\n## 4.2 深入学习用户定义方法\n\n### 4.2.1 概述\n\n用户定义方法是 DS2 程序中的命名值，只有在被调用时才会执行。产生值的方法可以设计为以两种方式之一交付这些值：方法可以像\
    \ Base SAS 函数一样工作，向调用进程返回单个值；也可以可以像 Base SAS 过程一样工作，在调用处修改一个或多个值。一次性使用的用户定义方法可以很容易地内联编写在\
    \ DS2 数据或线程程序中，并从程序的某个系统块中调用。\n\n### 4.2.2 设计用户定义方法\n\n方法是标准化代码流程的极佳工具。让我们以简单的利息计算为例。以下是银行如何计算我的账户一年后累积利息的：\n\
    \n```\nAmount=SUM(Amount, Amount*Rate);\n```\n\n要计算几年的金额，可以在 DO 循环中执行该公式：\n\n\
    ```\ni=1 to Years:\n  Amount=SUM(Amount, Amount*Rate);\n```\n\n### 4.2.2.1 设计考量\n\
    \n要创建一个方法，我们必须首先决定如何将结果返回给调用进程。由于存在 IN_OUT 参数，每个参数都可以在执行时返回。使用变量名返回值的方法是最灵活的。在调用处修改值的方法必须具有\
    \ IN_OUT 参数。调用时，所有结果必须直接通过 IN_OUT 参数返回。使用常量或复杂表达式将产生语法错误。\n\n### 4.2.2.2 利息方法\
    \ - V1.0\n\n让我们使用 IN_OUT 参数创建我们方法的 1.0 版本，用于提供初始金额并持有利息复利后的总额。\n\n```\nproc ds;\n\
    title 'Results for each bank - initial $5,00, deposit';\ndata;\ndcl double Total\
    \ having format10.2;\ndcl int Duration;\nkeep total duration bank rate;\n```\n\
    \n```prods2\nmethod interest(IN_OUT double Amount, double Rate, int Years);\n\
    dcl int i;\ndo i=1 to Years;\n  Amount=SUM(Amount,Amount*Rate);\nend;\nmethod\
