    \ packages, the Internet becomes just another enormous data source that can inform\
    \ and enrich our processing!\n\n# Mastering the SAS DS2 Procedure: Advanced Data\
    \ Wrangling Techniques\n\n## 5.5 The Matrix Package\n\n### 5.5.1 General\n\nMatrices\
    \ are two-dimensional arrays of numeric or character values, arranged in rows\
    \ and columns. The matrix package provides a lot of SAS/IML functionality within\
    \ DS2 without requiring the purchase of product licenses methods to perform inversion,\
    \ arithmetic, and logical operations on your matrix. Data is loaded into a matrix\
    \ package from array or from external data. To produce an output, the matrix must\
    \ first be output to an array, either by writing the entire matrix to the array\
    \ bloc or by updating the matrix iteratively, one row at a time. The array data\
    \ can then be written out as a DS2 result set.\n\n### 5.5.1.1 Declaring, Instantiating,\
    \ and Loading a Matrix\n\nA matrix can have values loaded from an array at instantiation,\
    \ but at compile time the array will not have values. Because of this, it is common\
    \ to declare the matrix delay until runtime using the `NEW` operator. The code\
    \ would look like this:\n\n```sas\ndcl double a[2, 2];\ndcl package m;\nmethod\
    \ init();\n/* Load array values */\na=(1, 9, 4, 16);\n/* Instantiate matrix and\
    \ load from array */\nm=new matrix(a, 2);\nend;\n```\n\nAlternatively, the package\
    \ could be instantiated at compile time and the array loaded later in the program\
    \ using the matrix's `IN` method:\n\n```sas\ndcl double a[2, 2];\ndcl package\
    \ m(2, 2);\nmethod init();\n/* Load array values */\na=(1, 9, 4, 16);\n/* Load\
    \ matrix from array */\nm.in(a);\nend;\n```\n\nTo load data from a table, load\
    \ `VARARRAY` values using the matrix's `IN` method:\n\n```sas\ndata x;\nv1=1;v2=9;output;\n\
    v1=4;v2=16;output;\nrun;\n/* Get rows and columns into matrix */\nproc sql noprint;\n\
    select nobs\ninto :rows,:columns\nfrom dictionary.tables\nwhere libname='WORK'\n\
    and name='X'\nquit;\n\nproc ds2;\ndata _null;\ndcl double a[2];\ndcl package m(rows,columns)\n\
    method run();\n/* Read data, load each row of matrix from vararray*/\nset x;\n\
    m.in(a, _n);\nend;\n```\n\n### 5.5.2 Manipulating and Retrieving Values from a\
    \ Matrix\n\nA matrix is manipulated using one of the many methods available in\
    \ the matrix package. Data can be loaded from a matrix to a declared array or\
    \ variable created with `VARARRAY`. If a variable array is used, the data is loaded\
    \ into variables and becomes part of the data result set. In the following example,\
    \ values are loaded into array `a`, and the `IN` method is used to populate the\
    \ matrix from the values in `a`. `m` is then transposed using the `TRANS` method,\
    \ and its elements passed back to array using the `TOARRAY` method. The elements\
    \ of array `a` are again written to the SAS log. Finally, a square root transformation\
    \ is performed on all the elements of the matrix `m`, and the values are again\
    \ passed to array `a`. The elements of array `a` in the SAS log show the results.\n\
    \n```sas\nproc ds2;\ndata _null;\ndcl double a[2,2];\ndcl package m(2,2);\nmethod\
    \ init();\n  a:=1,9,4,16);\n  put 'before: ' a]=;\n  m.in(a);\n  m=m.trans(a);\n\
    \  m.toarray(a);\n  put 'Trans: ' a]=;\n  m=m.sqrt(a);\n  m.toarray(a);\n  put\
    \ 'SQRT: ' a]=;\nend;\nenddata;\nrun;\nquit;\n```\n\n**SAS Log:**\n\n| Timing\
    \ | w x y z |\n|---|---|---|\n| Before | 1 9 4 16 |\n| Trans | 1 4 9 16 |\n| SQRT\
    \ | 1 2 3 4 |\n\n**Figure 5.13:** Data After Processing with the Matrix Package\n\
    \n| Timing | w x y z |\n|---|---|---|\n| Before | 1 9 4 16 |\n| Trans | 1 4 9\
    \ 16 |\n| SQRT | 1 2 3 4 |\n\n## 5.5.2 Matrix Package Example\n\nOur motor pool\
    \ is getting ready to place the order for the fluids required for this year's\
    \ maintenance on our vehicle fleet. The data set `crs_our_fleet` contains information\
    \ about the vehicles in the fleet:\n\n**Figure 5.14:** Data Contained in `crs_our_fleet`\
    \ Data Set\n\n| Obs | Make | Model | BodyType | Year | Inventory | Oil | Cooling\
    \ | Transmission | Differential |\n|---|---|---|---|---|---|---|---|---|---|\n\
    | 1 | Ford | F550 | Pickup Truck | 2015 | 24 | 7.0 | 26.7 | 17.5 | 5.9 |\n| 2\
    \ | Ford | Expedition | Full size SUV | 2015 | 12 | 6.0 | 18.5 | 13.1 | 3.6 |\n\
    | 3 | Dodge | Ram 3500 | Cargo Van | 2015 | 20 | 6.0 | 10.6 | | 4.8 |\n| 4 | GMC\
    \ | Yukon XL | Full size SUV | 2015 | 12 | 8.0 | 17.4 | 11.4 | 5.5 |\n| 5 | Smart\
    \ | Two | Mini | 2015 | 144 | 3.6 | 4.5 | | 0.0 |\n| 6 | Land Rover | Range Rover\
    \ | Full size SUV | 2010 | 48 | 6.5 | 16.0 | 10.5 | 1.5 |\n\nTo start, we create\
    \ a matrix with rows and columns that represents the fluid capacities of all vehicles\
    \ and a second matrix with one row and six columns that represents the inventory\
    \ of each vehicle. The next step is to multiply these two matrices.\n\n### 5.5.2.1\
    \ Getting data into out of Matrices\n\nBecause it is easier to transfer data into\
    \ and out of a package using arrays, for each matrix we create, we will create\
    \ a corresponding array or variable. We'll use the `RUN` method to load the capacity\
    \ matrix and the vehicle inventory. Then, in the `TERM` method, we'll load the\
    \ vehicle inventory into the unit's matrix, do the multiplication, and transfer\
    \ the results out to the PDV. We'll convert all values to gallons, round to the\
    \ nearest whole unit, and output the result set.\n\n```sas\nproc ds2;\ndata;\n\
    \  dcl varchar(7) Timing;\n  dcl package m(2,2);\n  vararray double a[2] v2;\n\
    \  vararray double v[2, 2] w x y z;\n  dcl double b[2,2];\n  drop v2;\n  method\
    \ run();\n  /* Read data, load each row of matrix from vararray*/\n  set x;\n\
    \  m.in(a, _n);\n  m.tovarray(b);\n  end;\n  method term();\n  Timing='Before:';\n\
    \  m.tovarray(v);\n  output;\n  Timing='Trans:';\n  m=m.trans();\n  m.tovarray(v);\n\
    \  output;\n  Timing='SQRT:';\n  m=m.sqrt();\n  m.tovarray(v);\n  output;\n  end;\n\
    endata;\nrun;\nquit;\n```\n"
