    # Chapter 3: DS2 Data Program Details 49


    The CHAR value read in from the SAS set evaluates as ''='', but now for a different
    reason: in ANSI mode '' indicates an ANSI space character, and the CHAR value
    is filled of spaces. Note that both the MISSING and NULL functions return FALSE
    for the CHAR value, which is interpreted as ANSI space filled of indent.


    In ANSI mode, DOUBLE functions work the same as any other ANSI numeric. It evaluates
    as ''='' because missing null values are immediately replaced with ANSI null values
    when read into the PDV. For the same, the NULL function returns TRUE when presented
    with the DOUBLE value. The SAS MISSING function also returns TRUE, but this is
    because the null value was automatically converted to missing when passed to the
    Base SAS function.


    # 3.4 Review of Key Concepts


    +   - "Six Subtle Dissimilarities"

    - All executable statements must be part of a method code block.

    - DS2 programs do not overwrite data by default.

    - All variables not introduced via the SET statement should be declared.

    - PUT statement and line pointers are not supported.

    - Keywords are reserved words.

    - DS2 uses ANSI SQL quoting standards:

    - Single quotation marks delimit text constants.

    - Double quotation marks delimit missing identifiers.

    - Use %TSLSIT to resolve macro variable literals in literal text.

    - DS2 "Missing" Features

    - Many "missing" features are not missing-they are just accomplished differently
    in DS2:

    - There is no WHERE statement, but the SET statement accepts SQL query result
    that might contain a WHERE clause.

    - There is no UPDATE or MODIFY statement, but this behavior can be emulated with
    SQL query in a SET statement.

    - Traditional SAS DATA steps read raw data, control the SAS environment, or execute
    arbitrary system commands are not supported in DS2.

    - DS2 processes a wide variety of ANSI data types. Because of this, automatic
    data type conversions happen frequently. Whenever a DOUBLE value is involved in
    a numeric expression, all other values will be converted to DOUBLE for processing,
    and some precision might be lost if BIGINT or DECIMAL values are involved.

    - DS2 provides functions for explicit conversion between ANSI TIMESTAMP, DATE,
    and TIME and SAS DATETIME, DATE, and TIME values.

    - SAS missing values and ANSI null values are fundamentally different ways of
    expressing unknown data. DS2 has two modes, SAS mode and ANSI mode, that allow
    you to select the default parsing. ANSI null and SAS missing values can be successfully
    processed together in the same program as long as the conversion behaviors are
    understood.'
