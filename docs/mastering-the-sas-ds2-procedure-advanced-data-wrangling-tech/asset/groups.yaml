    # Table 5.1: DS2 Predefined Packages by SAS Release


    | Package | SAS Release | Purpose |

    | --- | --- | --- |

    | FCMP | SAS 9.4 M0 | Allows calling FCMP functions and subroutines from a DS2
    program. |

    | Hash | SAS 9.4 M0 | Enables you to use hash objects in your DS2 programs. Hash
    enables you to quickly and efficiently store, search, and retrieve data based
    on lookup keys. Hash records can also be easily manipulated, sorted, and saved
    to a table within a DS2 program. |

    | Hiter | SAS 9.4 M0 | Enables you to conduct iterative processing of the associated
    hash object in your DS2 program. You must declare the hash before declaring the
    associated hiter. |

    | HTTP | SAS 9.4 M2 | Provides an HTTP client with methods that allow you to access
    HTTP web services and capture the returned results in a DS2 program. |

    | JSON | SAS 9.4 M3 | Provides the methods necessary to parse and write JSON text
    and is quite handy for decoding results returned by the HTTP package. |

    | Logger | SAS 9.4 M0 | Provides methods to detect which SAS logging facility
    message levels are active in the current SAS session and write messages at user-selected
    levels. This package is pretty simple to use but it does not currently produce
    output when operating in client/server mode. Therefore, it is not useful when
    programming in SAS Studio or SAS Enterprise Guide. For these reasons, there will
    not be a logger package section in this book, but it is mentioned here so that
    we don''t forget it exists. |

    | Matrix | SAS 9.4 M0 | Implements SAS/IML capabilities in DS2, providing powerful
    and flexible matrix programming tools. No licensing over Base SAS is required
    to use the matrix package. |

    | SQLSTMT | SAS 9.4 M0 | Provides methods for passing a dynamic FedSQL statement
    to a database for execution and for accessing any result rows produced without
    using a SET statement. |

    | TZ | SAS 9.4 M3 | Provides methods for facilitating the processing of local
    and international time and date values in a DS2 program.'
  - "[PAGE 87]\n\n# 5.2 Executing FCMP Functions in DS2\n\n# 5.2.1 The FCMP Package\n\
    \nThe SAS Compiler procedure (PROC FCMP) enables you to create SAS functions and\
    \ CALL routines that can subsequently be used in other SAS or DATA steps. PROC\
    \ FCMP builds custom functions using DATA step-like syntax and stores the results\
    \ in a SAS data set. Within the SAS data set, FCMP functions are grouped into\
    \ “packages” of related functions. These FCMP packages should not be confused\
    \ with DS2 packages. An FCMP package is a subset of the functions stored in a\
    \ single SAS data set containing FCMP functions. A DS2 package is the entire data\
    \ set used to collect custom methods and data types.\n\nWhen stored in a permanent\
    \ SAS library, FCMP functions are easily reusable in subsequent SAS programs as\
    \ if they were native SAS functions and CALL routines. After specifying the CMPLIB\
    \ system option to identify the FCMP data set for SAS, you can use FCMP functions\
    \ in your SAS code as if they were native SAS functions.\n\nFCMP functions are\
    \ an excellent means of standardizing and encapsulating programming methodologies\
    \ across an enterprise, and making SAS shops have invested significant time and\
    \ effort in building them. It would certainly be a shame if we were forced to\
    \ expend extra resources re-creating and maintaining those same functions as methods\
    \ in DS2 packages.\n\nThe DS2 package provides an easy, one-time means of creating\
    \ a wrapper package for any existing FCMP data set. The wrapper package can subsequently\
    \ be used to execute the FCMP functions transparently from a DS2 program, just\
    \ as the custom functions were actually DS2 methods. Modifications to the FCMP\
    \ functions are immediately reflected through the DS2 package without any additional\
    \ maintenance.\n\n# 5.2.2 FCMP Package Example\n\nLet's build a couple of custom\
    \ functions using PROC FCMP and use them in a DS2 program. We'll subsequently\
    \ modify one of the PROC FCMP functions, and then to check whether the modifications\
    \ are automatically reflected in our DS2 program without any further maintenance\
    \ required.\n\n# 5.2.2.1 Creating Custom Functions with PROC FCMP\n\nThe following\
    \ PROC FCMP step builds user-defined functions:\n\n```\n* Create the FCMP functions\
    \ */\nproc fcmp outlib = crs.fcmp_functions.ourFuncs;\nfunction ourGMP(GS, Cog);\n\
    \  /* Cross Margin % */\n  return ((GS-Cog)/GS);\nendsub;\nfunction forBE(GS,\
    \ Fix, Units);\n  /* Break Even (Units) */\n  return (ceil(Fix/(GS/Units)) - (Cog/Units)));\n\
    endsub;\nrun;\nquit;\n```\n\nA curious person (like me!) would be tempted to see\
    \ what is inside the SAS data set created by PROC FCMP. The data set contains\
    \ variables that indicate the names of the functions, statement"
- md: "\n## 5. Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\
    \nsequence, and so on, and a variable that contains the XML and source code required\
    \ for FCMP to execute your function. By default, none of this information is encrypted.\n\
    \nHaving peered inside the data set, our next task is to use new functions in\
    \ a traditional SAS DATA step. We will set the CMPLIB system option to point to\
    \ the SAS data set containing the FCMP functions, then we will use the functions\
    \ in our code as if they were native to SAS:\n\n```sas\noptions cmplib=crs.fcmp_functions;\n\
    data work.underperforming_base;\nset crs.Sales_2014;\n/*This code uses the custom\
    \ ourBE function */\nBreakEven=ourBE(GrossSales,CostOfGoods,Fixed,Units);\nif\
    \ breakeven > units;\n/*This code uses the custom GMP function */\nGrossMargin=ourGMP(GrossSales,CostOfGoods);\n\
    NetRevenue=GrossSales-CostOfGoods-Fixed;\nformat GrossMarginpercent.7.1 GrossSales\
    \ CostOfGoods\nNetRevenue=dollar12.2;\nlabel Units='Units Sold'\n      ProductID='Product\
    \ ID'\n      GrossMargin='Gross Margin %'\n      BreakEven='Break Even (Units)'\n\
    \      Fixed='Fixed Costs';\n\nrun;\n\ntitle \"Underperforming Sales Items - Base\
    \ SAS Data Step\";\nproc print data.underperforming_base noobs label;\nvar SupplierName\
    \ ProductName Product_ID UNITS;\nvar BreakEven;\nvar GrossSales CostOfGoods Fixed\
    \ GrossMargin NetRevenue;\nrun;\ntitle;\n```\n\nFigure 5.1: Report Produced Using\
    \ FCMP Functions in Traditional SAS Processing\n\n| SupplierName | ProductName\
