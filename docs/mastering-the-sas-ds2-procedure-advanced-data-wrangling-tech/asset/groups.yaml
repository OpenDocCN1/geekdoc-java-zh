    # 5.3 The Hash and Hiter (Hash Iterator) Packages


    # 5.3.1 General


    Hash and hash iterator objects are memory-resident objects that enable quick and
    efficient storage, searching, and retrieving data based on lookup keys. They are
    frequently used as lookup tables. Depending on the number of keys and the size
    of the data, a hash object can retrieve values significantly faster than a SAS
    format. Hash objects can be loaded from a SAS set, stored back to SAS data set
    using a traditional SAS DATA step or DS2 data program. Data is loaded in the order
    in which it occurs in the data set. This determines the order in which items are
    be retrieved from the hash. The DS2 hash and hiter packages provide hash and hash
    iterator functionality in DS2 programs.


    Think of a hash iterator object (hiter) as an ordered view of an existing hash
    object. It can retrieve data in whatever order, regardless of the hash object''s
    ORDERED argument. A hiter object must reference an existing hash object, the referenced
    hash object must be instantiated before you can instantiate a hiter object.


    # 5.3.2 Hash Package Example


    In this example, we will load a hash object to hold supplier information and use
    the hash object to look up supplier name, and country information based on supplier
    ID values contained in the csprodlist data set.


    To use a hash object in DS2, we must first set the hash object by declaring an
    instance of the hash package and providing the necessary constructor parameters.
    A hash object can be completely defined at instantiation, providing the data source,
    key, and values. We''ll work our way through a complete definition, discussing
    parameters along the way.'
- md: "\n# Chapter 5: Predefined Packages 77\n\nThis DCL PACKAGE statement instantiates\
    \ a hash object named h1 with the keys and data parameters defined.\n\n```\ndcl\
    \ package hash h1(\n[SupplierID],[SupplierName, SupplierAddress Country]);\n```\n\
    \n- 1. The keys parameter accepts a variable list and defines the variables that\
    \ are used as keys to look up data values.\n- 2. The data parameter accepts a\
    \ variable list that indicates the variable values are to be returned by a successful\
    \ lookup. In this example, SupplierID is the key and SupplierName, SupplierAddress,\
    \ and Country are the data.\n- 3. The third parameter, hashash, accepts an exponent\
    \ value (n), which defines the hash table size as 2n \"containers\". The hash\
    \ table size does not equate to the number of items that can be stored--each container\
    \ can actually hold an infinite number of items. Using a larger number of containers\
    \ for larger data improves the efficiency of the hash table's lookup routines.\
    \ You might have to experiment with different values to find the sweet spot for\
    \ your particular hash object's performance. The maximum value for n is 16, which\
    \ produces 64K containers. Our data in this example is small, so we'll use a hash\
    \ expression of 1:\n\n```\ndcl package hash h1(\n[SupplierID],[SupplierName, SupplierAddress\
    \ Country],1);\n```\n\n- 4. The fourth parameter, datasrc, provides the name of\
    \ the data set to load into the hash object. Instead of providing a data set name,\
    \ you can choose instead to provide a FedSQL query in braces. These hash declarations\
    \ are equivalent:\n\n```\ndcl package hash h1(\n[SupplierID],[SupplierName, SupplierAddress\
    \ Country],1\n,'crs.supplier');\n```\n\n```\ndcl package hash h2(\n[SupplierID],[SupplierName,\
    \ SupplierAddress Country],1\n,'select * from crs.supplier');\n```\n\n- 5. The\
    \ fifth parameter, ordered, describes the order in which the values will be returned\
    \ from the hash object. Acceptable values are 'ascending' ('a' or 'yes'), 'descending'\
    \ ('d' or 'no'), which leaves the order in which data is returned undefined. The\
    \ default is no.\n\n```\ndcl package hash h1(\n[SupplierID],[SupplierName, SupplierAddress\
    \ Country],1\n,'crs.supplier','a');\n```\n\n# Mastering the SAS DS2 Procedure:\
    \ Advanced Data Wrangling Techniques\n\n- 6. The sixth parameter, duplicate, determines\
    \ whether to ignore duplicate keys when loading a table into the hash package.\
    \ Valid values are 'add', 'replace' and 'error'. The default is 'add', which stores\
    \ the first key and ignores all subsequent duplicates. 'Replace' causes subsequent\
    \ duplicates to replace the original key values, which results in the last being\
    \ the only one retained. 'Error' reports an error in the SAS log if a duplicate\
    \ key is found.\n\n```\ndcl package hash h1 {\n  [SupplierID],[SupplierName, SupplierAddress\
    \ Country],1\n  'crs.supplier', 'a', 'error');\n}\n```\n\n- 7. The seventh parameter,\
    \ suminc, specifies a variable that maintains a summary count of hash package\
    \ keys. Because we won't be using this feature in our demo, we'll just provide\
    \ a null value\n\n```\ndcl package hash h1 {\n  [SupplierID],[SupplierName, SupplierAddress\
    \ Country],1\n  'crs.supplier', 'a', 'error');\n}\n```\n\n- 8. The last parameter,\
    \ multidata, specifies whether multiple data items are allowed for each key. Valid\
    \ values are 'multidata', 'yes' or 'y', which specify that multiple data items\
    \ are allowed for a key, or 'singled', 'no' or 'n', which specify that multiple\
    \ data items are not allowed for a key. The default is 'no'. Because duplicates\
    \ are expected, we would have skipped defining this parameter in our example but\
    \ to explicitly provide a 'no' value for clarity:\n\n```\ndcl package hash h1\
    \ {\n  [SupplierID],[SupplierName, SupplierAddress Country],1\n  'crs.supplier',\
    \ 'a', 'error', 'no');\n}\n```\n\nAlternatively, the hash package can be partially\
    \ constructed on instantiation, and hash package methods used to subsequently\
    \ load constant data and define the key and data values. Because these values\
    \ need to be set only once before we use the hash object, the INIT method would\
    \ be an excellent choice for making these assignments:\n\n```\ndcl package hash\
    \ h1 {\nmethod init();{\n/* The hash object definition is completed via method\
    \ calls*/\n  h1.keys([SupplierID]);\nh1.data(SupplierName SupplierAddress Country);\n\
    h_.hashexp(1);\nh1.datasetexp('crs.supplier');\nh1.ordered('a');\nh1.duplicate('error');\n\
    h1.multidata('no');\nh1.definedone();\n}\n}\n```\n\n## 5.3.2.2 Using a Hash Object\
    \ as a Lookup Table\n\nWe will use the code from the previous section to instantiate\
    \ a hash object and then use the hash object's FIND method to retrieve data. FIND\
    \ returns a zero if found, and nonzero if it was not. Here we use a FIND expression\
    \ to subset only those rows that have matching values:\n\n```\nproc ds2;\ntitle\
    \ \"Product Information\"\ndata;\n  dcl bigint SupplierID;\n  dcl varchar(55)\
    \ ProductName SupplierAddress Country;\n  dcl package hash h1[SupplierID],[SupplierName\
    \ Address Country],1\n  'crs.supplier','a', 'error');\n  if h1.find(SupplierID)=0\
    \ then\n    output;\nend;\nrun;\n```\n\nFigure 5.4: Report Produced Using Hash\
    \ Techniques\n\n| SupplierID | SupplierID | ProductName | SupplierAddress | Country\
    \ |\n|---|---|---|---|---|\n| 21020109 | 21020109 | Round Neck | A Team Sports\
    \ | US |\n| 21020117 | 21020117 | Sweatshirt's | A Team Sports | US |\n| 21020022\
    \ | 21020022 | Sunset Trunks | Nautilus Inc | US |\n| 21020023 | 21020023 | Sunset\
    \ Trunks Jr | Nautilus Inc | US |\n\n### 5.3.3 Hash Iterator Example\n\nA hash\
    \ iterator enables you to retrieve data from a hash object in forward or reverse\
    \ order. In this example, we will use two hash objects—one for price and the other\
    \ for information—and a hash iterator on the price hash. The hash iterator methods\
    \ that we will use are FIRST, NEXT, LAST, and PREV, allow us to retrieve the first,\
    \ next, last, and previous records from the hash object.\n\n#### 5.3.3.1 Using\
    \ Hash Objects and a Hash Iterator to Look Up Values in Data Sets\n\nThe crs.pricelist\
    \ set contains the product ID and pricing information for all products. The crs.productlist\
    \ set contains the product ID and descriptive information for all products. We\
    \ will declare one hash object for each of those sets:\n\n```\ndcl package hash\
    \ prod([SupplierID],[ProductName],1\n  ,'crs.supplier','a');\ndcl package hash\
    \ price([UnitSalesPrice],[SupplierID UnitSalesPrice],1\n  ,'crs.pricelist','a');\n\
    ```\n\nWe will also declare a hash iterator to access the price hash object in\
    \ forward and reverse order. Because all of our work with data sets will be done\
    \ with hash objects, we will have to explicitly control flow and row output. This\
    \ can be done from any system method in the data program, so I have chosen to\
    \ use the INIT method:\n\n```\nproc ds2;\ntitle \"Lowest and Highest Cost Products\"\
    \ndata;\ndcl bigint Supplier_ID;\ndcl varchar(55) ProductName Ranking;\ndcl decimal\
    \ (10,2) UnitSalesPrice;\ndcl package hash prod([SupplierID],[ProductName],1\n\
    \  ,'crs.productlist','a');\ndcl package hash price([UnitSalesPrice],[SupplierID\
    \ UnitSalesPrice],1\n  ,'crs.pricelist','a');\nmethod init();\ndcl int rc;\nRanking='Lowest\
    \ Cost';\nGetThe.first();\nrc=prod.find();\noutput;\nRanking='Second Lowest Cost';\n\
    GetThe.next();\nrc=prod.find();\noutput;\nRanking='Second Highest Cost';\nGetThe.last();\n\
    rc=prod.find();\noutput;\nRanking='Highest Cost';\nGetThe.last();\nrc=prod.find();\n\
    output;\nend;\nenddata;\nrun;\nquit;\n```\n"
  mdcn: "\n\n# 第 5 章：预定义包 77\n\n此 DCL PACKAGE 语句实例化了一个名为 h1 的哈希对象，并定义了相应的键和数据参数。\n\
    \n```\ndcl package hash h1(\n[SupplierID],[SupplierName, SupplierAddress Country]);\n\
    ```\n\n- 1. `keys` 参数接受一个变量列表，并定义用于查找数据值的键的变量。\n- 2. `data` 参数接受一个变量列表，指示成功查找后将返回的变量值。在示例中，`SupplierID`\
    \ 是键，而 `SupplierName`、`SupplierAddress` 和 `Country` 是数据。\n- 3. 第三个参数 `hashhash`\
    \ 接受一个指数值 (n)，它定义哈希表的大小为 2^n 个“容器”。哈希表的大小并不等同于可以存储的项目数量——每个容器实际上可以容无限数量的项目。对于较大的数据，使用更多的容器可以提高哈希表查找例的效率。你可能需要尝试不同的值，以找到适用于你特定哈希对象性能的平衡点。`n`\
    \ 的最大值为 16，可产生 64K 个容器。我们示例中的数据很小，因此我们将使用哈希表达式 1:\n\n```\ndcl package hash h1(\n\
    [SupplierID],[SupplierName, SupplierAddress Country],1);\n```\n\n- 4. 第四个参数 `datasrc`\
    \ 提供了了要加载到哈希对象的数据集名称。你可以不提供数据集名称，而是选择在括号中提供一个 FedSQL 查询。这些哈希声明是等价的：\n\n```\ndcl\
    \ package hash h1(\n[SupplierID],[SupplierName, SupplierAddress Country],1\n,'crs.supplier');\n\
    ```\n\n```\ndcl package hash h2(\n[SupplierID],[SupplierName, SupplierAddress\
    \ Country],1\n,'select * from crs.supplier');\n```\n\n- 5. 第五个参数 `ordered` 描述了从哈希对象中返回值的顺序。接受的值有\
    \ 'ascending'（升序，'a' 或 'yes'）、'descending'（降序，'d' 或 'no'），后者会导致数据返回顺序未定义。默认值为\
    \ 'no'。\n\n```\ndcl package hash h1(\n[SupplierID],[SupplierName, SupplierAddress\
    \ Country],1\n,'crs.supplier','a');\n```\n\n# 掌握 SAS DS2 过程：高级数据处理技术\n\n- 6. 第六个参数\
    \ `duplicate` 决定在将表加载到哈希包时忽略忽略重复键。有效有 'add'、'replace' 和 'error'。默认值为 'add'，它存储第一个键并忽略所有后续重复项。'Replace'\
    \ 会导致后续重复项替换原始键值，结果只保留最后一个。如果发现重复键，'Error' 会在 SAS 日志中报告错误。\n\n```\ndcl package\
    \ hash h1 {\n  [SupplierID],[SupplierName, SupplierAddress Country],1\n  'crs.supplier',\
    \ 'a', 'error');\n}\n```\n\n- 7. 第七个参数 `suminc` 指定一个维护哈希包键摘要计数的变量。由于我们将在演示不此此功能，我们将仅提供一个空值。\n\
    \n```\ndcl package hash h1 {\n  [SupplierID],[SupplierName, SupplierAddress Country],1\n\
    \  'crs.supplier', 'a', 'error');\n}\n```\n\n- 8. 最后一个参数 `multidata` 指定每个键是否允许允许多个数据项。有效有\
    \ 'multidata'、'yes' 或 'y'（允许一个键对应多个数据项），或 'singled'、'no' 或 'n'（不允许一个键对应多个数据项）。默认值为\
    \ 'no'。因为预期重复项，我们在示例中可能会跳过定义此参数，但为了清晰起见，我们显式提供 'no' 值：\n\n```\ndcl package hash\
    \ h1 {\n  [SupplierID],[SupplierName, SupplierAddress Country],1\n  'crs.supplier',\
    \ 'a', 'error', 'no');\n}\n```\n\n或者，哈希包可以在实例化时部分构建，并使用哈希包方法在随后加载常量数据以及定义键和数据值。由于这些值在我们在使用哈希对象之前只需要设置一次，因此\
    \ `INIT` 方法是进行这些赋值的极佳选择：\n\n```\ndcl package hash h1 {\nmethod init();{\n/* 哈希对象的定义通过方法调用完成*/\n\
    \  h1.keys([SupplierID]);\nh1.data(SupplierName SupplierAddress Country);\nh_.hashexp(1);\n\
    h1.datasetexp('crs.supplier');\nh1.ordered('a');\nh1.duplicate('error');\nh1.definedone();\n\
    }\n}\n```\n\n## 5.3.2.2 使用哈希对象作为查找表\n\n我们将使用上一节中的代码来实例化哈希对象，然后使用哈希对象的 `FIND` 方法来检索数据。`FIND`\
    \ 在找到时返回 0，未找到时返回非零。在这里我们使用 `FIND` 表达式来子集仅包含具有匹配值的行：\n\n```\nproc ds2;\ntitle\
    \ \"Product Information\"\ndata;\n  dcl bigint SupplierID;\n  dcl varchar(55)\
    \ ProductName SupplierAddress Country;\n  dcl package hash h1[SupplierID],[SupplierName\
    \ Address Country],1\n  'crs.supplier','a', 'error');\n  if h1.find(SupplierID)=0\
    \ then\n    output;\nend;\nrun;\n```\n\n图 5.4：使用哈希技术产生的报告\n\n| SupplierID | SupplierID\
    \ | SupplierAddress | Country |\n|---|---|---|---|\n| 2102109 | Round Neck | A\
    \ Team Sports | US |\n| 2102117 | Sweatshirt's | A Team Sports | US |\n| 2102022\
    \ | Sunset Trunks | Nautilus Inc | US |\n| 2102023 | Sunset Trunks Jr | Nautilus\
    \ Inc | US |\n\n### 5.3.3 哈希迭代器示例\n\n哈希迭代器允许按正向或反向顺序从哈希对象检索数据。在示例中，我们将使用两个哈希对象——一个用于价格，另一个用于信息——并在价格哈希上使用迭代器。我们将使用的哈希迭代器方法有\
    \ `FIRST`、`NEXT`、`LAST` 和 `PREV`，它们允许我们从哈希对象中检索第一条、下一个、最后和之前的记录。\n\n#### 使用哈希对象和哈希迭代器在数据查找值\n\
    \n`crs.pricelist` 数据集包含所有产品的 ID 和定价信息。`crs.productlist` 数据集包含所有产品的 ID 和描述性信息。我们将为每个数据集各声明一个哈希对象：\n\
    \n```\ndcl package hash prod([SupplierID],[ProductName],1\n  ,'crs.supplier','a');\n\
    dcl package hash price([UnitSalesPrice],[SupplierID UnitSalesPrice],1\n  ,'crs.pricelist','a');\n\
    ```\n\n我们还将声明一个哈希迭代器以按正向和反向顺序访问价格哈希对象。因为对数据集的所有工作将通过哈希对象完成，我们必须显式控制流和行输出。这可以在数据程序的任何系统方法中完成，因此我选择使用\
    \ `INIT` 方法：\n\n```\nproc ds2;\ntitle \"Lowest and Highest Cost Products\"\ndata;\n\
    dcl bigint Supplier_ID;\ndcl varchar(55) ProductName Ranking;\ndcl decimal (10,2)\
    \ UnitSalesPrice;\ndcl package hash prod([SupplierID],[ProductName],1\n  ,'crs.productlist','a');\n\
    dcl package hash price([UnitSalesPrice],[SupplierID UnitSalesPrice],1\n  ,'crs.pricelist','a');\n\
    method init();\ndcl int rc;\nRanking='Lowest Cost';\nGetThe.first();\nrc=prod.find();\n\
    output;\nRanking='Second Lowest Cost';\nGetThe.next();\nrc=prod.find();\noutput;\n\
    Ranking='Second Highest Cost';\nGetThe.last();\nrc=prod.find();\noutput;\nRanking='Highest\
    \ Cost';\nGetThe.last();\nrc=prod.find();\noutput;\nend;\nenddata;\nrun;\nquit;\n\
    ```\n\n"
