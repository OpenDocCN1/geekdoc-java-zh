    - store DS2 methods in packages and reuse them in subsequent DS2 programs

    - use DS2 programs to create object-oriented programs

    - use predefined DS2 packages to add extra functionality to your DS2 data programs

    - create DS2 threads and execute them from a DS2 program for parallel processing
    of data records

    - use BY-group and FIRST.variable and LAST.variable processing in a DS2 program
    or thread to perform custom data summarizations, without requiring a preset of
    the data to determine whether your system has the capability to execute DS2 programs
    in-database and, if so, execute your DS2 threads distributed on an MPP DBMS platform


