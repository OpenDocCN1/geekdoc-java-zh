    # About This Book


    # Purpose


    This book will take you from complete novice to confident competence with the
    new SAS programming language, DS2.


    # Is This Book for You?


    Are you comfortable with traditional Base SAS DATA step and SQL processing? Want
    to supercharge your data preparation? Then DS2, the new SAS programming language
    that integrates the power and control of the DATA step with the ease, flexibility,
    and rich data type palette of SQL might be just what you are looking for! DS2
    plays well with multiple data sources, is exceptionally well suited for manipulating
    data on massively parallel platforms (MPPs) like Hadoop, Greenplum, and Teradata.


    DS2 gives you the power to accomplish tasks such as:


    +   - traditional SAS data sets and DBMS data tables containing full-precision
    ANSI data types, all in the same DS2 data program

    - easily create and share reusable code modules

    - create custom objects and use object-oriented programming techniques

    - safely and simply process rows of data simultaneously in Base SAS

    - execute DS2 code in-database on Hadoop, Greenplum, and Teradata


    # Prerequisites


    This book assumes reader proficiency in these topics:


    +   - DATA step programming:

    - SAS libraries

    - accessing data with a LIBNAME statement

    - reading and writing SAS data sets

    - the role of the program data vector (PDV) in DATA step processing

    - conditional processing techniques'
