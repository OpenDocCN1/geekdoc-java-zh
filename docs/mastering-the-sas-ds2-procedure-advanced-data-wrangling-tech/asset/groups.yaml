    \n### 5.3 The Hash and Hiter (Hash Iterator) Packages\n\n### 5.3.1 General\n\n\
    Hash and hash iterator objects are memory-resident objects that enable quick and\
    \ efficient storage, searching, and retrieving data based on lookup keys. They\
    \ are frequently used as lookup tables.\n\n### 5.3.2 Hash Package Example\n\n\
    In this example, we will load a hash object to hold supplier information and use\
    \ the hash object to look up supplier name, and country information based on supplier\
    \ ID values contained in the csprodlist data set.\n"
