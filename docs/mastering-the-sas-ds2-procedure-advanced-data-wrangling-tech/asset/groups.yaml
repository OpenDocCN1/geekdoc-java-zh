    \ | 55.6% | -$12,348.60 |\n\n### 5.2.2.2 Using FCMP Functions in DS2\n\nFirst,\
    \ we will need to create a DS2 wrapper package for the SAS data set containing\
    \ the FCMP functions. The following DS2 programs create that wrapper package:\n\
    \n```sas\n/*Wrapper the PROC FCMP functions in a DS2 package*/\nproc ds2;\n  package\
