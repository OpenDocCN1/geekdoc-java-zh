    \ having label 'Break Even (Units)';\n    dcl GrossProfit having format dollar1.2\n\
    \      label 'Gross Profit (Total)';\n    dcl NetRevenue having format dollar1.2\n\
    \      label 'Net Revenue';\n    method run();\n      set crs.Sales_2014;\n  \
    \    /*This code uses the ourBE method from myPkg */\n      BreakEven=units; /*This\
