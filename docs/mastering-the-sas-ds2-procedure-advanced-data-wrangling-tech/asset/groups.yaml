    \n## 4.2 Diving into User-Defined Methods\n\n### 4.2.1 Overview\n\nUser-defined\
    \ methods are named values in a DS2 program that execute only when called. Methods\
    \ that produce values can be designed to deliver those values in one of two ways:\
    \ the method can either perform like a Base SAS function, returning a single value\
    \ to the calling process, or it can perform like a Base SAS routine, modifying\
    \ one or more values at the call site. User-defined methods for one-time use can\
    \ be easily written inline in DS2 data or thread programs and called from one\
    \ of the program's system blocks.\n\n### 4.2.2 Designing a User-defined Method\n\
    \nMethods are a great tool for standardizing processes in your code. Let's take\
    \ a simple interest calculation as an example. Here is how a bank could calculate\
    \ the accumulated interest for my account after one year:\n\n```\nAmount=SUM(Amount,\
    \ Amount*Rate);\n```\n\nTo calculate the amount over several years, it's possible\
    \ to execute the formula in a DO loop:\n\n```\ni=1 to Years:\n  Amount=SUM(Amount,\
    \ Amount*Rate);\n```\n\n### 4.2.2.1 Design Considerations\n\nTo create a method,\
    \ we must first decide how want to pass the results back to the calling process.\
    \ Because there are IN_OUT parameters, each parameter can be returned at execution\
    \ time. A method that returns a value using variable names is the most flexible.\
    \ A method that modifies the values at the call site must have IN_OUT parameters.\
    \ When called, all results must be returned directly using IN_OUT parameter. Using\
    \ constants or complex expressions will produce a syntax error.\n\n### 4.2.2.2\
    \ The Interest Method - V1.0\n\nLet's make version 1.0 of our method using an\
