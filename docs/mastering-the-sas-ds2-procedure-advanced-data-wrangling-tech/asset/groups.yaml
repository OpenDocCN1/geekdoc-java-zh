    # 5.1 Introduction


    Chapter 4 introduced the concept of DS2 packages and how they can be used to extend
    the DS2 language and object-oriented application design. It should come as no
    surprise that the developers at SAS would choose packages as a means of providing
    new capabilities in DS2, especially when these capabilities are used as objects.
    Although each predefined DS2 package provides powerful new techniques for processing
    data, the packages available in your SAS session will depend on the release you
    are using, as shown in Table 5.1. In this chapter, we will delve into all of the
    predefined packages that are shipped with DS2 in the SAS 9.4M3 release.'
