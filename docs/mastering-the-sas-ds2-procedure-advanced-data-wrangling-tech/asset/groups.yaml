- md: "\n116 Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\
    \n## 6.4 DS2 and the SAS In-Database Code Accelerator\n\n### 6.4.1 Running DS2\
    \ In-Database In-Database\n\nRegardless of where your DS2 threads are stored,\
    \ if you have licensed, installed, and configured the SAS In-Database Code Accelerator\
    \ for a supported database, the thread program can be sent into the database where\
    \ it compiles and executes distributed on the hardware. If the prospect of running\
    \ thread programs on an MPP excites you, then you will really love knowing that\
    \ the DS2 program itself can run in parallel in-database! This allows us to use\
    \ the power and flexibility of SAS DS2 compute while benefiting from the massively\
    \ parallel processing capability of the database hardware. As of the time this\
    \ book was written, the SAS In-Database Code Accelerator is available for Teradata,\
    \ Hadoop, and Greenplum databases.\n\nTo set your DS2 program free from the bounds\
    \ of the SAS compute platform, only need to ensure that the thread program is\
    \ reading from a database table in the SET statement and that PROC2 option DS2ACCEL=YES\
    \ is set. If you write the results of your program to the same database, your\
    \ code goes in, all processing happens in-database, and nothing is returned to\
    \ the SAS log but it is impressively speedy! You might not have access to Teradata\
    \ instance with SAS In-Database code Accelerator, but I did while writing this\
    \ section of the book. First, I ran a DS2 data in threads on the SAS compute platform,\
    \ using a large Teradata table as input and writing the results to Teradata. I\
    \ ran the same program in-database on Teradata by setting PROC2 option DS2ACCEL=YES.\
    \ Here is the code on the SAS platform:\n\n```sas\nproc ds2;\ndata sas_db.thread/overwrite=yes;\n\
    \  dcl thread threads=4;\n  method run();\n    set from th;\n  end;\nend;\nquit;\n\
    ```\n\nHere is the SAS log excerpt from execution on the SAS platform:\n\n| NOTE:\
    \ PROCEDURE DS2 used (Total process time): |\n| :--- |\n| real time 8.68 seconds\
    \ |\n| cpu time 4.8 seconds |\n\nAnd here is the code used for in-database processing:\n\
    \n```sas\nproc ds2 ds2accel=yes;\ndata sas_db.thread/overwrite=yes;\n  dcl thread\
    \ th;\n  method run();\n    set from th;\n  end;\nend;\nquit;\n```\n\nHere is\
    \ the SAS log excerpt from executing the DS2 program in-database:\n\n| NOTE: PROCEDURE\
    \ DS2 used (Total process time): |\n| :--- |\n| real time 16.65 seconds |\n| cpu\
    \ time 0.40 seconds |\n\nThere was some latency introduced because my SAS server\
    \ was located in Boston, MA, and the Teradata server was located in Cary, NC,\
    \ but as you can see, the processing speed was tremendously improved by moving\
    \ into the Teradata database, using the amazing parallel processing capabilities\
    \ of the system.\n\n## 6.5 Review of Key Concepts\n\n- A program is likely to\
    \ be CPU bound if the SAS log reports real time and CPU time for the step are\
    \ within 10% of each other.\n- Traditional SAS steps process individual rows sequentially\
    \ in a single compute thread.\n- DATA steps that perform many computations on\
    \ each row can easily become CPU bound.\n- CPU-bound DATA steps will likely perform\
    \ better if converted to DS2 and executed in several parallel threads.\n- The\
    \ SAS In-Database Code Accelerator is available for Hadoop, Teradata, and Greenplum.\n\
    - With the SAS In-Database Code Accelerator installed, DS2 programs can be executed\
    \ in-database. For Hadoop and Teradata, DS2 programs can also be executed in-database.\n\
    - If your data resides in a DBMS with the SAS In-Database Code Accelerator installed,\
    \ even I/O bound processes will see significant improvements in execution speed\
    \ if converted to DS2 threads and executed in-database.\n\n## Chapter 7: Performance\
    \ Tuning in DS2\n\n7.1 Introduction ............................................................119\n\
    7.2 DS2_OPTIONS Statement ................................................................119\n\
    7.2.1 TRACE Option ...............................................................................119\n\
    7.3 Analyzing Performance with the SAS Log ................................................121\n\
    7.3.1 Obtaining Performance Statistics .......................................121\n\
    7.3.2 Analyzing Performance Statistics .......................................123\n\
    7.3.3 Tuning Your Code ............................................................................123\n\
    7.4 Learning and Troubleshooting Resources ............................................123\n\
    7.4.1 SAS Learning Resources ..........................................................123\n\
    7.4.2 SAS Communities .......................................................124\n\
    7.4.3 SAS Technical Support ............................................................124\n\
    7.5 Review of Key Concepts ................................................................125\n\
    7.6 Connecting with the Author ..........................................................126\n\
    \n### 7.1 Introduction\n\nIn this chapter, we will discuss factors that can affect\
    \ performance in our DS2 programs, tools to help determine the cause of performance\
    \ issues, and programming techniques that we can use to tune the performance of\
    \ our DS2 programs. Along the way, we'll identify some generally good practices\
    \ for DS2 programmers.\n\nSpecifically, we will cover these points:\n\n- using\
    \ the DS2_OPTIONS statement with the TRACE option\n- using the SAS log to gather\
    \ and analyze performance data\n- finding reference and troubleshooting resources\n\
    \  - SAS product documentation\n  - Communities.sas.com\n  - SAS Technical Support\n\
    \n### 7.2 DS2_OPTIONS Statement\n\n### 7.2.1 TRACE Option\n\nIf you are experienced\
    \ with SAS to access data from relational databases, you have probably used the\
    \ SASTRACE system option to see exactly what SQL code was being sent to the database\
    \ and to determine how much processing was executed in the database versus how\
    \ was executed on the SAS compute platform. The SAS 9.4 M1 release brought the\
    \ new DS2 OPTIONS statement. Running a DS2 program in-database after issuing a\
    \ DS2_OPTIONS statement with the TRACE option provides significant information\
    \ in the SAS log concerning what is actually taking place when processing DS2\
    \ code in-database:\n\n```sas\nproc ds2 ds2accel=yes;\nds2_options trace;\ndata\
    \ sas_db.test/overwrite=yes;\ndcl thread th;\nmethod run();\n  set from th;\n\
    end;\nend;\nrun;\nquit;\n```\n\n**SAS Log:**\n\nNOTE: Running THREAD program in-database\n\
    NOTE: Running DATA program in-database\nNOTE: TKIOG Publish Create:\nNOTE: TKIOG\
    \ Publish Add:\nNOTE: XOG: SQL query prior to symbol resolution\nNOTE: order_fact\n\
    NOTE: XOG: SQL query after symbol resolution\nNOTE: order_fact\nNOTE: Invoking\
    \ SAS MapReduce\nNOTE: Hadoop Job (HDP_JOB_ID), job_1455231954269_0010, SAS Map/Reduce\
    \ Job, http://my.hadoop.server.com/proxy/application/1455231954269_0010/\nNOTE:\
    \ Hadoop Version User\nNOTE: 2.5.0-cdh5.4\nNOTE:\nNOTE: Started At Finished At\n\
    NOTE: Feb 13, 2016 9:55:07 PM Feb 13, 2016 9:55:42 PM\nNOTE:\nNOTE: Run Query:\
    \ DROP TABLE test\nNOTE: Run Query: CREATE TABLE test ('total_sales' double, total_spend\
    \ double, 'customer_id' bigint, employee_id bigint, 'street_id' bigint, order_date\
    \ date, 'delivery_date' date, 'order_id' bigint, order_type tiny, 'product_id'\
    \ bigint, quantity int, 'total_retail_price' double, costprice_per_unit double,\
    \ 'discount' double)\nNOTE: Run Query: LOAD DATA INPATH /tmp/sasds2_yi5zio47gtpc659y/sasds2ip_1771037706output\
    \ OVERWRITE INTO TABLE test\n"
  mdcn: "\n\n116 精通 SAS DS2 过程：高级数据处理技术\n\n## 6.4 DS2 与 SAS 数据库内代码加速器\n\n### 6.4.1\
    \ 在数据库运行 DS2\n\n无论你的 DS2 线程存储在何处，只要你为支持的数据库许可、安装并配置了 SAS 数据库内代码加速器（In-Database\
    \ Code Accelerator），线程程序就可以发送到数据库，并在硬件上进行编译和分布式执行。如果你在 MPP（大规模并行处理）上运行线程程序的前景让你兴奋，那么你将非常喜欢知道\
    \ DS2 程序本身可以在数据库内并行运行！这使我们能够利用 SAS DS2 计算的力量和灵活性，同时受益数据库硬件的大规模并行处理能力。在本书编写期间，SAS\
    \ 数据库内代码加速器已支持 Teradata、Hadoop 和 Greenplum 数据库。\n\n要让你的 DS2 程序摆脱 SAS 计算平台的束缚，只需确保\
    \ `SET` 语句中的线程程序是从数据库表中读取数据的，并且设置了 `PROC2`  `DS2ACCEL=YES`。如果你将程序的运行写入同一个数据库，你的代码将进入数据库，所有处理都在数据库内完成，SAS\
    \ 日志不会返回任何内容，但速度极其惊人！你可能无法访问带有 SAS 数据库内代码加速器的 Teradata 实例，但我编写本书的这一章节时我拥有。首先，我在\
    \ SAS 计算平台上运行了 DS2 数据线程程序，使用一个大型 Teradata 表作为输入并将结果写入 Teradata。然后，我通过设置 `PROC2\
    \ option DS2ACCEL=YES` 在 Teradata 数据库内运行了相同的程序。以下是 SAS 平台上的代码：\n\n```sas\nproc\
    \ ds2;\ndata sas_db.thread/overwrite=yes;\n  dcl thread threads=4;\n  method run();\n\
    \    set from th;\n  end;\nend;\nquit;\n```\n\n以下是在 SAS 平台上执行的 SAS 日志摘录：\n\n|\
    \ NOTE: PROCEDURE DS2 used (Total process time): |\n| :--- |\n| real time 8.68\
    \ seconds |\n| cpu time 4.8 seconds |\n\n以下是用于数据库内处理的代码：\n\n```sas\nproc ds2 ds2accel=yes;\n\
    data sas_db.thread/overwrite=yes;\n  dcl thread th;\n  method run();\n    set\
    \ from th;\n  end;\nend;\nquit;\n```\n\n以下是在数据库内执行 DS2 程序的 SAS 日志摘录：\n\n| NOTE:\
    \ PROCEDURE DS2 used (Total process time): |\n| :--- |\n| real time 16.65 seconds\
    \ |\n| cpu time 0.40 seconds |\n\n这里引入了一些延迟，因为我的 SAS 服务器位于马萨诸塞州波士顿，而 Teradata\
    \ 服务器位于北卡罗来纳州卡里，但正如你所见，通过移动到 Teradata 数据库并利用系统强大的并行处理能力，处理速度得到了巨大的提升。\n\n## 6.5\
    \ 核心概念回顾\n\n- 如果 SAS 日志报告的步骤实际时间（real time）和 CPU 时间（cpu time）彼此在 10% 以内，则程序可能是\
    \ CPU 密集型的。\n- 传统的 SAS 步骤在单个计算线程中顺序处理单独行。\n- 对每行执行许多计算的 DATA 步骤很容易变成 CPU 密集型。\n\
    - 将 CPU 密集型的 DATA 步骤转换为 DS2 并在多个并行线程中执行，性能可能会更好。\n- SAS 数据库内代码加速器适用于 Hadoop、Teradata\
    \ 和 Greenplum。\n- 安装了 SAS 数据库内代码加速器后，DS2 程序可以在数据库内执行。对于 Hadoop 和 Teradata，DS2\
    \ 程序也可以在数据库内执行。\n- 如果你的数据存在于安装了 SAS 数据库内代码加速器的 DBMS 中，即使是 I/O 密集型过程，如果转换为 DS2\
    \ 线程并在数据库内执行，执行速度也将显著提高。\n\n## 第 7 章：DS2 中的性能调优\n\n7.1 引言 ............................................................119\n\
    7.2 DS2_OPTIONS 语句 ................................................................119\n\
    7.2.1 TRACE 选项 ...............................................................................119\n\
    7.3 使用 SAS 日志分析性能 ................................................121\n7.3.1 获取性能统计\
    \ .......................................121\n7.3.2 分析性能统计 .......................................123\n\
    7.3.3 调优你的代码 ............................................................123\n\
    7.4 学习与故障排除资源 ............................................123\n7.4.1 SAS 学习资源\
    \ ..........................................................123\n7.4.2 SAS 社区\
    \ .......................................................124\n7.4.3 SAS 技术支持 ............................................................124\n\
    7.5 核心概念回顾 ................................................................125\n\
    7.6 与作者联系 ..........................................................126\n\n###\
    \ 7.1 引言\n\n在本章中，我们将讨论影响 DS2 程序性能的因素、帮助确定性能问题原因的工具，以及我们可以用于调优 DS2 程序性能的编程技术。在此过程中，我们将识别出\
    \ DS2 程序员的一些通用良好实践。\n\n具体而言，我们将涵盖以下几点：\n\n- 使用带有 TRACE 选项的 DS2_OPTIONS 语句\n- 使用\
