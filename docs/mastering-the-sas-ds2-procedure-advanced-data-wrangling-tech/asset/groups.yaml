    end;\nmethod run();\nset crs.banks;\ndo Duration=1 to 5;\nTotal=5000;\ninterest(Total,Duration);\n\
    output;\nend;\nenddata;\n```\n\nFigure 4.1 shows the results of using the interest\
    \ method to calculate the final results of depositing $5,000 in each of the banks\
    \ in the crs.banks data set for a period of one and five years. The user-defined\
    \ method was used to perform the calculations.\n\n```proc ds2;\ntitle 'Results\
    \ for each bank - initial $5,00 deposit';\ntitle2 'method returns a value like\
    \ a function';ndata;\ndcl double Total having format10.2;\ndcl int Duration;\n\
    ```\n"
