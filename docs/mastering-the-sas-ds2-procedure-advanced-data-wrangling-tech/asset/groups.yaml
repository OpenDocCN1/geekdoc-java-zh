    \n# 4.3 User-Defined Packages\n\n# 4.3.1 General Considerations\n\nIf you want\
    \ to use a standard, user-defined method in several programs across SAS sessions,\
    \ you can build a collection of methods and store it in a SAS library. In DS2,\
    \ we call these collections packages, and you create them using a DS2 package\
    \ program. DS2 packages can be used in subsequent DS2 programs, making their methods\
    \ easily and safely reusable.\n\nBut packages can be so much more than a storage\
    \ mechanism for user-defined methods! Packages are the objects of the DS2 language.\
    \ Just as all DATA programs contain all three systems (INIT, RUN and TERM), all\
    \ packages include a constructor method which has the same name as the package,\
    \ and a destructor method DELETE. You can explicitly define a package's constructor\
