  md: "106 Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\n\
    # 5.7 The TZ (Time Zone) Package\n\n# 5.7.1 General\n\nDS2 can process ANSI date\
    \ and time values of the data types DATE, TIME, and TIMESTAMP. These data types\
    \ are non-coercible, which means that, when processing SAS and RDBMS data together,\
    \ it will be necessary to explicitly convert SAS date, and datetime values to\
    \ ANSI dates, time, and timestamp values using the TO_DATE, TO_TIME, and TO_TIMESTAMP\
    \ functions. However, these functions do not take time zones into consideration.\
    \ You can think of each instance of the TZ package as a clock for a specific time\
    \ zone, with methods to easily obtain details about local time such as:\n\n+ \
    \  - current time\n- coordinated universal time (UTC) time\n- time zone ID\n-\
    \ time zone name\n- time zone offset from UTC for a specified local time\n- time\
    \ offset from local time for a specified UTC time\n\nThe TZ package processed\
    \ and returns DOUBLE type SAS date, and datetime values.\n\n# 5.7.1.1 Declaring,\
    \ Instantiating, and Using a TZ Package\n\nOnce instantiated, package methods\
    \ are used to obtain information about time. As a quick example, this program\
    \ uses two instances of the TZ package to provide the local time on my computer\
    \ and the time in my hometown of Fortaleza, Ceará, Brazil.\n\n```\ndcl package\
    \ tz L();\n  dcl package tz F('America/Fortaleza');\n  dcl double Local Fortaleza\
    \ having format datetime;\n  method init();\n    Local=L.getLocalTime();\n   \
    \ Fortaleza=F.getLocalTime();\n    put Local= Fortaleza=;\n  end;\nendata;\nrun;\n\
    quit;\n```\n\nSAS Log:\n\n```\nLocal=17JAN16:09:21:30 Fortaleza=17JAN16:11:21:30\n\
    ```"
  merge: -1
  pgno: 122
