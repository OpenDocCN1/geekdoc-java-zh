  md: '# Chapter 3: DS2 Data Program Details 39


    converted to either fixed-width character or 8-byte floating-point numeric values
    before the data is presented to SAS for processing. This is necessary because
    Base SAS DATA steps and PROCs are designed to process SAS data, and SAS data can
    contain only those two data types.


    However, databases can contain a rich palette of ANSI data types, some of which
    have much greater precision than that achievable with an 8-byte, floating-point
    numeric. Because of the limitations of the 8-byte, floating point numeric, we
    have never been able to process these values at full precision in Base SAS. However,
    because DS2 uses its own driver to access data and does not rely on the LIBNAME
    engine engine mechanism, for the first time we can retrieve and process a wide
    variety of ANSI data types at full precision in Base SAS. The following table
    lists the ANSI data types that DS2 can process natively:


    # Table 3.2: DS2 Data Types


    | Data Type | Class | Description |

    | CHAR(n) | Character (Fixed width) | One byte per character, n = maximum number
    of characters, uses the same number of bytes in every row of data. |

    | NCHAR(n) | Character (Fixed width) | Unicode character data, two to four bytes
    per character, n = maximum number of characters, uses the same number of bytes
    in every row of data. |

    | VARCHAR(n) | Character (Variable width) | One byte per character, uses enough
    bytes to store the actual value in each row of data up to a maximum of n characters.
    |

    | NVARCHAR(n) | Character (Variable width) | Unicode character data, two to four
    bytes per character, uses just enough bytes to store the actual value in each
    row of data up to a maximum of n characters. |

    | DOUBLE | Approximate fractional numeric | 8-byte (64-bit) signed, approximate
    floating-point numeric with a maximum of 16 significant digits of precision on
    ANSI systems. |

    | REAL | Approximate fractional numeric | 4-byte (32-bit) signed, approximate
    floating-point numeric with a maximum of 9 significant digits of precision on
    ANSI systems. |

    | FLOAT(p) | Approximate fractional numeric | Signed, approximate, floating-point
    numeric with user-defined precision (p). The precision determines whether the
    value will be stored as DOUBLE or REAL. |'
