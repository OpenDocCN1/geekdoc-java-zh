  md: "# Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\nAnother\
    \ great place to learn about SAS is to read the SAS Blogs at http://blogs.sas.com.\
    \ They provide a wealth of information, and many times provide data and source\
    \ code, too. I write sporadically for the SAS Learning Post blog. You can find\
    \ a collection of my contributions at http://go.sas.com/jedi.\n\nOnline formal\
    \ training for DS2 is in Live Web format. Just go to http://support.sas.com/training\
    \ and search for DS2.\n\n# 7.4.2 SAS Support Communities\n\nMy favorite destination\
    \ for seeking (and sometimes providing) answers is the SAS Support website at\
    \ http://communities.sas.com. There are many sub-communities available, but most\
    \ of the DS2 activity appears in the SAS Programming and General SAS Programming\
    \ communities (under SAS Programming). The SAS Support forums are very active\
    \ with seasoned SAS users, newcomers, and SAS staff all to help each other.\n\n\
    Another excellent community resource is the Wiki at http://www.sascommunity.org.\
    \ Contributors come from all over the world and all walks of life. The \"sasopedia\"\
    \ portion is a unique, rich source of information about a wide array of SAS techniques.\n\
    \nWhen posing a question to an online community, you can get help more quickly\
    \ if you prepare properly. Please use your question clearly and succinctly. Provide\
    \ a program that demonstrates your problem as simply as possible. And if you want\
    \ a quicker response, include a sample data set. The best way to provide data\
    \ is to include a LITTLE DATA step that produces the sample data, the folks on\
    \ the forum can run your code for themselves, using the same data, and be able\
    \ to quickly reproduce your results. I wrote a blog about this titled \"Jedi SAS\
    \ Tricks: The DATA to DATA Step Macro\" which included program code for the data2datastep\
    \ macro. I've included the code for this macro in the ZIP file containing the\
    \ data for this book. Look for the program name data2datastep.sas at http://go.gl/prQojc.\
    \ Please note that these shortened URLs are sensitive, make sure you use a capital\
    \ Q.\n\n# 7.4.3 SAS Technical Support\n\nAny licensed user can contact SAS Technical\
    \ Support with his or her SAS questions. There is a little guide to help you optimize\
    \ your interactions with SAS Technical Support.\n\n+   * What can I expect from\
    \ SAS Technical Support?\n  See http://support.sas.com/techsup/support.html\n\
    * How can I contact SAS Technical Support?\n  a. Use the telephone for business\
    \ time-critical issues: +1 (919) 677-8008.\n  b. Use the web form for all other\
    \ issues:\n  http://support.sas.com/ctx/supportform/createForm\n* What information\
    \ will I need when contacting SAS Technical Support?\n  * If you are using a commercial\
    \ version of SAS, your company name.\n  * The country in which your software is\
    \ licensed.\n  * Your name, email address, and phone number."
