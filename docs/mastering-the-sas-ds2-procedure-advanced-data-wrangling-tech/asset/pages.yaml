    Count+1;\nend;\nmethod term();\n    put 'The DATA step processed ' Count ' observations.';\n\
    end;\nenddata;\nrun;\nguit;\n```\n\nHere is the SAS log excerpt from the DS2 data\
    \ program:\n\n| | |\n|---|---|\n| DATA step processed | 10000 observations. |\n\
