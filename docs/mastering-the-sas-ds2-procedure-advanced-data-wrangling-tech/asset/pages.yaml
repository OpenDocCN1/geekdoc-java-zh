    You can control this behavior using the OVERWRITE=YES option in the DATA statement,
    or the OVERWRITE=YES table option. The table option allows overwriting only the
    data set specifying the option. The DATA statement allows overwriting of all the
    output tables listed in the DATA statement. For example, this program resolves
    the issue with data set test1, because test2 is not allowed to be overwritten,
    we still get a compilation error:


    ```

    proc ds2;

    data test1(overwrite=yes) test2;

    method run();

    set crs.one_day;

    end;

    enddata;

    run;

