  md: "# Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\nsequence,\
    \ and so on, and a variable that contains the XML and source code required for\
    \ FCMP to execute your function. By default, none of this information is encrypted.\n\
    \nHaving peered inside the data set, our next task is to use new functions in\
