    set crs.one_day;\nend;\nenddata;\nrun;\nquit;\n```\n\n# 2.2.5.3 The TERM Method\n\
    \nThe TERM method executes once, and only once, immediately after the RUN method\
    \ completes execution and before the data or thread program terminates execution.\
    \ It provides an appropriate place to execute program finalization code. This\
    \ DATA step and DS2 data program produce the same results, but the DATA step requires\
