  md: "# Chapter 2: Introduction to the DS2 Language\n\nFigure 2.8: Report Produced\
    \ by the Data Program\nIncome levels\n\n| WholeName | GivenName | Surname |\n\
    |---|---|---|\n| Schmidt, William | | Schmidt |\n| Laverty, Daniel | Daniel |\
    \ Laverty |\n| Grayson, Sarah | Sarah | Grayson |\n| Hastings, Eldon | | Hastings\
    \ |\n\nIf you have stored snppets of code in a SAS program file for inclusion\
    \ in a traditional DATA step, you have probably experienced what I refer to as\
    \ PDV contamination. When the included code references a variable that already\
    \ existed in the main program, or when it includes new variable references, PDV\
    \ values for existing variables can inadvertently be modified by the included\
    \ code. Also, unwanted variables can be added to the PDV and appear in the output\
    \ data set.\n\nWhen using DS2 methods, the method's local variables never affect\
    \ the PDV, a concept often referred to as variable encapsulation. Because method\
    \ parameters and locally declared variables are local scope, they are encapsulated\
    \ in your method code and will not contaminate the PDV. In a later chapter, we\
    \ will store our user-defined methods in a DS2 package for simple reuse in future\
    \ programs. Because of variable encapsulation, you will never need to worry about\
    \ PDV contamination when reusing properly written DS2 methods.\n\n# 2.2.8 Data\
    \ Program Execution\n\nDS2 data programs are delivered by the DS2 compiler for\
    \ syntax checking, compilation, and execution. At compile time, resources are\
    \ reserved for the PDV, the code is compiled for execution, and an output data\
    \ set is being produced, the output data descriptor is written. After compilation,\
    \ execution begins with the INIT method, and it is automatically followed by the\
    \ RUN and TERM method code. Only system methods execute automatically; any user-defined\
    \ methods must be called from the INIT, RUN, or TERM methods or the user-defined\
    \ method will not be executed.\n\n# 2.3 Converting a SAS DATA Step to a DS2 Data\
    \ Program\n\n# 2.3.1 A Traditional SAS DATA Step\n\nHere is a traditional SAS\
    \ DATA step with three subsections, which we will convert into a DS2 data program:\n\
    \n```\ndata null;\n/* Section 1 then */\nif n_=1 then\ndo;\n  put '*********';\n\
    \  put 'Starting';\n```"
