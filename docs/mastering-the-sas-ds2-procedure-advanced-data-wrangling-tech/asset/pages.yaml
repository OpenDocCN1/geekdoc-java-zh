  md: "# 2.2.3 Program Blocks\n\nA brief description of each of the three program\
    \ blocks is provided here to help you interpret the simple examples included in\
    \ this chapter. Most of this is dedicated to the data program. Package programs\
    \ are discussed in detail in Chapter 5, and thread programs in Chapter 6.\n\n\
    # 2.2.3.1 DATA Programs\n\nA DS2 data program begins with a DATA statement, ends\
    \ with an ENDDATA statement, includes at least one system method definition, and\
    \ can generate a result. It is the fundamental programming tool in the DS2 language.\
    \ As in a Base SAS DATA step, the DS2 program DATA statement normally lists the\
    \ name or names of the table or tables to which the result set will be written.\
    \ Using the special table NULL to suppress the result set is optional. If no destination\
    \ table is named in a SAS DATA step, SAS directs the result set to the WORK library,\
    \ using an automatically generated data set name (DATA1, DATA2, and so on). A\
    \ DS2 data program without a destination table name sends its results to the Output\
    \ Delivery System (ODS) for rendering as a report, much like an SQL query.\n\n\
    ```\ndata;\n  set crs.banks;\nset;\n\nproc ds2;\ndata;\n  method run();\n    set\
    \ crs.banks;\n  end;\nendata;\nrun;\nquit;\n```\n\nThe SAS log for the traditional\
    \ DATA step indicates that the result set was written to a data set named DATA1\
    \ in the WORK library:\n\n> NOTE: There were 3 observations read from the data\
    \ set CRS.BANKS.\nNOTE: The data set WORK.DATA has 3 observations and 2 variables.\n\
    \nThe output from the DS2 data program appears instead in the Results tab:\n\n\
    # Figure 2.1: Output of the DS2 Data Program\n\n| Name | Rate |\n| Carolina Bank\
    \ and Trust | 0.0318 |\n| State Savings Bank | 0.0321 |\n| National Savings and\
    \ Trust | 0.0328 |"
