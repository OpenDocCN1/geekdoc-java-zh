  md: "# Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\n+\
    \   - documenting and maintaining packages\n- using DS2 packages for object-oriented\
    \ programming\n\n# 4.2 Diving into User-Defined Methods\n\n# 4.2.1 Overview\n\n\
    User-defined methods are named values in a DS2 program that execute only when\
    \ called. Methods that produce values can be designed to deliver those values\
    \ in one of two ways: the method can either perform like a Base SAS function,\
    \ returning a single value to the calling process, or it can perform like a Base\
    \ SAS routine, modifying one or more values at the call site. User-defined methods\
    \ for one-time use can be easily written inline in DS2 data or thread programs\
    \ and called from one of the program's system blocks.\n\n# 4.2.2 Designing a User-defined\
    \ Method\n\nMethods are a great tool for standardizing processes in your code.\
    \ Let's take a simple interest calculation as an example. Here is how a bank could\
    \ calculate the accumulated interest for my account after one year:\n\n```\nAmount=SUM(Amount,\
    \ Amount*Rate);\n```\n\nTo calculate the amount over several years, it's possible\
    \ to execute the formula in a DO loop:\n\n```\ni=1 to Years:\n  Amount=SUM(Amount,\
    \ Amount*Rate);\n```\n\n# 4.2.2.1 Design Considerations\n\nTo create a method\
    \ to perform interest calculations, we must first decide how want to pass the\
    \ calculated interest value back to our calling process. Because there is only\
    \ one value involved, we could choose to return or modify one of the method's\
    \ parameters at the call site by defining an IN_OUT parameter. Each method has\
    \ pros and cons. A method that returns a value is the most flexible when called.\
    \ When parameters are passed by value (there are no IN_OUT parameters), each parameter\
    \ value can be provided at execution time with a constant, variable reference,\
    \ or an expression. A method that modifies the values of its parameters at the\
    \ call site must pass in the values of the IN_OUT parameters by reference. When\
    \ called, all IN_OUT parameter values must be returned using variable names. Because\
    \ the method results must be returned directly by modifying the IN_OUT parameter,\
    \ using constants or complex expressions will produce a syntax error.\n\n# 4.2.2.2\
    \ The Interest Method - V1.0\n\nLet's make version 1.0 of our method using an\
    \ IN_OUT parameter to provide the initial amount invested and to hold the resulting\
    \ total after the interest has been compounded.\n\n```\nproc ds;\ntitle 'Results\
    \ for each bank - initial $5,000 deposit';\ndata;\ndcl double Total having format\
    \ dollar10.2;\ndcl int Duration;\nkeep total duration bank rate;\n```"
