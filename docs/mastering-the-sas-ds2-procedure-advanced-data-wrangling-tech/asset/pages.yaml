  md: '# Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques


    As you can see, the information that is reported is much richer with FULLSTIMER
    on.

    Here is some descriptive information for selected performance statistics:


    Table 7.1: Performance Statistics in the SAS Log


    | Statistic | Significance |

    | --- | --- |

    | Real Time | This is the "wall clock" time elapsed while your job was executing—for
    example, the time you spent waiting for the step to complete. If any other programs
    are running on your system beside SAS, real time can fluctuate significantly for
    the same job depending on how long SAS has to wait for system resources in use
    by other processes. |

    | CPU Time | When FULLSTIMER is not in effect, SAS reports the sum of CPU time
    and system time as CPU time. When FULLSTIMER is in effect, CPU time and system
    time are reported separately. When parallel processing is in effect, CPU time
    can be greater than real time. |

    | User CPU Time | This is CPU time expended while executing user-written code,
    including the SAS program that you wrote and the built-in SAS processes that support
    its execution. |

    | System CPU Time | This is the CPU time expended by the operating system in support
    of userwritten code. |

    | Memory | This is the memory allocated to this job or step, not including SAS
    system overhead. |

    | Involuntary Context Switches | This is the number of times a process releases
    its CPU time-slice involuntarily. Causes include running out of CPU time before
    your job is finished or having another task grab your time-slice because it has
    higher priority. |

    | Page Swaps | This is the number of times a process was swapped out of main memory.
    |


    When benchmarking performance, it is necessary to run each version of a process
    several times in separate SAS sessions and average the performance results before
    making comparisons. It is very helpful to be able to extract statistics from the
    SAS log and save them to a SAS data set for later analysis. The experimental %LOGPARSE
    is available for download from the SAS Support website and can automate this process
    for you to some extent.


    If these techniques do not identify your problem, configuring the SAS logging
    facility to use some of the DS2 loggers might be useful. Setting up SAS to use
    these loggers can be a bit intimidating at first, but a lot of detailed information
    can be gained using this technique. See the SAS DS2 Language Reference titled
    “DS2 Loggers.” Also see SAS Logging: Configuration and Programming Reference.'
