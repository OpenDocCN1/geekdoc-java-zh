  md: "# Chapter 2: Introduction to the DS2 Language\n\nFigure 2.4: DS2 Data Program\
    \ Variable Scope\n\n```\nproc ds2;\n  data  null;\n  dcl varchar(6) var1 var2;\n\
    \  retain var1 var2 'Global';\n  method init();\n    dcl varchar(5) var1;\n  \
    \  var='Local';\n    put 'INIT method ' var1=\\;\n    put 'INIT method ' var2=\\\
    ;\n  end;\n  method run();\n    put 'RUN method ' var1=\\;\n    put 'RUN method\
    \ ' var2=\\;\n  end;\n  method term();\n    put 'TERM method ' var1=\\;\n    put\
    \ 'TERM method ' var2=\\;\n  end;\n  enddata;\n  run;\n  quit;\n```\n\nGlobal\
    \ identifiers can be referenced anywhere in the data program.\n\nLocal identifiers\
    \ can only be referenced within the method in which they were defined.\n\n![](img/ef05c3db88dda150abd07414dd206d3f_33_0.png)\n\
    \n+   Legend:\n- Global Scope\n- Local Scope\n\nIf the program illustrated in\
    \ Figure 2.4 is executed, the following results are produced in the SAS log:\n\
    \n```\nINIT method var1=Local\nINIT method var2=Global\nRUN method var1=Global\n\
    RUN method var2=Global\nTERM method var1=Global\nTERM method var2=Global\n```\n\
    \nVariable identifiers are also global scope if the variable is undeclared or\
    \ introduced to the program via a SET statement. In DS2, an undeclared variable\
    \ is created whenever a variable is first referenced in a program statement other\
    \ than a SET or DECLARE statement, as an assignment statement. The use of undeclared\
    \ variables in DS2 is discouraged; doing so will produce warnings in the SAS log.\
    \ This might at first seem strange to a SAS data programmer, if you execute a\
    \ long-running SAS program only to be greeted by the dreaded **NOTE: Variable\
    \ var is uninitialized** in the SAS log, you will understand the benefit of this\
    \ behavior. Generally, that means you've mistyped a variable name somewhere in\
    \ your code, and the processing time for this run of the STEP has been wasted.\n\
    \nYou can control DS2 behavior for undeclared variables with the system option\
    \ DS2COND=SCOND= option in the PROC DS2 statement. The default is WARNING, but\
    \ NONE, NOTE, and ERROR are all valid. When writing, prototyping, or testing code,\
    \ I prefer to have this option to ERROR, so DS2 programs containing undeclared\
    \ variables will fail to compile, will not execute, and will produce this message\
    \ in the SAS log:\n\n```\nERROR: Compilation error.\nERROR: Line nn: No DECLARE\
    \ for referenced variable var; creating as a global variable of type double.\n\
    ```"
