  md: "# Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\nDS2\
    \ packages have built-in mechanism for determining what methods are included in\
    \ the package. In addition, to modify a single method, the entire package needs\
    \ to be re-created. If you use DS2 packages—and I strongly encourage you to do\
    \ so—you'll need some administrative controls in place to make them easier to\
    \ use and administer. I recommend some practices that can improve usability and\
    \ make administration easier:\n\n+   - Include a user-defined CONTENTS method\
    \ in every package that you create. The CONTENTS method should not accept parameters.\
    \ When called, at a minimum, it should provide a list of the methods included\
    \ in the package and the location of the source code. You will need to perform\
    \ any maintenance on the package, as the whole package must be re-created each\
    \ time a change is made.\n- Every method in the package must be overloaded with\
    \ a version of the method that accepts no parameters and does nothing but document\
    \ the method in the SAS log.\n\nLet's create a simple package that includes the\
    \ two versions of our interest method and also includes the self-documenting features\
    \ discussed above:\n\n```\nproc ds2;\npackage crs.MyMethods;\nmethod contents();\n\
    \  put;\n  put 'This package contains the following methods:';\n  put ' - contents();';\n\
    \  put ' - interest();';\n  put;\n  put 'Package source:';\n  put %tslit(&path);\n\
    \  put;\nend;\nmethod interest();\n  put 'Syntax: interest(Amount,Rate,Years,Periods)>';\n\
    \  put ' Amount (double) - original amount';\n  put ' Rate (double) - interest\
    \ rate';\n  put ' Years (int) - number of years for interest';\n  put ' yield;\
    \ Periods (int) - number of compounding periods';\n  put ' per year (optional)';\n\
