  md: "```\ndata _null;\ndcl char(25) \"Character\";\nmethod run();\n  \"Character\"\
    =&msg;\n  put \"Character\";\nend;\nenddata;\nrun;\nquit;\n```\n\n# SAS Log:\n\
    \n> WARNING: Line nnn: No DECLARE for referenced variable \"this is the message.\\\
    \ creating it as a global variable of type double.\nNOTE: Execution succeeded.\
    \ No rows affected.\n\nAs we can see from the log, DS2 interpreted \"This is the\
    \ message.\" as a variable name. Because there was no indication of what type\
    \ of variable to create, DS2 created a double-precision, floating-point numeric\
    \ (SAS numeric) variable name \"this is the message\". The value of this new variable\
    \ was assigned to the \"Character\" variable, which is a text variable. The automatic\
    \ conversion from numeric to character produced the '.' that we then see in the\
    \ log. We can tell well what happened because of the warning message produced\
    \ by the use of an undeclared variable.\n\nTo facilitate macro-generated text\
    \ in DS2 literals, SAS provides the autocall macro %TSLIT. This allows all numeric\
    \ strings to resolve, and then takes the resulting text and applies a real single\
    \ quote mark to the beginning and end of the text text. Finally, SAS sends the\
    \ resulting text back to the word scanner. This makes macro variable resolution\
    \ as expected in DS2:\n\n```\n% msg=This is the message;\nproc ds2;\ndata _null;\n\
    dcl char(25) \"Character\";\nmethod run();\n  \"Character\"=%tslit(&msg);\n  put\
    \ \"Character\";\nend;\nenddata;\nrun;\nquit;\n```\n\n# SAS Log:\n\n> This is\
