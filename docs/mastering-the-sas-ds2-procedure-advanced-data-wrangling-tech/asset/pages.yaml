    # 5.4.3 JSON Package Specifications


    The JSON package provides an interface to create and parse JSON text. The names
    of the methods used to parse JSON text all begin with the prefix WRITE and are
    generally referred to as JSON package WRITE methods. The generated JSON can be
    retrieved into text variables. This could be useful for creating JSON data for
    use with the HTTP POST method, but for writing JSON to test files, PROC will be
    the tool to use. I''m excited about the JSON package parser, which will enable
    us to parse JSON from our API calls.


    To use the package, we must first declare an instance of the package. We''ll also
    declare some variables to handle the data that is parsed out of the response body:


    After initializing the package, the methods we''ll need are to preparing the instance
    to receive and parse JSON text. The CREATEPARSER creates an instance of the JSON
    parser, and executing it is the first step toward preparing to parse. The next
    step is to execute the SETPARSERINPUT method, which accepts a single parameter
    specifying the JSON text to be parsed. Both of these methods return return codes,
    indicating that all went went well.


    ```

    dcl package json();

    dcl nchar(1024) token;

    dcl int jsonType;

    ```'
