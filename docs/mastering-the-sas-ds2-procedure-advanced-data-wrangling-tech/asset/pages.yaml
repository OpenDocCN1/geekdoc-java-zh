    # 5.3 The Hash and Hiter (Hash Iterator) Packages


    # 5.3.1 General


    Hash and hash iterator objects are memory-resident objects that enable quick and
    efficient storage, searching, and retrieving data based on lookup keys. They are
    frequently used as lookup tables. Depending on the number of keys and the size
    of the data, a hash object can retrieve values significantly faster than a SAS
    format. Hash objects can be loaded from a SAS set, stored back to SAS data set
    using a traditional SAS DATA step or DS2 data program. Data is loaded in the order
    in which it occurs in the data set. This determines the order in which items are
    be retrieved from the hash. The DS2 hash and hiter packages provide hash and hash
    iterator functionality in DS2 programs.


    Think of a hash iterator object (hiter) as an ordered view of an existing hash
    object. It can retrieve data in whatever order, regardless of the hash object''s
    ORDERED argument. A hiter object must reference an existing hash object, the referenced
    hash object must be instantiated before you can instantiate a hiter object.


    # 5.3.2 Hash Package Example


    In this example, we will load a hash object to hold supplier information and use
    the hash object to look up supplier name, and country information based on supplier
    ID values contained in the csprodlist data set.


    To use a hash object in DS2, we must first set the hash object by declaring an
    instance of the hash package and providing the necessary constructor parameters.
    A hash object can be completely defined at instantiation, providing the data source,
    key, and values. We''ll work our way through a complete definition, discussing
    parameters along the way.'
