    There was some network latency introduced because my SAS server was located in
    Boston, MA, and the Teradata server was located in Cary, NC, but as you can see,
    the processing speed was tremendously improved by moving the process into the
    Teradata database, using the amazing, massively parallel processing capabilities
    of the Teradata system.


    # 6.5 Review of Key Concepts


    +   * A program step is likely to be CPU bound if the SAS log reports real time
    and CPU time for the step are within 10% of each other.

    * Traditional SAS DATA steps process individual rows of data sequentially in a
    single compute thread.

    * DATA steps that perform many computations on each row of data can easily become
    CPU bound.

    * CPU-bound DATA steps will likely perform better if converted to DS2 and executed
    in several parallel threads.

    * The SAS In-Database Code Accelerator is available for Hadoop, Teradata, and
    Greenplum.

    * With the SAS In-Database Code Accelerator installed, DS2 thread programs can
    be executed in-database. For Hadoop and Teradata, DS2 data programs can also be
    executed in-database.

    * If your data resides in a DBMS with the SAS In-Database Code Accelerator installed,
    even I/O bound processes will likely see significant improvements in execution
    speed if converted to DS2 THREADs and executed in-database.'
