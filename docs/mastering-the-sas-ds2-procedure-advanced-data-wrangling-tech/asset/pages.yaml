  md: "116 Mastering the SAS DS2 Procedure: Advanced Data Wrangling Techniques\n\n\
    # 6.4 DS2 and the SAS In-Database Code Accelerator\n\n# 6.4.1 Running DS2 In-Database\
    \ Programs In-Database\n\nRegardless of where your DS2 threads are stored, if\
    \ you have licensed, installed, and configured the SAS In-Database Code Accelerator\
    \ for a supported database, the thread program can be sent into the database where\
    \ it compiles and executes distributed on the hardware. If the prospect of running\
    \ thread programs on an MPP excites you, then you will really love knowing that\
    \ the DS2 program itself can run in parallel in-database! This allows us to use\
    \ the power and flexibility of SAS DS2 compute while benefiting from the massively\
    \ parallel processing capability of the database hardware. As of the time this\
    \ book was written, the SAS In-Database Code Accelerator is available for Teradata,\
    \ Hadoop, and Greenplum databases.\n\nTo set your DS2 program free from the bounds\
    \ of the SAS compute platform, you only need to ensure that the thread program\
    \ is reading from a database table in the SET statement and that the PROC DS2\
    \ option DS2ACCEL=YES is set. If you write the results of your program to the\
    \ same database, your code goes in, all processing happens on the DBMS platform,\
    \ and nothing is returned to the SAS log but the log. It is impressively speedy!\n\
    \nYou might not have access to a Teradata instance with the SAS In-Database code\
    \ Accelerator, but I did while writing this section of the book. First, I ran\
    \ a DS2 data program in threads on the SAS compute platform, using a large Teradata\
    \ table as input and writing the results to Teradata. I ran the same program in-database\
    \ on Teradata by setting the PROC DS2 option DS2ACCEL=YES.\n\nHere is the code\
    \ on the SAS platform:\n\n```\nproc ds2;\ndata crs_db.scored_thread/overwrite=yes;\n\
    \  dcl thread Score th;\n  method run();\n    set from th threads=4;\n  end;\n\
    endata;\nrun;\nquit;\n```\n\nHere is the SAS log excerpt from execution on the\
    \ SAS platform:\n\n| NOTE: PROCEDURE DS2 used (Total process time):\nreal time\
    \ 4:08.68\ncpu time 6.48 seconds |\n\nAnd here is the code used for in-database\
    \ processing:\n\n```\nproc ds2 ds2accel=yes;\ndata crs_db.scored_thread/overwrite=yes;\n\
    \  dcl thread Score th;\n  method run();\n    set from th;\n  end;\nenddata;\n\
    ```"
