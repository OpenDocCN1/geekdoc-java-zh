    \ only the global variables WholeName, GivenName, and Surname.\n\n```\nproc ds2;\n\
    data;\n  declare varchar(100) WholeName;\n  method fullname(varchar(50) first,\
    \ varchar(50) last)\n    returns varchar(100);\n    dcl varchar(100) FinalText;\n\
    \    FinalText=catx(', ',last,first);\n    Return FinalText;\n  end;\n  method\
    \ run();\n    set crs.customer_sample (keep=(GivenName Surname));\n    FullName=fullname(GivenName,\
