    \ to missing before being passed to a Base SAS function. As expected, the DS2\
    \ NULL function also evaluates VARCHAR values as null.\n\nDECIMAL null values\
    \ are equal to the constant missing value, are evaluated as missing by the SAS\
    \ MISSING function for the reasons previously stated, and evaluated as null by\
    \ the DS2 NULL function."
