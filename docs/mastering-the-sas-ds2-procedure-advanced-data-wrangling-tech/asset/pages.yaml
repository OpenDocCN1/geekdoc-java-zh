    # 5.6.2 SQLSTMT Package Example


    In my using SAS in the real world, I have always been amazed by the flexibility
    provided by the SAS/ACCESS engines. The ability to manipulate almost any data,
    no matter what the source, using the powerful SAS language tools I had already
    mastered instead of having to learn a new language for each source, was heady
    stuff indeed! With great power comes great responsibility—using LIBENAME statement
    to manage data from great sources in the same process quickly highlighted this
    principle! These cross-library operations require that all of the data be present
    on a common platform in order to take place. And in the early days of my career,
    that could mean dragging huge sets out of the DBMS system and onto the same platform
    for processing. This caused seemingly simple processes to run for very long periods
    of time, and in addition making me impatient, angered my yet indispensable deities
    that are vital to the success of all projects-the DBA and the SYSADMIN. I quickly
    learned to ask for help and to proactively creates of my data in the DBMS in order
    to work around these issues. In an ANSI SQL environment, this brought in its long-running
    problem: to update values in a table contained in a second table, a correlated
    subquery was required that seemed to run forever. Or each DBMS provided several
    complex processes that could circumvent that... You can see how process complexity
    can so quickly escalate!


    This SQLSTMT package will update the data in a large table with values contained
    in a smaller table located in a different library. We will not have to pre-stage
    a copy of the SAS table in the DBMS library, nor will we need to use a correlated
    subquery or other complex processes to make it work efficiently. In this example,
    both of the tables are SAS libraries because I wanted able to practice using SAS
    University Edition, which does not provide a SAS/ACCESS interface to connect to
    a DBMS. But I''ve executed similar code with the larger table in Teradata, and
    the performance was excellent.


    # 5.6.2.1 Cross-library Table Updates with the SQLSTMT Package


    Our example uses two SQLSTMT package instances, to read the new prices from an
    update table, which we will use the INIT method of our data program, and to execute
    UPDATE statements to modify the values in the master table, crs.prices. Because
    all of it is done using SQLSTMT packages, we could actually use a DATA NULL program.
    However, I decided to create an audit set while doing the updates so we have a
    permanent record of the changes made, so we use data program that produces output
    and an OUTPUT statement to create an audit file while processing. Here''s what
    the data looks like before the update:'
