    # ## 6.1 Introduction


    In Chapter 1 we noted that the traditional SAS DATA step always processed data
    row at a time using a single compute thread. We said that DS2 was capable of significantly
    speeding up compute-intensive data manipulation by processing multiple rows of
    data in parallel. But up to this point, all of our DS2 data programs have also
    been used using only one compute thread. In this chapter, we will write DS2 thread
    programs and execute them from DS2 data programs to process multiple rows of data
    in parallel and as we practice with this technique, we will demonstrate the benefits
    of parallel processing for compute-intensive applications. Specifically, we will
    cover these points:


    +   - threading in data processing

    - writing DS2 thread programs


    +   - thread parameters and constructor methods

    - global and local variables in threads

    - storing and re-using threads

    - parallel processing with DS2 threads


    +   - executing threads on the Base SAS compute platform

    - executing threads in-database with the SAS In-Database Code Accelerator'
