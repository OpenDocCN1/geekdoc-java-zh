  md: "# Chapter 4: User-Defined Methods and Packages 57\n\nparameters or parameters\
    \ that are clearly from different data classes. All of the following method definitions\
    \ will have unique signatures:\n\n```\nmethod t(double v1);\n  put 'Double Parameter';\n\
    end;\nmethod t(decimal(35,5) v1);\n  put 'Real Parameter';\nend;\nmethod t(double\
    \ v1, double v2);\n  put 'Real Parameter';\nend;\n```\n\nThe signatures for these\
    \ methods would look something like this:\n\n+   - t, floating-point numeric\n\
    - t, fixed-point numeric\n- t, floating-point numeric, floating-point numeric\n\
    \nAll are easily distinguished from each other.\n\nNow that we know about method\
    \ overloading, it will be easy to create the different versions of the method\
    \ that we require. All we need now is an easy mechanism for storing, deploying,\
    \ and sharing our methods with the other programmers in our company.\n\n# 4.3\
    \ User-Defined Packages\n\n# 4.3.1 General Considerations\n\nIf you want to use\
    \ a standard, user-defined method in several programs across SAS sessions, you\
    \ can build a collection of methods and store it in a SAS library. In DS2, we\
    \ call these collections packages, and you create them using a DS2 package program.\
    \ DS2 packages can be used in subsequent DS2 programs, making their methods easily\
    \ and safely reusable.\n\nBut packages can be so much more than a storage mechanism\
    \ for user-defined methods! Packages are the objects of the DS2 language. Just\
    \ as all DATA programs contain all three systems (INIT, RUN and TERM), all packages\
    \ include a constructor method which has the same name as the package, and a destructor\
    \ method DELETE. You can explicitly define a package's constructor and destructor\
    \ methods to set up an initialization process for the package when it is instantiated\
    \ and cleanup routines to be executed out of scope. When you not explicitly write\
    \ a constructor or destructor method, a null method is provided by the compiler.\
    \ A package can also contain private, global variables that we use to keep track\
    \ of state within a package instance. We will explore the benefits of an object-oriented\
    \ approach to application development and show examples of using DS2 packages\
    \ as objects in Section 4.3.3.\n\n# 4.3.2 User-Defined Package Specifics\n\n#\
    \ 4.3.2.1 Storing User-Defined Methods in Packages\n\nA package is created with\
    \ a DS2 package program. The PACKAGE statement indicates where the package will\
    \ be stored. The methods defined inside the package program become part of the\
    \ package."
