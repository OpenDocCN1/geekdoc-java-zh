    \   6. The sixth parameter, duplicate, determines whether to ignore duplicate\
    \ keys when loading a table into the hash package. Valid values are 'add', 'replace'\
    \ and 'error'. The default is 'add', which stores the first key and ignores all\
    \ subsequent duplicates. 'Replace' causes subsequent duplicates to replace the\
    \ original key values, which results in the last being the only one retained.\
