    # ## 3.1 Introduction


    In this chapter, we''ll focus on DS2 data program fundamentals, first by further
    comparing and contrasting the traditional DATA step with the DS2 data program,
    and by diving into some of the things that are new in DS2. In the process, we''ll
    convert more complex Base SAS DATA steps into DS2 data programs, and we will introduce
    several concepts and techniques that are unique to DS2. Specifically, we will
    cover these points:


    +   * more DS2 data program syntax and structure

    * using FedSQL queries to provide input directly to a DS2 data program SET statement

    * the wide variety of ANSI data types that can be processed in DS2

    * DS2 automatic data type conversion rules

    * unique DS2 program statements

    * unique DS2 expressions

    * selected DS2 functions


    # ## 3.2 DS2 Data Programs versus Base SAS DATA Steps


    # ### 3.2.1 General Considerations


    The DS2 data program syntax''s similarity to Base SAS DATA step syntax is an advantage
    for seasoned SAS programmers. This similarity clearly shows in the statement syntax
    that is shared'
