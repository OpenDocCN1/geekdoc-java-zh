    # 4.3.3 Object-Oriented Programming with DS2 Packages


    The ultimate power of the DS2 package comes from using it to enable object-oriented
    application design. In object-oriented programming, software objects can be used
    to model real-world objects, and existing objects can then be assembled to model
    other, more complex objects without having to re-write or re-test the existing
    objects'' functionality. This can significantly speed up software'
