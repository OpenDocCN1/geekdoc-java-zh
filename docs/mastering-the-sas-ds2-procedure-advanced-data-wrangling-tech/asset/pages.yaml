    \  end;\n\n```\n\n# 5.4.3.2 Parsing with the JSON Parser Instance\n\nAfter the\
    \ parser is initiated and the JSON text identified, we can use the GETNEXTTOKEN\
    \ method to work our way through the JSON, retrieving one token at a time. This\
    \ method will accept up to SIX IN_OUT parameters, as described below.\n\nTable\
    \ 5.2: JSON Package GETNEXTTOKEN Method Parameters\n\n| Parameter | Purpose |\n\
    | --- | --- |\n| RC | An integer return code, with 0 indicating that all went\
    \ well. |\n| Token | The token text returned as NCHAR. |\n| TokenType | Integer\
    \ code indicating what type of token was just retrieved. |\n| ParseFlags | Integer\
    \ flag set providing additional information about the token. |\n| LineNumber |\
    \ Integer line number to help the user find the token within the JSON text. |\n\
    | ColumnNumber | Integer column number to help the user find the token within\
    \ the JSON text. |\n\nTokenType codes are as follows:\n\nTable 5.3: JSON Package\
    \ GETNEXTTOKEN Method Token Types\n\n| Token Type | Description of Token |\n|\
    \ --- | --- |\n| 4 | Boolean true |\n| 8 | Boolean false |"
