    \    set crs.dates;\n    apnd.execute();\n  end;\nenddata;\nrun;\nquit;\n```\n\
    \nThe SQLSTMT package also provides the FETCH method for interrogating a result\
    \ set produced by executing a query, as well as the BINDRESULTS method for populating\
    \ an ordered list of PDV variables by the query results.\n\nThe BINDRESULTS method\
    \ need only called once. It uses the information provided via the second argument\
    \ during SQLSTMT package instantiation to create a map for populating PDV variables\
    \ from columns in the query results. You must execute this method once before\
    \ using FETCH to retrieve values.\n\nThe FETCH method reads a row from the query\
    \ result and produces a zero (0) return code if a row was retrieved. A nonzero\
    \ result indicates either that there was an error (1) or that no more results\
    \ are available (2). This method is typically used in a DO WHILE or DO UNTIL expression.\n\
