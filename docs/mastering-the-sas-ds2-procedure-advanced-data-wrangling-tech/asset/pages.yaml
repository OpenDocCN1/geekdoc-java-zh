    # 3.3.3.1 Explicit Conversion for Non-coercible Data Types


    DS2 provides functions for conversion of ANSI TIME, DATE, and TIMESTAMP values
    to and from the corresponding SAS DOUBLE values and for converting SAS TIME, DATE,
    and DATETIME to the corresponding ANSI TIME, DATE, and TIMESTAMP values.


    # 3.3.3.2 TO_TIMESTAMP, TO_DATE, and TO_TIME Functions


    The TO_TIMESTAMP function accepts a single SAS DATETIME value as its argument
    and returns the corresponding ANSI TIMESTAMP value. Similarly, the .TO_DATE and
    .TO_TIME functions accept a single SAS DATE or TIME value and return the corresponding
    ANSI DATE or TIME values, respectively.


    ```

    proc ds2;

    dcl SAS_Datetime having format datetime25.6;

    dcl SAS_Date having format yymmdd01;

    dcl SAS_Time having format format todl15.6;

    dcl timestamp ANSI_Timestamp;

    dcl ANSI_Date;

    dcl ANSI_Time;

    method run();

    SAS_Datetime=HMS(21069,07,09,17.090717);

    SAS_Date=datepart(SAS_Datetime);

    SAS_Time=timepart(SAS_Datetime);

    ANSI_Timestamp=to_timestamp(SAS_Datetime);

    ANSI_Date=to_date(SAS_Date);

    ANSI_Time=to_time(SAS_Time);

    put ''SAS:'' SAS_Datetime SAS_Date SAS_Time;

    put ''ANSI:'' ANSI_Timestamp ANSI_Date ANSI_Time;

    endata;

    run;

    quit;

    ```'
