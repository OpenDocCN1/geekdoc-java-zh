    Answer:


    While both your customer and your boss have different needs of you and are very
    important to your success as a worker, it is always best to try to attend to your
    customer first – however, the key is explaining to your boss why you are needed
    urgently by the customer, and then to assure your boss that you will attend to
    his or her needs as soon as possible (unless it''s absolutely an urgent matter).


    ## 33: What is the most important aspect of customer service?


    Answer:


    While many people would simply state that customer satisfaction is the most important
    aspect of customer service, it''s important to be able to elaborate on other important
    techniques in customer service situations. Explain why customer service is such
    a key part of business, and be sure to expand on the aspect that you deem to be
    the most important in a way that is reasoned and well-thought out.


    ## 34: Is it best to create low or high expectations for a customer?


    Answer:


    You may answer this question either way (after, of course), determining that the
    company does not have a clear opinion on the matter. However, no matter which
    way you answer the question, you must display a thorough thought process, and
    very clear reasoning for the option you chose. Offer pros and cons of each, and
    include the ultimate point that tips the scale in favor of your chosen answer.


    ## 35: What is the best way for a company to advertise?


    Answer:


    If you''re going for a position in any career other than marketing, this question
    is probably intended to demonstrate your ability to think critically and to provide
    reflective support for your answers. As such, the particular method you choose
    is not so important as why you''ve chosen it. For example, word of mouth advertising
    is important because customers will inherently trust the source, and social media
    advertising is important as it reaches new customers quickly and cheaply.


    ## 36: Is it better to gain a new customer or to keep an old one?


    Answer:


    In almost every case, it is better to keep an old customer, and it''s important
    that you are able to articulate why this is. First, new customers generally cost
    companies more than retaining old ones does, and new customers are more likely
    to switch to a different company. Additionally, keeping old customers is a great
    way to provide a stable backbone for the company, as well as also gain new customers
    as they are likely to recommend your company to friends.


    ## 37: What is the best way to win clients from competitors?


    Answer:


    There are many schools of thought on the best way to win clients from competitors,
    and unless you know that your interviewer adheres to a specific thought or practice,
    it''s best to keep this question general. Rather than using absolute language,
    focus on the benefits of one or two strategies and show a clear, critical understanding
    of how these ways can succeed in a practical application.


    ## 38: How do you feel about companies monitoring internet usage?


    Answer:


    Generally speaking, most companies will monitor some degree of internet usage
    over their employees – and during an interview is not the best time to rebel against
    this practice. Instead, focus on positive aspects as the way it can lead to increased
    productivity for some employees who may be easily lost in the world of resourceful
    information available to them.


    ## 39: What is your first impression of our company?


    Answer:


    Obviously, this should be a positive answer! Pick out a couple key components
    of the company’s message or goals that you especially identify with or that pertain
    to your experience, and discuss why you believe these missions are so important.


    ## 40: Tell me about your personal philosophy on business.


    Answer:


    Your personal philosophy on business should be well-thought out, and in line with
    the missions and objectives of the company. Stay focused on positive aspects such
    as the service it can provide, and the lessons people gain in business, and offer
    insight as to where your philosophy has come from.


    ## 41: What''s most important in a business model: sales, customer service, marketing,
    management, etc.?


    Answer:


    For many positions, it may be a good strategy to tailor this answer to the type
    of field you''re working in, and to explain why that aspect of business is key.
    However, by explaining that each aspect is integral to the function as a whole,
    you can display a greater sense of business savvy to the interviewer and may stand
    out in his or her mind as a particularly aware candidate.


    ## 42: How do you keep up with news and emerging trends in the field?


    Answer:


    The interviewer wants to see that you are aware of what''s currently going on
    in your field. It is important that your education does not stop after college,
    and the most successful candidates will have a list of resources they regularly
    turn to already in place, so that they may stay aware and engaged in developing
    trends.


    ## 43: Would you have a problem adhering to company policies on social media?


    Answer:


    Social media concerns in the workplace have become a greater issue, and many companies
    now outline policies for the use of social media. Interviewers will want to be
    assured that you won''t have a problem adhering to company standards, and that
    you will maintain a consistent, professional image both in the office and online.


    ## 44: Tell me about one of the greatest problems facing X industry today.


    Answer:


    If you''re involved in your career field, and spend time on your own studying
    trends and new developments, you should be able to display an awareness of both
    problems and potential solutions coming up in the industry. Research some of the
    latest news.


    ## 45: What do you think it takes to be successful in our company?


    Answer:


    Research the company prior to the interview. Be aware of mission and main objectives,
    as well as some of the biggest names, and also keep in mind how they achieved.
    Keep your answer focused on specific objectives you could reach in order to help
    the company achieve its goals.


    ## 46: What is your favorite part of working in this field?


    Answer:


    This question is an opportunity to discuss some of your favorite aspects of the
    job, and to highlight why you are great candidate for the position. Remember to
    remain enthusiastic and excited for the opportunities you could attain in the
    job.


    ## 47: What do you see happening to your career in the next 10 years?


    Answer:


    If you''re plugged in to what''s happening in your career now, and are making
    an effort to stay abreast of emerging trends in your field, you should be able
    to offer the interviewer several predictions as to where your career may be heading.
    This insight and level of awareness shows a level of dedication and interest that
    is important to employers.


    ## 48: Where do you find ideas?


    Answer:


    Ideas can come from all places, and an interviewer wants to see that your ideas
    are just as varied. Mention multiple places that you gain ideas from, or settings
    in which you find yourself brainstorming. Additionally, elaborate on how you record
    ideas or expand upon them.


    ## 49: How do you achieve creativity in the workplace?


    Answer:


    It''s important to show the interviewer that you''re capable of being resourceful
    and innovative in the workplace, without stepping outside the lines of company
    values. Explain where ideas normally stem from you (examples may include an exercise
    such as list-making or a mind map), and connect this to a particular task in your
    job that it would be helpful to be creative in.


    ## 50: How do you push others to create ideas?


    Answer:


    If you''re in a supervisory position, this may be requiring employees to submit
    a particular number of ideas, or to complete regular idea-generating exercises,
    in order to work their creative muscles. However, you can also push others around
    you to create ideas simply by creating more of your own. Additionally, discuss
    with the interviewer the importance of questioning people as a way to inspire
    ideas and change.'
