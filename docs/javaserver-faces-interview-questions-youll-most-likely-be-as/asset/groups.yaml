    ## Attributes, Parameters and Tags


    # 30: What do we the f:attribute, f: param and f:facet do in JSF?


    Answer:


    These tags are general purpose tags that add information to a component.


    # 31: What is the sole role of the f:attribute tag in JSF?


    Answer:


    Its role is to allow any component to store an arbitrary name or value pair in
    its attribute map, by allowing an attribute to be sent to page and later retrieve
    it programmatically.


    # 32: What is the sole role of the f:param tag in JSF?


    Answer:


    The f:param tag allows for the definition of a name or pair, where the value is
    instead placed in a separate child component, making it a much bulkier storage
    mechanism than the f:attribute counterpart.


    # 33: What does the f:facet tag do in JSF?


    Answer:


    This tag adds a named component to a component''s facet map, where the facet components
    are usually rendered in a special place.


    # 34: What does the id attribute allow for in JSF?


    Answer:


    The id attribute allows for accessing the JSF components from other JSF tags,
    obtaining component references in Java code and accessing HTML elements with scripts.


    # 35: What does the Converter Attribute do in JSF?


    Answer:


    The Converter Attribute allows for the attachment of a Converter Attribute to
    a component, and in some cases allows for input tags to have a Validator Attribute
    that can be used to attach a Validator to a component.


    # 36: What is the Render Attribute used for in JSF?


    Answer:


    The Render Attribute is used for the inclusion or exclusion of a component depending
    on a situation, such as the rendering of a Logout button if a user is logged in.


    # 37: What are DHTML events in JSF?


    Answer:


    DHTML stands for Dynamic HTML event attributes and it represents client scripting
    used for many types of tasks such as syntax validation or rollover images.


    # 38: What does the h:panelGrid tag do in JSF?


    Answer:


    The h:panelGrid tag uses HTML tables for layout and it is used for laying components
    in rows and/or columns.


    # 39: What does the Immediate Attribute do in JSF?


    Answer:


    The Immediate Attribute is mainly used for value changes that may affect the user
    interface and its application is render by input components like Menus and Listboxes.


    # 40: What does the h:inputHidden tag do in JSF?


    Answer:


    The h:inputHidden tag is part of the hidden fields present in JSF and it is used
    with JavaScript actions to send back data to the server, except that it does not
    support HTML and DHTML standard tags.


    # 41: What does the h:outputText tag do in JSF?


    Answer:


    The h:outputText tag is the simplest of JSF tags and it is used to generate simple
    text with an exception: it generates an HTML span element if the style or style
    Class attributes are used.


    # 42: What is the h:outputText tag used for in JSF?


    Answer:


    The h:outputText tag is used mainly for producing styled outputs, generating HTML
    markups and to make sure that the text is considered as a one cell of the grid
    in a panel grid.


    # 43: What does the h:graphicImage tag do in JSF?


    Answer:


    The h:graphicImage tag is used for generating HTML img elements by specifying
    the image location with an URL or Value Attribute.


    ## Buttons, Links and Facelets


    # 44: What are the h:commandButton and h:commandLink tags used for JSF?


    Answer:


    These two tags are used to navigate within a JSF application and represent the
    main components of JSF navigation.


    # 45: What does the h:outputLink tag do in JSF?


    Answer:


    This tag is used to generate HTML anchor elements to point to a resource such
    as a web page, with the generated link taking a user to a designated resource
    without the need to use JSF framework.


    # 46: What does the h:selectBooleanCheckbox and h:selectManyCheckbox tags do in
    JSF?


    Answer:


    The first tag represents a checkbox that is wired to a Boolean Bean property and
    the second tag is used to select one or more checkboxes present in a group.


    # 47: Which are the attributes that represent the h:selectBooleanCheckbox and
    h:selectManyCheckbox tags in JSF?


    Answer:


    There are four attributes that are unique to the two tags:


    - a) border,

    - b) enabledClass,

    - c) disabledClass and

    - d) layout.


    # 48: What does Border Attribute do in JSF?


    Answer:


    The Border Attribute is used to specify the width of a border.


    # 49: What do enabledClass and disabledClass do in JSF?


    Answer:


    These two attributes are used to specify CSS classes.


    # 50: What is Facelets in JSF?


    Answer:


    Facelets was designed to be an alternative to the JSP view handler as of JSF 2.0
    it is used to replace JSP technology.


    # 51: What are Facelets Tags used for JSF?


    Answer:


    Facelets Tags are used to include content from other XHTML pages, to build pages
    without writing Java code.


    # 52: What does the ui:composition tag do in JSF?


    Answer:


    This tag specifies a page where parts can be inserted. If used with a template,
    the children of this tag determine the variable parts of the template.


    # 53: What does the ui:decoration tag do in JSF?


    Answer:


    This tag specifies a sequence of elements which can be inserted elsewhere. When
    used with a template, it allows for wrapping a template.


    # 54: What does the ui:debug tag do in JSF?


    Answer:


    This tag allows for users to display a debug window, with keyboard shortcuts,
    that shows the component hierarchy for the currently used page and the scoped
    variables of the application.


    # 55: What does h:dataTable Tag do in JSF?


    Answer:


    The h:dataTable Tag is used to iterate over data to create an HTML table with
    value attributes such as Java Objects, Arrays or Instances of java.List and more.


    # 56: Which tags are found in the body of a h:dataTable tag?


    Answer:


    The body of this tag can only contain h:column tags, with the rest of other tags
    being ignored by h:dataTable, with each column containing an unlimited number
    of components.


    # 57: What does the dir attribute of h:dataTable do in JSF?


    Answer:


    This attribute shows the text direction for the text that does not inherit directionality
    and provides valid values such as LTR and RTL.


    # 58: What does the frame attribute of h:dataTable do in JSF?


    Answer:


    This attribute provides specifications for sides of the frame that surround the
    table such as:


    - none

    - b) above

    - c) below

    - d) hsides

    - e) vsides

    - f) lhs

    - g) rhs

    - h) box

    - i) border


    # 59: What does the row attribute of h:dataTable do in JSF?


    Answer:


    This attribute provides the number of rows that are displayed in the table. Starting
    with the row specified with the first attribute; when the value is set to 0 then
    all the rows of the table are displayed.


    # 60: What styles does h:dataTable have in JSF?


    Answer:


    The h:dataTable tag has four attributes that specify CSS classes for the table
    as a whole, individual columns or rows and headers and footers.


    # 61: What does the ui:repeat tag do in JSF?


    Answer:


    The ui:repeat tag may be used instead of the h:dataTable tag.

