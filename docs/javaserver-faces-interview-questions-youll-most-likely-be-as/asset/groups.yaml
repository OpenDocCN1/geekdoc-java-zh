    ## 51: Describe your creativity.


    Answer:


    Try to keep this answer within the professional realm, but if you have an impressive
    background in something creative outside of your employment history, don''t be
    afraid to include it in your answer also. The best answers about creativity will
    relate problem-solving skills, goal-setting, and finding innovative ways to tackle
    a project or make a sale in the workplace. However, passions outside of the office
    are great, too (so long as they don''t cut into your work time or mental space).


