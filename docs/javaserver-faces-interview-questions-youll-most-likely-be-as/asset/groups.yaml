    ## 13：请告诉我一次你为了完成某个项目而额外加班的经历。


    回答：


    让你的雇主看到你对工作充满投入，并且在需要或工作有要求时愿意投入额外的时间，这是非常重要的。然而，在解释为什么被要求加班时要小心——例如，你是否是因为在过程早阶段目标设定得不当而不得不留到晚？或者从更积极的方面来说，你是否是因为客户在短时间内要求提前截止日期而额外加班的？强调你的能力以及以及每次都付出
    110% 努力的意愿。


    ## 14：请告诉我一次你的表现超过了工作职责和要求的经历。


    回答：


    如果你是该职位的绝佳人选，这应该是一个很容易回答的问题——选择一个你真正超越职责范围、付出了额外努力或自愿承担新责任的时刻。保持谦逊，对学习机会表示感谢，并对自己能够再次这种表现充满信心。


    ## 15：你工作的驱动态度是什么？


    回答：


    这个问题有很多种可能的不错答案，面试官主要想看到你对这份工作充满巨大的热情，并且如果你被录用，在职业生涯中将保持保持动力。你成功背后的某些特定驱动力可能包括努力、机会、增长潜力或成功。


    ## 16：你会把工作带回家吗？


    回答：


    首先要明确的是，你需要在需要时总是愿意把工作带回家，但你也想强调这在过去并不是一个问题。突出如时间管理、目标设定和多任务处理等技能，这些技能都能确保工作在公司完成。


    ## 17：请向我描述你典型工作的一天。


    回答：


    你典型的工作日中有几个重要的组成部分，面试官可能会从其中任何或所有部分中得出意义，也可以从你系统地引导他/她度过这一天的能力得出结论。从一天的开始按照时间顺序进行，确保强调生产力、回顾时间、目标设定和优先级排序，以及留出一些额外时间应对可能出现的意外情况。


    ## 18：请告诉我一次你在上一份工作中额外心付出的经历。


    回答：


    在这里最好是使用一个具体的例子，说明那个需要你额外付出的情况，你的具体职位本要求你做的事情你做了，以及你是如何超越这些要求的。使用具体的细节，并务必包括结果，以及对你在过程中学到的东西进行反思。


    ## 19：你是否愿意接受对工作表现的反馈和批评，并根据需要进行调整？


    回答：


    这个问题有一个很明确的答案——肯定的——但你需要展示出对于为什么这重要的认知。接受反馈和批评是一回事，但该过程最重要的部分是随后将其应用到你的日常工作中。保持良好的态度，并表示你总是感激建设性的反馈。


    ## 20：什么能带给你灵感？


    回答：


    你可能在自然中、阅读成功故事或掌握一项艰巨任务中找到灵感，但重要的是你的灵感是基于积极方面的，并且当灵感出现时你能够倾听并调整。保持这个答案泛泛基于职业世界，但在适用情况下，它也可以稍微延伸到你个人生活中的创造性活动，反过来又帮助你实现职业目标。


    ## 21：你如何激励他人？


    回答：


    可能是一个困难的问题，因为通常很难察觉对他人激励的效果。与其提供一个你激励过某人的具体例子，不如专注于你激励他人的方式。


