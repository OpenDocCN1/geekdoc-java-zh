    # JavaServer Faces

    Questions


    Review these typical interview questions and think how you would answer them.
    Read the answers listed; you will find best possible answers along with strategies
    and suggestions.


    # Introduction to JSF


    ## 1: What is JSF and what does it do?


    Answer:


    JSF stands for JavaServer Faces and it is a component based framework used for
    the development of user interface of web applications.


    ## 2: What components can we find in JSF?


    Answer:


    JSF comprises of three parts, they are:


    - a) The prefabricated UI,

    - b) The event driven programming model

    - c) A component model which ensures that third party developers are able to supply
    additional components.


    ## 3: How many versions of JSF are currently on the market and which we are these?


    Answer:


    At the moment JSF has three versions: the first one is the 1.0, second is the
    upgraded 1.2 version and the newer, improved version is 2.0. This version is much
    easier to use and provides new features such as AJAX integration.


    ## 4: What is the advantage of using JSF?


    Answer:


    JSF is mainly used because it is a standard that incorporates multiple implementations.
    It has been designed from the ground up by a standards committee that ensures
    the product is constantly improved and updated.


    ## 5: How can JSF be used for designing web applications?


    Answer:


    JSF is used by both designers and programmers alike by separating and containing
    the application code in Beans and the design in web pages.


    ## 6: What are Beans in JSF?


    Answer:


    A Bean is a class that exposes properties and also events to a framework, with
    the property being a named value of a given type that can be either read or written.


    ## 7: What is a Managed Bean in JSF?


    Answer:


    A Managed Bean is also a Java Bean, but it can be accessed from a JSF page. It
    must also have a name and a scope, making the Bean available for one user across
    multiple pages. More bluntly put, Managed Beans are conduits between the user
    interface and the back end of the application.


    ## 8: What are JSF pages?


    Answer:


    A JSF page is similar to an HTML Form; each browser screen needs one. There are
    some differences though: the page must be properly formatted XHTML and instead
    of head, body and Form the h:head, h:body and h:form tags used.


    ## 9: What services does JSF offer?


    Answer:


    JSF offers a total seven services, they are:


    - a) Model View Controller Architecture,

    - b) Data Conversion,

    - c) Validation and Error handling,

    - d) Custom components,

    - e) Internationalization,

    - f) Alternative Renderers and

    - g) AJAX support.


    ## 10: Which are the six distinct phases defined by a JSF specification?


    Answer:


    - a) Restore view

    - b) Apply request

    - c) Process validation

    - d) Update model

    - e) Invoke application

    - f) Render response


    ## 11: What is the purpose of JSF?


    Answer:


    Beans are similar to objects but serve different purposes. JSF implementation
    creates and destroys.


    ## 12: What is the use of Beans in JSF?


    Answer:


    In JSF context, a Java Bean is used for storing data.


    ## 13: What is the use of Beans in JSF?


    Answer:


    In JSF context, a Java Bean is used for storing data.


    ## 14: What does the JSF implementation do?


    Answer:


    JSF implementation creates and destroys.


    ## 15: What are the properties of a Bean?


    Answer:


    A Bean is a class that exposes properties and also events to a framework, with
    the property being a named value of a given type that can be either read or written.


    ## 16: Which are the attributes that define a Bean?


    Answer:


    The attributes that define a Bean are:


    - a) name

    - b) type

    - c) methods


    ## 17: What is a Backing Bean in JSF?


    Answer:


    A Backing Bean is a Bean that contains components of a form.


    ## 18: What is a Managed Bean in JSF?


    Answer:


    A Managed Bean is a type of Java Bean.


    ## 19: What are CDI Beans?


    Answer:


    CDI (Contexts and Dependency Injection) Beans are Beans that are bound to a context
    that specifies mechanisms for injecting, intercepting, and decorating method calls.


    ## 20: How are CDI Beans used in JSF?


    Answer:


    CDI Beans are used just as managed Beans but they are declared with the @Named
    annotation.


    ## 21: What are Message Bundles in JSF?


    Answer:


    Message Bundles are message strings collected in a central location, simply localized
    and organized by JSF.


    ## 22: What are Bean Scopes in JSF?


    Answer:


    Bean Scopes are containers that hold Beans and other objects that need to be available
    in different components.


    ## 23: How many Scopes can we find in JSF?


    Answer:


    There are 3 types of Scope we can find in JSF, they are:


    - The Session Scope

    - The Request Scope

    - The Application Scope


    JSF 2.0 adds two more scopes:

    - The View Scope

    - The Custom Scope


    ## 24: What does a Session Scope do in JSF?


    Answer:


    A Session Scope keeps track of the HTTP protocol, which is actually a repeated
    connection made by the client. This is mostly achieved using cookies.


    ## 25: What does a Request Scope do in JSF?


    Answer:


    A Request Scope is a short lived session that starts when the HTTP request is
    submitted and ends after a response sent back to the client. It is often used
    when the storage scope is of an issue.


    ## 26: What does an Application Scope do in JSF?


    Answer:


    An Application Scope is a session that maintains itself for the duration of the
    web application. It is shared between all the requests and sessions.


    ## 27: What does a Conversation Scope do in JSF?


    Answer:


    A Conversation Scope ranges over a predetermined set of related pages by providing
    data persistence until a key goal has been reached making the storing of data
    for an entire session unneeded.

