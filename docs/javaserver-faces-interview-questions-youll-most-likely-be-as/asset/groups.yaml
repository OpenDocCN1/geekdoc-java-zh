    # 34: Is it best to create low or high expectations for a customer?


    Answer:


    You may answer this question either way (after, of course), determining that the
    company does not have a clear opinion on the matter. However, no matter which
    way you answer the question, you must display a thorough thought process, and
    very clear reasoning for the option you chose. Offer pros and cons of each, and
    include the ultimate point that tips the scale in favor of your chosen answer.


    # 35: What is the best way for a company to advertise?


    Answer:


    If you''re going for a position in any career other than marketing, this question
    is probably intended to demonstrate your ability to think critically and to provide
    reflective support for your answers. As such, the particular method you choose
    is not so important as why you''ve chosen it. For example, word of mouth advertising
    is important because customers will inherently trust the source, and social media
    advertising is important as it reaches new customers quickly and cheaply.'
  - '[PAGE 100]


    # 36: Is it better to gain a new customer or to keep an old one?


    Answer:


    In almost every case, it is better to keep an old customer, and it''s important
    that you are able to articulate why this is. First, new customers generally cost
    companies more than retaining old ones does, and new customers are more likely
    to switch to a different company. Additionally, keeping old customers is a great
    way to provide a stable backbone for the company, as well as also gain new customers
    as they are likely to recommend your company to friends.


    # 37: What is the best way to win clients from competitors?


    Answer:


    There are many schools of thought on the best way to win clients from competitors,
    and unless you know that your interviewer adheres to a specific thought or practice,
    it''s best to keep this question general. Rather than using absolute language,
    focus on the benefits of one or two strategies and show a clear, critical understanding
    of how these ways can succeed in a practical application.


    # 38: How do you feel about companies monitoring internet usage?'
