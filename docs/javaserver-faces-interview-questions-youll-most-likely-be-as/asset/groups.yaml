    # Answer:


    Action Events are fired by buttons and/or links during the Invoke Application
    phase when the life cycle is almost at the end.


    # 96: What is the use of the f:param tag during event handling?


    # Answer:


    The f:param tag is used to allow attaching of a parameter to a component, with
    the parameter interpreted depending on the type of component to which it is attached.


    # 97: What is the use of the f:attribute tag during event handling?


    # Answer:


    The f:attribute tag is used as another way to pass information from the UI to
    the server, by setting the tag to an attribute or a link or to switch from an
    action to an action listener.


    # 98: What are Phase Events in JSF?


    # Answer:


    Phase Events are events that are fired before and after each life cycle phase,
    that are handled by phase listeners and are attached to the view root.


    # 99: How are Phase Listeners implemented in JSF?


    Answer:


    Phase Listeners are implemented by using the PhaseListener interface from the
    javax.faces.event package and defining three methods:


    - a) PhaseID getPhaseID ();

    - b) void afterPhase (PhaseEvent) and

    - c) void beforePhase (PhaseEvent).


    # 100: How can a Listener class handle an action event?


    Answer:


    A Listener Class must implement the javax.faces.event ActionListener interface.
    It must also include the method known as processAction (ActionEvent ActionEvent),
    which is the method that is invoked when the Action Event occurs.


    # Composite Components


    # 101: What does the Interface Component tag do in JSF?


    Answer:


    The Interface Component tag contains other composite tags that expose a composite
    component''s attributes, action sources, value holders, facets and more.


    # 102: What does the Implementation Component tag do in JSF?


    Answer:


    The Implementation Tag contains the XHTML markup that defines the component and
    inside the Implementation Tag the component author can easily access attributes
    with the expression #{cc.attrs.attributeName}.


    # 103: What does the Attribute Component Tag do in JSF?


    Answer:


    The Attribute Component Tag is used in the interface section of JSF and its sole
    purpose is to expose an attribute of a component to the page authors.


    # 104: What does the valueHolder component tag do in JSF?


    Answer:


    This tag is used in the interface section of JSF and it is used for exposing a
    component that holds value to the page authors.


    # 105: What does the editableValueHolder component tag do in JSF?


    Answer:


    The editableValueHolder tag is used to expose a component that holds an editable
    value to the page authors. It may be accessed in the JSF interface.


    # 106: What does the actionSource Component tag do in JSF?


    Answer:


    This tags purpose is to expose a component that fires action events like buttons
    and links to the page authors.


    # 107: What does Extension Component tag do in JSF?


    Answer:


    The Extension tag is used by the author who wishes to place this tag inside any
    element in the interface. It can also contain an arbitrary XML and is used in
    the JSF interface sub element.


    # 108: What do the renderFacet and insertFacet component tags do in JSF?


    Answer:


    These tags are used to render and insert a facet that is specified by the author,
    as a facet of the enclosing component. They are used in the JSF implementation.


    # 109: What are Facets used for in JSF?


    Answer:


    Facets are used by page authors to add functionality to their components if these
    component users need to supply content in addition to the child components.


    # 110: What are the requirements for a Backing Component in JSF?


    Answer:


    A Backing Component has three requirements:


    - a) To be a subclass of the UIComponent,

    - b) To implement the NamingContainer marker interface and

    - c) To have a family property with a value javax.faces.NamingContainer.


    # 111: How are Composite Components packed in JARs and why?


    Answer:


    Composite Components are placed along with the style sheets, JavaScript and properties
    files under a META-INF directory in JAR. This is mainly used so that other developers
    can use these components.


    # 112: What is the main purpose of using Composite Components in JSF?


    # Answer:


    Composite Components are mostly used to give the JSF developers the ability to
    implement in a more easy to use manner of custom components that encapsulate AJAX.


    # 113: How can AJAX be accessed in JSF?


    # Answer:


    Since JSF 2.0 AJAX is represented as a built in support feature with JavaScript
    libraries and it can be accessed in both views and Java code.


    # 114: How can AJAX use cases be handled from within JSF?


    # Answer:


    AJAX use cases can be handled with the f:ajax tag, which attaches a behavior to
    any components, from the JSF''s core library. Examples include field validations
    or progress indicators.


    # 115: How do AJAX requests differ from other HTTP requests?


    # Answer:


    AJAX requests differ in two ways:


    - a) The first difference is that AJAX partially processes forms on the server
    during the AJAX call.

    - b) The second difference is that it partially renders DOM (Document Object Model)
    elements on the client after AJAX calls return from the server.


    # 116: How can AJAX be defined?


    Answer:


    Since JSF 2.0 AJAX is represented as a built in support feature with JavaScript
