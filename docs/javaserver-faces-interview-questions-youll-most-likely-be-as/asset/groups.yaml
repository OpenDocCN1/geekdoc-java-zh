    # Conversion and Validation


    # 62: What is Request Value in JSF?


    Answer:


    The Request Values represents the process of storing the requested values in component
    objects resulted when a user clicks the submit button and the browser sends the
    value to the server through an HTTP request.


    # 63: What does the f:convertNumber tag do in JSF?


    Answer:


    This tag is one of the standard converters supplied by the JSF implementation
    and it is used by implementing one of the ten attributes it has at its disposal.


    # 64: What happens when Conversion Error occurs in JSF?


    Answer:


    When a Conversion Error occurs, JSF takes two specific actions:


    - a) The component whose conversion failed posts a message and continues to declare
    itself invalid,

    - b) JSF redisplays the current page with values that the user provided.


    # 65: How can an error message be displayed in JSF?


    Answer:


    This can be achieved by adding the h:message tag when converters and validators
    are used, so that error messages are displayed next to the components that have
    reported them.


    # 66: How can JSF converters (besides DateTimeConverter and NumberConverter) be
    used?


    Answer:


    Other converters can be used by making sure that the component that uses the converter
    has its value bound to a backing Bean; Referring to a converter by class using
    the component tag’s converter attributes or by its ID using the converterID attribute.


    # 67: What does the ConvertDateTime tag do in JSF?


    Answer:


    This tag is used to convert the data of a component to a java.util.Date by placing
    it inside the component tag. It has six attributes that allow it to specify the
    type and format of the data.


    # 68: What does the dateStyle attribute do in JSF?|


    Answer:


    This attribute defines the format specified by the java.text.DateFormat of the
    date and it is only applied if type is date and the pattern is not defined.


    # 69: What does the Locale Attribute do in JSF?


    Answer:


    This attribute specifies the locale whose predefined styles for dates and times
    are used for and during formatting and/or parsing.


    # 70: What does the Pattern Attribute do in JSF?


    Answer:


    This attribute is used for custom formatting patterns that determine how the date
    and tie string have to be formatted and parsed. If this attribute is specified,
    then dateStyle and timeStyle attributes are ignored.


    # 71: What does the timeStyle Attribute do in JSF?


    Answer:


    The timeStyle Attribute is used to define the format as specified by java.text.DateFormat
    of a time or time part of a string. It is only applied if type is time and the
    pattern is undefined.


    # 72: What does the Type Attribute do in JSF?


    Answer:


    This attribute specifies if the string value contains a date, time or both. The
    valid values are date, time or both and if no value is specified then date is
    used as default.


    # 73: What does the NumberConverter tag do in JSF?


    Answer:


    This tag is used to convert a components data to java.lang.Number by placing the
    convertNumber tag inside the component tag. It has several attributes used to
    specify the format and type of data.


    # 74: How can a Listener be registered on components in JSF?


    Answer:


    A Listener Class can be implemented on a component by placing a ValueChangeListener
    tag or an ActionListener tag within the component''s page.


    # 75: How can an author reference the backing Bean methods in JSF?


    Answer:


    An Author can call these methods by using the component tags valuechangerListener
    and actionListener attributes.


    # 76: How can a value-changer listener be registered on a component in JSF?


    Answer:


    This can be achieved by having the author register a ValueChangeListener on a
    UIInput component or a component represented by one of the classes of the UIInput.


    # 77: How can an Action Listener be registered on a component in JSF?


    Answer:


    An Author can register an ActionListener on a UICommand component by nesting an
    ActionListener tag in the component’s tag of that particular page.


    # 78: What is the purpose of the DoubleRangeValidator class in JSF?


    Answer:


    This class is used to check if the local value of a component is in a certain
    range, where the value of the component must be in floating point or at least
    convertible to a floating point.


    # 79: What does the LengthValidator class do in JSF?


    Answer:


    This class checks if the length of a component’s local value is within range and
    that the value is a java.lang.String.


    # 80: What does the LongRangeValidator class do in JSF?


    Answer:


    This class makes sure that the local value of a component is in a certain range
    and that the value is any Numeric type or String which can be converted to a Long.


    # 81: How can a Component Value be bound to a property in JSF?


    Answer:


    This can be achieved by specifying the name of the Bean and also the name of the
    property that is using the value attribute, where the name of the Bean in the
    value-binding expression must match the managed Bean name element.


    # 82: How can a Component Instance be bound to a Bean property in JSF?


    Answer:


    A Component Instance can be bound to a Bean property using a value binding expression
    with the binding attribute of the component’s tag. Most of the time, a component
    instance is bound rather than its value to a Bean property.


    # 83: How can a backing Bean method be referenced in JSF?


    Answer:


    This can be done by having a Component Tag that has a set of attributes used for
    referencing Bean methods that can achieve certain functions for the component
    associated with the tag.


    # 84: How many attributes referencing backing Bean methods exist in JSF?


    Answer:


    There are four methods:


    - a) action

    - b) actionListener,

    - c) validator

    - d) valueChangeChangeListener.


    # 85: How is a method that performs navigation referenced in JSF?


    Answer:


    If a page includes a component that causes the application to navigate to another
    page when the component is activated, the tag corresponding to this component
    must include an Action Attribute.


    # 86: How is a method that handles an Action Event referenced in JSF?


    Answer:


    If a component on a certain page generates an action event, where that event is
    handled by a backing Bean method, then it is referred to by the component''s actionListener
    attribute.


    # 87: How is a method that performs validation referenced in JSF?


    Answer:


    If the input of one of the components on a page is validated by a backing Bean
    method, then the referencing is done from the component’s tag using Validation
    Attribute.


    # 88: How is a method that handles a value-change event referenced in JSF?


    Answer:


    If the desire is to have a component on a page generate value-change events and
    it is desired for that event to be handled by a backing Bean method, then it is
    referred to by using the valueChangeListener attribute.


    # 89: How is a Custom Converter applied in JSF?


    Answer:


    A Custom Converter is applied to a component by either nesting a converter tag
    inside the component’s tag or by using the converter’s tag attribute.


    # 90: How is a Custom Validator applied in JSF?


    Answer:


    A Custom Validator is applied to a component by nesting a validator tag or the
    validator’s custom tag inside the component’s tag. A custom tag is used by applying
    the custom tag associated with the component.


    # 91: How can a Custom Component be used in JSF?


    Answer:


    A Custom Component can be used in page by declaring the custom tag library that
    defines the custom tag that renders the custom component.


    # Event Handling


    # 92: How many types of events are supported by JSF?


    Answer:


    JSF supports four kinds of events, they are:


    - a) Value Change Events,

    - b) Action Events,

    - c) Phase Events &

    - d) System Events (since JSF 2.0).


    # 93: How can Event Listeners affect the JSF life cycle?


    Answer:


    Event Listeners can affect the JSF life cycle in one of three ways:


    - a) By letting the cycle proceed normally,

    - b) By calling the render Response Method to skip the rest of the life cycle

    - c) By calling the responseComplete method of the FacesContext class to pass
    by the rest of the life cycle entirely.


    # 94: What do Value Change events do in JSF?


    Answer:


    Value Change events are summoned to dependent components in sync, by firing input
    components after their value has been validated.


    # 95: How are Action Events activated in JSF?

