    回答：


    该属性用于触发 AJAX 请求。事件名称通常不带 on 前缀。


    # 121: f:ajax 标签的 Execute 属性在 JSF 中的作用是什么？


    回答：


    该属性启用 JSF 在服务器上执行的组件列表。如果未指定 execute 属性，默认使用 `@this`。


    # 122: f:ajax 标签的 Onevent 属性在 JSF 中的作用是什么？


    回答：


    这是一个 JSF 为 AJAX 事件（begin 和 success）调用的 JavaScript 函数。


    # 123: f:ajax 标签的 Listener 属性在 JSF 中的作用是什么？


    回答：


    JSF 在生命周期的调用应用程序阶段调用每次 AJAX 调用，该阶段位于循环执行部分的结束处。


    # 124: f:ajax 标签的 Render 属性在 JSF 中的作用是什么？


    回答：


    该属性用于生成 JSF 在客户端渲染的组件空格分隔列表。如果未指定 render 属性，则设置为 `@none`，JSF 在 AJAX 请求完成后将不会渲染任何组件。


    # 125: JSF 中的事件是如何命名的？


    回答：


    JSF 去掉事件开头的 `on`，例如 JavaScript 的 `onblur` 事件变为 `blur`，或者 `onkeyup` 变为 `keyup`，依此类推。


    # 126: Complete Data Object 属性在 JSF 中的作用是什么？


    回答：


    当成功调用时，JSF 使用 Data Object 属性在渲染阶段之前执行生命周期部分。


    # 127: responseXML 属性在 JSF 中的作用是什么？


    回答：


    该属性用于查找 AJAX 请求的响应。该对象在实际 AJAX 请求的 begin 阶段是未定义的。


    # 128: responseText 属性在 JSF 中的作用是什么？


    回答：


    该方法用于将 XML 响应作为文本获取。该对象在 AJAX 请求的 begin 阶段始终是未定义的。


