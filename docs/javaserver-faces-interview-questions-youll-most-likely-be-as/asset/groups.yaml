    # 120: What does the Event Attribute of the f:ajax tag do in JSF?


    Answer:


    This attribute is used to trigger the AJAX request. Event names are generally
    JavaScript names without the on prefix.


    # 121: What does the Execute Attribute of the f:ajax tag do in JSF?


    Answer:


    This attribute enables a list of components that JSF executes on the server. If
    the execute attribute is not specified then the @this keyword is used by default.


    # 122: What does the Onevent Attribute of the f:ajax tag do in JSF?


    Answer:


    This is a JavaScript function that JSF calls for AJAX events (begin and success).


    # 123: What does the Listener Attribute of the f:ajax tag do in JSF?


    Answer:


    JSF invokes this method once every AJAX call in the Invoke Application phase of
    the life cycle, which is at the end of the execute portion of the cycle.


    # 124: What does the Render Attribute of the f:ajax tag do in JSF?


    Answer:


    This attribute is used to generate a space separated list of component that JSF
    renders on the client. If the render attribute is not specified the default is
    set to @none and JSF will not render any components after the AJAX request completes.


    # 125: How are Events named in JSF?


    Answer:


