    ## 164: What does the void restoreState(FacesContext context, Object state) method
    do in JSF?


    Answer:


    This method restores the state of this object from the given state object which
    is a copy of an object that has been previously obtained from calling saveState.


    ## 165: How is AJAX functionality added to custom components?


    Answer:


    This process can be achieved in two ways:


    - a) By embedding AJAX into a custom component or

    - b) By AJAX-enabling custom components to support the f:ajax tag.


    ## 166: What is a Tag Handler and what does it do in JSF?


    Answer:


    A Tag Handler is used to process tag attributes and their values. It uses special
    rules if the attribute is a special value, or, if there is a property setter for
    the attribute used to call it.


    ## 167: What does the String getRemoteUser() method do in JSF?


    Answer:


    This method is used to get the name of the user that is logged in at the moment
    of query and it is returned as NULL if no such user exists.


    ## 168: What does the Boolean isUserInRole(String role) method do in JSF?


    Answer:


    This method is mainly used to test if the current user belongs to any of the given
    role and it is part of javax.servlet.HttpServletRequest string.


    ## 169: How are files uploaded in JSF?


    Answer:


    Because JSF does not directly support file encoding, the author needs to install
    a server filter that intercepts the uploaded files and turns them into request
    attributes or all other Form data into request parameters.


    ## 170: How many attributes does the Upload Component support in JSF?


    Answer:


    The Upload Component supports two attributes in JSF and they are value and target.


    The value attribute is used to denote a value expression into which the file contents
    are stored.


    The target attribute is used to specify the target location of the file.


    ## 171: What does the Decode Method of the upload component do in JSF?


    Answer:


    This method retrieves file items that the servlet filter places into request attributes
    and disposes them as directed by the tag attributes.


    ## 172: How is an Image Map shown in JSF?


    Answer:


    The author needs to implement a Client Side Image Map that is supplied by the
    usemap attribute, where the author specifies the map in HTML in the JSF page.


    ## 173: How is Binary Data produced in JSF?


    Answer:


    Because it is difficult to have JSF dynamically produce Binary Data such as an
    image or PDF file, the author needs to provide a JSF tag that gathers customization
    data that is then sent to a servlet.


    ## 174: How can binary data be generated in JSF without the use of a servlet?


    Answer:


    This can be achieved by having the author pay attention to the timing of servlet
    output stream grabbing before the JSF implementation begins writing the response.


    ## 175: When does the Filter Action take place in JSF?


    Answer:


    The Filter Action can only take place when view IDs that start with /binary are
    present and just as servlet solutions, the filter action needs to have a data
    transfer object included as a GET parameter.


    ## 176: What is a Pager in JSF?


    Answer:


    A Pager is a standard user interface used to navigate a large table, a set of
    links to another page of the table, to the next and previous pages and more.


    ## 177: What does the Encode Method do in JSF?


    Answer:


    The Encode Method is used to generate sets of links; similar to the commandLink
    method. Clicking the links goes to activate JavaScript code that then sets a value
    in hidden field. and lastly submits the Form.


    ## 178: How is pop-up window generated in JSF?


    Answer:


    To generate pop-up windows the author needs to use JavaScript calls that makes
    sure the window is displayed when the user clicks a button or a link. The author
    also has to attach a function to the onclick handler of the button or the link
    and also to set the function return FALSE so that the browser does not submit
    the Form or follow the link.


    ## 179: What does the doPopup function do in JSF?


    Answer:


    The doPopup function contains the JavaScript instructions for popping up the window
    and it is contained in a script tag that is inside the page header.


    ## 180: How can parts of a page be shown or hidden in JSF?


    Answer:


    This process can be achieved using JSTL c:if and c:choose construct methods; if
    the author does not wish to mix JSF and JSTL tags, JSF can be used to achieve
    the same effect by using the render property.


    ## 181: What is the getErrorMessage method used in JSF?


    Answer:


    This method is used to format an error message that is to be included in the client
    side JavaScript code with the error code constructed from the message and the
    arg attributes.


    ## 182: What does the findValidators method do in JSF?


    Answer:


    This method is part of the validatorScript component and is used to scan the component
