    # 26: What does an Application Scope do in JSF?


    Answer:


    An Application Scope is a session that maintains itself for the duration of the
    web application. It is shared between all the requests and sessions.


    # 27: What does a Conversation Scope do in JSF?


    Answer:


    A Conversation Scope ranges over a predetermined set of related pages by providing
    data persistence until a key goal has been reached making the storing of data
    for an entire session unneeded.'
