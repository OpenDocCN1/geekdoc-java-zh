    ## 193: How can you turn on validation of XML files?


    Answer:


    In case the JSF application contains one or more xml configuration resource files,
    you can turn on the JSF validation for this xml files by setting the validateXML
    flag to TRUE. The default value for this flag is FALSE.


    ## 194: Which are the required JAR files needed by the JSF application in order
    to run properly?


