    # 117: How is JSF life cycle split?


    Answer:


    As JSF 2.0 AJAX is represented as a built in support feature with JavaScript libraries
    and it can be accessed in both views and Java code, the life cycle is split into
    2 parts:


    - a) Execute (which is when AJAX are executed)

    - b) Render (which are rendered).


    # 118: What happens when JSF executes components?


    Answer:


    When JSF 2.0 AJAX is represented as a built in support feature with JavaScript
    libraries and it can be accessed in both views and Java code, three steps take
    place:


    - a) JSF converts and validates the value,

    - b) Then pushes input values to the model

    - c) Executes actions and listeners.


