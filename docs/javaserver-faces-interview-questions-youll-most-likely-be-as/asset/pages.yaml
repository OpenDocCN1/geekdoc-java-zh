  md: '# 20: How are CDI Beans used in JSF?


    Answer:


    CDI Beans are used just as managed Beans are but they are declared with the @Named
    annotation.


    # 21: What are Message Bundles in JSF?


    Answer:


    Message Bundles are message strings collected in a central location, simply localized
    and organized by JSF.


    # 22: What are Bean Scopes in JSF?


    Answer:


    Bean Scopes are containers that hold Beans and other objects that need to be available
    in different components.


    # 23: How many Scopes can we find in JSF?


    Answer:


    There are 3 types of Scope that we can find in JSF, they are:


    +   a) The Session Scope,

    b) The Request Scope and

    c) The Application Scope.

    JSF 2.0 adds two more scopes:

    d) The View Scope and

    e) The Custom Scope.'
