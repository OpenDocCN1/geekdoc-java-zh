  md: '# 11: What is the purpose of a Bean in JSF?


    Answer:


    Beans are similar to objects but serve different purposes. When an object is created
    and manipulated inside a Java program, the Bean calls constructors and invokes
    methods


    # 12: What is the use of a Java Bean?


    Answer:


    A Java Bean is used mainly as a user interface builder and it is accessed by a
    palette window in the builder tool.


    # 13: What is the use of a Java Bean in the JSF context?


    Answer:


    In the JSF context, a Java Bean is used for storing the state of web pages. Thus
    Bean creation is under the control of JSF implementation.


    # 14: What does the JSF implementation process do?


    Answer:


    The JSF implementation creates and discards Beans when needed, reads Bean properties
    and sets the Bean properties when a Form is posted.


    # 15: What are the properties of a Bean class?


    Answer:


    A Bean class needs to follow a specific set of programming'
