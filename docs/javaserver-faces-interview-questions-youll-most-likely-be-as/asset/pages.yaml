  md: 'Facelets Tags are used in JSF to include content from other XHTML pages, to
    build pages from templates, to create custom components without the need for writing
    Java code and for miscellaneous utilities.


    # 52: What does the ui:composition Facelet Tag do in JSF?


    Answer: The ui:composition tag is(when used without a template attribute) a sequence
    of elements which can be inserted somewhere else. When used with a template attribute,
    it simply allows for a template to be loaded and the children of this tag determine
    the variable parts of the template.


    # 53: What does the ui:decoration Facelet tag do in JSF?


    Answer: This tag specifies a page where parts can be inserted, if used without
    a template attribute. If a template attribute is used, the children of this tag
    determine the variable parts of the template.


    # 54: What does the ui:debug Facelet tag do in JSF?


    Answer: This tag allows for users to display a debug window, with keyboard shortcuts,
    that shows the component hierarchy for the currently used page and the scoped
    variables of the application.'
