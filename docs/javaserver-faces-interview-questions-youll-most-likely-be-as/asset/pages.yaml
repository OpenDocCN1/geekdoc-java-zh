  md: '# 1: What is JSF and what does it do?


    Answer:


    JSF stands for JavaServer Faces and it is a component based framework used for
    the development of user interface of web applications.


    # 2: What components can we find in JSF?


    Answer:


    JSF comprises of three parts, they are:


    +   - a) The prefabricated UI,

    - b) The event driven programming model

    - c) A component model which ensures that third party developers are able to supply
    additional components.


    # 3: How many versions of JSF are currently on the market and which we are these?


    Answer:


    At the moment JSF has three versions: the first one is the 1.0, second is the
    upgraded 1.2 version and the newer, improved version is 2.0. This version is much
    easier to use and provides new features such as AJAX integration.


    # 4: What is the advantage of using JSF?


    Answer:


    JSF is mainly used because it is a standard that incorp-'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'JavaServer Faces Interview Questions You''ll Most Likely Be Asked 9


    orates multiple implementations. It has been designed from the ground up by a
    standards committee that ensures the product is constantly improved and updated.


    # 5: How can JSF be used for designing web applications?


    Answer:


    JSF is used by both designers and programmers alike by separating and containing
    the application code in Beans and the design in web pages.


    # 6: What are Beans in JSF?


    Answer:


    A Bean is a class that exposes properties and also events to a framework, with
    the property being a named value of a given type that can be either read or written.


    # 7: What is a Managed Bean in JSF?


    Answer:


    A Managed Bean is also a Java Bean, but it can be accessed from a JSF page. It
    must also have a name and a scope, making the Bean available for one user across
    multiple pages. More bluntly put, Managed Beans are conduits between the user
    interface and the back end of the application.


    # 8: What are JSF pages?'
