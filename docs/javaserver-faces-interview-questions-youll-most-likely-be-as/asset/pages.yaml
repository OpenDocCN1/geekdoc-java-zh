    Answer:


    The most important features of a Bean are the exposed properties, where properties
    are any of the attributes that the Bean has.


    # 17: Which are the main attributes that define a Bean?


    Answer:


    The attributes that define a Bean are:


    +   a) a name,

    b) a type and

    c) the methods for setting a value.


    # 18: What is a Backing Bean in JSF?


    Answer:


    A Backing Bean is a Bean that contains the component objects of a web Form.


    # 19: What are CDI Beans?


    Answer:


    CDI (Contexts and Dependency Injection) Beans are Beans that are bound to a context
    by the CDI that specifies mechanisms for injecting, intercepting and decorating
    method calls.'
