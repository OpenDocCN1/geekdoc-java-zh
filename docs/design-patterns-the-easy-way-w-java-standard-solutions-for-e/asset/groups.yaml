  mdcn: "\n\n# 学习面向对象的最简单方法\n\n我们还包含了一份关于学习面向对象编程的补充指南——这是当今最流行的编程类型之一。\n\n为了方便运行代码，请选择一个你中意的\
    \ IDE（集成开发环境：本质上就是你编写和运行代码的地方）。你也可以使用在线 IDE，例如 rextester.com、ideone.com 或 codpad.org。\n\
    \n```\n======================================\n```\n\n## 1) 对象面向编程\n\n在编程的世界里，你会经常听到这个术语。\n\
    \n这是因为面向对象编程（简称 OOP）是目前世界上使用最广泛的编程风格之一。\n\n你还记得第 1 部分中“类（Classes）”的概念吗？你当时使用这种复合数据形式将较小的数据组合成一个较大的整体。\n\
    \n面向对象编程的核心点在于：\n\n在面向对象编程中，你创建了你所设计的那些类的“副本”。更简单地说，类是一个充当“蓝图”的数据结构。而你根据这些类“蓝图”创建的那些“生成的副本”，就称为**对象（Objects）**。\n\
    \n为什么要这样做呢？因为随着你对编程的越来越深入，你会遇到“抽象（Abstraction）”的概念——将一个通用的思想应用于多次、多个场景——最终从而节省时间、避免困惑并精力。\n\
    \n反复编写相同的复合数据会导致更多的精力消耗和挫败感，而重用同一个思想则会导致效率和一致性。\n\n## 2) OOP 术语\n\n变量和函数在 OOP\
    \ 中可以承担新的角色。它们分别可以被称为**字段（Fields）**和**方法（Methods）**。在某些情况下，完全取决于你是否使用你喜欢的名称，只要你理解其他程序员在使用这些术语时的意思即可。\n\
    \n字段代表 OOP 中的变量，因为就像任何输入表单中的字段一样，数据对象可以拥有你可以想象的任何不同值的字段。\n\n将字段视为对象的某种特定属性。每个对象可能具有彼此不同的属性：\n\
    \n```\nclass Cat{\n  String color;\n}\n\n// 这些猫是基于 Cat 类的对象：\ncatA.color = \"\
    white\"\ncatB.color = \"grey\"\ncatC.color = \"orange\"\n```\n\n方法代表对象拥有的函数。将方法视为对象执行的“动作”和“行为”。\n\
    \n在 **OOP** 中，你可以在类内部定义方法，但你需要从对象本身来访问该方法。\n\n例如，如果我们根据某个 Cat 类创建了几个 Cat 对象，每个\
    \ Cat 对象都将拥有 Cat 类上定义的所有方法：\n\n```\nclass Cat{\n    void meow() {}\n}\n\n// 这些猫是基于\
    \ Cat 类的对象：\ncatA.meow()\ncatB.meow()\ncatC.meow()\n```\n\n## 3) 构造方法\n\n构造方法是特殊的类方法。它们根据所属的类，为你创建对象。\n\
    \n要根据特定类创建数据对象，请遵循以下语法：\n\n(变量名) = new <类名>();\n\n你本质上是将某些变量设置为数据对象。\n\n示例：\n\n\
    ```\nclass House {\n    // 在此处插入代码\n}\nh = new House();\n```\n\n要调用类对象，只需引用它所属的变量：\n\
    \n示例：\n\n```\nHouse h = new House();\nij = h;\n```\n\n# 克服任何编程障碍！\n\n> “ 它针对如此复杂的主题，并以简单、生动且幽默的方式呈现。”\n\
    - William Connor，来自 Amazon.com\n\n> “ 内容异常完整且充满了数据。”\n- Freya Jab，来自 Amazon.com\n\
    \n> “ 作者用易于理解的方法解释了主题。”\n- Ador，来自 Amazon.com\n\n# 你准备好将你的编程提升到新的层次了吗？\n\n警告：\n\
    这些页面中包含了特殊的编程解决方案，可以帮助你解决会遇到的许多常见编程问题。\n\n数十名熟练程序员的集体编程经验，经过数年的开发，现在通过这本书就能为你提供。\n\
    \n这本书也采用 Java 编写——Java 是当今世界上最流行的编程语言。\n\n最棒的是，学习这些信息你不需要花费数百美元。\n\n+ 主题包括：\n\
