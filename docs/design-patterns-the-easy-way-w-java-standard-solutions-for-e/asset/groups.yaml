  mdcn: "\n3) 在子类中实现你策略算法的变体。\n\n4) 任何访问你策略算法的操作都通过抽象形式进行。通过多态，根据情况选择并执行最佳策略变体。\n\n\
    总体来说，这里是描述策略模式的 UML 图：\n\n![](img/b45495ee91388ef419519d722f088b6f_89_0.png)\n\
    \n# JAVA-5a: Java 中的策略模式\n\n以下是策略模式在 Java 中的外观：\n\n```java\n/*\n// 抽象策略实现：\n//\
    \ 它包含：\n// - 抽象算法的签名\n*/\ninterface AbstractStrategy {\n    // 输入：（由你选择）\n   \
    \ // 输出：（由你选择）\n    // （效果取决于子类层级）\n    public void Algorithm();\n}\n```\n\n```java\n\
    /*\n// 每个策略对应的类：\n// 根据抽象策略使用任意数量的需要类\n// 每个类都可以：\n// - 实现抽象算法\n// （基于每个类独特的策略）\n\
    */\nclass Strategy1 implements AbstractStrategy{\n    // 抽象算法，\n    // 作为 Strategy1：\n\
    \    public void Algorithm() {\n        // 根据此 Strategy1 类 \n        // 实现此算法\n\
    \    }\n}\n\nclass Strategy2 implements AbstractStrategy{\n    // 抽象算法，\n    //\
    \ 作为 Strategy2：\n    public void Algorithm() {\n        // 根据此 Strategy2 类 \n\
    \        // 实现此算法\n    }\n}\n```\n\n# JAVA-5b: 应用策略模式\n\n使用你任选的 IDE 运行以下代码。在线\
    \ IDE（如 codechef.com、retester.com、ideone.com 或 codpad.org）都是很棒的选择。\n\n======================================\n\
    \n在本章中，我们有机会在特定场景下应用策略模式。\n\n让我们来玩石头剪刀布游戏。为了获胜，我们总是要能够在石头、纸和剪刀之间做出正确的选择。\n\n游戏的实例通常基于一个类，设计如下：\n\
    \n```java\n/*\n// 石头剪刀布游戏包含：\n// - 石头、纸、剪刀的字符串值\n// 它可以：\n// - 从三个中生成一个随机字符串\n\
    // - 检查玩家是否获胜\n*/\n```\n\n```java\nclass RPSGame {\n    String[] RPSVals = {\"\
    Rock\", \"Paper\", \"Scissor\"};\n\n    /*\n    // 输入：无\n    // 输出：一个字符串\n   \
    \ // 效果：随机返回石头、纸或剪刀\n    */\n    String RPSGet() {\n        Random rn = new Random();\n\
    \        int i = rn.nextInt(3);\n        return RPSVals[i];\n    }\n\n    /*\n\
    \    // 输入：两个字符串\n    // 输出：一个布尔值\n    // 效果：如果第一个字符串击胜第二个字符串，则返回 true，\n    //\
    \     否则返回 false\n    */\n    boolean checkWin(String s1, String s2) {\n  if (s1\
    \ == s2) return false;\n  boolean c1 = (s1 == \"Paper\") && (s2 == \"Rock\");\n\
    \  boolean c2 = (s1 == \"Scissors\") && (s2 == \"Paper\");\n  boolean c3 = (s1\
    \ == \"Rock\") && (s2 == \"Scissors\");\n  return c1 || c2 || c3;\n}\n} \n```\n\
    \n接下来，是进入 `Main()` 方法并执行的代码：\n\n```java\nRPSGame r = new RPSGame();\nString aiPick\
    \ = r.RPSGet();\n\n// 为变量 myPick 输入 \"Paper\"、\"Scissors\" 或 \"Rock\"\n// （通常情况下，玩家会为之\n\
    // 输入一个值）\n// 现在，默认选择为 Paper\nString myPick = \"Paper\";\n\nSystem.out.println(\"\
    AI Pick: \" + aiPick);\nSystem.out.println(\"My Pick: \" + myPick);\n\nSystem.out.println(myPick\
    \ + \" v.s. \" + aiPick);\nif (r.checkWin(myPick, aiPick)) {\n  System.out.println(\"\
    你赢了!\");\n}\n```\n\n运行时，整个代码模拟了一场石头剪刀布游戏。你必须在石头、纸或剪刀之间做出选择。之后，程序将为对手生成一个选择，然后检查你是否获胜。\n\
    \n幸运的是，你可以修改这段代码来**始终**拥有获胜的选择。因此，你总是会赢。这需要一个在我们当前所处情况下给出最佳结果的过程。\n\n这需要策略模式。\n\
    \n# 应用策略模式：\n\n回想一下之前提到的实现策略模式的逐步计划。\n\n- 1) 确定你的流程在何时需要根据情况发生变化。\n\n在我们的石头剪刀布代码中，我们希望代码始终选择最佳选项（取决于人类玩家选择了什么）。\n\
    \n这个事件发生在玩家做出选择之后。\n\n因此，代码将始终选择击败玩家的选项。\n\n所以：\n\n玩家选石头 -> 代码选纸\n\n玩家选纸 -> 代码选剪刀\n\
    \n玩家选剪刀 -> 代码选石头\n\n# 2) 创建你策略算法的抽象形式。\n\n回想一下抽象策略类的接口。在 Java 中，这种抽象化可以使用接口来实现：\n\
    \n```java\n/*\n// 抽象策略实现：\n// 它包含：\n// - 抽象算法的签名\n*/\ninterface AbstractStrategy\
    \ {\n    // 输入：（由你选择）\n    // 输出：（由你选择）\n    // （效果取决于子类层级）\n    public void Algorithm();\n\
    }\n```\n"
