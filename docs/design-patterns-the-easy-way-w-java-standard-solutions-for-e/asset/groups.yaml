    \ 和此 module 的位置相同，\n// 将 alert 设置为 true 并更新通知。\n// 之后，发送警报\npublic void update(Terrorist\
    \ t) { };\n```\n\n你还需要对任何具有此方法的相应更新。你需要修改 Observer 接口以包含相同的输入……以及 Terrorist 类中的通知方法。该方法的目的是根据类数据通知其观察者。对于这个方法，你把类本身作为输入。\n\
    \n```java\ninterface Observer {\n    public void update(Terrorist t);\n}\n```\n\
    \n```java\nclass Terrorist implements Subject{\n    public void notifyObservers()\
    \ {\n        // 逻辑已在上文实现\n    }\n}\n```\n\n之后，我们让 `update()` 方法工作起来。\n\n# 第 5\
    \ ：实现 update()\n\n根据上面的信息，我们在 Module 类中实现 `update()` 方法的功能代码。\n\n```java\n// 输入：一个\
    \ Terrorist 对象\n// 输出：无\n// 效果：如果 Terrorist 和此 module 的位置相同，\n// 将 alert 设置为 true\
    \ 并更新通知。\n// 之后，发送警报\npublic void update(Terrorist t) {\n    if (this.location\
    \ == t.location) {\n        this.alert = true;\n        this.notifications = \"\
    Terrorist Nearby\";\n    }\n    else {\n        this.alert = false;\n        this.notifications\
    \ = \"\";\n    }\n\n    sendAlerts();\n}\n```\n\n# 运行代码\n\n根据现有的代码，我们将两个场景。两种情况下，观察类都会根据它们观察的内容发出警报。\n\
    \n一种情况是观察者远多于主体：（将以下代码粘贴到你的 Main() 方法下方）\n\n```java\n// 部分 1：创建所有数据对象\nTerrorist\
