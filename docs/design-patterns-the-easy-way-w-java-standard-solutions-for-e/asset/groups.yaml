    \    }\n    public void deleteObs(Observer o) {\n        obs.remove(o);\n    }\n\
    }\n```\n\n# 第 4：修改我们的观察者类以充当观察者\n\nModule 数据类将作为 Observer。因此，它将实现 Observer 接口及其方法。\n\
