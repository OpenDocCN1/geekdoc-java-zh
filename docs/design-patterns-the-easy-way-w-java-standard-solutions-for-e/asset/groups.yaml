    \n# JAVA Introduction\n\n```\n======================================\n```\n\n\
    Java is perhaps one of the most popular programming languages out there right\
    \ now. There are countless Java frameworks online, many more Java libraries, and\
    \ a seemingly endless amount of Java projects. Android - one of the most popular\
    \ mobile operating systems in use today - is largely based on Java code.\n\nAs\
    \ a programmer, you will encounter many situations that require a specific set\
    \ of solutions. Often times, you'll keep encountering the same situation on other\
    \ projects - then realize that you feel as if you've been repeating the same solution\
    \ and code over and over again.\n\nFor example, let's say one web app you are\
    \ building requires a data object to always update itself depending on weather\
    \ changes. Let's say you have another app project where data objects require constant\
    \ updates depending on certain sports teams' season games. Do you see a pattern?\n\
    \nAt some point, you'll notice the patterns: a certain situation will usually\
    \ require a certain programming solution. These solutions happen to be certain\
    \ patterns in code (no matter the language) that apply to certain situations you\
    \ encounter.\n\nThus, Design Patterns are created.\n\nWhat's important to know\
    \ is how to promptly and effortlessly implement these patterns - and this book\
    \ will show you how. Even if you're just starting out in Java programming, you'll\
    \ find great use of all the techniques you'll find here.\n\n# JAVA Workshops:\n\
    \nThroughout the book, you'll encounter workshops that will help you apply the\
    \ various design patterns by putting them to good use. As you do them, think about\
    \ the situations that require them to be used.\n\nThen, throughout your own coding\
    \ projects, think carefully about your designs and ask yourself which situations\
    \ would have a certain design pattern come in handy.\n\nWe’ve designed this book\
    \ to be very hands-on - giving you plenty of chances to use the material.\n\n\
    This is surely NOT a spectator’s book. If you would like to apply a new set of\
    \ programming designs, then read on.\n\n```\n====================================\
    \ =====\n```\n\n# JAVA-oo: A Quick Important note about Java code\n\n# A Java\
    \ Class File\n\nBefore we get started, be sure to familiarize yourself with the\
    \ structure of a Java class file, shown below between the dashed lines.\n\n```\n\
    // --------------------------\nimport java.util.*;\nimport java.lang.*;\nimport\
    \ java.io.*;\n\nclass Main{\n    public static void main(String args[]) {\n  \
    \      // CODE HERE\n    }\n}\n// --------------------------\n```\n\n# Chapter\
    \ 1: The Factory Pattern\n\n==== ==== ==== ====\n\nAre you not sure about which\
    \ data object to create at a given time?\n\nWhen creating a data object, are there\
    \ a lot of complex aspects to keep in mind?\n\nThen you need to use the Factory\
    \ Method.\n\n# How it essentially works:\n\nDepending on the programming language\
    \ you use, you create a class interface that standardizes the data object creation.\
    \ However, you would use subclasses (which extend or implement your higher “factory”\
    \ interface) to actually create the data objects. The subclasses allow for a whole\
    \ range of flexibility in creating data objects. If your programming language\
    \ doesn’t have interfaces or abstract classes, simply create your ‘factory’ interface\
    \ as a class, then have subclasses extend it.\n\nFor example, consider having\
    \ to make a wide range of sports ball data objects, such as basketballs, soccer\
    \ balls, footballs, volleyballs, etc.. You wouldn’t know what to create at a particular\
    \ time. So how would you code this? Create an interface that outlines object construction\
    \ for balls.\n"
