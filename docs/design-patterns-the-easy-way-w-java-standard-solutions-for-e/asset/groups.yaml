    now. There are countless Java frameworks online, many more Java libraries, and
    a seemingly endless amount of Java projects. Android - one of the most popular
    mobile operating systems in use today - is largely based on Java code.


    As a programmer, you will encounter many situations that require a specific set
    of solutions. Often times, you''ll keep encountering the same situation on other
    projects - then realize that you feel as if you''ve been repeating the same solution
    and code over and over again.


    For example, let''s say one web app you are building requires a data object to
    always update itself depending on weather changes. Let''s say you have another
    app project where data objects require constant updates depending on certain sports
    teams'' season games. Do you see a pattern?'
