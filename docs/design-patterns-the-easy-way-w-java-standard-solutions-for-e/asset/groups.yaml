  mdcn: "\n让我们将其命名为接口 `BallMaker`。然后，对于我们拥有的每种球，创建一个扩展 `BallMaker` 的子类。这些子类是实际创建球数据对象的类——但它们每一个都有自己的规范。因此，`BasketBallMaker`\
    \ 子类将制造篮球，而 `FootballMaker` 子类将制造足球。\n\n以下是 UML 图的的样式：\n\n![](img/b45495ee91388ef419519d722f088b6f_12_0.png)\n\
    \n该模式的伪代码实现也包含在归档中。如果你需要在另一种语言中实现此模式，这些伪代码将为你提供帮助。\n\n接下来，我们将使用工厂设计模式（Factory\
    \ Pattern）。\n\n## JAVA-1a：Java 中的工厂模式\n\n==== ==== ==== =====\n\n以下是工厂模式在 Java\
    \ 中的外观：\n\n```java\n// Factory 由任何需要使用它的子类实现\ninterface Factory {\n    // 输入：你的选择\n\
    \    // 输出：你的选择（默认设置为 Void）\n    // 实现此接口的类的构造函数\n    interface\n    public void\
    \ createObject();\n}\n```\n\n```java\n// SubFactory1:\n// 根据 Factory 接口创建不同的对象\n\
    class SubFactory1 implements Factory {\n    // 这实现了接口中概述的相同函数\n    interface\n\
    \    public void createObject() {\n        // 为此创建者包含任何独特的之处\n        class\n\
    \        // 此处任何其他代码\n    }\n}\n```\n\n```java\n// SubFactory2:\n// 根据 Factory\
    \ 接口创建不同的对象\nclass SubFactory2 implements Factory {\n\n    // 这实现了接口中概述的相同函数\n\
    \    public void createObject() {\n        // 为此创建类包含任何独特的之处\n        // 此处任何其他代码\n\
    \    }\n}\n```\n\n在下一章节中，我们将对实现此设计模式进行演示。\n\n## JAVA-1b：实现工厂模式\n\n使用你喜欢的 IDE 运行以下代码。在线\
    \ IDE，如 codechef.com、retextester.com、ideone.com 或 codpad.org 都是很好的选择。\n\n======================\n\
    \n现在我们将看到工厂模式的运行。你将通过一个示例亲身体验如何使用这种设计模式，以及一个你将继续完善该示例的工作坊。\n\n### 运动球类创建器\n\n\
    想象你必须为一个按需定制的 Web 应用程序编写代码。它专门创建许多不同类型的运动球。\n\n一个通用的球类样式如下：\n\n```java\n/* 一个运动球具有：\n\
    // - 它的球类型\n// - 用于制造它的材料数组\n// - 它的尺寸，作为半径（英寸）\n// - 任何额外的注释 */\n```\n\n```java\n\
    // - 制造它的公司品牌\n// - 产品名称\n/*\nclass SportsBall {\n    String type;\n    String[]\
    \ materialsUsed;\n    float radius;\n    String comments;\n    String make;\n\
    \    String modelName;\n}\n```\n\n然而，正如你所看到的，在为运动球创建数据对象时涉及了太多细节。因此，如果你必须创建一个，比如，特定的篮球，这个过程与创建一个足球相比将大得多。它们具有不同的类型、材料和尺寸。它们还可能由不同的品牌制造，并且具有不同的特征。\n\
    \n那么，我们如何能以更简单的方式创建运动球呢？涉及的代码更少呢？\n\n你猜对了。工厂模式！\n\n所以在这个教程章节中，让我们完成设置该设计模式的步骤。\n\
    \n然后，你将有机会通过扩展工作来练习你所学的内容。\n\n### 第 1 ：工厂接口\n\n首先，我们将创建一个所有球类工厂类都将实现的接口。\n\n目前，它将只有一个方法：创建并返回运动球的实例。\n\
    \n```java\n// BallFactory 接口：\n// - 如何创建球的接口\ninterface BallFactory {\n/*\n//\
    \ 输入：无\n// 输出：一个 SportsBall 对象\n// 效果：创建一个 SportsBall；\n// 实现此接口的类在制造时将有独特之处\n\
    */\n    public SportsBall createBall();\n}\n```\n\n### 第 2 ：第一个工厂类\n\n接下来，我们创建一个实现我们定义的\
    \ BallFactory 接口的独特工厂类。目前，它做的只是创建篮球。这些可能是 SportsBall 对象的实例，但它们将具有篮球的特定特征。\n\n\
    ```java\n// 篮球制造器：\n// 创建具有不同字段的篮球对象\nclass BasketballMaker implements BallFactory\
    \ {\n\n    // (方法实现了接口版本)\n// 效果：创建一个篮球作为运动球\n    public SportsBall createBall()\
    \ {\n    SportsBall b = new SportsBall();\n    b.type = \"Basketball\";\n    b.materialsUsed[0]\
    \ = new String[3];\n    b.materialsUsed[1] = \"fiber\";\n    b.materialsUsed[2]\
    \ = \"synthetic composite\";\n    b.radius = 4.8;\n    b.make = \"Spalding\";\n\
    \    b.modelName = \"Series Basketball\";\n    return b;\n}\n}\n```\n\n### 第 3\
    \ ：设计你需要的任何额外工厂类\n\n之后，我们根据需要创建尽可能多的工厂类。它们都实现了 BallFactory 接口，并且它们都创建具有独特特征和属性的运动球。\n\
    \n让我们通过设计一个创建棒球的工厂类来实现。\n\n```java\n// 棒球制造器：\n// - 创建具有不同字段的棒球\nclass BaseballMaker\
    \ implements BallFactory {\n\n// (方法实现了接口版本)\n// 效果：创建一个篮球作为运动球（此处原文误，应为棒球）\n\
    \    public SportsBall createBall() {\n    SportsBall b = new SportsBall();\n\
    \    b.type = \"Baseball\";\n    b.materialsUsed = new String[6];\n    b.materialsUsed[0]\
    \ = \"cork\";\n    b.materialsUsed[1] = \"wool\";\n    b.materialsUsed[2] = \"\
    poly/cotton\";\n    b.materialsUsed[3] = \"cowhide\";\n    b.materialsUsed[4]\
    \ = \"yarn\";\n    b.materialsUsed[5] = \"composite rubber\";\n    b.radius =\
    \ 1.45;\n    b.make = \"Rawlings\";\n    b.modelName = \"MLB Official Baseball\"\
    ;\n    return b;\n}\n}\n```\n\n### 第 4 ：运行代码\n\n现在你已经设计了工厂类，是时候运行它们了。\n\n在你的主函数中（具有\
    \ public static-void main 方法的主类中），为每个类创建一个实例。我们将使用工厂来创建特定对象。在我们的示例中，我们创建了篮球和棒球工厂。\n\
    \n```java\n// 创建工厂\nBasketballMaker f1 = new BasketballMaker();\nBaseballMaker\
    \ f2 = new BaseballMaker();\n\n// 创建篮球对象：\n// 使用篮球工厂制造篮球\nSportsBall bb1 = f1.createBall();\n\
    \n// 创建棒球对象：\n// 使用棒球工厂制造棒球\nSportsBall bb2 = f2.createBall();\n```\n\n```java\n\
    // 测试：\n// 这一行应该打印 \"Basketball\"\nSystem.out.println(bb1.type);\n\n// 这一行应该打印\
    \ \"Baseball\"\nSystem.out.println(bb2.type);\n```\n\n## JAVA-工作坊 1：\n\n使用你喜欢的\
    \ IDE 运行以下代码。在线 IDE，如 codechef.com、retextester.com、ideone.com 或 codpad.org 都是很好的选择。\n\
    \n======================\n\n现在轮到你玩工厂模式了。\n\n### 足球与排球\n\n通过创建两个更多的工厂类来展示你所学的内容。\n\
    \n其中一个将制造足球，另一个将制造排球。\n\n之后，编写并运行几行代码，创建每个工厂的实例以及每个工厂的至少一个球。\n\n这里有一些可以帮助你开始的代码：\n\
    \n```java\n// 足球制造器：\n// - 创建具有不同字段的足球对象\nclass SoccerballMaker implements BallFactory\
    \ {\n\n    // (方法实现了接口版本)\n    // 效果：创建一个足球作为运动球\n    public SportsBall createBall()\
    \ {\n        SportsBall b = new SportsBall();\n        b.type = \"Soccer\";\n\
    \        // 修改对象字段；\n        // 它们应该像足球那样的看起来和属性\n        return b;\n    }\n}\n\
    ```\n\n```java\n// 排球制造器：\n// - 创建具有不同字段的排球对象\nclass VolleyballMaker implements\
    \ BallFactory {\n\n    // (方法实现了接口版本)\n    // 效果：创建一个排球作为运动球\n    public SportsBall\
    \ createBall() {\n        SportsBall b = new SportsBall();\n        b.type = \"\
    Volleyball\";\n        // 修改对象字段；\n        // 它们应该像排球那样的看起来和属性\n        return\
    \ b;\n    }\n}\n```\n"
