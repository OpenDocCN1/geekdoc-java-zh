- md: "\n# EASIEST WAY TO LEARN OBJECT-ORIENTED\n\nWe've also included a complementary\
    \ guide to learning Object-Oriented programming - one of the most popular types\
    \ of programming in use today.\n\nTo easily run code, select an IDE (Integrated\
    \ Development Environment: essentially somewhere that you write and run code)\
    \ of your choice. You may also use online IDEs such as rextester.com, ideone.com,\
    \ or codepad.org.\n\n```\n======================================\n```\n\n## 1)\
    \ Object Oriented Programming\n\nIn the world of programming, you will hear this\
    \ term very often.\n\nThis is because Object-Oriented Programming (OOP for short)\
    \ is one of the most widely-used programming styles out there.\n\nDo you remember\
    \ the concept of “Classes” back in Part 1? You used this form of composite data\
    \ to group up smaller data into a larger whole.\n\nThe main point of Object-Oriented\
    \ Programming is this:\n\nIn object-oriented programming, you create ‘copies’\
    \ of those classes you’ve designed. In even simpler terms, A Class is a data structure\
    \ that acts as “blueprints”. Those “created copies” you’ve made, based on that\
    \ class ‘blueprints’, are called Objects.\n\nBut why? Because as you learn more\
    \ and more about programming, you will encounter the notion of Abstraction - applying\
    \ a general idea across multiple times and scenarios - ultimately saving time,\
    \ confusion, and effort.\n\nRe-coding the same composite data over and over over\
    \ would lead to more effort and frustration, whereas re-using the same idea leads\
    \ to efficiency and consistency.\n\n## 2) OOP Terminology\n\nVariables and Functions\
    \ can take on new roles in OOP. They can be called Fields and Methods, respectively.\
    \ In some cases, it’s really up to you to use these names you want, just long\
    \ as you understand what other programmers mean when they use these terms.\n\n\
    Fields represent variables in OOP because, just like fields in any entry form,\
    \ data objects can have fields with as many different values as you can think\
    \ of.\n\nThink of fields as a certain attribute for an object. Each object might\
    \ have different attributes from each other:\n\n```\nclass Cat{\n  String color;\n\
    }\n\n// these cats are objects based on Cat class:\ncatA.color = \"white\"\ncatB.color\
    \ = \"grey\"\ncatC.color = \"orange\"\n```\n\nMethods represent the functions\
    \ that Objects have. Think of Methods as ‘actions’ and ‘behaviours’ that objects\
    \ do.\n\nIn **OOP**, you can define a method within a class but you need to access\
    \ the method from an object itself.\n\nFor example, if we create a few Cat objects\
    \ based on some Cat Class, each Cat object would have all the methods defined\
    \ on the Cat Class:\n\n```\nclass Cat{\n    void meow() {}\n}\n\n// these cats\
    \ are objects based on Cat class:\ncatA.meow()\ncatB.meow()\ncatC.meow()\n```\n\
    \n## 3) Constructor Methods\n\nConstructors are special class methods. Based on\
    \ the classes they belong to, they create Objects for you.\n\nTo create a data\
    \ object based on a certain class, follow this syntax:\n\n(variable name) = new\
    \ <Class Name>();\n\nYou're essentially setting some variable as data object.\n\
    \nExample:\n\n```\nclass House {\n    // insert code here\n}\nh = new House();\n\
    ```\n\nTo call a class object, simply refer to the variable its to:\n\nExample:\n\
    \n```\nHouse h = new House();\nij = h;\n```\n\n# OVERCOME ANY PROGRAMMING OBSTACLE!\n\
    \n> \" It takes on such a complex topic and delivers it in a simple, vivid, and\
