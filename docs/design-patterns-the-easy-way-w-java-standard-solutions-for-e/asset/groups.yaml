    \ Pattern)\n\n如果你以前开过车，你就知道操作它是多么简单。启动汽车只需要转动点火开关上的钥匙（现在通常是按按钮）。要开得更快，就踩油门。要减速或停止，就踩刹车。方向盘也有明显的功能。\n\
