    # JAVA-3b: Implementing the Observer Pattern


    Use an IDE of your choice for the code below. Online IDE''s, such as codechef.com,
    retester.com, ideone.com, or codepad.org are a great choice.


    ==================================


    In this chapter, we''ll be adding the Observer Pattern step-by-step based on an
    appropriate situation you might encounter while coding (because in reality, you
    really may be good enough to be a hacker serving government intel one day).


    # Manhunt


    Picture yourself as a hacking specialist recruited by the FBI. There is a terrorist
    group that the FBI are trying to catch. You can somehow easily track the terrorists,
    but the problem is that several dozen agents need that tracking information immediately.
    Therefore, you need to modify their device software.


    Your first course of action is to create a prototype module that alerts devices
    if terrorists are near.'
