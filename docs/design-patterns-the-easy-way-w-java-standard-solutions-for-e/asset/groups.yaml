    t.addObs(m1);\nt.addObs(m2);\nt.addObs(m3);\nt.addObs(m4);\n```\n\n```java\n//\
    \ 创建所有位置\nString[] locs = new String[10];\nlocs[0] = \"Los Angeles\";\nlocs[1]\
