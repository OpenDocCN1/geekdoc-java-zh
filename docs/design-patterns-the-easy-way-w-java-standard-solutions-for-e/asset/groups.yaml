- md: "\nIn this system, we need to coordinate all the components together.\n\nHence,\
    \ here is how the Facade Pattern would be implemented in Java. If the Facade would\
    \ be implemented as an interface, it would look like so:\n\n```java\n/*\n// Facade\
    \ as an Interface\n// (include all major procedures that utilize\n// components\
    \ within the environment)\n*/\ninterface Facade{\n\n    // MAJOR PROCEDURES:\n\
    \    // IN & OUT: (your choice)\n    // EFFECT: (your choice)\n    // - calls\
