    YOU WIN!\");\n```\n\nAnd there you have it. This is the process of applying the\
    \ Strategy Pattern.\n\n# Chapter 6: The Decorator Pattern\n\nWhen designing classes,\
    \ all fields and methods seem as if they have to be as-is. In other words, when\
    \ you create instances of your classes, they would ALL have the same fields and\
    \ methods as defined by their class.\n\nBut what if there is a way to add more\
    \ features to data objects DURING runtime? Say, a data object acquires more features\
    \ over time?\n\nIt’s possible. And it’s made possible thanks to the Decorator\
    \ Pattern.\n\n## How it essentially works:\n\nThe Decorator Pattern has a similar\
    \ structure to the Composite Pattern; two classes sharing the same abstraction,\
    \ while one of them contains an instance of this abstraction. Due to polymorphism,\
    \ this abstraction can be either one of the two classes.\n\nThere are two main\
    \ generalized classes to develop: the Default Superclass and the Decorator Superclass.\n\
    \nThe Decorator class will have an instance of either the Base Class or previously\
    \ applied Decorator classes. This is in addition to any other fields or methods\
    \ a Decorator class may add.\n\nFor any method common to all classes, the Decorator\
    \ class will also call the previous object's method, which will call its previous\
    \ object's method, and so on, until the Default Class object's method is called\
    \ too. This creates a recursive pattern in which every Decorator, as well as the\
    \ one Default Class, applies its effect.\n\nThis is how it looks altogether; a\
    \ single object from the Default class will apply its behaviours differently compared\
    \ to an object with multiple Decorators attached to it.\n\nHence, a data object\
    \ during runtime may have much more different behaviours than originally intended.\n\
    \nThis pattern is commonly used in video game development and any any other apps\
    \ which require a high amount of modularity.\n\n## Creating the Decorator Pattern:\n\
    \nHere is the step-by-step plan for implementing this design pattern:\n\n- 1)\
    \ Create a general abstraction that covers ALL subclasses and variants.\n- 2)\
    \ Create the default subclass. This will directly extend your general abstraction\
    \ from earlier.\n- 3) Create the decoration subclass. Like the default subclass,\
    \ this will also directly extend your general abstraction.\n- 4) Make sure the\
    \ decoration subclass contains the previous decoration or the default class as\
    \ one of its fields (set the variable type as the general abstraction!). This,\
    \ along with the next step, are the key traits that allow multiple decorations\
    \ to be dynamically added to the default class.\n- 5) Make sure the constructor\
    \ for the decoration subclass inputs either a Decoration or the Base Object (again,\
    \ set the input type as the general abstraction!) and this input is set as the\
    \ previous decoration.\n- 6) Create the third-level decoration subclasses. These\
    \ directly extend the Decoration class you've developed in previous steps.\n\n\
    ## Applying the Decorator Pattern at Runtime:\n\n1) When creating an instance\
    \ of the Decorator Pattern, set its data type as the abstraction but initialize\
    \ it as the default subclass:\n\n```\nabstract class default = new defaultsubclass();\n\
    ```\n\n2) When adding a Decoration to a default subclass object, use the previous\
    \ Decoration or default object as an input. If you designed the pattern correctly,\
    \ all the decorations should connect to the the default class like a linked list.\n\
    \n```\nDecoratorOne a = new Decorator(default)\nDecoratorTwo b = new Decorator(a)\n\
    DecoratorTwo c = new Decorator(b)\n```\n\nHere is the UML Diagram for the Decorator\
    \ Pattern:\n\n![](img/b45495ee91388ef419519d722f088b6f_108_0.png)\n\nThis is perhaps\
    \ one of the more complex design patterns available. But once mastered, this becomes\
    \ one of the most useful ones in your programming repertoire.\n\n# JAVA-6a: The\
    \ Decorator Pattern, in Java\n\nHere is how the Decorator Pattern looks like in\
    \ Java. First, we start with the abstract form:\n\n```java\n/*\n// DECORATOR IMPLEMENTATION:\n\
    // This abstract form has:\n// - the signature for any common procedures,\n//\
    \ algorithms, and traits common to All. subclasses\n*/\ninterface DecorativeObject\
    \ {\n    // IN & OUT: (Your Choice)\n    // (Implementation done by Subclasses)\n\
    \    public void procedure();\n\n    // (include any other common fields)\n  \
    \  // and procedures as you wish\n}\n```\n\nNext, we have the Base and Additional\
    \ Functionalities.\n\nThe Base Object will include ALL default procedures and\
    \ traits your abstraction has.\n\n```java\nclass BaseObject implements DecorativeObject\
    \ {\n    // Common Procedure, implemented as Base Object\n    public void procedure()\
    \ {\n        // (Implement this procedure here)\n    }\n    // (include any other\
    \ fields\n    // and procedures as you wish\n}\n```\n\nThe Decorations will include\
    \ any additional modifications you'd like to apply to your decorative object.\
    \ This will use a structure similar to the Composite Pattern.\n\nCreating an instance\
    \ of one will require the previous Decorator as a Constructor input (or use the\
    \ BaseObject if there is none). This way, you pretty much daisy-chain as many\
    \ Decorators as you wish on top of a default Base Object.\n\n```java\nclass Decoration\
    \ implements DecorativeObject{\n    // Previously applied Decoration Instance\
    \ added:\n    DecorativeObject prevDeco;\n```\n\n```java\n// Common Procedure,\
    \ implemented as\nDecoration\n// Includes any extra effects added by this\nDecoration\n\
    \  public void procedure() {\n    // (Implement this procedure here,\n    // Add\
    \ anything else you'd like as well)\n    prevDeco.procedure();\n  }\n\n  // CONSTRUCTOR:\n\
    \  public Decoration(DecorativeObject d) {\n    this.prevDeco = d;\n  }\n  //\
    \ (include any other fields)\n  // and procedures as you wish\n}\n```\n\nNotice\
    \ how the procedure() method calls the previous\nDecorator’s method as well. This\
    \ way, once procedure()\nhas been called, its true effect will be delivered by\
    \ EVERY\nDecoration added - plus the effects from the Base Object.\n\nAnd lastly,\
    \ you can have as many different decoration classes as you wish. They all extend\
    \ the Decoration class and may include additional fields and procedures of their\
    \ own\n\n```java\nclass DecorationOne extends Decoration{\n    // Common Procedure,\
    \ implemented as Decoration\n    // (also implements procedure() as its subclass)\n\
    \    public void procedure() {\n        super.procedure();\n        // (Implement\
    \ this procedure here)\n    }\n    // (include any other fields)\n    // and procedures\
    \ as you wish\n}\n```\n\n```java\nclass DecorationX extends Decoration{\n    //\
    \ Common Procedure, implemented as Decoration\n    // (also implements procedure()\
    \ as its subclass)\n    public void procedure() {\n        super.procedure();\n\
    \        // (Implement this procedure here)\n    }\n    // (include any other\
    \ fields)\n    // and procedures as you wish\n}\n```\n\n# JAVA-6b: Applying The\
    \ Decorator Pattern\n\nUse an IDE of your choice for the code below. Online IDE's,\
    \ such as codechef.com, rextester.com, ideone.com, or codepad.org are a great\
    \ choice.\n\nHere, we encounter a scenario which requires the Decorator pattern.\n\
    \n## MMORPG Characters:\n\nIn Massively-Multiplayer Online Role-Playing fantasy\
    \ games before, playable characters often fall into certain character archetypes\
    \ - i.e., the Healer, the Wizard, the Archer, the Armoured Knight, and so on.\
    \ And as you play the game longer, your player characters gradually improve and\
    \ become stronger.\n"
  mdcn: "\n最后，变量 `myPick` 将是策略模式产生的获胜选择。无论在三个 `if` 语句之后变为什么形式，调用 `stratPattern` 的\
    \ `Algorithm()`都会返回一个获胜的选择。\n\n```\n//----------\n// 将模式初始化为任何你选择的\n// 无论它可能会被替换\n\
    RPSStrategy stratPattern = new Rock();\n\nif (aiPick == \"Rock\") {\n    stratPattern\
