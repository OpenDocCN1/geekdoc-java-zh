    +   1) Object Oriented Programming


    In the world of programming, you will hear this term very often.


    This is because Object-Oriented Programming (OOP for short) is one of the most
    widely-used programming styles out there.


    Do you remember the concept of “Classes” back in Part 1? You used this form of
    composite data to group up smaller data into a larger whole.'
  - '[PAGE 225]


    The main point of Object-Oriented Programming is this:


    In object-oriented programming, you create ‘copies’ of those classes you’ve designed.
    In even simpler terms, A Class is a data structure that acts as “blueprints”.
    Those “created copies” you’ve made, based on that class ‘blueprints’, are called
    Objects.


    But why? Because as you learn more and more about programming, you will encounter
    the notion of Abstraction - applying a general idea across multiple times and
    scenarios - ultimately saving time, confusion, and effort.


    Re-coding the same composite data over and over over would lead to more effort
    and frustration, whereas re-using the same idea leads to efficiency and consistency.


    # 2) OOP Terminology


    Variables and Functions can take on new roles in OOP. They can be called Fields
    and Methods, respectively. In some cases, it’s really up to you to use these names
    you want, just as long as you understand what other programmers mean when they
    use these terms.'
  - "[PAGE 226]\n\nFields represent variables in OOP because, just like fields in\
    \ any entry form, data objects can have fields with as many different values as\
    \ you can think of.\n\nThink of fields as a certain attribute for an object. Each\
    \ object might have different attributes from each other:\n\n```\nclass Cat{\n\
    \  String color;\n}\n\n// these cats are objects based on Cat class:\ncatA.color\
    \ = \"white\"\ncatB.color = \"grey\"\ncatC.color = \"orange\"\n```\n\nMethods\
    \ represent the functions that Objects have. Think of Methods as ‘actions’ and\
    \ ‘behaviours’ that objects do.\n\nIn **OOP**, you can define a method within\
    \ a class but you need to access the method from an object itself."
  - "[PAGE 227]\n\nFor example, if we create a few Cat objects based on some Cat Class,\
    \ each Cat object would have all the methods defined on the Cat Class:\n\n```\n\
    class Cat{\n    void meow() {}\n}\n\n// these cats are objects based on Cat class:\n\
    catA.meow()\ncatB.meow()\ncatC.meow()\n```\n\n# 3) Constructor Methods\n\nConstructors\
    \ are special class methods. Based on the classes they belong to, they create\
    \ Objects for you.\n\nTo create a data object based on a certain class, follow\
    \ this syntax:\n\n(variable name) = new <Class Name>();\n\nYou're essentially\
    \ setting some variable as a data object."
