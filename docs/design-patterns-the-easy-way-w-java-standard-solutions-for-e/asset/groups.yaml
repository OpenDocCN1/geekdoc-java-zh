    \n```java\n// 设备模块拥有：\n// - 一个告 状态（布尔值）\n// - 通知更新（字符串）\n// - 一个 String 类型的位置\n\
    ```\n\n```java\n// 它能：\n// - 推送警报\n// - 更新警报与通知\nclass Module{\n  String location;\n\
    \  boolean alert;\n  String notifications;\n}\n\n// 效果：如果 alert 为 true，则打印警报通知\n\
    void sendAlerts(){\n  if (alert) {\n    System.out.println(\"ALERT: \" \n    \
    \  + notifications\n      + \"Agents in \" \n      + this.location);\n  }\n}\n\
    ```\n\n# 第 2 ：设置观察者和主体的抽象\n\n在 Java 中，Observer 和 Subject 的抽象将是接口（interfaces）。\n\
    \n我们将这样对它们进行建模。\n\n```java\n/*\n// 所有观察类都实现 Observer\n抽象\n// 它能：\n// - 根据主体更新对象数据\n\
    // 观察类可能需要一个 Subject 列表来\n// 访问（已添加到 Observer 类中）\n*/\ninterface Observer {\n\
    \    public void update();\n}\n```\n\n```java\n/*\n// 所有主体类都实现 Subject 抽象\n//\
    \ 它能：\n// - 在其更新列表中添加/删除观察者\n// 主体类还需要一个 Observer 列表来更新\n//（已添加到 Subject 类中）\n\
    */\ninterface Subject {\n    public void notifyObservers();\n    public void addObs(Observer\
    \ o);\n    public void deleteObs(Observer o);\n}\n```\n\n# 第 3 ：修改我们的主体类以充当主体\n\
    \n代表恐怖分子的数据对象将作为主体类运行。因此，它将实现 Subject 接口。\n\n然而，你还需要添加并实现 Subject 接口包含的方法。\n\n\
    它还将被修改为包含一个用于修改的 Observer 对象列表。将此字段保持为私有（private）以增加针对黑客的额外保护。\n\n```java\n//\
    \ 单个恐怖分子拥有：\n// - 一个 String 类型的位置\n// - 一个 Observer 对象的列表\n// 同时实现了 Subject 接口；\n\
    //（需要实现它的方法）\nclass Terrorist implements Subject{\n    String location;\n    private\
    \ List<Observer> obs = new ArrayList<Observer>();\n\n    // 新增：来自 Subject 接口\n\
    \    public void notifyObservers() {};\n    public void addObs(Observer o) {};\n\
    \    public void deleteObs(Observer o) {};\n}\n```\n\n对于 `notifyObservers` 方法，它应该遍历\
    \ Observer 列表并更新每一个。修改该方法来实现此操作。\n\n```java\n// 新增：来自 Subject 接口\npublic void\
    \ notifyObservers() {\n    for (Observer o: obs) {\n        o.update();\n    }\n\
    }\n```\n\n接下来，我们实现 `addObs()` 和 `deleteObs()` 方法。它们所做的只是分别从列表中添加和删除 Observer 对象。\n\
    \n```java\npublic void addObs(Observer o) {\n    obs.add(o);\n}\npublic void deleteObs(Observer\
    \ o) {\n    obs.remove(o);\n}\n```\n\n完成所有更改后，你的 Terrorist 类看起来如下：\n\n```java\n\
    class Terrorist implements Subject{\n    String location;\n    private List<Observer>\
    \ obs = new ArrayList<Observer>();\n\n    // 新增：来自 Subject 接口\n    public void\
    \ notifyObservers() {\n        for (Observer o: obs) {\n            o.update();\n\
