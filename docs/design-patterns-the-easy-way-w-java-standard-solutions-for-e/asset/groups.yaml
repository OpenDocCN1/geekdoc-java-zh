  mdcn: "\n\n# 第 1 ：识别观察者与被观察者\n\n首先，谁或什么是主体？\n谁或什么是观察者？\n\n没错。恐怖分子将是需要关注的主体（Subject）。因此，你需要用几行代码（一个类）来表示恐怖分信息。目前，你需要跟踪他们的行踪——换句话说，就是位置。\n\
    \n```java\n// 单个恐怖分子拥有：\n// - 一个 String 类型的位置\n// - 一个 Observer 对象的列表\nclass Terrorist{\n\
