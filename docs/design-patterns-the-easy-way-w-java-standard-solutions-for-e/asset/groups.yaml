    Cleveland\";\nlocs[5] = \"Boston\";\nlocs[6] = \"San Francisco\";\nlocs[7] = \"\
    Miami\";\nlocs[8] = \"St. Louis\";\nlocs[9] = \"Dallas\";\n```\n\n```java\n//\
    \ // 部分 3：将观察者设置为它们的位置\nm1.location = locs[1];\nm2.location = locs[4];\nm3.location\
