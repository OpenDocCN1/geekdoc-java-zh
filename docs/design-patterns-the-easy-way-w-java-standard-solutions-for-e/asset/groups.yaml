- md: "\n## Advanced Coding:\n\nNotice how all the sports balls are still one type\
    \ of object - sports balls.\n\nHow would you change the code so that each of the\
    \ factory classes create objects of balls they’re supposed to create? For example,\
    \ how would you have the BasketballMaker create Basketball objects instead of\
    \ general, modified Sports Balls? Or a BaseballMaker creating Baseball objects?\n\
    \n## Chapter 2: The Composite Pattern\n\nPicture this scenario: you have to organize\
    \ your data in a hierarchical manner. They seem to somehow resemble 'files' and\
    \ 'folders'.\n\nAs you and other computer users know, files go into folders and\
    \ folders can go into other folders as well.\n\nYou also want to do this in a\
    \ way that doesn't replicate unnecessary code.\n\nSo what do you need?\n\nThe\
    \ Composite Pattern.\n\n## How it essentially works:\n\nYou have two distinct\
    \ classes: a File class and a Folder class. Or Item and Group. Clothing and Bag.\
    \ Toys and Box. Any combination of two classes, in which one of them is a collection\
    \ composed of both types.\n\nHowever, both classes may have way many similar traits,\
    \ methods, and fields. You realize you may need to write twice the code that you\
    \ would normally do - one for the items and one for the groupings.\n\nThe solution\
    \ here is to have them extend a common superclass or abstract class - a component.\
    \ This includes one key distinction; the Group class contains a collection of\
    \ this superclass. And because both classes extend a common superclass, the Group\
    \ class can have a collection of either items or groups.\n\nFor example, let's\
    \ say you have two classes: Clothing and Bag. A Bag can contain both clothes and\
    \ other bags. They both share similar characteristics such as name, description,\
    \ etc.. You realize how unproductive it is to write separate code when it really\
    \ should be under the same code (i.e. when getting all the names would need calls\
    \ from both Clothing.getName() and Bag.getName()).\n\nTherefore, you apply the\
    \ Composite Pattern. Both Clothing and Bag classes extend a new superclass, Item.\
    \ The Bag class is modified to have a collection of Items (which can be either\
    \ Bags or Clothing).\n\nHere’s what the UML diagram would look like:\n\n![](img/b45495ee91388ef419519d722f088b6f_28_0.png)\n\
    \nThe main thing to remember here are the item/container classes extend a common\
    \ superclass - component. The container class will have a list containing components,\
    \ which can be either files or folders.\n\nDepending on the language you’re coding\
    \ with, the superclass may also be an abstract class, interface, or any type of\
    \ abstraction that your programming language comes with.\n\nThe Pseudocode implementation\
    \ for this pattern is also included in the Archive. If you need to implement this\
    \ pattern in another language, the pseudocode should help you.\n\nNext, let’s\
    \ put the Composite Pattern into use.\n\n## JAVA-2a: The Composite Pattern, in\
    \ Java\n\nHere is how the Composite Pattern looks like in Java:\n\n```java\n/*\n\
    // Component is the superclass which File and Folder\nclasses extend\n// You may\
    \ define any fields and methods shared by both\nsubclasses\n*/\nabstract class\
    \ Component {\n  // insert any amount of fields and methods\n  // where necessary\n\
    \  String someField;\n  public void someMethod() {}\n}\n\n// General Item Class\
    \ (as File):\n// contains all fields and methods defined at Component\nclass File\
    \ extends Component {\n}\n```\n\n```java\n// General Group Class (as Folder):\n\
    // contains all fields and methods defined at Component\n// Also has:\n// - a\
    \ List of Components. which can contain either Items\nor Groups\nclass Folder\
    \ extends Component {\n    List<Component> contents = new ArrayList<Component>();\n\
    }\n```\n\nIn the next chapter, we'll do a walkthrough in implementing this design\
    \ pattern.\n\n## JAVA-2b: Implementing the Composite Pattern\n\nUse an IDE of\
    \ your choice for the code below. Online IDE's, such as codechef.com, rextester.com,\
    \ ideone.com, or codpad.org are a great choice.\n\nIn this chapter, we encounter\
    \ a situation which suggests having the Composite Pattern as a viable solution.\
    \ Then, we'll be coding the Composite Pattern step-by-step.\n\n## File Manager\n\
    \nImagine you are a software engineer at a very popular social media site.\n\n\
    The next website update will have a really cool feature - enable users to upload\
    \ and organize data files of their choice. And you're tasked with implementing\
    \ this functionality. You know you have to design the File and Folder classes,\
    \ but you also realize that they share too many traits, such as name, date created,\
    \ date modified, a thumbnail icon, etc.. So you think to yourself, there must\
    \ be a more simple way to implement this.\n\nThe first thing that comes to your\
    \ mind is to implement the Composite Pattern. This is an ideal situation to apply\
    \ it as well.\n\n## Step 1: The Component Superclass\n\nFirst, we'll create the\
    \ superclass that the File and Folder classes are based on.\n\nWe're coding in\
    \ Java, so we have the Abstract Class available.\n\nFor now, let's add the following\
    \ fields to the superclass: the name, the date created, and the date last modified.\n\
    \n```java\n/*\n// Component is the superclass which File and Folder classes extend\n\
    // It has:\n// - Name, as a String\n// - the Date Created\n// - the Date Last\
    \ Modified\n// It can:\n// - rename itself\n// - update the Last Modified date\n\
    \ */\nabstract class Component {\n  String name;\n  Date dateCreated;\n  Date\
    \ dateLastModified;\n}\n```\n\n## Step 2: Customizing the Component Constructor\n\
    \nNext, we'll code a modified version of the constructor for the Component. When\
    \ a new component is created, its name will be set and its two date fields will\
    \ be set to the current date.\n\nThe Files and Folders that will later extend\
    \ this superclass will eventually use the same constructor as well.\n\n```java\n\
    abstract class Component {\n    String name;\n    Date dateCreated;\n    Date\
    \ dateLastModified;\n    /*\n    // INPUT: a String\n    // Custom Constructor\
    \ for the Component Class,\n    // Upon creation, the dates created and last modified\n\
    \    // are set to the current date an object would be created\n    */\n    public\
    \ Component(String n) {\n        this.name = n;\n        this.dateCreated = new\
    \ Date();\n        this.dateLastModified = new Date();\n    }\n}\n```\n\nHere,\
    \ you see first-hand how shared methods can save a programmer many lines of code\
    \ and prevent more coding mistakes along the way. Any essential fields and methods\
    \ between both classes will be present - programmers won't have the hassle of\
    \ coding twice as much as needed, as well as having to change certain fields.\n\
    \n## Step 3: Creating the File Class\n\nNow we create the File class.\n\nAs stated\
    \ before, the File class will have some common fields and methods as the Folder\
    \ class.\n\nHowever, the File class here will have more distinctive fields. It\
    \ will include some indication of the file's type (i.e. a spreadsheet, letter\
    \ document, slideshow, picture, video, PDF, etc.).\n\n```java\n/*\n// General\
    \ Item Class (a.k.a. File):\n// contains all fields and methods defined at Component\n\
    // Also has:\n// - a type, as a string\n*/\nclass File extends Component {\n \
    \ String fileType;\n\n  /*\n  // INPUT: a String\n  // Custom Constructor for\
    \ the File Class,\n  // Follows the same procedure as the superclass.\n  // Then\
    \ sets the file type\n  */\n  public File(String n, String f) {\n    super(n);\n\
    \    this.fileType = f;\n  }\n}\n```\n\n## Step 3: Creating the Folder Class\n\
    \nCreating the Folder Class will be a very similar procedure as creating the File\
    \ class.\n\nHowever, the difference is that the Folder class will have its key\
    \ field - a list of components, which can be either Files or SubFolders.\n\n```java\n\
    // General Group Class (a.k.a. Folder):\n// contains all fields and methods defined\
    \ at Component\n// Also has:\n// - a List of Components. which can contain either\
    \ Items\nor Groups\nclass Folder extends Component {\n    List<Component> contents\
    \ = new ArrayList<Component>();\n    public Folder(String n) {\n        super(n);\n\
    \    }\n}\n```\n\n## Step 4: Running and Testing the Code\n\nNow we'll test the\
    \ classes by writing a few lines of code.\n\nWe'll create a handful of Files and\
    \ Folders, then organize them in a sort of hierarchy.\n\nRun these lines of code\
    \ in your Main Class, within the Public-Static-Void-Main method (or any other\
    \ place where the following lines of code will run)\n\n```\nFolder top = new Folder(\"\
    Top Folder\");\nFile a = new File(\"A\", \"Spreadsheet\");\nFile b = new File(\"\
    B\", \"Picture\");\nFolder mid = new Folder(\"Mid Folder\");\n```\n"
  mdcn: "\n\n## 高级编码：\n\n注意看所有的运动球仍然同一种类型的对象——运动球。\n\n你会如何修改代码，以便每个工厂类都能创建它们本应该创建的球类对象？例如，如何让\
    \ `BasketballMaker` 创建 `Basketball` 对象，而不是通用的、修改过的 `Sports Balls`？或者让 `BaseballMaker`\
    \ 创建 `Baseball` 对象？\n\n## 第 2 章：组合模式（Composite Pattern）\n\n想象这样一个场景：你必须以分层的方式组织你的数据。它们在某种程度上类似于“文件”和“文件夹”。\n\
    \n正如你和其他计算机用户所知的，文件放在文件夹中，文件夹也可以放在其他文件夹中。\n\n你还希望以一种不产生冗余代码的方式来实现这一点。\n\n那么你需要什么？\n\
    \n组合模式。\n\n## 它的基本工作原理：\n\n你有两个不同的类：`File` 类和 `Folder` 类。或者是 `Item` 和 `Group`。`Clothing`\
    \ 和 `Bag`。`Toys` 和 `Box`。任何两个类的组合，其中一个类是由这两种类型组成的集合。\n\n然而，这两个类可能具有许多相似的特征、方法和字段。你意识到可能需要编写比平时多一倍的代码——一个用于项目（items），一个用于分组（groups）。\n\
    \n解决方案是让它们继承一个共同的父类或抽象类——组件（component）。这包括一个关键区别：`Group` 类包含该父类的集合。因为两个类都继承自同一个父类，所以\
    \ `Group` 类可以拥有项目或分组的集合。\n\n例如，假设你有两个类：`Clothing` 和 `Bag`。一个 `Bag` 可以既包含衣服，也包含其他包。它们共享相似的特征，如名称、描述等。你意识到，当这些本应该放在同一段代码下时，编写单独的代码是多么低效（例如，当获取所有名称时，需要分别调用\
    \ `Clothing.getName()` 和 `Bag.getName()`）。\n\n因此，你应用了组合模式。`Clothing` 和 `Bag` 类都继承自新的父类\
    \ `Item`。`Bag` 类被修改为拥有一个 `Items` 集合（可以是 `Bags` 或 `Clothing`）。\n\nUML 图看起来是这样的：\n\
    \n![](img/b45495ee91388ef419519d722f088b6f_28_0.png)\n\n这里要记住的主要点是项目/容器类继承自共同的父类——组件。容器类将拥有一个包含组件的列表，组件可以是文件也可以是文件夹。\n\
    \n取决于你所使用的编程语言，父类也可能是一个抽象类、接口或你的编程语言提供的任何类型的抽象。\n\n该模式的伪代码实现也包含在存档中。如果你需要在另一种语言中实现此模式，伪代码将为你提供帮助。\n\
    \n接下来，让我们把组合模式用起来。\n\n## JAVA-2a：Java 中的组合模式\n\n以下是组合模式在 Java 中的样子：\n\n```java\n\
    /*\n// Component 是父类，File 和 Folder 类继承自它\n// 你可以定义任何子类共享的字段和方法\n*/\nabstract class\
    \ Component {\n  // 根据需要插入任意数量的字段的方法\n  String someField;\n  public void someMethod()\
    \ {}\n}\n\n// 通用 Item 类（相当于 File）：\n// 包含了 Component 中定义的所有字段和方法\nclass File extends\
    \ Component {\n}\n```\n\n```java\n// 通用 Group 类（相当于 Folder）：\n// 包含了 Component\
    \ 中定义的所有字段和方法\n// 还有：\n// - 一个 Components 列表。可以包含 Items 或 Groups\nclass Folder\
    \ extends Component {\n    List<Component> contents = new ArrayList<Component>();\n\
    }\n```\n\n在接一章中，我们将逐步实现这一设计模式。\n\n## JAVA-2b：实现组合模式\n\n使用你选择的 IDE 运行以下代码。在线 IDE，如\
    \ codechef.com、rextester.com、ideone.com 或 codpad.org 都是很棒的选择。\n\n在本章中，我们遇到了一个暗示组合模式是可行解决方案的情况。然后，我们将逐步对组合模式进行编码。\n\
    \n## 文件管理器（File Manager）\n\n想象你是某个非常受欢迎的社交媒体网站的软件工程师。\n\n下一次网站更新将拥有一个非常酷的功能——允许用户上传并组织他们选择的数据文件。你被指派实现这个功能。你知道必须设计\
    \ `File` 和 `Folder` 类，但你也意识到它们共享了太多的特征，例如名称、创建日期、修改日期、缩略图图标等。所以你想想，一定有更简单的方法来实现。\n\
    \n你脑海中浮出的第一个想法就是实现组合模式。这也是应用它的理想情况。\n\n## 第 1 步：组件父类（Component Superclass）\n\n\
    首先，我们将创建 `File` 和 `Folder` 类基础的父类。\n\n我们使用 Java 编码，所以可以使用抽象类（Abstract Class）。\n\
    \n现在，让我们给父类添加以下字段：名称、创建日期和最后修改日期。\n\n```java\n/*\n// Component 是父类，File 和 Folder\
    \ 类继承自它\n// 它有：\n// - String 类型的 Name\n// - 创建日期\n// - 最后修改日期\n// 它可以：\n// - 重命名自己\n\
    // - 更新最后修改日期\n */\nabstract class Component {\n  String name;\n  Date dateCreated;\n\
    \  Date dateLastModified;\n}\n```\n\n## 第 2 步：自定义 Component 构造函数\n\n接下来，我们将为 `Component`\
    \ 编写一个修改版本的构造函数。当创建一个新组件时，它的名称将被设置，两个日期字段将被设置为当前日期。\n\n以后继承此父类的 Files 和 Folders\
    \ 也会使用相同的构造函数。\n\n```java\nabstract class Component {\n    String name;\n    Date\
    \ dateCreated;\n    Date dateLastModified;\n    /*\n    // 输入：一个 String\n    //\
    \ Component 类的自定义构造函数\n    // 在创建时，创建和最后修改日期\n    // 被设置为对象创建时的当前日期\n    */\n\
    \    public Component(String n) {\n        this.name = n;\n        this.dateCreated\
    \ = new Date();\n        this.dateLastModified = new Date();\n    }\n}\n```\n\n\
    在这里，你亲眼看到了共享方法如何为程序员节省许多行代码，并在过程中防止更多的编码错误。两个类之间的任何基本字段和方法都存在——程序员将不必受编写双倍代码的痛苦，也不需要更改某些字段。\n\
    \n## 第 3 步：创建 File 类\n\n现在我们创建 `File` 类。\n\n如前所述，`File` 类将具有 `Folder` 类的一些共同字段和方法。\n\
    \n然而，这里的 `File` 类将具有更具区分性的字段。它将包含文件类型的指示（例如表格、文档、幻灯片、图片、视频、PDF 等）。\n\n```java\n\
    /*\n// 通用 Item 类（又称 File）：\n// 包含了 Component 中定义的所有字段和方法\n// 还有：\n// - 一个 string\
    \ 类型的 type\n*/\nclass File extends Component {\n  String fileType;\n\n  /*\n \
    \ // 输入：一个 String\n  // File 类的自定义构造函数\n  // 遵循与父类相同的步骤\n  // 然后设置文件类型\n  */\n\
    \  public File(String n, String f) {\n    super(n);\n    this.fileType = f;\n\
    \  }\n}\n```\n\n## 第 3 步：创建 Folder 类\n\n创建 `Folder` 类的过程与创建 `File` 类非常相似。\n\n\
    然而，区别在于 `Folder` 类将有一个关键字段——一个组件列表，可以是 `Files` 或子文件夹 `SubFolders`）。\n\n```java\n\
    // 通用 Group 类（又称 Folder）：\n// 包含了 Component 中定义的所有字段和方法\n// 还有：\n// - 一个 Components\
    \ 列表。可以包含 Items 或 Groups\nclass Folder extends Component {\n    List<Component>\
    \ contents = new ArrayList<Component>();\n    public Folder(String n) {\n    \
    \    super(n);\n    }\n}\n```\n\n## 第 4 步：运行并测试代码\n\n现在我们将通过编写几行代码来测试这些类。\n\n\
    我们将创建一些文件和文件夹，然后以某种层次级结构组织它们。\n\n在你的主类中运行这些代码，位于 `Public-Static-Void-Main` 方法内（或任何其他可以运行这些代码的地方）\n\
    \n```\nFolder top = new Folder(\"Top Folder\");\nFile a = new File(\"A\", \"Spreadsheet\"\
    );\nFile b = new File(\"B\", \"Picture\");\nFolder mid = new Folder(\"Mid Folder\"\
    );\n```\n\n"
