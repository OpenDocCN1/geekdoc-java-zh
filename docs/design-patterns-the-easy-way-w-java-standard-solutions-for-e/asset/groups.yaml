    # How it essentially works:\n\nThe Singleton pattern is one of the more simple\
    \ design patterns. However, when a situation calls for its design, it will prove\
    \ to be more than helpful.\n\nThere are three key components to a Singleton class.\
    \ First, the class constructor is set in a certain way such that it cannot be\
    \ used outside the class. This ensures the singleton class remains a singleton\
    \ by removing the ability to make instances of it except within its own code.\n\
    \nSecond, the class itself will contain the only instance based on it. The singleton\
    \ class has its only object as one of its own fields.\n\nAnd lastly, the third\
    \ component is a method that retrieves the actual single object. This method has\
    \ to be accessible without needing a created class object. In most implementations,\
    \ it uses the First component (the class-code-only constructor) to create the\
    \ object if it doesn’t exist yet.\n\nHere is the UML diagram describing the Singleton\
    \ class:\n\n![](img/b45495ee91388ef419519d722f088b6f_68_0.png)\n\nThe Pseudocode\
    \ implementation for this pattern is also included in the Archive, in case you\
    \ need to implement this pattern in another language.\n\nNext, we'll be using\
    \ applying the Singleton pattern in a scenario.\n\n# JAVA-4a: The Singleton Pattern,\
    \ in Java\n\nHere is how the Singleton Pattern looks like in Java.\n\n```java\n\
    /*\n// A Singleton Class has:\n// - A Singleton Instance\n// - any other Fields\
    \ you need\n//\n// it can NOT:\n// - be instantiated as normal (as if it were\
    \ a regular class)\n// (The constructor is set to Private.just to be sure)\n//\n\
    // It can:\n// - return the ONLY singleton class instance\n*/\nclass Singleton\
    \ {\n  // Singleton Component #1:\n  // CONSTRUCTOR:\n  // - set to PRIVATE; cannot\
    \ be accessed outside the class\n  private Singleton() {}\n```\n\n```java\n//\
    \ Singleton Component #2:\n// The Only Singleton Object:\n// - set to PRIVATE:\
    \ cannot be accessed outside the class\n    private static Singleton object =\
    \ null;\n\n// Singleton Component #3:\n// INPUT: (your choice)\n// OUTPUT: A Singleton\
    \ Object\n// EFFECT: Returns the ONLY singleton object.\n// Creates one if nonexistent.\n\
    // - set to STATIC: will not require an Object to call this method\n    public\
    \ static synchronized Singleton getObject() {\n        if (object == null) {\n\
    \            object = new Singleton();\n            // Initialize any other fields\
    \ here\n        }\n        return object;\n    }\n}\n```\n\nTo access your Singleton\
    \ object, you simply need to call the static method getObject(). Note that the\
    \ Singleton Object is expected wherever you call the Method.\n\n```java\n// Assigning\
    \ the Singleton to Variable sg\nSingleton sg = Singleton.getObject();\n```\n\n\
    Also note that you can assign the same Singleton to multiple variables; they will\
    \ all refer to the same Singleton\n\n```java\n// Assigning the Singleton to multiple\
    \ Variables\nSingleton sg1 = Singleton.getObject();\nSingleton sg2 = Singleton.getObject();\n\
    Singleton sg3 = Singleton.getObject();\n```\n\n# JAVA-4b: Implementing the Singleton\
