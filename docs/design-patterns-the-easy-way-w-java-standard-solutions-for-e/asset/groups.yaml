    # Chapter 8: The Facade Pattern\n\nIf you've ever driven a car before, you would\
    \ know how simple it is to operate it. Starting the car would take a twist of\
    \ your keys in the ignition (or nowadays, a press of a button). To go faster,\
    \ you would press the gas pedal. To slow or stop, you would press the brake pedal.\
    \ And the steering wheel has an obvious function.\n\nBut a car is also a very\
    \ complex system. Starting a car would require ample power from the battery. Afterwards,\
    \ it would require enough gasoline from the tank. The spark plugs need to be functional\
    \ as well. There has to be enough fresh oil to move the car engine pistons and\
    \ other parts. There's also other things that have yet to be mentioned - and this\
    \ differs from car to car. If everything is okay, the spark plugs ignite the engine\
    \ cylinders and create enough energy in the engine to propel the car.\n\nAlso,\
    \ steering, accelerating, and braking each require a system of components to work\
    \ together in unison. But we often don't think about this because, from the driver's\
    \ seat, we can only see the components visible to us. In other words, a Facade.\n\
    \n# How the Facade Pattern Works:\n\nThe Facade Pattern gives you a top-level\
    \ component that oversees the functionality of a complex subsystem. To operate\
    \ the subsystem, you would only need to do it through the Facade Pattern. The\
    \ result is a far more simple system where you only need to access the Facade\
    \ Pattern for functionality.\n\nLooking back at our car analogy, its provided\
    \ interface in the driver's seat is Facade pattern; it lets the driver control\
    \ the system with a set of simple gestures. Meanwhile, it coordinates a complex\
    \ system of components in response to the driver's commands.\n\n# Creating the\
    \ Facade Pattern:\n\nTo implement this design pattern, first identify the Major\
    \ Procedures and/or Behaviours we want to simplify.\n\nIf using an interface,\
    \ follow these steps:\n\n- 1) Create the Facade interface that contains those\
    \ major procedures\n- 2) Create the general client class that implements the Facade\
    \ interface\n- 3) The general client should implement ALL the major procedures.\
    \ Contain as many component instances as necessary.\n- 4) If necessary, you may\
    \ create multiple Facade interfaces and client classes. If so, repeat steps 1\
    \ to 3.\n- 5) Create subclasses for the general client classes whenever necessary.\
    \ Any code that accesses the system does it as a client subclass.\n\nIf using\
    \ an encompassing class, follow these steps instead:\n\n- 1) Create the general\
    \ “Facade” class. This class should implement ALL the Major Procedures mentioned\
    \ earlier. Contain as many component instances as necessary.\n- 2) Create a general\
    \ client class. It should contain an instance of the Facade class.\n- 3) If necessary,\
    \ you may create multiple Facade classes and repeat steps 1&2.\n- 4) Create subclasses\
    \ for the general client class whenever necessary. Any code that accesses the\
    \ system does it through the Facade class. Whichever steps you take depends on\
    \ the situation you encounter. So you’ll have to judge whether it’s better to\
    \ have one ‘Facade’ wrapper class.\n\nIf you implement the Facade Pattern as a\
    \ single wrapper class, the UML diagram would look like this:\n\n[img/b45495ee1388ef419519d722f08b6f_160_0]\n\
    \nIf, instead, you implement the Facade Pattern as an interface, the UML diagram\
    \ would look like this:\n\n[img/b45495ee1388ef419519d722f08b6f_161_0]\n\n# JAVA-8a:\
    \ The Facade Pattern, in Java\n\nTo first understand the Facade Pattern, we must\
    \ first look at its environment. The key thing to notice is a collection of components\
    \ that compose a complex system.\n\nHere is an example of a component class that\
    \ contains multiple sub-components. Its methods may also depend on its sub-components.\n\
    \n```\n/*\n// Component Class, with Sub-Components\n// Methods:\n// - one method\
    \ which accesses the subcomponents\n */\nclass ComponentOne {\n  SubcompOneOne\
    \ sc11 = new SubcompOneOne();\n  SubcompOneTwo sc12 = new SubcompOneTwo();\n}\n\
    ```\n\n```\n// IN & OUT: (your choice)\n// EFFECT: (your choice)\npublic void\
    \ distinctMethodOne() {\n    sc11.distinctMethodOneOne();\n    sc12.distinctMethodOneTwo();\n\
    }\nclass SubcompOne {\n    // IN & OUT: (your choice)\n    // EFFECT: (your choice)\n\
    \    public void distinctMethodOne() {\n    }\n}\nclass SubcompOneTwo {\n    //\
    \ IN & OUT: (your choice)\n    // EFFECT: (your choice)\n    public void distinctMethodOneTwo()\
    \ {\n    }\n}\n```\n\nHere are examples of two other components within the environment:\n\
    \n```\nclass ComponentTwo {\n    // IN & OUT: (your choice)\n    // EFFECT: (your\
    \ choice)\n    public void distinctMethodTwo() {\n        // (add implementation\
    \ here)\n    }\n}\n```\n\n```\nclass ComponentN {\n    // IN & OUT: (your choice)\n\
    \    // EFFECT: (your choice)\n    public void distinctMethodN() {\n        //\
    \ (add implementation here)\n    }\n}\n```\n"
