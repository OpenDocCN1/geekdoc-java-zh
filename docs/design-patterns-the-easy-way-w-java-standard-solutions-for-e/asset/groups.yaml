- md: "\nBut why not have other weapons too? Let's also design a Fiery Battle Axe.\
    \ Like the GreatSword, it also has an attack as its skill() method.\n\n```java\n\
    class FieryBattleAxe extends Decoration {\n // Weapon damage\n int damage = 2;\n\
    \ int magicPower = 2;\n```\n\n```java\n// CONSTRUCTOR:\n // (use super() to implement\
    \ this as its supertype)\n public void FieryBattleAxe(Character c){\n super(c);\n\
    \ }\n```\n\n```java\n// Common Procedure, implemented as FieryBattleAxe\n // (will\
    \ be an Attack)\n public void skill(Character target) {\n // ATTACK TARGET:\n\
    \ target.hp -= damage + magicPower;\n prevDeco.skill(target);\n }\n```\n\nWhile\
    \ we're at it, we can also create a Shield too:\n\n```java\nclass GoldenShield\
    \ extends Decoration {\n    int armorBonus = 10;\n\n    // CONSTRUCTOR:\n    //\
    \ (use super() to implement this as its supertype)\n    public GoldenShield(Character\
    \ c) {\n        super(c);\n    }\n\npublic// Common Procedure. implemented as\
    \ GoldenShield\n    public void skill(Character target) {\n        this.hp +=\
    \ armorBonus;\n        prevDeco.skill(target);\n    }\n}\n```\n\nNow that we have\
    \ our classes in place, here is how the code would look like when run.\n\n## Creating\
    \ a New Object:\n\nTo create a new character, you'll set its data type as the\
    \ abstract class but initialize it as the default class.\n\n```java\nCharacter\
    \ me = new DefaultChar();\n```\n\n## Adding Decorations\n\nTo add decorations\
    \ to a new character, you'll simply re-initialize that character as a Decorator\
    \ object with that same character as the input:\n\n```java\nme = new GoldenShield(me);\n\
    ```\n\nYou can even add more decorations simultaneously by creating a Decoration\
    \ within a Decoration:\n\n```java\nme = new GreatSword(new GoldenShield(me));\n\
    ```\n\n## Using Common Procedures\n\nWhen you make function calls to common procedures,\n\
    ALL attached Decorators, as well as the Default object,\nwill be called as well.\n\
    \nLet’s say the below line has just finished executing:\n\n```java\nme = new GreatSword(new\
    \ FieryBattleAxe(me));\n```\n\nIn the second line below, we call the function\
    \ skill(),\ntargeting a character:\n\n```java\nCharacter you = new DefaultChar();\n\
    me.skill(you);\n```\n\nWhat exactly would function skill() do in this situation?\n\
    Well, let’s recall the code for skill() from one of the\nDecorator classes:\n\n\
    ```java\npublic void skill(Character target) {\n  // ATTACK TARGET:\ntarget.hp\
    \ -= damage + magicPower;\n  prevDeco.skill(target);\n}\n```\n\nFor each Decorator\
    \ and Default Class, the function skill()\nwould execute the original code from\
    \ the class, then call\nskill() again for the next object.\n\nAnd the next. This\
    \ keeps occurring until skill() has been called for all attached Decorators, as\
    \ well as the Default Class.\n\nIn the above code, because we've attached two\
    \ Decorators to the original default class, skill() will execute for both of them.\
    \ All function calls to skill() will have the original target as the input as\
    \ well.\n\n```java\nCharacter me = new GreatSword(new FieryBattleAxe(me));\n```\n\
    \nCall to Skill, from object 'me':\n\n- GreatSword.Skill() executes\n- FieryBattleAxe.Skill()\
    \ executes\n- DefaultChar.Skill() executes\n\nBut what if a Default Character\
    \ with no Decorator objects attached calls skill()?\n\n```java\nCharacter you\
    \ = new DefaultChar(); you.skill(me);\n```\n\nBecause there aren't any Decorators\
    \ attached, only the Default class will have its skill() function called.\n\n\
    ## The Decorator Pattern in a Nutshell\n\nBorrowing a few elements from other\
    \ Design Patterns, the Decorator pattern is, indeed, one of the more complex patterns\
    \ to implement.\n\nJust understand its premise; it provides a way to dynamically\
    \ enhance and augment objects during runtime. Because it's one of the more essential\
    \ design patterns to gaming and any other situations which require evolving data\
    \ objects, implementing this pattern in a sound manner will be a great addition\
    \ to your repertoire.\n\n## Chapter 7: The State Pattern\n\nWhen creating data\
    \ classes, all fields, methods, and other traits have distinct sets of values.\
    \ Those values can be initialized when creating data objects. They can also be\
    \ changed whenever necessary.\n\nBut whenever there's a scenario in which a data\
    \ object needs to change nearly all of its traits, we encounter a problem. There\
    \ may be too many traits to change one-by-one and there may be one too many errors\
    \ that could emerge.\n\nTherefore, the better way to approach this situation is\
    \ to use class abstractions and polymorphism to simultaneously change the data\
    \ object's many traits. If the data object consistently changes during runtime,\
    \ then this approach becomes more appealing.\n\nEssentially, this is the State\
    \ Pattern in action - a data object that can change its traits during runtime,\
    \ depending on external factors or anything else that requires a particular behaviour.\n\
    \n## How it essentially works:\n\nThe data object will include one instance of\
    \ an interchangeable state. There can be as many different interchangeable states\
    \ as necessary.\n\nIf you change the state, you'll change the traits and behaviours\
    \ of the data object. You'll usually do this to accommodate whatever situation\
    \ your data class is in.\n\n## How the State Pattern differs from the Strategy\
    \ Pattern:\n\nBoth the State and Strategy patterns implement design variants suitable\
    \ for different scenarios. However, the main difference between them is the situational\
    \ context.\n\nThe Strategy pattern offers different ways to process an algorithm.\
    \ Its algorithm variants only apply once the procedure is called.\n\nOn the other\
    \ hand, State pattern objects exist continuously during runtime. A change in the\
    \ environment at any time can prompt a State pattern object to adapt.\n\n## Creating\
    \ the State Pattern:\n\nTo implement this design pattern, follow these steps:\n\
    \n- 1) Identify which class will be the ‘handler’ class. A key part of the functionality\
    \ from this class will depend on its current state.\n- 2) Create the State abstraction.\
    \ Define all common fields and procedures here.\n- 3) Create all the different\
    \ State Subclasses. Implement where necessary\n- 4) Make the Handler include an\
    \ instance of its current state. Its data type should be the Abstract Class. When\
    \ initialized with a constructor, the Handler should have a default state.\n-\
    \ 5) Develop the state-changing methods within the Handler class. There should\
    \ be a toggling method and a set method.\n- 6) Apply all other code that utilizes\
    \ the various States the Handler depends on.\n\nOverall, here is the UML Diagram\
    \ for the State Pattern:\n\n![](img/b45495ee91388ef419519d722f088b6f_136_0.png)\n\
    \nThe State pattern is perhaps one of the more frequently used design patterns\
    \ in existence. If implemented properly, the State pattern will give your data\
    \ objects a keen sense of adaptability.\n\nNow we'll explore the code that the\
    \ State pattern consists of.\n\n## JAVA-7a: The State Pattern, in Java\n\nHere\
    \ is how the State Pattern looks like in Java.\n\nFirst, we start with the Handler\
    \ Class. This contains a property which can be transformed into distinct states\
    \ - a scenario suitable for the State Pattern.\n\n```java\n/* The Handler Class\
    \ has:\n// - an instance of a transforming state class\n// Insert any other fields\
    \ or methods as you wish\n*/\nclass Handler {\nAbstractState currentState;\n```\n\
    \n```java\n/*\n// toggleState(): simple implementation\n// (Toggle currentState\
    \ into the Next State\n// via IF-ELSE statements)\n// - make sure to cover all\
    \ states available\n// re-implement if necessary\n*/\n```\n\n```java\nvoid toggleState()\
    \ {\n  if (currentState instanceof StateOne) {\n    currentState = new StateTwo();\n\
    \  }\n\n  if (currentState instanceof StateTwo) {\n    currentState = new StateN();\n\
    \  }\n\n  if (currentState instanceof StateN) {\n    currentState = new StateOne();\n\
    \  }\n}\n\nvoid setState(AbstractState in) {\n  this.currentState = in;\n}\n\n\
    // CONSTRUCTOR:\npublic Handler() {\n  this.currentState = new StateOne();\n}\n\
    ```\n\nNext is the State Abstraction. This will be a superclass common to the\
    \ different states that your handler contains.\n\n```java\nabstract class AbstractState\
    \ {\n  String commonField;\n\n  // IN & OUT: (your choice)\n  // EFFECT: (your\
    \ choice)\n  public void commonProcedure(){\n    // (add any implementation here)\n\
    \  }\n\n  // (add any other fields and methods)\n  // as you wish\n}\n```\n\n\
    And lastly, we implement the state subclasses. They are implemented uniquely;\
    \ their common fields are distinct and their common procedures can be implemented\
    \ in their own unique ways.\n"
  mdcn: "\n但为什么不增加其他武器呢？让我们也设计一把火焰战斧（Fiery Battle Axe）。像大剑（GreatSword）一样，它也有攻击作为 `skill()`\
    \ 方法。\n\n```java\nclass FieryBattleAxe extends Decoration {\n // 武器伤害\n int damage\
    \ = 2;\n int magicPower = 2;\n```\n\n```java\n// 构造函数:\n // (使用 super() 实现其作为超类型的逻辑)\n\
    \ public void FieryBattleAxe(Character c){\n super(c);\n }\n```\n\n```java\n//\
    \ 通用过程，由 FieryBattleAxe 实现\n // （将是一个攻击 Attack）\n public void skill(Character\
    \ target) {\n // 攻击目标:\n target.hp -= damage + magicPower;\n prevDeco.skill(target);\n\
    \ }\n```\n\n既然话说到这儿，我们也可以创建一个盾（Shield）：\n\n```java\nclass GoldenShield extends\
    \ Decoration {\n    int armorBonus = 10;\n\n    // 构造函数:\n    // (使用 super() 实现其作为超类型的逻辑)\n\
    \    public GoldenShield(Character c) {\n        super(c);\n    }\n\npublic//\
    \ 通用过程。由 GoldenShield 实现\n    public void skill(Character target) {\n        this.hp\
    \ += armorBonus;\n        prevDeco.skill(target);\n    }\n}\n```\n\n现在类已经准备就绪，这里是代码运行时的样子。\n\
    \n## 创建新对象：\n\n要创建一个新角色，你将它的数据类型设为抽象类，但将其初始化为默认类。\n\n```java\nCharacter me = new\
    \ DefaultChar();\n```\n\n## 添加装饰器\n\n要为新角色添加装饰器，你只需将该角色重新初始化为装饰器对象（Decorator），并将该角色作为输入：\n\
    \n```java\nme = new GoldenShield(me);\n```\n\n你甚至可以通过在装饰器内部创建装饰器来同时添加更多装饰：\n\n\
    ```java\nme = new GreatSword(new GoldenShield(me));\n```\n\n## 使用通用过程\n\n当你对通用过程进行函数调用时，\n\
    所有附加的装饰器以及默认对象，\n都会被一同调用。\n\n假设下面这行代码刚刚执行完毕：\n\n```java\nme = new GreatSword(new\
    \ FieryBattleAxe(me));\n```\n\n在下方的第二行中，我们调用了函数 `skill()`，并指向一个角色：\n\n```java\n\
    Character you = new DefaultChar();\nme.skill(you);\n```\n\n在这种情况下，`skill()` 函数究竟会做什么？\n\
    嗯，让我们回一下一个装饰器类中的 `skill()` 代码：\n\n```java\npublic void skill(Character target)\
    \ {\n  // 攻击目标:\ntarget.hp -= damage + magicPower;\n  prevDeco.skill(target);\n\
    }\n```\n\n对于每个装饰器和默认类，`skill()` 函数都会执行该类的原始代码，然后再次为下一个对象调用 `skill()`。\n\n以此类推。这种情况会持续发生，直到所有附加的装饰器以及默认类都调用了\
    \ `skill()`。\n\n在上面的代码中，由于我们在原始默认类上附加了两个装饰器，`skill()` 将为两者执行。所有对 `skill()` 的函数调用都将原始目标作为输入。\n\
    \n```java\nCharacter me = new GreatSword(new FieryBattleAxe(me));\n```\n\n从对象\
    \ 'me' 调用 Skill：\n\n- 执行 GreatSword.Skill()\n- 执行 FieryBattleAxe.Skill()\n- 执行\
    \ DefaultChar.Skill()\n\n但如果一个没有附加装饰器对象的默认角色调用 `skill()` 呢？\n\n```java\nCharacter\
    \ you = new DefaultChar(); you.skill(me);\n```\n\n由于没有附加任何装饰器，因此只有默认类的 `skill()`\
    \ 函数会被调用。\n\n## 装饰器模式简述\n\n借用其他设计模式的几个元素，装饰器模式确实是实现起来较为复杂的模式之一。\n\n只需理解它的前提：它提供了一种在运行时动态增强和扩展对象的方法。因为它是游戏以及任何其他需要演化数据对象的核心设计模式之一，以合理的方式实现这种模式将成为你技能库的极佳补充。\n\
    \n## 第 7 章：状态模式（State Pattern）\n\n在创建数据类时，所有的字段、方法和其他特征都有对应不同的值集。这些值可以在创建数据对象时初始化。它们也可以根据需要随时更改。\n\
    \n但当出现数据对象需要更改几乎所有特征的情况时，我们就会遇到问题。特征可能太多无法逐一更改，并且可能会出现过多错误。\n\n因此，处理这种情况的更好方法是使用类抽象和多态来同时更改数据对象的许多特征。如果数据对象在运行时持续发生变化，那么这种方法将更具吸引力。\n\
    \n本质上，这就是状态模式的体现——一个数据对象可以在运行时根据外部因素或任何需要特定行为的因素改变其特征。\n\n## 它的本质原理是：\n\n数据对象将包含一个可切换状态的实例。可以根据需要包含任意数量的不同可切换状态。\n\
    \n如果你更改了状态，就会更改数据对象的特征和行为。你通常这样做是为了适应你的数据类所所处的任何情况。\n\n## 状态模式与策略模式的区别：\n\n状态模式和策略模式都实现了适用于不同场景的设计变体。然而，它们之间的主要区别在于情境上下文。\n\
    \n策略模式提供了处理算法的不同方式。它的算法变体仅在调用过程时生效。\n\n相比之下，状态模式对象在运行时持续存在。环境的任何变化都可以促使状态模式对象进行适应。\n\
    \n## 创建状态模式：\n\n要实现这种设计模式，请遵循以下步骤：\n\n- 1) 识别哪个类将作为“处理器”（handler）类。该类功能的关键部分将取决于它的当前状态。\n\
    - 2) 创建状态抽象。在这里定义所有公共字段和过程。\n- 3) 创建所有不同的状态子类。在必要的地方实现。\n- 4) 让处理器包含其当前状态的实例。其数据类型应该是抽象类。当使用构造函数进行初始化时，处理器应该有一个默认状态。\n\
    - 5) 在处理器类中开发更改状态的方法。应该有一个切换方法（toggling method）和一个设置方法（set method）。\n- 6) 应用所有其他利用处理器所依赖的各种状态的代码。\n\
    \n总的来说，这里是状态模式的 UML 图：\n\n![](img/b45495ee91388ef419519d722f088b6f_136_0.png)\n\
    \n状态模式可能是最常用的设计模式之一。如果实现得当，状态模式将赋予你的数据对象敏锐的适应能力。\n\n现在我们探索状态模式包含的代码。\n\n## JAVA-7a：Java\
    \ 中的状态模式\n\n这里是状态模式在 Java 中的样子。\n\n首先，从处理器类开始。它包含一个可以转换为不同状态的属性——适用于状态模式的场景。\n\
    \n```java\n/* 处理器类包含：\n// - 一个转换状态类的实例\n// 根据需要插入任何其他字段或方法\n*/\nclass Handler\
    \ {\nAbstractState currentState;\n```\n\n```java\n/*\n// toggleState():简单实现\n\
    // （通过 IF-ELSE 语句将 currentState 切换到下一个状态）\n// - 确保覆盖所有可用状态\n// 必要时重新实现\n*/\n```\n\
    \n```java\nvoid toggleState() {\n  if (currentState instanceof StateOne) {\n \
    \   currentState = new StateTwo();\n  }\n\n  if (currentState instanceof StateTwo)\
    \ {\n    currentState = new StateN();\n  }\n\n  if (currentState instanceof StateN)\
    \ {\n    currentState = new StateOne();\n  }\n}\n\nvoid setState(AbstractState\
    \ in) {\n  this.currentState = in;\n}\n\n// 构造函数:\npublic Handler() {\n  this.currentState\
    \ = new StateOne();\n}\n```\n\n接下来是状态抽象。这将是处理器包含的不同状态的公共父类。\n\n```java\nabstract\
    \ class AbstractState {\n  String commonField;\n\n  // 输入与输出：（你的选择）\n  // 效果：（你的选择）\n\
    \  public void commonProcedure(){\n    // （在此处添加任何实现）\n  }\n\n  // （根据需要添加任何其他字段和方法）\n\
    }\n```\n\n最后，我们实现状态子类。它们的实现是独特的；它们的公共字段是不同的，它们的公共过程也可以以它们独特的方式进行实现。\n"
