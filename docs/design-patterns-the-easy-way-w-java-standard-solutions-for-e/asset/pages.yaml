  md: "# Step 1: The Component Superclass\n\nFirst, we'll create the superclass that\
    \ the File and Folder classes are based on.\n\nWe're coding in Java, so we have\
    \ the Abstract Class available.\n\nFor now, let's add the following fields to\
    \ the superclass: the name, the date created, and the date last modified.\n\n\
    ```\n/*\n// Component is the superclass which File and Folder classes extend\n\
    // It has:\n// - Name, as a String\n// - the Date Created\n// - the Date Last\
    \ Modified\n// It can:\n// - rename itself\n// - update the Last Modified date\n\
    \ */\nabstract class Component {\n  String name;\n  Date dateCreated;\n  Date\
    \ dateLastModified;\n}\n```"
  merge: -1
  pgno: 33
- img_proc: true
  md: "# Step 2: Customizing the Component Constructor\n\nNext, we'll code a modified\
    \ version of the constructor for the Component. When a new component is created,\
    \ its name will be set and its two date fields will be set to the current date.\n\
    \nThe Files and Folders that will later extend this superclass will eventually\
    \ use the same constructor as well.\n\n```\nabstract class Component {\n    String\
    \ name;\n    Date dateCreated;\n    Date dateLastModified;\n    /*\n    // INPUT:\
    \ a String\n    // Custom Constructor for the Component Class,\n    // Upon creation,\
    \ the dates created and last modified\n    // are set to the current date an object\
    \ would be created\n    */\n    public Component(String n) {\n        this.name\
    \ = n;\n        this.dateCreated = new Date();\n        this.dateLastModified\
    \ = new Date();\n    }\n}\n```"
  merge: -1
