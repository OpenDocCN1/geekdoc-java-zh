  md: "# JAVA-2a: The Composite Pattern, in Java\n\nHere is how the Composite Pattern\
    \ looks like in Java:\n\n```\n/*\n// Component is the superclass which File and\
    \ Folder\nclasses extend\n// You may define any fields and methods shared by both\n\
    subclasses\n*/\nabstract class Component {\n  // insert any amount of fields and\
    \ methods\n  // where necessary\n  String someField;\n  public void someMethod()\
    \ {}\n}\n\n// General Item Class (as File):\n// contains all fields and methods\
    \ defined at Component\nclass File extends Component {\n}\n\n```"
