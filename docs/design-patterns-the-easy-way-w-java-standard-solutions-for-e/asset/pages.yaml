  md: '# Creating the Decorator Pattern:


    Here is the step-by-step plan for implementing this design

    pattern:


    +   1) Create a general abstraction that covers ALL subclasses

    and variants.


    +   2) Create the default subclass. This will directly extend

    your general abstraction from earlier.


    +   3) Create the decoration subclass. Like the default

    subclass, this will also directly extend your general

    abstraction.


    +   4) Make sure the decoration subclass contains the

    previous decoration or the default class as one of its fields

    (set the variable type as the general abstraction!). This,

    along with the next step, are the key traits that allow

    multiple decorations to be dynamically added to the

    default class.


    +   5) Make sure the constructor for the decoration subclass

    inputs either a Decoration or the Base Object (again, set

    the input type as the general abstraction!) and this input is

    set as the previous decoration.'
