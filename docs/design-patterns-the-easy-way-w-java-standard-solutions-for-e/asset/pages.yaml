  md: '# JAVA-2b: Implementing the Composite Pattern


    Use an IDE of your choice for the code below. Online IDE''s, such as codechef.com,
    rextester.com, ideone.com, or codepad.org are a great choice.


    In this chapter, we encounter a situation which suggests having the Composite
    Pattern as a viable solution. Then, we''ll be coding the Composite Pattern step-by-step.


    # File Manager


    Imagine you are a software engineer at a very popular social media site.


    The next website update will have a really cool feature - enable users to upload
    and organize data files of their choice. And you''re tasked with implementing
    this functionality. You know you have to design the File and Folder classes, but
    you also realize that they share too many traits, such as name, date created,
    date modified, a thumbnail icon, etc.. So you think to yourself, there must be
    a more simple way to implement this.


    The first thing that comes to your mind is to implement the Composite Pattern.
    This is an ideal situation to apply it as well.'
