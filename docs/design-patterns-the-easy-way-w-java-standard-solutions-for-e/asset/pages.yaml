  md: "So in this tutorial chapter, let's go through the steps in setting up the design\
    \ pattern.\n\nThen, you'll have a chance to practice what you've learned by extending\
    \ the work.\n\n# Step 1: The Factory Interface\n\nFirst, we'll create the Interface\
    \ that all the ball-creating Factory classes will implement.\n\nFor now, it will\
    \ only have one method: creating & returning instances of sports balls.\n\n```\n\
    // the BallFactory interface:\n// - interface for how a ball will be created\n\
    interface BallFactory {\n/*\n// INPUT: none\n// OUTPUT: a Sports Ball object\n\
    // EFFECT: Creates a Sports Ball;\n// Classes that implement this will have their\
    \ own\ndistinctions in making one\n*/\n    public SportsBall createBall()();\n\
    }\n```"
