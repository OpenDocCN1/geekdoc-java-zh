  md: '# Chapter 8: The Facade Pattern


    If you''ve ever driven a car before, you would know how simple it is to operate
    it. Starting the car would take a twist of your keys in the ignition (or nowadays,
    a press of a button). To go faster, you would press the gas pedal. To slow or
    stop, you would press the brake pedal. And the steering wheel has an obvious function.


    But a car is also a very complex system. Starting a car would require ample power
    from the battery. Afterwards, it would require enough gasoline from the tank.
    The spark plugs need to be functional as well. There has to be enough fresh oil
    to move the car engine pistons and other parts. There''s also other things that
    have yet to be mentioned - and this differs from car to car. If everything is
    okay, the spark plugs ignite the engine cylinders and create enough energy in
    the engine to propel the car.


    Also, steering, accelerating, and braking each require a system of components
    to work together in unison. But we often don''t think about this because, from
    the driver''s seat, we can only see the components visible to us. In other words,
    a Facade.'
  merge: -1
  pgno: 156
- img_proc: true
  md: '# How the Facade Pattern Works:


    The Facade Pattern gives you a top-level component that oversees the functionality
    of a complex subsystem. To operate the subsystem, you would only need to do it
    through the Facade Pattern. The result is a far more simple system where you only
    need to access the Facade Pattern for functionality.


    Looking back at our car analogy, its provided interface in the driver''s seat
    is Facade pattern; it lets the driver control the system with a set of simple
    gestures. Meanwhile, it coordinates a complex system of components in response
    to the driver''s commands.


    # Creating the Facade Pattern:


    To implement this design pattern, first identify the Major Procedures and/or Behaviours
    we want to simplify.


    If using an interface, follow these steps:


    +   1) Create the Facade interface that contains those major procedures


    +   2) Create the general client class that implements the Facade interface'
  merge: -1
  pgno: 157
- img_proc: true
  md: 3) The general client should implement ALL the major procedures. Contain as
    many component instances as necessary.
  merge: -1
  pgno: 158
- img_proc: true
  md: '+   4) If necessary, you may create multiple Facade interfaces and client classes.
    If so, repeat steps 1 to 3.


    +   5) Create subclasses for the general client classes whenever necessary. Any
    code that accesses the system does it as a client subclass.


    If using an encompassing class, follow these steps instead:


    +   1) Create the general “Facade” class. This class should implement ALL the
    Major Procedures mentioned earlier. Contain as many component instances as necessary.


    +   2) Create a general client class. It should contain an instance of the Facade
    class.


    +   3) If necessary, you may create multiple Facade classes and repeat steps 1&2.


    +   4) Create subclasses for the general client class whenever necessary. Any
    code that accesses the system does it through the Facade class within the client
    subclasses.


    Whichever steps you take depends on the situation you encounter. So you’ll have
    to judge whether it’s better to have one encompassing ‘Facade’ wrapper class.'
