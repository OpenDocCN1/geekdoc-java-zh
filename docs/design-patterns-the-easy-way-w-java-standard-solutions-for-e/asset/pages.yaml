  md: "# JAVA-1a: The Factory Pattern, in Java\n\n==== ==== ==== =====\n\nHere is\
    \ how the Factory Pattern looks like Java:\n\n```\n// Factory is implemented by\
    \ any subclasses that need to\nuse it\ninterface Factory {\n    // INPUT: your\
    \ choice\n    // OUTPUT: your choice (set to Void by default)\n    // Constructor\
    \ for Classes that implement this\n    interface\n    public void createObject();\n\
    }\n```\n\n```\n// SubFactory1:\n// creates distinct objects based on Factory Interface\n\
    class SubFactory1 implements Factory {\n    // This implements the same function\
    \ outlined in the\n    interface\n    public void createObject() {\n        //\
    \ include ANY unique distinctions for this creator\n        class\n        //\
    \ any other code here\n    }\n```"
