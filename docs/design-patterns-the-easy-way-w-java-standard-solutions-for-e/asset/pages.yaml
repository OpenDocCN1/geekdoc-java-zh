- img_proc: true
  md: '# Chapter 7: The State Pattern


    ==== ==== ==== ====


    When creating data classes, all fields, methods, and other traits have distinct
    sets of values. Those values can be initialized when creating data objects. They
    can also be changed whenever necessary.


    But whenever there''s a scenario in which a data object needs to change nearly
    all of its traits, we encounter a problem. There may be too many traits to change
    one-by-one and there may be one too many errors that could emerge.


    Therefore, the better way to approach this situation is to use class abstractions
    and polymorphism to simultaneously change the data object''s many traits. If the
    data object consistently changes during runtime, then this approach becomes more
    appealing.


    Essentially, this is the State Pattern in action - a data object that can change
    its traits during runtime, depending on external factors or anything else that
    requires a particular behaviour.'
  merge: -1
  pgno: 133
- img_proc: true
  md: '# How it essentially works:


    The data object will include one instance of an interchangeable state. There can
    be as many different interchangeable states as necessary.


    If you change the state, you''ll change the traits and behaviours of the data
    object. You''ll usually do this to accommodate whatever situation your data class
    is in.


    # How the State Pattern differs from the Strategy Pattern:


    Both the State and Strategy patterns implement design variants suitable for different
    scenarios. However, the main difference between them is the situational context.


    The Strategy pattern offers different ways to process an algorithm. Its algorithm
    variants only apply once the procedure is called.


    On the other hand, State pattern objects exist continuously during runtime. A
    change in the environment at any time can prompt a State pattern object to adapt.'
  merge: -1
  pgno: 134
