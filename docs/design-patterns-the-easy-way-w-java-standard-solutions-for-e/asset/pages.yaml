  md: '# Chapter 2: The Composite Pattern


    Picture this scenario: you have to organize your data in a hierarchal manner.
    They seem to somehow resemble ''files'' and ''folders''.


    As you and other computer users know, files go into folders and folders can go
    into other folders as well.


    You also want to do this in a way that doesn''t replicate unnecessary code.


    So what do you need?


    The Composite Pattern.


    # How it essentially works:


    You have two distinct classes: a File class and a Folder class. Or Item and Group.
    Clothing and Bag. Toys and Box. Any combination of two classes, in which one of
    them is a collection composed of both types.


    However, both classes may have way many similar traits, methods, and fields. You
    realize you may need to write twice the code that you would normally do - one
    for the items and one for the groupings.'
  merge: -1
  pgno: 26
- img_proc: true
  md: 'The solution here is to have them extend a common superclass or abstract class
    - a component. This includes one key distinction; the Group class contains a collection
    of this superclass. And because both classes extend a common superclass, the Group
    class can have a collection of either items or groups.


    For example, let''s say you have two classes: Clothing and Bag. A Bag can contain
    both clothes and other bags. They both share similar characteristics such as name,
    description, etc.. You realize how unproductive it is to write separate code when
    it really should be under the same code (i.e. when getting all the names would
    need calls from both Clothing.getName() and Bag.getName()).


    Therefore, you apply the Composite Pattern. Both Clothing and Bag classes extend
    a new superclass, Item. The Bag class is modified to have a collection of Items
    (which can be either Bags or Clothing).'
  merge: -1
  pgno: 27
