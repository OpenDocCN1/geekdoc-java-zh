  md: '# INTRODUCTION


    circumstances. He wrote before breakfast and then immediately afterward. He worked
    until lunch, which, unless he had a business meeting, didn''t last long. In the
    afternoon he would break to exercise, lifting weights in the backyard whirling
    a jump rope, or shadowboxing. Before we got home from school he was back at it,
    and after dinner would often work until the late news came on the TV. He worked
    seven days a week. He never took a vacation that wasn''t a research trip... and
    sometimes, when we did travel, he would pack a portable typewriter that had been
    “liberated” in Germany, and would write then, too.


    I''m not sure when he took on this type of schedule, but I think it started in
    Oklahoma in the late 1980s. There was a certain point when he got serious; you
    could see it in his work. At first he wrote poetry and stories that were both
    personal and dark. Louis Lamore (the way he was spelling the name the Lamore family
    arrived in Choctaw) was a bit of a pretender, “artiste.” He was a young man who,
    though he had talent, traded a great deal on his personality and good looks. In
    many ways he seemed to be writing more to augment his social life than find a
    career.


    Then something happened. Perhaps it was a sudden sense of vulnerability, of the
    years passing, of the realization that he had roamed the world, he was over thirty,
    living with his parents, and there were a few things that he could actually do
    that would earn him any money. Maybe it was the advice of a mentor or a warning
    from his father or elder brother. Maybe it was some small success that made him
    recognize that his future could be realized, rather than simply dreamt about.
    Whatever it was, it left him changed and highly motivated.


    The point of view of his writing shifted. In the early period, the characters
    were stand-ins for himself, the stories drawn from his life or those he had known.
    In some ways these stories were actually better written, and certainly more polished,
    than some that came later ... to succeed professionally, he was going to learn
    to communicate in a manner that was more universal than personal. He would need
    to entertain the masses rather than members of writers'' groups and readers of
    minor literary magazines.'
  merge: -1
  pgno: 21
- img_proc: true
  md: '# INTRODUCTION


    It was just before this moment, through accident or the hand of destiny, Louis
    also met an angel. In Education of a Wandering Man he said:


    At one time, trying desperately to write something that would sell, I Underwove
    a typewriter. For several months I paid the rent. Then came a time when I could
    not, so I wrote him a note and explained. I never heard from him again. No bill,
    nothing. That typewriter meant more to me than anything. . . .


    ![](img/91369ce30a67d79ba0528698065fad14_22_0.png)


    Being able to write every day opened the creative pathways and kept them open.
    Becoming good at it wasn''t quick or easy, but eventually Dad had practiced so
    much that creativity became somewhat automatic. He set himself detailed goals
    and worked hard to achieve them, crossing projects of typewriter lists with red,
    green grease pencil. By the late 1940s his goal was to sell a short story a week.'
  merge: -1
  pgno: 22
- img_proc: true
  md: '# INTRODUCTION


    Not to finish a story a week. Sell.

    Even he''d had a fair amount of success by then, publishers would not take everything
    he wrote, so he had to complete quite a few more than fifty-two stories a year
    in attempts to make his quota.

    The work didn''t pay much. Even that volume of writing did little more than pay
    the rent. Speed was essential.


    I have no memory of how we were trained, my sister and I, but we knew how to approach
    my father if he was working and we wanted his attention. We would enter his office,
    picking out our way through the piles of books and papers. We would stand to one
    side of him, just within his peripheral vision, and silently wait while he worked.
    Sometimes he would lift his fingers from the keys and say, "Just a minute." Then
    he would go on and complete a thought or himself to a place in the story that
    would remind him what he had been intending to say next. Then he was yours...


    ...for about ten minutes. Before long, you could see the story or some innate
    discipline calling him back. We never had to worry about interrupting him because,
    he was happy to be briefly distracted, he guarded his work very carefully, and
    it never occurred to us that he might behave in a different way. "You run along
    now, I have to get back to work." He would lean forward then, hunting and pecking
    at the keyboard, back in the story and perfectly in tune with where he had left
    off. It seemed as if he always knew exactly where he was going and no interruption
    could confuse him or even make him pause for very long.


    The descriptions of Louis L''Amour''s writing process were legendary. According
    to publicists and popular myth, he did not outline and did rewrite. He embodied
    every young writer''s fantasy of what the process would be. He cranked a page
    into the typewriter, started typing, and with absolute confidence, didn''t look
    back until he reached the end of the story. All action, no agonizing.


    Everything he wrote was good enough to immediately sell, or so the story went.
    The words simply flowed out of him. He did not get writer''s block. He was not
    temperamental.'
  merge: -1
  pgno: 23
- img_proc: true
  md: '# INTRODUCTION


    These may have been exaggerations, but they were not utter falsehoods or public-relations
    hype. He bragged he could sit with his typewriter on his knees and write a novel
    in the middle of Sunset Boulevard...and when a German magazine asked him to shoot
    pictures of him doing so, he did it, producing half of his day’s output during
    the photo shoot. He was already so well-known for that particular boast that a
    motorist leaned out the window of his car and yelled, “You’ve got to be Louis
    L’Amour!”


    ![](img/91369ce30a67d79ba0528698065fad14_24_0.png)


    Mom and Dad in their apartment in West Hollywood.


    Before I was born, Louis made the transition from writing short stories to writing
    novels. The length of the stories changed, the publishers changed, the way the
    material was distributed changed, but Dad’s work habits did not. His income grew,
    but he also had a family to support. We had a very comfortable middle-class lifestyle
    as long as he could write three or four books a year. If he sold a movie, then
    maybe my mother could redecorate a room, or we would buy a new car. Financial
    considerations aside, Dad still took great pride in having a lot of story ideas
    and in the speed with which he could produce a page or a chapter or a novel.'
  merge: -1
  pgno: 24
- img_proc: true
  md: '# INTRODUCTION


    Progress was his byword. Louis claimed he could “simply” put himself and his characters
    in a situation and the story would take off, virtually telling itself. He loved
    beginnings…loved them to the point that he occasionally shortaged the ending of
    a story because he was excited about starting the next one. He was powerfully
    optimistic, focused on productivity, the future, whatever was next. His frame
    of mind was such a potent force that, occasionally, Dad would announce stories
    that he had just thought of as if they were finished….In the reality he made for
    himself, there was little difference between thinking of something and completing
    it.


    His presence was big and happy and generous. What he made did look easy and, for
    the most part, it was. A great deal of the magic behind us was that he wrote so
    effortlessly that the material read the same way…. The energy that any writer
    puts into his work is the energy a reader would take out of it. Rare among writers,
    Louis loved the writing process.


    Smoggy summertime. The early 1970s. A major transition in our lives. The L’Amour
    family—my father, mother, sister, dog, bird, and myself—are leaving West Hollywood
    for a new home in another part of town.


    After many years of hard and constant work, Dad’s fortunes changed. The new street
    is quiet and elegant, not far from the campus of UCLA, the opposite of the bohemian
    kindness of our old neighborhood. Louis is enclosed in the new house, typewriter
    up on a carpenter’s bench in a room just off the entrance hall. The boxes containing
    the books and papers he needs are most stacked around him. It will be a couple
    of years before the new house is fully furnished, before my dad’s new office is
    built. Right now the move and stress of buying a bigger home is enough for all
    of us.


    My mother and I trek back and forth across town. Packing Dad’s papers and books
    is not something she is willing to trust to the movers. She’s got a borrowed station
    wagon and a twelve-year-old kid, to help her haul a considerable amount of stuff.
    Dad stays at home.


    It’s not three or four trips we have to make, it’s dozens. There are nearly eight
    thousand books, most of them hardback. I have always wondered what the new owners
    of the West Hollywood house thought; every wall was'
  merge: -1
  pgno: 25
- img_proc: true
  md: '# INTRODUCTION


    xxiii


    covered in shelves. We had nearly been forced out of the house by the sheer volume
    of Dad''s books and papers.


    The job takes weeks, moving from the echoing, dusty rooms of our old home to the
    new one, which, larger, is rapidly filling with piles and boxes. To be sure, most
    of the boxes are full of books, but many contain papers, notebooks, and random
    stacks of manuscripts. It''s hard to believe Dad actually fit all this stuff in
    our old place.


    For a few years after the move that “stuff” remained stacked in the living room
    of our new house, and I occasionally saw my dad sorting through it, searching
    for one thing or another. Later, after his new office was built, most of those
    materials migrated down there, and the new room was big enough for him to add
    exponentially to their number. I can''t say that the rest of us thought about
    what this mass of papers contained. “Dad’s work,” or “Dad’s mess”—that was as
    far as we went with it. It was only after his death, over fifteen years later,
    we discovered many unexpected things...


    In the 1970s and ''80s, after paying his dues for forty years, Louis L’Amour was
    the rock star of the paperback-book business. No title he put his name on had
    ever gone out of print, and his books were translated into more than twenty languages.
    When he appeared to do


    ![](img/91369ce30a67d79ba0528698065fad14_26_0.png)'
  merge: -1
  pgno: 26
- img_proc: true
  md: '# INTRODUCTION


    a signing, lines stretched around the block. The movie business has given a name
    to that kind of success: blockbuster.


    Critics and commentators were either swept away by his infectious writing style
    or they struggled desperately to explain his popularity. If audiences had found
    his work to be no more than disposable, momentary entertainment, dismissing it
    would have been easy—but readers kept coming back, not only buying every new book,
    but rereading the old ones until they fell apart and were purchased again. By
    1980, Bantam Books estimated he had sold one hundred million copies. By the time
    he passed away in 1988, that number was topping two hundred million.


    His success, though long in coming, was also limiting. Since the end of World
    War II, Louis had made his name Westerns. He loved the West, and he being successful
    and making so many people happy with the entertainment he provided ... but he
    also felt trapped. Trapped in the Western genre. Trapped by his own success.


    The Walking Drum, Louis''s epic twelfth-adventure novel, was published late in
    his career. However, it was written in 1960, a time when no publisher wanted anything
    but a Western from Louis L''Amour. It was not his only attempt to break away into
    new territory during that era. All of them failed, at least in the short term,
    though the blow of not being able to expand his horizons by the increasing success
    of what he eventually began to call his "frontier" stories.


    By the mid-1970s rolled around, Louis was a lot smarter about his approach to
    working in other genres — and he became a good deal successful, which made publishers
    feel less need for caution. Incrementally approaching the issue of change, he
