  md: '# INTRODUCTION


    to agonize over anything, yet as I explored the materials he left behind, I realized
    that his writing was a much more laborious process than I had ever imagined. Possibly
    it was a more laborious process than he would even admit to himself! Working through
    these mysterious fragments of stories made us realize how much we had taken for
    granted.


    However, as this book will show, some of his most interesting material came to
    a halt after a few pages or a few chapters. In some ways, this is the archive
    of his most ambitious work... and, of course, that is why it was difficult to
    write. In my opinion, what Louis was unable to complete is often more revealing
    than what he did complete.


    Because of the unfinished nature of some of these manuscripts, I am sure that
    reading this book will be a frustrating experience. For many readers, I suspect
    two particular questions will come over and over. I will answer them as best I
    can right now...


    The first: "Yes. That is really where that story ended." Sometimes materials in
    this book will end in the middle of a sentence or thought. Louis either knew what
    he was going to write next and so didn''t need to have anyone finish these manuscripts
    or at what it would be, or didn''t know what he was going to write next and he
    ripped the page out of the typewriter and moved on to something else.


    The second: "No. With a few exceptions, we are not going to have anyone finish
    these manuscripts or otherwise change them from what we see." We are intentionally
    leaving this as the final form for many of Louis L''Amour''s finished materials.


    I believe deeply that, at best, fiction is a partnership or collaboration between
    the author and the audience. Even with a finished work, a good writer hints, suggests,
    and directs, but then allows the reader to complete the scene, or the character,
    or the plot, or the meaning of the story. Imagination is the gift that you bring
    to the work and there is plenty here for you to imagine. In the end, Louis L''Amour''s
    Lost Treasures is not so much about what these treatments and fragments of stories
    might have been, but what they tell us about their creator.


    I find myself to be content with the unknown, and recognize'
