    There is a canyon in the Altyn Tagh, far west of Sukhhain-nor, from which, in
    a thousand years, no man has ever returned alive.


    This story is told in the marketplace of Suchow, east of the Jade Gate, and it
    is whispered among the camel drivers of Kashgar, far to the west, beyond the great
    desert of the Taklamakan.


    Yet it is one of many such tales, for this is a land that breeds legend and the
    story you hear tomorrow in Tashkent or Hami may be the story that was told in
    the same cities, and with the same inflections, at any time since the first camels
    slogged westward, their goods bound from far Cathay to Egypt, Rome, or Byzantine.


    The massive, ice-sheeted range of the Altyn Tagh and the mysterious Kuen Lun forms
    a vast rampart dividing the province of Sinkiang from the fortress land of Bodh,
    known to Westerners to Tibet. That gigantic wall, seemingly impassable, is penetrated
    here and there by canyons and passes that allow access to the reaches of the mountains
    and the lands beyond. Some of these passes lead from Sinkiang to Tibet . . . but
    who can say, dares to even guess, where others may lead?


    To the north, along the Tien Shan mountains and the far edge of the great basin,
    the camel and truck caravans bound west from the Jade Gate now travel the route
    that leads from Hami to Turfan and Aksu.


    It was not always so. Two thousand years ago the silk route lay to the south along
    the foothills of the Altyn Tagh and the Kuen Lun. But with the passing of time
    the bed of the Tarim River found a new course. The great lake of Lop Nor vanished,
    creeks and springs dried up, and the southern route was all but abandoned.


    Still, in the wastes of the Taklamakan, one of the earth''s most formidable deserts,
    there remain ancient walls and towers, the ghosts of forgotten cities. Some-'
