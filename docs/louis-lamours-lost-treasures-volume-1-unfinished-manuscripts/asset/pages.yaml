    but to questions asked of the Cherokees he received only evasive replies, replies
    that whetted his interest.


    In general he had found the Cherokees a courteous people, and usually willing
    to explain any of their own customs that aroused interest.


    Among the Georgians themselves he found few who knew anything about the Cherokees,
    and most of them doubted they were interesting. Here and there he found a degree
    of sympathy for their plight, but these people felt that decisions had been based
    upon much that had gone before their time--and seemed less aware of the role played
    by a few self-seekers and politicians who wanted the vote. There was also a hard
    core of people who saw the Cherokees prospering and believed it was something
    in the land they owned rather than their own energy brought them such prosperity.
    These wished to drive the Cherokees from the land so that they might have it.


