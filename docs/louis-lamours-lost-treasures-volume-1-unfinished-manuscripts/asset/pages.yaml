    191


    There were so many rewrites that I could see the storytelling begin to deteriorate;
    even as he got certain aspects of the plot nailed down, he began to take so much
    for granted that he glossed over them, probably because he knew them too well
    by then. Louis did not like rewriting for this exact reason—unless a writer truly
    enjoys revision (and he did not), too many drafts can suck the life out of a story
    before it ever gets going.


    It is very rare to see Louis sweating a bunch of little details like he did in
    these drafts. Usually, he was very self-assured about what he was doing and forged
    ahead with certainty. Even though he gave up on The Golden Tapestry, it seems
    like this is a pretty solid concept. Ultimately, he did get all troublesome details
    nailed down in one version or another, and as you will see, he had a version of
    the entire story mapped out. Louis''s biggest issue when it came to writes was
    that he didn''t bother to do a careful analysis of the strengths and weaknesses
    of each draft. That, combined with the lack of a secretary (or a word processor!)
    to quickly shuffle all the good bits together, may may have caused some of these
    story concepts to be left behind.


    The bulk of these “Istanbul drafts” seem to have been written in 1960 and ''61,
    the same era when he wrote the first version of The Walking Drum and tried to
    develop several other ideas to break out of the Western genre. Only one novel,
    Sackett, was published in 1961, and it ended up being a lean year. That was also
    the year I came along, and Mom and Dad were forced to move because their apartment
    building didn''t allow children.


    Eventually, they bought a house, and it is my guess that the financial pressure
    of the failed attempts to broaden his style, then my being born, plus the down
    payment on the house pushed him to accept the deal to write the novelization of
    the movie How the West Was Won, which came out in 1962.


    At some point it seems Louis tried to sell The Golden Tapestry as a motion picture,
    no doubt feeling could afford to go back to it if he had a buyer set up. No deal
    was made, but at least we will get the benefit of being able to read a treatment
    that suggests how the story might have developed and then ended if he had written
    the full novel.'
