    I''m not sure why this book wasn''t eventually completed; possibly it was because
    of changing priorities in Louis''s career. The struggle to break into the hardcover
    business may have become less important as his success replaced the need to be
    well reviewed. He also became more focused on planning his "three family" (Sackett,
    Chantry, Talon) series and recognized sooner or later, because of changes in the
    book business, he was going to be able to publish in hardcover without changing
    genres. While Louis very much wanted to write other kinds of material, he also
    wanted to win widespread acceptance for his Westerns, and as much as he liked
    a challenge, he preferred to succeed without having to accommodate others. It
    was a tension that ran like a subtle stream throughout his later life.'
