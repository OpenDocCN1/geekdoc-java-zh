  md: '# INTRODUCTION


    By Beau L''Amour


    This this book may drive you crazy. What it contains is mysterious and fascinating,
    frustrating, and, more often than not, tragically incomplete. It is a look behind
    the curtain into a world of what might have been. It is a look under the hood
    at how the machinery of a writing career that lasted over half a century functioned.
    It is also a look at the struggle to express an idea, and how difficult it can
    be to bend the unruly process of creativity to one''s will. This is the story
    of the debris, the chaff, the waste heat that a writer produces. The stuff that
    never makes it to the editor''s desk. The stack of pages never graced by a final
    "The End."


    It is humbling to think that, with a career that produced ninety-one novels and
    nearly four hundred short stories, articles, screenplays, and poems, Louis L''Amour
    also left behind hundreds of unfinished works. It is comforting to know that,
    regardless of how prolific he was, he was human, that he had failures, weird ideas,
    and dreams he couldn''t quite fulfill. It is amazing to realize that his imagination
    stretched well beyond the tremendous variety of work that he eventually published,
    from Westerns and crime stories, high adventure and historical romance, to stories
    he planned in science'
  merge: -1
  pgno: 18
- img_proc: true
  md: '# INTRODUCTION


    fiction, horror, and what can only be called the genre of mystical or

    spiritual adventure.


    You may not find a hidden literary masterpiece between these\covers, but you will
    get a sense of the intensity of a prolific writer''s

    journey, an idea of the scope of all a truly creative person can struggle

    to wrap his or her mind around.


    Within these pages I have included some of the most interesting

    material from what is a considerable archive. Many examples are sto-

    ied Dat discussed with us around the dinner table; others were

    completely unknown to me and inspired a good deal of research. I am

    reluctant, to do too much explaining, reluctant to organize

    this book too carefully. Exploring these manuscripts for the first time

    gave me a wonderful feeling of surprise and discovery. It is an experi-

    ence that I do not wish to deny to others.


    But I will try to create context ...


    It is still dark. Early morning. A late 1960s winter and the previous night''s

    rain is still dripping from the eaves.


    The neighborhood is just off the Sunset Strip in a neglected sliver of

    Los Angeles County sloping down from the Hollywood Hills. It is a com-\unity of
    nightclubs, gas stations, and small offices where, up flights

    of stars, the agents of rarely employed actors play their trade.


    West Hollywood is the dark sibling of Beverly Hills, which lies right

    next door. Beatnik poets and hangout movie stars frequent the coffee shop on

    the corner. The Doors, Led Zeppelin, and Buffalo Springfield play at clubs

    like the Whisky a Go Go, the Rozy, and Gazzarri''s, and crowds clash with

    police when the neighbors complain about the noise and traffic. The edges of

    parking lots and the overgrown hillsides, even the sidewalks themselves,

    dotted with hippie, camping (for lack of a better word) any place they

    find a spot where no one will hassle them. They come to this part of LA\following
    a dream, or the music, or just one another. The place is a motley

    riot of counterculture, creativity, and confusion.


    The sound of typewriter keys clicking greets me as I wake. One

    downstairs dressed for school. The hallway that leads to the kitchen ends in

    three doors. Ahead, a bathroom; to the left, my father''s office, a small room'
  merge: -1
  pgno: 19
- img_proc: true
  md: 'choked with books and papers in a small house choked with books and papers.
    The light is on above his desk, his chair is empty. To the right the kitchen,
