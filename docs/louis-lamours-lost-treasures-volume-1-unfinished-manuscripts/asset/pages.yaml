  md: '# WHAT IS LOUIS L’AMOUR’S

    LOST TREASURES?


    Louis L''Amour''s Lost Treasures is a project created to release some of the author''s
    more unconventional manuscripts from the family archives.


    Currently included in the project are Louis L''Amour''s Lost Treasures: Volume
    1 and Volume 2, which will be published in the fall of 2017 and 2019 respectively.
    These books contain both finished and unfinished short stories, unfinished novels,
    literary and motion-picture treatments, notes, and outlines. They are a wide selection
    of the many works Louis was not able to publish during his lifetime.


    In 2018 we will release No Traveller Returns, L''Amour''s never-before-seen first
    novel, which was written between 1938 and 1942. In the future, there may be a
    selection of even more L''Amour titles.


    Additionally, many notes and alternate drafts to Louis''s wellknown and previously
    published novels and short stories will now be included as "bonus feature" postscripts
    within the books that they relate to. For example, the Lost Treasures postscript
    to Last of the Breed will contain early notes on the story, the short story that
    was discovered to be a missing piece of the novel, the history of the novel''s
    insp-'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'ration and creation, and information about unproduced motion-picture and comic
    book versions.


    An even more complete description of the Lost Treasures project, along with a
    number of examples of what is in the books, can be found at louisamourslosttreasures.com.
    The website also contains a good deal of exclusive material, such as even more
