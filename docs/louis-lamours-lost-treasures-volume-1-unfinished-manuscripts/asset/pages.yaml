  md: '# XXVI INTRODUCTION


    Working all day, every day, for decades had pretty much programmed him to write
    this way; having a story in the back of his mind for months or years before he
    put it down on paper allowed him to work out many of the details unconsciously.
    Once he started work, he really had little idea what was going to come out, and
    that kept his approach and the reader''s experience consistently fresh.


    Although he was occasionally accused of writing in a formulaic manner, by the
    1950s Louis found it difficult if not impossible to accept any influence from
    the outside. Whatever his formula was, it was based on some internal and little-understood
    aesthetic. This made working under the direction of publishers and movie executives
    nearly impossible. A number of the stories that you will read within these covers
    were victims of those limitations. At times of financial stress, or in moments
    when he dreamed of doing something different, Louis would hammer out a treatment
    (a “treatment” is much like the description of a story, rather than the story
    itself) and then try to get a publisher or movie studio to pay him up front for
    executing the final, finished story.


    However, if he was lucky enough to receive that advance, he would become frustrated
    by corporate executives'' attempts to get him to conform to their “creative” expectations
    or schedules. It is true that very few writers of any sort writing treatments,
    and even fewer do them well. In Louis''s case it was so antithetical to the way
    he liked to work that on a number of occasions I remember him returning the money,
    regardless of how much we needed it, and going back to the methods he came by
    naturally. Writing a treatment was nearly always a recipe for disaster; Louis
    was lucky enough to work out the story all the way through to the end, he was
    not very interested in doing so again when the time came to write the finished
    version. He knew what was going to happen. He was ready to move on to something
    else.


