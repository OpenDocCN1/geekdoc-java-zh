    The next story is also set in Bangkok. For a while, I wondered returning to write
    about this city was due to the influence of a pair of Thai brothers my mom and
    dad met in the late 1950s. They originally came to Southern California to go to
    college, and have since become virtual cousins of ours. We have now known four
