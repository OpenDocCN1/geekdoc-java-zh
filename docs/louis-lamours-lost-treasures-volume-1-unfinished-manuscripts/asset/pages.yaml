    COMMENTS: The mention in this story of the nightclub Chez Eve and the fact that
    Gwen was seen dancing with a "French Colonel" suggests that it might have been
    written prior to the mid-1950s, when the French were forced to leave Indochina.
    Chez Eve opened-time in the 1940s and was famous as one of the few air-conditioned
    public places in Bangkok. Louis''s comment about "American flyers" is probably
    based on the fact that two of the partners who owned the Oriental Hotel were from
    the USA; a number of others in the expatriate community were who had been with
    the wartime OSS. Although I do not believe Louis was ever in Thailand, he did'
