    A man walked up straddled the stool beside mine. He was enormously fat with a
    tiny mouth and three chins. A waxed mustache perched on his lip and he had a high
    forehead from which the hair waved gracefully. He smelled of expensive perfume
    and his large intelligent eyes met mine in the mirror back of the bar. He smiled.
    Because of the perfume I viewed the smile with some skepticism.


    From an inside pocket he drew a leather wallet, carefully extracting five neat,
    new hundred-dollar bills. He placed them carefully on the bar between us, and
    atop he placed a plane ticket for Los Angeles.


    "California!" His voice held a fluted overtone. "How lovely at this time of year!"


    Extracting a long, slim cigarette from a gold case, he offered the case to me
    and when I declined, returned it to his pocket and signaled for a drink. He fitted
    the cigarette into an ivory holder. "So much cooler in California, Mr. Cross.
    Have you been there lately?


