    spoke English enough to translate and make themselves understood. Yet I now had
    Serat, if he proved loyal.


    Serat was a doubtful quantity. Where he had come from and what he wanted was a
    mystery. Possibly only a job, a horse to ride, and food to eat, he was too glib,
    ready with explanations, and a bit too concentrated on that southern route.


    Certainly, it was not unexpected to find such a man in this part of China. The
    caravan route had made it a land of wanderers and the harsh conditions made it
    the home of nomads; in most places little had changed from the time of Genghis
    Khan or Marco Polo.


    No stranger or more mysterious place lay on the face of the globe. Even Tibet
    was an open book by comparison. Up to a point the history of Sinkiang was a history
    of the Silk Road and life around the string of oases, but there had been a time,
    long before that, even long before the time of Christ, when vast, civilized cities
    had thrived.


    Who were the people who lived in those cities? What books did they write? What
    pictures did they paint? Who were their heroes? Their enemies? What was their
    history, their origin?


    There was no use lying to myself. I was going south. It was good advice to avoid
    Ma''s now leaderless soldiers along the northern route. But it was far less the
    whispered suggestions of Serat than my own desire to go south, into that never-never
    land west of Tun-huang.


    Liu Hung, who was second in command, was pacing about and talking excitedly when
    I rode back into the court with Serat. The five Nigoloks were close behind.


    "We leave in one hour," I said, and immediately moved to start organizing the
    camp for departure.'
