    Gwen Moran is here or in some place of which you know. I want her now. And if
    I don''t get her at once, I''ll take steps.


    He smiled, a faintly supercilious smile, yet impatient, too. "What steps? he sneered.
    "Your government will do nothing for propaganda. There is nothing you can do.
    Nothing at all."


    It was coming up in me and I could feel it. I wanted to take a swing at this big
    lug. Stifling the impulse for the moment in favor of sometime more opportune,
    I said, "I''ve no intention of calling in my government. They have too many problems
    to bother with something I can handle myself."


    "You think well of yourself," he said shortly. "Now leave, or I''ll have you beaten
