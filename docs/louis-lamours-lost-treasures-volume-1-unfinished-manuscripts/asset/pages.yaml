    Louis was "on the beach" (meaning out of work and waiting for a ship) there for
    many months. True or not, he has told other stories of Sleeth; you can read one
    of them, called "It''s Your Move," in either Yondering, The Revised Edition or
    The Collected Short Stories of Louis L''Amour, Volume 4. And Dad did hang out
    at the Seamen''s Church Institute and did ship out under similar and somewhat
    mysterious circumstances for the Far East.


    This last draft also contains a wonderful metaphor for Louis''s life: a child
    and a young man discovering the fertile imagination that will eventually allow
    him to blossom into a prolific fiction writer. Those "past lives" could be seen
    as the lives he would live in stories. When the writing is going well, a writer
    feels like a channel or a medium for a flow of information that is coming, so
    it seems, from somewhere else. Another life? The spirit world? The collective
    unconscious? You are creating other lives and times, and sometimes it feels like
    you are drawing on other realities to do so. I have had that experience occasionally,
    and my father had trained himself to live in it for hours a day.


    Louis rarely mentions writers like Talbot Bundy or James Hilton as significant
