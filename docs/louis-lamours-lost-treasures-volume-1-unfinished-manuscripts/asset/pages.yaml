    COMMENTS: This is how many of L''Amour novels got started. A number of tries,
    getting the tone or the particulars of the first scene or few chapters set up.
    Sometimes the differences between the different versions were very minor, sometimes
    radically different. Then something would click and the narrative would take off...
    or it wouldn''t. Quite a few of the story fragments in this book are pieced together
    from a number of parallel attempts such as these. Cutting and pasting them together
    I have tried to present a version that shows off the most complete vision or most
    interesting aspects of what Dad was trying to create.


    These three attempts contain a favored plot of Louis''s: a tough group of guys
    and a stash of money that isn''t going to be enough for the ones who steal it
    to share. What role the girl was going to play and why she was changed from Indian
    to white is anyone''s guess.'
