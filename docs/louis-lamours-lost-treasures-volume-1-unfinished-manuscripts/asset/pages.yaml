    or, in the westernized spelling of the time, Sinkiang. Sinkiang is to the north
    of Tibet at the base of the mountains that support the Tibetan plateau, wedged
    between modern China, Siberia, and Mongolia.


    Though Louis worked on these drafts intermittently between the late 1940s and
    the mid-1960s, the story is set in the time when much of China was ruled by local
    warlords, only some of whom cooperated with Chiang Kai-chek''s Kuomintang government.
    At the time, Sinkiang was, along with certain areas of central Africa and Antarctica,
    one of the most isolated areas on earth. Its isolation, did not keep it free from
    the sort of chaos found in the rest of China; political intrigue and warfare were
    common throughout the decade. The population of Sinkiang, especially in that time
    period, were mostly Turkic, rather than the Han people Western more typically
    think of as "Chinese."'
