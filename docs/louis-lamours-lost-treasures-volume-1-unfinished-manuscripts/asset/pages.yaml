  md: 'One of the men, who wore a thin mustache, said,

    "Ngolok." Then taking up my stick he drew a region south

    of Tun-huang and considerably beyond it, drew the big

    bend of a river, then pointed to the space inside the

    bend and indicated that it was their country.


    Turning, I walked back to camp, and they followed. I

    served what was left of our supper and when I got back

    to my sleeping bag they grouped themselves around me.


    Looking from one to the other I realized that for

    better or worse I had acquired the services of five

    fighting men. I knew nothing of the Ngolok, the

    wildest, fiercest tribe in Asia, a nomadic people

    who have defied for centuries all efforts to penetrate the

    land. Nor did I have any idea how rare it was to find any

    them outside their own country.


    Lying in my sleeping bag, I knew what it was I would

    do. I recruit, not an army, but a force at least compa-

    rable to the one I had now, a strong force of men whose

    loyalty lay only with me. Moreover, my recruiting must be

    done at and before anyone could circumvent my ef-

    forts. By the time whose mission it was to watch me

    realized what was happening, I wanted my force doubled.


    At daylight I was on my feet and the Ngoloks with me.

    We mounted horses and rode into the outskirts of

    Suchow, and with me was the pmarked Ladakhhi, who had

    appeared out of nowhere once more.


    If there was nothing else I knew, I knew fighting

    men, and it was fighting men I sought. The first was a

    Mongol with a gold ring in one ear, a stocky, powerful

    man with broad, high cheekbones.


    "You!" I pointed a finger at him. "I want to talk to

    you."


    He merely looked at me, then stared off down the\street with an air of contempt
    that was beautiful to see.


    "There is fighting to do, and traveling to a far

    land. If you are a coward, stay here."'
