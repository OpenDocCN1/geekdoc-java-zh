    Prior to its completion, Louis wrote a proposal in order to sell this book. It
    was offered to both a publisher and a movie studio, though ultimately, he did
    not conclude either deal. Hardcover publishers were a quandary for Louis. They
    got books reviewed. They got respect. They earned a bit of extra money if your
    book sold well, because they cost... but also took part of your paper-earnings
    (for having promoted the book, and for brokering the deal), they weren''t really
    available at a price appropriate for the common man (something Louis cared about
    deeply), and they wanted a piece of the movie rights. With the exception of critical
    recognition, for a popular writer like Louis L''Amour weren''t many advantages
    in those days to publishing in hardcover.


    Once Louis knew he could earn a good living selling directly to the paperback
    publishers, the only reason to try for a hardcover sale was prestige—prestige
    was an important goal for Louis in the early 1970s. He knew he could knock the
    ball out of the park in the paperback-arena, but he wanted to win over the critics,
    too.


