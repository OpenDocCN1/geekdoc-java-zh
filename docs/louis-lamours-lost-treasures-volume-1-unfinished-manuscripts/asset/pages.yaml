    idea if it was intended for any particular show. From the late sixties until the
    sixties, there were dozens of “anthology series” on the air, where every episode
    was a different story with different characters. Some of these were exclusively
    Western and many others would accept Western genre materials. In the 1950s, other
    short stories and treatments of Louis''s were purchased for shows like Rebound,
    Fireside Theater, Ford Television Theatre, Climax!, Schlitz Play-house, and Chevron
    Hall of Stars. Selling quickly sketched out ideas like this one or repurposing
    old short stories as an additional way for Dad to scrape together money. He also
    sold or created episode concepts for recurring character series like Tales of
    Wells Fargo, Maverick, The Texan, Sugarfoot, City Detective, and Cowboy G-Men.


    Dad''s relationship with Hollywood was as much a relationship with the TV industry
    as it was with feature films. Cowboy G-Men was produced as early as 1952, and
