    My pockmarked friend, called Serat, translated for me, and the Mongol got to his
    feet and spoke.


    "He wants to know where you go."


    "Tell him that if he comes with me he will eat each day, ride a good horse, fight,
    and if he asks any more questions I do not want him."


    Serat translated and the Mongol looked at me, a hint of a smile on his lips, then
    spoke, and turning, went behind the building. "He will get his horse," Serat said,
    looking at me curiously. Then he asked, "Where do we go?"


    "Where there is fighting," I said grimly. "If you come with me, you shall where
    I go.\"


    "Where else?" He looked about him. "How many men do we wish?"


    "Thirty . . if I can find others like these." . . We found them


    Brigands, some of them, leaderless soldiers, too. No doubt many camel drivers
    and truck drivers wondered by the unsettled conditions, but the men I chose, I
    chose because they looked like fighters and because of their readiness to go.
    Any who quibbled or asked questions I ignored, for I wanted only those willing
    to commit themselves.


    They were a hedgepodge of languages and nationalities, most of them in rags, all
    of them hungry, all of them potentially dangerous, and scarcely one did not bear
    the scars of battle. Yet diverse in origin as they might be, most of them spoke
    enough of the argot of the caravans to make himself understood. I alone was deficient
    in that respect. I, and those Chinese soldiers who were in my command.


    Of the original thirty-two, only five had actually been Chinese from the coastal
    provinces, and of these two'
