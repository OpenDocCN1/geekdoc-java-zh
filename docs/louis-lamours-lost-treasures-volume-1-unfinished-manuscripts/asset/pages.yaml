    strips with the fat cooked off (my)favorite), to the breakfast table.


    In a few minutes my sister will join us. My mother doesn''t have to dress anymore;
    she''s old enough to manage by herself. Then, Dad will put down the newspaper,
    take up a book, and read to us while we eat. It''s morning routine that will not
    end until I start driving myself to school nearly ten years later. The books he
    read were things he was interested in, Thor Heyerdahl''s The Kon-Tiki Expedition,
    Adventures in the Apache Country, or something from his youth, like Tarzan and
    the Jewels of Opar. We were surrounded by stories in every manner imaginable.


    By the time Mom was backing our aging and road-weary Cadillac out of the garage,
    Dad was back at his desk, typewriter rumbling, keys whacking out an irregular
    pattern. He''d still be there when I came home from school, dinner, and sometimes,
    long past my bedtime.


    I would wake up to that sound the next morning and the next and the next...


    ![](img/91369ce30a67d79ba0528698065fad14_20_0.png)


    This is how I remember my dad at work.


