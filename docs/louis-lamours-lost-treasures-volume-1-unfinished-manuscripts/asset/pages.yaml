    COMMENTS: Dad found the Southern California wilderness to be a spooky place. He
    touched on it in The Lonesome Gods and used that a strangeness to a much greater
    extent in The Californios. I agree with him. We used to talk about the feelings
    we''d get back in the hills and the hot, chaparral-choked arroyos. It is a haunted
    landscape, even more so than a Colorado or Utah canyon full of cliff dwellings.
    I have no idea why that should be the case, but we shared the feeling nonetheless.


    The location of seeing a sandstorm seems to be very near to Tehachapi Pass in
    the area along Highway 58 between Bakersfield and Mojave. The idea of seeing a
    sandstorm come up from the desert makes complete sense; these days the area is
    near a giant wind farm. I''m confident in saying this story was written in the
    early 1970s because Louis mentions a narrow canyon where buckeye trees grow and
    the Kawaii Indians left pa-hax, or grinding holes, in the rocks—a description
    of a piece of property we owned not too far from the pass.


    ![](img/91369ce30a67d79ba0528698065fad14_74_0.png)


    My mother and sister sitting in that narrow canyon at the base of the rocks with
