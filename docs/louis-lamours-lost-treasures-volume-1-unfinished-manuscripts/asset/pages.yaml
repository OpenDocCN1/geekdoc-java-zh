    One of the aspects of frontier life that this story flirts with is the differences
    between the early, colonial-era relationship between Europeans and Native Americans,
    and what came later. Early on, there was much more of a balance of power and a
    sense of cooperation. Not only did Indians give some instruction to whites on
    how to survive in North America, but they were also important political allies
    to the Europeans. As long as European powers fought with one another over their
    American possessions, and as long as the Colonies were not free from their British,
    Dutch, French, and Spanish masters, the various tribes were valued for their ability
    to side with one group of whites or another. Though, as is mentioned in this fragment,
    both Indian and white did a good deal of looking down on one another, they could
    also cooperate in a way that benefited both parties. It was a situation that did
    not survive the creation of the United States without dramatic changes.


