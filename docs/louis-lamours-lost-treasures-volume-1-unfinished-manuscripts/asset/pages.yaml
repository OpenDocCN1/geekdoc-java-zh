    A man with gold rings in his ears . . . a vase of an-cient glass . . . a fragment
    of carved stone . . . and a girl.


    Yes . . a girl.

    These things caused a door to open, a door I cannot close, a door I am not sure
    I wish to close, yet a door that has opened the way to a haunted past.


    Alone I am, and alone I have ever been except for those days, those moments even,
    when from out of the beyond I have found those whom I love, and who love me.


    For the one thing I have discovered is that love cannot die, need not end . .
    . for even after millennia I have known it to endure.


    Yet never have I been so alone as now when I possess a knowledge I cannot share.
    Not, at least, in its entirety.


