    tually, after two or three years, all that was left was our dining room table,
    piled high with random unidentified manuscript pages, with some numbers, without.
    None were titled. The challenge was to match them to existing stories by recognizing
    the name of a character, or finding the continuation of a sentence at the top
    of a page or the beginning of a sentence at the bottom of another, in this way
    we pieced together unfinished and unknown manuscripts, all going into their own
    individual folders, the pile of which grew larger and larger. By this time a number
    of friends and family had joined the effort, and it was like a giant game of literary
    Concentration.


    It had never been easy to keep track of what Louis was working on. He kept lists
    of everything: what he said, what he planned on accomplishing in the next six
    months, what physical exercises he did and how many repetitions, his weight, what
    books he read and the ones he planned on reading. He made several journal entries
    a week. And he made hundreds of pages of notes on unlined paper with a felttipped
    pen. He outlined speeches and articles and even jotted jokes and poetry. The number
    of pages he generated was substantial even before adding the things he considered
    to be his actual work. A great many of the projects in this book had been hidden
    from us by the avalanche of paper he was constantly producing.


