    By the time he gets to Chapter 4, it seems Louis had reached a decisive moment
    in the writing process. The arrival of the odd group of stage passengers suggests
    that the mystery of the disappearing station agents, and even the existence of
    some sort of monster, is just the tip of the interdimensional iceberg. The place
    where Louis stopped writing is probably the place where he was going to have to
    commit to what the book was going to be. Dad usually worked this thing unconsciously,
    but whether was a conscious or unconscious process, it is obvious to me that he
    wasn''t quite ready to take the next step. No doubt several of the passengers
    are in whatever is happening and it would seem that Jeremy Loccard''s amulet will
    also play a role.


    It is amusing to see a moment of Chick Bowdrive-style forensics when Loccard pleads
    the smelly hairs in a folded piece of paper. (Bowd was a Texas Ranger character
    Louis wrote about early in his career.) The monster may be a giant sloth, even
    as big as they were, I''m not sure they''d be all that aggressive. Perhaps it
    was a short-faced bear, an extinct carnivore of colossal size ... which definitely
    have been something to fear. The bones of both have been found in the La Brea
    Tar Pitts in Los Angeles.


    As I mentioned, Dad was working with ideas here that were very similar to one
    he experimented with in his novels The Californios and The Haunted Mesa: strange
    animals that come from somewhere-else, another reality of some sort, and people
    who know about this other place and, regardless of the danger, wish to exploit
    it in some way. In his notes on this story Dad mentions checking into Harold Courlander''s
    Fourth World of the Hopis and Frank Waters'' Book of the Hopi. Both were also
    inspirations for Haunted Mesa. Additionally, Louis considered rereading some of
    the work of Talbot Mundy, a writer who influenced Dad''s more occult-oriented
    adventure fiction, and Charles Fort, an early collector of unexplained phenomena.


    In some ways it seems as if Louis was to expand on, or even a sort of sequel to,
    The Californios with this story. His notes mention “a lost city in the desert
    and the people who lived there.” Juan, the old Indian in The Californios who can
    travel between worlds,'
