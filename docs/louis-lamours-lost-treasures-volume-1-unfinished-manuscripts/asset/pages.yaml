    Suddenly, I sat up in my sleeping bag and looked out through the gate to where
    several men huddled in a corner of a wall about fifty yards away. They were big,
    raw-bone men carrying old-fashioned rifles. Each had a saber slung across his
    back, the hilt showing above his left shoulder. The right shoulder was bare.


    They talked to no one, and apparently had almost nothing to eat. I had watched
    them because of the way they had been looking at our horses, which I was sure
    they intended to steal.


    Pulling on my boots and sheepskin coat, I picked up my rifle and walked over to
    where they lay. Two were asleep as I approached, the three others sat up, as ready
    for trouble as ever men could be.


    "Do you speak English?"


    They merely stared at me.


    "Do you want horses? Food to eat?"


    They grasped the word "horses" quickly enough. One of them got up and tried me
    in what was probably a bastard Chinese, but I knew none of it.


    Squatting on my heels I drew a rough map in the sand showing where we were. Touching
    the man nearest me with the drawing stick, then myself, and gesturing to show
    the country around, I made an X with the stick. "Suchoch!"


    "Anshi." he agreed, his voice harsh and strange. "I give you new rifle!"


    I made another mark. I slapped the Mauser that lay across my knees. The men''s
    eyes widened. "I shall go here." Drawing a line as I spoke, I indicated the Tun-huang
    oasis, the Kuen Lun Mountains, the crossing to Aksu.


    "You--I indicated them--come with me. You Ride--I drew a horse--and you eat."
    Gesturing to my mouth was enough for that. "Maybe we fight." I mimed shooting,
    slashing with a sword, and indicated a place for them on either side of me. When
    I stood up, I looked from one to the other. "You are not Chinese. What are you,
    then?"'
