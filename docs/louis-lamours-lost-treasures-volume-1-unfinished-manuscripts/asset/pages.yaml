    COMMENTS: This is a much more interesting story fragment than it may seem on the
    surface. The underlying idea, a group of desperate characters, near strangers
    to one another, perform a dangerous or illicit act in order to gain a “treasure”
    and once they can no longer trust one another, can be found in more than a half
    dozen of Louis''s stories and novels. These include “What Gold Does to a Man,”
    “Desperate Men,” Kid Rodelo (“Desperate Men” was the short story that became the
    novel *Kid Rodelo*), a couple of story fragments here in Louis L''Amour''s Lost
    Treasures, and the best of all of them, the short story “Off Mangrove Coast,”
    to which this piece has certain connections. It will also show up a subplot in
    Louis''s soon-to-be-published first novel, *No Traveler Returns*.


    The basic idea contains elements of B. Travis''s *The Treasure of the Sierra Madre*,
    in “Off the Mangrove Coast,” Louis added a brilliant refinement: It is not much
    of a treasure. The fact that really isn''t enough money to go around increases
    the likelihood that one of the men will try to kill the others for the chance
    to get it all.


    Was there some element of this story that was true to Louis''s life? Is that why
    he returned to this plot over and over? He told some stories to this effect, but
    so far, I have no way of knowing if they'
  merge: -1
  pgno: 426
- img_proc: true
  md: 'actually happened. One thing that appears in this story is true that he did
    run into a man named Joe Hollinger, both at sea and with the Hagenbeck-Wallace
    Circus. And, it seems, a knife was Joe''s pre-ffered weapon.


    This is also a sequel of sorts to the story fragment titled "Jack Cross.\ The
    "silk silk caper" mentioned is referenced in both stories, and the time period
    seems right. At a guess, "tribute silk" was either given the Chinese emperors
    in tribute or intended to be given as allied governors or heads of state. Possibly
    of this silk remained in the Forbidden City for some time. The other oddball crime
    mentioned here is "pearl poaching," which probably refers to sneaking into Australian
    territorial waters without the appropriate permits and diving for pearl shell.
    Before cultured pearls, the real market was for mother-of-pearl from the inside
    of the oyster (it was used for many of the things we make out of plastic, like
    buttons, combs, and the keys on musical instruments). The pearls themselves were
    so rare that it was a waste of time diving in the hopes of finding one. However,
    if you were in the mother-of-pearl business and earned a living from what you
    brought up, the pearls themselves served as a windfall profit.


    Contrary to what one might think from reading some of the overtly macho material
    Louis wrote, he was a fairly mild-mannered guy. He had great presence had little
    to prove in any way other than just trying to be a good writer. Though he could
    certainly tell adventurous tales about his life, he was a gentle man who could
    inspire that same gentleness in others.'
