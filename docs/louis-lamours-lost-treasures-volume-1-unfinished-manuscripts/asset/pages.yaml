  md: '# INTRODUCTION


    elements of Native American lore. Like The Walking Drum, both of these stories
    were conceived twenty or even thirty years earlier. By the time of his death,
    Dad was finally able to tell stories in a wider array of genres than just the
    Western.


    Certainly, what held Louis back, when it came to the more-venturous and interesting
    material that he dreamed of writing, wasn''t just the conservative nature of publishers
    or his core audience—his own limitations played a part, too. To complete many
    of the ambitious projects he envisioned, a great deal of planning and revision
    would no doubt have necessary.


    As you will see in this book, and contrary to popular myth, Louis did outline
    to a certain extent, and he did rewrite, or at least restart, stories that hadn''t
    taken off in that magic way that would carry him all the way through to the end.
    But writing was not as intellectual an experience for him as it may be for many
    writers; over the years it had instinctive and reactive. To complete some of these
    projects, which in his personal nature and distance from the Western genre were
    more like his earliest work, Louis might have needed to relearn the planning and
    revision skills he had developed at the start of his career.


    For Louis, the key to almost every story was the beginning. He was both renowned
    for proud of how he started stories. Using action or mystery or a particular turn
    of phrase, he would propel the audience into a situation in a way that made them
    lean forward, eyes leaping ahead to the next sentence. Getting himself to react
    to that moment was a trick he used to unlock the story. If the narrative “took,”
    then he went with it, forging ahead until he had followed his characters through
    the end. After a certain point he rarely looked back, and the story wrote itself
    in an unstoppable stream of the unconscious.


    One day I was speeding along the typewriter, and my daughter--who was a child
    at the time--asked me, "Daddy, why are you writing so fast?" And I replied, "Because
    I want to see how the story turns out!"'
