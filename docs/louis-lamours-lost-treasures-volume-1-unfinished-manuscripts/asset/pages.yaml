    COMMENTS: The Llano Estacado, sometimes called the Staked Plain, is a high plains
    area covering a good deal of Texas and eastern New Mexico. One theory about the
    name was that it was so flat that every traveler used stakes driven into the ground
    to navigate its expanse and to find water. Though cairns (piles of rock or debris)
    and possibly stakes have been used as guideposts, it is more likely that the name
    came from the look of the mesa-like edges of the plateau, which resembled palisades
    and a stockade.


    It''s very likely that the canyon that our narrator discovers is Palo Duro Canyon,
    in which the JA Ranch was established in the 1870s. Louis''s early experience
    with this general area came when he got a job skinning dead cattle on the Elwell
    Ranch, near Lubbock, Texas, in the mid-1920s. Later, his family traveled across
    the Staked'
