  md: 'Occasionally, Louis would write treatments, like this one, when he was trying
    to sell ideas or even finished stories to motion-picture or television companies.
    But because this draft is roughly sketched out I think it''s more likely an example
    of Louis writing a treatment for his own use, as a trial run for a full-fledged
    story. He did this very rarely because it was nearly the same amount of work as
    writing the story itself.


    Perhaps this theory explains the origin of the other treatments in this volume…
    that were written more as creative experiments than sales tools. I have always
    hesitated to make that as-umption, knowing that Dad disliked having a tale too
    completely worked out before he really started writing. But he would have had
    to learn that lesson at some point, so maybe what we are looking at is part of
    the learning process.


    It is also interesting to see both the city of Bangkok and the scene where the
    hero hides in the opium den show up again. I suspect that this fragment was written
    before “Citizen of the Darker Streets,” but that is only my intuition; I have
    no evidence.


    Certainly “Where Flows the Bangkok” has a lot of aspects that need to be improved,
    but that is one of the reasons to create a treat-ment: to allow the writer to
    confront the story and see where it leads.'
