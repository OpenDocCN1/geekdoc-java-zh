    One hundred and thirty feet long, the International drew but two feet of water.
    Already a veteran of seven or eight years upon the river, she showed the harshness
    of hot summers and the bitter cold of winter when she lay idle.


    The green banks slipped away behind them, now and then permitting a glimpse of
    the prairie beyond. There were many twists and turns in the river, so actual progress
    in miles amounted to very little.


    Riel walked aft and stood the great wheel turning, crystal drops falling back
    into the water. For two hundred years the Hudson Bay Company, under a charter
    granted in 1670 to Prince Rupert and his associates, had ruled the vast territory
    known as Rupert''s Land which lay east of the Rockies to the shores of Hudson
    Bay.


    Not that their control had been unlimited, for in 1783 a group of "free-traders"
    had combined to form the North West Fur Company, and there had followed for nearly
    forty years a bloody rivalry.


    In 1812 the Earl of Selkirk planted a colony upon the Red River, a colony of Highlanders
    displaced from their own land in Scotland. They were viciously attacked, and many,
    including the governor of the Hudson Bay Company, were shot down.


    Later, the earl imported portions of two bodies of foreign troops, marched west,
    and took possession of Fort Douglas. In turn they were attacked, and peace was
    not finally resolved until the two companies merged to leave only the Hudson Bay
    Company in the field.


    The inhabitants of what was called Assiniboia were not all métis. Many were retired
    Hudson Bay Company factors and servants, others their descendants, of mixed blood.
    Aside from occasional disputes over religious matters the colony was singularly
    peaceful, considering the time and the place. Now all that was to change, and
    Louis Riel paced the deck, hands clasped behind his back, considering what might
    be done.'
