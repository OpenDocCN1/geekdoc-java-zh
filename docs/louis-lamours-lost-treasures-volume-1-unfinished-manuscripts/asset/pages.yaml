    REINCARNATION: the successive habitation of many different bodies by the same
    soul. The belief that the spirits or souls of men pass pass after death into other
    bodies is a feature of many religions, especially in the East, and is still held
    by the Buddhists and by many Hindus, and, of course, by the modern Theosophists.
    It was taught in Ancient Egypt, by the Orphic priests of early Greece and by Pythagoras,
    was discussed by Plato, and was believed in some early Christians.


