    told the tale of such an Atlantis-like city. Louis jotted down the fol-lowing
    of dialogue for one of the characters to impart:


    "People throw things out of kilter. The Old Ones knew. Young folks lost a lot
    of knowledge. There was a wall in that town, and on the Wall were inscrip-tions.
    This wall could be read by the Old Ones, but when the storm came they were suffocated
    in the dust, all but a few who had gone through the Portals. When they came back
    all were gone, their folks, temples, houses everything gone. They live on the
    Other Side now and just return for pilgrimages, but they don''t want folks in
    the way. . . This here is on the route, the temple is in the mountains yonder,
    and . . The Portals are. There were other Openings."


    This idea of portals to other worlds is a significant element in The Californios
    and Haunted Mesa. But here there is another plane of existence that invites exploration
    and offers a sense of possibility that our world has been running low on recently.
    Louis grew up in a time when the ends of the earth had yet to be completely explored,
    but by the time he wrote these chapters, the likelihood of discovering King Kong''s
    Skull Island or Lost Horizon''s Shangri-La had been reduced to nearly zero. A
    parallel universe was the next step for a writer of the frontier.


    Dad also jotted down one final note, possibly of what was intended to be the last
    scene in this story:


    A vanishing stagecoach? A Lurch of the stage, a jolt, a cloud of dust, then a
