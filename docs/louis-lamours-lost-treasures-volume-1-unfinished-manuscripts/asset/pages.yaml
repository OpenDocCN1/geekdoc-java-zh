    story will be, I believe, one of the most entertainingly developed of recent years.
    With proper promotion I believe this book will have a great sale, of which we
    can all be proud.


    Louis intended to play on the hypocrisy that surrounded the Cherokee Removal,
    showing that the prejudice of the white men did not need a target as obvious as
    the Western genre''s typical Indians.


    > these Indians were, in many cases, educated, well-informed men and women who
    lived in the same sort of houses as white men and wore the same sort of clothing
    as the white man from preference. Their differences from white society were few;
    they were not a group of "outsiders." Many were at least well educated as the
    average white man of his time, and several had qualities of genius.


    Not only was he exploring the fact that many Cherokee did not look or act differently
    from their white neighbors (many were Christian), but some of his characters among
    the Cherokee elite were meant to be pathetically tone-deaf to the catastrophe
    that was bearing down on them. To add upon irony, there are some indications that
    he also intended to add major characters who were the black slaves of those same
    Cherokee elites, slaves who traveled and died on the Trail of Tears.'
