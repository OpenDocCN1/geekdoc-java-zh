  md: 'American officials could learn nothing. Local reports were that she had run
    off with a man, perhaps had flown to Singapore. The following morning my inquiries
    began. I only knew two things--she had access to a short-wave set and her kidnapper
    could hire killers. Both indicated, perhaps had power.


    The shortwave cooled swiftly--it could have been no known set in the vicinity
    of Bangkok. So I gathered the details. Gwen had come ashore with her party and
    had stopped at the Oriental, an excellent and respectable hotel near the river,
    a cooler location than my stopping place. The party had consisted of a man and
    wife in their early fifties and the three girls in their twenties. They had gone
    to the Chez Eve for dinner.


    Gwen attracted immediate and appreciative attention. She danced with a French
    Colonel, with the local director of an American firm, twice with former American
    flyers. And she had talked briefly with a man in the shadows at one side of the
    floor.


    Hobody knew what was said or who he was. Returning to her table, Gwen made no
    comment. Local officials knew nothing more. . . I fell asleep mulling over the
    few known facts.


    At noon I awakened suddenly and swung my feet to the floor. My tongue was thick
    and my brain was foggy. The lethargy left by sleeping through the hot, still deadened
    my muscles. By the time I had shaved and showered I felt better, so I went around
    to the Chez Eve and perched on a bar stool.


    In Bangkok, this is the place to go. It is a nightclub, a restaurant, an odd combination
    of the American and Eastern. Seated on one of the chromium bar stools, I ordered
    a long, cool Myrtle Bank Punch and began to study the situation.'
