    # Java While Loop


    The while loop in Java is used to execute a section of code until the provided
    Boolean condition is true. The loop comes to an end as soon as the Boolean condition
    is false.


    The while loop is a type of if statement that repeats itself. The while loop is
    recommended if the number of iterations is not fixed.


    Syntax:


    1.  while (condition){    


    2.  //code to be executed   


    3.  I ncrement / decrement statement  


    4.  }


    The many components of a do-while loop are as follows:


    1\. A condition is an expression that is put to the test. The loop body is run
    if the condition is true, and control is passed to the update expression. We exit
    the while loop when the condition turns false.


    Example:


    i <=100


    2\. Update expression: This expression increments or decrements the loop variable
    every time the loop body is run.


    Example:


    i++;


    Flowchart - Java While Loop


    The crucial thing to remember about the while loop is that it may or may not run.
    The loop body is skipped if the condition to be tested is false, and the first
    statement after the while loop is executed.


