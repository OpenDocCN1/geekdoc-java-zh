    \n# Java 控制语句\n\nJava 编译器从头到尾运行代码。语句按照出现的顺序执行。另一方面，控制语句用于控制代码流。它是 Java 最重要的部分之一，因为它确保了流的顺畅。\n\
    \n控制语句有三种：\n1. **决策语句**\n   - `if` 语句\n   - `switch` 语句\n2. **循环语句**\n   - `do\
    \ while` 循环\n   - `while` 循环\n   - `for` 循环\n   - `for-each` 循环\n3. **跳转语句**\n\
    \   - `break` 语句\n   - `continue` 语句\n\n## 决策语句\n正如名称所示，决策语句决定执行哪些语句。决策语句分析布尔表达式并根据结果控制流。在\
    \ Java 中，有两种决策语句：`if` 和 `switch`。\n\n### 1) if 语句\n它是所有 Java 控制语句中最基础的。如果 `if`\
    \ 表达式为真，允许程序开始代码块。`if` 语句有四种形式：\n1. 简单 `if` 语句\n2. `if-else` 语句\n3. `if-else-if`\
    \ 链\n4. 嵌套 `if` 语句\n\n#### 1) 简单 if 语句\n`if` 语句的语法如下：\n```java\nif(condition)\
    \ {\n    statement; // 当 condition 为真时执行\n}\n```\n考虑以下使用 `if` 语句的 Java 示例：\n\n\
    **Student.java**\n```java\n1. public class Student {\n2. public static void main(String[]\
    \ args) {\n3. int x=10;\n4. int y=12;\n5. if(x+y > 20) {\n6. System.out.println(\"\
    x+y is greater than 20\");\n7. }\n8. }\n```\n**输出:** `x + y is greater than 20`\n\
    \n#### 2) if-else 语句\n`if-else` 语句是 `if` 语句的扩展。如果 `if` 条件块被评估为假，则执行 `else` 块。\n\
    \n语法：\n```java\nif(condition) {\n    statement; // 当 condition 为真时执行\n} else {\n\
    \    statement; // 当 condition 为假时执行\n}\n```\n**示例**\n**Student.java**\n```java\n\
    1. public class Student {\n2. public static void main(String[] args) {\n3. int\
    \ x=10;\n4. int y=12;\n5. if(x+y < 10) {\n6. System.out.println(\"x+y is less\
    \ than 10\");\n7. } else {\n8. System.out.println(\"x+y is greater than 20\");\n\
    9. }\n10. }\n11. }\n```\n**输出:** `x + y is greater than 20`\n\n#### 3) if-else-if\
    \ 链\n`if-else-if` 语句由一个 `if` 语句和多个 `else-if` 语句组成。换句话说，通过一系列 `if-else` 语句创建决策树，计算机可以进入条件为真的代码块。在链的末尾，我们也可以定义一个\
    \ `else` 语句。\n\n`if-else-if` 语句的语法如下：\n```java\nif(condition 1) {\n    statement;\
    \ // 当 condition 1 为真时执行\n} else if(condition 2) {\n    statement; // 当 condition\
    \ 2 为真时执行\n} else {\n    statement; // 当所有条件为假时执行\n}\n```\n**示例**\n**Student.java**\n\
    ```java\n1. public class Student {\n2. public static void main(String[] args)\
    \ {\n3. String city=\"Delhi\";\n4. if(city == \"Meerut\") {\n    System.out.println(\"\
    city is meerut\");\n} else if(city == \"Noida\") {\n    System.out.println(\"\
    city is noida\");\n} else if(city == \"Agra\") {\n    System.out.println(\"city\
    \ is agra\");\n} else {\n    System.out.println(city);\n}\n5. }\n6. }\n```\n**输出:**\
    \ `Delhi`\n\n#### 4) 嵌套 if 语句\n`if` 语句可以在另一个 `if` 或 `else-if` 语句内部包含 `if` 或 `if-else`\
    \ 语句。以下是嵌套 `if` 语句的语法：\n```java\nif(condition 1) {\n    statement; // 当 condition\
    \ 1 为真时执行\n    if(condition 2) {\n        statement; // 当 condition 2 为真时执行\n\
    \    } else {\n        statement; // 当 condition 2 为假时执行\n    }\n}\n```\n**示例**\n\
    **Student.java**\n```java\n1. public class Student {\n2. public static void main(String[]\
    \ args) {\n3. String address=\"Delhi, India\";\n4. if(address.endsWith(\"India\"\
    )) {\n    if(address.contains(\"Meerut\")) {\n```\n\n"
