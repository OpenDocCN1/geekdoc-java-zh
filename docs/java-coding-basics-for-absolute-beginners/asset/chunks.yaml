    true\n10\ntrue\n11\n```\n\n# Java 三元运算符\n\n在 Java 编程中，三元运算符是 `if-then-else` 表达式的单行替代方案。它是唯一接受三个输入的条件运算符。\n\
    \n### 示例\n```java\n1. public class OperatorExample{\n2. public static void main(String\
