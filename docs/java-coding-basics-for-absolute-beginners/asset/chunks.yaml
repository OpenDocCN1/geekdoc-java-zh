    \ 特性\n- C++ vs Java\n- 第一个 Java 程序\n- JDK, JRE 和 JVM 之间的区别\n- Java 变量\n- Java\
    \ 中的数据类型\n- Java 运算符\n- Java 控制语句\n- Java 中的循环\n- Java While 循环\n- Java do-while\
    \ 循环\n- Java Break 语句\n\n## 什么是 Java\nJava 既是一个平台也是一种编程语言。Java 是一种高级编程语言，具有健壮性、面向对象性和安全性。\n\
    \nJava 是由 Sun Microsystems（现为 Oracle 的一个部门）于 1995 年创建的。Java 的创始人詹姆斯·高斯林（James\
    \ Gosling）被认为“Java 之父”。在 Java 诞生之前，它被称为 Oak。由于 Oak 已经是一个广知的商标，詹姆斯·高斯林和他的团队决定将其改为\
    \ Java。\n\n平台：平台是指运行运行的任何硬件或软件环境。Java 被称为平台是因为因为它拥有运行时环境（`JRE`）和 API。\n\n## Java\
    \ 示例\n让我们来看一个 Java 编程示例。下一页包含 Hello Java 示例的完整描述。\n\n`Simple.java`\n\n```java\n\
    class Simple {\n  public static void main(String args[]) {\n    System.out.println(\"\
    Hello Java\");\n  }\n}\n```\n\n## Java 应用程序类型\nJava 编程可以用于构建四种应用程序：\n\n### 1)\
    \ 独立应用程序\n桌面应用程序和基于窗口的程序是独立应用程序的示例。这些必须在每台机器上安装的典型程序。媒体播放器、防病毒软件和其他独立都是示例。在 Java\
    \ 中，使用 `AWT` 和 `Swing` 创建独立应用。\n\n### 2) Web 应用程序\nWeb 应用程序是在服务器上运行并生成动态页面的应用程序。现在使用\
    \ `Servlet`、`JSP`、`Struts`、`Spring`、`Hibernate`、`JSF` 等技术开发 Java Web 应用程序。\n\n\
    ### 3) 企业级应用程序\n分布式应用（例如银行软件）被称为企业级应用程序。高安全性、负载均衡和集群只是其优点。`EJB` 是开发企业级应用的 Java\
    \ 框架。\n\n### 4) 移动应用程序\n移动应用程序是专为移动设备设计的程序。目前，移动应用程序使用 `Android` 和 `Java ME` 开发。\n\
    \n## Java 平台\nJava 可用于四个不同的平台或版本：\n\n### 1) Java SE (Java 标准版)\n这是一个 Java 编程环境。包含了\
    \ Java 编程 API，如 `java.lang`、`java.io`、`java.net`、`java.util`、`java.sql` 和 `java.math`。涵盖了\
    \ OOP、`String`、`Regex`、`Exception`、内部类、多线程、I/O 流、网络、`AWT`、`Swing`、反射、集合等其他核心主题。\n\
    \n### 2) Java EE (Java 企业版版)\n这是一个主要用于创建在线和企业应用的业务平台。它使用 Java SE 平台构建。涵盖了 `Servlet`、`JSP`、Web\
    \ 服务、`EJB`、`JPA` 和其他主题。\n\n### 3) Java ME (Java 微型版)\n这是一个专注于移动应用程序的微平台。\n\n###\
    \ 4) JavaFX\n这是一个用于创建富丰富的在线应用的编程语言。它利用简单的用户界面 API。\n\n# Java 特性\nJava 编程语言开发的主要目标是使其具有可移植性、简单性和安全性。此外，还有许多有助于该语言流行的优秀方面。Java\
    \ “热术语”指的是该语言的特性。\n\n以下是 Java 编程语言最基本的特性列表。\n\n![](img/image00121.jpeg)\n\n###\
    \ 简单\nJava 是一门非常容易学习的语言，语法简单、清晰且易于理解。根据 Sun Micros 的 的，Java 是一种简单的编程语言，因为：\n-\
    \ Java 语法基于 `C++`（这使得程序员在学习过 `C++` 后更容易上手）。\n- Java 消除了许多困难且很少使用的特性，例如显式指针和运算符重载。\n\
    - 因为 Java 具有`自动垃圾回收`，所以不需要手动删除未引用的对象。\n\n### 面向对象\nJava 是一种关注对象的计算机语言。在 Java 中，一切都是对象。面向对象编程（OOPs）是指对数据和行为的组织。\n\
    \n### 平台无关\n与 `C`、`C++` 等编译为特定平台的语言不同，Java 是平台无关的，它是“编写一次，到处运行”的语言。运行程序的硬件或软件环境被称为平台。平台分为软件平台和硬件平台两种。\n\
    \n### 安全\n安全性是 Java 最广为人知的特性。我们可以 Java 创建防病毒解决方案。由于以下原因，Java 是安全的：\n- 没有特定的指针。\n\
    - Java 程序运行在沙箱环境中。\n- `字节码验证器`：它检查可能破坏对象访问权限的代码片段。\n- `管理器`：它是运行时环境的一个组件，用于确定类可以的资源，例如读取和写入本地磁盘。\n\
    \n### 健壮\nJava 行业非常繁荣。Java 是一种健壮的编程语言，因为：\n- 它大量利用内存管理。\n- 没有指针，因此没有安全问题。\n- Java\
    \ 提供自动垃圾回收，并在虚拟机上运行以清除不再使用的项。\n在 Java 中有异常处理和类型检查机制。所有这些因素共同构成了 Java 的健壮性。\n\n\
    ### 架构中性\n由于 Java 中没有与实现相关的方面（例如原始类型的大小），因此它是架构中性的。\n在 `C` 编程中，`int` 数据类型在 32\
    \ 位架构上占用 2 字节，在 64 位架构上占用 4 字节。但在 Java 中，它在 32 位和 64 位架构上都占用 4 字节内存。\n\n### 可移植\n\
    由于 Java 允许将 Java 字节码从一个平台移动到另一个平台，因此它是可移植的。它不需要任何特定的实现。\n\n### 高性能\n由于 Java 字节码接近原生代码，它比其他传统的解释型编程语言更快。尽管如此，它仍然比编译语言（例如\
    \ `C++`）慢。\n\n### 分布式\n因为 Java 允许用户在 Java 中构建分布式程序，所以它是分布式的。开发分布式应用程序使用 `RMI`\
    \ 和 `EJB`。这种 Java 能力允许我们通过调用连接到互联网的任何系统来访问文件。\n\n### 多线程\n\n"
