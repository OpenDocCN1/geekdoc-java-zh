  trans: "\n\n`Boolean` 数据类型仅存储两个潜在值：`true` 和 `false`。该数据类型用于存储跟踪真/假情况的简单标志位。\n\n\
    `Boolean` 数据类型指定了一个位的数据，但其“大小”无法精确定义。\n\n示例：\n```\nBoolean one = false\n```\n\n\
    ## Byte 字节数据类型\n\n原始型数据类型 `byte` 是这种类型的一个例子。它是一个 8 位补码有符号整数。它的取值范围是从 `-128` 到\
    \ `127`（包含）。它的最小值为 `-128`，最大值为 `127`。默认值为 `0`。\n\n`byte` 数据类型用于在空间极其有限的大数组中节省内存。因为\
    \ `byte` 的空间是 `integer` 的四分之一，所以它可以节省空间。它也可以用 `\"int\"` 数据类型替换。\n\n示例：\n```\n\
    byte a = 10, byte b = -20\n```\n\n## Short 短型数据类型\n\n`short` 数据类型是 16 位补码有符号整数。它的取值范围是从\
    \ `-32,768` 到 `32,767`（包含）。它的最小值为 `-32,768`，最大值为 `32,767`。默认值为 `0`。\n\n`short`\
    \ 数据类型和 `byte` 数据类型一样可以节省内存。`short` 数据类型的大小是 `integer` 的两倍。\n\n示例：\n```\nshort\
    \ s = 10000, short r = -5000\n```\n\n## Int 整型数据类型\n\n`int` 数据类型表示 32 位补码有符号整数。它的取值范围是从\
    \ `-2,147,483,648` (`-2³¹ -1`) 到 `2,147,483,647` (`2³¹ -1`)（包含）。它的最小值为 `-2,147,483,648`，最大值为\
    \ `2,147,483,647`。默认值为 `0`。\n\n除非有内存限制，否则 `int` 数据类型通常被选为整数值的默认数据类型。\n\n示例：\n\
    ```\nint a = 100000, int b = -200000\n```\n\n## Long 长型数据类型\n\n`long` 数据类型是 64\
    \ 位补码整数。它的取值范围是从 `-9,223,372,036,854,775,808` (`-2⁶³ -1`) 到 `9,223,372,036,854,775,807`\
    \ (`2⁶³ -1`)（包含）。它的最小值和最大值分别为 `-9,223,372,036,854,775,808` 和 `9,223,372,036,854,775,807`。默认值为\
    \ `0`。当你需要比 `int` 更大的取值范围时，应该使用 `long` 数据类型。\n\n示例：\n```\nlong a = 100000L, long\
    \ b = -200000\n```\n\n## Float 浮型数据类型\n\n`float` 数据类型是 32 位单精度 IEEE 754 浮点数。它具有无限的取值范围。如果你需要在大型浮点整数数组中节省内存，请使用\
    \ `float`（而不是 `double`）。对于货币等精确数字，不应使用 `float`。默认值为 `0.0F`。\n\n示例：\n```\nfloat\
    \ f1 = 3.5\n```\n\n## Double 双型数据类型\n\n`double` 类型是 64 位双精度 IEEE 754 浮点数。它具有无限的取值范围。和\
    \ `float` 一样，`double` 类型通常用于小数值。对于货币等精确数值，不应使用 `double`。默认值为 `0.0d`。\n\n示例：\n\
    ```\ndouble d1 = 2.3\n```\n\n## Char 字符类型\n\n`char` 类型表示 16 位 Unicode 字符。它的取值范围是从\
    \ `'u0000'` 到 `'uffff'`（包含）。字符使用 `char` 类型存储。\n\n示例：\n```\nchar letter = 'A'\n\
    ```\n\n# Java 运算符\n\n在 Java 中，运算符是执行操作的符号。例如 `+`、`-`、`*`、`/` 等。在 Java 中有许多不同的运算符，列如下：\n\
    \n-   一元运算符\n-   算术运算符\n-   位移运算符\n-   关系运算符\n-   位运算运算符\n-   逻辑运算符\n-   三目运算符\n\
    -   赋值运算符\n\n## Java 运算符优先级\n\n![](img/image0127.jpeg)\n\n![](img/image0128.jpeg)\n\
    \n### Java 一元运算符\n\nJava 一元运算符只需要一个操作数。一元运算符用于执行各种任务。\n\n![](img/image0129.jpeg)\n\
    \n### Java 一元运算符示例：++ 和 --\n\n```java\nclass OperatorExample {\n    public static\
    \ void main(String[] args[]) {\n        int x = 10;\n        System.out.println(x++);\
    \ // 10\n        System.out.println(++x); // 12\n        System.out.println(x--);\
    \ // 12\n        System.out.println(--x); // 10\n    }\n}\n```\n输出：\n```\n10\n\
    12\n12\n10\n```\n\n### Java 一元运算符示例 2：++ 和 --\n\n```java\nclass OperatorExample\
    \ {\n    public static void main(String[] args[]) {\n        int a = 10;\n   \
    \     int b = 10;\n        System.out.println(a++ + ++a); // 10+12=22\n      \
    \  System.out.println(b-- + b); // 10+9=19\n    }\n}\n```\n输出：\n```\n22\n19\n\
    ```\n\n### Java 一元运算符示例：~ 和 !\n\n```java\nclass OperatorExample {\n    public\
    \ static void main(String[] args[]) {\n        int a = 10;\n        int b = -10;\n\
    \        boolean c = true;\n        boolean d = false;\n        System.out.println(~a);\
    \ // -11 (正值的取反)\n        System.out.println(~b); // 9 (负值的取反)\n        System.out.println(!c);\
    \ // false (布尔值的取反)\n        System.out.println(!d); // true\n    }\n}\n```\n\
    输出：\n```\n-11\n9\nfalse\ntrue\n```\n\n### Java 算术运算符\n\n加、减、乘、除都是通过 Java 算术运算执行的。它们作为基础数学过程。\n\
    \n### Java 算术运算符示例\n\n```java\nclass OperatorExample {\n    public static void\
    \ main(String[] args[]) {\n        int a = 10;\n        int b = 5;\n        System.out.println(a+b);\
    \ // 15\n        System.out.println(a-b); // 5\n        System.out.println(a*b);\
