    \ complement integer is represented by the `int` data type. Its range of values\
    \ is `-2,147,483,648` (`-2^31 -1`) to `2,147,483,647` (`2^31 -1`) (inclusive).\
    \ It has a minimum of `-2,147,483,648` and a maximum of `2,147,483,647`. It has\
    \ a value of `0` by default.\n\nUnless there is a memory constraint, the `int`\
    \ data type is usually chosen as the default data type for integral values.\n\n\
    Example:\n```\nint a = 100000, int b = -200000\n```\n\n## Long Data Type\n\nA\
    \ 64-bit two's complement integer is the `long` data type. It has a value range\
    \ of `-9,223,372,036,854,775,808` (`-2^63 -1`) to `9,223,372,036,854,775,807`\
    \ (`2^63 -1`) (inclusive). Its lowest and maximum values are `-9,223,372,036,854,775,808`\
    \ and `9,223,372,036,854,775,807`. It has a value of `0` by default. When you\
    \ need a larger range of values than `int` can supply, you should utilise the\
    \ `long` data type.\n\nExample:\n```\nlong a = 100000L, long b = -200000\n```\n\
    \n## Float Data Type\n\nThe `float` data type is a 32-bit IEEE 754 floating point\
    \ with single precision. It has an infinite value range. If you need to preserve\
    \ memory in big arrays of floating point integers, use a `float` (rather than\
    \ a `double`). For precise numbers, such as currency, the `float` data type should\
    \ never be used. `0.0F` is the default value.\n\nExample:\n```\nfloat f1 = 234.5f\n\
    ```\n\n## Double Data Type\n\nA `double` data type is a 64-bit IEEE 754 floating\
    \ point with double precision. It has an infinite value range. Like `float`, the\
    \ `double` data type is commonly used for decimal values. For precise values,\
    \ such as currency, the `double` data type should never be utilised. `0.0d` is\
    \ the default value.\n\nExample:\n```\ndouble d1 = 12.3\n```\n\n## Char Data Type\n\
    \nA single 16-bit Unicode character is represented by the `char` data type. It\
    \ has a value range of `'u0000'` (or `0`) to `'uffff'` (or `65,535` inclusive).\
    \ Characters are stored using the `char` data type.\n\nExample:\n```\nchar letterA\
    \ = 'A'\n```\n\n# Operators in Java\n\nIn Java, an operator is a symbol that performs\
    \ operations. For instance, `+`, `-`, `*`, `/`, and so on.\n\nIn Java, there are\
    \ many different types of operators, which are listed below:\n\n* Unary Operator\n\
    * Arithmetic Operator\n* Shift Operator\n* Relational Operator\n* Bitwise Operator\n\
    * Logical Operator\n* Ternary Operator\n* Assignment Operator\n\n## Java Operator\
    \ Precedence\n\n![](Images/image00127.jpeg)\n\n![](Images/image00128.jpeg)\n\n\
    ### Java Unary Operator\n\nOnly one operand is required for the Java unary operators.\
    \ Unary operators are employed to carry out a variety of tasks.\n\n![](Images/image00129.jpeg)\n\
    \n### Java Unary Operator Example: ++ and --\n\n```java\nclass OperatorExample\
    \ {\n    public static void main(String[] args[]) {\n        int x = 10;\n   \
    \     System.out.println(x++); // 10 (1)\n        System.out.println(++x); //\
    \ 12\n        System.out.println(x--); // 12 (1)\n        System.out.println(--x);\
    \ // 10\n    }\n}\n```\nOutput:\n```\n10\n12\n12\n10\n```\n\n### Java Unary Operator\
    \ Example 2: ++ and --\n\n```java\nclass OperatorExample {\n    public static\
    \ void main(String[] args[]) {\n        int a = 10;\n        int b = 10;\n   \
    \     System.out.println(a++ + ++a); // 10+12=22\n        System.out.println(b++\
    \ + b++); // 10+11=21\n    }\n}\n```\nOutput:\n```\n22\n21\n```\n\n### Java Unary\
    \ Operator Example: ~ and !\n\n```java\nclass OperatorExample {\n    public static\
    \ void main(String[] args[]) {\n        int a = 10;\n        int b = -10;\n  \
    \      boolean c = true;\n        boolean d = false;\n        System.out.println(~a);\
    \ // -11 (minus of total positive value starts from 0)\n        System.out.println(~b);\
    \ // 9 (positive of total minus, starts from 0)\n        System.out.println(!c);\
    \ // false (opposite of boolean value)\n        System.out.println(!d); // true\n\
    \    }\n}\n```\nOutput:\n```\n-11\n9\nfalse\ntrue\n```\n\n### Java Arithmetic\
    \ Operators\n\nAddition, subtraction, multiplication, and division are all performed\
    \ using Java arithmetic operations. They function as fundamental mathematical\
    \ procedures.\n\n### Java Arithmetic Operator Example\n\n```java\nclass OperatorExample\
    \ {\n    public static void main(String[] args[]) {\n        int a = 10;\n   \
    \     int b = 5;\n        System.out.println(a+b); // 15\n        System.out.println(a-b);\
    \ // 5\n        System.out.println(a*b); // 50\n        System.out.println(a/b);\
    \ // 2\n        System.out.println(a%b); // 0\n    }\n}\n```\nOutput:\n```\n15\n\
    5\n50\n2\n0\n```\n\n### Java Arithmetic Operator Example: Expression\n\n```java\n\
    class OperatorExample {\n    public static void main(String[] args[]) {\n    \
    \    System.out.println(10*10/5+3-1*4/2);\n    }\n}\n```\nOutput:\n```\n21\n```\n\
    \n### Java - Left Shift Operator\n\nThe Java left shift operator shifts all the\
    \ bits in a value to the left by a specified number of times.\n\n### Java Left\
    \ Shift Operator Example\n\n```java\nclass OperatorExample {\n    public static\
    \ void main(String[] args[]) {\n        System.out.println(10<<2); // 10*2^2=10*4=40\n\
    \        System.out.println(10<<3); // 10*2^3=10*8=80\n        System.out.println(20<<2);\
    \ // 20*2^2=20*4=80\n        System.out.println(15<<4); // 15*2^4=15*16=240\n\
    \    }\n}\n```\nOutput:\n```\n40\n80\n80\n240\n```\n\n### Java - Right Shift Operator\n\
    \nThe Java right shift operator `>>` shifts the left operand's value to the right\
    \ by the number of bits given by the right operand.\n\n### Java - Right Shift\
    \ Operator Example\n\n```java\nclass OperatorExample {\n    public static void\
    \ main(String[] args[]) {\n        System.out.println(10>>2); // 2\n        System.out.println(20>>2);\
    \ // 5\n        System.out.println(20>>3); // 2\n    }\n}\n```\n\n### Java Shift\
    \ Operator Example: >> vs >>>\n\n```java\nclass OperatorExample {\n    public\
    \ static void main(String[] args[]) {\n        // For positive number, >> and\
    \ >>> works same\n        System.out.println(20>>2);\n        System.out.println(20>>>2);\n\
    \        // For negative number, >>> changes parity bit (MSB) to 0\n        System.out.println(-20>>2);\n\
    \        System.out.println(-20>>>2);\n    }\n}\n```\nOutput:\n```\n5\n5\n-5\n\
    1073741819\n```\n\n### Java AND Operator Example: Logical && and Bitwise &\n\n\
    If the first condition is false, the `&&` operator does not verify the second\
