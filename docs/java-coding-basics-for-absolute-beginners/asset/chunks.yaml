    # JDK, JRE 和 JVM 之间的区别


    在学习 Java 之前，我们必须先理解 JDK、JRE 和 JVM 之间的区别。这里是对 JVM 的简要总结。


    如果你想深入学习 Java 虚拟机，请访问以下页面。让我们先来看看 JDK、JRE 和 JVM 之间的区别。


    ### JVM


    `JVM`（Java 虚拟机）是一个抽象的机器。因为它在物理上不存在，所以它被称为虚拟机。它是一个规范，为 Java 字节码的运行创建一个运行时环境。它还可以运行用其他语言编写并编译成
    Java 字节码的应用程序。


    针对各种硬件和软件平台，都有可用的 JVM。由于每个操作系统的设置不同，JVM、JRE 和 JDK 是依赖于平台的。而 Java 是与平台无关的。JVM 分为三个部分：规范、实现和实例。


    JVM 的主要功能如下：


    * 加载代码

    * 验证代码

    * 执行代码

    * 提供运行时环境


    ### JRE


    Java Runtime Environment (`JRE`）是 Java Runtime Environment 的缩写。它也被称为 Java RTE。Java
    Runtime Environment (`JRE`) 是用于创建 Java 应用程序的软件工具集。它负责创建运行时环境。它是 `JVM` 的实现。它是真实的。它包含一系列库以及
    JVM 在执行期间使用的其他文件。


    ### JDK


    `JDK` 一词代表 Java Development Kit（Java 开发包）。Java Development Kit (`JDK`) 是用于创建 Java
    程序和 Applet 的软件开发环境。它是真实的。它包含了 JRE 以及开发者工具。


    # Java 变量


    变量是一个在 Java 程序执行期间存储值的容器。变量被分配了一个数据类型。


    “变量”一词指的是内存区域的名称。局部变量、实例变量和静态变量是 Java 中的三类变量。


    在 Java 中，数据类型分为两类：基本类型和非基本类型。


    ## 变量


    变量是内存分配的留留空间的名称。换句话说，它是内存位置的名字。它由 "variy + ability" 两个词组成，意味着它的值可以被修改。


    ```java

    1.  int data=50; // 这里 data 是变量

    ```


    ### 变量的类型


    * 局部变量

    * 实例变量

    * 静态变量


    #### 1) 局部变量


    局部变量是在方法体内部声明的变量。该变量只能在该方法内部使用，类中的其他方法并不知道它的存在。


    关键字 `static` 不能用于声明局部变量。


    #### 2) 实例变量


    实例变量是在类内部方法体外部声明的变量。它没有被声明为 `static`。由于它的值是特定于实例的且不在实例间共享，因此被称为实例变量。


    #### 3) 静态变量


    静态变量是被声明为 `static` 的变量。它不可能是局部的。你可以制作静态变量的副本并在类的所有实例共享它。静态变量只在类加载到内存时分配一次。


    ### 示例 - Java 中的变量


    ```java

    1.  public class A {

    2.  static int m=100; // 静态变量

    3.  void method() {

    4.  int n=90; // 局部变量

    5.  }

    6.  public static void main(String args[]) {

    7.  int data=50;// 实例变量

    8.  }

    9}// 类结束

    ```


