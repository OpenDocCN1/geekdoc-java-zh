    \n## What is Java\nJava is a platform as well as a programming language. Java\
    \ is a high-level programming language that is also robust, object-oriented, and\
    \ secure.\n\nJava was created in 1995 by Sun Microsystems (which is now a division\
    \ of Oracle). The founder of Java, James Gosling, is recognised as the \"Father\
    \ of Java.\" It was known as Oak before Java. Because Oak was already a recognised\
    \ business, James Gosling and his team decided to alter the name to Java.\n\n\
    Platform: A platform is any hardware or software environment in which a programme\
    \ runs. Java is referred to as a platform because it has a runtime environment\
    \ (`JRE`) and API.\n\n## Java Example\nLet's take a look at an example of Java\
    \ programming. The next page contains a full description of the Hello Java example.\n\
    \n`Simple.java`\n\n```java\nclass Simple {\n  public static void main(String args[])\
    \ {\n    System.out.println(\"Hello Java\");\n  }\n}\n```\n\n## Types of Java\
    \ Applications\nJava programming can be used to construct four different sorts\
    \ of applications:\n\n### 1) Standalone Application\nDesktop applications and\
    \ window-based programmes are examples of stand-alone applications. These are\
    \ typical programmes that must be installed on each machine. Media player, antivirus,\
    \ and other standalone applications are examples. In Java, `AWT` and `Swing` are\
    \ used to create standalone apps.\n\n### 2) Web Application\nA web application\
    \ is an application that runs on the server and generates a dynamic page. `Servlet`,\
    \ `JSP`, `Struts`, `Spring`, `Hibernate`, `JSF`, and other technologies are now\
    \ used to develop web applications in Java.\n\n### 3) Enterprise Application\n\
    A distributed application, such as banking software, is referred to as an enterprise\
    \ application. High-level security, load balancing, and clustering are just a\
    \ few of the benefits. `EJB` is a Java framework for developing enterprise applications.\n\
    \n### 4) Mobile Application\nA mobile application is a programme designed specifically\
    \ for mobile devices. Currently, mobile applications are developed using `Android`\
    \ and `Java ME`.\n\n## Java Platforms\nJava is available on four different platforms\
    \ or editions:\n\n### 1) Java SE (Java Standard Edition)\nIt's a Java programming\
    \ environment. Java programming APIs like `java.lang`, `java.io`, `java.net`,\
    \ `java.util`, `java.sql`, and `java.math` are included. OOPs, `String`, `Regex`,\
    \ `Exception`, Inner classes, Multithreading, I/O Stream, Networking, `AWT`, `Swing`,\
    \ `Reflection`, `Collection`, and other key subjects are covered.\n\n### 2) Java\
    \ EE (Java Enterprise Edition)\nIt's a business platform that's primarily used\
    \ for creating online and corporate apps. It is constructed using the Java SE\
    \ platform. `Servlet`, `JSP`, `Web Services`, `EJB`, `JPA`, and other subjects\
    \ are covered.\n\n### 3) Java ME (Java Micro Edition)\nIt's a mobile application-focused\
    \ microplatform.\n\n### 4) JavaFX\nIt's a programming language that's used to\
    \ create rich online apps. It makes use of a simple user interface API.\n\n# Features\
    \ of Java\nThe major goal of the Java programming language's development was to\
    \ make it portable, simple, and secure. Apart from that, there are a number of\
    \ good aspects that contribute to the language's popularity. Java buzzwords refer\
    \ to the aspects of the language.\n\nThe following is a list of the most essential\
    \ characteristics of the Java programming language.\n\n![](Images/image00121.jpeg)\n\
    \n### Simple\nJava is a fairly straight language to learn, with a grammar that\
    \ is simple, clear, and easy to comprehend. Java is a simple programming language,\
    \ according to Sun Microsystem, because:\n- Java syntax is based on `C++` (making\
    \ it easier for programmers to pick up after they've learned `C++`).\n- Many difficult\
    \ and rarely-used features, such as explicit pointers and operator overloading,\
    \ have been eliminated from Java.\n- Because Java has `Automatic Garbage Collection`,\
    \ there is no need to remove unreferenced objects.\n\n### Object-oriented\nJava\
    \ is a computer language that focuses on objects. In Java, everything is an object.\
    \ Object-oriented programming refers to the organisation of software as a collection\
    \ of various types of objects that include both data and behaviour.\nObject-oriented\
    \ programming (OOPs) is a software development and maintenance technique that\
    \ follows a set of rules.\n\n### Platform Independent\nJava is platform independent\
    \ in contrast to other languages such as `C`, `C++`, and others, which are compiled\
    \ into platform-specific machines, whereas Java is a write-once, run-anywhere\
    \ language. The hardware or software environment in which a programme runs is\
    \ referred to as a platform.\nSoftware-based and hardware-based platforms are\
    \ the two sorts of platforms. Java is a platform that is built on software.\n\n\
    ### Secured\nThe security of Java is its most well-known feature. We can create\
    \ anti-virus solutions using Java. Because of the following, Java is protected:\n\
    - There is no specific pointing device.\n- Java programmes are run in a sandbox\
    \ environment.\n- `Security Manager` is a component of the Java Runtime Environment\
    \ (`JRE`) that is used to dynamically load Java classes into the Java Virtual\
    \ Machine (`JVM`). It improves security by isolating the package for local file\
    \ system classes from those imported from network sources.\n- `Bytecode Verifier`:\
    \ It examines code fragments for illegal code that could compromise object access\
    \ privileges.\n- `Security Manager`: It determines the resources a class has access\
    \ to, such as reading and writing to the local disc.\n\n### Robust\nRobust's English\
    \ mining industry is thriving. Java is a robust programming language because:\n\
    - It makes extensive use of memory management.\n- There aren't any pointers, hence\
    \ there aren't any security issues.\n- Automatic garbage collection is provided\
    \ by Java and operates on the Java Virtual Machine to get rid of things that are\
    \ no longer in use.\nIn Java, there are exception handling and type checking mechanisms.\
    \ All of these factors contribute to Java's robustness.\n\n### Architecture-neutral\n\
    Because there are no implementation-dependent aspects in Java, such as the size\
    \ of primitive types, it is architecture neutral.\nIn `C` programming, the `int`\
    \ data type takes up two bytes in 32-bit architecture and four bytes in 64-bit\
    \ architecture. In Java, however, it takes up 4 bytes of memory on both 32-bit\
    \ and 64-bit architectures.\n\n### Portable\nJava is portable because it allows\
    \ you to move the Java bytecode from one platform to another. It does not necessitate\
    \ any kind of implementation.\n\n### High-performance\nBecause Java bytecode is\
    \ \"near\" to native code, it is faster than other traditional interpreted programming\
    \ languages. It is nevertheless slower than a compiled language (for example,\
    \ `C++`).\n\n### Distributed\nBecause it allows users to construct distributed\
    \ programmes in Java, it is distributed. For developing distributed applications,\
    \ `RMI` and `EJB` are employed. This Java capability allows us to access files\
    \ by calling methods from any system connected to the internet.\n\n### Multi-threaded\n"
