  md: 'The second key concept for Gumilev is ethnogenesis. He defines it as the process
    by which some or many members of an ethnie become passionaries. Unfortunately,
    the specifics of the mechanism that he offers only on phenomena that are either
    currently unknown to science or flatly contradicted by it. According to Gumilev,
    the Earth is periodically struck by bundles of cosmic energy, which cause the
    mutation of passionarity. Gumilev identified a number (about ten) of such events
    that occurred during the known history of Eurasia. Each event gives impulse to
    multiple occurrences of ethnogenesis in bandlike regions several hundreds of kilometers
    long.


    After the initial impulse, the passionarity of the affected group increases over
    the period of several centuries, reaches a peak, and then declines. Meanwhile,
    the group expands, first becoming a subethnie, then a full ethnie (in the process
    perhaps absorbing other ethnically related groups), and finally creating a metaethnic
    empire (unless it prematurely loses to an even stronger neighbor). Eventually,
    as passionarity continues to fade, the polity built around the core ethnie loses
    its cohesiveness and falls prey to a combination of internal warfare and external
    aggression. Using multiple examples, ranging across the whole history of Eurasia,
    Gumilev provides a detailed phenomenology of the rise and fall of ethnies and
    empires.


    # Assessment


    Because I focused on what I perceive as major weaknesses in Gumilev''s theory,
    my account did not really do justice to it. Gumilev has amassed an enormous amount
    of historical and ethnological material. Even when one disagrees with the mechanisms
    that he advances, it is difficult to escape the feeling that he has indeed identified
    some regularities in the historical process. I believe that there are several
    insights of Gumilev''s that are of great interest. First, it is a fruitful hypothesis
    that there is a close connection between the fortunes of a polity and its core
    ethnie. This is a particularly important point, because Gumilev shows with much'
  merge: -1
  pgno: 81
- img_proc: true
  md: 'factual material that the modern relationship between nationalism and state
    has very close analogs in history. That is, ethnicity and polity are variables
    that may be dynamically connected.


    Second, Gumilev''s concept of ethnogenesis has a lot of merit. Most if not all
    currently existing ethnies started small and then expanded by a variety of mechanisms,
    including demographic growth and ethnic assimilation. Successful territorial expansion
    was very much a factor in this ethnic expansion. Something allowed these initially
    ethnic groups to acquire a high capacity for collective action. Thus, another
    potentially hypothesis is that there is a close relation between the process of
    ethnogenesis and enhanced collective solidarity.


    In contrast, Gumilev''s concept of passionarity does not appear to be a fruitful
    concept to me; at least it does not add anything useful to Ibn Khaldun''s asabiya.
    Furthermore, the temporal trajectory of passionarity increase by decrease, postulated
    by Gumilev, is too mechanical. Gumilev treats passionarity as an exogenous variable:
    it waxes and wanes according to its own internal nature, to speak and is not related
    in any obvious way to other variables in the system. Before this concept can be
    of use, it must be endogenized somehow. Interestingly, the few mathematical attempts
    to model Gumilev''s theory that I know of specify passionarity as an exously driven
    variable.


    # 2.3.3 The Modern Context


    Durkheim''s Mechanical and Organic Solidarity


    The concept of asabiya (collective solidarity) that I discuss in this chapter
    does not "hang in the air.\ Instead, it appears to be related to several much
    more modern theories in sociology, social psychology, and political science. Within
    sociology the best-known theory of social cohesion has been developed by Durkheim
    (1915, 1933). Gellner (1981:86–98) provides a highly useful comparison of Ibn
    Khaldun''s and Durkheim''s theories, which I briefly summarize here. As is well
    known, Durkheim contrasted two kinds of solidarities: mechanical which was based
    on similarity between'
  merge: -1
  pgno: 82
- img_proc: true
  md: 'individuals and organic which was based on complementarity or mutual interdependence.
    Simple sedimentary societies, such as the Bedouins of Ibn Khaldun, can possess
    only mechanical solidarity, while more complex urban societies characterized by
    greater division of labor have the potential to exhibit organic solidarity. In
    Durkheim''s view, mechanical solidarity was an inferior form of social cohesion,
    compared to organic solidarity.


    In Ibn Khaldun''s theory the only kind of social cohesion is the one arising from
    what Durkheim would call mechanical solidarity. "Organic solidarity" for Ibn Khaldun
    was not solidarity at all, but a form of social dissolution. Civilized life with
    its complex division of labor was inherently inimical to social cohesion and given
    time would degrade the initially asabiiya of tribesmen moving to town (Gellner
    1981:87).


    In general, it is not clear whether such economic variables as the degree of division
    of labor have any relevance to the waxing or waning of asabiya. By contrast, cultural
    uniformity appears to be an important precondition of social cohesion. Ruling
    elites of successful nation-states as France certainly thought so, and as a result
    employed rather draconian methods for imposing linguistic uniformity on their
    citizens (Weber 1976). In any case, the Durkheimian concept of organic solidarity
    appears to be primarily applicable to industrial societies. If so, then the distinction
    between organic and mechanical solidarity is largely irrelevant in our analysis
    of preindustrial agrarian societies. On the other hand, Durkheim''s insight that
    religion is one of the most powerful forces that keeps groups together appears
    to be highly relevant to the issues under investigation (see also Collins 1992).


