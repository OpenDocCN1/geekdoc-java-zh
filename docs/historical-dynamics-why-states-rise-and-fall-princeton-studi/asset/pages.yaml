  md: '# A Digression on Synchrony


    One interesting aspect of the Bourbon wave was that France''s period of instability
    was shifted in time with respect to the rest of western Europe. Thus, central
    Europe’s period of instability was during the Thirty Years War (1618–1648). England''s
    was 1640 to 1690 (English Revolution, Stuart Restoration, and the Glorious Revolution).
    Spain''s crisis years were during the 1640s: rebellions in Portugal, Catalonia,
    and southern Italy (although we should not forget about the Dutch revolt of the
    second half of the sixteenth century). Only Russia seems to be on the same trajectory
    as France (as will be seen in the next section).


    This comparison raises a number of interesting issues. First, why did early modern
    state breakdown to occur in waves (Goldstone 1991b)? The crisis of the seventeenth
    century and the age of revolutions during the nineteenth century affected Europe,
    the Middle East (Ottoman Turkey), and East Asia (China). Second, although there
    was a rough synchrony between different policies, it was not by any means perfect,
    as the fine structure of the “seventeenth-century crisis” shows. Additionally,
    although Russia was in synchrony with France during the seventeenth century crisis,
    it subsequently shifted out of phase, since it experienced revolutions and state
    collapse in the early twentieth century, not in the nineteenth century as was
    the case for central and western Europe.


    We can look for explanations in purely exogenous factors, such as climate fluctuations
    (Galloway 1986; Goldstone 1991b). Thus, it is possible that the plague of the
    fourteenth century (itself a consequence of the Mongolian super-empire) “reset”
    a number of policies to the same starting conditions. Another possibility is “contagion”
    leading to positive spatial autocorrelations. For example, almost synchronous
    uprisings in Portugal, Catalonia, and Sicily could have happen because the revolt
    in one region could encourage others to do the same. Similarly, it is known that
    the wave of European revolutions in 1848 fed on news from other parts of the continent.
    The third possibility is suggested by the dynamical systems theory.'
