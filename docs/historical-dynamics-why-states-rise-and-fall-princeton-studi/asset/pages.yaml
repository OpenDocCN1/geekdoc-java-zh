  md: '# Chapter Eight


    # Secular Cycles in Population Numbers


    # 8.1 INTRODUCTION


    A major prediction emerging from the demographic-structural theory (Chapter 7)
    is that population numbers in agrarian societies are expected to go through slow
    oscillations with a periodicity of approximately two to three centuries.¹1 We
    do not necessarily expect these secular cycles to be very regular. What the theory
    says, however, is that these dynamics should be of second order. The concept of
    process order was introduced in Section 2.1.4 and will be further formalized for
    human population dynamics below. Put in nontechnical language, however, what I
    mean is that both the increase and decrease phases of population oscillations
    should occur over periods of multiple human generations.


    Secular waves in the socioeconomic and demographic history of western Europe have
    been described by François Simandi(1932), Wilhelm Abel (1966), Michael Postan
    (1973), and Emmanuel Le Roy Ladurie (1974) (see Braudel 1988; Fischer 1996). Recently,
    Sergey Nefov (1999, 2002a) presented data suggesting that secular cycles also
    occur in several macroregions of Asia (China, the Middle East, and India).


    Much of the data on population fluctuations with which these authors worked is
    of a fragmentary nature. Nevertheless, several data series of reasonable length
    have been compiled and published in recent years. This development presents us
    with an opportunity to test the predictions of the demographic-structural theory
    by using the formal methods of time-series analysis in order to estimate'
  merge: -1
  pgno: 245
- img_proc: true
  md: 'empirically the periodicity and process order characterizing long-term fluctuations
    in population numbers. Performing such an analysis is the main goal of this chapter.
    I begin by discussing how the process order can be estimated from time-series
    data on population dynamics. Next, I apply the statistical approach to the available
    time-series data on historical population dynamics. Finally, I extend the analysis
    to one case study in which we have data on both population numbers and the dynamics
    of sociopolitical instability.


    # 8.2 “SCALE” AND “ORDER” IN HUMAN POPULATION DYNAMICS


    Population ecologists have recently made great strides in modeling, analyzing,
    and explaining the population dynamics of nonhuman organisms. I review these developments
    in my book by Complex Population Dynamics (Turchin 2003). It is possible that
    we can transfer some of the techniques and insights developed by population ecologists
    to the study of human population dynamics? Certainly, the set of specific mechanisms
    that affect human reproduction, mortality, and migration should be very different
    from those proposed for animals. Many of these mechanisms must be economic and
    sociological in nature, and it seems highly unlikely that certain ecological models,
    e.g. a predator-prey model with humans playing the role of prey, would be of in
    studying human populations. On the other hand, ecological models such as those
    dealing with resource-consumer or disease-host interactions may be quite relevant
    to understanding the dynamics of historic and prehistoric human populations, as
    long as we do not fall into the trap of biologism, by attempting to explain everything
    solely in biological terms. What is important to note here is that population
    dynamicists have developed a set of general approaches to the nonlinear modeling
    of time-series data coming from population systems. These methods do not assume
    specific ecological models, that may or may not apply to human populations. Rather,
    they'
  merge: -1
  pgno: 246
- img_proc: true
  md: 'provide us with tools for quantifying empirical patterns in temporal fluctuations
    of population numbers.


    In Section 2.1.4 I introduced the concept of process order. It turns out that
    this concept is very useful in investigations of population dynamics of nonhuman
    organisms (Turchin 2003). However, while order is a readily definable property
    of differential equations (in which context I introduced it in Section 2.1.4),
    the application of this concept to the analysis of time-series data is not completely
    straightforward. The important point is that the order that we estimate depends
    on the temporal scale at which population fluctuations are quantified. Thus, a
    few remarks are warranted on the temporal scale at which various mechanisms affecting
    population change operate.


    # Temporal Scale: Years


    Let us consider four potential time scales: years, decades, centuries, and millennia.
    The first of these scales, years, is an important pacesetter for the dynamics
    of the resource base of human populations, because usually food gathering and
    production are strongly influenced by seasonal cycles. Additionally, many sources
    of mortality operate on a yearly (or faster) scale. For example, research on the
    dynamics of childhood diseases shows that these historically important sources
    of mortality have their own rhythms: the annual cycle driven by seasonal variation
    in contact rate (York and London 1973), and a characteristic 2–3 year oscillation
    associated with the nonlinear nature of population interaction between infants
    and the pathogen (Schaffer and Kot 1985). Other sources of mortality that should
    be strongly affected by a seasonal cycle are death as a result of exposure to
    inclement weather and starvation due to seasonal death.


    # Temporal Scale: Decades and Centuries


    The next scale, decades, is the appropriate one for measuring replacement of human
    populations due to reproduction. The'
  merge: -1
  pgno: 247
- img_proc: true
  md: 'important benchmark here is some measure of generation time. The reproductive
    age for human females extends from 15 to 45 years of age (Wood 1990). However,
    the curve of fecundability as a function of age is skewed, so that its mode (maximum
    fertility rate) is roughly 20, while its mean (average age of female at birth)
    is around 25, and in some populations closer to (or even over) 30 years. Certainly,
    there is a large amount of variation in these measures of generation length for
    humans, depending on biological (nutrition, mortality schedules) and social (age
    at marriage) characteristics of the population. It is clear, though, that for
    most historical human populations generation time should lie in the interval between
    20 and 30 years.


    General population dynamics theory suggests that population dynamics have oscillatory
    components failing within three classes: generation, first-order, and second-order
    cycles (Turchin 2003). *Generation cycles* are characterized by a period between
    20 and 30 years. These cycles are often found in human populations (Keyfit 1972).
    They become apparent when population age structure is represented as an age pyramid.
    For example, the age pyramid for the current U.S.A. population has clear bulges
    separated by around 30 years, representing baby boomers and children of baby boomers.
    Generation cycles are even more apparent in the population of present-day Russia,
    a fact probably explained by two huge perturbations of age structure—World War
    I/Civil War and World War II—were separated by roughly one generation time, setting
    a series of ensuing oscillations. Unlike generation cycles in certain insect populations
    (Godfray and Hassell 1989), however, human cycles do not appear to be stable phenomena,
    and dissipate rather rapidly after a perturbation (Wachter and Lee 1989). Furthermore,
    generation cycles are usually expressed as oscillations in age structure and have
    only a weak effect on total numbers.


    Unlike generation cycles, which arise as a result of interactions between age
    classes, *first-order cycles* result from relatively fast density-dependent feedback
    mechanisms. First-order cycles arise most naturally in discrete population models,
    and have a typical'
  merge: -1
  pgno: 248
- img_proc: true
  md: 'period of two generations (one generation at high density, the next at low,
    and so on). The existence of first-order cycles in human populations was hypothesized
    by Easterlin (1980). Easterlin suggested that, during twentieth century, U.S.
    demography was characterized by an alternation of large and small-cohort generations.
    A sparse generation enjoys better wages (due to labor shortages) and produces
    many children. The next generation, however, experiences increased competition
    and produces few children. This mechanism can theoretically lead to a typical
    first-order oscillation with an average period of two generations (40–50 years).
    Although formal models confirm that two-generation cycles can in principle occur,
    in practice the estimates of parameters are such that they do not place the model
    in the cyclic regime (Let 1974; see also Fraental and Swick 1983; Wachter and
    Lee 1989).


    Second-order cycles arise as a result of population size interacting with some
    other slow dynamical variable (see Section 2.1.4). An example of second-order
    oscillations is the dynamics of the demographic-fiscal model of state breakdown
    (Figure 7.1). Unlike first-order cycles, in which the increase and decrease phases
    are each one generation long, second-order oscillations are characterized by increase
    and decrease phases of multiple generations in duration. Thus, the basic trichotomy
    of generation, first-order, and second-order cycles result in periods of one,
    or many generations.


    Let us consider what would be an appropriate temporal scale for studying second-order
    oscillations, were they to exist for human populations. Population theory based
    on discrete models suggests that second-order cycles are characterized by a minimum
    period of six generations (Murdoch et al. 2002). Typical periods in such models
    range from 6 to 12–15 and more generations (Turchin 2003). Bracketing the human
    generation time by 20 and 30 years suggests that second-order cycles in humans
    should have periods ranging from 120 to 450 years, with the most likely region
    of 200–300 years. Of course, this calculation assumes that factor X—the slow dynamical
    variable, whose interaction with population density drives the oscillations—operates
    at a temporal scale similar to that'
  merge: -1
  pgno: 249
- img_proc: true
  md: 'characterizing movements of human populations. However, this is probably not
    a bad assumption, to a first approximation, because if the two interacting variables
    operate on to different temporal scales then we cannot easily get second-order
    dynamics (if one variable operates on a time scale much faster than the other,
    the feedback for the slow variable essentially becomes “fast,” and the dynamics
    become first order). Similar periods are suggested by simple continuous-time models.
    For example, in the Lotka-Volterra prediction model (Section 2.1.3), the period
    of oscillations is approximately $2\pi/\sqrt{r\delta}$, where $r$ is the per capita
    rate of prey growth, and $\delta$ is the analogous parameter for predators (it
    is actually the per capita decline rate of predator population in the absence
    of prey). Assuming that $r$ and $\delta$ are of the same order of magnitude as
    the intrinsic per capita rate of human population growth, $r_0$ leads to a (very
    rough) period estimate of $2\pi/r_0$. Because $r_0$ of human populations should
    be around 0.02 yr$^{-1}$ (although in modern times some populations have been
    known to grow at 4% annual rate, this is probably an overestimate for historical
    times), the estimate of the oscillation period is 300 years. This estimate is
    similar to that suggested by the discrete-time theory above. In summary, my expectation
    is that second-order cycles in human populations, if they exist, should be characterized
    by periods of 2–3 centuries.


    The rough calculations in the above paragraph should be taken only as an indicator
    of the order of magnitude of period length that might characterize second-order
    oscillations in human population dynamics. Clearly, periodicity will change depending
    on the nature of variables, model structure, and parameter values. On the other
    hand, we have a theory for population dynamics in agrarian societies (Chapter
    7). Models based on the demographic-structural theory predict oscillations with
    period ranging from one to three centuries, depending on the model structure and
    parameter values. This theoretical result provides a somewhat firmer basis for
    the prediction of oscillation periods.'
