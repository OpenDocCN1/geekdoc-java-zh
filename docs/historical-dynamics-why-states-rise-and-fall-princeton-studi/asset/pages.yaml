    Ibn Khaldun’s theory of asabiya, and Gumilev’s theory of passionarity.


    # 3.2.1 Ibn Khaldun''s Theory


    The fourteenth-century Arab thinker Ibn Khaldun was probably the first sociologist
    in the modern sense (Gellner 1981). In his monumental work The Muqaddimah: An
    Introduction to History he advances a remarkable theory of political cycles. Ibn
    Khaldun developed his theory mainly to explain the history of the Maghreb (Northern
    Africa), but he also makes excursions to other areas known to him (e.g., Arabic
    Spain and the Middle East). Ibn Khaldun was not an ivory-tower academic. He was
    a practicing politician and almost lost his life in a failed coup. He also traveled
    extensively (even encountering and having a long conversation with Timur Len once).
    In short, Ibn Khaldun knew well the workings of the societies he studied from
    the inside.


    # Groups and Group Solidarity


    Ibn Khaldun’s main argument is remarkably modern (the following account partly
    relies on the introduction to the Muqaddimah translator Franz Rosenthal, indicated
    by lower-case Roman page numbers; upper-case Roman numbers indicate the volume).
    He begins by postulating that a human individual cannot live outside a group:
    it is absolutely necessary for man to have the cooperation of his fellow men (Ibn
    Khaldun 1958:I:90). Defense and protection are successful only for a closely knit
    group (Ibn Khaldun 1958:I:263). But a communal way of life is also necessary for
    acquiring different crafts and technical skills, and for intellectual intercourse.
    The next'
  merge: -1
  pgno: 76
- img_proc: true
  md: 'postulate is that different groups have different abilities for concerted action.
    Here Ibn Khaldun introduces the key concept of his theory: asabiya, which Rosenthal
    translates as “group feeling.” Originally the word signified something like “making
    common cause with one’s agnates” (Ibn Khaldun 1958:I:xxviii). But in Ibn Khaldun’s
    usage, asabiya is a wider concept, because it can also be shared by people not
    related to each other. Asabiya produces “the ability to defend oneself, to offer
    opposition, to protect oneself, and to press one’s claims” (Ibn Khaldun 1958:I:289).
    Preponderance of asabiya renders one group superior to others (Ibn Khaldun 1958:I:lxxix).


    Ibn Khaldun was clearly aware of the nested nature of ethnic groups, and that
    each level has its own asabiya associated with it. For example, he notes, in order
    for the higher-level group not to fall apart, its asabiya must be stronger than
    the asabiyas of lowerlevel groups combined (Ibn Khaldun 1958:284). Additionally,
    he continuously stresses that the leading or ruling element within a group must
    be vested in a family or lineage that has the strongest and most natural claim
    to the control of the available asabiyas (Ibn Khaldun 1958:I:lxxx). Only the leader
    who controls an asabiya of sufficient strength may succeed in founding a dynasty.


    # Dynamics of Asabiya


    Ibn Khaldun also develops a detailed theory explaining how asabiya is created,
    and also how it is lost. In general, asabiya arises from “the social intercourse,
    friendly association, long familiarity, and companionship” (Ibn Khaldun 1958:I:374).
    This is remarkably similar to the explanation of how social capital is acquired
    (Putnam 2000; for a comparison of asabiya and social capital, see Section 3.2.3).
    However, not all social conditions are conducive to the growth of asabiya. As
    I mentioned above, Ibn Khaldun’s theory was developed for the specific situation
    of the Medieval Maghreb. Ibn Khaldun distinguishes two major ethnic groups inhabiting
    the Maghreb: the Berbers and the Arabs. These two groups not not ethnically, but
    also in the way their societies are organized:'
