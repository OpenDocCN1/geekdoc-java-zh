  pgno: 77
- img_proc: true
  md: 'respectively, "desert" and "civilization." The distinction that Ibn Khaldun
    makes, however, is not between nomadism and sedentary life; he rather groups together
    nomads and sedentary backwoods people, and contrasts them with sedentary urban
    people as inhabitants of large population centers (Ibn Khaldun 1958:I:xxvii).
    The sociological distinction is not qualitative, but quantitative, and refers
    to the size and density of human settlements, as well as the scale of polities.
    "Desert" is characterized by small-scale politics (chiefdoms, in the modern terminology).
    "Civilization" is organized in states and empires (except during the periods of
    state breakdown).


    In Ibn Khaldun''s view, the society type is the key to understanding how asabiya
    increases or declines. "Desert" life with its constant struggle for survival and,
    consequently, necessity of cooperation creates conditions for asabiya growth.
    "Civilized" society controls a large number of human beings available, and a certain
    proportion of it may be channeled into production of "conveniences" and luxuries
    ( is, not necessities). This development toward luxury carries a penalty in the
