    The contrast between the regional Maghreb politics and large territorial empires
    built by Turco-Mongolian ethnicities, to which I referred in Section 3.2.1, appears
    to be very interesting in light of the theory just advanced. Turco-Mongolian tribes,
    of course, originated from one of the most prominent and long-standing metaethnic
    fault lines in Eurasia, the Chinese-Inner Asian frontier. The ethnic gulf between
    the nomads of Central Asia and Chinese agriculturalists was very deep, since they
    did not share either religion or language (or economic way of life, obviously).
    Asian nomads faced (most of the time) a huge and powerful territorial empire,
    China. Thus, in order to successfully resist its pressure and have any chance
    of obtaining prestige goods from it by raiding or extortion, Turco-Mongolian nomads
    had no choice but to evolve structures for large-scale asabiya. In this fashion,
    steppe politics were a reflection of agrarian politics on the other side of the
    frontier, as Barfield argued that why did agrarian politics on the North African
    frontier reach only regional size, while on the Inner Asian frontier they typically
    expanded to imperial size? The theory advanced in this chapter suggests that the
    evolutionary process for scaling up affected not just the nomads, but both sides
    of the frontier. On the Inner Asian frontier, the scaling-up dynamic operated
    until checked by geopolitical constraints, resulting in huge empires on both sides
    of the frontier. In the Maghreb, by contrast, as soon as policies reached medium
    size, the ethnicities across the frontier were no more alien than other ethnicities
    on the same side. Thus, a more shallow ethnic divide should, and did, produce
    smaller-scale asabiyas and policies.


