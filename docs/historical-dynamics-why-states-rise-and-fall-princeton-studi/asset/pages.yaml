  md: '# Appendix A


    # Mathematical Appendix


    # A.1 TRANSLATING THE HANNEMAN MODEL INTO DIFFERENTIAL EQUATIONS


    If we start with the equations on p. 18 of Hanneman et al. (1995), replace discrete
    time time derivatives with continuous derivatives, and change the delayed effect
    of war success on prestige into instantaneous, then we have the following system:


    ```

    C = (L_0 - L)S\nW = \delta_p C\n\dot{S} = W\n\dot{L} = W

    ```


    where $C$ ($C_t$ in the Hanneman et al. notation) is the level of conflict initiated
    by the focal state at time $t$, $L$ ($L_p$, also $PR_t$) is the legitimacy level,
    $W$ ($WS_t$) is the current degree of war success, and $S$ ($CS_t$) is the accumulated
    record of past successes and failures. The parameter $L_0$ ($LG$ in the Hanneman
    et al. notation) is the legitimacy goal, $\delta_p$ = $(E - EP)/(P + EP)$ is the
    power differential between the focal state and its adversaries. Substituting the
    relationships for $C$ and $W$ into the differential equation for $L$, we have


    ```

    \dot{L} = \delta_p(L_0 - L)S \quad\ (A.1)

    ```'
  merge: -1
  pgno: 327
- img_proc: true
  md: 'Since $\dot{S} = \dot{L}, S = L - d$, where $d = L(0) - S(0)$ is the initial
    difference between accumulated success and legitimacy. Substituting this relationship
    into equation (A.1), we have


    ```

    $\dot{L} = \delta_p(L_0 - L)(L - d) \quad (A.2)$

    ```


    This is essentially the logistic model (it would be precisely logistic if $d=0$),
    and its dynamics appear to match the behavior of the Hanneman et al. simulation
    (1995:21–24).


    Let us investigate the consequences of the Hanneman et al. assumptions for territorial
    dynamics, using some components from Section 2.2.1. First, recall that the rate
    of territorial change is directly proportional to war success; thus $\dot{A} =
    gW, \dot{L} = g$. Integrating this equation, we obtain $L = q + A/g$ ($q$ is the
    integration constant). Substituting this relationship in equation (A.2), we have


    ```

    $\dot{A} = \delta_p(L_0 - q - A/g)(q + A/g) \quad (A.3)$

    ```


    We are not done yet, because the power differential $\delta_p$ is a function of
    $A$: $\delta_p = cA\exp[-\sqrt{A}/h] - a$ (Section 2.2.1). Employing this relationship,
    we have the final result:


    ```

    $\dot{A} = g(cA\exp[-\sqrt{A}/h]-a)(L_0 - q - A/g)(q + A/g) \quad (A.4)$

    ```


    Although this equation looks quite complex, its form is $\dot{A}=f(A)$. The complexity
    of $f(A)$, however, does not matter. The major conclusion from this exercise is
    that the legitimacy-conflict model is described by a *single-dimensional ordinary
    differential equation*. This model can have multiple equilibria, and depending
    on the initial values of $A(0)$ and $L(0)$ (which affect the integration constant
    $q$), the trajectory will be attracted to one or another of the stable ones. But
    this model is incapable of predicting boom/bust dynamics.'
