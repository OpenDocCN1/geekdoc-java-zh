  md: '# Chapter Nine


    # Case Studies


    One of the main themes of this book is the need for an objective, rigorous approach
    to testing various theories explaining historical dynamics. Following this approach,
    I discussed several such theories, including geopolitical, ethnodynamic, and demographic-structural
    ones. All theories were subjected to one or more empirical tests, which they passed
    with various degrees of success. So it seems that each theory, when examined separately,
    has some empirical justification. However, it is not yet clear how we should combine
    the various models together to explain the holistic phenomenon of historical dynamics.
    We need to generate ideas, and this requires a less rigorous attitude than that
    involved in testing the hypotheses based on the ideas. Accordingly, in this penultimate
    chapter, I shift gears and use a very different approach from the one used before.
    My goal is to look at some specific case studies and discuss how specific mechanisms
    may be operating in each particular case, how different mechanisms may interact
    with each other, and what sorts of more rigorous hypotheses we may attempt to
    develop for future research.


    I chose to focus on two politics: France and Russia in the long durée (from the
    origins to 1900 C.E.). These two cases are a sample from the universe of successful
    European territorial empires (in particular, both were members of the Great Powers
    club during the eighteenth and nineteenth centuries). Both politics are situated
