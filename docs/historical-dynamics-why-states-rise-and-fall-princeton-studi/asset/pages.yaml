    # 6.2 THEORY


    # 6.2.1 Nonspatial Models of Assimilation


    *The Noninteractive Model*


    I begin with the simplest possible formulation of an ethnokinetic process. First,
    I assume that there are only two groups: the *core* and the periphery ethnicities.
    Second, the population growth rates of the two ethnicities are the same. This
    means that the relative proportions of core and peripheral ethnicities change
    with time only as a result of individuals switching ethnic allegiance (identity).
    Third, peripheral ethnicities switch their ethnicity and become members of the
    core ethnic with a constant probability per unit of time. These assumptions lead
    to what I call the *noninteractive assimilation model* (*noninteractive* because
    the probability of switching ethnic identity does not depend on what others are
    doing). Very similar models were proposed by Hopkins (1973) and Cederman (1997),
    although these authors modeled not two, but several classes of individuals (classified
    according whether they were assimilated or not, or mobilized or not).


    Obviously, the assumption of two distinct ethnicities, with individuals making
    an instantaneous switch between them, is a great oversimplification of the reality.
    However, there were some instances in history for which this simple model may
    provide not a bad approximation. I refer to those historical ethnicities who defined
    their ethnic boundary primarily (or exclusively) in terms of religion. “Switching
    of ethnic identity,” then, refers to the religious conversion. Two historical
    examples in which the entry into the core elite was relatively open to individuals
    willing to convert to the'
