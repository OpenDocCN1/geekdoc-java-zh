    The simplest possible dynamics is linear growth, obeying the differential equation


    ```

    $$\dot{X} = c \quad (2.1)$

    ```


    Here $X$ is the variable that is changing, $\dot{X}$ is the rate of change of
    $X$ (often written as $dX/dt$), and $c$ is a constant. A familiar application
    of this model is Newton''s first law, in which $X$ is the position of a body and
    $c$ a constant velocity. (The first law states that, in the absence of any forces
    acting on the body, it will move with constant velocity.) The solution of this
    equation is $X(t) = X_0 + ct$, where $t$ is time and $X_0$ is the initial position
    of the body, $X(0) = X_0$. The solution says that $X$ will change linearly with
    time (Figure 2.1a), and that the rate of change is $c$. Thus, I refer to this
    kind of dynamics as *linear growth* (or decline, if $c$ is negative).'
