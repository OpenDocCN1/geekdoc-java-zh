    # 2.1.4 Implications for Historical Dynamics


    Our discussion of dynamics, so far, has focused exclusively on endogenous factors—variables
    that participate in dynamic feedbacks. In a purely endogenous system any fluctuations
    are solely a result of the interaction of endogenous variables; such systems are
    “closed” with respect to influences from outside. Historical social systems, by
    contrast, should always be affected by outside forces: climate fluctuations causing
    crop failure, sudden appearance of new epidemics, hostile invasions, spread of
    new religions, and so on. Factors that influence a dynamical system, but are not
    themselves influenced by its variables, are called exogenous. The distinction
    between endogenous and exogenous factors is not sharp, and usually depends on
    the questions we choose. For example, if we are focused on the internal dynamics
    of a single polity, then we will model invasion by other policies as an exogenous
    factor. But if we decide to expand the model to cover the dynamics of the whole
    system of interacting states, or the world-system (Wallerstein 1974; Chase-Dunn
    and Hall 1997), then invasion occurrence is endogenized.


    The open property of historical social systems presents no problem to the dynamical
    systems approach. The most natural way to model such influences is to add an exogenous
    structural variable to the system of equations. For example, if we already have
    endogenous variables X and Y, and add an exogenous variable Z, then the equations
    look like


    ```

    X=f(X, Y, Z)

    Y=g(X, Y, Z)

    Z=h(t)

    ```


    where f, g, and h, are some functions. That is, the rate of change of X and Y
