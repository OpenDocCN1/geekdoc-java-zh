    form of the demarcation markers that is important. The key aspect of ethnicity
    is “the ethnic boundary that defines the group rather than the cultural staff
    that it encloses” (Barth 1969:15). According to Barth, ethnicity is a form of
    social organization and its main characteristic is self-ascription, as well as
    as by others. Different ethnic groups may use different kinds of markers, but
    the function is the same, to draw boundaries between “us” and “them.” This insight
    has stood the test of time well (Vermeulen and Govers 1994).


    Not only do ethnic groups tend to have the sharpest boundaries, they also tend
    to evoke the most intense feelings of solidarity, the ultimate form of collective
    solidarity, sacrifice for the common good, is relatively common in ethnic conflicts.
    By contrast, it is hard to imagine individuals sacrificing their lives for the
    sake of a professional organization or a corporation.


