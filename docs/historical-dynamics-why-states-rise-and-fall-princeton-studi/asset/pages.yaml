  md: 'The importance of time scales has not, of course, escaped previous theorists.
    Collins devotes several pages to discussing this issue (Collins 1995:1584–1586),
    Kennedy (1987) repeatedly stresses that the state’s military strength and productive
    ability are correlated in the long term, and we certainly should not forget Braudel’s
    (1972) *la longue durée*. However, the discussion of this issue typically does
    not beyond verbal theories. It is precisely in these kinds of quantitative issues
    that nonlinear dynamics can be of great use, because formulating explicit models
    allows us to build in the empirically based characteristics of postulated mechanisms
    (including their rates of change) and predict the ensuing model dynamics (the
