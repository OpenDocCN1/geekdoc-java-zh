- img_proc: true
  md: 'This analysis proceeded in exactly the same manner as for the first millennium.
    My source for polity sizes was the electronic atlas CENTENNIA (Reed 1996). A number
    of familiar polities did not make the size cut, as medieval Scotland (0.09 Mm²
    in 1140 C.E.) and Croatia (0.05 Mm² in 1080 C.E.); the early modern Bavaria, Saxony,
    and a host of lesser imperial polities; the modern Netherlands (0.04 Mm²), Switzerland
    (0.04 Mm²), as well as the modern microstates from Luxembourg down.


    There were two intruders: Cumans (0.60 Mm² in 1200 C.E.) coming from outside Europe
    and the Teutonic order (0.18 Mm² in 1400 C.E.), which originated in EGE. One polity
    was classified as a relic: the Astrakhan Khanate (0.50 Mm² in 1550 C.E.), formed
    after the collapse of the Golden Horde and speedily conquered by Russia.


    Finally, a number of polities formed after 1800 C.E. as a result of fragmentation
    of the Ottoman, Swedish, Romanov, Habsburg, British, Soviet, and Yugoslav empires.
    These polities are Greece, Bulgaria, Romania, Serbia-Yugoslavia, Albania, Norway,
    Finland, Poland, Ireland, Czechoslovakia (later the Czech and Slovak Republic),
    Lithuania, Latvia, Estonia, Ukraine, Belarus, Moldova, Croatia, Slovenia, and
    Macedonia. Many of these polities may be relics (as progressive fragmentation
    of at least some of them would seem to indicate). Others may turn out to be the
    incipient empires of the third millennium. In any case, the safest way is to omit
    all these polities from the analysis, as I omitted polities forming toward the
    end of the first millennium from the analysis of the 500–1000 period.'
