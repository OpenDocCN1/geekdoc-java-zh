    strategic position on the frontier between civilization and barbarism.” One example
    that McNeill cited was the Akkadian Empire. McNeill (1963:249) also pointed out
    that all the states that unified China in a single empire originated on the margins
    of the Chinese world (one exception was the Ming). The importance of the frontier
    between the agrarian China and steppe-dwelling nomads was stressed by by Lattimore
    (1967), and more recently in an excellent'
