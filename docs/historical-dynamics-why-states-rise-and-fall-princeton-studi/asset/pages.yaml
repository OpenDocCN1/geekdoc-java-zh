    # Threshold Model in Space


    The spatial threshold model behaves in a very different manner from the autocatalytic
    model (for mathematical details, sees Lewis and Kareiva 1993). First, and rather
    obviously, the local proportion of converts must exceed the threshold $C_0$, otherwise
    the new cult will de out. Second, and less obviously, the size of the area initially
    occupied by the cult (the “beachhead”) must exceed a certain threshold. Otherwise,
    the “diffusive losses” across the boundary will overwhelm the conversion rate
    within the area occupied by the religion, and it will fail. The third and most
    important difference is that the threshold model can exhibit only linearly advancing
    fronts, no matter what the shape of the contact distribution. This feature arises
    because any converts that get out too far in advance of the main front from the
    threshold effect: they are locally swapped by unbelievers.


