  md: '+   * In this chapter I considered three basic sets of assumptions about how
    people switch their ethnic identity (a process that may involve linguistic assimilation,
    religious conversion, etc.).

    * The noninteractive model posits that each nonassimilated individual has a constant
    probability of switching ethnic identity (per unit of time). Such an assimilation
    process results in asymptotic dynamics.

    * The autocatalytic model assumes that assimilation occurs as a result of direct
    interpersonal attachments. The dynamics predicted by the autocatalytic model are
    the S-shaped logistic curve.

    * The threshold model postulates an even more nonlinear model of conversion: The
    rate of assimilation is positive if the proportion assimilated is over a certain
    threshold. Otherwise, the assimilation rate is negative, leading to the inverse
    process in which core individuals assimilate to the peripheral identity. The dynamics
    of the threshold model are metastable.

    * Next, I consider spatial extensions of all three models. The noninteractive
    model is not affected by adding space.

    * The spatial autocatalytic model behaves globally in a logistic fashion if the
    social contact distribution is characterized by a thick tail. What this means
    in practice is that the assimilation process will not run out of potential subjects,
    if the already assimilated individuals manage to keep their social networks open,
    and continue reaching out and entering into new and distant social networks. If
    the contact distribution has a thin tail, then after an initial period of accelerated
    growth, expansion settles to a linear increase with time. Finally, if there are
    segments of population poorly connected to the rest, they may remain unassimilated
    islands in perpetuity.

    * The spatial threshold model suggests that an assimilation process is difficult
    to get started. A critical mass of assimilated population has to be established
    in some locality, before the assimilation can start spreading. The spread, if
    successful, is linear. Gaps in social contacts can lead to a stable coexistence'
