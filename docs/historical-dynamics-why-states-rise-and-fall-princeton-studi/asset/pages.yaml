    and that the per capita rate of population increase is a linear function of the
    per capita rate of surplus production, $r = c_2\rho(N)$. Putting together these
    two assumptions, we arrive at a logistic model for population growth:


    $\dot{N} = r_0N(1 - N/k) \quad (7.1)$


    where $r_0 = c_1c_2$ is the intrinsic rate of population growth, $k$ is now seen
    as the “carrying capacity,” or equilibrium population size. When $N < k$, the
    society generates surplus, and the population grows. If $N > k$, then the society
    produces less food than is needed for households to sustain and replace themselves,
    resulting in population decline.


