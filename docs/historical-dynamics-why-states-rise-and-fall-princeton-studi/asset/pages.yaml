- img_proc: true
  md: 'In order to determine the success of an attack, the powers of the attacker
    and defender are compared. If


    $$P_{att} - P_{def} > \Delta_p \quad (A.9)$


    then the attack is successful, the defending cell is taken over, and its imperial
    index is changed to that of the attacking empire. The asabiya value of the conquered
    cell is reset as the average of its asabiya prior to attack and the asabiya of
    the conquering cell. If the attack is unsuccessful, then nothing happens. The
    parameter $\Delta_p$ is the minimal power differential necessary for a successful
    attack.


    Finally, I included in the simulation the possibility of imperial collapse if
    the average asabiya of the empire becomes too low. At the end of each time step
    the average asabiyas of all empires are checked. If $S_{it} < S_{crit}$ then the
    empire is dissolved, and all cells belonging to it are classified as nonimperial
    hinterland (indexed with 0).


    Some technical points. The order which cells become potential attackers (during
    a time step) is random and changes at every time step. This procedure guards against
    any systematic directional biases that would be imposed by a fixed order of choosing
    the attacker. Similarly, the order in which the four neighbors are considered
    for potential attack is also randomized at each step. These two randomizations
    are the only way stochasticity affects the model dynamics; otherwise, all effects
    are deterministic. The boundary conditions in the simulation are of the reflecting
    kind. Cells on the edge of the arena are not called to attack neighbors, and at
    the end of each time step, their asabiyas and imperial indices are set equal to
    those of the nearest nonged cell.


    The model is quite simple and has only five parameters that determine its behavior.
    The reference set of parameters which served as a starting point for exploring
    the dynamics was as follows: $r_0 = 0.2, \delta = 0.1, h = 2, \Delta_p = 0.1,$
    and $S_{crit} = 0.003$.'
