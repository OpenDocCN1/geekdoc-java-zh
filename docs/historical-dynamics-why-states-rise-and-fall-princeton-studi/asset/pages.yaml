    elite segments of the population predicts similar dynamics (periodic state breakdown).
    Growth of the commoner population leads to the expansion of elite numbers and,
    initially, strengthening of the state. However, as elite numbers grow, an increasing
    proportion of the extracted product is appropriated by the elites for their needs.
    State revenues decline, while expenditures increase, and eventually the state
    becomes bankrupt.


