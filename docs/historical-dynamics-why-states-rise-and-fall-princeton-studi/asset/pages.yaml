  md: '# 2.3 CONCLUSION: GEOPOLITICS AS A FIRST-ORDER PROCESS


    I started this chapter by reviewing some elementary facts from nonlinear dynamics
    for the following reasons. Most social scientists are not closely familiar with
    dynamical systems theory, and I wanted to present a nontechnical summary of its
    insights most relevant to the issues dealt with in this book. One such particular
    insight is that there is a close relationship between the time scales at which
    negative feedbacks operate and the nature of the dynamics. If feedback mechanisms
    operate much faster than the dynamics of the focal variable, then the system cannot
    oscillate or exhibit a single boom/bust behavior. If we have an oscillatory system,
    then, more quantitatively, the speed with which a feedback acts determines the
    temporal pattern of the dynamics (for example, the average length of an oscillation,
    or a boom/cycle). This means that if a feedback loop operates on the scale of
    years, or even worse, weeks, then it is highly unlikely that it could cause oscillations,
    whose average period is measured in centuries. Centuries-long cycles are typically
    caused by feedbacks operating on the scale of human generations (decades or longer).


    This insight is very relevant to the issue of what mechanisms underlie imperial
    boom/bust cycles. Empires grow and decline on the time scale of centuries (Taageever
    1978a, 1978b, 1997; see also Figure 4.4 in Chapter 4). Let us make a simple analysis
    of the imperial growth/decline data tabulated in the Appendix of Taageever (1997).
    Taageever defined the rise phase as the time it takes for a policy to expand from
    20% to 80% of its maximum area (1997: 480). We can define the decline phase analogously,
