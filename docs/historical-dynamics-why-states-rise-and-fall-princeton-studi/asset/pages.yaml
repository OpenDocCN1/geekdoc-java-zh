    is that ethnicity was the basis of social organization in humans during most of
    their evolutionary history. Hunter-gatherers living in bands were characterized
    by a very flat social hierarchy and very limited division of labor, and ethnicity
    (in the wide sense, see below) provided the main basis for group formation.'
