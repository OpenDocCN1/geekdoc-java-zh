    processes as the exponential or the logistic is that they appear to go through
    discontinuous stages of growth, while the basic driving mechanism does not change.
    The driving mechanism is the relative conversion rate (the number of new members
    per current member that convert in a unit of time). While the relative rate stays
    constant, the absolute rate already converted increases with time, thus generating
    an illusion of the process going through qualitatively different stages.


