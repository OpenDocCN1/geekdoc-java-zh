    \ are brought into cultivation. Second, increased population growth also means\
    \ that land is subdivided into smaller parcels. Although each parcel receives\
    \ more labor, its production rate (kg grain per year) is also subject to the law\
    \ of diminishing returns.\n\nFor the purpose of simplicity, I will approximate\
    \ the relationship between per capita rate of surplus production, $\rho$, and\
    \ population numbers, $N$, with a linear function\n\n```\n$\\rho(N) = c_1(1 -\
    \ N/k)$\n```"
