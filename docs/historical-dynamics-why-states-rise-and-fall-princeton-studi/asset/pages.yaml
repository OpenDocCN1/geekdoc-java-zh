  md: '# 4.2 MATHEMATICAL THEORY


    The theory that I advanced in the previous section is formulated verbally. It
    seems plausible that the waxings and wanings of asabiya could underlie imperial
    cycles, but we are dealing with dynamical systems, and intuition based on verbal
    reasoning can mislead. For example, it is possible when we translate the verbal
    assumptions into a mathematical model, we do not get the expected boom-bust cycles,
    but some other dynamics. Thus, we need to make sure that our verbal reasoning
    did not mislead us.


    Frontiers are inherently spatial quantities, and the mathematical theory that
    we must build eventually include space in an explicit way. However, explicitly
    spatial models are more difficult to analyze and typically require numerical solutions
    or computer simulations. It is often useful to attempt to capture the main interactions
    postulated by theory with a simplified pseudpatial model that is much more transparent
    to analysis. This is the strategy that I pursue. First, I develop a very simple
    pseudpatial model and determine what it tells us about the dynamic relationship
    between empires and frontiers (Section 4.2.1). Second, I construct a spatially
    explicit setting to make sure that the insights from the simpler model hold in
    a more complex setting (Section 4.2.2).


    # 4.2.1 A Simple Analytical Model


    In Section 2.2.2 I analyzed a simple geopolitical model (2.12) of territorial
    dynamics in one-dimensional space. Setting γ = 1 (since we are not interested
    in the effects of position) and employing the approximation exp[x] = 1 + x, suggested
    in Section 2.2.2, we have the following equation for the territorial dynamics:


    ```

    $$\dot{A} = cA(1-A/h)-a$

    ```


    The parameter $c$ states the state''s resources into its geopolitical power, $h$
    is the spatial scale of power projection, and $a$ is the geopolitical pressure
    from the hinterland (assumed to be a constant).'
