    My main argument in this chapter is that geopolitical variables (in the narrow
    sense) cannot explain the long-term (a century or longer) imperial decline phases.
    As geopolitical variables as logistic loads and loss of marchland advantage begin
    essentially without a time lag. As soon as more territory is conquered, the state
    must shoulder the burden of defending it from external and internal (rebellion)
    threats. Similarly, as soon the victorious state intrudes on a central location,
    any previous marchland advantage is diminished. It is true that the benefits of
    increased size can come with a substantial lag, because it takes time to organize
    production in newly conquered territory and to persuade the populace there to
    accept state authority. But this mechanism is part of the positive feedback loop;
    it is not what causes empires to decline. In an interesting extension of the usual
    geopolitical variables, Collins and co-authors proposed that the relationship
    between state legitimacy and war success may cause territorial overshoot, followed
    by collapse. However, our investigation of this idea suggested that this mechanism
    still leads to first-order dynamics (metastability), unless we impose an unrealistically
    (as I would argue) long lag on the response of legitimacy to war success. Furthermore,
    even if we stipulate such a long lag, only one of the models investigated by Hanneman
    al. exhibited boom-bust cycles, and the collapse in this model was accomplished
    in essentially one step. By contrast, historical data suggest that imperial decline
    often occurs on the time scale of decades or even centuries (Table 2.1). This
    empirical pattern is not explained by purely geopolitical theories.'
