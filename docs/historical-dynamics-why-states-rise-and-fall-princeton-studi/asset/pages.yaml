    # A Terminological Note


    Collective solidarity, social cohesion, social capital, and asabiya are clearly
    closely related concepts. This raises the question of which term we should use
    in this research program. The problem with “social capital” is that it sounds
    jarring when applied to preindustrial or even prestate societies. Further, “capital”
    has the wrong associations. Capital should be something divisible, but social
    capital is a public good. In general, capital is too much an economic term, while
    collective solidarity is a very sociological concept. Finally, “social capital”
    is used in the sociological literature in at least two very different senses (Lin
    2001: Table 1): one focused on the individual (Lin 1982; Burt 1992), the other
    focused on the group (Bourdieu 1980; Putnam et al. 1993). These are two very different
    notions. Contrast, for example, the “group-focused” definition of Putnam, given
    above, with the “individual-focused” one due to Lin (2001): social capital is
    “investment in social relations by individuals through which they gain access
    to embedded resources to enhance expected returns of instrumental or expressive
    actions.” In light of the discussion in Section 3.1.2, these two kinds of social
    capital may act antagonistically: group-level capacity for action may occur at
    the expense of some individual interests, while individuals manipulating social
    networks for their advantage can harm group-level performance.


    Collective solidarity and social cohesion also have some undesirable aspects.
    Connection, rather than group-level emergent property. Thus, I decided to settle
    on asabiya as the term for the central concept in the theory that is developed:
    the group’s capacity for collective action. Note the explicit reference to the
    group here: it does not make sense to speak of asabiya in general, or of the asabiya
    of a'
