    altruistically (thus, one of the emphases was on charity). The Muslim world (Dar
    al-Islam) was in opposition to the non-Muslims (Dar al-Harb, literally “the House
    of War”), and Muslims were certainly not expected to behave altruistically toward
    the unbelievers: whereas enslaving Muslims was forbidden, no such injunction existed
    against the infidels.


    If we interpret the characteristics of such religions as Islam and Christianity
    in terms of group selection theory, we see that they correspond very well to features
    that promote selection at the group level:


    +   - Sharp boundary between in-group and out-group

    - Leveling institutions (charity; monogamy in Christianity)

    - Strong norms and metanorms (enforcement of norms)

    - Altruistic in-group behavior


    Stark (1996) provides a sociological analysis of early Christianity, with an emphasis
    on its features that explain its spectacular rise.


    # Primogeniture


