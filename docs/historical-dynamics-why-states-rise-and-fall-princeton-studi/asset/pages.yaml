  md: 'formalized to the point where it could be submitted to a rigorous empirical
    test. The first problem is that a region can be designated as semiperipherical
    either because of its spatial location, or because it has institutional forms
    intermediate between core and periphery. In other words, the definition is too
    broad, and too many policies could be classified as semiperipherical. The second
    and related problem is that the theory of Chase-Dunn and Hall does not resolve
    the issue of why some semiperipherical challengers succeed and others do not (Chase-Dunn
    and Hall 1997:98). By contrast, the metaethnic frontier theory makes much sharper
    predictions, and thus has a higher falsifiability potential. It essentially says
    that only those semiperies where imperial frontiers coincide with metaethnic fault
    lines should be the sources of aggressive challenger states. Furthermore, the
    more intense the ethnic differential and the longer the frontier occupies a region,
    the more likely it is that a challenger would emerge and be successful at building
    a large territorial empire. The empirical issue thus becomes whether the metaethnic
    frontier theory captures all cases of empires starting as semiperipherical marcher
    states, or whether there are semiperipherical states that gain their ability for
    territorial expansion by other mechanism.


    # Ethnogenesis


    While theoretical ethnology languished in the West after World II, in the Soviet
    Union, by contrast, ethnology was a respected and productive direction of research.
    I have already discussed the original (although, in my opinion, deeply flawed)
    theory of ethnogenesis advanced by Gumilev (1971). But there was a great variety
    of other ethnological research in Russia, both theoretical and empirical. ethnosocial
    processes, see Bromley (1987); Bromley and Kozlov (1989). Several studies examined
    the processes involved specifically in ethnogenesis (Alekseeva 1973; Alekseev
    1986). Russian ethnology continues to evince a heightened interest in the problems
    of social and historical ethnology (Arutyunov 1989; Lurie 1998).'
