  md: 'fascinating. Another excellent field of research that I touched upon lightly
    is world-systems theory (Wallerstein 1974; Chase-Dunn and Hall 1997). The reason
    is my focus on the polity as the main subject of analysis. This focus leads to
    a certain bias, which I readily acknowledge: a tendency to look for endogenous
    causes of the rise and fall of empires. At this point, I can only state that I
    wholeheartedly agree with the idea that we need to understand how systems of interacting
    politics work. This is also clearly the next order of business.


    Finally, there is the issue of what the theories and results discussed in the
    book mean for modernity. Generally, I tried very hard not to cross the self-imposed
    temporal limit of 1900, for reasons explained in Section 1.2.2. It was not, however,
    my intention to imply that the insights from models and data for agrarian societies
    are completely irrelevant to modern societies. Clearly, we cannot directly apply
    some models, for example, in Chapter 7, to western industrialized states because
    population growth in these societies does not lead to starvation. On the other
    hand, some of the ideas developed for the dynamics of elites in agrarian societies
    may yield fruitful hypotheses about modern politics (see, for example, the discussion
    in Goldstone 2002). For example, modern societies may be susceptible to elite
    overproduction. A recent article in the Economist (November 14, 2002) reported
    that the proportion of Britons between 18 and 21 years old to college has more
    than doubled during the 1990s (from 15 to 33%). Is British society approaching
    a crisis? This is the kind of hypothesis that can be addressed in future research.


    Other theories may also be of relevance to current affairs. Judging by the burgeoning
    literature on social capital, the ability of groups and whole societies for concerted
    and effective action is of great interest to sociologists and political scientists.
    Geopolitical arguments were used to successfully predict the demise of the Soviet
    Union (Collins 1995). And the dynamics of assimilation or, conversely, ethnic
    fissioning and mobilization are the key elements of current international politics
    (Moynihian 1993). All these directions are extremely interesting and should eventually
    be'
