    of the rate of decline: it takes four generations from the establishment to the
    disappearance of a dynasty, although it may continue into the fifth and sixth
    generations in a state of decline (I:281).


    In addition to the decline of asabiya, there is another major factor that causes
    the disintegration of the state: economics. According to Ibn Khaldun, general
    prosperity leads to population growth, which in turn leads to scarcity, increased
