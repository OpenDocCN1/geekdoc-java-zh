    \nThere are two variables in the model, one for the population and the other for\
    \ the state. $N(t)$ is the population density of subjects at time t. I assume\
    \ that the state area does not change, so the density is simply the population\
    \ number divided by the area. $S(t)$ is the current accumulated state resources,\
    \ which I measure in kilograms (or tons) of grain. The choice of this particular\
    \ variable is based on the economic nature of the agrarian state, in which is\
    \ the main commodity produced.\n\nTo start deriving the equations connecting the\
    \ two structural variables ($N$ and $S$), I first assume that the per capita rate\
    \ of surplus production is a declining function of population numbers (this is\
    \ David Ricardo's law of diminishing returns). There are several socioecological\
    \ mechanisms that underly this relationship. First, as population grows, the stock\
