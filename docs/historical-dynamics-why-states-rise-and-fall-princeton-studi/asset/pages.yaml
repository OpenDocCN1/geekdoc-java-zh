  md: '# Chapter Seven


    # The Demographic-Structural Theory


    # 7.1 POPULATION DYNAMICS AND STATE BREAKDOWN


    Unless prematurely extinguished by an overwhelming external force, empires typically
    progress through three stages: (1) polity formation and ethnogenesis of the core
    ethnic, accompanied by initial expansion within an ethnically similar substrate,
    (2) expansion to peak size, in the process acquiring a multithenic character,
    and (3) stagnation, decline, and collapse (perhaps followed by a revival, and
    another imperial cycle). Mathematical models for the first two phases were advanced
    in Chapters 4 and 6. In this chapter I aim to investigate the causes of collapse.


    A useful starting point is again provided by Ibn Khaldun, who postulated two major
    causes of state decline: (1) ideological (loss of asabiya) and (2) economic (including
    demographic and fiscal mechanisms) (Ibn Khaldun 1958:II:118–119). We have already
    discussed the first mechanism in Chapter 4, so let us concentrate on the second
    one.


    Ibn Khaldun (1958:II:122–123, 135–137) notes that recently established states
    are moderate in their expenditures and just in their administration. As a result,
    taxation is light, and little coercion of subjects is needed. Such benevolent
    rule creates conditions under which people will flourish, and “procreation will
    be vigorous.” General prosperity causes rulers and people to become accustomed
    to increased spending (“luxury”) in Ibn Khaldun’s words). The army and the bureaucracy
    demand and receive higher pay. Although population numbers build up gradually,
    eventually'
  merge: -1
  pgno: 197
- img_proc: true
  md: '(after several generations) the society reaches the limits of its growth. However,
    habits of luxury continue to increase, and must be paid for, so the state attempts
    to increase its revenues through heavy taxation, or outright seizure of its subjects''
    property. Such fiscal policy inevitably leads to the ruin of the economy, and
    then to famines, pestilence, political unrest, and rebellion.


    Such is the argument of Ibn Khaldun in a nutshell. Ibn Khaldun discusses many
    specific sociological and ecological mechanisms underlying each of the postulated
    links in his argument (for example, he explicitly connects the spread of epidemics
    to population density, although the microbial origin of diseases was not known
    in his days). I refer the reader to Ibn Khaldun''s book for further details (as
    well as innumerable historical accounts of various specific instances of civilization
    collapse that invoke some variant of this argument).


    The hypothesis that excessive population growth has negative effects on social
    dynamics has been vigorously debated for the last two centuries, ever since the
    work of Malthus (1798). I cannot review this enormous literature here, but note
    that theories postulating population growth as a direct cause of societal collapse
    do not appear to be empirically supported. Of more current interest is the idea
    that population growth causes social crisis indirectly, by affecting social institutions,
    which in turn affect social stability (Goldstone 1991b). Goldstone refers to his
    theory of state breakdown as demographic-structural: because because the driving
    force is population growth; structural because it is not the demographic trend
    itself that directly causes the state crisis, but by its impact on economic, political,
    and social institutions (Goldstone 1991b:xxvi). I briefly summarize Goldstone''s
    theory below (Goldstone 1991b:24-25).


    Population growth in excess of the productivity gains of the land has multifarious
    effects on social institutions


    +   * First, it leads to persistent price inflation which outstrips the ability
    of agrarian states to increase tax revenues. Furthermore, increased population
    leads to expansion of armies and rising'
  merge: -1
  pgno: 198
- img_proc: true
  md: 'real costs. Thus, states have no choice but to seek to expand taxation, despite
    resistance from the elites and the general populace. Yet attempts to increase
    revenues cannot offset the spiraling state expenses. Thus, even though the state
    is rapidly rising taxes, it is still headed for fiscal crisis.


    +   Second, rapid expansion of population results in an increased number of aspirants
    for elite positions, which put further fiscal strains on the state. Moreover,
    increased intraelite competition leads to the formation of rival patronage networks
    vying for state rewards. As a result, elites become rival by increasing rivalry
    and factionalism.


    +   Third, population growth leads to rural misery, urban migration, falling real
    wages, and increased frequency of food riots and wage protests.


    +   Another consequence of rapid population growth is the expansion of youth cohorts.
    This segment of the population is particularly impacted by lack of employment
    opportunities. Additionally, the youthfulness of the population contributes to
    its mobilization potential.


    +   Finally, elite competition and popular discontent fuel ideological conflicts.
    For example, in early modern Europe, dissident elites and dissatisfied artisans
    were widely recruited into heterodox religious movements.


    As all these trends intensify, the end result is state bankruptcy and consequent
    loss of elite movements of regional and national rebellion, and a combination
    of elite-mobilized and popular uprisings that manifest the breakdown of central
    authority (Goldstone 1991b:25)


    One of the strengths of Goldstone''s (1991b) analysis is his employment of quantitative
    data and models in tracing the mechanistic connections between various economic,
    social, and political institutions (this is discussed further in Section 7.3.1).
    However, Goldstone does not develop his theory to the point of an explicit dynamic
    model. In particular, he treats the underlying engine of change, population growth,
    as an exogenous variable. He'
  merge: -1
  pgno: 199
- img_proc: true
  md: 'suggests that a combination of favorable climate and receding disease may explain
    the observed doubling of population in most world regions between 1500 and the
    early 1600s (Goldstone 1991b:25). This choice was clearly, not made lightly. Goldstone’s
    (1986, 1991a) analysis of population dynamics, prices, and real wages in early
    modern England led him to conclude that existing endogenous theories are not supported
    by the data. For example, the Malthusian-Ricardian model assumes that population
    movements respond to changing prices. However, as Goldstone shows with data, long-term
    mortality patterns were seemingly independent of real wages.


    Perhaps this is the correct approach, and we need to look for specific exogenous
    factors that explain population dynamics in different periods and regions. However,
    I do not think that the complete spectrum of endogenous models has been contrasted
    yet with data. In particular, I would like to explore the possibility that there
    is a feedback effect of political instability on population dynamics.


    How can political stability or instability affect population dynamics? Let us
    start by assuming a Malthusian-Ricardian model of the interaction between population
    dynamics and food production. I have in mind something like the logistic model,
    which has two parameters. The intrinsic rate of population growth is a balance
    of birth and death rates in the absence of density feedback (that is, for low
    population densities). The carrying capacity is set by the climate and soil conditions,
    as well as the current level of agricultural technology (this is made more specific
    in the next section). Political instability can affect both parameters. Most obviously,
    when the state is weak or absent, the populace will suffer from elevated mortality
    due to increased crime, banditry, and internal and external warfare. Furthermore,
    the times of troubles cause increased migration rate: refugees from war-affected
    areas, or areas whose productive potential has been destroyed (see below on this).).
    Migration has several effects. First, it can lead to emigration (and we can simply
    add that to mortality). Second, people on the move cannot afford to have children.
    Thus, birth rates decline.'
  merge: -1
  pgno: 200
- img_proc: true
  md: 'Third, increased migration leads to epidemics. Increased vagancy spreads disease
    by connecting areas that would stay isolated during better times. Additionally,
    vagabonds and beggars aggregate in towns and cities, increasing their population
    size. This may tip the density over the epidemiological threshold (the critical
    density above which a disease spreads). Finally, political instability causes
    lower reproduction rates, because during uncertain times people choose to marry
    later and to have fewer children. Incrementally, people''s choices about their
    family sizes may be reflected not only in birth rates, but also in rates of infanticide.
    Thus, family limitation practices may be disguised as increased child mortality.


    Political instability can also affect the carrying capacity. There are many mechanisms
    by which the state can increase carrying capacity, so I will mention just two
    of the most common ones. First, the state offers protection. In a stateless society
    people can live only in natural strongholds, like hillfort chiefdoms in prequest
    Peru (Earle 1997), and the movement of settlements to hilltops in Italy after
    the collapse of the Roman Empire (Wickham 1981). Fear of attack, people can cultivate
    only the small proportion of the productive area that is near fortified settlements.
    The strong state protects the productive population from external and internal
    (banditry, civil war) threats, and thus allows the whole cultivable area to be
    put into production. The second mechanism is that states often invest in increasing
    agricultural productivity by constructing irrigation canals and roads, by implementing
    flood control measures, by clearing land from forests, etc. Again, the end result
    of these measures is an increase in the number of people that can be gainfully
    employed growing food, the carrying capacity.


    In summary, political instability can negatively affect both demographic rates
    and the productive capacity of the society. I will explore both mechanisms in
    the models developed below. To reiterate, my goal is a theory in which population
    dynamics is an endogenous process: not only is there a link between population
    growth and state breakdown, but there may be a feedback connection between state
    breakdown and population growth.'
