  md: 'individualism and collectivism do not explicitly discuss the scale of the group
    at which collectivistic behaviors are aimed. From the context of their studies,
    however, it becomes apparent that they typically focus on small-scale groups:
    families and local communities. However, although there is no explicit consideration
    of scale in the analysis, results obtained for small-scale groups are sometimes
    generalized to larger-scale societies. Furthermore, the primary variable of interest
    to psychologists is not the properties of groups made up from individualistic
    versus collectivistic individuals, but the inverse relation: the effect of the
    group on individuals. This is, of course, understandable since psychologists are
    primarily interested in individual behaviors, rather than the capacity of groups
    for collective action. Nevertheless, it decreases the relevance of their findings
    for issues of interest to us. Still, there is much of value in this area of psychology,
    not least of which is the empirical research on variation in individualism/collectivism
    in different cultures.


    # Social Capital


    Of much greater relevance is the theory of social capital, which has recently
    garnered a lot of attention, thanks in part to several books and articles by Robert
    Putnam and associates (see, for example, Putnam 2000; for a closely related concept
    of social trust see Fukuyama 1995) Such aspects of social capital as mutual support,
    cooperation, social trust, institutional effectiveness, and particularly, the
    implications of social capital for collective action suggest that social capital
    and collective solidarity are closely related concepts. "Social capital here refers
    to features of social organization, such as trust, norms, and networks, that can
    improve the efficiency of society by facilitating coordinated action" (Putnam
    et al. 1993:167). This is very close to my definition of asabiya as the capacity
    of a group for collective action. Asabiya appears to be essentially the agrarian
