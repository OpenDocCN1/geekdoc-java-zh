  md: 'empires started in this way; for example, the Ostrogoths (Burns 1984). However,
    the success of such groups is typically limited in time and space, and they must
    evolve certain structures that will allow them to overcome their scaling-up limitations.
    Extension of the temporal duration is achieved by the cultural mechanism of dynasty.
    Some dynasties exerted an extremely powerful influence over very long periods
    of time, such as Chingisids and Sharifs (descendants of Muhammad). But the greatest
    danger to empires was the division of the acquired territory among the multiple
    heirs. One cultural mechanism that prevented the splintering of the realm was
    the rule of primogeniture.


    It is interesting that history knows knows several cultural innovations that attempted
    to prevent empire splintering, although they did not work as well as primogeniture.
    For example, during the Kievan period, Russian princes evolved an elaborate mechanism
    by which the overall ruler (the Grand Prince) was succeeded by his younger brother,
    who would move to the main capital of Kiev, thereby freeing a subordinate capital,
    which would be occupied by the next member of the hierarchy, and so on. This system,
    however, did not work very well, and quickly led to a collapse into a feudal situation
    of multiple principalities, each governed by its own dynasty. However, the process
    did not stop there. The practice of assigning each heir his allotment lead to
    the progressive splintering of Russian principalities. Only when one of them,
    Moscow, adopted the rule of primogeniture, could the trend toward disintegration
    be reversed.


    # Society-Wide Mechanisms of Male Socialization


    In a cross-cultural study of warfare, Otterbein (1985) demonstrated that societies
    engaged in internal warfare (conflict among small-level groups) were dominated
    by small-scale “fraternal interest” groups composed of related males. Societies
    that emphasized socialization of males into military institutions that crosscut
    units of male relatedness, by contrast, were able to suppress internal warfare.
    Such societies were much more successful in external'
