    # 10.1.4 Geopolitics


    One theory that I was unable to subject to a thorough empirical test is the theory
    of geopolitics (Chapter 2). However, it was still possible to make a verbal of
    progress just on the strength of translating the verbal theory into mathematical
    models. Thus, we found that the mechanisms postulated, for example, by the Collins
    version of the theory—geopolitical resources, logistical loads, and marchland
    advantage—led to first-order dynamics. In other words, the theory cannot explain
    prolonged declines that characterize many historical empires. This purely theoretical
    development illustrates one of the strengths of mathematical, as opposed to verbal,
    models. What may look reasonable when the problem is stated verbally does not
    necessarily have the proposed dynamical consequences when we formalize the description
    in the language of dynamical systems. Nonlinearities and lags affecting historical
    (and physical, and biological) systems require a specialized mathematical apparatus
    for connecting associations to predictions.


    One empirical application of the geopolitical theory, although limited, was my
    test of the effect of positional advantage of a region on the maximum polity size
    originating from. I found statistical association between the two variables, suggesting
    that marchland position confers no fixed geopolitical advantage. This is not to
    say, however, that position may not confer a temporary advantage. In fact, there
    are many convincing examples of states losing wars on two fronts, such as Germany
    in the two world wars. However, this idea remains to be rigorously tested.'
