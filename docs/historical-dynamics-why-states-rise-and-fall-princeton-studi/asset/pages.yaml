  md: '# Temporal Scale: Millennia


    Finally, I briefly turn to processes operating on much longer—millennial—scales.
    This is the time scale of evolution of human societies, including their technological
    and cultural components. The big roadposts are the agricultural and industrial
    revolutions, respectively around 10,000 and 200 years ago. Currently, the pace
    of change has become more frenetic, but prior to the industrial revolution, we
    can still probably assume some degree of quasistationarity at the scale of each
    millennium. Thus, according to the estimates of McEedy and Jones (1978), the typical
    doubling time of the global human population, prior to the industrial age, was
    around 1000 years.


    Evolutionary change of human societies is certainly something that we have to
    take into account when analyzing long-term data on human population dynamics (see,
    for example, Komlos and Nefedov 2002). If our main interest is not in millennial-processes,
    however, we will have to apply detraining to the data. Detraining is particularly
    appropriate in those cases where we have a clear mechanistic basis for understanding
    why we are interested in the carrying capacity has changed historically. Ideally,
    we would use historical information to estimate how many people a unit of land
    could maintain, given the contemporary level of technology. Here I will not follow
    this tack, because it would take me much beyond the scope of this book, and simply
    employ phenomenological detraining methods.


    # Implications


    The preceding discussion makes it clear that the appropriate temporal scale for
    studying human dynamics depends greatly on the questions of interest. If we are
    concerned with the dynamics of measles epidemics, then we should use the scale
    of months and years. At the other extreme, if we are interested in modeling how
    the capacity of the Earth to sustain human population evolved as a result of technological
    and societal change, then our time scale is centuries and millennia. However,
    if we are interested in first-order'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'processes that regulate human population density, and in mechanisms that may
    cause second-order cycles, then our temporal scale should be intermediate: decades
    (the basic time step at which we measure population density) and centuries (the
    length of time series). More specifically, we need to follow a population for
    at least 500–600 years, in order to have the minimum sample size, two oscillations
    (assuming each oscillation is around 2–3 centuries in length). This is a rough
    guide, but it suggests that if we have sampled at yearly intervals, we might just
    well subsample the series at 10-year intervals—we are not really throwing out
    any useful information by doing that. Data series sampled at 20 or 30-year intervals
    (approximately one human generation) are also acceptable. But any data series
    that was collected at intervals greater than two generations (50 years) is seriously
    undersampled.


    I searched the literature on historical demography for time-series data of sufficient
    length (at least 500 years) and sampled at sufficiently frequent intervals (not
    more than 50 years) for a defined locality (typically corresponding to a modern
    country or to a province in a country). One problem in obtaining data relevant
    to our purposes is that historical demographers ask very different kinds of questions.
    A population dynamicist is primarily interested in relative changes of density
    with time, and knowing the absolute scale is not as important. By contrast, historical
    demographers typically attempt to estimate the absolute density at a particular
    point in time. Another problem is that a large amount of guesswork is often involved
    in reconstructing the historical dynamics of human populations. Historical demography
    is a very controversial subject, and hugely different estimates of population
    numbers can be proffered by different authorities. One possible way of getting
    around the subjective element is the methods of archaeology, and I will discuss
    some archaeological data sets below.'
