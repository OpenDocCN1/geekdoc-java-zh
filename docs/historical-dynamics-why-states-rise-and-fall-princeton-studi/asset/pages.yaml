    # Social Space


    When I say we need to add "space" I do not necessarily mean physical space. Rather,
    what we need is some notion of social space, in which distance between individuals
    is measured by the frequency and intensity of their social interactions. The social
    space has many dimensions, but sociologists often reduce to two principal classes:
    the vertical and horizontal (Sorokin 1927). The vertical dimension refers to the
    position in the social hierarchy (stratification). Thus, a peasant may have a
    lot of interactions with the village head, who in turn interacts with the local
    noble, and so on to the polity ruler. Two people inhabiting the same location
    may be socially distant from each other (for example, a prince and a pauper).
    The horizontal dimension arises as a result of patterning in day-to-day activities
    such as working, raising children, or simply conversing to neighbors (Black 1998).
    There is a strong spatial component present in the horizontal dimension. Thus,
    a typical peasant will interact mostly with people in the same village, to a certain
    extent with inhabitants of nearby villages, and very little (if at all) with anybody
    in a different province.


