  md: 'Model (2.12) assumes that a polity’s power is proportional to the amount of
    its resources (cA). The “resources” primarily refer to the state’s *human* resources,
    since it is the population that pays taxes and produces recruits who are necessary
    for territorial defense and expansion. As I argued in the previous chapter, however,
    the success of a state is a result of collective action. No matter how many subjects
    an empire has, if they cannot, or will not, work together, the imperial power
    is zero. Thus, the coefficient *c* is actually a function of collective solidarity.


    Let $S$ stand for the average polity-wide level of collective solidarity. I scale
    $S$ to be between 0 and 1, with 0 corresponding to a completely atomized society
    that is incapable of collective action, and 1 corresponding to the maximum solidarity
    possible for humans. Next, I assume the simplest possible function relating the
    power multiplier to asabiya: $c(S) = c_0S$. In other words, I have assumed that
    geopolitical power is proportional to the product of asabiya and the state’s resources.
    Substituting this relationship in the equation, we have


    $$\hat{A} = c_0AS(1 - A/h) - a$$


    I now need to derive an equation for the temporal evolution of S. The first step
    is to choose a level of growth for it. We still lack a well-developed theory that
    would connect micro-level individual actions to macro-level dynamics of asabiya,
    so the next-best approach is to select among the simple models of growth such
    as the four discussed in Sections 2.1.1 and 2.1.2. The two boundless growth models
    (linear and exponential) are not good for our purposes, because it is unlikely
    that asabiya can grow without bound, and I have limited it from above by 1, anyway.
    Thus, the real choices are either the asymptotic or the logistic growth. The asymptotic
    growth implies that when S is at low level (near zero), it will grow linearly.
    This is also not a good assumption. As discussed in Section 3.2.3, most people
    are conditional altruists (if they are altruists at all). When they are in a minority,
    conditional altruists are likely to follow-'
