  md: '# Preface


    Many historical processes are dynamic: growth and decline of populations, territorial
    expansion and contraction of empires, trends in political centralization/decentralization,
    and the spread of world religions, to name just a few examples. A general approach
    to studying dynamical systems is to advance rival hypotheses based on specific
    mechanisms, translate the hypotheses into mathematical models, and contrast model
    predictions with empirical patterns. Mathematical modeling is a key ingredient
    in this research program because quantitative dynamical phenomena, often affected
    by complex feedbacks, cannot be fully understood at a purely verbal level. Another
    important ingredient is the full use of statistical techniques (such as time-series
    analysis) for quantitative and rigorous comparison between model-predicted and
    observed patterns. This general approach has proved to be extremely successful
    in natural sciences. Can it be instrumental in increasing our understanding of
    historical processes?


    Historical Dynamics is an attempt to answer this question. The specific problem
    chosen for analysis is the territorial dynamics of agrarian states. In other words,
    can we understand why some politics at certain times expand, while at others they
    contract? The advantage of focusing on territorial expansion/contraction is that
    we have reasonably accurate empirical data on this aspect of historical dynamics
    (historical atlases). The focus on agrarian politics is motivated by the extent
    of empirical material (roughly, from the third millennium B.C.E. to 1800 C.E.)
    and the greater simplicity of these societies compared to modern ones, potentially
    making them easier to understand and model.'
  merge: -1
  pgno: 14
- img_proc: true
  md: 'Although the main focus of the book is on territorial dynamics, it is clear
    that the ability (or inability) of states to expand depends very much on their
    internal characteristics. Thus, in order to understand how and why states expand
    and contract, we need to study military, economic, demographic, ethnological,
    and ideological aspects of social dynamics. I consider four sociological theories
    potentially explaining territorial dynamics. The first is the geopolitical model
    of Randall Collins. This theory has been clearly formulated and requires minimal
    work to translate into a mathematical model. The second one, by contrast, is an
    original development. Starting from ideas of the fourteenth century Arabic thinker
    Ibn Khaldun and recent developments in sociology, I advance a theory attempting
    to explain why the capacity for collective action may vary among different societies.
    The third theory addresses the issue of ethnic assimilation/religious conversion
    dynamics. Finally, the fourth theory focuses on the interaction between population
    dynamics and sociopolitical stability. The connection between population growth
    and state breakdown is based on the demographic-structural model of Jack Goldstone
    (another well-formulated theory that is easily translated into a dynamical model).
    In this model, I add the feedback mechanism, postulating how state breakdown and
    resulting sociopolitical instability negatively affect population numbers. The
    four theories address somewhat different aspects of historical dynamics, and thus
    logically are not mutually exclusive. However, alternative hypotheses about particular
    empirical patterns can be derived from them and tested with data. I present several
    such empirical tests.


