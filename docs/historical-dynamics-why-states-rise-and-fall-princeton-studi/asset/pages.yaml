    then the expected boom/bust cycle will not materialize. Instead, the empire will
    reach a state of equilibrium (just as in the original geopolitical model without
    asabiya dynamics). Furthermore, $b < h/4$, is likely to be affected by the structural
    assumptions of the model (for example, the linear relationships assumed for various
    functions), the qualitative insight is probably robust. Frontier areas must be
    small in relation to the empire size, determined by logistic constraints; if they
    are not, then no boom/bust dynamics ensue.
