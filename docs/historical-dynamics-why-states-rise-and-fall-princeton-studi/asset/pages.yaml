    of marchland position, was already discussed in Chapter 2. Note that this is in
    a sense diametric opposite of the theory that I advance. Whereas Collins argues
    that marchland position protects states from predation by neighbors, I postulate
    frontier location, on the contrary, puts a lot of pressure on ethnic groups, so
