  md: 'we are following in the tracks of the basic model, although now our focus is
    on the total production, rather than the surplus.


    In the presence of exploiters, however, producers will not be able to keep all
    the food they produce. We now need to derive a model for resource extraction by
    exploiters. The key element of this model is the amount of coercion that the exploiters
    are able to bring to bear on the producers. I assume that at low exploiter numbers,
    they will be able to generate (and, thus, the proportion of resources that they
    will be able to extract from producers) is directly proportional to exploiter
    numbers: $aE$. However, as $E$ increases, the exploiters cannot extract more than
    is produced. Accordingly, I assume that the proportion of resource extracted by
    the exploiters is governed by the hyperbolic function $aE/(1+ae)$. Incidentally,
    this function can also be derived more mechanistically by considering how the
    exploiters control the territory on which the producers live. The parameter $a$,
    then, becomes the maximum size of the area that can be controlled by one exploiter.
    Note that this formula assumes that in the limit, as exploiter numbers increase,
    the proportion of product extracted approaches unity. To have a slightly more
    general model, let us set the proportion extracted to $Ea/(1+ae)$, where the new
    parameter $E$ is the maximum proportion of product extracted from producers.


    The total extraction rate is the proportion multiplied by the total production
    rate (which is itself, in turn, the product of per capita production rate and
    the number of producers:


    ```

    $$\frac{aE}{1+aE}\rho_0(1-gP)P$

    ```


    The remainder that is left to producers is


    ```

    $$\left(1-\frac{\epsilon aE}{1+aE}\right)\rho_0(1-gP)P=\frac{1+(1-\epsilon)aE}{1+aE}\rho_0(1-gP)P$

    ```'
