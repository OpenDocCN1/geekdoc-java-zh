    # B.3 QUANTIFICATION OF POLITY SIZES: THE FIRST MILLENNIUM C.E.


    My main source for polity sizes in Europe of 500–1000 C.E. was the Periodical
    Historical Atlas of Europe (Nili 2002). The Atlas lists hundreds of polities,
    but we are interested in only a subset of them. First, I ignore all polities whose
    maximal size was less than 0.1 Mm², for reasons explained in Section 5.1.2.


    Second, a number of polities have formed as a result of disintegration of large
    empires. I refer to such polities as *relics*. The defining feature of a relic
    is that its territory never grows; it seeds as a chunk of territory from a fragmenting
    empire and may decline further or stay constant in area until it is conquered
    by some other polity. Polities that I classified as relics are Austrasia and Neustria
    (Merovingian relics); Asturias (a Visigothic relic); West Frankish and East Frankish
    Empires, Italy, and Burgundy (Carolingian relics). Additionally, the Eastern Roman
    Empire of V is a relic (but not the Byzantine Empire of IX-X). I debated whether
    to treat Aquitaine as a relic of the Merovingian empire, but this polity actually
    grew in size during VII, so, to err on the conservative side, I classified it
    as an independent polity.'
  merge: -1
  pgno: 356
- img_proc: true
  md: 'Third, we need to distinguish polities developed in situ from those established
    by ethnies moving from elsewhere (such occurrences were particularly frequent
    during the period of 500–1000 C.E.). Here I distinguished three classes. The most
    clearest cases are the Avars, the Caliphate, and the Magyars. Because these ethnies
    formed outside the boundaries of Europe, I classified them as intruders and omitted
    the polities they established from the analysis. The second class consists of
    the Visigoths and Ostrogoths. These two Gothic groups went through ethnogenesis
    in the area north of the Black Sea, but established their polities within the
    Iberian and Appennine peninsulas, respectively. The final class consists of polities
    forming in situ, such as the Frankish (Merovingians and Carolingians) and Byzantine
    Empires. I also classified the Bulgar Empire and Wessex-England as polities forming
    in situ, because in both cases ethnic elements moved into the VLH and SBR areas,
    respectively, where they underwent fusion over a period of several centuries,
    eventually leading to the formation of new ethnies. Other in situ polities were
    the Burgundians (EFR), Alamans and Bavarians (SGE), Saxons (WGE), and Moravians
    (BOH). These polities probably were not true states, but ranged from complex chiefdoms
    to protostates. Very little is known about some of them, such as the Great Moravia.


    Finally, one polity, Khazaria, was omitted because its center was located in the
    North Caucasus, which is outside the covered geographic area. And there were several
    polities who started developing toward the end of the first Millennium, and whose
    territorial peaks were achieved after 1000 C.E.: Holy Roman Empire, Denmark, Kievan
    Rus’, Hungary, Bohemia, and Poland. These polities, therefore, were analyzed as
    part of the 1000–1900 c.e. period.


    # B.4 QUANTIFICATION OF POLITY SIZES: THE SECOND MILLENN C.E.'
