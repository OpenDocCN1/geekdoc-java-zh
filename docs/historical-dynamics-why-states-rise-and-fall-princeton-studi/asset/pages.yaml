    population estimates is that they are indirect. They rely on a physical record
    left by humans: most often, on the number of houses or settlements that were occupied
    at a certain period in time. Human density can also be estimated by the amount
    of food they grew, using, for example, pollen cores. The problem in all these
    cases is to translate the quantitative measures of human activities in the archaeological
    record into the number of people. For example, if we have an estimate of how many
    structures were present at some point in time, we need to also know how many people,
    on average, inhabited each structure. Note that this is not an insurmountable
    problem. In fact, in population ecology researchers rely on indices of population
    density that may even be nonlinearly related to density (an example is the data
    on the famous 10-year cycle in lynx fur returns). Furthermore, our primary interest
    is in relative population fluctuations, which are easier to document than absolute
    population densities.


    The great advantage of archaeological methods is that they offer a potentially
    objective way of reconstructing population history. These approaches clearly can
    have biases and require a lot of thought in real-life applications (Dewar 1991;
    Curet 1998), but generally the amount of subjectivity and guesswork is reduced.


