    +   To determine which of the three simple alternative models describes the historical
    dynamics of identity switching, I investigated several data sets on religious
    conversion. I contrasted predictions only from nonspatial models, since I lack
    spatial data. The data concerned conversion to Islam in Iran and Spain, the rise
    of Christianity in the Roman Empire, and the growth of the Mormon church.


    +   In all cases, the best model turned out to be the autocatalytic process. The
    initial acceleration period, predicted by the autocatalytic model, was obvious
    in all case studies. The autocatalytic model generated predictions of remarkable
