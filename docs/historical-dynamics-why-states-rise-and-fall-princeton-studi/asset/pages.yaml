    than thalassocracies. Again, this choice was deliberate. The basic resources of
    tellurocracies are land and people (thus my emphasis on territorial and population
    dynamics). I believe this tellurocracies particularly amenable to analysis with
    rather simple models. Not I tried to avoid any monetary issues (at least in models).
    Also, the economic submodel in the demographic-structural theory is quite simple,
    focusing entirely on food production. Such an oversimplified approach will clearly
    not do for thalassocracies.


    My focus on land power has led me to largely ignore the voluminous literature
    on hegemonic cycles (Modelski and Thompson 1996), even though I find this literature
    extremely'
