  md: '+   There are two forms of social capital: bridging (or inclusive) and bonding
    (or exclusive) (Putnam 2000:22). Examples of bonding social capital include ethnic
    fraternal organizations and exclusive country clubs, while the civil rights rights
    movement and ecumenical religious organizations are examples of bridging social
    capital. This distinction appears to address the issue of social scale: bonding
    social capital characterizes smaller-scale groups, while the bridging kind characterizes
    larger-scale societies.


    +   Putnam cautions that social capital may have its "dark side." While it is
    generally good for those inside the network, the external effects of social capital
    are by means always positive (Putnam 2000:21). One example is power elites exploiting
    social capital to achieve ends that are antisocial from a wider perspective. This
    is very similar to the already discussed idea of internally solidaristic groups
    coercing other, less cohesive groups.


