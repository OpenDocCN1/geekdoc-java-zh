    # 7.2.5 Summing up Theoretical Insights


    Demographic-structural models discussed in this section suggest two general insights.
    First, as a result of diminishing returns on labor, population growth in agrarian
    societies inevitably leads to a gradual fall of per capita income. Eventually,
    the surplus produced by peasants becomes insufficient for the maintenance of the
    state. State bankruptcy and collapse can be prevented only if population numbers
    are kept below the critical threshold at which state expenditures match state
    revenues.


    The second insight is the key role of elites in state dynamics. Elites can limit
    by leaving commoners with less income than is necessary for bare subsistence.
    However, there does not seem to be a general mechanism for limiting elite population
    growth. In some exceptional cases, the state apparatus may be able to function
    independently of elites, and provide necessary coercive force to limit elite numbers.
    In other cases, elites themselves may choose to limit their population growth.
    In most agrarian societies, however, I expect that elite numbers will increase
    beyond the sustainable level, leading to state breakdown.


    The elite attributes have a strong influence on the period and amplitude of state
    buildup/breakdown cycles. Two parameters appear to be of main importance: elite
    reproduction rate and extraction ability. High reproduction rate and low extraction
    ability lead to fast cycles of the Ibn Khaldun type, with a period of around a
    century, and mild amplitude of oscillations in common numbers. A low reproduction
    rate, approaching that of commoners, increases the period of the cycles. A higher
    extraction ability leads to more drastic falloffs of common population. Longer
    cycles also lead to a greater amplitude of population oscillations, because a
    longer decentralization phase causes commoner numbers to decrease to a lower level.
    As a result, the dynamics of commoner population in the selfish elite model with
    low elite reproduction and'
