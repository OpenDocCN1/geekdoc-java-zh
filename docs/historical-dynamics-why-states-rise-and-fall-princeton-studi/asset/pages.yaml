    quite far for a few individuals (for example, long-distance merchants). The mathematical
    theory of spatial contact processes distinguishes two important cases: the “thin-tailed”
    case when the tail of the contact distribution declines exponentially (or faster)
    with social distance, and the “thick-tailed” case when the tail declines more
    slowly than exponentially (Figure 6.1). As we will see below, these classes of
    tails imply very different spatial dynamics.


    When the contact distribution has a tail, it means that the focal individual makes
    a decision about conversion not only based on what others makes in the immediate
    social vicinity do, but also taking into account what the society at large does.
