    # 3.1.3 Ethnic Groups and Ethnicity


    One very important type of human collective is the ethnic group. All of the characteristics
    of human groups that we discussed above are expressed most vividly when applied
    to ethnic groups. Thus, the markers listed in Section 3.1.1– language, religion,
    phenotype, and territoriality—are used in various combinations to draw ethnic
