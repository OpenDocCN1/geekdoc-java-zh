    # 7.3.2 The Great Wave


    As I noted above, the value of the demographic-structural theory (Goldstone 1991b)
    lies in its detailed analysis of the interrelations between important social variables
    mediating the effect of population growth on state stability (or, rather, instability).
    The enormous amount of quantitative material collected by Goldstone on state breakdown
    in early modern Europe and Asia provides a solid empirical foundation for his
    theory. Yet the theory is incomplete: while the effect of population dynamics
    on state stability is extremely well documented, the feedback effect on population
    is not. In Goldstone’s theory population dynamics is an exogenous variable.


    A more complete description of the interactions between population numbers and
    sociopolitical stability was given in the (verbal) model advanced by the historian
    David Hackett Fischer (1996). Fischer proposed that during the period of 1200–2000
    C.E., western Europe went through four “great waves” of socioeconomic change (F
    was not the first to notice these waves; I return to this issue in the beginning
    of Chapter 8). These long-term dynamics were reflected in the history of prices
    (Figure 7.7), in which periods of price equilibrium (roughly, the Renaissance,
    the Enlightenment, and the Victorian Era) were interspersed with periods of rapid
    inflation (the “price revolutions” of the thirteenth, sixteenth, eighteenth, and
    twentieth centuries). Fischer argues that price movements are correlated with
    a comprehensive set of societal variables. Periods of price equilibrium were characterized
    by prolonged prosperity, flowering of the arts, and the spread of optimistic ideologies.
    Periods following price revolutions were characterized by widespread misery, political
    disorder, social disruption, and a growing mood of cultural anxiety (Fischer 1996:237).'
