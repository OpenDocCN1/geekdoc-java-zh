    # Trajectory Instability of Model Dynamics


    One interesting feature of the model is that its output is very erratic looking.
    In fact, if we repeatedly simulate the model starting with exactly the same initial
    condition (the initial location and asabiya of Empire 1), each run will produce
    wildly different outcomes. Because the rules of change are largely deterministic
    (the only way stochasticity enters the model is in the order in which cells become
    potential attackers, as well as in the order in which neighboring cells are attacked),
    this observation suggests that the model behaves chaotically. To check on this,
    I removed all stochasticity from the simulation (by fixing the order of attackers
    and directions to attack). The purely deterministic model still produced very
    erratic-looking trajectories (although now, of course, each run was exactly the
    same as the previous one). However, a small change in the initial conditions (for
    example, adding or subtracting a single cell from the initial state of Empire
    1) again produced rapidly diverging trajectories. Thus, it appears that the simulation
    is indeed characterized by chaotic dynamics (that is, sensitive dependence on
    initial conditions; Ruelle 1889).


