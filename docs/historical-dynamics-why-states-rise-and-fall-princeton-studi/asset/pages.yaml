    average of identities held by others (the weights are given by the contact distribution),
    then this spatial contact process is well approximated by a reaction-diffusion
    model in which the local source/sink term is logistic, and spatial redistribution
    is simple diffusion. This model has been thoroughly investigated, starting with
    the seminal work of Fisher (1937) and Kolmogorov et al. (1937) on the spatial
    spread of advantageous genes. A well-known application in social sciences is the
    model of spread of neolithic farmers in Europe (Ammerman and Cavalli-Sforza 1973).
    The dynamics of the model are as follows. Suppose we start with initially a small
    number of converts to the new religion (such as a group of disciples forming around
    a prophet or messiah). Locally, the conversion process will follow the S-shaped
    logistic curve, growing exponentially and then saturating when all local people
    are converted to the new religion. The spatial spread will also initially accelerate,
    but rather rapidly a well-defined front of advance is established, and this front
    expands with time at a constant velocity. As a result, the total area where the
    majority of people are converted expands linearly. Thus, after an initial acceleration
    the number of converts will grow linearly until the whole available space is taken
    over.


