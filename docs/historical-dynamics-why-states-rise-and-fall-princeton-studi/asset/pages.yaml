  md: 'In recent years, researchers in western Europe and North America have also
    become interested in the problems of ethnogenesis. A particularly fruitful research
    program is taking shape in the study of the ethnogenesises of various Germanic
    peoples at the time of the later Roman Empire (Wolfram and Pohl 1990; Heather
    1996; Hummer 1998). However, origins of other ethnies are examined with an increasing
    frequency (Roosens 1989; Emberling 1995; Hudson 1999; Moore 2001). Not all social
    scientists, however, are sanguine about the term “ethnogenesis,” because of its
    connotation of “origin” (see the discussion by Ausenda in Hummer 1998:21).


    The connection between frontiers and ethnogenesis has not escaped the attention
    of various authors. A very interesting study of the relationship between frontiers
    and ethnic identity is that of Armstrong (1982). A series of papers in the Journal
    of World History presented several case studies of frontier ethnogenesis (Chapell
    1993a, b; Miller 1993; Mulroy 1994).


    A very interesting perspective that merges the ideas of frontier ethnogenesis
    and core-periphery interaction is offered by Hall (2000, 2001). Hall defines a
    frontier as a region or zone where two or more distinct cultures, societies, ethnic
    groups, or modes of production come into contact. Contact often leads to conflict,
    and attempts by some groups to incorporate others across the frontier. Attempted
    incorporation and resistance against it exerts tremendous pressure on the incorporated
    people and the incorporating system. “These interactions also reshape the ethnic
    landscape. Frontiers are zones where ethnogenesis, ethnocide, culturicide, and
    genocide are common” (Hall 2000:241). Hall illustrates these processes with the
    example of Navajo (Diné) ethnogenesis. Navajo groups shared language, customs,
    and a vague sense of being the same people. However, Diné-wide institutions such
    as the Navajo Council developed as a result of frontier conditions. A consolidated
    Navajo ethnie began to form over the centuries of interaction between the Navajo
    and the Spaniards, and finally took shape under the American occupation (Hall
    2001:260).'
