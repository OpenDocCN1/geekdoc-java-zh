  md: 'followed. Still, I continue to argue for a conservative approach of first honing
    the theories and analytical approaches on the historical material, and applying
    them to contemporary issues only once we are reasonably sure of how well our approaches
    work.


    # 10.4 TAWARD THEORETICAL CLIODYNAMICS?


    If the combined modeling/empirical approach to investigating history, advocated
    in this book, has the potential to become a fruitful research program name it
    than “historical dynamics.” I propose to call it cliodynamics, by analogy with
    cliometrics. The term cliometrics was originally used for the new economic history
    in a rather derogatory sense (Williamson 1991), but now cliometrics is an accepted
    and mature direction within history. If we understand cliometrics in history,
    not just economic ones), (that is, a focus on any quantitative data in history,
    then it is an extremely valuable complementary discipline to the historical dynamics
    research program. Cliodynamics needs cliometrics for the raw empirical inputs.
    But I would argue that cliometrics needs something like cliodynamics as a source
    of theories and hypotheses to guide the empirical research.'
