  md: This analysis illustrates the value of translating verbal theories into mathematical
    models. Even though we made a number of greatly simplified assumptions, so that
    our model is at best a caricature of reality, nevertheless the model turned out
    to be capable of more complex behavior than we could have guessed beforehand.
    Most importantly, the model confirms that the postulated mechanism can lead to
    imperial boom/bust cycles, it also indicated that other kinds of dynamics are
    possible for different parameter values. Most importantly, if the empire’s“reach”
