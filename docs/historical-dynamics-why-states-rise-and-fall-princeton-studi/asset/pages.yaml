  md: '# A.4 MODELS FOR ELITE CYCLES


    The Ibn Khaldun Model

    Let $R$ be the amount of resources extracted from commoners, a constant. The per
    capita elite income, $\mu$, is determined according to the following algorithm:


    ```

    $$\mu = \begin{cases} (1-\gamma)R/E & \text{if } R/E \geq \mu_{\min}/(1-\gamma)
    \ \mu_{\min} & \text{if } \mu_{\min}/(1-\gamma) > R/E \geq \mu_{\min} \ R/E &
    \text{if } R/E < \mu_{\min} \end{cases}$$

    ```


    The per capita rate of elite population change is


    ```

    $r = \begin{cases} \chi(\mu-\mu_0) & \text{if } \chi(\mu-\mu_0) < r_{\max} \ r_{\max}
    & \text{otherwise} \end{cases}$$

    ```


    The dynamic equations for $E, S$, and $\mu_{\min}$ are, assuming that $S \geq
    0$


    ```

    $$\dot{E} = rE\n\dot{S} = (R-\mu E)-\alpha E\n\dot{\mu}_{\min} = \delta_{\mu}$$$

    ```


    If $S < 0$, then we set $E = E_0, S = 0$, and $\mu_{\min} = \mu_0$ and repeat
    the cycle.


