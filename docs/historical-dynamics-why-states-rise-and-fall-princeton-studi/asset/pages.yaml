    # 4.1.4 Placing the Metaethnic Frontier Theory in Context


    The argument of the previous section has several intersecting points with theories
    previously advanced in sociology and history. I will not attempt a complete literature
    review; my plan rather is to provide the context for the metaethnic theory, and
    to highlight some of the similarities to, as well as dissimities from, the thinking
    of previous authors.


    # Ibn Khaldun''s Theory


    The basic premises from which I advanced the frontier model of ethnogenesis are
    very different from those of Ibn Khaldun, and it is not surprising that the mechanism
    I propose differs substantially from his. However, there are also points of similarity.
    In fact, I believe that Ibn Khaldun''s theory is largely a subset of the frontier
    model. (Here I focus on Ibn Khaldun''s theory for the origin of dynasties; his
    theory dealing with the state collapse will be dealt with in Chapter 7.)


    In Ibn Khaldun''s theory for political cycles in the Maghreb, there are two ethnic
    groups, civilized Arabs living along the Mediterranean littoral, and desert Berbers
    living inland. Thus, there is an ethnic boundary dividing these two. The ethnic
    distance separating Arabs and Berbers, however, is not very large. Although Arabs
    lived in wealthy states, these states were generally too weak to exert much pressure
    on Berber tribal communities. Additionally, both ethnic groups professed Islam,
    which is therefore a factor that unifies rather than divides them. Although several
    Berber dynasties were established by religiously motivated groups belonging to
    a different sect from the settled areas, such a sectarian difference is not as
    large as, say, the'
