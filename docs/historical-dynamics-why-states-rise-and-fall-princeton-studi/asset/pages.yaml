  md: '# Chapter Two


    # Geopolitics


    Geopolitics, in the narrow sense that I use in this book, concerns itself with
    the spatial aspects of historical dynamics. There are two major kinds of mechanisms
    invoked in geopolitical models: the ability to project power at distance, and
    the effect of spatial position. Thus, geopolitics is a natural place to start
    in my review of theories for territorial dynamics of states. Additionally, it
    is one of the best-theorized areas in historical sociology (for example, Collins
    1978, 1986, 1995), and perhaps enjoys the greatest number of already existing
    formal models (see below). However, my argument in this chapter indicates that
    geopolitical models (in the narrow sense) are insufficient for the explanation
    of empirical patterns; in particular, they fail to account for a sustained decline
    of formerly powerful and territorially extensive policies.


    # 2.1 PRIMER OF DYNAMICS


    Rather than starting immediately with geopolitical models, I first review some
    basic facts about general kinds of behaviors that can be exhibited by dynamical
    systems. Although these facts are fairly elementary, they are worth discussing,
    because (1) they may not be well known to people lacking extensive experience
    with dynamic models, and (2) it gives me a chance to introduce a simple classification
    scheme, to which I can then refer throughout the book. An excellent introduction
    to dynamical social systems can be found in Fararo (1989).'
