  md: 'If two oscillatory systems are driven by the same mechanism, causing them to
    cycle with the same period, then they may oscillate in synchrony by chance alone,
    simply because they happened to get started at approximately the same time (Turchin
    and Hall 2003). If that is the case, then differences in phase will tend to be
    perpetuated in time. For example, it happened that France came out of the fourteenth-century
    crisis before England. Whereas France was already on the ascendant by 1450, England
    had to experience the last bout of its own collapse, the Wars of the Roses (1455–1485).
    This may have delayed the English demographic-structural cycle by roughly half
    a century, compared to France. Thus, we would expect the next period of England''s
    state breakdown should begin after that of France. This is what apparently happened:
    France was in a full-blown crisis by 1590, while England''s turn came only in
    1640. Of course, there is another possible explanation for this shift in phase.
    The demographic-structural theory predicts only how processes for crisis evolve.
    The actual beginning of the crisis needs a triggering event, which may come sooner
    or later. For example, in agrarian monarchies, the triggering event is often a
    disputed succession. Thus, two politics under identical amounts of pressure go
    into crisis 10 years apart, depending on their respective monarchs die. In the
    early modern French and English cases, however, it seems that there was a genuine
    difference in pressure for crisis. Food prices are a particularly good indicator
    of fiscal pressure, and note how food prices in France started increasing prior
    to for England (Figure 9.3). French prices reached a peak in 1590 (and a second
    during 1620–1640). In contrast, England food prices reached a peak only in 1640.
    These data, thus, suggest that France and England were genuinely shifted in phase.
    Note that France again that led the way with the French Revolution. By contrast,
