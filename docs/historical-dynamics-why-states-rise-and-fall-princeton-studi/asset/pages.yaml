  md: '# A.2 THE SPATIAL SIMULATION OF THE FRONTIER HYPOTHESIS


    The simulation takes place in a spatial “arena” consisting of 21 × 21 cells. Each
    cell represents a small regional polity or a province within a larger territorial
    empire (thus the spatial resolution is quite coarse). The simulation, therefore,
    assumes there are two spatial levels (single-cell regions and multicell empires).
    To start off, a single empire occupying several cells (for example, a 4 × 4 square
    area) is somewhere within the simulation arena. Each cell has two numbers associated
    with it: the imperial index (indicating which empire it belongs to) and its value
    of abasiya. At the start of the simulation, cells belonging to the first empire
    are indexed by 1, while the rest have an index of 0 (corresponding to the nonimperial
    hinterland).


    The abasiya value of a cell represents the average degree of collective solidarity
    felt by the population inhabiting the region for the supraregional empire within
    they may find themselves. If the imperial index of a cell is 0, then the abasiya
    refers to itself as a regional polity.) Abasiya dynamics are determined by the
    position of the cell with respect to the imperial boundaries. If a cell is next
    to an imperial boundary (that is, one of its neighbors has a different imperial
    index from its own), then the abasiya of the cell increases according to the following
    rule:


    ```

    $S_{x,y,t+1} = S_{x,y,t} + r_0S_{x,y,t}(1 - S_{x,y,t})$

    ```


    This equation is simply a discrete version of logistic growth, $\hat{S} = r_0S(1
    - S)$. The subscripts $x$ and $y$ index the spatial position of the cell within
    the arena, and $t$ is time. This formulation imposes an upper limit on abasiya,
    $S=1$ (the same as in the nonspatial model of Section 4.2.1). The abasiya of a
    cell that is not on a boundary decays exponentially at the rate $\delta$:


    ```

    $S_{x,y,t+1} = S_{x,y,t} - \delta S_{x,y,t}$

    ```'
  merge: -1
  pgno: 329
- img_proc: true
  md: "Note that the neighborhood of a cell is defined as the four cells sharing a\
    \ linear boundary with it (this excludes the four diagonal cells that only touch\
    \ comers with the focal cell). Furthermore, cells within the nonimperial hinterland\
    \ are considered to be on a boundary only when they are adjacent to an empire.\n\
    Territorial empires are characterized by two numbers: the number of regions they\
    \ control, $A_{i,p}$, and the average asabiya,\n\n```\n$$\\bar{S}_{i,t} = \\frac{1}{A_{i,t}}\
    \ \\sum_{(x,v) \\in i} S_{x,y,t} \\quad (A.7)$\n```\n\nHere i is the imperial\
    \ index.\nAt every time step each cell considers an attack on its four neighbors.\
    \ The attack does not take place if the neighbor belongs to the same empire (but\
    \ nonimperial hinterland cells can attack each other). The success of the attack\
    \ depends on the relative powers of the attacker cell and the defending cell,\
    \ $P_{att}$ and $P_{dep}$ respectively.\nThe power of a cell $x, y$ at time $t$\
    \ is calculated as follows:\n\n```\n$$P_{x,y,t} = A_{i,t}\\bar{S}_{i,t}\\exp[-d_{i,x,y}/h]\
    \ \\quad (A.8)$\n```\n\n$\bar{S}_{i,t}$ is the average asabiya of the empire $i$\
    \ to which the cell belongs, $d_{i,x,y}$ is the distance between the imperial\
    \ center, and $h$ is the parameter determining how fast the power declines with\
    \ increasing distance. The imperial center is the center of gravity of the empire.\
    \ Thus, the $x$ coordinate of the imperial center is calculated by averaging the\
    \ $x$ coordinates of all cells belonging to the empire, and the $y$ coordinate\
    \ is calculated analogously. Note that equation (A.8) is analogous to the equation\
    \ for $A$ in the nonspatial asabiya-territory model [see equation (4.5)], with\
    \ the only difference being that the effects of logistical constraints are modeled\
    \ with a negative exponential form, while in equation (4.5) I used a linear approximation\
    \ of the negative exponential."
