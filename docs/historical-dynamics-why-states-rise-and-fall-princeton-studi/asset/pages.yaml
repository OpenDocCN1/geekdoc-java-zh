  md: '# Implications for the Research Program


    Since my main focus is on preindustrial societies, I will restrict the term asabiya
    (the capacity of a group for collective action) to agrarian and extractive societies.
    If social capital is a closely related concept to asabiya, as I would argue, although
    one developed for industrial societies, then we can greatly benefit from theoretical
    and empirical research on this topic. The first important aspect of social capital
    is that political scientists have developed methods for measuring it. Measures
    can be made on both the individual and group levels. At the individual level,
    Putnam and co-workers quantify the density of networks within which people are
    embedded, the quality of interactions (cooperation, reciprocity), and mutual trust.
    At the level of societies, Putnam and co-workers have addressed institutional
    effectiveness, such as in the Italian example referred to above. Other theorists
    have connected the level of social trust to economic performance (Fukuyama 1995).
    If social capital is measurable, then by implication its equivalent for preindustrial
    societies, asabiya, may be measurable too.


    As argued throughout this chapter, one of the most important determinants of asabiya
    is the capacity of individuals to behave solidaristically, that is, to sacrifice
    individual advantage for the sake of the common good (however, this is not the
    only dimension of asabiya; for example, the capacity to self-organize, as in choosing
    and then obeying leaders, can also affect the capacity for collective action).
    The historical record provides several kinds of quantitative data that can be
    used to measure the degree of solidarity among individuals of a certain group,
    such as the willingness to provide recruits for the army and to pay taxes. The
    last variable, the tax rate to which the populace acquiesces, can be quantified
