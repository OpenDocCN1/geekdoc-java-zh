  md: 'Social theorists have long known that conflict between groups tends to increase
    internal cohesion (Simmel 1955; Coser 1956). Conflict sets boundaries between
    groups and strengthens group consciousness (Coser 1956:34). Simmel and Coser also
    make the important observation that severe conflict can either break a group or
    increase its internal cohesion. The most important factor affecting the outcome
    seems to be the initial degree of group consensus. If a group is lacking in basic
    consensus, an external threat may lead to apathy, and the group disintegrates
    (Coser 1956:93). A group that enjoys some degree of initial cohesiveness, the
    other hand, is likely to emerge from the conflict greatly strengthened. This observation
    is consistent with how I envision ethnogenesis in the frontier zone. Certainly
    not every ethnic group will immediately enjoy an increase in asabiya upon finding
    itself next to the frontier. Most groups will perish in the pressure cooker of
    a metaethnic frontier (note that, when a group disappears, it does not necessarily
    mean that all or even most of its members are physically destroyed). Other groups
    will survive but will be unable to scale up without disintegrating. Very few groups,
    by chance or conscious design, will be able to hit on the combination of norms
    and structures that will enable them to survive and expand.


    # Frontiers in History


    There is an enormous literature on frontiers. Some directions, such as the “frontier
    thesis” of Turner (1921) and related literature, are not particularly useful to
    our purposes. Highly relevant is the observation made by McNeill (1963:60) about
