  md: '# Chapter Ten


    # Conclusion


    # 10.1 OVERVIEW OF MAIN DEVELOPMENTS


    In Chapter 1 I outlined a research program for investigating historical dynamics.
    The main features of the proposed approach are (1) translation of verbal theories
    into mathematical models, (2) derivation of quantitative predictions from two
    or more alternative theories/models, and (3) empirical tests to determine which
    of the rival theories predicts data best. This general approach worked very well
    in the natural sciences, but can it be applied to social and historical questions?
    I believe it can, and I attempted to show how a consistent application of the
    approach can yield nontrivial advances in the understanding of territorial dynamics
    of agrarian policies.


    # 10.1.1 Asabiya and Metaethnic Frontiers


    Perhaps the most novel development that I discuss in the book is the theory of
    asabiya, the capacity of a group for collective action (Chapter 3), I advanced
    the hypothesis that asabiya increases on metaethnic frontiers and declines in
    the core regions of large policies. I explored this hypothesis with a simple analytical
    model and determined under what conditions we should observe repeated cycles of
    imperial rise and demise (Chapter 4). I then developed an empirical apparatus
    for testing the theory. This turns out to be a nontrivial task (and very much
    work in progress), but such difficulties are probably to be expected when new
    concepts are advanced and raw empirical facts'
