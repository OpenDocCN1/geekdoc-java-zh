  md: '# The Threshold Model


    Making the probability of switching in proportion in the core etnie was a step
    in the right direction. However, we assumed that the relationship between $p$
    and $C$ was linear ($p = rC$), and it is a good idea to investigate what will
    happen if we relax this assumption. A particular class of nonlinear behaviors,
    threshold models of collective behavior (Granovetter 1978; Schelling 1978), has
    been extensively discussed in the sociological literature. Particularly important
    to the issue at hand is that it has also been applied to the problem of switching
    ethnic identity (Laitin 1998).


    We can model threshold behavior by modifying the previously assumed relationship
    between $p$ and $C$ to a nonlinear one of the form $p = rC(C - C_0)$. The new
    parameter, $C_0$, is the threshold proportion. When $C > C_0$, the rate of switching
    the core etnie has achieved the “critical mass”. When $C < C_0$ the rate of switching
    is negative. That is, more individuals are switching from core to peripheral identity
    than versa (in other words, I interpret $p$ as the difference between the probabilities
    of switching in either direction). The notions of critical mass and threshold
    behaviors are amply discussed by Schelling (1978) and Granovetter (1978), among
    others, so I do not discuss them further here, referring the reader to these authors
    instead.


    Substituting the assumed form of $p$ in the model, we have the following equation


    ```

    $$\dot{C} = rC(C - C_0)(1 - C)$

    ```


    The threshold model belongs to the class of metastable dynamics It has two equilibria:
    two stable $C=0$ and $C=1$, and one unstable $C=C_0$. The outcome of the ethnic
    assimilation process is entirely dependent on the initial conditions. If $C$ starts
    above $C_0$, then the trajectory eventually approaches 1. In other words, all
    population of the empire acquires the core identity. Alternatively, if $C$ starts
    below $C_0$, then the peripheral identity will'
