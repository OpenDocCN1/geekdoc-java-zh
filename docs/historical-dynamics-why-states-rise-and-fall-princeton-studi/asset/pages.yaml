  md: 'In summary, here are the main points of Ibn Khaldun''s argument about the dynamic
    relation between asabiya and polity strength. Asabiya grows and is maintained
    at a high level in small-scale societies, where the capacity for collective action
    is the key to survival. Additionally, such societies produce only necessities,
    and therefore there is no corrosive effect of luxuries on asabiya. Ibn Khaldun''s
    primary example of such “desert” societies are the Berbers of Maghreb, although
    he also cites other instances, several Arab tribes who invaded northwestern Africa
    in the eleventh century (I:283). Desert tribes with high asabiya conquer civilized
    people with low asabiya, and establish a ruling dynasty (a state) over them. Under
    conditions of civilized life, however, asabiya inevitably declines. In approximately
    four generations, asabiya becomes so low that the state collapses as a result
    of factional conflict. This is the point at which the civilized area becomes vulnerable
    to another conquest by desert tribes.


    # Assessment


    There is much in Ibn Khaldun’s theory that appears to be very useful to our objectives.
    First, the theory is very clearly formulated. Thus, it makes clear empirical predictions
    that can be tested. Additionally, if quantitative predictions are needed, then
    the theory can, rather easily, be translated into a mathematical model. Second,
    Ibn Khaldun describes explicit sociological mechanisms on which his theory of
    state collapse is based. This provides another way in which the theory can be
    tested.


    There are also some weak points. In general, while Ibn Khaldun offered a brilliant
    account of one kind of society—an Islamic society of the arid zone—his account
    is not universally applicable even within Islam (Gellner 1981:88–89). It would
    be interesting to see if his theory can be extended to agrarian societies in general.
    More specifically, one could question Ibn Khaldun’s emphasis on the importance
    of “luxury” in asabiya decline. Ibn Khaldun’s is not the only theory that invokes
    this mechanism; many “softening-of-the-fiber” theories propose similar explanations.
    This is a question that'
  merge: -1
  pgno: 79
- img_proc: true
  md: 'should be resolved empirically, but to that we need some explicit alternatives
    to test against. I try to construct an alternative explanation in Chapter 4.


    # 3.2.2 Gumilev’s Theory


    Although the ethnogenic theory of Gumilev (1971) is largely unknown in the West,
    it has generated a considerable controversy in Russia, at least among lay public
    interested in macrohistorical questions. The reception among professional historians
    and ethnologists was cooler, for reasons that will become apparent shortly. Despite
    its serious scientific flaws, however, Gumilev’s theory contains several interesting
    concepts, which can be of use to the historical dynamics project, and thus I briefly
    review it.


    The main kernel of Gumilev’s theory is the explicit connection that he makes between
    ethnie and polity dynamics. According to Gumilev, each polity has its core ethnie,
    and it is the properties of core ethnies that drive the success or failure of
    their polities. The key concept of Gumilev’s theory is passionity. Individuals
    with high passionity (passionaries) purse, with great energy, some goal that is
    usually extraritorial. That is, passionaries are typically motivated not by personal
    gain, but by some higher goal (the goal may be selected consciously or not). Although
    in his definition Gumilev does not address the collective solidarity aspect of
    passionity, the language he uses is evocative of asabiya. In particular, Gumilev
    repeatedly mentions the ability of passionaries to sacrifice themselves for the
    sake of the collective good. (This exposes one of the problems with Gumilev’s
    theory: it is not developed very precisely. Instead, Gumilev relies on voluminous
    examples and evocative prose to get his point across.)


    Different ethnies have variable proportions of passionaries. Additionally, the
    degree of passionity of an ethnie changes with time. An ethnie with great numbers
    of passionaries will expand at the expense of other ethnies, in the process building
    an empire. Thus, high passionity directly translates into a polity’s capacity
    for territorial expansion, and vice versa.'
