    # Semiperipheries in the World-Systems Theory


    The world-systems theory was formulated by Wallerstein (1974, 1980, 1989), and
    later developed in various directions by other authors (for an overview, see the
    recent volume edited by Denmark et al. 2000), so that at this point in time it
    is more of a research program, rather than a single theory. One basic premise
    shared by researchers working within the world-systems paradigm is that the dynamics
    of any single polity or society are not endogenous, but are a consequence of complex
    interactions among local, regional, and global processes (Chase-Dunn and Hall
    1997). An extremely important kind of spatial interaction is between core and
    periphery regions within the world-system (in fact, world-systems can be conceptualized
    as core-periphery structures; Hall 2001). Core/periphery differentiation exists
    when two societies systematically interact and have higher population density
    and/or greater complexity than the other (Chase-Dunn and Hall 2000:91). Chase-Dunn
    and Hall further conceptualize the semiperiphery as those regions that are spatially
    located between core and peripheral regions, or between two competing core regions.
    Alternatively, semiipheries may mix core and periphery forms of organization,
    or be intermediate in form between those forms found in the adjacent core and
    peripheral areas.


    Chase-Dunn and Hall argue that “semiperiphery is fertile ground for social, organizational,
    and technical innovation and is advantageous location for the establishment of
    new centers of power. In particular, secondary state formation on the marches
    of empires has frequently been recognized as a semiperipheral phenomenon that
    is related to the rise and fall of empires” (2000:96).


    There are some striking parallels between the Chase-Dunn and Hall theory and the
    one advanced in this chapter. However, I argue that the theory of semiperipherical
    marcher states has not yet been'
