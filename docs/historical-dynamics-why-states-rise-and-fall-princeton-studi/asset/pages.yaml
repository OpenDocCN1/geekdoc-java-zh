    on both demographic rates (birth, death, and migration rates) and the productive
    capacity of the society. As a result, state breakdown is typically followed by
    periods of population decline.


    +   - A simple mathematical model of the interaction between population dynamics
    and the fiscal health of the state predicts recurrent episodes of state building
    and population growth followed by state breakdown and population decline. For
    the range of plausible parameter values this demographic-fiscal model predicts
    state breakdown should occur at somewhat irregular intervals 2-3 centuries apart.


