    # Image layers


    It is crucial to have a solid understanding of layers in order to build effective
    containers. The details behind how you build the source of your containers—your
    container images—greatly impact their size and performance, and'
  merge: -1
  pgno: 181
- img_proc: true
  md: 'some approaches have security implications, making this concept even more important
    to master.


    Docker image layers are a fundamental concept in Docker, and they represent the
    building blocks of Docker images. A Docker image layer is a read-only file system
    layer that contains changes to the underlying file system. Each layer is immutable
    and represent a specific set of changes to the file system. Basically, Docker
    images are built by establishing a base layer and subsequently making small changes
    until you arrive at your desired state. Each layer represents a set of changes
    including, but not limited to, the creation of users and related permissions,
    modifications to configuration or application settings, and updates to existing
    packages or adding/removing packages. These changes all amount to additions, modifications,
    or the removal of sets of files in the filesystem. For example, let us say that
    you have a Docker image that contains an application and its dependencies. The
    image might consist of multiple layers, with each layer representing a different
    aspect of application. The first layer might contain the base operating system
    and the second layer might contain application code. Each subsequent layer builds
    on top of previous layer, adding new changes to the file system.


    Docker image layers are important for number of reasons:


    +   - Image layers enable Docker to perform efficient storage and transmission
    of images. When you pull a Docker image from registry, Docker only needs to download
    the layer that has changed since the last time the image was pulled. This makes
    the download process faster and more efficient.

    - Docker image layers enable Docker to perform efficient caching. When you build
    a Docker image, Docker caches each layer separately. This means that if you make
    a change to the Dockerfile and rebuild the image, Docker can reuse the cached
    layer, only rebuilding the layers that have changed. This makes the build process
    faster and more efficient.'
  merge: -1
  pgno: 182
- img_proc: true
  md: '+   - Finally, Docker image layers enable you to create smaller and efficient
    images. By breaking down an image into multiple layers, you can reuse common layers
    across multiple images, reducing the overall size of each image making it easier
    to deploy and manage your applications.


