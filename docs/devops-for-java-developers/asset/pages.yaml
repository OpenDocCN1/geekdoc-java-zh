    The last strategy that we will look at is a Canary deployment (Figure 8.3). The
    idea behind Canary deployment is to release the new version of the software incrementally
    and selectively, just like using a canary in a coal mine to detect toxic gases
    – if the canary (or a small subset of users) is unharmed, it is safe to proceed
    with the broader release.


