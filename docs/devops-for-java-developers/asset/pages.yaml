    # Critical concepts of continuous integration


    Only a properly executed CI process can be considered effective. By streamlining
    the software development process, CI ensures no disconnected stages. It achieves
    this by incorporating all the development phases—integration, testing, verification,
    and deployment—into each segment of development.


    The following are the steps for CI:


    +   1. Developer checks the code into the Version control tool''s staging repository.

    2. The version control system (VCS) notifies the CI server that a commit has occurred.
    Or, the CI server polls the repository periodically looking for commits.

    3. The CI server starts the build process on a build server.

    4. The code containing the latest commit is checked out of the repository into
    a local workspace on the build server.

    5. The changed code''s quality is tested, and the code is built.

    6. Test results and build results are reported back to the CI server.

    7. The CI server sets the final result of the build as Pass or Fail.

    8. If the build is successful, then the committed change may proceed through the
    development cycle - transferred to the real repository or merged to the main development
    stream. If the build failed, the committed changes are stopped from proceeding
    until those issues are resolved by the developer.

    9. The CI server notifies everyone who have registered interest in the build.
    They can then log into the CI server to view the status plus any additional information.'
