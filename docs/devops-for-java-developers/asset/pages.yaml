  md: '# Declarative build script


    Your first step in implementing a CI solution should be to script your build,
    regardless of the stage of your project—whether it is Greenfield, legacy, a small
    individual library, or a large multi-module project. The frustration of buggy
    build permutations caused by bad dependency management, forgetting to include
    necessary resources when creating the distributable package, or accidentally skipping
    build steps, among other pitfalls, can be avoided by having a consistent, repeatable
    process that you can automate.


    By scripting your build lifecycle, you will save a huge amount of time. Your project''s
    build lifecycle, which consists of all the discrete steps needed to build it,
    can easily become more difficult as time goes on, especially if you continue to
    add modules, tests, and dependencies while consuming an increasing number of resources
    and dependencies. Depending on the environment where your project will be deployed,
    you might also need to build it differently. For instance, it may be necessary
    to enable debugging features in a development or QA environment but to disable
    debugging in a build that will be released to the public and to stop test classes
    from being included in the distributable package. Manually carrying out every
    necessary step needed to build a Java project, including taking into account configuration
    variations per environment, is a breeding ground for human error. You will understand
    the value of a build script the first time you skip a step like creating an updated
    dependency and must repeat a build of a sizable multimodule project to fix your
    error.


    Make sure to use a declarative rather than an imperative approach when scripting
    your build, no matter what tool or framework you select. Here is a brief explanation
    of what these terms mean:


    +   - **Imperative**: Setting up a precise process with implementation information.


    +   - **Declarative**: Defining an action without providing implementation information.
    In other words. Keep your build script focused on what you need to do rather than
    how to do it.'
