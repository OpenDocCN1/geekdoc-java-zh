    # Dockerfile


    Docker can automatically create images by following the directions in a Dockerfile.
    A Dockerfile is a text file that includes every command a user could enter on
    the command line to put together an image. Hence, it contains a set of instructions
    used to build a Docker image. It defines the environment in which the application
    runs, specifies the base image, copies files, installs dependencies, and executes
    commands needed to prepare the final containerized application. When you build
    a Docker image, Docker reads the Dockerfile to automate the image creation process.


    # Sample Dockerfile


    The following is a sample of a Dockerfile to let you understand what it looks
    like:


    ```

    FROM tomcat:8-jre11


    LABEL "Project"="Docker-Demo

    ```'
