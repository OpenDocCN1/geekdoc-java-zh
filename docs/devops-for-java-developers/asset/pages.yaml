  md: '# Three generations of source control management


    Evolution in SCM has seen distinct generations, each addressing challenges and
    enhancing collaboration in software development. From the initial era of local
    file-centric control to the centralized repositories of the second generation,
    and finally, the distributed versatility of the third generation, these advancements
    have significantly influenced developer workflows and productivity. Let us discuss
    the characteristics and tools defining each generation of SCM.


    # First generation: Local SCM software


    The first generation SCM was intended to track changes for individual files. You
    have to check out (lock) files before you edit them. Then, you check in (release
    the lock) files for other members to edit. This eliminated the possibility of
    two developers making changes at the same time, making conflicting changes. While
    using SCM, you had to wait for the other person to finish his/her changes and
    release the lock; this resulted in affecting the overall productivity of the team.


    A few tools of first-generation source control management are:


    +   - Revision Control System (RCS)¹

    - Source Code Control System (SCCS)²


    # Second generation: Centralized SCM tools


    With time, substantial improvement was made in second generation SCM tools. The
    second generation introduced centralized repositories containing the official
    versions of the code. A centralized source control management system allowed multiple
    users to make changes in the code in the same time. Later, all conflicts were
    analyzed and conflict changes were given back to developers to resolve. Once resolved,
    the code was committed back to the same central repository. This not only increased
    the developer productivity but also allowed developers to work individually in
    isolation'
