    # ## Choosing VMs vs containers


    Depending on the tasks you want your virtual environment to perform, you should
    choose between virtual machines and containers.


    Virtual machines are a better solution if you need to:


    +   * Control multiple operating systems and applications from a single server.

    * Run an application program that requires all the resources and features of an
    OS.

    * Ensure complete isolation and security.


    Containers are suitable if you need to:


    +   * Make the most of a server''s capacity by running as many applications as
    possible.

    * Deploy numerous copies of the same application.

    * Have a lightweight, quick-starting system.

    * Create an application that can be run on any infrastructure.


    # ## Key container and image terminologies


    The world of containers has its own lexicon, and you will encounter the following
    terms frequently:'
