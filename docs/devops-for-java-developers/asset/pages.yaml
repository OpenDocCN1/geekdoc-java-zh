  md: 'and test the large features separately, which could later be merged into an
    integrated codebase.


    A few second generation source control management tools include:


    +   - Perforce Helix Core

    - Concurrent Versions System (CVS)

    - Apache Subversion (SVN)

    - Microsoft Visual SourceSafe (VSS)


    # Third generation: Distributed SCM systems


    The third generation of source control management system comprises the distributed
    VCS, or DVCS. In distributed VCS, every developer has a copy of the entire repository
    and the full history stored locally. You check out a copy of the repository, make
    changes, and check in back. If you want to integrate those changes with other
    developers, you sync your entire repository in a peer-to-peer fashion. With DVCS
    SCM, you have a local copy of the repository, checking code in and out, merging,
    and managing branches can all be done without a network connection. All SCM operations
    are local to the machine and not affected by network speed or server load, hence,
    they are faster. The initial sync includes copying the entire repository history,
    which can be much slower. Since everyone has a full copy of the repository and
    all history, very large projects may require an extended disk requirement.


    The third-generation source control management tools have been listed as follows:


    +   - Git

    - Mercurial

    - BitKeeper

    - Darcs Advanced Revision Control System (Darcs)

    - Fossil'
