  md: '# CHAPTER 8


    # Deployment Strategies


    # Introduction


    In the era when computers were massive and prohibitively expensive, hardware and
    software were typically bundled together by manufacturers. However, as mass-market
    software emerged, this approach became cumbersome, leading to new distribution
    methods. Modern development now prioritizes separating build and deployment tasks
    to facilitate quick distribution and parallel work. Deploying an application transforms
    it from a packaged artifact into a functional system, and speed is critical to
    assess its status and get rapid feedback. As a developer, you must write high-performance
    code and ensure it integrates seamlessly with the infrastructure by clearly communicating
    deployment instructions to your DevOps team.


    During deployment planning, it is beneficial to create a Wish list for future
    scalability and efficiency. This Wish list may include frequent small deployments
    to gradually enhance system functionalities and enable easy rollback in case of
    failures. This ensures isolated Microservice deployment for scalable and replaceable
    individual components, promoting the reusability of deployed Microservices across
    diverse environments, and automating infrastructure deployment to seamlessly align
    with evolving application features.'
