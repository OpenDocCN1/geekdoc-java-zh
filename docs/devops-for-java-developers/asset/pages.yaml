    # # Source control management


    Source control management is the practice of tracking changes to source code.
    Keeping a history of all the changes made to a codebase helps developers and testers
    to ensure that they are always working with correct and up-to-date pieces of code.
    This also helps resolve code conflicts that occur when multiple sources merge
    the code.


    When multiple developers work on a shared code base, source control management
    is essential, especially when each developer is working on their respective feature,
    and unknowingly, they could make conflicting code changes, or one developer’s
    work could overwrite the other developer’s changes.


    Before the adoption of source control management, each time a developer started
    working on a code file, they would have to tell others that no one else worked
    on it simultaneously. However, that was not fault-prone. Any'
  merge: -1
  pgno: 110
- img_proc: true
  md: 'miscommunication could result in code conflicts and code rework. Another drawback
    of this manual process was that tracking the change history was a big headache,
    especially, when any change resulted in a bug.


    Source control management solves several key problems related to code in the software
    development lifecycle and provides immense benefits:


    +   - Collaboration: Without proper source control management, team members of
    large teams working on a single codebase would frequently get blocked by one another.
    This impacts productivity.

    - Protection: It helps teams manage the source control and prevents it from being
    deleted, accidentally lost, or compromised by human error.

    - Versioning: Versioning of code is useful in identifying what is being deployed
    or delivered to customers.

    - History: Preserving the order of code files in chronological order helps restoring
    the system with previous versions if any issues occurred or performance degraded
    with current changes.

    - Attribution: Maintaining the record of the author of the changes in a particular
    file allows one to identify who does the changes, evaluate the expertise and risks
    when making changes.

    - Dependencies: With source control management repositories, it is easier to manage
    project metadata and other dependencies.

    - Quality: It allows an easy review process of changes, which provides better
    and quick feedback. This increases the overall quality of the product.


    Source control management tracks each developer''s changes, warn and highlight
    conflicts so they can address them before they are merged into the source control
    and prevents code overwriting. Since source control management plays such a critical
    role in software development, it is important to understand how it works and select
    a system that best meets the needs of your organization and the desired DevOps
    workflow.'
