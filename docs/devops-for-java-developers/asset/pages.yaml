    # Working with persistent data collections


    Microservices architecture, known for its ability to build robust and scalable
    applications, emphasizes that each Microservice should independently manage its
    data. This principle not only encourages autonomy but also prevents unintended
    dependencies, enabling individual deployments. However, handling persistent data
    collections in this context requires thoughtful planning and strategic thinking.


    If you are using NoSQL databases like CouchDB or MongoDB, you have flexibility
    regarding database changes. You can perform structure alterations directly from
    your application code.


    When working with standard SQL databases, managing schema changes is crucial.
    Tools like Flyway or Liquibase can help you handle schema modifications seamlessly.
    These tools assist in generating migration scripts and keeping track of which
    scripts have been executed in the database. When invoked, these migration tools
    scan available scripts, identify those that haven''t been run on a specific database,
    and execute them.'
  merge: -1
  pgno: 372
- img_proc: true
  md: 'When choosing and implementing a deployment strategy, you should pay attention
    to the following:


    +   * Ensure that both database schema versions are compatible with the application
    versions used during deployment.

    * Maintain schema compatibility with the previous working version of your containerized
    application.

    * Changing a column''s data type necessitates converting all values stored based
    on the old column definition.

    * Renaming a column, table, or view can be backward-incompatible unless you use
    triggers or a programmatic migration script.


    Separating the deployment of application code from applying migration scripts
    allows for independent management of Microservices. Cloud providers offer various
    managed database solutions, eliminating the need to manage underlying infrastructure.
    However, consider data security and management when using managed database services.


    The decision of whether to run databases in Kubernetes depends on aligning Kubernetes
    management practices with the operational steps required to maintain databases.
    Kubernetes community has resolved these challenges by implementing operators that
    incorporate logical domain and operational runbooks. OperatorHub.io provides an
    extensive list of operators for managing databases in Kubernetes.


    # Best practices for logging and monitoring


    In the realm of IT, the focus is often on making containerized applications operational.
    While during development on your local machine, you are the primary user of your
    work, in production, your application faces the entire world. To ensure your application
