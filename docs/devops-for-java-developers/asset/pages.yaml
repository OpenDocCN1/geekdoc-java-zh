- img_proc: true
  md: '“central” codebase, it gives every developer a server-side repository. This
    means that each contributor has not one but two Git repositories, a private forked
    repository, and a master server-side main code repository. The fork workflow is
    popular among teams who use open-source software.


    The flow usually looks like this:


    +   1. The developer forks the main repository. A copy of this repository is created
    in their account.

    2. The developer clones the repository from their account to their local system.

    3. A remote path for the server-side repository is added to the repository that
    is cloned to the local system.

    4. The developer creates a new feature branch in their local system, makes changes,
    and commits them.

    5. These changes, along with the branch, are pushed to the developer’s copy of
    the repository on their account.

    6. A pull request from the branch is opened to the official repository.

    7. The main repository’s manager checks the changes and approves the changes to
    get merged into the main repository.


    # Trunk-based development


    All the above-mentioned git flow approaches are alternatives to the feature development
    model. When developers finish new work, they must merge the new code into the
    main branch. Yet, they should not merge changes until they have verified that
    they can build successfully. During this phase, conflicts may arise if modifications
    have been made since the new work began. In particular, these conflicts are increasingly
    complex as development teams grow and the code base scales. The longer the feature
    branch is in active development, the higher the likelihood of merge conflicts
    with other features and maintenance going on in the master branch (or trunk).
    Trunk-based development⁷ eases the friction of code integration.'
