  md: 'Before diving into that, let us first discuss the distinctions between virtual
    machines and containers and how to choose one.


    # Difference between containers and virtual machines


    Both virtual machines and containers are used for creating isolated virtual environments
    for developing and testing software or applications. How they differ is the key
    question.


    # Understanding virtual machines


    A virtual machine is a simulation or virtual representation, of a real physical
    computer. Even when they are all running on the same host, each virtual machine
    has its own operating system and operates independently of the others. It is also
    known as a guest machine because it runs on the host''s hardware as a guest.


    A VM cannot communicate with a physical host computer directly. To communicate
    with the underlying physical hardware, it needs a thin layer of software called
    a hypervisor.


    # Working of virtual machine


    Virtualized hardware, an OS, and any necessary binaries and libraries are all
    contained within the virtual machine, allowing it to run any application. Virtual
    machines are, therefore, independent and have their own infrastructure.


    Refer to the following figure:'
  merge: -1
  pgno: 154
- img_proc: true
  md: '![](img/2823e13452e8ef2b62d2f34747f2d027_155_0.png)


    Each virtual machine is totally isolated from the host operating system. Additionally,
    it needs its own OS, which may not be the same as the OS of the host. Each has
    its own set of applications, libraries, and binaries.


    # Components of virtual machine


    These are the components of a virtual machine:


    +   * **Hypervisor:** It allocates physical computing resources (i.e. processors,
    storage and memory) to each Virtual Machine.

    * **Host machine:** It is the hardware on which the Virtual Machine is installed.

    * **Guest machine:** another name for the virtual machine (VM).


    # Pros and cons of virtual machine


    Below are some of the pros of VM:


    +   * **VMs reduce expenses:** Customers do not need to purchase a new server
    every time they want to run a different OS because multiple VMs can run on a single
    physical computer, allowing them to get more out of each piece of hardware they
    already own.

    * **Scalable:** One host machine makes it possible to effectively manage all the
    virtual environments thanks to the hypervisor''s centralized'
  merge: -1
  pgno: 155
- img_proc: true
  md: 'power. You can install multiple system environments because these systems are
    totally independent of one another. Multiple copies of the same virtual machine
    can be quickly deployed using cloud computing to handle load increases.


    +   * **Portable:** VMs can be moved as required among the physical computers
    in a network. As a result, workloads can be distributed among servers with extra
    processing power.


    +   * **Flexible:** Because you can copy an existing VM with the OS already installed,
    creating a virtual machine is quicker and simpler than installing an operating
    system on a physical server. To handle new tasks as they come up, developers and
    software testers can instantly create new environments.


    Now discuss some of the cons of the VM:


    +   * **Unstable performance:** If infrastructure requirement is not adequate:
    running multiple virtual machines on one physical machine may lead to unstable
    performance.


    +   * **Take lots of system resources:** Virtual machines, which can be many GBs
    in size, can consume a lot of the host computer''s system resources. Running a
    single application on a virtual server means running a copy of the operating system
    as well as virtual copy of all the hardware. As a result, many RAM and CPU cycles
    are quickly accumulated.


    +   * **Relocation of an app:** Due to its constant linkage to the operating system,
    moving an application that is currently running on a virtual machine can be challenging.
    Therefore, you need to migrate both the OS and the application. Additionally,
    when a virtual machine is created, the hypervisor allows hardware resources specifically
    for the VM.


    Some popular VM providers are:


    +   * VirtualBox


    +   * Hyper-V'
