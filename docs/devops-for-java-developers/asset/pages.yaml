    # The evolution to continuous delivery


    Continuous delivery is the natural evolution of CI. While CI focuses on integrating
    code changes, CD goes a step further by addressing the continuous delivery of
    those into various environments, including production. In other words, CD extends
    the CI pipeline by automating the entire release process, from code commit to
    deployment. While continuous delivery extends the principles of CI to encompass
    the entire software deployment process, it goes beyond more code integration and
    automated testing, introducing additional layers of security measures to address
    vulnerabilities that may be exposed during the deployment pipeline.


    # Key components of continuous delivery


    Some key components of CD have been listed as follows:


    +   * Automation: At the heart of CD is automation. The entire software delivery
    pipeline, from building and testing to deployment, is automated (including incorporation
    of automated security scanning tools). This minimizes human error, speeds up the
    process, identify potential security issues and ensures consistency.

    * Testing: Just like CI, CD emphasizes automated testing. Test suites (including
    security testing) are executed at various stages of the pipeline, and only if
    all tests pass is the code considered for deployment.

    * Environment management: CD involves managing multiple environments, including
    development, testing, staging, and production. Each environment mirrors the production
    environment as closely as possible, reducing the risk of unexpected issues during
    deployment.'
