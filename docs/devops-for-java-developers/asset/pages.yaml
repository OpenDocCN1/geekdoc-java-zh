    # Building and pushing container images


    Deploying applications to containers requires creating the Java application artifacts
    and building container images. Starting with Docker’s appearance in 2013, building
    container images became popular. In Chapter 4, Containerization, we discussed
    that it is critical to understand that installing Docker is not required for creating
    container images or running containers. It is just a popular and convenient tool
    for doing so. In the same way you can package a Java project without using Maven
    or Gradle, you can build a container image without using Docker or a Dockerfile.
    A Dockerfile is a standardized image format comprising the base operating system,
    application artifacts to be added, and required runtime configurations. Essentially,
    this file is the blueprint for how your future container will behave.


    In the context of DevOps methodology, effective communication between application
    developers and infrastructure engineers is crucial. To facilitate this, some find
