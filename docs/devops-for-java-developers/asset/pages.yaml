    # Example 8.2: pom.xml configuration file adding Dekorate


    When you build your application without providing specific configuration, Dekorate
    will generate deployment and service resource manifests in the target/classes/META-INF/decorate
    directory of your project. These generated manifests can be used for deploying
    your application to Kubernetes or OpenShift clusters. This generated Service type
    is ClusterIP and makes the application available only within the Kubernetes cluster.
    However, if you need to make the service accessible externally through a cloud
    provider''s load balancer, you can achieve this by configuring a Service resource
    with the type LoadBalancer.


    When working with Dekorate, you have the flexibility to customize the generation
    of Kubernetes resources using two main approaches:


    +   * Specifying configurations in application.properties: To ensure a clean separation
    between infrastructure and application code, you can specify configuration details
    in the application.properties file. One common customization is setting decorate.kubernetes.serviceType=LoadBalancer.
    This configuration informs Dekorate to generate a Kubernetes Service resource
    of type LoadBalancer, allowing external access to your application.

    * Adding the @KubernetesApplication: Another approach is to annotate your application''s
    main class, typically denoted as the DemoApplication class, with the @KubernetesApplication
    annotation. This annotation serves as a directive to Dekorate, providing instructions
    on generating Kubernetes resources based on your application''s requirements and
    deployment context.


    After configuring your application as needed, you can generate the Kubernetes
    objects by packaging the application using the following Maven'
