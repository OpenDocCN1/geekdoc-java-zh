  md: 'Trunk-based development is a version control management⁸ practice where developers
    merge small, frequent updates to a core “trunk” or main branch. It is a common
    practice among DevOps teams and part of the DevOps lifecycle since it streamlines
    merging and integration phases. In fact, trunk-based development is a required
    practice of CI/CD. Developers can create short-lived branches with a few small
    commits compared to other long-lived feature branching strategies. As codebase
    complexity and team size grow, trunk-based development helps keep releases flowing.


    # Best practices for source control management


    To get the most out of source control management, it is important to follow a
    few best practices:


    +   - Review changes before committing: Always make sure to review the code before
    making commits, especially when you are committing to a shared repository. Typically,
    code reviews are a part of the delivery pipeline before merging code with the
    master branch or a specific repository via a review system or a pull request.
    Code reviews put a second eye on code modifications and help detect any issues
    in the code. It also acts as a quality control mechanism that helps organically
    improve the overall code quality while increasing awareness of each code change.


    +   - Commit often: Every commit is a snapshot of the codebase at a particular
    point in time. Frequent commits allow you to incrementally save completed changes
    to the codebase, which gives you more opportunities to revert to an earlier state
    if a change results in an error.


    +   - Include a detailed commit message: A commit message should be meaningful
    so other developers can get the context of a change done. This can be helpful
    for troubleshooting if any issue arises from particular changes. However, it does
    not mean that users should create lengthy commit messages; instead, they should
    describe the commit in a concise and meaningful manner. A good'
