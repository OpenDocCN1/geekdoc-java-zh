    you might have stored locally. In fact, you can greatly reduce the size of the
    context (and the time it takes to build) by excluding anything the build does
    not require access to:


    # # Ignore these files in my project


    +   pip-logging.txt

    .cache

    *.log

    .git

    .cache


    +   * **Use version control system:**

    Just like any other code, Docker image should be versioned and managed using a
    version control system (VCS) such as git. This makes it easy to track changes,
    collaborate with others, and roll back to previous versions if needed.


    +   * **Keep your images small:**

    One of the biggest advantages of Docker is the ability to create lightweight and
    portable images. To achieve this, it is important to keep your images as small
    as possible by removing unnecessary files, using slim base image, and avoid installing
    unnecessary packages.

    Utilize multistage builds to keep your images small. A multistage build can be
    set up by creating a Dockerfile that uses multiple FROM statements, which begin
    a build stage with a different base image. By using multistage builds, you can
    avoid including build tools or package managers that are not needed in a production
    image.

