    # # Working of Kubernetes


    There is a master node and a number of worker nodes in Kubernetes, and each worker
    node can manage a number of pods. A number of containers arranged in a group to
    form a functional unit are known as pods. Pods can be used to begin designing
    your applications. Once your pods are ready, you can tell the master node which
    one you want to deploy and how many. From this point, Kubernetes is in control.
    The pods are taken and deployed to the worker nodes. If a worker node goes down,
    Kubernetes starts new pods on a functioning worker node. To improve the application
    and increase customer satisfaction, Kubernetes makes it simple to build new features.


    **Master node components:** In Kubernetes, a master node refers to a control plane
    responsible for managing and overseeing the cluster’s operations such as scheduling,
    detecting and responding to cluster events. It acts as the brain of the cluster,
    coordinating and maintaining the desired state of the system. The main components
    of a Kubernetes Master node includes:


    +   - **API server:** The API server serves as the primary interface for cluster
    management. It exposes the Kubernetes API, which allows users and other components
    to interact with the cluster, create and'
  merge: -1
  pgno: 165
- img_proc: true
  md: 'manage resources, and perform operations such as scaling and deployment.


    +   * etcd: etcd is a distributed key-value store used for storing and replicating
    the cluster''s configuration and state data. It provides reliable and consistent
    storage, ensuring the availability and consistency of the cluster''s data. It
    also provides a REST API for CRUD operations.


    +   * Controller-manager: The controller manager consists of various controllers
    that handle different aspects of the cluster''s behaviour. It includes controllers
    for managing replication, endpoints, services, namespaces, and other higher-level
    abstractions. The controller continuously monitor the cluster''s state and work
    to reconcile the desired state with the current state.


    +   * Scheduler: The scheduler is responsible for placing pods onto nodes based
    on resource requirements, affinity rules, and other policies. It examines the
    cluster''s resources and constraints to determine the optimal placement of pods
    for efficient resource utilization.


    Worker node components: In Kubernetes, a worker node, also known as worker or
    a minion, is a component responsible for running the containers and executing
    the task assigned to the cluster. It hosts the actual workload and communicates
    with the master node to receive instructions and report the status of the tasks.
    Node components run on every node, maintain running pods and provide the Kubernetes
    runtime environment. The main components of Kubernetes worker node include:


    +   * kubelet: The kubelet is an agent that runs on each worker node and is responsible
    for managing the containers on that node. It communicates with the master node
    to receive instruction about which containers to run, their configuration, and
    their desired state. The kubelet ensures that the containers are running, monitors
    their health, and reports the status back to master.


    +   * Kube-proxy: The kube-proxy is a network proxy that runs on each worker node.
    It is responsible for routing network traffic to the appropriate containers and
    services within the cluster. Kube-proxy'
