    # # Adjusting resource quotas


    In a shared Kubernetes cluster, multiple users or teams may deploy their applications
    on a fixed number of nodes. To ensure fair resource allocation among different
    applications, cluster administrators use a Kubernetes object called ResourceQuota.
    This object sets constraints that limit resource consumption for a specific namespace
    (a virtual cluster within Kubernetes).


    Resource quotas are typically defined using two primary metrics: CPU and memory.
    When setting up resource quotas, you specify two essential parameters:


    +   - Resource requests: These define the minimum number of resources that a container
    needs to run. Kubernetes ensures that a container is allocated at least the specified
    resources. Requests are used to guarantee that a container has the necessary resources
    to function correctly.


    +   - Resource limits: Limits the maximum number of resources that a container
    can consume. They prevent a container from exceeding its allocated resources,
    which is crucial for maintaining stability within the cluster.


    # # Application configuration level


    Managing resource quotas at the application configuration level involves defining
    resource requirements and limits within the application''s configuration files
    or code. This approach provides fine-grained control over how much resources individual
    components or services within an application can utilize.


    Let us consider an example with a Spring Boot application:


    In your application''s configuration file (for example, application.properties),
    you can define resource requirements and limits for different components of your
    application:'
