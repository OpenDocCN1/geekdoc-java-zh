  md: '# CHAPTER 1

    Lead the Transformation with DevOps


    # Introduction


    In the traditional application development approach, multiple stakeholders and
    departments, including different vendors, are involved in the entire software
    development life cycle (SDLC). Different stages of application development life
    cycle management are as follows:


    +   * Business analysts gather the business requirements.

    * The development team does the application development (this can be outsourced).

    * QA team does the testing (also can be outsourced) to check the functional correctness
    and fitness for the purpose.

    * Performance and stress testing are also performed in required scenarios by suitable
    groups using appropriate tools.

    * Then, the production deployment process, with proper checklist and approvals
    managed by the IT operations teams.

    * Maintenance teams do monitoring and support.'
  merge: -1
  pgno: 27
- img_proc: true
  md: '# Structure


    You can see that each stage of the maturity life cycle, from functionality development
    to maintenance, is managed in silos by independent teams, departments, processes,
    processes, and tools. This approach is often fragmented by frameworks, techniques,
    processes, people, and various tools. It impacts the final product in terms of
    features, quality, cost, schedule, performance, and other organizational overheads,
    such as interfacing and integration between vendors. The maintenance, support
    costs, and skill needs in this method are often overlooked. However, from the
    application development life cycle and business points of view, maintenance and
    support activities are important to evaluate the current system, and if any changes
    are required, then we can estimate it well in advance.


    In this chapter, we will discuss the following topics:


    +   - Understanding DevOps

    - The need for DevOps

    - DevOps and automation

    - DevOps team structure

    - DevOps strategy

    - Benefits of DevOps

    - DevOps process


    # Objectives


    By the end of this chapter, you will gain a thorough understanding of DevOps by
    exploring its key concepts, importance, and practical applications. We will start
    by defining DevOps and discussing why it is essential in modern software development.
    Additionally, we will examine the role of automation in DevOps, highlighting its
    impact on streamlining workflows and improving efficiency.'
  merge: -1
  pgno: 28
- img_proc: true
  md: 'This chapter will also cover the structure of DevOps team, highlighting the
    importance of collaboration and cross-functional roles in driving successful DevOps
    practices. Moreover, we will outline a DevOps strategy, detailing key methods
    for adopting and scaling these practices within organizations. Lastly, we will
    discuss the benefits of DevOps, such as faster delivery, better qualifying, and
    improved collaboration. We will also review the DevOps process, focusing particularly
    on continuous integration and continuous delivery (CI/CD).


    # Understanding DevOps


    Many technical innovations have taken place and challenged the traditional method
    of IT management. The technological advances and changes are quite thoughtful
    and rapid, including multiple fields as agile methodology, DevOps, big data, artificial
    intelligence, data science, and so on. An innovative approach will undoubtedly
    be rewarding and provide maximum value for organizations. By adopting these technologies,
    many organizations and institutions have already gotten on this journey toward
    a more promising future.


    Nowadays, DevOps has taken center stage in the SDLC, and it offers process frameworks,
    including various tools to integrate all the phases of the application life cycle
    and ensure they function as a unified unit.


    It helps in aligning and automating the process across the development phase,
    testing, deployment, and support. It promotes best practices such as code repositories,
    build automation, continuous deployment, and so on.


    The term was introduced in 2007-2009 by Patrick Debois, Gene Kim, and John Willis.
    They projected DevOps as the combination of Development (Dev) and Operations (Ops).
    As per them, bridging the gap between Developers and Operations team members can
    deliver business values to users more quickly and make a company more competitive
    in the market.


    DevOps has received a lot of attention over the last ten years, mainly in business
    enterprises, as most enterprises outsource a lot of their IT work.'
  merge: -1
  pgno: 29
- img_proc: true
