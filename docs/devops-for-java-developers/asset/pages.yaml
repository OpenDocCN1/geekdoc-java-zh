    +   - Be sure you are working on the current version: With multiple developers
    doing frequent code changes, your local copy of the codebase can easily fail behind
    the master copy. Check out the latest codebase before making changes to sure you''re
    working with the most-to-date version.


    +   - Standardize team workflows: Every developer can have their own preferred
    processes on projects. But for SCM tools and procedures to be effective, development
    teams need to establish consistent workflows which creates the foundation for
    a better project.


    +   - Use branches: Branches create separate lines of development to allow developers
    to work in parallel on the same codebase without impacting each other''s work.
    Branch strategy should be defined first and to be used frequently. It''s good
    to create a new branch for every change.


