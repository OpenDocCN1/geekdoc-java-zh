  md: 'The Git branch workflow becomes a must have when you have multiple developers
    working on a particular feature without disturbing the main codebase. The core
    idea is that all feature development should take place in a dedicated branch instead
    of the main branch.


    Imagine two developers working on two different features. Now, if both the developers
    work from the same branch and add commits to them, it would make the codebase
    a huge mess with lot of conflicts. To avoid this, the two developers can create
    two separate branches from the master branch and work on their features individually.
    When they’re done with their feature, they can then merge their respective branch
    to the master branch without having to wait for the other feature to be completed.
    Figure 3.15 is an example of a Feature branching workflow with Master and Feature
    branches. The Feature branch should be short lived to minimize the risk of merge
    conflict.


    ![](img/2823e13452e8ef2b62d2f34747f2d027_141_0.png)


    Figure 3.15: Feature branching workflow


    # Git-flow workflow


    The Git-flow workflow was first published in a highly regarded 2010 blog post⁶
    from since then it has been widely used by organizations that have a scheduled
    release cycle. The Git-flow workflow defines a strict branching model designed
    around the project release. This workflow does not add any new concepts or commands
    beyond what is required for the'
  merge: -1
  pgno: 141
- img_proc: true
  md: 'feature branch workflow. Instead, it assigns very specific roles to different
    branches and defines how and when they should interact.


    In Git-flow, there are two long-lived branches, develop for development integration,
    and master for final releases. Developers create branches from the develop branch
    and work on new features, and integrate that with the develop branch once complete.
    When the develop branch has all the features necessary for a release, a new release
    branch is created out of develop branch. No code that relates to new features
    is added to the release branch, i.e., patches and bugfixes. Once the release branch
    has stabilized and is ready for release, on the master, only hotfixes are applied,
    which are small changes managed on a dedicated branch. These hotfixes also need
    to be applied back to the develop branch, as well as any other concurrent releases
    that need the same fix. Figure 3.16 shows a sample diagram for git-flow:


    ![](img/2823e13452e8ef2b62d2f34747f2d027_142_0.png)


    Figure 3.16: Git-flow workflow


    # Forking workflow


    The forking workflow is fundamentally different than the other workflows discussed
    so far. Instead of using a single server-side repository to act as the'
  merge: -1
