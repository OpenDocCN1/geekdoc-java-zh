    # # Code versioning


    Code versioning is the numbering of different releases of a particular software
    product for both internal use and release. It allows the developers to know when
    changes have been made and track the changes. The changes may include new functions,
    features, or bug fixes. It also enables users to recognize the new releases and
    updated versions.


    Versioning practice makes it easier for developers to keep track of code evolution.
    During development, teams apply internal versioning numbers that can be incremented
    several times within a day. In contrast, the publicly released version usually
    does not change very often.


    # # Semantic versioning


    There are many ways of versioning software products and artifacts. One of the
    most popular schemes is semantic versioning. Semantic Versioning is a 3-component
    number in the format of MAJOR.MINOR.PATCH. While doing the versioning increment:


    +   - MAJOR version when you make incompatible API changes


    +   - MINOR version when you add functionality in a backwards-compatible manner


    +   - PATCH version when you make backwards-compatible bug fixes


    Additional labels for pre-release and build metadata are available as extensions
    to the MAJOR.MINOR.PATCH format. Please check https://semver.org/ for more details
    on semantic versioning.


    # # Best practices for code versioning


    The following are some of the best practices for code versioning:


    +   - Start new projects at version 0.1.0 and increment the minor version for
    each subsequent release.'
