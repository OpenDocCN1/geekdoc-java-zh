  md: '# Quality gate methodology


    In the software development lifecycle, quality gates are predefined checkpoints
    or decision points. These checkpoints are designed to evaluate the quality and
    readiness of deliverables before they move on to the next stage of development
    or deployment. Quality gates are assurance techniques that ensure software meets
    particular standards at various phases of development.


    Once the quality gate is reached, a project can only be proceeded if all criteria,
    or a sufficiently high number of criteria, are met. This ensures that all project
    outputs at the time of the quality gate are good enough to continue working with.
    The outcomes, on the one hand, and the qualitative requirements for the results,
    on the other, can be determined using quality gate criteria. They can then be
    used to define the interfaces between specific project phases. Certain structures,
    actions, responsibilities, documents, and resources are required to establish
    quality gates, and these are summarized in a quality gate reference process.


    # Importance of quality gates


    Quality Gates offers a range of benefits that contribute to the overall success
    of software development efforts. Let us explore why quality gates are so important:


    +   - **Early detection of defects:** Quality gates help detect defects and issues
    early in the development process, reducing the cost and effort required to address
    them.

    - **Risk mitigation:** By assessing and validating the quality of deliverables
    before proceeding, quality gates mitigate the risks associated with deploying
    faulty software.

    - **Continuous improvement:** Quality gates encourage a culture of continuous
    improvement by providing feedback and insights for the development team to enhance
    their processes and practices.'
  merge: -1
  pgno: 307
- img_proc: true
  md: '+   Predictable development cycle: Implementing quality gates ensures a more
    predictable development cycle, with well-defined milestones for progress.


    +   Compliance and standards: Quality gates ensure that software adheres to organizational
    standards and industry best practices, promoting compliance with relevant regulations.


    # Quality gate strategies


    There are two primary ways for using quality gates. When designing a quality gate
    reference process, a company may use any of two methodologies indicated below,
    depending on the objective.


    +   Quality gates as uniform quality guideline: In the first strategy, each project
    must pass through the same quality gates and be evaluated using the same standards.
    A minimal amount (if any) of adaptation of a quality gate reference process that
    follows this strategy is allowed. Every project has a quality standard established
    in order to achieve at least the same level of quality across all of them.


    Therefore, quality gates can be used as a uniform measure of progress. By examining
    which tasks have already passed a particular quality gate and which have not,
    we can compare the progress of different projects. When one project (qualitatively)
    lags behind another, management can easily identify this and take appropriate
    action. Thus, quality gates are a simple tool that can be used for managing multiple
    projects.


    +   Quality gates as a flexible quality strategy: The second strategy allows for
