  md: '# mvn clean package k8s:build


    This command will build the Spring Boot application and create a Docker container
    image with the specified configuration.


    Depending on the technology stack you are using, JKube employs opinionated defaults
    such as base images and manually crafted startup scripts. In this scenario, it
    uses the current local Docker build context for both pulling and pushing container
    images.


    Furthermore, the naming of the image is derived from the combination of Maven
