  md: 'development machine, you get more than just the ability to run containers.
    You will receive an entire container platform that will make building, running,
    and managing containers simple and convenient for developers.


    It is critical to understand that installing Docker is not required for creating
    container images or running containers. It is just a popular and convenient tool
    for doing so. In the same way, you can package a Java project without Maven or
    Gradle, and build a container image without using Docker or a Dockerfile. My advice
    to a developer new to containers is to start with the toolset Docker provides
    and then experiment with other options or methods to get a good feel for a comparison.
    Even if you choose to use other tools instead of or in addition to Docker, a lot
    of time and effort was put into engineering a good developer experience, and this
    alone is worth it.


    With Docker, you can create an isolated environment where a user or application
    can run while sharing the OS and kernel of the host system without interfering
    with the functionality of another isolated environment running on the same system
    (a container).


    Docker lets you do the following:


    +   - Define a container (an image format)

    - Create a container image

    - Manage container images

    - Distribute/distribute container images

    - Establish a container environment;

    - Start/run a container (a container runtime); and

    - Manage the lifecycle of container instances.


    The container landscape contains much more than Docker, but many of the container
    toolset alternatives focus on a subset of these items. Beginning with learning
    how Docker operates is helpful in understanding and evaluating these alternatives.'
