    # # Understanding containers and their usage


    The issue of how to get software to run consistently when moved from one computing
    environment to another is resolved by containers. This might involve moving a
    virtual machine from a physical machine in a data centre to a private or public
    cloud, moving a virtual machine from a staging'
  merge: -1
