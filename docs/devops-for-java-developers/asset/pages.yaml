    # Containerization


    # Introduction


    Currently, the use of containers in production and other environments is expanding
    at an exponential rate. You will hear about their many advantages, including their
    ability to start more quickly, enable better DevOps practices, have a smaller
    footprint than virtual machines, so forth. However, the creation of containers
    was necessary to address a fundamental issue in the IT sector: applications that
    function in one environment but fail in another due to a manual configuration
    error or a failure to install a necessary package or piece of software.


    In a nutshell, a container is a packaging of the application and all other necessary
    components for application to function. A container has its own isolated view
    of the file system and registry while it is running, and this view is separate
    from both the host and other containers as well. Therefore, a container-based
    application will always work the same way. To better understand what a container
