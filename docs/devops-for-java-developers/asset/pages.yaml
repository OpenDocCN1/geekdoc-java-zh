- img_proc: true
  md: 'Figure 4.2: Containers


    # Pros and cons of container


    There are some of the pros of using containers:


    +   - Speed: Since containers are lightweight, you can easily limit their CPU
    usage and memory. They only include high-level software, so they are very fast
    to modify and iterate.


    +   - Excellent for CI/CD: Containers are also excellent for implementing Continuous
    Integration and Continuous Deployment (CI/CD). By sharing and merging images among
    developers, they promote collaborative development.


    +   - Resource efficiency and scalability: Containers share the host OS kernel,
    allowing multiple containers to run on a single machine with minimal overhead
    compared to virtual machines, improving resource utilization. Also, Containers
    are lightweight and can be easily scaled up or down, making them ideal for handling
    fluctuating workloads and Microservices architectures.


    Now, let us discuss some cons of using containers described as follows:


    +   - The host''s kernel limits the use of other operating systems: A container
    uses the host OS''s kernel and is dependent on the host OS. As a result, containers
    can be different from the underlying OS only in terms of dependency and not type.
    The host''s kernel puts limits on using other operating systems.


    +   - Shared exploits: Containers cannot provide the same level of security and
    stability as VMs. They are less isolated than virtual machines because they share
    the host''s kernel. As a result, containers are isolated at the process level,
    and one container may have an impact on other containers by compromising the kernel''s
    stability.


    +   - Other issues: Additionally, after a container completes its task, it shuts
    down and deletes all the data it contained. The data must be saved using Data
    Volumes if you want to stay on the host server. This requires manual configuration
    and provisioning on the host.'
