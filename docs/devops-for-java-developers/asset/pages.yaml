- img_proc: true
  md: 'started in a predictable order and maintain their identity across rescheduling.


    +   - DaemonSets for cluster-wide services: DaemonSets are suitable for running
    a copy of a pod on every node in the cluster. This is useful for cluster-wide
    services like monitoring agents or log collectors. DaemonSets ensure that pods
    are distributed across all nodes.


    +   - Horizontal Pod Autoscaling: Implement Horizontal Pod Autoscaling (HPA) to
    automatically adjust the number of pod replicas based on resource usage metrics
    like CPU and memory. HPA helps your application handle varying workloads efficiently.


    Previously, we created and applied Kubernetes manifests that included a Deployment
