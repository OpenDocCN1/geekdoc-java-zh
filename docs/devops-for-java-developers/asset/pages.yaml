  md: '+   - Start versioning at 1.0.0 if your software is already used in production.
    If you have a stable API on which users have come to depend, you should be 1.0.0.
    If you are worrying about backwards-compatibility, you should already be 1.0.0.


    +   - The initial development phase is represented by MAJOR Version 0. You can
    make as many breaking changes as you want before v1.0.0.


    +   - If you are adding new features without breaking the existing API or functionality,
    increment the MINOR number.


    +   - If you are fixing bugs, increment the PATCH number.


    You can get more information on semantic versioning visit https://semver.org.


