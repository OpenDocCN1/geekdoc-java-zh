    In a typical Canary deployment, a small percentage of users or servers, often
    referred to as "canaries," are chosen to receive the new version of the application.
    The rest of the users or servers continue to use the older, stable version. This
    approach allows for real-world testing of the new code in a controlled environment,
    helping to catch any unexpected issues or bugs before they impact the entire user
    base. Monitoring and observability tools'
