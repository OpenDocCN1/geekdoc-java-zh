    code and runtime code, respectively. These tests help identify and fix vulnerabilities
    before they are deployed to production.


    +   - Infrastructure as code (IaC): In the practice of infrastructure as code,
    infrastructure is provisioned and managed using code. By treating infrastructure
    as code, security configurations can be codified and version-controlled, lowering
    the risk of misconfigurations and fostering consistency across environments.


    +   - Container security: Due to their portability and scalability, containers
    are becoming more and more popular for application deployment. To avoid potential
