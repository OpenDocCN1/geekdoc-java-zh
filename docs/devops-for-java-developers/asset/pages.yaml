  md: '+   - VMware vSphere container


    # # Understanding consistency


    Containers are lightweight software packages that contain all the dependencies
    required to execute the contained software application. Virtualizing the software
    separates the software application from the host. This enables users to create
    multiple workloads on a single OS instance.


    The host operating system''s kernel meets the needs of running an application''s
    different functions, which are separated into containers. Isolated tasks are performed
    in each container. It cannot come in conflict with other applications that are
    running in separate containers or harm the host computer.


    # # Working of containers


    You can make a template of the necessary environment when working inside a container.
    The container essentially runs a snapshot of the system at a specific time, ensuring
    consistency in the behavior of an application.


    All the individual applications running inside the container share the host''s
    kernel. Bins, libraries, and other runtime components are the only elements that
    each container needs.


    Refer to the following figure:


    ![](img/2823e13452e8ef2b62d2f34747f2d027_157_0.png)'
