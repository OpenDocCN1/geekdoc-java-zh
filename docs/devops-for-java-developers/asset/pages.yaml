    # ## Static application security testing


    **SAST** is a testing approach for securing an application by statistically reviewing
    its source code to detect all vulnerability sources, including application vulnerabilities
    and flaws as SQL injection.


    SAST is also known as **white-box** security testing, in which the application''s
    internal components are thoroughly analyzed to identify vulnerabilities. It is
    done at the code level in the early phases of application development before the
    build is completed. It can also be done once the application''s components are
    merged in a testing environment. Furthermore, SAST is used for an application''s
    quality assurance.


    Additionally, it is carried out with SAST tools while focusing on the code of
    an application. These tools scan the app''s code along with all its components
    for potential security flaws. They also help in reducing downtimes and the risk
    of data compromise.


    # ## Understanding how SAST works


    SAST tools work something like this:'
