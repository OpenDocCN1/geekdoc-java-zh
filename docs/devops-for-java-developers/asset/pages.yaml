    Eclipse JCube, when using remote container registries, searches for container
    image credentials in the following locations:


    +   - **Docker configuration**: Eclipse JCube will first look for Docker credentials
    in your Docker configuration. On most systems, Docker credentials are stored in
    a configuration file (for example, ~/.docker/config.json on Linux). These credentials
    are used for authentication when pushing Docker images to a registry.

    - **Kubernetes secret**: If Eclipse JCube does not find Docker credentials in
    the Docker configuration, it will search for a Kubernetes Secret in your active
    Kubernetes context. The secret should be named kube-docker-secret. If found, this
    secret will be used for authentication when pushing images to a registry.

