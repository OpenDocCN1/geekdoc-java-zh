    # Kubernetes deployments


    Understanding how to create and deploy container images is crucial for managing
    containers effectively. When working with distributed systems, Containers play
    a key role in achieving deployment independence and can help insulate your application
    code from potential failures.


    In a distributed system, which often involves multiple Microservices, managing
    containers becomes a central concern. This is where orchestration tools come into
    play, offering a range of capabilities:


    +   - Declarative system configuration


    +   - Container provisioning and discovery


    +   - Monitoring and crash recovery for your system


    +   - Tools for specifying rules and constraints regarding where and how containers
    run.


    One of the leading solutions in this space is Kubernetes, an open-source platform
    designed to automate the deployment, scaling, and management of containerized
    workloads. Kubernetes empowers you to organize your deployments effectively, allowing
    the platform to create or remove instances dynamically based on demand. Additionally,
    it can intelligently replace and reschedule containers in case of node failures.


    Kubernetes has gained widespread popularity due to its features like portability
    and extensibility. This popularity has fostered a vibrant community and strong
    vendor support. The platform''s proven ability to handle increasingly complex
    application categories has also made it a'
  merge: -1
  pgno: 338
- img_proc: true
  md: 'driving force behind enterprise transitions to hybrid cloud and Microservices
    architectures.


    Kubernetes empowers you to configure your application deployments for dynamic
    scalability. It can automatically scale the number of instances of your service
    based on changes in load, reducing instances during low-demand periods and increasing
    them as needed. Additionally, Kubernetes can swiftly replace any failed instances
    with new ones. For developers looking to deploy applications on Kubernetes, access
    to a Kubernetes cluster is essential. A Kubernetes cluster is composed of a set
    of nodes that runs containerized applications, as shown in Figure 8.1:


    ![](img/2823e13452e8ef2b62d2f34747f2d027_339_0.png)


    Figure 8.1: Kubernetes components (as per Kubernetes documentation)


    Every Kubernetes cluster comprises at least one worker node, with each worker
    node hosting Pods. Within a cluster, namespaces serve as a mechanism to partition
    and isolate groups of resources, including Pods. These Pods are integral components
    that directly interact with your running containers, created from container images
    that were previously built and pushed to a container registry.


    When you engage with Kubernetes, you interact with a set of objects that undergo
    validation and acceptance by the system. To work with Kubernetes objects effectively,
    you must use the Kubernetes API. In the modern'
  merge: -1
  pgno: 339
- img_proc: true
  md: 'landscape, there are various tools available to facilitate Kubernetes deployments,
    including visual aids, command-line interfaces, or Java extensions such as Decorate
    and JCube, which assist in generating and deploying Kubernetes manifests.


    # Local setup for deployment


    As a software developer, establishing a productive local development environment
    is a standard practice. This setup entails configuring access to a version control
    system and installing several essential components:


    +   * Java Development Kit (JDK): The JDK is necessary for compiling and running
    Java applications.


    +   * Build tools (Maven or Gradle): These tools assist in managing dependencies
    and building your project.


    +   * Integrated Development Environment (IDE): Popular choices include IntelliJ
    IDEA, Eclipse, or Visual Studio Code, which offer robust coding and debugging
    capabilities.


    +   * Database or middleware (Optional): Depending on project requirements, you
    may integrate a database or middleware to interact with your code.


    +   * Container tools: Tools like Docker, Podman, Buildah, Jib, JCube, or similar
    ones are essential for building, running, and pushing container images when working
    with containerized applications.


    +   * Kubernetes development cluster: For Kubernetes-based projects, a local development
    cluster is crucial. Options include minikube, kind (Kubernetes in Docker), Red
    Hat CodeReady Containers, Docker Desktop, or Ranch Desktop. In cases where local
    clusters consume too many resources, remote Kubernetes clusters or provisioned
    environments like the Developer Sandbox for Red Hat OpenShift can be considered.


    This comprehensive local development environment enables software developers to
    work efficiently on application features while ensuring'
  merge: -1
  pgno: 340
- img_proc: true
  md: 'compatibility and ease of deployment.


    Before creating any Kubernetes resources, let us summarize some Kubernetes concepts:


    +   - **Cluster**: A Kubernetes cluster is a set of machines, called nodes, that
    run containerized applications.


    +   - **Namespace**: Namespaces are used to logically isolate resources within
    a cluster. They help organize and manage applications and resources.


    +   - **User**: Interaction with the Kubernetes API requires a form of authentication
    managed through users.


    +   - **Context**: A specific combination that contains a Kubernetes cluster,
    a user, and a namespace.


    +   - **Kubelet**: The main agent that runs on each cluster node and ensures that
    containers are running and healthy, according to pod specifications.


    +   - **Deployment**: A Deployment is a Kubernetes resource that defines the desired
    state of an application. It manages replica sets and ensures that a specified
    number of Pod replicas are running at all times.


    +   - **ReplicaSet**: Under the hood, deployments use ReplicaSets to maintain
    a set number of replica pods. If a pod fails, the ReplicaSet ensures the desired
    number of replicas is maintained.


    +   - **Service**: Services define a stable endpoint for accessing your application,
    enabling load balancing and network routing to pods. It is a way to expose an
    application having multiple instances in different pods as a network service.


    With these concepts in mind, let us explore how you can generate Kubernetes objects
    and subsequently deploy them.


