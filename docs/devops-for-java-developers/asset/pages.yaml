    # Setting up health checks


    Health checks in Kubernetes are used to determine the state of a container within
    a pod. They help Kubernetes orchestrate the deployment and scaling of applications
    by ensuring that only healthy containers receive traffic and that unhealthy containers
    are automatically restarted or replaced.


    Kubernetes supports three main types of Healthchecks:


    +   - Liveness probe: Determines if a container is running as expected. If the
    liveness probe fails, Kubernetes will restart the container.


    +   - Readiness probe: Checks if a container is ready to serve traffic. Containers
    that fail the readiness probe are temporarily removed from service, allowing the
    application to gracefully handle changes in its state.'
