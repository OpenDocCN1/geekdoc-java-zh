- img_proc: true
  md: 'environment to a production environment, or moving a virtual machine from a
    developer’s laptop to a test environment.


    According to the docker''s creator Solomon Hykes, issues arise when the supporting
    software environment is not the same. Some weird will happen when you test it
    using Python 2.7 and then run it in production using Python 3. Alternately, you
    might rely on the behavior of one SSL library version while installing a different
    one. You''ll run your tests on Debian while using Red Hat for production, and
    strange things will start to happen. He continued, And it''s not just different
    software that can cause issues. The software must run on it, even if the storage
    and security policies are different or the network topology is.


    Simply put, a container is the entirety of a runtime environment, including the
    application’s dependencies, libraries, other binaries, and configuration files
    needed to run it. To remove differences in OS distributions and underlying infrastructure,
    the application platform and its dependencies are containerized.


    A developer’s local laptop, an on-premises data center, or even the cloud can
    be used to build, test, deploy, and redeploy applications using containers.


    Let us understand the key advantages that make containers a cornerstone for agile
    development and efficient application deployment:


    +   - Reduced overhead: As containers do not contain operating system images,
    they consume fewer system resources than conventional or hardware virtual machine
    environments.


    +   - Expanded portability: Applications running in containers can be easily deployed
    to various hardware platforms and operating systems.


    +   - More reliable performance: No matter where they are deployed, DevOps teams
    know that applications running in containers will function the same way.


    +   - Higher effectiveness: Applications can be scaled, patched, or deployed more
    quickly, thanks to containers.'
