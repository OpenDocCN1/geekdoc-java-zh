    automation tools like Apache Maven in early 2000s. Maven, released in 2004, popularized
    the concept of declarative dependency management for Java projects. Before Maven,
    developers had to manually download, configure, and manage dependencies for the
    Java projects. This process involved finding the required libraries, downloading
    them, and resolving any conflicts between different versions of dependencies.


    Maven introduced a standardized way to manage dependencies by utilizing a declarative
    approach. Developers could specify the dependencies project required in a central
    configuration file called pom.xml. POM file contained the project''s metadata,
    including its dependencies, build settings, and other project specific information.


    Since then, other build automation tools like Gradle, which was introduced in
    year 2008, have also gained popularity in the Java ecosystem. Gradle provides
    enhanced dependency management capabilities while offering flexibility and extensibility
    in build configuration. These tools have become integral parts of modern Java
    development, enabling developers to manage dependencies efficiently and streamline
    the build process.


