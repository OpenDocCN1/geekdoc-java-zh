    # ## Vulnerability scoring system


    A vulnerability scoring system is a standardized methodology that assigns scores
    or ratings to security vulnerabilities to help prioritize their remediation. The
    scores are used to categorize vulnerabilities based on their impact and severity,
    allowing security professionals and developers to allocate resources effectively
    and prioritize the most critical challenges.


    Understanding a vulnerability scoring system, like the **Common Vulnerability
    Scoring System (CVSS)**, is essential for prioritizing security measures effectively.
    CVSS provides a standardized way to assess the severity of security vulnerabilities,
    considering factors such as the potential impact on confidentiality, integrity,
    and availability of systems. By comprehending the components and methodology of
    CVSS, organizations can better manage and mitigate security risks within their
    software environments.


    # ## Common vulnerability scoring system


    The CVSS is one of the most widely used and accepted vulnerability scoring systems.
    It was developed by the **National Infrastructure Advisory Council (NIAC)** to
    provide a standardized and impartial way to assess the severity of security vulnerabilities.
    The purpose of CVSS is to categorize security vulnerabilities according to their
    severity in a general way. The identified weaknesses are assessed from various
    points of view.'
