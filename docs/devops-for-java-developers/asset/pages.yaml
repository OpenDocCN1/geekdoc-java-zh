- img_proc: true
  md: '+   Container: The encapsulation of an application and all its required dependencies
    and system resources running within an isolated “space” on a host machine. Containers
    share the host machine’s operating system and kernel, but utilize low-level features
    that allow isolation between processes running inside the container and other
    processes on the same host. Containers enable the portability of an application
    or service between computing environments without the risk of changes in behavior
    because of differing dependency sets.


    +   Container image: A container image is a static file with executable code that
    can create a container on a computing system. A container image is immutable—meaning
    it cannot be changed, and can be deployed consistently in any environment. It
    encompasses all the environment configuration and explicitly defines all the resources
    to which a container will have access after it launched. The image shares the
    operating system kernel of the host, so it does not need to include a full operating
    system.


    +   Base image: A base image is the image that is used to create all container
    images. Commonly used base images can describe a base operating system and/or
    include a specific package or set of dependencies. Your base image can be an official
    Docker image, as Centos, or you can modify an official Docker image to suit your
    needs, or you can create your own base image from scratch.


    An image based on another will specify the image it inherits from, also known
    as a *parent image*, in the first line of the Dockerfile. A parent image is not
    required to be a base image.


    +   Image ID: When an image is built, it is assigned a unique ID in the form of
    a SHA-256 hash calculated from the contents of the image metadata configuration
    file.


    +   Image digest: A unique ID in the form of a SHA-256 hash calculated from the
    contents of an image manifest file.


    +   Image manifest: A JSON file that contains metadata about a container image.
    It contains the image digests of the image metadata configuration file and all
    the image layers.'
  merge: -1
  pgno: 160
- img_proc: true
  md: '+   Image layer: An image is made up of layers. Every layer is a "diff" that
    records the changes that have been made to the image since the previous layer
    was added. When building an image, the platform creates a new layer for each instruction
    in the Dockerfile. The container begins execution with the first instruction in
    the file and proceeds to execute each instruction in order. The initial instruction
    might install packages, while subsequent instructions may copy files or create
    directories.


    Beginning with a base layer, subsequent layers are stacked sequentially, and each
    layer consists of a delta of changes from the previous layer.


    +   Image tag: Using simple labels and aliases, you can describe an image using
    image tags. Tags can be anything that can describe the image, such as the project
    version, an image''s features, or even just your name.


    A tag is unique to an image binary; however, an binary can have multiple tags.
    It assists you in managing the project''s version and enables you to monitor the
    entire development cycle.


    +   Container registry: A container registry is a repository—or collection of
    repositories—used to store and access container images. Often, you may hear the
    terms Docker registry and container registry used interchangeably; however, be
    aware that a container registry might not support all image formats specific to
    both Docker and OCI images.


    +   Image repository (image name): An image repository is a collection of related
    container images with different tags (versions) stored in a container registry.
    It stores all the versions of an image, making them available for distribution.
    The name of an image repository is usually referred to as the image name.


