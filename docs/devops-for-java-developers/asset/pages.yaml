    # Best image building practices


    When it comes to building Docker images, there are some best practices that you
    should keep in mind. Here are a few them:


    +   Use .dockerignore file wherever its required:


    You do not want to have certain things in your production Docker image—things
    like your development environment configuration, keys, your .git directory, or
    other sensitive hidden directories. When you run the command to build a Docker
    image, you provide the context, or the location of files you want to make available
    to the build process.


    Let us see the below example:


    FROM ubuntu


    WORKDIR /mydemo


    COPY . /mydemo


    EXPOSE 8080


    ENTRYPOINT ["start.sh"]


    See the COPY instruction! Depending on what you sent in as the context, this could
    be problematic. It could be copying everything from your working directory into
    the Docker image you build, which will end up in any container launched from this
    image.


    Make sure to use a .dockerignore file to exclude files from the context that you
    do not want showing up unintentionally. You can'
  merge: -1
