    # Continuous integration


    CI is a software development technique that developers frequently integrate their
    work into a project''s main source code repository. Submitting your unique work
    (modified code) to the shared workspace (the potential software solution) is known
    as integration. Technically, this is accomplished by merging your individual work
    (personal branch) with the common work area (Integration branch).


    CI is required to expose integration-related issues as early as possible through
    frequent and regular builds. The fundamental principal of CI is that by frequently
    integrating changes, developers can find bugs early in the process and spend less
    time trying to pin when and where a problem first appeared. The longer a bug goes
    unnoticed, the higher the chance of it becoming deeply entrenched in the surrounding
    codebase.


    From development it is much simpler to find, catch, and fix bugs as soon as they
    are introduced rather than trying to extract them from code layers that have already
    promoted to later stages of the delivery pipeline. Bugs that are not found until
    the latest acceptance phases, and especially those that make it all the way to
    release, result in more money being spent on fixes and less time spent on new
    features. In many cases, it is now necessary to patch existing deployments in
    addition to including and documenting the fix in a new version when fixing a bug
    in production. This inherently cuts down the amount of time the team must work
    on creating new features.


    It is critical to realize that implementing a CI solution does not guarantee bug-free
    software. CI is merely an additional layer of security to remove the most evident
    bugs from a release. It is true that a successful CI solution involves much more
    than just coordinating code contributions to a common repository and adhering
    to a mandate to integrate at predetermined'
  merge: -1
  pgno: 191
- img_proc: true
  md: 'intervals. The components of a comprehensive, workable CI solution that will
    simplify and speed up the software development process are described in the sections
