  md: '# Preface


    With rise of DevOps, cloud platform, and container technologies, the way we build,
    deploy, and secure applications is rapidly changing. DevOps brings together the
    essential practices, philosophies, and tools that streamline software creation
    and making it possible to develop and release the features with pace.


    This book aims to help you in understanding and using the latest DevOps techniques
    in simplifying your build and deployment process using Microservices, serverless,
    and cloud native technologies. It covers a wide range of topics, including the
    principles of DevOps, source code management, CI/CD, containerization, package
    management and DevSecOps, gaining insights into the essential tools that needed
    to build and deploy modern applications. For anyone developing with Spring Boot,
    Micronaut, Quarkus, and more, this book provides a solid foundation.


    As mobile devices are increasing, Mobile DevOps has become essential for the teams
    focused on creating a seamless user experience across platforms. This book dedicates
    a full chapter to Mobile DevOps, exploring its best practices and strategies for
    integrating DevOps into mobile development workflows.


    Throughout the book, you will learn about the key principles, best practices and
    various tools to implement DevOps in your software development tasks. Each chapter
    includes hands-on insights and real-world examples, guiding you through the DevOps
    lifecycle-from building applications to securing and managing the artifacts.


    Whether you''re a software developer looking to streamline your workflow or a
    DevOps professional aiming to build resilient, efficient applications,'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'this book offers the tools and insight you need to succeed. It''s my hope that
    this book will empower you to embrace DevOps, improve your process, and make your
    mark in modern software development.


    # **Chapter 1: Lead the Transformation with DevOps** - provides a thorough understanding
    of DevOps by exploring its key concepts, importance, benefits and practical applications.
    The chapter also explains the role of automation in DevOps, the structure of DevOps
    team and DevOps strategy. Furthermore, the chapter also reviews the DevOps process,
    focus particularly on continuous integration and continuous delivery (CI/CD).


    # **Chapter 2: Slicing the Monolith** - highlights the needs for flexibility,
    scalability and agility in software development and presents a detailed overview
    of shifting from Monolithic architecture to Microservices. The chapter outlines
    the key differences between the two, addressing the challenges of Monolithic systems
    and when Microservices are preferable. You''ll find practical guidance for a smooth
    transition, best practices, and insights on how DevOps supports this shift. The
    chapter also covers frameworks like Spring Boot, Micronaut, and Quarkus, along
    with serverless architecture using AWS Lambda.


    # **Chapter 3: Manage Your Source Code** - covers the basics of source control
    management, its historical evolution, and the shift towards distributed version
    control, particularly focusing on Git. You''ll learn about code versioning best
    practices, how to choose the right source control tool, and the components of
    Git, including creating your first Git pull request. We explore various Git clients
    and workflows, wrapping up with essential best practices for effective source
    control management.


    # **Chapter 4: Containerization** - explores the transformative role of containers
    in application development and management, emphasizing their lightweight and consistent
    nature across various environments. The chapter explains key concept of containers
    , it''s evolution and how it''s distinct from virtual machines. Furthermore, chapter
    also covers Docker architecture and Kubernetes orchestration, with practical guidance
    on'
  merge: -1
  pgno: 9
- img_proc: true
  md: 'setting up Docker and executing basic commands. The chapter also addresses
    essential topics like tagging, versioning, and image layers and best practices
    for building optimized container images.


    # Chapter 5: Continuous Integration – highlights continuous integration (CI) as
    a foundational practice in software development, emphasizing its importance in
    enhancing efficiency and early error detection. The chapter covers CI concepts
    and practices, focusing on declarative build scripts with tools like Ant, Maven,
    and Gradle for streamlined build processes. The chapter also covers continuous
    build processes and their role in supporting agile development, with the essential
    role of test automation to ensure reliability. Furthermore, this chapter discusses
    how to build a robust CI pipeline using Jenkins and strategies to implement and
    maintain effective CI workflows.


    # Chapter 6: Package Management - emphasizes that software artifacts alone aren''t
    enough to ensure quality or competitive advantage—metadata is essential for tracking
    build details, dependency versions, and environments, enhancing the reproducibility
    and stability of build pipelines. The chapter covers dependency resolution basics
    using Java tools like Maven and Gradle, as well as managing dependencies for containers.
    The chapter also provides guidance on publishing Java artifacts to repositories,
    discussing Maven Central as a primary option and alternatives like Sonatype Nexus
    and JFrog Artifactory for internal artifact management. The chapter serves as
    a comprehensive guide to artifact generation, metadata, dependency management,
    and publication best practices.


    # Chapter 7: Protecting Your Binaries - explains the importance of embedding security
    early in the software development process to address rising supply chain threats.
    The chapter covers DevSecOps principles, emphasizing a "shift-left" approach to
    proactively reduce vulnerabilities. The chapter also allows readers to learn essential
    security methodologies like SAST and DAST, as well as tools like SonarQube for
    ongoing security checks to enhance security, minimize risks, and build resilient
    software adaptable to evolving cyber threats.'
  merge: -1
  pgno: 10
- img_proc: true
  md: 'Chapter 8: Deployment Strategies - provides the readers with essential skills
    for deploying applications, particularly in Kubernetes environments. The chapter
    covers planning deployment strategies, building and pushing container images with
    Java tools like Jib and Eclipse JCube, and generating Kubernetes manifests with
    Dek. The chapter also discusses key deployment strategies, including rolling updates,
    blue-green, and canary deployments. The chapter also emphasizes health checks,
    system monitoring, and resource adjustment to maintain performance. Furthermore,
    it explores high availability and multi-cloud strategies to handle complex deployment
    scenarios.


    Chapter 9: Continuous Delivery and Deployment – explains the importance of continuous
    uptime, continuous integration (CI), continuous delivery (CD), and continuous
    deployment in software development. You will get to know the difference between
    continuous delivery and continuous deployment. The chapter also covers key differences,
    best practices, and challenges for continuous delivery and continuous deployment,
    with a Jenkins pipeline example to demonstrate CI/CD in action.


    Chapter 10: Mobile DevOps - is dedicated to the Mobile DevOps, focusing on the
    distinct challenges of Android and iOS. The chapter explains Android’s fragmented
    ecosystem, with thousands of devices from multiple manufacturers and demand of
    a highly automated DevOps pipeline for android and iOS. The chapter also covers
    robust CI/CD pipelines, continuous testing, and UI automation on real devices
    to ensure reliable user experiences. Furthermore the chapter highlights best Mobile
    DevOps practices.'
  merge: -1
