    made to be shown to customer. So, a change requiring just a few hours of development
    time would usually be available for customer feedback on staging after 2 to 3
    days and not acceptable to the customer as it delayed the feedback cycle and launch.


    So, the question is how to deliver quickly without compromising on the quality.


    Let us analyze the possible causes and why DevOps will be needed.


    +   1. **Testing cycles**

    > **Problem statement:** Minimal unit testing was done, and that was restricted
    to the new fix only. There was no sanity unit test cases, which ensured that the
    new fix had not broken an existing functionality. So, after deployment, additional
    issues were raised.

    > **Solution:** Writing automated unit test cases ensures that all related test
    cases can also be run with the new change.

    > **Problem statement:** Due to complex integrations between applications, manually
    running integration and regression testing took the maximum time before functionality
    could be deployed to staging.

    > **Solution:** Regression testing suite to include automated test cases.

    2. **Performance issues**

    > **Problem statement:** Coding guidelines were not being followed properly, and
    manual reviews sometimes missed the code optimization. Which results in issues
    related to response time, application crashes due to memory leaks, and so on.

    > **Solution:** Static analysis and code review tools like, Checkmar and Sonar
    to be used to maintain code consistency and code quality.'
