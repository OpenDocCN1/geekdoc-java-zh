    # Continuous integration in development team


    The software development process always impacts the business. The promises a business
    has made to its customers are impacted by the quality of the code, the design,
    the amount of time spent on development, and the planning of features. Developers
    are supported by CI in assisting businesses. You may have already understood the
    advantages of implementing CI while reading the earlier topics. Let us examine
    some of CI''s advantages:


    +   No more lengthy integrations: You have a better chance of spotting integration
    errors early if you build and integrate every small change you make to your code.
    It is better to integrate frequently and avoid the merge hell than to wait six
    months (as in waterfall model) for integration and spend weeks trying to fix merge
    issues. When you check in your code, a CI tool like Jenkins automatically builds
    and integrates it.


    +   Ready-for-production features: CD enables you to release deployable features
    whenever you want. This is greatly advantageous from a business standpoint. Within
    two to four weeks, the features are designed, implemented, and tested, and they
    are ready to go live with just a click of a button.


    +   Reporting and analysis: How often do the releases occur? What percentage of
    builds are successful? What is the primary factor leading to build failures? Making
    crucial decisions always requires access to real-time data. Recent data is always
    needed for projects in order to support decisions. Managers typically gather this
    data manually, which takes time and effort. Jenkins and other CI tools give you
    the ability to check trends and make choices frequently.


    +   Real-time metrics for code quality and build status: With a CI system, integrations
    happen frequently, making it possible to spot'
  merge: -1
  pgno: 192
- img_proc: true
  md: 'trends in build and overall quality. Jenkins and other CI tools give the team
    member metrics on the build''s health. Since all build, packaging, and deployment
    tasks are automated and monitored by a continuous integration tool, statistics
    about the status of each individual task can be produced. The build failure rate,
    build success rate, number of builds, the build, and other metrics can be included
    in these metrics. Project managers and the team can use all these trends to make
    sure that the project is moving forward at the proper pace and direction. Additionally,
    continuous integration includes static code analysis, which again provides a static
    report of the code quality for every build. Code style, complexity, length, and
    dependency are a few metrics that are very important.


    +   **Rapid problem detection**: Quick issue detection is the primary benefit
    of a carefully designed CI system. Any merge or integration issue is identified
