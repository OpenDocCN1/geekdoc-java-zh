- "# Web 应用开发指南：Ember.js 指南\n\n\n\n![](img/00001.jpeg)\n\n\n\n\n\n## 免责声明\n尽管已尽力核实书中提供的信息，但作者对书中包含的错误、遗漏或对主题内容的相反阐释不承担任何责任。书中提供的信息仅供教育和娱乐之用。读者对其自己的行为负责，作者对使用这些信息而导致的任何实际或感知的责任或损害不承担任何责任。书中使用的商标均未经任何许可，且该商标的发布未获得商标所有者的许可或支持。书中的所有商标和品牌仅用于说明目的，归其所有者所有，与本文档无关。\n\
  \n## 引言\n对 Web 应用的需求日益增长。Ember JS 是一种可以辅助开发此类应用的 JavaScript。该框架易于学习，特别是对于 JavaScript\
  \ 专家而言。然而，即使你完全不熟悉 JavaScript，也不必担心，因为书中的解释对你来说非常容易理解。通过这种 JavaScript，你可以创建具有高度交互用户界面的\
  \ Web 应用，你的用户一定会喜欢你的应用。\n\n## 第 1 章 控制器\n控制器（Controllers）非常类似于组件（components），人们认为未来它们将被组件取代。在大多数当前的应用中，控制器并不经常使用。当使用它们时，它们承担以下职责：\n\
  \n1. 用于根据当前正在使用的路由维护状态。\n2. 当用户操作从组件传递到路由时，它们必须经过控制器。\n\n我们需要通过使用路由来演示这一点，路由将帮助我们显示博客文章。模板将绑定到模板中的以下属性：\n\
  \n```html\n<h1>{{model.title}}</h1>\n<h2>by {{model.author}}</h2>\n<div class=\"\
  intro\">\n  {{model.intro}}\n</div>\n<hr>\n<div class=\"body\">\n  {{model.body}}\n\
  </div>\n```\n\n如上例所示，我们没有特定的属性或需要显示的的操作（actions）。假设我们需要添加一个功能，允许用户在正文部分的显示之间进行切换。为了实现这一点，我们将代码修改为：\n\
  \n```html\n<h1>{{model.title}}</h1>\n<h2>by {{model.author}}</h2>\n<div class='intro'>\n\
  \  {{model.intro}}\n</div>\n<hr>\n{{#if isExpanded}}\n  <button {{action \"toggleBody\"\
  }}>Hide the Body</button>\n  <div class=\"body\">\n    {{model.body}}\n  </div>\n\
  {{else}}\n  <button {{action \"toggleBody\"}}>Show the Body</button>\n{{/if}}\n\
  ```\n\n在控制器的 `actions` 钩子中，我们可以定义操作将做什么，就像我们在组件中做的那样。如下面的代码所示：\n\n```javascript\n\
  export default Ember.Controller.extend({\n  actions: {\n    toggleBody() {\n   \
  \   this.toggleProperty('isExpanded');\n    }\n  }\n});\n```\n\n### 控制器之间的依赖关系管理\n\
  有时，当我们嵌套资源时，我们通常需要在两个控制器之间建立连接。考虑下面的路由：\n\n```javascript\nRouter.map(function()\
  \ {\n  this.route('post', { path: '/p/:post_id' }, function() {\n    this.route('comments',\
  \ { path: '/comments' });\n  });\n});\n```\n\n在访问 URL `/posts/1/comments` 时，模型 `post`\
  \ 将加载到 `PostController` 的模型中。然而，与其相关的某些信息可能会显示在 `comments` 的模板中。为了实现这一点，我们必须将 `pController`\
  \ 注入到我们的 `CommentsController` 中。如下所示：\n\n```javascript\nexport default Ember.Controller.extend({\n\
  \  pController: Ember.inject.controller('post')\n});\n```\n\n我们的注释将能够访问 `PController`，这是一个只读别名，可以用于从控制器读取模型。考虑下面的代码：\n\
  \n```javascript\nexport default Ember.Controller.extend({\n  pController: Ember.inject.controller('post'),\n\
  \  post: Ember.computed.reads('pController.model')\n});\n```\n\n考虑用于 `.hbs` 文件的下一个：\n\
  \n```html\n<h1>Comments for the {{post.title}}</h1>\n<ul>\n  {{#each model as |comment|}}\n\
  \    <li>{{comment.text}}</li>\n  {{/each}}\n</ul>\n```\n\n## 第 2 章 模型\n构建 Web 应用的方法之一是实现与数据获取高度耦合的用户界面组件。考虑一种你正在创建一个博客应用的情况。如果你正在创建应用的管理部分，你可能被迫赋予组件负责获取和存储数据的责任。考虑下面的代码：\n\
  \n```html\n<h1>Comments for {{post.title}}</h1>\n<ul>\n  {{#each model as |comment|}}\n\
  \    <li>{{comment.text}}</li>\n  {{/each}}\n</ul>\n```\n\n模板中包含的草稿列表可以显示。下面的代码演示了这一点：\n\
  \n```html\n<ul>\n  {{#each drafts key=\"id\" as |draft|}}\n    <li>{{draft.title}}</li>\n\
  \  {{/each}}\n</ul>\n```\n\n注意，应用是由许多组件组成的。你可能希望将所有的显示在另一个页面。这可能将旧代码拷贝到新组件：\n\n\
  ```javascript\nexport default Ember.Component.extend({\n  willRender() {\n    $.getJSON('/myDrafts').then(data\
  \ => {\n      this.set('drafts', data);\n    });\n  }\n});\n```\n\n按钮的 `.hbs` 文件如下：\n\
  \n```html\n{{#link-to 'drafts' tagName=\"button\"}}\nDrafts ({{drafts.length}})\n\
  {{/link-to}}\n```\n\n通过上述方法，我们的应用将发出两次请求，但针对相同的信息。在 Ember 数据中，模型的表示是使用子类完成的。通过模型，可以定义服务器将提供我们的数据类型。考虑名为\
  \ `human` 的模型示例：\n\n```javascript\nexport default DS.Model.extend({\n  fName: DS.attr('string'),\n\
  \  birthday: DS.attr('date')\n});\n```\n\n模型还可以描述它自己与其他模型之间的关系。考虑下面的示例，展示了如何这样做：\n\
  \n```javascript\nexport default DS.Model.extend({\n  lItems: DS.hasMany('line-item')\n\
  });\n```\n\n上面的代码用于 `order`。`line.js` 的代码如下：\n\n```javascript\nexport default DS.Model.extend({\n\
  \  order: DS.belongsTo('order')\n});\n```\n\n你必须注意，模型本身没有数据，但它们用于定义属性、关系以及被称为 `records`\
  \ 的特定实例的行为。\n\n### 创建记录\n当你需要创建记录时，只需在 store 上调用 `createRecord()` 方法。考虑下面的代码：\n\n\
  ```javascript\nstore.createRecord('post', {\n  title: 'Ember is a Great Framework',\n\
  \  body: 'Lorem ipsum'\n});\n```\n\n存储的对象将通过 `this.store` 使控制器和路由器可用。\n\n### 更新记录\n\
  你可以通过设置需要更改的属性来更改 Ember JS 数据记录。如下面所示：\n\n```javascript\nthis.store.findRecord('human',\
  \ 1).then(function(myfunction) {\n  // ...一旦记录被加载\n});\n```\n\n\n\n\n\n```javascript\n\
  myfunction.set('fName', \"John\");\n\n});\n```\n\n所有 Ember.js 的便利方法始终可以用于修改属性。可以通过如下所示的方法：\n\
  \n```javascript\nhuman.incrementProperty('age'); // Happy birthday!\n```\n\n###\
  \ 持久化记录\n\n在 Ember JS 中，记录是基于实例进行持久化的。当你对 `DS.Model` 的任何实例调用 `save()` 方法时，将发出一个网络请求。\n\
  \n默认情况下，EmberJS 中新创建的记录会被 POST 到 Ember data 中对应的类型 URL。代码示所示：\n\n```javascript\n\
  var p = store.createRecord('post', {\n  title: 'Ember is Great',\n  body: 'Lorem\
  \ ipsum'\n});\np.save(); // => POST to '/posts'\n```\n\n后端已存在的记录将通过 HTTP `PATCH`\
  \ 动词进行更新。代码如下：\n\n```javascript\nstore.findRecord('post', 1).then(function(p) {\n\
  \  p.get('title'); // => \"Ember JS is Great\"\n  p.set('title', 'New post');\n\
  \  p.save(); // => PATCH to '/posts/1'\n});\n```\n\n考虑以下代码：\n\n```javascript\nhuman.get('isAdmin');\
  \            //=> false\nhuman.get('hasDirtyAttributes'); //=> false\nhuman.set('isAdmin',\
  \ true);\nhuman.get('hasDirtyAttributes'); //=> true\nhuman.changedAttributes();\
  \      //=> { isAdmin: [false, true] }\n```\n\n人们可以通过检查记录属性 `hasDirtyAttributes`\
  \ 来判断待处理记录是否有某些尚未保存的更改。\n\n在上述节点，你可以通过调用 `save()` 方法来保存更改，或者直接将它们回滚。考虑以下代码：\n\n\
  ```javascript\nhuman.get('hasDirtyAttributes'); //=> true\nhuman.changedAttributes();\
  \      //=> { isAdmin: [false, true] }\nhuman.rollbackAttributes();\nhuman.get('hasDirtyAttributes');\
  \ //=> false\nhuman.get('isAdmin');            //=> false\nhuman.changedAttributes();\
  \      //=> {}\n```\n\n### 处理验证错误\n\n如果在尝试保存时后端服务器返回了验证错误，你的模型的 `errors` 属性将包含这些错误。错误可以如下所示显示：\n\
  \n```handlebars\n{{#each p.errors.title as |err|}}\n  <div class=\"error\">{{err.message}}</</div>\n\
  {{/each}}\n{{#each p.errors.body as |err|}}\n  <div class=\"error\">{{err.message}}</</div>\n\
  {{/each}}\n```\n\n### Promises\n\n`save()` 方法将返回一个 promise，这将使我们能够轻松处理成功或失败的情况。考虑下面所示常见模式：\n\
  \n```javascript\nvar p = store.createRecord('post', {\n  title: 'Ember is Great',\n\
  \  body: 'Lorem ipsum'\n});\nvar self = this;\n\nfunction transitionToPost(p) {\n\
  \  self.transitionToRoute('posts.show', p);\n}\n\nfunction failure(reason) {\n \
  \ // 处理错误\n}\n\np.save().then(transitionToPost).catch(failure);\n// => POST to '/posts'\n\
  // => transitioning to posts.show route\n```\n\n### 删除记录\n\n记录的删除可以采用创建记录的方式。可以在\
  \ `DS.Model` 实例上调用 `deleteRecord()` 方法。这会将记录标记为 `isDeleted`。随后应该调用 `save()` 方法来保存记录的删除操作。考虑以下代码：\n\
  \n```javascript\nstore.findRecord('post', 1).then(function(p) {\n  p.deleteRecord();\n\
  \  p.get('isDeleted'); // => true\n  p.save(); // => DELETE to /posts/1\n});\n\n\
  // 或者\nstore.findRecord('post', 2).then(function(post) {\n  p.destroyRecord(); //\
  \ => DELETE to /posts/2\n});\n```\n\n### 关系\n\nEmber 具有几种内置关系，定义了模型之间的相互关系。\n\n\
  ### 一对一\n\n如果你需要在两个模型之间声明这种关系，请使用下面的代码。这里是文件 `myuser.js` 的代码：\n\n```javascript\n\
  export default DS.Model.extend({\n  profile: DS.belongsTo('profile')\n});\n```\n\
  \n那么 `profile.js` 文件应该如下：\n\n```javascript\nexport default DS.Model.extend({\n \
  \ user: DS.belongsTo('myuser')\n});\n```\n\n### 一对多关系\n\n这种关系可以在两个模型之间如下如下声明：考虑以下文件\
  \ `myposts.js` 的代码：\n\n```javascript\nexport default DS.Model.extend({\n  comments:\
  \ DS.hasMany('comment')\n});\n```\n\n这里应该是文件 `ourcomments.js` 的代码：\n\n```javascript\n\
  export default DS.Model.extend({\n  post: DS.belongsTo('p')\n});\n```\n\n### 显式反向\n\
  \nEmber JS 会尽力发现组件之间存在的关系类型。有时，你可能对同类型有多种不同的关系。考虑以下代码：\n\n```javascript\nexport\
  \ default DS.Model.extend({\n  firstPost: DS.belongsTo('post'),\n  secondPost: DS.belongsTo('mypost')\n\
  });\n```\n\n这里是文件 `mypost.js` 的代码：\n\n```javascript\nexport default DS.Model.extend({\n\
  \  comments: DS.hasMany('comment')\n});\n```\n\n### 反映关系\n\n为了定义反向关系，你应该已经有了反向。下面的示例展示了一对一反向关系：\n\
  \n```javascript\nexport default DS.Model.extend({\n  parent: DS.belongsTo('folder',\
  \ { 'children' })\n});\n```\n\n### 创建记录\n\n假设我们有两个模型，`myposts` 和 `comments`。它们的关系如下：\n\
  \n```javascript\nexport default DS.Model.extend({\n  comments: DS.hasMany('comment')\n\
  });\n```\n\n文件 `comment.js` 如下：\n\n```javascript\nexport default DS.Model.extend({\n\
  \  post: DS.belongsTo('post')\n});\n```\n\n### 更新现有记录\n\n有时，我们可能需要为现有记录设置关系。这可以通过使用\
  \ `belongsTo` 关系简单实现。代码如下：\n\n```javascript\nlet p = this.store.peekRecord('post',\
  \ 1);\nlet comm = this.store.peekRecord('comment', 1);\ncomm.set('post', p);\ncomm.save();\n\
  ```\n\n或者，可以将记录推入 `hasMany` 关系以进行更新。如下所示：\n\n```javascript\nlet p = this.store.peekRecord('post',\
  \ 1);\nlet comm = this.store.peekRecord('comment', 1);\np.get('comments').pushObject(comm);\n\
  p.save();\n```\n\n\n\n\n\n要移除一个 \"belongsTo\" 关系，只需将其设置为 `null`。这将将其从 \"hasMany\"\
  \ 关系的一侧移除。考虑下方的代码，它很好地演示了这一点：\n\n```javascript\nlet comm = this.store.peekRecord('comment',\
  \ 1);\ncomm.set('post', null);\ncomm.save();\n```\n\n记录也可以从 \"hasMany\" 关系中移除。考虑下面的代码，它很好地展示了如何实现：\n\
  \n```javascript\nlet p = this.store.peekRecord('post', 1);\nlet comm = this.store.peekRecord('comment',\
  \ 1);\np.get('comments').removeObject(comm);\np.save();\n```\n\n### 关系即承诺（Promises）\n\
  \n每当你处理关系时，最好始终记住这些关系将返回承诺（promises）。假设我们要处理一个文章的异步评论，我们应该等待承诺已完成。考虑下面的代码：\n\n```javascript\n\
  let p = this.store.peekRecord('post', 1);\np.get('comments').then((comments) =>\
  \ {\n  // 我们现在可以处理这些评论了\n});\n```\n\n同样的规则也适用于 \"hasMany\" 关系，如下：\n\n```javascript\n\
  let comm = this.store.peekRecord('comment', 1);\ncomm.get('post').then((p) => {\n\
  \  // 文章在这里是可用的\n});\n```\n\nHandlebars 模板会自动更新，以反映已解析的承诺。如下所示，文章中可以显示评论列表：\n\n\
  ```html\n<ul>\n  {{#each p.comments as |comm|}}\n    <li>{{comm.id}}</li>\n  {{/each}}\n\
  </ul>\n```\n\n### 将记录推入存储器（Pushing Records into Store）\n\n存储器（store）可以被看作是一个缓存，包含了应用加载的所有记录。\n\
  \n若要将记录推入存储器，你只需要调用 `push()` 方法。考虑一种情况：在应用首次启动后，我们需要向存储器中预加载一些数据。这可以使用 `route:application`\
  \ 轻松完成。考虑下面的代码：\n\n```javascript\nexport default DS.Model.extend({\n  title: DS.attr(),\n\
  \  artist: DS.attr(),\n  songCount: DS.attr()\n});\n```\n\n考虑接这段代码：\n\n```javascript\n\
  export default Ember.Route.extend({\n  model() {\n    this.store.push({\n      data:\
  \ [{\n        id: 1,\n        type: 'album',\n        attributes: {\n          title:\
  \ 'Very Few Moving Parts',\n          artist: 'John Joel',\n          songCount:\
  \ 5\n        },\n        relationships: {}\n      }, {\n        id: 2,\n       \
  \ type: 'album',\n        attributes: {\n          title: 'Our God is Great all\
  \ the time',\n          artist: 'Steve John',\n          songCount: 3\n        },\n\
  \        relationships: {}\n      }]\n    });\n  }\n});\n```\n\n如果数据在推入存储器之前需要通过模型的默认序列化器（serializer）进行归一化处理，可以使用\
  \ `story.pushPayload()` 方法。下方的代码所示：\n\n```javascript\nexport default DS.RestSerializer.extend({\n\
  \  normalize(typeHash, hash) {\n    hash['songCount'] = hash['song_count']\n   \
  \ delete hash['song_count']\n    return this._super(typeHash, hash);\n  }\n})\n\
  ```\n\n接下来的代码应该如下所示：\n\n```javascript\nexport default Ember.Route.extend({\n  model()\
  \ {\n    this.store.pushPayload({\n      albums: [\n        {\n          id: 1,\n\
  \          title: 'Very Fever Moving Parts',\n          artist: 'John Joel',\n \
  \         song_count: 5\n        },\n        {\n          id: 2,\n          title:\
  \ 'Our God is Great all the time',\n          artist: 'Steve John',\n          song_count:\
  \ 2\n        }\n      ]\n    });\n  }\n});\n```\n\n在处理复杂的端点（endpoints）时，`push()`\
  \ 方法非常重要。你的应用程序可能有一个端点负责执行某些逻辑并创建多个记录。下面的代码演示了这一点：\n\n```javascript\nexport default\
  \ Ember.Route.extend({\n  actions: {\n    confirm: function(d) {\n      $.ajax({\n\
  \        data: d,\n        method: 'POST',\n        url: 'process-payment'\n   \
  \   }).then((digInventory) => {\n        this.store.pushPayload(digInventory);\n\
  \        this.transitionTo('Thanks');\n      });\n    }\n  }\n});\n```\n\n### 处理元数据（Handling\
  \ Metadata）\n\n除了从存储器返回的记录，还需要处理某些形式的元数据（metadata）。元数据只是伴随特定模型或类型而非记录的数据。\n\n分页是元数据使用的一种常用方式。考虑一个包含许多文章的博客，它们无法一次性显示。可以如下所示进行查询：\n\
  \n```javascript\nlet res = this.store.query('post', {\n  limit: 10,\n  offset: 0\n\
  });\n```\n\n为了获取不同页的数据，可以以 10 为增量更改 `offset`。问题在于知道你有多少页数据。为了获取不同页的数据，`offset` 可以以\
  \ 10 为增量设置。对于服务器来说，它需要返回总记录数作为元数据的一部分。每个序列化器期望元数据的返回方式不同。考虑下面的代码：\n\n```json\n{\n\
  \  \"post\": {\n    \"id\": 1,\n    \"title\": \"Ember is easy to learn for beginners\"\
  ,\n    \"comments\": [\"1\", \"2\"],\n    \"links\": {\n      \"user\": \"/posts/ember\"\
  \n    }\n  },\n  \"meta\": {\n    \"total\": 100\n  }\n}\n```\n\n无论使用哪种序列化器，元数据都会从响应中提取。要读取它，可以使用\
  \ `.get('meta')`。这可以应用于 `store.query()` 调用的结果。代码如下：\n\n```javascript\nstore.query('post').then((res)\
  \ => {\n  let metad = res.get('meta');\n})\n```\n\n如果我们有一个 belongsTo 关系，可以如下所示操作：\n\
  \n```javascript\nlet p = this.store.peekRecord('post', 1);\np.get('author').then((author)\
  \ => {\n  let metad = author.get('meta');\n});\n```\n\n在 hasMany 关系上，可以如下所示操作：\n\
  \n```javascript\nlet p = this.store.peekRecord('post', 1);\np.get('comments').then((comments)\
  \ => {\n  let metad = comments.get('meta');\n});\n```\n\n### 适配器的自定义（Customizations\
  \ of Adapters）\n\n在 Ember Data 中，适配器（Adapter）负责确定数据如何持久化到存储器，例如 RESTful API 的 URL\
  \ 格式和头部。\n\n对于具有某些规则的端点，可以定义 `adapter:application`。这将优默认适配器，但会被特定模型的适配器覆盖。如下方的所示：\n\
  \n```javascript\nexport default DS.JSONAPIAdapter.extend({\n  // 在此处应用特定的配置\n});\n\
  ```\n\n默认情况下，Ember Data 带有多个内置适配器。如果你需要创建自己的自定义适配器，请以这些为起点。\n\n一个好的例子是，当你运行命令 `ember\
  \ generate adapter adapter-name` 时，将创建如下文件：\n\n```javascript\nexport default DS.JSONAPIAdapter.extend({\n\
  \  namespace: 'api/v1'\n});\n```\n\n#### URL 约定（URL Conventions）\n\n`JSONAPIAdapter`\
  \ 适配器在根据模型类型确定通信时使用的 URL 时非常好。考虑下面这个通过 ID 请求文章的示例：\n\n```javascript\nstore.find('post',\
  \ 1).then(function(p) {\n});\n```\n\n#### 复数自定义（Pluralization Customization）\n\n\
  有时，在生成路由 URL 时，你可能需要辅助模型名称的复数处理。可以使用 Ember 反射器来实现此目的。这是一个用于在单数和复数之间转换单词的库。对于不可数或不规则的复数，可以使用\
  \ `Ember.Inflector.inflector()`。如下所示轻松完成：\n\n```javascript\n// 设置 Ember.Inflector\n\
  import './models/custom-inflector-rules';\n```\n\n接下来的代码如下：\n\n```javascript\nimport\
  \ Inflector from 'ember-inflector';\n\nconst inflect = Inflector.inflector;\n\n\
  inflect.irregular('formula', 'formulae');\ninflect.uncountable('advice');\n\n//\
  \ 符合 Ember Inspector 对导出的预期\nexport default {};\n```\n\n\n\n\n\n```javascript\n\
  export default DS.JSONAPIAdapter.extend({\n  namespace: 'api/1'\n});\n```\n\n这就是它的实现方法。\n\
  \n### 主机自定义 (Host Customizations)\n\n适配器默认针对当前域名。如果你需要指定新域名，只需在新适配器上设置 `host` 属性即可。下面的代码最好地展示了如何实现这一点：\n\
  \n```javascript\nexport default DS.JSONAPIAdapter.extend({\n  host: 'https://api.sample.com'\n\
  });\n```\n\n就是这样。\n\n### 路径自定义 (Path Customizations)\n\n可以像下面的代码一样重写 `pathForType`\
  \ 方法：\n\n```javascript\nexport default DS.JSONAPIAdapter.extend({\n  pathForType:\
  \ function(type) {\n    return Ember.String.underscore(type);\n  }\n});\n```\n\n\
  在这种情况下，我们不需要对模型的名称进行复数化，并且我们需要下划线（underscore）而不是驼峰命名（camelCase）。\n\n### 请求头自定义 (Headers\
  \ Customizations)\n\n某些 API 需要 HTTP 请求头，一个很好的例子是需要提供 API key 的时候。可以将任意请求头作为键值对设置在\
  \ `JSONAPIAdapter` 的头头对象上，Ember data 将在我们的每个 Ajax 请求中发送这些内容。考虑下面的代码：\n\n```javascript\n\
  export default DS.JSONAPIAdapter.extend({\n  headers: {\n    'API_KEY': 'secret\
  \ key',\n    'ANOTHER_HEADER': 'A header value'\n  }\n});\n```\n\n人们还可以将 `headers`\
  \ 作为计算属性（computed property）来支持动态请求头。考虑下面的示例，请求头将根据 session 服务通过计算属性生成。以下是该示例的代码：\n\
  \n```javascript\nexport default DS.JSONAPIAdapter.extend({\n  session: Ember.inject.service('session'),\n\
  \  headers: Ember.computed('session.authToken', function() {\n    return {\n   \
  \   'API_KEY': this.get('session.authToken'),\n      'ANOTHER_HEADER': 'A header\
  \ value'\n    };\n  })\n});\n```\n\n在某些情况下，动态请求头需要从 Ember 观察系统之外的对象获取某些数据。`volatile`\
  \ 函数也可以用于将属性设置为非缓存模式，这将导致每次请求都重新计算请求头。下方的代码所示：\n\n```javascript\nexport default\
  \ DS.JSONAPIAdapter.extend({\n  headers: Ember.computed(function() {\n    return\
  \ {\n      'API_KEY': Ember.get(document.cookie.match(/apiKey\\=([^;]*)/), '1'),\n\
  \      'ANOTHER_HEADER': 'A header value'\n    };\n  }).volatile()\n});\n```\n\n\
  ### 编写适配器 (Authoring Adapters)\n\n`defaultSerializer` 属性将用于指定适配器将使用的序列化器（serializer）。这仅在没有指定\
  \ `serializer:application` 或特定模型的适配器时才会使用。在任何应用程序中指定 `serializer:application` 都非常。考虑下面的示例展示了如何实现：\n\
  \n```javascript\nexport default DS.JSONAPIAdapter.extend({\n  defaultSerializer:\
  \ '-default'\n});\n```\n\n### 自定义序列化器 (Customizing Serializers)\n\n在 Ember data\
  \ 中，序列化器用于格式化发送到我们的后端存储以及从后端存储接收的数据。默认设置是 Ember data 将使用 JSON API 格式对数据进行序列化。\n\n\
  #### JSON API 文档\n\n考虑我们请求的如下响应：\n\n```json\n{\n  \"data\": {\n    \"type\": \"\
  people\",\n    \"id\": \"567\",\n    \"attributes\": {\n      \"first-name\": \"\
  John\",\n      \"last-name\": \"Joel\"\n    }\n  }\n}\n```\n\n在上面的示例中，我们得到了一个对 `/people/567`\
  \ 请求的响应。包含多个记录的响应可以在 `data` 属性中有一个数组，如下所示：\n\n```json\n{\n  \"data\": [{\n    {\n\
  \      \"type\": \"people\",\n      \"id\": \"567\",\n      \"attributes\": {\n\
  \        \"first-name\": \"John\",\n        \"last-name\": \"Joel\"\n      }\n \
  \ }, {\n    \"type\": \"people\",\n    \"id\": \"345\",\n    \"attributes\": {\n\
  \        \"first-name\": \"Mercy\",\n        \"last-name\": \"Donald\"\n      }\n\
  \  }]\n}\n```\n\n#### 加载数据 (Sideloaded Data)\n\n这类数据不是主请求的一部分，但具有一些关联关系，这些关系应该添加到\
  \ `included` 键下的数组中。考虑下面的代码：\n\n```json\n{\n  \"data\": {\n    \"type\": \"blogs\"\
  ,\n    \"id\": \"1\",\n    \"attributes\": {\n      \"title\": \"I really like and\
  \ enjoy blogging!\"\n    },\n    \"links\": {\n      \"self\": \"http://mysite.com/blogs/1\"\
  \n    },\n    \"relationships\": {\n      \"comments\": {\n        \"data\": [\n\
  \          { \"type\": \"comments\", \"id\": \"5\" },\n          { \"type\": \"\
  comments\", \"id\": \"12\" }\n        ]\n      }\n    }\n  },\n  \"included\": [{\n\
  \    \"type\": \"comments\",\n    \"id\": \"5\",\n    \"attributes\": {\n      \"\
  body\": \"First!\"\n    },\n    \"links\": {\n      \"self\": \"http://mysite.com/comments/5\"\
  \n    }\n  }, {\n    \"type\": \"comments\",\n    \"id\": \"12\",\n    \"attributes\"\
  : {\n      \"body\": \"Ember is easy to learn\"\n    },\n    \"links\": {\n    \
  \  \"self\": \"http://mysite.com/comments/12\"\n    }\n  }]\n}\n```\n\n在上面的示例中，我们请求了\
  \ `/blogs/1`，服务器给了我们 `included` 数据。\n\n#### 自定义序列化器 (Serializers)\n\n在 Ember data\
  \ 中，默认使用 `JSONSerializer`，但可以使用自定义序列化器。自定义序列化器有两种定义方式。人们可以选择为整个应用程序定义序列化器，也可以为特定模型定义。\n\
  \n数据可以如下更改：\n\n```javascript\nimport DS from 'ember-data';\n\nexport default DS.JSONSerializer.extend({\n\
  \  serialize(snapshot, opts) {\n    var json = this._super(...arguments);\n    json.data.cost\
  \ = {\n      amount: json.data.attributes.amount,\n      currency: json.data.attributes.currency\n\
  \    };\n    delete json.data.attributes.amount;\n    delete json.data.attributes.currency;\n\
  \    return json;\n  },\n});\n```\n\n如果后端存储提供的是 JSON API 以外的格式，可以使用 `normalizeResponse()`\
  \ 钩子。通过上面的示例，服务器向我们提供的数据如下：\n\n```json\n{\n  \"data\": {\n    \"attributes\": {\n\
  \      \"id\": \"1\",\n      \"name\": \"A Product\",\n      \"cost\": {\n     \
  \   \"amount\": 200,\n        \"currency\": \"USD\"\n      }\n    },\n    \"type\"\
  : \"product\"\n  }\n}\n```\n\n上述内容应改为：\n\n```json\n{\n  \"data\": {\n    \"attributes\"\
  : {\n      \"id\": \"1\",\n      \"name\": \"A Product\",\n      \"amount\": 200,\n\
  \      \"currency\": \"USD\"\n    },\n    \"type\": \"product\"\n  }\n}\n```\n\n\
  它应该如下所示处理：\n\n```javascript\nimport DS from 'ember-data';\n\nexport default DS.JSONSerializer.extend({\n\
  \  normalizeResponse(store, primModelClass, payload, id, reqType) {\n    payload.data.attributes.amount\
  \ = payload.data.attributes.cost.amount;\n    payload.data.attributes.currency =\
  \ payload.data.attributes.cost.currency;\n    delete payload.data.attributes.cost;\n\
  \    return this._super(...arguments);\n  },\n});\n```\n\n\n\n\n\n如果你需要跟踪存储（store）中包含唯一记录，Ember\
  \ data 期望负载（payload）中的每个记录都应该有一个唯一的 `id` 属性。对于特定类型的每条记录，`id` 也应该是唯一的。如果后端使用的不是 `id`\
  \ 而是其他键，可以使用序列化器（serializer）的主键属性，以便在数据的序列化和反序列化过程中正确地转换 `id`。下文代码所示：\n\n```javascript\n\
  export default DS.JSONSerializer.extend({\n  primaryKey: '_id'\n});\n```\n\n###\
  \ 属性名称\n\nEmber data 的约定是对特定模型上的属性名称进行驼峰命名法（camelize）。考虑下例示例：\n\n```javascript\n\
  export default DS.Model.extend({\n  fName: DS.attr('string'),\n  lName:  DS.attr('string'),\n\
  \  isPersonOfTheYear: DS.attr('boolean')\n});\n```\n\n`JSONAPISerializer` 期望服务器返回的文档负载中的属性是短横线形式（dasherized）的。下文代码所示：\n\
  \n```json\n{\n  \"data\": {\n    \"id\": \"44\",\n    \"type\": \"people\",\n  \
  \  \"attributes\": {\n      \"first-name\": \"John\",\n      \"last-name\": \"Joel\"\
  ,\n      \"is-person-of-the-year\": true\n    }\n  }\n}\n```\n\n如果服务器返回的属性使用了非常不同的约定，可以使用序列化器的\
  \ `keyForAttribute()` 方法将模型中的属性名转换为 JSON 负载中的键。考虑下文代码：\n\n```javascript\nexport\
  \ default DS.JSONAPISerializer.extend({\n  keyForAttribute: function(attribute)\
  \ {\n    return Ember.String.underscore(attribute);\n  }\n});\n```\n\n可以使用自定义序列化器来映射不规则的键。`attrs`\
  \ 对象可以用于在 `DS` 中不同属性名之间声明简单的映射。考虑下文示例代码：\n\n```javascript\nexport default DS.Model.extend({\n\
  \  lName: DS.attr('string')\n});\n```\n\n我们所做的是为我们的模型创建了一个自定义序列化器，然后重写了 `attrs`\
  \ 属性。接下来的代码如下：\n\n```javascript\nexport default DS.JSONAPISerializer.extend({\n\
  \  attrs: {\n    lName: 'lastNameOfPerson'\n  }\n});\n```\n\n### 关系\n\n`id` 属性应该用于引用其他记录。考虑你的模型具有如下所示的\
  \ `hasMany` 关系的情况：\n\n```javascript\nexport default DS.Model.extend({\n  comments:\
  \ DS.hasMany('comment', { async: true })\n});\n```\n\n此时 JSON 应该将关系编码为类型和 ID 的数组。下文代码所示：\n\
  \n```json\n{\n  \"data\": {\n    \"type\": \"posts\",\n    \"id\": \"1\",\n    \"\
  relationships\": {\n      \"comments\": {\n        \"data\": [\n          { \"type\"\
  : \"comments\", \"id\": \"5\" },\n          { \"type\": \"comments\", \"id\": \"\
  12\" }\n        ]\n      }\n    }\n  }\n}\n```\n\n考虑你有一个如下模型的情况：\n\n```javascript\n\
  export default DS.Model.extend({\n  origPost: DS.belongsTo('post')\n});\n```\n\n\
  那么该关系应该通过 JSON 编码为另一个记录中的一个 ID。下文代码所示：\n\n```json\n{\n  \"data\": {\n    \"type\"\
  : \"comment\",\n    \"id\": \"1\",\n    \"relationships\": {\n      \"original-post\"\
  : {\n        \"data\": { \"type\": \"post\", \"id\": \"5\" },\n      }\n    }\n\
  \  }\n}\n```\n\n如果需要这些命名约定，则可以通过 `keyForRelationship` 方法对其进行重写。下文代码最清楚地说明了这一点：\n\
  \n```javascript\nexport default DS.JSONAPISerializer.extend({\n  keyForRelationship:\
  \ function(key, relship) {\n    return key + 'Ids';\n  }\n});\n```\n\n### 自定义转换的创建\n\
  \n在某些情况下，内置类型（如 `string`、`Boolean` 等）可能不足以让我们实现所需的功能。一个很好的例子是特定服务器给您提供了非标准的日期格式。\n\
  \n在 Ember data 中，我们可能注册新的 JSON 转换以作属性。下文代码最完整地描述了这一点：\n\n```javascript\nexport default\
  \ DS.Transform.extend({\n  serialize: function(val) {\n    return [value.get('a'),\
  \ value.get('b')];\n  },\n  deserialize: function(val) {\n    return Ember.Object.create({\
  \ a: value[0], b: value[1] });\n  }\n});\n```\n\n接下来的代码如下：\n\n```javascript\nexport\
  \ default DS.Model.extend({\n  position: DS.attr('coordinate-point')\n});\n```\n\
  \n在从 API 接收 `coordinatePoint` 后，预期它是一个如下所示的数组：\n\n```json\n{\n  \"cursor\": {\n\
  \    \"position\": [5,9]\n  }\n}\n```\n\n一旦加载到模型实例上，它将如下所示作为一个对象运行：\n\n```javascript\n\
  var c = store.findRecord('cursor', 1);\nc.get('position.x'); // 5\nc.get('position.y');\
  \ // 9\n```\n\n一旦位置被修改并保存，它将通过我们转换中的 `serialize` 函数，并以数组的形式呈现在 JSON 中。要在应用中使用 `JSONSerializer`，必须定义\
  \ `serializer`，它只是 `JSONSerializer` 的扩展。考虑下文代码，它展示了这种做法：\n\n```javascript\nexport\
  \ default DS.JSONSerializer.extend({\n  // ...\n});\n```\n\n在某些请求的情况下，预期的结果应该有一个记录。预期响应应该是类似于下文的\
  \ JSON：\n\n```json\n{\n  \"id\": \"1\",\n  \"title\": \"Ember is easy to Learn\"\
  ,\n  \"tag\": \"rails\",\n  \"comments\": [\"1\", \"2\"]\n}\n```\n\n如果结果返回 0 或更多条记录，预期结果应该是如下所示的\
  \ JSON 数组：\n\n```json\n[\n  {\n    \"id\": \"1\",\n    \"title\": \"Ember is easy\
  \ to Learn\",\n    \"tag\": \"ember\",\n    \"comments\": [\"1\", \"2\"]\n  },\n\
  \  {\n    \"id\": \"2\",\n    \"title\": \"When I was young, I aspired to become\
  \ an athlete!\",\n    \"tag\": \"w3c\",\n    \"comments\": [\"3\"]\n  }\n]\n```\n\
  \n### EmbeddedRecordMixin\n\n在 Ember data 中，我们鼓励对关系进行侧载（sideload），但有时在与旧留 API 工作时，你可能会发现需要处理包含嵌入在记录中的关系的\
  \ JSON。`EmbeddedRecordsMixin` 的创建就是为了解决这个问题。要设置嵌入记录，只需在扩展序列化器的过程中包含该 mixin，然后对嵌入关系进行配置。\n\
  \n考虑模型 `post` 具有如下 `author` 记录的情况：\n\n```json\n{\n  \"id\": \"1\",\n  \"title\"\
  : \"Ember is easy to Learn\",\n  \"tag\": \"ember\",\n  \"authors\": [\n    {\n\
  \      \"id\": \"2\",\n      \"name\": \"Mark\"\n    }\n  ]\n}\n```\n\n此时关系将如下所示定义：\n\
  \n```javascript\nexport default DS.JSONSerializer.extend(EmbeddedRecordsMixin, {\n\
  \  attrs: {\n    authors: {\n      serialize: 'records',\n      deserialize: 'records'\n\
  \    }\n  }\n});\n```\n\n如果你自己定义并需要序列化和反序列化嵌入关系，可以使用快捷选项 `{ embedded: 'always' }`。考虑与下文类似的示例：\n\
  \n```javascript\nexport default DS.JSONSerializer.extend(EmbeddedRecordsMixin, {\n\
  \  attrs: {\n    authors: { embedded: 'always' }\n  }\n});\n```\n\n考虑你希望在提取 JSON\
  \ 负载的过程中读取嵌入记录，但在序列化记录时仅包含关系的 ID。这可以通过使用 `serialize: 'ids'` 选项轻松实现。若要排除关系的序列化，可以使用\
  \ `serialize: false` 选项。下文代码演示了如何操作：\n\n```javascript\nexport default DS.JSONSerializer.extend(EmbeddedRecordsMixin,\
  \ {\n  attrs: {\n    author: {\n      serialize: false,\n      deserialize: 'records'\n\
  \    },\n    comments: {\n      deserialize: 'records',\n      serialize: 'ids'\n\
  \    }\n  }\n});\n```\n\n#### EmbeddedRecordsMixin 默认值\n\n如果你不需要为特定关系重写 `attrs`\
  \ 属性，那么 `EmbeddedRecordsMixin` 的行为如下：\n\n- `BelongsTo: { serialize: 'id', deserialize:\
  \ 'id' }`\n- `HasMany: { serialize: false, deserialize: 'ids' }`\n\n### 编写序列化器\n\
  \n\n\n\n\n对于需要创建自定义序列化器的那些，我们建议从 `JSONAPISerializer` 或 `JSONSerializer` 开始，然后扩展其中之一以匹配我们的需求。然而，如果负载（payload）与其中一个序列化器不同，请考虑你获得了下面的模型“posts”：\n\
  \n```javascript\nexport default DS.Model.extend({\n  title: DS.attr('string'),\n\
  \  tag: DS.attr('string'),\n  comments: hasMany('comment', { async: false }),\n\
  \  relatedPosts: hasMany('blogs')\n});\n```\n\n`store.push` 将将接受一个如下所示的对象：\n\n```json\n\
  {\n  data: {\n    id: \"1\",\n    type: 'post',\n    attributes: {\n      title:\
  \ \"Ember is easy to Learn\",\n      tag: \"ember\",\n    },\n    relationships:\
  \ {\n      comments: {\n        data: [{ id: \"1\", type: 'comment' },\n       \
  \        { id: \"2\", type: 'comment' }],\n      },\n      relatedPosts: {\n   \
  \     data: {\n          related: \"/api/v1/blogs/1/related-posts/\"\n        }\n\
  \      }\n    }\n}\n```\n\n为了让每个序列化的记录都能转换为 Ember data 记录，必须遵循上述格式。\n\n# 第 3 章 应用关注点\n\
  \n## 依赖注入\n\n这种技术在 EmberJS 中用于声明和实例化对象类以及它们之间的依赖关系。应用程序和应用程序实例将在 Ember 的 DI（依赖注入）实现中发挥作用。\n\
  \n## 工厂注册\n\n工厂（Factory）可以用于表示应用的一部分，例如模板、路由或自定义类。这方面一个很好的例子是使用键“template:index”注册的索引模板。\n\
  \n请注意，工厂注册必须在应用程序内部或应用实例初始化器中完成，但前者更为常见。\n\n考虑下例示例，它展示了应用初始化如何使用键名“logger:main”注册一个“logger”工厂：\n\
  \n```javascript\nexport function initialize(app) {\n  var Logger = Ember.Object.extend({\n\
  \    log(n) {\n      console.log(n);\n    }\n  });\n  app.register('logger:main',\
  \ Logger);\n}\n\nexport default {\n  name: 'logger',\n  initialize: initialize\n\
  };\n```\n\n### 注册已实例化的对象\n\n默认设置是 Ember 在查找后会尝试实例化已注册的工厂。在特定类的已实例化对象的注册过程中，你必须使用\
  \ `instantiate: false` 选项，以避免它在查找期间被重复实例化。\n\n在下例示例中，logger 是 JavaScript 中的一个对象，它在查找时应该原样返回。以下是该示例的代码：\n\
  \n```javascript\nexport function initialize(app) {\n  var logger = {\n    log(n)\
  \ {\n      console.log(n);\n    }\n  };\n  app.register('logger:main', logger, {\
  \ instantiate: false });\n}\n\nexport default {\n  name: 'logger',\n  initialize:\
  \ initialize\n};\n```\n\n### 单例与非单例注册\n\n在 Ember data 中，注册被视为单例。这意味着在查找后必须创建一个实例，并且相同的实例将将被缓存并在后续的查找中返回。\n\
  \n在下例示例中，类“message”将被注册为非单例：\n\n```javascript\nexport function initialize(app) {\n\
  \  var Msge = Ember.Object.extend({\n    text: ''\n  });\n  app.register('notification:message',\
  \ Message, { singleton: false });\n}\n\nexport default {\n  name: 'notification',\n\
  \  initialize: initialize\n};\n```\n\n### 工厂注入\n\n一旦完成了工厂注册，我们就可以需要时对其进行注入。工厂的注入可以在具有类型注入的所有工厂类型中进行。考虑下例示例：\n\
  \n```javascript\nexport function initialize(app) {\n  var Logger = Ember.Object.extend({\n\
  \    log(n) {\n      console.log(n);\n    }\n  });\n  app.register('logger:main',\
  \ Logger);\n  app.inject('route', 'logger', 'logger:main');\n}\n\nexport default\
  \ {\n  name: 'logger',\n  initialize: initialize\n};\n```\n\n由于这种类型注入，类型为“route”的工厂将使用已注入的\
  \ logger 进行实例化。logger 的值将从名为“logger:main”的工厂获取。\n\n考虑下例示例，它展示了如何通过注入的 logger 访问应用。以下是示例：\n\
  \n```javascript\nexport default Ember.Route.extend({\n  activate() {\n    // 属性\
  \ logger 被注入到所有路由中\n    this.get('logger').log('Entered your index route!');\n \
  \ }\n});\n```\n\n当使用完整键时，可以在如下所示的完整键上进行注入：\n\n`app.inject('route:index', 'logger',\
  \ 'logger:main');`\n\n### 临时注入 (Ad Hoc)\n\n依赖注入通过使用 `Ember.inject` 直接在 Ember 类上声明。目前，该属性支持服务（services）和控制器（controllers）的注入。\n\
  \n考虑下面的代码，它展示了如何将服务“shopping-cart”作为“cart”注入到组件“cart-contents”中。以下是代码：\n\n```javascript\n\
  export default Ember.Component.extend({\n  cart: Ember.inject.service('shopping-cart')\n\
  });\n```\n\n如果你需要注入一个与属性名称相似的服务，只需省略服务的名称即可。下方的代码演示了这一点：\n\n```javascript\nexport\
  \ default Ember.Component.extend({\n  shoppingCart: Ember.inject.service()\n});\n\
  ```\n\n实例初始化器（Instance initializers）通常接收应用实例作为参数，这为我们提供了查找工厂实例的机会。考虑下面的代码：\n\n```javascript\n\
  export function initialize(appInstance) {\n  let logger = appInstance.lookup('logger:main');\n\
  \  logger.log('Hello from an instance initializer!');\n}\n\nexport default {\n \
  \ name: 'logger',\n  initialize: initialize\n};\n```\n\n我们我们也可能从工厂集中获取应用实例。考虑下例示例，它根据歌曲的“audioType”播放具有不同服务的歌曲。以下是代码：\n\
  \n```javascript\nimport Ember from 'ember';\n\nconst {\n  Component,\n  computed,\n\
  \  getOwner\n} = Ember;\n\n// 使用方法:\n// {{play-audio song=song}}\n\nexport default\
  \ Component.extend({\n  audioService: computed('song.audioType', function() {\n\
  \    let appInstance = getOwner(this);\n    let audioType = this.get('song.audioType');\n\
  \    return appInstance.lookup(`service:${audioType}`);\n  }),\n\n  click() {\n\
  \    let p = this.get('audioService');\n    p.play(this.get('mysong.file'));\n \
  \ }\n});\n```\n\n## 初始化器 (Initializers)\n\n它们为我们在启动过程中配置应用的机会。存在两种类型的初始化器：应用实例初始化器和应用初始化器。\n\
  \n应用初始化器在启动过程中执行，并为我们提供了在应用中配置依赖注入的方法。另一种初始化器在加载应用实例时配置。它们为我们提供了配置应用初始状态以及设置局部于应用实例的应用的方法。\n\
  \n### 应用初始化器 (Application Initializers)\n\n应用初始化器使用 Ember CLI 的初始化生成器创建。\n\n下面的命令描述了这一点：\n\
  \n`ember generate initializer shopping-cart`\n\n然后我们可以自定义 `shopping-cart` 初始化器，将属性\
  \ `cart` 注入到应用中的所有路由中。下面的代码描述了这一点：\n\n```javascript\nexport function initialize(app)\
  \ {\n  app.inject('route', 'cart', 'service:shopping-cart');\n}\n\nexport default\
  \ {\n  name: 'shopping-cart',\n  initialize: initialize\n};\n```\n\n### 应用实例初始化器\
  \ (Application Instance Initializers)\n\n这些可以使用 Ember CLI 的 `instance-initializer`\
  \ 生成器创建。如下所示：\n\n`ember generate instance-initializer logger`\n\n考虑下面的代码，它展示了如何实现简单的日志记录以指示实例已经启动。下方的代码如下：\n\
  \n```javascript\nexport function initialize(appInstance) {\n  var logger = appInstance.lookup('logger:main');\n\
  }\n```\n\n\n\n\n\n```javascript\nlogger.log('Hi from our instance initializer!');\n\
  }\n\nexport default {\n  name: 'logger',\n  initialize: initialize\n};\n```\n\n\
  # 指定初始化器顺序\n\n如果你需要控制初始化器运行的顺序，可以使用 `before` 和 `after` 选项来实现目的。考虑下面的代码：\n\n```javascript\n\
  export function initialize(app) {\n  // ...在此处添加你的代码 ...\n};\n\nexport default {\n\
  \  name: 'configReader',\n  before: 'websocketInit',\n  initialize: initialize\n\
  };\n```\n\n接下来的代码应该如下所示：\n\n```javascript\nexport function initialize(application)\
  \ {\n  // ...在此处添加你的代码...\n};\n\nexport default {\n  name: 'websocketInit',\n  after:\
  \ 'configReader',\n  initialize: initialize\n};\n```\n\n# 服务 (Services)\n\n`Ember.service`\
  \ 属性是 Ember 中的一个对象，可以在应用程序的不同部分使用并可用。以下是服务使用的领域：\n\n* `Geolocation`（地理位置）。\n* `User/session\
  \ authentication`（用户/会话身份验证）。\n* `Web Sockets`（网络 WebSocket）。\n* `Server-backed\
  \ API calls`（无法适应 `Ember Data` 的后端支持 API 调用）。\n* `Third-party APIs`（第三方 API）。\n\
  * `Server-sent events`（服务器发送事件）或通知。\n\n## 服务的定义\n\nEmber CLI 中的 `service` 生成器可用于生成服务。考虑下面的命令，它可以用于创建一个\
  \ `shoppingCart` 服务：\n\n```bash\nember generate service shopping-cart\n```\n\n服务必须扩展基类\
  \ `Ember.Service`。下方的代码所示：\n\n```javascript\nexport default Ember.Service.extend({\n\
  });\n```\n\n就像 Ember 中的对象一样，服务必须经过初始化，并且它应该有自己的方法和属性。考虑下面所示的购物车服务，它最好地演示了这种工作原理：\n\
  \n```javascript\nexport default Ember.Service.extend({\n  items: null,\n  init()\
  \ {\n    this._super(args);\n    this.set('items', []);\n  },\n  add(item) {\n \
  \   this.get('items').pushObject(item);\n  },\n  remove(item) {\n    this.get('items').removeObject(item);\n\
  \  },\n  empty() {\n    this.get('items').setObjects([]);\n  }\n});\n```\n\n# 访问服务\n\
  \n为了访问服务，可以使用函数 `Ember.inject.service` 将其注入到任何由容器解析（container-resolved）的对象中，例如另一个服务或组件。该函数有两种使用方式。你可以选择不带参数调用它，或者将你的服务的注册名称传递给它。\n\
  \n在不传递参数的情况下，服务必须根据其变量键名加载。要在不带参数的情况下加载购物车服务，请按如下所示操作：\n\n```javascript\nexport\
  \ default Ember.Component.extend({\n  // 想在文件 /app/services/shopping-cart.js 中加载服务\n\
  \  shoppingCart: Ember.inject.service()\n});\n```\n\n另一种方法涉及使用服务的名称作为参数。下方的代码所示：\n\
  \n```javascript\nexport default Ember.Component.extend({\n  // 想在文件 /app/services/shopping-cart.js\
  \ 中加载我们的服务\n  cart: Ember.inject.service('shopping-cart')\n});\n```\n\n通过上面的代码，购物车服务将注入到我们的组件中，然后供\
  \ `cart` 属性可用。被注入的属性是懒加载的，这意味着在显式调用该属性之前，不会执行服务的实例化。这意味着必须使用 `get` 函数来访问特定组件的服务，否则你将获得\
  \ undefined 。\n\n加载后，服务将一直持续到服务退出。\n\n考虑下面的代码：\n\n```javascript\nexport default\
  \ Ember.Component.extend({\n  cart: Ember.inject.service('shopping-cart'),\n  actions:\
  \ {\n    remove(item) {\n      this.get('cart').remove(item);\n    }\n  }\n});\n\
  ```\n\n在上面的代码中，我们为组件 `cart-contacts` 添加了 `remove` 动作。一旦被注入到组件中，该服务将在模板中使用。注意下面的代码中使用了\
  \ `cart` 来从购物车中获取数据：\n\n```html\n<ul>\n  {{#each cart.items as |item|}}\n    <li>\n\
  \      {{item.name}}\n      <button {{action \"remove\" item}}>移除</button>\n   \
  \ </li>\n  {{/each}}\n</ul>\n```\n\n# 运行循环 (The Run Loop)\n\n在 Ember 中为我们的应用程序编写的大部分内部机制和代码都发生在运行循环中。运行循环用于批量处理和排序工作，以一种更高效、有效的方式进行。\n\
  \n当我们批量处理相似的工作时，会获得巨大的收益。为了让网络浏览器执行相关的操作，它们必须对 DOM 所所的更改进行批量处理。考虑下面的 HTML 片段：\n\n\
  ```html\n<div id=\"foo\"></div>\n<div id=\"bar\"></div>\n<div id=\"baz\"></div>\n\
  ```\n\n然后你可以运行以下代码：\n\n```javascript\nfoo.style.height = '500px' // 写入\nfoo.offsetHeight\
  \ // 读取\nbar.style.height = '400px' // 写入\nbar.offsetHeight // 读取\nbaz.style.height\
  \ = '200px' // 写入\nbaz.offsetHeight // 读取\n```\n\n在上面的示例中，代码的顺序强制浏览器在每一步之后重新计算样式和布局。然而，如果我们能够将相似的任务合并在一起，那么浏览器只需要重新计算一次样式和布局。下方的代码所示：\n\
  \n```javascript\nfoo.style.height = '500px' // 写入\nbar.style.height = '400px' //\
  \ 写入\nbaz.style.height = '200px' // 写入\nfoo.offsetHeight // 读取\nbar.offsetHeight\
  \ // 读取\nbaz.offsetHeight // 读取\n```\n\n这种做法的好处在于它适用于许多其他类型的工作。当我们批量处理相似的工作时，我们发现很容易进行流水线处理并进一步优化。\n\
  \n考虑下面的示例，它在 Ember 中经过了优化：\n\n```javascript\nvar MyUser = Ember.Object.extend({\n\
  \  fName: null,\n  lName: null,\n  fullName: Ember.computed('fName', 'lName', function()\
  \ {\n    return `${this.get('fName')} ${this.get('lName')}`;\n  })\n});\n```\n\n\
  # 结论\n\n我们已经到达本指南的结论。Ember 是目前使用的 JavaScript 框架之一。该框架主要用于我们需要开发 Web 应用程序客户端时使用。\n\
  \n\n\n\n\n该框架具有许多我们可以利用的特性来增强我们的应用程序。\n\n在 Ember JS 中，控制器（controllers）非常重要，大多数人会将它们与组件（components）混淆。人们认为，控制器很快将被组件取代。控制器的目的是控制状态，而这取决于当前使用的路由类型。在将信息从组件传递到路由时，也会使用控制器，因为信息必须通过它进行传递。此外，控制器之间需要建立依赖关系。\n\
  \n当我们需要嵌套资源时，通常就是如此。我们必须想出一种机制来在控制器之间建立连接。了解如何在 Ember JS 中创建自定义转换（custom transformations）对你很有帮助。这是因为现有的数据类型可能不足以满足你的需求，Ember\
  \ JS 中的自定义转换可以在这方面为你提供帮助。\n\n我希望这本书能够帮助你理解如何在 Ember JS 中构建应用程序。祝使用得愉快！\n"
