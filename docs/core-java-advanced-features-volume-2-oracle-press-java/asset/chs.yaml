  \n**图 9.7** 选择单元格范围\n\n#### 9.1.3.6 排序排序\n\n\n\n正如我们在第一个表格示例中所看到的，只需通过调用 `setAutoCreateRowSorter`\
  \ 方法即可轻松地为 `JTable` 添加行排序。然而，为了对排序行为进行更细粒度的控制，可以向 `JTable` 安装一个 `TableRowSorter<M>`\
  \ 对象并对其进行定制化。类型参数 `M` 表示表格模型；它需要是 `TableModel` 接口的子类型。\n\n![images](img/img_p597-2.png)\n\
  \n某些列不应该是可排序的，例如我们行星数据中的图像列。通过调用以下方法关闭排序：\n\n![images](img/img_p597-3.png)\n\n你可以为每一列安装自定义的比较器。在我们的示例中，我们将通过优先考虑蓝色和绿色红色来对\
