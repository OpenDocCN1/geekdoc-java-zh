  \n    产生一个将满足 `predicate` 的元素传递给下游收集的收集器。\n\n### 1.12 还原操作\n\n`reduce` 方法是从流中计算值的通用机制。最简单的形式接受一个二元函数并不断应用它，从两个元素开始。如果函数是求和，这很容易解释：\n\
  \n![images](img/img_p63.png)\n\n在这种情况下，`reduce` 方法计算 `v[0] + v[1] + v[2] + . . .`，其中\
  \ `v[i]` 是流元素。它返回一个 `Optional`，因为如果流为空则没有结果。\n\n### 注意\n![images](img/note.png)\n\
  \n在这种情况下，你可以用 `reduce(Integer::sum)` 代替 `reduce((x, y) -> x + y)`。\n\n更通用地可以使用任何将部分结果\
  \ `x` 与下一个值 `y` 结合以产生新部分结果的操作。\n\n看待还原的另一种方式。给定一个还原操作 `op`，还原产生 `v[0] op v[1] op\
  \ v[2] op . . .`，其中 `v[i] op [*i* + 1]` 表示调用函数 `op(v[i], v[*i* + 1])`。有很多实用的操作——例如和、乘积、字符串拼接、最大值和最小值、集合并集或交。\n\
  \n如果你想在并行流中使用还原，该操作必须是**结合律**的：组合元素的顺序不应该是重要的。在数学符号中，`(x op y) op z` 必须等于 `x op\
  \ (y op z)`。一个非结合律的操作示例是减法。例如，(6 – 3) – 2 ≠ 6 – (3 – 2)。\n\n通常存在一个**单位元 e**，使得 `e\
  \ op x = x`，该元素可以作为计算的起点。例如，0 是加法的单位元，你可以使用 `reduce` 的第二种形式：\n\n![images](img/img_p64-1.png)\n\
  \n如果流为空，则返回单位元值，你不再需要处理 `Optional` 类。\n\n\n\n\n\n现在假设你有一个对象流，并想要对某些属性求和，例如字符串流中的长度。你不能使用简单形式的\
  \ `reduce`。它需要一个函数 `(T, T) -> T`，其参数和结果的类型必须相同，但在这种情况下，你有两种类型：流的元素类型为 `String` 类型，而累加结果是\
  \ `integer` 类型。`reduce` 有这样一种形式可以处理这种情况。\n\n首先，你提供一个“累加器”函数 `(total, word) -> total\
  \ + word.length()`。该函数会被反复调用，形成累积总和。但当计算被并行化时，会出现多个此类计算，你能够合并它们的结果。你为此这个目的提供了第二个函数。完整的调用方式如下：\n\
  \n``````\n![images](img/img_p64-2.png)\n```\n\n#### 注意\n![images](img/note.png)\n\
  \n在实践中，你可能不会频繁使用 `reduce` 方法。通常将流映射（map）为数字流并使用它的任一个方法来计算和、最大值或最小值会更简单。（我们将在第 1.13\
  \ 节“原始类型流”（位于第 43 页中讨论数字流。）在这个特定的示例中，你可以调用 `words.mapToInt(String::length).sum()`，这既简单又高效，因为它不涉及装箱（boxing）。\n\
  \n#### 注意\n![images](img/note.png)\n\n有些时候 `reduce` 并不足够通用。例如，假设你想将结果收集到一个 `BitSet`\
  \ 中。如果该集合是并行化的，你不能直接将元素放入单个 `BitSet` 中，因为 `BitSet` 对象不是线程安全的。由于这个原因，你不能使用 `reduce`。每个段都需要从它自己的空集合开始，而\
  \ `reduce` 只允许你提供一个恒等值（identity value）。相反，请使用 `collect` 的三参数形式。它的参数是：\n\n1. 一个 `supplier`，用于构造目标对象的新实例\n\
  2. 一个 `accumulator`，将元素添加到目标中\n3. 一个 `combiner`，将两个目标对象合并为一个\n\n以下是 `collect` 方法处理位集时的工作原理：\n\
  \n``````\n![images](img/img_p65.png)\n```\n\n#### `java.util.Stream` 8\n\n* `Optional<T>\
  \ reduce(BinaryOperator<T> accumulator)`\n* `T reduce(T identity, BinaryOperator<T>\
  \ accumulator)`\n* `<U> U reduce(U identity, BiFunction<U,? super T,U> accumulator,\
  \ BinaryOperator<U> combiner)`\n  使用给定的累加函数形成流元素的累积总和。如果提供了 `identity`，则它就是第一个要要累加的值。如果提供了\
  \ `combiner`，则可以用于合并单独累加的各个段的总和。\n* `<R> R collect(Supplier<R> supplier, BiConsumer<R,?\
  \ super T> accumulator, BiConsumer<R,R> combiner)`\n  将元素收集到类型为 `R` 的结果中。在每个段上，调用\
  \ `supplier` 来提供初始结果，调用 `accumulator` 以可变方式向其添加元素，调用 `combiner` 来合并两个结果。\n\n###\
