  \n#### 3.4.1 执行 SQL 语句\n\n要执行 SQL 语句，你首先创建一个 `Statement` 对象。要创建语句对象，使用从调用 `getConnection`\
  \ 获取的 `Connection` 对象。\n\n![images](img/img_p198-1.png)\n\n接下来，将你想执行的语句放入字符串中，例如：\n\
  \n![images](img/img_p198-2.png)\n\n然后，调用 `Statement` 接口的 `executeUpdate` 方法：\n\n\
  ![images](img/img_p198-3.png)\n\n`executeUpdate` 方法返回受 SQL 语句影响的行数，对于不返回行数的语句返回\
  \ 0。例如，前一个示例中的 `executeUpdate` 调用返回了价格降低 5 美元的行数。\n\n`executeUpdate` 方法可以执行 `INSERT`、`UPDATE`\
  \ 和 `DELETE` 等操作，以及 `CREATE TABLE` 和 `DROP TABLE` 等数据定义语句。然而，你需要使用 `executeQuery`\
  \ 方法来执行 `SELECT` 查询。还有一个通用的 `execute` 语句可用于执行任意 SQL 语句。它通常仅用于用户交互式提供的查询。\n\n当你执行查询时，你感兴趣的是结果。`executeQuery`\
  \ 返回一个 `ResultSet` 类型的对象，你可以使用它逐行遍历结果。\n\n![images](img/img_p198-4.png)\n\n分析结果集的基本循环如下：\n\
  \n![images](img/img_p198-5.png)\n\n\n\n\n\n#### ![images](img/caution.png) 注意事项\n\
  \n`ResultSet` 接口的迭代协议与 `java.util.Iterator` 接口略有不同。在这里，迭代器被初始化在第一行*之前*的位置。你必须调用一次\
  \ `next` 方法才能将迭代器移动到第一行。此外，它没有 `hasNext` 方法；请持续调用 `next` 直到它返回 `false`。\n\n结果集中行的排列顺序完全是随机的。除非你特意地使用\
  \ `ORDER BY` 子句对结果进行了排序，否则你不应该对行的顺序赋予任何特殊含义。\n\n在检查单独一行时，你可能想要知道字段的内容。大量的访问器方法可以提供这些信息。\n\
  \n![images](img/img_p199.png)\n\n有针对各种类型的访问器，例如 `getString` 和 `getDouble`。每个访问器都有两种形式：一种接收一个数字参数，另一种接收一个字符串参数。当你提供数字参数时，你通过该数字来引用列。例如，`rs.getString(1)`\
  \ 返回当前行第一列的值。\n\n#### ![images](img/caution.png) 注意事项\n\n与数组索引不同，数据库列号从 1 开始。\n\n\
  当你提供字符串参数时，你通过该名称引用结果集中的对应列。例如，`rs.getDouble(\"Price\")` 返回标签为 `Price` 的列的值。使用数字参数效率稍高，但字符串参数使代码更易读、易维护。\n\
  \n当方法的类型与列的类型不匹配时，每个 `get` 方法都会进行合理的类型转换。例如，调用 `rs.getString(\"Price\")` 会将 `Price`\
  \ 列的浮点值转换为字符串。\n\n### java.sql.Connection 1.1\n\n*   `Statement createStatement()`\n\
  \    创建一个 `Statement` 对象，可用于执行无参数的 SQL 查询和更新。\n*   `void close()`\n    立即关闭当前连接及其创建的\
  \ JDBC 资源。\n\n### java.sql.Statement 1.1\n\n*   `ResultSet executeQuery(String sqlQuery)`\n\
  \    执行字符串提供的 SQL 语句，并返回一个 `ResultSet` 对象以查看查询结果。\n*   `int executeUpdate(String\
  \ sqlStatement)`\n*   `long executeLargeUpdate(String sqlStatement)` **8**\n   \
  \ 执行字符串指定的 SQL `INSERT`、`UPDATE` 或 `DELETE` 语句。还会执行数据定义语言（DDL）语句，如 `CREATE TABLE`。返回受影响的行数，对于没有更新计数的语句返回\
  \ 0。\n*   `boolean execute(String sqlStatement)`\n    执行字符串指定的 SQL 语句。可能会产生多个结果集和更新计数。如果第一个结果是结果集则返回\
  \ `true`，否则返回 `false`。调用 `getResultSet` 或 `getUpdateCount` 获取第一个结果。有关处理多个结果的详情，请参第\
  \ 197 页的第 3.5.4 节“多个结果”。\n*   `ResultSet getResultSet()`\n    返回上一个查询语句的结果集，如果没有结果集则返回\
  \ `null`。每个执行语句只调用一次此方法。\n*   `int getUpdateCount()`\n*   `long getLargeUpdateCount()`\
  \ **8**\n    返回上一个更新语句受影响的行数，如果上一个语句是不带更新计数的语句则返回 -1。每个执行语句只调用一次此方法。\n*   `void\
  \ close()`\n    关闭此语句对象及其关联的结果集。\n*   `boolean isClosed()` **6**\n    如果此语句已关闭则返回\
  \ `true`。\n*   `void closeOnCompletion()` **7**\n    导致该语句在所有结果集关闭后自动关闭。\n\n###\
  \ java.sql.ResultSet 1.1\n\n*   `boolean next()`\n    使结果集中的当前行向前移动一个。在最后一行之后返回\
  \ `false`。注意，你必须调用此方法才能移动第一行。\n*   `Xxx get*Xxx(int columnNumber)`\n*   `Xxx get*Xxx(String\
  \ columnLabel)`\n    (*Xxx* 是一种如 `int`、`double`、`String`、`Date` 等类型）\n*   `<T> T\
  \ getObject(int columnIndex, Class<T> type)` **7**\n*   `<T> T getObject(String\
  \ columnLabel, Class<T> type)` **7**\n*   `void updateObject(int columnIndex, Object\
  \ x, SQLType targetSqlType)` **8**\n*   `void updateObject(String columnLabel, Object\
  \ x, SQLType targetSqlType)` **8**\n    根据指定的列索引或标签返回或更新列的值，并转换为指定的类型。列标签是 SQL `AS`\
  \ 子句中指定的标签，如果未使用 `AS` 则为列名。\n*   `int findColumn(String columnName)`\n    给出与列名关联的列索引。\n\
  *   `void close()`\n    立即关闭当前结果集。\n*   `boolean isClosed()` **6**\n    如果此语句已关闭则返回\
  \ `true`。\n\n#### 3.4.2 管理连接、语句和结果集\n\n每个 `Connection` 对象都可以创建一个或多个 `Statement`\
  \ 对象。你可以对同一个 `Statement` 对象执行多个互不相关的命令和查询。然而，一个语句*最多有一个*开启的结果集。如果你发布了多个并并发分析其结果的查询，则需要多个\
  \ `Statement` 对象。\n\n但请预警，每个连接的语句数量有限的。使用 `DatabaseMetaData` 接口的 `getMaxStatements`\
  \ 方法可以找到驱动支持的并发语句数量。\n\n在实践中，你不应该纠结多个结果集。如果结果集是相关的，你应该能够执行合并查询。让数据库合并查询比让 Java 程序遍历多个结果集要高效得多。\n\
  \n当你完成 `ResultSet`、`Statement` 或 `Connection` 时，立即调用 `close` 方法是个好主意。这些对象使用了数据库服务器有限资源。`Statement`\
  \ 的 `close` 方法会关闭关联的结果集。同样，`Connection` 类的 `close` 方法会关闭所有语句。\n\n相反，你可以在 `Statement`\
  \ 上调用 `closeOnCompletion` 方法，它会在所有结果集关闭后自动关闭。\n\n如果你的连接很短，不必担心关闭语句和结果集。为了确保连接对象不可能保持开启，请使用\
  \ try-with-resources 语句：\n\n![images](img/img_p201.png)\n\n#### 3.4.3 分析 SQL 异常\n\
  \n每个 `SQLException` 都有 `SQLException` 对象链可以通过 `getNextException` 方法获取。此异常链是在每个异常拥有的\
  \ `Throwable` 原因链之外。（有关异常的的详情第一卷第 6 章。）要列出所有异常需要两个嵌套循环。幸运的是，`SQLException` 类已增强并实现了\
  \ `Iterable<Throwable>` 接口。`iterator()` 方法产生一个遍历这两个链的 `Iterator<Throwable>`：它首先遍历第一个\
  \ `SQLException` 的原因链，然后移动下一个 `SQLException`，依此类推。你可以简单地使用增强 for 循环：\n\n![images](img/img_p202-2.png)\n\
  \n你可以在 `SQLException` 上调用 `getSQLState` 和 `getErrorCode` 来进一步分析。第一个方法返回一个由 X/Open\
  \ 或 SQL:2003 标准的字符串（调用 `DatabaseMetaData` 接口的 `getSQLStateType` 方法可以找到驱动使用的是哪个标准。）错误代码是厂商特定的。\n\
  \nSQL 异常组织成一个继承树（见图 3.5）。这允许你以独立于厂商的方式捕捉特定的错误类型。\n\n![images](img/img_p203-1.png)\n\
  \n**图 3.5** SQL 异常类型\n\n\n\n\n\n此外，数据库驱动程序可以将非致命条件报告为警告。你可以从连接、语句和结果集中检索这些警告。`SQLWarning`\
  \ 类是 `SQLException` 的子类（尽管 `SQLWarning` 不会作为异常抛出）。调用 `getSQLState` 和 `getErrorCode`\
  \ 可以获取有关警告的更多信息。与 SQL 异常类似，警告也是链状的。要检索所有警告，请使用此循环：\n\n![images](img/img_p203-2.png)\n\
  \n当从数据库读取的数据被意外截断时，会使用 `SQLWarning` 的子类 `DataTruncation`。如果在更新语句中发生数据截断，则会抛出一个 `DataTruncation`\
  \ 异常。\n\n### `java.sql.SQLException` 1.1\n\n* `SQLException getNextException()`\n\
  \    获取与此异常链出的下一个 SQL 异常，在链的末尾返回 `null`。\n* `Iterator<Throwable> iterator()` 6\n\
  \    获取一个迭代器，用于产生链中的 SQL 异常及其产生原因。\n* `String getSQLState()`\n    获取“SQL 状态”——一个标准化的错误代码。\n\
  * `int getErrorCode()`\n    获取特定厂商的错误代码。\n\n### `java.sql.SQLWarning` 1.1\n\n* `SQLWarning\
  \ getNextWarning()`\n    返回与此警告链出的下一个警告，在链的末尾返回 `null`。\n\n### `java.sql.Connection`\
  \ 1.1\n\n### `java.sql.Statement` 1.1\n\n### `java.sql.ResultSet` 1.1\n\n* `SQLWarning\
  \ getWarnings()`\n    返回第一个待处理的警告，如果没有待处理的警告则返回 `null`。\n\n### `java.sql.DataTruncation`\
  \ 1.1\n\n* `boolean getParameter()`\n    如果数据截断适用于参数，则返回 `true`；如果适用于列，则返回 `false`。\n\
  * `int getIndex()`\n    返回被截断参数或列的索引。\n* `int getDataSize()`\n    返回应该传输的字节数，如果值未知则返回\
  \ `-1`。\n* `int getTransferSize()`\n    返回实际传输的字节数，如果值未知则返回 `-1`。\n\n#### 3.4.4\
  \ 填充数据库\n\n我们现在已经准备好编写第一个真正的 JDBC 程序了。当然，如果能尝试之前讨论过的某些花哨查询就好了，但我们面临一个问题：目前数据库中没有数据。我们需要填充数据库，一种简单的方法是使用一组\
