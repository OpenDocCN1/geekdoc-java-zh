  \ getAttributeName(int index)`\n*   `String getAttributeLocalName(int index)`\n\
  *   `String getAttributeValue(int index)`\n    如果当前事件是 START_ELEMENT，获取属性数量以及属性名称和值。\n\
  *   `String getAttributeValue(String namespaceURI, String name)`\n如果当前事件是 START_ELEMENT，获取具有给定名称的属性值。如果\
  \ `namespaceURI` 为 null，则不检查命名空间。\n\n\n\n\n你现在已经知道如何编写读取 XML 的 Java 程序了。现在让我们转向反向过程：生成\
  \ XML 输出。当然，你可以简单地通过编写一系列 `print` 调用、打印元素、属性和文本内容来写一个 XML 文件，但这并不是一个好主意。这种代码相当繁琐，而且如果你不注意属性值和文本内容中的特殊符号（如\
  \ `\"` 或 `<`），很容易就会出错。\n\n更好的方法是使用文档内容构建一个 DOM 树，然后将树的内容写出来。接下来的章节将讨论相关细节。\n\n####\
  \ 4.8.1 不带命名空间的文档\n\n要构建 DOM 树，你从一个空文档开始。通过调用 `DocumentBuilder` 类的 `newDocument`\
