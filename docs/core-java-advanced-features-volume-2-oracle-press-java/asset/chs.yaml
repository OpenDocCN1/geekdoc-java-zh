  \ Java 代码来遍历多个结果集。但数据库执行查询代码的能力*远好于*Java 程序——这是数据库的核心竞争力。一条准则是：如果可以用 SQL 完成，就不要在\
  \ Java 中完成。\n\n*   `changePrices` 方法执行一个 `UPDATE` 语句。注意 `UPDATE` 语句的 `WHERE` 子句需要出版者的*代码*，而我们只知道出版者的*名称*。这个问题通过嵌套子查询解决：![images](img/img_p211-2.png)\n\
