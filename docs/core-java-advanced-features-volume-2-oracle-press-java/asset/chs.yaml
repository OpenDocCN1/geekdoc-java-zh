  \n**图 9.20** 带有根句柄的树\n\n相反，你可以完全隐藏根节点。这将会显示一个*森林*——一组树，每棵树都有自己的根节点。你仍然必须将森林中的所有树连接到一个公共根节点；然后，使用以下指令隐藏根节点：\n\
