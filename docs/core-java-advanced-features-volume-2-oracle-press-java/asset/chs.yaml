  *   `closePath()`\n    通过从当前点到路径第一个点的直线关闭路径。\n\n#### 9.3.3 Areas\n\n前面的节中，你看到了如何通过构造由线和曲线构成的通用路径来指定复杂形状。有时，通过组合*区域*（如矩形、多边形或椭圆）来描述形状会更容易。Java\
  \ 2D API 支持四种*构造区域几何*操作，可以将两个区域合并为一个新区域：\n\n*   `add`：合并后的区域包含第一个区域或第二个区域中的点。\n\
  *   `subtract`：合并后的区域包含第一个区域中不在第二个区域中的点。\n*   `intersect`：合并后的区域包含第一个区域和第二个区域中的点。\n\
  *   `exclusiveOr`：合并后的区域包含第一个区域或第二个区域中的点，但不同于两者。\n\n图 9.40 显示了这些操作。\n\n要构造复杂的区域，从一个默认区域对象开始。\n\
  \n![images](img/img_p684-1.png)\n\n然后，将区域与任意形状组合。\n\n![images](img/img_p684-2.png)\n\
  \n\n\n\n\n`Area` 类实现了 `Shape` 接口。你可以使用 `draw` 方法描画区域的边界，或者使用 `Graphics2D` 类的 `fill`\
  \ 方法填充其内部。\n\n![images](img/img_p684-3.png)\n\n**图 9.40** 构造性区域几何操作\n\n### java.awt.geom.Area\
  \ 1.2\n\n*   `void add(Area other)`\n*   `void subtract(Area other)`\n*   `void\
  \ intersect(Area other)`\n*   `void exclusiveOr(Area other)`\n    执行此区域与另一个区域的构造性几何操作，并将此区域设置为结果。\n\
  \n#### 9.3.4 Strokes\n\n`Graphics2D` 类的 `draw` 操作使用当前选定的 `stroke` 来绘制形状边界。默认情况下，线条是宽度为\
  \ 1 像素的实线。通过调用 `setStroke` 方法并提供实现 `Stroke` 接口的类来选择不同的线条。Java 2D API 只定义了这样一个类，称为\
  \ `BasicStroke`。在本节中，我们将查看 `BasicStroke` 类的功能。\n\n你可以构造任意厚度的线条。例如，这里是绘制宽度为 10 像素线条的方法：\n\
  \n![images](img/img_p685-1.png)\n\n当线条厚度大于一个像素时，线条的 `end` 可以有不同的样式。图 9.41 显示了这些端样式。你有三种选择：\n\
  \n*   `butt cap`（平端）直接在末端点结束线条。\n*   `round cap`（圆端）在线条末端添加一个半圆。\n*   `square cap`（方端）在线条末端添加一个半矩形。\n\
  \n![images](img/img_p685.png)\n\n**图 9.41** 端样式\n\n当两条粗线相遇时，`join style` 有三种选择（见图\
  \ 9.42）：\n\n*   `bevel join`（斜接）用两条线条角平分线的直线连接线条。\n*   `round join`（圆接）使每条线条具有圆角。\n\
  *   `miter join`（尖接）通过添加“尖角”来扩展两条线条。\n\n![images](img/img_p686.png)\n\n**图 9.42**\
  \ 接样式\n\n如果两条线以很小的角度通过 `miter join` 会合，则使用 `bevel join` 以防止过长的尖角。`miter limit` 控制这种转换。技术上，这是尖角的内外角距离与线条宽之比。默认的\
  \ `miter limit` 对应约 11 度的角度。你可以在 `BasicStroke` 构造函数中指定这些选择，例如：\n\n![images](img/img_p686.png)\n\
  \n最后，你可以通过设置 `dash pattern` 创建虚线。在代码 9.16 程序中，你可以选择拼出摩斯密码 SOS 的线条模式。`dash pattern`\
  \ 是一个 `float[]` 数组，包含了“开启”和“关闭”间隔的长度（见图 9.43）。\n\n在构造 `BasicStroke` 时可以指定 `dash\
  \ pattern` 和 `dash phase`。`dash phase` 指明线条在线条模式中的起始位置。通常，你将此值设置为 0。\n\n![images](img/img_p687-1.png)![images](img/img_p687-2.png)\n\
