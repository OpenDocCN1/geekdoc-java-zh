  \ 中编写网络客户端和服务器，以及如何从 Web 服务器采集信息。下一章将涵盖数据库连接性。你将学习如何在 Java 中使用 `JDBC API` 与关系型数据库交互。\n\
  \n## 8.6 安全简介\n\n当 Java 技术首次出现时，人们兴奋的并不是由于一种精良的编程语言，而是安全执行通过 Internet 传输的 applet（小程序）的可能性。显然，只有当接收者能够确定代码不会对他们的机器造成破坏时，提供可执行\
  \ applet 才是实用的。因此，安全一直是 Java 技术设计者和用户关注的焦点。这意味着与其他语言和系统不同（安全不是作为事后考虑或对入侵的反应实现的），安全机制是\
  \ Java 技术不可或缺的一部分。\n\n安全架构由三部分组成：\n\n1. 语言和虚拟机设计特性（数组边界检查、无未检查的类型转换、无指针算术等）。\n2.\
  \ 一个 `security manager`（安全管理器），它控制代码可以做什么（文件访问、网络访问等）。\n3. 代码签名，代码作者可以使用标准的加密算法对\
  \ Java 代码进行身份验证。然后，代码的用户可以准确判断是谁创建了这些代码，并确保代码在签名后没有被更改过。\n\n第一部分取得了巨大的成功。C++ 程序通常容易受到缓冲区溢出等攻击，但\
  \ Java 提供了强大的保护。遗憾的是，另外两个部分并没有那么好。`security manager` 非常复杂，且具有很大的攻击面。它从 Java 17 开始被弃用。随着\
  \ applet 和 Java Web Start 的消灭，代码签名架构也实际上被放弃了——这两种都是安全交付客户端应用程序的机制。\n\n在本书的之前的版本中，`security\
  \ manager` 和代码签名是本章的亮点，但显然这种覆盖的需求已经消失了。我们将首先讨论在类文件加载到虚拟机时检查其完整性的 `class loaders`。然后你将学习用于许多安全操作的框架和加密算法。\n\
  \n## 8.7 类加载器\n\nJava 编译器将源代码转换为虚拟机的代码。虚拟机代码存储在以 `.class` 扩展的类文件中。每个类文件包含类的定义和实现代码。在接下来的节中，你将看到如何加载这些内容。\n\
  \n#### 8.7.1 类加载过程\n\n虚拟机只加载执行所需的类文件。例如，假设从 MyProgram 开始：\n\n1. 虚拟机有一种加载类文件的机制——例如从磁盘读取或从\
  \ Web 请求；它使用该机制加载 `MyProgram` 类文件。\n2. 如果 `MyProgram` 类有字段或超类，它们的类文件也会被加载。（加载给定类所依赖的所有类的过程被称为“解析”。）\n\
  3. 虚拟机随后执行 `main` 方法（它是静态的，因此创建类的实例）。\n4. 如果 `main` 方法或其调用的方法需要额外的类，则这些类将被加载。\n\n\
  \n\n\n\n在 Java 9 之前，“扩展类加载器”会从 `/jre/lib/ext` 目录加载“标准扩展”，而“背书标准覆盖”机制提供了一种用新版本覆盖某些平台类（包括\
  \ CORBA 和 XML 实现）的方法。这两种机制已被移除。\n\n## 8.7.2 类加载器的层级结构\n\n类加载器之间存在 `父/子` 关系。除了启动类加载器（bootstrap\
  \ class loader）之外，每个类加载器都有父类加载器。类加载器会给父加载器机会去加载任何给类，只有当父加载器失败时，它才会加载该类。例如，当系统类加载器被要求加载系统类（例如\
  \ `java.lang.StringBuilder`）时，它首先询问平台类加载器。该类加载器首先询问启动类加载器。启动类加载器找到并加载了该类，因此其他类加载器都不会再继续搜索。\n\
  \n某些程序具有插件架构，代码某些部分被封装为可选插件。如果插件被封装为 JAR 文件，你可以简单地使用 `URLClassLoader` 实例来加载插件类。\n\
  \n![images](img/img_p528-1.png)\n\n由于 `URLClassLoader` 构造函数中没有指定父类，因此 `pluginLoader`\
  \ 的父类是系统类加载器。图 8.11 显示了该层级结构。\n\n![images](img/img_p528-2.png)\n\n**图 8.10** 类加载器层级结构\n\
  \n### ![images](img/caution.png) 注意\n\n在 Java 9 之前，系统类加载器是 `URLClassLoader` 的实例。某些程序员使用强制转换来访问\
  \ `getURLs` 方法，或者通过反射调用受保护的 `addURLs` 方法将 JAR 文件添加到类路径中。这现在不再可行。\n\n大多数时候，你不需要担心类加载器的层级结构。通常，类的加载是因为它们被其他类需要，而这个过程对你来说是透明的。\n\
  \n然而，有时你需要干预并指定一个类加载器。考虑这个示例：\n\n* 你的应用程序代码包含一个调用 `Class.forName(classNameString)`\
  \ 的辅助方法。\n* 该方法是从插件类中被调用的。\n* `classNameString` 指定了一个包含在插件 JAR 中的类。\n\n插件的作者希望加载该类。然而，辅助方法的类是由系统类加载器加载的，而\
  \ `Class.forName` 使用的正是那个类加载器。插件 JAR 中的类是不可见的。这种现象被称为 `类加载器反转`。\n\n为了解决这个问题，辅助方法需要使用正确的类加载器。它可以将类加载器作为参数传递。或者，它可以要求将正确的类加载器设置为当前线程的`上下文类加载器`（context\
  \ class loader）。许多框架（如 JAXP 和 JNDI）使用了这种策略。\n\n每个线程都有一个类加载器的引用，称为上下文类加载器。主线程的上下文类加载器是系统类加载器。当创建一个新线程时，它的上下文类加载器被设置为创建线程的上下文类加载器。因此，如果你什么都不做，所有线程的上下文类加载器都将设置为系统类加载器。\n\
  \n然而，你可以通过调用来设置任何类加载器：\n\n![images](img/img_p529-1.png)\n\n随后辅助方法可以获取上下文类加载器：\n\n\
  ![images](img/img_p529-2.png)\n\n### ![images](img/tip.png) 提示\n\n如果你写了一个按名称加载类的方法，为调用者提供传递显式类加载器和使用上下文类加载器的选择是一个好主意。不要简单地使用方法所在类的加载器。\n\
  \n## 8.7.3 使用类加载器作为命名空间\n\n每个 Java 程序员都知道包名用于消除命名冲突。标准库中有两个名为 `Date` 的类，但它们的真实名称显然是\
  \ `java.util.Date` 和 `java.sql.Date`。简单名只是为了方便程序员，并且包含适当的 import 语句。在运行程序中，所有类名都包含它们的包名。\n\
  \n![images](img/img_p530.png)\n\n**图 8.11** 两个类加载器加载不同的类\n\n然而，可能会让你的是，你可以在同一个虚拟机中拥有两个具有相同`类和包`名称的类。类是由其全名*以及*类加载器决定的。这种技术对于从多个源加载代码有用。例如，应用程序服务器为每个应用程序使用单独类加载器。这允许虚拟机分离来自不同应用程序的类，无论它们被命名为什么什么。图\
  \ 8.11 显示了一个示例。假设应用程序服务器加载了两个不同的应用程序，每个程序都有名为 `Util` 的类。由于每个类都由单独的类加载器加载，这些类是完全不同的，并且彼此不冲突。\n\
  \n## 8.7.4 编写自己的类加载器\n\n你可以为特殊目的编写自己的类加载器。这允许你在通过将字节码传递给虚拟机之前执行自定义检查。例如，你的类加载器可能拒绝加载未标记为“已付费”的类。\n\
  \n要编写自己的类加载器，只需扩展 `ClassLoader` 类并重写方法\n\n![images](img/img_p531.png)\n\n`ClassLoader`\
  \ 父类的 `loadClass` 方法负责委托给父类，并且仅在类尚未被加载且父类加载器无法加载该类时，才调用 `findClass`。\n\n你对该方法的实现必须执行以下操作：\n\
  \n1. 从文件系统或其他源加载该类的字节码。\n2. 调用 `ClassLoader` 父类的 `defineClass` 方法将字节码呈现给虚拟机。\n\n\
  在代码清单 8.10 中，我们实现了一个加载加密类文件的类加载器。程序向用户询问要加载的第一个类（即包含 main 方法的类）以及解密密钥。然后它使用特殊的类加载器来加载指定的类并调用\
  \ main 方法。该类加载器解密指定的类以及其引用的所有非系统类（见图 8.12）。\n\n为了简单起见，我们忽略密码学领域 2000 年的进步，并使用古老的凯撒密码来加密类文件。\n\
  \n![images](img/img_p532.png)\n\n**图 8.12** ClassLoaderTest 程序\n\n### ![images](img/note.png)\
  \ 注意\n\nDavid Kahn 的精彩著作《密码破译》（Macmillan, 1967, p. 84）提到苏提乌斯是凯撒密码的历史来源。凯撒将罗马字母表中的\
  \ 24 个字母移动了 3 个字母，这在当时困扰了他的对手们。\n\n当本章首次撰写时，美国政府限制强加密方法的出口。因此，我在示例使用了凯撒方法，因为它在出口显然是合法的。\n\
  \n我们版本的凯撒密码使用一个 1 到 255 之间的数字作为密钥。要解密，只需将该密钥加到每个字节上并对 256 取模即可。代码清单 8.11 中的 `Caesar.java`\
  \ 程序执行了加密。\n\n为了不混淆普通类加载器，我们为加密的类文件使用不同的扩展名 `.caesar`。\n\n\n\n\n加密类文件有许多实际用途（当然，前提是你使用了比凯撒密码更强的加密方法）。没有解密密钥，类文件就一用无处。它们既无法被标准虚拟机执行，也无法被轻易反汇。\n\
  \n这意味着你可以使用自定义类加载器来对类的用户进行身份验证，或者在允许程序运行之前确保其已经支付费用。当然，加密只是自定义类加载器的应用之一。你还可以使用其他类型的类加载器来解决其他问题——例如，将类文件存储在数据库中。\n\
