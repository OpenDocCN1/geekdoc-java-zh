  \ `type`——我们并不一定想将其用于所有 `Integer` 类型的对象。相反，我们需要将其安装到特定的列中：\n\n![images](img/img_p612-4.png)\n\
  \n### 9.1.4.4 自定义编辑器\n\n再次运行示例程序并点击颜色。弹出一个颜色选择器，允许为行星选择新颜色。选择一种颜色并点击 OK。单元格颜色被更新了（参见\
  \ 图 9.10）。\n\n![images](img/img_p613.png)\n\n**图 9.10** 使用颜色选择器编辑单元格颜色\n\n颜色单元格编辑器不是标准的表格单元格编辑器，而是自定义的。要创建自定义单元格编辑器，需要实现\
  \ `TableCellEditor` 接口。该接口有点繁琐，因此提供了一个 `AbstractCellEditor` 类来处理事件处理的细节。\n\n`TableCellEditor`\
  \ 接口的 `getTableCellEditorComponent` 方法请求一个组件来渲染单元格。它与 `TableCellRenderer` 接口的 `getTableCellRendererComponent`\
  \ 方法完全相同，除了没有焦点参数外。当单元格正在编辑时，假设它拥有焦点。在编辑过程中，编辑器组件会临时替换渲染器。在我们的示例中，我们返回了一个没有颜色的空白面板。这向用户指示单元格正在被编辑。\n\
  \n接下来，你希望在用户点击单元格时弹出你的编辑器。\n\n`JTable` 类会带有一个事件（例如鼠标点击）调用你的编辑器，以确定该事件是否可以启动编辑过程。`AbstractCellEditor`\
  \ 类定义了接受所有事件的方法。\n\n![images](img/img_p614-1.png)\n\n然而，如果你重写此方法并返回 false，那么将将不会费力插入编辑器组件。\n\
  \n一旦安装了编辑器组件，就会调用 `shouldSelectCell` 方法，通常带有同一个事件。你应该在这个方法中启动编辑——例如，通过弹出一个外部编辑对话框。\n\
  \n![images](img/img_p614-2.png)\n\n如果用户取消了编辑，表格会调用 `cancelCellEditing` 方法。如果用户点击了另一个表格单元格，表格会调用\
  \ `stopCellEditing` 方法。在两种情况下，你都应该隐藏对话框。当你的 `stopCellEditing` 方法被调用时，表格想要使用部分编辑的值。如果当前值是有效的，你应该返回\
  \ true。在颜色选择器中，任何值都是有效的。但如果你编辑其他数据，你可以确保只从编辑器中获取有效数据。\n\n此外，你还应该调用处理事件触发的父类方法——否则编辑将无法被正确取消。\n\
  \n![images](img/img_p614-3.png)\n\n最后，你需要一个方法来产生用户在编辑过程中提供的值：\n\n![images](img/img_p615-1.png)\n\
  \n总结一下，你的自定义编辑器应该执行以下操作：\n\n1. 扩展 `AbstractCellEditor` 类并实现 `TableCellEditor` 接口。\n\
  2. 定义 `getTableCellEditorComponent` 方法以提供组件。这可以是占位组件（如果你弹出对话框），也可以是用于编辑的组件，如组合框或文本字段。\n\
  3. 定义 `shouldSelectCell`、`stopCellEditing` 和 `cancelCellEditing` 方法来处理编辑的开始、完成和取消。`stopCellEditing`\
  \ 和 `cancelCellEditing` 方法应该调用父类方法以通知监听器。\n4. 定义 `getCellEditorValue` 方法返回编辑过程的结果。\n\
  \n最后，通过调用 `stopCellEditing` 和 `cancelCellEditing` 方法指示用户已完成编辑。在构造颜色对话框时，我们安装了触发这些事件的回调。\n\
  \n![images](img/img_p615-2.png)\n\n这就是自定义编辑器的实现。\n\n你现在已经知道如何让单元格可编辑以及如何安装编辑器。还有一个剩余的问题——如何用用户编辑的值更新模型。编辑完成后，`JTable`\
