  ```\n\n### 8.4.3 HttpResponse 接口和 Body 处理器\n\n发送请求时，你必须告诉客户端如何处理响应。如果你只需要将正文作为字符串，可以使用\
  \ `HttpResponse.BodyHandlers.ofString()` 发送请求，如下：\n\n```![images](img/img_p514-4.png)\n\
  ```\n\n`HttpResponse` 是一个泛型接口，其类型参数表示响应正文的类型。你可以简单地通过以下方式获取响应正文字符串：\n\n```![images](img/img_p515-1.png)\n\
  ```\n\n还有其他响应正文处理器可以将响应获取为字节数组或输入流。`BodyHandlers.ofFile(filePath)` 产生一个将响应保存到给定文件的处理器，`BodyHandlers.ofFileDownload(directoryPath)`\
  \ 则使用 `Content-Disposition` 标头中的文件名将响应保存到给定目录中。最后，从 `BodyHandlers.discarding()`\
