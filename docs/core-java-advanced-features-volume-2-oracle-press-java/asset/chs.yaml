  \ **1.4**\n    返回写入 BLOB 的输出流。\n\n#### java.sql.Clob 1.4\n\n*   `long length()`\n\
  \    获取 CLOB 的字符数。\n*   `String getSubString(long startPosition, int length)`\n\
