  \ `locale` 的 `setDefault` 方法来更改默认 Java 区域。某些操作系统允许用户为显示消息和格式化指定不同的区域。例如，居住在美国的法语语者可以拥有法语菜单，但货币值使用美元。要获取这些偏好，请调用：\n\
