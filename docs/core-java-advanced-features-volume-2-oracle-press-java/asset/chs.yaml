  \ `env` 指针。`env` 指针指向一个函数表（见图 11.2）。因此，你必须在每次 JNI 调用前加上 `(*env)` 以解引用函数指针。此外，`env`\
  \ 是每个 JNI 函数的第一个参数。\n\n#### ![images](img/c-plus-note.png) C++ 注意事项\n\n在 C++ 中访问\
  \ JNI 函数更简单。`JNIEnv` 的 C++ 版本具有内联成员函数，可以为你处理函数查找。例如，你可以这样调用 `NewStringUTF`：\n\n\
