  \ createWebRowSet()`\n    创建指定类型的行集。\n\n## 3.8 元数据 (Metadata)\n\n在前面的章节中，你学习了如何填充、查询和更新数据库表。然而，JDBC\
  \ 可以提供关于数据库及其表的*结构*的额外信息。例如，你可以获取特定数据库的表列表，或者表的列名和类型。当你实现一个具有预定义数据库的业务应用时，这些信息并没有用。毕竟，如果你设计了表，你自然知道它们的结构。但是，对于编写适用于任何数据库的工具的程序员来说，结构信息是非常用的。\n\
  \n\n\n\n在 SQL 中，描述数据库或其部分的数据被称为 `metadata`（元数据，以将其与存储在数据库中的实际数据区分来）。你可以获取三种元数据：关于数据库的、关于结果集的以及关于准备语句参数的元数据。\n\
  \n要了解更多关于数据库的信息，可以从数据库连接请求一个类型为 `DatabaseMetaData`的对象。\n\n![images](img/img_p233-1.png)\n\
  \n现在你准备好获取一些元数据了。例如，调用\n\n![images](img/img_p233-2.png)\n\n返回一个包含数据库中所有表信息的结果集。（该方法的其他参数请参见本节末尾的\
  \ API 说明。）\n\n结果集中的每行都包含数据库中某张表的信息。第三列是表名。（再次，请查看 API 说明查看其他列。）以下循环收集了所有的表名：\n\n\
  ![images](img/img_p233-3.png)\n\n数据库元数据的第二个重要用途。数据库是复杂的，SQL 标准为变体留下了很大的空间。`DatabaseMetaData`\
  \ 接口中有一百多个方法可以查询数据库，包括带有诸如奇特名称的调用，\n\n![images](img/img_p233-4.png)\n\n以及\n\n![images](img/img_p233-5.png)\n\
  \n显然，这些是针对具有特殊需求的高级用户的——特别是那些需要编写可在多个数据库运行的高移植性代码的用户。\n\n`DatabaseMetaData` 接口提供有关数据库的数据。第二个元数据接口\
  \ `ResultSetMetaData` 报告有关结果集的信息。当你获得查询结果集时，可以查询列数以及每列的名称、类型和字段宽度。这是一个典型的循环：\n\n\
