  \n### 3.5 查询执行\n\n在本节中，我们将编写一个对数据库执行查询的程序。为了使此程序运行，你必须按照前节所述的方法填充数据库。\n\n在查询数据库时，你可以选择作者或留空其中一个。你还可以更改数据库中的数据。选择一个出版商并输入一个金额。该出版商的所有价格将根据你输入的金额进行调整，程序将显示更改了多少行。\n\
  \n### 3.5.1 预编译语句 (Prepared Statements)\n\n在这个程序中，我们使用了一个新功能：*预编译语句*（prepared statements）。考虑针对特定出版商所有所有作者的\
  \ SQL 查询：\n\n![images](img/img_p209-1.png)\n\n我们不需要每次用户启动此类查询时都构建一个独立的查询语句，而是可以使用主机变量*预编译*查询并多次使用它，每次都填充不同的字符串。这种技术可以提高性能。每当数据库执行查询时，它首先计算执行策略。通过预编译查询并重用它，你可以确保该规划步骤只执行一次。\n\
  \n预编译查询中的每个主机变量都用 `?` 表示。如果有多个变量，在设置值时必须跟踪 `?` 的位置。例如，我们的预编译查询变为\n\n![images](img/img_p209-2.png)\n\
  \n在执行预编译语句之前，你必须使用 set 方法将主机变量绑定到实际值。类似于 `ResultSet` 接口的 get 方法，不同类型有不同的 set 方法。在这里，我们要为出版商名称设置字符串：\n\
  \n![images](img/img_p209-3.png)\n\n第一个参数是要设置的主机变量的位置。位置 1 表示第一个 `?`。第二个参数是要赋值给主机变量的值。\n\
  \n如果你重用已经执行过的预编译查询，所有主机变量将保持绑定，除非你使用 set 方法更改它们或调用 `clearParameters` 方法。这意味着你只需要对那些在查询之间变化的主机变量调用\
  \ `setXxx` 方法。\n\n一旦所有变量都绑定了值，你就可以执行预编译语句了：\n\n![images](img/img_p210-1.png)\n\n\
  \n\n\n通过拼接字符串手动构建查询是枯燥且具有潜在危险的。你必须担心引号等特殊字符——而且，如果你的查询涉及用户输入，你必须防止注入攻击。因此，当你的查询涉及变量时，请使用预编译语句（prepared\
  \ statements）。\n\n价格更新功能是通过 `UPDATE` 语句实现的。注意，我们调用的是 `executeUpdate` 而不是 `executeQuery`，因为\
  \ `UPDATE` 语句不返回结果集。`executeUpdate` 的返回值是更改的行数。\n\n![images](img/img_p210-2.png)\n\
  \n### 注意 ![images](img/note.png)\n\n`PreparedStatement` 对象在关联的 `Connection` 对象关闭后将失效。然而，许多数据库会自动*缓存*预编译语句。如果两次准备了相同的查询，数据库将简单地重用查询策略。因此，不要担心调用\
  \ `prepareStatement` 的开销。\n\n以下列表简要描述了示例程序的结构：\n\n*   作者和出版者数组通过运行两个查询来填充，这两个查询会返回数据库中所有的作者和出版者名称。\n\
  *   涉及作者的查询是复杂的。一本书可以有多个作者，因此 `BooksAuthors` 表存储了作者与书籍之间的对应关系。例如，ISBN 为 `0-201-96426-0`\
  \ 的书有两个代码为 `DATE` 和 `DARW` 的作者。`BooksAuthors` 表具有以下行：\n    ![images](img/img_p210-3.png)\n\
  \    表示这一事实。第三列列出了作者的顺序。（我们不能直接使用行在表中的位置。关系型表中没有固定的行顺序。）因此，查询必须连接 `Books`、`BooksAuthors`\
  \ 和 `Authors` 表，将作者名称与用户选择的名称进行比较。\n    ![images](img/img_p211-1.png)\n\n### 提示\
