  \ 和 `getShearInstance` 构建了代表这些变换类型的矩阵。例如，调用\n\n![images](img/img_p698-4.png)\n\n\
  返回一个对应于矩阵的变换\n\n![images](img/img_p699-1.png)\n\n最后，实例方法 `setToRotation`、`setToScale`、`setToTranslation`\
  \ 和 `setToShear` 将变换对象设置为新类型。这里有一个示例：\n\n![images](img/img_p699-2.png)\n\n你可以将图形上下文的坐标变换设置为\
