  \ `URI` 类只关注语法（方案、主机、端口、路径、查询、片段等）。\n\n对于 POST 请求，你需要一个“正文发布者”（body publisher）来将请求数据转换为正在发布的数据。有针对字符串、字节数组和文件的正文发布者。例如，如果请求是\
