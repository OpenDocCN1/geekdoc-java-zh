  \n我们从回顾基础网络概念开始本章，然后编写连接到网络服务的 Java 程序。我们将向你展示如何实现网络客户端和服务器。最后，你将看到如何从 Java 程序发送电子邮件，以及如何从\
  \ Web 服务器上获取信息。\n\n## 8.1 连接到服务器\n\n在接下来的节中，你将连接到服务器，首先通过手动和使用 `telnet`，然后通过 Java\
  \ 程序连接。\n\n#### 8.1.1 使用 Telnet\n\n`telnet` 程序是网络编程的一个极佳调试工具。你应该能够通过在命令行 shell 中输入\
