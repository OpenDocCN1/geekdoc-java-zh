  \ l)`\n  添加或移除强制单元格编辑器监听器。\n\n## 9.2 树 (Trees)\n\n每个处理过分层文件系统的计算机用户都见过树形显示。当然，目录和文件只是许多树形组织示例之一。日常生活中也存在许多树形结构，例如图\
  \ 9.11 所示的国家、州和城市层级结构。\n\n作为程序员，我们经常需要显示树形结构。幸运的是，Swing 库有一个为此设计的 `JTree` 类。`JTree`\
  \ 类（同它的辅助类）负责树的布局以及处理用户展开和折叠节点的请求。在本节中，你将学习如何使用 `JTree` 类。\n\n与其他许多复杂的 Swing 组件一样，我们必须关注常见且实用的情况，无法涵盖每一个细节。如果你想实现一些寻常的功能，我们建议参考\
  \ David M. Geary 编写的 *Graphic Java™, Third Edition* 或 Kim Topley 编写的 *Core Swing*。\n\
  \n在继续深入之前，让我们先确定一些术语（参见图 9.12）。一棵*树*由*节点*（nodes）组成。每个节点要么是*叶子节点*，要么拥有*子节点*。除了根节点外，每个节点恰好有一个*父节点*。一棵树只有一个根节点。有时你拥有一组树，每棵树都有自己的根节点。这样的集合被称为*森林*（forest）。\n\
  \n![images](img/img_p623-1.png)\n\n**图 9.11** 国家、州和城市的层级结构\n\n![images](img/img_p623-2.png)\n\
  \n**图 9.12** 树的术语\n\n#### 9.2.1 简单树\n\n在第一个示例程序中，我们将简单地显示一个包含几个节点的树（参见第 604 页的图\
  \ 9.14）。与许多其他 Swing 组件一样，你需要提供一个数据模型，由组件来为你显示它。要构造一个 `JTree`，请在构造函数中提供树模型：\n\n![images](img/img_p624-3.png)\n\
  \n![images](img/note.png) **注意**\n\n还有一些通过元素集合构造树的构造函数：\n\n![images](img/img_p624-1.png)\n\
  \n这些构造函数并没有那么用。它们只是构建了一个由树组成的森林，每棵树只有一个节点。第三个构造函数似乎特别没用，因为节点出现的顺序似乎是由键的哈希值决定的随机顺序。\n\
  \n如何获取树模型？你可以通过创建一个实现 `TreeModel` 接口的类来构建你自己的模型。你将在本章稍后的部分看到如何这样做。现在，我们将坚持 Swing\
  \ 库提供的 `DefaultTreeModel`。\n\n要构造默认树模型，你必须提供一个根节点。\n\n![images](img/img_p624-2.png)\n\
  \n`TreeNode` 是另一个接口。用实现该接口的任何类的对象填充默认树模型。现在，我们将使用 Swing 提供的具体节点类——即 `DefaultMutableTreeNode`。该类实现了\
  \ `MutableTreeNode` 接口，它是 `TreeNode` 的子接口（参见图 9.13）。\n\n默认可变树节点持有一个对象——*用户对象*（user\
  \ object）。树渲染所有节点的用户对象。除非指定了渲染器，否则树将显示 `toString` 方法结果的字符串。\n\n在第一个示例中，我们使用字符串作为用户对象。在实践中，你通常会使用更有表现力的用户对象填充树。例如，在显示目录树时，使用\
  \ `File` 对象作为节点是有意义的。\n\n你可以在构造函数中指定用户对象，也可以通过 `setUserObject` 方法进行设置。\n\n![images](img/img_p625-2.png)\n\
  \n![images](img/img_p625-1)\n\n接下来你需要建立节点之间的父子关系。从根节点开始并使用 `add` 方法添加子节点：\n\n![images](img/img_p625-4.png)\n\
  \n最后，使用树模型构造一个 `JTree`。\n\n![images](img/img_p626-1.png)\n\n或者，作为快捷，你可以直接将根节点传递给\
  \ `JTree` 构造函数。\n\n![images](img/img_p626-3.png)\n\n当你运行程序时，树如所示图 9.15。只有根节点及其节点可见。点击圆形图标（即*柄*）来打开子树。当子树折叠时，伸出的线条指向右侧，当子树展开时指向下方（参见图\
  \ 9.16）。\n\n![images](img/img_p627-1.png)\n\n**图 9.15** 树的初始显示\n\n![images](img/img_p628-1.png)\n\
  \n**图 9.16** 折叠和展开的子树\n\n当然，树的显示取决于所选的外观（look and feel）。我们刚刚描述了 Metal 外观。在 Windows\
  \ 外观下，句柄具有更熟悉的样式——框中的“–”或“+”（参见图 9.17）。\n\n![images](img/img_p628-2.png)\n\n**图\
  \ 9.17** Windows 外观下的树\n\n你可以使用以下咒语来关闭父子节点之间的线条（参见图 9.18）：\n\n![images](img/img_p628-3.png)\n\
  \n相反，为了确保显示线条，请使用\n\n![images](img/img_p628-4.png)![images](img/img_p629-1.png)\n\
