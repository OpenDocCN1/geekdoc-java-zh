  \ ID 之后追加方法参数。第二个函数在 `jvalue` 数组中接收方法参数。第三个函数在 `va_list` 中接收方法参数。\n\n#### 11.7 访问数组元素\n\
  \nJava 编程语言中的所有数组类型都有对应的 C 类型，如表 11.2 所示。\n\n**表 11.2** Java 数组类型与 C 类型的对应关系\n\n\
  ![images](img/img_po32-1.png)\n\n---\n\n在 C 中，所有这些数组类型实际上都是 `jobject` 的同义词。但在 C++\
  \ 中，它们按照图 11.3 所示的继承层次排列。`jarray` 类型表示通用数组。\n\n`GetArrayLength` 函数返回数组的长度。\n\n![images](img/img_po32-2.png)\n\
  \n访问数组元素的方法取决于数组存储的是对象还是原始类型的值。访问对象数组元素，使用 `GetObjectArrayElement` 和 `SetObjectArrayElement`\
  \ 方法。\n\n![images](img/img_po32-3.png)\n\n虽然这种方法简单，但显然效率低下；你希望直接访问数组元素，特别是在进行向量和矩阵计算时。\n\
  \n`Get*Xxx*ArrayElements` 函数返回指向数组起始元素的 C 指针。与普通字符串一样，你必须调用相应的 `Release*Xxx*ArrayElements`\
  \ 函数来告诉虚拟机你不再需要该指针。在这里，类型 `Xxx` 必须是原始类型——即不是 Object。你可以可以直接读取和写入数组元素。然而，由于指针可能指向一个副本，你所做的任何更改只有在调用相应的\
  \ `Release*Xxx*ArrayElements` 函数后才能保证反映在原始数组中！\n\n![images](img/img_po33.png)\n\n\
  **图 11.3** 数组类型的继承层次\n\n\n\n\n\n你可以通过将一个指向 `jboolean` 变量的指针作为 `Get*Xxx*ArrayElements`\
  \ 方法的第三个参数，判断一个数组是否为副本。如果数组是副本，该变量将被填充为 `JNI_TRUE`。如果你对该信息不感兴趣，只需传递 `NULL` 指针即可。\n\
  \n以下是一个将双精度值数组中的所有元素乘以一个常数的示例。我们获取指向 Java 数组的 C 指针 `a`，然后通过 `a[i]` 访问单个元素。\n\n![images](img/img_po34-1.png)\n\
  \n虚拟机是否实际复制数组取决于它如何分配数组以及如何进行垃圾回收。某些“复制型”垃圾回收器会定期移动对象并更新对象引用。这种策略与将数组“固定”（pinning）到特定位置是不兼容的，因为收集器无法更新原生代码中的指针值。\n\
  \n#### 注意 ![images](img/note.png)\n\n在 Oracle JVM 的实现中，布尔数组被表示为 32 位字的压缩数组（packed\
  \ arrays）。`GetBooleanArrayElements` 方法将它们解包为 `jboolean` 值的未解包数组。\n\n要访问大数组的少数元素，请使用\
  \ `Get*Xxx*ArrayRegion` 和 `Set*Xxx*ArrayRegion` 方法，这些方法可以将范围内的元素从 Java 数组复制到 C 数组并反之。\n\
  \n你可以使用 `New*Xxx*Array` 函数在原生方法中创建新的 Java 数组。要创建一个新的对象数组，需要指定长度、元素类型以及所有条目的初始元素（通常为\
  \ `NULL`）。以下是一个示例：\n\n![images](img/img_po34-2.png)\n\n基本类型数组则更简单：只需提供数组的长度。\n\n\
  ![images](img/img_po34-3.png)\n\n然后数组将被填充为零。\n\n#### 注意 ![images](img/note.png)\n\
  \n以下方法用于处理“直接缓冲区”（direct buffers）：\n\n![images](img/img_po34-4.png)\n\n直接缓冲区用于 `java.nio`\
  \ 包，以支持更高效的输入/输出操作，并尽量减少减少原生数组和 Java 数组之间的数据拷贝。\n\n### 操作 Java 数组\n\n*   `jsize\
  \ GetArrayLength(JNIEnv *env, jarray array)`\n    返回数组中的元素个数。\n\n*   `jobject GetObjectArrayElement(JNIEnv\
  \ *env, jobjectArray array, jsize index)`\n    返回数组元素的值。\n\n*   `void SetObjectArrayElement(JNIEnv\
  \ *env, jobjectArray array, jsize index, jobject value)`\n    将数组元素设置为新值。\n\n* \
  \  `Xxx** Get*Xxx*ArrayElements(JNIEnv *env, jarray array, jboolean* isCopy)`\n\
  \    产生一个指向 Java 数组元素的 C 指针。字段类型 `Xxx` 是 Boolean、Byte、Char、Short、Int、Long、Float\
  \ 或 Double 之一。当指针不再需要时，必须将其传递给 `Release*Xxx*ArrayElements`。`isCopy` 为 `NULL` 或指向一个\
  \ `jboolean`，如果进行了复制，则该值被填充为 `JNI_TRUE`，否则填充为 `JNI_FALSE`。\n\n*   `void Release*Xxx*ArrayElements(JNIEnv\
  \ *env, jarray array, Xxx* elems[], jint mode)`\n    通知虚拟机通过 `Get*Xxx*ArrayElements`\
  \ 获取的指针已不再需要。`mode` 是 0（在更新数组元素后释放 `elems` 缓冲区）、`JNI_COMMIT`（在更新数组元素后不释放 `elems`\
  \ 缓冲区）或 `JNI_ABORT`（在不更新数组元素的情况下释放 `elems` 缓冲区）之一。\n\n*   `void Get*Xxx*ArrayRegion(JNIEnv\
  \ *env, jarray array, jint start, jint length, Xxx* elems[])`\n    将元素从 Java 数组复制到\
  \ C 数组。字段类型 `Xxx` 是 Boolean、Byte、Char、Short、Int、Long、Float 或 Double 之一。\n\n*   `void\
  \ Set*Xxx*ArrayRegion(JNIEnv *env, jarray array, jint start, jint length, Xxx* elems[])`\n\
  \    将元素从 C 数组复制到 Java 数组。字段类型 `Xxx` 是 Boolean、Byte、Char、Short、Int、Long、Float 或\
  \ Double 之一。\n\n### 11.8 处理错误\n\n原生方法对 Java 程序构成了重大的安全风险。C 运行时系统没有针对数组边界错误、通过错误指针进行间接引用等的保护。原生方法的程序员处理所有错误状况以维护\
  \ Java 平台的完整性，这一点尤为重要。特别是当你的原生方法诊断出一个它无法处理的问题时，它应该向 Java 虚拟机报告此问题。\n\n通常情况下，在这种情况下你会抛出一个异常。然而，C\
  \ 没有异常。相反，你必须调用 `Throw` 或 `ThrowNew` 函数来创建一个新的异常对象。当原生方法退出时，Java 虚拟机会抛出该异常。\n\n\
  要使用 `Throw` 函数，请调用 `NewObject` 创建 `Throwable` 子类的对象。例如，我们分配一个 `EOFException` 对象并抛出它：\n\
  \n![images](img/img_po36-1.png)\n\n通常调用 `ThrowNew` 更加方便，它根据一个类和一个“修改后的 UTF-8”字节序列来构造异常对象。\n\
  \n![images](img/img_po36-2.png)\n\n`Throw` 和 `ThrowNew` 仅仅是*发布*（post）异常；它们不会中断原生方法的控制流。只有当方法返回时，Java\
  \ 虚拟机才会抛出异常。因此，每次调用 `Throw` 和 `ThrowNew` 之后都应该紧跟一个返回。\n\n#### C++ 注意 ![images](img/note.png)\n\
  \n如果你在 C++ 中实现原生方法，你无法抛出 Java 对象。在 C++ 绑定中，可以实现异常与 Java 之间的翻译；但目前尚未这样做。请使用 `Throw`\
  \ 或 `ThrowNew` 在原生方法中抛出 Java 异常，并确保你的原生方法不抛出 C++ 异常。\n\n通常，原生代码不需要担心捕获 Java 异常。然而，当原生方法调用\
  \ Java 方法时，该方法可能会抛出异常。此外，许多 JNI 函数也会抛出异常。例如，如果索引超出边界，`SetArrayElement` 会抛出 `ArrayIndexOutOfBoundsException`；如果存储的对象的类不是元素类的子类，则会抛出\
  \ `ArrayStoreException`。在这些情况下，原生方法应该调用 `ExceptionOccurred` 方法判断是否抛出了异常。调用 `ExceptionOccurred`\
  \ 在没有挂起异常时返回 `NULL`，或者返回当前异常对象的引用。如果你只想检查是否抛出了异常，而不获取异常对象的引用，请使用 `ExceptionOccurred`。通常情况下，当发生异常时，原生方法应简单地返回，以便异常传播到代码中。\n\
  \n在我们的下一个示例中，我们以原生方法应有的所有谨慎态度实现了 `fprint` 原生方法。以下是我们抛出的异常：\n\n*   如果格式字符串为 `NULL`，则抛出\
  \ `NullPointerException`。\n*   如果格式字符串不包含适用于打印 double 的 `%` 标识符，则抛出 `IllegalArgumentException`。\n\
  *   如果调用 `malloc` 失败，则抛出 `OutOfMemoryError`。\n\n最后，为了演示从原生方法调用 Java 方法时如何检查异常，我们逐字符将字符串发送到流中，并在每次调用后调用\
  \ `ExceptionOccurred`。列表 11.17 显示了原生方法的代码，列表 11.18 显示了包含原生方法的类定义。注意，当调用 `PrintWriter.print`\
  \ 发生异常时，原生方法并没有立即终止——它首先释放 `cstr` 缓冲区。当原生方法返回时，虚拟机再次抛出该异常。列表 11.19 中的测试程序演示了当格式字符串无效时，原生方法如何抛出异常。\n\
  \n\n\n\n\n## 列表 11.17 `printf4/Printf4.c`\n\n![images](img/img_po37-2.png)![images](img/img_po39-1.png)\n\
  \n## 列表 11.18 `printf4/Printf4.java`\n\n![images](img/img_po39-2.png)\n\n## 列表 11.19\
  \ `printf4/Printf4Test.java`\n\n![images](img/img_po40.png)\n\n### 处理 Java 异常\n\n\
  - `jint Throw(JNIEnv *env, jthrowable obj)`\n  准备一个在退出原生代码时抛出的异常。成功时返回 0，失败返回负值。\n\
  \n- `jint ThrowNew(JNIEnv *env, jclass cl, const char msg[])`\n  准备一个在退出原生代码时抛出的类型为\
  \ `cl` 的异常。成功时返回 0，失败返回负值。`msg` 是一个“修改后的 UTF-8”字节序列，表示异常对象的构造函数参数。\n\n- `jthrowable\
  \ ExceptionOccurred(JNIEnv *env)`\n  如果挂起异常，则返回异常对象；否则返回 NULL。\n\n- `jboolean ExceptionCheck(JNIEnv\
  \ *env)`\n  如果挂起异常，则返回 true。\n\n- `void ExceptionClear(JNIEnv *env)`\n  清除任何挂起的异常。\n\
  \n### 11.9 使用 Invocation API\n\n到目前，我们考虑的是使用 Java 编程语言编写的程序，它们调用了一些 C 函数，这可能是因为\
  \ C 速度更快，或者允许访问 Java 平台无法访问的功能。假设你处于相反的情况：你有一个 C 或 C++ 程序，并想调用 Java 代码。`invocation\
  \ API` 允许你将 Java 虚拟机嵌入到 C 或 C++ 程序中。以下是初始化虚拟机所需的最小代码：\n\n![images](img/img_po41-1.png)\n\
  \n对 `JNI_CreateJavaVM` 的调用会创建虚拟机，并填充一个指向虚拟机的指针 `jvm` 和一个指向执行环境的指针 `env`。\n\n你可以为虚拟机提供任意数量的选项。只需增加\
  \ options 数组的大小和 `vm_args.nOptions` 的值即可。例如：\n\n![images](img/img_po41-2.png)\n\n\
  禁用了即时编译器（JIT compiler）。\n\n### 提示\n\n当你遇到问题且程序程序崩溃、拒绝初始化 JVM 或无法加载你的类时，请开启 JNI 调试模式。设置一个选项为：\n\
  \n![images](img/img_po42-1.png)\n\n你将看到大量指示初始化虚拟机进度的消息。如果你没有看到类被加载，请检查你的路径（path）和类路径（class\
  \ path）设置。\n\n一旦设置好虚拟机，你就可以像前面的章节描述那样调用 Java 方法。只需按通常的方式使用 `env` 指针即可。\n\n你只需要 `jvm`\
  \ 指针来调用 invocation API 中的其他函数。目前只有四个这样的函数。最重要的一个是终止虚拟机的函数：\n\n![images](img/img_po42-2.png)\n\
  \n遗憾的是，在 Windows 下，由于 Vista 链接规则的更改以及 Oracle 对旧版本 C 运行时库的依赖，动态链接到 `jre/bin/client/jvm.dll`\
  \ 库中的 `JNI_CreateJavaVM` 函数变得困难。我们的示例程序通过手动加载库来克服这个问题。这是 java 程序使用的相同方法——参见 JDK\
  \ 部分 `src.jar` 文件中的 `launcher/java_md.c` 文件。\n\n[列表 11.20] 中的 C 程序建立了虚拟机并调用了 `Welcome`\
