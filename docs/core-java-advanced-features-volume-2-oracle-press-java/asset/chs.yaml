  \n### 2.1.7 以文本格式保存对象\n\n在本节中，我们将讨论一个示例程序，该程序在文本文件中存储 `Employee` 记录数组。每个记录存储在单独的一行中。实例字段之间通过分隔符分开。使用竖线（`|`）作为分隔符。（冒号（`:`）是另一个流行选择。有趣的地方在于，每个人使用的分隔符都不同。）自然地，我们回避了如果我们保存的字符串中实际上出现了\
