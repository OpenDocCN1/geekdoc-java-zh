  \n## 10.1 模块概念\n\n在面向对象的编程中，基本的构建块是类。类提供了封装。私有特征只能被具有显式权限的代码访问，即类的方法。这使得访问推理变得可能。如果一个私有变量发生了变化，你可以列出所有可能的魁祸首。如果你需要修改私有表示，你知道哪些方法受到了影响。\n\
  \n在 Java 中，包提供了更大的组织分组。包是类的集合。包也提供了一种封装。任何具有包访问权限（既不是公共的私有的）的特征只能从同一个包中访问。\n\n然而，在大型系统中，这种级别的访问控制是不够的。任何公共特征（即可以在包外部访问的特征）都是随处可用的。假设你想修改或删除一个很少使用的特征。一旦它是公共的，就无法推断该更改的影响。\n\
  \n\n\n\n这就是 Java 平台设计者所面临的局面。在二十多年里，`JDK` 经历了飞速增长，但显然某些功能现在已经基本上过时了。大家最喜欢的例子是 CORBA。你上一次使用它是什么时候？然而，直到\
  \ Java 10，`org.omg.corba` 包一直随每个 `JDK` 一起。从 Java 11 开始，少数仍然需要它的人必须将所需的 JAR 文件添加到他们的项目中。\n\
  \n那么 `java.awt` 呢？在服务器端应用中它不应该是必须的，对吧？除非 `java.awt.DataFlavor` 类在 SOAP（一种基于 XML\
  \ 的网络服务协议）的实现中使用了。\n\nJava 平台设计者面对巨大的代码乱团，决定他们需要一种能够提供更多控制的结构化机制。他们查看了现有的模块系统（如\
  \ OSGi），并发现它们不适合他们的问题。相反，他们设计了一个新系统，称为 `Java Platform Module System`（Java 平台模块系统），现在它是\
  \ Java 语言和虚拟机的一部分。该系统已成功用于 Java API 的模块化，如果你愿意，也可以在自己的应用程序中使用它。\n\n一个 Java 平台模块由以下部分组成：\n\
  \n* 包的集合\n* 可选的资源文件和其他文件（如本地库）\n* 模块中可访问的包列表\n* 该模块所依赖的所有模块列表\n\nJava 平台在编译时和虚拟机中强制执行封装和依赖关系。\n\
  \n为什么你应该考虑为自己的程序使用 Java 平台模块系统，而不是遵循在类路径上使用 JAR 文件的传统方法呢？有两个优势：\n\n1. **强封装**：你可以控制哪些包是可访问的，而你不必担心维护那些你并不打算供公共使用的代码。\n\
  2. **可靠的配置**：你避免了常见的类路径问题，例如重复或缺失的类。\n\n存在一些 Java 平台模块系统没有解决的问题，例如模块的版本控制。它不支持指定需要模块的哪个版本，也不支持在同一个程序中使用模块的多个版本。这些可能是可能是所需的功能，但如果你需要它们，就必须使用\
  \ Java 平台模块系统以外的机制。\n\n## 10.2 模块命名\n\n模块是包的集合。模块中的包名不需要相互关联。例如，`java.sql` 模块包含\
  \ `java.sql`、`javax.sql` 和 `javax.transaction.xa` 包。此外，正如从这个示例所示，模块名与包名相同是完全可以的。\n\
  \n就像路径名一样，模块名由字母、数字、下划线和点组成。同样，就像路径名一样，模块之间没有层级关系。如果你有一个 `com.horstmann` 模块和另一个\
  \ `com.horstmann.corejava` 模块，从模块系统的角度来看，它们是无关的。\n\n在为供他人使用的模块时，确保其名称在全局范围内唯一的至关重要。预计大多数模块名将像包名一样，遵循“反向域名”约定。\n\
  \n最简单的方法根据该模块提供的顶层包来命名模块。例如，SLF4J 日志门面有一个名为 `org.slf4j` 的模块，其中包含 `org.slf4j`、`org.slf4j.spi`、`org.slf4j.event`\
  \ 和 `org.slf4j.helpers` 包。\n\n这种约定防止了模块中的包名冲突。任何给定的包只能被放在一个模块中。如果你的模块名是唯一的，且你的包名以模块名开头，那么你的包名也将是唯一的。\n\
  \n你可以为那些不是供其他程序员使用的模块使用较短的模块名，例如包含应用程序的模块。为了说明这是可行的，我将在本章中同样这样做。包含可能是库代码的模块将具有如\
  \ `com.horstmann.util` 的名称，而包含程序（带有 `main` 方法的类）的模块将具有如 `v2ch09.hellomod` 这样易记的名字。\n\
  \n注意：模块名仅用于模块声明。在你的 Java 类的源文件中，你永远不会引用模块名；相反，请像过去一直那样使用包名。\n\n## 10.3 模块化的“Hello,\
  \ World!”程序\n\n让我们把传统的“Hello, World!”程序放入模块中。首先，我们需要将类放入包中——“未命名包”不能包含在模块中。这里是它：\n\
  \n![images](img/img_p780.png)\n\n到目前为止，没有任何变化。要创建一个包含此包的模块 `v2ch09.hellomod`，你需要添加一个模块声明。你将其放置在一个名为\
  \ `module-info.java` 的文件中，位于基目录（即包含 `com` 目录的目录）中。按照约定，基目录的名字与模块名相同。\n\n![images](img/img_p781-1.png)\n\
  \n`module-info.java` 文件包含模块声明：\n\n![images](img/img_p781-2.png)\n\n这个模块声明是空的，因为该模块向任何人提供任何内容，也不需要任何东西。\n\
  \n现在，照常编译：\n\n![images](img/img_p781-3.png)\n\n`module-info.java` 文件看起来不像 Java 源文件，而且当然不能有一个名为\
  \ `module-info` 的类，因为类名不能包含连字符。`module` 关键字，以及你在后续章节中看到的 `requires`、`exports` 等关键字，是“受限关键字”，它们仅在模块声明中具有特殊含义。该文件被编译成类文件\
  \ `module-info.class`。\n\n要作为模块化应用程序运行此程序，你需要指定*模块路径*（module path），它类似于类路径但包含模块。你还以\
  \ `modulename/classname` 的格式指定主类：\n\n![images](img/img_p781-4.png)\n\n除了 `--module-path`\
  \ 和 `--module`，你可以使用单字母选项 `-p` 和 `-m`：\n\n![images](img/img_p781-5.png)\n\n无论哪种方式，都会出现“Hello,\
  \ World!”问候，证明你已成功将你的应用程序模块化。\n\n注意：当你编译此模块时，你会得到一个警告：\n\n![images](img/img_p782-1.png)\n\
  \n这个警告旨在阻止程序员在模块名中添加版本号。你可以忽略该警告，或者使用注解来抑制它：\n\n![images](img/img_p782-2.png)\n\n\
  在这一点上，模块声明就像类声明一样：你可以对其进行注解。（注解类型的目标必须是 `ElementType.MODULE`。）\n\n## 10.4 模块模块\n\
  \n让我们创建一个新模块 `v2ch09.requiremod`，其中程序使用 `JOptionPane` 显示“Hello, World!”消息：\n\n![images](img/img_p782-3.png)\n\
  \n现在编译失败，显示此消息：\n\n![images](img/img_p782-4.png)\n\nJDK 已经模块化，且 `javax.swing` 包现在包含在\
  \ `java.desktop` 模块中。我们的模块需要声明它依赖该模块：\n\n![images](img/img_p782-5.png)\n\n模块系统的设计目标之一是模块对于其需求是显式的，这样虚拟机可以在启动程序之前确保所有需求都已满足。\n\
  \n在前面的节中，并没有出现显式需求的需求，因为我们只使用了 `java.lang` 和 `java.io` 包。这些包包含在 `java.base` 模块中，该模块是默认被需要的。\n\
  \n\n\n\n\n图 10.1 显示了*模块图*，其节点是模块。图的边（即连接节点的箭头）要么是声明的依赖，要么是在未声明依赖时对 `java.base` 的隐式依赖。\n\
  \n![images](img/img_p783.png)\n\n**图 10.1** Swing “Hello, Modular World”应用程序的模块图\n\
  \n模块图中不能有循环——也就是说，一个模块不能直接或间接地引用它自己。\n\n模块不会自动将访问权限传递给其他模块。在示例中，`java.desktop` 模块声明它需要\
  \ `java.prefs`，而 `java.prefs` 模块声明它需要 `java.xml`。这并没有赋予 `java.desktop` 使用 `java.xml`\
  \ 模块中包的权限。它需要显式地声明该依赖。从数学角度来说来说，`requires` 关系不是“传递”的。通常情况下，这种行为是理想的，因为它使依赖变得显式，但正如你将在第\
  \ 775 页的第 10.11 节“传递性与静态依赖”中所所示，在某些情况下你可以放松它。\n\n#### ![images](img/note.png) **注意**\n\
  \n本节开头的错误信息显示我们的 `v2ch09.requiremod` 模块没有“读取”`java.desktop` 模块。在 Java 平台模块系统的术语中，在以下情况下，模块\
  \ *M 读取了*模块 *N*：\n\n1. `M` 需要 `N`。\n2. `M` 需要一个传递性地需要 `N` 的模块（参见第 775 页的第 10.11\
  \ 节“传递性与静态依赖”）。\n3. `N` 是 `M` 或 `java.base`。\n\n## 10.5 导出包\n\n在节一节中，你看到如果模块想要使用另一个模块的包，就必须需要该模块。然而，这并没有自动让所需模块中的所有包都可用。模块使用\
  \ `exports` 关键字声明哪些包是可访问的。例如，这里是 `java.xml` 模块声明的一部分：\n\n![images](img/img_p784.png)\n\
  \n该模块提供了许多包，但通过不导出它们隐藏了其他包（如 `jdk.xml.internal`）。\n\n当一个包被导出时，其公共和受保护的类、接口，以及它们的公共和受保护成员在模块外部是可访问的。（与既往一样，受保护的类型和成员仅在子类中可访问。）\n\
  \n然而，未导出的包在它自己的模块外部是不可访问的。这与模块出现之前的 Java 非常不同。在过去，你可以使用任何包中的公共类，即使它不是公共 API 的一部分。例如，当公共\
  \ API 不提供适当的功能时，通常建议使用如 `sun.misc.BASE64Encoder` 或 `com.sun.rowset.CachedRowSetImpl`\
  \ 等类。\n\n现在，你无法再访问 Java 平台 API 中未导出的包了，因为它们都包含在模块内部。结果是，某些程序将无法在 Java 9 下运行。当然，没有人承诺过保持非公共\
  \ API 的可用，所以这不应该让你感到震惊。\n\n让我们在一个简单的场景中使用导出。我们将准备一个模块 `com.horstmann.greet`，它导出一个也称为\
  \ `com.horstmann.greet` 的包，遵循以下惯例：为他人提供代码的模块应以其内部顶层包命名。还有一个名为 `com.horstmann.greet.internal`\
  \ 的包，我们没有导出它。\n\n第一个包中有一个公共的 `Greeter` 接口。\n\n![images](img/img_p785-1.png)\n\n\
  第二个包有一个实现该接口的类。该类是公共的，因为在第一个包中被访问了。\n\n![images](img/img_p785-2.png)\n\n`com.horstmann.greet`\
  \ 模块包含了两个包，但只导出第一个：\n\n![images](img/img_p785-3.png)\n\n第二个包在模块外部是不可访问的。\n\n我们将我们的应用程序放入第二个模块中，该模块将需要第一个模块：\n\
  \n![images](img/img_p786-1.png)\n\n#### ![images](img/note.png) **注意**\n\n`exports`\
  \ 语句后面跟着一个包名，而 `requires` 后面跟着一个模块名。\n\n我们的应用程序现在使用 `Greeter` 来获取问候：\n\n![images](img/img_p786-2.png)\n\
  \n这是这两个模块的源文件结构：\n\n![images](img/img_p786-3.png)\n\n要构建此应用程序，首先编译 `com.horstmann.greet`\
  \ 模块：\n\n![images](img/img_p786-4.png)\n\n然后将第一个模块放在模块路径上，并编译应用程序模块：\n\n![images](img/img_p787-1.png)\n\
  \n最后，将两个模块都放在模块路径上运行程序：\n\n![images](img/img_p787-2.png)\n\n#### ![images](img/tip.png)\
  \ **提示**\n\n要使用 Eclipse 构建此应用程序，请为每个模块创建一个单独的项目。在 `v2ch09.exportedpkg` 项目中，编辑项目属性。在\
  \ Projects 选项卡中，将 `com.horstmann.greet` 模块添加到模块路径——参见图 10.2。\n\n![images](img/img_p787-3.png)\n\
  **图 10.2** 向 Eclipse 项目添加模块\n\n#### ![images](img/caution.png) **注意**\n你不能拥有同名的包。对于隐藏的包也是如此。\n\
  \n## 10.6 模块 JAR\n\n到为止，我们只是将模块编译到了目录树。显然，这对于部署是不够的。相反，可以通过将所有类放在 JAR 文件中并在包含 `module-info.class`\
  \ 来部署模块。这种 JAR 文件被称为*模块 JAR*。\n\n要创建模块 JAR，按通常的方式使用 `jar` 工具。如果你有多个包，最好使用 `-d` 选项将类文件放入单独目录。然后使用\
  \ `jar` 命令的 `-C` 选项切换到该目录以收集文件。\n\n![images](img/img_p788-1.png)\n\n如果你使用 Maven、Ant\
  \ 或 Gradle 等构建工具，只需像往一样构建 JAR。只要包含了 `module-info.class`，你就得到了模块 JAR。\n\n然后，将模块 JAR\
  \ 加入模块路径，模块就会加载。\n\n与普通 JAR 文件一样，你可以在模块 JAR 中指定主类：\n\n![images](img/img_p788-2.png)\n\
  \n当你启动程序时，指定包含主类的模块：\n\n![images](img/img_p788-3.png)\n\n在创建 JAR 文件时，你可以可选指定版本号。使用\
  \ `--module-version` 参数，并在文件名中也加上 `@` 和版本号：\n\n![images](img/img_p789-1.png)\n\n\
  正如讨论过的，版本号不会被 Java 平台模块系统用于解析模块，但它可以被其他工具和框架查询。\n\n#### ![images](img/note.png)\
  \ **注意**\n\n你可以通过反射 API 获取版本号。在我们的示例中：\n\n![images](img/img_p789-2.png)\n\n产生一个包含版本字符串\
  \ \"1.0\" 的 `Optional`。\n\n\n\n\n\n等同类加载器的模块是 `layer`（层）。Java 平台模块系统将 JDK 模块和应用程序模块加载到\
  \ `boot layer`（启动层）中。程序可以使用 `layer` API（本书未涵盖）来加载其他模块。此类程序可能会考虑模块版本。预计 Java EE 应用服务器等程序的开发者将利用\
  \ `layer` API 为模块提供支持。\n\n### ![images](img/tip.png) **提示**\n\n如果你想将一个模块加载到 JShell，请将该\
  \ JAR 包含模块路径（module path）并使用 `--add-modules` 选项：\n\n![images](img/img_p789-3.png)\n\
  \n## 10.7 模块与反射访问\n\n在前面的章节中，你已经看到模块系统强制执行封装。模块只能访问另一个模块中显式导出（exported）的包。在过去，总是可以通过反射来克服这些烦人的访问限制的。正如你在第一卷第\
  \ 4 章中看到的，反射可以访问任何类的私有成员。\n\n然而，在模块化世界中，这种情况已不再如此。如果一个类位于模块内部，对该非公开成员的反射访问将失败。具体来说，回想我们是如何访问私有字段的：\n\
  \n![images](img/img_p789-4.png)\n\n除非安全管理器（security manager）不允许访问私有字段，否则调用 `f.setAccessible(true)`\
  \ 将成功。然而，运行带有安全管理器的 Java 程序并不常见，而且许多库使用了反射访问。典型的例子是对象关系映射器（如 JPA），它们会自动将对象持久化到数据库中，以及在对象与\
  \ XML 或 JSON 之间转换的库（如 JAXB 和 JSON-B）。\n\n如果你使用此类库并且又想使用模块，就必须小心。为了演示这个问题，让我们将第一卷第\
  \ 4 章中的 `ObjectAnalyzer` 类放入模块 `com.horstmann.util` 中。该类有一个 `toString` 方法，它使用反射来打印对象的字段。\n\
  \n另一个名为 `v2ch09.openpkg` 的模块包含一个简单的 `Country` 类：\n\n![images](img/img_p790-1.png)\n\
  \n一个短程序演示了如何分析 `Country` 对象：\n\n![images](img/img_p790-2.png)\n\n现在编译两个模块和 `Demo`\
  \ 程序：\n\n![images](img/img_p791-1.png)\n\n程序将抛出异常并失败：\n\n![images](img/img_p791-2.png)\n\
  \n当然，在纯粹理论上，违反封装并窥探对象的私有成员是错误的。但像对象关系映射或 XML/JSON 绑定这样的机制是非常常见的，因此模块系统必须适应它们。\n\n\
  使用 `opens` 关键字，模块可以 `open` 一个包，从而允许对给定包中所有类的实例进行反射访问。以下是我们的模块需要做的：\n\n![images](img/img_p791-3.png)\n\
  \n通过此更改，`ObjectAnalyzer` 将正常工作。\n\n模块可以声明为开放的，例如：\n\n![images](img/img_p791-4.png)\n\
  \n开放模块授予其所有包的运行时访问权限，就像所有包都用 `exports` 和 `opens` 声明了一样。然而，在编译时只有显式导出的包是可访问的。开放模块将模块系统的编译安全性与经典的宽松运行时行为相结合。\n\
  \n回想第一卷第 4 章，JAR 文件除了类文件和清单（manifest）外，还可以包含“文件资源”，这些资源可以使用 `Class.getResourceAsStream`\
  \ 方法加载，现在也可以通过 `Module.getResourceAsStream` 加载。如果资源存储在与模块中的包匹配的目录中，则包必须对调用者开放。其他目录中的资源，以及类文件和清单，可以被任何人读取。\n\
  \n### ![images](img/note.png) **注意**\n\n为了一个更真实的示例，我们可以使用 JSON-B 规范将 `Country` 对象转换为\
  \ XML 或 JSON。要使用 JSON-B 的 Yasson 实现，从 Maven 中央仓库下载 `jakarta.json-api-2.0.1.jar`、`jakarta.json.bind-api-2.0.0.jar`、`jakarta.json-2.0.1-module.jar`\
  \ 和 `yasson-2.0.3.jar`。将 JAR 文件放在模块路径上，并运行 `v2ch09.openpkg2` 模块中的 `com.horstmann.places.Demo`\
  \ 程序。当 `com.horstmann.places` 包打开时，转换为 JSON 将成功。\n\n### ![images](img/note.png)\
  \ **注意**\n\n未来的库可能会使用“变量句柄”（variable handles）代替反射来读写字段。`VarHandle` 类似于 `Field`。你可以用它来读取或写入特定类的任何实例的特定字段。然而，为了获取\
  \ `VarHandle`，库代码需要一个 `Lookup` 对象：\n\n![images](img/img_p792.png)\n\n只要 `Lookup`\
  \ 对象是在具有访问该字段权限的模块中生成的，这种方法就是有效的。模块中的某些方法简单地调用 `MethodHandles.lookup()`，这会产生一个封装了调用者访问权限的对象。通过这种方式，一个模块可以授予另一个模块访问私有成员的权限。问题在于如何以最少的麻烦赋予这些权限。\n\
  \n## 10.8 自动模块\n\n你现在知道如何利用 Java 平台模块系统了。如果你从一个全新的项目开始并编写所有代码，你可以设计模块、声明模块依赖并将应用程序封装成模块化\
  \ JAR 文件。\n\n然而，这种情况是极罕见的的绝大多数项目都依赖第三方库。当然，你可以等待库供应商将它们转换为模块，然后对自己的代码进行模块化。但如果你不想等待呢？Java\
  \ 平台模块系统提供了两种机制来跨越今天模块化世界与完全模块化应用之间的鸿沟：自动模块和未命名模块。\n\n为了迁移目的，只需将任何 JAR 文件放在模块路径而非类路径上即可将其转换为模块。位于模块路径且没有\
  \ `module-info.class` 的 JAR 被称为自动模块。自动模块具有以下属性：\n\n1. 它隐含地对所有模块拥有 `requires` 子句。\n\
  2. 它的所有包都被导出（exports）并开放（opens）。\n3. 如果 JAR 文件清单 `META-INF/MANIFEST.MF` 中存在 `Automatic-Module-Name`\
  \ ，则该值将成为模块名。\n4. 否则，模块名从 JAR 文件名中获得，去掉末尾的版本号。\n\n前两个规则意味着自动模块中的包就像在类路径上一样。使用模块路径的原因是为了其他模块的利益，允许它们依赖此模块。\n\
  \n例如，假设你正在实现一个处理 CSV 文件并使用 Apache Commons CSV 库的模块。你希望在 `module-info.java` 文件中表示你的模块依赖\
  \ Apache Commons CSV。\n\n如果你将 `commons-csv-1.9.0.jar` 添加到模块路径上，那么你的模块就可以引用该模块。它的名称是\
  \ `commons.csv`，因为末尾的版本号 `-1.9.0` 被删除了，非字母数字字符 `-` 被替换为点。\n\n这个名称可能是可以接受的模块名，因为\
  \ Commons CSV 是广为人知的，不太可能其他人尝试为不同的模块使用相同的名称。但如果此 JAR 文件的维护者能够快速预留一个反向 DNS 名称（最好是顶层包名\
  \ `org.apache.commons.csv`）作为模块名会更好。他们只需要在 JAR 内部的 `META-INF/MANIFEST.MF` 文件中添加一行：\n\
  \n![images](img/img_p793.png)\n\n最终，他们将通过添加带有预留模块名的 `module-info.java` 将 JAR 文件转换为真正的模块——所有以该名称引用\
  \ CSV 模块的其他模块都将继续正常工作。\n\n\n\n向模块的迁移计划是一场伟大的社会实验，没有人知道它是否会有圆满的结果。在将第三方 JAR 包放置到模块路径（module\
  \ path）之前，请先检查它们是否是模块化的，如果不是，检查它们的清单文件（manifest）中是否有模块名称。如果没有，你仍然可以将 JAR 转换为自动模块，但要准备好以后更新模块名称。\n\
  \n在本书编写期间，`Commons CSV` 库 JAR 文件的 `1.9.0` 版本没有模块描述符或自动模块名称。尽管如此，它在模块路径上也可以正常工作。你可以从\
  \ [`commons.apache.org/proper/commons-csv`](https://commons.apache.org/proper/commons-csv)\
  \ 下载该库。将 `commons-csv-1.9.0.jar` 文件放入 `v2ch9.automod` 模块的目录下。该模块包含一个简单的程序，用于读取包含国家数据的\
  \ CSV 文件：\n\n![images](img/img_p794-1.png)\n\n由于我们将使用 `commons-csv-1.9.0.jar` 作为自动模块，我们需要引用它：\n\
  \n![images](img/img_p794-2.png)\n\n以下是编译和运行程序的命令：\n\n![images](img/img_p794-3.png)\n\
  \n## 10.9 未命名模块\n\n任何不在模块路径上的类都属于一个 `unnamed module`（未命名模块）。从技术上讲，可能有多个未命名模块，但它们共同的作用就像一个单一模块，被称为\
  \ `the unnamed module`（未命名模块）。与自动模块一样，未命名模块可以访问所有其他模块，并且它的所有包都是导出（exported）并开放（opened）的。\n\
  \n然而，显式模块（no explicit module）无法访问未命名模块。（显式模块既不是自动模块也不是未命名模块——即在模块路径上带有 `module-info.class`\
  \ 的模块）。换句话说，显式模块总是免受“类路径地狱”的影响。\n\n以前一节的程序为例。假设你将 `commons-csv-1.9.0.jar` 放在类路径（class\
  \ path）而不是模块路径：\n\n![images](img/img_p795-1.png)\n\n现在程序无法启动：\n\n![images](img/img_p795-2.png)\n\
  \n因此，迁移到 Java 模块系统必然是一个自下向上的过程：\n\n1.  Java 平台本身被模块化。\n2.  接下来，库被模块化，通过使用自动模块或将它们转换为显式模块。\n\
  3.  一旦应用程序使用的所有库都模块化，你就可以将你的应用程序代码转换为模块。\n\n### ![images](img/note.png) 注意\n\n自动模块\
  \ `can` 读取未命名模块，因此它们的依赖可以放在类路径上。\n\n## 10.10 迁移的命令行标记\n\n即使你的程序没有使用模块，在使用 `Java\
  \ 9` 及更高版本时也无法逃离模块化世界。你的应用程序代码可能位于未命名模块的类路径上，因此所有包都是导出并开放的。尽管如此，代码仍然与模块化的 Java 平台进行交互。\n\
  \n从 `Java 11` 开始，编译时封装被严格执行。但在 `Java 16` 之前，允许运行时访问。默认行为是对于每种违规行为的首次出现在控制台上显示警告。从\
  \ `Java 16` 开始，运行时反射访问也被强制执行。为了给你时间为该变化做准备，`Java 9` 到 `16` 中的 `java` 启动器有一个 `--illegal-access`\
  \ 标记，带有四种设置：\n\n1.  `--illegal-access=permit` 是 `Java 9` 的默认行为，在首次非法访问时打印消息。\n2.\
  \  `--illegal-access=warn` 每次非法访问都会打印消息。\n3.  `--illegal-access=debug` 每次非法访问都会打印消息和堆栈跟踪信息。\n\
  4.  `--illegal-access=deny` 是 `Java 16` 的默认行为，拒绝所有非法访问。\n\n`--illegal-access` 标记在\
  \ `Java 17` 中不再可用。\n\n`--add-exports` 和 `--add-opens` 标记允许你调整遗留应用程序。考虑一个使用不再可的内部\
  \ API 的应用程序，例如 `com.sun.rowset.CachedRowSetImpl`。最好的解决办法是更改实现。（从 `Java 7` 开始，你可以从\
  \ `RowSetProvider` 获取缓存行集。）但假设你没有它。\n\n（注：原文中存在大量重复的 `--add-exports` 和 `--add-opens`\
  \ 描述段，已根据指令要求进行去重处理，保留核心逻辑。）\n\n\n\n\n在本节中，你将看到 `exports` 和 `opens` 语句的一种变体，它们将范围缩小到指定的模块集合。例如，`java.base`\
  \ 模块包含这样一个语句：\n\n![images](img/img_p799-2.png)\n\n这样的语句被称为`限定导出`（qualified export）。列出的模块可以访问导出的包，但其他模块不能。\n\
  \n过度使用限定导出可能表明模块结构不佳。尽管如此，在对现有代码库进行模块化时可能会出现这种情况。在这里，`sun.net` 包被放置在 `java.base`\
  \ 模块中，因为那里最需要它。然而，其他几个模块也使用了该包。Java 平台设计者不想让 `java.base` 变得更大，也不想让内部的 `sun.net`\
  \ 包对外部可见。在全新的项目（greenfield project）中，可以设计一个更模块化的 API。\n\n同样，你可以将 `opens` 语句限制为特定的模块。例如，在第\
  \ 767 页的第 10.7 节“模块与反射访问”中，我们可以使用限定的 `opens` 语句，如下所示：\n\n![images](img/img_p799-3.png)\n\
  \n现在，`com.horstmann.places` 包仅对 `com.horstmann.util` 模块开放。\n\n## 10.13 服务加载\n\n\
  `ServiceLoader` 类（见第一卷第 5 章）提供了一种匹配服务接口与实现之间的轻量级机制。Java 平台模块系统使得这种机制更易使用。\n\n这里是对服务加载的简要回顾。一个服务有一个接口和一个多个可能的实现。这里有一个简单的接口示例：\n\
