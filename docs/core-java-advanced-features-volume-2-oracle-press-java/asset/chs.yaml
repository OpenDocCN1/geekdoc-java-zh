  \n如果你的字符串限制在 ASCII，可以使用“修改后的 UTF-8”函数。接收 String 参数的原生方法接收一个不透明类型 `jstring`。返回 String\
  \ 值的原生方法必须返回 `jstring`。JNI 函数读取并构造 `jstring`。例如，`NewStringUTF` 函数根据 ASCII 数组创建一个\
  \ `jstring`。\n\nJNI 函数的调用约定有些奇怪。这里是调用 `NewStringUTF` 的示例：\n\n```\n![images](img/img_po12-1.png)\n\
