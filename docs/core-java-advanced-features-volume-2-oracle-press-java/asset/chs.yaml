  \n![images](img/img_p444-5.png)\n\n#### 注意 ![images](img/note.png)\n\n由于注解是由编译器求值的，因此所有元素值必须是编译时常量。例如，\n\
  \n![images](img/img_p444-6.png)\n\n#### 警告 ![images](img/caution.png)\n\n注解元素永远不能被设置为\
  \ `null`。即使是默认值 `null` 也不被允许的。这在实践中可能相当不方便。你需要寻找其他默认值，例如 `\"\"` 或 `Void.class`。\n\
  \n如果元素值是一个数组，请将其值值括在大括号中：\n\n![images](img/img_p444-7.png)\n\n如果元素只有一个值，你可以省略大括号：\n\
  \n![images](img/img_p444-8.png)\n\n由于注解元素可以是另一个注解，因此你可以构建任意复杂的注解。例如，\n\n![images](img/img_p444-9.png)\n\
  \n#### 注意 ![images](img/note.png)\n\n在注解中引入循环依赖是一个错误。例如，`BugReport` 有一个类型为 `Reference`\
  \ 的注解元素，因此 `Reference` 不能有一个类型为 `BugReport` 的元素。\n\n#### 7.4.3 注解声明\n\n注解可以出现在很多地方。它们分为两类：`声明`(`declarations`)\
  \ 和`类型使用`(`type uses`)。声明注解可以出现在以下声明处：\n\n* 包 (Packages)\n* 类（包括枚举）\n* 接口（包括注解接口）\n\
  * 方法\n* 构造方法\n* 实例字段（包括枚举常量）\n* 局部变量\n* 参数变量\n* 类型参数\n\n对于类和接口，将注解放在类或接口关键字之前：\n\
  \n![images](img/img_p445-1.png)\n\n对于变量，将它们放在类型之前：\n\n![images](img/img_p445-2.png)\n\
  \n泛型类或方法中的类型参数可以这样被注解：\n\n![images](img/img_p445-3.png)\n\n包是在 `package-info.java`\
  \ 文件中进行注解的，该文件仅包含由注解引导的包语句\n\n![images](img/img_p445-4.png)\n\n#### 注意 ![images](img/note.png)\n\
  \n局部变量的注解只能在源码级别被处理。类文件不描述局部变量。因此，当类被编译时，所有的局部变量注解都会被丢弃。同样，包的注解不会保留在源码级别以上。\n\n\
  #### 7.4.4 注解类型使用\n\n声明注解提供了有关被声明项目的一些信息。例如，在声明\n\n![images](img/img_p446.png)\n\
  \n中，断言 `userId` 参数不为 `null`。\n\n#### 注意 ![images](img/note.png)\n\n`@NonNull` 注解是\
  \ Checker Framework ([`checkerframework.org`](https://checkerframework.org))的一部分。通过该框架，你可以在程序中包含断言——例如，参数非空或\
  \ `String` 包含正则表达式。静态分析工具会检查这些断言在给定的源代码体中是否有效。\n\n现在，假设我们有一个类型为 `List<String>` 的参数，我们希望所有的字符串都不是空。这就是类型使用注解（type\
  \ use annotations）的作用所在。将注解放在类型参数之前：`List<@NonNull String>`。\n\n类型使用注解可以出现在以下位置：\n\
  \n* 与泛型类型参数一起：`List<@NonNull String>`，`Comparator.<@NonNull String> reverseOrder()`。\n\
  * 在数组的任何位置：`@NonNull String[][] words` (`words[i][j]` 非空），`String @NonNull [][]\
  \ words` (`words` 非空），`String[] @NonNull [] words` (`words[i]` 非空)。\n* 与父类和实现的接口一起：`class\
  \ Warning extends @Localized Message`。\n* 与构造方法调用一起：`new @Localized String(. . .)`。\n\
  * 与强制转换和 `instanceof` 检查一起：`(@Localized String) text`，`if (text instanceof @Localized\
  \ String)`。（注解仅供外部工具使用，对转换或 instanceof 检查没有影响。）\n* 与异常规范一起：`public String read()\
  \ throws @Localized IOException`。\n* 与通配符和类型边界一起：`List<@Localized ? extends Message>`，`List<?\
  \ extends @Localized Message>`。\n* 与方法和构造方法引用一起：`@Localized Message::getText`。\n\
  \n有一些类型位置不能被注解：\n\n![images](img/441.png)\n\n你可以将注解放在修饰符如 `private` 和 `static` 之前或之后。习惯上（但不是必须）将类型使用注解放在修饰符之后，声明注解放在修饰符之前。例如\n\
  \n![images](img/442.png)\n\n在注解 record 组件时，注解也适用于生成的字段、getter 方法和构造方法参数。\n\n####\
  \ 注意 ![images/note.png)注解作者需要指定特定注解出现的位置。如果一个注解同时允许变量和类型使用，并且它用于变量声明，那么变量和类型使用都被注解了。例如，考虑![images](img/img_p447-3.png)\n\
  \n如果 `@NonNull` 同时适用于参数和类型使用，那么 `userId` 参数被注解了，参数类型是 `@NonNull String`。\n\n####\
  \ 7.4.5 注解 this\n\n假设你想注解那些没有被方法修改的参数。\n\n![images](img/img_p447-4.png)\n\n那么处理此注解的工具在看到调用\n\
  \n![images](img/img_p447-5.png) 时，会认为 `q` 没有被改变。\n\n但 `p` 呢？\n\n当方法被调用时，`this` 变量绑定到\
  \ `p`。但它从未被声明，所以你无法对其注解。\n\n实际上，你可以声明它，使用一种稀有的语法变体，以便添加注解：\n\n![images](img/img_p448-1.png)\n\
  \n第一个参数被称为`接收参数`(receiver parameter)。它必须命名为 `this`。它的类型是正在构造的类。\n\n#### 注意 ![images/note.png)你只能为方法提供接收参数，而不用于构造方法。从概念上说，构造方法中的\
  \ `this` 引用在构造完成之前并不是给定类型的对象。相反，放置在构造方法上的注解描述的是被构造对象的属性。内部类的构造方法会接收另一个隐藏的参数，即指向外部类对象的引用。你也可以将该参数显式化：![images](img/img_p448-2.png)\n\
  \n该参数的命名必须与你引用它时一样，`EnclosingClass.this`，其类型是外部类。\n\n## 7.5 标准注解\n\n\n\n\n在 `java.lang`、`java.lang.annotation`\
  \ 和 `javax.annotation` 包中定义了许多注解接口。其中四个是元注解（meta-annotations），用于描述注解接口的行为。其他的都是普通注解，你可以用它们来标记源代码中的项。表\
  \ 7.2 显示了这些注解。将在接下来的两个章节中详细讨论它们。\n\n**表 7.2** 标准注解\n\n![images](img/img_p449.png)\n\
  \n#### 7.5.1 编译注解\n\n`@Deprecated` 注解可以附加任何不再建议使用的项上。当你使用废弃项时，编译器会发出警告。该注解的作用与 Javadoc\
  \ 中的 `@deprecated` 相同。然而，该注解持续到运行时。\n\n#### ![images](img/note.png) **注意**\n\nJDK\
  \ 的工具 `jdep` 可以扫描 `JAR` 文件中的废弃元素。\n\n`@SuppressWarnings` 注解告诉编译器抑制特定类型的警告，例如：\n\n\
  ![images](img/img_p450-1.png)\n\n`@Override` 注解仅适用于方法。编译器会检查带有此注解的方法是否重写了父类的方法。例如，如果你声明了\n\
  \n![images](img/img_p450-2.png)\n\n那么编译器将报告错误。毕竟 `equals` 方法 *并没有* 重写 `Object` 类的\
  \ `equals` 方法，因为该方法的参数类型不是 `MyClass`。\n\n`@Generated` 注解供代码生成器使用。任何生成的代码都可以被注解，以区分于程序员编写。代码编辑器可以隐藏生成的代码，或者代码生成器可以移除旧版本的代码。每个注解必须包含一个用于生成器的唯一标识符。日期字符串（ISO\
  \ 8601 格式）和注释字符串是可选的。例如：\n\n![images](img/img_p450-3.png)\n\n#### 7.5.2 元注解\n\n\
  `@Target` 元注解应用于注解，限制注解生效的项。例如：\n\n![images](img/img_p450-4.png)\n\n表 7.3 显示了所有值。它们属于枚举类型\
  \ `ElementType`。你可以在括号中指定任意数量的元素类型。\n\n没有 `@Target` 限制的注解可以应用于任何项。编译器会检查你是否将注解应用于允许的项上。例如，如果你在字段上应用\
  \ `@BugReport`，会导致编译错误。\n\n`@Retention` 元注解指定注解保留多长时间。你可以指定表 7.4 中的任意一个值。默认值是 `RetentionPolicy.CLASS`。\n\
  \n**表 7.3** @Target 注解的元素类型\n\n![images](img/img_p451-1.png)\n\n**表 7.4** @Retention\
  \ 注解的保留策略\n\n![images](img/img_p451-2.png)\n\n在第 418 页的代码列表 7.8 中，`@ActionListenerFor`\
  \ 注解使用了 `RetentionPolicy.RUNTIME`。在接下来的两个章节中，你将看到源码和类文件级别处理注解的示例。\n\n`@Documented`\
  \ 元注解为 Javadoc 等文档工具提供了提示。为了文档目的，被标记的注解应该像 `protected` 或 `static` 等其他修饰符一样。其他注解的使用不会包含在文档中。例如，假设我们将\
  \ `@ActionListenerFor` 声明为标记注解：\n\n![images](img/img_p452-1.png)\n\n现在，每个被注解方法的文档都包含了该注解，如图\
  \ 7.2 所示。\n\n![images](img/img_p452-2.png)\n\n**图 7.2** 标记注解\n\n如果一个注解是瞬时的（例如 `@BugReport`），你可能不应该记录它的用法。\n\
  \n#### ![images](img/note.png) **注意**\n\n将注解应用于自身是合法的。例如，`@Documented` 注解本身标记为 `@Documented`。因此，注解的\
  \ Javadoc 文档会显示它们是否被标记。\n\n`@Inherited` 元注解仅适用于类的注解。当一个类具有继承注解时，其所有子类都自动拥有相同的注解。这使得创建像标记接口一样工作的注解变得简单，例如\
  \ `Serializable`。\n\n事实上，一个 `@Serializable` 注解比没有方法的 `Serializable` 标记接口更合适。一个类是可序列化的，是因为运行时支持读写其字段，而不是因为任何面向对象的设计原则。注解比接口继承能更好地描述这一事实。当然，`Serializable`\
  \ 接口是在 JDK 1.1 创建的，远早于注解。\n\n假设你定义了一个继承注解 `@Persistent`，表示类的对象可以保存到数据库中。那么持久化类的子类会自动被标记为持久化。\n\
  \n![images](img/img_p453-1.png)\n\n当持久化机制搜索要存储在数据库的对象时，它将同时检测到 `Employee` 和 `Manager`\
  \ 对象。\n\n从 Java 8 开始，在项上多次应用同一个注解类型是合法的。为了向后兼容，重复注解的实现者需要提供一个*容器注解*，用以数组形式持有重复的注解。\n\
  \n以下是定义 `@TestCase` 注解及其容器的方法：\n\n![images](img/img_p453-2.png)\n\n当用户提供多个 `@TestCase`\
  \ 注解时，它们会被封装进 `@TestCases` 注解。\n\n#### ![images](img/caution.png) **注意**\n\n处理重复注解时必须小心。如果你调用\
  \ `getAnnotation` 来查找重复注解，而该注解实际上是重复的，你将得到 `null`。这是因为重复注解被封装成了容器注解。\n\n在这种情况下，你应该调用\
  \ `getAnnotationsByType`。该调用会“透视”容器并给你重复注解的数组。通过这种方法，你不需要担心容器注解。\n\n## 7.6 源码级注解处理\n\
  \n在前面的章节中，你看到了如何在运行程序中分析注解。注解的另一种用途是对源文件进行自动处理，以生成源码、配置文件、脚本或其他任何想要的内容。\n\n####\
  \ 7.6.1 注解处理器\n\n注解处理集成在 Java 编译器中。在编译期间，可以通过运行以下命令来*调用注解处理器*：\n\n```\n![images](img/img_p454-1.png)\n\
  ```\n\n编译器定位源文件的注解。依次执行每个注解处理器并赋予它们感兴趣的注解。如果注解处理器创建了新的源文件，则重复该过程。当一个处理轮不再产生更多源文件时，所有源文件将被编译。\n\
  \n#### ![images](img/note.png) **注意**\n\n注解处理器只能生成新的源文件。它不能修改现有的源文件。\n\n注解处理器实现\
  \ `Processor` 接口，通常通过扩展 `AbstractProcessor` 类。你需要指定你的处理器支持哪些注解。在我们的例子中：\n\n```\n\
  ![images](img/img_p454-2.png)\n```\n\n处理器可以声明特定的类型、通配符如 `\"com.horstmann.*\"`（com.horstmann\
  \ 包或任何子包中的所有注解），甚至是 `\"*\"`（所有注解）。\n\n`process` 方法每轮被调用一次，参数是本轮在任何文件中找到的所有注解，以及一个包含当前处理轮信息的\
  \ `RoundEnvironment` 引用。\n\n#### 7.6.2 语言模型 API\n\n\n\n\n\n使用 `language model` API\
  \ 来分析源码级别的注解。与反射 API 不同（反射 API 提供的是类和方法的虚拟机表示），语言模型 API 允许你根据 Java 语言的规则来分析 Java\
  \ 程序。\n\n编译器会生成一个树，其节点是实现了 `javax.lang.model.element.Element` 接口及其子接口的实例：`TypeElement`、`VariableElement`、`ExecutableElement`\
  \ 等。这些是反射类 `Class`、`Field/Parameter`、`Method/Constructor` 在编译期间的对应物。\n\n我不想详细介绍该\
  \ API，但这里有你在处理注解时需要了解的重点：\n\n*   `RoundEnvironment` 为你提供所有带有特定注解的元素集合。调用方法![images](img/img_p455-1.png)\n\
  *   `AnnotateElement` 接口的源码级等价物是 `AnnotatedConstruct`。使用方法\n    ![images](img/img_p455-2.png)\n\
  \    获取给定注解类的注解或重复注解。\n*   `TypeElement` 代表一个类或接口。`getEnclosedElements` 方法产生其字段和方法的列表。\n\
  *   在 `Element` 上调用 `getSimpleName` 或在 `TypeElement` 上调用 `getQualifiedName` 会产生一个\
  \ `Name` 对象，可以通过 `toString` 将其转换为字符串。\n\n#### 7.6.3 使用注解生成源代码\n\n作为一个示例，我们将使用注解来减少实现\
