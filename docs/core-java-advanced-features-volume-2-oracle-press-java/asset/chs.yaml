  \    如果此 `Optional` 不为空，则将其值传递给 `action`。\n*   `void ifPresentOrElse(Consumer<?\
  \ super T> action, Runnable emptyAction)` 9\n    如果此 `Optional` 不为空，则将其值传递给 `action`，否则调用\
  \ `emptyAction`。\n\n#### 1.7.3 Optional 值的管道化\n\n在前面的章节中，你已经看到了如何从 `Optional` 对象中获取值。另一个有效的策略是保持\
  \ `Optional` 完整。你可以通过使用 `map` 方法转换 `Optional` 内部的值：\n\n![images](img/img_p41-3.png)\n\
