  \n假设弧的中心是原点，点 (x, y) 在弧上。你可以使用以下公式得到倾斜角度：\n\n![images](img/img_p670-3.png)\n\n结果是\
  \ -180 到 180 之间的值。以这种方式计算倾斜结束角。然后计算这两个角度之间的差。如果起始角度为负，给起始角度加上 360。然后将起始角度和差传递给构造函数。\n\
  \n如果你运行本节末的示例程序，可以肉眼检查此计算是否为弧构造函数提供了正确的值（参见图 9.39 第 652 页）。\n\n![images](img/img_p671-1.png)\n\
  \n**图 9.36** 弧类型\n\nJava 2D API 支持*二次*和*三次*曲线。在本章中，我们不深入研究这些曲线的数学。你可以通过运行列表 9.15\
  \ 中的程序来感受曲线的外观。正如图 9.37 和 9.38 所示所示，二次曲线和三次曲线通过两个*端点*和一个或两个*控制点*指定。移动控制点会改变曲线的形状。\n\
  \n![images](img/img_p671-2.png)\n\n**图 9.37** 二次曲线\n\n![images](img/img_p672-1.png)\n\
  \n**图 9.38** 三次曲线\n\n要构造二次和三次曲线，给出端点和控制点的坐标。例如，\n\n\n\n\n\n![images](img/img_p672-2.png)\n\
  \n二次曲线并不灵活，在实践中并不常用。然而，三次曲线（例如由 `CubicCurve2D` 类绘制的贝塞尔曲线）非常常见。通过组合许多三次曲线并使连接处的斜率相匹配，你可以创建复杂且看起来平滑的弯曲形状。更多信息，请参考\
  \ John F. Hughes 等人编写的 *Computer Graphics: Principles and Practice, Third Edition*。\n\
  \n你可以构建由线段、二次曲线和三次曲线构成的任意序列，并将它们存储在 `GeneralPath` 对象中。使用 `moveTo` 方法指定路径的第一个坐标，例如：\n\
  \n![images](img/img_p672-3.png)\n\n然后你可以通过调用 `lineTo`、`quadTo` 或 `curveTo` 其中一个方法来扩展路径。这些方法通过直线、二次曲线或三次曲线来扩展路径。调用\
  \ `lineTo` 时，提供终点。对于两个曲线方法，先提供控制点，然后提供终点。例如：\n\n![images](img/img_p672-4.png)\n\n\
  调用 `closePath` 方法关闭路径。它会绘制一条返回到路径起始点的直线。\n\n要创建一个多边形，只需调用 `moveTo` 跳到第一个角点，然后重复调用\
  \ `lineTo` 访问其他角点。最后，调用 `closePath` 关闭多边形。代码列表 9.15 中的程序更详细地展示了这一点。\n\n通用路径不需要是连接的。你可以在任何时间调用\
  \ `moveTo` 来开始一个新的路径段。\n\n最后，你可以使用 `append` 方法向通用路径添加任意的 `Shape` 对象。形状的轮廓被添加到路径的末尾。如果\
  \ `append` 方法的第二个参数为 true，则新形状将连接到路径上的上一个点，否则为 false。例如，该调用\n\n![images](img/img_p673-1.png)\n\
  \n将一个矩形的轮廓追加到路径中，但不将其与现有路径连接。但是\n\n![images](img/img_p673-2.png)\n\n会从路径的终点到矩形的起点添加一条直线，然后将矩形的轮廓添加到路径中。\n\
  \n代码列表 9.15 中的程序允许你创建示例路径。图 9.37 和 9.38 显示了程序的示例运行。你可以从组合框中选择形状生成器。程序包含以下形状的生成器：\n\
  \n*   直线\n*   矩形、圆角矩形和椭圆\n*   弧（除了弧本身外显示边界矩形的起始和结束角的线）\n*   多边形（使用 `GeneralPath`）\n\
  *   二次和三次曲线\n\n使用鼠标调整控制点。当你移动它们时，形状会不断重绘。\n\n程序有点复杂，因为它处理多个形状并支持拖动控制点。\n\n抽象父类 `ShapeMaker`\
  \ 封装了形状生成器类的共性。每个形状都有固定数量的控制点供用户移动。`getPointCount` 方法返回该值。抽象方法\n\n![images](img/img_p673-3.png)\n\
  \n```\n```computes 给控制点的当前位置，计算出实际形状。`toString` 方法返回类名，以便 `ShapeMaker` 对象可以简单地丢到\
  \ `JComboBox` 中。\n\n为了启用控制点的拖动，`ShapePanel` 类处理了鼠标和鼠标移动事件。如果鼠标在矩形上被按下，随后的鼠标拖动将移动矩形。\n\
  \n大多数形状生成器类都是简单的——它们的 `makeShape` 方法只需构造并返回请求的形状。然而，`ArcMaker` 类需要计算变形的起始和结束角度。此外，为了证明计算确实正确，返回的形状是一个\
  \ `GeneralPath`，包含弧本身、边界矩形以及从弧中心到角度控制点的线（见图 9.39）。\n\n![images](img/img_p674-1.png)\n\
