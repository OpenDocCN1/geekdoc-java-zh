  \n![images](img/img_p630-3.png)\n\n**图 9.21** 森林\n\n让我们从树的根节点转向叶子节点。注意，叶子节点的图标与其他节点不同（参见图\
  \ 9.22\n\n**图 9.22** 叶子和文件夹图标\n\n节点渲染器需要知道每个节点应该使用哪种图标。默认情况下，决策过程如下：如果节点的 `isLeaf`\
  \ 方法返回 `true`，则使用叶子图标；否则使用文件夹图标。\n\n`DefaultMutableTreeNode` 类的 `isLeaf` 方法在节点没有子节点时返回\
  \ `true`。因此，有子节点的节点获得文件夹图标，而没有子节点的节点获得叶子图标。\n\n有时，这种行为并不恰当。假设我们在示例树中添加了一个“Montana”的节点，但我们不知道应该添加哪些城市。我们不希望该状态节点获得叶子图标，因为从概念上说，只有城市才是叶子节点。\n\
  \n`JTree` 类不知道哪些节点应该是叶子节点。它询问树模型。如果一个没有子节点的节点不是自动成为概念叶子，你可以要求树模型使用不同的标准来判断叶子属性——即查询“允许子节点”节点属性。\n\
  \n对于那些不应该有子节点的节点，调用：\n\n![images](img/img_p631-2.png)\n\n然后，告诉树模型询问“允许子节点”属性的值，以确定节点是否应该以叶子图标显示。使用\
  \ `DefaultTreeModel` 类的 `setAsksAllowsChildren` 方法来设置此行为：\n\n![images](img/img_p631-3.png)\n\
  \n有了这种决策准则，允许子节点的节点获得文件夹图标，而不允许子节点的节点获得叶子图标。\n\n或者，如果你从根节点构建树，可以在构造函数中提供“询问允许子节点”属性的设置。\n\
  \n![images](img/img_p632.png)\n\n#### **javax.swing.JTree** 1.2\n\n*   `JTree(TreeModel\
  \ model)`\n    从树模型构建树。\n*   `JTree(TreeNode root)`\n*   `JTree(TreeNode root, boolean\
