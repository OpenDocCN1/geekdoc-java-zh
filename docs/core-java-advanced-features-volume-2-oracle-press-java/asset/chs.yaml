  \n设置或获取数字整数或小数部分允许的最大或最小位数。\n\n#### 6.2.2 DecimalFormat 类\n\n在大多数语言区域中，你在上一节中看到的\
  \ `NumberFormat` 工厂方法会返回 `DecimalFormat` 类的实例。该类描述了世界范围内发生的格式化变化。你可以修改单独设置，也可以创建一个全新的格式化器。模式语法让这变得更加方便。\n\
