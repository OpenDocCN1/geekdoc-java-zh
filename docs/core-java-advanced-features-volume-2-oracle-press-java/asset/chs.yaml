  \ 9.2.1 编辑树与路径\n\n在接下来的示例中，你将看到如何编辑树。图 23 显示了用户界面。如果你点击添加兄弟节点或添加子节点，程序会添加一个新节点。如果你点击删除按钮，程序会删除选中的节点。\n\
  \n![images](img/img_p633.png)\n\n**图 23** 编辑树\n\n为了实现这一点，你需要找到选中的节点。你可能会奇怪为什么 `JTree`\
  \ 类需要路径。它难道不能获取 `TreeNode` 并调用 `getParent()` 吗？事实上，`JTree` 类对 `TreeNode` 接口一无所知。该接口从未被\
  \ `TreeModel` 使用；它只 `DefaultTreeModel`。链接节点是树模型的工作。因此，`JTree` 类总是需要完整的路径。\n\n`TreePath`\
  \ 类管理一组 `Object`（而不是 `TreeNode`！）引用。许多 `JTree` 方法会返回 `TreePath` 对象。当你有一个树路径时，通常需要知道终端节点，可以通过\
  \ `getLastPathComponent()` 获取它。例如，要找到树中选中的节点，使用 `JTree` 的 `getSelectionPath()` 方法。\n\
  \n![images](img/img_p634-2.png)\n\n实际上，由于这种特定的查询非常常见，有一个方便的方法可以直接给出选中的节点：\n\n![images](img/img_p634-3.png)\n\
  \n该方法没有名为 `getSelectedNode`，因为树不知道它包含节点——它的树模型处理的是路径。\n\n![images](img/img_p634-1.png)\n\
  \n**图 24** 树路径\n\n![images](img/note.png) **注意**\n\n树路径是 `JTree` 类描述节点的两种方式之一。许多\
  \ `JTree` 方法接收或返回整数索引——行位置。行位置仅仅是节点在树显示中的行号（从 0 开始）。只有可见节点才有行号，而且如果它之前的节点被展开、折叠或修改，节点的行号就会改变。因此，你应该避免使用行位置。所有使用行位置的\
  \ `JTree` 方法都有使用树路径的对应方法。\n\n一旦获得了选中的节点，就可以对其进行编辑。但是，不要直接向树节点添加子节点：\n\n\n\n\n\n\
  ![images](img/img_p635-1.png)\n\n如果你更改了节点的结构，你就更改了模型，但关联的视图不会收到通知。你可以自己发送通知，但如果你使用\
  \ `DefaultTreeModel` 类的 `insertNodeInto` 方法，模型类会处理该操作。例如，下面的调用会将一个新节点作为所选节点的最后一个子，并通知树视图：\n\
  \n![images](img/img_p635-2.png)\n\n相应的调用 `removeNodeFromParent` 会移除一个节点并通知视图：\n\n\
  ![images](img/img_p635-3.png)\n\n如果你保持节点结构不变但更改了用户对象（user object），则应该调用以下方法：\n\n\
  ![images](img/img_p635-4.png)\n\n自动通知是使用 `DefaultTreeModel` 的主要优势。如果你提供自己的树模型，则必须手动实现自动通知。（详情请参阅\
  \ Kim Topley 写的 *Core Swing*。）\n\n### ![images](img/caution.png) 注意\n\n`DefaultTreeModel`\
  \ 类有一个 `reload` 方法，可以重新加载整个模型。然而，不要仅仅在做出一些更改后就调用 `reload` 来更新树。当树重新生成时，根节点节点之外的所有节点都会再次折叠。如果用户必须在每次更改后都重新展开树，将令他们感到非常困惑。\n\
  \n当视图收到节点结构变化的通知时，它会更新显示，但不会自动展开以显示新添加的子节点。特别是，如果示例程序中的用户向一个当前折叠状态的节点添加新子节点，新节点将静默地添加到折叠的子树中。这让用户无法获得命令已实际执行的反馈。在这种情况下，你应该特意展开所有父节点，以便新添加的节点变得可见。为此，请使用\
  \ `JTree` 类的 `makeVisible` 方法。`makeVisible` 方法期望一个通向应显示节点的树路径（tree path）。\n\n因此，你需要构建一个从根节点到新插入节点的树路径。要获取树路径，首先调用\
  \ `DefaultTreeModel` 类的 `getPathToRoot` 方法。它返回一个包含从节点到根节点所有节点的 `TreeNode[]` 数组。将该数组传递给\
  \ `TreePath` 构造函数。\n\n例如，这里是让新节点可见的方法：\n\n![images](img/img_p636-1.png)\n\n### ![images](img/note.png)\
