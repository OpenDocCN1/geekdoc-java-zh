  \n## 9.5 打印\n\n在以下章节中，我将展示如何在单页纸上打印、如何管理多页输出，以及如何将输出保存为 PostScript 文件。\n\n#### 9.5.1\
  \ 图形打印\n\n在本节中，我们将处理最常见的打印情况：打印二维图形。当然，图形可以包含各种字体的文本，也可以完全由文本组成。\n\n要生成输出，你需要处理以下两个任务：\n\
  \n* 提供实现 `Printable` 接口的对象\n* 打印作业\n\n`Printable` 接口有一个方法：\n\n![images](img/img_p741-1.png)\n\
  \n当打印引擎需要对页面进行格式化时，就会调用该方法。你的代码将文本和图像绘制到图形上下。页面格式告知纸张大小和页边距。页码告知渲染哪一页。\n\n启动打印作业，使用\
  \ `PrinterJob` 类。首先调用静态方法 `getPrinterJob` 获取打印作业对象。然后设置你想打印的 `Printable` 对象。\n\n\
  ![images](img/img_p741-2.png)\n\n#### ![images](img/caution.png) 注意\n\n`PrintJob`\
  \ 类处理 JDK 1.1 风格的打印。该类现在过时。不要与 `PrinterJob` 类混淆。\n\n在启动打印作业之前，你应该调用 `printDialog`\
  \ 方法显示打印对话框。该对话框允许用户选择要使用的打印机（如果有多台可用打印机）、打印的页范围以及各种打印设置。\n\n在一个实现 `PrintRequestAttributeSet`\
  \ 接口的类对象中收集打印设置，例如 `HashPrintRequestAttributeSet` 类。\n\n![images](img/img_p742-2.png)\n\
  \n添加属性设置并将属性对象传递给 `printDialog` 方法。\n\n\n\n\n\n`printDialog` 方法在用户点击 OK 时返回 true，在用户取消对话框时返回\
  \ false。如果用户接受了操作，则调用 `PrinterJob` 类的 `print` 方法来启动打印过程。`print` 方法可能会抛出 `PrinterException`。以下是打印代码的概要：\n\
  \n![images](img/img_p742-3.png)\n\n#### !![images](img/note.png) **注意**\n\n在 JDK\
  \ 1.4 之前，打印系统使用宿主平台的原生打印和页面设置对话框。要显示原生打印对话框，请调用不带参数的 `printDialog` 方法。（无法在属性集集中收集用户设置。）\n\
  \n在打印期间，`PrinterJob` 类的 `print` 方法会反复调用与任务关联的 `Printable` 对象的 `print` 方法。\n\n由于任务并不知道你想打印多少页，它只是不断地调用\
  \ `print` 方法。只要 `print` 方法返回值 `Printable.PAGE_EXISTS`，打印任务就会持续生成页面。当 `print` 方法返回\
  \ `Printable.NO_SUCH_PAGE` 时，打印任务停止。\n\n#### !![images](img/caution.png) **警告**\n\
  \n打印任务传递给 `print` 方法的页码从 0 开始。\n\n因此，在打印完成之前，打印任务没有准确的页数。由于由于原因，打印对话框无法显示正确的页范围——而是显示“Pages\
  \ 1 to 1”。你将在下一节中看到如何通过向打印任务提供一个 `Book` 对象来避免这一缺陷。\n\n在打印过程中，打印任务会反复调用 `Printable`\
  \ 对象的 `print` 方法。打印任务允许对同一页进行多次调用。因此，你不应该在 `print` 方法内部计算页数，而应该始终依赖页码参数。打印任务可能对同一页反复调用\
  \ `print` 方法是有充分理由的。某些打印机（特别是针式和喷墨打印机）使用带状打印（banding）。它们一次打印一个带，推进纸张，然后打印下一个带。即使对于一次打印整页的激光打印机，打印任务也可能使用带状打印——这为打印任务提供了一种管理缓存文件大小的方法。\n\
  \n如果打印任务需要 `Printable` 对象来打印一个带，它会将图形上下文的裁剪区域设置为请求的带，并调用 `print` 方法。它的绘制操作将根据带矩形进行裁剪，只有显示在带中的绘制元素会被渲染。你的\
  \ `print` 方法不需要感知该过程，但有一点例外：它不应该干扰裁剪区域。\n\n#### !![images](img/caution.png) **警告**\n\
  \n你的 `print` 方法获得的 `Graphics` 对象也会根据页边距进行裁剪。如果你替换裁剪区域，就可以在边距之外绘图。特别是在打印机图形文中，必须尊重裁剪区域。调用\
  \ `clip` 而不是 `setClip` 来进一步限制裁剪区域。如果你必须移除裁剪区域，请确保在 `print` 方法开始时调用 `getClip` 并恢复该裁剪区域。\n\
  \n`print` 方法的 `PageFormat` 参数包含有关打印页面的信息。`getWidth` 和 `getHeight` 方法返回以点（points）衡量的纸张尺寸。（1\
  \ 点等于 1/72 英寸；1 英寸等于 25.4 毫米）。例如，A4 纸大约为 595 × 842 点，US Letter 纸为 612 × 792 点。\n\
  \n点是美国打印行业中的常用测量单位。令世界其他地方感到遗憾的是，打印包使用了点单位。这有两个目的：纸张尺寸和纸张边距是用点衡量的，而且点是所有打印图形上下文的默认单位。你可以在本节最后的示例程序中验证这一点。该程序打印了两行间距为\
  \ 72 单位的文本。运行示例程序并测量基线之间的距离；它们恰好是 1 英寸或 25.4 毫米。\n\n`PageFormat` 类的 `getWidth` 和\
  \ `getHeight` 方法为你提供了完整的纸张尺寸。并不是所有区域都是可打印的。用户通常会选择边距，即使他们不选择，打印机也需要某种方式夹住打印的纸张，因此边缘会有一小块不可打印区域。\n\
  \n`getImageableWidth` 和 `getImageableHeight` 方法告诉你实际上可以填充的区域尺寸。然而，边距不必是对称的，因此你还必须知道可打印区域的左上角（参见图\
  \ 9.61），你通过 `getImageableX` 和 `getImageableY` 方法获取。\n\n#### !![images](img/tip.png)\
  \ **提示**\n\n你在 `print` 方法中收到的图形上下文被裁剪以排除边距，但坐标系的原点仍然是纸张的左上角。将坐标系移动到可打印区域的左上角是有意义的。只需让你的\
  \ `print` 方法从：\n\n![images](img/img_p744.png)![images](img/img_p745-1.png)\n\n**图\
  \ 9.61** 页面格式测量\n\n如果你想让用户选择页边距设置，或者在不设置其他打印属性的情况下切换纵向和横向，请调用 `PrinterJob` 类的 `pageDialog`\
  \ 方法：\n\n![images](img/img_p745-2.png)\n\n#### !![images](img/note.png) **注意**\n\
  \n打印对话框的一个选项卡包含页面设置对话框（参见图 9.62）。你可能仍然想给用户一个设置页面格式的选项，特别是当你的程序对打印页面提供“所见即所得”的显示时。`pageDialog`\
  \ 方法返回一个带有用户设置的 `PageFormat` 对象。\n\n代码列表 9.23 和 9.24 中的程序显示了如何在屏幕和打印页面上渲染同一组形状。`JPanel`\
  \ 的一个子类实现了 `Printable` 接口。`paintComponent` 和 `print` 方法都调用同一个方法来执行绘制。\n\n![images](img/img_p745-3.png)![images](img/img_p746-1.png)\n\
  \n**图 9.62** 跨平台页面对话框\n\n![images](img/img_p746-2.png)\n\n点击 Print 按钮开始打印，或点击 Page\
  \ setup 按钮打开页面设置对话框代码列表 9.23](#chapter009-02.xhtml_list9-23)显示了代码。\n\n\n\n\n\n打开打印对话框，允许用户选择要打印的页面并更改打印设置。第一种方法显示跨平台对话框，第二种方法显示原生对话框。第一方法修改\
  \ `attributes` 对象以反映用户设置。如果用户接受了对话框，两种方法都会返回 true。\n\n* `PageFormat pageDialog(PrintRequestAttributeSet\
  \ attributes)`\n* `PageFormat pageDialog(PageFormat defaults)`\n\n显示页面设置对话框。第一种方法显示跨平台对话框，第二种方法显示原生对话框。两种方法都返回一个带有用户在对话框中请求的格式的\
  \ `PageFormat` 对象。第一方法修改 `attributes` 对象以反映用户设置。第二方法不会修改 `defaults` 对象。\n\n* `void\
  \ setPrintable(Printable p)`\n* `void setPrintable(Printable p, PageFormat format)`\n\
  \n设置打印作业的 `Printable` 以及可选的页面格式。\n\n* `void print()`\n* `void print(PrintRequestAttributeSet\
  \ attributes)`\n\n通过重复调用 `Printable` 的 `print` 方法并将渲染后的页面发送到打印机来打印当前的 `Printable`，直到没有更多可用页面为止。\n\
  \n### java.awt.print.PageFormat 1.2\n\n* `double getWidth()`\n* `double getHeight()`\n\
  \n返回页面的宽度和高度。\n\n* `double getImageableWidth()`\n* `double getImageableHeight()`\n\
  \n返回页面可打印区域的宽度和高度。\n\n* `double getImageableX()`\n* `double getImageableY()`\n\n\
  返回可打印区域左上角的位置。\n\n* `int getOrientation()`\n\n返回 `PORTRAIT`、`LANDSCAPE` 或 `REVERSE_LANDSCAPE`之一。页面方向对程序员是透明的，因为页面格式和图形上下文设置会自动反映页面方向。\n\
  \n#### 9.5.2 多页打印\n\n在实践中，你通常不会将原始的 `Printable` 对象传递给打印作业。相反，你应该获取一个实现了 `Pageable`\
  \ 接口的类对象。Java 平台提供了这样一个类，称为 `Book`。书籍由多个部分组成，每个部分都是一个 `Printable` 对象。要创建一个书籍，请添加\
  \ `Printable` 对象及其页数。\n\n![images](img/img_p751-1.png)\n\n然后，使用 `setPageable` 方法将\
  \ `Book` 对象传递给打印作业。\n\n![images](img/img_p751-2.png)\n\n现在，打印作业确切知道要打印多少页，因此打印对话框会显示准确的页范围，用户可以选择整个范围或子范围。\n\
  \n#### 注意事项\n\n当打印作业调用 `Printable` 部分的 `print` 方法时，它传递的是书籍的当前页码而不是每个部分的页码作为当前页码。这非常头疼——每个部分都必须知道之前部分的页数，才能使页码参数具有意义。\n\
  \n从程序员的角度来看，使用 `Book` 类最大的挑战在于，你必须在打印时知道每个部分将有多少页。你的 `Printable` 类需要一个 `layout algorithm`（布局算法）来计算材料在打印页面上的布局。在打印开始之前，调用该算法来计算分页符和总页数。你可以保留布局信息，以便在打印过程中方便地使用。\n\
  \n你必须防范用户更改了页面格式的情况。如果发生这种情况，即使你想要打印的内容没有变化，你也必须重新计算布局。\n\n[`Listing 9.26`(#chapter009-02.xhtml_list9-26)]\
  \ 显示了如何生成多页打印输出。该程序在若干页上用非常大的字符打印消息（参见图 9.63）。然后你可以修剪边距并将页面胶在一起形成一个横幅。\n\n![images](img/img_p752.png)\n\
  \n**图 9.63** 一个横幅\n\n`Banner` 类的 `layoutPages` 方法计算布局。我们首先用 72 点的字体布局消息字符串。然后我们计算结果字符串的高度，并将其与页面的可打印高度进行比较。我们从这两个测量值派出一个缩放因子。在打印字符串时，我们按该缩放因子对其放大。\n\
  \n#### 注意事项\n\n为了精确布局你的信息，你通常需要访问打印机图形上下文。遗憾的是，在实际开始之前没有获取该图形上下文的方法。在示例程序中，我们使用屏幕图形上下文，并希望屏幕和打印机的字体度量匹配。\n\
  \n`Banner` 类的 `getPageCount` 方法首先调用 `layout` 方法。然后它放大字符串的宽度并将其除以每页的可打印宽度。商（向上取整到下一个整数）即为页数。\n\
  \n听起来打印横幅可能很难，因为字符可能会跨多个页。然而，得益于 Java 2D API 的强大，事实证明完全不是问题。当请求特定页面时，我们只需使用 `Graphics2D`\
  \ 类的 `translate` 方法将字符串的左上角向左移动。然后我们设置一个等于当前页面的裁剪矩形（参见图 9.64）。最后，使用 `layout` 方法计算出的缩放因子对图形上下文进行缩。\n\
  \n![images](img/img_p753-1.png)\n\n**图 9.64** 打印横幅的一页\n\n此示例展示了变换的力量。绘制代码保持简单，变换完成了将绘制放置在相应位置的所有工作。最后，裁剪切掉超出页面的图像部分。该程序展示了变换的另一个引入胜的用途——显示打印预览。\n\
