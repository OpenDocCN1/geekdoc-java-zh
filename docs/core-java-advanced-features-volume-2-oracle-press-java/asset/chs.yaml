  - 3.10 Web 与企业级应用中的连接管理，第 226 页\n\n1996 年，Sun 发布了第一个版本的 JDBC API。该 API 让程序员能够连接到数据库，并使用结构化查询语言（SQL）进行查询或更新。（SQL\
  \ 通常读音为“sequel”，是关系型数据库访问的行业标准。）从那时起，JDBC Java Java 库中最常用的 API 之一。\n\nJDBC 经历了多次更新。在本书出版时，Java\
  \ 9 包含的 JDBC 4.3 版本是最新版本。\n\n在本章中，我将解释 JDBC 背后的核心思想。我将向你介绍（或让你重温）SQL，这种用于关系型数据库的行业标准结构化查询语言。本章提供了足够的细节和示例，让你能够开始在常见的编程场景中使用\
  \ JDBC。\n\n![images](img/note.png) **注意**\n\n根据 Oracle 的说法，JDBC 是一个注册商标，并不是 Java\
  \ Database Connectivity（Java 数据库连接）的缩写。它的命名是为了让人联想到 ODBC，一种由微软开创的标准数据库 API，后来被并入\
  \ SQL 标准。\n\n## 3.1 JDBC 的设计\n\n从一开始，Java 技术的开发者就意识到了 Java 在处理数据库方面的巨大潜力。1995 年，他们开始扩展标准\
  \ Java 库以处理对数据库的 SQL 访问。他们最初的希望是扩展 Java，使得程序能够仅使用“纯”Java 就与任何随机数据库进行通信。但他们很快意识到，这是一项无法完成的任务：现有的数据库太多了，使用的协议也太多了。此外，尽管数据库厂商都支持\
  \ Java 提供一种用于数据库访问的标准网络协议，但只有当 Java 使用*他们*的网络协议时，他们才愿意支持。\n\n所有数据库厂商和工具厂商*共同同意*的是，Java\
  \ 提供一个用于 SQL 访问的纯 Java API，并配合一个驱动程序管理器（driver manager），允许第三方驱动程序连接到特定的数据库。数据库厂商可以提供自己的驱动程序插入到驱动程序管理器。这样，就有一个简单的机制可以在驱动程序管理器注册第三方驱动程序。\n\
  \n这种组织形式遵循了微软 ODBC 的非常成功的模型，ODBC 为数据库访问提供了 C 语言接口。JDBC 和 ODBC 都基于同一个理念：根据 API 编写的程序与驱动程序管理器通信，驱动程序管理器再使用驱动程序与实际数据库通信。\n\
  \n这意味着，对于大多数程序员来说，只需要处理 JDBC API 即可。\n\n#### 3.1.1 JDBC 驱动类型\n\nJDBC 规范将驱动程序分类为以下*类型*：\n\
  \n- *类型 1 驱动程序*将 JDBC 转换为 ODBC，并依赖 ODBC 驱动程序与数据库通信。Java 的早期版本包含这样一个驱动程序，即 `JDBC/ODBC\
  \ bridge`。然而，该桥接器需要部署并正确配置 ODBC 驱动程序。JDBC 首次发布时，该桥接器对于测试非常方便，但它从未设计用于生产环境。此时，已经有了许多更好的驱动程序，且\
  \ JDK 不再提供 `JDBC/ODBC bridge`。\n\n- *类型 2 驱动程序*部分用 Java 编写，部分用原生代码编写；它与数据库的客户端 API\
  \ 通信。使用此类驱动程序，除了 Java 库外，你必须在客户端安装某些特定平台的代码。\n\n- *类型 3 驱动程序*是一个纯 Java 客户端库，它使用与平台无关的协议与服务器通信。\n\
  \n- *类型 4 驱动程序*是一个纯 Java 客户端库，它直接将 JDBC 请求转换为特定的数据库协议。\n\n![images](img/note.png)\
