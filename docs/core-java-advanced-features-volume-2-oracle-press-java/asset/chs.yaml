  ### java.io.FileInputStream 1.0\n\n*   `FileInputStream(String name)`\n*   `FileInputStream(File\
  \ file)`\n    使用 `name` 字符串指定的路径名或 `file` 对象创建一个新的文件输入流。（`File` 类在本章末尾有描述）。非绝对路径名相对于\
  \ VM 启动时设置的工作目录解析。\n\n### java.io.FileOutputStream 1.0\n\n*   `FileOutputStream(String\
  \ name)`\n*   `FileOutputStream(String name, boolean append)`\n*   `FileOutputStream(File\
  \ file)`\n*   `FileOutputStream(File file, boolean append)`\n    使用 `name` 字符串或\
  \ `file` 对象创建一个新的文件输出流。（`File` 类在本章末尾有描述）。如果 `append` 参数为 `true`，则同名的现有文件不会被删除，数据将添加到文件末尾。否则，此方法将删除任何同名的现有文件。\n\
  \n### java.io.BufferedInputStream 1.0\n\n*   `BufferedInputStream(InputStream in)`\n\
  \    创建一个缓冲输入流。缓冲输入流从流中读取字节而不会每次导致设备访问。当缓冲区为空时，会读取一个新块的数据到缓冲区。\n\n### java.io.BufferedOutputStream\
  \ 1.0\n\n*   `BufferedOutputStream(OutputStream out)`\n    创建一个缓冲输出流。缓冲输出流收集要写入的字节而不会每次都导致设备访问。当缓冲区满或刷新刷新时，数据会被写入。\n\
  \n### java.io.PushbackInputStream 1.0\n\n*   `PushbackInputStream(InputStream in)`\n\
  *   `PushbackInputStream(InputStream in, int size)`\n    构造一个具有单字节预读或指定大小推回缓冲区的输入流。\n\
  *   `void unread(int b)`\n    推回一个字节，该字节将在下次调用 `read` 时被再次获取。\n\n#### 2.1.4 文本输入输出\n\
  \n在保存数据时，你可以在二进制格式和文本格式之间选择。例如，如果整数 `1234` 以二进制格式保存，它被写为字节序列 `00 00 04 D2`（十六进制表示）。在文本格式下，它被保存为字符串\
  \ `\"1234\"`。虽然二进制 I/O 快速且高效，但人类难以阅读。我们首先讨论文本 I/O，并在第 78 页的第 2.2 节“读写二进制数据”介绍二进制\
  \ I/O。\n\n在保存文本字符串时，你需要考虑*字符编码*。在 Java 内部使用的 UTF-16 编码中，字符串 `\"José\"` 被编码为 `00\
  \ 4A 00 6F 00 73 00 E9`（十六进制）。然而许多许多预期文本文件使用不同的编码。在互联网上常用的 UTF-8 编码中，该字符串将写为 `4A\
  \ 6F 73 C3 A9`，前三个字母没有零字节，且 `é` 字符占用两个字节。\n\n`OutputStreamWriter` 类使用选定的字符编码将 Unicode\
  \ 代码单元的输出流转换为字节流。相反，`InputStreamReader` 类将包含字节（指定某些字符编码中的字符）的输入流转换为产生 Unicode 代码单元的读取器。\n\
