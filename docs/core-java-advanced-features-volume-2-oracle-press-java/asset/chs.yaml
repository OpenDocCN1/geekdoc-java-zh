  \ `PrintWriter(Writer writer, boolean autoFlush)` 构造函数来启用或禁用自动刷新：\n\n```\n\n![images](img/img_p91-3.png)\n\
  \n`print` 方法不抛异常。你可以调用 `checkError` 方法查看输出流是否发生了错误。\n\n##### ![images](img/note.png)\
  \ **注意**\n\nJava 老兵可能会好奇 `PrintStream` 类和 `System.out` 怎么了。在 Java 1.0 中，`PrintStream`\
  \ 类简单通过丢弃高位字节将所有 Unicode 字符截断为 ASCII 字符。（当时 Unicode 仍是 16 位编码）。显然，这不是一种清晰或可移植的方法，并在\
  \ Java 1.1 引入读取器和写入器后得到了解决。为了与代码兼容，`System.in`、`System.out` 和 `System.err` 仍然是输入输出流，而不是读取器和写入器。但现在\
  \ `PrintStream` 类内部以相同 `PrintWriter`的方式转换 Unicode 字符。`PrintStream` 类型的对象在使用 `print`\
  \ 和 `println` 方法时的行为与打印器完全相同，但与写入器不同，它们允许通过 `write(int)` 和 `write(byte[])` 方法输出原始字节。\n\
  \n\n\n\n\n打印包含 Unicode 编码单元的字符串。\n\n*   `void println(String s)`\n    打印字符串并在后跟一个换行符。如果输出流处于自动刷新模式，则冲刷输出流。\n\
  \n*   `void print(char[] s)`\n    打印给定数组中的所有 Unicode 编码单元。\n\n*   `void print(char\
  \ c)`\n    打印一个 Unicode 编码单元。\n\n*   `void print(int i)`\n*   `void print(long l)`\n\
  *   `void print(float f)`\n*   `void print(double d)`\n*   `void print(boolean b)`\n\
  \    以文本格式打印给定的值。\n\n*   `void printf(String format, Object... args)`\n    按照格式字符串指定的格式打印给定值。格式字符串的规范请参见第卷\
  \ I 第 2 章。\n\n*   `boolean checkError()`\n    如果发生格式化或输出错误，则返回 true。一旦输出流遇到错误，它就会被污染，随后所有对\
  \ `checkError` 的调用都会返回 true。\n\n### 2.1.6 如何读取文本输入\n\n处理任意文本最简单的方法是我们在第卷 I 中广泛使用的\
