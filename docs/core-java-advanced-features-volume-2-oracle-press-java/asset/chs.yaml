  \  注销此 `subject`。如果操作成功，则返回 `true`。\n\n## 8.9 数字签名\n\n如所述，applet（小程序）是引发 Java 热潮的起点。在实践中，人们发现尽管他们可以编写动画\
  \ applet（例如著名的“神经质文本”），但在 JDK 1.0 安全模型下，applet 无法完成许多有用操作。例如，由于 JDK 1.0 下的 applet\
  \ 受到严格监控，即使从公司安全的内部网中执行 applet 的风险相对较小，它们也无法发挥太大作用。Sun 公司很快意识到，要让 applet 变得真正有用，用户需要能够根据\
  \ applet 的来源分配不同级别的安全权限。如果 applet 来自信任的供应商且未被篡改，该 applet 的用户就可以决定是否赋予该 applet 更多权限。\n\
  \n为了对 applet 给予信任，我们需要知道两点：\n\n* applet 来自于哪里？\n* 代码在传输过程中是否被损坏了？\n\n在过去的 50 年里，数学家和计算机科学家开发了复杂的算法，以确保数据的完整性并创建电子签名。`java.security`\
  \ 包包含了许多此类算法的实现。幸运的是，在使用 `java.security` 包中的算法时，并不理解底层的数学原理。在接下来的章节中，我将向你展示消息摘要（message\
  \ digests）如何检测数据文件的变化，以及数字签名如何证明签名者的身份。\n\n#### 8.9.1 消息摘要\n\n消息摘要是数据块的数字指纹。例如，所谓的\
  \ `SHA-1`（安全哈希算法 #1）将任何长度的数据块压缩成一个 160 位（20 字节）的序列。就像真实的指纹一样，人们希望没有两个不同的消息具有相同的\
  \ `SHA-1` 指纹。当然，这并不可能的——因为只有 `2¹⁶⁰` 个 `SHA-1` 指纹，因此某些消息一定具有相同的指纹。但 `2¹⁶⁰` 是一个极其巨大的数字，以至于碰撞的概率可以忽略不计。微小到什么程度呢？根据\
  \ James Walsh 在*True Odds: How Risks Affect Your Everyday Life*（Merritt Publishing,\
  \ 1996）中的描述，你被雷电击死的概率大约是 30,000 分之一。现在，想想另外九个人——例如，你最不喜欢的九个经理或教授。你和他们所有人被雷电击死的概率，高于伪造消息与原始消息具有相同\
  \ `SHA-1` 指纹的概率。（当然，会有超过十个人（其中你可能一个都不认识）死于雷击。然而，我们讨论的是你所选的这组特定人被消灭的概率要低得多。）\n\n\
  消息摘要有两个基本属性：\n\n* 如果数据的一个位或多个位发生变化，消息摘要也会随之改变。\n* 拥有给定消息的伪造者无法构造出一个与原始消息具有相同摘要的伪消息。\n\
  \n第二个属性同样是一个概率问题。考虑以下这位万富翁父亲的消息：\n\n> *“在我去世后，我的财产应在孩子们之间平分；然而，我的儿子乔治将一无所有。”*\n\n\
  这条消息（带有最后的换行符）的 `SHA-1` 指纹为：\n\n![images](img/img_p555.png)\n\n不信任的父亲将消息交给了一位律师，将指纹交给了另一位。现在，假设乔治贿赂了持有消息的律师。他想修改消息，让比尔一无所有。当然，这会让指纹变成一个完全不同的位模式：\n\
  \n![images](img/img_p556-1.png)\n\n乔治能找到其他匹配该指纹的措辞吗？如果他从地球形成起就拥有一亿台计算机，每台每秒计算百万次，他可能仍然无法找到一条可以替换的消息。\n\
  \n已经设计了许多算法来计算此类消息摘要。其中包括美国国家标准与技术研究院（NIST）开发的安全哈希算法 `SHA-1`，以及由麻理工的 Ronald Rivest\
  \ 发明的算法 `MD5`。这两种算法都以巧妙的方式打乱消息的位。关于这些算法的细节，请参考 William Stallings 编写的*Cryptography\
  \ and Network Security, Seventh Edition*（Prentice Hall, 2017）。然而，在两种算法中都发现了细微的规律，NIST\
  \ 建议切换到更强的替代方案。Java 支持 SHA-2 和 `SHA-3` 算法集。\n\n`MessageDigest` 类是创建封装指纹算法对象的工厂。它有一个静态方法\
  \ `getInstance`，返回一个扩展 `MessageDigest` 的子类对象。这意味着 `MessageDigest` 类承担了双重职责：\n\n\
  * 作为工厂类\n* 作为所有消息摘要算法的父类\n\n例如，以下是获取可以计算 SHA 指纹的对象的方法：\n\n![images](img/img_p556-2.png)\n\
  \n获取 `MessageDigest` 对象后，通过反复调用 `update` 方法将消息中的所有字节传递进去。例如，以下代码将文件的所有字节传递给刚刚创建的\
  \ `alg` 对象以进行取纹：\n\n![images](img/img_p556-3.png)\n\n或者，如果你有了字节数组，可以一次性更新整个数组：\n\
  \n![images](img/img_p556-4.png)\n\n完成后，调用 `digest` 方法。该方法会根据指纹算法的要求对输入进行填充，执行计算，并返回字节数组形式摘要。\n\
  \n![images](img/img_p557-1.png)\n\n列表 8.20 中的程序计算消息摘要。你可以在命令行中指定文件和算法：\n\n![images](img/img_p557-2.png)\n\
  \n\n\n\n\n如果你没有提供命令行参数，系统将提示你文件名和算法名称。\n\n### 列表 8.20 `hash/Digest.java`\n\n![images](img/img_p557-3.png)\n\
  \n#### `java.security.MessageDigest` 1.1\n\n* `static MessageDigest getInstance(String\
  \ algorithmName)`\n  返回一个实现指定算法的 `MessageDigest` 对象。如果未提供算法，则抛出 `NoSuchAlgorithmException`。\n\
  * `void update(byte input)`\n* `void update(byte[] input)`\n* `void update(byte[]\
  \ input, int offset, int len)`\n  使用指定的字节更新摘要值。\n* `byte[] digest()`\n  完成哈希计算，返回计算出的摘要，并重置算法对象。\n\
  * `void reset()`\n  重置摘要值。\n\n#### 8.9.2 消息签名\n\n在上一节中，你了解了如何计算消息摘要——这是原始消息的指纹。如果消息被篡改，篡改后消息的指纹将与原始消息的指纹不匹配。如果消息和其指纹分别递送，接收者可以检查消息是否被篡改过。然而，如果消息和指纹都被截获，修改消息并重新计算指纹是一件易事。毕竟，消息摘要算法是公开的，而且它们不需要密钥。在这种情况下，伪造消息和重新计算的指纹的接收者永远不会知道消息已被篡改。数字签名解决了这个问题。\n\
  \n为了帮助你理解数字签名的工作原理，让我们来看公钥加密学领域中的几个概念。公钥加密学基于公钥和私钥的概念。其核心思想是向世界上所有人公布你的公钥。然而，只有你持有私钥，保护好它且不泄露给他人至关重要。密钥之间通过数学关系进行匹配，尽管这些关系的具体性质对我们来说并不重要。（如果你感兴趣，可以在《应用密码学手册》中查找，网址为\
  \ [www.cacr.math.uwaterloo.ca/hac](http://www.cacr.math.uwaterloo.ca/hac)。）\n\n\
  密钥非常长且复杂。例如，这里有一对匹配的数字签名算法（DSA）公钥和私钥。\n\n公钥：\n\n![images](img/img_p559-1.png)\n\n\
  私钥：\n\n![images](img/img_p559-2.png)\n\n据认为，从一个密钥计算出另一个密钥在实践上是不可能的。也就是说，尽管每个人都知道你的公钥，在你有生范围内，无论他们拥有多少计算资源，都无法计算出你的私钥。\n\
  \n可能很难相信无法从公钥计算出私钥——但目前还没有人找到一种针对现常用加密算法来实现此目的的算法。如果密钥足够长，暴力破解——简单地尝试所有可能的密钥——所需的计算机数量将比太阳系中所有原子构建的计算机还要多，并且需要计算数千年。当然，有人可能会发明比暴力破解更聪明的密钥计算算法。例如，RSA\
  \ 算法（由 Rivest、Shamir 和 Adleman 发明的加密算法）依赖于大数分解的困难。在过去的 20 年里，许多顶尖数学家都尝试发明良好的分解算法，但到目前为止还没有成功。出于这个原因，大多数密码学家认为，“模数”为\
  \ 2000 位或以上的密钥目前完全可以防御任何攻击。DSA 也被认为同样安全。\n\n图 8.15 展示了该过程在实践中是如何运作的。\n\n![images](img/img_p560.png)\n\
  \n**图 8.15** 使用 DSA 公钥签名交换\n\n假设 Alice 想给 Bob 发送消息，Bob 想知道这条消息来自 Alice 而不是冒充者。Alice\
  \ 写下消息并用她的私钥对消息摘要签名。Bob 获取她的公钥副本。然后 Bob 使用公钥验证签名。如果验证通过，Bob 可以确认两个事实：\n\n* 原始消息没有被篡改。\n\
  * 消息是由 Alice 签名的私私钥持有者。\n\n你可以看到私钥的安全性为什么如此重要。如果有人偷了 Alice 的私钥，或者政府要求她交出私钥，她就有麻烦了。小偷或政府特工现在可以通过发送消息（如转账指令）冒充她的身份，其他人会相信这些是来自\
  \ Alice 的。\n\n#### 8.9.3 验证签名\n\nJDK 自带 `keytool` 程序，这是一个用于生成和管理一组证书的命令行工具。我们预计该工具的功能最终将嵌入到其他更用户友好的程序中。但现在，我们将使用\
  \ `keytool` 来演示 Alice 如何签名文档并发送给 Bob，以及 Bob 如何验证该文档确实是由 Alice 签名而非冒充者签名的。\n\n`keytool`\
  \ 程序管理密钥库（keystores）——证书和私/公钥对的数据库。密钥库中的每个条目都有别名（alias）。以下是 Alice 创建 `alice.certs`\
  \ 密钥库并生成别名为 `alice` 的密钥对的方法：\n\n![images](img/img_p561-1.png)\n\n在创建或打开密钥库时，系统会提示你输入密钥库密码。为了本示例，请使用\
  \ `secret`。如果你出于严肃用途使用密钥库，在生成密钥时，系统会提示输入以下信息：\n\n![images](img/img_p561-2.png)\n\
  \n`keytool` 使用 X.500 格式：通用名 (CN)、部门单位 (OU)、组织 (O)、位置 (L)、州 (ST) 和国家 (C)，用于识别密钥所有者和发行者。最后指定密钥密码。\n\
  \n假设 Alice 想把她的公钥给 Bob。她需要导出证书：\n\n![images](img/img_p562-1.png)\n\n当 Bob 收到证书时，可以打印它：\n\
  \n![images](img/img_p562-2.png)\n\n输出如下：\n\n![images](img/img_p562-3.png)\n\n如果\
  \ Bob 想检查他得到的是正确的证书，可以致电 Alice 验证证书指纹。\n\n#### 注意\n\n某些证书发行会在其网站上发布证书指纹。例如，要检查 `jre*/lib/security/cacerts`\
  \ 目录下的密钥库，使用 `-list` 选项：\n\n![images](img/img_p562-4.png)\n\n该密钥库的密码为 `changeit`。密钥库中的证书之一是：\n\
  \n![images](img/img_p563-1.png)\n\n你可以通过访问网站 [www.digicert.com/digicert-root-certificates.htm](http://www.digicert.com/digicert-root-certificates.htm)\
  \ 来检查你的证书是否有效。一旦 Bob 信任该证书，就可以将其导入自己的密钥库。\n\n![images](img/img_p563-2.png)\n\n####\
  \ 警告\n\n切勿将你不完全信任的证书导入密钥库。一旦证书添加到密钥库，任何使用该密钥库的程序都会认为该证书可以验证签名。\n\n现在 Alice 可以开始向\
  \ Bob 发送签名文档了。`jarsigner` 工具用于签名和验证 JAR 文件。Alice 只需将要签名的文档放入 JAR 文件中。\n\n![images](img/img_p563-3.png)\n\
  \n然后她使用 `jarsigner` 工具为文件添加签名。她需要指定密钥库、JAR 文件以及要使用的密钥别名。\n\n![images](img/img_p563-4.png)\n\
  \n\n\n\n\n![images](img/img_p563-5.png)\n\nBob 不需要指定密钥别名。`jarsigner` 程序会在数字签名中找到密钥所有者的\
  \ X.500 名称，并在密钥库（keystore）中查找匹配的证书。\n\n如果 JAR 文件未损坏且签名匹配，`jarsigner` 程序将打印：\n\n\
  ![images](img/img_p563-6.png)\n\n否则，程序将显示错误信息。\n\n#### 8.9.4 身份验证问题\n\n假设你收到一条来自朋友\
  \ Alice 的消息，该消息使用我刚才向你展示的方法用她的私钥签名。你可能已经有了她的公钥，或者可以通过向她索要副本或从她的网页上轻松获取。那么，你就可以验证该消息确实是由\
  \ Alice 编写的且没有被篡改过。现在，假设你收到一条来自陌生人的消息，此人声称代表某著名软件公司，敦促你运行随附的程序。该陌生人甚至给你发了一份他的公钥，以便你验证消息确实是他编写的。你检查签名是有效的。这证明了消息是用匹配的私钥签名的，且没有被损坏。\n\
  \n请注意：`你仍然不知道消息是谁写的`。任何人都可以生成一对公钥和私钥，用私钥对消息进行签名，并把签名后的消息和公钥发送给你。确定发送者身份的问题被称为`身份验证问题`。\n\
  \n解决身份验证问题的常用方法非常简单。假设你和你陌生人有一个都信任的共同熟人。假设该陌生人面见过你的熟人，并递交了一个包含公钥的磁盘。你的熟人随后与你见面，向你保证他见过了那个陌生人，且那个陌生人确实在该著名软件公司工作，然后将磁盘交给你（参见图\
  \ 8.16）。这样，你的熟人就为陌生人的真实性背书了。\n\n![images](img/img_p564.png)\n\n**图 8.16** 通过信任进行认证\n\
  \n事实上，你的熟人并不真的需要和你见面。相反，他可以使用他的私钥对陌生人的公钥文件进行签名（参见图 8.17）。\n\n![images](img/img_p565.png)\n\
  \n**图 8.17** 通过信任的中间人进行认证\n\n当你获得公钥文件时，你会验证朋友的签名，因为你信任他，所以确信他在签名之前确实检查过那个陌生人的身份。\n\
  \n然而，你可能并没有共同的熟人。某些信任模型假设始终存在一条“信任链”——一条互为认识的人链——使得你信任该链条上的每一个成员。在实践中，这并不总是如此。你可能信任你的朋友\
  \ Alice，你知道 Alice 信任 Bob，但你不认识 Bob，也不确定是否信任他。\n\n其他信任模型假设存在一个仁慈的“老大哥”——一家我们都信任的公司。像\
  \ DigiCert、GlobalSign 和 Entrust 这种名字令人信任的公司提供了验证服务。\n\n你经常会遇到由一个或多个实体签名的数字签名，他们将为真实性背书，你需要评估你对这些认证者的信任程度。你可能对某个证书颁发机构给予极大信任，也许因为你在许多网页上看到了他们的标志，或者因为你听说他们每当创建新的主密钥时，都会要求几位拿着黑色公文包的人聚到一个安全室中。\n\
  \n然而，你应该对实际认证的内容持有理性的预期。你只需填写一个 Web 表单并支付小笔费用即可获得一个“1 类”ID。密钥会被邮寄到证书包含的电子邮件地址。因此，你可以合理地认为该电子邮件地址是真实的，但请求者可能填写了`任何`姓名和组织。还有更严格的\
  \ ID 类别。例如，对于“3 类”ID，证书颁发机构将要求个人请求者出现在公证员面前，并会检查企业请求者的财务评级。其他认证者会有不同的程序。因此，当你收到一条经过身份验证的消息时，理解实际上到底认证了什么是非常重要的。\n\
  \n#### 8.9.5 证书签名\n\n在第 539 页的第 8.9.3 节“验证签名”中，你看到 Alice 如何使用自签名证书向 Bob 分发公钥。然而，Bob\
  \ 需要通过与 Alice 比对指纹来确保该证书是有效的。\n\n假设 Alice 想给她的同事 Cindy 发送一条签名的消息，但 Cindy 不想花精力验证大量的签名指纹。现在假设有一个\
  \ Cindy 信任的实体验证实体。在这个例子中，Cindy 信任 ACME 软件公司的资源部。\n\n该部门运行着一个`证书颁发机构（CA）。ACME 的每个人的密钥库中都有\
  \ CA 的公钥，由一位仔细检查过密钥指纹的系统管理员安装。CA 为 ACME 员工的密钥签名。当他们安装彼此的密钥时，密钥库将隐含信任它们，因为它们是由受信任的密钥签名的。\n\
  \n以下是模拟这一过程的方法。创建一个 `acmesoft.certs` 密钥库。生成密钥对并导出公钥：\n\n![images](img/img_p567-1.png)\n\
  \n公钥被导出为一个“自签名”证书。然后，将其添加到每个员工的密钥库中：\n\n![images](img/img_p567-2.png)\n\n为了让 Alice\
  \ 向 Cindy 以及 ACME 公司的其他人发送消息，她需要将证书带到资源部并进行签名。遗憾的是，`keytool` 程序缺少此功能。在书配套代码中，我提供了一个\
  \ `CertificateSigner` 类来填补这一空白。ACME 软件的授权人员将如下所示验证 Alice 的身份并生成签名证书：\n\n![images](img/img_p567-3.png)\n\
  \n证书签名程序必须能够访问 ACME 的密钥库，且人员必须知道密钥库密码。显然，这是一项敏感操作。\n\nAlice 将 `alice_signedby_acmeroot.cer`\
  \ 文件交给 Cindy 和 ACME 公司的其他人。或者，ACME 软件可以将文件存储在公司目录。记住，此文件包含了 Alice 的公钥以及 ACME 软件对该密钥确实属于\
  \ Alice 的断。\n\n现在 Cindy 将签名证书导入到她的密钥库中：\n\n![images](img/img_p567-4.png)\n\n密钥库验证该密钥是由已存在的信任根密钥签名的。Cindy\
  \ `不需要`验证证书指纹。\n\n一旦 Cindy 添加了根证书以及经常向她发送文档的人的证书，她就不再需要担心密钥库了。\n\n\n\n\n你需要将公钥导入所有员工的\
  \ Java 密钥库（keystores），但它是隐私增强邮件（PEM）格式，而不是密钥库容易接受的 DER 格式。将文件 `demoCA/cacert.pem`\
  \ 复制到文件 `acmeroot.pem` 并用文本编辑器打开该文件。删除该行之前的内容：\n\n![images](img/img_p568-2.png)\n\
  \n以及该行之后的内容：\n\n![images](img/img_p568-3.png)\n\n现在你可以按照通常的方法将 `acmeroot.pem` 导入每个密钥库中：\n\
  \n![images](img/img_p568-7.png)\n\n`keytool` 似乎无法自己执行这种编辑操作，这看起来非常不可置信。\n\n要对 Alice\
  \ 的公钥签名，首先生成一个包含 PEM 格式证书的 `certificate request`：\n\n![images](img/img_p568-4.png)\n\
  \n要对证书签名，运行\n\n![images](img/img_p568-5.png)\n\n与之前一样，从 `alice_signedby_acmeroot.pem`\
  \ 中剪掉 `BEGIN CERTIFICATE`/`END CERTIFICATE` 标记之外的所有内容。然后将其导入密钥库：\n\n![images](img/img_p568-6.png)\n\
  \n你可以使用相同的步骤对由证书权威机构颁发的密钥的证书进行签名。\n\n#### 8.9.7 代码签名\n\n认证技术的一种常见用途是对可执行程序进行签名。如果你下载了一个程序，自然会担心它可能造成的破坏。例如，该程序可能被感染了病毒。如果你知道代码的来源，并且知道它自离开源地以来没有被篡改，你的安全感会比没有这些知识时高得多。\n\
  \n在本节中，我将向你展示如何签名 JAR 文件，以及如何配置 Java 来验证签名。这种功能是为 applets 和 Java Web Start 应用设计的。这些不再是常用的技术，但你可能仍需要在旧产品中支持它们。\n\
  \n当 Java 最初发布时，applets 加载后会在“沙箱”中运行，权限有限。如果用户想使用可以访问本地文件系统、建立网络连接等的 applet，他们必须明确同意。为了确保\
  \ applet 代码在传输过程中没有被篡改，必须对其进行数字签名。\n\n这是一个具体的例子。假设你在浏览互联网时，遇到一个网站提供运行一个来自未知供应商的\
  \ applet，前提是你授予它运行的权限（参见图 8.18）。此类程序由 Java 运行时信任的证书权威机构颁发的 `software developer`\
  \ 证书签名。弹出的对话框识别了软件开发者和证书颁发者。现在你需要决定是否授权该程序。\n\n你掌握哪些可能影响你决定的事实？以下是你所知的信息：\n\n* Thawte\
  \ 向软件开发者出售了一份证书。\n* 该程序确实是用该证书签名的，并且在传输过程中没有被修改。\n* 该证书确实是由 Thawte 签名的——它已通过本地 `cacerts`\
  \ 文件中的公钥进行了验证。\n\n当然，这些信息都不能告诉你代码运行起来是否安全。如果你所知道的只是供应商名称以及 Thawte 向他们出售了软件开发者证书这一事实，那么你还能信任该供应商吗？这种方法一直毫无意义。\n\
  \n对于内网部署，证书更具可能。管理员可以在本地机器上安装策略文件和证书，这样启动信任代码时就不需要用户交互。然而，随着安全管理器的废弃，这种方法不再可行。\n\
  \n![images](img/img_p570.png)\n\n**图 8.18** 启动已签名 applet\n\n## 8.10 加密\n\n到为止，我们讨论了\
  \ Java 安全 API 中实现的一种重要加密技术——即通过数字签名进行认证。安全的另一个重要方面是`encryption`。即使经过了认证，信息本身也是可见的。数字签名仅验证信息没有被更改。相比之下，当信息被加密时，它是不可见的。只有使用匹配的密钥才能对其解密。\n\
  \n对于代码签名来说，认证足够了——不需要隐藏代码。但当应用程序传输信用卡号和其他个人敏感数据时，加密是必要的。\n\n过去，专利和出口限制了许多公司提供强加密。幸运的是，现在的出口限制已宽松得多，重要算法的专利已经过期。如今，Java\
  \ 作为标准库的一部分提供了优秀的加密支持。\n\n#### 8.10.1 对称密码\n\nJava 密码学扩展包含一个 `Cipher` 类，它是所有加密算法的父类。要获取加密算法对象，调用\
  \ `getInstance` 方法：\n\n![images](img/img_p571-1.png)\n\nor\n\n![images](img/img_p571-2.png)\n\
  \nJDK 自带了名为 \"SunJCE\" 的提供者的加密算法。如果你不指定另一个提供者名称，它就是默认提供者。如果你需要 Oracle 不支持的特殊算法，你可能需要另一个提供者。\n\
  \n算法名称是一个字符串，例如 \"AES\" 或 \"DES/CBC/PKCS5Padding\"。\n\n数据加密标准 (DES) 是一种古老的分组密码算法，密钥长度为\
  \ 56 位。如今，DES 算法被认为是过时的，因为可以通过暴力破解来破解。一个更好的替代方案是它的继任者——高级加密标准 (AES)。参见 [`nvlpubs.nist.gov/nistpubs/FIPS.197.pdf`](https://nvlpubs.nist.gov/nistpubs/FIPS.197.pdf)\
  \ 关于 AES 算法的详细描述。我在示例中使用 AES。\n\n获取加密对象后，通过设置模式和密钥来初始化它：\n\n![images](img/img_p571-3.png)\n\
  \n模式是以下之一：\n\n![images](img/img_p571-4.png)\n\nwrap 和 unwrap 模式加密密钥——参见下一节。\n\n\
  现在你可以反复调用 `update` 方法来加密数据块：\n\n![images](img/img_p571-5.png)\n\n当你完成时，必须调用一次 `doFinal`\
  \ 方法。如果存在最后的数据块（少于 `blockSize` 字节），调用：\n\n![images](img/img_p572-1.png)\n\n如果所有数据都已加密，则调用：\n\
  \n![images](img/img_p572-2.png)\n\n考虑 DES 。它的分组大小为 8 字节。假设输入的最后一个块少于 8 字节。当然，我们可以\
  \ 0 填充剩余字节以获得一个 8 字节的最终块并进行加密。但当解密时，结果会带有几个尾随字节，因此与原始输入略有不同。为了避免这个问题，我们需要一种填充方案。常用的填充方案是\
  \ RSA Security, Inc. 定义的公钥密码标准 (PKCS) #5（[`tools.ietf.org/html/rfc2898`](https://tools.ietf.org/html/rfc2898)）。\n\
  \n在这种方案中，最后一个块不是用 0 填充，而是用等于填充字节数的填充值填充。也就是说，如果 `L` 是最后一个（不完整的）块，填充方式如下：\n\n![images](img/img_p572-3.png)\n\
  \n最后，如果输入长度实际上能被 8 整除，则附加并加密一个块：\n\n![images](img/img_p572-4.png) 解密后，明文的最后一个字节是需要丢的填充字符计数。\n\
  \n#### 8.10.2 密钥生成\n\n为了加密，你需要生成密钥。每个算法的密钥格式都不同，你需要确保密钥生成是随机的。遵循以下步骤：\n\n1. 获取对应算法的\
  \ `KeyGenerator`。\n2. 使用随机源初始化生成器。如果密码的分组长度可变，还要指定所需的块长度。\n3. 调用 `generateKey` 方法。\n\
  \n\n\n\n例如，这里是生成 AES 密钥的方法：\n\n![images](img/img_p573-1.png)\n\n或者，你也可以从一组固定的原始数据（可能派自密码或击键计时）生成密钥。如下所示构造一个\
  \ `SecretKeySpec`（它实现了 `SecretKey` 接口）：\n\n![images](img/img_p573-2.png)\n\n在生成密钥时，请确保你使用了`truly\
  \ random`（真正随机）数字。例如，`Random` 类中的普通随机数生成器以当前日期和时间为种子，其随机性不够。假设计算机时钟精确到 1/10 秒。那么每天最多有\
  \ 864,000 个种子。如果攻击者知道密钥颁发的日期（这通常可以从消息日期或证书过期日期推断出来），那么生成当天所有可能的种子是非常而易的事。\n\n`SecureRandom`\
  \ 类生成的随机数比 `Random` 类生成的随机数安全得多。你仍然需要提供一个种子来从随机位置开始数字序列。执行此操作的最佳方法是从硬件设备（如白噪声生成器）获取随机输入。另一个合理的随机输入源是让用户在键盘上漫无目的地打字，每次击键仅为随机种子贡献一或二比特。一旦你在一个字节数组中收集了这些随机位，就将其传递给\
  \ `setSeed` 方法：\n\n![images](img/img_p573-3.png)\n\n如果你不为随机数生成器设置种子，它将通过启动线程、让其睡眠并测量它们唤醒时的精确时间来计算它自己的\
  \ 20 字节种子。\n\n#### ![images](img/note.png) 注意\n\n该算法并`not`（不是）已知安全的。在过去，依赖于计算机某些组件（如硬盘访问时间）时间的算法已被证明不是完全随机的。\n\
