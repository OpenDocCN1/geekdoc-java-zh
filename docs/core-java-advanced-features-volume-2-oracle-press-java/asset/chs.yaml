  ## 9.3 高级 AWT\n\n你可以使用 `Graphics` 类的方法创建简单的图形。这些方法对于简单的应用程序已经足够，但当你需要创建复杂形状或需要对图形外观进行完全控制时，它们就显得力不从心。Java\
  \ 2D API 是一个更复杂的类库，你可以用它产生高质量的图形。在接下来的章节中，我将为你提供该 API 的概述。\n\n### 9.3.1 渲染流水线\n\n\
  原始 JDK 1.0 有非常简单的形状绘制机制。你选择颜色和绘制模式，并调用 `Graphics` 类的方法如 `drawRect` 或 `fillOval`。Java\
  \ 2D API 支持更多的选项。\n\n- 你可以轻松产生各种形状。\n- 你对 `stroke`（描绘形状边界的笔）具有控制权。\n- 你可以使用实色、变化的色调和重复图案来填充形状。\n\
  - 你可以使用变换来移动、缩放、旋转或拉伸形状。\n- 你可以使用裁剪将形状限制在任意区域。\n- 你可以使用组合规则结合新像素与现有像素。\n\n要绘制形状，请遵循以下步骤：\n\
  \n1. 获取 `Graphics2D` 类的对象。它是 `Graphics` 类的子类。自 Java 1.2 以来，`paint` 和 `paintComponent`\
  \ 等方法会自动接收 `Graphics2D` 对象。只需进行如下转换：\n```\n![images](img/img_p664.png)\n```\n2.\
  \ 使用 `setRenderingHints` 方法设置渲染提示——速度与绘制质量之间的权衡。\n```\n![images](img/img_p664-2.png)\n\
  ```\n3. 使用 `setStroke` 方法设置 `stroke`。`stroke` 绘制轮廓。你可以选择粗细并在实线和虚线之间切换。\n```\n![images](img/img_p664-3.png)\n\
  ```\n4. 使用 `setPaint` 方法设置 `paint`。`paint` 填充线条或形状内部。你可以创建实色漆、变色漆或平铺图案。\n```\n![images](img/img_p664-4.png)\n\
  ```\n5. 使用 `clip` 方法设置裁剪区域。\n```\n![images](img/img_p665-1.png)\n```\n6. 使用 `transform`\
  \ 方法设置用户空间到设备空间的变换。如果你在自定义坐标系中定义形状比使用像素坐标更容易，则可以使用变换。\n```\n![images](img/img_p665-2.png)\n\
  ```\n7. 使用 `setComposite` 方法设置组合规则，描述如何结合新像素与现有像素。\n```\n![images](img/img_p665-3.png)\n\
  ```\n8. 创建形状。Java 2D API 提供了许多形状对象和组合形状的方法。\n```\n![images](img/img_p665-4.png)\n\
  ```\n9. 绘制或填充形状。如果你绘制形状，则其轮廓会被描边；如果你填充形状，则其内部会被填充。\n```\n![images](img/img_p665-5.png)\n\
  ```\n\n当然，在许多实际情况下，你不需要所有的步骤。2D 图形上下文的设置有合理的默认值；只有当你想要偏离默认值时才更改设置。\n\n\n\n在接下来的章节中，你将看到如何描述形状、描边、填充、变换和组合规则。\n\
  \n各种设置方法只是设置了 2D 图形上下文的状态。它们不会导致任何绘制操作。同样，当你构建 `Shape` 对象时，也不会发生任何绘制。只有当你调用 `draw`\
  \ 或 `fill` 时，形状才会被渲染。此时，新形状将在 `rendering pipeline`（渲染流水线）中计算（参见图 9.31）。\n\n![images](img/img_p665-6.png)\n\
  \n**图 9.31** 渲染流水线\n\n在渲染流水线中，执行以下步骤来渲染形状：\n\n1. 对形状的路径进行描边。\n2. 对形状进行变换。\n3. 对形状进行裁剪。如果形状与裁剪区域之间没有交集，则过程停止。\n\
  4. 对裁剪后形状的剩余部分填充。\n5. 将填充形状的像素与现有像素进行组合。（在图 9.31 中，圆是现有像素的一部分，而杯形形状叠加在其上。）\n\n在下一节中，你将看到如何定义形状。然后，我们将转向\
  \ 2D 图形上下文设置。\n\n### java.awt.Graphics2D 1.2\n\n* `void draw(Shape s)`\n  使用当前画笔绘制给定形状的轮廓。\n\
  * `void fill(Shape s)`\n  使用当前画笔填充给定形状的内部。\n\n#### 9.3.2 形状\n\n这里是 `Graphics` 类中用于绘制形状的一些方法：\n\
  \n![images](img/img_p666-1.png)\n\n此外还有相应的填充方法。这些方法从 JDK 1.0 以来一直存在于 `Graphics`\
  \ 类中。Java 2D API 使用了完全不同的面向对象的方法。它不是使用方法，而是使用类：\n\n![images](img/img_p666-2.png)\n\
  \n这些类都实现了 `Shape` 接口，我们将在接下来的章节中检查它。\n\n#### 9.3.2.1 Shape 类层次结构\n\n`Line2D`、`Rectangle2D`、`RoundRectangle2D`、`Ellipse2D`\
  \ 和 `Arc2D` 类分别对应 `drawLine`、`drawRectangle`、`drawRoundRect`、`drawOval` 和 `drawArc`\
  \ 方法。（“3D 矩形”的概念已经走向了它应有的终结——没有类似于 `draw3DRect` 方法的方法。）Java 2D API 还提供了两个额外的类——二次曲线和三次曲线，我们将在本节中讨论。没有\
  \ `Polygon2D` 类；相反，`GeneralPath` 类描述了由直线、二次曲线和三次曲线组成的路径。你可以使用 `GeneralPath` 来描述多边形；我们将在本节稍后展示如何操作。\n\
  \n要绘制形状，首先创建一个实现 `Shape` 接口的类对象，然后调用 `Graphics2D` 类的 `draw` 方法。\n\n这些类\n\n![images](img/img_p667-1.png)\n\
  \n都继承自一个公共父类 `RectangularShape`。诚然，椭圆和弧不是矩形，但它们有一个 `bounding rectangle`（边界矩形）（参见图\
  \ 9.32）。\n\n![images](img/img_p667-2.png)\n\n**图 9.32** 椭圆和弧的边界矩形\n\n每个以“2D”结尾的类有两个子类，用于指定\
  \ float 或 double 类型的坐标。在第一卷中，你已经遇到过 `Rectangle2D.Float` 和 `Rectangle2D.Double`。\n\
  \n其他类也使用了相同的方案，例如 `Arc2D.Float` 和 `Arc2D.Double`。\n\n内部，所有图形类都使用 `float` 坐标，因为浮点数使用的存储空间较少，但对于几何计算具有足够的精度。\n\
  \n然而，Java 编程语言处理浮点数变得有点繁琐。因此，图形类的大多数方法使用 `double` 参数和返回值。只有在构建 2D 对象时，你才需要在 float\
  \ 和 double 坐标的构造函数之间选择。例如，\n\n![images](img/img_p668-1.png)\n\n`Xxx2D.Float` 和 `Xxx2D.Double`\
  \ 类是 `Xxx2D` 类的子类。在对象构造后，记住子类几乎没有任何用处，你可以像上面的代码示例那样，将构造的对象存储在父类变量中。\n\n![images](img/img_p668-2.png)\n\
  \n**图 9.33** 形状类之间的关系\n\n从这些奇怪的名字中可以看出，`Xxx2D.Float` 和 `Xxx2D.Double` 类也是 `Xxx2D`\
  \ 类的内部类。这只是为了语法上的小便利，以避免外层类名过于冗长。\n\n最后，`Point2D` 类描述了一个具有 `x` 和 `y` 坐标的点。点用于定义形状，但它们本身并不是形状。\n\
  \n图 9.33 显示了形状类之间的关系。然而，省略了 `Double` 和 `Float` 子类。来自 2D 库之前的遗留类被标记出来。\n\n#### 9.3.2.2\
  \ 使用 Shape 类\n\n你已经在第一卷中见过 `Rectangle2D`、`Ellipse2D` 和 `Line2D` 类。在本节中，你将学习处理 2D\
  \ 形状。对于 `Rectangle2D` 形状，指定左上角、宽、高以及 `radius`。例如，\n\n![images](img/img_p669-1.png)\n\
  \n产生带圆角的矩形。\n\n![images](img/img_p669-2.png)\n\n**图 9.34** 圆矩形\n\n要构造弧，指定边界框、起始角度、弧扫描的角度（参见图\
