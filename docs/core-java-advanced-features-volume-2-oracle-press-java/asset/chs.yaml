  \ `ZonedDateTime`。\n\n## 5.7 与旧代码相互操作\n\n作为一个新特性，Java 日期和时间 API 必须与现有类相互操作——特别是无处的\
  \ `java.util.Date`、`java.util.GregorianCalendar` 以及 `java.sql.Date/Time/Timestamp`。\n\
  \n`Instant` 类是 `java.util.Date` 的相似类。在 Java 8 中，该类增加了两个方法：将 `Date` 转换为 `Instant`\
  \ 的 `toInstant` 方法，以及进行反向转换的静态 `from` 方法。\n\n同样，`ZonedDateTime` 是 `java.util.GregorianCalendar`\
  \ 的相似类，该类在 Java 8 中获得了转换方法。`toZonedDateTime` 方法将 `GregorianCalendar` 转换为 `ZonedDateTime`，而静态\
  \ `from` 方法执行相反的转换。\n\n`java.sql` 包中的日期和时间类提供了另一组转换。你也可以将 `DateTimeFormatter` 传递给使用\
  \ `java.text.Format` 的旧代码。表 5.4 总结了这些转换。\n\n**表 5.4** java.time 类与旧类之间的转换\n\n![images](img/img_p351.png)\n\
  \n你现在知道如何使用 Java 8 日期和时间库来处理世界的日期时间值。下一章进一步讨论了针对国际观众的编程。你将看到如何根据客户所在的地方来格式化程序消息、数字和货币。\n\
  \n\n\n\n当你提供程序的国际化版本时，所有的程序消息都需要翻译成本地语言。然而，仅仅翻译用户界面文本是不够的。还有许多更细微的差异——例如数字在英语和德语中的格式非常不同。对于德国用户来说，数字\
  \ `123,456.78` 应该显示为 `123.456,78`——也就是说，小数点和小数位分隔符的作用反过了。\n\n日期的显示上也有类似的差异。在美国，日期的显示方式（某种程度上是不逻辑的）是月/日/年。德国使用更合理的日/月/年顺序，而在中国，使用习惯是年/月/日。因此，日期\
  \ `3/22/61` 对德国用户来说应该呈现为 `22.03.1961`。当然，如果写出月份名称，语言之间的差异就变得明显了。`March 22, 1961`\
  \ 在德语中应呈现为 `22. März 1961`，在中文中应呈现为 `1961 年 3 月 22 日`。\n\n`locale` 捕获了此类本地偏好。每当你展示数字、货币值以及格式随语言或位置而异的其他项目时，你都需要使用感知区域的\
  \ API。\n\n#### 6.1.2 指定区域 (Locales)\n\n一个区域（locale）由最多五个组件组成：\n\n1. 语言，由两个或三个小写字母指定，例如\
  \ `en`（英语）、`de`（德语）或 `zh`（中文）。\n2. 脚本，由首字母大写的四个字母指定，例如 `Latn`（拉丁字母）、`Cyrl`（西里尔字母）或\
  \ `Hant`（繁体中文）。这非常有用，因为某些语言（如塞尔维亚语）使用拉丁字母或西里尔字母编写，且某些读者倾向于繁体字而非简体字。\n3. 国家或地区，由两个大写字母或三个数字指定，例如\
  \ `US`（美国）或 `CH`（瑞士）。\n4. 变体，指定如方言或拼写规则等各种杂特征。变体现在很少使用。过去曾用过挪威语的“Nynorsk”变体，但现在用不同的语言代码\
  \ `nn` 表示。\n5. 扩展，描述对日历（如日本历）、数字（而非西方数字）等方面的本地偏好。Unicode 标准规定了其中一些扩展。扩展以 `u-` 开头，后跟一个双字母代码，指定该扩展是否处理日历（`ca`）、数字（`nu`）等。其他扩展完全是任意的并以\
  \ `x-` 开头，例如 `java`。\n\n区域的规则制定于互联网工程任务组（IETF）的“最佳当前实践”备录 BCP47（`https://tools.ietf.org/search/bcp47`）。你可以在\
  \ `www.org/International/language-tags` 找到更容易读的摘要。\n\n**表 6.1** 常见 ISO 639-1 语言代码\n\
  ![images/img_p355.png)\n\n**表 6.2** 常见 ISO 3166-1 国家代码\n![images/img_p356.png)\n\
  \n语言和代码似乎有点随机，因为其中某些源自当地语言。德语在德语中是 `Deutsch`，中文在中文中是 `zhongwen`：因此 `de` 和 `zh`。瑞士是\
  \ `CH`，源自拉丁术语 *Confoederatio Helvetica*。区域由标签描述——由区域元素连接的字符串，例如 `en-US`。在德国，你会使用\
  \ `de-DE`。瑞士有四种官方语言（德语、法语、意大利语和罗曼什语）。在瑞士的德语语者会想使用 `de-CH`。该区域使用德语的规则，但货币值以瑞士法郎表示而非欧元。如果你只指定语言（例如\
  \ `de`），则该区域无法用于特定国家的问题（如货币）。\n\n你可以像这样从标签字符串构造一个 `Locale` 对象：\n![images/img_p357.png)\n\
  \n`toLanguageTag` 方法产生给定区域的语言标签。例如，`Locale.US.toLanguageTag()` 返回字符串 `\"en-US\"\
  `。为了方便起见，为不同的国家预定义了许多 `locale` 对象：\n![images/img_p357.png)\n\n一些一些预定义的区域仅指定语言而不指定位置：\n\
  ![images/img_p357.png)\n\n最后，静态方法 `getAvailableLocales` 返回虚拟机已知的所有区域的数组。\n\n![images/note.png)\
  \ **注意**\n你可以通过 `Locale.getISanguages()` 获取所有语言代码，通过 `Locale.getISountries()` 获取所有国家代码。\n\
