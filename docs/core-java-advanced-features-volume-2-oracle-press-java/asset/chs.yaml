  \   如果你想用文件对象来替换写入类文件，请拦截此调用；`kind` 是 SOURCE、CLASS、HTML 或 OTHER 之一。\n\n## 7.3 使用注解\n\
  \n注解是你插入到源代码中的标签，以便某些工具可以处理它们。这些工具可以在源代码级别上操作，也可以处理编译器已将注解放置在类类文件。\n\n注解不会改变你程序的编译方式。无论是否有注解，Java\
  \ 编译器都会生成相同的虚拟机指令。\n\n要从注解中获益，你需要选择一个*处理工具*。使用你的处理工具理解的注解，然后将该处理工具应用于你的代码中。\n\n\
  注解的用途广泛，这种通用性起初可能会令人困惑。以下是注解的一些用途：\n\n* 自动生成辅助文件，例如部署描述符或 Bean 信息类\n* 自动生成用于测试、日志、事务语义等的代码。\n\
  \n#### 7.3.1 注解简介\n\n我将从基本概念开始讨论注解，并在一个具体的示例中使用它们。在示例中，我将将方法标记为 AWT 组件的事件监听器，并向你展示一个注解处理器，它可以分析注解并挂钩监听器。随后，我将详细讨论语法规则，并用两个高级注解处理的示例结束本章。其中一个处理源级注解，另一个使用\
  \ Apache 字节码工程库处理类文件。\n\n这是一个简单的注解示例：\n\n![images](img/img_p434-1.png)\n\n`@Test`\
  \ 标记了 `checkRandomions` 方法。\n\n在 Java 中，注解的使用方式类似于修饰符，并放在被注解的项目之前且没有分号。（修饰符是如 public\
  \ 或 static 的关键字）。每个注解名称以 `@` 符号开头，类似于 Javadoc 注释。然而，Javadoc 注释位于 `/** */` 定界符内部，而注解是代码的一部分。\n\
  \n`@Test` 注解本身不起任何作用。它需要工具才能生效。例如，JUnit 测试工具（可在 [`junit.org`](http://junit.org)\
  \ 获取）在测试类时调用标记为 `@Test` 的方法。另一个工具可能会从类中移除测试方法，以便在测试完成后不再携带程序。\n\n注解可以定义为具有*元素*，例如\n\
  \n![images](img/img_p434-2.png)\n\n这些元素可以被读取注解的工具处理。其他形式也是可能的；我们将在本章后续部分讨论。\n\n\
  `@Target` 和 `@Retention` 注解是*元注解*。它们注解 `@Test` 注解，将其标记为可以应用于方法的注解，并且在类文件加载到虚拟机时保留。我们将在第\
  \ 7.5.2 节“元注解”第 428 页详细讨论这些。\n\n你现在已经了解了程序元数据和注解的基本概念。在下一节中，我们将遍历一个注解处理的具体示例。\n\n\
  #### ![images](img/note.png) **注意**\n\n\n\n\n\n要了解注解的引人用法，可以查看 [JCommander](http://jcommander.org](http://jcommander.org))\
  \ 和 [picocli](http://picocli.info](http://picocli.info))。这些库使用注解来处理命令行参数。\n\n###\
  \ 7.3.2 示例：为事件处理程序添加注解\n\n用户界面编程中较为枯燥的任务之一是将监听器连接到事件源。许多监听器的形式如下：\n\n![images](img/img_p435-2.png)\n\
  \n在在本节中，我们将设计一种注解来反转这种连接。该注解定义在 Listing 7.8 中，用法如下：\n\n![images](img/img_p435-3.png)\n\
  \n程序员不再需要调用 `addActionListener`。相反，每个方法都标记了注解。Listing 7.7 显示了来自第一卷第 9 章的用这些注解重新实现的\
  \ `ButtonFrame` 类。\n\n我们还需要定义一个注解接口。代码位于 Listing 7.8 中。\n\n当然，注解本身并不起任何作用。它们存在于源文件中。编译器将它们放入类文件中，虚拟机则加载它们。我们现在需要一种机制来分析它们并安装动作监听器。这就是\
  \ `ActionListenerInstaller` 类的工作。`ButtonFrame` 构造函数调用了\n\n![images](img/img_p436-1.png)\n\
  \n静态方法 `processAnnotations` 枚举它收到的对象的所有方法。对于每个方法，它获取 `ActionListenerFor` 注解对象并对其处理。\n\
  \n![images](img/img_p436-2.png)\n\n在这里，我们使用了 `AnnotatedElement` 接口中定义的 `getAnnotation`\
  \ 方法。`Method`、`Constructor`、`Field`、`Class` 和 `Package` 类都实现了这个接口。\n\n源字段的名字存储在注解对象中。我们通过调用\
  \ `source` 方法获取它，然后查找匹配的字段。\n\n![images](img/img_p436-3.png)\n\n这显示了我们注解的一个局限性。源元素必须是字段名，不能是局部变量。\n\
  \n代码的剩余部分相当技术化。对于每个带注解的方法，我们构建了一个实现 `ActionListener` 接口的代理对象，其 `actionPerformed`\
  \ 方法调用了被注解的方法。（关于代理的更多信息，请参阅第一卷第 5 章。）细节并不重要。关键观察是，注解的功能是通过 `processAnnotations`\
  \ 方法建立的。\n\nFigure7.1 显示了在本示例中如何处理注解。\n\n在本示例中，注解是在运行时处理的。也可以在源码级别处理它们：源代码生成器将产生用于添加监听器的代码。或者，可以在字节码级别处理注解：字节码编辑器可以将对\
  \ `addActionListener` 的调用注入框架构造函数中。这听起来很复杂，但可以使用相应的库让这项任务变得相对简单。你可以在第 437 页的 Section\
  \ 7.7 “字节码工程”中看到示例。\n\n![images](img/img_p437-1.png)\n\n**图 7.1** 在运行时处理注解\n\n我们的示例并不是为了给用户界面程序员提供一个严肃的工具。一个用于添加监听器的实用方法可能对程序员来说和注解一样方便。（事实上，`java.beans.EventHandler`\
  \ 类正尝试这样做这一点。你可以通过提供一个添加事件处理器的方法而不仅仅是构造它，使该类变得真正有用。）\n\n然而，这个示例展示了对程序进行注解以及分析注解的机制。在看到具体的示例后，你现在（我希望）已经准备好学习后续章节，这些章节将详细描述注解的语法。\n\
