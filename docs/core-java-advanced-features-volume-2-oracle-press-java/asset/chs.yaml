  \n* `null`：并发执行不安全。\n* `MULTITHREADED`：并发执行安全。一个线程的效果对另一个线程可见。\n* `THREAD-ISOLATED`：除\
  \ `MULTITHREADED` 之外，每个线程维护不同的变量绑定。\n* `STATELESS`：除 `THREAD-ISOLATED` 之外，脚本不会更改变量绑定。\n\
  \n\n\n\n你可能需要除了引擎和全局作用域之外的作用域。例如，Web 容器可能需要请求（request）和会话（session）作用域。不过，你需要自己来实现。你需要编写一个实现\
  \ `ScriptContext` 接口的类，来管理作用域集合。每个作用域由一个整数标识，应该优先搜索较小的作用域。（标准库提供了一个 `SimpleScriptContext`\
  \ 类，但它只包含全局和引擎作用域。）\n\n### `javax.script.ScriptEngine` 6\n\n* `Object eval(String\
