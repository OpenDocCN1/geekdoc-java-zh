  \ `TemporalAmount` 接口。\n*   `Duration multipliedBy(long multiplicand)`\n*   `Duration\
  \ dividedBy(long divisor)`\n*   `Duration negated()`\n    通过乘以或除以给定数量获得一个持续时间。\n\
