  \n你可以通过以下调用前后移动任意行：\n\n![images](img/img_p223-3.png)\n\n如果 *n* 为正，则向前移动。如果 *n* 为负，则向后移动。如果\
  \ *n* 为零，调用无效。如果你尝试将光标移动到当前行集之外，它将被设置为最后行之后或第一行之前，取决于 *n* 的符号。然后，方法将返回 `false` 且光标不会移动。如果光标位于实际行上，则返回\
  \ `true`。\n\n或者，你可以将光标设置到特定的行号：\n\n![images](img/img_p223-4.png)\n\n要获取当前行号，调用\n\
  \n![images](img/img_p223-5.png)\n\n结果集的第一行号为 1。如果返回值为 0，说明光标不在行上——它位于第一行之前或最后行之后。便利方法\
  \ `first`、`last`、`beforeFirst` 和 `afterLast` 将光标移动到第一、最后、第一之前或最后之后的位置。\n\n最后，`isFirst`、`isLast`、`isBeforeFirst`\
  \ 和 `isAfterLast` 方法测试光标是否处于这些特殊位置。\n\n使用可滚动结果集非常简单。缓存查询数据的复杂工作由数据库驱动程序在后台完成。\n\n\
  \n\n\n\n如果你想编辑结果集中的数据并让更改自动反映到数据库中，请创建一个可更新的结果集。可更新的结果集不必非是可滚的，但如果你向用户展示数据以进行编辑，你通常也希望允许滚动。\n\
  \n要获取可更新的结果集，请按如下方式创建语句：\n\n![images](img/img_p224-1.png)\n\n调用 `executeQuery` 返回的结果集随后将是可更新的。\n\
  \n### 注意\n并非所有查询都会返回可更新的结果集。如果你的查询是涉及多个表的连接（join），则结果可能是不可更新的。然而，如果你的查询只涉及单个表，或者通过主键连接了多个表，那么你应该预期结果集是可更新的。可以调用\
  \ `ResultSet` 接口的 `getConcurrency` 方法来最终确认。\n\n例如，假设你想提高某些书籍的价格，但你没有一个简单的准则来发布 `UPDATE`\
  \ 语句。这时，你可以遍历所有的书籍并根据任意条件更新价格。\n\n![images](img/img_p224-2.png)\n\n对于所有与 SQL 类型对应的数据类型，都有相应的\
  \ `updateXxx` 方法，例如 `updateDouble`、`updateString` 等；指定列名或列号（与 `getXxx` 方法类似），然后指定该字段的新值。\n\
  \n### 注意\n如果你使用第一个参数为列号的 `updateXxx` 方法，请注意这是*结果集（result set*）*中的列号。它可能与数据库中的列号不同。\n\
  \n`updateXxx` 方法只更改行值，而不更改数据库。当你完成某行中的字段更新后，必须调用 `updateRow`。该方法会将当前行中的所有更新发送到数据库。如果你在没有调用\
  \ `updateRow` 的情况下将光标移动到另一行，该行的更新将从行中丢弃，且永远不会同步到数据库。你也可以调用 `cancelRow` 来取消对当前行的更新。\n\
  \n上述示例展示了如何修改现有行。如果你想向数据库添加新行，请首先使用 `moveToInsertRow` 将光标移动到一个称为*插入行（insert row*）*的特殊位置。然后，通过发布\
  \ `updateXxx` 指令在插入行中构建一个新行。完成后，调用 `insertRow` 将新行交付到数据库。完成插入后，调用 `moveToCurrentRow`\
  \ 将光标移回调用 `moveToInsertRow` 之前的位置。这里有一个示例：\n\n![images](img/img_225-1.png)\n\n注意，你无法影响新数据在结果集或数据库中的添加位置。如果你不在插入行中指定列值，它将被设置为\
  \ `NULL`。然而，如果该列具有 `NOT NULL` 约束，则会抛出异常且行不会被插入。\n\n最后，你可以删除光标所在的行：\n\n![images](img/img_225-2.png)\n\
  \n`deleteRow` 方法会立即从结果集和数据库中删除该行。`ResultSet` 接口的 `updateRow`、`insertRow` 和 `deleteRow`\
  \ 方法提供的权力与执行 `UPDATE`、`INSERT` 和 `DELETE` SQL 语句相同。然而，Java 程序员可能会发现通过结果集来纵数据库比通过构造\
  \ SQL 语句更自然。\n\n### 警告\n如果你不小心，使用可更新的结果集可能会写出效率极低的代码。执行 `UPDATE` 语句比执行查询并在遍历结果在此过程中更改数据要高效得多。可更新的结果集适用于用户可以任意更改的交互式程序，但对于大多数程序化更改，SQL\
  \ `UPDATE` 更为合适。\n\n### 注意\nJDBC 2 为结果集提供了进一步的增强，例如如果数据已被另一个数据库连接修改，则具有使用最新数据更新结果集的能力。JDBC\
  \ 3 增加了另一项改进，指定了在事务提交时结果集的行为。然而，这些高级功能超出了本介绍章节的范围。更多信息请参阅 Mayene Fisher、Jon Ellis\
  \ 和 Jonathan Bruce 出的《JDBC™ API and Reference, Third Edition》（Wesley, 2003）以及 JDBC\
  \ 规范。\n\n### java.sql.Connection\n* `createStatement(int type, int concurrency)`\n\
  * `prepareStatement(String command, int type, int concurrency)`\n  创建一个语句或预编译语句，产生具有给定类型和并发性的的结果集。`type`\
  \ 参数为常量 `TYPE_FORWARD_ONLY`、`TYPE_SCROLL_INSENSITIVE` 或 `TYPE_SCROLL_SENSITIVE`，而\
  \ `concurrency` 是常量 `CONCUR_READ_ONLY` 或 `CONCUR_UPDATABLE` 之一，这些都定义在 `ResultSet`\
  \ 接口中。\n\n### java.sql.ResultSet\n* `getType()`\n  返回此结果集的类型——在 `TYPE_FORWARD_ONLY`、`TYPE_SCROLL_INSENSITIVE`\
  \ 或 `TYPE_SCROLL_SENSITIVE` 之一。\n* `getConcurrency()`\n  返回此结果集的并发设置——`CONCUR_READ_ONLY`\
  \ 或 `CONCUR_UPDATABLE` 之一。\n* `previous()`\n  将光标移动到前一行。如果光标位于某行，则返回 true；如果光标位于第一行之前，则返回\
  \ false。\n* `getRow()`\n  获取当前行号。行从 1 开始计数。\n* `absolute(int r)`\n  将光标移动到第 `r`\
  \ 行。如果光标位于某行，返回 true。\n* `relative(int d)`\n  将光标移动 `d` 行。如果 `d` 为负数，则光标向后移动。如果光标位于某行，返回\
  \ true。\n* `first()`\n* `last()`\n  将光标移动到第一行或最后一行。如果光标位于某行，返回 true。\n* `beforeFirst()`\n\
  * `afterLast()`\n  将光标移动到第一行之前或最后一行之后。\n* `isFirst()`\n* `isLast()`\n  测试光标是否在第一行或最后一行。\n\
  * `isBeforeFirst()`\n* `isAfterLast()`\n  测试光标是否在第一行之前或最后一行之后。\n* `moveToInsertRow()`\n\
  \  将光标移动到插入行。插入行是一个用于 `updateXxx` 和 `insertRow` 方法插入数据的特殊行。\n* `moveToCurrentRow()`\n\
  \  将光标从插入行移回调用 `moveToInsertRow` 之前的行。\n* `insertRow()`\n  将插入行内容插入到数据库和结果集中。\n\
  * `deleteRow()`\n  从数据库和结果集中删除当前行。\n* `updateXxx(int column, Xxx data)`\n* `updateXxx(String\
  \ columnName, Xxx data)`\n  (*Xxx* 是如 int、double、String、Date 等类型）\n  更新结果集当前行中的一个字段。\n\
  * `updateRow()`\n  将当前行的更新发送到数据库。\n* `cancelRowUpdates()`\n  取消当前行的更新。\n\n### java.sql.DatabaseMetaData\n\
  * `supportsResultSetType(int type)`\n  如果数据库支持给定类型的结果集则返回 true；type 为 `ResultSet`\
  \ 接口中的常量 `TYPE_FORWARD_ONLY`、`TYPE_SCROLL_INSENSITIVE` 或 `TYPE_SCROLL_SENSITIVE`\
  \ 之一。\n* `supportsResultSetConcurrency(int type, int concurrency)`\n\n\n\n\n如果数据库支持给定的类型和并发组合的结果集，则返回\
  \ true。类型参数是常量 `TYPE_FORWARD_ONLY`、`TYPE_SCROLL_INSENSITIVE` 或 `TYPE_SCROLL_SENSITIVE`\
  \ 之一，并发类型是常量 `CONCUR_READ_ONLY` 或 `CONCUR_UPDATABLE` 之一，这些都定义在 `ResultSet` 接口中。\n\
  \n## 3.7 行集 (Row Sets)\n\n可滚动的结果集非常强大，但它们有一个主要的缺点：你需要在整个用户交互期间保持数据库连接打开。然而，用户可能会离开电脑很久，导致连接被占用。这并不好——数据库连接是稀缺资源。在这种情况下，请使用\
  \ `row set`（行集）。`RowSet` 接口扩展了 `ResultSet` 接口，但行集不必绑定到数据库连接。\n\n如果你需要将查询结果移动到复杂应用的不同层级，或者移动到其他设备（如手机），行集也是合适的。你永远不会想移动一个结果集——它的数据结构可能巨大，而且它受制于数据库连接。\n\
  \n#### 3.7.1 构建行集\n\n`javax.sql.rowset` 包提供了以下扩展 `RowSet` 接口的接口：\n\n*   `CachedRowSet`\
  \ 允许离线操作。我们将在接下来的章节中讨论缓存行集。\n*   `WebRowSet` 是一种缓存行集，可以保存到 XML 文件中。该 XML 文件可以移动到\
  \ Web 应用的另一个层级，由另一个 `WebRowSet` 对象打开。\n*   `FilteredRowSet` 和 `JoinRowSet` 接口支持对行集的轻量级操作，等同于\
  \ SQL 的 `SELECT` 和 `JOIN` 操作。这些操作在存储于行集的数据上执行，而无需建立数据库连接。\n*   `JdbcRowSet` 是 `ResultSet`\
  \ 的薄封装。它添加了来自 `RowSet` 接口的有用方法。\n\n要获取缓存行集，调用：\n\n![images](img/img_p229-1.png)\n\
  \n获取其他类型行集也有类似的方法。\n\n### 3.7.2 缓存行集 (Cached Row Sets)\n\n缓存行集包含了来自结果集的所有数据。由于 `CachedRowSet`\
  \ 是 `ResultSet` 接口的子接口，你可以完全像使用结果集一样使用缓存行集。缓存行集带来了一个重要的优势：你可以关闭连接并仍然使用该行集。正如我们在\
  \ Listing 3.4 中的示例程序所示，这极大地简化了交互式应用的实现。每个用户命令只需打开数据库连接，发布查询，将结果放入缓存行集中，然后关闭数据库连接。\n\
  \n甚至可以修改缓存行集中的数据。当然，这些修改不会立即反映在数据库中；你需要发送一个显式请求来接受积累的更改。随后 `CachedRowSet` 将重新连接到数据库并发布\
  \ SQL 语句以写入积累的更改。\n\n你可以从结果集填充 `CachedRowSet`：\n\n![images](img/img_p229-2.png)\n\
  \n或者，你可以让 `CachedRowSet` 对象建立连接。设置数据库参数：\n\n![images](img/img_p230-1.png)\n\n然后设置查询语句和任何参数：\n\
  \n![images](img/img_p230-2.png)\n\n最后，用查询结果填充行集：\n\n![images](img/img_p230-3.png)\n\
  \n此调用建立了数据库连接，发布查询，填充了行集并断开连接。\n\n如果你的查询结果非常大，你可能不想将其全部放入行集。毕竟，你的用户可能只会看几行。在这种情况下，请指定页大小：\n\
  \n![images](img/img_p230-4.png)\n\n现在你将只获得 20 行。要获取下一批行，调用\n\n![images](img/img_p230-5.png)\n\
  \n你可以使用与用于结果集相同的方法来检查和修改行集。如果你修改了行集内容，必须通过调用以下方法将其写回数据库：\n\n![images](img/img_p230-6.png)\n\
  \n或\n\n![images](img/img_p230-7.png)\n\n只有当你配置行集时配置了连接数据库所需的信息（如 URL、用户名和密码）时，第二次调用才有效。\n\
  \n在第 202 页的 Section 3.6.2 “可更新的结果集”中，你看到并不是所有结果集都是可更新的。同样，包含复杂查询结果的行集将无法将其更改写回数据库。如果你的行集包含来自单表的数据，那么就是安全的。\n\
  \n#### 注意\n\n如果你是从结果集填充的行集，行集并不知道要更新的表名。你需要调用 `setTableName` 来设置表名。\n\n如果在你填充行集后数据库中的数据发生了变化，就会出现另一个复杂性。这显然是可能导致数据不一致的故障信号。参考实现会检查原始行集值（即编辑前的值）是否与数据库中的当前值相同。如果是，则用编辑后的值替换；否则，则不会写回更改。其他实现可能使用不同的同步策略。\n\
