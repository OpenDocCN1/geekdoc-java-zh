  \n## 2.5 内存映射文件\n\n大多数操作系统都可以利用虚拟内存实现将文件（或文件的区域）“映射”到内存中。然后，就可以像访问内存数组一样访问文件，这比传统的文件操作快得多。\n\
  \n#### 2.5.1 内存映射文件性能\n\n在本节结束处，你可以找到一个程序，分别使用传统文件输入和内存映射文件计算文件的 CRC32 校验和。在某台机器上，当计算\
  \ JDK lib 目录下 49MB 文件 `src.zip` 的校验和时，我们得到了表 2.6 所示的时间数据。\n\n**表 2.6 文件操作计时数据\n\n\
  ![images](img/img_p153.png)\n\n如你所见，在这台特定的机器上，内存映射比使用缓冲顺序输入快一点，并且比使用 `RandomAccessFile`\
  \ 快得多。\n\n当然，精确数值在不同机器之间会有巨大差异，但很明显，与随机访问相比，性能提升是巨大的。另一方面，对于中等大小文件的顺序读取，没有理由使用内存映射。\n\
  \n`java.nio` 包使内存映射变得非常简单。以下是具体操作方法。\n\n首先，获取文件的 `channel`（通道）。通道是磁盘文件的抽象，允许你访问操作系统功能，如内存映射、文件锁定和文件之间的快速数据传输。\n\
  \n![images](img/img_p154-1.png)\n\n然后，通过调用 `FileChannel` 类的 `map` 方法从通道获取一个 `ByteBuffer`。指定你想要映射的文件区域和*映射模式*。支持三种模式：\n\
  \n*   `FileChannel.MapMode.READ_ONLY`：生成的缓冲区是只读的。任何写入缓冲区的尝试都会导致 `ReadOnlyBufferException`。\n\
  *   `FileChannel.MapMode.READ_WRITE`：生成的缓冲区是可写的，更改将在某个时间写回文件。请注意，映射了相同文件的其他程序可能不会立即看到这些更改。多个程序同时进行文件映射的确切行为取决于操作系统。\n\
  *   `FileChannel.MapMode.PRIVATE`：生成的缓冲区是可写的，但任何更改对该缓冲区来说都是私有的，不会传播到文件中。\n\n例如，\n\
  \n![images](img/img_p154-2.png)\n\n一旦获取了缓冲区，就可以使用 `ByteBuffer` 类和父类 `Buffer` 类的方法来读写数据。\n\
  \n缓冲区同时支持顺序和随机数据访问。缓冲区有一个*position*（位置），它通过 `get` 和 `put` 操作向前移动。例如，你可以顺序遍历缓冲区中的所有字节，如：\n\
  \n![images](img/img_p154-3.png)\n\n或者，你可以使用随机访问：\n\n![images](img/img_p155-1.png)\n\
  \n你也可以使用以下方法读写字节数组：\n\n![images](img/img_p155-2.png)\n\n最后，还有方法\n\n![images](img/img_p155-3.png)\n\
  \n用于读取以*二进制*值存储在文件中的基本数据类型值。正如我们已经提到的，Java 对二进制数据使用大端序。然而，如果你需要处理包含小端序二进制数字的文件，只需调用\n\
  \n![images](img/img_p155-4.png)\n\n要查找缓冲区的当前字节序，调用\n\n![images](img/img_p155-5.png)\n\
  \n要向缓冲区写入数字，请使用以下方法之一：\n\n![images](img/img_p155-6.png)\n\n在某一点，特别是当通道关闭时，这些更改会被写回文件。\n\
  \n代码列表 2.5 计算文件的 32 位循环冗余校验和 (CRC32)。该校验和通常用于判断文件是否已损坏。文件的损坏很可能导致校验和发生。`java.util.zip`\
  \ 包包含一个 `CRC32` 类，它使用以下循环计算字节序列的校验和：\n\n![images](img/img_p155-7.png)\n\n`CRC` 计算的细节并不重要。我们只是将其作为有用操作的示例。在实践中，速度差异并没有那么剧烈。运行程序：\n\
  \n![images](img/img_p156-1.png)\n\n\n\n\n### ByteBuffer 方法\n\n* `ByteBuffer order(ByteOrder\
  \ order)`\n\n* `ByteOrder order()`\n\n  设置或获取字节序。`order` 的值是 `ByteOrder` 类中的常量 `BIG_ENDIAN`\
  \ 或 `LITTLE_ENDIAN` 之一。\n\n* `static ByteBuffer allocate(int capacity)`\n\n  构造一个给定容量\
  \ `capacity` 的缓冲区。\n\n* `static ByteBuffer wrap(byte[] values)`\n\n  构造一个由给定数组支持缓冲区。\n\
  \n* `CharBuffer asCharBuffer()`\n\n  构造一个由此缓冲区支持的字符缓冲区。对字符缓冲区的更改将反映在此缓冲区中，但字符缓冲区有自己的\
  \ `position`、`limit` 和 `mark`。\n\n#### java.nio.CharBuffer (1.4)\n\n* `char get()`\n\
  \n* `CharBuffer get(char[] destination)`\n\n* `CharBuffer get(char[] destination,\
  \ int offset, int length)`\n\n  获取一个字符值，或一个范围的字符值，从缓冲区的 `position` 开始读取，并将 `position`\
  \ 移过已读取的字符。后两个方法返回此结果。\n\n* `CharBuffer put(char c)`\n\n* `CharBuffer put(char[]\
  \ source)`\n\n* `CharBuffer put(char[] source, int offset, int length)`\n\n* `CharBuffer\
  \ put(String source)`\n\n* `CharBuffer put(CharBuffer source)`\n\n  放入一个字符值，或一个范围的字符值，从缓冲区的\
  \ `position` 开始，并将 `position` 移过已写入的字符。从 `CharBuffer` 读取时，将读取所有剩余字符。所有方法均返回此结果。\n\
  \n#### 2.5.2 缓冲区数据结构\n\n当你使用内存映射时，你会创建一个跨整个文件或你感兴趣的文件区域的缓冲区。你也可以使用缓冲区来读写更小规模的信息块。\n\
  \n在本节中，我们将简要描述对 `Buffer` 对象的各种操作。缓冲区是一个相同类型值的数组。`Buffer` 类是一个抽象类，其具体的子类有 `ByteBuffer`、`CharBuffer`、`DoubleBuffer`、`FloatBuffer`、`IntBuffer`、`LongBuffer`\
  \ 和 `ShortBuffer`。\n\n#### 注意\n\n`StringBuffer` 类与这些缓冲区无关。\n\n在实践中，你最常用的是 `ByteBuffer`\
  \ 和 `CharBuffer`。如图 2.9 所示，缓冲区具有：\n\n* 一个不会改变的 `capacity`\n\n* 一个用于读取或写入下一个值的 `position`\n\
  \n* 一个超过该界限后读写将失去意义的 `limit`\n\n* 可选的、用于重复执行读取或写入操作的 `mark`\n\n这些值满足以下条件：\n\n`0\
  \ ≤ mark ≤ position ≤ limit ≤ capacity`\n\n缓冲区的主要目的是“先写后读”循环。在开始时，缓冲区的 `position`\
  \ 为 0，`limit` 为 `capacity`。持续调用 `put` 向缓冲区添加值。当数据耗尽或达到 `capacity` 时，就是切换到读取模式了。\n\
  \n![images](img/img_p162-1.png)\n\n**图 2.9** 缓冲区\n\n调用 `flip` 将 `limit` 设置为当前 `position`，并将\
  \ `position` 设置为 0。现在在剩余方法（返回 `limit – position`）为正值时，继续调用 `get`。当你读完缓冲区中的所有值后，调用\
  \ `clear` 为下一个写入周期准备缓冲区。`clear` 方法将 `position` 重置为 0，并将 `limit` 设置为 `capacity`。\n\
  \n如果你想重新读取缓冲区，请使用 `rewind` 或 `mark/reset`（详见 API 注释）。\n\n要获取缓冲区，请调用静态方法如 `ByteBuffer.allocate`\
  \ 或 `ByteBuffer.wrap`。\n\n然后，你可以从通道填充缓冲区，或将缓冲区内容写入通道。例如，\n\n![images](img/img_p162-2.png)\n\
  \n这可以是随机访问文件的很有用替代方案。\n\n#### java.nio.Buffer (1.4)\n\n* `Buffer clear()`\n\n  通过将\
  \ `position` 设置为 0 并将 `limit` 设置为 `capacity` 来准备此缓冲区进行写入；返回此缓冲区。\n\n* `Buffer flip()`\n\
  \n  在写入后通过将 `limit` 设置为 `position` 并将 `position` 设置为 0 来准备此缓冲区进行读取；返回此缓冲区。\n\n*\
  \ `Buffer rewind()`\n\n  通过将 `position` 设置为 0 并保持 `limit` 不变来准备重新读取相同的值；返回此缓冲区。\n\
  \n* `Buffer mark()`\n\n  将此缓冲区的 `mark` 设置为 `position`；返回此缓冲区。\n\n* `Buffer reset()`\n\
  \n  将此缓冲区的 `position` 设置为 `mark`，从而允许对标记部分再次进行读取或写入；返回此缓冲区。\n\n* `int remaining()`\n\
  \n  返回剩余的可读或可写值的数量——\n\n* `int position()`\n\n* `void position(int newValue)`\n\n\
  \  设置此缓冲区的 `position`。\n\n* `int capacity()`\n\n  返回此缓冲区的 `capacity`。\n\n## 2.6\
  \ 文件锁定\n\n当多个执行中的程序需要修改同一个文件时，它们需要通信。文件锁可以解决这个问题。文件锁控制对文件或字节范围的访问。假设你的应用程序需要锁定文件以防止其他程序修改它。要锁定文件，请调用\
  \ `FileChannel` 的 `lock` 或 `tryLock` 方法。\n\n![images](img/img_p163-1.png)\n\n或\n\
  \n![images](img/img_p163-2.png)第一个调用阻塞直到获取锁。第二个调用立即返回，如果无法获取锁则返回 `null`。要锁定文件的部分，请使用\n\
  \n![images](img/img_p164-1.png)\n\n或\n\n![images](img/img_p164-2.png) `shared` 标志为\
  \ `false` 表示锁定文件以读写。为 `true` 表示共享锁，允许多个进程读取文件，阻止任何进程获取排斥锁。并非所有操作系统都支持共享锁。即使你请求共享锁，也可能获得排斥锁。调用\
  \ `FileLock` 的 `isShared` 方法可以判断你拥有哪种。\n\n#### 注意\n\n如果你锁定文件的尾部且文件随后超过锁定区域，新增区域不受锁定。要锁定所有字节，请使用\
  \ `Long.MAX_VALUE`。\n\n完成后务必 `unlock` 锁。一如既往，最好做法是：\n\n![images](img/img_p164-3.png)\n\
  \n请记住文件锁定取决于系统。这里是一些需要注意的点：\n\n* 在某些系统上，文件锁定仅仅是*建议性*的。如果应用程序未能获取锁，它仍然可以写入被另一个应用程序锁定的文件。\n\
  \n* 在某些系统上，你不能同时锁定文件并将其映射到内存。\n\n* 文件锁由整个 Java 虚拟机持有。同一虚拟机上的并发任务无法各自获取同一个文件的锁。如果虚拟机已持有同一文件的另一个重叠锁，`lock`\
  \ 和 `tryLock` 方法将抛出 `OverlappingFileLockException`。\n\n* 在某些系统上，关闭通道会释放 Java 虚拟机持有的底层文件的所有锁。因此，应避免对同一个锁定的文件使用多个通道。\n\
  \n* 在网络文件系统上锁定文件高度取决于系统，应该尽量避免。\n\n#### java.nio.channels.FileChannel (1.4)\n\n\
  * `FileLock lock()`\n\n  获取整个文件的排斥锁。此方法阻塞直到获取锁。\n\n* `FileLock tryLock()`\n\n  获取整个文件的排斥锁，如果无法获取锁则返回\
  \ `null`。\n\n* `FileLock lock(long position, long size, boolean shared)`\n\n* `FileLock\
  \ tryLock(long position, long size, boolean shared)`\n\n\n\n\n获取文件的区域锁。第一种方法会阻塞直到获取锁，而第二种方法在无法获取锁时返回\
  \ null。参数 `shared` 为 true 时表示共享锁，为 false 时表示排他锁。\n\n### `java.nio.channels.FileLock`\
  \ **1.4**\n\n*   `void close()` **1.7** - 释放此锁。\n\n## 2.7 正则表达式\n\n正则表达式用于指定字符串模式。每当你需要定位符合某种特定模式的字符串时，就可以使用正则表达式。例如，我们的示例程序之一通过查找模式为\
  \ `<a href=\". . .\">` 的字符串来定位 HTML 文件中的所有超链接。\n\n当然，在指定模式时，`. . .` 记法并不精确。你需要使用特殊的语法来精确指定哪些字符序列是合法的匹配项，并用其来描述模式。\n\
  \n在接下来的章节中，我们将介绍 Java API 使用的正则表达式语法，并讨论如何将正则表达式投入实际工作中。\n\n#### 2.7.1 正则表达式语法\n\
  \n让我们从一个简单的例子开始。正则表达式\n\n![images](img/img_p166-1.png)\n\n匹配任何以下形式的字符串：\n\n*   第一个字母是\
  \ `J` 或 `j`。\n*   接下来的三个字母是 `ava`。\n*   字符串的其余部分由一个或多个任意字符组成。\n\n例如，字符串 \"javanese\"\
  \ 符合这个正则表达式，但字符串 \"Core Java\" 不符合。\n\n如你所见，你需要了解语法才能理解正则表达式的意思。幸运的是，对于大多数用途来说，几个简单的结构就足够了。\n\
  \n在正则表达式中，字符表示其本身，除非它是保留字符之一。\n\n![images](img/img_p166-2.png)\n\n例如，正则表达式 `Java`\
  \ 仅匹配字符串 `Java`。\n\n符号 `.` 匹配任何单个字符。例如，`.a.a` 匹配 `Java` 和 `data`。\n\n`*` 符号表示前面的结构可以重复\
  \ 0 次或多次；对于 `+`，则是重复 1 次或多次。后缀 `?` 表示该结构是可选的（0 次或 1 次）。例如，`be+s?` 匹配 `be`、`bee`\
  \ 和 `bees`。你可以使用 `{ }` 指定其他次数——参见表 2.7。\n\n`|` 表示替代方案：`.(oo|ee)f` 匹配 `beef` 或 `woof`。注意括号——如果没有括号，`.oo|eef`\
  \ 将是 `.oo` 和 `eef` 之间的替代方案。括号也用于分组——参见第 151 页的 2.7.4 节 “分组”。\n\n*字符类*是一组在括号内的字符备选方案，例如\
  \ `[Jj]`、`[0-9]`、`[A-Za-z]` 或 `[⁰-9]`。在字符类内部，`-` 表示范围（所有 Unicode 值落在两个边界之间的字符）。然而，如果\
  \ `-` 是字符类中的第一个或最后一个字符，则它表示其本身。`^` 作为字符类中的第一个字符，则表示补集（除指定字符以外的所有字符）。\n\n有许多*预定义字符类*，如\
  \ `\\d`（数字）或 `\\p{Sc}`（Unicode 货币符号）。参见表 2.7 和 2.8。\n\n字符 `^` 和 `$` 匹配输入的开始和结束。\n\
  \n如果你需要使用字面量的 `.` `*` `+` `?` `{` `|` `(` `)` `[` `\\` `^` `$`，需要在它们前面加一个反斜杠。在字符类内部，你只需要转义\
  \ `[` 和 `\\`，只要你留意 `]` - `^` 的位置即可。\n\n另一种方法是使用 `\\Q` 和 `\\E` 包围字符串。例如，`\\(\\$0\\\
  .99\\)` 和 `\\Q($0.99)\\E` 均匹配字符串 `($0.99)`。\n\n![images](img/tip.png) **提示**\n\n\
  如果你有一个可能包含正则表达式语法中许多特殊字符之一的字符串，可以通过调用 `Parse.quote(str)` 对它们进行转义。这只是简单地将字符串用 `\\\
  Q` 和 `\\E` 包围，但它处理了 `str` 可能包含 `\\E` 的特殊情况。\n\n**表 2.7** 正则表达式语法\n\n![images](img/img_p167.png)![images](img/img_p168.png)![images](img/img_p169.png)![images](img/img_p170-1.png)\n\
  \n**表 2.8** 预定义字符类 \\p{...}\n\n![images](img/img_p170-2.png)\n\n遗憾的是，正则表达式语法在不同的程序和库之间并没有完全标准；虽然基本结构有共识，但在细节上有很多令人疯狂的差异。Java\
  \ 正则表达式类使用的语法与 Perl 语言使用的语法相似但并不完全相同。表 2.7 显示了 Java 语法的的所有结构。关于正则表达式语法的更多信息，请参考\
  \ `Pattern` 类的 API 文档或 Jeffrey E. F. Friedl 写的著作 *Mastering Regular Expressions*\
  \ (O’Reilly and Associates, 2006)。\n\n#### 2.7.2 匹配整个字符串\n\n通常，使用正则表达式有两种方法：要么你想查找一个字符串是否符合某种模式，要么你想找到所有匹配项。\n\
