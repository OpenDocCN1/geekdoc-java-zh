  \ 之前，返回负值；如果它们被认为相同，返回 0；否则返回正值。\n\n### java.text.Normalizer 6\n\n* `static String\
  \ normalize(CharSequence str, Normalizer.Form form)`\n\n返回 `str` 的规范化形式。格式的值为 `NFD`、`NFKD`、`NFC`\
  \ 或 `NFKC` 之一。\n\n## 6.5 消息格式化\n\nJava 库有一个 `MessageFormat` 类，用于格式化带有变量部分的文本。它类似于使用\
  \ `printf` 方法进行格式化，但它支持本地化以及数字和日期格式。我们将在后续章节中检查该机制。\n\n#### 6.5.1 格式化数字和日期\n\n这是一个典型的消息格式化字符串：\n\
  \n![images](img/img_p379.png)\n\n括号中的数字是实际名称和值的占位符。静态方法 `MessageFormat.format` 允许你为变量替换值。它是一个“变长参数”方法，因此你可以按照如下所示提供参数：\n\
