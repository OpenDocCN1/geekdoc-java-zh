  \n#### 9.1.4.3 编辑单元格\n\n要启用单元格编辑，表格模型必须通过定义 `isCellEditable` 方法指示哪些单元格是可编辑的。通常，你会希望让某些列可编辑。在示例程序中，我们允许对四列进行编辑。\n\
