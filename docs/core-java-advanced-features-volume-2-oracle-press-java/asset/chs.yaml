  \n### 8.3.3 提交表单\n\n在前面的节中，你看到了如何从 Web 服务器读取数据。现在我们将向你展示如何通过表单向 Web 服务器发送数据。\n\n\
  要从浏览器向 Web 服务器发送信息，用户填写表单，如图 8.7 所示。当用户点击提交按钮时，文本框的内容、复选框、单选按钮和其他输入元素的设置将发送到 Web\
  \ 服务器。\n\n许多技术允许 Web 服务器调用程序。其中最好的包括 Java Servlet、JavaServer Faces、Microsoft Active\
  \ Server Pages (ASP) 和通用网关接口（CGI）脚本。\n\n服务端处理表单并产生另一个 HTML 页面，Web 服务器将其发送回浏览器。这一序列在图\
  \ 8.8 中所示。响应页面可以包含新信息（例如信息搜索程序），或仅是确认信息。浏览器随后显示响应页面。\n\n![images](img/img_p504.png)\n\
