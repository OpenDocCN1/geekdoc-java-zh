  \ true。\n*   `Duration (plus|minus)(Nanos|Millis|Seconds|Minutes|Hours|Days)(long\
  \ number)`\n    通过加减给定数量产生持续时间。\n\n## 5.2 本地日期\n\n现在我们将绝对时间转向人类时间。人类时间有两种：*本地日期*和*时区时间*。`本地日期`具有日期和时间，但没有时区信息。`LocalDate`\
  \ 是具有年、月、日的日期。在许多计算不需要时区，在某些情况下它们甚至会成为障碍。假设你安排每周一次会议。如果你恰好跨越夏令边界，会议将早一小时或晚一小时！由于这个原因，API\
  \ 设计者建议除非真的需要否则不要使用时区时间。`LocalDate` 是具有年、月、日的日期。要构造一个，可以使用 `now` 或 `of` 静态方法：\n\n\
  ![images](img/img_p331.png)\n\n与 UNIX 和 `java.util.Date` 中不规则的约定不同（后者的月份从 0 开始，年份从\
  \ 1900 年计算），这里你提供常规月份数字。或者，你可以使用 `Month` 枚举。\n\n本节末尾的 API 注释显示了处理 `LocalDate` 对象的最有用方法。例如，`程序员节`是年的第\
  \ 256 天。这是你如何轻松计算它的：\n\n![images](img/img_p332.png)\n\n回两个时态之间的差异是 `Duration`。本地日期的等效物是\
  \ `Period`，它表示流过的年、月或天数。你可以调用 `birthday.plus(Period.ofYears(1))` 获取明年的生日。当然，你也可以直接调用\
  \ `birthday.plusYears(1)`。但 `birthday.plus(Period.ofDays(365))` 在闰年不会产生正确的结果。\n\n\
  `until` 方法产生两个本地日期之间的差异。例如，\n\n![images](img/img_p333.png)\n\n产生一个 5 个月 21 天的周期。这实际上并不是非常有用，因为每个月的天数不同。要找到天数，请使用：\n\
  \n![images](img/img_p334.png)\n\n#### ![images](img/caution.png) **注意**\n\n`LocalDate`\
  \ API 中的某些方法可能会创建不存在的日期。例如，向 1 月 31 日增加一个月不应该产生 2 月 31 日。这些方法不是抛出异常，而是返回月的最后有效一天。例如，\n\
  \n![images](img/img_p335.png)\n\n和\n\n![images](img/img_p336.png)\n\n产生了 2016 年\
  \ 2 月 29 日。\n\n\n\n\n`getDayOfWeek()` 返回工作日，其值为 `DayOfWeek` 枚举的一个值。`DayOfWeek.MONDAY`\
  \ 的数值为 1，而 `DayOfWeek.SUNDAY` 的值为 7。例如，\n\n![images](img/img_p334-4.png)\n\n返回 1。`DayOfWeek`\
  \ 枚举提供了便利方法 `plus` 和 `minus`，用于计算对 7 取模后的工作日。例如，`DayOfWeek.SATURDAY.plus(3)` 返回\
  \ `DayOfWeek.TUESDAY`。\n\n#### ![images](img/note.png) **注意**\n\n周末日实际上位于该周的最后。这与\
  \ `java.util.Calendar` 不同，在后者周日的值为 1，周六值为 7。\n\nJava 9 增加了两个实用的方法 `datesUntil`，它们返回\
  \ `LocalDate` 对象的流。\n\n![images](img/img_p334-5.png)\n\n除了 `LocalDate`，之外还有 `MonthDay`、`YearMonth`\
  \ 和 `Year` 类来描述部分日期。例如，12 月 25 日（不指定年份）可以表示为 `MonthDay`。\n\nListing 5.2 中的示例程序展示了如何使用\
