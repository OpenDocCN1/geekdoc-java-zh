  \ `action`。\n\n### 1.6 简单归约\n\n现在你已经学习了如何创建和转换流，我们最终将进入最重要的点——从流中获取答案。本节涵盖的方法被称为*归约*（redu）。归约是终端操作。你已经见过了一个简单的归约：`count`\
  \ 方法，它返回流中元素的数量。\n\n在过去，在这种情况下通常会返回 `null`。但 `Optional` 类型是指示缺失返回值的更好方式。我们将在下一节中详细讨论\
  \ `Optional` 类型。这里是如何获取流的最大值：\n\n![images](img/img_p38-1.png)\n\n`findFirst` 返回非空集合中的第一个值。它与\
  \ `filter` 结合时通常有用。例如，在这里找到以字母 Q 开头的单词，如果它存在：\n\n![images](img/img_p38-2.png)\n\n\
  如果你接受任何匹配，而不仅仅是第一个，请使用 `findAny` 方法。这在并行化流时有效，因为流可以报告它找到的任何匹配，而不是限于第一个。\n\n![images](img/img_p39-1.png)\n\
  \n如果你只想知道是否存在匹配，使用 `anyMatch`。该方法接受谓词参数，因此你不需要使用 `filter`。\n\n![images](img/img_p39-2.png)\n\
  \n还有 `allMatch` 和 `noneMatch` 方法，当所有元素或没有元素匹配谓词时返回真。这些方法在并行运行时也能受益。\n\n#### `java.util.stream.Stream`\
  \ 8\n\n*   `Optional<T> max(Comparator<? super T> comparator)`\n*   `Optional<T>\
  \ min(Comparator<? super T> comparator)`\n    使用给定比较器定义的顺序产生此流的最大元素或最小元素，如果流为空，则产生一个空的\
  \ Optional。这些是终端操作。\n*   `Optional<T> findFirst()`\n*   `Optional<T> findAny()`\n\
  \    产生此流的第一个或任意元素，如果流为空，则产生一个空的 Optional。这些是终端操作。\n*   `boolean anyMatch(Predicate<?\
  \ super T> predicate)`\n*   `boolean allMatch(Predicate<? super T> predicate)`\n\
