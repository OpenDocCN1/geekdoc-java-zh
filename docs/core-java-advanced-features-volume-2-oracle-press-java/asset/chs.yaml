  \ `fun` 方法的字节码。\n\n![images](img/img_p540.png)\n\n图 8.13 使用十六进制修改字节码\n\n将 `3C` 改为\
  \ `3B` 并保存类文件。然后尝试运行 `VerifierTest` 程序。你收到一个错误信息：\n\n![images](img/img_p540.png)\n\
  \n这很好——虚拟机检测到了我们的修改。\n\n现在带有 `-noverify`（或 `-Xverify:none`）选项运行程序：\n\n![images](img/img_p540.png)\n\
  \n`fun` 方法返回一个看似随机的值。这实际上是 2 加上存储在变量 `n` 中的值，而该变量从未被初始化。\n\n\n\n\nJava API 提供了一个名为\
  \ Java 身份验证和授权服务（JAAS）的框架，它提供了对平台提供的和自定义认证机制的访问。我们将在接下来的章节中讨论 JAAS 框架。\n\n#### 8.8.1\
  \ JAAS 框架\n\n从名称可以看出，JAAS 框架包含两个部分。“身份验证”（authentication）部分关注确定程序用户的身份。“授权”（authorization）部分与已弃用的安全管理器（security\
  \ manager）相关，我们不再讨论它。\n\nJAAS 是一个“可插的”API，它将 Java 与用于实现认证的特定技术隔离开。它支持 UNIX 登录、Windows\
  \ 登录、Kerberos 认证以及基于证书的认证等。\n\n以下是登录代码的基本结构：\n\n![images](img/img_p542-1.png)\n\n\
  现在，subject（主体）表示已通过身份验证的个体。\n\n`LoginContext` 构造函数中的字符串参数 `\"Login1\"` 指向 JAAS 文件中同名的项。以下是一个示例配置文件：\n\
  \n![images](img/img_p542-2.png)\n\n当然，JDK 并不包含生物识别登录模块。以下模块由 `com.sun.security.auth.module`\
  \ 包提供：\n\n![images](img/img_p543-1.png)\n\n一个登录策略由一系列登录模块组成，每个模块被标记为 required（必须）、sufficient（足够）、requisite（必要）或\
  \ optional（可选）。这些关键字的含义由以下算法给出：\n\n1. 依次执行模块，直到一个 sufficient 模块成功、一个 requisite 模块失败，或到达模块列表末尾。\n\
  2. 如果所有 required 和 requisite 模块都成功，或者它们中没有一个被执行，且至少有一个 sufficient 或 optional 模块成功，则身份验证成功。\n\
  \n登录会验证一个 `subject`，该主体可以拥有多个 `principals`（主体单元）。principal 描述了主体的某些属性，例如用户名、组 ID\
  \ 或角色。`com.sun.security.auth.UnixPrincipal` 描述 UNIX 登录名，而 `UnixNumericGroupPrincipal`\
  \ 可以测试是否属于某个 UNIX 组。\n\n代码列表 8.13 中的程序显示了当前登录用户的 principals。以如下方式运行程序：\n\n![images](img/img_p543-2.png)\n\
