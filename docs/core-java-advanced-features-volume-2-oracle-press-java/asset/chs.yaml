  4. 完成后，切换到启动服务器程序的窗口并按 `Ctrl+C` 杀死它。\n\n![images](img/img_p483-1.png)\n\n**图 8.5**\
  \ 多个 telnet 窗口同时通信\n\n#### ![images](img/note.png) 注意\n\n在程序程序中，我们为每个连接产生了一个独立的线程。这种方法对于高性能服务器来说是不理想的。你可以通过使用\
