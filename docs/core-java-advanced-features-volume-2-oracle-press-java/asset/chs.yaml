  #### 9.3.8 透明度与合成 (Transparency and Composition)\n\n在标准的 RGB 模型中，每种颜色都由其红、绿、蓝分量描述。然而，描述图像中透明或部分透明的区域也是方便的。当将一个图像叠加到现有绘制上时，透明像素完全不会遮挡它们下方的像素，而半透明像素会与其下方的像素混合。图\
  \ 9.51 显示了在图像上叠加一个半透明矩形的效果。你仍然可以看到图像的细节从矩形下方透出来。\n\n在 Java 2D API 中，透明度由一个 alpha\
  \ 通道（alpha channel）描述。每个像素除了红、绿、蓝颜色分量外，还有一个 0（完全透明）到 1（完全不透明）之间的 alpha 值。例如，图 9.51\
  \ 中的矩形是用具有 50% 透明度的淡黄色填充的：\n\n![images](img/img_p704.png)![images](img/img_p705-1.png)\n\
  \n**图 9.51** 叠加半透明矩形\n\n现在让我们看看叠加两个形状会发生什么。你需要混合或合成（compose）源像素和目标像素的颜色以及 alpha\
  \ 值。Porter 和 Duff 是计算机图形领域的两位研究人员，他们为这种混合过程制定了 12 种合成规则（composition rules）。Java\
  \ 2D API 实现了所有这些规则。在继续之前，我想指出，这些规则中只有两个具有实际意义。如果你发现这些规则很深奥或令人困惑，只需使用 `SRC_OVER`\
  \ 规则即可。它是 `Graphics2D` 对象的默认规则，并提供最直观的结果。\n\n这是这些规则背后的理论。假设你有一个 alpha 值为 `aS` 的源像素（source\
  \ pixel）。在图像中，已经有一个 alpha 值为 `aD` 的目标像素（destination pixel）。你想对它们进行合成。图 9.52 显示了如何设计合成规则。\n\
  \n![images](img/img_p705-2.png)\n\n**图 9.52** 设计合成规则\n\nPorter 和 Duff 将 alpha 值视为使用像素颜色的概率。从源的角度来看，有\
  \ `aS` 的概率想要使用源颜色，有 `1 - aS` 的概率它不在乎。目标像素也是如此。在合成颜色时，我们假设这些概率是相互独立的。那么就有四种情况，如 图\
  \ 9.52 所示。如果源想使用源颜色而目标不在乎，让源按其意愿是合理的。这就是为什么图中右上角标记为“S”。该事件的概率为 `aS * (1 - aD)`。同样，左下角标记为“D”。当目标和源都想选择自己的颜色时，该怎么办？这就是\
  \ Porter–Duff 规则发挥作用的地方。如果我们认为源更重要，我们在右下角也标记为“S”。这条规则被称为 `SRC_OVER`。在 във规则中，你以\
  \ `aS` 为权重结合源颜色，以 `(1 - aS) * aD` 为权重结合目标颜色。\n\n视觉效果是源和目标的混合，并优先考虑源。特别地，如果 `aS`\
  \ 为 1，则完全不考虑目标颜色。如果 `aS` 为 0，则源像素完全透明的，目标颜色保持不变。\n\n\n\n其他规则取决于你在概率图的方框中放入了什么字母。表\
  \ 9.3 和图 9.53 显示了 Java 2D API 支持的所有规则。该图中的图像展示了当一个 alpha 值为 0.75 的矩形源区域与一个 alpha\
  \ 值为 1.0 的椭圆目标区域组合时，规则的结果。\n\n**表 9.3** Porter–Duff 组合规则\n\n![images](img/img_p706.png)![images](img/img_p707-1.png)\n\
  \n**图 9.53** Porter–Duff 组合规则\n\n如你所见，大多数规则并没有很有用。考虑 `DST_IN` 规则作为一个极端情况。它完全没有考虑源颜色，而是使用源的\
  \ alpha 值来影响目标。`SRC` 规则则可能有用——它强制使用源颜色，关闭与目标的混合。\n\n使用 `Graphics2D` 类的 `setComposite`\
  \ 方法来安装实现了 `Composite` 接口的类对象。Java 2D API 提供了这样一个类，`AlphaComposite`，它实现了图 9.53 中的所有\
  \ Porter–Duff 规则。\n\n`AlphaComposite` 类的工厂方法 `getInstance` 产生一个 `AlphaComposite`\
  \ 对象。你提供规则和用于源像素的 alpha 值。例如，考虑以下代码：\n\n![images](img/img_p707-2.png)\n\n然后用蓝色和\
  \ 0.5 的 alpha 值绘制该矩形。由于组合规则是 `SRC_OVER`，它会透明地叠加在现有图像上。\n\nListing 9.17 中的程序允许你探索这些组合规则。从组合框中选择一个规则，并使用滑块设置\
  \ `AlphaComposite` 对象的 alpha 值。\n\n此外，程序还显示了每种规则的文字描述。请注意，这些描述是从组合规则图中计算出来的。例如，第二行中的\
  \ \"DS\" 代表“与目标混合”。\n\n该程序有一个重要的转折。对应屏幕的图形上下文并不保证具有 alpha 通。（事实上，它通常没有）。当像素被存放到没有\
  \ alpha 通道的目标时，像素颜色会与 alpha 值相乘，且 alpha 值会被丢弃。现在，几条 Porter–Duff 规则使用了目标的 alpha 值，这意味着目标\
  \ alpha 通道很重要。由于这个原因，我们使用带有 ARGB 颜色模型的缓冲图像来组合形状。图像组合完成后，我们将结果图像绘制到屏幕上。\n\n![images](img/img_p708.png)\n\
