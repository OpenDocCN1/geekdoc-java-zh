  \ |\n    | | attributes | 文档属性，如果不需要属性，则为 `null` |\n\n### 9.5.4 流打印服务\n\n打印服务将打印数据发送到打印机。流打印服务生成相同的打印数据，但将它们发送到流中，也许是为了延迟打印，或者因为打印数据格式可以被其他程序解释。特别地，如果打印数据格式是\
  \ PostScript，那么将打印数据保存到文件可能会有用，因为许多程序都可以处理 PostScript 文件。Java 平台包含一种流打印服务，可以从图像和\
  \ 2D 图形产生 PostScript 输出。你可以在所有系统上使用该服务，即使没有本地打印机。\n\n枚举流打印服务比定位普通打印服务稍微麻烦一些。你需要待打印对象的\
