  \ 值。\n\n#### 9.4.2 图像过滤\n\n在前面的节中，你学习了如何从零构建图像。然而，通常你出于其他原因访问图像：你已经有了图像并想改进它。可以使用前面节的方法来读取图像数据，处理它们并写回。幸运的是，Java\
  \ 2D API 提供了许多执行常见图像操作的*过滤器*（filters）。\n\n这些图像操作都实现了 `BufferedImageOp` 接口。构造操作后，只需调用\
  \ `filter` 方法即可转换图像。\n\n![images](img/img_p732-1.png)\n\n某些操作可以原地转换图像（`op.filter(image,\
  \ image)`），但大多数不能。\n\n五个类实现了 `BufferedImageOp` 接口：\n\n![images](img/img_p732-2.png)\n\
  \n`AffineTransformOp` 对像素执行仿变换。例如，这里你可以绕中心旋转图像：\n\n![images](img/img_p732-3.png)\n\
  \n`AffineTransformOp` 构造函数需要一个仿变换和一个*插值*（interpolation）策略。如果源像素位于目标像素之间，则插值是必要的。例如，如果你旋转源像素，它们通常不会落在目标像素上。三种插值策略：`AffineTransformOp.TYPE_BICUBIC`、`AffineTransformOp.TYPE_BILINEAR`\
  \ 和 `AffineTransformOp.TYPE_NEAREST_NEIGHBOR`。双立方插值比其他两种慢一点，但效果更好。\n\n代码列表 9.22](#chapter009-02.xhtml_list9-22）中的程序可以让图像旋转\
  \ 5 度（见图 9.57](#chapter009-02.xhtml_fig9-57)）。\n\n![images](img/img_p733-1.png)\n\
  \n**图 9.57** 旋转后的图像\n\n`RescaleOp` 对图像中的每个颜色组件执行缩放操作\n\n![images](img/img_p733-2.png)\n\
  \n（Alpha 分量不受影响。）使用 `a > 1` 进行缩放的效果是亮亮图像。通过指定缩放参数和可选的渲染提示来构造 `RescaleOp`。在代码列表 9.22](#chapter009-02.xhtml_list9-22)中，我们使用：\n\
  \n![images](img/img_p733-3.png)\n\n你为每个颜色组件提供独立的缩放值——参见 API 说明。\n\n`LookupOp` 操作允许你为采样值指定任意映射。提供一个指定如何映射每个表的。在示例程序中，我们计算所有颜色的*反色*，将颜色\
  \ *c* 变为 255 – *c*。\n\n\n\n\n`LookupOp` 构造函数需要一个 `LookupTable` 类型的对象和一个可选提示的映射（map）。`LookupTable`\
  \ 类是一个抽象类，它有两个具体的子类：`ByteLookupTable` 和 `ShortLookupTable`。由于 RGB 颜色值是字节，因此一个 `ByteLookupTable`\
  \ 就足够了。然而，由于 [`bugs.java.com/bugdatabase/view_bug.do?bug_id=6183251`](https://bugs.java.com/bugdatabase/view_bug.do?bug_id=6183251)\
  \ 中描述的错误，我们将使用 `ShortLookupTable` 代替。以下是我们在为示例程序构造 `LookupOp` 的方式：\n\n![images](img/img_p734-1.png)\n\
  \n查找分别应用于每个颜色分量，但不会应用于 alpha（透明度）通道。你也可以为每个颜色分量提供不同的查找表——请参见 API 注释。\n\n#### ![images](img/note.png)\
  \ 注意事项\n\n你不能对使用索引颜色模型的图像应用 `LookupOp`。（在这些图像中，每个样本值都是调色板的偏移量。）\n\n`ColorConvertOp`\
  \ 用于颜色空间转换。我们在这里不讨论它。\n\n这些变换中最功能强大的是 `ConvolveOp`，它执行数学上的 `convolution`（卷积）。在不深入探讨数学细节的情况下，其基本思想非常简单。例如，考虑\
  \ `blur filter`（参见图 9.58）。\n\n![images](img/img_p734-2.png)\n\n**图 9.58** 图像模糊\n\
  \n模糊通过将每个像素替换为像素及其八个相邻像素的 `average` 值来实现。从直觉上看，这种操作会让图片模糊是合理的。从数学上讲，平均值可以表示为带有以下\
  \ `kernel:` 核的卷积操作：\n\n![images](img/img_p735-1.png)\n\n卷积的核是一个矩阵，它告诉应该对邻接值应用什么权重。上面的核产生一张模糊的图像。不同的核可以执行\
  \ `edge detection`（边缘检测），定位颜色变化的区域：\n\n![images](img/img_p735-2.png)\n\n边缘检测是分析照片图像的重要技术（参见图\
  \ 9.59）。\n\n![images](img/img_p735-3.png)\n\n**图 9.59** 边缘检测与反转\n\n要构造卷积操作，首先设置一个核值数组并构造一个\
  \ `Kernel` 对象。然后，从该核构造一个 `ConvolveOp` 对象并将其用于过滤。\n\n![images](img/img_p735-4.png)\n\
  \nListing 9.22 中的程序允许用户加载 GIF 或 JPEG 图像，并执行我们讨论过的图像处理操作。得益于 Java 2D API 提供的操作能力，该程序非常简单。\n\
  \n**Listing 9.22** `imageProcessing/ImageProcessingFrame.java`\n\n![images](img/img_p736.png)![images](img/img_p737.png)![images](img/img_p738.png)![images](img/img_p739.png)\n\
