  \ true。\n\n## 5.5 时区时间\n\n时区，也许因为它们完全是人类的产物，甚至比地球不规则旋转引起的复杂性更加混乱。在一个理性的世界里，我们都应该遵循格林尼治的时钟，我们中的一些会在\
  \ 02:00 吃午饭，另一些人会在 22:00 吃。我们的胃会解决问题的。这种情况在中国确实存在，那里横跨了四个常规时区。在其他地方，我们的时区边界不规则且不断变化，更糟糕的是还有夏令时。\n\
  \n对于智者来说，时区可能看起来反复无常，但它们是生活的现实。当你实现一个日历应用程序时，它需要适用于从一个国家飞往另一个国家的人。当纽约时间 10:00 有电话会议，而你恰好在柏林时，你会在正确的本地时间收到提醒。\n\
  \n互联网数字分配机构（IANA）维护着一个全球已知时区的数据库（[www.iana.org/time-zones](http://www.iana.org/time-zones)），该数据库每年更新几次。大部分更新涉及夏令时规则的变更。Java\
  \ 使用 IANA 数据库。\n\n每个时区都有一个 ID，例如 `America/New_York` 或 `Europe/Berlin`。要查找所有可用时区，调用\
  \ `ZoneId.getAvailableZoneIds`。在本文写作时，已有近 600 个 ID。\n\n给定一个时区 ID，静态方法 `ZoneId.of(id)`\
  \ 返回一个 `ZoneId` 对象。你可以使用该对象通过调用 `local.atZone(zoneId)` 将 `LocalDateTime` 对象转换为 `ZonedDateTime`\
  \ 对象，或者通过调用静态方法 `ZonedDateTime.of(year, month, day, hour, minute, second, nano,\
  \ zoneId)` 来构造一个 `ZonedDateTime`。例如，\n\n![images](img/img_p341.png)\n\n这是一个特定的时刻。调用\
  \ `apollo11launch.toInstant` 来获取 `Instant`。相反，如果你有一个时刻，调用 `instant.atZone(ZoneId.of(\"\
  UTC\"))` 来获取格林尼治皇家天文台的 `ZonedDateTime`，或使用另一个 `ZoneId` 获取地球上其他地方的时间。\n\n#### ![images](img/note.png)\
  \ 注意\n\nUTC 代表“协调世界时间”（Coordinated Universal Time），该缩写是上述英语和法语“Temps Universel Coordiné”之间的折中方案，其特点是在这两种语言中都是不正确的。UTC\
  \ 是格林尼治皇家天文台的时间，不考虑夏令时。\n\n`ZonedDateTime` 的许多方法与 `LocalDateTime` 相同（见本节末的 API 注释）。大部分都很直接，但夏令时引入了一些复杂性。\n\
  \n当夏令时开始时，时钟快小时。当你构造落在跳过小时的时间会发生什么？例如，2013 年，中部地区在 3 月 31 日 2:00 进入夏令时。如果你尝试构造一个不存在的时间\
  \ 3 月 31 日 2:30，你实际上得到的是 3:30。\n\n![images](img/img_p342-1.png)\n\n相反，当夏令时结束时，时钟回拨小时，就会有两个具有相同的本地时间！当你在该时间段内构造时间时，你会得到两个中较早的一个。\n\
  \n![images](img/img_p342-2.png)\n\n 一小时后，时间的小时和分钟相同，但区域偏移（offset）已经改变。\n\n在跨越夏令时边界调整日期时也需要注意。例如，如果你为下周安排了会议，不要添加七天的持续时间：\n\
  \n![images](img/img_p342-3.png)\n\n相反，使用 `Period` 类。\n\n![images](img/img_p342-4.png)\n\
  \n#### ![images](img/caution.png) 警告\n\n还有一个 `OffsetDateTime` 类，表示相对于 UTC 有偏移的时间，但没有时区规则。该类旨在用于明确不需要这些规则的特殊应用程序，例如某些网络协议。对于人类时间，请使用\
  \ `ZonedDateTime`。\n\nListing 5.3 中的示例程序演示了 `ZonedDateTime` 类。\n\n**Listing 5.3**\
