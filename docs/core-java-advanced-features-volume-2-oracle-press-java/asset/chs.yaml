  \ getAvailableCurrencies()` **7**\n\n获取所有可用的货币。\n\n## 6.3 日期和时间\n\n当你格式化日期和时间时，你应该关注四个依赖于语言区域的问题：\n\
  \n*   月份和周的名称应以本地语言呈现。\n*   对于年、月、日的顺序将会有本地偏好。\n*   格里历历可能不是本地的。\n*   必须考虑时区。\n\n\
