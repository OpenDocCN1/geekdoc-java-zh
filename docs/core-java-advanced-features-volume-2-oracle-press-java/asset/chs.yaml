  \ 99，以此此类推。\n\n我们示例的结果是字符串\n\n![images](img/img_p380-2.png)\n\n这是一个一个开始，但并不完美。我们不想显示“12:00\
  \ AM”这样的时间，并且希望将损害金额打印为货币值。我们这样做的方法是为某些占位符提供可选格式：\n\n![images](img/img_p380-3.png)\n\
  \n此示例代码输出：\n\n![images](img/img_p380-4.png)\n\n通常，占位符索引后面可以跟着一个*类型*和一个*样式*。用逗号分隔索引、类型和样式。类型可以是任意一种：\n\
  \n![images](img/img_p380-5.png)\n\n如果类型是 `number`，则样式可以是\n\n![images](img/img_p380-6.png)\n\
  \n或者它可以是一个 `DecimalFormat` 模式，例如 `$##0`——可能的格式请参见第 345 页的第 6.2.2 节，“DecimalFormat\
  \ 类”。\n\n如果类型是时间或日期，则样式可以是\n\n![images](img/img_p380-7.png)\n\n或者日期格式模式，如 `yyyy-MM-dd`。（请查看\
  \ `SimpleDateFormat` 类的文档获取可能的格式。）\n\n### ![images](img/caution.png) 注意\n\n静态方法\
  \ `MessageFormat.format` 使用当前本地化来格式化值。要使用任意本地化进行格式化，你必须付出更多努力，因为没有你可以使用的“变长参数”方法。你需要将要格式化的值放入\
  \ `Object[]` 数组中，如下所示：\n\n![images](img/img_p381.png)\n\n### java.text.MessageFormat\
  \ 1.1\n\n* `MessageFormat(String pattern)`\n* `MessageFormat(String pattern, Locale\
  \ loc)`\n\n使用指定的模式和本地化构造消息格式化对象。\n\n* `void applyPattern(String pattern)`\n\n将消息格式化对象的模式设置为指定的模式。\n\
  \n* `void setLocale(Locale loc)`\n* `Locale getLocale()`\n\n设置或获取用于消息中占位符的本地化。该本地化*仅*用于你通过调用\
  \ `applyPattern` 方法设置的后续模式。\n\n* `static String format(String pattern, Object...\
  \ args)`\n\n使用 `args[i]` 作为占位符 `{i}` 的输入来格式化模式字符串。\n\n* `StringBuffer format(Object\
  \ args, StringBuffer result, FieldPosition pos)`\n\n格式化此 `MessageFormat` 的模式。`args`\
  \ 参数必须是一个对象数组。格式化后的字符串附加到 `result` 中，并返回 `result`。如果 `pos` 等于 `new FieldPosition(MessageFormat.Field.ARGUMENT)`，其\
  \ `beginIndex` 和 `endIndex` 属性被设置为替换 `{1}` 占位符文本的位置。如果你对位置信息感兴趣，请提供 `null`。\n\n\
  ### java.text.Format 1.1\n\n* `String format(Object obj)`\n\n根据此格式器的规则格式化给定对象。此方法调用\
  \ `format(obj, new StringBuffer(), new FieldPosition(1)).toString()`。\n\n#### 6.5.2\
  \ 选择格式化\n\n让我们仔细观察上一一节的模式：\n\n![images](img/img_p382-1.png)\n\n如果我们将灾害占位符 `{0}`\
  \ 替换为 \"earthquake\"，该句子在英语中语法上是不正确的：\n\n![images](img/img_p382-2.png)\n\n\n\n如你所知，Java\
  \ 编程语言本身完全基于 Unicode 的。然而，Windows 和 Mac OS X 仍然支持旧的字符编码，例如西欧国家使用的 `Windows-1252`\
  \ 或 `Mac Roman`，或者台湾使用的 `Big5`。因此，通过文本与用户通信并不像想象中那么简单。接下来的章节将讨论你可能会遇到的复杂情况。\n\n\
  ## 6.6.1 文件\n\n如今，使用 `UTF-8` 来保存和加载文本文件是最好的。但你可能需要处理旧文件。如果你知道预期的字符编码，可以在写入或读取文本文件时指定它：\n\
  \n![images](img/img_p384-2.png)\n\n为了猜测最佳使用的编码，可以通过调用以下方法获取“平台编码”：\n\n![images](img/img_p384-3.png)\n\
  \n## 6.6.2 行结束符\n\n这不是区域的问题，而是平台的问题。在 Windows 上，文本文件期望在每行末尾使用 `\\r\\n`，而基于 UNIX\
  \ 的系统只需要一个 `\\n` 字符。现在大多数 Windows 程序可以只处理 `\\n`。显著的例外是记事本（Notepad）。如果你认为用户能够双击你的应用程序生成的文本文件并在记事本中查看这一点很重要，请确保该文本文件具有正确的行结束符。\n\
  \n任何使用 `println` 方法写入的行都会被正确终止。唯一的问题是你打印了包含 `\\n` 字符的字符串。它们不会被自动修改为平台行结束符。\n\n与其在字符串中使用\
  \ `\\n`，你可以使用 `printf` 和 `%n` 格式说明符来产生取决于平台的行结束符。例如，\n\n![images](img/img_p385-1.png)\n\
  \n在 Windows 上产生\n\n![images](img/img_p385-2.png)\n\n在其他所有地方产生\n\n![images](img/img_p385-3.png)\n\
  \n## 6.6.3 控制台\n\n如果你编写了通过 `System.in/System.out` 或 `System.console()` 与用户通信的程序，你必须面对控制台可能使用与\
  \ `Charset.defaultCharset()` 报告的平台编码不同的字符编码的可能性。这在 Windows 上使用 `cmd` 终端时尤为明显。在美\
  \ own 版的 Windows 10 中，命令终端仍然使用源自 1982 年 IBM 个人计算机的古旧 `IBM437` 编码。没有官方 API 来显示该信息。`Charset.defaultCharset()`\
  \ 方法将返回 `Windows-1252` 字符集，这与其非常不同。例如，欧元符号 `€` 存在于 `Windows-1252` 中但在 `IBM437` 中不存在。当你调用\n\
  \n![images](img/img_p385-4.png)\n\n控制台将显示\n\n![images](img/img_p385-5.png)\n\n你可以建议用户切换控制台的字符编码。在\
  \ Windows 中，这是通过 `chcp` 命令实现的。例如，\n\n![images](img/img_p385-6.png)\n\n将控制台更改为 `Windows-1252`\
  \ 代码页。\n\n理想情况下，你的用户应该将控制台切换到 `UTF-8`。在 Windows 中，命令是\n\n![images](img/img_p385-7.png)\n\
  \n遗憾的是，这不足以让 Java 在控制台中使用 `UTF-8`。还有必要使用非官方的 `file.encoding` 系统属性设置平台编码：\n\n![images](img/img_p385-8.png)\n\
  \n## 6.6.4 日志文件\n\n当来自 `java.util.logging` 库的日志消息发送到控制台时，它们以控制台编码写入。你在上一节中已经看到如何控制它。然而，文件中的日志消息使用\
  \ `FileHandler`，它默认情况下使用平台编码。\n\n要将编码更改为 `UTF-8`，你需要更改日志管理器的设置。在日志配置文件中，设置\n\n![images](img/img_p386.png)\n\
  \n## 6.6.5 UTF-8 字节序标记\n\n如前所述，在可能的情况下对文本文件使用 `UTF-8` 是好主意。然而，如果你的应用程序必须读取其他程序创建的\
  \ `UTF-8` 文本文件，就会遇到另一个潜在问题。在文件开头添加“字节序标记”字符 `U+FEFF` 是完全合法的。在 `UTF-16` 编码中（每个代码单元都是两个字节），字节序标记告诉读取者文件使用的是“大端序”还是“小端序”字节。`UTF-8`\
  \ 是单字节编码，因此不需要指定字节序。但如果文件以字节 `0xEF 0xBB 0xBF`（`U+FEFF` 的 `UTF-8` 编码）开头，这强烈表明它使用的是\
  \ `UTF-8`。由于这个原因，Unicode 标准鼓励这种做法。任何读取器应该忽略初始的字节序标记。\n\n只有一个瑕疵。Oracle Java 实现顽固地拒绝遵循\
  \ Unicode 标准，理由是潜在的兼容性问题。这意味着你，作为程序员，必须做平台不做的事。当你读取文本文件并在开头遇到 `U+FEFF` 时，请忽略它。\n\
  \n![images](img/caution.png) **注意**\n\n遗憾的是，JDK 的实现者们没有遵循这一建议。当你向 `javac` 编译器传递一个带有字节序标记的有效\
  \ `UTF-8` 源文件时，编译会报错：“illegal character: \\65279”。\n\n## 6.6.6 源文件的字符编码\n\n你，程序员，将需要与本地系统通信。例如，你可以使用记事本编写源代码。生成的源文件*不可移植*，因为它们使用本地编码。只有编译后的类文件是可移植的——它们使用修改\
  \ UTF-8。这意味着当程序编译和运行时涉及到三种编码：\n\n* 源文件：平台编码\n* 类文件：修改 UTF-8\n* 虚拟机：UTF-16\n\n（修改\
  \ UTF-8 和 UTF-16 的定义请参见第一章。）\n\n![images](img/tip.png) **提示**\n\n你可以通过 `-encoding`\
  \ 标记指定源文件的编码，例如：\n\n![images](img/img_p387.png)\n\n## 6.7 资源包\n\n在本地化应用程序时，你可能有大量的需要翻译。为了使这项任务可行，你会希望将消息字符串定义在外部位置，通常称为*资源*。翻译人员只需编辑资源文件，而无需接触源代码。\n\
  \n在 Java 中，可以使用属性文件指定字符串资源，并为其他类型的资源实现类。\n\n![images](img/note.png) **注意**\n\nJava\
  \ 技术资源与 Windows 或 Mac 的不同。Mac 或 Windows 可执行程序将菜单、对话框、图标和消息存储在与程序代码分离的部分。资源编辑器可以检查并更新这些资源，而不影响程序代码。\n\
  \n![images](img/note.png) **注意**\n\n第一卷第四章描述了 JAR 文件资源的概念，数据文件、声音和图像可以放置在 JAR 文件中。`Class`\
  \ 类的 `getResource` 方法可以找到文件、打开它并返回资源的 URL。通过将文件放入 JAR 文件，你将查找文件的工作交给了类加载器——它已经知道如何定位\
  \ JAR 文件中的项。\n\n### 6.7.1 查找资源包\n\n在本地化应用程序时，你产生一组*资源包*。每个包都是一个属性文件或类，描述了特定区域的项（如消息、标签等）。对于每个包，你必须为想要支持的所有区域提供版本。\n\
  \n\n\n\n你需要为这些资源包（bundles）使用特定的命名规范。例如，针对德国的特定资源放入文件 `baseName_de_DE`，而所有德语国家共享的资源放入\
  \ `baseName_de`。通常情况下，所有特定国家的资源使用\n\n![images](img/img_p388-1.png)\n\n所有特定语言的资源使用\n\
  \n![images](img/img_p388-2.png)\n\n最后，作为备用方案，你可以将默认值放在一个没有任何后缀的文件中。\n\n要加载资源包，请使用命令\n\
  \n![images](img/img_p388-3.png)\n\n`getBundle` 方法尝试加载与当前语言和国家语言环境（locale）匹配的资源包。如果加载失败，将依次忽略国家和语言部分。然后对默认语言环境应用相同的搜索，最后查找默认的资源包文件。即使该尝试也失败了，该方法也会抛出\
  \ `MissingResourceException`。\n\n也就是说，`getBundle` 方法尝试加载以下资源包：\n\n![images](img/img_p388-4.png)\n\
