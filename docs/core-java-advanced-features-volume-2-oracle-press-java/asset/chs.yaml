  \ 函数允许你构造 `jstring`。要读取现有 `jstring` 对象的内容，请使用 `GetStringUTFChars` 函数。该函数返回一个指向“修改后的\
  \ UTF-8”字符的 `const jbyte*` 指针。特定的虚拟机自由选择其内部字符串表示的字符编码，因此你可能会得到指向实际 Java 字符串的字符指针。由于\
  \ Java 字符串被认为是不可变的，*非常重要*的是要认真对待 `const`，不要尝试写入此字符数组。另一方面，如果虚拟机对内部字符串表示使用 UTF-16\
  \ 或 UTF-32 字符，则此函数调用将分配一个新的内存块，并填充“修改后的 UTF-8”等效字符。\n\n\n\n\n虚拟机必须知道你何时结束使用该字符串，以便它对其进行垃圾回收。（垃圾回收器运行在单独线程中，它可能会中断原生方法的执行。）因此，你必须调用\
  \ `ReleaseStringUTFChars` 函数。\n\n或者，你也可以通过调用 `GetStringRegion` 或 `GetStringUTFRegion`\
  \ 方法提供你自己的缓冲区来存放字符串字符。\n\n最后，`GetStringUTFLength` 函数返回字符串的“修改后的 UTF-8”编码所需的字符数。\n\
  \n#### ![images](img/note.png) **注意**\n\n你可以在 [`docs.oracle.com/javase/7/docs/technotes/guides/jni`](http://docs.oracle.com/javase/7/docs/technotes/guides/jni)\
  \ 找到 JNI API。\n\n#### 从 C 代码访问 Java 字符串\n\n* `jstring NewStringUTF(JNIEnv* env,\
  \ const char bytes[])`\n  从一个以零字节结尾的“修改后的 UTF-8”字节序列返回一个新的 Java 字符串对象，如果无法构造字符串，则返回\
  \ NULL。\n\n* `jsize GetStringUTFLength(JNIEnv* env, jstring string)`\n  返回“修改后的\
  \ UTF-8”编码所需的字节数（不包括零字节终止符）。\n\n* `const jbyte* GetStringUTFChars(JNIEnv* env, jstring\
  \ string, jboolean* isCopy)`\n  返回字符串的“修改后的 UTF-8”编码的指针，如果无法构造字符数组，则返回 NULL。该指针在调用\
  \ `ReleaseStringUTFChars` 之前有效。`isCopy` 指向一个 `jboolean`，如果创建了副本，则填充 `JNI_TRUE`，否则填充\
  \ `JNI_FALSE`。\n\n* `void ReleaseStringUTFChars(JNIEnv* env, jstring string, const\
  \ jbyte bytes[])`\n  通知原生代码不再需要通过 `bytes`（由 `GetStringUTFChars` 返回的指针）访问 Java 字符串。\n\
  \n* `void GetStringRegion(JNIEnv *env, jstring string, jsize start, jsize length,\
  \ jchar *buffer)`\n  将字符串中的一系列 UTF-16 双字节序列拷贝到用户提供的大小至少为 2 × length 的缓冲区中。\n\n*\
  \ `void GetStringUTFRegion(JNIEnv *env, jstring string, jsize start, jsize length,\
  \ jbyte *buffer)`\n  将字符串中的一系列“修改后的 UTF-8”字节拷贝到用户提供的缓冲区中。缓冲区必须足够大以容纳这些字节。在坏的情况下，会拷贝\
  \ 3 × length 个字节。\n\n* `jstring NewString(JNIEnv* env, const jchar chars[], jsize\
  \ length)`\n  从 Unicode 字符串返回一个新的 Java 字符串对象，如果无法构造字符串，则返回 NULL。\n\n* `jsize GetStringLength(JNIEnv*\
  \ env, jstring string)`\n  返回字符串中的字符数。\n\n* `const jchar* GetStringChars(JNIEnv*\
  \ env, jstring string, jboolean* isCopy)`\n  返回字符串的 Unicode 编码的指针，如果无法构造字符数组，则返回\
  \ NULL。该指针在调用 `ReleaseStringChars` 之前有效。`isCopy` 为 NULL 或指向一个 `jboolean`，如果创建了副本，则填充\
  \ `JNI_TRUE`，否则填充 `JNI_FALSE`。\n\n* `void ReleaseStringChars(JNIEnv* env, jstring\
  \ string, const jchar chars[])`\n  通知原生代码不再需要通过 `chars`（由 `GetStringChars` 返回的指针）访问\
  \ Java 字符串。\n\n让我们用用这些函数，编写一个调用 C 函数 `sprintf` 的类。我们希望像 列表 11.8 所示调用该函数。\n\n**列表\
