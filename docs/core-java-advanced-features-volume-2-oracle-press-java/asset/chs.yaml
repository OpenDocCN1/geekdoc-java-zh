  \ 6 章。\n\n现在假设我们想知道某个国家的所有语言。那么我们需要一个 `Map<String, Set<String>>`。例如，“Switzerland”的值是集合\
  \ `[French, German, Italian]`。起，我们为每种语言存储一个单例集合（singleton set）。每当为某个国家发现新语言时，我们就形成现有集合和新集合的并集。\n\
  \n![images](img/img_p54-1.png)\n\n你将在下一节看到获取此 map 的更简单的方法。\n\n如果你想要 `TreeMap`，请将构造函数作为第四参数提供。你必须提供一个合并函数。这里是该节开头示例之一，现在产生一个\
  \ `TreeMap`：\n\n![images](img/img_p54-2.png)\n\n#### **注意** ![images](img/note.png)\n\
