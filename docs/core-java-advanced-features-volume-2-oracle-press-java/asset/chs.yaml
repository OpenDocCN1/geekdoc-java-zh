- "# Core Java：高级特性，卷 2 (Oracle Press Java)\n\n\n\n![](img/cover.jpg)\n\n\n\n\n\n\n\
  \n## 前言\n\n### 致读者\n\n您手中的书是 `Core Java` 第十二版的第二卷，已针对 `Java 17` 完全更新。第一卷涵盖了语言的基本特性；本卷涉及程序员在专业软件开发中需要了解的高级主题。因此，与第一卷以及本书的之前的版本一样，我们的目标仍然是希望在实际项目中使用\
  \ `Java` 技术的程序员。\n\n正如任何书一样，错误和不准确之处是不可避免的。如果您在书中发现任何错误，我们非常希望听到它们。当然，我们更希望只听到一次。出于这个原因，我们在\
  \ [`horstmann.com/corejava`](http://horstmann.com/corejava) 建立了一个网站，包含常见问题解答（FAQ）、错误修复和解决方案。在错误报告网页的末尾（为了鼓励您阅读之前的报告）放置了一个表单，您可以使用它来报告错误或问题，并为未来的版本提供改进建议。\n\
  \n### 关于本书\n\n本书的章节在很大程度上是相互独立的。您应该能够深入研究您最感兴趣的话题，并按任何顺序阅读章节。\n\n在 `第 1 章` 中，您将学习所有的\
  \ `Java stream library`，它通过指定您想要的内容而不详细描述如何获取结果，为数据处理注入了现代气息。这使得流库能够专注于优的评估策略，这对于优化并发计算特别有利。\n\
  \n`第 2 章` 的主题是输入输出处理（I/O）。在 `Java` 中，所有的输入输出都通过输入/输出流处理。这些流（不要与 `第 1 章` 中的流混淆）让您以统一的方式处理各种数据源（如文件、网络连接或内存块）之间的通信。我们详细介绍了\
  \ `reader` 和 `writer` 类，它们处理 Unicode 变得简单。我们向您展示了当使用对象序列化机制时底层发生了什么，这使得保存和加载对象变得简单方便。然后我们转向正则表达式以及对文件和路径的操作。在整个章节中，您将发现最近\
  \ Java 版本中深受欢迎的增强。\n\n`第 3 章` 涵盖了数据库编程。重点是 `JDBC`，即 Java 数据库连接 API，允许 `Java` 程序连接到关系数据库。我们向您展示如何使用\
  \ `JDBC API` 的核心子集编写实用的程序来处理真实的数据库任务。（完整介绍 `JDBC API` 需要一本几乎和这本书一样的书。）\n\n`第 4 章`\
  \ 涵盖了 `XML`。我们向您展示如何解析 `XML` 文件、如何生成 `XML` 以及如何使用 `XSL 转换`。作为一个实用的例子，我们向您展示如何在 `XML`\
  \ 中指定 `Swing` 表单的布局。我们还讨论了 `XPath API`，它让在 XML 海堆中找针变得容易得多。\n\n`Java` 此之前两次尝试处理日期和时间的库。第三次在\
  \ `Java 8` 中取得了成功。在 `第 5 章` 中，您将学习如何使用新的日期和时间库来处理日历和时区的复杂性。\n\n`第 6 章` 讨论了一个我们认为只会变得越来越重要的特性：国际化。Java\
  \ 编程语言是少数从一开始就被设计处理 Unicode 的语言之一，但 Java 平台的国际化支持要远得多。因此，您可以对 Java 应用进行国际化，使其不仅跨平台，还跨国界。例如，我们向您展示如何编写一个可以使用英语、德语或中文的退休计算器。\n\
  \n`第 7 章` 讨论了三种处理代码的技术。`scripting` 和 compiler APIs` 允许您的程序调用 `JavaScript` 或 `Groovy`\
  \ 等脚本语言中的代码，并编译 `Java code`。`Annotations` 允许您向 Java 程序添加任意信息（有时称为元数据）。我们向您展示了 `annotation\
  \ processors` 如何在源代码或类文件级别获取这些注解，以及如何使用注解影响运行时类的行为。注解只有配合工具时才有用，我们希望我们的讨论能帮助您根据需求选择实用的注解处理工具。\n\
  \n\n\n\n\n第 8 章 涵盖了网络 API。Java 让进行复杂的网络编程变得异常简单。我们将向你展示如何与服务器建立网络连接、如何实现自己的服务器以及如何建立\
  \ HTTP 连接。本章包含了对新 HTTP 的介绍。它还涉及了 Java 安全模型、用户身份验证以及 Java 安全库中的加密函数。你将学习如消息和代码签名、授权与身份验证以及加密等重要特性。我们以使用\
  \ `AES` 和 `RSA` 加密算法的示例作为结束。\n\n第 9 章 包含了未收录在第一中的所有 Swing 内容，特别是重要但复杂的树形和表格组件。我们还涵盖了\
  \ Java `2D` API，你可以用它来创建真实的图形和特殊特效。当然，如今已经没有多少程序员需要编写 Swing 用户界面了，因此我们特别关注对在服务器上生成的图像有用的特性。\n\
  \n在第 10 章 中，你将学习 Java 9 引入的 Java 平台模块系统，该系统旨在促进 Java 平台和核心库的有序演进。该模块系统为包提供了封装，并提供了一种描述模块需求的机制。你将学习模块的属性，以便决定是否在自己的应用程序中使用它们。即使你决定不使用，也需要了解新规则，以便与\
  \ Java 平台和其他模块化库进行交互。\n\n第 11 章 涉及了原生方法，这些方法允许你调用为特定机器（如 Microsoft Windows API）编写的方法。显然，这一特性是有争议的：使用原生方法，Java\
  \ 的跨平台特性就会消失。尽管如此，每个为特定平台编写 Java 程序的严肃程序员都需要了解这些技术。有时，当你与 Java 不支持的设备或服务交互时，你需要转向目标平台的操作系统的\
  \ API。我们通过展示如何从 Java 程序访问 Windows 注册表 API 来说明这一点。\n\n一如既往，所有章节都已针对最新的 Java 版本进行了全面修订。删除了过时的内容，并详细涵盖了直到\
  \ Java 17 的新 API。\n\n### 惯例\n\n与许多计算机书籍一样，我们使用等宽字体来表示计算机代码。\n\n![images](img/note.png)\
