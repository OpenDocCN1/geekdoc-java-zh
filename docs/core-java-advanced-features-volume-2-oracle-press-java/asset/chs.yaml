  \n访问静态字段与访问非静态字段类似。使用 `GetStaticFieldID` 以及 `GetStatic*Xxx*Field`/`SetStatic*Xxx*Field`\
  \ 函数，这些函数的作用与非静态对应的几乎完全相同，但有两个区别：\n\n*   由于你没有对象，必须使用 `FindClass` 而不是 `GetObjectClass`\
  \ 来获取类引用。\n*   在访问字段时，你提供的是类而不是实例对象。\n\n例如，这里是获取获取 `System.out` 引用的：\n\n![images](img/img_po22.png)\n\
  \n### 访问字段\n\n*   `jfieldID GetFieldID(JNIEnv *env, jclass cl, const char name[],\
  \ const char fieldSignature[])`\n    返回类中字段的标识符。\n*   `Xxx Get*Xxx*Field(JNIEnv\
  \ *env, jobject obj, jfieldID id)`\n    返回字段的值。字段类型 `Xxx` 是 Object, Boolean, Byte,\
  \ Char, Short, Int, Long, Float 或 Double 之一。\n*   `void Set*Xxx*Field(JNIEnv *env,\
  \ jobject obj, jfieldID id, Xxx value)`\n    将字段设置为新值。字段类型 `Xxx` 是 Object, Boolean,\
  \ Byte, Char, Short, Int, Long, Float 或 Double 之一。\n*   `jfieldID GetStaticFieldID(JNIEnv\
  \ *env, jclass cl, const char name[], const char fieldSignature[])`\n    返回类中静态字段的标识符。\n\
  *   `Xxx GetStatic*Xxx*Field(JNIEnv *env, jclass cl, jfieldID id)`\n    返回静态字段的值。字段类型\
  \ `Xxx` 是 Object, Boolean, Byte, Char, Short, Int, Long, Float 或 Double 之一。\n* \
  \  `void SetStatic*Xxx*Field(JNIEnv *env, jclass cl, jfieldID id, Xxx value)`\n\
  \    将静态字段设置为新值。字段类型 `Xxx` 是 Object, Boolean, Byte, Char, Short, Int, Long, Float\
