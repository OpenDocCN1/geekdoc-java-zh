  \n*   `String getColumnName(int column)`\n\n    返回与指定的列索引关联的列名。\n\n## 3.9 事务\n\n\
  你可以将一组语句组合成一个 `transaction`（事务）。当一切顺利时，事务可以被 `committed`（提交）——或者，如果其中一个发生错误，它可以被\
  \ `rolled back`（回滚），就像没有执行这些语句一样。\n\n将语句分组为事务的主要原因是 `database integrity`（数据库完整性）。例如，假设我们要从一个银行账户转资金到另一个。同时减少一个账户并增加另一个账户是非常重要的。如果系统在扣除第一个账户之后增加另一个账户之前失败，则需要撤销扣款。\n\
  \n如果你将更新语句分组为一个事务，事务要么完全成功并可以 `commit`，要么在中间某个失败。在这种情况下，你可以执行 `rollback`，数据库会自动撤销自上次提交以来的所有更新影响。\n\
  \n#### 3.9.1 使用 JDBC 编程事务\n\n默认情况下，数据库连接处于 `autocommit mode`（自动提交模式），每个 SQL 语句在执行后立即提交到数据库。一旦语句提交，你就无法将其回滚。关闭此默认设置以便使用事务：\n\
  \n![images](img/img_p244-1.png)\n\n以普通方式创建语句对象：\n\n![images](img/img_p244-2.png)\n\
  \n调用任意次数的 `executeUpdate`：\n\n![images](img/img_p244-3.png)\n\n如果所有语句都已无无执行，调用 `commit`\
  \ 方法：\n\n![images](img/img_p244-4.png)\n\n然而，如果发生错误，调用\n\n![images](img/img_p244-5.png)\n\
  \n然后，自上次提交以来的所有语句都会自动反转。当你的事务被 `SQLException` 中断时，通常会发出 `rollback`。\n\n#### 3.9.2\
  \ 保存点\n\n对于某些数据库和驱动程序，你可以通过 `save points`（保存点）对回滚过程进行更细粒度的控制。创建保存点标记了一个位置，你以后可以返回那里而无需放弃整个事务。例如，\n\
  \n![images](img/img_p244-6.png)\n\n当你不再需要保存点时，应该释放它：\n\n![images](img/img_p244-7.png)\n\
  \n#### 3.9.3 批量更新\n\n假设程序需要执行许多 `INSERT` 语句来填充数据库表。你可以通过使用 `batch update`（批量更新）提高程序的性能。在批量更新中，一组语句序列被收集并作为一个批提交。\n\
  \n\n\n\n\n#### ![images](img/note.png) **注意**\n\n使用 `DatabaseMetaData` 接口的 `supportsBatchUpdates`\
  \ 方法可以确定您的数据库是否支持此功能。\n\n批中的语句可以是 `INSERT`、`UPDATE` 或 `DELETE` 等操作，也可以是 `CREATE\
  \ TABLE` 或 `DROP TABLE` 等数据定义语句。如果在批处理中添加 `SELECT` 语句，将抛出异常。（从概念上讲，`SELECT` 语句在批处理中没有意义，因为它返回的是结果集而不更新数据库。）\n\
  \n要执行批处理，首先按照通常方式创建一个 `Statement` 对象：\n\n![images](img/img_p245-1.png)\n\n现在，不要调用\
  \ `executeUpdate`，而是调用 `addBatch` 方法：\n\n![images](img/img_p245-2.png)\n\n最后，提交整个批处理：\n\
  \n![images](img/img_p245-3.png)\n\n调用 `executeBatch` 返回一个所有提交语句的行数数组。\n\n为了在批模式下进行适当错误处理，请将批执行视为单个事务。如果批处理在执行途中失败，您希望回滚到批开始之前的状态。\n\
  \n首先，关闭自动提交模式，然后收集批处理、执行它、提交它，最后恢复原始自动提交模式：\n\n![images](img/img_p245-4.png)\n\n\
  ### java.sql.Connection 1.1\n\n*   `boolean getAutoCommit()`\n*   `void setAutoCommit(boolean\
  \ b)`\n    获取或设置此连接的自动提交模式为 `b`。如果 `autocommit` 为真，则所有语句在执行完成后立即提交。\n*   `void commit()`\n\
  \    提交自上次提交以来发布的所有语句。\n*   `void rollback()`\n    撤销自上次提交以来颁发的所有语句的影响。\n*   `Savepoint\
  \ setSavepoint()` **1.4**\n*   `Savepoint setSavepoint(String name)` **1.4**\n \
  \   设置一个未命名或命名的保存点。\n*   `void rollback(Savepoint svpt)` **1.4**\n    回滚到给定的保存点。\n\
  *   `void releaseSavepoint(Savepoint svpt)` **1.4**\n    释放给定的保存点。\n\n### java.sql.Savepoint\
  \ 1.4\n\n*   `int getSavepointId()`\n    获取此未命名保存点的 ID，如果是命名的保存点则抛出 `SQLException`。\n\
  *   `String getSavepointName()`\n    获取此保存点的名称，如果是未命名的保存点则抛出 `SQLException`。\n\n\
  ### java.sql.Statement 1.1\n\n*   `void addBatch(String command)` **1.2**\n    将\
  \ `command` 添加到此语句的当前命令批中。\n*   `int[] executeBatch()` **1.2**\n*   `long[] executeLargeBatch()`\
  \ **8**\n    执行当前批中的所有命令。返回数组中的每个值对应于批语句中的一个。如果是非负数，则它是行数。如果值为 `SUCCESS_NO_INFO`，则语句执行成功但无可用行数。如果是\
  \ `EXECUTE_FAILED`，则语句执行失败。\n\n### java.sql.DatabaseMetaData 1.1\n\n*   `boolean\
  \ supportsBatchUpdates()` **1.2**\n    如果驱动程序支持批更新，则返回 true。\n\n#### 3.9.4 高级 SQL\
  \ 类型\n\n表 3.8 列出了 JDBC 支持的 SQL 数据类型及其在 Java 编程语言中的对应。\n\n**表 3.8** SQL 数据类型及其对应的\
  \ Java 类型\n\n![images](img/img_p246.png)\n\nSQL `ARRAY` 是值的序列。例如，在 `Student` 表中，你可以有一个\
  \ `Scores` 列，其类型是 `ARRAY OF INTEGER`。`getArray` 方法返回一个类型为 `java.sql.Array` 接口的对象。该接口拥有获取数组值的方法。\n\
  \n当您从数据库获取 `LOB` 或数组时，只有在您请求单个值时，才会从数据库获取实际内容。这是一个实用的性能增强，因为数据可能非常巨大。\n\n某些数据库支持\
  \ `ROWID` 值，它描述行的位置，以便非常快速地检索。JDBC 4 引入了 `java.sql.RowId` 接口以及在查询中提供行 ID 并从结果中检索它的方法。\n\
  \n`国家字符字符串`（`NCHAR` 及其变体）在本地编码中存储字符串。JDBC 3 提供了将 SQL 类型映射到 Java 对象的机制。某些数据库可以存储用户定义类型。JDBC\
  \ 4 引入了 `SQLXML`，可以在 XML 数据和二进制流之间进行调解。我们不再进一步讨论这些主题。详情请参阅 `JDBC API`。注意 `DriverManager`\
  \ 不再参与。相反，JNDI 服务负责定位 `data source`。`DataSource` 接口定义在 `javax.sql` 标准包中。\n\n###\
  \ 3.10 Web 和企业级应用中的连接管理\n\n用户名和登录管理只是需要特别关注的问题之一。另一个问题涉及建立数据库连接的成本。前几节描述的带有 `database.properties`\
  \ 文件的简单数据库连接设置适用于测试程序，但对于较大的应用程序将无法扩展。\n\n当 JDBC 应用部署在企业环境中时，数据库连接的管理与 `JNDI` 集成。跨企业的数据源属性可以存储在目录中。使用目录允许对用户名、密码、数据库名称和\
  \ JDBC URL 进行集中管理。\n\n如果您编写在 Tomcat 等 Servlet 容器或在 GlassFish 等应用程序服务器中运行的数据库程序，请将数据库配置（包括\
  \ JNDI 名称、JDBC URL、用户名和密码）放在配置文件中，或在管理 GUI 中设置。\n\n在这样的环境中，您可以使用以下代码建立数据库连接：\n\n\
  ![images](img/img_p249-1.png)\n\n#### ![images](img/note.png) **注意**\n\n在 Java EE\
  \ 容器中，您不需要编写 JNDI 查找。只需在 `DataSource` 字段上使用 `@Resource` 注解，数据源引用在您的应用程序加载时就会被设置：\n\
  \n![images](img/img_p249-2.png)\n\n当然，数据源需要在某处配置。`DataSource` 接口允许简单的 JDBC 连接，以及更高级的服务，例如执行涉及多个数据库的分布式事务。我们的示例数据库程序使用了两种策略来获取数据库连接。列表\
  \ 3.3 中的 `QueryDB` 程序在程序开始时建立单个数据库连接，并在程序结束时关闭它。列表 3.4 中的 `ViewDB` 程序在每次需要时打开新连接。\n\
  \n然而，这两种方法都不令人满意。数据库连接是有限的资源。如果用户离开应用程序一段时间，则不应保持连接开启。相反，为每个查询获取连接并在之后关闭它的成本是非常高的。\n\
  \n解决方案是连接池。这意味着数据库连接不会被物理关闭，而是保留在队列中并重用。连接池是一项重要的服务，JDBC 规范为实现者提供了钩子。然而，JDK 本身没有提供任何实现，数据库供应商通常也不会在其\
  \ JDBC 驱动程序中包含它。相反，Web 容器和应用程序服务器的供应商提供连接池实现。\n\n\n\n\n使用连接池对程序员来说是完全透明的。通过获取数据源并调用\
  \ `getConnection` 从池化连接源中获取连接。当你完成连接的使用后，调用 `close()`。这不会关闭物理连接，而是告诉连接池你已完成对其的使用。连接池通常还会尝试对预编译语句（prepared\
  \ statements）进行池化。\n\n你现在已经学习了 JDBC 的基础，并掌握了实现简单数据库应用程序的知识。然而，正如我们在本章开头提到的，数据库是复杂的，相当多的高级主题都超出了本入门章节的范围。关于高级\
  \ JDBC 能力的概述，请参阅 *JDBC API 教程与参考* 或 JDBC 规范。\n\n在本章中，你学习了如何在 Java 中操作关系型数据库。下一章将介绍\
  \ Java 8 日期和时间库。\n\n# 第 4 章\n\n# XML\n\n## 本章内容\n\n* 4.1 XML 简介，第 230 页\n* 4.2 XML\
  \ 文档的结构，第 232 页\n* 4.3 解析 XML 文档，第 235 页\n* 4.4 验证 XML 文档，第 245 页\n* 4.5 使用 XPath\
  \ 定位信息，第 264 页\n* 4.6 使用命名空间，第 269 页\n* 4.7 流式解析器，第 273 页\n* 4.8 生成 XML 文档，第 282\
  \ 页\n* 4.9 XSL 转换，第 293 页\n\nDon Box 等人编写的书籍 *Essential XML*（Addison-Wesley, 2000）序言中有一句半是开玩笑的话说：“可扩展标记语言（XML）已经取代了\
  \ Java、设计模式和对象技术，成为软件行业解决全球饥饿的解决方案。”这种炒作早已过去了，但正如你在本章中看到的，XML 仍然是一种描述结构化信息的非常有用的技术。XML\
  \ 工具可以轻松地处理和转换这些信息。然而，XML 并不是万灵药。你需要特定领域的标准和代码库才能有效地使用它。此外，XML 远没有让 Java 过时，它与 Java\
  \ 配合得非常好。自 20 世纪 90 年代末以来，IBM、Apache 等在产生高质量的 XML 处理 Java 库方面发挥了作用。许多库现在已集成到 Java\
  \ 平台。\n\n本章介绍了 XML 并涵盖了 Java 库中的 XML 特性。与既往一样，我们在过程中指出何时使用 XML 是合理的——以及何时你必须持保留态度，并尝试用老办法解决问题：即通过良好的设计和代码。\n\
  \n## 4.1 XML 简介\n\n在第一卷的第 11 章中，你已经见过使用*属性文件*（property files）来描述程序的配置。属性文件包含一组键/值对，例如：\n\
  \n![images](img/img_p252-1.png)\n\n你可以使用 `Properties` 类通过单个方法调用来读取此类文件。这是一个很好的功能，但它并不仅仅如此。在许多情况下，你想要描述的信息比属性文件格式能够舒适处理的具有更多结构。考虑示例中的\
  \ `fontname`/`fontsize` 条目。拥有单个条目会更符合面向对象：\n\n![images](img/img_p252-2.png)\n\n\
  但这样，解析字体描述就会变得糟糕，因为你必须弄清楚字体名称何时结束、字体大小何时开始。\n\n属性文件具有单一的扁平层次结构。你经常可以看到程序员通过类似键名来规避这一局限性：\n\
  \n![images](img/img_p252-3.png)\n\n属性文件格式的另一个缺点是要求键必须是唯一的。为了存储值序列，你需要另一个通通方法，例如：\n\
  \n![images](img/img_p252-4.png)\n\nXML 格式解决了这些问题。它可以表示层级结构，因此比属性文件的扁平表结构更具活性。\n\n\
  一个描述程序配置的 XML 文件可能像这样：\n\n![images](img/img_p253.png)\n\nXML 格式允许你通过扭曲的方式表示层级结构并记录重复元素。\n\
  \nXML 文件的格式非常直观。它看起来类似于 HTML 文件。这有充分的理由——XML 和 HTML 都是古老的标准通用标记语言（SGML）的后代。\n\n\
  SGML 自 20 世纪 70 年代以来一直用于描述复杂文档的结构。它在某些需要持续维护海量文档的行业中取得了成功——特别是航空工业。然而，SGML 非常复杂，因此它从未大范围普及。这种复杂性很大源于\
  \ SGML 有两个冲突的目标：SGML 想要确保文档根据其文档类型规则形成，但它也想通过允许减少字数的快捷方式使数据输入变得简单。XML 被设计为 SGML\
  \ 的简化版本，用于互联网。正如常说的，越简单越好，XML 赢得了立即且热烈的反响，这种反响\n\n![images](img/note.png) **注意**\n\
  \n由于 SGML 是为了描述真实文档而创建的，XML 文件被称为*文档*，尽管许多描述的是人们不会认为是文档的数据。\n\n尽管 XML 和 HTML 有共同的根，但它们之间存在重要的差异：\n\
  \n* 与 HTML 不同，XML 是区分大小写的。例如，`<H1>` 和 `<h1>` 是不同的 XML 标签。\n* 在 HTML 中，你可以省略结束标签，例如\
  \ `<p>` 或 `<li>`，如果从上下文清楚段落或列表何时结束。在 XML 中，你不能省略结束标签。\n* 在 XML 中，属性值必须包含在引号内。在 HTML\
  \ 中，引号是可选的。例如，`<img src=\"my hamster.png\" width=300 height=300>` 是合法的 HTML 但不是合法的\
  \ XML。在 XML 中必须使用 `\"300\"`。\n* 在 HTML 中，你可以拥有没有值的属性，例如 `checked`。在 XML 中，所有属性必须有值，例如\
  \ `checked=\"true\"`。\n* 有针对 HTML 版本 4 和 5 的 XML 公式，被称为 XHTML。\n\n## 4.2 XML 文档的结构\n\
  \nXML 文档应该以如下头部开始：\n\n![images](img/img_p254-1.png)\n\n或\n\n![images](img/img_p254-2.png)\n\
  \n严格来说，头部是可选的，但强烈建议使用。\n\n![images](img/note.png) **注意**\n\n由于 SGML 是为了描述真实文档而创建的，XML\
  \ 文件被称为*文档*，尽管许多描述的是人们不会认为是文档的数据。\n\n头部可以跟一个*文档类型定义*（DTD），例如：\n\n![images](img/img_p254-3.png)\n\
  \nDTD 是确保文档正确性的重要机制，但不是必须的。我们将在本章稍后讨论它们。\n\n最后，XML 文档的主体包含*根元素*，它可以包含其他元素。例如：\n\n\
  ![images](img/img_p255-1.png)\n\n元素可以包含*子元素*、文本或两者。在前面的示例中，`font` 元素有两个子元素：`name`\
  \ 和 `size`。`name` 元素包含文本 \"Helvetica\"。\n\n![images](img/tip.png) **提示**\n\n组织你的\
  \ XML 文档，使得元素*要么*包含子元素*要么*包含文本。这里有一个你应该避免的示例：\n\n![images](img/img_p255-2.png)\n\
  \n这在 XML 规范中被称为*混合内容*。正如你在本章晚些部分看到的，如果避免混合内容，你可以简化解析过程。\n\nXML 元素可以包含属性，例如：\n\n\n\
  \n![images](img/img_p255-3.png)\n\nXML 设计者之间对于何时使用元素以及何时使用属性存在分歧。例如，将字体描述为以下形式似乎更简单：\n\
  \n![images](img/img_p255-4.png)\n\n相比于\n\n![images](img/img_p255-5.png)\n\n然而，属性的灵活性要差得多。假设你想为大小值添加单位。如果你使用属性，就必须将单位添加到属性值中：\n\
  \n![images](img/img_p256-1.png)\n\n哎！现在你必须解析字符串 \"36 pt\"，这正是 XML 设计之初想要避免的麻烦。在\
  \ size 元素上添加属性要明洁得多：\n\n![images](img/img_p256-2.png)\n\n一个常用的经验法是：属性应该只用于修改对某个值的解释，而不是用于指定值。如果你发现自己陷入了关于“某个特定设置是否为对值解释的修改”的形而上学讨论中，直接对属性说“不”，并在全程使用元素即可。许多实用的\
  \ XML 文档根本不使用属性。\n\n### 注意 ![images](img/note.png)\n\n在 HTML 中，属性的使用规则非常简单：如果它没有显示在网页上，它就是属性。例如，考虑这个超链接\n\
  \n![images](img/img_p256-3.png)\n\n字符串 \"Java Technology\" 显示在网页上，但链接的 URL 并不是显示页面的一部分。然而，这个规则对于大多数\
  \ XML 文件来说并不大有用，因为 XML 文件中的数据通常不是为了让人类查看。\n\n元素和文本是 XML 文档的“核心内容”。以下是你可能会遇到的其他几类标记指令：\n\
  \n*   *字符引用*（Character references）的格式为 `&#*decimalValue;` 或 `&#x*hexValue*;`。例如，字符\
  \ é 可以用以下任一形式表示：![![images](img/img_p256-4.png)\n\n*   *实体引用*（Entity references）的格式为\
  \ `&*name*;`。这些实体引用\n\n    ![images](img/img_p256-5.png)\n\n    具有预定义的含义：小于号、大于号、和符号、双引号和单引号。你可以在\
  \ DTD 中定义其他实体引用。\n\n*   *CDATA 节*（CDATA sections）由 `<!CDATA[` 和 `]]>` 界定。它们是一种特殊的字符数据形式。你可以使用它们来包含包含\
  \ `< > &;` 等字符的字符串，而不会它们被解释为标记，例如：\n\n    ![images](img/img_p257-1.png)\n\n    CDATA\
  \ 段不能包含字符串 `]]>`。使用此功能时要谨慎！它经常被用作将遗留数据渗透到 XML 文档中的后门。\n\n*   *处理指令*（Processing instructions）是用于处理\
  \ XML 文档的应用程序的指令。它们由 `<?` 和 `?>` 界定，例如\n\n    ![images](img/img_p257-2.png)\n\n\
  \    每个 XML 文档都以处理指令开始\n\n    ![images](img/img_p257-3.png)\n\n*   *注释*（Comments）由\
  \ `<!--` 和 `-->` 界定，例如\n\n    ![images](img/img_p257-4.png)\n\n    注释不应包含字符串 `--`。注释应该只作为人类读者的信息。它们永远不应包含隐藏命令；请使用处理指令来实现。\n\
  \n## 4.3 解析 XML 文档\n\n要处理 XML 文档，你需要对其进行*解析*（parse）。解析器是一个读取文件、确认文件格式正确、将其拆分为组成元素、并允许程序员访问这些元素的程序。Java\
  \ 库提供了两种类型的 XML 解析器：\n\n*   树形解析器（Tree parsers），例如文档对象模型（DOM）解析器，它们将 XML 文档读取为树形结构。\n\
  \n*   流式解析器（Streaming parsers），例如 XML Simple API（SAX）解析器，它们在读取 XML 文档时生成事件。\n\n\
  对于大多数用途来说，DOM 解析器更容易使用，因此我们首先介绍它们。如果你处理的是树结构会消耗大量内存的极大文档，或者你只对少数元素感兴趣而不关心它们的上下文，可以考虑使用流式解析器。更多信息，请参见第\
  \ 273 页的第 4.7 节](#chapter004.xhtml_sec4-7)“流式解析器”。\n\nDOM 解析器接口由万维网联盟（W3C）标准化。`org.w3c.dom`\
  \ 包包含了如 `Document` 和 `Element` 等接口类型的定义。不同的供应商（如 Apache 组织和 IBM）编写了实现这些接口的类的 DOM\
  \ 解析器。Java XML  API (JAXP) 库实际上让插件这些解析器中的任何一个成为可能。但 JDK 也也带了一个源自 Apache 解析器的 DOM\
  \ 解析器。\n\n要读取 XML 文档，你需要一个 `DocumentBuilder` 对象，你可以像这样从 `DocumentBuilderFactory`\
  \ 中获取它：\n\n![images](img/img_p258-1.png)\n\n你现在可以从文件读取文档：\n\n![images](img/img_p258-2.png)\n\
  \n或者，你可以使用 `URL`：\n\n![images](img/img_p258-3.png)\n\n你甚至可以指定任意的输入流：\n\n![images](img/img_p258-4.png)\n\
  \n### 注意 ![images](img/note.png)\n\n如果你使用输入流作为输入，解析器将无法定位如 DTD 等文件。更多信息请参阅 [xml.com/a/2004/03/catalogs.html](http://www.xml.com/a/2004/03/catalogs.html)。\n\
  \n`Document` 对象是 XML 文档树在内存中的表示。它由实现 `Node` 接口的类组成。图 4.1](#chapter004.xhtml_fig4-1)\
  \ 显示了子接口的继承关系。\n\n通过调用 `getDocumentElement` 方法开始文档的内容。它返回根元素。\n\n![images](img/img_p258-1.png)\n\
  \n例如，如果你正在处理文档\n\n![images](img/img_p259-2.png)\n\n调用 `getDocumentElement()` 返回\
  \ font 元素。\n\n![images](img/img_p259-1.png)\n\n**图 4.1 Node 接口及其子接口**\n\n`getTagName`\
  \ 方法返回元素的标签。在前面的示例中，`root.getTagName()` 返回 \"font\"。\n\n获取元素的节点（可能是子元素、文本、注释或其他节点），使用\
  \ `getChildNodes` 方法。该方法返回一个 `NodeList` 类型的集合。该类型在标准集合之前就被标准化了，因此具有不同的访问协议。`item`\
  \ 方法获取给定索引的项，`getLength` 方法给出项的总数。你可以这样遍历所有子节点：\n\n![images](img/img_p259-3.png)\n\
  \n分析子节点时要小心。例如，假设正在处理文档\n\n![images](img/img_p260-1.png)\n\n你会认为 font 元素有两个子节点，但解析器报告五个：\n\
  \n*   `<font>` 和 `<name>` 之间的空白\n*   name 元素\n*   `</name>` 和 `<size>` 之间的空白\n*\
  \   size 元素\n*   `</size>` 和 `</font>` 之间的空白\n\n图 4.2](#chapter004.xhtml_fig4-2)\
  \ 显示了 DOM 树。\n\n![images](img/img_p260-2.png)\n\n**图 4.2 一个简单的 DOM 树**\n\n如果你只期待子元素，可以忽略空白：\n\
  \n![images](img/img_p260-3.png)\n\n现在你只看标签名为 name 和 size 的两个元素。\n\n正如我们在下一节中将看到的，如果你的文档有\
  \ DTD，你可以做得更好。这样解析器就知道了哪些元素没有文本节点作为子节点，它就可以为你过滤空白。\n\n\n\n\n当分析 `name` 和 `size`\
  \ 元素时，你需要获取它们包含的文本字符串。这些文本字符串本身包含在类型为 `Text` 的子节点中。你知道这些 `Text` 节点是唯一的子节点，因此你可以使用\
  \ `getFirstChild` 方法而无需遍历另一个 `NodeList`。然后，使用 `getData` 方法获取存储在 `Text` 节点中的字符串：\n\
  \n![images](img/img_p261-1.png)\n\n#### ![images](img/tip.png) **提示**\n\n在 `getData`\
  \ 方法的返回值上调用 `trim` 是一个好习惯。如果 XML 文件的作者将起始标签和结束标签放在不同的行上，例如\n\n![images](img/img_p261-2.png)\n\
  \n那么解析器会将所有的换行符和空格都包含在文本节点数据中。调用 `trim` 方法可以移除实际数据周围的空白。\n\n你也可以使用 `getLastChild`\
  \ 方法获取最后一个子节点，使用 `getNextSibling` 获取节点的下一个兄弟节点。因此，遍历节点子节点的另一种方法是：\n\n![images](img/img_p262-1.png)\n\
  \n要枚举节点的属性，请调用 `getAttributes` 方法。它返回一个 `NamedNodeMap` 对象，其中包含描述属性的 `Node` 对象。你可以像遍历\
  \ `NodeList` 一样遍历 `NamedNodeMap` 中的节点。然后，调用 `getNodeName` 和 `getNodeValue` 方法来获取属性名和属性值。\n\
  \n![images](img/img_p262-2.png)\n\n或者，如果你知道属性名，可以直接获取对应的值：\n\n![images](img/img_p262-3.png)\n\
  \n你现在已经看到了如何分析 DOM 树。代码列表 4.1 中的程序通过将 XML 文档转换为 JSON 格式应用了这些技术。树形显示清晰展示了子元素是如何被包含空白和注释的文本包围的。你可以清楚地看到换行和返回字符显示为\
  \ `\\n`。\n\n你不需要熟悉 JSON 就能理解程序是如何操作 DOM 树的。只需观察以下：\n\n* 我们使用 `DocumentBuilder` 从文件中读取\
  \ `Document`。\n* 对于每个元素，我们打印标签名、属性和元素。\n* 对于字符数据，我们生成一个包含数据的字符串。如果数据来自注释，我们添加 `\"\
  Comment: \"` 前缀。\n\n**代码列表 4.1** `dom/JSONConverter.java`\n\n![images](img/img_p263.png)![images](img/img_p264.png)![images](img/img_p265.png)\n\
  \n#### **javax.xml.parsers.DocumentBuilderFactory** **1.4**\n\n* `static DocumentBuilderFactory\
  \ newInstance()`\n  返回 `DocumentBuilderFactory` 类的实例。\n* `DocumentBuilder newDocumentBuilder()`\n\
  \  返回 `DocumentBuilder` 类的实例。\n\n#### **javax.xml.parsers.DocumentBuilder** **1.4**\n\
  \n* `Document parse(File f)`\n* `Document parse(String url)`\n* `Document parse(InputStream\
  \ in)`\n  从给定的文件、URL 或输入流解析 XML 文档并返回解析后的文档。\n\n#### ***org.w3c.dom.Document***\
  \ **1.4**\n\n* `Element getDocumentElement()`\n  返回文档的根元素。\n\n#### ***org.w3c.dom.Element***\
  \ **1.4**\n\n* `String getTagName()`\n  返回元素的名字。\n* `String getAttribute(String\
  \ name)`\n  返回给定名称属性的值，如果没有该属性，则返回空字符串。\n\n#### ***org.w3c.dom.Node*** **1.4**\n\
  \n* `NodeList getChildNodes()`\n  返回包含此节点所有子节点的节点列表。\n* `Node getFirstChild()`\n\
  * `Node getLastChild()`\n  获取此节点的第一个或最后一个子节点，如果该节点没有子节点则返回 null。\n* `Node getNextSibling()`\n\
  * `Node getPreviousSibling()`\n  获取此节点的下一个或上一个兄弟节点，如果该节点没有兄弟节点则返回 null。\n* `Node\
  \ getParentNode()`\n  获取此节点的父节点，如果该节点是文档节点则返回 null。\n* `NamedNodeMap getAttributes()`\n\
  \  返回一个包含 `Attr` 节点的节点映射，描述此节点的所有属性。\n* `String getNodeName()`\n  返回节点名称。如果节点是 `Attr`\
  \ 节点，则名称为属性名。\n* `String getNodeValue()`\n  返回该节点的值。如果节点是 `Attr` 节点，则值为该属性值。\n\n\
  #### ***org.w3c.dom.CharacterData*** **1.4**\n\n* `String getData()`\n  返回存储在节点中的文本。\n\
  \n#### ***org.w3c.dom.NodeList*** **1.4**\n\n* `int getLength()`\n  返回此列表中的节点数量。\n\
  * `Node item(int index)`\n  返回给定索引的节点。索引在 0 到 `getLength()` - 1 之间。\n\n#### ***org.w3c.dom.NamedNodeMap***\
  \ **1.4**\n\n* `int getLength()`\n  返回映射中的节点数量。\n* `Node item(int index)`\n  返回给定索引的节点。索引在\
  \ 0 到 `getLength()` - 1 之间。\n\n## 4.4 验证 XML 文档\n\n在上一节中，我们看到了如何操作 DOM 树结构。然而，XML\
  \ 解析器的一个主要优势是它可以自动验证文档是否正确。这使得解析变得简单得多。例如，你可以提供 DTD 或 XML Schema 定义来指定文档的形成方式，通过指定每个元素的子元素和属性。一个\
  \ DTD 可能会包含：\n\n![images](img/img_p267.png)\n\n该规则表示 `font` 元素始终有两个子节点，即 `name`\
  \ 和 `size`。XML Schema 语言以相同的方式表示\n\n![images](img/img_p268.png)\n\nXML Schema 可以比\
  \ DTD 表示更复杂的验证条件（例如 `size` 元素必须包含一个整数）。与 DTD 语法不同，XML Schema 语法本身使用 XML，如果你需要处理架构文件，这是一个优势。\n\
  \n在下一节中，我们将详细讨论 DTD，然后简要介绍 XML Schema 的支持。最后，我们将展示一个演示验证如何简化程序的应用程序。\n\n#### 4.4.1\
  \ 文档类型定义\n\n提供 DTD 有多种方法。你可以这样在 XML 文档包含 DTD：\n\n![images](img/img_p268.png)\n\n\
  如你所示，规则包含在 `DOCTYPE` 声明内部，位于 `[]` 之间。文档类型必须与根元素匹配，例如我们示例中的 `config`。\n\n在 XML 文档内部提供\
  \ DTD 并不常见，因为 DTD 可能会很长。将其存储在外部更为合理。可以使用 `SYSTEM` 声明来实现此目的。指定一个包含 DTD 的 URL，例如：\n\
  \n![images](img/img_p269-1.png)\n\n或者\n\n![images](img/img_p269-2.png)\n\n如果你对 DTD\
  \ 使用相对 URL（例如 `\"config.dtd\"`），给解析一个 `File` 或 `URL` 对象，而不是 `InputStream`。如果你必须从输入流解析，请提供一个实体解析器（见下文注释）。\n\
  \n\n\n识别常用 DTD 的机制源于 SGML。这里有一个示例：\n\n![images](img/img_p269-3.png)\n\n如果 XML 处理器知道如何通过公共标识符定位\
  \ DTD，它就不需要访问 URL。\n\n### 注意\n\nDTD 的系统标识符 URL 可能实际上无法正常工作，或者被刻意减慢了。后者的例子是 XHTML\
  \ 1.0 Strict DTD 的系统标识符，[`www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd`](http://www.w3.org/TR/xhtml1/DTD/xhtml1-strict.dtd)。如果你解析一个\
  \ XHTML 文件，DTD 可能需要一分钟或两分钟才能提供。\n\n解决办法是使用 `entity resolver`（实体解析器），它将公共标识符映射到本地文件。在\
  \ Java 9 之前，你必须提供一个实现了 `EntityResolver` 接口并提供了 `resolveEntity`方法的类对象。\n\n现在，你可以使用\
  \ `XML catalogs`（XML 目录）来管理映射。提供一个或多个格式如下的 `catalog files`（目录文件）：\n\n![images](img/img_p270-1.png)\n\
  \n然后构造并安装如下的解析器：\n\n![images](img/img_p270-2.png)\n\n请参见 Listing 4.6 获取完整示例。\n\n\
  你不需要在程序中设置目录文件位置，而是可以通过 `javax.xml.catalog.files` 属性在命令行中指定它们。提供用分号隔开的绝对文件 URL。\n\
  \n既然你已经看到了解析器是如何定位 DTD 的，让我们考虑各种类型的规则。\n\n`ELEMENT` 规则规定了元素可以拥有哪些子元素。使用由 表 4.1 所示组件组成的正则表达式。\n\
  \n**表 4.1** 元素内容规则\n\n![images](img/img_p270-3.png)\n\n这里有几个简单但典型的示例。接接的规则说明 `menu`\
  \ 元素包含 0 个或多个 `item` 元素：\n\n![images](img/img_p271-1.png)\n\n这组规则规定字体由一个名称后跟一个大小描述，每个部分都包含文本：\n\
  \n![images](img/img_p271-2.png)\n\n缩写 `PCDATA` 表示 `parsed character data`（解析字符数据）。它之所以被称为“解析”，是因为解析器会解释文本字符串，寻找表示新标签开始的\
  \ `<` 字符或表示实体开始的 `&` 字符。\n\n元素规范可以包含嵌套且复杂的正则表达式。例如，这里有一个规则描述了书中章节的组成：\n\n![images](img/img_p271-3.png)\n\
  \n每个章节都以引言开始，随后是一个或多个节，节由一个标题和一个或多个段落、图像、表格或注释组成。\n\n然而，在一种常见情况下，你无法将规则定义的如你希望那样灵活。当元素可以包含文本时，只有两种有效情况：元素元素只包含文本，例如\n\
  \n![images](img/img_p271-4.png)\n\n或者元素包含`文本和标签的任意顺序组合`，例如\n\n![images](img/img_p271-5.png)\n\
  \n指定任何包含 `#PCDATA` 的其他类型的规则都是非法的。例如，以下是不合法的：\n\n![images](img/img_p271-6.png)\n\n\
  你必须重写此类规则，要么引入另一个说明元素，要么允许图像元素和文本的任意组合。\n\n这种限制简化了 XML 解析器处理 `mixed content`（混合内容，标签和文本的混合）的工作。由于允许混合内容会失去一些控制权，最好设计\
  \ DTD 使得所有元素要么包含其他元素，要么只包含文本。\n\n### 注意\n\n实际上，你可以在 DTD 规则中指定元素的任意正则表达式的说法并不完全准确。XML\
  \ 解析器可能会拒绝某些导致非确定性解析的复杂规则集。例如，正则表达式 `((x,y)|(x,z))` 是非确定性的。当解析器看到 `x` 时，它不知道选择两个替代方案中的一个。这个表达式可以重写为确定性形式\
  \ `(x,(y|z))`。然而，某些表达式无法重新构表，例如 `((x,y)*|x?)`。Java XML 库中的解析器在遇到歧义的 DTD 时不会给出警告；它在解析时简单地选择第一个匹配的替代方案，这会导致它拒绝某些正确的输入。解析器有权这样做，因为\
  \ XML 标准允许解析器假设 DTD 是没有歧义的。\n\n还可以指定规则来描述元素的合法属性。通用语法如下\n\n![images](img/img_p272-1.png)\n\
  \n表 4.2 显示了合法的属性类型，表 4.3](#chapter004.xhtml_tab4-3) 显示了默认值的语法。\n\n**表 4.2** 属性类型\n\
  \n![images](img/img_p272-2.png)\n\n这里有两个典型的属性规范：\n\n![images](img/img_p272-3.png)\n\
  \n第一个规范描述了 `font` 元素的 `style` 属性。四个合法的属性值，默认值是 `plain`。第二个规范表示 `size` 属性可以包含任何字符序列。\n\
  \n**表 4.3** 属性默认值\n\n![images](img/img_p273.png)\n\n### 注意\n\n通常建议在 DTD 规则中使用元素而不是属性来描述数据。因此，`style`\
  \ 样式应该是独立的元素，例如 `<font><style>plain</style></font>`。然而，属性有一个不可忽视的优势，因为解析器可以验证值是否为允许的值之一，如果没有给出值则提供默认值。`CDATA`\
  \ 属性值的处理与你看到的 `#PCDATA` 略有不同，属性值首先经过规范化——即解析器处理字符和实体引用（如 `&#233;` 或 `&lt;`）并替换空格。\n\
  \n`NMTOKEN`（名称令牌）与 `CDATA` 类似，但不允许字母数字字符和内部空格，解析器会移除首尾空格。`NMTOKENS` 是由空格隔开的令牌列表。\n\
  \n`ID` 构造非常有用。`ID` 是在文档中必须唯一的名称令牌——解析器会检查唯一性。你将在下一个示例中看到它的应用。`IDREF` 是对文中 `ID` 的引用，解析器也会进行检查。`IDREFS`\
  \ 是由空格隔开的 ID 引用列表。\n\n`ENTITY` 属性值引用“解析外部实体”。这是 SGML 的遗留，在实践中很少使用。加密的 XML 规范 [www.xml.com/axml/axml.html](http://www.xml.com/axml/axml.html)\
  \ 有一个示例。\n\nDTD 还可以定义 `entities`（实体），即解析时替换的缩写。你可以在 Firefox 浏览器的用户界面描述中找到使用实体的良好示例。这些描述以\
  \ XML 格式化，并包含如下实体定义\n\n![images](img/img_p274-1.png)\n\n在其他地方，文本可以包含实体引用，例如：\n\n\
  ![images](img/img_p274-2.png)\n\n解析器将实体引用替换为替换字符串。为了应用程序国际化，只需要更改实体定义中的字符串。实体的其他用法更复杂且不常见；详情见\
  \ XML 规范。\n\nDTD 的介绍结束。现在你已经知道了如何使用 DTD，可以配置解析器来利用它们。\n\n首先，告诉文档构建工厂开启验证：\n\n![images](img/img_p274-3.png)\n\
  \n由此工厂产生的所有构建器都会根据 DTD 对输入进行验证。验证最有用的处是忽略元素内容中的空格。例如，考虑以下 XML 片段\n\n![images](img/img_p274-4.png)\n\
  \n\n\n非校验解析器会报告 `font`、`name` 和 `size` 元素之间的空白字符，因为它无法得知 `font` 的子元素是否是：\n\n![images](img/img_p274-5.png)\n\
  \n或可能是\n\n![images](img/img_p274-6.png)\n\n一旦 DTD 规定了子元素为 `(name,size)`，解析器就知道它们之间的空白不是文本。调用\n\
  \n![images](img/img_p274-7.png)\n\n构建器将停止在文本节点中报告这些空白。这意味着你现在可以依赖 `font` 节点有两个子元素这一事实了。你不再需要编写一个繁琐的循环：\n\
  \n![images](img/img_p274-8.png)\n\n相反，你可以简单地访问第一个和第二个子元素：\n\n![images](img/img_p275-1.png)\n\
