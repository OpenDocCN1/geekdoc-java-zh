  \n## 4.6 使用命名空间\n\n4.6 使用命名空间\n\nJava 语言使用包来避免命名冲突。只要不在同一个包中，程序员可以使用相同的名称定义类。XML\
  \ 为元素和属性名称有一个类似的*命名空间*机制。\n\n命名空间由统一资源标识符（URI）标识，例如\n\n![images](img/img_p292-1.png)\n\
  \nHTTP URL 形式最为常见。注意，URL 仅用作标识符，而不是文档的定位符。例如，命名空间标识\n\n![images](img/img_p292-2.png)\n\
  \n表示*不同的*命名空间，即使 Web 服务器为这两个 URL 提供相同的文档。\n\n命名空间 URL 不需要有任何文档——XML 解析器不会尝试在该位置查找任何内容。然而，为了帮助遇到可能不熟悉的命名空间的程序员，通常会在\
  \ URL 位置放置一个说明该命名空间目的的文档。例如，如果你将浏览器指向 XML Schema 命名空间的 URL ([`www.w3.org/2001/XMLSchema`](http://www.w3.org/2001/XMLSchema))，你会找到一个描述\
  \ XML Schema 标准的文档。\n\n为什么要在命名空间标识符中使用 HTTP URL？这很容易确保它们是独的。如果你选择了一个真实的 URL，主机部分的唯一性由域名系统保证。你的组织可以随后安排\
  \ URL 剩余部分的唯一性。这与 Java 包名中使用反转域名的原理相同。\n\n\n\n\n当然，虽然长的命名空间标识符有助于唯一性，但你并不希望尽可能地处理冗长的标识符。在\
  \ Java 编程语言中，你使用 `import` 机制来指定包的完整名称，然后只使用短类名。在 XML 中，有一个类似的机制：\n\n![images](img/img_p292-3.png)\n\
  \n该元素及其子元素现在属于给定的命名空间。\n\n子元素可以提供自己的命名空间，例如：\n\n![images](img/img_p292-4.png)\n\n\
  那么第一个子元素和孙子元素属于第二个命名空间。\n\n如果你只需要单个命名空间，或者命名空间是自然嵌套的，那么这种简单的机制运行良好良好。否则，你将希望使用另一种在\
  \ Java 中没有对应机制的机制。你可以为命名空间设置一个 `prefix`（前缀）——一个你为特定文档选择的短标识符。这是一个典型的例子——XML Schema\
  \ 文件中的 `xsd` 前缀：\n\n![images](img/img_p293-1.png)\n\n属性\n\n![images](img/img_p293-2.png)\n\
  \n定义了一个命名空间和一个前缀。在我们的示例中，前缀是字符串 `xsd`。因此，`xsd:schema` 实际上意味着命名空间 [`www.w3.org/2001/XMLSchema`](http://www.w3.org/2001/XMLSchema)\
  \ 中的 `schema`。\n\n### 注意 ![images](img/note.png) \n\n只有子元素继承父元素的命名空间。没有显式前缀的属性永远不会属于命名空间。考虑这个人为的例子：\n\
  \n![images](img/img_p293-3.png)\n\n在这个示例中，元素 `configuration` 和 `size` 属于 URI 为 [`www.horstmann.com/corejava`](http://www.horstmann.com/corejava)\
  \ 的命名空间。属性 `si:unit` 属于 URI 为 [`www.bipm.fr/enus/3_SI/si.html`](http://www.bipm.fr/enus/3_SI/si.html)\
  \ 的命名空间。然而，属性值不属于任何命名空间。\n\n你可以控制解析器如何处理命名空间。默认情况下，Java XML 库的 DOM 解析器不是命名空间感知的。\n\
  \n要开启命名空间处理，调用 `DocumentBuilderFactory` 的 `setNamespaceAware` 方法：\n\n![images](img/img_p293-4.png)\n\
  \n现在，工厂产生的所有构建器都支持命名空间。\n\n或者，从 Java 13 开始，调用\n\n![images](img/img_p293-5.png)\n\
  \n由构建器创建的节点有三个属性：\n\n* 带有前缀的 `qualified name`（限定名），由 `getNodeName`、`getTagName`\
  \ 等返回。\n* 命名空间 URI，由 `getNamespaceURI` 方法返回。\n* `local name`（本地名），不带前缀或命名空间，由 `getLocalName`\
  \ 方法返回。\n\n这里有一个示例。假设解析器看到如下所示元素：\n\n![images](img/img_p294.png)\n\n它随后报告以下内容：\n\
  \n* 受限名 = `xsd:schema`\n* 命名空间 URI = [`www.w3.org/2001/XMLSchema`](http://www.w3.org/2001/XMLSchema)\n\
  * 本地名 = `schema`\n\n### 注意 ![images](img/note.png) \n\n如果关闭了命名空间感知，`getNamespaceURI`\
  \ 和 `getLocalName` 将返回 `null`。\n\n#### org.w3c.dom.Node 1.4\n\n* `String getLocalName()`\n\
  \  返回本地名（不带前缀），如果解析器不是命名空间感知的则返回 `null`。\n* `String getNamespaceURI()`\n  返回命名空间\
  \ URI，如果节点不属于命名空间或解析器不是命名空间感知的，则返回 `null`。\n\n#### javax.xml.parsers.DocumentBuilderFactory\
  \ 1.4\n\n* `static DocumentBuilderFactory newNSInstance()` 13\n  产生一个其构建器是命名空间感知的工厂。\n\
  * `boolean isNamespaceAware()`\n* `void setNamespaceAware(boolean value)`\n  获取或设置工厂的\
  \ `namespaceAware` 属性。如果设置为 `true`，则该工厂生成的解析器将是命名空间感知的。\n\n## 4.7 流式解析器\n\nDOM 解析器将整个\
  \ XML 文档读取到树形数据结构中。对于大多数实际应用，DOM 的工作运行良好。然而，如果文档很大，且你的处理算法足够简单，可以流式分析节点而无需看到整个树结构，那么它可能会效率低下。在这些情况下，你应该使用流式解析器。\n\
  \n在接下来的章节中，我们将讨论 Java 库提供的流式解析器：经典的 SAX 解析器和 Java 6 中引入的更现代的 StAX 解析器。SAX 解析器使用事件回调，而\
  \ StAX 解析器提供了一个通过解析事件进行迭代器。后者通常更方便一点。\n\n#### 4.7.1 使用 SAX 解析器\n\nSAX 解析器在解析 XML\
  \ 输入组件时报告事件，但它不会以任何方式存储文档——构建数据结构由事件处理程序负责。事实上，DOM 解析器构建在 SAX 解析器之上。它在接收解析器事件时构建\
  \ DOM 树。\n\n每当你使用 SAX 解析器时，你都需要一个处理器来定义各种解析事件的动作。`ContentHandler` 接口定义了几个解析器在解析文档时执行的回调方法。以下是最重要的几个：\n\
  \n* `startElement` 和 `endElement` 在解析器遇到开始标签和结束标签时调用。\n* `characters` 在解析器遇到字符数据时调用。\n\
  * `startDocument` 和 `endDocument` 在文档开始和结束时各调用一次。\n\n例如，当解析片段\n\n![images](img/img_p295.png)\n\
  \n解析器做出以下回调：\n\n1. `startElement`, 名为 `font`\n2. `startElement`, 名为 `name`\n3. `characters`,\
  \ 内容为 `Helvetica`\n4. `endElement`, 名为 `name`\n5. `startElement`, 属性 `units=\"pt\"\
  `\n6. `characters`, 内容为 `36`\n7. `endElement`, 名为 `size`\n8. `endElement`, 名为 `font`\n\
  \n你的处理器需要重写这些方法，并在解析文件时执行你想执行的动作。本节末的示例程序通过 `startElement` 方法来检查具有 `href` 属性的 `a`\
  \ 元素。\n\n### 注意 ![images](img/note.png) \n\nHTML 不需要是有效的 XML，许多网页偏离了 XML，以至于示例程序无法解析它们。然而，许多由\
  \ W3C 编写的页面使用的是 XHTML（一种符合 XML 的 HTML 方言）。你可以使用这些页面来测试示例程序。\n\n示例程序是使用 SAX 的良好示例。我们完全不在乎\
  \ `a` 元素出现在什么上下文中，也不需要存储树结构。\n\n以下是获取 SAX 解析器的方法：\n\n![images](img/img_p296-1.png)\n\
