  \ 将使用新的默认值，即使在那些在默认值更改后未重新编译的类文件中也是如此。\n\n有两种特殊的快捷方式可以简化注解。\n\n如果没有指定任何元素（无论是因为该注解没有任何元素，还是因为所有元素都使用默认值），你就不需要使用括号。例如，\n\
