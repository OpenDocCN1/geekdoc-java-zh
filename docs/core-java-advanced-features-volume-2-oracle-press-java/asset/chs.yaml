  \ `IIOImage`。\n\n## 9.4.2 图像处理假设你有一张图像并希望改进它的外观。你需要访问图像的每个像素并用其他像素替换它们。或者，你可能想从头计算图像的像素——例如，显示物理测量结果或数学计算的结果。`BufferedImage`\
  \ 类允许你控制图像中的像素，而实现 `BufferedImageOp` 接口的类则允许你转换图像。\n\n**注意**\nJDK 1.0 拥有一个完全不同且远复杂的图像框架，该框架针对从\
  \ Web 下载的图像进行*增量渲染*（一次一次扫描行）进行了优化。然而，操作这些图像非常困难。我们在本书中不讨论该框架。\n\n#### 9.4.2.1 构建栅格图像\n\
  \n你操作的大多数图像仅仅是从图像文件中读取的——它们是由数码相机或扫描仪等设备产生的，是由绘图程序构建的。在本节中，我们将为你展示一种构建图像的不同技术——即逐像素地构建它。\n\
  \n要创建图像，按通常方式构造 `BufferedImage` 对象。\n\n![images](img/img_p725-1.png)\n\n现在，调用 `getRaster`\
  \ 方法获取类型为 `WritableRaster` 的对象。你使用此对象来访问并修改图像的像素。\n\n![images](img/img_p725-2.png)\n\
  \n`setPixel` 方法允许你设置单个像素。这里的复杂之处在于，你不能简单地将像素设置为 `Color` 值。你必须知道缓冲图像是如何指定颜色值的。这取决于图像的*类型*。如果你的图像类型为\
  \ `TYPE_INT_ARGB`，则每个像素由四个值描述——红、绿、蓝和 Alpha，每个值介于 0 到 255 之间。你必须在一个包含四个整数的数组中提供它们：\n\
  \n![images](img/img_p725-3.png)\n\n在 Java 2D API 的术语中，这些值被称为像素的*样本值*（sample values）。\n\
  \n**注意**\n还有 `setPixel` 方法接受类型为 `float[]` 和 `double[]` 的数组参数。然而，你需要放入这些数组中的值*不是*\
  \ 0.0 到 1.0 之间的归一化颜色值。\n\n![images](img/img_p725-4.png)\n\n无论数组类型是什么，你都需要提供 0 到\
  \ 255 之间的值。\n\n你可以使用 `setPixels` 方法批量提供像素。指定起始像素位置以及要设置的矩形的宽度和高度。然后，提供一个包含所有像素样本值的数组。例如，如果你的缓冲图像类型为\
  \ `TYPE_INT_ARGB`，提供第一个像素的红、绿、蓝和 Alpha 值，然后提供第二个像素的红、绿、蓝和 Alpha 值，依此类推。\n\n![images](img/img_p725-5.png)\n\
  \n相反，要读取像素，请使用 `getPixel` 方法。提供一个包含四个整数的数组以存储样本值。\n\n![images](img/img_p726-1.png)\n\
  \n你可以使用 `getPixels` 方法读取多个像素。\n\n![images](img/img_p726-2.png)\n\n如果你使用 `TYPE_INT_ARGB`\
  \ 以外的图像类型，并且知道该类型如何表示像素值，仍然可以使用 `getPixel/setPixel` 方法。然而，你必须知道特定图像类型中样本值的编码。\n\n\
  如果你需要处理具有任意、未知的图像类型的图像，那么你必须付出更多努力。每个图像类型都有一个*颜色模型*（color model），可以在样本值之间进行转换。\n\
  \n**注意**\nRGB 颜色并不像你认为的那样标准。颜色值的外观取决于设备的特性。数码相机、扫描仪和 LCD 显示器都有它们自己的特性。结果是相同的 RGB\
  \ 值在不同设备上看起来完全不同。国际色彩联盟 ([color.org](http://color.org)) 建议所有颜色数据都附带一个色彩配置文件（ICC\
  \ profile），即 1931 CIE 颜色规范。该规范由国际照明委员会 ([cie.co.at](http://cie.co.at)) 制定，它是负责照明和色彩所有事务的国际组织。该规范是表示人眼可以感知的颜色的标准方法，称为\
  \ X、Y、Z 坐标。（详情参见 John F. Hughes 等人的《Computer Graphics: Principles and Practice,\
  \ Third Edition》第 28 章。）\n\n然而，色彩配置文件是复杂的。一个简单的建议标准 sRGB ([`www.w3.org/Graphics/Color/sRGB.html`](https://www.w3.org/Graphics/Color/sRGB.html))\
  \ 指定了 RGB 值与 1931 CIE 值之间的精确映射，该映射旨在与典型的显示器良好配合。Java 2D API 在转换 RGB 和其他颜色空间时使用该映射。\n\
  \n`getColorModel` 方法返回颜色模型：\n\n![images](img/img_p727-1.png)\n\n要找到像素的颜色，调用 `Raster`\
  \ 类的 `getDataElements` 方法。该调用返回一个包含颜色模型特定描述的 `Object`。\n\n![images](img/img_p727-2.png)\n\
  \n**注意**\n`getDataElements` 方法返回的对象实际上是样本值数组。处理该对象时不需要知道这一点，但它解释了为什么该方法被称为 `getDataElements`。\n\
  \n颜色模型可以将该对象转换为标准的 ARGB 值。`getRGB` 方法返回一个 `int` 值，其 Alpha、红、绿、蓝值封装在四个八位块中。你可以使用\
  \ `Color(int argb, boolean hasAlpha)` 构造函数从该整数构造 `Color` 值：\n\n![images](img/img_p727-3.png)\n\
  \n要设置特定颜色，反转这些步骤。`Color` 类的 `getRGB` 方法产生一个带有 Alpha、红、绿、蓝值的 `int` 值。将该值传递给 `ColorModel`\
  \ 类的 `getDataElements` 方法。返回值是一个颜色模型特定描述的 `Object`。将该对象传递给 `WritableRaster` 类的 `setDataElements`\
  \ 方法。\n\n![images](img/img_p727-4.png)\n\n\n\n\n为了说明如何使用这些方法从单个像素构建图像，我们遵循传统绘制了一个曼德博集合（Mandelbrot\
  \ set），如图图 9.56 = (0, 0)` 开始的序列并进行迭代：\n\n![images](img/img_p727-5.png)![images](img/img_p728-1.png)\n\
  \n**图 9.56** 曼德博集合\n\n事实证明，如果 `x` 或 `y` 任何时候大于 2，则序列就会逃向无穷大。只有对应于导致边界序列的点（`a`, `b`）像素会被上色。（数字序列的公式最终源于复数数学；我们直接予以接受即可。）\n\
