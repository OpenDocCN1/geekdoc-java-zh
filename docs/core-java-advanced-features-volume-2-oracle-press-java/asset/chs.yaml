  \n![images](img/img_p37-4.png)\n\n并在第二行设置断点。\n\n#### `java.util.stream.Stream` 8\n\
  \n*   `Stream<T> distinct()`\n    产生一个包含此流去重元素的流。\n*   `Stream<T> sorted()`\n* \
  \  `Stream<T> sorted(Comparator<? super T> comparator)`\n    产生一个元素为此流元素排序顺序的流。第一种方法要求元素是实现\
