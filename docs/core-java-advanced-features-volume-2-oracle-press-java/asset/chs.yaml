  \n最后，调用 `getInputStream` 并读取服务器响应。\n\n让我们运行一个实际示例。网站 [`tools.usps.com/zip-code-lookup.htm?byaddress`](https://tools.usps.com/zip-code-lookup.htm?byaddress)\
