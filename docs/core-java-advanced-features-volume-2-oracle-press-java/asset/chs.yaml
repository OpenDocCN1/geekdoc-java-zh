  \ `/staff/employee` 中遇到一个节点时，执行以下操作：\n\n1. 输出字符串 `<tr>`。\n2. 在处理其子元素时继续应用模板。\n3.\
  \ 在处理完子元素后输出字符串 `</tr>`。\n\n\n\n`transform` 方法的参数是实现了 `Source` 和 `Result` 接口的类对象。有几个类实现了\
  \ `Source` 接口：\n\n![images](img/img_p319-2.png)\n\n你可以从文件、流、读取器或 URL 构建一个 `StreamSource`，从\
