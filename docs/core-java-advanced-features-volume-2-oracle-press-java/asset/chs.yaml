  \n#### `java.net.HttpURLConnection`\n\n- `InputStream getErrorStream()`\n  返回一个流，你可以从中读取\
  \ Web 服务器的错误消息。\n\n#### `java.net.URLEncoder`\n\n- `static String encode(String\
  \ s, String encoding)`:\n  返回字符串 `s` 的 URL 编码形式，使用给定的字符编码方案。（推荐的方案是 \"UTF-8\"）。在\
  \ URL 编码中，字符 A–Z、a–z、0–9、- _ . ~ 保持不变。空格被编码为 +，所有其他字符被编码为形式如 `%*XY*` 的编码字节序列，其中\
  \ 0x*XY* 是字节的十六进制值。\n\n#### `java.net.URLDecoder`\n\n- `static String decode(String\
  \ s, String encoding)`:\n  在给定的字符编码方案下返回 URL 编码字符串 `s` 的解码结果。\n\n\n\n\n`URLConnection`\
  \ 类是在 HTTP 尚未成为 Web 通用协议之前设计的。它支持多种协议，但其对 HTTP 的支持有些繁琐。在决定支持 HTTP/2 时，很显然提供一个现代的客户端接口比重写现有的\
  \ API 更好。`HttpClient` 提供了更方便的 API 和 HTTP/2 支持。在 Java 9 和 10 中，这些 API 类位于 `jdk.incubator.http`\
  \ 包中，以便让 API 有机会根据用户反馈进进。从 Java 11 开始，`HttpClient` 位于 `java.net.http` 包中。\n\n####\
  \ ![images](img/note.png) **注意**\n\n在 Java 9 和 10 中，你需要使用命令行选项运行程序：\n\n```![images](img/img_p513-1.png)\n\
  ```\n\n与具有一套繁琐阶段的 `URLConnection` 类相比，HTTP 客户端 API 为连接 Web 服务器提供了一种更简单的机制。\n\n####\
  \ 8.4.1 HttpClient 类\n\n`HttpClient` 可以发送请求并接收响应。通过调用以下方法获取客户端：\n\n```![images](img/img_p513-2.png)\n\
  ```\n\n或者，如果你需要配置客户端，可以使用构建器 API，如下：\n\n```![images](img/img_p513-3.png)\n```\n\n\
  也就是说，你获取一个构建器，调用方法来自定义要构建的对象，然后调用 `build` 方法完成构建过程。这是构造不可变对象的常用模式。\n\n### 8.4.2\
  \ HttpRequest 类和 Body 发布者\n\n你同样遵循构建器模式来制定请求。这是一个 GET 请求：\n\n```![images](img/img_p514-1.png)\n\
