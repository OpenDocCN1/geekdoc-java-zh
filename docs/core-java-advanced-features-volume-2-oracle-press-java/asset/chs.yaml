  \ 方法：\n\n![images](img/img_p306-3.png)\n\n#### 4.8.3 写入文档\n\n奇怪的是，将 DOM 树写入输出流并不容易。最简单的方法是使用扩展样式表语言转换（XSLT）API。有关\
