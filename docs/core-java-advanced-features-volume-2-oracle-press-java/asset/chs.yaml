  \n### 2.4.4 复制、移动和删除文件\n\n要将文件从一个位置复制到另一个位置，只需调用\n\n![images](img/img_p142-2.png)\n\
  \n要移动文件（即复制并删除原始文件），调用\n\n![images](img/img_p142-3.png)\n\n如果目标存在，复制或移动将失败。如果你想覆盖现有目标，请使用\
