  \ 2.3.4 `readResolve` 和 `writeReplace` 方法\n\n你必须特别注意身份重要的对象的序列化和反序列化。这在你实现单例或实例数量有限的类时会发生。\n\
  \n如果你使用 Java 语言的 `enum` 结构，就不担心序列化——它能正常工作。然而，假设你维护的包含枚举类型的旧代码，例如：\n\n![images](img/img_p127-1.png)\n\
  \n这种写法在 Java 语言添加枚举之前很常见。注意构造函数是私有的。因此，除了 `Orientation.HORIZONTAL` 和 `Orientation.VERTICAL`\
  \ 之外，无法创建任何对象。特别是，你可以使用 `==` 运算符来测试对象的相等性：\n\n![images](img/img_p127-2.png)\n\n\
  默认序列化机制并不适用。假设我们写入一个 `Orientation` 类型的值并再次读取它：\n\n![images](img/img_p127-3.png)\n\
  \n现在测试\n\n![images](img/img_p127-4.png)\n\n将会失败。事实上，保存的值是 `Orientation` 类型的完全新对象，它不等于任何预定义的常量。即使构造函数是私有的，序列化机制也可以创建新对象！\n\
  \n你可以通过另一个特殊的序列化方法 `readResolve` 来解决这个问题。如果定义了 `readResolve` 方法，它会在对象反序列化后被调用。它必须返回一个对象，然后该对象将成为\
  \ `readObject` 方法的返回值。在我们的案例中，`readResolve` 方法将检查 `value` 字段并返回适当的枚举常量：\n\n![images](img/p127-5)\n\
  \n### ![images](img/tip.png) 提示\n\n对于单例类，你还需要小心防止反序列化产生第二个实例。使用枚举来避免这个问题：\n\n![images](img/img_p128-1)\n\
  \n由于枚举被正确反序列化，你保证了 `MySingleton.INSTANCE`。\n\n有时，`readResolve` 方法与另一个特殊方法结合使用：\n\
  \n![images](img/img_p128-2)\n\n`writeReplace` 生成一个要写入对象流的对象代替当前对象。替换对象必须是可序列化或 externalizable。在读取对象流时，替换对象被反序列化并调用其\
  \ `readResolve` 方法以重建原始对象。\n\n### ![images](img/note.png) 注意\n\n与必须是私有的 `readObject`/`writeObject`\
  \ 方法，或必须是公共的 `readExternal`/writeExternal` 方法不同，`readResolve` 和 `writeReplace` 方法可以使用任何访问修饰符。\n\
  \n这里有一个展示该机制的示例。`ColoredPoint` 类的 `writeReplace` 方法产生嵌套类 `Ser` 的替换对象。为了方便起见，示例使用了\
  \ record。替换类的 `readResolve` 方法重构了原始的 `ColoredPoint` 对象。\n\n![images](img/img_p128-3)\n\
  \n为什么要费这个劲呢？默认序列化会保存两个对象而不是三个整数。你可以通过 `readExternal`/writeExternal` 方法实现相同的节省，但这些方法必须是公共的。\n\
  \n`LocalDate` 类以及 `java.time` 包中的其他类都使用了这种策略。因此，序列化示例使用了 `Date` 对象。我不想解释对象流中 `Ser`\
  \ 对象的存在。\n\n### ![images](img/note.png) 注意\n\n与 `readObject`/`writeObject` 方法不同，`readResolve`\
  \ 和 `writeReplace` 方法不需要是私有的。\n\n#### 2.3.5 版本控制\n\n如果你使用序列化来保存对象，你需要考虑当程序演进时会发生什么。1.1\
  \ 版本能读取旧文件吗？仍在使用 1.0 的用户能读取新版本产生的文件吗？显然，如果对象文件能够应对类的演进将是理想的。\n\n\n\n\n\n乍一看，这似乎是不可能的。当类定义发生任何变化时，其\
  \ SHA 指纹也会随之改变，而你知道对象输入流将拒绝读取指纹不同的对象。然而，一个类可以指示它与自身的早期版本是`compatible`的。要做到这一点，你必须先获取该类早期版本的指纹。使用\
  \ JDK 部分的独立程序 `serialver` 来获取此数字。例如，运行\n\n![images](img/img_p129-1.png)\n\n会打印出\n\
  \n![images](img/img_p129-2.png)\n\n该类的所有后续版本必须将 `serialVersionUID` 常数定义为与原始版本相同的指纹。\n\
  \n![images](img/img_p130.png)\n\n当类中有一个名为 `serialVersionUID` 的静态数据成员时，它将不会手动计算指纹，而是改用该值。\n\
  \n一旦该静态数据成员被放置在类中，序列化系统现在愿意读取该类不同版本的对象。\n\n如果只是类的方法发生了变化，那么读取新的对象数据没有问题。但是，如果实例字段发生了变化，你可能会遇到问题。例如，旧文件对象中的实例字段可能比程序中的字段多或少，或者实例字段的类型可能不同。在这种情况下，对象输入流会尽力将序列化对象转换为类的当前版本。\n\
  \n对象输入流会将类当前版本的实例字段与序列化对象中版本的实例字段进行比较。当然，对象输入流只考虑 `nontient` 和 `nonstatic` 实例字段。如果两个字段的名称匹配但类型不同，对象输入流将不会尝试将一种类型转换为另一种类型——这些对象是不兼容的。如果序列化对象具有当前版本中不存在的实例字段，对象输入流将忽略这些额外数据。如果当前版本具有序列化对象中不存在的实例字段，则新增的字段将被设置为它们的默认值（对象为\
  \ null，数字为 0， 布尔值为 false）。\n\n这里有一个例子。假设我们使用类的原始版本 (1.0) 在磁盘上保存了一数量的员工记录。现在，我们通过添加一个名为\
  \ `department` 的实例字段将 `Employee` 类更改为 2.0 版本。图 2.7 显示了当一个 1.0 对象读入使用 2.0 对象的程序时会发生什么。`department`\
  \ 字段被设置为 null。图 2.8 显示了相反的情况：一个使用 1.0 对象的程序读取一个 2.0 对象。额外的 `department` 字段被忽略了。\n\
  \n这个过程安全吗？这取决于情况。丢弃实例字段似乎是无害的——接收方仍然拥有它知道如何操作的所有数据。将实例字段设置为 null 可能并不那么安全。许多类实现了\
  \ `validateObject` 来检查对象是否被正确地反序列化。\n\n![images](img/img_p131-1.png)\n图 2.7\n\n\
  ![images](img/img_p131-2.png)\n图 2.8\n\n![images](img/img_p132-1.png)\n![images](img/img_p132-2.png)\n\
  ![images](img/img_p134-2.png)\n![images](img/img_p135-1.png)\n![images](img/img_p135-2.png)\n\
  ![images](img/img_p136-1.png)\n\n\n\n\n随后，该对象会被调度进行验证，当该对象及其所有依赖对象都加载后，将调用 `validateObject`\
  \ 方法。第二个参数允许你指定优先级。优先级较高的验证请求将优先执行。\n\n还存在其他安全风险。攻击者可以创建消耗足够资源导致虚拟机崩溃的数据结构。更阴险的是，类路径上的任何类都可以被反序列化。黑客们非常擅长拼凑“getget\
  \ 链”（gadget chains），即在各种工具类中的一系列操作序列，这些操作利用反射并最终调用诸如 `Runtime.exec` 等方法，并传入他们选择的字符串。\n\
  \n任何通过网络连接从不可信源接收序列化数据的应用程序都容易受到此类攻击。例如，某些服务器会序列化会话数据，并反序列化 HTTP 会话 cookie 中返回的任何数据。\n\
  \n你应该避免反序列化来自不可信源的任意数据的情况。以会话数据为例，服务器应该对数据进行签名，并且仅反序列化具有有效签名的数据。\n\nJEP 290 和 415\
  \ 提供了*序列化过滤器*（serialization filter）机制，以增强应用程序防御此类攻击的能力。过滤器可以看到被反序列化类的名称以及若干项指标（流大小、数组大小、引用总数、最长引用链）。基于这些数据，可以中止反序列化。\n\
  \n在最简单的形式下，提供一个描述有效和无效类的模式。例如，如果你启动我们的示例序列化演示程序如\n\n![images](img/img_p136-2.png)\n\
  \n那么对象将被加载。该过滤器允许 `serial` 包中的所有类以及所有包名以 `java` 开头的类，但不允许其他类。如果你不允许 `java`，或至少不允许\
  \ `java.util.Date`，反序列化将失败。\n\n你可以将过滤器模式放入配置文件中，并为不同的用途指定多个过滤器。你也可以实现自己的过滤器。详情请参见\
  \ [`docs.oracle.com/en/java/javase/17/core/serialization-filtering1.html`](https://docs.oracle.com/en/java/javase/17/core/serialization-filtering1.html)。\n\
  \n## 2.4 文件文件操作\n\n你已经学习了如何从文件中读取和写入数据。然而，文件管理不仅仅是读和写。`Path` 接口和 `Files` 类封装了在用户机器文件系统上工作所需的功能。例如，可以使用\
  \ `Files` 类来删除或重命名文件，或者查找文件最后一次修改的时间。换句话说，输入/输出流类关注文件的内容，而我们在这里讨论的类关注的是文件在磁盘上的存储。\n\
  \n`Path` 接口和 `Files` 类是在 Java 7 中引入的。它们比可以追溯到 JDK 1.0 的 `File` 类要方便得多。我们预计它们会受到\
  \ Java 程序员的欢迎，并对其进行深入讨论。\n\n#### 2.4.1 路径 (Paths)\n\n`Path` 是目录名称的序列，可选地跟一个文件名。路径的第一部分可以是*根组件*（root\
  \ component），例如 `/` 或 `C:\\`。允许的根组件取决于文件系统。以根组件头的路径是*绝对路径*（absolute）。否则，它是*相对路径*（relative）。例如，在这里我们构造了一个绝对路径相对路径。对于绝对路径，我们假设使用类\
  \ Unix 文件系统。\n\n![images](img/img_p137-1.png)\n\n静态方法 `Path.of` 接收一个或多个字符串，并使用默认文件系统的路径分隔符（类\
  \ Unix 文件系统为 `/`，Windows 为 `\\`）将它们连接。然后解析结果，如果结果在给定文件系统中不是有效路径，则抛出 `InvalidPathException`。结果是一个\
  \ `Path` 对象。\n\n`get` 方法可以获取包含多个组件的单个字符串。例如，你可以这样从配置文件读取路径：\n\n![images](img/img_p137-2.png)\n\
  \n### 注意\n\n路径并不对应于实际存在的文件。它仅仅是一个抽象名称序列。正如你将在下一节中看到的，当你想要创建一个文件时，你先创建一个路径，然后调用方法来创建相应的文件。\n\
  \n组合或*解析*（resolve）路径是非常常见的操作。调用 `p.resolve(q)` 根据以下规则返回一个路径：\n\n* 如果 `q` 是绝对路径，则结果为\
  \ `q`。\n* 否则，根据文件系统的规则，结果为“p 然后是 q”。\n\n例如，假设你的应用程序需要相对于从配置文件读取的给定基目录来查找其工作目录，如上一个示例所示。\n\
  \n![images](img/img_p138-1.png)\n\n`resolve` 方法有一个快捷方式，可以接收字符串而不是路径：\n\n![images](img/img_p138-2.png)\n\
  \n还有一个便利方法 `resolveSibling`，它相对于路径的父路径进行解析，产生一个兄弟路径。例如，如果 `workPath` 是 `/opt/myapp/work`，调用\n\
  \n![images](img/img_p138-3.png)\n\n将创建 `/opt/myapp/temp`。\n\n`resolve` 的反操作是 `relativize`（相对化）。调用\
  \ `p.relativize(r)` 产生路径 `q`，该路径与 `p` 解析后会产生 `r`。例如，相对于 `/home/fred/input.txt` 相对化\
  \ `/home/harry` 得到 `../fred/input.txt`。在这里我们假设 `..` 表示文件系统中的父目录。\n\n`normalize`\
  \ 方法移除任何冗余的 `.` 和 `..` 组件（或文件系统认为冗余的任何内容）。例如，规范化 `/home/harry/../fred/./input.txt`\
  \ 得到 `/home/fred/input.txt`。\n\n`toAbsolutePath` 方法产生给定路径的绝对路径，从根组件开始，例如 `/home/fred/input.txt`\
  \ 或 `c:\\Users\\fred\\input.txt`。\n\n`Path` 接口有许多拆解路径的有用方法。此代码示例展示了一些最实用的：\n\n![images](img/img_p138-4.png)\n\
  \n正如你在第一卷中已经看到的，你可以从 `Path` 对象构建一个 `Scanner`：\n\n![images](img/img_p138-5.png)\n\
  \n### 注意\n\n偶尔，你可能需要与使用 `File` 类而不是 `Path` 接口的旧 API 交互。`Path` 接口有一个 `toFile` 方法，而\
  \ `File` 类有一个 `toPath` 方法。\n\n#### java.nio.file.Paths\n\n* `static Path get(String\
  \ first, String... more)` 通过连接字符串创建路径。\n\n#### java.nio.file.Path\n\n* `Path resolve(Path\
  \ other)`\n* `Path resolve(String other)` 如果 other 是绝对路径，返回 other；否则，返回连接此 和 other\
  \ 的路径。\n* `Path resolveSibling(Path other)`\n* `Path resolveSibling(String other)`\
  \ 如果 other 是绝对路径，返回 other；否则，返回连接此的父路径和 other 的路径。\n* `Path relativize(Path other)`\
  \ 返回与此解析后产生 other 的相对路径。\n* `Path normalize()` 移除冗余路径元素如 `.` 和 `..`。\n* `Path toAbsolutePath()`\
  \ 返回等于此路径的绝对路径。\n* `Path getParent()` 返回父路径，如果路径没有父路径则返回 null。\n* `Path getFileName()`\
  \ 返回路径的最后一个组件，如果路径没有组件则返回 null。\n* `Path getRoot()` 返回路径的根组件，如果路径没有根组件则返回 null。\n\
  * `toFile()` 根据此路径创建 File。\n\n#### java.io.File\n\n* `Path toPath()` 根据此文件创建 Path。\n\
