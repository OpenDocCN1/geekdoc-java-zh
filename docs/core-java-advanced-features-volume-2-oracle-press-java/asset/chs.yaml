  \n#### 2.1.8 字符编码\n\n输入和输出流用于字节序列，但在许多情况下你将处理文本——即字符序列。这时，如何将字符编码为字节就变得了。\n\nJava\
  \ 使用 Unicode 标准处理字符。每个字符（或称“码点”）都有一个 21 位的整数。存在不同的*字符编码*——即将这些 21 位数字封装成字节的方法。\n\
  \n最常见的编码是 UTF-8，它将每个 Unicode 码点编码为一个到四个字节的序列（参见表 2.1）。UTF-8 的优点是，传统的 ASCII 字符集（包含所有英语使用的字符）中的字符只占用一个字节。\n\
  \n**表 2.1** UTF-8 编码\n\n![images](img/img_p98-1.png)\n\n另一种常见的编码是 UTF-16，它将每个 Unicode\
  \ 码点编码为一个或两个 16 位的值（参见表 2.2）。这是 Java 字符串使用的编码。实际上，UTF-16 有两种形式，称为“大端”和“小端”。考虑 16\
  \ 位值 `0x2122`。在大端格式下，高位字节在前在前：`0x21` 随后是 `0x22`。在小端格式下，情况相反：`0x22 0x21`。为了指示使用的是哪一种，文件可以以“字节顺序标记”开始，即\
  \ 16 位数值 `0xFEFF`。读取器可以使用该值来确定字节序，然后将其丢弃。\n\n**表 2.2** UTF-16 编码\n\n![images](img/img_p98-2.png)\n\
  \n#### ![images](img/caution.png) **注意**\n\n某些程序（包括 Microsoft 记事本）会在 UTF-8 编码文件的开头添加字节顺序标记。显然，这是没有的，因为\
  \ UTF-8 中没有字节顺序问题。但 Unicode 标准允许这样做，甚至建议这是一个好主意，因为这给编码留下了很少疑义。在读取 UTF-8 编码文件时，应该将其移除。遗憾的是，Java\
  \ 并没有这样做，针对此问题的错误报告被关闭为“不予修复”。最好的办法是过滤掉你在输入中发现的任何领先 `\\uFEFF`。\n\n除了 UTF 编码外，还有覆盖适用于特定用户群的字符范围的局部编码。例如，ISO\
  \ 8859-1 是一种单字节编码，包含了西欧语言使用的带重音符号的字符。Shift-JIS 是用于日语字符的变长编码。许多此类编码仍被广泛使用。\n\n没有可靠的方法可以从字节流中自动检测字符编码。某些\
  \ API 方法允许你使用“默认字符集”——即计算机操作系统偏好的字符编码。这与你的字节源所使用的编码相同吗？这些字节很可能源自世界的其他地区。因此，你应该始终显式指定编码。例如，在读取网页时，检查\
  \ Content-Type 头部。\n\n#### ![images](img/note.png) **备注**\n\n平台编码由静态方法 `Charset.defaultCharset`\
  \ 以及系统属性 `native.encoding` 返回。如果你使用 `Console` 类与用户交互，请调用其 `charset` 方法来查找控制台字符集。\n\
  \n静态方法 `Charset.availableCharsets` 返回所有可用的 `Charset` 实例，表现为从规范名称到 `Charset` 对象的映射。\n\
  \n\n\n\nJava 的 Oracle 实现有一个系统属性 `file.encoding`，用于覆盖平台默认设置。这并不是一个官方支持的属性，而且 Oracle\
  \ 的 Java 库实现中的所有部分并不始终遵循它。你不应该设置它。\n\n`StandardCharsets` 类具有类型为 `Charset` 的静态变量，用于每个\
  \ Java 虚拟机必须支持的字符编码：\n\n![images](img/img_p99-1.png)\n\n要获取另一种编码的 `Charset`，请使用静态方法\
  \ `forName`：\n\n![images](img/img_p99-2.png)\n\n在读取或写入文本时使用 `Charset` 对象。例如，你可以将字节数组转换为字符串，如下：\n\
  \n![images](img/img_p100-1.png)\n\n#### ![images](img/tip.png) **提示**\n\n从 Java\
  \ 10 开始，`java.io` 包中的所有方法都允许你使用 `Charset` 对象或字符串来指定字符编码。选择 `StandardCharsets` 常量，这样任何拼写错误都会在编译时被发现。\n\
  \n#### ![images](img/caution.png) **注意**\n\n某些方法（例如 `String(byte[])` 构造函数）如果你不指定，它们将使用默认平台编码；其他方法（例如\
  \ `Files.readAllLines`）则使用 UTF-8。\n\n#### ![images](img/note.png) **备注**\n\n在 Java\
  \ 17 之后，无论平台编码是什么，UTF-8 将成为 JDK 的默认设置。在这个幸运事件发生之前，请确保为所有字符编码指定 `StandardCharsets.UTF_8`——除非你知道你需要不同的编码并必须显式指定。\n\
  \n## 2.2 读取和写入二进制数据\n\n文本格式对于测试和调试非常方便，因为它是人类可读的，但不如二进制格式传输数据高效。在接下来的章节中，你将学习如何对二进制数据进行输入和输出。\n\
  \n#### 2.2.1 DataInput 和 DataOutput 接口\n\n`DataOutput` 接口定义了以下方法，用于二进制格式写入数字、字符、布尔值或字符串：\n\
  \n![images](img/img_p100-2.png)\n\n例如，`writeInt` 无论数字位数，始终将整数写入 4 字节的二进制量，而 `writeDouble`\
  \ 始终将双精度浮点数写入 8 字节的二进制量。产生的输出不是人类可读的，但它为给定类型的每个值使用相同的空间，且读取它将比解析文本更快。\n\n#### ![images](img/note.png)\
  \ **备注**\n\n在内存中存储整数和浮点数有两种不同的方法，取决于你所使用的处理器。假设例如，你正在处理一个 4 字节的 `int`，例如十进制数字 1234，或者十六进制的\
  \ `4D2`（1234 = 4 × 256 + 13 × 16 + 2）。该值可以这样存储：内存中四个字节中的第一个字节持有该值的高位字节（MSB）：`00\
  \ 00 04 D2`。这就是所谓的大端方法。或者，我们可以从最低位字节（LSB）开始：`D2 04 00 00`。这自然而然地被称为小端方法。例如，`SPARC`\
  \ 使用大端；`Pentium` 使用小端。这可能会导致问题。当从 C 或 C++ 文件保存文件时，数据是完全按照处理器存储的方式保存的。这使得将即使是最简单的文件从一个平台移动到另一个平台变得具有挑战。在\
  \ Java 中，所有值都以大端方式写入，无论处理器是什么。这使得 Java 数据文件独立平台。\n\n`writeUTF` 方法使用修改版的 8 位 Unicode\
  \ 转换格式写入字符串数据。它不是简单地使用标准的 UTF-8 编码，而是将 Unicode 代码单元序列表示为 `UTF-16`，然后使用 UTF-8 规则对结果进行编码。这种修改编码对于高于\
  \ `0xFFFF` 的字符是不同的。它是为了兼容在 Unicode 增长到 16 位之前构建的虚拟机。\n\n由于没有其他人使用这种 UTF-8 的修改版本，你应该只使用\
  \ `writeUTF` 方法来编写用于 Java 虚拟机的字符串——例如，在生成字节码的程序中。其他用途请使用 `writeChars` 方法。\n\n要读回数据，请使用\
  \ `DataInput` 接口定义的以下方法：\n\n![images](img/img_p101-1.png)\n\n`DataInputStream` 类实现了\
  \ `DataInput` 接口。要从文件读取二进制数据，请将 `DataInputStream` 与字节源（如 `FileInputStream`）结合使用：\n\
  \n![images](img/img_p101-2.png)\n\n同样，要写入二进制数据，使用实现 `DataOutput` 接口的 `DataOutputStream`\
  \ 类：\n\n![images](img/img_p101-3.png)\n\n#### ***java.io.DataInput*** **1.0**\n\n\
  * `boolean readBoolean()`\n* `byte readByte()`\n* `char readChar()`\n* `double readDouble()`\n\
  * `float readFloat()`\n* `int readInt()`\n* `long readLong()`\n* `short readShort()`\n\
  \  读取给定类型的值。\n* `void readFully(byte[] b)`\n  将字节读入数组 `b` 中，阻塞直到所有字节都被读取。\n* `void\
  \ readFully(byte[] b, int off, int len)`\n  从 `off` 开始将最多 `len` 个字节放入数组 `b` 中。\n\
  * `String readUTF()`\n  读取“修改 UTF-8”格式的字符串。\n* `int skip(int n)`\n  跳过 `n` 个字节。\n\
  \n#### ***java.io.DataOutput*** **1.0**\n\n* `void writeBoolean(boolean b)`\n* `void\
  \ writeByte(int b)`\n* `void writeChar(char c)`\n* `void writeDouble(double d)`\n\
  * `void writeFloat(float f)`\n* `void writeInt(int i)`\n* `void writeLong(long l)`\n\
  * `void writeShort(int s)`\n  写入给定类型的值。\n* `void writeChars(String s)`\n  写入字符串中的所有字符。\n\
  * `void writeUTF(String s)`\n  写入“修改 UTF-8”格式的字符串。\n\n#### 2.2.2 随机访问文件\n\n文本格式对于测试和调试非常方便，因为它是人类可读的，但不如二进制格式传输数据高效。在接下来的章节中，你将学习如何对二进制数据进行输入和输出。\n\
  \n`RandomAccessFile` 类允许你在文件的任意位置读取或写入数据。磁盘文件是随机访问，但与网络通信的输入/输出流不是。你可以以只读或读写方式打开随机访问文件；通过构造函数的第二个参数中使用字符串\
  \ \"r\"读取访问）或 \"rw”（读/写访问）来指定选项。\n\n![images](img/img_p103-1.png)\n\n当你作为 `RandomAccessFile`\
  \ 打开一个现有文件时，它不会被删除。\n\n随机访问文件有一个*文件指针*，指示下一个要读取或写入的字节的位置。可以使用 `seek` 方法将文件指针设置为文件内的任意位置。`seek`\
  \ 的参数是一个介于 0 和文件长度之间的 `long` 整数。\n\n`getFilePointer` 方法返回文件指针的当前位置。\n\n`RandomAccessFile`\
  \ 类实现了 `DataInput` 和 `DataOutput` 接口。要对随机访问文件进行读写，请使用我们在上一节中讨论过的 `readInt/writeInt`\
  \ 和 `readChar/writeChar` 等方法。\n\n让我们来看一个示例程序，该程序在随机访问文件中存储员工记录。每个记录都将具有相同的大小。这使得读取任意记录变得简单。假设你想将文件指针置于第三条记录。只需将文件指针设置为相应的字节位置并开始读取即可。\n\
  \n![images](img/img_p103-2.png)\n\n如果你想修改记录并保存回相同的位置，记得将文件指针设回记录的开头：\n\n![images](img/img_p103-3.png)\n\
  \n要确定文件中总字节数，请使用 `length` 方法。记录总数是长度除以每个记录的大小。\n\n![images](img/img_p103-4.png)\n\
  \n整数和浮点数值在二进制格式中具有固定大小，但对于字符串我们必须付出更多努力。我们提供了两个辅助方法来写入和读取固定大小的字符串。\n\n\n\n\n`writeFixedString`\
  \ 从字符串开始处写入指定数量的代码单元。如果代码单元不足，该方法将使用零值对字符串进行填充。\n\n![images](img/img_p104-1.png)\n\
  \n`readFixedString` 方法从输入流中读取字符，直到消耗了 `size` 个代码单元，或者遇到一个值为 0 的字符。然后，它会跳过输入字段中剩余的零值。为了提高效率，该方法使用\
  \ `StringBuilder` 类来读取一个字符串。\n\n![images](img/img_p104-2.png)\n\n我们将 `writeFixedString`\
  \ 和 `readFixedString` 方法放置在 `DataIO` 辅助类中。\n\n要写入固定大小的记录，我们只需要以二进制形式写入所有字段即可。\n\n\
  ![images](img/img_p104-3.png)\n\n读回数据同样简单。\n\n![images](img/img_p105-1.png)\n\n\
  让我们计算每个记录的大小。我们将为名称字符串留出 40 个字符。因此，每个记录将包含 100 字节：\n\n*   40 个字符 = 80 字节的名称\n* \
  \  1 个 double = 8 字节的工资\n*   3 个 int = 12 字节的日期\n\nListing 2.2 所示的程序将三条记录写入数据文件，然后按反序从文件中读取它们。要高效地实现这一点，需要随机访问——我们需要先到达最后一条记录。\n\
  \n**Listing 2.2** `randomAccess/RandomAccessTest.java`\n\n![images](img/img_p105-2.png)![images](img/img_p106.png)![images](img/img_p107-1.png)\n\
  \n#### `java.io.RandomAccessFile` 1.0\n\n*   `RandomAccessFile(String file, String\
  \ mode)`\n*   `RandomAccessFile(File file, String mode)`\n    打开给定的文件进行随机访问。模式字符串\
  \ `\"r\"` 表示只读模式，`\"rw\"` 表示读写模式，`\"rws\"` 表示读写模式且对每次更新都会将数据和元数据同步写入磁盘，`\"rwd\"\
  ` 表示读写模式且仅对数据同步写入磁盘。\n*   `long getFilePointer()`\n    返回文件指针当前的位置。\n*   `void seek(long\
  \ pos)`\n    将文件指针设置为距离文件开始处 `pos` 字节的位置。\n*   `long length()`\n    返回文件的字节长度。\n\
  \n#### 2.2.3 ZIP 存档\n\nZIP 存档以（通常是）压缩格式存储一个或多个文件。每个 ZIP 存档都有一个头，其中包含每个文件的文件名和所使用的压缩方法等信息。在\
  \ Java 中，你可以使用 `ZipInputStream` 读取 ZIP 存档。你需要查看存档中的各个*条目*（entries）。`getNextEntry`\
  \ 方法返回一个 `ZipEntry` 类型的对象，用于描述该条目。从流读取到末尾，这实际上是当前条目的结束。然后调用 `closeEntry` 读取下一个条目。在读取完最后一个条目之前，不要关闭\
  \ `zin`。以下是读取 ZIP 文件的典型代码序列：\n\n![images](img/img_p107-2.png)\n\n要写入 ZIP 文件，请使用\
  \ `ZipOutputStream`。对于想要放入 ZIP 文件的每个条目，创建一个 `ZipEntry` 对象。将文件名传递给 `ZipEntry` 构造函数；它会设置其他参数，如文件日期和解压方法。如果你愿意，可以覆盖这些设置。然后调用\
  \ `ZipOutputStream` 的 `putNextEntry` 方法开始写入新文件。将文件数据发送到 ZIP 输出流。完成后，调用 `closeEntry`。对要存储的所有文件重复此操作。以下代码骨架：\n\
  \n![images](img/img_p108.png)\n\n#### 注意\n\nJAR 文件（在第一卷第 3 章中讨论过）仅仅是带有特殊条目——即所谓的清单（manifest）的\
  \ ZIP 文件。使用 `JarInputStream` 和 `JarOutputStream` 类来读取和写入清单条目。\n\nZIP 输入流是流抽象能力的极佳示例。当你读取以压缩形式存储的数据时，你不需要担心数据在被请求时正在被解压缩。此外，ZIP\
  \ 流中字节的源不需要是文件——ZIP 数据可以来自网络连接。\n\n#### 注意\n\n第 130 页的第 2.4.8 节](#chapter002.xhtml_sec2-4-8)“ZIP\
  \ 文件系统”展示了如何使用 Java 7 的 `FileSystem` 类在无需特定 API 访问 ZIP 存档。\n\n#### `java.util.zip.ZipInputStream`\
  \ 1.1\n\n*   `ZipInputStream(InputStream in)`\n    创建一个 `ZipInputStream`，允许你从给定的\
  \ `InputStream` 压缩数据。\n*   `ZipEntry getNextEntry()`\n    返回下一个条目的 `ZipEntry` 对象，如果没有更多条目则返回\
  \ `null`。\n*   `void closeEntry()`\n    关闭 ZIP 文件中当前打开的条目。然后你可以通过 `getNextEntry()`\
  \ 读取下一个条目。\n\n#### `java.util.zip.ZipOutputStream` 1.1\n\n*   `ZipOutputStream(OutputStream\
  \ out)`\n    创建一个 `ZipOutputStream`，你可以用它将压缩数据写入指定的输出流。\n*   `void putNextEntry(ZipEntry\
  \ ze)`\n    将 `ZipEntry` 写入输出流。\n*   `void closeEntry()`\n    关闭 ZIP 文件中当前打开的条目。\n\
  *   `void setLevel(int level)`\n    设置压缩级别从 `Deflater.NO_COMPRESSION` 到 `Deflater.BEST_COMPRESSION`。如果级别无效，则抛出\
  \ `IllegalArgumentException`。\n*   `void setMethod(int method)`\n    设置方法为 `DEFLATED`\
  \ 或 `STORED`。\n\n#### `java.util.zip.ZipEntry` 1.1\n\n*   `ZipEntry(String name)`\n\
  \    根据名称构造 ZIP 条目。\n*   `long getCrc()`\n    返回此条目的 CRC32 校验和。\n*   `String getName()`\n\
  \    返回此条目的名称。\n*   `long getSize()`\n    返回此条目的的大小，如果未知则返回 -1。\n*   `boolean isDirectory()`\n\
  \    如果此条目是目录则返回 true。\n*   `void setMethod(int method)`\n    设置方法为 `DEFLATED` 或\
  \ `STORED`。\n*   `void setSize(long size)`\n    设置此条目的的大小。只有在方法为 `STORED` 时需要。\n\
  *   `void setCrc(long crc)`\n    设置此条目的 CRC32 校验和。使用 `CRC32` 类计算此校验和。只有在方法为 `STORED`\
  \ 时需要。\n\n#### `java.util.zip.ZipFile` 1.1\n\n*   `ZipFile(String name)`\n*   `ZipFile(File\
  \ file)`\n    为给定的字符串或 File 对象创建 `ZipFile`。\n*   `Enumeration entries()`\n    返回一个\
  \ `Enumeration` 对象，用于枚举描述 `ZipFile` 条目的 `ZipEntry` 对象。\n*   `ZipEntry getEntry(String\
  \ name)`\n    返回与给定名称对应的条目，如果没有此类条目则返回 `null`。\n*   `InputStream getInputStream(ZipEntry\
  \ ze)`\n    返回给定条目的 `InputStream`。\n*   `String getName()`\n    返回此 ZIP 文件的路径。\n\
  \n#### 2.3 对象输入输出流与序列化\n\n要保存对象数据，你首先需要打开一个 `ObjectOutputStream` 对象：\n\n![images](img/img_p111-1.png)\n\
  \n\n\n\n\n现在，要保存一个对象，只需如下片段所示，使用 `ObjectOutputStream` 类的 `writeObject` 方法：\n\n![images](img/img_p111-2.png)\n\
  \n要将对象读回来，首先获取一个 `ObjectInputStream` 对象：\n\n![images](img/img_p111-3.png)\n\n然后，使用\
  \ `readObject` 方法按照写入时的相同顺序检索对象：\n\n![images](img/img_p111-4.png)\n\n然而，对于任何你想要保存到输出流并从对象输入流恢复的类，你都需要进行一处更改。该类必须实现\
  \ `Serializable` 接口：\n\n![images](img/img_p111-5.png)\n\n`Serializable` 接口没有方法，因此你不需要以任何方式对你的类进行更改。在这方面，它与我们在第一卷第\
  \ 5 章中讨论的 `Cloneable` 接口相似。但是，要使一个类可克隆，你仍然需要重写 `Object` 类的 `clone` 方法。而要使一个类可序列化，你不需要做任何其他操作。\n\
  \n### 注意\n![images](img/note.png)\n\n你只能使用 `writeObject`/`readObject` 方法读写对象。对于基本类型值，请使用如\
  \ `writeInt`/`readInt` 或 `writeDouble`/`readDouble` 等方法。（对象输入/输出流类实现了 `DataInput`/`DataOutput`\
  \ 接口。）\n\n在后台，`ObjectOutputStream` 查看对象的所有字段并保存其内容。例如，在写入一个 `Employee` 对象时，名称、日期和薪水字段会被写入输出流。\n\
  \n然而，有一个重要的情况需要考虑：当一个对象作为多个对象状态的一部分被多个对象共享时，会发生什么？\n\n为了说明这个问题问题，让我们对 `Manager`\
  \ 类进行细微修改。假设每个经理都有一个秘书：\n\n![images](img/img_p112-1.png)\n\n每个 `Manager` 对象现在包含一个指向描述秘书的\
  \ `Employee` 对象的引用。当然，两个经理可以共享同一个秘书，如图 2.5 以及后续代码所示：\n\n![images](img/img_p112-2.png)\n\
  \n保存这样一个对象网络是一项挑战。当然，我们无法保存并恢复秘书对象的内存地址。当对象被重新加载时，它可能会占用一个与原始完全不同的内存地址。\n\n相反，每个对象都是带有一个序列号保存的——因此这种机制被称为*对象序列化*（object\
  \ serialization）。以下是算法：\n\n1. 为你遇到的每个对象引用关联一个序列号（如图 2.6 所示）。\n2. 当第一次遇到对象引用时，将对象数据写入输出流。![images](img/img_p113.png)\n\
  \   **图 2.5** 两个经理可以共享同一个员工。\n3. 如果之前保存过，只需写入“与之前保存的序列号为 `x`的对象相同”。\n\n当读回对象时，过程是反的。\n\
  \n1. 当对象输入流中第一次指定某个对象时，构造它，用流数据对其初始化，并记住序列号与对象引用之间的关联。\n2. 当遇到标记“与之前保存的序列号为 `x`的对象相同”时，检索该序列号的对象引用。\n\
  \n### 注意\n![images](img/note.png)\n\n在本章中，我们将使用序列化将一组对象保存到磁盘文件中，并完全按照我们存储的方式将其检索回。另一个非常重要的应用是跨网络连接将一组对象传输到另一台计算机。正就像原始内存地址在文件中没有意义一样，当你与不同的处理器通信时，它们也是没有意义。通过将内存地址替换为序列号，序列化允许对象集合从一台机器传输到另一台机器。\n\
  \n![images](img/img_p114.png)\n\n**图 2.6** 对象序列化的示例\n\n### 警告\n![images](img/caution.png)\n\
  \n正如你在下一节中看到的，对象流包含了所有序列化对象的类名、超类名和字段。对于内部类，这些名称某些是由编译器合成的，且命名约定可能会在编译器之间发生变化。如果发生这种情况，反序列化将失败。因此，在序列化内部类时需要小心。\n\
  \n静态内部类（包括内部枚举和记录）序列化是安全的。\n\n代码列表 2.3 是一个保存并重新加载 `Employee` 和 `Manager` 对象网络的程序（其中某些对象共享同一个员工作为秘书）。注意，秘书对象在重新加载后是唯一的——当\
  \ `newStaff[1]` 加薪时，这会反映在经理的秘书字段中。\n\n**代码列表 2.3** serial/ObjectStreamTest.java\n\
  \n![images](img/img_p115.png)\n\n#### java.io.ObjectOutputStream 1.1\n\n*   `ObjectOutputStream(OutputStream\
  \ out)`\n    创建一个 `ObjectOutputStream`，以便你可以向指定的 `OutputStream` 写入对象。\n*   `void\
  \ writeObject(Object obj)`\n    将指定的对象写入 `ObjectOutputStream`。此方法保存对象的类、类的签名以及该类任何非静态瞬态字段的值。\n\
  \n#### java.io.ObjectInputStream 1.1\n\n*   `ObjectInputStream(InputStream in)`\n\
  \    创建一个 `ObjectInputStream`，以便从指定的 `InputStream` 读取对象信息。\n*   `Object readObject()`\n\
  \    从 `ObjectInputStream` 读取一个对象。特别地，该方法读取对象的类、类的签名以及该类的非静态瞬态字段。它执行反序列化，以便恢复多个对象引用。\n\
  \n###  2.3.2 理解对象序列化格式\n\n对象序列化以特定的文件格式保存对象数据。当然，你可以直接使用 `writeObject`/`readObject`\
  \ 方法，而无需知道表示对象的字节序列。尽管如此，我们发现研究数据格式对于洞察序列化过程非常有帮助。由于细节具有某些技术性，如果你感兴趣，可以跳过本节。\n\n\
  每个文件都以两个字节的“魔数”开始\n\n![images](img/img_p116-1.png)\n\n随后是对象序列化格式的版本号，当前为\n\n![images](img/img_p116-2.png)\n\
  \n（在本节中我们使用十六进制数表示字节。）接着，它包含了按保存顺序的对象序列。\n\n字符串对象保存为：\n\n*   `72`\n*   双字节长度\n*\
  \   修改 UTF-8 格式的字符\n\n例如，字符串“Harry”保存为：\n\n![images](img/img_p117-1.png)\n\n当保存对象时，该对象的类也必须被保存。类描述符具有以下格式：\n\
  \n*   `72`\n*   类名的双字节长度\n*   类名\n*   8 字节指纹\n*   1 字节标志位\n*   2 字节实例字段描述符计数\n*\
  \   实例字段描述符\n*   `78`（结束标记）\n*   超类描述符（无则为 70）\n\n指纹是通过对类、超类、接口、字段类型和方法签名的描述进行规范化排序，然后对该数据应用安全哈希算法\
  \ 1（SHA-1）得到的。\n\n\n\n\n\n`SHA-1` 为数据块数据提供了一个“指纹”。无论原始数据的大小如何，这个指纹始终是一个 20 字节的数据包。它是通过对数据进行一系列巧妙的位操作创建的，这使得一旦信息发生任何变化，指纹都极有可能发生改变。序列化机制仅使用\
  \ `SHA-1` 代码的前八个字节作为类指纹。如果实例字段或方法发生变化，类指纹极有可能也会发生改变。\n\n在读取对象时，会将它的指纹与类的当前指纹进行比较。如果它们不匹配，意味着在对象写入之后类定义发生了变化，此时会生成一个异常。当然，在实践中，类确实会演变，程序可能需要读取旧版本的对象。我们将在第\
  \ 107 页的 2.3.5 节“版本控制”中讨论这个问题。\n\n标志字节由 `java.io.ObjectStreamConstants` 中定义的位掩码组成，见表\
  \ 2.3。\n\n**表 2.3** 位掩码\n\n![images](img/img_p118-1.png)\n\n我们编写的类实现了 `Serializable`\
  \ 接口，其标志值为 `02`。可序列化的 `java.util.Date` 类定义了自己的 `readObject`/`writeObject` 方法，其标志值为\
  \ `03`。我们将在本章稍后部分讨论 `Externalizable` 接口。\n\n每个实例字段描述符的格式如下：\n\n*   1 字节类型代码\n* \
  \  2 字节字段名长度\n*   字段名\n*   类名（如果字段是对象）\n\n类型代码是以下内容之一：\n\n![images](img/img_p118-2.png)\n\
  \n当类型代码为 `L` 时，字段名后面跟着字段类型。类名和字段名字符串不以字符串代码 `74` 开头，但字段类型是。字段类型对其名称使用略有不同的编码方式——即原生方法使用的格式。\n\
  \n例如，`Employee` 类的 `salary` 字段编码为：\n\n![images](img/img_p119-1.png)\n\n这里是 `Employee`\
  \ 类的完整类描述符，包含在我们示例程序的 `serial` 包中：\n\n![images](img/img_p119-2.png)\n\n这些描述符相当长。如果文件中再次需要*相同的*类描述符，则会使用缩写形式：\n\
  \n*   `71`\n*   4 字节序列号\n\n序列号指向上一个显式类描述符。我们将在稍后讨论该编号方案。\n\n对象的存储格式为：\n\n*   `73`\n\
  *   类描述符\n*   对象数据\n\n例如，这里是 `Employee` 对象的实例字段的存储方式：\n\n![images](img/img_p119-3.png)\n\
  \n如你所见，数据文件包含了恢复 `Employee` 对象所需的信息。（在本例中，我们将 `hireday` 存储为 `Date` 而不是 `LocalDate`，因为\
  \ `LocalDate` 类的序列化更为复杂。）\n\n数组按以下格式保存：\n\n*   `75`\n*   类描述符\n*   4 字节元素数量\n* \
  \  元素\n\n类描述符中的数组类名与原生方法使用的格式相同（这与其它类描述符中类名使用的格式略有不同）。在这种格式下，类名以 `L` 开头并以分号结尾。\n\
  \n例如，包含三个 `Employee` 对象的数组起始如下：\n\n![images](img/img_p120-1.png)\n\n注意，`Employee`\
  \ 对象数组的指纹与 `Employee` 类本身的指纹是不同的。\n\n所有对象（包括数组和字符串）以及所有类描述符在保存到输出文件时都会赋予序列号。这些数字从\
  \ `00 7E 00 00` 开始。\n\n我们已经看到，任何给定类的完整类描述符只出现一次。后续的描述符会引用它。例如，在我们之前的示例中，对 `Date`\
  \ 类的重复引用编码为：\n\n![images](img/img_p120-2.png)\n\n对象也使用相同的机制。如果写入了对之前保存的对象的引用，它将以完全相同的方式保存——即\
  \ `71` 后跟序列号。从上下文始终清楚地判断特定的序列引用表示的是类描述符还是对象。\n\n某些类（如 `Date` 类）在不透明的二进制块中存储对象状态，编码为：\n\
  \n*   `77`（短块）或 `7A`（长块）\n*   1 字节或 4 字节块长度\n*   块内容\n*   `78`\n\n最后，空引用被存储为\n\n\
  ![images](img/img_p121-1.png)\n\n这里是上一节 `ObjectStreamTest` 程序的注释输出。运行该程序，查看其数据文件\
  \ `employee.ser` 的十六进制转储，并将其与带的列表进行比较。最重要的行位于输出的末尾。它们显示了对之前保存对象的引用。\n\n![images](img/img_p121-2.png)![images](img/img_p122.png)\n\
  \n当然，研究这些代码的趣味性可能和读电话字典差不多。不需要了解确切的文件格式（除非你试图通过修改数据来产生副作用），但了解序列化格式包含的所有对象仍然是有益的。\n\
  \n#### 2.3.3 修改默认序列化\n\n某些实例字段永远不应该序列化——例如，指向文件的句柄或仅对原生方法有效的值。当你重新加载对象或将其传输到不同的机器时，这些信息是无用的。此外，对象为了效率经常存储缓存值。这些值没有需要保存。Java\
  \ 有种简单的方法防止字段被序列化：将它们标记为 `transient`。如果字段属于不可序列化的类，也需要将其标记为 `transient`。当对象序列化时，`transient`\
  \ 字段会被跳过。\n\n![images](img/note.png) 注意\n\n如果序列化类的父类不可序列化，它必须有一个可访问的无参构造函数。考虑这个例子：\n\
  \n当 `Employee` 对象被反序列化时，它的实例字段是从对象输入流读取的，但 `Person` 的实例字段是通过 `Person` 构造函数设置的。\n\
  \n序列化机制为单个类自定义读写行为提供了方法。可序列化类可以定义签名如下的方法：\n\n![images](img/img_p123-2.png)\n\n此时实例字段不再自动序列化——而是调用这些方法。注意\
  \ `@Serial` 注解。调整序列化的方法不属于接口。因此，你无法使用 `@Override` 注解让编译器检查方法声明。`@Serial` 注解旨在为序列化方法启用相同的检查。在\
  \ Java 17 之前，`javac` 编译器不进行此类检查，但未来可能会改变。IntelliJ IDE 使用该注解。\n\n这里有一个自定义的典型示例。`java.awt.geom`\
  \ 包中的许多类（例如 `Point2D.Double`）不可序列化。现在，假设你想序列化一个包含 `String` 和 `Point2D.Double` 的\
  \ `LabeledPoint` 类。首先，你需要将 `Point2D.Double` 字段标记为 `transient` 以避免出现 `NotSerializableException`。\n\
  \n![images](img/img_p124-1.png)\n\n\n\n\n\n在 `writeObject` 方法中，首先通过调用 `defaultWriteObject`\
  \ 方法写入对象描述和 `String` 字段、标签。这是 `ObjectOutputStream` 类的一个特殊方法，只能在可序列化类的 `writeObject`\
  \ 方法内部调用。然后，我们使用标准的 `DataOutput` 调用写入点坐标。\n\n![images](img/img_p124-2.png)\n\n在\
  \ `readObject` 方法中，我们反向执行该过程：\n\n![images](img/img_p124-3.png)\n\n另一个例子是 `HashSet`\
  \ 类，它提供了自己的 `readObject` 和 `writeObject` 方法。`writeObject` 方法并没有保存哈希表的内部结构，而是保存了容量（capacity）、负载因子（load\
  \ factor）、大小（size）和元素。`readObject` 方法读取容量和负载因子，构建一个新表并插入元素。\n\n`readObject` 和 `writeObject`\
  \ 方法只需要保存和加载它们的数据。它们不关心父类数据或任何其他类信息。\n\n`Date` 类使用了这种方法。它的 `writeObject` 方法保存了自“纪元”（1970\
  \ 年 1 月 1 日）以来的毫秒数。缓存日历数据的结构并没有被保存。因此，第 94 页 2.3.2 节“理解对象序列化文件格式”中的序列化 `Date` 实例由一个透明的数据块组成。\n\
  \n### ![images](img/caution.png) 注意\n\n就像构造函数一样，`readObject` 方法是在部分初始化的对象上运行。如果你在\
  \ `readObject` 内部调用了一个在子类重写的非 final 方法，它可能会访问未初始的数据。\n\n### ![images](img/note.png)\
  \ 注意\n\n如果一个可序列化类定义了一个字段：\n\n![images](img/img_p125-1.png)\n\n那么序列化将使用这些字段描述符，而不是非\
  \ transient 非 static 的字段。还有一个 API 可以在序列化之前设置字段值，或在反序列化之后读取这些值。这对于在类演进后保留旧布局非常有用。例如，`BigDecimal`\
  \ 类使用这种机制将其实例序列化为一种不再反映实例字段的格式。\n\n与其让序列化机制保存和恢复对象数据，类可以定义自己的机制。要做到这一点，类必须实现 `Externalizable`\
  \ 接口。这反要求它定义两个方法：\n\n![images](img/img_p125.png)\n\n与 `readObject` 和 `writeObject`\
  \ 方法不同，这些方法完全负责保存和恢复整个对象，包括父类数据。在写入对象时，序列化机制仅在输出流中记录对象的类。在读取一个 externalizable 对象时，对象输入流会使用无参数构造函数创建一个对象，然后调用\
  \ `readExternal` 方法。\n\n你可以加密数据，或者使用比序列化格式更高效的格式。\n\n在这个示例中，`LabeledPixel` 类继承了可序列化的\
  \ `Point` 类，但它接管了类及其父类的序列化。对象的字段没有存储在标准的序列化格式中。相反，数据被放置在一个透明块中。\n\n![images](img/img_p126.png)\n\
  \n### ![images](img/caution.png) 注意\n\n与私有的且只能由序列化机制调用的 `readObject` 和 `writeObject`\
  \ 方法不同，`readExternal` 和 `writeExternal` 方法是公共的。特别是 `readExternal` 可能会允许修改现有对象的状态。\n\
