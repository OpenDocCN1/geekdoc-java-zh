  \ telnet 访问 HTTP 端口\n\n这与你的 浏览器获取网页的过程完全相同。它使用 HTTP 从服务器请求网页。当然，浏览器显示 HTML 的方式更漂亮。\n\
  \n#### ![images](img/note.png) **注意**\n\n当你连接到托管多个域名的 Web 服务器时，`Host` 键值对是必须。如果服务器只托管一个域名，可以省略它。\n\
  \n#### 8.1.2 使用 Java 连接服务器\n\n我们在代码列表 8.1 中的第一个网络程序将执行我们使用 `telnet` 所的操作——连接到端口并打印它发现的内容。\n\
  \n**代码列表 8.1** socket/SocketTest.java\n\n![images](img/img_p473-1.png)\n\n这个简单程序的关键语句是：\n\
  \n![images](img/img_p473-2.png)\n\n```\n第一行打开一个 socket，它是一种允许程序进行入站通信的网络软件抽象。我们将远程地址和端口传递给\
  \ socket 构造函数。如果连接失败，将抛出 UnknownHostException。如果发生其他问题，会发生 IOException。由于 UnknownHostException\
  \ 是 IOException 的子类，且这是一个示例程序，我们只需要捕获父类即可。\n```\n\n\n\n\n一旦套接字（socket）打开，`java.net.Socket`\
  \ 中的 `getInputStream` 方法将返回一个 `InputStream` 对象，你可以像使用其他流一样使用它。一旦获取了流，此程序只需将每行输入打印到标准输出。这个过程将一直持续，直到流结束且服务器断开连接。\n\
  \n此程序仅适用于非常简单的服务器，例如“时间”服务。在更复杂的网络程序中，客户端会向服务器发送请求数据，而服务器在响应结束时可能不会立即断开。你将在本章的几个示例中看到如何实现这种行为。\n\
  \n`Socket` 类非常悦用且易于操作，因为 Java 库隐藏了建立网络连接和跨越该连接发送数据的复杂性。`java.net` 包本质上为你提供了与处理文件时完全相同的编程接口。\n\
  \n### 注意事项\n![images](img/note.png)\n\n在本书中，我们只涵盖了传输控制协议（TCP）。Java 平台还支持用户数据报协议（UDP），它可以发送数据包（也称为\
  \ `datagrams`），其开销比 TCP 小得多。缺点是，数据包不需要按顺序递送给接收应用程序，甚至可能被完全丢弃。将数据包排序并请求重传丢失的数据包取决于接收方。UDP\
  \ 非常适用于可以容忍丢包的应用程序——例如音频或视频流或连续测量。\n\n### java.net.Socket 1.0\n\n*   `Socket(String\
  \ host, int port)`：构造一个连接到给定主机和端口的套接字。\n*   `InputStream getInputStream()`\n*  \
  \ `OutputStream getOutputStream()`：获取从套接字读取数据或向套接字写入数据的流。\n\n#### 8.1.3 套接字超时\n\
  从套接字读取数据会阻塞，直到数据可用。如果主机不可访问，你的应用程序将等待很长时间，你只能听凭底层操作系统最终超时。\n\n你可以决定对于你的特定应用程序，什么超时值是合理的。然后，调用\
  \ `setSoTimeout` 方法设置超时值（以毫秒为单位）。\n\n![images](img/img_p474.png)\n\n如果为套接字设置了超时值，当在操作完成工作之前达到超时时，所有后续读取操作都将抛出\
  \ `SocketTimeoutException`。你可以捕获该异常并对超时做出反应。\n\n![images](img/img_p475-1.png)\n\n\
  写操作没有超时设置。\n\n还有一个额外的超时问题需要你处理。构造函数\n\n![images](img/img_p475-2.png)\n\n可能会无限阻塞，直到建立与主机的初始连接。\n\
  \n你可以通过先构造一个未连接的套接字，然后带超时时间连接它来解决这个问题：\n\n![images](img/img_p475-3.png)\n\n请参见第\
  \ 464 页的第 8.2.4 节“可中断套接字”，了解如何允许用户随时中断套接字连接。\n\n### java.net.Socket 1.0\n\n*   `Socket()`\
  \ **1.1**：创建一个尚未连接的套接字。\n*   `void connect(SocketAddress address)` **1.4**：将此套接字连接到给定地址。\n\
  *   `void connect(SocketAddress address, int timeoutInMilliseconds)` **1.4**：将此套接字连接到给定地址，或者在时间间隔过期时返回。\n\
  *   `void setSoTimeout(int timeoutInMilliseconds)` **1.1**：设置在此套接字上读取请求的阻塞时间。如果超时，将抛出\
  \ `SocketTimeoutException`。\n*   `boolean isConnected()` **1.4**：如果套接字已连接则返回 true。\n\
  *   `boolean isClosed()` **1.4**：如果套接字已关闭则返回 true。\n\n### 8.1.4 Internet 地址\n通常，你不需要太担心\
  \ Internet 地址——即由 4 字节（对于 IPv6 则为 16 字节）组成的数值主机地址，例如 `129.6.15.28`。然而，如果你需要在主机名和\
  \ Internet 地址之间转换，可以使用 `InetAddress` 类。\n\n`java.net` 包支持 IPv6 Internet 地址，只要主机操作系统支持即可。\n\
  \n静态方法 `getByName` 返回一个主机的 `InetAddress` 对象。例如，\n\n![images](img/img_p476-1.png)\n\
  \n返回一个封装了四个字节序列 `129.6.15.28` 的 `InetAddress` 对象。你可以通过 `getAddress` 方法访问这些字节。\n\n\
  ![images](img/img_p476-2.png)\n\n某些流量巨大的主机名对应于多个 Internet 地址，以实现负载均衡。例如，在本书编写时，主机名\
  \ `google.com` 对应于十二不同的 Internet 地址。当访问主机时，会随机选取其中一个。你可以通过 `getAllByName` 方法获取所有主机。\n\
  \n![images](img/img_p476-3.png)\n\n最后，你有时需要本地主机的地址。如果你直接请求 `localhost` 的地址，你总是得到本地回环地址\
  \ `127.0.0.1`，其他人无法用它连接到你的计算机。相反，请使用静态方法 `getLocalHost` 获取你本地主机的地址。\n\n![images](img/img_p476-4.png)\n\
