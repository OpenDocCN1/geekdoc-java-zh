  \ 对象表示的预编译 SQL `INSERT`、`UPDATE` 或 `DELETE` 语句。返回受影响的行数，对于 `CREATE TABLE` 等 DDL\
  \ 语句返回 0。\n\n#### 3.5.2 读取和写入 LOB\n\n除了数字、字符串和日期外，许多数据库还可以存储*大对象*（LOBs），例如图像或其他数据。在\
  \ SQL 中，二进制大对象被称为 `BLOBs`，字符大对象被称为 `CLOBs`。\n\n要读取 LOB，请执行一个 `SELECT` 语句并在 `ResultSet`\
  \ 上调用 `getBlob` 或 `getClob` 方法。你将得到一个 `Blob` 或 `Clob` 类型的对象。要从 `Blob` 中获取二进制数据，调用\
  \ `getBytes` 或 `getBinaryStream`。例如，如果你有一张包含书籍封面图像的表，可以这样检索图像：\n\n![images](img/img_p216-1.png)\n\
