  \ 的构造函数中选择一个特定的编码，例如：\n\n![images](img/img_p90-2.png)\n\n请见第 75 页的第 2.1.8 节“字符编码”获取更多信息。`Reader`\
  \ 和 `Writer` 类仅有基本的读写方法。\n\n#### 2.1.5 如何写文本\n\n对于文本输出，使用 `PrintWriter`。该类有打印字符串和数字的方法。为了向文件打印，根据文件名和编码构造一个\
