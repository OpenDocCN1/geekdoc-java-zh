  \n\n\n\nJDBC 包可以被看作仅仅向数据库通信 SQL 语句的 API。在本节中，我们将简要介绍 SQL。如果你以前从未见过 SQL，可能会觉得这些材料还不够。如果是如此，请参阅关于该主题的许多学习资源；我推荐\
