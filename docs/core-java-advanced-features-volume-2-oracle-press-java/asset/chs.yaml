  \n### 9.5.3 打印服务\n\n到为止，你已经看到了如何打印 2D 图形。然而，打印 API 提供了更大的灵活性。API 定义了许多数据类型并让你找到能够打印它们的打印服务。数据类型包括\n\
  \n* GIF、JPEG 或 PNG 格式的图像\n* 文本、HTML、PostScript 或 PDF 格式的文档\n* 原始打印机代码\n* 实现 `Printable`、`Pageable`\
  \ 或 `RenderableImage` 的对象\n\n数据本身可以存储在字节或字符源中，例如输入流、URL 或数组。`document flavor`（文档口味）描述了数据源和数据类型的组合。`DocFlavor`\
  \ 类为各种数据源定义了许多内部类。每个内部类都定义了常量来指定口味。例如，常量\n\n![images](img/img_p761-2.png)\n\n描述从输入流读取的\
  \ GIF 图像。表 9.4 列出了这些组合。\n\n**表 9.4** 打印服务的文档口味\n\n![images](img/img_p762.png)\n\n\
