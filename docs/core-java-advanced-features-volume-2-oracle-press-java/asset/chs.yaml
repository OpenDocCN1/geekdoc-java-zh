  \ 页\n\n在本章中，我们将继续讨论第一卷中提到的 Swing 用户界面工具包和 AWT 图形。我们关注同时适用于客户端用户界面和服务器端图形图像生成的技巧。Swing\
  \ 具有用于渲染表格和树的复杂组件。通过 2D 图形 API，你可以生成任意复杂性的矢量艺术。`ImageIO` API 允许你处理位图图像。最后，你可以使用打印\
  \ API 生成打印输出和 PostScript 文件。\n\n## 9.1 表格\n\n`JTable` 组件显示一个对象的二维网格。表格在用户界面中非常常见，Swing\
  \ 团队在表格控件上投入了大量精力。表格本质上是复杂的，但可能比其他 Swing 类更成功——`JTable` 组件隐藏了大部分这种复杂性。你可以通过编写几行代码来创建具有丰富行为的全功能表格。你还可以编写更多代码，为你的特定应用程序自定义显示和行为。\n\
  \n在接下来的节中，我将解释如何创建简单表格、用户如何与它们交互，以及如何进行一些最常见的调整。与其他复杂的 Swing 控件一样，不可能详尽地涵盖所有方面。更多信息，请参阅\
  \ David M. Geary 写的 *Graphic Java^*, Third Edition*(Prentice Hall, 1999）或 Kim Topley\
  \ 写的 *Core Swing*(Prentice Hall, 1999)。\n\n#### 9.1.1 简单表格\n\n`JTable` 不存储自己的数据，而是从\
  \ `table model`（表格模型）获取数据。`JTable` 类有一个构造函数，可以将对象的二维数组封装到默认模型中。这是我们在第一个示例中使用的策略；在本章的后半部分，我们将转向表格模型。\n\
