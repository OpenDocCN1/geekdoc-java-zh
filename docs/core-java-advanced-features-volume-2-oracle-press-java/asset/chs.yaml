  \n你已经了解了如何使用 Java 语言的国际化功能。现在你可以使用资源包（resource bundles）提供多种语言的翻译，并使用格式化器（formatters）和比较器（collators）进行特定特定区域的文本处理。\n\
  \n在下一章中，我们将深入研究脚本、编译和注解处理。\n\n# 第 7 章\n\n## 脚本、编译与注解处理\n\n## 本章内容\n\n* 7.1 Java\
  \ 平台的脚本，第 388 页\n* 7.2 编译器 API，第 400 页\n* 7.3 使用注解，第 411 页\n* 7.4 注解语法，第 419 页\n\
  * 7.5 标准注解，第 426 页\n* 7.6 源码级注解处理，第 432 页\n* 7.7 字节码工程，第 437 页\n\n本章介绍了处理代码的三种技术。脚本\
  \ API 允许你在 JavaScript 或 Groovy 等脚本语言中调用代码。当你想要在应用程序内部编译 Java 代码时，可以使用编译器 API。注解处理器（Annotation\
  \ processors）在包含注解的 Java 源码或类文件上操作。正如你将看到的，注解处理有许多应用，从简单的诊断到“字节码工程”——向类文件中插入字节码，甚至运行程序。\n\
  \n## 7.1 Java 平台的脚本\n\n脚本语言是一种通过在运行时解释程序文本来避免通常“编辑/编译/链接/运行”循环的语言。脚本语言具有许多优势：\n\n\
  * 快速迭代，鼓励实验\n* 更改运行中程序的行为\n* 允许程序用户进行自定义\n\n另一方面，大多数脚本语言缺乏对开发复杂应用程序有利的特性，例如强类型、封装和模块化。\n\
  \n因此，将脚本和传统语言的优势结合起来是非常吸引人的。脚本 API 允许你在 Java 平台上实现这一点。它使能够从 Java 程序中调用用 JavaScript、Groovy、Ruby\
  \ 甚至像 Scheme 和 Haskell 等冷门语言编写的脚本。例如，Renjin 项目（[www.renjin.org](http://www.renjin.org)）提供了\
  \ R 语言语言的 Java 实现（R 语言常用于统计编程），并带有脚本 API 的“引擎”。\n\n在接下来的章节中，我将向你展示如何为特定语言选择引擎、如何执行脚本以及如何利用某些脚本提供的高级功能。\n\
  \n### 7.1.1 获取脚本引擎\n\n脚本语言通过在运行时解释程序文本来避免通常的编辑/编译/链接/运行循环。脚本语言具有许多优势：\n\n* 快速迭代，鼓励实验\n\
  * 更改运行中程序的行为\n* 允许程序用户进行自定义\n\n另一方面，大多数脚本语言缺乏对开发复杂应用程序有利的特性，例如强类型、封装和模块化。\n\n因此，将脚本和传统语言的优势结合起来是非常吸引人的。脚本\
  \ API 允许你在 Java 平台上实现这一点。它使能够从 Java 程序中调用用 JavaScript、Groovy、Ruby 甚至像 Scheme 和 Haskell\
  \ 等冷门语言编写的脚本。例如，Renjin 项目（[www.renjin.org](http://www.renjin.org)）提供了 R 语言的 Java\
  \ 实现（R 语言常用于统计编程），并带有脚本 API 的“引擎”。\n\n在接下来的章节中，我将向你展示如何为特定语言选择引擎、如何执行脚本以及如何利用某些脚本提供的高级功能。\n\
  \n要找到你需要的引擎，请查看 表 7.1 的典型值。\n\n**表 7.1** 引擎的属性\n\n![images](img/img_p410.png)\n\n\
