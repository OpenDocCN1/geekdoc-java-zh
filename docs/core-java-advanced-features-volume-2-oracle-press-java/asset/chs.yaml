  \ 操作，因为它会替换图形上下文可能具有任何现有变换。例如，用于横向打印的图形上下文已经包含了一个 90 度旋转变换。如果你调用 `setTransform`，你就会抹掉那个旋转。相反，请调用\
  \ `transform` 方法。\n\n![images](img/img_p699-4.png)\n\n它将现有变换与新的 `AffineTransform`\
  \ 对象组合在一起。\n\n如果你只想临时应用某种变换，先获取旧变换，将其与新变换组合，并在完成后恢复旧变换。\n\n![images](img/img_p699-5.png)\n\
