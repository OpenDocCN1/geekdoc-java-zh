  \n除了引擎作用域外，还有一个全局作用域。任何添加到 `ScriptEngineManager` 的绑定对所有引擎都是可见的。\n\n与其将绑定添加到引擎或全局作用域，可以将它们收集在\
  \ `Bindings` 对象中并传递给 `eval` 方法：\n\n![images](img/img_p412.png)\n\n#### ![images](img/note.png)\
