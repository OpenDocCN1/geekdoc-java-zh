  \n### 11.10 完整示例：访问注册表\n\n在本节中，我们描述了一个完整的工作示例，涵盖了本章讨论的所有内容：使用原生方法处理字符串、数组、对象以及错误处理。我们将从\
  \ Java 代码中访问注册表，并用原生代码实现该接口。该接口仅允许少数注册表操作；为了减少代码 own，我省略了一些重要的操作，如添加、删除和枚举键。（很容易添加剩余的注册表\
  \ API 函数。）\n\n#### 11.10.1 Windows 注册表概述\n\nWindows 注册表是一个存储操作系统和应用程序配置信息的仓库。它为管理和备份提供了单一点。缺点是注册表也是一个单点故障——如果你弄乱了注册表，计算机可能会故障甚至无法启动！\n\
  \n我们不建议使用注册表来存储程序的参数。Preferences API 是更好的解决方案（参见第一卷第 9 章）。我们将仅仅使用注册表。\n\n查看注册表的主要工具是注册表编辑器。由于用户可能会出错，因此没有启动它的图标。相反，启动\
  \ DOS shell（或打开运行对话框）并输入 `regedit`。图 11.4 显示了注册表编辑器的操作。\n\n![images](img/img_po47-1.png)\n\
  \n**图 11.4** 注册表编辑器\n\n左侧显示键，以树形结构排列。注意每个键都以 HKEY 节点开头，例如：\n\n![images](img/img_po47-2.png)\n\
  \n右侧显示与特定键关联的名称/值对。例如，如果你安装了 Java 17，键\n\n![images](img/img_po48-1.png)\n\n包含如下的名称/值对：\n\
  \n![images](img/img_po48-2.png)\n\n在这种情况下，值是一个字符串。值也可以是整数或字节数组。\n\n#### 11.10.2\
  \ 用于访问注册表的 Java 接口\n\n我们创建一个简单的接口来从 Java 代码访问注册表，然后用原生代码实现该接口。该接口仅允许少数注册表操作；为了保持代码体积，我省略了一些重要的操作，如添加、删除和枚举键。（添加剩余的功能很容易。）\n\
  \n即使使用我们提供的有限子集，你也可以：\n\n*   枚举键中存储的所有名称\n*   读取与名称关联的值\n*   设置与名称关联的值\n\n这里是封装了注册表键的\
  \ Java 类：\n\n![images](img/img_po48-3.png)\n\n\n\n\n`names` 方法返回一个包含与该键存储的所有名称的枚举器。你可以通过熟悉的\
  \ `hasMoreElements`/`nextElement` 方法来获取它们。`getValue` 方法返回一个字符串、`Integer` 对象或字节数组（`byte\
  \ array`）的对象。`setValue` 方法的 `value` 参数也必须是这三种类型之一。\n\n### 11.10.3 以原生方法形式实现注册表访问函数\n\
  \n我们需要实现三个操作：\n\n*   获取名称的值\n*   设置名称的值\n*   遍历键的名称\n\n在本章中，你基本上已经学习了所需的所有工具，例如\
  \ Java 字符串、数组与 C 语言数组之间的转换。你还了解了如何在发生错误时抛出 Java 异常。\n\n两个问题使得这些原生方法比之前的示例更复杂。`getValue`\
  \ 和 `setValue` 方法处理 `Object` 类型，该类型可以是 `String`、`Integer` 或 `byte[]` 之一。枚举器对象存储了连续调用\
  \ `hasMoreElements` 和 `nextElement` 之间的状态。\n\n让我们先看 `getValue` 方法。该方法（显示在 Listing\
  \ 11.22）遵循以下步骤：\n\n1.  打开注册表键。为了读取其值，注册表 API 要求键必须打开。\n2.  查询与名称关联的类型和大小。\n3.  将数据读入缓冲区。\n\
  4.  如果类型是 `REG_SZ`（字符串），调用 `NewStringUTF` 使用值数据创建一个新的新字符串。\n5.  如果类型是 `REG_DWORD`（32\
  \ 位整数），则调用 `Integer` 构造函数。\n6.  如果类型是 `REG_BINARY`，调用 `NewByteArray` 创建一个新的字节数组，然后调用\
  \ `SetByteArrayRegion` 将值数据拷贝到字节数组中。\n7.  如果类型不是上述这些，或者在调用 API 函数时发生错误，则抛出异常并释放到为止已的所有资源。\n\
  8.  关闭键并返回已创建的对象（`String`、`Integer` 或 `byte[]`）。\n\n如你所示，这个示例很好地说明了如何生成不同类型的 Java\
  \ 对象。\n\n在这个原生方法中，处理泛型返回类型并不困难。`jstring`、`jobject` 或 `jarray` 引用只需作为 `jobject` 返回。然而，`setValue`\
  \ 方法接收一个 `Object` 引用，必须确定该 `Object` 的精确类型，以便将 `Object` 保存为字符串、整数或字节数组。我们可以通过查询值对象的类、找到\
  \ `java.lang.String`、`java.lang.Integer` 和 `byte[]` 的类引用，并与 `IsAssignableFrom` 函数进行比较来进行此判断。\n\
  \n如果 `class1` 和 `class2` 是两个类引用，那么调用\n\n![images](img/img_po50-1.png)\n\n当 `class1`\
  \ 和 `class2` 是同一个类或 `class1` 是 `class2` 的子类时，返回 `JNI_TRUE`。在任何情况下，指向 `class1` 对象的引用都可以强制转换为\
  \ `class2`。例如，当\n\n![images](img/img_po50-2.png)\n\n为真时，我们知道 `value` 是字节数组。\n\n\
  以下是 `setValue` 方法步骤的概述：\n\n1.  以写入模式打开注册表键。\n2.  找到要写入值的类型。\n3.  如果类型是 `String`，调用\
  \ `GetStringUTFChars` 获取字符指针。\n4.  如果类型是 `Integer`，调用 `intValue` 方法获取包装对象存储的整数。\n\
  5.  如果类型是 `byte[]`，调用 `GetByteArrayElements` 获取字节指针。\n6.  将数据和长度传递给注册表。\n7.  关闭键。\n\
  8.  如果类型是 `String` 或 `byte[]`，释放数据指针。\n\n最后，让我们转向枚举键的原生方法。这些方法是 `Win32RegKeyNameEnumeration`\
  \ 类的方法（参见 Listing 11.21）。当枚举过程开始时，我们必须打开键。在枚举期间，我们必须保留键句柄——也就是说，键句柄必须与枚举对象一起。键句柄类型为\
  \ `DWORD`（32 位数值），因此它可以存储在 Java 整数中。将其存储在枚举类的 `hkey` 字段中。当枚举开始时，使用 `SetIntField`\
  \ 初始化字段。随后的调用通过 `GetIntField` 读取值。\n\n在这个示例中，我们与枚举对象一起存储了另外三个数据项。当枚举启动时，我们可以查询注册表获取名称/值对的计数和最长名称的长度，我们需要这些来分配\
  \ C 字符数组以存储名称。这些值存储在枚举对象的 `count` 和 `maxsize` 字段中。最后，`index` 字段初始化为 `-1` 以表示枚举开始，一旦其他实例字段初始化，将其设置为\
  \ `0`，并在每个枚举步骤后递增。\n\n让我们过一遍支持枚举的原生方法。`hasMoreElements` 方法很简单：\n\n1.  获取 `index`\
  \ 和 `count` 字段。\n2.  如果 `index` 为 `-1`，调用 `startNameEnumeration` 函数，该函数打开键、查询计数和最大长度，并初始化\
  \ `hkey`、`count` 和 `index` 字段。\n3.  如果 `index` 小于 `count`，返回 `JNI_TRUE`，否则返回 `JNI_FALSE`。\n\
  \n`nextElement` 方法需要稍微一点：\n\n1.  获取 `index` 和 `count` 字段。\n2.  如果 `index` 为 `-1`，调用\
  \ `startNameEnumeration` 函数，该函数打开键、查询计数和最大长度，并初始化 `hkey`、`count` 和 `index` 字段。\n\
  3.  如果 `index` 小于 `count`，返回 `JNI_TRUE`，否则返回 `JNI_FALSE`。\n\n\n\n\n在 Java 17 中，该\
  \ API 是一个预览特性，其细节在正式发布之前将会发生变化。列表 11.24 中的程序是该预览 API 的一个简单演示。\n\n该程序简单地调用了 `printf`\
  \ 函数。不需要额外的 C 代码。该函数通过 Java `MethodHandle` 被调用，而它通常用于调用 Java 函数。\n\n要访问 C 函数，你首先需要创建一个\
  \ `CLinker` 对象。在给定 C 函数地址和类型描述的情况下，`CLinker` 可以为 C 函数生成 Java 方法句柄。由于此 API 的细节仍在变动中，我们就不对其进行过多纠结了。\n\
  \n该 API 拥有一些方法，可以将 Java 对象转换为内存块，你可以将这些内存块传递给 C 函数。在演示中，你需要提供一个带有 Java `String`\
  \ 字符的 `char*`。`CLinker` 提供了这种转换。\n\n内是在 `ResourceScope` 中分配的，以便管理释放。在这里，我们使用 `confined`\
  \ 作用范围。它是自动关闭的（autocloseable），`close` 方法会释放所有分配的内存。\n\n正如你所看到的，此 API 比 JNI 要简单且方便得多。这个演示只是该\
  \ API 的一角。有很多方法用于读取、写入和管理内存块。你还可以将 Java 函数作为回调传递给 C 函数。\n\n要编译演示程序，请使用以下选项：\n\n\
  ![images](img/img_po63-1.png)\n\n外部函数和内存 API 固有是不安全的，因为它提供了对未托管内存的访问。你使用运行时标志来允许模块使用该\
  \ API。通常，人们会将 Java API 和 C 库之间的桥接代码放在单独的模块中。然而在演示中，原生访问发生在未命名模块中。以下是运行它的命令行：\n\n\
  ![images](img/img_po63-2.png)\n\n目前，你仍然需要使用 JNI 作为与原生代码交互的稳定 API。随着外部函数和内存 API 的成熟，它将成为\
  \ JNI 的卓越替代品。\n\n**列表 11.24** `panama/PanamaDemo.java`\n\n![images](img/img_po63-3.png)\n\
