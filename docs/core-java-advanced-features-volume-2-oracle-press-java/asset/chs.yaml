  *   5.7 与遗留代码交互\n\n## 5.1 时间线\n\n历史上，基本的时间单位——秒——源自地球的自转。一次完全自转有 24 小时 × 60 分钟 ×\
  \ 60 秒，因此定义秒似乎只是天文测量问题。然而，地球会发生微小波动，因此需要更精确的定义。1967 年，一种与历史定义相匹配的精确秒定义源自铯原子的固有属性。从那时起，原子钟网络维持着官方时间。\n\
  \n每隔一段时间，官方计时者会将绝对时间与地球自转同步。最初，官方秒会进行微调，但从 1972 年开始，偶尔插入“闰秒”。\n\nJava 日期和时间 API\
  \ 规范要求 Java 使用的时间尺度：\n\n*   每天有 86,400 秒\n*   在每天中午时分精确匹配官方时间\n*   在其他时间以精确定义的方式接近它\n\
  \n\n\n\n在 Java 中，`Instant` 表示时间线上的一个点。一个称为 `epoch`（纪元）的原点被任意设置为 1970 年 1 月 1 日午夜，即通过伦敦格林威治皇家天文台的午子线。这与\
  \ UNIX/POSIX 时间使用的约定相同。从该起点开始，时间以每天 86,400 秒的速度向前或向后测量，精确到纳秒。`Instant` 的值可以追溯到十亿年前（`Instant.MIN`）。这对于表达宇宙的年龄（约\
  \ 135 亿年）尚不足，但对于所有实际目的已经足够了。毕竟在十亿年前，地球被冰覆盖，居住着今天植物动物的微型祖先。最大值 `Instant.MAX` 是 1,000,000,000\
  \ 年的 12 月 31 日。\n\n静态方法调用 `Instant.now()` 获取当前时态。你可以像常一样使用 `equals` 和 `compareTo`\
  \ 方法比较两个时态，因此你可以将时态用作时间戳。\n\n要找出两个时态之间的差异，请使用静态方法 `Duration.between`。例如，这里是你可以测量算法运行时间的方法：\n\
  \n![images](img/img_p329-1.png)\n\n`Duration` 是两个时态之间的时间量。你可以通过调用 `toNanos`、`toMillis`、`toSeconds`、`toMinutes`、`toHours`\
  \ 或 `toDays` 以常规单位获取 `Duration` 的长度。\n\n#### ![images](img/note.png) **注意**\n\n\
  在 Java 8 中，你必须调用 `getSeconds` 而不是 `toSeconds`。\n\n如果你需要纳秒级精度，请注意溢出。一个 `long` 值可以存储近\
  \ 300 年的纳秒。如果你的持续时间短于此，只需将其转换为纳秒即可。你可以使用更长的持续时间——`Duration` 对象在 `long` 中存储秒数，在额外的\
  \ `int` 中存储纳秒数。`Duration` API 有许多方法（在本节末尾显示）用于执行算术。\n\n例如，如果你想检查一个算法是否至少比另一个快十倍，你可以计算：\n\
  \n![images](img/img_p329-2.png)\n\n这只是为了展示语法。由于算法不会运行几百年，你可以简单地使用：\n\n![images](img/img_p329-3.png)\n\
  \n#### ![images](img/note.png) **注意**\n\n`Instant` 和 `Duration` 类是不可变的，且所有方法（如 `multipliedBy`\
  \ 或 `minus`）都会返回一个新实例。\n\n在 Listing 5.1 中的示例程序中，你可以看到如何使用 `Instant` 和 `Duration`\
  \ 类对两个算法进行计时。\n\n**列表 5.1** `timeline/TimeLine.java`\n\n![images](img/img_p330.png)\n\
  \n#### **java.time.Instant** **8**\n\n*   `static Instant now()`\n    从最佳可用系统时钟获取当前时态。\n\
  *   `Instant plus(TemporalAmount amountToAdd)`\n*   `Instant minus(TemporalAmount\
  \ amountToSubtract)`\n    返回一个与此 `Instant` 相差给定数量的时态。`Duration` 和 `Period` 类（参见\
