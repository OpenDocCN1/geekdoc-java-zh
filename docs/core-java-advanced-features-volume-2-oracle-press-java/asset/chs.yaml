  \ 的在线书籍 *Learn SQL The Hard Way*。\n\n你可以将数据库认为是一组带有行和列的命名表。每一列都有一个 `column name`。每行都包含一组相关数据。\n\
  \n作为本书的示例数据库，我们使用了一组描述经典计算机科学书籍的数据库表（参见表 3.1 到 3.4））。\n\n**表 3.1** 作者表 (Authors\
