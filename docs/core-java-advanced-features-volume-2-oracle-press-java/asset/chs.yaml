  \ BLOB 或 CLOB。\n\n#### 3.5.3 SQL 转义\n\n“转义”语法功能被许多数据库支持，但存在变体。JDBC 驱动的职责是将转义语法翻译为特定数据库的语法。\n\
  \n以下内容提供了转义：\n\n*   日期和时间字量\n*   调用标量函数\n*   调用存储过程\n*   外连接\n*   LIKE 子句中的转义字符\n\
  \n日期时间字量在不同数据库之间差异巨大。嵌入日期时间字量时，请指定 ISO 8601 格式（[www.cam.ac.uk/~mgk25/iso-time.html](http://www.cam.ac.uk/~mgk25/iso-time.html)）。驱动程序随后将其转换为原生格式。使用\
  \ `d`、`t`、`ts` 表示 `DATE`、`TIME` 或 `TIMESTAMP` 值。\n\n标量函数是返回单个值的函数。许多函数在数据库中可用，但名称不同。JDBC\
  \ 提供了标准名称并进行翻译。调用函数时，像这样嵌入标准函数名和参数：\n\n两个表的*外连接*并不要求每个表的行都根据连接条件进行匹配。例如，查询\n\n![images](img/img_p218-3.png)\n\
  \n包含了 `Publisher_Id` 在 `Publishers` 表中没有匹配项的书籍，并用 NULL 值表示没有匹配。你需要使用 `RIGHT OUTER\
  \ JOIN` 来包含没有匹配书籍的出版者，或者使用 `FULL OUTER JOIN` 来返回两者。\n\n\n\n最后，`_` 和 `%` 字符在 `LIKE`\
  \ 子句中具有特殊含义——用于匹配单个字符或字符序列。目前没有标准的方法可以以字面形式使用它们。如果你想匹配所有包含 `_` 的字符串，请使用此结构：\n\n\
  ![images](img/img_p219-1.png)\n\n在这里我们将 `!` 定义为转义字符。组合 `!_` 表示字面上的下划线。\n\n`存储过程`（stored\
  \ procedure）是一种在数据库中执行的程序，使用特定数据库的语言编写。要调用存储过程，请使用 `call` 转义字。如果过程没有参数，则不需要提供括号。使用\
  \ `=` 来捕获返回值：\n\n![images](img/img_p219-2.png)\n\n你需要使用 `CallableStatement` 接口来执行存储过程。设置所有输入参数并指定任何输出的类型。\n\
  \n![images](img/img_p219-3.png)\n\n#### 3.5.4 多个结果\n\n查询可能会返回多个结果。这可能发生在执行存储过程时，或者发生在允许在单次查询中提交多个\
  \ `SELECT` 语句的数据库中。以下是检索所有结果集的方法：\n\n1. 使用 `execute` 方法执行 SQL 语句。\n2. 获取第一个结果或更新计数。\n\
  3. 重复调用 `getMoreResults` 方法以移动到下一个结果集。\n4. 当没有更多结果集或更新计数时结束。\n\n如果链中的下一个项是结果集，则\
  \ `execute` 和 `getMoreResults` 方法将返回 `true`。如果链中的下一个项不是更新计数，则 `getUpdateCount` 方法将返回\
  \ `-1`。\n\n以下循环遍历了所有结果：\n\n![images](img/img_p220-1.png)\n\n#### java.sql.Statement\
  \ 1.1\n\n*   `boolean getMoreResults()`\n*   `boolean getMoreResults(int current)`\
  \ **6**\n    获取此语句的下一个结果。当前参数是是 `CLOSE_CURRENT_RESULT`（默认值）、`KEEP_CURRENT_RESULT`\
  \ 或 `CLOSE_ALL_RESULTS` 之一。如果存在下一个结果且是一个结果集，则返回 `true`。\n\n### 3.5.5 获取自动生成的键\n\n\
  大多数数据库都支持某种机制来对数据库中的行进行自动编号。遗憾的是，不同厂商之间的机制差异很大。这些自动数字通常被用作主键。虽然 JDBC 没有提供一种独立厂商的生成键的解决方案，但它确实提供了一种高效检索它们的方法。当你向表中插入新行并自动生成键时，你可以使用以下代码检索它：\n\
  \n![images](img/img_p220-2.png)![images](img/img_p221-1.png)\n\n#### java.sql.Statement\
  \ 1.1\n\n*   `boolean execute(String statement, int autogenerated)` **1.4**\n* \
  \  `int executeUpdate(String statement, int autogenerated)` **1.4**\n    如前所述，执行给定的\
  \ SQL 语句。如果将 `autogenerated` 设置为 `Statement.RETURN_GENERATED_KEYS` 且该语句是 `INSERT`\
  \ 语句，则第一列将包含自动生成的键。\n\n### 3.6 可滚动和可更新的结果集\n\n正如你所看到的，`ResultSet` 接口的下一个方法是遍历结果集中的行。对于一个需要分析数据的程序来说，这足够了。然而，考虑一个显示表格或查询结果的可视化数据显示（如第\
  \ 166 页的图 3.4，-fig3-4）。你通常希望用户能够在结果集中向前和向后移动。在可滚动（scrollable）结果集中，你可以向前向后移动结果集，甚至可以跳转到任何位置。\n\
  \n此外，一旦用户看到显示的结果集内容，他们可能会想要编辑它。在可更新（updatable）结果集中，你可以通过程序化更新条目，以便数据库自动更新。我们将在接下来的章节中讨论这些功能。\n\
  \n#### 3.6.1 可滚动结果集\n\n默认情况下，结果集是不可滚动或不可更新的。要从你的查询获取可滚动的结果集，你必须使用该方法获取不同的 `Statement`\
  \ 对象：\n\n![images](img/img_p221-2.png)\n\n对于预编译语句，使用 `call`\n\n![images](img/img_p221-3.png)\n\
  \n`type` 和 `concurrency` 的可能值列在表 3.6 (tab3-6) 和 3.7 (tab3-7) 中。你有以下选择：\n\n*   你是否希望结果集是可滚动的？如果不是，使用\
  \ `ResultSet.TYPE_FORWARD_ONLY`。\n*   如果结果集是可滚动的，你是否希望它反映在产生它的查询之后发生的数据库更改？（在我们的讨论中，我们假设可滚动结果集使用了\
  \ `ResultSet.TYPE_SCROLL_INSENSITIVE` 设置。这假设结果集不会“感知”执行查询后发生的数据库更改。）\n*   你是否能够通过编辑结果集来更新数据库？（详情请见下一节。）\n\
  \n例如，如果你只是想能够滚动查看结果集但不想编辑其数据，请使用\n\n![images](img/img_p222-1.png)\n\n所有通过 `call`\
  \ 返回的结果集\n\n![images](img/img_p222-2.png)\n\n现在都是可滚动的。可滚动结果集有一个指示当前位置的 `cursor`。\n\
