  \n由于 `provides` 和 `uses` 声明，消费服务的模块被允许访问私有的实现类。\n\n要构建并运行程序，首先编译服务：\n\n![images](img/img_p802-2.png)\n\
  \n然后编译并运行消费模块：\n\n![images](img/img_p802-3.png)\n\n### 10.14 用于模块工作的工具\n\n`jdeps`\
