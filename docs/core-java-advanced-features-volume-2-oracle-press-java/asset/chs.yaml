  \ urls, ClassLoader parent)`\n    构造一个从给定 URL 加载类的类加载器。如果 URL 以 `/` 结尾，则假设它是一个目录，否则假设是一个\
  \ JAR 文件。\n\n### `java.lang.Thread` 1.0\n\n* `ClassLoader getContextClassLoader()`\
  \ 1.2\n    获取线程创建者指定的、执行该线程时最合理的类加载器。\n* `void setContextClassLoader(ClassLoader\
  \ loader)` 1.2\n    为此线程中的代码设置一个类加载器，以便用于检索并加载类。如果在线程启动时没有显式设置上下文类加载器，则使用父类的上下文类加载器。\n\
  \n### 8.7.5 字节码验证\n\n当类加载器将新加载的 Java 平台类的字节码呈现给虚拟机时，这些字节码首先由一个*验证器*（verifier）检查。验证器检查指令无法执行明显破坏性的操作。除了系统类外，所有类都会经过验证。\n\
  \n以下是验证器执行的一些检查：\n\n* 变量在使用之前已进行初始化。\n* 方法调用与对象引用的类型匹配。\n* 没有违反访问私有数据和方法的规则。\n*\
  \ 局部变量访问落在运行时栈范围内。\n* 运行时栈没有发生溢出。\n\n如果这些任何一项检查失败，该类将被认为损坏且不会被加载。\n\n**注意**\n\n\
  如果你熟悉哥德尔定理（Gödel’s theorem），你可能会好奇验证器如何证明一个类文件没有类型错误、未初始化的变量和栈溢出。哥德尔定理指出，设计出一种算法来处理程序并判断其是否具有特定属性（如无栈溢出）是不可能的。这难道\
  \ Oracle 公关部门与逻辑法则之间的冲突吗？不——事实上，验证器并不是哥德尔意义上的决策算法。如果验证器接受了一个程序，它确实是安全的。然而，验证器可能会拒绝虚拟机指令，尽管它们实际上是安全的。（当你被迫用占位值初始化变量时，你可能会遇到这个问题，因为验证器无法看到该变量将要被正确初始化的事实。）\n\
  \n这种严格的验证是一项重要的安全考量。如果不捕获，意外错误（如未初始化的变量）很容易造成破坏性影响。更重要的是，在开放的互联网世界中，你必须防止那些故意制造恶意影响的程序员。例如，通过修改运行时栈上的值或通过向系统对象的私有实例字段写入数据，程序可以突破浏览器的安全系统。\n\
  \n然而，你可能会想，为什么需要一个特殊的验证器来检查所有这些特性。毕竟，编译器永远允许你生成一个使用了未初始化变量或从另一个类访问私有实例字段的类文件。事实上，Java\
  \ 语言编译器生成的类文件总是通过验证的。但是，类文件中使用的字节码格式有详尽的文档，对于具有汇编编程和十六进制编辑器经验的人来说，手动生成一个包含 Java\
  \ 虚拟机有效但不安全的指令的类文件很容易的。验证器始终在防止恶意篡改的类文件——而不仅仅检查编译器生成的类文件。\n\n这是一个如何构造这样一个修改过的类文件的示例。我们从列表\
  \ 8.12 中的程序 `VerifierTest.java` 开始。这是一个简单的程序，它调用一个方法并显示结果。`fun` 方法本身计算 `1 + 2`。\n\
  \n![images](img/img_p538.png)\n\n作为一个实验，尝试编译修改后的程序：\n\n![images](img/img_p539.png)\n\
  \n在这里，`n` 未初始化，因此可以是任何随机值。当然，编译器检测到了这个问题并拒绝编译。要创建一个坏的类文件，我们需要费一点功夫。首先，运行 `javap`\
  \ 程序查看编译器是如何翻译 `fun` 方法的。\n\n![images](img/img_p539.png)\n\n显示了类文件中的助记符字节码。\n\n\
