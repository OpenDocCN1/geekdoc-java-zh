  \ 网站（[www.google.com/maps](http://www.google.com/maps)）接受名为 `q` 和 `hl` 的查询参数，其值分别是位置查询内容和响应的人类语言。要获取位于旧金山\
  \ Market 街 1 号的地图并使用德语响应，请使用以下 URL：\n\n![images](img/img_p505-1.png)\n\n非常长的查询字符串在浏览器中可能看起来并不美观，而且旧版本的浏览器和代理对\
