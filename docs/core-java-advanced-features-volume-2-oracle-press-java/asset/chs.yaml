  \    设置或获取连接的超时时间（毫秒）。如果在建立连接之前已超时，则关联输入流的 `connect` 方法将抛出 `SocketException`。\n\
  *   `void setReadTimeout(int timeout)`\n*   `int getReadTimeout()`\n    设置或获取读取数据的超时时间（毫秒）。如果在读取操作成功之前已超时，则\
