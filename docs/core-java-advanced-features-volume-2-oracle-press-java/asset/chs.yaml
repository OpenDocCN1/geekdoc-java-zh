  \  写入注释。\n* `void close()`\n  关闭此写入器。\n\n### 4.8.5 示例：生成 SVG 文件\n\n第 288 页的 Listing\
  \ 4.9 是一个产生 XML 输出的典型程序。该程序绘制了一幅现代画——一组随机彩色矩形（参见图 4.3）。为了保存我们的杰作，我们使用了可缩矢量图形（SVG）格式。SVG\
  \ 是一种以设备无关的方式描述复杂图形的 XML 格式。你可以在 [www.w3.org/Graphics/SVG](http://www.w3.org/Graphics/SVG)\
  \ 找到更多关于 SVG 的信息。要查看 SVG 文件，只需使用任何现代浏览器即可。\n\n该程序演示了产生 XML 的两种方式：通过构建并保存 DOM 树，以及通过\
  \ StAX API 直接写入 XML。\n\n我们不需要详细介绍 SVG 的细节；对于我们的目的，只需要知道如何表示一组彩色矩形。这里是一个示例：\n\n![images](img/img_p314.png)![images](img/img_p315-1.png)\n\
  \n**图 4.3** 生成现代艺术\n\n如你所见，每个矩形都被描述为 `rect` 节点。位置、宽度、高度和填充颜色是属性。填充颜色是十六进制表示的 RGB\
  \ 值。\n\n#### 注意事项\n\nSVG 大量使用属性。事实上，某些属性非常复杂。例如，这是一个路径元素：\n\n![images](img/img_p315-2.png)\n\
  \n`M` 表示“移动到”（moveto）命令，`L` 是“线到”（lineto），而 `z` 是“闭合路径”（closepath）！显然，这种数据格式的设计者对使用\
  \ XML 处理结构化数据并没有很有信心。在你自己的 XML 格式中，你可能希望使用元素而不是复杂的属性。\n\n## 4.9 XSL 转换\n\nXSL 转换（XSLT）机制允许你指定将\
  \ XML 文档转换为其他格式的规则，例如纯文本、XHTML 或其他 XML 格式。XSLT 通常用于从一种机器可读的 XML 格式转换为另一种，或者将 XML\
  \ 转换为人类阅读的演示格式。\n\n你需要提供一个 XSLT 样式表，描述 XML 文档转换为其他格式的过程。XSLT 处理器读取 XML 文档和样式表并产生所需的输出（参见图\
  \ 4.4）。\n\n![images](img/img_p316-1.png)\n\n**图 4.4** 应用 XSL 转换\n\nXSLT 规范非常复杂，关于这个主题已经有大量的书籍著作。我们不可能讨论\
  \ XSLT 的所有功能，因此我们将只处理一个代表性的示例。你可以在 Don Box 等人编写的 *Essential XML* 一书中找到更多信息。XSLT\
  \ 规范可以在 [www.w3.org/TR/xslt](http://www.w3.org/TR/xslt) 获取。\n\n假设我们要把带有员工记录的 XML\
  \ 文件转换为 HTML 文档。考虑此输入文件：\n\n![images](img/img_p316-2.png)\n\n预期的输出是一个 HTML 表格：\n\
  \n![images](img/img_p316-3.png)\n\n带有转换模板的样式表形式如下：\n\n![images](img/img_p317-1.png)\n\
  \n在我们的示例中，`xsl:output` 元素指定方法为 `HTML`。其他有效的方法设置为 `xml` 和 `text`。\n\n这是一个典型的模板：\n\
