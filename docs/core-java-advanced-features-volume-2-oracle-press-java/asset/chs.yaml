  \n### java.awt.Graphics2D 1.2\n\n*   `void setStroke(Stroke s)`\n    将此图形上下文的笔画设置为实现\
  \ `Stroke` 接口的给定对象。\n\n### java.awt.BasicStroke 1.2\n\n*   `BasicStroke(float width)`\n\
  *   `BasicStroke(float width, int cap, int join)`\n*   `BasicStroke(float width,\
  \ int cap, int join, float miterlimit)`\n*   `BasicStroke(float width, int cap,\
