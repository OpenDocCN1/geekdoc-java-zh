  \ Windows 功能”，并勾选“Telnet 客户端复选框。Windows 防火墙还阻止了我们在本章中使用的许多网络端口；你可能需要管理员账户来解除阻止。\n\
  \n你可能用过 `telnet` 连接到远程计算机，但你也可以用它与 Internet 主机提供的其他服务通信。这里有一个你可以操作的示例。输入\n\n![images](img/img_p470-1.png)\n\
