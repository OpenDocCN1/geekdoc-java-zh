  \ mergeFunction, Supplier<M> mapSupplier)`\n\n### 1.10 分组与分区\n\n在前面的节中，你看到了如何收集某个国家的所有语言。但那个过程有点繁琐。你需要为每个\
  \ map 生成集合，然后指定如何合并值。具有相同键的值分组是非常常见的，因此 `groupingBy` 直接支持它。\n\n让我们看看按国家分组语言区域的问题。首先，形成这个\
  \ map：\n\n![images](img/img_p57-1.png)\n\n函数 `Locale::getCountry` 是分组的*分类函数*。现在你可以根据代码查找所有语言区域，例如\n\
  \n![images](img/img_p57-2.png)\n\n#### **注意** ![images](img/note.png)\n\n回顾语言区域：语言代码（如\
  \ en）和国家代码（如 US）。`en_US` 描述美国的英语，`en_IE` 是爱尔兰的英语。某些国家有多个语言区域。例如，`ga_IE` 是爱尔兰的盖尔语，正如前面的示例所示，JDK\
  \ 知道瑞士至少有三个语言区域。\n\n当分类函数是一个谓词函数（即返回布尔值的函数）时，流元素被分为两个列表：函数返回 true 的元素和互补的元素。在这种情况下，使用\
  \ `partitioningBy` 代替 `groupingBy` 更高效。例如，在这里我们将语言区域分为使用英语的和其他的：\n\n![images](img/img_p57-3.png)\n\
  \n#### **注意** ![images](img/note.png)\n\n如果你调用 `groupingByConcurrent` 方法，将得到一个并发\
  \ map，当与并行流配合使用时它是并发填充的。这与 `toConcurrentMap` 方法完全类似。\n\n*   `static <T,K> Collector<T,?,Map<K,List<T>>>\
  \ groupingBy(Function<? super T,? extends K> classifier)`\n*   `static <T,K> Collector<T,?,ConcurrentMap<K,List<T>>>\
  \ groupingByConcurrent(Function<? super T,? extends K> classifier)`\n    产生一个 map\
  \ 或并发 map 的收集器，其键是应用于所有收集元素的分类函数的结果，其值是具有相同键的元素的列表。\n*   `static <T> Collector<T,?,Map<Boolean,List<T>>>\
  \ partitioningBy(Predicate<? super T> predicate)`\n    产生一个 map 的收集器，其键为 true/false，其值是满足/不满足谓词的元素列表。\n\
  \n\n\n\n\n`groupingBy` 方法产生一个 map，其值是列表。如果你想以某种方式处理这些列表，可以提供一个`下游收集器`（downstream\
  \ collector）。例如，如果你想要集合而不是列表，可以使用你在上一节中见过的 `Collectors.toSet` 收集器：\n\n![images](img/img_p58-1.png)\n\
  \n### 注意\n![images](img/note.png)\n\n在本示例以及本节剩余的示例中，我假设已对 `java.util.stream.Collectors.*`\
  \ 进行了静态导入，以便使表达式更易读。\n\n提供了几个收集器用于将收集到的元素还原为数字：\n\n*   `counting` 产生所收集元素的计数。例如，\n\
  \n    ![images](img/img_p58-2.png)\n\n    统计每个国家有多少个本地区域设置（locale）。\n\n*   `summing(Int|Long|Double)`\
  \ 和 `averaging(Int|Long|Double)` 接受一个函数参数，将该函数应用于下游元素，并产生它们的总和或平均值。例如，\n\n    ![images](img/img_p58-3.png)\n\
  \n    计算城市流中每个州的人口平均数。\n\n*   `maxBy` 和 `minBy` 接受一个比较器并产生下游元素的最大值和最小值。例如，\n\n \
  \   ![images](img/img_p59-1.png)\n\n    产生每个州最大的城市。\n\n`collectingAndThen` 收集器在收集器之后添加了一个最终的处理步骤。例如，如果你想知道有多少个不同的结果，可以先将它们收集到集合中，然后计算其大小：\n\
  \n![images](img/img_p59-2.png)\n\n`mapping` 收集器相反的操作。它对每个收集到的元素应用函数，并将结果传递给下游收集器。\n\
  \n![images](img/img_p59-3.png)\n\n在这里，我们根据字符串的首字母对字符串进行分组。在每个组内部，我们产生长度并将它们收集到一个集合中。\n\
  \n`mapping` 方法还为上一节中的问题提供了更好的解决方案——收集一个国家中所有语言的集合。\n\n![images](img/img_p59-4.png)\n\
