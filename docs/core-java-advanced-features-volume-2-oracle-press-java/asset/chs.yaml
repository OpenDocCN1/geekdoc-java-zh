  \ channel)`\n  构造一个向给定通道写入的输出流。\n\n## 8.3 获取 Web 数据\n\n在 Java 程序中访问 Web 服务器，你可能希望在比套接字连接和\
  \ HTTP 请求更高的层次上工作。在接下来的章节中，我们将讨论 Java 库为为此目的提供的类。\n\n#### 8.3.1 URLs 和 URIs\n\n\
  `URL` 和 `URLConnection` 类封装了从远程站点检索信息的大部分复杂性。你可以从字符串构造一个 `URL` 对象：\n\n![images](img/img_p493-1.png)\n\
  \n如果你只是想获取资源的内容，请使用 `URL` 类的 `openStream` 方法。该方法产生一个 `InputStream` 对象。按照通常的方式使用它——例如，构造一个\
  \ `Scanner`：\n\n![images](img/img_p493-2.png)\n\n`java.net` 包在 URL（统一资源定位符）和 URI（统一资源标识符）之间做了非常有用的区分。\n\
  \n`URI` 是一个纯粹的句法构造体，包含了指定 Web 资源的字符串的各个部分。`URL` 是 `URI` 的特殊类型，即具有足够信息来定位资源的 `URI`。其他的\
  \ `URIs`，例如\n\n![images](img/img_p494-1.png)\n\n并不是定位符——从该标识符中没有可以用于定位的数据。这样的 `URI`\
  \ 被称为 `URN`（统一资源名称）。\n\n在 Java 库中，`URI` 类没有用于访问标识符所指定资源的方法——它的唯一目的是是解析。相比之下，`URL`\
  \ 类可以打开一个指向资源的流。由于这个原因，`URL` 类仅与 Java 库知道如何处理的方案一起工作，例如 `http:`、`https:`、`ftp:`、本地文件系统\
  \ (`file:`）以及 JAR 文件 (`jar:`)。\n\n为了理解为什么解析并非易事，请考虑 `URIs` 可能有多复杂。例如，\n\n![images](img/img_p494-2.png)\n\
