  \ `DateTimeParseException`。\n\n## 6.4 排序与归一化\n\n大多数程序员知道如何使用 `String` 类的 `compareTo`\
  \ 方法来比较字符串。遗憾的是，在与人类交互时，这个方法并不好用。`compareTo` 方法使用字符串的 UTF-16 编码值，这导致即使在英语中也会产生荒的结果。例如，以下五个字符串根据\
  \ `compareTo` 方法的排序如下：\n\n![images](img/img_p374-1.png)\n\n对于字典排序，你可能希望认为大写和小写是等价。对于英语使用者来说，示例单词列表的排序应该是：\n\
  \n![images](img/img_p374-2.png)\n\n然而，这种顺序对于瑞典用户来说是不可接受的。在瑞典语中，字母 `Å` 与字母 `A` 不同，它在字母\
  \ `Z` *之后* 排序！这意味着，瑞典用户希望单词按如下方式排序：\n\n![images](img/img_p374-3.png)\n\n要获取与区域敏感的比较器，请调用静态方法\
  \ `Collator.getInstance`：\n\n![images](img/img_p374-4.png)\n\n由于 `Collator` 类实现了\
  \ `Comparator` 接口，你可以将 `Collator` 对象传递给 `List.sort(Comparator)` 方法来对字符串列表进行排序。\n\
  \n排序器有几个高级设置。你可以设置排序器的*强度*（strength）来调整它的选择性程度。字符差异被分类为*初*、*次级*或*三级*。例如，在英语中，“A”和“Z”之间的差异被认为是初级的，“A”和“Å”之间的差异是次级的，而“A”和“a”之间的差异是三级的。\n\
  \n通过将排序器的强度设置为 `Collator.PRIMARY`，你告诉它只关注初级差异。通过将强度设置为 `Collator.SECONDARY`，你指示排序器考虑次级差异。也就是说，当强度设置为“次级”或“三级”时，两个字符串更有可能被认为是不同的，如\
  \ 表 6.8 所示。\n\n**表 6.8** 不同强度的排序（英语区域设置）\n\n![images](img/img_p375-1.png)\n\n当强度设置为\
  \ `Collator.IDENTICAL` 时，不允许任何差异。此设置主要与一种相当有技术性的排序器设置——*分解模式*（decomposition mode）结合使用，我们将在下一步讨论它。\n\
  \n偶尔，一个字符或字符序列在 Unicode 中可以用多种方式描述。例如，“Å”可以是 Unicode 字符 `U+00C5`，也可以表示为一个普通的“A”（`U+0065`）后跟一个“°”（“组合上部圆圈”；`U+030A`）。可能更令人惊讶的是，字母序列“ffi”可以使用单个字符“拉丁小写连字\
  \ ffi”（其代码为 `U+FB03`）来描述。（人们可以争辩这是一个不应导致不同 Unicode 字符的显示问题，但规则不是我们定的。）\n\nUnicode\
  \ 标准为字符串定义了四种*归一化形式*（normalization forms）（D、KD、C 和 KC）。详情请参阅 [www.unicode.org/unicode/reports/tr15/tr15-23.html](http://www.unicode.org/unicode/reports/tr15/tr15-23.html)。在归一化形式\
  \ C 中，带重音的字符总是组合的。例如，“A”和组合上圆圈“°”的序列被组合成单个字符“Å”。在形式 D 中，带重音的字符总是分解为它们的基字母和组合重音：“Å”被转换为“A”后跟“°”。形式\
  \ KC 和 KD 也会分解连字或商标符号等字符。\n\n你可以选择你希望排序器使用的归一化程度。值 `Collator.NO_DECOMPOSITION` 完全不对字符串进行归一化。此选项更快，但它可能不适用于以多种形式表示字符的文本。默认的\
  \ `Collator.CANONICAL_DECOMPOSITION` 使用归一化形式 D。这对于包含重音但没有连字的文本很有用。最后，“完全分解”使用归一化形式\
  \ KD。示例请参见 表 6.9。\n\n**表 6.9** 分解模式之间的差异\n\n![images](img/img_p375-2.png)\n\n让排序器多次分解字符串是浪费的。如果一个字符串需要与其他字符串进行比较，你可以将分解结果保存在排序对象中。`getCollationKey`\
  \ 方法返回一个 `CollationKey` 对象，用于更快的比较。例如：\n\n![images](img/img_p376-1.png)\n\n最后，你可能希望字符串转换为归一化形式。`java.text.Normalizer`\
  \ 类执行归一化过程。例如：\n\n![images](img/img_p376-2.png)\n\n归一化字符串包含多个字符。“Å”和“ö”被替换为“A°”和“o¨”序列。但这通常不是存储和传输的最佳形式。根据\
  \ W3C，列表 6.3 中的程序允许实验排序顺序。每当你添加另一个单词、更改区域或分解模式时，单词列表都会重新排序。等号表示被认为是相同的单词（参见图 6.3）。\n\
  \n区域名称使用默认区域的排序器按顺序显示。如果你用美国英语运行此程序，请注意“Norwegian (Norway,Nynorsk)”在“Norwegian (Norway)”之前，尽管逗号的\
  \ Unicode 值大于括号的 Unicode 值。\n\n**列表 6.3** collation/CollationTest.java\n\n![images](img/img_p376-3.png)![images](img/img_p378.png)\n\
  \n**图 6.3** CollationTest 程序\n\n#### java.text.Collator **1.1**\n\n*   `static Locale[]\
  \ getAvailableLocales()`\n    返回可以获取排序器对象的 Locale 对象数组。\n\n*   `static Collator\
  \ getInstance()`\n\n*   `static Collator getInstance(Locale l)`\n    返回默认区域或给定区域的排序器。\n\
  \n*   `int compare(String a, String b)`\n    如果 a 在 b 之前则返回负值，如果它们被认为是相同的，则返回 0，否则返回正值。\n\
  \n*   `boolean equals(String a, String b)`\n    如果 a 和 b 被认为是相同的则返回 true，否则返回 false。\n\
  \n*   `void setStrength(int strength)`\n\n*   `int getStrength()`\n    设置或获取排序器的强度。越强的排序器区分的单词越多。强度值为\
  \ `Collator.PRIMARY`、`Collator.SECONDARY` 和 `Collator.TERTIARY`。\n\n*   `void setDecomposition(int\
  \ decomp)`\n\n*   `int getDecompositon()`\n\n\n\n\n设置或获取排序器（collator）的分解模式。排序器对字符串的分解越彻底，在判断两个字符串是否应被认为相同时就越严格。分解值为\
  \ `Collator.NO_DECOMPOSITION`、`Collator.CANONICAL_DECOMPOSITION` 和 `Collator.FULL_DECOMPOSITION`。\n\
  \n* `CollationKey getCollationKey(String a)` 返回一个排序键，其包含字符的分解形式，该形式可以与其他排序键进行快速比较。\n\
