  \ 打印属性\n\n打印服务 API 包含一组复杂的接口和类，用于指定各种类型的属性。有四组重要的属性。前两组指定对打印机的请求。\n\n*   *打印请求属性\
  \ (Print request attributes)* 为打印作业中的所有 doc 对象请求特定功能，例如双面打印或纸张大小。\n*   *文档属性 (Doc\
  \ attributes)* 是仅适用于单个 doc 对象的请求属性。\n\n另外两个属性包含关于打印机和作业状态的信息。\n\n*   *打印服务属性 (Print\
  \ service attributes)* 提供有关打印服务的信息，例如打印机的品牌和型号，或打印机当前是否接受作业。\n*   *打印作业属性 (Print\
  \ job attributes)* 提供特定打印作业状态的信息，例如该作业是否已完成。\n\n为了描述各种属性，有一个 `Attribute` 接口，它带有子接口：\n\
  \n![images](img/img_p768.png)\n\n各个属性类实现了这些接口中的一个或多个。例如，`Copies` 类对象描述了打印输出的份数。该类同时实现了\
  \ `PrintRequestAttribute` 和 `PrintJobAttribute` 接口。显然，一个打印请求可以包含对多个份的请求。相反，打印作业的属性可能是这些份数中实际打印了多少份。这个数字可能较低，也许是因为打印机的限制，或者是因为打印机缺纸了。\n\
  \n`SupportedValuesAttribute` 接口表示属性值不反映实际情况，而是反映服务的某种。例如，`CopiesSupported` 类实现了\
  \ `SupportedValuesAttribute` 接口。该类的对象可能会描述打印机支持 1 到 99 份打印。\n\n图 9.65 显示了属性层次结构的类图。\n\
