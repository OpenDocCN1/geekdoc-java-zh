  \    *   `javax.xml.stream.isValidating`：为 false 时，文档不进行验证。\n    *   `javax.xml.stream.isNamespaceAware`：为\
  \ true 时，处理命名空间。\n    *   `javax.xml.stream.isCoalescing`：为 false 时，相邻字符数据不会合并。\n\
