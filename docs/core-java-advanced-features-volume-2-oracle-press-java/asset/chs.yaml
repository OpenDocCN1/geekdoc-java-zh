  \ **警告**\n\n在执行流操作时，千万不要修改支持流的集合，这一点非常重要。记住，流本身并不收集数据——数据始终存储在单独的集合中。如果你修改了该集合，流操作的结果将变得未定义。JDK\
  \ 文档将这一要求称为 `noninterference`（非干扰）。\n\n确切地说，由于中间流操作是惰性的，在执行终端操作之前，集合是有可能变的。例如，下面的代码虽然绝对不推荐，但可以运行：\n\
