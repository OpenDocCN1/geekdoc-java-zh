  \ 的末端。\n\n代码 9.16 程序允许你指定端样式、接样式和虚线（见图 9.44）。你可以移动线条的末端来测试 `miter limit`：选择 `miter\
  \ join`，然后移动线条形成非常锐的角度。你会看到 `miter join` 变为 `bevel join`。\n\n![images](img/img_p687-3.png)\n\
