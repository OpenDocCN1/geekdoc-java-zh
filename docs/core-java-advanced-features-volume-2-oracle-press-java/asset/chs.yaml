  \ 6\n\n*   `boolean hasNext()`\n    如果有另一个解析事件则返回 true。\n*   `int next()`\n    将解析器状态设置为下一个解析事件并返回以下常量之一：START_ELEMENT,\
  \ END_ELEMENT, CHARACTERS, START_DOCUMENT, END_DOCUMENT, CDATA, COMMENT, SPACE（忽略的空白），PROCESSING_INSTRUCTION,\
  \ ENTITY_REFERENCE, DTD。\n*   `boolean isStartElement()`\n*   `boolean isEndElement()`\n\
  *   `boolean isCharacters()`\n*   `boolean isWhiteSpace()`\n    如果当前事件是起始元素、结束元素、字符数据或空白，则返回\
  \ true。\n*   `QName getName()`\n*   `String getLocalName()`\n    获取 START_ELEMENT\
  \ 或 END_ELEMENT 事件中的元素名称。\n*   `String getText()`\n    返回 CHARACTERS、COMMENT 或 CDATA\
