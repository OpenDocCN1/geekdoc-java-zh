  \n### 1.9 收集到 Map\n\n假设你有一个 `Stream<Person>` 并想要将元素收集到映射（map）中，以便稍后可以通过 ID 查找人员。`Collectors.toMap`\
  \ 方法有两个函数参数，用于生成 map 的键和值。例如，\n\n![images](img/img_p53-1.png)\n\n在值应该是实际元素的常见情况下，请对第二个函数使用\
  \ `Function.identity()`。\n\n![images](img/img_p53-2.png)\n\n如果多个元素具有相同的键，则会发生冲突，收集器将抛出\
  \ `IllegalStateException`。你可以通过提供第三个函数参数来覆盖该行为，该参数将根据现有值和新值解析冲突并确定键的值。你的函数可以返回现有值、新值或两者的组合。\n\
  \n在这里，我们构建了一个 map，对于可用语言区域（locales）中的一种语言，以其在默认语言区域的名称（例如 \"German\"）作为键，以其本地化名称（例如\
  \ \"Deutsch\"）作为值。\n\n![images](img/img_p53-3.png)\n\n我们不在乎同一种语言出现两次（例如德国和瑞士的德语），所以我们只保留第一个条目。\n\
