  \n#### 9.2.2 节点枚举\n\n有时你需要从根开始在树中访问所有节点，直到找到匹配项。`DefaultMutableTreeNode` 类提供了遍历节点的便利方法。\n\
  \n`breadthFirstEnumeration` 和 `depthFirstEnumeration` 方法返回枚举对象，其 `nextElement` 使用广度优先或深度优先遍历访问当前节点的所有子节点。图\
  \ 9.27 显示了示例树的遍历——节点标签指示了遍历的顺序。\n\n![images](img/img_p642-1.png)\n\n**图 9.27** 遍历顺序\n\
  \n广度枚举容易可视化。树按层遍历。首先访问根节点，然后是它的所有节点，然后是孙节点，以此类推。\n\n为了可视化深度优先枚举，想象一只被困在树形迷宫里的鼠。它沿着第一条路径冲直到遇到叶节点。然后，它回溯并转向另一条路径。计算机科学家也称为*后序遍历*，因为搜索过程在访问父节点之前访问了子节点。`postOrderEnumeration`\
  \ 方法是 `depthFirstEnumeration` 的同义词。为了完整起见，还有 `preOrderEnumeration`，这是一种在父节点之前枚举子节点的深度优先搜索。\n\
  \n这里是典型的使用模式：\n\n```\n![images](img/img_p642-2.png)\n```\n\n\n\n\n最后，有一个相关方法 `pathFromAncestorEnumeration`，它可以找到从祖先节点到给定节点的路径，并枚举该路径上的节点。这没什么大不了——它不断调用\
  \ `getParent` 直到找到祖先节点，然后以反序呈现路径。\n\n在我们的下一个示例程序中，我们将节点枚举派上了用场。该程序显示了类的继承树。在框架底部的文本框中输入类的名称。该类及其所有的父类都会被添加到树中（请参见\
  \ 图 9.28）。\n\n![images](img/img_p643-1.png)\n\n**图 9.28** 继承树\n\n在这个示例中，我们利用了树节点的用户对象可以是任意任意类型对象的这一事实。由于我们的节点描述的是类，因此我们在节点中存储了\
  \ `Class` 对象。\n\n我们不希望重复添加同一个类对象，因此需要检查类是否已经存在于树中。以下方法如果给定的用户对象存在于树中，则找到该对象的节点：\n\
  \n![images](img/img_p643-2.png)\n\n### 9.2.3 渲染节点\n\n在你的应用程序中，你经常需要更改树组件绘制节点的方式。最常见的更改当然是为节点和叶子节点选择不同的图标。其他更改可能涉及更改节点标签的字体或在节点处绘制图像。所有这些更改都可以向树中安装新的树单元渲染器（tree\
  \ cell renderer）来实现。默认情况下，`JTree` 类使用 `DefaultTreeCellRenderer` 对象来绘制每个节点。`DefaultTreeCellRenderer`\
  \ 类自 `JLabel` 类。标签包含了节点图标和节点标签。\n\n#### ![images](img/note.png) **注意**\n\n单元渲染器并不绘制展开和折叠子树的“句柄”。这些句柄是外观（look-and-feel）的一部分，建议你不要更改它们。\n\
  \n你可以通过三种方式自定义显示：\n\n*   你可以更改 `DefaultTreeCellRenderer` 使用的图标、字体和背景颜色。这些设置适用于树中的所有节点。\n\
  *   你可以安装一个扩展 `DefaultTreeCellRenderer` 的渲染器，并为每个节点设置不同的图标、字体和背景颜色。\n*   你可以安装一个实现\
  \ `TreeCellRenderer` 接口的渲染器，为每个节点绘制自定义图像。\n\n让我们逐一查看这些可能性。最简单的自定义是构造一个 `DefaultTreeCellRenderer`\
  \ 对象，更改图标并将其到树中：\n\n![images](img/img_p644-1.png)\n\n你可以在 图 9.28 中看到效果。我们只是使用“球形”图标作为占位符——假设你的用户界面设计师会为你提供适用于应用程序的适当图标。\n\
