  \ sourceAlpha)`\n    构造一个 alpha 组合对象。规则是 `CLEAR`、`SRC`、`SRC_OVER`、`DST_OVER`、`SRC_IN`、`SRC_OUT`、`DST_IN`、`DST_OUT`、`DST`、`DST_ATOP`、`SRC_ATOP`、`XOR`\
  \ 中的之一。\n\n## 9.4 光栅图像\n\nJava2D API 允许你创建由线条、曲线和区域组成的图形。它是一个“矢量”API，因为你指定了形状的数学属性。然而，对于由像素组成的图像，你需要处理颜色数据的“光栅”。以下章节将向你如何在\
  \ Java 中处理光栅图像。\n\n#### 9.4.1 图像读取器和写入器\n\n`javax.imageio` 包包含了对常见格式的读取和写入支持，还提供了允许第三方添加其他格式读取器和写入器的框架。GIF、JPEG、BMP（Windows\
  \ 位图）和 WBMP（无线位图）文件格式都是支持的。该库的基础非常直观。要加载图像，使用 `ImageIO` 的静态 `read` 方法：\n\n![images](img/p14.png)\n\
  \n`ImageIO` 类根据文件扩展名和文件开头的魔数数选择合适的读取器。如果找不到合适的读取器，或者读取器无法解码文件，`read` 方法将返回 null。\n\
  \n将图像写入文件同样简单：\n\n![images](img/p14.png)\n\n这里的格式字符串是标识图像的，例如 \"JPEG\"。`ImageIO`\
  \ 类选择合适的写入器并保存文件。\n\n##### 9.4.1.1 获取类型的读取器和写入器\n\n对于超出 `ImageIO` 静态 `read` 和 `write`\
  \ 方法的高级读写操作，你首先需要获取 `ImageReader` 和 `ImageWriter` 对象。`ImageIO` 类枚举匹配以下内容的读取器和写入器：\n\
