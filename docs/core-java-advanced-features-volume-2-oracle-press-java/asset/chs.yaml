  \ `predicate`，则产生具有该值的 `Optional`，否则产生一个空的 `Optional`。\n*   `Optional<T> or(Supplier<?\
  \ extends Optional<? extends T>> supplier)` 9\n    如果此 `Optional` 不为空，则产生它，否则产生由\
  \ `supplier` 产生的。\n\n#### 1.7.4 如何处理 Optional 值\n\n如果你不正确使用 `Optional` 值，那么你相对于过去的“某些值或\
  \ null”方法并没有任何好处。\n\n`get` 方法在值存在时获取 `Optional` 的元素，否则抛出 `NoSuchElementException`。因此，\n\
  \n![images](img/img_p42-3.png)\n\n并不比\n\n![images](img/img_p42-4.png)更安全。`isPresent`\
  \ 和 `isEmpty` 方法报告 `Optional` 是否有值。\n\n![images](img/img_p42-5.png)\n\n### 注意 ![images](img/note.png)\n\
  \nJava 10 引入了 `orElseThrow`，它是 `get` 的听起来更可怕的同义词。当你调用 `optionalValue.orElseThrow()`\
  \ 时，如果 `optionalValue` 为空，将会发生异常。这里是正确使用 `Optional` 的一些提示：\n\n*   `Optional` 变量*绝不*为\
  \ null。\n*   不要使用 `Optional` 字段。它是可序列化的。\n*   `Optional` 方法是有问题的。相反，考虑该方法的重载版本。\n\
  *   不要将 `Optional` 对象放入集合中，不要将其作为键。收集值即可。\n\n### java.util.Optional 8\n\n*   `T\
  \ get()`\n*   `T orElseThrow()` 10\n    产生此 `Optional` 的值，如果为空，则抛出 `NoSuchElementException`。\n\
  *   `boolean isEmpty()` 11\n    如果此 `Optional` 为空，返回 true。\n*   `boolean isPresent()`\n\
  \    如果此 Optional 不为空，返回 true。\n\n#### 1.7.5 创建 Optional 值\n\n到目前为止，我们讨论了如何消费别人创建的\
  \ `Optional` 对象。如果你想写一个创建 `Optional` 对象的方法，有几个静态方法用于此目的，包括 `Optional.of(result)`\
  \ 和 `Optional.empty()`。例如，\n\n![images](img/img_p44-1.png)\n\n`ofNullable` 方法旨在作为可能值到可选值的桥梁。`Optional.ofNullable(obj)`\
  \ 在 `obj` 不为空时返回 `Optional.of(obj)`，否则返回 `Optional.empty()`。\n\n### java.util.Optional\
  \ 8\n\n*   `static <T> Optional<T> of(T value)`\n*   `static <T> Optional<T> ofNullable(T\
  \ value)`\n    产生带有给定值的 `Optional`。如果 `value` 为 null，第一个方法抛出 `NullPointerException`，第二个方法产生一个空的\
  \ `Optional`。\n*   `static <T> Optional<T> empty()`\n    产生一个空的 `Optional`。\n\n\
