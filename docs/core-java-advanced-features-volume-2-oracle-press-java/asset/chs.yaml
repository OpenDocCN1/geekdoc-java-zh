  \n## 6.2 数字格式\n\n我已经提到过数字和货币格式是高度依赖语言区域的。Java 库在 `java.text` 包中提供了一组格式化对象，可以格式化和解析数值。\n\
  \n#### 6.2.1 格式化数值\n\n按照以下步骤对特定语言区域的数字进行格式化：\n\n1. 如前节所述获取语言区域对象。\n2. 使用“工厂方法”获取格式化对象。\n\
  3. 使用该格式化对象进行格式化和解析。\n\n工厂方法是 `NumberFormat` 类的静态方法，接受一个 `Locale` 参数。共有三个工厂方法：`getCurrencyInstance`、`getNumberInstance`\
  \ 和 `getPercentInstance`。这些方法分别返回可以格式化和解析数字、货币金额和百分比的对象。例如，以下是用德语格式化货币值的方法：\n\n\
  ![images](img/img_p361-1.png)\n\n结果是\n\n123.456,78 €\n\n注意货币符号是 €，且它位于字符串的末尾。还要注意小数点和进制逗号的翻转。\n\
  \nJava 12 增加了一种“紧凑”格式，有两种样式：短格式（123K）和长格式（123 thousand）。以下是获取短样式的方法：\n\n![images](img/img_p361-2.png)\n\
  \n相反，要读取按照特定语言区域习惯输入或存储的数字，请使用 `parse` 方法。例如，以下代码解析了用户输入到文本框中的值。`parse` 方法可以处理小数点、逗号以及其他语言的数字。\n\
  \n![images](img/img_p361-3.png)\n\n`parse` 的返回类型是抽象类型 `Number`。返回的对象是 `Double` 或\
  \ `Long` 包装对象，取决于解析出的数字是否为浮点数。如果你不在意区别，可以简单地使用 `Number` 类的 `doubleValue` 方法来获取封装的数字。\n\
  \n#### 警告\n\n`Number` 类型对象不会自动拆箱——你不能简单地将 `Number` 对象赋值给原始类型。相反，请使用 `doubleValue`\
  \ 或 `intValue` 方法。\n\n如果数字文本格式不正确，方法将抛出 `ParseException`。例如，字符串开头的空格是*不允许*的。（调用\
  \ `trim` 来移除它）。然而，字符串中数字后的任何字符都会被忽略，因此不会抛出异常。\n\n注意，由 `get*XxxInstance` 工厂方法返回的类实际上并不是\
  \ `NumberFormat` 类型。`NumberFormat` 是一个抽象类，实际的格式器属于它的子类之一。工厂方法仅知道如何定位属于特定语言区域的对象。\n\
  \n你可以通过静态方法 `getAvailableLocales` 获取当前支持的语言区域列表。该方法返回一个语言区域数组，其中可以获取数字格式化对象。\n\n\
