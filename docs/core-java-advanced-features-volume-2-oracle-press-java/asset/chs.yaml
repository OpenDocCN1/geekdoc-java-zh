  \n#### `java.util.stream.Stream` **8**\n\n*   `static <T> Stream<T> of(T... values)`\n\
  \n    产生一个其元素为给定值的流。\n*   `static <T> Stream<T> empty()`\n\n    产生一个不包含元素的流。\n*\
  \   `static <T> Stream<T> generate(Supplier<T> s)`\n\n    产生一个无限流，其元素通过反复调用函数 `s`\
  \ 构建。\n*   `static <T> Stream<T> iterate(T seed, UnaryOperator<T> f)`\n*   `static\
  \ <T> Stream<T> iterate(T seed, Predicate<? super T> hasNext, UnaryOperator<T> f)`\n\
  \n    产生一个流，其元素为 `seed`、对 `seed` 用的 `f`、对前一个元素用的 `f` 等，此类此类。第一种方法产生一个无限流。第二种方法的流在第一个不满足\
  \ `hasNext` 谓词的元素之前结束。\n*   `static <T> Stream<T> ofNullable(T t)` **9**\n\n   \
  \ 如果 `t` 为 null，则返回一个空流；否则返回一个包含 `t` 的流。\n\n#### `java.util.Spliterators` **8**\n\
