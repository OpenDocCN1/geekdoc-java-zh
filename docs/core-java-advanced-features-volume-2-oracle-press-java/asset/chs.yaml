  \ `supportsResultSetType` 和 `supportsConcurrency` 方法将告诉你支持。如果你没有检查结果集的功能就执行了不支持的操作（例如在不可滚动的结果集上执行\
  \ `previous`），将抛出 `SQLException`。\n\n滚动非常简单。使用\n\n![images](img/img_p222-3.png)\
  \ 向后滚动。如果光标位于实际行上，则方法返回 `true`；如果位于第一行之前，则返回 `false`。\n\n**表 3.6 ResultSet Type**\n\
