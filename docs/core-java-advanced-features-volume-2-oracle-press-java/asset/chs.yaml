  \ 3.4 显示了此表与 Publishers 表*连接*的结果。Books 表和 Publishers 表各包含一个出版商的标识符。当我们根据出版商代码连接这两个表连接时，我们获得了一个由连接表的值组成的\
  \ `query result`。结果中的每一行包含书籍信息，以及出版商名称和网页 URL。注意，出版商名称和 URL 在多行中重复，因为我们有几本书属于同一个出版商。\n\
  \n![images](img/img_p187.png)\n\n**图 3.3** 包含书籍的示例表\n\n连接表的好处是避免数据库表中不必要的数据重复。例如，一个原始的数据库设计可能在\
  \ Books 表中直接包含出版商名称和 URL 列。但这样数据库本身（而不只是查询结果）将会有许多这些条目的重复。如果出版商的网地址发生变化，*所有*条目都需要更新。显然，这在某种容易出错。在关系模型中，我们将数据分布到多个表中，以便没有任何信息是不必要的重复的。例如，每个出版商的\
  \ URL 只在 publisher 表包含一次。如果需要合并信息，则对表进行连接。\n\n在图中，你可以看到一个用于检查和链接表的图形化工具。许多供应商都有工具通过连接列名并在表单中填写信息以简单的形式表示查询。此类工具通常被称为*示例查询*\
  \ (QBE) 工具。相比之下，使用 SQL 的查询是用文本编写的，并使用 SQL 语法，例如：\n\n```\n![images](img/img_p188-2.png)![images](img/img_p188-1.png)\n\
