  \ sql)`\n    返回一个包含预编译语句的 `PreparedStatement` 对象。字符串 `sql` 包含一个或多个由 `?` 字符表示的参数占位符的\
  \ SQL 语句。\n\n#### java.sql.PreparedStatement 1.1\n\n*   `void setXxx(int n, Xxx\
  \ x)`\n    （*Xxx* 是一种类型，如 `int`、`double`、`String`、`Date` 等）\n    将第 n 个参数设置为 `x`。\n\
  *   `void clearParameters()`\n    清除预编译语句中的所有当前参数。\n*   `ResultSet executeQuery()`\n\
