  \n\n\n\n\n## 11.10 完整示例：访问 Windows 注册表，第 46 页\n## 11.11 外部函数：展望未来，第 62 页\n\n虽然从原则上讲，“100%\
  \ 纯 Java”的方案很好，但在某些情况下，你可能希望编写（或使用）另一种语言编写的代码。这种代码通常被称为 `native` 代码。\n\n特别是在 Java\
  \ 早期，许多人认为使用 C 或 C++ 来加速 Java 应用程序的关键部分是一个好主意。然而，在实践中，这种做法很少有用。1996 年 JavaOne 大会的一场演示清楚地说明了这一点。Sun\
  \ Microsystems 加密库的开发者报告说，纯 Java 平台实现的其加密函数已经绰绰有余。代码的速度确实没有 C 实现那么快，但事实证明这并不重要。Java\
  \ 平台的实现速度远快于网络 I/O，而这才是真正的瓶颈。\n\n当然，使用原生代码（native）也有缺点。如果你的应用程序的一部分是用另一种语言编写的，你必须为你想要支持的每个平台提供一个独立的原生库。用\
  \ C 或 C++ 编写的代码无法防止因无效指针使用而导致的内存覆盖。很容易编写出可能破坏你的程序或感染操作系统的原生方法。\n\n因此，我建议只在需要时才使用原生代码。特别是，有三个原因可能使原生代码成为正确的选择：\n\
  \n*   你的应用程序需要访问 Java 平台无法访问的系统功能或设备。\n*   你用另一种语言编写了大量经过测试和调试的代码，并且你知道如何将其迁移到所有预期的目标平台。\n\
  *   你通过基准测试（benchmarking）发现，Java 代码比另一种语言的等效代码慢得多。\n\nJava 平台有一个用于与原生 C 代码交互的 API，称为\
  \ Java Native Interface (JNI)。我们即将在本章中讨论 JNI 编程。\n\n### C++ 注意事项\n你也可以使用 C++ 代替\
  \ C 来编写原生方法。这有几个优势——类型检查稍微严格，访问 JNI 函数也稍微方便一点。然而，JNI 不支持 Java 和 C++ 类之间的任何映射。\n\n\
  正如你将看到的，在 Java 和原生代码之间提供绑定层涉及到一定程度的乏味。Java 17 有一个预览功能，提供了访问“外部”函数和内存的 API，它比 JNI\
  \ 要方便得多。在本章结束时，你将简要了解这个 API。\n\n### 11.1 从 Java 程序中调用 C 函数\n\n假设你有一个 C 函数，它可以执行你喜欢的功能，而且出于某种原因，你不想费力在\
  \ Java 中重新实现它。为了说明，我们将从一个打印问候信息的简单 C 函数开始。\n\nJava 编程语言使用 `native` 关键字表示原生方法，你显然需要将该方法放在类中。结果所示于列表\
  \ 11.1。\n\n`native` 关键字告诉编译器该方法将在外部定义。当然，原生方法将不包含任何 Java 代码，且方法头后面紧跟着一个终止分号。因此，原生方法的声明看起来类似于抽象方法的声明。\n\
  \n**列表 11.1** `helloNative/HelloNative.java`\n\n![images](img/img_po3.png)\n\n###\
  \ 注意事项\n为了保持示例简单，我们在这里没有使用包。\n\n在这个特定的示例中，原生方法也被声明为 `static`。原生方法可以是静态的，也可以是非静态的。我们将从静态方法开始，因为我们还没有处理参数传递。\n\
  \n你实际上可以编译这个类，但如果你尝试在程序中使用它，虚拟机会告诉你它不知道如何找到 greeting——报告 `UnsatisfiedLinkError`。要实现原生代码，请编写相应的\
  \ C 函数。你必须**完全**按照 Java 虚拟机期望的方式命名该函数。规则如下：‌\n\n1.  使用完整的 Java 方法名，例如 `HelloNative.greeting`。如果类在包中，请加上包名，例如\
  \ `com.horstmann.HelloNative.greeting`。\n2.  将每个点替换为下划线，并加上前缀 `Java_`。例如，`Java_HelloNative_greeting`\
  \ 或 `Java_com_horstmann_HelloNative_greeting`。\n3.  如果类名包含不是 ASCII 字母或数字的字符——即 ‘_’、『$’\
  \ 或大于 `\\u007F` 的 Unicode 字符——将它们替换为 `_0*xxxx`，其中 `xxxx` 是字符 Unicode 值的四个十六进制数字序列。\n\
  \n### 注意事项\n如果你重载（`overload`）原生方法——即如果你提供了多个同名的原生方法——你必须附加一个双下划线，随后是编码的参数类型。（我将在本章稍后描述参数类型的编码。）例如，如果你有一个原生方法\
  \ `greeting` 和另一个原生方法 `greeting(int repeat)`，那么第一个被称为 `Java_HelloNative_greeting__`，第二个是\
  \ `Java_HelloNative_greeting__I`。\n\n实际上，没有人会手动这样做；相反，请使用 `-h` 标志运行 `javac`，并提供应该放置头文件的目录：\n\
  \n```\njavac -h . HelloNative.java\n```\n\n这会在当前目录下创建一个头文件 `HelloNative.h`，如列表 11.2\
  \ 所示。\n\n**列表 11.2** `HelloNative.h`\n\n![images](img/img_po4.png)\n\n如所示，此文件包含了\
  \ `Java_HelloNative_greeting` 的声明。（宏 `JNIEXPORT` 和 `JNICALL` 在头文件 `jni.h` 中定义。它们表示依赖于编译器的说明符，用于来自动态加载库的导出函数。）\n\
  \n现在，简单地将头文件中的函数原型复制到源文件中，并为函数提供实现代码，如列表 11.3 所示。\n\n**列表 11.3** `HelloNative.c`\n\
  \n![images](img/img_po5.png)\n\n在这个简单的函数中，忽略 `env` 和 `cl` 参数。你将在稍后看到它们的用法。\n\n###\
  \ C++ 注意事项\n你可以使用 C++ 实现原生方法。但是，你必须将实现原生方法的函数声明为 `extern \"C\"`。（这会阻止 C++ 编译器“修饰”方法名）。例如，\n\
  \n```cpp\nextern \"C\" JNIEXPORT void JNICALL Java_HelloNative_greeting()\n```\n\
  \n将原生 C 代码编译成动态加载库。细节取决于你的编译器。\n\n例如，在 Linux 上使用 GNU 编译器，使用这些命令：\n\n```\ngcc -shared\
  \ -fPIC -o libhello.so HelloNative.c\n```\n\n在 Windows 下使用 Microsoft 编译器，命令是：\n\n\
  ```\ncl /LD HelloNative.c\n```\n\n在这里，`JAVA_HOME` 是包含 JDK 的目录。\n\n### 提示\n如果你从命令行壳使用\
  \ Microsoft 编译器，请先运行 `vsvars32.bat` 或 `vcvarsall.bat` 等批处理文件。该批处理文件设置编译器所需的路径和环境变量。你可以在\
  \ `c:\\Program Files\\Microsoft Visual Studio 14.0\\Common7\\Tools` 或类似的怪物目录下找到它。详情请查看\
  \ Visual Studio 文档。\n\n你也可以使用 [www.cygwin.com](http://www.cygwin.com) 免费提供的 Cygwin\
  \ 编程环境。它包含了用于在 Windows 上进行 UNIX 风格编程的 GNU C 编译器和库。使用 Cygwin 使用命令：\n\n```\ngcc -shared\
  \ -fPIC -o libhello.so HelloNative.c\n```\n\n### 注意事项\nWindows 头文件 `jni_md.h` 包含类型声明\n\
  \n```cpp\n#define JNIEXPORT __declspec(dllexport)\n#define JNICALL __stdcall\n```\n\
  \n这是针对 Microsoft 编译器的。如果你使用 GNU 编译器，可能想编辑该文件，例如：\n\n```cpp\n#define JNIEXPORT\n\
  #define JNICALL\n```\n\n\n\n或者，使用 `-D __int64=\"long long\"` 进行编译，如示例中的编译器调用所示。\n\
  \n最后，在你的程序中添加对 `System.loadLibrary` 方法的调用。为了确保虚拟机在第一次使用类之前加载库，请使用静态初始化块，如列表 11.4\
  \ 所示。\n\n图 11.1 提供了原生代码处理的总结。\n\n**列表 11.4** `helloNative/HelloNativeTest.java`\n\
  \n![images](img/img_po6-4.png)![images](img/img_po7.png)\n\n**图 11.1** 处理原生代码\n\n\
  编译并运行此程序后，终端窗口中将显示消息“Hello, Native World!”。\n\n#### ![images](img/note.png) 注意事项\n\
  \n如果你运行的是 Linux，则必须将当前目录添加到库路径中。可以通过设置 `LD_LIBRARY_PATH` 环境变量：\n\n![images](img/img_po8-1.png)\n\
  \n或者设置 `java.library.path` 系统属性：\n\n![images](img/img_po8-2.png)\n\n当然，这本身并不特别厉害。但请记住，此消息是由\
  \ C 语言的 `printf` 命令生成的，而不是由任何 Java 代码。我们已经迈出了跨越这两种语言鸿沟的第一步！\n\n总之，按照以下步骤将原生方法链接到\
  \ Java 程序：\n\n1.  在 Java 类中声明原生方法。\n2.  运行 `javac -h` 以获取带有该方法 C 声明的头文件。\n3.  在\
  \ C 中实现原生方法。\n4.  将代码放在共享库中。\n5.  在 Java 程序中加载该库。\n\n#### java.lang.System 1.0 \n\
  \n*   `void loadLibrary(String libname)`\n\n    加载给定名称的库。该库位于库搜索路径中。定位库的具体方法取决于操作系统。\n\
  \n#### ![images](img/note.png) 注意事项\n\n某些用于原生代码的共享库必须执行特定的初始化。你可以将任何初始化代码放入 `JNI_OnLoad`\
  \ 方法中。同样，当虚拟机（VM）关闭时，如果你提供了该方法，它将调用 `JNI_OnUnload`。其原型如下：\n\n![images](img/img_po8-3.png)\n\
  \n`JNI_OnLoad` 方法需要返回它所要求的虚拟机最小版本，例如 `JNI_VERSION_1_2`。\n\n#### 11.2 数值参数和返回值\n\n\
