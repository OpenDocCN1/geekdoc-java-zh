  \n### 1.14 并行流（Parallel Streams）\n\n流使得批量操作并行化变得简单。过程大部分是自动的，但你需要遵循一些规则。首先，你必须有一个并行流。你可以通过\
  \ `Collection.parallelStream()` 方法从任何集合获取并行流：\n\n![images](img/img_p71-1.png)\n\n\
  此外，`parallel` 方法可以将任何顺序流转换为并行流。\n\n![images](img/img_p71-2.png)\n\n只要在执行终端操作时流处于并行模式，所有中间态流操作都将是并行化的。\n\
  \n当流操作以并行方式运行时，其意图是返回与串行执行相同的结果。重要的是，这些操作必须是*无状态的*，并且可以按任意顺序执行。\n\n这里有一个你不能执行的操作示例。假设你想统计字符串流中所有的短单词：\n\
  \n![images](img/img_p71-3.png)\n\n这是非常、非常糟糕的代码。传递给 `forEach` 的函数在多个线程中并发运行，每个线程都在更新一个共享数组。正如你在第一卷第\
  \ 8 章中看到的，这是一个经典的*竞态条件*。如果你多次运行此程序，很可能在每次运行中得到不同的计数序列——而且每一个都是错误的。\n\n确保你传递给并行流操作的任何函数在并行执行时都是安全的你的责任。做到点的最佳方法是远离可变状态。在这个示例中，如果你按长度对字符串进行分组并计数，就可以安全地进行并行计算：\n\
  \n![images](img/img_p72-1.png)\n\n默认情况下，源自有序集合（数组和列表）、范围、生成器和迭代器，或通过调用 `Stream.sorted`\
  \ 产生的流都是*有序的*。结果按照原始元素的顺序累积，并且是完全可预测的。如果你运行两次相同的操作，将得到完全相同的结果。\n\n排序并不排除高效的并行化。例如，在计算\
  \ `stream.map(fun)` 时，流可以被划分为 *n* 个段，每个段被并发处理。然后按顺序重新组合结果。\n\n当丢弃顺序要求时，某些操作可以更有效地并行化。通过调用\
  \ `Stream.unordered` 方法，你表示你不在乎顺序。一个可以从中获益的操作是 `Stream.distinct`。在有序流上，`distinct`\
  \ 保留所有相等元素中的第一个。这阻碍了并行化——处理某个段的线程在前面的段被处理之前，无法知道丢弃哪些元素。如果保留*任何*唯一元素是可以接受的，那么所有段都可以并发处理（使用一个共享集合来跟踪重复项）。\n\
  \n你还可以通过丢弃顺序来加速 `limit` 方法。如果你只需要流中的任意 `n` 个元素，且不在乎获得的是哪几个，请调用：\n\n![images](img/img_p72-2.png)\n\
  \n正如第 1.9 节 第 31 页“收集到 Map”中所讨论的，合并 map 是昂贵的。因此，`Collectors.groupingConcurrent`\
  \ 使用并发 map。为了从并行受益，map 的顺序将与流相同。\n\n![images](img/img_p73.png)\n\n不要为了加速操作而将所有流都转换为并行流。记住这些问题：\n\
  \n#### 提示\n在 Java 9 之前，`Files.lines` 方法返回的流并行化是没有意义的。数据不可拆分——你必须读取前半部分才能读取后半部分。现在它使用内存映射文件，拆分是有效的。如果你处理大文件的行，并行化可能会性能。\n\
  \n#### 注意\n默认情况下，并行流使用由 `ForkJoinPool.commonPool()` 返回的全局线程池。如果你的操作没有阻塞且不与其他任务共享该池，那就是很好的。有一个替换不同池的技巧。在自定义池的\
  \ `submit` 方法中放置你的操作：\n\n![images](img/img_p73-2.png)\n\n或者，异步地：\n\n![images](img/img_p73-3.png)\n\
  \n#### 注意\n如果你想基于随机数并行化流计算，不要从 `Random.ints`、`Random.longs` 或 `Random.doubles` 方法获取流。这些流不可分割。相反，请使用\
  \ `SplittableRandom` 类的 `ints`、`longs` 或 `doubles` 方法。\n\n列表 1.8 中的示例程序演示了如何使用并行流。\n\
  \n**列表 1.8** parallel/ParallelStreams.java\n\n![images](img/img_p74.png)![images](img/img_p75.png)\n\
  \n### `java.util.stream.BaseStream<T,S extends BaseStream<T,S>>` 8\n\n*   `S parallel()`\n\
  \    产生一个与此流元素相同的并行流。\n*   `S unordered()`\n    产生一个与此流元素相同的无序流。\n\n### `java.util.Collection<E>`\
  \ 1.2\n\n*   `Stream<E> parallelStream()` 8\n    产生包含此集合元素的并行流。\n\n\n\n\n\n在本章中，你已经学习了如何使用\
  \ Java 8 的流库。下一章将涵盖另一个重要主题：输入和输出的处理。\n\n## 第 2 章\n\n## 输入与输出\n\n## 本章介绍\n\n* 2.1\
  \ 输入/输出流，第 56 页\n* 2.2 读取和写入二进制数据，第 78 页\n* 2.3 对象输入/输出流与序列化，第 89 页\n* 2.4 文件操作，第\
  \ 115 页\n* 2.5 内存映射文件，第 131 页\n* 2.6 文件锁定，第 141 页\n* 2.7 正则表达式，第 143 页\n\n在本章中，我们将介绍用于输入和输出的\
  \ Java 应用程序编程接口（API）。你将学习如何访问文件和目录，以及如何以二进制和文本格式读取和写入数据。本章还向你展示了对象序列化机制，让你像存储文本或数值数据一样轻松存储对象。接下来，我们将转向文件和目录的操作。我们通过对正则表达式的讨论结束本章，尽管它们实际上与输入输出没有直接关系。我们找不到更合适的地方来处理这个主题，显然\
  \ Java 团队也是如此——正则表达式的 API 规范被附带在一个关于“新 I/O”功能的规范请求中。\n\n## 2.1 输入/输出流\n\n在 Java\
  \ API 中，一个可以从其读取字节序列的对象被称为 `input stream`（输入流）。一个可以向其写入字节序列的对象被称为 `output stream`（输出流）。这些字节序列的源和终点可以是文件（而且通常也是文件），但也可以是网络连接甚至是内存块。抽象类\
  \ `InputStream` 和 `OutputStream` 是输入/输出（I/O）类层级结构的基础。\n\n### 注意\n\n![images](img/note.png)\n\
  \n这些输入/输出流与你在上一章中看到的流无关。为了清晰起见，当我们讨论用于输入输出的流时，将使用 `input stream`、`output stream`\
  \ 或 `input/output stream` 术语。\n\n面向字节的输入/输出流对于处理存储在 Unicode 中的信息并不方便（记住 Unicode\
  \ 每个字符使用多个字节）。因此，另一个独立的层级结构提供了继承自抽象类 `Reader` 和 `Writer` 的类，用于处理 Unicode 字符。这些类具有基于双字节\
  \ `char` 值（即 UTF-16 编码单元）而非字节值的读取和写入操作。\n\n#### 2.1.1 读取和写入字节\n\n`InputStream` 类有一个抽象抽象方法：\n\
  \n![images](img/img_p78-1.png)\n\n该方法读取一个字节并返回所读取的字节；如果遇到输入源的末尾，则返回 `-1`。具体输入流类的设计者通过重写此方法来提供有用的功能。例如，在\
  \ `FileInputStream` 类中，此方法从文件中读取一个字节。`System.in` 是 `InputStream` 子类的预定义对象，允许你从“标准输入”（即控制台或重定向的文件）读取信息。\n\
  \n`InputStream` 类还具有非抽象方法，用于读取字节数组或跳过指定数量的字节。从 Java 9 开始，有一个非常有用的方法可以读取流的所有字节：\n\
  \n![images](img/img_p78-2.png)\n\n还有读取指定数量字节的方法——请参见 API 注释。\n\n这些方法调用了抽象的 `read`\
  \ 方法，因此子类只需要重写一个方法。\n\n同样，`OutputStream` 类定义了抽象方法\n\n![images](img/img_p79-1.png)\n\
  \n它向输出位置写入一个字节。\n\n如果你有一个字节数组，可以一次性写入它们：\n\n![images](img/img_p79-2.png)\n\n`transferTo`\
  \ 方法将所有字节从输入流传输到输出流：\n\n![images](img/img_p79-3.png)\n\n`read` 和 `write` 方法都会*阻塞*（block）直到字节实际被实际读取或写入。这意味着如果无法立即访问输入流（通常是因为网络连接繁忙），当前线程将阻塞。这为其他线程提供了在方法等待输入流再次可用时执行有有用工作的机会。\n\
  \n`available` 方法允许你检查当前可供读取的字节数。这意味着如下代码片段不太可能会阻塞：\n\n![images](img/img_p79-4.png)\n\
  \n当你完成对输入/输出流的读取或写入后，调用 `close` 方法将其关闭。此调用会释放供应有限的操作系统资源。如果应用程序打开了过多的输入输出流而不关闭，系统资源可能会耗尽。关闭输出流还会*刷新*（flushes）用于输出流的缓冲区：任何临时存放在缓冲区中以便作为较大的数据包发送的字节都会被发出。特别是，如果你不关闭文件，最后一个字节数据包可能永远无法发送。你也可以使用\
  \ `flush` 方法手动刷新输出。\n\n即使输入输出流类提供了处理具体工作的具体方法，你感兴趣的数据可能包含数字、字符串和对象，而不是原始字节。\n\n\
  与其处理字节操作，你可以使用构建在 `InputStream` 和 `OutputStream` 之上的类。\n\n#### **java.io.InputStream**\n\
  \n* `abstract int read()`\n    读取一个字节并返回读取的字节；在输入流末尾返回 `-1`。\n* `int read(byte[]\
  \ b)`\n    读取字节数组并返回实际读取的字节数；在输入流末尾返回 `-1`。\n* `int read(byte[] b, int off, int\
  \ len)`\n    从数组 `b` 的 `off` 处开始读取最多 `len` 个字节。\n* `byte[] readAllBytes()`\n   \
  \ 产生从流中读取的所有字节的数组。\n* `long transferTo(OutputStream out)`\n    将输入流的所有字节传输到输出流，返回传输的字节数。两个流都不会关闭。\n\
  * `long skip(long n)`\n    尝试在输入流中跳过 `n` 个字节，返回实际跳过的字节数（由于任何原因可能小于 `n`）。\n* `long\
  \ skipNBytes(long n)`\n    在输入流中跳过 `n` 个字节，返回实际跳过的字节数（如果遇到输入流末尾则可能少于 `n`）。\n* `int\
  \ available()`\n    在阻塞返回可用字节数（记住阻塞意味着当前线程将失去机会）。\n* `void close()`\n    关闭输入流。\n\
  * `void mark(int readlimit)`\n    在输入流的当前位置放置标记（并非所有流都支持此功能）。如果从输入流中读取的字节超过 `readlimit`，则允许流忘记标记。\n\
  * `void reset()`\n    返回到上一个标记。随后的 `read` 调用将重新读取字节。如果没有当前标记，则输入流不会重置。\n* `boolean\
  \ markSupported()`\n    如果输入流支持标记，则返回 true。\n* `static InputStream nullInputStream()`\n\
  \    返回一个没有字节的输入流。\n\n#### **java.io.OutputStream**\n\n* `abstract void write(int\
  \ n)`\n    写入一个字节的数据。\n* `void write(byte[] b)`\n    写入数组 `b` 中的所有字节。\n* `void write(byte[]\
  \ b, int off, int len)`\n    写入数组 `b` 从 `off` 处开始的所有字节或 `len` 个字节。\n* `void close()`\n\
  \    刷新并关闭输出流。\n* `void flush()`\n    刷新缓冲区。\n\n\n\n\n刷新输出流——即将任何缓冲数据发送到其目的地。\n\n\
  - `static OutputStream nullOutputStream()` **11**\n\n返回一个丢弃所有字节的输出流。\n\n#### 2.1.2\
  \ 完整的流动物园\n\n与 C 语言不同（C 只需要一个 `FILE*` 类型就能良好工作），而 Java 拥有超过 60 (!) 种不同的输入/输出流类型（参见图\
  \ 2.1 和 2.2）。\n\n让我们根据使用方法对输入/输出流动物园中的动物分类。处理字节和字符的类有不同的层级结构。正如你所看到的，`InputStream`\
  \ 和 `OutputStream` 类允许你读写单个字节和字节数组。这些类构成了图 2.1 所示层级结构的基础。为了读写字符串和数字，你需要功能更强大的子类。例如，`DataInputStream`\
  \ 和 `DataOutputStream` 允许你以二进制格式读写所有的 Java 原始类型。最后，还有一些可以执行有用操作的输入/输出流；例如，`ZipInputStream`\
  \ 和 `ZipOutputStream` 允许以熟悉的 ZIP 压缩格式读写文件。\n\n![images](img/img_p82-1.png)\n\n**图\
  \ 2.1** 输入输出流层级结构\n\n对于 Unicode 文本，你可以使用抽象类 `Reader` 和 `Writer` 的子类（参见图 2.2）。`Reader`\
  \ 和 `Writer` 类的基本方法与 `InputStream` 和 `OutputStream` 相似。\n\n![images](img/img_p82-2.png)\n\
  \n`read` 方法返回 UTF-16 代码单元（0 到 65535 之间的整数），或在到达文件末尾时返回 -1。`write` 方法带有 Unicode 代码单元。（有关\
  \ Unicode 代码单元的讨论，请参见第一卷第 2 章。）\n\n![images](img/img_p83-1.png)\n\n**图 2.2** Reader\
  \ 和 writer 层级结构\n\n还有四个接口：`Closeable`、`Flushable`、`Readable` 和 `Appendable`（参见图\
  \ 2.3）。前两个接口非常简单，包含方法：\n\n![images](img/img_p83-2.png)\n\n和\n\n![images](img/img_p83-3.png)\n\
  \n`InputStream`、`OutputStream`、`Reader` 和 `Writer` 都实现了 `Closeable` 接口。\n\n![images](img/img_p84-1.png)\n\
  \n**图 2.3** Closeable, Flushable, Readable 和 Appendable 接口\n\n#### ![images](img/note.png)\
  \ 注意\n\n`java.io.Closeable` 接口继承了 `java.lang.AutoCloseable` 接口。因此，你可以对任何 `Closeable`\
  \ 使用 try-with-resources 语句。为什么要两个接口？`Closeable` 接口的 `close` 方法只抛出 `IOException`，而\
  \ `AutoCloseable.close` 方法可能会抛出任何异常。\n\n`OutputStream` 和 `Writer` 实现了 `Flushable`\
  \ 接口。\n\n`Readable` 接口只有一个方法\n\n![images](img/img_p84-2.png)\n\n`CharBuffer` 类具有顺序和随机读/写访问的方法。它代表内存中的缓冲区或内存映射文件。（详情参见第\
  \ 139 页节 2.5.2，“缓冲区结构”）\n\n`Appendable` 接口有两个追加单个字符和字符序列的方法：\n\n![images](img/img_p84-3.png)\n\
  \n`CharSequence` 接口描述了字符值序列的基本属性。它由 `String`、`CharBuffer`、`StringBuilder` 和 `StringBuffer`\
  \ 实现。\n\n在输入/输出流类中，只有 `Writer` 实现了 `Appendable`。\n\n### java.io.Closeable 5.0\n\n\
  - `void close()`\n\n关闭此 `Closeable`。此方法可能会抛出 `IOException`。\n\n### java.io.Flushable\
  \ 5.0\n\n- `void flush()`\n\n刷新此 `Flushable`。\n\n### java.lang.Readable 5.0\n\n\
  - `int read(CharBuffer cb)`\n\n尝试向 `cb` 读取尽可能多的字符值。返回读取的值数，如果该 `Readable` 没有更多可用值，则返回\
  \ -1。\n\n### java.lang.Appendable 5.0\n\n- `Appendable append(char c)`\n- `Appendable\
  \ append(CharSequence cs)`\n\n将给定的代码单元或给定序列中的所有代码单元追加到此 `Appendable`；返回此。\n\n###\
  \ java.lang.CharSequence 1.4\n\n- `char charAt(int index)`\n\n返回指定索引处的代码单元。\n\n\
  - `int length()`\n\n返回此序列中代码单元的数量。\n\n- `CharSequence subSequence(int startIndex,\
  \ int endIndex)`\n\n返回一个由从索引 `startIndex` 到 `endIndex - 1` 存储的代码单元组成的 `CharSequence`。\n\
  \n- `String toString()`\n\n返回一个由此序列代码单元组成的字符串。\n\n#### 2.1.3 组合输入/输出过滤器\n\n`FileInputStream`\
  \ 和 `FileOutputStream` 提供了到磁盘文件的输入和输出流。你需要传递文件的名称或完整路径。\n\n\n\n\n![images](img/img_p87-3.png)\n\
  \n现在你可以推测性地读取下一个字节\n\n![images](img/img_p87-4.png)\n\n如果它不是你想要的，就将其推回。\n\n![images](img/img_p87-5.png)\n\
  \n然而，读取和推回是适用于推回输入流（pushback input stream）的*唯一*方法。如果你想向前查看并读取数字，那么你需要同时拥有推回输入流和一个数据输入流引用。\n\
  \n![images](img/img_p87-6.png)\n\n当然，在其他编程语言的输入输出库中，缓冲和预读等便利功能会自动处理——因此在 Java 中，通过组合流过滤器会有些麻烦。然而，通过混合组合过滤器类来构建有用的输入输出流序列，确实赋予了你极大的灵活性。例如，你可以使用以下输入流序列从压缩的\
