  md: '# And Now the Rest of the Story ...


    The darkened runaway train barreled right into the center of Lac-Mégantic, sparks
    flying into the night air from the wheels. People stared in disbelief as the tanker
    cars one by one left the tracks. The oil from the cars ignited in an inferno over
    a hundred feet high, with multiple explosions each tanker broke open the crude
    caught fire. The heat was palpable more than a mile away. The burning oil poured
    well into the sewers, only to erupt as towering flames from other openings, including
    home basically. If ever there was hell on earth, this would be it.


    About one hundred and five firefighters arrived on the scene, some from Quebec,
    but also joined by brigades from Maine. Local hospitals prepared for wounded,
    none arrived—there were just dead bodies. It took firefighters almost two days
    to put out the fires. In all, 47 people died, with 42 bodies recovered. It is
    assumed that the five victims were “vaporized” in the intense heat, and nothing
    will ever be found of them. Over 2000 were evacuated either because of the fire
    or the deadly fumes that rose because of the fire. The downtown core of the city
    was decimated, with over 30 buildings gone.


    On the fourth day after the accident, Edward Burkhart, the CEO of Rail World (which
    owned MMA), came to Lac-Mégantic to survey the damage and received a rough welcome
    from the townspeople. Even though Rail World had a poor safety record, compared
    to other railway companies in the U.S., Burkhart was quick to blame the train’s
    engineer, suspending him for failing to set the brakes properly.


    But was the engineer really to blame? Safety officials and legislators on both
    sides of the Canada-U.S. border keyed in, rightly, on MMA’s use of the Single
    Person Train Operation protocol on their trains. Let’s consider some probabilities.
    The most experienced train engineer would have some probability of not setting
    the brakes properly—anyone would. Suppose, for argument, a train engineer has
    a 95% success rate for correctly implementing the appropriate measures to a train
    once stopped. That leaves a 5% chance of the train being improperly braked—a1
    in 20 chance of things going dramatically (perhaps ever wrong).


    But if we have two engineers on the train, the chance of both of them independently
    checks the hand brakes, failing to apply the brakes jumps from 0.05 to 0.05 =
    0.0025, less than 1%. And the results get more dramatic when we increase the number
    of engineers checking the cars to three or four, where the probability of all
    engineers failing drops to 0.0125% and 0.000625% respectively, miniscule possibilities
    compared to the original 5% failure rate.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_243_0.png)'
  merge: -1
  pgno: 243
- img_proc: true
  md: 'We haven''t improved the quality of the checking ability of the engineers,
    only the number of such engineers, and the decreased risk is dramatic.


    Whether the chance of a single engineer improperly braking the train is 5%, 1%
    or some other number, the principle is still the same—the more independent eyes
    checking, the more drastically safer the overall system is. I don''t know how
    blame the one engineer, Tom Harding, should bear. But I do know that a process
    without built-in redundancy is, just by probability, one that is prone to catastrophic
    failure. There is always a trade-off in risk versus cost, but the Lac-Még tragedy
    points out how critical it is to have the issue and its mathematics firmly on
    the rails.


