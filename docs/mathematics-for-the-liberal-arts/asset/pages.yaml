    In art, ambiguity is one way to keep viewers attention. When looking at the famous
    picture in Figure 8.3, you alternate between two faces, or a vase in the center.
    The picture is ambiguous, and indeed you can see the two faces or the vase, but
    not both at the same time.


    Figure 8.3: The urn and faces paradox, known as Rubin''s vase, developed in the
