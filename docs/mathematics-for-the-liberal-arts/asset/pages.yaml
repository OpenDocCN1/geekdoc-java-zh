  md: '# # Late Night Mathematics—Humor and Philosophy


    Kurt Gödel was born in 1906 in Brunn, Austria (which is now Brno in the Czech
    Republic). A flair for the arts ran in his family—his grandfather, Joseph Gödel,
    was a well-known singer. But Kurt was inclined other nature, always wanting to
    know the reasons for things. In school he excelled, especially in mathematics,
    and attended the University of Vienna at age 18, taking courses in mathematics,
    physics and philosophy.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_419_0.png)


    Gödel was interested in number theory, but a seminar in logic captured his attention.
    The famous philosopher Bertrand Russell had written a book, “Introduction to Mathematical
    Philosophy,” whose goal was to find a list of rules or “axioms” from which all
    mathematical truths could be derived. The plan was accentuated by a lecture by
    world renowned mathematician David Hilbert, who raised the problem of whether
    certain logical systems (or theories) were consistent (that is, had no inherent
    contradictions!), and whether they were complete, every sentence was either provable
    true orably false.


    Gödel proved in his 1929 Ph.D. thesis (at age 23) that a certain logic (called
    first-order logic) was indeed complete. But he still pondered the gauntlet that
    Russell had thrown down—is there a set of axioms for mathematics from which every
    mathematical truth could be proved?


    We’ve come to the end of the book. We’ve seen a lot ways in which mathematics
    plays an important role in our lives. It seems that mathematics always has the
    right answers, and it exists, independent of us. But in fact, there are many philosophical
    questions that surround mathematics. And that is the “note” we want to end off
    on.


    395'
