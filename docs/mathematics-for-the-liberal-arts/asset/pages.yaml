    # And Now the Rest of the Story ...


    The reason that countries have such a tough time agreeing or sticking to a global
    warming protocol is much more than political—it is a game of theory. Global warming
    is one big multi-player version of the Prisoner''s Dilemma, but with huge stakes.
    Of course, it is in all countries'' best interest to decrease emissions, but it
    gets tricky if one country can get away without decreasing emissions while everyone
    else is. Simplifying the situation for the sake of discussion, imagine there are
    only two countries, A and B, each has to decide whether to decrease greenhouse
    gas emissions. Here is a game matrix, with reasonable utilities:


    | | B reduces emissions | B doesn''t reduce emissions |

    |---|---|---|

    | A reduces emissions | (1000, 1000) | (-10000, 10000) |

    | A doesn''t reduce emissions | (10000, -10000) | (-5000, -5000) |


    The actual utilities assigned do not make a difference, but the important thing
    is that while the joint decision is for both to reduce emissions,'
  merge: -1
  pgno: 316
- img_proc: true
  md: 'and the worst joint decision is neither to, when a country believes that another
    will reduce its emissions, it is in its best interest to not reduce emissions
    (for then it can reap economic benefits compared to a country that is spending
    resources on reduction). In this version of the Prisoner''s Dilemma, whether for
    just two countries or many, there is an enormous pull to not agree, just based
    on self-interest.


    So can we decide? Game theory says that we are doomed to never get agreement?
    One way out be to change the utilities for each country, or really, for each country''s
    leadership. Voters can let candidates know that they value adhering to greenhouse
    gas reductions, even if they are the only ones. Their utility may go down in such
    a case, but not as drastically as before. Perhaps citizens around the world could
    revise the game matrix for global warming:


    | B reduces emissions | B doesn''t reduce emissions |

    |---|---||

    | A reduces emissions | (1000, 1000) | (-100, 100) |

    | A doesn''t reduce emissions | (10000, -10000) | (-5000, -5000) |


    For this game matrix, there is no incentive for either country to shift from reducing
    emissions, as any unilateral shift will decrease their utility.


    While decision theory and game theory may be the essence of the problem for global
    warming, which is to say that they may not also be the solution as well?


