    # Looking for Fairness


    OK, certainly in general we want a voting system to be fair. But what does fairness
    mean? Here are a few suggestions for cases where we are voting on just two candidates
    or alternatives, A and B:


    +   1. (anonymity) We''d want our system to not depend on who votes a certain
    way, but only what way people vote—every voter should be treated equally.


    +   2. (neutrality) We shouldn''t treat one candidate differently from another—if
    we switched the votes for everyone, then if A is the winner previously, then B
    should win under the switch, and vice versa.


    +   3. (monotonicity) Getting more votes can never be bad—if one candidate wins
    with some set of votes, then he or she wins with more votes selecting him or her.


    These conditions seem pretty universal, don''t they? Certainly, if you have an
    odd number of voters, then in any vote by every-one, one candidate must get a
    majority of the vote (this may or may not happen if there is an even number of
    voters, as the vote can be split right down the middle between the two candidates.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_302_0.png)'
