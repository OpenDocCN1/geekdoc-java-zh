    more information you can take into account when restricting the relevant population,
    the more accurate the probability will be. For instance, if you want to know your
    chances of getting lung cancer, Prob(lung cancer), you could look at the probability
    that a random American gets the disease, as a first attempt. But if you take into
    account the city you live in (some cities have a higher prevalence of lung cancer
    due to pollution and other factors), your previous and present smoking status,
    your gender and age, and so on, and restrict yourself to the frequency of lung
    cancer within the relevant subset of the population, you would get a conditional
    probability, say


