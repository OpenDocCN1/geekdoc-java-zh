    # Running with Instant Run-Offs


    We''ll discuss one more proposal for finding a winner from voter''s profiles,
    by using what is often called the instant run-off system. Under this process,
    one takes the voter profiles, but proceeds then looks at the profiles and sees
    if there is a candidate who has won more than half of the first place votes—if
    so, that candidate is the winner and the process stops. Otherwise, the candidate/candidates
    with the lowest number of first place votes is/are removed from each profile,
    and the remaining candidates are moved up in position on each profile to fill
    any gaps. The process is repeated with the reduced voter profiles until a winner
    is declared.


    The Instant Run-off System is used in elections for the Australian House of Representatives
    to select the presidents of India and Ireland, as well as for many other elections
    in countries around the world.


    So, for example, let''s take the voter profiles from Table 5.7 again:'
