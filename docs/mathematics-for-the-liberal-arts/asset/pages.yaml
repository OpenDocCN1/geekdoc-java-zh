    MMR vaccine was hazardous.


    +   - There was evidence that Dr. Wakefield had applied for a competitive vaccine
    for the MMR that he was developing.


    +   - An investigative reporter uncovered that Dr. Wakefield had planned, with
    the father of one of the boys in the study, to create a company that would produce
    testing kits for diagnosing autism, based on Wakefield''s research. The “good”
