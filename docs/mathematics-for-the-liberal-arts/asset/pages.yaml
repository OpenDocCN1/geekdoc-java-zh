    world."


    And yet find it impossible to make accurate predictions about many things. Even
    the weather predictions beyond two weeks elude the most brilliant climatologists.
    Understanding the problem may lie in a field of mathematics chaos theory, where
    we have many processes that are so involved, have so many iterations, that future
    outcomes appear random, even though they’re not.


    Let me give an example. Suppose we take the function f(x) = 4x - 4x^2. If we start
    with x = 0.1, we find that


    ```

    f(0.1) = 4(0.1) - 4(0.1)^2 = 0.36,

    ```


    a simple calculation to do by hand or with a calculator. But now let’s repeat
    the function (that is, iterate it) with the output from the last step, 0.36:


    ```

    f(0.1) = 4(0.36) - 4(0.36)^2 = 0.9216.

    ```


    This is a bit more difficult, but certainly something that we can do, and we are
    certain of the result.


    Now, what if we iterate the process thousand times? When I use my computer, I
    get 0.56047527. Of course, my computer’s program only uses 10 digits for the calculations,
    but I should trust my computer, right? Certainly the answer, though likely not
    exactly 0.56047527 due to some rounding that must go, must be pretty close; right?
    I rerun the calculation (I set the number of digits to use in the program), and
    I get a number starting 0.2451..., a markedly different number, not even close.
    And if I use 100 digits of accuracy, I get 0.01047... Is this closer? If I bump
    the number of digits to 200 I get a number starting with 0.83450..., and I’m more
    confused than ever. Which is closest to the real answer? I have no confidence,
    based on the numbers, whether increasing the number of digits I will use the accuracy.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_428_0.png)


    > This problem is often referred to the principle “Chaos destroys every computer."'
