  md: '![](img/a2a6f439c6e02b960b8f4c54a2a56513_157_0.png)


    An Eulerian trail? It''s not too difficult to see that a graph has an Eulerian
    trail if and only the graph is connected and there are at most two vertices of
    odd degree. If the graph is connected, then (i) if there are no vertices of odd
    degree, the graph has an Eulerian circuit (which is an Eulerian trail), and you
    can start wherever you like, and (ii) if there are exactly two vertices of odd
    degree, the graph has an Eulerian trail (but not an Eulerian circuit), and you
    can start at one of the odd vertices and end at the other.


    Now tracing figures is a trip down memory lane, but there are real-life applications
    of Eulerian graphs as well. Assigning a route to a garbage truck in an area of
    the city is an Eulerian problem one would want a route that traveled down each
    street exactly once (to minimize cost) and return to the depot. The existence
    of Eulerian trails and circuits even has applications to DNA sequencing as well.
    You can be sure, one that mathematicians love to use and reuse previously solved
    problems!


    We remark while finding a circuit that visits every vertex exactly once is not
    too hard, the problem of visiting each vertex exactly once, called the Hamiltonian
    cycle problem, is much, harder, with no good way to solve it in general.


