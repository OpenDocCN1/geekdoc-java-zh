  md: '78


    +   the difference in means approximately follows what is called a Student’s t-distribution,
    which is very much like a normal curve (only “fatter” at the ends, depending on
    the sample sizes).


    Sometimes, it is impractical or unreasonable (or even unethical) to carry out
    a randomized control trial (imagine subjecting some people to smoking cigarettes
    to see how many cancer!), so an observational study is often done, where some
    participants have chosen previously to subject themselves to a certain treatment,
    others not, but the results of such studies are much less convincing causation.


    All sorts of interesting, unusual and thought-provoking questions can be analyzed
    with hypothesis tests. For example, one that just came across my desk called Eyes
    in the Aisles: Why is Cap’n Crunch Looking Down at My Child?, a study of whether
    the characters on children’s cereal boxes make eye contact with children walking
    down store aisles, and whether this influences the choice of brand. Once they
    classified cereals as advertised to parents (to give to their children) or directly
    to the children themselves, the authors of the study determined mathematically
    the height that the cereal boxes “spokes-character” appeared to be gazing at a
    distance of 4 feet away, where someone walking down the aisle would (we’ll talk
    in a later chapter about how this calculation was done). They also used Photoshop
    to change the eye gaze on packaging from looking at the viewer looking away (the
    latter being the control group, for which the “treatment” was omitted). They found
    a few interesting things:


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_102_0.png)


    +   the average eye angle of gaze for children-directed cereal spokes-characters
    was 9.67°, versus 0.43° for adults, and this was highly significant (p < 0.0001).


    +   the average height, at 4 feet away, of the characters’ gazes for boxes marketed
    to kids was 20.21 inches for children and 53.99 inches for those aimed at adults,
    again very significant (p < 0.0001).'
