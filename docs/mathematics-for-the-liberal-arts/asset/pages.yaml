  md: '# Mathematics of Sound (and the Sound of Mathematics)


    It was the early afternoon on April 16, 1964, and The Beatles were working on
    movie on what would be the opening song on the next album and their first movie.
    John had eagerly taken on the task of composing the number, beating Paul in the
    friendly friendly competition of who would compose it. The title had been a phrase
    out of the mouth of their drummer Ringo, who had bl out one evening after a concert,
    "it''s been a hard day''s night." Ringo was always saying stuff like that, with
    no intention of being funny, but what a great line it was! The cheekiness of the
    phrase immediately caught John''s attention, and in short order he had the framework
    for the song worked out (with lyrics written on the back of a birthday card sent
    to his son Julian by a fan).


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_363_0.png)


    The Beatles honed the song through a number of takes in Abbey Road studio, and
    they were getting ready for one final one, take 9. Their producer George Martin
    was getting on a "big" chord to start the song, as it would open not only the
    album but their feature film. The chord evolved throughout the morning and early
    afternoon, but it wasn''t quite there (like George''s solo, which would have to
    be set aside for another track). Martin pushed the button on the recording console
    and asked for one final run-through. As John started to count in, the producer
    realized that he had wanted them to return their instruments, but lunch was waiting
    and enthusiasm was waning, so he just decided to let it go. On with the show!


    Take 9 was fantastic, all thought, though a little work still needed to be done
    later—Harrison filled in his solo, which he heard in his head but hadn''t figured
    out how to play it perfectly yet, and the opening chord still needed something.
    Martin planned to come in later with just the sound engineer to add a bit bit,
    to make the opening chord grander, and perhaps a bit of a mystery. But everyone
    knew that things would never be the same. Yeah, yeah, yeah!'
