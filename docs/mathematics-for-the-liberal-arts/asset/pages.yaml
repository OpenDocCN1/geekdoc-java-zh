  md: '362


    Also, we can consider grows with $k$ onsets among $n$ possible ones by breaking
    them down into two cases—those for which there is an onset on the first possible
    onset, and for which there isn''t. If we choose the first possible onset as an
    onset, then we choose the remaining $k-1$ onsets from the $n-1$ possible onsets
    (all but the first); there are $C_{n-1,k-1}$ of these. If we don''t choose the
    first onset we choose the remaining $k$ onsets from the possible remaining (all
    but the first); there are $C_{n-1,k}$ of these. But we know there are many ways
    to select $k$ onsets from $n$ possible ones, so we see that the additive principle
    that


    ```

    $C_{n,k} = C_{n-1,k-1} + C_{n-1,k}$.

    ```


    This is what is known as a recurrence relation; the value of some function is
    given in terms of the values of “smaller” instances of the function and is typical
    of a general mathematical principle of reducing a problem to some previously solved
    (or) ones. For example, we know $C_{n,k}$ for all values of $n$ larger than 4
    and all values of $k$ (being between 0 and $n$, of course):


    In the future chapter you were introduced to the best known recurrence relation,
    the Fibonacci sequence 1, 1, 2, 3, 5, 8, 13, ...


    $C_{1,0} = 1 \quad C_{1,1} = 1$

    $C_{2,0} = 1 \quad C_{2,1} = 2 \quad C_{2,2} = 1$

    $C_{3,0} = 1 \quad C_{3,1} = 3 \quad C_{3,2} = 3 \quad C_{3,3} = 1$


    Then to calculate $C_{4,2}$, we use the recurrence relation to $C_{4,2} = C_{3,1}
