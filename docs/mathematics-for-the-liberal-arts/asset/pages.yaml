  md: 'Thus, for example, if you roll a die, a “three” comes up with probability 1/6
    (as do each of the other five numbers). If you pick a card at random from a well
    shuffled deck, the probability of getting any specific card, say the queen of
    hearts, is 1/52. When all outcomes are equally likely, the probability of something
    occurring is simply the number of relevant outcomes divided by the total number
    of outcomes. So, for example, the probability of drawing a heart from a deck is
    13/52 = 1/4, as there are 13 hearts in the deck, and each of the 52 cards is equally
    likely to be drawn.


    # Making It Count


    In a variety of settings all outcomes are indeed likely to occur, so in order
    to calculate probabilities the question centers on counting issues. Sometimes
    it is possible to count all objects by listing them, but then we want to know
    how many there are, and not list them. We''ll set aside some time right now to
    talk about how to count.


    Let''s start off with a simple example. If we toss a coin and roll a die, how
    many possible outcomes are there? We can think of this in two stages—we toss the
    coin, which has two possible outcomes, heads or tails, then roll the die. For
    each of the two outcomes of the coin, there are six outcomes for the die, so we
    get $6+6=2 \times 6=12$ many outcomes—we multiply the number of outcomes for each
    when we can do things sequentially. This leads to our first counting principle:


    > The Multiplicative Principle of Counting: Suppose you can break up your counting
    into a sequence of events, where you have $a$ ways to make your first choice,
    then, having done that, $b$ subsequent choices for the second event, then having
    done, $c$ subsequent choices, and so on. Then the total number of items is the
    product of all the different choices:


    ```

    $a \times b \times c \dotsdots$

    ```


    On the other hand, if we toss a coin or roll a die (but not)'
