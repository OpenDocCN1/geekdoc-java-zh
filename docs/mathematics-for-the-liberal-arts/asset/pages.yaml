  md: '# DECIDING TO MAKE THE BEST DECISIONS 283


    Similarly, B, C, D, E have Borda counts 87, 126, 24, 105, respectively. Under
    the Borda count system, the winner is the candidate with the highest Borda count,
    which here is candidate C. The Borda count takes into account not only every voter''s
    choice for a winner, but the rankings over all. As well, we not only declare a
    winner (or winners, if there is a tie at the top Borda count), but also a group
    ranking of candidates, by their decreasing order of Borda counts, with any tied
    candidates occupying the same position. So in our example, our group ranking,
    by Borda counts, is C, A, E, B, D.


    The Borda count system was developed in 1770 by the French mathematician Jean-Charles
    de Borda. It was used in a variety of settings, such as electing members of Parliament,
    an island in the South Pacific, as well as in sports, choosing Major League Baseball''s
    Most Valuable Player (MVP) award and U.S. college football''s Heisman Trophy.


    > The Borda Count System: From the voter profiles, calculate the Borda count for
    each candidate, summing the weights of the position of the candidate under each
    profile. The candidate with the highest Borda count is declared the winner (with
    a suitable adjustment when more than one candidate has the highest Borda count).


    As appealing as Borda counts, they can also have their problems. For example,
    consider the election results in Table 5.9 between A, B and C, along with their
    Borda weights:


    Table 5.9: Problem with Borda counts.


    | rank | 11 | 5 | Borda weight |

