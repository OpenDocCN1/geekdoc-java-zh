  md: '# DECIDING TO MAKE THE BEST DECISIONS


    # The Problem with Games


    Game matrices are useful ways to summarize the strategies and their outcomes for
    games, and you can sometimes do your reasoning with them. The actual way the game
    is played is not important once the possible strategies have been found—we only
    need to choose the best one from among them.


    Suppose we play a game where each of us chooses a number from the numbers 1, 3
    and 4 to shout out at the same time. If the two numbers add to exactly 6, you
    win 5 dollars from me. If they add to 7, no one wins anything. In all other cases
    you pay me 1 dollar. For example, if you shout out “1” and I shout out “4,” the
    sum is 5, not 6, so I win a dollar from you. On the other hand, if we both shout
    out “3,” the sum is 6 and I pay you 5 dollars. Here is the game matrix:


    | you shout out 1 | I shout out 3 | I shout out 4 |

    |---|---|---|

    | you shout out 3 | -1 | 5 | 0 |

    | you shout out 4 | -1 | 0 | -1 |


    What would you do? If you look at the game matrix, you see that your strategy
    to yell out “3” is always better for you, no matter what I do—that corresponds
    to the fact that in the game matrix, each value in the row for “you shout out
    3” is at least as good as, and sometimes better than, any other choice in the
    column. That means your second strategy dominates the others, and so you can remove
    the other dominated strategies as options—why would you choose a strategy that
    is never as good as another one?


    | I shout out 1 | I shout out 3 | I shout out 4 |

