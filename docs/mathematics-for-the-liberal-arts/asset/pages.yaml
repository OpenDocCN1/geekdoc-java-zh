    the choice of how to group your categories is up to the person wanting to present
    the data and his her goals in going so (more about this later).


    # Drawing the Line


    Bar charts are an excellent visual aid when you want to compare data values for
    different categories. Sometimes you want to emphasize the trend of the data over
    time. In such a case, it may be better to plot a line graph (or line chart), you
    plot points on a graph and connect them by straight line'
