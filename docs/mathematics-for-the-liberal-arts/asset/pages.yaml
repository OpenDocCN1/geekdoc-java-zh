    Now you might think to yourself, “I’m only interested in rock music, with four
    beats in a bar. Why should I even consider bars with five beats in them?” Well,
    the story you learn here is that if you want to count (or list) rhythms for bars
    of four quarter notes, you might need to consider bars of other lengths in order
    to build up to the ones in question (we might be ultimately interested in a bar
    divided into eight possible onsets). This is a lesson from mathematics you can
    carry on to all of your problem solving:


    > Life Lesson: Sometimes to solve a particular problem, it will solve other related
    problems, even if you aren’t interested in the latter.


