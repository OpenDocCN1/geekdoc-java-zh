  md: "There is yet another choice. Since the difference in percentages less than\
    \ or equal to each of 36 and 37 is $68.8 - 67.9 = 0.9$ and 68 is $68.0 - 67.9\
    \ = 0.1$ up from the lower percentage, 68 is $\\frac{0.1}{0.9} = 0.111 = 11.1\\\
    %$ along the way up from $67.9$ to $68.8$. So it would make sense to say the 68th\
    \ percentile is $11.1\\%$ along the way from 36 to 37. As the distance between\
    \ 36 and 37 is 1, we take as our 68th percentile\n\n# $36 + 0.111 \times 1 = 36.111$.\n\
    \nWhile this might seem like odd choice, it is really the way we define the median,\
    \ with the averaging of the two central numbers, if the number of data is even.\n\
    \n(This method of estimating a certain value between points in a list is called\
    \ linear interpolation. The idea is that if you want to move $x$ from $a$ to $b$,\
    \ where $a \\leq b$, then you take the value $a + (x/100) \times (b - a)$. The\
    \ value $x/100$ is as a decimal, and $b - a$ is the length of distance from $a$\
    \ to $b$. Linear interpolation is a very common method for estimating values between\
    \ data points—you calculate what percentage you move away from the left end's\
    \ $x$-value, and then move the same percentage from the left end's $y$-value toward\
    \ the right end.)\n\n![](img/a2a6f439c6e02b960b8f4c54a2a56513_70_0.png)\n\nFigure\
    \ 2.1: Linear interpolation between two points.\n\nPercentiles are the way SAT\
    \ test scores are evaluated, as it gives you the clearest indication of how you\
    \ fared compared"
