    We have discussed single numbers that describe data, but of course a single number
    can''t encapsulate the full scope of the data. For example, let''s compare two
    data lists:


    10, 10, 10, 10, 10, 10, 10, 10


    and


    5, 5, 5, 10, 10, 10, 10, 15, 15.


    A quick calculation will show that both lists of data have the same mean, median,
    and mode, namely 10 in both cases. clearly the data is drastically different.
    The first has all numbers at the mean/median, while the second has most values
    away from the mean/median/mode but the numbers are equally balanced on either
    side.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_71_0.png)


    > Figure 2.2: Two data sets with the same mean and median—the height denotes the
    number of times the value occurs in the data set. In the next chapter we''ll discuss
    more about the visual representation of the data.


    # Giving a High Five


    Clearly a single measure like the mean or median cannot distinguish between these.
    We need to find a way to distinguish them, perhaps with other sets of numbers.


    One approach is based on the median and percentiles. It uses a set of five numbers
    based on the data:'
