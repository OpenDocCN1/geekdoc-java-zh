  md: '324


    And the process is even more revealing. Suppose each of the line segments in the
    original simple curve in Figure 6.26 has length 1, so that the curve has length
    4. Then in each of the four scaled versions for the next replacement, each line
    segment has length 1/3, so we replace each of the original line segments with
    a figure that has length 1/3 + 1/3 + 1/3 = 4/3. The length is now 4(4/3) = 16/3
    ≈ 5.3, or 4/3 times the original length. The next repetition will have length
    4/3 times that of the previous one, so length 4(4/3)(4/3) = 4(4/3)^2 ≈ 7.1. At
    each iteration, you replace each line segment by a figure with 4/3 times the length.
    The lengths of the figures are therefore


    4, 4(4/3), 4(4/3)^2, 4(4/3)^3...


    As these numbers get as big as we, the length of the curve gets huge, even though
    it''s in a confined space. This is why it is impossible to accurately measure
    the length of a real-life coastline—it is very dependent on how you measure it.


