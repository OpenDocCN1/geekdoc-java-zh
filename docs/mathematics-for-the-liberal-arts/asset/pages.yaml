    and we''ll only pursue these in the exercises.)


    # Estimating Proportions


    Let''s begin with proportion. Suppose we want to estimate what proportion $p$
    of individuals in a population have a certain property—it might be a certain illness,
    a certain characteristic or a certain belief. To do so, we take a random sample
    of size $n$ from the population and count the number $\hat{x}$ with that property.
    Our point estimate for the population proportion for the property is $\hat{p}
    = \hat{x}/n$. For example, a Gallup poll took March 6–9, 2014 of a random sample
    of 1048 adults found that 566 believe global warming has already begun. Based
    on this sample, the point estimate for the number of adult Americans who believe
    global warming has already begun


