  md: '# Deciding to Make the Best Decisions


    The scientists are quite unanimous—the planet is warming. Ice is melting in the
    Arctic and Antarctic, with dire consequences looming down the road. Over the last
    hundred years the air and sea temperatures have risen about 1.4°F, with much of
    the increase over the last 30 years. The increase may not seem like much, but
    the trend is very worrisome.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_251_0.png)


    Some pundits on the far right say that global warming isn’t happening, and I think
    that they want the answer to be no. NASA’s website states that global sea levels
    have risen almost 7 inches over the last century, with the rate over the last
    10 years being almost double that in the last hundred years. NASA also indicates
    that since 1880, 20 of the warmest years have occurred since.


    That brings to record-breaking in general. If there was nothing affecting the
    weather, we would expect some natural variation in average temperature from year
    to year, for sure. If we were looking for record-breaking warm years, since 1880,
    of course 1880 would be such a year, as it was the first. The next year''s average
    temperature would be just likely to be higher than lower, if we were the only
    thing at play, and so the probability that it was record-breaking would be 1/2
    (as the average temperature in the third year would have to be 1/3 (the biggest
    of three). And so over the period 1880 to 2001 we would expect 1+1/2+1/3...+1/12
    ≈ 5.4 years. When I look up how many record-breaking years for average are there
    in this range, I find that there were 14, much more than could be expected by
    chance. Almost certainly there must be something going on.


    The cause of the warming is less certain, but the scientific community has good
    reason to believe that it is man-made, caused by greenhouse gas emissions from
    burning fossil fuels (and mankind is certainly addicted to the latter). In fact,
    the Intergovernmental Panel on Climate Change (IPCC), that back in 2007, was at
    least 90% certain of this fact.'
  merge: -1
  pgno: 251
- img_proc: true
  md: 'A worldwide consensus is needed on what can and should be done to remedy the
    situation.


    In 1992 the United Nations Framework Convention on Climate Change (UNFCCC) was
    formulated in Rio de Janeiro, and over 190 countries have signed on so far. The
    original document set no strict targets for each country limiting its greenhouse
    emissions, but the subsequent Kyoto Protocol and Cancun agreements did that, setting
    a 3.6°F limit to global warming from the temperatures before industrialization.
    But some major players have balked—the U.S. has signed but not ratified the protocol,
    and Canada has pulled out completely. With all that is at stake—extreme weather,
    rising ocean waters and increased flooding, drastic changes to animal habitats—why
    can''t the leaders make the right decision?


    Life is full of making decisions. What to eat for breakfast? What university and
    program to enter? What career to choose? Who to do? How to land a job? Where to
    live? And so on. Sometimes the decisions are for ourselves, sometimes we are in
    a competitive setting, and sometimes we need to formulate group decisions. We
    all want to make the best decisions we can, but we often decide—whether what is
    at stake is very little or a lot—by the seat of our pants, without any process.
    And later we look back and ask—could we have done better? That is what this chapter
    is about—finding out how mathematics can help us come to the right decisions.
    Not necessarily right for everyone, but for us.


    # Making the Right Choices for You


    We''ve we talked in the previous chapter about money and risk, neither by itself
    tells the whole story when it comes to making decisions.


    # Great Expectations


    In the simplest case we are often offered some random process, with the payoff
    being related to the outcome. For example,'
