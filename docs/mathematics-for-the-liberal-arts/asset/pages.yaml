    # 7.2 Mathematics of Composing


    We have seen the integral part that mathematics plays in our listening to music—from
    trigonometry functions in our perception of pitch and loudness to the use of small
    fractions and powers to describe notes and scales. Now, of course, the music we
    listen to needs to be composed. And again, mathematics plays a a role in the aesthetics
    of music. You’ll find that what often moves you emotionally is the underlying
    mathematics.


    # How Much Music Is Left to Be Written?


    One of the greatest writer’s blocks for musicians is the feeling that they have
    heard or written everything. Haven’t we been exposed to every sequence of notes,
    rhythms and harmonies? Some basic mathematics shows how far this is from the case.
    We’ll start with melodies.


    A melody is a sequence of notes that are sung or played by an instrument. These
    are the tunes we go around humming, if they are catchy; a simple melody might
    be


    E4, D4, C4, E4, D4, C4, G4, F4, E4, G4, F4, E4,


    which is the melody for the beginning of the nursery rhyme “Three Blind Mice.”
    Of course, this is a simple song, and the melody reflects that. We can see obvious
    repetitions, which is an elementary mathematical component of music composition,
    and more about that later.


    Any sequence of notes gives rise to a melody, though some would be more interesting
    and appealing than others. But aesthetics is in the eye, ear and mind of the beholder;
    some melodies that one would find difficult and hard to listen'
