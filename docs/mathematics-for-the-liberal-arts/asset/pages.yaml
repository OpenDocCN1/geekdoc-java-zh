  md: '# MAKING SENSE OF YOUR WORLD WITH STATISTICS


    | height (in.) | 76 | 78 | 81 | 82 | 85 |

    | frequency | 5 | 2 | 1 | 3 | 2 |


    Table 2.1: Example of a frequency table.


    You can do the same calculations from the frequency table that you can do from
    the original data list, recognizing that the frequency table is only a condensed
    form of the data, with no information loss (you could, of reconstruct the original
    data list from the frequency list, if you chose to do). So, for example, we can
    calculate the mean of the basketball heights by averaging all of the 13 numbers;
    alternatively, from the frequency table, we see that all of the heights is


    ```

    $5 \times 76 + 2 \times 78 + 1 \times 81 + 3 \times 82 + 1 \times 85 = 948,$

    ```


    so the mean is $948/13 = 72.9$. The median would be the seventh number in the
    ordered list, which we can see from the frequency table is 78. Finally the mode
    is trivial to read off from the frequency table, being 76.


    You''ll find that in many places where lots of data is given, the presenter summarizes
    by giving one of the mean, median or mode. Which is more meaningful? That is a
    difficult question to answer, but you should be aware that one or the other may
    not be representative of the data. For example, suppose we were looking at the
    income of residents in an area of town that is a mix of many low income earners
    and a few high income earners. For argument''s sake, suppose that there are 90
    residents who earn only $20,000 annually, but 10 who earn $1,000,000. The frequency
    table is:


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_67_0.png)


    | income (dollars) | 20 000 | 1 000 000 |

    | frequency | 90 | 10 |


    The mean income is


    ```

    $90 \times \20,000 + 10 \times \1,000,000 = \118,000,$

    ```


    which would be a misleading figure for the "central" income, as no one earns near
    this amount—a few earn more, but most earn much, much less! The median, $20,000,
    would be a better choice of a central number for the data, as most people in the
    region earn this amount.'
