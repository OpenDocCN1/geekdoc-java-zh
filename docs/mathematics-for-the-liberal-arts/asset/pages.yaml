    I put the ranks in the column; they run in reverse order to make the count of
    a candidate is the sum of all the weights for the candidate over all of the voting
    profiles. So in our example, for candidate A, there are eight profiles where A
    has rank 1, and hence Borda weight 4, so we add these 8 × 4 = 32 to A''s count.
    There are 5 + 13 = 18 profiles where A has weight 3, 4 + 8 = 12 where 9 where
    A has weight 2, and 0 where A has weight 0. Thus A''s Borda count is


    ```

    8 × 4 + 18 × 3 + 12 × 2 + 13 × 1 + 0 × 4 + 2 × 0 = 119.

    ```


    An easy way to get this is for each location of the candidate in the table, multiply
    the number at the top of the column (the number of votes of the candidate in this
    profile) by the number at the right (the Borda weight of the position) and add
    them up:


    candidate A’s Borda weight


    ```

    = 8 × 4 + 5 × 3 + 13 × 3 + 9 × 1 + 4 × 2 + 8 × 2

    = 119.

    ```'
