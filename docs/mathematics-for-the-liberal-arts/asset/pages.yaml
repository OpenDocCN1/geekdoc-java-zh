    each called quarter notes. (Half notes are half long as a whole note, and take
    up the time of two quarter notes.)


    Now this process of subdivision can be carried out further. Each of the quarter
    notes above can be divided into smaller, equal size subintervals. Most often,
    the subdivisions are into two equal parts (in classic rock) and four equal parts
    (modern rock, hip hop, rap and disco), those occasionally into three equal parts
    (slow blues, shuffle, swing). Musicians, when they write music, use a line at
    the top of a quarter note to indicate an eighth (which lasts as long as a quarter
    note) and two lines at the top to indicate a sixteenth note (which is half the
    duration of an eighth note, a quarter of the duration of a quarter note, and a
    sixteenth the duration of a whole).


    Music writers also group these together by joining tops for readability. Here
    is what it would look like to subdivide each note into sixteenth notes. You can
    continue to subdivide each note as needed.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_381_0.png)


    Figure 7.9: Whole note (the entire bar).


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_381_1.png)


    Figure 7.10: Quarter notes (each lasting 1/4 of the entire bar).


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_381_2.png)


    quarter note


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_381_3.png)


    eighth note


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_381_4.png)


    sixteenth note


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_381_5.png)


    Of course, seeing the mathematics suggests that we needn''t restrict ourselves
    to subdividing each note into two, three or four equal parts. How about five or
    more? It certainly makes sense. You''ll find very popular songs that do so. Why?
    It seems we have an innate ability to divide things into a small number of equal
    parts—into halves easily, into thirds a little less, and into fourths about the
    same, though we can simplify the latter by dividing in half and then half again.
    Dividing into equal fifths and sixties is difficult for most people, whether you
    are a musician or a listener. A complicated rhythm involves collections of these
    patterns and rests, or silences, of similar durations), but in each full bar the
    sum of the total durations must be equal to that of a whole note. To create a
    rhythm, you can freely choose where to strike or strum. For example, if the smallest
