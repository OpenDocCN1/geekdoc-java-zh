  md: '# Preface


    Mathematics for the Liberal Arts grew out of research that I carried out in 2004,
    applying Fourier transforms and logical reasoning to figure out how The Beatles
    played that wonderful opening chord of A Hard Day''s Night. The interest in the
    general public garnered by the discovery was quite overwhelming—who knew so many
    people, many who hadn''t seen mathematics since leaving high school, would so
    fascinating? The Beatles were an easy entrance way—I may have to explain to some
    people why math is important, but I never have to explain why The Beatles are
    important! Further work of mine on math seemed to resonate with many, and I started
    work on a book, Our Days Are Numbered: How Mathematics Orders Our Lives, which
    illustrates the role mathematics plays in everyone''s daily life. I also authored
    a monthly column in a newspaper on the same topic, and there was a lot of interest
    from the general public.


    And that got me thinking about the math for liberal arts courses. Having looked
    over a number of texts on the subject, I felt that the text I wanted write still
    hadn''t been written, and I set to task on it. I wanted to create a text focused
    on mathematics that undergraduates (and indeed likely not science majors) could
    take away from the course and continue to use outside university and college,
    in their professional and personal lives. So the topics I chose to cover stress
    this approach, ranging from conversion factors (a simple yet tool in life, I think),
    statistics, visualization, money and risk, to soften such fields as games, art,
    music and humor. The methods discussed aren''t meant to be learned and'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'xviii


    shaken out of the head after the final exam—I intend that students keep these
    skills, by practicing and applying them in their lives outside of the classroom.
    There is a movement to mathematics for liberal arts meets various quantitative
    reasoning requirements, and this text was also written with this mind. Other goals
    of the text are to develop a logical approach to data and reasoning that students
    might come across in life through the media and to continue to be-longer learners
    well beyond the confines of the course. For the most part, the chapters are self-contained,
    so the instructor can choose topics as desired.


    In particular, I feel that non-math majors need good reasons for keeping the math
    rather than throwing away. The best argument is to give them surprising ways that
    math can actually make them productive, but also more creative. Many people think
    that math and creativity are at opposite ends of the academic spectrum, but any
    mathematician—those who really know—will say otherwise. In fact, many mathematicians
    would consider their research as art rather than a science! Being a songwriter
    and guitarist as well as a mathematician, I know what an artist wants is a good
    idea. And adding a little math, taking a mathematical approach, can add just the
    innovative creative spark needed.


    I have just a few quick notes about the setup of the book. Each chapter opens
    with a relevant story, one that relates to the content of the chapter, and one
    I hope captures your interest. I try to build the suspense by drawing the story
    to a conclusion at the end of the chapter. I feel that too many math textbooks
    are only used as resources, only cracked open when a student needs to look something
    up. But I think that stories, real-life stories, are an excellent motivational
    tool for working through the math, and they show students exactly how mathematics
    can play a role in their lives. Besides, and many the students taking the courses
    are excellent readers, why shouldn''t the text play to their strengths as well?
    Marginal material should be read—often there are historical background and mathematical
    insights you won''t want to miss. There are white boxes with red outlines to indicate
    mathematical formulas or results that you''ll want to'
  merge: -1
  pgno: 18
- img_proc: true
  md: refer to. And, the light red boxes are what I call “Life Lessons”—these are
    principles, derived from the mathematical approach, that you might want to consider
    and put into practice in your life outside of this course. Finally, I have a companion
    website, www.jasonibrown.com/mla, that has a number of additional examples (even
    musical ones, that you can listen to) along with some one-of-a-kind software programs
    I have written to support the material presented on art and music.
