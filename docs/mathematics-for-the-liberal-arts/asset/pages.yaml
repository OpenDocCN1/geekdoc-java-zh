  md: '# 8


    15% tip, you can break it up into 10% and 5% tips. Calculating a 10% tip is very
    easy—you simply move the decimal place one spot on the subtotal (as multiplying
    a number by 0.10 has this effect). So a 10% tip on $42.00, that is, 10% of $42.00,
    $0.10 \times $42.00 = $4.20. And the additional 5% tip is simple half of that,
    as is 5% of 10%. So the 5% tip is $(1/2) \times $42.00 = $2.10, and you are pretty
    pretty good at taking half of a number in your head. The total tip is of the 10%
    and 5% tip which is $4.20+$2.10 = $6.30, and as promised, the calculation is simple
    enough to do without any help!


    The ability to take 10% of a number by moving the decimal place spot to the left
    is very, handy in many situations, beyond calculating. For example, if you are
    in a store that has a 20% off tag on an item costing $140.00, the dollar value
    of the discount does not require a calculator if you are “in the know.” You take
    10% of 140 by moving the decimal place of $140.00 to the left to get $14.00, and
    then double it to $2 \times $14.00$ to get 20% of $140.00, that is, $28.00. The
    price of the item is then $140.00 -$28.00 = $112.00.


    1% of a number is just as easy—move the decimal places to the left. So, for example,
    1% of $7.00 is 0.07, that is 7 cents, and 10% of $1.250 is $10.250, that is, $10.26,
    when round to the nearest cent.


    Not hard! And even if numbers get jumbled in your mind, feel free to round a bit
    to get an estimate. So had the tag been 20% off on an item costing $139.50, I
    could take $13.95, which I would then round to the nearest dollar, $14.00, and
    then double to get $28.00, as before. The answer wouldn''t be exact of course,
    but close enough (I''d be off by a dime).


    And had the discount 27% on the original $140.00 item? Sans Carlos, I could do
    one of two things:


    +   - I could round the discount up to 30%, and then proceed by taking 10% of
    $140.00 to get $14.00, and then triple it in my head to get $3 \times $140.00
    = $42.00, or


    +   - I could round the discount down to 25%, and then proceed by taking 10% of
    $140.00 to get $14.00, and then double to get $2 \times $140.00$ = $28.00 and
    add in 5% more, or half of 10%, which is $7.00, to reach a discount of $35.00.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_32_0.png)


    20% discount means that you pay only 80% of the sticker price, a 30% discount
    corresponds to 70% of the sticker price, and so on.


    Estimation is such a crucial life skill that you should employ (and practice it)
    whenever and wherever you can, if to check the reasonableness of the number calculated
    or presented.


    The actual discount is somewhere between $35.00 and $42.00. That gives you a pretty
    good idea of the discount.'
