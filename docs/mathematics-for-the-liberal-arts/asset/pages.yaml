    Working with present and future values, you can al-ways from first principles
    (as opposed to first principals!), remembering how interest is calculated, and
    I recommend that you do so as often as you can. But for those who like formulas:


    The present value of A dollars, in t periods, at a rate of i (percentage, written
    as a decimal) per period, under simple interest, is


    P$ = \frac{A}{1+i} dollars


    while under compound interest, it is


    P$ = \frac{A}{(1+i)^t} dollars.


    # Making Installments


    In addition to making a straight-up investment for a period of time or taking
    out a one-time loan with a single payment at the end of the loan, what often happens
    in practice is that either you aside money each time period and put it into an
    investment account to grow, or you repay your loan with installment payments.
    Both of these are really the same thing—all that differs is who pays and who gets
    paid!


    So let''s use an example. Suppose you decide that you will aside $100 every month,
    for the next 5 years, deposited into an account that pays 9% interest, compounded
    monthly. Figure 4.2 shows the timeline for the deposits. There are $12 \times
    5 = 60$ deposits, of $100, over the 5 years. Without any interest, there would
    be $61 \times $100 = $6100 in the account after 5 years (there are not 60 but
    61 deposits as you deposit at the beginning of each month, including the first
    and sixty-first, at the end). What does the compound interest add?


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_197_0.png)'
