  md: '# Back to the Present


    We can turns on their ears and ask: what is the present value of future money?
    What is the value of $10,000 10 years from now, if the interest rate is 9% per
    year? Here a mathematical viewpoint points clear—the present value should be the
    principal P we should invest right now to leave us with A = $100,000 10 years
    from now. Under simple interest, we have seen that $A = P(1+i)$, so with $A =
    100,000, i = 0.09$ and $t = 10$, we find that the present value P must satisfy


    ```

    100000 = P(1+0.09(10)),

    ```


    so, solving for P, we get


    ```

    P = \frac{100000}{1+0.09(10)} = 52631.58.

    ```


    As a check, if we invest $52631.58 for 10 years at 9% per annum, with simple interest,
    we will have, at the end of years,


    ```

    $A = P(1+rt) = 52631.58(1+0.09(10)) = 52631.58 \times 1.9 = 100,000$,

    ```


    as desired. Thus the present value of $100,000, under this scenario, is $52631.58.


    What about compound interest? The math is pretty much the same, only a bit more
    complicated. In this case, we have $A = P(1+i)^t$, so with $A = 100,000, i = 0.09$
    and $t = 10$, we have


    ```

    100000 = P(1+0.09)^{10},

    ```


    so, solving for P, we get


    ```

    P = \frac{100000}{1.09^{10}} = 42241.08-after all,

    ```


    Checking once again, if we invest $42241.08 for 10 years at 9% interest per annum,
    with compound interest, we will have, at the end of 10 years,


    ```

    $A = P(1+r)^t = 42241.08(1+0.09)^{10} = 52631.58 \times 1.9 = 100,000$,

