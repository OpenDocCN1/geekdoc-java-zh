    > 93/109 = 85.3\%


    so you are at the 85th percentile.

    Suppose, on the other hand, we want to find the 68th percentile, that is, the
    number that 68% of the data is less than or equal to it. Now 68% of 109 is


    > 0.68 \times 109 = 74.12


    so we are looking for the 74.12th number in the ordered list of 109 numbers, so
    we clearly need to either the 74th or 75th number.


    +   * If we take the 74th percentile, 36, we get 74/109 = 0.679% of the numbers
    less than or equal to it.

    * If we take the 75th percentile, 37, we get 75/109 = 0.679 = 68.8% of the numbers
    less than or equal to it.

    * We have a choice to make. We can either

    * take 36 as the 68th percentile, as it gives the closest percentage to the desired
    68%, though it is a little short, or

    * move up to 37 as the 68th percentile, as it is the first value that has at least
    86% of the numbers less than or equal to it.'
