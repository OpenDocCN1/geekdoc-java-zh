    segments. For example, the data of the home runs hit by home run leaders from
    1962 to 2001, given in Table 2.2, is shown with a line graph in Figure 3.6.


    Line graphs are excellent for seeing trends over time. In Figure 3.6 we can see
    that up to 1997, the values vary a fair bit, what seems to be randomly, around
    45 home runs per year, but the number of home runs hit by the leaders in 1998,
    1999 and 2001 are away outside the norm. We point out that the vertical axis starts
    at the lowest value in the data, rather than at 0. It is a matter of choice and
    emphasizes the range (and the outliers). Sometimes this is appropriate, sometimes
    not, as we''ll see in the next section.


    # A Piece of the Pie


    Bar charts and line graphs are very good when one wants to illustrate the changes
    in value between categories and over time, and where the actual values are of
    prime importance.'
