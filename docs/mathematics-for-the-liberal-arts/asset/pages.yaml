  md: '# MAKING SENSE OF YOUR WORLD WITH STATISTICS 77


    extreme or more extreme, just by chance, if the null hypothesis holds. The details
    are more involved than we want to go into here. But what is important is the idea—a
    small p-value is a good indication to reject the null hypothesis. How small is
    small? The smaller the better!


    The choice of the use of "p" in "p-value" is rather unfortunate, as we have used
    p before stand for a population proportion, but it is standard, and there are
    only so many English letters to go around!


    To err on the side of caution, we want to limit the probability of a Type I error,
    by rejecting the null hypothesis when it is, in fact, true—this may happen be
    rare (the probability of a Type I error is called the level of significance).
    How rare? The standard we have seen—only 5% of the time (though we are even wary
    of the implications of rejecting the null hypothesis, we might take "rare" to
    mean at 1% of the time). Having calculated a p-value of 0.0395 would give good
    evidence that the null hypothesis should be rejected (that is, we reject the null
    hypothesis at the 0.05 level of significance), and we should embrace the alternate
    hypothesis, and we should do so with more vigor if the p-value were smaller, say
    even more unlikely, the null hypothesis to be true. On the other hand, if our
    p-value were 0.254, this would be above our threshold of 0.05 (or in more extreme
    cases, 0.01) for rarity, and we would only be able to say that we couldn''t reject
    the null hypothesis. It is really important to realize that this is not the same
    as saying we state the null hypothesis is true—we only can commit to saying we
    don''t have evidence to say it is false. It may be false, but we don''t have enough
    to go out on a limb and say so.


    Unlike the diabetes example, we often don''t know the population statistic. Then
    the gold standard for proving a cause and effect (and really the only convincing
    to scientists and statisticians) is to carry out a randomized control trial, where
    a large sample from the population is broken into two groups randomly—one receives
    new treatment, the other (the control group) and we compare a given statistic,
    such as proportion or mean, for both samples. As long as the samples are large
    (usually this means at least 30),


    +   the difference between proportions approximately follows a normal distribution,
    and'
