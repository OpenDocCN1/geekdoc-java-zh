    \n**Definition 1.2.2.** Two objects are geometrically similar if they have the\
    \ same shape, that is, one is a scaled version of the other. For a group of geometrically\
    \ similar objects, any easy to measure quantity is called a characteristic dimension\
    \ for the objects.\n\nCircles are geometrically similar, as are squares, while\
    \ rectangles are not (long rectangles have a different shape from squares, which\
    \ are rectangles). A characteristic dimension for a circle is the radius (the\
    \ diameter or circumference) would do as well); for a square, the side (or the\
    \ diagonal) would be a characteristic dimension. These characteristic dimensions\
    \ are all of dimension 1, as they have a length and no width. One of the key facts\
    \ is that if we have a group of geometrically similar objects with a characteristic\
    \ dimension, say $x$, of dimension 1, then\n\n+   * an object's area is proportional\
    \ to $x^2$, the square of the characteristic dimension, and\n\n+   * an object's\
    \ volume is proportional to $x^3$, the *cube* of the characteristic dimension.\n\
    \nSo, for example, the area of pizzas (which are geometrically similar, as they\
    \ all have the same shape) is proportional to the square of the diameter, a 1-dimensional\
    \ characteristic dimension for circles. We had decided to make instead square\
    \ pizzas (which are geometrically similar), we would find that the area of the\
    \ pizzas would be proportional to the square of the length of a side, a 1-dimensional\
    \ characteristic dimension for squares. And again, were we to double the characteristic\
    \ dimension for square pizzas, say double the length of the sides, the areas would\
