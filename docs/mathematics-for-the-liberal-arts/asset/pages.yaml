  md: 'For the following steps the nurse oriented the bag to read the multi-line label
    and used the calculator to check total dose, daily dose, and hourly dose calculations
    for internal consistency. The nurse did not use a piece of paper to write it out;
    the algebra was done in her head and the math on the calculator.


    What makes even a bigger impression is that a second nurse checked the first nurse''s
    calculations, or at least she tried to:


    Although it was determined that a number of factors came into play, one finding
    hits a nerve: “Nursing staff were required to complete a complex calculation to
    convert total dose in mg over 4 days to a rate in mL per hour.” But the calculation
    was not complex, if you know conversion factors.


    The dosage of drug ordered was 5250 milligrams (mg) to be administered intravenously
    over 4 days. The delivery rate of the solution needed to be entered into the medication
    pump in milliliters per hour (mL/hr). The vials contained 500 mg of the drug in
    10 mL of liquid. Therefore, the infusion rate in mL/hr needed would be


    $$\frac{5250\text{ mg}}{4\text{ days}} \times \frac{10\text{ mL}}{500\text{ mg}}
    \times \frac{1\text{ days}}{24\text{ hr}} = 1.1\frac{\text{mL}}{\text{hr}}$


    The nurses actually programmed the medication pump to infuse 26.25 mL, per hour
    of medication, exactly 24 times the required delivery rate—they left out the conversion
    factor from hours to days. Had they only written out the calculation as we have,
    with the units, they would have arrived at the correct rate.


    While the findings of a root cause analysis of this incident includes this faulty
    bedside calculation as only one of 15 errors that, together, caused this woman''s
    death, could Ms. Melanson really have died from a lack of basic conversion skills
    among health care providers?'
