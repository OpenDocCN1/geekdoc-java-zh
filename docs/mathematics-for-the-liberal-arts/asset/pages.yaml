    # Sampling from the Menu


    Certain things seem clear from the example:


    +   - Had we taken a smaller sample, we would expect the estimate to be less reliable.


    +   - Had we taken a larger sample, we would expect that the point estimate would
    be closer to the true value (and we had contacted every person in question, we
    would have found the answer for certain!)


    +   - If we contacted individuals completely at random, we would get the best
    estimate for the sample size.


    So we have a number of issues to deal with. First, let''s examine how best to
    choose a sample from a population to study. There are a number of general approaches
    that we can take:


    +   - We can choose a sample purely at random—this process is called simple random
    sampling. In days of old, before computers, one used tables of random numbers,
    but nowadays, many programs have built-in procedure to generate random numbers,
    and one can use these, together with a list of the population, to choose the sample.


    +   - We can break up the population into subgroups or *strata* (from the Latin
    word *stratum* for layer) and then choose within each group a random sample—a
    method called stratified sampling. The key to this is to make sure that those
    in a subgroup are homogeneous, that is, they are alike in some important way.'
