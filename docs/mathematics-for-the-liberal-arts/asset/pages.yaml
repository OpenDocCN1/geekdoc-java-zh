    food at the concession stands.


    Now having sampled from a population, you would calculate some statistic for your,
    like a proportion, median, standard deviation, or some other number (such a value
    is called a **sample statistic** and varies from sample to sample, while the actual
    value for the whole population, the **population statistic**, doesn''t vary at
    all). For example, suppose in the previous stadium example, you took a simple
    random sample of 200 attendees and found that the proportion of those who spent
    at the concession stands that day was 67%. You would assume that the proportion
    of all attendees who spent money at the concession stands? Of course not. You
    would think it might be pretty close to 67%, but would be shocked if it exactly
    67%.


    So while our estimate for the proportion of those who spent at the concession
    stands is 67%, we have to think that we need some wiggle room—saying that the
    proportion of all attendees who spent at the concession stands is 67% is almost
    surely incorrect. So we give what is called a **confidence interval** for the
    statistic, that is, we give a range, around the sample statistic, for which we
    have some level of confidence of the population''s statistic lies in. In our stadium
    example, it might be


    > You would also expect if you took more random samples of 200 people that the
