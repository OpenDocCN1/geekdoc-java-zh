    Fractals have a property called self-similarity—the figure is made up of several
    scaled versions of the whole picture. The picture in Figure 6.28 is made up of
    four scaled versions of the figure itself. It seems so unintutive and paradoxical—having
    an object made up of smaller versions of itself—these kinds of fractals are not
    only all around us, but they are among the objects we find most beautiful, perhaps
    exactly for their self-similar properties!'
