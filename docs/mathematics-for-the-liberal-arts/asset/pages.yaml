    # Feel the Rhythm of the Beat


    **Rhythm** is inherently mathematical. Just as we divide up an octave into two
    equally spaced frequencies (the notes of the chromatic scale), we can divide up
    time into variously equal intervals. We can feel and enjoy the periodic pulses
    from doing so, and the various patterns we can derive by repeating rhythms can
    drive us to sit up and listen or when we get on our feet and dance. It''s the
    mathematics in the beats that makes us go gaga (even if we aren''t Lady Gaga).


    For example, in a lot of western music (like rock ‘n’ roll) a musical time interval
    (called a *bar* or *measure*) is often divided up into four parts (see Figure
    7.8).


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_380_0.png)


    Figure 7.8: Musical bar, and the bar divided into four.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_380_1.png)


    If we strike a drum, strum a guitar or pluck a bass at the beginning of each interval
    (called a *beat*), we feel a rhythm, a pattern (the > symbol below shows each
    beat’s start, often an *onset*). For many popular songs, you can feel the bass
    note played on each of these four beats. The pattern repeats, the more ingrained
    it is in our minds.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_380_2.png)


    If we let the duration of a whole bar be “denoted” by a *whole note*, then the
    duration of each of the four equal notes, which last a quarter of the entire bar,
    is a quarter of the whole; they are'
