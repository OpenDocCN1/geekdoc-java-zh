    +   -15% of 0 is f(0) = 0.15(0) = 0.


    +   - If f(x) = 450, then 0.15x = 450, so x = 450/0.15 = 3000, that is, if 15%
    of an unknown amount is 450, then the amount must be 3000.


    +   - If y is an amount that 15% of it was 125, that is, f(y) = 0.15y = 125, then
    15% of twice that, 2y, would be f(2y) = 0.15(2y) = 2(0.15y) = 2f(125) = 250.


    Viewing the process as a function focuses more on the process than the numbers
    themselves. And we see that the notation of functions allows us to concisely write
    down the given information, and to solve for what is unknown.


    While functions often produce from a single numbers other, it need not to be single,
