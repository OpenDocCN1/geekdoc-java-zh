  md: '342


    where $A$ is the amplitude, $\pi$ is our good friend from the area of a circle,
    $f$ is the frequency in hertz, and $t$ is time (in seconds). So, for example,
    the function $1.3sin(2\pi \times 330 \times t)$ has amplitude 1.3 and frequency
    330 Hz, while the function $0.7sin(200\pi t)$ has amplitude 0.7 and frequency
    100, as we can rewrite it as $0.7sin(2\pi \times 100 \times t)$.


    People don''t tend to listen to tune pure tones—they sound too simple. All musical
    tones are made by adding together sine curves, and these combinations give us
    the sounds we hear, from the sweet texture of a flute to the rough crunch of a
    rock guitar chord. By combining sine curves we get repeating patterns that not
    only our ears can appreciate, but our eyes as well. Figure 7.3 shows an example
    of the function of a few such sine curves. The resulting function repeats, but
    its shape is fascinating.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_366_0.png)


    Figure 7.3: Plot of $0.5sin(2\pi \times 220 \times t) + 0.4sin(2\pi \times 330
    \times t) + sin(2\pi \times 440 \times t)$. The mathematical function does indeed
    have a sound!


    Piano tuners inherently use trigonometry to tune pianos! In a piano, there are
    three strings under each hammer (but not all, more about this here later) that
    ring at the same frequency when a key is struck. I say at the same frequency,
    but it is up to the tuner to tune them identically. Once the piano tuner has tuned
    one'
