    # Visual Trickery


    Just as one can be taken the garden path with statistics, one can be misled, perhaps
    even more easily, with graphics, as we feel that our eyes never lie! Here are
    but a few ways to be misled by mathematical pictures:


    +   1. Presenting the work. The type of plot chosen for given data is dependent
    on what type of point the presenter wishes to make. So, for example, it would
    be misleading to present the following pie chart for the world happiness data
    in Table 3.1, even though it is a perfectly good pie chart. The issue'
  merge: -1
