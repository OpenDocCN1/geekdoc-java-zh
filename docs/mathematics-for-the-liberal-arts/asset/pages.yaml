  md: 'Sports is rife with statistics—baseball home runs, runs batted in, batting
    average; hockey has goals, assists, goals against average; basketball points per
    season, points per game, assists, rebounds, and so on. All of these are used to
    compare players or teams against one another. But there is a statistic to garner
    how much a player is worth to a team? In the fall of 2011, Sydney Crosby, the
    hockey player for the Pittsburgh Penguins, was out of action, after a few concussions,
    with the worst being Washington Capital''s David Steckel- blindsided shoulder
    to Sydney''s head. The loss of Crosby affected not only the Penguins, but hockey
    itself. Is there a way to quantitatively evaluate how costly the loss of Sidney
    was to the Penguins?


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_84_0.png)


    Figure 2.10: Pittsburgh Penguin''s Sydney Crosby (a.k.a. Syd the Kid).


    $winning percentage = \frac{S^2}{S^2 + A^2}$


    You might recognize the denominator of the fraction as looking like the Pythagorean
    formula from the sum of the squares of the other two sides. Because of this similarity,
    the formula is often called the Pythagorean winning percentage. If you examine
    the formula, you''ll see that increasing the runs scored, or decreasing the runs
    allowed, increases the winning percentage, as it should.


    On the surface it sounds like it would be impossible to predict the percentage
    of games won from the runs scored and runs allowed, as in any given game, you
    could score more runs than you need to win, and get only one win, and in another
    game you could lose badly and still it''s only one loss. Yet we are talking not
    about a single game, but the sum total of all the games in a long season, and
    this is where statistics comes to the fore. Perhaps surprisingly, the formula
    actually works well for baseball teams, giving results that are almost always
    within 5% of the true value.'
  merge: -1
  pgno: 84
- img_proc: true
  md: 'The formula can be carried over to many other goal- scoring team sports, such
    as basketball, football and hockey. So here is a Pythagorean descriptive statistic
    for predicting the number of games won by a hockey team during an 82-game season,
    based on the number of goals scored (S) and goals allowed (A):


    ```

    games won = 82 \times \frac{S^2}{S^2 + A^2}$

    ```


    Tie games are ignored, but the formula seems to work well enough as is. For example,
    in the 2006-07 season, the Penguins scored 267 goals and allowed 240, with 47
    games won. The Pythagorean formula would predict, just on the goals scored and
    allowed, that they would have ended up winning


    ```

    82 \times \frac{267^2}{267^2 + 240^2} = 82 \times \frac{7921}{14321} \approx 45

    ```


    games, so we are pretty close with the prediction.

    Now how did Sidney''s 120 points contribute to the Penguin''s success? Without
    those, the team would have scored 120 fewer goals, and the Pythagorean formula
    suggests the team would only have won about


    games, so having Sidney on the ice added about 25 wins to the season! In the 2006-07,
    2008-09, 2009-10 seasons (I didn''t include Sidney''s rookie year the one when
    he played significantly less than 82 games), the formula predicts that in each
    of these seasons, just based on his offensive output, Sidney added at least 20
    wins per season to the Penguins. The Pythagorean descriptive statistics shows
    that hockey''s valuable commodity of wins, Syd the Kid is a top broker—his scoring
    is the difference between the Penguins being at the ceiling or the basement of
    the league.


    The Pythagorean winning percentage is only an approximation of Sidney''s contribution
    to the team—of course, if Sidney is not playing, other players would get more
    playing time, and undoubtedly at least some goals would be scored.'
