    # Estimating Unknowns


    Sometimes we have all of the data available. For example, you might be able to
    see the test score of everyone in your class. You might find a website that has
    bat for every player on your favorite baseball team. You might know the incidence
    of heart disease in your extended family. Often, the entire group from which you
    want to gather data is enormous—much too big to actually gather the data, or the
    gathering process might be difficult. For, perhaps you have a project where you
    need to know the income of everyone in the United States or the cancer rate among
    residents in a county. Time and money prevent you from doing what would really
    give you the truest picture—canvassing everyone, the whole **population**, everyone
    under consideration.


    It is here that mathematics comes (yet again!) to the rescue. What you can do
    is pick a representative **sample**—a subset of the population—and take data from
    it. Provided this is done properly, statistics allows you to generalize results
    from the sample to the whole population with high accuracy. Such predictions are
    called **point estimates**. An example will make clear, I hope.'
