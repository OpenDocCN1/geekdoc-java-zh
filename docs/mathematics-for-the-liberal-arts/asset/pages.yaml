    > The Instant Run-Off System: From the voter profiles:


    * If there is a candidate who has a majority of the first place votes, that candidate
    is declared the winner.

    * Otherwise, the candidates with the lowest number of first place votes are removed
    from each profile, and the candidates below the removed candidates are moved up
    one position on each profile, to form the reduced voter profiles.


    The process is repeated until a winner is declared.


    So all of our proposed systems—plurality, Borda counts, Condorcet winners and
    instant run-off—all suffer from some serious problems when we have at least three
    candidates. Perhaps there is lurking, somewhere out there, a better system, one
    that will meet some very basic requirements that we feel any voting system should
    have?


    # An Arrow to the Heart of Vortex


    Economist Kenneth Arrow was interested in group voting that led to a group profile
    (that is, preference list) from individual voter profiles. He proposed in 1951
    a few rules for a voting system that seemed obvious and even essential for fairness:'
  merge: -1
  pgno: 311
- img_proc: true
  md: '+   1. (universality) Other than the fact that everyone was to rank the candidates,
    there were no other restrictions on how this was to be done by each voter (although
    the rankings were to be transitive, as described earlier: if voter X preferred
    A to B (that is, ranked A higher than B) and to C, then she preferred A to C).


    +   2. (unanimity) If every voter prefers candidate A to candidate B, then the
    voting group should prefer A to B.


    +   3. (non-dictatorship) There shouldn''t be a person X whose preferences completely
    determine the group''s preferences. That is, it shouldn''t be the case for some
    person X, whenever X prefers candidate A to candidate B, so does the group.


    +   4. (independence of irrelevant alternatives) The group''s preferences between
    two candidates A and B should only depend on each of the voters'' preferences
    between A and B, and not on individuals'' involving other candidates.


    Perhaps the only one that is unclear is the last one, the independence of irrelevant
    alternatives. What this rule says is that when trying to decide whether the group
    should rank A higher than B or not, all that should matter is how each person
    ranks A compared to B; it shouldn''t make any difference how individuals rank
    A with respect to some other candidate C, how B is ranked by voters with respect
    to C, or how C ranks compared to other candidates different from A and B.


    These four principles seem natural, desirable and even required if we are to form
    a voting system for group rankings from individuals'' rankings, right? What Kenneth
    Arrow proved that it was impossible to find any voting system that met rules 1-4!
    It''s not that we can''t find any such voting system—no one, and no one will ever
    be able to, if we need these few rules to be satisfied. So once again, we see
    that there are intrinsic problems with trying to decide how groups should vote
    based on the voting of each person.'
