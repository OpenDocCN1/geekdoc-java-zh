    # How You Value What You Value


    How much more do you prefer $2,000,000 than $1,000,000—twice as much? Wouldn''t
    you value the former much more than the latter, a million dollars might be more
    than enough, while some would value much twice as one, if they absolutely needed
    two million right away and one million wouldn''t do. And what do we do about ranking
    things like security and happiness, which don''t have dollar amounts? Sometimes
    we need to make a choice between money and love.


    And in terms of risk, would you accept a risk of 10% of dying? It probably depends
    more than the risk. If it is a risk jumping from the roof of a three-story building
    to the grass below for, probably not (I hope!). But if it were to save a loved
    one in the way of a runaway car, I would think then yes! So we make our decisions
    based on some combination of risk and benefit, and that is what we want to formalize,
    mathematically, to have a process for making rational decisions. We begin with
    one approach that has been formulated, but first we need to examine exactly how
    we value (and ought to value) things.


    Mathematicians and economists often attach to each individual a utility scale
    for measuring how much they value items, objects or experiences. Formulating such
    a scale is personalized—each person can value things differently, and there is
    no concept of an irrational value attached to something. For example, you could
    value getting a graduate degree much higher than someone else would, and value
    it differently from how you value say $50,000. We only want our utility scales
    to satisfy a few rules:


    +   To every object under question, we need to assign a real number, indicating
    its worth to us.'
