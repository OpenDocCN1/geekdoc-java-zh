    numbers are chaotic, they bounce around a lot, and are very sensitive to the number
    of digits of accuracy I choose to use. Even using a better computer with more
    digits will not significantly help—eventually the problem will return its ugly
    head if I iterate enough.


    Real-life problems like predicting the weather, the stock market, or whether you
    will avoid accidents down the road all suffer from this problem. The outcomes
    depend on the effect of many, many processes repeating, and the inherent problems
    of small errors (which we can usually ignore when we do calculations) add to seeming
    unpredictability. Perhaps randomness, in these cases, is our best mathematical
    approximation to what is going on. On the other hand, randomness is indeed a fact
    of life. Chances we won''t find out the answer.


    # Tomorrow Never Knows


    And there are even mathematical limits to what mathematics can prove! Some work
    pushes right up against these limits. French mathematician Pierre de Fermat (1601–1665)
    claimed in the margin of a book that he had a proof that any positive integer
    $n \ge 3$ there were no integer solutions to the equation $a^n + b^n = c^n$. Hundreds
    of years until mathematician Andrew Wiles, in 1994, completed a deep, complicated
    proof.


    And nowadays some mathematical proofs seem to be beyond human hands, requiring
    the assistance of computers. The Four Color Problem, which arose in the 1800s,
    states that for any possible map you can draw, if you want to color the countries
    so that four colors are always enough. The problem was finally settled in the
    affirmative by Appel and Haken in 1976, but only after reducing the problem to
    over 1900 cases and using computers extensively to handle each case. There is
    no known “short proof without computers, and it seems likely that some proofs
    in the future, of important and interesting conjectures, will require more than
    a human touch.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_429_0.png)


    But finally, there are some statements in mathematics for which will never be
    able to tell us they are true or not. For example, there is a notion of different
    sizes'
