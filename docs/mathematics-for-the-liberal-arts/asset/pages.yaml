  md: 'EVERYONE LOVES MUSIC. The best songs have the power to move you emotionally,
    from the depths of despair to the heights of ecstasy. You might think that nothing
    could be further from music than mathematics, but you would be wrong, wrong, wrong!
    Musicians use more mathematics when they play, record and write practically than
    any other professional. And the music we find most intriguing to listen to music
    that is filled with interesting and wonderful patterns. Mathematics has often
    been called the science of patterns, and with a wee bit of mathematical knowledge,
    you can better appreciate the music you enjoy.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_364_0.png)


    # Mathematics of Listening


    It is quite amazing how our perception of music is so intrinsically mathematical.
    And that does not depend on age, gender, culture or even mathematical ability.
    We humans are just built to appreciate the math in music, and that appreciation
    infuses both our listening and composing music. Naturally, listening and composing
    influence one another, but to begin, let''s examine how we listen to music. You
    will see how integrated mathematics is in the development of basic music elements
    like notes, scales and rhythm. And you''ll learn some details about what notes
    and scales are, and how they developed. Even if you are a seasoned musician the
    mathematical view of music will teach you some new tricks.


    > “Triggering” on how we will hear


    We can''t separate out from hearing. Every sound is caused by the vibration of
    air molecules moving back and forth in succession, and our ears and minds are
    built to recognize and respond to vibrations. Musical sounds are made up of pure
    tones, which correspond to objects vibrating in a wave-pattern.


    You will find relevant musical examples and useful soft-ware for this chapter
    at www.jasonbrown.com/mla.


    The wave for a pure tone is exactly the sine (and cosine) curve you saw back in
    high school. If only teachers had that trigonometry was the basis for all music!
    Listening to music depends deeply on our inherent ability to


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_364_1.png)


    Figure 7.1: Simple sound wave.'
