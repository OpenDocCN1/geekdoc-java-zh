  md: 'But back to the situation at hand. The pilots were in a predicament they had
    never envisioned—flying a Boeing 767 with no fuel and no power. A giant metal
    glider in the sky, descending down, down to earth. Who was to know that the catastrophe
    in the making was made due to a small, albeit, crucial mistake? The lives of almost
    70 people were in the balance, and all that stood between them and a fury demise
    was the skill of the crew. And all because of a mathematical error . . .


    You''ve been exposed to the notion of a number since you were a toddler. Counting
    on your fingers, counting with numbers, and measuring with fractions and decimals.
    And of course, along the way, you learned to construct other numbers from the
    ones at hand—adding numbers, subtracting numbers, multiplying numbers, dividing
    numbers. Then you found it convenient to have general rules for building new numbers
    from old—functions. The level of abstraction grew, but at the heart of the matter
    were very common life situations where all of the concepts were invaluable, and
    sometimes critical. This chapter will revisit some basic notions and show how
    a deeper understanding of numbers and functions can make a big difference in your
    life.


    # Found in Translation


    MATHEMATICS IS A LANGUAGE UNTO ITSELF. It has its own terminology, its own syntax,
    its own rules, its own written notation, its own expressions. And like any other
    language, you can translate everyday concepts into the language of mathematics,
    and conversely, translate mathematical language into everyday concepts.


    In order to properly figure out the arithmetic that surrounds you, you will need
    to be able to translate phrases in spoken language into the appropriate mathematics.
    There are some keywords in everyday speech that translate into arithmetic, and
    these are worth memorizing. (Don''t worry, there are only a few of these. I once
    had a math professor who told me he went into mathematics because he had a bad
    memory!)


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_30_0.png)'
