    # Making Joint Decisions


    We''ve seen how to take into account value and risk for our own decisions, and
    how to compete, but what about decisions we need to make in a group? That group
    may be a family, a sports team, a student council, a government body or a nation.
    The question remains—on what principles and with what process can we make joint
    decisions? Here we are interested in coming to some agreement as to what a *group*
    is, everyone having a vote, a choice to make individually. How do we put together
    the votes forms the basis for this section.


    If fairness is not the goal, there are lots of ways to make decisions. One way
    is to have a *dictator*, someone who decides for everyone. This is how many countries
    operate. One step away from this is to assign votes to individuals, but not the
    same to each. This works out if you want to give the illusion of democracy but
    really have something closer to a dictatorship. For example, suppose you and a
    friend are camp counselors in charge of a group of seven young children. Giving
    each child a single vote but giving yourself and your colleague each four votes
    may appear fair, and no one is a dictator, but in reality, you and your colleague
    together hold a majority of


