  md: '# MAKING SENSE OF YOUR WORLD WITH STATISTICS 79


    +   - For those viewing boxes where the spokes-characters were making contact
    with them, viewers reported that they felt a greater connection with the cereal
    a p-value of 0.05, and feelings of trust with the cereal were just a bit higher,
