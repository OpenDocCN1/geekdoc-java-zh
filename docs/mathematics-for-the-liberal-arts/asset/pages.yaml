  md: '130


    The critical observation is the following. If a graph has an Eulerian circuit,
    then for every vertex $v$ except the start and end vertex $x$, whenever you enter
    $v$ on the tour (of course with a new edge), you leave by a new edge, so the edges
    out of $v$ are paired up by the tour. This means that if a graph has an Eulerian
    circuit, then every vertex has even degree. By similar reasoning, the edges out
    of $x$ pair up as the first edge of the tour pairing with the last edge of the
    tour. **every vertex has even degree**. Moreover, assuming there are no **isolated
    vertices** (that is, you can walk from every vertex to any other. So if a graph
    has an Eulerian circuit, it must be **connected**, and every vertex must have
    even degree. This observation immediately told Euler that the Königsberg Problem
    was not only difficult but **unsolvable**—there were two vertices with odd degrees
    (of 3 and 5). Likewise, the graph in Figure 3.17 cannot be traced, as it has four
    vertices of odd degree.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_154_0.png)


    Now the result we have is useful, but only half of the puzzle. What about if a
