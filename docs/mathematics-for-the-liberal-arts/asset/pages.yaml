    # 3.2 A Graph Is Worth a Thousand Words


    Visualization is important for much more than just numbers—it is very helpful
    to “see” relationships between objects. And this brings us to the fascinating
    and oh so useful topic of graphs and networks. These graphs are unlike the ones
    you would see when you plotted functions, though they are named the same and both
    are visualizations. Let’s start off with the definition.'
  merge: -1
  pgno: 147
- img_proc: true
  md: '124


    # Definition 3.2.1. A graph or network is a collection of objects, called vertices,
    together with a relation between objects—for two objects x and y, either x is
    related to y (in which case we say that there is an edge from x to y), or they
    aren''t.


    While the definition doesn''t mention any pictures, all mathematicians who work
    with graphs draw pictures, and it is indeed the key to graphs'' aesthetic appeal.
    When one draws a graph, the vertices are drawn as points on the page, and the
    edges are shown with line segments or curves (if the relation is symmetric, that
    is, if x relates to y in case y relates to x), and with arrows additionally otherwise.
    The shape of the curve makes no difference—all that matters is which vertices
    are joined to which others. Figure 3.16 shows two examples of graphs. The one
    on the left, where a line between two vertices indicates they are adjacent, that
    is, related to each other in both directions; the edge (that is, line segment)
    between vertex a and vertex c indicates that a is related to c and c is related
    to a. The one on the right is a directed graph, where there are some vertices
    relate to one another in one direction.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_148_0.png)


    The graph on the right is directed—edges have arrows on them. This directed graph
    represents part of a food web, with the arrows from animal to animal if y is a
    predator of animal x (that is, x is a prey of y). So, for example, hawks are predators
    of snakes, mice and rabbits, but not vice versa. Of course, we could describe
    a graph just mathematically or just in words, but that would remove the intuition
    we have with the pictures.


    As with food webs, graphs arise in so many applications.'
