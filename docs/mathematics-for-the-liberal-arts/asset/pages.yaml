  md: '58


    But that happens frequently with data sets, especially large ones that comes from
    measurements:


    > The 68 – 95 – 99.7 rule: For data that arise as measurements that follow a ‘bell-shaped’
    pattern, you can expect about 68% of the data to lie within one standard deviation
    of the mean, about 95% within two standard deviations of the mean, and about 99.7%
    within three standard deviations of the mean.


    It''s worth mentioning that while 68 – 95 – 99.7 rule holds approximately for
    many distributions of numbers, it holds exactly for those that follow a certain
    bell-shaped curve called the normal curve. Its mathematical description can look
    a bit intimidating, but the shape should be familiar to you:


    A normal distribution is bell-shaped, and often grades (such as SAT scores) are
    expected to follow such a curve.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_82_0.png)


    Figure 2.8: Plot of the standard normal curve.


    Normal curves can have any mean and any standard deviation, but the one shown,
    the standard normal curve, has mean 0 and standard deviation 1. For those data
    that have a normal distribution, that is, their frequencies of different values
    follow a normal curve,


    For a normal curve, the mean, median and mode are all equal, and the curve is
    symmetric about its center.


    +   - within one standard deviation of the mean, 68% of the values lie,'
