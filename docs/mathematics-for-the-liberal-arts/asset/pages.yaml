  md: 'The median, which is the value for which about half of the data is below and
    half of the data above, is a useful measure, as it gives you an idea of where
    the “center” is, so if you have a score above the median, you would know that
    at least half of the other scores sit below you—the median tells you something
    about your position in the data (but not the value of your score). To get a better
    idea of your ranking with respect to others, the idea of a median can be extended.


    Mathematics spends a lot of time extending notions to more general ones.


    # Definition 2.1.2. For a number p between 0 and 100, the pth percentile is the
    value x for which (approximately) p% of the data are less than or equal to x.


    The median is simply the 50th percentile.


    The use of the word approximately in the definition of percentile, as just based
    on the number of values in the data, you may not be able to find an exact value
    (just as the median is only approximately the value for which half the numbers
    are below). There is no universally accepted precise definition of percentile—it
    varies slightly from textbook to textbook.


    But based on our understanding of Chapter 1 of percentages, let’s try an example.
    Suppose we have the following list of 109 test scores, all out of 50:


    | 21 19 30 15 8 35 37 25 40 39 35 44 21 |

    | 43 38 43 22 36 41 37 40 18 16 44 26 18 25 |

    | 29 37 44 29 17 42 25 36 36 43 45 14 37 |

    | 21 15 31 27 27 30 32 24 49 34 35 32 31 |

    | 38 38 38 35 33 38 38 38 31 30 20 29 |

    9 |

    | 30 20 28 34 41 47 35 34 34 38 38 25 36 |

    | 36 32 27 34 32 31 33 27 26 39 35 32 40 |

    | 46 28 29 |


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_68_0.png)


    First, suppose your score was 41. What is your percentile? The best way to begin
    is to reorder the list:'
