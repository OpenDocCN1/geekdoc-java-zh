  md: '# ART IMITATING MATH 299


    one that is just right. There have been studies as to what kind of rectangles
    we find attractive. Back in 1876, psychologist Gunter Fechner surveyed a large
    group of people to have them compare and state a preference among some common
    shaped rectangles (see Figure 6.1). Figure 6.3 shows the results.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_323_0.png)


    | 1.00 | 1.20 | 1.25 | 1.33 |


    | 1.50 | 1.62 | 1.77 |


    | 2.00 | 2.50 |


    The middle rectangle in Figure 6.1 is by the far preferred one. But the ratio
    of the length to width is an unusual number, 1.62. All of the others arise as
    small number ratios—1.00 is 1 : 1; 1.20 is 6 : 5; 1.25 is 5 : 4; 1.33 is 4 : 3;
    1.5 is 3 : 2; 1.77 is 23 : 12 (not so small, but there is a nonetheless), 2.00
    is 2 : 1, and 2.50 is 5 : 2. So why the preference for 1.62, and where does it
    come from?


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_323_1.png)


    The ancient Greeks. Numbers to when we constructed, and they built a nice rectangle
    in the following way. They started with a square ABCD, each side of 1, and cut
    it in half, as in Figure 6.4, with new points E and F. They then put a compass
    at F and draw a circle with radius equal to the distance from F to one of the
    opposite corners, say B. This circle completes the line extending the side CD
    at a point which we will call X. We''ll extend the opposite side, AB, so that
    a vertical line from X meets it, at point Y (see Figure 6.4). Then AYD is an example
    of a golden rectangle.'
