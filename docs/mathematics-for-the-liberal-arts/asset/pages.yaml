    # Strategy 5: Sometimes It''s Best to Mix It Up


    All of the games we have seen so far have no random elements to them. But even
    if there is no whiff of randomness in the game, it is best to mix things up. For
    example, consider the classic two-person game of rock-paper-scissors. In case
    you have forgotten, here are the rules: you and an opponent, at the end of saying
    “one-two-three,” each throws out a hand, showing one of three outcomes: rock (a
    fist), paper (a flat hand) or scissors (two fingers out). Then


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_289_0.png)


    +   - rock crushes scissors,


    +   - paper covers rock, and


    +   - scissors cuts paper.


    A lot of people seem to play this simple game—there are even tournaments, both
    national and international. Note that each of the two players, we''ll call Player
    I and Player II, have three strategies—R (rock), P (paper) or S (scissors). We''ll
    R1, P1 and S1 be the corresponding strategies for Player I, and R2, P2 and S2
    be the corresponding strategies for Player II. When we list the strategies for
    both players, we can form what is called a game matrix, which is a table with
    Player I''s strategies listed along the left edge, Player II''s across the top,
    and the entries correspond to what each player wins or loses if they choose the
    respective strategies. The game matrix is a handy way to keep track of the payoffs
    for the game. For example, suppose that a player gets a dollar (1) if he or she
    wins in rock-paper-scissors and loses a dollar if he or she loses (if they tie,
    no money changes hands). Putting the winnings into ordered pairs, where'
