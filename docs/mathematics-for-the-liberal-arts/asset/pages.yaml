    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_424_0.png)


    In mathematical logic, one can talk about different interpretations (or logical
    models) of sentences. For example, geometry, as described by the Greek mathematician
    Euclid, had the following rules or axioms:


    +   - A line can be drawn through any two points.


    +   - A line segment can be extended forever.


    +   - For any given line segment, a circle can be drawn with one end of the segment
    as its center and the line segment as its radius.


    +   - All right angles are congruent, that is, you can shift one over (by an isometry)
