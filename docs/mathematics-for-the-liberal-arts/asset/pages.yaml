  md: 'In this example, r = 1.0075. So suppose, in general, we want to add up a geometric
    series


    ```

    $S = a + ar + ar^2 + \dots + ar^n$.

    ```


    Here $a$ is the first term, and $r$ is what we call the common ratio. There is
    a formula, but rather than just give that to you, let''s figure it out! What do
    we multiply the sum by $r$, and use a bit of arithmetic by distributing $r$ through
    the block:


    ```

    $Sr = (a + ar + ar^2 + \dots + ar^n)r\nSr = ar^2 + ar^3 + \dots + ar^{n+1}$

    ```


    Now the brilliant trick is to recognize that most of the terms in the series $S$
    and $Sr$ are the same and therefore will cancel if we line things up and subtract:


    ```

    $S = a + \cancel{ar} + \cancel{ar^2} + \dots + \cancel{ar^n}$\n$Sr = \cancel{ar}
    + \cancel{ar^2} + \dots + \cancel{ar^n} - ar^{n+1}$\n$S - Sr = a - ar^{n+1}$

    ```


    By factoring out $S$ on the left side, we see that $S(1-r) = a - ar^{n+1}$, and
    by dividing the side by $1-r$ (provided it isn''t equal to 0, that is, provided
    $r$ isn''t 1), we find that


    ```

    $S = (a - ar^{n+1}) / (1 - r)$,

    ```


    that is, $S$ is the first term minus the term *after* the last one, all divided
    by 1 minus the common ratio. This is useful we''ll put it in a box for reference:


    > Summing a geometric series: Suppose $a$ and $r$ are any numbers.

    nThe geometric series\n$a + ar + ar^2 + \dots + ar^n$\nhas sum\n$a - ar^{n+1}
    / 1 - r$\nprovided $r$ isn''t 1 (if $r=1$, then the sum is obviously $(n+1)a$
    all terms are equal to $a$).'
