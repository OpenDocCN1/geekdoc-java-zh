    # Probability and Trickery


    Just as we have seen that statistics can be used to confuse, so can probability.
    One paradox, called the gambler’s fallacy is a very powerful one, emotionally.
    It states that after a bad streak, your luck is bound to change soon. If you have
    lost 10 hands of poker in a row, you feel that you are due to win the next hand!
    This fallacy has led to the undoing of a seasoned gambler.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_235_0.png)


    The thing is, probability has no memory—the fact that you have lost the previous
    10 hands is the same as you having won to come. This deep-felt erroneous belief
    comes from our innate appreciation for the Law of Large Numbers, which says that,
    over time, the frequency of winning has to approach the probability of winning,
    so indeed you do have to win sometimes (if winning is possible). But the Law is
    impervious to what has gone on before—we are only talking about limits, and when
    the number of occurrences gets REALLY LARGE, and this may have to wait until the
    number of new games of the game dwarfs the number played previously. Keeping the
    gambler’s fallacy in mind is crucial to keep from falling into a trap and losing
    good money after bad. Having said this, everyone, including mathematicians, are
    all prone to fall into the trap.


    Other traps have some of the smartest people—lawyers and judges. The law is inherently
    intertwined with probabilities—having cause for arrest and finding for one party
    on the balance of probabilities (i.e., when the side’s statement of claim is more
    likely to be true than not true). As legal proof is almost never 100%, sides are
    left to argue the likelihood of guilt or innocence. Moreover, if gamblers risk
    losing their hard-earned cash with the gambler’s fallacy, on trial often have
    more at stake.


    You may be too young to remember, but there was a famous court case in 1995 about
    whether great O.J. Simpson had murdered his ex-wife, Nicole Brown Simpson, and
    Ronald Goldman, a waiter at a Los Angeles restaurant. (and a famous)


