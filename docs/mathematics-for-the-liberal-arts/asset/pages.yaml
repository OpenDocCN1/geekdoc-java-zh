    # And Now the Rest of the Story ...


    Inspiration for a useful way to rank web pages arose like a surfer from the surf.
    Page and Brin imagined the web as a large directed graph, with the links as edges
    directed from one to another. Under this visualization, they imagined a random
    web surfer, who would surf the web pages, via the links (that is, the directed
    edges), choosing a link at random from the web page he or she was on. The rank
    of a web page would be the proportion of time in the long run that the web surfer
    would spend on that page.


    Now for certain, there were some mathematical challenges to be handled with this
    surfing model. How do we ensure that these rankings (which are really probabilities)
    could be always calculated? Even if they could, how would you do it? For the web
    graph is HUGE (with billions of vertices and always growing), so whatever computation
    needs to be done, you''d have to be very clever about it to get it done in a reasonable
    amount of time.


