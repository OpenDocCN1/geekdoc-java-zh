  md: '# ART IMITATING MATH 307


    There need be no separation between mathematics and art— indeed, what we often
    love about art is the perfect mathematics underlying the oil paint.


    # The Eccentric and Symmetric Artist


    And the role of mathematics in art doesn''t end with proportions. To describe
    other ways mathematics influences our appreciation of art, we need to talk about
    transformations, which are nothing more than functions, but they act on whole
    objects, rather than just numbers. The details aren''t as important as the ideas,
    so we''ll focus on the latter.

    Suppose we start with an object in a picture, say of a bird.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_331_0.png)


    One transformation is called a translation (see Figure 6.10), where we simply
    move the object (here and elsewhere we show the original object slightly transparent
    in order to focus on the transformation).


    Figure 6.10: Translation.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_331_1.png)


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_331_2.png)


    A second type of transformation is called a rotation (see Figure 6.11), where
    we rotate the object about a point (here I rotated the bird around one of the
    toes).

    The third type of transformation we''ll consider is called a reflection (see Figure
    6.12), where we reflect the object about a line (here I reflected the bird around
    a vertical line running through it).

    We can not apply one of these transformations to an object, but we can do them
    one after another, for variety''s sake.'
