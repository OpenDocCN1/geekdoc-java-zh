  md: 'from practicing medicine ever again. The damage had been done.

    You might think that there would be few ramifications to having fewer people having
    the MMR vaccine, but sadly that was not the case.

    Both measles and mumps surged in the population. In 1998, just as Wakefield''s
    research was published, there were 56 cases of measles, but between the start
    of January and the end of May 2006 there were 449 cases, the first death from
    measles since 1992. In the month of January 2006, there were over 5000 reported
    cases of mumps. And there were some serious cases, and permanent disabilities,
    from encephalitis (an inflammation of the brain) caused by measles. Similar patterns
    followed in other countries where Wakefield''s research was amplified through
    the media. Time magazine, in 2012, listed Dr. Wakefield in his "Great Science
    Frauds" article.


    In the end, there was a huge cost to the null hypothesis—that the MMR vaccine
    was safe—and the rejection wasn''t even due to proper mathematics. It''s yet an
    indication why the bar has been (and needs to be) so high by statistics for changing
    the quo.


