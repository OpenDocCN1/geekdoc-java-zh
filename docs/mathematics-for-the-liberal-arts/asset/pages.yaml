  md: '# HEALTH, SAFETY AND MATHEMATICS 29


    which we can convert to minutes, if we wish, by another appropriate conversion
    factor:


    ```

    $$0.2\text{ min} \times \frac{60\text{ min}}{1\text{ mile}} = 12\text{ min}.$

    ```


    These rates of change can be converted into other rates of change via conversion
    factors. For instance, we can, if wish, convert 32 miles per hour into a number
    of feet per second, using conversion factors from miles to feet and from hours
    to seconds (recall that there are 5280 feet in mile and 60 seconds in every minute):


    ```

    $$

    frac{32\text{ mi}}{\text{hr}} \times \frac{5280\text{ ft}}{1\text{ mile}} \times
    \frac{1\text{ hr}}{60\text{ min}} \times \frac{1\text{ min}}{60\text{ sec}} =\

    \frac{32 \times 5280}{60 \times 60} \text{ sec} =\

    46.93 \text{sec}

    $$

    ```


    You can take conversion factors from the street into the gym with you. During
    our workouts I take my pulse. Rather count the number of heartbeats over a minute,
    the usual process is to count the number of heartbeats in 10 seconds and multiply
    by 6 to get the number of beats per minute. Suppose that during a 10-second interval
    we count 11 beats, giving the desired per minute:


    ```

    $$11\text{ beats} \times \frac{60\text{ sec}}{10\text{ sec}} = 66\text{ beats/min}.$$

    ```


    You might think it would be easier to count the number of beats in seconds, and
    but accuracy would be at risk. No matter how careful you are, at each of the beginning
    or the end you might be off by a beat in your count. This translates into being
    off by $6 \times 2 = 12$ beats per minute in your calculation if you did your
    count over 10 seconds, and $10 \times 2 = 20$ beats per minute if you did your
    count over six seconds instead, and an error like the latter is a much bigger
    deal.


