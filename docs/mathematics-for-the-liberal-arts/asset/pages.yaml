  md: 'We say that two collections of objects (or sets) A

    and B are of the same size if there is a way to match the objects

    A to the objects in B. For example, we can match the set

    A = {1,2,3,4,...} with set B = {2,4,6,8,...} by matching 1

    with 2, 2 with 4, 3 with 6, and so on—matching each n

    A with its double 2n in B. So we get the surprising result that

    A and B have the same size, even though B sits within (that is,

    is a proper subset of A)! You''ll find, more surprisingly, that the

    rational numbers, all of the fractions, have the same size as the

    whole numbers (set A).


    But one can show that the real numbers have a bigger size.

    The idea (due to mathematician Georg Cantor) is that if the real

    numbers, just those between 0 and 1, had the same size as

    the whole numbers, then we would be able to match them off,

    that is, we would be able to list all of the real numbers between 0\and 1:


    $r_1, r_2, r_3,...$


    Each of the numbers $r_i$ are decimals starting with 0 followed by a

    decimal point. Then we form a new real number $s$ between 0 and

    1 such that


    This proof is known as a

    diagonalization argument.


    +   - the first decimal place of $s$ is 4 if the first decimal place of

    first number in the list, $r_1$, isn''t a 4, and is 5 otherwise,

    - the second decimal place of $s$ is 4 if the second decimal place of

    the second number in the list, $r_2$, isn''t a 4, and is 5 otherwise,

    - the third decimal place of $s$ is 4 if the third decimal place of

    the number in the list, $r_3$, isn''t a 4, and is 5 otherwise,


    and so on. it''s not hard to see that $s$ can''t be any of the numbers

    in the list $r_1, r_2, r_3,...$, a problem, as all of the real numbers be-

    tween0 and 1 are supposedly in the list. The only conclusion we

    can draw is that the list can''t be complete, and there are more

    real numbers than whole.


    The question that mathematicians have is whether the size of

    t real numbers is the next size up from the size of the whole

    numbers (this is the Continuum Hypothesis, due to Cantor).

