    Prob(lung cancer)live in Chicago, non-smoker, female, age 24),


    which would give you a more accurate estimate of your personal probability of
    getting lung cancer. The trick is, the more information you try to take into account,
    the more difficult it is to find and count the relevant population. So we settle
    somewhere between, taking into account as much as we can, and create a probability
    based on the frequency, basing your decisions on this estimate of the true, unknown
    probability.


    We point out that there is a deep connection between probabilities and frequencies.
    If you repeat, independently, the same random process over and over and again,
    and count the number of times that a certain event occurs each time, then the
    Law of Numbers in mathematics states that the frequency of the event happening
    will approach the probability of the event. For example, if you flip a coin many,
    many, many times, the proportion of heads will approach 1/2, the exact probability
    of heads, over time. After say 10 tosses, you might find that you get only 2 heads,
    over 100 tosses, you would be surprised to get only 20% heads—you would probably
    get something like 57 heads (for a proportion of 0.57). And after say 1000 heads,
    you would expect the proportion to be even closer to 1/2, say 483 heads (for a
    proportion of 0.483).


