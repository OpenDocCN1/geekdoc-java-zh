  md: 'Figure 4.2: A timeline of deposits.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_198_0.png)


    The key to realize is that each deposit independently earns compound interest
    at a rate of 9%/12 = 0.75% = 0.0075 over the number of months that it is invested.
    The following timeline shows how much each deposit accumulates in the account:


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_198_1.png)


    Again, a picture is worth a thousand words! All we have to do is find the total
    in the account after 5 years is to add the following dollar amount:


    $100(1.0075)^{60} + 100(1.0075)^{59} + 100(1.0075)^{58} + \dots + 100$

    $100 + 100(1.0075) + 100(1.0075)^2 + \dots + 100(1.0075)^{60}$


    (All I''ve done is reorder the terms.) Of course, we can use a calculator to add
    this up, but that is a lot of work—there are 61 terms to work out and add together.
    This **series** (which is simply the word for a sum of terms) is of a special
    type—**geometric series**, where, for some number $r$, the next term to be added
    is $r$ times the previous term (which is the same as saying that the ratio of
    any one term divided by the previous is $r$).'
