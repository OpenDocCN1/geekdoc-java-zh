  md: '# Introduction


    YOU WERE ONCE A GREAT MATHEMATICIAN. A natural born mathematician. All babies
    are babies. We think of newborns as a blank slate, but they arrive with some special
    skills that are built into their DNA. The most fundamental of these are the mathematical
    skills needed for learning.


    Think about it. You go from no knowledge of the real world to, within a few years,
    a deep understanding of sounds, words, grammar, sight, objects, emotions, reasoning,
    and so on. You learn


    +   - to categorize objects into types and pick out prototypes for each class,
    a process that depends essentially on forming equivalence relations (see Chapter
    1),


    +   - to infer properties of objects and consequences of actions, using experimental
    techniques and statistics (see Chapter 2),


    +   - to make decisions based on desires (see Chapter 5),


    +   - to strategize in order to win at games (see Chapter 5 as well), and


    +   - to formulate abstract theories and representations of the real world, and
    think at higher levels about your own and others'' thoughts (see Chapter 8).


    You may have lost some appreciation for the mathematics you found essential (and
    loved!) as an infant and child—for many people that do indeed happen. Often this
    takes place at the hands of a poor mathematics teacher along the way. But that'
