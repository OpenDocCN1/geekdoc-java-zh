- img_proc: true
  md: '**Laplace''s Rule:** When you independently repeat an experiment with two outcomes,
    say H or T, $n$ times and find that you get $h$ H''s and $t$ T''s, then, provided
    that you have no reason to assume any value for the probability of H is more likely
    than any other, your best estimate for the probability of getting an H is


    ```

    $$\frac{h+1}{h+t+2}$

    ```


    So in the case where we have flipped a coin twice and ended up with 2 heads, our
    best estimate for the probability of getting a heads on a toss would be


    ```

    $$\frac{2+1}{2-0+2} = \frac{3}{4}$

    ```


    In fact, if we tossed the coin 100 times and each time it came up heads, we would
    estimate the probability that the coin will come up heads as $(100+1)/(100+2)
    = 101/102$, close to 1, but not 1. And we wouldn''t predict that a tail was impossible
    (with probability 0), but would estimate its probability at 1/102, small, but
    not zero.


    Returning now to our view of others, even if we found all eight people of group
    B were aggressive, and even if we felt our sample were a random one, our best
    estimate for the rate of aggressiveness in group B wouldn''t be 1, absolute certainty,
    8/9, which would be close to 1, but not certain. All of our prejudices should
    be at least tempered by Laplace''s Rule.


    Finally, the use of statistical inference, from our exposure and experiences,
    to predict attitudes and characteristics of groups of people is often misleading,
    but perfectly human. All we do it. So it behooves each of us to act well if we
    want others not only to think of us, but of those groups we belong to.


    Life Lesson: We have the power to influence influence others form about us, our
    gender, race, religion and profession, with statistical inference as well.'
