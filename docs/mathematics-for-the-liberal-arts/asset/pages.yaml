    # 8.2 Limits of Mathematics


    MATHEMATICS, AS GREAT AND AS POWERFUL AS IT IS, HAS LIMITS (FUN INTENDED!). Sometimes
    the limits are in terms of our mathematical abilities. But sometimes they exist
    independently, where no amount of additional thought or expertise will help.


    # Randomness versus Determinism


    We think that certain outcomes are random—the toss of a coin, the roll of a die,
