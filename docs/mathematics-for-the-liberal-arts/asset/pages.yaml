  md: "52\n\nscore of 41, being above it, would be in the top 25% of the class—nmuch\
    \ more information.\nIn fact, the **range** of a data set is defined to be the\
    \ difference between the maximum and minimum values, and the **interquartile range**\
    \ is the difference between the third and first quartiles. For example, in our\
    \ 109 data set with five-number-summary 8, 27, 33, 38.5, 50, the range is $50\
    \ - 8 = 42$ and the interquartile range is $38.5 - 27 = 11.5$. All of the scores\
    \ are between 8 and 50 (inclusive), an interval of size 42, and approximately\
    \ the middle 50% of the scores are between 27 and 38.5, an interval of size 11.5—the\
    \ “box” part of the box plot in Figure 2.4 (the vertical lines indicate the minimum\
    \ and maximum values, while the “whiskers”—the horizontal lines—indicate the lower\
    \ and upper 25% of the scores).\n\n# Outside the Norm\n\nThe interquartile range\
    \ is useful for describing *outliers*, which is data values that are very unusual—they\
    \ are either too small or too large. For example, in a hockey season we all had\
    \ forwards scoring 75 goals in the season, that value would be unusual as to called\
    \ an outlier. But how do we precisely define what is “unusual”, what constitutes\
    \ an outlier? After all, with a lot of data, we might expect some values to be\
    \ small and some to be large. The usual definition is that an outlier is one of\
    \ the following:\n\n**Definition 2.1.3.** For a given data collection, let $Q_1$\
    \ and $Q_3$ be the lower and upper quartiles and $IQR = Q_3 - Q_1$ be the interquartile\
    \ range. A value less than $Q_1 - 1.5 \times IQR$ or greater than $Q_3 + 1.5 \t\
    imes IQR$ is called **an outlier** for the data.\n\nWhen a value is an outlier,\
    \ it sometimes indicates something out of the reality is going on with that. A\
