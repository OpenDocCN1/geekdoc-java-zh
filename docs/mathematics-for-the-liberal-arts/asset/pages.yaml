    # Delighting in Ambiguity


    Usually ambiguity, which occurs when something has more than one meaning, is a
    bad thing in real life. If significant other offers to play you a song he she
    wrote and you respond, “I’d like nothing better,” the ambiguity of your statement
    is likely to end up with sleeping in the doghouse, at least for a few days. In
    the arts, and especially in humor, ambiguity is a good thing—it allows your mind
    to play the phrase/joke/situation over and over again, switching back and forth
    between meanings, continuing the fun. Puns are exactly'
