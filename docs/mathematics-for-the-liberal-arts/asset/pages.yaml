    # Probabilities in Real Life


    Randomness permeates games like poker, blackjack and craps, where it is fairly
    clear why the process is completely random and how real life things are a bit
    murky, and we base our probabilities on the frequency of the event, the proportion
    of those in the population for which the event has occurred. For example, what
    is the probability that a random person in the U.S will be killed by lightning
    during a year? In 2010, there were 29 deaths due to lightning strikes. As the
    U.S. population year was 310,236,863, the probability of a random individual during
    that year being killed by lightning was 29/310,236,863, or about 0.00000000935—it
    is extraordinarily rare (but does happen).


    Would this have your chance of being killed by lightning that year? That isn''t
    a tougher question to answer. You may be more cautious, refusing to go out in
    storms, and so your probability would have even smaller. On the other hand, if
    you were an avid camper, a bit of a thrillseeker who liked storm, it might be
    higher. In the absence of any other information, we would take 29/310,236,863
    as your probability of being killed by lightning that year (as you are reading
    this textbook, written after 2010, congratulations—you survived!).


    Working with such real-life probabilities has been extraordinarily useful, connecting
    up statistics and probability theory. You can talk about a person''s probability
    of getting a certain disease, winning a lottery, placing at the Olympics, finding
    out you''re


