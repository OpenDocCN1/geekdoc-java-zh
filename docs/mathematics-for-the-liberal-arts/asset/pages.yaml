    He also put forward one more axiom, his parallel postulate. Together with his
    other axioms, it can be written in the following form, called Playfair’s axiom
    (see Figure 8.4):


    +   Given a line $L$ and a point $p$ not on the line, there is exactly one line
    through $p$ and parallel to $L$.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_425_0.png)


    The rules should seem all quite natural. What I want to point out is that the
    terms “point” and “line” are not defined, although what Euclid and other geometers
    were thinking of the usual interpretation of points and lines. But when you try
    to prove things from axioms, what you prove must be true, no matter what the interpretation
    of the underlying terms is. For example, suppose you take your all the points
    on a globe, and lines are now what are called great circles, that is, circles
    on the globe formed by cutting the globe with a flat plane that goes through the
    center of the globe (see Figure 8.5). Then you find out the first four of Euclid’s
    axioms still hold, but the fifth one, Playfair’s axiom, doesn’t—any two circles
    meet, so there are no parallel lines at all in this geometry. In fact, things
    are even stranger—in any triangles you draw, the sum of the angles is always more
