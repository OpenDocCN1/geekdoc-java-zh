  md: '# ART IMITATING MATH 305


    The properties of the golden ratio were very pleasing to the Greek mathematicians
    who discovered them, and the golden rectangle held a very special place in their
    hearts, as the ideally shaped rectangle. This love of the golden rectangle extended
    to many Renaissance painters, especially Leonardo da Vinci. Da Vinci was not only
    a prolific artist, but was a scientist and engineer as well, filling notebooks
    with his ideas and sketches—he was indeed a student of the arts and sciences.
    His most famous painting is undoubtedly the Mona Lisa, and even here we can find
    instances of the golden rectangle lurking about (see Figure 6.7), as the golden
    ratio is naturally present as an ideal proportion in the human body.


    Figure 6.7: Leonardo da Vinci''s Mona Lisa, with golden rectangles superimposed.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_329_0.png)


    Love for golden rectangles has persisted, with many buildings incorporating the
    proportion in various ways in their construction. The Parthenon (see Figure 6.8)
    is built upon the golden ratio, while in Figure 6.9, Paris’ Eiffel Tower, the
    golden rectangle plays a prominent role.


    And indeed, the proportions of faces and bodies of many beautiful people have
    golden rectangles embedded (see the exercises at the end of this section).'
