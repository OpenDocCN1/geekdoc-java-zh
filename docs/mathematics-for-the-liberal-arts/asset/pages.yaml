  md: '+   simple random samples may be very hard to gather—one would need a list
    of all members of the population ahead of time, and those chosen for the sample
    would have to be available and willing to participate.


    But not ideal, the other methods have their advantages, too. The stratified method
    would allow the gathering of some additional data as well, such, for example,
    how the sexes differ in concession stand purchasing (if, by chance, in our random
    sample almost all were men, we couldn''t do that). The systematic sample is pretty
    elementary to implement, but might pick too many people who bought their tickets
