    two possible outcomes, or we choose the die and roll it, with six possible outcomes,
    and we see that from our cases, we have $2+6=8$ possible outcomes—the sum of the
    number of outcomes for each case. Here we have an illustration of our second counting
    principle:


    > The Additive Principle of Counting: Suppose you can break your counting into
    a bunch of non-overlapping cases, where you can count $a$ items in the first case,
    $b$ items in the second case, $c$ items in the third case, and so on. The total
    number of items is the sum of all the different items in each of the cases:


    $a+b+c+\cdots$


    Let''s practice using the principles by solving a few problems. The numbers may
    surprise you! Let''s begin by counting how many license plates you can make of
    three letters followed by three numbers.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_214_0.png)


