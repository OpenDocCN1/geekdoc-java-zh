    # Why Are the Blues So Damn Good?


    The blues are rather unique—some musicians spend their entire lives playing music
    in the genre, and others spend their entire lives listening to it. And the surprising
    thing is how similar many of the songs are. Most blues are 12 bars long (in 4
    or 12 time, with four basic beats in a bar, each divided into two or three sub-beats),
    with a sequence of basic chords in a structure: one is chosen, the chord progression
    is often


    +   * the chord for four bars,

    * the IV chord for two bars, the IV chord again for two bars,

    * the V, IV and V chords, each for one bar


    (the choice of whether the chords are major or minor can vary from blues to blues).
    And the sound of the voice, both in note and timbre, is quite moving. So the question
    remains—why are the blues so good? That is something we''ll try to answer mathematically
    in this section.


    We''ve seen that all complex tones are made up of pure tones, represented by sine
    waves, by addition. But what we hear is the sum of many (potentially thousands
    of) such sine waves. Like the ingredients in a cake recipe, they all add together
    and in the end it seems impossible to tell and how much of each went into the
    final product. Amazingly there is a mathematical process that uncovers the “ingredients”
    in our musical recipe, and it is called a Fourier transform, which decomposes
    a musical sound into its component frequencies (and their amplitudes). The process
    is due to the French mathematician and scientist


