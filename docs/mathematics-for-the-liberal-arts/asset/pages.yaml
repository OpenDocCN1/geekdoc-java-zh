  md: '![](img/a2a6f439c6e02b960b8f4c54a2a56513_324_0.png)


    The golden rectangle has many nice properties. The ratio of its width to its height
    is called the **golden ratio** and is often written by the Greek letter $\phi$
    (spoken as “FIY”). With a bit of geometry we can show that it is the number $\frac{1+\sqrt{5}}{2}$,
    that is, $\frac{+\sqrt{5}}{2}$ (see the exercises), which is not a rational number.
    It is approximately 1.618, or 1.62 to two decimal places, and we see why Fencher
    had this ratio among his options. Moreover, if you look at Figure 6.4, you find
    more than one golden rectangle—BYXC also turns out to be a golden rectangle as
    well!


    The number $\phi$ has many fascinating properties. For example, the square of
    the golden ratio is one more than the golden ratio, that is,


    $\phi^2 = \phi + 1$,


    as


    ```

    $$\phi^2 = \left(\frac{1+\sqrt{5}}{2}\right)^2 = \frac{(1+\sqrt{5})(1+\sqrt{5})}{4}$

    ```'
