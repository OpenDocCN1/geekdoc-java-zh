    # 6.2 Believing What You See (or Not)


    We''ve seen how we can use transformations (compression and stretches) to create
    the illusion of distances. But mathematics provides more in the way of guidance
    in producing the illusion of three dimensions in paintings and drawings. Prior
    to the Renaissance, the only visual cues used to show distance in artwork was
    to change the size of objects (smaller ones being further back) or by overlapping
    images. But starting in the 1400s, artists began to create more realistic three-dimensional
    paintings, using Geometry, with much of the work being done in Italy.


    # It''s All a Matter of Perspective


    Proper perspective depends on the notion of infinity in an essential way. How
    does one create the illusion of the third dimension in a two-dimensional artwork?
    The simplest process involves setting a point in the painting as **point at infinity**,
    also called the *vanishing point*, set off along the horizon. The key is that
    if you observe parallel lines that head into the distance, they seem to converge
    to a point, even though we have been taught since we were small that parallel
    lines *never* meet. Giving up this throwback to Euclidean geometry allowed artists
    in the Renaissance to finally figure out how to render the third dimension in
    their art.


    Here is an example of artwork whose perspective is generated by a vanishing point
    (shown in red on top of the painting).'
  merge: -1
  pgno: 342
- img_proc: true
  md: '![](img/a2a6f439c6e02b960b8f4c54a2a56513_343_0.png)


    | vanishing point | horizon line |

    |---|---|


    Once the point at infinity is set, one makes all lines in the picture that are
    perpendicular to the plane of the canvas, that is, all lines that head into the
    picture, going from the foreground all the way back into the background, meet
    at the point at infinity; lines that are parallel to the plane are shown in the
    usual way. So, for example if I want to draw a picture of train tracks heading
    into the distance, I start with the rails. As the rails are perpendicular to the
    plane of the picture, that is, they head back into the distance, they, though
    they are parallel in real life, should both converge to the point at infinity.'
