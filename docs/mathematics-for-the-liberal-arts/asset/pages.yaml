    A little harder, but still definitely something you can practice in your head.


    Here is another scenario. What do you think about a $100 item that has been marked
    up 20% and then marked down 20%—surely nothing changed, right? Wrong! Let''s do
    the math to see what''s going on. First, the $100 item is $0.20 × $100 = $20.
    Pretty simple. So the item is now $120. Now by marking it down 20% reduces it
    by $0.20 × $120 = $24, so the price becomes $120 – $24 = $96, less than what it
    started! The lesson to learn is that it is very important what you are taking
    a percentage of, and as things change, the percentage may amount to different
    amounts from earlier.


    Also, calculate the price of a $100 item that has been marked down 20% and then
    marked up 20%.


    # Going By the Rule


    Now the act of multiplying a fixed number—say 15%—can be thought of as just that—a
    mathematical act—but from another perspective, it can be envisioned as the application
    of a function to a number. A function is a rule that assigns to every object (in
    some collection) another object in another (possibly the same) collection. Often
    functions are given by formulas, but sometimes they are given in other ways (such
    as tables or plots). So, for example, multiplication by 0.15 can be encapsulated
    by the function


    f(x) = 0.15x.


    The function''s domain, that is, the permissible values that can replace the variable
    here are all nonnegative real numbers, representing costs of items (though a good
    case could be made for including negative numbers in the domain as well, as you
