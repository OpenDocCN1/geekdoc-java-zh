  md: 'IT’S HERE, THERE AND EVERYWHERE. It’s hiding behind the nooks and crannies.
    It’s there when you get up, it’s there when you eat breakfast and start your day.
    It’s there at work, and then again when you relax at night. You can’t avoid it.
    Mathematics surrounds you.


    Now you can choose to ignore the math—that’s up to you. But recognizing and embracing
    even a little of the mathematics that fills your days and nights can make life
    more understandable, more interesting. And it it can make you—believe it or not—more
    creative. Just a little bit, and you can appear more suave in restaurants. You
    can be healthier and safer. and you can make more sense out of the data you read
    about. And all of that is good, good news.'
