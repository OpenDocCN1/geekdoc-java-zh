    Finally, there is a Type II error that is present in any experiment, namely the
    probability of not rejecting the null hypothesis when it is false. The Type II
    error is harder to calculate, as any calculation for it likely depends exactly
    what the unknown population statistic is. But the Type II error is nonetheless
    lurking around, and it is a balancing act—if you try to decrease the Type I error,
    you inevitably increase the Type II error, and vice versa. So do you set the scales?
    You are ultimately guided by the consequences of each of the errors occurring—how
    bad is it for you to reject the null hypothesis when it is true, versus not rejecting
    it when it is false?


