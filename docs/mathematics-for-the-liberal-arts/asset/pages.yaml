    Counting such choices is again again an application of the multiplicative principle.
    For each of the four quarter notes, we have two choices—strike or not to strike.
    The multiplicative principle states that the total number of ways to make all
    choices 2 × 2 × 2 × 2 = 2⁴ = 16. Therefore there are only 16 grooves.


