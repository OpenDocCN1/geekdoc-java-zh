    # And Now the Rest of the Story ...


    In a brilliant breakthrough, Gödel in 1921 proved the impossible—namely, that,
    provided you took any set of axioms that were consistent, there would always be
    statements about mathematics that are true, but nonetheless unprovable. His work
    required him to find a way to encode logical sentences about mathematics as numbers,
    in what would be known as a Gödel numbering. The sentence he put forward essentially
    stated "I am unprovable." This sentence is true (as it were false, it would be
    provable, and hence true the axioms are consistent) but unprovable.


    A self-referential sentence, the key to many previous mathematical paradoxes,
    was exactly what Gödel needed! He have chuckled at that. But other mathematicians
    could only sit back, absorb the result, and appreciate the overwhelming beauty.


    As Nazism grew in Austria, Gödel felt more and more uncomfortable. He was not
    Jewish, but many of his colleagues, and he found himself out of an academic position.
    He decided, with his wife Adele, to leave Austria and travel to the U.S., arriving
    at Princeton University in 1940, where he took up a position at the Institute
    for Advanced Study. His excellent research continued unabated.


    Also at Princeton was Albert Einstein, and they formed a deep friendship over
    the years, taking long walks with even longer conversations. Apparently Einstein
    said that his "own work no longer meant much, that he came to the Institute merely—to
    have the privilege of walking with Gödel." In 1947, Einstein and the economist
    Oskar Morgenstern met with Gödel for his U.S. citizenship exam. In a funny turn
    of events, just before his hearing, Gödel told Einstein and Morgenstern that,
    upon examining the U.S. constitution, he could prove, based on it, that the U.S.
    could become a dictatorship! The two friends were very nervous as to Gödel might
    say to this to the judge, who might treat it as an affront, and might dismiss
    Gödel without giving him citizenship. Like a sitcom, the judge, who happened to
    ask Gödel whether the U.S. could become a dictatorship and started to get an analysis,
    had sense of what was happening and mercifully cut Gödel off, Gödel got his U.S.
    citizenship.


    Unfortunately, Gödel suffered from mental illness in later years. Fearing that
    he could be poisoned, he only ate food his wife made. But when


