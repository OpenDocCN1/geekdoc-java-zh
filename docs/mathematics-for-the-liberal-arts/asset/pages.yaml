    # Seeing into Infinity


    Fractals, with their self-similarity, can often seem paradoxical. We have seen
    examples of fractals that are in a confined area and yet have unbounded length,
    and ones that seem to take up space but lack any area! Figure 6.32 shows a doorway
    that contains a doorway which contains a doorway, and so on. Its fractal nature
    draws us right into them—infinity and suggests an infinite number of entrances,
    leading on forever. Is this disturbing or just interesting?


    Fractals have infinity built right into them—infinitely many steps, themselves
    are the objects that arrive after many steps, though the pictures we generate
    of course are only approximations, stopped after some finite number of iterations.
    Our eyes are limited to how small a detail we can see, but the pictures of fractals
    allure to infinite progressions of smaller objects, and that glimpse into the
    infinite is appealing.


    Another way of portraying infinity is with infinitely climbing objects. These
    visual paradoxes cycle around, climbing higher, and yet return to where they start,
    in an endless cycle. Follow the water around in Figure 6.33 and watch how it continually
    rises!


    We''ll show one more visual paradox, a picture of a three-dimensional one, called
    the Necker cube. Have a look at Figure 6.34—do you see how it really can''t exist
    in space, though it seems to?'
