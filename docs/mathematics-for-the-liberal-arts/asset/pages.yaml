  md: "# MATHEMATICS OF SOUND (AND THE SOUND OF MATHEMATICS) 341\n\nrecognize and\
    \ appreciate trigonometric functions, whether we are mathematical or not.\n\n\
    Two musical properties of pure tones are directly related to the mathematical\
    \ properties of their waves:\n\n+   - The loudness of the tone corresponds approximately\
    \ to the sine curve's amplitude—how high and low it goes vertically from the midpoint.\
    \ The higher the curve, the louder the tone seems. Figure 7.2 shows a sine curve\
    \ with amplitude 2.\n\n+   - The pitch of the tone corresponds to the frequency\
    \ of the curve, that is, how often it repeats. This is measured in hertz (Hz),\
    \ the number of cycles per second that the sine wave repeats (a kilohertz (kHz)\
    \ is a thousand cycles per second). Figure 7.2 shows a sine curve with frequency\
    \ 5 Hz (as it repeats five times every second).\n\nThe range for human hearing\
    \ is 5 Hz to 20,000 Hz (that is, 20 kHz), though as we age, we tend to lose hearing\
    \ at the top end. Other animals differ: dogs can hear in the range of 40 Hz to\
    \ 60 kHz, while bats can hear frequencies around 200 kHz.\n\n![](img/a2a6f439c6e02b960b8f4c54a2a56513_365_0.png)\n\
    \nFigure 7.2: Sine curve, with amplitude and frequency indicated.\n\nMathematically,\
    \ the pure tones correspond to functions like\n\n$A\\sin(2\\pi \times f \times\
    \ t)$"
