    # 5.2 Game Theory—Coming out on Top


    Sometimes your decisions are only based on your wants and needs, but often there
    be others involved, with their own desires and requirements. In this section we''ll
    be interested in maximizing what you get, in a competitive environment, when each
    player has choices to make. We call such situations games, even though the outcomes
    for each “player” may be important. Our particular focus is on two-person games,
    that is, where there are two opponents, each trying to get the most for themselves.
    Some of the games (like poker) are zero-sum, in that what one person wins, or
    her opponent loses, but others are not. Finally, some games are played with perfect
    information, that, each player knows exactly what has transpired in the game,
    the moves that have been made already in the game—examples are tic-tac-toe, chess
    and checkers—but some games are not (including those that involve an element of
    chance, as blackjack).


    What are always is a “best” way to play the game, in the sense of maximizing what
    you get. (This is indeed rather cooperative; in the next section we''ll talk about
    joint group decisions.) Such a way to play, which specifies according to previous
    choices made by both players, is called a strategy, and the holy grail is to find
    a winning strategy, if it exists—one that guarantees a win. Finding a winning
    strategy often requires thought, but it is worth your trouble, and you'
