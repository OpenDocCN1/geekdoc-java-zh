  md: '# MATHEMATICS OF SOUND (AND THE SOUND OF MATHEMATICS) 355


    to (often called "dissonant") would be interesting and appealing to another. So
    let''s, for the time being, ignore the question of whether a melody sounds "good"
    or not and ask how much variety when we have when we sit down to write a melody.
    Certainly we have heard a lot of good (and a lot of bad) melodies. There is, as
    King Solomon decide, nothing new under the sun?


    To help decide, we rely on our counting principles from Chapter 4. Suppose we
    were interested in how many melodies were there with say 10 notes. In music, it
    usually doesn''t matter on which note you start, all that matters is where you
    go from there. So let''s consider how many 10-note melodies we write starting
    on middle C. Theoretically, we can go up or down number of notes, but that would
    be hard to sing (or even play). Let''s suppose we restrict ourselves to going
    up or down at most an octave, that is, at most 12 notes (semitones). From any
    given note, we have 25 choices for the next note in the sequence (any one of the
    12 notes up or down, plus possibly staying on the same note):


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_379_0.png)


    As we fill each successive blank there are 25 choices, so we use the multiplicative
    principles to find out that there are


    ```

    25 × 25 × 25 × 25 × 25 × 25 × 25 × 25 × 25

    = 25^9

    = 3,814,697,265,625

    ```


    many such melodies, that is, about 4 trillion of them! And these don''t even count
    melodies that go beyond an octave or down from the starting note, nor do they
    take into account any rhythm for the melody. You have heard all of these? I think
    not! So there is, indeed, much musically new under the sun.'
