    # Deciding with Maximum Expected Utility


    Now let''s use utilities to make decisions. Our approach is to attach utilities
    to all of the possible outcomes and then weight them by the chances of them occurring
    (so the utilities are a random variable that depends on the outcomes). The decision
    process of maximizing expected utility (MEU) is to take the largest of all expected
    utilities available.


    I think this calls for an example! Let''s suppose you have a choice—stay in and
    study tonight or go out and party. If you stay in and study, there is a 90% chance
    you''ll do well on your math midterm tomorrow, but if you go out, the chance that
    you''ll do well on the midterm drops to 50%. Now what about fun? If you stay home,
    there is only a 30% chance you''ll have any fun (you enjoy math a bit, but you
    know if you stay in, a friend may drop over, and you would enjoy that). On the
    other hand, if you go out, there is an 85% chance you''ll enjoy the evening. The
    fun and score on your midterm are dependent on whether you stay home or not, but
    given one of the choices, the fun and midterm scores are independent of one another.
    Figure 5.4 is a decision tree that shows the choices you have, along with the
    probabilities of various outcomes occurring (diamonds indicate choices, circles
    indicate randomness). Note that the probability on a branch is a conditional one,
