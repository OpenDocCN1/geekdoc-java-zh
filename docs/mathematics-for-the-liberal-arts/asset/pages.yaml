    # Eulerian Graphs and Tracing Figures


    Your first exposure to graphs, unknown to you, was likely the question of tracing
    a figure without tracing your pencil of the page, and without retracing any line.
    If you were like me, you spent several hours trying one or the other of these.


    Look at the figure, and let''s go through some preliminary reasoning. If you can
    trace the figure as described, then you can so starting at one of the corner points,
    rather than in the middle of one of the lines, because you course have to end
    back up at the end covering the rest of the line. By starting your "tour" at the
    first corner'
