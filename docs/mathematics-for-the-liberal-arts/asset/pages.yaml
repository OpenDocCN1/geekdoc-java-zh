  md: '# MONEY AND RISK 213


    by chance only once in a century. Based on this and on other evidence, Sally Clark
    was convicted and sentenced to life in prison. The decision held up under appeal.


    But statisticians began to raise serious concerns about Meadow’s probabilistic
    arguments. Some suggested that Meadow had cherry-picked (that is selectively chosen)
    his comparable group—a rich, non-smoking environment—for estimating his frequency
    probability, but left out the fact that both babies were boys, which raised their
    likelihood of SIDS (per to 1/300, not 1/8543). Furthermore, not was the 1 in 7.3
    million the probability that Sally Clark was innocent? Many argued that, the relevant
    thing to do is to compare this probability to a competing alternative, of her
    committing double infanticide, which is even rarer than two SIDS deaths in the
    household, and on that basis she should be exonerated.


    But perhaps the biggest flaw in Meadow’s argument was his belief that the probability
    of the first baby in the household dying of SIDS and the probability of the second
    baby in the household dying of SIDS were independent. Does that sense to you?
    Not to me. There are many reasons why babies die of SIDS (some of the reasons
    are unknown), but there certainly could be a genetic component to a death, and
    if so, the probabilities would not be independent—given a first death from SIDS,
    a second death would much more likely to happen than had the first death from
    SIDS not occurred.


    What happened in the end? A second appeal threw out the conviction, along with
    Professor Meadow’s expert evidence. Even though Sally was released in 2003 after
    3 years in prison, she died from drinking in 2007, a victim of not only false
    imprisonment, but with bad probabilities as well.


    # Profiling and Probability


    In court rooms and outside, people routinely formulate probabilities and accept
    probabilities that they hear as correct. Suppose we hear or believe, based on
    news reports, that group A makes up 70% of terrorists, but worldwide, only 0.0001%
    of group A are terrorists. Seeing a person of group A at the airport, we may feel
    uncomfortable right away, thinking with probability


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_237_0.png)'
  merge: -1
  pgno: 237
- img_proc: true
  md: '214


    0.70 the person is a terrorist, while the perhaps felt instinctively, is far from
    correct. We are mistaking the probability that a given terrorist is of group A
    (which is high, 0.70) with the probability that a person of group A is a terrorist,
    which is very small (0.00001), and it is the latter that is important at the moment.
    Not to worry.


    But this brings to mind how we formulate probabilities on frequencies, not on
    real-life data, but data we have gathered subconsciously. Prejudice and racism
    sometimes have a basis in exactly this type of statistical inference. We base
    our opinions on the opposite gender, on other races, on other religions or experiences.
    If we have life experience with a group beyond a few individuals, we tend to attribute
    certain attributes based on the frequency of the attributes among those from the
    population that we have exposed to. For example, suppose we have met (or seen
    on TV) eight individuals from group B, all acting aggressively. What do we often
    take as the probability of a person from group B being aggressive? Undoubtedly—that
    is, we feel that 100% of them will act this way. But should we? The frequency
    of those who act aggressively in the group, from our experience, is out of eight,
    so it looks like we should assign a probability of 1. However, our sample is far
    from random, and indeed it is garnered from television news reports, all we see
    are the extreme cases that make the news—far from a random sample. And without
    a random sample, the probabilities we form in our minds are subject to bias (and
    can be very unfair).


    But even if the sample were random, the problem still persists. If we flipped
    an unknown coin (that is, for which we have no idea whether it is fair or not)
    twice and got heads both times, we would think the probability of getting heads
    is 2/2 = 1, that is, we have a two-headed coin? I think not. Actually, there is
    a result, due to French mathematician Pierre-Simon Laplace (whose name is one
    of 72 on the Eiffel Tower):


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_238_0.png)


    Figure 4-5: Probabilistic Pierre-Simon Laplace.'
