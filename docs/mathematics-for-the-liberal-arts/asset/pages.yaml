  md: '# MONEY AND RISK 177


    ```

    $$\begin{array}{rcccc} & \text{1 month} & \text{2 months} & & \text{360 months}
    \ K/1.005 & \leftarrow K & & & \ K/(1.005^2) & & \leftarrow & & \ : & & & & \
    K/(1.005^{360}) & & & & K \end{array}$

    ```


    Forming a timeline again, but pulling the payments back to the present, we need
    the value right at the onset (the *present value*) of all of the payments to be
    equal to the amount you borrow, $350,000. That is, of **equation of value**, which
    equates at one point in time (here the start) the values of the amounts received
    versus amounts paid,


    ```

    $350 000 = \frac{K}{1.005} + \frac{K}{1.005^2} + \dots + \frac{K}{1.005^{360}}
    = \n\frac{K}{1.005} + \frac{K}{1.005}\left(\frac{1}{1.005}\right) + \dots + \frac{K}{1.005}\left(\frac{1}{1.005}\right)^{359}
    = $$

    ```


    I purposely在了 the right side so that we can see that each term on the right is
    $\frac{1}{1.005}$ times the previous one, that is, the right side is a geometric
    series with first term


    ```

    $$a = \frac{K}{1.005}$$

    ```


    common ratio


    ```

    $$r = \frac{1}{1.005}$$

    ```


    and


    ```

    $$n = 359.$$

    ```


    We don''t need any new formula—we can recycle and use the one we have on hand,
    for a geometric series. All that changes are the parameters $a, r$ and $n$. This
    is as green as it gets. Thus the right side of our equation of value is


    ```

    $$\frac{\frac{K}{1.005} - \frac{K}{1.005}\left(\frac{1}{1.005}\right)^{360}}{1
    - \frac{1}{1.005}}$$

    ```'
