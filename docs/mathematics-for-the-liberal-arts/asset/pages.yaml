    \ the value we need to invest now for the perpetuity. We have done things correctly?\
    \ Does it really all make sense? That after one year of investing $\\$12500$ at\
    \ $8\\%$ per annum, our interest on the principal is $0.08 \\times \\$12500 =\
    \ \\$1000$, so scoping this out as our yearly payment, we still have the original\
    \ principal, $\\$12500$, going forward, and indeed we can take $\\$1000$ every\
    \ year, for the same reason, forever!\n\nSumming infinite series leads us into\
    \ a field of mathematics, where words like “approach” are made mathematically\
    \ precise, but this is as far as we’ll go here. We’ll summarize the mathematics\
    \ of adding up an infinite geometric series:\n\n> Summing an infinite geometric\
    \ series: Suppose $a$ and $r$ are any numbers, with $r$ strictly between $-1$\
    \ and $1$. The infinite geometric series\n\n$$a + ar + ar^2 + \\dots + ar^n +\
    \ \\dots$$\n\nhas sum\n$$\\frac{a}{1-r}$$\n\n(If $r$ is outside this range, that\
    \ is, $r \\le -1$ or $r \\ge 1$, and $a$ isn’t $0$, then the infinite geometric\
    \ series doesn’t add to a value.)"
