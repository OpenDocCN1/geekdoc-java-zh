  md: 'Figure 3.17: Is this graph traceable?


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_153_0.png)


    hit along the way, you can end up at the corner following the same path. So the
    tracing, if it can be done at all, can always start at a corner. But we can make
    the figure into a graph by placing a vertex at the edges, so we have just translated
    the problem in finding a **trail** in the graph, that starts at a vertex, and
    travels along the edges, from vertex to vertex, without revisiting an edge (though
    you can, of course, pass through a vertex more than once). Such a trail is called
    an **Eulerian trail**, named after one of the most famous mathematicians of time,
    Leonard Euler.


    A walk in a graph from vertex u to vertex v is an alternating sequence, starting
    at u and ending at v, such that each edge in the walk has in common with the next
    one. The walk is a **trail** if no edge is repeated more than once.


    The problem was brought to Euler''s attention by the towns of Königsberg, which
    has two islands that were joined to each other and to the rest of the city by
    bridges (Figure 3.19). Couples would attempt to traverse each bridge exactly once
    on their outing, returning to where they started, but, many years went by no avail.
    Euler brilliantly realized that one could replace each island by a vertex, and
    each bridge by an edge joining the relevant vertices to form a graph—(this is
    cited by many as one of the first instances of a graph). Then the problem of traversing
    the bridges of Königsberg was translated into the search for what we now call
    an **Eulerian circuit** in the graph, which is an Eulerian trail that starts and
    ends at the same vertex.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_153_1.png)


    Figure 3.18: Mathematician Leonard Euler (1707–1783).'
