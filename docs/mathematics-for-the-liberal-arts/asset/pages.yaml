  md: '![](img/a2a6f439c6e02b960b8f4c54a2a56513_374_0.png)


    Figure 7.6: Chromatic scale starting at middle C, C4.


    inversely proportional to the string''s length, so that if you double the length
    of the string, you cut the frequency it resonates at half, and if you cut the
    length into one-third its original length, the frequency becomes three times as
    large, and so on. Mathematically speaking, if $f$ is the frequency that a string
    resonates and $l$ is the length of the string, then for some fixed number $K$
    that doesn''t change the length (but depends on the type of string and its tension)
    we have


    $f \times l = K,$


    that is, the frequency and string length are **inversely proportional**.


    We can use this relationship between the frequency and the string length to locate
    all of frets on a guitar neck. For example, for one of my guitars (see Figure
    7.7), I measured the length of the strings from the nut to the bridge at the bottom
    (these are the free parts of the strings that vibrate when plucked) to be 28 inches.
    Let the frequency at which one of the strings resonates when plucked be $f$ (we''ll
    find out we don''t even need to know what this is!). The first fret should be
    placed where the shortened length of the string (from the fret to the bridge)
    will move the frequency by a semitone from $f$; we call this length. Moving a
    semitone corresponds to multiplication by $2^{1/12}$, the new frequency will be
    $2^{1/12} \times f$. Using the fact that the frequency times the string''s length
    always stays the same, we find that $f \times 28 = (2^{1/12} \times f) \times
    l$. We can cancel out the $f$ on both sides and divide through by $2^{1/12}$ to
    find $l$, the length of the string from the first fret to the bridge, must be
    $l = 28/2^{1/12}$, which a calculator will show about 26.4 inches. So the first
    fret should be $28 - 26.4 = 1.6$ inches from the nut at the top of the guitar
    (and this is precisely where it is on my guitar).


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_374_1.png)


    Figure 7.7: Nut and bridge of a guitar.'
