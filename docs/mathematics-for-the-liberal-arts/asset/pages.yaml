    Prob(two cot deaths in Clark household) = \frac{1}{8543} \times \frac{1}{8543}
    = \frac{1}{72982849}

    ```


    or about 1 in 7.3 million, a very rare event (Meadow estimated that two cot deaths
    could be expected to occur in England'
