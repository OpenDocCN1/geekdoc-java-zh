    +   - U.S. dollars and Euros


    Proportionality is a relation—a way of relating two objects. Two quantities are
    either proportional or not. Notice that


    +   - any quantity x is proportional to itself (as x = 1x always holds),


    +   - if quantity y is proportional to quantity x, then x is proportional to y
    (since, if y = Cx then x = y/C, so the constant of proportionality changes from
    C to 1/C, but is still a fixed positive number), and


    +   - if quantity z is proportional to y and quantity y is proportional to x,
    then z is proportional to x (since if z = C1y and y = C2x, then z = C1(C2)x, and
    the constant of proportionality of z and x is the products of the constants of
    proportionality).


    x∝ x


    y∝ x implies x∝ y


    z∝ y and y∝ x implies z∝ x


    These three properties—any object relates to itself, if x relates to y then y
    relates to x, and if x relates to y and y relates to z then x relates to z—are
    known as reflexivity, symmetry and transitivity, respectively, and grow in many
    areas of mathematics. From the second property, we see that the order makes no
    difference for proportionality, so we can merely say x and y are proportional,
    rather than say x is proportional to y. When we have a relation on objects that
    are reflexive, symmetric and transitive, it breaks up all of the objects into
    groups, where objects in the same group are related, and objects in different
    groups are completely unrelated. Proportionality does exactly this—the different
    measurements for length/distance are in one group, being proportional to one another,
    measurements for area in, and so on.


    Relations that are reflexive, symmetric and transitive are called equivalence
    relations, and they fill the landscape of mathematics. And the whole process of
    categorizing objects as an infant (or older) depends on defining equivalence relations.


