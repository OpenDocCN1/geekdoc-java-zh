  md: '# DECIDING TO MAKE THE BEST DECISIONS 229


    perhaps we plan to invest $1000 in a stock for a year. From previous behavior
    of the stock, you think that


    +   - with probability 0.10 the stock will increase by 30%

    - with probability 0.60 the stock will increase by 8%, and

    - with probability 0.30 the stock will lose 15% of its value.


    Is it worth to invest? What do you expect to earn (or lose) if you invest for
    the year?

    The word “expect” in the last question is the key one. Sound way to base your
    decision would be as follows: if you invest, with probability 0.10 the $1000 will
    increase by 0.3 × $1000 = $300, $80, and with probability 0.30 the decrease will
    be 0.15 × $1000 = $150, which we will restate as the increase being -$150, using
    negative numbers to indicate a loss. Then it seems reasonable to weigh each outcome
    by its likelihood of adding up all the values to get an idea of what will happen
    overall:


    0.10 × $300 + 0.60 × $80 + (−$150) = $30 + $48 – $45 = $33.


    Here is an example of what you might earn over 20 years, by year by year, under
    this scenario:


    +   80, 80, 80, 80, –150, 80, 80, 80, 80, –150, 300, 80, –150, 80, 80,

    150, 80, 80, 80.


    The total earnings out to be $900, which is $900/20 = $45 per year. In another
    20 year period, you might earn


    +   80, –150, –160, 80, –150, 80, 80, 80, –150, 300, 300, 80,

    300, 80, –150, 300, 80, 80,


    which would give, on, average, $66.50 per year. The earnings bounce around a bit,
    but you will find that if the number of years increases dramatically, what you
    will earn, on average, is indeed


    0.10 × $300 + 0.60 × $80 + 0.30 × (−$150) = $30 + $48 – $45 = $33.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_253_0.png)


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_253_1.png)'
