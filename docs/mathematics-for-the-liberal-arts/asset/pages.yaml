  md: '# Risk Taking and Probability


    Money is only part of what we take into account for our decisions. Risk also plays
    a huge role. We are ready to take certain chances—we get up and head off to classes
    and to chores, even though there is a small possibility of various bad incidents
    happening to us, ranging from stubbing our toe to car accidents and falling from
    the sky and hitting us! Even getting more involves some risk. You can invest in
    safe government bonds that pay a fixed but be riskier and invest in the stock
    market where you might earn a lot of money or lose a lot. Nothing is completely
    safe, but we have some idea that randomness plays a role in our lives and we need
    to take that into account.


    Let''s turn our attention to probabilities. The probability of an event is the
    chance that it will happen. For some events, that are well defined and for which
    we know a lot about the possible outcomes and chances of occurring, the probability
    can be calculated easily. For example, when we toss a (fair) coin or roll a die,
    we know that each possible outcome is equally likely to appear—a head is as likely
    as a tail to be shown, and each of 1, 2, 3, 4, 5, 6 are just as likely to come
    up on top. If the total probability of something happening is 1, then we see that
    the probability of a head turning up in a coin is x, then the probability of a
    tail turning up is also x. Since one of the two—heads or tails—must happen and
    they can''t happen at the same time, we find that $x+x=1$, so $2x=1$, so $x=1/2$,
    and of course you already know that if you flip a coin, each of heads and tails
    comes roughly half the time, that is, the probability of each is 1/2.


    I say “(fair)” before coin to indicate that it is not weighted in any way that
    would make it come up side more than the other magicians and nefarious people
    have access to unfair coins, or even two sided coins with the head or tail on
    both sided. Then talking about usual objects like coins, decks of playing cards,
    etc, is that they are “fair,” with every outcome just as likely to occur.


    When flipping a coin, there are two equally likely outcomes, and hence each outcome
    has the same probability, 1/2. In general:


    ```

    If you have $n$ equally likely outcomes, the probability of any one of them occurring
    is $1/n$.

    ```'
