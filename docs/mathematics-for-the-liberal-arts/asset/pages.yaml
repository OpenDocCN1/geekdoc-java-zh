    WE ARE CONSTANTLY INUNDATED WITH NUMBERS. Data, data

    everwhere. Your height, your weight, your love life, your bank

    account—are you normal? How do you judge? It seems to be

    imimpossible to make informed decisions without crunching, at

    least superficially, the numbers that surround you. You expect

    that you can''t control everything, that there will be some varia-

    tion whatever you measure. But certainly there are trends and

    there are patterns. If only you could separate out the truth from

    t noise, which would be clearer, and life would be simpler.

    Making sense of data is exactly why statistics exists. While

    the field is large and deep, we can wade into the shallow end

    to explore some of the relevant notions and concepts, and even

    learn a few useful calculations along the way.


    # 2.1 Summarizing Data with a Few Good Numbers


    The news is filled with streams of numbers. For example, here

    is a listing of the exchange rates for U.S. dollars over the last 12

    months:


    1.1074, 1.1138, 1.0636, 1.0620, 1.0427, 1.0303,

    1.0530, 1.0272, 1.0518, 1.0368, 1.0075, 1.0160.


    The numbers of course show some variation, and up and down, but

    certainly they are somewhat together. We humans are

    overwhelmed by large streams of numbers (computers aren''t!)

    like to condense down to a few representative figures that

    summarize such a list. Here is a guiding principle that will show

    up often in this book:'
