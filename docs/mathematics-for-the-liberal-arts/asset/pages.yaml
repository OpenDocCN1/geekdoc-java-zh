  md: 'This value based on the outcomes and the probabilities of the outcomes is called
    expectation. More precisely, suppose we have a random process going on, and based
    on the outcomes we have what is called a random variable X, which is simply a
    variable that takes on a number depending on the outcome of some random process.
    Here the random variable is how much you will earn/lose. The expectation of the
    random variable X, written as E(X), is the sum of the probability of each outcome
    times the value of the random variable for the outcome. By grouping the different
    values that the random variable can take on, we get a different, useful form—the
    expectation is also the sum of each value that the random variable can take on
    times the associated probability of getting that value.


    Suppose a random variable X takes values $x_1, x_2, \dots, x_k$. The expectation
    of X is


    ```

    $E(X) = x_1Prob(X = x_1) + x_2Prob(X = x_2) + \dots + x_kProb(X = x_k)$

    ```


    The expectation is what you would expect to gain/lose, on average, if you repeat
    the random process many times. So in our example, the expectation is $33, which
    we would gain on average, for investing out $1000, many times.


    Here is another simple example. Suppose you can play a game where you pull 1 card
    from a deck of 52. If the card is a diamond, you win $2. And if the card is the
    queen of hearts, you win $20. How much would you expect to win, on average, over
    repeated plays of the game? How much would you expect to win over 50 games? If
    you are charged $1 to play, it is worthwhile to play, over the long run? How much
    would you be willing to play the game repeatedly? To begin, let''s calculate the
    expected winnings.


    +   You win $2 if you draw a card, which happens with probability 13/52.'
