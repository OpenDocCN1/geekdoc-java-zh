  md: '# Confidence Intervals and Experimentation


    Researchers, while interested in confidence intervals, often turn the idea on
    their head. They phrase their research as an experiment that aims to investigate
    a statement or claim. For example, suppose there was the claim that


    +   $H_0$: The proportion of adults in the U.S. who think global warming is occurring
    is $p = 0.51$, that is 51%.


    This original claim is called the **null hypothesis**, sort of a baseline hypothesis;
    the opposite hypothesis, called the **alternate hypothesis**, $H_{alt}$ is also
    put forward, as an alternative what might be true:


    +   $H_{alt}$: The proportion of adults in the U.S. who think global warming is
    occurring is not 0.51, that is, $p \neq 0.51$.


    These hypotheses give rise to a **two-tailed test**, so-called as we reject the
    null hypothesis if the sample statistic is too small or too high—that if it is
    in one of the extremes.


    Given that we have found 95% of the time the actual population proportion (of
    those who believe global warming has begun) is in the range [0.50, 0.58], and
    0.51 is in this range, we would have to say that there isn''t enough evidence,
    based on the sample, to suggest that the population proportion isn''t 51%, that
    is, **there isn''t enough evidence to reject the null hypothesis**. It''s a weaker
    statement, saying we can''t say something more definitive (and perhaps more interesting),
    but researchers are a conservative lot—they need a fair bit of evidence to make
    a strong claim (like the alternate hypothesis).


    On the other hand, if the null hypothesis was that


    +   $H_0$: The proportion of adults in the U.S. who think global warming is occurring
    is 0.40, that is, 40%.


    then, 0.40 is well outside the 95% confidence interval [0.50, 0.58], we see this
    as highly unusual, picking a sample like the one chosen less 5% of the time, if
    the proportion were truly 0.40. Thus in this case we would **reject the null hypothesis**
    and accept the alternative hypothesis, which would be


    +   $H_{alt}$: The proportion of adults in the U.S. who think global warming is
    occurring is not 0.40.'
