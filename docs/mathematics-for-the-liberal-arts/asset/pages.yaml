  md: 'perhaps surprisingly, yes! We won''t delve into the argument (that will be
    hinted at in the exercises), but we will talk about a procedure, an algorithm,
    for finding such a circuit when it exists. It is called Fleury''s algorithm and
    can easily be stated:


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_155_0.png)


    > Fleury''s algorithm for finding an Eulerian Circuit: Start at any vertex and
    walk along a new edge as you proceed, erasing it from the graph as you walk over
    it (as it cannot be used again). If there is a choice of edge to use next, always
    choose one that won''t break up the remaining graph into more pieces, if possible
    (otherwise, choose any edge).


    So let''s give Fleury''s algorithm a whirl, on the graph in Figure 3.21. As the
    graph is clearly connected and every vertex has even degree, we can start at vertex
    *a*. Then we can choose to walk across *b*, deleting the edge as we go along,
    and then go down to *d*, removing the edge *b* to *d*. At this point, when we
    walk out of *d* with the other edge, we break up the graph into more pieces, as
    *d* suddenly becomes'
