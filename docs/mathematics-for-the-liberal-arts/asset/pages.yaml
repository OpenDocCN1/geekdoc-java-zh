    \ seven semitones in the equally tempered scale is pretty close, but not exactly\
    \ the same as going up a perfect fifth. Similarly for perfect fourths and the\
    \ other tones in the Pythagorean scale, although the octave remains the same.\
    \ But musically, these are outweighed by important advantages. We can now change\
    \ keys freely and openly, with all of the intervals sounding the same from one\
    \ key to the next. We give up on perfection, but we gain a huge amount musically.\n\
    \nThe 12 notes in the equally scale (often called the chromatic scale, are more\
    \ than the 7 notes in the Pythagorean (major) scale—it inserts some notes between\
    \ those of the Pythagorean scale in order to have equally spaced notes (according\
    \ to ratios). The notes in the equally tempered scale that correspond most closely\
    \ to those of the Pythagorean scale are 0, 2, 4, 5, 7, 9 and 11 semitones up from\
    \ the starting note (see Table 7.2). In the he\n\nNote when we raise powers to\
    \ powers, we multiply the powers, so that raising both sides of $r^{12} = 2$ to\
    \ the power 1/12, get:\n\n```\n$(r^{12})^{1/12} = 2^{1/12}\n$(r^{12})^{1/12} =\
