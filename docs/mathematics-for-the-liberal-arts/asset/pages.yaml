  md: '# Laughing with Mathematics


    MATHEMATICS MAY SEEM SERIOUS, BUT IT CAN BE PLAYFUL AS WELL. Mathematicians are
    always open to puzzles, ones that are difficult, impossibly hard or even seemingly
    contradictory. The more thought involved, the better payoff.


    # The Lighter Side in Apparent and Real Contradictions


    Let''s start with some errors masquerading as paradoxes. First, let''s prove that
    $0 = 1!$ First suppose that $x = 0$. Then $x^2 = 0$ so from this and $x = 0$ we
    find that $x^2 = 1x$. Clearly $x = 1x$, so from


    ```

    $x^2 = 1x$

    ```


    we cancel out an $x$ on both sides to get


    ```

    $x = 1$

    ```


    and so, as $x$ started out as 0, we find that


    ```

    $0 = 1$

    ```


    as promised!

    The issue is that we can only cancel a number on both sides of an equation by
    division if what we are dividing is known not to be 0. But we started with $x
    = 0$, so we can''t cancel out 0 on both sides of $x^2 = 1x$. Doing so leads to
    the apparent contradiction.


    There are other similar ones, having to do with simple mathematical operations.
    If we start with $x = -5$ and square both sides, we get $x^2 = 25$. But then taking
    square roots, we find that $x = \sqrt{25} = 5$, so $-5=5$, again a contradiction.
    The error lies in the fact that squaring and taking square roots are not inverse
    of one another—when you take square roots, there are often two choices that are
    available, one positive, one negative, and omitting one from consideration leads
    you a trail of no return.


    OK, sometimes contradictions arise from mistakes that can be corrected. But some
    are more involved. For example, think about'
