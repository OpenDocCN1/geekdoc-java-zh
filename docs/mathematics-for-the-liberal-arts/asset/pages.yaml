  md: 'and groups of two (eighths). What happens when you choose to group a rhythm
    differently on top of these underlying rhythms? You get something so catchy that
    it can make you walk like a duck!


    Let explain. If we take a bunch of eighth notes and create patterns of three eighth
    notes against the background of four eighth notes (each bar contains pairs, a
    strong beat—the first and third quarter beat—and the following “backbeat”—every
    second and fourth quarter), then we get a wild feeling to the music. It''s not
    easy to do at first—it takes practice just like it might to pay your head while
    rubbing your stomach. But the practice will be worth the end result (at least
    for the music).


    How does the sound affect the audience? The listener waits for the rhythm on top,
    in groups of three, to match with the underlying groups of fours—the expectation
    naturally set up that the two patterns (the foreground pattern of three against
    a background pattern of fours) will eventually align. When will it do? We want
    some number of threes to be equal to number of fours, and the first time this
    is at the common multiple (LCM) of three and four, which happens to be 12; 4 threes
    and 3 fours are both 12. And this is what you often hear with patterns of three
    and fours—four patterns of threes played, at which point the player exits the
    pattern and plays something else. If it is right, with a good “exit strategy”
    as described, everyone will be happy—player and listener alike. Figure 7.17 is
    an example; the groupings of three notes (a quarter and an eighth) four times
