    As a final example, imagine you a pizzeria and are pricing your "fully dressed"
    round pizzas, that is pizzas with all of the toppings. It seems reasonable, *from
    a consumer''s point of view*, to price the pizza out by the area of the pizza,
    as the area determines the amount of crust, cheese, sauce and toppings required
    (pizzas aren''t priced this in real life, as we will see—you pay a premium for
    smaller pizzas). In, the amounts of each are proportional to the area of the pizza—if
    the pizza has twice the area, it will require twice the crust, cheese, sauce and
    toppings. A pizza that is twice the area would cost twice much. So the price $P$
    of a pizza should be proportional to the area $A$ (which we will measure in square
    inches, that is $A^2$).


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_48_0.png)


    The area of a pizza is not so easy to measure directly. Typically, you measure
    a round pizza from one side to another, that is, you measure the *diameter* of
    the circular pizza. You probably remember that if you are given the radius $r$
    of a circle, the area $A$ is given by


    $A = \pi r^2.$


    But the diameter $D$ is twice the radius, that is, $D=2r$, so


    $r = \frac{D}{2}.$


    Substituting in to the formula for the area, we get


    $A = \pi\left(\frac{D}{2}\right)^2 = \frac{\pi}{4}D^2 = CD^2,$


    where $C$ is the constant $\frac{\pi}{4}$. This shows that the area of a pizza
    is proportional to the *square* of the diameter, that is, $A \propto D^2$. So
    if you double the diameter $D_1$, you multiply the square of the diameter by 4,
    since $(2D)^2 = 4D^2$. That is, you *quadruple* the square of the diameter, and
    thus you quadruple the area of the pizza, and should quadruple the price of the
    pizza.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_48_1.png)


