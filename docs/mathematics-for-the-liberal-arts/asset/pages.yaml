  md: 'So providing confidence intervals or accepting or rejecting hypotheses are
    closely related, the choice of which to use depending on what kind of conclusion
    you are after—a range of values or the validity of a claim. Of course, there are
    times when the claim that you are interested in isn''t that a population statistic
    is different from a particular value, but that it is greater than less than a
    particular value. For example, if the incidence rate for diabetes is known to
    be 7.8% of the general adult population, a research group might investigate the
    validity of the statement


    vigorous exercising for one hour each day decreases the rate of diabetes.


    Mathematically, we might state the null hypothesis (the status quo) as:


    $H_0$: The proportion of adults who exercise vigorously for one hour each day
    and have diabetes is 7.8% or more.


    The more interesting alternative is


    $H_{alt}$: The proportion of adults who exercise vigorously for one hour each
    day and have diabetes is less than 7.8%.


    We would conduct an experiment by randomly selecting a sample, and then subject
    them to an hour of vigorous exercise each day, for a significant time period.
    For such hypotheses, we only reject the null hypothesis if the sample statistic
    is too extreme in one direction, but not if it is extreme in the other; in our
    diabetes example, we would only reject the null hypothesis (that the proportion
    of adults who exercise vigorously for one hour each day and have diabetes is 7.8%
    or more) if we found the sample proportion was significantly less than 7.8% (if
    it turned out to be significantly more, this would provide any evidence to reject
    the null hypothesis). In this case, these hypotheses give rise to a one-tailed
    test—we reject the null hypothesis only if the sample statistic is too extreme
    in one direction (but not in the other).


    In such a one-tailed test, confidence intervals are not used. In fact, for both
    one- and two-tailed tests, what is some statistical work that provides what is
    called a p-value, which is the probability that you would get a sample statistic
    this'
  merge: -1
