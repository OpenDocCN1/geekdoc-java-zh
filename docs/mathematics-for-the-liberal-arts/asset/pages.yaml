    # The Borda Count—Taking into Account Rankings


    To have the voter reflect the will of the people, what is often done is to ask
    voters not just to vote for a winner, but rank the candidates, from lowest to
    highest. For example, one voter might rank (that is, order) the three candidates
    A, B and C as


    $B < A < C$


    meaning that the voter prefers A to B and C to A (and of course, C to B); this
    list is calling the voter''s profile. A voter consists of list of voter profiles
    for all voters. With three candidates, there are six possible voter profiles for
    the candidates:


    $A < B < C, A < C < B, B < A < C,$nB < C < A, C < A < B, C < B < A.$


    The multiplicative counting principle gives this all, as well as are for arranging
    three objects in order, and this can be done in $P_3 = 3! = 6$ ways. For 10 candidates,
    there are $10! = 3,628,800$ possible rankings of the candidates, so the number
    of possible rankings grows huge quite quickly. With lots of voters, one often
    combines the different orderings into a table, listing how many voters had the
    candidates in a particular order. Table 5.7 shows an example (the rank numbers
    start at the top with 1 and head downwards); there are only six different voter
    profiles, as many people agreed on the six rankings.


    The Borda count system chooses a winner from a set of voter preferences by attaching
    a weight to each rank value: rank 1 out of $n$ candidates gets the highest weight,
    $n-1$, rank 2 gets the next'
