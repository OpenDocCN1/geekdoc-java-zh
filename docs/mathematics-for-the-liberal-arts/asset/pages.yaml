  md: '# 110


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_134_0.png)


    Without a scatter plot, we would be hard pressed to say anything about the data.
    From the scatter plot we immediately see that there is no linear relationship
    between likability and complexity, but we do see the outline of a curve, as shown
    in Figure 3.13. This curve is called, for obvious visual reasons, an inverted
    U curve, and points to the fact that people tend to like music (and indeed other
    forms of art like paintings and poems) that is not too simple and not too complex—something
    in the middle is found to be most desirable, though where the middle varies from
    person to person. The inverted U curve is also called the Wundt curve and appears
    in numerous places throughout the charts.


