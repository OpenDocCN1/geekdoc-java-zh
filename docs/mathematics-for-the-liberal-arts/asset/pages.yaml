    \ mode. The mean and median are close together, and both seem good central measures\
    \ of the data.\n\nLet's look at another example. Suppose we start with a list\
    \ of grades on test for 9 students:\n\n67, 41, 83, 68, 55, 59, 68, 95, 62.\n\n\
    The mean is the average—that, we add up all of the numbers and divide by the total\
    \ number of items (which happens to be 9 in this case):\n\n$mean = \\frac{67+41+83+68+55+59+68+95+62}{9}\
    \ \\approx 66.4$\n\nThe median is the middle number, and to find this, we need\
    \ to order the list, from smallest to highest or vice versa (it doesn't matter\
    \ which):\n\n41, 55, 59, 62, 67, 68, 68, 83, 95.\n\nThe list has 9 items; the\
    \ fifth number, 67, is right in the middle, so\n\n$median = 67$.\n\nFinally, the\
    \ number that appears most often is 68 (it appears twice, and every other number\
    \ appears a fewer number of times, so\n\n$mode = 68$.\n\nAll of these seem a reasonable\
    \ number-description of the list of 9 numbers, each some sort of \"central\" number\
    \ of the list. Sometimes data is presented in a frequency table, which lists the\
    \ different values together with the number of times each appears in the data.\
    \ This is particularly useful when various values appear more than once (in such\
    \ a case, the frequency table is again a compressed view of the data, and this\
    \ compression is again appealing to people). For example, if the heights in inches\
    \ members of a basketball team are\n\n76, 78, 76, 82, 81, 82, 76, 76, 78, 82,\
    \ 85\n\nthen we can form a frequency table that is easier to carry around (see\
    \ Table 2.1)."
