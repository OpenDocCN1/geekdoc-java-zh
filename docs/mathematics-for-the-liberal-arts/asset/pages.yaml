  md: 'The majority rule, the candidate with the most votes wins, satisfies all three
    of these properties. There is a famous result by mathematician Kenneth May that
    says that any group decision by an odd number of people that satisfies the three
    properties and always declares a unique winner must be majority rule—there are
    no other choices to follow.


    The argument actually isn''t so hard. Consider the smallest group of voters who
    has size n. By property (1) any group of n voters who vote for A ensures A wins,
    and any smaller group ensures B wins. Furthermore, property (3) ensures if A gets
    more than n voters, A wins, and if A gets less than n voters, loses to B. From
    property (2) the same holds for B. Thus the decision process is what is called
    a quota system—all you need to win is to have a certain number of voters (this
    number is called the quota). Here, if there is an odd number P of people, we see
    that n must be (P+1)/2, because (i) if n is smaller than (P+1)/2, then n is smaller
    than P/2—half the total—P is odd, and it is possible for both A and B to meet
    the quota and therefore get both (which isn''t allowed), while (ii) if n is greater
    than (P+1)/2, then it would be possible for neither to meet the quota, and therefore
    there no winner, again something that is not allowed. It follows that n is (P+1)/2,
    a fraction more than half, and what we have is majority rule.


    So what happens if there are even number of voters? In case we are stuck with
    no process. The argument we''ve given says that any possible system must be a
    quota system, but we are left with no good quota to use—half less allows both
    A and B to be winners, while more than half allows for no winners. This is our
    first example of what we will see throughout this section—sometimes there is no
    good way to decide on a winner.


    # Plurality—When More Is Enough


    Now we turning to more than two candidates, and those that get murky quickly.
    There need not be a winner under majority rule—only might not get a candidate,
    but each candidate might be far from a majority. For example, if one of 100 000


    As an example, if P=101, that is, there are 101 voters, then (P+1)/2=102, so the
    next integer up from half of the total. If the quota were smaller than 51, then
    it is possible for both A and B to win, each candidate gets 50 and the other gets
    51. If the quota were greater than 51, then again one candidate gets 50 and the
    other getting 51, we''d have a problem, but neither would win. Thus the quota
    must be 51—a majority of the votes.'
