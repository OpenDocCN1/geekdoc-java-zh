  md: 'Moreover, something amazing happens with the numbers.

    Suppose you divide each Fibonacci number by the preceding one:


    ```

    1/1 = 1

    2/1 = 2

    3/2 = 1.5

    5/3 = 1.667

    8/5 = 1.6

    13/8 = 1.625

    21/13 = 1.6154

    34/21 = 1.6190

    ```


    They seem to get closer to the golden ratio 1.618033988..., and in fact they do:
    The ratios of successive Fibonacci numbers are excellent approximations of the
    golden ratio, the farther out you go.


    Fibonacci numbers are not only attractive, mathematically, but they also occur
    throughout nature. For example, the number of petals in a flower is often a Fibonacci
    number—example, trilliums have three petals, geraniums have five, mountain avens
    have eight, and black-eyed Susans have thirteen (see Figure 6.5). The hexagons
    that make up the skin of pineapples form spirals in different directions across
    the pineapple, each with Fibonacci number of hexagons (5, 8, 13). Finally, bees
    reproduce in an interesting way—each male has only one (female) parent, but each
    female has two (male and a female). So each male has one parent, two grandparents,
    three great-great-grandparents, and so one, while a female has two parents, three
    grandparents, five great grandparents, eight great-great-grandparents, etc.—Fibonacci
    numbers throughout the honeybee family tree.


    Golden rectangles are found everywhere in nature too. For example, Figure 6.6
    shows a black garden ant. Notice how the three main body parts are well-fitted
    with golden rectangles (shown in red).


