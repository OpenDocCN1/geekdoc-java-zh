  pgno: 90
- img_proc: true
  md: '# MAKING SENSE OF YOUR WORLD WITH STATISTICS 67


    +   - We can choose a specific (small) number k and take every kth person from
    the population—this process is called systematic sampling.


    +   - We can separate the population into groups or clusters, not based on any
    important characteristics, and then choose to sample everyone in one of the random
    clusters. This approach is called cluster sampling.


    (Of course there are other, poorer methods, that may suffer from serious biases.
    We''ll talk more about this at the end of the chapter.)


    To see the difference between attendees, let''s imagine that we know what percentage
    of attendees at an event in a stadium have made a purchase, by the end of the
    game, at the concession stands. It is unbelievably to canvass 44 000 fans in the
    sold out game, so we elect to choose a sample of 200.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_91_0.png)


    +   - We could take a simple sample by choosing 200 numbers at random from the
    ticket numbers that were sold and logged in present.


    +   - Realizing that 60% of the attendees are men, we could take a stratified
    sample, by dividing the population (the attendees) into two groups, men and women.
    We then could choose 120 men and 80 women at random.


    +   - We could take a systematic sample by taking every 15th attendee entering
    the gates until we had a sample of 200.


    +   - Each of the 220 sections has exactly 200 people, so we choose one of the
    220 sections at random and sample all people in that section.


    You probably feel that the simple sampling would provide the best data, and indeed
    it would; the reason the other methods are used in practice are


    +   - simple random samples can be costly to gather (as they may involve, for
    example, traveling across an entire country or even the world to reach members
    of the sample) and'
