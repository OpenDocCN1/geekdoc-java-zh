  md: "# HEALTH, SAFETY AND MATHEMATICS\n\n# What's the Percent in That?\n\nFirst,\
    \ recall that percents correspond to decimals, after you move the decimal place\
    \ two places to the left. So, for example, 72% as a decimal is 0.72 (since 72%,\
    \ which is 72% with a decimal point, is 0.72 when you move the decimal places\
    \ to the left). As another example, 2.4% is 0.024 (when you move the decimal place\
    \ to the left, you need to add an extra zero before the decimal point). On the\
    \ other hand, 0.05 is the same as 5%, as you move the decimal point to the **right**\
    \ when you go from a decimal to a percent.\n\nPercents are fractions as well,\
    \ as fractions can be written as decimals—for example, 1/4 is 25%, or 1/4 = .25.\n\
    \nOne common translatable word is “of,” which can have one of two translations\
    \ into mathematics:\n\n+   - The phrase “of” converts to division. For example,\
    \ “12 out of 20” corresponds to 12/20, which is 3/5, or 0.6 as a decimal.\n\n\
    +   - By itself, “of” translates to multiplication. For example, “half of 16”\
    \ is 8, as $\frac{1}{2} \\times 16 = 8$.\n\nZeros can be added freely numbers\
    \ before the first digit (provided the first digit is the left of the decimal\
    \ point, or to the right of the last digit, provided the decimal point is the\
    \ same as 0.007203 and 7.203000. This comes in handy when converting from percentages\
    \ and back.\n\nSo combining our knowledge of percentages and the translation of\
    \ “of”, we see that, for 72% of 25 is $0.72 \\times 25 = 18$. And, on the other\
    \ hand, 41 out of 50 is $41/50 = 0.82$, or 82%. Arithmetic can be simple if you\
    \ know how to translate.\n\nSometimes we represent multiplication with the $\t\
    imes$ symbol, sometimes by just putting two numbers side by side.\n\nLet’s take\
    \ our math into real life. You are at a restaurant with a date the waiter brings\
    \ you the bill. There is a subtotal and a tax amount—the subtotal is $42.00 with\
    \ tax of $3.36, for a total of $45.36. You know that you should leave a 15% tip\
    \ on the meal cost, not the tax. But you know how to do the calculation?\n\n![](img/a2a6f439c6e02b960b8f4c54a2a56513_31_0.png)\n\
    \nWhat is the math involved? You want to leave a 15% tip on $42.00, which we know\
    \ means finding $0.15 \\times 42.00$. With a calculator immediately that the tip\
    \ is $6.30. Voila!\n\nBut if you don’t want to take out your calculator, and you\
    \ want to impress with your mental math skills (which of course will impress all\
    \ dates?) There is a simple mathematical “trick” you can remember to do the calculation\
    \ in your head. Notice that 15% is the same as 10% and 5%. So to calculate"
