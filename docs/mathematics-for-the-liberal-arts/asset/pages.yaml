  md: '48


    +   * the minimum value,

    * the first quartile or lower quartile $Q_1$,

    * the median $Q_2$,

    * the third quartile or upper quartile $Q_3$, and

    * the maximum value.


    (A **quartile**, arising from the word *quarter*, is 25% of the data, so the first
    quartile $Q_1$ is the 25th percentile, the second quartile $Q_2$ is $25 + 25 =
    50\%$th percentile, that is, the median, and the third quartile $Q_3$ is the $25
    + 25 + 25 = 75\%$th percentile.) This list of numbers is called, not surprisingly,
    the **five-number summary** of the data list. As there were some choices for the
    definition of the percentiles, we take as our first and third quartiles the medians
    of the data lists below and above the median of the whole list (the definition
    of the median of a list was not up for discussion!)

    For $10, 10, 10, 10, 10, 10, 10, 10, 10, 10$, we easily see that the minimum,
    the first quartile $Q_1$, the median (i.e., the second quartile $Q_2$), the third
    quartile $Q_3$ and the maximum are all 10, so the five-number summary is 10, 10,
    10, 10, 10.


    For the second data list, $5, 5, 5, 10, 10, 10, 15, 15, 15$, we find that

    * the median is 5,

    * the median is 10, occurring between the middle two 10''s

    * the first quartile $Q_1$ is the median of the bottom half of the list, $5, 5,
    5, 10, 10, 10$, which is $(5 + 10)/2 = 7.5$,

    * the third quartile $Q_1$ is the median of the bottom half of the list, $10,
    10, 10, 15, 15, 15$, which is $(10 + 15)/2 = 12.5$, and

    * the maximum is 15.

    Thus the five-number summary for the data $5, 5, 5, 10, 10, 10, 15, 15, 15$ is


    5, 7.5, 10, 12.5, 15,


    The first and last numbers of the five-number summary give the range for the data,
    and the median three numbers give the values where approximately 25%, 50% and
    75% of the values lie to the left.'
