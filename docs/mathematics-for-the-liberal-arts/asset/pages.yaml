  md: 'Minimum cost spanning trees arise in many other applications. One is clustering
    of data points into groups—one looks at the distances between data points and
    grows clusters in a tree-like manner. Another is to phylogenetic trees; once you
    have a measure of distances between life forms (whether they are animals or DNA
    sequences) you can search for a minimum cost spanning tree that can be useful
    in proposing the underlying evolutionary history. Finally, minimum cost spanning
    trees have even found use in explaining the spread of viral diseases.


    # Shortest Paths and Mazes


    Some puzzles you would have seen when you were younger would include mazes. I''m
    sure you spent hours trying to find your way out of a maze on a page. Here again
    graph theory comes to the rescue. To explain how to do it, we solve a more general
    problem.


    We turn to weighted graphs. Figure 3.28 shows a downtown core, with the weights
    on each edge the length of the street (between the relevant intersections). If
    we have a graph of airplane routes, then we could label each edge with the cost
    of a one-way ticket for flight (see Figure 3.29).


    The questions we want to answer are the following: What is the shortest way to
    get from one corner to another in the downtown core? What is the cheapest way
    to fly from one city to another? These problems sound like they might be related
    to minimum cost spanning trees, but they all turn out to be part and parcel of
    one general problem on weighted graphs: what is the shortest path from vertex
    to another, where the length of a path is the sum of the weights on all the edges
    in a path?


    Dijkstra''s algorithm quickly finds shortest paths from any vertex v to all the
    rest. The basic idea is this: You start at v and successively locate vertices
    on shortest paths from v, designating them as “discovered” along the way. The
    whole process revolves around the observation that if you have a shortest path
    from v to u, then the path from v to each intermediate vertex must be a shortest
    path as well.'
