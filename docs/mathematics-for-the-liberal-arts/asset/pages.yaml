    # A Deadly Lack of Math


    A 43-year-old mother, Denise Melanson, passed away in 2006. She had been diagnosed
    six months prior to nasopharyngeal cancer, but that is not what she died from—her
    chemotherapy medication, Fluorouracil was delivered intravenously over 4 hours
    instead of the prescribed 4 days. Although the mistake was discovered one hour
    after the end of the infusion, the overdose resulted in multi-system failure for
    which there was no cure. Sadly she died within a month of receiving the lethal
    dose.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_54_0.png)


    Ms. Melanson''s cancer was advanced, but treatable, and it was expected to recover.
    There were a number of similar fatalities between 2000 and 2007, and that does
    not count the undocumented or unreported serious medication errors added to this
    mix. Two reports were commissioned based on the horrific error. One of the reports
