  md: 'Again, to find the money we need to invest now, we add up the present values
    of all of the payments:


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_205_0.png)


    The problem is that we need to add up infinitely many terms. But suppose we, in
    our minds, stop the payments after some large number of them, 100. Then we find
    that the amount we need to invest is


    ```

    $$\begin{aligned} \frac{1000}{1.08} + \frac{1000}{1.08^2} + \cdots + \frac{1000}{1.08^{100}}
    \ \frac{1000}{1.08} \left(1 + \frac{1}{1.08} + \left(\frac{1}{1.08}\right)^2 +
    \cdots + \left(\frac{1}{1.08}\right)^{99}\right) \ \frac{1000\left(1-\left(\frac{1}{1.08}\right)^{100}\right)}{1.08-1/1.08}
    \ = 12494.32 \end{aligned}$

    ```


    So that gives us a rough idea of how much we need to invest now. But of course
    we need more (if we can do it all) as we want not just 100 payments, but an indefinite
    number of payments. If we do the same for 1000 payments, we get


    ```

    $$\begin{aligned} \frac{1000}{1.08} + \frac{1000}{1.08^2} + \cdots + \frac{1000}{1.08^{1000}}
    \ \frac{1000\left(1-\left(\frac{1}{1.08}\right)^{1000}\right)}{1.08-1/1.08} \
    = 12500.00, \end{aligned}$

    ```


    though there is some rounding going on. But the key thing is that things didn''t
