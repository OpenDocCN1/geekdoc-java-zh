    | 1 | A | B | C | 2 |

    | 2 | B | C | B | 1 |

    | 3 | C | A | A | 0 |


    The Borda counts for A, B and C are 22 and 15, respectively, so we should declare
    B the winner. But A was on top of more than half the votes, so shouldn''t A win
    by the majority rule? What we learn is while the Borda count sounds nice, in practice
    it can lead to some unusual outcomes.'
