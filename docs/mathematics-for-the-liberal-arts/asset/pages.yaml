    # Leading You Down the Garden Path with Statistics


    Statistics are a great thing—they provide you with numbers that can encapsulate
    huge amounts of data, making the latter palatable and understandable. But, in
    the wrong hands, they can confuse and even mislead, even accidentally or intentionally.
    Writer Mark Twain wrote in 1906,


