  md: 'of the strings accurately, he plucks this string with one of the other two
    and listens carefully. If the string is slightly out of tune, he hears a single
    frequency (rather than two) that warbles in a "wah-wah" effect that is called
    beats. He then tunes the second string, listening to the beats, which slows down
    as the frequencies get closer together, and the beats disappear entirely when
    the two strings are at the same frequency.


    Why does this effect happen? We say that humans can hear combinations of sound
    waves, which are curves. In high school, you were no doubt tormented with proving
    trigonometric identities, which were little results that said one expression involving
    functions was always equal to another, seemingly different looking one. You might
    have been asked to prove that $2\sin^2x - 1 = 1 - 2\cos^2x$. Here is another identity:


    $\sin A + \sin B = 2\cos\frac{A-B}{2}\sin\frac{A+B}{2}$


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_367_0.png)


    This is probably one you haven''t seen before, but take from it, it is always
    true, for any numbers $A$ and $B$. Now in the case when $A$ and $B$ are close
    together, when two frequencies are close but not equal, instead of hearing two
    notes (which is what the left side of the trig identity expresses) we hear a single
    note at the average frequency (which is the last term on the right side). The
    "wah-wah" effect is produced by the cosine term, which disappears when $A$ equals
    $B$, that is, the two frequencies are identical. Beats give instruments like pianos
    and 12-string guitars their warmth, and it is one of the reasons we like to listen
    to choirs—it''s not so much the perfection of tunings, but the small amount of
    "out-of-tune" that we like so much! In fact, recording artists record their voices
    twice (known as "double-tracking" their vocals) for this reason.


    In the computer program "Trig Sounds," found at www.jasonbrown.com/mla, assign
    a frequency of 120 Hz to one and 126 Hz to the second. Listen for the beats. Then
    change the frequency of the second, bringing it closer to 120 Hz, and listen to
    what happens to the beats.


    A trigonometric identity trigonometric functions (like sines, cosines and tangents)
    is true in all instances.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_367_1.png)


    Figure 7.4: Not only can you feel the beat, now you can see it!


