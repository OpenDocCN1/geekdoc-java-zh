  md: '# Mathematics


    > “Jason Brown has managed to tie mathematics with everyday topics and ideas for
    the liberal arts major. … Liberal arts majors will finally see how mathematics
    works in everyone’s day-to-day life.”

    —Jennifer Powers, Michigan State University


    This book provides its readers with tools to understand and evaluate how mathematics
    intervenes in virtually every area of modern life. Modern vignettes motivate the
    exposition of mathematics underlying such issues as ensuring safety, controlling
    risk, decision making, recreations, and appreciating art.”

    —Ed Barbeau, Professor Emeritus of Mathematics, University of Toronto


    Jason Brown has created a unique textbook aimed at providing students nonquantitative
    majors with both an appreciation for the ubiquity of mathematics in their lives
    and practical skills that can enhance those lives.”

    —Keith Taylor, Dalhousie University


    # How Can Mathematics Play a Role in Your Life?


    In this book, you will discover that a little more math, your daily life will
    be more productive, understandable, and creative. With numerous examples and more
    than 600 exercises, the text shows you how to use math seamlessly in a variety
    of practical areas, from conversion factors, statistics, visualization, money,
    and risk to games, art, music, and humor. Real-life stories in each chapter will
    capture your interest and motivate you to work through the math. After reading
    the book, you will see how far a bit of math can take you in everyday situations.


