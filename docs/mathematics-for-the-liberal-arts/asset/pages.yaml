    Now let''s try counting a more difficult problem—the number of rhythmic grooves
    where we decide ahead of time how many onsets (strikes) we are going to. Let''s
    focus on a particular example, say 7 onsets among a bar of 16 sixteenth notes.
    This question is the same as deciding how many can we choose 7 numbers (the onsets)
    from among 16 different possibilities (the 16 different numbers 1 through 16 inclusive).


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_385_0.png)


    This sounds suspiciously like combinations, and indeed it is. The number of ways
    to select 7 onsets among a bar of 16 sixteenth notes is $C_{16,7}$, which is


    ```

    $$\frac{16!}{(16-7)!} = \frac{16!}{9!} = 11 440$$

    ```


    many grooves, and, more generally, in a bar with $n$ possible onsets, the number
    of grooves with $k$ onsets is exactly $C_{n,k}$.\nHere are a few mathematical
    rules about combinations that we can see just from the connection to connecting
    grooves with $k$ onsets among $n$ possible ones. For example, choosing the $k$
    onsets is obviously equivalent to choosing the ones we miss (of which there are
    $n-k$), so reversing the roles of choosing onsets and nononsets, we see that the
    number of grooves with $k$ onsets among $n$ possible ones is the same as the number
    of grooves with $n-k$ onsets among $n$ possible ones, that is,


    ```

    $C_{n,k} = C_{n,n-k}$.

    ```'
