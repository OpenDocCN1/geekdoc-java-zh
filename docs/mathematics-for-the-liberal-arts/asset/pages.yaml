    is that using a pie chart, the implication is that we are asking the reader to
    implicitly consider each region''s happiness in comparison to the “whole” happiness
    of the world, where it makes little sense to define the latter as the sum of the
    happiness of the regions! Also, the pie chart hides the values of happiness, so
