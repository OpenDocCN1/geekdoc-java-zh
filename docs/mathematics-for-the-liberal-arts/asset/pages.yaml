    begun will look like


    ```

    $$0.54 - E, 0.54 + E$$

    ```


    where $E$ is the margin of error (recall that the interval $[x, y]$ often sets
    the mean of all greater than or equal to $x$ and less than or equal to $y$). How
    we we calculate $E$ for proportions is not too hard, though we''ll leave out the
    explanation of how it is derived:


    > Suppose we have taken a sample of size $n$ from a population in order to estimate
    the proportion of the population with a certain property, and find that $\hat{p}$
    has the property in question. The margin of error, for a confidence level of $c\%$,
    is calculated by


    $$E = z \times \sqrt{\frac{\hat{p}(1-\hat{p})}{n}}$$


    where $z$ depends on the desired confidence level. (The sample size $n$ can''t
    be too small for the calculation to work—you need $n\hat{p}(1-\hat{p}) \geq 10$).


    The definition of "close" in statistics takes a while to be narrowed down. Most,
    often means 95% of the time, sometimes it is relaxed to 90% of the time or tightened
    to 99% of the time—it all depends on how we are willing to be wrong?


    The value of $z$ comes from the standard normal distribution, being the value
    between which $-z$ and $c\%$ of the values lie. The amazing fact is that, provided
    that the sample size is chosen appropriately, the sample proportion turns out
    to be normally distributed, with mean $p$ (the true mean) and standard deviation
    $\sqrt{\frac{p(1-p)}{n}}$ (for many of the population statistics you would want
    to estimate, are approximately normally distributed as well, if the sample is
    large enough). 95% of the values for a normal distribution lie within 2 standard
    deviations—actually, we should have been a little more precise and said that in
    1.96 standard deviations of the mean, 95% of the values lie. The 1.96 is close
    to 2, rounded without mentioning it.


    If we sample with replacement, that is we choose n items randomly from the population,
    returning each one to the population before we pick next, then the distribution
    is a binomial distribution. If $x$ is the number, of $n$ chosen, that have the
    proportion (which has proportion $p$ in the population), the distribution of $\hat{x}$
    is close to a normal distribution with mean $p$ and deviation $\sqrt{\frac{p(1-p)}{n}}$.


    For our purposes, all we need is the following table (which is small enough to
    memorize, if you want):'
