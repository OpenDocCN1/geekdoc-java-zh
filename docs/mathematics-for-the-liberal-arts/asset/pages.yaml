    # And Now we return to the Rest of the Story ...


    And now we return to Dr. Wakefield''s research on the connection between vaccinations
    and autism. His research paper was based on twelve children with autism-like symptoms
    who were referred to London''s Royal Free Hospital. Of these, eight of them had
    parents or doctors who noted the developmental symptoms started soon after they
    received their MMR vaccine. At a press conference, Dr. Wakefield intimated that
    the MMR vaccine may be a cause of autism disorders and an associated bowel disease,
    and he came out recommending that the MMR shot be split into individual vaccinations
    for measles, mumps and rubella.


    The paper, and subsequent review by Dr. Wakefield about his findings, were seized
    by the media, and there was widespread panic about the safety of the vaccine,
    in spite of other scientific evidence that supported the safety of the MMR vaccine
    (many subsequent studies found no statistical evidence of MMR causing autism or
    bowel disease). Use of the vaccine dropped significantly in the United Kingdom–1996,
    92% were vaccinated, while only 84% were in 2002, with places in London at only
    61%. Small drops in MMR vaccination rates appeared in the U.S., Europe and elsewhere
    around the world, because of Wakefield''s work.


    The Wakefield research was a case study in how mislead with statistics. First
    and foremost, the research was not based on sound statistics. The sample under
    study was extremely small (n = 12) and was far from a randomized control trial—there
    wasn''t even a control group. Much of the evidence was anecdotal, based on the
    recollection of a small number of parents and doctors. And there was evidence
    that not only was the data inaccurate “manipulated” to imply a link between the
    MMR vaccine and autism. But the problems with the research were much deeper than
    the statistics:


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_119_0.png)


    +   - Dr. Wakefield had paid the equivalent amount of over £430,000 (roughly about
