  md: '# And Now the Rest of the Story ...


    The door MC Escher walked through was the mathematical world of geometry. He couldn''t
    understand the language in the paper—the mathematics was too theoretical for someone
    unschooled in proofs—but Escher had an innate understanding of the geometry from
    the figures included.


    Escher devoured the paper''s figures, and he was addicted to their study. How
    could he make use of them? He had already been carrying out his own studies, his
    research, in til, finding out rules and principles for generating them, but now
    he had some devotees, though they were mostly interested in the math, not the
    art. Escher continued with his “addiction” to tilings, but his work was becoming
    more and more abstract all the. Early in his career he was meant to capture landscapes,
    but more and more the pictures he attempted to capture were not in the world that
    he was in.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_359_0.png)


    1954 was a tipping point. The International Congress of Mathematics (ICM) was
    held in Amsterdam, and Escher, already renowned in circles for his expressive
    and captivating artwork, gave a speech, though he was an artist, not a mathematician.
    Though Professor H.M.S. (Harold Scott MacDonald, or just “Don”) Coxeter, a world
    famous geometer from the University of Toronto in Canada missed the talk, he brought
    two of Escher’s prints. After writing to Escher to ask to reproduce two of his
    artworks for a geometry paper he was writing, Coxeter mailed back to Escher a
    copy of his latest geometry paper, on usual geometries on spheres and something
    called the hyperbolic plane.


    Figure 6.35: M.C. Escher (1898-1972). All M.C. Escher ©2014 The Escher Company.
    All rights reserved. Used with permission: www.mescher.com


    The inspiration was instantaneous and ground-shaking. In Coxeter''s paper (among
    the math jargon, the “hocus-pocus text” ¹ that Escher couldn''t make sense of)
    there were drawings of infinitely smaller objects on the surface of a circle,
    ones that seemed to approach infinity as they decreased in size. Escher exerted
    a huge effort to understand the pictures, they were created, until he could make
    the process he was own.


    > ¹ S. Roberts. King of Infinite Space. Anansi, Toronto, 2006


    In subsequent years, Escher and Coxeter exchanged a lot of correspondence, both
    geomet, though one an artist, the other a mathematician. Coxeter appreciated Escher''s
    natural talents and intuitive understanding of geometry and was always willing
    to share his knowledge, the consummate that he was. Escher stated that the changes
    changed dramatically the direction of his art, that art still thrilled viewers
    and artists—artwork that might not have existed without the mathematics.'
