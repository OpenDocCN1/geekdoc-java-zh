  md: 'problems on graphs. The fewest number of edges needed to connect a set of vertices
    is always one less than the number of vertices, and such a minimal connection
    of edges is called a spanning tree, as it visually resembles a tree. (In Figure
    3.31, redrawn in Figure 3.24 without there are 8 vertices and 7 edges in the spanning
    tree shown in red.) Every connected graph has a spanning tree—this follows from
    the fact if an edge in a cycle, it can be deleted, leaving the graph still connected.


    Figure 3.24: Spanning tree.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_158_0.png)


    A weighted graph is a graph where every edge has a non-negative number attached
    to it. If we have a spanning tree in a weighted graph, we can talk about its cost,
    which is just the sum of the weights of its edges. Figure 3.25 shows a weighted
    graph, along with all eight of its spanning trees. Their weights can be calculated
    as follows:


