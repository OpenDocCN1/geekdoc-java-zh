    # 1.2 The Essentials of Conversion


    QUANTITIES, LIKE WORDS, SOMETIMES NEED TO BE CONVERTED. People in different locations
    or under circumstances take measurements in different scales.


    # Success Is Proportional to the Work


    Definition 1.2.1. We say that measurement (or quantity) y is proportional to measurement
    (or quantity) x if there is some fixed positive number C (called the constant
    of proportionality) such that


    y = Cx.


    We also call C conversion factor from x to y. When y is proportional to x we write
    y∝ x. The important fact is that if y is proportional to x, then multiplying one
    by a factor multiplies the others by the same factor. So, for example, doubling
    x doubles y, tripling x triples y, and halving x halves y, and so on. Here are
    some examples of quantities that are proportional:


    Proportionality is such a useful property when it holds. How do we check if two
    real-life quantities are proportional? You gather data and analyze it. More about
    this in Chapter 3.


    +   - distance in miles and feet

    - distance in miles and kilometers

    - length in feet and inches

    - height in meters and feet

    - area in square meters and square yards

    - volume in liters and gallons'
