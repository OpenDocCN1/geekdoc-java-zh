  md: '# 6 Art Imitating Math


    Maurits Cornelis, known as “Mauk” or just “MC”, was born in 1898 in Leeuarden,
    the Netherlands. From an early age, little Mauk was obsessed with the idea of
    filling up space with non-overlapping objects. Indeed, when he was small, he would,
    while making a sandwich, choose very carefully the shape and sizes of the cheese
    so that the pieces would fit precisely together to cover the bread. A very interesting
    preoccupation, indeed!


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_321_0.png)


    At school, Mauk didn''t excel and didn''t particularly well in mathematics and
    science, though he liked the preciseness and methodologies of the subjects—after
    all, his father and three of his brothers were in engineering fields, and he appreciated
    logical lines of thought.


    On the other hand, Mauk loved art at school, and in school learned how to make
