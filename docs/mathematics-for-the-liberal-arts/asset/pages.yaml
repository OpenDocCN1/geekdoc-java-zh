    # Climbing the Levels


    The problem with paradoxes like the Master Book problem is

    items or sentences refer back to themselves, like the sentence

    "This sentence is false." If the sentence is true, then it is false,

    and if it is false, then it is true, you get into a vicious circle

    of reasoning. One way out for logicians is to set up levels of

    reasoning, and objects are not allowed to talk about themselves—

    such sentences are only allowed at the next level up.


    And the next level up for reasoning is called a meta level,

    where you can talk what you can express in the previous

    level. For example, on a "basic" level (though it may not be basic'
