  md: '# 1 Health, Safety and Mathematics


    Air Canada Flight 143 was about halfway through its flight from Ottawa, Ontario,
    Alberta, a distance of approximately 1,800 miles. It was a clear, beautiful day,
    and nothing amiss or out of the ordinary to Captain Bob Pearson or his First Officer
    Maurice Quintal, or to the 61 passengers on board. Everyone was looking forward
    to touching down in Edmonton.


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_29_0.png)


    The plane was flying at an altitude of 41 000 feet over the small town of Red
    Lake, Ontario, north of Minnesota, and close to the border between Ontario and
    Manitoba, two central provinces in Canada. The calm was broken by a warning alarm
    that went off in the cockpit, signaling that pressure for the left engine was
    dropping. The crew could imagine that fuel gauge malfunction was at fault, so
    they turned off the alarm. The on-board computer confirmed that there was enough
    fuel to complete the flight. Not a big problem. But then the warning alarm went
    off for the right engine, and a loud noise indicated that both engines were out
    of fuel, leaving the plane not with power, but with the instrument panels in the
    dark as well. The pilots could still use their radio, and contacted the control
    tower in Winnipeg. That city was so far away, but there was a small tarmac at
    an old air base in Gimli, Manitoba. That would be their only chance of survival.


    Earlier in the day, the plane''s fuel gauges were not working, and the crew had
    to manually calculate how much fuel the plane would need for the flight, using
    “dip” readings that would tell the depth of the fuel in the tanks, and the volume
    in liters. The pilot and copilot hadn''t been trained to do the calculation (on
    other jets, there were often flight engineers to carry out such tasks), but it
    seemed straightforward. The specific gravity of the fuel was written down by the
    maintenance refuelers as 1.77 pounds per liter, along with an estimate of the
    number of liters in the tank; Pearson and Quintal ordered a specific additional
    amount of fuel. Certainly, the fuel gauges could be fixed, but that could wait
    until after the flight. With plenty of fuel on board, Flight 143 was ready to
    go.'
