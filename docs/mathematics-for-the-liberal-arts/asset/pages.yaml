- img_proc: true
  md: '# MAKING SENSE OF YOUR WORLD WITH STATISTICS


    Life Lesson: When confronted with a lot of data, people like to condense the numbers
    into a smaller descriptive list, even at the expense of losing some information.
    Compression of a large quantity of information into a smaller amount is always
    desirable and appreciated.


    # Numbers that Describe


    Descriptive statistics are numbers that summarize data, in some way. Let''s start
    with a single number. Here, there are a few common choices.


    Definition 2.1.1. Given a list of numbers,


    +   * **the mean is the average** of

    * **the median** is the middle value, when you order the list, if there is an
    odd collection of numbers, and the average of the middle two if there is an even
    collection of numbers,

    * **the mode is the most common number in a list (a list could have more than
    one mode, or no mode if no number repeats).


    > Note that all we can say definitively is that the items are less or equal to
    the median and half greater than it, depending on the number of items in the data
    list and a number of repetitions of the median value. For example, the median
    of 1, 2, 3, 5, 6, 9 is 5, but as the list is ordered, half the numbers are less
    than or equal to 5, and fewer are greater than it is pretty close. Similarly for
    the data list 1, 2, 5, 5, 6, 9, with median 5.


    Let''s consider a monthly list of currency exchange rates for U.S. dollars in
    terms of Canadian dollars:


    1.1074, 1.1138, 1.0636, 1.0620, 1.0427, 1.0303,

    1.0530, 1.0272, 1.0518, 1.0368, 1.0075, 1.0160.


    The sum of all 12 values turns out to 12.6121, and by dividing by 12, we find
    that the mean is 1.0510. When we reorder the numbers, we get the list:


    1.0075, 0.0160, 1.0272, 1.0368, 1.0427,

    1.0518, 1.0530, 1.0620, 1.0636, 1.1074, 1.1138


    There is no middle number, as there are 12 items; we find the median by averaging
    the middle numbers—the median is'
