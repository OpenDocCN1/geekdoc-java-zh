    # Be Less Afraid!


    Conditional probabilities can be even more useful when we have to decide whether
    to panic or not over medical test results. I remember Friday when I found a lump
    in my neck. I went to a walk-in clinic, and after examining the enlarged node,
    the doctor said “I’m going to run some tests. It could be lymphoma.” I spent the
    whole week worrying about the “C” word.


    In retrospect, I should have been less worried than I, and to explain why, I need
    to bring up a very powerful rule about conditional probabilities:


    Bayes’ Theorem: Suppose that $E$ and $F$ represent two events, with $Prob(F) \neq
    0$. Then


    ```

    $Prob(F|E) = \frac{Prob(E|F)Prob(F)}{Prob(E|F)Prob(F) + Prob(E|F)Prob(F)}$

    ```


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_233_0.png)


    Bayes’ Theorem holds as the top of the fraction is just $Prob(E \cap F)$, while
    the bottom is $Prob(E \cap F) + Prob(E \cap \overline{F})$, that is, the probability
    that $E$ happens and $F$ happens plus the probability that $E$ happens and $F$
    doesn''t happen, which is obviously the probability that $E$ happens.


    So aimed with Bayes’ theorem, let’s go back to my node. We’ll let $N$ denote the
    event that I have a prominent node in my neck and $L$ the event that I have lymphoma.
    The incidence of lymphoma for my age group at the time was about 2.9 cases


