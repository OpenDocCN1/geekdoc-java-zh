    to learn what (and who) to look for.


    # Garden Path #1: Sampling Bias


    We''ve seen that when someone wants to estimate a population statistic, the reasonable
    thing to do is to choose a sample and estimate the population from the corresponding
    sample statistic. Certainly there could be problems if the sample size is too
    small. For example, if you wanted to determine the rate of cancer in your state
    and only sampled 5 people at random, you could find no instances of cancer, and
    predict a cancer rate of 0%, or find 3 out of the 5 having cancer and predict
    a rate of 60%, neither being likely is better, and often crucial to the accuracy
    and predictability of the results. All after, if you took a sample of size one,
    you would predict either 0% or 100% of cancer!


    ![](img/a2a6f439c6e02b960b8f4c54a2a56513_108_0.png)


    But if you choose a large sample, it is vital that the sample be chosen in a way
    that is representative as possible of the entire population. The gold standard
    is to choose a simple random sample, where all the members of the population are
    equally likely to be chosen. Of course, sometimes that may be difficult or even
    impossible, so other approaches, such as stratified, systematic or cluster sampling
    are used, but the further you get from simple random sampling, the more likely
    you are to introduce bias into the sample, and that may make the estimation less
    accurate. For example, if you took a poll of your friends and family on global
    warming you might end up with a markedly different result from the Gallup poll
    described in the previous section. I don''t know your views on the subject, but
    chances are those closest to you share some of your views, and taking even a large
    sample won''t help if the sampling is far from random. Even if you veer away from
    friends and family and call cell phone numbers from an online list for your city,
    there is at least one issue:


    +   - You only reach those who have a cell phone, and leave out those who only
    have land lines or those who have no phones at all! And you''ve only reached a
    sample in your city. The'
