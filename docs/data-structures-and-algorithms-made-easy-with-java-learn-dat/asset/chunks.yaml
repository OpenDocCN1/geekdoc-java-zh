  trans: "\n\n![](img/rsrc2GD.jpg)这是经过 `(V-1) = 3` 次迭代后的图表样子。这应该是正确的结果，因为有 4 条边，我们最多需要\
    \ 3 次迭代来找到最短路径。因此，要么这就是答案，要么图中存在负权环。为了找到它，在 `(V-1)` 次迭代后，我们再进行最后一次额外的迭代，如果距离继续减小，说明图中一定存在负权环。\n\
    \n对于这个例子：如果我们检查 `2-3`，`d[2] + cost[2][3]` 将得到 1，它小于 `d[3]`。因此我们可以得出图中存在负环。那么，我们如何找到这个负环呢？我们对\
    \ Bellman-Ford 过程进行细小的修改：\n\n```\nProcedure NegativeCycleDetector ( Graph, source):\n\
    \  n := number of vertices in Graph\n  for i from 1 to n\n    d[i] := infinity\n\
    \  end for\n\n  d[source] := 0\n\n  for i from 1 to n- 1\n    flag := false\n\
    \    for all edges from (u,v) in Graph\n      if d[u] + cost[u][v] < d[v]\n  \
    \      d[v] := d[u] + cost[u][v]\n        flag := true\n      end if\n    if flag\
    \ == false break\n  end for\n\n  for all edges from (u,v) in Graph\n    if d[u]\
    \ + cost[u][v] < d[v]\n      Return \"Negative Cycle Detected\"\n    end if\n\
    \  end for\n\n  Return \"No Negative Cycle\"\n```\n\n这就是我们如何找到图中是否存在负环的方法。我们也可以修改\
    \ Bellman-Ford 算法来跟踪负环。\n\n# 章节 20.3: 为什么我们最多对所有边进行松弛 (V-1) 次\n\n为了理解这个例子，建议先对\
    \ Bellman-Ford 单源最短路径算法有一个大致的了解，可以在此处找到它。\n\n在 Bellman-Ford 算法中，为了找到最短路径，我们需要松弛图中所有的边。这个过程最多重复\
    \ `(V-1)` 次，其中 `V` 是图中顶点的数量。\n\n从 `source` 到所有其他顶点的最短路径所需的迭代次数取决于我们选择松弛边的顺序。\n\
    \n让我们来看一个例子：\n\n![](img/rsrc2GE.jpg)在这里，源顶点是 1。我们将找到源和所有其他顶点之间的最短距离。我们可以清楚地看到，到达顶点\
    \ 4 在最坏情况下需要 `(V-1)` 条边。现在根据边被发现的顺序，可能需要 `(V-1)` 次才能发现顶点 4。还没明白？让我们使用 Bellman-Ford\
    \ 算法在这里找到最短路径：我们将使用下面这个序列：\n\n```\n+--------+--------+--------+--------+\n| Serial\
    \ | 1 | 2 | 3 |\n+--------+--------+--------+--------+\n| Edge | 3->4 | 2->3 |\
    \ 1->2 |\n+--------+--------+--------+--------+\n```\n\n对于我们的第一次迭代：\n1. `d[3]\
    \ + cost[3][4]` = infinity。它不会改变任何东西。\n2. `d[2] + cost[2][3]` = infinity。它不会改变任何东西。\n\
    3. `d[1] + cost[1][2] = 2 < d[2]`。`d[2] = 2`。`parent[2] = 1`。\n\n我们可以看到我们的松弛过程只改变了\
    \ `d[2]`。我们的图看起来像这样：\n\n![](img/rsrc2GF.jpg) 第二迭代：\n1. `d[3] + cost[3][4]` = infinity。它不会改变任何东西。\n\
    2. `d[2] + cost[2][3] = 5 < d[3]`。`d[3] = 5`。`parent[3] = 2`。\n3. 不会改变。\n\n这一次松弛过程改变了\
    \ `d[3]`。我们的图看起来像这样：\n\n![](img/rsrc2GG.jpg) 第三次迭代：\n1. `d[3] + cost[3][4] = 7\
    \ < d[4]`。`d[4] = 7`。`parent[4] = 3`。\n2. 不会改变。\n3. 不会改变。\n\n我们的第三次迭代终于找到了从 1\
    \ 到 4 的最短路径。我们的图看起来像这样：\n\n![](img/rsrc2GH.jpg) 所以，花费了 3 次迭代才找到最短路径。在此之后，无论松弛边多少次，`d[]`\
    \ 中的值都将保持不变。现在，如果我们考虑另一个序列：\n\n```\n+--------+--------+--------+--------+\n| Serial\
    \ | 1 | 2 | 3 |\n+--------+--------+--------+--------+\n| Edge | 1->2 | 2->3 |\
    \ 3->4 |\n+--------+--------+--------+--------+\n```\n\n我们将得到：\n1. `d[1] + cost[1][2]\
    \ = 2 < d[2]`。`d[2] = 2`。\n2. `d[2] + cost[2][3] = 5 < d[3]`。`d[3] = 5`。\n3. `d[3]\
    \ + cost[3][4] = 7 < d[4]`。`d[4] = 5`。\n\n我们的极第一次迭代就找到了从源到所有其他节点的最短路径。另一个序列 `1->2`,\
    \ `3->4`, `2->3` 也是可能的，它将在 2 次迭代后给我们最短路径。我们可以得出结论，无论我们如何安排序列，在这个例子中找到从源的最短路径都不会超过\
    \ 3 次迭代。我们可以得出结论，对于最好情况，只需要 1 次迭代就能找到最短路径。对于最坏情况，需要 `(V-1)` 次迭代，这就是为什么我们要重复松弛过程\
    \ `(V-1)` 次。\n\n# 章节 21: 线段算法\n\n画线是通过计算两个指定位置之间直线的中间位置完成的。然后引导输出设备填充这些端点之间的位置。\n\
    \n## 章节 21.1: Bresenham 线段算法\n\nBresenham 线段算法是一种高效且准确的栅格生成算法，由 Bresenham 开发。它涉及整数计算，因此速度很快。也可以扩展到圆。\n\
    \nBresenham 线段算法：\n斜率 `m|<1`：`x` 的值增加，`y` 的值根据判定参数增加。\n斜率 `m|>1`：`y` 的值增加，`x`\
    \ 的值根据判定参数增加。\n\n对于 `m|<1` 的算法是：\n1. 输入两个端点 `(x1,y1)` 和 `(x2,y2)` 的线。\n2. 绘制第一个点\
    \ `(x1,y1)`。\n3. 计算 `delx = |x2-x1|`, `dely = |y2-y1|`。\n4. 获取初始判定 `P = 2 * daly\
