    //For every vertex


    This line may be a little confusing, so lets go through it slowly:


    cost = min( cost,TSP( bitmask | ( 1 << i) , i) + cost[ pos][ i]);Here, bitmask
    | ( 1 << i) sets the ith bit of bitmask to 1, which represents that the ith vertex
    has been visited. The i after the comma represents the new pos in that function
    call, which represents the new "last" vertex. cost[ pos][ i] is to add the cost
    of travelling from vertex pos to vertex i.Thus, this line is to update the value
    of cost to the minimum possible value of travelling to every other vertex that
    has not been visited yet.


    Time Complexity


    The function TSP( bitmask,pos) has 2 ^ N values for bitmask and N values for pos.
    Each function takes O( N) time to run (the for loop). Thus this implementation
    takes O( N^ 2 * 2 ^ N) time to output the exact answer.Chapter 45: Knapsack ProblemSection
    45.1: Knapsack Problem BasicsThe Problem : Given a set of items where each item
    contains a weight and value, determine the number of each to include in a collection
    so that the total weight is less than or equal to a given limit and the total
    value is as large as possible.Pseudo code for Knapsack Problem


