    SalesmanSection 44.1: Brute Force AlgorithmA path through every vertex exactly
    once is the same as ordering the vertex in some way. Thus, to calculate the minimum
    cost of travelling through every vertex exactly once, we can brute force every
    single one of the N! permutations of the numbers from 1 to N.Psuedocode


    minimum = INF


    for all permutations P


    current = 0


