    other NodesBreadth-ﬁrst-search (BFS) is an algorithm for traversing or searching
    tree or graph data structures. It starts at the tree root (or some arbitrary node
    of a graph, sometimes referred to as a ''search key'') and explores the neighbor
    nodes ﬁrst, before moving to the next level neighbors. BFS was invented in the
    late 1950s by Edward Forrest Moore , who used it to ﬁnd the shortest path out
    of a maze and discovered independently by C. Y. Lee as a wire routing algorithm
    in 1961.The processes of BFS algorithm works under these assumptions:1\. We won''t
    traverse any node more than once.


    2\. Source node or the node that we''re starting from is situated in level 0.


    3\. The nodes we can directly reach from source node are level 1 nodes, the nodes
    we can directly reach from level 1 nodes are level 2 nodes and so on.


    4\. The level denotes the distance of the shortest path from the source.Let''s
