    \ greedy strategy `LFD` is indeed the only optimal strategy of the ﬁve presented.\
    \ The proof is rather long and can be found here or in the book by Jon Kleinberg\
    \ and Eva Tardos (see sources in remarks down below).\n\n### Algorithm vs Reality\n\
    The `LFD` strategy is optimal, but there is a big problem. Its an optimal oﬄine\
    \ solution. In praxis caching is usually an online problem, that means the strategy\
    \ is useless because we cannot now the next time we need a particular item. The\
    \ other four strategies are also online strategies. For online problems we need\
    \ a general different approach.\n\n### Section 18.2: Ticket automat\n#### First\
    \ simple Example:\nYou have a ticket automat which gives exchange in coins with\
    \ values 1, 2, 5, 10 and 20\\. The dispension of the exchange can be seen as a\
    \ series of coin drops until the right value is dispensed. We say a dispension\
    \ is optimal when its coin count is minimal for its value.\n\nLet `M` in `[ 1\
    \ , 50 ]` be the price for the ticket `T` and `P` in `[ 1 , 50 ]` the money somebody\
    \ paid for `T`, with `P >= M`. Let `D= P- M`. We deﬁne the beneﬁt of a step as\
    \ the difference between `D` and `D- c` with `c` the coin the automat dispense\
    \ in this step.\n\nThe Greedy Technique for the exchange is the following pseudo\
    \ algorithmic approach:\n- **Step 1**: while `D > 20` dispense a 20 coin and set\
    \ `D = D - 20`\n- **Step 2**: while `D > 10` dispense a 10 coin and set `D = D\
    \ - 10`\n- **Step 3**: while `D > 5` dispense a 5 coin and set `D = D - 5`\n-\
    \ **Step 4**: while `D > 2` dispense a 2 coin and set `D = D - 2`\n- **Step 5**:\
    \ while `D > 1` dispense a 1 coin and set `D = D - 1`\n\nAfterwards the sum of\
    \ all coins clearly equals `D`. Its a greedy algorithm because after each step\
    \ and after each repitition of a step the beneﬁt is maximized. We cannot dispense\
