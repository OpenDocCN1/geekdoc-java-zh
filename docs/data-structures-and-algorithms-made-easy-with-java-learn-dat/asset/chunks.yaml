  trans: "\n内循环在每次迭代中执行的操作数相对于 `n` 是常数。外层循环也执行几次常数操作，并运行内循环 `n` 次。外层循环本身运行 `n` 次。因此，内循环内部的操作运行了\
    \ `n²` 次，外层循环中的操作运行了 `n` 次，而对 `i` 的赋值执行了一次。因此，复杂度类似于 `an² + bn + c`，由于最高项是 `n²`，因此\
    \ O 记法为 `O(n²)`。\n\n正如你可能注意到的，我们可以通过避免重复进行相同的比较来改进算法。我们可以在内循环中从 `i + 1` 开始，因为它之前的所有元素已经与所有数组元素进行过比较，包括索引为\
    \ `i + 1` 的元素。这允许我们舍弃 `i == j` 的检查。\n\n```c\n_Bool faster_contains_duplicates(\
    \ const int * array, size_t len) { \n    for ( int i = 0 ; i < len - 1 ; i++)\
    \ {\n        for ( int j = i + 1 ; j < len; j++) {\n            if ( array[ i]\
    \ == array[ j]) {\n                return 1 ;\n            }\n        }\n    }\n\
    \    return 0 ;\n}\n```\n\n显然，第二个版本执行的操作更少，因此效率更高。这如何转化为大 O 记法呢？嗯，现在内循环体运行了 `1\
    \ + 2 + ... + n - 1 = n( n- 1)/ 2` 次。这仍然是一个二阶多项式，因此仍然是 `O(n²)`。我们显然降低了复杂度，因为我们大致将执行的操作数除以\
    \ 2，但我们仍然处于 Big-O 定义的同一范围内。为了将复杂度降低到更低的级别，我们需要将操作数除以随 `n` 趋于无穷大的数。\n\n## 第 3.3\
    \ 节：O(log n) 类型的算法\n\n假设我们有一个大小为 `n` 的问题。现在对于我们算法的每一步（我们需要编写），我们的原始问题变成了之前大小的一半（`n/2`）。\n\
    \n因此，在每一步中，我们的问题都变成了一半。\n\n### 步骤问题\n1. `n/2`\n2. `n/4`\n3. `n/8`\n4. `n/16`\n\
    \n当问题空间被缩小时（即被完全解决时），在退出检查条件后，它无法进一步缩小（`n` 等于 1）。\n\n1. 假设在第 `k` 步或操作次数上：`problem-size\
    \ = 1`\n2. 但我们知道在第 `k` 步时，我们的 `problem-size` 应该是：`problem-size = n/2k`\n3. 根据\
    \ 1 和 2：`n/2k = 1` 或 `n = 2k`\n4. 对两边取对数：`loge n = k loge2` 或 `k = loge n / loge\
    \ 2`\n5. 使用公式 `logx m / logx n = logmn`：`k = log2 n` 或简单地 `k = log n`\n\n现在我们知道算法最多可以运行\
    \ `log n` 次，因此时间复杂度为 `O(log n)`。\n\n支持上述文本的一个非常简单的代码示例是：\n\n```python\nfor ( int\
    \ i= 1 ; i<= n; i= i* 2 ) {\n    // 执行某些操作 \n}\n```\n\n所以现在如果有人问你如果 `n` 是 256，该循环（或任何将其问题规模减半的算法）将运行多少步，你可以很容易地计算出来。\n\
    \n`k = log2 256`\n`k = log2 2⁸ ( => log=1)`\n`k = 8`\n\n类似情况的另一个很好的例子是二分查找算法。\n\
    \n```c\nint bSearch( int arr[] ,int size,int item){ \n    int low= 0 ;\n    int\
    \ high= size- 1 ;\n    while ( low<= high){\n        mid= low+( high- low)/ 2\
    \ ;\n        if ( arr[ mid]== item)return mid;\n        else if ( arr[ mid]< item)\n\
    \            low= mid+ 1 ;\n        else high= mid- 1 ;\n    }\n    return –1\
    \ ; // 未成功的结果\n}\n```\n\n## 第 3.4 节：一个 O(log n) 示例\n\n### 简介\n考虑以下问题：\n`L` 是一个包含\
    \ `n` 个有符号整数的排序列表（`n` 足够大），例如 `[ 5 , 2 , 1 , 0 , 1 , 2 , 4 ]`（这里，`n` 的值为 7）。如果已知\
    \ `L` 包含整数 0，你如何找到它的索引？\n"
