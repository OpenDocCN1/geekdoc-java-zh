  trans: "\n根据符号的定义可以得出定理：\n\n对于任意两个函数 `f(n)` 和 `g(n)`，当 `f(n) = O(g(n))` 且 `f(n)\
    \ = \\Omega(g(n))` 时，我们当 `f(n) = Ө(g(n))`。\n\n在图形上，`Ω`-符号可以表示如下：\n\n![](img/rsrc2EM.jpg)\
    \ 例如，假设 `f(n) = 3n² + 5n - 4`。那么 `f(n) = \\Omega(n²)`。此时 `f(n) = \\Omega(n)` 甚至\
    \ `f(n) = \\Omega(1)` 也是正确的。\n\n另一个完美匹配算法的例子：如果顶点数量为奇数，则输出“No Perfect Matching”，否则尝试所有可能的匹配。我们想说该算法需要指数级时间，但实际上你无法使用\
    \ `Ω` 的通常定义来证明 `Ω(n²)` 的下界，因为该算法在 `n` 为奇数时以线性时间运行。相反，我们应该通过定义：对于某个常数 `c > 0`，对于无限多个\
    \ `n`，`f(n) \\geq c g(n)`，来定义 `f(n)= \\Omega(g(n))`。这在上界和下界之间建立了良好的对应关系：`f(n)=\
    \ \\Omega(g(n))` iff `f(n) != o(g(n))`。\n\n### 参考文献\n正式定义和定理引用自“Thomas H. Cormen,\
    \ Charles E. Leiserson, Ronald L. Rivest, Clifford Stein. Introduction to Algorithms”。\n\
    \n### 第 3 章：Big-O 符号\n\n#### 定义\nBig-O 符号本质上是一种数学符号，用于比较函数的收敛速度。设 `n -> f(n)`\
    \ 和 `n -> g(n)` 是定义在自然数上的函数。那么，当 `n` 趋于无穷大时，如果 `f(n)/g(n)` 有界，我们就说 `f = O(g)`。换句话说，`f\
    \ = O(g)` 当且仅当存在常数 `A`，使得对于所有 `n`，`f(n)/g(n) <= A`。实际上，Big-O 符号在数学中的范围要宽得多，但为了简单起见，我将其缩小算法复杂度分析中使用的：定义在自然数上、具有非零值以及\
    \ `n` 增长到无穷大的情况。\n\n#### 它意味着什么？\n让我们考虑 `f(n) = 100n² + 10n + 1` 和 `g(n) = n²`的情况。显然，当\
    \ `n` 趋于无穷大时，这两个函数都趋于无穷大。但有时知道极限是不够的，我们还想知道函数趋于极限的速度。Big-O 等概念有助于通过收敛速度来比较和分类函数。\n\
    \n让我们应用定义来判断 `f = O(g)`。我们有 `f(n)/g(n) = 100 + 10/n + 1/n²`。由于 `10/n` 在 `n=1`\
    \ 时为 10 且逐渐减小，由于 `1/n²` 在 `n=1` 时为 1 且同样逐渐减小，我们得到 `f(n)/g(n) \\leq 100 + 10 +\
    \ 1 = 111`。定义被了，因为我们找到了 `f(n)/g(n)` 的一个界（111），因此 `f = O(g)`（我们说 `f` 是 `n²` 的一个\
    \ Big-O）。\n\n这意味着 `f` 趋于无穷大的速度与 `g` 大致相同。现在这听起来可能很奇怪，因为我们发现的是 `f` 最多是 `g` 的 111\
    \ 倍，换句话说，当 `g` 增长 1 倍时，`f` 最多增长 111 倍。看起来增长快 111 倍似乎并不是“大致相同的速度”。事实上，Big-O 符号并不是一种分类函数收敛速度非常精确的方法，这就是为什么在数学中，当我们对速度进行精确估计时，会使用等价关系。但对于将算法划分到大的速度等级中，Big-O\
    \ 足够了。我们不需要区分那些比彼此增长固定倍数的函数，只需要区分那些比彼此增长无限快倍的函数。例如，如果我们取 `h(n) = n² * log(n)`，我们看到\
    \ `h(n)/g(n) = log(n)` 随 `n` 趋于无穷大，因此 `h` 不是 `O(n²)`，因为 `h` 的增长速度比 `n²` 无限快。\n\
    \n现在需要说明一下：你可能注意到如果 `f = O(g)` 且 `g = O(h)`，那么 `f = O(h)`。例如在我们的案例中，有 `f = O(n³)`\
    \ 和 `f = O(n⁴)`……在算法复杂度分析中，我们经常说 `f = O(g)` 意味着 `f = O(g)` 且 `g = O(f)`，这可以理解为“g\
    \ 是 f 的最小 Big-O”。在数学中，我们称这类函数是彼此的 Big-Theta。\n\n#### 它是如何使用的？\n在比较算法性能时，我们感兴趣的是算法执行的操作次数。这被称为时间复杂度。在这种模型中，我们认为每个基本操作（加法、乘法、比较、赋值等）都花费固定的时间。\n\
    \n##### 3.1 简单循环\n以下函数寻找数组中的最大元素：\n```c\nint find_max(const int * array, size_t\
    \ len) {\n    int max = INT_MIN;\n    for (size_t i = 0; i < len; i++) {\n   \
    \     if (max < array[i]) {\n            max = array[i];\n        }\n    }\n \
    \   return max;\n}\n```\n输入规模是数组的大小，我称之为 `len`。让我们数一下操作。\n\n```c\nint max = INT_MIN;\n\
    size_t i = 0;\n```\n这两个赋值只执行一次，所以是 2 次操作。循环的操作是：\n```c\nif (max < array[i]) i++;\n\
    max = array[i];\n```\n由于循环中有 3 次操作，且循环了 `n` 次，我们将 `3n` 加到已有的 2 次操作上，得到 `3n + 2`。因此，我们的函数寻找最大值需要\
    \ `3n + 2` 次操作（其复杂度为 `3n+2`）。这是一个增长最快的项是 `n` 的倍数的多项式，所以它是 `O(n)`。\n\n##### 3.2\
    \ 嵌套循环\n以下函数通过取每个元素，然后遍历整个数组查看该元素是否存在，检查数组是否有重复项：\n```c\n_Bool contains_duplicates(const\
    \ int * array, size_t len) {\n    for (int i = 0; i < len - 1; i++) {\n      \
    \  for (int j = 0; j < len; j++) {\n            if (i != j && array[i] == array[j])\
    \ {\n                return 1;\n            }\n        }\n    }\n    return 0;\n\
    }\n```\n\n"
- fmt: "\nThe inner loop performs at each iteration a number of operations that is\
    \ constant with `n`. The outer loop also does a few constant operations, and runs\
    \ the inner loop `n` times. The outer loop itself is run `n` times. So the operations\
    \ inside the inner loop are run `n^2` times, the operations in the outer loop\
    \ are run `n` times, and the assignment to `i` is done one time. Thus, the complexity\
    \ will be something like `an^2 + bn + c`, and since the highest term is `n^2`,\
    \ the O notation is `O(n^2)`.\n\nAs you may have noticed, we can improve the algorithm\
    \ by avoiding doing the same comparisons multiple times. We can start from `i\
    \ + 1` in the inner loop, because all elements before it will already have been\
    \ checked against all array elements, including the one at index `i + 1`. This\
    \ allows us to drop the `i == j` check.\n\n```c\n_Bool faster_contains_duplicates(\
    \ const int * array, size_t len) { \n    for ( int i = 0 ; i < len - 1 ; i++)\
    \ {\n        for ( int j = i + 1 ; j < len; j++) {\n            if ( array[ i]\
    \ == array[ j]) {\n                return 1 ;\n            }\n        }\n    }\n\
    \    return 0 ;\n}\n```\n\nObviously, this second version does less operations\
    \ and so is more efficient. How does that translate to Big-O notation? Well, now\
    \ the inner loop body is run `1 + 2 + ... + n - 1 = n( n- 1)/ 2` times. This is\
    \ still a polynomial of the second degree, and so is still only `O(n^2)`. We have\
    \ clearly lowered the complexity, since we roughly divided by 2 the number of\
    \ operations that we are doing, but we are still in the same complexity class\
    \ as defined by Big-O. In order to lower the complexity to a lower class we would\
    \ need to divide the number of operations by something that tends to infinity\
    \ with `n`.\n\n## Section 3.3: O(log n) types of Algorithms\n\nLet's say we have\
    \ a problem of size `n`. Now for each step of our algorithm(which we need write),\
    \ our original problem becomes half of its previous size(`n/2`). \n\nSo at each\
    \ step, our problem becomes half.\n\n### Step Problem\n1. `n/2`\n2. `n/4`\n3.\
    \ `n/8`\n4. `n/16`\n\nWhen the problem space is reduced(i.e solved completely),\
    \ it cannot be reduced any further(`n` becomes equal to 1) after exiting check\
    \ condition.\n\n1. Let's say at `k`th step or number of operations: `problem-size\
    \ = 1`\n2. But we know at `k`th step, our `problem-size` should be: `problem-size\
    \ = n/2k`\n3. From 1 and 2: `n/2k = 1` or `n = 2k`\n4. Take log on both sides:\
    \ `loge n = k loge2` or `k = loge n / loge 2`\n5. Using formula `logx m / logx\
    \ n = logmn`: `k = log2 n` or simply `k = log n`\n\nNow we know that our algorithm\
    \ can run maximum up to `log n`, hence time complexity comes as `O(log n)`.\n\n\
    A very simple example in code to support above text is:\n\n```python\nfor ( int\
    \ i= 1 ; i<= n; i= i* 2 ) {\n    // perform some operation \n}\n```\n\nSo now\
    \ if some one asks you if `n` is 256 how many steps that loop( or any other algorithm\
    \ that cuts down it's problem size into half) will run you can very easily calculate.\n\
    \n`k = log2 256`\n`k = log2 2^8 ( => log=1)`\n`k = 8`\n\nAnother very good example\
