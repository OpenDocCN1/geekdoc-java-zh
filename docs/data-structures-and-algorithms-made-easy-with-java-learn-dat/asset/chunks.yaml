    \ ( lo <= hi) {\n            int mid = ( lo + hi) / 2 ;\n            if ( jobs[\
    \ mid] .finish <= jobs[ index] .start ) {\n                if ( jobs[ mid + 1\
    \ ] .finish <= jobs[ index] .start ) lo = mid + 1 ;\n                else\n  \
    \                  return mid;\n            }\n            else\n            \
    \    hi = mid - 1 ;\n        }\n        return 1 ;\n    }\n\n    static public\
    \ int schedule( Job jobs[]) {\n        Arrays .sort ( jobs, new JobComparator());\n\
    \        int n = jobs.length ;\n        int table[] = new int [ n];\n        table[\
    \ 0 ] = jobs[ 0 ] .profit ;\n        for ( int i= 1 ; i< n; i++) {\n         \
    \   int inclProf = jobs[ i ] .profit ;\n            int l = binarySearch( jobs,\
    \ i);\n            if ( l != 1 )\n                inclProf += table[ l];\n   \
    \         table[ i ] = Math .max (inclProf, table[ i- 1 ]);\n        }\n     \
    \   return table[ n- 1 ];\n    }\n\n    public static void main( String [] args)\
    \ {\n        Job jobs[] = { new Job( 1 , 2 , 50 ) , new Job( 3 , 5 , 20 ) , new\
    \ Job( 6 , 19 , 100 ) , new Job( 2 , 100 , 200 )};\n        System .out .println\
    \ ( \"Optimal profit is \" + schedule( jobs));\n    }\n}\n```\n\n预期的输出是：`Optimal\
    \ profit is 250`\n\n# 第 18.4 节：最小化延迟\n\n有许多关于最小化延迟的问题，这里我们只有一个资源，一次只能处理一个任务。任务\
    \ $j$ 需要 $t_j$ 个单位的处理时间，并于时间 $d_j$ 截止。如果 $j$ 在时间 $s_j$ 开始，它将在时间 $f_j= s_j+ t_j$\
