  trans: "\n\n# 第 27.1 节：分页（在线缓存）\n\n## 前言\n我们的目标不是从正式定义开始，而是通过一系列示例来触接触这些主题，并在过程中引入定义。备注（remark）部分将包含所有的定义、定理和命题，为你提供关于特定方面的所有信息。备注部分由用于该主题的基础材料以及进一步阅读的额外信息组成。此外，你可以在那里找到示例的完整源代码。请注意使示例源代码更易读且更短，它避免了错误处理以及某些会模糊示例清晰度的语言特性（例如大量使用高级库）。\n\
    \n## 分页\n分页问题产生于有限空间的限制。假设我们的缓存 `C` 有 `k` 个页。现在我们要处理一个包含 `m` 个页面请求的序列，这些请求在处理之前必须被放入缓存中。当然，如果\
    \ `m <= k`，我们只需将所有元素放入缓存即可运行，但通常 `m >> k`。\n\n当页面已经在缓存中时，我们称该请求为`缓存命中 (cache hit)`，否则称为`缓存未命中\
    \ (cache miss)`。在这种情况下，我们必须将请求的页面引入缓存并驱逐另一个（假设缓存已满）。目标是找到一个使驱逐次数最小的驱逐调度策略。\n\n\
    针对这个问题有许多策略，让我们来看一些：\n1. `先进先出 (FIFO)`：最旧的页面被驱逐。\n2. `后进先出 (LIFO)`：最新的页面被驱逐。\n\
    3. `最久未用用 (LRU)`：驱逐最近访问时间最早的那个页面。\n4. `最少频率使用 (LFU)`：驱逐请求频率最低的页面。\n5. `最远向前距离\
    \ (LFD)`：驱逐缓存中在未来最远之后才被请求的页面。\n6. `满时清空 (FWF)`：一旦发生缓存未命中，立即清空整个缓存。\n\n处理这个问题有两种方法：\n\
    1. `离线 (offline)`：页面请求序列是预先知的。\n2. `在线 (online)`：页面请求序列不是预知的。\n\n## 在线方法\n对于第一种方法，请参考贪心算法的应用主题。其第三个示例`在线缓存\
    \ (Online Caching)`考虑了上述前五种策略，并为后续内容提供了一个良好的切入点。\n\n示例程序使用 `FWF` 策略进行了扩展：\n\n\
    ```cpp\nclass FWF : public Strategy {\npublic:\n    FWF() : Strategy(\"FWF\")\
    \ {\n    }\n    int apply(int requestIndex) override {\n        for (int i = 0;\
    \ i < cacheSize; ++i) {\n            if (cache[i] == request[requestIndex])\n\
    \                return i; // 在第一个空页之后，其他页必须为空\n            else if (cache[i]\
    \ == emptyPage)\n                return i;\n        }\n        // 没有空页\n     \
    \   return 0;\n    }\n    void update(int cachePos, int requestIndex, bool cacheMiss)\
    \ override {\n        // 没有空页 -> 未命中 -> 清空缓存\n        if (cacheMiss && cachePos\
    \ == 0) {\n            for (int i = 1; i < cacheSize; ++i)\n                cache[i]\
    \ = emptyPage;\n        }\n    }\n};\n```\n\n完整的源代码在此处可用。如果我们重用主题中的示例，将得到以下输出：\n\
    \n```\nStrategy: FWF\nCache initial: (a,b,c)\nRequest cache 0 cache 1 cache 2\
    \ cache miss\na a b c\na a b c\nd d X X x e d e X\nb d e b\nb d e b\na a X X x\
    \ c a c X\nf a c f\nd d X X x e d e X\na d e a\nf f X X x b f b X\ne f b e\nc\
    \ c X X x\nTotal cache misses: 5\n```\n\n时间复杂度 O(n²) 第 27 章：在线算法\n\n## 定义\n**定义\
    \ 1**：优化问题 `Π` 由一个实例集合 `ΣΠ` 组成。对于每个实例 `σ∈ΣΠ`，存在一个解集 `Ζσ` 和一个目标函数 `fσ : Ζσ → ℜ≥0`，该函数为每个解分配一个正实数值。我们称\
    \ `OPT(σ)` 为最优解的值，`A(σ)` 为算法 `A` 对于问题 `Π` 的解，而 `wA(σ)=fσ(A(σ))` 为它的值。\n\n**定义\
    \ 2**：对于最小化问题 `Π` 的在线算法 `A`，如果存在常数 `τ∈ℜ` 使得对于所有实例 `σ∈ΣΠ` 满足：\n```\nwA(σ) = fσ(A(σ))\
    \ ≤ r ⋅ OPT(&σ) + τ\n```\n则其竞争率为 `r ≥ 1`。`A` 被称为 `r`-竞争在线算法。如果对于所有实例 `σ∈ΣΠ` 都满足：\n\
    ```\nwA(σ) ≤ r ⋅ OPT(&σ)\n```\n则 `A` 被称为严格 `r`-竞争在线算法。\n\n**命题 1.3**：`LRU` 和 `FWF`\
    \ 是标记算法。\n**证明**：在每个阶段的开始（第一阶段除外），`FWF` 都会发生缓存未命中并清空缓存。这意味着我们有 `k` 个空页。在每个阶段中最多请求\
    \ `k` 个不同的页面，因此在该阶段内不会发生驱逐。所以 `FWF` 是标记算法……（注：此处原文逻辑略显跳跃，已按原意翻译）。\n\n**命题 1.4**：`LRU`\
    \ 是标记算法。\n（注：原文此处证明部分不完整，已按原意翻译）。\n\n"
