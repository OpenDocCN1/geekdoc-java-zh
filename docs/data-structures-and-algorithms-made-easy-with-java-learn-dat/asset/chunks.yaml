    say a request is a cache hit , when the page is already in cache, otherwise, its
    called a cache miss . In that case, we must bring the requested page into the
    cache and evict another, assuming the cache is full. The Goal is an eviction schedule
    that minimizes the number of evictions .There are numerous strategies for this
