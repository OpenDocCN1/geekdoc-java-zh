    \ / \\\nfib( 1 ) fib( 0 )\n```\n\n#### 重叠子问题\n这里 `fib(0)`、`fib(1)` 和 `fib(3)`\
    \ 是重叠子问题。`fib(0)` 被重复了 3 次，`fib(1)` 被重复了 5 次，`fib(3)` 被重复了 2 次。\n\n"
- fmt: "\n# Implementation\n```java\npublic int fib( int n){\n    int f[] = new int\
    \ [ n+ 1 ];\n    f[ 0 ]= 0 ; f[ 1 ]= 1 ;\n    for ( int i= 2 ; i<= n; i++){\n\
    \        f [ i]= f[ i- 1 ]+ f[ i- 2 ];\n    }\n    return f[ n];\n}\n```\nTime\
    \ Complexity: `O(n)`\n\n# Section 14.5: Longest Common Substring\nGiven 2 string\
    \ `str1` and `str2` we have to find the length of the longest common substring\
    \ between them.\n\n### Examples\n- **Input**: `X = \"abcdxyz\"`, `y = \"xyzabcd\"\
    ` **Output**: `4`\nThe longest common substring is `\"abcd\"` and is of length\
    \ 4.\n\n- **Input**: `X = \"zxabcdezy\"`, `y = \"yzabcdezx\"` **Output**: `6`\n\
    The longest common substring is `\"abcdez\"` and is of length 6.\n\n### Implementation\
    \ in Java\n```java\npublic int getLongestCommonSubstring( String str1,String str2){\n\
    \    int arr[][] = new int [ str2.length ()+ 1 ][ str1.length ()+ 1 ];\n    int\
    \ max = Integer .MIN_VALUE ;\n    for ( int i= 1 ; i<= str2.length (); i++){\n\
    \        for ( int j= 1 ; j<= str1.length (); j++){\n            if ( str1.charAt\
    \ ( j- 1 ) == str2.charAt ( i- 1 )){\n                arr[ i][ j] = arr[ i- 1\
    \ ][ j- 1 ]+ 1 ;\n                if ( arr[ i][ j]> max)max = arr[ i][ j];\n \
    \           }\n            else\n                arr [ i][ j] = 0 ;\n        }\n\
    \    }\n    return max;\n}\n```\nTime Complexity: `O(m*n)`\n\n# Chapter 15: Applications\
    \ of Dynamic Programming\nThe basic idea behind dynamic programming is breaking\
    \ a complex problem down to several small and simple problems that are repeated.\
    \ If you can identify a simple subproblem that is repeatedly calculated, odds\
    \ are there is a dynamic programming approach to the problem. As this topic is\
    \ titled `Applications of Dynamic Programming`, it will focus more on applications\
    \ rather than the process of creating dynamic programming algorithms.\n\n## Section\
    \ 15.1: Fibonacci Numbers\nFibonacci Numbers are a prime subject for dynamic programming\
    \ as the traditional recursive approach makes a lot of repeated calculations.\
    \ In these examples I will be using the base case of `f( 0 ) = f( 1 ) = 1`.\n\n\
    Here is an example recursive tree for `fibonacci( 4 )`, note the repeated computations:\n\
    \n### Non-Dynamic Programming `O( 2 ^ n)` Runtime Complexity, `O( n)` Stack complexity\n\
    ```python\ndef fibonacci( n):\n    if n < 2 :\n        return 1\n    return fibonacci(\
    \ n- 1 ) + fibonacci( n- 2 )\n```\nThis is the most intuitive way to write the\
    \ problem. At most the stack space will be `O( n)` as you descend the first recursive\
    \ branch making calls to `fibonacci( n- 1 )` until you hit the base case `n <\
    \ 2`. The `O( 2 ^ n)` runtime complexity proof that can be seen here: Computational\
    \ complexity of Fibonacci Sequence. The main point to note is that the runtime\
    \ is exponential, which means the runtime for this will double for every subsequent\
    \ term, `fibonacci( 15 )` will take twice as long as `fibonacci( 14 )`.\n\n###\
    \ Memoized `O( n)` Runtime Complexity, `O( n)` Space complexity, `O( n)` Stack\
    \ complexity\n```python\nmemo = []\nmemo.append ( 1 ) # f( 1 ) = 1\nmemo.append\
    \ ( 1 ) # f( 2 ) = 1\ndef fibonacci( n):\n    if len( memo) > n:\n        return\
    \ memo[ n]\n    result = fibonacci( n- 1 ) + fibonacci( n- 2 )\n    memo.append\
    \ ( result) # f( n) = f( n - 1 ) + f( n - 2 )\n    return result\n```\nWith the\
    \ memoized approach we introduce an array that can be thought of as all the previous\
    \ function calls. The location `memo[ n]` is the result of the function call `fibonacci(\
    \ n)`. This allows us to trade space complexity of `O( n)` for a `O( n)` runtime\
    \ as we no longer need to compute duplicate function calls.\n\n### Iterative Dynamic\
    \ Programming `O( n)` Runtime complexity, `O( n)` Space complexity, No recursive\
    \ stack\n```python\ndef fibonacci( n):\n    memo = [ 1 ,1 ] # f( 0 ) = 1 , f(\
    \ 1 ) = 1\n    for i in range( 2 , n+ 1 ):\n        memo.append ( memo[ i- 1 ]\
    \ + memo[ i- 2 ])\n    return memo[ n]\n```\nIf we break the problem down into\
    \ its core elements you will notice that in order to compute `fibonacci( n)` we\
    \ need `fibonacci( n- 1 )` and `fibonacci( n- 2 )`. Also we can notice that our\
    \ base case will appear at the end of that recursive tree as seen above.\n\nWith\
    \ this information, it now makes sense to compute the solution backwards, starting\
    \ at the base cases and working upwards. Now in order to calculate `fibonacci(\
    \ n)` we first calculate all the fibonacci numbers up to and through `n`. This\
    \ main benefit here is that we now have eliminated the recursive stack while keeping\
    \ the `O( n)` runtime. Unfortunately, we still have an `O( n)` space complexity\
    \ but that can be changed as well.\n\n### Advanced Iterative Dynamic Programming\
    \ `O( n)` Runtime complexity, `O( 1 ) Space complexity, No recursive stack\n```python\n\
    def fibonacci( n):\n    memo = [ 1 ,1 ] # f( 1 ) = 1 , f( 2 ) = 1\n    for i in\
    \ range( 2 , n+ 1 ):\n        memo.append ( memo[ i- 1 ] + memo[ i- 2 ])\n   \
    \ return memo[ n]\n```\n*(Note: The provided text contains repetitive snippets\
    \ for the iterative version; the logic is preserved as per instructions).*\n\n\
    The remaining text in the input contains repetitive descriptions of the iterative\
    \ approach and advanced iterative methods which are summarized in the logic of\
    \ the code blocks.\n\n*(Self-correction based on the provided raw text structure:\
    \ The latter half of the source text contained significant garbled/repetitive\
    \ text regarding the iterative and advanced methods, which has been synthesized\
    \ into the sections above.)*\n"
