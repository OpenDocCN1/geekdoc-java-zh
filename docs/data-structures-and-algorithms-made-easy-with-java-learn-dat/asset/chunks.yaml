    \ (2 * daly);\n    }\n    // ... (部分省略)\n```\n\n对于 `m|>1` 的算法是：\n1. 输入两个端点 `(x1,y1)`\
    \ 和 `(x2,y2)` 的线。\n2. 绘制第一个点 `(x1,y1)`。\n3. 计算 `delx = |x2-x1|`, `dely = |y2-y1|`。\n\
