    \ 5.2 节：二叉搜索树 - 删除 (C++)\n\n在开始删除操作之前，我想先介绍一下什么是二叉搜索树（BST）。二叉搜索树中的每个节点最多有两个节点（左子节点和右子节点）。节点的左子树键值小于或等于其父节点的键值。节点的右子树键值大于其父节点的键值。在维护二叉搜索树属性的同时从树中删除一个节点。\n\
