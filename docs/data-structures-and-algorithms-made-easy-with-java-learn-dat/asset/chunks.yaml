    # 子序列 (Subsequence)

    子序列是指通过从另一个序列中删除某些元素而不改变剩余元素顺序而得到的序列。假设我们有一个字符串 `ABC`。如果我们从这个字符串中删除零、一个或多个字符，就会得到该字符串的子序列。因此，字符串
    `ABC` 的子序列将是 `{"A", "B", "C", "AB", "AC", "BC", "ABC", " "}`。即使删除了所有字符，空字符串也是一个子序列。为了找到子序列，对于字符串中的每个字符，我们都有选择——要么取该字符，要么不取。如果字符串的长度为
    `n`，该字符串就有 `2^n` 个子序列。


    # 最长公共子序列 (Longest Common Subsequence)

    如名所示，两个字符串的所有公共子序列中，最长公共子序列(`LCS`) 是长度最大的那个。例如：`"HELLOM"` 和 `"HMLD"` 之间的公共子序列有
    `"H"`、`"HL"`、`"HM"` 等。这里 `"HLL"` 是最长公共子序列，长度为 3。


    ## 暴力法 (Brute-Force Method)

    我们可以使用 `backtracking` 生成两个字符串的所有子序列。然后通过比较它们来找到公共子序列。之后，我们需要找到长度最大的那一个。我们已经知道，长度为
    `n` 的字符串有 `2^n` 个子序列。如果我们的 `n` 超过 20-25，解决这个问题将花费多年时间。


    ## 动态规划法 (Dynamic Programming Method)

    让我们通过一个例子来研究这种方法。假设我们有两个字符串 `abcdaf` 和 `acbcf`。我们将它们分别标记为 `s1` 和 `s2`。这两个字符串的最长公共子序列将是
    `"abcf"`，长度为 4。再次提醒大家，子序列在字符串中不需要是连续的。为了构造 `"abcf"`，我们忽略了 `s1` 中的 `"da"` 和 `s2`
    中的 `"c"`。我们如何使用动态规划找到它呢？


    我们将从一个表格（二维数组）开始，行包含 `s1` 的所有字符，列包含 `s2` 的所有字符。这里表格从 0 开始索引，我们从 1 开始填充字符。我们将每行从左到右遍历表格。我们的表格看起来如下：


    ```

