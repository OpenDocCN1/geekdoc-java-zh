  trans: "\n\n许多应用程序使用有向无环图（DAG）来表示事件之间的优先关系。我们使用拓扑排序来确保在处理任何后继顶点之前，获得处理每个顶点的顺序。图中的顶点可以表示要执行的任务，边可以表示一个任务必须在另一个任务之前执行的约束；拓扑排序是执行\
    \ `V` 中描述的任务集合的有效序列。\n\n### 问题实例及其解决方案\n假设一个顶点 `v` 描述一个 `Task( hours_to_complete:\
    \ int )`，即 `Task( 4 )` 描述一个需要 4 小时完成的任务；边 `e` 描述一个 `Cooldown( hours: int )`，使得\
    \ `Cooldown( 3 )` 描述完成任务后的冷却时长。\n\n让我们将图命名为 `dag`（因为它是有向无环图），并使其包含 5 个顶点：\n`A\
    \ < dag.add_vertex ( Task( 4 ) ));`\n`B < dag.add_vertex ( Task( 5 ) ));`\n`C\
    \ < dag.add_vertex ( Task( 3 ) ));`\n`D < dag.add_vertex ( Task( 2 ) ));`\n`E\
    \ < dag.add_vertex ( Task( 7 ) ));`\n\n其中我们用有向边连接顶点，使得图是无环的：\n```cpp\n// A --->\
    \ C ----+\n// | | |\n// v v v\n// B ---> D --> E\n```\n`dag.add_edge ( A, B, Cooldown(\
    \ 2 ) ));`\n`dag.add_edge ( A, C, Cooldown( 2 ) ));`\n`dag.add_edge ( B, D, Cooldown(\
    \ 1 ) ));`\n`dag.add_edge ( C, D, Cooldown( 1 ) ));`\n`dag.add_edge ( C, E, Cooldown(\
    \ 1 ) ));`\n`dag.add_edge ( D, E, Cooldown( 3 ) ));`\n\n那么在 A 和 E 之间有三种可能的拓扑排序：\n\
    1. `A -> B -> D -> E`\n2. `A -> C -> D -> E`\n3. `A -> C -> E`\n\n### 第 9.5 节：使用深度优先遍历检测有向图中的环\n\
    如果在 DFS 过程中发现了回边，则有向图中存在环。回边是从节点指向自身或指向 DFS 树中任一祖先的边。对于不连通的图，我们得到 DFS 森林，因此你必须遍历图中的所有顶点以找到不相交的\
    \ DFS 树。\n\nC++ 实现：\n\n```cpp\n#include <iostream> \n#include <list>\n\nusing\
    \ namespace std;\n\n#define NUM_V 4\nbool helper(list< int > *graph, int u, bool\
    \ * visited, bool * recStack) {\n    visited[u]= true ;\n    recStack[u]= true\
    \ ;\n    list< int > :: iterator i;\n    for (i = graph[u].begin (); i!= graph[u].end\
    \ (); ++i) {\n        if (recStack[*i]) //如果在此 DFS 遍历的递归栈中发现顶点 v，则返回 true ;\n\
    \        else if (*i== u) //如果存在指向顶点自身的边\n            return true ;\n        else\
    \ if (!visited[*i])\n        { \n            if (helper(graph, *i, visited, recStack))\n\
    \                return true ;\n        }\n    }\n    recStack[u]= false ;\n \
    \   return false ;\n}\n\n/*\n/封装函数对每个未访问过的顶点调用辅助函数。 \n如果辅助函数在子图（树）中检测到回边，则返回 true，否则返回\
    \ false。\n*/\nbool isCyclic(list< int > *graph, int V) {\n    bool visited[V];\
    \ //用于跟踪已访问顶点的数组\n    bool recStack[V]; //用于跟踪遍历递归栈中顶点的数组\n    for (int i = 0;\
    \ i< V; i++)\n        visited[i]= false , recStack[i]= false ; //初始化所有顶点为未访问且未递归\n\
    \    for (int u = 0; u < V; u++) // 迭代检查每个顶点是否已访问 \n        if (visited[u]== false\
    \ )\n        { \n            if (helper(graph, u, visited, recStack)) //检查从该顶点出发的\
    \ DFS 树是否包含环\n                return true ;\n        }\n    }\n    return false\
    \ ; \n}\n\n/*\n驱动函数 */\nint main() {\n    list < int > * graph = new list< int\
    \ > [NUM_V]; \n    graph[0].push_back (1);\n    graph[0].push_back (2);\n    graph[1].push_back\
    \ (2);\n    graph[2].push_back (0);\n    graph[2].push_back (3);\n    graph[3].push_back\
    \ (3);\n    bool res = isCyclic(graph, NUM_V); \n    cout << res<< endl;\n}\n\
    ```\n结果：如下所示，图中三条回边。一条在顶点 0 和 2 之间；一条在顶点 0、1 和 2 之间；还有一条在顶点 3。搜索的时间复杂度为 `O(V+E)`，其中\
    \ `V` 是顶点数，`E` 是边数。\n\n### 第 9.6 节：Thorup 算法\n用于无向图单源最短路径的 Thorup 算法时间复杂度为 `O(m)`。\n\
    \n"
- fmt: "\n# Chapter 11: Dijkstra’s Algorithm\n\n## Section 11.1: Dijkstra's Shortest\
    \ Path Algorithm\n\nBefore proceeding, it is recommended to have a brief idea\
    \ about Adjacency Matrix and BFS.\n\nDijkstra's algorithm is known as a single-source\
    \ shortest path algorithm. It is used for finding the shortest paths between nodes\
    \ in a graph, which may represent, for example, road networks. It was conceived\
    \ by Edsger W. Dijkstra in 1956 and published three years later.\n\nWe can find\
    \ shortest path using Breadth First Search (BFS) searching algorithm. This algorithm\
    \ works fine, but the problem is, it assumes the cost of traversing each path\
    \ is same, that means the cost of each edge is same. Dijkstra's algorithm helps\
    \ us to find the shortest path where the cost of each path is not the same.\n\n\
    At first we will see, how to modify BFS to write Dijkstra's algorithm, then we\
    \ will add priority queue to make it a complete Dijkstra's algorithm. \n\nLet's\
    \ say, the distance of each node from the source is kept in `d[]` array. As in,\
    \ `d[3]` represents that `d[3]` time is taken to reach node 3 from source. If\
    \ we don't know the distance, we will store infinity in `d[3]`. Also, let `cost[u][v]`\
    \ represent the cost of `u-v`. That means it takes `cost[u][v]` to go from `u`\
    \ node to `v` node.\n\n![](rsrc2FC.jpg)\n\nWe need to understand Edge Relaxation.\
    \ Let's say, from your house, that is source, it takes 10 minutes to go to place\
    \ A. And it takes 25 minutes to go to place B. We have,\n\n```\nd[ A] = 10\nd[\
    \ B] = 25\n```\n\nNow let's say it takes 7 minutes to go from place A to place\
    \ B, that means:\n\n```\ncost[ A][ B] = 7\n```\n\nThen we can go to place B from\
    \ source by going to place A from source and then from place A, going to place\
    \ B, which will take 10 + 7 = 17 minutes, instead of 25 minutes. So,\n\n```\n\
    d[ A] + cost[ A][ B] < d[ B]\n```\n\nThen we update,\n\n```\nd[ B] = d[ A] + cost[\
    \ A][ B]\n```\n\nThis is called relaxation. We will go from node `u` to node `v`\
    \ and if `d[u] + cost[u][v] < d[v]` then we will update `d[v] = d[u] + cost[u][v]`.\n\
    \nIn BFS, we didn't need to visit any node twice. We only checked if a node is\
    \ visited or not. If it was not visited, we pushed the node in queue, marked it\
    \ as visited and incremented the distance by 1. In Dijkstra, we can push a node\
    \ in queue and instead of updating it with visited, we relax or update the new\
    \ edge. Let's look at one example: ![](rsrc2FD.jpg) Let's assume, Node 1 is the\
    \ Source. Then,\n\n```\nd[ 1 ] = 0\nd[ 2 ] = d[ 3 ] = d[ 4 ] = infinity ( or a\
    \ large value)\n```\n\nWe set `d[2]`, `d[3]` and `d[4]` to infinity because we\
    \ don't know the distance yet. And the distance of source is of course 0. Now,\
    \ we go to other nodes from source and if we can update them, then we'll push\
    \ them in the queue. Say for example, we'll traverse edge 1-2. As `d[1] + 2 <\
    \ d[2]` which will make `d[2] = 2`. Similarly, we'll traverse edge 1-3 which makes\
    \ `d[3] = 5`.\n\nWe can clearly see that 5 is not the shortest distance we can\
    \ cross to go to node 3. So traversing a node only once, like BFS, doesn't work\
    \ here. If we go from node 2 to node 3 using edge 2-3, we can update `d[3] = d[2]\
    \ + 1 = 3`. So we can see that one node can be updated many times. How many times\
    \ you ask? The maximum number of times a node can be updated is the number of\
    \ in-degree of a node.\n\nLet's see the pseudo-code for visiting any node multiple\
    \ times. We will simply modify BFS:\n\n```\nprocedure BFSmodified ( G, source):\n\
    \    Q = queue()\n    distance[] = infinity\n    Q.enqueue ( source)\n    distance[\
    \ source]= 0\n    while Q is not empty\n        u < Q.pop ()\n        for all\
    \ edges from u to v in G.adjacentEdges ( v) do\n            if distance[ u] +\
    \ cost[ u][ v] < distance[ v]\n                distance[ v] = distance[ u] + cost[\
    \ u][ v]\n            end if\n        end for\n    end while\n    Return distance\n\
    ```\n\nThis can be used to find the shortest path of all node from the source.\
    \ The complexity of this code is not so good. Here's why,\n\nIn BFS, when we go\
    \ from node 1 to all other nodes, we follow first come, first serve method. For\
    \ example, we went to node 3 from source before processing node 2. If we go to\
    \ node 3 from source, we update node 4 as 5 + 3 = 8. When we again update node\
    \ 3 from node 2, we need to update node 4 as 3 + 3 = 6 again! So node 4 is updated\
    \ twice.\n\nDijkstra proposed, instead of going for First come, first serve method,\
    \ if we update the nearest nodes first, it'll take less updates. Below is a Java\
    \ example to solve Dijkstra using Adjacency Matrix.\n\n```java\nimport java.util.*;\n\
    import java.lang.*;\nimport java.io.*;\n\nclass ShortestPath {\n    static final\
    \ int V=9;\n\n    int minDistance(int dist[], Boolean sptSet[]) {\n        int\
    \ min = Integer.MAX_VALUE, min_index;\n        for (int v = 0; v < V; v++)\n \
    \           if (sptSet[v] == false && dist[v] <= min) {\n                min =\
    \ dist[v];\n                min_index = v;\n            }\n        return min_index;\n\
    \    }\n\n    void printSolution(int dist[], int n) {\n        System.out.println(\"\
    Vertex Distance from Source\");\n        for (int i = 0; i < n; i++)\n       \
    \     System.out.println(i+ \\t\\t \" + dist[i]);\n    }\n\n    void dijkstra(int\
    \ graph[][], int src) {\n        Boolean sptSet[] = new Boolean [V];\n       \
    \ for (int i = 0; i < V; i++) {\n            dist[i] = Integer.MAX_VALUE;\n  \
    \          sptSet[i] = false;\n        }\n        dist[src] = 0;\n        for\
    \ (int count = 0; count < V-1 ; count++) {\n            int u = minDistance(dist,\
    \ sptSet);\n            sptSet[u] = true;\n            for (int v = 0; v < V;\
    \ v++)\n                if (! sptSet[v] && graph[u][ v]!= 0 && dist[u] != Integer.MAX_VALUE\
    \ && dist[u]+ graph[u][ v] < dist[v])\n                    dist[v] = dist[u] +\
    \ graph[u][ v];\n        }\n        printSolution(dist, V);\n    }\n\n    public\
    \ static void main (String [] args) {\n        int graph[][] = new int [][]{\n\
    \            { 0, 4, 0, 0, 0, 0, 0, 8, 0 },\n            { 4, 0, 8, 0, 0, 0, 0,\
    \ 11, 0 },\n            { 0, 8, 0, 7, 0, 4, 0, 0, 2 },\n            { 0, 0, 7,\
    \ 0, 9, 14, 0, 0, 0 },\n            { 0, 0, 0, 9, 0, 10, 0, 0, 0 },\n        \
    \    { 0, 0, 4, 14, 10, 0, 2, 0, 0 },\n            { 0, 0, 0, 0, 0, 2, 0, 1, 6\
    \ },\n            { 8, 11, 0, 0, 0, 0, 1, 0, 7 },\n            { 0, 0, 2, 0, 0,\
    \ 0, 6, 7, 0 }\n        };\n        ShortestPath t = new ShortestPath();\n   \
    \     t.dijkstra(graph, 0);\n    }\n    int[] dist; // Note: Added missing declaration\
    \ for compilation logic based on context\n}\n``` \n\n*Note: The provided text\
