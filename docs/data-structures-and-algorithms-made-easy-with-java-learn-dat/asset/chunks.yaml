  trans: "\n\n# 第 55.2 节：基 2 逆 FFT\n\n由于傅里叶变换的强对偶性，调整正向变换的输出可以产生逆 FFT。频域数据可以通过以下方法转换为时域：\n\
    \n1. 通过反转所有 `K` 实例的虚部，找到频域数据的复共轭。\n2. 对共轭后的频域数据执行正向 FFT。\n3. 将此 FFT 结果的每个输出除以\
    \ `N`，以得到真实的时域值。\n4. 通过反转所有 `n` 实例的时域数据的虚部，找到输出的复共轭。\n\n**注意**：频域和时域数据都是复数变量。通常，逆\
    \ FFT 后时域信号的虚部要么为零，要么作为舍入误差被忽略。将变量精度从 32 位 `float` 增加到 64 位 `double` 或 128 位 `long\
    \ double`，可以显著减少多次连续 FFT 操作产生的舍入误差。\n\n### 代码示例 (C/C++)\n\n```cpp\n#include <math.h>\n\
    #define PI 3.1415926535897932384626433832795 // 用于 sine/cos 计算的 PI\n#define TWOPI\
    \ 6.283185307179586476925286766559 // 用于 sine/cos 计算的 2*PI\n#define Deg2Rad 0.017453292519943295769236907684886\
    \ // 角度到弧度的系数\n#define Rad2Deg 57.295779513082320876798154814105 // 弧度到角的系数\n\
    #define log10_2 0.30102999566398119521373889472449 // 2 的 log10\n\n#define log10_2_INV\
    \ 3.3219280948873623478703194294948 // 1/Log10(2)\n\n// 复数变量结构（双精度）\nstruct complex\
    \ {\npublic:\n    double Re, Im; // 到底没那么复杂\n};\n\nvoid rad2InverseFFT(int N,\
    \ complex *x, complex *DFT) {\n    // M 是执行的阶段数。2^M = N\n    double Mx = (log10\
    \ ((double )N) / log10 ((double )2));\n    int a = (int )(ceil (pow (2.0 , Mx)));\n\
    \    int status = 0;\n\n    if (a != N) // 检查 N 是否为 2 的幂\n    {\n        x = 0;\n\
    \        DFT = 0;\n        throw \"rad2InverseFFT(): 基 2 逆 FFT 的 N 必须是 2 的幂\"\
    ;\n    }\n    complex *pDFT = DFT;\n    complex *pX = x;\n\n    // 重置 DFT 指针的向量\n\
    \    // 重置 x[n] 指针的向量\n    double NN = 1 / (double )N; // 逆 FFT 的缩放因子\n\n    for\
    \ (int i = 0; i < N; i++, DFT++) {\n        DFT-> Im *= 1; // 频谱的复共轭\n       \
    \ DFT = pDFT; // 重置频域指针\n        rad2FFT(N, DFT, x); // 使用切换变量（时域与频域）计算正向 FFT\n\
    \    }\n    int i;\n    for ( i = 0, x = pX; i < N; i++, x++){\n        x-> Re\
    \ *= NN; // 时域除以 N 以获得正确的幅度缩放\n        x-> Im *= 1; //改变 Im 的符号\n    }\n}\n```\n\
    \n# 附录 A：伪代码\n\n## A.1 节：变量赋值\n\n你可以用不同的方式描述变量赋值。\n\n**带类型：**\n```\nint a = 1\n\
    int a := 1\nlet int a = 1\nint a < 1\n```\n\n**无类型：**\n```\na = 1\na := 1\nlet\
    \ a = 1\na < 1\n```\n\n## A.2 节：函数\n\n只要函数名、返回语句和参数清晰，你就没问题。\n\n```\ndef incr\
    \ n\nreturn n + 1\n```\n\n或者\n\n```\nlet incr( n) = n + 1\n```\n\n或者\n\n```\n\
