    # Chapter 33: Quicksort\n\n## 33.1: Quicksort Basics\nQuicksort is a sorting algorithm\
    \ that picks an element (\"the pivot\") and reorders the array forming two partitions\
    \ such that all elements less than the pivot come before it and all elements greater\
    \ come after. The algorithm is then applied recursively to the partitions until\
    \ the list is sorted.\n\n### 1. Lomuto partition scheme mechanism\nThis scheme\
    \ chooses a pivot which is typically the last element in the array. The algorithm\
    \ maintains the index to put the pivot in variable `i` and each time it finds\
    \ an element less than equal to pivot, this index is incremented and that element\
    \ would be placed before the pivot.\n\n```\npartition(A, low, high) is\n    pivot\
    \ := A[high]\n    i := low\n    for j := low to high – 1 do\n        if A[j] ≤\
    \ pivot then\n            swap A[i] with A[j]\n            i := i + 1\n    swap\
    \ A[i] with A[high]\n    return i\n```\n\n#### Quick Sort mechanism\n```\nquicksort(A,\
    \ low, high) is\n    if low < high then\n        p := partition(A, low, high)\n\
    \        quicksort(A, low, p – 1)\n        quicksort(A, p + 1, high)\n```\n\n\
    ### 2. Hoare partition scheme\nIt uses two indices that start at the ends of the\
    \ array being partitioned, then move toward each other, until they detect an inversion:\
    \ a pair of elements, one greater or equal than the pivot, one lesser or equal,\
    \ that are in the wrong order relative to each other. The inverted elements are\
    \ then swapped. When the indices meet, the algorithm stops and returns the final\
    \ index. Hoare's scheme is more efficient than Lomuto's partition scheme because\
    \ it does three times fewer swaps on average, and it creates efficient partitions\
    \ even when all values are equal.\n\n```\nquicksort(A, lo, hi) is\n    if lo <\
    \ hi then\n        p := partition(A, lo, hi)\n        quicksort(A, lo, p)\n  \
    \      quicksort(A, p + 1, hi)\n\npartition(A, lo, hi) is\n    pivot := A[lo]\n\
    \    i := lo - 1\n    j := hi + 1\n    loop forever\n        do\n            i\
    \ := i + 1\n        while A[i] < pivot\n        do\n            j := j - 1\n \
    \       while A[j] > pivot\n        if i >= j then return\n        swap A[i] with\
    \ A[j]\n```\n\n## 33.2: Quicksort in Python\n```python\ndef quicksort(arr):\n\
    \    if len(arr) <= 1:\n        return arr\n    pivot = arr[len(arr) / 2]\n  \
    \  left = [x for x in arr if x < pivot]\n    middle = [x for x in arr if x ==\
    \ pivot]\n    right = [x for x in arr if x > pivot]\n    return quicksort(left)\
    \ + middle + quicksort(right)\n\nprint(quicksort([3, 6, 8, 10, 1, 2, 1])) # Prints\
    \ [1, 1, 2, 3, 6, 8, 10]\n```\n\n## 33.3: Lomuto partition java implementation\n\
    ```java\npublic class Solution {\n    public static void main(String[] args) {\n\
