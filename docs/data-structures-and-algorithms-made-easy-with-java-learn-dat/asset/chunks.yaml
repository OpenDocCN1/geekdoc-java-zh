    \n### 算法 vs 现实\n`LFD` 策略是最优的，但存在一个大问题。它是一个最优的离线解决方案。在实践中，缓存通常是一个在线问题，这意味着该策略是无用的，因为我们无法知道下一次需要特定项目的时间。其他四种策略也是在线策略。对于在线问题，我们需要一种不同的通用方法。\n\
    \n### 章节 18.2：自动售票机\n#### 第一个简单示例：\n你有一个自动售票机，可以兑换值为 1、2、5、10 和 20 的硬币。兑换过程可以看作一系列硬币落下，直到吐出正确的金额。当硬币数量对于其价值是最少时，我们称这种兑换是最优的。\n\
    \n让 `M` 在 `[ 1 , 50 ]` 表示票 `T` 的价格，`P` 在 `[ 1 , 50 ]` 表示有人支付 `T` 的金额，且 `P >= M`。令\
    \ `D= P- M`。我们将一步的收益定义为 `D` 与 `D- c` 之间的差，其中 `c` 是机器在此步吐出的硬币。\n\n兑换的贪心技术是以下伪算法方法：\n\
    - **步骤 1**：当 `D > 20` 时，吐出一个 20 元硬币并设置 `D = D - 20`\n- **步骤 2**：当 `D > 10` 时，吐出一个\
    \ 10 元硬币并设置 `D = D - 10`\n- **步骤 3**：当 `D > 5` 时，吐出一个 5 元硬币并设置 `D = D - 5`\n-\
    \ **步骤 4**：当 `D > 2` 时，吐出一个 2 元硬币并设置 `D = D - 2`\n- **步骤 5**：当 `D > 1` 时，吐出一个\
    \ 1 元硬币并设置 `D = D - 1`\n\n随后，所有硬币之和显然等于 `D`。这是一个贪心算法，因为在每一步以及每个步骤的重复之后，收益都最大化。我们无法吐出另一个收益更高的硬币。\n\
    \n现在是程序版的自动售票机（C++）：\n```cpp\n#include <iostream>\n#include <vector>\n#include\
    \ <string>\n#include <algorithm>\nusing namespace std;\n// 读取一些硬币值，按降序排序，\n//\
    \ 过滤重复项并保证包含 1 元硬币\nstd:: vector < unsigned int > readInCoinValues();\nint main()\
    \ {\n\n    std:: vector < unsigned int > coinValues;\n    int ticketPrice;\n\n\
    \    int paidMoney;// 硬币值的升序数组 // 示例中的 M\n\n// 示例中的 P // 生成硬币值\n\n    coinValues\
    \ = readInCoinValues();\n\n    cout << \"ticket price: \" ; cin >> ticketPrice;\n\
    \n    cout << \"money paid: \" ; cin >> paidMoney;\n    if (paidMoney <= ticketPrice)\
    \ {\n\n        cout << \"No exchange money\" << endl;\n        return 1;\n   \
    \ }\n\n    int diffValue = paidMoney - ticketPrice;\n\n    // 此处开始贪心算法\n    //\
    \ 我们记录需要吐出多少枚硬币\n    std:: vector < unsigned int > coinCount;\n    for (auto coinValue\
    \ = coinValues.begin ();\n    coinValue != coinValues.end (); ++coinValue)\n\n\
    \    {\n\n        int countCoins = 0;\n        while (diffValue >= *coinValue)\
