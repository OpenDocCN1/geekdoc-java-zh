    So the post-order traversal of above tree will be: 4 5 2 6 7 3 1\n\n## Chapter\
    \ 8: Lowest common ancestor of a Binary Tree\n\nLowest common ancestor between\
    \ two nodes `n1` and `n2` is defined as the lowest node in the tree that has both\
