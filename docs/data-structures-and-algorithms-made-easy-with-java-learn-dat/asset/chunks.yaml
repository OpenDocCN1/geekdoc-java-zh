    ### Section 35.1: C# Implementation\n```csharp\npublic class HeapSort\n{\n   \
    \ public static void Heapify( int [] input, int n, int i) {\n        int largest\
    \ = i;\n        int l = i + 1 ;\n        int r = i + 2 ;\n        if ( l < n &&\
    \ input[ l] > input[ largest]) largest = l;\n        if ( r < n && input[ r] >\
    \ input[ largest]) largest = r;\n        if ( largest != i) {\n            var\
    \ temp = input[ i];\n            input[ i] = input[ largest];\n            input[\
    \ largest] = temp;\n            Heapify( input, n, largest);\n        }\n    }\n\
    \n    public static void SortHeap( int [] input, int n) {\n        for ( var i\
    \ = n - 1 ; i >= 0 ; i--) {\n            Heapify( input, n, i);\n        }\n \
    \       for ( int j = n - 1 ; j >= 0 ; j--) {\n            var temp = input[ 0\
    \ ];\n            input[ 0 ] = input[ j];\n            input[ j ] = temp;\n  \
    \          Heapify( input, j, 0 );\n        }\n    }\n\n    public static int\
    \ [] Main( int [] input) {\n        SortHeap( input, input.Length );\n       \
    \ return input;\n    }\n}\n```\n\n### Section 35.2: Heap Sort Basic Information\n\
    Heap sort is a comparison based sorting technique on binary heap data structure.\
    \ It is similar to selection sort in which we ﬁrst find the maximum element and\
    \ put it at the end of the data structure. Then repeat the same process for the\
    \ remaining items.\n\nPseudo code for Heap Sort:\n```python\nfunction heapsort\
    \ ( input, count)\n    heapify( a,count)\n    end < count - 1 while end -> 0 do\n\
    \        swap( a[ end] ,a[ 0 ])\n    end< end - 1\n    restore( a, 0 , end)\n\n\
    function heapify ( a, count)\n    start < parent( count - 1 ) while start >= 0\
    \ do\n        restore( a, start, count - 1 )\n    start < start - 1\n```\n\n###\
    \ Example of Heap Sort:\n![](rsrc2GY.jpg) Auxiliary Space: `O( 1 )`\n\nTime Complexity:\
    \ `O( nlogn)`\n\n## Chapter 36: Cycle Sort\n\n### Section 36.1: Pseudocode Implementation\n\
    ```python\n( input)\noutput = 0\nfor cycleStart from 0 to length( array)\n   \
    \ item = array[ cycleStart]\n    pos = cycleStart\n    for i from cycleStart +\
    \ 1 to length( array)\n        if array[ i] < item:\n            pos += 1\n  \
    \  if pos == cycleStart:\n        continue\n    while item == array[ pos]:\n \
    \       pos += 1\n    array[ pos] , item = item, array[ pos]\n    writes += 1\n\
    \    while pos != cycleStart:\n        pos = cycleStart\n        for i from cycleStart\
    \ + 1 to length( array)\n            if array[ i] < item:\n                pos\
    \ += 1\n        while item == array[ pos]:\n            pos += 1\n        array[\
    \ pos] , item = item, array[ pos]\n        writes += 1\nreturn outout\n```\n\n\
    ## Chapter 37: Odd-Even Sort\n\n### Section 37.1: Odd-Even Sort Basic Information\n\
    An Odd-Even Sort or brick sort is a simple sorting algorithm, which is developed\
    \ for use on parallel processors with local interconnection. It works by comparing\
    \ all odd/even indexed pairs of adjacent elements in the list and, if a pair is\
    \ in the wrong order the elements are switched. The next step repeats this for\
    \ even/odd indexed pairs. Then it alternates between odd/even and even/odd steps\
    \ until the list is sorted.\n\nPseudo code for Odd-Even Sort:\n```python\nif n>\
    \ 2 then\n    1 . apply odd- even merge( n/ 2 ) recursively to the even subsequence\
    \ a0, a2, ..., an- 2 and to the odd subsequence a1, a3, , ..., an- 1\n    2 .\
    \ comparison [ i : i+ 1 ] for all i element { 1 , 3 , 5 , 7, ..., n - 3 }\nelse\n\
    \    comparison [ 0 : 1 ]\n```\n\nWikipedia has best illustration of Odd-Even\
    \ sort:\n![](rsrc2GZ.jpg) Example of Odd-Even Sort:\n![](rsrc2H0.jpg) Implementation:\n\
    \nI used C# language to implement Odd-Even Sort.\n```csharp\npublic class OddEvenSort\n\
    {\n    public static void SortEven(int [] input, int n) {\n        var sort =\
    \ false;\n        for ( var i = 0 ; i < n - 1 ; i++) {\n            if ( input[\
    \ i] <= input[ i + 1 ]) {\n                var temp = input[ i];\n           \
    \     input[ i] = input[ i + 1];\n                input[ i + 1 ] = temp;\n   \
    \             sort = true;\n            }\n        }\n    }\n\n    public static\
    \ void SortOdd(int [] input, int n) {\n        var sort = false;\n        for\
    \ ( var i = 1 ; i < n - 1 ; i += 2) {\n            if ( input[ i] < input[ i +\
    \ 1 ]) {\n                var temp = input[ i];\n                input[ i ] =\
    \ input[ i + 1];\n                input[ i + 1 ] = temp;\n                sort\
    \ = true;\n            }\n        }\n    }\n\n    public static void OddEvenSort(int\
    \ [] input, int n) {\n        var sort = true;\n        while (!sort) {\n    \
    \        sort = false;\n            SortEven(input, n);\n            SortOdd(input,\
    \ n);\n        }\n    }\n\n    public static int [] Main( int [] input) {\n  \
    \      OddEvenSort(input, input.Length);\n        return input;\n    }\n}\n```\n\
    Auxiliary Space: `O( n)` Time Complexity: `O( n^2)`\n\n## Chapter 38: Selection\
    \ Sort\n\n### Section 38.1: Elixir Implementation\n```elixir\nmodule Selection\
    \ do\n  def sort(list) when is_list(list) do\n    do_selection(list, [])\n  end\n\
    \n  def do_selection([], acc), do: acc\n  def do_selection([head|tail], acc) do\n\
    \    min_val = find_min([head|tail])\n    remaining = delete_once([head|tail],\
    \ min_val)\n    do_selection(remaining, acc ++ [min_val])\n  end\n\n  defp find_min(list),\
    \ do: Enum.min(list)\n  defp delete_once([], _), do: []\n  defp delete_once([x|tail],\
    \ val) when x == val, do: tail\n  defp delete_once([x|tail], val), do: [x | delete_once(tail,\
    \ val)]\nend\n\nSelection.sort([100,4,10,9,3]) |> IO.inspect\n```\n\n### Section\
    \ 38.2: Selection Sort Basic Information\nSelection sort is a sorting algorithm,\
    \ speciﬁally an-place comparison sort. It has O(n2) time complexity, making it\
    \ ineﬃcient on large lists, and generally performs worse than insertion sort.\
    \ Selection sort is noted for its simplicity, and it has performance advantages\
    \ over more complicated algorithms in certain situations, particularly where auxiliary\
    \ memory is limitedThe algorithm divides the input list into two parts: the sublist\
    \ of items already sorted, which is built up from left to right at the front (left)\
    \ of the list, and the sublist of items remaining to be sorted that occupy the\
    \ rest of the list. Initially, the sorted sublist is empty and the unsorted sublist\
    \ is the entire list. The algorithm proceeds by finding the smallest (or largest,\
    \ depending on sorting order) element in the unsorted sublist, exchanging (swapping)\
    \ it with the leftmost unsorted element (putting it in sorted order), and moving\
    \ the sublist boundaries one element to the right.\n\nPseudo code for selection\
    \ sort:\n```python\nfunction select ( list[ 1 ..n ] , k)\n    for i from 1 to\
    \ k\n        minIndex = i\n        minValue = list[ i]\n        for j from i+\
    \ 1 to n\n            if list[ j] < minValue\n                minIndex = j\n \
    \               minValue = list[ j]\n        swap list[ i] and list[ minIndex]\n\
    \    return list[ k]\n```\n\nVisualization of selection sort:\n![](rsrc2H1.jpg)Example\
    \ of selection sort:![](rsrc2H2.jpg)Auxiliary Space: `O( n)`\n\nTime Complexity:\
    \ `O( n^ 2 )`\n\n### Section 38.3: Implementation of Selection sort in C#\n```csharp\n\
    public class SelectionSort\n{\n    public static void SortSelection( int [] input,\
    \ int n) {\n        for ( int i = 0 ; i < n - 1 ; i++) {\n            var minId\
    \ = i;\n            int j;\n            for ( j = i + 1 ; j < n; j++) {\n    \
    \            if ( input[ j] < input[ minId]) minId = j; }\n            }\n   \
    \         var temp = input[ minId];\n            input[ minId] = input[ i];\n\
    \            input[ i ] = temp;\n        }\n    }\n\n    public static int []\
    \ Main( int [] input) {\n        SortSelection(input, input.Length);\n       \
    \ return input;\n    }\n}\n```\n\n## Chapter 39: Searching\n\n### Section 39.1:\
    \ Binary SearchIntroduction\nBinary Search is a Divide and Conquer search algorithm.\
    \ It uses O( log n) time to ﬁnd the location of an element in a search space where\
    \ n is the size of the search space.\n"
