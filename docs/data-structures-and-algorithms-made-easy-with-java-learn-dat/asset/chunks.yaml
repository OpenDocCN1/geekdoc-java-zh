  trans: "\n将其中一个根连接到另一个根，从而合并两棵树\n\n返回 `MST`，它现在是一个单树森林 `forest`\n\n### 第 16.3 节：基于并查集的简单实现\n\
    \n上述森林方法实际上是一种并查集数据结构，它涉及三个主要操作：\n\n```\nsubalgo makeSet( v: a node):\n  v.parent\
    \ = v < 创建一个以 v 为根的新树\n\nsubalgo findSet( v: a node):\n  if v.parent == v:\n \
    \   return v\n  return findSet( v.parent )\n\nsubalgo unionSet ( v, u: nodes):\n\
    \  vRoot = findSet( v)\n  uRoot = findSet( u)\n  uRoot.parent = vRoot\n```\n\n\
    ```\nalgorithm kruskalMST ( G: a graph):\n  按值对 G.s 中的边进行排序\n  for G 中的每个节点 n:\n\
    \    makeSet ( n)\n  for G 中的每条边 e:\n    if findSet( e.first ) != findSet( e.second\
    \ ):\n      unionSet( e.first , e.second )\n```\n\n这种朴素的实现管理并查集数据结构需要 `O( n log\
    \ n)` 的时间，导致整个 Kruskal 算法需要 `O( m* n log n)` 的时间。\n\n### 第 16.4 节：简单的高级实现\n\n\
    按值对边进行排序，如果不产生环，则按顺序将每条边加入 `MST`。\n\n```\nalgorithm kruskalMST ( G: a graph)\n\
    \  按值对 G.s 中的边进行排序\n  MST = 一个空图\n  for G 中的每条边 e:\n    if 将 e 加入 MST 不产生环:\n\
    \      add e to MST\n  return MST\n```\n\n### 第 17 章：贪心算法\n\n### 第 17.1 节：霍夫曼编码\n\
    \n霍夫曼编码是一种特殊的最优前缀码，通常用于无损数据压缩。它能非常有效地压缩数据，根据被压缩数据的特征，可以节省 20% 到 90% 的内存。我们将数据视为字符序列。霍夫曼贪心算法使用一个列出每个字符出现频次（即其频率）的表来构建一种将每个字符表示为二进制字符串的最优方法。霍夫曼编码由\
    \ David A. Huffman 于 1951 年提出。\n\n假设我们有一个 100,000 个字符的数据文件，想要紧凑地存储。我们假设文件中只有 6\
    \ 种不同的字符。字符的频率如下：\n\n|------------------------+-----+-----+-----+-----+-----+-----+|\n\
    | 字符 | a | b | c | d | e | f |\n|------------------------+-----+-----+-----+-----+-----+-----+|\n\
    | 频率（千）| 45 | 13 | 12 | 16 | 9 | 5 |\n|------------------------+-----+-----+-----+-----+-----+-----+|\n\
    \n对于如何表示这样的信息文件，我们有很多选择。在这里，我们考虑设计二进制字符编码的问题，其中每个字符由一个唯一的二进制字符串表示，我们称之为 `codeword`（码字）。\n\
    \n![](img/rsrc2FV.jpg) 构建的树将为我们提供：\n\n|------------------------+-----+-----+-----+-----+-----+-----+|\n\
    | 字符 | a | b | c | d | e | f |\n|------------------------+-----+-----+-----+-----+-----+-----+|\n\
    | 固定长度码字 | 000 | 001 | 010 | 011 | 100 | 101 |\n|------------------------+-----+-----+-----+-----+-----+-----+|\n\
    | 变长长度码字 | 0 | 101 | 100 | 111 | 1101| 1100|\n|------------------------+-----+-----+-----+-----+-----+-----+|\n\
    \n如果我们使用 `fixed-length code`（固定长度编码），我们需要三位来表示 6 个字符。这种方法编码整个文件需要 `300,000` 位。现在的问题是，我们可以做得更好吗？\n\
    \n变长编码比固定长度编码好得多，因为它给频繁出现的字符分配短码字，给不常见的字符分配长码字。这种编码需要：`(45 X 1 + 13 X 3 + 12 X\
    \ 3 + 16 X 3 + 9 X 4 + 5 X 4) X 1000 = 224000` 位来表示文件，节省了大约 25% 的内存。\n\n需要记住的一点是，我们在这里只考虑没有码字是其他码字的前缀的情况。这些被称为前缀码。对于变长编码，我们将\
    \ 3 字符文件 `abc` 编码为 `0.101.100 = 0101100`，其中 `.` 表示连接。\n\n前缀码是理想的，因为它们简化了解码。由于没有码字是任何其他码字的前缀，因此编码文件的起始码字是不模糊的。我们可以简单地识别初始码字，将其翻译回原始字符，并对编码文件的剩余部分重复解码过程。例如，`001011101`\
    \ 唯一解析为 `0.0.101.1101`，解码为 `abe`。简而言之，所有二进制表示的组合都是唯一的。例如，如果一个字母表示为 `110`，则没有其他字母将会被表示为\
    \ `1101`。\n"
- fmt: "\n# Discrete Mathematics and Its Applications - Kenneth H. Rosen\n\n## Section\
    \ 17.2: Activity Selection Problem\n\n### The Problem\nYou have a set of things\
    \ to do (activities). Each activity has a start time and a end time. You aren't\
    \ allowed to perform more than one activity at a time. Your task is to find a\
    \ way to perform the maximum number of activities.\n\nFor example, suppose you\
    \ have a selection of classes to choose from.\n\n| Activity No. | start time |\
    \ end time |\n| :--- | :--- | :--- |\n| 1 | 10.20 A.M | 11.00AM |\n| 2 | 10.30\
    \ A.M | 11.30AM |\n| 3 | 11.00 A.M | 12.00AM |\n| 4 | 10.00 A.M | 11.30AM |\n\
    | 5 | 9.00 A.M | 11.00AM |\n\nRemember, you can't take two classes at the same\
    \ time. That means you can't take class 1 and 2 because they share a common time\
    \ 10.30 A.M to 11.00 A.M. However, you can take class 1 and 3 because they don't\
    \ share a common time. So your task is to take maximum number of classes as possible\
    \ without any overlap. How can you do that?\n\n### Analysis\nLets think for the\
    \ solution by greedy approach. First of all we randomly chose some approach and\
    \ check that will work or not. sort the activity by start time that means which\
    \ activity start first we will take them first. then take first to last from sorted\
    \ list and check it will intersect from previous taken activity or not. If the\
    \ current activity is not intersect with the previously taken activity, we will\
    \ perform the activity otherwise we will not perform. this approach will work\
    \ for some cases like:\n\n| Activity No. | start time | end time |\n| :--- | :---\
    \ | :--- |\n| 1 | 11.00 A.M | 1.30P.M |\n| 2 | 11.30 A.M | 12.00P.M |\n| 3 | 1.30\
    \ P.M | 2.00P.M |\n| 4 | 10.00 A.M | 11.00AM |\n\nthe sorting order will be `4-->1-->2-->3`.\
    \ The activity `4--> 1--> 3` will be performed and the activity 2 will be skipped.\
    \ the maximum 3 activity will be performed. It works for this type of cases. but\
    \ it will fail for some cases. Lets apply this approach for the case:\n\n| Activity\
    \ No. | start time | end time |\n| :--- | :--- | :--- |\n| 1 | 11.00 A.M | 1.30P.M\
    \ |\n| 2 | 11.30 A.M | 12.00P.M |\n| 3 | 1.30 P.M | 2.00P.M |\n| 4 | 10.00 A.M\
    \ | 3.00P.M |\n\n`10.00 A.M 3.00P.M->3` will be performed. So our approach will\
    \ not work for the above case. Let's try another approach Sort the activity by\
    \ time duration that means perform the shortest activity first. that can solve\
    \ the previous problem. Although the problem is not completely solved. There still\
    \ some cases that can fail the solution. apply this approach on the case bellow:\n\
    \n| Activity No. | start time | end time |\n| :--- | :--- | :--- |\n| 1 | 6.00\
    \ A.M | 11.40A.M |\n| 2 | 11.30 A.M | 12.00P.M |\n| 3 | 11.40 P.M | 2.00P.M |\n\
    \nif we sort the activity by time duration the sort order will be `2--> 3 --->1`\
    \ . and if we perform activity No. 2 first then no other activity can be performed.\
    \ But the answer will be perform activity 1 then perform 3 . So we can perform\
    \ maximum 2 activity. So this can not be a solution of this problem. We should\
    \ try a different approach.\n\n### The Solution\nSort the Activity by ending time\
    \ that means the activity finishes first that come ﬁrst. the algorithm is given\
    \ below:\n1. Sort the activities by its ending times.\n2. If the activity to be\
    \ performed do not share a common time with the activities that previously performed,\
    \ perform the activity.\n\nLets analyse the first example:\n\n| Activity No. |\
    \ start time | end time |\n| :--- | :--- | :--- |\n| 1 | 10.20 A.M | 11.00AM |\n\
    | 2 | 10.30 A.M | 11.30AM |\n| 3 | 11.00 A.M | 12.00AM |\n| 4 | 10.00 A.M | 11.30AM\
    \ |\n| 5 | 9.00 A.M | 11.00AM |\n\nsort the activity by its ending times , So\
    \ sort order will be `1-->5-->2-->4-->3`.. the answer is `1-->3` these two activities\
    \ will be performed. ans that's the answer. here is the sudo code.\n\n```\n1.\
    \ sort: activities\n2. perform first activity from the sorted list of activities.\n\
    3. Set : Current_activity := first activity\n4. set: end_time := end_time of Current\
    \ activity\n5. go to next activity if exist, if not exist terminate .\n6. if start_time\
    \ of current activity <= end_time : perform the activity and go to 4\n7. else:\
    \ got to 5.\n```\nsee here for coding help `http://www.geeksforgeeks.org/greedy-algorithms-set-1-activity-selection-problem/`\n\
    \n## Section 17.3: Change-making problem\nGiven a money system, is it possible\
    \ to give an amount of coins and how to find a minimal set of coins corresponding\
    \ to this amount. Canonical money systems. For some money system, like the ones\
    \ we use in the real life, we use in the real life.\n\n```ocaml\nlet optsucc x\
    \ =\n  match x with\n  | Some y -> Some (y + 1)\n  | None -> None\n\nlet change_make\
    \ moneysystem amount =\n  let rec loop n acc =\n    if n = 0 then acc\n    else\n\
    \      let coin = List.find (>= n) moneysystem\n      in loop (n - coin) (coin::acc)\n\
    \  in loop amount []\n```\n*(Note: The logic above is a representative implementation\
    \ of the described algorithm in OCaml)*\n\n# Chapter 18: Applications of Greedy\
    \ technique\n\n## Section 18.1: Caching\nThe caching problem arises from the limitation\
    \ of finite space. Lets assume our cache C has k pages. Now we want to process\
    \ a sequence of m item requests which must have been placed in the cache before\
    \ they are processed. Of course if m<= k then we just put all elements in the\
    \ cache and it will work, but usually is m>> k. We say a request is a cache hit\
    \ , when the item is already in cache, otherwise its called a cache miss . In\
    \ that case we must bring the requested item into cache and evict another, assuming\
    \ the cache is full. The Goal is a eviction schedule that minimizes the number\
    \ of evictions . There are numerous greedy strategies for this problem, lets look\
    \ at some:\n1. First in, first out (FIFO) : The oldest page gets evicted.\n2.\
    \ Last in, first out (LIFO) : The newest page gets evicted.\n3. Last recent out\
    \ (LRU) : Evict page whose most recent access was earliest.\n4. Least frequently\
    \ requested(LFU) : Evict page that was least frequently requested.\n5. Longest\
    \ forward distance (LFD) : Evict page in the cache that is not requested until\
    \ farthest in the future.\n\nAttention: For the following examples we evict the\
    \ page with the smallest index, if more than one page could be evicted.\n\n###\
    \ Example (FIFO)\nLet the cache size be k=3 the initial cache a,b,c and the request\
    \ a,a,d,e,b,b,a,c,f,d,e,a,f,b,e,c:\n\n| Request | a | a | d | e | b | b | a |\
    \ c | f | d | e | a | f | b | e | c |\n| :--- | :--- | :--- | :--- | :--- | :---\
    \ | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :---\
    \ |\n| Cache 1 | a | a | d | d | d | d | a | a | a | d | d | d | f | f | f | c\
    \ |\n| Cache 2 | b | b | b | e | e | e | e | c | c | c | e | e | e | b | b | b\
    \ |\n| Cache 3 | c | c | c | c | b | b | b | b | f | f | f | a | a | a | e | e\
    \ |\n| Hit/Miss | h | h | m | m | m | h | m | m | m | m | m | m | m | m | m |\
    \ m |\n"
