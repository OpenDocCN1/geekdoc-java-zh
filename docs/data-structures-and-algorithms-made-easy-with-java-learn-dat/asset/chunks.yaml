    \ 9 8 7 6 5\n```\n\n## 第 51 章：算法：按方形形打印 m*n 矩阵\n\n检查下方的示例输入和输出。\n\n### 第 51.1\
    \ 节：示例\n\n输入：\n```14 15 16 17 18 21\n19 10 20 11 54 36\n64 55 44 23 80 39\n91\
