    \ \n```\n\n`LFD` 策略与之前的所有策略不同。它是唯一利用未来请求来决定剔除哪个对象的策略。该实现使用 `calcNextUse` 函数来获取未来下次使用时间最远的页面。程序的解与上述的手工计算结果相等：\n\
    \n策略：`LFD`\n\n缓存初始：`( a,b,c)`\n请求 缓存 0 缓存 1 缓存 2 缓存缺失 a a b c\na a b c\nd a b\
    \ d x e a b e x b a b e\nb a b e\na a b e\nc a c e x f a f e x d a d e x e a d\
    \ e\na a d e\nf f d e x b b d e x e b d e\nc c d e x\n\n总缓存缺失：8\n\n贪心策略 `LFD`\
