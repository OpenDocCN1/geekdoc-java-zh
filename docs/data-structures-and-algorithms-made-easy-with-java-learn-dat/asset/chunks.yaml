    \n![](rsrc2FS.jpg) Finally, we can see that we have a winning square beside us,\
    \ so we move there, and we are done.\n\n# Chapter 14: Dynamic Programming\n\n\
    Dynamic programming is a widely used concept and its often used for optimization.\
    \ It refers to simplifying a complicated problem by breaking it down into simpler\
    \ sub-problems in a recursive manner usually a bottom-up approach. There are two\
    \ key attributes that a problem must have in order for dynamic programming to\
    \ be applicable \"Optimal substructure\" and \"Overlapping sub-problems\". To\
    \ achieve its optimization, dynamic programming uses a concept called memoization.\n\
    \n## Section 14.1: Edit Distance\n\nThe problem statement is like if we are given\
    \ two string `str1` and `str2` then how many minimum number of operations can\
    \ be performed on the `str1` that it gets converted to `str2`.\n\n### Implementation\
    \ in Java\n\n```java\npublic class EditDistance {\n    public static void main(\
    \ String [] args) {\n        // TODO Auto-generated method stub\n        String\
    \ str1 = \"march\" ;\n        String str2 = \"cart\" ;\n        EditDistance ed\
    \ = new EditDistance();\n        System .out .println ( ed.getMinConversions (\
    \ str1, str2));\n    }\n\n    public int getMinConversions( String str1, String\
    \ str2){\n        int dp[][] = new int [ str1.length ()+ 1 ][ str2.length ()+\
    \ 1 ];\n        for ( int i= 0 ; i<= str1.length (); i++){\n            for (\
    \ int j= 0 ; j<= str2.length (); j++){\n                if ( i== 0 )\n       \
    \             dp[ i][ j] = j;\n                else if ( j== 0 )\n           \
    \         dp[ i][ j] = i;\n                else if ( str1.charAt ( i- 1 ) == str2.charAt\
    \ ( j- 1 ))\n                    dp[ i][ j] = dp[ i- 1 ][ j- 1 ];\n          \
    \      else {\n                    dp[ i][ j] = 1 + Math .min ( dp[ i- 1 ][ j\
    \ ] , Math .min ( dp[ i][ j- 1 ] , dp[ i- 1 ][ j- 1 ]));\n                }\n\
    \            }\n        }\n        return dp[ str1.length ()][ str2.length ()];\n\
    \    }\n}\n```\n\nOutput 3\n\n## Section 14.2: Weighted Job Scheduling Algorithm\n\
    \nWeighted Job Scheduling Algorithm can also be denoted as Weighted Activity Selection\
    \ Algorithm. The problem is, given certain jobs with their start time and end\
    \ time, and a proﬁt you make when you ﬁnish the job, what is the maximum proﬁt\
    \ you can make given no two jobs can be executed in parallel?\n\nThis one looks\
    \ like Activity Selection using Greedy Algorithm, but there's an added twist.\
    \ That is, instead of maximizing the number of jobs ﬁnished, we focus on making\
    \ the maximum proﬁt. The number of jobs performed doesn't matter here.\n\nLet's\
    \ look at an example:\n\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
    | Name | A | B | C | D | E | F |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
