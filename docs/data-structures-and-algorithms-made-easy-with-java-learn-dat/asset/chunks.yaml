    \ `O( n+ k)`\n\n### 第 34.2 节：伪代码实现\n限制条件：\n1. `Input`（一个需要排序的数组）\n2. 输入中的元素数量\
    \ (`n`)\n3. 范围在 `0..k-1` 内键 (`k`)\n4. `Count`（一个数字数组）\n\n伪代码：\n```python\nfor\
    \ x in input:\n    count[ key( x)] += 1\n\ntotal = 0\n\nfor i in range( k):\n\
    \    oldCount = count[ i]\n    count[ i] = total\n    total += oldCount\n\nfor\
    \ x in input:\n    output[ count[ key( x)]] = x\n    count[ key( x)] += 1\n\n\
    return output\n```\n\n## 第 35 章：堆排序\n\n### 第 35.1 节：C# 实现\n```csharp\npublic class\
    \ HeapSort\n{\n    public static void Heapify( int [] input, int n, int i) {\n\
    \        int largest = i;\n        int l = i + 1 ;\n        int r = i + 2 ;\n\
    \        if ( l < n && input[ l] > input[ largest]) largest = l;\n        if (\
    \ r < n && input[ r] > input[ largest]) largest = r;\n        if ( largest !=\
    \ i) {\n            var temp = input[ i];\n            input[ i] = input[ largest];\n\
    \            input[ largest] = temp;\n            Heapify( input, n, largest);\n\
    \        }\n    }\n\n    public static void SortHeap( int [] input, int n) {\n\
