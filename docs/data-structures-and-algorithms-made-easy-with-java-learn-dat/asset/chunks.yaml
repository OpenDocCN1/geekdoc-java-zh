    \ `BFS` 树。这棵树显示了从源点到所有其他节点的最短路径。因此，我们的任务是从源点到第 1 层节点，然后从第 1 层到第 2 层，以此此类推，直到到达目的地。我们可以使用\
    \ `queue`（队列）来存储将处理的节点。也就是说，对于我们要处理的每个节点，我们将所有其他可以直接遍历且尚未遍历的节点推入队列。\n\n示例的模拟：\n\
