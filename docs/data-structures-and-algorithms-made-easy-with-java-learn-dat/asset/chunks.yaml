    `Queue` 数据结构用于实现上述目标。\n\n## 7.2 节 二叉树的前序、中序和后序遍历\n\n考虑二叉树：\n\n![](img/src2EU.jpg)\n\
    \n前序遍历 `(root)` 是访问节点、左子树，然后右子树。\n\n因此上述二叉树的前序遍历为：\n1 2 4 5 3 6 7\n\n中序遍历 `(root)`\
    \ 是访问左子树、节点，然后右子树。\n\n因此上述二叉树的中序遍历为：\n4 2 5 1 6 3 7\n\n后序遍历 `(root)` 是访问左子树、右子树，然后节点。\n\
    \n因此上述二叉树的后序遍历为：\n4 5 2 6 7 3 1\n\n## 第 8 章：二叉树的最近祖先\n\n两个节点 `n1` 和 `n2` 之间的最近祖先定义为树中同时具有\
    \ `n1` 和 `n2` 为后代的节点。\n\n## 8.1 节 寻找最近祖先\n\n考虑树：\n\n![](img/src2ES.jpg)\n\n值为\
    \ 1 和 4 的节点的最近祖先是 2。\n值为 1 和 5 的节点的最近祖先是 3。\n值为 2 和 4 的节点的最近祖先是 4。\n值为 1 和 2 的节点的最近祖先是\
    \ 2。\n\n## 第 9 章：图\n\n图是点及其连接子集的线的集合。图的点称为顶点（vertices）、“节点”或简单的“点”。同样，连接图中顶点的线称为边（edges）、“弧”或“线”。\n\
    \n图 `G` 可以定义为一个对 `(V,E)`，其中 `V` 是顶点集合，`E` 是顶点间的边集合 `E ⊆ {(u,v) | u, v ∈ V}`。\n\
    \n## 9.1 节：存储图（邻接矩阵）\n\n为了存储图，通常有两种方法：\n\n1. 邻接矩阵\n2. 邻接列表\n\n邻接矩阵是一种用于表示有限图的方阵。矩阵的元素表示图中顶点对是否相邻。\n\
    \n相邻意味着“靠近或连接到某物”或位于某物旁边。例如，你的邻居与你是相邻的。在图论中，如果我们能从节点 `A` 到节点 `B`，我们可以说节点 `B` 邻节点\
    \ `A`。现在我们将学习如何通过邻接矩阵存储哪些节点与哪些节点相邻的。这意味着我们将表示哪些节点之间共享边。这里矩阵意味着二维数组。\n\n![](img/src2F2.jpg)\
    \ 在这里可以看到图旁边的表格，这是我们的邻接矩阵。这里 `Matrix[i][j] = 1` 表示 `i` 和 `j` 之间存在边。如果没有边，我们简单地设置\
    \ `Matrix[i][j] = 0`。\n\n这些边可以是权重的，例如代表两个城市之间的距离。这时我们会在 `Matrix[i][j]` 中放入该值而不是\
    \ 1。\n\n上述描述的图是双向或无向的，这意味着如果我们能从节点 2 到节点 1，也可以从节点 1 到节点 2。如果图是有向的，那么在图的一侧会有箭头符号。即使如此，我们仍然可以使用邻接矩阵来表示它。\n\
    \n![](img/src2F3.jpg)\n\n我们用无穷表示不共享边的节点。需要注意的一点是，如果图是无向的，矩阵是对称的。\n\n创建矩阵的伪代码：\n\
    \n```\nProcedure AdjacencyMatrix ( N): //N 代表节点数\n```\n\n也可以通过这种方式填充 `Matrix`：\n\
    \n```\nProcedure AdjacencyMatrix ( N): //N 代表节点数\n```\n\n\n\n使用邻接矩阵的缺点：\n- 无论有多少条边，总是需要\
    \ `N * N` 的空间。如果图是稀疏的，这会浪费内存。\n"
- fmt: "\n# Section 9.2: Introduction To Graph Theory\n\nGraph Theory is the study\
    \ of graphs, which are mathematical structures used to model pairwise relations\
    \ between objects. Did you know, almost all the problems of planet Earth can be\
    \ converted into problems of Roads and Cities, and solved? Graph Theory was invented\
    \ many years ago, even before the invention of computer. Leonhard Euler wrote\
    \ a paper on the Seven Bridges of Königsberg which is regarded as the ﬁrst paper\
    \ of Graph Theory. Since then, people have come to realize that if we can convert\
    \ any problem to this City-Road problem, we can solve it easily by Graph Theory.\n\
    \nGraph Theory has many applications. One of the most common application is to\
    \ ﬁnd the shortest distance between one city to another. We all know that to reach\
    \ your PC, this web-page had to travel many routers from the server. Graph Theory\
    \ helps it to ﬁnd out the routers that needed to be crossed. During war, which\
    \ street needs to be bombarded to disconnect the capital city from others, that\
    \ too can be found out using Graph Theory. Let us first learn some basic deﬁnitions\
    \ on Graph Theory.\n\n## Graph\nLet's say, we have 6 cities. We mark them as 1,\
    \ 2, 3, 4, 5, 6. Now we connect the cities that have roads between each other.\n\
    \n![](rsrc2F4.jpg)\n\nThis is a simple graph where some cities are shown with\
    \ the roads that are connecting them. In Graph Theory, we call each of these cities\
    \ `Node` or `Vertex` and the roads are called `Edge`. Graph is simply a connection\
    \ of these nodes and edges. A node can represent a lot of things. In some graphs,\
    \ nodes represent cities, some represent airports, some represent a square in\
    \ a chessboard. Edge represents the relation between each nodes. That relation\
    \ can be the time to go from one airport to another, the moves of a knight from\
    \ one square to all the other squares etc.\n\n![](rsrc2F5.jpg) Path of Knight\
    \ in a Chessboard\n\nIn simple words, a `Node` represents any object and `Edge`\
    \ represents the relation between two objects.\n\n## Adjacent Node\nIf a node\
    \ `A` shares an edge with node `B`, then `B` is considered to be adjacent to `A`.\
    \ In other words, if two nodes are directly connected, they are called adjacent\
    \ nodes. One node can have multiple adjacent nodes.\n\n## Directed and Undirected\
    \ Graph\nIn directed graphs, the edges have direction signs on one side, that\
    \ means the edges are `Unidirectional`. On the other hand, the edges of undirected\
    \ graphs have direction signs on both sides, that means they are `Bidirectional`.\
    \ Usually undirected graphs are represented with no signs on the either sides\
    \ of the edges.\n\nLet's assume there is a party going on. The people in the party\
    \ are represented by nodes and there is an edge between two people if they shake\
    \ hands. Then this graph is undirected because any person `A` shake hands with\
    \ person `B` if and only if `B` also shakes hands with `A`. In contrast, if the\
    \ edges from a person `A` to another person `B` corresponds to `A`s admiring `B`,\
    \ then this graph is directed, because admiration is not necessarily reciprocated.\
    \ The former type of graph is called an undirected graph and the edges are called\
    \ undirected edges while the latter type of graph is called a directed graph and\
    \ the edges are called directed edges.\n\n## Weighted and Unweighted Graph\nA\
    \ weighted graph is a graph in which a number (the weight) is assigned to each\
    \ edge. Such weights might represent for example costs, lengths or capacities,\
    \ depending on the problem at hand.\n\n![](rsrc2F6.jpg) An unweighted graph is\
    \ simply the opposite. We assume that, the weight of all the edges are same (presumably\
    \ 1).\n\n## Path\nA path represents a way of going from one node to another. It\
    \ consists of sequence of edges. There can be multiple\n\n![](rsrc2F7.jpg)\n\n\
    In the example above, there are two paths from `A` to `D`. `A->B`, `B->C`, `C->D`\
    \ is one path. The cost of this path is `3 + 4 + 2 = 9`. Again, there's another\
    \ path `A->D`. The cost of this path is `10`. The path that costs the lowest is\
    \ called `shortest path`.\n\n## Degree\nThe degree of a vertex is the number of\
    \ edges that are connected to it. If there's any edge that connects to the vertex\
    \ at both ends (a loop) is counted twice.\n\nIn directed graphs, the nodes have\
    \ two types of degrees:\n- **In-degree**: The number of edges that point to the\
    \ node.\n- **Out-degree**: The number of edges that point from the node to other\
    \ nodes.\n\nFor undirected graphs, they are simply called degree.\n\n![](rsrc2F8.jpg)\
    \ Some Algorithms Related to Graph Theory\n- Bellman–Ford algorithm\n- Dijkstra's\
    \ algorithm\n- Ford–Fulkerson algorithm\n- Kruskal's algorithm\n- Nearest neighbour\
    \ algorithm\n- Prim's algorithm\n- Depth-first search\n- Breadth-first search\n\
    \n# Section 9.3: Storing Graphs (Adjacency List)\nAdjacency list is a collection\
    \ of unordered lists used to represent a finite graph. Each list describes the\
    \ set of neighbors of a vertex in a graph. It takes less memory to store graphs.\n\
    \nLet's see a graph, and its adjacency matrix:\n\n![](rsrc2F9.jpg)\n\nNow we create\
    \ a list using these values.![](rsrc2FA.jpg)\n\nThis is called adjacency list.\
    \ It shows which nodes are connected to which nodes. We can store this information\
    \ using a 2D array. But will cost us the same memory as Adjacency Matrix. Instead\
    \ we are going to use dynamically allocated memory to store this one. Many languages\
    \ support `Vector` or `List` which we can use to store adjacency list. For these,\
    \ we don't need to specify the size of the `List`. We only need to specify the\
    \ maximum number of nodes.\n\n```python\nProcedure AdjacencyList(maxN, E):\n \
    \   edge[maxN] = Vector()\n    for i from 1 to E:\n        // input x, y\n   \
    \     edge[x].push(y)\n        edge[y].push(x)\n    return edge\n```\nSince this\
    \ one is an undirected graph, there is an edge from `x` to `y`, there is also\
    \ an edge from `y` to `x`. If it was a directed graph, we'd omit the second one.\
    \ For weighted graphs, we need to store the cost too. We'll create another vector\
    \ or list named `cost[]` to store these.\n\n```python\nProcedure AdjacencyList(maxN,\
    \ E):\n    edge[maxN] = Vector()\n    cost[maxN] = Vector()\n    for i from 1\
    \ to E:\n        // input x, y, w\n        edge[x].push(y)\n        cost[x].push(w)\n\
    \    return edge, cost\n```\nFrom this one, we can easily find out the total number\
    \ of nodes connected to any node, and what these nodes are. It takes less time\
    \ than Adjacency Matrix. But if we needed to find out there's an edge between\
    \ `u` and `v`, it'd have been easier if we kept an adjacency matrix.\n\n# Section\
    \ 9.4: Topological Sort\nA topological ordering, or a topological sort, orders\
    \ the vertices in a directed acyclic graph on a line, i.e. in a list, such that\
    \ all directed edges go from left to right. Such an ordering cannot exist if the\
    \ graph contains a directed cycle because there is no way that you can keep going\
    \ right on a line and still return back to where you started from.\n\nFormally,\
    \ in a graph `G = (V, E)`, then a linear ordering of all its vertices is such\
    \ that if `G` contains an edge `(u, v) ∈ E`from vertex `u` to vertex `v` `u` precedes\
    \ `v` in the ordering.\n\nIt is important to note that each DAG has at least one\
    \ topological sort.\n\nThere are known algorithms for constructing a topological\
    \ ordering of any DAG in linear time, one example is:\n1. Call `depth_first_search(G)`\
    \ to compute finishing times `v.f` for each vertex `v`.\n2. As each vertex is\
    \ finished, insert it into the front of a linked list.\n3. the linked list of\
    \ vertices, as it is now sorted.\n\nA topological sort can be performed in `(V\
    \ + E)` time, since the depth-first search algorithm takes `(V + E)` time and\
    \ it takes `Ω(1)` (constant time) to insert each of `|V|` vertices into the front\
    \ of a linked list.\n"
