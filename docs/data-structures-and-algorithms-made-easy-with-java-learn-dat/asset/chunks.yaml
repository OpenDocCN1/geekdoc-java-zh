    \ common subsequence? We'll start from the bottom-right corner. We will check\
    \ from where the value is coming. If the value is coming from the diagonal, that\
    \ is if `Table[i-1][j-1]` is equal to `Table[i][j] - 1`, we push either `s2[i]`\
    \ or `s1[j]` (both are the same) and move diagonally. If the value is coming from\
    \ top, that means, if `Table[i-1][j]` is equal to `Table[i][j]`, we move to the\
    \ top. If the value is coming from left, that means, if `Table[i][j-1]` is equal\
    \ to `Table[i][j]`, we move to the left. When we reach the leftmost or topmost\
    \ column, our search ends. Then we pop the values from the stack and print them.\n\
    \nThe pseudo-code:\n\n```\nProcedure PrintLCS ( LCSlength, s1, s2):\n  temp :=\
    \ LCSlength\n  S = stack()\n  i := s2.length\n  j := s1.length\n  while i is not\
    \ equal to 0 and j is not equal to 0\n    if Table[ i- 1 ][ j- 1 ] == Table[ i][\
    \ j] - 1 and s1[ j]== s2[ i]\n      S. push ( s1[ j]) //or S.push(s2[i])\n   \
    \   i := i - 1\n      j := j - 1\n    else if Table[ i- 1 ][ j] == Table[ i][\
    \ j]\n      i := i- 1\n    else\n      j := j- 1\n    endif\n  endwhile\n  while\
    \ S is not empty\n    print( S.pop )\n  endwhile\n```\n\nPoint to be noted: if\
    \ both `Table[i-1][j]` and `Table[i][j-1]` is equal to `Table[i][j]` and `Table[i-1][j-1]`\
    \ is not equal to `Table[i][j] - 1`, there can be two LCS for that moment. This\
    \ pseudo-code doesn't consider this situation. You'll have to solve this recursively\
    \ to find multiple LCSs. The time complexity for this algorithm is: `O(max(m,\
    \ n))`.\n\n# Chapter 48: Longest Increasing Subsequence\n\n## Section 48.1: Longest\
    \ Increasing Subsequence Basic Information\n\nThe Longest Increasing Subsequence\
    \ problem is to find subsequence from the give input sequence in which subsequence's\
    \ elements are sorted in lowest to highest order. All subsequence are not contiguous\
    \ or unique.\n\n### Application of Longest Increasing Subsequence:\nAlgorithms\
    \ like Longest Increasing Subsequence, Longest Common Subsequence are used in\
    \ version control systems like Git and etc.\n\nSimple form of Algorithm:\n1. Find\
    \ unique lines which are common to both documents.\n2. Take all such lines from\
    \ the first document and order them according to their appearance in the second\
    \ document.\n3. Compute the LIS of the resulting sequence (by doing a Patience\
    \ Sort), getting the longest matching sequence of lines, a correspondence between\
    \ the lines of two documents.\n4. Recurse the algorithm on each range of lines\
    \ between already matched ones.\n\nNow let us consider a simpler example of the\
    \ LCS problem. Here, input is only one sequence of distinct integers `a1,a2,...,an.`,\
    \ and we want to find the longest increasing subsequence.\n\nThe easiest approach\
    \ is to sort input in increasing order, but if you look at the resulting array\
    \ you would notice many values are the same, which suggests that the LIS problem\
    \ is repetitive.\n\nPseudo Code:\n1. Describe an array of values we want to compute.\n\
    2. For `1 <= i <= n`, let `A(i)` be the length of an increasing subsequence.\n\
    3. Give the recurrence: For `1 <= i <= n`, `A(i) = 1 + max{A(j)}` where `j < i`\
    \ and `input[j] < input[i]`.\n4. Find the optimal solution.\n\nThe following program\
    \ uses `A` to compute the optimal solution. The first part computes `m`, and the\
    \ second part prints it out. This program runs in `O(n^2)`, but the first part\
    \ runs in `O(n)`.\n\nIterative Algorithm:\n```\nfor i = 1 to n:\n  L[i] = 1\n\
    \  for j = 1 to i-1\n    if input[j] < input[i]\n      L[i] = max(L[i], L[j] +\
    \ 1)\n```\nThe time complexity for this algorithm is `O(n^2)`. Auxiliary Space:\
    \ `O(n)`.\n\nLet us take `{0, 8, 4, 12, 2, 10, 6, 14, 1, 9, 5, 13, 3, 11, 7}`\
    \ as input. So, Longest Increasing Subsequence for the input is `{0, 2, 6, 9,\
    \ 11, 15}`.\n\n# Chapter 49: Check two strings are anagram\n\nTwo string with\
