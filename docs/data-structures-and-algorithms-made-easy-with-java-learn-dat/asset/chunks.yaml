- fmt: "\n![](rsrc2GD.jpg)This is how the graph looks like after `(V-1) = 3` iterations.\
    \ It should be the result since there are 4 edges, we need at most 3 iterations\
    \ to find out the shortest path. So either this is the answer, or there is a negative\
    \ weight cycle in the graph. To find that, after `(V-1)` iterations, we do one\
    \ more final iteration and if the distance continues to decrease, it means that\
    \ there is definitely a negative weight cycle in the graph.\n\nFor this example:\
    \ if we check `2-3`, `d[2] + cost[2][3]` will give us 1 which is less than `d[3]`.\
    \ So we can conclude that there is a negative cycle in our graph. So how do we\
    \ find out the negative cycle? We do a bit modification to Bellman-Ford procedure:\n\
    \n```\nProcedure NegativeCycleDetector ( Graph, source):\n  n := number of vertices\
    \ in Graph\n  for i from 1 to n\n    d[i] := infinity\n  end for\n\n  d[source]\
    \ := 0\n\n  for i from 1 to n- 1\n    flag := false\n    for all edges from (u,v)\
    \ in Graph\n      if d[u] + cost[u][v] < d[v]\n        d[v] := d[u] + cost[u][v]\n\
    \        flag := true\n      end if\n    if flag == false break\n  end for\n\n\
    \  for all edges from (u,v) in Graph\n    if d[u] + cost[u][v] < d[v]\n      Return\
    \ \"Negative Cycle Detected\"\n    end if\n  end for\n\n  Return \"No Negative\
    \ Cycle\"\n```\n\nThis is how we find out if there is a negative cycle in a graph.\
    \ We can also modify Bellman-Ford Algorithm to keep track of negative cycles.\n\
    \n# Section 20.3: Why do we need to relax all the edges at most (V-1) times\n\n\
    To understand this example, it is recommended to have a brief idea on Bellman-Ford\
    \ single source shortest path algorithm which can be found here.\n\nIn Bellman-Ford\
    \ algorithm, to find out the shortest path, we need to relax all the edges of\
    \ the graph. This process is repeated at most `(V-1)` times, where `V` is the\
    \ number of vertices in the graph.\n\nThe number of iterations needed to find\
