  trans: "\n\n# 第 9.2 节：图论引论\n\n图论是“图”的研究，图是用于模拟对象之间成对关系的数学结构。你知道吗，地球上几乎所有的问题都可以转换为“道路与城市”问题并解决？图论发明于许多年前，甚至在计算机发明之前。莱昂哈德·欧拉（Leonhard\
    \ Euler）写了一篇关于康尼斯斯堡七桥的论文，这被认为是图论的第一篇论文。从那时起，人们意识到，如果我们能将任何问题转换为这种城市-道路问题，就可以通过图论轻松地解决它。\n\
    \n图论有许多应用。最常见的应用之一是寻找一个城市到另一个城市之间的最短距离。我们都知道，为了访问你的电脑，这个网页必须从服务器经过许多路由器。图论帮助它找到需要跨越的路由器。在战争期间，需要轰炸哪条街道可以将首都与其他地方隔离开，这也可以使用图论找到。让我们先学习图论的一些基本定义。\n\
    \n## 图 (Graph)\n假设我们有 6 个城市。我们将它们标记为 1, 2, 3, 4, 5, 6。现在我们连接彼此之间有道路的城市。\n\n![](img/rsrc2F4.jpg)\n\
    \n这是一个简单图，图中用连接它们的道路显示了某些城市。在图论中，我们将这些城市称为 `Node`（节点）或 `Vertex`（顶点），并将道路称为 `Edge`（边）。图仅仅是这些节点和边的连接。一个节点可以代表很多东西。在某些图中，节点代表城市，某些代表机场，某些代表棋盘上的方格。边代表每个节点之间的关系。这种关系可以是从一个机场到另一个机场的时间，可以是马从一个方格到所有其他方格的移动等。\n\
    \n![](img/rsrc2F5.jpg) 棋盘上马的路径\n\n简单来说，`Node` 代表任何对象，`Edge` 代表两个对象之间的关系。\n\n##\
    \ 邻节点 (Adjacent Node)\n如果节点 `A` 与节点 `B` 共享一条边，那么 `B` 被认为是 `A` 的相邻节点。换句话说，如果两个节点直接连接，它们被称为相邻节点。一个节点可以有多个相邻节点。\n\
    \n## 有向图与无向图 (Directed and Undirected Graph)\n在有向图中，边的一侧有方向符号，这意味着边是 `Unidirectional`（单向的）。相反，无向图的边两侧都有方向符号，这意味着它们是\
    \ `Bidirectional`（双向的）。通常无向图在边的两侧都没有符号。\n\n让我们假设正在举行一个派对。派对的人由节点表示，如果两个人握手，则他们之间就有一条边。那么这个图就是无向的，因为任何人\
    \ `A` 与 `B` 握手当且仅当 `B` 也与 `A` 握手。相反，如果从一个人 `A` 到另一个人 `B` 的边对应于 `A` 崇拜 `B`，那么这个图是有向的，因为崇拜并不一定相互。第一种图称为无向图，边称为无向边；而后一种图称为有向图，边称为有向边。\n\
    \n## 加权图与无权图 (Weighted and Unweighted Graph)\n加权图是每条边都分配了一个数字（权重）的图。这些权重可以根据所处理的问题代表成本、长度或容量等。\n\
    \n![](img/rsrc2F6.jpg) 无权图正好相反。我们假设所有边的权重都是相同的（假设为 1）。\n\n## 路径 (Path)\n路径代表从一个节点到另一个节点的方法。它由一系列边组成。可以有多条。\n\
    \n![](img/rsrc2F7.jpg)\n\n在上面的示例中，从 `A` 到 `D` 有两条路径。`A->B`、`B->C`、`C->D` 是一条路径。这条路径的成本是\
    \ `3 + 4 + 2 = 9`。同样，还有另一路径 `A->D`。这条路径的成本是 `10`。成本最低的路径被称为 `shortest path`（最短路径）。\n\
    \n## 度 (Degree)\n顶点的度连接到它的边的数量。如果有边两端连接到同一个顶点（自环），则计算两次。\n\n在有向图中，节点有两种类型的度：\n\
    - **入度 (In-degree)**：指向节点的边数。\n- **出度 (Out-degree)**：从该节点指向其他节点的边数。\n\n对于无向图，它们简单称为度。\n\
    \n![](img/rsrc2F8.jpg) 一些与图相关的算法\n- Bellman–Ford 算法\n- Dijkstra 算法\n- Ford–Fulkerson\
    \ 算法\n- Kruskal 算法\n- 最近邻算法\n- Prim 算法\n- 深度优先搜索\n- 广度优先搜索\n\n# 第 9.3 节：存储图（邻接列表）\n\
    邻接列表是无序列表的集合，用于表示有限图。每个列表描述图中顶点的邻居集合。存储图时所需的内存较少。\n\n让我们看一个图及其其邻接矩阵：\n\n![](img/rsrc2F9.jpg)\n\
    \n现在我们使用这些值创建一个列表。![](img/rsrc2FA.jpg)\n\n这被称为邻接列表。它显示了哪些节点连接到哪些节点。我们可以使用二维数组来存储这些信息。但这将消耗与邻接矩阵相同的内存。相反，我们将要使用动态分配的内存来存储这个。许多语言支持\
    \ `Vector` 来存储这个。\n\n```python\nProcedure AdjacencyList(maxN, E):\n    edge[maxN]\
    \ = Vector()\n    for i from 1 to E:\n        # x, y\n        edge[x].push(y)\n\
    \        edge[y].push(x)\n```\n由于是无向图，所以 `x` 到 `y` 有边，`y` 到 `x` 也有边。如果是有向图，我们会省略第二个。对于加权图，我们还需要存储成本。我们将创建另一个名为\
    \ `cost` 的向量来存储这些。\n\n```python\nProcedure AdjacencyList(maxN, E):\n    edge[maxN]\
    \ = Vector()\n    cost[maxN] = Vector()\n    for i from 1 to E:\n        # x,\
    \ y, w\n        edge[x].push(y)\n        cost[x].push(w)\n    return edge, cost\n\
    ```\n通过这个，我们可以轻松找到连接到任何节点的总数以及这些节点是什么。它比邻接矩阵节省时间。但如果我们需要判断 `u` 和 `v` 之间是否存在边，使用邻接矩阵会更容易。\n\
    \n# 第 9.4 节：拓扑排序 (Topological Sort)\n拓扑排序（topological ordering）是将有向无环图中的顶点在直线上（即列表中）进行排序，使得所有有向边都从左向右。如果图中包含有向环，则这种排序不存在，因为你无法一直向右走并仍然回到起点。\n\
    \n形式化地说，在图 `G = (V, E)` 中，所有顶点的线性排序定义为：如果 `G` 包含从顶点 `u` 到顶点 `v` 的边 `(u, v) ∈ E`，则\
    \ `u` 在排序中位于 `v`。\n\n重要的是，每个 DAG 至少有一个拓扑排序。\n\n已知可以在线性时间内构建任何 DAG 的拓扑排序，一个例子是：\n\
    1. 调用 `depth_first_search(G)` 计算每个顶点的完成时间 `v.f`。\n2. 当每个顶点完成时，将其插入链列表的头部。\n3.\
    \ 返回顶点列表，它现在已经排好序了。\n\n"
- fmt: "\nMany applications use directed acyclic graphs to indicate precedences among\
    \ events. We use topological sorting so that we get an ordering to process each\
    \ vertex before any of its successors. Vertices in a graph may represent tasks\
    \ to be performed and the edges may represent constraints that one task must be\
    \ performed before another; a topological ordering is a valid sequence to perform\
    \ the tasks set of tasks described in `V`.\n\n### Problem instance and its solution\n\
    Let a vertice `v` describe a `Task( hours_to_complete: int )`, i. e. `Task( 4\
    \ )` describes a Task that takes 4 hours to complete, and an edge `e` describe\
    \ a `Cooldown( hours: int )` such that `Cooldown( 3 )` describes a duration of\
    \ time to cool down after a completed task.\n\nLet our graph be called `dag` (since\
    \ it is a directed acyclic graph), and let it contain 5 vertices:\n`A < dag.add_vertex\
    \ ( Task( 4 ) ));`\n`B < dag.add_vertex ( Task( 5 ) ));`\n`C < dag.add_vertex\
    \ ( Task( 3 ) ));`\n`D < dag.add_vertex ( Task( 2 ) ));`\n`E < dag.add_vertex\
    \ ( Task( 7 ) ));`\n\nwhere we connect the vertices with directed edges such that\
    \ the graph is acyclic:\n```cpp\n// A ---> C ----+\n// | | |\n// v v v\n// B --->\
    \ D --> E\n```\n`dag.add_edge ( A, B, Cooldown( 2 ) ));`\n`dag.add_edge ( A, C,\
    \ Cooldown( 2 ) ));`\n`dag.add_edge ( B, D, Cooldown( 1 ) ));`\n`dag.add_edge\
    \ ( C, D, Cooldown( 1 ) ));`\n`dag.add_edge ( C, E, Cooldown( 1 ) ));`\n`dag.add_edge\
    \ ( D, E, Cooldown( 3 ) ));`\n\nthen there are three possible topological orderings\
    \ between A and E:\n1. `A -> B -> D -> E`\n2. `A -> C -> D -> E`\n3. `A -> C ->\
    \ E`\n\n### Section 9.5: Detecting a cycle in a directed graph using Depth First\
    \ Traversal\nA cycle in a directed graph exists if there's a back edge discovered\
    \ during a DFS. A back edge is an edge from a node to itself or one of the ancestors\
    \ in a DFS tree. For a disconnected graph, we get a DFS forest, so you have to\
    \ iterate through all vertices in the graph to find disjoint DFS trees.\n\nC++\
    \ implementation:\n\n```cpp\n#include <iostream> \n#include <list>\n\nusing namespace\
    \ std;\n\n#define NUM_V 4\nbool helper(list< int > *graph, int u, bool * visited,\
    \ bool * recStack) {\n    visited[u]= true ;\n    recStack[u]= true ;\n    list<\
    \ int > :: iterator i;\n    for (i = graph[u].begin (); i!= graph[u].end (); ++i)\
    \ {\n        if (recStack[*i]) //if vertice v is found in recursion stack of this\
    \ DFS traversal return true ;\n        else if (*i== u) //if there's an edge from\
    \ the vertex to itself\n            return true ;\n        else if (!visited[*i])\n\
    \        { \n            if (helper(graph, *i, visited, recStack))\n         \
    \       return true ;\n        }\n    }\n    recStack[u]= false ;\n    return\
    \ false ;\n}\n\n/*\n/The wrapper function calls helper function on each vertices\
    \ which have not been visited. \nHelper function returns true if it detects a\
    \ back edge in the subgraph(tree) or false.\n*/\nbool isCyclic(list< int > *graph,\
    \ int V) {\n    bool visited[V]; //array to track vertices already visited\n \
    \   bool recStack[V]; //array to track vertices in recursion stack of the traversal.\n\
    \    for (int i = 0; i< V; i++)\n        visited[i]= false , recStack[i]= false\
    \ ; //initialize all vertices as not visited and not recursed\n    for (int u\
    \ = 0; u < V; u++) //Iteratively checks if every vertices have been visited \n\
    \        if (visited[u]== false )\n        { \n            if (helper(graph, u,\
    \ visited, recStack)) //checks if the DFS tree from the vertex contains a cycle\n\
    \                return true ;\n        }\n    }\n    return false ; \n}\n\n/*\n\
    Driver function */\nint main() {\n    list < int > * graph = new list< int > [NUM_V];\
    \ \n    graph[0].push_back (1);\n    graph[0].push_back (2);\n    graph[1].push_back\
    \ (2);\n    graph[2].push_back (0);\n    graph[2].push_back (3);\n    graph[3].push_back\
    \ (3);\n    bool res = isCyclic(graph, NUM_V); \n    cout << res<< endl;\n}\n\
    ```\nResult: As shown below, there are three back edges in the graph. One between\
    \ vertex 0 and 2; between vertice 0, 1, and 2; and vertex 3. Time complexity of\
    \ search is `O(V+E)` where `V` is the number of vertices and `E` is the number\
    \ of the edges.\n\n### Section 9.6: Thorup's algorithm\nThorup's algorithm for\
    \ single source shortest path for undirected graph has the time complexity `O(m)`,\
    \ lower than Dijkstra. Basic ideas are the following.\n\nThere are ways to find\
    \ the spanning tree in `O(m)` (not described here). You need to \"grow\" the spanning\
    \ tree from the shortest edge to the longest, and it would be a forest with several\
    \ connected components before fully grown.\n\n1. Select an integer `b` (`b>=2`)\
    \ and only consider the spanning forests with length limit `b^k`. Merge the components\
    \ which are exactly the same but with different `k`, and call the minimum `k`\
    \ the level of the component. Then logically make components into a tree. `u`\
    \ is the parent of `v` iff `u` is the smallest component distinct from `v` that\
    \ fully contains `v`. The root is the whole graph and the leaves are single vertices\
    \ in the original graph (with the level of infinity). The tree still has only\
    \ `O(n)` nodes.\n\n2. Maintain the distance of each component to the source (like\
    \ in Dijkstra's algorithm). The distance of a component with more than one vertices\
    \ is the minimum distance of its unexpanded children. Set the distance of the\
    \ source vertex to 0 and update the ancestors accordingly.\n\n3. Consider the\
    \ distances in base `b`. When visiting a node in level `k` the first time, put\
    \ its children into buckets shared by all nodes of level `k` (as in bucket sort,\
    \ replacing the heap in Dijkstra's algorithm) by the digit `k` and higher of its\
    \ distance. Each time visiting a node, consider only its first `b` buckets, visit\
    \ and remove each of them, update the distance of the current node, and relink\
    \ the current node to its own parent using the new distance and wait for the next\
    \ visit for the following buckets.\n\nWhen a leaf is visited, the current distance\
    \ is the final distance of the vertex. Expand all edges from it in the original\
    \ graph and update the distances accordingly. Visit the root node (whole graph)\
    \ repeatedly until the destination is reached.\n\n### Chapter 10: Graph Traversals\n\
    ### Section 10.1: Depth First Search traversal function\nThe function takes the\
    \ argument of the current node index, adjacency list (stored in vector of vectors\
    \ in this example), and vector of boolean to keep track of which node has been\
    \ visited.\n\n```cpp\nvoid dfs( int node, vector< vector< int>>* graph, vector<\
    \ bool>* visited) {\n    // check whether node has been visited before\n    if\
    \ ((* visited)[ node])\n        return ;\n\n    // set as visited to avoid visiting\
    \ the same node twice\n    (* visited)[ node] = true ;\n\n    // perform some\
    \ action here\n    cout << node;\n\n    // traverse to the adjacent nodes in depth-first\
    \ manner\n    for ( int i = 0 ; i < (* graph)[ node] .size (); ++ i)\n}\n```\n"
