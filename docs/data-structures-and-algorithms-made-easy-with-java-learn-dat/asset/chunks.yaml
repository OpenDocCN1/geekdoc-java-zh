    \ )\n    pre_order_print( root.r_child )\n```\n\n![](rsrc2EZ.jpg)\n\n## Section\
    \ 5.2: Binary Search Tree - Deletion (C++)\n\nBefore starting with deletion I\
    \ just want to put some lights on what is a Binary search tree(BST), Each node\
    \ in a BST can have maximum of two nodes(left and right child). The left sub-tree\
    \ of a node has a key less than or equal to its parent node's key. The right sub-tree\
    \ of a node has a key greater than to its parent node's key. Deleting a node in\
    \ a tree while maintaining its Binary search tree property.\n\n![](rsrc2F0.jpg)\
    \ There are three cases to be considered while deleting a node.\n\n- **Case 1**:\
    \ Node to be deleted is the leaf node. (Node with value 22).\n- **Case 2**: Node\
    \ to be deleted has one child. (Node with value 26).\n- **Case 3**: Node to be\
    \ deleted has both children. (Node with value 49).\n\n**Explanation of cases:**\n\
    1. When the node to be deleted is a leaf node then simply delete the node and\
    \ pass `nullptr` to its parent node.\n2. When a node to be deleted is having only\
    \ one child then copy the child value to the node value and delete the child (Converted\
    \ to case 1).\n3. When a node to be delete is having two childs then the minimum\
    \ from its right sub tree can be copied to the node and then the minimum value\
    \ can be deleted from the node's right subtree (Converted to Case 2).\n\n**Note**:\
    \ The minimum in the right sub tree can have a maximum of one child and that too\
    \ right child if it's having the left child that means it's not the minimum value\
    \ or it's not following BST property.\n\nThe structure of a node in a tree and\
    \ the code for Deletion:\n\n```cpp\nstruct node {\n    int data;\n    node * left,\
    \ * right;\n};\n\nnode * delete_node( node * root, int data) {\n    if ( root\
    \ == nullptr) return root;\n    else if ( data < root-> data ) root-> left = delete_node(\
    \ root-> left, data); \n    else if ( data > root-> data ) root-> right = delete_node(\
    \ root-> right, data);\n    else {\n        if ( root-> left == nullptr && root->\
    \ right == nullptr) // Case 1\n            free( root);\n            root = nullptr;\n\
    \        }\n        else if ( root-> left == nullptr) // Case 2\n            node*\
    \ temp = root;\n            root= root-> right;\n            free( temp);\n  \
    \      }\n        else if ( root-> right == nullptr) // Case 2\n            node*\
    \ temp = root;\n            root = root-> left;\n            free( temp);\n  \
    \      }\n        else // Case 3\n            node* temp = root-> right;\n   \
