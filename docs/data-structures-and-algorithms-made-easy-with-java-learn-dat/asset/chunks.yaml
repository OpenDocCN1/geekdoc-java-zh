    \ means finishing time . Our pesudo-code will look like:\n\n```text\nProcedure\
    \ DFS ( G):\n    for each node u in V[ G]\n        color[ u] := white\n      \
    \  parent[ u ] := NULL\n    end for\n    time := 0\n    for each node u in V[\
    \ G]\n        if color[ u] == white\n            DFS- Visit( u)\n    end\n\nProcedure\
    \ DFS - Visit( u):\n    color[ u] := gray\n    time := time + 1\n    d[ u] :=\
    \ time\n    for each node v adjacent to u\n        if color[ v] == white\n   \
    \         parent[ v] := u\n            DFS- Visit( v)\n    end for\n    color[\
    \ u] := black\n    time := time + 1\n    f[ u] := time\n```\n\nComplexity: Each\
    \ nodes and edges are visited once. So the complexity of DFS is `O(V+E)`, where\
    \ `V` denotes nodes and `E` denotes edges.\n\nApplications of Depth First Search:\n\
    - Finding all shortest path in an undirected graph.\n- Detecting cycle in a graph.\n\
    - Topological Sort.\n- Finding Strongly Component.\n\n# Chapter 43: Hash Functions\n\
    \n## Section 43.1: Hash codes for common types\n\nThe hash codes produced by `GetHashCode()`\
    \ method for built-in and common types from the `System` namespace are shown below.\n\
    \n- `Boolean`: 1 if value is true, 0 otherwise.\n- `Byte`, `UInt16`, `Int32`,\
