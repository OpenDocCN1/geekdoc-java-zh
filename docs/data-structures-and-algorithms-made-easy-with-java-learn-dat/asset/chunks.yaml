    \ data = temp-> data;\n            root-> right = delete_node( root-> right, temp->\
    \ data);\n    }\n    return root;\n}\n```\n\nTime complexity of above code is\
    \ `O(h)`, where `h` is the height of the tree.\n\n## Section 5.3: Lowest common\
