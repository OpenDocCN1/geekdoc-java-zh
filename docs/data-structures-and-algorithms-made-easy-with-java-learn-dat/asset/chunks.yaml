    - either we take the character, or we don''t. So if the length of the string is
    n , there are 2n subsequences of that string.Longest Common Subsequence:As the
    name suggest, of all the common subsequencesbetween two strings, the longest common
    subsequence(LCS) is the one with the maximum length. For example: The common subsequences
