    5\. go to next activity if exist, if not exist terminate .


    6\. if start_time of current activity <= end_time : perform the activity and go
    to 4


    7\. else: got to 5.see here for coding help http://www.geeksforgeeks.org/greedy-algorithms-set-1-activity-selection-problem/Section
    17.3: Change-making problemGiven a money system, is it possible to give an amount
    of coins and how to ﬁnd a minimal set of coins corresponding to this amount.Canonical
    money systems. For some money system, like the ones we use in the real life, the
    "intuitive" solution works perfectly. For example, if the diﬀerent euro coins
    and bills (excluding cents) are 1€, 2€, 5€, 10€, giving the highest coin or bill
    until we reach the amount and repeating this procedure will lead to the minimal
    set of coins.We can do that recursively with OCaml :


    (* assuming the money system is sorted in decreasing order *)


    let change_make money_system amount =


    let rec loop given amount =if amount = 0 then given


    else


    (* we find the first value smaller or equal to the remaining amount *)


    let coin = List .find ((>=) amount) money_system in


    loop ( coin:: given) ( amount - coin)


    in loop [] amountThese systems are made so that change-making is easy. The problem
    gets harder when it comes to arbitrary money system.General case. How to give
    99€ with coins of 10€, 7€ and 5€? Here, giving coins of 10€ until we are left
    with 9€ leads obviously to no solution. Worse than that a solution may not exist.
    This problem is in fact np-hard, but acceptable solutions mixing greediness and
    memoization exist. The idea is to explore all the possibilies and pick the one
    with the minimal number of coins.To give an amount X > 0, we choose a piece P
    in the money system, and then solve the sub-problem corresponding to X-P. We try
    this for all the pieces of the system. The solution, if it exists, is then the
    smallest path that led to 0.


    Here an OCaml recursive function corresponding to this method. It returns None,
    if no solution exists.(* option utilities *)


    let optmin x y =


    match x,y with


    | None,a | a,None -> a


    | Some x, Some y-> Some ( min x y)let optsucc = function | Some x -> Some ( x+
    1 ) | None -> None(* Change- making problem*)


    let change_make money_system amount =


    let rec loop n =let onepiece acc piece =


    match n - piece with


    | 0 -> (* problem solved with one coin*)Some 1


    | x -> if x < 0 then


    (* we don''t reach 0, we discard this solution*)


    Noneelse


    (*we search the smallest path different to None with the remaining pieces*) optmin
    (optsucc (loop x)) accin


    (*we call onepiece forall the pieces*)


    List.fold_left onepiece None money_systemin loop amount


    Note : We can remark that this procedure may compute several times the change
    set for the same value. In practice, using memoization to avoid these repetitions
    leads to faster (way faster) results.Chapter 18: Applications of Greedy techniqueSection
    18.1: O☐ine CachingThe caching problem arises from the limitation of ﬁnite space.
    Lets assume our cache C has k pages. Now we want to process a sequence of m item
    requests which must have been placed in the cache before they are processed.Of
    course if m<= k then we just put all elements in the cache and it will work, but
    usually is m>> k.We say a request is a cache hit , when the item is already in
    cache, otherwise its called a cache miss . In that case we must bring the requested
    item into cache and evict another, assuming the cache is full. The Goal is a eviction
    schedule that minimizes the number of evictions .There are numerous greedy strategies
    for this problem, lets look at some:1\. First in, ﬁrst out (FIFO) : The oldest
    page gets evicted


    2\. Last in, ﬁrst out (LIFO) : The newest page gets evicted


    3\. Last recent out (LRU) : Evict page whose most recent access was earliest


    4\. Least frequently requested(LFU) : Evict page that was least frequently requested


    5\. Longest forward distance (LFD) : Evict page in the cache that is not requested
    until farthest in the future.Attention: For the following examples we evict the
    page with the smallest index, if more than one page could be evicted.


    Example (FIFO)


    Let the cache size be k= 3 the initial cache a,b,c and the request a,a,d,e,b,b,a,c,f,d,e,a,f,b,e,c:Request
    a a d e b b a c f d e a f b e c


    cache 1 a a d d d d a a a d d d f f f c


    cache 2 b b b e e e e c c c e e e b b b


    cache 3 c c c c b b b b f f f a a a e ecache miss x x x x x x x x x x x x x'
