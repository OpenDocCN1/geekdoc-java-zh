    ```


    在这里，每一行和每一列代表了：如果我们取该行和该列的字符并加上它们之前的前缀，两个字符串之间最长公共子序列的长度。例如：`Table[2][3]` 代表 `"ac"`
    和 `"abc"` 之间最长公共子序列的长度。第 0 列代表 `s1` 的空子序列。同样，第 0 行代表 `s2` 的空子序列。如果我们取一个字符串的空子序列并尝试与另一个字符串匹配，无论如何，行和第
    0 列都为 0。我们得到：


