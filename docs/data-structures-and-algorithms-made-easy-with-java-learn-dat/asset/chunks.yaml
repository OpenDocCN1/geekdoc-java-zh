    \        # ... logic for post-order ...\n```\n*(Note: The provided text for the\
    \ Python implementation was incomplete; the structure is preserved based on the\
    \ input).*\n\n## Chapter 6: Check if a tree is BST\n\n### Section 6.1: Algorithm\
    \ to check if a given binary tree is BST\n\nA binary tree is BST if it satis any\
    \ one of the following condition:\n1. It is empty.\n2. It has no subtrees.\n3.\
    \ For every node `x`, all keys (if any) in the left subtree must be less than\
    \ `x` and all keys (if any) in the right subtree must be greater than `x`.\n\n\
    A straightforward but ineffcient approach is to do inorder traversal. If the inorder\
    \ traversal produces a sorted sequence of keys then the given tree is a BST. To\
