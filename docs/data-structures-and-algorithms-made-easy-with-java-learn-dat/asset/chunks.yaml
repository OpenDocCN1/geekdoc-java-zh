    vertex to the first


    if current < minimum < Update minimum if necessary


    minimum = current


    output minimum


    Time Complexity


    There are N! permutations to go through and the cost of each path is calculated
    in O( N) , thus this algorithm takes O( N * N!) time to output the exact answer.Section
    44.2: Dynamic Programming AlgorithmNotice that if we consider the path (in order):


