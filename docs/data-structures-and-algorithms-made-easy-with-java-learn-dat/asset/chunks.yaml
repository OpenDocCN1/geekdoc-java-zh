  trans: "\n\n# 语音识别相关性功率分析\n\n## 第 55 章：快速傅里叶变换\n\n`DFT`（离散傅里叶变换）的实数和复数形式可对任何离散周期信号进行频率分析或合成。`FFT`（快速傅里叶变换）是\
    \ `DFT` 的一种实现，可以在现代 CPU 上快速执行。\n\n### 第 55.1 节：基 2 FFT\n\n计算 `FFT` 最简单且可能最为人知的方法是基\
    \ 2 时域抽取算法（Radix-2 Decimation in Time）。基 2 FFT 通过将一个 `N` 点时域信号分解为 `N` 个时域信号来实现，每个信号由单个点组成。\n\
    \n![](img/rsrc2HK.jpg)\n\n信号分解（或“时域抽取”）通过对时域数据数组的索引进行位反转来实现。因此，对于一个十六点信号，样本 1（二进制\
    \ `0001`）与样本 8（`1000`）交换，样本 2（`0010`）与 4（`0100`）交换，以此类推。使用位反转技术进行样本交换可以在软件中轻松实现，但会将基\
    \ 2 FFT 的用途限制为长度 `N = 2^M` 的信号。\n\n时域中单点信号的值等于其在频域的值，因此这个分解后的单时域点数组不需要转换即可成为频域点数组。然而，这\
    \ `N` 个单点需要重建为一个 `N` 点频谱。完整频率频谱的最优重建是通过使用蝴蝶形计算（butterfly calculations）完成的。基 2\
    \ FFT 中的每个重建阶段都执行若干次双点蝴蝶计算，使用一组类似的指数权重函数 `Wn^R`。\n\n![](img/rsrc2HM.jpg)\n\n`FFT`\
    \ 通过利用 `Wn^R` 的周期性消除了离散傅里叶变换中的冗余计算。频谱重建通过 `log2(N)` 个阶段的蝴蝶形计算完成，得到 `X[K]`；即矩形形式的实部和虚部频域数据。要转换为幅度和相位（极坐标），需要找到绝对值\
    \ `√(Re2 + Im2)` 和幅角 `tan-1(Im/Re)`。\n\n![](img/rsrc2HN.jpg)\n\n下面展示了八点基 2 FFT\
    \ 的完整蝴蝶流程图。注意，输入信号已经按照前述概述的时域抽取程序进行了重新排序。\n\n![](img/rsrc2HP.jpg)\n\n`FFT` 通常对复数输入操作并产生复数输出。对于实数信号，可以将虚部设为零，实部设置为输入信号\
    \ `x[n]`，然而，涉及仅实数数据转换可以进行许多优化。在整个重建过程中使用的 `Wn^R` 的值可以通过指数权重方程确定。`R` 的值（指数权重幂）取决于频谱重建的当前阶段以及特定蝴蝶形计算中的当前计算。\n\
    \n### 代码示例 (C/C++)\n\n下面提供了一个计算基 2 FFT 的 C/C++ 代码示例。这是一个简单的实现，适用于任何 `N` 为 2 的幂的尺寸\
    \ `N`。它比最快的 FFTw 实现慢约 3 倍，但对于未来优化或学习该算法原理来说，仍然是一个非常好的基础。\n\n```cpp\n#include <math.h>\n\
    #define PI 3.1415926535897932384626433832795 // 用于正余弦计算的 PI\n#define TWOPI 6.283185307179586476925286766559\
    \ // 用于正余弦计算的 2*PI\n#define Deg2Rad 0.017453292519943295769236907684886 // 角度到弧度的因子\n\
    #define Rad2Deg 57.295779513082320876798154814105 // 弧度到角度因子\n#define log10_2\
    \ 0.30102999566398119521373889472449 // 2 的对 10\n\n#define log10_2_INV 3.3219280948873623478703194294948\
    \ // 1/Log10(2)\n\n// 复数变量结构（双精度）\nstruct complex\n{\npublic:double Re, Im; //\
    \ 终究没那么复杂\n};\n\n// 如果 N 是 2 的幂则返回 true\nbool isPwrTwo(int N, int *M)\n{\n   \
    \ *M = (int )ceil (log10 ((double )N) * log10_2_INV); // M 是需要执行的阶段数。2^M = N\n\
    \    int NN = (int )pow (2.0 , *M);\n    if ((NN != N) || (NN == 0)) // 检查 N 是否为\
    \ 2 的幂。返回 false\n    return true ;\n}\n\nvoid rad2FFT(int N, complex *x, complex\
    \ *DFT) {\n    int M = 0;\n    // 检查是否为 2 的幂。如果不是，则退出\n    if (!isPwrTwo(N, &M))\n\
    \        throw \"Rad2FFT(): N 必须是 2 的幂才能进行基 FFT\";\n\n    // 整数变量\n    int BSep;\n\
    \    int BWidth;\n    int P;\n    int j;\n    int stage = 1; // (1 到 M)\n    int\
    \ HiIndex;\n    // ... (逻辑继续)\n}\n```\n\n"
- fmt: "\n# Section 55.2: Radix 2 Inverse FFT\n\nDue to the strong duality of the\
    \ Fourier Transform, adjusting the output of a forward transform can produce the\
    \ inverse FFT. Data in the frequency domain can be converted to the time domain\
    \ by the following method:\n\n1. Find the complex conjugate of the frequency domain\
    \ data by inverting the imaginary component for all instances of `K`.\n2. Perform\
    \ the forward FFT on the conjugated frequency domain data.\n3. Divide each output\
    \ of the result of this FFT by `N` to give the true time domain value.\n4. Find\
    \ the complex conjugate of the output by inverting the imaginary component of\
    \ the time domain data for all instances of `n`.\n\n**Note**: both frequency and\
    \ time domain data are complex variables. Typically the imaginary component of\
    \ the time domain signal following an inverse FFT is either zero, or ignored as\
    \ rounding error. Increasing the precision of variables from 32-bit `float` to\
    \ 64-bit `double`, or 128-bit `long double` significantly reduces rounding errors\
    \ produced by several consecutive FFT operations.\n\n### Code Example (C/C++)\n\
    \n```cpp\n#include <math.h>\n#define PI 3.1415926535897932384626433832795 // PI\
    \ for sine/cos calculations\n#define TWOPI 6.283185307179586476925286766559 //\
    \ 2*PI for sine/cos calculations\n#define Deg2Rad 0.017453292519943295769236907684886\
    \ // Degrees to Radians factor\n#define Rad2Deg 57.295779513082320876798154814105\
    \ // Radians to Degrees factor\n#define log10_2 0.30102999566398119521373889472449\
    \ // Log10 of 2\n\n#define log10_2_INV 3.3219280948873623478703194294948 // 1/Log10(2)\n\
    \n// complex variable structure (double precision)\nstruct complex {\npublic:\n\
    \    double Re, Im; // Not so complicated after all\n};\n\nvoid rad2InverseFFT(int\
    \ N, complex *x, complex *DFT) {\n    // M is number of stages to perform. 2^M\
    \ = N\n    double Mx = (log10 ((double )N) / log10 ((double )2));\n    int a =\
    \ (int )(ceil (pow (2.0 , Mx)));\n    int status = 0;\n\n    if (a != N) // Check\
    \ N is a power of 2\n    {\n        x = 0;\n        DFT = 0;\n        throw \"\
    rad2InverseFFT(): N must be a power of 2 for Radix 2 Inverse FFT\";\n    }\n \
    \   complex *pDFT = DFT;\n    complex *pX = x;\n\n    // Reset vector for DFT\
    \ pointers\n    // Reset vector for x[n] pointer\n    double NN = 1 / (double\
    \ )N; // Scaling factor for the inverse FFT\n\n    for (int i = 0; i < N; i++,\
    \ DFT++) {\n        DFT-> Im *= 1; // Find the complex conjugate of the Frequency\
    \ Spectrum\n        DFT = pDFT; // Reset Freq Domain Pointer\n        rad2FFT(N,\
    \ DFT, x); // Calculate the forward FFT with variables switched (time & freq)\n\
    \    }\n    int i;\n    for ( i = 0, x = pX; i < N; i++, x++){\n        x-> Re\
    \ *= NN; // Divide time domain by N for correct amplitude scaling\n        x->\
    \ Im *= 1; // Change the sign of Im\n    }\n}\n```\n\n# Appendix A: Pseudocode\n\
    \n## Section A.1: Variable assignment\n\nYou could describe variable assignment\
    \ in different ways.\n\n**Typed:**\n```\nint a = 1\nint a := 1\nlet int a = 1\n\
    int a < 1\n```\n\n**No type:**\n```\na = 1\na := 1\nlet a = 1\na < 1\n```\n\n\
    ## Section A.2: Functions\n\nAs long as the function name, return statement and\
    \ parameters are clear, you're fine.\n\n```\ndef incr n\nreturn n + 1\n```\n\n\
    or\n\n```\nlet incr( n) = n + 1\n```\n\nor\n\n```\nfunction incr ( n) return n\
    \ + 1\n```\n\nare all quite clear, so you may use them. Try not to be ambiguous\
    \ with a variable assignment.\n"
