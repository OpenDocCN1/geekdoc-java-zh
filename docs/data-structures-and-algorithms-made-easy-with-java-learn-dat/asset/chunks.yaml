    # 第 20 章：Bellman–Ford 算法


    ## 第 20.1 节：单源最短路径算法（假设图中存在负环）


    在阅读此示例之前，需要对边松弛（edge-relaxation）有一个大致的了解。你可以从这里学习


    `Bellman-Ford Algorithm` 用于计算加权有向图中从单源顶点到所有其他顶点的最短路径。尽管它的运行速度比 `Dijkstra''s Algorithm`
    慢，但它可以在边权重为负数的情况下工作，并且还能找到图中负权环。`Dijkstra''s Algorithm` 的问题在于如果存在负环，你会不断地通过该循环并持续减小两个顶点之间的距离。


    该算法的思想是以某种随机顺序逐一遍历图中的所有边。可以是任何随机顺序。但你必须确保，如果 `u-v`（其中 `u` 和 `v` 是图中的两个顶点）是你的顺序之一，那么必须存在从
    `u` 到 `v` 的边。通常直接取于给定的顺序。再次，任何随机顺序都是有效的。


    选择顺序后，我们将根据松弛公式对边进行松弛。对于从 `u` 到 `v` 的给定边 `u-v`，松弛公式为：


    ```

    if distance[ u] + cost[ u][ v] < d[ v] d[ v] = d[ u] + cost[ u][ v]

    ```


    也就是说，如果从源到任何顶点 `u` 的距离 + 边 `u-v` 的权重小于源到另一个顶点 `v` 的距离，我们就更新从源到 `v` 的距离。我们需要最多松弛边
    `(V-1)` 次，其中 `V` 是图中边的数量。你问为什么是 `(V-1)`？我们将在另一个示例中解释。此外，我们还将跟踪任何顶点的父顶点，即当我们松弛一条边时，我们将设置：

    `parent[ v] = u`


    这意味着我们找到了另一个通过 `u` 到达 `v` 的更短路径。我们稍后需要此来打印从源到目标顶点的最短路径。


    让我们来看一个示例。我们有一个图：

    ![](img/rsrc2G8.jpg)


    我们选择了 `1` 作为源顶点。我们想要找到从源到所有其他顶点的最短路径。首先，`d[1] = 0`，因为它是源。其余的都是无穷大，因为我们还不知道它们的距离。


    我们将按照这个顺序松弛边：


    ```

    +--------+--------+--------+--------+--------+--------+--------+

    | 序号 | 1 | 2 | 3 | 4 | 5 | 6 |

    +--------+--------+--------+--------+--------+--------+--------+

    | 边 | 4->5 | 3->4 | 1->3 | 1->4 | 4->6 | 2->3 |

    +--------+--------+--------+--------+--------+--------+--------+

    ```


    你可以采取任何想要的序列。如果我们松弛一次边，我们会得到什么？我们得到使用最多 1 条边的从源到所有其他顶点的距离。现在让我们松弛边并更新 `d[]` 的值。我们得到：


    1. `d[4] + cost[4][5] = infinity + 7 = infinity` 。我们无法更新这一个。

    2. `d[2] + cost[3][4] = infinity` 。我们无法更新这一个。

    3. `d[1] + cost[1][3] = 0 + 2 = 2 < d[2]` 。所以 `d[3] = 2` 。同时 `parent[1] = 1` 。

    4. `d[1] + cost[1][4] = 4` 。所以 `d[4] = 4 < d[4]`（注：此处原文逻辑可能有误，应为小于 d[4]）。`parent[4]
    = 1` 。

    5. `d[4] + cost[4][6] = 9` 。 `d[6] = 9 < d[6]`（同上）。`parent[6] = 4` 。

    6. `d[2] + cost[2][3] = infinity` 。我们无法更新这一个。


    我们无法更新某些顶点，因为 `d[u] + cost[u][v] < d[v]` 条件不成立。


    [/content]


    ## 第 20.2 节：在图中检测负环


    为了理解这个示例，建议对 Bellman-Ford 算法有一个大致的了解，可以在这里找到


    使用 Bellman-Ford 算法，我们可以检测图中是否存在负环。我们知道，为了找到最短路径，我们需要松弛图中所有的边 `(V-1)` 次，其中 `V`
    是图中顶点的数量。我们已经在这个示例中看到，在 `(V-1)` 次迭代之后，无论进行多少次迭代，都无法更新 `d[]`。真的吗？


    如果图中存在负环，即使在 `(V-1)` 次迭代之后，我们也可以更新 `d[]`。这是对于每次迭代，遍历负环总是会降低路径的成本。


    让我们假设我们有一个图：


    ![](img/rsrc2GC.jpg)


    让我们选择顶点 1 作为源。将 Bellman-Ford 单源最短路径算法应用于该图后，我们将找到从源到所有其他顶点的距离。


