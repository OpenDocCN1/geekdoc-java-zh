    \ v)\nend while\n```\n`key[]` 存储节点的最小成本。`parent[]` 用于存储父节点，便于遍历和打印树。下面是一个简单的 Java\
    \ 程序：\n\n```java\nimport java.util.*;\nclass Graph {\n    static int infinite\
