    \ ≤ `x` by iterating through the array, assigning to each `C[x]` the sum of its\
    \ prior value and all values in `C` that come before it.\n\n## 4. Iterate backwards\
    \ through `A`, placing each value in to a new sorted array `B` at the index recorded\
