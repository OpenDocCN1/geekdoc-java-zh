  trans: "\n证明：（反证法）假设 `S*` 是逆序对最少的最优调度。我们可以假设 `S*` 没有空闲时间。如果 `S*` 没有逆序，则 `S= S*`，我们完成了证明。如果\
    \ `S*` 有逆序，则它存在一个相邻逆序。最后一个命题指出，我们可以交换相邻逆序，在不增加延迟的情况下，但减少逆序对的数量。这与 `S*` 的定义矛盾。最小延迟问题及其密切相关的最小跨度问题（其中要求寻找最小调度方案）在现实世界中有许多应用。但通常你不仅只有一台机器，而是有多许多机器，而且它们以不同的速率处理相同的任务。这些问题会迅速变成\
    \ NP 完全。如果我们不看离线问题（即我们拥有所有的任务和数据），而是看在线变体（任务在执行期间出现），会出现另一个有趣的问题。\n\n# 第 19 章：Prim\
    \ 算法\n\n## 第 19.1 节：Prim 算法简介\n\n假设我们有 8 栋房子。我们想在这些房屋之间建立电话线。房屋之间的边代表在两栋房屋之间设线的成本。\n\
    \n![](img/rsrc2G1.jpg) 我们的任务是这样设置线路，使得所有房屋都连接起来，并且建立整个连接的成本最低。现在我们如何找到它呢？可以使用\
    \ Prim 算法。Prim 算法是一种贪心算法，用于寻找加权无向图的最小生成树。这意味着它找到边的子集，形成一个包含每个节点的树，其中树中所有边的总权重最小化。该算法由捷克数学家\
    \ Vojtěch Jarník 在 1930 年开发，后来由计算机科学家 Robert Clay Prim 在 1957 年以及 Edsger Wybe\
    \ Dijkstra 在 1959 年重新发现并重新出版。它也被称为 DJP 算法、Jarnik 算法、Prim-Jarnik 算法或 Prim-Dijsktra\
    \ 算法。现在让我们先看技术术语。如果我们使用无向图 `G` 的某些节点和边创建一个图 `S`，那么 `S` 被称为图 `G` 的子图。当且仅当满足以下条件时，`S`\
    \ 被称为生成树（Spanning Tree）：\n\n- 它包含 `G` 的所有节点。\n- 它是一棵树，这意味着没有环且所有节点都是连接的。\n- 树中有\
    \ `(n-1)` 条边，其中 `n` 是 `G` 中的节点数量。一个图可以有很多棵生成树。加权无向图的最小生成树是一棵树，使得边权重之和为最小。现在我们将使用\
    \ Prim 算法来寻找最小生成树，即如何在我们的示例图中设置电话线，使得设置成本最低。首先，我们选择一个源节点。假设 `node-1` 是我们的源节点。现在我们将从\
    \ `node-1` 出发且成本最小的边添加到我们的子图中。在这里，我们用蓝色标记子图中的边。这里 `1-5` 是我们需要的边。\n\n![](img/rsrc2G2.jpg)\
    \ 现在我们考虑来自 `node-1` 和 `node-5` 的所有边并取最小。由于 `1-5` 已经被标记，我们\n\n![](img/rsrc2G3.jpg)\
    \ 取了 `1-2`。这次，我们考虑 `node-1`、`node-2` 和 `node-5` 并取最小边，即 `5-4`![](img/rsrc2G4.jpg)\
    \ 下一步非常重要。从 `node-1`、`node-2`、`node-5` 和 `node-4` 中，最小边是 `2-4`。但如果我们选择它，它会在我们的子图中创建一个环。这是因为\
    \ `node-2` 和 `node-4` 已经在我们的子图中了。所以取边 `2-4` 对我们没有处。我们将以这种方式选择边，为我们的子图添加新节点。因此我们![](img/rsrc2G5.jpg)\
    \ 选择了边 `4-8`。\n\n如果我们继续这样下去，我们将选择边 `8-6`、`6-7` 和 `4-3`。我们的子图看起来像这样：\n\n![](img/rsrc2G6.jpg)\
    \ 这是我们需要的子图，它将为我们提供最小生成树。如果我们移除我们没有\n\n![](img/rsrc2G7.jpg) 选择的边，我们就会得到：这就是我们的最小生成树\
    \ (MST)。因此，建立电话连接的成本为：`4 + 2 + 5 + 11 + 9 + 2 + 1 = 34`。房屋集合及其连接关系如图所示。一个图可以有多棵\
    \ MST。这取决于我们选择的源节点。该算法的伪代码如下：\n\n```\nProcedure PrimsMST( Graph): // 这里 Graph\
    \ 是非空连通加权图\nVnew[] = { x} // 源节点 x 的新子图\nEnew [] = {}\n\nwhile Vnew is not equal\
