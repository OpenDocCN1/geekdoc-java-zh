  trans: "\n\n## 常见的稳定排序\n- `归并排序`\n- `插入排序`\n- `基数排序`\n- `Tim sort`\n- `冒泡排序`\n\n\
    ## 常见的不稳定排序\n- `堆排序`\n- `快速排序`\n\n## 第 29 章：冒泡排序\n| 参数 | 描述 |\n| :--- | :--- |\n\
    | 稳定性 | 是 |\n| 原地排序 | 是 |\n| 最佳情况复杂度 | `O(n)` |\n| 平均情况复杂度 | `O(n²)` |\n| 最坏情况复杂度\
    \ | `O(n²)` |\n| 空间复杂度 | `O(1)` |\n\n### 第 29.1 节：冒泡排序\n`BubbleSort` 比较无序列表中每个相邻的元素，如果它们的顺序不对，则反转这些元素。\n\
    \n以下示例演示了对列表 `{ 6 , 5 , 3 , 1 , 8 , 7 , 2 , 4 }` 所示冒泡排序（每一步中比较的元素对封装在 '**' 中）：`{\
    \ 6 ,5 ,3 ,1 ,8 ,7 ,2 ,4 }`\n\n- `{** 5 ,6 ** ,3 ,1 ,8 ,7 ,2 ,4 }` - `5 < 6` ->\
    \ 交换 `{ 5 ,** 3 ,6 ** ,1 ,8 ,7 ,2 ,4 }` - `3 < 6` -> 交换 `{ 5 ,3 ,** 1 ,6 ** ,8\
    \ ,7 ,2 ,4 }` - `1 < 6` -> 交换 `{ 5 ,3 ,1 ,** 6 ,8 ** ,7 ,2 ,4 }` - `8 > 6` ->\
    \ 不交换 `{ 5 ,3 ,1 ,6 ,** 7 ,8 ** ,2 ,4 }` - `7 < 8` -> 交换 `{ 5 ,3 ,1 ,6 ,7 ,**\
    \ 2 ,8 ** ,4 }` - `2 < 8` -> 交换 `{ 5 ,3 ,1 ,6 ,7 ,2 ,** 4 ,8 **}` - `4 < 8` ->\
    \ 交换\n\n在遍历列表一次后，我们得到了 `{ 5 ,3 ,1 ,6 ,7 ,2 ,4 ,8 }`。注意，数组中未排序的最大值（在此例中为 `8`）将始终到达最终位置。因此，为了确保列表有序，对于长度为\
    \ `n` 的列表，我们需要遍历 `n-1` 次。\n图示：![](img/rsrc2GT.jpg)\n\n### 第 29.2 节：C & C++ 中的实现\n\
    C++ 中 `BubbleSort` 的示例实现：\n\n```cpp\nvoid bubbleSort( vector< int> numbers)\n\
    {\n  for ( int i = numbers.size () - 1 ; i >= 0 ; i--) {\n    for ( int j = 1\
    \ ; j <= i; j++) {\n      if ( numbers[ j-1 ] > numbers[ j]) {\n        swap(\
    \ numbers[ j - 1 ] ,numbers( j));\n      }\n    }\n  }\n}\n```\n\nC 实现\n```c\n\
    void bubble_sort( long list[] , long n) {\n  long c, d, t;\n  for ( c = 0 ; c\
    \ < ( n - 1 ); c++) {\n    for ( d = 0 ; d < n - c - 1 ; d++) {\n      if ( list[\
    \ d] > list[ d + 1 ]) {\n        /* Swapping */\n        t = list[ d ];\n    \
    \    list[ d] = list[ d + 1 ];\n        list[ d + 1 ] = t;\n      }\n    }\n \
    \ }\n}\n```\n\n带指针的冒泡排序\n```c\nvoid pointer_bubble_sort( long * list, long n)\
    \ {\n  long c, d, t;\n  for ( c = 0 ; c < ( n - 1 ); c++) {\n    for ( d = 0 ;\
    \ d < n - c - 1 ; d++) {\n      if ( * ( list + d ) > *( list+ d+ 1 )) {\n   \
    \     /* Swapping */\n        t = * ( list + d );\n        * ( list + d ) = *\
    \ ( list + d + 1 );\n        * ( list + d + 1 ) = t;\n      }\n    }\n  }\n}\n\
    ```\n\n### 第 29.3 节：C# 中的实现\n冒泡排序也称为 `Sinking Sort`（下沉排序）。它是一种简单的排序算法，通过重复遍历待排序的列表，比较每对相邻项，如果它们的顺序错误，则进行交换。\n\
    冒泡排序示例![](img/rsrc2GU.jpg)\n\n冒泡排序的实现\n我使用 C# 语言实现了冒泡排序算法：\n```csharp\npublic\
    \ class BubbleSort\n{\n  public static void SortBubble( int [] input) {\n    for\
    \ ( var i = input.Length - 1 ; i >= 0 ; i--) {\n      for ( var j = input.Length\
    \ - 1 ; j >= 0 ; j--) {\n        if ( input[ j] <= input[ j + 1 ]) continue ;\n\
    \        var temp = input[ j + 1 ];\n        input[ j + 1 ] = input[ j];\n   \
    \     input[ j] = temp;\n      }\n    }\n  }\n  public static int [] Main( int\
    \ [] input) {\n    SortBubble( input);\n    return input;\n  }\n}\n```\n\n###\
    \ 第 29.4 节：Python 实现\n```python\n#!/usr/bin/python\ninput_list = [10 , 1 , 2 ,\
