    \ that we select to relax the edges.\n\nLet's take a look at an example:\n\n![](rsrc2GE.jpg)Here,\
    \ the source vertex is 1. We will find out the shortest distance between the source\
    \ and all the other vertices. We can clearly see that, to reach vertex 4, in the\
    \ worst case, it'll take `(V-1)` edges. Now depending on the order in which the\
    \ edges are discovered, it might take `(V-1)` times to discover vertex 4. Didn't\
