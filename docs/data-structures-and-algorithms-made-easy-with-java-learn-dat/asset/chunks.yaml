    \ Our pseudo-code will be:\n\n```\nProcedure DTW ( Sample, Test):\n    n := Sample.length\n\
    \    m := Test.length\n    Create Table[ n + 1 ][ m + 1 ]\n    for i from 1 to\
    \ n\n        Table[ i][ 0 ] := infinity\n    end for\n    for i from 1 to m\n\
    \        Table[ 0 ][ i ] := infinity\n    end for\n    Table[ 0 ][ 0 ] := 0\n\
    \    for i from 1 to n\n        for j from 1 to m\n            Table[ i][ j] :=\
    \ d( Sample[ i ] , Test[ j]) + minimum( Table[ i- 1 ][ j-1 ] , // match\n    \
    \        Table[ i][ j-1 ] , // insertion\n            Table[ i- 1 ][ j] ) // deletion\n\
    \        end for\n    end for\n    Return Table[ n + 1 ][ m + 1 ]\n```\n\nWe can\
    \ also add a locality constraint. That is, we require that if `Sample[ i]` is\
