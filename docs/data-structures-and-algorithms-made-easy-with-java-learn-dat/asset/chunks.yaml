    \ LCS。此伪代码没有考虑这种情况。你必须递归地解决它以找到多个 LCS。该算法的时间复杂度为：`O(max(m, n))`。\n\n# 第 48 章：最长递子序列\n\
    \n## 第 48.1 节：最长递子序列基础信息\n\n最长递子序列问题是从给定的输入序列中找到一个子序列，该子序列的元素按从低到高的顺序排列。子序列不是连续的或唯一的。\n\
    \n### 最长递子序列的应用：\n如最长递子序列、最长公共子序列等算法被用于 Git 等版本控制系统。\n\n算法的简单形式：\n1. 找到两个文档共有的唯一行。\n\
    2. 从第一个文档提取所有此类行，并根据它们在第二个文档中出现的顺序进行排序。\n3. 计算这些行的 LIS（最长递子序列）。\n4. 考虑行之间的匹配。\n\
    \n最长递子序列的算法：\n1. 描述一个数组来计算结果。\n2. 对于 `1 <= i <= n`，`A(i)` 是递增子序列的长度。\n3. 递归：对于\
    \ `1 <= i <= n`，`A(i) = 1 + max(A(j))`，其中 `j < i` 且 `input[j] < input[i]`。\n4.\
    \ 输出结果。\n\n迭代算法：\n```\nfor i = 1 to n:\n  L[i] = 1\n  for j = 1 to i-1\n    if\
    \ input[j] < input[i]\n      L[i] = max(L[i], L[j] + 1)\n```\n该算法的时间复杂度为 `O(n²)`。辅助空间：`O(n)`。\n\
    \n让我们输入 `{0, 8, 4, 12, 2, 10, 6, 14, 1, 9, 5, 13, 3, 11, 7}`。因此，输入的最长递子序列为 `{0,\
    \ 2, 6, 9, 11}`。\n\n# 第 49 章：检查两个字符串是否为异位词\n\n具有相同字符集合的字符串被称为异位词。我在这里使用了 JavaScript。\n\
    \n我们将为 `str1` 创建一个哈希并增加计数 `+1`。我们将遍历第二个字符串并检查所有字符是否都在哈希中，减少哈希键的值。所有哈希键的值均为零则为异位词。\n\
    \n## 第 49.1 节：示例输入和输出\n例 1：\n```javascript\nlet str1 = 'stackoverflow';\nlet str2\
    \ = 'flowerovstack';\n```\n这些字符串是异位词。\n\n```javascript\n// 从 str1 创建哈希并增加计数。\n\
    hashMap = {\ns: 1,\nt: 1,\na: 1,\nc: 1,\nk: 1,\no: 2,\nv: 1,\ne: 1,\nr: 1,\nf:\
    \ 1,\nl: 1,\nw: 1\n}\n```\n你可以看到哈键 `'o'` 包含值 2，因为 o 在字符串中出现了 2 次。\n\n现在遍历 str2\
    \ 并检查每个字符是否在 hashMap 中，如果是，减少 hashMap 键的值，否则返回 false（这表示不是异位词）。\n```javascript\n\
    hashMap = {\ns: 0,\nt: 0,\na: 0,\nc: 0,\nk: 0,\no: 0,\nv: 0,\ne: 0,\nr: 0,\nf:\
    \ 0,\nl: 0,\nw: 0\n}\n```\n"
- fmt: "\nNow, loop over `hashMap` object and check all values are zero in the key\
    \ of `hashMap`. In our case all values are zero so its a anagram.\n\n## Section\
    \ 49.2: Generic Code for Anagrams\n\n```javascript\nfunction(){\n\n  var hashMap\
    \ = {};\n\n  function isAnagram ( str1, str2) {\n    if ( str1.length !== str2.length\
    \ ){\n      return false ;\n    }\n    // Create hash map of str1 character and\
    \ increase value one (+1). \n    createStr1HashMap( str1);\n\n    // Check str2\
    \ character are key in hash map and decrease value by one(-1); \n    var valueExist\
    \ = createStr2HashMap( str2);\n\n    // Check all value of hashMap keys are zero,\
    \ so it will be anagram. \n    return isStringsAnagram( valueExist);\n  }\n\n\
    \  function createStr1HashMap ( str1) {\n    [] .map .call ( str1, function( value,\
    \ index, array){\n      hashMap[ value] = value in hashMap ? ( hashMap[ value]\
    \ + 1 ) : 1 ; return value;});\n    \n  }\n\n  function createStr2HashMap ( str2)\
    \ {\n    var valueExist = [] .every .call ( str2, function( value, index, array){\n\
    \      if ( value in hashMap) {\n        hashMap [ value] = hashMap[ value] 1\
    \ ;\n      }\n      return value in hashMap;});\n    return valueExist;\n  }\n\
    \n  function isStringsAnagram ( valueExist) {\n    if (! valueExist) {\n     \
    \ return valueExist;\n    } else {\n      var isAnagram;\n      for ( var i in\
    \ hashMap) {\n        if ( hashMap[ i] !== 0 ) {\n          isAnagram = false\
    \ ;\n          break ;\n        } else {\n          isAnagram = true ;\n     \
    \   }\n      }\n      return isAnagram;\n    }\n  }\n\n  isAnagram( 'stackoverflow'\
    \ , 'flowerovstack' ); // true\n  isAnagram( 'stackoverflow' , 'flowervvstack'\
    \ ); // false\n\n})();\n```\n\nTime complexity: `3n` i.e `O(n)`.\n\n## Chapter\
    \ 50: Pascal's Triangle\n\n### Section 50.1: Pascal triangle in C\n\n```c\nint\
    \ i, space, rows, k= 0 , count = 0 , count1 = 0 ;\n\nrow= 5 ;\n\nfor ( i= 1 ;\
    \ i<= rows; ++ i) {\n  for ( space= 1 ; space <= rows- i; ++ space) {\n    printf(\
    \ \" \" ); ++ count;\n  }\n  while ( k != 2 * i- 1 ) {\n    if ( count <= rows-\
    \ 1 ) {\n      printf( \"%d \" , i+ k); ++ count;\n    }\n    else {\n      ++\
    \ count1;\n      printf( \"%d \" , ( i+ k- 2 * count1)); \n    }\n    ++ k;\n\
    \  }\n  count1 = count = k = 0 ;\n  printf( \" \\n \" ); \n}\n```\n\nOutput1\n\
    ```\n2 3 2\n3 4 5 4 3\n4 5 6 7 6 5 4 5 6 7 8 9 8 7 6 5\n```\n\n## Chapter 51:\
    \ Algo:- Print a m*n matrix in square wise\n\nCheck sample input and output below.\n\
    \n### Section 51.1: Sample Example\n\nInput:\n```14 15 16 17 18 21\n19 10 20 11\
    \ 54 36\n64 55 44 23 80 39\n91 92 93 94 95 42\n```\n\nOutput:\nprint value in\
    \ index\n```\n14 15 16 17 18 21 36 39 42 95 94 93 92 91 64 19 10 20 11 54 80 23\
    \ 44 55\n```\nor print index\n```\n00 01 02 03 04 05 15 25 35 34 33 32 31 30 20\
    \ 10 11 12 13 14 24 23 22 21\n```\n\n### Section 51.2: Write the generic code\n\
    \n```javascript\nfunction noOfLooping( m,n) {\n  if ( m > n ) {\n    smallestValue\
    \ = n;\n  } else {\n    smallestValue = m;\n  }\n  if ( smallestValue % 2 == 0\
    \ ) {\n    return smallestValue/ 2 ;\n  } else {\n    return ( smallestValue+\
    \ 1 )/ 2 ;\n  }\n}\n\nfunction squarePrint ( m,n) {\n  var looping = noOfLooping(\
    \ m,n);\n  for ( var i = 0 ; i < looping; i++) {\n    for ( var j = i; j < m -\
    \ 1 i; j++) {\n      console.log ( i+ '' + j);\n    }\n    for ( var k = i; k\
    \ < n - 1 i; k++) {\n      console.log ( k+ '' + j);\n    }\n    for ( var l =\
    \ j; l > i; l--) {\n      console.log ( k+ '' + l);\n    }\n    for ( var x =\
    \ k; x > i; x--) {\n      console.log ( x+ '' + l);\n    }\n  }\n}\n\nsquarePrint(\
    \ 6 ,4 );\n```\n\n## Chapter 52: Matrix Exponentiation\n\n### Section 52.1: Matrix\
    \ Exponentiation to Solve Example Problems\n\nFind `f(n)`: nth Fibonacci number.\
    \ The problem is quite easy when `n` is relatively small. We can use simple recursion,\
    \ `f( n) = f( n - 1 ) + f( n - 2 )`, or we can use dynamic programming approach\
    \ to avoid the calculation of same function over and over again. But what will\
    \ you do if the problem says, `0 < n < 10⁹`, find `f(n)`? Dynamic programming\
    \ will fail, so how do we tackle this problem? Let's see how matrix exponentiation\
    \ can help represent recursive relation.\n\n#### Prerequisites:\n- Given two matrices,\
    \ know how find their product.\n- Given the product matrix of two matrices, and\
    \ one of them, know how find the other matrix.\n- Given a matrix of size `d`,\
    \ know how find its `nth` power in `O(d³log(n))`.\n\n#### Patterns:\nFirst we\
    \ need a recursive relation and want to find a matrix `M` which can lead us to\
    \ the desired state from a set of already states. Let's assume that we know the\
    \ `k` states of a recurrence relation and we want to find the `(k+1)`th state.\
    \ Let `M` be `k X k` matrix, and build a matrix `A:[k X 1]` from the known states\
    \ of recurrence relation, now we want to get a matrix `B:[k X 1]` which will represent\
    \ the set of next states, i.e. `M X A = B` as shown below:\n\n```\n| f(n)   |\
    \ f(n+1) |\n| f(n-1) | f(n)   |\n| ...    | ...    |\n| f(n-k+1) | f(n-k+2) |\
    \ \n```\nSo, if we can design `M` accordingly, our job will be done! The matrix\
    \ will then be used to represent recurrence relation.\n\n##### Type 1:\nLet's\
    \ start with the simplest one, `f(n) = f( n - 1 ) + f( n - 2 )`. We get `f( n+\
    \ 1 ) = f( n ) + f( n - 1 )`. Let's assume, we know `f(n)` and `f(n - 1)`; we\
    \ want to find out `f( n+ 1 )`. From the situation above, matrix `A` and matrix\
    \ `B` can be formed as shown below:\n\n```\n| f(n)   | f(n+1) |\n| f(n-1) | f(n)\
    \   |\n```\nNote: Matrix `A` will always be designed in such a way that every\
    \ state on which `f(n+1)` depends, will be present. Now we need to design `2X2`\
    \ matrix `M` such that it satisfies `M X A = B` as stated above. The first element\
    \ of `B` is `f(n+1)` which is actually `f(n) + f(n-1)`. To get this, from matrix\
    \ `A`, we need `1 X f(n)` and `1 X f(n-1)`. So the first row of `M` will be `[1\
    \ 1]`.\n\n```\n| 1 1 | | f(n)   | = | f(n+1) |\n| --- | | f(n-1) | \n```\nNote:\
    \ `---` means we are not concerned about this value.\nSimilarly, 2nd item of `B`\
    \ is `f(n)` which can be got by taking `1 X f(n)` from `A`, so the 2nd row of\
    \ `M` is `[1 0]`.\n\n```\n| 1 1 | | f(n+1) |\n| 1 0 | | f(n)   |\n      |---------|\n\
    ```\nThen we get our desired `2 X 2` matrix `M`. These matrices are simply derived\
    \ using matrix multiplication.\n\n##### Type 2:\nLet's make it a little complex:\
    \ find `f(n) = a X f( n - 1 ) + b X f( n - 2 )`, where `a` and `b` are constants.\
    \ This tells us, `f( n+ 1 ) = a X f( n ) + b X f( n - 1 )`.\nBy this far, this\
    \ should be clear that the dimension of the matrices will be equal to the number\
    \ of dependencies, i.e in this particular example, again `2`. So for `A` and `B`,\
    \ we can build two matrices of size `2 X 1`:\n\n```\n| f(n)   |\n| f(n+1) |\n\
    | f(n-1) |\n| f(n)   |\n```\nNow for `f( n+ 1 ) = a X f( n ) + b X f( n - 1 )`,\
    \ we need `[a, b]` in the first row of objective matrix `M`. And for the 2nd item\
    \ in `B`, i.e `f(n)` we already have that in matrix `A`, so we just take that,\
    \ which leads the 2nd row of the matrix `M` to `[1 0]`. This time we get:\n\n\
    ```\n| a b | | f(n)   | = | f(n+1) |\n| 1 0 | | f(n-1) |\n|     | f(n)   |\n```\n\
    Pretty simple, eh?\n\n##### Type 3:\nIf you've survived through to this stage,\
    \ you've grown much older, now let s face a bit complex relation: find `f( n )\
    \ = a X f( n - 1 ) + c X f( n - 3 )`?\nOoops! A few minutes ago, all we saw were\
    \ contiguous states, but here, the state `f(n-2)` is missing. Now? Actually this\
    \ is not a problem anymore, we can convert the relation as follows: `f( n ) =\
    \ a X f( n - 1 ) + 0 X f( n - 2 ) + c X f( n - 3 )`, deducing `f( n+ 1 ) = a X\
    \ f( n ) + 0 X f( n - 1 ) + c X f( n - 2 )`.\nNow, we see that, this is actually\
    \ a form described in Type 2. So here the objective matrix `M` will be `3 X 3`,\
    \ and the elements are:\n\n```\n| a 0 c | | f(n)   |\n| 1 0 0 | | f(n+1) |\n|\
    \ 0 1 0 | | f(n-1) |\n|       | | f(n-2) |\n```\nThese are calculated in the same\
    \ way as type 2, if you find it difficult, try it on pen and paper.\n\n##### Type\
    \ 4:\nLife is getting complex as hell, and Mr, Problem now asks you to find `f(\
    \ n ) = f( n - 1 ) + f( n - 2 ) + c` where `c` is any constant.\nNow this is a\
    \ new one and all we have seen in past, after the multiplication, each state in\
    \ `A` transforms to its next state in `B`.\n`f( n ) = f( n - 1 ) + f( n - 2 )\
    \ + c`\n`f( n+ 1 ) = f( n ) + f( n - 1 ) + c`\n`f( n+ 2 ) = f( n+ 1 ) + f( n )\
    \ + c` ...... so on\nSo, normally we can't get it through previous fashion, but\
    \ how about we add `c` as a state:\n\n```\n| f(n)   | | f(n+1) |\n| f(n-1) | |\
    \ f(n)   |\n| c      | | c       |\n```\n"
