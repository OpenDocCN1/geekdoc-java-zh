    # Chapter 23: Catalan Number Algorithm\n\n## Section 23.1: Catalan Number Algorithm\n\
    \nCatalan numbers algorithm is Dynamic Programming algorithm. In combinatorial\
    \ mathematics, the Catalan numbers form a sequence of natural numbers that occur\
    \ in various counting problems, often involving recursively-defined objects. The\
    \ Catalan numbers on nonnegative integers n are a set of numbers that arise in\
    \ tree enumeration problems of the type, 'In many ways can a regular n-gon be\
    \ divided into n-2 triangles if different orientations are counted?' Application\
    \ of Catalan Algorithm:\n\n1. The number of ways to stack coins on a bottom row\
    \ that consists of n coins in a plane, such that no coins are allowed to be put\
    \ on the two sides of the bottom coins and every additional coin must be above\
    \ two other coins, is the nth Catalan number.\n2. The number of ways to group\
    \ a string of n pairs of parentheses, such that each open parenthesis has a matching\
    \ closed parenthesis, is the nth Catalan number.\n3. The number of ways to cut\
    \ an n+2-sided convex polygon in a plane into triangles by connecting vertices\
    \ with straight, non-intersecting lines is the nth Catalan number. This is the\
    \ application in which Euler was interested. Using zero-based numbering, the n\
    \ th Catalan number is given directly in terms of binomial coefficients by the\
    \ following equation.\n\n![](rsrc2GK.jpg) Example of Catalan Number:\n\nHere value\
    \ of n = 4.(Best Example - From Wikipedia)\n\n![](rsrc2GM.jpg) Auxiliary Space:\
    \ O( n)\n\nTime Complexity: O( n^2 )\n\n# Chapter 24: Multithreaded Algorithms\n\
    \n## Section 24.1: Square matrix multiplication\n\nExamples for some multithreaded\
    \ algorithms.\n\n```text\nmultithreadmultiply - square- matrix- parallel( A, B)\n\
    n = A.lines\nC = Matrix( n,n) //create a new matrix n*n\nparallel for i = 1 to\
    \ nparallel for j = 1 to n\n    C[ i][ j] = 0\n    pour k = 1 to n\n    C[ i][\
    \ j] = C[ i][ j] + A[ i][ k]* B[ k][ j]\n```\n"
