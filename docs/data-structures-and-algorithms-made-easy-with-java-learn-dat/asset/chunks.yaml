  trans: "\n\n让我们使用这两个序列创建一个二维矩阵 `Table`。我们将计算 `Sample` 中每个点与 `Test` 中所有点之间的距离，并找到它们之间的最优匹配。\n\
    \n```\n+------+------+------+------+------+------+------+------+\n| | 0 | 1 |\
    \ 1 | 2 | 2 | 3 | 5 |\n+------+------+------+------+------+------+------+------+\n\
    | 0 | | | | | | | | |\n+------+------+------+------+------+------+------+------+\n\
    | 1 | | | | | | | | |\n+------+------+------+------+------+------+------+------+\n\
    | 2 | | | | | | | | |\n+------+------+------+------+------+------+------+------+\n\
    | 3 | | | | | | | | |\n+------+------+------+------+------+------+------+------+\n\
    | 5 | | | | | | | | |\n+------+------+------+------+------+------+------+------+\n\
    | 5 | | | | | | | | |\n+------+------+------+------+------+------+------+------+\n\
    | 5 | | | | | | | | |\n+------+------+------+------+------+------+------+------+\n\
    | 6 | | | | | | | |\n+------+------+------+------+------+------+------+------+\n\
    ```\n\n在这里，`Table[i][j]` 代表如果我们考虑截至 `Sample[i]` 和 `Test[j]` 的序列，并考虑之前观察到的所有最优距离，这两个序列之间的最优距离。对于第一行，如果我们不从\
    \ `Sample` 中取任何值，则它与 `Test` 之间的距离将是 `infinity`。因此我们在第一行放入 `infinity`。第一列也是如此。如果我们不从\
    \ `Test` 中取任何值，则它与 `Sample` 之间的距离也将是 `infinity`。而 `0` 和 `0` 之间的距离简单为 `0`。我们得到：\n\
    \n```\n+------+------+------+------+------+------+------+------+\n| | 0 | 1 |\
    \ 1 | 2 | 2 | 3 | 5 |\n+------+------+------+------+------+------+------+------+\n\
    | 0 | 0 | inf | inf | inf | inf | inf | inf |\n+------+------+------+------+------+------+------+------+\n\
    | 1 | inf | | | | | | | |\n+------+------+------+------+------+------+------+------+\n\
    | 2 | inf | | | | | | | |\n+------+------+------+------+------+------+------+------+\n\
    | 3 | inf | | | | | | | |\n+------+------+------+------+------+------+------+------+\n\
    | 5 | inf | | | | | | | |\n+------+------+------+------+------+------+------+------+\n\
    | 5 | inf | | | | | | | |\n+------+------+------+------+------+------+------+------+\n\
    | 5 | inf | | | | | | | |\n+------+------+------+------+------+------+------+------+\n\
    | 6 | inf | | | | | | | |\n+------+------+------+------+------+------+------+------+\n\
    ```\n\n现在对于每一步，我们将考虑相关每个点之间的距离，并将其与我们目前找到的最小距离相。这将给出两个序列直到该位置的最优距离。我们的公式将：\n\n\
    `Table[ i][ j] := d( i, j) + min( Table[ i- 1 ][ j] , Table[ i- 1 ][ j-1 ] , Table[\
    \ i][ j-1 ])`\n\n对于第一个，`d(1, 1) = 0`，`Table[0][0]` 代表最小值。因此 `Table[1][1]` 的值将是\
    \ `0 + 0 = 0`。对于第二个，`d(1, 2) = 0`。`Table[1][1]` 代表最小值。值将是：`Table[1][2] = 0 + 0\
    \ = 0`。如果我们继续这样做，完成后，表格将像像：\n\n```\n+------+------+------+------+------+------+------+------+\n\
    | | 0 | 1 | 1 | 2 | 2 | 3 | 5 |\n+------+------+------+------+------+------+------+------+\n\
    | 0 | 0 | inf | inf | inf | inf | inf | inf |\n+------+------+------+------+------+------+------+------+\n\
    | 1 | inf | 0 | 0 | 1 | 2 | 4 | 8 |\n+------+------+------+------+------+------+------+------+\n\
    | 2 | inf | 1 | 1 | 0 | 0 | 1 | 4 |\n+------+------+------+------+------+------+------+------+\n\
    | 3 | inf | 3 | 3 | 1 | 1 | 0 | 2 |\n+------+------+------+------+------+------+------+------+\n\
    | 5 | inf | 7 | 7 | 4 | 4 | 2 | 0 |\n+------+------+------+------+------+------+------+------+\n\
    | 5 | inf | 11 | 11 | 7 | 7 | 4 | 0 |\n+------+------+------+------+------+------+------+------+\n\
    | 5 | inf | 15 | 15 | 10 | 10 | 6 | 0 |\n+------+------+------+------+------+------+------+------+\n\
    | 6 | inf | 20 | 20 | 14 | 14 | 9 | 1 |\n+------+------+------+------+------+------+------+------+\n\
    ```\n\n`Table[7][6]` 处的值代表这两个给定序列之间的最大距离。这里 `1` 代表 `Sample` 和 `Test` 之间的最大距离为\
    \ `1`。\n\n现在如果从最后一个点开始回溯，一直回到起点 `(0, 0)`，我们得到一条水平、垂直和对角线移动的线。我们的回溯程序将是：\n\n```\n\
    if Table[ i- 1 ][ j-1 ] <= Table[ i- 1 ][ j ] and Table[ i- 1 ][ j-1 ] <= Table[\
    \ i][ j-1 ]\n    i := i - 1\n    j := j - 1\nelse if Table[ i- 1 ][ j ] <= Table[\
    \ i- 1 ][ j-1 ] and Table[ i- 1 ][ j ] <= Table[ i][ j-1 ]\n    i := i - 1\nelse\n\
    \    j := j - 1\nend if\n```\n\n我们将一直持续直到到达 `(0, 0)`。每个移动都有自己的意义：水平移动代表删除。这意味着我们的测试序列在此区间加速了。垂直移动代表插入。这意味着我们的测试序列在此区间减速了。对角移动代表匹配。在此期间\
    \ Test 和 Sample 是相同的。我们的伪代码将：\n\n```\nProcedure DTW ( Sample, Test):\n    n :=\
    \ Sample.length\n    m := Test.length\n    Create Table[ n + 1 ][ m + 1 ]\n  \
    \  for i from 1 to n\n        Table[ i][ 0 ] := infinity\n    end for\n    for\
    \ i from 1 to m\n        Table[ 0 ][ i ] := infinity\n    end for\n    Table[\
    \ 0 ][ 0 ] := 0\n    for i from 1 to n\n        for j from 1 to m\n          \
    \  Table[ i][ j] := d( Sample[ i ] , Test[ j]) + minimum( Table[ i- 1 ][ j-1 ]\
    \ , // match\n            Table[ i][ j-1 ] , // insertion\n            Table[\
    \ i- 1 ][ j] ) // deletion\n        end for\n    end for\n    Return Table[ n\
    \ + 1 ][ m + 1 ]\n```\n\n我们还可以添加局部性约束。也就是说，我们要求如果 `Sample[ i]` 与 `Test[ j]` 匹配，那么\
    \ `| i - j|` 不大于 `w`，这是一个窗口参数。\n\n### 复杂度\n\n计算 DTW 的复杂度为 `O(m * n)`，其中 `m` 和\
    \ `n` 代表序列的长度。计算 DTW 的更快技术包括 `PrunedDTW`、`SparseDTW` 和 `FastDTW`。\n\n### 应用\n\n"
- fmt: "\n# Spoken word recognition Correlation Power Analysis\n\n## Chapter 55: Fast\
    \ Fourier Transform\n\nThe Real and Complex form of `DFT` (`Discrete Fourier Transforms`)\
    \ can be used to perform frequency analysis or synthesis for any discrete and\
    \ periodic signals. The `FFT` (`Fast Fourier Transform`) is an implementation\
    \ of the `DFT` which may be performed quickly on modern CPUs.\n\n### Section 55.1:\
    \ Radix 2 FFT\n\nThe simplest and perhaps best-known method for computing the\
    \ `FFT` is the Radix-2 Decimation in Time algorithm. The Radix-2 FFT works by\
    \ decomposing an `N` point time domain signal into `N` time domain signals each\
    \ composed of a single point.\n\n![](rsrc2HK.jpg)\n\nSignal decomposition, or\
    \ ‘decimation in time’ is achieved by bit reversing the indices for the array\
    \ of time domain data. Thus, for a sixteen-point signal, sample 1 (Binary `0001`)\
    \ is swapped with sample 8 (`1000`), sample 2 (`0010`) is swapped with 4 (`0100`)\
    \ and so on. Sample swapping using the bit reverse technique can be achieved simply\
    \ in software, but limits the use of the Radix 2 FFT to signals of length `N =\
    \ 2^M`.\n\nThe value of a 1-point signal in the time domain is equal to its value\
    \ in the frequency domain, thus this array of decomposed single time-domain points\
    \ requires no transformation to become an array of frequency domain points. The\
    \ `N` single points; however, need to be reconstructed into one `N`-point frequency\
    \ spectra. Optimal reconstruction of the complete frequency spectrum is performed\
    \ using butterﬂy calculations. Each reconstruction stage in the Radix-2 FFT performs\
    \ a number of two point butterﬂies, using a similar set of exponential weighting\
    \ functions, `Wn^R`.\n\n![](rsrc2HM.jpg)\n\nThe `FFT` removes redundant calculations\
    \ in the Discrete Fourier Transform by exploiting the periodicity of `Wn^R`. Spectral\
    \ reconstruction is completed in `log2(N)` stages of butterﬂy calculations giving\
    \ `X[K]`; the real and imaginary frequency domain data in rectangular form. To\
    \ convert to magnitude and phase (polar coordinates) requires finding the absolute\
    \ value, `√(Re2 + Im2)`, and argument, `tan-1(Im/Re)`.\n\n![](rsrc2HN.jpg)\n\n\
    The complete butterﬂy ﬂow diagram for an eight point Radix 2 FFT is shown below.\
    \ Note the input signals have previously been reordered according to the decimation\
    \ in time procedure outlined previously.\n\n![](rsrc2HP.jpg)\n\nThe `FFT` typically\
    \ operates on complex inputs and produces a complex output. For real signals,\
    \ the imaginary part may be set to zero and real part set to the input signal,\
    \ `x[n]`, however many optimisations are possible involving the transformation\
    \ of real-only data. Values of `Wn^R` used throughout the reconstruction can be\
    \ determined using the exponential weighting equation. The value of `R` (the exponential\
    \ weighting power) is determined the current stage in the spectral reconstruction\
    \ and the current calculation within a particular butterﬂy.\n\n### Code Example\
    \ (C/C++)\n\nA C/C++` code sample for computing the Radix 2 FFT can be found below.\
    \ This is a simple implementation which works for any size `N` where `N` is a\
    \ power of 2\\. It is approx 3x slower than the fastest FFTw implementation, but\
    \ still a very good basis for future optimisation or for learning about how this\
    \ algorithm works.\n\n```cpp\n#include <math.h>\n#define PI 3.1415926535897932384626433832795\
    \ // PI for sine/cos calculations\n#define TWOPI 6.283185307179586476925286766559\
    \ // 2*PI for sine/cos calculations\n#define Deg2Rad 0.017453292519943295769236907684886\
    \ // Degrees to Radians factor\n#define Rad2Deg 57.295779513082320876798154814105\
    \ // Radians to Degrees factor\n#define log10_2 0.30102999566398119521373889472449\
    \ // Log10 of 2\n\n#define log10_2_INV 3.3219280948873623478703194294948 // 1/Log10(2)\n\
    \n// complex variable structure (double precision)\nstruct complex\n{\npublic:double\
    \ Re, Im; // Not so complicated after all\n};\n\n// Returns true if N is a power\
    \ of 2\nbool isPwrTwo(int N, int *M)\n{\n    *M = (int )ceil (log10 ((double )N)\
    \ * log10_2_INV); // M is number of stages to perform. 2^M = N\n    int NN = (int\
    \ )pow (2.0 , *M);\n    if ((NN != N) || (NN == 0)) // Check N is a power of 2.\
    \ return false ;\n    return true ;\n}\n\nvoid rad2FFT(int N, complex *x, complex\
    \ *DFT) {\n    int M = 0;\n    // Check if power of two. If not, exit\n    if\
    \ (!isPwrTwo(N, &M))\n        throw \"Rad2FFT(): N must be a power of 2 for Radix\
    \ FFT\";\n\n    // Integer Variables\n    int BSep;\n    int BWidth;\n    int\
    \ P;\n    int j;\n    int stage = 1; // (1 to M)\n    int HiIndex;\n    // ...\
    \ (logic continues)\n}\n```\n"
