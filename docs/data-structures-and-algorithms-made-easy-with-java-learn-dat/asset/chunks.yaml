    \ ( 1 ,3 ) ( 4 ,5 ) ( 6 ,8 ) ( 9 ,10 )`\n\n该算法的实现复杂度显然是 $\\Theta(n²)$。存在 $\\Theta(n\
    \ \\log n)$ 的实现，感兴趣的读者可以继续阅读下方（Java 示例）。\n\n现在我们有一个区间调度问题的贪心算法，但它是最优的吗？\n\n**命题**：最早完成时间的贪心算法是最优的。\n\
    \n**证明**：（反证法）\n假设贪心算法不是最优的，$i1,i2,...,ik$ 表示贪心算法选择的任务集。令 $j1,j2,...,jm$ 表示最优解中的任务集，对于最大可能的数值\
    \ $r$，有 $i1= j1,i2= j2,...,ir= jr$。任务 $i( r+ 1 )$ 存在且且其完成时间在 $j( r+ 1 )$ 之前（最早完成时间）。但此时\
    \ $j1,j2,...,jr,i( r+ 1 ) ,j( r+ 2 ) ,...,jm$ 也是一个最优解，且对于所有在 $[ 1 ,( r+ 1 )]$\
    \ 的 $k$，都有 $jk= ik$。这与 $r$ 的最大性相矛盾。证明完毕。第二个示例说明，通常有许多可能的贪心策略，但只有某些、甚至没有策略可以在每种情况下都找到最优解。\n\
    \n下面是一个运行在 $\\Theta(n \\log n)$ 时间的 Java 程序：\n\n```java\nimport java.util.Arrays\
