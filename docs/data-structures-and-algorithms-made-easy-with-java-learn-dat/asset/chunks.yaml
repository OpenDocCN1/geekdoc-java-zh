    to 11.00 A.M. However, you can take class 1 and 3 because they don''t share a
    common time. So your task is to take maximum number of classes as possible without
    any overlap. How can you do that?Analysis


    Lets think for the solution by greedy approach.First of all we randomly chose
    some approach and check that will work or not.sort the activity by start time
    that means which activity start ﬁrst we will take them ﬁrst. then take ﬁrst to
    last from sorted list and check it will intersect from previous taken activity
    or not. If the current activity is not intersect with the previously taken activity,
    we will perform the activity otherwise we will not perform. this approach will
    work for some cases likeActivity No. start time end time


