  trans: "\n\n# 第 22 章：Floyd-Warshall 算法\n\n## 22.1 节：所有对最短路径算法\n\nFloyd-Warshall\
    \ 算法用于在具有正负边权的权图中寻找最短路径。算法执行一次即可找到所有顶点对之间最短路径的长度（权重之和）。通过微小的改进，它可以输出最短路径并检测图中的负环。`FloydWarshall`\
    \ 是一种动态规划算法。\n\n让我们来看一个例子。我们将在此图上应用 `Floyd-Warshall`算法：\n\n![](img/rsrc2GJ.jpg)\n\
    \n我们做的第一件事是取两个二维矩阵。这些是邻接矩阵。矩阵的大小将是顶点的总数。对于我们的图，我们将取 `4 * 4` 矩阵。`Distance Matrix`\
    \ 距离矩阵存储目前为止两个顶点之间的最小距离。最初，对于边，如果 `u-v` 之间存在边且距离/权重为 `w`，我们将存储：`distance[ u][\
    \ v] = w`。对于所有不存在的边，我们将放入 `infinity`（无穷大）。`Path Matrix` 路径矩阵用于重建两个顶点之间的最小距离路径。因此，最初，如果\
    \ `u` 和 `v` 之间存在路径，我们将放入 `path[ u][ v] = u`。这意味着从顶点 u 到顶点 v 的最佳方法是使用连接 `v` 和 `u`\
    \ 的边。如果两个顶点之间没有路径，我们将放入 `N`，表示目前没有可用路径。我们图的两个表如下：\n\n```text\n+-----+-----+-----+-----+-----+\
    \ +-----+-----+-----+-----+-----+\n| | 1 | 2 | 3 | 4 | | 1 | 2 | 3 | 4 |\n+-----+-----+-----+-----+-----+\
    \ +-----+-----+-----+-----+-----+\n| 1 | 0 | 3 | 6 | 15 | | 1 | N | 1 | 1 | 1\
    \ |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n| 2 | inf\
    \ | 0 | -2 | inf | | 2 | N | N | 2 | N |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n\
    | 3 | inf | inf | 0 | 2 | | 3 | N | N | N | 3 |\n+-----+-----+-----+-----+-----+\
    \ +-----+-----+-----+-----+-----+\n| 4 | 1 | inf | inf | 0 | | 4 | 4 | N | N |\
    \ N |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\ndistance\
    \ path\n```\n\n由于没有自环，对角线被设置为 `N`。顶点到自身的距离为 `0`。要应用 `Floyd-Warshall` 算法，我们将选择一个中间顶点\
    \ `k`。然后对于每个顶点 `i`，我们将检查是否可以从 `i` 到 `k` 然后从 `k` 到 `j`（其中 `j` 是另一个顶点），并最小化从 `i`\
    \ 到 `j` 的代价。如果当前的 `distance[i][j]` 大于 `distance[i][k] + distance[k][j]`，我们将把 `distance[i][j]`\
    \ 等于这两个距离之和。并且 `path[i][j]` 将被设置为 `path[k][j]`，因为从 `i` 到 `k` 再从 `k` 到 `j` 更好。所有顶点都将被选为\
    \ `k`。我们将有三个嵌套循环：`k` 从 1 到 4，`i` 从 1 到 4，`j` 从 1 到 4。我们将检查：\n\n```text\nif distance[\
    \ i][ j] > distance[ i][ k] + distance[ k][ j]\n    distance[ i][ j] := distance[\
    \ i][ k] + distance[ k][ j]\n    path[ i][ j] := path[ k][ j]\nend if\n```\n\n\
    所以我们基本上在检查，对于每一对顶点，通过另一个顶点是否能获得更短的距离？我们图的总操作数将是 `4 * 4 * 4 = 64`。这意味着我们将进行 64\
    \ 次这种检查。让我们来看其中几个：\n\n当 `k = 1`, `i = 2` 且 `j = 3` 时，`distance[i][j]` 为 `-2`，并不大于\
    \ `distance[i][k] + distance[k][j] = -2 + 0 = -2`。因此它将保持不变。同样，当 `k = 1`, `i =\
    \ 4` 且 `j = 2` 时，`distance[i][j] = infinity`，大于 `distance[i][k] + distance[k][j]\
    \ = 1 + 3 = 4`。因此我们令 `distance[i][j] = 4`，并令 `path[i][j] = path[k][j] = 1`。这意味着从顶点-4\
    \ 到顶点-2，路径 `4->1->2` 比现有路径短。这就是我们填充两个矩阵的方法。每一步的计算在此所示。在进行必要的更改后，我们的矩阵将如下：\n\n\
    ```text\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n| |\
    \ 1 | 2 | 3 | 4 | | 1 | 2 | 3 | 4 |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n\
    | 1 | 0 | 3 | 6 | 15 | | 1 | N | 1 | 1 | 1 |\n+-----+-----+-----+-----+-----+\
    \ +-----+-----+-----+-----+-----+\n| 2 | inf | 0 | -2 | inf | | 2 | N | N | 2\
    \ | N |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n| 3\
    \ | inf | inf | 0 | 2 | | 3 | N | N | N | 3 |\n+-----+-----+-----+-----+-----+\
    \ +-----+-----+-----+-----+-----+\n| 4 | 1 | inf | inf | 0 | | 4 | 4 | N | N |\
    \ N |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n```\n\n\
    （注：原文后续部分存在大量重复的描述和逻辑，此处已根据要求不重复输出并保留核心逻辑）\n\n由于没有自环，对角线被设置为 `N`。顶点到自身的距离为 `0`。要应用\
    \ `Floyd-Warshall` 算法，我们将选择一个中间顶点 `k`。然后对于每个顶点 `i`，我们将检查是否可以从 `i` 到 `k` 然后从 `k`\
    \ 到 `j`（其中 `j` 是另一个顶点），并最小化从 `i` 到 `j` 的代价。如果当前的 `distance[i][j]` 大于 `distance[i][k]\
    \ + distance[k][j]`，我们将把 `distance[i][j]` 等于这两个距离之和。并且 `path[i][j]` 将被设置为 `path[k][j]`，因为从\
    \ `i` 到 `k` 再从 `k` 到 `j` 更好。所有顶点都将被选为 `k`。我们将有三个嵌套循环：`k` 从 1 到 4，`i` 从 1 到 4，`j`\
    \ 从 1 到 4。\n\n```text\nif distance[ i][ j] > distance[ i][ k] + distance[ k][\
    \ j]\n    distance[ i][ j] := distance[ i][ k] + distance[ k][ j]\n    path[ i][\
    \ j] := path[ k][ j]\nend if\n```\n\n所以我们基本上在检查，对于每一对顶点，通过另一个顶点是否能获得更短的距离？我们图的总操作数将是\
    \ `4 * 4 * 4 = 64`。这意味着我们将进行 64 次这种检查。让我们来看其中几个：当 `k = 1`, `i = 2` 且 `j = 3` 时，`distance[i][j]`\
    \ 为 `-2`，并不大于 `distance[i][k] + distance[k][j] = -2 + 0 = -2`。因此它将保持不变。同样，当 `k\
    \ = 1`, `i = 4` 且 `j = 2` 时，`distance[i][j] = infinity`，大于 `distance[i][k] + distance[k][j]\
    \ = 1 + 3 = 4`。因此我们令 `distance[i][j] = 4`，并令 `path[i][j] = path[k][j] = 1`。这意味着从顶点-4\
    \ 到顶点-2，路径 `4->1->2` 比现有路径短。这就是我们填充两个矩阵的方法。每一步的计算在此所示。在进行必要的更改后，我们的矩阵将如下：\n\n\
    ```text\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n| |\
    \ 1 | 2 | 3 | 4 | | 1 | 2 | 3 | 4 |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n\
    | 1 | 0 | 3 | 1 | 3 | | 1 | N | 1 | 2 | 3 |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n\
    | 2 | 1 | 0 | -2 | inf | | 2 | N | N | 2 | N |\n+-----+-----+-----+-----+-----+\
    \ +-----+-----+-----+-----+-----+\n| 3 | inf | inf | 0 | 2 | | 3 | N | N | N |\
    \ 3 |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n| 4 |\
    \ 1 | inf | inf | 0 | | 4 | 4 | N | N | N |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n\
    ```\n\n# 第 23 章：卡特兰数算法\n\n## 23.1 节：卡特兰数算法\n\n卡特兰数算法是一种动态规划算法。在组合数学中，卡特兰数形成了一系列出现在各种计数问题中的自然数，这些问题通常涉及递归定义。非负整数\
    \ $n$ 的卡特兰数是一组出现在树枚举问题数字，例如：“如果考虑不同的方向，正 $n$ 形有多少种方式可以被分为 $n-2$ 个三角形？”卡特兰算法的应用：\n\
    \n1. 在平面中，在由 $n$ 个硬币组成的底行上堆叠硬币，不允许放在底部硬币的两侧，且每个额外的硬币必须位于另外两个硬币之上的方法数是第 $n$ 个卡特兰数。\n\
    2. 对 $n$ 对括号字符串进行分组，使得每个左括号都有匹配的右括号的方法数是第 $n$ 个卡特兰数。\n3. 在平面中，通过用不相交的直线连接顶点，将\
    \ $n+2$ 边凸边形切割成三角形的方法数是第 $n$ 个卡特兰数。这是欧拉感兴趣的应用。使用从零计数，第 $n$ 个卡特兰数通过以下方程用二项式系数给出：\n\
    \n![](img/rsrc2GK.jpg) 卡特兰数示例：\n\n这里 $n=4$ 的值。（最佳示例 - 来自维基百科）\n\n![](img/rsrc2GM.jpg)\
    \ 辅助空间：O( n)\n\n时间复杂度：O( n² )\n\n# 第 24 章：多线程算法\n\n## 24.1 节：方矩阵乘法\n\n某些多线程算法的示例。\n\
    \n```text\nmultithreadmultiply - square- matrix- parallel( A, B)\nn = A.lines\n\
    C = Matrix( n,n) //创建一个新的 n*n 矩阵\nparallel for i = 1 to nparallel for j = 1 to\
    \ n\n    C[ i][ j] = 0\n    pour k = 1 to n\n    C[ i][ j] = C[ i][ j] + A[ i][\
    \ k]* B[ k][ j]\n```\n\n"
- fmt: "\n# Section 24.2: Multiplication matrix vector multithread\n\n```\nreturn\
    \ CSection 24.2: Multiplication matrix vector multithreadmatrix - vector( A,x)\n\
    \nn = A.lines\n\ny = Vector ( n) //create a new vector of length n\n\nparallel\
    \ for i = 1 to ny [ i] = 0\n\nparallel for i = 1 to n\n\nfor j = 1 to n\n\ny[\
    \ i] = y[ i] + A[ i][ j]* x[ j]\n\nreturn y\n```\n\n# Section 24.3: merge-sort\
    \ multithread\n\n`A` is an array and `p` and `q` indexes of the array such as\
    \ you gonna sort the sub-array `A[p..r]`. `B` is a sub-array which will be populated\
    \ by the sort.\n\nA call to `p-merge-sort(A,p,r,B,s)` sorts elements from `A[p..r]`\
    \ and put them in `B[s..s+r-p]`.\n\n`p-merge-sort( A,p,r,B,s)`\n\n```\nn = r-\
    \ p+ 1\n\nif n== 1\n    B [ s] = A[ p]\nelse\n    T = new Array ( n) //create\
    \ a new array T of size n\n    q = floor(( p+ r)/ 2 ))\n    q_prime = q- p+ 1\n\
    \    spawn p- merge- sort( A,p,q,T,1 )\n    p- merge- sort( A,q+ 1 ,r,T,q_prime+\
    \ 1 )\n    sync\n    p- merge( T,1 ,q_prime,q_prime+ 1 ,n,B,s)\n```\n\nHere is\
    \ the auxiliary function that performs the merge in parallel.\n\n`p-merge` assumes\
    \ that the two sub-arrays to merge are in the same array but doesn't assume they\
    \ are adjacent in the array. That's why we need `p1,r1,p2,r2`.\n\n`p - merge(\
    \ T,p1,r1,p2,r2,A,p3)`\n\n```\nn1 = r1- p1+ 1\n\nn2 = r2- p2+ 1\n\nif n1< n2 //check\
    \ if n1>=n2\n    permute p1 and p2\n    permute r1 and r2\n    permute n1 and\
    \ n2\n\nif n1== 0 //both empty?\n    return\nelse\n    q1 = floor(( p1+ r1)/ 2\
    \ )\n    q2 = dichotomic- search( T[ q1] ,T,p2,r2)\n    q3 = p3 + ( q1- p1) +\
    \ ( q2- p2)\n\n    A[ q3] = T[ q1]\n    spawn p- merge( T,p1,q1- 1 ,p2,q2- 1 ,A,p3)\n\
    \    p- merge( T,q1+ 1 ,r1,q2,r2,A,q3+ 1 )\n    sync\n```\n\nAnd here is the auxiliary\
    \ function `dichotomic-search`.\n\n`x` is the key to look for in the sub-array\
    \ `T[p..r]`.\n\n```\ndichotomic - search( x,T,p,r)\n\ninf = p\n\nsup = max( p,r+\
    \ 1 )\n\nwhile inf< sup\n    half = floor(( inf+ sup)/ 2 )\n    if x<= T[ half]\n\
    \        sup = half\n    else\n        inf = half+ 1\nreturn sup\n```\n\n# Chapter\
    \ 25: Knuth Morris Pratt (KMP) Algorithm\n\nThe KMP is a pattern matching algorithm\
    \ which searches for occurrences of a \"word\" `W` within a main \"text string\"\
    \ `S` by employing the observation that when a mismatch occurs, we have the sufficient\
    \ information to determine where the next match could begin. We take advantage\
    \ of this information to avoid matching the characters that we know will anyway\
    \ match. The worst case complexity for searching a pattern reduces to $O(n)$.\n\
    \n## Section 25.1: KMP-Example Algorithm\n\nThis algorithm is a two step process.\
    \ First we create a auxiliary array `lps[]` and then use this array for searching\
    \ the pattern.\n\n### Preprocessing:\n1. We pre-process the pattern and create\
    \ an auxiliary array `lps[]` which is used to skip characters while matching.\n\
    2. Here `lps[]` indicates longest proper prefix which is also suffix. A proper\
    \ prefix is prefix in which whole string is not included. For example, prefixes\
    \ of string `ABC` are `\" \", \"A \", \"AB \" and \"ABC \". Proper prefixes are\
    \ `\" \", \"A \", and \"AB \". Suffixes of the string are `\" \", \"C \", \"BC\
    \ \" and \"ABC \".\n\n### Searching:\n1. We keep matching characters `txt[i]`\
    \ and `pat[j]` and keep incrementing `i` and `j` while `pat[j]` and `txt[i]` keep\
    \ matching.\n2. When we see a mismatch, we know that characters `pat[0..j-1]`\
    \ match with `txt[i-j+1 …i-1]`. We also know that `lps[j-1]` is count of characters\
    \ of `pat[0 …j-1]` that are both proper prefix and suffix. From this we can conclude\
    \ that we do not need to match these `lps[j-1]` characters with `txt[i-j …i-1]`\
    \ because we know that these characters will match anyway.\n\n### Implementation\
    \ in Java\n\n```java\npublic class KMP {\n    public static void main( String\
    \ [] args) {\n        // TODO Auto-generated method stub\n        String str =\
    \ \"abcabdabc\" ;\n        String pattern = \"abc\" ;\n        KMP obj = new KMP();\n\
    \        System .out .println ( obj.patternExistKMP ( str.toCharArray () , pattern.toCharArray\
    \ ()));\n    }\n\n    public int [] computeLPS( char [] str){\n        int lps[]\
    \ = new int [ str.length ];\n        lps[ 0 ] = 0;\n        int j = 0;\n     \
    \   for ( int i = 1 ; i< str.length ; i++){\n            if ( str[ j] == str[\
    \ i])){\n                lps[ i] = j+ 1;\n                j++;\n            }\
    \ else {\n                if ( j!= 0 )\n                    j = lps[ j- 1 ];\n\
    \                } else {\n                    lps[ i] = j+ 1;\n             \
    \   }\n            }\n        }\n        return lps;\n    }\n\n    public boolean\
    \ patternExistKMP( char [] text, char [] pat){\n        int [] lps = computeLPS(\
    \ pat);\n        int i = 0;\n        j = 0;\n        while ( i< text.length &&\
