    \ sort(final T[] elements); }\n\npublic class MergeSort<T extends Comparable<T>>\
    \ implements InPlaceSort<T> {\n    @Override\n    public void sort(T[] elements)\
    \ {\n        T[] arr = (T[]) new Comparable[elements.length];\n        sort(elements,\
    \ arr, 0, elements.length - 1);\n    } // 我们检查两边部分，然后合并它们\n\n    private void\
    \ sort(T[] elements, T[] arr, int low, int high) {\n        if (low >= high) return;\n\
    \        int mid = low + (high - low) / 2;\n        sort(elements, arr, low, mid);\n\
    \        sort(elements, arr, mid + 1, high);\n        merge(elements, arr, low,\
