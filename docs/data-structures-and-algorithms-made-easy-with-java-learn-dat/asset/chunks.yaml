    \ static int [] Main( int [] input) {\n        SortHeap( input, input.Length );\n\
    \        return input;\n    }\n}\n```\n\n### 第 35.2 节：堆排序基础信息\n堆排序是一种基于二叉堆数据结构的比较排序技术。它与选择排序类似，我们首先找到最大元素并将其放在数据结构的末尾。然后对剩余项目重复相同的过程。\n\
    \n堆排序的伪代码：\n```python\nfunction heapsort ( input, count)\n    heapify( a,count)\n\
    \    end < count - 1 while end -> 0 do\n        swap( a[ end] ,a[ 0 ])\n    end<\
    \ end - 1\n    restore( a, 0 , end)\n\nfunction heapify ( a, count)\n    start\
    \ < parent( count - 1 ) while start >= 0 do\n        restore( a, start, count\
    \ - 1 )\n    start < start - 1\n```\n\n### 堆排序示例：\n![](img/rsrc2GY.jpg) 辅助空间：`O(\
    \ 1 )`\n\n时间复杂度：`O( nlogn)`\n\n## 第 36 章：循环排序\n\n### 第 36.1 节：伪代码实现\n```python\n\
    ( input)\noutput = 0\nfor cycleStart from 0 to length( array)\n    item = array[\
