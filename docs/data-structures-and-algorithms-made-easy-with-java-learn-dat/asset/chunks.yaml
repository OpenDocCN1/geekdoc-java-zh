    \ 1）。\n3. 当待删除的节点有两个孩子时，可以将其右子树中的最小值复制到该节点中，然后从该节点的右子树中删除该最小值（转换为情况 2）。\n\n**注意**：右子树中的最小值最多可能有一个孩子，且必须是右孩子；如果它有左孩子，则说明它不是最小值，或者它不符合二叉搜索树属性。\n\
    \n树的节点结构以及删除操作的代码：\n\n```cpp\nstruct node {\n    int data;\n    node * left, *\
