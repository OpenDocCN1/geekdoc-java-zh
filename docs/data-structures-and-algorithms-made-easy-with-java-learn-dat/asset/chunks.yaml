    to be bombarded to disconnect the capital city from others, that too can be found
    out using Graph Theory. Let us ﬁrst learn some basic deﬁnitions on Graph Theory.Graph:


    Let''s say, we have 6 cities. We mark them as 1, 2, 3, 4, 5, 6\. Now we connect
    the cities that have roads between each other.


    ![](rsrc2F4.jpg)This is a simple graph where some cities are shown with the roads
    that are connecting them. In Graph Theory, we call each of these cities Node or
    Vertex and the roads are called Edge. Graph is simply a connection of these nodes
    and edges.A node can represent a lot of things. In some graphs, nodes represent
    cities, some represent airports, some represent a square in a chessboard. Edge
    represents the relation between each nodes. That relation can be the time to go
    from one airport to another, the moves of a knight from one square to all the
    other squares etc.![](rsrc2F5.jpg) Path of Knight in a Chessboard


    In simple words, a Node represents any object and Edge represents the relation
    between two objects.


    Adjacent Node:


    If a node A shares an edge with node B , then B is considered to be adjacent to
    A . In other words, if two nodes are directly connected, they are called adjacent
    nodes. One node can have multiple adjacent nodes.


    Directed and Undirected Graph:In directed graphs, the edges have direction signs
    on one side, that means the edges are Unidirectional . On the other hand, the
    edges of undirected graphs have direction signs on both sides, that means they
    are Bidirectional . Usually undirected graphs are represented with no signs on
    the either sides of the edges.Let''s assume there is a party going on. The people
    in the party are represented by nodes and there is an edge between two people
    if they shake hands. Then this graph is undirected because any person A shake
    hands with person B if and only if B also shakes hands with A . In contrast, if
    the edges from a person A to another person B corresponds to A ''s admiring B
    , then this graph is directed, because admiration is not necessarily reciprocated.
    The former type of graph is called an undirected graph and the edges are called
    undirected edges while the latter type of graph is called a directed graph and
    the edges are called directed edges.Weighted and Unweighted Graph:


    A weighted graph is a graph in which a number (the weight) is assigned to each
    edge. Such weights might represent for example costs, lengths or capacities, depending
    on the problem at hand.


    ![](rsrc2F6.jpg) An unweighted graph is simply the opposite. We assume that, the
    weight of all the edges are same (presumably 1).


    Path:


    A path represents a way of going from one node to another. It consists of sequence
    of edges. There can be multiple


    ![](rsrc2F7.jpg) paths between two nodes.In the example above, there are two paths
    from A to D . A->B, B->C, C->D is one path. The cost of this path is 3 + 4 + 2
    = 9 . Again, there''s another path A->D . The cost of this path is 10 . The path
    that costs the lowest is called shortest path .Degree:


    The degree of a vertex is the number of edges that are connected to it. If there''s
    any edge that connects to the vertex at both ends (a loop) is counted twice.


    In directed graphs, the nodes have two types of degrees:


    In-degree: The number of edges that point to the node.


    Out-degree: The number of edges that point from the node to other nodes.


    For undirected graphs, they are simply called degree.


    ![](rsrc2F8.jpg) Some Algorithms Related to Graph TheoryBellman –Ford algorithm


    Dijkstra''s algorithm


    Ford–Fulkerson algorithm


    Kruskal''s algorithm


    Nearest neighbour algorithm


    Prim''s algorithm


    Depth-ﬁrst search


    Breadth-ﬁrst searchSection 9.3: Storing Graphs (Adjacency List)Adjacency list
    is a collection of unordered lists used to represent a ﬁnite graph. Each list
    describes the set of neighbors of a vertex in a graph. It takes less memory to
    store graphs.


    Let''s see a graph, and its adjacency matrix:


    ![](rsrc2F9.jpg)Now we create a list using these values.![](rsrc2FA.jpg)This is
    called adjacency list. It shows which nodes are connected to which nodes. We can
    store this information using a 2D array. But will cost us the same memory as Adjacency
    Matrix. Instead we are going to use dynamically allocated memory to store this
    one.Many languages support Vector or List which we can use to store adjacency
    list. For these, we don''t need to specify the size of the List . We only need
    to specify the maximum number of nodes.


    The pseudo-code will be:Procedure Adjacency - List ( maxN, E): edge[ maxN] = Vector
    ()


    for i from 1 to E// maxN denotes the maximum number of nodes // E denotes the
    number of edgesinput -> x, y // Here x, y denotes there is an edge between x,
    y edge[ x] .push ( y)


    edge[ y] .push ( x)end for


    Return edgeSince this one is an undirected graph, it there is an edge from x to
    y , there is also an edge from y to x . If it was a directed graph, we''d omit
    the second one. For weighted graphs, we need to store the cost too. We''ll create
    another vector or list named cost[] to store these. The pseudo-code:Procedure
    Adjacency - List ( maxN, E): edge[ maxN] = Vector ()


    cost[ maxN] = Vector ()


    for i from 1 to Einput -> x, y, w


    edge[ x] .push ( y)


    cost[ x] .push ( w)end for


    Return edge, costFrom this one, we can easily ﬁnd out the total number of nodes
    connected to any node, and what these nodes are. It takes less time than Adjacency
    Matrix. But if we needed to ﬁnd out if there''s an edge between u and v , it''d
    have been easier if we kept an adjacency matrix.Section 9.4: Topological SortA
    topological ordering, or a topological sort, orders the vertices in a directed
    acyclic graph on a line, i.e. in a list, such that all directed edges go from
    left to right. Such an ordering cannot exist if the graph contains a directed
    cycle because there is no way that you can keep going right on a line and still
    return back to where you started from.Formally, in a graph G = ( V, E) , then
    a linear ordering of all its vertices is such that if G contains an edge ( u,
    v) ∈ Efrom vertex u to vertex v then u precedes v in the ordering.


    It is important to note that each DAG has at least one topological sort.


    There are known algorithms for constructing a topological ordering of any DAG
    in linear time, one example is:1\. Call depth_first_search( G) to compute ﬁnishing
    times v.f for each vertex v


    2\. As each vertex is ﬁnished, insert it into the front of a linked list


    3\. the linked list of vertices, as it is now sorted.A topological sort can be
    performed in ( V + E) time, since the depth-ﬁrst search algorithm takes ( V +
    E) time and it takes Ω( 1 ) (constant time) to insert each of | V| vertices into
    the front of a linked list.'
