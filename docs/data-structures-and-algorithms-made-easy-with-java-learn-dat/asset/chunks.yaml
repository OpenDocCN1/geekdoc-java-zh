    \    }\n}\n```\n\n# 第 42 章：深度优先搜索\n\n## 第 42.1 节：深度优先搜索简介\n\n深度优先搜索（DFS）是一种用于遍历或搜索树或图数据结构的算法。从根节点开始，沿着每个分支尽可能深地探索，然后回溯。19\
    \ 世纪，法国数学家查尔斯·皮埃·特雷莫（Charles Pierre Trémaux）曾研究过深度优先搜索，作为解决迷宫的策略。\n\n深度优先搜索是寻找从源顶点可达的所有顶点的系统方法。与广度优先搜索（BFS）一样，DFS\
    \ 遍历给定图的一个连通分量并定义一个生成树。深度优先搜索的基本思想是有条理地探索每条边。我们根据需要从不同的顶点重新开始。一旦发现一个顶点，DFS 就会从该顶点开始探索（与\
    \ BFS 不同，BFS 将顶点放入队列以便稍后从其进行探索）。\n\n让我们来看一个例子。我们将遍历这个图：\n\n![](img/rsrc2HB.jpg)\n\
    \n我们将遵循以下规则遍历图：\n- 我们从源点开始。\n- 节点不会被访问两次。\n- 我们尚未访问的节点将被涂为白色。\n- 我们访问过但尚未访问所有子节点的节点将被涂为灰色。\n\
    - 完全遍历的节点将被涂为黑色。\n\n让我们逐步观察：\n![](img/rsrc2HC.jpg) ![](img/rsrc2HD.jpg) ![](img/rsrc2HE.jpg)\
    \ ![](img/rsrc2HF.jpg) ![](img/rsrc2HG.jpg) ![](img/rsrc2HH.jpg)\n\n我们可以看到一个重要的关键词\
    \ `backedge`（回边）。你可以看到 5-1 是 `backedge`。这是因为我们还没有完成节点 1，在 DFS 中，如果可以从一个灰色节点到另一个节点，则可以确定图中存在环。这是检测图中环的方法之一。根据源节点和访问节点的顺序，我们可以发现环中的任何边为\
    \ `backedge`。例如：如果先去到 5，就会发现 2-1 是 `backedge`。\n\n从灰色节点到白色节点的边被称为 `tree edge`（树边）。如果只保留树边并移除其他的，将得到\
    \ `DFS`。在无向图中，如果可以访问已访问的节点，那必须是 `backedge`。但对于有向图，只有当从一个灰色节点到另一个灰色节点时，才是 `backedge`。在\
    \ DFS 中，为每个节点保留时间戳，可以用于许多方法（例如：拓排序）。\n\n1. 当节点 `v` 从白色变为灰色时，记录在 `d[v]` 中。\n2.\
    \ 当节点 `v` 从灰色变为黑色时，记录在 `f[v]` 中。\n\n`d[]` 表示发现时间，`f[]` 表示完成时间。我们的伪代码如下：\n\n```text\n\
    Procedure DFS ( G):\n    for each node u in V[ G]\n        color[ u ] := white\n\
    \        parent[ u ] := NULL\n    end for\n    time := 0\n    for each node u\
    \ in V[ G]\n        if color[ u ] == white\n            DFS- Visit( u)\n\nProcedure\
    \ DFS - Visit( u):\n    color[ u ] := gray\n    time := time + 1\n    d[ u ] :=\
    \ time\n    for each node v adjacent to u\n        if color[ v ] == white\n  \
    \          parent[ v ] := u\n            DFS- Visit( v)\n    end for\n    color[\
    \ u ] := black\n    time := time + 1\n    f[ u ] := time\n```\n\n每个节点和边都被访问一次。因此\
    \ DFS 的复杂度为 `O(V+E)`，其中 `V` 表示节点，`E` 表示边。\n\n深度优先搜索的应用：\n- 在无向图中寻找所有路径。\n- 检测图中的环。\n\
    - 拓排序。\n- 寻找强连通分量。\n\n# 第 43 章：哈希函数\n\n## 第 43.1 节：常见类型的哈希值\n\n`System` 命名空间中的内置和常见类型通过\
    \ `GetHashCode()` 方法产生的哈希值如下：\n\n- `Boolean`：如果值为 true 则为 1，否则为 0。\n- `Byte`,\
    \ `UInt16`, `Int32`, `Single`（如有必要）。\n- `SByte`：`(( int ) m_value ^ ( int ) m_value\
    \ << 8 )`。\n- `Char`：`(( int ) m_value ^ ( int ) m_value << 16 )`。\n- `Int16`：`((\
    \ int ) (ushort) m_value) ^ (( int ) m_value << 16 )`。\n- `Int64`, `Double`：`unchecked((\
    \ int ) long ) m_value)) ^ ( int )(m_value >> 32 )`。\n- `UInt64`, `DateTime`,\
    \ `TimeSpan`：`(( int ) m_value) ^ ( int )(m_value >> 32 )`。\n- `Decimal`：`(( int\
    \ *)& dbl)[ 0 ]) & 0xFFF0) ^ (( int *)& dbl)[ 1 ]`。\n- `Object`：`RuntimeHelpers.GetHashCode\
    \ ()`。默认实现使用同步块索引。\n- `String`：哈希值的计算取决于平台类型（Win32 或 Win64）、使用随机字符串哈希特性、Debug\
    \ / Release 模式。在 Win64 平台下：\n```c\nint hash1 = 5381;\nint hash2 = hash1;\nint\
    \ c;\nchar * s = src;\nwhile (( c = s[ 0 ]) != 0 ) {\n    hash1 = (( hash1 <<\
    \ 5) + hash1) ^ c;\n    c = s[ 1 ];\n    if ( c == 0 ) break;\n    hash2 = ((\
    \ hash2 << 5) + hash2) ^ c;\n    s += 2;\n}\nreturn hash1 + ( hash2 * 1566083941);\n\
    ```\n- `ValueType`：查找第一个静态字段并获取其哈希值。如果类型没有静态字段，返回类型的哈希值。无法获取静态成员的哈希值，因为如果该成员与原始类型相同，计算将陷入无限循环。\n\
    - `Nullable<T>`：`return hasValue ? value.GetHashCode () : 0;`。\n- `Array`：遍历元素并使用\
    \ `(( ret << 5 ) + ret) ^ comparer.GetHashCode ( GetValue( i))` 计算哈希。\n\n参考文献：\n\
    \n## 第 43.2 节：哈希函数简介\n\n哈希函数 `h()` 是一种任意函数，它将任意大小的数据 `x ∈ X` 映射到固定大小的值 `y ∈ Y`：`y\
    \ = h( x)`。良好的哈希函数具有以下限制：\n\n- 哈希函数的行为类似于均匀分布\n- 哈希函数是确定性的。对于给定的 `x`，`h( x)` 应该总是返回相同的值。\n\
    \n"
- fmt: " own# fast calculating (has runtime O(1))\n\nIn general case size of hash\
    \ function less then size of input data: `| y| < | x|`. Hash functions are not\
    \ reversible or in other words it may be collision: `∃ x1, x2 ∈ X, x1 ≠ x2: h(\
    \ x1) = h( x2 )`. `X` may be ﬁnite or inﬁnite set and `Y` is finite set.\n\nHash\
    \ functions are used in a lot of parts of computer science, for example in software\
    \ engineering, cryptography, databases, networks, machine learning and so on.\
    \ There are many diﬀerent types of hash functions, with differing domain speciﬁ\
    \ properties. Often hash is an integer value. There are special methods in programmning\
    \ languages for hash calculating. For example, in `C#` `GetHashCode()` method\
    \ for all types returns `Int32` value (32 bit integer number). In `Java` every\
    \ class provides `hashCode()` method which return `int `. Each data type has own\
    \ or user deﬁned implementations.\n\n## Hash methods\n\nThere are several approaches\
    \ for determinig hash function. Without loss of generality, lets `x ∈ X = { z\
    \ ∈ ℤ: z ≥ 0 }` are positive integer numbers. Often `m` is prime (not too close\
    \ to an exact power of 2).\n\n## Method Hash function\n\n### Division method\n\
    `h( x) = x mod m`\n\n### Multiplication method\n`h( x) = ⌊m ( xA mod 1 ) ⌋, A\
    \ ∈ { z ∈ ℝ: 0 < z < 1 }`\n\n## Hash table\n\nHash functions used in hash tables\
    \ for computing index into an array of slots. `Hash table` is data structure for\
    \ implementing dictionaries (key-value structure). Good implemented hash tables\
    \ have `O(1)` time for the next operations: insert, search and delete data by\
    \ key. More than one keys may hash to the same slot. There are two ways for resolving\
    \ collision:\n\n1. **Chaining**: linked list is used for storing elements with\
    \ the same hash value in slot.\n2. **Open addressing**: zero or one element is\
    \ stored in each slot.\n\nThe next methods are used to compute the probe sequences\
    \ required for open addressing.\n\n## Method Formula\n\n### Linear probing\n`h(\
    \ x, i) = ( h'(x) + i) mod m`\n\n### Quadratic probing\n`h( x, i) = ( h'(x) +\
    \ c1*i + c2*i^2) mod m`\n\n### Double hashing\n`h( x, i) = ( h1( x) + i* h2( x))\
    \ mod m` Where `i ∈ { 0 , 1 , ..., m - 1 }`, `h'(x)`, `h1(x)`, `h2(x)` are auxiliary\
    \ hash functions, `c1, c2` are positive auxiliary constants.\n\n## Examples\n\n\
    Lets `x ∈ U{ 1 , 1000 }`, `h = x mod m`. The next table shows the hash values\
    \ in case of not prime and prime. Bolded text indicates the same hash values.\n\
    \n| x | m = 100 (not prime) | m = 101 (prime) |\n| :--- | :--- | :--- |\n| 72\
    \ | 23 | 16 |\n| 103 | 3 | 2 |\n| 73 | 38 | 31 |\n| 29 | 92 | 90 |\n| 61 | 61\
    \ | 61 |\n| 87 | 87 | 87 |\n| 995 | 95 | 86 |\n| 549 | 49 | 44 |\n| 991 | 91 |\
    \ 82 |\n| 757 | 57 | 50 |\n| 920 | 20 | 11 |\n| 626 | 26 | 20 |\n| 557 | 57 |\
    \ 52 |\n| 831 | 31 | 23 |\n| 619 | 19 | 13 |\n\n## Links \n- Thomas H. Cormen,\
    \ Charles E. Leiserson, Ronald L. Rivest, Cliﬀord Stein. Introduction to Algorithms.\n\
    - Overview of Hash Tables Wolfram MathWorld - Hash Function\n\n## Chapter 44:\
    \ Travelling Salesman\n\n### Section 44.1: Brute Force Algorithm\nA path through\
    \ every vertex exactly once is the same as ordering the vertex in some way. Thus,\
    \ to calculate the minimum cost of travelling through every vertex exactly once,\
    \ we can brute force every single one of the `N!` permutations of the numbers\
    \ from 1 to `N`.\n\n### Psuedocode\n```python\nminimum = INF\n\nfor all permutations\
    \ P\n  current = 0\n  for i from 0 to N - 2\n    current = current + cost[ P[\
    \ i]][ P[ i+ 1 ]] # Add the cost of going from 1 vertex to the next\n  current\
    \ = current + cost[ P[ N - 1 ]][ P[ 0 ]] # Add the cost of going from last vertex\
    \ to the first\n  if current < minimum: # Update minimum if necessary\n    minimum\
    \ = current\noutput minimum\n```\n\n### Time Complexity\nThere are `N!` permutations\
    \ to go through and the cost of each path is calculated in `O( N) `, thus this\
    \ algorithm takes `O( N * N!)` time to output the exact answer.\n\n### Section\
    \ 44.2: Dynamic Programming Algorithm\nNotice that if we consider the path (in\
    \ order):\n`( 1 ,2 ,3 ,4 ,6 ,0 ,5 ,7 )`\nand the path `( 1 ,2 ,3 ,5 ,0 ,6 ,7 ,4\
    \ )`\nThe cost of going from vertex 1 to vertex 2 to vertex 3 remains the same,\
    \ so why must it be recalculated? This result can be saved for later use.\n\n\
    Let `dp[ bitmask][ vertex]` represent the minimum cost of travelling through all\
    \ the vertices whose corresponding bit in `bitmask` is set to 1 ending at vertex.\
    \ For example:\n`dp[ 12 ][ 2 ]`\n`12 = 1 1 0 0`\n`^ ^`\n`vertices: 3 2 1 0`\n\
    Since `12` represents `1100` in binary, `dp[ 12 ][ 2 ]` represents going through\
    \ vertices 2 and 3 in the graph with the path ending at vertex 2.\n\nThus we can\
    \ have the following algorithm (C++ implementation):\n```cpp\nint cost[ N][ N];\n\
    int memo[1 << N][ N];\n\nint TSP( int bitmask, int pos){\n    int cost = INF;\n\
    \n    if ( bitmask == (( 1 << N) - 1 ){ \n        return cost[ pos][ 0 ];\n  \
    \  }\n\n    if ( memo[ bitmask][ pos] != -1 ){ \n        return memo[ bitmask][\
    \ pos]; \n    }\n\n    for ( int i = 0 ; i < N ; ++ i){ \n        if (( bitmask\
    \ & (1 << i)) == 0 ){ //If the vertex has not been visited\n            cost =\
    \ min( cost,TSP( bitmask | (1 << i) , i) + cost[ pos][ i]); //Visit the vertex\n\
    \        }\n    }\n\n    memo[ bitmask][ pos] = cost; //Save the result\n    return\
    \ cost;\n}\n//Call TSP(1,0)\n//Adjust the value of N if needed \n//Set everything\
    \ here to -1\n//All vertices have been explored \n//Cost to go back\n//If this\
    \ has already been computed\n//Just return the value, no need to recompute\n//For\
    \ every vertex\n```\nThis line may be confusing, so lets go through it:\n`memo[\
    \ bitmask][ pos] = cost; //Save the result`\n`return cost;}`\nThis represents\
    \ the computed value, no need to recompute.\n`//For every vertex`\n`for ( int\
    \ i = 0 ; i < N ; ++ i){`\n`if (( bitmask & (1 << i)) == 0 ){ //If the vertex\
    \ has not been visited`\n`cost = min( cost,TSP( bitmask | (1 << i) , i) + cost[\
    \ pos][ i]); //Visit the vertex`\n`}`\nThis represents visiting the vertex.\n\
    `memo[ bitmask][ pos] = cost; //Save the result`\nThis represents saving the result.\n\
    `if ( memo[ bitmask][ pos] != -1 ){ return memo[ bitmask][ pos]; }`\nThis represents\
    \ if this has already been computed.\n`if ( bitmask == (( 1 << N) - 1 ){ return\
    \ cost[ pos][ 0 ]; }`\nThis represents the cost to go back.\n`int TSP( int bitmask,\
    \ int pos){`\nThis represents the function signature.\n`int cost = INF;`\nThis\
    \ represents the initialization of cost.\n`int memo[1 << N][ N];`\nThis represents\
    \ the memoization table.\n`int cost[ N][ N];`\nThis represents the cost matrix.\n\
    `//Call TSP(1,0)`\nThis represents calling the function.\n`//Adjust the value\
    \ of N if needed`\nThis represents adjusting N.\n`//Set everything here to -1`\n\
    This represents initializing the memo table.\n`//All vertices have been explored`\n\
    This represents the base case.\n`//Cost to go back`\nThis represents the base\
    \ case return.\n`//If this has already been computed`\nThis represents the check\
    \ for memoization.\n`//Just return the value, no need to recompute`\nThis represents\
    \ returning the memoized value.\n`//For every vertex`\nThis represents the loop\
    \ over vertices.\n`This line may be confusing, so lets go through it:`\n`memo[\
    \ bitmask][ pos] = cost; //Save the result`\n`return cost;}`\nThis represents\
    \ the end of the function.\n`if (( bitmask & (1 << i)) == 0 ){ //If the vertex\
    \ has not been visited`\nThis represents the check for an unvisited vertex.\n\
    `1 << i`\nThis represents the bit for the vertex.\n`cost = min( cost,TSP( bitmask\
    \ | (1 << i) , i) + cost[ pos][ i]); //Visit the vertex`\nThis represents the\
    \ recursive call and cost update.\n`bitmask | (1 << i)`\nThis represents marking\
    \ the vertex as visited.\n\n### Time Complexity\nThere are `N!` permutations to\
    \ go through and the cost of each path is calculated in `O( N) `, thus this algorithm\
    \ takes `O( N * N!)` time to output the exact answer.\n\n## Chapter 45: Knapsack\
    \ Problem\n\n### Section 45.1: Knapsack Problem\nGiven a set of items where each\
    \ item contains a weight and value, determine the number each to include in a\
    \ collection so that the total weight is less or equal to a given limit and the\
    \ total value is as large as possible.\n\nPseudo code for Knapsack\nGiven:\n1.\
    \ Values(array v)\n2. Weights(array w)\n3. Number of items(n)\n4. Capacity(W)\n\
    `for j from 0 to W do :`\n`m[ 0 , j] := 0`\n`for i from 1 to n do :`\n`for j from\
    \ 0 to W do :`\n`if w[i] > j then:`\n`m[i, j] := m[ i - 1 , j]`\n`else:`\n`m[i,\
    \ j] := max( m[ i - 1 , j], ... )`\n\nA simple implementation of the above code\
    \ using Python:\n```python\ndef knapsack( W, wt, val, n):\n    K = [[0 for x in\
    \ range(W+ 1)] for x in range(n+ 1)]\n    for i in range(n+ 1):\n        for w\
    \ in range(W+ 1):\n            if i== 0 or w== 0:\n                K[i][w] = 0\n\
    \            elif wt[ i - 1 ] <= w:\n                K[i][w] = max( val[ i - 1\
    \ ] + K[ i - 1 ][ w - wt[ i - 1 ] , K[ i - 1 ][ w])\n            else:\n     \
    \           K[i][w] = K[ i - 1 ][ w]\n    return K[ n][ W]\n```\nRunning the code:\n\
    `val = [ 60 , 100 , 120 ]`\n`wt = [ 10 , 20 , 30 ]`\n`W = 50`\n`n = len( val)`\n\
    `print( knapsack( W, wt, val, n))`\nOutput: 220\n\nTime Complexity of the above\
    \ code: O(nW) where n is the number of items and W is the capacity of knapsack.\n\
    \n### Section 45.2: Solution Implemented in C#\n```csharp\npublic class KnapsackProblem\n\
