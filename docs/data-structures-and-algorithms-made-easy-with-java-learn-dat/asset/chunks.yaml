    奇偶排序（Odd-Even Sort），也称为交错排序，是一种在并行处理器上开发的简单排序算法。它通过对相邻的奇数索引和偶数索引元素进行交换来排序，直到列表有序完成。\n\
    \n奇偶排序的伪代码：\n```python\nif not_sorted:\n    odd = false\n    for i from 0 to n-2\
    \ step 2:\n        if array[i] > array[i+1]:\n            swap array[i], array[i+1]\n\
    \            odd = true\n    even = false\n    for i from 1 to n-2 step 2:\n \
    \       if array[i] > array[i+1]:\n            swap array[i], array[i+1]\n   \
    \         even = true\n    while odd or even\n```\n\n奇偶排序的图示：\n![](img/rsrc2J.jpg)奇偶排序的图示：![](img/rsrc2K.jpg)奇偶排序的图示：![](img/rsrc2L.jpg)奇偶排序的图示：\n\
