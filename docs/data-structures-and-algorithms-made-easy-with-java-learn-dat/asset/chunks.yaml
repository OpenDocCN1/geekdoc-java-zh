  trans: "\n\n# 二分查找\n\n二分查找的工作原理是在每次迭代中，通过将目标值与搜索空间的中间值进行比较，将搜索空间减半。要使用二分查找，搜索空间必须以某种方式进行排序（有序）。重复的条目（根据比较函数判断为相等的条目）无法区分，尽管它们并没有违反二分查找的性质。通常情况下，我们使用小于（`<`）作为比较函数。如果\
    \ `a < b`，则返回真；如果 `a` 不小于 `b` 且 `b` 不小于 `a`，则 `a` 和 `b` 相等。\n\n## 示例问题\n\n你是一个经济学家，而且水平相当糟糕。你被赋予的任务是寻找大米的均衡价格（即供需相等的价格）。\n\
    \n请记住，价格设定得越高，供给越大，需求越少。\n\n由于你的公司计算市场力量方面非常高效，当大米价格设定为某个价格 `p` 时，你可以立即获得以大米为单位的供需。你的老板希望尽快得到均衡价格，但告诉你是均衡价格可以是最大为\
    \ `10¹⁷` 的正整数，并且保证在该范围内恰好有一个正整数解。所以在你丢掉工作之前快开始吧！你被允许调用函数 `getSupply(k)` 和 `getDemand(k)`，它们将完全执行问题中描述的操作。\n\
    \n## 示例解释\n\n在这里我们的搜索空间是从 `1` 到 `10¹⁷`。因此，线性搜索是不可行的。但注意，随着 `k` 的增大，`getSupply(k)`\
    \ 增加而 `getDemand(k)` 减少。因此，对于任何 `x > y`，`getSupply(x) > getSupply(y)` 且 `getDemand(x)\
    \ < getDemand(y)`。因此，这个搜索空间是单调的，我们可以使用二分查找。下面的伪代码演示了二分查找的使用：\n\n```\nhigh = 100000000000000000\
    \ low = 1\nwhile high - low > 1:\n    mid = ( high + low) / 2\n    supply = getSupply(\
    \ mid)\n    demand = getDemand( mid)\n    if supply > demand:\n        high =\
    \ mid // 答案在搜索空间的下半部分\n```    else if demand > supply:\n        low = mid // 答案在搜索空间的上半部分\n\
    \    else:\n        return mid // 找到 supply == demand 条件解\nreturn mid\n```\n\n\
    该算法的运行时间为 `~O(log 10¹⁷)`。这可以推广为 `~O(log S)` 时间，其中 `S` 是搜索空间的大小，因为在 `while` 循环的每次迭代中，我们都将搜索空间减半（从\
    \ `[low:high]` 变为 `[low:mid]` 或 `[mid:high]`）。\n\n### 使用递归实现二分查找的 C 代码\n\n```c\n\
    int binsearch(int a[], int x, int low, int high) {\n    int mid;\n    if (low\
    \ > high) return 1;\n    mid = (low + high) / 2;\n    if (x == a[mid]) {\n   \
    \     return (mid);\n    } else {\n        if (x < a[mid]) {\n            binsearch(a,\
    \ x, low, mid - 1);\n        } else {\n            binsearch(a, x, mid + 1, high);\n\
    \        }\n    }\n}\n```\n\n# 第 39.2 节：Rabin Karp\n\nRabin–Karp 算法或 Rabin Karp\
    \ 算法是一种字符串搜索算法，使用哈希在文本中查找一组模式字符串中的任意一个。它的平均和最佳情况运行时间为 `O(n+m)`，空间为 `O(p)`，但其最坏情况时间为\
    \ `O(nm)`，其中 `n` 是文本长度，`m` 是模式长度。\n\n### Java 语言算法实现\n\n```java\nvoid findPattern(String\
    \ text, String pattern) {\n    /* q 为质数\n       p 为模式的哈希值\n       t 为文本的哈希值\n\
    \       d 是字母表中唯一字符的数目 */\n    int d = 128;\n    int q = 100;\n    int n = text.length();\n\
    \    int m = pattern.length();\n    int t = 0, p = 0;\n    int h = 1;\n    //\
    \ 哈希值计算函数\n    for (int i = 0; i < m - 1; i++)\n        h = (h * d) % q;\n   \
    \ for (int i = 0; i < m; i++) {\n        p = (d * p + pattern.charAt(i)) % q;\n\
    \    }\n    // 搜索模式\n    for (int i = 0; i < n - m; i++) {\n        if (p == t)\
    \ {\n            // 如果哈希值匹配，则逐字符比较\n            for (int j = 0; j < m; j++) {\n\
    \                if (text.charAt(i + j) != pattern.charAt(j))\n              \
    \      break;\n            }\n            if (j == m)\n                System.out.println(\"\
    Pattern match found at index \" + i);\n        }\n        if (i < n - m) {\n \
    \           t = (d * (t - text.charAt(i) * h) + text.charAt(i + m)) % q;\n   \
    \         if (t < 0)\n                t = t + q;\n        }\n    }\n}\n```\n\n"
- fmt: "\n```cpp\nint N = 100 ; // number of entries in search space;\nint high, low,\
    \ mid; // our temporaries\nint x; // value to search for\nlow = 0 ;\nhigh = N\
    \ - 1 ;\n\nwhile ( low < high)\n{\n    mid = ( low + high)/ 2 ;\n    if ( array[\
    \ mid] < x) \n        low = mid + 1 ;\n    else\n        high = mid;\n}\n\nif\
    \ ( array[ low] == x) // found, index is low \nelse // not found\n```\n\nFound,\
    \ the index is `low`, else not found. Do not attempt to return early by comparing\
    \ `array[mid]` to `x` for equality. The extra comparison can only slow the code\
    \ down. Note you need to add one to `low` to avoid becoming trapped by integer\
    \ division always rounding down.\n\nInterestingly, the above version of binary\
    \ search allows you to find the smallest occurrence of `x` in the array. If the\
    \ array contains duplicates of `x`, the algorithm can be modified slightly in\
    \ order for it to return the largest occurrence of `x` by simply adding to the\
    \ if conditional:\n\n```cpp\nwhile ( low < high) {\n    mid = low + (( high -\
    \ low) / 2 );\n    if ( array[ mid] < x || ( array[ mid] == x && array[ mid +\
    \ 1 ] == x))\n        low = mid + 1 ;\n    else\n        high = mid;\n}\n```\n\
    \nNote that instead of doing `mid = ( low + high) / 2`, it may also be a good\
    \ idea to try `mid = low + (( high - low) / 2 )` for implementations such as Java\
    \ implementations to lower the risk of getting an overflow for really large inputs.\n\
    \n## Section 39.5: Linear search\n\nLinear search is a simple algorithm. It loops\
    \ through items until the query has been found, which makes it a linear algorithm\
    \ - the complexity is `O(n)`, where `n` is the number of items to go through.\n\
    \n### Why O(n)?\nIn worst-case scenario, you have to go through all of the `n`\
    \ items. It can be compared to looking for a book in a stack of books - you go\
    \ through them all until you find the one that you want.\n\nBelow is a Python\
    \ implementation:\n\n```python\ndef linear_search(searchable_list, query):\n \
    \   for x in searchable_list:\n        if query == x:\n            return True\n\
    \    return False\n```\n"
