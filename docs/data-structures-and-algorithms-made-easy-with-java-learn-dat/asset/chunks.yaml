  trans: "\n# 快速计算（运行复杂度 O(1)）\n\n在一般情况下，哈希函数的大小小于输入数据的大小：`| y| < | x|`。哈希函数是逆的，换句话说，它们可能会发生冲突：`∃\
    \ x1, x2 ∈ X, x1 ≠ x2: h( x1) = h( x2 )`。`X` 可能是有限或无限集，而 `Y` 是有限集。\n\n哈希函数用于计算机科学的许多领域，例如软件工程、密码学、数据库、网络、机器学习等。有许多不同类型的哈希函数，具有不同的特定领域属性。哈值通常是一个整数值。编程语言中提供了特殊的方法来计算哈希。例如，在\
    \ `C#` 中，所有类型的 `GetHashCode()` 方法都返回 `Int32` 值（32 位整数）。在 `Java` 中，每个类都提供一个 `hashCode()`\
    \ 方法，返回 `int`。每种数据类型都有自己的或用户定义的实现。\n\n## 哈希方法\n\n确定哈希函数有几种方法。在不失一般性的情况下，假设 `x\
    \ ∈ X = { z ∈ ℤ: z ≥ 0 }` 是正整数。通常 `m` 是质数（不要太接近 2 的幂）。\n\n## 哈希函数方法\n\n### 除法法\n\
    `h( x) = x mod m`\n\n### 乘法法\n`h( x) = ⌊m ( xA mod 1 ) ⌋, A ∈ { z ∈ ℝ: 0 < z <\
    \ 1 }`\n\n## 哈希表\n\n哈希函数用于哈希表中计算到槽位数组的索引。`哈希表`是实现字典（键值结构）的数据结构。实现良好的哈希表在执行后续操作时具有\
    \ `O(1)` 时间：插入、搜索和通过键删除数据。多个键可能会哈希到同一个槽位。解决冲突有两种方法：\n\n1. **链法**：使用链表存储槽位中具有相同哈希值的元素。\n\
    2. **开放地址法**：每个槽位存储零个或一个元素。\n\n以下方法用于计算开放地址法所需的探测序列。\n\n## 方法公式\n\n### 线性探测\n\
    `h( x, i) = ( h'(x) + i) mod m`\n\n### 二次探测\n`h( x, i) = ( h'(x) + c1*i + c2*i²)\
    \ mod m`\n\n### 双重哈希\n`h( x, i) = ( h1( x) + i* h2( x)) mod m` 其中 `i ∈ { 0 , 1\
    \ , ..., m - 1 }`，`h'(x)`, `h1(x)`, `h2(x)` 是辅助哈希函数，`c1, c2` 是正辅助常量。\n\n## 示例\n\
    \n假设 `x ∈ U{ 1 , 1000 }`，`h = x mod m`。下表显示了非质数和质数情况下的哈值。粗体文本表示相同的哈值。\n\n| x |\
    \ m = 100 (非质数) | m = 101 (质数) |\n| :--- | :--- | :--- |\n| 72 | 23 | 16 |\n|\
    \ 103 | 3 | 2 |\n| 73 | 38 | 31 |\n| 29 | 92 | 90 |\n| 61 | 61 | 61 |\n| 87 |\
    \ 87 | 87 |\n| 995 | 95 | 86 |\n| 549 | 49 | 44 |\n| 991 | 91 | 82 |\n| 757 |\
    \ 57 | 50 |\n| 920 | 20 | 11 |\n| 626 | 26 | 20 |\n| 557 | 57 | 52 |\n| 831 |\
    \ 31 | 23 |\n| 619 | 19 | 13 |\n\n## 链接 \n- Thomas H. Cormen, Charles E. Leiserson,\
    \ Ronald L. Rivest, Cliﬀord Stein. Introduction to Algorithms.\n- Overview of\
    \ Hash Tables Wolfram MathWorld - Hash Function\n\n## 第 44 章：旅行商问题\n\n### 第 44.1\
    \ 节：暴力破解算法\n通过每个顶点一次的路径等同于以某种方式对顶点进行排序。因此，为了计算通过每个顶点一次的旅行最小成本，我们可以暴力遍历从 1 到 `N`\
    \ 的所有 `N!` 种排列。\n\n### 伪代码\n```python\nminimum = INF\n\nfor all permutations P\n\
    \  current = 0\n  for i from 0 to N - 2\n    current = current + cost[ P[ i]][\
    \ P[ i+ 1 ]] # 添加从一个顶点到下一个顶点的成本\n  current = current + cost[ P[ N - 1 ]][ P[ 0\
    \ ]] # 添加从最后一个顶点到第一个顶点的成本\n  if current < minimum: # 必要时更新最小值\n    minimum = current\n\
    output minimum\n```\n\n### 时间复杂度\n有 `N!` 个排列需要遍历，每条路径的成本在 `O( N)` 内计算，因此该算法需要\
    \ `O( N * N!)` 时间来输出精确答案。\n\n### 第 44.2 节：动态规划算法\n注意，如果我们考虑路径（按顺序）：\n`( 1 ,2 ,3\
    \ ,4 ,6 ,0 ,5 ,7 )`\n和路径 `( 1 ,2 ,3 ,5 ,0 ,6 ,4 )`\n从顶点 1 到顶点 2 再到顶点 3 的成本是相同的，所以为什么要重新计算？这个结果可以保存起来以后使用。\n\
    `dp[bitmask][vertex]` 表示遍历所有 `bitmask` 中设置为 1 的顶点的旅行成本。例如：\n`dp[12][2 ]`\n`12\
    \ = 1100`\n`vertices: 3 2 1 0`\n由于 `12` 代表二进制 `1100`，`dp[12][2 ]` 表示在顶点 2 处结束的顶点\
    \ 2。\n\n因此我们可以有以下算法（C++ 实现）：\n```cpp\nint cost[ N][ N];\nint memo[1 << N][ N];\n\
    \nint TSP( int bitmask, int pos){\n    int cost = INF;\n\n    if (bitmask == ((1\
    \ << N) - 1 ){ \n        return cost[ pos][ 0 ];\n    }\n\n    if ( memo[bitmask][\
    \ pos] != -1 ){ \n        return memo[bitmask][ pos]; \n    }\n\n    for ( int\
    \ i = 0 ; i < N ; i++){\n        if ((bitmask & (1 << i)) == 0 ){ // 如果顶点未被访问\n\
    \            cost = min( cost,TSP( bitmask | (1 << i) , i) + cost[ pos][ i]);\
    \ // 访问顶点\n        }\n    }\n\n    memo[bitmask][ pos] = cost; // 保存结果\n    return\
    \ cost;\n}\n// 调用 TSP(1,0)\n// 如果需要调整 N 的值\n// 将此处所有内容设为 -1\n// 所有顶点都已探索\n// 回溯成本\n\
    // 如果已经计算过\n// 直接返回值，不需要重新计算\n// 每个顶点\n```\n这行代码可能让人困惑，让我们过一遍：\n`memo[bitmask][\
    \ pos] = cost; // 保存结果`\n`return cost;}`\n这代表计算出的值，不需要重新计算。\n`每个顶点`\n`for ( int\
    \ i = 0 ; i < N ; i++){`\n`if ((bitmask & (1 << i)) == 0 ){ // 如果顶点未被访问`\n`cost\
    \ = min( cost,TSP( bitmask | (1 << i) , i) + cost[ pos][ i]); // 访问顶点`\n`}`\n\
    这代表访问顶点。\n`memo[bitmask][ pos] = cost; // 保存结果`\n这代表保存结果。\n`if ( memo[bitmask][\
    \ pos] != -1 ){ return memo[bitmask][ pos]; }`\n这代表已经计算过。\n`if ( bitmask == ((1\
    \ << N) - 1 ){ return cost[ pos][ 0 ]; }`\n这代表回溯成本。\n\n### 时间复杂度\n有 `N!` 个排列需要遍历，每条路径的成本在\
    \ `O( N)` 内计算，因此该算法需要 `O( N * N!)` 时间来输出精确答案。\n\n## 第 45 章：背包问题\n\n### 第 45.1\
    \ 节：背包问题\n给定一组物品，每个物品包含重量和价值，确定在集合中包含每种物品的数量，使得总重量小于或等于给定的限制，且总价值最大。\n\n背包问题的伪代码：\n\
    给定：\n1. 价值(数组 v)\n2. 重量(数组 w)\n3. 物品数量(n)\n4. 容量(W)\n`for j from 0 to W do :`\n\
    `m[ 0 , j] := 0`\n`for i from 1 to n do :`\n`for j from 0 to W do :`\n`if w[i]\
    \ > j then:`\n`m[i, j] := m[ i - 1 , j]`\n`else:`\n`m[i, j] := max( m[ i - 1 ,\
    \ j ], val[ i - 1 ] + m[ i - 1 , j - w[i] ])`\n\n使用 Python 实现上述代码：\n```python\n\
    def knapsack( W, wt, val, n):\n    K = [[0 for x in range(W+ 1)] for x in range(n+\
    \ 1)]\n    for i in range(n+ 1):\n        for w in range(W+ 1):\n            if\
    \ i== 0 or w== 0:\n                K[i][w] = 0\n            elif wt[ i - 1 ] <=\
    \ w:\n                K[i][w] = max( val[ i - 1 ] + K[i - 1][w - wt[ i - 1 ]],\
    \ K[i - 1][w])\n            else:\n                K[i][w] = K[i - 1][w]\n   \
    \ return K[n][ W]\n```\n运行代码：\n`val = [ 60 , 100 , 120 ]`\n`wt = [ 10 , 20 , 30\
    \ ]`\n`W = 50`\n`n = len( val)`\n`print( knapsack( W, wt, val, n))`\n输出：220\n\n\
    上述代码的时间复杂度为 O(nW)，其中 n 是物品数量，W 是背包容量。\n\n### 第 45.2 节：C# 实现\n```csharp\npublic\
    \ class KnapsackProblem\n{\n    private static int Knapsack(int w, int[] weight,\
    \ int[] value, int n)\n    {\n        int i;\n        int[,] k = new int[n + 1,\
    \ w + 1]; \n        for (i = 0; i <= n; i++)\n        {\n            int b;\n\
    \            for (b = 0; b <= w; b++)\n            {\n                if (i ==\
    \ 0 || b == 0)\n                {\n                    k[i, b] = 0;\n        \
    \        }\n                else if (weight[i - 1] <= b)\n                {\n\
    \                    k[i, b] = Math.Max(value[i - 1] + k[i - 1, b - weight[i -\
    \ 1]], k[i - 1, b]);\n                }\n                else\n              \
    \  {\n                    k[i, b] = k[i - 1, b];\n                }\n        \
    \    }\n        }\n        return k[n, w];\n    }\n\n    public static int Main(int\
    \ nItems, int[] weights, int[] values)\n    {\n        int n = values.Length;\n\
    \        return Knapsack(nItems, weights, values, n);\n    }\n}\n```\n\n## 第 46\
    \ 章：方程求解\n\n### 第 46.1 节：线性方程\n求解线性方程的方法有两类：\n\n"
- fmt: "\n# 1. Direct Methods\nCommon characteristics of direct methods are that they\
    \ transform the original equation into equivalent equations that can be solved\
    \ more easily, means we get solve directly from an equation.\n\n# 2. Iterative\
    \ Method\nIterative or Indirect Methods, start with a guess of the solution and\
    \ then repeatedly reﬁne the solution until a certain convergence criterion is\
    \ reached. Iterative methods are generally less eﬃcient than direct methods because\
    \ large number of operations required. Example- `Jacobi's Iteration Method`, `Gauss-Seidal\
    \ Iteration Method`.\n\n## Implementation in C\n```c\n//Implementation of Jacobi's\
    \ Method\nvoid JacobisMethod( int n, double x[ n] , double b[ n] , double a[ n][\
    \ n]){\n    double Nx[ n]; //modified form of variables\n    int rootFound= 0\
