    \n### Complexity\n\nThe complexity of computing DTW is `O(m * n)` where `m` and\
    \ `n` represent the length of each sequence. Faster techniques for computing DTW\
    \ include `PrunedDTW`, `SparseDTW` and `FastDTW`.\n\n### Applications\n"
