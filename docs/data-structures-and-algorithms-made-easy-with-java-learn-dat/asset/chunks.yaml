    \ the heuristics for, but did not move to, as orange, and the node which we chose\
    \ as cyan:\n\n![](rsrc2FJ.jpg) Alright, now let's calculate the same heuristics\
    \ for the nodes around the cyan node:\n\n![](rsrc2FK.jpg) Again, we choose the\
    \ node going down from the cyan node, as all the options have the same f value:\
    \ ![](rsrc2FM.jpg) Let's calculate the heuristics for the only neighbour that\
    \ the cyan node has:\n\n![](rsrc2FN.jpg) Alright, since we will follow the same\
    \ pattern we have been following: ![](rsrc2FP.jpg) Once more, let's calculate\
