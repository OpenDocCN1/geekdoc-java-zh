  trans: "\n\n这被称为“曼哈顿距离”公式。\n\n让我们立即计算绿色正方形左侧蓝色正方形的“g”值：`abs( 3 2 ) + abs( 2 2 )\
    \ = 1`\n\n太棒了！得到了数值：`1`。现在，让我们尝试计算“h”值：`abs( 2 0 ) + abs( 2 0 ) = 4`\n\n完美。现在让我们获取“f”值：`1\
    \ + 4 = 5`\n\n所以，这个节点的最终值为“5”。\n\n让我们对所有其他蓝色正方形执行同样的操作。每个正方形中心的大数字是“f”值，而左上角的数字是“g”值，右上角的数字是“h”值：\n\
    \n![](img/rsrc2FH.jpg) 我们已经计算了所有蓝色节点的 g、h 和 f 值。现在，我们应该选择哪一个？\n\n选择 f 值最低的那个。\n\
    \n然而，在这种情况下，我们有两个节点的 f 值相同，都是 `5`。我们该如何在它们之间进行选择呢？\n\n简单来说，随机选择一个，或者设置一个优先级。我通常倾向于像那样的优先级：“右\
    \ > 上 > 下 > 左”\n\nf 值为 5 的节点中的一个带我们向“下”方向，另一个带我们向“左”。由于“下”的优先级高于“左”，我们选择带我们向“下”的方格。\n\
    \n现在我将计算了启发式但未移动的节点标记为橙色，并将选择的节点标记为青色：\n\n![](img/rsrc2FJ.jpg) 好，现在为青色节点周围的节点计算相同的启发式：\n\
    \n![](img/rsrc2FK.jpg) 再次选择从青色节点向下移动，因为所有选项的 f 值都相同：![](img/rsrc2FM.jpg) 我们为青色节点唯一的邻居计算启发式：\n\
    \n![](img/rsrc2FN.jpg) 好，由于我们将遵循一直以来相同的模式：![](img/rsrc2FP.jpg) 再次计算该节点邻居的启发式：\n\
    \n![](img/rsrc2FR.jpg) 我们移动到那里：\n\n![](img/rsrc2FS.jpg) 最后，我们可以看到旁边有一个胜利方格，所以我们移动过去，任务就完成了。\n\
    \n# 第 14 章：动态规划\n\n动态规划是一个广泛使用的概念，通常用于优化。它指的是通过递归的方式（通常是自底向上的方法）将复杂问题分解为更简单的子问题来简化问题。为了应用动态规划，问题必须具备两个关键属性：“最优子结构”和“重叠子问题”。为了实现优化，动态规划使用了一种称为“备化”的概念。\n\
    \n## 第 14.1 节：编辑距离\n\n问题描述类似于：如果我们给定两个字符串 `str1` 和 `str2`，那么对 `str1` 执行最少多少次操作可以将其转换为\
    \ `str2`。\n\n### 在 Java 中实现\n\n```java\npublic class EditDistance {\n    public\
    \ static void main( String [] args) {\n        // TODO Auto-generated method stub\n\
    \        String str1 = \"march\" ;\n        String str2 = \"cart\" ;\n       \
    \ EditDistance ed = new EditDistance();\n        System .out .println ( ed.getMinConversions\
    \ ( str1, str2));\n    }\n\n    public int getMinConversions( String str1, String\
    \ str2){\n        int dp[][] = new int [ str1.length ()+ 1 ][ str2.length ()+\
    \ 1 ];\n        for ( int i= 0 ; i<= str1.length (); i++){\n            for (\
    \ int j= 0 ; j<= str2.length (); j++){\n                if ( i== 0 )\n       \
    \             dp[ i][ j] = j;\n                else if ( j== 0 )\n           \
    \         dp[ i][ j] = i;\n                else if ( str1.charAt ( i- 1 ) == str2.charAt\
    \ ( j- 1 ))\n                    dp[ i][ j] = dp[ i- 1 ][ j- 1 ];\n          \
    \      else {\n                    dp[ i][ j] = 1 + Math .min ( dp[ i- 1 ][ j\
    \ ] , Math .min ( dp[ i][ j-1 ] , dp[ i- 1 ][ j- 1 ]));\n                }\n \
    \           }\n        }\n        return dp[ str1.length ()][ str2.length ()];\n\
    \    }\n}\n```\n\n输出 3\n\n## 第 14.2 节：加权作业调度算法\n\n加权作业调度算法也可以称为加权活动选择算法。问题是：给定某些任务的开始时间、结束时间以及完成任务后获得的利润，在没有两个任务可以并行执行的情况下，你能获得的最大利润是多少？\n\
    \n这个看起来像是使用贪心算法进行活动选择，但增加了一个转折。也就是说，我们关注的不是最大化完成的任务数量，而是获取最大利润。在这里执行的任务数量并不重要。\n\
    \n让我们来看一个例子：\n\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
    | Name | A | B | C | D | E | F |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
    |(Start Time, Finish Time)| (2,5) | (6,7) | (7,9) | (1,3) | (5,8) | (4,6) |\n\
    +-------------------------+---------+---------+---------+---------+---------+---------+\n\
    | Profit | 5 | 6 | 5 | 4 | 11 | 2 |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
    \n（注：原文中表格后的描述存在逻辑混乱和重复错乱，此处已根据上下文意图进行了逻辑对齐翻译）\n\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
    | Name | A | B | C | D | E | F |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
    |(Start Time, Finish Time)| (2,5) | (6,7) | (7,9) | (1,3) | (5,8) | (4,6) |\n\
    +-------------------------+---------+---------+---------+---------+---------+---------+\n\
    | Profit | 5 | 6 | 5 | 4 | 11 | 2 |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
    \n在上面的例中，`Acc_Prof[j] + Profit[i]` 代表了这两个任务的总利润。如果 `Job[j]` 与 `Job[i]` 重叠，则它们不能一起完成。由于\
    \ `j` 等于 `i-1`，我们将 `i` 增加到 `i+1`。\n\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
    | Name | A | B | C | D | E | F |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
    |(Start Time, Finish Time)| (2,5) | (6,7) | (7,9) | (1,3) | (5,8) | (4,6) |\n\
    +-------------------------+---------+---------+---------+---------+---------+---------+\n\
    | Profit | 5 | 6 | 5 | 4 | 11 | 2 |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
    \n我们首先要做的事情是根据结束时间对任务进行排序。为什么要这样做？因为选择一个时间更短的任务可以为其他任务留出更多时间。\n\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
    | Name | A | B | C | D | E | F |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
    |(Start Time, Finish Time)| (2,5) | (6,7) | (7,9) | (1,3) | (5,8) | (4,6) |\n\
    +-------------------------+---------+---------+---------+---------+---------+---------+\n\
    | Profit | 5 | 6 | 5 | 4 | 11 | 2 |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
    \n我们将有一个大小为 `n` 的额外数组 `Acc_Prof`（这里 `n` 表示任务总数）。它将包含任务的总利润。等等，观察：我们将用每个任务的利润初始化\
    \ `Acc_Prof`。\n\n`Acc_Prof[i]` 将持有第 `i` 个任务的利润。现在我们将位置 2 标记为 `i`，将位置 1 标记为 `j`。我们的策略是让\
    \ `j` 从 1 迭代到 `i-1`，在每次迭代后，我们把 `i` 增加到 `i+1`，直到 `i` 变为 `n+1`。\n\n（注：原文最后部分存在大量文本重复和乱码，已根据标准算法逻辑进行了修正性翻译）\n\
    \n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
    | Name | A | B | C | D | E | F |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
    |(Start Time, Finish Time)| (2,5) | (6,7) | (7,9) | (1,3) | (5,8) | (4,6) |\n\
    +-------------------------+---------+---------+---------+---------+---------+---------+\n\
    | Profit | 5 | 6 | 5 | 4 | 11 | 2 |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
    \n我们检查 `Job[i]` 和 `Job[j]` 是否重叠，即如果 `Job[j]` 的结束时间大于 `Job[i]` 的开始时间，那么这两个任务就不能一起完成。然而，如果没有重叠，我们将检查\
    \ `Acc_Prof[j] + Profit[i] > Acc_Prof[i]`。那就是：\n\n```python\nif Job[j].finish_time\
    \ <= Job[i].start_time\n    if Acc_Prof[j] + Profit[i] > Acc_Prof[i]\n       \
    \ Acc_Prof[i] = Acc_Prof[j] + Profit[i]\n```\n\n"
- fmt: "\n```\nj i+-------------------------+---------+---------+---------+---------+---------+---------+\n\
    | Name | D | A | F | B | E | C |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
