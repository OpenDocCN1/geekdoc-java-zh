    # Online Approach


    Now we want to approach the online problem of paging. But first we need an understanding
    how to do it. Obviously an online algorithm cannot be better than the optimal
    offline algorithm. But how much worse it is? We need formal definitions to answer
    that question:


    **Definition 1.1**: An optimization problem `Π` consists of a set of instances
    `ΣΠ`. For every instance `σ`∈`ΣΠ` there is a set `Ζσ` of solutions and a objective
    function `fσ` : `Ζσ` → `ℜ≥0` which assigns a positive real value to every solution.
    We say `OPT(σ)` is the value of an optimal solution, `A(σ)` is the solution of
    an Algorithm `A` for the problem `Π` and `wA(σ)=fσ(A(σ))` its value.


    **Definition 1.2**: An online algorithm `A` for a minimization problem `Π` has
    a competitive ratio of `r ≥ 1` if there is a constant `τ`∈`ℜ` with

    ```

    wA(σ) = fσ(A(σ)) ≤ r ⋅ OPT(σ) + τ

    ```

    for all instances `σ`∈`ΣΠ`. `A` is called a `r`-competitive online algorithm.
    Is even

    ```

    wA(σ) ≤ r ⋅ OPT(σ)

    ```

    for all instances `σ`∈`ΣΠ` then `A` is called a strictly `r`-competitive online
    algorithm.


    So the question is how competitive is our online algorithm compared to an optimal
    offline algorithm. In their famous book Allan Borodin and Ran El-Yaniv used another
    scenario to describe the online paging situation: There is an evil adversary who
    knows your algorithm and the optimal offline algorithm. In every step, he tries
    to request a page which is worst for you and simultaneously best for the offline
    algorithm. the competitive factor of your algorithm is the factor on how badly
    your algorithm did against the adversary''s optimal offline algorithm. If you
    want to try to be the adversary, you can try the Adversary Game (try to beat the
    paging strategies).


    # Marking Algorithms


    Instead of analysing every algorithm separately, let''s look at a special online
    algorithm family for the paging problem called marking algorithms.


    Let `σ=(σ1,...,σp)` an instance for our problem and `k` our cache size, than `σ`
    can be divided into phases:

    - **Phase 1** is the maximal subsequence of `σ` from the start till maximal `k`
    different pages are requested.

    - **Phase i ≥ 2** is the maximal subsequence of `σ` from the end of pase `i-1`
    till maximal `k` different pages are requested.


    For example with `k = 3`:


    ![](rsrc2GS.jpg)


    A marking algorithm (implicitly or explicitly) maintains whether a page is marked
    or not. At the beginning of each phase are all pages unmarked. Is a page requested
    during a phase it gets marked. An algorithm is a marking algorithm iiff it never
    evicts a marked page from cache. That means pages which are used during a phase
    will not be evicted.


    **Proposition 1.3**: LRU and FWF are marking algorithm.


    **Proof**: At the beginning of each phase (except for the first one) FWF has a
    cache miss and cleared the cache. that means we have `k` empty pages. In every
    phase are maximal `k` different pages requested, so there will be now eviction
    during the phase. So FWF is a marking algorithm.


    Let''s assume LRU is not a marking algorithm. Then there is an instance `σ` where
    LRU a marked page `x` in phase `i` evicted. Let `σt` the request in phase `i`
    where `x` is evicted. Since `x` is marked there has to be a earlier request `σt*`
    for `x` in the same phase, so `t* < t`. After `t*` `x` is the caches newest page,
    so to got evicted at `t` the sequence `σt*+1,...,σt` has to request at least `k`
    from `x` different pages. That implies the phase `i` has requested at least `k+1`
    different pages which is a contradictory to the phase deﬁnition. So LRU has to
    be a marking algorithm.


    **Proposition 1.4**: Every marking algorithm is strictly `k`-competitive.


    **Proof**: Let `σ` be an instance for the paging problem and `l` the number of
    phases for `σ`. Is `l = 1` then is every marking algorithm optimal and the optimal
    offline algorithm cannot be better.


    We assume `l ≥ 2`. the cost of every marking algorithm, for instance `σ` is bounded
    from above with `l ⋅ k` because in every phase a marking algorithm cannot evict
    more than `k` pages without evicting one marked page. Now we try to show that
    the optimal offline algorithm evicts at least `k+l-2` pages for `σ`, `k` in the
    first phase and at least one for every following phase except for the last one.
