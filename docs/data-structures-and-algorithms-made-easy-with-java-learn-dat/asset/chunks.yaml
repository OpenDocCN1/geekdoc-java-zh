    \    add v to Vnew\n    add edge ( u, v) to Enew\nend while\n\nReturn Vnew and\
    \ Enew\n```\n\n### 复杂度：\n上述原始方法的时间复杂度为 `O(V²)`。它使用了邻接矩阵。我们可以使用优先级队列来降低复杂度。当我们把新节点加入\
    \ `Vnew` 时，将其相邻边加入优先级队列。然后从中弹出最小权重的边。此时复杂度将是 `O(Elog)`，其中 `E` 是边的数量。再次，二叉堆可以将复杂度降低到\
    \ `O(ElogV)`。使用优先级队列的伪代码如下：\n\n```\nProcedure MST ( Graph, source):\nfor each\
