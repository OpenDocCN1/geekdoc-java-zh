    \ from 0 to n-2 step 2:\n        if array[i] > array[i+1]:\n            swap array[i],\
    \ array[i+1]\n            odd = true\n    even = false\n    for i from 1 to n-2\
    \ step 2:\n        if array[i] > array[i+1]:\n            swap array[i], array[i+1]\n\
    \            even = true\n```\n\n奇偶排序的 C# 实现：\n```csharp\npublic class OddEvenSort\n\
    {\n    public static void Sort(int[] input, int n) {\n        bool sorted = false;\n\
    \        while (!sorted) {\n            sorted = true;\n            for (int i\
    \ = 0; i < n - 1; i += 2) {\n                if (input[i] > input[i + 1]) {\n\
    \                    int temp = input[i];\n                    input[i] = input[i\
    \ + 1];\n                    input[i + 1] = temp;\n                    sorted\
    \ = false;\n                }\n            }\n            for (int i = 1; i <\
    \ n - 1; i += 2) {\n                if (input[i] > input[i + 1]) {\n         \
    \           int temp = input[i];\n                    input[i] = input[i + 1];\n\
    \                    input[i + 1] = temp;\n                    sorted = false;\n\
    \                }\n            }\n        }\n    }\n}\n```\n\n奇偶排序的 Python 实现：\n\
    ```python\ndef odd_even_sort(arr):\n    n = len(arr)\n    sorted = False\n   \
    \ while not sorted:\n        sorted = True\n        for i in range(0, n - 1, 2):\n\
    \            if arr[i] > arr[i+1]:\n                arr[i], arr[i+1] = arr[i+1],\
    \ arr[i]\n                sorted = False\n        for i in range(1, n - 1, 2):\n\
    \            if arr[i] > arr[i+1]:\n                arr[i], arr[i+1] = arr[i+1],\
    \ arr[i]\n                sorted = False\n    return arr\n```\n\n"
- fmt: "\n# Binary Search\n\nBinary Search works by halving the search space at each\
    \ iteration after comparing the target value to the middle value of the search\
    \ space. To use Binary Search, the search space must be ordered (sorted) in some\
    \ way. Duplicate entries (ones that compare as equal according to the comparison\
    \ function) cannot be distinguished, though they don't violate the Binary Search\
    \ property. Conventionally, we use less than (`<`) as the comparison function.\
    \ If `a < b`, it will return true. if `a` is not less than `b` and `b` is not\
    \ less than `a`, `a` and `b` are equal.\n\n## Example Question\n\nYou are an economist,\
    \ a pretty bad one though. You are given the task of finding the equilibrium price\
    \ (that is, the price where supply = demand) for rice.\n\nRemember the higher\
    \ a price is set, the larger the supply and the lesser the demand.\n\nAs your\
    \ company is very efficient at calculating market forces, you can instantly get\
    \ the supply and demand in units of rice when the price of rice is set at a certain\
    \ price `p`. Your boss wants the equilibrium price ASAP, but tells you that the\
    \ equilibrium price can be a positive integer that is at most `10^17` and there\
    \ is guaranteed to be exactly 1 positive integer solution in the range. So get\
    \ going with your job before you lose it! You are allowed to call functions `getSupply(k)`\
    \ and `getDemand(k)`, which will do exactly what is stated in the problem.\n\n\
    ## Example Explanation\n\nHere our search space is from `1` to `10^17`. Thus a\
    \ linear search is infeasible. However, notice that as the `k` goes up, `getSupply(k)`\
    \ increases and `getDemand(k)` decreases. Thus, for any `x > y`, `getSupply(x)\
    \ > getSupply(y)` and `getDemand(x) < getDemand(y)`. Therefore, this search space\
    \ is monotonic and we can use Binary Search. The following pseudocode demonstrates\
    \ the usage of Binary Search:\n\n```\nhigh = 100000000000000000 low = 1\nwhile\
    \ high - low > 1:\n    mid = ( high + low) / 2\n    supply = getSupply( mid)\n\
    \    demand = getDemand( mid)\n    if supply > demand:\n        high = mid //\
    \ Solution is in lower half of search space\n    else if demand > supply:\n  \
    \      low = mid // Solution is in upper half of search space\n    else:\n   \
    \     return mid // supply == demand condition found solution\nreturn mid\n```\n\
    \nThis algorithm runs in `~O(log 10^17)` time. This can be generalized to `~O(log\
    \ S)` time where `S` is the size of the search space since at every iteration\
    \ of the `while` loop, we halved the search space (from `[low:high]` to either\
    \ `[low:mid]` or `[mid:high]`).\n\n### C Implementation of Binary Search with\
    \ Recursion\n\n```c\nint binsearch(int a[], int x, int low, int high) {\n    int\
    \ mid;\n    if (low > high) return 1;\n    mid = (low + high) / 2;\n    if (x\
    \ == a[mid]) {\n        return (mid);\n    } else {\n        if (x < a[mid]) {\n\
    \            binsearch(a, x, low, mid - 1);\n        } else {\n            binsearch(a,\
    \ x, mid + 1, high);\n        }\n    }\n}\n```\n\n# Section 39.2: Rabin Karp\n\
    \nThe Rabin–Karp algorithm or Rabin Karp algorithm is a string searching algorithm\
    \ that uses hashing to find any one of a set of pattern strings in a text. Its\
    \ average and best case running time is `O(n+m)` in space `O(p)`, but its worst-case\
    \ time is `O(nm)` where `n` is the length of the text and `m` is the length of\
    \ the pattern.\n\n### Algorithm implementation in java\n\n```java\nvoid findPattern(String\
    \ text, String pattern) {\n    /* q prime number\n       p hash value for pattern\n\
    \       t hash value for text\n       d is the number of unique characters in\
    \ alphabet */\n    int d = 128;\n    int q = 100;\n    int n = text.length();\n\
    \    int m = pattern.length();\n    int t = 0, p = 0;\n    int h = 1;\n    //\
    \ hash value calculating function\n    for (int i = 0; i < m - 1; i++)\n     \
    \   h = (h * d) % q;\n    for (int i = 0; i < m; i++) {\n        p = (d * p +\
    \ pattern.charAt(i)) % q;\n    }\n    // search for the pattern\n    for (int\
    \ i = 0; i < n - m; i++) {\n        if (p == t) {\n            // if hash value\
    \ matches them character by character\n            for (int j = 0; j < m; j++)\
    \ {\n                if (text.charAt(i + j) != pattern.charAt(j))\n          \
    \          break;\n            }\n            if (j == m)\n                System.out.println(\"\
    Pattern match found at index \" + i);\n        }\n        if (i < n - m) {\n \
    \           t = (d * (t - text.charAt(i) * h) + text.charAt(i + m)) % q;\n   \
    \         if (t < 0)\n                t = t + q;\n        }\n    }\n}\n```\n\n\
    While calculating hash value we are dividing it by a prime number in avoid collision.\
    \ After dividing by prime number the chances of collision will be less, but still\
    \ there is chance that hash value can be same for two strings, so when we get\
    \ a match we have to check it character by character to make sure we got proper\
    \ match. `t = (d * (t - text.charAt(i) * h) + text.charAt(i + m)) % q;` This is\
    \ to recalculate hash value for pattern, first by removing the left character\
    \ and then adding the new character from the text.\n\n# Section 39.3: Analysis\
    \ of Linear search (Worst, Average and Best)\n\nWe can have three cases to analyze\
    \ an algorithm:\n1. Worst Case\n2. Average Case\n3. Best Case\n\n```c\n#include\
    \ <stdio.h>\n// Linearly search x in arr]. If x is present then return the index\
    \ otherwise return -1\nint search(int arr[], int n, int x) {\n    int i;\n   \
    \ for (i = 0; i < n; i++) {\n        if (arr[i] == x)\n            return i;\n\
    \    }\n    return -1;\n}\n\n/* Driver program to test above functions */\nint\
    \ main() {\n    int arr[] = { 1, 10, 30, 15 };\n    int x = 30;\n    int n = sizeof(arr)\
    \ / sizeof(arr[0]);\n    printf(\"%d is present at index %d\", x, search(arr,\
    \ n, x));\n    getchar();\n    return 0;\n}\n```\n\n### Worst Case Analysis (Usually\
    \ Done)\n\nIn the worst case analysis, we calculate upper bound on running time\
    \ of an algorithm. We must know the case that causes maximum number of operations\
    \ to be executed. For Linear Search, the worst case happens when the element to\
    \ be searched (`x` in the above code) is not present in the array. When `x` is\
    \ not present, the `search()` function compares it with all the elements of `arr[]`\
    \ one by one. Therefore the worst case time complexity of linear search would\
    \ be `Θ(n)`.\n\n### Average Case Analysis (Sometimes done)\n\nIn average case\
    \ analysis, we take all possible inputs and calculate computing time for all of\
    \ the inputs. Sum all the calculated values and divide the sum by total number\
    \ of inputs. We must know (or predict) distribution of cases. For the linear search\
    \ problem, let us assume that all cases are uniformly distributed (including the\
    \ case of `x` not being present in array). So we sum the cases and divide the\
    \ sum by `(n+1)`.\n\n### Best Case Analysis (Bogus)\n\nIn the best case analysis,\
    \ we calculate lower bound on running time of an algorithm. We must know the case\
    \ that causes minimum number of operations to be executed. In the linear search\
    \ problem, the best case occurs when `x` is present at the first location. The\
    \ number of operations in the best case is constant (not dependent on `n`). So\
    \ time complexity in the best case would be `Θ(1)`.\n\nMost of the times, we do\
    \ worst case analysis to analyze algorithms. In the worst analysis, we guarantee\
    \ an upper bound on the running time of an algorithm which is good information.\
    \ The average case analysis is not easy to do in most of the practical cases and\
    \ it is rarely done. In the average case analysis, we must know (or predict) the\
    \ mathematical distribution of all possible inputs. The Best Case analysis is\
    \ bogus. Guaranteeing a lower bound on an algorithm doesn’t provide any information\
    \ as in the worst case, an algorithm may take years to run.\n\nFor some algorithms,\
    \ all the cases are asymptotically same, i.e., there are no worst and best cases.\
    \ For example, Merge Sort. Merge Sort does `Θ(n log n)` operations in all cases.\
    \ Most of the other sorting algorithms have worst and best cases. For example,\
    \ in the typical implementation of Quick Sort (where pivot is chosen as a corner\
    \ element), the worst occurs when the input array is already sorted and the best\
    \ occur when the pivot elements always divide array in two halves.\n\n# Section\
    \ 39.4: Binary Search: On Sorted Numbers\n\nIt's easiest to show a binary search\
    \ on numbers using pseudo-code\n\n```c\nint array[ 1000 ] = { sorted list of numbers\
    \ };\n```\n"
