    is not zero... {//CMult(pLo, &WN, &TEMP); // Perform complex multiplication of
    Lovalue with Wn


    TEMP.Re = (pLo-> Re * WN.Re ) (pLo-> Im * WN.Im );


    TEMP.Im = (pLo-> Re * WN.Im ) + (pLo-> Im * WN.Re );//CSub (pHi, &TEMP, pLo);


    pLo-> Re = pHi-> Re - TEMP.Re ; // Find new Lovalue (complex subtraction) pLo->
    Im = pHi-> Im - TEMP.Im ;//CAdd (pHi, &TEMP, pHi); // Find new Hivalue (complex
    addition) pHi-> Re = (pHi-> Re + TEMP.Re );


