    # 第 33 章：快速排序\n\n## 33.1 快速排序基本原理\n快速排序通过选择一个基准值（pivot），将数组分为两个部分，一部分包含小于基准值的元素，另一部分包含大于基准值的元素，然后递归地对这两个部分进行排序。\n\
    \n### 1. Lomuto 划分方案 (Luto Partition Scheme)\nLuto 划分方案通常选择最后一个元素作为基准值。它将数组划分为两个部分：小于等于基准值的元素在左侧，大于基准值的元素在右侧。\n\
    \n```text\npartition(A, low, high) {\n    pivot = A[high]\n    i = low\n    for\
    \ j = low to high - 1 {\n        if (A[j] <= pivot) {\n            swap A[i] with\
    \ A[j]\n            i++\n        }\n    }\n    swap A[i] with A[high]\n    return\
    \ i\n}\n```\n\n### 2. Hoare 划分方案 (Hoare Partition Scheme)\nHoare 划分方案使用从数组两端向中间移动的索引。它通常比\
    \ Lomuto 方案更高效，因为它执行的交换次数较少。\n\n```text\npartition(A, low, high) {\n    pivot\
    \ = A[low]\n    i = low - 1\n    j = high + 1\n    loop {\n        do {\n    \
    \        i++\n        } while (A[i] < pivot)\n        do {\n            j--\n\
    \        } while (A[j] > pivot)\n        if (i >= j)\n            return j\n \
    \   }\n}\n```\n\n递归调用逻辑：\n```text\nquicksort(A, low, high) {\n    if (low < high)\
    \ {\n        p = partition(A, low, high)\n        quicksort(A, low, p)\n     \
    \   quicksort(A, p + 1, high)\n    }\n}\n```\n\n## 33.2 Python 快速排序实现\n\n```python\n\
    def quicksort(arr):\n    if len(arr) <= 1:\n        return arr\n    pivot = arr[len(arr)\
    \ // 2]\n    left = [x for x in arr if x < pivot]\n    middle = [x for x in arr\
    \ if x == pivot]\n    right = [x for x in arr if x > pivot]\n    return quicksort(left)\
    \ + middle + quicksort(right)\n```\n\n## 33.3 Java 的 Lomuto 划分实现\n\n```java\n\
    import java.util.Scanner;\n\npublic class Solution {\n    public static void main(String[]\
    \ args) {\n        Scanner sc = new Scanner(System.in);\n        int n = sc.nextInt();\n\
    \        int[] ar = new int[n];\n        for (int i = 0; i < n; i++)\n       \
    \     ar[i] = sc.nextInt();\n        quickSort(ar, 0, ar.length - 1);\n    }\n\
    \n    public static void quickSort(int[] ar, int low, int high) {\n        if\
    \ (low < high) {\n            int p = partition(ar, low, high);\n            quickSort(ar,\
    \ low, p - 1);\n            quickSort(ar, p + 1, high);\n        }\n    }\n\n\
    \    public static int partition(int[] ar, int l, int r) {\n        int pivot\
    \ = ar[r];\n        int i = l;\n        for (int j = l; j < r; j++) {\n      \
    \      if (ar[j] <= pivot) {\n                int t = ar[j];\n               \
    \ ar[j] = ar[i];\n                ar[i] = t;\n                i++;\n         \
    \   }\n        }\n        int t = ar[i];\n        ar[i] = ar[r];\n        ar[r]\
    \ = t;\n        return i;\n    }\n}\n```\n\n# 第 34 章：计数排序\n\n## 34.1 计数排序基本信息\n\
    计数排序是一种针对整数集合的排序算法，根据对象的键键进行排序。\n\n"
