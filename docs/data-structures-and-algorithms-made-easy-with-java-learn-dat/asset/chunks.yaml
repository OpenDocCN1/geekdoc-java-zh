  trans: "\n\n## 3. 通过遍历数组，将 `C` 转换为一个数组，其中 `C[x]` 是小于或等于 `x` 的值的个数；为每个 `C[x]` 赋值其原有值与\
    \ `C` 中排在它之前的所有值之和。\n\n## 4. 反向遍历 `A`，将每个值根据 `C` 中记录的索引存放在新的排序数组 `B` 中。对于给定的 `A[x]`，这是通过将\
    \ `B[C[A[x]]]` 赋值为 `A[x]` 来完成的，在这种情况下，如果原始未排序数组中存在重复值，则递减 `C[A[x]]`。\n\n### 计数排序示例\n\
