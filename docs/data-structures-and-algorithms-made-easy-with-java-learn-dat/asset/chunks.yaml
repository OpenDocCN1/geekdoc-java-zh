    \ max)max = arr[ i][ j];\n            }\n            else\n                arr\
    \ [ i][ j] = 0 ;\n        }\n    }\n    return max;\n}\n```\n时间复杂度：`O(m*n)`\n\n\
    # 第 15 章：动态规划的应用\n动态规划的基本思想是将复杂问题分解为若干个重复的简单小问题。如果你能识别出一个反复计算的简单子问题，那么该问题很可能存在动态规划的解决方法。由于本主题名为`动态规划的应用`，它将更多地关注应用，而不是创建动态规划算法的过程。\n\
    \n## 第 15.1 ：斐波那契数\n斐波那契数是动态规划的一个核心课题，因为传统的递归方法会导致大量的重复计算。在这些示例中，我将使用基础情况 `f(\
    \ 0 ) = f( 1 ) = 1`。\n\n这是一个 `fibonacci( 4 )` 的递归树示例，注意其中重复的计算：\n\n### 非动态规划 `O(\
    \ 2 ^ n)` 运行复杂度，`O( n)` 栈复杂度\n```python\ndef fibonacci( n):\n    if n < 2 :\n\
    \        return 1\n    return fibonacci( n- 1 ) + fibonacci( n- 2 )\n```\n这是编写该问题最直观的方法。栈空间最多为\
    \ `O( n)`，因为你进入第一个递归分支并调用 `fibonacci( n- 1 )` 直到遇到基础情况 `n < 2`。这里可以看到 `O( 2 ^\
    \ n)` 运行复杂度的证明：斐波那契数列的计算复杂度。需要注意的是，运行时间是指数级的，这意味着运行时间会随每个后续项增加倍数，`fibonacci( 15\
    \ )` 时间将是 `fibonacci( 14 )` 的两倍。\n\n### 备忘 `O( n)` 运行复杂度，`O( n)` 空间复杂度，`O( n)`\
    \ 栈复杂度\n```python\nmemo = []\nmemo.append ( 1 ) # f( 1 ) = 1\nmemo.append ( 1\
    \ ) # f( 2 ) = 1\ndef fibonacci( n):\n    if len( memo) > n:\n        return memo[\
    \ n]\n    result = fibonacci( n- 1 ) + fibonacci( n- 2 )\n    memo.append ( result)\
    \ # f( n) = f( n - 1 ) + f( n - 2 )\n    return result\n```\n通过备忘方法，我们引入了一个数组，可以看作是之前所有的函数调用。`memo[\
    \ n]` 是函数调用 `fibonacci( n)` 的结果。这允许我们用 `O( n)` 的空间复杂度换取 `O( n)` 的运行时间，因为我们不再需要计算重复的函数调用。\n\
    \n### 迭代动态规划 `O( n)` 运行复杂度，`O( n)` 空间复杂度，无递归栈\n```python\ndef fibonacci( n):\n\
    \    memo = [ 1 ,1 ] # f( 0 ) = 1 , f( 1 ) = 1\n    for i in range( 2 , n+ 1 ):\n\
    \        memo.append ( memo[ i- 1 ] + memo[ i- 2 ])\n    return memo[ n]\n```\n\
    如果我们将问题分解为核心元素，你会发现为了计算 `fibonacci( n )`，我们需要 `fibonacci( n- 1 )` 和 `fibonacci(\
    \ n- 2 )`。我们还可以注意到，如上所示，基础情况出现在递归树的末端。\n\n有了这些信息，反向计算解决方案（从基础情况向上计算）就变得合理了。现在为了计算\
    \ `fibonacci( n )`，我们首先计算到 `n` 的所有斐波那契数。这样做的主要优点是我们现在消除了递归栈，同时保持了 `O( n)` 的运行时间。遗憾的是，我们仍然具有\
    \ `O( n)` 的空间复杂度，但也可以改变。\n\n### 高级迭代动态规划 `O( n)` 运行复杂度，`O( 1 )` 空间复杂度，无递归栈\n*(注：原文此处存在重复性描述，已根据逻辑整合)*\n\
    \n"
- fmt: "\nconnect one of the roots to the other, thus merging two trees\n\nreturn\
    \ `MST`, which now a single- tree `forest`\n\n### Section 16.3: Simple, disjoint-set\
    \ based implementation\n\nThe above forest methodology is actually a disjoint-set\
    \ data structure, which involves three main operations:\n\n```\nsubalgo makeSet(\
    \ v: a node):\n  v.parent = v < make a new tree rooted at v\n\nsubalgo findSet(\
    \ v: a node):\n  if v.parent == v:\n    return v\n  return findSet( v.parent )\n\
    \nsubalgo unionSet ( v, u: nodes):\n  vRoot = findSet( v)\n  uRoot = findSet(\
    \ u)\n  uRoot.parent = vRoot\n```\n\n```\nalgorithm kruskalMST ( G: a graph):\n\
    \  sort G.s edges by their value\n  for each node n in G:\n    makeSet ( n)\n\
    \  for each edge e in G:\n    if findSet( e.first ) != findSet( e.second ):\n\
    \      unionSet( e.first , e.second )\n```\n\nThis naive implementation leads\
    \ to `O( n log n)` time for managing the disjoint-set data structure, leading\
    \ to `O( m* n log n)` time for the entire Kruskal's algorithm.\n\n### Section\
    \ 16.4: Simple, high level implementation\n\nSort the edges by value and add each\
    \ one to the `MST` in sorted order, if it doesn't create a cycle.\n\n```\nalgorithm\
    \ kruskalMST ( G: a graph)\n  sort G.s edges by their value\n  MST = an empty\
    \ graph\n  for each edge e in G:\n    if adding e to MST does not create a cycle:\n\
    \      add e to MST\n  return MST\n```\n\n### Chapter 17: Greedy Algorithms\n\n\
    ### Section 17.1: Huffman Coding\n\nHuﬀman code is a particular type of optimal\
    \ preﬁx code that is commonly used for lossless data compression. It compresses\
    \ data very eﬀectively saving from 20% to 90% memory, depending on the characteristics\
    \ of the data being compressed. We consider the data to be a sequence of characters.\
    \ Huﬀman's greedy algorithm uses a table giving how often each character occurs\
    \ (i.e., its frequency) to build up an optimal way of representing each character\
    \ as a binary string. Huﬀman code was proposed by David A. Huﬀman in 1951.\n\n\
    Suppose we have a 100,000-character data ﬁle that we wish to store compactly.\
    \ We assume that there are only 6 diﬀerent characters in that ﬁle. The frequency\
    \ of the characters are given by:\n\n|------------------------+-----+-----+-----+-----+-----+-----+|\n\
    | Character | a | b | c | d | e | f |\n|------------------------+-----+-----+-----+-----+-----+-----+|\n\
    |Frequency (in thousands)| 45 | 13 | 12 | 16 | 9 | 5 |\n|------------------------+-----+-----+-----+-----+-----+-----+|\n\
    \nWe have many options for how to represent such a ﬁle of information. Here, we\
    \ consider the problem of designing a Binary Character Code in which each character\
    \ is represented by a unique binary string, which we call a `codeword` .\n\n![](rsrc2FV.jpg)\
    \ The constructed tree will provide us with:\n\n|------------------------+-----+-----+-----+-----+-----+-----+|\n\
    | Character | a | b | c | d | e | f |\n|------------------------+-----+-----+-----+-----+-----+-----+|\n\
    | Fixed-length Codeword | 000 | 001 | 010 | 011 | 100 | 101 |\n|------------------------+-----+-----+-----+-----+-----+-----+|\n\
    |Variable-length Codeword| 0 | 101 | 100 | 111 | 1101| 1100|\n|------------------------+-----+-----+-----+-----+-----+-----+|\n\
    \nIf we use a `fixed-length code`, we need three bits to represent 6 characters.\
    \ This method requires `300,000` bits to code the entire ﬁle. Now the question\
    \ is, can we do better?\n\nA variable-length code can do considerably better than\
    \ a fixed-length code, by giving frequent characters short codewords and infrequent\
    \ characters long codewords. This code requires: `(45 X 1 + 13 X 3 + 12 X 3 +\
    \ 16 X 3 + 9 X 4 + 5 X 4) X 1000 = 224000` bits to represent the ﬁle, which saves\
    \ approximately 25% of memory.\n\nOne thing to remember, we consider here only\
    \ codes in which no codeword is also a preﬁx of some other codeword. These are\
    \ called preﬁx codes. For variable-length coding, we code the 3-character ﬁle\
    \ `abc` as `0.101.100 = 0101100`, where `.` denotes the concatenation.\n\nPreﬁx\
    \ codes are desirable because they simplify decoding. Since no codeword is a preﬁx\
    \ of any other, the codeword that begins an encoded ﬁle is unambiguous. We can\
    \ simply identify the initial codeword, translate it back to the original character,\
    \ and repeat the decoding process on the remainder of the encoded ﬁle. For example,\
    \ `001011101` parses uniquely as `0.0.101.1101`, which decodes to `abe`. In short,\
    \ all the combinations of binary representations are unique. Say for example,\
    \ if one letter is denoted by `110`, no other letter will be denoted by `1101`\
    \ or `1100`. This is because you might face confusion on whether to select `110`\
    \ or to continue on concatenating the next bit and select that one.\n\n#### Compression\
    \ Technique:\n\nThe technique works by creating a binary tree of nodes. These\
    \ can stored in a regular array, the size of which depends on the number of symbols,\
    \ `n`. A node can either be a leaf node or an internal node.\n\n```\nProcedure\
    \ Huffman ( C):\n  n = C.size\n  Q = priority_queue()\n  for i = 1 to n:\n   \
    \ n = node( C[i])\n    Q.push ( n)\nend for\n\n  while Q.size () is not equal\
    \ to 1:\n    Z = new node()\n    Z.left = x = Q.pop\n    Z.right = y = Q.pop\n\
    \    Z.frequency = x.frequency + y.frequency\n    Q.push ( Z)\nend while\n\n \
    \ Return Q\n```\n\nFor example: ![](rsrc2FW.jpg) The pseudo-code looks like:\n\
    \n```\nProcedure Huffman ( C):\n  n = C.size\n  Q = priority_queue()\n  for i\
    \ = 1 to n\n    n = node( C[i])\n    Q.push ( n)\n  end for\n\n  while Q.size\
    \ () is not equal to 1\n    Z = new node()\n    Z.left = x = Q.pop\n    Z.right\
    \ = y = Q.pop\n    Z.frequency = x.frequency + y.frequency\n    Q.push ( Z)\n\
    \  end while\n\n  Return Q\n```\n\n#### Decompression Technique:\n\nThe process\
    \ of decompression is simply a matter of translating the stream of preﬁx codes\
    \ to individual byte value, usually by traversing the Huffman tree node by node\
    \ as each bit is read. Reaching a leaf node necessarily terminates the search\
    \ for that particular byte value. The leaf value represents the desired character.\
    \ Usually the Huffman Tree is constructed using statistically adjusted data on\
    \ each compression cycle, thus the reconstruction is fairly simple. Otherwise,\
    \ the information to reconstruct the tree must be sent separately.\n\n```\nProcedure\
    \ HuffmanDecompression ( root, S):\n  n := S.length\n  for i := 1 to n\n    current\
    \ = root\n    while current.left != NULL and current.right != NULL\n      if S[\
    \ i] is equal to '0':\n        current := current.left\n      else:\n        current\
    \ := current.right\n      endif\n      i := i+ 1\n  endwhile\n  print current.symbol\n\
    endfor\n```\n\n#### Greedy Explanation:\n\nHuﬀman coding looks at the occurrence\
    \ of each character and stores it as a binary string in an optimal way. The idea\
    \ is to assign variable-length codes to input characters, length of the assigned\
    \ codes are based on the frequencies of corresponding characters. We create a\
    \ binary tree and operate on it in bottom-up manner so that the least two frequent\
    \ characters are as far as possible from the root. In this way, the most frequent\
    \ character gets the smallest code and the least frequent character gets the largest\
    \ code.\n\nReferences:\nIntroduction to Algorithms - Charles E. Leiserson, Cliﬀord\
    \ Stein, Ronald Rivest, and Thomas H. Cormen\nHuﬀman Coding - Wikipedia\n"
