  trans: "\n\n# 离散数学及其应用 - Kenneth H. Rosen 著\n\n## 第 17.2 节：活动选择问题\n\n### 问题描述\n\
    你有一组需要完成的任务（活动）。每个活动都有开始时间和结束时间。你不可以在同一时间执行多个活动。你的任务是找到一种执行最大数量活动的方法。\n\n例如，假设你有一组可选的课程。\n\
    \n| 活动编号 | 开始时间 | 结束时间 |\n| :--- | :--- | :--- |\n| 1 | 上午 10:20 | 上午 11:00 |\n\
    | 2 | 上午 10:30 | 上午 11:30 |\n| 3 | 上午 11:00 | 上午 12:00 |\n| 4 | 上午 10:00 | 上午\
    \ 11:30 |\n| 5 | 上午 9:00 | 上午 11:00 |\n\n记住，你不能同时上两门课。这意味着你不能同时上第 1 类和第 2 类课，因为它们共用了了上午\
    \ 10:30 到上午 11:30 的时间。然而，你可以上第 1 类和第 3 类课，因为它们没有时间重叠。所以你的任务是在不任何重叠的情况下尽可能多地上课。你该如何做呢？\n\
    \n### 分析\n让我们思考用贪心算法来解决方案。首先，我们随机选择一种方法并检查它是否有效。按照开始时间对活动进行排序，这意味着哪个活动先开始，我们就先选哪个。然后从排序列表中从第一个到最后一个遍历，并检查它是否与之前已执行的活动冲突。如果当前活动与之前执行的活动不冲突，我们就执行该活动，否则我们不执行。这种方法在某些情况下有效，例如：\n\
    \n| 活动编号 | 开始时间 | 结束时间 |\n| :--- | :--- | :--- |\n| 1 | 上午 11:00 | 下午 1:30 |\n\
    | 2 | 上午 11:30 | 下午 12:00 |\n| 3 | 下午 1:30 | 下午 2:00 |\n| 4 | 上午 10:00 | 上午 11:00\
    \ |\n\n排序顺序将是 `4-->1-->2-->3`。活动 `4--> 1--> 3`将被执行，活动 2 将被跳过。执行了最多的 3 个活动。这种方法对于这类情况有效，但在某些情况下会失败。让我们将这种方法应用于以下情况：\n\
    \n| 活动编号 | 开始时间 | 结束时间 |\n| :--- | :--- | :--- |\n| 1 | 上午 11:00 | 下午 1:30 |\n\
    | 2 | 上午 11:30 | 下午 12:00 |\n| 3 | 下午 1:30 | 下午 2:00 |\n| 4 | 上午 10:00 | 下午 3:00\
    \ |\n\n`10.00 A.M 3.00P.M->3` 将被执行。因此我们的方法在上述情况下行不起作用。让我们尝试另一种方法：按活动持续时间对活动进行排序，这意味着优先执行最短的活动。这可以解决之前的问题。尽管问题并没有被完全解决。仍然存在某些可能导致方案失效的情况。将此方法应用于下面的情况：\n\
    \n| 活动编号 | 开始时间 | 结束时间 |\n| :--- | :--- | :--- |\n| 1 | 上午 6:00 | 上午 11:40 |\n\
    | 2 | 上午 11:30 | 下午 12:00 |\n| 3 | 下午 11:40 | 下午 2:00 |\n\n如果我们按持续时间对活动排序，排序顺序将是\
    \ `2--> 3 --->1`。如果我们先执行执行第 2 号活动，那么其他活动都无法执行了。但正确答案是先执行活动 1 然后执行活动 3。所以我们可以最多执行\
    \ 2 个活动。因此，这并不是该问题的解决方案。我们应该尝试一种不同的方法。\n\n### 解决方案\n按结束时间对活动进行排序，这意味着先完成的活动先处理。算法如下所示：\n\
    1. 按照结束时间对活动进行排序。\n2. 如果要执行的活动与之前执行的活动没有共同时间段，则执行该活动。\n\n让我们分析第一个例子：\n\n| 活动编号\
    \ | 开始时间 | 结束时间 |\n| :--- | :--- | :--- |\n| 1 | 上午 10:20 | 上午 11:00 |\n| 2 |\
    \ 上午 10:30 | 上午 11:30 |\n| 3 | 上午 11:00 | 上午 12:00 |\n| 4 | 上午 10:00 | 上午 11:30\
    \ |\n| 5 | 上午 9:00 | 上午 11:00 |\n\n按照结束时间对活动排序，所以排序顺序将是 `1-->5-->2-->4-->3`。答案是\
    \ `1-->3`，这两个活动将被执行。没错，这就是答案。这里是伪代码：\n\n```\n1. 排序活动\n2. 从排序列表中从第一个到最后一个\n3. 如果活动开始时间晚于上一个执行活动的结束时间，则执行该活动\n\
    4. 更新结束时间\n5. 否则跳转\n```\n关于[贪心算法活动选择问题](https://www.geeksforgeeks.org/greedy-algorithms-activity-selection-problem/)。\n\
    \n## 第 17.3 节：找零问题\n给出一个货币币系统，是否可以为某个金额找出最少的硬币数量。对于某些货币币系统，如我们在生活中使用的那种。\n\n```ocaml\n\
    let opt x =\n  match x with\n  | Some y -> Some (y + 1)\n  | None -> None\n\n\
    let change_make moneysystem amount =\n  let rec n acc =\n    if n = 0 then acc\n\
    \    else\n      let coin = List.find (>= n) moneysystem\n      in loop (n - coin)\
    \ (coin::acc)\n  in loop amount []\n```\n\n# 第 18 章：贪心技术的应用\n\n## 第 18.1 节：缓存\n\
    缓存问题源于空间限制。假设我们的缓存 C 有 `k` 个页面。现在我们要处理一组 `m` 个请求，这些请求在处理之前必须放入缓存。当然，如果 `m<= k`，我们只需将所有元素放入缓存即可工作，但通常\
    \ `m>> k`。如果项目已经在缓存中，我们称之为“缓存命中”（hit），否则称为“缓存未命中”（miss）。在这种情况下，我们必须将请求的项目引入缓存并换出另一个，假设缓存已满。目标是找到一种减少逐出次数的调度方案。对于这个问题有许多贪心策略，让我们来看看：\n\
    1. 先进先出（FIFO）：旧页面被逐出。\n2. 后进先出（LIFO）：最新的页面被逐出。\n3. 最近最未使用（LRU）：逐出最近访问最早的页面。\n\
    4. 最少频率（LFU）：逐出请求频率最低的页面。\n5. 最远未来（LFD）：逐出缓存中以后才会被请求的页面。\n\n注意：在以下示例中，如果有多个页面可以被逐出，我们将逐出索引最小的。\n\
    \n### 示例 (FIFO)\n假设缓存大小为 `k=3`，初始缓存为 `a,b,c`，请求序列为 `a,a,d,e,b,b,a,c,f,d,e,a,f,b,e,c`：\n\
    \n| 请求 | a | a | d | e | b | b | a | c | f | d | e | a | f | b | e | c |\n| :---\
    \ | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :---\
    \ | :--- | :--- | :--- | :--- | :--- |\n| 缓存 1 | a | a | d | d | d | d | a | a\
    \ | a | d | d | d | f | f | f | c |\n| 缓存 2 | b | b | b | e | e | e | e | c |\
    \ c | c | e | e | e | b | b | b |\n| 缓存 3 | c | c | c | c | b | b | b | b | f\
    \ | f | f | a | a | a | e | e |\n| 命中/未命中 | h | h | m | m | m | h | m | m | m\
    \ | m | m | m | m | m | m | m |\n\n"
- fmt: "\nThirteen cache misses by sixteen requests does not sound very optimal, lets\
    \ try the same example with another strategy:\n\n### Example (LFD)\n\nLet the\
    \ cache size be `k= 3` the initial cache `a,b,c` and the request `a,a,d,e,b,b,a,c,f,d,e,a,f,b,e,c`:\n\
    \n```\nRequest: a a d e b b a c f d e a f b e c\ncache 1: a a d e e e e e e e\
    \ e e e e e c\ncache 2: b b b b b b a a a a a a f f f f\ncache 3: c c c c c c\
    \ c c f d d d d b b b\ncache miss: x x x x x x x x\n```\n\nEight cache misses\
    \ is a lot better.\n\nSelftest: Do the example for `LIFO`, `LFU`, `RFU` and look\
    \ what happend.\n\nThe following example programm (written in C++) consists of\
    \ two parts: The skeleton is a application, which solves the problem dependent\
    \ on the chosen greedy strategy:\n\n```cpp\n#include <iostream>\n#include <memory>\n\
    \nusing namespace std;\n\nconst int cacheSize = 3; const int requestLength = 16;\n\
    \nconst char request[] = {'a' ,'a' ,'d' ,'e' ,'b' ,'b' ,'a' ,'c' ,'f' ,'d' ,'e'\
    \ ,'a' ,'f' ,'b' ,'e' ,'c' }; char cache[] = {'a' ,'b' ,'c' };\n\n// for reset\n\
    char originalCache[] = {'a' ,'b' ,'c' };\n\nclass Strategy {\npublic :\n    Strategy(std::\
    \ string name) : strategyName(name) {}\n    virtual ~Strategy() = default ;\n\
    \    // calculate which cache place should be used\n    virtual int apply(int\
    \ requestIndex) = 0;\n\n    // updates information the strategy needs\n    virtual\
    \ void update(int cachePlace, int requestIndex, bool cacheMiss) = 0;\n\n    const\
    \ std:: string strategyName;\n};\n\nbool updateCache(int requestIndex, Strategy*\
    \ strategy) {\n    // calculate where to put request\n    int cachePlace = strategy->\
    \ apply(requestIndex);\n    // proof whether its a cache hit or a cache miss\n\
    \    bool isMiss = request[requestIndex] != cache[cachePlace];\n\n    // update\
    \ strategy (for example recount distances)\n    strategy-> update(cachePlace,\
    \ requestIndex, isMiss);\n\n    // write to cache\n    cache[cachePlace] = request[requestIndex];\n\
    \    return isMiss;\n}\n\nint main() {\n    Strategy* selectedStrategy[] = { new\
    \ FIFO, new LIFO, new LRU, new LFU, new LFD };\n    for (int strat= 0; strat <\
    \ 5; ++strat) {\n        // reset cache\n        for (int i= 0; i < cacheSize;\
    \ ++i) cache[i] = originalCache[i];\n        cout << \" \\n Strategy: \" << selectedStrategy[strat]->\
    \ strategyName << endl;\n        cout << \" \\n Cache initial: (\" ;\n       \
    \ for (int i = 0; i < cacheSize-1; ++i) cout << cache[i] << \",\" ; cout << cache[cacheSize-1]\
    \ << \") \\n\\n \" ;\n        cout << \"Request \\t \" ;\n        for (int i =\
    \ 0; i < cacheSize; ++i) cout << \"cache \" << i << \" \\t \" ; cout << \"cache\
    \ miss\" << endl;\n        int cntMisses = 0;\n        for (int i = 0; i< requestLength;\
    \ ++i) {\n            bool isMiss = updateCache(i, selectedStrategy[strat]);\n\
    \            if (isMiss) ++cntMisses;\n            cout << \" \" << request[i]\
    \ << \" \\t \" ;\n            for (int l= 0; l < cacheSize; ++l) cout << \" \"\
    \ << cache[l] << \" \\t \" ; cout << (isMiss ? \"x\" : \"\" ) << endl;\n     \
    \   }\n        cout << \" \\n Total cache misses: \" << cntMisses << endl;\n \
    \   }\n    for (int i= 0; i< 5; ++i) delete selectedStrategy[i];\n}\n```\n\nThe\
    \ basic idea is simple: for every request I have two calls two my strategy:\n\
    1. `apply`: The strategy has to tell the caller which page to use\n2. `update`:\
    \ After the caller uses the place, it tells the strategy whether it was a miss\
    \ or not. Then the strategy may update its internal data. The strategy `LFU` for\
    \ example has to update the hit frequency for the cache pages, while the `LFD`\
    \ strategy has to recalculate the distances for the cache pages.\n\nNow lets look\
    \ of example implementations for our ﬁve strategies:\n\n### FIFO\n```cpp\nclass\
    \ FIFO : public Strategy {\npublic :\n    FIFO() : Strategy( \"FIFO\" )\n    {\n\
    \        for ( int i= 0 ; i< cacheSize; ++ i) age[ i] = 0 ;\n    }\n    int apply(\
    \ int requestIndex) override {\n        int oldest = 0 ;\n        for ( int i=\
    \ 0 ; i< cacheSize; ++ i) {\n            if ( cache[ i] == request[ requestIndex])\
    \ return i;\n            else if ( age[ i] > age[ oldest]) oldest = i;\n     \
    \   }\n        return oldest; \n    }\n    void update( int cachePos, int requestIndex,\
    \ bool cacheMiss) override {\n        // nothing changed we don't need to update\
    \ the ages\n        if (! cacheMiss) return ;\n        // all old pages get older,\
    \ the new one get 0\n        for ( int i= 0 ; i< cacheSize; ++ i) {\n        \
    \    if ( i != cachePos) age[ i]++;\n            else\n            age[ i] = 0\
    \ ;\n        }\n    }\nprivate:\n    int age[ cacheSize];\n};\n```\n`FIFO` just\
    \ needs the information how long a page is in the cache (and of course relative\
    \ to other pages). So the only thing to do is wait for a miss and then make the\
    \ pages which not evicted. For our example above program solution is:\n```\nStrategy:\
    \ FIFO\nCache initial: (a,b,c)\nRequest cache 0 cache 1 cache 2 cache miss\na\
    \ b c\na b c\nd c x\nd e x\ne b x\ne a x\na a x\na f x\nf d x\nf d x\nf c x\n\
    ...\nTotal cache misses: 13\n```\n\n### LIFO\n```cpp\nclass LIFO : public Strategy\
    \ {\npublic :\n    LIFO() : Strategy( \"LIFO\" )\n    {\n        for ( int i=\
    \ 0 ; i< cacheSize; ++ i) age[ i] = 0 ;\n    }\n    int apply( int requestIndex)\
    \ override {\n        int newest = 0 ;\n        for ( int i= 0 ; i< cacheSize;\
    \ ++ i) {\n            if ( cache[ i] == request[ requestIndex]) return i;\n \
    \           else if ( age[ i] < age[ newest]) newest = i;\n        }\n       \
    \ return newest;\n    }\n    void update( int cachePos, int requestIndex, bool\
    \ cacheMiss) override {\n        // nothing changed we don't need to update the\
    \ ages\n        if (! cacheMiss) return ;\n        // all old pages get older,\
    \ the new one get 0\n        for ( int i= 0 ; i< cacheSize; ++ i) {\n        \
    \    if ( i != cachePos) age[ i]++;\n            else\n            age[ i] = 0\
    \ ;\n        }\n    }\nprivate:\n    int age[ cacheSize];\n};\n```\nThe implementation\
    \ of `LIFO` is more or less the same as `FIFO` but we evict the youngest not the\
    \ oldest page. The program results are:\n```\nStrategy: LIFO\nCache initial: (a,b,c)\n\
    Request cache 0 cache 1 cache 2 cache miss\n...\nTotal cache misses: 9\n```\n\n\
    ### LRU\n```cpp\nclass LRU : public Strategy {\npublic :\n    LRU() : Strategy(\
    \ \"LRU\" )\n    {\n        for ( int i= 0 ; i< cacheSize; ++ i) age[ i] = 0 ;\n\
    \    }\n    // here oldest mean not used the longest\n    int apply( int requestIndex)\
    \ override {\n        int oldest = 0 ;\n        for ( int i= 0 ; i< cacheSize;\
    \ ++ i) {\n            if ( cache[ i] == request[ requestIndex]) return i;\n \
    \           else if ( age[ i] > age[ oldest]) oldest = i;\n        }\n       \
    \ return oldest;\n    }\n    void update( int cachePos, int requestIndex, bool\
    \ cacheMiss) override {\n        // all old pages get older, the used one get\
    \ 0\n        for ( int i= 0 ; i< cacheSize; ++ i) {\n            if ( i != cachePos)\
    \ age[ i]++;\n            else\n            age[ i] = 0 ;\n        }\n    }\n\
    private:\n    int age[ cacheSize];\n};\n```\nIn case of `LRU` the strategy is\
    \ independent from what is at the cache page, its only interest is the last usage.\
