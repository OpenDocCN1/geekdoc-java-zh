    # 第 12 章：A* 路径规划


    ## 第 12.1 节：A* 简介


    A*（星号）是一种用于寻找从一个节点到另一个节点路径的搜索算法。它可以与广度优先搜索（Breadth First Search）、`Dijkstra 算法`、深度优先搜索（Depth
    First Search）或最佳优先搜索（Best First Search）相比较。A* 算法在图搜索中被广泛应用，因为它在无法进行图预处理的情况下具有更高的效率和准确性。A*
    是 `Best First Search` 的特化版本，其中评估函数 `f` 以特定的方式定义。


    `f(n) = g(n) + h(n)` 是从初始节点通过节点 `n` 到达目标的最小代价。


    `g(n)` 是从初始节点到 `n` 的最小代价。


    `h(n)` 是从 `n` 到其最近终点的最小代价。


    A* 是一种启发式搜索算法，它始终保证在最短时间内找到最短路径（代价最小的路径）（如果使用可采启发式函数的话）。因此，它是完备且最优的。下面的动画演示了 A*
    搜索![](img/rsrc2FE.jpg)


    ## 第 12.2 节：通过无障碍迷宫进行 A* 路径规划


    假设我们有如下 4x4 的网格：![](img/rsrc2FF.jpg)


    假设这是一个迷宫。不过这里没有墙壁/障碍。我们只有一个起点（绿色方块）和一个终点（红色方块）。同样假设为了从绿色移动到红色，我们不能对角线移动。那么，从绿色方块开始，看看我们可以移动到哪些格子，并将它们高亮为蓝色：![](img/rsrc2FG.jpg)


    为了决定下一个移动到哪个格子，我们需要考虑 2 个启发式因子：


    1. `g` 值 - 该节点距离绿色方块的距离。

    2. `h` 值 - 该节点距离红色方块的距离。

    3. `f` 值 - `g` 值和 `h` 值的和。这是告诉我们应该移动到哪个节点的最终数字。


    为了计算这些启发式因子，我们使用的公式是：`distance = abs( from.x to.x ) + abs( from.y to.y )`


    这被称为“曼哈顿距离”（Manhattan Distance）公式。


    让我们计算紧邻绿色方块左侧蓝色格子的 `g` 值：`abs( 3 2 ) + abs( 2 2 ) = 1`


    太棒了！我们得到了值：`1`。现在，尝试计算 `h` 值：`abs( 2 0 ) + abs( 2 0 ) = 4`


    完美。现在，获取 `f` 值：`1 + 4 = 5`


    所以，这个节点的最终值是“5”。


    对所有其他蓝色格子执行相同的操作。每个格子中心的大数字是 `f` 值，左上角的数字是 `g` 值，右上角的数字是 `h` 值：


    ![](img/rsrc2FH.jpg) 我们已经计算了所有蓝色节点的 `g`、`h` 和 `f` 值。现在，我们选哪一个呢？


    选择 `f` 值最低的那个。


    然而，在这种情况下，我们有两个节点的 `f` 值相同，都是 `5`。我们该如何在它们之间选择呢？


    简单来说，随机选择其中一个，或者设置一个优先级。我通常倾向于设置这样的优先级：“右 > 上 > 下 > 左”


    `f` 值为 `5` 的节点之一带我们向“下”移动，另一个带我们向“左”。由于“向下”的优先级高于“向左”，我们选择带我们“向下”的格子。


    现在我们将计算了启发式因子但未移动的节点标记为橙色，并将选择的节点标记为青色：


    ![](img/rsrc2FJ.jpg) 好，现在为青色节点周围的节点计算相同的启发式因子：


    ![](img/rsrc2FK.jpg) 再次，我们选择从青色节点向下移动，因为所有选项的 `f` 值都相同：![](img/rsrc2FM.jpg) 为青色节点唯一的邻居计算启发式因子：


    ![](img/rsrc2FN.jpg) 好，由于我们将遵循一直以来采用的模式：![](img/rsrc2FP.jpg) 再次，让我们计算该节点邻居的启发式因子：


    ![](img/rsrc2FR.jpg) 让我们移动到那里：


    ![](img/rsrc2FS.jpg) 最后，我们可以看到我们旁边有一个胜利格，所以我们移动到那里，任务完成。


    ## 第 12.3 节：使用 A* 算法解决 8 数字游戏问题


    问题定义：


    8 数字游戏是一个由 3x3 网格（包含 9 个格子）组成的简单游戏。其中一个格子是空的。目标是将周围的数字移动到不同的位置，并使显示的数字符合“目标状态”。


    ![](img/rsrc2FT.jpg) 给定 8 数字游戏的初始状态和要到达的最终状态，找到从初始状态到达最终状态的最具成本效益的路径。


    初始状态：

    `_ 1 3`

    `4 2 5`

    `7 8 6`


    最终状态：

    `1 2 3`

    `4 5 6`


