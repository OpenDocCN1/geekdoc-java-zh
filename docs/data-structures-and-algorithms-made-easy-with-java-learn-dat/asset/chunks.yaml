    Lowest common ancestor of nodes with value 2 and 4 is 4.\nLowest common ancestor\
    \ of nodes with value 1 and 2 is 2.\n\n## Chapter 9: Graph\n\nA graph is a collection\
    \ of points and lines connecting some (possibly empty) subset of them. The points\
    \ of a graph are called graph vertices, \"nodes\" or simply \"points.\" Similarly,\
    \ the lines connecting the vertices of a graph are called graph edges, \"arcs\"\
    \ or \"lines.\"\n\nA graph `G` can be defined as a pair `(V,E)`, where `V` is\
    \ a set of vertices, and `E` is a set of edges between the vertices `E ⊆ {(u,v)\
    \ | u, v ∈ V}`.\n\n## Section 9.1: Storing Graphs (Adjacency Matrix)\n\nTo store\
    \ a graph, two methods are common:\n\n1. Adjacency Matrix\n2. Adjacency List\n\
    \nAn adjacency matrix is a square matrix used to represent a finite graph. The\
    \ elements of the matrix indicate whether pairs of vertices are adjacent or not\
    \ in the graph.\n\nAdjacent means 'next to or adjoining something else' or to\
    \ be beside something. For example, your neighbors are adjacent to you. In graph\
    \ theory, if we can go to node `B` from node `A`, we can say that node `B` is\
    \ adjacent to node `A`. Now we will learn about how to store which nodes are adjacent\
    \ to which one via Adjacency Matrix. This means, we will represent which nodes\
    \ share edge between them. Here matrix means 2D array.\n\n![](rsrc2F2.jpg) Here\
    \ you can see a table beside the graph, this is our adjacency matrix. Here `Matrix[i][j]\
    \ = 1` represents there is an edge between `i` and `j`. If there's no edge, we\
    \ simply put `Matrix[i][j] = 0`.\n\nThese edges can be weighted, like it can represent\
    \ the distance between two cities. Then we'll put the value in `Matrix[i][j]`\
    \ instead of putting 1.\n\nThe graph described above is Bidirectional or Undirected,\
    \ that means, if we can go to node 1 from node 2, we can also go to node 2 from\
    \ node 1. If the graph was Directed, then there would've been arrow sign on one\
    \ side of the graph. Even then, we could represent it using adjacency matrix.\n\
    \n![](rsrc2F3.jpg)\n\nWe represent the nodes that don't share edge by infinity.\
    \ One thing to be noticed is, if the graph is undirected, the matrix becomes symmetric.\n\
    \nThe pseudo-code to create the matrix:\n\n```\nProcedure AdjacencyMatrix ( N):\
    \ //N represents the number of nodes\n    Matrix[ N][ N]\n    for i from 1 to\
    \ N\n        for j from 1 to N\n            Take input -> Matrix[ i][ j]\n   \
    \ endfor\nendfor\n```\n\nWe can also populate the `Matrix` using this common way:\n\
    \n```\nProcedure AdjacencyMatrix ( N, E): // N -> number of nodes\n    Matrix[\
    \ N][ E] // E -> number of edges\n    for i from 1 to E\n        input -> n1,\
    \ n2, cost\n        Matrix[ n1][ n2] = cost\nendfor\n```\n\nDrawbacks of using\
    \ Adjacency Matrix:\n- No matter how many edges are there, we will always need\
    \ `N * N` sized matrix where `N` is the number of nodes. If we consider 10000\
