  trans: "\n\n# 第 24.2 节：多线程矩阵向量乘法\n\n```\nreturn Section 24.2: Multiplication matrix\
    \ vector multithreadmatrix - vector( A,x)\n\nn = A.lines\n\ny = Vector ( n) //创建一个长度为\
    \ n 的新向量\n\nparallel for i = 1 to ny [ i] = 0\n\nparallel for i = 1 to n\n\nfor\
    \ j = 1 to n\n\ny[ i] = y[ i] + A[ i][ j]* x[ j]\n\nreturn y\n```\n\n# 第 24.3\
    \ 节：多线程归排序\n\n`A` 是一个数组，`p` 和 `q` 是数组索引，用于对子数组 `A[p..r]` 进行排序。`B` 是将填充排序结果的子数组。\n\
    \n调用 `p-merge-sort(A,p,r,B,s)` 会对 `A[p..r]` 中的元素排序并将其放入 `B[s..s+r-p]`。\n\n`p-merge-sort(\
    \ A,p,r,B,s)`\n\n```\nn = r- p+ 1\n\nif n== 1\n    B [ s] = A[ p]\nelse\n    T\
    \ = new Array ( n) //创建一个大小为 n 的新数组 T\n    q = floor(( p+ r)/ 2 ))\n    q_prime\
    \ = q- p+ 1\n    spawn p- merge- sort( A,p,q,T,1 )\n    p- merge- sort( A,q+ 1\
    \ ,r,T,q_prime+ 1 )\n    sync\n    p- merge( T,1 ,q_prime,q_prime+ 1 ,n,B,s)\n\
    ```\n\n这是执行并行合并的辅助函数。\n\n`p-merge` 假设要合并的两个子数组位于同一个数组中，但不假设它们在数组中相邻。这就是为什么我们需要\
    \ `p1,r1,p2,r2`。\n\n`p - merge( T,p1,r1,p2,r2,A,p3)`\n\n```\nn1 = r1- p1+ 1\n\n\
    n2 = r2- p2+ 1\n\nif n1< n2 //检查 n1>=n2\n    permute p1 and p2\n    permute r1\
    \ and r2\n    permute n1 and n2\n\nif n1== 0 //两个都为空?\n    return\nelse\n    q1\
    \ = floor(( p1+ r1)/ 2 )\n    q2 = dichotomic- search( T[ q1] ,T,p2,r2)\n    q3\
    \ = p3 + ( q1- p1) + ( q2- p2)\n\n    A[ q3] = T[ q1]\n    spawn p- merge( T,p1,q1-\
    \ 1 ,p2,q2- 1 ,A,p3)\n    p- merge( T,q1+ 1 ,r1,q2,r2,A,q3+ 1 )\n    sync\n```\n\
    \n这里是辅助函数 `dichotomic-search`。\n\n`x` 是在子数组 `T[p..r]` 中查找的键。\n\n```\ndichotomic\
    \ - search( x,T,p,r)\n\ninf = p\n\nsup = max( p,r+ 1 )\n\nwhile inf< sup\n   \
    \ half = floor(( inf+ sup)/ 2 )\n    if x<= T[ half]\n        sup = half\n   \
    \ else\n        inf = half+ 1\nreturn sup\n```\n\n# 第 25 章：Knuth Morris Pratt\
    \ (KMP) 算法\n\nKMP 是一种模式匹配算法，它通过在主“文本字符串” `S` 中搜索“单词” `W` 的出现情况，其原理是当发生不匹配时，我们有足够的信息来确定下一次匹配可能开始的位置。我们利用这些信息来避免匹配已知将会匹配的字符。搜索模式的最坏情况复杂度降低到\
    \ $O(n)$。\n\n## 第 25.1 节：KMP 示例算法\n\n该算法是一个两步过程。首先，我们创建一个辅助数组 `lps[]`，然后使用该数组搜索模式。\n\
    \n### 预处理：\n1. 我们对模式进行预处理并创建一个辅助数组 `lps[]`，用于在匹配时跳过字符。\n2. 这里 `lps[]` 表示最长真前缀且也是后缀。真前缀是不包含整个字符串的前缀。例如，字符串\
    \ `ABC` 的前缀有 `\" \"`、 `\"A \"`、 `\"AB \"` 和 `\"ABC \"`。真前缀是 `\" \"`、 `\"A \"`\
    \ 和 `\"AB \"`。字符串的后缀有 `\" \"`、 `\"C \"`、 `\"BC \"` 和 `\"ABC \"`。\n\n### 搜索：\n\
    1. 我们匹配字符 `txt[i]` 和 `pat[j]`，并在 `pat[j]` 和 `txt[i]` 继续匹配的同时增加 `i` 和 `j`。\n2.\
    \ 当我们看到不匹配时，知道字符 `pat[0..j-1]` 与 `txt[i-j+1 …i-1]` 匹配。我们还知道 `lps[j-1]` 是 `pat[0\
    \ …j-1]` 中既是真前缀又是后缀的字符数。从这里得出结论，不需要将这些 `lps[j-1]` 个字符与 `txt[i-j …i-1]` 匹配，因为我们知道这些字符将会匹配。\n\
    \n### 在 Java 中实现\n\n```java\npublic class KMP {\n    public static void main(\
    \ String [] args) {\n        // TODO 自动生成的方法存根\n        String str = \"abcabdabc\"\
    \ ;\n        String pattern = \"abc\" ;\n        KMP obj = new KMP();\n      \
    \  System .out .println ( obj.patternExistKMP ( str.toCharArray () , pattern.toCharArray\
    \ ()));\n    }\n\n    public int [] computeLPS( char [] str){\n        int lps[]\
    \ = new int [ str.length ];\n        lps[ 0 ] = 0;\n        int j = 0;\n     \
    \   for ( int i = 1 ; i< str.length ; i++){\n            if ( str[ j] == str[\
    \ i])){\n                lps[ i] = j+ 1;\n                j++;\n            }\
    \ else {\n                if ( j!= 0 )\n                    j = lps[ j- 1 ];\n\
    \                } else {\n                    lps[ i] = j+ 1;\n             \
    \   }\n            }\n        }\n        return lps;\n    }\n\n    public boolean\
    \ patternExistKMP( char [] text, char [] pat){\n        int [] lps = computeLPS(\
    \ pat);\n        int i = 0;\n        j = 0;\n        while ( i< text.length &&\
    \ j< pat.length ){\n            if ( text[ i] == pat[ j])){\n                i++;\n\
    \                j++;\n            } else {\n                if ( j!= 0 )\n  \
    \                  j = lps[ j- 1 ];\n                else\n                  \
    \  i++;\n            }\n        }\n        if ( j== pat.length )\n           \
    \ return true;\n        else\n            return false;\n    }\n}\n```\n\n# 第\
    \ 26 章：编辑距离算法\n\n## 第 26.1 节：将字符串 1 转换为字符串 2 的最少编辑\n\n问题描述类似于：如果我们给定字符串 `str1`\
    \ 和 `str2`，那么在 `str1` 上可以进行最少的操作以得到 `str2`。操作可以是：\n1. 插入\n2. 删除\n3. 替换\n\n**示例：**\n\
    输入 `str1 = \"geek\"`, `str2 = \"gesek\"`\n输出：`1`（只需要在第一个字符串中插入 `s`）\n\n输入 `str1\
    \ = \"march\"`, `str2 = \"cart\"`\n输出：`3`（我们需要替换 `m` 为 `c`，删除 `a`，然后替换 `h` 为 `t`）\n\
    \n为了解决这个问题，我们将使用二维数组 `dp[n+1][m+1]`，其中 `n` 是第一个字符串的长度，`m` 是第二个字符串的长度。对于我们的示例，如果\
    \ `str1` 是 `ace` 且 `str2` 是 `abcdef`，那么数组将是 `dp[6][7]`，最终答案将存储在 `dp[5][6]` 中。\n\
    \n```java\npublic int getMinConversions( String str1, String str2){\n    int n\
    \ = str1.length();\n    int m = str2.length();\n    int dp[][] = new int[n+1][m+1];\n\
    \n    for (int i = 0; i<= n; i++){\n        for (int j = 0; j<= m; j++){\n   \
    \         if (i == 0){\n                dp[i][j] = j;\n            } else if (j\
    \ == 0){\n                dp[i][j] = i;\n            } else if (str1.charAt(i-1)\
    \ == str2.charAt(j-1)){\n                dp[i][j] = dp[i-1][j-1];\n          \
    \  } else {\n                dp[i][j] = 1 + Math.min(dp[i-1][j], Math.min(dp[i][j-1],\
    \ dp[i-1][j-1]));\n            }\n        }\n    }\n    return dp[n][m];\n}\n\
    ```\n\n"
- fmt: "\n# Section 27.1: Paging (Online Caching)\n\n## Preface\nInstead of starting\
    \ with a formal definition, the goal is to approach these topic via a row of examples,\
    \ introducing definitions along the way. The remark section will consist of all\
    \ definitions, theorems and propositions to give you all information to specific\
    \ aspects. The remark section consists of the basis material used for this topic\
    \ and additional information for further reading. In addition you will find the\
    \ full source codes for the examples there. Please pay attention to make the source\
    \ code for the examples more readable and shorter it refrains from things like\
    \ error handling passes some specific language features which would obscure the\
    \ clarity of the example like extensive use of advanced libraries.\n\n## Paging\n\
    The paging problem arises from the limitation of finite space. Let's assume our\
    \ cache `C` has `k` pages. Now we want to process a sequence of `m` page requests\
    \ which must have been placed in the cache before they are processed. Of course\
    \ if `m <= k` then we just put all elements in the cache and will work, but usually\
    \ `m >> k`.\n\nWe say a request is a `cache hit`, when the page is already in\
    \ cache, otherwise, its called a `cache miss`. In that case, we must bring the\
    \ requested page into the cache and evict another, assuming the cache is full.\
    \ The Goal is an eviction schedule that minimizes the number of evictions.\n\n\
    There are numerous strategies for this problem, let's look at some:\n1. `First\
    \ in, first out (FIFO)`: The oldest page gets evicted.\n2. `Last in, first out\
    \ (LIFO)`: The newest page gets evicted.\n3. `Least recently used (LRU)`: Evict\
    \ page whose most recent access was earliest.\n4. `Least frequently used (LFU)`:\
    \ Evict page that was least frequently requested.\n5. `Longest forward distance\
    \ (LFD)`: Evict page in the cache that is not requested until farthest in the\
    \ future.\n6. `Flush when full (FWF)`: clear the cache complete as soon as a cache\
    \ miss happened\n\nThere are two ways to approach this problem:\n1. `offline`:\
    \ the sequence of page requests is known ahead of time.\n2. `online`: the sequence\
    \ of page requests is not known ahead of time.\n\n## Online Approach\nFor the\
    \ first approach look at the topic Applications of Greedy technique. It's third\
    \ Example `Online Caching` considers the first five strategies from above and\
    \ gives you a good entry point for the following.\n\nThe example program was extended\
    \ with the `FWF` strategy:\n\n```cpp\nclass FWF : public Strategy {\npublic:\n\
    \    FWF() : Strategy(\"FWF\") {\n    }\n    int apply(int requestIndex) override\
    \ {\n        for (int i = 0; i < cacheSize; ++i) {\n            if (cache[i] ==\
    \ request[requestIndex])\n                return i; // after first empty page\
    \ all others have to be empty\n            else if (cache[i] == emptyPage)\n \
