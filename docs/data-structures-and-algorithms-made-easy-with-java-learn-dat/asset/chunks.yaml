  trans: "\n\n# 在线方法\n\n现在我们来处理分页（paging）的在线问题。但首先，我们需要理解如何做到。显然，在线算法不可能优于最优离线算法。但它们到底差了多少呢？我们需要形式化的定义来回答这个问题：\n\
    \n**定义 1.1**：一个优化问题 `Π` 由一组实例 `ΣΠ` 组成。对于每一个实例 `σ`∈`ΣΠ`，存在一个解的集合 `Ζσ` 和一个目标函数 `fσ`\
    \ : `Ζσ` → `ℜ≥0`，该函数为每个解分配一个正实数。我们称 `OPT(σ)` 为最优解的值，`A(σ)` 为算法 `A` 对问题 `Π` 的解，而\
    \ `wA(σ)=fσ(A(σ))` 为其值。\n\n**定义 1.2**：对于最小化问题 `Π` 的在线算法 `A`，如果存在常数 `τ`∈`ℜ`，使得对于所有实例\
    \ `σ`∈`ΣΠ` 都有：\n```\nwA(σ) = fσ(A(σ)) ≤ r ⋅ OPT(σ) + τ\n```\n则称该算法的竞争率为 `r ≥ 1`。`A`\
    \ 被称为 `r`-竞争在线算法。如果对于所有实例 `σ`∈`ΣΠ` 都满足：\n```\nwA(σ) ≤ r ⋅ OPT(σ)\n```\n则 `A` 被称为严格\
    \ `r`-竞争在线算法。\n\n因此，问题在于与。Allan Borodin 和 Ran El-Yaniv 在他们著名的著作中使用另一个场景来描述在线分页的情况：存在一个恶意的对手，他知道你的算法和最优离线算法。在每一步中，他都会尝试请求一个对你最不利同时对离线算法最优的页面。你的算法的竞争因子就是你的算法相对于对手最优离线算法所表现出的恶劣程度。如果你想尝试扮演对手，可以尝试“对抗游戏”（Adversary\
    \ Game，尝试击败分页策略）。\n\n# 标记算法\n\n与其单独分析每种算法，让我们来看分页问题的一个特殊在线算法族，称为标记算法（marking algorithms）。\n\
    \n设 `σ=(σ1,...,σp)` 为我们问题的实例，`k` 为缓存大小，那么 `σ` 可以被分为若干阶段（phases）：\n- **阶段 1** 是\
    \ `σ` 从开始到请求了最多 `k` 个不同页面的最大子序列。\n- **阶段 i ≥ 2** 是 `σ` 从阶段 `i-1` 结束到请求了最多 `k`\
    \ 个不同页面的最大子序列。\n\n例如当 `k = 3` 时：\n\n![](img/rsrc2GS.jpg)\n\n标记算法（隐式或显式地）维护一个页面是否被标记。在每个阶段的开始，所有页面都是未标记的。如果一个页面在阶段内被请求，它就会被标记。一个算法是标记算法当且仅当它从从缓存中驱逐已标记的页面。这意味着在阶段期间使用的页面不会被驱逐。\n\
    \n**命题 1.3**：LRU 和 FWF 是标记算法。\n\n**证明**：在每个阶段的开始（第一个阶段外），FWF 会发生缓存缺失并清空缓存。这意味着我们有\
    \ `k` 个空页。在每个阶段中，都会请求最多 `k` 个不同的页面，因此在该阶段内会发生驱逐。所以 FWF 是标记算法。\n\n假设 LRU 不是标记算法。那么存在一个实例\
    \ `σ`，LRU 在阶段 `i` 驱逐了一个已标记的页面 `x`。设 `σt` 是阶段 `i` 中驱逐 `x` 的请求。由于 `x` 是标记的，在同一阶段内必须有一个早于\
    \ `x` 的请求 `σt*`，所以 `t* < t`。在 `t*` 之后 `x` 是缓存中最新的页面，因此要在 `t` 被驱逐，序列 `σt*+1,...,σt`\
    \ 必须请求至少 `k` 个不同于 `x` 的页面。这意味着阶段 `i` 请求了至少 `k+1` 个不同页面，这与阶段的定义矛盾。因此 LRU 必须是标记算法。\n\
    \n**命题 1.4**：每个标记算法都是严格 `k`-竞争的。\n\n**证明**：设 `σ` 为分页实例，`l` 为 `σ` 的阶段数。如果 `l =\
    \ 1`，则每个标记算法都是最优的，最优离线算法无法更好。\n\n假设 `l ≥ 2`。对于实例 `σ`，每个标记算法的代价上限为 `l ⋅ k`，因为在每个阶段中，标记算法在不驱逐已标记页面的情况下无法驱逐超过\
    \ `k` 个页面。现在我们尝试证明最优离线算法对于 `σ` 至少驱逐 `k+l-2` 个页面：第一阶段 `k` 个，除最后一个阶段外的每个后续阶段至少一个。为了证明，我们定义\
    \ `σ` 的 `l-2` 个不相交的子序列。子序列 `i ∈ {1,...,l-2}` 从阶段 `i+1` 的第二个位置开始，到阶段 `i+2` 的第一个位置结束。设\
    \ `x` 为阶段 `i+1` 的第一个页面。在子序列 `i` 开始时，最优离线算法缓存中有页面 `x` 和最多 `k-1` 个不同页面。在子序列 `i`\
    \ 中有 `k` 个不同于 `x` 的页面请求，因此最优离线算法每个子序列必须驱逐一个页面。由于第一阶段开始时缓存仍为空，最优离线算法在第一阶段产生了 `k`\
    \ 次驱逐。这表明 `wA(σ) ≤ l⋅k ≤ (k+l-2)k ≤ OPT(σ) ⋅ k`\n\n**推论 1.5**：LRU 和 FWF 是严格 `k`-竞争的。\n\
    \n**练习题**：证明 FIFO 不是标记算法，但是严格 `k`-竞争的。\n\n如果不存在常数 `r` 使得在线算法 `A` 是 `r`-竞争的，我们称\
    \ `A` 为非竞争。\n\n**命题 1.6**：LFU 和 FWF 不是竞争的。\n\n**证明**：设 `l ≥ 2` 为常数，`k ≥ 2`。以下是\
    \ `1` 是 `k+1`。我们观察：\n\n![](img/rsrc2GS.jpg) 第一个页面 1 是 `k-1`。\n\nLFU 和 LIFO 驱逐了\
    \ `k-1` 个页面。此外，1-1 是 `k-1`。此外，有 `k-1+2` 对于 `k-1`。\n\n![](img/rsrc2GN.jpg) 等于\n\
    \n![](img/rsrc2GP.jpg) 所以\n\n![](img/rsrc2GR.jpg) \n\n**命题 1.7**：不存在对于 `r < k`\
    \ 的 `r`-竞争分页在线算法。该命题的证明相当长，且基于 LFD 是最优离线算法。感兴趣的读者可以参考 Borodin 和 El-Yaniv 的书。\n\
    \n# 排序\n\n## 参数\n- 稳定性\n- 原地\n- 最优情况复杂度\n- 平均情况复杂度\n- 最坏情况复杂度\n\n### 描述\n如果排序算法在排序后保持相同元素的相对顺序，则它是稳定的。\n\
    \n如果排序算法排序时仅使用 `O(1)` 辅助内存（不包括需要排序的数组），则是原地的。\n\n如果排序算法的运行时间至少为 `T(n)`，则其最优情况复杂度为\
    \ `O(T(n))`。\n\n如果排序算法在所有可能输入的平均运行时间为 `T(n)`，则其平均情况复杂度为 `O(T(n))`。\n\n如果排序算法的运行时间最多为\
    \ `T(n)`，则其最坏情况复杂度为 `O(T(n))`。\n\n## 28.1：排序的稳定性\n排序的稳定性是指排序算法是否在结果输出中保持原始输入相同键的相对顺序。因此，如果两个具有相同键的对象在排序输出中的顺序与它们在输入排序数组中的顺序相同，则称该排序算法是稳定的。考虑一组对：\n\
    \n( 1, 2 ) ( 9, 7 ) ( 3, 4 ) ( 8, 6 ) ( 9, 3 )\n\n现在我们使用每个对的元素对列表进行排序。\n\n该列表的稳定排序将输出以下列表：\n\
    \n( 1, 2 ) ( 3, 4 ) ( 8, 6 ) ( 9, 7 ) ( 9, 3 )\n\n因为在原始列表中 ( 9, 3 ) 也出现在 ( 9,\
    \ 7 ) 之后。\n\n不稳定的排序将输出以下列表：\n\n( 1, 2 ) ( 3, 4 ) ( 8, 6 ) ( 9, 3 ) ( 9, 7 )\n\n\
    不稳定的排序可能会产生稳定排序相同的输出，但并非总是如此。\n\n"
- fmt: "\n## Well-known stable sorts\n- `Merge sort`\n- `Insertion sort`\n- `Radix\
    \ sort`\n- `Tim sort`\n- `Bubble Sort`\n\n## Well-known unstable sorts\n- `Heap\
    \ sort`\n- `Quick sort`\n\n## Chapter 29: Bubble Sort\n| Parameter | Description\
    \ |\n| :--- | :--- |\n| Stable | Yes |\n| In place | Yes |\n| Best case complexity\
    \ | `O(n)` |\n| Average case complexity | `O(n^2)` |\n| Worst case complexity\
    \ | `O(n^2)` |\n| Space complexity | `O(1)` |\n\n### Section 29.1: Bubble Sort\n\
    The `BubbleSort` compares each successive pair of elements in an unordered list\
    \ and inverts the elements if they are not in order.\n\nThe following example\
    \ illustrates the bubble sort on the list `{ 6 , 5 , 3 , 1 , 8 , 7 , 2 , 4 }`\
    \ (pairs that were compared in each step are encapsulated in '**'): `{ 6 ,5 ,3\
    \ ,1 ,8 ,7 ,2 ,4 }`\n\n- `{** 5 ,6 ** ,3 ,1 ,8 ,7 ,2 ,4 }` - `5 < 6` -> swap `{\
    \ 5 ,** 3 ,6 ** ,1 ,8 ,7 ,2 ,4 }` - `3 < 6` -> swap `{ 5 ,3 ,** 1 ,6 ** ,8 ,7\
    \ ,2 ,4 }` - `1 < 6` -> swap `{ 5 ,3 ,1 ,** 6 ,8 ** ,7 ,2 ,4 }` - `8 > 6` -> no\
    \ swap `{ 5 ,3 ,1 ,6 ,** 7 ,8 ** ,2 ,4 }` - `7 < 8` -> swap `{ 5 ,3 ,1 ,6 ,7 ,**\
    \ 2 ,8 ** ,4 }` - `2 < 8` -> swap `{ 5 ,3 ,1 ,6 ,7 ,2 ,** 4 ,8 **}` - `4 < 8`\
    \ -> swap\n\nAfter one iteration through the list, we have `{ 5 ,3 ,1 ,6 ,7 ,2\
    \ ,4 ,8 }`. Note that the greatest unsorted value in the array (`8` in this case)\
    \ will always reach its final position. Thus, to be sure the list is sorted we\
    \ must iterate `n-1` times for lists of length `n`.\nGraphic: ![](rsrc2GT.jpg)\n\
    \n### Section 29.2: Implementation in C & C++\nAn example implementation of `BubbleSort`\
    \ in C++:\n\n```cpp\nvoid bubbleSort( vector< int> numbers)\n{\n  for ( int i\
    \ = numbers.size () - 1 ; i >= 0 ; i--) {\n    for ( int j = 1 ; j <= i; j++)\
    \ {\n      if ( numbers[ j-1 ] > numbers[ j]) {\n        swap( numbers[ j - 1\
    \ ] ,numbers( j));\n      }\n    }\n  }\n}\n```\n\nC Implementation\n```c\nvoid\
    \ bubble_sort( long list[] , long n) {\n  long c, d, t;\n  for ( c = 0 ; c < (\
    \ n - 1 ); c++) {\n    for ( d = 0 ; d < n - c - 1 ; d++) {\n      if ( list[\
    \ d] > list[ d+ 1 ]) {\n        /* Swapping */\n        t = list[ d ];\n     \
    \   list[ d] = list[ d + 1 ];\n        list[ d + 1 ] = t;\n      }\n    }\n  }\n\
    }\n```\n\nBubble Sort with pointer\n```c\nvoid pointer_bubble_sort( long * list,\
    \ long n) {\n  long c, d, t;\n  for ( c = 0 ; c < ( n - 1 ); c++) {\n    for (\
    \ d = 0 ; d < n - c - 1 ; d++) {\n      if ( * ( list + d ) > *( list+ d+ 1 ))\
    \ {\n        /* Swapping */\n        t = * ( list + d );\n        * ( list + d\
    \ ) = * ( list + d + 1 );\n        * ( list + d + 1 ) = t;\n      }\n    }\n \
    \ }\n}\n```\n\n### Section 29.3: Implementation in C#\nBubble sort is also known\
    \ as `Sinking Sort`. It is a simple sorting algorithm that repeatedly steps through\
    \ the list to be sorted, compares each pair of adjacent items and swaps them if\
    \ they are in the wrong order.\nBubble sort example![](rsrc2GU.jpg)\n\nImplementation\
    \ of Bubble Sort\nI used C# language to implement bubble sort algorithm:\n```csharp\n\
    public class BubbleSort\n{\n  public static void SortBubble( int [] input) {\n\
    \    for ( var i = input.Length - 1 ; i >= 0 ; i--) {\n      for ( var j = input.Length\
    \ - 1 ; j >= 0 ; j--) {\n        if ( input[ j] <= input[ j + 1 ]) continue ;\n\
    \        var temp = input[ j + 1 ];\n        input[ j + 1 ] = input[ j];\n   \
    \     input[ j] = temp;\n      }\n    }\n  }\n  public static int [] Main( int\
    \ [] input) {\n    SortBubble( input);\n    return input;\n  }\n}\n```\n\n###\
    \ Section 29.4: Python Implementation\n```python\n#!/usr/bin/python\ninput_list\
    \ = [10 , 1 , 2 , 11 ]\nfor i in range (len (input_list)):\n  for j in range (i):\n\
    \    if int (input_list[j]) > int (input_list[j+1 ]):\n      input_list[j], input_list[j+1\
    \ ] = input_list[j+1 ], input_list[j]\nprint input_list\n```\n\n### Section 29.5:\
    \ Implementation in Java\n```java\npublic class MyBubbleSort {\n  public static\
    \ void bubble_srt( int array[]) {\n    //main logic\n    int n = array.length\
    \ ;\n    int k;\n    for ( int m = n; m >= 0 ; m--) {\n      for ( int i = 0 ;\
    \ i < n - 1 ; i++) {\n        k = i + 1 ;\n        if ( array[ i] > array[ k])\n\
    \          swapNumbers(i, k, array);\n      }\n    }\n    printNumbers(array);\n\
    \  }\n  private static void swapNumbers( int i, int j, int [] array) {\n    int\
    \ temp;\n    temp = array[i];\n    array[j] = temp;\n  }\n  private static void\
    \ printNumbers( int [] input) {\n    for ( int i = 0 ; i < input.length; i++)\
    \ {\n      System.out.print(input[i] + \", \");\n    }\n    System.out.println(\"\
    \\n\");\n  }\n  public static void main( String [] args) {\n    int [] input =\
    \ { 4 , 2 , 9 , 6 , 23 , 12 , 34 , 0 };\n    bubble_srt(input);\n  }\n}\n```\n\
    \n### Section 29.6: Implementation in Javascript\n```javascript\nfunction bubbleSort\
    \ (a) {\n  var swapped;\n  do {\n    swapped = false;\n    for ( var i = 0 ; i\
    \ < a.length - 1 ; i++) {\n      if (a[i] > a[i + 1]) {\n        var temp = a[i];\n\
    \        a[i] = a[i + 1];\n        a[i + 1] = temp;\n        swapped = true;\n\
    \      }\n    }\n  } while (swapped);\n}\nvar a = [ 3 , 203 , 34 , 746 , 200 ,\
    \ 984 , 764 ];\nbubbleSort(a);\nconsole.log(a); // logs [ 3, 9, 34, ... ]\n``````\n\
    \n## Chapter 30: Merge Sort\n\n### Section 30.1: Merge Sort Basics\nMerge Sort\
    \ is a divide-and-conquer algorithm. It divides the input list of length `n` in\
    \ half until there are `n` lists of size 1. Then, pairs of lists are merged together\
    \ with the smaller first element among the pair of lists being added in each step.\
    \ Through successive merging and comparison of first elements, the sorted list\
    \ is built.\nAn example: ![](rsrc2GV.jpg)\nTime Complexity : `T(n) = 2T(n/2) +\
    \ Θ(n)` The above recurrence can be solved either using Recurrence Tree or Master\
    \ method. It falls in case II of Master Method and solution of the recurrence\
    \ is `Θ(nlogn)`. Time complexity of Merge Sort is `Θ(nlogn)` in all cases (worst,\
    \ average and best) as merge sort always divides the array in two halves and take\
    \ linear time to merge halves.\nAuxiliary Space : `O(n)`\nAlgorithmic Paradigm\
    \ : Divide and Conquer\nSorting In Place : Not\nStable : Yes\n\n### Section 30.2:\
    \ Merge Sort Implementation in Go\n```go\npackage main\nimport \"fmt\"\nfunc mergeSort\
    \ (a []int ) []int {\n  if len(a) < 2 {\n    return a\n  }\n  m := (len(a)) /\
    \ 2\n  f := mergeSort(a[: m])\n  s := mergeSort(a[m:])\n  return merge(f, s)\n\
    }\nfunc merge ( f []int , s []int ) []int {\n  var i, j int\n  size := len(f)\
    \ + len(s)\n  a := make([]int , size, size)\n  for z := 0 ; z < size; z++ {\n\
    \    lenF := len(f)\n    lenS := len(s)\n    if i > lenF-1 && j <= lenS-1 {\n\
    \      a[z] = s[j]\n      j++\n    } else if j > lenS-1 && i <= lenF-1 {\n   \
    \   a[z] = f[i]\n      i++\n    } else if f[i] < s[j] {\n      a[z] = f[i]\n \
    \     i++\n    } else {\n      a[z] = s[j]\n      j++\n    }\n  }\n  return a\n\
    }\nfunc main () {\n  a := []int { 75 , 12 , 34 , 45 , 0 , 123 , 32 , 56 , 32 ,\
    \ 99 , 123 , 11 , 86 , 33 }\n  fmt.Println(a)\n  fmt.Println(mergeSort(a))\n}\n\
    ```\n\n### Section 30.3: Merge Sort Implementation in C & C#\nC Merge Sort\n```c\n\
    int merge( int arr[] ,int l,int m,int h) {\n  int arr1[10] ,arr2[10]; // Two temporary\
    \ arrays to hold the two arrays to be merged\n  int n1,n2,i,j,k;\n  n1= m-l+ 1\
    \ ;\n  n2= h- m;\n  for ( i= 0 ; i<n1; i++) arr1[ i]= arr[ l+ i];\n  for ( j=\
    \ 0 ; j<n2; j++) arr2[ j]= arr[ m+ j+ 1 ];\n  arr1[ i]= 9999 ; // To mark the\
    \ end of each temporary array\n  arr2[ j]= 9999 ;\n  i = 0 ;\n  j = 0 ;\n  for\
    \ ( k= l; k<=h; k++) { //process of combining two sorted arrays\n    if ( arr1[\
    \ i]<=arr2[ j])\n      arr[ k]= arr1[ i++];\n    else\n      arr[ k]= arr2[ j++];\n\
    \  }\n  return 0 ;\n}\nint merge_sort( int arr[] ,int low,int high) {\n  int mid;\n\
    \  if ( low< high) {\n    mid=( low+ high)/ 2 ;\n    // Divide and Conquer\n \
    \   merge_sort( arr,low,mid);\n    merge_sort( arr,mid+ 1 ,high); // Combine\n\
    \    merge( arr,low,mid,high);\n  }\n  return 0 ;\n}\n```\n\nC# Merge Sort\n```csharp\n\
    public class MergeSort {\n  static void Merge( int [] input, int l, int m, int\
    \ r) {\n    int i, j;\n    var n1 = m - l + 1 ;\n    var n2 = r - m;\n    var\
    \ left = new int [ n1];\n    var right = new int [ n2];\n    for ( i = 0 ; i <\
    \ n1; i++){\n      left[ i] = input[ l + i ];\n    }\n    for ( j = 0 ; j < n2;\
    \ j++){\n      right[ j] = input[ m + j + 1 ];\n    }\n    i = 0 ;\n    j = 0;\n\
    \    var k = l;\n    while ( i < n1 && j < n2) {\n      if (left[i] <= right[j])\
    \ {\n        input[k] = left[i];\n        i++;\n      } else {\n        input[k]\
    \ = right[j];\n        j++;\n      }\n      k++;\n    }\n    while ( i < n1) {\n\
    \      input[k] = left[i];\n      i++;\n      k++;\n    }\n    while ( j < n2)\
    \ {\n      input[k] = right[j];\n      j++;\n      k++;\n    }\n  }\n  static\
    \ void SortMerge( int [] input, int l, int r) {\n    if ( l < r) {\n      int\
    \ m = l + ( r - l) / 2 ;\n      SortMerge( input, l, m);\n      SortMerge( input,\
    \ m + 1 , r);\n      Merge( input, l, m, r);\n    }\n  }\n  public static void\
    \ Main( int [] args) {\n    int [] input = { 75 , 12 , 34 , 45 , 0 , 123 , 32\
    \ , 56 , 32 , 99 , 123 , 11 , 86 , 33 };\n    SortMerge( input, 0 , input.Length\
    \ - 1 );\n  }\n}\n```\n\n### Section 30.4: Merge Sort Implementation in Java\n\
    Below there is the implementation in Java using a generics approach. It is the\
    \ same algorithm, which is presented above.\n"
