    And the original paper is paywalled so I tried to reconstruct it from other sources
    referencing it. Please remove this comment if you could verify.)There are ways
    to ﬁnd the spanning tree in O(m) (not described here). You need to "grow" the
    spanning tree from the shortest edge to the longest, and it would be a forest
    with several connected components before fully grown.


    Select an integer b (b>=2) and only consider the spanning forests with length
    limit b^k. Merge the components which are exactly the same but with diﬀerent k,
    and call the minimum k the level of the component. Then logically make components
    into a tree. u is the parent of v iﬀ u is the smallest component distinct from
    v that fully contains v. The root is the whole graph and the leaves are single
    vertices in the original graph (with the level of negative inﬁnity). The tree
    still has only O(n) nodes.


    Maintain the distance of each component to the source (like in Dijkstra''s algorithm).
    The distance of a component with more than one vertices is the minimum distance
    of its unexpanded children. Set the distance of the source vertex to 0 and update
    the ancestors accordingly.


    Consider the distances in base b. When visiting a node in level k the ﬁrst time,
    put its children into buckets shared by all nodes of level k (as in bucket sort,
    replacing the heap in Dijkstra''s algorithm) by the digit k and higher of its
    distance. Each time visiting a node, consider only its ﬁrst b buckets, visit and
    remove each of them, update the distance of the current node, and relink the current
    node to its own parent using the new distance and wait for the next visit for
    the following buckets.


    When a leaf is visited, the current distance is the ﬁnal distance of the vertex.
    Expand all edges from it in the original graph and update the distances accordingly.


    Visit the root node (whole graph) repeatedly until the destination is reached.It
    is based on the fact that, there isn''t an edge with length less than l between
    two connected components of the spanning forest with length limitation l, so,
    starting at distance x, you could focus only on one connected component until
    you reach the distance x + l. You''ll visit some vertices before vertices with
    shorter distance are all visited, but that doesn''t matter because it is known
    there won''t be a shorter path to here from those vertices. Other parts work like
    the bucket sort / MSD radix sort, and of course, it requires the O(m) spanning
    tree.Chapter 10: Graph TraversalsSection 10.1: Depth First Search traversal functionThe
