    | 0 | 0 | inf | inf | inf | inf | inf | inf |\n+------+------+------+------+------+------+------+------+\n\
    | 1 | inf | 0 | 0 | 1 | 2 | 4 | 8 |\n+------+------+------+------+------+------+------+------+\n\
    | 2 | inf | 1 | 1 | 0 | 0 | 1 | 4 |\n+------+------+------+------+------+------+------+------+\n\
    | 3 | inf | 3 | 3 | 1 | 1 | 0 | 2 |\n+------+------+------+------+------+------+------+------+\n\
    | 5 | inf | 7 | 7 | 4 | 4 | 2 | 0 |\n+------+------+------+------+------+------+------+------+\n\
    | 5 | inf | 11 | 11 | 7 | 7 | 4 | 0 |\n+------+------+------+------+------+------+------+------+\n\
    | 5 | inf | 15 | 15 | 10 | 10 | 6 | 0 |\n+------+------+------+------+------+------+------+------+\n\
    | 6 | inf | 20 | 20 | 14 | 14 | 9 | 1 |\n+------+------+------+------+------+------+------+------+\n\
    ```\n\nThe value at `Table[7][6]` represents the maximum distance between these\
    \ two given sequences. Here `1` represents the maximum distance between `Sample`\
    \ and `Test` is `1`.\n\nNow if we backtrack from the last point, all the way back\
    \ towards the starting `(0, 0)` point, we get a long line that moves horizontally,\
    \ vertically and diagonally. Our backtracking procedure will be:\n\n```\nif Table[\
    \ i- 1 ][ j-1 ] <= Table[ i- 1 ][ j ] and Table[ i- 1 ][ j-1 ] <= Table[ i][ j-1\
    \ ]\n    i := i - 1\n    j := j - 1\nelse if Table[ i- 1 ][ j ] <= Table[ i- 1\
    \ ][ j-1 ] and Table[ i- 1 ][ j ] <= Table[ i][ j-1 ]\n    i := i - 1\nelse\n\
    \    j := j - 1\nend if\n```\n\nWe'll continue this till we reach `(0, 0)`. Each\
    \ move has its own meaning: A horizontal move represents deletion. That means\
    \ our Test sequence accelerated during this interval. A vertical move represents\
    \ insertion. That means out Test sequence decelerated during this interval. A\
