    \ We start over from a diﬀerent vertices as necessary. As soon as we discover\
    \ a vertex, DFS starts exploring from it (unlike BFS, which puts a vertex on a\
    \ queue so that it explores from it later).\n\nLet's look at an example. We'll\
    \ traverse this graph:\n\n![](rsrc2HB.jpg)\n\nWe'll traverse the graph following\
    \ these rules:\n- We'll start from the source.\n- No node will be visited twice.\n\
    - The nodes we didn't visit yet, will be colored white.\n- The node we visited,\
    \ but didn't visit all of its child nodes, will be colored grey.\n- Completely\
    \ traversed nodes will be colored black.\n\nLet's look at it step by step:\n![](rsrc2HC.jpg)\
    \ ![](rsrc2HD.jpg) ![](rsrc2HE.jpg) ![](rsrc2HF.jpg) ![](rsrc2HG.jpg) ![](rsrc2HH.jpg)\n\
    \nWe can see one important keyword. That is `backedge`. You can see. 5-1 is called\
    \ `backedge`. This is because, we're not yet done with node-1, so going from another\
    \ node to node-1 means there's a cycle in the graph. In DFS, if we can go from\
    \ one gray node to another, we can be certain that the graph has a cycle. This\
    \ is one of the ways of detecting cycle in a graph. Depending on source node and\
    \ the order of the nodes we visit, we can find out any edge in a cycle as `backedge`.\
    \ For example: if we went to 5 from 1 first, we'd have found out 2-1 as `backedge`.\n\
    \nThe edge that we take to go from gray node to white node are called `tree edge`.\
    \ If we only keep the tree edge's and remove others, we'll get `DFS tree`.\n\n\
    In undirected graph, if we can visit a already visited node, that must be a `backedge`.\
    \ But for directed graphs, we must check the colors. If and only if we can go\
    \ from one gray node to another gray node, that is called a `backedge`.\n\nIn\
    \ DFS, we can also keep timestamps for each node, which can be used in many ways\
