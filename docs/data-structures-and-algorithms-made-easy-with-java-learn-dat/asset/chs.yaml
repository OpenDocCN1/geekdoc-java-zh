  \n## 第 14 章：动态规划\n\n动态规划是一个广泛使用的概念，通常用于优化。它指的是通过递归的方式（通常是自底向上的方法）将复杂问题分解为更简单的子问题来简化问题。为了应用动态规划，问题必须具备两个关键属性：“最优子结构”和“重叠子问题”。为了实现优化，动态规划使用了一种称为“备化”的概念。\n\
  \n## 第 14.1 节：编辑距离\n\n问题描述类似于：如果我们给定两个字符串 `str1` 和 `str2`，那么对 `str1` 执行最少多少次操作可以将其转换为\
  \ `str2`。\n\n### 在 Java 中实现\n\n```java\npublic class EditDistance {\n    public\
  \ static void main( String [] args) {\n        // TODO Auto-generated method stub\n\
  \        String str1 = \"march\" ;\n        String str2 = \"cart\" ;\n        EditDistance\
  \ ed = new EditDistance();\n        System .out .println ( ed.getMinConversions\
  \ ( str1, str2));\n    }\n\n    public int getMinConversions( String str1, String\
  \ str2){\n        int dp[][] = new int [ str1.length ()+ 1 ][ str2.length ()+ 1\
  \ ];\n        for ( int i= 0 ; i<= str1.length (); i++){\n            for ( int\
  \ j= 0 ; j<= str2.length (); j++){\n                if ( i== 0 )\n             \
  \       dp[ i][ j] = j;\n                else if ( j== 0 )\n                   \
  \ dp[ i][ j] = i;\n                else if ( str1.charAt ( i- 1 ) == str2.charAt\
  \ ( j- 1 ))\n                    dp[ i][ j] = dp[ i- 1 ][ j- 1 ];\n            \
  \    else {\n                    dp[ i][ j] = 1 + Math .min ( dp[ i- 1 ][ j ] ,\
  \ Math .min ( dp[ i][ j-1 ] , dp[ i- 1 ][ j- 1 ]));\n                }\n       \
  \     }\n        }\n        return dp[ str1.length ()][ str2.length ()];\n    }\n\
  }\n```\n\n输出 3\n\n## 第 14.2 节：加权作业调度算法\n\n加权作业调度算法也可以称为加权活动选择算法。问题是：给定某些任务的开始时间、结束时间以及完成任务后获得的利润，在没有两个任务可以并行执行的情况下，你能获得的最大利润是多少？\n\
  \n这个看起来像是使用贪心算法进行活动选择，但增加了一个转折。也就是说，我们关注的不是最大化完成的任务数量，而是获取最大利润。在这里执行的任务数量并不重要。\n\
  \n让我们来看一个例子：\n\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  | Name | A | B | C | D | E | F |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  |(Start Time, Finish Time)| (2,5) | (6,7) | (7,9) | (1,3) | (5,8) | (4,6) |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  | Profit | 5 | 6 | 5 | 4 | 11 | 2 |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  \n（注：原文中表格后的描述存在逻辑混乱和重复错乱，此处已根据上下文意图进行了逻辑对齐翻译）\n\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  | Name | A | B | C | D | E | F |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  |(Start Time, Finish Time)| (2,5) | (6,7) | (7,9) | (1,3) | (5,8) | (4,6) |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  | Profit | 5 | 6 | 5 | 4 | 11 | 2 |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  \n在上面的例中，`Acc_Prof[j] + Profit[i]` 代表了这两个任务的总利润。如果 `Job[j]` 与 `Job[i]` 重叠，则它们不能一起完成。由于\
  \ `j` 等于 `i-1`，我们将 `i` 增加到 `i+1`。\n\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  | Name | A | B | C | D | E | F |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  |(Start Time, Finish Time)| (2,5) | (6,7) | (7,9) | (1,3) | (5,8) | (4,6) |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  | Profit | 5 | 6 | 5 | 4 | 11 | 2 |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  \n我们首先要做的事情是根据结束时间对任务进行排序。为什么要这样做？因为选择一个时间更短的任务可以为其他任务留出更多时间。\n\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  | Name | A | B | C | D | E | F |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  |(Start Time, Finish Time)| (2,5) | (6,7) | (7,9) | (1,3) | (5,8) | (4,6) |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  | Profit | 5 | 6 | 5 | 4 | 11 | 2 |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  \n我们将有一个大小为 `n` 的额外数组 `Acc_Prof`（这里 `n` 表示任务总数）。它将包含任务的总利润。等等，观察：我们将用每个任务的利润初始化\
  \ `Acc_Prof`。\n\n`Acc_Prof[i]` 将持有第 `i` 个任务的利润。现在我们将位置 2 标记为 `i`，将位置 1 标记为 `j`。我们的策略是让\
  \ `j` 从 1 迭代到 `i-1`，在每次迭代后，我们把 `i` 增加到 `i+1`，直到 `i` 变为 `n+1`。\n\n（注：原文最后部分存在大量文本重复和乱码，已根据标准算法逻辑进行了修正性翻译）\n\
  \n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  | Name | A | B | C | D | E | F |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  |(Start Time, Finish Time)| (2,5) | (6,7) | (7,9) | (1,3) | (5,8) | (4,6) |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  | Profit | 5 | 6 | 5 | 4 | 11 | 2 |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  \n我们检查 `Job[i]` 和 `Job[j]` 是否重叠，即如果 `Job[j]` 的结束时间大于 `Job[i]` 的开始时间，那么这两个任务就不能一起完成。然而，如果没有重叠，我们将检查\
  \ `Acc_Prof[j] + Profit[i] > Acc_Prof[i]`。那就是：\n\n```python\nif Job[j].finish_time\
  \ <= Job[i].start_time\n    if Acc_Prof[j] + Profit[i] > Acc_Prof[i]\n        Acc_Prof[i]\
  \ = Acc_Prof[j] + Profit[i]\n```\n\n\n\n\n\n```\nj i+-------------------------+---------+---------+---------+---------+---------+---------+\n\
