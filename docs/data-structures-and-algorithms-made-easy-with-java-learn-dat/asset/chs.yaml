  \ n; i++){ //初始化 x[ i]= 0 ;\n    }\n\n    JacobisMethod( n, x, b, a);\n    print(\
  \ n, x);\n    for ( i= 0 ; i< n; i++){ //初始化 x [ i]= 0 ;\n    }\n\n    GaussSeidalMethod(\
