  \n![](img/rsrc2FK.jpg) 再次选择从青色节点向下移动，因为所有选项的 f 值都相同：![](img/rsrc2FM.jpg) 我们为青色节点唯一的邻居计算启发式：\n\
  \n![](img/rsrc2FN.jpg) 好，由于我们将遵循一直以来相同的模式：![](img/rsrc2FP.jpg) 再次计算该节点邻居的启发式：\n\n\
