  | Acc_Prof | 5 | 6 | 5 | 4 | 11 | 2 |\n+-------------------------+---------+---------+---------+---------+---------+---------+\n\
  ```\n现在 `Job[j]` 和 `Job[i]` 不重叠。通过选择这两个任务，我们能获得的总利润为：`Acc_Prof[j] + Proﬁt[i] = 5\
  \ + 5 = 10`，这大于 `Acc_Prof[i]`。因此我们更新 `Acc_Prof[i] = 10`。同时让 `j` 增加 1。我们得到：\n\n```\n\
