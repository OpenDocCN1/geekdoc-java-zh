  \ //参数//赋值\n    a[ 0 ][ 0 ]= 8 ; a[ 0 ][ 1 ]= 2 ; a[ 0 ][ 2 ]= 2 ; b[ 0 ]= 8 ; //8x\
  \ ₁ +2x ₂ -2x ₃ +8=0\n    a[ 1 ][ 0 ]= 1 ; a[ 1 ][ 1 ]= 8 ; a[ 1 ][ 2 ]= 3 ; b[\
  \ 1 ]= 4 ; //x ₁ -8x ₂ +3x ₃ -4=0\n    a[ 2 ][ 0 ]= 2 ; a[ 2 ][ 1 ]= 1 ; a[ 2 ][\
