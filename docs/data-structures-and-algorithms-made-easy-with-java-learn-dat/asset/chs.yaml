  \    }\n}\n```\n\n## 第 42 章：深度优先搜索\n\n## 第 42.1 节：深度优先搜索简介\n\n深度优先搜索（DFS）是一种用于遍历或搜索树或图数据结构的算法。从根节点开始，沿着每个分支尽可能深地探索，然后回溯。19\
  \ 世纪，法国数学家查尔斯·皮埃·特雷莫（Charles Pierre Trémaux）曾研究过深度优先搜索，作为解决迷宫的策略。\n\n深度优先搜索是寻找从源顶点可达的所有顶点的系统方法。与广度优先搜索（BFS）一样，DFS\
  \ 遍历给定图的一个连通分量并定义一个生成树。深度优先搜索的基本思想是有条理地探索每条边。我们根据需要从不同的顶点重新开始。一旦发现一个顶点，DFS 就会从该顶点开始探索（与\
  \ BFS 不同，BFS 将顶点放入队列以便稍后从其进行探索）。\n\n让我们来看一个例子。我们将遍历这个图：\n\n![](img/rsrc2HB.jpg)\n\
  \n我们将遵循以下规则遍历图：\n- 我们从源点开始。\n- 节点不会被访问两次。\n- 我们尚未访问的节点将被涂为白色。\n- 我们访问过但尚未访问所有子节点的节点将被涂为灰色。\n\
  - 完全遍历的节点将被涂为黑色。\n\n让我们逐步观察：\n![](img/rsrc2HC.jpg) ![](img/rsrc2HD.jpg) ![](img/rsrc2HE.jpg)\
  \ ![](img/rsrc2HF.jpg) ![](img/rsrc2HG.jpg) ![](img/rsrc2HH.jpg)\n\n我们可以看到一个重要的关键词\
  \ `backedge`（回边）。你可以看到 5-1 是 `backedge`。这是因为我们还没有完成节点 1，在 DFS 中，如果可以从一个灰色节点到另一个节点，则可以确定图中存在环。这是检测图中环的方法之一。根据源节点和访问节点的顺序，我们可以发现环中的任何边为\
  \ `backedge`。例如：如果先去到 5，就会发现 2-1 是 `backedge`。\n\n从灰色节点到白色节点的边被称为 `tree edge`（树边）。如果只保留树边并移除其他的，将得到\
  \ `DFS`。在无向图中，如果可以访问已访问的节点，那必须是 `backedge`。但对于有向图，只有当从一个灰色节点到另一个灰色节点时，才是 `backedge`。在\
  \ DFS 中，为每个节点保留时间戳，可以用于许多方法（例如：拓排序）。\n\n1. 当节点 `v` 从白色变为灰色时，记录在 `d[v]` 中。\n2. 当节点\
  \ `v` 从灰色变为黑色时，记录在 `f[v]` 中。\n\n`d[]` 表示发现时间，`f[]` 表示完成时间。我们的伪代码如下：\n\n```text\n\
  Procedure DFS ( G):\n    for each node u in V[ G]\n        color[ u ] := white\n\
  \        parent[ u ] := NULL\n    end for\n    time := 0\n    for each node u in\
  \ V[ G]\n        if color[ u ] == white\n            DFS- Visit( u)\n\nProcedure\
  \ DFS - Visit( u):\n    color[ u ] := gray\n    time := time + 1\n    d[ u ] :=\
  \ time\n    for each node v adjacent to u\n        if color[ v ] == white\n    \
  \        parent[ v ] := u\n            DFS- Visit( v)\n    end for\n    color[ u\
  \ ] := black\n    time := time + 1\n    f[ u ] := time\n```\n\n每个节点和边都被访问一次。因此 DFS\
  \ 的复杂度为 `O(V+E)`，其中 `V` 表示节点，`E` 表示边。\n\n深度优先搜索的应用：\n- 在无向图中寻找所有路径。\n- 检测图中的环。\n\
  - 拓排序。\n- 寻找强连通分量。\n\n## 第 43 章：哈希函数\n\n## 第 43.1 节：常见类型的哈希值\n\n`System` 命名空间中的内置和常见类型通过\
  \ `GetHashCode()` 方法产生的哈希值如下：\n\n- `Boolean`：如果值为 true 则为 1，否则为 0。\n- `Byte`, `UInt16`,\
  \ `Int32`, `Single`（如有必要）。\n- `SByte`：`(( int ) m_value ^ ( int ) m_value << 8 )`。\n\
  - `Char`：`(( int ) m_value ^ ( int ) m_value << 16 )`。\n- `Int16`：`(( int ) (ushort)\
  \ m_value) ^ (( int ) m_value << 16 )`。\n- `Int64`, `Double`：`unchecked(( int )\
  \ long ) m_value)) ^ ( int )(m_value >> 32 )`。\n- `UInt64`, `DateTime`, `TimeSpan`：`((\
  \ int ) m_value) ^ ( int )(m_value >> 32 )`。\n- `Decimal`：`(( int *)& dbl)[ 0 ])\
  \ & 0xFFF0) ^ (( int *)& dbl)[ 1 ]`。\n- `Object`：`RuntimeHelpers.GetHashCode ()`。默认实现使用同步块索引。\n\
  - `String`：哈希值的计算取决于平台类型（Win32 或 Win64）、使用随机字符串哈希特性、Debug / Release 模式。在 Win64 平台下：\n\
  ```c\nint hash1 = 5381;\nint hash2 = hash1;\nint c;\nchar * s = src;\nwhile (( c\
  \ = s[ 0 ]) != 0 ) {\n    hash1 = (( hash1 << 5) + hash1) ^ c;\n    c = s[ 1 ];\n\
  \    if ( c == 0 ) break;\n    hash2 = (( hash2 << 5) + hash2) ^ c;\n    s += 2;\n\
  }\nreturn hash1 + ( hash2 * 1566083941);\n```\n- `ValueType`：查找第一个静态字段并获取其哈希值。如果类型没有静态字段，返回类型的哈希值。无法获取静态成员的哈希值，因为如果该成员与原始类型相同，计算将陷入无限循环。\n\
  - `Nullable<T>`：`return hasValue ? value.GetHashCode () : 0;`。\n- `Array`：遍历元素并使用\
  \ `(( ret << 5 ) + ret) ^ comparer.GetHashCode ( GetValue( i))` 计算哈希。\n\n参考文献：\n\
  \n## 第 43.2 节：哈希函数简介\n\n哈希函数 `h()` 是一种任意函数，它将任意大小的数据 `x ∈ X` 映射到固定大小的值 `y ∈ Y`：`y\
  \ = h( x)`。良好的哈希函数具有以下限制：\n\n- 哈希函数的行为类似于均匀分布\n- 哈希函数是确定性的。对于给定的 `x`，`h( x)` 应该总是返回相同的值。\n\
  \n\n\n\n# 快速计算（运行复杂度 O(1)）\n\n在一般情况下，哈希函数的大小小于输入数据的大小：`| y| < | x|`。哈希函数是逆的，换句话说，它们可能会发生冲突：`∃\
  \ x1, x2 ∈ X, x1 ≠ x2: h( x1) = h( x2 )`。`X` 可能是有限或无限集，而 `Y` 是有限集。\n\n哈希函数用于计算机科学的许多领域，例如软件工程、密码学、数据库、网络、机器学习等。有许多不同类型的哈希函数，具有不同的特定领域属性。哈值通常是一个整数值。编程语言中提供了特殊的方法来计算哈希。例如，在\
  \ `C#` 中，所有类型的 `GetHashCode()` 方法都返回 `Int32` 值（32 位整数）。在 `Java` 中，每个类都提供一个 `hashCode()`\
  \ 方法，返回 `int`。每种数据类型都有自己的或用户定义的实现。\n\n## 哈希方法\n\n确定哈希函数有几种方法。在不失一般性的情况下，假设 `x ∈\
  \ X = { z ∈ ℤ: z ≥ 0 }` 是正整数。通常 `m` 是质数（不要太接近 2 的幂）。\n\n## 哈希函数方法\n\n### 除法法\n`h(\
  \ x) = x mod m`\n\n### 乘法法\n`h( x) = ⌊m ( xA mod 1 ) ⌋, A ∈ { z ∈ ℝ: 0 < z < 1 }`\n\
  \n## 哈希表\n\n哈希函数用于哈希表中计算到槽位数组的索引。`哈希表`是实现字典（键值结构）的数据结构。实现良好的哈希表在执行后续操作时具有 `O(1)`\
  \ 时间：插入、搜索和通过键删除数据。多个键可能会哈希到同一个槽位。解决冲突有两种方法：\n\n1. **链法**：使用链表存储槽位中具有相同哈希值的元素。\n\
  2. **开放地址法**：每个槽位存储零个或一个元素。\n\n以下方法用于计算开放地址法所需的探测序列。\n\n## 方法公式\n\n### 线性探测\n`h(\
  \ x, i) = ( h'(x) + i) mod m`\n\n### 二次探测\n`h( x, i) = ( h'(x) + c1*i + c2*i²) mod\
  \ m`\n\n### 双重哈希\n`h( x, i) = ( h1( x) + i* h2( x)) mod m` 其中 `i ∈ { 0 , 1 , ...,\
  \ m - 1 }`，`h'(x)`, `h1(x)`, `h2(x)` 是辅助哈希函数，`c1, c2` 是正辅助常量。\n\n## 示例\n\n假设 `x\
  \ ∈ U{ 1 , 1000 }`，`h = x mod m`。下表显示了非质数和质数情况下的哈值。粗体文本表示相同的哈值。\n\n| x | m = 100\
  \ (非质数) | m = 101 (质数) |\n| :--- | :--- | :--- |\n| 72 | 23 | 16 |\n| 103 | 3 |\
  \ 2 |\n| 73 | 38 | 31 |\n| 29 | 92 | 90 |\n| 61 | 61 | 61 |\n| 87 | 87 | 87 |\n\
  | 995 | 95 | 86 |\n| 549 | 49 | 44 |\n| 991 | 91 | 82 |\n| 757 | 57 | 50 |\n| 920\
  \ | 20 | 11 |\n| 626 | 26 | 20 |\n| 557 | 57 | 52 |\n| 831 | 31 | 23 |\n| 619 |\
  \ 19 | 13 |\n\n## 链接 \n- Thomas H. Cormen, Charles E. Leiserson, Ronald L. Rivest,\
  \ Cliﬀord Stein. Introduction to Algorithms.\n- Overview of Hash Tables Wolfram\
  \ MathWorld - Hash Function\n\n## 第 44 章：旅行商问题\n\n### 第 44.1 节：暴力破解算法\n通过每个顶点一次的路径等同于以某种方式对顶点进行排序。因此，为了计算通过每个顶点一次的旅行最小成本，我们可以暴力遍历从\
  \ 1 到 `N` 的所有 `N!` 种排列。\n\n### 伪代码\n```python\nminimum = INF\n\nfor all permutations\
  \ P\n  current = 0\n  for i from 0 to N - 2\n    current = current + cost[ P[ i]][\
  \ P[ i+ 1 ]] # 添加从一个顶点到下一个顶点的成本\n  current = current + cost[ P[ N - 1 ]][ P[ 0 ]]\
  \ # 添加从最后一个顶点到第一个顶点的成本\n  if current < minimum: # 必要时更新最小值\n    minimum = current\n\
  output minimum\n```\n\n### 时间复杂度\n有 `N!` 个排列需要遍历，每条路径的成本在 `O( N)` 内计算，因此该算法需要 `O(\
  \ N * N!)` 时间来输出精确答案。\n\n## 第 44.2 节：动态规划算法\n注意，如果我们考虑路径（按顺序）：\n`( 1 ,2 ,3 ,4 ,6\
  \ ,0 ,5 ,7 )`\n和路径 `( 1 ,2 ,3 ,5 ,0 ,6 ,4 )`\n从顶点 1 到顶点 2 再到顶点 3 的成本是相同的，所以为什么要重新计算？这个结果可以保存起来以后使用。\n\
  `dp[bitmask][vertex]` 表示遍历所有 `bitmask` 中设置为 1 的顶点的旅行成本。例如：\n`dp[12][2 ]`\n`12 =\
  \ 1100`\n`vertices: 3 2 1 0`\n由于 `12` 代表二进制 `1100`，`dp[12][2 ]` 表示在顶点 2 处结束的顶点 2。\n\
  \n因此我们可以有以下算法（C++ 实现）：\n```cpp\nint cost[ N][ N];\nint memo[1 << N][ N];\n\nint\
  \ TSP( int bitmask, int pos){\n    int cost = INF;\n\n    if (bitmask == ((1 <<\
  \ N) - 1 ){ \n        return cost[ pos][ 0 ];\n    }\n\n    if ( memo[bitmask][\
  \ pos] != -1 ){ \n        return memo[bitmask][ pos]; \n    }\n\n    for ( int i\
  \ = 0 ; i < N ; i++){\n        if ((bitmask & (1 << i)) == 0 ){ // 如果顶点未被访问\n  \
  \          cost = min( cost,TSP( bitmask | (1 << i) , i) + cost[ pos][ i]); // 访问顶点\n\
  \        }\n    }\n\n    memo[bitmask][ pos] = cost; // 保存结果\n    return cost;\n\
  }\n// 调用 TSP(1,0)\n// 如果需要调整 N 的值\n// 将此处所有内容设为 -1\n// 所有顶点都已探索\n// 回溯成本\n// 如果已经计算过\n\
  // 直接返回值，不需要重新计算\n// 每个顶点\n```\n这行代码可能让人困惑，让我们过一遍：\n`memo[bitmask][ pos] = cost;\
  \ // 保存结果`\n`return cost;}`\n这代表计算出的值，不需要重新计算。\n`每个顶点`\n`for ( int i = 0 ; i < N\
  \ ; i++){`\n`if ((bitmask & (1 << i)) == 0 ){ // 如果顶点未被访问`\n`cost = min( cost,TSP(\
  \ bitmask | (1 << i) , i) + cost[ pos][ i]); // 访问顶点`\n`}`\n这代表访问顶点。\n`memo[bitmask][\
  \ pos] = cost; // 保存结果`\n这代表保存结果。\n`if ( memo[bitmask][ pos] != -1 ){ return memo[bitmask][\
  \ pos]; }`\n这代表已经计算过。\n`if ( bitmask == ((1 << N) - 1 ){ return cost[ pos][ 0 ];\
  \ }`\n这代表回溯成本。\n\n### 时间复杂度\n有 `N!` 个排列需要遍历，每条路径的成本在 `O( N)` 内计算，因此该算法需要 `O( N *\
  \ N!)` 时间来输出精确答案。\n\n## 第 45 章：背包问题\n\n### 第 45.1 节：背包问题\n给定一组物品，每个物品包含重量和价值，确定在集合中包含每种物品的数量，使得总重量小于或等于给定的限制，且总价值最大。\n\
  \n背包问题的伪代码：\n给定：\n1. 价值(数组 v)\n2. 重量(数组 w)\n3. 物品数量(n)\n4. 容量(W)\n`for j from 0\
  \ to W do :`\n`m[ 0 , j] := 0`\n`for i from 1 to n do :`\n`for j from 0 to W do\
  \ :`\n`if w[i] > j then:`\n`m[i, j] := m[ i - 1 , j]`\n`else:`\n`m[i, j] := max(\
  \ m[ i - 1 , j ], val[ i - 1 ] + m[ i - 1 , j - w[i] ])`\n\n使用 Python 实现上述代码：\n\
  ```python\ndef knapsack( W, wt, val, n):\n    K = [[0 for x in range(W+ 1)] for\
  \ x in range(n+ 1)]\n    for i in range(n+ 1):\n        for w in range(W+ 1):\n\
  \            if i== 0 or w== 0:\n                K[i][w] = 0\n            elif wt[\
  \ i - 1 ] <= w:\n                K[i][w] = max( val[ i - 1 ] + K[i - 1][w - wt[\
  \ i - 1 ]], K[i - 1][w])\n            else:\n                K[i][w] = K[i - 1][w]\n\
  \    return K[n][ W]\n```\n运行代码：\n`val = [ 60 , 100 , 120 ]`\n`wt = [ 10 , 20 ,\
  \ 30 ]`\n`W = 50`\n`n = len( val)`\n`print( knapsack( W, wt, val, n))`\n输出：220\n\
  \n上述代码的时间复杂度为 O(nW)，其中 n 是物品数量，W 是背包容量。\n\n### 第 45.2 节：C# 实现\n```csharp\npublic\
  \ class KnapsackProblem\n{\n    private static int Knapsack(int w, int[] weight,\
  \ int[] value, int n)\n    {\n        int i;\n        int[,] k = new int[n + 1,\
  \ w + 1]; \n        for (i = 0; i <= n; i++)\n        {\n            int b;\n  \
  \          for (b = 0; b <= w; b++)\n            {\n                if (i == 0 ||\
  \ b == 0)\n                {\n                    k[i, b] = 0;\n               \
  \ }\n                else if (weight[i - 1] <= b)\n                {\n         \
  \           k[i, b] = Math.Max(value[i - 1] + k[i - 1, b - weight[i - 1]], k[i -\
  \ 1, b]);\n                }\n                else\n                {\n        \
  \            k[i, b] = k[i - 1, b];\n                }\n            }\n        }\n\
  \        return k[n, w];\n    }\n\n    public static int Main(int nItems, int[]\
  \ weights, int[] values)\n    {\n        int n = values.Length;\n        return\
  \ Knapsack(nItems, weights, values, n);\n    }\n}\n```\n\n## 第 46 章：方程求解\n\n## 第\
  \ 46.1 节：线性方程\n求解线性方程的方法有两类：\n\n\n\n\n\n# 1. 直接法\n直接法的共同特征是将原始方程转换为更更容易求解的等价方程，这意味着我们可以直接从方程得到解。\n\
  \n# 2. 迭代法\n迭代法（或间接法）从解的估计值开始，然后不断修正解，直到达到特定的收敛标准。迭代法的效率通常比直接法低，因为它们需要大量的计算。示例：`Jacobi\
  \ 迭代法`（Jacobi's Iteration Method）、`Gauss-Seidel 迭代法`（Gauss-Seidal Iteration Method）。\n\
  \n## C 语言语言实现\n```c\n//Implementation of Jacobi's Method\nvoid JacobisMethod( int\
  \ n, double x[ n] , double b[ n] , double a[ n][ n]){\n    double Nx[ n]; //变量的修正形式\n\
  \    int rootFound= 0 ; //标志位\n    int i, j;\n\n    while (! rootFound){\n     \
  \   for ( i= 0 ; i< n; i++){ //计算 Nx[ i]= b[ i];\n            for ( j= 0 ; j< n;\
  \ j++){\n                if ( i!= j) Nx[ i] = Nx[ i] - a[ i][ j]* x[ j];\n     \
  \       }\n            Nx[ i] = Nx[ i] / a[ i][ i];\n        }\n        rootFound=\
  \ 1 ; //验证\n        for ( i= 0 ; i< n; i++){\n            if (!( ( Nx[ i]- x[ i])/\
  \ x[ i] > 0.000001 && ( Nx[ i]- x[ i])/ x[ i] < 0.000001 )) {\n                rootFound=\
  \ 0 ;\n                break ;\n            }\n        }\n        for ( i= 0 ; i<\
  \ n; i++){ //赋值 x[ i]= Nx[ i];\n        }\n    }\n    return ;\n}\n\n//Implementation\
  \ of Gauss-Seidal Method\nvoid GaussSeidalMethod( int n, double x[ n] , double b[\
  \ n] , double a[ n][ n]){\n    double Nx[ n]; //变量的修正形式\n    int rootFound= 0 ;\
  \ //标志位\n    int i, j;\n\n    for ( i= 0 ; i< n; i++){ //初始化 Nx[ i]= x[ i];\n  \
