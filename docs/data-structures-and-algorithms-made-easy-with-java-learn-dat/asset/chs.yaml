  类型为 `f( x)= 0` 的方程可以是代数方程，也可以是超越方程。这类方程可以使用两种方法进行求解。\n\n1. **直接法**：该方法在有限步内直接给出所有根的精确值。\n\
  2. **间接法或迭代法**：迭代法最适合计算机程序求解方程。它基于连续逼近的概念。迭代法有两种求解方程的方法：\n    - **区间法**：取两个根位于之间的初始点。示例：`二分法`（Bisection\
  \ Method）、`虚线法`（False Position Method）。\n    - **开区间法**：取一个或两个初始值，根可能在任何位置。示例：`牛顿-迭代法`（Newton-Raphson\
  \ Method）、`连续逼近法`（Successive Approximation Method）、`割线法`（Secant Method）。\n\n## C\
  \ 语言实现\n```c\n/// 此处定义用于使用的函数\n#define f(x) ( ((x)*(x)*(x)) - (x) - 2 )\n#define\
