  int merge( int arr[] ,int l,int m,int h) {\n  int n1,n2,i,j,k;\n  // Temporary arrays\
  \ to hold the two subarrays\n  n1 = m - l + 1;\n  n2 = h - m;\n  int L[n1], R[n2];\n\
  \  // Copy data to temp arrays L[] and R[]\n  for (i = 0; i < n1; i++)\n    L[i]\
  \ = arr[l + i];\n  for (j = 0; j < n2; j++)\n    R[j] = arr[m + 1 + j];\n  // Initial\
  \ indices of first and second subarrays\n  i = 0; j = 0;\n  k = l;\n  // Merge the\
  \ temp arrays back into arr[l..h]\n  while (i < n1 && j < n2) {\n    if (L[i] <=\
  \ R[j]) {\n      arr[k] = L[i];\n      i++;\n    } else {\n      arr[k] = R[j];\n\
  \      j++;\n    }\n    k++;\n  }\n  // Copy the remaining elements of L[], if any\n\
  \  while (i < n1) {\n    arr[k] = L[i];\n    i++;\n    k++;\n  }\n  // Copy the\
  \ remaining elements of R[], if any\n  while (j < n2) {\n    arr[k] = R[j];\n  \
  \  j++;\n    k++;\n  }\n}\nvoid mergeSort(int arr[], int l, int h) {\n  if (l <\
  \ h) {\n    int m = l + (h - l) / 2;\n    mergeSort(arr, l, m);\n    mergeSort(arr,\
  \ m + 1, h);\n    merge(arr, l, m, h);\n  }\n}\n```\n\nC# 归并排序\n```csharp\npublic\
  \ class MergeSort {\n  static void Merge(int[] arr, int l, int m, int r) {\n   \
  \ int n1 = m - l + 1;\n    int n2 = r - m;\n    int[] left = new int[n1];\n    int[]\
  \ right = new int[n2];\n    for (int i = 0; i < n1; i++)\n      left[i] = arr[l\
  \ + i];\n    for (int j = 0; j < n2; j++)\n      right[j] = arr[m + 1 + j];\n  \
  \  int i = 0, j = 0, k = l;\n    while (i < n1 && j < n2) {\n      if (left[i] <=\
  \ right[j]) {\n        arr[k] = left[i];\n        i++;\n      } else {\n       \
  \ arr[k] = right[j];\n        j++;\n      }\n      k++;\n    }\n    while (i < n1)\
  \ {\n      arr[k] = left[i];\n      i++;\n      k++;\n    }\n    while (j < n2)\
  \ {\n      arr[k] = right[j];\n      j++;\n      k++;\n    }\n  }\n  static void\
  \ MergeSort(int[] arr, int l, int r) {\n    if (l < r) {\n      int m = l + (r -\
  \ l) / 2;\n      MergeSort(arr, l, m);\n      MergeSort(arr, m + 1, r);\n      Merge(arr,\
  \ l, m, r);\n    }\n  }\n  public static void Main(string[] args) {\n    int[] arr\
  \ = { 75, 12, 34, 45, 0, 123, 32, 56, 32, 99, 123, 11, 86, 33 };\n    MergeSort(arr,\
