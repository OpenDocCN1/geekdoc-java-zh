  \n## 第 6 章：检查树是否为 BST\n\n### 第 6.1 节：检查二叉树是否为 BST 的算法\n\n二叉树如果满足以下任一条件则为 BST：\n\
  1. 它是空的。\n2. 它没有子树。\n3. 对于每个节点 `x`，左子树中的所有键值都小于 `x`，右子树中的所有键值都大于 `x`。\n\n一种直接但效率低的方法是执行中序遍历。如果中序遍历产生有序键值序列，则该树是\
  \ BST。为了检查中序序列是否有序，记住上一个访问节点的值并与当前节点进行比较。\n\n更高效的方法：\n\n```cpp\nis_BST( root, min,\
  \ max): \n    if root == NULL :\n        return true\n    // 当前节点的键值是否超出范围？\n  \
  \  if root-> key < min || root-> key > max:\n        return false\n    // 检查左、右子树是否为\
  \ BST\n    return is_BST( root-> left,min,root-> key- 1 ) && is_BST( root-> right,root->\
  \ key+ 1 ,max)\n```\n\n初始调用方式：`is_BST( my_tree_root,KEY_MIN,KEY_MAX)`。\n\n### 第\
  \ 6.2 节：给定的输入树是否符合二叉搜索树属性\n\n例如：\n如果输入是：\n![](img/rsrc2ES.jpg) 输出应该是 false：因为左子树中的\
  \ 4 大于根节点值(3)。\n\n如果输入是：\n![](img/rsrc2F1.jpg) 输出应该是 true。\n\n## 第 7 章：二叉树遍历\n\n\
  按照某种特定顺序访问二叉树的节点被称为遍历。\n\n## 第 7.1 节：层序遍历 - 实现\n\n例如，如果给定的树是：\n![](img/rsrc2EU.jpg)\
  \ 层序遍历将是\n1 2 3 4 5 6 7\n按层打印节点数据。\n\n```cpp\n#include < iostream>\n```\n\n\n\n\
  ```cpp\n#include<queue>\n#include<malloc.h>\nusing namespace std;\n\nstruct node\
  \ {\n    int data;\n    node *left;\n    node *right;\n};\n\nvoid levelOrder(struct\
  \ node *root) {\n    if (root == NULL) return;\n    queue<node *> Q;\n    Q.push(root);\n\
  \    while (!Q.empty()) {\n        struct node* curr = Q.front();\n        cout\
  \ << curr->data << \" \";\n        if (curr->left != NULL) Q.push(curr->left);\n\
  \        if (curr->right != NULL) Q.push(curr->right);\n        Q.pop();\n    }\n\
  }\n\nstruct node* newNode(int data) {\n    struct node *node = (struct node*)malloc(sizeof(struct\
  \ node));\n    node->data = data;\n    node->left = NULL;\n    node->right = NULL;\n\
  \    return (node);\n}\n\nint main() {\n    struct node *root = newNode(1);\n  \
  \  root->left = newNode(2);\n    root->right = newNode(3);\n    root->left->left\
  \ = newNode(4);\n    root->left->right = newNode(5);\n    root->right->left = newNode(6);\n\
  \    root->right->right = newNode(7);\n    printf(\"Level Order of binary tree is\
  \ \\n \");\n    levelOrder(root);\n    return 0;\n}\n```\n\n`Queue` 数据结构用于实现上述目标。\n\
  \n## 7.2 节 二叉树的前序、中序和后序遍历\n\n考虑二叉树：\n\n![](img/src2EU.jpg)\n\n前序遍历 `(root)` 是访问节点、左子树，然后右子树。\n\
  \n因此上述二叉树的前序遍历为：\n1 2 4 5 3 6 7\n\n中序遍历 `(root)` 是访问左子树、节点，然后右子树。\n\n因此上述二叉树的中序遍历为：\n\
  4 2 5 1 6 3 7\n\n后序遍历 `(root)` 是访问左子树、右子树，然后节点。\n\n因此上述二叉树的后序遍历为：\n4 5 2 6 7 3 1\n\
  \n## 第 8 章：二叉树的最近祖先\n\n两个节点 `n1` 和 `n2` 之间的最近祖先定义为树中同时具有 `n1` 和 `n2` 为后代的节点。\n\n\
  ## 8.1 节 寻找最近祖先\n\n考虑树：\n\n![](img/src2ES.jpg)\n\n值为 1 和 4 的节点的最近祖先是 2。\n值为 1 和\
  \ 5 的节点的最近祖先是 3。\n值为 2 和 4 的节点的最近祖先是 4。\n值为 1 和 2 的节点的最近祖先是 2。\n\n## 第 9 章：图\n\n\
  图是点及其连接子集的线的集合。图的点称为顶点（vertices）、“节点”或简单的“点”。同样，连接图中顶点的线称为边（edges）、“弧”或“线”。\n\n\
  图 `G` 可以定义为一个对 `(V,E)`，其中 `V` 是顶点集合，`E` 是顶点间的边集合 `E ⊆ {(u,v) | u, v ∈ V}`。\n\n##\
  \ 9.1 节：存储图（邻接矩阵）\n\n为了存储图，通常有两种方法：\n\n1. 邻接矩阵\n2. 邻接列表\n\n邻接矩阵是一种用于表示有限图的方阵。矩阵的元素表示图中顶点对是否相邻。\n\
  \n相邻意味着“靠近或连接到某物”或位于某物旁边。例如，你的邻居与你是相邻的。在图论中，如果我们能从节点 `A` 到节点 `B`，我们可以说节点 `B` 邻节点\
  \ `A`。现在我们将学习如何通过邻接矩阵存储哪些节点与哪些节点相邻的。这意味着我们将表示哪些节点之间共享边。这里矩阵意味着二维数组。\n\n![](img/src2F2.jpg)\
  \ 在这里可以看到图旁边的表格，这是我们的邻接矩阵。这里 `Matrix[i][j] = 1` 表示 `i` 和 `j` 之间存在边。如果没有边，我们简单地设置\
  \ `Matrix[i][j] = 0`。\n\n这些边可以是权重的，例如代表两个城市之间的距离。这时我们会在 `Matrix[i][j]` 中放入该值而不是\
  \ 1。\n\n上述描述的图是双向或无向的，这意味着如果我们能从节点 2 到节点 1，也可以从节点 1 到节点 2。如果图是有向的，那么在图的一侧会有箭头符号。即使如此，我们仍然可以使用邻接矩阵来表示它。\n\
  \n![](img/src2F3.jpg)\n\n我们用无穷表示不共享边的节点。需要注意的一点是，如果图是无向的，矩阵是对称的。\n\n创建矩阵的伪代码：\n\n\
  ```\nProcedure AdjacencyMatrix ( N): //N 代表节点数\n```\n\n也可以通过这种方式填充 `Matrix`：\n\n\
  ```\nProcedure AdjacencyMatrix ( N): //N 代表节点数\n```\n\n\n\n使用邻接矩阵的缺点：\n- 无论有多少条边，总是需要\
  \ `N * N` 的空间。如果图是稀疏的，这会浪费内存。\n\n\n\n\n## 第 9.2 节：图论引论\n\n图论是“图”的研究，图是用于模拟对象之间成对关系的数学结构。你知道吗，地球上几乎所有的问题都可以转换为“道路与城市”问题并解决？图论发明于许多年前，甚至在计算机发明之前。莱昂哈德·欧拉（Leonhard\
  \ Euler）写了一篇关于康尼斯斯堡七桥的论文，这被认为是图论的第一篇论文。从那时起，人们意识到，如果我们能将任何问题转换为这种城市-道路问题，就可以通过图论轻松地解决它。\n\
  \n图论有许多应用。最常见的应用之一是寻找一个城市到另一个城市之间的最短距离。我们都知道，为了访问你的电脑，这个网页必须从服务器经过许多路由器。图论帮助它找到需要跨越的路由器。在战争期间，需要轰炸哪条街道可以将首都与其他地方隔离开，这也可以使用图论找到。让我们先学习图论的一些基本定义。\n\
  \n## 图 (Graph)\n假设我们有 6 个城市。我们将它们标记为 1, 2, 3, 4, 5, 6。现在我们连接彼此之间有道路的城市。\n\n![](img/rsrc2F4.jpg)\n\
  \n这是一个简单图，图中用连接它们的道路显示了某些城市。在图论中，我们将这些城市称为 `Node`（节点）或 `Vertex`（顶点），并将道路称为 `Edge`（边）。图仅仅是这些节点和边的连接。一个节点可以代表很多东西。在某些图中，节点代表城市，某些代表机场，某些代表棋盘上的方格。边代表每个节点之间的关系。这种关系可以是从一个机场到另一个机场的时间，可以是马从一个方格到所有其他方格的移动等。\n\
  \n![](img/rsrc2F5.jpg) 棋盘上马的路径\n\n简单来说，`Node` 代表任何对象，`Edge` 代表两个对象之间的关系。\n\n## 邻节点\
  \ (Adjacent Node)\n如果节点 `A` 与节点 `B` 共享一条边，那么 `B` 被认为是 `A` 的相邻节点。换句话说，如果两个节点直接连接，它们被称为相邻节点。一个节点可以有多个相邻节点。\n\
  \n## 有向图与无向图 (Directed and Undirected Graph)\n在有向图中，边的一侧有方向符号，这意味着边是 `Unidirectional`（单向的）。相反，无向图的边两侧都有方向符号，这意味着它们是\
  \ `Bidirectional`（双向的）。通常无向图在边的两侧都没有符号。\n\n让我们假设正在举行一个派对。派对的人由节点表示，如果两个人握手，则他们之间就有一条边。那么这个图就是无向的，因为任何人\
  \ `A` 与 `B` 握手当且仅当 `B` 也与 `A` 握手。相反，如果从一个人 `A` 到另一个人 `B` 的边对应于 `A` 崇拜 `B`，那么这个图是有向的，因为崇拜并不一定相互。第一种图称为无向图，边称为无向边；而后一种图称为有向图，边称为有向边。\n\
  \n## 加权图与无权图 (Weighted and Unweighted Graph)\n加权图是每条边都分配了一个数字（权重）的图。这些权重可以根据所处理的问题代表成本、长度或容量等。\n\
  \n![](img/rsrc2F6.jpg) 无权图正好相反。我们假设所有边的权重都是相同的（假设为 1）。\n\n## 路径 (Path)\n路径代表从一个节点到另一个节点的方法。它由一系列边组成。可以有多条。\n\
  \n![](img/rsrc2F7.jpg)\n\n在上面的示例中，从 `A` 到 `D` 有两条路径。`A->B`、`B->C`、`C->D` 是一条路径。这条路径的成本是\
  \ `3 + 4 + 2 = 9`。同样，还有另一路径 `A->D`。这条路径的成本是 `10`。成本最低的路径被称为 `shortest path`（最短路径）。\n\
  \n## 度 (Degree)\n顶点的度连接到它的边的数量。如果有边两端连接到同一个顶点（自环），则计算两次。\n\n在有向图中，节点有两种类型的度：\n-\
  \ **入度 (In-degree)**：指向节点的边数。\n- **出度 (Out-degree)**：从该节点指向其他节点的边数。\n\n对于无向图，它们简单称为度。\n\
  \n![](img/rsrc2F8.jpg) 一些与图相关的算法\n- Bellman–Ford 算法\n- Dijkstra 算法\n- Ford–Fulkerson\
  \ 算法\n- Kruskal 算法\n- 最近邻算法\n- Prim 算法\n- 深度优先搜索\n- 广度优先搜索\n\n# 第 9.3 节：存储图（邻接列表）\n\
  邻接列表是无序列表的集合，用于表示有限图。每个列表描述图中顶点的邻居集合。存储图时所需的内存较少。\n\n让我们看一个图及其其邻接矩阵：\n\n![](img/rsrc2F9.jpg)\n\
  \n现在我们使用这些值创建一个列表。![](img/rsrc2FA.jpg)\n\n这被称为邻接列表。它显示了哪些节点连接到哪些节点。我们可以使用二维数组来存储这些信息。但这将消耗与邻接矩阵相同的内存。相反，我们将要使用动态分配的内存来存储这个。许多语言支持\
  \ `Vector` 来存储这个。\n\n```python\nProcedure AdjacencyList(maxN, E):\n    edge[maxN]\
  \ = Vector()\n    for i from 1 to E:\n        # x, y\n        edge[x].push(y)\n\
  \        edge[y].push(x)\n```\n由于是无向图，所以 `x` 到 `y` 有边，`y` 到 `x` 也有边。如果是有向图，我们会省略第二个。对于加权图，我们还需要存储成本。我们将创建另一个名为\
  \ `cost` 的向量来存储这些。\n\n```python\nProcedure AdjacencyList(maxN, E):\n    edge[maxN]\
  \ = Vector()\n    cost[maxN] = Vector()\n    for i from 1 to E:\n        # x, y,\
  \ w\n        edge[x].push(y)\n        cost[x].push(w)\n    return edge, cost\n```\n\
  通过这个，我们可以轻松找到连接到任何节点的总数以及这些节点是什么。它比邻接矩阵节省时间。但如果我们需要判断 `u` 和 `v` 之间是否存在边，使用邻接矩阵会更容易。\n\
  \n# 第 9.4 节：拓扑排序 (Topological Sort)\n拓扑排序（topological ordering）是将有向无环图中的顶点在直线上（即列表中）进行排序，使得所有有向边都从左向右。如果图中包含有向环，则这种排序不存在，因为你无法一直向右走并仍然回到起点。\n\
  \n形式化地说，在图 `G = (V, E)` 中，所有顶点的线性排序定义为：如果 `G` 包含从顶点 `u` 到顶点 `v` 的边 `(u, v) ∈ E`，则\
  \ `u` 在排序中位于 `v`。\n\n重要的是，每个 DAG 至少有一个拓扑排序。\n\n已知可以在线性时间内构建任何 DAG 的拓扑排序，一个例子是：\n\
  1. 调用 `depth_first_search(G)` 计算每个顶点的完成时间 `v.f`。\n2. 当每个顶点完成时，将其插入链列表的头部。\n3. 返回顶点列表，它现在已经排好序了。\n\
  \n\n\n\n\n许多应用程序使用有向无环图（DAG）来表示事件之间的优先关系。我们使用拓扑排序来确保在处理任何后继顶点之前，获得处理每个顶点的顺序。图中的顶点可以表示要执行的任务，边可以表示一个任务必须在另一个任务之前执行的约束；拓扑排序是执行\
  \ `V` 中描述的任务集合的有效序列。\n\n### 问题实例及其解决方案\n假设一个顶点 `v` 描述一个 `Task( hours_to_complete:\
  \ int )`，即 `Task( 4 )` 描述一个需要 4 小时完成的任务；边 `e` 描述一个 `Cooldown( hours: int )`，使得 `Cooldown(\
  \ 3 )` 描述完成任务后的冷却时长。\n\n让我们将图命名为 `dag`（因为它是有向无环图），并使其包含 5 个顶点：\n`A < dag.add_vertex\
  \ ( Task( 4 ) ));`\n`B < dag.add_vertex ( Task( 5 ) ));`\n`C < dag.add_vertex (\
  \ Task( 3 ) ));`\n`D < dag.add_vertex ( Task( 2 ) ));`\n`E < dag.add_vertex ( Task(\
  \ 7 ) ));`\n\n其中我们用有向边连接顶点，使得图是无环的：\n```cpp\n// A ---> C ----+\n// | | |\n// v v\
  \ v\n// B ---> D --> E\n```\n`dag.add_edge ( A, B, Cooldown( 2 ) ));`\n`dag.add_edge\
  \ ( A, C, Cooldown( 2 ) ));`\n`dag.add_edge ( B, D, Cooldown( 1 ) ));`\n`dag.add_edge\
  \ ( C, D, Cooldown( 1 ) ));`\n`dag.add_edge ( C, E, Cooldown( 1 ) ));`\n`dag.add_edge\
  \ ( D, E, Cooldown( 3 ) ));`\n\n那么在 A 和 E 之间有三种可能的拓扑排序：\n1. `A -> B -> D -> E`\n\
  2. `A -> C -> D -> E`\n3. `A -> C -> E`\n\n### 第 9.5 节：使用深度优先遍历检测有向图中的环\n如果在 DFS\
  \ 过程中发现了回边，则有向图中存在环。回边是从节点指向自身或指向 DFS 树中任一祖先的边。对于不连通的图，我们得到 DFS 森林，因此你必须遍历图中的所有顶点以找到不相交的\
  \ DFS 树。\n\nC++ 实现：\n\n```cpp\n#include <iostream> \n#include <list>\n\nusing namespace\
  \ std;\n\n#define NUM_V 4\nbool helper(list< int > *graph, int u, bool * visited,\
  \ bool * recStack) {\n    visited[u]= true ;\n    recStack[u]= true ;\n    list<\
  \ int > :: iterator i;\n    for (i = graph[u].begin (); i!= graph[u].end (); ++i)\
  \ {\n        if (recStack[*i]) //如果在此 DFS 遍历的递归栈中发现顶点 v，则返回 true ;\n        else\
  \ if (*i== u) //如果存在指向顶点自身的边\n            return true ;\n        else if (!visited[*i])\n\
  \        { \n            if (helper(graph, *i, visited, recStack))\n           \
  \     return true ;\n        }\n    }\n    recStack[u]= false ;\n    return false\
  \ ;\n}\n\n/*\n/封装函数对每个未访问过的顶点调用辅助函数。 \n如果辅助函数在子图（树）中检测到回边，则返回 true，否则返回 false。\n\
  */\nbool isCyclic(list< int > *graph, int V) {\n    bool visited[V]; //用于跟踪已访问顶点的数组\n\
  \    bool recStack[V]; //用于跟踪遍历递归栈中顶点的数组\n    for (int i = 0; i< V; i++)\n     \
  \   visited[i]= false , recStack[i]= false ; //初始化所有顶点为未访问且未递归\n    for (int u =\
  \ 0; u < V; u++) // 迭代检查每个顶点是否已访问 \n        if (visited[u]== false )\n        {\
  \ \n            if (helper(graph, u, visited, recStack)) //检查从该顶点出发的 DFS 树是否包含环\n\
  \                return true ;\n        }\n    }\n    return false ; \n}\n\n/*\n\
  驱动函数 */\nint main() {\n    list < int > * graph = new list< int > [NUM_V]; \n  \
  \  graph[0].push_back (1);\n    graph[0].push_back (2);\n    graph[1].push_back\
  \ (2);\n    graph[2].push_back (0);\n    graph[2].push_back (3);\n    graph[3].push_back\
  \ (3);\n    bool res = isCyclic(graph, NUM_V); \n    cout << res<< endl;\n}\n```\n\
  结果：如下所示，图中三条回边。一条在顶点 0 和 2 之间；一条在顶点 0、1 和 2 之间；还有一条在顶点 3。搜索的时间复杂度为 `O(V+E)`，其中 `V`\
  \ 是顶点数，`E` 是边数。\n\n## 第 9.6 节：Thorup 算法\n用于无向图单源最短路径的 Thorup 算法时间复杂度为 `O(m)`。\n\n\
  \n\n\n## 第 11 章：Dijkstra 算法\n\n## 第 11.1 节：Dijkstra 最短路径算法\n\n在继续之前，建议对邻接矩阵（Adjacency\
  \ Matrix）和广度优先搜索（BFS）简单了解。\n\nDijkstra 算法被称为单源最短路径算法。它用于寻找图中节点之间的最短路径，这些节点可能代表道路网络。它由\
  \ Edsger W. Dijkstra 于 1956 年提出，并于三年后发表。\n\n我们可以使用广度优先搜索（BFS）搜索算法来寻找最短路径。该算法运行良好，但问题在于，它假设遍历每条路径的代价都是相同的，这意味着每条边的代价都是相同的。Dijkstra\
  \ 算法帮助我们现在每条路径代价不相同的情况下找到最短路径。\n\n首先，我们将看到如何修改 BFS 来编写 Dijkstra 算法，然后我们将添加优先级队列使其成为一个完整的\
  \ Dijkstra 算法。\n\n假设每个节点到源点的距离存储在 `d[]` 数组中。例如，`d[3]` 表示从源点到达节点 3 需要花费 `d[3]` 时间。如果不知道距离，我们会在\
  \ `d[3]` 中存储无穷大（infinity）。此外，让 `cost[u][v]` 代表 `u-v` 的代价。这意味着从节点 `u` 去到节点 `v` 需要\
  \ `cost[u][v]`。\n\n![](img/rsrc2FC.jpg)\n\n我们需要理解边松弛（Edge Relaxation）。假设从你家（即源点）去\
  \ A 地需要 10 分钟。去 B 地需要 25 分钟。我们有：\n\n```\nd[ A] = 10\nd[ B] = 25\n```\n\n现在假设从 A\
  \ 地到 B 地需要 7 分钟，这意味着：\n\n```\ncost[ A][ B] = 7\n```\n\n那么我们可以通过先从源点去 A 地再从 A 地去到\
  \ B 地来从源点到达 B 地，这将花费 10 + 7 = 17 分钟，而不是 25 分钟。所以：\n\n```\nd[ A] + cost[ A][ B] <\
  \ d[ B]\n```\n\n然后我们更新：\n\n```\nd[ B] = d[ A] + cost[ A][ B]\n```\n\n这被称为松弛。我们将从节点\
  \ `u` 移动节点 `v`，如果 `d[u] + cost[u][v] < d[v]`，则我们更新 `d[v] = d[u] + cost[u][v]`。\n\
  \n在 BFS 中，我们不需要重复访问任何节点。我们只检查节点是否被访问过。如果没有被访问，我们将节点推入队列，将其标记为已访问并将距离加 1。在 Dijkstra\
  \ 中，我们可以将节点推入队列，而不是用已访问来更新它，而是松弛或更新新边。让我们来看例子：![](img/rsrc2FD.jpg) 假设节点 1 是源点。那么：\n\
  \n```\nd[ 1 ] = 0\nd[ 2 ] = d[ 3 ] = d[ 4 ] = infinity (或一个大值)\n```\n\n我们将 `d[2]`、`d[3]`\
  \ 和 `d[4]` 设置为无穷大，因为我们还不知道距离。源点的距离当然是 0。现在，我们从源点去其他节点，如果可以更新它们，就把它们推入队列。例如，我们将遍历边\
  \ 1-2。由于 `d[1] + 2 < d[2]`，将使得 `d[2] = 2`。同样，我们将遍历边 1-3，使得 `d[3] = 5`。\n\n我们可以清楚地看到，5\
  \ 不是我们到达节点 3 的最短距离。因此，像 BFS 那样只遍历一次节点在这里行不通的。如果我们使用边 2-3 从节点 2 到节点 3，可以更新 `d[3]\
  \ = d[2] + 1 = 3`。所以我们可以看到一个节点可以被更新多次。你问多少次？节点被更新的最大次数是该节点的入度。\n\n让我们看看多次访问任何节点的伪代码。我们将简单地修改\
  \ BFS：\n\n```\nprocedure BFSmodified ( G, source):\n    Q = queue()\n    distance[]\
  \ = infinity\n    Q.enqueue ( source)\n    distance[ source]= 0\n    while Q is\
  \ not empty\n        u < Q.pop ()\n        for all edges from u to v in G.adjacentEdges\
  \ ( v) do\n            if distance[ u] + cost[ u][ v] < distance[ v]\n         \
  \       distance[ v] = distance[ u] + cost[ u][ v]\n            end if\n       \
  \ end for\n    end while\n    Return distance\n```\n\n这可以用于寻找源点到所有节点的最短路径。这段代码的复杂度不是很好。原因如下：\n\
  \n在 BFS 中，当我们从节点 1 去往所有其他节点时，我们遵循先来后到的方法。例如，我们在处理节点 2 之前先从源点去了节点 3。如果我们从源点去节点 3，我们更新节点\
  \ 4 为 5 + 3 = 8。当我们再次从节点 2 更新节点 3 时，我们需要再次更新节点 4 为 3 + 3 = 6！所以节点 4 被更新了两次。\n\n\
  Dijkstra 建议，与其采用先来后到的方法，如果我们先更新最近节点，更新会更少。以下是使用邻接矩阵求解 Dijkstra 的 Java 示例。\n\n```java\n\
  import java.util.*;\nimport java.lang.*;\nimport java.io.*;\n\nclass ShortestPath\
  \ {\n    static final int V=9;\n\n    int minDistance(int dist[], Boolean sptSet[])\
  \ {\n        int min = Integer.MAX_VALUE, min_index;\n        for (int v = 0; v\
  \ < V; v++)\n            if (sptSet[v] == false && dist[v] <= min) {\n         \
  \       min = dist[v];\n                min_index = v;\n            }\n        return\
  \ min_index;\n    }\n\n    void printSolution(int dist[], int n) {\n        System.out.println(\"\
  Vertex Distance from Source\");\n        for (int i = 0; i < n; i++)\n         \
  \   System.out.println(i+ \\t\\t \" + dist[i]);\n    }\n\n    void dijkstra(int\
  \ graph[][], int src) {\n        Boolean sptSet[] = new Boolean [V];\n        for\
  \ (int i = 0; i < V; i++) {\n            dist[i] = Integer.MAX_VALUE;\n        \
  \    sptSet[i] = false;\n        }\n        dist[src] = 0;\n        for (int count\
  \ = 0; count < V-1 ; count++) {\n            int u = minDistance(dist, sptSet);\n\
  \            sptSet[u] = true;\n            for (int v = 0; v < V; v++)\n      \
  \          if (!sptSet[v] && graph[u][ v]!= 0 && dist[u] != Integer.MAX_VALUE &&\
  \ dist[u]+ graph[u][ v] < dist[v])\n                    dist[v] = dist[u] + graph[u][\
  \ v];\n        }\n        printSolution(dist, V);\n    }\n\n    public static void\
  \ main (String [] args) {\n        int graph[][] = new int [][]{\n            {\
  \ 0, 4, 0, 0, 0, 0, 0, 8, 0 },\n            { 4, 0, 8, 0, 0, 0, 0, 11, 0 },\n  \
  \          { 0, 8, 0, 7, 0, 4, 0, 0, 2 },\n            { 0, 0, 7, 0, 9, 14, 0, 0,\
  \ 0 },\n            { 0, 0, 0, 9, 0, 10, 0, 0, 0 },\n            { 0, 0, 4, 14,\
  \ 10, 0, 2, 0, 0 },\n            { 0, 0, 0, 0, 0, 2, 0, 1, 6 },\n            { 8,\
  \ 11, 0, 0, 0, 0, 1, 0, 7 },\n            { 0, 0, 2, 0, 0, 0, 6, 7, 0 }\n      \
  \  };\n        ShortestPath t = new ShortestPath();\n        t.dijkstra(graph, 0);\n\
  \    }\n    int[] dist; // 根据上下文添加了缺失的声明\n}\n```\n\n\n\n# 第 12 章：A* 路径规划\n\n## 第\
  \ 12.1 节：A* 简介\n\nA*（星号）是一种用于寻找从一个节点到另一个节点路径的搜索算法。它可以与广度优先搜索（Breadth First Search）、`Dijkstra\
  \ 算法`、深度优先搜索（Depth First Search）或最佳优先搜索（Best First Search）相比较。A* 算法在图搜索中被广泛应用，因为它在无法进行图预处理的情况下具有更高的效率和准确性。A*\
  \ 是 `Best First Search` 的特化版本，其中评估函数 `f` 以特定的方式定义。\n\n`f(n) = g(n) + h(n)` 是从初始节点通过节点\
  \ `n` 到达目标的最小代价。\n\n`g(n)` 是从初始节点到 `n` 的最小代价。\n\n`h(n)` 是从 `n` 到其最近终点的最小代价。\n\n\
  A* 是一种启发式搜索算法，它始终保证在最短时间内找到最短路径（代价最小的路径）（如果使用可采启发式函数的话）。因此，它是完备且最优的。下面的动画演示了 A*\
  \ 搜索![](img/rsrc2FE.jpg)\n\n## 第 12.2 节：通过无障碍迷宫进行 A* 路径规划\n\n假设我们有如下 4x4 的网格：![](img/rsrc2FF.jpg)\n\
  \n假设这是一个迷宫。不过这里没有墙壁/障碍。我们只有一个起点（绿色方块）和一个终点（红色方块）。同样假设为了从绿色移动到红色，我们不能对角线移动。那么，从绿色方块开始，看看我们可以移动到哪些格子，并将它们高亮为蓝色：![](img/rsrc2FG.jpg)\n\
  \n为了决定下一个移动到哪个格子，我们需要考虑 2 个启发式因子：\n\n1. `g` 值 - 该节点距离绿色方块的距离。\n2. `h` 值 - 该节点距离红色方块的距离。\n\
  3. `f` 值 - `g` 值和 `h` 值的和。这是告诉我们应该移动到哪个节点的最终数字。\n\n为了计算这些启发式因子，我们使用的公式是：`distance\
  \ = abs( from.x to.x ) + abs( from.y to.y )`\n\n这被称为“曼哈顿距离”（Manhattan Distance）公式。\n\
  \n让我们计算紧邻绿色方块左侧蓝色格子的 `g` 值：`abs( 3 2 ) + abs( 2 2 ) = 1`\n\n太棒了！我们得到了值：`1`。现在，尝试计算\
  \ `h` 值：`abs( 2 0 ) + abs( 2 0 ) = 4`\n\n完美。现在，获取 `f` 值：`1 + 4 = 5`\n\n所以，这个节点的最终值是“5”。\n\
  \n对所有其他蓝色格子执行相同的操作。每个格子中心的大数字是 `f` 值，左上角的数字是 `g` 值，右上角的数字是 `h` 值：\n\n![](img/rsrc2FH.jpg)\
  \ 我们已经计算了所有蓝色节点的 `g`、`h` 和 `f` 值。现在，我们选哪一个呢？\n\n选择 `f` 值最低的那个。\n\n然而，在这种情况下，我们有两个节点的\
  \ `f` 值相同，都是 `5`。我们该如何在它们之间选择呢？\n\n简单来说，随机选择其中一个，或者设置一个优先级。我通常倾向于设置这样的优先级：“右 > 上\
  \ > 下 > 左”\n\n`f` 值为 `5` 的节点之一带我们向“下”移动，另一个带我们向“左”。由于“向下”的优先级高于“向左”，我们选择带我们“向下”的格子。\n\
  \n现在我们将计算了启发式因子但未移动的节点标记为橙色，并将选择的节点标记为青色：\n\n![](img/rsrc2FJ.jpg) 好，现在为青色节点周围的节点计算相同的启发式因子：\n\
  \n![](img/rsrc2FK.jpg) 再次，我们选择从青色节点向下移动，因为所有选项的 `f` 值都相同：![](img/rsrc2FM.jpg) 为青色节点唯一的邻居计算启发式因子：\n\
  \n![](img/rsrc2FN.jpg) 好，由于我们将遵循一直以来采用的模式：![](img/rsrc2FP.jpg) 再次，让我们计算该节点邻居的启发式因子：\n\
  \n![](img/rsrc2FR.jpg) 让我们移动到那里：\n\n![](img/rsrc2FS.jpg) 最后，我们可以看到我们旁边有一个胜利格，所以我们移动到那里，任务完成。\n\
  \n## 第 12.3 节：使用 A* 算法解决 8 数字游戏问题\n\n问题定义：\n\n8 数字游戏是一个由 3x3 网格（包含 9 个格子）组成的简单游戏。其中一个格子是空的。目标是将周围的数字移动到不同的位置，并使显示的数字符合“目标状态”。\n\
