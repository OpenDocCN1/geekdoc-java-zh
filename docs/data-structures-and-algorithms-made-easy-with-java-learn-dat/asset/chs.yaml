  \ `n` 的输入列表一分为两半，直到变成大小为 1 的列表。然后，每一步都将列表对较小的元素合并在一起。通过连续的合并和元素比较，构建出有序列表。\n示例：![](img/rsrc2GV.jpg)\n\
  时间复杂度：`T(n) = 2T(n/2) + Θ(n)`。上述递归式可以使用递归树或主定理求解。它属于主方法的第二种情况，递归解为 `Θ(nlogn)`。归并排序在所有情况下（最坏、平均和最佳）的时间复杂度均为\
  \ `Θ(nlogn)`，因为归并排序总是将数组一分为二，并花费线性时间合并部分。\n辅助空间：`O(n)`\n算法范式：分治\n原地排序：否\n\n## 第\
  \ 30.2 节：Go 语言归并排序\n```go\npackage main\nimport \"fmt\"\nfunc mergeSort(a []int\
  \ ) []int {\n  if len(a) < 2 {\n    return a\n  }\n  m := (len(a)) / 2\n  f := mergeSort(a[:\
  \ m])\n  s := mergeSort(a[m:])\n  return merge(f, s)\n}\nfunc merge ( f []int ,\
  \ s []int ) []int {\n  var i, j int\n  size := len(f) + len(s)\n  a := make([]int\
  \ , size, size)\n  for z := 0 ; z < size; z++ {\n    lenF := len(f)\n    lenS :=\
  \ len(s)\n    if i > lenF-1 && j <= lenS-1 {\n      a[z] = s[j]\n      j++\n   \
  \ } else if j > lenS-1 && i <= lenF-1 {\n      a[z] = f[i]\n      i++\n    } else\
  \ if f[i] < s[j] {\n      a[z] = f[i]\n      i++\n    } else {\n      a[z] = s[j]\n\
  \      j++\n    }\n  }\n  return a\n}\nfunc main () {\n  a := []int { 75 , 12 ,\
