  \ = 0 1 2 3 4 5 7 8\n\nMin cost edge: ( 5 ,6 ) cost = 8\n\nReachSet = 0 1 2 3 4\
  \ 5 6 7 8\n\n0 --> 0\n\n0 --> 1\n\n7 --> 2\n\n0 --> 3\n\n3 --> 4\n\n2 --> 5\n\n\
  5 --> 6\n\n1 --> 7 0 --> 8\n```\n\n## 第 20 章：Bellman–Ford 算法\n\n## 第 20.1 节：单源最短路径算法（假设图中存在负环）\n\
  \n在阅读此示例之前，需要对边松弛（edge-relaxation）有一个大致的了解。你可以从这里学习\n\n`Bellman-Ford Algorithm`\
  \ 用于计算加权有向图中从单源顶点到所有其他顶点的最短路径。尽管它的运行速度比 `Dijkstra's Algorithm` 慢，但它可以在边权重为负数的情况下工作，并且还能找到图中负权环。`Dijkstra's\
  \ Algorithm` 的问题在于如果存在负环，你会不断地通过该循环并持续减小两个顶点之间的距离。\n\n该算法的思想是以某种随机顺序逐一遍历图中的所有边。可以是任何随机顺序。但你必须确保，如果\
  \ `u-v`（其中 `u` 和 `v` 是图中的两个顶点）是你的顺序之一，那么必须存在从 `u` 到 `v` 的边。通常直接取于给定的顺序。再次，任何随机顺序都是有效的。\n\
  \n选择顺序后，我们将根据松弛公式对边进行松弛。对于从 `u` 到 `v` 的给定边 `u-v`，松弛公式为：\n\n```\nif distance[ u]\
  \ + cost[ u][ v] < d[ v] d[ v] = d[ u] + cost[ u][ v]\n```\n\n也就是说，如果从源到任何顶点 `u`\
  \ 的距离 + 边 `u-v` 的权重小于源到另一个顶点 `v` 的距离，我们就更新从源到 `v` 的距离。我们需要最多松弛边 `(V-1)` 次，其中 `V`\
  \ 是图中边的数量。你问为什么是 `(V-1)`？我们将在另一个示例中解释。此外，我们还将跟踪任何顶点的父顶点，即当我们松弛一条边时，我们将设置：\n`parent[\
  \ v] = u`\n\n这意味着我们找到了另一个通过 `u` 到达 `v` 的更短路径。我们稍后需要此来打印从源到目标顶点的最短路径。\n\n让我们来看一个示例。我们有一个图：\n\
  ![](img/rsrc2G8.jpg)\n\n我们选择了 `1` 作为源顶点。我们想要找到从源到所有其他顶点的最短路径。首先，`d[1] = 0`，因为它是源。其余的都是无穷大，因为我们还不知道它们的距离。\n\
  \n我们将按照这个顺序松弛边：\n\n```\n+--------+--------+--------+--------+--------+--------+--------+\n\
  | 序号 | 1 | 2 | 3 | 4 | 5 | 6 |\n+--------+--------+--------+--------+--------+--------+--------+\n\
  | 边 | 4->5 | 3->4 | 1->3 | 1->4 | 4->6 | 2->3 |\n+--------+--------+--------+--------+--------+--------+--------+\n\
  ```\n\n你可以采取任何想要的序列。如果我们松弛一次边，我们会得到什么？我们得到使用最多 1 条边的从源到所有其他顶点的距离。现在让我们松弛边并更新 `d[]`\
  \ 的值。我们得到：\n\n1. `d[4] + cost[4][5] = infinity + 7 = infinity` 。我们无法更新这一个。\n2. `d[2]\
  \ + cost[3][4] = infinity` 。我们无法更新这一个。\n3. `d[1] + cost[1][3] = 0 + 2 = 2 < d[2]`\
  \ 。所以 `d[3] = 2` 。同时 `parent[1] = 1` 。\n4. `d[1] + cost[1][4] = 4` 。所以 `d[4] = 4\
  \ < d[4]`（注：此处原文逻辑可能有误，应为小于 d[4]）。`parent[4] = 1` 。\n5. `d[4] + cost[4][6] = 9`\
  \ 。 `d[6] = 9 < d[6]`（同上）。`parent[6] = 4` 。\n6. `d[2] + cost[2][3] = infinity` 。我们无法更新这一个。\n\
  \n我们无法更新某些顶点，因为 `d[u] + cost[u][v] < d[v]` 条件不成立。\n\n[/content]\n\n## 第 20.2 节：在图中检测负环\n\
  \n为了理解这个示例，建议对 Bellman-Ford 算法有一个大致的了解，可以在这里找到\n\n使用 Bellman-Ford 算法，我们可以检测图中是否存在负环。我们知道，为了找到最短路径，我们需要松弛图中所有的边\
  \ `(V-1)` 次，其中 `V` 是图中顶点的数量。我们已经在这个示例中看到，在 `(V-1)` 次迭代之后，无论进行多少次迭代，都无法更新 `d[]`。真的吗？\n\
  \n如果图中存在负环，即使在 `(V-1)` 次迭代之后，我们也可以更新 `d[]`。这是对于每次迭代，遍历负环总是会降低路径的成本。\n\n让我们假设我们有一个图：\n\
  \n![](img/rsrc2GC.jpg)\n\n让我们选择顶点 1 作为源。将 Bellman-Ford 单源最短路径算法应用于该图后，我们将找到从源到所有其他顶点的距离。\n\
  \n\n\n\n\n![](img/rsrc2GD.jpg)这是经过 `(V-1) = 3` 次迭代后的图表样子。这应该是正确的结果，因为有 4 条边，我们最多需要\
  \ 3 次迭代来找到最短路径。因此，要么这就是答案，要么图中存在负权环。为了找到它，在 `(V-1)` 次迭代后，我们再进行最后一次额外的迭代，如果距离继续减小，说明图中一定存在负权环。\n\
  \n对于这个例子：如果我们检查 `2-3`，`d[2] + cost[2][3]` 将得到 1，它小于 `d[3]`。因此我们可以得出图中存在负环。那么，我们如何找到这个负环呢？我们对\
  \ Bellman-Ford 过程进行细小的修改：\n\n```\nProcedure NegativeCycleDetector ( Graph, source):\n\
  \  n := number of vertices in Graph\n  for i from 1 to n\n    d[i] := infinity\n\
  \  end for\n\n  d[source] := 0\n\n  for i from 1 to n- 1\n    flag := false\n  \
  \  for all edges from (u,v) in Graph\n      if d[u] + cost[u][v] < d[v]\n      \
  \  d[v] := d[u] + cost[u][v]\n        flag := true\n      end if\n    if flag ==\
  \ false break\n  end for\n\n  for all edges from (u,v) in Graph\n    if d[u] + cost[u][v]\
  \ < d[v]\n      Return \"Negative Cycle Detected\"\n    end if\n  end for\n\n  Return\
  \ \"No Negative Cycle\"\n```\n\n这就是我们如何找到图中是否存在负环的方法。我们也可以修改 Bellman-Ford 算法来跟踪负环。\n\
  \n# 章节 20.3: 为什么我们最多对所有边进行松弛 (V-1) 次\n\n为了理解这个例子，建议先对 Bellman-Ford 单源最短路径算法有一个大致的了解，可以在此处找到它。\n\
  \n在 Bellman-Ford 算法中，为了找到最短路径，我们需要松弛图中所有的边。这个过程最多重复 `(V-1)` 次，其中 `V` 是图中顶点的数量。\n\
  \n从 `source` 到所有其他顶点的最短路径所需的迭代次数取决于我们选择松弛边的顺序。\n\n让我们来看一个例子：\n\n![](img/rsrc2GE.jpg)在这里，源顶点是\
  \ 1。我们将找到源和所有其他顶点之间的最短距离。我们可以清楚地看到，到达顶点 4 在最坏情况下需要 `(V-1)` 条边。现在根据边被发现的顺序，可能需要 `(V-1)`\
  \ 次才能发现顶点 4。还没明白？让我们使用 Bellman-Ford 算法在这里找到最短路径：我们将使用下面这个序列：\n\n```\n+--------+--------+--------+--------+\n\
  | Serial | 1 | 2 | 3 |\n+--------+--------+--------+--------+\n| Edge | 3->4 | 2->3\
  \ | 1->2 |\n+--------+--------+--------+--------+\n```\n\n对于我们的第一次迭代：\n1. `d[3]\
  \ + cost[3][4]` = infinity。它不会改变任何东西。\n2. `d[2] + cost[2][3]` = infinity。它不会改变任何东西。\n\
  3. `d[1] + cost[1][2] = 2 < d[2]`。`d[2] = 2`。`parent[2] = 1`。\n\n我们可以看到我们的松弛过程只改变了\
  \ `d[2]`。我们的图看起来像这样：\n\n![](img/rsrc2GF.jpg) 第二迭代：\n1. `d[3] + cost[3][4]` = infinity。它不会改变任何东西。\n\
  2. `d[2] + cost[2][3] = 5 < d[3]`。`d[3] = 5`。`parent[3] = 2`。\n3. 不会改变。\n\n这一次松弛过程改变了\
  \ `d[3]`。我们的图看起来像这样：\n\n![](img/rsrc2GG.jpg) 第三次迭代：\n1. `d[3] + cost[3][4] = 7 <\
  \ d[4]`。`d[4] = 7`。`parent[4] = 3`。\n2. 不会改变。\n3. 不会改变。\n\n我们的第三次迭代终于找到了从 1 到 4\
  \ 的最短路径。我们的图看起来像这样：\n\n![](img/rsrc2GH.jpg) 所以，花费了 3 次迭代才找到最短路径。在此之后，无论松弛边多少次，`d[]`\
  \ 中的值都将保持不变。现在，如果我们考虑另一个序列：\n\n```\n+--------+--------+--------+--------+\n| Serial\
  \ | 1 | 2 | 3 |\n+--------+--------+--------+--------+\n| Edge | 1->2 | 2->3 | 3->4\
  \ |\n+--------+--------+--------+--------+\n```\n\n我们将得到：\n1. `d[1] + cost[1][2]\
  \ = 2 < d[2]`。`d[2] = 2`。\n2. `d[2] + cost[2][3] = 5 < d[3]`。`d[3] = 5`。\n3. `d[3]\
  \ + cost[3][4] = 7 < d[4]`。`d[4] = 5`。\n\n我们的极第一次迭代就找到了从源到所有其他节点的最短路径。另一个序列 `1->2`,\
  \ `3->4`, `2->3` 也是可能的，它将在 2 次迭代后给我们最短路径。我们可以得出结论，无论我们如何安排序列，在这个例子中找到从源的最短路径都不会超过\
  \ 3 次迭代。我们可以得出结论，对于最好情况，只需要 1 次迭代就能找到最短路径。对于最坏情况，需要 `(V-1)` 次迭代，这就是为什么我们要重复松弛过程\
  \ `(V-1)` 次。\n\n# 章节 21: 线段算法\n\n画线是通过计算两个指定位置之间直线的中间位置完成的。然后引导输出设备填充这些端点之间的位置。\n\
  \n## 章节 21.1: Bresenham 线段算法\n\nBresenham 线段算法是一种高效且准确的栅格生成算法，由 Bresenham 开发。它涉及整数计算，因此速度很快。也可以扩展到圆。\n\
  \nBresenham 线段算法：\n斜率 `m|<1`：`x` 的值增加，`y` 的值根据判定参数增加。\n斜率 `m|>1`：`y` 的值增加，`x` 的值根据判定参数增加。\n\
  \n对于 `m|<1` 的算法是：\n1. 输入两个端点 `(x1,y1)` 和 `(x2,y2)` 的线。\n2. 绘制第一个点 `(x1,y1)`。\n3.\
  \ 计算 `delx = |x2-x1|`, `dely = |y2-y1|`。\n4. 获取初始判定 `P = 2 * daly - delx`。\n5. 从\
  \ `0` 到 `delx` 迭代：\n   如果 `p < 0` 则 `y1 = y1 + 1`，`绘制(x1,y1)`，`p = p + 2 * delx`。\n\
  6. 结束。\n\n实现 `m|<1` 的 C 代码：\n```c\n#include <stdio.h>\n#include <conio.h>\n#include\
  \ <graphics.h>\n#include <math.h>\nint main() {\n  int gdriver= DETECT,gmode;\n\
  \  int x1,y1,x2,y2,delx,dely,p,i;\n  initgraph(&gdriver,&gmode,\"c: TC BGI\");\n\
  \  printf(\"Enter initial points: \");\n  scanf(\"%d\", &x1);\n  scanf(\"%d\", &y1);\n\
  \  printf(\"Enter end points: \");\n  scanf(\"%d\", &x2);\n  scanf(\"%d\", &y2);\n\
  \  putpixel(x1,y1,RED);\n  delx = fabs(x2-x1);\n  dely = fabs(y2-y1);\n  p = (2\
  \ * daly) - delx;\n  for (i= 0 ; i<delx; i++) {\n    if (p < 0) {\n      y1 = y1\
  \ + 1;\n      putpixel(x1,y1,RED);\n      p = p + (2 * daly);\n    }\n    // ...\
  \ (部分省略)\n```\n\n对于 `m|>1` 的算法是：\n1. 输入两个端点 `(x1,y1)` 和 `(x2,y2)` 的线。\n2. 绘制第一个点\
  \ `(x1,y1)`。\n3. 计算 `delx = |x2-x1|`, `dely = |y2-y1|`。\n4. 获取初始判定 `P = 2 * daly\
  \ - delx`。\n5. 从 `0` 到 `dely` 迭代：\n   如果 `p < 0` 则 `x1 = x1 + 1`，`绘制(x1,y1)`，`p\
  \ = p + 2 * delx`。\n6. 结束。\n\n实现 `m|>1` 的 C 代码：\n```c\n#include <stdio.h>\n#include\
  \ <conio.h>\n#include <graphics.h>\n#include <math.h>\nint main() {\n  int gdriver=\
  \ DETECT,gmode;\n  int x1,y1,x2,y2,delx,dely,p,i;\n  initgraph(&gdriver,&gmode,\"\
  c: TC BGI\");\n  printf(\"Enter initial points: \");\n  scanf(\"%d\", &x1);\n  scanf(\"\
  %d\", &y1);\n  printf(\"Enter end points: \");\n  scanf(\"%d\", &x2);\n  scanf(\"\
  %d\", &y2);\n  putpixel(x1,y1,RED);\n  delx = fabs(x2-x1);\n  dely = fabs(y2-y1);\n\
  \  p = (2 * daly) - delx;\n  for (i= 0 ; i<dely; i++) {\n    if (p < 0) {\n    \
  \  x1 = x1 + 1;\n      putpixel(x1,y1,RED);\n      p = p + (2 * delx);\n    }\n\
  \    // ... (部分省略)\n```\n\n\n\n\n\n## 第 22 章：Floyd-Warshall 算法\n\n## 22.1 节：所有对最短路径算法\n\
  \nFloyd-Warshall 算法用于在具有正负边权的权图中寻找最短路径。算法执行一次即可找到所有顶点对之间最短路径的长度（权重之和）。通过微小的改进，它可以输出最短路径并检测图中的负环。`FloydWarshall`\
  \ 是一种动态规划算法。\n\n让我们来看一个例子。我们将在此图上应用 `Floyd-Warshall`算法：\n\n![](img/rsrc2GJ.jpg)\n\
  \n我们做的第一件事是取两个二维矩阵。这些是邻接矩阵。矩阵的大小将是顶点的总数。对于我们的图，我们将取 `4 * 4` 矩阵。`Distance Matrix`\
  \ 距离矩阵存储目前为止两个顶点之间的最小距离。最初，对于边，如果 `u-v` 之间存在边且距离/权重为 `w`，我们将存储：`distance[ u][ v]\
  \ = w`。对于所有不存在的边，我们将放入 `infinity`（无穷大）。`Path Matrix` 路径矩阵用于重建两个顶点之间的最小距离路径。因此，最初，如果\
  \ `u` 和 `v` 之间存在路径，我们将放入 `path[ u][ v] = u`。这意味着从顶点 u 到顶点 v 的最佳方法是使用连接 `v` 和 `u`\
  \ 的边。如果两个顶点之间没有路径，我们将放入 `N`，表示目前没有可用路径。我们图的两个表如下：\n\n```text\n+-----+-----+-----+-----+-----+\
  \ +-----+-----+-----+-----+-----+\n| | 1 | 2 | 3 | 4 | | 1 | 2 | 3 | 4 |\n+-----+-----+-----+-----+-----+\
  \ +-----+-----+-----+-----+-----+\n| 1 | 0 | 3 | 6 | 15 | | 1 | N | 1 | 1 | 1 |\n\
  +-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n| 2 | inf | 0 |\
  \ -2 | inf | | 2 | N | N | 2 | N |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n\
  | 3 | inf | inf | 0 | 2 | | 3 | N | N | N | 3 |\n+-----+-----+-----+-----+-----+\
  \ +-----+-----+-----+-----+-----+\n| 4 | 1 | inf | inf | 0 | | 4 | 4 | N | N | N\
  \ |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\ndistance path\n\
  ```\n\n由于没有自环，对角线被设置为 `N`。顶点到自身的距离为 `0`。要应用 `Floyd-Warshall` 算法，我们将选择一个中间顶点 `k`。然后对于每个顶点\
  \ `i`，我们将检查是否可以从 `i` 到 `k` 然后从 `k` 到 `j`（其中 `j` 是另一个顶点），并最小化从 `i` 到 `j` 的代价。如果当前的\
  \ `distance[i][j]` 大于 `distance[i][k] + distance[k][j]`，我们将把 `distance[i][j]` 等于这两个距离之和。并且\
  \ `path[i][j]` 将被设置为 `path[k][j]`，因为从 `i` 到 `k` 再从 `k` 到 `j` 更好。所有顶点都将被选为 `k`。我们将有三个嵌套循环：`k`\
  \ 从 1 到 4，`i` 从 1 到 4，`j` 从 1 到 4。我们将检查：\n\n```text\nif distance[ i][ j] > distance[\
  \ i][ k] + distance[ k][ j]\n    distance[ i][ j] := distance[ i][ k] + distance[\
  \ k][ j]\n    path[ i][ j] := path[ k][ j]\nend if\n```\n\n所以我们基本上在检查，对于每一对顶点，通过另一个顶点是否能获得更短的距离？我们图的总操作数将是\
  \ `4 * 4 * 4 = 64`。这意味着我们将进行 64 次这种检查。让我们来看其中几个：\n\n当 `k = 1`, `i = 2` 且 `j = 3`\
  \ 时，`distance[i][j]` 为 `-2`，并不大于 `distance[i][k] + distance[k][j] = -2 + 0 = -2`。因此它将保持不变。同样，当\
  \ `k = 1`, `i = 4` 且 `j = 2` 时，`distance[i][j] = infinity`，大于 `distance[i][k] +\
  \ distance[k][j] = 1 + 3 = 4`。因此我们令 `distance[i][j] = 4`，并令 `path[i][j] = path[k][j]\
  \ = 1`。这意味着从顶点-4 到顶点-2，路径 `4->1->2` 比现有路径短。这就是我们填充两个矩阵的方法。每一步的计算在此所示。在进行必要的更改后，我们的矩阵将如下：\n\
  \n```text\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n| |\
  \ 1 | 2 | 3 | 4 | | 1 | 2 | 3 | 4 |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n\
  | 1 | 0 | 3 | 6 | 15 | | 1 | N | 1 | 1 | 1 |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n\
  | 2 | inf | 0 | -2 | inf | | 2 | N | N | 2 | N |\n+-----+-----+-----+-----+-----+\
  \ +-----+-----+-----+-----+-----+\n| 3 | inf | inf | 0 | 2 | | 3 | N | N | N | 3\
  \ |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n| 4 | 1 |\
  \ inf | inf | 0 | | 4 | 4 | N | N | N |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n\
  ```\n\n（注：原文后续部分存在大量重复的描述和逻辑，此处已根据要求不重复输出并保留核心逻辑）\n\n由于没有自环，对角线被设置为 `N`。顶点到自身的距离为\
  \ `0`。要应用 `Floyd-Warshall` 算法，我们将选择一个中间顶点 `k`。然后对于每个顶点 `i`，我们将检查是否可以从 `i` 到 `k`\
  \ 然后从 `k` 到 `j`（其中 `j` 是另一个顶点），并最小化从 `i` 到 `j` 的代价。如果当前的 `distance[i][j]` 大于 `distance[i][k]\
  \ + distance[k][j]`，我们将把 `distance[i][j]` 等于这两个距离之和。并且 `path[i][j]` 将被设置为 `path[k][j]`，因为从\
  \ `i` 到 `k` 再从 `k` 到 `j` 更好。所有顶点都将被选为 `k`。我们将有三个嵌套循环：`k` 从 1 到 4，`i` 从 1 到 4，`j`\
  \ 从 1 到 4。\n\n```text\nif distance[ i][ j] > distance[ i][ k] + distance[ k][ j]\n\
  \    distance[ i][ j] := distance[ i][ k] + distance[ k][ j]\n    path[ i][ j] :=\
  \ path[ k][ j]\nend if\n```\n\n所以我们基本上在检查，对于每一对顶点，通过另一个顶点是否能获得更短的距离？我们图的总操作数将是 `4\
  \ * 4 * 4 = 64`。这意味着我们将进行 64 次这种检查。让我们来看其中几个：当 `k = 1`, `i = 2` 且 `j = 3` 时，`distance[i][j]`\
  \ 为 `-2`，并不大于 `distance[i][k] + distance[k][j] = -2 + 0 = -2`。因此它将保持不变。同样，当 `k =\
  \ 1`, `i = 4` 且 `j = 2` 时，`distance[i][j] = infinity`，大于 `distance[i][k] + distance[k][j]\
  \ = 1 + 3 = 4`。因此我们令 `distance[i][j] = 4`，并令 `path[i][j] = path[k][j] = 1`。这意味着从顶点-4\
  \ 到顶点-2，路径 `4->1->2` 比现有路径短。这就是我们填充两个矩阵的方法。每一步的计算在此所示。在进行必要的更改后，我们的矩阵将如下：\n\n```text\n\
  +-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n| | 1 | 2 | 3 |\
  \ 4 | | 1 | 2 | 3 | 4 |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n\
  | 1 | 0 | 3 | 1 | 3 | | 1 | N | 1 | 2 | 3 |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n\
  | 2 | 1 | 0 | -2 | inf | | 2 | N | N | 2 | N |\n+-----+-----+-----+-----+-----+\
  \ +-----+-----+-----+-----+-----+\n| 3 | inf | inf | 0 | 2 | | 3 | N | N | N | 3\
  \ |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n| 4 | 1 |\
  \ inf | inf | 0 | | 4 | 4 | N | N | N |\n+-----+-----+-----+-----+-----+ +-----+-----+-----+-----+-----+\n\
  ```\n\n# 第 23 章：卡特兰数算法\n\n## 23.1 节：卡特兰数算法\n\n卡特兰数算法是一种动态规划算法。在组合数学中，卡特兰数形成了一系列出现在各种计数问题中的自然数，这些问题通常涉及递归定义。非负整数\
  \ $n$ 的卡特兰数是一组出现在树枚举问题数字，例如：“如果考虑不同的方向，正 $n$ 形有多少种方式可以被分为 $n-2$ 个三角形？”卡特兰算法的应用：\n\
  \n1. 在平面中，在由 $n$ 个硬币组成的底行上堆叠硬币，不允许放在底部硬币的两侧，且每个额外的硬币必须位于另外两个硬币之上的方法数是第 $n$ 个卡特兰数。\n\
  2. 对 $n$ 对括号字符串进行分组，使得每个左括号都有匹配的右括号的方法数是第 $n$ 个卡特兰数。\n3. 在平面中，通过用不相交的直线连接顶点，将 $n+2$\
  \ 边凸边形切割成三角形的方法数是第 $n$ 个卡特兰数。这是欧拉感兴趣的应用。使用从零计数，第 $n$ 个卡特兰数通过以下方程用二项式系数给出：\n\n![](img/rsrc2GK.jpg)\
  \ 卡特兰数示例：\n\n这里 $n=4$ 的值。（最佳示例 - 来自维基百科）\n\n![](img/rsrc2GM.jpg) 辅助空间：O( n)\n\n\
  时间复杂度：O( n² )\n\n## 第 24 章：多线程算法\n\n## 24.1 节：方矩阵乘法\n\n某些多线程算法的示例。\n\n```text\n\
  multithreadmultiply - square- matrix- parallel( A, B)\nn = A.lines\nC = Matrix(\
  \ n,n) //创建一个新的 n*n 矩阵\nparallel for i = 1 to nparallel for j = 1 to n\n    C[ i][\
  \ j] = 0\n    pour k = 1 to n\n    C[ i][ j] = C[ i][ j] + A[ i][ k]* B[ k][ j]\n\
  ```\n\n\n\n\n\n# 第 24.2 节：多线程矩阵向量乘法\n\n```\nreturn Section 24.2: Multiplication\
  \ matrix vector multithreadmatrix - vector( A,x)\n\nn = A.lines\n\ny = Vector (\
  \ n) //创建一个长度为 n 的新向量\n\nparallel for i = 1 to ny [ i] = 0\n\nparallel for i = 1\
  \ to n\n\nfor j = 1 to n\n\ny[ i] = y[ i] + A[ i][ j]* x[ j]\n\nreturn y\n```\n\n\
  # 第 24.3 节：多线程归排序\n\n`A` 是一个数组，`p` 和 `q` 是数组索引，用于对子数组 `A[p..r]` 进行排序。`B` 是将填充排序结果的子数组。\n\
  \n调用 `p-merge-sort(A,p,r,B,s)` 会对 `A[p..r]` 中的元素排序并将其放入 `B[s..s+r-p]`。\n\n`p-merge-sort(\
  \ A,p,r,B,s)`\n\n```\nn = r- p+ 1\n\nif n== 1\n    B [ s] = A[ p]\nelse\n    T =\
  \ new Array ( n) //创建一个大小为 n 的新数组 T\n    q = floor(( p+ r)/ 2 ))\n    q_prime =\
  \ q- p+ 1\n    spawn p- merge- sort( A,p,q,T,1 )\n    p- merge- sort( A,q+ 1 ,r,T,q_prime+\
  \ 1 )\n    sync\n    p- merge( T,1 ,q_prime,q_prime+ 1 ,n,B,s)\n```\n\n这是执行并行合并的辅助函数。\n\
  \n`p-merge` 假设要合并的两个子数组位于同一个数组中，但不假设它们在数组中相邻。这就是为什么我们需要 `p1,r1,p2,r2`。\n\n`p - merge(\
  \ T,p1,r1,p2,r2,A,p3)`\n\n```\nn1 = r1- p1+ 1\n\nn2 = r2- p2+ 1\n\nif n1< n2 //检查\
  \ n1>=n2\n    permute p1 and p2\n    permute r1 and r2\n    permute n1 and n2\n\n\
  if n1== 0 //两个都为空?\n    return\nelse\n    q1 = floor(( p1+ r1)/ 2 )\n    q2 = dichotomic-\
  \ search( T[ q1] ,T,p2,r2)\n    q3 = p3 + ( q1- p1) + ( q2- p2)\n\n    A[ q3] =\
  \ T[ q1]\n    spawn p- merge( T,p1,q1- 1 ,p2,q2- 1 ,A,p3)\n    p- merge( T,q1+ 1\
  \ ,r1,q2,r2,A,q3+ 1 )\n    sync\n```\n\n这里是辅助函数 `dichotomic-search`。\n\n`x` 是在子数组\
  \ `T[p..r]` 中查找的键。\n\n```\ndichotomic - search( x,T,p,r)\n\ninf = p\n\nsup = max(\
  \ p,r+ 1 )\n\nwhile inf< sup\n    half = floor(( inf+ sup)/ 2 )\n    if x<= T[ half]\n\
  \        sup = half\n    else\n        inf = half+ 1\nreturn sup\n```\n\n# 第 25\
  \ 章：Knuth Morris Pratt (KMP) 算法\n\nKMP 是一种模式匹配算法，它通过在主“文本字符串” `S` 中搜索“单词” `W` 的出现情况，其原理是当发生不匹配时，我们有足够的信息来确定下一次匹配可能开始的位置。我们利用这些信息来避免匹配已知将会匹配的字符。搜索模式的最坏情况复杂度降低到\
  \ $O(n)$。\n\n## 第 25.1 节：KMP 示例算法\n\n该算法是一个两步过程。首先，我们创建一个辅助数组 `lps[]`，然后使用该数组搜索模式。\n\
  \n### 预处理：\n1. 我们对模式进行预处理并创建一个辅助数组 `lps[]`，用于在匹配时跳过字符。\n2. 这里 `lps[]` 表示最长真前缀且也是后缀。真前缀是不包含整个字符串的前缀。例如，字符串\
  \ `ABC` 的前缀有 `\" \"`、 `\"A \"`、 `\"AB \"` 和 `\"ABC \"`。真前缀是 `\" \"`、 `\"A \"` 和\
  \ `\"AB \"`。字符串的后缀有 `\" \"`、 `\"C \"`、 `\"BC \"` 和 `\"ABC \"`。\n\n### 搜索：\n1. 我们匹配字符\
  \ `txt[i]` 和 `pat[j]`，并在 `pat[j]` 和 `txt[i]` 继续匹配的同时增加 `i` 和 `j`。\n2. 当我们看到不匹配时，知道字符\
  \ `pat[0..j-1]` 与 `txt[i-j+1 …i-1]` 匹配。我们还知道 `lps[j-1]` 是 `pat[0 …j-1]` 中既是真前缀又是后缀的字符数。从这里得出结论，不需要将这些\
  \ `lps[j-1]` 个字符与 `txt[i-j …i-1]` 匹配，因为我们知道这些字符将会匹配。\n\n### 在 Java 中实现\n\n```java\n\
  public class KMP {\n    public static void main( String [] args) {\n        // TODO\
  \ 自动生成的方法存根\n        String str = \"abcabdabc\" ;\n        String pattern = \"abc\"\
  \ ;\n        KMP obj = new KMP();\n        System .out .println ( obj.patternExistKMP\
  \ ( str.toCharArray () , pattern.toCharArray ()));\n    }\n\n    public int [] computeLPS(\
  \ char [] str){\n        int lps[] = new int [ str.length ];\n        lps[ 0 ] =\
  \ 0;\n        int j = 0;\n        for ( int i = 1 ; i< str.length ; i++){\n    \
  \        if ( str[ j] == str[ i])){\n                lps[ i] = j+ 1;\n         \
  \       j++;\n            } else {\n                if ( j!= 0 )\n             \
  \       j = lps[ j- 1 ];\n                } else {\n                    lps[ i]\
  \ = j+ 1;\n                }\n            }\n        }\n        return lps;\n  \
  \  }\n\n    public boolean patternExistKMP( char [] text, char [] pat){\n      \
  \  int [] lps = computeLPS( pat);\n        int i = 0;\n        j = 0;\n        while\
  \ ( i< text.length && j< pat.length ){\n            if ( text[ i] == pat[ j])){\n\
  \                i++;\n                j++;\n            } else {\n            \
  \    if ( j!= 0 )\n                    j = lps[ j- 1 ];\n                else\n\
  \                    i++;\n            }\n        }\n        if ( j== pat.length\
  \ )\n            return true;\n        else\n            return false;\n    }\n\
  }\n```\n\n# 第 26 章：编辑距离算法\n\n## 第 26.1 节：将字符串 1 转换为字符串 2 的最少编辑\n\n问题描述类似于：如果我们给定字符串\
  \ `str1` 和 `str2`，那么在 `str1` 上可以进行最少的操作以得到 `str2`。操作可以是：\n1. 插入\n2. 删除\n3. 替换\n\n\
  **示例：**\n输入 `str1 = \"geek\"`, `str2 = \"gesek\"`\n输出：`1`（只需要在第一个字符串中插入 `s`）\n\n\
  输入 `str1 = \"march\"`, `str2 = \"cart\"`\n输出：`3`（我们需要替换 `m` 为 `c`，删除 `a`，然后替换 `h`\
  \ 为 `t`）\n\n为了解决这个问题，我们将使用二维数组 `dp[n+1][m+1]`，其中 `n` 是第一个字符串的长度，`m` 是第二个字符串的长度。对于我们的示例，如果\
  \ `str1` 是 `ace` 且 `str2` 是 `abcdef`，那么数组将是 `dp[6][7]`，最终答案将存储在 `dp[5][6]` 中。\n\n\
  ```java\npublic int getMinConversions( String str1, String str2){\n    int n = str1.length();\n\
  \    int m = str2.length();\n    int dp[][] = new int[n+1][m+1];\n\n    for (int\
  \ i = 0; i<= n; i++){\n        for (int j = 0; j<= m; j++){\n            if (i ==\
  \ 0){\n                dp[i][j] = j;\n            } else if (j == 0){\n        \
  \        dp[i][j] = i;\n            } else if (str1.charAt(i-1) == str2.charAt(j-1)){\n\
  \                dp[i][j] = dp[i-1][j-1];\n            } else {\n              \
  \  dp[i][j] = 1 + Math.min(dp[i-1][j], Math.min(dp[i][j-1], dp[i-1][j-1]));\n  \
  \          }\n        }\n    }\n    return dp[n][m];\n}\n```\n\n\n\n\n\n# 第 27.1\
  \ 节：分页（在线缓存）\n\n## 前言\n我们的目标不是从正式定义开始，而是通过一系列示例来触接触这些主题，并在过程中引入定义。备注（remark）部分将包含所有的定义、定理和命题，为你提供关于特定方面的所有信息。备注部分由用于该主题的基础材料以及进一步阅读的额外信息组成。此外，你可以在那里找到示例的完整源代码。请注意使示例源代码更易读且更短，它避免了错误处理以及某些会模糊示例清晰度的语言特性（例如大量使用高级库）。\n\
  \n## 分页\n分页问题产生于有限空间的限制。假设我们的缓存 `C` 有 `k` 个页。现在我们要处理一个包含 `m` 个页面请求的序列，这些请求在处理之前必须被放入缓存中。当然，如果\
  \ `m <= k`，我们只需将所有元素放入缓存即可运行，但通常 `m >> k`。\n\n当页面已经在缓存中时，我们称该请求为`缓存命中 (cache hit)`，否则称为`缓存未命中\
  \ (cache miss)`。在这种情况下，我们必须将请求的页面引入缓存并驱逐另一个（假设缓存已满）。目标是找到一个使驱逐次数最小的驱逐调度策略。\n\n针对这个问题有许多策略，让我们来看一些：\n\
  1. `先进先出 (FIFO)`：最旧的页面被驱逐。\n2. `后进先出 (LIFO)`：最新的页面被驱逐。\n3. `最久未用用 (LRU)`：驱逐最近访问时间最早的那个页面。\n\
  4. `最少频率使用 (LFU)`：驱逐请求频率最低的页面。\n5. `最远向前距离 (LFD)`：驱逐缓存中在未来最远之后才被请求的页面。\n6. `满时清空\
  \ (FWF)`：一旦发生缓存未命中，立即清空整个缓存。\n\n处理这个问题有两种方法：\n1. `离线 (offline)`：页面请求序列是预先知的。\n2.\
  \ `在线 (online)`：页面请求序列不是预知的。\n\n## 在线方法\n对于第一种方法，请参考贪心算法的应用主题。其第三个示例`在线缓存 (Online\
  \ Caching)`考虑了上述前五种策略，并为后续内容提供了一个良好的切入点。\n\n示例程序使用 `FWF` 策略进行了扩展：\n\n```cpp\nclass\
  \ FWF : public Strategy {\npublic:\n    FWF() : Strategy(\"FWF\") {\n    }\n   \
  \ int apply(int requestIndex) override {\n        for (int i = 0; i < cacheSize;\
  \ ++i) {\n            if (cache[i] == request[requestIndex])\n                return\
  \ i; // 在第一个空页之后，其他页必须为空\n            else if (cache[i] == emptyPage)\n        \
  \        return i;\n        }\n        // 没有空页\n        return 0;\n    }\n    void\
  \ update(int cachePos, int requestIndex, bool cacheMiss) override {\n        //\
  \ 没有空页 -> 未命中 -> 清空缓存\n        if (cacheMiss && cachePos == 0) {\n            for\
  \ (int i = 1; i < cacheSize; ++i)\n                cache[i] = emptyPage;\n     \
  \   }\n    }\n};\n```\n\n完整的源代码在此处可用。如果我们重用主题中的示例，将得到以下输出：\n\n```\nStrategy: FWF\n\
  Cache initial: (a,b,c)\nRequest cache 0 cache 1 cache 2 cache miss\na a b c\na a\
  \ b c\nd d X X x e d e X\nb d e b\nb d e b\na a X X x c a c X\nf a c f\nd d X X\
  \ x e d e X\na d e a\nf f X X x b f b X\ne f b e\nc c X X x\nTotal cache misses:\
  \ 5\n```\n\n时间复杂度 O(n²) 第 27 章：在线算法\n\n## 定义\n**定义 1**：优化问题 `Π` 由一个实例集合 `ΣΠ` 组成。对于每个实例\
  \ `σ∈ΣΠ`，存在一个解集 `Ζσ` 和一个目标函数 `fσ : Ζσ → ℜ≥0`，该函数为每个解分配一个正实数值。我们称 `OPT(σ)` 为最优解的值，`A(σ)`\
  \ 为算法 `A` 对于问题 `Π` 的解，而 `wA(σ)=fσ(A(σ))` 为它的值。\n\n**定义 2**：对于最小化问题 `Π` 的在线算法 `A`，如果存在常数\
  \ `τ∈ℜ` 使得对于所有实例 `σ∈ΣΠ` 满足：\n```\nwA(σ) = fσ(A(σ)) ≤ r ⋅ OPT(&σ) + τ\n```\n则其竞争率为\
  \ `r ≥ 1`。`A` 被称为 `r`-竞争在线算法。如果对于所有实例 `σ∈ΣΠ` 都满足：\n```\nwA(σ) ≤ r ⋅ OPT(&σ)\n```\n\
  则 `A` 被称为严格 `r`-竞争在线算法。\n\n**命题 1.3**：`LRU` 和 `FWF` 是标记算法。\n**证明**：在每个阶段的开始（第一阶段除外），`FWF`\
  \ 都会发生缓存未命中并清空缓存。这意味着我们有 `k` 个空页。在每个阶段中最多请求 `k` 个不同的页面，因此在该阶段内不会发生驱逐。所以 `FWF` 是标记算法……（注：此处原文逻辑略显跳跃，已按原意翻译）。\n\
  \n**命题 1.4**：`LRU` 是标记算法。\n（注：原文此处证明部分不完整，已按原意翻译）。\n\n\n\n\n\n# 在线方法\n\n现在我们来处理分页（paging）的在线问题。但首先，我们需要理解如何做到。显然，在线算法不可能优于最优离线算法。但它们到底差了多少呢？我们需要形式化的定义来回答这个问题：\n\
  \n**定义 1.1**：一个优化问题 `Π` 由一组实例 `ΣΠ` 组成。对于每一个实例 `σ`∈`ΣΠ`，存在一个解的集合 `Ζσ` 和一个目标函数 `fσ`\
  \ : `Ζσ` → `ℜ≥0`，该函数为每个解分配一个正实数。我们称 `OPT(σ)` 为最优解的值，`A(σ)` 为算法 `A` 对问题 `Π` 的解，而\
  \ `wA(σ)=fσ(A(σ))` 为其值。\n\n**定义 1.2**：对于最小化问题 `Π` 的在线算法 `A`，如果存在常数 `τ`∈`ℜ`，使得对于所有实例\
  \ `σ`∈`ΣΠ` 都有：\n```\nwA(σ) = fσ(A(σ)) ≤ r ⋅ OPT(σ) + τ\n```\n则称该算法的竞争率为 `r ≥ 1`。`A`\
  \ 被称为 `r`-竞争在线算法。如果对于所有实例 `σ`∈`ΣΠ` 都满足：\n```\nwA(σ) ≤ r ⋅ OPT(σ)\n```\n则 `A` 被称为严格\
  \ `r`-竞争在线算法。\n\n因此，问题在于与。Allan Borodin 和 Ran El-Yaniv 在他们著名的著作中使用另一个场景来描述在线分页的情况：存在一个恶意的对手，他知道你的算法和最优离线算法。在每一步中，他都会尝试请求一个对你最不利同时对离线算法最优的页面。你的算法的竞争因子就是你的算法相对于对手最优离线算法所表现出的恶劣程度。如果你想尝试扮演对手，可以尝试“对抗游戏”（Adversary\
  \ Game，尝试击败分页策略）。\n\n# 标记算法\n\n与其单独分析每种算法，让我们来看分页问题的一个特殊在线算法族，称为标记算法（marking algorithms）。\n\
  \n设 `σ=(σ1,...,σp)` 为我们问题的实例，`k` 为缓存大小，那么 `σ` 可以被分为若干阶段（phases）：\n- **阶段 1** 是 `σ`\
  \ 从开始到请求了最多 `k` 个不同页面的最大子序列。\n- **阶段 i ≥ 2** 是 `σ` 从阶段 `i-1` 结束到请求了最多 `k` 个不同页面的最大子序列。\n\
  \n例如当 `k = 3` 时：\n\n![](img/rsrc2GS.jpg)\n\n标记算法（隐式或显式地）维护一个页面是否被标记。在每个阶段的开始，所有页面都是未标记的。如果一个页面在阶段内被请求，它就会被标记。一个算法是标记算法当且仅当它从从缓存中驱逐已标记的页面。这意味着在阶段期间使用的页面不会被驱逐。\n\
  \n**命题 1.3**：LRU 和 FWF 是标记算法。\n\n**证明**：在每个阶段的开始（第一个阶段外），FWF 会发生缓存缺失并清空缓存。这意味着我们有\
  \ `k` 个空页。在每个阶段中，都会请求最多 `k` 个不同的页面，因此在该阶段内会发生驱逐。所以 FWF 是标记算法。\n\n假设 LRU 不是标记算法。那么存在一个实例\
  \ `σ`，LRU 在阶段 `i` 驱逐了一个已标记的页面 `x`。设 `σt` 是阶段 `i` 中驱逐 `x` 的请求。由于 `x` 是标记的，在同一阶段内必须有一个早于\
  \ `x` 的请求 `σt*`，所以 `t* < t`。在 `t*` 之后 `x` 是缓存中最新的页面，因此要在 `t` 被驱逐，序列 `σt*+1,...,σt`\
  \ 必须请求至少 `k` 个不同于 `x` 的页面。这意味着阶段 `i` 请求了至少 `k+1` 个不同页面，这与阶段的定义矛盾。因此 LRU 必须是标记算法。\n\
  \n**命题 1.4**：每个标记算法都是严格 `k`-竞争的。\n\n**证明**：设 `σ` 为分页实例，`l` 为 `σ` 的阶段数。如果 `l = 1`，则每个标记算法都是最优的，最优离线算法无法更好。\n\
  \n假设 `l ≥ 2`。对于实例 `σ`，每个标记算法的代价上限为 `l ⋅ k`，因为在每个阶段中，标记算法在不驱逐已标记页面的情况下无法驱逐超过 `k`\
  \ 个页面。现在我们尝试证明最优离线算法对于 `σ` 至少驱逐 `k+l-2` 个页面：第一阶段 `k` 个，除最后一个阶段外的每个后续阶段至少一个。为了证明，我们定义\
  \ `σ` 的 `l-2` 个不相交的子序列。子序列 `i ∈ {1,...,l-2}` 从阶段 `i+1` 的第二个位置开始，到阶段 `i+2` 的第一个位置结束。设\
  \ `x` 为阶段 `i+1` 的第一个页面。在子序列 `i` 开始时，最优离线算法缓存中有页面 `x` 和最多 `k-1` 个不同页面。在子序列 `i` 中有\
  \ `k` 个不同于 `x` 的页面请求，因此最优离线算法每个子序列必须驱逐一个页面。由于第一阶段开始时缓存仍为空，最优离线算法在第一阶段产生了 `k` 次驱逐。这表明\
  \ `wA(σ) ≤ l⋅k ≤ (k+l-2)k ≤ OPT(σ) ⋅ k`\n\n**推论 1.5**：LRU 和 FWF 是严格 `k`-竞争的。\n\n\
  **练习题**：证明 FIFO 不是标记算法，但是严格 `k`-竞争的。\n\n如果不存在常数 `r` 使得在线算法 `A` 是 `r`-竞争的，我们称 `A`\
  \ 为非竞争。\n\n**命题 1.6**：LFU 和 FWF 不是竞争的。\n\n**证明**：设 `l ≥ 2` 为常数，`k ≥ 2`。以下是 `1` 是\
  \ `k+1`。我们观察：\n\n![](img/rsrc2GS.jpg) 第一个页面 1 是 `k-1`。\n\nLFU 和 LIFO 驱逐了 `k-1` 个页面。此外，1-1\
  \ 是 `k-1`。此外，有 `k-1+2` 对于 `k-1`。\n\n![](img/rsrc2GN.jpg) 等于\n\n![](img/rsrc2GP.jpg)\
  \ 所以\n\n![](img/rsrc2GR.jpg) \n\n**命题 1.7**：不存在对于 `r < k` 的 `r`-竞争分页在线算法。该命题的证明相当长，且基于\
  \ LFD 是最优离线算法。感兴趣的读者可以参考 Borodin 和 El-Yaniv 的书。\n\n# 排序\n\n## 参数\n- 稳定性\n- 原地\n\
  - 最优情况复杂度\n- 平均情况复杂度\n- 最坏情况复杂度\n\n### 描述\n如果排序算法在排序后保持相同元素的相对顺序，则它是稳定的。\n\n如果排序算法排序时仅使用\
  \ `O(1)` 辅助内存（不包括需要排序的数组），则是原地的。\n\n如果排序算法的运行时间至少为 `T(n)`，则其最优情况复杂度为 `O(T(n))`。\n\
  \n如果排序算法在所有可能输入的平均运行时间为 `T(n)`，则其平均情况复杂度为 `O(T(n))`。\n\n如果排序算法的运行时间最多为 `T(n)`，则其最坏情况复杂度为\
  \ `O(T(n))`。\n\n## 28.1：排序的稳定性\n排序的稳定性是指排序算法是否在结果输出中保持原始输入相同键的相对顺序。因此，如果两个具有相同键的对象在排序输出中的顺序与它们在输入排序数组中的顺序相同，则称该排序算法是稳定的。考虑一组对：\n\
  \n( 1, 2 ) ( 9, 7 ) ( 3, 4 ) ( 8, 6 ) ( 9, 3 )\n\n现在我们使用每个对的元素对列表进行排序。\n\n该列表的稳定排序将输出以下列表：\n\
  \n( 1, 2 ) ( 3, 4 ) ( 8, 6 ) ( 9, 7 ) ( 9, 3 )\n\n因为在原始列表中 ( 9, 3 ) 也出现在 ( 9, 7\
  \ ) 之后。\n\n不稳定的排序将输出以下列表：\n\n( 1, 2 ) ( 3, 4 ) ( 8, 6 ) ( 9, 3 ) ( 9, 7 )\n\n不稳定的排序可能会产生稳定排序相同的输出，但并非总是如此。\n\
  \n\n\n\n\n## 常见的稳定排序\n- `归并排序`\n- `插入排序`\n- `基数排序`\n- `Tim sort`\n- `冒泡排序`\n\n##\
  \ 常见的不稳定排序\n- `堆排序`\n- `快速排序`\n\n## 第 29 章：冒泡排序\n| 参数 | 描述 |\n| :--- | :--- |\n\
  | 稳定性 | 是 |\n| 原地排序 | 是 |\n| 最佳情况复杂度 | `O(n)` |\n| 平均情况复杂度 | `O(n²)` |\n| 最坏情况复杂度\
  \ | `O(n²)` |\n| 空间复杂度 | `O(1)` |\n\n## 第 29.1 节：冒泡排序\n`BubbleSort` 比较无序列表中每个相邻的元素，如果它们的顺序不对，则反转这些元素。\n\
  \n以下示例演示了对列表 `{ 6 , 5 , 3 , 1 , 8 , 7 , 2 , 4 }` 所示冒泡排序（每一步中比较的元素对封装在 '**' 中）：`{\
  \ 6 ,5 ,3 ,1 ,8 ,7 ,2 ,4 }`\n\n- `{** 5 ,6 ** ,3 ,1 ,8 ,7 ,2 ,4 }` - `5 < 6` ->\
  \ 交换 `{ 5 ,** 3 ,6 ** ,1 ,8 ,7 ,2 ,4 }` - `3 < 6` -> 交换 `{ 5 ,3 ,** 1 ,6 ** ,8 ,7\
  \ ,2 ,4 }` - `1 < 6` -> 交换 `{ 5 ,3 ,1 ,** 6 ,8 ** ,7 ,2 ,4 }` - `8 > 6` -> 不交换 `{\
  \ 5 ,3 ,1 ,6 ,** 7 ,8 ** ,2 ,4 }` - `7 < 8` -> 交换 `{ 5 ,3 ,1 ,6 ,7 ,** 2 ,8 ** ,4\
  \ }` - `2 < 8` -> 交换 `{ 5 ,3 ,1 ,6 ,7 ,2 ,** 4 ,8 **}` - `4 < 8` -> 交换\n\n在遍历列表一次后，我们得到了\
  \ `{ 5 ,3 ,1 ,6 ,7 ,2 ,4 ,8 }`。注意，数组中未排序的最大值（在此例中为 `8`）将始终到达最终位置。因此，为了确保列表有序，对于长度为\
  \ `n` 的列表，我们需要遍历 `n-1` 次。\n图示：![](img/rsrc2GT.jpg)\n\n### 第 29.2 节：C & C++ 中的实现\n\
  C++ 中 `BubbleSort` 的示例实现：\n\n```cpp\nvoid bubbleSort( vector< int> numbers)\n{\n\
  \  for ( int i = numbers.size () - 1 ; i >= 0 ; i--) {\n    for ( int j = 1 ; j\
  \ <= i; j++) {\n      if ( numbers[ j-1 ] > numbers[ j]) {\n        swap( numbers[\
  \ j - 1 ] ,numbers( j));\n      }\n    }\n  }\n}\n```\n\nC 实现\n```c\nvoid bubble_sort(\
  \ long list[] , long n) {\n  long c, d, t;\n  for ( c = 0 ; c < ( n - 1 ); c++)\
  \ {\n    for ( d = 0 ; d < n - c - 1 ; d++) {\n      if ( list[ d] > list[ d + 1\
  \ ]) {\n        /* Swapping */\n        t = list[ d ];\n        list[ d] = list[\
  \ d + 1 ];\n        list[ d + 1 ] = t;\n      }\n    }\n  }\n}\n```\n\n带指针的冒泡排序\n\
  ```c\nvoid pointer_bubble_sort( long * list, long n) {\n  long c, d, t;\n  for (\
  \ c = 0 ; c < ( n - 1 ); c++) {\n    for ( d = 0 ; d < n - c - 1 ; d++) {\n    \
  \  if ( * ( list + d ) > *( list+ d+ 1 )) {\n        /* Swapping */\n        t =\
  \ * ( list + d );\n        * ( list + d ) = * ( list + d + 1 );\n        * ( list\
  \ + d + 1 ) = t;\n      }\n    }\n  }\n}\n```\n\n### 第 29.3 节：C# 中的实现\n冒泡排序也称为 `Sinking\
  \ Sort`（下沉排序）。它是一种简单的排序算法，通过重复遍历待排序的列表，比较每对相邻项，如果它们的顺序错误，则进行交换。\n冒泡排序示例![](img/rsrc2GU.jpg)\n\
