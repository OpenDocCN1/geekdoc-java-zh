  \     }\n    }\n    return ;\n}\n\n//用逗号分隔打印数组\nvoid print( int n, double x[ n]){\n\
  \    int i;\n    for ( i= 0 ; i< n; i++){\n        printf( \"%lf, \" , x[ i]);\n\
  \    }\n    printf( \" \\n\\n \" );\n    return ;\n}\n\nint main(){\n    //方程初始化\n\
