  \ \");\n    }\n  }\n}\n```\n\n\n\n\n\n```java\npublic interface InPlaceSort<T extends\
  \ Comparable<T>> { void sort(final T[] elements); }\n\npublic class MergeSort<T\
  \ extends Comparable<T>> implements InPlaceSort<T> {\n    @Override\n    public\
  \ void sort(T[] elements) {\n        T[] arr = (T[]) new Comparable[elements.length];\n\
  \        sort(elements, arr, 0, elements.length - 1);\n    } // 我们检查两边部分，然后合并它们\n\
  \n    private void sort(T[] elements, T[] arr, int low, int high) {\n        if\
  \ (low >= high) return;\n        int mid = low + (high - low) / 2;\n        sort(elements,\
  \ arr, low, mid);\n        sort(elements, arr, mid + 1, high);\n        merge(elements,\
  \ arr, low, high, mid);\n    }\n\n    private void merge(T[] a, T[] b, int low,\
  \ int high, int mid) {\n        int i = low;\n        int j = mid + 1; // 我们从两个元素中选择最小的一个。然后将其放入\
  \ b 中\n        for (int k = low; k <= high; k++) {\n            if (i <= mid &&\
  \ j <= high) {\n                if (a[i].compareTo(a[j]) >= 0) {\n             \
  \       b[k] = a[j++];\n                } else {\n                    b[k] = a[i++];\n\
  \                }\n            } else if (j > high && i <= mid) {\n           \
  \     b[k] = a[i++];\n            } else if (i > mid && j <= high) {\n         \
  \       b[k] = a[j++];\n            }\n        }\n        for (int n = low; n <=\
  \ high; n++) {\n            a[n] = b[n];\n        }\n    }\n}\n```\n\n# 第 30.5 ：Python\
