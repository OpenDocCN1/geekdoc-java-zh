  \ \\t \" ;\n        for (int i = 0; i < cacheSize; ++i) cout << \"cache \" << i\
  \ << \" \\t \" ; cout << \"cache miss\" << endl;\n        int cntMisses = 0;\n \
  \       for (int i = 0; i< requestLength; ++i) {\n            bool isMiss = updateCache(i,\
  \ selectedStrategy[strat]);\n            if (isMiss) ++cntMisses;\n            cout\
  \ << \" \" << request[i] << \" \\t \" ;\n            for (int l= 0; l < cacheSize;\
  \ ++l) cout << \" \" << cache[l] << \" \\t \" ; cout << (isMiss ? \"x\" : \"\" )\
  \ << endl;\n        }\n        cout << \" \\n Total cache misses: \" << cntMisses\
  \ << endl;\n    }\n    for (int i= 0; i< 5; ++i) delete selectedStrategy[i];\n}\n\
  ```\n\n基本很简单：对于每个请求，我对策略执行了两次调用：\n1. `apply`：策略必须告诉调用者应该使用哪个页面。\n2. `update`：调用者在使用该位置后，它告诉策略是命中还是缺失。然后策略可能会更新其内部数据。例如，`LFU`\
  \ 策略必须更新缓存页面的命中频率，而 `LFD` 策略必须重新计算缓存页面的距离。\n\n现在让我们来看看这五种策略的示例实现：\n\n### FIFO\n\
  ```cpp\nclass FIFO : public Strategy {\npublic :\n    FIFO() : Strategy( \"FIFO\"\
  \ )\n    {\n        for ( int i= 0 ; i< cacheSize; ++ i) age[ i] = 0 ;\n    }\n\
  \    int apply( int requestIndex) override {\n        int oldest = 0 ;\n       \
  \ for ( int i= 0 ; i< cacheSize; ++ i) {\n            if ( cache[ i] == request[\
  \ requestIndex]) return i;\n            else if ( age[ i] > age[ oldest]) oldest\
  \ = i;\n        }\n        return oldest; \n    }\n    void update( int cachePos,\
  \ int requestIndex, bool cacheMiss) override {\n        // 没有变化，不需要更新年龄\n      \
  \  if (!cacheMiss) return ;\n        // 旧页面变旧，新页面变 0\n        for ( int i= 0 ; i<\
  \ cacheSize; ++ i) {\n            if ( i != cachePos) age[ i]++;\n            else\n\
  \            age[ i] = 0 ;\n        }\n    }\nprivate:\n    int age[ cacheSize];\n\
  };\n```\n`FIFO` 只需要页面在缓存中的时长（相对于其他页面）。因此要做的就是等待缺失并驱逐页面。我们示例程序的解决方案是：\n```\nStrategy:\
  \ FIFO\nCache initial: (a,b,c)\nRequest 0 cache 1 2 cache\n\n b c\na c\nd x\ne x\n\
  a x\nf x\nf d\nf c\n...\nTotal cache misses: 13\n```\n\n### LIFO\n```cpp\nclass\
  \ LIFO : public Strategy {\npublic :\n    LIFO() : Strategy( \"LIFO\" )\n    {\n\
  \        for ( int i= 0 ; i< cacheSize; ++ i) age[ i] = 0 ;\n    }\n    int apply(\
  \ int requestIndex) override {\n        int newest = 0 ;\n        for ( int i= 0\
  \ ; i< cacheSize; ++ i) {\n            if ( cache[ i] == request[ requestIndex])\
  \ return i;\n            else if ( age[ i] < age[ newest]) newest = i;\n       \
  \ }\n        return newest;\n    }\n    void update( int cachePos, int requestIndex,\
  \ bool cacheMiss) override {\n        // 没有变化，不需要更新年龄\n        if (!cacheMiss) return\
  \ ;\n        // 旧页面变旧，新页面变 0\n        for ( int i= 0 ; i< cacheSize; ++ i) {\n \
  \           if ( i != cachePos) age[ i]++;\n            else\n            age[ i]\
  \ = 0 ;\n        }\n    }\nprivate:\n    int age[ cacheSize];\n};\n```\n`LIFO` 的实现与\
  \ `FIFO` 相似，但我们驱逐的是最新的页面。程序结果是：\n```\nStrategy: LIFO\nCache initial: (a,b,c)\nRequest\
  \ 0 cache 1 2 cache\n...\nTotal cache misses: 9\n```\n\n### LRU\n```cpp\nclass LRU\
  \ : public Strategy {\npublic :\n    LRU() : Strategy( \"LRU\" )\n    {\n      \
  \  for ( int i= 0 ; i< cacheSize; ++ i) age[ i] = 0 ;\n    }\n    // 这里 oldest 表示最久未使用\n\
  \    int apply( int requestIndex) override {\n        int oldest = 0 ;\n       \
  \ for ( int i= 0 ; i< cacheSize; ++ i) {\n            if ( cache[ i] == request[\
  \ requestIndex]) return i;\n            else if ( age[ i] > age[ oldest]) oldest\
  \ = i;\n        }\n        return oldest;\n    }\n    void update( int cachePos,\
  \ int requestIndex, bool cacheMiss) override {\n        // 旧页面变旧，使用的页面变 0\n    \
  \    for ( int i= 0 ; i< cacheSize; ++ i) {\n            if ( i != cachePos) age[\
  \ i]++;\n            else\n            age[ i] = 0 ;\n        }\n    }\nprivate:\n\
  \    int age[ cacheSize];\n};\n```\n在 `LRU` 的情况下，策略与缓存页面中的内容无关，它只关心最后一次使用。程序结果是：\n\
  ```\nStrategy: LRU\nCache initial: (a,b,c)\n...\nTotal cache misses: 13\n```\n\n\
  ### LFU\n```cpp\nclass LFU : public Strategy {\npublic :\n    LFU() : Strategy(\
  \ \"LFU\" )\n    {\n        for ( int i= 0 ; i< cacheSize; ++ i) requestFrequency[\
  \ i] = 0 ;\n    }\n    int apply( int requestIndex) override {\n        int least\
  \ = 0 ;\n        for ( int i= 0 ; i< cacheSize; ++ i) {\n            if ( cache[\
  \ i] == request[ requestIndex]) return i;\n            else if ( requestFrequency[\
  \ i] < requestFrequency[ least]) least = i;\n        }\n        return least;\n\
  \    }\n    void update( int cachePos, int requestIndex, bool cacheMiss) override\
  \ {\n        if ( cacheMiss)\n            requestFrequency[cachePos] = 1 ;\n   \
  \     else ++requestFrequency[cachePos];\n    }\nprivate:\n    // 页面使用的频率\n    int\
  \ requestFrequency[ cacheSize];\n};\n```\n`LFU` 驱逐使用频率最少的页面。因此更新策略只是计算每次访问。当然，在缺失后计数会重置。程序结果是：\n\
  ```\nStrategy: LFU\nCache initial: (a,b,c)\n...\nTotal cache misses: 10\n```\n\n\
