  md: '# 43. Design Patterns in Java


    Design patterns are reusable solutions to common problems encountered in software
    design. They provide a template or guideline for solving recurring design problems
    and promote code that is more modular, flexible, and maintainable. Here are some
    classic design patterns often used in Java development:


    Creational Patterns:


    Singleton Pattern: Ensures that a class has only one instance and provides a global
    point of access to it.


    Factory Method Pattern: Defines an interface for creating an object but lets subclasses
    alter the type of objects that will be created.


    Abstract Factory Pattern: Provides an interface for creating families of related
    or dependent objects without specifying their concrete classes.


    Builder Pattern: Separates the construction of a complex object from its representation,
    allowing the same construction process to create various representations.


    Prototype Pattern: Creates new objects by copying an existing object, known as
    the prototype.


    Structural Patterns:


    Adapter Pattern: Allows the interface of an existing class to be used as another
    interface.


    Bridge Pattern: Separates an abstraction from its implementation so that the two
    can vary independently.'
  merge: -1
  pgno: 183
- img_proc: true
  md: 'Composite Pattern: Composes objects into tree structures to represent part-whole
    hierarchies. Clients can treat individual objects and compositions of objects
    uniformly.


    Decorator Pattern: Attaches additional responsibilities to an object dynamically.
    Decorators provide a flexible alternative to subclassing for extending functionality.


    Facade Pattern: Provides a unified interface to a set of interfaces in a subsystem.
    Facade defines a higher-level interface that makes the subsystem easier to use.


    Flyweight Pattern: Minimizes memory usage or computational expenses by sharing
    as much as possible with related objects; it is a way to use objects in large
    numbers when a simple repeated representation would use an unacceptable amount
    of memory.


    # Behavioral Patterns:


    Chain of Responsibility Pattern: Passes requests along a chain of handlers. Upon
    receiving a request, each handler decides either to process the request or pass
    it to the next handler in the chain.


    Command Pattern: Encapsulates a request as an object, thereby allowing for parameterization
    of clients with different requests, queuing of requests, and logging of the requests.


    Interpreter Pattern: Defines a grammar for interpreting the sentences in a language
    and provides an interpreter to interpret the sentences.


    Iterator Pattern: Provides a way to access elements of an aggregate object sequentially
    without exposing its underlying representation.'
  merge: -1
  pgno: 184
- img_proc: true
  md: 'Mediator Pattern: Defines an object that centralizes communication between
    a set of objects. Objects no longer communicate directly with each other but instead
    communicate through the mediator.


    Memento Pattern: Captures and externalizes an object''s internal state so that
    the object can be restored to this state later.


    Observer Pattern: Defines a one-to-many dependency between objects, so that when
    one object changes state, all its dependents are notified and updated automatically.


    State Pattern: Allows an object to alter its behavior when its internal state
    changes. The object will appear to change its class.


    Strategy Pattern: Defines a family of algorithms, encapsulates each algorithm,
    and makes the algorithms interchangeable. Strategy lets the algorithm vary independently
    from clients that use it.


    Template Method Pattern: Defines the skeleton of an algorithm in the superclass
    but lets subclasses override specific steps of the algorithm without changing
    its structure.


    Visitor Pattern:


    Represents an operation to be performed on the elements of an object structure.
    Visitor lets you define a new operation without changing the classes of the elements
    on which it operates.


    These design patterns provide solutions to common software design problems and
    promote best practices in software development. While using design patterns, it''s
    essential to consider the specific context and requirements of your application
    to choose the most appropriate pattern. Additionally, Java provides built-in support
    for many design patterns through its core libraries and frameworks.'
  merge: -1
