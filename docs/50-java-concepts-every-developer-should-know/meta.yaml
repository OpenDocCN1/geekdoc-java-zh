  md: '# 7. Exception Handling (try, catch, finally)


    Exception handling is a crucial aspect of writing robust and error-tolerant code.
    It involves using try, catch, and finally blocks to manage and handle exceptions.
    Let''s explore these concepts with an example:


    try Block: The try block encloses the code that might throw an exception. In this
    case, we''re trying to get user input and perform a division operation:


    ```

    try {

    // Code that may cause an exception

    System.out.println("Enter a number: ");

    int number = scanner.nextInt();


    // Division by zero to trigger an exception

    int result = 10 / number;


    // This line won''t be executed if an exception occurs

    System.out.println("Result: " + result);

    }

    ```


    In this block:


    +   - We prompt the user to enter a number using scanner.nextInt()

    - We attempt a division operation (10 / number), which may result in an ArithmeticException
    if the user enters 0.'
