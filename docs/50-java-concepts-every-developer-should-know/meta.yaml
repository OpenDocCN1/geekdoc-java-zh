    /login?expired\")\n    .and();\n}\n```\n\n## OAuth 2.0:\n\nOAuth 2.0 支持: Spring\
    \ Security 支持 OAuth 2.0 用于保护 API 并启用单点登录。\n\n```java\n@Override\nprotected configure(HttpSecurity\
    \ http) throws Exception {\n  http\n    .authorizeRequests()\n      .antMatchers(\"\
    /api/**\").authenticated()\n    .and()\n    .oauth2Login()\n    .and()\n    .oauth2ResourceServer()\n\
    \      .jwt();\n}\n```\n\n安全注解: 使用安全注解标记方法来实现方法级安全。\n\n```java\n@PreAuthorize(\"\
    hasRole('ADMIN')\")\npublic void adminMethod() {\n    // 仅限 ADMIN 访问的方法\n}\n```\n\
    \n安全头部: Spring Security 允许配置安全头部以增强 Web 应用的安全性。\n\n```java\n@Override\nprotected\
    \ void configure(HttpSecurity http) throws Exception {\n    http\n    .headers()\n\
    \      .frameOptions().sameOrigin()\n    .and();\n}\n```\n\n安全事件与日志:\n安全事件: 配置安全相关事件的处理，并使用日志进行审计。\n\
    \n```java\n@Bean\npublic ApplicationListener<AuthenticationSuccessEvent> authenticationSuccessEventListener()\
    \ {\n    return new AuthenticationSuccessEventListener();\n}\n```\n\n"
