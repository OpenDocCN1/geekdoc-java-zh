    ```"
- md: "\n```xml\n<plugin>\n  <groupId>org.apache.maven.plugins</groupId>\n  <artifactId>maven-surefire-plugin</artifactId>\n\
    \  <version>3.0.0-M5</version>\n</plugin>\n</plugins>\n</build>\n```\n\nRunning\
    \ Tests: Maven automatically runs tests during the test phase.\n\n`mvn test`\n\
    \nGradle:\n\n1. Setup: Include a build.gradle file in your project\n\n```gradle\n\
    plugins {\n  id 'java'\n}\n\ngroup 'com.example'\nversion '1.0.0'\n\nrepositories\
    \ {\n  mavenCentral()\n}\n```\n\nAdding Dependencies: Declare dependencies using\
    \ the dependencies block.\n\n```gradle\ndependencies {\n  implementation 'group-id:artifact-id:1.0.0'\n\
    }\n```\n\n## Build Lifecycle:\n\nGradle uses a declarative syntax and defines\
    \ tasks for each build phase.\n\n- ./gradlew clean # Cleans the project\n- ./gradlew\
    \ compile # Compiles the source code\n- ./gradlew test # Runs tests\n- ./gradlew\
    \ build # Builds the project\n\nPlugins: Gradle plugins can be applied to extend\
    \ functionality. The java plugin is applied by default for Java projects.\n\n\
    ```gradle\nplugins {\n  id 'java'\n}\n```\n\nRunning Tests: Gradle automatically\
    \ runs tests during the test task.\n\n`./gradlew test`\n\n## Additional Features:\n\
    \n- a. Dependency Scopes: Both Maven and Gradle support different dependency scopes\
    \ (e.g., compile, test, provided).\n- b. Custom Tasks: Define custom tasks in\
    \ both Maven and Gradle to perform specific actions.\n- c. Profiles (Maven): Maven\
    \ allows you to define profiles for different build configurations.\n- d. Build\
    \ Profiles (Gradle): Gradle provides build profiles for configuring build scenarios.\n\
    \nBoth Maven and Gradle are powerful build tools with similar functionalities.\
    \ The choice between them often comes down to personal or team preference. Both\
    \ tools simplify dependency management, build processes, and project configuration,\
    \ allowing developers to focus on writing code rather than managing the project's\
    \ infrastructure.\n\n## 37. API Creation with Spring Framework\n\nCreating APIs\
    \ with the Spring Framework is a common practice in Java development. Spring provides\
    \ a comprehensive set of tools and features that make it easy to build robust\
    \ and scalable APIs. Here's a high-level overview of creating APIs with the Spring\
    \ Framework:\n\nSpring Boot: Spring Boot is an extension of the Spring framework\
    \ that simplifies the process of building production-ready applications. It includes\
    \ an embedded Tomcat server, eliminates boilerplate code, and simplifies configuration.\n\
    \n- 1. Project Setup: Create a new Spring Boot project using Spring Initializr\
    \ or your preferred IDE.\n- 2. Dependencies: Select dependencies such as Spring\
    \ Web to enable web-related functionality.\n- 3. Project Structure: Spring Boot\
    \ projects typically have a structure with a main application class, controllers,\
    \ services, and repositories.\n- 4. Creating a Controller: Controllers handle\
    \ incoming HTTP requests and define API endpoints.\n\n```java\nimport org.springframework.web.bind.annotation.GetMapping;\n\
    import org.springframework.web.bind.annotation.RequestMapping;\nimport org.springframework.web.bind.annotation.RestController;\n\
    \n@RestController\n@RequestMapping(\"/api\")\npublic class MyController {\n  \
    \  @GetMapping(\"/hello\")\n    public String sayHello() {\n        return \"\
    Hello, World!\";\n    }\n}\n```\n\nRunning the Application: Spring Boot applications\
    \ can be run as standalone JAR files or using the provided main method in the\
    \ application class.\n\n- 6. Testing Endpoints: Use tools like Postman or curl\
    \ to test your API endpoints.\n\nRESTful APIs:\n\n- 1. RESTful Principles: Follow\
    \ RESTful principles, such as using appropriate HTTP methods (GET, POST, PUT,\
    \ DELETE), resource naming, and stateless communication.\n- 2. Request Mapping:\
    \ Use @RequestMapping or more specific annotations like @GetMapping and @PostMapping\
    \ to map endpoints.\n- 3. Request Parameters and Path Variables: Capture request\
    \ parameters and path variables using @RequestParam and @PathVariable.\n\n```java\n\
    @GetMapping(\"/greet\")\npublic String greet(@RequestParam String name) {\n  \
    \  return \"Hello, \" + name + \"!\";\n}\n\n@GetMapping(\"/users/{userId}\")\n\
    public User getUser(@PathVariable Long userId) {\n    // Retrieve and return user\
    \ information\n    return ...\n}\n```\n\nRequest and Response Bodies: Send and\
    \ receive data in the request and response bodies using @RequestBody and @ResponseBody.\n\
    \n```java\n@PostMapping(\"/create\")\npublic ResponseEntity<String> createUser(@RequestBody\
    \ User user) {\n    // Process and save the user\n    return ResponseEntity.ok(\"\
    User created successfully\");\n}\n```\n\nException Handling: Handle exceptions\
    \ and provide appropriate error responses using @ExceptionHandler or global exception\
    \ handling.\n\n```java\n@ExceptionHandler(ResourceNotFoundException.class)\npublic\
    \ ResponseEntity<String> handleResourceNotFound(ResourceNotFoundException ex)\
    \ {\n    return ResponseEntity.status(HttpStatus.NOT_FOUND).body(ex.getMessage());\n\
    }\n```\n\nSpring Data JPA: Spring Data JPA simplifies data access and persistence.\
    \ It provides a higher-level, more abstracted interface for working with databases.\n\
    \n- 1. Entity Classes: Define entity classes representing your data model.\n\n\
    ```java\nimport javax.persistence.Entity;\nimport javax.persistence.GeneratedValue;\n\
    import javax.persistence.GenerationType;\nimport javax.persistence.Id;\n\n@Entity\n\
    public class User {\n    @Id\n    @GeneratedValue(strategy = GenerationType.IDENTITY)\n\
    \    private Long id;\n    private String username;\n    private String email;\n\
    \    // getters and setters\n}\n```\n\nRepository Interface: Create a repository\
    \ interface by extending JpaRepository.\n\n```java\nimport org.springframework.data.repository.JpaRepository;\n\
    \npublic interface UserRepository extends JpaRepository<User, Long> {\n    User\
    \ findByUsername(String username);\n}\n```\n\nService Layer: Implement a service\
    \ layer to manage business logic.\n\n```java\nimport org.springframework.beans.factory.annotation.Autowired;\n\
    import org.springframework.stereotype.Service;\n\n@Service\npublic class UserService\
    \ {\n    @Autowired\n    private UserRepository userRepository;\n\n    public\
    \ User getByUsername(String username) {\n        return userRepository.findByUsername(username);\n\
    \    }\n}\n```\n\nController Integration: Integrate the service layer with controllers\
    \ to handle data-related operations.\n\n```java\n@RestController\n@RequestMapping(\"\
    /api/users\")\npublic class UserController {\n    @Autowired\n    private UserService\
