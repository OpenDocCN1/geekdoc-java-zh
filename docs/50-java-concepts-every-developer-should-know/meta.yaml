    \n# 4. Methods and Classes in Java:\n\nIn Java, methods and classes are fundamental\
    \ building blocks that facilitate code organization, reusability, and maintainability.\
    \ A method is a block of code that performs a specific task, and a class is a\
    \ blueprint for creating objects.\n\nLet's explore a simple example:\n\n```java\n\
    public class Main {\n    public static void main(String[] args) {\n        //\
    \ Create an object of the Calculator class\n        Calculator myCalculator =\
    \ new Calculator();\n\n        // Call methods of the Calculator class\n     \
    \   int sum = myCalculator.add(10, 5);\n        int difference = myCalculator.subtract(20,\
    \ 8);\n\n        // Display the results\n        System.out.println(\"Sum: \"\
    \ + sum);\n        System.out.println(\"Difference: \" + difference);\n    }\n\
    }\n\n// Class definition for Calculator\nclass Calculator {\n    // Method to\
    \ add two numbers\n    int add(int a, int b) {\n        return a + b;\n    }\n\
    \n    // Method to subtract two numbers\n    int subtract(int a, int b) {\n  \
    \      return a - b;\n    }\n}\n// Sum: 15\n// Difference: 12\n```\n\nIn this\
    \ example, we have a Main class that contains the main method. This method creates\
    \ an object of the Calculator class, calls its add and subtract methods, and prints\
    \ the results to the console.\n\nThe Calculator class, defined below Main, encapsulates\
    \ the functionality for addition and subtraction. The add and subtract methods\
    \ perform the respective operations.\n\n# 5. Inheritance and Polymorphism\n\n\
    Inheritance and polymorphism are essential concepts in object-oriented programming,\
    \ including Java.\n\nInheritance allows a class (subclass or derived class) to\
    \ inherit properties and behaviors from another class (superclass or base class).\
    \ This promotes code reusability and the creation of a hierarchical class structure.\n\
    \nFor example:\n\n```java\n// Superclass\nclass Animal {\n  void makeSound() {\n\
    \    System.out.println(\"Some sound\");\n  }\n}\n```\n\n```java\n// Subclass\
    \ inheriting from Animal\nclass Dog extends Animal {\n  void makeSound() {\n \
    \   System.out.println(\"Woof!\");\n  }\n}\n```\n\nIn this example, the Dog class\
    \ inherits from the Animal class. It can access the makeSound method from the\
    \ Animal class and override it with its own implementation.\n\nPolymorphism, which\
    \ means \"many forms,\" allows objects of different classes to be treated as objects\
    \ of a common superclass. This is often achieved through method overriding and\
    \ method overloading.\n\nFor example:\n\n```java\n// Superclass\nclass Shape {\n\
    \    void draw() {\n        System.out.println(\"Drawing a shape\");\n    }\n\
    }\n\n// Subclasses overriding the draw method\nclass Circle extends Shape {\n\
    \    void draw() {\n        System.out.println(\"Drawing a circle\");\n    }\n\
    }\n\nclass Square extends Shape {\n    void draw() {\n        System.out.println(\"\
    Drawing a square\");\n    }\n}\n```\n\nIn this case, both Circle and Square classes\
    \ extend the Shape class and override its draw method with their own specific\
    \ implementations.\n\nPolymorphism also includes method overloading, where multiple\
    \ methods have the same name but different parameters within the same class.\n\
    \n```java\nclass Calculator {\n    int add(int a, int b) {\n        return a +\
    \ b;\n    }\n    double add(double a, double b) {\n        return a + b;\n   \
    \ }\n}\n```\n\nHere, the add method is overloaded to accept both integer and double\
    \ parameters.\n\nThese examples demonstrate how inheritance and polymorphism work\
    \ in Java, allowing for code reuse and the ability for objects to be treated as\
    \ instances of their superclass.\n\n# 6. Interfaces and Abstract Classes\n\nInterfaces\
    \ and abstract classes are fundamental concepts in object-oriented programming,\
    \ often used in Java to achieve abstraction, standardize the structure of classes,\
    \ and support multiple inheritances.\n\n**Interfaces:** An interface defines a\
    \ contract for a group of classes to adhere to. It contains method signatures\
    \ but no method bodies, essentially declaring what should be implemented without\
    \ specifying how. In Java, a class can implement one or multiple interfaces.\n\
    \nFor example:\n\n```java\n// Interface\ninterface Animal {\n    void sound();\n\
    \    void move();\n}\n\n// Class implementing the Animal interface\nclass Dog\
    \ implements Animal {\n    public void sound() {\n        System.out.println(\"\
    Woof!\");\n    }\n\n    public void move() {\n        System.out.println(\"Running\
    \ on four legs\");\n    }\n}\n```\n\nIn this example, the Animal interface declares\
    \ the sound and move methods, and the Dog class implements these according to\
    \ its specific behavior.\n\n**Abstract Classes:** An abstract class is a class\
    \ that cannot be instantiated itself and can contain both normal methods and abstract\
    \ methods (methods without a body) that must be implemented by subclasses. In\
    \ Java, a class can only extend one abstract class.\n\nFor example:\n\n```java\n\
    // Abstract class\nabstract class Shape {\n\n    abstract void draw();\n\n   \
    \ void display() {\n        System.out.println(\"Displaying shape\");\n    }\n\
    }\n\n// Concrete class extending the Shape class\nclass Circle extends Shape {\n\
    \n    void draw() {\n        System.out.println(\"Drawing a circle\");\n    }\n\
    }\n```\n\nIn this example, the Shape class is abstract and contains an abstract\
    \ draw method that must be implemented by its subclass. It also has a concrete\
    \ method, display, that is inherited by the subclass.\n\nInterfaces and abstract\
    \ classes are both crucial for achieving abstraction and defining common behavior\
    \ and are essential components of Java's object-oriented programming.\n\n# 7.\
    \ Exception Handling (try, catch, finally)\n\nException handling is a crucial\
    \ aspect of writing robust and error-tolerant code. It involves using try, catch,\
    \ and finally blocks to manage and handle exceptions. Let's explore these concepts\
    \ with an example:\n\n**try Block:** The try block encloses the code that might\
    \ throw an exception. In this case, we're trying to get user input and perform\
    \ a division operation:\n\n```java\ntry {\n    // Code that may cause an exception\n\
    \    System.out.println(\"Enter a number: \");\n    int number = scanner.nextInt();\n\
    \n    // Division by zero to trigger an exception\n    int result = 10 / number;\n\
    \n    // This line won't be executed if an exception occurs\n    System.out.println(\"\
    Result: \" + result);\n}\n```\n\nIn this block:\n\n- We prompt the user to enter\
    \ a number using scanner.nextInt()\n- We attempt a division operation (10 / number),\
    \ which may result in an ArithmeticException if the user enters 0.\n"
