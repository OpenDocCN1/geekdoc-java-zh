    \ = scanner.nextInt();\n\n    // 除以零以触发异常\n    int result = 10 / number;\n\n \
    \   // 如果发生异常，此行将不会执行\n    System.out.println(\"Result: \" + result);\n}\n```\n\
    \n在这个块中中：\n\n- 我们使用 `scanner.nextInt()` 提示用户输入数字。\n- 我们尝试除法操作 (10 / number)，如果用户输入\
    \ 0，可能会触发 `ArithmeticException`。\n\n"
