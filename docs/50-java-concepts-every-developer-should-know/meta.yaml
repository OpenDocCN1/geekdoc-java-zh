    \ HTTP 请求、处理业务逻辑并产生 HTML 或其他类型的响应。Servlets 是 Java EE（企业版）平台的一部分，现在被称为 Jakarta\
    \ EE。\n\n### 核心概念：\n\n- Servlet 生命周期：Servlets 经历一个包含初始化、处理请求和销毁的周期。关键方法包括 `init()`、`service()`\
    \ 和 `destroy()`。\n\n- 处理请求：Servlets 接收并处理来自客户端（通常是浏览器）的请求。它们从请求中提取信息（参数、头部）并生成响应。\n\
    \n- 生成响应：Servlets 通过与数据库、执行业务逻辑或利用其他资源动态生成响应（通常是 HTML）。\n\n- URL 映射：使用部署描述符 (web.xml)\
    \ 或注解 (@WebServlet) 将 Servlets 映射到特定的 URL。这定义了哪个 servlet 处理特定 URL 模式的请求。\n\n###\
    \ 示例 Servlet：\n\n```java\nimport java.io.IOException;\nimport javax.servlet.ServletException;\n\
    import javax.servlet.annotation.WebServlet;\nimport javax.servlet.http.HttpServlet;\n\
    import javax.servlet.http.HttpServletRequest;\nimport javax.servlet.http.HttpServletResponse;\n\
    \n@WebServlet(\"/hello\")\npublic class HelloServlet extends HttpServlet {\n \
    \   protected void doGet(HttpServletRequest request, HttpServletResponse response)\n\
    \        throws ServletException, IOException {\n        response.getWriter().println(\"\
    Hello, Servlet!\");\n    }\n}\n```\n\n### 服务页面 (JSP)：JSP 是一种通过允许将 Java 代码直接嵌入\
    \ HTML 页面中来简化 Web 应用程序开发的术。JSP 页面在运行时由 servlet 容器编译为 servlet。\n\n### 核心概念：\n\n\
    - Java 与 HTML混合：JSP 允许开发者在 HTML 页面中嵌入 Java 代码，从而轻松创建动态内容。Java 代码封装在 `<% %> %>`\
    \ 标签中。\n\n### 隐式对象：\n\nJSP 提供了一组隐式对象（例如 request、response、session），代表 HTTP 请求和响应的各个方面。\n\
    \n- 标签库：JSP 使用自定义标签库，例如 JSTL（JavaServer Pages 标准标签库），来封装常用功能并简化页面开发。\n\n### 表达式语言\
    \ (EL)：\n\nEL 允许在 JSP 页面中轻松检索和操作数据。它简化了将动态数据嵌入 HTML 的。\n\n### 示例 JSP：\n\n```jsp\n\
    <%@ page language=\"java\" contentType=\"text/html; charset=UTF-8\">\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n  <meta charset=\"UTF-8\">\n  <title>My JSP Page</title>\n\
    </head>\n<body>\n  <h2>Hello, <%= request.getParameter(\"name\") %>!</h2>\n</body>\n\
    </html>\n```\n\nServlets 和 JSP 协同工作：Servlets 和 JSP 经常在 Web 应用程序中共同工作。Servlets\
    \ 处理业务逻辑、处理请求并将控制分发到 JSP 页面以生成 HTML 内容。这种关注点分离遵循模型-视图-控制器 (MVC) 架构。\n\n### Servlet\
    \ 分发到 JSP：\n\n```java\n@WebServlet(\"/greet\")\npublic class GreetingServlet extends\
    \ HttpServlet {\n    protected void doGet(HttpServletRequest request, HttpServletResponse\
    \ response)\n        throws ServletException, IOException {\n        // 执行业务逻辑\n\
    \        String username = request.getParameter(\"name\");\n\n        // 在请求属性中设置数据\n\
    \        request.setAttribute(\"username\", username);\n\n        // 分发到 JSP 进行渲染\n\
    \        RequestDispatcher dispatcher = request.getRequestDispatcher(\"/greet.jsp\"\
    );\n        dispatcher.forward(request, response);\n    }\n}\n```\n\n在上面的示例中，servlet\
    \ 处理请求，在请求属性中设置数据，并将控制分发到 JSP 进行渲染。\n\nServlets 和 JSP 成了 Java Web 开发的核心，提供了构建动态\
    \ 应用程序的方法。现代 Java Web 开发已转向使用 Spring MVC 等框架，但理解 Servlets 和 JSP 的基础至关重要。\n\n##\
    \ 27. RESTful API 处理 (JAX-RS)\n\nJava RESTful Web Services (JAX-RS) 是一组简化 Java\
    \ RESTful Web 服务开发的 API。它是 Java EE（企业版）平台的一部分，现在被称为 Jakarta EE。JAX-RS 提供了用于映射\
    \ Java 方法到 HTTP 方法、处理请求和响应格式的注解。\n\n### JAX-RS 核心概念：\n\n- 资源类：JAX-RS 中的资源类是使用\
    \ @Path 注解的 Java 类，用于定义托管资源的 URI 路径。\n\n```java\nimport javax.ws.rs.GET;\nimport\
    \ javax.ws.rs.Path;\n\n@Path(\"/hello\")\npublic class HelloResource {\n    @GET\n\
    \    public String sayHello() {\n        return \"Hello, JAX-RS!\";\n    }\n}\n\
    ```\n\n- HTTP 方法：JAX-RS 使用 @GET、@POST、@PUT 和 @DELETE 注解将 Java 方法映射到相应的 HTTP 方法。\n\
    \n- 路径参数：路径参数从 URI 模板中提取，并使用 @Path 注解注入到资源方法参数。\n\n```java\n@GET\n@Path(\"/{name}\"\
    )\npublic String greet(@PathParam(\"name\") String name) {\n    return \"Hello,\
    \ \" + name + \"!\";\n}\n```\n\n- 请求和响应处理：JAX-RS 提供了 @PathParam、@QueryParams 和\
    \ @Produces 等注解来处理请求参数和响应格式。\n\n```java\n@GET\n@Path(\"/greet\")\n@Produces(\"\
    text/plain\")\npublic String greet(@QueryParams(\"name\") String name) {\n   \
    \ return \"Hello, \" + name + \"!\";\n}\n```\n\n- 异常处理：JAX-RS 通过异常映射器（exception\
    \ mappers）实现异常处理。可以创建自定义的异常映射器来处理特定异常并产生适当的响应。\n\n```java\n@Provider\npublic class\
    \ CustomExceptionMapper implements ExceptionMapper<CustomException> {\n    public\
    \ Response toResponse(CustomException ex) {\n        return Response.status(Response.Status.BAD_REQUEST);\n\
    \    }\n}\n```\n\n"
