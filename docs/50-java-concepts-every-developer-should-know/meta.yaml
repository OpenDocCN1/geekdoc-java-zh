    \        System.out.println(\"Sum: \" + sum);\n        System.out.println(\"Difference:\
    \ \" + difference);\n    }\n}\n\n// Calculator 的类定义\nclass Calculator {\n    //\
    \ 加两个数字的方法\n    int add(int a, int b) {\n        return a + b;\n    }\n\n    //\
    \ 减去两个数字的方法\n    int subtract(int a, int b) {\n        return a - b;\n    }\n\
    }\n// Sum: 15\n// Difference: 12\n```\n\n在这个示例中，我们有一个包含 `main` 方法的 `Main` 类。该方法创建\
    \ `Calculator` 类的对象，调用它的 `add` 和 `subtract` 方法，并将结果打印到控制台。\n\n定义在 `Main` 下方的 `Calculator`\
    \ 类封装了加减法的功能。`add` 和 `subtract` 方法执行相应的操作。\n\n# 5. 继承和多态\n\n继承和多态是面向对象编程（包括 Java）的核心概念。\n\
    \n继承允许类（子类或派生类）从另一个类（父类或基类）继承属性和行为。这促进了代码的可重用和层次化类结构的创建。\n\n例如：\n\n```java\n//\
    \ 父类\nclass Animal {\n  void makeSound() {\n    System.out.println(\"Some sound\"\
    );\n  }\n}\n```\n\n```java\n// 继承 Animal 的子类\nclass Dog extends Animal {\n  void\
    \ makeSound() {\n    System.out.println(\"Woof!\");\n  }\n}\n```\n\n在这个示例中，`Dog`\
    \ 类继承自 `Animal` 类。它可以访问 `Animal` 类的 `makeSound` 方法，并用自己的实现对其进行重写。\n\n多态的意思是“多种形式”，允许不同类的对象被视为同一个公共父类的对象。这通常通过方法重写和方法重载来实现。\n\
    \n例如：\n\n```java\n// 父类\nclass Shape {\n    void draw() {\n        System.out.println(\"\
    Drawing a shape\");\n    }\n}\n\n// 重写 draw 方法的子类\nclass Circle extends Shape\
    \ {\n    void draw() {\n        System.out.println(\"Drawing a circle\");\n  \
    \  }\n}\n\nclass Square extends Shape {\n    void draw() {\n        System.out.println(\"\
    Drawing a square\");\n    }\n}\n```\n\n在这种情况下，`Circle` 和 `Square` 类都扩展了 `Shape`\
    \ 类，并用各自特定的实现重写了 `draw` 方法。\n\n多态还包括方法重载，即在同一个类中多个方法具有相同名称但不同的参数。\n\n```java\n\
    class Calculator {\n    int add(int a, int b) {\n        return a + b;\n    }\n\
    \    double add(double a, double b) {\n        return a + b;\n    }\n}\n```\n\n\
    在这里，`add` 方法被重载以接受整数和双精度数字参数。\n\n这些示例演示了继承和多态在 Java 中如何工作，允许代码复用，并允许对象被视为其父类的实例。\n\
    \n# 6. 接口和抽象类\n\n接口和抽象类是面向对象编程的基础概念，在 Java 中通常用于实现抽象、标准化类结构并支持多继承。\n\n**接口 (Interfaces)**：接口定义了一组类必须遵守的合约。它包含方法签名但没有方法体，本质上是声明了应该实现什么，而不指定如何实现。在\
    \ Java 中，一个类可以实现一个或多个接口。\n\n例如：\n\n```java\n// 接口\ninterface Animal {\n    void\
    \ sound();\n    void move();\n}\n\n// 实现 Animal 接口的类\nclass Dog implements Animal\
    \ {\n    public void sound() {\n        System.out.println(\"Woof!\");\n    }\n\
    \n    public void move() {\n        System.out.println(\"Running on four legs\"\
    );\n    }\n}\n```\n\n在这个示例中，`Animal` 接口声明了 `sound` 和 `move` 方法，`Dog` 类根据具体情况实现了这些方法。\n\
    \n**抽象类 (Abstract Classes)**：抽象类是一种无法实例化的类，它可以包含普通方法和抽象方法（没有体的方法），后者必须由子类实现。在\
    \ Java 中，一个类只能扩展一个抽象类。\n\n例如：\n\n```java\n// 抽象类\nabstract class Shape {\n\n \
    \   abstract void draw();\n\n    void display() {\n        System.out.println(\"\
    Displaying shape\");\n    }\n}\n\n// 扩展 Shape 类的具体类\nclass Circle extends Shape\
    \ {\n\n    void draw() {\n        System.out.println(\"Drawing a circle\");\n\
    \    }\n}\n```\n\n在这个示例中，`Shape` 类是抽象的，包含一个必须由子类实现的抽象 `draw` 方法，还有一个被子类继承的具体方法\
    \ `display`。\n\n接口和抽象类对于实现抽象和定义共同行为至关重要，都是 Java 面向对象编程的重要组成部分。\n\n7. 异常处理 (try,\
    \ catch, finally)\n\n异常处理是编写健壮且容错代码的关键方面。它涉及使用 `try`、`catch` 和 `finally` 块来管理和处理异常。让我们通过示例来探索这些概念：\n\
    \n**try 块**：`try` 块封装可能抛出异常的代码。在这种情况下，我们尝试获取用户输入并执行除法操作：\n\n```java\ntry {\n \
