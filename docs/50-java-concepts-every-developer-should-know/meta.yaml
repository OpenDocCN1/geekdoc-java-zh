    \      .sessionFixation().migrateSession()\n      .maximumSessions(1)\n      .expiredUrl(\"\
    /login?expired\")\n    .and();\n}\n```\n\n## OAuth 2.0:\n\nOAuth 2.0 Support:\
    \ Spring Security supports OAuth 2.0 for securing APIs and enabling single sign-on.\n\
    \n```java\n@Override\nprotected void configure(HttpSecurity http) throws Exception\
