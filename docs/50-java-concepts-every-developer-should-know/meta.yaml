    TUESDAY,

    WEDNESDAY,

    THURSDAY,

    FRIDAY,

    SATURDAY,

    }

    ```


    Reference types require more memory and involve indirection through references.
    Operations on reference types may involve method calls or accessing fields.


    Key Differences:


