  md: '# 30. Event Handling and Listeners


    Event handling is a crucial aspect of GUI programming, allowing applications to
    respond to user interactions and external stimuli. In Java, event handling is
    typically done through the use of listeners, which are objects that "listen" for
    specific events and execute designated code when those events occur.


    Event Handling in Java:


    Event Sources: Components that generate events are called event sources. Examples
    include buttons, text fields, and mouse clicks.


    Event Objects: When an event occurs, an event object is created to encapsulate
    information about that event, such as its type and any relevant details.


    Event Listeners: Event listeners are objects that "listen" for specific types
    of events and provide methods to handle those events.


    Common Types of Events: ActionEvent: Triggered by user actions, such as button
    clicks.


    MouseEvent: Generated by mouse actions, like clicks, movements, and scrolls.


    KeyEvent: Captures keyboard input events.


    WindowEvent: Deals with events related to window operations.


    Example: ActionListener for Button Clicks (Swing):


    ```

    import javax.swing.JButton;

    ```'
