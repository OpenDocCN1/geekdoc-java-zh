  md: "# # 38. Dependency Injection in Spring\n\nDependency Injection (DI) is a fundamental\
    \ concept in the Spring Framework that promotes loose coupling and modularization\
    \ of code. In Spring, DI is achieved through the Inversion of Control (IoC) container,\
    \ which manages the creation and injection of dependencies into beans.\n\nLet's\
    \ explore Dependency Injection in Spring:\n\n+   1. Understanding Dependencies:\
    \ In a software application, dependencies are objects that a class needs to perform\
    \ its functions. Instead of creating the dependencies within the class, Spring\
    \ promotes the injection of these dependencies from external sources.\n\n+   2.\
    \ Types of Dependency Injection in Spring: Spring supports two main types of Dependency\
    \ Injection:\n\nConstructor Injection: Dependencies are injected through the constructor\
    \ of the class.\n\n```\npublic class MyClass {\n    private MyDependency myDependency;\n\
    \n    // Constructor Injection\n    public MyClass(MyDependency myDependency)\
    \ {\n        this.myDependency = myDependency;\n    }\n\n    // Class methods\
    \ using myDependency\n}\n```"
  merge: -1
  pgno: 158
- img_proc: true
  md: "Setter Injection: Dependencies are injected through setter methods.\n\n```\n\
    public class MyClass {\n    private MyDependency myDependency;\n\n    // Setter\
    \ Injection\n    public void setMyDependency(MyDependency myDependency) {\n  \
    \      this.myDependency = myDependency;\n    }\n\n    // Class methods using\
    \ myDependency\n}\n```\n\nUsing Annotations for Dependency Injection: Spring provides\
    \ annotations to simplify dependency injection.\n\n@Autowired: Automatically injects\
    \ dependencies into the class, either through the constructor, a setter method,\
    \ or a field.\n\n```\npublic class MyClass {\n    private MyDependency myDependency;\n\
    \n    // Constructor Injection\n    @Autowired\n    public MyClass(MyDependency\
    \ myDependency) {\n        this.myDependency = myDependency;\n    }\n```"
