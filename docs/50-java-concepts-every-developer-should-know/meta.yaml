    }\n```\n\nCSRF 保护: Spring Security 通过在表单中包含 CSRF 令牌帮助防止跨站请求伪造 (CSRF 攻击。\n\n```java\n\
    @Override\nprotected void configure(HttpSecurity http) throws Exception {\n  http\n\
    \    .csrf()\n      .csrfTokenRepository(new CookieCsrfTokenRepository().withHttpOnly(false))\n\
    \    .and()\n    .authorizeRequests()\n    .and()\n    .formLogin()\n      .loginPage(\"\
