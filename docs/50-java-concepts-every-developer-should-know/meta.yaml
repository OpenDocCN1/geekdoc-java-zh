    \ 路径以及请求/响应格式。它遵循 REST 框架原则，促进了可扩展和易维护的 API 创建。\n\n## 28. 数据持久化框架 (JPA, Hibernate)\n\
    \nJava Persistence API (JPA) 和 Hibernate 是 Java 生态系统中广泛使用的数据持久化框架。JPA 是用于对象关系映射的标准\
    \ Java API，而 Hibernate 是 JPA 规范的一种流行实现。这些框架简化了数据库交互，并提供了将 Java 对象映射到数据库表的方便方法。\n\
    \nJava Persistence API (JPA)：JPA 是在 Java 应用程序中管理关系数据的 Java 规范。它定义了一套注解和 API 用于将\
    \ Java 对象映射到数据库表、执行 CRUD 操作以及管理对象关系。\n\nJPA 核心概念：\n\n- 实体类 (Entity Classes)：JPA\
    \ 中的实体是一个轻量级的持久化领域对象。它通常是一个带有 @Entity 注解的 Java 类。\n\n```java\nimport javax.persistence.Entity;\n\
    import javax.persistence.Id;\n\n@Entity\npublic class Product {\n    @Id\n   \
    \ private Long id;\n    private String name;\n    private double price;\n\n  \
    \  // Getters and setters\n}\n```\n\n- 实体管理器 (EntityManager)：EntityManager 是执行\
    \ CRUD 操作的核心接口。它负责管理实体的生命周期。\n\n```java\nEntityManagerFactory emf = Persistence.createEntityManagerFactory(\"\
    myPersistenceUnit\");\nEntityManager em = emf.createEntityManager();\n\n// 持久化实体\n\
    em.getTransaction().begin();\nem.persist(new Product(1L, \"Laptop\", 1200.0));\n\
    em.getTransaction().commit();\n`````````\n\n- **JPQL (Java 持久查询语言)：** JPQL 是用于\
    \ JPA 的查询语言，类似于 SQL。它在实体及其字段上操作。\n\n```java\nTypedQuery<Product> query = em.createQuery(\"\
    SELECT p FROM Product p WHERE p.price > 1000.0\", Product.class);\nList<Product>\
    \ expensiveProducts = query.getResultList();\n```\n\n- 关联与关系 (Associations and\
    \ Relationships)：JPA 支持定义实体之间的关系，例如一对一、一对多和多对多。\n\n```java\n@Entity\npublic class\
    \ Order {\n  @Id\n  private Long id;\n\n  @OneToMany\n  private List<Product>\
    \ products;\n}\n```\n\n> * Hibernate 是一个开源的对象关系映射 (ORM) 框架，它实现了 JPA 规范。它简化了数据库交互，并提供了标准\
    \ JPA 规范之外的额外。\n\n## Hibernate 的核心特性：\n\n- 自动表生成：Hibernate 可以根据实体类自动生成数据库表，减少了手动创建表的需求。\n\
    \n- 缓存：Hibernate 提供了缓存机制，通过在内存中存储频繁访问的数据来提高性能。\n\n- 懒加载 (Lazy Loading)：Hibernate\
    \ 支持懒加载，仅在显式访问关联数据时才加载它。\n\n- Criteria 查询 (Criteria Queries)：Hibernate 提供了 Criteria\
    \ API，用于 Java 代码构建类型安全的查询。\n\n```java\nCriteriaBuilder builder = session.getCriteriaBuilder();\n\
    CriteriaQuery<Product> criteria = builder.createQuery(Product.class);\nRoot<Product>\
    \ root = criteria.from(Product.class);\ncriteria.select(root).where(builder.gt(root.get(\"\
    price\"), 1000.0));\nList<Product> expensiveProducts = session.createQuery(criteria).getResultList();\n\
    ```\n\n- 二级缓存：除了一级缓存（session 缓存）外，Hibernate 还支持可以在多个 session 之间共享二级缓存。\n\n使用 Hibernate\
    \ 配置 JPA：\n\n```java\nimport javax.persistence.EntityManagerFactory;\nimport javax.persistence.Persistence;\n\
    \npublic class JpaExample {\n    public static void main(String[] args) {\n  \
    \      EntityManagerFactory emf = Persistence.createEntityManagerFactory(\"myPersistenceUnit\"\
    );\n        // 如 JPA 节所述使用 EntityManager\n        // ...\n\n        emf.close();\
    \ // 完成后关闭 EntityManagerFactory\n    }\n}\n```\n\n在这个示例中，\"myPersistenceUnit\"\
    \ 指向 persistence.xml 文件定义的持久化单元。\n\nJPA 和 Hibernate 为 Java 开发人员提供了强大的工具，能够方便且面向对象的方式与关系数据库交互。虽然\
    \ JPA 是一个规范，但 Hibernate 是一个扩展了额外功能的广泛实现。在 JPA 和 Hibernate 之间的选择通常取决于项目需求和偏好。\n\
    \n## 29. GUI 创建与处理 (Swing, JavaFX)\n\nSwing 和 JavaFX 是 Java 应用程序中创建图形用户界面 (GUI)\
    \ 的两个流行框架。它们提供了丰富的组件、事件和布局，用于构建交互式且视觉上吸引人的桌面应用程序。\n\nSwing：Swing 是 Java 基础类 (JFC)\
    \ 组成部分的 GUI 工具包。多年来，它一直是 Java 应用程序的标准 GUI 工具包。\n\nSwing 的核心特性：\n\n- 轻量级组件：Swing\
    \ 组件是轻量级的，这意味着它们不依赖于原生平台的 GUI 组件。这导致了在不同平台之间一致的行为。\n\n- 丰富的组件集：Swing 提供了一套完整的\
    \ GUI 组件，包括按钮、标签、文本框、表格等。\n\n```java\nimport javax.swing.*;\nimport java.awt.*;\n\
    \npublic class SwingExample {\n    public static void main(String[] args) {\n\
    \        JFrame frame = new JFrame(\"Swing Example\");\n        JButton button\
    \ = new JButton(\"Click me\");\n\n        frame.getContentPane().add(button);\n\
    \        frame.setSize(300, 200);\n        frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \        frame.setVisible(true);\n    }\n}\n```\n\n 事件处理：Swing 支持事件驱动编程，事件处理通常通过监听器实现。\n\
    \n```java\nbutton.addActionListener(e -> {\n  System.out.println(\"Button clicked!\"\
    );\n});\n```\n\n 布局管理器：布局管理器有助于在容器内安排组件。Swing 提供了各种布局管理器来控制组件的位置和大小。\n\n```java\n\
    import.setLayout.Flow\n```\n\nJavaFX：JavaFX 是一种为了取代 Swing 而引入的现代 Java GUI 框架。它提供了丰富的特性和更现代的架构。\n\
    \nJavaFX 的核心特性：\n\n用于 UI 设计的 FXML：JavaFX 允许开发者使用 FXML（一种基于 XML 的标记语言）设计 UI。这使得\
    \ UI 设计与应用程序逻辑分离。\n\n```xml\n<VBox xmlns=\"http://javafx.com/javafx\"\n      xmlns:fx=\"\
    http://javafx.com/fxml\"\n      fx:controller=\"sample.Controller\">\n    <Button\
    \ text=\"Click me\" onAction=\"#handleButtonClick\"/>\n</VBox>\n```\n\nScene Builder：JavaFX\
    \ 与 Scene Builder 集成，允许开发者通过拖拽组件来设计 UI。\n\nCSS 样式：JavaFX 支持使用 CSS 样式，为自定义组件外观提供了灵活的方法。\n\
    \n```css\n.button {\n  -fx-background-color: #3498db;\n  -fx-text-fill: white;\n\
    }\n```\n\n并发 API：JavaFX 包含一个强大的并发 API，简化了处理后台任务而不阻塞 UI 的。\n\n```java\nPlatform.runLater(()\
    \ -> {\n  // UI 更新\n});\n```\n\n3D 图形：JavaFX 支持 3D 图形，适用于需要高级图形能力的应用程序。\n\n```java\n\
    import javafx.scene.shape.Box;\n```\n\n在 Swing 和 JavaFX 之间进行选择：在两者之间的选择取决于应用程序需求、开发环境和个人偏好。由于其现代特性和持续支持，通常建议在新项目中使用\
    \ JavaFX。\n\nSwing 和 JavaFX 都是 Java 应用程序的强大 GUI 框架，各都有其优势和用场景。虽然 Swing 多年来一直是标准，但\
    \ JavaFX 提供了一个更现代、功能丰富的替代方案。\n\n"
