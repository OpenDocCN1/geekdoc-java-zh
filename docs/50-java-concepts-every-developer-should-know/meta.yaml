    # 43. Design Patterns in Java


    Design patterns are reusable solutions to common problems encountered in software
    design. They provide a template or guideline for solving recurring design problems
    and promote code that is more modular, flexible, and maintainable. Here are some
    classic design patterns often used in Java development:


    Creational Patterns:


    Singleton Pattern: Ensures that a class has only one instance and provides a global
    point of access to it.


    Factory Method Pattern: Defines an interface for creating an object but lets subclasses
    alter the type of objects that will be created.


    Abstract Factory Pattern: Provides an interface for creating families of related
    or dependent objects without specifying their concrete classes.


    Builder Pattern: Separates the construction of a complex object from its representation,
    allowing the same construction process to create various representations.


    Prototype Pattern: Creates new objects by copying an existing object, known as
    the prototype.


    Structural Patterns:


    Adapter Pattern: Allows the interface of an existing class to be used as another
    interface.


    Bridge Pattern: Separates an abstraction from its implementation so that the two
    can vary independently.'
- md: "\nComposite Pattern: Composes objects into tree structures to represent part-whole\
    \ hierarchies. Clients can treat individual objects and compositions of objects\
    \ uniformly.\n\nDecorator Pattern: Attaches additional responsibilities to an\
    \ object dynamically. Decorators provide a flexible alternative to subclassing\
    \ for extending functionality.\n\nFacade Pattern: Provides a unified interface\
    \ to a set of interfaces in a subsystem. Facade defines a higher-level interface\
    \ that makes the subsystem easier to use.\n\nFlyweight Pattern: Minimizes memory\
    \ usage or computational expenses by sharing as much as possible with related\
    \ objects; it is a way to use objects in large numbers when a simple repeated\
    \ representation would use an unacceptable amount of memory.\n\n# Behavioral Patterns:\n\
    \n- Chain of Responsibility Pattern: Passes requests along a chain of handlers.\
    \ Upon receiving a request, each handler decides either to process the request\
    \ or pass it to the next handler in the chain.\n\n- Command Pattern: Encapsulates\
    \ a request as an object, thereby allowing for parameterization of clients with\
    \ different requests, queuing of requests, and logging of the requests.\n\n- Interpreter\
    \ Pattern: Defines a grammar for interpreting the sentences in a language and\
    \ provides an interpreter to interpret the sentences.\n\n- Iterator Pattern: Provides\
    \ a way to access elements of an aggregate object sequentially without exposing\
    \ its underlying representation.\n\n- Mediator Pattern: Defines an object that\
    \ centralizes communication between a set of objects. Objects no longer communicate\
    \ directly with each other but instead communicate through the mediator.\n\n-\
    \ Memento Pattern: Captures and externalizes an object's internal state so that\
    \ the object can be restored to this state later.\n\n- Observer Pattern: Defines\
    \ a one-to-many dependency between objects, so that when one object changes state,\
    \ all its dependents are notified and updated automatically.\n\n- State Pattern:\
    \ Allows an object to alter its behavior when its internal state changes. The\
    \ object will appear to change its class.\n\n- Strategy Pattern: Defines a family\
    \ of algorithms, encapsulates each algorithm, and makes the algorithms interchangeable.\
    \ Strategy lets the algorithm vary independently from clients that use it.\n\n\
    - Template Method Pattern: Defines the skeleton of an algorithm in the superclass\
    \ but lets subclasses override specific steps of the algorithm without changing\
    \ its structure.\n\n- Visitor Pattern: Represents an operation to be performed\
    \ on the elements of an object structure. Visitor lets you define a new operation\
    \ without changing the classes of the elements on which it operates.\n\nThese\
    \ design patterns provide solutions to common software design problems and promote\
    \ best practices in software development. While using design patterns, it's essential\
    \ to consider the specific context and requirements of your application to choose\
    \ the most appropriate pattern. Additionally, Java provides built-in support for\
    \ many design patterns through its core libraries and frameworks.\n\n# 44 .XML\
    \ and JSON Handling\n\n### DOM (Document Object Model):\nParsing XML: Java provides\
    \ the javax.xml.parsers package for parsing XML using the DOM approach.\n\nExample:\n\
    \n```\nDocumentBuilderFactory factory = DocumentBuilderFactory.newInstance();\n\
    DocumentBuilder builder = factory.newDocumentBuilder();\nDocument document = builder.parse(new\
    \ File(\"example.xml\"));\n```\n\nWorking with XML Document: Once parsed, you\
    \ can traverse, modify, and manipulate the XML document using DOM APIs.\n\n```\n\
    Element root = document.getDocumentElement();\nNodeList nodeList = root.getElementsByTagName(\"\
    elementName\");\n```\n\n### SAX (Simple API for XML): Event-Based Parsing: SAX\
    \ is an event-driven approach where the parser notifies the application of XML\
    \ elements as it encounters them.\n\nExample:\n\n```\nSAXParserFactory factory\
    \ = SAXParserFactory.newInstance();\nSAXParser saxParser = factory.newSAXParser();\n\
    saxParser.parse(new File(\"example.xml\"), new MyHandler());\n```\n\nImplementing\
    \ SAX Handler: You need to implement the org.xml.sax.helpers.DefaultHandler class\
    \ and override methods to handle events.\n\n```java\npublic class MyHandler extends\
    \ DefaultHandler {\n    // Override methods to handle events\n}\n```\n\n### JAXB\
    \ (Java Architecture for XML Binding):\n\nMarshalling and Unmarshalling: JAXB\
    \ allows you to convert Java objects to XML (marshalling) and XML to Java objects\
    \ (unmarshalling).\n\nExample:\n\n```\nJAXBContext context = JAXBContext.newInstance(MyClass.class);\n\
    Marshaller marshall = context.createMarshaller();\nMyClass object = new MyClass();\n\
    marshaller.marshal(object, new File(\"example.xml\"));\n```\n\n```\nUnmarshaller\
    \ unmarshaller = context.createUnmarshaller();\nMyClass object = (MyClass) unmarshaller.unmarshal(new\
    \ File(\"example.xml\"));\n```\n\n### JSON Handling in Java:\n\nObject Mapping:\
    \ Jackson is a popular library for JSON processing in Java. It provides methods\
    \ to convert Java objects to JSON and vice versa.\n\nExample:\n\n```\nObjectMapper\
    \ objectMapper = new ObjectMapper();\nMyClass object = new MyClass();\nobjectMapper.writeValue(new\
    \ File(\"example.json\"), object);\n```\n\n```\nMyClass object = objectMapper.readValue(new\
    \ File(\"example.json\"), MyClass.class);\n```\n\n### Gson Library: Google's JSON\
    \ Library: Gson is another library for JSON processing provided by Google. It\
    \ allows serialization and deserialization of Java objects.\n\nExample:\n\n```\n\
    Gson gson = new Gson();\nMyClass object = new MyClass();\ntry (Writer writer =\
    \ new FileWriter(\"example.json\")) {\n  gson.toJson(object, writer);\n}\n```\n\
    \n```\nMyClass object = gson.fromJson(new FileReader(\"example.json\"), MyClass.class);\n\
    ```\n\n### JSON-P (JSON Processing API): Standard API: JSON-P is a standard API\
    \ for JSON processing introduced in Java EE 7.\n\nExample:\n\n```\nJsonReader\
    \ reader = Json.createReader(new FileReader(\"example.json\"));\nJsonObject jsonObject\
    \ = reader.readObject();\nJsonWriter writer = Json.createWriter(new FileWriter(\"\
    example.json\"));\nwriter.writeObject(jsonObject);\n```\n\nHandling XML and JSON\
    \ in Java involves various APIs and libraries, each with its advantages and use\
    \ cases. The choice of approach depends on factors such as ease of use, performance,\
    \ and the specific requirements of your application.\n\n# 45. Web Services Creation\
    \ and Consumption (SOAP)\n\nCreating and consuming web services using SOAP (Simple\
    \ Object Protocol) involves defining a set of standards for structuring messages\
    \ that can be exchanged between applications over a network. In Java, this can\
    \ be achieved using Java API for XML Web Services (JAX-WS).\n\nBelow are the steps\
    \ for creating and consuming SOAP web services in Java:\n\n### Creating a SOAP\
    \ Web Service:\n\nDefine a Java Class: Create a Java class that will be exposed\
    \ as a web service. Add methods that you want to expose.\n\n```java\n@WebService\n\
    public class MyWebService {\n    @WebMethod\n    public String sayHello(String\
    \ name) {\n        return \"Hello, \" + name + \"!\";\n    }\n}\n```\n\nPublish\
    \ the Web Service: Use the Endpoint class to publish your web service. This makes\
    \ it accessible via a specific URL.\n\n```java\npublic class WebServicePublisher\
    \ {\n    public static void main(String[] args) {\n        String url = \"http://localhost:8080/mywebservice\"\
    ;\n        Endpoint.publish(url, new MyWebService());\n        System.out.println(\"\
    Web service published at: \" + url);\n    }\n}\n```\n\n### Consuming a SOAP Web\
    \ Service:\n\nGenerate Client Code: Use the wsimport tool to generate client code\
    \ from the WSDL.\n\n```\nwsimport -s . http://localhost:8080/mywebservice?wsdl\n\
    ```\n\nCreate a Java Client: Use the generated client code to consume the web\
    \ service.\n\n```java\npublic class WebServiceClient {\n    public static void\
    \ main(String[] args) {\n        MyWebService service = new MyWebService().getMyWebServicePort();\n\
    \        String response = service.sayHello(\"John\");\n        System.out.println(\"\
    Response from server: \" + response);\n    }\n}\n```\n\nRun the Client: Compile\
    \ and run the client application.\n\n```\njavac WebServiceClient.java\n```\n"
  mdcn: "\n\n组合模式（Composite Pattern）：将对象组合成树形结构以表示部分整体的层次结构。客户端可以用统一的方式对待单个对象和对象的组合。\n\
    \n装饰器模式（Decorator Pattern）：动态地为对象添加额外的责任。装饰器为通过子类扩展功能提供了灵活的替代方案。\n\n外观模式（Facade\
    \ Pattern）：为子系统中的一组接口提供统一的接口。外观定义了一个更高层次的接口，使得子系统更容易使用。\n\n轻量级模式（Flyweight Pattern）：通过与相关对象尽可能地共享来尽量地减少内存使用或计算开销；当简单的重复表示将使用不可接受的内存时，这是大量使用对象的方法。\n\
    \n# 行为模式（Behavioral Patterns）：\n\n- 责任链模式（Chain of Responsibility Pattern）：沿着处理程序链传递请求。接收到请求时，每个处理程序决定处理请求还是将其传递给链中的下一个处理程序。\n\
    \n- 命令模式（Command Pattern）：将请求封装为对象，从而允许客户端对不同的请求进行参数化、队列化和日志记录。\n\n- 解释器模式（Interpreter\
    \ Pattern）：定义用于解释语言中句子的语法，并提供一个解释器来解释这些句子。\n\n- 迭代器模式（Iterator Pattern）：提供顺序访问聚合对象元素的方法，而不暴露其底层表示。\n\
    \n- 中介者模式（Mediator Pattern）：定义一个对象以集中一组对象之间的通信。对象之间不再直接相互通信，而是通过中介者进行通信。\n\n-\
    \ 备忘模式（Memento Pattern）：捕获并外部化对象的内部状态，以便稍后将其恢复到该状态。\n\n- 观察者模式（Observer Pattern）：定义对象之间的一对多的依赖关系，当一个对象的状态改变时，所有它的依赖者都会收到通知并自动更新。\n\
    \n- 状态模式（State Pattern）：允许对象在内部状态改变时改变其行为。该对象看起来改变了它的类。\n\n- 策略模式（Strategy Pattern）：定义一系列算法，封装每个算法并使它们可互换。策略允许算法独立于使用它的客户端发生变化。\n\
    \n- 模板方法模式（Template Method Pattern）：在父类中定义算法的骨架，但允许子类覆盖算法的特定步骤而不改变其结构。\n\n- 访问者模式（Visitor\
    \ Pattern）：表示在对象结构元素上执行的操作。访问者允许你在不改变所操作的元素类体系的情况下定义新操作。\n\n这些设计模式为常见的软件设计问题提供了解决方案，并促进了软件开发的最佳实践。在使用设计模式时，必须考虑应用程序的特定上下文和需求以选择最合适的模式。此外，Java\
    \ 通过其核心库和框架对许多设计模式提供了内置支持。\n\n# 44 .XML 和 JSON 处理\n\n### DOM（文档对象模型）：\n解析 XML：Java\
    \ 提供了 `javax.xml.parsers` 包来使用 DOM 方法解析 XML。\n\n示例：\n\n```\nDocumentBuilderFactory\
    \ factory = DocumentBuilderFactory.newInstance();\nDocumentBuilder builder = factory.newDocumentBuilder();\n\
    Document document = builder.parse(new File(\"example.xml\"));\n```\n\n与 XML 文档交互：解析后，你可以使用\
    \ DOM API 遍历、修改和操作 XML 文档。\n\n```\nElement root = document.getDocumentElement();\n\
    NodeList nodeList = root.getElementsByTagName(\"elementName\");\n```\n\n### SAX（XML\
    \ Simple API）：基于事件解析：SAX 是一种事件驱动的方法，解析器在遇到 XML 元素时会通知应用程序。\n\n示例：\n\n```\nSAXParserFactory\
    \ factory = SAXParserFactory.newInstance();\nSAXParser saxParser = factory.newSAXParser();\n\
    saxParser.parse(new File(\"example.xml\"), new MyHandler());\n```\n\n实现 SAX 处理器：你需要实现\
    \ `org.xml.sax.helpers.DefaultHandler` 类并重写方法以处理事件。\n\n```java\npublic class MyHandler\
    \ extends DefaultHandler {\n    // 重写方法以处理事件\n}\n```\n\n### JAXB（Java XML 绑定架构）：\n\
    \n序列（Marshalling）与反序列化（Unmarshalling）：JAXB 允许你将 Java 对象转换为 XML（序列）以及将 XML 转换为\
    \ Java 对象（反序列化）。\n\n示例：\n\n```\nJAXBContext context = JAXBContext.newInstance(MyClass.class);\n\
    Marshaller marshall = context.createMarshaller();\nMyClass object = new MyClass();\n\
    marshaller.marshal(object, new File(\"example.xml\"));\n```\n\n```\nUnmarshaller\
    \ unmarshaller = context.createUnmarshaller();\nMyClass object = (MyClass) unmarshaller.unmarshal(new\
    \ File(\"example.xml\"));\n```\n\n### Java 中的 JSON 处理：\n\n对象映射：Jackson 是 Java\
    \ 中处理 JSON 的流行库。它提供了将 Java 对象转换为 JSON 以及反之转换的方法。\n\n示例：\n\n```\nObjectMapper objectMapper\
    \ = new ObjectMapper();\nMyClass object = new MyClass();\nobjectMapper.writeValue(new\
    \ File(\"example.json\"), object);\n```\n\n```\nMyClass object = objectMapper.readValue(new\
    \ File(\"example.json\"), MyClass.class);\n```\n\n### Gson 库：Google 的 JSON 库：Gson\
    \ 是 Google 提供的另一个 JSON 处理库。它允许 Java 序列化和反序列化。\n\n示例：\n\n```\nGson gson = new Gson();\n\
    MyClass object = new MyClass();\ntry (Writer writer = new FileWriter(\"example.json\"\
    )) {\n  gson.toJson(object, writer);\n}\n```\n\n```\nMyClass object = gson.fromJson(new\
    \ FileReader(\"example.json\"), MyClass.class);\n```\n\n### JSON-P（JSON 处理 API）：标准\
    \ API：JSON-P 是 Java EE 7 引入的 JSON 处理标准 API。\n\n示例：\n\n```\nJsonReader reader =\
    \ Json.createReader(new FileReader(\"example.json\"));\nJsonObject jsonObject\
    \ = reader.readObject();\nJsonWriter writer = Json.createWriter(new FileWriter(\"\
    example.json\"));\nwriter.writeObject(jsonObject);\n```\n\n在 Java 中处理 XML 和 JSON\
    \ 涉及各种 API 和库，每个库都有其优势和用例。方法的选择取决于易用性、性能和应用程序特定需求等因素。\n\n# 45. Web 服务的创建与消费 (SOAP)\n\
    \n使用 SOAP（简单对象访问协议）创建和消费 Web 服务涉及定义一套标准，用于结构化可以在网络上在应用程序之间交换的消息。在 Java 中，可以使用\
    \ Java XML Web 服务 API（JAX-WS）来实现。\n\n以下是在 Java 中创建和消费 SOAP Web 服务的步骤：\n\n### 创建\
    \ SOAP Web 服务：\n\n定义 Java 类：创建一个将作为 Web 服务暴露的 Java 类。添加你想要暴露的方法。\n\n```java\n\
    @WebService\npublic class MyWebService {\n    @WebMethod\n    public String sayHello(String\
    \ name) {\n        return \"Hello, \" + name + \"!\";\n    }\n}\n```\n\n发布 Web\
    \ 服务：使用 `Endpoint` 类发布你的 Web 服务。这使得可以通过特定的 URL 访问。\n\n```java\npublic class WebServicePublisher\
    \ {\n    public static void main(String[] args) {\n        String url = \"http://localhost:8080/mywebservice\"\
    ;\n        Endpoint.publish(url, new MyWebService());\n        System.out.println(\"\
    Web service published at: \" + url);\n    }\n}\n```\n\n### 消费 SOAP Web 服务：\n\n\
    生成客户端代码：使用 `wsimport` 工具从 WSDL 生成客户端代码。\n\n```\nwsimport -s . http://localhost:8080/mywebservice?wsdl\n\
    ```\n\n创建 Java 客户端：使用生成的客户端代码来消费 Web 服务。\n\n```java\npublic class WebServiceClient\
    \ {\n    public static void main(String[] args) {\n        MyWebService service\
    \ = new MyWebService().getMyWebServicePort();\n        String response = service.sayHello(\"\
    John\");\n        System.out.println(\"Response from server: \" + response);\n\
    \    }\n}\n```\n\n运行客户端：编译并运行客户端应用程序。\n\n```\njavac WebServiceClient.java\n```\n"
