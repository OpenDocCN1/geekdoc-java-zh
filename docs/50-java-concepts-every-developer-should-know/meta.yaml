  mdcn: "\n\n# 布尔类型：\n\nboolean: 表示真（true）或假（false）值。\n\n基本类型存储实际的值，对它们进行的操作通常比引用类型更快。\n\
    \n基本类型的示例：\n\n```\nint age = 25;\ndouble salary = 55000.50;\nchar grade = 'A';\n\
    boolean isActive = true;\n```\n\n引用类型：引用类型表示 Java 中的对象，比基本类型更复杂。它们包括类、接口、数组和枚举。引用类型持有指向实际对象的引用（内存地址），这些对象被分配在堆（heap）上。\n\
    \nJava 中常见的引用类型：\n\n- 类和对象：使用 `new` 关键字创建的类实例。\n\n```\nString text = new String(\"\
    Hello, Java!\");\n```\n\n- 数组：相同类型元素的集合。\n\n```java\nint[] numbers = {1, 2, 3,\
    \ 4, 5};\n```\n\n- 接口：用于定义抽象类型并实现抽象。\n\n```java\nList<String> names = new ArrayList<>();\n\
    ```\n\n- 枚举：用于定义一组常量的特殊类型。\n\n```java\nenum Day {\n    SUNDAY,\n    MONDAY,\n\
    \    TUESDAY,\n    WEDNESDAY,\n    THURSDAY,\n    FRIDAY,\n    SATURDAY,\n}\n\
    ```\n\n引用类型需要更多内存，并涉及通过引用的间接访问。对引用类型的操作可能涉及方法调用或字段访问。\n\n主要差异：\n\n存储：\n- 基本类型存储实际的值。\n\
    - 引用类型存储内存中对象的引用。\n\n内存位置：\n- 基本类型存储在栈上。\n- 引用类型（对象）存储在堆上，它们的引用存储在栈上。\n\n默认值：\n\
    - 基本类型有默认值（例如，数值类型为 0，布尔类型为 false）。\n- 引用类型的默认值为 null。\n\n操作：\n- 对基本类型的操作通常更快。\n\
    - 对引用类型的操作涉及间接访问，并可能包含方法调用。\n\n理解基本类型和引用类型之间的差异对于编写高效的 Java 程序至关重要。开发者需要根据数据的需求和特征选择合适的类型。\n\
    \n# 21. 注解与反射\n\n注解是添加到 Java 代码中的一种元数据形式，用于向编译器、工具或运行时传递有关代码的信息。注解以 `@` 符号开头，可以附加到各种程序元素上，如类、方法、字段等。Java\
    \ 提供了内置注解，开发者也可以创建自定义注解。\n\n内置注解：\n\n- @Override：表示子类中的方法旨在重写父类中的方法。\n\n```java\n\
    @Override\npublic void myWeb() {\n    // 重写方法\n}\n```\n\n- @Deprecated：将程序元素标记为已弃用，建议不再再使用它。\n\
    \n```java\n@Deprecated\npublic void oldMethod() {\n    // 旧方法实现\n}\n```\n\n- @SuppressWarnings：抑制特定的编译器警告。\n\
    \n```java\n@SuppressWarnings(\"unchecked\")\npublic void myWeb() {\n    // 抑制未检查的警告\n\
    }\n```\n\n自定义注解：\n```java\nimport java.lang.annotation.*;\n\n@Retention(RetentionPolicy.RUNTIME)\n\
    @Target(ElementType.METHOD)\npublic @interface MyAnnotation {\n    String value()\
    \ default \"Default Value\";\n\n    int count() default 1;\n}\n```\n\n- @Retention：指定注解的保留时间，例如：在源码解析期间、编译期间或运行时。\n\
    - @Target：指定注解可以应用的位置，例如：方法、字段或类。\n\nJava 反射：反射是 Java 的一种特性，允许你在运行时动态地检查和交互类、方法、字段以及程序的其他组件。`java.lang.reflect`\
    \ 包提供了反射所需的类和接口。\n\n示例：\n\n```java\nimport java.lang.reflect.Method;\n\npublic\
    \ class ReflectionExample {\n    public static void main(String[] args) throws\
    \ NoSuchMethodException {\n      MyClass obj = new MyClass();\n\n      // 获取对象的类\n\
    \      Class<?> myClass = obj.getClass();\n\n      // 获取类的声明方法\n      Method[]\
    \ methods = myClass.getDeclaredMethods();\n\n      // 打印方法名\n      for (Method\
    \ method : methods) {\n        System.out.println(\"Method Name: \" + method.getName());\n\
    \      }\n\n      // 动态调用方法\n      try {\n        Method myMethod = myClass.getDeclaredMethod(\"\
    myMethod\");\n        myMethod.invoke(obj);\n      } catch (Exception e) {\n \
    \       e.printStackTrace();\n      }\n    }\n}\n\nclass MyClass {\n    public\
    \ void myMethod() {\n        System.out.println(\"Hello from myMethod!\");\n \
    \   }\n}\n```\n\n在这个示例中，反射被用于检查 `MyClass` 的方法并在运行时动态调用 `myMethod`。\n\n虽然反射非常强大，但由于其对性能和类型安全的潜在影响，应该谨慎使用。它通常用于框架、库和测试工具等场景。\n\
    \n# 22. 文件和目录处理 (java.nio)\n\n与旧的 `java.io` 包相比，Java 的 `java.nio` 包为文件和目录处理提供了更现代、灵活的\
    \ API。它包含了 `Path`、`Paths` 和 `Files` 类用于操作文件系统。让我们使用 `java.nio` 探索一些基础的文件和目录操作。\n\
    \n创建文件：\n\n```java\nimport java.io.IOException;\nimport java.nio.file.Files;\n\
    import java.nio.file.Path;\nimport java.nio.file.Paths;\n\npublic class FileHandlingExample\
    \ {\n    public static void main(String[] args) throws IOException {\n       \
    \ // 定义文件路径\n        Path filePath = Paths.get(\"example.txt\");\n        // 创建文件\n\
    \        Files.createFile(filePath);\n        System.out.println(\"文件已创建：\" +\
    \ filePath);\n    }\n}\n```\n\n写入文件：\n\n```java\nimport java.io.IOException;\n\
    import java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\n\
    import java.util.List;\n\npublic class FileHandlingExample {\n    public static\
    \ void main(String[] args) throws IOException {\n        // 定义文件路径\n        Path\
    \ filePath = Paths.get(\"example.txt\");\n        // 写入内容\n        String content\
    \ = \"Hello NIO\";\n        Files.write(filePath, content.getBytes());\n     \
    \   System.out.println(\"内容已写入文件\");\n    }\n}\n```\n\n读取文件：\n\n```java\nimport\
    \ java.io.IOException;\nimport java.nio.file.Files;\nimport java.nio.file.Path;\n\
    import java.nio.file.Paths;\nimport java.util.List;\n\npublic class FileHandlingExample\
    \ {\n    public static void main(String[] args) throws IOException {\n       \
    \ // 定义文件路径\n        Path filePath = Paths.get(\"example.txt\");\n        // 从文件中读取内容\n\
    \        List<String> lines = Files.readAllLines(filePath);\n        System.out.println(\"\
    读取的内容：\" + lines);\n    }\n}\n```\n\n创建目录：\n\n```java\nimport java.io.IOException;\n\
    import java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\n\
    \npublic class DirectoryHandlingExample {\n    public static void main(String[]\
    \ args) throws IOException {\n        // 定义目录路径\n        Path directoryPath =\
    \ Paths.get(\"myDirectory\");\n        // 创建目录\n        Files.createDirectory(directoryPath);\n\
    \        System.out.println(\"目录已创建：\" + directoryPath);\n    }\n}\n```\n\n列出目录中的文件：\n\
    \n```java\nimport java.io.IOException;\nimport java.nio.file.DirectoryStream;\n\
    import java.nio.file.Files;\nimport java.nio.file.Path;\nimport java.nio.file.Paths;\n\
    \npublic class DirectoryHandlingExample {\n    public static void main(String[]\
    \ args) {\n        // 定义目录路径\n        Path directoryPath = Paths.get(\"myDirectory\"\
    );\n        // 列出目录中的文件\n        try (DirectoryStream<Path> stream = Files.newDirectoryStream(directoryPath))\
    \ {\n            System.out.println(\"目录中的文件：\");\n            for (Path file\
    \ : stream) {\n                System.out.println(file.getFileName());\n     \
    \       }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n"
