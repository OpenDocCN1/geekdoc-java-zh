    \ 4. Java 中的方法和类：\n\n在 Java 中，方法和类是基础构建模块，有助于代码的组织、可重用性和可维护性。方法是执行特定任务的代码块，而类是创建对象的蓝图。\n\
    \n让我们来看一个简单的例子：\n\n```java\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        // 创建一个 Calculator 类的对象\n        Calculator myCalculator =\
    \ new Calculator();\n\n        // 调用 Calculator 类的方法\n        int sum = myCalculator.add(10,\
