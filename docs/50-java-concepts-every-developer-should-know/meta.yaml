- md: "\nThese examples cover basic file and directory operations using the java.nio\
    \ package. The Path interface provides a platform-independent representation of\
    \ file paths, and the Files class contains static utility methods for common file\
    \ operations.\n\n## 23. Networking and Communication\n\nJava provides extensive\
    \ libraries for networking and communication, allowing developers to create client-server\
    \ applications, work with sockets, and handle network protocols. Let's explore\
    \ some basic concepts and examples in Java networking.\n\n### Server-Side Socket:\n\
    \n```java\nimport java.io.IOException;\nimport java.net.ServerSocket;\nimport\
    \ java.net.Socket;\n\npublic class ServerExample {\n\n    public static void main(String[]\
    \ args) {\n        int portNumber = 8080;\n\n        try (ServerSocket serverSocket\
    \ = new ServerSocket(portNumber)) {\n            System.out.println(\"Server listening\
    \ on port \" + portNumber);\n\n            while (true) {\n                //\
    \ Accept incoming client connections\n                Socket clientSocket = serverSocket.accept();\n\
    \                System.out.println(\"Client connected: \" + clientSocket.getInetAddress());\n\
    \n                // Handle client communication in a separate thread\n      \
    \          new Thread(new ClientHandler(clientSocket)).start();\n            }\n\
    \        } catch (IOException e) {\n            e.printStackTrace();\n       \
    \ }\n    }\n}\n```\n\n### Client-Side Socket:\n\n```java\nimport java.io.BufferedReader;\n\
    import java.io.IOException;\nimport java.io.InputStreamReader;\nimport java.io.PrintWriter;\n\
    import java.net.Socket;\n\npublic class ClientExample {\n\n    public static void\
    \ main(String[] args) {\n        String serverAddress = \"localhost\";\n     \
    \   int portNumber = 8080;\n\n        try (\n            Socket socket = new Socket(serverAddress,\
    \ portNumber);\n            PrintWriter out = new PrintWriter(socket.getOutputStream(),\
    \ true);\n            BufferedReader in = new BufferedReader(\n              \
    \  new InputStreamReader(socket.getInputStream()))\n        ) {\n            //\
    \ Send a message to the server\n            out.println(\"Hello, Server!\");\n\
    \n            // Receive the server's response\n            String response =\
    \ in.readLine();\n            System.out.println(\"Server response: \" + response);\n\
    \        } catch (IOException e) {\n            e.printStackTrace();\n       \
    \ }\n    }\n}\n```\n\n### Handling Client Communication in a Separate Thread:\n\
    \n```java\nimport java.io.BufferedReader;\nimport java.io.IOException;\nimport\
    \ java.io.InputStreamReader;\nimport java.io.PrintWriter;\nimport java.net.Socket;\n\
    \npublic class ClientHandler implements Runnable {\n\n    private final Socket\
    \ clientSocket;\n\n    public ClientHandler(Socket clientSocket) {\n        this.clientSocket\
    \ = clientSocket;\n    }\n\n    @Override\n    public void run() {\n        try\
    \ (\n            PrintWriter out = new PrintWriter(clientSocket.getOutputStream(),\
    \ true);\n            BufferedReader in = new BufferedReader(\n              \
    \  new InputStreamReader(clientSocket.getInputStream()))\n        ) {\n      \
    \      // Receive message from the client\n            String clientMessage =\
    \ in.readLine();\n            System.out.println(\"Received from client: \" +\
    \ clientMessage);\n\n            // Send a response back to the client\n     \
    \       out.println(\"Message received!\");\n        } catch (IOException e) {\n\
    \            e.printStackTrace();\n        }\n    }\n}\n```\n\nThese examples\
    \ demonstrate a simple client-server communication using sockets in Java. The\
    \ server listens on a specific port, and when a client connects, it creates a\
    \ new thread to handle the communication with that client. The client connects\
    \ to the server, sends a message, and receives a response.\n\nJava's networking\
    \ capabilities extend beyond basic sockets to include features for working with\
    \ protocols such as HTTP, creating web services, and more.\n\n## 24. Functional\
    \ Programming with Java 8 (Lambda Expressions, Streams)\n\nJava 8 introduced significant\
    \ features for functional programming, including lambda expressions and streams.\
    \ These features enhance code readability, conciseness, and support functional\
    \ programming paradigms.\n\n### Lambda Expressions:\n\nLambda expressions enable\
    \ the concise representation of anonymous functions (functional interfaces) in\
    \ Java. They provide a clear and expressive way to represent behavior as data.\n\
    \nHere's a simple example:\n\n```java\n// Traditional approach without lambda\n\
    Runnable runnable1 = new Runnable() {\n    @Override\n    public void run() {\n\
    \        System.out.println(\"Hello, world!\");\n    }\n};\n\n// Using lambda\
    \ expression\nRunnable runnable2 = () -> System.out.println(\"Hello, world!\"\
    );\n\n// Running the runnables\nrunnable1.run();\nrunnable2.run();\n```\n\nLambda\
    \ expressions are particularly useful when working with functional interfaces\
    \ (interfaces with a single abstract method). For example, the Comparator interface:\n\
    \n```java\nList<String> names = Arrays.asList(\"Alice\", \"Bob\", \"Charlie\"\
    , \"David\");\n\n// Sorting using anonymous class\nCollections.sort(names, new\
    \ Comparator<String>() {\n  @Override\n  public int compare(String s1, String\
    \ s2) {\n    return s1.length() - s2.length();\n  }\n});\n\n// Sorting using lambda\
    \ expression\nCollections.sort(names, (s1, s2) -> s1.length() - s2.length());\n\
    ```\n\n### Streams: Streams provide a powerful and declarative way to process\
    \ collections of data in a functional style. Streams enable you to express complex\
    \ data manipulations using a sequence of high-level operations. Here's an example\
    \ of using streams to filter, map, and collect data:\n\n```java\nList<String>\
    \ words = Arrays.asList(\"apple\", \"banana\", \"orange\", \"grape\", \"watermelon\"\
    );\n\n// Using stream to filter, map, and collect\nList<String> result = words.stream()\n\
    \    .filter(s -> s.length() > 5)\n    .map(String::toUpperCase)\n    .collect(Collectors.toList());\n\
    \nSystem.out.println(result); // Output: [ORANGE, WATERMELON]\n```\n\nStreams\
    \ support parallel processing, which can lead to significant performance improvements\
    \ when working with large datasets.\n\n### Functional Interfaces:\n\nJava 8 introduced\
    \ functional interfaces, which are interfaces with a single abstract method. Examples\
    \ include Runnable, Comparator, and many others. Functional interfaces are the\
    \ foundation for lambda expressions.\n\n```java\n@FunctionalInterface\ninterface\
    \ MyFunction {\n    void myMethod();\n}\n\n// Using a lambda expression to implement\
    \ MyFunction\nMyFunction myFunction = () -> System.out.println(\"Hello, functional!\"\
    );\n\nmyFunction.myMethod();\n```\n\nJava 8's features for functional programming—lambda\
    \ expressions and streams—have transformed the way developers write code in Java.\
    \ They provide concise syntax, enable better abstraction, and improve the expressiveness\
    \ of the language. As a result, Java has become more competitive in the functional\
    \ programming space.\n\n## 25. JDBC and Database Handling\n\nJDBC is a Java API\
    \ that provides a standard interface for connecting to relational databases and\
    \ executing SQL queries. It enables Java applications to interact with databases,\
    \ perform CRUD (Create, Read, Update, Delete) operations, and manage database\
    \ transactions.\n\n### Basic Steps in JDBC:\n\n- Load the JDBC Driver: JDBC drivers\
    \ are platform-specific implementations that enable Java applications to communicate\
    \ with a particular database. Load the appropriate driver using Class.forName().\n\
    \n```java\nClass.forName(\"com.mysql.cj.jdbc.Driver\");\n```\n\n- Establish a\
    \ Connection: Use DriverManager.getConnection() to establish a connection to the\
    \ database.\n\n```java\nString url = \"jdbc:mysql://localhost:3306/mydatabase\"\
    ;\nString username = \"user\";\nString password = \"password\";\nConnection connection\
    \ = DriverManager.getConnection(url, username, password);\n```\n\n- Create a Statement:\
    \ Create a Statement or PreparedStatement object for executing SQL queries.\n\n\
    ```java\nStatement statement = connection.createStatement();\n```\n\n- Execute\
    \ SQL Queries: Use the executeQuery() method to execute SELECT queries.\n\n```java\n\
    ResultSet resultSet = statement.executeQuery(\"SELECT * FROM employees\");\n```\n\
    \nUse executeUpdate() for INSERT, UPDATE, DELETE queries.\n\n```java\nint rowsAffected\
    \ = statement.executeUpdate(\"INSERT INTO employees (name, age) VALUES ('John\
    \ Doe', 30)\");\n```\n\n- Process the Results: Process the ResultSet to retrieve\
    \ data from SELECT queries.\n\n```java\nwhile (resultSet.next()) {\n    String\
    \ name = resultSet.getString(\"name\");\n    int age = resultSet.getInt(\"age\"\
    );\n    System.out.println(\"Name: \" + name + \", Age: \" + age);\n}\n```\n\n\
    - Close Resources: Close the ResultSet, Statement, and Connection to release resources.\n\
    \n```java\nresultSet.close();\nstatement.close();\nconnection.close();\n```\n\n\
    Example of JDBC:\n\n```java\nimport java.sql.Connection;\nimport java.sql.DriverManager;\n\
    import java.sql.ResultSet;\n```\n"
  mdcn: "\n\n这些示例涵盖了使用 `java.nio` 包进行的基础文件和目录操作。`Path` 接口提供了文件路径的平台无关表示，而 `Files`\
    \ 类则包含了用于常用文件操作的静态工具方法。\n\n## 23. 网络与通信\n\nJava 为网络和通信提供了丰富的库，允许开发者创建客户端-服务器应用程序、处理套接字（sockets）以及网络协议。让我们探索\
    \ Java 网络中的一些基本概念和示例。\n\n### 服务端 Socket：\n\n```java\nimport java.io.IOException;\n\
    import java.net.ServerSocket;\nimport java.net.Socket;\n\npublic class ServerExample\
    \ {\n\n    public static void main(String[] args) {\n        int portNumber =\
    \ 8080;\n\n        try (ServerSocket serverSocket = new ServerSocket(portNumber))\
    \ {\n            System.out.println(\"Server listening on port \" + portNumber);\n\
    \n            while (true) {\n                // 接收传入的客户端连接\n                Socket\
    \ clientSocket = serverSocket.accept();\n                System.out.println(\"\
    Client connected: \" + clientSocket.getInetAddress());\n\n                // 在单独线程中处理客户端通信\n\
    \                new Thread(new ClientHandler(clientSocket)).start();\n      \
    \      }\n        } catch (IOException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\n### 客户端 Socket：\n\n```java\nimport java.io.BufferedReader;\n\
    import java.io.IOException;\nimport java.io.InputStreamReader;\nimport java.io.PrintWriter;\n\
    import java.net.Socket;\n\npublic class ClientExample {\n\n    public static void\
    \ main(String[] args) {\n        String serverAddress = \"localhost\";\n     \
    \   int portNumber = 8080;\n\n        try (\n            Socket socket = new Socket(serverAddress,\
    \ portNumber);\n            PrintWriter out = new PrintWriter(socket.getOutputStream(),\
    \ true);\n            BufferedReader in = new BufferedReader(\n              \
    \  new InputStreamReader(socket.getInputStream()))\n        ) {\n            //\
    \ 向服务器发送消息\n            out.println(\"Hello, Server!\");\n\n            // 接收服务器的响应\n\
    \            String response = in.readLine();\n            System.out.println(\"\
    Server response: \" + response);\n        } catch (IOException e) {\n        \
    \    e.printStackTrace();\n        }\n    }\n}\n```\n\n### 在单独线程中处理客户端通信：\n\n\
    ```java\nimport java.io.BufferedReader;\nimport java.io.IOException;\nimport java.io.InputStreamReader;\n\
    import java.io.PrintWriter;\nimport java.net.Socket;\n\npublic class ClientHandler\
    \ implements Runnable {\n\n    private final Socket clientSocket;\n\n    public\
    \ ClientHandler(Socket clientSocket) {\n        this.clientSocket = clientSocket;\n\
    \    }\n\n    @Override\n    public void run() {\n        try (\n            PrintWriter\
    \ out = new PrintWriter(clientSocket.getOutputStream(), true);\n            BufferedReader\
    \ in = new BufferedReader(\n                new InputStreamReader(clientSocket.getInputStream()))\n\
    \        ) {\n            // 从客户端接收消息\n            String clientMessage = in.readLine();\n\
    \            System.out.println(\"Received from client: \" + clientMessage);\n\
    \n            // 向客户端发送响应\n            out.println(\"Message received!\");\n \
    \       } catch (IOException e) {\n            e.printStackTrace();\n        }\n\
    \    }\n}\n```\n\n这些示例演示了使用 Java 套接字进行简单的客户端-服务器通信。服务器监听特定端口，当客户端连接时，它会创建一个新线程来处理与该客户端的通信。客户端连接到服务器，发送消息并接收响应。\n\
    \nJava 的网络能力不仅限于基础套接字，还包含了处理 HTTP 等协议、创建 Web 服务等功能。\n\n## 24. Java 8 中的函数式编程（Lambda\
    \ 表达式、流）\n\nJava 8 引入了函数式编程的重要特性，包括 Lambda 表达式和流（Streams）。这些特性增强了代码的可读性和简洁性，并支持函数式编程范式。\n\
    \n### Lambda 表达式：\n\nLambda 表达式使得简洁的代码成为可能。它们是函数式编程的基石，允许将行为作为参数传递。\n\n```java\n\
    // 使用 Lambda 表达式实现接口\nConsumer<String> consumer = (s) -> System.out.println(s);\n\
    consumer.accept(\"Hello, Lambda!\");\n```\n\n### 流（Streams）：\n\n流 API 允许对集合进行声明式的数据处理。它支持并行处理，并极大提高了处理效率。\n\
    \n```java\nList<String> list = Arrays.asList(\"apple\", \"banana\", \"cherry\"\
    , \"date\");\nlist.stream()\n    .filter(s -> s.length() > 5)\n    .map(String::toUpperCase)\n\
    \    .forEach(System.out::println);\n```\n\n### 函数式接口（Functional Interfaces）：\n\
    \nJava 8 引入了函数式接口，它们是只有一个抽象方法的接口。这为 Lambda 表达式的使用提供了类型支持。\n\n```java\n@FunctionalInterface\n\
    interface MyFunction {\n    void execute();\n}\n\n// 使用 Lambda 表达式实现函数式接口\nMyFunction\
    \ func = () -> System.out.println(\"Executing function...\");\nfunc.execute();\n\
    ```\n\n## 25. JDBC 与数据库处理\n\nJDBC（Java Database Connectivity）是一套 Java API，提供了连接数据库和执行\
    \ SQL 查询的标准接口。它允许 Java 程序与数据库交互，执行 CRUD（增删改、改）操作并管理数据库事务。\n\n### JDBC 的基本步骤：\n\
    \n- 加载 JDBC 驱动：JDBC 驱动是特定平台的实现，允许 Java 程序与特定数据库通信。使用 `Class.forName()` 加载相应的驱动。\n\
    \n```java\nClass.forName(\"com.mysql.cj.jdbc.Driver\");\n```\n\n- 建立连接：使用 `DriverManager.getConnection()`\
    \ 建立数据库连接。\n\n```java\nString url = \"jdbc:mysql://localhost:3306/mydatabase\"\
    ;\nString username = \"user\";\nString password = \"password\";\nConnection connection\
    \ = DriverManager.getConnection(url, username, password);\n```\n\n- 创建语句：创建 `Statement`\
    \ 或 `PreparedStatement` 对象以执行 SQL 查询。\n\n```java\nStatement statement = connection.createStatement();\n\
    ```\n\n- 执行 SQL 查询：使用 `executeQuery()` 方法执行 SELECT 查询。\n\n```java\nResultSet resultSet\
    \ = statement.executeQuery(\"SELECT * FROM employees\");\n```\n\n使用 `executeUpdate()`\
    \ 执行 INSERT、UPDATE、DELETE 查询。\n\n```java\nint rowsAffected = statement.executeUpdate(\"\
    INSERT INTO employees (name, age) VALUES ('John Doe', 30)\");\n```\n\n- 处理结果：处理\
    \ `ResultSet` 以从 SELECT 查询中检索数据。\n\n```java\nwhile (resultSet.next()) {\n    String\
    \ name = resultSet.getString(\"name\");\n    int age = resultSet.getInt(\"age\"\
    );\n    System.out.println(\"Name: \" + name + \", Age: \" + age);\n}\n```\n\n\
    - 关闭资源：关闭 `ResultSet`、`Statement` 和 `Connection` 以释放资源。\n\n```java\nresultSet.close();\n\
    statement.close();\nconnection.close();\n```\n\n"
