    the XML document using DOM APIs.


    ```

    Element root = document.getDocumentElement();

    NodeList nodeList = root.getElementsByTagName("elementName");

    ```


    SAX (Simple API for XML): Event-Based Parsing: SAX is an event-driven approach
    where the parser notifies the application of XML elements as it encounters them.


    Example:


    ```

    SAXParserFactory factory = SAXParserFactory.newInstance();

    SAXParser saxParser = factory.newSAXParser();

    saxParser.parse(new File("example.xml"), new MyHandler());

    ```


