    \ 26. Web Development Frameworks (Servlets, JSP)\n\nServlets and JavaServer Pages\
    \ (JSP) are fundamental components of Java-based web development. They provide\
    \ a server-side approach for creating dynamic web applications. Let's explore\
    \ Servlets and JSP, their roles, and how they work together.\n\nServlets: Servlets\
    \ are Java classes that extend the functionality of web servers to process requests\
    \ and generate dynamic responses. They handle HTTP requests, process business\
    \ logic, and produce HTML or other types of responses. Servlets are part of the\
    \ Java EE (Enterprise Edition) platform, now known as Jakarta EE.\n\n### Key Concepts:\n\
    \n- Servlet Lifecycle: Servlets go through a lifecycle involving initialization,\
    \ handling requests, and destruction. Key methods include init(), service(), and\
    \ destroy().\n\n- Handling Requests: Servlets receive and process requests from\
    \ clients (usually web browsers). They extract information from the request (parameters,\
    \ headers) and generate a response.\n\n- Generating Responses: Servlets dynamically\
    \ generate responses, typically HTML, by interacting with databases, performing\
    \ business logic, or utilizing other resources.\n\n- URL Mapping: Servlets are\
    \ mapped to specific URLs using deployment descriptors (web.xml) or annotations\
    \ (@WebServlet). This defines which servlet handles requests for a particular\
    \ URL pattern.\n\n### Example Servlet:\n\n```java\nimport java.io.IOException;\n\
    import javax.servlet.ServletException;\nimport javax.servlet.annotation.WebServlet;\n\
    import javax.servlet.http.HttpServlet;\nimport javax.servlet.http.HttpServletRequest;\n\
    import javax.servlet.http.HttpServletResponse;\n\n@WebServlet(\"/hello\")\npublic\
    \ class HelloServlet extends HttpServlet {\n    protected void doGet(HttpServletRequest\
    \ request, HttpServletResponse response)\n        throws ServletException, IOException\
    \ {\n        response.getWriter().println(\"Hello, Servlet!\");\n    }\n}\n```\n\
    \n### Server Pages (JSP): JSP is a technology that simplifies the development\
    \ of web applications by allowing the embedding of Java code directly into HTML\
    \ pages. JSP pages are compiled into servlets by the servlet container during\
    \ runtime.\n\n### Key Concepts:\n\n- Mixing Java with HTML: JSP allows developers\
    \ to embed Java code within HTML pages, making it easy to create dynamic content.\
    \ Java code is enclosed in <% %> %> tags.\n\n### Implicit Objects:\n\nJSP provides\
    \ a set of implicit objects (e.g., request, response, session) that represent\
    \ various aspects of the HTTP request and response.\n\n- Tag Libraries: JSP uses\
    \ custom tag libraries, such as JSTL (JavaServer Pages Standard Tag Library),\
    \ to encapsulate common functionalities and simplify page development.\n\n###\
    \ Expression Language (EL):\n\nEL allows the easy retrieval and manipulation of\
    \ data within JSP pages. It simplifies the embedding of dynamic data into HTML.\n\
    \n### Example JSP:\n\n```jsp\n<%@ page language=\"java\" contentType=\"text/html;\
    \ charset=UTF-8\">\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"UTF-8\"\
    >\n  <title>My JSP Page</title>\n</head>\n<body>\n  <h2>Hello, <%= request.getParameter(\"\
    name\") %>!</h2>\n</body>\n</html>\n```\n\nServlets and JSP Together: Servlets\
    \ and JSP often work together in web applications. Servlets handle business logic,\
    \ process requests, and dispatch control to JSP pages for generating HTML content.\
    \ This separation of concerns follows the Model-View-Controller (MVC) architecture.\n\
    \n### Servlet Dispatching to JSP:\n\n```java\n@WebServlet(\"/greet\")\npublic\
    \ class GreetingServlet extends HttpServlet {\n    protected void doGet(HttpServletRequest\
    \ request, HttpServletResponse response)\n        throws ServletException, IOException\
    \ {\n        // Perform business logic\n        String username = request.getParameter(\"\
    name\");\n\n        // Set data in request attribute\n        request.setAttribute(\"\
    username\", username);\n\n        // Dispatch control to JSP for rendering\n \
    \       RequestDispatcher dispatcher = request.getRequestDispatcher(\"/greet.jsp\"\
    );\n        dispatcher.forward(request, response);\n    }\n}\n```\n\nIn the above\
    \ example, the servlet processes a request, sets data in the request attribute,\
    \ and then forwards control to the JSP page for rendering.\n\nServlets and JSP\
    \ form the backbone of Java web development, providing a robust and scalable approach\
    \ for building dynamic web applications. Modern Java web development has shifted\
    \ towards using frameworks like Spring MVC, but understanding the basics of Servlets\
    \ and JSP remains essential.\n\n## 27. RESTful API Handling (JAX-RS)\n\nJava API\
    \ for RESTful Web Services (JAX-RS) is a set of APIs that simplifies the development\
    \ of RESTful web services in Java. It is part of the Java EE (Enterprise Edition)\
    \ platform, now known as Jakarta EE. JAX-RS provides annotations for mapping Java\
    \ methods to HTTP methods, handling request and response formats, and more.\n\n\
    ### Key Concepts in JAX-RS:\n\n- Resource Classes: Resource classes in JAX-RS\
    \ are Java classes annotated with @Path to define the URI path at which the resource\
    \ is hosted.\n\n```java\nimport javax.ws.rs.GET;\nimport javax.ws.rs.Path;\n\n\
    @Path(\"/hello\")\npublic class HelloResource {\n    @GET\n    public String sayHello()\
    \ {\n        return \"Hello, JAX-RS!\";\n    }\n}\n```\n\n- HTTP Methods: JAX-RS\
    \ uses annotations like @GET, @POST, @PUT, and @DELETE to map Java methods to\
    \ corresponding HTTP methods.\n\n- Path Parameters: Path parameters are extracted\
    \ from the URI template and injected into resource method parameters using the\
    \ @Path annotation.\n\n```java\n@GET\n@Path(\"/{name}\")\npublic String greet(@PathParam(\"\
    name\") String name) {\n    return \"Hello, \" + name + \"!\";\n}\n```\n\n- Request\
    \ and Response Handling: JAX-RS provides annotations like @PathParam, @QueryParams,\
    \ and @Produces for handling request parameters and response formats.\n\n```java\n\
    @GET\n@Path(\"/greet\")\n@Produces(\"text/plain\")\npublic String greet(@QueryParams(\"\
    name\") String name) {\n    return \"Hello, \" + name + \"!\";\n}\n```\n\n- Exception\
    \ Handling: Exception handling in JAX-RS is achieved using exception mappers.\
    \ Custom exception mappers can be created to handle specific exceptions and produce\
    \ appropriate responses.\n\n```java\n@Provider\npublic class CustomExceptionMapper\
    \ implements ExceptionMapper<CustomException> {\n    public Response toResponse(CustomException\
    \ ex) {\n        return Response.status(Response.Status.BAD_REQUEST);\n    }\n\
    }\n```\n"
