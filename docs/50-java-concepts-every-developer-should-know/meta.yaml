    \ FileInputStream(\"person.ser\")\n            )\n        ) { // Read the object\
    \ from the file and cast it to Person\n            Person person = (Person) ois.readObject();\n\
    \            System.out.println(\"Object has been deserialized.\");\n        \
    \    System.out.println(\"Deserialized Person: \" + person);\n        } catch\
    \ (IOException | ClassNotFoundException e) {\n            e.printStackTrace();\n\
    \        }\n    }\n}\n```\n\nIn these examples:\n\n- The Person class implements\
    \ the Serializable interface.\n- In the serialization example, a Person object\
    \ is serialized and written to a file named \"person.ser\".\n- In the deserialization\
    \ example, the object is read from the file, and the original Person object is\
    \ reconstructed.\n\nMake sure to handle exceptions appropriately in a production\
    \ environment. Also, replace the file path(\"person.ser\") with the actual path\
    \ where you want to store the serialized object.\n"
