  md: '# Boolean Type:


    boolean: Represents true or false values


    Primitive types hold the actual values, and operations on them are typically faster
    than reference types.


    Example of primitive types:


    ```

    int age = 25;

    double salary = 55000.50;

    char grade = ''A'';

    boolean isActive = true;

    ```


    Reference Types: Reference types represent objects in Java and are more complex
    than primitive types. They include classes, interfaces, arrays, and enums. Reference
    types hold references (memory addresses) to the actual objects, which are allocated
    on the heap.


    Common reference types in Java:


    Classes and Objects : Instances of classes created using the new keyword.


    ```

    String text = new String("Hello, Java!");

    ```


    Arrays: Collections of elements of the same type.


    ```

    int[] numbers = {1, 2, 3, 4, 5};

    ```


    Interfaces: Used for defining abstract types and achieving abstraction.'
