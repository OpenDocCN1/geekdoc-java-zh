    # 19. Memory Management and Garbage Collection


    Java uses automatic memory management through a process called garbage collection.
    The Java Virtual Machine (JVM) is responsible for managing memory and reclaiming
    memory occupied by objects that are no longer in use. Let''s explore how memory
    management and garbage collection work in Java:


    Object Lifecycle: Object Creation: Objects are created using the new keyword or
    other object creation mechanisms.

    MyClass obj = new MyClass();


    Object Reference: Objects are accessed through references. Multiple references
    can point to the same object.

    MyClass obj1 = new MyClass();

    MyClass obj2 = obj1; // Both obj1 and obj2 refer to the same object


    Object Dereference: When an object is no longer reachable, it becomes a candidate
    for garbage collection. References to the object are set to null or go out of
    scope.

    MyClass obj1 = new MyClass();

    obj1 = null; // Object referenced by obj1 becomes a candidate for garbage collection


    Garbage Collection: Java''s garbage collector runs in the background, identifying
    and reclaiming memory occupied by objects that are no longer reachable. The process
    involves the following steps:


    Mark: Identify objects that are still reachable from the root of the application
    (e.g., main method, threads, static variables).


    Sweep: Remove unreferenced objects and reclaim their memory.'
