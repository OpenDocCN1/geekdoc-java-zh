  mdcn: "\n\n# 企业级应用：企业级应用利用 EJBs 构建可扩展的分布式组件。这些应用通常被封装为 EAR（企业归档）文件，并部署到 Jakarta\
    \ EE 服务器上。\n\n持久化：Jakarta EE 应用通常使用 JPA 处理数据库交互。JPA 允许开发者使用 Java 对象与关系型数据库进行交互，提供了更高层次的抽象。\n\
    \n消息传递：JMS 用于构建 Jakarta EE 中的消息解决方案。它能够创建异步的、松耦合的系统，从而处理大规模的通信。\n\n安全集成：Jakarta\
