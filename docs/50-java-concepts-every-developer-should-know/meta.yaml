    \n## 11. 字符串处理与正则表达式\n\n字符串处理和正则表达式是 Java 中文本操作的重要方面。\n\n让我们通过示例来探索如何处理字符串和正则表达式：\n\
    \n字符串处理：\n\n```java\npublic class StringHandlingExample {\n    public static void\
    \ main(String[] args) {\n    // 创建字符串\n    String str1 = \"Hello\",\n    String\
    \ str2 = \"Java\";\n\n    // 拼接\n    String result = str1 + str2;\n    System.out.println(\"\
