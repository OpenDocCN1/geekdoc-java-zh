    \n正则表达式：我们使用正则表达式检查字符串是否包含特定模式，并查找文本中特定长度的单词。\n\n## 12. 包装类与自动装箱/自动拆箱\n\nJava\
    \ 中的包装类提供了一种将基本数据类型表示为对象的方法。自动装箱和自动拆箱是允许在基本类型与其对应的包装类之间自动转换的功能。让我们通过示例来探索这些概念：\n\
    \n包装类：\n\n```java\npublic class WrapperClassesExample {\n  public static void\
    \ main(String[] args) {\n    // 使用包装类处理基本数据类型\n    Integer intObj = Integer.valueOf(42);\
    \ // int 的 Integer 包装类\n    Double doubleObj = Double.valueOf(3.14); // double\
    \ 的 Double 包装类\n    Character charObj = Character.valueOf('A'); // char 的 Character\
    \ 包装类\n    Boolean boolObj = Boolean.valueOf(true); // boolean 的 Boolean 包装类\n\
