    \ is demonstrated using a simple counter example. The synchronized keyword ensures\
    \ that only one thread can execute the synchronized method at a time.\n\n## 18.\
    \ Thread Synchronization\n\nThread synchronization is essential when multiple\
    \ threads access shared resources concurrently to avoid conflicts and ensure data\
    \ consistency. Java provides several mechanisms for thread synchronization. Let's\
    \ explore the use of synchronized blocks and methods:\n\n### Synchronized Method:\n\
    \n```java\nclass Counter {\n    private int count = 0;\n\n    // Synchronized\
    \ method to ensure atomicity\n    public synchronized void increment() {\n   \
    \     count++;\n    }\n\n    public int getCount() {\n        return count;\n\
    \    }\n}\n\nclass IncrementThread extends Thread {\n    private Counter counter;\n\
    \n    public IncrementThread(Counter counter) {\n        this.counter = counter;\n\
    \    }\n\n    @Override\n    public void run() {\n        for (int i = 0; i <\
    \ 1000; i++) {\n            counter.increment();\n        }\n    }\n}\n```\n\n\
    ```java\npublic class SynchronizedMethodExample {\n    public static void main(String[]\
    \ args) throws InterruptedException {\n        Counter counter = new Counter();\n\
    \n        // Creating and running multiple threads to increment the counter\n\
    \        IncrementThread thread1 = new IncrementThread(counter);\n        IncrementThread\
    \ thread2 = new IncrementThread(counter);\n\n        thread1.start();\n      \
    \  thread2.start();\n\n        thread1.join(); // Wait for thread1 to finish\n\
    \        thread2.join(); // Wait for thread2 to finish\n\n        System.out.println(\"\
    Final Count (Synchronized Method): \" + counter.getCount());\n    }\n}\n```\n\n\
    ### Synchronized Block:\n\n```java\nclass Counter {\n  private int count = 0;\n\
    \n  public int getCount() {\n    return count;\n  }\n\n  // Synchronized block\
    \ to ensure atomicity\n  public void increment() {\n    synchronized (this) {\n\
    \      count++;\n    }\n  }\n}\n\nclass IncrementThread extends Thread {\n  private\
    \ Counter counter;\n\n  public IncrementThread(Counter counter) {\n    this.counter\
    \ = counter;\n  }\n\n  @Override\n  public void run() {\n    for (int i = 0; i\
    \ < 1000; i++) {\n      counter.increment();\n    }\n  }\n}\n\npublic class SynchronizedBlockExample\
    \ {\n\n    public static void main(String[] args) throws InterruptedException\
    \ {\n      Counter counter = new Counter();\n\n      // Creating and running multiple\
    \ threads to increment the counter\n      IncrementThread thread1 = new IncrementThread(counter);\n\
    \      IncrementThread thread2 = new IncrementThread(counter);\n\n      thread1.start();\n\
    \      thread2.start();\n\n      thread1.join(); // Wait for thread1 to finish\n\
    \      thread2.join(); // Wait for thread2 to finish\n\n      System.out.println(\n\
    \        \"Final Count (Synchronized Block): \" + counter.getCount()\n      );\n\
    \n    }\n}\n```\n\nIn both examples:\n\n- The Counter class has a shared variable\
    \ (count) that multiple threads attempt to increment.\n- The synchronized method\
    \ or block ensures that only one thread can access the critical section at a time,\
    \ preventing data corruption.\n\n## 19. Memory Management and Garbage Collection\n\
    \nJava uses automatic memory management through a process called garbage collection.\
    \ The Java Virtual Machine (JVM) is responsible for managing memory and reclaiming\
    \ memory occupied by objects that are no longer in use. Let's explore how memory\
    \ management and garbage collection work in Java:\n\n- **Object Lifecycle**:\n\
    \    - **Object Creation**: Objects are created using the new keyword or other\
    \ object creation mechanisms.\n      `MyClass obj = new MyClass();`\n    - **Object\
    \ Reference**: Objects are accessed through references. Multiple references can\
    \ point to the same object.\n      `MyClass obj1 = new MyClass();`\n      `MyClass\
    \ obj2 = obj1; // Both obj1 and obj2 refer to the same object`\n    - **Object\
    \ Dereference**: When an object is no longer reachable, it becomes a candidate\
    \ for garbage collection. References to the object are set to null or go out of\
    \ scope.\n      `MyClass obj1 = new MyClass();`\n      `obj1 = null; // Object\
    \ referenced by obj1 becomes a candidate for garbage collection`\n\n- **Garbage\
    \ Collection**: Java's garbage collector runs in the background, identifying and\
    \ reclaiming memory occupied by objects that are no longer reachable. The process\
    \ involves the following steps:\n    - **Mark**: Identify objects that are still\
    \ reachable from the root of the application (e.g., main method, threads, static\
    \ variables).\n    - **Sweep**: Remove unreferenced objects and reclaim their\
    \ memory.\n    - **Compact**: Optionally, move surviving objects to optimize memory\
    \ usage.\n\nExample:\n\n```java\nclass MyClass {\n    public static void main(String[]\
    \ args) {\n        MyClass obj1 = new MyClass();\n        MyClass obj2 = new MyClass();\n\
    \        obj1 = null; // obj1 is no longer referencing the object it\n       \
    \ // At this point, the garbage collector may identify obj1's object as unreachable\n\
    \        // and reclaim its memory in a later collection cycle.\n    }\n}\n```\n\
    \nManual Resource Management: In addition to memory management, Java developers\
    \ need to manage resources explicitly, like files or database connections. The\
    \ try-with-resources statement helps ensure that resources are closed when they\
    \ are longer needed.\n\n```java\ntry (BufferedReader reader = new BufferedReader(new\
    \ FileReader(\"example.txt\"))) {\n    // Use the BufferedReader\n} catch (IOException\
    \ e) {\n    e.printStackTrace();\n} // The reader is automatically closed when\
    \ the try block is exited.\n```\n\nUnderstanding memory management and garbage\
    \ collection is crucial for Java developers to create efficient and robust applications.\
    \ While Java's automatic memory management simplifies memory handling, developers\
    \ should still be mindful of resource management and avoid memory leaks.\n\n##\
    \ 20. Reference Types and Primitive Types\n\nIn Java, data types can be broadly\
    \ classified into two categories: primitive types and reference types. Let's explore\
    \ the differences between them:\n\n### Primitive Types: Primitive types represent\
    \ simple, single values and are the basic building blocks of data in Java. They\
    \ are predefined by the language and have reserved keywords. The primitive types\
    \ in Java are:\n\n- **Integer Types**:\n    - `byte`: 8-bit signed integer\n \
    \   - `short`: 16-bit signed integer\n    - `int`: 32-bit signed integer\n   \
    \ - `long`: 64-bit signed integer\n- **Floating-Point Types**:\n    - `float`:\
    \ 32-bit floating-point\n    - `double`: 64-bit floating-point\n- **Character\
    \ Type**:\n    - `char`: 16-bit Unicode character\n"
