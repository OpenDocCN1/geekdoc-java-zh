- md: "\n# 30. Event Handling and Listeners\n\nEvent handling is a crucial aspect\
    \ of GUI programming, allowing applications to respond to user interactions and\
    \ external stimuli. In Java, event handling is typically done through the use\
    \ of listeners, which are objects that \"listen\" for specific events and execute\
    \ designated code when those events occur.\n\n## Event Handling in Java:\n\n-\
    \ Event Sources: Components that generate events are called event sources. Examples\
    \ include buttons, text fields, and mouse clicks.\n- Event Objects: When an event\
    \ occurs, an event object is created to encapsulate information about that event,\
    \ such as its type and any relevant details.\n- Event Listeners: Event listeners\
    \ are objects that \"listen\" for specific types of events and provide methods\
    \ to handle those events.\n\n### Common Types of Events:\n\n- ActionEvent: Triggered\
    \ by user actions, such as button clicks.\n- MouseEvent: Generated by mouse actions,\
    \ like clicks, movements, and scrolls.\n- KeyEvent: Captures keyboard input events.\n\
    - WindowEvent: Deals with events related to window operations.\n\n### Example:\
    \ ActionListener for Button Clicks (Swing):\n\n```java\nimport javax.swing.JButton;\n\
    import javax.swing.JFrame;\nimport java.awt.event.ActionEvent;\nimport java.awt.event.ActionListener;\n\
    \npublic class ButtonExample {\n    public static void main(String[] args) {\n\
    \        JFrame frame = new JFrame(\"Button Example\");\n        JButton button\
    \ = new JButton(\"Click me\");\n\n        // Adding ActionListener to the button\n\
    \        button.addActionListener(new ActionListener() {\n            @Override\n\
    \            public void actionPerformed(ActionEvent e) {\n                System.out.println(\"\
    Button clicked!\");\n            }\n        });\n\n        frame.getContentPane().add(button);\n\
    \        frame.setSize(300, 200);\n        frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n\
    \        frame.setVisible(true);\n    }\n}\n```\n\nIn this example, an ActionListener\
    \ is added to the button. When the button is clicked, the actionPerformed method\
    \ is executed, printing \"Button clicked!\" to the console.\n\n## Java 8 and Lambda\
    \ Expressions: With Java 8 and later versions, you can use lambda expressions\
    \ to simplify the syntax for event handling:\n\n```java\nbutton.addActionListener(e\
    \ -> System.out.println(\"Button clicked!\"));\n```\n\nLambda expressions are\
    \ concise and provide a more readable way to define short and simple event-handling\
    \ code.\n\n## Swing and JavaFX Event Handling:\n\n- Swing (Java SE): Event handling\
    \ in Swing involves implementing listener interfaces, such as ActionListener,\
    \ MouseListener, etc. Common event sources are buttons, text fields, and other\
    \ GUI components.\n- JavaFX: JavaFX uses a similar approach with event handlers\
    \ and listeners. Event handling can be done using lambda expressions or by implementing\
    \ specific event handler interfaces.\n\nUnderstanding event handling and listeners\
    \ is essential for developing interactive and responsive GUI applications in Java.\
    \ Whether you are working with Swing or JavaFX, the principles of event handling\
    \ remain similar, and the choice often depends on the specific requirements of\
    \ your application and the GUI framework you are using.\n\n# 31. Multithreading\
    \ and Concurrent Programming\n\nMultithreading in Java allows multiple threads\
    \ of execution to run concurrently within a single program. It enables developers\
    \ to create applications that can perform multiple tasks simultaneously, improving\
    \ efficiency and responsiveness.\n\nHere are key concepts and techniques for multithreading\
    \ and concurrent programming in Java:\n\n- Thread Creation: In Java, you can create\
    \ threads by extending the Thread class or implementing the Runnable interface.\n\
    \nHere's an example using the Runnable interface:\n\n```java\nclass MyRunnable\
    \ implements Runnable {\n    public void run() {\n        // Code to be executed\
    \ in the new thread\n    }\n}\n\npublic class ThreadExample {\n    public static\
    \ void main(String[] args) {\n        Thread myThread = new Thread(new MyRunnable());\n\
    \        myThread.start();\n    }\n}\n```\n\n## Thread Lifecycle:\n\n- New: The\
    \ thread is created but not yet started.\n- Runnable: The thread is ready to run\
    \ and waiting for CPU time.\n- Blocked: The thread is waiting for a monitor lock\
    \ to enter a synchronized block/method.\n- Waiting: The thread is waiting for\
    \ another thread to perform a particular action.\n- Timed Waiting: Similar to\
    \ waiting but with a specified waiting time.\n- Terminated: The thread has exited.\n\
    \n## Synchronization: To avoid data inconsistency in a multithreaded environment,\
    \ synchronization is used. Synchronization is achieved through the use of the\
    \ synchronized keyword or using explicit locks from the java.util.concurrent package.\n\
    \n```java\nclass Counter {\n    private int count = 0;\n\n    public synchronized\
    \ void increment() {\n        count++;\n    }\n\n    public synchronized int getCount()\
    \ {\n        return count;\n    }\n}\n```\n\n## Thread Pools: Creating and managing\
    \ threads can be resource-intensive. Thread pools manage a pool of worker threads\
    \ and reuse them, reducing thread creation overhead. Java provides the ExecutorService\
    \ framework for managing thread pools.\n\n```java\nExecutorService executorsService\
    \ = Executors.newFixedThreadPool(5);\nexecutorsService.submit(new MyRunnable());\n\
    ```\n\n## Concurrency Utilities: Java provides a set of high-level concurrency\
    \ utilities in the java.util.concurrent package. Examples include ExecutorService,\
    \ Future, CountDownLatch, Semaphore, and CyclicBarrier.\n\n## Volatile Keyword:\
    \ The volatile keyword ensures that a variable's value is always read from and\
    \ written to main memory, preventing thread-specific caching of variables. It\
    \ is useful for variables accessed by multiple threads.\n\n```java\nclass SharedResource\
    \ {\n    private volatile boolean flag = false;\n\n    public void setFlag() {\n\
    \        flag = true;\n    }\n\n    public boolean getFlag() {\n        return\
    \ flag;\n    }\n}\n```\n"
  mdcn: "\n\n# 30. 事件处理与监听器\n\n事件处理是 GUI 编程中的一个关键方面，允许应用程序对用户交互和外部刺激做出响应。在 Java 中，事件处理通常通过使用监听器（listeners）来实现，监听器是“监听”特定事件并在事件发生时执行指定代码的对象。\n\
    \n## Java 中的事件处理：\n\n- 事件源（Event Sources）：产生事件的组件被称为事件源。例如按钮、文本字段和鼠标点击。\n- 事件对象（Event\
    \ Objects）：当事件发生时，会创建一个事件对象来封装该事件的信息，例如其类型和任何相关细节。\n- 事件监听器（Event Listeners）：事件监听器是“监听”特定类型事件并提供处理这些事件的方法的对象。\n\
    \n### 常见事件类型：\n\n- ActionEvent：由用户操作触发，例如按钮点击。\n- MouseEvent：由鼠标动作生成，如点击、移动和滚动。\n\
    - KeyEvent：捕获键盘输入事件。\n- WindowEvent：处理与窗口操作相关的事件。\n\n### 示例：用于按钮点击的 ActionListener\
    \ (Swing):\n\n```java\nimport javax.swing.JButton;\nimport javax.swing.JFrame;\n\
    import java.awt.event.ActionEvent;\nimport java.awt.event.ActionListener;\n\n\
    public class ButtonExample {\n    public static void main(String[] args) {\n \
    \       JFrame frame = new JFrame(\"Button Example\");\n        JButton button\
    \ = new JButton(\"Click me\");\n\n        // 向按钮上添加 ActionListener\n        button.addActionListener(new\
    \ ActionListener() {\n            @Override\n            public void actionPerformed(ActionEvent\
    \ e) {\n                System.out.println(\"Button clicked!\");\n           \
    \ }\n        });\n\n        frame.getContentPane().add(button);\n        frame.setSize(300,\
    \ 200);\n        frame.setDefaultCloseOperation(JFrame.EXIT_ON_CLOSE);\n     \
    \   frame.setVisible(true);\n    }\n}\n```\n\n在这个示例中，为按钮添加了一个 ActionListener。当按钮被点击时，会执行\
    \ `actionPerformed` 方法并在控制台打印“Button clicked!”。\n\n## Java 8 与 Lambda 表达式：使用 Java\
    \ 8 及更高版本，你可以使用 Lambda 表达式来简化事件处理的语法：\n\n```java\nbutton.addActionListener(e ->\
    \ System.out.println(\"Button clicked!\"));\n```\n\nLambda 表达式非常简洁，并为定义短简单的事件处理代码提供了一种更具读性的方式。\n\
    \n## Swing 和 JavaFX 事件处理：\n\n- Swing (Java SE)：Swing 中的事件处理涉及实现监听器接口，例如 ActionListener、MouseListener\
    \ 等。常见的事件源有按钮、文本字段和其他 GUI 组件。\n- JavaFX：JavaFX 使用类似的事件处理器和监听器方法。事件处理可以使用 Lambda\
    \ 表达式或通过实现特定的事件处理器接口来完成。\n\n理解事件处理和监听器对于开发交互式且响应的 Java GUI 应用程序至关重要。无论你是使用 Swing\
    \ 还是 JavaFX，事件处理的原理都是相似的，选择通常取决于应用程序的具体需求以及你使用的 GUI 框架。\n\n# 31. 多线程与并发编程\n\n\
    Java 多线程允许多个执行线程在单个程序内并发运行。它允许开发者创建同时执行多个任务的应用程序，提高效率和响应能力。\n\n以下是 Java 多线程和并发编程的关键概念和技术：\n\
    \n- 线程创建：在 Java 中，你可以通过扩展 `Thread` 类或实现 `Runnable` 接口来创建线程。\n\n使用 `Runnable` 接口的示例：\n\
    \n```java\nclass MyRunnable implements Runnable {\n    public void run() {\n \
    \       // 在新线程中执行的代码\n    }\n}\n\npublic class ThreadExample {\n    public static\
    \ void main(String[] args) {\n        Thread myThread = new Thread(new MyRunnable());\n\
    \        myThread.start();\n    }\n}\n```\n\n## 线程生命周期：\n\n- New（新建）：线程已创建但尚未启动。\n\
    - Runnable（可运行）：线程已就绪并在等待 CPU 时间。\n- Blocked（阻塞）：线程正在等待显示器锁以进入同步块/方法。\n- Waiting（等待）：线程正在等待另一个线程执行特定操作。\n\
    - Timed Waiting（超时等待）：类似于等待，但有指定的等待时间。\n- Terminated（已终止）：线程已退出。\n\n## 同步（Synchronization）：为了避免多线程环境下的数据不一致，使用了同步。同步通过使用\
    \ `synchronized` 关键字或使用 `java.util.concurrent` 包中的显式锁来实现。**\n\n```java\nclass\
    \ Counter {\n    private int count = 0;\n\n    public synchronized void increment()\
    \ {\n        count++;\n    }\n\n    public synchronized int getCount() {\n   \
    \     return count;\n    }\n}\n```\n\n## 线程池（Thread Pools）：创建和管理线程是非常消耗资源的。线程池管理一个工作线程池并重用它们，减少线程创建的开销。Java\
    \ 提供了 `ExecutorService` 框架来管理线程池。\n\n```java\nExecutorService executorsService\
    \ = Executors.newFixedThreadPool(5);\nexecutorsService.submit(new MyRunnable());\n\
    ```\n\n## 并发工具（Concurrency Utilities）：Java 在 `java.util.concurrent` 包中提供了一系列高级并发工具。包括\
    \ `ExecutorService`、`Future`、`CountDownLatch`、`Semaphore` 和 `CyclicBarrier`。\n\
    \n## Volatile 关键字：`volatile` 关键字确保变量的值始终从主内存读取和写入，防止线程特有的变量缓存。它对于被多个线程访问的变量非常有用。\n\
    \n```java\nclass SharedResource {\n    private volatile boolean flag = false;\n\
    \n    public void setFlag() {\n        flag = true;\n    }\n\n    public boolean\
    \ getFlag() {\n        return flag;\n    }\n}\n```\n"
