  md: "# Thread Lifecycle:\n\nNew: The thread is created but not yet started.\n\n\
    Runnable: The thread is ready to run and waiting for CPU time.\n\nBlocked: The\
    \ thread is waiting for a monitor lock to enter a synchronized block/method.\n\
    \nWaiting: The thread is waiting for another thread to perform a particular action.\n\
    \nTimed Waiting: Similar to waiting but with a specified waiting time.\n\nTerminated:\
    \ The thread has exited.\n\nSynchronization: To avoid data inconsistency in a\
    \ multithreaded environment, synchronization is used. Synchronization is achieved\
    \ through the use of the synchronized keyword or using explicit locks from the\
    \ java.util.concurrent package.\n\n```\nclass Counter {\n    private int count\
    \ = 0;\n\n    public synchronized void increment() {\n        count++;\n    }\n\
    \n    public synchronized int getCount() {\n        return count;\n    }\n}\n\
    ```"
