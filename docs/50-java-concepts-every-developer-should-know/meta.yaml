  md: "# 3. Control Structures in Java (if, else, switch, loops)\n\nControl structures\
    \ in Java provide the ability to alter the flow of program execution based on\
    \ certain conditions. They are essential for building flexible and responsive\
    \ programs.\n\nHere are the main control structures in Java:\n\nif-else Statements:\n\
    \n+   - if statements allow you to execute a block of code if a specified condition\
    \ is true.\n- else statements allow you to specify a block of code to be executed\
    \ if the condition in the if statement is false.\n\n```\npublic class IfElseExample\
    \ {\n  public static void main(String[] args) {\n    int age = 25;\n    // if-else\
    \ statement\n    if (age < 18) {\n      System.out.println(\"You are a minor.\"\
    );\n    } else {\n      System.out.println(\"You are an adult.\"); // You are\
    \ an adult\n    }\n  }\n}\n```"
