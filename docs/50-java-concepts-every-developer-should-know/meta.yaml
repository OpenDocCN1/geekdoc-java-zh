  md: "# # 1. Primitive Data Types\n\nPrimitive data types are the fundamental building\
    \ blocks for storing simple values. These data types are directly supported by\
    \ the language and are not objects.\n\nHere are the main primitive data types\
    \ in Java:\n\n+   - int: Represents integers.\n- double: Represents double-precision\
    \ floating-point numbers.\n- float: Represents single-precision floating-point\
    \ numbers.\n- char: Represents a single Unicode character.\n- boolean: Represents\
    \ a boolean value, either true or false.\n- byte, short, long: Represent integers\
    \ of different sizes.\n\nThese primitive data types are memory-efficient and are\
    \ used to store simple values efficiently compared to objects.\n\nCode Example:\n\
    \n```\npublic class PrimitiveTypesExample {\n\n    public static void main(String[]\
    \ args) {\n        int age = 25;\n        double salary = 50000.50;\n        char\
    \ grade = 'A';\n        boolean isStudent = true;\n    }\n```"
