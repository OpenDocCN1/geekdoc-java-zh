    \    }\n}\n```\n\n在这些示例中：\n\n- 多个线程访问共享资源（如计数器）。\n- `synchronized` 关键字确保了同一只有一个线程可以执行同步方法。\n\
    \n## 19. 内存管理与垃圾回收\n\nJava 使用自动内存管理来简化开发。垃圾回收是负责回收不再使用的对象的机制：\n\n- **垃圾回收**：垃圾回收器在后台运行，识别并回收不再使用的内存。该过程涉及以下步骤：\n\
    \    - **标记（Mark）**：识别从根节点（例如 main 方法、静态变量）可达的对象。\n    - **清理（Sweep）**：移除不再可用的对象。\n\
    \    - **压缩（Compact）**：可选，移动存活对象以优化内存使用。\n\n示例：\n\n```java\nclass MyClass {\n\
    \    public static void main(String[] args) {\n        MyClass obj1 = new MyClass();\n\
    \        MyClass obj2 = new MyClass();\n        obj1 = null; // 此时，obj1 不再引用该对象\n\
    \        // 垃圾回收器在稍后的周期中识别 obj1 为不可达并回收其内存\n    }\n}\n```\n\n资源管理：除了内存管理，Java\
    \ 开发者还需要显式管理资源，例如文件或数据库连接。`try-with-resources` 语句有助于确保资源在不再需要时自动关闭：\n\n```java\n\
    try (BufferedReader reader = new BufferedReader(new FileReader(\"example.txt\"\
    ))) {\n    // 使用 BufferedReader\n} catch (IOException e) {\n    e.printStackTrace();\n\
    } // reader 会被自动关闭\n```\n\n理解内存管理和垃圾回收对于 Java 开发者创建高效健壮的应用至关重要。虽然 Java 的自动内存管理简化了处理，但开发者仍应注意资源管理并避免内存泄漏。\n\
    \n## 20. 引用类型与原始类型\n\n在 Java 中，数据类型大致分为两类：原始类型和引用类型。让我们探索它们之间的区别：\n\n### 原始类型：原始类型表示简单的单一值，是\
    \ Java 数据中的基本构建块。它们由语言预定义并有保留字。原始类型包括：\n\n- **整型类型**：\n    - `byte`：8 位符号整数\n\
    \    - `short`：16 位符号整数\n    - `int`：32 位符号整数\n    - `long`：64 位符号整数\n- **浮点数类型**：\n\
    \    - `float`：32 位浮点数\n    - `double`：64 位浮点数\n- **字符类型**：\n    - `char`：16 位\
    \ Unicode 字符\n\n"
