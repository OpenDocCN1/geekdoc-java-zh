  md: 'I got even, from a bohemian with his dentures in whose little room spent a
    pleasant hour, a mumbled account and an unpublished photocopy of a letter friend
    sent him about the October 1955 Six Gallery reading that became famous because
    Allen Ginsberg read “Howl” aloud for the first time. The drama of that breakthrough
    for one poet overshadowed the proto-environmental poetry by Michael McClure and
    Gary Snyder read that night. The accounts generally said little about the location
    as well, as well as the artist''s co-op gallery where Hendrix was a principal,
    as well as the instigator of the reading. It was a delightful document that let
    me see how the event had felt to a participant before it and the official Beats
    it got mythologized.


    Nonfiction is at its best an act of putting the world back together—or tearing
    some piece of it apart to find what''s hidden beneath the assumptions or conventions—and
    in this sense creation and destruction can be akin. The process can be incandescent
    with excitement, whether from finding some unexpected scrap of information or
    from recognizing the patterns that begin to arise from the fragments begin to
    assemble. Something you didn''t know comes into focus, and the world makes sense
    in a new way, or an old assumption is gutted, and you try to write it down.


    In a way, this has my life''s work, the pursuit of patterns and the work of reconnecting
    what has been fractured, often fractured by categories that break a subject, a
    history, a meaning into subcompartments from which the whole cannot be seen. While
    there''s a kind of expertise that comes from microscopic focus, I would often
    pursue the patterns that reveal themselves across broad areas of space or time
    or categories. The art of picking out constellations in the night sky has cropped
    up again and again as a metaphor for this work.


    This was true to a degree of the subject of this first book, whose story had been
    largely missed by the linear narratives of art history, film history, and literary
    history. The relationship between film, poetry, and visual art, between drugs,
    esoteric and non-Western philosophies, political dissent, and queer culture, between
    members of a funky coterie that could be described as avant-garde were it not
    catalytic in a counterculture, was what mattered. My artists weren''t very well
    documented those oral history interviews, and they weren''t very visible, though
    most of them—particularly DeFeo and Connor—got a lot attention afterward.'
