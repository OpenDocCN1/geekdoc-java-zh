  md: '# About the Author


    Rebecca Solnit is the author of more than twenty books, including A Field Guide
    to Getting Lost, The Faraway Nearby, A Paradise Built in Hell, River of Shadows,
    and Wanderlust: A History of Walking. She is also the author of Men Explain Things
    to Me and many essays on feminism, activism and social change, hope, and the climate
    crisis. A product of the California public education system from kindergarten
    to graduate school, she is a regular contributor to the Guardian and Lit Hub.'
