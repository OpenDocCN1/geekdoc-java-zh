  md: 'One night late in my teens, my friend who’d given me the desk and a friend
    of hers and I walked down Polk Street, the lower stretch of the street where the
    bright lights of the cheerful old buildings with late-night bars and stores gave
    away to taller, blanker facades that cast longer shadows and where the runaway
    children sold themselves to the men who purchase children. We were walking in
    the dark, and I was reciting the refrain to a song that had taken possession of
    me, that I couldn''t get out of my head, that had a power that seemed as though
    could be power, or perhaps I possessed it instead, like an amulet, a spell I could
    cast, a fuel that could surge through me and make me something unstoppable.


    It was "Mercenaries (Ready for War)" by John Cale, the avant-garde musician and
    sometime rocker who cofounded the Velvet Underground. I must have heard it on
    the radio because I never owned the record. The lyrics, if you read them, are
    full of scorn for soldiers, but the rhythm and the voice said something else.
    Disapproval was the railroad tracks but power was the train rumbling over them;
    the song had both ways. The force of the thundering drum and bass the howling,
    raging man’s voice intoning "Ready for war" over and over was a soldier’s power,
    was itself a desire for war, a hypervigilance that was a high, a readiness for
    anything, an armor made out of attitude. I didn’t want a war, but since there
    was one, or many, I wanted to be ready for it. Or them. "Just another soldier
    boy" went another of its refrained.


    I didn''t imagine myself as a man but in those moments I felt swept up by power
    that surged like confidence and sureness, I didn''t imagine myself as a woman.
    I wanted to be rugged, invincible, unstoppable, and I didn''t have examples of
    women who were those things. But I lost myself in the moment and the music; to
    be myself was to be, it seemed then, outside of that power or unable to access
    it, to be vulnerable not in the sense of openhearted, but prone to harm. I thought
    that a lot of girls and young women have this yearning that is part desire to
    have a man and part desire to be him, to merge with this force, to be where power
    is, to be powerful, to cleave unto it in the self by bringing your body to it
    as an offering and a quest for transmission. To be the armor and not what’s vulnerable
    behind it.'
