  md: 'as a masculine voice. I could keep opinions at bay if I tried hard, but not
    adjectives.


    The television show Dragnet, which was old even then, opened every episode with
    a hard-boiled man’s voice flatly declaim, “The story you are about to be true.
    The names have been changed to protect the innocent.” It was like the prose of
    Ernest Hemingway, which my first college English professor had insisted was the
    pinnacle of good writing, that stripped-back, clipped, tense language that was
    also about masculinity and its parsimonious words packed in silences. It was a
    voice policing many things, and leaving a lot unsaid in the same way the ironic
    poses favored by my family did. The tone that we were supposed to deploy as journalists
    sounded to me like that tone, at least that we were allowed to quote people who
    might be more expressive and emotional.


    I wanted language that could be simple and clear when the subject required it,
    but sometimes clarity requires complexity. I believe in the irreducible and in
    invocation and evacuation, and I am fond of sentences less like superhighways
    than winding paths, with the occasional scenic detour or pause to take in the
    view, since a footpath can traverse steep and twisting terrain that a paved road
    cannot. I know sometimes what gets called digression is pulling in a passenger
    who fell off the boat. I wanted English to be an instrument on which many kinds
    of music could be played. I wanted writing that could be lavish, subtle, evocative,
    that could describe mists and moods and hopes and not just facts and solid objects.
    I wanted to map how the world is connected by patterns and intuitions andsemblances.
    I wanted to trace the lost patterns that came before the world was broken and
    find the new ones we could make out of the shards.'
