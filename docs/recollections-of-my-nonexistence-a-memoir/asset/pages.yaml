  md: 'It was a powerful place. I can feel what it was like to be there now: the great
    expanses of dust-colored earth cobbled in stone, including shining pink quartz,
    fierce prickly plants here and there in the pale soil between stones, the dry
    air spectacularly clear (unless there was a dust storm or enough heat to make
    the air seethe and shimmer) so clear that you could see for dozens of the fang-sharp
    ranges in the distance. Those immense spaces invited me to move freely and feel
    the smallness of human bodies and concerns in a landscape where you could sometimes
    see a hundred miles, where you could drive half without seeing a house, where
    you could, as I often did, wander toward the horizon feeling both liberated and
    fearful of what happens to a body that is two-thirds liquid in such an arid place.
    Just sitting still you could feel the warmth coming off your breath and out soul
