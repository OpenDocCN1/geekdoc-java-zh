- img_proc: true
  md: 'the pleasure of bringing ideas, projects, and people from one circle to another,
    and the lack and loneliness were gone.


    I went through a phase of approaching the powers that I had assumed were not for
    me and maybe not for my gender. I bought a motorcycle at the beginning of the
    1990s, and revving the engine and kick-starting it and moving its weight to park
    it or bring it upright or pick it up when it got knocked over gave me a kind of
    macho pleasure (more than riding it, which I always found late a little scare,
    because of cars, before it was stolen months after I bought it). I learned to
    work out weights and weight machines shortly thereafter, having finally noticed
    that the body requires maintenance and that the stress that petrified my form
    yielded at least temporarily to violent exertion.


    Two or three years later, the boyfriend who lived in the Mojave wanted me to shoot
    a .22 rifle—we went into the desert and aimed at Old English malt liquor cans
    late one afternoon until evening came and our shadows stretched for a hundred
    feet and more across the flat ground. I found it alarmingly fun, when we went
    shooting with his father, who had spent his life in the military and a lot of
    time in combat, he told me the story of being forced by a general''s direct orders
    to shoot a civilian on a hill long away—and how he had nightmares ever after.
    It was a solemn and great warning to take guns seriously. And I studied Shotokan
    karate for a little while with a world champion fighter who feared nothing when
    she walked the street. Just to shout and kick and strike required a different
    sense of self. Each of these felt like a little usurpation of powers that I had
    never believed were for people like me. Things were changing.


    Street harassment largely ceased to be a problem, and my wariness softened, though
    it never went away. It was not a science experiment with a control, so it''s hard
    to say what exactly changed. Perhaps I aged out of my prime years. Perhaps the
    culture changed in some way, though I know young women still suffer harassment
    and assault. Perhaps the ways I became street-smart were a factor: I learned to
    give those I encountered respect and acknowledgment, and to not get caught in
    anyone''s drama—to be fluid on the street, moving smoothly without snagging or
    rushing. White men fell silent. The commentary from the black men in my neighborhood
    grew uniformly cordial, as some of it had always been, and I tried to say pleasant
    things back, and enjoyed the interactions.'
