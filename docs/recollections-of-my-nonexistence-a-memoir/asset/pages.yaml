- img_proc: true
  md: 'The artists’ own works were often a kind of collage, literally: of the six
    artists central to the book, Jess, Berman, George Herms, and Bruce Conner were
    known primarily for their collages and three-dimensional assemblages. Jay DeFeo
    was, like Wally Hedrick, primarily a painter, and one whose work often featured
    a powerful solitary form, but she who ventured into collage on many occasions,
    mixing painting and photography and found material. Collage makes something new
    without hiding the traces of the old, makes a whole out of scraps without erasing
    the scrappiness, emerges from an idea of creation not as making something out
    of nothing like God on the first day or painters and novelists, but as making
    something else out of a world already exploding with images, ideas, wreckage and
    ruin, artifacts, shards, and remnants.


    Collage is literally a border art, an art of what happens when two things confront
    each or spill onto each other, what conversations arise from the conjunction of
    difference, and how differences can feed a new whole. For these artists it also
    a poverty art, one of scavenged materials from the Victorian houses knocked down
    in the black neighborhood around them, the detritus of thrift stores, scraps from
    magazines. Conner even made his first films out of found footage because he couldn’t
    afford a camera, and then settled into this recontextualizing as his chosen genre,
    or mixed found and new footage to make films influential for their inventive editing
    and pacing.


    Putting together this picture of my part of the world as it existed not long before
    I arrived in it was a paradise of ideas and pattern recognition, perhaps more
    because it was the first time I had done so on such a scale. That I was getting
    to know the past of my own city and region meant that places I had passed through
    were acquiring new layers of meaning. I was writing about the world up to the
    point when I had been born into it, and it was foundational work for moving forward
    in that world. I was writing a cultural history that gave me my own part of the
    world significance and possibility I had not seen before. I was becoming an expert
    on a subject, and that too had its rewards.'
