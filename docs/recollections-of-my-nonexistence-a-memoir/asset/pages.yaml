    were anchors, were companions of a sort, even protectors or parents. Once at the
    Pacific, I thought to myself Everything is my mother by my mother my mother, and
    I recognized the ocean had been a mother offering power, constancy, and solace.
    Many years later I began rowing a scull, I realized that in the water, I was out
    of reach of men and dogs, and that, as well as the beauties of water, made it
    serene, dreamy, the eighteen-foot span of my oars being as close to having wings
    as I could come.


    But long before that, I flew. Even in the dreams my logical mind wrestled with
    how this was possible, anxious that it be possible. In one dream I had to align
