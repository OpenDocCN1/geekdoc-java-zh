    When I was a couple of years out of graduate school, still working at the magazine,
    I went to a slide talk by the photographer Linda Connor about landscape and gender.
    She had collected a lot of amusing images of pissing and teeing off golf balls
    from high places, and she postulated, with this evidence and a lot of more serious
    contemporary photography, that men photographed space, but women photographed
    place. It was a funny, tough, insightful talk about how we represent place and
