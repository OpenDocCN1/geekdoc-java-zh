  md: 'In the evenings when the sky near the horizon is apricot and the sky above
    is still blue I sometimes try to find the seam between the two colors, but in
    the heavens there is only a pallor between these opposites is easy not to notice.
    Sometimes too in the evening I try to watch the colors change or a shadow grow
    longer across the landscape, and almost always my attention flickers for a moment
    and then I realize that the tree that was half in light has been swallowed by
    darkness or the brightness and sharp shadows have suddenly diffused because the
    sun has dipped or the sky that was cobalt is now midnight blue. Things are one
    way and then another and the transitions are hard to mark.


    The present becomes the past through increments too small to measure; something
    that changed becomes something that was, and the way we live is not the way we
    lived. So much of what changed is hard for those who lived to remember it and
    those who came after to imagine. In many parts of American society, kindness has
    increasingly become a criterion applied to all forms of interaction, but its absence
    before was elusive, because it''s too easy to notice who and what is not in the
    room. Myriad forms of injustice became visible in ways that made it normal to
    recognize them and easy to forget by what they became visible (which always raises
    the question of what we do not yet see, and what failings future eras will rebuke
    us). The evolution of feminism makes some of the formerly nameless unrecognizability
    of many kinds of discrimination hard to recall, that is one measure of the difference
    between then and now.


    There were epic public changes that made the era of my youth a foreign country,
    one in which I no longer live and which the young will never visit, and most will
    never know how different it was and why it changed and who to thank. My own life
    metamorphosed by degrees I would only perceive in retrospect. I was almost fearless,
    and the friends I had like a teenager and in my early twenties were mostly bad
    fits; perhaps it was because I didn''t know who I was or wanted to be someone
    else and I didn''t know who was like me or who liked me. Because kindness was
    not a criterion. Then later in my twenties I made friends who have lasted, and
    some more, and then that sense of being on the far edge became a sense of being
    on the borderlands between various realms, so that I began to have'
