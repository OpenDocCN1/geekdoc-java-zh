  md: 'The North Star is so far away from earth that it takes its light more than
    three hundred years to reach us, and even the light from the closest star takes
    four years. A book is a little like a star, in that what you read is what the
    author was passionately immersed in long before, sometimes only because of the
    time it takes a book to be written, edited, printed, and distributed. And often
    the time it takes to make a book means that it represents the residue of interests
    that preceded the writing. By the late 1980s new interests were eclipsing those
    that came before; I was engaged in a new way with ideas about nature and landscape
    and gender and the American West.


    This first book was about revisiting something significant that I had found years
    before. I focused on six artists—three from Southern California and three from
    the Bay Area—whose lives and work had also overlapped as they became friends and
    sometimes collaborators in the 1950s: Jess (who abandoned his surname when he
    left science for art and a life as an openly gay man when that was superhumanly
    bold thing to do), Jay DeFeo, Bruce Conner, George Herms, Wally Hedrick, and Berman.
    Each of them had chosen in various ways to lead a low-profile life, to find out
    what art could mean and what a life full of it could be and then making it and
    living it. Conner, Hedrick, and DeFeo had opportunities to go to New York and
    become stars, but they declined the opportunity.


    Their idealism was underlined by the affluence of the era and their outright,
    by flight that left cities full of cheap housing, and wages high enough that couples
    and families often lived off the income from one part-time job. Even in the 1980s,
    the kind of freedom to come and go, to stop paying the landlord for months and
    then find another pleasant place to live, to drop in and out of the economy seemed
    like the strange customs of an ancient free people. The artists I wrote about
    moved on the beat of Beat circles or passed through them, and the story often
    told about the Beats as a group of male writers from the East morphed into something
    larger and more interesting that included these visual artists and experimental
    filmmakers and the poets who were part of other movements, notably what got called
    the San Francisco Renaissance,'
  merge: -1
  pgno: 100
- img_proc: true
  md: 'including Jess''s life partner, Robert Duncan, Jack Spicer, and Michael McClure,
    who moved through many worlds.


    I learned from these characters before you can make art you have have to have
    a culture in which to make it, a context that gives it meaning, and people from
    whom to learn and to whom to show your work. Through short-lived galleries, tiny
    magazines, screenings, poetry readings, friendships, they made culture happen
    among themselves—among not because they were exclusionary, but because they were
    excluded. I came to understand some general principles about how cultures evolve
    and shift and how migrate from the margins to the center. They overlapped with
    jazz musicians, rock bands, drug dealers, biker gangs, gay subcultures, social
    experiments, countercultural heroes. They had that camaraderie I still sometimes
    recognize in small towns and conservative communities, where the outsiders stick
    together their differences from each other are insignificant in the face of their
    differences from a hostile mainstream.


    Research is often portrayed as dreary and diligent, but for those with a taste
    for this detective work''s the thrill of the chase—of hunting data, flushing obscure
    things out of hiding, finding the fragments that assemble into a picture. Your
    shards are stories, facts, manuscripts and letters, photographs, old newspaper
    clippings, the bound volumes of magazines no one has opened in years, something
    someone says to you in an interview they not said to anyone else that way. For
    my early books, I was amazed to have neglected topics to write about that seemed
    significant to me, and it came to feel like an advantage that I was in a place
    that had been so overlooked and dismissed.


    Some of my early research adventures were comic. When I was working on my thesis,
    I kept calling up the actor-director Dennis Hopper in New Mexico, hoping to talk
    to him Berman, and he kept answering cordially, saying he''d be happy to talk,
    but I could call back later, until, dozens of calls later, the phone blows alarm
    and gave up. I didn''t try again when I turned the project into a book, though
    he was living in Los Angeles, because I had been so terrified by his performance
    in the film Blue Velvet, but his assistant was helpful to me and got six prints
    from his original negatives—Hopper had been a talented photographer in his youth—to
    use in the book.'
