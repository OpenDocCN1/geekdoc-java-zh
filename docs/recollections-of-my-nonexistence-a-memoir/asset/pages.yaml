  md: 'Mary and Carrie Dann as they prepared to face attack from the government. They
    were grand, fearless matriarchs, the most unsubjugated women I ever knew, queens
    of their household, heads of their ranch, capable of fixing a generator or taming
    a mustang from their vast herds, cheerful and pithy as they spoke to us in English
    and to each other in their own language. (Savage Dreams, my book in which they
    were principal figures, foregrounded a lot of charismatic women and women''s groups,
    but I don''t know if anyone recognized it as a feminist book.) To be around them
    was a revelation; it was to where family memory reached back to before people
    arrived, land was sacred, women in charge, and actions defend what mattered for
    the long future. I was getting an education about tangible things like the lay
    of the land and the history of the West, but also about matters of the spirit
    and questions of how to live your life.


    Joining the project meant spending weeks at a time on the Dann'' remote ranch
    in northeastern Nevada, living out of my truck or an old trailer near their house,
    where I could plug in the desktop computer and printer I''d hauled out. It meant
    joining some friends from the antinuclear movement and some people I''d never
    met, indigenous and otherwise, as a coalition and attending tribal meetings and
    gatherings. It meant, in my case, ghostwriting letters and statements for Carrie
    and writing a lot of the literature for the project, press releases, and backgrounders
    (researching the long overview article I''d written after that immersion in the
    microfilm record had taught me a lot). And it meant waiting, because now that
    the courtroom conflict was over, the government was threatening to seize their
    livestock.


    The violent assault came on April 11, 1992. An organizer at the ranch ran into
    a woman who asked him all the sheriff''s cars outside the community center in
    the nearest hamlet. The government had hired a roundup team to confiscate cattle,
    and law enforcement was there to back them up. I got the news by phone and within
    an hour had canceled my calls and grabbed my stuff and headed in my car, across
    the Bay Bridge, the East Bay, across the Sacramento River and the wide Sacramento
    Valley, up through the oak groves and then the pine groves over the Sierra Nevada,
    and into the desert, a couple of hours at a stop, and at dawn resumed driving
    the five hundred miles between my home and theirs. It was the first time I moved
    toward violence.'
