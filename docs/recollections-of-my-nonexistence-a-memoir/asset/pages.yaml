  md: 'fade little when the sun goes down. Nightlife. Nightclubs. Nightmares.

    Patti Smith’s first hit. “Because the Night,” had come out only a few years earlier,
    telling us that the night belongs to lovers and to love. Love is made mostly in
    dimness or darkness, and darkness—the failure of sight, the most rational of the
    senses, the awakening of the other senses, the otherworldlyness that the world
    takes on when it turns away from the sun and faces out into the galaxy—can itself
    be an erotic embrace.


    My bohemian aunt had given me a copy of Djuna Barnes’s Nightwood when I was eight,
    and I had fallen in love with that brief novel did with words and with its romantic
    extravagance about pain and loss. It’s mostly remembered as a lesbian novel now,
    and at the level of Nora Flood for the elusive Robin Vote forms the bones of its
    plot most solely in Paris. But the ode-like monologues by the garrulous cross-crossing
    garret-dwelling doctor Matthew O’Connor, “an Irishman from the Barbary Coast (Pacific
    Street, San Francisco) whose interest in gynaecology had driven him half around
    the world,” dominate it. He is an expert on the night, on night as the mysteries
    of the human heart and the fluidity of who we are and the foolishness of who we
    think we are and what we think we should have and hold. “Every day is thought
    upon and calculated, but the night is not premeditated,” he tells Flood. “The
    Bible lies the one way but the night-gown the other. The night, ‘Beware of that
    dark dort!’


    He’s an oracle akin to the transgender Tiresias in Oedipus Rex, someone who understands
    men and women and the things they want and imagine and do together and alone.
    Night is the space in which poetic intuition, not logic, prevails, in which you
    feel what you cannot see, and perhaps in some sense he is the night itself, or
    its oracle and priestess. In letter to that old friend of my late teens, I was
    saying that I wanted to bring Barnes’ lyricism to my immediate experience, to
    wed the poetics of what I wanted and the politics of why I had trouble reaching
    it. To whom does the night belong? It did not seem to belong to me.'
