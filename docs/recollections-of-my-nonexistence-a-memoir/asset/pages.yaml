  md: 'As a reader roamed free. As a would-be writer, it was more complicated. In
    my teens and well into my twenties, I mostly encountered the literature of heterosexual
    men, where the muse or the city they explored or the nature they conquered was
    a woman. Throughout my teens, I wrestled with Robert Graves''s The White Goddess,
    which seemed to have something valuable about trees and alphabets I could not
    quite extract from his erudite jumble. It''s a book that seemed to assume that
    the poet''s orientation is that of a straight man to a female goddess; it might
    have encouraged some young women to smileatically and levy tribute, but I wanted
    to be a writer, not a muse.


    I also struggled secretly against the men who were convinced that they were the
    artists and we were the audience. Young women like me were supposed to exist as
    orbital figures, planets around a sun, moons around a planet. Never stars. When
    I was eighteen, one man was so adamant that I was his muse that he inspired me
    in a vivid sense that I was literally standing atop a pillar; I can still summon
