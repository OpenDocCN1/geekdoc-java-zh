  md: 'or just those in the floodlights can''t see what''s in the shadows. The margins
    are also where authority wanes and orthodoxies weaken. My first education in how
    all this work came from Wallace Berman, who had consciously chosen to live on
    various edges—economically precarious, subcultural, often literally on the edge—homes
    perched on stilts in the canyons of Los Angeles and the salt marshes of the Bay
    Area. From those locales he had been influential for people who plunged into the
    limelight—poets, artists, actors such as Denis Hopper, Russ Tamblyn, and Dean
    Stockwell. One sign of Berman''s influence is his inclusion in the collage Club
    Band; the album cover for the Beatles'' 1967 Sgt. Pepper''s Lonely Hearts; another
    is his small role as another iconic artwork of the era, Denis Hopper''s 1969 film
    Easy Rider.(The name of Berman''s hand-printed magazine was Semina, from the Latin
    for seeds and semen, and he was a cultivator of the seeds—that''s literally what
    he does in his cameo in Easy Rider—but also a cultivator of the seeds others had
    sown.)


    To delve into his life and milieu meant interviewing, first for the thesis, then
    for the book, people who I still thought of as grown-ups—adults intimidatingly
    older than me. They were my parents'' generation but they were people who had
    lived their lives as great adventurers, taking risks, not chasing stability, and
    not regretting it. My parents were, even after decades in the middle class, so
    governed by old Depression-era fear of poverty that their lives were cramped and
    cautious. These extravagant peers of theirs provided a fine alternative model
    of how to live one''s life. When I began that book four years after I graduated,
    I didn''t know that I would never really get around to getting a job again. I
    would have endless work, and write a lot of books, and a lot more essays and articles,
    and I''d do some activist work and some teaching, but I''d never really go back
    to being an employee with a salary and a boss.'
