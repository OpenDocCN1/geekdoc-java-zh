    FULL MOON, EQUINOX, PRETTY DAY BUT CHILL. That evening of March 24 I''d written
    her with a new heading, LONG


    FAINT HERRINGBONE CLOUDS BEFORE DUSK.


    Two years before, I had left the studio apartment for a more spacious dwelling
    six blocks down. My friend Marina had just moved in with me there, in flight from
    an awful soon-to-be-ex, and I was delighted to be with me. By the time of the
    alarming diagnosis I received that winter, we were close friends. The diagnosis
    meant major surgery a few weeks before this time, so we were nestled in, convalcing,
