  md: '2003, my work was featured in a university colloquium with a man who launched
    an extended ad hominem attack on me, my motives, and my hopefulness. I''d arrived
    at hopefulness in the course of pursuing a return project in Yosemite National
    Park. In 2001, with the artists Mark Klett and Byron Wolfe, I''d ventured to rephotograph
    Edward Muybridge''s photographs and understand what had changed since made them
    in 1872. Our project grew into a broader survey of earlier photographers, modernist
    as well as Victorian, and of what had had not changed since their times. The exploration
    gave me a magnificently complex sense of change as something that does not occur
    at a predictable rate but varies widely from place to entity: some trees were
    still recognizable more than a century later, some arrangements of small boulders
    had not moved in that time, but the Merced River shifted its bed, forests that
    devoured meadows, and celebrated old landmarks had vanished.


    I thought I was there to look at change over the span of 130 years, but I was
    astonished to find how much had changed in less than a decade since I had scrutinized
    the park for Savage Dreams. Native people had gained some rights and a lot more
    representation in the park. Before whites arrived, they had set fires as part
    of their land management techniques, and the Park Service had finally recognized
    fire as part of the place''s ecology after a century of fire suppression. The
    Park visitors were far more ethnically diverse; the sense of one cosmology having
    pushed out by another going away, or so it seemed to me, to a sense of the coexistence
    of many worldviews and a big adjustment in the Eurocentric to recognize—imperfectly,
    incompletely, but still—the rights and presence of indigenous Americans. California
    was on its way to becoming a nonwhite-majority state and of the promise of that
    I had found in the park this time around.


    This was the vision I''d presented at the university, where the academic man had
    laid into my motives and my character for half an hour or so, in front of the
    students I''d brought from the writing class I was teaching at an art school.
    He was attached to his narratives that everything was getting worse, to his despair
    (and, I was told by mutual friends, resentful that my pile of publications kept
    growing). I was appalled I''d brought these young women, by my dean''s urging,
