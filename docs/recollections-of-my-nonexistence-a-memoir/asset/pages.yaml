    ways of being in the natural world. Being environmental came to mean, at least,
    recognizing and respecting the first dwellers in these places and that impact—hunting,
    harvesting, fire management techniques had to be factored into assessments of
    what had constructed the ecosystems by Euro-American arrival. That is to say,
    these new frameworks and voices transformed nothing less history, nature, and
    culture in far-reaching ways.


    For me there was tremendous hope in the reemergence of the Judeo-Christian and
    European worldviews, who had lived for millennia without, for the most part, devastating
    them. The deep ties some had to the old ways and places seemed to provide crucial
    capacities to navigate the future (which I would see in full power with the Zapatistas
    of southern Mexico starting in 1994 and in the powerful presence of indigenous
    people in the twenty-first century climate movement). The North American creation
    myths in which the world was never perfect, never fallen, and never finished created
    a clear light on the problems with Genesis and the Judeo-Christian preoccupations
    with perfection and purity and the fall from grace. In those years I''d also been
    working with a Native California artist, Lewis DeSoto, whose installations and
    landscapes and ways of thinking about and the sacred showed me new perspectives
    and possibilities.


    In 1990 I met environmental organizer Bob Fulerson, a fifth-generation Nevadan,
    and he invited me to join some other Nevadans and journey further into the state.
    It was on that short trip I grasped how extensive and destructive the military
    infrastructure was throughout the West, got a sense of these intrepid, resourceful,
    devoted Westerners dedicated to their rural and remote places along with a desire
    to join them and a sense that I had been looking for since childhood. We stayed
    in touch, and Bob urged me to show up for the Western Shosh sisters'
