  md: 'It is a poem of devastation:

    Never before

    have I heard my own voice

    cry out in a language not mine

    that the earth was wrong

    that night came first and then nothing

    that birds flew only to their deaths

    that ice was the meaning of change

    that I was never a child


    It spoke to me when I was very nearly a child. Sometimes when you are devastated
    you want not a reprieve but a mirror of your condition or

    reminder that you are not alone in it. Other times it is not the propaganda or

    t political art that helps you face a crisis but whatever gives you respite

    from it.


    Milan Kundera’s The Book of Laughter and Forgetting was published in

