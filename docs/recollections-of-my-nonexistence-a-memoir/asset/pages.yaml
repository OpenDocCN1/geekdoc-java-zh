    that always had more people and more power and sometimes acted as my advocate
    and collaborator and sometimes as my adversary.


    One evening not long ago, my friend Tina and I went to see The Post at a little
    movie theater out in the west of San Francisco, the sky is darker and the wind
    is stronger and everything seems a little dreamer. The movie told two intertwined
    stories, about the Washington Post''s decision to report on the Pentagon Papers,
