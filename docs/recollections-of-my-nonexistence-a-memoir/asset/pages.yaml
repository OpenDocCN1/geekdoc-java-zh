  md: sky is more shades of blue than you can count as it fades from where the sun
    is to the far side where other colors are happening. If you look away for a moment
    you miss a shade for which there will never be a term, and it is transformed into
    another and another. The names of the colors are sometimes cages containing what
    doesn't belong there, and this is often true of language generally, of the words
    like woman, man, child, adult, safe, strong, free, true, black, white, rich, poor.
    We need the words, but use them best knowing they are containers forever spilling
    over and breaking open. Something is always beyond.
