    units of classes, helped along by a handful of prescription speed in the form
    of little yellow pills that been the only gift given me by the man I''d dating
    before I moved.


    I graduated at turned, and then realized that the world and I were not ready for
    each other. I got a desk-clerk job a pleasant walk home in a small hotel, out
    there on the edge of the Castro District in those last years before AIDS would
    change everything for the gay men who thonged the streets of the neighborhood.
    I stayed there for a restorative of catching myself by looking around and not
    being desperate for time or money. The job left a lot of time to read behind a
    rooftop desk, in between checking guests in and out taking reservations by phone
    and mailing confirmations and sometimes making beds or breakfast trays. There
    were troubles—a lecherous elderly boss, the sorrows of a refugee housekeeper whose
    husband beat her, a few crises with customers—mostly it was peaceful.


    After graduation, I realized that I had learned to read, I had not learned to
