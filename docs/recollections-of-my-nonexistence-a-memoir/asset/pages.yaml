  md: 'The New Strangers Home Baptist Church was two blocks east of my apartment,
    in a three-story Victorian building with two cross-topped turrets like grain silos
    on either side of the building and a rare thing in neighborhood of buildings that
    came right up to the sidewalk: a small lawn out front, and in the middle of the
    lawn along some struggling roses a wooden sign announcing its name. Year after
    year I passed it contemplating what a new stranger might be. The Solid Rock Baptist
    Church, where Lyon Street got steep, was one of several places of worship I''d
    sometimes pause outside to listen to the gospel music being inside. I was an outsider
    in that neighborhood, a new stranger, even if it was a neighborhood of outsiders
    to the white society within I was free to travel and belong.


    It was a little neighborhood, five blocks wide, six blocks, defined by broad boulevards
    to the east and west, the verdant panthandle of Golden Park to the south, and
    a steep hill that functioned as a kind of wall to the north. My new home was on
    the south corner of a block whose north side was the dim, low-sung Pentecostal
    church that was also polling place. Next to it was the liquor store owned by the
    African immigrant whose teenager''s funeral I went to many years later, after
    he was gunned down in a drive-shooting. The funeral was at the Emanuel Church
    of God in Christ in Hayes, three blocks away from the family store, less than
    that from the laundromat in front of which the boy was murdered.


    The church was a pretty building that had in a paler era be Mormon funeral service
    was rousing, musical, of the finest oratory I''ve ever heard. The neat, angular
    stucco church painted in pastels always looked like it had fallen out of one of
    the quattrocento paintings of the saints. Across from it was the little storefront
    church I once, in my first years attended; the crucifix above the altar was made
    of egg cartons, bumpy side out. There were several black churches in that same
    area. You were never far from devotion.


    A beautiful mansion painted white hosted the Brahma Kumaris Meditation Center,
    and when AIDS became a worldwide scourge later in the decade, Mother Teresa''s
    Missionaries of Charity opened an AIDS hospice in a big Victorian house across
    the street from my home, and the nuns in white cotton saris with blue borders
    became a regular'
  merge: -1
  pgno: 16
- img_proc: true
  md: 'sight in the neighborhood. Mother Teresa made a few appearances herself, and
    the nuns once showed me a photograph of her with our Arab-owned, black-run liquor
    store behind her. There was an Islamic center to the east, a Jesuit university
    to the west, Catholic and Episcopal churches on the northern edge, and, to the
    southeast, just beyond the neighborhood’s boundaries, on Divisadero Street, the
    St. John Coltrane African Orthodox Church with its jazz masses, food programs,
    and big Russian Orthodox–style paintings of black archangels.


    Which is to say that it was a deeply, densely spiritual neighborhood, a small
    place shouting to the heavens and to various versions of God. In those first years,
    the people who attended those little churches walked to them, clad in splendor,
    the men and boys in suits of many colors, the girls and women in dresses, the
    older women often in hats, satin, and velvet that had been folded, clustered,
    tilted, veiled, decorated with fabric flowers or jewels. The neighborhood was
    alive in a way that made the suburban places I’d grown up in seem dead and bereft,
    those subdivisions were by design and ethics also withdrawal from public space
    and human contact, where the adults drove and kept to themselves, and the fences
    between churches were taller than our heads.


    Sometimes I would look down from my bay windows at churchgoers strolling in various
    directions, sometimes I would stroll through the throngs of people greeting one
    another before and after service. It was a vitally alive place in those days when
    the congregations moved through each other toward their places of worship and
    dispersed back into their homes on foot. The churches owned their buildings and
    stayed put, but their members were mostly renters and gradually more and more
    of them lived somewhere else, and the streets were no longer so lively. Instead
    of celebratory bustle on the sidewalks, there were lines of double-parked cars
    near each. them. Then, slowly, the houses of worship also began to vanish, but
    that was long after those days I was first getting to know the place and its people.


    The older residents had been part of the great migration of black people from
    the South, and their way of living in the neighborhood seemed to have as much
    to do with the South and small towns and rural life as with inner city realities.
    Hearing their stories I felt the ghosts of these other places present as origins
    and templates in this place. San Francisco’s black population had increased almost
    tenfold in the 1940s, and the newcomers had concentrated in this neighborhood
    close to the city’s'
  merge: -1
  pgno: 17
- img_proc: true
  md: 'geographical center, and in Hunter’s Point, in the far southeast of the city,
    where the shipyard jobs were.


    These elders were not in a hurry; they were country people. They kept an eye on
    passersby, greeting the people they knew, sometimes calling out to a child who
