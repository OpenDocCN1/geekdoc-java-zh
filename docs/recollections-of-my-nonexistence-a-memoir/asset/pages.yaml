  md: '# 4


    The word adult implies that all the people who''ve attained legal majority make
    up a coherent category, but we are travelers who change and traverse a changing
    country as we go. The road is tattered and elastic. Childhood fades gradually
    in some ways, never ends in others; adulthood arrives in small, irregular installments
    if it arrives; and every person is on her own schedule, or rather there is none
    for the transitions. When you leave home, if you had one, when you start out on
    your own, you''re someone who was a child for most of her life, even when what
    it means to be a child is ill-defined.


    Some people have others who will tend and fund and sometimes confine all their
    lives, some people are gradually we, some of us are cut off abruptly and fend
    for ourselves, some always did. Still, out on your own, you''re a new immigrant
    to the nation of adults, and the customs are strange; you''re learning to hold
    together all the pieces of a life, figure out what that life is going to be and
    who is going to be part of it, and what you will do with your self-determination.


    You are in your walking down a long road that will branch and branch again, and
    your life is full of choices with huge and unpredictable consequences, and you
    rarely get to come back to choose the other route. You are making something, a
    life, a self, and it is an intensely creative task as well as one at which is
    more than possible to fail, a little, a lot, miserably, fatally. Youth is a high-risk
    business. Once, around the time I moved into Mr. Young''s building, I was approached
    as I walked across a plaza near city hall by members of a club. In the early 1980s,
    the cuts that had done so much damage the 1970s had yet to fade away. They seemed
    to be the consequence of turning loose into the anarchic freedoms of the era people
    raised to obey authority. As a seemingly radical way to return to the conservatism
    of blind obedience and harsh hierarchy, they were a crevasse between two modes
    of being into which many people feel.


    Sometimes birds return to their cages when the door is open, sometimes people
    free to make their own choices choose to abandon that power. For a flickering
    moment in the plaza, I felt vividly, viscerally, what they were offering and why
    it was alluring to people my age: the possibility of handing back all the weight
    of responsibility that comes with adulthood, of not having to make decisions every
    day or deal with the consequences of'
  merge: -1
  pgno: 12
- img_proc: true
  md: 'those decisions, the possibility of returning to something like childhood and
    arriving at a semblance of certainty that was not hard-won handed over. I could
    feel the freedom from agency buried in that surrender of freedom, but I loved
    my independence and privacy and agency and even some of my deep solitude, and
    there was never a chance that I was going to give them up.


    I’ve met people who came from happy families who seemed to have little work to
    do as adults; they would carry on as they had been taught; they were the acorns
    that didn’t fall far from the tree; they were on a road that didn’t fork or they
    had no journey at all, because they had arrived before they set out. When I was
    young, I envied the comfort of their certainties. When I was older, I felt the
    opposite about lives not requiring so much self-inversion and inquiry. There was
    real freedom to being on my own and a certain kind of peace to being accountable
    to no one.


    I meet young people who seem clear their needs and selves, their emotions and
    others’ feelings, in ways that seem astonishing to me. I was a wayaring stranger
    in that country of inner life, and my attempts to orient myself and find a language
    to describe what was going within would be slow, stumbling, and painful. If I
    had luck in all this, it was the luck of being able to continue to evolve, of
    being someone gradually, imperceptibly changing, sometimes by intention, sometimes
    by increments and impulses invisible to me. By being an acorn that kept rolling.
    In that little apartment I found a home in which to metamorphose, a place to stay
    while I changed and made a place in the world beyond. I accrued skills and knowledge
    and eventually friends and a sense of belonging. Or rather grew to find that the
    margins could be the richest place, the perch between realms you could enter and
    exit.


    It’s not just that you’re an adolescent at the end of your teens, that adulthood,
    a category into we put everyone who is not a child, is a constantly changing condition;
    is as though we didn’t the long shadows at sunrise and the day of morning are
    different from the flat, clear light of noon when we call it all daytime. You
    change, if you’re lucky, strengthen yourself and your purpose over time; at best
    you are gaining orientation and clarity, in which something that might be ripeness
    and calm is filling in where the naïvet and urgency of youth are seeping away.
    As I get older, now even people in their twenties seem like children to'
  merge: -1
  pgno: 13
- img_proc: true
  md: 'ignorance, but in a kind of newness, a quality of discovering many things for
    the first time, and of having most of their life ahead of them, and most of all
    of of being engaged in the heroic task of becoming.


    Sometimes I now envy those people who are at the beginning of the long road of
    the lives they''ll make, who still have so many decisions ahead as the road forks
    and forks again. Imagining their trajectories, I picture a real road, branching
    and branching, and I can feel it, shadowy, forested, full of the anxiety and the
    excitement of of choosing, starting off without quite knowing where you will end
    up.


    I have no regrets about the roads I took, but a little nostalgia for that period
    when most of the route is ahead, for that stage in which you might become many
    things that is so much the promise of youth, now that I have chosen and chosen
    chosen again and again and am far down one road and far past many others. Possibility
    means that you might be many things that you are not yet, and it is intoxicating
    when it''s not terrifying. Most of the forks in the road I''d confront rose up
    before me when I lived in that luminous home that Mr. Young made possible for
    me.'
