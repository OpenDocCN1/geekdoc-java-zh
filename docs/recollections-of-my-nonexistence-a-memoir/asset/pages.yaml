  md: 'It''s written in pencil on a large sheet of now-yellowed newsprint whose bottom
    half has the wide-ruled lines for beginning writers, I''m pretty sure it''s my
    first essay, from first grade. In its entirety, it reads, “When I grow up I will
    never get married.” The illustration on the top shows a man in a red shirt whose
    black hair wraps like a nimbus around his circular head and a yellow-haired woman
    in a flounced purple skirt. “Get married with me,” he says in a cartoon balloon,
    and she says, “No, no.”


    It''s comic and horrible, a sign that I was looking at my mother''s life and thinking
    that whatever I did, I would try not to do what she did, because she so felt trapped
    and powerless in a violently miserable marriage. I am at the time. The offspring
    of a victim and her victimizer, of a story that couldn''t be told. Most conventional
    stories for girls and young women ended in marriage. Women vanished into it. The
    end. And what happened and who were they? The fairy tale “Bluebeard” is about
    a woman who finds out, by disobeying her orders and using the forbidden key to
    unlock the torture chamber of her predecessors'' corpses, that she''s married
    a serial killer, whose intent to kill her is whetted by her knowledge. It''s an
    unusual fairy tale that she survives and does not.


    I''d just rejected the principal story for women, and I''d soon elect to try put
    myself in charge of stories. That is, the first year of literacy, after a brief
    period when I wanted to be a librarian because they spent their days with books,
    I realized someone actually wrote each book, and decided that that''s what I wanted
    to do. Such an unwavering goal from early on simplified my path, the task of writing
    is never simple. Becoming a writer formalizes the task that faces us all in making
    a life: to become conscious of what the overarching stories are and whether or
    not they serve you, and how to compose versions for who you are and what you value.


