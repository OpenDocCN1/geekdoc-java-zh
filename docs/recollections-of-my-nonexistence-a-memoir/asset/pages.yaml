    who dissolved into the story, got lost in it, learned to lose myself as a retrieve
    from that task of being a child and then a woman and the particular child and
    woman was. I hovered about many times and places, worlds and cosmologies, dispersing
    and gathering drifting. A line by T. S. Eliot, the first poet whose work I got
    to know, comes to mind: "prepare a face to meet the faces that you meet." Alone,
    immersed in a book, I was faceless,, unbound, elsewhere, free of meetings. I wanted
    to be someone, to make a face and a self and a voice, but I loved these moments
    of reprieve. If moments are the words: they were not intermissions in a normal
    social life; they were the life itself interrupted by social interludes.


    There is something astonishing about reading, about that suspension of your own
    time and place to travel into others''. It''s a way of disappearing from where
    you—not quite entering the author''s mind but engaging with it that something
    arises between your mind and hers. You translate words into your own images, faces,
    places, light and shade and sound and emotion. A world arises in your head that
    you have built at the author''s behest, and when you''re present in that world
    you''re absent from your own. You''re a phantom in both worlds and a ghost of
    sorts in the world that is not exactly the one the author wrote but some hybrid
    of her imagination and yours. The words are instructions, the book a kit, the
    full existence of the book something immaterial, internal, an event rather than
    an object, and an influence and a memory. It''s the reader who brings the book
    to life.


    I lived inside books, and though it''s often assumed that we chose books to travel
    through them to get to the end, there were books I took residency in, books I
