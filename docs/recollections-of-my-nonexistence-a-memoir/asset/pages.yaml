  md: 'And Catherine—a darkly beautiful young artist with tawny shoulders in a sleeveless
    white jumpsuit—and I began talking. We became close friends, perhaps best friends,
    for years after, had a falling out that kept us apart for years, then I dreamed
    of her one night and ran into her on the street in the morning—she had moved to
    San Francisco at that point—and we exchanged phone numbers and picked up where
    we left off. I am not a proper memoirist writer that I cannot reconstruct a convincing
    version of any of our conversations, even the one last summer in the house where
    she lives in Albuquerque with her husband and two kids and some dogs.


    Those conversations were analytical, confessional, usually punctuated with gales
    of laughter, taking up the pieces of our education, the ideas and pigeonholes,
    and trying them to see how they fit our urgent needs. I remember how amused we
    were one time as we rejected the earth-mother ecofeminism of the moment by noting
    that our mothers—squeamish, anxious, repulsed by human bodies and their smells
    and secretions—were not in the least like nature. And of course in those early
    years we talked about the boys we were pursuing or disentangling from, that was
    mixed with boxes, politics, ideas, projects, and plans.


    When we were eating breakfast in the yard of Meridel and Jerry''s house a day
    or two after I first met her, Catherine told me, as she watched me untangling
    my damp hair, about going to the pueblo corn two days before seeing women with
    hair down to the hems of their long dresses, and then about the job she''d had
    photographing the students at a Native American school and how one of the girls
    told her about cutting off her long braids. The story found its way into an essay
