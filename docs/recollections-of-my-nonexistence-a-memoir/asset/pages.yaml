  md: 'At ten in the morning, I found the heart of the ranch—the house, corrals, outbuildings,
    trailer—almost deserted. The conflict had happened elsewhere, on horseback, with
    the federal roundup team going after the livestock and the Shoshone runners interference
    on some of the Danns'' tough saddle-broke mustangs. Carrie had argued about land
    rights and treaties with the federal agent and the local sheriff at the portable
    corral some of her cattle had been herd into, and the agent grabbed her arm to
    try hide her from intervening. She broke her grip and jumped into the corral and
    blocked the loading of the cattle. Unwilling to escalate, they went away. She
    won the battle, though the war dating back to the 1850s didn''t end.


    The struggle was never resolved, through difficulties, through conflicts within
    the tribe, through changing times, the arrival of gold mines that scraped and
    developed and polluted their valley and pumped out its water and flooded the Dann
    family cemetery. I said about their stalemate and the government''s war of attrition
    and grateful for my time with them. But the larger shift taking place made me
    hopeful as never before. I saw the power of people on the margins to change foundational
    stories, saw something absolutely unforeseen emerge, saw how, as those changes
    spread, signs and school textbooks, monuments, place names, land management practices,
    and sometimes times changed, how museums gave back the bones and the relics to
    the people whose ancestors and treasures they were, how gradually all these things
    meant something more important and less tangible.


    It did not mean that everything was fine, but it was a profound shift with practical
    consequences, including in the understanding and management of natural systems
    and places. That transformation convinced me that culture could change politics,
    that representations could shape reality, what we did as writers and historians
    mattered, that changing the story of the past could change the future. It was
    the genesis of a profound hope for me about the possibility of deep, unanticipated
    change and the capacity of those deemed marginal or insignificant to bring it.
    The rising visibility and power of Native nations in the Americas felt like a
    piece with the nonviolent revolutions that had toppled the totalitarian regimes
    in Eastern Europe in 1989 and the dissolution of the Soviet Union a few years
    later, which I followed closely, with exhilaration.'
