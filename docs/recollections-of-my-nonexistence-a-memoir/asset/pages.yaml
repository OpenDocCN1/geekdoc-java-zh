- img_proc: true
  md: 'and Carrie Dann’s last day in court, in Reno, Nevada, in late spring of 1991.
    I did so. Their troubles begun in 1973, when a federal agent asked why she wasn’t
    paying grazing fees on her cows. She told him that it wasn’t federal land, and
    she was right that the treaty the Western Shoshone signed in 1863 did not cede
    their territory. The Danes pushed their claim all the way to the Supreme Court.
    The government invented a date that it had taken the land in the 1870s, a date
    that described no actual event, and decided it could compensate the tribe for
    the land in 1872 prices without interest. The traditionalists, catalyzed by the
    Danns, refused to accept the payment.


    After the court case ended, Bob introduced me to Western Shoshone environmental
    organizer Virginia Sanchez, and she asked me to write an overarching history of
    Western Shoshone land rights for a small environmental publication. I took the
    assignment eagerly, and it began by spending several days in the archives of the
    University of Nevada in Reno. There sat in a straight chair pooling through the
    microfilm of the CIA—the Commission on Indian Affairs that preceded the Bureau
    of Indian Affairs—reading, printing out, and taking notes on the reports of field
    officers in Nevada in the 1860s and 1870s. The reels of microfilm were scored
    with horizontal scratches, and the letters were all written in beautiful copperplate
    handwriting that was hard to decipher, but what they became increasingly clear.


    The neatness of the words unfurling in arcs and curves around hand-ruled pages
    suggested a kind of orderliness and propriety reaffirmed by the elaborate politeness
    in the salutations and signoffs in these letters about genocide. About how to
    push the Native people out of the way as whites flooded west and subjugate them
    and let their resources pillaged, how to contain them and give them handouts as
    their homelands were so degraded that food sources vanished. We would like the
    people involved in monstrosity to be recognizably monstrous, but many of them
    are diligent, unquestioning, obedient adherents to the norms of their time, trained
    in what to feel and think and what not to know. The men who wrote these reports
    seemed earnest bureaucrats, sometimes sympathetic to the plight of the people
    they were helping to exterminate, always convinced of their own decency. Decency
    is the innocence that constitutes the crime.


    Somewhat relieved of mine, I became a member of the Western Shoshone Defense Project
    when it was created the next spring to support'
