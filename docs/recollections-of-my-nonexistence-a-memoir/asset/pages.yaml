  md: 'Growing up, we say, as though we were trees, as though altitude was all that
    there was to be gained, but so much of the process is growing whole as the fragments
    are gathered, the patterns found. Human infants are born with cranium made up
    of four plates that have not yet knit into a solid dome so that their heads can
    compress to fit through the birth canal, so that the brain within can then expand.
    The seams of these plates are intricate, like fingers interlaced, the meander
    of arctic rivers across tundra.


    The skull quadruples in size in the first few years, and if the bones knit too
    soon, they restrict the growth of the brain; and if they don’t knit at all the
    brain remains unprotected. Open enough to grow and closed enough to hold together
    is what a life must also be. We collage ourselves into being, finding the pieces
    of a worldview and people to love and reasons to live and then integrate them
    into a whole, a life consistent with its beliefs and desires, at least if we’re
    lucky.


    The city was my great teacher in the 1980s, and first book came out of what I
    learned from wandering streets and neighborhoods, from encountering subcultures
    and enclaves. The second came out of what the vast spaces of the mountains and
    deserts the people there had to teach, and the lessons were magnificent, tremendous,
    sometimes terrifying, and the places brought new friends and a new sense of self.


    At some point in my midenties, the childhood passion I had had for natural places
    had returned with a new intensity; I found epiphani and a sense of liberty in
    the wild places—forests, grasslands, coastline—of my own region and began to study
    the cultural history of ideas and representations and desires for nature and place
    and landscape, first through art and history, then through environmental literature
    and cultural histories, and then to write about it.


    I began exploring and camping, wandering first in local places and English ideas
    of landscape and then into what lay out over the horizon, the American West, the
