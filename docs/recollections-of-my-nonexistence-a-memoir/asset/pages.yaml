  md: 'I mentioned a “long essay to work it out for myself—about my penchant for long
    solitary walks at night, the danger involved (I''ve given it up. I was nearly
    assaulted a few weeks ago) and how it affects my attitude toward feminism—of what
    value are the advances made in the last decades when one''s physical freedom has
    become so severely jeopardized. Most urban women, you live, as though in a war
    zone. . . . There''s a price to pay either—a year and a half of living dangerously
    has warped my mind. This essay is going to be a mammoth prose poem, an analysis
    of (or at least a hymn to) the nature of the night itself.”


