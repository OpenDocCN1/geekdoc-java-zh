  md: 'For the next eight years, I paid my rent every month by buying a money order
    and signing her name rather than mine to it. The lease specified that the person
    who''d signed it be the person who lived there, so I did not officially exist
    in my home that was not officially mine. I would end up spending so many years
    there, I felt for a long time that I might be chased off at any time and should
    be as invisible as possible, which reinforced a tendency toward furtiveness, a
    habit of trying to go undetected, that I''d developed as a child. At some point,
    the property management company found out that the resident was not the signer
    of the lease and asked the building manager what was going on. He vouched for
    me as a quiet, responsible tenant, and nothing happened, but I still felt precarious.


    James V. Young was the building manager''s name. I always called him Mr. Young.
    Sometimes or he mentioned that I was the first white person to live in the building
    in seventeen years. The other residents were mostly older couples, though a single
    mother and her friendly daughter lived in another one of the studio apartments
    in that building, which had seven apartments opening off the stairwell on two
    stories, above a ground floor of garages. That I had moved into a black neighborhood
    was something I had not grasped; it would teach me many things over the years
    to come, and I would stay so long that when I left, I left a middle white place
    whose buildings remained largely unchanged beyond fresh paint, but where everything
    else was transformed and something vital died.


    I changed too; the person who moved out in the twenty-first century was not the
    person who''d arrived all those years before. There is a thread of continuity.
    The child is mother of the woman, but so much happened, so much changed, I think
    of that spindly, anxious young woman as someone I knew intimately, someone I wish
    I could have done more for, someone I feel for as I often do for the women her
    age I meet now; that long-ago person was not exactly me, not like me at all in
    crucial ways, but anyway, an awkward misfit, a daydreamer, a restless wander.'
