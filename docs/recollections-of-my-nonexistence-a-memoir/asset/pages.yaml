  md: 'Despite Lewis book, I soaked novels’ impossibly dramatic notions of love and
    romance and their myths of completion and ending. And I got something most women
    got, an experience of staring at women across a distance or being in worlds where
    they barely existed, from Moby-Dick to Lord of the Rings. Being so often required
    to be someone else can stretch the sense of self. You should be yourself of the
    time. You should be with people who are like you, who are facing what you''re
    facing, who dream your dreams and fight your battles, recognize you. And then,
    other times, you should be like people unlike yourself. Because there is a problem
    as well in which empathy takes over, empathy has a capacity to shape-shift and
    roam out of your soul self. One of the convenient afflictions of power is a lack
    of this imaginative extension. For many men it begins in early childhood, with
    almost exclusively given stories with male protagonists.


    The term double consciousness is sometimes used for black experience in a white
    culture. U. E. B. DuBois famously wrote in the last years of the nineteenth century
    and (wrote, as so many men did up through least James Baldwin, as though people
    were men or even one man) the Negro is a sort of seventh son, born with a veil,
    and gifted with second-sight in this American world,a world which yields no true
    self-consciousness, but only lets him see himself through the revelation of the
    other world. It is a peculiar sensation, this double-consciousness, this sense
    of always looking at one’s self through the eyes of others. Perhaps there should
    be another term for never looking through the eyes of others, for something less
    conscious than single consciousness would convey.


    DuBois’s framework found an echo in John Berger’s 1968 Ways of Seeing, when Berger
    imagined, with generosity and brilliance, what it was to be something he had never
    seen: “To be born a woman has to be born, within an allotted and confined space,
    to the keeping of men. The social presence of women has developed as a result
    of their ingenuity in living under such tutelage with such limited space. But
    this has been at the cost of a woman’s self being split into two. A woman must
    continually watch herself. She is almost continuously accompanied by her own image
    of herself. She has to survey everything she is and everything she does because
    how she appears to others, and ultimately how she appears to men, is of crucial
    importance for what is normally thought of the success of'
