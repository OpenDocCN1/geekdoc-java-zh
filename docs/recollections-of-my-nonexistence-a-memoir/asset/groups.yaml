    It took me ten years and dozens of feminist essays from that morning I wrote “Men
    Explain Things to Me” to realize that I was not talking and writing, after all,
    about violence against women, though I was reading about incessantly. I was writing
    about what it means not to have a voice and making the case for a redistribution
    of that vital power. The crucial sentence in “Men Explain Things to Me” is “Credibility”
    is a basic survival tool. But I was wrong about it’s a tool. You hold a tool in
    your own hands, and you use it yourself. What it does is up to you.


    Your credibility arises in part from how your society perceives people like you,
    and we have seen over and over again that no matter how credible some women are
    by supposedly objective standards reinforced by evidence and witnesses and well-documented
    patterns, they will not be believed by people committed to protecting them and
    their privileges. The very definition of women under patriarchy is designed to
    justify inequality, including inequality of credibility.


    Though patriarchy claims a monopoly on rationality and reason, committed to it
    will discount the most verifiable, coherent, ordinary story told by a woman and
    accept any fantastical account by a man, will pretend sexual violence is rare
    and false accusations count, and so forth. Why tell stories if they will only
    bring forth a new round of punishment or disparagement? Or if they be ignored
    as if they meant nothing? This is how preemptive silencing works.


    To have a voice means not just the animal capacity to utter sounds but the ability
    to participate fully in the conversations that shape your society, your relations
    to others, and your own life. There are three key things that matter in having
    a voice: audibility, credibility, and consequence.


    Audibility means that you can be heard, that you have not been pressed into silence
    or kept out of the arenas which you can speak or write (denied the education to
    do so—or, in the age of social media, harassed and threatened and driven off the
    platform, as many have)


    Credibility means that when you get into those arenas, people are willing to believe
    you, by which I do not mean that women never lie, but that stories should be measured
    on their own terms and context, rather patriarchy’s insistence that women are
    categorically unqualified to speak, emotional rather than rational, vindictive,
    incoherent, delusional, manipulative.


    To be a person of consequence is to matter. If you matter, you have rights, and
    your words serve those rights and give you the power to bear witness, make agreements,
    set boundaries. If you consequence, your words possess the authority to determine
    what does and does not happen to you, the power that underlies the concept of
    consent as part of equality and self-determination.


    Even legally women''s words have lacked consequence: in only a few scattered places
    on earth could women vote before the twentieth century, and not so many decades
    ago, women rarely became lawyers and judges; I met a Texas woman whose mother
    was among the first women in her region to serve on a jury, and I was an adult
    when the first woman was appointed to the U.S. Supreme Court. Until a few decades
    ago, wives throughout the world, including the United States, lacked the right
    to make contracts and financial decisions or even to exercise jurisdiction over
    their bodies over their husbands'' ability to do so; in some parts of the world,
    a wife is still property under the law, and others choose her husband. To be a
    person of no consequence, to speak without power, is a bewildering awful condition,
    as though you were a ghost, a beast, as though words died in your mouth, as longer
    traveled. It is almost worse to say something and have it not matter to be silent.


    Women have been injured on all three fronts—as men of color and nonwhite women
    doubly so. Not allowed to speak or punished for speaking or excluded from the
    arenas—courts, universities, legislatures, newsrooms—where decisions are made.
    Mocked or disbelieved or threatened if they find a place to speak, and routinely
    categorized as inherently deceitful, spiteful, delusional, confused, and unjust.
    Or they speak up and it is no different than remaining silent; they have told
    their stories and nothing happens, because their rights and their capacity to
    bear witness don''t matter, so their voices are just sounds that blow away on
    the wind.


    Gender violence is made possible by this lack of audibility, credibility, and
    consequence. We live inside an enormous contradiction: a society that by law and
    preening self-regard insists it is against such violence has by innumerable strategies
    allowed that violence to continue unchecked; better and far more frequently protected
    perpetrators than victims; and routinely punished, humiliated, and intimidated
    victims for speaking up, from workplace harassment cases to campus rape cases
    to domestic violence. The result makes crimes invisible and victims inaudible
    people of no consequence.


    The disregard for a woman’s voice that underlies sexual violence is inseparable
    from the disregard after a woman goes to the police, the university authorities,
    her family, her church, the courts, the hospital for a rape kit, and is ignored,
    discredited, blamed, shamed, disbelieved. They are both assaults on the full humanity
    and membership of a person in society, and the devaluation of the latter area
    enables the former. Sexual assault can only thrive in situations of unequal audibility,
    credibility, and consequence. This, far more than any other disparity, is the
    precondition for epidemic gender violence.


    Changing who has a voice with all its power and attributes doesn’t fix everything,
    but it changes the rules about what stories will be told and heard and who decides.
    One of the measures of this change is the many cases that were ignored, disbelieved,
    dismissed, or found in favor of the perpetrator years ago that have had a different
    outcome in the present, because the women or children who testified have more
    audibility, credibility, and consequence now than they did before. The impact
    of this epochal shift that will be hardest to measure will be all the crimes that
    won’t happen because the rules have changed.


    Behind that change are transformations in whose rights matter and whose voice
    will be heard and who decides. Amplifying and reinforcing those voices and furthering
    that change was one of the tasks I put the voice I gained as a writer and as a
    survivor.


    # Afterword: Lifelines


    One day in New Orleans in late 2013 I was sitting behind a table in a narrow room
    signing books for a long line, along with my coeditor, native New Orleansan Rebecca
    Snedeker, when a woman took my hand in and began to read my palm. The book was
    our atlas of that city, my fifteenth or sixteenth book, depending on how you count
    them. I''d come to New Orleans six months after Hurricane Katrina, on Easter weekend
    of 2006, and been drawn into the untold stories of the storm and its aftermath,
    gone involved in trying to expose some of the racial crimes, which I prodded investigative
    journalists to look at and wrote in my 2009 book about disasters and the remarkable
    societies that arise in the wreckage, A Paradise Built in Hell.


    I''d shown up in New Orleans to look at what was ugly about the city: poverty
    and racism and more than 1,500 people had died of those in the flooded city as
    they were first abandoned and then attacked and prevented from evacuating and
    receiving relief, died of stories that demonized and dehumanized them. And I''d
    fallen in love with what was most beautiful about New Orleans, including the way
    that inhabitants were being good in here and now, being out in public and knowing
    where they were and celebrating in the streets and connecting with the people
    around them and remembering the past that shaped their present. They had a talent
    for valuing things other than productivity and efficiency, the miserable virtues
    that hustle people past each other and everyday attentiveness and pleasure.


    That unhappiness might be why a woman was confident she could hold up the long
    line to read my palm; I knew New Orleans could take the delay in stride, and I
    let her take charge of my hand and override my own sense of obligation to keep
    things moving. I don''t believe in palmistry or any other form of divination,
    but I believe in stories that come by any means, and in capacities strangers have
    to be messengers and mirrors in which you see new possibilities. Her parting words
    were “Despite everything, you are who were meant to be," and I kept them like
    a talisman. Despite everything, she said, which I heard as the obstacles and injuries
    in billions of lives. I know how profoundly things have changed

