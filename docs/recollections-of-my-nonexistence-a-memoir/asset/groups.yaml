    friendless, I went to look at an apartment for rent. I''d found the listing in
    the want ads of the newspaper, a few tiny lines of information in that dense gray
    grid, mostly describing places out of mine. People had laughed at me when I said
    I was looking for something for $200 a month, rock-bottom price even then, but
    I couldn''t afford more that last semester of my undergraduate education, third
    year of my financial independence.


    At the time I went house living in a tiny room with a window onto la shaft that
    was nevertheless luxurious for having its own bathroom in that residential hotel
    whose other rooms shared bathrooms down the hall. The entire building shared a
    single dimly lit kitchen where your food would be stolen from the refrigerator
    or swarmed over by roaches or both. The other residents were people whose lives
    seemed to have not turned out. I was nineteen and my life had not turned out yet;
    I was early in the process of trying to figure out who and how to become, the
    usual task for someone that age. (I had taken the GED at fifteen and started community
    college full at sixteen, transferring to a four-year college at seventeen; at
    nineteen I was a senior at San Francisco State University, the working-class college
