    ## Life During Wartime


    ![](img/db14ca6438d37a021682af27273dff1e_30_0.png)


    A friend gave me a desk not long after I moved into the apartment, a woman’s small
    writing desk or vanity, the one I am writing on now. It’s a dainty Victorian piece
    of furniture, with four narrow drawers, two on each side and a broader central
    drawer above the bay in which the sitter’s legs go, and various kinds of ornamentation—doweled
    legs, each with a knee, knobby ornaments, scallops on the bottom of the drawers,
    drawer pulls pulls pulls like tassels or teardrops.


    A year or so before she gave me the desk, my friend was stabbed fifteen times
    by an ex-boyfriend to punish her for leaving him. She almost bled to death; she
    had emergency transfusions; she was left with long scars all over her body, which
    I saw then without response because whatever capacity had been muffled, when I
    got habituated to violence at home, maybe because it was something we were supposed
    to take in stride and be nonchalant, but when we of all had language to talk about
    such violence or an audience ready to listen.


    She survived; she was blamed for what happened as victims were often then; there
    were no legal consequences for the would-be-murderer; she moved far from where
    it happened; she worked for a single mother who was evicted, and who gave her
    the desk in lieu of wages; and then she gave it to me. She moved on and we lost
    touch for many years, and then reestablished it, and she told me the full story,
    a story that could make your heart fire and the world freeze over.


    Someone tried to silence her. Then she gave me a platform for my voice. Now I
    wonder if everything I ever written is a counterweight to that attempt to reduce
    a young woman to nothing. All of it literally arisen from that foundation that
    is the desktop.


    Sitting at desk to write this, I went to the online photography archive of the
    city that public library maintains, hoping to recall a little of what the old
    neighborhood looked like. The fourth photograph for the street I lived on from
    June 18, 1958, of a house block and a half away, and there it caption: “Curious
    passersby down an alley, alongside 438 Lyon Street, where the body of Dana Lewis,
    22, except for a black bra, was found today. Police, after a preliminary examination,
    said bruises on the victim’s throat indicated that she might have been garrotted
    by a length of rope.” It’s clear her death is a spectacle for the newspaper as
    the passersby are described as curious rather than distressed by the sight of
    a corpse.


    SEAMAN


    She was also known as Connie Sublett, and turns out her death got a lot of attention
    in the papers at the time. Mostly, the accounts he blamed her for it, because
    she was a sexually active young bohemian who drank. SEAMAN DESCRIBES CASUAL SLAYING,
    said one headline, with the tag PLAYGIRL VICTIM. SLAYING CLOSED LIFE OF PLAYGIRL
    said in another, which sordid means she had sex, adventures, and sorrows, and
    playgirl means she deserved it. Her age is given as twenty or twenty-four. Dana
    Lewis or Connie Sublett’s ex-husband was said to live at 426 Lyon, where she went
    seeking comfort with him after her boyfriend, a musician, fell to his death at
    a party.


    Al Sublett wasn’t home or didn’t answer, so she wept on his front steps until
    the landlord told her to go away. A sailor, by his own account, offered to get
    her a taxi and killed her instead. The newspapers seem to have taken his word
    that the killing was an accident and while devastated by loss she had agreed to
    have sex with him in an alley. BEATNIK GIRL SLAIN BY SAILOR said one headline,
    though struggling someone to death was an ordinary part of looking for love. “She
    had stars in her eyes and wanted to go all the time,” said her ex-husband. Allen
    Ginsberg, who had taken photographs of Al but not of Connie Sublett, noted her
    death without comment in a letter to Jack Kerouac on June 26, 1958. She was known,
