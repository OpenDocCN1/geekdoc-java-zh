- md: "\nAcross the United States and elsewhere are people who imagine and desire\
    \ and sometimes demand homogeneity as a right, who claim coexistence compromises\
    \ or menaces them. I wonder about them, what it must be like to be the kind of\
    \ person who expected to dominate a country and culture forever and to find safety\
    \ in homogeneity and danger—most imagined, or of a metaphysical variety—in heterogeneous\
    \ society. I was white, but I grew up the daughter of a liberal Irish Catholic\
    \ and Russian Jew in a conservative and sometimes anti-Semitic neighborhood, a\
    \ book-besotted kid in an anti-intellectual town, in a family of boys. I didn’t\
    \ think there were a lot of people exactly like me or that they would ever amount\
    \ to a majority population anywhere. In a homogeneous environment, I felt I stuck\
    \ out in ways that might be punished; to be in a mixed crowd was safer as well\
    \ as more rewarding. Living in a white-minority city, I came to think “like me”\
    \ meant people who loved the same things or held the same ideals.\n\nThere are\
    \ so many ways to disappear. And some were never allowed to appear in the first\
    \ place. San Francisco supervisor Harvey Milk’s aide and close friend Cleve Jones,\
    \ who had a major political career of his own since, wrote in his memoir *When\
    \ We Rise*, “I was born into the last generation of homosexual people who grew\
