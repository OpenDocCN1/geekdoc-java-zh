    ## 4


    The word adult implies that all people who''ve attained legal make up a coherent
    category, but we are travelers who change and traverse the nation of adults. Childhood
    fades gradually in some ways, never ends in others; adulthood arrives in small,
    irregular installments. When you leave home, if you had one, when you start out
    on your own, you''re a new immigrant to the nation of adults, and the customs
    are strange.

