    I did like some things about Kerouac''s prose style, just not the gender politics
    of the three men who were often meant when people talked about the Beats. Those
    politics had contaminated Kerouac''s On the Road for me when I was a teenager.
    I got as far as the protagonist''s encounter with Terry—“the cutest little Mexican
    girl” who he calls “a dumb little Mexican wench” with “a simple and funny mind.”
    And then the protagonist—a lightly fictionalized Kerouac—takes off and leaves
    her. As in the film, woman is a stationary object, a man is a pilgrim and heroic
    wanderer. He''s Odysseus; she''s Penelope, by Homer took an interest in the gallant
    struggle of the woman who stayed home. It seemed to me that I would never be the
    footloose protagonist, that I was closer to the young Latina on the California
    farm who gets left behind, and halfway through I put the novel down. The book
    was going to go without people like me, and I was going to go without it.


    Years before I took the Beats as a subject, I had an even more intense sense of
    erasure at the opening for an exhibition of Ginsberg''s photographs. The walls
    were hung with dozens of inscribed black-and-white prints of his male friends
    in various places, having adventures, having each other, having the world as their
    oyster, and then a print or two of Peter Orlovsky''s mentally ill mother and sister
    sitting on the edge of a bed, sad, stranded, hopeless. They were, as I remember
    it, the only women in the show. As in On the Road and Pull My Daisy, they were
    immobilized objects in a context where freedom and mobility were equated.


    I became silently furious, back in the day when I had no clear feminist ideas,
    swirling incho feelings of indignation and insubordination. A great urge to disrupt
    the event overtook me; I wanted to shout and shout that I was not disrupting it
    because a woman was no one, to shout that since I did not exist my shouting did
    not exist and could not be objectionable. I was, in that room time, clear and
    angry about my nonexistence that was otherwise mostly just a brooding anxiety
    below the surface. But I remained silent; contributing to the sense of women as
    burdensome, crazy, angry, intrusive, unfit was not going to help.


    Often a phenomenon that appears revolutionary because of some new feature can
    be seen as drearily conventional because of others that stood out less at the
    time. The men considered the principal Beats were opening up'
  - '[PAGE 108]


    space to be queer or bisexual, to experiment with drugs and consciousness and
    non-Western spiritual practices and philosophies, try to find white literary equivalents
    to the great experiments of black jazz musicians then, to make of improvisation
    and the American vernacular and pop culture something truly of this time and place,
    not a dressed-up deference to Europe.


    Also, most of them despised women, and in this respect were entirely of their
    time and place, the woman-hating American 1950s, whose mainstream literary lions
    were dubbed few years back the Midcentury misogynists. *Pull My Daisy* one more
    time made me go back to Leslie Fiedler''s 1960 book *Love and Death in the American
    Novel*. The American canon was, in his reading, men''s literature, and although
    he disparaged most of the men he considered, he disparaged women by not considering
    them. He noted that the overarching theme of *Huckleberry Finn* and *Moby-Dick*
    and some of James Fenimore Cooper''s frontier novels was the love between a white
    and a non man and that this literature took place in the wide-open American spaces
    where men were there to roam and women were absent. “As boys'' books we should
    expect them shyly, guiltlessly as it were, to profess a chaste love as the ultimate
    emotional experience—and this is spectacularly the case.” A little less caste
    in the Beats, but no boyish.


    And later on his notes of the women in these books, “Only in death can they be
    joined in an embrace as pure as that of males. The only good woman is a dead woman!”
    I didn''t shout that day, but I did have my revenge on another one of the holy
    trinity of the Beats one February in my early twenties. I had just begun to publish,
