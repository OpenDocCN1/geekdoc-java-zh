    I mentioned a “long essay to work it out for myself—about my penchant for long
    solitary walks at night, the danger involved (I''ve given it up. I was nearly
    assaulted a few weeks ago) and how it affects my attitude toward feminism—of what
    value are the advances made in the last decades when one''s physical freedom has
    become so severely jeopardized. Most urban women, you live, as though in a war
    zone. . . . There''s a price to pay either—a year and a half of living dangerously
    has warped my mind. This essay is going to be a mammoth prose poem, an analysis
    of (or at least a hymn to) the nature of the night itself.”


    That essay was never quite written, though I often wrote in praise of darkness,
    sometimes trying to reverse the metaphors in which good is light or white and
    black and darkness is evil, with problematic racial overtones, and I eventually
    wrote a book Hope in the Dark. Years after this letter, my time in the desert
    taught me to love shade, shadows, and as a reprieve from the burning heat and
    light of day. And four years after that ambitious proposition to write about gender
    and night, I wrote for the first time about violence against women and the ways
    that thwarted and limited our access to public space and freedom of movement and
    equality in any and all arenas and then I wrote about it again and again.


    When I wrote my book on walking almost twenty years later, I quoted Sylvia Plath,
    who declared when she was nineteen, “Being born a woman is my awful tragedy. My
    consuming desire to mingle with road crowds, sailors and soldiers, ballroom regulars—to
    be part of a scene, anonymous, listening, recording—all is spoiled by the fact
    that I am a girl, female always in danger of assault and battery. My consuming
    interest in men and their lives is often misconstrued as a desire to seduce them,
    or as an invitation to intimacy. Yes, God, I want to talk to everybody as deeply
    as I can. I want to be able to sleep in an open field, to travel west, to walk
    freely at night.” Reading the passage long after I put it in the book, I wondered
    about she might have been if she''d had the freedom of the city, as they used
    to call it, and of the hills, and of the night, of how her suicide in her kitchen
    at thirty must have been part of the confinement of women in domestic spaces and
    definitions.


    Children are diurnal animals. Nocturnal life to a newcomer to adulthood was almost
    synonymous with the new world of sensuality and sexuality, of freedom of movement
    and exploration, with a lingering sense that the rules'
  - '[PAGE 68]


    fade little when the sun goes down. Nightlife. Nightclubs. Nightmares.

    Patti Smith’s first hit. “Because the Night,” had come out only a few years earlier,
    telling us that the night belongs to lovers and to love. Love is made mostly in
    dimness or darkness, and darkness—the failure of sight, the most rational of the
    senses, the awakening of the other senses, the otherworldlyness that the world
    takes on when it turns away from the sun and faces out into the galaxy—can itself
    be an erotic embrace.


    My bohemian aunt had given me a copy of Djuna Barnes’s Nightwood when I was eight,
    and I had fallen in love with that brief novel did with words and with its romantic
    extravagance about pain and loss. It’s mostly remembered as a lesbian novel now,
    and at the level of Nora Flood for the elusive Robin Vote forms the bones of its
    plot most solely in Paris. But the ode-like monologues by the garrulous cross-crossing
    garret-dwelling doctor Matthew O’Connor, “an Irishman from the Barbary Coast (Pacific
    Street, San Francisco) whose interest in gynaecology had driven him half around
    the world,” dominate it. He is an expert on the night, on night as the mysteries
    of the human heart and the fluidity of who we are and the foolishness of who we
    think we are and what we think we should have and hold. “Every day is thought
    upon and calculated, but the night is not premeditated,” he tells Flood. “The
    Bible lies the one way but the night-gown the other. The night, ‘Beware of that
    dark dort!’


    He’s an oracle akin to the transgender Tiresias in Oedipus Rex, someone who understands
    men and women and the things they want and imagine and do together and alone.
    Night is the space in which poetic intuition, not logic, prevails, in which you
    feel what you cannot see, and perhaps in some sense he is the night itself, or
    its oracle and priestess. In letter to that old friend of my late teens, I was
    saying that I wanted to bring Barnes’ lyricism to my immediate experience, to
    wed the poetics of what I wanted and the politics of why I had trouble reaching
    it. To whom does the night belong? It did not seem to belong to me.'
