    Sometimes a gift is given and neither giver nor recipient knows what its true
    dimensions are, and what it appears to be at first is not what it will be in the
    end. Like beginnings, endings have endless recessions, layers atop the layers,
    consequences that ripple outward. One winter Sunday when I was young, ignorant,
    poor, and almost friendless, I went to look at an apartment for rent. I''d found
    the listing in the want ads of the newspaper, a few tiny lines of information
    in that dense gray grid, mostly describing places out of mine. People had laughed
    at me when I said I was looking for something for $200 a month, rock-bottom price
    even then, but I couldn''t afford more that last semester of my undergraduate
    education, third year of my financial independence.


    At the time I went house living in a tiny room with a window onto la shaft that
    was nevertheless luxurious for having its own bathroom in that residential hotel
    whose other rooms shared bathrooms down the hall. The entire building shared a
    single dimly lit kitchen where your food would be stolen from the refrigerator
    or swarmed over by roaches or both. The other residents were people whose lives
    seemed to have not turned out. I was nineteen and my life had not turned out yet;
    I was early in the process of trying to figure out who and how to become, the
    usual task for someone that age. (I had taken the GED at fifteen and started community
    college full at sixteen, transferring to a four-year college at seventeen; at
    nineteen I was a senior at San Francisco State University, the working-class college
    out in the windy southwest corner of the city.)


    I got on the Fulton near city and the bus took me to the housing projects, past
    a Fillmore Street where a group of sober black men in suits were gathered outside
    for a funeral, past ornate wooden houses and corner liquor stores, up a rise to
    Lyon Street, where I stepped off, and the bus lumbered on to the Pacific. I found
    the address, a building with a recessed front door that had, like lot of the others
    nearby, an iron gate added for more security. The doorm inside was attached to
    the mail slot with a rusty chain and lock. I rang the manager’s doorbell, trudged
    up the first flight of stairs when he buzzed me in, and met him at the doorway
    of his apartment on the second floor, from which he dispatched to the third floor
    to see the apartment directly above him.


    The place astonished me with its beauty. A corner studio whose main room had a
    south and an east bay window through which light cascaded. Golden oak floors,
    high coved ceilings, and white walls with rectangular panels of molding. Glass-paneled
    doors with crystal doorknobs. A separate kitchen with another east-facing window
    that would explode with morning light when the sun came over the big house across
    the street. It seemed luminous, a little unearthly, a place from a fairy tale,
    immense and exquisite compared to the Spartan single rooms in which I''d mostly
    lived since I''d left home shortly after I turned seventeen. floated around in
    it for a while, then went downstairs and told the manager I wanted. He said, kindly,
    "If you want it you should have it." I wanted it passionately; it was more beautiful
    than anything I''d ever dreamed I could have, and being in it seemed like a dream
    itself.


    He was a big black man of sixty, tall, stout, strong, clearly once handsome, an
    impressive figure with a low, rumbling voice, and if he was dressed that day as
    most days I knew, he was probably wearing overalls. He brought me into his parlor.
    That Bowl Sunday afternoon when a local football team was in the game and a roar
    would go up from homes throughout the neighborhood with every score, he was watching
    black men play the blues on his TV sitting on its own table near the six-sided
    green-felt poker table, the light outside filtered through old-fashioned window-slatted
    blinds over his bay windows. When he handed me the rental application, my heart
    felt. I told him that I had already been turned down by the slumlord management
    company whose name was at the top of the form. One of the employees had disdainfully
    dropped my application into the wastebasket next to his desk while I looked on;
