    among other things, about how much space we are allowed or denied, to speak, to
    participate, to roam, to create, to define, to win.


    One of the struggles I was engaged in when I was young was about whether the territory
    of my own body was under my jurisdiction or somebody else''s, anybody else''s,
    everybody else''s, whether I controlled its borders, whether it would be subject
    to hostile invasions, I was in charge of myself. What is rape but an insistence
    that the spatial rights of a man, and by implication me, extend to the interior
    of a woman''s body, and that her rights and jurisdiction do not cover even that
    territory that is herself? Those alterations on the street were about men asserting
    their sovereignty over me, asserting I was a subject nation. I tried to survive
    all by being an unnoticeable nation, a shrinking nation, a stealth nation.


    At the same time, I was toiling to appear as a writer, to lay claim to having
    something to say, to deserve participation in the conversation that was culture,
    to have a voice, and that meant other contests in other territories. Those came
    little after the years when menace on the street wrecked me with fear and tension.
    And I was trying to have a life, including a love life, which meant appearing,
    attracting, being attracted, and sometimes I enjoyed men, enjoyed my body, my
