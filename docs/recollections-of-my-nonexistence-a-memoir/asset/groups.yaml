    in teens, Anaïs Nin’s evocations of Paris between the wars gave me images that
    could harbor, lives that intertwined, and in the dream of the chrome-legged linoleum
    table, Roxanne Dunbar-Ortiz, one of the guests, who''d presented herself as hand-to-mouth
    bohemian that she really was.


    Next to the stove were two wide sinks, one ordinary kitchen sink to the right,
    one deep laundry sink covered with the old enamelled metal dish that would grow,
    so that I had to lift the lid off and scour it from time to time. Women had washed
    clothes by hand in it, and in the first years I was there, the building''s flat
    roof had a wooden cage for hanging laundry to dry, the last flight of stairs whose
    upper steps crunched with gravel. The kitchen’s original yellow-and-green linoleum
    flooring was worn into something grainy and cracked that was impossible to keep
    clean, so I painted it black and then painted it again and again. But the light
    streamed into the kitchen every summer morning, into the other room’s east-facing
    bay window and trickled through the bay window all day in winter. That last window
    faced Fulton Street and a streetlight, and sometimes I would sit there transfixed
    watching the fog cascade over itself like gargantuan tumbleweeds under the streetlight,
    as the wind pushed it from the cold ocean where it had arisen.


