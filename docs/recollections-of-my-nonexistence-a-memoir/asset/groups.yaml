    I got on the Fulton near city and the bus took me to the housing projects, past
    a Fillmore Street which where a group of sober black men in suits were gathered
    outside for a funeral, past ornate wooden houses and corner liquor stores, up
    a rise to Lyon Street, where I stepped off, and the bus lumbered on to the Pacific.
    I found the address, a building with a recessed front door that had, like lot
    of the others nearby, an iron gate added for more security. The doorm inside was
    attached to the mail slot with a rusty chain and lock. I rang the manager’s doorbell,
    trudged up the first flight of stairs when he buzzed me in, and met him at the
    doorway of his apartment on the second floor, from which he dispatched to the
    third floor to see the apartment directly above him.'
