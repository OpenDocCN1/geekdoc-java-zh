    Hopscotch: back up a little, cover the same ground again. My father had died while
    traveling on the other side of the world in the first days of 1987, and with his
    death it became safe enough to thaw out a little and to open up what had been
    closed. I was finally having emotions in response to events from long before,
    as if they had been something frozen into the ice in that bleak earlier era, and
    because I finally classify the events on my own terms as cruel and wrong. Later
    that year, my longtime boyfriend moved to Los Angeles, the rest of my family was
    particularly difficult for me, and I was living off unemployment insurance from
    the job I''d been laid off after I left the art magazine, some savings, some sums
    dribbling in reviews and essays in local magazines, and some work as office in
    businesses around the city.


    I decided that when you had nothing left to lose you were, and that what I wanted
    to be free to do was to write a book about the community I had discovered—and
    many of whose members I had met—when writing my graduate-school thesis about Wallace
    Berman for years earlier. I sent a book proposal to City Lights Books and it was
    accepted in early 1988, and I got my first book advance, for $1,500. I had wanted
    to write books since shortly after I left the first-grade anti-marriage essay,
    because I loved books more than anything else, because I regarded them as a kind
    of practical enchantment, and the only way to be closer to that enchantment was
    reading them was writing them. I wanted to work with words and see what they could
    do. I wanted to gather up fragments and put them in new patterns. I wanted to
    be a full citizen of that ethereal otherworldly. I wanted to live by books and
    in books and for books.


    It was a lovely goal or rather orientation when it was far away throughout my
    childhood and teens college years, but when it came time to do it—well, the mountain
    is beautiful in the distance and steep you''re on. Becoming a writer formalizes
    something essential about becoming a human: the task of figuring out what stories
    to tell and how to tell them and who you are in relation to them, which you choose
    or which choose you, and what the people around you decide and how much to listen
    to them and how much to listen to other things, deeper and further away. Also,
    you have to write. I had published a lot of essays and reviews by that time, and
    a book—it was like going from building toolsheds to a palace.


    That first book began with that work of art I had seen one day in 1982 on a wall
    by the staff offices of the San Francisco Museum of Modern Art. It was a square
    black-and-white collage by Wallace Berman, a grid of sixteen images of a hand
    holding a transistor radio, across four, down, the same hand and radio each time
    with a different image where the speaker should be on the radio. Among the images
    were human figures, including a nude, a football player, a frail figure that might
    be Gandhi, a human ear, a bat hanging upside, a hypodermic, a gun, and the synonymous
    snake twice on the bottom row. They were negative images, so that everything seemed
    a little dreamy. It was as though each image was a sound translated into sight,
    as though each was a message, a warning, a proclamation, or a revelation. Or a
    song. A few Hebrew letters written on white the black background insisted that
    the mystical and esoteric coexist with pop culture, that some of the old vibes
    were unnecessary or illusory. It had been made with an early version of the photocopy
    machine called a Verifax. It was titled Silence Series #10.


    Berman was, like my father, the child of immigrants Jews, raised in Los Angeles.
    Unlike my father, he was slight, subtle, choosing to live a life on the margins
    of society and the economy, first in the swing and jazz scene in L.A., among mystics,
    dropouts, artists, and rebels. He had, as he''d predicted, died on his fiftieth
    birthday—hit by a drunk driver in a truck as he drove in his sports car on the
    winding, narrow road to his birthday party in one of the canyons on the edge of
    Los Angeles that evening in 1976. After being prosecuted for obscenity for his
    first art in 1957, he''d chosen to keep a low profile. My original title for the
    book was Swinging in the Shadows, taken from a postcard he wrote to the painter
    Jay DeFeio, in which he told her he was going to earn some money and swing back
    into the shadows again, but my publisher overruled on me.


    For the thesis I had pieced together Berman''s life from what people around him
    had to say, what the art told me, from archives and old histories, exhibition
    catalogues and old postcards and letters that people still had on hand. In doing
    so I realized a number of things, including that there had been a California avant-garde
    in the 1950s that had been overlooked in official histories, a series of coteries
    and communities involved in film, poetry, visual art, esoteric and non-Western
    spiritual traditions and practices, and mind-altering drugs. An avant-garde that
    gave rise to the counterculture of the sixties, a realm of experimentation and
    rebellion and reinvention. This was what I wanted to write a book about, not one
    artist, but a community of artists.


    Back then, cultural history was supposed to be a linear business that had unspooled
    in Europe and then in New York, and California was a despised hinterland, a place
    in which nothing much was supposed to have happened. Someone sneered at a friend
    of mine doing a thesis on western history at Yale that "People in California do
    not read books," as though all the poets in the mountains and the scholars in
    the cities and the indigenous storytellers in the ninety-nine native California
    languages from the desert southeast to the rain forests of the northwest boiled
    down to one empty-headed sunbather on a hot beach. In 1941, Edmund Wilson wrote,
    "All visitors from the East know the strange spell of us which seems to make human
    experience on the Coast as a troll nest where everything is out in the open instead
    of being underground." In 1971, Hilton Kramer wrote in the New York Times that
    San Francisco Bay Area was characterized by "the absence of a certain energy and
    curiosity, a certain indispensable complexity and elan" and dubbed the style of
    one of the artists "Dude Dada Dada," though dude ranches were mostly a phenomenon
    of the intermountain West, many hundreds of miles away. Things seem small at a
    distance lack detail, and growing up when you saw California through eastern telescopes
    when you saw it at all. That era of disdain and dismissal did not end when I was
    a young writer.


    In the course of writing that book I worked out for myself why I was grateful
    that we shared a border with Mexico and faced Asia and were farther from the influence
    of Europe that was supposed to convey legitimacy, and I suspected imparted conventionalizing
    impulses, and I came to understand how many writers, from Mark Twain to Seamus
    Heaney to Alexander Chee, had come to get free of something. Many years later
    a student who’d just moved to the Bay Area relayed his distress to me. I''d written
    about the margins, because those in the floodlights can''t see what''s in the
    shadows. The margins are also where authority wanes and orthodoxies weaken. My
    first education in how all this work came from Wallace Berman, who had consciously
    chosen to live on various edges—economically precarious, subcultural, often literally
    on the edge—homes perched on stilts in the canyons of Los Angeles and the salt
    marshes of the Bay Area. From those locales he had been influential for people
    who plunged into the limelight—poets, artists, actors such as Denis Hopper, Russ
    Tamblyn, and Dean Stockwell. One sign of Berman''s influence is his inclusion
    in the collage Club Band; the album cover for the Beatles'' 1967 Sgt. Pepper''s
    Lonely Hearts; another is his small role as another iconic artwork of the era,
    Denis Hopper''s 1969 film Easy Rider. The name of Berman''s hand-printed magazine
    was Semina, from the Latin for seeds and semen, and he was a cultivator of the
    seeds—that''s literally what he does in his cameo in Easy Rider—but also a cultivator
    of the seeds others had sown.)


    To delve into his life and milieu meant interviewing, first for the thesis, then
    for the book, people who I still thought of as grown-ups—adults intimidatingly
    older than me. They were my parents'' generation but they were people who had
    lived their lives as great adventurers, taking risks, not chasing stability, and
    not regretting it. My parents were, even after decades in the middle class, so
    governed by old Depression-era fear of poverty that their lives were cramped and
    cautious. These extravagant peers of theirs provided a fine alternative model
    of how to live one''s life. When I began that book four years after I graduated,
    I didn''t know that I would never really get around to getting a job again. I
    would have endless work, and write a lot of books, and a lot more essays and articles,
    and I''d do some activist work and some teaching, but I''d never really go back
    to being an employee with a salary and a boss.

