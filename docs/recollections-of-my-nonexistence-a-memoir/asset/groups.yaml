    Many years later, in the apartment I currently inhabit, I sat at another kitchen
    table, with a film actress who had come to talk with me about feminism. The next
    day an enormous bouquet arrived with a card quoting back what she liked best of
    what I had said: “It’s not you, it’s patriarchy,” which might be one of feminism’s
    basic messages. That is, there’s nothing wrong with you; there’s something wrong
    with the system that bears down on you and tells you you’re useless, incompetent,
    untrustworthy, worthless, wrong. Marina had in her anecdotes the possibility of
    telling that to the world or to some women in it, and she thought they ought to
    hear it.


    I was an early riser, and was catching up on much-needed sleep, and the attic
    had just two rooms. The kitchen and the daybed on which guests slept were in the
    west. The room was my bedroom and office, with a built-in desktop held up at its
    center by the old spindle-legged desk. So the morning of the 25th, rather than
    disturb her rest, I sat down at desk once again and did her bidding. The essay
    poured out with ease or tumbled seemingly of its own accord. When this happens
