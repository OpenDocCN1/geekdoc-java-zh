    Sometimes having a body seemed to be the problem, having a body that exposed me
    to danger and potential harm and also to shame and shortcomings and the problems
    of how to connect and how to fit in, whatever that meant, whatever feeling I imagined
    people who were confident about their bodies and their movements and their memberships
    felt. Having a body of my gender was a vulnerability and shame so vast that I
    still find myself casting for defenses, for versions of that armor I dreamed of
    my twenties.


    I was convinced that my body was a failure. It was a tall, thin, white body, which
    is supposed to be the best thing to be in terms of the culture as a whole values
    and rates female bodies. I saw my own version of this as a catalogue of wrongnesses
    and failures and confirmed potential shame. The rules about women''s bodies were
    exacting, and you could always measure your distance from the ideal, even if it
    was not a great distance. And even if you got over your imperfections of form,
    the realities of biology, bodily functions and fluids, were always at odds with
    the feminine ideal, and a host of products and jokes and sneers ruined you of
    that. Perhaps it''s that a woman exists in a perpetual state of wrongness, and
    the only way to triumph is to refuse the terms by which this is so.


