    beneficial bacteria in our gut and elsewhere that constitute so vast portion of
    a human body that self is something of a misnom or at least a crowd and maybe
    a party. If you were truly impenetrable you''d be dead in minutes, and there was
    a kind of deadening inertness that was part of the equation of imagining you could
    be.


    James Baldwin famously wrote, "If I am not what you say I, then you are not who
    you think you are." Redefining women and their roles redefined but masculinity
    and vice versa. If the genders were not opposite but a spectrum of variations
    on some central theme of being human, if there were many ways to execute your
    rule or refuse it, and liberation for each gender was seen as being allowed to
    take up what had been considered the proper role and goods and even feelings of
    the other or find some third (or seventh) way, then the citadel would be broken
    and everyone could travel freely.


    Heterosexual masculinity has often seemed to me a great renunciation, a reputation
    not only of the myriad things that men are not supposed to like, but even a plethora
    of things that they are not supposed to notice. Many of the gay men I knew, and
    one of the pleasures of conversation with gay friends was an acute awareness of
    emotional, aesthetic, and political phenomena, an ability to weigh minute things
    and evaluate nuance and degrees of differentiation.


    These men knew that words could be festive, recreational, medicinal, that banter
    and flirtation and extravagance, that humor and wryness and anecdotes of the absurd
    were pleasures worth pursuing. They knew that talk'
