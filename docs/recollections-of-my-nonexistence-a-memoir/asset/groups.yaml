    It''s often assumed that anger drives work, but most activism is driven by love,
    a life among activists has convinced me. Too, though the remedies for trauma most
    often proffered in our privatized society are personal, doing something for and
    with others, something to change the circumstances under which you were harmed,
    is often an experience of connection and power that overcomes sense of isolation
