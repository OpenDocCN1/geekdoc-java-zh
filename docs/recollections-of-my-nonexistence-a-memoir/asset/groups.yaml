    poverty had around me since birth. My parents had ingested a deep sense of lack
    during the Great Depression or whatever deprivations were contained. I did not
    trust that they would failed me out if something truly horrific, and I was never
    willing to fall apart to find out, so it was not as easily as they had opted into.
    I left it too, but slowly, by my own labors. With the color and my background
    that made me feel fit, in the eyes of others, for an education and white-collar
    work.


    I read standing up in bookstores or got them or searched for months or years to
    find the cheapest used copy; I listened to music on the radio and made cassette
    tapes of friends; I eyed things and was pricked by the promise of make, that pair
    of boots or that shirt will make you need or be, what is incomplete is a hole
    that can be stuffed with stuff, the things you have are eclipsed by having beyond
    what is essential. I always wanted something, something else, and if I got it
    I wanted next, and there was always something the craving gnawed at me so badly,
    with a desire that was sharp it gouged me, and the process of wanting took far
