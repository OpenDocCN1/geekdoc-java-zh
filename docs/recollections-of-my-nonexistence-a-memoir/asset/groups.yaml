    I had never been safe, but I think some of the horror that hit me was because
    for a few years I had thought that maybe I could be, that male violence had been
    contained in the home I grew up in, and so I could leave it behind. I wrote once
    that I grew up in an inside-out world where everywhere but the house was safe,
    and else had seen safe enough as a child in a subdivision on the edge of the country,
    where I roared freely into town or into the hills where both were right out the
    door. I''d learned to leave home and planned to do so since I was a child in single
    digits making lists of what to take to run away. Once I left home I was almost
    never in danger inside my home again, but by then I often felt like the only place
    I was safe.


    At twelve and thirteen and fourteen and fifteen, I had been pursued and pressured
    by adult men on the edge of my familial and social circles, and I''d been the
    target of street harassment in other places. There are absences so profound that
    even knowledge of their absence is absent; there are things missing from our lists
    of missing. So it was with the voice which I could have said "No, I''m not interested,
    leave me alone," I realized only recently.


    We often silenced, which assumes someone attempted to speak. In my case, it wasn''t
    a silencing because no speech was stopped; it never started, or it had been stopped
    so far back I don''t remember how it happened. It never occurred to me to speak
    to the men who pressured me then, because it didn''t occur to me that I had the
    authority to assert myself thus or that they had any obligation or inclination
    to respect my assertions, or that my words would do anything but make it worse.


    I became expert at fading and slipping and sneaking away, backing off, squirming
    out of tight situations, dodging unwanted hugs and kisses and hands, at taking
    up less and less space on the bus as yet another man spread into my seat, at gradually
    dissolving, or subtly absenting myself. The art of nonexistence, since existence
    was so perilous. It was a strategy hard to unlearn on those occasions I wanted
    to approach someone directly. How do you walk right up to someone with an open
    heart and open arms amid decades of survival-by-evasion? All this menace made
    it difficult to stop and trust long enough to connect, but it made it difficult
    to move too, and it seemed sometimes as though it was all meant for me up alone
    at home like a person prematurely in her coffin.


    Walking was my freedom, my joy, affordable transportation, my method of learning
    to understand places, my way of being in the world, my way of thinking through
    my life and my writing, my way of orienting myself. That might be too unsafe to
    do something I wasn''t willing to accept, everyone else seemed more than willing
    to accept it on my behalf. Be a prisoner, they urged cheerfully; accept your immobility,
    walk yourself up like an anchorite! I was driven to go somewhere was partly a
    metaphysical urge to make a life, to become and transform, to do, but literally
    expressed passion and let off pressure; I was never going to give up. It was a
    means of thinking, of discovering, of being myself, and to give it up would have
    meant giving up all those things.


    One day when I was walking past a small park just east of the neighborhood, a
    passerby I''d never seen before sat full in my face without stopping. Even with
    other people around, I was alone: I was harassed more than once but everyone pretended
    nothing was happening, perhaps because a man in a rage intimidated them too, perhaps
    because in those days people more than considered none of their business or blamed
    the woman. Men would make proposals, demands, endeavor to strive up conversations
    and the endeavors quickly turned into fury; I knew of no way to say "No, I''m
    not interested," that would not be inflammatory, and so there was nothing to say.
    There was no work I could do for me, and so I had no words.


    Usually I''d look down, saying nothing, avoid eye contact, my best to be as absent,
    unobtrusive, insignificant as possible—invisible as well as inaudible—since I
    was afraid of escalation. Even my eyes had to learn deferential limits. I erased
    myself as much as possible, because it was to be a target. Those men conducted
    a conversation, sometimes a shouting match, with silence. They shouted I owed
    them, obedience, deference, sexual services. But the time I told off a man—a well-dressed
    white man—who was following me, in the same kind of profanity-laced language he
    was using to me, he was genuinely shocked and then threatened to kill me. It was
    daytime in a tourist district, so he probably wasn''t going to try, but it was
    a frightening reminder of what speaking up achieved.


    It was as though their desire was overtaken by resentment or fury that the desire
    would not be satisfied, that the overtures emerged would be rebuffed, and since
    they knew that in advance, the desire and rage emerged together in obscene, scornful
    propositions, in language that demonstrated their right to say those things and
    my helplessness to suffer the insults. The rage: it was as though I expected me
    to obey strange, as though any woman belonged to any man, as though everyone,
    anyone, owned me except. The words: they had an overabundance, and I had none,
    even though I lived for and by words the rest of the time.


    Even when I spoke to others, my words seemed useless. Late one night, a huge man
