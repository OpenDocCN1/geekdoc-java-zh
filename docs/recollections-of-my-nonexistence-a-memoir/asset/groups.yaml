    血腥的死亡细节或女性的尸体曾是一种标准的剧情设定和审美对象。她的毁灭是男主角实现的自我。对于目标受众来说，这显然是色情的，因为在现实生活中，女性在性犯罪过程中不断不断被杀害，而对侵犯、强奸的恐惧也是对暴力死亡的恐惧。


    这提醒着我，我们，并不是如此艺术作品的预设受众，包括那些被赞誉为杰作并被奉为经典的作品。有时，男主角保护女性（特别是美丽的白人女性）不受其他男人的侵害，保护者是他们权力的的一面，但破坏者仍然是另一面，而无论哪一面都将你的命运掌握在他们手中。他们保护他们认为应该保护或摧毁的东西，有时情节是关于他没能保护好她的悲伤，以及他对其他男人的报仇；而有时他毁灭了自己，而故事则是关于他自己的。


    她在成为尸体之前就已经死了；她只是一个表面、一个卫星、一个配角。在以男性为中心的故事中，将女性的暴力死亡作为情节设定是如此常见，以至于女性为此创造了一个术语——“frid”，源自1999年的“冷冰箱里的女性”（Women
    in Refrigerators）网站，该网站记录了大量女性角色惨的结局。在视频游戏世界，批评视频游戏中厌视女性的年轻女性多年来一直受到死亡和强奸威胁的骚扰。一些人在遭受极其恐怖且详尽的伤害威胁后，不得不离开家并采取极端的安全措施；也就是说，她们不得不消失。保护女性免受网络监控、威胁和骚扰成为了女性主义网络安全专家的兼职。


    在我写这些文字时，出现了一部部关于女性惨无人道的酷刑、杀害和肢解的新剧。有的环绕着1947年洛杉矶22岁的伊丽莎白·肖特（Elizabeth Short）遭受酷刑死亡的过程展开，那场案件被起了一个丑陋的名字“黑莲花杀案”；或者是20世纪70年代的连环虐待者、强奸犯和杀手泰德·邦迪（Ted
    Bundy），由一位帅气的年轻男星扮演。这远不是第一部关于邦迪的电影，而洛杉矶肖特的杀案已经形成了一个小小的出版产业。当Given推出一款名为“黑莲花主题”的香水并以“致命之花”为口号广告时，我我想这是否意味着女性应该渴望闻起来像具破碎的尸体。但即使是古老的民谣也充满了谋杀和严重的身体伤害，就像约翰尼·卡什到滚石乐队再到艾米纳姆的歌曲。


    早期的女性主义者坚持认为强奸关乎权力而非色情快感，尽管对于某些男性来说，他们自己的权力或女性的无助是想象中是最具色性的事情。对于某些女性来说，我们也得知我们的无助和危险是色情的，并在这种自我意识和随之而来的故事中接受或拒绝斗争。雅克奎琳（Jacqueline）在2018年写道：“性骚扰是男性的大表演，男性通过这种行为旨在让他的目标不仅相信他是掌握权力的人（事实确实如此），而且相信他的权力和他的性是同一一的。”


    尽管我经历的每一次事件都被视为某种孤立的变态行为，但有无数这样的事件，而且它们是常态，并非反对或处于常态之外。谈论这一切让人感到不安，他们大多数人的反应是告诉我我做错了什么。有些男人告诉我，他们希望有人对他们进行性骚扰，因为他们看起来很有吸引力。没有人提议帮我识别我所经历的一切，也没有同意我有权获得安全和自由。


    这是一种集体性的煤灯操纵（gaslighting）。生活在一场周围没有人承认那是战争的战争中——我忍不住想这让我变疯了，但女性经常被指责为疯了，以此来削弱她们见证的能力以及她们所证实的现实性。此外，在这些案例中，“疯了”往往是无法忍受之痛苦的委婉说法。所以并没有让我疯掉；它让我感到无法忍受的焦虑、心心旁勃、愤愤和精疲力竭。


    我面临的要么是提前放弃自由，要么以想象中最糟糕的方式失去它。让人们疯掉的一件事是被人告知他们所经历的经历实际上并没有发生过，围困他们的处境是虚拟的，问题都在他们脑子里，如果他们感到痛苦，那是他们失败的，而成功的做法应该是闭嘴或停止感知他们所知的一切。从这种无法忍受的困境中，产生了选择失败和冒险的反叛者，以及选择顺从的囚徒。


    20世纪80年代女性主义运动正如火如荼，对针对女性的暴力有许多见解，甚至还有反对暴力的“夺回夜晚”游行，但那时对我来说还遥不可及。我太年轻了，太沉浸于那种文化不符的环境中，那里看起来大多是年长女性，她们说一种我尚未学会的语言。她们处于我将缓慢跨越的距离，毕竟这一切暴力都会让我变成一个孤独的女性主义者。我在1985年一本朋克杂志的封面故事中写过针对女性的暴力，在90年代的艺术评论和随文中写过，在2000年的一本关于散步历史书中详细阐述了女性在走向世界时面临的所有障碍。


    我非常熟悉一种愤慨，当有人感到所受到的不公没有被认可时；以及一种创伤让受害者成为一个未解决故事的强迫性叙述者。你会一直讲述下去，直到有人通过听到并相信你来解除这个诅咒。我有时也是那个拥有亲身经历的人，但那种感觉某种程度上是我对针对女性暴力的普遍感受。


    当这一切还如此私人化时，我被要求搬到富裕的地方（我一些最激烈的骚扰就发生在这类地方），离开，保持安全，但暴力追随着我。这是一个地理问题，是一个阶级问题，是一个种族问题，也是在一个希望我不成为女性的世界里作为一个女性的问题。这是一个生存问题，这是一个身份认同问题，这是一个所有的问题。


    '
