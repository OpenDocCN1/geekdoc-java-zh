    my grandparents formed my parents, and how public histories shaped our private
    lives in various ways. I’ve lived long enough to know five generations of my family
    and to see how the weight of history that happened two generations before me—hunger,
    genocide, poverty, the brutalities of emigration, discrimination, and misogyny—still
    has consequences two generations after me. I’ve written my obituaries on that
    little desk from the woman who didn’t die and lived in the peace that came after
    they were gone. I''m uninterested in the brutalities of childhood in that part
    that species has been so dwelt upon while some of the brutalities that come after
    have not.


    Threads are usually the metaphor for things that branch and fork and lead in many
    directions, but maybe the many ways are twisted into a thread means that following
    a thread should mean unraveling it or recognizing the individual strands. For
    example, after graduate school, I got hired by a little art magazine as an editorial
    assistant and I quickly became the assistant editor, by title, and more or less
    the managing editor in terms of what I actually did. I learned a lot of things,
    from the rules of copyediting to quite direct a staff order than how to put together
