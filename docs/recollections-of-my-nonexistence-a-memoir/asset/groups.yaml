    I cannot imagine a wholly undamaged being or that''s a useful thing to imagine,
    though I can readily imagine that some of the kinds of damage inflicted on my
    gender can be reduced and delegitimized. I also think the process is under way,
    and that even being told that you deserve to be safe and free can quantify you.
    If I''m both feminist and hopeful it''s because I know how profoundly women''s
    rights and status have changed, in many ways, in many places, since my birth.


    Sylvia Plath at nineteen had mourned “I want to talk to everybody I as deeply
    as I can. I want to be able to sleep in an open field, travel to west, walk freely
    at night” but she felt unable to because of her gender. I was born thirty years
    later and I have been more fortunate. I roared the West, slept in mountain meadows,
    in deserts, at the bottoms of canyons, on the banks of great rivers in the Southwest
    and the Arctic, driven vast distances alone, wandered many cities and some places
    at night, had organized with rebels, blocked streets, met heroes, written books,
    encouraged activists, that the friendships and conversations I earned when I was
    younger, occasionally stood up for what I believed in, had stuck around long enough
    to see the arc of change across time in ways that were terrifying when it came
    to climate change and sometimes exhilarating when it came to cultural politics.
    Also it seems safe to say I''m damaged and a member of a society that damages
    us all and damages women in particular ways.


    There are many stories that can be told about damage. I ran across an essay on
    photographs of environmental destruction recently. The photographs showed the
    Carlin Trend, the belt of microscopic gold that runs through the Western Shoshone
    lands, including Carrie and Mary Dann''s ranchlands, and that would have made
    Nevada, had it been an independent nation, the fourth or fifth biggest gold-producing
    country on earth. I''d visited the mines myself, enormous pits that could swallow
    cities, wounds out of which the water was pumped so the gigantic could keep going
    deeper, as whole mountains were pulverized and other heavy metals released, and
    cyanide-laced water poured through the dust to leach out the gold that so foreign
    corporations could reap a profit and people away could ornament their bodies.
    The precious water of the desert was squandered, poisoned, then dumped into man-made
    lakes that killed the birds who landed in them. Knowing those waters made me hate
    cold.


    The photographs came with an essay quoting another writer who''d worked for eight
    seasons in Antarctica. Jason C. Anthony wrote about the nutritional deficiencies
    among sailors and polar explorers in the past and of their dearly: "Without vitamin
    C


    You can read that as an insistence that we never get over anything, though it
    might make more sense as though damage is not necessarily permanent, neither is
    repair. What is on or changed should have been maintained and protected or it
    can be lost. What goes forward can go backward. Efficiency says grief should follow
    a road map and things should be gotten over and then there should be that word
    that applies to wounds and minds both: closure. But time and pain are a more fluid,
    unpredictable business, expanding and contracting, closing and opening of changing.


    You move toward or away from something that harmed you, or something brings back;
    slippage in time, as though the stairs you exit become a waterfall, is the disorderness
    of trauma and of trauma''s sense of time. But sometimes you revisit the past,
    as I have in this book, to map the distance covered. There is closure and reopening
    and sometimes something reopens because you can bring something new to it, repair
    it in a new way, by understanding it a new way. Sometimes the meaning of the beginning
    of the story has changed as new chapters are added.


    Damage begets a dearest destiny than one might have had otherwise, but it does
    not preclude having a life or making things that matter. Sometimes it''s not despite
    but of something terrible that you become who you are meant to be and set to the
    work you''re meant to do. I heard "meant to be" not though there was no damage
    but that it had not prevented me from doing what I was here to do. And some of
    my work was about that damage as it applied to so many of us. I''ve often wondered
    what people whose work is for justice and rights would''ve in a world without
    the injustices, the lack of rights. Who would Martin Luther King Jr. have been
    in a nonracist society, Rachel Carson in an unpoisoned America? Unless you imagine
    them in a world without pain and harm, they might have found other wounds to heal.
    Paradise is often described as a place with nothing to do, nothing required of
    its inhabitants. I don''t desire a paradise that demands nothing of us, and see
    paradise as not a destination to arrive in, but a pole star by which to navigate.


    The fortune-traveler was a woman, and perhaps as women often do, as I often do,
    she only wanted to give me something to make me feel good, to make that microscopic
    utopia that is a moment of kindness, though even that a stranger wanted to give
    me a gift. A few years ago, a man ran after me at the farmers'' market and handed
    me a little hexagonal jar of honey from his stand; he had recognized me, I''d
    never seen him before. To become a person that, occasionally, strangers wanted
    to reward because they felt I''ve given them something is an amazement. Once a
    young woman passing by an outdoor booth where I was signing bursts into a spontaneous
    jig at the sight of me, and that might be the pinnacle of my career, to somehow
    an occasion for someone else''s exuberance. We never set eyes on each other before,
    but that''s the work writers do, reaching further than writers.


    There''s another story about wounds and repair that has captured a lot of imaginations
    in recent years. It''s about the Japanese art of kintsugi, which literally means
    golden repair. It''s a method of mending broken ceramic vessels with a bond made
    of powdered gold mixed with lacquer. The result turns the breaks into veins and
    channels of gold, emphasizing rather than hiding that the vessel has been broken
    and making it precious in another way than it was before. They are exquisite objects,
    these cups and bowls with their channels of gold like magical scars, as oracular
    patterns, road maps, hieroglyphs. They make me gold.


    My friend Roshi Joshi Halifax, a Buddhist leader, an anthropologist and a constant
    traveler, has on several visits to Japan these repaired vessels in her hands,
    and a few years ago, she explored them as a metaphor: “I am not suggesting that
    we should seek brokenness as a way of gaining strength, although some cultures
    pursue crisis in their rites of passage as a way to strengthen character and open
    the heart," she wrote. Rather, I am proposing that the wounds and harms arise
    from falling over the edge into moral suffering can... be the means for the ‘golden
    repair,’ for developing a greater capacity to stand firm in our integrity without
    being swayed by the wind. And then my friend who had given me the desk sent me
    a letter to approve what I''d written about her that ended with a line from William
    Stafford: “I have woven a parachute out of everything broken.”


    People aren''t really meant to be anything, we''re made; we''re born, with some
    innate tendencies, and thereafter molded, thwarted, scalded, encouraged by events
    and encounters. *Despite everything* suggests the forces that try to stop a person
    or change their nature and purpose, and *who you were meant to be* suggests that
    those forces did not altogether succeed. It was a lovely fortune to be handed
    by a stranger, and I took it, and with it the sense that who I was meant to be
    was a breaker of some stories and a maker of others, a tracer of the cracks and
    sometimes repairwoman, and sometimes a porter or even a vessel for the most precious
    cargo you can carry, the stories waiting to be told, and the stories that set
    us free.

