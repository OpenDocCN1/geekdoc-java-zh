    A friend gave me a desk not long after I moved into the apartment, a woman’s small
    writing desk or vanity, the one I am writing on now. It’s a dainty Victorian piece
    of furniture, with four narrow drawers, two on each side and a broader central
    drawer above the bay in which the sitter’s legs go, and various kinds of ornamentation—doweled
    legs, each with a knee, knobby ornaments, scallops on the bottom of the drawers,
    drawer pulls pulls like tassels or teardrops.


    A year or so before she gave me the desk, my friend was stabbed fifteen times
    by an ex-boyfriend to punish her for leaving him. She almost bled to death; she
    had emergency transfusions; she was left with long scars all over her body, which
    I saw then without response because whatever capacity had been muffled, when I
    got habituated to violence at home, maybe because it was something we were supposed
    to take in stride and be nonchalant, but when we of all had language to talk about
    such violence or an audience ready to listen.


    She survived; she was blamed for what happened as victims were often then; there
    were no legal consequences for the would-be-murderer; she moved far from where
    it happened; she worked for a single mother who was evicted, and who gave her
    the desk in lieu of wages; and then she gave it to me. She moved on and we lost
    touch for many years, and then reestablished it, and she told me the full story,
    a story that could make your heart fire and the world freeze over.


    Someone tried to silence her. Then she gave me a platform for my voice. Now I
    wonder if everything I ever written is a counterweight to'
