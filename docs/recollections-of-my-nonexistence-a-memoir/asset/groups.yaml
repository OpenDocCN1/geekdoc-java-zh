    It was a powerful place. I can feel what it was like to be there now: the great
    expanses of dust-colored earth cobbled in stone, including shining pink quartz,
    fierce prickly plants here and there in the pale soil between stones, the dry
    air spectacularly clear (unless there was a dust storm or enough heat to make
    the air seethe and shimmer) so clear that you could see for dozens of the fang-sharp
    ranges in the distance. Those immense spaces invited me to move freely and feel
    the smallness of human bodies and concerns in a landscape where you could sometimes
    see a hundred miles, where you could drive half without seeing a house, where
    you could, as I often did, wander toward the horizon feeling both liberated and
    fearful of what happens to a body that is two-thirds liquid in such an arid place.
    Just sitting still you could feel the warmth coming off your breath and out soul
    to disperse into the atmosphere where sometimes, rarely, in this driest part of
    the driest state in the union, clouds would gather and rain would evaporate as
    it fell or dash down only to dry in minutes.


    I had always craving illimitable space. I found it earlier at Ocean Beach at the
    far end of the city and I found it a child in the hills and sometimes lying on
    my back at the wild grass that reached down into the earth, looking into the stars
    until I felt it fall into them, found it in flying dreams, and wandering on foot,
    wandering in time and space through books. And then I got more than I had dreamed
    of, almost as I needed.


    It''s generally recognized that you have to learn how to enter and guarded places,
    A few years earlier, on a road trip with my boyfriend through Death Valley and
    the Southwest, we had turned back early, not knowing how to find the oases hidden
    in the valleys and canyons where water collects, or how to appease the beauty
    that has little or no verdure, or how to let the quietness and sense of deep and
    cyclical time enter us. The Nevada Test Site was how I learned to enter, because
    these annual spring camps and protests introduced me to people with deep ties
    to the places and give me time and, quixotically, a place where I felt safe. Safe
    even though we were facing down the nuclear weapons being exploded not far away,
