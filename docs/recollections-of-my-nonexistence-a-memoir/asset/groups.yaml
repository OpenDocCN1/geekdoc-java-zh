    space, who is interrupted or harassed into silence, that condition of occupying
    no verbal space. At its best, a conversation is a joy and a collaborative construction,
    building an idea, an insight, sharing experiences;; at its worst it''s a battle
    for territory, and most women have experiences of being pushed out one way or
    another, or not let in the first place, or being assumed not to be qualified to
    participate. Eventually that would become one of my subjects.'
