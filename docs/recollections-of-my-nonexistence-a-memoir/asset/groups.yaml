    # Freely at Night


    ![](img/db14ca6438d37a021682af27273dff1e_65_0.png)'
  - '[PAGE 66]


    One day in 2011, I got a Facebook friend request from someone I''d in college
    with when I was seventeen and stayed in touch for a few years after, someone I
    cherished then as a person I could trust and talk to perhaps because of who he
    was or because of who I imagined he was, how I filled up what I didn''t know about
    him with what I needed. I accepted the request with enthusiasm and curiosity about
    the years we''d been out of touch and brought me who he might be. He replied that
    my political views were abhorrent, that he would like to send me copies of the
    letters I''d written him. Once I found out he was conservative, things that had
    seemed mysterious or exotic about him when he was young suddenly made sense. I
    didn''t find out more about him, but I did find out from him about me.


    A manila envelope through the mail slot a few weeks later. I had a little uneasiness
    about meeting teenager directly, and so I waited several years to open it. In
    the photocopies of letters on lined legal pads in a small neat handwriting that
    is no longer mine met a person who didn''t know how to speak. By that mean several
    things. The young writer I met there didn''t know how to speak from the heart,
    though I could be affectionate. But also, she was a jumble of quotations and allusions
    and foreign phrases and circumlocations, of archness and pretense and avoidance
    and confusion, an attempt to use language that kept her so busy that hardly anything
    got said, or major events were mentioned in passing in sentences busy other things
    that didn''t matter. She had collected a lot of words, phrases, syntaxes, tones
    and was trying them out, like someone at the very first stages of playing an instrument,
    with squawks and clangs. She was speaking in various voices because she didn''t
    know what voice was hers, or rather had not yet made one.


    There was one startling passage in all the verbiage. I''d written about the eighteenth-birthday
    party I threw my younger brother not quite a year after I''d moved into the apartment.
    Lot of chocolate frosting that had been smeared around a lot of people, and there
    was talcum powder on the stereo and towels soaked with champagne in the tub, I
    mentioned proudly. And then the letter went on to list essays I was trying to
    write, though it would be a couple of years before I published anything.'
