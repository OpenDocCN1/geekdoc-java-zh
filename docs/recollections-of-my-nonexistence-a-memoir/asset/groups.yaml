    wasn’t, as many straight men seemed to assume, just transactional, a way to dump
    or extract information or instructions. It could play, riffing on ideas and tones;
    it could give encouragement and affection; and it could invite people to be themselves
    and know themselves in order to be known. There were so many kinds of love at
    work: the love of vivid and exact description, which was sometimes poetic, sometimes
    deep insight, and of exchanges that wove connections between speakers and ideas.


    If humor consists of noting the gap between what things are supposed to be and
    what they actually are—and much humor of the non-brutal variety is—those least
    invested in things as they are supposed to be, who are actual adversaries and
    victims of conventionality, are more inclined and able to create those gaps. The
    straight man is a figure in humor, the one who doesn’t make the joke, and straight
    suggests linear thinking and conventional paths as well as heterosexuality.


    I think of how when I encountered the great artist and graphic designer Rex Ray,
    who designed my first book, I’d shout “LambCHOP!!!” and he roared back in his
    rich, amused, rollicking voice, “CUPCAKE!!!” or of when I was first getting to
    know the young artist each other with a caustic “HELLO, Kitty,” bearing down on
    the first word, swinging back with the second, so that the phrase was like a secret
    handshake, badge of belonging. Of how I was free to be funny or dramatic or preposterous
    around them, and of how fun it was, and how much we laughed, and there was room
    to be sad and barefoot. Even that could become something absurdities and excesses
    were occasion for more wit, because heartbreak and loneliness have their comic
    sides, and finding them can be key to survival. How it let me be someone I might
    not have gotten to elsewhere. Not that all my gay friends were campy or culture
    mums. Bob Fulerson was a rugged outdoorsman and political organizer, a fifth-generation
    Nevadan devoted to his state, but he was and is someone who calls me up times
    just to leave me a message that he loves, almost thirty years after we met at
    the Nevada Test Site.


    Queer culture made it clear that a life has its stable foundation friendships
    so strong that they are a form of family, that too can be liberated from the conventional
    roles of spousal contracts and begetting and blood kinship. It was a bulwark against
    the widespread, wearing insistence that only the nuclear family supplies love
    and stability—which sometimes it does, but we all know that sometimes it supplies
    misery and sabotage. This was, of course, in part the result of the exclusion
    of queer people from marriage and rejection by birth families before marriage
    equality became the law of the land and adoptions became more available to same-couples.
    Later in life, when I forgot to tell interviewers why I didn''t never ask a man
    that or to simply garrote them for being so noxious, I sometimes answered the
    intrusive questions about why I didn''t marry and bear offspring with reference
    to being a San Franciscoian, to being among people who had less conventional ideas
    of what a life could look like and what kinds of love could shore it up. It was
    a tremendous gift.


    From that old apartment of mine I could walk west until I came to the Pacific
    Ocean. I could go almost due south to the Castro, where the theater and many other
    amenities and a shifting population of friends called me. I rarely walked north,
    though I drove to cross the Golden Gate Bridge and plunge into the country—or
    to visit my mother, so that trips across the bridge meant both liberation and
    dread. It was an easy walk east to the Civic Center and to the main library, where
    I still do research, and to the trains to the East Bay. As the 1990s advanced,
    I spent more and more time driving across the Bay Bridge east to get to the American
    West, to the mountains and the deserts and the new life and friends I was finding
    there. Despite everything the world was opening up to me, or I to it.


    Growing up, we say, as though we were trees, as though altitude was all that there
    was to be gained, but so much of the process is growing whole as the fragments
    are gathered, the patterns found. Human infants are born with cranium made up
    of four plates that have not yet knit into a solid dome so that their heads can
    compress to fit through the birth canal, so that the brain within can then expand.
    The seams of these plates are intricate, like fingers interlaced, the meander
    of arctic rivers across tundra.


    The skull quadruples in size in the first few years, and if the bones knit too
    soon, they restrict the growth of the brain; and if they don’t knit at all the
    brain remains unprotected. Open enough to grow and closed enough to hold together
    is what a life must also be. We collage ourselves into being, finding the pieces
    of a worldview and people to love and reasons to live and then integrate them
    into a whole, a life consistent with its beliefs and desires, at least if we’re
    lucky.


    The city was my great teacher in the 1980s, and my first book came out of what
    I learned from wandering streets and neighborhoods, from encountering subcultures
    and enclaves. The second came out of what the vast spaces of the mountains and
    deserts the people there had to teach, and the lessons were magnificent, tremendous,
    sometimes terrifying, and the places brought new friends and a new sense of self.


    At some point in my mid-enties, the childhood passion I had had for natural places
    had returned with a new intensity; I found epiphany and a sense of liberty in
    the wild places—forests, grasslands, coastline—of my own region and began to study
    the cultural history of ideas and representations and desires for nature and place
    and landscape, first through art and history, then through literature. I began
    exploring and, wandering first into local places and then into the American West,
    I found, as they say, my voice.


    I sometimes say that the Nevada Test Site taught me to write, because I went there
    for the spring antuclear actions and camps in 1988 and every year thereafter into
    the millennium, met a place so stark and vast, and to me, strange, at so many
    cultures and stories converged, I had to bring together all the fragments of what
    I was doing into a new whole to have something that felt adequate to what I found.
    Before then, I had accepted the pigeonholes into writing fit. I had written criticism
    and reviews with a confident, objective-sounding tone, written journalistic reports
    that report more or less colored within the lines of journalism. In those years,
    I wrote small, dense essays that were lyrical, personal, emotional, metaphorical,
    experimenting with form and tone, letting in what I was learning from poetry and
    the prophetic voice, doing all the things I was not supposed to do in criticism
    and journalism, wondering under melancholy and uncertainty in, giving rein to
    what language can do.


    The Nevada Test Site was a place of convergence—of peoples, of histories, of values
    and ideas, of forces from the nuclear arms race to the Eurocentric reaction to
    deserts. To describe what it meant, I realized I needed all the modes of writing
    I''d learned and needed them together, unsegregated. That was the major breakthrough
    of my writing, and Savage Dreams, the book that resulted, was the first exuberant
    experiment in bringing together the writing styles and voices and recognizing
    how they could be the same voice describing in terms historical, evocative, personal,
    analytical the complexity of a political situation and a historic moment.

