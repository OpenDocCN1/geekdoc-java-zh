    Feminists of an earlier era insisted that rape is about power, not erotic pleasure,
    though there are men for whom their own power or a woman’s powerlessness is the
    most erotic thing imaginable. For some women too, we learn that our helplessness
    and peril is erotic, and accept or reject struggle with the sense of self and
    stories that come with them. Jacqueline wrote in 2018, "Sexual harassment is the
    great male performative, the act through which a man aims to convince his target
    not only that he is the one with the power—which is true—but also that his power
    and his sexuality are one and the same thing."


    Though each incident I experienced was treated as somehow isolated and deviant,
    there were countless incidents, and they were of the status quo, not against or
    outside it. Talking about it made people uncomfortable, and mostly they responded
    by telling me what I was doing wrong. Some men told me they wished someone would
    sexually harass them, because they seemed attractive people. No one offered the
    help of recognizing what I was experiencing, or agreeing that I had the right
    to be safe and free.


    It was a kind of collective gaslighting. To live in a war that no one around me
    would acknowledge as a war—I am tempted to say that it made me crazy, but women
    are so often accused of being crazy, as a way of undermining their capacity to
    bear witness and the reality of what they testify to. Besides, in these cases,
    crazy is often a euphemism for unbearable suffering. So it didn''t make me crazy;
    it made me unbearably anxious, preoccupied, indignant, and exhausted.


    I was faced with either surrendering my freedom in advance or losing it in the
    worst ways imaginable. One thing that makes people crazy is being told that the
    experiences they have did not actually happen, that the circumstances that hem
    them in are imaginary, the problems are all in their head, and that if they are
    distressed it is a sign of their failure, when success would be to shut up or
    to cease to know what they know. Out of this unbearable predicament come the rebels
    who choose failure and risk the prisoners who choose compliance.


    was a feminist movement in full swing in the 1980s, with much to say about violence
    against women, even the Take Back the Night'
