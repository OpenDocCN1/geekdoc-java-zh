    这是一个充满力量的地方。现在我依然能感受到在那里的感觉：广阔的尘色土地上铺满了石块，其中夹杂着闪光的粉色石英，石缝间的浅色土壤中点星生长着凶猛的刺状植物。干燥的空气格外清澈（除非有沙尘暴或热量足以让空气沸腾闪烁），清澈到你可以望见远处几十排犬牙般尖锐的山脉。这些无垠的空间邀请我自由移动，并在景观中感受到人类身体和忧虑的渺小——在这里，你有时可以望向百英外，开车半程程看不到一个房子，你可以像我常的那样，向地平线漫步，既感到解放，又恐惧在如此干旱的地方，一个三分之二是水的身体会发生什么。只要静静坐着，你就能感受到呼吸呼出的热量和灵魂散发到大气中；而在那里，在这个美国最干旱州中最干旱的部分，偶尔罕见地云层汇聚，雨水落下时便蒸发，或倾盆而下在几分钟内干涸。


    我一直渴望无尽的空间。我早先在城市尽头的海滨滩发现过它，在童年的山丘中发现过它，有时躺在一直扎根大地的野草地上，仰望星空直到感觉自己坠入其中；在飞行的梦中发现过它，在徒步中、在书中穿梭时空中发现过它。然后，我得到了比梦想中更多的、几乎正如我所需要的。


    人们普遍认为，你必须学会如何进入并守护某些地方。几年前，我和男朋友开车旅行穿越死亡谷和西南部时，我们早早折返回了，因为我们并不知道如何找到隐藏在山谷和峡谷中积聚水的绿洲，也不知道如何平复那几乎没有或完全没有绿意的美丽，亦不知如何让宁静以及那种深邃且循环的时间感进入我们的内心。内华达测试场曾是我学会“进入”的地方，因为这些年度的活动让我学会了如何进入……


    （由于原文后半部分存在严重的 OCR  重复和逻辑混乱，以下翻译基于文中提供的可连贯意群）

