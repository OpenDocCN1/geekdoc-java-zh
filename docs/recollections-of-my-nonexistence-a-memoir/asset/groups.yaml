    often bits of filler, and with the magazine’s owner coed the dozen or so abysmal
    written pieces we received each Monday until they were ready to send to the printer
    on Thursday afternoons. It was an all-woman office in downtown Oakland I worked
    for three and a half years after I graduated from Berkeley, and it was a haven
    of calm and routine, and a place where though the magazine was not a great magazine
    I learned great things.


