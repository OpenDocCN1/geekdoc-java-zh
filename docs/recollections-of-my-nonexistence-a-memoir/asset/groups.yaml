    beginning I had hardly anything in it, and it felt vast, and at the end it was
    overstocked with books and many boxes of papers under the bed, and it felt cramped.
    In memory it was lustrous as a chambered nautilus'' mother-of-pearl shell, as
    though I was a hermit crab who had crawled into a particularly glamorous shelter,
    until, as hermit crabs do, I outrew.


