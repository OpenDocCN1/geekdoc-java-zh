    # Acknowledgments


    Looking back, this is a book about obstacles and animosities, but also about bridge
    builders and kindnesses, and for the latter I owe so many thanks; to the latter
    I owe my survival. I''m here because of the forces that protect the vulnerable,
    encourage the eccentric, and educate the ignorant.


    Thank you Mr. James J. Young (1920–1989) for a home and friendship. Thank you,
    Western Addition, for an education in urbanism. Thank you --- for a desk to write
    on.


    Thank you to the three main Davids of my twenties. Thank you gay men, thank you
    queer culture, thank you city of refuge in those days when your principles were
    higher than yours. City of San Francisco rent control policy, without which my
    trajectory would not have been possible.


    Thank you Lyon-Martin Clinic for free health care for this straight kid in your
    queer-friendly places. Thank you Ocean Beach, thank you Pacific, thank you foghorns
    and seagulls. Thank you to the people who protected the vast greenbelt around
    San Francisco in which I have been wandering this past half century.


    Thank you San Francisco Public Library and then UC Berkeley libraries for all
    the hours spent there and all the books and archives accessed there the ideals
    you uphold. Thank you independent bookstores, especially Moe''s, City Lights,
    Green Apple, Green Arcade, and all the bygone used bookstores.


    Thank you San Francisco State University for making room for a transfer student
    and for schedules that worked for working students; thank you Shakespeare professor
    Noel Wilson for encouragement and for getting my first media job, as a fact-checker
    intern at San Francisco Magazine.


    Thank you San Francisco Museum of Modern Art and the research/collections staff
    there and librarian Genie Candau. Thank you Sierra Club for thirty-five years
    of overlap and evolution.


    Thank you Graduate School of Journalism, especially Bernard Taper, David Littlejohn,
    and Ben Bagdikian.


    Thank you to the artists who taught me to think of myself as a writer, Linda Connor,
    Ann Hamilton, Richard Misrach, Lewis DeSoto, Meridel Rubenstein.


    Thank you Gent Sturgeon and Rex Ray at City Lights and later on Paul Yamazaki.


    Thank you Rebecca Biggs, Steve Rosenberg, and Rob Ladenbrunner, early publishers
    of mine in Frank magazine; thank you Tim Yohansson and Maximum Rock''n''Roll,
    didn''t thank you Flora at Music Calendar, Cecil McCann at Artweek, then Gary
    Kornblau at Art issues.


    Thank you Bill Berkson, Michael McClure, and Barbara Stauffacher Solomon, early
    encouragers who came along when I was in my twenties, and Mike Davis and Lucy
    Lippard who showed up for me in my thirties.


    Thank you both my 1991 Gulf War and 2002–3 Iraq War Area Direct Action Secret
    Society (BADASS) antiwar affinity groups.


    Thank you to the handsome bikers at the Denny’s on the I-5 north of Los Angeles
    who listened and let me convince them that Anita Hill was telling the truth, one
    morning at a shared table in October 1991.


    Thank you Nevada: Bob Fulerson, Carrie and Mary Dan, Corbin Harney, Chief Raymond
    Yowell, Bernice Lalo, Grace Poterti, Virginia/Dee-Dee Sanchez, Jo Anna Garrett,
    Maria Painter, Kaitlin Backlund, and many collaborators in the early version of
    the Western Shoshone Defense Project. Thank you anti-intervention and environmental
    movements of the 1980s and Rainforest Action Network where I volunteered then
    (and where I met Brad Erickson from whom I learned so much about environmental
    justice back then when he was learning it from Gwichin and Masai elders); thank
    you antinuclear movement and Nevada Test Site activists of the 1990s; thank you
    climate activists of the twenty-first century among whom are so many friends and
    colleagues now, Bill and May and Anna and Joe and Steve and Mike B. Antonia and
    Red.


    Thank you Cleve Jones for that moment in 2018, because I showed up with the magnificent
    banner artist Stephanie Syjuco had made, you put me at the head of a march of
    gay men down our central boulevard, perhaps my greatest moment of arrival as a
    San Franciscan. Thank you for the democracy banner, Stephanie.


    Thank you Garnette Cadoggan, Elena Acevedo, and Jaime Cortez for friendship and
    insight and comments on this manuscript.


    Thank you, six books later, Paul Slovak at Viking, and encourancer since he got
    the book proposal for Wanderlust in 1997. The you Penguin for first all the low-cost
    paperbacks that formed me and then for the glory of seeing my Viking hardcovers
    as Penguin paperbacks with the orange spines and Penguin logos. Thank you Bella
    Lacey and Pru Rowlandson at Granta.


    Thank you Agent Frances Coady, encourager, first reader of this book. Thank you
    to so many friends now—Marina, Astra, Sam, Leigh, Tina, Ana Teresa, Catherine—and
    especially to Charles, walking alongside me and sharing tea and more all through
    the writing of this book.


    Thank you to all the women who have proved that stories can change the world,
    who have changed the collective story from the old overarching story built on
    endless silencing, thank you to the innumerable storytellers on social media,
    in public forums, in conversations, in the news, in books and courtrooms, who
    have broken that silence with their voices and made room thereby for other voices
    to be heard, perhaps before they too become survivors with terrible stories to
    tell.


    Thank you feminism. Thank you intersections.


    Here’s to the liberation of all beings.


    # About the Author


    Rebecca Solnit is the author of more than twenty books, including A Field Guide
    to Getting Lost, The Faraway Nearby, A Paradise Built in Hell, River of Shadows,
    and Wanderlust: A History of Walking. She is also the author of Men Explain Things
    to Me and many essays on feminism, activism, hope, and the climate crisis. A product
    of the California education system from kindergarten to graduate school, she is
    a regular contributor to the Guardian and Lit Hub.

