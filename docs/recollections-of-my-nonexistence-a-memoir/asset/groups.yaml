    People watching is one of life''s great pleasures, and I felt fortunate to live
    among drag queens and the Sisters of Perpetual Indulgence, the AIDS activist group
    and parodic satirical/fraternal organization launched at the end of the 1970s,
    many people who took any excuse to costume—in city of parades and street parties
    and festivals for Dia de los Muertos and Halloween and Gay Pride and Chinese New
    Year, among subcultures with their particular styles from punk to lowrider to
    hip-hop to the many people rendering gender to suit themselves and signifying
    it by personal style and body language. And the eccentricities which belonged
    to no clan or a tribe of one, back when people lived in public city. The city
    back then felt like an unending carnival of self-invention, and some people worked
    harder at performing for it than others, but there was always to see, from rainbow-colored
    Mohawks to tattered ball gowns, and sometimes together.


    Perhaps the reprise Ed''s wardrobe provided a dying woman was one of the ways
    I was learning that you are and what you do and make and wear can be a contribution
    to people around you, that many of the most valuable gifts are not direct or material
    or measurable. Even how you live your life can be a gift to others. Being gay
    liberated me, because liberation is contagious. I learned so from them, benefited
    in so many ways, enjoyed myself so immensely. Of course the things I''m saying
