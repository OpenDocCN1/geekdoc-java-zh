    [content]


    # 边缘的某些用途


    ![](img/db14ca6438d37a021682af27273dff1e_87_0.png)


    这是用铅笔写在一张已经发黄的大报纸上的，报纸的下半部分留有初学者使用的宽行距线条。我很确定这是我一年级时的第一篇作文。整篇文章读下来是：“我长大后永远不会结婚。”顶部的插画画了一个穿红衬衫的男人，他的黑发像光环一样环绕着圆圆脑袋，旁边是一个穿着带荷叶边紫色裙子、留着金头发的女人。他在一个漫画气泡里说：“跟我结婚吧，”而她说：“不，不。”


    这既滑稽又可怕，这标志着我正审视着母亲的生活，并想着无论我做什么，我都会尽量不要像她那样，因为她在那段极度痛苦的婚姻中感到如此受困和无力。当时我正处于这种状态。我是受害者与其加害者的后代，是一个无法诉说的故事。大多数女孩和年轻女性的传统故事都以婚姻结束。女性消失其中。结束。后来发生了什么？她们又是是谁？童话《蓝胡须》讲述了一个女人，她通过违背指令并使用禁忌钥匙打开前任者尸体的酷刑室，发现自己嫁给了一个连环杀手，而对方杀死她的意图正因为她的知情而变得尖锐。这是一个不寻常的童话：她活了下来，而另一个人没有。


    我刚刚拒绝了这种女性的主流故事，并很快决定尝试自己主掌故事。也就是说，在识字的第一年，在经历了一段想当管理员（因为他们每天都与书为伴）之后，我意识到每本书都是某人写的，并决定这就是我想做的事。从早这种坚定不移的目标简化了我的道路，但写作的任务永远从不简单。成为作家使我们在经营生活中共同面临的任务形式化了：意识到那些宏大叙事是什么，它们是否服务于你，以及如何根据你的身份和价值观去创作属于你自己的版本。


    但涉及到写作时，你写的每一章都被那些你未写下的部分包围，每一段告白都被那些保持秘密、不可描述或被遗忘的事所包围，无论你的意图甚至主题是什么，只有经验中这种混乱和流动性可以被筛选并汇聚到纸面上。你不是在雕刻大理石；你是在从湍急的河中抓起一把浮木；你可以排列碎片，但你无法写下整条河流。尽管先人的故事有许多缺失，但我现在理解了祖辈遗传下来的深层伤害是如何塑造我父母的，以及公共历史如何以各种方式塑造我们的私人生活。我活得足够长，足以认识家族五代人，并看到我两代之前发生的历史重量——饥荒、种族灭绝、贫困、移民的残酷、歧视和厌女症——在我两代之后依然产生了后果。我在那张小写桌前写下了自己的讣告，来自那个没有死、活在他们离去后和平中的女人。我不感兴趣那个物种长期以来被反复咀溺的关于童年残酷的部分，而随后的某些残酷却未被关注。


    “线索”通常是分支、分叉并通向许多方向事物的隐喻，但也许多种方式扭织成一根线，意味着追踪一根线应该意味着解开它或识别出单根丝线。例如，研究生后，我被一家小艺术杂志聘为编辑助理，很快在头衔上变成了助理编辑，在实际工作上多程度上是执行编辑。我学了很多东西，从校对规则到非常直接的员工指令，从如何编排出版物到关于当代艺术（特别是加州艺术）的丰富知识。我写过讣告、评论、一些特稿和几篇调查报告，经常还有填充性文字，杂志主每周一都会对我们收到的十来篇极其糟糕的稿件进行润色，直到周四下午准备好发往印刷厂。从伯克利毕业后，我在奥克兰市中心的一家全女性办公室工作了三个半，那里是一片宁静和常规的避风港，尽管那本杂志并不伟大，但我在那里学到了伟大的东西。


    我永远感激我的……


