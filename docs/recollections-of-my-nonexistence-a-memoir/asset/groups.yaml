    ## Diving Into the Wreck


    ![](img/db14ca6438d37a021682af27273dff1e_104_0.png)


    When I wrote that book, I conducted a number of interviews with straight male
    subjects who thought I might be a groupie of sorts, and demonstrating a deep knowledge
    of their milieu was one way to dispel some of that: I''m not excited to meet you,
    I''m excited to reconstruct how it all came together in 1957, and I have most
    of the pieces but would like to ask you a few things. I remember one of them inviting
    me to sit on the sofa with him, and things, putting my tape recorder down as a
    tiny barrier; another who seemed frisky with anticipation of some sort of frisk
    we might engage in; and years of sexual harassment by Bruce Conner, I tried to
    keep at bay by addressing him as Uncle Bruce and his wife as Aunt Jean, a reminder
    of, among other things, our age gap. The conduct of the frisky artist seemed to
    come from something very familiar to me, a sense that since young women are nobody,
    nothing you do with them is on the record, which was disconcerting to run into
    while I was making the record of his life and achievements.


    As of my research, I paid for several short films screened for the Pacific Film
    Archive and Canyon Cinema, but there was one I didn''t see at the time but had
    read about in the literature. Works of art you have only read or heard about on
    their own dimensions, and often such a work takes on a life in your imagination
    before you see the thing. My imaginary film of joyous liberation withered when
    I finally saw My Daisy. Codirected by the painter Alfred Leslie and the photographer
    Robert Frank, it had a voice-over by Jack Kerouac.


    The film begins with a woman opening the doors and picking up after her husband:
    “Early morning in the universe. The wife is getting up, opening up windows. She''s
    a painter and her husband''s a railroad brakeman. . . .” She never acquires a
    name, never paints, but is only the wife, the one who gets the kid breakfast and
    dispatches him to school, tends the house, and represents all the things men are
