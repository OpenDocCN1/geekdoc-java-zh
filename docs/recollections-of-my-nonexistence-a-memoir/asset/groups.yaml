    After the war, I worked in a sort of trance all day and into the night for three
    or four days to shape the material into the essay “Hope in the Dark.” Anecdotes
    and examples that had been accruing for years suddenly had a pattern to fit into,
    and the pattern was the case for hope. Some of it was recycled from the letter
    to my students. It was the first thing I published exclusively online, and it
    went viral as nothing I''d ever done before, picked up by alternative weeklies,
    reprinted as a small booklet by a graphic designer, forwarded over and by email
    in those days before social media.


    I argued that we had a lot of power, a history of forgotten and undervalued victories,
    that some things were getting worse, the long view—especially if you were nominal,
    or straightforward, or nonwhite—showed some remarkable improvement in our rights
    and roles, and that the consequences of our acts were not knowable in advance.
    They were often not knowable soon afterward and ever since great strategists,
    idealists, and movements sometimes prompt repercussions in other times and places
    and struggles. I saw violent direct action Eastern European countries from their
    totalitarian governments in 1989, seen the Zapatista insurgency emerge from the
    Lacandon jungle in 1994, seen the government of Canada create the vast indigenous-governed
    territory of Nunavut in 1999, seen things I''d never dreamed possible to pass.
    In 2004 I turned the essay on hope into a small book, and over the following years
    it came out in a dozen other countries and languages.


    My interlocutor had accused me of offering palliatives for marketing reasons,
    but what I wanted to offer is encouragement, a word, though it carries the stigma
    of niceness, literally means to instill courage. Encouragement not to make people
    feel good, but to make them feel powerful. I''d eventually realize that what I
    was doing could equally characterized as stealing away the best excuse for doing
