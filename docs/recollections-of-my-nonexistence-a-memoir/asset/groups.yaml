  - '[PAGE 74]


    my fair hair and skin might have been able to pass as a gentile and thereby escape
    the extermination that had taken all the members of my father’s family who had
    stayed behind. It was another kind of annihilation that haunted me.


    But I also had a vague sense that I might find myself somehow in a less pointedly
    time and place, where what I learned from books would at least partially equip
    me to get by. That might wander into Georgian England or medieval France or the
    nineteenth-century West or some of the other places in which I had immersed myself,
    and some sense of these, ridiculous ideas though sounds, made me hesitate to cut
    my long hair, and I found encouragement in archaic ideas of beauty which I thought
    measured up more than I did to modern ones. In those days, it didn''t seem impossible
    that somebody else would be in the mirror in the morning, or the world around
    it would be another world. “I is another” was a phrase of Arthur Rimbaud’s that
    I also kept handy.


    Of what I had learned from books and from life had happily equipped me enough
    to fit into the time and place I actually lived in. Long after this anxious daydream
    had passed, I lived a comic version of it when I read Wordsworth’s book-length
    autobiographical poem The Prelude twice in order to write a chapter of my book
    on walking. I was immersed in his language—unhurried graciousness, elaborate and
    sometimes inverted syntax, circumlutory ways of saying things—that my casual remarks
    to strangers and check-out clerks were met with baffled looks.


    There’s a benefit to being untethered from your own time. I think I gained a sense
    of how differently constituted the idea of being human, the purpose of life, the
    expectations and desires had been even a generation or two ago, let alone a millennium
    before, of how the definitions metamorphosed, and how that meant you could step
    outside the assumptions of your time, or at least wear them lightly, and at in
    theory not let them punish you. That being human can mean many things, in other
    words. At thirteen, I had read C. S. Lewis’s Allegory of Love, which describes
    the social construction, in twelfth-century France, of what would become our ideas
    of romantic love. These expectations were the result of a particular time and
    place gave me a sense of liberation, like someone opening the windows in a stuffy
    room.'
  - '[PAGE 75]


    Despite Lewis book, I soaked novels’ impossibly dramatic notions of love and romance
    and their myths of completion and ending. And I got something most women got,
    an experience of staring at women across a distance or being in worlds where they
    barely existed, from Moby-Dick to Lord of the Rings. Being so often required to
    be someone else can stretch the sense of self. You should be yourself of the time.
    You should be with people who are like you, who are facing what you''re facing,
    who dream your dreams and fight your battles, recognize you. And then, other times,
    you should be like people unlike yourself. Because there is a problem as well
    in which empathy takes over, empathy has a capacity to shape-shift and roam out
    of your soul self. One of the convenient afflictions of power is a lack of this
    imaginative extension. For many men it begins in early childhood, with almost
    exclusively given stories with male protagonists.


    The term double consciousness is sometimes used for black experience in a white
    culture. U. E. B. DuBois famously wrote in the last years of the nineteenth century
    and (wrote, as so many men did up through least James Baldwin, as though people
    were men or even one man) the Negro is a sort of seventh son, born with a veil,
    and gifted with second-sight in this American world,a world which yields no true
    self-consciousness, but only lets him see himself through the revelation of the
    other world. It is a peculiar sensation, this double-consciousness, this sense
    of always looking at one’s self through the eyes of others. Perhaps there should
    be another term for never looking through the eyes of others, for something less
    conscious than single consciousness would convey.


    DuBois’s framework found an echo in John Berger’s 1968 Ways of Seeing, when Berger
    imagined, with generosity and brilliance, what it was to be something he had never
    seen: “To be born a woman has to be born, within an allotted and confined space,
    to the keeping of men. The social presence of women has developed as a result
    of their ingenuity in living under such tutelage with such limited space. But
    this has been at the cost of a woman’s self being split into two. A woman must
    continually watch herself. She is almost continuously accompanied by her own image
    of herself. She has to survey everything she is and everything she does because
    how she appears to others, and ultimately how she appears to men, is of crucial
    importance for what is normally thought of the success of'
  - '[PAGE 76]


    her life. Her own sense of being in herself is supplanted by a sense of being
    appreciated as herself by another.


    You depend on men, and what they think of you, learn to constantly check your
    yourself in a mirror to see how you look to men, you perform for them, and this
    theatrical anxiety forms or deforms or stops altogether what you do and sometimes
    instill. You learn to think of what you are in terms of what they want, and addressing
    their want becomes so ingrained in that you lose sight of what you want, and sometimes
    you vanish to yourself in the art of appearing to be and for others.


    You are always somewhere else. You turn into trees and lakes and birds, you turn
    into muses, mothers, bothers, the vessel for others'' desires and the screen for
    their projections, and in all that it can be hard to turn into yourself, for yourself.
    Even reading novels by men can instill this, and it did in my case. Sometimes
    the own desires and needs are reviled or rebuk for taking up space, for making
    noise. You are punished unless you punish yourself into nonexistence in this system.
    The system is punishment. A novel like Willa Cather’s Song of the Lark in the
    ambitious, amorous, extraordinarily talented heroine is not punished as a shock.


    Solitude was reprieve from this endless task, but when I turned to books I often
    turned into a manful looking at women. Looking at women as problems or trophies
    or mildly baleful phenomena with opaque motivations and limited consciousness
    probably did something to me, and so did being encouraged to identify with the
    man over and over again, and to live in imagination in places where women were
    just ornaments in the margins or trophies or broadmaids.


    In my case, this meant identifying with male protagonists, with the almost nameless
    Lord Jim and Jim Carroll’s self-anointing junkie in The Basketball Diaries with
    Pip rather after Ella in Great Expectations, and all the grail seekers and ring
    bearers and western explorers and chasers and haters of women and inhabitants
    of worlds where women were absent. And the task of finding one’s way must be immeasurably
    harder when the heroes, all the protagonists, are not only another gender but
    another race, another sexual orientation, and when you find that yourself are
    described as the savages or the servants or the people who don’t matter. There
    are many forms of annihilation.'
  - '[PAGE 77]


    But there were I craved. When I read, I ceased to be myself, and this nonexistence
    I pursued devoured like a drug. I faded into an absent witness, someone who was
    in that world but not anyone in it, or who was every word and road and house and
    ill omen and forlorn hope. I was anyone and no one and nothing and everywhere
    in those hours and years lost in books. I was a fog, a miasma, a mist, someone
    who dissolved into the story, got lost in it, learned to lose myself as a retrieve
    from that task of being a child and then a woman and the particular child and
    woman was. I hovered about many times and places, worlds and cosmologies, dispersing
    and gathering drifting. A line by T. S. Eliot, the first poet whose work I got
    to know, comes to mind: "prepare a face to meet the faces that you meet." Alone,
    immersed in a book, I was faceless,, unbound, elsewhere, free of meetings. I wanted
    to be someone, to make a face and a self and a voice, but I loved these moments
    of reprieve. If moments are the words: they were not intermissions in a normal
    social life; they were the life itself interrupted by social interludes.


    There is something astonishing about reading, about that suspension of your own
    time and place to travel into others''. It''s a way of disappearing from where
    you—not quite entering the author''s mind but engaging with it that something
    arises between your mind and hers. You translate words into your own images, faces,
    places, light and shade and sound and emotion. A world arises in your head that
    you have built at the author''s behest, and when you''re present in that world
    you''re absent from your own. You''re a phantom in both worlds and a ghost of
    sorts in the world that is not exactly the one the author wrote but some hybrid
    of her imagination and yours. The words are instructions, the book a kit, the
    full existence of the book something immaterial, internal, an event rather than
    an object, and an influence and a memory. It''s the reader who brings the book
    to life.


    I lived inside books, and though it''s often assumed that we chose books to travel
    through them to get to the end, there were books I took residency in, books I
    read again and again and then picked up and opened anywhere just to be in that
    world, with those people, with author''s vision and voice. Jane Austen''s novels,
    but also Ursula K. Le Guin''s Earthsea books, Frank Herbert''s Dune, eventually
    E. M. Forster, Willa Cather, and Michael Ondatje, some children''s books I returned
    to as an adult, and early on novels that don''t have much standing as literature.'
- md: '

    roamed freely in them, knowing the territory in all directions, and familiarity
    was a reward as strangeness might be in a book read once just to find out what
    happened.


    I would not call books an escape if that meant I was only hiding out in them for
    fear of something else. They were glorious places to be, and they set my mind
    on fire and brought me in contact with the authors and indirectly in their fictions,
    directly in the essays and journals and first-person accounts that I gravitated
    to as I came to understand that my own vocation was going to be essayistic nonfiction.


    I swam through rivers and oceans of words and their incantatory power. In fairy
    tales naming something gives you power over it; a spell is some words you say
    that are just concentrated versions of how words make the world and take us into
    its heart, how a metaphor opens up a new possibility, a simile builds a bridge.
    They let me listen to conversations and thoughts that went deeper and expressed
    more than most people could face-to-face.


    But they were not warm, they had no bodies to meet my body, and they would never
    know me. There was nonexistence in living through books as well as many other
    existences and minds and dreams to inhabit and ways of expanding one’s own imaginative
    and imaginary existence.


    It is as easy to decide to be a writer as to decide to have a piece of cake, but
    then you have to do it. I moved into that beautiful apartment as I was in my final
    semester of my undergraduate education at San Francisco State University. It was
    an intense spring: I was working to support myself and taking nineteen units of
    classes, helped along by a handful of prescription speed in the form of little
    yellow pills that been the only gift given me by the man I''d dating before I
    moved.


    I graduated at turned, and then realized that the world and I were not ready for
    each other. I got a desk-clerk job a pleasant walk home in a small hotel, out
    there on the edge of the Castro District in those last years before AIDS would
    change everything for the gay men who thronged the streets of the neighborhood.
    I stayed there for a restorative of catching myself by looking around and not
    being desperate for time or money. The job left a lot of time to read behind a
    rooftop desk, in between checking guests in and out taking reservations by phone
    and mailing confirmations and sometimes making beds or breakfast trays. There
    were troubles—a lecherous elderly boss, the sorrows of a refugee housekeeper whose
    husband beat her, a few crises with customers—mostly it was peaceful.


    After graduation, I realized that I had learned to read, I had not learned to
    write, or to do anything better than sales and service work for a living. In those
    days before nonfiction was creative and taught in writing programs, I applied
    to the only place that I could afford and that made sense to me, the Graduate
    School of Journalism at UC Berkeley, and was admitted. The writing sample I submitted
    was a blithely (but laboriously typed) account of an encounter with a group of
    women at a punk club when I was eighteen or nineteen.


    The women had invited me to audition for a movie that turned out to be an attempt
    to repeat the process whereby they and the quadriplegic man who''d the film''s
    director groomed a teenage girl via sex to obey them. They wanted to repeat the
    process with a movie camera and with me; sex with him, the women explained, was
    part of the deal, and he chimed in spelling out “show me your tits” on his communication
    board with his pointer. Servitude and obedience were described, of course, as
    liberation.


    The Pygmalion myth, whereby a woman is turned from insensate sculpture into a
    living being, happens much more frequently in reverse, as a story of women who
    don''t need help being fully alive and aware confronted with the people who want
    to reduce them to something less. Perhaps in turning the encounter into an essay,
    I had affirmed my capacity to think, judge, speak, decide, and maybe thereby to
    make myself. I was going to graduate school to get better at those things.


    I didn''t fit into the school well when I started it a few months after I turned
    twenty-one, because most of the other students wanted to be what the school wanted
    us to be: investigative journalists whose holy grail was the front page of the
    New York Times. They were more sophisticated about politics, older than me, consciously
    low in their appearance as I was still flamboyantantly punk rock in thrift-store
    black and crayon-on eyeliner. I wanted to be a cultural writer, an essayist, though
    what exactly I wanted was not as clear as what I did not want. I wanted to be
    pretty much what I eventually became, but there were not a lot of models and examples
    that I knew then, just inclinations and excitement from the work of writers like
    Pauline Kael, George Orwell, Susan Sontag, Luis Borges.


    What I learned was immeasurably valuable. I was trained in resourcefulness in
    how to find out things, in ruggedness about meeting deadlines, how to organize
    a story and verify facts. I was instilled with a commitment to precision with
    language and accuracy with data and a sense of responsibility toward readers,
    subjects, and the historical record that still matters to me.


    Just before my first year began, the hotel in the Castro was sold, and the new
    owners laid me off after promising not to. Desperate, I talked my way into a waitress
    job at an Italian restaurant just opening, but my inability to remove corks without
    a graceful struggle was one of the reasons that didn''t work out. Had I been better
    at sales and service my fate would probably have been worse. I trudged over UC
    Berkeley''s work-study office, disclosed my plight, and got my chance to apply
    for one of the jobs they orchestrated and partially financed. I pursued one at
    the Sierra Club and one at the San Francisco Museum of Modern Art, both of which
    were offered to me. I went with the museum, for reasons I no longer remember;
    I still work with both institutions


    That the gracious women in pearls and pumps who made up the research department
    hired me still surprises me. I had gone for my interview wearing a baggy suit
    from a thrift store, pants held up with cowboy belt, and my new rockabilly haircut,
    short on the sides and foaming into a pomadour. (I had thought I''d look tough
    and androgynous when I chopped off my long hair, but instead it curled when I
    was relieved of its own weight.) They soon promoted me from rote filing work and
    set me to do serious research. I was there every Tuesday and Thursday for the
    next two years, and full time in the summer between my first and second years
    of graduate school. It was the best job I ever had. The museum, which had been
    preparing for its fiftieth anniversary in 1985, and I was helping with the catalogue
    of the permanent collection''s highlights that would be published on the occasion,
    the first time I produced content for a book. I was researching major works of
    art, and it was the beginning of an education in modern and contemporary art.


    I was handling Matisses, Duchamps, Miros, Derains, and Tamayos (I don''t think
    I worked on anything by a non-male artist, though I was excited by San Francisco
    art historian Whitney Chadwick''s recuperation of the reputations of the surrealists
    and the emergence of Frida Kahlo as a cultural icon in those years). I was putting
    together a dossier on each piece—sales and ownership history, exhibition history,
    a bit of information on the life and work of the artist at the time of its creation,
    contextual material on related works, and more. For two years I wandered in and
    out of storage spaces, file rooms, library stacks, typing up data on a big typewriter,
    corresponding by letter with scholars, solidifying the biographies of a few dozen
    works of art and broadening my own sense of art history.


    I worked directly with paintings in the course of documenting the labels and inscriptions
    on their back sides. I went into the basement to catalogue Duchamp''s Boite-en-Valise,
    a little suitcase with miniatures of his works of art, and the brief covetous
    moment I—my boyfriend at the time loved his work—faded when I realized that every
    work of art lives in its context, and a stolen work of art has to exist outside
    of it, silenced, unable to circulate in the conversation from which it emerged.

    '
  mdcn: '

    我在它们中自由穿行，熟悉各个方向的地形；这种熟悉感是一种奖励，正如陌生感就像一本为了弄清发生了什么而仅仅读过一遍的书那样存在。


    我不会把书籍称为避风港，如果那意味着我只是因为恐惧某些事物而躲在里面。它们是极好的去处，点燃了我的思想，让我与作者们建立联系——间接地通过他们的小说，直接地通过我所青睐的散文、日记和第一人称叙述，随着我开始意识到自己的天职将是散文类非虚构写作。


    我穿行在文字的河流与海洋，以及它们如咒语般的力量。在童话中，命名某件事物会赋予你对它的掌控力；咒语是你说出的某些话，它们只是文字如何塑造世界并带我们进入其核心的浓缩版，比喻如何开启一种新的可能性，明喻如何架起一座桥梁。它们让我听听到那些比大多数人面对面交流更深层、表达更丰富的对话与思想。


    但它们并不温暖，它们没有身体来接纳我的身体，它们永远不会了解我。活在书中也意味着一种“不存在”，同时也存在许多其他的存在、心灵和梦想可以栖息，以及扩张自身想象力与虚构存在的方式。


    决定成为一名作家就像决定吃一块蛋糕一样容易，但随后你必须付诸行动。在旧金山州立大学读本科的最后一个学期，我搬进了那间漂亮的公寓。那是一个疯狂的春天：我努力打工维持生活，同时修了19学分的课程，这全靠一些处方兴奋剂支撑——那是小黄药片，是那个那个在我搬家前交往的男友给我的唯一礼物。


    我准时毕业了，然后发现世界和我彼此还没有准备好面对彼此。我在一家小酒店找了份前台接待的工作，回家的路很惬意，那家酒店位于凯斯特罗区（Castro District）的边缘，那是艾滋病改变该地区街头同性恋男性生活之前的最后几年。我在那儿待了一段时间来自我修复，通过观察周围，不再对时间或金钱感到绝望。这份工作留下了大量时间让我在顶楼的办公桌后阅读，在办理入住退房、接听电话预订、发送确认邮件之间，有时还要铺床或准备早餐托盘。也有烦恼——一个好色的老板、一个被丈夫毒打的难民女管工的哀愁、几次与客户的冲突——但大多数时候是平静的。


    毕业后，我意识到我学会了阅读，但还没有学会写作，也没有学会除了销售和服务类工作之外的任何其他谋生之道。在非虚构写作成为创意性学科并在写作项目中教学之前的日子，我申请了唯一我负担得起且符合我逻辑的地方——加州大学伯伯克利分校的新闻学院，并被录取了。我提交的写作范文是一段轻快的（但打字很费力）的记录，关于我十八、十九岁时在一家朋克俱乐部里与一群女性相遇的经历。


    那些女性邀请我参加一部电影的试镜，结果发现那是试图重复一个过程：她们和那位电影导演（一个四瘫痪患者）通过性关系教化一名少女，让她听从她们。她们想用摄像机并利用我来重复这个过程；女性们解释说，与他发生性是交易的一部分，而他也用指示笔在交流板上写下“给我看你的胸部”。当然，奴役和服从被描述为解放。


    皮格玛利翁神话讲述一个女人从无感的雕塑变成活物，而这种故事在反面发生得得多：关于那些不需要帮助就能完全生活和清醒的女性，如何面对那些想要将她们贬低为卑微之物的人。或许将这次相遇变成一篇散文，我肯定了我思考、判断、言说、决定的能力，或许借此塑造了自己。我要读研究生是为了更好地掌握这些能力。


    当我二十一岁后几个月开始入学时，我并没有融入这所学校，因为大多数其他学生都想成为学校希望我们成为的样子：调查记者，他们的圣杯是《纽约时报》的头条。他们在政治上更老练，比我年大，在外表上有意识地保持低调，而我那时还穿着旧货店的黑色衣服画着蜡笔眼线，依然张扬地朋克摇滚。我想成为一名文化作家、散文家，尽管我具体想要什么并不像我不想要那么清晰。我想要成为我最终变成的样子，但那时我并不知道太多的模型和范例，只有像保琳·凯尔（Pauline
    Kael）、乔治·奥威尔（George Orwell）、苏珊·桑塔格（Susan Sontag）、路易·波尔赫斯（Luis Borges）等作家作品带来的倾向和兴奋。


    我学到的东西价值无法估量。我学会了如何寻找资源获取信息，学会了面对截止日期时的韧性，如何组织故事以及核实事实。我被赋予了对语言精准、对数据准确的追求，以及对读者、主体和历史记录的责任感，这些现在对我来说依然重要。


    就在我第一一开始之前，凯斯特罗的酒店被卖掉了，新老板在承诺过不裁员后解雇了我。走投无路之下，我设获得了一份新开业的意大利餐厅的服务生工作，但我无法在没有优雅挣扎的情况下拔掉软塞，这也是导致失败的原因之一。如果我更擅长销售和服务，我的命运可能会更糟。我艰难地走到加州大学伯伯克利分校的工读办公室，说明了自己的困境，并获得了申请一份由他们策划并部分资助的工作的机会。我在内野洲俱乐部（Sierra
    Club）申请了一份，在旧金山现代艺术博物馆申请了一份，两者都被录取了。我选择了博物馆，原因我已不记得了；我仍然在这两个机构工作。


    那些戴着珍珠、穿高跟鞋的研究部门优雅女性录用了我，这仍令我感到惊讶。面试时我穿着旧货店的宽大西装，用牛仔带系着裤子，留着当时流行的复古卷发（我曾以为剪掉长发后看起来会很酷很中性化，结果头发反而卷起来了）。她们很快将我从枯燥的归档工作中提拔，让我从事严肃的研究。在接下来的两年里，我每周二周四都在那里，研一研二之间的暑假全职工作。那是我做过的最好的工作。博物馆当时正为1985年的五十周年庆做准备，我协助编写馆藏精选作品的目录，那我第一次为书籍创作内容。我研究的是重要的艺术品，那是我现代和当代艺术教育的开始。


    我处理了毕加索、杜尚、米罗（Miros）、德莱因（Derains）和塔马约斯（Tamayos）的作品（我不记得我处理过非女性艺术家的作品，尽管当时我对旧金山艺术史学家惠特妮·查德威克对现实主义者声誉的平，以及弗里达·卡哈作为文化偶像的崛起感到兴奋）。我为每件作品整理档案——销售和所有权历史、展览历史、艺术家创作当时的生平背景信息、相关作品的背景材料等。两年来，我穿梭于储藏室、档案室、书架之间，用大打字机输入数据，与学者通信信，巩固了数十件作品的生平，并拓宽了我自己对艺术史的认知。


    在记录画作背面标签和铭文的过程中，我直接接触绘画。我进入地下室编目杜尚的“箱中盒”（Boite-en-Valise），一个装有他作品微缩版的小提箱，我（当时的男朋友喜欢他的作品）产生的短暂觊瞬间消失了，因为我意识到每一件艺术品都生活于其语境之中，而被盗的艺术品不得不存在于语境之外，被沉默，无法在它所产生的对话中流转。

    '
