  mdcn: '

    多年以后，我才不再让男人来告诉我发生了什么，没发生什么。


    在路条阴暗的大道上，我表现得仿佛这一切都没有发生，尽管我穿过马路，想看看他是否在跟踪我。他像一个诅咒一样缠着我不放。这段路程似乎永无止境，尽管我希望在他攻击我之前到达目的地，心想如果我不打破这种僵局，也许他也不会。汽车驶而过。阴影旋动。我穿过马路。一遍。又一遍。最后在离终点几个街区处，一个开着轿车的男人停了下来，俯身打开副驾驶车门，提议载我一程。


    跟踪者在紧贴我的身后低声说：“你难道不知道进入陌生人的车是你能做出的最危险的事情吗？”当然，我被这样告诫过很多次，我犹豫了。


    然后我上了车。


    司机说：“我曾经过你一次，觉得这不关我的事。我觉得这看起来像是一部希区柯克的电影，于是我回来了。”


    我很感激一个男人从另一个男人手中救了我。真希望我没有处在一部需要被救的希区柯克电影里。


    尽管我被跟踪、被叫喊、被抢劫、被抓，多次有陌生人威胁要杀我，我认识的人几次威胁我，在我试图阻止他们后，他们仍不安地追随我很久，但我没有被强奸，尽管我的许多朋友遭遇过，而且我们所有人的青春都在与威胁中生存，正如大多数地方的大多数女性一样。即使它没有杀死你，它也会伤害你。在这些年里，我注意到报纸后页上隐藏的小故事，只有一两段，在广播中随带提到，关于被肢解的性工作者、被杀害的孩子、受虐的妇女和长期囚禁者，关于丈夫和父亲杀害的妻儿，等等，每一个都被视为一个孤立事件，或者至少不属于任何值得命名的模式。我将这些点连接起来，看到了一场瘟疫，讲述了我看到的模式，等待了三十年，直到它成为一个公共的话题。


    # 4


    暴力的威胁在你的脑中安家。恐惧和紧张占据了你的身体。攻击者让你不由思考他们；他们入侵了你的思想。即使这些可怕的事情没有发生在你身上，它们发生的可能性以及不断的提醒也会产生影响。我怀疑有些女性会将这种感觉压抑在脑海的某个角落，做出选择来减少危险的现实性，使其成为对她们身份和所能为之事的一种无形的减法。无法言说，无法启齿。


    我很清楚失去了什么。而那种重量压垮了我，当我只有几岁、开始起步时，当我努力经营生活、获得话语权、在世界上找到自己的位置时。我做了所有那些事情，后来发现“没有被强奸”成了我青春最热衷的爱好。这需要极大的警惕和戒备，并不断促使我通过城市、郊区、荒野、社交群体、对话和人际关系改变路线。


    你可以向杯水中滴一滴血，它看起来仍然是清水，滴两滴或六滴，但在某一点，它将不再是清的，不再是水。在你的意识改变之前，有多少这些东西进入了你的意识？对于所有脑海中有一滴血、一茶匙或一条河流的女性来说，这意味着什么？如果每天都是如此呢？如果你只是在等水变红呢？看到像你这样的人受折磨是什么感觉？失去了多少活力和宁静或思考其他事情的能力（更不用说去做它们），如果能找回它们会是什么感觉？


    最糟糕的时候，我会开着灯和收音机睡觉，似乎我依然保持着警觉。我的朋友告诉我他们的经历，并问我住在哪栋公寓（我没告诉他们，但我很紧张）。我没有睡得好，现在依然睡得不好。正如人们形容受创伤的人那样，我是过度警觉的，我把家里布置得看起来也过度警觉。我的肉体因紧张而变得脆弱。我以前盯着支撑金门桥的粗钢缆，想着脖子和肩膀上那些紧绷如弦的肌肉。我起得很早，并且当任何人在我附近有突然动作时，我会惊跳——准确地说，是畏缩。


    我告诉这一切，不是因为我觉得我的故事很特别，而是因为它是平凡的；地球的一半表面被覆盖在女性的恐惧和痛苦之上，或者说覆盖在对这些事的否认之上，直到底下的故事看到阳光，否则这一切不会改变。我告诉这些是为了说明，我们无法想象一个没有这种平凡、无处不在的损害的地球会什么样，但我怀疑那将是耀眼且充满力的，那种现在罕见的喜悦的自信将成为常态，一种让许多其他事情变得困难甚至不可能的重量将从人们身上卸下。


    我告诉这些还因为我曾泛泛地写过所有这些事情——用社论和现场调查的客观口吻——我没有充分表现出它是如何伤害你的，或者说它是如何伤害我的。在索海拉·阿卜达拉伊（Sohaila
    Abdalai）关于强奸幸存的书中，提到了一种声音——“一种平滑叙述讲述故事的方式；平实地，有语调但没有真实的情感……无论我们分享了多少细节，我们都会省略那些无法忍受的、没人想听的。”在我的书《行走》中，我写道：“我一生中最具毁灭性的发现是，我在户外没有真正的生命、自由和追求幸福的权利，世界充满了陌生人，他们似乎讨厌我，除了我的性别之外并无无故之恨，那种性如此轻易地变成暴力，几乎没有人人将其视为公共问题，而是私人问题，”但那也没有完全陷入我脑海内部的世界。


    危险摧毁了我的思想。攻击的场景会不请自地出现，有时我通过想象战斗来应对它们，通常通过我并不真正擅长的武术，因此在那个时代阴郁的岁月里，为了不被杀掉，我杀死了他们——在那些侵入性的、焦虑驱动的想象场景中，这是一种魂绕，也是一种试图掌控被魂绕的方式。我那时意识到，让你变得像一个捕食者是捕食者可以对你做的一件事。暴力本身已经渗透了。


    我有着超脱的应对方式。为了寻找安全策略，我想象保护服；如果你想象的是足以阻止伤害的衣服，你想象的就是盔甲，然后，如果你真的，你几年就会拥有一整套中世纪武器，并在博物馆里参观，在书里查阅，想象穿在里面，渴望尝试穿上。在那段时间的最后，我的一个朋友成为了一位纽约艺术家阿莉森·诺尔斯（Alison
    Knowles）的工作室助理，她的丈夫迪克·希格斯（Dick Higgins）来自一个富裕家庭，该家庭在马萨诸塞州的伍彻斯特建立了希格斯盔甲博物馆。


    我给他写了一封信，问他是否能安排我试穿盔甲，让这个请求显得很轻松、理智，像是一个有趣的实验，而不是源于痛苦的幻想。


    我从未近距离接触甲，那是一个想象性的而非实际的解决方案。盔甲难道不就是一个随你移动的笼子吗？也许待在笼子里在某种意义上释放了我。或者也许我在笼子里，既被释放又被窒息：当我想起那时的我是谁，以及现在经常时候时，盔甲那坚硬、反射性的、防御性的表面似乎是一个很好的意象。有种方式可以让你将所有的意识投入到那个表面，投入到变得幽默、警觉、准备好应对攻击，或只是压力大到肌肉锁死、思维锁死。你可以忘记自己温柔的深处，以及忘记生命中许多重要的部分是发生在表面和表面之下的。成为盔甲依然很容易。为了避免被杀死，我们时刻都在死去。

