    # Looking Glass House


    ![](img/db14ca6438d37a021682af27273dff1e_4_0.png)'
  - '[PAGE 5]


    One day long ago, I looked at myself as I faced a full-length mirror and saw my
    image darken and soften and then seem to retreat, as though I was vanishing from
    the world rather than my mind was shutting out. I steadied myself on the door
    frame just across the hall from the mirror, and then my legs crumpled under me.
    My own image drifted away from me into darkness, as though I was a ghost fading
    even from my own sight.


    I blacked out occasionally and had dizzy spells in those days, but this time was
    memorable because it appeared as though it wasn''t the world was vanishing from
    my consciousness but that I was vanishing from the world. I was the person who
    was vanishing and the disembodied person watching her from a distance, both and
    neither. In those days, I was trying to disappear and appear, trying to be safe
    and to be someone, and those agendas were often at odds with each other. And I
    was watching myself to see if I could read in the mirror what I could and whether
    I was good enough and all the things I''d been told about myself were true.


    To be a young woman is to face your annihilation in innumerable ways or to free
    it the knowledge of it, or all these things at once. “The death of a beautiful
    woman is, unquestionably, the most poetic topic in the world,” said Edgar Allan
    Poe, who must not have imagined it from the perspective of women who prefer to
    live. I was trying not to be the subject of someone else''s poetry and not to
    get killed; I was trying to find a poetics of my own, with no maps, no guides,
    not much to go on. They might have been there, but I hadn''t located them yet.


    The struggle to find a poetry in which your survival rather than your defeat is
    celebrated, perhaps upon that, or to at least find a way to survive amidst ethos
    that relishes their erasures and failures is work that many and perhaps most young
    women have to do. In those early years, I did not it particularly well or clearly,
    but I did it ferociously.


    I was often unaware of what and why I was resisting, and so my defiance was murky,
    incoherent, erratic. Years of not succ, or of succumbing like someone sinking
    into a morass and then flailing to escape, again and again, come back to me now
    as I see young women around me fighting the same battles. The fight wasn''t just
    to survive bodily, though that could be intense, but to survive as a person possessed
    of'
  - '[PAGE 6]


    rights, including the right to participation and dignity and a voice. More than
    survive, then: to live.


    The director, writer, and actor Brit Marling said recently, “Part of what keeps
    you sitting in that chair in room enduring harassment or abuse from a man in power
    is that, as a woman, you have rarely seen another end for yourself. In the novels
    you''ve read, in the films you''ve seen, in the stories you''ve been told since
    birth, the women so frequently disastrous ends."


    The mirror in which I saw myself disappear was in the apartment I inhabited for
    a quarter century, beginning in the last months of my teens. The first several
    years there were the era of my fiercest battles, some of which I won, some of
    which left scars I still carry, many of which formed me that I cannot say I wish
    that it had all been otherwise, for then I would have been someone else entirely,
    and she does not exist. I do. But I can wish that the young women who come after
    me skip some of the old obstacles, and some of my writing has been toward that
    end, at least by naming those obstacles.'
  - '[PAGE 7]


    Another mirror story: When I was about eleven there was a shoe store where my
    mother got me the engineer boots I favored back when I was trying not to be despised
    thing, a girl, and was trying to be what seemed like a separate thing, rugged,
    ready for action, but something else the store memorable. If you stepped in front
    of the mirrors that lined both sides of the center aisle, you could see an image
    of an image of image of yourself or the shoe stools or anything, each one more
    watery and dim and remote, stretching onward, beyond, seemingly forever, as though
    an ocean lie there with the reflections and you were seeing farther and farther
    into the sea-green depths. It wasn''t the self I was trying to catch sight of
    then, but the beyond.


    Beyond every beginning is another beginning, and another and another, but my first
    ride, eight years later, on the 5 Fulton bus could be a place to start, that bus
    line bisects the city, running from downtown, by San Francisco Bay, all the west
    out Fulton Street to the Pacific Ocean. The main thrust of this story happens
    in the middle of the route, in the middle of the city, but for just a moment on
    the bus straining uphill past the Jesuit church whose towers catch the morning
    light, onward alongside the big park on the south side of the street and avenue
    after avenue of houses and less densely packed on earth that is almost only sandy,
    to that sandy stretch the Pacific Ocean that covers almost a third of the planet.


    Sometimes the whole sea looks like a mirror of beaten silver, though it''s too
    turbulent to hold many reflections; it''s the bay that carries a reflected sky
    on its surface. On the most beautiful days, there are no words for the colors
    of San Francisco Bay and the sky all over it. The water reflects a heaven that
    is both gray and gold, and the water is blue, green, is silver, catching the warmth
    and cold of colors in its ripples, it is all and none of them, it is something
    more subtle than the language we have. Sometimes a bird dives into the mirror
    of the water, vanishing into its own reflection, and the reflective surface makes
    it impossible to see what lies beneath.


    Sometimes at the birth and death of a day, the opal sky is no color we have words
    for, the gray shading into blue without the intervening green that is halfway
    between those colors, the fiery warm colors that are not apricot or crimson or
    gold, the light morphing second by second so that'
