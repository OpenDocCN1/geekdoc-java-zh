    It was popular in the media and polite conversation to pretend that murderers
    and rapists were marginal men, and not us, but during that time a white man who
    was a bank vice president strangled a teenage sex worker in my suburban hometown
    not quite thirty miles north of San Francisco while his wife and daughters were
    at Girl Scout camp. It was the era of the Night Stalker and the middle-aged white
    man known as theside Killer (who raped and killed women hikers on the trails I
    hiked on) and the Pillowcase Rapist and the Beauty Queen Killer and the Green
    River Killer and the Ski Mask Rapist and many other men who rampaged up and down
    the Pacific Coast without nicknames.


    Two or three years before this narrative begins, a fifteen-year-old runaway had
    been kidnapped near San Francisco, raped, and had her forearms chopped off by
    her rapist, who assumed she''d bleed to death in the culprit he dumped her in.
    She lived to testify and went on to make an ordinary life for herself. He murdered
    another woman he got out of prison. Her story haunted me and the friend who''d
    given me the desk. I found it again in Shakespeare''s Titus Andronicus, where
    Lavinia is raped and has her hands cut off and her tongue cut out to silence her
    but manages anyway to convey what ravaged her. And again in Greek mythology, when,
    after he rapes her, Philomela''s brother-in-law cuts out her tongue to silence
    her.


