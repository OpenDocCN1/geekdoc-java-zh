    It was many years later that I stopped letting men tell me what had and had not
    happened.


    On that dark boulevard, I behaved as though it wasn’t happening, though I crossed
    the street to see if he was following me. He stuck to me like a curse. The walk
    seemed endless, though I was hoping to get to my destination before he attacked,
    thinking that if I didn’t disrupt the stalemate perhaps neither he would. Cars
    passed. Shadows swirled. I crossed the street. Again. Again. Finally a few blocks
    before my destination, a man in a sedan pulled up and leaned over to open the
    passenger door and offered me a ride.


    The stalker murmured from very close behind, “Don’t you know that getting into
    a stranger’s car is the most dangerous thing you can do?” Of course I had been
    told that over and over, and I hesitated.


    Then I got in.


    The driver said, “I passed you once and thought that it was none of my business.
    I thought it looked like a Hitchcock movie, so I came back.”


    I’m grateful a man rescued me from a man. Wish I had not been in a Hitchcock movie
    where I needed rescue.


    Though I was followed and yelled and was mugged and grabbed and more than once
    strangers threatened to kill me and men I knew menacing me a few times and others
    pursued me uncomfortably long after I tried to discourage them, I was not raped,
    though many friends of mine were, and all of us spent our youths navigating the
    threat, as do most women in most places. It gets you even if it doesn’t get you.
    All those years, I noticed the little stories tucked away on newspaper back pages,
    given a paragraph or two, mentioned in passing on broadcasts, about dismembered
    sex workers and murdered children and tortured women and long-term captives, about
    wives and children slain by husbands and fathers, and the rest, each one treated
    as an isolated incident or at least something that was not part of any pattern
    worth naming. I connected the dots, saw an epidemic, talked about the patterns
    I saw, waited three decades for it to become a public conversation.


    # 4


    The threat of violence takes residence in your mind. The fear and tension inhabit
    your body. Assailants make you think about them; they''ve invaded your thoughts.
    Even if none of these terrible things happen to you, the possibility they might
    and the constant reminders have an impact. I suspect some women push it down to
    some corner of their mind, make choices to minimize the reality of the danger
    so that it becomes an unseen subtraction of who they are and what they can do.
    Unspoken, unspeakable.


    I knew what was lost. And the weight of it crushed me, when I was years when I
    was starting out, when I was trying to make a life, have a voice, find a place
    in the world. I did all those things, later that not getting raped was the most
    avid hobby of my youth. It took considerable vigilance and wariness and constantly
    prompted changed routes through cities, suburbs, wild places, through social groups,
    conversations, and relationships.


    You can drop one drop of blood into a glass of water and it will still appear
    to be clear water, two drops or six, but at some point it will not be clear, not
    water. How much of this enters your consciousness before your consciousness is
    changed? What it it do to all the women who have a drop or a teaspoon or a river
    of blood in their thoughts? What if it''s one every day? What if you''re just
    waiting for water to turn red? What does it do to see people like you tortured?
    What vitality and tranquility or capacity to think about other things, let alone
    do them, is lost, and what would it feel like to have them back?


    At the worst, I would sleep with the lights and the radio on so it would seem
    as though I was still alert. My friends told me had had and asked which apartment
    I lived in, of which I didn''t tell them, but my nervousness.) I didn''t sleep
    well and still don''t. I was, as they say of traumatized people, hypervigilant
    and I was setting up my home to appear hypervigilant too. My flesh had turned
    to something brittle with tension. I used to look at the thick steel cables holding
    up the Golden Bridge and think of the muscles in my neck and shoulders that felt
    taut and as. I started early and flinches—cringed, really—when anyone made a sudden
    movement near me.


    I tell all this not because I think my story is exceptional, but because it is
    ordinary; half the earth is paved over women''s fear and pain, or rather with
    the denial of them, and until the stories that lie underneath see sunlight, this
    will not change. I tell this to note that we cannot imagine what an earth without
    this ordinary, ubiquitous damage would look like, but that I suspect it would
    be dazzling alive that a joyous confidence now rare would be common, and a weight
    would be taken off the population that has made many other things more difficult
    to impossible.


    I tell it too because I wrote about all these things in general—in the objective
    voice of editorials and surveys of the scene—I didn’t represent enough of the
    way it harms you, or rather the way it harmed me. There''s a passage in Sohaila
    Abdalai''s book on surviving rape about a kind of voice—“a way of telling the
    story in a smooth arc; matter-of-factly, with intonation but no real emotion.
    . . No how many details we share, we leave out the unbearable nobody wants to
    hear.” In my book walking I wrote, “It was the most devastating discovery of my
    life that I had no real right to life, liberty and pursuit of happiness out of
    doors, the world was full of strangers who seemed to hate me and wished me for
    no reason other than my gender, that sex so readily became violence, and hardly
    anyone else considered it a public issue rather than a private problem,” but that
    too didn’t quite plunge into what it was inside my head.


    Danger wrecked my thoughts. Scenarios of attack would arise unbidden, and sometimes
    I addressed them by imagining the combat, usually by means of martial-arts I''m
    not really capable of, and so I killed in order not to be killed over or during
    the grim years of that era, in imagined scenarios that were intrusive, anxious-driven,
    a kind of haunting and a way of trying to take control of being haunted. I realized
    then that making you think like a predator is one thing predators could do to
    you. Violence itself had penetrated.


    I had ethereal ways of coping. Casting for strategies to be safe, I imagined protective
    clothing, and if you imagine clothing sufficient to stop harm, you imagine armor,
    and then, if you were, you’d end up with the full medieval weaponry for a few
    years and visited it in museums and read up on it in books, imagined being inside
    it, asp to try it on. The end of this time a friend of mine became a studio assistant
    to a New York artist, Alison Knowles, whose husband, Dick Higgins, was from the
    wealthy family that had established the Higgins Armor Museum in Worcester, Massachusetts.


    wrote him a letter asking if he could arrange for me to try on armor, making the
    request cheerful, cerebral, an interesting experiment rather than a fantasy born
    out of agony.


    I never got closer to the armor, and it was an imaginative and not a practical
    solution. What is armor after but a cage that moves with you? Maybe being in cage
    freed me in some way. Or maybe I in in and both freed and stifled by it: when
    I thought of who I was then and often on, the hard reflective, defensive surface
    of armor seems like a good image for it. There''s a way you can throw all your
    consciousness into that surface, into being witty, vigilant, prepared for attack,
    or just so stressed out your muscles lock up and your mind locks down. You can
    forget your own tender depths and how much of life that matters takes place beneath
    the surface and the surfaces. It''s still easy to be the armor. We die all the
    time to avoid being killed.


    Images of levitation also arose unbidden as I revisited or imagined attacks: I
    dreamed of flying, but I wasn''t asking for full freedom, just imagining lifting
    out of reach, however many feet that might be above the head of a pursuer. If
    I could not have a body too solid to be harmed, an armored body, could I have
    one too ethereal to be part of the clashes on the surface of the earth?


    I imagined that so earnestly that I can still feel and see myself rising up to
    the level of the street lamp outside my apartment, hovering there in the halo
    of light in the night, safe not just from predators but from the laws of physics
    and the rules governing human bodies and perhaps from the vulnerability of being
    a mortal who had a body and lived on earth and the weight of all those fears and
    that hate.

