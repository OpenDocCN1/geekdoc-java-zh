    那春天，卢克·桑特（Luc Santé）在《纽约评论体系》上的一篇关于伯鲁斯的犀利文章给我留下了深刻印象。他引用了伯鲁斯对一位采访者的话：“正如一位伟大的厌女主义者直白的琼斯先生所说，在康德的作品中：‘女人是完美的诅咒。’我认为她们是一个基础性的错误，而整个二元论宇宙都是从这个错误演化而来的。”桑特写道：“他将女性与西方文化中最压抑的方面联系在一起，而对她们没有任何性需求；不言而喻，她们是多余的阻碍。当生殖这个棘手问题最终解决时，女性就会被扫出这个世界。”伯鲁斯还于1951年9月6日枪杀了他的妻子乔安·沃尔默（Joan
    Vollmer），尽管关于他如何以及为何要求让她在头上顶一个杯子以便他“玩‘威廉·泰尔’”的版本众不一，但很清楚的是他用枪对准她，一枪贯穿了她的额头，她去世了。


    我二十多岁时曾待在一起的一个年轻人，是我男朋友弟弟的好朋友，他比我认识的任何人都痴迷伯鲁斯。我认识的许多人人都见过这位老作家，当时他被视为朋克文化的教父之一。那个年轻人是个同性恋，与他的德克萨斯家庭断绝，试图寻找自己的道路；他是一个有天赋的音乐家，但迷信药物带来的感官混乱是通往艺术天才的王道。那种混乱源于一个世纪前的亚瑟·兰姆波（Arthur
    Rimbaud），并演变成了另一个反文化符号：即你必须通过自我陶醉来获得创造性的自我，认为某些天才潜伏在抑制力之后，而你只需要在没有任何纪律或结构的情况下让那个天才出来即可。


    我身边的年轻人认为伯鲁斯是这一切的典范，他曾花费了大量时间服用大量药物，并有家庭津贴和一种带有讽刺意味的体质支撑。我认识的那个年轻人这两者都没有。我记得记得与他度过的一个晚上，他正处于幻觉中挥舞着彩色马克笔，试图在纸上（以及专辑封面）上画画，并直接在我公寓的地板上涂鸦。我带着悲哀记得他变得越来越沉迷冰毒，然后变成一个穿着肮脏牛仔裤、光脚走在市场街上的流浪汉，再也认不出我。他曾被一位善良的老人照顾过一段时间，后来我听他说从金门大桥跳了，一个善良且有才华的年轻灵魂，死于多种原因，包括那种盛行的神话。


    我的编辑和我穿着雪纺连衣裙参加了位于高架桥下方的“生存研究实验室”（Survival Research Labs）工业场所的派对。她身材丰满，留着金色长发，穿着一件漂亮飘逸且大大露胸的衣服；我写下了对那件死掉的芭蕾舞服的看法。那可能曾是一件孩子的衣服，在我在二手店找到它之前，在某个地下室里被塑形了多年。它有一个小小的胸衣，上面有一排黄色蕾丝，无肩带，尽管我用半撕掉的蕾丝边缘临时凑做了一根肩带，还有一条蓬松的及膝裙，由薄纱面物的破碎花瓣制成，呈点状垂下。


    我经常发现自己想要对得起这身衣服，而一套喜庆的装扮会产生喜庆的心情，于是她和我大声笑着、调着情、穿梭、挥动着手臂，喷洒着香水和带着口红的微笑，用我们彩绘过的眼睛自由地环顾四周，看着那些站在那里、面无表情得仿佛已经化成石头的人们。陪同伯鲁斯的男人正在拍照，就在在他的催促下，我和从两个侧面冲向伯鲁斯，他似乎在惊恐中蜷缩回他那早已枯萎的躯体里。

    我一直描述他在那一刻看起来像一只在两个盐罐之间的蛞蝓。那种感觉非常痛快，然后我们继续往前走。


    写作是一门艺术；出版是一门生意，在开始我的第一本书时，我独自坐在房间里，带着想法、素材和英语，与各种大小出版社开启了一系列冒险。写作方面总体来说很顺利。出版则是我与那些组织谈判，这些组织总有更多的人、更大的权力，有时充当我的支持者和合作者，有时充当我的对手。


    不久前的一个晚上，我的朋友提娜（Tina）和我去旧金山西部的一家小电影院看《华盛顿邮报》（The Post），那里的天空更暗，风更大，一切似乎都更梦幻一些。电影讲述了两个交织的故事：关于《华盛顿邮报》决定报道五角楼文件——丹尼尔·艾尔斯伯（Daniel
    Ellsberg）泄露的证明越南战争是基于谎言的材料；以及凯瑟琳·格拉姆（Katharine Graham）在丈夫去世后刚刚接手出版工作，如何同时兼顾她的事业和自我，扫清了那些俯视她的男人，扫清了她对自己是否有能力掌握权力并做出改变世界决定的自我怀疑。


    我们享受了车程，享受清爽的夜晚，以及在此之前的爆米花、电影中格拉姆女士那强大的共和派风格装饰和服装，以及印刷机运转的场景。当我们走入黑夜时，我不知为何发现自己在谈论我在出版方面的挣扎。我已经很久没有想起我早年试图出版书籍的尝试是多么痛苦，以它们自己的方式，或者说，是热烈地阻碍我出版。我很幸运克服了他们竖立的障碍，但我推测其他人没有。现在我可以看到出版界过去和现在是什么样的，尽管有些门因为我的性别而关上，但另一些门因为我的种族而开启。


    有些损害以它们自己的方式是幽默的。一天，我第一本书的手稿被随机改变了内容，导致法国艺术家尼基·德·圣菲（Niki de Saint Phalle）变成了圣保罗的尼基（Niki
    of Saint Paul），从标志性的变成了讽刺性的，从1957年变成了1967年。我并不知道其中的原因，但当我反抗时，却被认为应该顺从从之。

