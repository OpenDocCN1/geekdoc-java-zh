  raw:
  - '[PAGE 78]


    roamed freely in them, knowing the territory in all directions, and familiarity
    was a reward as strangeness might be in a book read once just to find out what
    happened.


    I would not call books an escape if that meant I was only hiding out in them for
    fear of something else. They were glorious places to be, and they set my mind
    on fire and brought me in contact with the authors and indirectly in their fictions,
    directly in the essays and journals and first-person accounts that I gravitated
    to as I came to understand that my own vocation was going to be essayistic nonfiction.


    I swam through rivers and oceans of words and their incantatory power. In fairy
    tales naming something gives you power over it; a spell is some words you say
    that are just concentrated versions of how words make the world and take us into
    its heart, how a metaphor opens up a new possibility, a simile builds a bridge.
    They let me listen to conversations and thoughts that went deeper and expressed
    more than most people could face-to-face.


    But they were not warm, they had no bodies to meet my body, and they would never
    know me. There was nonexistence in living through books as well as many other
    existences and minds and dreams to inhabit and ways of expanding one’s own imaginative
    and imaginary existence.'
  - '[PAGE 79]


    It is as easy to decide to be a writer as to decide to have a piece of cake, but
    then you have to do it. I moved into that beautiful apartment as I was in my final
    semester of my undergraduate education at San Francisco State University. It was
    an intense spring: I was working to support myself and taking nineteen units of
    classes, helped along by a handful of prescription speed in the form of little
    yellow pills that been the only gift given me by the man I''d dating before I
    moved.


    I graduated at turned, and then realized that the world and I were not ready for
    each other. I got a desk-clerk job a pleasant walk home in a small hotel, out
    there on the edge of the Castro District in those last years before AIDS would
    change everything for the gay men who thonged the streets of the neighborhood.
    I stayed there for a restorative of catching myself by looking around and not
    being desperate for time or money. The job left a lot of time to read behind a
    rooftop desk, in between checking guests in and out taking reservations by phone
    and mailing confirmations and sometimes making beds or breakfast trays. There
    were troubles—a lecherous elderly boss, the sorrows of a refugee housekeeper whose
    husband beat her, a few crises with customers—mostly it was peaceful.


    After graduation, I realized that I had learned to read, I had not learned to
    write, or to do anything better than sales and service work for a living. In those
    days before nonfiction was creative and taught in writing programs, I applied
    to the only place that I could afford and that made sense to me, the Graduate
    School of Journalism at UC Berkeley, and was admitted. The writing sample I submitted
    was a blithely (but laboriously typed) account of an encounter with a group of
    women at a punk club when I was eighteen or nineteen.


    The women had invited me to audition for a movie that turned out to be an attempt
    to repeat the process whereby they and the quadriplegic man who''d the film''s
    director groomed a teenage girl via sex to obey them. They wanted to repeat the
    process with a movie camera and with me; sex with him, the women explained, was
    part of the deal, and he chim in spelling out “show me your tits” on his communication
    board with his pointer. Servitude and obedience were described, of course, as
    liberation.'
  - '[PAGE 80]


    The Pygmal myth, whereby a woman is turned from insensate sculpture into a living
    being, happens much more frequently in reverse, as a story of women who don''t
    need help being fully alive and aware confronted with the people who want to reduce
    them to something less. Perhaps in turning the encounter into an essay, I had
    affirmed my capacity to think, judge, speak, decide, and maybe thereby to make
    myself. I was going to graduate school to get better at those things.


    I didn''t fit into the school well when I started it a few months after I turned
    twenty-one, because most of the other students wanted to be what the school wanted
    us to be: investigative journalists whose holy grail was the front page of the
    New York Times. They were more sophisticated about politics, older than me, consciously
    low in their appearance as I was still flamboyantantly punk rock in thrift-store
    black and crayon-on eyeliner. I wanted to be a cultural writer, an essayist, though
    what exactly I wanted was not as clear as what I did not want. I wanted to be
    pretty much what I eventually became, but there were not a lot of models and examples
    that I I knew then, just inclinations and excitement from the work of writers
    like Pauline Kael, George Orwell, Susan Sontag, Luis Borges.


    What I learned was immeasurably valuable. I was trained in resourcefulness in
    how to find out things, in ruggedness about meeting deadlines, how to organize
    a story and verify facts. I was instilled with a commitment to precision with
    language and accuracy with data and a sense of responsibility toward readers,
    subjects, and the historical record that still matters to me.


    Just before my first year began, the hotel in the Castro was sold, and the new
    owners laid me off after promising not to. Desperate, I talked my way into a waitress
    job at an Italian restaurant just opening, but my inability to remove corks without
    a graceful struggle was one of the reasons that didn''t work out. Had I been better
    at sales and service my fate would probably have been worse. I trudged over UC
    Berkeley''s work-study office, disclosed my plight, and got my chance to apply
    for one of the jobs they orchestrated and partially financed. I pursued one at
    the Sierra Club and one at the San Francisco Museum of Modern Art, both of which
    were offered to me. I went with the museum, for reasons I no longer remember;
    I still work with both institutions'
  - '[PAGE 81]


    That the gracious women in pearls and pumps who made up the research/collections
    department hired me still surprises me. I had gone for my interview wearing a
    baggy suit from a thrift store, pants held up with a cowboy belt, and my new rockabilly
    haircut, short on the sides and frothing into a pomadour on. (I had thought I''d
    look tough and androgynous when I chopped off my long hair, but instead it curled
    when I was relieved of its own weight; toughness was an ideal I aspired to without
    success, at least as an aesthetic.)


    Those women must have seen something in me, because they soon promoted me from
    rote filing work and set me to do serious research. I was there every Tuesday
    and Thursday for the next two years, and full time in the summer between my first
    and second years of graduate school. It was the best job I ever had. The museum,
    which had been preparing for its fiftieth anniversary in 1985, and I was helping
    with the catalogue of the permanent collection''s highlights that would be published
    on the occasion, the first time I produced content for a book. I was researching
    major works of art, and it was the beginning of an education in modern and contemporary
    art.


    I was handling Matisses, Duchamps, Miros, Derains, and Tamayos (I don''t think
    I worked on anything by a non-male artist, though I was excited by San Francisco
    art historian Whitney Chadwick''s recuperation of the reputations of the surrealists
    and the emergence of Frida Kahlo as a cultural icon in those years). I was putting
    together a dossier on each piece—sales and ownership history, exhibition history,
    a bit of information on the life and work of the artist at the time of its creation,
    contextual material on related works, and more. For two years I wandered in and
    out of storage spaces, file rooms, library stacks, typing up data on a big typewriter,
    corresponding by letter with scholars, solidifying the biographies of a few dozen
    works of art and broadening my own sense of art history.


    I worked directly with paintings in the course of documenting the labels and inscriptions
    on their back sides. I went into the basement to catalogue Marcel Duchamp''s Boite-en-Valise,
    a little suitcase with miniatures of his works of art, and the brief covetous
    moment I—my boyfriend at the time loved his work—faded when I realized that every
    work of art lives in its context, and a stolen work of art has to exist outside
    of it, silenced, unable to circulate in the conversation from which it emerged.
    That storage'
- md: '

    basement had other lessons to impart: it contained some art that would probably
    never be shown again—paintings and other items that had seemed significant in
    their time but been written out of history or never written into, odd trends and
    faded heroes, movements that had lost their sheen, detours from the official road
    of art history, a windowless room of orphans and exiles.


    I also spent years in the hushed room full of files from the era of Grace McCann
    Morley, the museum''s inspired, forgotten founding director, and it was then I
    fell in love with archives and the task of assembling a history out of fragments.
    I noticed a drawing by Matisse in a letter to her and had it moved from correspondence
    files to the art collection. I wandered through the history of many artworks as
    a traveler, learning the world around them, coming to recognize landmarks I could
    return to. I worked on a painting by the German expressionist Franz Marc—a mountainscape
    he had repainted after he''d been to Paris and seemed the new thing that was cubism:
    I had it X-rayed to show the old painting underneath, and I found the data to
    change the title. To play a role in the writing of art history, even with this
    one act, was electrifying.


    Since Morley, all the directors of that museum had been men, but a few ranks below,
    women seemed to run everything. I worked under a kind woman out of a tiny office
    in the library who taught me my job, and I wandered to consult the dashing, gray-voiced
    longtime librarian Eugenie Candau in her own office, and sometimes scavenging
    from her wastebasket the exhibition postcards she discarded. It was ravenous for.
    It was a second education as valuable and formative as the one I was getting across
    the bay at the university.


    One day I saw a work of art by Los Angeles artist Wallace Berman that captivated
    me. It was a grid repeating an image of a hand holding a transistor radio bursting
    out of the radio’s speaker, a piece about pop culture and mysticism with few Hebrew
    letters scattered on it. In my naï, I went to find the book I assumed existed
    on this extraordinary career. There wasn''t one, though there was a slender exhibition
    catalogue surveying his work. I didn''t know yet that I would write that book,
    or a version of it, some years later. I picked Berman as the subject for my thesis,
    though it was unconventional for a journalism student to focus on something so
    far from the news and the realms of news. Berman had died in 1976, having destroyed
    the recording of the only interview known to have been conducted with him, so
    there was a lot to reconstruct from archives and interviews with members of his
    circle. The coincidences that led me to the museum that led me to the image that
    led me to the project make me grateful for my failure at opening wine bottles.


    Though I was browsing at City Lights bookstore and researching the Beat poets
    for thesis, and interviewing some of them, I encountered my fellow San Franciscan
    Diane di Prima’s work only later, including her declaration “You cannot write
    a single line w/out a cosmology.” Writing is often treated as a project of making
    things, one piece at a time, but you write from who you are and what you care
    about and what true voice is yours and from leaving all the false voices and wrong
    notes behind, and underneath the task of writing a particular piece is the general
    one of making a self who can make the work you are meant to make.


    It formalizes the process everyone goes through, making the self who will speak,
    of settling on what values and interests and priorities will shape your path and
    your persona. You have to find out what kind of tone you are going to take, how
    you pitch your words, whether you’re going to be funny or grim or both. Often
    what emerges is not what you intended; it turns out you’re someone who also has
    others to say and other ways to say them (what gets called “a voice” is at the
    outset some person you don’t know well arriving at the front door with a different
    focus and tone than you expected). You discover what ethics are implicit or explicit
    in how you describe the world, what ideas of beauty you are pursue, style and
    tone behind which lies a question of self.


    I went back to Prima’s declaration in her famous “Rant.” Further down, the poem
    continues:


    - There is no way out of the spiritual battle

    - There is no way you can avoid taking sides

    - There is no way you can not have a poetics

    - no what you do: plumber, baker, teacher

    - You do in the consciousness of making

    nor making yr world


    The voice that came out of when I spoke in social settings and often even to a
    single friend wore a thousand pounds of armor and was incapable of saying anything
    direct about emotions, which I was barely feeling or through so many filters I
    hardly knew what was spinning me around. But the voice: it was the voice I’d grown
    up around and learned to emulate and then to promulgate, a voice that strove to
    be clever, cool, sharp, and amused, to shoot arrows with precision and duck the
    arrows that came back and pretend they hadn''t stung. It relied on jokes and quips
    that were often cruel in a game where anyone was hurt or offended by those jabs
    was supposed to be lacking in humor or strength or other admirable qualities.
    I didn''t understand what I was doing, because I didn''t understand that there
    were other ways to do it, but that didn''t mean it wasn''t spirited at times.
    (Later, I discovered that scathing and mocking reviews were the easiest and most
    kind to write, but I tried to write them only about much-lauded successes.)


    There was another kind of humor, or rather a ponderous wit, that was convoluted,
    full of citations and puns and plays on existing phrases, of circling around,
    far around, what was happening and what you were feeling. It was as though the
    more indirect and referential your statement, the further away from your immediate
    and authentic reaction, the better. It would take me a long time to understand
    what a limitation clever can be, and to understand how much unkind damaged not
    just the other person but the possibilities for yourself, the speaker, and what
    courage it took to speak from the heart. What I had then a voice that leaned hard
    on irony, on saying the opposite of what I meant, a voice in which I often said
    to one person to impress other, a voice in which I didn''t really know much about
    what I thought and felt because the logic of the game determined the moves. It
    was a hard voice on a short leash.


    That voice isn''t just in your conversations, it''s inside your head: you don''t
    say that hurt, or I feel sad; you run angry tirades about why the other party
    is the terrible person over and over, and you layer on anger to avoid whatever''s
    hurt or frightened underneath, until it''s certain that you don''t know yourself
    or your weather, or that it''s you telling the story that''s feeding the fire.
    You generally don''t know other people except as they impose on you; it''s a failure
    of imagination going in.


    But that was just the stories within. The stories I wanted to write and the person
    who would write them were not yet born. I knew who I admired, not who I was. You
    cannot write a single line without a cosmology. I had so much work ahead of me,
    and I did it slowly, in stages. I was many different writers along a road on which
    my various books and essays are milestones. In journalism school I learned to
    write straightforward reports, though my first teacher resented my inability to
    write the flat prose that was often taken for objectivity, even then I saw as
    a masculine voice.


    The television show Dragnet, which was old even then, opened every episode with
    a hard-boiled man’s voice flatly claiming, “The story you are about be true. The
    names have been changed to protect the innocent.” It was like the prose of Hemingway,
    which my first college English professor had insisted was the pinnacle of good
    writing, that stripped-back, clipped, tense language that was also about masculinity
    and its parsimonious words packed in silences. It was a voice policing many things,
    and leaving a lot unsaid in the same way the ironic poses favored by my family
    did. The tone that we were supposed to deploy as journalists sounded to me like
    that tone, at least that we were allowed to quote people who might be more expressive
    and emotional.


    I wanted language that could be simple and clear when the subject required it,
    but sometimes clarity requires complexity. I believe in the irreducible and in
    invocation and evacuation, and I am fond of sentences less like superhighways
    than winding paths, with the occasional scenic detour or pause to take in the
    view, since a footpath can traverse steep and twisting terrain that a paved road
    cannot. I know sometimes what gets called digression is pulling in a passenger
    who fell off the boat. I wanted English to be an instrument on which many kinds
    of music could be played. I wanted writing that could be lavish, subtle, evocative,
    that could describe mists and moods and hopes and not just facts and solid objects.
    I wanted to map how the world is connected by patterns and intuitions andsemblances.
    I wanted to trace the lost patterns that came before the world was broken and
    find the new ones we could make out of the shards.

    '
  mdcn: '

    地下室还有其他要传授的课程：它包含了一些可能永远不会再展出的艺术品——那些在当时显得意义重大，但已被历史抹除或从未被记录的绘画和其他物品，奇特的潮流和凋零的英雄，失去光彩的运动，偏离艺术史官方道路的旁路，一个没有窗户的孤儿与流亡者的房间。


    我也在那个充满了格蕾斯·麦康·莫利（Grace McCann Morley）时代文件的安静房间里度过了多年，她是这家博物馆那位富有灵感却被世遗忘的创始人。正是在那时，我爱上了档案，以及从碎片中组装历史的任务。我在写给她的一封信中注意到一幅马蒂斯的画，并将其从信件文件中移到了艺术收藏中。我像一个旅行者一样穿梭在许多艺术品的历史中，学习它们周围的世界，逐渐认出那些我可以回归的地标。我曾处理过德国表现主义画家弗兰茨·马尔（Franz
    Marc）的一幅画——那是他在去巴黎之后重画的一幅山水，看起来像是立体主义的新产物：我对它进行了X光照射以显示底部的旧画，并发现了更改标题的数据。即使只是通过这一行为在艺术史的撰写中扮演一个角色，也让我心潮澎湃。


    自从莫利之后，这家博物馆的所有主管都是男性，但在职位低几级的地方女性似乎掌控着一切。我在图书馆的一间小办公室里为一位和蔼的女性工作，她教我业务；我会走去她自己的办公室，请教那位气质潇洒、声音低沉的资深图书管理员尤金妮·康道（Eugenie
    Candau），有时我会从她的垃圾桶里搜集她丢弃的展览明信片。我对此极度渴望。这是第二次教育，与我在对岸大学所接受的教育一样，有价值且具有塑造性。


    一天，我看到了洛杉矶艺术家华莱士·伯曼（Wallace Berman）的一件令我着迷的作品。那是一个网格，重复着一只手拿着晶体管收音机从收音机喇叭中破而出的图像，这是一件关于流行文化和神秘主义的作品，上面散落着几个希伯来字母。在我的天真中，我去找一本我认为存在的、关于这段非凡职业生涯的书。然而并没有那本书，只有一本薄薄的介绍他作品的展览目录。我当时还不知道，几年后我会写下那本书，或者它的某个版本。我选择伯曼作为论文的主题，尽管对于一个新闻系学生来说，关注如此远离新闻和新闻领域的事是不寻常的。伯曼于1976年去世，他销毁了已知对他唯一的唯一采访录音，因此有很多内容需要通过档案和对其圈子成员的访谈来重建。那些引导我进入博物馆、引导我看到图像、引导我启动这个项目的巧合，让我感激自己开酒瓶时的失败。


    虽然我在城市之光书店浏览并为论文研究比特浪诗人，并采访了他们中的人，但我后来才遇到我的同为旧金山人戴安·迪·普里玛（Diane di Prima）的作品，包括她的宣言：“没有宇宙观，你写不出一任何行。”写作通常被视为一个一个一个创造东西的过程，但你的写作基于你是谁、你关心的什么、你的真正的声音是怎样的，并来自于抛弃所有的虚假声音和错音；而在撰写特定作品的任务之下，是塑造一个能够创作出你注定要创作的作品的自我通用任务。


    它形式化了每个人都会经历的过程：塑造那个将发言的自我，决定什么样的价值观、兴趣和优先事项将塑造你的道路和人格。你必须弄清楚你将采取什么样的基调，如何组织你的措辞，你是要幽默、冷峻还是两者兼有。通常涌现出来的并不是你的意图；事实证明你也是一个有其他话要说、有其他方式要表达的人（所谓的“声音”，在起初是一个你并不熟悉的人，带着与你预想不同的重点和语气敲门而入）。你发现了在描述世界时内含或显性的伦理是什么，你追求的是何种美学理念，以及在风格和语气背后隐藏着关于自我的问题。


    我回到了普里玛在她著名的《咆哮》（Rant）中的宣言。在在后面，诗歌继续写道：


    - 精神战斗没有出路

    - 你无法避免选择站队

    - 你无法不拥有一套诗学

    - 无论你做什么：水工、烘焙师、老师

    - 你在创造的意识中行动

    - 或者不是在创造你的世界


    当我在社交场合说话，甚至经常对着一个朋友说话时，发出的声音披着千斤重的盔甲，无法对情绪说任何直接的话，而我几乎感觉不到那些情绪，或者通过太多的过滤器，我几乎不知道是什么让我团团转转。但那个声音：那是我从小成长周围并学会模仿然后传扬的声音，一个力求聪明、酷酷、敏锐和幽默的声音，精准地射出箭，并躲避回射的箭，假装那些箭没有伤到自己。它依赖于笑话和俏皮话，这些回话往往是刻薄的；在这种游戏中，任何被这些挑刺伤害或冒犯的人，都会被认为缺乏幽默感、力量或其他值得赞叹的品质。我不明白自己在做什么，因为我不明白还有其他方法可以做到，但这并不意味着它有时是不够精神的。（后来，我发现尖锐和嘲讽的评论是最容易写也最友善的写法，但我尝试只针对那些备受赞誉的成功写这样的评论。）


    还有另一种幽默，或者说是一种沉重的机智，它是错综复杂的，充满了引用、双关语和对现有短语的运用，围绕着正在发生的事情和你的感受转圈，绕得非常远。仿佛你的陈述越间接、越引用，就越远离你直接且真实的反应，就越好。我需要很时间才能理解这种间接和引用式的表达可以有多聪明，以及理解这种局限性不仅伤害了自我，而且从内心出发需要多少勇气。我的声音习惯于讽刺，倾向于表达相反的意思，我的声音在其中我表达了，在其中我并不真正了解自己的想法和感受，因为游戏的逻辑决定了动作。那是一种被短绳牵着的声音。


    那种声音不仅存在于对话中，它在你的脑海里：你并不说痛苦，或者我感到悲伤；你不断叠加愤怒来覆盖内心的恐惧，直到确定你并不知道自己或你的天气，或者那是你在讲述那个正在助火的故事。这种进入是想象力的失败。


    但那只是内在的故事。我想要创作的故事以及创作这些故事的人尚未出生。我只我钦佩谁，却不知道我是谁。没有宇宙观，你写不出一任何行。我面前有很多工作要做，我是分阶段缓慢完成的。我是这条道路上的许多作家，我的各种书籍和论文是路标。在新闻学院，我学习写直白的报告，尽管我的第一个老师反感我无法写那种常被视为客观的平铺文字，即便那时我也将其视为一种男性的声音。'
