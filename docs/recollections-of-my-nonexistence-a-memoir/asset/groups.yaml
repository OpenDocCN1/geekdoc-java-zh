    以黑白特写镜头描绘，作为一个占据了整个画面的巨石般的物体。


    当我的书在1991年出版时，科普兰斯（Coplans）让律师给灯塔出版社（City Lights）写了一封信，指控我诽谤。沃利·赫德里克（Wally Hedrick）是那本书的六个核心主题之一，他从1953年开始画美国旗，他或多地丢失或销毁了所有具有美国艺术地标微小地位的画作，因为纽约画家贾斯珀·约翰斯（Jasper
    Johns）稍晚一点才因画美国旗而闻名。（他画了许多此类作品以抗议越南战争。）我在书中写道，赫德里克的其中幅画“一直保存到1963年，根据赫德克的说法，艺术评论家约翰·科普兰斯从一次赫德里克作品的十年展中借走了它，并且再也没有还。他曾要求把画画带给一位有购买兴趣的女士，此后该作品再未出现过。”


    科普兰斯声称，这不仅把他描绘成一个小偷，而且他从未见过过赫德里克。我记得律师的信中暗示，如果我们销毁所有的书籍副本，就将不再采取进一步行动。这种想要随手消灭多年心血以及首本书所代表的问世之作的欲望，令人震惊。雪上糟糕的是，据我所知，收到信的编辑似乎认为我把事实搞得严重错误是合情合理的。在那些日子里，无论是在人际交往还是关于历史的问题，我似乎很少被认为拥有多少能力或公信力。


    我仍然习惯于收集证据来支持自己，而我也确实做了：我去了旧金山现代艺术博物馆（SFMOMA）的图书馆，复印了一大堆关于这两个人当年发表的对话和合作的材料。我相信，我的编辑将这些材料转给了律师。我的书的所有副本都没有被销毁，尽管它们过了一段非常寂静的时光，现在已经绝版了。两篇撰稿中的一篇将该书的作者归功于诗人兼评论家比尔·伯克斯森（Bill
    Berkson），他写了一段非常诚挚的序言，开头引用了米娜·洛（Mina Loy）的一句名言：“共同悲剧是受苦却从未出现。”


    2008年，我写了一篇名为《男人向我解释一切》（Men Explain Things to Me）的文章，其中包含一句话：“公信力是一种基本的生存工具。”在某种程度上，公信力也是我的职业，或者至少是任何非虚构类作家必备装备之一。在开始，我必须为它而战。也就是说，在个人和职业生活中，我必须战以说服他人赋予我以合理准确度去感知事件的能力，而这种经历的频率在我心中种下了自我怀疑，因此斗争不仅是针对他人的。


    并非总是可以说某个特定的天气事件归因于气候变化，但气候变化塑造的趋势是显而易见的，歧视情况也是如此——这一特定事件可能并非源于某人对你所属类别的态度，但累积效应暗示了一种模式。现在回起来，似乎我并没有生活在一个对我的威胁是真实且紧迫的文化中，那些在我青少年时代就备受推崇的女作家对女性的蔑视并不那么灼热，那么这些针对我的行为可能看起来像是一系列不幸且互不关联的事件。


    我的第二本书是一本完全不同的书，它有一个吉祥的开端：1991年一个周一，我向西耶拉俱乐部出版社（Sierra Club Books）寄了一份提案，周二接到了编辑的来电，周三与他见面。书很快就出版了。我卖掉了那辆破旧的达达B210，用1万美元预付款中的部分资金买了一辆带有野营篷的二手白色雪佛S10皮卡车，以便更好地追求我的横跨西部之旅。在写《秘密展览》（Secret
    Exhibition）期间，我的生活发生了变化；如果说第一本书为我理解我时代之前的近期和当地历史奠定了基础，那么第二本书就是对美国西部及其神话、战争、盲点、奇迹、罪犯和女英雄更广泛、更深层的探究。


    这本书名为《荒野之梦：进入美国西部隐藏世界之旅》（Savage Dreams: A Journey into the Hidden Worlds of the
    American West），讲述的是隐形如何允许暴行的发生。书的前半部分的战争发生在内华达测试场，在那里，那些被普遍认为某一天可能发生的可怕核战争，实际上在1951年至1991年间以每月约一次核弹爆炸的速度发生着，总共一千多次，对当地环境和人类无疑产生了直接影响。书的后半部分是关于约塞米国家公园的，在那里，那些被广泛认为是很久以前发生的坏事的印第人，正通过其他方式在当下发生——原住民与传统观念相反，他们并没有消失、幻、走上小路的终点、步入夕阳，也没有成为他们物种的最后一代。原住民被呈现（或者更准确地说是非呈现）而变得隐形——在标牌中、在那些更显眼的博物馆里、在土地管理实践中，以及在环保组织和艺术家将约塞米描绘成一片由白人最近发现的无人荒野，以及一个人们仅作为游客才属于的地方。


    也就是说，我是在论证未来与过去的战争在当下是重叠的，由于我们思考战争、西部、自然、文化和原住民的方式，这些战争在很大程度上没有被承认。我是所有这一切之下思想革命的受益者。原住民正在主张，他们从未离开，从未放弃过权利，从未忘记过自己的历史，而且土地本身就有历史，一段与文化并不分离的历史。


    也就是说，我是在论证未来与过去的战争在当下是重叠的，由于我们思考战争、西部、自然、文化和原住民的方式，这些战争在很大程度上没有被承认。我是所有这一切之下思想革命的受益者。原住民正在主张，他们从未离开，从未放弃过权利，从未忘记过自己的历史，而且土地本身就有历史，一段与文化并不分离的历史。

