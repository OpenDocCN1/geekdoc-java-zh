    ## Foghorn and Gospel


    ![](img/db14ca638d37a02168af27273dffe_15_png)


    The Baptist Church was two blocks east of my apartment, in a three-story Victorian
    building with two cross-topped turrets like grain silos on either side of the
    building and a rare thing in neighborhood buildings that came right up to the
    sidewalk: a small lawn out front, and in the middle of the lawn along some struggling
    roses a wooden sign announcing its name. Year after year I passed it contemplating
    what a new stranger might be. The Solid Rock Baptist Church, where Lyon Street
    got steep, was one of several places of worship I’d sometimes pause outside to
    listen to the gospel music being inside. I was an outsider in that neighborhood,
    a new stranger, even if it was a neighborhood of outsiders to the white society
    within I was free to travel and belong.


    It was a little neighborhood, five blocks wide, six blocks, defined by broad boulevards
    to the east and west, the verdant panhandle of Golden Park to the south, and a
    steep hill that functioned as a kind of wall to the north. My new home was on
    the south corner of a block whose north side was the dim, low-sung Pentecostal
    church that was also a polling place. Next to it was the liquor store owned by
    the African immigrant whose teenager''s funeral I went to many years later, after
    he was gunned down in a drive-shooting. The funeral was at the Emanuel Church
    of God in Christ in Hayes, three blocks away from the family store, less than
    that from the laundromat in front of which the boy was murdered.


    The church was a pretty building that in a paler era Mormon funeral service was
    rousing, musical, of the finest oratory I''ve ever heard. The neat, angular stucco
    church painted in pastels always looked like it had fallen out of one of the quattrocento
    paintings of the saints. Across from it was the little storefront church I once
    attended in my first years; the crucifix above the altar was made of egg cartons,
    bumpy side out. There were several black churches in that same area. You were
    never far from devotion.


    A beautiful mansion painted white hosted the Brahma Kumaris Meditation Center,
    and when AIDS became a worldwide scourge later in the decade, Mother Teresa''s
    Missionaries of Charity opened an AIDS hospice in a big Victorian house, sight
    in the neighborhood. There was an Islamic center to the east, a Jesuit university
    to the west, Catholic and Episcopal churches on the northern edge, and, to the
    southeast, just beyond Divadero Street, the St. John Coltrane African Orthodox
    with its jazz masses, food programs, and big Russian-style paintings of black
    archangels.

