  - '[PAGE 92]


    adobe walls, the concrete scraped into rough ridges the mud would adhere.


    We began a correspondence by mail and then email and launched a series of adventures,
    driving back and forth together between Santa Fe and San Francisco, doing projects
    together and encouraging each other as she came into her own as an artist and
    a landscape architect and I kept writing. And so out of the lecture of Linda''s
    that wandered into casually came some ideas about place and landscape, friendships,
    eventual collaborations with all four of these artists, a cherished friendship
    with Catherine in particular, and an anecdote about hair as a repository of memory.
    And a return to the region in which I spent the first two years of my life, a
    place I fell in love with as an adult for its sense of deep time on the ground
    and constant change in the sky.


    Your life should be mapped not in lines but branches, forking and forking again.
    Merid introduced me to people who became significant friends in New Mexico, and
    I''ve returned there nearly every summer, and that landscape became one of my
    great joys. Jerry deepened my understanding of the place he''s now spent more
    than eighty years in and paints with such love. Catherine moved to New York for
    a few years, and I first visited the city as an adult to stay with her (as a young
    art critic, I''d thought I was probably supposed to move there to plunge more
    deeply into the art world or climb its career ladders, and when my writing began
    to be about western places, I was hugely relieved that I''d written my way out
    of that fate).


    Perhaps you could tell a story the way children play hopscotch, returning to the
    beginning and going a little further each time, tossing your token into another
    square, covering the same ground in a slightly different pursuit each time. You
    can''t tell all at once, but you can cover the same ground a few different ways,
    or trace one route through it. In 1988 I went to the Nevada Test Site for the
    first time, to join the immense antinuclear activist gatherings that my younger
    brother was already helping to orchestrate. There was a path I traveled on, meeting
    extraordinary people, and finding another route into the landscapes I craved,
    into a world far beyond San Francisco. A path, or a gate.


    Out there in the Nevada desert one day the photographer Richard Misrach met me,
    walking up with his huge view camera flung casually over his shoulder. His big
    color photographs of places of violence and'
  - '[PAGE 93]


    destruction in the American West had a major impact then and were the subject
    of some controversy, from people who thought he was glorifying the wrong things,
    perhaps because they believed that only the good should be beautiful, while he
    was interested in the tensions of a hideous beauty and the demands it made on
    us the ethical and the sublime are at odds. He became another artist whose work
    quite literally made me think—about conflict between beauty and morality, the
    invisibility and pervasiveness of certain kinds of violence, the legacies of the
    West, and what he often called “not the representation of politics but the politics
    of representation.” Later in the 1990s, I wrote the text for a couple of his books.


    The support of these artists who were so much further along in their work and
    sense of purpose gave me the confidence to move on from regarding myself as a
    critic and a journalist trying on to be a writer. Or rather they told me that''s
    what I was when they told me they wanted to work with me, and reminded me that
    had been my original goal I had backed down from. Criticism and journalism felt
    like subordinate forms of writing in which you were always serving a subject and
    operating by constraining rules. To be regarded as a writer free to feel that
    anything was possible and everything was available.


    One day an artist told me that Ann Hamilton was making an installation in an industrial
    space in the city, and she was looking for volunteers to help, so I wandered down
    to Capp Street Project, a former auto-detailing gallery in the Mission District.
    Ann had become and suddenly famous for her immense, ambitious installations, often
    involving vast collections of small objects and materials, enlened by performers
    present throughout the duration of the exhibition. She was only five years older
    than me, full of midwestern steadiness and modesty, but also an extraordinary
    confidence manifested in the sheer scale and effort of her works, at a time when
    many young women were making what felt like miniatures.


    Ann had converted the budget for her show into pennies, because she was ambivalent
    about the lavish budgets for such projects. The 750,000 pennies that $7,500 dollars
    translated into would be put on display, then scrapped up and taken to the bank
    to be washed, counted, and converted to currency that could be donated to an education
    project. In the meantime, she was filling the floor of the space with a vast rectangle—forty-'
  - '[PAGE 94]


    five feet by thirty-two feet—of pennies laid down, one by one, on the cement floor
    “on a skin of honey.” Honey is the adhesive, but also a way of referencing another
    system of circulation than money, putting together how bees store their labor
    and how we do. Ann had been much impressed by a bricklayer in her childhood, and
    then gone into fine art through textiles. She was interested in how a small gesture
    repeated enough made something large, and so three quarters of a million gestures
    laid down that many bits of currency in a shining skin of money.


    Somewhere during that process, I got down on my knees and started laying pennies,
    and a later Ann ended up doing the same next to me and we began to talk. We laid
    the coins without an attempt to make a pattern, but the natural variation in the
    long lines made them take on a texture like waves or snakes scales, and they shimmered
    in the light, the smell of honey rose up from the floor. I don’t know what had
    changed, but at the beginning of the 1980s I had barely been able to connect to
    anyone, and I hadn’t found my people or the conversations I dreamed of. At the
    end of the decade, I could and I did.


    The piece Ann made with many hands’ help was called privation and excesses, and
    at the far corner of the great cache of cash was a performer, a person in a white
    shirt sitting with a wide-brimmed felt full of honey in her lap. The performance
    consisted of wringing one’s hands in the honey and staring off into the distance—of
    maintaining calm disengagement from the viewers. To include a performer meant
    that the grammatical tense of the piece was in the present of making and doing,
    rather than the past tense of made and done. Later on other pieces of hers, the
    performers would be undoing something, unraveling, or erasing, so that the work
    was being un as well as made for the duration of the exhibition.


    Later on, Ann took some of the pennies converted back into practical currency
    and gave it to me to write an essay about the piece. But before she asked me to
    be one of the performers. Thinking back it seems enchanted that she invited me
    into both an ongoing conversation and silence. To the latter job, you sat in a
    straight chair for three hours, looking ahead, blessedly ignore all the visitors’
    questions about what the art meant. There was a pen with three sheep in it behind
    the sitter, and the sounds and smell of the sheep, as well as the smell of the
    honey and the pennies, were part of what you absorbed when you took on the task.'
  - '[PAGE 95]


    As a child you''re told not to get sticky, not to play with your food, not to
    make a mess, sinking your hands up to your wrists in honey was a wonderful transgression
    against all that, as well as a sensual pleasure. If you were the first sitter
    of the day, the honey was cold and a little still at the outset, but it warmed
    up from the heat of your hands and began to flow. You can hold a double handful
    of honey, though it will drip, your job in that artwork was not to hang on it
    but to let it move, to lift it out of the hat and let it trickle back, to keep
    it moving while the rest of you stayed still and looked ahead with a thousand-mile
    stare.


    Restless, nervous, impatient by nature, I had thought I would have a hard time
    sitting still for three hours, but I found that the instructions protected me
    from my own sense that I should be available to supply information (and people
    did come up and demand explanations of the show) and that I should at every waking
    moment be busy and productive. I found instead that I resented the person who
    replaced replaced me when I was the first performer of the day or the gallery
    staff person who told me to wrap it up when I was the last.


    One day years later those hours sitting still with my hands in warm honey came
    back to me as a recollection of the calmest moment of my youth, a few hours of
    pure existence as sweet as the honey stuck under my nails, a moment of rare among
    all the busyness of doing and becoming.'
