    北极星离地球如此遥远，它的光需要三多多年才能到达我们，即使是最近的恒星，其光也需要四年的时间。书籍就像星星，因为你读到的内容是作者很久以前就热衷投入其中的，有时仅仅是因为一本书的编写、编辑、打印和发行需要时间。而且，制作一本书的时间意味着它代表了写作之前的兴趣遗存。到
    20 世纪 80 年代后期，新的兴趣正在掩盖之前的兴趣；我正以一种新的方式关注关于自然、景观、性别和美国西部的思想。


    第一本书是关于重新回顾我多年前发现的一件重要的事。我关注了六位艺术家——三位来自南加州，三位来自湾区——他们的生活和作品在 20 世纪 50 年代成为朋友有时是合作者时发生了重叠：Jess（他在离开科学投身艺术并作为一名公开男性恋者的生活时放弃了自己的姓氏，这在当时是一件超乎常人的勇敢事）、杰伊·德菲奥（Jay
    DeFeo）、布鲁斯·康纳（Bruce Conner）、乔治·赫姆斯（George Herms）、沃利·赫德里克（Wally Hedrick）和布鲁斯·伯尔曼（Bruce
    Berman）。他们每个人都以各种方式选择了低调的生活，去发现艺术的意义，以及充满艺术的生活可以是什么样，然后去创造并体验它。康纳、赫德里克和德菲奥有机会去纽约并成名，但他们拒绝了那个机会。


    他们的理想主义被时代的繁荣所衬托，他们的直率则体现在逃离——逃离充满了廉价住房的城市，那里工资高到让夫妻和家庭通常靠一份兼职工作的收入就能生活。即使在 20
    世纪 80 年代，这种随来随去、停止给房东交几个月房租然后找另一个舒适地方居住、进出经济生活的自由，似乎也像是一个古代自由民族的奇特习俗。我所写的这些艺术家随着“一代”（Beat）圈的节拍移动或穿过这些圈子，而关于“一代”的故事通常是关于一群来自东部的男性作家，后来演变成了某种更大、更有趣的事物，其中包括这些视觉艺术家、实验电影制作以及以及参与其他运动的诗人，特别是被称为“旧金山文艺复兴”的运动，包括
    Jess 的伴侣罗伯特·邓肯（Robert Duncan）、杰克·斯派塞（Jack Spicer）和迈克尔·麦克卢卢（Michael McClure），他们穿梭许多世界。


    我从这些人物身上了解到，在创作艺术之前，你必须有一个创作它的文化，一个赋予它意义的背景，以及可以从中学习并向他们展示作品的人。通过短暂的画廊、微型杂志、放映、诗歌朗会、友谊，他们在彼此创造了文化——不是因为他们排外，而是因为他们被排斥。我开始理解关于文化如何演变、转变，以及如何从边缘迁移到中心的通用原则。他们与爵士音乐家、摇滚乐队、毒贩、机车帮、同恋亚文化、社会实验、反文化英雄交织。他们拥有那种我至今偶尔在小镇和保守社区中认出的情谊，在那里，局外人团结在一起，面对敌对主流的差异时，他们彼此之间的差异显得微不足道。


    研究通常被描绘为枯燥和勤奋，但对于那些对这种侦探工作的追逐快感感兴趣的人来说——搜寻数据、将隐匿的事物冲出藏身、找到汇成一幅画的碎片——它是迷人的。你的碎片是故事、事实、手稿和信件、照片、旧报剪辑、多年无人翻过的杂志装本，某人在采访中对你说过但从未以这种方式对其他人说过的话。对于我的早期书籍，我很惊讶自己竟然忽略了某些对我来说意义重大的话题去写作，这让我觉得身处这样一个如此被忽视和贬弃的地方是种优势。


    我早期的一些研究探险是滑稽的。当我写论文时，我不断拨打住在新墨西哥的演员兼导演丹尼斯·霍珀（Dennis Hopper）的电话，希望能和他聊聊，他一直和蔼地听，说他乐意聊天，让我以后再回，直到打了几十次电话后，电话响了报警我放弃了。当我把项目变成一本书时，我没有再次尝试，尽管他住在洛杉矶，因为他在电影《蓝丝绒绒》中的表演让我感到非常恐惧，但他的助手对我很有帮助，并从他的原始胶片中拿了六张打印照片（霍珀年轻时是一位才华横溢的摄影师）供书使用。


    我赢回来了，从一个戴着假牙的波西米亚人那里（在他的房间里度过了一个愉快的小时），得到了一段含糊的描述和一封朋友寄给他的未出版信件复印件，那是关于 1955
    年 10 月六画廊朗读会的，那场活动因为艾伦·金斯伯格（Allen Ginsberg）首次朗读了《呼啸》而闻名。一位诗人的这种突破戏剧性掩盖了当晚迈克尔·麦克卢卢和加里·斯奈德（Gary
    Snyder）朗读的原环保诗。记录中对地点的描述很少，对亨德里克斯（Hendrix）担任成员的艺术家合作画廊，以及朗读会的发起者也描述较少。这是一份令人愉快的文献，让我看到在这场活动被官方的“一代”作家神话化之前，参与者的感受是怎样的。


    非虚构作品最好的境界是将世界重新组合——或者拆解它的某些部分以寻找隐藏在假设或传统之下的东西——从这个意义上说，创造与破坏是可以相似的。过程可以因兴奋而炽热，无论是因为发现某些意料之外的信息碎片，还是因为意识到从碎片开始汇聚的模式。某些你之前不知道的东西进入了焦点，世界以一种新的方式变得合理，或者一个旧的假设被掏空，而你试图将其写下来。


    在某种程度上，这就是我一生的工作：对模式的追求，以及重新连接那些破碎事物的工作，这些事物往往是由类别造成的，这些将一个主题、历史、意义分解成子空间，使得人们无法看到整体。虽然存在一种来自微观关注的专业知识，但我经常追求那些跨越广阔空间、时间或类别而显现出来的模式。这种在夜空中挑选星座的艺术，作为这项工作的隐喻反复出现。


    这在某种程度上对于我第一本书的主题是真实的，该书的故事在很大程度上被艺术史、电影史和文学史的线性叙述所遗漏了。电影、诗歌与视觉艺术之间的关系，药物、奥秘与非西方哲学、政治异见与酷儿文化之间的关系，一个可以被描述为前卫的（如果不是在反文化中起催化作用的话）的有趣圈子成员之间的关系，才是重要的。我的艺术家们口述史访谈记录并不充分，他们也不显眼，尽管他们大多数人——特别是德菲奥和康纳——在后来得到了很多关注。


