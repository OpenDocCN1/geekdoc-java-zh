    the real one. And then once I had something the craving died down—it was the craving
    that was alive—and craving appeared again, reaching after the next.


    Of course with lovers and boyfriends, uncertainty could keep craving alive (and
    with the more reliable men, that metamorphosed into other kind of love). More
    than anything I wanted transformation of my nature but of my condition. I didn''t
    have much of a vision of where I wanted to go, but I knew it was distance myself
    from, perhaps it was why walking was important: it felt like I was getting somewhere.


