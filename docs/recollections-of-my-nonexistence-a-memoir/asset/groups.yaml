    something to say that might be heeded. When no one else seems to trust you, it’s
    hard to trust yourself, and if you do, you pit yourself against them all; either
    of those options can make you feel crazy and get called crazy. Not everyone has
    the backbone for it. When your body is not your own and the truth is not your
    own, what is?


    I was twenty-one or twenty-two when I went to a New Year''s Eve party at the home
    of gay friends in suburban Marin County, the county of the Trailside Killer and
    homicidal banker. My boyfriend at the time was running the lights for a concert,
    but was supposed to come and join me at midnight. He was delayed by his diligence,
    and I said that we were not celebrating the New Year together. I didn''t have
    a car in those days, I didn’t want to ask for a ride, so I set out well after
    midnight to walk to my mother’s house about a mile away, where I could slip in
    sleep on the couch without disturbing anyone. Perhaps she was away; that I don’t
    remember, but what came before was indelible.


    While I was on the main thoroughfare between the two houses, I realized that someone
    was behind me. I turned around; it was a big man with a shaggy beard and long
    hair. I walked faster. He was only a couple of feet behind me, not at a normal
    distance, and we were the only people out on foot at that hour. It was dark, and
    the shrubs dividing the dark homes from each loomed and streamed shadows, his
    shadow and mine swelled and shrunk from streetlight to streetlight, and cars passed
    by and their headlights made all the shadows swirl and lurch.


    Once I had spotted him he began to speak, low, steady stream telling me he wasn’t
    following my judgment, an accelerated course of gaslighting designed to undermine
    my ability to assess the situation and make decisions. He was very good at what
    he did, and his insinuating sentences were disorienting to the very young woman
    I was. Clearly, he had a lot of practice. I wondered later what he had done to
    other women before and after.


    So much of what makes young women good targets is self-doubt and self-effacement.
    Now I would flag down cars, stand in the middle of the road, noise, bang on doors,
    respect my own assessment of the threat, and take any action that seemed likely
    to get me out of it. I would bother someone, anyone. But I was young and trained
    not to make a fuss and to let others determine what was acceptable and even to
    determine what was real.'
