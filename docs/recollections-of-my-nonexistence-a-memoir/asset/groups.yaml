    I often dreamed of the street that ran past my childhood home, turned into a country
    road, and then ended in a horse pasture, the road from which I slipped through
    barbed-wire fences to so many of my adventures, but now I dream of that little
    apartment on Lyon Street as a foundational place I dreamed the road then.


