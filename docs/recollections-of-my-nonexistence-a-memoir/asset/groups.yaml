    玛丽和凯莉·丹恩（Mary and Carrie Dann）正准备面对政府的进攻。她们是宏伟而无畏的女族女性，是我见过的最不屈服的女性。她们是家庭的女人，牧场的首领，能够修理发电机，也能驯服它们庞大畜群中的野马；她们用英语与我们交流，用母语互相交谈，显得既开朗又精辟。《野性之梦》（Savage
    Dreams，是我的一本书，她们是其中的主要人物，展现了许多魅力的女性和女性团体，但我不知道是否有人将其识别为一本女性主义著作。）与与她们在一起是一种启示；那意味着家族记忆追溯到了人类到来之前的时代：土地是神圣的，女性主宰，行动捍卫着长远的未来。我正在学习关于地形地势和西部历史等具体的知识，也学习关于精神事务以及如何生活的思考。


    ### 加入该项目意味着在内华达州东北部的丹恩偏远牧场连续几周，住在我的卡车或他们房子附近的旧拖车里，在那里我可以接入我运出的台式电脑和打印机。这意味着与反核武器运动的朋友以及一些我从未见过的人（无论是原住民还是其他）组成联盟，并参加部落会议和集会。对我而言，这意味着要为凯莉代写信件和声明，并为项目撰写大量的文献、新闻稿和背景资料（在沉浸于胶片记录后，我学到了很多，并撰写了那篇深度综述文章）。这也意味着等待，因为现在法庭冲突已经结束，政府威胁要没收他们的牲畜。


    暴力袭击发生在1992年4月11日。牧场的一位组织者撞进一位女性，她询问他在最近村庄社区中心外所有的警察车。政府雇佣了一支围捕队来没收牛群，执法部门在现场提供支持。我通过电话得知这个消息，在一个小时内取消了所有行程，抓上东西开车穿过跨湾桥，穿过东湾，跨过萨克拉门托河和宽阔的萨克拉门托谷，穿过橡树林，然后穿过内华达山脉的松树林进入沙漠。停顿了几个小时后，在黎明时继续开完我和他们家之间五百公里的路程。这是我第一次面对暴力。


    上午十点，我发现牧场的核心——房子、圈圈、外室、拖车——那里几乎空无一人。冲突发生在另一个地方，在马背上，联邦围捕队追捕牲畜，而肖肖族的奔跑者干扰了丹恩家几匹强壮且经过鞍驯服的野马。凯莉在部分牛被赶入移动围圈时，与联邦特探和当地保安就土地权利和条约进行争论，特探抓住了她的手臂试图阻止她干预。她挣脱了束缚，跳进围圈阻挡了牛群的装载。对方不愿升级冲突，便离开了。她赢得了这场战斗，尽管这场追溯到1850年的战争并未结束。


    这场斗争从未真正解决，经历了重重、部落内部的冲突、时代的变迁，以及金矿的到来——金矿剥削、开发并污染了他们的山谷，抽干了水源并淹没了丹恩家族的墓地。我提到他们的僵局以及政府的消耗战，并对与他们共处的时光表示感激。但正在发生的更大变革让我怀有了前所未有的希望。我看到了边缘群体改变基础性叙事的力量，看到完全出意料的事物的出现，看到随着这些变革的扩散，标志、学校教科书、纪念碑、地名、土地管理实践以及有时时代发生了改变；看到博物馆如何将骨骼和遗物还给那些祖先和宝藏属于他们的人们；看到这一切逐渐变得更加重要，而不再那么具体。


    这并不意味着一切都完好了，但这是一次具有实际影响的深刻转变，包括对自然系统和地区的理解与管理。这种转变使我相信，文化可以改变政治，表现可以塑造现实，我们作为作家和历史学者的作为至关重要，改变过去的故事就能改变未来。这对我而言是一个深远希望的起源，关于深层的、不可预料的变化的可能性，以及那些被视为边缘或无道的人带来这种改变的能力。美洲原住民国家日益增长的可见性和权力，感觉就像1989年推翻东欧极权政权的非暴力革命以及几年后苏联的解体中的碎片，我曾满怀激情地密切关注着这些事件。

