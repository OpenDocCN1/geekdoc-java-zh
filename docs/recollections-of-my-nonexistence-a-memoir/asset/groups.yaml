    that a woman artist cut her hair off and made herself androgynous so that she
    could work with him and everyone at the party would—as pretty much all punk parties
    in that era don the tough-guy drag of dark jeans and leather jackets and women
    would play their gender and everyone would stand around looking angst and rugged.'
