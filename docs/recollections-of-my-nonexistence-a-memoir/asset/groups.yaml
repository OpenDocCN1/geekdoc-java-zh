    in the middle of the night, in the center of a city and a place thought of the
    inner city, I often heard the foghorns, and they carried me to the edges and beyond,
    to the sea, the sky, and the fog. I heard them often, and in recollection the
    sound seems almost like a correlative of that middle-of-the-night state of being
    not awake, not quite asleep, with a wandering mind but a body pinned down by sleep''s
    Jupiterian gravity. They called to me as though I was a lost ship, not to bring
    me home but to remind me of the ocean and the air and in the closet I was still
    connected to them.


