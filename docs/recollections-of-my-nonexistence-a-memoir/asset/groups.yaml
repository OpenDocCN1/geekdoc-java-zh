    trees, and then at thirteen suddenly grew several inches, and it took many years
    for my flesh to catch up with my bones. I was five feet seven and less than a
    hundred pounds when I left home, and then weight came gradually, slowly, enough
    to push me over to a hundred that first year I was away from home and my thirties
    I was more or less average. But for a long time I was unusually thin, not like
    young women who have little fat over their muscle, because I had so little muscle
    either.


