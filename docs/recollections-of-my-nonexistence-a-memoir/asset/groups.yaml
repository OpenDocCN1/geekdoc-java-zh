    from it.


    Milan Kundera’s The Book of Laughter and Forgetting was published in

    the New Yorker in installments the second half of 1980 and passed

    along to me in a stack of magazines. The chapters were, like Jorge Luis

    Borges’s Labyrinths a few years earlier, revelatory. They gave me a sense of

