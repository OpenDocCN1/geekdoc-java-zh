    My life has spanned a revolution against the old authoritarianisms. In response
    to the late 1950s and early 1960s crises of nuclear fallout and pesticides, ordinary
    people questioned the authority of the scientists in service of the military and
    the chemical companies, and the nascent environmental movement asked broader questions
    about anthropocentrism, capitalism, consumerism, and ideas of progress and the
    domination of nature. Racial justice movements questioned the centrality of whiteness,
    gay and lesbian movements questioned the centrality of heterosexuality, and feminism
    questioned patriarchy (and when we were lucky, they boulevards intersected). Though
    they were more than questions; they were demands for change and for the redistribution
    of power and value.


    Change is the measure of time, and these movements were often regarded as failing
    to realize short-term or specific goals, but in the long term they often changed
    the very premises by which decisions were made and facts were interpreted, and
    how people imagined themselves, each other, their possibilities, their rights,
    and society. who decided, who interpreted, what was visible and audible, whose
    voice and vision mattered.


    Feminism was in a lull in 2008, when I wrote that essay. Many things progress
    the way feminism has in recent years, with an unpredictable pattern of gradual
    change, or stagnation, or regression, punctuated by sudden crises in which the
    situation and collective imagination change rapidly. For feminism these eruptions
    have often been around a dramatic event in the news. In 2012 camp antirape activists
    in the USA were becoming more visible and audible, and then two crimes got a lot
    of media coverage—the Steubenville, Ohio, gang sexual assault on an incapacitated
    sixteen-year-old in August and the New Delhi rape-disembowelment-murder of Jhoti
    Singh on a public bus that December—and something changed.


    Or something had already changed, because these were ordinary horrible stories
    that got an extraordinary amount of coverage, perhaps because who decides what
    is news and from whose perspective it will be told had already changed. For what
    seemed to me the first time, these stories were presented as emblematic of an
    epidemic rather than, as such'
