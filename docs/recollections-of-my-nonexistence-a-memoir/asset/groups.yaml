  - '[PAGE 134]


    Mary and Carrie Dann as they prepared to face attack from the government. They
    were grand, fearless matriarchs, the most unsubjugated women I ever knew, queens
    of their household, heads of their ranch, capable of fixing a generator or taming
    a mustang from their vast herds, cheerful and pithy as they spoke to us in English
    and to each other in their own language. (Savage Dreams, my book in which they
    were principal figures, foregrounded a lot of charismatic women and women''s groups,
    but I don''t know if anyone recognized it as a feminist book.) To be around them
    was a revelation; it was to where family memory reached back to before people
    arrived, land was sacred, women in charge, and actions defend what mattered for
    the long future. I was getting an education about tangible things like the lay
    of the land and the history of the West, but also about matters of the spirit
    and questions of how to live your life.


    Joining the project meant spending weeks at a time on the Dann'' remote ranch
    in northeastern Nevada, living out of my truck or an old trailer near their house,
    where I could plug in the desktop computer and printer I''d hauled out. It meant
    joining some friends from the antinuclear movement and some people I''d never
    met, indigenous and otherwise, as a coalition and attending tribal meetings and
    gatherings. It meant, in my case, ghostwriting letters and statements for Carrie
    and writing a lot of the literature for the project, press releases, and backgrounders
    (researching the long overview article I''d written after that immersion in the
    microfilm record had taught me a lot). And it meant waiting, because now that
    the courtroom conflict was over, the government was threatening to seize their
    livestock.


    The violent assault came on April 11, 1992. An organizer at the ranch ran into
    a woman who asked him all the sheriff''s cars outside the community center in
    the nearest hamlet. The government had hired a roundup team to confiscate cattle,
    and law enforcement was there to back them up. I got the news by phone and within
    an hour had canceled my calls and grabbed my stuff and headed in my car, across
    the Bay Bridge, the East Bay, across the Sacramento River and the wide Sacramento
    Valley, up through the oak groves and then the pine groves over the Sierra Nevada,
    and into the desert, a couple of hours at a stop, and at dawn resumed driving
    the five hundred miles between my home and theirs. It was the first time I moved
    toward violence.'
  - '[PAGE 135]


    At ten in the morning, I found the heart of the ranch—the house, corrals, outbuildings,
    trailer—almost deserted. The conflict had happened elsewhere, on horseback, with
    the federal roundup team going after the livestock and the Shoshone runners interference
    on some of the Danns'' tough saddle-broke mustangs. Carrie had argued about land
    rights and treaties with the federal agent and the local sheriff at the portable
    corral some of her cattle had been herd into, and the agent grabbed her arm to
    try hide her from intervening. She broke her grip and jumped into the corral and
    blocked the loading of the cattle. Unwilling to escalate, they went away. She
    won the battle, though the war dating back to the 1850s didn''t end.


    The struggle was never resolved, through difficulties, through conflicts within
    the tribe, through changing times, the arrival of gold mines that scraped and
    developed and polluted their valley and pumped out its water and flooded the Dann
    family cemetery. I said about their stalemate and the government''s war of attrition
    and grateful for my time with them. But the larger shift taking place made me
    hopeful as never before. I saw the power of people on the margins to change foundational
    stories, saw something absolutely unforeseen emerge, saw how, as those changes
    spread, signs and school textbooks, monuments, place names, land management practices,
    and sometimes times changed, how museums gave back the bones and the relics to
    the people whose ancestors and treasures they were, how gradually all these things
    meant something more important and less tangible.


    It did not mean that everything was fine, but it was a profound shift with practical
    consequences, including in the understanding and management of natural systems
    and places. That transformation convinced me that culture could change politics,
    that representations could shape reality, what we did as writers and historians
    mattered, that changing the story of the past could change the future. It was
    the genesis of a profound hope for me about the possibility of deep, unanticipated
    change and the capacity of those deemed marginal or insignificant to bring it.
    The rising visibility and power of Native nations in the Americas felt like a
    piece with the nonviolent revolutions that had toppled the totalitarian regimes
    in Eastern Europe in 1989 and the dissolution of the Soviet Union a few years
    later, which I followed closely, with exhilaration.'
  - '[PAGE 136]


    That was my golden age, not because I had escaped the evils of this world but
    because I had found ways to think about them and sometimes do something about
    them, valiant companions in the efforts, places to fall in love with, and ideas
    that transformed me. I had begun returning to the place in which I spent the first
    two years of my life, Northern New Mexico, where I had the great fortune to be
    befriended by the famous writer Lucy Lippard, whose response to the manuscript
    of Savage Dreams was, essentially, to give me the key to her little house (and
    a nice blurb). I began spending part of every summer-sitting for her out on the
    prairie, enraptured by the sky, the space, the light, and the thunderstorms. Later
    in the 1990s, I got involved with a man who in southeastern California''s Mojave
    Desert and spent part of my time there for four years.


    Our best as our worst emotions are contagious, and I benefited from the gallant,
    boldness, dedication, and humor of all these Westerners close to the land (and
    Lucy''s) transplanted New England brisk fearlessness. And I grew close to the
    places themselves, and drew from joys and strengths. I had developed the confidence
    to start moving freely around the West, gotten the pickup truck that let me go
    farther dirt roads and into remote places and in whose camper I spent many nights,
    gotten friends in Utah, Colorado and Nevada to visit. I was now rowing across
    the western United States a lot, not to escape but to arrive in a deeper sense
    of home and to build and maintain ties across the region. I was cultivating a
    persona rooted in this place, in nonchalance about physical challenges ranging
    from driving and walking distances to outdoors and facing down the authorities
    in environmental protests. Who was I wanted to be, and some of it was a performance
    complete with trappings—pearl-snap shirts, dusty country-music cassette tapes
    for the pickup truck, a nice camp kit—but of it went deeper.


    The writing was going well enough that I felt hopeful about it and not so well
    that there were, as there would be later, a lot of demands on me. So I roamed
    and explored and made of the invitations that came my way. I was rich in time,
    and alive with excitement about the worlds and connections and ideas opening up
    to me. I miss the ability I had then to jump into my truck and go someplace for
    a week or two, to take the long way around, to linger and explore and not worry
    too much about obligations. I was free.'
  - '[PAGE 137]


    In the evenings when the sky near the horizon is apricot and the sky above is
    still blue I sometimes try to find the seam between the two colors, but in the
    heavens there is only a pallor between these opposites is easy not to notice.
    Sometimes too in the evening I try to watch the colors change or a shadow grow
    longer across the landscape, and almost always my attention flickers for a moment
    and then I realize that the tree that was half in light has been swallowed by
    darkness or the brightness and sharp shadows have suddenly diffused because the
    sun has dipped or the sky that was cobalt is now midnight blue. Things are one
    way and then another and the transitions are hard to mark.


    The present becomes the past through increments too small to measure; something
    that changed becomes something that was, and the way we live is not the way we
    lived. So much of what changed is hard for those who lived to remember it and
    those who came after to imagine. In many parts of American society, kindness has
    increasingly become a criterion applied to all forms of interaction, but its absence
    before was elusive, because it''s too easy to notice who and what is not in the
    room. Myriad forms of injustice became visible in ways that made it normal to
    recognize them and easy to forget by what they became visible (which always raises
    the question of what we do not yet see, and what failings future eras will rebuke
    us). The evolution of feminism makes some of the formerly nameless unrecognizability
    of many kinds of discrimination hard to recall, that is one measure of the difference
    between then and now.


    There were epic public changes that made the era of my youth a foreign country,
    one in which I no longer live and which the young will never visit, and most will
    never know how different it was and why it changed and who to thank. My own life
    metamorphosed by degrees I would only perceive in retrospect. I was almost fearless,
    and the friends I had like a teenager and in my early twenties were mostly bad
    fits; perhaps it was because I didn''t know who I was or wanted to be someone
    else and I didn''t know who was like me or who liked me. Because kindness was
    not a criterion. Then later in my twenties I made friends who have lasted, and
    some more, and then that sense of being on the far edge became a sense of being
    on the borderlands between various realms, so that I began to have'
