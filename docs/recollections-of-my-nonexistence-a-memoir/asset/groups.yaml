    sometimes thought I was carrying something in the front pockets of my jeans. I
    thought of them as pearl-handled revolvers. When I let the bathwater drain out
    while I lay in the tub pool formed on my hollow belly. My ribs showed. I had a
    waist so small a guy once quipped that I did not have a torso, but a wasp or a
    bee, an abdomen and a thorax. It was my friend Dashiell, and he used the word
    thorax, and we were friends partly because we could banter like.


