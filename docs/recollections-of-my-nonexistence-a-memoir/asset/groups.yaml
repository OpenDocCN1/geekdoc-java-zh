    Being thin is seen as a virtue, as a consequence of discipline, and self-restraint,
    and so it''s often admired as though it is a sign of character. But it''s often
    just a sign of the genetic lottery or that phase of youth before the flesh catches
    up with the bones. Some people insisted that I was so because of anorexia or bulimia,
    eager to make what they envied pathological, undesirable (and there were years
    of jokes about camp victims and comparisons of mine to famine victims, as though
    my body was itself a disaster zone).


    There''s an austerity to thinness, to having a hard body, to being closer to the
    solidity of bone than the softness of flesh. It''s as though you''re removed from
    the messy, squishy, leaky body of life, as though you''re looking on from outside,
    from someplace less mortal, less malleable. As though you disdain mortality and
