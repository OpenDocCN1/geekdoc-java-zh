    # 致谢


    回首过去，这是一本关于障碍与敌意的书，但也是关于筑桥梁者与善良的书；对于后者，我感激万分；对于后者，我得以幸存。我之所以在这里，是因为那些保护弱势者、鼓励奇行者以及教育无知者的力量。


    感谢詹姆斯·J·杨（1920–1989）先生给予我一个家和一份友谊。感谢西部加区（Western Addition），教会了我城市主义。感谢你——给了我一张可以写字的书桌。


    感谢我二十岁那时的三位主要大卫。感谢男同恋，感谢酷儿文化，感谢在你们的原则比我的还要高的日子里，这座避难之城。感谢旧金山的租金控制政策，如果没有它，我的轨迹就不可能。


    感谢里昂-马丁诊所（Lyon-Martin Clinic）在你们这些对酷儿友好的地方为这个直男孩子提供免费医疗服务。感谢大洋滩（Ocean Beach），感谢太平洋（Pacific），感谢雾笛声和海鸥。感谢那些保护旧金山周围广阔绿带的人们，过去的半个世纪里我一直穿梭其中。


    感谢旧金山公共图书馆以及后的加州大学伯克利分校图书馆，感谢在那里度过的所有时光以及查阅的所有书籍和档案，以及你们守护的理想。感谢独立书店，尤其是 Moe''s、City
    Lights、Green Apple、Green Arcade 以及所有已消逝的旧书店。


    感谢旧金山州立大学为转学学生留出空间，并提供适合兼职学生的学生的课表；感谢莎士比亚教授诺尔·威尔逊（Noel Wilson）的鼓励，并感谢他帮我拿到了第一份媒体工作——即在《旧金山杂志》担任事实核查员实习生。


    感谢旧金山现代美术馆以及那里的研究/收藏职员员工，还有管理员珍妮·康道（Genie Candau）。感谢内华达俱乐部（Sierra Club）三十五年来的交集与演变。


    感谢新闻学院，特别是伯尔纳德·塔珀（Bernard Taper）、大卫·利特约翰（David Littlejohn）和本·巴格迪基扬（Ben Bagdikian）。


    感谢那些教会我将自己视为作家的艺术家们：琳达·康纳（Linda Connor）、安·汉密尔顿（Ann Hamilton）、理查德·米斯拉赫（Richard
    Misrach）、路易斯·德索托（Lewis DeSoto）、梅里德尔·鲁本斯坦（Meridel Rubenstein）。


    感谢City Lights 书店的金特·斯特根（Gent Sturgeon）和雷克斯·雷（Rex Ray），以及后的保罗·山马基（Paul Yamazaki）。


    感谢丽贝卡·比格斯（Rebecca Biggs）、史蒂夫·罗森伯格（Steve Rosenberg）和罗布·拉登布鲁纳（Rob Ladenbrunner），我在《Frank》杂志上的早期出版；感谢提姆·约约翰森（Tim
    Yohansson）和《极限摇滚杂志》（Maximum Rock''n''Roll）；感谢《Music Calendar》的 Flora，感谢《Artweek》的西尔·麦肯（Cecil
    McCann），以及《Art issues》的盖里·科恩布劳格（Gary Kornblau）。


    感谢比尔·伯克斯森（Bill Berkson）、迈克尔·麦克卢卢（Michael McClure）和芭芭拉·斯陶哈赫·所罗蒙（Barbara Stauffacher
    Solomon），这些在我二十岁时出现的早期鼓励者；以及迈克·戴维斯（Mike Davis）和露西·利帕德（Lucy Lippard），在我三十岁时为我出现。


    感谢我 1991 年海湾战争和 2002–03 年伊拉克战争时直接行动秘密协会（BADASS）反战亲缘团体。


    感谢洛杉矶北部 I-5 高公路旁 Denny''s 餐厅里那些帅气的机车手，在 1991 年 10 月的一个早晨，在共用桌旁听我说并让我说服他们安妮塔·希尔（Anita
    Hill）说的是真话。


