    在美国各地及其他地方，有这样的人他们想象、渴望，有时将同质化视为一种权利，并声称共存对他们是一种妥协或威胁。我不禁在想这些人，成为那种注定永远统治一个国家和文化、并在同质化中寻找安全感、而在异质社会中感到危险——大多是想象中的或形而上学意义上的危险——会是怎样的体验。我是白人，但在一个保守且有时反犹太教的社区里，我是作为一个自由派爱尔兰天主教父亲和一个俄罗斯犹太母亲的女儿长大；在一个反知识分子的小镇上，我是一个书痴如命的孩子；在一个由男孩组成的家庭里。我不认为有很多和我一模一样的人，也不认为他们会在任何地方都能成为多数人口。在同质化的环境中，我觉得自己以某种可能被惩罚的方式显得格格不入；处在混合人群中既更安全也更有收获。在一个白人占少数的城市里生活，我开始认为“像我一样的人”是指热爱相同事物或持有相同理想的人。


    消失有许多方法。而有些人从根上就不被允许出现。旧金山市督员哈维·米尔的助手兼亲密朋友克莱夫·琼斯（Cleve Jones）后来拥有了自己的重大政治生涯，他在回忆录《当我们崛起》（*When
    We Rise*）中写道：“我出生在最后一代同性恋人中，成长时不知道地球上是否有人的感受和我们一样。这完全从未被谈起过……身为酷儿是病态的、违法的且令人作恶的，暴露意味着进监狱或精神病院。被捕的人失去了一切——事业、家庭，往往还有生命。特别部队在每个城市和州无情地猎捕我们……到十二岁时，我知道我需要一个计划。我唯一能想象的计划就是躲起来，永远不暴露秘密，如果被发现，就自杀。”


    我的那些成长年华是酷儿文化转型的时期，我认识的大多数男性都经历过某种版本的克莱夫式的旅程：穿越秘密与羞耻，寻找朋友、爱人和世界中的席之地，或者至少在这座城市里，或者至少是那里的几个社区。从20世纪70年代反对反同性恋法律的抗议，到米尔被一名保守的前的前警察暗杀后的白夜骚乱，再到90年代ACT
    UP和酷儿国家（Queer Nation）激进的行动主义，这是一个充满政治色彩的地方。它既是艾滋危机的中心，也是应对危机的组织中心——从永恒享乐姐妹会（Sisters
    of Perpetual Indulgence）普及安全性行为的工作，到ACT UP和酷儿国家，再到克莱夫的艾滋纪念拼布项目；这个项目规模之大，最后一次在1996年完整展出时，覆盖了国家首都的整个广场。


    我作为一个旁观者观察着艾滋危机，穿过一个卡斯特罗区（Castro），那里突然贴满了告示板和关于一种新疾病的同性恋报纸文章，骨嶙峋的人在行道上徘徊，还有纪念展示、抗议和游行。我与一位艺术家大卫·坎农·达谢尔（David
    Cannon Dashiell）关系很近，从长期伴侣巴里因实验性艾滋药物去世，直到四年后他自己去世。我的夹克被偷后，大卫给了我巴里的那件黑色皮摩托夹克，我穿了多年，在那个年代，皮夹克是我们这类人的某种制服。


    大卫对巴里的去世心碎欲绝，伴侣的寿险让他能做一直想做的事，首先是有了更多时间创作艺术。他开始疯狂购物，购买、装修并布置了一间公寓，并买下了许多他所钦佩的同性恋艺术家——杰罗姆、内兰·布莱克、拉里·皮特曼——他知道我所不知道的事，他剩余的时间很短暂。甚至连家具都带着刻薄的幽默；在他的餐桌旁有六把轮椅，包裹着深色邪恶的缎面，扶手上挂着流苏，这暗示着疾病可能如何让他残废。我们以前坐在那些椅子上在公寓里飞速穿梭，大笑。


    他的艺术是博学的，是一个将现有的表征系统“酷儿化”的项目——我仍然留有一张他在黑色圆纸上用粉笔重绘的塔罗牌牌；我的那一张展示了一个从俯视角的男人，健壮的身躯用几条简洁的线条勾勒，乳头在他结实的胸前倾斜着。大卫很高、纤细，皮肤苍白，带着一种傲慢的贵族气质，对颓废和越界充满极大乐趣。我是他口中那个HIV转变为艾滋病的夜晚出现的人。我冲向他布置的那间华丽公寓，带了果汁、汤和我能找到的最松软的电影。我们躺在他维多利亚风格公寓海景窗的床上，看那部由金·诺瓦克和威廉·霍登主演的电影《野餐》（*Picnic*），在那类电影中过度夸张的异性恋规则是发表刻薄言论的绝佳时机。我们吃着汤，看着电影熬到深夜，第二天早上我们去看了医生。我们都没有准备好直接谈论正在发生的事情，但事情还是发生了。


    大卫再次坠入爱，他们带着一箱衣服和一箱药游历了欧洲。他在去世前刚刚完成了他的杰作。那是对庞贝“神秘之屋”（Villa of the Mysteries）壁画的重新构想，一个巨大的装置，在八英尺高的压烯玻璃板上画着等身比例的人物——穿着白色和薰衣草色的爱德华华时代同性恋男性，在亲吻、吞噬、交换体液；绿皮肤的科幻同性恋女性也参与了越界的色情仪式。这是见证了他同时的出现与消失：前者是一个在雄心和可见度上崛起的艺术家，后者是那场在1993年夏天夺走他四十岁生命的疾病。


    旧金山是一个避难港，但远非完美的避难港，在这里恐同恋暴力也无处不在。一个名叫詹姆斯·芬恩（James Finn）的人在描写在其他地方遭受攻击后成为同性恋的过程中（……[注：此处OCR文本出现大量重复和乱码，已按叙事结构进行清理]。


