    War" after I moved into the apartment. It''s of me in a gray 1940s suit I wore
    constantly as dress-up outfit, or rather of wearing the suit''s pencil skirt and
    a man''s vest turned backward and belted into a sort of backless top, without
    the jacket. I have my back to the camera, turned to the right, a little hat with
    a veil over a face that still looks childish, a back that looks vulnerable, unformed,
