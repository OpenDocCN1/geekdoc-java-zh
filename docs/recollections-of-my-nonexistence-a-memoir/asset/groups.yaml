    Perhaps being free of the weight of depression and expectation. Of the weight
    of a body. Of the weight of animosity.


    The beauty of those places I soared over is with me still, and in my dreams in
    my waking life was a love of place, a sense that places were embodiments of emotions,
    were anchors, were companions of a sort, even protectors or parents. Once at the
    Pacific, I thought to myself "Everything is my mother by my mother my mother,"
    and I recognized the ocean had been a mother offering power, constancy, and solace.
    Many years later I began rowing a scull, I realized that in the water, I was out
    of reach of men and dogs, and that, as well as the beauties of water, made it
    serene, dreamy, the eighteen-foot span of my oars being as close to having wings
    as I could come.


    But long before that, I flew. Even in the dreams my logical mind wrestled with
    how this was possible, anxious that it be possible. In one dream I had to align
    myself with the earth''s magnetic fields, another I drew my strategy from a sentence
    I read describing how the great dancer Nijinsky seemed to hover in the air a split
    longer than gravity made possible, and I was airborne for that kind of interval
    in a theater. I was in a world where levitation was normal I tried to exceed the
    bounds and go higher. I tasted the cold of the upper stratosphere. Or I streamed
    across green landscapes.


    Sometimes I flew to prove that I could. I was the girlfriend of the poet John
    Keats and I demonstrated I could fly among blackberry bushes whose fruit size
    of street lamps suggested I was, we were, the size of songbirds. Other times I
    flew across the rooftops of the city and the view was dazzling, as the sense of
    having all that space under you, the sense of all that when you swam in clear
    lakes. It was the beautiful spacious side of loneliness.


    I wondered what this flying meant. Sometimes it seemed to be dreams'' impatience,
    a jump cut from here to there without filling in the space between. Sometimes
    it escape. Sometimes it was a talent, and like talents sometimes did, it set me
    apart, usually literally, since I tended to fly alone, to be the only one who
    could fly, sometimes I showed other people how to do it or carried them along.


    It was an experience of not belonging to the ordinary world and not being bound
    to it. I thought sometimes that it might be about writing, about being a writer,
    and now I wonder why I didn''t think of it as reading, and that constant, chronic
    activity that had taken up so much of my waking hours since I’d learned to read,
    as being in a book, in a story, in the lives of others and invented worlds and
    not my own, unbounded by my own body and my own life and my own time and place.


    I could fly, though now I wonder if the problem was how to come to earth.


    ## Freely at Night


    ![](img/db14ca6438d37a021682af27273dff1e_65_0.png)


    One day in 2011, I got a Facebook friend request from someone I''d in college
    with when I was seventeen and stayed in touch for a few years after, someone I
    cherished then as a person I could trust and talk to perhaps because of who he
    was or because of who I imagined he was, how I filled up what I didn''t know about
    him with what I needed. I accepted the request with enthusiasm and curiosity about
    the years we''d been out of touch and it brought me who he might be. He replied
    that my political views were abhorrent, that he would like to send me copies of
    the letters I''d written him. Once I found out he was conservative, things that
    had seemed mysterious or exotic about him when he was young suddenly made sense.
    I didn''t find out more about him, but I did find out from him about me.


    A manila envelope through the mail slot a few weeks later. I had a little uneasiness
    about meeting teenagers directly, and so I waited several years to open it. In
    the photocopies of letters on lined legal pads in a small neat handwriting that
    is no longer mine met a person who didn''t know how to speak. By that mean several
    things. The young writer I met there didn''t know how to speak from the heart,
    though I could be affectionate. But also, she was a jumble of quotations and allusions
    and foreign phrases and circumlocations, of archness and pretense and avoidance
    and confusion, an attempt to use language that kept her so busy that hardly anything
    got said, or major events were mentioned in passing in sentences busy other things
    that didn''t matter. She had collected a lot of words, phrases, syntaxes, tones
    and was trying them out, like someone at the very first stages of playing an instrument,
    with squawks and clangs. She was speaking in various voices because she didn''t
    know what voice was hers, or rather had not yet made one.


    There was one startling passage in all the verbiage. I''d written about the eighteenth-birthday
    party I threw my younger brother not quite a year after I''d moved into the apartment.
    Lot of chocolate frosting that had been smeared around a lot of people, and there
    was talcum powder on the stereo and towels soaked with champagne in the tub, I
    mentioned proudly. And then the letter went on to list essays I was trying to
    write, though it would be a couple of years before I published anything.


    I mentioned a “long essay to work it out for myself—about my penchant for long
    solitary walks at night, the danger involved (I''ve given it up. I was nearly
    assaulted a few weeks ago) and how it affects my attitude toward feminism—of what
    value are the advances”


    I wanted to understand. I wanted to understand the world. I wanted to understand
    myself. I wanted to understand the night. I wanted to understand the darkness.
    I wanted to understand the silence. I wanted to understand the light. I wanted
    to understand the shadow. I wanted to understand the fear. I wanted to understand
    the hope. I wanted to understand the death. I wanted to understand the life. I
    wanted to understand the beginning. I wanted to understand the end. I wanted to
    understand the everything. I wanted to understand the nothing. I wanted to understand
    the why. I wanted to understand the how. I wanted to understand the where. I wanted
    to understand the when. I wanted to understand the what.

