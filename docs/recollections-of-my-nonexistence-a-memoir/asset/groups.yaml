    It felt ubiquitous thenous. It still does. You could be harmed a little—by insults
    and threats that reminded you were not safe and free and endowed with certain
    inalienable rights—or more by a rape, or more by a rape-kidnapping-torture-imprisonment-mutilation,
    yet more by murder, and the possibility of death always hung over the other aggressions.
    You could be erased a little that there was less of you, less confidence, less
    freedom, or your rights could be eroded, your body invaded so that it was less
    and yours, you could be rubbed out altogether, and none of those possibilities
    seemed particularly remote. All the worst things that happened to other women
    because they were women could happen to you because you were a woman. Even if
    you weren''t killed, something in you was, your sense of freedom, equality, confidence.


    My friend Heather Smith remarked to recently that young women are urged to "never
    stop picturing their murder." From childhood onward, we were instructed to not
    do things—not go here, not there, not go out at this hour or talk to these people
    or wear this dress or drink this drink or partake of adventure, independence,
    solitude; refraining was the only form of safety offered from the slaughter. During
    those years at the end of my teens and the beginning of my twenties, I was constantly
    sexually harassed on the street and sometimes elsewhere, though harassed doesn''t
    convey the menace that was often present.


    In war the people who try to kill you are usually on the other side. In femicide,
    they''re husbands, boyfriends, friends, friends of friends, guys on the street,
    guys at work, guys at the party or in the dorm, and the week I'
  - '[PAGE 36]


    write this, the guy who called a Lyft and stabbed the pregnant driver to death
    and the guy who went into a bank and shot five women and the guy who shot the
    young woman who took him in when his parents kicked him out, to name a few examples
    of the carnage that made it into the news. Morris calls PTSD “living at the whim
    of your worst memories.” But he also suggests that war, as an atmosphere which
    you live in fear of attack, mangling, annihilation, and in which people around
    you suffer those afflictions, can traumatize you if you are physically untouched
    and the fears can follow you long after what gave rise to them. Mostly when people
    write about the trauma of gender violence, it''s described as one awful, exceptional
    event or relationship, as though you suddenly fell into the water, but what if
    you''re swimming through it your whole life, and there is no dry land in sight?


    Legions of women were being killed in movies, in songs, in novels, and in the
    world, and each was a little window, a little weight, a little message that it
    could have been me. I once encountered a Buddhist saint who had worn tokens devotees
    gave him; they loaded him up, tiny by tiny until he had hundreds of pounds of
    clinking griefs. We wore horror stories as a secret weight, a set of shackles,
    that dragged everywhere we went. Their clinging forever said, “It could have been
    you.” During this time, I gave away the only television I ever owned, my maternal
    grandmother’s little black-and-white model from her nursing home, not long after
    an evening when I turned the dial and found that a young woman was murdered on
    each channel. It could have been me.


    I felt hemmed in. Over and over, women and girls were attacked not for what they’d
    but because they were at hand when a man wished to—to punish is the word that
    comes to mind, though for what might linger as a question. Not for who but for
    what they were. We were. But really for who he was, a man who had the desire and
    believed he had the right to harm women. To demonstrate that his power was as
    boundless as her powerlessness. In the arts, the torture and death of a beautiful
    woman or a young woman or both portrayed as exciting, satisfying, despite the
    insistence by politicians and news media that the violent crimes were the acts
    of outliers, the desire was enshrined in the films of Alfred Hitchcock, Brian
    De Palma, David Lynch, Quentin Tarantino, Lars von Trier, in so many horror movies,
    so many other films and novels and then video games and graphic novels where a
