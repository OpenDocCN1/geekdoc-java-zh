    Since the essay I wrote that morning was published, I''ve heard from lawyers,
    scientists, doctors, scholars in many fields, athletes and mountaineers, mechanics,
    builders, film technicians, and other women who''ve had their field of expertise
    explained to them by men who didn''t have any idea what they were talking about
    but thought the world was ordered that knowledge was inherent in them as lack
    of it in women, listening was our natural state and obligation and holding their
    right, perhaps that it is her job to let her sense of self expand as shrivels.
    That asymmetry about who''s in charge of the facts applied to everything from
    intellectual matters to what just happened a moment ago, and it undermines women''s
    capacity to do almost anything, including, sometimes, survive.


    The essay begins with that funny anecdote about the man who told me about the
    very important Muybridge book. The essay''s next anecdote from my own life was
    something else:


    When I was very young and just beginning to get feminism was about and why it
    was necessary, I had a boyfriend whose uncle was a nuclear physicist. One Christmas,
    he was telling—as though we were a light and amusing subject—how a neighbor''s
    wife in his suburban bomb-making community had come out of her house naked in
    the middle of the night screaming that her husband was trying to kill her. Her
    Well, I asked, did you know that he wasn''t trying to kill her? He explained,
    patiently, that they were respectable middle-class people. Therefore, her-husband-trying-to-kill-her
    was not simply a credible explanation for her fleeing the yelling that was trying
    to kill her. That was crazy, on the other hand. . . .


    The same assumption that you are incompetent in your field of expertise may mean
    you''re viewed as incompetent to know if someone is trying to kill you. It''s
    an assumption that has resulted in death for many victims of domestic violence
    and stalking. This essay headed to places I did not know I was going to.


    I am a woman when a poet friend spoke to me of an incident with a nun in Catholic
    school as “the only time anyone ever hit me” was staggered to try to imagine a
    life as safe and calm as hers in this respect. I am the daughter of a man who
    considered it his right to hit women and children'
