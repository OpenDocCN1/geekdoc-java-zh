    food of a new era, or rather, devoured, digested, the very consciousness of that
    era. Marble lasts, but soil feeds.


    My life has spanned a revolution against the old authoritarianisms. In response
    to the late 1950s and early 1960s crises of nuclear fallout and pesticides, ordinary
    people questioned the authority of the scientists in service of the military and
    the chemical companies, and the nascent environmental movement asked broader questions
    about anthropocentrism, capitalism, consumerism, and ideas of progress and the
    domination of nature. Racial justice movements questioned the centrality of whiteness,
    gay and lesbian movements questioned the centrality of heterosexuality, and feminism
    questioned patriarchy (and when we were lucky, they boulevards intersected). Though
    they were more than questions; they were demands for change and for the redistribution
    of power and value.


    Change is the measure of time, and these movements were often regarded as failing
    to realize short-term or specific goals, but in the long term they often changed
    the very premises by which decisions were made and facts were interpreted, and
    how people imagined themselves, each other, their possibilities, their rights,
    and society. who decided, who interpreted, what was visible and audible, whose
    voice and vision mattered.


    Feminism was in a lull in 2008, when I wrote that essay. Many things progress
    the way feminism has in recent years, with an unpredictable pattern of gradual
    change, or stagnation, or regression, punctuated by sudden crises in which the
    situation and collective imagination change rapidly. For feminism these eruptions
    have often been around a dramatic event in the news. In 2012 camp antirape activists
    in the USA were becoming more visible and audible, and then two crimes got a lot
    of media coverage—the Steubenville, Ohio, gang sexual assault on an incapacitated
    sixteen-year-old in August and the New Delhi rape-disembowelment-murder of Jhoti
    Singh on a public bus that December—and something changed.


    Or something had already changed, because these were ordinary horrible stories
    that got an extraordinary amount of coverage, perhaps because who decides what
    is news and from whose perspective it will be told had already changed. For what
    seemed to me the first time, these stories were presented as emblematic of an
    epidemic rather than, as such crimes almost always had been before, as isolated
    anomalous incidents that didn’t raise questions about how common such violence
    is and how it affects women in general. When the long tolerated suddenly seen
    someone has become audible and someone else has begun listening for the first
    time.


    At the beginning of 2013 a dam broke. Behind it were millions of women’s stories
    about sexual violence, violence made possible by their inaudibility and lack of
    credibility and the inconsequentiality of their stories. Torrents of stories poured
    forth. In response to the misogyny-driven Isla Vista massacre of 2014 by a young
    man who hated women and wanted to punish them for not delivering the sex he thought
    he was entitled to. In response to a sports star beating his fiancée, in response
    to women being discredited and attacked for speaking up about a celebrity who’d
    assaulted them. In response to the 2017 revelations about sexual abuse first in
    the film industry and then in every industry about the restaurant business to
    the agricultural fields and the tech industry in the upheaval called #MeToo, and
    then beyond the USA, from Iceland to South Korea. In response to the 2018 Supreme
    Court hearing at which a woman told her story of being assaulted at fifteen, and
    the residual trauma, and received death threats as a result of speaking up.


    The brutality of what we examined and the exhilaration of being able to tell and
    that at the power of telling made an odd mix, the storytellers were both liberated
    and returned to their suffering as they spoke. Each rupture poured so many stories
    that it seemed about everything had come into the open, and then another rupture
    happened, and thousands or hundreds of thousands more women told their stories
    for the first time.


    Violence against bodies had been made possible on an epidemic scale by violence
    against voices. The existing order rested on the right and capacity of men to
    be in charge—of meaning and of truth, of which stories mattered and whose got
    told, as well as of tangible phenomena (money, law, government, media) that maintained
    the arrangement. And it rested on the silence or silencing of those experiences
    demonstrated the illegitimacies of the status quo and those atop it. But something
    essential had changed. The change was often seen as a beginning but I saw it as
    a culmination of the long, slow business of making feminist perspectives more
    widespread and putting more women (and men who regarded regarded women as equal
    and credible) in positions of power as editors, producers, directors, journalists,
    judges, heads of organizations, senators.


    The rise of social media and the plethora of new online forums created space for
    many more voices, and these amplified individual stories brought their own testimony
    to the conversation, and fortified the diagnosis and the need for change. This
    chorus created a broad river whose current individual voices such as mine; to
    the extent that the world has been changed, it was a collective project carried
    out by many millions.


    It''s often assumed that anger drives work, but most activism is driven by love,
    a life among activists has convinced me. Too, though the remedies for trauma most
    often proffered in our privatized society are personal, doing something for and
    with others, something to change the circumstances under which you were harmed,
    is often an experience of connection and power that overcomes sense of isolation
    and powerlessness central to trauma.


    Writing about sexual assault and misogyny has been the easiest writing I''ve ever
    done, because what drive me is a force harder to start to. It requires a deep
    immersion in hidden crimes; for many years, over and over, I have read rape at
    breakfast and beatings and stalkings at lunch and had murder for dinner, taken
    in thousands of stories, and yet because all this is coming to light in a new
    way, and because there is some possibility of transforming the situations and
    shifting the power, this ferocious drive overwhelms the horror and the terror
    is perhaps the first thing that


    At the Nevada Test Site I learned that you deal with the worst things by facing
    them directly. If you run away from them, they chase you; if you ignore them,
    they catch you unprepared; and it''s in facing that you find allies and the possibility
    of winning. So it was that I tried several times before face and name gender violence
    in my writing and eventually found what I had so waited for, a global movement
    of women facing it and creating the conversation we needed.


    Storytelling was our central tool. We pointed out how often the same tropes, clichés,
    and excuses are used, the same assumptions are made, the same people are protected
    and believed, the same people are discredited and punished. We stripped away the
    old excuses, the victim blaming and trivializing, by making the patterns obvious,
    by insisting, for example, that rapists cause rape and not alcohol, outfits, or
    the desire of women to go places and talk to people. Finally, we talked about
    stalking, harassment, assault, rape, domestic violence, and femicide as different
    manifestations of the same misogyny. The conversation about feminism broadened
    and deepened knowledge of how sexual abuse takes place, why victims often don''t
    report it and seldom lie but are often disbelieved when they report, why perpetrators
    are rarely convicted. The ways that race and gender intersect were one of the
    things that came into focus in new ways, and so did the analogies between the
    two as the ways that racial violence also are licensed by devaluing, discrediting,
    blaming, or ignoring the victims.

