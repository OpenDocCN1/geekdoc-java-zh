    # Disappearing Acts


    One night late in my teens, my friend who’d given me the desk and a friend of
    hers and I walked down Polk Street, the lower stretch of the street where the
    bright lights of the cheerful old buildings with late-night bars and stores gave
    away to taller, blanker facades that cast longer shadows and where the runaway
    children sold themselves to the men who purchase children. We were walking in
    the dark, and I was reciting the refrain to a song that had taken possession of
    me, that I couldn''t get out of my head, that had a power that seemed as though
    could be power, or perhaps I possessed it instead, like an amulet, a spell I could
    cast, a fuel that could surge through me and make me something unstoppable.


    It was "Mercenaries (Ready for War)" by John Cale, the avant-garde musician and
    sometime rocker who cofounded the Velvet Underground. I must have heard it on
    the radio because I never owned the record. The lyrics, if you read them, are
    full of scorn for soldiers, but the rhythm and the voice said something else.
    Disapproval was the railroad tracks but power was the train rumbling over them;
    the song had both ways. The force of the thundering drum and bass the howling,
    raging man’s voice intoning "Ready for war" over and over was a soldier’s power,
    was itself a desire for war, a hypervigilance that was a high, a readiness for
    anything, an armor made out of attitude. I didn’t want a war, but since there
    was one, or many, I wanted to be ready for it. Or them. "Just another soldier
    boy" went another of its refrain.


    I didn''t imagine myself as a man but in those moments I felt swept up by power
    that surged like confidence and sureness, I didn''t imagine myself as a woman.
    I wanted to be rugged, invincible, unstoppable, and I didn''t have examples of
    women who were those things. But I lost myself in the moment and the music; to
    be myself was to be, it seemed then, outside of that power or unable to access
    it, to be vulnerable not in the sense of openhearted, but prone to harm. I thought
    that a lot of girls and young women have this yearning that is part desire to
    have a man and part desire to be him, to merge with this force, to be where power
    is, to be powerful, to cleave unto it in the self by bringing your body to it
    as an offering and a quest for transmission. To be the armor and not what’s vulnerable
    behind it.


    At fifteen, I had fallen in love with punk rock when it was first appearing on
    the U.S. scene. It gave form and voice to my own fury and explosive energy, in
    lyrics about defiance and indignation, in music that thumped and galloped. It
    was at, first, in the late 1970s, music for outsiders and the participants were
    mostly scrawny, idealistic, experimental. Early slam dancing was people harmlessly
    bouncing into and off each other. Then the nerds were shoved aside for the jacks
    as a bunch of Southern California men''s bands came to dominate what had morphed
    into hardcore arena dominated by strong young men and the occasional woman who
    came to seem like another place I didn''t really belong.


    But for a while, it spoke for me and to me through me, and one day late in my
    teens I walked down the street chanting that song from John Cale''s most punk-influenced
    album. It was as though I had a choice between being fearless and powerful or
    being myself and I had no map for where those two things might intersect. They
    seemed like parallel lines that would run alongside each other forever.


    Where do you stand? Where do you belong? Those are often questions about political
    stances or values, but sometimes the question is personal: Do you feel like you
    have ground to stand? Is your existence justified in your own eyes, enough that
    you don''t have to retreat or attack? Do you have a right to be, to participate,
    take up space in the world, the room, the conversation, the historical record,
    the decision-making bodies, to have needs, wants, rights? Do you feel obliged
    to justify or apologize excuse to others? Do you fear the ground being pulled
    out from you, the door slammed in your face? Do you not stake a claim to begin
    with, because you''ve already been defeated or expect to be if you show up? Can
    you state what you want without it being disregarded, by you or those you address,
    as aggression or imposition?


    What does it mean neither to advance, like a soldier waging a war, not to retreat?
    What would it be to feel that you have the right to be there, when there is nothing
    more than the space you inhabit? What does it mean to own some space and feel
    that it''s all the way down to deepest reflexes and emotions? What does it mean
    to not live in wartime, not to have to be ready for?


    Some of it comes from your position in society, and all the usual factors of race,
    class, gender, sexual orientation, and more that come into play, some from a quality
    for which confidence is too glib a word. Perhaps conviction or faith is better.
    Faith in yourself and your rights. Faith in your own versions and truth and in
    your responses and needs. Faith that where you stand is your place. Faith that
    you matter. Those people who have it in full seem rare to me, and clear in the
    rest of us aren''t; they who know and where they are, how and when to respond,
    what they do and don''t owe others. Neither retreating not attacking, they reside
    in a place that doesn''t exist for the rest of us, and it''s not the overconfident
    who take too much space and take space away from others.


    Perhaps I will always live in questions more than answers. Where do you stand?
    Where do you belong? Those are often questions about political stances or values,
    but sometimes the question is personal: Do you feel like you have ground to stand?
    Is your existence justified in your own eyes, enough that you don''t have to retreat
