    The problem isn''t really with bodies, but with the relentless scrutiny to which
    they''re subjected. The problem is being a woman. Or being a woman subject to
    me. Once-Catholic mother''s deep shame about the female body''s functions and
    form had passed on with vigor, and my father''s tendency to criticize her anatomy
    and then mine and sometimes of women passing by in the most clinical terms didn''t
    help, nor did it that these were not unusual but ordinary parts of a culture obsessed
    over bodies and in those days quantified beauty according to precise measurements
    and sizes, and told us that the rewards were boundless for meeting them, for failing
    ending, and punished all of us anyway, because these were ultimately standards
    everyone would fail to meet.


    And there I was where so many young women were, trying to locate ourselves between
    being disdained or shut out for being unattractive and being menaced or resented
    for being attractive, to hover between two zones of punishment in space so thin
    that perhaps it never existed, trying to find some possible balance of being desirable
    to those we desired and being safe from those did not.


    We were trained to please men, and that made it hard to please ourselves and our
    desires. So I pleased. I flied. My body was a lonely house. I was not always home;
    I was often elsewhere. I imagined when I was some science-fiction version of humans
    brains in jars as a good thing, that our bodies were some sad thing that we were
    wired rather than instruments of joy, connection, and vitality, the non-negotiable
    terms of our existence. It''s no wonder I was, no wonder women were praised for
    being thin, for taking up as little room as possible, for hovering on the brink
    of vanishing, no wonder of us vanished through undereating like a country ceding
    territory, an army retreating, until it ceased to exist.


