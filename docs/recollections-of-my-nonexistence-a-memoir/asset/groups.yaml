    我从未获得过安全，但我想，袭向我的恐惧中有些是因为在过去的几年里，我曾以为自己也许是可以安全的，以为男性暴力被局限在我长大的那个家里，因此我可以将其抛在脑后。我曾写过，我生长在一个“由内而外”的世界里，除了房子以外处处都是安全的；而作为一个在郊区小区里长大的孩子，我在其他任何地方都觉得足够安全——在那里，我可以肆无忌惮地冲进镇子，抑或冲向山丘，而这两个地方就在门外。我早已学会了离开家，并且从我还是个位数孩子起就开始计划这样做，列出逃跑要带的东西清单。离开家后，我在家里几乎再也没有遇到过危险，但那时，我经常觉得那里是我唯一安全的地方。


    在十二岁、十三岁、十四岁和十五岁时，我曾被家庭和社会圈边缘的成年男性追随和施压，在其他地方也一直是街头骚扰的目标。有些缺失是如此深远，以至于对“缺失”的认知本身都是缺失的；在我们的缺失清单里，有些东西是被遗漏掉的。我最近才意识到，那种我本可以说出“不，我不感兴趣，请离开我”的声音，也是缺失的。


    我们经常被沉默，这假定有人曾试图说话。在我的情况下，这并不是被沉默，因为没有言语被制止；它从未开始，或者它在很久以前就被制止了，以至于我不记得它是如何发生的。我从未想过向那些对我施压的男人说话，因为我从未想过我有权那样维护自己，也从未想过他们是否有任何义务或意愿尊重我的主张，或者我的话除了会让局面变得更糟之外还能起任何作用。


    我变得擅长消失、溜走、潜行、退缩、从狭小的困境中挣脱、躲避不情愿的拥抱、亲吻和手；擅长在另一个男人挤进我的座位时在公交车上占据越来越少的空间；擅长逐渐消融，或在微妙中让自己缺席。这是一门“不存在”的艺术，因为存在是如此地危险。每当我想要直接接近某人时，这种策略很难被废除。在数十年的通过规避来生存之后，你如何能带着敞开的心灵和张开的双臂走向某人面前？这一切威胁让我难以停下来并信任足够久以建立联系，但也让移动变得困难，而且有时似乎这一切都是注定要让我独自留在家里的，像一个过早步入棺材的人。


    步行是我的自由，是我的喜悦，是我负担得起的交通工具，是我理解地方的方法，是我存在于世界的方式，是我思考生活和写作的方式，是我定位自己的方式。去做某些我不愿意接受的事可能太不安全了，而其他人似乎比我更代为接受。“当个囚犯吧，”他们愉快地催促道，“接受你的动动吧，像隐修者一样自己行走吧！”我被驱使去某处，部分是一种创造生活的形而上学冲动，去成为、去蜕变、去行动，但在字面上，是表达激情和释放压力；我绝不会放弃。这是一种思考、发现、做自我的手段，放弃它就意味着放弃所有这一切。


    一天，当我路过社区东边的一个小公园时，一个从未见过的路人没有停下，直接坐在我的脸面前。尽管周围有其他人，我却是孤单的：我曾多次被骚扰，但每个人都假装若无其事，也许是因为愤怒中的男人也恐吓了他们，也许是因为在那个年代人们不仅认为不关自己的事，而且会归怪女性。男人会提出提议、要求，努力开启对话，而这些努力很快演变为愤怒；我不知道用什么方式说“不，我不感兴趣”而不引起反感，因此我无话可说。我没有能为自己做的事，因此我无话可说。


    通常我会低头，一言不发，避免眼神交流，尽力变得缺席、不引人注目、微不足道——尽管我是隐听不见的——因为我害怕冲突升级。我必须学会界限。我尽可能地抹去自我，因为我是一个目标。那些男人进行着对话，有时是一场争吵。他们大喊着我欠他们的服从、性服务。但当我告诉那个穿体面的白人人——他正跟着我——并用那种充满脏话的语言时，他感到非常震惊并威胁要杀我。那是在游客区，我看到一个穿着制服的保安并向他寻求帮助，心想……（由于原文OCR文本存在大量重复和损坏，此处根据提供的逻辑流进行处理）。


