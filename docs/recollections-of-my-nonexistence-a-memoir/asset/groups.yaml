    ## 潜入沉骸


    ![](img/db14ca6438d37a021682af27273dff1e_104_0.png)


    当我写那本书时，我对一些直男性受访者进行了采访，他们认为我可能是某种追随者，而展示对他们圈子的深度了解是消除这种偏见的方法之一：我并不是见到你们感到兴奋，我兴奋的是重构1957年这一切是如何汇聚的，我拥有了大部分碎片，但想问问你们几个问题。我记得其中一个人邀请我坐在他身沙发上，当时我把录音机放下，这像是一道微小的屏障；另一个人似乎对我们可能进行的某种嬉戏而蠢蠢欲动；而布鲁斯·康纳（Bruce
    Conner）多年来的性骚扰，我试图通过称呼他为“布鲁斯叔叔”、他的妻子为“珍阿姨”来回避，这除了其他外，也提醒了我们的年龄差距。那位活跃艺术家的行为似乎源于对我来说非常熟悉的东西——一种认为由于年轻女性是无名之物，你对她们所做的一切都不会被记录的感，而我在记录他的生活和成就时遇到这种感觉令我很不安。


    根据我的研究，我资助了几部在太平洋电影档案馆（Pacific Film Archive）和峡谷电影（Canyon Cinema）放映的短片，但有一部我当时没有看到，但在文学作品中读过。你只在自己的维度上读过或听过的艺术作品，往往这种作品在你看到它之前，已经在你的想象中获得了生命。我想象中关于快乐解放的电影在我最后看到《我的黛西》（My
    Daisy）时枯萎了。这部电影由画家阿尔弗雷德·莱斯利（Alfred Leslie）和摄影师罗伯特·弗兰克（Robert Frank）共同导演，杰克·凯鲁亚（Jack
    Kerouac）负责旁白。


    电影开始于一个女人打开门并为丈夫收拾东西：“宇宙中的清晨。妻子正在起床，打开窗户。她是一个画家，她的丈夫是一个铁路刹车员。……”她从未获得名字，从未绘画，仅仅是一个妻子，一个给孩子准备早餐并送他上学、照料家务，并代表了男人正在逃避、避开并绝对蔑视的一切。当身穿鲜艳外套的艾伦·金斯伯格（Allen
    Ginsberg）、格雷高利·科索（Gregory Corso）以及金斯伯格的情人彼得·奥罗夫斯基（Peter Orovsky）冲进公寓开始喝酒派对时，她似乎并不在那里。男人带着酒和香烟来来去去，陶醉于自我以及对自己作为迷人的认知。金斯伯格在某个时刻像小狗一样在地上打滚，另一个人像抱泰迪熊一样抱着一瓶酒，凯鲁亚的旁白说：“让我们来玩牛仔吧，”并对他们是哪种牛仔展开了即兴。


    核心冲突在晚上展开，一位受妻子邀请的主带着他的母亲和自己的妻子到达。他是一个穿着亮丽西装的年轻人，我们从未发现他是哪个教区的主，尽管显然他应该代表所有正统事物。那群诗人对他很无礼，深信他们的无礼是他们解放的另一个标志。但主教那古板的母亲由艾莉丝·尼尔（Alice
    Neel）饰演，这位画家的作品——大多是肖像和裸体——即使在20世纪30年代也是无畏原创且反叛的。铁路刹车员/丈夫那勤劳刻薄的妻子由美得惊艳的德尔芬·塞贡（Delphine
    Seygong）饰演，她后来成为了一大电影影星，随后成为法国女性主义的主要声音。


    因此，两位伟大的艺术家，一位正处于巅峰，一位处于起步，扮演着沉闷、无名之辈和外表——字面意义上的妻子、母亲。（那名铁路刹车员，他的名字——米洛——经常被提及，由画家拉里·里弗斯（Larry
    Rivers）饰演）。当那些被直呼其名的比特派诗人用爵士乐中断尼尔的管风琴演奏时，我们应该理解她也代表了惯俗，而他们是即兴和酷的东西。然后所有的男人，除了那个带着家人离开的主，都进入深夜去玩耍，而妻子留在家洗碗、照顾孩子。如果你想象自己是诗人之一而非女性之一，我一直是这样认为的。如果你是女性之一，你刚刚被告诉你你都不是，除了一个陷阱和一件行李。


