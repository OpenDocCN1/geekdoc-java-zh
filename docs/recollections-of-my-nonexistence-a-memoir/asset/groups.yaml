    Since the essay I wrote that morning was published, I''ve heard from lawyers,
    scientists, doctors, scholars in many fields, athletes and mountaineers, mechanics,
    builders, film technicians, and other women who''ve had their field of expertise
    explained to them by men who didn''t have any idea what they were talking about
    but thought the world was ordered that knowledge was inherent in them as lack
    of it in women, listening was our natural state and obligation and holding their
    right, perhaps that it is her job to let her sense of self expand as shrivels.
    That asymmetry about who''s in charge of the facts applied to everything from
    intellectual matters to what just happened a moment ago, and it undermines women''s
    capacity to do almost anything, including, sometimes, survive.


    The essay begins with that funny anecdote about the man who told me about the
    very important Muybridge book. The essay''s next anecdote from my own life was
    something else:


    When I was very young and just beginning to get feminism was about and why it
    was necessary, I had a boyfriend whose uncle was a nuclear physicist. One Christmas,
    he was telling—as though we were a light and amusing subject—how a neighbor''s
    wife in his suburban bomb-making community had come out of her house naked in
    the middle of the night screaming that her husband was trying to kill her. Her
    Well, I asked, did you know that he wasn''t trying to kill her? He explained,
    patiently, that they were respectable middle-class people. Therefore, her-husband-trying-to-kill-her
    was not simply a credible explanation for her fleeing the yelling that was trying
    to kill her. That was crazy, on the other hand. . . .


    The same assumption that you are incompetent in your field of expertise may mean
    you''re viewed as incompetent to know if someone is trying to kill you. It''s
    an assumption that has resulted in death for many victims of domestic violence
    and stalking. This essay headed to places I did not know I was going to.


    I am a woman when a poet friend spoke to me of an incident with a nun in Catholic
    school as “the only time anyone ever hit me” was staggered to try to imagine a
    life as safe and calm as hers in this respect. I am the daughter of a man who
    considered it his right to hit women and children and did as his father before
    him, and of a woman who had felt she had for two decades no recourse from that
    man and no place to register a complaint. I am a woman who by the first years
    of my teens had to learn to squirm and worm and fade away when men pursued me
    because telling them to leave me alone was in that era of my youth inconceivable
    as something I had the right or even the safety to say and they had the obligation
    or even inclination to heed. I am a woman who during my youth thought it likely
    I would be raped and maybe also murdered and all my life lived in a world where
    women were raped and murdered by strangers for being women and by men they knew
    for asserting their rights or just being women and whose rapes and murders were
    lasciviously lingered on art. I am a woman who had been told at crucial times
    that I was not believable and that I was confused and that I was not competent
    to deal with facts. And in all that I am ordinary. After all, I live in a society
    where rape kits and campus stalking awareness month and domestic violence shelters
    in which women and children are supposed to hide from husbands and fathers are
    normal fixtures.


    And I am a woman who became a writer and it gained some standing while writing
    other things from art to war, and sometimes tried to put that while standing to
    work to open open space for others'' voices. I am a woman who one morning wrote
    an essay called “Men Explain Things to Me” that is about the way that mild disparagement
    of having your subject of expertise explained to you by a fool who not know that
    he does not know what he''s talking about or who''s talking to is on a spectrum,
    and that the other end of the spectrum is of violent death.


    I had a version of the essay printed out to put on the breakfast table with Marina’s
    coffee and my tea couple of hours later, and at 10:42 morning I sent thirteen
    friends, including Tina, the essay in an email also titled MEN EXPLAIN THINGS
    TO ME. That morning’s version had a little superfluous ornamentationed out before
    publication, to my surprise when I look now, an epigraph from Keats’s “Ode to
    a Nightingale,” but it is very close to the essay I published online and, in truncated
    version, of the Los Angeles Times a few weeks later.


    I had written about my experiences and perceptions, and they had turned out to
    have a lot of common with other women’s experiences and perceptions. It went viral
    immediately and got millions of hits at the website Guernica over the years because
    the experiences and situations I described were brutally common and so inadequately
    acknowledged. It has most likely had more impact than anything else I''ve done,
    this essay I wrote in one sitting that morning. As the title essay of a 2014 anthology
    of my feminist essays, it became a bestseller in South Korea and stayed that way
    for years in the United States, and it appeared in several other languages from
    Danish to Spanish to Farsi.


    It prompted an anonymous commenter at the website LiveJournal to coin the word
    mansplaining soon after it appeared, a word that caught on, that entered the Oxford
    English Dictionary in 2014, that is now widely known and used in English, exists
    in dozens of languages, and begat a host of variations such as whitesplaining
    (and that''s often credited to me, though I thought did not coin it). It also
    provided some encouragement I''m proud of. A very famous woman writer, soon after
    the essay appeared, sent it to a well-known pundit, a bellicose misogynist, with
    this message: “Reading this wonderful essay by Rebecca Solnit reminded me of something
    I have been meaning to say to you for a long, long time. Go fuck yourself,” and
    it prompted one young woman I to get divorced.


    I have been thrilled and moved by the young women who came up to me to say that
    something I''ve written helped them locate their power and their value and reject
    their subjugation. You don''t really know what you do when you write, because
    it depends on how people read, and there are ways knowing their appetites and
    interests can guide you down familiar paths and ways that not knowing can take
    you to appetites and interests you didn''t know and sometimes your readers didn’t
    either. There’s a Buddhist phrase about the work of bodhisattvas: “the liberation
    of all beings.” I see feminism as a subset of that work.


    A writer’s voice is supposed to be hers alone. It’s what makes someone distinct
    and recognizable, and it’s not quite style and not just tone or subject; it’s
    something of the personality and the principles of the writer, where your humor
    and seriousness are located, what you believe in, why you write, and who and what
    you write about, and who you write. But the feminist themes that became a major
    part of my work “Men Explain Things to Me” is for and about often with the voices
    of other women talking about survival.


    That work of mines includes a chorus and sometimes one. When you pursue creative
    work, immortality is often held up as an ideal. If you''re supposed to aspire
    to something that will be recognized and that will, as they say, “keep your name
    alive,” and it''s true that words are alive when they''re read or heard. I learned
    from the artists I researched and wrote about and the movements that changed the
    culture there are two ways of making contributions that matter. One is to make
    work that stays visible before people'' eyes; the other is to make work that is
    so deeply absorbed that it ceases to be what people see and becomes they see.
    It is no longer in front of them; it''s inside them. It is no longer the artist;
    it''s the people who are no longer the audience.


    Works of art that had an impact in their time sometimes looked dated or obvious
    what was fresh and even insurrectionary about them become the ordinary way things,
    how we edit films or see history or nature or sexuality or understand rights and
    violations. Thus the vision of one or a few becomes the perspective of many. They
    have been rendered obsolete by their success—which makes the relevance of even
    much nineteenth-century feminist writing a grim reminder that though we''ve come
    far, it''s not far enough.


    I''ve sometimes thought immortality is a desert, from the monotheistic fanaticisms
    of the desert, where a scar or a treasure can last for thousands of years, where
    some Bedouin shepherds can take the Dead Scrolls out of a jar in a cave twenty
    two hundred years after they were put there—including the Book of Isaiah reminding
    us that “all flesh is grass.” humid places everything decays, and much decays
    back into the soil, and that soil nurtures new life, and perhaps the best thing
    creative work can do is to compose into the soil so that, unremembered, it becomes
    the'
