  - '[PAGE 138]


    the pleasure of bringing ideas, projects, and people from one circle to another,
    and the lack and loneliness were gone.


    I went through a phase of approaching the powers that I had assumed were not for
    me and maybe not for my gender. I bought a motorcycle at the beginning of the
    1990s, and revving the engine and kick-starting it and moving its weight to park
    it or bring it upright or pick it up when it got knocked over gave me a kind of
    macho pleasure (more than riding it, which I always found late a little scare,
    because of cars, before it was stolen months after I bought it). I learned to
    work out weights and weight machines shortly thereafter, having finally noticed
    that the body requires maintenance and that the stress that petrified my form
    yielded at least temporarily to violent exertion.


    Two or three years later, the boyfriend who lived in the Mojave wanted me to shoot
    a .22 rifle—we went into the desert and aimed at Old English malt liquor cans
    late one afternoon until evening came and our shadows stretched for a hundred
    feet and more across the flat ground. I found it alarmingly fun, when we went
    shooting with his father, who had spent his life in the military and a lot of
    time in combat, he told me the story of being forced by a general''s direct orders
    to shoot a civilian on a hill long away—and how he had nightmares ever after.
    It was a solemn and great warning to take guns seriously. And I studied Shotokan
    karate for a little while with a world champion fighter who feared nothing when
    she walked the street. Just to shout and kick and strike required a different
    sense of self. Each of these felt like a little usurpation of powers that I had
    never believed were for people like me. Things were changing.


    Street harassment largely ceased to be a problem, and my wariness softened, though
    it never went away. It was not a science experiment with a control, so it''s hard
    to say what exactly changed. Perhaps I aged out of my prime years. Perhaps the
    culture changed in some way, though I know young women still suffer harassment
    and assault. Perhaps the ways I became street-smart were a factor: I learned to
    give those I encountered respect and acknowledgment, and to not get caught in
    anyone''s drama—to be fluid on the street, moving smoothly without snagging or
    rushing. White men fell silent. The commentary from the black men in my neighborhood
    grew uniformly cordial, as some of it had always been, and I tried to say pleasant
    things back, and enjoyed the interactions.'
  - '[PAGE 139]


    I published short pieces and reviews and then longer pieces and more ambitious
    essays. I wrote a book and then a more ambitious book and then another in vein
    and then I wrote my history of walking, Wanderlust, which appeared in 2000, the
    first book for which I got an advance that approximated a living wage, the first
    book that circulated widely. Each book answered a question I began with and by
    its end generated other questions. That history of walking made me wonder about
    two things that I explored in what became my next two books.


    I wrote A Field Guide to Getting Lost to get deeper into ideas about wandering,
    venturing into the unknown, coming to terms with the essential mystery at the
    heart of things, and about loss. I was not sure whether I would ever show it to
    anyone, or whether I finished it or whether it was publishable, or whether I wanted
    to publish it. Then I and it had a quiet life at first and then an interesting
    one as people found and quoted it and some artists made work in response to it.


    The other of the two books to emerge from Wanderlust was about technological change
    and the disembodiment that came with the transcendence of time and space that
    machines made, and it was centered on Edward Muybridge, the British photographer
    who laid the groundwork for what became motion pictures (and documented San Francisco,
    where he lived during much of his prime, when he murdered his wife''s lover, made
    some of the greatest landscape and panoramic photographs of the nineteenth century,
    and transformed, with high-speed sequential photography, what scientists and artists
    knew about humans in motion).


    Something else shifted in the work around the time the Muybridge book was published
    in the spring of 2003. It came in part from seeing Barry Lopez and Terry Tempest
    Williams talk and meeting Susan Sontag. I asked myself why, though I was writing
    about politics in various ways, not speaking as directly as Sontag was, or as
    Barry and Terry were to what lay underneath the news, the terrors and yearnings
    and ideals that drive our public as well as our private selves. And I was beginning
    to collect stories that illustrated my evolving sense of how the world changed
    and where the case for hope is.


    Another one of my amusingly awful encounters with older white men helped bring
    together that collection of ideas into the May 2003 essay “Hope in the Dark” and
    the 2004 book of that title. One day in the spring of'
  - '[PAGE 140]


    2003, my work was featured in a university colloquium with a man who launched
    an extended ad hominem attack on me, my motives, and my hopefulness. I''d arrived
    at hopefulness in the course of pursuing a return project in Yosemite National
    Park. In 2001, with the artists Mark Klett and Byron Wolfe, I''d ventured to rephotograph
    Edward Muybridge''s photographs and understand what had changed since made them
    in 1872. Our project grew into a broader survey of earlier photographers, modernist
    as well as Victorian, and of what had had not changed since their times. The exploration
    gave me a magnificently complex sense of change as something that does not occur
    at a predictable rate but varies widely from place to entity: some trees were
    still recognizable more than a century later, some arrangements of small boulders
    had not moved in that time, but the Merced River shifted its bed, forests that
    devoured meadows, and celebrated old landmarks had vanished.


    I thought I was there to look at change over the span of 130 years, but I was
    astonished to find how much had changed in less than a decade since I had scrutinized
    the park for Savage Dreams. Native people had gained some rights and a lot more
    representation in the park. Before whites arrived, they had set fires as part
    of their land management techniques, and the Park Service had finally recognized
    fire as part of the place''s ecology after a century of fire suppression. The
    Park visitors were far more ethnically diverse; the sense of one cosmology having
    pushed out by another going away, or so it seemed to me, to a sense of the coexistence
    of many worldviews and a big adjustment in the Eurocentric to recognize—imperfectly,
    incompletely, but still—the rights and presence of indigenous Americans. California
    was on its way to becoming a nonwhite-majority state and of the promise of that
    I had found in the park this time around.


    This was the vision I''d presented at the university, where the academic man had
    laid into my motives and my character for half an hour or so, in front of the
    students I''d brought from the writing class I was teaching at an art school.
    He was attached to his narratives that everything was getting worse, to his despair
    (and, I was told by mutual friends, resentful that my pile of publications kept
    growing). I was appalled I''d brought these young women, by my dean''s urging,
    to hear elevated discourse and they''d heard this instead. The whole thing churned
    in my'
  - '[PAGE 141]


    head until a couple of days later when I got up before dawn and returned to that
    old desk in the east bay window of my home and wrote until sunrise arrived and
    a raven landed on the telephone wires just beyond the window and I''d made the
    preliminary case for hope to my satisfaction. “Thank you for sitting all the way
    through me, um, very interesting colloquium, and a special thanks to Maggie and
    Kristina for making supportive faces me from across the room,” I wrote them. “For
    me, the ultimate subject is what kinds of histories we can imagine and can tell."


    The academic conflict over my ideas had taken thirteen days before the Iraq War
    began in a hail of aerial bombs on March 20, 2003. Earlier that year I''d put
    together a group of my friends—a Gulf War vet, a singer who was an old friend
    from the Nevada Test Site days, a Cuban Buddhist, an astrophysicist, a domestic
    violence advocate—under the rubric B.A.D.A.S.S., the Bay Area Direct Action Secret
    Society. We were part of a global movement that the month before had held the
    greatest demonstration in world history, in thousands of locations, hundreds of
    countries, on seven continents. We dressed as superheroes, dressed in business
    casual, dressed in white with our faces in white masks and the faces of Iraqi
    children on our chests, dressed in black. We marched, we did street theater, we
    sang, and then the bombs began falling and, horror, we helped shut down the city''s
    financial district.


    Many years later I heard a story from Natasha Deón who was then a corporate attorney
    living in a high-rise near that district. On one of the big days of protest, she
    down from her perch to buy a soda, looked around the throws on the boulevard,
    and wondered what she was doing with her life. She decided to change it. She became
    a lawyer who defends the indigent, passionately, and then, a few years after we
    became friends, a successful novelist. What she told me years later was the kind
    of story I''d collected to make the case that you can''t assume that you know
    why you''re doing matters. You can''t at least declare failure immediately, because
    consequences are not always direct, or immediate, or obvious, and the indirect
    consequences matter.


    When the bombing of Baghdad began, some of the friends I''d protested with others
    around me extrapolated from the fact that they had not stopped the war the idea
    that they had not achieved anything, and sometimes they traveled onward from there
    to the idea they''d never achieved anything, had power, and that we were all doomed.
    Despair'
- md: "\nbecame a machine that would grind anything you fed it. That prompted me to\
    \ work harder on the case for hope I was building. I'd been informally collecting\
    \ passages and examples, and on the day after the attack at the university forum\
    \ I'd written that letter making the case for hope to send to some of the people\
    \ who'd been in attendance there. Disagreement often prompts clarification, at\
    \ least in my case, and it can be useful even when its intention is adversarial.\
    \ Half my muses have been haters.\n\nAfter the war, I worked in a sort of trance\
    \ all day and into the night for three or four days to shape the material into\
    \ the essay “Hope in the Dark.” Anecdotes and examples that had been accruing\
    \ for years suddenly had a pattern to fit into, and the pattern was the case for\
    \ hope. Some of it was recycled from the letter to my students. It was the first\
    \ thing I published exclusively online, and it went viral as nothing I'd ever\
    \ done before, picked up by alternative weeklies, reprinted as a small booklet\
    \ by a graphic designer, forwarded over and by email in those days before social\
    \ media.\n\nI argued that we had a lot of power, a history of forgotten and undervalued\
    \ victories, that some things were getting worse, the long view—especially if\
    \ you were nominal, or straightforward, or nonwhite—showed some remarkable improvement\
    \ in our rights and roles, and that the consequences of our acts were not knowable\
    \ in advance. They were often not knowable soon afterward and ever since great\
    \ strategists, idealists, and movements sometimes prompt repercussions in other\
    \ times and places and struggles. I saw violent direct action Eastern European\
    \ countries from their totalitarian governments in 1989, seen the Zapatista insurgency\
    \ emerge from the Lacandon jungle in 1994, seen the government of Canada create\
    \ the vast indigenous-governed territory of Nunavut in 1999, seen things I'd never\
    \ dreamed possible to pass. In 2004 I turned the essay on hope into a small book,\
    \ and over the following years it came out in a dozen other countries and languages.\n\
    \nMy interlocutor had accused me of offering palliatives for marketing reasons,\
    \ but what I wanted to offer is encouragement, a word, though it carries the stigma\
    \ of niceness, literally means to instill courage. Encouragement not to make people\
    \ feel good, but to make them feel powerful. I'd eventually realize that what\
    \ I was doing could equally characterized as stealing away the best excuse for\
    \ doing nothing: you have power and nothing you do matters. It was nurture of\
    \ people’s sense of possibility, and it was dissent from a lot of the most familiar\
    \ narratives in which despair and cynicism—that weird formula in which overconfidence\
    \ about outcome undermines one’s will to play a role—justify nonparticipation.\
    \ Something profound had shifted for me to feel capable of changing minds and\
    \ responsible for tending to hearts. A sense of possibility had replaced it, about\
    \ my own capacity and role as well as about powerlessness and disconnectedness\
    \ had faded away and a sense of possibility was about the way that change itself\
    \ works.\n\nOver the next several years, I became a political writer, writing\
    \ essays in response to unfolding events and chronic situations and circulating\
    \ them via a website that got picked up by news sites all over the world. It was\
    \ often the worst things, the things I disagreed with or was outraged by, that\
    \ inspired me to write, though I wrote a lot about what I loved as well—and what\
    \ I opposed I opposed I opposed because it harmed or threatened to harm what I\
    \ loved. And then I wrote something that took on a wild life of its own, wrote\
    \ it as casually as I’d ever written anything. Everything else I ever wrote was\
    \ on a subject I chose and approached intentionally, but feminism chose me or\
    \ was something I couldn't stay away from.\n\n# 3\n\nIn those days I often headed\
    \ my emails to Tina with weather reports, since she had moved far away for a teaching\
    \ position and missed the Bay Area. We had been writing almost daily for years,\
    \ and sometimes times a day. On March 24, 2008, we'd been continuing the back-and-forth\
    \ on an email from March 20 that I'd headed FULL MOON, EQUINOX, PRETTY DAY BUT\
    \ CHILL. That evening of March 24 I'd written her with a new heading, LONG FAINT\
    \ HERRINGBONE CLOUDS BEFORE DUSK.\n\nTwo years before, I had left the studio apartment\
    \ for a more spacious dwelling six blocks down. My friend Marina had just moved\
    \ in with me there, in flight from an awful soon-to-be-ex, and I was delighted\
    \ to be with me. By the time of the alarming diagnosis I received that winter,\
    \ we were close friends. The diagnosis meant major surgery a few weeks before\
    \ this time, so we were nestled in, convalcing, in our own way. She was one of\
    \ those people with whom a conversation opened upumbles and flows of its own accord,\
    \ with jokes and laughter mixed with explorations of ideas and events, aspirations\
    \ and emotions, the conversations I dreamed of.\n\nA friend to talk to in person,\
    \ a friend to write to every day. It was a hard time, and we were grumbling in\
    \ the email to Tina, but I had reached a point where my social life was all that\
    \ I could desire. Marina, who usually had a birdlike brightness of eye, a vivacity\
    \ and an exceptional emotional warmth, as well as a brilliant political mind,\
    \ had been subdued after her separation until evening of the long faint herringbone\
    \ clouds. Thanks to the email (Tina also liked food descriptions), I knew I'd\
    \ made us dinner of pasta, artichokes, and greens from the Civic Farmers' Market,\
    \ and that I had invited my younger brother, a close friend of hers, who joined\
    \ us after he had participated in a demonstration in which 4,000 candles were\
    \ lit for victims of a massacre, and that we had drunk a bottle of red wine, and\
    \ Marina hadn't recovered her sparkle and her verve.\n\nThe herringbone clouds\
    \ didn't mention that I had been joking that night, as I had for years, about\
    \ an essay called “Men Explaining Things to Me.” I'd brought it up at the dinner\
    \ on my little drop-leaf table with the legs I'd bought from the elderly couple\
    \ next door. When I did, Marina urged me to write the piece and said how much\
    \ young women like her sister needed it. Many years later, in the apartment I\
    \ currently inhabit, I sat at another kitchen table, with a film actress who had\
    \ come to talk with me about feminism. The next day an enormous bouquet arrived\
    \ with a card quoting back what she liked best of what I had said: “It’s not you,\
    \ it’s patriarchy,” which might be one of feminism’s basic messages. That is,\
    \ there’s nothing wrong with you; there’s something wrong with the system that\
    \ bears down on you and tells you you’re useless, incompetent, untrustworthy,\
    \ wrong. I was an early riser, and was catching up on much-needed sleep, and the\
    \ attic had just two rooms. The kitchen and the daybed on which guests slept were\
    \ in the west. The room was my bedroom and office, with a built-in desktop held\
    \ up at its center by the old spindle-legged desk. So the morning of the 25th,\
    \ rather than disturb her rest, I sat down at desk once again and did her bidding.\
    \ The essay poured out with ease or tumbled seemingly of its own accord. When\
    \ this happens it means that the thoughts have long been gestating and writing\
    \ is only a bit of what was already taking form out of sight. So much of the work\
    \ of writing happens when you are seemingly not working, made by part of yourself\
    \ you may know and not control, and when the work shows up like that your job\
    \ is to get out of its way. Marina had in her anecdotes the possibility of telling\
    \ that to the world or to some women in it, and she thought they ought to hear\
    \ it. \n\nWhat I wrote that morning started me, because when I had been joking\
    \ the night before, I hadn't connected explaining things to what I would write\
    \ that morning. The essay’s beginning is comedy: in an incident from five years\
    \ earlier, a man talks over to explain my own book to me and is briefly stunned\
    \ to realize (when my companion finally succeeds in interrupting him) that I,\
    \ the person he's already dismissed and turned into an audience am the author\
    \ of “very important book” on Muybridge who is holding forth.\n\nI’ve sometimes\
    \ been taken to task by people as though I equate minor dignities with major crimes,\
    \ people who don’t or prefer not to understand what we talk about a lot of things\
    \ on a spectrum, and we can distinguish the different points on the spectrum,\
    \ but the point is that it’s one spectrum. Making black people drink out of separate\
    \ drinking fountains and lynching them are different in degree and kind, but both\
    \ emerge from the same\n"
