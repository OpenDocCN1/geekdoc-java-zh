    he was entitled to. In response to a sports star beating his fiancée, in response
    to women being discredited and attacked for speaking up about a celebrity who’d
    assaulted them. In response to the 2017 revelations about sexual abuse first in
    the film industry and then in every industry about the restaurant business to
    the agricultural fields and the tech industry in the upheaval called #MeToo, and
    then beyond the USA, from Iceland to South Korea. In response to the 2018 Supreme
    Court hearing at which a woman told her story of being assaulted at fifteen, and
    the residual trauma, and received death threats as a result of speaking up.


    The brutality of what we examined and the exhilaration of being able to tell and
    that at the power of telling made an odd mix, the storytellers were both liberated
    and returned to their suffering as they spoke. Each rupture poured so many stories
    that it seemed about everything had come into the open, and then another rupture
    happened, and thousands or hundreds of thousands more women told their stories
    for the first time.


    Violence against bodies had been made possible on an epidemic scale by violence
    against voices. The existing order rested on the right and capacity of men to
    be in charge—of meaning and of truth, of which stories mattered and whose got
    told, as well as of tangible phenomena (money, law, government, media) that maintained
    the arrangement. And it rested on the silence or silencing of those experiences
    demonstrated the illegitimacies of the status quo and those atop it. But something
    essential had changed. The change was often seen as a beginning but I saw it as
    a culmination of the long, slow business of making feminist perspectives more
