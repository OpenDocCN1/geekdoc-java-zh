    80 年代的反干预运动和环保运动，以及我当时担任志愿者的热雨林行动网络（Rainforest Action Network），我在那里结了布拉德·埃里克森（Brad
    Erickson），当时他正从格威奇人和马赛长辈那里向我学习环境正义的知识；感谢 90 年代的反核能运动和内华达测试场活动家；感谢 21 世纪的气候活动家，他们中现在有我的许多朋友和同事：Bill、May、Anna、Joe、Steve、Mike
    B.、Antonia 和 Red。


    感谢克莱夫·琼斯（Cleve Jones）在 2018 年的那个时刻，因为我带着艺术家斯蒂芬妮·西朱科（Stephanie Syjuco）制作的壮丽横幅出现，你让我走在沿中心大街的男同恋者游行之首，这或许是我作为旧金山人最光光的抵达时刻。斯蒂芬，感谢你的那面民主横幅。


