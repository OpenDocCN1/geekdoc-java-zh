    in the shade of her beloved orchards. Sometimes I imagined all these old people
    in the homes around dreaming of the places they came from, imagined the phantoms
    of those fields and orchards, dirt roads and flat horizons, shimmering in our
    middle-of-the-night streets.


    Mr. Young was a World II veteran, and the war had plucked him out of the countryside
    and brought him here. His military records say he was an unmarried farmworker
    when he was drafted in Choctaw County, Oklahoma, at age twenty-two. He had stayed
    in the military, served long enough to get a pension. He told me he had been one
    of the black soldiers on whom poisonous gas was tested. He described a warehouse
    or hangar full of gas and men without gas masks running across it. Some of them
    died, he said.


    He drove a big pickup truck with a camper and kept it parked in the garage just
    to the left of the building''s entryway. He often stood in the garage doorway,
    leaning against the jam or the, greeting passersby, carrying on conversations,
    throwing out a word to keep a kid in line; in summer he often hauled a load of
    melons from Vallejo to sell. Sometimes I caught a glimpse of a pistol tucked into
    the side of the overalls. He smoked a pipe filled with sweet tobacco which smell
    sometimes came upstairs through the vents in my kitchen, which was just'
  - '[PAGE 20]


    above his bedroom. I always stopped to have a conversation when I ran into him,
    or at least an exchange of pleasantries, and sometimes when I was in a rush I
    dreaded meeting him in the hall, because anything under five minutes of conversation
    seemed to be regarded as rude.


    He told me stories about growing up in southeastern Oklahoma, the son of sharecroppers.
    The one I remembered was about when he was a youth entering his teens and the
    Barrow Gang—Bonnie and Clyde and their associates—were in the house when he and
    his parents came back from the fields. The gang of bank robbers was there because
    in a segregated society the last place you would look for white outlaws among
    black people. The gang reportedly did this with at least one black sharecropper
    family in Oklahoma, and I later heard that another legendary gangster, Pretty
    Boy Floyd, also hit among black homes in time when the bank robbers were folk
    heroes of a sort. On visit to the Youngs family home, they left a ten-dollar gold
    piece on the table or the dresser. His mother didn''t want to have stolen money,
    but his father said, "Children need shoes for winter." There were two visits.
    That or another time they came from the fields and the gang was at their table,
    helping themselves to food.


    So many years after I heard the story, I still see the picture that formed as
    I listened, of a wooden house somewhere in the country, a table, a sideboard,
    maybe a porch, maybe surrounded by cornfields. Maybe one of the powerful cars
    the Barrow gang stole pulled alongside, white people in a black family''s space.
    Which is what I was in that building he invited me into, that neighborhood to
    which many black residents had moved as they were evicted by the gutting of the
    Fillmore District in the name of urban renewal, nicknamed Negro removal back then,
    the same families who had come to escape the South pushed out again, pushed to
    the western margin of a vast area known as the Western Addition.


    There are so many ways people are forced to disappear, uprooted, erased, told
    that this is not their story and not their place. They pile up in layers like
    geological strata; Ohlone people had resided for millennia before the Spanish
    came crashing, and Spain claimed the whole coast and then it became a sparsely
    inhabited outer edge of an independent Mexico. After California and the Southwest
    were taken by the United States, the Mexicans remained were fled of their vast'
  - '[PAGE 21]


    ranchos and treated as an underclass, intruders, or both, though their names stayed
    on many places, the names of saints and ranchers.


    Just north and west of our neighborhood lay the immense nineteenth-century cemetery
    district from which the dead were evicted by the tens of thousands in the early
    to mid-twentieth century, so that the land could be put to more profitable use.
    Their skeletons were piled up in mass graves a few cities to the south, their
    tombstones used as building material and landfill, and a park just south of us
    had lined with shattered tombstones, some with inscriptions still legible. A short
    walk east was Japantown, a community from which, during the war, nearly everyone
    of Japanese descent was forced into internment camps, their vacant homes soon
    occupied by the black workers and families migrating to where the shipyard and
    other wartime jobs were. All of that lay in the neighborhood’s past when I arrived,
    though knowledge of it lay far ahead of me.


    I first visited the building and met Mr. Young five days after Ronald Reagan''s
    inauguration. The nation, having reached its maximum of economic equality, had
    voted in someone who was going to reverse direction, stop progress, reclaim wealth
    in the hands of the few, dismantle the programs that had helped so many rise,
    create mass homelessness. Crack was soon to come to the city and other cities,
    and to our neighborhood and our block. My own experiences around that time with
    the sense of potency and grand destiny made me wonder whether it was seductive
    specifically as a counter to the despair and desolation that this reversal brought,
    the drug you took when you hit the wall built to keep you out. There were walls
    behind which some of the men in the neighborhood would go, and graves for yet
    others. The Western Addition was black, and realtors and others carved out spaces
    in part by renaming them, chipping away at the place’s identity, as the black
    community was pushed out of an increasingly expensive, elite city. (Later on I’d
    come to understand gentrification and the role that I played as a pale face making
    the neighborhood more palatable to other pale faces with more resources, but I
    had no sense at the start that things would change and how that worked.)


    The beautiful wooden houses had been built in the late nineteenth and early twentieth
    centuries with all the era’s lavish ornamentation: bay windows, pillars, lathed
    railings, ornamental moldings, often with botanical motifs, fish-scale shingles,
    porches framed in arches, turrets, even'
- md: '

    occasional onion dome. They were full of biomorphic curves and eccentric intricacies
    that made them seem organic, as though they had grown rather than built. A Muir
    Woods park ranger once remarked to me that she saw in these structures the great
    redwood forests that had been cut down to build them, and so those tall groves
    up and down the coast were another ghostly presence.


    The materials and craftsmanship of the original buildings were magnificent, by
    the postwar era white flight was taking one population to the suburbs and letting
    other populations—nonwhite, immigrant, poor—into these places that were treated
    like slums by their absentee owners. The buildings had their ornamentation scraped
    off or stucco or plastic siding over them, or they were divided up into smaller
    apartments, often built with shoddy materials and techniques, and many of them
    were allowed to grow shabby and rickety.


    Blight was the word used in the 1950s and 1960s to justify knocking down many
    of them to the east of our little neighborhood, leaving behind open wounds in
    the city’s skin of structures. In some of them, grim housing projects were built,
    so alienating and oppressive that they were torn down a few decades after they
    were erected. Others in the heart of the Fillmore, which had once been the vibrant
    zone Mr Teal liked to reminisce about, were still vacant through most of the 1980s,
    behind cyclone fencing. A place had been killed, and it never quite came back
    to life.


    Change is the measure of time, my photographer friend Mark Klett likes to say,
    and little things shifted. When I arrived, there was a Kodak photo booth on the
    corner block west, when film was how you got photographs, and a glass-walled phone
    booth on the corner across from my place, next to the liquor store. It became
    a pay phone bolted to the wooden wall, under a hood like a store hood, and then
    disappeared altogether as mobile phones proliferated.


    The texture of that bygone life seems to convey now: the solitude of a wanderer
    in the city who could wait for a bus or a taxi to come by or find a phone booth
    to call a taxi or a friend from a memorized number or by asking the operator or
    by looking it up in the ruffled tissue-thin pages of the phone book if there was
    one there, dangling in its black case from the metal cord; who’d look for what
    she wanted in many stores before the internet meant that you could pinpoint things
    without getting out of bed, back when there were fewer chain stores and more variety.
    We were subject to the wonders and frustrations of unpredictability and better
    able to withstand them because time moved at what would only later seem a gentle
    flow, like a river across a prairie before the waterfall of acceleration we would
    all tumble over. We were prepared for encounters with strangers in ways that the
    digital age would buffer a lot of us from later. It was an era of both unpredictable
    contact and more profound solitude.


    In that lesser era, eccentricity had many footholds. A lot of small businesses
    doubled as museums devoted to various things—there was a dry cleaner near the
    Castro with a display of antiques artfully arranged, and various stores with ancient
    photographs of the neighborhood as it had been long ago, and a corner store in
    the Mission with a rubber-band ball several feet in diameter, sitting on the linoleum
    near the chips. The Postcard Palace in North Beach sold nothing but old postcards,
    already stamped and inscribed in the confident penmanship of their era with cryptic
    or jaunty messages from long-dead people to other long-dead people. I still have
    dozens I bought, a few at a time, mostly black and white, of various mountain
    roads and chapels and grottos, on evenings when I wandered out of a punk show
    to browse.


    The city felt like something old and crumpled in crevices, and then it was smoothed
    out and swept clean; some of its people were pushed out as though they had themselves
    been dirt. A junk shop became a high-end pizzeria, a storefront church became
    a hair salon, a radical bookstore became an eyeglass boutique, and a lot of things
    became sushi bars. The place became blender, with more chain stores and more cars,
    and without flyers layered each other on telephone poles, with family pharmacies
    and odd businesses like old temples where the priest still performed the rites
    whether or not the congregation had moved on.


    There was an actual lunch counter at the Scully Owl Drug Store a couple of blocks
    to the west of my apartment, like the lunch counters of the South that people
    sat in to protest segregation, and then the lunch counter vanished, and then the
    drugstore was gone, and then, at the millennium, the whole place with the union
    grocery store, liquor store, butcher, and bakery was demolished to build a big
    chain supermarket with condominiums on top. Many cities that had been centers
    of blue-collar labor and the manufacture of tangible goods saw these industries
    die in the postwar era, but their death was not much noticed when new information
    and finance and tourismropolises were exploding into being in their ruins, as
    was the case, spectacularly, in San Francisco in the 1980s. In that era, Silicon
    Valley was actually manufacturing silicon chips in clean rooms staffed by immigrant
    workers and dumping the toxins, and then those jobs went overseas and the tech
    industry began to supernova, and a region that had been an idyllic edge and sometimes
    an exception became a powerful global center.


    Change is the measure of time, and I discovered that in order to see change you
    had to be slower than it, and that by living in one place for a quarter century,
    it became visible to me. Gradually. Not at first People came and went in the building
    I stayed in, and many of the transient inhabitants imagined that they were passing
    through a stable neighborhood, but they were part of what was changing it, a river
    of people scouring out the place, making it less and less black, and more and
    more middle class. The newcomers lived in the space their money secured, not the
    space that belonged to everyone.


    Poverty is sometimes a greater preserver of the past, and I lived in a place little
    altered since its creation. My own building, a stucco structure from the 1920s
    among all those stately Victorians, had its own graces and charms. My little apartment
    amused me for the devices built into it as though it was tiny when it felt spacious:
    a narrow ironing board that folded into the wall, a Murphy bed that dominated
    the room when it was opened, so I unfolded it for good what had been a roomy closet.
    There was a window at the head of the bed, a wide door at the side, and another
    at the foot of the bed, so it was fairly open as closets go, but still a closet,
    the one I slept in for a quarter century. Narrow planks of the yellow-gold floors
    were original, as were the steamy radiator, and the chute on the back stairs which
    garbage plummeted down two stories into the big can, and the early defunct refrigerator
    built into the wall on one side of the kitchen, by the sinks, across the built-in
    sideboard and glass cabinets that rose to the ceiling.


    A magnificent old Wedgewood presided over the kitchen, creamy white enamel with
    black trim and a black stovepipe making a right angle on its way to the wall.
    The pilot lights were never relit while I was there, so I collected matchbooks
    from bars and restaurants, back smoking was permitted in those places. Being able
    to cook meals, to have a whole refrigerator, felt luxurious after the residential
    hotel in which I''d been unable to store and prepare food.


    I was poor. I scrouenged furniture off the street and clothes from thrift stores
    and warehouses from rummage sales; we valued old things then, and aesthetically
    this suited me. Most of what I owned was older than me, and I relinquished that;
    every object was an anchor to the past. I craved a sense of time, history, mortality,
    depth, texture that had been absent from my upbringing in the newly built suburban
    edge of the Bay Area with parents whose immigrant backgrounds left them little
    of lineage, few stories, no heirlooms. My work as a writer was sometimes going
    to be about restoring lost and forgotten paths to Western places.


    I found a small velvet-and-nailhead sofa at a rummage sale on my way to a demonstration
    in the Castro District; the gay men selling it for $10 kindly hauled it over and
    up the stairs after the protest was over. I left

