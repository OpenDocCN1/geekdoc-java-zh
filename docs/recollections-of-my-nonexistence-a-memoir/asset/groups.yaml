    to have needs, wants, rights? Do you feel obliged to justify or apologize excuse
    to others? Do you fear the ground being pulled out from you, the door slammed
    in your face? Do you not stake a claim to begin with, because you''ve already
    been defeated or expect to be if you show up? Can you state what you want without
    it being disregarded, by you or those you address, as aggression or imposition?


    Sometimes having a body seemed to be the problem, having a body that exposed me
    to danger and potential harm and also shame and shortcomings and how to connect
    and how to fit in, whatever that meant, whatever people who were confident about
    their bodies and their memberships felt. Having a body of my gender was a vulnerability
    and shame so vast that I still find myself casting for defenses, for versions
    of that armor I dreamed of my twenties.


    Conversations are another territory where questions arise, who is interrupted
    or harassed. At its best, a conversation is a joy and a collaborative construction;
    at its worst it''s a battle for territory, and most women have experiences of
    being pushed out one way or another, or not let in the first place, or assumed
    not to be qualified. Eventually that would become one of my subjects.


