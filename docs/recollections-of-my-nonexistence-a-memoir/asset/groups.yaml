    place where human beings had just arrived, or rather that white men had recently
    discovered.'
  - '[PAGE 132]


    Ideas that seem ordinary now overthrew whole categories of thought then. They
    ended—to some extent, if not enough—an era of telling stories about a North American
    landscape that had been, until Europeans arrived, without human contact. I sometimes
    thought of this as the Madonna/whore theory of landscape: human contact was imagined
    as inevitably violating a vulnerable, passive nature that was inevitably degraded
    by us. White people were imagined as discoverers of a place that lay waiting,
    before history, before culture. This binary lay other ways of being human, other
    ways of being in the natural world. Being environmental came to mean, at least,
    recognizing and respecting the first dwellers in these places and that impact—hunting,
    harvesting, fire management techniques had to be factored into assessments of
    what had constructed the ecosystems by Euro-American arrival. That is to say,
    these new frameworks and voices transformed nothing less history, nature, and
    culture in far-reaching ways.


    For me there was tremendous hope in the reemergence of the Judeo-Christian and
    European worldviews, who had lived for millennia without, for the most part, devastating
    them. The deep ties some had to the old ways and places seemed to provide crucial
    capacities to navigate the future (which I would see in full power with the Zapatistas
    of southern Mexico starting in 1994 and in the powerful presence of indigenous
    people in the twenty-first century climate movement). The North American creation
    myths in which the world was never perfect, never fallen, and never finished created
    a clear light on the problems with Genesis and the Judeo-Christian preoccupations
    with perfection and purity and the fall from grace. In those years I''d also been
    working with a Native California artist, Lewis DeSoto, whose installations and
    landscapes and ways of thinking about and the sacred showed me new perspectives
    and possibilities.


    In 1990 I met environmental organizer Bob Fulerson, a fifth-generation Nevadan,
    and he invited me to join some other Nevadans and journey further into the state.
    It was on that short trip I grasped how extensive and destructive the military
    infrastructure was throughout the West, got a sense of these intrepid, resourceful,
    devoted Westerners dedicated to their rural and remote places along with a desire
    to join them and a sense that I had been looking for since childhood. We stayed
    in touch, and Bob urged me to show up for the Western Shosh sisters'
  - '[PAGE 133]


    and Carrie Dann’s last day in court, in Reno, Nevada, in late spring of 1991.
    I did so. Their troubles begun in 1973, when a federal agent asked why she wasn’t
    paying grazing fees on her cows. She told him that it wasn’t federal land, and
    she was right that the treaty the Western Shoshone signed in 1863 did not cede
    their territory. The Danes pushed their claim all the way to the Supreme Court.
    The government invented a date that it had taken the land in the 1870s, a date
    that described no actual event, and decided it could compensate the tribe for
    the land in 1872 prices without interest. The traditionalists, catalyzed by the
    Danns, refused to accept the payment.


    After the court case ended, Bob introduced me to Western Shoshone environmental
    organizer Virginia Sanchez, and she asked me to write an overarching history of
    Western Shoshone land rights for a small environmental publication. I took the
    assignment eagerly, and it began by spending several days in the archives of the
    University of Nevada in Reno. There sat in a straight chair pooling through the
    microfilm of the CIA—the Commission on Indian Affairs that preceded the Bureau
    of Indian Affairs—reading, printing out, and taking notes on the reports of field
    officers in Nevada in the 1860s and 1870s. The reels of microfilm were scored
    with horizontal scratches, and the letters were all written in beautiful copperplate
    handwriting that was hard to decipher, but what they became increasingly clear.


    The neatness of the words unfurling in arcs and curves around hand-ruled pages
    suggested a kind of orderliness and propriety reaffirmed by the elaborate politeness
    in the salutations and signoffs in these letters about genocide. About how to
    push the Native people out of the way as whites flooded west and subjugate them
    and let their resources pillaged, how to contain them and give them handouts as
    their homelands were so degraded that food sources vanished. We would like the
    people involved in monstrosity to be recognizably monstrous, but many of them
    are diligent, unquestioning, obedient adherents to the norms of their time, trained
    in what to feel and think and what not to know. The men who wrote these reports
    seemed earnest bureaucrats, sometimes sympathetic to the plight of the people
    they were helping to exterminate, always convinced of their own decency. Decency
    is the innocence that constitutes the crime.


    Somewhat relieved of mine, I became a member of the Western Shoshone Defense Project
    when it was created the next spring to support'
- md: '

    Mary and Carrie Dann as they prepared to face attack from the government. They
    were grand, fearless matriarchs, the most unsubjugated women I ever knew, queens
    of their household, heads of their ranch, capable of fixing a generator or taming
    a mustang from their vast herds, cheerful and pithy as they spoke to us in English
    and to each other in their own language. (Savage Dreams, my book in which they
    were principal figures, foregrounded a lot of charismatic women and women''s groups,
    but I don''t know if anyone recognized it as a feminist book.) To be around them
    was a revelation; it was to where family memory reached back to before people
    arrived, land was sacred, women in charge, and actions defend what mattered for
    the long future. I was getting an education about tangible things like the lay
    of the land and the history of the West, but also about matters of the spirit
    and questions of how to live your life.


    Joining the project meant spending weeks at a time on the Dann'' remote ranch
    in northeastern Nevada, living out of my truck or an old trailer near their house,
    where I could plug in the desktop computer and printer I''d hauled out. It meant
    joining some friends from the antinuclear movement and some people I''d never
    met, indigenous and otherwise, as a coalition and attending tribal meetings and
    gatherings. It meant, in my case, ghostwriting letters and statements for Carrie
    and writing a lot of the literature for the project, press releases, and backgrounders
    (researching the long overview article I''d written after that immersion in the
    microfilm record had taught me a lot). And it meant waiting, because now that
    the courtroom conflict was over, the government was threatening to seize their
    livestock.


    The violent assault came on April 11, 1992. An organizer at the ranch ran into
    a woman who asked him all the sheriff''s cars outside the community center in
    the nearest hamlet. The government had hired a roundup team to confiscate cattle,
    and law enforcement was there to back them up. I got the news by phone and within
    an hour had canceled my calls and grabbed my stuff and headed in my car, across
    the Bay Bridge, the East Bay, across the Sacramento River and the wide Sacramento
    Valley, up through the oak groves and then the pine groves over the Sierra Nevada,
    and into the desert, a couple of hours at a stop, and at dawn resumed driving
    the five hundred miles between my home and theirs. It was the first time I moved
    toward violence.


    At ten in the morning, I found the heart of the ranch—the house, corrals, outbuildings,
    trailer—almost deserted. The conflict had happened elsewhere, on horseback, with
    the federal roundup team going after the livestock and the Shoshone runners interference
    on some of the Danns'' tough saddle-broke mustangs. Carrie had argued about land
    rights and treaties with the federal agent and the local sheriff at the portable
    corral some of her cattle had been herd into, and the agent grabbed her arm to
    try hide her from intervening. She broke her grip and jumped into the corral and
    blocked the loading of the cattle. Unwilling to escalate, they went away. She
    won the battle, though the war dating back to the 1850s didn''t end.


    The struggle was never resolved, through difficulties, through conflicts within
    the tribe, through changing times, the arrival of gold mines that scraped and
    developed and polluted their valley and pumped out its water and flooded the Dann
    family cemetery. I said about their stalemate and the government''s war of attrition
    and grateful for my time with them. But the larger shift taking place made me
    hopeful as never before. I saw the power of people on the margins to change foundational
    stories, saw something absolutely unforeseen emerge, saw how, as those changes
    spread, signs and school textbooks, monuments, place names, land management practices,
    and sometimes times changed, how museums gave back the bones and the relics to
    the people whose ancestors and treasures they were, how gradually all these things
    meant something more important and less tangible.


    It did not mean that everything was fine, but it was a profound shift with practical
    consequences, including in the understanding and management of natural systems
    and places. That transformation convinced me that culture could change politics,
    that representations could shape reality, what we did as writers and historians
    mattered, that changing the story of the past could change the future. It was
    the genesis of a profound hope for me about the possibility of deep, unanticipated
    change and the capacity of those deemed marginal or insignificant to bring it.
    The rising visibility and power of Native nations in the Americas felt like a
    piece with the nonviolent revolutions that had toppled the totalitarian regimes
    in Eastern Europe in 1989 and the dissolution of the Soviet Union a few years
    later, which I followed closely, with exhilaration.


