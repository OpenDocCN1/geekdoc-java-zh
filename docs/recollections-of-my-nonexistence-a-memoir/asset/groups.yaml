    The North Star is so far away from earth that it takes its light more than three
    hundred years to reach us, and even the light from the closest star takes four
    years. A book is a little like a star, in that what you read is what the author
    was passionately immersed in long before, sometimes only because of the time it
    takes a book to be written, edited, printed, and distributed. And often the time
    it takes to make a book means that it represents the residue of interests that
    preceded the writing. By the late 1980s new interests were eclipsing those that
    came before; I was engaged in a new way with ideas about nature and landscape
    and gender and the American West.


    This first book was about revisiting something significant that I had found years
    before. I focused on six artists—three from Southern California and three from
    the Bay Area—whose lives and work had also overlapped as they became friends and
    sometimes collaborators in the 1950s: Jess (who abandoned his surname when he
    left science for art and a life as an openly gay man when that was superhumanly
    bold thing to do), Jay DeFeo, Bruce Conner, George Herms, Wally Hedrick, and Bruce
    Berman. Each of them had chosen in various ways to lead a low-profile life, to
    find out what art could mean and what a life full of it could be and then making
    it and living it. Conner, Hedrick, and DeFeo had opportunities to go to New York
    and become stars, but they declined the opportunity.


    Their idealism was underlined by the affluence of the era and their outright,
    by flight that left cities full of cheap housing, and wages high enough that couples
    and families often lived off the income from one part-time job. Even in the 1980s,
    the kind of freedom to come and go, to stop paying the landlord for months and
    then find another pleasant place to live, to drop in and out of the economy seemed
    like the strange customs of an ancient free people. The artists I wrote about
    moved on the beat of Beat circles or passed through them, and the story often
    told about the Beats as a group of male writers from the East morphed into something
    larger and more interesting that included these visual artists and experimental
    filmmakers and the poets who were part of other movements, notably what got called
    the San Francisco Renaissance, including Jess''s life partner, Robert Duncan,
    Jack Spicer, and Michael McClure, who moved through many worlds.


    I learned from these characters before you can make art you have to have a culture
    in which to make it, a context that gives it meaning, and people from whom to
    learn and to whom to show your work. Through short-lived galleries, tiny magazines,
    screenings, poetry readings, friendships, they made culture happen among themselves—among
    not because they were exclusionary, but because they were excluded. I came to
    understand some general principles about how cultures evolve and shift and how
    migrate from the margins to the center. They overlapped with jazz musicians, rock
    bands, drug dealers, biker gangs, gay subcultures, social experiments, countercultural
    heroes. They had that camaraderie I still sometimes recognize in small towns and
    conservative communities, where the outsiders stick together their differences
    from each other are insignificant in the face of their differences from a hostile
    mainstream.


    Research is often portrayed as dreary and diligent, but for those with a taste
    for this detective work''s thrill of the chase—of hunting data, flushing obscure
    things out of hiding, finding the fragments that assemble into a picture. Your
    shards are stories, facts, manuscripts and letters, photographs, old newspaper
    clippings, the bound volumes of magazines no one has opened in years, something
    someone says to you in an interview they not said to anyone else that way. For
    my early books, I was amazed to have neglected topics to write about that seemed
    significant to me, and it came to feel like an advantage that I was in a place
    that had been so overlooked and dismissed.


    Some of my early research adventures were comic. When I was working on my thesis,
    I kept calling up the actor-director Dennis Hopper in New Mexico, hoping to talk
    to him Berman, and he kept answering cordially, saying he''d be happy to talk,
    but I could call back later, until, dozens of calls later, the phone blows alarm
    and gave up. I didn''t try again when I turned the project into a book, though
    he was living in Los Angeles, because I had been so terrified by his performance
    in the film Blue Velvet, but his assistant was helpful to me and got six prints
    from his original negatives—Hopper had been a talented photographer in his youth—to
    use in the book.


    I got even, from a bohemian with his dentures in whose little room spent a pleasant
    hour, a mumbled account and an unpublished photocopy of a letter friend sent him
    about the October 1955 Six Gallery reading that became famous because Allen Ginsberg
    read “Howl” aloud for the first time. The drama of that breakthrough for one poet
    overshadowed the proto-environmental poetry by Michael McClure and Gary Snyder
    read that night. The accounts generally said little about the location as well,
    as well as the artist''s co-op gallery where Hendrix was a principal, as well
    as the instigator of the reading. It was a delightful document that let me see
    how the event had felt to a participant before it and the official Beats it got
    mythologized.


    Nonfiction is at its best an act of putting the world back together—or tearing
    some piece of it apart to find what''s hidden beneath the assumptions or conventions—and
    in this sense creation and destruction can be akin. The process can be incandescent
    with excitement, whether from finding some unexpected scrap of information or
    from recognizing the patterns that begin to arise from the fragments begin to
    assemble. Something you didn''t know comes into focus, and the world makes sense
    in a new way, or an old assumption is gutted, and you try to write it down.


    In a way, this has my life''s work, the pursuit of patterns and the work of reconnecting
    what has been fractured, often fractured by categories that break a subject, a
    history, a meaning into subcompartments from which the whole cannot be seen. While
    there''s a kind of expertise that comes from microscopic focus, I would often
    pursue the patterns that reveal themselves across broad areas of space or time
    or categories. The art of picking out constellations in the night sky has cropped
    up again and again as a metaphor for this work.


    This was true to a degree of the subject of this first book, whose story had been
    largely missed by the linear narratives of art history, film history, and literary
    history. The relationship between film, poetry, and visual art, between drugs,
    esoteric and non-Western philosophies, political dissent, and queer culture, between
    members of a funky coterie that could be described as avant-garde were it not
    catalytic in a counterculture, was what mattered. My artists weren''t very well
    documented those oral history interviews, and they weren''t very visible, though
    most of them—particularly DeFeo and Connor—got a lot attention afterward.


    The artists’ own works were often a kind of collage, literally: of the six artists
    central to the book, Jess, Berman, George Herms, and Bruce Conner were known primarily
    for their collages and three-dimensional assemblages. Jay DeFeo was, like Wally
    Hedrick, primarily a painter, and one whose work often featured a powerful solitary
    form, but she who ventured into collage on many occasions, mixing painting and
    photography and found material. Collage makes something new without hiding the
    traces of the old, makes a whole out of scraps without erasing the scrappiness,
    emerges from an idea of creation not as making something out of nothing like God
    on the first day or painters and novelists, but as making something else out of
    a world already exploding with images, ideas, wreckage and ruin, artifacts, shards,
    and remnants.


    Collage is literally a border art, an art of what happens when two things confront
    each or spill onto each other, what conversations arise from the conjunction of
    difference, and how differences can feed a new whole. For these artists it also
    a poverty art, one of scavenged materials from the Victorian houses knocked down
    in the black neighborhood around them, the detritus of thrift stores, scraps from
    magazines. Conner even made his first films out of found footage because he couldn’t
    afford a camera, and then settled into this recontextualizing as his chosen genre,
    or mixed found and new footage to make films influential for their inventive editing
    and pacing.


    Putting together this picture of my part of the world as it existed not long before
    I arrived in it was a paradise of ideas and pattern recognition, perhaps more
    because it was the first time I had done so on such a scale. That I was getting
    to know the past of my own city and region meant that places I had passed through
    were acquiring new layers of meaning. I was writing about the world up to the
    point when I had been born into it, and it was foundational work for moving forward
    in that world. I was writing a cultural history that gave me my own part of the
    world significance and possibility I had not seen before. I becoming an expert
    on a subject, and that too had its rewards.

