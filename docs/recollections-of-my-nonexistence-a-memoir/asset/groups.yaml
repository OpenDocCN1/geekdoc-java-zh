    lurid deathtail or a dead female body was a standard plot device and an aesthetic
    object. Her annihilation was his realization. For the intended audience, it was
    apparently erotic, because in life women kept getting murdered in the course of
    sex crimes, and the fear of assault, rape, was also a fear of violent death.


    Which was a reminder that I was, we were, not the intended audience for so much
    art, including the stuff lauded as masterpieces and upheld as canonical. Sometimes
    the male protagonists protected women, particularly beautiful white women, from
    other men, and protector was one face of their power, but destroyer was still
    the other face, and either one put your fate in their hands. They protected what
    was theirs to protect or destroy, and sometimes the plot was about his grief that
    he''d failed to protect, and his revenge against other men, and sometimes he destroyed
    himself, and the story was about him.


    She died even before she was a corpse; she was a surface, a satellite, in accessory.
    In the violent death of a woman as a plot device in a story focused on a man was
    so common that women coined a term for it, "frid," after the 1999 website Women
    in Refrigerators documenting the plethora of gruesome endings for female characters.
    In the video gaming world, young women who criticized the misogyny in video games
    were for years harassed with death and rape threats. Some, after grisly and detailed
    threats of harm, had to leave their homes and take extraordinary security precautions;
    that is, they had to disappear. Protecting women from online surveillance, threats,
    and harassment became an avocation for feminist cybersecurity experts.


    As I write, there are new TV series about the horrific torture-murder-dismemberment
    of women. Flirts around the periphery of the torture-death of twenty-two-year-old
    Elizabeth Short in Los Angeles in 1947 that was given the ugly name "Black Dahlia
    murder"; or is the 1970s serial torturer, rapist, and murderer Ted Bundy, played
    by a handsome young star. It''s far from the first movie about Bundy, and the
    L.A. murder of Short has gotten a small publishing industry unto itself. When
    Given came out with a Dahlia Noir perfume, advertised with the slogan "the fatal
    flower," I wondered if it meant that women should aspire to smell like a mutilated
    corpse. But even the old ballads were full of murders and grievous bodily harm,
    as pop songs from Johnny Cash to the Rolling Stones to Eminem.


    Feminists of an earlier era insisted that rape is about power, not erotic pleasure,
    though there are men for whom their own power or a woman’s powerlessness is the
    most erotic thing imaginable. For some women too, we learn that our helplessness
    and peril is erotic, and accept or reject struggle with the sense of self and
    stories that come with them. Jacqueline wrote in 2018, "Sexual harassment is the
    great male performative, the act through which a man aims to convince his target
    not only that he is the one with the power—which is true—but also that his power
    and his sexuality are one and the same thing."


    Though each incident I experienced was treated as somehow isolated and deviant,
    there were countless incidents, and they were of the status quo, not against or
    outside it. Talking about it made people uncomfortable, and mostly they responded
    by telling me what I was doing wrong. Some men told me they wished someone would
    sexually harass them, because they seemed attractive people. No one offered the
    help of recognizing what I was experiencing, or agreeing that I had the right
    to be safe and free.


    It was a kind of collective gaslighting. To live in a war that no one around me
    would acknowledge as a war—I am tempted to say that it made me crazy, but women
    are so often accused of being crazy, as a way of undermining their capacity to
    bear witness and the reality of what they testify to. Besides, in these cases,
    crazy is often a euphemism for unbearable suffering. So it didn''t make me crazy;
    it made me unbearably anxious, preoccupied, indignant, and exhausted.


    I was faced with either surrendering my freedom in advance or losing it in the
    worst ways imaginable. One thing that makes people crazy is being told that the
    experiences they have did not actually happen, that the circumstances that hem
    them in are imaginary, the problems are all in their head, and that if they are
    distressed it is a sign of their failure, when success would be to shut up or
    to cease to know what they know. Out of this unbearable predicament come the rebels
    who choose failure and risk the prisoners who choose compliance.


    There was a feminist movement in full swing in the 1980s, with much to say about
    violence against women, even the Take Back the Night marches against it, but it
    was not within reach for me at the time. I was too young, too immersed in cultures
    out of keeping with that culture of what seemed like mostly older women, and they
    spoke a language I hadn''t learned. They were at a distance I would slowly traverse,
    after all this violence would make a solitary feminist of me. I wrote about violence
    against women in a cover story for a punk magazine in 1985, in art criticism and
    essays in the 1990s, in a chapter of my history of walking in 2000 detailing all
    obstacles women face in walking out the world.


    There''s a kind of indignation I know well, when someone feels that the wrong
    done has been unrecognized, and a kind of trauma that makes the sufferer in a
    compulsive storyteller of an unresolved story. You''ll tell it until someone lifts
    the curse by hearing and believing you. I''ve been that person with firsthand
    experiences sometimes, but something of that was what I felt about violence against
    women in general.


    Back when it was so personal, I was told to move to someplace more affluent (some
    of my most violent harassment occurred in such places), to get away, to be safe,
    but the violence followed me. It was a matter of geography, it was a matter of
    class, it was a matter of race, and it was a matter of being a woman in a world
    that didn''t want me to be. It was a matter of survival. It was a matter of identity.
    It was a matter of everything.

