    That spring Luc Santé’s scathing essay on Burroughs in the New York Review of
    Books made a deep impression on me. He quoted Burroughs as saying to an interviewer,
    “In the words of one of a great misogynist’s plain Mr. Jones, in Conrad’s: ‘Women
    are a perfect curse.’ I think they were a basic mistake, and the whole dualistic
    universe evolved from this error.” Santé wrote, “He associates women with the
    most repressive aspects of Western culture, and he has no sexual need for them;
    q.e.d., they are superfluous and impedimental. When the tricky problem of reproduction
    is eventually solved, women will be wished away.” Burroughs also shot Joan Vollmer,
    his wife, on September 6, 1951, and though there are conflicting versions of how
    and why he asked her to put a glass on her head for him so he could “play William
    Tell,” what’s clear that he pointed a gun at her and shot her through the forehead
    and she died.


    A young man I spent with in my twenties, my boyfriend’s younger brother’s best
    friend was more enamored of Burroughs than anyone else I knew, a lot of people
    I knew knew the old writer back in the day when he was seen as one of the godfathers
    of punk culture. The young man was gay, cut off from his Texas family, trying
    to find his way, a talented musician, but a devotee of the idea of the derangement
    of the senses through drugs the royal road to artistic genius. That derangement
    came from Arthur Rimbaud a century before and evolved into another fixture of
    counterculture, the idea that you got to your creative self by getting fucked
    up, that some genius is lurking behind the inhibitions and you just have to let
    the genius do out to this without discipline or structure.


    Burroughs was seen by the young people around me as exemplary of all this, and
    he had spent a lot of time taking a lot of drugs, buffered by a family allowance
    and an ironically constitution. The young man I knew had neither. I remember with
    affection one evening with him when he was hallucinating and wielding colored
    markers, trying to draw on paper (and album covers) and scrawling directly on
    the floor of my apartment. It’s with sadness that I remember him becoming more
    and more of a meth addict, and then a homeless person walking barefoot in dirty
    jeans on Market Street unable to recognize me. He was cared for by a kind older
    man for a while, and then I heard he jumped off the Golden Gate Bridge, a sweet
    and talented young soul, dead of many things, including the prevailing mythology.


    My editor and I went to the party at the Survival Research Labs industrial space
    under a freeway overpass in chiffon dresses. She was full figured, with long blond
    hair, and wore something beautiful and flowing with lots of cleavage; I wrote
    what I thought of my dead ballerina outfit. It had probably been a child''s dress
    and then molded for years in some basement before I found it in a thrift store.
    It had a tiny bodice with rows of yellow lace, strapless, though I''d improvised
    a strap out of one of the half-torn-off rows of lace, and a full, calf-length
    skirt made of shredding petals of gauzy fabric that hung down in points.


    I''ve often found that I want to live up to my outfit, and a festive outfit produces
    a festive spirit, and so she and I went shouting with laughter, flirting and weaving
    and waving our arms and wafting perfume and lipstick smiles and looking around
    freely with our painted eyes among the people who were standing about being so
    deadpan they seemed to have turned to stone. The man accompanying Burroughs was
    taking photographs moment when at his urging she and I came at Burroughs from
    either side and he shrunk into his already withered self in what appeared to be
    horror.

    I''ve always described him as looking like a slug between two saltshakers in that
    moment. It was very satisfying, and then we moved on.


    Writing is an art; publishing is a business, and starting my first book I was
    launching myself on a series of adventures with small and large publishers. The
    writing was me alone in a room with ideas, sources, and the English language,
    which went well, overall. The publishing was me negotiating with organizations
    that always had more people and more power and sometimes acted as my advocate
    and collaborator and sometimes as my adversary.


    One evening not long ago, my friend Tina and I went to see The Post at a little
    movie theater out in the west of San Francisco, the sky is darker and the wind
    is stronger and everything seems a little dreamer. The movie told two intertwined
    stories, about the Washington Post''s decision to report on the Pentagon Papers,
    the material leaked by Daniel Ellsberg to make it clear the Vietnam War was based
    on a lie, and the way that Katharine Graham, who had recently taken over as publisher
    when her husband died, simultaneously seized of her business and herself, sweeping
    aside the men who condescended to her as swept aside her own self-doubt about
    her qualifications to take power and make decisions with world-changing consequences.


    We enjoyed the drive, and the crisp night, and before that the popcorn and the
    mighty Republican decor and wardrobe of the cinematic Ms. Graham and the scenes
    of printing presses running. When we exited into a black night, I somehow found
    myself talking about my own struggles with publishing. It had been a long time
    since I recalled how bitter my early endeavors to put out books, in their own
    way, or rather fervently had sought to prevent me from publishing. I was lucky
    that I overcame the obstacles they erected, but I presume others did not. And
    now I can see how the world of publishing was and is, and that though some doors
    slammed because of my gender, others remained open because of my race.


    Some of the damage was funny in its own way. One day changed things at random
    in the manuscript of my first book, so the French artist Niki de Saint Phalle
    became Niki of Saint Paul, iconic to ironic, 1957 to 1967. The reason for this
    I do not know, but when I fought it was was treated as though I should take in
    stride. Another editor, I recall, wrote me a scathing note about that book’s inconclusive
    ending; he’d lost the last chapter of the manuscript, but the process of producing
    it dragged out an extra year because of my inexperience and inability to advocate
    myself against odd interventions like that.


    And then there was Lawrence Ferlingretti, the figure of that publishing house
    and enterprise. It is now more than thirty years since I signed a book contract
    with City Lights Booksellers & Publishers, and during those first years I was
    very often in the editorial offices in the back of the top floor the, a friend
    of some of the staff, and occasionally a reader at events. These decades Lawrence
    Ferlingretti, who floated around there regularly has never spoken a word to me,
    including under circumstances where speaking to me would be the thing to do. I
    was never sure whether it was that he wouldn’t or he couldn’t. Sometimes I thought
    that he might possess a sort of Venn diagram in which City Lights authors or historians
    were not a group that intersected with, so that I was categorically nonexistent.


    Once, I had been working with City Lights for more than two years, Ferlingchetti
    came with City Lights’ editor in chief to a book party I helped organize for my
    friend Brad Erickson. A week later Brad and I met at City Lights and Ferlingretti
    came down the little staircase next to the famous bookstore’s front door and looked
    at the two of us, one he had met once briefly, one was publishing and had crossed
    paths with dozens of times over the past few years, and said to us, “Hi, Brad.”
    I didn’t particularly want to pals with him, but it is normal for your publisher
    to say hi to you.

