    ## 战时生活


    ![](img/db14ca6438d37a021682af27273dff1e_30_0.png)


    搬进公寓没多久，一位朋友给了我一张书桌，那是一个女性的小写字台或梳妆台，我现在正坐在它上面写作。这是一件精致的维多利亚风格家具，有四个窄抽屉，两侧各两个，在坐人腿部所在的凹槽上方有一个较宽的中央抽屉，还有各种装饰——榫接的腿，每条腿都有膝盖状凸起装饰，抽屉底部有贝壳纹，抽屉拉手形似流苏或泪滴。


    在她送给我这张书桌的一的一年前，我的朋友被一个前男友捅了十五刀，以此惩罚她离开他。她几乎血死；她接受了急输血；她身上留下了长长的疤痕，我当时看到这些伤痕却没有任何反应，因为当我在家里习惯了暴力，也许某种感知能力被麻钝了，也许是因为这本是我们应该习以为常并表现得若无其事
    own，但我们本该有语言来讨论这种暴力，本该有一个准备好倾听的听众。


    她活了下来；她被指责导致了这一切，因为当时的受害者往往是这样；那个准谋杀者没有任何法律后果；她搬离了事件发生地；她为一个被赶逐的单亲妈妈工作，对方用这张书桌抵了薪水；然后她把它给了我。她离开了，我们断了多年联系，后来又重新建立了联系，她告诉了我完整的故事——一个让你心如火烫、世界结冰的故事。


    有人曾试图让她闭嘴。然后她为我的发声提供了一个平台。现在我想知道，我写过的所有东西是否都是对那种试图将一个年轻女性化为虚无的尝试的反击。这一切字面上都源于桌面这个基础。


    坐在桌前写下这些时，我查了公共图书馆维护的城市在线摄影档案，希望能回想起一点旧街区的样子。那是1958年6月18日我居住过的那条街的第四张照片，距离一个街半之远的地方，说明文字上写着：“里昂街438号巷口，好奇好奇的路人。今天发现了22岁的丹娜·刘易斯（Dana
    Lewis）的尸体，除一件黑色胸罩。警方在初步检查后表示，受害者脖子上的青紫表明她可能被绳子勒死。” 显然，她的死是报纸的奇观，因为路人被描述为“好奇”，而不是对尸体感到“痛苦”。


    水员


    她也被称为康尼·苏布莱特（Connie Sublett），事实证明她的死当时引起了报纸的关注。大多数报道将其归咎于她，因为她是一个性生活活跃且嗜酒的波西米亚年轻女性。一个标题写道：“水员描述随机杀戮”，并贴上“玩女受害者”的标签。另一个标题写道：“杀戮终结了玩女的生活”，这种猥琐的措辞意味着她有性行为、冒险和忧愁，而“玩女”意味着她是自应如此。她的年龄被给出二十岁或二十四岁。据说丹娜·刘易斯或康尼·苏布莱特的前丈夫住在里昂街426号，当她的男朋友（一名音乐家）在派对上坠楼后，她去那里寻求安慰。


    阿尔·苏布莱特不在家或没有接电话，所以他在前门阶上哭泣，直到房东让她离开。根据他自己的说法，一个水员提议为她打车，结果杀了她。报纸似乎相信了他的话，认为杀戮是一场意外，虽然她对失去感到痛苦万分，但她同意在巷子里和他发生性关系。一个标题写道：“水员杀害比女孩”，尽管把人推至死亡是寻找爱情的常态。“她的眼睛里闪烁着星星，总是想出发，”她的前丈夫说。艾伦·金斯伯格（Allen
    Ginsberg）拍过阿尔的照片，但没有拍过康尼·苏布莱特，他在1958年6月26日写给杰克·凯鲁亚（Jack Kerouac）的信中毫无评论地提到她的死。她为人知，但几乎无人提及。


    我不知道里昂街438号发生了什么，但我知道诗人兼回忆录作家玛雅·安格尔鲁（Maya Angelou）在青少年时期离这里东北方向不远，就在在她八岁时反复遭到强奸后长达五年的沉默结束不久。我还知道离我住的金门大道1827号几街之遥的公寓，1974年，十九岁的报纸继承人帕蒂·希斯特（Patty
    Hearst）在被共生解放军（一个规模小、幻想的准革命组织）绑架后，被装在一个30加仑的垃圾桶进了那里。她证词说，她在这里及之前的地点的一个衣橱里被蒙眼捆了数周，并被两个绑架者强奸了。这两个故事都进入了新闻。但大多数故事从未进入，或者它们只是后版页的小条目。


    但我坐的这张书桌，是一个曾被男人谋杀的女性给我的，它似乎讲述了在一个社会中成长的意义——在这个社会里，许多人希望像我这样的人死去或沉默；我是如何获得声音的，以及何时到了该使用那个声音了——当我独自坐在桌前，通过手指无声地诉说时，那个声音最为清晰——试图讲述那些未曾诉说的故事。


    我坐的这张书桌，是一个曾被男人谋杀的女性给我的，它似乎讲述了在一个社会中成长的意义——在这个社会里，许多人希望像我这样的人死去或沉默；我是如何获得声音的，以及何时到了该使用那个声音了——当我独自坐在桌前，通过手指无声地诉说时，那个声音最为清晰——试图讲述那些未曾诉说的故事。


    我坐的这张书桌上的回忆录，是一个曾被男人谋杀的女性给我的，它似乎讲述了在一个社会中成长的意义——在这个社会里，许多人希望像我这样的人死去或沉默；我是如何获得声音的，以及何时到了该使用那个声音了——当我独自坐在桌前，通过手指无声地诉说时，那个声音最为清晰——试图讲述那些未曾诉说的故事。


    我坐的这张书桌上的回忆录，是一个曾被男人谋杀的女性给我的……（还有许多人）


