    basement had other lessons to impart: it contained some art that would probably
    never be shown again—paintings and other items that had seemed significant in
    their time but been written out of history or never written into, odd trends and
    faded heroes, movements that had lost their sheen, detours from the official road
    of art history, a windowless room of orphans and exiles.


    I also spent years in the hushed room full of files from the era of Grace McCann
    Morley, the museum''s inspired, forgotten founding director, and it was then I
    fell in love with archives and the task of assembling a history out of fragments.
    I noticed a drawing by Matisse in a letter to her and had it moved from correspondence
    files to the art collection. I wandered through the history of many artworks as
    a traveler, learning the world around them, coming to recognize landmarks I could
    return to. I worked on a painting by the German expressionist Franz Marc—a mountainscape
    he had repainted after he''d been to Paris and seemed the new thing that was cubism:
    I had it X-rayed to show the old painting underneath, and I found the data to
    change the title. To play a role in the writing of art history, even with this
    one act, was electrifying.


    Since Morley, all the directors of that museum had been men, but a few ranks below,
    women seemed to run everything. I worked under a kind woman out of a tiny office
    in the library who taught me my job, and I wandered wandered to consult the dashing,
    gray-voiced longtime librarian Eugenie Candau in her own office, and sometimes
    scourenged from her wastebasket the exhibition postcards she discarded. It was
    ravenous for. It was a second education as valuable and formative as the one I
    was getting across the bay at the university.


    One day I saw a work of art by Los Angeles artist Wallace Berman that captivated
    me. It was a grid repeating an image of a hand holding a transistor radio bursting
    out of the radio’s speaker, a piece about pop culture and mysticism with few Hebrew
    letters scattered on it. In my naïve, I went to find the book I assumed existed
    on this extraordinary career. There wasn''t one, though there was a slender exhibition
    catalogue surveying his work. I didn''t know yet that I would write that book,
    or a version of it, some years later. I picked Berman as the subject for my thesis,
    though it was unconventional for a journalism student to focus on something so
    far from the news and the realms of news. Berman had died in 1976, having destroyed
    the recording of the only interview'
  - '[PAGE 83]


    known to have been conducted with him, so there was a lot to reconstruct from
    archives and interviews with members of his circle. The coincidences that led
    me to the museum that led me to the image that led me to the project make me grateful
    for my failure at opening wine bottles.'
  - '[PAGE 84]


    Though I was browsing at City Lights bookstore and researching the Beat poets
    for thesis, and interviewing some of them, I encountered my fellow San Franciscan
    Diane di Prima’s work only later, including her declaration “You cannot write
    a single line w/out a cosmology.” Writing is often treated as a project of making
    things, one piece at a time, but you write from who you are and what you care
    about and what true voice is yours and from leaving all the false voices and wrong
    notes behind, and underneath the task of writing a particular piece is the general
    one of making a self who can make the work you are meant to make.


    It formalizes the process everyone goes through, making the self who will speak,
    of settling on what values and interests and priorities will shape your path and
    your persona. You have to find out what kind of tone you are going to take, how
    you pitch your words, whether you’re going to be funny or grim or both. Often
    what emerges is not what you intended; it turns out you’re someone who also has
    others to say and other ways to say them (what gets called “a voice” is at the
    outset some person you don’t know well arriving at the front door with a different
    focus and tone than you expected). You discover what ethics are implicit or explicit
    in how you describe the world, what ideas of beauty you are pursue, style and
    tone behind which lies a question of self.


    I went back to Prima’s declaration in her famous “Rant.” Further down, the poem
    continues:


    +   There is no way out of the spiritual battle

    There is no way you can avoid taking sides

    There is no way you can not have a poetics

    no what you do: plumber, baker, teacher

    You do in the consciousness of making

    nor making yr world


    The voice that came out of when I spoke in social settings and often even to a
    single friend wore a thousand pounds of armor and was incapable of saying anything
    direct about emotions, which I was barely feeling or through so many filters I
    hardly knew what was spinning me around. But the voice: it was the voice I’d grown
    up around and learned to emulate and then to promulgate, a voice that strove to
    be clever, cool, sharp,'
  - '[PAGE 85]


    and amused, to shoot arrows with precision and duck the arrows that came back
    and pretend they hadn''t stung. It relied on jokes and quips that were often cruel
    in a game where anyone was hurt or offended by those jabs was supposed to be lacking
    in humor or strength or other admirable qualities. I didn''t understand what I
    was doing, because I didn''t understand that there were other ways to do it, but
    that didn''t mean it wasn''t spirited at times. (Later, I discovered that scathing
    and mocking reviews were the easiest and most kind to write, but I tried to write
    them only about much-lauded successes.)


    There was another kind of humor, or rather a ponderous wit, that was convoluted,
    full of citations and puns and plays on existing phrases, of circling around,
    far around, what was happening and what you were feeling. It was as though the
    more indirect and referential your statement, the further away from your immediate
    and authentic reaction, the better. It would take me a long time to understand
    what a limitation clever can be, and to understand how much unkind damaged not
    just the other person but the possibilities for yourself, the speaker, and what
    courage it took to speak from the heart. What I had then a voice that leaned hard
    on irony, on saying the opposite of what I meant, a voice in which I often said
    to one person to impress other, a voice in which I didn''t really know much about
    what I thought and felt because the logic of the game determined the moves. It
    was a hard voice on a short leash.


    That voice isn''t just in your conversations, it''s inside your head: you don''t
    say that hurt, or I feel sad; you run angry tirades about why the other party
    is the terrible person over and over, and you layer on anger to avoid whatever''s
    hurt or frightened underneath, until it''s certain that you don''t know yourself
    or your weather, or that it''s you''re telling the story that''s feeding the fire.
    You generally don''t know other people either, except as they impose on you; it''s
    a failure of imagination going in reaching out.


    But that was just the stories within. The stories I wanted to write and the person
    who would write them were not yet born. I knew who I admired, not who I was. You
    cannot write a single line without a cosmology. I had so much work ahead of me,
    and I did it slowly, in stages. I was many different writers along a road on which
    my various books and essays are milestones or shed snakeskins on a road. In journalism
    school I learned to write straightforward reports, though my first teacher resented
    my inability to write the flat prose that was often taken for journalistic objectivity,
    even then I saw'
  - '[PAGE 86]


    as a masculine voice. I could keep opinions at bay if I tried hard, but not adjectives.


    The television show Dragnet, which was old even then, opened every episode with
    a hard-boiled man’s voice flatly declaim, “The story you are about to be true.
    The names have been changed to protect the innocent.” It was like the prose of
    Ernest Hemingway, which my first college English professor had insisted was the
    pinnacle of good writing, that stripped-back, clipped, tense language that was
    also about masculinity and its parsimonious words packed in silences. It was a
    voice policing many things, and leaving a lot unsaid in the same way the ironic
    poses favored by my family did. The tone that we were supposed to deploy as journalists
    sounded to me like that tone, at least that we were allowed to quote people who
    might be more expressive and emotional.


    I wanted language that could be simple and clear when the subject required it,
    but sometimes clarity requires complexity. I believe in the irreducible and in
    invocation and evacuation, and I am fond of sentences less like superhighways
    than winding paths, with the occasional scenic detour or pause to take in the
    view, since a footpath can traverse steep and twisting terrain that a paved road
    cannot. I know sometimes what gets called digression is pulling in a passenger
    who fell off the boat. I wanted English to be an instrument on which many kinds
    of music could be played. I wanted writing that could be lavish, subtle, evocative,
    that could describe mists and moods and hopes and not just facts and solid objects.
    I wanted to map how the world is connected by patterns and intuitions andsemblances.
    I wanted to trace the lost patterns that came before the world was broken and
    find the new ones we could make out of the shards.'
