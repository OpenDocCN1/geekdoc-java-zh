    detailed threats of harm, had to leave their homes and take extraordinary security
    precautions; that is, they had to disappear. Protecting women from online surveillance,
    threats, and harassment became an avocation for feminist cybersecurity experts.


    As I write, there are new TV series about the horrific torture-murder-dismemberment
    of women. Flirts around the periphery of the torture-death of twenty-two-year-old
    Elizabeth Short in Los Angeles in 1947 that was given the ugly name "Black Dahlia
    murder"; or is the 1970s serial torturer, rapist, and murderer Ted Bundy, played
    by a handsome young star. It''s far from the first movie about Bundy, and the
    L.A. murder of Short has gotten a small publishing industry unto itself. When
    Given came out with a Dahlia Noir perfume, advertised with the slogan "the fatal
