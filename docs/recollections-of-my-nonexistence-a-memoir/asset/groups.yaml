    When my book appeared in 1991, Coplans had a lawyer write a letter to City Lights
    accusing me of libel. Wally Hedrick, one of the six central subjects of that first
    book, had painted American flags starting in 1953, and one or another he''d lost
    or destroyed all the paintings that''ve had some minor status as landmarks of
    American art, since New York painter Jasper Johns was famous for painting American
    flags slightly later. (He painted a lot of them to protest the Vietnam War.) One
    of Hedrick''s paintings, I wrote in my book, "survived until 1963, when (according
    to Hedrick) the art critic John Coplans borrowed it from a ten-year survey of
    Hedrick''s works and never returned it. He had asked to bring it to a woman interested
    in buying it, and the work has never been seen since.


    Coplans claimed that not only did this make him out to be a thief, that he''d
    never met Hedrick. As I recall the lawyer''s letter suggested that if we destroyed
    all copies of the book, no further action would be taken. The desire to casually
    annihilate the years of work and the moment of arrival that a first book represented
    was stunning. It didn''t help that, so far as I could tell, the editor who received
    the letter seemed to think it plausible that I had gotten my facts gravely wrong.
    I rarely seemed to be regarded as in possession of much competence and credibility
    in those days, whether it was a personal interaction or about history.


    I''m still in the habit of amassing evidence to back me up, and what I did: I
    went to the SFMOMA museum library and photocopied a pile of material about the
    two men'' published conversations and collaborations back in the day. My editor,
    I believe, forwarded the material to the lawyer. All the copies of my book were
    not destroyed, though it had a very quiet life and is now out of print. One of
    the two write-ups attributed authorship of the book to poet and critic Bill Berkson,
    who''d written a very gracious preface, opening with a quote by Mina Loy: "The
    common tragedy is to suffer without having appearing."


    In 2008 I wrote an essay called "Men Explain Things to Me" that contains the sentence
    "Credibility is a basic survival tool." In a way, credibility is also my profession
    or at least part of the necessary equipment of any writer of nonfiction. I had
    to fight for it in the beginning. That is, I had to fight to convince others,
    in both personal and professional life, to grant me the capacity to perceive events
    with a reasonable degree of accuracy, and the frequency of this experience sowed
    self-doubt in me, so the struggle was not only with others.


    It is not always possible to say that a given weather event is due to climate
    change, but climate change shapes the trends are clear, and the same can be said
    of discrimination—that this particular event or may not be due to someone''s attitudes
    about people in your category, but the cumulative effect suggests a pattern. Looking
    back now, it seems that I had not lived in a culture where the threats against
    me were real and pressing and the disdain of those writers women who were so lionized
    in my youth wasn''t so scorching, then these actions against me might have seemed
    a series of unfortunate, unrelated incidents.


    My second book was a very different book, and it had an auspicious beginning:
    I sent a proposal on a Monday in 1991 to Sierra Club Books, was called by an editor
    on Tuesday, and met with him on Wednesday. The book came soon afterward. I sold
    my battered Datsun B210 and spent part of $12,000 advance on a used white Chevy
    S10 pickup truck with a camper to better pursue my across the West. My life changed
    while I was writing Secret Exhibition, and if that first book laid the foundation
    for me to understand recent and local history just before my era, this second
    book would be a broader and deeper inquiry into the American West and its myths,
    wars, blind spots, wonders, criminals, and heroines.


    This book, Savage Dreams: A Journey into the Hidden Worlds of the American West,
    was about invisibility permits atrocity. The war at the center of the book''s
    first half was at the Nevada Test Site, where the nuclear wars generally regarded
    as a terrible thing that might happen someday were in fact happening at the rate
    of about one nuclear bomb detonation a month from 1951 to 1991, more than a thousand
    in all, with direct impact on the local environment and the human beings undoubt.
    The second half of the book was about Yosemite National Park, where the Indians
    widely regarded as something bad that happened long ago were going on in the present
    by other means Native people who had not, contrary to what was conventional belief,
    disappeared, vanished, the end of the trail, set off into the sunset, or been
    the last of their kind. Native people had been rendered invisible by representations
    or rather nonrepresentations—in signage, in the more visible of its museums, in
