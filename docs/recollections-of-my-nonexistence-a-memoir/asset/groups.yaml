    Lacey）和普鲁·罗威尔德森（Pru Rowlandson）。


    感谢经纪人弗朗西斯·科迪（Frances Coady），她是鼓励者，也是这本书的第一位读者。感谢现在的许多朋友——Marina、Astra、Sam、Leigh、Tina、Ana
    Teresa、Catherine——特别是查尔斯（Charles），在写这本书的整个一直与我并肩，分享茶和更多。


    感谢所有证明了故事可以改变世界的女性，她们改变了那个建立在无止境沉默之上的旧有宏大叙事；感谢在社交媒体、公共论坛、对话、新闻、书籍和法庭中无数的讲述者，他们用声音打破了那种沉默，从而为其他声音的被听留了空间，也许在他们也成为拥有可怕故事要说的幸存者之前。


    感谢女性主义。感谢交叉性。


    致敬给所有生灵的解放。


    # 关于作者


    丽贝卡·索尔尼特（Rebecca Solnit）是二十多本书的作者，包括《迷失指南》（A Field Guide to Getting Lost）、《远方的近邻》（The
    Faraway Nearby）、《地狱中的天堂》（A Paradise Built in Hell）、《阴影之河》（River of Shadows）以及《漫游：徒步史》（Wanderlust:
    A History of Walking）。她还是《男人总是爱解释一切》（Men Explain Things to Me）以及许多关于女性主义、行动主义、希望和气候危机的文章的作者。她是加州教育系统从幼儿园到研究生阶段的产物，《卫报》（Guardian）和《文学枢》（Lit
    Hub）的常驻撰稿人。


