    In those days I often headed my emails to Tina with weather reports, since she
    had moved far away for a teaching position and missed the Bay Area. We had been
    writing almost daily for years, and sometimes times a day. On March 24, 2008,
    we''d been continuing the back-and-forth on an email from March 20 that I''d headed
    FULL MOON, EQUINOX, PRETTY DAY BUT CHILL. That evening of March 24 I''d written
    her with a new heading, LONG


    FAINT HERRINGBONE CLOUDS BEFORE DUSK.


    Two years before, I had left the studio apartment for a more spacious dwelling
    six blocks down. My friend Marina had just moved in with me there, in flight from
    an awful soon-to-be-ex, and I was delighted to be with me. By the time of the
    alarming diagnosis I received that winter, we were close friends. The diagnosis
    meant major surgery a few weeks before this time, so we were nestled in, convalcing,
    in our own way. She was one of those people with whom a conversation opened upumbles
    and flows of its own accord, with jokes and laughter mixed with explorations of
    ideas and events, aspirations and emotions, the conversations I dreamed of.


    A friend to talk to in person, a friend to write to every day. It was a hard time,
    and we were grumbling in the email to Tina, but I had reached a point where my
    social life was all that I could desire. Marina, who usually had a birdlike brightness
    of eye, a vivacity and an exceptional emotional warmth, as well as a brilliant
    political mind, had been subdued after her separation until evening of the long
    faint herringbone clouds. Thanks to the email (Tina also liked food descriptions),
    I knew I''d made us dinner of pasta, artichokes, and greens from the Civic Farmers''
