    跳房子：向后退一步，再次走过同样的土地。1987年年初，我的父亲在地球另一侧的旅行时去世了，随着他的离世，我终于变得足够安全，可以稍微解冻，并开启那些被封闭的心扉。我终于开始对很久以前的事情产生情感反应，仿佛它们是曾冻封在那个荒凉早年冰层里的某种东西，因为我终于能按照自己的标准将那些事件归类为残忍和错误。那年晚些时候，我的长期男友搬到了洛杉矶，我的其他家人对我来说格外难以相处，我靠着离开艺术杂志后被裁员的失业金、一些积蓄、在当地杂志发表评论和散文赚取的微薄稿稿费，以及在市里各企业做的办公室工作维持生活。


    我决定，当你变得无可失去时，你就变得无所畏惧，而我想要自由做的事，是写一本关于我发现的那个社区——多年前我在撰写关于华莱士·伯曼（Wallace Berman）的毕业论文时，我结识了社区的许多成员。我向灯塔出版社（City
    Lights Books）提交了一份书稿提案并于1988年初获得接受，我拿到了第一笔1500美元的书稿预付款。自从写完第一篇关于反对婚姻的一级散文后，我就一直想写书，因为我比任何事物都热爱书籍，因为我将它们视为一种实用的魔力，而接近这种魔力的唯一途径就是阅读和书写它们。我想与文字打交道，看看它们能做什么。我想收集碎片并将它们置于新的图景中。我想成为那个超脱的、世外世界的完全公民。我想为书而活，活在书中，为书存在。


    当它在我的童年、青少年和大学时期遥不可及时，这是一个美好的目标，或者说是一种取向；但当真正要去做时——唉，远山虽美，但脚下的山路陡峭。成为一名作家使成为人的某种本质变得形式化：弄清楚要讲述什么样的故事、如何讲述，以及你与这些故事的关系——是选择选择了故事，还是故事选择了你，以及你周围的人决定了什么，你要听听他们的多少，又要听听其他更深层、更远的事物的多少。此外，你必须写作。到那时，我已经发表了许多散文和评论，以及一本书——这种感觉就像是从盖工具房搬到了宫殿。


    我的第一本书始于1982年某日在旧金山现代艺术博物馆办公处旁的一面墙上看到的那件作品。那是华莱士·伯曼的一幅方形黑白拼贴，由十六幅图像组成的网格：是一只手拿着晶体管收音机，四行四列，每次都是那只手和那个收音机，但收音机扬声器的位置对应着不同的图像。图像中有人体，包括一个裸体、一名橄榄球运动员、一个可能是甘地的瘦弱身影、一只人类耳朵、一只倒挂的蝙蝠、一支注射器、一把枪，以及底部底部两次同义词的蛇。它们是负片图像，因此一切看起来都带点梦幻。仿佛每幅图像都是被转化成视觉的声音，仿佛每一幅都是一个信息、一个警示、一个宣告或一次启示。或者是一首歌。黑色背景上写着的几个希伯来字母强调了神秘与奥秘与流行文化并存，暗示某些旧日的氛围是不必要的或幻幻的。它是用一种名为Verifax的早期复印机制作的。标题是《沉默系列之10号》。


    伯曼像我父亲一样，是犹太移民后代，在洛杉矶长大。与我父亲不同，他身材瘦削、细腻，选择在社会和经济的边缘生活，最初是在洛杉矶的摇摆和爵士界，在神秘主义者、辍学少年、艺术家和反叛者之中。正如他预言的那样，他在五十岁生日时去世——1976年那个晚上，他开着跑车在洛杉矶边缘峡谷的一条蜿蜒狭窄的路面上去生日派对时，被一名醉酒驾驶员卡车撞中。在1957年因第一件作品涉猥亵罪起诉后，他选择了低调。我给这本书起的原名是《在阴影中摇摆》（Swinging
    in the Shadows），取自他写给画家杰·德费奥（Jay DeFeio）的一张明信片，在信中他告诉她去赚点钱，然后再次回到阴影中，但我的出版社否决了我的建议。


    为了这篇论文，我从周围的人的话语、艺术带给我的信息、从档案和旧历史、展览目录以及人们手中仍留有的旧明信片和信件中，拼出了伯曼的一生。在此过程中，我意识到许多事情，包括20世纪50年代有一支被官方历史忽视的加州前卫派，那是一系列涉及电影、诗歌、视觉艺术、神秘和非西方精神传统与实践，以及致幻药物的小圈和社区。这种前卫派催生了60年代的反文化，一个实验、反叛和重塑的领域。这就是我想写书的主题，不是某一个艺术家，而是一个艺术家群体。


    那时，文化史被认为是一项线性的事业，先在欧洲展开，然后在纽约展开，而加州是一个被鄙视的后方，一个被认为没有发生过什么大事的地方。有人嘲笑我一位在耶鲁写西部历史论文的朋友说：“加州人不看书，”仿佛山山里的所有诗人、城市里的所有学者，以及从东南南部沙漠到西北部雨林、使用九十九种加州本土语言的讲故事者，都归结为一句话。那时，文化史本该是一项线性的事业，先在欧洲展开，然后在纽约展开，而加州是一个被鄙视的后方，一个被认为没有发生过什么大事的地方。有人嘲笑我一位在耶鲁写西部历史论文的朋友说：“加州人不看书，”仿佛山山里的所有诗人、城市里的所有学者，以及从东南南部沙漠到西北部雨林、使用九十九种加州本土语言的讲故事者，都归结为一句话。


    （注：此处原文中存在重复段落，根据指令，译文已按“注意一定不要重复输出原文”的要求进行了去重处理，仅保留翻译逻辑内容。）

