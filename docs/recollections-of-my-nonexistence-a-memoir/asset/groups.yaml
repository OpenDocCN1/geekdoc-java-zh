    ……否则，我们的游程充满了空白和死角，如果我们早知道他在做什么，我们本可以自己填补这些。我认为《野蛮之梦》（Savage Dreams）是一本重要的书，或者至少一本试图用新视角审视重要且紧迫之事的书。（遗憾的是，它的标题源于一个名叫詹姆斯·萨维奇的魅力怪物，他为了追逐淘金利润，在约塞米蒂地区发起了种族灭绝战争。）


    如果有人能听我的话，我开始大声地怀疑他，他的恶意或无能可能不会产生这样的影响。在出版业的最初几年里，我一直在撰写历史，并且像年轻女性经常那样，被认为并不特别擅长见证日常互动。我在公共场合阅读，却无法让出版商听到我的声音。那天晚上在看电影后和蒂娜在一起时，当我告诉她科普兰等人的事情时，我第一次意识到，那种感觉有多像我几年前在街头遇到的那种温柔、脱离肉体的毁灭率。这些事件似乎在告诉我，那不是我的位置，而我的声音将不会被听到。


    现在，我觉得很庆幸在互联网、更不用说社交媒体之前经历了这一切，那时还没有恶意是按性别和种族分布的，也不知道大量的集体在线劳动被用来让那些非白人、非男性、非异恋或非跨性别者显形并消失。他们并没有被完全沉默，他们为拥有话语权支付了这种税金——当他们付出额外努力去克服那些维持不平等的障碍时。在几次，当我目睹人们试图在社交媒体上煽动针对我的仇恨活动时，我在想，如果他们从从初就尝试这样做，而不是在我进入出版界多年之后，他们的努力可能会产生更难以忽视或忽略的影响（尽管也许我并不会忽视，我也一直在公开发布我在出版界遇到的奇特遭遇，并在那里找到了共鸣）。


    我们大多数听到的是那些度过困难或突破障碍的人的故事，而他们做到的事实通常被用来暗示困难或障碍并不严重，或者“杀不死你的会使你更强大”。并不是所有人都能挺过来，那些试图杀死你并消耗了你大量精力的事情，也许可以用在其他地方，而不是那些让我疲惫和焦虑的事情。写作和出版的过程比任何其他事情都更让我相信了自己的公信力和判断真伪与公正的能力，也正是这让我有时能够为自己、或为他人发声。


    通常，当一个女性说她或女性身上发生了坏事，而作恶者是男性时，她会被指责为仇恨男性，尽管这些事件的现实并不重要，重要的是她负有无论如何都必须阳光的义务；就好像“并非所有男人都很糟糕”这一事实超过了“某些人以影响她的方式变得糟糕”的现实。通常，一个女性说的话，取决于这让她变成了什么样的女人，以及她是否仍然迎合他人，而不是取决于其事实内容。我的二十岁有一个非常非常男朋友，他从我二十一岁生日一直陪我到二十岁末；还有我的弟弟，他带我加入了他的活动，并支持我的工作，我的工作与这种活动变得日益紧密。还有同恋男性，作为朋友，也是我居住城市里巨大的文化力量，以及作为男性可能意味着什么的其他榜样。以及作为人类可能意味着什么。


    每天，杰伊·德费奥（Jay DeFeao）都在遭受肺癌的折磨，这种疾病将在1989年晚些夺了他的生命，多年后告诉我他会给吉尔伯特打电话。


    “艾，你在穿什么？”她会问他。我记得他模仿她的声音是那么温柔、空灵，漂浮在她香烟的烟雾中，或者漂浮在她用旋转的炭线条画出的物体轮廓中。艾，旧金山领先艺术廊之一——Pau
    Anglin 画廊（现更名为 Anglim Gilbert 画廊）的经理，他会描述那一天衣装的华丽，然后她会说：“谢谢，我感觉好多了，”然后挂了电话。他们一次又一次聊天，几乎每天都是，尽管她拒绝了，而每一次她似乎都从中找到了快乐。


    他皮肤金黄，头发剪得很短，他华丽的身姿总让我想起那些光滑而强大的奥斯卡奖像。他的衣橱非常庞大，装满了小众和当地知名设计师设计的优雅服装，以及复古单品，这些装扮带有幽默和嘲讽，能与许多色彩的华丽服装搭配，并配有相应的鞋子。沉思着穿着装束的艾这一奇迹，我开始意识到，尽管看起来很完美通常被认为是一种轻微的、渴望的自恋，或者是


    近距离地，庆祝并批判，而规则（大多数时候）在黑暗中是静止的。


    正如你可能为你城市的建筑或团队感到自豪一样，我想我们这些异性恋者在当时对同性恋群体感到自豪，并乐于感到很有多识——[等待，重新梳理逻辑]


    这些男人明确了，我在异性恋男性身上感到困扰和沮丧的并非性别天生的，而是构建在角色之中的。正如直接行动小组在90年代初散布在小城各地的贴纸上所说：“是什么导致了异性恋？”


    （后续内容为重复乱码，已按指令要求处理）

