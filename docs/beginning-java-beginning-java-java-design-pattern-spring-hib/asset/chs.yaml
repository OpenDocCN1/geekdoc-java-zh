  \n### 7. 代理模式 (Proxy Pattern)\n\n代理模式代表另一个类的功能。\n\n代理模式是一种结构性模式。\n\n在代理模式中，我们通过原始接口向外部暴露其功能。\n\
  \n实验 – 12\n\n```java\ninterface Printer {\n    void print();\n}\n\nclass ConsolePrinter\
  \ implements Printer {\n    private String fileName;\n\n    public ConsolePrinter(String\
  \ fileName) {\n        this.fileName = fileName;\n    }\n    @Override\n    public\
  \ void print() {\n        System.out.println(\"Displaying \" + fileName);\n    }\n\
  }\n\nclass ProxyPrinter implements Printer{\n    private ConsolePrinter consolePrinter;\n\
  \    private String fileName;\n\n    public ProxyPrinter(String fileName) {\n  \
  \      this.fileName = fileName;\n    }\n    @Override\n    public void print()\
  \ {\n        if(consolePrinter == null){\n            consolePrinter = new ConsolePrinter(fileName);\n\
  \        }\n        consolePrinter.print();\n    }\n}\n\npublic class Main {\n \
  \   public static void main(String[] args) {\n        Printer image = new ProxyPrinter(\"\
  test\");\n        image.print();\n    }\n}\n```\n\n上述代码生成了以下结果。\n\n输出\n\n| ![](img/image_rsrc7TJ.jpg)\
  \ |\n\n## 第 4 章：\n\n行为型模式\n\n1. 责任链模式 (Chain Of Responsibility Pattern)\n2. 命令模式\
  \ (Command Pattern)\n3. 解释器模式 (Interpreter Pattern)\n4. 迭代器模式 (Iterator Pattern)\n\
  5. 中介者模式 (Mediator Pattern)\n6. 备忘模式 (Memento Pattern)\n7. 观察者模式 (Observer Pattern)\n\
  8. 状态模式 (State Pattern)\n9. 策略模式 (Strategy Pattern)\n10. 模板方法模式 (Template Pattern)\n\
  11. 访问者模式 (Visitor Pattern)\n12. MVC 模式 (MVC Pattern)\n\n1. 责任链模式 (Chain Of Responsibility\
  \ Pattern)\n\n责任链模式为请求创建了一个接收者列表。\n\n这种模式属于行为型模式。\n\n在使用责任链模式时，通常每个接收者都包含指向另一个接收者的引用。\n\
  \n\n\n\n如果一个对象无法处理请求，它会将该请求传递给下一个接收者，依此类推。\n\n## Lab – 13\n\n```java\nabstract class\
  \ Logger {\n    protected Logger nextLogger;\n    public void setNextLogger(Logger\
  \ nextLogger) {\n        this.nextLogger = nextLogger;\n    }\n    public void logMessage(String\
  \ message) {\n        log(message);\n        if(nextLogger !=null) {\n         \
  \   nextLogger.logMessage(message);\n        }\n    }\n    abstract protected void\
  \ log(String message);\n}\nclass ConsoleLogger extends Logger {\n    public ConsoleLogger()\
  \ {\n    }\n    @Override\n    protected void log(String message) {\n        System.out.println(\"\
  Console::Logger: \" + message);\n    }\n}\nclass EMailLogger extends Logger {\n\
  \    public EMailLogger() {\n    }\n    @Override\n    protected void log(String\
  \ message) {\n        System.out.println(\"EMail::Logger: \" + message);\n    }\n\
  }\nclass FileLogger extends Logger {\n    public FileLogger() {\n    }\n    @Override\n\
  \    protected void log(String message) {\n        System.out.println(\"File::Logger:\
  \ \" + message);\n    }\n}\npublic class Main {\n    private static Logger getChainOfLoggers()\
  \ {\n        Logger emailLogger = new EMailLogger();\n        Logger fileLogger\
  \ = new FileLogger();\n        Logger consoleLogger = new ConsoleLogger();\n   \
  \     emailLogger.setNextLogger(fileLogger);\n        fileLogger.setNextLogger(consoleLogger);\n\
  \        return emailLogger;\n    }\n    public static void main(String[] args)\
  \ {\n        Logger loggerChain = getChainOfLoggers();\n        loggerChain.logMessage(\"\
  Null pointer\");\n        loggerChain.logMessage(\"Array Index Out of Bound\");\n\
  \        loggerChain.logMessage(\"Illegal Parameters\");\n    }\n}\n```\n\n上述代码生成以下结果。\n\
  \n## 输出\n![](img/image_rsrc7TK.jpg)\n\n### 2. 命令模式\n\n命令模式是一种数据驱动的设计模式，它属于行为模式之一。\n\
  \n请求被封装在一个名为 `command` 的对象中，并传递给调用者（invoker）对象。\n\n调用者对象将 `command` 传递给对应的对象，该对象执行该命令。\n\
  \n### Lab – 14\n\n```java\nimport java.util.ArrayList;\nimport java.util.List;\n\
  interface Command {\n    void execute();\n}\nclass MouseCursor {\n    private int\
  \ x = 10;\n    private int y = 10;\n    public void move() {\n        System.out.println(\"\
  Old Position:\"+x+\":\"+y);\n        x++;\n        y++;\n    }\n    public void\
  \ reset() {\n        System.out.println(\"reset\");\n        x = 10;\n        y\
  \ = 10;\n    }\n}\nclass MoveCursor implements Command {\n    private MouseCursor\
  \ abcStock;\n    public MoveCursor(MouseCursor abcStock) {\n        this.abcStock\
  \ = abcStock;\n    }\n    public void execute() {\n        abcStock.move();\n  \
  \  }\n}\nclass ResetCursor implements Command {\n    private MouseCursor abcStock;\n\
  \    public ResetCursor(MouseCursor abcStock) {\n        this.abcStock = abcStock;\n\
  \    }\n    public void execute() {\n        abcStock.reset();\n    }\n}\nclass\
  \ MouseCommands {\n    private List<Command> orderList = new ArrayList<>();\n  \
  \  public void takeOrder(Command order) {\n        orderList.add(order);\n    }\n\
  \    public void placeOrders() {\n        for (Command order : orderList) {\n  \
  \          order.execute();\n        }\n        orderList.clear();\n    }\n}\npublic\
  \ class Main {\n    public static void main(String[] args) {\n        MouseCursor\
  \ cursor = new MouseCursor();\n        MoveCursor moveCursor = new MoveCursor(cursor);\n\
  \        ResetCursor resetCursor = new ResetCursor(cursor);\n        MouseCommands\
  \ commands = new MouseCommands();\n        commands.takeOrder(moveCursor);\n   \
  \     commands.takeOrder(resetCursor);\n        commands.placeOrders();\n    }\n\
  }\n```\n\n上述代码生成结果。\n\n## 输出\n![](img/image_rsrc7TM.jpg)\n\n### 3. 解释器模式\n\n我们通常使用\
  \ `Interpreter` 模式来评估语法或表达式。\n\n这种模式属于行为模式之一。\n\n### Lab – 15\n\n```java\ninterface\
  \ Expression {\n    boolean evaluate(String context);\n}\nclass InExpression implements\
  \ Expression {\n    private String data;\n    public InExpression(String data) {\n\
  \        this.data = data;\n    }\n    @Override\n    public boolean evaluate(String\
  \ context) {\n        if (context.contains(data)) {\n            return true;\n\
  \        }\n        return false;\n    }\n}\nclass OrExpression implements Expression\
  \ {\n    private Expression expr1 = null;\n    private Expression expr2 = null;\n\
  \    public OrExpression(Expression expr1, Expression expr2) {\n        this.expr1\
  \ = expr1;\n        this.expr2 = expr2;\n    }\n    @Override\n    public boolean\
  \ evaluate(String context) {\n        return expr1.evaluate(context) | expr2.evaluate(context);\n\
  \    }\n}\nclass AndExpression implements Expression {\n    private Expression expr1\
  \ = null;\n    private Expression expr2 = null;\n    public AndExpression(Expression\
  \ expr1, Expression expr2) {\n        this.expr1 = expr1;\n        this.expr2 =\
  \ expr2;\n    }\n    @Override\n    public boolean evaluate(String context) {\n\
  \        return expr1.evaluate(context) && expr2.evaluate(context);\n    }\n}\n\
  ```\n*注：原文提供的代码中 `AndExpression` 的实现似乎存在逻辑结构错误（构造函数中未赋值且方法体逻辑错位），但根据翻译要求，我保持了代码块不翻译。)*\n\
