- "# Java 入门指南，Java 设计模式，Spring Hibernate\n\n\n\n\n\n在本书中，你将学习带有图解说明和实操练习的解析，以及练习的执行输出、现成的解决方案以及逐步详解。\n\
  \n\n## 目录\n循序渐学会 Java 设计模式编程\n\n## 引言\n## 第 1 章：简介\n- 设计模式简介\n\n## 第 2 章：创建型模式\n\
