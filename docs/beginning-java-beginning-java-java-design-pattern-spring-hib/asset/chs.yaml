  输出\n| ![](img/image_rsrc7TR.jpg) |\n\n### 7. 观察者模式\n\n观察者模式用于在某个对象被修改时通知其依赖对象。\n\
  \n观察者模式是一种行为模式分类。\n\n### 实验 – 19\n\n```java\nimport java.util.ArrayList;\nimport\
  \ java.util.List;\n\nclass MyValue {\n    private List<Observer> observers = new\
  \ ArrayList<Observer>();\n    private int state;\n    public int getState() {\n\
  \        return state;\n    }\n    public void setState(int state) {\n        this.state\
  \ = state;\n        notifyAllObservers();\n    }\n    public void attach(Observer\
  \ observer) {\n        observers.add(observer);\n    }\n    public void notifyAllObservers()\
  \ {\n        for (Observer observer : observers) {\n            observer.update();\n\
  \        }\n    }\n}\n\nabstract class Observer {\n    protected MyValue subject;\n\
  \    public abstract void update();\n}\n\nclass PrinterObserver extends Observer\
  \ {\n    public PrinterObserver(MyValue subject) {\n        this.subject = subject;\n\
  \        this.subject.attach(this);\n    }\n    @Override\n    public void update()\
  \ {\n        System.out.println(\"Printer: \" + subject.getState());\n    }\n}\n\
  \nclass EmailObserver extends Observer {\n    public EmailObserver(MyValue subject)\
  \ {\n        this.subject = subject;\n        this.subject.attach(this);\n    }\n\
  \    @Override\n    public void update() {\n        System.out.println(\"Email:\
  \ \" + subject.getState());\n    }\n}\n\nclass FileObserver extends Observer {\n\
  \    public FileObserver(MyValue subject) {\n        this.subject = subject;\n \
  \       this.subject.attach(this);\n    }\n    @Override\n    public void update()\
  \ {\n        System.out.println(\"File: \" + subject.getState());\n    }\n}\n\n\
  public class Main {\n    public static void main(String[] args) {\n        MyValue\
  \ subject = new MyValue();\n        new FileObserver(subject);\n        new EmailObserver(subject);\n\
  \        new PrinterObserver(subject);\n        subject.setState(15);\n        subject.setState(10);\n\
  \    }\n}\n```\n\n上面的代码生成了以下结果。\n\n输出\n| ![](img/image_rsrc7TS.jpg) |\n\n### 8.\
  \ 状态模式\n\n在状态模式中，类的行为根据其状态发生改变。\n\n状态模式是一种行为模式。\n\n在使用状态模式时，我们创建了各种状态对象和一个上下文对象，上下文对象的行为会随着状态对象的改变而改变。\n\
  \n### 实验 – 20\n\n```java\ninterface State {\n    public void doAction(Context context);\n\
  }\n\nclass StartState implements State {\n    public void doAction(Context context)\
  \ {\n        System.out.println(\"In start state\");\n        context.setState(this);\n\
  \    }\n    public String toString() {\n        return \"Start State\";\n    }\n\
  }\n\nclass StopState implements State {\n    public void doAction(Context context)\
  \ {\n        System.out.println(\"In stop state\");\n        context.setState(this);\n\
  \    }\n    public String toString() {\n        return \"Stop State\";\n    }\n\
  }\n\nclass PlayState implements State {\n    public void doAction(Context context)\
  \ {\n        System.out.println(\"In play state\");\n        context.setState(this);\n\
  \    }\n}\n\nclass Context {\n    private State state;\n    public void setState(State\
  \ state) {\n        this.state = state;\n    }\n    public State getState() {\n\
  \        return state;\n    }\n}\n\npublic class Main {\n    public static void\
  \ main(String[] args) {\n        Context context = new Context();\n        StartState\
  \ startState = new StartState();\n        startState.doAction(context);\n      \
  \  System.out.println(context.getState());\n        PlayState playState = new PlayState();\n\
  \        playState.doAction(context);\n        System.out.println(context.getState());\n\
  \        StopState stopState = new StopState();\n        stopState.doAction(context);\n\
  \        System.out.println(context.getState());\n    }\n}\n```\n\n上面的代码生成了以下结果。\n\
  \n输出\n| ![](img/image_rsrc7TT.jpg) |\n\n### 9. 策略模式\n\n在策略模式中，算法可以在运行时进行更改。\n\n\
  策略模式是一种行为模式。\n\n在策略模式中，我们创建了用于表示算法的对象和一个上下文对象。\n\n策略对象负责改变算法。\n\n### 实验 – 21\n\n\
  ```java\ninterface MathAlgorithm {\n    public int calculate(int num1, int num2);\n\
  }\n\nclass MathAdd implements MathAlgorithm {\n    @Override\n    public int calculate(int\
  \ num1, int num2) {\n        return num1 + num2;\n    }\n}\n\nclass MathSubstract\
  \ implements MathAlgorithm {\n    @Override\n    public int calculate(int num1,\
  \ int num2) {\n        return num1 - num2;\n    }\n}\n\nclass MathMultiply implements\
  \ MathAlgorithm {\n    @Override\n    public int calculate(int num1, int num2) {\n\
  \        return num1 * num2;\n    }\n}\n\nclass MathContext {\n    private MathAlgorithm\
  \ algorithm;\n    public MathContext(MathAlgorithm strategy) {\n        this.algorithm\
  \ = strategy;\n    }\n    public int execute(int num1, int num2) {\n        return\
  \ algorithm.calculate(num1, num2);\n    }\n}\n\npublic class Main {\n    public\
  \ static void main(String[] args) {\n        MathContext context = new MathContext(new\
  \ MathAdd());\n        System.out.println(\"10 + 5 = \" + context.execute(10, 5));\n\
  \        context = new MathContext(new MathSubstract());\n        System.out.println(\"\
  10 - 5 = \" + context.execute(10, 5));\n        context = new MathContext(new MathMultiply());\n\
  \        System.out.println(\"10 * 5 = \" + context.execute(10, 5));\n    }\n}\n\
  ```\n\n上面的代码生成了以下结果。\n\n输出\n| ![](img/image_rsrc7TU.jpg) |\n\n### 10. 模板方法模式\n\n\
  在模板方法模式中，抽象父类暴露多个抽象方法供子类实现。在抽象父类中，有一个方法或多个方法使用这些抽象方法来实现业务逻辑。\n\n抽象方法通常对应于父类所需的每个步骤。\n\
  \n例如，为了使用新软件，我们需要下载、安装、配置和运行。如果我们打算使用模板模式来编写逻辑，可以如下所示父类：\n\n```java\nabstract class\
  \ UseSoftware {\n    abstract void download();\n    abstract void install();\n \
  \   abstract void configuration();\n    abstract void run();\n    public void useNewSoftware()\
  \ {\n        download();\n        install();\n        configuration();\n       \
  \ run();\n    }\n}\n```\n\n对于不同的软件，我们只需要继承上面的抽象类并提供具体的实现即可。\n\n模板方法模式是一种行为模式。\n\n\
  ### 实验 – 22\n\n\n\n\n```java\nabstract class Software {\n    abstract void initialize();\n\
  \    abstract void start();\n    abstract void end();\n    public final void play()\
  \ {\n        //initialize\n        initialize();\n        //start\n        start();\n\
  \        //end\n        end();\n    }\n}\nclass Browser extends Software {\n   \
  \ @Override\n    void end() {\n        System.out.println(\"Browser Finished!\"\
  );\n    }\n    @Override\n    void initialize() {\n        System.out.println(\"\
  Browser Initialized!.\");\n    }\n    @Override\n    void start() {\n        System.out.println(\"\
  Browser Started.\");\n    }\n}\nclass Editor extends Software {\n    @Override\n\
  \    void end() {\n        System.out.println(\"Editor Finished!\");\n    }\n  \
  \  @Override\n    void initialize() {\n        System.out.println(\"Editor Initialized!\"\
  );\n    }\n    @Override\n    void start() {\n        System.out.println(\"Editor\
  \ Started!\");\n    }\n}\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        Software s1 = new Browser();\n        s1.play();\n        s1\
  \ = new Editor();\n        s1.play();\n    }\n}\n```\n\n上面的代码生成了结果。\n\n输出\n\n![](img/image_rsrc7TV.jpg)\n\
  \n### 11. 访问者模式\n\n在访问者模式中，元素对象接受访问者对象，而访问者对象处理对元素对象的操作。\n\n这种模式是一种行为模式。\n\n通过这种方式，元素的执行算法可以从不同的访问者进行更改。\n\
  \n### 实验 – 23\n\n```java\nclass TreeNode {\n    private String name;\n    public\
  \ TreeNode(String name) {\n        this.name = name;\n    }\n    public String getName()\
  \ {\n        return name;\n    }\n    public void accept(NodeVisitor v) {\n    \
  \    v.visit(this);\n    }\n}\ninterface NodeVisitor {\n    public void visit(TreeNode\
  \ n);\n}\nclass ConsoleVisitor implements NodeVisitor {\n    @Override\n    public\
  \ void visit(TreeNode n) {\n        System.out.println(\"console:\" + n.getName());\n\
  \    }\n}\nclass EmailVisitor implements NodeVisitor {\n    @Override\n    public\
  \ void visit(TreeNode n) {\n        System.out.println(\"email:\" + n.getName());\n\
  \    }\n}\npublic class Main {\n    public static void main(String[] args) {\n \
  \       TreeNode computer = new TreeNode(\"abd\");\n        computer.accept(new\
  \ ConsoleVisitor());\n        computer.accept(new EmailVisitor());\n    }\n}\n```\n\
  \n上面的代码生成了结果。\n\n输出\n\n![](img/image_rsrc7TW.jpg)\n\n### 12. MVC 模式\n\nMVC 模式代表模型-视图-控制器模式（Model-View-Controller\
  \ Pattern）。\n\n从名称可以看出，`MVC` 模式涉及三个部分：\n\n- **模型 (Model)** - `Model` 表示承载数据的对象。如果数据发生变化，它也可以包含更新控制器的逻辑。\n\
  - **视图 (View)** - `View` 代表模型包含的数据的可视化。它通常包含 UI 逻辑。\n- **控制器 (Controller)** - `Controller`\
  \ 同时引用 `Model` 和 `view`。它控制进入模型对象的数据流，并在数据发生变化时更新视图。它保持了 `View` 和 `Model` 的分离。\n\
  \n### 实验 – 24\n\n```java\nclass Employee {\n    private String id;\n    private\
  \ String name;\n    public String getId() {\n        return id;\n    }\n    public\
  \ void setId(String id) {\n        this.id = id;\n    }\n    public String getName()\
  \ {\n        return name;\n    }\n    public void setName(String name) {\n     \
  \   this.name = name;\n    }\n}\nclass EmployeeView {\n    public void printEmployeeDetails(String\
  \ name, String no) {\n        System.out.println(\"Employee: \");\n        System.out.println(\"\
  Name: \" + name);\n        System.out.println(\"ID: \" + no);\n    }\n}\nclass EmployeeController\
  \ {\n    private Employee model;\n    private EmployeeView view;\n    public EmployeeController(Employee\
  \ model, EmployeeView view) {\n        this.model = model;\n        this.view =\
  \ view;\n    }\n    // ... 基于逻辑的方法\n}\n// 注意：实验 24 提供的文本在源中是碎片化/交织的。\n```\n（注：实验\
  \ 24 提供的源文本存在碎片化/交织；上述结构反映了文中描述的逻辑类。）\n\n\n\n\n\n## 设计模式\n| 设计模式 | 前端控制器、MVC、工厂、DAO、代理、单例模式、抽象工厂模式、模板模式、SessionFactory、事务工厂。\
