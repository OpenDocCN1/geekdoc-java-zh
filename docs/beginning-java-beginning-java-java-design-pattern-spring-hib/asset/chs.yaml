  - 装饰器模式 (实验 - 9) \n- 外外观模式 (实验 - 10)\n- 过滤器/准则模式 (实验 - 11)\n- 代理模式 (实验 - 12)\n\n\
  ## 第 4 章：行为型模式\n- 责任链模式 (实验 - 13)\n- 命令模式 (实验 - 14)\n- 解释器模式 (实验 - 15)\n- 迭代器模式\
  \ (实验 - 16)\n- 中介者模式 (实验 - 17)\n- 空对象模式 (实验 - 18)\n- 观察者模式 (实验 - 19)\n- 状态模式 (实验\
  \ - 20)\n- 策略模式 (实验 - 21)\n- 模板方法模式 (实验 - 22)\n- 访问者模式 (实验 - 23)\n- MVC 模式 (实验 -\
  \ 24)\n\n### 第 5 章：JEE 设计模式\n- 数据访问对象模式 (实验 - 25)\n\n## 引言\n设计模式与编程语言无关，它是为了解决常见的面向对象设计问题。设计模式代表了一种思想，而不是具体的实现。通过使用设计模式，我们可以让代码更加灵活、可重用且易维护。Java\
  \ 本身也遵循设计模式。在 `java` 中，主要有三种设计模式，它们进一步被分为子部分：\n\n### 创建型模式\n1. `Factory Pattern`\n\
  2. `Abstract Factory Pattern`\n3. `Singleton Pattern`\n4. `Prototype Pattern`\n\
  5. `Builder Pattern`\n\n### 结构型模式\n1. `Adapter Pattern`\n2. `Bridge Pattern`\n3.\
  \ `Composite Pattern`\n4. `Decorator Pattern`\n5. `Facade Pattern`\n6. `Flyweight\
  \ Pattern`\n7. `Proxy Pattern`\n\n### 行为型模式\n1. `Chain Of Responsibility Pattern`\n\
  2. `Command Pattern`\n3. `Interpreter Pattern`\n4. `Iterator Pattern`\n5. `Mediator\
  \ Pattern`\n6. `Memento Pattern`\n7. `Observer Pattern`\n8. `State Pattern`\n9.\
  \ `Strategy Pattern`\n10. `Template Pattern`\n11. `Visitor Pattern`\n12. `MVC Pattern`\n\
  \n## 第 1 章：简介\n设计模式是解决特定问题/任务的经过证明的解决方案。例如，为了创建一个只能有一个实例的类，且该实例可以被所有其他类使用，应使用 `Singleton\
  \ design pattern`。创建型模式用于对象的创建的场景。\n\n### 什么是四人帮 (GOF)？\n可重用面向对象软件元素。设计模式基于以下面向对象设计原则：\n\
  - 面向接口编程，不要面向实现\n- 优先使用组合而非继承\n\n## 第 2 章：创建型模式\n创建型模式用于创建对象的场景。\n\n### 1. 工厂模式\n\
  工厂模式是一种创建型模式，因为它模式提供了创建对象的更好方式。在工厂模式中，我们创建对象而不向客户端暴露创建逻辑。（Lab - 1）\n\n在接下来的章节中，我们将展示如何使用工厂来创建对象。由工厂创建的对象将是形状对象，例如\
  \ `Circle`、`Rectangle`。\n\n首先，我们设计一个接口来表示 `Shape`。\n\n**Shape.java**\n```java\n\
  public interface Shape {\n    void draw();\n}\n```\n\n然后，我们创建实现该接口的具体类。\n\n**Rectangle.java**\n\
  ```java\npublic class Rectangle implements Shape {\n    @Override\n    public void\
  \ draw() {\n        System.out.println(\"Inside Rectangle.draw()\");\n    }\n}\n\
  ```\n\n**Square.java**\n```java\npublic class Square implements Shape {\n    @Override\n\
  \    public void draw() {\n        System.out.println(\"Inside Square.draw()\");\n\
  \    }\n}\n```\n\n**Circle.java**\n```java\npublic class Circle implements Shape\
  \ {\n    @Override\n    public void draw() {\n        System.out.println(\"Inside\
  \ Circle.draw()\");\n    }\n}\n```\n\n核心工厂模式是一个工厂类。以下代码展示了如何为 Shape 对象创建一个工厂类。`ShapeFactory`\
  \ 类根据传入 `getShape` 的字符串值来创建 `Shape` 对象。如果字符串值为 `CIRCLE`，它将创建一个 `Circle` 对象。\n\n\
  **ShapeFactory.java**\n```java\npublic class ShapeFactory {\n    //use getShape\
  \ method to get object of type shape\n    public Shape getShape(String shapeType)\
  \ {\n        if (shapeType == null) {\n            return null;\n        }\n   \
  \     if (shapeType.equalsIgnoreCase(\"CIRCLE\")) {\n            return new Circle();\n\
  \        } else if (shapeType.equalsIgnoreCase(\"RECTANGLE\")) {\n            return\
  \ new Rectangle();\n        } else if (shapeType.equalsIgnoreCase(\"SQUARE\")) {\n\
  \            return new Square();\n        }\n        return null;\n    }\n}\n```\n\
  \n以下代码包含 `main` 方法，它使用工厂类通过传递类型等信息来获取具体类的对象。\n\n**Main.java**\n```java\npublic class\
  \ Main {\n    public static void main(String[] args) {\n        ShapeFactory shapeFactory\
  \ = new ShapeFactory();\n        //get an object of Circle and call its draw method.\n\
  \        Shape shape1 = shapeFactory.getShape(\"CIRCLE\"); //call draw method of\
  \ Circle\n        shape1.draw();\n        //get an object of Rectangle and call\
  \ its draw method.\n        Shape shape2 = shapeFactory.getShape(\"RECTANGLE\");\
  \ //call draw method of Rectangle\n        shape2.draw();\n        //get an object\
  \ of Square and call its draw method.\n        Shape shape3 = shapeFactory.getShape(\"\
  SQUARE\"); //call draw method of Square\n        shape3.draw();\n    }\n}\n```\n\
  \n上述代码生成了以下结果：\n\n**Output**\n![](img/image_rsrc7T8.jpg)\n\n### 2. 抽象工厂模式\n抽象工厂模式是另一种创建型模式。抽象工厂模式也被称为工厂的工厂，它有一个创建一个其他工厂的工厂。（Lab\
  \ - 2）\n\n在使用抽象工厂模式时，我们首先使用超级工厂来创建工厂，然后使用创建的工厂来创建对象。\n\n\n\n\n\n我们将创建形状和 `Printers`（打印机）。对于形状，我们将有`circle`（圆）、`rectangle`（矩）和`square`（正方形）。对于打印机，我们将有`paper\
  \ Printer`（纸质打印）、`Web Printer`（网络打印）和`screen Printer`（屏幕打印）。\n\n对于形状，我们将创建一个如下所示的\
  \ `Shape` 接口：\n\n### Shape.java\n```java\ninterface Shape {\n    void draw();\n\
  }\n```\n\n然后我们创建实现 `Shape` 接口的具体类。\n\n```java\nclass Rectangle implements Shape\
  \ {\n    @Override\n    public void draw() {\n        System.out.println(\"Inside\
  \ Rectangle::draw() method.\");\n    }\n}\nclass Square implements Shape {\n   \
  \ @Override\n    public void draw() {\n        System.out.println(\"Inside Square::draw()\
  \ method.\");\n    }\n}\nclass Circle implements Shape {\n    @Override\n    public\
  \ void draw() {\n        System.out.println(\"Inside Circle::draw() method.\");\n\
  \    }\n}\n```\n\n之后，我们为 `Printers` 创建一个接口。\n\n### Printer.java\n```java\ninterface\
  \ Printer {\n    void print();\n}\n```\n\n然后我们创建实现 `Printer` 接口的具体类。\n\n```java\n\
  class PaperPrinter implements Printer {\n    @Override\n    public void print()\
  \ {\n        System.out.println(\"paper\");\n    }\n}\nclass WebPrinter implements\
  \ Printer {\n    @Override\n    public void print() {\n        System.out.println(\"\
  web\");\n    }\n}\nclass ScreenPrinter implements Printer {\n    @Override\n   \
  \ public void print() {\n        System.out.println(\"screen\");\n    }\n}\n```\n\
  \n最后，我们创建一个抽象类来获取 `Printer` 和 `Shape` 对象的工厂。\n\n```java\nabstract class AbstractFactory\
  \ {\n    abstract Printer getPrinter(String type);\n    abstract Shape getShape(String\
  \ shape);\n}\n```\n\n最后，我们创建扩展 `AbstractFactory` 的工厂类，根据给定信息生成具体类的对象。\n\n```java\n\
  class ShapeFactory extends AbstractFactory {\n    @Override\n    public Shape getShape(String\
  \ shapeType) {\n        if(shapeType == null) {\n            return null;\n    \
  \    }\n        if(shapeType.equalsIgnoreCase(\"CIRCLE\")) {\n            return\
  \ new Circle();\n        } else if(shapeType.equalsIgnoreCase(\"RECTANGLE\")) {\n\
  \            return new Rectangle();\n        } else if(shapeType.equalsIgnoreCase(\"\
  SQUARE\")) {\n            return new Square();\n        }\n        return null;\n\
  \    }\n    @Override\n    Printer getPrinter(String type) {\n        return null;\n\
  \    }\n}\nclass PrinterFactory extends AbstractFactory {\n    @Override\n    public\
  \ Shape getShape(String shapeType) {\n        return null;\n    }\n    @Override\n\
  \    Printer getPrinter(String type) {\n        if(type == null) {\n           \
  \ return null;\n        }\n        if(type.equalsIgnoreCase(\"paper\")) {\n    \
  \        return new PaperPrinter();\n        } else if(type.equalsIgnoreCase(\"\
  web\")) {\n            return new WebPrinter();\n        } else if(type.equalsIgnoreCase(\"\
  Screen\")) {\n            return new ScreenPrinter();\n        }\n        return\
  \ null;\n    }\n}\n```\n\n创建一个 `Factory` 生成器/生产者类，通过传递如 `Shape` 或 `Printer` 等信息来获取工厂。\n\
  \n```java\nclass FactoryProducer {\n    public static AbstractFactory getFactory(String\
  \ choice) {\n        if(choice.equalsIgnoreCase(\"SHAPE\")) {\n            return\
  \ new ShapeFactory();\n        } else if(choice.equalsIgnoreCase(\"Printer\")) {\n\
  \            return new PrinterFactory();\n        }\n        return null;\n   \
  \ }\n}\n```\n\n以下代码展示了如何使用抽象工厂模式。\n\n```java\npublic class Main {\n    public static\
  \ void main(String[] args) {\n        // 获取形状工厂\n        AbstractFactory shapeFactory\
  \ = FactoryProducer.getFactory(\"SHAPE\");\n        // 获取 Shape 对象\n        Shape\
  \ shape1 = shapeFactory.getShape(\"CIRCLE\");\n        // 调用 Shape 的 draw 方法\n \
  \       shape1.draw();\n        // 获取 Rectangle  Shape 对象\n        Shape shape2\
  \ = shapeFactory.getShape(\"RECTANGLE\");\n        // 调用 Rectangle 的 draw 方法\n \
  \       shape2.draw();\n        // 获取 Square Shape 对象\n        Shape shape3 = shapeFactory.getShape(\"\
  SQUARE\");\n        // 调用 Square 的 draw 方法\n        shape3.draw();\n        // 获取打印机工厂\n\
  \        AbstractFactory printerFactory = FactoryProducer.getFactory(\"printer\"\
  );\n        Printer printer1 = printerFactory.getPrinter(\"Paper\");\n        printer1.print();\n\
  \        Printer printer2 = printerFactory.getPrinter(\"Web\");\n        printer2.print();\n\
  \        Printer printer3 = printerFactory.getPrinter(\"Screen\");\n        printer3.print();\n\
  \    }\n}\n```\n\n上述代码生成了以下结果。\n\n## 输出\n![](img/image_rsrc7T9.jpg)\n\n### 3. 单例模式\
  \ (Singleton Pattern)\n\n单例模式是一种创建模式。\n\n该模式仅涉及一个类，该类负责创建它自己的对象。\n\n该类确保了只有一个对象被创建。\n\
  \n该类提供了一种访问其唯一对象的方法。\n\n例如，在设计用户界面时，我们可能只有一个主应用程序窗口。我们可以使用 `Singleton Pattern`（单例模式）来确保\
  \ `MainApplicationWindow` 对象只有一个实例。\n\n### Lab – 3\n\n以下代码将创建一个 `MainWindow` 类。\n\
  \n`MainWindow` 类将其构造函数设为私有，并拥有一个自身的静态实例。\n\n`MainWindow` 类提供了一个静态方法向外部世界获取其静态实例。\n\
  \n`Main` 是我们的演示类。\n\n*(注：原文后半部分存在大量重复代码片段和乱码，此处已根据上述逻辑结构完成核心内容的翻译。)*\n\n\n\n\n##\
  \ 构建器模式用于使用简单对象来创建复杂的对象。它通过从小简单的对象逐步构建出较大的对象。\n\n构建器模式是另一种创建模式。\n\n例如，当为应用程序创建一个主窗口时，我们需要创建一个菜单、一个工具栏，然后添加菜单和工具栏。\n\
  \n对于我们要创建的每一个窗口，我们需要创建一个空窗口、创建一个菜单、创建一个工具栏，并将菜单和工具栏安装到窗口中。\n\n我们可以使用构建器模式来隐藏创建窗口的实现细节。\n\
  \n### Lab – 5\n\n### MainWindow.java\n\n```java\nclass Menu {}\nclass ToolBar {}\n\
  class MainWindow {\n    Menu menu;\n    ToolBar toolBar;\n    public Menu getMenu()\
  \ {\n        return menu;\n    }\n    public void setMenu(Menu menu) {\n       \
  \ this.menu = menu;\n    }\n    public ToolBar getToolBar() {\n        return toolBar;\n\
  \    }\n    public void setToolBar(ToolBar toolBar) {\n        this.toolBar = toolBar;\n\
  \    }\n}\nclass WindowBuilder {\n    public static MainWindow createWindow() {\n\
  \        MainWindow window = new MainWindow();\n        Menu menu = new Menu();\n\
  \        ToolBar toolBar = new ToolBar();\n        window.setMenu(menu);\n     \
  \   window.setToolBar(toolBar);\n        return window;\n    }\n}\npublic class\
  \ Main {\n    public static void main(String[] args) {\n        MainWindow object\
  \ = WindowBuilder.createWindow();\n    }\n}\n```\n\n## 第 3 章：结构设计模式\n\n1. 适配器模式\
  \ (Adapter Pattern) \n2. 桥接模式 (Bridge Pattern)\n3. 组合模式 (Composite Pattern)\n4.\
  \ 装饰器模式 (Decorator Pattern)\n5. Fac 外观模式 (Facade Pattern)\n6. 享权重模式 (Flyweight Pattern)\n\
  7. 代理模式 (Proxy Pattern)\n\n### 1. 适配器模式\n\n我们在现实生活中经常使用适配器。例如，我们使用内存卡适配器连接内存卡和电脑，因为电脑只支持一种内存卡，而我们的卡与电脑不兼容。\n\
  \n适配器是两个不兼容实体之间的转换器。适配器模式是一种结构模式。\n\n在 Java 设计模式中，适配器模式充当两个不兼容接口之间的桥梁。\n\n通过使用适配器模式，我们可以统一这两个不兼容的接口。\n\
  \n## Lab – 6\n\n首先，我们创建一个 `Player` 接口来播放任何类型的媒体文件。\n\n`MyPlayer` 是适配器，它统一了播放媒体文件的接口。\n\
  \n```java\ninterface Player {\n    public void play(String type, String fileName);\n\
  }\ninterface AudioPlayer {\n    public void playAudio(String fileName);\n}\ninterface\
  \ VideoPlayer {\n    public void playVideo(String fileName);\n}\nclass MyAudioPlayer\
  \ implements AudioPlayer {\n    @Override\n    public void playAudio(String fileName)\
  \ {\n        System.out.println(\"Playing. Name: \"+ fileName);\n    }\n}\nclass\
  \ MyVideoPlayer implements VideoPlayer {\n    @Override\n    public void playVideo(String\
  \ fileName) {\n        System.out.println(\"Playing. Name: \"+ fileName);\n    }\n\
  }\nclass MyPlayer implements Player {\n    AudioPlayer audioPlayer = new MyAudioPlayer();\n\
  \    VideoPlayer videoPlayer = new MyVideoPlayer();\n    public MyPlayer() {\n \
  \   }\n    @Override\n    public void play(String audioType, String fileName) {\n\
  \        if(audioType.equalsIgnoreCase(\"avi\")) {\n            videoPlayer.playVideo(fileName);\n\
  \        } else if(audioType.equalsIgnoreCase(\"mp3\")) {\n            audioPlayer.playAudio(fileName);\n\
  \        }\n    }\n}\npublic class Main {\n    public static void main(String[]\
  \ args) {\n        MyPlayer myPlayer = new MyPlayer();\n        myPlayer.play(\"\
  mp3\", \"h.mp3\");\n        myPlayer.play(\"avi\", \"me.avi\");\n    }\n}\n```\n\
  \n上述代码生成了以下结果。\n\n## 输出\n\n| ![](img/image_rsrc7TC.jpg) |\n\n### 2. 桥接模式\n\n桥接模式将定义与其实现解耦。它是一种结构模式。\n\
  \n该模式涉及一个充当桥梁的接口。桥接使得具体类独立于接口实现类。\n\n两种类型的类都可以被修改，而不影响影响对方。\n\n### Lab – 7\n\n```java\n\
  interface Printer {\n    public void print(int radius, int x, int y);\n}\nclass\
  \ ColorPrinter implements Printer {\n    @Override\n    public void print(int radius,\
  \ int x, int y) {\n        System.out.println(\"Color: \" + radius +\", x: \"+x+\"\
  , \"+ y + \"]\");\n    }\n}\nclass BlackPrinter implements Printer {\n    @Override\n\
  \    public void print(int radius, int x, int y) {\n        System.out.println(\"\
  Black: \" + radius +\", x: \"+x+\", \"+ y + \"]\");\n    }\n}\nabstract class Shape\
  \ {\n    protected Printer print;\n}\nclass Circle extends Shape {\n    int radius,\
  \ x, y;\n    public Circle(int radius, int x, int y, Printer print) {\n        this.radius\
  \ = radius;\n        this.x = x;\n        this.y = y;\n        this.print = print;\n\
  \    }\n    public void draw() {\n        print.print(radius, x, y);\n    }\n}\n\
  public class Main {\n    public static void main(String[] args) {\n        Shape\
  \ redCircle = new Circle(100, 10, 20, new ColorPrinter());\n        Shape blackCircle\
  \ = new Circle(150, 30, 20, new BlackPrinter());\n        redCircle.draw();\n  \
  \      blackCircle.draw();\n    }\n}\n```\n（注：Lab 7 提供的源码是碎片，我根据桥接模式的描述进行了重构）。\n\
  \n上述代码生成了以下结果。\n\n## 输出\n\n| ![](img/image_rsrc7TC.jpg) |\n\n### 3. 组合模式\n\n组合模式是一种结构模式，因为它创建了对象的树结构。\n\
  \n组合模式将一组对象视为单个对象。\n\n组合模式使用一个类来表示树结构。\n\n在组合模式中，我们创建一个包含自身对象的类。\n\n### Lab – 8\n\
  \n以下代码使用 `Employee` 类来演示组合模式。\n\n### Employee.java\n\n```java\nimport java.util.ArrayList;\n\
  import java.util.List;\nclass Employee {\n    private String name;\n    private\
  \ String title;\n    private List<Employee> subordinates;\n    public Employee(String\
  \ name, String title) {\n        this.name = name;\n        this.title = title;\n\
  \        subordinates = new ArrayList<Employee>();\n    }\n    public void add(Employee\
  \ e) {\n        subordinates.add(e);\n    }\n    public void remove(Employee e)\
  \ {\n        subordinates.remove(e);\n    }\n    public List<Employee> getSubordinates()\
  \ {\n        return subordinates;\n    }\n    public String toString() {\n     \
  \   return \"Employee :[ Name : \"+ name + \", dept : \"+ title + subordinates +\
  \ \" ]\";\n    }\n}\npublic class Main {\n    public static void main(String[] args)\
  \ {\n        Employee CEO = new Employee(\"John\",\"CEO\");\n        Employee headSales\
  \ = new Employee(\"Rob\",\"Sales\");\n        Employee headMarketing = new Employee(\"\
  Mike\",\"Marketing\");\n        Employee programmer1 = new Employee(\"Lili\",\"\
  Programmer\");\n        Employee programmer2 = new Employee(\"Bob\",\"Programmer\"\
  );\n        Employee tester1 = new Employee(\"Jack\",\"Tester\");\n        Employee\
  \ tester2 = new Employee(\"Tom\",\"Tester\");\n        CEO.add(headSales);\n   \
  \     CEO.add(headMarketing);\n        headSales.add(tester1);\n        headSales.add(tester2);\n\
  \        headMarketing.add(programmer1);\n        headMarketing.add(programmer2);\n\
  \        //打印组织的所有员工\n        System.out.println(CEO);\n        for (Employee headEmployee\
  \ : CEO.getSubordinates()) {\n            System.out.println(headEmployee);\n  \
  \          for (Employee employee : headEmployee.getSubordinates()) {\n        \
  \        System.out.println(employee);\n            }\n        }\n    }\n}\n```\n\
  \n### 4. 装饰器模式\n\n装饰器模式在不改变现有对象结构的情况下为现有对象添加新功能。\n\n它是一种结构模式，因为它是现有类的包装。\n\n装饰器模式创建一个装饰器类来包装原始类，并提供额外的功能。\n\
  \n### Lab – 9\n\n\n\n\n\n```java\ninterface Printer {\n    void print();\n}\n\n\
  class PaperPrinter implements Printer {\n    @Override\n    public void print()\
  \ {\n        System.out.println(\"Paper Printer\");\n    }\n}\n\nclass PlasticPrinter\
  \ implements Printer {\n    @Override\n    public void print() {\n        System.out.println(\"\
  Plastic Printer\");\n    }\n}\n\nabstract class PrinterDecorator implements Printer\
  \ {\n    protected Printer decoratedPrinter;\n\n    public PrinterDecorator(Printer\
  \ d) {\n        this.decoratedPrinter = d;\n    }\n\n    public void print() {\n\
  \        decoratedPrinter.print();\n    }\n}\n\nclass Printer3D extends PrinterDecorator\
  \ {\n    public Printer3D(Printer decoratedShape) {\n        super(decoratedShape);\n\
  \    }\n    @Override\n    public void print() {\n        System.out.println(\"\
  3D.\");\n        decoratedPrinter.print();\n    }\n}\n\npublic class Main {\n  \
  \  public static void main(String[] args) {\n        Printer plasticPrinter = new\
  \ PlasticPrinter();\n        Printer plastic3DPrinter = new Printer3D(new PlasticPrinter());\n\
  \        Printer paper3DPrinter = new Printer3D(new PaperPrinter());\n        plasticPrinter.print();\n\
