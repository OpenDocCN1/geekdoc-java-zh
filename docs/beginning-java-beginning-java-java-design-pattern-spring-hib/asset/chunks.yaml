    \    }\n}\nabstract class Shape {\n    protected Printer print;\n}\nclass Circle\
    \ extends Shape {\n    int radius, x, y;\n    public Circle(int radius, int x,\
    \ int y, Printer print) {\n        this.radius = radius;\n        this.x = x;\n\
