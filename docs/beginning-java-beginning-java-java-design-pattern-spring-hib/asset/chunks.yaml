    ## Hospital System ( Working Flow )

    - **Step 1**: Patient → Required Doctor → Appointment

    - **Step 2**: Doctor → Doctor see Appointment → Treatment

    - **Step 3**: Patient → See Treatment

    - **Step 4**: Doctor → Doctor update start end Treatment

    - **Step 5**: Patient → See Treatment Status


    ## Design Document of Hospital System


    ### 1. Hospital Out-Patient Referral System Features

    ### 1.1 Overall Function of the System

    - Operator of the Permissions Level, with clear classification, when the System
    is to be Authenticated.

    - The Patient privacy of the Individual is Responsible for the Patient''s Medical
    Records can only be the Patient during treatment by the Doctor, other anyone,
    including Administrator is not authorized to access.


    ### 1.2 Patient''s Role

    - To Register as a User, set to your Login Name and Password.

    - The names of the Doctors a custom query.

    - Based on Results of the Query to make a Reservation, if you specify the day
    Doctor’s Appointment volume is full, the Reservation Failed. Result random returns
    to the Patient.

    - You can have an Appointment, view or undo.

    - Make an Appointment, you can query the Doctor Information, Medical Information.


    ### 1.3 Doctor Role

    - You can view the Reservation the context of the Patient.

    - You can query for Patient Records.

    - You can create Patient Records.

    - The Patient''s Medical Record to be Modified.


    ### 1.4 Administrator Role

    - You can Add and Delete Doctors Account.


    ### 2. Design Process

    From the demand analysis, separation of the entities.

    **Major entities:**

    - `Doctor` (`doctor`)

    - `Patient` (`patient`)

    - `Medical Record` (`history`)

    - `Reservation records` (`pinqueue`)

    - `Administrator` (`administrator`)

    - Doctors can be a maximum number of Appointments (`appointment`)

    - Doctors currently available number of Appointments (`currappointment`)


