  trans: "\n\n![](img/cover.jpeg)\n\n# Java 设计模式\n\n在本书中，你将学习带有图解说明和实操练习的解析，以及练习的执行输出、现成的解决方案以及逐步详解。\n\
    \n**AMIT K**\n\n## 目录\n循序渐学会 Java 设计模式编程\n\n### 引言\n### 第 1 章：简介\n- 设计模式简介\n\n\
    ### 第 2 章：创建型模式\n- 工厂模式 (实验 - 1)\n- 抽象工厂模式 (实验 - 2)\n- 单例模式 (实验 - 3)\n- 原型模式 (实验\
    \ - 4)\n- 构建者模式 (实验 - 5)\n\n### 第 3 章：结构型模式\n- 适配器模式 (实验 - 6)\n- 桥接模式 (实验 - 7)\n\
    - 组合模式 (实验 - 8)\n- 装饰器模式 (实验 - 9) \n- 外外观模式 (实验 - 10)\n- 过滤器/准则模式 (实验 - 11)\n\
    - 代理模式 (实验 - 12)\n\n### 第 4 章：行为型模式\n- 责任链模式 (实验 - 13)\n- 命令模式 (实验 - 14)\n- 解释器模式\
    \ (实验 - 15)\n- 迭代器模式 (实验 - 16)\n- 中介者模式 (实验 - 17)\n- 空对象模式 (实验 - 18)\n- 观察者模式\
    \ (实验 - 19)\n- 状态模式 (实验 - 20)\n- 策略模式 (实验 - 21)\n- 模板方法模式 (实验 - 22)\n- 访问者模式 (实验\
    \ - 23)\n- MVC 模式 (实验 - 24)\n\n### 第 5 章：JEE 设计模式\n- 数据访问对象模式 (实验 - 25)\n\n##\
    \ 引言\n设计模式与编程语言无关，它是为了解决常见的面向对象设计问题。设计模式代表了一种思想，而不是具体的实现。通过使用设计模式，我们可以让代码更加灵活、可重用且易维护。Java\
    \ 本身也遵循设计模式。在 `java` 中，主要有三种设计模式，它们进一步被分为子部分：\n\n#### 创建型模式\n1. `Factory Pattern`\n\
    2. `Abstract Factory Pattern`\n3. `Singleton Pattern`\n4. `Prototype Pattern`\n\
    5. `Builder Pattern`\n\n#### 结构型模式\n1. `Adapter Pattern`\n2. `Bridge Pattern`\n\
    3. `Composite Pattern`\n4. `Decorator Pattern`\n5. `Facade Pattern`\n6. `Flyweight\
    \ Pattern`\n7. `Proxy Pattern`\n\n#### 行为型模式\n1. `Chain Of Responsibility Pattern`\n\
    2. `Command Pattern`\n3. `Interpreter Pattern`\n4. `Iterator Pattern`\n5. `Mediator\
    \ Pattern`\n6. `Memento Pattern`\n7. `Observer Pattern`\n8. `State Pattern`\n\
    9. `Strategy Pattern`\n10. `Template Pattern`\n11. `Visitor Pattern`\n12. `MVC\
    \ Pattern`\n\n## 第 1 章：简介\n设计模式是解决特定问题/任务的经过证明的解决方案。例如，为了创建一个只能有一个实例的类，且该实例可以被所有其他类使用，应使用\
    \ `Singleton design pattern`。创建型模式用于对象的创建的场景。\n\n### 什么是四人帮 (GOF)？\n可重用面向对象软件元素。设计模式基于以下面向对象设计原则：\n\
    - 面向接口编程，不要面向实现\n- 优先使用组合而非继承\n\n### 第 2 章：创建型模式\n创建型模式用于创建对象的场景。\n\n#### 1. 工厂模式\n\
    工厂模式是一种创建型模式，因为它模式提供了创建对象的更好方式。在工厂模式中，我们创建对象而不向客户端暴露创建逻辑。（Lab - 1）\n\n在接下来的章节中，我们将展示如何使用工厂来创建对象。由工厂创建的对象将是形状对象，例如\
    \ `Circle`、`Rectangle`。\n\n首先，我们设计一个接口来表示 `Shape`。\n\n**Shape.java**\n```java\n\
    public interface Shape {\n    void draw();\n}\n```\n\n然后，我们创建实现该接口的具体类。\n\n**Rectangle.java**\n\
    ```java\npublic class Rectangle implements Shape {\n    @Override\n    public\
    \ void draw() {\n        System.out.println(\"Inside Rectangle.draw()\");\n  \
    \  }\n}\n```\n\n**Square.java**\n```java\npublic class Square implements Shape\
    \ {\n    @Override\n    public void draw() {\n        System.out.println(\"Inside\
    \ Square.draw()\");\n    }\n}\n```\n\n**Circle.java**\n```java\npublic class Circle\
    \ implements Shape {\n    @Override\n    public void draw() {\n        System.out.println(\"\
    Inside Circle.draw()\");\n    }\n}\n```\n\n核心工厂模式是一个工厂类。以下代码展示了如何为 Shape 对象创建一个工厂类。`ShapeFactory`\
    \ 类根据传入 `getShape` 的字符串值来创建 `Shape` 对象。如果字符串值为 `CIRCLE`，它将创建一个 `Circle` 对象。\n\n\
    **ShapeFactory.java**\n```java\npublic class ShapeFactory {\n    //use getShape\
    \ method to get object of type shape\n    public Shape getShape(String shapeType)\
    \ {\n        if (shapeType == null) {\n            return null;\n        }\n \
    \       if (shapeType.equalsIgnoreCase(\"CIRCLE\")) {\n            return new\
    \ Circle();\n        } else if (shapeType.equalsIgnoreCase(\"RECTANGLE\")) {\n\
    \            return new Rectangle();\n        } else if (shapeType.equalsIgnoreCase(\"\
    SQUARE\")) {\n            return new Square();\n        }\n        return null;\n\
    \    }\n}\n```\n\n以下代码包含 `main` 方法，它使用工厂类通过传递类型等信息来获取具体类的对象。\n\n**Main.java**\n\
    ```java\npublic class Main {\n    public static void main(String[] args) {\n \
    \       ShapeFactory shapeFactory = new ShapeFactory();\n        //get an object\
    \ of Circle and call its draw method.\n        Shape shape1 = shapeFactory.getShape(\"\
    CIRCLE\"); //call draw method of Circle\n        shape1.draw();\n        //get\
    \ an object of Rectangle and call its draw method.\n        Shape shape2 = shapeFactory.getShape(\"\
    RECTANGLE\"); //call draw method of Rectangle\n        shape2.draw();\n      \
    \  //get an object of Square and call its draw method.\n        Shape shape3 =\
    \ shapeFactory.getShape(\"SQUARE\"); //call draw method of Square\n        shape3.draw();\n\
    \    }\n}\n```\n\n上述代码生成了以下结果：\n\n**Output**\n![](img/image_rsrc7T8.jpg)\n\n####\
    \ 2. 抽象工厂模式\n抽象工厂模式是另一种创建型模式。抽象工厂模式也被称为工厂的工厂，它有一个创建一个其他工厂的工厂。（Lab - 2）\n\n在使用抽象工厂模式时，我们首先使用超级工厂来创建工厂，然后使用创建的工厂来创建对象。\n\
    \n"
- fmt: "\nWe are going to create shapes and `Printers`. For shapes, we would have\
    \ `circle`, `rectangle` and `square`. For printers we will have `paper Printer`,\
    \ `Web Printer` and `screen Printer`.\n\nFor shape we will create `Shape` interface,\
    \ as follows:\n\n### Shape.java\n```java\ninterface Shape {\n    void draw();\n\
    }\n```\n\nThen we create concrete classes implementing the `Shape` interface.\n\
    \n```java\nclass Rectangle implements Shape {\n    @Override\n    public void\
    \ draw() {\n        System.out.println(\"Inside Rectangle::draw() method.\");\n\
    \    }\n}\nclass Square implements Shape {\n    @Override\n    public void draw()\
    \ {\n        System.out.println(\"Inside Square::draw() method.\");\n    }\n}\n\
    class Circle implements Shape {\n    @Override\n    public void draw() {\n   \
    \     System.out.println(\"Inside Circle::draw() method.\");\n    }\n}\n```\n\n\
    After that we create an interface for `Printers`.\n\n### Printer.java\n```java\n\
    interface Printer {\n    void print();\n}\n```\n\nThen we create concrete classes\
    \ implementing the `Printer` interface.\n\n```java\nclass PaperPrinter implements\
    \ Printer {\n    @Override\n    public void print() {\n        System.out.println(\"\
    paper\");\n    }\n}\nclass WebPrinter implements Printer {\n    @Override\n  \
    \  public void print() {\n        System.out.println(\"web\");\n    }\n}\nclass\
    \ ScreenPrinter implements Printer {\n    @Override\n    public void print() {\n\
    \        System.out.println(\"screen\");\n    }\n}\n```\n\nFinally we create an\
    \ abstract class to get factories for `Printer` and `Shape` Objects.\n\n```java\n\
    abstract class AbstractFactory {\n    abstract Printer getPrinter(String type);\n\
    \    abstract Shape getShape(String shape);\n}\n```\n\nFinally we create Factory\
    \ classes extending `AbstractFactory` to generate object of concrete class based\
    \ on given information.\n\n```java\nclass ShapeFactory extends AbstractFactory\
    \ {\n    @Override\n    public Shape getShape(String shapeType) {\n        if(shapeType\
    \ == null) {\n            return null;\n        }\n        if(shapeType.equalsIgnoreCase(\"\
    CIRCLE\")) {\n            return new Circle();\n        } else if(shapeType.equalsIgnoreCase(\"\
    RECTANGLE\")) {\n            return new Rectangle();\n        } else if(shapeType.equalsIgnoreCase(\"\
    SQUARE\")) {\n            return new Square();\n        }\n        return null;\n\
    \    }\n    @Override\n    Printer getPrinter(String type) {\n        return null;\n\
    \    }\n}\nclass PrinterFactory extends AbstractFactory {\n    @Override\n   \
    \ public Shape getShape(String shapeType) {\n        return null;\n    }\n   \
    \ @Override\n    Printer getPrinter(String type) {\n        if(type == null) {\n\
    \            return null;\n        }\n        if(type.equalsIgnoreCase(\"paper\"\
    )) {\n            return new PaperPrinter();\n        } else if(type.equalsIgnoreCase(\"\
    web\")) {\n            return new WebPrinter();\n        } else if(type.equalsIgnoreCase(\"\
    Screen\")) {\n            return new ScreenPrinter();\n        }\n        return\
    \ null;\n    }\n}\n```\n\nCreate a `Factory` generator/producer class to get factories\
    \ by passing an information such as `Shape` or `Printer`.\n\n```java\nclass FactoryProducer\
    \ {\n    public static AbstractFactory getFactory(String choice) {\n        if(choice.equalsIgnoreCase(\"\
    SHAPE\")) {\n            return new ShapeFactory();\n        } else if(choice.equalsIgnoreCase(\"\
