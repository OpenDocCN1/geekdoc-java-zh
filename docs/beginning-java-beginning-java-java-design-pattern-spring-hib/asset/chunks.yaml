    name;private  int  id;Employee(String name, int  id) {this.name = name;this.id
    = id;}public String getName() {return  name;}public  void setName(String name)
    {this.name = name;}public  int getId() {return  id;}public  void setId(int  id)
    {this.id = id;}}interface EmployeeDao {public List<Employee> getAll();public Employee
    get(int  id);public  void updateStudent(Employee student);public  void delete(Employee
    student);}class EmployeeDaoImpl implements EmployeeDao {List<Employee> employeeList;public
    EmployeeDaoImpl() {employeeList = new ArrayList<Employee>();Employee emp1 = new
    Employee("Jack", 0);Employee emp2 = new Employee("Tom", 1);employeeList.add(emp1);employeeList.add(emp2);}@Overridepublic  void
    delete(Employee student) {employeeList.remove(student.getId());System.out.println("Employee:
    No " + student.getId()+ ", deleted from database");}@Overridepublic List<Employee>
    getAll() {return  employeeList;}@Overridepublic Employee get(int  rollNo) {return  employeeList.get(rollNo);}@Overridepublic  void
    updateStudent(Employee emp) {employeeList.get(emp.getId()).setName(emp.getName());System.out.println("Emp:No
    " + emp.getId()+ ", updated in the database");}}public  class Main {public  static  void
