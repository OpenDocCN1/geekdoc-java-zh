    \n| HID | 病历记录号 | 医生主 | 医生编号 | 外键 | 描述 | 诊断 | 患者人数 | 外键 | 处方 | 是否完成 | 开始时间 | 结束时间\
    \ |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :---\
    \ | :--- |\n| | | dl_doctor (DID) | | | | dl_patient (DID) | | 0-否 | | |\n\n```sql\n\
    create sequence dl_history;\ncreate table dl_history (\n    hid number(10) primary\
    \ key,\n    doctor_did number(5) references dl_doctor(did) not null,\n    description\
    \ varchar2(64) not null,\n    diagnose varchar2(64) not null,\n    patient_pid\
    \ number(8) references dl_patient(pid) not null,\n    rx varchar2(64) not null,\n\
    \    finished number(1) not null,\n    fdate date,\n    sdate date\n);\n```\n\n\
    ### 患者表\n患者编号通过序列生成。\n\n| PID | 患者编号 | 姓名 | 用户名 | 密码 | 年龄 | 性别 | 家庭地址 | 电话号码 |\
    \ 病历 |\n| :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n| |\
    \ | | | | 1-男 0 -女 | | | |\n\n```sql\ncreate sequence dl_patient_seq;\ncreate\
    \ table dl_patient (\n    pid number(8) primary key,\n    name varchar2(12) not\
    \ null,\n    username varchar2(20) unique not null,\n    password varchar2(20)\
    \ not null,\n    age number(3) not null,\n    sex number(1) not null,\n    address\
    \ varchar2(32),\n    phone varchar2(24)\n);\n```\n\n### 预约表单\nQID 记录号通过序列生成。\n\
    \n| QID | 记录号 | 患者人数 | 外键 | 医生主 | 医生编号 | 外键 | 天 | 预约时间 | AP 预约时间 | Dat 预约时间 |\n\
    | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- | :--- |\n\
    | | | dl_patient (PID) | | dl_doctor (DID) | | 0-周日 1-周一 2-周二 3 - 周三 4 - 周四 5\
    \ - 周五 6 - 周六 | 0 - 上午 1- 下午 | 2024-01-02 10:00:00 | | |\n\n```sql\ncreate sequence\
    \ dl_pinqueue_seq;\ncreate table dl_pinqueue (\n    qid number(10) primary key,\n\
    \    patient_pid number(8) references dl_patient(pid) not null,\n    doctor_did\
    \ number(5) references dl_doctor(did) not null,\n    day number(1) not null,\n\
    \    ap number(1) not null,\n    dat date not null,\n    constraint pinqueue_Doctor_Patient\
    \ unique (doctor_did, patient_pid)\n);\n```\n\nFirst → 插入给定的 SQL 语句\n\n"
