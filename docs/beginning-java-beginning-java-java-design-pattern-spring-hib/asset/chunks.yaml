    1.  Factory Pattern


    Factory pattern is a creational pattern as this pattern provides better ways to
    create an object.


    In Factory pattern, we create object without exposing the creation logic to the
    client.


    Lab - 1


    In the following sections we will show how to use Factory Pattern to create objects.


    The objects created by the factory pattern would be shape objects, such as Circle,
    Rectangle.


    First we design an interface to represent Shape.


    The following code is for Shape.java


    | public  interface Shape {   void draw();} |


    Then we create concrete classes implementing the interface.


    The following code is for Rectangle.java


    | public  class Rectangle implements Shape {@Overridepublic  void draw() {System.out.println("Inside
    Rectangle::draw() method.");}} |


    Square.java


    | public  class Square implements Shape {@Overridepublic  void draw() {System.out.println("Inside
    Square::draw() method.");}} |


    Circle.java


    | public  class Circle implements Shape {@Overridepublic  void draw() {System.out.println("Inside
    Circle::draw() method.");}} |


    The core factory pattern is a Factory class. The following code shows how to create
    a Factory class for Shape objects.


    The ShapeFactory class creates Shape object based on the String value passed in
    to the getShape() method. If the String value is CIRCLE, it will create a Circle
    object.


    ShapeFactory.java


    | public  class ShapeFactory {//use getShape method to get object of type shapepublic
    Shape getShape(String shapeType){if(shapeType == null){   return  null;}   if(shapeType.equalsIgnoreCase("CIRCLE")){   return  new
    Circle();} else  if(shapeType.equalsIgnoreCase("RECTANGLE")){   return  new Rectangle();}
    else  if(shapeType.equalsIgnoreCase("SQUARE")){   return  new Square();}   return  null;}}
    |


    The following code has main method and it uses the Factory class to get object
    of concrete class by passing an information such as type.


    Main.java


    | public  class Main {public  static  void main(String[] args) {ShapeFactory shapeFactory
    = new ShapeFactory();//get an object of Circle and call its draw method.Shape
    shape1 = shapeFactory.getShape("CIRCLE");//call draw method of Circleshape1.draw();//get
    an object of Rectangle and call its draw method.Shape shape2 = shapeFactory.getShape("RECTANGLE");//call
    draw method of Rectangleshape2.draw();//get an object of Square and call its draw
    method.Shape shape3 = shapeFactory.getShape("SQUARE");//call draw method of circleshape3.draw();}}
    |


