    \n| ![](img/image_rsrc7TC.jpg) |\n\n## 3. 组合模式\n\n组合模式是一种结构模式，因为它创建了对象的树结构。\n\n\
    组合模式将一组对象视为单个对象。\n\n组合模式使用一个类来表示树结构。\n\n在组合模式中，我们创建一个包含自身对象的类。\n\n# Lab – 8\n\n\
