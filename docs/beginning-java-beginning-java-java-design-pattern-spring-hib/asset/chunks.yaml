    Chapter 5 :


    Data Access Object Pattern


    Data Access Object Pattern or DAO pattern separates data accessing API from high
    level business services.


    A DAO pattern usually has the following interface and classes.


    *   Data Access Object Interface defines the standard operations on a model object(s).


    *   Data Access Object class implements above interface. There could be more than
    one implementations, for example, one for database, one for file.


    *   Model Object Simple POJO containing get/set methods to store data.


    Lab – 25


