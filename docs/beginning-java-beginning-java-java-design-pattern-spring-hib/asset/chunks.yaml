    ## 医院系统（工作流程）

    - **步骤 1**: 患者 → 需要的医生 → 预约

    - **步骤 2**: 医生 → 医生查看预约 → 治疗

    - **步骤 3**: 患者 → 查看治疗

    - **步骤 4**: 医生 → 医生更新治疗开始/结束时间

    - **步骤 5**: 患者 → 查看治疗状态


    ## 医院系统设计文档


    ### 1. 医院门诊预约系统功能

    ### 1.1 系统整体功能

    - 操作员权限划分，分类清晰，系统需进行身份验证。

    - 个人患者隐私保护：只有患者在医生治疗期间可以访问其医疗记录，其他任何人（包括管理员）均未经授权访问。


    ### 1.2 患者角色

    - 注册用户，设置您的登录名和密码。

    - 自定义查询医生姓名。

    - 根据查询结果进行预约，如果指定的日期医生预约量已满，则预约失败。结果随机返回给患者。

    - 你可以进行预约、查看或取消预约。

    - 进行预约时，你可以查询医生信息和医疗信息。


    ### 1.3 医生角色

    - 你可以在患者背景下查看预约。

    - 你可以查询患者记录。

    - 你可以创建患者记录。

    - 修改患者医疗记录。


    ### 1.4 管理员角色

    - 你可以添加和删除医生账号。


    ### 2. 设计过程

    从需求分析开始进行实体分离。

    **主要实体：**

    - `医生` (`doctor`)

    - `患者` (`patient`)

    - `病历记录` (`history`)

    - `预约记录` (`pinqueue`)

    - `管理员` (`administrator`)

    - 医生可接诊的最大预约数 (`appointment`)

    - 医生当前可用预约数 (`currappointment`)


