  trans: "\n\n我们将创建形状和 `Printers`（打印机）。对于形状，我们将有`circle`（圆）、`rectangle`（矩）和`square`（正方形）。对于打印机，我们将有`paper\
    \ Printer`（纸质打印）、`Web Printer`（网络打印）和`screen Printer`（屏幕打印）。\n\n对于形状，我们将创建一个如下所示的\
    \ `Shape` 接口：\n\n### Shape.java\n```java\ninterface Shape {\n    void draw();\n\
    }\n```\n\n然后我们创建实现 `Shape` 接口的具体类。\n\n```java\nclass Rectangle implements Shape\
    \ {\n    @Override\n    public void draw() {\n        System.out.println(\"Inside\
    \ Rectangle::draw() method.\");\n    }\n}\nclass Square implements Shape {\n \
    \   @Override\n    public void draw() {\n        System.out.println(\"Inside Square::draw()\
    \ method.\");\n    }\n}\nclass Circle implements Shape {\n    @Override\n    public\
    \ void draw() {\n        System.out.println(\"Inside Circle::draw() method.\"\
    );\n    }\n}\n```\n\n之后，我们为 `Printers` 创建一个接口。\n\n### Printer.java\n```java\n\
    interface Printer {\n    void print();\n}\n```\n\n然后我们创建实现 `Printer` 接口的具体类。\n\
    \n```java\nclass PaperPrinter implements Printer {\n    @Override\n    public\
    \ void print() {\n        System.out.println(\"paper\");\n    }\n}\nclass WebPrinter\
    \ implements Printer {\n    @Override\n    public void print() {\n        System.out.println(\"\
    web\");\n    }\n}\nclass ScreenPrinter implements Printer {\n    @Override\n \
    \   public void print() {\n        System.out.println(\"screen\");\n    }\n}\n\
    ```\n\n最后，我们创建一个抽象类来获取 `Printer` 和 `Shape` 对象的工厂。\n\n```java\nabstract class AbstractFactory\
    \ {\n    abstract Printer getPrinter(String type);\n    abstract Shape getShape(String\
    \ shape);\n}\n```\n\n最后，我们创建扩展 `AbstractFactory` 的工厂类，根据给定信息生成具体类的对象。\n\n```java\n\
    class ShapeFactory extends AbstractFactory {\n    @Override\n    public Shape\
    \ getShape(String shapeType) {\n        if(shapeType == null) {\n            return\
    \ null;\n        }\n        if(shapeType.equalsIgnoreCase(\"CIRCLE\")) {\n   \
    \         return new Circle();\n        } else if(shapeType.equalsIgnoreCase(\"\
    RECTANGLE\")) {\n            return new Rectangle();\n        } else if(shapeType.equalsIgnoreCase(\"\
    SQUARE\")) {\n            return new Square();\n        }\n        return null;\n\
    \    }\n    @Override\n    Printer getPrinter(String type) {\n        return null;\n\
    \    }\n}\nclass PrinterFactory extends AbstractFactory {\n    @Override\n   \
    \ public Shape getShape(String shapeType) {\n        return null;\n    }\n   \
    \ @Override\n    Printer getPrinter(String type) {\n        if(type == null) {\n\
    \            return null;\n        }\n        if(type.equalsIgnoreCase(\"paper\"\
    )) {\n            return new PaperPrinter();\n        } else if(type.equalsIgnoreCase(\"\
    web\")) {\n            return new WebPrinter();\n        } else if(type.equalsIgnoreCase(\"\
    Screen\")) {\n            return new ScreenPrinter();\n        }\n        return\
    \ null;\n    }\n}\n```\n\n创建一个 `Factory` 生成器/生产者类，通过传递如 `Shape` 或 `Printer` 等信息来获取工厂。\n\
    \n```java\nclass FactoryProducer {\n    public static AbstractFactory getFactory(String\
    \ choice) {\n        if(choice.equalsIgnoreCase(\"SHAPE\")) {\n            return\
    \ new ShapeFactory();\n        } else if(choice.equalsIgnoreCase(\"Printer\"))\
    \ {\n            return new PrinterFactory();\n        }\n        return null;\n\
    \    }\n}\n```\n\n以下代码展示了如何使用抽象工厂模式。\n\n```java\npublic class Main {\n    public\
    \ static void main(String[] args) {\n        // 获取形状工厂\n        AbstractFactory\
    \ shapeFactory = FactoryProducer.getFactory(\"SHAPE\");\n        // 获取 Shape 对象\n\
    \        Shape shape1 = shapeFactory.getShape(\"CIRCLE\");\n        // 调用 Shape\
    \ 的 draw 方法\n        shape1.draw();\n        // 获取 Rectangle  Shape 对象\n     \
    \   Shape shape2 = shapeFactory.getShape(\"RECTANGLE\");\n        // 调用 Rectangle\
    \ 的 draw 方法\n        shape2.draw();\n        // 获取 Square Shape 对象\n        Shape\
    \ shape3 = shapeFactory.getShape(\"SQUARE\");\n        // 调用 Square 的 draw 方法\n\
    \        shape3.draw();\n        // 获取打印机工厂\n        AbstractFactory printerFactory\
    \ = FactoryProducer.getFactory(\"printer\");\n        Printer printer1 = printerFactory.getPrinter(\"\
    Paper\");\n        printer1.print();\n        Printer printer2 = printerFactory.getPrinter(\"\
    Web\");\n        printer2.print();\n        Printer printer3 = printerFactory.getPrinter(\"\
    Screen\");\n        printer3.print();\n    }\n}\n```\n\n上述代码生成了以下结果。\n\n### 输出\n\
    ![](img/image_rsrc7T9.jpg)\n\n## 3. 单例模式 (Singleton Pattern)\n\n单例模式是一种创建模式。\n\
    \n该模式仅涉及一个类，该类负责创建它自己的对象。\n\n该类确保了只有一个对象被创建。\n\n该类提供了一种访问其唯一对象的方法。\n\n例如，在设计用户界面时，我们可能只有一个主应用程序窗口。我们可以使用\
    \ `Singleton Pattern`（单例模式）来确保 `MainApplicationWindow` 对象只有一个实例。\n\n### Lab –\
    \ 3\n\n以下代码将创建一个 `MainWindow` 类。\n\n`MainWindow` 类将其构造函数设为私有，并拥有一个自身的静态实例。\n\n\
    `MainWindow` 类提供了一个静态方法向外部世界获取其静态实例。\n\n`Main` 是我们的演示类。\n\n*(注：原文后半部分存在大量重复代码片段和乱码，此处已根据上述逻辑结构完成核心内容的翻译。)*\n"
- fmt: "\n# Builder pattern is used to create a complex object using simple objects.\
    \ It creates the bigger object step by step from small and simple object.\n\n\
    Builder pattern is another creational pattern.\n\nFor example, when creating a\
    \ window as our application's main window, we need to create a menu, a toolbar\
    \ and then add the menu and toolbar.\n\nFor each window we are going to create,\
    \ we need to create an empty window, create a menu, create a toolbar, install\
    \ the menu and toolbar to the window.\n\nWe can use the builder pattern to hide\
    \ the implementation of how to create a window.\n\n# Lab – 5\n\n## MainWindow.java\n\
    \n```java\nclass Menu {}\nclass ToolBar {}\nclass MainWindow {\n    Menu menu;\n\
    \    ToolBar toolBar;\n    public Menu getMenu() {\n        return menu;\n   \
    \ }\n    public void setMenu(Menu menu) {\n        this.menu = menu;\n    }\n\
    \    public ToolBar getToolBar() {\n        return toolBar;\n    }\n    public\
    \ void setToolBar(ToolBar toolBar) {\n        this.toolBar = toolBar;\n    }\n\
    }\nclass WindowBuilder {\n    public static MainWindow createWindow() {\n    \
    \    MainWindow window = new MainWindow();\n        Menu menu = new Menu();\n\
    \        ToolBar toolBar = new ToolBar();\n        window.setMenu(menu);\n   \
    \     window.setToolBar(toolBar);\n        return window;\n    }\n}\npublic class\
    \ Main {\n    public static void main(String[] args) {\n        MainWindow object\
    \ = WindowBuilder.createWindow();\n    }\n}\n```\n\n# Chapter 3 : Structural Design\
    \ Pattern\n\n1. Adapter Pattern \n2. Bridge Pattern\n3. Composite Pattern\n4.\
    \ Decorator Pattern\n5. Facade Pattern\n6. Flyweight Pattern\n7. Proxy Pattern\n\
    \n## 1. Adapter Pattern\n\nWe use the adapter in real life a lot. For example,\
    \ we use a memory card adapter to connect a memory card and a computer since the\
    \ computer only support one type of memory card and our card is not compatible\
    \ with the computer.\n\nAdapter is a converter between two incompatible entities.\
    \ Adapter pattern is a structural pattern.\n\nIn Java design pattern, Adapter\
    \ pattern works as a bridge between two incompatible interfaces.\n\nBy using the\
    \ adapter pattern we can unify the two incompatible interfaces.\n\n# Lab – 6\n\
    \nFirst we create a `Player` interface to play any time of media files.\n\n`MyPlayer`\
    \ is the adapter, it unifies the interface of playing media files.\n\n```java\n\
    interface Player {\n    public void play(String type, String fileName);\n}\ninterface\
    \ AudioPlayer {\n    public void playAudio(String fileName);\n}\ninterface VideoPlayer\
    \ {\n    public void playVideo(String fileName);\n}\nclass MyAudioPlayer implements\
    \ AudioPlayer {\n    @Override\n    public void playAudio(String fileName) {\n\
    \        System.out.println(\"Playing. Name: \"+ fileName);\n    }\n}\nclass MyVideoPlayer\
    \ implements VideoPlayer {\n    @Override\n    public void playVideo(String fileName)\
    \ {\n        System.out.println(\"Playing. Name: \"+ fileName);\n    }\n}\nclass\
    \ MyPlayer implements Player {\n    AudioPlayer audioPlayer = new MyAudioPlayer();\n\
    \    VideoPlayer videoPlayer = new MyVideoPlayer();\n    public MyPlayer() {\n\
    \    }\n    @Override\n    public void play(String audioType, String fileName)\
    \ {\n        if(audioType.equalsIgnoreCase(\"avi\")) {\n            videoPlayer.playVideo(fileName);\n\
    \        } else if(audioType.equalsIgnoreCase(\"mp3\")) {\n            audioPlayer.playAudio(fileName);\n\
    \        }\n    }\n}\npublic class Main {\n    public static void main(String[]\
    \ args) {\n        MyPlayer myPlayer = new MyPlayer();\n        myPlayer.play(\"\
    mp3\", \"h.mp3\");\n        myPlayer.play(\"avi\", \"me.avi\");\n    }\n}\n```\n\
    \nThe code above generates the following result.\n\n### Output\n\n| ![](OEBPS/image_rsrc7TC.jpg)\
    \ |\n\n## 2. Bridge Pattern\n\nBridge pattern decouples an definition from its\
    \ implementation. It is a structural pattern.\n\nThis pattern involves an interface\
    \ which acts as a bridge. The bridge makes the concrete classes independent from\
    \ interface implementer classes.\n\nBoth types of classes can be altered without\
    \ affecting each other.\n\n# Lab – 7\n\n```java\ninterface Printer {\n    public\
    \ void print(int radius, int x, int y);\n}\nclass ColorPrinter implements Printer\
    \ {\n    @Override\n    public void print(int radius, int x, int y) {\n      \
    \  System.out.println(\"Color: \" + radius +\", x: \"+x+\", \"+ y + \"]\");\n\
    \    }\n}\nclass BlackPrinter implements Printer {\n    @Override\n    public\
    \ void print(int radius, int x, int y) {\n        System.out.println(\"Black:\
    \ \" + radius +\", x: \"+x+\", \"+ y + \"]\");\n    }\n}\nabstract class Shape\
    \ {\n    protected Printer print;\n}\nclass Circle extends Shape {\n    int radius,\
