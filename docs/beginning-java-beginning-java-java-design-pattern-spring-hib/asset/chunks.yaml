    \n## 7. Observer Pattern\n\nObserver pattern is used to notify its depenedent\
    \ objects if one object is modified.\n\nObserver pattern is a behavioral pattern\
    \ category.\n\n### Lab – 19\n\n```java\nimport java.util.ArrayList;\nimport java.util.List;\n\
    \nclass MyValue {\n    private List<Observer> observers = new ArrayList<Observer>();\n\
    \    private int state;\n    public int getState() {\n        return state;\n\
    \    }\n    public void setState(int state) {\n        this.state = state;\n \
    \       notifyAllObservers();\n    }\n    public void attach(Observer observer)\
    \ {\n        observers.add(observer);\n    }\n    public void notifyAllObservers()\
    \ {\n        for (Observer observer : observers) {\n            observer.update();\n\
    \        }\n    }\n}\n\nabstract class Observer {\n    protected MyValue subject;\n\
    \    public abstract void update();\n}\n\nclass PrinterObserver extends Observer\
    \ {\n    public PrinterObserver(MyValue subject) {\n        this.subject = subject;\n\
    \        this.subject.attach(this);\n    }\n    @Override\n    public void update()\
    \ {\n        System.out.println(\"Printer: \" + subject.getState());\n    }\n\
    }\n\nclass EmailObserver extends Observer {\n    public EmailObserver(MyValue\
    \ subject) {\n        this.subject = subject;\n        this.subject.attach(this);\n\
    \    }\n    @Override\n    public void update() {\n        System.out.println(\"\
    Email: \" + subject.getState());\n    }\n}\n\nclass FileObserver extends Observer\
    \ {\n    public FileObserver(MyValue subject) {\n        this.subject = subject;\n\
    \        this.subject.attach(this);\n    }\n    @Override\n    public void update()\
    \ {\n        System.out.println(\"File: \" + subject.getState());\n    }\n}\n\n\
    public class Main {\n    public static void main(String[] args) {\n        MyValue\
    \ subject = new MyValue();\n        new FileObserver(subject);\n        new EmailObserver(subject);\n\
    \        new PrinterObserver(subject);\n        subject.setState(15);\n      \
    \  subject.setState(10);\n    }\n}\n```\n\nThe code above generates the following\
    \ result.\n\nOutput\n| ![](OEBPS/image_rsrc7TS.jpg) |\n\n## 8. State Pattern\n\
    \nIn State pattern a class behavior is changed based on its state.\n\nState pattern\
    \ is a behavior pattern.\n\nWhen using State pattern, we create various state\
    \ objects and a context object whose behavior varies as its state object changes.\n\
    \n### Lab – 20\n\n```java\ninterface State {\n    public void doAction(Context\
