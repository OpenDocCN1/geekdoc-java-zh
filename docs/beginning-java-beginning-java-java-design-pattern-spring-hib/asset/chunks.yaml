    \ java.io.IOException;\nimport javax.servlet.Filter;\nimport javax.servlet.FilterChain;\n\
    import javax.servlet.FilterConfig;\nimport javax.servlet.ServletException;\nimport\
    \ javax.servlet.ServletRequest;\nimport javax.servlet.ServletResponse;\nimport\
    \ javax.servlet.http.HttpServletRequest;\nimport javax.servlet.http.HttpServletResponse;\n\
    \npublic class EncodingFilter implements Filter {\n    @Override\n    public void\
    \ destroy() {\n        // TODO Auto-generated method stub\n    }\n\n    @Override\n\
    \    public void doFilter(ServletRequest request, ServletResponse response, FilterChain\
    \ chain) throws IOException, ServletException {\n        // TODO Auto-generated\
    \ method stub\n        HttpServletRequest res = (HttpServletRequest)request;\n\
    \        HttpServletResponse req = (HttpServletResponse)response;\n        res.setCharacterEncoding(\"\
    UTF-8\");\n        req.setCharacterEncoding(\"UTF-8\");\n        chain.doFilter(res,\
    \ req);\n    }\n\n    @Override\n    public void init(FilterConfig arg0) throws\
    \ ServletException {\n        // TODO Auto-generated method stub\n    }\n}\n```\n\
    \n### 路径：`src/com/abd/util/Util.java`\n\n```java\npackage com.abd.util;\nimport\
    \ java.util.StringTokenizer;\nimport com.abd.expt.AppointmentException;\n\npublic\
    \ class Util {\n    /**\n     * 医生预约信息字符串处理\n     * 参数信息\n     * dayPattern 预约信息（14\
    \ 个整数，用逗号或空格分隔）\n     * 返回值 - 长度为 14 的整数数组\n     */\n    public static int[] parseSpDays(String\
    \ dayPattern) throws NumberFormatException {\n        int[] spDays = new int[14];\n\
    \        StringTokenizer token = new StringTokenizer(dayPattern.trim(),\", \"\
    );\n        if(token.countTokens() != 14)\n            throw new AppointmentException();\n\
    \        for(int i=0; i < 14;i++)\n            spDays[i] = Integer.parseInt(token.nextToken());\n\
    \        return spDays;\n    }\n}\n```\n\n### 路径：`src/res/AppResources.properties`\n\
    \n```properties\nerrors.password=password\nerrors.system=system\nerrors.username=username\n\
    errors.id=id\nerrors.sql=sql\nerrors.app=appointment\nerrors.io=io\nerrors.exception=exception\n\
    errors.alreadyAppointment=alreadyAppointment\nerrors.wrong=wrong\nerrors.DayAlreadyAppointment=DayAlreadyAppointment\n\
    errors.header=<font color=\"red\">\nerrors.footer=</font>\n```\n\n### 路径：`src/res/AppResources_zh.properties`\n\
    \n```properties\nerrors.password=您的密码错误！\nerrors.system=未知异常系统\nerrors.username=您的密码输入错误\n\
    errors.id=id 已存在\nerrors.sql=sql 异常\nerrors.app=预约异常\nerrors.io=io 异常\nerrors.exception=未知异常\n\
    errors.alreadyAppointment=您已经对该医生预约了预约\nerrors.wrong=您的操作错误\nerrors.DayAlreadyAppointment=预约冲突\n\
    errors.header=<font color=\"red\">\nerrors.footer=</font>\n```\n\n### 路径：`src/log4j.properties`\n\
    \n```properties\n### 将日志消息直接输出到 stdout ###\nlog4j.appender.stdout=org.apache.log4j.ConsoleAppender\n\
    log4j.appender.stdout.Target=System.out\nlog4j.appender.stdout.layout=org.apache.log4j.PatternLayout\n\
    log4j.appender.stdout.layout.ConversionPattern=%d{ABSOLUTE} %5p %c{1}:%L - %m%n\n\
    \n### 将消息直接输出到文件 hibernate.log ####\nlog4j.appender.file=org.apache.log4j.FileAppender\n\
    #log4j.appender.file.File=hibernate.log\n#log4j.appender.file.layout=org.apache.log4j.PatternLayout\n\
    #log4j.appender.file.layout.ConversionPattern=%d{ABSOLUTE} %5p %c{1}:%L - %m%n\n\
    \n### 设置日志级别 - 如需更详细的日志请将 'info' 更改为 'debug' ###\nlog4j.rootLogger=warn, stdout\n\
    #log4j.rootLogger=warn, stdout, file\n#log4j.logger.org.hibernate=info\nlog4j.logger.org.hibernate=debug\n\
    \n### 记录 HQL 查询解析器活动#\nlog4j.logger.org.hibernate.hql.ast.AST=debug\n\n### 仅记录\
    \ SQL#\nlog4j.logger.org.hibernate.SQL=debug\n\n### 记录 JDBC 绑定参数 ###\nlog4j.logger.org.hibernate.type=info\n\
    #log4j.logger.org.hibernate.type=debug\n\n### 记录 schema 导出/更新 ###\nlog4j.logger.org.hibernate.tool.hbm2ddl=debug\n\
    \n### 记录 HQL 解析树#\nlog4j.logger.org.hibernate.hql=debug\n\n### 记录缓存活动 ####\nlog4j.logger.org.hibernate.cache=debug\n\
    \n### 记录事务活动#\nlog4j.logger.org.hibernate.transaction=debug\n\n### 记录 JDBC 资源获取#\n\
    log4j.logger.org.hibernate.jdbc=debug\n### 如果您想在用 DriverManagerConnectionProvider\
    \ 时跟踪连接泄露，请启用下面行 ###### ####\nlog4j.logger.org.hibernate.connection.DriverManagerConnectionProvider=trace\n\
