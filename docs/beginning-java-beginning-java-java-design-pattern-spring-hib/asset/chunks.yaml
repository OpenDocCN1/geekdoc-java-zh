    2.  Bridge Pattern


    Bridge pattern decouples an definition from its implementation. It is a structural
    pattern.


    This pattern involves an interface which acts as a bridge. The bridge makes the
    concrete classes independent from interface implementer classes.


    Both types of classes can be altered without affecting each other.


