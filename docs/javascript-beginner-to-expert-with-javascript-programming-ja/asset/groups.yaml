    ## JavaScript Dialogue Boxes\n\nDialogue boxes are used in JavaScript to raise\
    \ a warning using alert, or ask for a confirmation, or to accept an input from\
    \ the user. To support these features, JavaScript has three types of dialogue\
    \ boxes as follows.\n\n- Alert Dialogue Box\n- Confirmation Dialogue Box\n- Prompt\
    \ Dialogue Box\n\n## Alert Dialog Box\n\nWhen we want to display a warning message\
    \ to the users in a dialogue box, then we use an alert dialogue box. E.g., when\
    \ we validate a form using submit event we do not accept any input from the user\
    \ and just need to display a warning message, in this case we use an alert box\
    \ to display such a warning message. Alert box just has one “OK” button to click\
    \ and proceed.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>On Submit Events</title>\n<script type=\"text/javascript\">\nfunction\
    \ validation() {\nif(document.form1.textbox1.value != \"\") {\nalert('Validation\
    \ Passed');\nreturn false;\n```\n\n```html\n}\nelse{\n    alert(\"Text Box field\
    \ cannot be empty!\");\n    return false;\n}\n</script>\n</head>\n<body>\n<form\
    \ name=\"form1\" method=\"GET\" action=\"onClick.html\" onSubmit=\"return validation()\"\
    >\n<input type=\"text\" name=\"textbox1\"/>\n<input type=\"submit\" value=\"Submit\"\
    \ />\n</form>\n</body>\n</html>\n```\n\n# Output\n\nWhen we execute the above\
    \ HTML program, the following will be the output. Here, we see an alert dialogue\
    \ box.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_95_0.png)\n\n## Confirmation\
    \ Dialog Box\n\nIn JavaScript language, a confirmation dialogue box is used when\
    \ we need to take user’s opinion on any option. It displays a dialog box that\
    \ has two buttons: OK button and Cancel button.\n\nWhen the user clicks on the\
    \ OK button, the window method “confirm ()” will return a true value. Otherwise,\
    \ if the user clicks on the Cancel button, then “confirm ()” method will return\
    \ a false value. The following is an example on the confirmation dialogue box.\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Confirm\
    \ Box</title>\n<script type=\"text/javascript\">\nfunction showAlert() {\nconfirm(\"\
    This is an confirm dialogue box example!\");\n}\n</script>\n</head>\n<body>\n\
    <p>Confirm box demo example.</p>\n<input type=\"button\" onclick=\"showAlert();\"\
    \ value=\"Call JavaScript\"/>\n</body>\n</html>\n```\n"
