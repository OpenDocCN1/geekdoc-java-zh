    \ the output. Here, we see a confirmation dialogue box.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_97_0.png)\n\
    \n# Prompt Dialog Box\n\nIn JavaScript language, a prompt dialog box is used when\
    \ we want to pop-up a text box that accepts the user input. Thus, it allows the\
    \ system to interact with the user. The user is required to enter the required\
    \ data into the field and then click on the OK button.\n\nSuch a dialog box is\
    \ displayed by using a method known as “prompt()”. It accepts the following two\
    \ parameters.\n\n- A label that we want to display in the text box.\n- A default\
    \ string which is display in the text box.\n\nThe prompt dialog box has the following\
    \ two buttons.\n\n- The OK button.\n- The Cancel button.\n\nWhen the user clicks\
    \ on the OK button, then the window method “prompt()” will return the value which\
    \ was entered by the user in the text box. Otherwise, if the user clicks on the\
    \ Cancel button, then the window method “prompt()” will return a null value.\n\
    \nThe following is an example on the prompt dialogue box.\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Prompt Box</title>\n<script\
    \ type=\"text/javascript\">\nfunction showAlert(){\nprompt(\"This is an prompt\
    \ dialogue box example!\");\n}\n</script>\n</head>\n<body>\n<p>Prompt dialogue\
    \ box demo example.</p>\n<input type=\"button\" onclick=\"showAlert();\" value=\"\
    Call JavaScript\"/>\n</body>\n</html>\n```\n\n# Output\n\nWhen we execute the\
    \ above HTML program, the following will be the output. Here, we see a prompt\
    \ dialogue box.\n\nPrompt dialogue box demo example.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_99_0.png)\n\
    \n# Chapter 14\n\n# JavaScript Void Keyword\n\nIn JavaScript language, the void\
    \ keyword can be used as a unary operator which is appeared before its single\
    \ operand, and may be of any type. This unary operator specifies an expression\
    \ which is required to be evaluated without any return value.\n\nThe following\
    \ is the syntax and an example of the void keyword.\n\n```\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Void Keyword Example 1</title>\n\
    </head>\n<body>\n  <p>Click here to invoke an alert!</p>\n  <a href=\"javascript:void(alert('Here\
    \ is the Void Keyword demo'))\">Click Here!</a>\n</body>\n</html>\n```\n\n# Output\n\
    \nWhen we execute the above HTML program, the following will be the output. Here,\
    \ we see an alert dialogue box that popped out on the click of the responsive\
    \ hyperlink (“Click Here!”). On the other hand, if void argument is empty there\
    \ is no response in the case of the second hyperlink (“No response link!”) as\
    \ the expression “0” has no effect in JavaScript. When “0” is evaluated, it does\
    \ not load back into the current document.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_102_0.png)\n\
    \nAlternatively, the void keyword in JavaScript is also used to generate the undefined\
    \ value as shown in the following example.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta charset=\"ISO-8859-1\">\n<title>Void Example 2</title>\n<script type=\"\
    text/javascript\">\nfunction getVoidDemo(){\nvar x,y,z;\nx = void ( y = 50, z\
    \ = 700);\ndocument.write('x = ' + x + ' y = ' + y + ' z = ' + z );\n}\n</script>\n\
    </head>\n<body>\n<p>Click to get the Result...</p>\n<form>\n<input type=\"button\"\
    \ value=\"Get Result\" onclick=\"getVoidDemo();\" />\n</form>\n</body>\n</html>\n\
    ```\n\n# Output\n\nWhen we execute the above HTML program, the following will\
    \ be the output. Here the value of the ‘x’ variable is undefined, however variables\
    \ ‘y’ and ‘z’ has the value as ‘50’ and ‘700’ respectively.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_103_0.png)\n\
    \n# Chapter 15\n\n# JavaScript Objects\n\nJavaScript language is an Object Oriented\
    \ Programming (OOP) based language which provides the following OOPs language\
    \ to the programmer.\n\n- Encapsulation – is the concept with which we can store\
    \ all the related information that includes data and methods, together in an object.\n\
    - Aggregation – is the concept which enables to store one object inside another\
    \ object.\n- Inheritance – is the concept that enables a class to inherit or re-use\
    \ the properties and methods of another class (or number of classes). It is also\
    \ known as parent class.\n- Polymorphism – is the concept that enables the programmer\
    \ to write one function/method that execute different task in different ways but\
    \ defined with the same name. Also known as method overloading.\n- Objects — are\
    \ composed of attributes. An attribute can be a function or a property. Function\
    \ is considered to be a method of the object.\n\n# Object Properties in JavaScript\n\
    \nObject properties in JavaScript can be any of the three primitive data types\
    \ (Number, String and Boolean), or any of the abstract data types (such as an\
    \ object). Object properties are the variables which are used internally in the\
    \ object’s methods. They can also be used as globally visible variables therefore,\
    \ can be used throughout the page. The following is the syntax and the example.\n\
    \n```\n<!DOCTYPE html>\n<<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Objects\
    \ Example</title>\n<script type=\"text/javascript\">\nobjectName.objectProperty\
    \ = propertyValue;\nvar str = document.title;\n</script>\n</head>\n<body>\n</body>\n\
    </html>\n```\n\nHere we are assigning the ‘propertyValue’ variable value to the\
    \ object property attribute ‘objectProperty’. The object is referred with the\
    \ name as ‘objectName’. \nIn the next statement of the above example, we are storing\
    \ the value of the document title using the “title” property of the document object\
    \ into “str” variable.\n\n# Object Methods in JavaScript\n\nObjects Methods are\
    \ the functions with which the object do manipulation or required executions.\
    \ In JavaScript, the function differs from the method in the following way: A\
    \ function is a standalone unit of statements whereas a method is attached to\
    \ an object that can be referenced by the “this” keyword.\n\nMethods can be used\
    \ to display the object contents on the HTML page. They can perform a complex\
    \ mathematical operations on objects properties attributes and the input parameters\
    \ passed to the object method. E.g., during this tutorial, we have used the “write”\
    \ method of the document object where we pass the string or text as a parameter\
    \ to be written on the HTML page.\n\n```\n<!DOCTYPE html>\n<html\n<head>\n<meta\
    \ charset=\"ISO-8859-1\">\n<title>Object Method Example</title>\n<script type=\"\
    text/javascript\">\ndocument.write(\"Welcome to JavaScript Programming!\");\n\
    </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n# User-Defined Objects in\
    \ JavaScript\n\nIn JavaScript language, all the user-defined objects as well as\
    \ built-in objects extends to an object know as Object.\n\n# The new Operator\
    \ in JavaScript\n\nThe “new” operator is used for the creation of an object instance.\
    \ In order to create an object in JavaScript, the statement has the new operator\
    \ which is followed by the constructor method as shown below. Here, the constructors\
    \ are “Object”, “Array()”, and “Date()”. These constructors are the built-in functions.\n\
    \n```\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>The\
    \ New Operator</title>\n<script type=\"text/javascript\">\nvar student = new Object();\n\
    \nvar languages = new Array(\"JavaScript\", \"Pascal\", \"Python\");\n\nvar day\
    \ = new Date(\"August 24, 1989\");\n\nalert(day);\n\n</script>\n</head>\n<body>\n\
    \n</body>\n</html>\n```\n\n# Output\n\nWhen we execute the above HTML program,\
    \ the following will be the output. Here, we are displaying the properties of\
    \ the Date object on the alert dialogue box.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_107_0.png)\n\
    \n# The “Object ()” Constructor\n\nAs discussed before, the constructor is a function\
    \ which creates and initializes a JavaScript object. A special constructor function\
    \ known as \"Object\" is used to build the object in JavaScript. The value returned\
    \ by the \"Object\" constructor is assigned to a variable known as object reference\
    \ variable. The following example demonstrates the creation of an Object in JavaScript.\n\
    \n```\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Object\
    \ Creation</title>\n<script type=\"text/javascript\">\nvar student = new Object();\n\
    student.name = \"Appy\";\nstudent.age = \"21\";\nstudent.course = \"JavaScript\"\
    ;\nfunction showDetails() {\n alert(\"Name: \"+student.name + \" Age: \"+student.age+\"\
    \nCourse: \"+student.course);\n}\n</script>\n</head>\n<body>\n<input type=\"button\"\
    \ onclick=\"showDetails();\" value=\"Get Student details!\" />\n</body>\n</html>\n\
    ```\n"
  mdcn: "\n\n# 输出\n\n当我们执行上述 HTML 程序时，将输出以下内容。在这里，我们看到了一个确认对话框。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_97_0.png)\n\
    \n# 提示对话框\n\n在 JavaScript 语言中，当我们想要弹出一个接受用户输入的文本框时，就会使用提示对话框（prompt dialog box）。因此，它允许系统与用户进行交互。用户需要在一个字段中输入所需的数据，然后点击\
    \ OK 按钮。\n\n此类对话框通过名为“prompt()”的方法显示。它接受以下两个参数：\n\n- 我们想在文本框中显示的标签。\n- 一个显示在文本框中的默认字符串。\n\
    \n提示对话框有两个按钮：\n\n- OK 按钮。\n- 取消（Cancel）按钮。\n\n当用户点击 OK 按钮时，窗口方法“prompt()”将返回用户在文本框中输入的值。否则，如果用户点击取消按钮，窗口方法“prompt()”将返回一个\
    \ `null` 值。\n\n以下是一个关于提示对话框的示例。\n\n```\n<!DOCTYPE html>\n<html\n<head>\n<meta\
    \ charset=\"ISO-8859-1\">\n<title>Prompt Box</title>\n<script type=\"text/javascript\"\
    >\nfunction showAlert(){\nprompt(\"This is an prompt dialogue box example!\");\n\
    }\n</script>\n</head>\n<body>\n<p>Prompt dialogue box demo example.</p>\n<input\
    \ type=\"button\" onclick=\"showAlert();\" value=\"Call JavaScript\"/>\n</body>\n\
    </html>\n```\n\n# 输出\n\n当我们执行上述 HTML 程序时，将输出以下内容。在这里，我们看到了一个提示对话框。\n\nPrompt dialogue\
    \ box demo example.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_99_0.png)\n\n\
    # 第 14 章\n\n# JavaScript void 关键字\n\n在 JavaScript 语言中，`void` 关键字可以用作一元运算符，出现在它的单个操作数之前，且操作数可以是任何类型。这个一元运算符指定了一个表达式，该表达式需要被求值但不产生返回值。\n\
    \n以下是 `void` 关键字的语法和示例。\n\n```\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>Void Keyword Example 1</title>\n</head>\n<body>\n  <p>Click\
    \ here to invoke an alert!</p>\n  <a href=\"javascript:void(alert('Here is the\
    \ Void Keyword demo'))\">Click Here!</a>\n</body>\n</html>\n```\n\n# 输出\n\n当我们执行上述\
    \ HTML 程序时，将输出以下内容。在这里，我们看到了点击响应式超链接（“Click Here!”）时弹出的告警对话框。另一方面，如果 `void` 参数为空，则在第二个超链接（“No\
    \ response link!”）的情况下将没有响应，因为表达式“0”在 JavaScript 中没有作用。当“0”被求值时，它不会重新加载到当前文档中。\n\
    \n![](img/80ff2aec61ff33d32cd503fad02658a7_102_0.png)\n\n或者，JavaScript 中的 `void`\
    \ 关键字也用于生成 `undefined` 值，如下例所示。\n\n```\n<!DOCTYPE html>\n<html\n<head>\n<meta\
    \ charset=\"ISO-8859-1\">\n<title>Void Example 2</title>\n<script type=\"text/javascript\"\
    >\nfunction getVoidDemo(){\nvar x,y,z;\nx = void ( y = 50, z = 700);\ndocument.write('x\
    \ = ' + x + ' y = ' + y + ' z = ' + z );\n}\n</script>\n</head>\n<body>\n<p>Click\
    \ to get the Result...</p>\n<form>\n<input type=\"button\" value=\"Get Result\"\
    \ onclick=\"getVoidDemo(); />\n</form>\n</body>\n</html>\n```\n\n# 输出\n\n当我们执行上述\
    \ HTML 程序时，将输出以下内容。在这里，变量‘x’ 的值是 `undefined`，但变量‘y’和‘z’ 的值分别为‘50’和‘700’。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_103_0.png)\n\
    \n# 第 15 章\n\n# JavaScript 对象\n\nJavaScript 语言是一种基于面向对象编程（OOP）的语言，为程序员提供了以下 OOP\
    \ 语言特性：\n\n- 封装（Encapsulation）——将所有相关信息（包括数据和方法）共同存储在对象中的概念。\n- 聚合（Aggregation）——允许将一个对象存储在另一个对象中的概念。\n\
    - 继承（Inheritance）——允许一个类继承或重用另一个类（或多个类）的属性和方法的概念。也称为父类。\n- 多态（Polymorphism）——允许程序员编写一个函数/方法，它以不同的方式执行不同的任务，但具有相同的名称定义。也称为方法重载。\n\
    - 对象（Objects）——由属性组成。属性可以是一个函数也可以是一个属性。函数被认为是对象的方法。\n\n# JavaScript 中的对象属性\n\n\
    JavaScript 中的对象属性可以是三种原始数据类型（Number、String 和 Boolean）中的任意一种，也可以是抽象类型（如对象）。对象属性可以通过赋值操作来定义。对象属性可以通过点运算符来访问。以下是对象的语法和示例。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Objects</title>\n\
    <script type=\"text/javascript\">\nvar objectName = new Object();\nobjectName.property\
    \ = \"value\";\ndocument.write(objectName.property);\n</script>\n</head>\n<body>\n\
    </body>\n</html>\n```\n\n# JavaScript 中的对象方法\n\n对象方法是附加到对象的函数。在 JavaScript 中，函数是独立的单元，而方法是对象的属性。方法可以对对象进行复杂的操作。在教程中，我们使用了\
    \ `write` 方法来显示内容。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>Object Method</title>\n<script type=\"text/javascript\"\
    >\ndocument.write(\"Welcome to JavaScript!\");\n</script>\n</head>\n<body>\n</body>\n\
    </html>\n```\n\n# JavaScript 中的自定义对象\n\n在 JavaScript 语言中，所有的自定义对象以及内置对象继承自 Object。\n\
    \n# JavaScript 中的 new 运算符\n\n`new` 运算符用于创建对象的实例。在 JavaScript 中创建一个对象，需要使用 `new`\
