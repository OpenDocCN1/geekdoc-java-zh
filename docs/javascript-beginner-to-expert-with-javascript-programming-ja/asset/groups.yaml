    \ HTML 页面上写入了文本。\n\n## Switch case 语句\n\n从 JavaScript 1.2 版本开始，它开始支持 switch 语句，处理与重复\
    \ if...else 语句相同的情况。\n\nswitch 语句用于根据表达式的值提供不同的语句。JavaScript 解释器会检查每个 case 是否匹配表达式的值，直到找到匹配。如果没有找到匹配，则使用\
    \ default 条件。\n\n此外，在 case 代码语句末尾存在 break 语句。如果在这里没有声明 break，解释器将继续执行后续 case 中的语句。\n\
    \n以下是 switch case 语句的语法示例。\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta\
    \ charset=\"ISO-8859-1\">\n<title>Switch Case 语句</title>\n</head>\n<body>\n<script\
    \ type=\"text/javascript\">\n  var expensecode='X';\ndocument.write(\"进入 switch块<br\
