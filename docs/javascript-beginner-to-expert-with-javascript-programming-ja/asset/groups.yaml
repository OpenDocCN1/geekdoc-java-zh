    - From there, select **Enable JavaScript** checkbox.\n- Lastly, click OK button\
    \ to enable the JavaScript support in Opera browser.\n\nSimilarly, to disable\
    \ the JavaScript support in Opera browser, we should not select the **Enable JavaScript**\
    \ checkbox and click on the OK button.\n\n## Warning for Non-JavaScript Browsers\n\
    \nWhen we have to do something very important by using the JavaScript, then we\
    \ can show a warning message to the user by using the<noscript> tags. We can add\
    \ a noscript block immediately after the script block as shown below.\n\n```html\n\
    <!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>No Script\
    \ tag</title>\n</head>\n<body>\n<script type=\"text/javascript\">\ndocument.write(\"\
    JavaScript Support is enabled on your browser!\");\n</script>\n<noscript>\nPlease\
    \ enable JavaScript support on your browser.\n</noscript>\n</body>\n</html>\n\
    ```\n\nIf any of the above browser does not support JavaScript or JavaScript support\
    \ is disabled, then the message between the <noscript></noscript> tags will be\
    \ shown on the screen.\n\n## Chapter 6\n# JavaScript Placement\n\nPlacement of\
    \ JavaScript code in the HTML document is very flexible and can be placed in the\
    \ following ways.\n\n**JavaScript in <head>...</head> section** — It is the most\
    \ preferred way to include the JavaScript code in the head section of the HTML\
    \ document. We can place the JavaScript code or functions in the head section\
    \ and can access these functions on the web elements events as shown below.\n\n\
    ```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>JS\
    \ in head section</title>\n<script type=\"text/javascript\">\n  function showAlert(){\n\
    \    alert(\"This is an alert from Head section!\");\n  }\n</script>\n</head>\n\
    <body>\n  <input type=\"button\" onclick=\"showAlert();\" value=\"Call JavaScript\"\
    />\n</body>\n</html>\n```\n\n# Output\n\nWhen we execute the above HTML program,\
    \ the following will be the output. In the output, we can see the alert with a\
    \ message as “This is an alert from Head section”, when we click on the button\
    \ on the web page.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_34_0.png)\n\n**JavaScript\
    \ in <body>...</body> section** — we can also place the JavaScript code in the\
    \ body section of the HTML code, however this approach is not preferred as we\
    \ call JavaScript functions from body section which are preferably defined in\
    \ the head section of the HTML document.\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n<title>JS Body</title>\n</head>\n<body>\n\
    <script type=\"text/javascript\">\ndocument.write(\"Welcome to JavaScript Tutorials!\"\
    )\n</script>\n<p>Body section of the HTML document.</p>\n</body>\n</html>\n```\n\
    \n# Output\n\nWhen we execute the above HTML program, the following will be the\
    \ output. In the output, we can see the text \"Welcome to JavaScript Tutorials!\"\
    \ written via JavaScript on the HTML page which is placed in its body section.\n\
    \n![](img/80ff2aec61ff33d32cd503fad02658a7_35_0.png)\n\nJavaScript in <body>...</body>\
    \ and <head>...</head> sections — in this approach, the JavaScript code is placed\
    \ in both the head and the body section of the HTML document as shown in the following\
    \ example.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>JS Head and Body</title>\n<script type=\"text/javascript\">\nfunction\
    \ showAlert() {\nalert(\"This is an alert from Head section!\");\n}\n</script>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\n  document.write(\"Welcome\
    \ to JavaScript Tutorials!\");\n</script>\n<p>Body section of the HTML document.</p>\n\
    <input type=\"button\" onclick=\"showAlert();\" value=\"Call JavaScript\"/>\n\
    </body>\n</html>\n```\n\n# Output\n\nWhen we execute the above HTML program, the\
    \ following will be the output. In the output, we can see the text \"Welcome to\
    \ JavaScript Tutorials!\" written via JavaScript on the HTML page which is placed\
    \ in its body section. At the same time, when we click on the button, it will\
    \ display an alert message \"This is an alert from Head section\". This is the\
    \ JavaScript function called on click event of the button which is defined in\
    \ the head section of the HTML document.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_36_0.png)\n\
    \n# JavaScript placed in and external file and include in <head>...</head> section\
    \ — it is one of the best approach of placing all the JavaScript code in an external\
    \ file with file extension as js.js and we include this in the head section of\
    \ the HTML document. All the functions which are present in this file can be called\
    \ on various web elements defined in the body section of the HTML document. In\
    \ the following example we have declared the function showAlert() in a separate\
    \ file \"demo.js\" located in js directory.\n\n```javascript\nfunction showAlert(){\n\
    \    alert(\"This is an alert from Head section!\");\n}\n```\n\nWe are including\
    \ this external JavaScript file in the head section of the HTML document as shown\
    \ below.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\"\
    >\n<title>JS External File</title>\n<script type=\"text/javascript\" src=\"js/demo.js\"\
    ></script>\n</head>\n<body>\n  <input type=\"button\" onclick=\"showAlert()\"\
    \ value=\"Call JavaScript\" />\n</body>\n</html>\n```\n\n# Output\n\nWhen we execute\
    \ the above HTML program, the following will be the output. In the output, we\
    \ can see the alert with a message as “This is an alert from Head section”, this\
    \ is the JavaScript function called on click event of the button which is defined\
    \ in the external file and included in the head section of the HTML document.\
    \ This works the same way as if we include the JavaScript code in the head section\
    \ of the HTML document.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_38_0.png)\n\
    \n## Chapter 7\n# JavaScript Variables\n\nDatatypes in JavaScript is the characteristic\
