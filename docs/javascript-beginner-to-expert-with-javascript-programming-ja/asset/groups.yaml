    );\nbreak;\ncase 'Y': document.write(\"<b>你有足够的钱花了!</b>\");\nbreak;\ncase 'Z':\
    \ document.write(\"<b>虽然你有足够的钱但需要小心!</br>\");\nbreak;\ndefault: document.write(\"\
    未找到匹配!<br/>\");\n}\ndocument.write(\"<br>退出 switch块<br/>\");\n</script>\n<p>我们处于\
    \ body 区域内部...</p>\n</body>\n</html>\n```\n\n## ## 输出\n\n当我们执行上述 HTML 程序时，输出将是如下所示。程序在\
