  mdcn: "\n通常，所有的 JavaScript 语句都以分号结尾。但当每个 JavaScript 语句都放置在单独的一运行时，这些分号是可选的。在每个 JavaScript\
    \ 语句的末尾使用分号被认为良好的编程习惯。\n\n## 大小写敏感\n\nJavaScript 语言是一种大小写敏感的语言。这意味着，关键字、变量、函数名、标识符等应该使用一致的大小写字母。例如，从\
    \ JavaScript 语言的角度来看，标识符 `learn` 和 `LEARN` 是不同的。\n\n## JavaScript 中的注释\n\n以下是\
    \ JavaScript 语言支持的注释样式。\n\n- 单行注释声明为 `//`（双斜杠）。\n- 多行注释声明为 `/* 多行中的 JavaScript\
    \ 语句 */`。它也适用于单行注释。\n- 它还能识别 HTML 注释（起始序列）`<!--`。JavaScript 将其视为单行注释，就像处理 // 注释一样。\n\
    - HTML 的结束序列 `-->` 不被 JavaScript 识别，因此应该写成 `//->`。\n\n以下是一个涵盖各种 JavaScript 注释的示例。\n\
    \n```\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>JavaScript\
    \ Comments</title>\n</head>\n<body>\n  <script type=\"text/javascript\">\n<!--\
    \ 起始序列单行注释。 \n  结束序列 HTML 注释//-->\n  // 这是一个单行注释。\n  /*\n  * 这是 JavaScript 中的一个多行注释\n\
    \  */\n</script>\n</body>\n</html>\n```\n\n输出\n\n当我们执行上述 HTML 程序时，输出将是以下内容（空白），因为\
    \ JavaScript 解释器忽略了所有的注释。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_19_0.png)\n\
    \n## JavaScript 语法\n\n和其他任何其他编程语言一样，JavaScript 语法有一套特定的规则来构建它们。\n\n## JavaScript\
    \ 中的程序\n\nJavaScript 程序是一系列由浏览器程序解析并执行的指令序列。这些程序指令序列被称为语句。\n\nJavaScript 是一种基于对象的编程语言。\n\
    \nJavaScript 语句通常用分号分隔，然而在语句末尾放置分号是可选的。\n\n```\n<!DOCTYPE html>\n<html\n<head>\n\
    <meta charset=\"ISO-8859-1\">\n<title>JavaScript Syntax</title>\n<script type=\"\
    text/javascript\">\nvar a = 101;\nvar b = 300;\nvar sum = a + b;\n</script>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\ndocument.write(\"sum of a\
    \ + b = \"+sum);\n</script>\n</body>\n</html>\n```\n\n## 输出\n\n当我们执行上述 HTML 程序时，输出将是以下内容。\n\
    \n![](img/80ff2aec61ff33d32cd503fad02658a7_21_0.png)\n\n## JavaScript 中的语句\n\n\
    JavaScript 编程语言中的语句由以下部分组成。\n\n- 值\n- 运算符\n- 表达式\n- 关键字，以及\n- 注释。\n\n## JavaScript\
    \ 中的值\n\n以下是 JavaScript 中的两种类型的值。\n\n- 固定值，以及\n- 变量值。\n\n字面量是固定值，而变量值被称为变量。\n\n\
    ## JavaScript 中的字面量\n\n以下是在 JavaScript 中编写字面量或固定值的规则。\n\n- 数字可以带小数也可以不带小数定义。\n\
    - 字符串是写在单引号或双引号内的文本。\n\n## JavaScript 中的变量\n\n以下是用于在 JavaScript 中存储数据的变量值的编写规则。\n\
    \nJavaScript 语言使用 `var` 关键字来声明变量。\n\n变量的值通过等号赋值。\n\n## JavaScript 中的运算符\n\n以下是\
    \ JavaScript 语言中使用的运算符。\n\n**赋值运算符 (=)** 用于给变量赋值。\n\n**算术运算符 (+-\\*)** 用于加法、减法、乘法和除法等算术运算。\n\
    \n## JavaScript 中的表达式\n\nJavaScript 语言中的任何表达式都是值、变量和运算符的组合。它们共同进行计算。这种计算被称为求值。\n\
    \n表达式也可以包含变量值，例如数字和字符串。例如，“Java” + “Script”将拼接为“JavaScript”。\n\n让我们通过以下示例理解这一点。\n\
    \n```\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\">\n```\n\n\
    ## JS 表达式\n\n```\n<title>JS Expressions</title>\n<script type=\"text/javascript\"\
    >\n  var a = 101; //变量，赋值运算符和数字字面量。\n  var b = 300;\n  var addition = a + b;\n\
    \  var str1 = \"Java\"; //变量，赋值运算符和字符串字面量。\n  var str2 = \"Script\";\n  var str3\
    \ = str1 + str2;\n</script>\n</head>\n<body>\n<script type=\"text/javascript\"\
    >\n  document.write(\"Addition of a + b = \"+addition);\n  document.write(\"<br>Concat\
    \ of str1 + str2 = \"+str3\");\n</script>\n</body>\n</html>\n```\n\n## 输出\n\n\
    当我们执行上述 HTML 程序时，输出将是以下内容。输出显示了加法和拼接操作。\n\n## JavaScript 中的关键字\n\nJavaScript 语言中的关键字用于标识需要执行的操作。`var`\
    \ 关键字引导浏览器创建一个作为 JavaScript 标识符的新变量。在 JavaScript 语言中，标识符用于用于命名变量（以及关键字、函数和标签）。\n\
    \n在 JavaScript 语言中，第一个字符必须是字母、下划线 (_) 或美元符号 ($)。随后的字符可以是字母、数字、下划线或美元符号。\n\n##\
    \ 驼峰命名法与 JavaScript\n\n以下是将多个单词组合为一个变量名的三种方法。\n\n- 连字符 — 例如，first-address，second-address，visa-passport，city-name\
    \ 等。\n- 下划线 — 例如，first_address，second_address，visa_passport，city_name 等。\n- 驼峰命名法\
    \ — 例如，FirstAddress，SecondAddress，VisaPassport，InterName 等。在 JavaScript 编程语言中，驼峰命名法以小写字母开始，例如\
    \ firstName，secondAddress，visaPassport，cityName 等。\n\n## JavaScript 中的字符集\n\n\
    JavaScript 语言使用 Unicode 字符集，它涵盖了所有的字符、标点和符号。\n\n## 第 5 章\n\n## JavaScript 的启用与禁用\n\
    \nInternet Explorer、Mozilla Firefox、Google Chrome、Opera 等网络浏览器都内置了 JavaScript\
    \ 支持。我们可以手动启用或禁用它。在本章中，我们将讨论在这些浏览器中启用和禁用 JavaScript 的过程。\n\n## 在 Internet Explorer\
    \ 中启用 JavaScript\n\n以下是在 Internet Explorer 中开启或启用 JavaScript 支持的步骤。\n\n- 从菜单导航到“Internet\
    \ 选项”。\n- 从对话框中选择“安全”选项卡。\n- 点击“自定义”按钮。\n- 向下滚动菜单找到“脚本”选项。\n- 选择活动脚本标题下的“启用脚本”单选框。\n\
    - 最后，点击“确定”按钮以启用浏览器的 JavaScript。\n\n## 在 Internet Explorer 中禁用 JavaScript\n\n\
    要关闭或禁用 Internet Explorer 中的 JavaScript 支持，请遵循上述步骤并选择活动脚本标题下的“禁用”单选框。\n\n## 在 Mozilla\
    \ Firefox 中启用 JavaScript\n\n以下是在 Mozilla Firefox 中开启或启用 JavaScript 支持的步骤。\n\n\
    打开新标签页并在地址栏中输入 *about:config*。\n\n在那里我们将发现如下警告对话框，选择并点击按钮“我会小心的，我保证！”所示。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_27_0.png)\n\
    \n在这里，我们将观察浏览器中的配置选项列表。在搜索框中输入 `javascript.enabled` 所示。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_27_1.png)\n\
    \n在这里，我们可以通过右键点击选项的值来切换启用或禁用 JavaScript。\n\n点击切换后，如果 javascript.enabled 为 true，它将转换为\
    \ false。这将禁用 Mozilla Firefox 浏览器的 JavaScript 支持。\n\n## 在 Mozilla Firefox 中禁用 JavaScript\n\
    \n以下是关闭或禁用 Mozilla Firefox 中 JavaScript 支持的步骤。如果 JavaScript 已禁用，可以按照之前说明的类似步骤点击切换来启用。\n\
    \n## 在 Google Chrome 中启用或禁用 JavaScript 支持\n\n以下是在 Google Chrome 中启用或禁用 JavaScript\
    \ 支持的步骤。\n\n点击 Chrome 右角的 Chrome 菜单\n"
