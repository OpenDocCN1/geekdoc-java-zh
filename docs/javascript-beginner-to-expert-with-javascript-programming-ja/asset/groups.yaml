- md: "\n## Chapter 10\n## JavaScript Loops\n\nWhen any program is executed, it runs\
    \ sequentially. The statement which appears first in the sequence is executed\
    \ first then the next statement and so on till the last statement of the program.\
    \ Many times there is a requirement to run same block of code in a program multiple\
    \ times then there arises a need of a control structure known as loops.\n\nA loop\
    \ makes a statement or group of statements in a block of code to execute multiple\
    \ times if the condition is true and exits the loop when the condition becomes\
    \ false. Such loop is illustrated in the below diagram.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_64_0.png)\n\
    \nLike any other programming language, the JavaScript support looping and the\
    \ following types of loops and the loop control statements.\n\n- While loop\n\
    - Do...while loop\n- For loop\n- for...in loop\n\n### Loop control statements\n\
    \n### While loop statement\n\nWhile loop is the most basic loop in JavaScript\
    \ language. This loop execute a statement or piece of code block repeatedly as\
    \ long as an expression is held true. The loop terminates, once the expression\
    \ is false. The following is the syntax and the example of while loop statement.\n\
    \n```html\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>While\
    \ Loop</title>\n</head>\n<body>\n<script type=\"text/javascript\">\nvar counter\
    \ = 0;\ndocument.write(\"Entering while Loop!\");\nwhile (counter < 5) {\ndocument.write(\"\
    Current Counter is : \" + counter + \"<br />\");\ncounter++;\n}\ndocument.write(\"\
    Exiting while Loop!\");\n</script>\n<p>We are inside body section...</p>\n</body>\n\
    </html>\n```\n\n### Output\n\nWhen we execute the above HTML program, the following\
    \ will be the output. The counter will write 5 times on the HTML page as it held\
    \ its condition true 5 times.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_66_0.png)\n\
    \n### Do...while loop statement\n\nThe do...while loop is similar to that of the\
    \ while loop except that the condition check in case of do...while loop happens\
    \ at the end of the loop. This means that the code block inside the loop will\
    \ always be executed at least once, even if the condition is false. The following\
    \ is the syntax and the example of while loop statement.\n\n```html\n<!DOCTYPE\
    \ html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Do While Loop</title>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\nvar counter = 0;\ndocument.write(\"\
    Entering while Loop!\");\ndo {\n  document.write(\"Current Counter is : \" + counter\
    \ + \"<br/>\");\n  counter++;\n}\nwhile (counter < 5) {\n  document.write(\"Exiting\
    \ while Loop!\");\n}\n</script>\n<p>We are inside body section...</p>\n</body>\n\
    </html>\n```\n\n### Output\n\nWhen we execute the above HTML program, the following\
    \ will be the output. The counter will write 5 times on the HTML page as it held\
    \ its condition true 5 times including the first no check condition.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_67_0.png)\n\
    \n### For loop statement\n\nThe ‘for’ loop is very important and mostly used looping\
    \ statement in JavaScript programming. The command has the following three important\
    \ parts.\n\n- **Loop initialization** — it is where we initialize our counter\
    \ value to a starting value. This statement is executed before the looping begins.\n\
    - **Test statement** — it has the actual condition which is evaluated to be true\
    \ or false. If this condition evaluates to true, then the block of code inside\
    \ the loop will be executed, otherwise, if false the control will exit the loop.\n\
    - **Iteration statement** — it is place we increase or decrease the counter value\
    \ which was initialized in the first statement.\n\nThe good part of loop is that\
    \ we can put all of these three statement parts in a single line which is separated\
    \ by semicolons. The following is the syntax and the example.\n\n```html\n<!DOCTYPE\
    \ html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>For Loop</title>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\ndocument.write(\"Entering\
    \ while Loop!\");\nfor(counter = 0;counter < 5; counter++) {\ndocument.write(\"\
    Current Counter is : \" + counter + \"<br />\");\n}\ndocument.write(\"Exiting\
    \ while Loop!\");\n</script>\n<p>We are inside body section...</p>\n</body>\n\
    </html>\n```\n\n### Output\n\nWhen we execute the above HTML program, the following\
    \ will be the output. The counter will write 5 times on the HTML page as it held\
    \ its condition true 5 times till the counter value becomes 5 and the loop exits.\n\
    \n![](img/80ff2aec61ff33d32cd503fad02658a7_69_0.png)\n\n### For...in loop statement\n\
    \nThe for...in loop is used only in the special cases where there is need to loop\
    \ through an object's properties. The following is the syntax and the example\
    \ for for..in loop.\n\n```html\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"\
    ISO-8859-1\">\n<title>For In Statement</title>\n</head>\n<body>\n<script type=\"\
    text/javascript\">\nvar prop;\ndocument.write(\"Object Properties of Navigator\
    \ <br /> \");\ndocument.write(\"Entering the loop!\");\nfor (prop in navigator)\
    \ {\ndocument.write(prop);\ndocument.write(\"<br/>\");\n}\ndocument.write(\"Exiting\
    \ the loop!\");\n</script>\n<p>We are in the body section...</p>\n</body>\n</html>\n\
    ```\n\n### Output\n\nWhen we execute the above HTML program, the following will\
    \ be the output. In the output, we have iterated through the “navigator” object\
    \ and displayed all the object properties of the web browser’s navigator object.\n\
    \n![](img/80ff2aec61ff33d32cd503fad02658a7_70_0.png)\n\n### Summary of Loops in\
    \ JavaScript\n\n| Loop Type | Description |\n|---|---|\n| while loop | While loop\
    \ type, repeats a statement or group of statements while a given condition is\
    \ true. It tests the condition each time it executes the loop body and exits the\
    \ loop when condition becomes false. |\n| for loop | For loop type executes a\
    \ sequence of statements multiple times and abbreviates the code that manages\
    \ the loop variable. |\n| nested loops | It is a loop within a loop. In JavaScript,\
    \ we can use a loop in another while or for loop or for loop in another while\
    \ or for loop. |\n\n### Loop control statements\n\nLoop control statements in\
    \ JavaScript language are used to change execution from its normal sequence. When\
    \ such execution leaves a scope, all automatic objects created in that scope are\
    \ destroyed or removed.\n\nIn JavaScript language, the following loop control\
    \ statements are supported.\n\n| Control Statement | Description |\n|---|---|\n\
    | break statement | The break statement in JavaScript is used to terminate the\
    \ loop statement and transfers execution to the statement immediately following\
    \ after the end of loop. |\n| continue statement | The continue statement in JavaScript\
    \ is used to cause the loop to skip the remainder of. |\n\nLet's understand these\
    \ loop control in a better way with the help of the following example.\n\n```html\n\
    <!DOCTYPE html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Loop Control\
    \ Statement</title>\n</head>\n<body>\n<script type=\"text/javascript\">\nvar counter\
    \ = 0;\ndocument.write(\"Entering while Loop!\");\nwhile (counter < 5) {\n  if\
    \ (counter == 3){\n    counter++;\n    continue;\n  }\n  if (counter == 4){\n\
    \    break;\n  }\ndocument.write(\"Current Counter is : \" + counter + \"<br />\"\
    );\ncounter++;\n}\ndocument.write(\"Exiting while Loop!\");\n</script>\n<p>We\
    \ are inside body section...</p>\n</body>\n</html>\n```\n\n### Output\n\nWhen\
    \ we execute the above HTML program, the following will be the output. In the\
    \ output, we can see that the counter value are printed 3 times (0, 1 and 2) and\
    \ then the loop exited. This is because when the counter value has become 3, we\
    \ are executing continue loop statement where it has incremented the counter to\
    \ 4 and has skipped the document part. When the counter value has become 4, we\
    \ are executing break loop control statement which will eventually out from the\
    \ current loop.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_73_0.png)\n\n## Chapter\
    \ 11\n## JavaScript Functions\n\nA function may be defined as a block of code\
    \ that is well organized and reusable multiple times to perform a number of operations\
    \ in a program that demands high modularity and reusability. It eliminates the\
    \ need of writing the same piece of code again and again. Like any other programming\
    \ language, the JavaScript language also supports the required features to write\
    \ modular code by using functions. Since the beginning of this tutorials, we are\
    \ using functions like \"alert()\" and \"write()\" gives us a little hint about\
    \ the operations of the functions. These functions are in-built JavaScript functions.\
    \ In JavaScript language, we can write our own functions like any other programming\
    \ language that we are going to learn in this chapter.\n\n### Function Definition\n\
    \nFunctions are usable at any point in the code for which we have to define them\
    \ only once. In JavaScript, we define a function by using the function keyword\
    \ which is followed by a unique function name, a list of parameters (that could\
    \ be empty), and a statement block surrounded by curly braces. The following is\
    \ the syntax and the example of the JavaScript function.\n\n```html\n<!DOCTYPE\
    \ html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Function Definition</title>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\n```\n"
  mdcn: "\n\n## 第 10 章\n## JavaScript 循环\n\n当任何程序执行时，它都是按顺序运行的。出现在序列中第一条语句首先执行，然后是下一条语句，依此类推，直到程序的最后一条语句。很多时候，需要在程序中多次运行相同的代码块，这时就产生了被称为“循环”的控制结构的需求。\n\
    \n循环使代码块中的某条语句或一组语句在条件为真时执行多次，并在条件变为假时退出循环。下图展示了这种循环的插图。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_64_0.png)\n\
    \n与任何其他编程语言一样，JavaScript 也支持循环，以及以下类型的循环和循环控制语句。\n\n- While 循环\n- Do...while 循环\n\
    - For 循环\n- for...in 循环\n\n### 循环控制语句\n\n### While 循环语句\n\nWhile 循环是 JavaScript\
    \ 语言中最基础的循环。只要表达式保持为真，该循环就会重复执行一条语句或代码块。一旦表达式为假，循环就会终止。以下是 while 循环语句的语法和示例。\n\
    \n```html\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>While\
    \ Loop</title>\n</head>\n<body>\n<script type=\"text/javascript\">\nvar counter\
    \ = 0;\ndocument.write(\"Entering while Loop!\");\nwhile (counter < 5) {\ndocument.write(\"\
    Current Counter is : \" + counter + \"<br />\");\ncounter++;\n}\ndocument.write(\"\
    Exiting while Loop!\");\n</script>\n<p>We are inside body section...</p>\n</body>\n\
    </html>\n```\n\n### 输出\n\n当我们执行上述 HTML 程序时，输出将如下所示。计数器会在 HTML 页面上写入 5 次，因为它的条件保持了\
    \ 5 次真。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_66_0.png)\n\n### Do...while\
    \ 循环语句\n\ndo...while 循环与 while 循环相似，不同在于 do...while 循环中的条件检查发生在循环的末尾。这意味着即使条件为假，循环内部的代码块也至少会被执行一次。以下是\
    \ while 循环语句的语法和示例（注：原文此处误写为 while loop statement）。\n\n```html\n<!DOCTYPE html>\n\
    <html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Do While Loop</title>\n</head>\n\
    <body>\n<script type=\"text/javascript\">\nvar counter = 0;\ndocument.write(\"\
    Entering while Loop!\");\ndo {\n  document.write(\"Current Counter is : \" + counter\
    \ + \"<br/>\");\n  counter++;\n}\nwhile (counter < 5) {\n  document.write(\"Exiting\
    \ while Loop!\");\n}\n</script>\n<p>We are inside body section...</p>\n</body>\n\
    </html>\n```\n\n### 输出\n\n当我们执行上述 HTML 程序时，输出将如下所示。计数器会在 HTML 页面上写入 5 次，包括第一次没有检查条件，它的条件保持了\
    \ 5 次真。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_67_0.png)\n\n### For 循环语句\n\
    \n‘for’循环是 JavaScript 编程中非常重要且常用的循环语句。该命令包含以下三个重要部分：\n\n- **循环初始化** — 这是我们初始化计数器值为一个起始值的地方。该语句在循环开始之前执行。\n\
    - **测试语句** — 它包含实际的条件，该条件会被评估为真或假。如果该条件评估为真，则将执行循环内部的代码块；否则，如果为假，控制流将退出循环。\n-\
    \ **迭代语句** — 这是我们增加或减少在第一条语句中初始化的计数器值的地方。\n\n循环的好处是，我们可以将这三个语句部分放在同一行中，并用分号分隔。以下是语法和示例。\n\
    \n```html\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>For\
    \ Loop</title>\n</head>\n<body>\n<script type=\"text/javascript\">\ndocument.write(\"\
    Entering while Loop!\");\nfor(counter = 0;counter < 5; counter++) {\ndocument.write(\"\
    Current Counter is : \" + counter + \"<br />\");\n}\ndocument.write(\"Exiting\
    \ while Loop!\");\n</script>\n<p>We are inside body section...</p>\n</body>\n\
    </html>\n```\n\n### 输出\n\n当我们执行上述 HTML 程序时，输出将如下所示。计数器会在 HTML 页面上写入 5 次，因为它在循环结束前其条件保持了\
    \ 5 次真。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_69_0)\n\n### for...in 循环\n\
    \nfor...in 循环用于遍历对象的属性。以下是 for...in 循环的语法和示例。\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n<title>For Loop</title>\n</head>\n<body>\n\
    <script type=\"text/javascript\">\ndocument.write(\"Entering while Loop!\");\n\
    for (prop in document) {\ndocument.write(prop);\n}\ndocument.write(\"Exiting while\
