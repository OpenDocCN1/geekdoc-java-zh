    <body>\n<div onmouseover=\"hoverMouse();\"\nonmouseout=\"hoverMouseOut();\">\n\
    <h1> 将鼠标悬停在这里查看变化 </h1>\n</div>\n</body>\n</html>\n```\n\n# 输出\n\n当我们执行上述 HTML\
    \ 程序时，将输出以下。在这里，当我们将鼠标悬停在标题 div 上时，可以看到警告消息被调用。同样，当我们将鼠标移出该区域时，我们会看到另一个关于移出标题\
    \ div 的警告。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_85_0.png)\n\n"
