    \ 语句。\n- if...else if... 语句。\n- Switch case 语句。\n\n让我们通过 JavaScript 程序来理解这些语句。\n\
    \n**if 语句** — if 语句是一种基础控制语句，允许 JavaScript 代码根据所需的条件做出决策并执行语句。以下是其语法。\n\n## 语法与示例\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>基础\
    \ IF 语句</title>\n</head>\n<body>\n<script type=\"text/javascript\">\nvar salary\
    \ = 10000;\nvar expenses = 12000;\nif (expenses > salary) {\ndocument.write(\"\
    <b>请开始增加收入或减少开支!</body>\");\n}\n</script>\n<p>我们处于 body 区域内部...</p>\n```\n\n##\
