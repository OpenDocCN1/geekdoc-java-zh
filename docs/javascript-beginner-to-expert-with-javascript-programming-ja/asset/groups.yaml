    \ 文档的 body 部分。</p>\n</body>\n</html>\n```\n\n# 输出\n\n当我们执行上述 HTML 程序时，将输出以下内容。在这里，我们在按钮的点击事件上调用\
    \ JavaScript 函数，在 HTML 页面上显示消息，消息是从定义 JavaScript 函数的 HTML 头部部分获取的。在这里，我们在 “writeToDoc”\
    \ 函数中传递了三个字符串作为参数，该函数调用了 “concatString” 函数，后者返回拼接后的字符串并写在文档上。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_79_0.png)\n\
    \n# 第 12 章\n\n# JavaScript 事件\n\nJavaScript 事件是 JavaScript 与 HTML 文档交互的手段。当用户或浏览器对\
    \ HTML 页面上的任何值进行操作时，这些事件就会被触发。例如，当我们加载一个 HTML 页面时，这被称为一个事件。同样，当我们点击页面上的按钮时，这也是一个事件。我们可以考虑其他事件的示例，例如按下任何键、通过按钮提交表单、更改窗口大小等。\n\
    \n程序员可以使用这些 JavaScript 事件来触发并执行 JavaScript 代码编写的响应。这些响应包括点击按钮时关闭窗口、向用户显示警告消息、验证数据等。JavaScript\
    \ 事件是对象模型 (DOM) 的一部分。能够触发 JavaScript 代码。\n\n# onclick 事件\n\n```html\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>点击事件</title>\n\
    <script type=\"text/javascript\">\nfunction showAlert() {\n  alert(\"Welcome to\
    \ the world of JavaScript!\");\n}\n</script>\n</head>\n<body>\n  <input type=\"\
    button\" onclick=\"showAlert();\" value=\"Call JavaScript\"/>\n</body>\n</html>\n\
    ```\n\n# 输出\n\n执行上述 HTML 程序时，将输出。在这里，我们在按钮的点击事件上调用了 JavaScript 函数，显示一个警告框。\n\n\
    ![](img/80ff2aec61ff33d32cd503fad02658a7_82_0.png)\n\n# onsubmit 事件\n\n当我们在提交表单时，这种事件类型进入。我们也可以在此事件类型进行验证。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>提交事件</title>\n\
    <script type=\"text/javascript\">\nfunction validation() {\n  if(form1.textbox1.value\
    \ != \"\") {\n    alert('验证通过');\n    return true;\n  }\n  else{\n    alert('文本框不能为空!');\n\
    \    return false;\n  }\n}\n</script>\n</head>\n<body>\n<form name=\"form1\" method=\"\
    GET\" action=\"onClickEvent.html\" onsubmit=\"return validation()\">\n<input type=\"\
    text\" name=\"textbox1\"/>\n<input type=\"submit\" value=\"Submit\" />\n</form>\n\
    </body>\n</html>\n```\n\n# 输出\n\n当我们执行上述 HTML 程序时，将输出。在这里，我们在验证文本框，如果没有输入值并点击提交按钮，它将向表单返回\
    \ false 并显示“文本框不能为空！”的警告消息。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_84_0.png)\n\
    \n# onmouseover 和 onmouseout 事件类型\n\n这两种是流行的鼠标事件类型，帮助我们为图像或文本创建良好的效果。当我们将鼠标悬停在\
