    \n# Chapter 12\n\n# JavaScript Events\n\nJavaScript Events are the means through\
    \ which JavaScript interacts with the HTML document. These events are triggered\
    \ when any value is manipulated on the HTML page either by the user or the browser.\
    \ E.g. when we load an HTML page, it is known as an event. Similarly, when we\
    \ click a button on the page, it is also an event. We can think of other examples\
    \ of events such as pressing any key, submitting a form through button, changing\
    \ the size of a window, etc.\n\nProgrammers can use these JavaScript events to\
    \ trigger and execute JavaScript coded responses. These responses includes closing\
    \ of a window on button click, displaying alert message to user, validating the\
    \ form data, etc.\n\nJavaScript events are the part of the Document Object Model\
    \ (DOM) Level 3. All HTML web element contains a set of events which are capable\
    \ of triggering JavaScript function code.\n\nThe following are the few examples\
    \ to understand the relation between Event and invoking JavaScript function code.\n\
    \n# onclick Event Type\n\nIt is the most frequently used event type that triggers\
    \ a JavaScript code when we left click the button of mouse on HTML page or web\
    \ element. Here, we can put our validation, etc., against this event type. The\
    \ following example demonstrates this event.\n\n```html\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n<title>On Click Events</title>\n<script\
    \ type=\"text/javascript\">\nfunction showAlert() {\n  alert(\"This is an alert\
    \ on onclick event!\");\n}\n</script>\n</head>\n<body>\n  <input type=\"button\"\
    \ onclick=\"showAlert();\" value=\"Call JavaScript\" />\n</body>\n</html>\n```\n\
    \n# Output\n\nWhen we execute the above HTML program, the following will be the\
    \ output. We are invoking a JavaScript function \"showAlert\" through a button\
    \ onclick event which is displaying a message on an alert dialogue box.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_82_0.png)\n\
    \n# onsubmit Event Type\n\nIt is an event type that comes into play while we submit\
    \ a form. We can also put our validation against this event type. In the following\
    \ example, we are demonstrating how onsubmit event is triggered. We call a \"\
    validate()\" function before submitting a data.\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>On Submit Events</title>\n\
    <script type=\"text/javascript\">\nfunction validation() {\n  if(document.form1.textbox1.value\
    \ != \"\") {\n    alert('Validation Passed');\n    return true;\n  }\n  else{\n\
    \    alert('Text Box cannot be empty!');\n    return false;\n  }\n}\n</script>\n\
    </head>\n<body>\n<form name=\"form1\" method=\"GET\" action=\"onClickEvent.html\"\
    \ onsubmit=\"return validation()\">\n<input type=\"text\" name=\"textbox1\"/>\n\
    <input type=\"submit\" value=\"Submit\" />\n</form>\n</body>\n</html>\n```\n\n\
    # Output\n\nWhen we execute the above HTML program, the following will be the\
    \ output. Here, we are validating that the text box element cannot be blank or\
    \ empty, if no value is entered in it and the submit button is clicked then it\
    \ will return false to the form and display an alert message as “Text Box cannot\
    \ be empty!”\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_84_0.png)\n\n# onmouseover\
    \ and onmouseout Event Types\n\nThese two are popular mouse event types which\
    \ help us to create nice effects with images or texts. The onmouseover event gets\
    \ triggered when we bring our mouse over any web element on the HTML page and\
    \ the onmouseout event gets triggered when we move our mouse out from that web\
    \ element. The following example demonstrates these.\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Mouse Over and Out</title>\n\
    <script type=\"text/javascript\">\nfunction hoverMouse() {\n  alert(\"Doing the\
    \ Mouse Over\");\n}\nfunction hoverMouseOut() {\n  alert(\"Taking the Mouse Out\"\
    );\n}\n</script>\n</head>\n<body>\n<div onmouseover=\"hoverMouse();\"\nonmouseout=\"\
    hoverMouseOut();\">\n<h1> Bring your Mouse here to see the change </h1>\n</div>\n\
    </body>\n</html>\n```\n\n# Output\n\nWhen we execute the above HTML program, the\
    \ following will be the output. Here, when we bring the mouse over on the heading\
    \ division, we can see the alert messaging getting invoked. Similarly, when we\
    \ mouse out the region, we see another alert for moving the mouse out of heading\
    \ division.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_85_0.png)\n"
