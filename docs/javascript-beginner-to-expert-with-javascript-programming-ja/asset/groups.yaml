- md: "\n```\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>JavaScript\
    \ Variables</title>\n<script type=\"text/javascript\">\n  var name = \"Appy\"\
    ;\n  var age = 21;\n  var salary = 10000, expenses = 12000;\n\n  alert (\"Name:\
    \ \"+name+\" Age: \"+age+\"\\nSalary: \"+salary+\" Expenses: \"+expenses+\");\n\
    </script>\n</head>\n<body>\n</body>\n</html>\n```\n\n# Explanation of the JavaScript\
    \ code\n\nStoring of a value in a variable is known as variable initialization.\
    \ We can do variable initialization at any point of time during the variable creation\
    \ or the time when we need that variable.\n\nFor instance, we have created four\
    \ variables in the above code and assigned value to each of these variables. E.g.\
    \ name = \"Appy\", salary = 10000, etc.\n\n# Output\n\nWhen we execute the above\
    \ HTML program, the following will be the output. In the output, we are displaying\
    \ the values that were assigned to the data container through an alert.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_42_0.png)\n\
    \nThis is to be noted that the var keyword is used only for declaration or initialization,\
    \ once for the life of any variable name in an HTML document. We should not re-declare\
    \ same variable more than once. In JavaScript, the variable can hold any value\
    \ of data type (number, string, etc.) as it is an untyped language. Unlike typed\
    \ languages (e.g., C++, JAVA, etc.), we don't need to tell JavaScript compiler\
    \ during variable declaration that what type of value the variable will hold.\
    \ Also, the value type of a variable can change during the execution of a program\
    \ which the JavaScript parser takes care of it automatically.\n\n# Variable Scope\
    \ in JavaScript\n\nThe scope of a variable is defined as the region of the program\
    \ in which it is defined. The JavaScript variables can have the following two\
    \ scopes:\n\n**Global Variables scope** – a global scope which means it can be\
    \ defined anywhere in the JavaScript code and visible everywhere in the current\
    \ HTML document.\n\n**Local Variables scope** – is a local variable which will\
    \ be visible only within a function where it is defined. The function parameters\
    \ are always local to the function.\n\nThis is to be noted that, within the body\
    \ of a function, if both local and global variables are defined with the same\
    \ name then local variable takes precedence over global variable always. Let’s\
    \ understand this concept in the best way with the help of the following example.\n\
    \n```\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Variable\
    \ Scope</title>\n</head>\n<script type=\"text/javascript\">\nvar demoVar = \"\
    global scope\"; // A global variable\nfunction checkVariableScope() {\nvar demoVar\
    \ = \"local scope\"; // A local variable\ndocument.write(demoVar);\n}\n</script>\n\
    <body onload = checkVariableScope();\n\n</body>\n</html>\n```\n\n# Output\n\n\
    When we execute the above HTML program, the following will be the output. In the\
    \ output, we can observe the values as “local scope” as a local variable takes\
    \ precedence over a global variable, if both are defined with the same name.\n\
    \n# Variable Names in JavaScript\n\nThe rules should be obeyed while naming the\
    \ variables in JavaScript language.\n\nNo use of the variable name which are reserved\
    \ keywords. These keywords are mentioned in the last section of this chapter.\
    \ E.g. finally, goto, etc. variable names are invalid.\n\nVariable names in JavaScript\
    \ language should never start with a number (0-9). However, they can begin with\
    \ a letter or an underscore character. E.g. 10name is an invalid variable but\
    \ _10name is a valid name.\n\nVariable names in JavaScript are case-sensitive.\
    \ E.g. Address and address are treated as two different variables names in JavaScript\
    \ language.\n\n# Reserved Words in JavaScript\n\nThe following is a list of all\
    \ the reserved words in JavaScript language. These reserved words cannot be used\
    \ as JavaScript variables, loop labels, functions, or any object names.\n\n| abstract\
    \ | debugger | final | instanceof | Public |\n| boolean | default | finally |\
    \ int | Return |\n| break | delete | float | interface | Short |\n| byte | do\
    \ | for | long | Static |\n| case | double | function | native | Super |\n| catch\
    \ | else | Goto | new | Switch |\n| char | Enum | If | null | synchronized |\n\
    | class | Export | implements | package | This |\n| const | extends | import |\
    \ private | Throw |\n| continue | FALSE | In | protected | Throws |\n\n# Chapter\
    \ 8\n\n# JavaScript Operators\n\nWhen we add or subtract two values, e.g. adding\
    \ 5 with 6 (i.e. 5 + 6), here '+' is known the operator and (5 + 6) is known as\
    \ expression. The JavaScript language supports the following types of operators.\n\
    \n## Arithmetic Operators\n\nThe following are the arithmetic operators which\
    \ are supported by the JavaScript language.\n\n| S No. | Arithmetic Operator |\
    \ Description | Example |\n|---|---|---|---|\n| 1. | + (Addition) | It is used\
    \ to add two operands. | X + Y |\n| 2. | - (Subtraction) | It is used to subtract\
    \ the second operand from first operand. | X - Y |\n| 3. | * (Multiplication)\
    \ | It is used to multiply two operands. | X * Y |\n| 4. | / (Division) | It is\
    \ used to divide two operands i.e. divide numerator with the denominator. | X\
    \ / Y |\n| 5. | % (Modulus) | This operator outputs the remainder of an integer\
    \ division. | X % Y |\n| 6. | ++ (Increment) | It increase the integer value by\
    \ X++ 1. |\n| 7. | -- (Decrement) | It decrease the integer value by Y--1. |\n\
    \n## Comparison Operators\n\nThe following are the comparison operators which\
    \ are supported by the JavaScript language.\n\n| S No. | Comparison Operator |\
    \ Description | Example |\n|---|---|---|---|\n| 1 | == (Equal) | This operator\
    \ is used to Check if the value of two operands are Y equal or not, if both values\
    \ are true, then the condition becomes true. | Ex: (X == Y) |\n| 2 | != (Not Equal)\
    \ | This operator is used to check if the value of two operands is equal or not,\
    \ if the values are unequal, then the condition becomes true. | Ex: (X != Y) |\n\
    | 3 | > (Greater than) | This operator is used to check if the value of the left\
    \ operand is greater than the value of the right operand, if it is the case, then\
    \ the condition becomes true. | Ex: (X > Y) |\n| 4 | < (Less than) | This operator\
    \ is used to check if the value of the left operand is less than the value of\
    \ the right operand, if it is the case, | Ex: (X < Y) |\n| 5 | >= (Greater than\
    \ or Equal to) | This operator is used to check if the value of the left operand\
    \ is not greater than or equal to the true value of the right operand, if it is\
    \ the case, then the condition becomes true. | Ex: (X >= Y) |\n| 6 | <= (Less\
    \ than or Equal to) | This operator is used to check if the value of the left\
    \ operand is true. less than or equal to the value of the right operand. | Ex:\
    \ (X <= Y) |\n\n# Logical (or Relational) Operators\n\nThe following are the logical\
    \ or relational operators which are supported by the JavaScript language.\n\n\
    | S No. | Logical Operator | Description | Example |\n|---|---|---|---|\n| 1 |\
    \ && (Logical AND) | If both the operands are non-zero, then this operator makes\
    \ the condition becomes true. | Ex: (X && Y) is true. |\n| 2 | || (Logical OR)\
    \ | If any of the two operands are non-zero, then this operator is true. makes\
    \ the condition becomes true. | Ex: (X || Y) |\n\n# ! (Logical NOT)\n\nThis operator\
    \ reverses the logical state of its operand. If a condition is true, then the\
    \ Logical NOT operator will make it false and vice-versa.\n\n# Assignment Operators\n\
    \nThe following are the assignment operators which are supported by the JavaScript\
    \ language.\n\n| S No. | Assignment Operator | Description | Example |\n|---|---|---|---|\n\
    | 1. | =(Simple Assignment) | This operator is used to assign the value from the\
    \ right side operand to the left side value of X - Y operand. | Ex: Z = X - Y\
    \ will assign into Z variable. |\n| 2. | += (Add and Assignment) | This operator\
    \ is used to add the right operand to the left side equivalent to Z operand and\
    \ assigns the result = Z + X to the left operand. | Ex: Z += X |\n| 3. | -= (Subtract\
    \ and Assignment) | This operator is used to subtract the right operand equivalent\
    \ to Z the left operand and assigns the result = Z - X to the left operand. |\
    \ Ex: Z -= X |\n| 4. | *= (Multiply and Assignment) | This operator is used to\
    \ multiply the right operand with equivalent to Z the left operand and assigns\
    \ the result = Z * X to the left operand. | Ex: Z *= X |\n"
  mdcn: "\n\n```\n<!DOCTYPE html>\n<html\n<head>\n<meta charset=\"ISO-8859-1\">\n\
    <title>JavaScript Variables</title>\n<script type=\"text/javascript\">\n  var\
    \ name = \"Appy\";\n  var age = 21;\n  var salary = 10000, expenses = 12000;\n\
    \n  alert (\"Name: \"+name+\" Age: \"+age+\"\\nSalary: \"+salary+\" Expenses:\
    \ \"+expenses+\");\n</script>\n</head>\n<body>\n</body>\n</</html>\n```\n\n# JavaScript\
    \ 代码说明\n\n将一个值存储在变量中被称为变量初始化。我们可以在变量创建期间的任何时间或在需要该变量时进行变量初始化。\n\n例如，我们在上面的代码中创建了四个变量，并为这些变量每一个赋值了值。例如\
    \ `name = \"Appy\"`，`salary = 10000` 等。\n\n# 输出\n\n当我们执行上述 HTML 程序时，将会有如下输出。在输出中，我们通过\
    \ `alert` 显示赋值给数据容器的值。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_42_0.png)\n\
    \n需要注意的是，`var` 关键字仅用于声明或初始化，在 HTML 文档中变量名的生命周期内使用一次。我们不应该多次声明同一个变量。在 JavaScript\
    \ 中，由于它是无类型语言，变量可以持有任何数据类型的值（数字、字符串等）。与强类型语言（如 C++, JAVA 等）不同，我们不需要在变量声明期间告诉 JavaScript\
    \ 编译器变量将持有什么类型的值。此外，变量的值在程序执行过程中可以改变，JavaScript 解析器会自动处理。\n\n# JavaScript 中的作用域\n\
    \n变量的作用域定义为定义的程序区域。JavaScript 变量可以具有两种作用域：\n\n**全局变量作用域** – 全局作用域意味着它可以在 JavaScript\
    \ 代码的任何地方定义并在当前 HTML 文档处可见。\n\n**局部变量作用域** – 局部变量仅在定义的函数内部可见。函数参数始终是函数的局部变量。\n\
    \n需要注意的是，在函数体内，如果定义了同名的局部和全局变量，则局部变量优先级始终高于全局变量。让我们通过以下示例以最好的方式理解这个概念。\n\n```\n\
    <!DOCTYPE html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>Variable Scope</title>\n\
    </head>\n<script type=\"text/javascript\">\nvar demoVar = \"global scope\"; //\
    \ 一个全局变量\nfunction checkVariableScope() {\nvar demoVar = \"local scope\"; // 一个局部变量\n\
    document.write(demoVar);\n}\n</script>\n<body onload = checkVariableScope();\n\
    \n</body>\n</</html>\n```\n\n# 输出\n\n当我们执行上述 HTML 程序时，将会有如下输出。在输出中，我们可以观察到值为“local\
    \ scope”，因为如果两个变量以相同的名称定义，局部变量的优先级高于全局变量。\n\n# JavaScript 中的变量名\n\n在 JavaScript\
    \ 语言中命名变量时必须遵守遵守规则。\n\n不能使用保留关键字作为变量名。这些关键字在本章的最后一节中提到。例如 `finally`、`goto` 等变量名是无效的。\n\
    \nJavaScript 语言中的变量名不能以数字（0-9）开头。然而，它们可以是字母或下划线字符开头。例如，`10name` 是无效的变量，但 `_10name`\
    \ 是合法的名称。\n\nJavaScript 中的变量名是区分大小写的。例如，`Address` 和 `address` 在 JavaScript 语言中被视为两个不同的变量。\n\
    \n# JavaScript 中的保留字\n\n以下是 JavaScript 语言中所有保留字的列表。这些保留字不能作为 JavaScript 变量、循环标签、函数或任何对象名称。\n\
    \n| abstract | debugger | final | instanceof | Public |\n| boolean | default |\
    \ finally | int | Return |\n| break | delete | float | interface | Short |\n|\
    \ byte | do | for | long | Static |\n| case | double | function | native | Super\
    \ |\n| catch | else | Goto | new | Switch |\n| char | Enum | If | null | synchronized\
    \ |\n| class | Export | implements | package | This |\n| const | extends | import\
    \ | private | Throw |\n| continue | FALSE | In | protected | Throws |\n\n# 第8\
    \ 章\n\n# JavaScript 运算符\n\n当我们加或减两个值时，例如将 5 加 6（即 `5 + 6`），这里的 `'+'` 被称为运算符，`(5\
    \ + 6)` 被称为表达式。JavaScript 语言支持以下类型的运算符。\n\n## 算术运算符\n\n以下是 JavaScript 语言支持的算术运算符。\n\
    \n| 序号 | 算术运算符 | 说明 | 示例 |\n|---|---|---|---|\n| 1. | + (加法) | 用于加两个操作数。 | X +\
    \ Y |\n| 2. | - (减法) | 用于从第一个操作数中减去第二个操作数。 | X - Y |\n| 3. | * (乘法) | 用于乘两个操作数。\
    \ | X * Y |\n| 4. | / (除法) | 用于除两个操作数，即被除数除以除数。 | X / Y |\n| 5. | % (模) | 该运算符输出整数除法的余数。\
    \ | X % Y |\n| 6. | ++ (自增) | 通过 X++ 将整数值加1。 | |\n| 7. | -- (自减) | 通过 Y-- 将整数值减1。\
    \ |\n\n## 比较运算符\n\n以下是 JavaScript 语言支持的比较运算符。\n\n| 序号 | 比较运算符 | 说明 | 示例 |\n|---|---|---|---|\n\
    | 1 | == (等于) | 该运算符用于检查两个操作数的值是否相等，如果两个值都为真，则条件变为真。 | 例: (X == Y) |\n| 2 | !=\
    \ (不等于) | 该运算符用于检查两个操作数的值是否相等，如果值不相等，则条件变为真。 | 例: (X != Y) |\n| 3 | > (大于) | 该运算符用于检查左操作数的值是否大于右操作数的值，如果是这样，则条件变为真。\
    \ | 例: (X > Y) |\n| 4 | < (小于) | 该运算符用于检查左操作数的值是否小于右操作数的值。 | 例: (X < Y) |\n| 5\
    \ | >= (大于或等于) | 该运算符用于检查左操作数的值是否大于或等于右操作数的值。 | 例: (X >= Y) |\n| 6 | <= (小于或等于)\
    \ | 该运算符用于检查左操作数的值是否小于或等于右操作数。 | 例: (X <= Y) |\n\n# 逻辑（或关系）运算符\n\n以下是 JavaScript\
    \ 语言支持的逻辑或关系运算符。\n\n| 序号 | 逻辑运算符 | 说明 | 示例 |\n|---|---|---|---|\n| 1 | && (逻辑与)\
    \ | 如果两个操作数都非零，则该运算符使条件变为真。 | 例: (X && Y) 为真。 |\n| 2 | || (逻辑或) | 如果两个操作数中的任意一个非零，则该运算符为真。\
    \ | 例: (X || Y) |\n\n# ! (逻辑非)\n\n该运算符反转其操作数的逻辑状态。如果条件为真，则逻辑非运算符将使其为假，反之亦然。\n\n\
    # 赋值运算符\n\n以下是 JavaScript 语言支持的赋值运算符。\n\n| 序号 | 赋值运算符 | 说明 | 示例 |\n|---|---|---|---|\n\
    | 1. | =(简单赋值) | 该运算符用于将右侧操作数的值赋值给左侧 X - Y 操作数的值。 | 例: Z = X - Y 将赋值给变量 Z |\n\
    | 2. | += (加赋值) | 该运算符用于将右操作数加到左侧 Z 操作数上，并将结果 Z + X 赋值给左操作数。 | 例: Z += X |\n|\
    \ 3. | -= (减赋值) | 该运算符用于从左侧 Z 操作数中减去右操作数，并将结果 Z - X 赋值给左操作数。 | 例: Z -= X |\n|\
    \ 4. | *= (乘赋值) | 该运算符用于将右操作数乘以左侧的 Z 操作数，并将结果 Z * X 赋值给左操作数。 | 例: Z *= X |\n\n"
