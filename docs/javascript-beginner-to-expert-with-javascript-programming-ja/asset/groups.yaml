    | while loop | While loop type, repeats a statement or group of statements while
    a given condition is true. It tests the condition each time it executes the loop
    body and exits the loop when condition becomes false. |

    | for loop | For loop type executes a sequence of statements multiple times and
    abbreviates the code that manages the loop variable. |

    | nested loops | It is a loop within a loop. In JavaScript, we can use a loop
    in another while or for loop or for loop in another while or for loop. |


    # Loop control statements


    Loop control statements in JavaScript language are used to change execution from
    its normal sequence. When such execution leaves a scope, all automatic objects
    created in that scope are destroyed or removed.


    In JavaScript language, the following loop control statements are supported.


    | Control Statement | Description |

    | break statement | The break statement in JavaScript is used to terminate the
    loop statement and transfers execution to the statement immediately following
    after the end of loop. |

    | continue statement | The continue statement in JavaScript is used to cause the
    loop to skip the remainder of its body and immediately retest its condition prior
    to reiterating the looping body. |


    Let''s understand these loop control statement in a better way with the help of
    the following example.'
