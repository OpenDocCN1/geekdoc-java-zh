    \n![](img/80ff2aec61ff33d32cd503fad02658a7_57_0.png)\n\nif...else 语句 – ‘if...else’语句是控制语句的另一种形式，允许\
    \ JavaScript 代码以更受控的方式执行语句。以下是语法和示例。\n\n## 语法与示例\n\n```html\n<!DOCTYPE html>\n\
    <html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>If Else 语句</title>\n</head>\n\
    <body>\n  <script type=\"text/javascript\">\n    var salary = 12000;\n    var\
    \ expenses = 10000;\n    if (expenses > salary) {\n      document.write(\"<b>请开始增加收入或减少开支!</b>\"\
    );\n    } else {\n      document.write(\"<b>你有足够的钱花了!</b>\");\n    }\n  </script>\n\
    \  <p>我们处于 body 区域内部...</p>\n</body>\n</html>\n```\n\n## ## 输出\n\n当我们执行上述 HTML\
    \ 程序时，输出将是如下所示。由于 \"if\" 语句中的条件为假，因此它进入了 else 块并在 HTML 页面上写入了给定的文本。\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_58_0.png)\n\
    \nif...else if... 语句 — if...else if...语句是 if...else 代码的另一种高级形式，允许 JavaScript 代码在定义的多个条件中做出正确的决策。它有一系列的\
    \ if 语句，其中每个 if 语句都是上一个语句 else 子句的一部分。这些语句根据真条件执行，如果发现没有任何条件为真，则将执行 else 块中的代码。以下是语法示例。\n\
    \n```html\n<!DOCTYPE html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n<title>If\
    \ Else 语句</title>\n</head>\n<body>\n<script type=\"text/javascript\">\nvar salary\
    \ = 12000;\nvar expenses = 10000;\nif (expenses > salary) {\ndocument.write(\"\
    <b>请开始增加收入或减少开支!</b>\");\n}\nelse if (salary > 13000){\ndocument.write(\"<b>你有足够的钱花了!</b>\"\
    );\n}\n</script>\n</body>\n</html>\n```\n\n```html\nelse {\n  document.write(\"\
    <b>你有足够的钱花了但需要小心!</b>\");\n}\n<p>我们处于 body 区域内部...</p>\n</body>\n</html>\n```\n\
