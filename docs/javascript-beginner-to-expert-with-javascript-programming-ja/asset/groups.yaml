    # Optional Semicolons'
- md: "\nUsually, all JavaScript statements are ended with a semi-colon. But these\
    \ semi-colons are optional when each of JavaScript statements are placed on a\
    \ separate line. Using the semi-colons at the end of each JavaScript statement\
    \ is considered as a good programming practice.\n\n## Case Sensitivity\n\nJavaScript\
    \ language is a case sensitive language. It means, the keywords, variables, function\
    \ names, identifiers, etc. should be used with a consistent capitalization of\
    \ letters. E.g. the identifier learn and LEARN are different from the point of\
    \ view of the JavaScript language.\n\n## Comments in JavaScript\n\nThe following\
    \ are the comment styles which are supported in the JavaScript language.\n\n-\
    \ Single line comment is declared as // (double slash).\n- Multiple line comments\
    \ is declared as /* JavaScript Statements on the multiple line */. It works for\
    \ single line comment as well.\n- It also recognized the HTML comment (opening\
    \ sequence) <!--—. JavaScript treats this as a single-line comment as it does\
    \ with the // comment.\n- The closing sequence —> of HTML is not recognized by\
    \ JavaScript, Therefore, it should be written as //->.\n\nThe following is an\
    \ example that covers various JavaScript Comments.\n\n```\n<!DOCTYPE html>\n<html>\n\
    <head>\n<meta charset=\"ISO-8859-1\">\n<title>JavaScript Comments</title>\n</head>\n\
    <body>\n  <script type=\"text/javascript\">\n<!-- The opening sequence single\
    \ line comment. \n  The closing sequence HTML comment//-->\n  // This is a single\
    \ line comment.\n  /*\n  * This is a multiple line comment in JavaScript\n  */\n\
    </script>\n</body>\n</html>\n```\n\nOutput\n\nWhen we execute the above HTML program,\
    \ the following will be the output (blank) since JavaScript interpreter has ignored\
    \ all the comments.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_19_0.png)\n\n\
    ## JavaScript Syntax\n\nLike any other programming language, JavaScript syntax\
    \ has certain set of rules in which they are constructed.\n\n## Programs in JavaScript\n\
    \nA JavaScript program is a sequence of instructions which are parsed and executed\
    \ by the browser program. These sequence of program instructions are known as\
    \ statements.\n\nJavaScript is an objected based programming language.\n\nJavaScript\
    \ statements are usually separated by semicolons, however placing a semicolon\
    \ at the end statement is optional.\n\n```\n<!DOCTYPE html>\n<html>\n<head>\n\
    <meta charset=\"ISO-8859-1\">\n<title>JavaScript Syntax</title>\n<script type=\"\
    text/javascript\">\nvar a = 101;\nvar b = 300;\nvar sum = a + b;\n</script>\n\
    </head>\n<body>\n<script type=\"text/javascript\">\ndocument.write(\"sum of a\
    \ + b = \"+sum);\n</script>\n</body>\n</html>\n```\n\n## Output\n\nWhen we execute\
    \ the above HTML program, the following will be the output.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_21_0.png)\n\
    \n## Statements in JavaScript\n\nStatements in JavaScript programming language\
    \ are composed of the following.\n\n- Values\n- Operators\n- Expressions\n- Keywords,\
    \ and\n- Comments.\n\n## Values in JavaScript\n\nThe following are the two types\
    \ of values in JavaScript.\n\n- Fixed values, and\n- Variable values.\n\nLiterals\
    \ are the fixed values and the variable values are known as variables.\n\n## Literals\
    \ in JavaScript\n\nThe following are the rules for writing literals or fixed values\
    \ in JavaScript.\n\n- Numbers are defined with or without decimals.\n- Strings\
    \ are the text that are written within single or double quotes.\n\n## Variables\
    \ in JavaScript\n\nThe following are the rules for writing variable values which\
    \ are used to store data values in JavaScript.\n\nJavaScript language uses the\
    \ `var` keyword to declare the variables.\n\nThe value to a variable is assigned\
    \ by an equal sign.\n\n## Operators in JavaScript\n\nThe following are the operators\
    \ used in JavaScript language.\n\n**Assignment operator (=)** is used to assign\
    \ values to a variable.\n\n**Arithmetic operators (+-\\*)** are used for arithmetic\
    \ operations such as addition, subtraction, multiplication, and division.\n\n\
    ## Expressions in JavaScript\n\nAny expression in JavaScript language is a combination\
    \ of values, variables, and operators. These together do computation. The computation\
    \ is called an evaluation.\n\nAn expressions may also contain variable values\
    \ such as numbers and strings. E.g., “Java” + “Script” will concatenate to “JavaScript”.\n\
    \nLet’s understand this with the help of the following example.\n\n```\n<!DOCTYPE\
    \ html>\n<html>\n<head>\n<meta charset=\"ISO-8859-1\">\n```\n\n## JS Expressions\n\
    \n```\n<title>JS Expressions</title>\n<script type=\"text/javascript\">\n  var\
    \ a = 101; //variable, assignment operator and literal as number.\n  var b = 300;\n\
    \  var addition = a + b;\n  var str1 = \"Java\"; //variable, assignment operator\
    \ and literal as String.\n  var str2 = \"Script\";\n  var str3 = str1 + str2;\n\
    </script>\n</head>\n<body>\n<script type=\"text/javascript\">\n  document.write(\"\
    Addition of a + b = \"+addition);\n  document.write(\"<br>Concat of str1 + str2\
    \ = \"+str3\");\n</script>\n</body>\n</html>\n```\n\n## Output\n\nWhen we execute\
    \ the above HTML program, the following will be the output. The output shows the\
    \ addition and the concatenation operation.\n\n## Keywords in JavaScript\n\nKeywords\
    \ in JavaScript language are used to identify the actions which are required to\
    \ be performed. The var keyword directs the browser to create a new variable as\
    \ JavaScript Identifiers. In JavaScript language, the identifiers are used to\
    \ name variables (and keywords, and functions, and labels).\n\nIn JavaScript language,\
    \ the first character must be a letter, an underscore (_), or a dollar sign ($)\
    \ always. The subsequent characters may be letters, digits, underscores, or dollar\
    \ signs.\n\n## Camel Case and JavaScript\n\nThere are the following three ways\
    \ of joining multiple words into one variable name.\n\n- Hyphens — E.g., first-address,\
    \ second-address, visa-passport, city-name, etc.\n- Underscore — E.g., first_address,\
    \ second_address, visa_passport, city_name, etc.\n- Camel Case — E.g., FirstAddress,\
    \ SecondAddress, VisaPassport, InterName, etc. In JavaScript programming languages,\
    \ the camel case starts with a lowercase letter e.g., firstName, secondAddress,\
    \ visaPassport, cityName, etc.\n\n## Character Set in JavaScript\n\nJavaScript\
    \ language uses the Unicode character set and it covers all the characters, punctuations,\
    \ and symbols.\n\n## Chapter 5\n\n## JavaScript Enabling and Disabling\n\nWeb\
    \ browsers such as Internet Explorer, Mozilla Firefox, Google Chrome, Opera, etc.\
    \ come with built-in support for JavaScript. We can enable or disable the browser\
    \ support manually. In this chapter we are going to discuss about the procedure\
    \ of enabling and disabling JavaScript support in these browsers.\n\n## Enabling\
    \ the JavaScript support in Internet Explorer\n\nThe following are the steps to\
    \ turn on or enable JavaScript support in Internet Explorer.\n\n- Navigate as\
    \ Tools Internet Options from the menu tab.\n- From the dialog box, select the\
    \ security tab.\n- Click on the Custom Level button.\n- Scroll down the menu and\
    \ find the scripting option.\n- Select to enable the radio button under the Active\
    \ scripting caption.\n- Lastly, click on the OK button to enable the JavaScript\
    \ support on IE browser.\n\n## Disabling the JavaScript support in Internet Explorer\n\
    \nTo turn off or disable the JavaScript support in Internet Explorer, follow the\
    \ above steps and select to disable the radio button under Active scripting caption.\n\
    \n## Enabling the JavaScript support in Mozilla Firefox\n\nThe following are the\
    \ steps to turn on or enable JavaScript support in Mozilla Firefox.\n\nOpen a\
    \ new tab and type *about: config* in the address bar.\n\nThere we will find the\
    \ following warning dialog Select and click on the button as “I'll be careful,\
    \ I promise!” as shown below.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_27_0.png)\n\
    \nHere, we will observe the list of configure options in the browser. In the search\
    \ bar, type javascript.enabled as shown below.\n\n![](img/80ff2aec61ff33d32cd503fad02658a7_27_1.png)\n\
    \nHere, we can find the option to enable or disable the javascript by right-clicking\
    \ on the value of option select toggle.\n\nUpon clicking toggle, if the javascript.enabled\
    \ is true then it will be converted to false. This will disable the JavaScript\
    \ support to the Mozilla Firefox web browser.\n\n## Disabling the JavaScript support\
    \ in Mozilla Firefox\n\nThe following are the steps to turn off or disable the\
    \ JavaScript support in Mozilla Firefox. If javascript is disabled then it can\
    \ be enabled upon clicking toggle, after following the similar steps as explained\
    \ before.\n\n## Enabling or disabling the JavaScript support in Google Chrome\n\
    \nThe following are the steps to enable or disable the JavaScript support in Google\
    \ Chrome.\n\nClick on the Chrome menu present at the top right hand corner of\
