    # Chapter 1


    ## Introduction to JavaScript Programming Language


    Welcome to the world of JavaScript, invented in 1995 by Brendan Eich it is still
    the most commonly used scripting language around today. It is high level, interpreted,
    cross platform and an open source programming language. In this tutorial series,
    we are going to learn JavaScript with practical examples. Before we dive in, let''s
    go over some of the basics.


    JavaScript is an OOP scripting language which mainly used in Web programming.
    It is responsible for making web pages interactive; in simple words “it tells
    web page what to perform”. Like HTML defines the contents of the web page and
    CSS defines the layout, JavaScript make that web page work properly. JavaScript
    programs are the set of instructions which are executed in the order they are
    written so while coding, we should take care of the logical sequence. Do not get
    confused between Java and JavaScript, they both are technically different languages
    in respect of their design, however their standard libraries and syntaxes are
    same.


    Now, let’s learn how to install this amazing language on your computer and write
    our first JavaScript program.


    # Chapter 2


    ## Development IDE setup


    We are going to use eclipse as development IDE throughout this tutorials for explaining
    JavaScript program examples practically. The following are the steps to install
    eclipse and set up development environment for JavaScript.


    Please follow the below steps:


    - 1. Download the eclipse from below link. Choose the latest stable version of
    the eclipse and make sure that if your machine is 64-bit then choose 64-bit eclipse.
    In this tutorial, eclipse MARS.1 version is used.


    https://eclipse.org/downloads


    - 2. Click on the eclipse.exe to open the eclipse which will ask to choose a local
    directory as its workspace as shown in the below screenshot.


    - 3. Choose or create a directory on any available drive and click on the OK button
    to start eclipse.


    ![](img/80ff2aec61ff33d32cd503fad02658a7_9_0.png)


    - 4. On the eclipse navigate as File -> New -> Static Web Project. Click on the
    link shown below.


    - 5. It will open up a dialogue box that will ask you to enter the name of the
    project. Please enter the project name and click on the ‘Finish’ button as shown
    below.


    ![](img/80ff2aec61ff33d32cd503fad02658a7_11_0.png)


    - 6. On the left hand side of Eclipse (project explorer), expand the project directory
    and right click on the ‘WebContent’ folder. To add a HTML file in the current
    project navigate as New -> HTML File as shown below.


    It will open up a dialogue box that will ask you to enter the file name. Please
    enter the file name and click on the ‘Finish’ button as shown below. This will
    add up an HTML file to the current static web project.


    ![](img/80ff2aec61ff33d32cd503fad02658a7_12_0.png)


    ![](img/80ff2aec61ff33d32cd503fad02658a7_13_0.png)


    At this point, you have successfully completed the development setup for JavaScript
    programming. In the next chapter, we are going to develop our first JavaScript
    program using this setup.


    ![](img/80ff2aec61ff33d32cd503fad02658a7_13_1.png)


    # Chapter 3


    ## My First JavaScript Program


    JavaScript is a scripting language that could be injected anywhere on the web
    page between the <script>...</script> HTML tags, however it is always recommended
    to place in head section within <head> ...</head> tags.


    While parsing the markup text (HTML) on the web page, when the browser program
    encounters the <script> tag, it start interpreting all the text between these
    tags (till </script>) The script tag accepts the following two attributes.


    Language: this attribute specifies the type of scripting language that we are
    using. Its value is “javascript” for JavaScript language. In the latest versions
    of HTML, this attribute have been phased out.


    Type: this attribute indicates the type of scripting language that is in use and
    its value will be set to “text/javascript” for JavaScript language.


    # My First JavaScript Program


    In the last chapter, we created an html file (MyJavaScriptProgram.html). Let’s
    use this to write our first JavaScript program as shown below.


    ```html

    <!DOCTYPE html>

    <html

    <head>

    <meta charset="ISO-8859-1">

    <title>My First JavaScript Program</title>

    </head>

    <body>

    <script language="javascript" type="text/javascript">

    document.write("Welcome to JavaScript First Program");

    </script>

    </body>

    </html>

    ```


    # Explanation of the JavaScript code <body> ...


    Here, we have injected the JavaScript code between ... </body> tags of the HTML.
    In the JavaScript code/script, we first declared the two attributes as discussed
    before and then with the help of the document object we are writing the message
    "Welcome to JavaScript First Program" on the web page.


    # Output


    When we execute the above HTML program, the following will be the output.


    ![](img/80ff2aec61ff33d32cd503fad02658a7_16_0.png)


    # Whitespace and Line Breaks


    We can use spaces, tabs, and newlines freely in our JavaScript program as these
    are ignored by browser parser while parsing the JavaScript code. Also, we can
    freely format and indent our JavaScript programs in a tidy way that make the script
    very easy to maintain, read and understand.


