    # WHAT IS EVANGELICALISM?


    The histories and belief systems of the different strands of American evangelisms
    are complex; they look quite different depending on what time period you examine
    as well as the dimensions of class, politics, and geography. Race is especially
    decisive when sorting American evangelicals. Yet the basic teachings are pretty
    simple: The Bible is the effortless Word of God. It should be read and followed
    as literally as possible. Unlike Catholicism, hierarchy and tradition aren''t
    sources of authority. Instead, dynamic preachers invite worshippers into services
    more akin to contemporary tents rivals solemn ceremonies. Evangelicals don''t
    care about celebrating saints or (except for very few) maintaining liturgical
    traditions of the church. They locate authority in the Bible and those who, in
    their minds, teach it faithfully. Spreading the gospel is a top priority for evangelicals,
    because they believe that all those who do without accepting Christ as their personal
    savior will spend eternity in hell.


    Many evangelicals expect Jesus will return soon, and evangelical kids who come
    to an empty house sometimes wonder if their family has been raptured to heaven
    and have been left behind for some unacknowledged sin. Other religions are seen
    as false teachings with little to no value. Interreligious dialogue is something
    of an oxymoron for most evangelicals, because they don''t see other religions
    as legitimate. Moreover, evangelicals see themselves as “not of this world” because
    their true home is in eternal paradise with Jesus and God the Father. The “world”
    is an evil enemy, given over to sin and licentiousness. There is no cohering of
    faith with culture. Instead, there is a battle that goes back to the serpent''s
    temptation of Adam and Eve in Genesis 3. This is why evangelicals are allergic
    to discussions of social justice. They see social or political solutions to inequality,
    racism, and other issues of injustice as soft approaches to fixing worldly problems,
    and they prefer what they see as a biblical'
