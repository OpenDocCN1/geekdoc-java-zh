  md: '# Chapter 1


    # WOULD I HAVE BEEN THERE?


    I SPENT THE FIRST sunlit hours of January 6, 2021, bobbing in the Pacific Ocean.
    Having awakened at dawn and gone surfing, I was surprised that no other surfers
    were in sight that morning; it was a rare welcome phenomenon. With all that room
    to think, my thoughts expanded into the endless blue of the ocean around me. Two
    surprising Democratic victories in Georgia''s Senate runoff elections the day
    before had made me jubilant. As the sun rose above Northern California, I thought
    of Raphael Warnock, a Black minister, and Jon Ossoff, a Jewish man in his early
    thirties, representing the Peach State in the Senate. The Democrats would now
    have control, by the slimmest of margins, of the White House and both houses of
    Congress.


    My face was numb from the forty-degree and fifty-degree water, but my body was
    glowing with anticipation. Maybe we are headed for better days, I thought, sitting
    on my body, looking at the horizon and tracing the long continuous arc of the
    Monterey Bay from Santa Cruz to Seaside. After four years of living under a contracted
    and sinister vision of America, I was ready for the country to unfurl itself from
    the myopia of the previous administration and move forward once again.


    As a scholar who teaches courses on the racism, misogyny, xenophobia, and homophobia
    that mark American history, I should have known better. I did know better. I had
    told my students a million times: Even if the arc of the universe bends towards
    justice, it''s not a straight line. It''s a zigzag, or a curve that doubles back
    on itself, one full of loops and hairpin turns.'
