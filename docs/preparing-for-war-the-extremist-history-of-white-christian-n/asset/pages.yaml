    As opposed to conspiracy theories, myths are often based in history, rooted in
    fact, but marked by elaboration and imagination that turns them into something
    else. A myth, above all, is a story that organizes our lives.—We all tell stories
    about who we are, where we came from, and how we should live,” I tell the class.
    “Humans live through narratives that are often made up of facts—and more.”


    Myths inform the present by teaching lessons that help individuals and communities
    form their identities, cultivate virtues, and give an account of who they are
    that stretches from the generations before them to the ones they anticipate will
    follow. In essence, myths are a narrative version of some past set of events—like
    the Israelites marching around the city of Jericho—that the present and helps
    create a vision for the future. From Adam and Eve, to the tale of the first American
    Thanksgiving, Paul Revere riding through the night to warn that “the British are
    coming!” myths are powerful because they give open space for us to participate
    in something bigger than ourselves and to locate our feelings and passions in
    a collective memory. Myths give us room to perform who we are—or who we want to
    be—and in turn to create the world as we think it should be. In this sense, myths
    are a bridge between the world as we encounter it and the world we think should
    exist.


    And for all these reasons, myths can be wondrous and life-affirming. Myths can
    give our identities texture and richness. In the evolutionary perspective, myths
    enabled humans to work together to accomplish tasks that transcended the individual—to
    work together to accomplish tasks greater than ourselves. When Martin Luther King
    Jr. said “the arc of the universe bends toward justice,” he expoused a myth that
