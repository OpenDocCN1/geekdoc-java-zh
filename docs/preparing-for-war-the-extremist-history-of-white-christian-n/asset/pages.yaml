  md: '# Prologue


    # BEFORE AND AFTER


    PROCESSING THE CAPITOL INSURRECTION is akin to coming to with a national home
    invasion. That violent mob''s breach of a secure and sacred space on January 6,
    2021, resulted in nothing less than a collective trauma. Decades of threats, calls
    for civil war, and White grievance politics burst forth into a violent display
    of vengeance. It was a day that divides time into Before and After. It was dismantling.


    But as time has passed, it became clear that January 6 was not an aberration or
    even some historically bewildering event. It was the logical outcome not only
    of the Trump presidency and election defeat but also of the long history of White
    Christian nationalist rhetoric, organizing, and influence across the United States.
    This book is partly a religious history of the events at the Capitol on January
    6, 2021. But it is mainly a history of the events, movements, religious leaders,
    and religious communities that made that event possible.


    It is also day of my own involvement in these communities and movements. As a
    former White Christian nationalist who is now a scholar of religion, I both have
    an insider''s view and a scholarly perspective on the long road to J6. This book
    recounts the historical narrative by my own history with the movement as a prism
    for understanding its principles, doctrines, emotions, and extremisms. I use my
    personal experience and training as a scholar to analyze the path and present
    and to forecast what comes next for MAGA Nation and the White Christian nationalists
    at its core.


    As I processed the events from that horrific day, I began to ask the three questions
    that would become the foundations for this book. How'
  merge: -1
  pgno: 8
- img_proc: true
  md: 'did the rise of the New Religious Right between 1960 and 2015 give birth to
    violent White Christian nationalism during the Trump presidency and beyond? What
    aspects of the White Christian nationalist worldview—the worldview I once held—propelled
    some of the most conservative religious communities in the country to ignite a
    cold war? And how can understanding the history of White Christian nationalism
    help us anticipate what it will take shape in and influence the public square
    in years to come?


    In chapters 1–5, we will answer the first question. Chapter 1 is a primer on White
    Christian nationalism—and my participation in—its development over the last century.
    In chapters 2 and 3, I trace the history of extreme right-wing politics and White
    Christian nationalism in Southern California and the American South in the 1960s
    and 1970s. These chapters show the development of the New Religious Right set
    the stage for the White Christian nationalist takeover of the Republican Party.
    In chapters 4 and 5, I examine the results of this takeover in the oyster of Jimmy
    Carter at the head of his fellow Whites and the White Christian nationalist support
    for Ronald Reagan.


    In chapters 6–8, I answer the second question through studies of various components
    of the White Christian worldview—from gender, the national body (chapter 6) to
    authoritarian leadership and strongman masculinity (chapter 7), to the use of
    conspiracy theories to transform what is considered real, true, and actual (chapter
    8).


    If the eight chapters tell a historical narrative of modern White Christian nationalism,
    chapters 9–11 analyze its present and future. Chapter 9 is a detailed analysis
    of the religious elements of the January insurrection that reveals how White Christian
    nationalism was an integrating force for Trump’s coup attempt. Chapter 10 explores
    the myths and realities that have developed in MAGA Nation since the insurrection.
    I argue that January 6 was the first battle in MAGA Nation’s war on American democracy.
    Chapter 11 forecasts MAGA Nation and White Christian nationalism may look like
    after Trump has left the scene. Here I focus on the large-scale migration of Christian
    supremacists to the “American Redoubt,” and their dreams of a theocratic state
    separate from the American republic.


    No definitive answers as to how we arrived at this political moment exist. There
    are many ways to tell this story and to investigate the'
  merge: -1
