    is soft and golden; my hair is still wet, and I''m smiling calmly. When I look
    at that photograph now, I am amazed at the hope that glimmers in my eyes, the
    sense of anticipation in my smile.


    By the time I got to my office later that morning, everything had changed. When
    I sat down in front of my computer, images of rioters breaching the US Capitol
    began to stream across my screen. In a matter of minutes, ebullience transformed
