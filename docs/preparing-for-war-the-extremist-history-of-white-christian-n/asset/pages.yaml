    # LOSING MY RELIGION


    In 2005, after eleven years in the movement and seven years in ministry, I left
    evangelicalism. My elders in the church had always told me that if I read too
    many books, my brain would railroad my heart and lead me away from the church.
    Turns out they were right.


    When I began to read widely in theology, philosophy, and church history during
    and after college, my perspective started to expand and change. It became clear
    to me that the timeless we had attributed to the Bible in my church were modern
    inventions. We learned that staunch commitment to voting Republican in order to
    oppose abortion of any kind was fueled by GOP operatives who preyed on the unborn
    in order to garner millions of votes. From there, I digested the histories of
    evangelical theologies of sex, gender, race, and immigration. As I read and studied
    and reflected on my own experience, the picture grew more complex and yet more
    vivid: White evangelicalism is a movement thoroughly entrenched in American nationalism,
    White supremacy, patriarchy, and xenophobia.


    It wasn''t easy to come to these revelations while I was still in ministry. Some
    Sundays I would lead prayers in front of two hundred teenagers wondering if I
    still believed in God. In March 2005, I received notice that I had been accepted
    into a master''s program in theology at Oxford University in the United Kingdom.
    This was my way out. When I arrived in Oxford in September of that year—a city
    of transcendent spires, cobblestone streets, ornate libraries, and medieval traditions—it
    was the first time in my adult life I was free to be myself without worrying that
    I was setting a bad example for the kids in my youth group or the church as a
    whole. Studying in the same places as John Locke and Dun Scot, and drinking my
    first beers in the same pub where J. R. R. Tolkien and C. S. Lewis used to meet
    weekly, was exhilarating as it was terrifying. My only job was to read theology
    and, in essence, figure out my approach to faith, politics, and the human condition.
    No one was policing my thoughts or my writing. I didn’t worry about who would
    see the stack of books on my desk and wonder'
