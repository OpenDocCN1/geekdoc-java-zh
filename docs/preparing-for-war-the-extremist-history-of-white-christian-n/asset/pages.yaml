- img_proc: true
  md: 'historical events leading up to the insurrection. There are also too many figures
    and historical markers to cover in depth. Some scholars have centered on figures
    such as Billy Graham and Richard Nixon; others have taken a longer view by going
    back to the nineteenth century to illuminate the present; and others have zeroed
    in on gender, sex, and immigration in order to understand the history of White
    Christianity in the United States. I am indebted to the scholars and journalists
    who have followed these routes, and this book draws on their insight many points.


    I am also indebted to the many Black authors who have articulated why it is to
    capitalize White, as I have done throughout this book. While Black has been capitalized
    for some time, White has not been. Many style guides recommend capitalizing the
    former but not the latter. In my view, it is important to capitalize White to
    draw attention to it as a racial category that demands observation and investigation.
    For too long, whiteness has been invisible, especially to White people. As Nell
    Irwin painter says, “We should capitalize ‘White’ to situate ‘Whiteness’ within
    the American ideology of race, within which ‘Black,’ but not ‘White,’ has been
    hypervisible as a group identity.” By capitalizing White, we call attention to
    the specific racial category that has a particular history in the United States
    and beyond.


    In order to focus this work, I decided to tell the story of the rise of White
    Christian nationalism since the 1960s, when various cultural and political movements
    transformed the United States and led to the extension of various civil rights
    and forms of cultural representation to religious, racial, sex, and ethnic minorities.
    This set off a counterrevolution that resulted in, among other things, religious
    support for the Trump presidency and the central role of Christian nationalism
    at the January 6 insurrection. Tracing this path makes it possible to see how
    the myth of the White Christian nation provided the basis for our polarized public
    square—what amounts to an American cold civil war—and the worst on the Capitol
    in two centuries.'
