  \n`errata@bpbonline.com`\n\nBPB Publications 全体衷感谢您的支持、建议和反馈。\n\n# 第 1 章\n\n## 引言与安装\n\
  \n## 引言\n\n每家企业都以或或的方式使用 Java。根据 Oracle 的数据，有超过 30 亿设备运行基于该开发平台设计的应用程序。Java 用于设计各种应用程序，从桌面\
  \ GUI、嵌入式系统、Web 应用程序（包括电子商务应用、前端和后台电子交易系统、结算和确认系统、数据处理、Web 服务器和应用程序服务器）、移动应用（包括\
  \ Android 应用）、企业级应用、科学应用以及中间件产品。\n\n由于应用范围广泛，我们需要足够的具备 Java 应用程序开发技能的人才来使用 Java\
  \ 来开发这一基础设施。编程语言的增长有两个原因：一个是为了适应环境的变化，另一个是为了实践编程能力的进步。促进 Java 产生的环境变化是对于旨在在互联网上共享的平台无关程序的需求。\n\
  \n另一方面，Java 也体现了人们编写程序方式的转变。例如，Java 改进并完善了 C++ 及其他面向对象编程语言使用的面向对象模型，进一步加入了对多线程的支持，并提供了一个简化互联网访问的库。Java\
  \ 是应对近期新兴的、极其分散的计算世界需求的理想回答。Java 之于互联网编程就像 C 语言之于系统编程：一种改变世界的创新力量。\n\n## 结构\n\n\
  * 引言\n* Java 历史\n* Java 特性\n* 下载并安装 JDK\n* JDK 版本\n* 配置 Java 开发环境\n* Eclipse IDE\n\
  * 练习题\n\n## 目标\n\n本章提供了 Java 编程语言的详细背景。阅读完本章后，读者将能够安装 Java 并处理 Eclipse IDE 来设计和开发各种\
  \ Java 项目。\n\n### Java 历史\n\nJava 最初于 1991 年由 `James Gosling`、`Patrick Naughton`、`Chris\
  \ Warth`、`Ed Frank` 和 `Mike Sheridan` 命名为 `Oak`，在 1995 年于 `Sun MicroSystems` 工作期间更名为\
  \ Java。许多人对 Java 语言的蓝图和发展做出了贡献，但主要的贡献者 Tim `Lindholm`、`Frank Yellin`、`Jonathan Payne`、`Bill\
  \ Joy` 和 `Arthur van Hoff`。Java 的新初衷并非基于互联网的应用程序，主要的灵感是对平台无关（或者说架构无关）语言的需求，这种语言可能用于生成嵌入到各种客户电子设备中的软件，例如微波炉和遥控器。正如我们推测的，许多不同类型的\
  \ CPU 被用控制器。为了寻找这种解决方案，Gosling 等人开始研究一种通用的、平台无关的语言，它可以用于构建在不同平台的多种 CPU 上运行的代码。这一努力最终导致了\
  \ Java 编程语言的基础。\n\n### Java 特性\n\nJava 的流行是因为其广泛的特性，这些特性促进了 Java 作为一种语言的成功。Java\
  \ 的一些特性如下：\n\n* **简单且熟悉**：根据 Sun Microsystems 开发一种简单且熟悉的的语言的愿景，Java 语言的语法源自 C，面向对象概念源自\
  \ C++。Java 像 C 一样是一种区分大小写的语言，它移除了指针概念（`this` 指针除外）、运算符重载、模板类、全局变量和头文件。对 C 和 C++\
  \ 有良好知识的程序员可以利用 C 的语法和控制结构以及 C++ 的面向对象概念。Java 的这一特性使其成为一种简单且熟悉的语言。\n* **编译和解释**：如果我们考虑任何其他语言，它们要么被编译要么被解释，例如在\
  \ C 中我们编译并运行它来生成输出。在 Java 中，我们首先使用 `javac`（编译器）将其生成具有 `.class` 扩展名的字节码文件。编译后我们需要使用\
  \ `java`（解释器）生成输出。这种生成字节码文件的两步过程使得这种语言既安全又平台无关。\n* **平台无关**：Java 编程语言成功的主要原因是它在任何平台上运行的能力。Java\
  \ 程序可以轻松从一个计算机系统移动到另一个计算机系统，随时随地。操作系统、处理器和系统资源的更改和升级都不会强迫 Java 程序发生任何更改。这就是 Java\
  \ 在互联网编程中如此受欢迎的原因。这样的一个例子就是 Java Applet 的使用，它们可以通过互联网从远程计算机下载到我们的本地机器并在本地执行。\n\n\
  \n\n\n如前所述，Java 程序是经过编译的，会生成一个字节码文件，该文件可以在任何机器上执行。使用 Java 的第二个优势是其原始数据类型的大小，这些类型是机器无关的。\n\
  \n*   **面向对象：** 使用 Java 作为编程语言时，最重要的特性是它能够以对象和类的形式来封装并实现一切内容。Java 是一门真正的面向对象的语言，它拥有海量的包（类组）来实现广泛的功能。因此，我们可以说，无论面向对象编程具有什么优势和特性，它们都自动适用于\
  \ Java。\n*   **安全且健壮：** 作为互联网编程的首选语言被实现，Java 保护自己免受许多安全风险的影响。不使用指针、对所有内存访问进行验证以及对小程序（applets）进行适当审查都是\
  \ Java 为确保安全而采取的措施。\n    Java 对数据类型有严格的编译时运行时检查，以确保代码的可靠性。捕捉运行时错误并消除系统崩溃风险的异常处理，以及基于垃圾回收的内存管理，是该语言保持健壮的原因。\n\
  *   **多线程：** Java 语言能够将其程序划分为多个任务并同时执行。例如，一个任务可能正在复制文件，而另外两个任务正在显示动画和播放音乐。用户会有所有三个任务都在同时执行的印象。操作系统级的功能如线程间通信和同步通过\
  \ Java 的多线程能力得到了高效实现。\n*   **性能：** Java 的高性能主要归功于中间字节码文件及其旨在减少运行时开销的高效架构。此外，多线程通过增强\
  \ Java 程序的整体执行速度为 Java 的性能做出了贡献。\n*   **对开发者友好：** 增强型 `forloop` 循环、泛型、自动装箱/拆箱、类型安全的枚举（enums）、静态导入和注解等特性使\
  \ Java 成为一门对程序员友好的语言。\n*   还有许多其他特性，如可扩展性和性能、JDBC、核心 XML 支持等，基于这些特性，Java 被认为是一种强大且流行的语言。\n\
  \n### 下载并安装 JDK\n\n`Java Development Kit (JDK)`，正式名称为 `Java Platform Standard Edition`\
  \ 或 `Java SE`，是编写从小型到大型 Java 项目的主要要。。JDK 可以从 Sun Microsystems（现为 Oracle 的一部分）免费获取。可以从以下网站免费下载\
  \ JDK (`Java SE`)：`[`www.oracle.com/technetwork/java/javase/overview/index.html`](http://www.oracle.com/technetwork/java/javase/overview/index.html)`。\n\
  \nJDK 包含 `Java Runtime (JRE)` 和各种开发执行程序（如编译器和调试器），是编写 Java 项目和进一步执行 Java 程序的强制要求。运行\
  \ Java 程序需要 JRE。换句话说，JRE 是 JDK 的子集。由于我们将编写并执行 Java 项目，因此应该安装包含 Java 运行环境的 JDK。\n\
  \n### JDK 版本\n\n从 Java 语言诞生之初，就发布了不同版本的 Java 以增强其能力并为程序员提供新包，以便在 Java 中实现一些主要项目。以下是已经发布的\
  \ Java 版本。参考：`[`en.wikipedia.org/wiki/Java_version_history`](https://en.wikipedia.org/wiki/Java_version_history)`。\n\
  \n*   **JDK Alpha and Beta (1995)：** Sun Microsystem 在 1995 年 9 月 23 日宣布了 Java。\n\
  *   **JDK 1.0 (1996 年 1 月)：** 最初称为 Oak（以 James Gosling 办公室外的橡树树命名）。在 JDK 1.0.2 中重命名为\
  \ Java 1。\n*   **JDK 1.1 (1997 年 2 月)：** 引入了 AWT 事件模型、内部类、JavaBean、JDBC 和 RMI。\n\
  *   **J2SE 1.2 (JDK 1.2) (1998 年 12 月)：** 重新品牌为 `Java 2`并将 JDK 重命名为 J2SE（Java 2\
  \ 标准版）。还发布了 `J2EE (Java 2 企业版)` 和 `J2ME (Java 2 微版)`。包含了 `JFC (Java Foundation Classes\
  \ - Swing、Accessibility API、Java 2D、可插件式外观和拖放)`。还引入了集合框架（Collection Framework）和\
  \ JIT 编译器。\n*   **J2SE 1.3 (JDK 1.3) (2000 年 5 月)：** 引入了 Hotspot JVM。\n*   **J2SE\
  \ 1.4 (JDK 1.4) (2002 年 2 月)：** 引入了断言语句、非阻塞 IO (nio)、日志 API、图像 IO、Java webstart、正则表达式（regex）支持。\n\
  *   **J2SE 5.0 (JDK 5) (2004 年 9 月)：** 正式命名为 5.0 而不是 1.5。引入了泛型、自动装箱/拆箱、注解、枚举、可变参数、for-each\
  \ 循环、静态导入。\n*   **Java SE 6 (JDK 6) (2006 年 12 月)：** 将 J2SE 重命名为 Java SE。\n*   **Java\
  \ SE 7 (JDK 7) (2011 年 7 月)：** Oracle 收购 Sun Microsystems 后的第一个版本 - 也称为 Oracle JDK。\n\
  *   **Java SE 8 (JDK 8) (LTS) (2014 年 3 月)：** 包含了对 Lambda、接口中默认方法的支持、改进的集合以及 Java\
  \ 运行时。\n*   **Java SE 9 (JDK 9) (2017 年 9 月)：** 引入了 Lambda 模块化、项目 Jigsaw 以及 jshell。\n\
  *   **Java SE 10 (JDK 10) (2018 年 3 月)：** 引入了用于类型推断的 var。\n*   **Java SE 11 (JDK\
  \ 11) (LTS) (2018 年 9 月)：** 扩展了 java.net 中的 HTTP 。\n*   **Java SE 12 (JDK 12) (2019\
  \ 年 3 月)：** 删除了 javah\n\n### 安装 JDK\n\n要在 Windows 上安装 JDK，遵循以下步骤：\n\n1. **移除/卸载旧版本的\
  \ JDK**\n   强烈建议我们只安装最新版本的 JDK。尽管我们可以同时安装多个版本的 JDK，但在运行 Java 程序时可能会产生不必要的混乱。\n \
  \  可以通过 `控制面板 | 程序和功能` 卸载所有以 Java 开头的程序，例如 `Java SE Development Kit..., Java SE...,\
  \ Java X Update...,` 等。\n\n2. **第 2 步：下载最新版本的 JDK**\n   *   前往 Java SE 下载站点：\n \
  \      `[`www.oracle.com/technetwork/java/javase/overview/index.html`](http://www.oracle.com/technetwork/java/javase/overview/index.html)`\n\
  \   *   在 `Java Platform, Standard Edition|Java SE 11.0` 下点击 `Oracle JDK |下载` 按钮。\n\
  \   *   在 `Java SE Development Kit 11.0` 下勾选 `接受许可协议`。\n   *   根据您的操作系统选择 JDK，即\
  \ `Windows 64 位或 32 位`。下载 `exe` 安装程序（例如 `jdk-11.0.{x}_windows-64_bin.exe`，约 150MB）。\n\
  \n3. **第 3 步：安装 JDK**\n   运行下载的安装程序（例如 `jdk-11.0.{x}_windows-64_bin.exe`），这将安装 JDK\
  \ 和 JRE。\n   默认情况下，JDK 安装在目录 `C:\\Program Files\\Java\\jdk-11.0.{x}`，同意默认设置并按照屏幕说明安装最新版本的\
  \ JDK。\n   使用`文件管理器` 导航到 `C:\\Program Files\\Java` 以检查子目录。记录下您的 JDK 安装目录，特别是更新更新号\
  \ {x}，您在下一步中将需要它。\n\n\n\n在下面的图中，JDK 的安装目录为 `C:\\Program Files\\Java\\jdk1.8.0_131:`。\n\
