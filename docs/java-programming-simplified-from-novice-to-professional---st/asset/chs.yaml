  \            AdapterDemo.n3=AdapterDemo.n1/AdapterDemo.n2;\n            AdapterDemo.msg\
  \ =\"Division =\";\n        }\n        JOptionPane.showMessageDialog(f, AdapterDemo.msg\
  \ + AdapterDemo.n3, \"Result\", JOptionPane.INFORMATION_MESSAGE);\n    }\n}\n```\n\
