  \ C 语言相同，它拥有了所有语法与 C 和 C++ 相似的控制结构。在本节中，我们将结合相关的 Java 程序详细讨论决策结构和循环结构。\n\n#### if\
  \ 语句\n\n`if` 语句为了控制 Java 程序中各种语句的执行流，`if` 语句被认为强大的语句。`if` 语句的不同形式如下：\n\n```java\n\
  // 带有一个语句的 if\nif (condition )\n    Statement ;\n\n// 带有多个语句的 if\nif (condition\
  \ ) {\n    Statement 1 ;\n    Statement 2 ;\n    Statement N ;\n}\n\n// 带有一个语句和\
  \ else 的 if\nif (condition )\n    Statement 1 ;\nelse\n    Statement 2 ;\n\n// 带有多个语句和\
  \ else 的 if\nif (condition ) {\n    Statement 1 ;\n    Statement 2 ;\n    Statement\
  \ N ;\n}\nelse {\n    Statement 1 ;\n    Statement 2 ;\n    Statement N ;\n}\n```\n\
  \n上述语句可以通过下面的 Java 程序来理解：\n\n```java\npublic class ExampleIf {\n    public static\
  \ void main(String args[]) {\n        int x, y;\n        x = 100;\n        y = 200;\n\
  \        if(x < y) System.out.println(\"Y is greater than X\");\n        x = x *\
  \ 2;\n        if(x == y) System.out.println(\"X equal to Y\");\n        x = x *\
  \ 2;\n        if(x > y) System.out.println(\"X greater than Y\");\n        // 这不会显示任何内容\n\
  \    }\n}\n```\n\n上述代码的输出如下：\n**Y is greater than X**\n**X equal to Y**\n**X greater\
  \ than Y**\n\n下一个示例也使用了 `if` 语句：\n\n```java\npublic class IfElse {\n    public static\
