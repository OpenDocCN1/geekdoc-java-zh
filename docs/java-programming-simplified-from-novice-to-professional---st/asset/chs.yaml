  \ 开发一个执行计算器所有操作的 applet？\n\n# 第 9 章\n\n# Java 中的输入与输出\n\n## 引言\n\n在本章中，我们将讨论 Java\
  \ 中最重要的包之一，即 `java.io` 包。正如名称所示，我们将使用 `java.io` 包。\n\n\n\n\n| `ObjectOutputStream`\
  \ | 对象的输出流 |\n| `OutputStream` | 描述流输出的抽象类 |\n| `PipedInputStream` | 输入管道。 |\n|\
  \ `PipedOutputStream` | 输出管道。 |\n| `PrintStream` | 包含 `print()` 和 `println()` 的输出流。\
  \ |\n| `PushbackInputStream` | 支持单字节重置（unget）的输入流，它可以向输入流返回一个字节。 |\n| `RandomAccessFile`\
  \ | 支持随机访问文件 I/O。 |\n| `SequenceInputStream` | 两个或多个输入流的组合，这些流将按顺序一个接一个地读取。 |\n\n\
  **表 9.1：** 字节流类\n\n`InputStream` 是一个抽象类，定义了 Java 的字节输入流模型。该类中的大多数方法会在发生错误时抛出 `IOException`。`InputStream`\
  \ 中的方法列如表 9.2 所示：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `int available( )` | 返回当前可读的输入字节数。\
  \ |\n| `void close( )` | 关闭输入源。后续的读取尝试将产生 `IOException`。 |\n| `void mark(int numBytes)`\
  \ | 在输入流的当前位置放置标记，该标记在读取 `numBytes` 个字节之前有效。 |\n| `boolean markSupported( )` | 如果调用流支持\
  \ `mark( )/reset( )`，则返回 true。 |\n| `int read( )` | 返回下一个可用字节的整数表示。遇到文件末尾时返回 -1。\
  \ |\n| `int read(byte buffer[ ])` | 尝试向缓冲区读取最多 `buffer.length` 个字节，并返回实际读取的实际字节数。遇到文件末尾时返回\
  \ -1。 |\n| `int read(byte buffer[ ], int offset, int numBytes)` | 尝试从 `buffer[offset]`\
  \ 开始向缓冲区读取最多 `numBytes` 个字节，返回实际读取的字节数。遇到文件末尾时返回 -1。 |\n| `void reset( )` | 将输入指针重置为之前设置的标记。\
  \ |\n| `long skip(long numBytes)` | 忽略（跳过）`numBytes` 个输入字节，返回实际忽略的字节数。 |\n\n**表\
  \ 9.2：** `InputStream` 定义的方法\n\n`OutputStream` 是一个定义字节输出的抽象类。表 9.3 显示了 `OutputStream`\
  \ 的方法：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `void close( )` | 关闭输出流。后续的写入尝试将产生 `IOException`。\
  \ |\n| `void flush( )` | 结束输出状态以便清除任何缓冲区。也就是说，刷新输出缓冲区。 |\n| `void write(int b)`\
  \ | 向输出流写入单个字节。注意参数是 int，这允许你直接对表达式调用 `write( )` 而无需将其转换回字节。 |\n| `void write(byte\
  \ buffer[ ])` | 向输出流写入完整的字节数组。 |\n| `void write(byte buffer[ ], int offset, int\
  \ numBytes)` | 从 `buffer[offset]` 开始向输出流写入 `numBytes` 个字节范围。 |\n\n**表 9.3：** `OutputStream`\
  \ 定义的方法\n\n## 字符流类\n\n字符流通过两个类层次结构定义。顶部是两个抽象类：`Reader` 和 `Writer`。这些抽象类处理 Unicode\
  \ 字符流。Java 为这些类提供了几个具体的子类。字符流类如下所示：\n\n| 流类 | 含义 |\n| :--- | :--- |\n| `BufferedReader`\
  \ | 缓冲输入字符流。 |\n| `BufferedWriter` | 缓冲输出字符流。 |\n| `CharArrayReader` | 从字符数组的输入流。\
  \ |\n| `CharArrayWriter` | 向字符数组写入的输出流。 |\n| `FileReader` | 从文件读取的输入流。 |\n| `FileWriter`\
  \ | 向文件写入的输出流。 |\n| `FilterReader` | 过滤器。 |\n| `FilterWriter` | 过滤器 writer。 |\n\
  | `InputStreamReader` | 将字节转换为字符的输入流。 |\n| `LineNumberReader` | 统计行的输入流。 |\n| `OutputStreamWriter`\
  \ | 将字符转换为字节的输出流。 |\n| `PipedReader` | 输入管道。 |\n| `PipedWriter` | 输出管道。 |\n| `PrintWriter`\
  \ | 包含 `print()` 和 `println()` 的输出流。 |\n| `PushbackReader` | 允许字符返回输入流的输入流。 |\n\
  | `Reader` | 描述字符流输入的抽象类。 |\n| `StringReader` | 从字符串读取的输入流。 |\n| `StringWriter`\
  \ | 向字符串写入的输出流。 |\n| `Writer` | 描述字符流输出的抽象类。 |\n\n**表 9.4：** java.io 中定义的字符流类\n\n\
  `Reader` 是一个抽象类，定义了 Java 的字符输入流模型。表 9.5 提供了 `Reader` 方法的概述：\n\n| 方法 | 描述 |\n| :---\
  \ | :--- |\n| `abstract void close( )` | 关闭输入源。后续的读取尝试将产生 `IOException`。 |\n| `void\
  \ mark(int numChars)` | 在输入流的当前位置放置标记，该标记在读取 `numChars` 个字符之前有效。 |\n| `boolean markSupported(\
  \ )` | 如果此流支持 `mark( )/reset( )`，则返回 true。 |\n| `int read( )` | 返回输入流中下一个可用字符的整数表示。遇到文件末尾时返回\
  \ -1。 |\n| `int read(char buffer[ ])` | 尝试向缓冲区读取最多 `buffer.length` 个字符，并返回实际读取的字符数。遇到文件末尾时返回\
  \ -1。 |\n| `int read(char buffer[ ], int offset, int numChars)` | 尝试从 `buffer[offset]`\
  \ 开始向缓冲区读取最多 `numChars` 个字符，返回实际读取的字符数。遇到文件末尾时返回 -1。 |\n| `boolean ready( )` | 如果下一次读取不需要等待，则返回\
  \ true。否则返回 false。 |\n| `void reset( )` | 将输入指针重置为之前设置的标记。 |\n| `long skip(long\
  \ nChars)` | 忽略（跳过）`nChars` 个输入字符，返回实际忽略的字符数。 |\n\n**表 9.5：** `Reader` 定义的方法\n\n\
  `Writer` 是一个定义字符输出的抽象类。`Writer` 类的各种方法如下：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `append(char\
  \ ch)` | 将 `ch` 追加到输出流的末尾。返回调用流的引用。 |\n| `append(CharSequence chars)` | 将 `chars`\
  \ 追加到输出流的末尾。返回调用流的引用。 |\n| `append(CharSequence chars, int begin, int end)` | 将\
  \ `begin` 和 `end` 指定的 `chars` 追加到输出流的末尾。返回调用流的引用。 |\n| `void close( )` | 关闭输出流。后续的写入尝试将产生\
  \ `IOException`。 |\n| `void flush( )` | 结束输出状态以便清除任何缓冲区。也就是说，刷新输出缓冲区。 |\n| `void\
  \ write(int ch)` | 向输出流写入单个字符。注意参数是 int，这允许你直接对表达式调用 `write( )` 而无需将其转换回字符。 |\n\
  | `void write(char buffer[ ])` | 向输出流写入完整的字符数组。 |\n| `void write(char buffer[ ],\
  \ int offset, int numChars)` | 从缓冲区 `buffer[offset]` 开始向输出流写入 `numChars` 个字符范围。\
  \ |\n| `void write(String str)` | 向输出流写入 `str`。 |\n| `void write(String str, int\
  \ offset, int numChars)` | 从 `string str` 的指定偏移量开始写入 `numChars` 个字符范围。 |\n\n\n\n\
  \n\n以下接口在 `java.io` 中被定义：\n\n| `Closeable` | `FileFilter` | `ObjectInputValidation`\
  \ |\n| :--- | :--- | :--- |\n| `DataInput` | `FilenameFilter` | `ObjectOutput` |\n\
  | `DataOutput` | `Flushable` | `ObjectStreamConstants` |\n| `Externalizable` | `ObjectInput`\
  \ | `Serializable` |\n\n**表 9.7:** `java.io` 中的接口\n\n两个通过缓冲输入输出来提高性能的重要类是 `BufferedReader`\
  \ 和 `BufferedWriter`。`BufferedReader` 有两个构造函数：\n\n`BufferedReader(Reader inputStream)`\n\
  `BufferedReader(Reader inputStream, int bufSize)`\n\n`BufferedWriter` 拥有以下两个构造函数：\n\
  \n`BufferedWriter(Writer outputStream)`\n`BufferedWriter(Writer outputStream, int\
  \ bufSize)`\n\n以下示例说明了上述类的用法。\n\n该程序使用了 `BufferedReader` 类，该类反而使用 `InputStreamReader`\
  \ 和 `System.in` 作为其构造函数的参数，以便从用户处获取输入。程序使用了 `BufferedReader` 的 `read` 方法：\n\n```javapackage\
  \ book;\nimport java.io.*;\nclass InputExample {\n    public static void main(String\
