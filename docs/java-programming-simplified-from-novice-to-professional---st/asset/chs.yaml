  **Press 4 for Division**\n**Press 5 for Exit**\n**5**\n\n#### ?: 运算符\n\n通称为条件运算符的是另一种根据表达式的值选择一个语句的方法。`?:`\
  \ 运算符的通用形式为：\n\n`Expression Condition ? Expression 1 : Expression 2`\n\n`Example`\n\
  \n`Value = (a>b ) ? 10 : 20;`\n\n\n\n\n在上面的示例中，如果表达式 `a>b` 结果为真，则 `Value` 将获得值 `10`，否则它将存储\
  \ 20。上面的表达式可以使用 `if…else` 语句写为：\n\n```java\nif (a>b)\nValue =10;\nelse\nValue =20;\n\
  ```\n\n下面的程序阐述了 `?:` 运算符的使用：\n\n```java\npublic class Operator\n{\n    public static\
