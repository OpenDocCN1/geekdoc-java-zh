  \ 2`\n\n在接下来的 Java 程序中，实现了接口 `SportsMarks`，其方法在派生类中定义：\n\n```java\nclass Exam\n\
  {\n    int roll;\n    String name;\n    Exam()\n    {}\n    Exam(int a, String s)\n\
