  \n# Java 字符串处理\n\n字符串处理是开发中的某项主要任务。许多编程语言中的字符串可以通过创建字符数组来处理，但 Java 对字符串处理赋予了特殊重视，并以名为\
  \ `String` 的类来实现。因此，Java 中的字符串不是基本类型而是完整的类。因此，`String` 类拥有一套构造函数和方法来比较两个字符串、在字符串中搜索字符、查找字符串中的子字符串以及更改字母的大小写。此外，String\
  \ 对象可以通过多种方式构造。`String`、`StringBuffer` 和 `StringBuilder` 类定义在 `java.lang` 包中。它们都被声明为\
  \ `final`，这意味着这些类不能被继承。要创建一个 `String` 对象，可以使用以下构造函数：\n\n- `String()`\n- `String(char[])`\n\
  - `String(char ch, int startIndex, int numchars)`\n- `String(String st)`\n- `String(byte[])`\n\
  - `String(byte[], int startIndex, int numchars)`\n\n下面的示例演示了如何使用构造函数创建 `String`\
  \ 对象。在下面的 Java 程序中，使用字符串类的不同构造函数创建 String 对象：\n\n```java\npackage book;\npublic\
  \ class String_Demo {\n  public static void main(String[] args) {\n    System.out.println(\"\
  Creation of String object using String Constructors\");\n    String str1 = new String();\n\
  \    char c[]={'N','I','E','T'};\n    String str2 = new String(c);\n    String str3\
  \ = new String(c, 4,2);\n    String str4 = new String(str2);\n    byte b[]={65,66,67,68};\n\
  \    String str5 = new String(b);\n    String str6 = new String(b,0,2);\n    System.out.println(\"\
  Using Default Constructor str1 holds nothing \" + str1);\n    System.out.println(\"\
  str2 = \" + str2);\n    System.out.println(\"str3 = \" + str3);\n    System.out.println(\"\
  str4 = \" + str4);\n    System.out.println(\"str5 = \" + str5);\n    System.out.println(\"\
  str6 = \" + str6);\n  }\n}\n```\n\n我们将得到以下输出：\n\n`Creation of String object using\
  \ String Constructors`\n`Using Default Constructor str1 holds nothing`\n`str2 =\
  \ NIELIT`\n`str3 = IT`\n`str4 = NIELIT`\n`str5 = ABCD`\n`str6 = AB`\n\n可以通过 Eclipse\
  \ 编辑器的智能提示（按下对象名和运算符 `Ctrl+ Space`）轻松访问各种字符串方法。下表提供了 `String` 类中可用方法的详细信息：\n\n|\
