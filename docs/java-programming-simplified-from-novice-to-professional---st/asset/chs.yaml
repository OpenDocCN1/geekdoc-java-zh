  **总分数为 700**\n\n### 方法重写\n\n如果我们在基类中有一个方法，并在派生类中重新定义了同名方法，这种概念就被称为**方法重写**（method\
  \ overriding）。在类继承链中，当子类中的方法与其父类中的方法具有相同的名称和类型签名时，则子类中的方法被认为重写了父类中的方法。当从子类内部调用被重写的方法时，它将始终引用由子类定义的该方法版本。父类定义的方法版本将被隐藏。例如，下面的程序段重写了基类中的\
  \ `show` 方法：\n\n```java\nclass BaseClass\n{\n    // Body of the class\n    void\
  \ show( )\n    {\n        // Body of show ( ) method\n    }\n}\nclass DerivedClass\
  \ extends BaseClass\n{\n    // Body of the class\n    void show( )\n    {\n    \
  \    // Body of show ( ) method\n    }\n}\n```\n\n现在，如果我们创建一个 `DerivedClass` 的对象，它将拥有两个\
  \ `show()` 方法。将调用它所在类中的 `show()` 方法。为了调用 `BaseClass` 的 `show()` 方法，使用了 `super` 关键字。下面的示例说明了方法重写的用法。在接下来的\
  \ Java 程序中，我们有一个基类和一个派生类。两个类中都定义了 `display` 方法。如果使用派生类对象来访问 `display`，它将访问其在所属类中定义的版本。现在，如果我们想调用基类的\
  \ `display`，我们必须使用 `super.display()`：\n\n```java\nclass Base {\n    void display()\
  \ { }\n}\nclass Derived extends Base {\n    void display() {\n        super.display();\n\
  \    }\n}\n```\n\n（注：由于原文在后半部分存在大量重复和格式混乱，上述译文已根据指令对核心逻辑部分进行了翻译与格式整理。）\n\n\n\n\n\
  \n```java\nclass A {\n    A() {\n        System.out.println(\" Default Constructor\
  \ of A Class\");\n    }\n    A(int a) {\n        da=a;\n        System.out.println(\"\
  Parameterized Constructor of A Class\");\n    }\n    void show() {\n        System.out.println(\"\
  Data of A =\" + da);\n    }\n}\n\nclass B extends A {\n    int db;\n    B() {\n\
  \        System.out.println(\" Default Constructor of B Class\");\n    }\n    B(int\
  \ a,int b) {\n        super(a);\n        db=b;\n        System.out.println(\"Parameterized\
  \ Constructor of B Class\");\n    }\n    void show() {\n        super.show();\n\
  \        System.out.println(\"Data of B =\" + db);\n    }\n}\n\nclass C extends\
  \ B {\n    int dc;\n    C() {\n        System.out.println(\"Constructor of C Class\"\
  );\n    }\n    C(int a,int b,int c) {\n        super(a,b);\n        dc=c;\n    \
  \    System.out.println(\"Parameterized Constructor of C Class\");\n    }\n    C(int\
  \ a) {\n        //super();\n        dc=a;\n        System.out.println(\"Parameterized\
  \ Constructor of C Class\");\n    }\n    void show() {\n        super.show();\n\
  \        System.out.println(\"Data of C =\" + dc);\n    }\n}\n\npublic class Super_Demo\
  \ {\n    public static void main(String[] args) {\n        C obj=new C(2,3,4);\n\
  \        C obj2=new C(2);\n        obj.show();\n    }\n}\n```\n\n我们将得到以下输出：\n\n\
  *Parameterized Constructor of A Class*\n*Parameterized Constructor of B Class*\n\
  *Parameterized Constructor of C Class*\n*Default Constructor of A Class*\n*Default\
  \ Constructor of B Class*\n*Parameterized Constructor of C Class*\n*Data of A =2*\n\
  *Data of B =3*\n*Data of C =4*\n\n### final 关键字\n\n` `final` 关键字用于以下场景：\n\n*   **将类声明为\
  \ final：** 如果类被声明为 `final`，则不能被继承。声明类为 `final` 的语法如下：\n\n```java\nfinal ClassName\n\
  {\n    // 类的体\n}\n```\n\n*   **防止方法重写：** 如我们所知，方法重写是在基类中有一个方法，并在派生类中以相同的名称重新定义该方法。如果我们不希望派生类创建同名方法，我们可以在基类中创建一个为\
  \ `final` 方法。这将防止派生类重写该方法。使用 `final` 方法的语法为：\n\n```java\nfinal methodName()\n{\n\
  }\n```\n\n*   `final` 关键字的另一个重要特性是我们可以创建常量。如果我们对变量使用 `final`，则它的值就不能更改。例如，`data`\
  \ 的值无法更改，因为它已经被声明为 `final` 了。\n\n```java\nfinal int data=100;\n```\n\n让我们通过以下示例来理解\
  \ `final` 的用法：\n\n在接下来的示例中，我们创建了一个 `final` 类 `MyClass` 并尝试继承它，但从错误信息可以看出 `class\
  \ B` 无法继承 `final` 类：\n\n![](img/3-6.jpg)\n\n**图 3.7：** final 类无法被继承 final 类无法被继承\n\
  \n在这个 Java 程序中，方法被创建为 `final` 方法，Java 不允许我们重写基类中的 `final` 方法：\n\n![](img/3-7.jpg)\n\
  \n**图 3.8：** final 方法无法被重写\n\n在这个 Java 程序中，我们尝试更改一个 `final` 数据成员的内容：\n\n![](img/3-8.jpg)\n\
  \n**图 3.9：** final 数据示例\n\n### abstract 关键字\n\n`abstract` 关键字用于方法或类。如果它在定义方法时被使用，则表示该方法必须在派生类中重新定义，换句话说，它必须被重写。这意味着\
  \ `abstract` 关键字与 `final` 关键字是相反的。如果 `abstract` 关键字用于类名，则表示我们必须继承该类，并且不能直接创建该类的对象。我们不能在构造函数和静态方法中使用\
  \ `abstract`。下面的示例说明了 `abstract` 的用法。\n\n在接下来的 Java 程序中，创建了一个带有抽象方法的抽象基类。这些方法的实际定义在派生类中实现。这里要提的是，`abstract`\
  \ 方法没有体，且所有抽象方法必须在派生类中定义：\n\n```java\npackage book;\nabstract class MyClass\n{\n\
  \    abstract void show();\n    abstract void display();\n}\n\nclass B extends MyClass\n\
  {\n    void show() {\n        System.out.println(\"Actual Implementation of show\
  \ method\");\n    }\n    void display() {\n        System.out.println(\"Actual Implementation\
  \ of display method\");\n    }\n}\n\npublic class Abstract_Demo {\n    public static\
  \ void main(String[] args) {\n        B obj=new B();\n        obj.show();\n    \
  \    obj.display();\n    }\n}\n```\n\n\n\n\n\n1. 创建一个与 `nielit` 同名的子目录。如果我们正在使用命令提示符（Command\
