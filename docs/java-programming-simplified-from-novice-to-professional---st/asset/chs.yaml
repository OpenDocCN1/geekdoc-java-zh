  \ 如果 `ch` 在 `identifier` 中应被忽略，则返回 true；否则返回 false。 |\n| `static boolean isISOControl(char\
  \ ch)` | 如果 `ch` 是 ISO 控制字符则返回 true；否则返回 false。 |\n| `static boolean isJavaIdentifierPart(char\
  \ ch)` | 如果 `ch` 允许作为 Java 标识符的一部分（第一个字符外），则返回 true；否则返回 false。 |\n| `static boolean\
  \ isJavaIdentifierStart(char ch)` | 如果 `ch` 允许作为 Java 标识符的首字符，则返回 true；否则返回 false。\
  \ |\n| `static boolean isLetter(char ch)` | 如果 `ch` 是字母则返回 true；否则返回 false。 |\n\
  | `static boolean isLetterOrDigit(char ch)` | 如果 `ch` 是字母或数字则返回 true；否则返回 false。\
  \ |\n| `static boolean isLowerCase(char ch)` | 如果 `ch` 是小写字母则返回 true；否则返回 false。\
  \ |\n| `static boolean isMirrored(char ch)` | 如果 `ch` 是镜像 Unicode 字符则返回 true。镜像字符是在从右向左显示的文本中反的字符。\
  \ |\n| `static boolean isSpaceChar(char ch)` | 如果 `ch` 是 Unicode 空格字符则返回 true；否则返回\
  \ false。 |\n| `static boolean isTitleCase(char ch)` | 如果 `ch` 是 Unicode 标题大小字符则返回\
  \ true；否则返回 false。 |\n| `static Boolean isUnicodeIdentifierPart(char ch)` | 如果 `ch`\
  \ 允许作为 Unicode 标识符的一部分（第一个字符外），则返回 true；否则返回 false。 |\n| `static Boolean isUnicodeIdentifierStart(char\
  \ ch)` | 如果 `ch` 允许作为 Unicode 标识符的首字符，则返回 true；否则返回 false。 |\n| `static boolean\
  \ isUpperCase(char ch)` | 如果 `ch` 是大写字母则返回 true；否则返回 false。 |\n| `static boolean\
  \ isWhitespace(char ch)` | 如果 `ch` 是空白字符则返回 true；否则返回 false。 |\n| `static char toLowerCase(char\
  \ ch)` | 返回 `ch` 的小写等效值。 |\n| `static char toTitleCase(char ch)` | 返回 `ch` 的标题大小等效值。\
  \ |\n| `static char toUpperCase(char ch)` | 返回 `ch` 的大写等效值。 |\n\n**表 5.12:** 各种\
  \ `Character` 方法\n\n### Boolean（布尔）\n\n`Boolean` 是 `boolean` 值的浅包装类，当我们想要按引用传递布尔变量时通常很有帮助。它包含常量\
  \ `TRUE` 和 `FALSE`，这两个常量定义了真和假的 `Boolean` 对象。`Boolean` 还定义了 `TYPE` 字段，它是 `Boolean`\
  \ 的 `Class` 对象。`Boolean` 定义了这些构造函数：\n\n```java\nBoolean(boolean boolValue)\nBoolean(String\
  \ boolString)\n```\n\n`Boolean` 类中提供的各种方法如下：\n\n| 方法 | 描述 |\n| :--- | :--- |\n|\
  \ `boolean booleanValue( )` | 返回 `boolean` 等效值。 |\n| `int compareTo(Boolean b)`\
  \ | 如果此对象大于 `b` 则返回正值，如果相等则返回 0，如果小于则返回负值。 |\n| `boolean equals(Object obj)` | 如果指定对象相等则返回\
  \ true。 |\n| `int hashCode()` | 返回 `Boolean` 对象的哈希值。 |\n| `static boolean parseBoolean(String\
  \ s)` | 解析字符串并返回对应的布尔值。 |\n| `static Boolean valueOf(String s)` | 返回一个表示字符串布尔值的\
  \ `Boolean` 对象。 |\n\n**表 5.13:** 解析布尔值的方法\n\n### 示例程序\n\n下面的程序阐述了包装类的用法。\n\n```java\n\
