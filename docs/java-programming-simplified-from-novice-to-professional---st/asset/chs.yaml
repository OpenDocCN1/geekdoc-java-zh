  \ package\");\n    }\n}\n\n// Admin Class\npackage nielit.employee;\npublic class\
  \ Admin {\n    public Admin()\n    {\n        System.out.println(\"Constructor of\
  \ Admin\");\n    }\n    public void showAdmin()\n    {\n        System.out.println(\"\
  Admin Class within nielit.employee package\");\n    }\n}\n```\n\n3. 现在成功编译类后，是时候重用它们了。使用以下语句来导入所有类：\n\
  \n```java\npackage book;\nimport nielit.employee.*;\nimport.*;\npublic class Package_Demo\
  \ {\n    public static void main(String[] args) {\n        MCA m1 =new MCA();\n\
  \        IT m2= new IT();\n        BCA m3 = new BCA();\n        m1.showMCA();\n\
  \        m2.showIT();\n        m3.showBCA();\n    }\n}\n```\n\n4. 我们将得到以下输出：\n\n\
  ```\nConstructor of MCA\nConstructor of IT\nConstructor of BCA\nMCA Class within\
  \ nielit package\nIT Class within nielit package\nBCA Class within nielit package.\n\
  ```\n\n### 包的访问控制\n\n在前面的章节中，我们学习了 Java 访问控制机制的不同方面及其访问修饰符。例如，我们之前理解对私有成员的访问仅允许该类的其他成员访问。包为访问控制增加了额外的维度。正如我们所看到的，Java\
  \ 提供了许多安全级别，允许对类、子类和包内部变量和方法的可见性进行更细粒度的控制。类和包是封装和包含命名空间及范围的方式。包是类和其他包的容器。类是数据和代码的容器。类是\
  \ Java 抽象单元。由于类和包之间的关系，Java 处理类成员的四种可见性：\n\n* 同包中的子类\n* 同包中的非子类\n* 不同包中的子类\n* 既不在同一包也不是子类的类\n\
  \n三个访问修饰符 `private`、`public` 和 `protected` 提供了多种方式来产生这些类别所需的各种访问级别。下表总结了这些相互作用：\n\
  \n| | private | 无修饰符 | protected | public |\n| :--- | :--- | :--- | :--- | :---\
  \ |\n| 同一个类 | 是 | 是 | 是 | 是 |\n| 同包子类 | 否 | 是 | 是 | 是 |\n| 同包非子类 | 否 | 是 | 是 | 是\
  \ |\n| 不同包子类 | 否 | 否 | 是 | 是 |\n| 不同包非子类 | 否 | 否 | 否 | 是 |\n\n\n\n\n\n#### 表 4.1:\
  \ 使用包访问类成员\n\n为了理解类成员的可见性，让我们来看来看以下示例：\n\n```java\n// nielit 包内部的 BCA 类\npackage\
  \ nielit;\n\npublic class BCA {\n    public int pub_data;\n    private int pri_data;\n\
  \    protected int pro_data;\n\n    public BCA() {\n        System.out.println(\"\
  Constructor of BCA\");\n    }\n\n    public void showBCA() {\n        System.out.println(\"\
  BCA Class within nielit package\");\n    }\n}\n```\n\n上述类中的三个数据成员分别被声明为公共（public）、私有（private）和保护（protected）。如果我们想像下面的类那样，在同一个包内访问这些成员，那么对于私有数据我们将遇到错误，因为它只能在定义的类内部被访问：\n\
  \n```java\npackage nielit;\npublic class IT extends BCA {\n    public IT() {\n \
  \       System.out.println(\"Constructor of IT\");\n    }\n\n    public void showData()\
  \ {\n        System.out.println(\"Public Data =\" + pub_data);\n        System.out.println(\"\
  Private Data =\" + pri_data); // ：私有数据不可访问\n        System.out.println(\"Protected\
  \ Data =\" + pro_data);\n    }\n\n    public void showIT() {\n        System.out.println(\"\
  IT Class within nielit package\");\n    }\n}\n```\n\n现在，假设我们没有从 `BCA` 类继承 `IT` 类，那么私有数据将产生如下错误：\n\
  \n```java\npackage nielit;\npublic class IT {\n    public IT() {\n        System.out.println(\"\
  Constructor of IT\");\n    }\n\n    public void showData() {\n        BCA obj =\
  \ new BCA();\n        System.out.println(\"Public Data =\" + obj.pub_data);\n  \
  \      System.out.println(\"Private Data =\" + obj.pri_data); // ：私有数据不可访问\n   \
  \     System.out.println(\"Protected Data =\" + obj.pro_data);\n    }\n\n    public\
  \ void showIT() {\n        System.out.println(\"IT Class within nielit package\"\
  );\n    }\n}\n```\n\n现在，如果我们想从其他包访问相同的数据，私有和保护数据将产生如下错误：\n\n```java\npackage book;\n\
  import nielit.BCA;\npublic class IT {\n    public IT() {\n        System.out.println(\"\
  Contructor of IT\");\n    }\n\n    public void showData() {\n        BCA obj = new\
  \ BCA();\n        System.out.println(\"Public Data =\" + obj.pub_data);\n      \
  \  System.out.println(\"Private Data =\" + obj.pri_data); // ：私有数据不可访问\n       \
  \ System.out.println(\"Protected Data =\" + obj.pro_data); // 错误\n    }\n\n    public\
  \ void showIT() {\n        System.out.println(\"IT Class within nielit package\"\
  );\n    }\n}\n```\n\n如果我们继承上述类，那么保护数据就不会产生错误，只有私有数据会产生如下错误：\n\n```java\npackage\
  \ book;\nimport nielit.BCA;\npublic class IT extends BCA {\n    public IT() {\n\
  \        System.out.println(\"Constructor of IT\");\n    }\n\n    public void showData()\
  \ {\n        System.out.println(\"Public Data =\" + pub_data); // OK\n        System.out.println(\"\
  Private Data =\" + pri_data); // ：私有数据不可访问\n        System.out.println(\"Protected\
  \ Data =\" + pro_data); // OK\n    }\n\n    public void showIT() {\n        System.out.println(\"\
  IT Class within nielit package\");\n    }\n}\n```\n\n从上面的说明可以清楚地看出，公共数据可以从任何地方访问，而私有成员仅在定义它们的类内部可见。保护成员在同一个包内可见的，并且如果该类是子类，则在包外部也可见。\n\
  \n### 理解 Java 内置包\n\nJava 的大部分功能是通过存储在不同 Java API 包中的类来实现的。这些类根据其功能组合在一起，并以包的形式提供给程序员。以下是一些常用的\
  \ Java 包：\n\n| 包名 | 类描述 |\n| :--- | :--- |\n| `java.lang` | 它包含了语言支持类，如 `Integer`、`String`、`Thread`\
  \ 等。 |\n| `java.util` | 它包含了各种工具类，如 `Date`、`Random` 等。 |\n| `java.awt` | 为了创建 GUI\
  \ 类型的应用程序，导入此包。它包含了 `Button`、`Frame`、`TextField` 等类。 |\n| `java.io` | 为了处理 Java\
  \ 中的输入/输出，需要 `io` 包。该包将在 `[第 9 章：Java 中的输入输出]` 中讨论。 |\n| `java.sql` | 此 `sql` 包用于数据库连接。它包含了\
  \ `Connection`、`ResultSet` 等类。 |\n| `java.event` | 事件处理。 |\n| `java.applet` | Applet\
  \ 类。 |\n\n#### 表 4.2: `java.lang` 中的类\n\n`java.lang` 是默认包。我们不需要导入它。它包含以下类：\n\n|\
