  \     System.out.print(\" \" + arr[i] );\n            if (max<arr[i])\n        \
  \        max=arr[i];\n            if (min>arr[i])\n                min = arr[i];\n\
  \        }\n        System.out.println(\"\");\n        System.out.println(\"The\
  \ sum of above array =\" + sum);\n        System.out.println(\"The Max of above\
  \ array =\" + max);\n        System.out.println(\"The Min of above array =\" + min);\n\
  \        System.out.println(\"The Reverse of above array =\");\n        for(int\
  \ i=arr.length-1;i>=0;i--)\n        {\n            System.out.print(\" \" + arr[i]\
  \ );\n        }\n        for(int i=0;i<arr.length;i++)\n        {\n            for(int\
  \ j=i+1;j<arr.length;j++)\n            {\n                if (arr[i]>arr[j])\n \
  \               {\n                    int temp=arr[i];\n                    arr[i]=arr[j];\n\
  \                    arr[j]=temp;\n                }\n            }\n        }\n\
  \        System.out.println(\"\");\n        System.out.println(\"After Sorting \"\
  );\n        for(int i=0;i<arr.length;i++)\n        {\n            System.out.print(\"\
  \ \" + arr[i] );\n        }\n    }\n}\n```\n\n我们将得到以下输出：\n\n**The various operations\
  \ on this array**\n`20 50 10 60 70`\n**The sum of above array=210**\n**The Max of\
  \ above array =70**\n**The Min of above array=10**\n**The Reverse of above array\
  \ =**\n`70 60 10 50 20`\n**After Sorting**\n`10 20 50 60 70`\n\n## 二维数组的实现\n\n二维数组实际上是数组的数组。假设我们想存储两个不同城市的票价信息，我们需要使用带有两个索引的二维数组来控制行和列。下表给出了三个不同城市的票价：\n\
  \n![](img/p165.jpg)\n\n如果我们想存储这些信息并通过我们的 Java 程序进行处理，那么我们需要创建一个二维数组。二维数组的声明和创建语法如下：\n\
  \n![](img/p165a.jpg)\n\n例如，如果我们想为上述票价创建一个二维数组，则使用以下语句：\n\n```java\nint fare[][];\n\
  fare= new int[5][5];\n```\n\n\n\n\n\n`fare [1][1]= 8000;`\n`fare [1][2]= 5000;`\n\
  `fare [2][0]= 6000;`\n`fare [2][1]= 7000;`\n`fare [2][2]= 4000;`\n\n或者，上述语句可以合并为一个语句，如下：\n\
  \n```java\nint fare[][] = {\n  { 5000,6000,3000},\n  { 7000,8000,5000},\n  { 6000,7000,4000},\n\
  };\n```\n\n由于数字存储在连续的内存位置，其内存表示如下。由于使用了两个索引，其中一个控制行，另一个用于控制列：\n\n`fare[row][column\
  \ ];`\n\n```text\n[0][0] [0][1] [0][2]\n[1][0] [1][1] [1][2]\n[2][0] [2][1] [2][2]\n\
  ```\n\n下面的 Java 程序演示了二维数组的使用。接下来的 Java 程序计算两个矩阵的相加。二维数组用于存储这三个矩阵：\n\n```java\npackage\
  \ book;\npublic class Matrix_Addition {\n  public static void main(String[] args)\
  \ {\n    int a[][]= { {22,55,50,4,51},\n      {10,2,8,4,9},\n      {11,2,6,7,2},\n\
  \      {1,20,13,4,15},\n    };\n    int b[][]= { {2,5,0,4,1},\n      {10,12,18,14,19},\n\
  \      {10,7,6,70,20},\n      {11,10,13,40,10},\n    };\n    int c[][]=new int[5][5];\n\
  \    for(int i=0;i<4;i++)\n    {\n      for (int j=0;j<5;j++)\n      {\n       \
  \ c[i][j]=a[i][j] + b[i][j];\n      }\n    }\n    System.out.println(\"The addition\
  \ of Matrices\");\n    for(int i=0;i<4;i++)\n    {\n      for (int j=0;j<5;j++)\n\
  \      {\n        System.out.print(c[i][j] + \" \");\n      }\n      System.out.println();\n\
  \    }\n  }\n}\n```\n\n我们将得到以下输出：\n\n`The addition of Matrices`\n`24 60 50 8 52`\n\
  `20 14 26 18 28`\n`21 9 12 77 22`\n`12 30 26 44 25`\n\n下面的程序帮助你利用二维数组创建一个创建一个乘法表：\n\
