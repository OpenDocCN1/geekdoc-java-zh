  \ C K =2`\n`From Thread C K =3`\n`From Thread C K =4`\n`From Thread B j =2`\n`From\
  \ Thread B j =3`\n`From Thread B j =4`\n\n### 线程同步\n\n到目前为止，我们将代码放在每个线程的 `run` 方法中。如果线程在\
  \ `run` 方法之外访问公共资源呢？例如同一个文件正在被一个线程读取，而另一个线程在同一个文件上写入。这会导致严重的问题。Java 通过将部分代码创建为同步（synchronized）提供了此类常见资源的解决方案：\n\
  \n```java\nsynchronized void commonupdate {\n    ..// 需要同步的代码\n    ..\n}\n```\n\n\
  接下来的 Java 程序解释了 `synchronized`块的使用。在该程序中，两个线程尝试访问同一个代码块。该块保持为同步状态：\n\n```java\n\
  package threadingdemo;\nclass counter {\n    int count;\n    public synchronized\
  \ void increment() {\n        count++;\n    }\n}\npublic class mc {\n    public\
  \ static void main(String[] args)throws Exception {\n        counter obj = new counter();\n\
  \        Thread ta = new Thread( new Runnable() {\n            @Override\n     \
  \       public void run() {\n                for(int i=0;i<1000;i++)\n         \
  \           obj.increment();\n            }\n        });\n        Thread tb = new\
  \ Thread(new Runnable() {\n            @Override\n            public void run()\
  \ {\n                for(int j=0;j<1000;j++)\n                    obj.increment();\n\
  \            }\n        });\n        ta.start();\n        tb.start();\n        ta.join();\n\
  \        tb.join();\n        System.out.println(\"Count =\" + obj.count);\n    \
  \    System.out.println(\"End of Program\");\n    }\n}\n```\n\n我们将得到以下输出：\n\n`Count\
  \ =2000`\n`End of Program`\n\n在下方的 Java 程序中，产生了三个消息字符串的混合输出。因为没有任何机制阻止这三个线程在同一时间调用同一个对象上的同一个方法。这被称为竞态条件（race\
  \ condition），因为三个线程正在相互竞争以完成该方法。使用 `synchronized` 关键字重复相同的程序后，会产生正确的输出：\n\n```java\n\
  package book;\nclass Action_Class {\n    void call(String content) {\n        System.out.print(\"\
  start \" + content);\n        try {\n            Thread.sleep(1000);\n        }\
  \ catch(InterruptedException e) {\n            System.out.println(\"Exception\"\
  );\n        }\n        System.out.println(\" end\");\n    }\n}\nclass Trigger implements\
  \ Runnable {\n    String content;\n    Action_Class target;\n    Thread t;\n   \
  \ public Trigger(Action_Class targ, String s) {\n        target = targ;\n      \
  \  content = s;\n        t = new Thread(this);\n        t.start();\n    }\n    public\
  \ void run() {\n        target.call(content);\n    }\n}\nclass SyncDemo {\n    public\
  \ static void main(String[] args) {\n        Action_Class target = new Action_Class();\n\
  \        new Trigger(target, \"1\");\n        new Trigger(target, \"2\");\n    \
  \    new Trigger(target, \"3\");\n    }\n}\n```\n*(注：由于原文后半部分存在截断或复杂的逻辑重复，此处根据上下文翻译并整理了同步部分的逻辑说明)*\n\
  \n### 线程间通信\n\n我们可以通过线程间通信以更细粒度的控制来实现线程同步。为了避免轮询，Java 通过 `wait()`、`notify()` 和 `notifyAll()`\
  \ 方法提供了良好的线程通信机制。这些方法是在 `Object` 类中实现的，因此所有类都拥有它们。这些方法只能在同步上下文中调用：\n\n* `wait()`\
  \ 告诉调用线程释放监锁并进入睡眠，直到另一个线程进入监锁并调用 `notify()`。\n* `notify()` 唤醒调用过 `wait()` 的线程。\n\
  * `notifyAll()` 唤醒所有调用过 `wait()` 的线程。\n\n这些方法在 `Object` 类中声明如下：\n\n```java\nfinal\
  \ void wait() throws InterruptedException\nfinal void notify()\nfinal void notifyAll()\n\
  ```\n\n在下面的 Java 程序中，虽然使用了同步块，但我们仍然无法获得预期的输出，因为问题 0 应该得到答案 0，以此类推。在下一个程序中，我们实现了线程间通信来解决这个问题：\n\
  \n```java\npackage book;\nclass Ques {\n    int n;\n    synchronized int get() {\n\
  \        System.out.println(\"Answer \" + n);\n        return n;\n    }\n    synchronized\
  \ void put(int n) {\n        this.n = n;\n        System.out.println(\"Question\
  \ \" + n);\n    }\n}\nclass Teacher implements Runnable {\n    Ques Ques;\n    Teacher(Ques\
  \ Ques) {\n        this.Ques = Ques;\n        new Thread(this, \"Teacher\").start();\n\
  \    }\n    public void run() {\n        int i = 0;\n        while(i<5) {\n    \
  \        Ques.put(i++);\n        }\n    }\n}\nclass Student implements Runnable\
  \ {\n    Ques Ques;\n    Student(Ques Ques) {\n        this.Ques = Ques;\n     \
  \   new Thread(this, \"Student\").start();\n    }\n    public void run() {\n   \
  \     int j=0;\n        while(j<5) {\n            Ques.get();\n            j++;\n\
  \        }\n    }\n}\npublic class ThreadCommunication {\n    public static void\
  \ main(String[] args) {\n        Ques q = new Ques();\n        new Teacher(q);\n\
  \        new Student(q);\n    }\n}\n```\n\n\n\n\n```java\npublic static void main(String\
  \ args[]) {\n    Ques Ques = new Ques();\n    new Teacher(Ques);\n    new Student(Ques);\n\
  }\n}\n```\n\n我们将得到以下输出：\n\n`Question 0`\n`Question 1`\n`Question 2`\n`Question 3`\n\
  `Question 4`\n`Answer 4`\n`Answer 4`\n`Answer 4`\n`Answer 4`\n`Answer 4`\n\n相同的程序通过进程间通信实现。使用\
  \ `wait()`、`notify()` 和 `notifyAll()` 方法来获取进程间通信并实现正确的的结果：\n\n```java\npackage book;\n\
  class Ques1 {\n    int n;\n    boolean valueSet = false;\n    synchronized int get()\
  \ {\n        while(!valueSet)\n            try {\n                wait();\n    \
  \        } catch(InterruptedException e) {\n                System.out.println(\"\
  InterruptedException caught\");\n            }\n            System.out.println(\"\
  Answer \" + n);\n            valueSet = false;\n            notify();\n        \
  \    return n;\n    }\n    synchronized void put(int n) {\n        while(valueSet)\n\
  \            try {\n                wait();\n            } catch(InterruptedException\
  \ e) {\n                System.out.println(\"InterruptedException caught\");\n \
  \           }\n            this.n = n;\n            valueSet = true;\n         \
  \   System.out.println(\"Question\" + n);\n            notify();\n    }\n}\nclass\
  \ Teacher1 implements Runnable {\n    Ques1 Ques1;\n    Teacher1(Ques1 Ques1) {\n\
  \        this.Ques1 = Ques1;\n        new Thread(this, \"Teacher1\").start();\n\
  \    }\n    public void run() {\n        int i = 0;\n        while(i<5) {\n    \
  \        Ques1.put(i++);\n        }\n    }\n}\nclass Student1 implements Runnable\
  \ {\n    Ques1 Ques1;\n    Student1(Ques1 Ques1) {\n        this.Ques1 = Ques1;\n\
  \        new Thread(this, \"Student1\").start();\n    }\n    public void run() {\n\
  \        int j = 0;\n        while(j<5) {\n            Ques1.get();\n        }\n\
  \    }\n}\npublic class InterProcessComm {\n    public static void main(String args[])\
  \ {\n        Ques1 Ques1 = new Ques1();\n        new Teacher1(Ques1);\n        new\
  \ Student1(Ques1);\n    }\n}\n```\n\n我们将得到输出：\n\n`Question0`\n`Answer 0`\n`Question1`\n\
  `Answer 1`\n`Question2`\n`Answer 2`\n`Question3`\n`Answer 3`\n`Question4`\n`Answer\
  \ 4`\n\n# 作业\n\n1. 多线程的优势是什么？它是如何提高 Java 程序效率的？\n2. 解释线程的完整生命周期？\n3. 在 Java 中实现多线程的不同方式有哪些？请结合相关示例进行说明？\n\
  4. `Thread` 类中定义了哪些方法可以挂起和停止线程？\n5. 编写一个 Java 程序，解释多线程中同步的作用？\n\n# 第 8 章：Java 中的\
  \ Applets\n\n## 引言\n\nJava 主要将 applets 用于网络计算。Applets 是较小的 Java 程序，可以通过 `appletviewer`\
  \ 或任何支持 applets 的浏览器执行。如果我们想通过 html 页面获取输入、执行某些算术操作、播放声音、显示图形、创建动画以及玩任何交互游戏，可以利用\
  \ applets 实现广泛的应用。\n\n## 结构\n\n* 引言\n* applets 的特性\n* 理解 `Applet` 类\n* Applet 生命周期周期\n\
  * 理解 `applet` 标签\n* 创建带有 applet 的 页面\n* 向 applets 传递参数\n* 处理 applet 事件\n* 作业\n\n\
  ## 目标\n\n本章详细介绍了 Applets。在读完本章后，我们应该能够创建 applets 并处理 applet 事件。\n\n## applets 的特性\n\
  \n为了理解基本 applet 的工作原理，让我们用以下代码创建一个 applet：\n\n```java\nimport java.applet.*;\nimport\
  \ java.awt.*;\npublic class MyApplet extends Applet {\n    public void paint(Graphics\
  \ g) {\n        g.drawString(\" Welcome to Applets\", 20, 20);\n    }\n}\n```\n\n\
  上面的程序创建了一个简单的 applet，显示 `Welcome to Applets`。在使用 applets 时需要注意以下几点：\n\n1. Applets\
  \ 没有 `main` 方法。Applets 有一个生命周期（将要讨论），执行从 `init()` 方法开始。\n2. 为了创建一个 applet，我们必须导入\
  \ `java.applet` 包，因为它包含了 `Applet` 类。`Applet` 类为 applet 的实现提供了所有支持，例如启动和停止 applet。它还提供了加载和显示图像的方法，以及加载和播放音频片段的方法。\n\
  3. applet 类必须保持为 `public`，因为它可以从类外部访问。在上面的例子中，我们创建了具有 `public` 可见性的 `MyApplet` 类以及具有\
  \ `public` 访问修符的 `paint` 方法。\n4. 要运行 applet，可以使用 `applet` 标签，如下：\n```html\n/* <applet\
  \ code=MyApplet Height=200 Width=200> */\n```\n5. 此标签必须包含在多行注释中。执行 applet 时可以使用\
  \ `appletviewer`：\n```bash\nappletviewer MyApplet\n```\n6. 要从 HTML 文件中执行 applet，可以使用以下标签：\n\
  ```html\n<html>\n<body>\n    <applet code=MyApplet Height=200 Width=200>\n</body>\n\
  </html>\n```\n7. `paint` 方法可以显示字符串。`Graphics` 对象用于各种方法。`Applet` 类从 `java.applet`\
  \ 包定义了如下表所示的方法：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `void destroy()` | 在 applet 终止之前调用。如果\
  \ applet 需要在销毁前进行清理，将覆盖此方法。 |\n| `AccessibleContext AccessibleContext()` | 返回对象的访问上下文。\
  \ |\n| `AppletContext getAppletContext()` | 返回与 applet 关联的上下文。 |\n| `String getAppletInfo()`\
  \ | 返回描述 applet 的字符串。 |\n| `AudioClip getAudioClip(URL url)` | 返回位于 `url` 位置的音频片段\
  \ `AudioClip` 对象。 |\n| `AudioClip getAudioClip(URL url, String clipName)` | 返回位于\
  \ `url` 且名为 `clipName` 的音频片段 `AudioClip` 对象。 |\n| `URL getCodeBase()` | 返回与调用 applet\
  \ 关联的 URL。 |\n| `URL getDocumentBase()` | 返回调用 applet 的 HTML 文档 URL。 |\n| `Image\
  \ getImage(URL url)` | 返回位于 `url` 位置的图像 `Image` 对象。 |\n| `Image getImage(URL url)`\
  \ | 返回位于 `url` 位置的图像 `Image` 对象。 |\n| `Image getImage(URL url, String imageName)`\
  \ | 返回位于 `url` 且名为 `imageName` 的图像 `Image` 对象。 |\n| `Locale getLocale()` | 返回由各种区域敏感类和方法使用的\
  \ `Locale` 对象。 |\n| `String getParameter(String paramName)` | 返回与 `paramName` 关联的参数。如果没有找到指定的参数，则返回\
  \ `null`。 |\n| `String[][] getParameterInfo()` | 返回描述 applet 识别的参数的 `String` 表。表中的每个条目由三个字符串组成：参数名称、类型或范围的描述以及用途的解释。\
  \ |\n| `void init()` | 在 applet 开始执行时调用。它是任何 applet 被调用的第一个方法。 |\n\n\n\n\n\n| `boolean\
  \ isActive( )` | 如果 applet 已启动，返回 true。如果 applet 已停止，则返回 false。 |\n| `static final\
  \ AudioClip new AudioClip(URL url)` | 返回一个 `AudioClip` 对象，它封装了在 `url` 指定位置的音频片段。此方法与\
  \ `getAudioClip( )` 类似，不同之处它是静态的，不需要 `Applet` 对象即可执行。 |\n| `newAudioClip (URL url)`\
  \ | 在 `url` 指定的位置找到的音频片段。此方法与 `getAudioClip( )` 类似，不同之处它是静态的，不需要 `Applet` 对象即可执行。\
  \ |\n| `void play(URL url)` | 如果在 `url` 指定的位置找到了音频片段，则播放该片段。 |\n| `void play(URL\
  \ url, String clipName)` | 如果在 `url` 指定的位置找到了名为 `clipName` 的音频片段，则播放该片段。 |\n| `void\
  \ resize(Dimension dim)` | 根据 `dim` 指定的调整 applet 的大小。`Dimension` 是存储在 `java.awt`\
  \ 内部的一个类。它包含两个整数字段：宽度（width）和高度（height）。 |\n| `void resize(int width, height)` |\
  \ 根据 `width` 和 `height` 指定的调整 applet 的大小。 |\n| `final void setStub(AppletStub stubObj)`\
  \ | 将 `stubObj` 设置为 applet 的存根（stub）。此方法由运行时使用，通常不由你的 applet 调用。存根是一段很小的代码，提供你的\
  \ `applet` 与浏览器之间的连接。 |\n| `void showStatus(String str)` | 在浏览器或 applet 查看器的状态窗口中显示\
  \ `str`。如果浏览器不支持状态窗口，则不执行任何操作。 |\n| `void start( )` | 浏览器在 applet 应该开始（或恢复）执行时调用它。当\
  \ applet 首次启动时，它会在 `init( )` 之后被自动调用。 |\n| `void stop( )` | 浏览器调用它来暂停 applet 的执行。一旦停止，applet\
  \ 在调用 `start( )` 时重启。 |\n\n**表 8.1:** `Applet` 类定义的方法\n\n### 创建 Applet\n\n每个创建的\
  \ applet 都是 `Applet` 类的子类。applet 不是独立程序。相反，它们在网络浏览器或 applet 查看器中运行。applet 的执行并不是从\
  \ `main( )` 开始的。事实上，很少有 applet 拥有 `main( )` 方法。作为替代，applet 的实现是通过完全不同的方法启动和控制的，这将在本章中解释。\n\
  \n这个简单的 applet 是使用记事本创建的。`init()` 方法用于初始化，`paint()` 方法用于显示简单的消息。使用 applet 查看器执行程序：\n\
  \n```java\n/*<applet code=\"MyFirstApplet\" width=\"200\" height=\"400\">\n</applet>\n\
  */\nimport java.applet.Applet;\nimport java.awt.*;\npublic class MyFirstApplet extends\
  \ Applet\n{\n    public void init()\n    {\n    }\n    public void paint(Graphics\
  \ g)\n    {\n        g.drawString(\"Welcome to Applets\", 100, 200);\n    }\n}\n\
  ```\n\n运行 applet 需要在 HTML 文件中指定。实现这一点的方法之一是使用 `applet 标签`。当启用 Java 的网络浏览器在 HTML\
  \ 文件中遇到 applet 标签时，将执行该 applet。为了更方便地查看和测试 applet，只需在你的 Java 源代码文件头部包含一个带有 applet\
  \ 标签的注释。这样，我们的代码就包含了 applet 所需的必要 HTML 语句，你可以通过指定我们的 Java 源代码文件为目标启动 applet 查看器来测试编译后的\
  \ applet。以下是此类注释的示例：\n\n```java\n/*\n<applet code=\"MyFirstApplet\" width=\"200\"\
  \ height=\"400\">\n</applet>\n*/\n```\n\n此注释包含一个 applet 标签，将在一个宽度为 200 像素、高度为 200\
  \ 像素的窗口中运行名为 `MyFirstApplet` 的 applet。插入 applet 命令使得测试 applet 变得更容易。使用 applet 查看器生成如下输出：\n\
  \n![](img/8-1.jpg)\n\n**图 8.1:** 使用 `AppletViewer` 运行的 Applet\n\n一个设置了前景和背景颜色并输出字符串的简单\
  \ Java applet：\n\n```java\nimport java.awt.*;\nimport java.applet.*;\n/*\n<applet\
  \ code=\"AppletExample2\" width=500 height=100>\n</applet>\n*/\npublic class AppletExample2\
  \ extends Applet{\n    String msg;\n    // 设置前景和背景颜色。\n    public void init() {\n\
  \        setBackground(Color.cyan);\n        setForeground(Color.red);\n       \
  \ msg = \"init( ) Method Invoked\";\n    }\n    // 初始化要显示的字符串。\n    public void\
  \ start() {\n        msg += \" start( ) Method Invoked\";\n    }\n    // 在 applet\
  \ 窗口中显示 msg。\n    public void paint(Graphics g) {\n        msg += \" paint( ) Method\
  \ Invoked\";\n        g.drawString(msg, 50, 30);\n    }\n}\n```\n\n\n\n\n\n`paint()`\
  \ 方法在每次 applet 的输出需要重绘时被调用。\n\n`stop()` 方法在 浏览器离开包含该 applet 的 HTML 页面时立即被调用。\n\n\
  `destroy()` 方法在设置认为 applet 需要完全从内存中分离时立即被调用。`stop()` 方法始终在 `destroy()` 之前被调用：\n\n\
  ![](img/8-5.jpg)\n\n**图 8.5：** Applet 的生命周期\n\n在接下来的 Java 程序中，创建了一个 applet 来演示其生命周期。显示了各种方法执行的顺序：\n\
  \n```java\npackage book;\nimport java.applet.Applet;\nimport java.awt.Graphics;\n\
  import java.awt.Label;\npublic class Applet_Life_Cycle extends Applet {\n    String\
  \ msg=\"\";\n    @Override\n    public void destroy() {\n        super.destroy();\n\
  \        msg=msg+\" Applet Destroyed \";\n    }\n    @Override\n    public void\
  \ init() {\n        Label l = new Label(\"Life Cycle of Applet\");\n        add(l);\n\
  \        super.init();\n        msg=msg+\" Applet Initialized \";\n    }\n    @Override\n\
  \    public void start() {\n        super.start();\n        msg=msg+\" Applet Started\
  \ \";\n    }\n    @Override\n    public void stop() {\n        super.stop();\n \
  \       msg=msg+\" Applet Stopped \";\n    }\n    public void paint(Graphics g)\n\
  \    {\n        msg=msg+\" Paint Method \";\n        g.drawString(msg, 100, 100);\n\
  \    }\n}\n```\n\n我们将得到以下输出：\n\n![](img/8-6.jpg)\n\n**图 8.6：** Applet 生命周期\n\n###\
  \ 了解 applet 标签\n\n到目前为止，我们只使用了 applet 的强制性属性，即 `code`、`width` 和 `height`。applet\
  \ 标签还拥有其他可选属性，可以利用这些属性来增强功能。如前所述，applet 标签可以在带有多行注释的 Java 程序中使用，并可以由 applet viewer\
  \ 执行。我们还可以在 HTML 内部内部使用多个 applet 标签。在这两种情况下，applet 标签都可以使用完整的功能。带有强制属性和可选属性的 applet\
  \ 标签如下：\n\n```html\n< APPLET\n[CODEBASE = code_baseURL]\nCODE = applet_File\n[ALT\
  \ = alternate_Text]\n[NAME = applet_Instance_Name]\nWIDTH = Inpixels HEIGHT = Inpixels\n\
  [ALIGN = alignment]\n[VSPACE = Inpixels]\n[HSPACE = Inpixels]\n[< PARAM NAME = Attribute_Name\
  \ VALUE = Attribute_Value>]\n[< PARAM NAME = Attribute_Name2 VALUE = Attribute_Value>]\
  \ …\n[HTML Displayed in the absence of Java]\n</APPLET>\n```\n\napplet 标签的每个部分解释如下：\n\
  \n| `[CODEBASE = code_baseURL]` | 指定 applet 代码的基 URL。此属性是可选的。如果没有指定此属性，则使用 HTML\
  \ 页面的 `URL` 目录作为 `CODEBASE`。 |\n| `CODE = applet_File` | 强制性属性，指定包含我们的 applet 编译后的\
  \ `.class` 文件的文件名。该文件相对于 applet 的代码基 URL。 |\n| `[ALT = alternate_Text]` | `ALT`\
  \ 标签是一个可选属性，用于指示一条短文本消息，如果浏览器识别 `APPLET` 标签但当前无法运行 Java applet，则显示该消息。 |\n| `[NAME\
  \ = applet_Instance_Name]` | 可选属性，用于指定 applet 实例名称。applet 应该进行命名，以便同一页面上的新 applet\
  \ 能够通过名称找到它们并与其通信。要通过名称获取 applet，请使用 `getApplet()` 方法。 |\n| `WIDTH = Inpixels HEIGHT\
  \ = Inpixels` | 强制性属性，给出 applet 显示区域的大小（以像素为单位）。 |\n| `[ALIGN = alignment]` | 可选属性，指定\
  \ applet 的对齐方式。此属性的处理方式与 HTML img 标签类似，其可能的取值为：`LEFT, RIGHT, TOP, BOTTOM, MIDDLE,\
  \ BASELINE, TEXTTOP, ABSMIDDLE,` 和 `ABSBOTTOM`。 |\n| `[VSPACE = Inpixels]` | 此属性是可选的。`VSPACE`\
  \ 指定 applet 上方的空间（以像素为单位）。 |\n| `[HSPACE = Inpixels]` | 此属性是可选的。`HSPACE` 指定 applet\
  \ 左右两侧的空间（以像素为单位）。 |\n| `[< PARAM NAME = Attribute_Name VALUE = Attribute_Value>]`\
  \ | `PARAM` 标签允许我们在 HTML 页面中指定 applet 特定的参数。Applets 通过 `getParameter()` 方法访问其属性。\
  \ |\n| `[< PARAM NAME = Attribute_Name2 VALUE = Attribute_Value>] …` | 我们可以有多个参数，并允许我们在\
  \ HTML 页面中指定 applet 特定的参数。 |\n\n**表 8.2：** 带有强制属性和可选属性的 applet 标签\n\n### 向 Applets\
  \ 传递参数\n\n如前所述，`applet` 标签可以将参数传递给 Java 文件。我们可以使用 `param` 标签传递多个参数，并指定名称和值，这些值可以在\
  \ Java 文件中进一步处理。`param` 标签具有以下形式：\n\n```html\n`< PARAM NAME = Attribute_Name1 VALUE\
  \ = Attribute_Value1>\n`< PARAM NAME = Attribute_Name2 VALUE = Attribute_Value2>\n\
  ```\n\n例如，如果我们想向 applet 传递 `sname` 和 `marks`，在 `applet` 标签中使用：\n\n```html\n<applet\
  \ code=\"ParameterPassing\" width=300 height=80>\n<param name=CourseName value=Java>\n\
  <param name=marks value=300>\n</applet>\n```\n\n现在，为了在 Java 程序中获取值，使用如下代码：\n\n```java\n\
  import java.applet.*;\nimport java.awt.*;\npublic class ParameterPassing extends\
  \ Applet{\n    String CourseName=\"nnn\";\n    int marks_1;\n    String Result;\n\
  \    boolean active;\n    public void start()\n    {\n        super.start();\n \
  \       String param;\n        CourseName = getParameter(\"CourseName\");\n    \
  \    if(CourseName == null)\n        CourseName = \"Not Found\";\n        param\
  \ = getParameter(\"marks\");\n        try {\n        if(param != null) // 如果找到\n\
  \        marks_1 = Integer.parseInt(param);\n        else\n        marks_1 = 0;\n\
  \        } catch(NumberFormatException e)\n        {\n        marks_1 = -1;\n  \
  \      }\n        Result = getParameter(\"Result\");\n        param = getParameter(\"\
  next_class\");\n        if(param != null)\n        active = Boolean.valueOf(param).booleanValue();\n\
  \    }\n    public void init()\n    {\n    }\n    // 显示参数。\n    public void paint(Graphics\
  \ g)\n    {\n        g.drawString(\"Course Name: \" + CourseName, 0, 10);\n    \
  \    g.drawString(\"Marks : \" + marks_1, 0, 26);\n        g.drawString(\"Result:\
  \ \" + Result, 0, 42);\n        g.drawString(\"Next Class: \" + active, 0, 58);\n\
  \    }\n}\n```\n\n因此，我们能够通过 `applet` 标签从 HTML 文件获取参数。\n\n### 创建带有 Applet 的网页\n\n\
