  \ File`\n`Hello, Its working in Files`\n`Reading the Second File with alternate\
  \ characters`\n`Hlo t okn nFls`\n\n## 习题\n\n1. 区分 `ByteStream`（字节流）和 `CharacterStream`（字符流）？\n\
  2. 编写一个 Java 程序，接受用户输入的 N 个字符串并按排序显示名称？\n3. 读取一个文件的内容，并将偶数写入第二个文件，将奇数写入第三个文件？\n\
  4. 解释 Java 中读写文件时使用的各种方法？\n5. 区分 `InputStream`（输入流）和 `Reader`（读取器）类？\n\n# 第 10 章\n\
  \n## Java 事件处理\n\n## 引言\n\nJava 开发的重要领域之一是事件处理。在图形用户界面（GUI）程序中，用户必须在文本框中输入内容并点击不同类型的按钮，如提交、取消、OK\
  \ 等。在这些情况下，程序员理解事件处理是至关重要的。在本章中，将探索有助于实现事件处理的包，如 `java.awt`、`java.awt.event` 和 `java.util`。由于前面的章节讨论了\
  \ applet 是我们在互联网上运行的 GUI 程序，因此将探索 applet 中的事件处理。\n\n当用户响应基于图形用户界面的程序时，会产生大量的我们程序将采取行动的事件。事件以事件对象的形式传递，通过多种方式指定已发生事件的细节，具体方法取决于实际发生的事件。本章将讨论由鼠标、键盘和各种\
  \ GUI 控制生成的各种类型的事件。\n\n在本章中，我们将详细讨论委托事件模型（delegation event model），并尝试从零开始了解事件是如何工作的，以及参与事件处理的不同类和接口。\n\
  \n## 结构\n\n- 引言\n- 委托事件模型\n- 事件源\n- 事件监听器\n- 事件类\n- 使用适配器类（adapter classes）\n- 匿名内部类\n\
  - 习题\n\n## 目标\n\n本章提供了对事件处理的详细理解，旨在处理基于 GUI 的 Java 程序中的所有事件。\n\n## 委托事件模型\n\n处理事件最先进的方法是委托事件模型。我们需要首先的是事件。简单来说，事件是状态的改变。事件以事件对象的形式传递，通过多种方式指定已发生事件的细节，具体方法取决于实际发生的事件。本章将讨论由鼠标、键盘和各种\
  \ GUI 控制生成的各种类型的事件。\n\n委托事件模型展示了事件源如何与监听器交互。委托事件模型的详细图如下所示：\n\n![Figure 10.1: Delegation\
  \ model](img/10-1)\n\n在委托事件模型中，事件源是事件的起源。事件的产生是用户访问图形用户界面元素的结果。产生事件的原因包括点击按钮、使用键盘输入字符、在列表中选择以及点击鼠标的左键、右键或中间键。\n\
  \n事件源是产生事件的对象。这发生在对象的内部状态发生微变化时。事件源可能会产生多种类型的事件。\n\n事件处理中最关键的步骤是注册。事件源必须注册自身。注册的通用格式为：\n\
  \n`public void addTypeListener(TypeListener evli)`\n\n在这个通用格式中，type 是事件名称，`evli`\
  \ 是事件监听器的引用。例如，注册鼠标监听器的方法是 `addMouseListener()`。注册动作监听器的方法是 `addActionListener()`。当事件触发时，所有注册的监听器都会收到并收集事件对象的副本。例如，如果我们想处理\
  \ `Button` 对象和 `TextField` 对象的鼠标事件，那么这两个对象都需要如下注册 `MouseListener`：\n\n```java\n\
  Button b1 = new Button ( \"OK\");\nTextField tf = new TextField( );\nb1.addMouseListener(\
  \ this);\ntf.addMouseListener(this);\n```\n\n委托事件模型的所有组件将在后续章节中逐一解释。\n\n## 事件源\n\
  \n在委托事件模型中，事件源必须向 `Listener` 注册自身。图形用户界面中的某些事件源列如下表所示：\n\n| 事件源 | 描述 |\n| :--- |\
  \ :--- |\n| `Button` | 当按钮按下时产生动作事件。 |\n| `Check box` | 当复选框被选中或取消选中时产生项目事件。 |\n\
  | `Choice` | 当选择改变时产生项目事件。 |\n| `List` | 当项目被双击时产生动作事件；当项目被选中或取消选中时产生项目事件。 |\n\n\
  \n\n\n\n| `Menu Item` | 当选中菜单项时生成动作事件；当可勾选菜单项被选中或取消勾选时，生成项目事件。 |\n| `Scroll bar`\
  \ | 当操作滚动条时生成调整事件。 |\n| `Text components` | 当用户输入字符时生成文本事件。 |\n| `Window` | 当窗口被激活、关闭、去激活、取消最小化、最小化、打开或退出时，生成窗口事件。\
  \ |\n\n**表 10.1：** 事件源\n\n### 事件监听器\n\n监听器（Listener）是一个在事件发生时会被告通知的对象。事件监听器的两个最基本的必要条件是：首先，它必须已在一个或多个源注册，以便接收有关特定类型事件的通知；其次，它应该实现方法来接收并处理这些通知。\n\
  \n例如，如果一个 `Button` 对象向 `MouseListener` 接口注册，它必须实现其所有接收和处理事件的方法。这些方法定义在 `java.awt.event`\
  \ 中的一组接口中。例如，`MouseListener` 接口定义了五个方法，用于在鼠标被点击时接收通知：\n\n```\nvoid mouseClicked(MouseEvent\
  \ me)\n{\n    // 鼠标被点击时要执行的操作\n}\n\nvoid mouseEntered(MouseEvent me)\n{\n    //\
  \ 鼠标进入控件时要执行的操作\n}\n\nvoid mouseExited(MouseEvent me)\n{\n    // 鼠标离开控件时要执行的操作\n\
  }\n\nvoid mousePressed(MouseEvent me)\n{\n    // 鼠标按钮按下时要执行的操作\n}\n\nvoid mouseReleased(MouseEvent\
  \ me)\n{\n    // 鼠标按钮松开时要执行的操作\n}\n```\n\n下表列出了可用的接口以及事件监听器需要实现的方法：\n\n| 接口 | 方法\
  \ | 描述 |\n| :--- | :--- | :--- |\n| `ActionListener` | | 定义了一个接收动作事件的方法。 |\n| `AdjustmentListener`\
  \ | `void adjustmentValueChanged(AdjustmentEvent ae)` | 定义了一个接收调整事件的方法。 |\n| `ComponentListener`\
  \ | `void componentResized(ComponentEvent ce)` `void componentMoved(ComponentEvent\
  \ ce)` `void componentShown(ComponentEvent ce)` `void componentHidden(ComponentEvent\
  \ ce)` | 定义了四个方法，用于识别组件何时隐藏、移动、调整大小或显示。 |\n| `ContainerListener` | `void componentAdded(ContainerEvent\
  \ ce)` `void componentRemoved(ContainerEvent ce)` | 定义了两个方法，识别组件何时被或从容器中移除。 |\n\
  | `FocusListener` | `void focusGained(FocusEvent fe)` `void focusLost(FocusEvent\
  \ fe)` | 定义了两个方法，识别组件何时获得或丢失键盘焦点。 |\n| `ItemListener` | `void itemStateChanged(ItemEvent\
  \ ie)` | 定义了一个方法，识别项目状态何时改变。 |\n| `KeyListener` | `void keyPressed(KeyEvent ke)`\
  \ `void keyReleased(KeyEvent ke)` `void keyTyped(KeyEvent ke)` | 定义了三个方法，识别按键何时被按下、松开或输入。\
  \ |\n| `MouseListener` | `void mouseClicked(MouseEvent me)` `void mouseEntered(MouseEvent\
  \ me)` `void mouseExited(MouseEvent me)` `void mousePressed(MouseEvent me)` `void\
  \ mouseReleased(MouseEvent me)` | 定义了五个方法，识别鼠标何时被点击、进入组件、离开组件、按下或松开。 |\n| `MouseMotionListener`\
  \ | `void mouseDragged(MouseEvent me)` `void mouseMoved(MouseEvent me)` | 定义了两个方法，识别鼠标何时被拖动或移动。\
  \ |\n| `MouseWheelListener` | `void mouseWheelMoved(MouseWheelEvent mwe)` | 定义了一个方法，识别滚轮何时移动。\
  \ |\n| `TextListener` | `void textChanged(TextEvent te)` | 定义了一个方法，识别文本值何时改变。 |\n\
  | `WindowFocusListener` | `void windowGainedFocus(WindowEvent we)` `void windowLostFocus(WindowEvent\
  \ we)` | 定义了两个方法，识别窗口何时获得或丢失输入焦点。 |\n| `WindowListener` | `void windowActivated(WindowEvent\
  \ we)` `void windowClosed(WindowEvent we)` `void windowClosing(WindowEvent we)`\
  \ `void windowDeactivated(WindowEvent we)` `void windowDeiconified(WindowEvent we)`\
  \ `void windowIconified(WindowEvent we)` `void windowOpened(WindowEvent we)` | 定义了七个方法，识别窗口何时被激活、关闭、去激活、取消最小化、最小化、打开或退出。\
  \ |\n\n**表 10.2：**get 抽象方法的事件监听器\n\n### 事件类\n\n一旦对象注册监听器，它就会向监听器内部的方法发送通知。在通知方法的同时，一个事件对象会被发送到监听器，该对象封装了已发生事件的细节。因此，事件对象是\
  \ Java 事件处理的核心。例如，如果我们如下所示将 `TextField` 对象注册到 `KeyListener` 接口上：\n\n```\nTextField\
  \ tf = new TextField( );\ntf.addKeyListener (this);\n```\n\n`KeyListener` 接口有三个方法，由事件监听器实现。所有三个方法都必须如下所示实现：\n\
  \n```\nvoid keyPressed(KeyEvent ke)\n{\n}\n\nvoid keyReleased(KeyEvent ke)\n{\n\
  }\n\nvoid keyTyped(KeyEvent ke)\n{\n}\n```\n\n一旦我们按下任何键，我们都想知道输入的是哪个键，例如，我们这样使用\
  \ `KeyEvent` 类：\n\n```\nchar ch = ke.getKeyChar();\n```\n\n各种事件类列如如下所示：\n\n| 事件类\
  \ | 描述 |\n| :--- | :--- |\n| `ActionEvent` | 当按钮被按下、列表项被点击或菜单项被选中时生成。 |\n| `AdjustmentEvent`\
  \ | 当滚动条被操作时生成。 |\n| `ComponentEvent` | 当组件隐藏、移动、调整大小或显示时生成。 |\n| `ContainerEvent`\
  \ | 当组件被添加到或从容器中移除时生成。 |\n| `FocusEvent` | 当组件获得或丢失键盘焦点时生成。 |\n| `InputEvent` |\
  \ 输入事件的抽象父类。 |\n| `ItemEvent` | 当复选框或列表项被点击；也当选择产生或可勾选菜单项被选中/取消勾选时生成。 |\n| `KeyEvent`\
  \ | 从键盘接收输入时生成。 |\n| `MouseEvent` | 当鼠标被拖动、移动、点击、按下或松开时生成；也当鼠标进入或离开组件时生成。 |\n| `MouseWheelEvent`\
  \ | 当滚轮移动时生成。 |\n| `TextEvent` | 当文本区域或字段的值改变时生成。 |\n| `WindowEvent` | 当窗口被激活、关闭、去激活、取消最小化、最小化、打开或退出时生成。\
