  \n# 第 6 章\n\n## Java 中的异常处理\n\n## 简介\n\n程序员面临的挑战之一是处理错误，特别是 Java 程序执行时抛出的运行时错误。运行时错误的原因是程序员的计算错误。例如，如果在从用户处获取输入后我们需要执行以下行代码：\n\
  \n`Z= ((a*b)-c)/ (b-c);`\n\n程序员可能不确定用户输入的值是多少，如果由于某种原因 `(b-c)` 的值等于零，那么我们的程序将会异常终止，因为我们正尝试除以零，这将导致除以零异常并且我们的程序将终止。另一个帮助我们理解\
  \ `Exception`（异常）概念的例子是，如果我们从命令行获取值，并尝试判断该数字是否为质数。在处理此类程序时，我们的程序在执行时期望在命令行参数中提供一个数字。如果没有提供数字，它将导致\
  \ `NumberFormatException`。\n\n因此，Java 异常是一个对象，它描述了代码部分发生的异常情况。当异常情况发生时，会产生一个表示该异常的对象，并抛在导致该错误的方法中。该方法可以决定自己处理异常，也可以将其向上抛出。无论哪种方式，异常在某处会被捕获并处理。`Exception`\
  \ 是执行 Java 程序时出现的运行时错误或异常代码行。通过 Java 的异常处理机制处理这些运行时错误或异常被称为*异常处理*（exception handling）。在本章中，我们将使用大多数实际示例来理解异常处理的概念，以便在我们的\
  \ Java 项目中正确处理异常。\n\n## 结构\n\n* 简介\n* 理解异常处理\n* 使用 try 和 catch\n* 嵌套 try…catch 语句\n\
  * 理解 `throw` 和 `throws`。\n* 理解内置异常类\n* 创建自定义异常\n* 作业\n\n## 目标\n\n本章解释了各种类型的错误，重点关注异常处理。本章的读者将能够处理任何\
  \ Java 程序中的异常异常。\n\n## 理解异常处理\n\n为了理解异常处理的概念，让我们执行下面的程序，看看 Java 的运行时环境如何对其做出反应。我们期望该程序输出两行内容：`Before\
  \ Exception`（异常前）和 `After Exception`（异常后），在这两行之间写了一个基本的计算语句：\n\n```java\npublic\
  \ class Exception_Demo {\n    public static void main(String[] args) {\n       \
  \ int a,b,c,z;\n        a=10;\n        b=10;\n        c=10;\n        System.out.println(\"\
  Before Exception\");\n        z=(a+b)/(b-c);\n        System.out.println(\"After\
  \ Exception\");\n    }\n}\n```\n\n现在我们将运行此程序并得到以下输出：\n\n`Before Exception`\n`Exception\
  \ in thread \"main\" java.lang.ArithmeticException: / by zero at Exception_Demo.main(10)`\n\
  \n如果我们仔细观察上面的程序，第一行是 \"Before Exception\"，但在下面的行出现了问题：\n\n`z=(a+b)/(b-c);`\n\n我们尝试除以零，这将导致除以零异常并且我们的程序将终止。这意味着作为程序员，我们必须理解异常在哪里发生，并且必须处理\
  \ `java.lang.ArithmeticException` 类。我们将通过另一个例子来理解这一概念：\n\n```java\npackage book;\n\
  public class Exception_Demo {\n    public static void main(String[] args) {\n  \
  \      int n[]= new int[10];\n        int sum=0;\n        for (int i=0;i<3;i++)\
  \ {\n            n[i]=Integer.parseInt(args[i]);\n            sum=sum+n[i];\n  \
  \      }\n        System.out.println(\"The sum =\"sum);\n    }\n}\n```\n\n在没有任何命令行参数的情况下执行上述程序，生成了以下错误或异常：\n\
  \n`Exception in thread \"main\" java.lang.ArrayIndexOutOfBoundsException: 0at Exception_Demo.main(8)`\n\
  \n我们没有处理的异常是 `ArrayIndexOutOfBoundsException`。作为程序员，我们期望运行时给出输入，程序生成相应的输出，因为 `args[]`\
  \ 数组尚未初始化。\n\n## 使用 try, catch 和 finally\n\nJava 提供了一种内置机制来处理运行时出现的错误并异常终止程序。正如上一节理解，每当异常发生时，它都会生成一个包含错误信息的异常对象。如果我们想捕获该对象，必须使用\
  \ `try, catch,` 和 `finally` 块。语法如下：\n\n```\ntry {\n    // 可能会发生异常的代码块\n}\ncatch\
  \ (ExceptionObject obj) {\n    // 给用户的错误信息和纠正措施\n}\nfinally {\n    // 此块是可选的，并且始终会被执行\n\
  }\n```\n\n为了使用异常处理，程序员必须遵循以下步骤：\n\n1. 程序员必须正确理解代码并找出异常可能发生的地方。不应不地使用 `try` 和 `catch`\
  \ 块。\n2. 程序员应该将可能生成异常的代码封装在 `try` 块中。如果行或几行代码被正确封装在 `try` 块中，它会将对象抛出给 `catch` 块。\n\
  \n\n\n\n\n3. 在将代码块包含在 `try` 块之后，程序员必须在 `catch` 块中 `catch` 那些对象。\n\n4. 如果程序员想要采取一些纠正措施，因为他们不确定异常是否会发生（即不确定是完全执行\
  \ `try` 块还是 `catch` 块），他们可以使用 `finally` 块，该块总是会被执行的。\n\n### 异常类型\n\n每种异常类型都是内置类\
  \ `Throwable` 的子类。因此，`Throwable` 处于异常类阶梯的顶端。紧邻 `Throwable` 之下有两个子类，将异常分为两个不同的分支。一个分支由\
  \ `Exception` 引导。该类用于用户程序必须捕的异常情况。此外，我们通过对该类进行子类来创建自定义的异常类型。`Exception` 有一个重要的子类，称为\
  \ `RuntimeException`。这种类型的异常为你编写的程序自动定义，包括例如除以零和无效数组索引等内容。\n\n在下面的 Java 程序中，预期发生异常的行包含在\
  \ `try` 块中，由于它尝试除以零，它会生成一个 `ArithematicException` 类型的对象，并且该对象在 `catch` 块中被捕获：\n\n\
  ```java\npublic class Exception_Demo {\n    public static void main(String[] args)\
  \ {\n        int a,b,c,z;\n        a=10;\n        b=10;\n        c=10;\n       \
  \ System.out.println(\"Before Exception\");\n        try{\n            z=(a+b)/(b-c);\n\
  \        }\n        catch(ArithematicException obj)\n        {\n            System.out.println(\"\
  Divide by Zero Exception\");\n        }\n        System.out.println(\"After Exception\"\
  );\n    }\n}\n```\n\n我们将得到以下输出：\n\n`Before Exception`\n\n`Divide by Zero Exception`\n\
  \n`After Exception`\n\n在下面的 Java 程序中，运行时生成异常的语句被包含在 `try` 块中，因为程序依赖于用户提供的命令行参数。用户可能提供也可能提供精确的输入数量，因此我们必须使用异常处理来处理此类场景：\n\
  \n```java\npackage book;\npublic class Exception_Demo {\n    public static void\
  \ main(String[] args) {\n        int n[] = new int[10];\n        int sum=0;\n  \
  \      try\n        {\n            for (int i=0;i<3;i++)\n            {\n      \
  \          n[i]=Integer.parseInt(args[i]);\n                sum=sum+n[i];\n    \
  \        }\n        }\n        catch(ArrayIndexOutOfBoundsException obj)\n     \
  \   {\n            System.out.println(\"Error in arguments\");\n        }\n    \
  \    System.out.println(\"The sum =\" +sum);\n    }\n}\n```\n\n我们将得到以下输出：\n\n`Error\
  \ in arguments`\n\n`The sum =0`\n\n在下面的程序中，我们使用了所有的块，即 `try`、`catch` 和 `finally`\
  \ 块。由于我们不确定 `try` 块还是 `catch` 块会被完全执行，如果我们在任何情况下都要执行某些语句，那么我们必须使用 `finally` 块，因为它总是执行的。在这个\
  \ Java 程序中，我们尝试打开一个文件。文件可能存在也可能不存在并在运行时产生异常，因此我们在打开文件时使用了 `try` 块，并使用 `finally`\
  \ 块关闭文件：\n\n```java\npackage book;\nimport java.io.*;\npublic class Finally_Demo\
  \ {\n    public static void main(String[] args) {\n        File f1 = new File(\"\
  in.dat\");\n        FileInputStream fin=null;\n        try\n        {\n        \
  \    fin = new FileInputStream(f1);\n            System.out.println(\"File OK\"\
  );\n        }\n        catch(IOException e)\n        {\n            System.out.println(\"\
  Error in Opening a File\");\n        }\n        finally\n        {\n           \
  \ try{\n                fin.close();\n            }\n            catch(IOException\
  \ e)\n            {\n                System.out.println(e);\n            }\n   \
  \     }\n    }\n}\n```\n\n我们将得到以下输出：\n\n`Error in Opening a File`\n\n`Exception\
  \ in thread \"main\" java.lang.NullPointerException`\n\n`at book.Finally_Demo.main(Finally_Demo.java:20)`\n\
  \n### 嵌套 try…catch 语句\n\n在我们的 Java 程序中，我们可能有一个语句，但它可能会产生多个异常。例如，下面的 Java 语句可以被求值：\n\
  \n```java\nsum = a[i]/ b[i+j];\n```\n\n在这条语句中，我们正在将一个数字除以另一个数字，而另一个数字可能是零，所以可能产生的异常之一是\
  \ `ArithematicException`。现在第二个可能产生的异常是 `ArrayIndexOutOfBoundsException`，因为我们不确定\
  \ `(i+j)` 的值是多少。所以对于单个语句，我们可能会得到两个异常。因此可以将此语句包含在 `try` 块中，后面跟着两个 `catch` 语句：\n\n\
  ```java\ntry\n{\n    Statement ;\n}\ncatch(ExceptionType1 e)\n{\n}\ncatch(ExceptionType2\
  \ e)\n{\n}\n```\n\n\n\n\n正如前几节讨论的，我们了解到当发生任何异常时，是异常对象进入了 `catch` 块。因此，这完全取决于运行时错误，只有在发生错误时，包含所有详细信息的对象会被发送到\
  \ `catch` 块。如果我们想强制将控制权转移到 `catch` 块，我们可以利用 `throw`，例如：\n\n```java\nthrow new IOException();\n\
  throw new NumberFormatException();\nthrow new ArithmeticException();\n```\n\n上述三个语句都会生成各自对应类的三个对象并发送到\
  \ `catch` 块。接下来的示例说明了如何使用 `throw` 语句生成对象并强制将它们抛给 catch 块。如果我们运行该程序，会发现并没有异常，因为除法操作是正确的，数组的使用也是如此，但由于\
  \ `throw` 语句的存在，我们仍然执行了 `catch` 块：\n\n```java\npackage book;\n\npublic class Multiple_Catch\
  \ {\n    public static void main(String[] args) {\n        try {\n            int\
  \ a[]={10};\n            int b,c,z;\n            b=100;\n            c=10;\n   \
  \         try {\n                z= a[0]/(b-c);\n                System.out.println(\"\
  No Arithmetic Exception \");\n                throw new ArithmeticException();\n\
  \            } catch(ArithmeticException e) {\n                System.out.println(\"\
  Division By Zero in Arithmetic Exception\");\n            }\n            a[0]=700;\n\
  \            System.out.println(\"No Array Index Exception \");\n            throw\
  \ new ArrayIndexOutOfBoundsException();\n        } catch(ArrayIndexOutOfBoundsException\
  \ e) {\n            System.out.println(\"Array Index out of Bounds Exception\");\n\
  \        }\n    }\n}\n```\n\n我们将得到以下输出：\n\n`No Arithmetic Exception`\n`Division\
  \ By Zero in Arithmetic Exception`\n`No Array Index Exception`\n`Array Index out\
  \ of Bounds Exception`\n\n### throws 关键字\n\n方法具有返回类型、函数名和参数，但我们也可能看到在方法末尾附加 `throws`\
  \ 关键字，例如：\n\n```java\nint get_Data (int n) throws IOException\n```\n\n现在我们理解了返回类型和参数，但问题是这个\
  \ `throws IOException` 是什么。这意味着该函数在定义中处理了输入/输出操作，并且没有处理在调用时可能发生的异常。因此，程序员的责任是在执行或调用此方法时处理\
  \ `throws` 语句中提到的异常。所以如果我们必须调用这个方法，必须这样写：\n\n```java\ntry {\n    objname.get_Data(2);\n\
  } catch(IOException obj) {\n}\n```\n\n在接下来的示例中，我们对 `get_Data` 方法使用了 `throws NumberFormatException`。因此，为了调用它，我们必须使用\
  \ `try` 和 `catch` 块将其封装起来：\n\n```java\npackage book;\n\nclass MyCls {\n    static\
  \ int get_Data(String a) throws NumberFormatException {\n        return(Integer.parseInt(a));\n\
  \    }\n}\n\npublic class Throws_Demo {\n    public static void main(String[] args)\
  \ {\n        int n;\n        try {\n            n= MyCls.get_Data(\"200\");\n  \
  \          System.out.println(\"Data = \" + n);\n        } catch(NumberFormatException\
  \ e) {\n        }\n    }\n}\n```\n\n我们将得到以下输出\n`Data = 200`\n\n### 理解内置异常类\n\n正如前几节讨论的，对于程序员来说，留意程序中可能发生异常的地方并据此处理这些异常非常重要。作为程序员，我们必须理解可能发生的各种类型的异常以及内置异常类。以下是\
  \ Java 中可用的一些异常类：\n\n| Exception | 含义 |\n| :--- | :--- |\n| `ArithmeticException`\
  \ | 算术错误，例如除以零。 |\n| `ArrayIndexOutOfBoundsException` | 数组索引越界。 |\n| `ArrayStoreException`\
  \ | 向类型不兼容的数组元素赋值。 |\n| `ClassCastException` | 无效的类型转换。 |\n| `EnumConstantNotPresentException`\
  \ | 尝试使用未定义的枚举值。 |\n| `IllegalArgumentException` | 调用方法时使用了非法的参数。 |\n| `IllegalMonitorStateException`\
  \ | 非法监视器操作，例如在未锁定的线程上等待。 |\n| `IllegalStateException` | 环境或应用程序处于错误状态。 |\n| `IllegalThreadStateException`\
  \ | 请求的操作与当前线程状态不兼容。 |\n| `IndexOutOfBoundsException` | 某种索引越界。 |\n| `NegativeArraySizeException`\
  \ | 使用负数大小创建数组。 |\n| `NullPointerException` | 非法使用空引用。 |\n| `NumberFormatException`\
  \ | 字符串转换为数值格式时转换无效。 |\n| `SecurityException` | 尝试违反安全性。 |\n| `StringIndexOutOfBounds`\
  \ | 尝试访问字符串范围外的索引。 |\n| `TypeNotPresentException` | 未找到类型。 |\n| `UnsupportedOperationException`\
  \ | 不支持的操作。 |\n| `ClassNotFoundException` | 未找到类。 |\n| `CloneNotSupportedException`\
  \ | 尝试克隆未实现 `Cloneable` 的对象。 |\n| `IllegalAccessException` | 拒绝访问类。 |\n| `InstantiationException`\
  \ | 尝试创建抽象类或接口的对象。 |\n| `InterruptedException` | 一个线程被另一个线程中断。 |\n| `NoSuchFieldException`\
  \ | 请求的字段不存在。 |\n| `NoSuchMethodException` | 请求的方法不存在。 |\n\n### 创建异常\n\n由于所有异常都继承自\
  \ `Exception` 类，我们可以通过扩展 `Exception` 类来创建自定义异常。由于这不是内置异常，我们必须使用 `throw` 关键字来强制抛出异常。下面的示例解释了如何创建并抛出该异常。`Exception`\
  \ 类本身没有定义任何方法，它确实继承了 `Throwable` 的这些方法。因此，所有异常（包括你创建的）都有 `Throwable` 定义的方法可以使用。它们如表\
  \ 6.2：\n\n| 方法 | 描述 |\n| :--- | :--- |\n| `fillInStackTrace()` | 返回一个包含堆栈跟踪的 `Throwable`\
  \ 对象。该对象可以被重新抛出。 |\n| `getCause()` | 返回底层异常。如果没有底层异常，则返回 `null`。 |\n| `getLocalizedMessage()`\
  \ | 返回异常的本地化描述。 |\n| `getMessage()` | 返回异常的描述。 |\n| `getStackTrace()` | 返回包含堆栈跟踪的数组，以\
  \ `StackTraceElement` 数组的形式逐个返回。 |\n| `initCause(Throwable causeExc)` | 将 `causeExc`\
  \ 与调用异常关联。返回异常引用。 |\n| `printStackTrace()` | 显示堆栈跟踪。 |\n| `printStackTrace(PrintWriter\
  \ stream)` | 将堆栈跟踪发送到指定的流。 |\n| `setStackTrace(StackTraceElement elements[])` |\
  \ 设置传入的堆栈跟踪。此方法用于特殊应用程序，不用于正常用途。 |\n| `toString()` | 返回一个包含异常描述的 `String` 对象。在输出\
  \ `Throwable` 对象时由 `println()` 调用。 |\n\n表 6.2: 由 Throwable 定义的方法\n\n在接下来的 Java 程序中，我们通过扩展\
  \ `Exception` 类创建了自己的自定义异常，并通过使用 `throw` 关键字强制抛出该异常：\n\n```java\npackage book;\n\
  \nclass MyOwnException extends Exception {\n    MyOwnException(String msg) {\n \
  \       super(msg);\n    }\n}\n\npublic class Exception_User {\n    public static\
  \ void main(String[] args) {\n        int a,b,c;\n        a=10;\n        b=10;\n\
  \        System.out.println(\"We are Trying to Create our Own Exceptions\");\n \
  \       try {\n            // ...\n```\n\n\n\n\n```\nc= a-b;\n\nthrow new MyOwnException(\"\
  Number is Equal to Zero\");\n}\ncatch(MyOwnException e)\n{\n    System.out.println(e.getMessage());\n\
  }\n}\n}\n```\n\n我们将得到以下输出：\n\n**我们正在尝试创建自己的异常**\n**Number is Equal to Zero**\n\n\
