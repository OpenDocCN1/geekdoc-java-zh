  `From Thread B j =9`\n\n### Runnable 接口\n\n实现多线程的另一种方法是通过实现 `Runnable` 接口。该 `Runnable`\
  \ 接口包含一个 `run()` 方法，实现 `Runnable` 接口的类必须实现该方法。所有希望作为线程执行的代码都必须保留在该 `run()` 方法中：\n\
  \n```java\nclass MyClass implements Runnable\n{\n  // Code to be executed as thread\n\
  }\n```\n\n现在，在实现 `Runnable` 后，如下所示从上述 `Runnable` 类实例化创建一个 `Thread` 对象：\n\n```java\n\
  MyClass r = new MyClass();\nThread ta = new Thread(r);\n```\n\n现在在创建线程类型对象后，通过调用\
  \ `Thread` 类的 `start` 方法来启动线程：\n\n```java\nta.start();\n```\n\n下面的示例展示了三个不同的类如何实现\
  \ `Runnable` 接口并实现了 `run` 方法。在 `main` 方法中创建了 `Thread` 类对象，它们是从这些 `Runnable` 接口类实例化的：\n\
  \n```java\npackage threadingmca;\nclass A implements Runnable\n{\n  public void\
  \ run()\n  {\n    for(int i= 1 ;i<10 ;i++)\n    {\n      System.out.println(\"From\
  \ Thread A i =\" + i);\n    }\n  }\n}\nclass B implements Runnable\n{\n  public\
