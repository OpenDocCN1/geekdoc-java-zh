  \ CloneExample implements Cloneable {\n  String data_1;\n  double data_2;\n  CloneExample\
  \ cloneTest() {\n    try {\n      return (CloneExample)\n      super.clone();\n\
  \    } catch(CloneNotSupportedException e) {\n      System.out.println(\"Cloning\
