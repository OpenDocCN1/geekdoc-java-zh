  \ 'exit' to quit.`**\n**`Hello Dear`**\n**`Hello Dear`**\n**`How are you`**\n**`How\
  \ are you`**\n**`stop`**\n**`stop`**\n\n## Java 中的文件处理\n\n`File` 类是 `java.io` 包中的一个关键类。`File`\
  \ 类对象用于实现或操作与磁盘上文件相关的信息，例如权限、时间、日期和目录路径，以及在子目录层级中导航。\n\n可以使用以下构造函数创建 `File` 对象：\n\
  \n`File(String directoryPath)`\n`File(String directoryPath, String filename)`\n\
  `File(File dirObj, String filename)`\n`File(URI uriObj)`\n\n一些实用的 File 方法如下：\n\n\
  | 方法 |  |\n| :--- | :--- |\n| `String getName()` | 获取文件名称。 |\n| `String getPath()`\
  \ | 获取文件路径。 |\n| `String getAbsolutePath()` | 获取文件的绝对路径。 |\n| `String getParent()`\
  \ | 获取文件的父目录。 |\n| `boolean exists()` | 如果文件存在则返回 `True`，否则返回 false。 |\n| `boolean\
  \ isFile()` | 如果是一个 `File` 则返回 `True`。 |\n| `long length()` | 返回文件的长度。 |\n| `void\
  \ deleteOnExit()` | 当 `JVM` 终止时删除调用对象关联的文件。 |\n| `long getFreeSpace()` | 返回调用对象关联分区上可用的可用字节数。\
  \ |\n| `long getTotalSpace()` | 返回调用对象关联分区的存储容量。 |\n| `long getUsableSpace()` |\
  \ 返回调用对象关联分区上可用的可用字节数。 |\n| `boolean isHidden()` | 如果调用文件是隐藏的则返回 true。否则返回 false。\
  \ |\n| `boolean setLastModified(long millisec)` | 将调用文件的时间戳设置为 `millisec` 指定的值，`millisec`\
  \ 是从协调世界时 (UTC) 1970 年 1 月 1 日开始的毫秒数。 |\n| `boolean setLastModified(long millisec)`\
  \ | 将调用文件设置为只读。 |\n\n**表 9.8:** File 类的方法\n\n正如在前一节中讨论过的，我们可以使用流类来向包括文件在内的不同设备读写数据。文件处理中使用的两个重要类是\
  \ `FileInputStream` 和 `FileOutputStream`。\n\n`FileInputStream` 类创建一个 `InputStream`，我们可以它从文件中读取字节。`FileOutputStream`\
  \ 类创建一个 `OutputStream`，我们可以用它向文件写入字节。\n\n正如我们讨论过的，字符流类被称为 `Writer` 和 `Reader`。`FileReader`\
  \ 类创建一个 `Reader`，我们可以用它来读取文件内容。它的两个主要构造函数在此所示：\n\n`FileReader(String filePath)`\n\
  `FileReader(File fileObj)`\n\n其中任何一个构造函数都可能抛出 `FileNotFoundException`。\n\n\n\n\n\
  \n以下示例展示了如何从文件中读取行并将其打印到标准输出流中。它读取了自身的源文件，该文件必须位于当前目录下：\n\n```java\nimport ava.io.*;\n\
  \npublic class ReaderWrterDemo {\n    public static void main(String args[]) throws\
  \ IOException\n    {\n        FileReader fr = new FileReader(\"Demo.java\");\n \
  \       BufferedReader br = new BufferedReader(fr);\n        String s;\n       \
  \ while((s = br.readLine()) != null)\n        {\n            System.out.println(s);\n\
  \        }\n        fr.close();\n    }\n}\n```\n\n`FileWriter` 创建了一个我们可以用来向文件写入内容的\
  \ `Writer`。这里展示了它最常用的构造函数：\n\n`FileWriter(String filePath)`\n`FileWriter(String\
  \ filePath, boolean append)`\n`FileWriter(File fileObj)`\n`FileWriter(File fileObj,\
  \ boolean append)`\n\n它们可能会抛出 `IOException`。下面的程序说明了 `FileWriter` 和 `FileReader`\
  \ 类的用法。这两个文件是通过分别向两个文件写入文本并逐一读取内容创建的：\n\n```java\npackage book;\nimport java.io.*;\n\
  public class ReaderWriterDemo {\n    public static void main(String args[]) throws\
  \ IOException\n    {\n        String source = \"Hello, Its working in Files\\n \"\
  ;\n        char buffer[] = new char[source.length()];\n        source.getChars(0,\
  \ source.length(), buffer, 0);\n        FileWriter f0 = new FileWriter(\"demofile.txt\"\
  );\n        // Writing All Characters to demofile\n        for (int i=0; i < buffer.length;\
  \ i ++)\n        {\n            f0.write(buffer[i]);\n        }\n        f0.close();\n\
  \        // Reading the demo file\n        System.out.println(\"Reading the First\
  \ File \");\n        FileReader fin = new FileReader(\"demofile.txt\");\n      \
  \  for (int i=0; i < buffer.length; i ++)\n        {\n            buffer[i]=(char)fin.read();\n\
  \            System.out.print(buffer[i]);\n        }\n        int l = buffer.length;\n\
  \        fin.close();\n        //Writing alternate characters to file1\n       \
  \ FileWriter f1 = new FileWriter(\"file1.txt\");\n        for (int i=0; i < buffer.length;\
