  \n**表 11.4:** 常见的 SQL 数据类型\n\n为了理解上述命令和数据类型，让我们在 `hr` 数据库中创建一个如下的 `Employee` 表：\n\
  \n![](img/11-5.jpg)\n\n**图 11.1:** 创建员工表\n\n`Employee` 表包含四列。第一列是 `emp_code`，数据类型为整数并被设置为主键；第二个属性是\
  \ `emp_name`，数据类型为 `varchar`；第三和第四列分别是 `emp_address` 和 `emp_pay`，数据类型分别为 `varchar`\
  \ 和 `integer`。现在，我们可以按照如下方式向 `Employee` 表中插入数据：\n\n![](img/11-2a.jpg)\n\n**图 11.2:**\
  \ 向员工表中插入记录\n\n在向 `Employee` 表中输入值时，注意行内容输入在括号之间，字符和日期值输入在单引号之间，数值输入不包含单引号，属性项之间用逗号分隔，且每列都需要一个值。使用\
  \ `NULL` 表示未知值。\n\n现在要从 `Employee` 中检索数据，使用了 `select` 命令，下图显示了三种方法。第一条命令从 `Employee`\
  \ 表中检索所有记录。第二条命令只检索 `emp_name` 和 `emp_pay`，第三条语句利用 `where` 子句仅检索名称符合条件的员工。执行的 SQL\
  \ 命令的截屏如图所示：\n\n![](img/11-3a.jpg)\n\n**图 11.3:** 从员工表中检索数据\n\n由于，对表内容的更改在发生以下一种情况之前，不会在物理上保存到磁盘中：\n\
  \n- 数据库关闭\n- 程序关闭\n\n使用 `COMMIT` 命令\n\n**语法：**\n\n```sql\nCOMMIT [WORK];\n```\n\n\
  将永久保存对数据库中任何表所做的任何更改。\n\n`ROLLBACK` 用于将数据库恢复到之前的状态，并且在未使用 `COMMIT` 命令永久存储数据库中的更改时才有效。\n\
  \n**语法：**\n\n```sql\nROLLBACK;\n```\n\n`COMMIT` 和 `ROLLBACK` 仅适用于添加、修改或删除表行的数据操纵命令。\n\
  \n### JDBC 架构\n\nJDBC 的通用架构如下图所示。在 Java 中实现数据库连接时，遵循以下顺序程序：\n\n![](img/11-4a.jpg)\n\
  \n**图 11.4:** JDBC 架构\n\n由于我们将通过 Java 程序访问数据库，已经有了专门的包供开发者在处理数据库时执行多种功能。其中一个重要的包是\
  \ `java.sql`。因此，第一步是加载 JDBC 库。\n\n为了处理特定的数据库，需要一个驱动程序。Java 可以使用任何驱动程序：\n\n| 驱动程序\
  \ | 说明 |\n| :--- | :--- |\n| **Type I 驱动:** | 使用桥接技术将 JDBC 翻译为 ODBC，并依赖 ODBC 驱动与数据库通信。该驱动程序需要在客户端机器上安装/配置，不适合\
  \ Web。例如：JDBC/ODBC Bridge |\n| **Type II 驱动** | 部分用 Java、部分用原生代码编写的原生 API 驱动。需要在客户端机器上安装/配置，用于利用现有的\
  \ CLI 库，通常不是线程安全的，现在大部分已淘汰。例如：Intersolv Oracle Driver, WebLogic 驱动 |\n| **Type III\
  \ 驱动** | 它是一个纯 Java 客户端库，并调用中间件服务器（通常在数据库主机上），非常灵活——允许使用一个驱动程序访问多个数据库，只需下载一个驱动程序。但它是另一个需要安装和维护的服务器应用程序。例如：Symantec\
  \ DB Anywhere |\n| **Type IV 驱动** | 100% 纯 Java —— 圣杯，使用 Java 网络库直接与数据库引擎通信。缺点是：需要为每个数据库引擎下载新的驱动程序。例如：Oracle,\
  \ mSQL |\n\n**表 11.5:** 驱动程序类型\n\n因此，一个驱动程序与特定的数据库通信，并且可以有多个驱动程序和多个数据库。\n\n### JDBC\
  \ 的实现\n\nJDBC 的实现通过从 `java.sql` 导入以下类和接口完成：\n\n- `DriverManager`: 加载、选择驱动程序。\n-\
  \ `Driver`: 连接到实际数据库。\n- `Connection`: 访问数据库的一系列 SQL 语句。\n- `Statement`: 单条 SQL\
  \ 语句。\n- `ResultSet`: 语句返回的记录。\n\n### Driver\n\n如果我们知道想要某个特定的驱动程序，那么这个类就是很有用的。因此，不推荐此类类，我们可以使用\
  \ `DriverManager` 代替 `Driver`。例如，下面的语句显式加载了一个特定的驱动程序：\n\n```java\nDriver dr = new\
  \ xyz.may.MyDriver();\nConnection c = dr.connect(…);\n```\n\n`Driver` 类的各种方法如下：\n\
  \n| Driver 的方法 |\n| :--- |\n| `public abstract java.sql.Connection connect(java.lang.String\
  \ arg0, java.util.Properties arg1) throws java.sql.SQLException;` |\n| `public abstract\
  \ boolean acceptsURL(java.lang.String arg0) throws java.sql.SQLException;` |\n|\
  \ `public abstract java.sql.DriverPropertyInfo[] getPropertyInfo(java.lang.String\
  \ arg0, java.util.Properties arg1) throws java.sql.SQLException;` |\n| `public abstract\
  \ int getMajorVersion();` |\n| `public abstract boolean jdbcCompliant();` |\n| `public\
  \ abstract java.util.logging.Logger getParentLogger() throws java.sql.SQLException;`\
  \ |\n| `public abstract int getMinorVersion();` |\n| `public abstract boolean acceptsURL(java.lang.String\
  \ arg0) throws java.sql.SQLException;` |\n\n**表 11.6:** Driver 的方法\n\n### DriverManager\n\
  \n它根据给定的 JDBC URL、用户名和密码建立连接。抛出 `java.sql.SQLException`。返回一个 `Connection` 对象。例如，下面的代码与\
  \ Oracle 数据库建立连接，如果成功，则返回 Connection 对象。我们必须将这些代码封装在 `try` 和 `catch` 块中，因为它可能会抛出\
  \ `SQLException` 或 `ClassNotFoundException`：\n\n```java\nString dbURL = \"jdbc:oracle:thin:@localhost:1521:xe\"\
  ;\nString username =\"hr\";\nString password =\"hr\";\nClass.forName(\"oracle.jdbc.driver.OracleDriver\"\
  );\nConnection conn = DriverManager.getConnection(dbURL, username, password);\n\
  ```\n\n下表列出了 `DriverManager` 的各种方法：\n\n| DriverManager 的方法 |\n| :--- | :--- |\n\
