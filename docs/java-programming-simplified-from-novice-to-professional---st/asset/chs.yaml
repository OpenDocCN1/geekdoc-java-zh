  \ BufferedReader(new InputStreamReader(System.in));\n            System.out.println(\"\
  Enter Anything you want, '0' to quit.\");\n            do {\n                in\
  \ = (char) br.read();\n                System.out.println(in);\n            } while(in\
  \ != '0');\n        } catch(IOException e) {\n            System.out.println(\"\
  Error While reading\");\n        }\n    }\n}\n```\n\n我们将得到以下输出：\n\n![](img/9-2.jpg)\n\
  \n**图 9.2**\n\n以下程序使用了 `BufferedReader` 类，该类反而使用 `InputStreamReader` 和 `System.in`\
  \ 作为其构造函数的参数，通过利用 `readLine` 方法以行的形式从用户处获取输入。\n\n```java\npackage book;\nimport\
