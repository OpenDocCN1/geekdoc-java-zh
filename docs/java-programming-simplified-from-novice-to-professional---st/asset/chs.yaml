  oracle.jdbc.driver.OracleDriver\");\n        Connection conn = DriverManager.getConnection(dbURL,\
  \ username, password);\n        Statement stmt = conn.createStatement();\n     \
  \   String sql =\"SELECT * from abc\";\n        stmt.executeQuery(sql);\n      \
  \  ResultSet rs = stmt.getResultSet();\n        Boolean r = null;\n        System.out.println(\"\
