  我们将得到以下输出：\n```\nThe Net Salary is 8100\n```\n\n#### for 循环\n\n正如你从之前的编程经验中所了解的，循环结构是几乎任何编程语言的重要部分。Java\
  \ 也不例外。事实上，最通用的是 `for` 循环。`for` 循环的最简单形式所示所示：\n\n```java\nfor(initialization; condition;\
  \ iteration) statement;\n```\n\n或者\n\n```java\nfor(initialization; condition; iteration)\n\
  {\n    Block of statements;\n}\n```\n\n在最常见的形式中，循环的初始化部分将循环控制变量设置为初始值。条件是一个测试循环控制变量的\
  \ `Boolean` 表达式。如果该测试的结果为真，`for` 循环将继续迭代。如果为假，循环将终止。迭代表达式决定了每次循环迭代时循环控制变量是如何变化的。这里有一个说明\
  \ `for` 循环的简短程序：\n\n```java\npublic class ForExample {\n    public static void main(String\
  \ args[]) {\n        int i;\n        for(i = 0; i<10; i++)\n            System.out.println(\"\
  This is i: \" + i);\n    }\n}\n```\n\n上面的程序将生成以下输出：\n```\nThis is i: 0\nThis is\
  \ i: 1\nThis is i: 2\nThis is i: 3\nThis is i: 4\nThis is i: 5\nThis is i: 6\nThis\
  \ is i: 7\nThis is i: 8\nThis is i: 9\n```\n\n在这个示例中，`i` 是循环控制变量。它在 `for` 的初始化部分被初始化为零。在每次迭代开始时，执行条件测试\
  \ `x < 10`。如果此测试的结果为真，则执行 `println( )` 语句，然后执行循环的迭代部分。这个过程一直持续到条件测试为假。\n\n#### while\
  \ 循环\n\n与 `for` 循环一样，`while` 循环是用于循环的 Java 结构。主要区别在于，初始化和增/减语句不像 `for` 循环那样在大括号内：\n\
  \n```java\n//Initialization\nwhile (condition)\n{\n    block of statements including\n\
  \    increment / decrement\n}\n```\n\n下面的 Java 程序利用 `while` 循环生成与上面程序相同的输出：\n\n\
  ```java\npublic class WhileExample {\n    public static void main(String args[])\
  \ {\n        int i;\n        i=0; // Initialization\n        while (i<10) {\n  \
  \          System.out.println(\"This is i: \" + i);\n            i++; // Increment\n\
  \        }\n    }\n}\n```\n\n上面程序的输出是：\n```\nThis is i: 0\nThis is i: 1\nThis is\
  \ i: 2\nThis is i: 3\nThis is i: 4\nThis is i: 5\nThis is i: 6\nThis is i: 7\nThis\
  \ is i: 8\nThis is i: 9\n```\n\n#### do…while 循环\n\n`while` 和 `do…while` 循环之间的唯一区别是，`do…while`\
  \ 中的条件是在语句或语句块第一次执行末尾时检查的。这意味着即使条件为假，`do…while` 循环也会至少执行一次语句。语法如下：\n\n```java\n\
  //Initialization\ndo {\n    block of statements including\n    increment / decrement\n\
