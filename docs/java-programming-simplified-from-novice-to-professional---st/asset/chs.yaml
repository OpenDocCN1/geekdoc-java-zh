  \ Marks Are \" + get_Total());\n    }\n    int get_Total()\n    {\n        return(sp_marks+marks);\n\
  \    }\n    public static void main(String arg[])\n    {\n        Result1 s1 =new\
  \ Result1(\"Gh. Mohammad \",3,400,\"Sajad\",300);\n        s1.display();\n    }\n\
