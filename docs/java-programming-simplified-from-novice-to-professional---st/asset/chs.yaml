  );\n    }\n    public void showDir()\n    {\n        System.out.println(\"Director\
  \ Class within nielit.employee package\");\n    }\n}\n\n// Technical Class\npackage\
  \ nielit.employee;\npublic class Technical {\n    public Technical()\n    {\n  \
