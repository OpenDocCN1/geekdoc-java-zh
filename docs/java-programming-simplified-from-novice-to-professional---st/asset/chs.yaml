  \n## 引言\n\n数组是相同类型变量的集合，其目的是通过一个所有变量通用的通用名称来引用它们。可以形成任何类型的数组，并且可能具有一个或多个维度。数组中的精确组件通过其索引（index）来访问。数组为关联信息提供了一种分组的方法。假设我们被编写一个程序，其中创建\
  \ 100 个学生的学号。一种方法是创建 100 个 `int` 变量，但这不是推荐的方法，因为它会让程序变得非常复杂。为了编写简洁高效的程序，另一种方法是创建一个数组，数组是一组共享共同名称的连续或相关数据项。例如，我们可以定义一个\
  \ `int` 数组 `roll` 来表示 100 个不同学生的学号集。如果我们想访问任何一个学号，必须在数组名后的方括号中使用索引或下标，如下：\n\n```java\n\
  roll[60]; // 代表第 60 个学生的学号\n```\n\n借助单一的循环结构，我们可以通过更改循环内的索引值来访问数组的所有元素。在本章中，我们将详细讨论一维数组和二维数组，还将详细关注字符串和向量（vectors）。\n\
  \n## 结构\n\n* 引言\n* 1-D 数组的实现\n* 2-D 数组的实现\n* Java 中的字符串处理\n* StringBuffer 类\n* Java\
  \ 中的类型包装类\n* 练习\n\n## 目标\n\n本章详细解释了数组。本章还解释了字符串处理和包装类。\n\n## 1 维数组的实现\n\nJava 中的一维数组通过以下方式之一声明：\n\
  \n![](img/p158.jpg)\n\n在创建数组后，我们可以使用语句存储数字：\n\n```java\nroll[0]=50;\nroll[1]= 130;\n\
  roll[2]= 430;\nroll[3]= 300;\nroll[4]= 60;\n```\n\n或者，可以通过以下语句完成上述赋值：\n\n```java\n\
  int roll[] = {50, 130,430,300,60};\n```\n\n该语句将自动创建一个包含 5 个变量的数组，其中 `roll[0]` 存储第一个数字\
  \ 50。由于数字存储在连续的内存位置，其内存表示如下：\n\n```text\nroll[0]\nroll[1]\nroll[2]\nroll[3]\nroll[4]\n\
  ```\n\n这个 Java 程序对存储在数组 `roll` 中的给定学号数组进行排序：\n\n```java\npackage book;\n\npublic\
  \ class Array_Sort {\n    public static void main(String[] args) {\n        int\
  \ roll[] = new int[10];\n        roll[0]=4;\n        roll[1]=2;\n        roll[2]=1;\n\
  \        roll[3]=5;\n        roll[4]=3;\n        System.out.println(\"Before Sorting\"\
  );\n        for(int i=0;i<5;i++)\n            System.out.print(roll[i] +\" \");\n\
  \        for(int i=0;i<5;i++)\n        {\n            for(int j=i+1;j<5;j++)\n \
  \           {\n                if (roll[i]>roll[j])\n                {\n       \
  \             int temp=roll[i];\n                    roll[i]=roll[j];\n        \
  \            roll[j]=temp;\n                }\n            }\n        }\n      \
  \  System.out.println(\"\\n After Sorting\");\n        for(int i=0;i<5;i++)\n  \
  \          System.out.print(roll[i] +\" \");\n    }\n}\n```\n\n我们将得到以下输出：\n\n**Before\
  \ Sorting**\n`4 2 1 5 3`\n\n**After Sorting**\n`1 2 3 4 5`\n\n以下 Java 程序创建了一个包含\
  \ N 个玩家对象的数组，并根据它们的得分对其进行排序：\n\n```java\npackage book;\nclass Player\n{\n    int\
  \ player_id;\n    String name;\n    Player()\n    {}\n    Player(int a, String s)\n\
  \    {\n        player_id=a;\n        name=s;\n    }\n    void display()\n    {\n\
  \        System.out.print(player_id + \" \" + name);\n    }\n}\n\nclass Performance\
  \ extends Player\n{\n    int score;\n    Performance()\n    {}\n    Performance(int\
  \ a, String s, int m)\n    {\n        super(a,s);\n        score=m;\n    }\n   \
  \ void display()\n    {\n        super.display();\n        System.out.println(\"\
  \ \" +score);\n    }\n    static void sort(Performance a[], int n)\n    {\n    \
  \    Performance temp = new Performance();\n        for(int i=0;i<n;i++)\n     \
  \   {\n            for(int j=i+1;j<n;j++)\n            {\n                if(a[i].score<a[j].score)\n\
  \                {\n                    temp = a[i];\n                    a[i]=\
  \ a[j];\n                    a[j]=temp;\n                }\n            }\n    \
  \    }\n    }\n\npublic class Player_Sort {\n    public static void main(String[]\
  \ args) {\n        Performance a[] = new Performance[5];\n        a[0] = new Performance(\"\
  Saleem\",2000);\n        a[1] = new Performance(\"Feroz\",2100);\n        a[2] =\
  \ new Performance(\"Wahid\",1000);\n        a[3] = new Performance(\"Nisar\",1500);\n\
  \        a[4] = new Performance(\"Ishfaq\",1200);\n        System.out.println(\"\
  Before Sorting \");\n        System.out.print(\"ID Name Score \\n\");\n        for(int\
  \ i=0;i<5;i++)\n            a[i].display();\n        Performance.sort(a, 5);\n \
  \       System.out.println(\"After Sorting on Score\");\n        for(int i=0;i<5;i++)\n\
  \            a[i].display();\n    }\n}\n```\n\n我们将得到以下输出：\n\n**Before Sorting**\n\
  `ID Name Score`\n`Saleem 2000`\n`Feroz 2100`\n`Wahid 1000`\n`Nisar 1500`\n`Ishfaq\
  \ 1200`\n\n**After Sorting on Score**\n`Feroz 2100`\n`Saleem 2000`\n`Nisar 1500`\n\
  `Ishfaq 1200`\n`Wahid 1000`\n\n在下面的 Java 程序中，对数组执行了各种操作，如求和、求最大值和反转。最后数组进行了排序：\n\
  \n```java\npackage book;\npublic class Array_Operations {\n    public static void\
  \ main(String[] args) {\n        int arr[] = { 20,50,10,60,70};\n        int sum=0,max,min;\n\
  \        for(int i=0;i<arr.length;i++)\n        {\n            sum=sum + arr[i];\n\
