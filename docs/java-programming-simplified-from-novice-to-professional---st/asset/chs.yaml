  You are Old\");\n        else\n            System.out.println(\"You are Young\"\
  );\n    }\n}\n```\n输出将是 `You are Young.`\n\n我们可以如下实现嵌套的 `if…else` 语句：\n\n```java\n\
  if (Marks >75) {\n    if (marks > 50)\n        Statement 1;\n    else\n        Statement\
