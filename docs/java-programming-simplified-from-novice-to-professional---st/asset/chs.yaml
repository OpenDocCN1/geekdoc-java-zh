  \ :--- | :--- |\n| `Cloneable` | |\n| `Comparable` | |\n| `CharSequence` | |\n|\
  \ `Iterable` | |\n| `Runnable` | |\n| `Serializable` | |\n\n#### 表 4.4: `java.lang`\
  \ 示例\n\n以下程序使用了 `java.lang` 包的一些类：\n\n```java\npackage book;\npublic class LangExample\
  \ {\n    public static void main(String[] args) {\n        Runtime r = Runtime.getRuntime();\n\
  \        Process p = null;\n        long first, second;\n        String data[] =\
  \ new String[1000];\n        System.out.println(\"Memory = \" +r.totalMemory());\n\
  \        first = r.freeMemory();\n        System.out.println(\"Free Memory = \"\
  \ + first);\n        for(int i=0; i<1000; i++) {\n            data[i] = new String(\"\
  i\");\n        }\n        second = r.freeMemory();\n        System.out.println(\"\
  After allocation: \" +second);\n        System.out.println(\"Memory used by String:\
  \ \" +(first-second));\n        for(int i=0; i<1000; i++) data[i] = null;\n    \
  \    r.gc(); // 请求垃圾回收\n        second = r.freeMemory();\n        System.out.println(\"\
  Free memory after collecting discarded Strings: \" + second);\n        System.out.println(\"\
  \ Using Runtime to open a Calculator \");\n        try {\n            p = r.exec(\"\
