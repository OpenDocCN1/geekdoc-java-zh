  \ Java 的任何功能，无论是创建图形用户界面还是处理输入输出，都只能通过类和对象来实现。如果我们理解对象和类的概念，就能正确地理解 Java 语言并编写高级程序，因为\
  \ Java 的一切都是通过类和对象实现的。\n\nJava 的基本构建单元是类和对象。从一开始，我们就使用了类，它们定义了对象的内部细节。它们构成了面向对象编程的框架。如果我们想实现\
  \ Java 的任何功能，无论是创建图形用户界面还是处理输入输出，都只能通过类和对象来实现。如果我们理解对象和类的概念，就能正确地理解 Java 语言并编写高级程序，因为\
  \ Java 的一切都是通过类和对象实现的。\n\nJava 的基本构建单元是类和对象。从一开始，我们就使用了类，它们定义了对象的内部细节。它们构成了面向对象编程的框架。如果我们想实现\
  \ Java 的任何功能，无论是创建图形用户界面还是处理输入输出，都只能通过类和对象来实现。如果我们理解对象和类的概念，就能正确地理解 Java 语言并编写高级程序，因为\
  \ Java 的一切都是通过类和对象实现的。\n\n### 创建类和对象\n\n正如讨论过的，类是一个模板，我们在类中包含的任何内容都会反映在对象中。类的通用格式如下：\n\
  \n```java\nclass MyClass [extends classname, Implements interfacename\n{\n    //\
  \ 类的体\n}\n```\n\n\n\n\n\n```java\nStudent s1 = new Student();\n```\n\nOR\n\n```java\n\
  Student s1;\n```\n\n```java\ns1=new Student();\n```\n\n创建对象后，我们可以通过使用 `.`（点）运算符来访问数据成员或方法。例如，如果我们想访问\
  \ `s1` 的名称，可以使用 `s1.name`。到目前为止我们还没有使用访问修饰符，因此默认使用了 friendly 访问修饰符（这不是一个关键字）。由于\
  \ C++ 的默认访问修饰符是 `private`，但 `Java` 并非如此，`Java` 的默认访问修饰符是 friendly：\n\n```java\n\
  class Student\n{\n    //Data\n    int en_no, marks;\n    String name;\n    // Methods\n\
  \    void getData(int no, int m,String nm)\n    {\n        en_no=no;\n        marks=m;\n\
  \        name=nm;\n    }\n    void putData()\n    {\n        System.out.println(\"\
  Enrolment Number = \" + en_no + \"Name = \" +name+ \"marks =\" + marks );\n    }\n\
  }\n\n//Main Class\npublic class MainClass {\n    public static void main(String[]\
  \ args) {\n        // TODO Auto-generated method stub\n        Student s1=new Student();\n\
  \        Student s2=new Student();\n        s1.getData(33, 500, \"Abdul Wahid Wali\"\
  );\n        s2.getData(13, 400, \"Mohammad Saleem Mir\");\n        s1.putData();\n\
  \        s2.putData();\n    }\n}\n```\n\n我们将得到以下输出：\n\n**Enrolment Number = 33Name\
  \ = Abdul Wahid Walimarks =500**\n\n**Enrolment Number = 13Name = Mohammad Saleem\
  \ Mirmarks =400**\n\n我们可以在同一个程序中创建 `N` 个对象。我们将进一步增强上面的程序并包含另一个类 `Box`。`Box` 的对象在主类中创建并访问：\n\
  \n```java\nclass Box\n{\n    //Data\n    int length, breadth, height;\n    // Methods\n\
  \    void getData(int a, int b,int c)\n    {\n        length=a;\n        breadth=b;\n\
  \        height=c;\n    }\n    void putData()\n    {\n        System.out.println(\"\
  Length = \" + length + \"breadth = \" +breadth+ \"height =\" + height );\n    }\n\
  }\n\nclass Student\n{\n    //Data\n    int en_no, marks;\n    String name;\n   \
  \ // Methods\n    void getData(int no, int m,String nm)\n    {\n        en_no=no;\n\
  \        marks=m;\n        name=nm;\n    }\n    void putData()\n    {\n        System.out.println(\"\
  Enrolment Number = \" + en_no + \"Name = \" +name+ \"marks =\" + marks );\n    }\n\
  }\n\n//Main Class\npublic class MainClass {\n    public static void main(String[]\
  \ args) {\n        // TODO Auto-generated method stub\n        Student s1=new Student();\n\
  \        Student s2=new Student();\n        Box b1 = new Box();\n        Box b2=\
  \ new Box();\n        s1.getData(33, 500, \"Abdul Wahid Wali\");\n        s2.getData(13,\
  \ 400, \"Mohammad Saleem Mir\");\n        b1.getData(2, 3, 9);\n        b2.getData(4,\
  \ 7, 5);\n        s1.putData();\n        s2.putData();\n        b1.putData();\n\
  \        b2.putData();\n    }\n}\n```\n\n我们将得到以下输出：\n\n**Enrolment Number = 33Name\
  \ = Abdul Wahid Walimarks =500**\n\n**Enrolment Number = 13Name = Mohammad Saleem\
  \ Mirmarks =400**\n\n**Length = 2breadth = 3height =9**\n\n**Length = 4breadth =\
  \ 7height =5**\n\n在上面的程序中，`Student` 和 `Box` 这两个类定义了新的数据类型。我们使用这些名称来创建 `Student`\
  \ 类型和 `Box` 类型的对象。需要重要的是，类声明仅仅创建了一个可以用于定义对象的模板，它并不会创建实际的对象。\n\n为了创建 `Student` 和\
  \ `Box` 对象，我们需要使用如下语句：\n\n```java\nStudent s1=new Student(); // 创建一个 Student 类型对象\n\
  Student s2=new Student(); // 创建第二个 Student 类型对象\nBox b1 = new Box(); // 创建一个 Box\
  \ 类型对象\nBox b2= new Box(); // 创建第二个 Box 类型对象\n```\n\n在这些语句执行后，`s1` 和 `s2` 将是 `Student`\
  \ 类的实例，而 `b1` 和 `b2` 将是 `Box` 类的对象。每当我们声明一个类的实例时，我们都在创建一个对象，该对象包含了该类定义的所有实例变量的独立副本。因此，每个\
  \ `Student` 对象都包含其自己的实例变量副本。\n\n\n\n\n构造函数在对象形成时会立即对其初始化。它的名称与它所在的类名称相同，并且与方法相似，但我们称之为“特殊成员函数”，因为它具有一些特殊特性，例如构造函数会在对象形成后立即自动调用，在\
  \ `new` 运算符完成之前就会执行。构造函数看起来既奇特又奇妙，因为它们没有返回类型，甚至 `void` 也没有。这是因为类构造函数的固有返回类型是类本身。\n\
  \n作为类的特殊成员函数，它具有以下一系列特有特征：\n\n*   构造函数的名称与类名相同。例如，如果我们想创建一个 `Student` 类，它的构造函数名称将与\
  \ `Student();` 相同；例如下面的类有两个名称与类名 `Employee` 相同的构造函数：\n\n```java\nclass Employee\n\
  {\n    // 默认构造函数\n    Employee( )\n    {\n        // 构造函数体\n    }\n    // 参数构造函数\n\
  \    Employee( int d1, int d2)\n    {\n        // 构造函数体\n    }\n}\n```\n\n*   构造函数不返回任何值，甚至连\
  \ `void` 也没有。在上面的示例中，构造函数没有返回类型。\n\n*   构造函数在对象创建时会被自动唤起/调用。如果我们创建了一个 `Box` 类并正在创建一个对象\
  \ `Box b = new Box();`，那么它会自动调用 `Box()` 构造函数（如果存在）。上面的构造函数通过以下语句自动调用：\n\n```java\n\
  Employee emp1= new Employee( ); // 将调用默认构造函数\nEmployee emp2= new Employee(2, 200\
  \ ); // 将调用带参数的构造函数\n```\n\n下面的关于构造函数的程序将清楚地解释这一概念。\n\n在接下来的示例中，我们创建包含三个数据成员的 `Student`\
  \ 类。现在为了初始化这些数据成员，我们使用了上一个示例中的 `putData()` 成员函数。现在，当对象创建时，我们可以通过使用构造函数来初始化它们。因此，我们用\
  \ `Student()` 构造函数替换了 `putData()` 函数，并使用三个对象来初始化：\n\n```java\nclass Student\n{\n\
  \    // 数据\n    int en_no, marks;\n    String name;\n    // 构造函数\n    Student(int\
  \ no, int m,String nm)\n    {\n        en_no=no;\n        marks=m;\n        name=nm;\n\
  \    }\n    void putData()\n    {\n        System.out.println(\"Enrolment Number\
  \ = \" + en_no + \"Name = \" +name+ \"marks =\" + marks );\n    }\n}\n\npublic class\
  \ Constructor_Demo {\n    public static void main(String[] args) {\n        Student\
  \ s1=new Student(3,300,\"Arshid\");\n        Student s2=new Student(4,500,\"Rahid\"\
  );\n        s1.putData();\n        s2.putData();\n    }\n}\n```\n\n我们将得到以下输出：\n\n\
  **`Enrolment Number = 3Name = Arshidmarks =300`**\n**`Enrolment Number = 4Name =\
  \ Rahidmarks =500`**\n\n在接下来的示例中，我们创建了多个具有不同参数的构造函数和一个没有任何参数的默认参数。这种概念被称为构造函数重载。现在取决于取决于创建的对象的参数的数量和类型。如果创建的对象没有参数，它将进入无参数的默认构造函数。下面的示例根据传递的参数创建了三个构造函数。第一个对象通过默认构造函数创建，其他对象通过参数构造函数创建：\n\
  \n```java\nclass Student\n{\n    // 数据\n    int en_no, marks;\n    String name;\n\
  \    // 构造函数\n    Student()\n    {\n        System.out.println(\"Default Constructor\
  \ Invoked\" );\n    }\n    Student(int r)\n    {\n        en_no =r;\n        System.out.println(\"\
  Constructor with One Argument\" );\n    }\n    Student(int no, int m,String nm)\n\
  \    {\n        en_no=no;\n        marks=m;\n        name=nm;\n        System.out.println(\"\
  Constructor with three Arguments\" );\n    }\n    void putData()\n    {\n      \
  \  System.out.println(\"Enrolment Number = \" + en_no + \"Name = \" +name+ \"marks\
  \ =\" + marks );\n    }\n}\n\npublic class Constructor_Demo {\n    public static\
  \ void main(String[] args) {\n        Student s1=new Student();\n        Student\
  \ s2= new Student(44);\n        Student s3= new Student(4,500,\"Rahid\");\n    }\n\
  }\n```\n\n我们将得到以下输出：\n\n**`Default Constructor Invoked`**\n**`Constructor with One\
  \ Argument`**\n**`Constructor with three Arguments`**\n\nStack（栈）程序使用了构造函数进行了重复：\n\
  \n```java\npackage book;\nclass Stack {\n    String stck[] = new String[5];\n  \
  \  int tos ;\n    // 构造函数\n    Stack( )\n    {\n        System.out.println(\" Constructing\
  \ a Stack:\");\n        tos = -1\n    }\n    void push(String item) {\n        if(tos==5)\n\
  \            System.out.println(\"Stack Overflow.\");\n        else\n          \
  \  stck[++tos] = item;\n    }\n    String pop() {\n        if(tos < 0) {\n     \
  \       System.out.println(\"Stack underflow.\");\n            return \"\";\n  \
  \      }\n        else\n            return stck[tos--];\n    }\n}\n\nclass StackExample\
  \ {\n    public static void main(String args[]) {\n        Stack stack1 = new Stack();\n\
  \        Stack stack2 = new Stack();\n        // 在第一个栈中压入\n        stack1.push(\"\
  Apple\");\n        stack1.push(\"Ball\");\n        stack1.push(\"Cat\");\n     \
  \   stack1.push(\"Dog\");\n        stack1.push(\"Egg\");\n        // 在第二个栈中压入\n\
  \        stack2.push(\"Allah\");\n        stack2.push(\"Basket\");\n        stack2.push(\"\
  Carrot\");\n        stack2.push(\"Donkey\");\n        stack2.push(\"Email\");\n\
  \        System.out.println(\"Stack in mystack1:\");\n        for(int i=0;i<5;i++)\n\
  \            System.out.println(stack1.pop());\n        System.out.println(\"Stack\
  \ in mystack2:\");\n        for(int i=0; i<5;i++)\n            System.out.println(stack2.pop());\n\
  \    }\n}\n```\n\n我们将得到以下输出：\n\n**`Constructing a Stack:`**\n**`Constructing a Stack:`**\n\
  **`Stack in mystack1:`**\n**`Egg`**\n**`Dog`**\n**`Cat`**\n**`Ball`**\n**`Apple`**\n\
  **`Stack in mystack2:`**\n**`Email`**\n**`Donkey`**\n**`Carrot`**\n**`Basket`**\n\
  **`Allah`**\n\n\n\n\n\n在接下来的示例中，我们将扩展之前的程序并添加两个 `Box` 类对象，将结果存储在第三个对象中。`this` 运算符用于累加调用对象的的内容：\n\
  \n```java\nclass Box {\n    private int l,b,h, vol;\n    Box() {\n        l=0;\n\
  \        b=0;\n        h=0;\n    }\n    Box(int a,int b, int c) {\n        l=a;\n\
  \        this.b=b; // this 用于消除歧义\n        h=c;\n        vol= a*b*c;\n    }\n  \
  \  void display() {\n        System.out.println( \"Volume After Addition = \" +\
  \ vol);\n    }\n    Box compare(Box b2) {\n        if (this.vol>b2.vol)\n      \
  \      return this;\n        else\n            return b2;\n    }\n    Box add(Box\
  \ b2) {\n        return (new Box(this.b+b2.b,this.h+b2.h,this.l+b2.l));\n    }\n\
  \    public static void main(String[] args) {\n        // TODO Auto-generated method\
  \ stub\n        Box b1= new Box(2,3,4);\n        Box b2= new Box(12,3,40);\n   \
  \     Box temp = new Box();\n        temp=b1.compare(b2);\n        //temp.display();\n\
  \        temp=b1.add(b2);\n        temp.display();\n    }\n}\n```\n\n我们将得到以下输出：\n\
  \n`Volume After Addition = 3696`\n\n在下面的 Java 程序中，`this` 运算符用于访问调用对象并与另一个对象进行比较。如果调用对象较大，则返回引用当前对象的\
  \ `this`：\n\n```java\npackage book;\npublic class Rect {\n    int length,width;\n\
  \    Rect() {\n        this.length=0;\n        this.width=0;\n    }\n    Rect(int\
  \ a, int b) {\n        this.length=a;\n        this.width=b;\n    }\n    int area()\
  \ {\n        return(length*width);\n    }\n    Rect max(Rect obj) {\n        if\
  \ (this.area() > obj.area())\n            return(this);\n        else\n        \
  \    return(obj);\n    }\n}\npublic class ThisOperatorDemo {\n    public static\
  \ void main(String[] args) {\n        Rect r1 = new Rect(20,30);\n        Rect r2\
  \ = new Rect(10,500);\n        System.out.println(\"Area of First Rectangle = \"\
  \ + r1.area());\n        System.out.println(\"Area of 2nd Rectangle = \" + r2.area());\n\
  \        System.out.println(\"Area of Largest Rectangle = \" + r1.max(r2).area());\n\
  \    }\n}\n```\n\n我们将得到以下输出：\n\n`Area of First Rectangle = 600`\n`Area of 2nd Rectangle\
  \ = 5000`\n`Area of Largest Rectangle = 5000`\n\n### 理解访问修饰符\n\n正如我们在之前的程序中所看到的，数据和方法可以从类外部访问。这在面向对象编程（OOP）并不是正确的方法，因为我们希望从类外部隐藏数据。为了实现数据封装（即隐藏数据使其仅能从类内部访问），Java\
  \ 与其他面向对象的语言一样，提供了访问修饰符来限制数据和方法的访问。Java 有三个可见性控制 `public`、`private` 和 `protected`，它们可以用于数据成员或成员函数。在之前的示例中，我们没有使用任何访问修饰符，但仍然能够访问数据和方法，这是因为\
  \ `javac` 会提供一个默认访问修饰符，它是友好的的，其作用范围是相同包内的所有类（包是一组相似的类，将在后续章节中讨论）。\n\n- `public:`：如果我们希望数据和方法对包内和包外的所有类都可用，我们可以使用\
  \ `public` 访问控制。通常情况下，我们希望隐藏数据并让其他类可以使用成员函数，因此我们在方法上使用 `public`，以便它们可以从其他类调用。`public`\
  \ 访问控制的语法如下：\n\n```java\npublic float data1;\npublic void method_name() {\n}\n```\n\
  \n- `private:`：当类的成员被指定为 `private` 时，该成员只能由其所属类的其他成员访问。这就是为什么 `main()` 前总是带有 `public`\
  \ 修饰符的原因。它是由程序外部的代码——即 Java 运行时系统——调用的。当不使用访问修饰符时，默认情况下类的成员在其私有包内是公开的，但无法在包外访问。\n\
  \n- `protected:`：主要用于继承，声明为 `protected` 的数据可以从包内或包外的子类访问。如果我们希望数据能被子类访问。\n\n为了理解\
  \ `public` 和 `private` 之间的区别，下面的程序创建了 `TestData`，其中 `a` 为 `public`，`b` 为 `protected`，而\
  \ `c` 为 `private`：\n\n```java\nclass TestData {\n    public int a;\n    protected\
  \ int b;\n    private int c;\n\n    void setc(int value) {\n        c = value;\n\
  \    }\n    int getc() {\n        return c;\n    }\n}\n\nclass AccessTest {\n  \
  \  public static void main(String args[]) {\n        TestData obj = new TestData();\n\
  \        obj.a = 10; // OK\n        // obj.b = 20; // 错误：b 受保护访问限制\n        // obj.c\
  \ = 30; // 错误：c 是私有访问\n        System.out.println(\"a: \" + obj.a);\n    }\n}\n\
  ```\n\n下表列出了访问修饰符：\n\n| 访问修饰符 | 类 | 包 | 子类 | 世界 |\n| :--- | :---: | :---: | :---:\
  \ | :---: |\n| `public` | 是 | 是 | 是 | 是 |\n| `protected` | 是 | 是 | 是 | 否 |\n| `default`\
  \ | 是 | 是 | 否 | 否 |\n| `private` | 是 | 否 | 否 | 否 |\n\n\n\n\n如果我们有多个同名但参数不同的方法，根据它们的参数来实现不同的功能，这种概念被称为\
  \ `method overloading`（方法重载）。Java 根据方法的名称、参数类型和数量来调用特定的方法来实现该功能。这个过程被称为 `polymorphism`（多态）——*poly*\
  \ 意味着许多，*morphism* 意味着形式。同样的概念也适用于构造函数，因为我们可以拥有默认构造函数和带参数构造函数，以不同的方式初始化对象。当调用重载方法时，Java\
  \ 使用参数的类型和/或数量作为通道，来决定本质上调用哪个版本的重载方法。因此，重载方法的参数在类型和/或数量上必须不同。虽然重载方法可能有不同的返回类型，但仅凭返回类型不足以区分两个版本的方法。当\
  \ Java 遇到对重载方法的调用时，它基本上会执行参数与调用时使用的参数匹配的方法版本。下面的示例说明了构造函数重载和方法重载的使用。\n\n```\npublic\
  \ class Overloading_Demo {\n    public int a, b;\n\n    Overloading_Demo() {\n \
  \       a=0;\n        b=0;\n    }\n\n    Overloading_Demo(int x,int y) {\n     \
  \   a=x;\n        b=y;\n    }\n\n    void show() {\n        System.out.println(\"\
  Show Method with No Arguments\");\n    }\n\n    void show(int a) {\n        System.out.println(\"\
  Show Method with One Argument\");\n    }\n\n    void show(int a, int b) {\n    \
  \    System.out.println(\"Show Method with Two Arguments\");\n    }\n\n    public\
  \ static void main(String[] args) {\n        Overloading_Demo obj1 = new Overloading_Demo();\n\
  \        Overloading_Demo obj2 = new Overloading_Demo(2,5);\n        obj1.show();\n\
  \        obj1.show(1);\n        obj1.show(1,2);\n    }\n}\n```\n\n我们将得到以下输出：\n\n\
  `Show Method with No Arguments`\n\n`Show Method with One Argument`\n\n`Show Method\
  \ with Two Arguments`\n\n方法重载的一个更实用的示例是根据参数访问不同的方法。例如，在下面的程序中，`display()` 函数被带有一个和两个参数重载。这两个函数分别通过一个和两个参数被调用：\n\
  \n```\npackage book;\nclass Exam {\n    int roll;\n    String name;\n    Exam()\
  \ {}\n    Exam(int a, String s) {\n        roll=a;\n        name=s;\n    }\n\n \
  \   void display(int x) {\n        System.out.print(roll);\n    }\n\n    void display(int\
  \ x, int y) {\n        System.out.print(roll + \" \" + name);\n    }\n}\n\nclass\
  \ Result extends Exam {\n    int marks;\n    Result() {}\n    Result(int a, String\
  \ s, int m) {\n        super(a,s);\n        marks = m;\n    }\n\n    void display()\
  \ {\n        super.display(1);\n        super.display(1,2);\n        System.out.println(\"\
  \ \" +marks );\n    }\n\n    static void sort(Result a[], int n) {\n        Result\
  \ temp = new Result();\n        for(int i=0;i<n;i++) {\n            for(int j=(i+1);j<n;j++)\
