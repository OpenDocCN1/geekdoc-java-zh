  \n在下面的 Java 程序中，探索了 `java.util` 包中的 `Arrays` 类。`Arrays` 类在处理数组时非常有用。`Arrays` 类中的如\
  \ `sort` 和 `binarySearch` 等方法在此程序中使用：\n\n```java\npackage book;\nimport java.util.*;\n\
  public class UtilDemo {\n  public static void main(String args[]) {\n    int array[]\
  \ = new int[10];\n    for(int i = 0; i < 10; i++)\n      array[i] = 5 * i;\n   \
  \ System.out.print(\"Original contents: \");\n    display(array);\n    Arrays.sort(array);\n\
  \    System.out.print(\"Sorted: \");\n    display(array);\n    Arrays.fill(array,\
  \ 2, 4, 3);\n    System.out.print(\"After fill(): \");\n    display(array);\n  \
  \  Arrays.sort(array);\n    System.out.print(\"After sorting again: \");\n    display(array);\n\
  \    System.out.print(\"The value 25 is at location \");\n    int index = Arrays.binarySearch(array,\
  \ 25);\n    System.out.println(index);\n  }\n  static void display(int array[])\
  \ {\n    for(int i: array)\n      System.out.print(i + \" \");\n    System.out.println();\n\
  \  }\n}\n```\n\n我们将得到以下输出：\n\n`Original contents: 0 5 10 15 20 25 30 35 40 45`\n\
  `Sorted: 0 5 10 15 20 25 30 35 40 45`\n`After fill(): 0 5 3 3 20 25 30 35 40 45`\n\
  `After sorting again: 0 3 3 5 20 25 30 35 40 45`\n`The value 25 is at location 5`\n\
  \n在这个 Java 程序中，最重要的类之一是名为 `Calendar` 的类：\n\n```java\npackage book;\nimport java.util;\n\
  public class UtilExample {\n  public static void main(String args[]) {\n    String\
  \ months[] = {\"January\", \"February\", \"March\", \"April\", \"May\", \"June\"\
  , \"July\", \"August\", \"September\", \"November\", \"December\"};\n    Calendar\
  \ calendar = Calendar.getInstance();\n    System.out.print(\"Date: \");\n    System.out.println(months[calendar.get(Calendar.MONTH_OF_YEAR)]\
  \ + \")\");\n    System.out.print(\"Time: \");\n    System.out.println(calendar.get(Calendar.HOUR_OF_DAY)\
  \ + \":\" + calendar.get(Calendar.MINUTE) + \":\" + calendar.get(Calendar.SECOND));\n\
  \    System.out.print(\"Updated time: \");\n    System.out.println(calendar.get(Calendar.HOUR_OF_DAY)\
  \ + \":\" + calendar.get(Calendar.MINUTE) + \":\" + calendar.get(Calendar.SECOND));\n\
  \  }\n}\n```\n\n我们将得到输出：\n\n`Date: October 22`\n`Time: 9:12:58`\n`Updated time:\
  \ 10:29:22`\n\n### java.awt\n\nAWT 类封装在 `java.awt` 包中。它是 Java 最大的包之一。`awt` 包的一些类如下：\n\
