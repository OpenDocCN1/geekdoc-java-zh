  \ > 50) {\n        Statement 1;\n    } else {\n        Statement 2;\n    }\n}\n\
  ```\n\n#### switch 语句\n\n`if` 语句使得从多种情况中选择变得复杂，而 `switch` 语句允许根据值从多种选项中选择。`switch`\
  \ 语句的通用结构如下：\n\n```java\nswitch (Expression) {\n    case value1:\n        Statement\
  \ 1;\n        break;\n    case value2:\n        Statement 2;\n        break;\n \
  \   case valueN:\n        Statement N;\n        break;\n    default:\n        Statement\
  \ 1;\n}\n```\n\n下面的程序演示了 `switch` 语句的使用。用户被给予选择，根据其选择执行相应的 case：\n\n```java\nimport\
  \ java.util.Scanner;\npublic class SwitchExample {\n    public static void main(String[]\
