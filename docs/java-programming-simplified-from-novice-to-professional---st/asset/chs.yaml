  \ 编写一个 Java 程序，在处理数组时处理两个嵌套异常。\n\n# 第 7 章\n\n## Java 中的多线程\n\n## 结构\n\n- 引言\n- 创建线程\n\
  - 线程的生命周期\n- 线程优先级\n- 线程同步\n- 线程间通信\n- 练习\n\n## 目标\n\nJava 流行的原因之一是多线程。解释线程生命周期是为了在\
  \ Java 中编写多线程程序。本章还阐述了线程间通信。\n\n## 引言\n\n多线程是 Java 语言的强大工具之一，使其与其他编程语言区别开来且更加高效。多线程是一种概念性编程范式，程序被分为两个或多个子程序，这些子程序可以并行实现。在操作系统的术语中，程序被称为进程（process），因此多个子进程正在同时执行。多线程的主要优势是程序员可以同时执行多个任务，例如，一个子程序可以在屏幕上显示动画，而另一个子程序可以从大型数据库中获取数据。这种多任务处理允许程序员给人们一种一切都在同时运行的印象。通常情况下，Java\
  \ 程序是从上到下执行的，例如下面的程序：\n\n```java\npackage book;\npublic class Mult_Threading {\n\
  \    public static void main(String[] args) {\n        System.out.println(\"Beginning\
  \ of The Program\");\n        for(int i=0;i<10;i++) {\n            System.out.println(\"\
  Body of The Program\");\n        }\n        System.out.println(\"End of The Program\"\
  );\n    }\n}\n```\n\n上述程序的输出如预期所示：\n\n**Beginning of The Program**\n**Body of The\
  \ Program**\n**Body of The Program**\n**Body of The Program**\n**Body of The Program**\n\
  **Body of The Program**\n**Body of The Program**\n**Body of The Program**\n**Body\
  \ of The Program**\n**Body of The Program**\n**Body of The Program**\n**End of The\
  \ Program**\n\n在多线程中，同一个程序被分为多个线程，输出可能是随机的，因为多个进程将同时执行。重要的一点是理解，只有一个处理器在执行多个线程，这并不意味着它们实际上是同时执行的，而是执行在一个进程和另一个进程之间切换，从而产生了所有都在同时执行的印象。控制权的切换是由\
  \ Java 解释器完成的。如果我们有一个作为主线程的主方法以及另外三个线程，那么切换过程描述如图所示：\n\n![](img/7-1.jpg)\n\n**图\
  \ 7.1:** 多线程\n\n### 创建线程\n\n可以使用以下两种方法在 Java 中创建线程。\n\n通过扩展 `Thread` 类并重写 `run()`\
  \ 方法。如果我们想将任何类实现为线程，就必须继承内置的 `Thread` 类。`Thread` 类位于 `java.lang` 包中，我们不需要导入它，因为这是默认包。`Thread`\
  \ 类有一个 `run()` 方法，该方法必须在派生类中重新定义，并包含我们想要作为线程执行的所有代码。因此程序段的实例如下：\n\n```java\nclass\
  \ MyThread extends Thread {\n    public void run() {\n        for(int i=0;i<10;i++)\
  \ {\n            System.out.println(\" From MyThread i = \" + i);\n        }\n \
  \   }\n}\n```\n\n现在我们想要执行上述线程，必须像下面从主线程执行：\n\n```java\nMyThread ta = new MyThread();\n\
  ta.start();\n```\n\n在调用 `Thread` 类的 `start` 方法后，线程并不一定会立即运行，因为它可能忙于其他线程，并且可能将其置于可运行状态（runnable\
  \ state）：\n\n`Thread` 类有许多方法可以与 `Thread` 类对象一起使用。例如，如果我们希望这个线程在 `i = 2` 的时候停止，我们可以写：\n\
  \n```java\nif (i==2)\n    ta.stop();\n```\n\n`Thread` 类定义了几个帮助管理线程的方法。\n\n| 方法 |\
  \ 含义 |\n| :--- | :--- |\n| `getName` | 获取线程名称。 |\n| `getPriority` | 获取线程的优先级。 |\n\
  | `isAlive` | 确定线程仍在运行。 |\n| `join` | 等待线程终止。 |\n| `run` | 线程的入口点。 |\n| `sleep`\
  \ | 挂起线程一段时间。 |\n| `start` | 通过调用 `run` 方法启动线程。 |\n\n以下示例说明了在实现多线程时 `Thread` 类的用法。在多线程中，同一个程序被分为多个线程，由于多个进程将同时执行，输出可以是随机的。我们可以看到线程的输出是不可预测的。\n\
  \n```java\npackage threadingca;\nclass A extends Thread {\n    public void run()\
  \ {\n        for(int i=0;i<10;i++) {\n            System.out.println(\"From A i\
  \ =\" + i);\n        }\n    }\n}\nclass B extends Thread {\n    public void run()\
