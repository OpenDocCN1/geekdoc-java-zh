  \n![](img/10-6.jpg)\n\n**图 10.6**\n\n![](img/10-7.jpg)\n\n**图 10.7**\n\n在 Java 程序中，创建了一个\
  \ applet 并为其注册了 `MouseListener` 和 `MouseMotionListener`。这两个监听器的所有方法都已实现，并使用 applet\
  \ 的 `paint ( )` 方法在事件触发时显示消息：\n\n```java\npackage book;\nimport java.awt.event.*;\n\
  import java.applet.*;\nimport java.awt.*;\n\n/*\n<applet code=\"MouseEvents\" width=300\
  \ height=100></applet>\n*/\npublic class EventHandlingDemo extends Applet implements\
  \ MouseListener, MouseMotionListener {\n    String msg = \"\";\n    int mouseX =\
  \ 0, mouseY = 0; // coordinates of mouse\n\n    public void init() {\n        addMouseListener(this);\n\
  \        addMouseMotionListener(this);\n        setBackground(Color.RED);\n    }\n\
  \n    // 处理鼠标点击.\n    public void mouseClicked(MouseEvent me) {\n        mouseX\
  \ = 100; mouseY = 100;\n        msg = \"Mouse clicked.\"; repaint();\n    }\n\n\
  \    // 处理鼠标进入.\n    public void mouseEntered(MouseEvent me) {\n        mouseX =\
  \ 0; mouseY = 10;\n        msg = \"Mouse entered.\"; repaint();\n    }\n\n    //\
  \ 处理鼠标移出.\n    public void mouseExited(MouseEvent me) {\n        mouseX = 0; mouseY\
  \ = 10;\n        msg = \"Mouse exited.\"; repaint();\n    }\n\n    // 处理鼠标按下.\n\
  \    public void mousePressed(MouseEvent me) {\n        mouseX = me.getX(); mouseY\
  \ = me.getY();\n        msg = \"Mouse Down Here\"; repaint();\n    }\n\n    public\
  \ void mouseReleased(MouseEvent me) {\n        mouseX = me.getX(); mouseY = me.getY();\n\
  \        msg = \"Mouse Up Here\"; repaint();\n    }\n\n    // 处理鼠标拖动.\n    public\
  \ void mouseDragged(MouseEvent me) {\n        mouseX = me.getX(); mouseY = me.getY();\n\
  \        msg = \"*\";\n    }\n\n    // 处理移动.\n    public void mouseMoved(MouseEvent\
  \ me) {\n        mouseX = me.getX(); mouseY = me.getY();\n        msg = \"The X\
  \ & Y Position of \" + mouseX + \", \" + mouseY;\n        repaint();\n    }\n\n\
  \    public void paint(Graphics g) {\n        g.drawString(msg, mouseX, mouseY);\n\
  \    }\n}\n```\n\n\n\n\n### 匿名内部类\n\nJava 的一个独特特性是名为 `Adapter`（适配器）类，它在某些情况下可以让事件处理器的构建变得更加简单。`Adapter`\
  \ 类提供了事件监听器接口中所有方法的空实现。当我们只想获取并处理由特定事件监听器接口处理的少数几个事件时，`Adapter` 类就非常有帮助。我们可以通过扩展其中一个适配器类并仅实现我们感兴趣的事件，来命名一个新类作为事件监听器。例如，如果我们想实现\
  \ `MouseListener` 接口，就必须实现它所有的方法，即 `void mouseClicked(MouseEvent me)`、`void mouseEntered(MouseEvent\
  \ me)`、`void mouseExited(MouseEvent me)`、`void mousePressed(MouseEvent me)` 和 `void\
  \ mouseReleased(MouseEvent me)`。但在所有五个方法中，我们只想实现 `mouseClicked()` 方法来处理点击事件。我们可以创建一个名为\
  \ `MyMouseAdapter` 的类，扩展 `MouseAdapter` 并重写 `mouseClicked()` 方法。其他的鼠标事件将由继承自 `MouseAdapter`\
  \ 类的代码静地忽略。下表列出了用于实现 `Listener` 接口的 `Adapter` 类：\n\n| 适配器类 | 监听器接口 |\n| :--- | :---\
  \ |\n| `ComponentAdapter` | `ComponentListener` |\n| `ContainerAdapter` | `ContainerListener`\
  \ |\n| `FocusAdapter` | `FocusListener` |\n| `KeyAdapter` | `KeyListener` |\n| `MouseAdapter`\
  \ | `MouseListener` |\n| `MouseMotionAdapter` | `MouseMotionListener` |\n| `WindowAdapter`\
  \ | `WindowListener` |\n\n**表 10.5:** 适配器类\n\n在下面的 Java 程序中演示了 `Adapter` 类的使用。`AdapterClass`\
  \ 类使用了并扩展了 `MouseAdapter`。在 `MouseListener` 的五个方法中，只实现了 `mouseClicked()` 方法：\n\n\
  ```java\npackage book;\n\nimport java.awt.*;\nimport java.awt.event.MouseAdapter;\n\
