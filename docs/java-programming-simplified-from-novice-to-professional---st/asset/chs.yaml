  \ 编程基础 (#toc.xhtml_c02)\n\n### 简介 (#toc.xhtml_s17a)\n\n与大多数编程语言一样，Java 中的组件并不是孤立工作的，而是相互依赖的，以形成一个有意义的语言。对\
  \ Java 语言的理解取决于几个概念，主要是面向对象的概念。Java 的语法源自 C，面向对象的特性源自 C++。\n\n因此，对于一个具有 C 和 C++\
  \ 知识的程序员来说，更有机会理解 Java 并使用该平台开发一些优秀的应用程序。本章从 Java 程序的结构开始，向程序员解释 Java 程序的不同部分。某些部分是可选的，可以根据程序员的需要而使用。在本章中，将编译基础程序并解释\
  \ JDK 的工作原理。本单元中解释了数据类型和关键字等基本结构。控制结构是任何编程语言的基本构建块；这些结构将进行详细解释，以帮助初学者编写一些基础程序。\n\
  \n# 结构 (#toc.xhtml_s18a)\n\n*   简介\n*   Java 程序的结构\n*   一个简单的 Java 程序\n*   执行程序\n\
  *   Java 中的数据类型、变量和关键字\n*   Java 中的控制结构\n*   命令行参数\n*   在 Java 中创建基础程序\n*   作业\n\
  \n# 目标 (#toc.xhtml_s19a)\n\n本章解释了 Java 程序的基本结构。阅读本章后，读者应该能够编写一些基础程序并处理命令行参数。\n\n\
  # Java 程序的结构 (#toc.xhtml_s20a)\n\nJava 程序有不同的部分来处理不同的功能。某些部分是强制性的，例如包含 main 方法的类（class），而大多数部分是可选的，例如导入包，因为这取决于程序员是否需要使用任何包。Java\
  \ 程序的不同部分将在其他章节中详细解释，本章仅给出 Java 程序的整体结构。\n\nJava 程序的不同部分如下：\n\n*   **文档部分（Documentation\
  \ section）：** 此部分是可选的，可能包含在注释中对程序的详细描述。与 C 语言一样，注释可以是单行的 `//` 或是块状的 `/* */`。例如，以下几行描述了任何\
  \ Java 程序的详细信息：\n\n    `/* 该 Java 程序从命令行获取一个数字，并检查该数字是否为质数 */`\n\n*   **包部分（Package\
  \ section）：** 此部分是可选的，该部分的唯一目的是将你的类包含在任何包中。由程序员决定包含包名还是留空。编写包名的语法为：\n\n    `package\
  \ nielit;`\n\n    因此，我们将创建的程序类将在 `nielit` 包内。\n\n*   **导入部分（Import section）：** 此部分是可选的，可用于导入任何现有的包（内置或用户定义）。导入任何包的语法为：\n\
  \n    `import java.io.*; // 导入输入输出包中的所有类`\n    `import java.awt.Button; // 仅导入 awt\
  \ 包中的 Button 类`\n    `import nielit.*; // 导入程序员创建的 nielit 包中的所有类`\n\n*   **接口部分（Interface\
  \ section）：** 此部分是可选的，包含用于实现多继承的接口。接口包括抽象类和最终数据（将在第 4 章：包与接口中解释）。接口的示例为：\n\n   \
  \ `interface MyInterface`\n    `{`\n    `void display();`\n    `void show();`\n\
  \    `final int data=100;`\n    `}`\n\n*   **类定义部分（Class definitions section）：**\
  \ 由于 Java 程序可能包含多个类，此部分包含了这些类的定义。此部分也是可选的，因为我们可能只有一个带有 main 方法的类。例如：\n\n    `//\
  \ 此类是可选的`\n    `class MyClassA`\n    `{`\n    `// 数据 + 方法`\n    `}`\n    `// 此类是强制性的，因为它包含了\
  \ main 方法`\n    `class MyClassB`\n    `{`\n    `// 数据 + 方法`\n    `// main 方法`\n\
  \    `public static void main( String arg[])`\n    `{`\n    `}`\n    `}`\n\n*  \
  \ **带有 main 方法的类（Class with main method）：** 由于 Java 程序的执行从 main 方法开始，此类是强制性的，因为它包含了开始执行的\
  \ main 方法。\n\n    `class MainClassB`\n    `{`\n    `// 数据 + 方法`\n    `// main 方法`\n\
  \    `public static void main( String arg[])`\n    `{`\n    `}`\n    `}`\n\n以下是带有不同部分的示例程序：\n\
  \n![](img/p36.jpg)\n\n唯一的强制部分是包含 main 方法的类。这些部分的详细描述将在其他章节给出。\n\n# 第一个简单的 Java 程序\
  \ (#toc.xhtml_s21a)\n\n我们应该开始编写程序以理解 Java 语言的不同组件：\n\n```java\n/* 这是我们的第一个 Java\
  \ 程序，解释了 Java 的各种元素 */\nclass MyExample {\n    // 这是包含 main 方法的主类\n    public static\
  \ void main (String arg[])\n    {\n        System.out.println (\" 这是我的第一个 Java 程序\"\
  );\n    }// main 方法的结束大括号\n}// 类的结束大括号\n```\n\n这个简单程序的各种组件解释如下：\n\n\n\n\n\n* `class\
  \ MyExample:`: 由于 Java 是一种真正的面向对象的语言，因此必须至少有一个类，该类将包含一个 main 方法。我们示例中的 `MyExample`\
  \ 类是一个用户定义的类，必须遵循 C 语言中标识符命名的所有约定。由于 Java 像 C 一样是大小写敏感的语言，在这里提到类名以大写字母开头，且类名中的所有单词也以大写字母开头。Java\
  \ 中内置类的示例包括：`String`、`Exception`、`ArrayIndexOutOfException` 等等。这就是为什么上述程序中唯一的大写单词是\
  \ `MyExample`、`String` 和 `System` 的原因，因为它们都是类。\n\n* `public:`: Java 中使用 `public`、`private`\
  \ 和 `protected` 等不同的访问修饰符用于数据成员和方法。`main` 方法必须被 Java 的运行时环境访问，因此它必须声明为 `public`。因为\
  \ Java 的默认可见性是包级（friendly），而不是像 C++ 那样的私有（private）。默认访问修饰符限制了对 `main` 方法的访问，因此必须声明为\
  \ `public` 以便所有人访问。后续章节将详细解释这些访问修饰符。\n\n* `static:`: 在面向对象编程（OOP）中，我们创建类的对象来访问其方法，但如果我们想在不创建对象的情况下访问方法怎么办？对于那些可以独立于对象而使用类名的情况，我们使用\
  \ `static` 成员。最重要的例子是声明为 `static` 的 `main()` 方法，其由于它必须在任何对象创建之前被调用。`static` 可以用于方法或数据成员。当一个成员被声明为\
  \ `static` 时，可以在该类的任何对象创建之前被访问，且无需引用任何对象。这些静态数据成员被所有对象共享，并直接通过类名访问。下例在在不创建对象的情况下调用了\
  \ `Integer` 类的 `parseInt` 方法：\n\n```java\nint i = Integer.parseInt(\"20\");\n```\n\
  \n* `void main:`: 像任何其他编程语言一样，`void` 是返回类型，而 `main` 是用于指定 `main` 方法的关键字。\n\n* `System.out.println(\"\
  \"):`: 该语句打印双引号中的消息。使用 `System` 类是因为 Java 中的所有内容都是通过类和对象执行的。`println` 方法显示消息并将光标移到下一行。\n\
  \n### 执行程序\n\n为了理解执行 Java 程序的基本思想，我们将尝试通过命令提示符（Command Prompt）使用记事本查找执行程序的步骤。执行程序需要两个重要的文件：`javac`（编译器）和\
  \ `java`（解释器）。在记事本中运行程序的步骤如下：\n\n1. 打开记事本。\n2. 在记事本编写以下程序：\n\n![](img/2-1.jpg)\n\
  \n**图 2.1:** 带有基础 Java 程序的记事本\n\n3. 如果没有设置路径，请将程序保存到 Java 安装的路径，在我们的案例中路径为：\n\n\
  ![](img/2-2.jpg)\n\n**图 2.2**\n\n4. 现在使用命令编译程序。如果没有错误，将生成带有 `.class` 扩展的字节码文件：\n\
  \n```bash\njavac EvenOdd.java\n```\n\n5. 成功编译程序后，使用以下命令生成输出：\n\n```bash\njava EvenOdd\n\
  ```\n\n### 关键点\n\n关于 Java 程序，记住以下几非常重要：\n\n* **大小写敏感：** Java 是大小写敏感的，这意味着标识符 `Java`\
  \ 和 `java` 在 Java 中具有不同的含义。\n* **类名：** 对于所有类名，首字母应该大写**。如果使用多个单词来组成类名，则每个内部单词的首字母都应该大写。例如，类\
  \ `MyFirstJavaClass`。\n* **方法名：** 所有方法名都应该以小写字母开头。如果使用多个单词来组成方法名，那么每个内部单词的首字母应该大写**。例如，`public\
  \ void myMethodName()`。\n* **文件名：** 程序的文件名必须与类名完全匹配。在保存文件时，您应该使用类名保存并在名称末尾附加 `.java`。例如，假设\
  \ `MyFirstJavaProgram` 是类名，那么文件应该保存为 `MyFirstJavaProgram.java`。\n\n* `public static\
  \ void main(String args[])`: Java 程序的处理从 `main()` 方法开始，这是每个 Java 程序中不可少的一部分。\n\n\
  ### Java 中的数据类型\n\n与其他其他编程语言一样，Java 拥有原始数据类型和非原始数据类型。原始类型可以使用基本的计算机指令进行修改。Java 中可用的\
  \ 8 种原始数据类型是 `byte`、`short`、`int`、`long`、`char`、`float`、`double` 和 `boolean`。它们可以分为四大类：\n\
  \n* **整数：** 这组包括 `byte`、`short`、`int` 和 `long`，用于带符号整数。例如：\n\n```java\nint x,y,z;\n\
  byte s1,s2;\n```\n\n* **浮点数：** 这组包括 `float` 和 `double`，表示具有小数精度的数字。例如：\n\n```java\n\
  float f1;\ndouble var1;\n```\n\n* **字符：** 这组包括 `char`，表示字符集中的符号。例如：\n\n```java\n\
  char ch='A';\n```\n\n* **布尔值：** 这组包括 `boolean`，是一种表示真/假的唯一类型。例如：\n\n```java\nboolean\
  \ b;\n```\n\n原始类型用于创建数组。以下语句创建了 int 数组：\n\n```java\nint a[] = new int[10];\n```\n\
  \n原始类型具有确定的范围。Java 与 C++ 不同之处在于 Java 的移植性；所有数据类型的大小 `int` 是 32 位。\n\n除了原始数据类型，Java\
  \ 还有包装类为处理不同情况提供额外的灵活性。包装类是对应数据类型的类，例如用于 `int` 的 `Integer`，用于 `float` 的 `Float`\
  \ 等。这些类具有许多帮助方法。这些原始类型的位范围如下：\n\n| 名称 | 宽度（位） | 范围 |\n| :--- | :--- | :--- |\n|\
  \ `long` | 64 | –9,223,372,036,854,775,808 到 9,223,372,036,854,775,807 |\n| `int`\
  \ | 32 | –2,147,483,648 到 2,147,483,647 |\n| `short` | 16 | –32,768 到 32,767 |\n\
  | `byte` | 8 | –128 到 127 |\n\n**表 2.1:** 原始类型的范围\n\n| 名称 | 位宽 | 近似范围 |\n| :---\
  \ | :--- | :--- |\n| `Double` | 64 | 4.9e–324 到 1.8e+308 |\n| `Float` | 32 | 1.4e–045\
  \ 到 3.4e+038 |\n\n**表 2.2:** 原始类型的范围\n\n### Java 中的变量\n\n与其他编程语言一样，Java 使用变量，变量是\
