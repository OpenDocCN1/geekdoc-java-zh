  Mareen\", 150);\n        a[4] = new Result(6,\"Sadaf\", 120);\n        System.out.println(\"\
  Before Sorting \");\n        for(int i=0;i<5;i++)\n            a[i].display();\n\
  \        Result.sort(a, 5);\n        System.out.println(\"After Sorting based on\
  \ Marks and Sports marks\");\n        for(int i=0;i<5;i++)\n            a[i].display();\n\
  \    }\n}\n```\n\n我们将得到以下输出：\n\n`Before Sorting`\n\n`22 Maheen 200`\n\n`33 Hina\
  \ 210`\n\n`44 Mehak 100`\n\n`55 Mareen 150`\n\n`66 Sadaf 120`\n\n`After Sorting\
  \ based on Marks and Sports marks`\n\n`22 Maheen 200`\n`33 Hina 210`\n`44 Mehak\
  \ 100`\n`55 Mareen 150`\n`66 Sadaf 120`\n\n\n\n\n### 继承\n\n面向对象编程（OOP）最令人兴奋的特性之一是继承，它可以重用现有代码。如果我们已经编写了很多代码并想要重用，可以简单地将其继承到我们的新类中，这种将基类特征扩展到派生类的过程被称为`inheritance`。要继承一个类，我们只需要使用\
  \ `extends` 关键字将一个类的定义集成到另一个类中。\n\n下面的程序实现了基本的继承。`BaseClass` 定义了数据成员 `da` 和 `db`\
  \ 以及成员函数 `showBase`。现在创建了另一个名为派生类（derived class）的类，它继承自 `BaseClass`，这意味着 `BaseClass`\
  \ 的数据和方法现在供 `DerivedClass` 使用。在 `main` 方法中创建了这两个类的对象，以访问它们各自的成员以及 `BaseClass` 的数据和方法。\n\
  \n```java\npackage book;\n\nclass BaseClass {\n    int da, db;\n    void showBase()\
  \ {\n        System.out.println(\"da = \" + da + \" db = \" + db);\n    }\n}\n\n\
  // 通过扩展类 BaseClass 创建子类。\nclass DerivedClass extends BaseClass {\n    int dc;\n\
  \    void showdc() {\n        System.out.println(\"dc = \" + dc);\n    }\n    void\
  \ showMul() {\n        System.out.println(\"da*db*dc = \" + (da*db*dc));\n    }\n\
  }\n\npublic class InheritanceExample {\n    public static void main(String arg[])\
  \ {\n        BaseClass superObj = new BaseClass();\n        DerivedClass derObj\
  \ = new DerivedClass();\n        superObj.da = 10;\n        superObj.db = 20;\n\
  \        System.out.println(\"Contents of superObj: \");\n        superObj.showBase();\n\
  \        System.out.println();\n        /* 子类可以访问其父类的所有的公共成员。 */\n        derObj.da\
  \ = 7;\n        derObj.db = 8;\n        derObj.dc = 9;\n        System.out.println(\"\
  Contents of subObj: \");\n        derObj.showBase();\n        derObj.showdc();\n\
  \        System.out.println();\n        System.out.println(\"Multiplication of da,\
  \ db and dc in subOb:\");\n        derObj.showMul();\n    }\n}\n```\n\n我们将得到以下输出：\n\
  \n`Contents of superObj:`\n`da = 10 db = 20`\n`Contents of subObj:`\n`da = 7 db\
  \ = 8`\n`dc = 9`\n`Multiplication of da, db and dc in subOb:`\n`da*db*dc = 504`\n\
  \n在上面的示例中，尽管没有使用访问修饰符，且子类包含了其父类的每一个成员，但它无法访问父类中声明为 `private` 的成员。例如，考虑以下这个简单的 Java\
  \ 程序：\n\n下面的程序将无法编译并生成错误，因为无法从声明私有数据的类外部访问该数据：\n\n```java\npackage book;\n\nclass\
  \ FirstClass {\n    int fr_data; // 默认权限\n    private int pr_data; // 私有数据\n   \
  \ void setData(int a, int b)\n    {\n        fr_data = a;\n        pr_data = b;\n\
  \    }\n}\n\nclass SecondClass extends FirstClass {\n    int total;\n    void sum()\
  \ {\n        total = fr_data + pr_data;\n        // 错误，pr_data 不可用\n    }\n}\n\n\
  public class AccessExampleInheritance {\n    public static void main(String args[])\
  \ {\n        SecondClass subOb = new SecondClass();\n        subOb.setData(100,\
  \ 120);\n        subOb.sum();\n        System.out.println(\"Total is \" + subOb.total);\n\
  \    }\n}\n```\n\n上述程序被修改以访问 `FirstClass` 中定义的私有数据。修改后的程序如下：\n\n```java\npackage\
  \ book;\n\nclass FirstClass {\n    int fr_data; // 默认权限\n    private int pr_data;\
  \ // 私有数据\n    void setData(int a, int b)\n    {\n        fr_data = a;\n       \
  \ pr_data = b;\n    }\n    int getPrData()\n    {\n        return pr_data;\n   \
  \ }\n}\n\nclass SecondClass extends FirstClass {\n    int total;\n    void sum()\
  \ {\n        total = fr_data + getPrData();\n        // 错误，pr_data 不可用\n    }\n\
  }\n\nclass AccessExampleInheritance {\n    public static void main(String args[])\
  \ {\n        SecondClass subOb = new SecondClass();\n        subOb.setData(100,\
  \ 120);\n        subOb.sum();\n        System.out.println(\"Total is \" + subOb.total);\n\
  \    }\n}\n```\n\n我们将得到以下输出：\n\n`Total is 220`\n\n与 C++ 和许多其他面向对象的语言一样，Java 以多种形式实现继承，详见下。\n\
  \n#### 单继承\n\n如果我们有一个类 `A` 以及其被继承的类 `B`，我们称类 `A` 为基类，类 `B` 为派生类。这两个类的定义定义如下：\n\n\
  ```java\nclass A {\n    // A 的数据 + 方法\n}\nclass B extends A {\n    // B 的数据 + 方法\n\
  }\n```\n图 3.3: 单继承\n\n#### 层级继承\n\n如图所示，类 `A` 被多个派生类继承。派生类的定义如下：\n\n```java\nclass\
  \ A {\n    // 基类\n}\nclass B extends A {\n    // 派生类 B\n}\nclass C extends A {\n\
  \    // 派生类 C\n}\nclass D extends A {\n    // 派生类 D\n}\n```\n图 3.4: 层级继承\n\n####\
  \ 多级继承\n\n在多级继承的情况下，一个类被另一个类继承，而该类又被另一个类继承。这些类的定义如下：\n\n```java\nclass A {\n   \
  \ // 基类\n}\nclass B extends A {\n    // 类 B\n}\nclass C extends B {\n    // 类 C\n\
  }\n```\n图 3.5: 多级继承\n\n#### 多继承\n\n在 Java 中无法直接实现多继承。这意味着一个类不能被两个类继承。Java 中多继承的选项是通过接口实现的（将在下一节讨论）。现在，这些类的定义如下：\n\
  \n```java\ninterface MyInterface {\n    // 抽象方法和数据\n}\nclass A {\n    // 类 A\n}\n\
  class B implements MyInterface {\n    // 类 B\n}\n```\n图 3.6: 多继承\n\n\n\n\n\n```java\n\
  for(int i=0;i<n;i++)\n{\n  for(int j=(i+1);j<n;j++ )\n  {\n    if(a[i].marks<a[j].marks)\n\
  \    {\n      temp = a[i];\n      a[i]= a[j];\n      a[j]=temp;\n    }\n    }\n\
  \  }\n}\n```\n\n```java\npublic class Student {\n    public static void main(String[]\
  \ args) {\n        Result a[] = new Result[5];\n        a[0] = new Result(2,\"Arshid\"\
  , 200);\n        a[1] = new Result(3,\"Mehvish\", 210);\n        a[2] = new Result(4,\"\
  Mushtaq\", 100);\n        a[3] = new Result(5,\"Feroz\", 150);\n        a[4] = new\
  \ Result(6,\"Sadaf\", 120);\n        System.out.println(\"Before Sorting \");\n\
  \        for(int i=0;i<5;i++)\n            a[i].display();\n        Result.sort(a,\
  \ 5);\n        System.out.println(\"After Sorting based on Marks\");\n        for(int\
  \ i=0;i<5;i++)\n            a[i].display();\n    }\n}\n```\n\n我们将得到以下输出：\n\n**排序前**\n\
  **2 Arshid 200**\n**3 Mehvish 210**\n**4 Mushtaq 100**\n**5 Feroz 150**\n**6 Sadaf\
  \ 120**\n**按分数排序后**\n**3 Mehvish 210**\n**2 Arshid 200**\n**5 Feroz 150**\n**6 Sadaf\
  \ 120**\n**4 Mushtaq 100**\n\n在接下来的 Java 程序中，实现了多级继承。创建了 `Father` 类，它被 `Student1`\
  \ 类继承，随后又被 `Result1` 类进一步继承：\n\n```java\npackage book;\nclass Father\n{\n    String\
  \ f_name;\n    Father()\n    {\n    }\n    Father(String nm)\n    {\n        f_name=nm;\n\
