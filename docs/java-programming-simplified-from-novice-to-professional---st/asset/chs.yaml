  \ `str2`；如果大于零，则调用字符串大于 `str2`。例如，在下面的程序段中，我们可以使用此方法比较两个 `String` 对象：\n\n```\nString\
  \ str1= new String(\"Java\");\nString str2= new String(\"Hello\");\nif (str1.compareTo(str2)>0)\n\
