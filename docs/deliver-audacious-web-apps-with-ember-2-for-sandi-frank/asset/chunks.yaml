    | ​  |  |


    | ​  | actions: { |


    | ​  | close: ​**function**​() { |


    | ​  | this.transitionTo(​*''notebooks.notes''*​); |


    | ​  | } |


    | ​  | } |


    | ​  | }); |


    We’re now ready to start work on our component.


    An Ember component is defined by two files. The first is a Handlebars template,
    which is used to define the user interface of the component. The second is a JavaScript
    class that extends Ember.Component. This is used to define any action-handling
    code that the template needs to perform.


    We’ll call this the edit-note component. As in other areas of Ember, the naming
    convention is important here. A dash in the name of the component is how Ember
    identifies it as a component. To create the necessary files using Ember CLI, run
    the following command at the command prompt:


    | ​  | $ ember generate component edit-note --pod |


    Once again, we use the --pod form of the command, as it provides us with a clean
    project structure. This command creates a directory and two files. The directory
    is named for the component and resides at the following location: ember-note/app/components/edit-note.
    This provides us with a single place to go to look for our component definition.


    Two files were also created in the edit-note directory: template.hbs and component.js.
    The first is meant to hold our Handlebars template, and the second is for our
    component logic.


    We now have a few stub files ready to contain our component. Because we want to
    use it to display a note record, let’s take a look now at how to provide data
    to the component.


    ## Get Data from Containing Templates


    One important distinction between a component and a template/route combination
    is that a component doesn’t have the ability to retrieve its own model. A component
    relies on the calling template to provide it with the information it needs. This
    enables component reuse. By being provided the records it will display, a component
    can be more easily used in a variety of contexts. As long as the records passed
    to it contain the properties it needs, the component will work just fine. Now,
    let’s see how to define the relationship between a standard, routable template
    and a component.


    When we created the new note route, Ember CLI created not only a route.js file,
    but also a template.hbs file. While using the --pod form of ember generate commands
    results in an intuitive project structure, it also results in a raft of files
    with the same name. It’s important to pay attention to your location within the
    directory tree. So, within the newly created note route, modify the template.hbs
    file like this:


    | [ch4/ember-note/app/notebooks/notes/note/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/notebooks/notes/note/template.hbs)
    |


    | ​  | {{edit-note note=model close="close"}} |


    The note template is very terse, as is common with Ember. In this case, the template
    needs to include just a single expression: our newly defined edit-note component.
    We’re setting two properties on this instance of the component. The note=model
    assignment is what we use to pass the current model record from the note route
    into the edit-note component. (We’ll discuss the close="close" assignment in [​*Handle
    Actions*​](#f_0033.html_handling-actions).)


    The note=model assignment sets the note’s model property as the value of the note
    property within the edit-note template. As mentioned earlier, Ember components
    rely on the calling template to set their properties. In this case, we provide
    the entire record because we want the component to be able to save the record.
    If this were not the case, we could also have simply passed in the values we wanted
    to display instead of the entire record.


    Now that the edit-note component has a handle on the note it will display, let’s
    take a look at how to create the component user interface.


    ## Define a Component User Interface


    The process of building a component user interface should be familiar to you.
    For the most part, you use the same set of expressions to build a component interface
    as you do to build a template. The interface is composed using Handlebars expressions
    and HTML, and can access any properties defined by the component initialization
    in the calling template.


    As an example, let’s take a look at the interface for the edit-note template:


    | [ch4/ember-note/app/components/edit-note/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/components/edit-note/template.hbs)
    |


    | ​  | ​**<div>**​ |


    | ​  | {{input value=note.title}} |


    | ​  | ​**<button**​ {{action "saveNote"}}​**>**​save​**</button>**​ |


    | ​  | ​**<button**​ {{action "closeNote"}}​**>**​close​**</button>**​ |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div>**​ |


    | ​  | {{textarea rows=10 cols=60 value=note.body}} |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div>**​ |


    | ​  | {{markdown-to-html markdown=note.body}} |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div>**​ |


    | ​  | {{yield}} |


    | ​  | ​**</div>**​ |


    There’s very little about this template that’s different from one that’s associated
    to a route. We’re accessing the note property, which we set when we added this
    component to the note template. We use the same Handlebars expressions to display
    data: the {{input}}) and textarea expressions. These rely on information stored
    in the note record passed to the component.


