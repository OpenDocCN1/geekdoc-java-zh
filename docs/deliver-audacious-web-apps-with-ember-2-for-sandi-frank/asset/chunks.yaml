    \n版权 © 2015, The Pragmatic Bookshelf.\n\n# 第 2 章\n\n## 使用路由引导流量\n\n现在我们已经安装了 Ember\
    \ 和 Ember CLI，并使用它们创建了一个允许用户注册的程序，我们准备好研究 Ember 的主要功能了。我们将查看第一个功能是 Ember 路由（routes）。正如我在第\
    \ 1 章中提到的，路由的概念是 Ember 背后的核心原则之一。路由是应用程序中单个功能单元的起点。路由的层级结构成了应用程序的组织结构。\n\n路由在\
    \ Ember 中非常、非常重要。幸运的是，它们也是非常好的起点。在本章中，我们将查看如何使用 Ember CLI 使用路由来结构化你的应用程序。你将学习如何使用\
    \ `Router` 类来设置路由层级，以及如何使用 `Route` 类来定义路由。我们还将查看如何使用 Ember 的导航助手在路由之间进行跳转。你将学习\
    \ Ember 如何使用你的应用程序 URL 不仅指示你在应用中的位置，还指示加载到 UI 中的记录。为了帮助你分清 `Router` 和 `Route`，请记住每个应用只有一个\
    \ `Router`，而在该 `Router` 内部，你通过定义其路由来定义应用程序的结构。`Route` 类的实现就是你定义单个路由行为的方式。\n\n\
    为了学习更多关于路由的知识，我们将通过构建应用程序的导航结构，开始组合 EmberNote 的更多功能集。在本章结束时，你将完成 EmberNote 大部分的路由结构，并且你将知道如何编写在路由之间跳转的代码。\n\
    \n### 使用 Router 类组织你的应用程序\n\n在上一章中，我们为 EmberNote 创建了注册路由。正如你可以想象的，Ember 应用程序由许多路由组成，每个路由在应用程序中都是唯一的。合起来，路由构成了应用程序中不同位置的层级结构，暴露了该层级结构中每个位置特有的功能。Ember\
    \ 在单个类（即 `Router` 类）中记录了这种层级结构，如图所示。\n\n![images/router-and-routes.png](img/router-and-routes.png)\n\
    \n由于我们正在使用 Ember CLI 来管理应用程序，因此我们不会经常直接编辑 EmberNote 的 `Router`。大多数时候，我们会允许 Ember\
    \ CLI 为我们完成编辑。\n\n让我们来看这样一个例子。当我们上次处理 EmberNote 时，Router 看起来是这样的：\n\n```javascript\n\
    import Ember from 'ember';\nimport config from './config/environment';\n\nvar\
    \ Router = Ember.Router.map(function() {\n  this.route('register');\n}, {\n  location:\
    \ config.locationType\n});\n\nexport default Router;\n```\n\n在 ember-note 目录下，运行以下命令：\n\
    \n```bash\n$ ember generate route login --pod\n$ ember generate route notebooks\
    \ --pod\n```\n\n运行这些命令后，你应该会在路由中看到两个新行：\n\n```javascript\nthis.route('login');\n\
    this.route('notebooks');\n```\n\n很棒的一点是，Ember CLI 会在你创建时添加新路由，而不会覆盖你对路由的其他更改。Router\
    \ 现在包含了我们生成的两个路由。我们现在将通过构建它们的类来定义 login 和 notebooks 路由。\n\n在整本书中，我们将创建更多路由，并且经常检查\
    \ Router。这是一个值得经常返回的类，有助于我们保持定位并记住应用的整体结构。现在，让我们通过处理登录路由来具体查看如何定义路由。\n\n### 定义你的路由\n\
    \n如提到的，每个路由对应一个给定的 URL。我们在应用程序中定义了四个路由：\n\n*   http://localhost:4200\n*   http://localhost:4200/register\n\
    *   http://localhost:4200/login\n*   http://localhost:4200/notebooks\n\n我们在第一章中定义了\
    \ register，刚刚生成了 login 和 notebook 的类。\n\n你可能想知道我们是如何定义根 URL 的。答案是我们在创建应用程序时定义的。这个路由被称为应用路由，它使用\
    \ Ember 对 `Route` 类的默认实现。我们修改了一个名为 `application.hbs` 的文件。该文件包含了应用路由的模板。\n\n"
- fmt: "\nThis also raises one point about the default Ember structure. Each individual\
    \ route corresponds to exactly one template. For the application route, this is\
    \ the `application.hbs` template. For each of our generated routes, it’s the `template.hbs`\
    \ template as defined in the route’s folder, assuming you’ve used the `--pod`\
    \ flag; otherwise the template is named for the route, and lives in the templates\
    \ folder.\n\n### Creating the Login Route\n\nLet’s create the login route now.\
    \ This route needs to let the user sign into the EmberNote application. It should\
    \ be available from a link on the main page, just like register was, and let previously\
    \ registered users sign in with their usernames. Once they’ve signed in, they\
    \ should be taken to their list of notebooks (the other route we’ve generated\
    \ so far). Further, once they’ve signed in, the register and login links should\
    \ no longer appear.\n\nTo do this, we’re going to make changes to the following\
    \ files:\n\n*   `app/template/application.hbs`: To add navigation to let the user\
    \ load the login route, and to hide navigation to register and login once the\
    \ user has logged in\n*   `app/login/route.js`: To define the login action\n*\
    \   `app/login/template.hbs`: To define the user interface for the login route\n\
    \nTo reach the login route, we need to first make it available via the `application.hbs`\
    \ file. Edit this file so it looks like the following:\n\n| [ch2/ember-note/app/templates/application.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/templates/application.hbs)\
    \ |\n| :--- |\n| <div class=\"container\"> |\n| <div class=\"row\"> |\n| <div\
    \ class=\"col-md-2\"> |\n| Welcome to EmberNote |\n| </div> |\n| <div class=\"\
    col-md-10\"> |\n| {{#if user}} |\n| Hello, {{user.name}} |\n| {{/if}} |\n| {{#unless\
    \ user}} |\n| {{#link-to 'register'}}register{{/link-to}}&nbsp; |\n| {{#link-to\
    \ 'login'}}login{{/link-to}} |\n| {{/unless}} |\n| </div> |\n| </div> |\n| <div\
    \ class=\"row\"> |\n| <div> |\n| {{outlet}} |\n| </div> |\n| </div> |\n| </div>\
    \ |\n\nThe first addition you’ll make to the file is an `{{#if}}` expression.\
    \ The text contained within this expression is only displayed if the expression\
    \ evaluates to true. In this case, if the application controller has a value in\
    \ the `user` attribute, the user’s name is displayed. We’ll see how this attribute\
    \ is set when we look at the login route next.\n\nThe next section, inside the\
    \ `{{#unless}}` expression, is displayed if the `user` attribute is missing. It\
    \ contains the `{{#link-to}}` navigation item for the register route and our new\
    \ login route as well. When users click the link to the login route, they’re taken\
    \ to `localhost:4200/login`. The login template is rendered into the `{{outlet}}`,\
    \ meaning that the content of that template is displayed in the placeholder defined\
    \ by the `{{outlet}}`. The login template, defined in `app/login/template.hbs`,\
    \ looks like this:\n\n| [ch2/ember-note/app/login/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/template.hbs)\
    \ |\n| :--- |\n| <div class=\"col-md-12\"> |\n| Login: <input value=name><button\
    \ action=\"login\">Login</button> |\n| </div> |\n\nThis template, which is the\
    \ single template associated to the login route, has mere elements. The `{{input}}`\
    \ expression results in an HTML input field being displayed and takes its value\
    \ from the `name` attribute. The `{{action}}` expression results in the login\
    \ action being executed in the `Route`, which we define next.\n\nAll of this ties\
    \ together in the login route class, like this:\n\n[ch2/ember-note/app/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/route.js)\n\
    ```javascript\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n\
    \  actions: {\n    login() {\n      this.store.query('user', {\n        name:\
    \ this.controller.get('name')\n      }).then((users) => {\n        if (users.get('length')\
    \ === 1) {\n          var user = users.objectAt(0);\n          this.controllerFor('application').set('user',user);\n\
    \          this.transitionTo('notebooks');\n        } else {\n          console.log('unexpected\
    \ query result');\n        }\n      });\n    }\n  }\n});\n```\n\nAs we saw in\
    \ Chapter 1, this `Route` class uses the ES6 module syntax. The first line of\
    \ the class imports the Ember framework, which is then used when we extend the\
    \ base `Route` class in our class declaration. We’re using an anonymous declaration\
    \ and export of the `Route`. Ember CLI takes the path to the file and uses it\
    \ to conclude that this class, though declared anonymously, represents the login\
    \ route.\n\nThe next block of code defines the `actions` hash, which is a name-value\
    \ pair listing of action names and implementations. Our login route requires only\
    \ one action, the aptly named `login` action.\n\nAs described earlier in this\
    \ chapter, the `login` action verifies that the requested user has properly registered,\
    \ and then displays the list of the user’s notebooks. The next block,\n\n```javascript\n\
    this.store.query('user', {\n  name : this.controller.get('name')\n})\n```\n\n\
    executes a query against our server API using the value of the `name` field from\
    \ `template.hbs` as a query parameter. We’ll update the API next.\n\nFor your\
    \ login route to work, you need to make a small change to the mock server we created.\
    \ Open your `server/mocks/users.js` file and update the `get` endpoint as follows:\n\
    \n| [ch2/ember-note/server/mocks/users.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/server/mocks/users.js)\
    \ |\n| :--- |\n| usersRouter.get('/', function(req, res) { |\n| userDB.find(req.query).exec(function(error,users)\
    \ { |\n| res.send({ |\n| 'users': users |\n| }); |\n| }); |\n| }); |\n```\nEmber\
    \ CLI should have deployed your changes as you made them, but if for some reason\
    \ it hasn’t, you may need to run the `ember serve` command from your `ember-note`\
    \ directory to catch up. Once you have, visit the login route and try logging\
    \ into EmberNote. You should be redirected to the notebooks route.\n\nBecause\
    \ the `store.find` call to the API is asynchronous, it returns a `Promise` object\
    \ to the login route.\n"
