    \ 对象。例如，请看 `ember-validations` 文档中的这段代码：\n\n```javascript\nexport default Ember.Object.extend(EmberValidations.Mixin,{\n\
    \  validations: {\n    firstName: {\n      presence: true,\n      length: { minimum:\
    \ 5 }\n    },\n    age: {\n      numericality: true\n    }\n  }\n});\n```\n\n\
    向对象中添加 `validations` 属性（如你在此处所做）会激活该对象的此插件。你想应用的验证规则将包含在 `validations` 属性中。随后，将对包含的对象进行验证，以确保\
