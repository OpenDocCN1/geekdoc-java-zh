  trans: "\n\n### 使用循环和条件判断控制模板\n\nEmber 提供了许多不同的方法来控制模板中显示的内容。其中一种构造结构是 `{{if}}`\
    \ 表达式。`{{if}}` 表达式根据提供的属性是否为真，或者是否为假、null、未定义（undefined）或 `[]` 来渲染模板的某个部分（或不渲染）。哦，JavaScript\
    \ 的特性。）\n\n要使用 `{{if}}` 表达式，你需要将想要有条件包含的块包裹起来，如下所示：\n\n```handlebars\n{{#if condition}}\n\
    \  <div>HELLO</div>\n{{else}}\n  <div>never mind</div>\n{{/if}}\n```\n\nEmber\
    \ 将这种表达式称为**块表达式（block expression）**，因为一段模板代码块（block code）被该表达式包围。块表达式需要一个开始标签和一个结束标签（例如，`{{#if}}`\
    \ 和 `{{/if}}`）。在这种情况下，如果 `condition` 为真，将渲染“HELLO”；否则将渲染“never mind”。\n\nEmber\
    \ 还允许你将条件链在一起，而不是将它们嵌套在 `{{else}}` 块中。如果你有两个、三个或四十七个需要链在一起的条件，可以这样操作：\n\n```handlebars\n\
    {{#if condition}}\n  <div>HELLO</div>\n{{else if condition2}}\n  <div>never mind</div>\n\
    {{else if condition3}}\n  <div>WAT</div>\n{{else}}\n  <div>go away</div>\n{{/if}}\n\
    ```\n\n你还可以通过使用内联 if（inline if）来简化标准的 `{{if}}` 语法：\n\n```handlebars\n{{if condition\
    \ 'on' 'off'}}\n```\n\n内联条件条件的第二个和第三个参数可以包含属性或字符串，但仅限于此。`{{if}}` 表达式有一个兄弟表达式叫做\
    \ `{{unless}}`。当你只有一种结果需要渲染表达式的主体，且不想通过对条件进行“否定（not）”处理来混淆逻辑时，请使用此表达式，如下：\n\n\
    ```handlebars\n{{#unless hasChrome}}\n  运行此应用需要 Chrome Web 浏览器。\n{{/unless}}\n\
    ```\n\n除非用户拥有 Chrome 浏览器，否则会显示仅使用 Chrome 的警告。`hasChrome` 变量是由底层模型或路由属性提供的值，并不是\
    \ Ember 的标准部分。是的，你也可以使用 `{{if}}`，但这种表达式和属性的组合读起来更清晰。你会注意到我们在 `application.hbs`\
    \ 模板中使用了这些表达式。\n\n在本章的前面，你已经看到过使用 `{{each}}` 遍历项目列表的代码，所以我不再重复它。我只是提醒你，`{{each}}`\
    \ 要求你的控制器引用记录列表作为它的模型。\n\n### 绑定输入字段\n\n到目前为止我们看到的每个表达式都是为了显示静态文本。Ember 的很多强大之处在于它将可编辑字段链接到控制器的能力，因此我们还需要使用输入字段。让我们更新示例以使用输入字段。\n\
    \n首先查看笔记本模板：`ch3/ember-note/app/notebooks/template.hbs`\n\n```handlebars\n{{input\
    \ value=title}}\n<button {{action 'add'}}>Add</button>\n```\n\n像这样一个最小的 `{{input}}`\
    \ 表达式会渲染如下 HTML：\n\n```html\n<input type=\"text\" value=\"Notebook Title\">\n\
    ```\n\n我们没有显式地为输入字段定义类型（type），但 Ember 默认将其设置为 \"text\"。另一个选项是显式设置它，如下：\n\n```handlebars\n\
    {{input type=\"text\" value=title}}\n```\n\n这渲染了等效的 HTML。如果你仔细观察会发现 `type` 属性被设置为带引号的字符串，而\
    \ `value` 被设置为不带引号的字符串。这种区别非常重要。带引号的字符串将按照原样渲染到 HTML 中；而不带引号的字符串将渲染给定控制器属性的值。输入字段还可以设置以下\
    \ HTML 属性：`accept`, `autocomplete`, `autofocus`, `autosave`, `disabled`, `form`,\
    \ `action`, `enctype`, `method`, `novalidate`, `target`, `height`, `inputmode`,\
    \ `max`, `maxlength`, `min`, `multiple`, `name`, `pattern`, `placeholder`, `readonly`,\
    \ `required`, `selectionDirection`, `size`, `spellcheck`, `step`, `value`, `width`。\n\
    \n除了 HTML 属性外，`{{input}}` 表达式支持事件处理器，或者在 Ember 中被称为**动作 (actions)**。你可以从你的 `{{input}}`\
    \ 表达式链接到一个动作，如下：\n\n```handlebars\n{{input type=\"text\" value=name action=\"\
    execute\"}}\n```\n\n在上一个示例中，`value` 属性绑定到底层控制器的一个变量。该值可能是绑定的也可能是未绑定的。如果是绑定的，则不需要引号；如果是未绑定的，你需要在引号内提供要设置\
    \ value 的精确字符串。`action` 属性绑定到 Return 键事件。当按下 Return 时，会调用命名的动作。还可以通过将事件名称设置为动作来绑定许多其他用户事件（例如，`enter=\"\
    actionName\"`）。它们如下：\n\n* `enter`\n* `escape-press`\n* `focus-in`\n* `focus-out`\n\
    * `insert-newline`\n* `key-press`\n\n通过为这些事件中的每一个提供动作，你可以触发控制器或路由中的动作，这些动作可以用于加载数据、执行验证或写入持久化存储。在下一节我们将看到如何将动作分配给\
    \ HTML 元素。`{{input}}` 表达式还可以通过将 `type` 设置为 `checkbox` 来渲染复选框。与文本类型类似，这里有一些可配置属性，`{{input}}`：\n\
    \n* `autofocus`\n* `checked`\n* `disabled`\n* `form`\n* `indeterminate`\n* `name`\n\
    * `tabindex`\n\n这些属性可以绑定到控制器属性，也可以不绑定。\n\n有时你可能想要在输入框中捕获更多的文本。在这种情况下，`{{textarea}}`\
    \ 表达式是可用的。`{{textarea}}` 表达式的工作类似于 `{{input}}` 表达式。它渲染一个类型为 textarea 的控件，其 `value`\
    \ 绑定到模型的属性。\n\n```handlebars\n{{textarea value=property rows=5 cols=40}}\n```\n\
    \n你还可以看到我们设置了一些 HTML 属性：`rows` 和 `cols`。与之前一样，如果设置为属性，它们将取这些属性的值；否则它们将被设置为提供的特定值。总而言之，以下\
    \ HTML 属性也可以用于 `{{textarea}}` 表达式：`autofocus`, `cols`, `disabled`, `form`, `maxlength`,\
    \ `name`, `placeholder`, `readonly`, `required`, `rows`, `selectionDirection`,\
    \ `selectionEnd`, `selectionStart`, `spellcheck`, `tabindex`, `value`, `wrap`。\n\
    \n这些是将属性链接到用户界面的三种最基本的方法之一。你可能认为这很局限，如果这是在 Ember 中创建可复用控件的唯一方法，确实如此。然而，还有另一种方法，我们将在下一章看到它。现在，让我们学习如何在\
    \ Ember 中启用动作处理。\n\n### 将动作绑定到路由\n\n用户界面需要做两件事：显示数据和响应用户输入。我们已经看到了第一种，现在让我们开始第二种。\n\
    \n你的 `Route` 与模板有一有一一的关系，它有一组供模板使用的函数被称为**动作 (actions)**。\n\n正如你预期的，Ember 有一个表达式可以将\
    \ HTML 元素的动作链接到路由：`{{action}}` 表达式。让我们看一个动作的基本示例，来自登录模板：`ch2/ember-note/app/login/template.hbs`\n\
    \n```html\n<div class=\"col-md-12\">\n  登录: {{input value=name}}\n  <button {{action\
    \ 'login'}}>登录</button>\n</div>\n```\n\n"
- fmt: "First, we’ve added an input field, so the `{{action}}` will have something\
    \ to work with. In the route, the action handler takes that value and checks against\
    \ the server to see if the user is valid. The `{{action}}` expression is bound\
    \ to the next control we added: an HTML button that displays the text “Login.”\
    \ Used in this manner, the `{{action}}` expression binds the login action from\
    \ the route to the `onclick` event of the button. The `onclick` event is the default\
    \ for the button, which is why the `{{action}}` expression is bound to this event.\
    \ When the button is clicked, the login action will fire.\n\nWe’ve already seen\
    \ a lot on actions in the previous chapter, so this might be a review for you.\
    \ Let’s now take a look at compiling templates.\n\n## Compile Templates\n\nWhen\
    \ you create a template in your `template.hbs` file, the HTML and expression language\
    \ you add isn’t directly built into a string. Beginning with the 1.10 release\
    \ of Ember, a new template compiler, known as `HTMLBars`, is used to render your\
    \ templates. With this compiler, a virtual DOM is created in your application’s\
    \ generated `ember-note.js` file. So long as you’re using Ember CLI to build your\
    \ application, these details are abstracted away from you.\n\nThis form of compilation\
    \ is important for two reasons. First, a virtual DOM is faster to generate and\
    \ update than a string-based template, because a virtual DOM can be dealt with\
    \ at the level of an individual node (for example, a control on a page), versus\
    \ the entire template being regenerated when a control value changes.\n\nSecond,\
    \ it is this form of compilation that enables Ember to use server-side rendering.\
    \ Using server-side rendering allows the user to experience a faster initial boot\
    \ in the application, rather than seeing an empty UI load and waiting for a round-trip\
    \ to the server to display the app’s initial data. Ember’s server-side rendering\
    \ tool, known as `FastBoot`, is still under development, but promises to expand\
    \ Ember’s capabilities greatly when released.\n\n## Ember Addon: Ember CLI Datepicker\n\
    \nAs you’ve seen, Ember provides a number of basic features for rendering HTML\
    \ fields using built-in template helpers. However, template helpers are a perfect\
    \ use case for an Ember addon, and one such addon is `Ember CLI Datepicker`.\n\
    \n`Ember CLI Datepicker` is an addon that can be used to add a Bootstrap-styled\
    \ datepicker control to your web app with a minimum amount of logic. You add this\
    \ control to your page by adding a single expression, such as the following:\n\
    \n| `{{bootstrap-datepicker placeholder=\"Choose a date\"}}` | This will insert\
    \ a text field into your app that, when clicked, pops up a date picker. Choosing\
    \ a date will add your choice to the text field, allowing your user to quickly\
    \ enter dates.\n\n`Ember CLI Datepicker` is just one of several similar addons\
    \ that you can use to quickly add controls into your app. The site [http://emberobserver.com](http://emberobserver.com)\
    \ is a great starting point to find similar addons beyond this single example.\
    \ We’ll continue to see specific addons throughout the book, and discuss how to\
    \ create your own in Chapter 9, [Building and Using Ember Addons](#f_0060.html_addons).\n\
    \nThe full documentation for `Ember CLI Datepicker` is available at [https://github.com/soulim/ember-cli-bootstrap-datepicker](https://github.com/soulim/ember-cli-bootstrap-datepicker),\
    \ along with a link to a demo of how to use the addon.\n\n## Next Steps\n\nYou\
    \ should now have a good handle on the process of building a user interface with\
    \ Ember and the Handlebars expression language. We saw how templates relate to\
    \ one another, and we talked quite a bit about the close relationship between\
    \ templates and routes and using that relationship to render controls. In the\
    \ next chapter, we’ll look at how to take these concepts and create our own reusable\
    \ controls, known in Ember parlance as components.\n\nCopyright © 2015, The Pragmatic\
    \ Bookshelf.\n\n# Chapter 4: Building In Reuse with Components\n\nThe combination\
    \ of routes and templates is a potent one, and it’s responsible for much of the\
    \ efficiency Ember adds to your development work. But there’s an even more powerful\
    \ feature that we haven’t covered yet: components. In Ember, a component is a\
    \ way of extending HTML by creating reusable elements. Similar to the pairing\
    \ of a route and template, it implements both the user interface and action layer.\
    \ But components are distinct from routes and templates in that the interface\
    \ and action layer aren’t separable, and a component’s scope is isolated to the\
    \ information passed into the component.\n\nA common use case for components is\
    \ when you have a segment of your user interface that you want to reuse in multiple\
    \ places throughout your app. Some examples might be a button, or a menu, or the\
    \ example we’re going to use, a text area with specific logic associated to it.\n\
    \nYou may have realized that so far, `EmberNote` is a bit light on actual notes.\
    \ We’re going to change that now by adding the ability to create notes with real\
    \ content. To do so, we’ll create a new route that relies on a component to drive\
    \ the editing of the note. This component will implement what you’d expect to\
    \ see from an edit feature. You’ll be able to edit the title and the body of a\
    \ note and save that note, or close the component and discard your changes.\n\n\
    For added fun, we’ll include the ability to use Markdown within the body of your\
    \ note. Markdown is a lightweight language used to apply basic HTML formatting\
    \ to plain text. As such, we’ll also need the ability to preview the HTML that\
    \ results from the Markdown process, which we’ll do using an Ember addon that\
    \ we’ll retrieve via Ember CLI.\n\nLet’s see how to make use of components by\
    \ creating this edit feature for Ember.\n\n## Create Components\n\nBecause a component\
    \ makes use of a template to define its UI but is itself added to a containing\
    \ template, the relationship between components and templates can be a bit tricky.\
    \ It helps me to think of `input` as an example. It’s a stand-alone control that\
    \ can be used in a generic template.\n\nBefore we can create our component, we\
    \ need a place for it to live. We’ll create a new route and reference our component\
    \ from that route. Because we’re editing a single note, the most sensible place\
    \ for this route to live is as a child of the notebooks route.\n\nFrom a command\
    \ prompt, run the following Ember CLI command:\n\n```\n$ ember generate route\
    \ notes/note --pod\n```\n\nThis creates an empty stub for the new route. We’ll\
    \ populate this new class in a moment. First, we need to modify the Router implementation\
    \ and the notes template to be able to navigate to our new route.\n\nWhen you\
    \ created the new route, Ember CLI modified the Router class to include this route\
    \ at the appropriate place in the hierarchy. Because we’re going to query Ember\
    \ Data for a record, we’ll need to add a parameter to the route to pass the ID\
    \ of this note to the child route. Open `router.js` and update it to look like:\n\
    \n```javascript\nimport Ember from 'ember';\nimport config from './config/environment';\n\
    \nvar Router = Ember.Router.extend({\n  location: config.locationType\n});\n\n\
    Router.map(function() {\n  this.route('register');\n  this.route('login');\n \
    \ this.route('notebooks', { path: 'notebooks/:user_id' }, function() {\n    this.route('notes',\
    \ { path: 'notes/:notebook_id' }, function() {\n      this.route('note', { path:\
    \ 'note/:note_id' }, function(){});\n    });\n  });\n});\n\nexport default Router;\n\
    ```\n"
  raw: 'First, we’ve added an input field, so the {{action}} will have something to
    work with. In the route, the action handler takes that value and checks against
    the server to see if the user is valid. The {{action}} expression is bound to
    the next control we added: an HTML button that displays the text “Login.” Used
    in this manner, the {{action}} expression binds the login action from the route
    to the onclick event of the button. The onclick event is the default for the button,
    which is why the {{action}} expression is bound to this event. When the button
    is clicked, the login action will fire.


    We’ve already seen a lot on actions in the previous chapter, so this might be
    a review for you. Let’s now take a look at compiling templates.


    ## Compile Templates


    When you create a template in your template.hbs file, the HTML and expression
    language you add isn’t directly built into a string. Beginning with the 1.10 release
    of Ember, a new template compiler, known as HTMLBars, is used to render your templates.
    With this compiler, a virtual DOM is created in your application’s generated ember-note.js
    file. So long as you’re using Ember CLI to build your application, these details
    are abstracted away from you.


    This form of compilation is important for two reasons. First, a virtual DOM is
    faster to generate and update than a string-based template, because a virtual
    DOM can be dealt with at the level of an individual node (for example, a control
    on a page), versus the entire template being regenerated when a control value
    changes.


    Second, it is this form of compilation that enables Ember to use server-side rendering.
    Using server-side rendering allows the user to experience a faster initial boot
    in the application, rather than seeing an empty UI load and waiting for a round-trip
    to the server to display the app’s initial data. Ember’s server-side rendering
    tool, known as FastBoot, is still under development, but promises to expand Ember’s
    capabilities greatly when released.


    Ember Addon: Ember CLI Datepicker


    As you’ve seen, Ember provides a number of basic features for rendering HTML fields
    using built-in template helpers. However, template helpers are a perfect use case
    for an Ember addon, and one such addon is Ember CLI Datepicker.


    Ember CLI Datepicker is an addon that can be used to add a Bootstrap-styled datepicker
    control to your web app with a minimum amount of logic. You add this control to
    your page by adding a single expression, such as the following:


    | ​  | {{bootstrap-datepicker placeholder="Choose a date"}} |


    This will insert a text field into your app that, when clicked, pops up a date
    picker. Choosing a date will add your choice to the text field, allowing your
    user to quickly enter dates.


    Ember CLI Datepicker is just one of several similar addons that you can use to
    quickly add controls into your app. The site [http://emberobserver.com](http://emberobserver.com)
    is a great starting point to find similar addons beyond this single example. We’ll
    continue to see specific addons throughout the book, and discuss how to create
    your own in Chapter 9, [​*Building and Using Ember Addons*​](#f_0060.html_addons).


    The full documentation for Ember CLI Datepicker is available at [https://github.com/soulim/ember-cli-bootstrap-datepicker](https://github.com/soulim/ember-cli-bootstrap-datepicker),
    along with a link to a demo of how to use the addon.


    ## Next Steps


    You should now have a good handle on the process of building a user interface
    with Ember and the Handlebars expression language. We saw how templates relate
    to one another, and we talked quite a bit about the close relationship between
    templates and routes and using that relationship to render controls. In the next
    chapter, we’ll look at how to take these concepts and create our own reusable
    controls, known in Ember parlance as components.


    Copyright © 2015, The Pragmatic Bookshelf.


    # Chapter 4


    Building In Reuse with Components


    The combination of routes and templates is a potent one, and it’s responsible
    for much of the efficiency Ember adds to your development work. But there’s an
    even more powerful feature that we haven’t covered yet: components. In Ember,
    a component is a way of extending HTML by creating reusable elements. Similar
    to the pairing of a route and template, it implements both the user interface
    and action layer. But components are distinct from routes and templates in that
    the interface and action layer aren’t separable, and a component’s scope is isolated
    to the information passed into the component.


    A common use case for components is when you have a segment of your user interface
    that you want to reuse in multiple places throughout your app. Some examples might
    be a button, or a menu, or the example we’re going to use, a text area with specific
    logic associated to it.


    You may have realized that so far, EmberNote is a bit light on actual notes. We’re
    going to change that now by adding the ability to create notes with real content.
    To do so, we’ll create a new route that relies on a component to drive the editing
    of the note. This component will implement what you’d expect to see from an edit
    feature. You’ll be able to edit the title and the body of a note and save that
    note, or close the component and discard your changes.


    For added fun, we’ll include the ability to use Markdown within the body of your
    note. Markdown is a lightweight language used to apply basic HTML formatting to
    plain text. As such, we’ll also need the ability to preview the HTML that results
    from the Markdown process, which we’ll do using an Ember addon that we’ll retrieve
    via Ember CLI.


    Let’s see how to make use of components by creating this new edit feature for
    EmberNote.


    ## Create Components


    Because a component makes use of a template to define its UI but is itself added
    to a containing template, the relationship between components and templates can
    be a bit tricky. It helps me to think of the {{input}} control as an example.
    It’s a stand-alone control that can be used in a generic Ember template. The components
    you’ll define work the same way.


    Before we can create our component, we need a place for it to live. We’ll create
    a new route and reference our new component from that route’s template. Because
    we’re editing a single note at a time, the most sensible place for this route
    to live is as a child of the notebooks/notes route.


    From a command prompt, run the following Ember CLI command:


    | ​  | $ ember generate route notebooks/notes/note --pod |


    This creates an empty stub for the new note route. We’ll populate this new class
    in a moment. First, we need to modify the Router implementation and the notes
    template to be able to navigate to our new route.


    When you created the new route, Ember CLI modified the Router class to include
    this route at the appropriate place in the hierarchy. Because we’re going to query
    Ember Data for a note record, we’ll need to add a parameter to the route to pass
    the ID of this note to the child route. Open router.js and update it to look like
    this:


    | [ch4/ember-note/app/router.js](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/router.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  | ​**import**​ config from ​*''./config/environment''*​; |


    | ​  |  |


    | ​  | ​**var**​ Router = Ember.Router.extend({ |


    | ​  | location: config.locationType |


    | ​  | }); |


    | ​  |  |


    | ​  | Router.map(​**function**​() { |


    | ​  | this.route(​*''register''*​); |


    | ​  | this.route(​*''login''*​); |


    | ​  | this.route(​*''notebooks''*​, { path:​*''notebooks/:user_id''*​}, ​**function**​()
    { |


    | ​  | this.route(​*''notes''*​, { path:​*''notes/:notebook_id''*​}, ​**function**​(){
    |


    | ​  | this.route(​*''note''*​, { path:​*''note/:note_id''*​},​**function**​(){});
    |


    | ​  | }); |


    | ​  | }); |


    | ​  | }); |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Router; |'
