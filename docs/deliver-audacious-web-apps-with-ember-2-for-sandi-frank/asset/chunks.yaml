  trans: "\n\n在处理浏览器端缓存时，你需要意识到其他用户可能修改了缓存数据的情况。存储器（store）不会在每次更改发生时同步更新，因此如果记录可以被他人修改，那么在使用它们时从服务器重新加载记录是一个好主意。为了实现这一点，Ember\
    \ Data 为 `findRecord` 和 `findAll` 提供了 `reload` 标记。例如，如果我们想在加载路由（route）时确保获取共享笔记记录的最新更改，我们可以调用以下代码：\n\
    \n```javascript\nmodel: function(params) {\n  this.store.findRecord(\"note\",\
    \ params.id, { reload:true })\n}\n```\n\n使用 `reload:true` 将始终确保你从服务器获取记录并包含最新的更改。\n\
    \n还有另一种方法可以实现这一点，前提是你已经拥有该记录的句柄（handle）。如果记录已加载到缓存中，`findRecord` 会调用该记录实例的 `reload`\
    \ 方法。如果你已经拥有该记录，可以执行以下操作从服务器刷新该对象：\n\n```javascript\nrecord.reload();\n```\n\n\
    `DS.Store` 同样包含一个方法，可以从服务器拉取特定类型的所有记录，无论缓存状态如何。执行此操作，请调用带有 `reload:true` 的 `findAll`\
    \ 方法：\n\n```javascript\nmodel: function(params) {\n  this.store.findAll(\"note\"\
    , { reload:true });\n}\n```\n\n你可能认为确保拥有最新数据的唯一方法是使用 `reload` 参数。这种说法部分正确，因为 `findRecord`\
    \ 和 `findAll` 方法会返回已缓存在存储器中的记录（如果存在的话）。然而，`DS.Store` 提供了一种方法，可以从存储器中驱逐特定类型的所有记录：\n\
    \n```javascript\nmodel: function(param) {\n  // 在查找我的数据之前，刷新缓存\n  this.store.unloadAll(\"\
    note\");\n  // 现在获取我的记录\n  return this.store.query(\"note\", {notebook: param.notebook_id});\n\
    }\n```\n\n调用 `unloadAll` 将为随后的查询方法提供一个洁净的状态。当你想要对存储器执行具名参数查询（named-parameter queries），同时确保其返回的结果是来自服务器的数据时，这种方法非常有用。\n\
    \n`DS.Store` 拥有许多方法用于处理服务器 API 以及将 API 调用的结果存储在浏览器驻留仓库（repository）中。正如你预期的，它还提供了许多处理加载后这些记录的方法。在下一节中，我们将查看如何使用\
    \ Ember Data 来处理从 API 获取的记录。\n\n## 记录操作\n\n虽然 `DS.Store` 类中的许多方法处理记录列表的加载和缓存，但你的应用通常也会直接与记录操作。有时你会使用存储器，有时你会直接调用记录本身的方法。让我们从一个从存储器调用的方法开始，学习我们如何在\
    \ Ember 应用程序中添加数据。\n\n### 创建记录\n\n为了让用户认为你的应用有用，他们需要能够向持久化存储中添加数据。我们已经在 EmberNote\
    \ 应用中看到了这一点，用户可以在那里添加自己的笔记本和笔记。现在让我们来看看代码。在 `notebooks` 路由中，我们添加了一个让用户添加笔记本的功能：\n\
    \n`ch5/ember-note/app/notebooks/route.js`\n\n```javascript\naddNotebook: function()\
    \ {\n  var notebook = this.store.createRecord('notebook', {\n    title: this.controller.get('title'),\n\
    \    user: this.controllerFor('application').get('user')\n  });\n  notebook.save().then(()\
    \ => {\n    console.log(\"save successful\");\n  }, function() {\n    console.log(\"\
    save failed\");\n  });\n}\n```\n\n笔记本通过 `this.store.createRecord('notebook', {\
    \ ... })` 在存储器中创建。`createRecord` 接受两个参数。第一个参数是你想要创建的模型。第二个参数是键值对列表。键（keys）匹配模型中定义的属性名称。值（values）会被设置。例如，如果我们想创建一个标题为“new\
    \ note”、描述为“description”且属于 ID 12 的笔记，请求看起来如下：\n\n```\nPOST /api/notes\n{note:\
    \ \"new note\", body: \"description\", notebook: \"12\"}\n```\n\n#### 保存记录\n\n\
    需要理解这一点是，调用 `createRecord` 并不会导致写入持久化存储。在调用 `save` 方法之前，该记录仅存在于存储器中。正如示例所示，`save`\
    \ 方法返回一个 `Promise`，它可以解析为成功或失败。在结果对象上的 `then` 方法会在 Promise 解析后被调用。`then` 的第一个参数在\
    \ Promise 成功时执行，第二个参数在失败时执行。\n\n#### 监控请求流量\n\n在你处理这些示例时，关注请求/响应流量是有帮助的。Chrome、Firefox、Safari\
    \ 和 Internet Explorer 都有内置的开发者工具，允许你观察流量。这在进一步研究 Ember Data 时非常有用。\n\n观察发现此请求没有请求参数。我们只是向模型类型的通用\
    \ URL 发送 POST 请求：`/api/notes`。该 URL 的 `POST` 方法保留用于接收专门与创建新记录相关的请求，它不用于更新请求（更新请求使用\
    \ `PUT` 方法）。\n\n现在我们已经了解了如何添加新记录，让我们来看看如何修改现有记录。\n\n### 更新记录\n\n创建记录和更新记录的方法没有太大区别：你对包含要保存数据的记录调用\
    \ `save` 方法。主要的区别在于 Ember Data 如何将操作转换为 HTTP 请求。\n\n当对已存在于持久化存储中的记录调用 `save` 时，这将产生一个指向\
