    \n### 定义模型的字段\n\n与我们创建的每个类一样，我们定义模型是首先运行 Ember CLI 命令来获取该类的存根版本。在 *添加数据服务* 中，我们运行了以下命令来生成\
    \ User 模型类。\n\n```bash\n$ ember generate model user\n```\n\n该类的存根版本没有字段。我们将添加它们，使类看起来像这样：\n\
    \n[ch5/ember-note/app/models/user.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/models/user.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n\
    \  name: DS.attr('string')\n});\n```\n\n使用 Ember Data，你的模型定义非常简单。你的模型有一组字段，你在类中将它们定义为键值对。键（key）是你如何在模板内部引用数据的方式（即\
    \ `user.name`）。\n\n当你定义一个字段时，你有几种选项来定义字段类型。如果你正在添加一个用于存储单值值的字段，你将使用 `DS.attr`。调用此函数会在你的模型中创建一个字段。不带任何参数调用此函数，模型将仅仅接受传递给它的任何数据类型。\n\
    \n或者，你可以给它指定一个类型，称为 Transform（转换），Ember Data 将获取你的 API 提供的原始数据并尝试使其符合你提供的类型。这就是我们的\
    \ user.js 示例所做的。Ember Data 提供了四个可选的默认值：`string`、`number`、`Boolean` 和 `date`。如果需要，你可以定义自己的\
    \ Transform 实现，但我们目前用基础功能即可。\n\n你还可以为你的字段定义一个默认值。例如，如果你对 `DS.attr` 的调用如下所示：\n\n\
    ```javascript\nname: DS.attr('string', {defaultValue: 'Matt'})\n```\n\n如果给定记录没有\
    \ `name` 的值，则将使用值 `Matt`。\n\n### 定义模型关系\n\n与我们创建的每个类一样，模型字段可能包含一个记录，甚至是记录列表，而不是基本数据类型。Ember\
    \ Data 通过两个构造 `hasMany` 和 `belongsTo` 实现了这种可能。为了看到示例，让我们看看 notebook：\n\n[ch5/ember-note/app/models/notebook.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/models/notebook.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n\
    \  title: DS.attr('string'),\n  user: DS.belongsTo('user'),\n  notes: DS.hasMany('note')\n\
    });\n```\n\n`hasMany` 和 `belongsTo` 函数定义了调用类与另一个模型之间的关系。此函数的参数是另一个模型的名称。在 notebook\
    \ 示例中，我们从 `belongsTo` 函数引用用户模型，从 `hasMany` 函数引用笔记模型。从语义上说，这是合理的：笔记本属于一个用户并在许多笔记。\n\
    \n![notebook-relationships.png](img/notebook-relationships.png)\n\n双向遍历模型关系通常是必要的。例如，从笔记的角度来看，你可以包含一个指向笔记本的\
    \ `belongsTo` 关系。而用户也可以包含一个指向笔记本的关系。\n\n当然，模型关系的基数并不总是一对多或多对一。如果你想要一对一关系，只需使用\
    \ `belongsTo` 创建两个关系即可。对于对多关系，双方都应该是 `hasMany`。\n\n现在你已经对如何定义模型类有了更好的理解，你将学习如何填充它们。让我们看看如何从服务器加载数据。\n\
    \n## 从 RESTful 服务加载数据\n\n当使用 Ember 构建应用时，很有可能你的数据来自 RESTful 服务。RESTful 服务使用 HTTP\
    \ 作为数据查询和交付机制。根据 HTTP 请求，它可以被用于向调用逻辑返回数据，或以某种方式修改数据存储。\n\nEmber 项目非常愿意将网络社区的最佳想法适配到\
    \ Ember 框架中，Ember Data 对 RESTful 服务的使用例外。通过简单的声明你的模型类，你就可以使用 `DS.Store` 对象从服务器获取数据，只要\
    \ RESTful 服务暴露了预期的 API。\n\n尽管我们不会深入探讨 RESTful 服务的实现，在本章的剩余部分中，我们会记录 Ember Data\
    \ 创建请求的 URL。在 *使用 Serializers 访问旧 API 中，我们将涵盖如何使用 Ember Data 访问不符合约定的 API。\n\n"
- fmt: "\nAs with many notions in the programming world, there’s some debate over\
    \ what constitutes a RESTful API. (Often this takes the form of “Your API isn’t\
    \ RESTful!” “No, YOUR API isn’t RESTful!”) Leaving all of that aside, let’s talk\
    \ about how RESTful APIs are meant to be used with Ember Data.\n\nGenerally speaking,\
    \ a RESTful service is a means of using a uniform resource identifier to access\
    \ data and execute functions. RESTful services often, but not always, use HTTP\
    \ as a transport protocol. Each unique URI and verb combination defines an action\
    \ and the related record (or set of records) to use when applying that action.\
    \ For example, if you want to get the note record with id 24, you can make a `GET`\
    \ request of `/note/24` and expect to get the current state of the record, if\
    \ it exists.\n\nThe implementation of a RESTful API is beyond the scope of this\
    \ book, with the exception of the mock services we’ve been creating (and don’t\
    \ use these in a production environment, please). You might use any number of\
    \ technologies to implement one, such as Ruby on Rails, Node.js, Java, or .NET.\
    \ The choice is yours.\n\nOnce you’ve defined a model class, you’ll want to be\
    \ able to load data from that class’s API endpoint. Before you can do that, your\
    \ app will need to declare an instance of the `DS.RESTAdapter` class. Let’s look\
    \ at the one we declared for the EmberNote project:\n\n```javascript\n// ch5/ember-note/app/adapters/application.js\n\
    import DS from 'ember-data';\n\nexport default DS.RESTAdapter.extend({\n  namespace:\
    \ 'api'\n});\n```\n\nThis adapter is as terse as it gets. The single function\
    \ of this implementation of `RESTAdapter` is to identify the API’s root URL. In\
    \ general, an adapter is able to be responsible for much more than this, but we’ll\
    \ start with a simple one for now and cover adapters in greater detail in [*Adapt\
    \ to a Nonconventional API*].\n\nWith this adapter in place, we’re ready to begin\
    \ querying the API for records.\n\n### Querying the API\n\nWhen we first began\
    \ working with Ember Data, we used it to display a list of notebooks that the\
    \ logged-on user owned. As you can see from our definition, each notebook record\
    \ belongs to one user:\n\n```javascript\n// ch5/ember-note/app/models/notebook.js\n\
    import DS from 'ember-data';\n\nexport default DS.Model.extend({\n  title: DS.attr('string'),\n\
    \  user: DS.belongsTo('user'),\n  notes: DS.hasMany('note')\n});\n```\n\nGiven\
    \ that model, we used the `model` hook of the notebooks route to load data from\
    \ the API:\n\n```javascript\n// ch5/ember-note/app/notebooks/route.js\nimport\
    \ Ember from 'ember';\n\nexport default Ember.Route.extend({\n  model(params)\
    \ {\n    return this.store.query('notebook',{user: params.user_id});\n  },\n \
    \ actions: {\n    addNotebook() {\n      var notebook = this.store.createRecord('notebook',\
    \ {\n        title: this.controller.get('title'),\n        user: this.controller.for('application').get('user')\n\
    \      });\n      notebook.save().then(() => {\n        console.log('save successful');\n\
    \        this.controller.set('title',null);\n        this.refresh();\n      },\
    \ function() {\n        console.log('save failed');\n      });\n    }\n  }\n});\n\
    ```\n\nAs you’ll recall from [Set Your Model], the `model` hook is used to obtain\
    \ the data that will be displayed for a given route. We use the `this.store` object\
    \ to find data within the route. The store object is an instance of `DS.Store`,\
    \ which is the client-side data store. The `find` function typically takes two\
    \ parameters. The first is the class name for the data type that the `find` function\
    \ will return. The second is a list of parameters to query against. If this list\
    \ is blank, all records of that type should be returned by the API. In our case,\
    \ we provide the ID of the currently logged-in user, so all notebooks will belong\
    \ to that user. This list of parameters can contain multiple values, and if it\
    \ does, the API is expected to return all records that match each of the criteria.\n\
    \nIf you don’t know the ID of a record you want to load, you can write queries\
    \ using the contents of other fields. That’s the query form we’re using in `route.js`,\
    \ when we call `this.store.query('notebook',{user: params.user_id})` to find the\
    \ notebooks that belong to a certain user. The user’s ID is a known piece of information\
    \ about the notebook, but it doesn’t uniquely identify the notebook. However,\
    \ if you do know the record’s ID, like in our edit-note example from the previous\
    \ chapter, then there’s another form of the `find` function you can use:\n\n```javascript\n\
    model(params) {\n  return this.store.findRecord(\"note\",params.id);\n}\n```\n\
    \nThe biggest difference is that in this form, we’re not defining which field\
    \ to search. Ember Data assumes that we’re searching the `id` field of the given\
    \ record. If you want to load all records, you simply call `findAll` with no parameters,\
    \ like this:\n\n```javascript\nthis.store.findAll(\"note\");\n```\n\nThe different\
    \ forms of querying your API result in slightly different HTTP requests to your\
    \ back end. The query form creates a `GET` request to your API that uses URL query\
    \ parameters to communicate the query to the back end. For example, `this.store.query(\"\
    notebook\", { user: 1})` will result in this request: `GET \"/api/notebooks?user=1\"\
    `. The id-based form also creates a `GET` request. For example, `this.store.findRecord(\"\
    note\",1)` results in `GET \"api/note/1\"`.\n\nThese URLs are the default URLs\
    \ generated by Ember Data. However, if your server API doesn’t match what Ember\
    \ Data generates, you don’t need to change your server. In [*Allow the Adapter\
    \ to Query a Nonconventional API*], we’ll see how to use Ember Data to alter the\
    \ URLs it queries against to match an existing API. This is one of the many ways\
    \ Ember Data makes it easy to consume a RESTful API. Another is browser-based\
    \ caching, which we’ll look at now.\n\n### Using the Store\n\nIf all the `DS.Store`\
    \ object did to proxy access to a RESTful API, it would still be useful. But it\
    \ also provides a browser-based cache of the data loaded since your user’s session\
    \ began. Once a record is loaded by a user via the `find` methods described in\
    \ the previous section, that record resides in the cache, providing faster access\
    \ to it.\n\nWe’ve worked with the `store` variable already to find records, but\
    \ we haven’t really discussed what it is. The store is your primary resource for\
    \ interacting with RESTful APIs. In addition to providing the `find` methods,\
    \ it caches the data returned by those methods and provides methods for working\
    \ with the cached data. It also provides methods for modifying records, as we’ll\
    \ see later in this chapter. An instance of `DS.Store`, as represented by the\
    \ `store` variable, is available in every instance of `Ember.Route`.\n\nEmber\
    \ Data provides a variety of methods for working with data once it has been loaded\
    \ into the store. To begin with, if you want to get all records of a certain type\
    \ that are already in the store, it provides the `peekAll` method:\n\n```javascript\n\
    var allNotes = this.store.peekAll(\"note\");\n```\n\nThis method returns an array\
    \ of all note records that are currently in the store. Whenever you call a query\
    \ method of any of the varieties described earlier, the results are loaded into\
    \ the store and available throughout the app.\n"
