  trans: "\nEmber 和 Ember CLI 在开发期间提供了两种向你的应用提供数据的方法：固定件（fixtures）和模拟服务（mock services）。虽然固定件的设置更简单，但模拟服务要求你实现访问\
    \ RESTful 服务所需的所有内容，从而让你能够更完整地测试代码。因此，我们在本书中使用模拟服务。如果你更关注的是对核心 Ember 类的测试，并且不担心数据访问层的测试，那么你可以考虑使用固定件，它们本质上是带有硬编码数据和简单访问方法的类。\n\
    \n事实上，我们比模拟服务还更进了一步：我们的服务将在重启后持久化数据，这样在我们构建应用时，我们还能看到数据的累积。Ember CLI 创建的默认模拟服务并不具备这一点，尽管在正常情况下开发应用时这种行为可能更好，但我更希望我们的数据在服务重启后依然存在，以便我们在处理示例时能够维护测试数据。现在，让我们看看模拟服务是如何工作的。\n\
    \n## 创建模型\n\n我们首先为用户对象创建一个模型类。目前，我们的用户包含一个数据属性：名称。让我们使用 Ember CLI 生成一个存根类。\n\n\
    ```\n$ ember generate model user\n```\n\n这里是该类，并添加了实现细节：\n\n[ch1/ember-note/app/models/user.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/models/user.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n\
    \  name: DS.attr('string')\n});\n```\n\n该类依赖 Ember Data 库来创建一个 Model 实例，其中有一个名为\
    \ `name` 的属性。该属性的类型为字符串，意味着它将存储文本。仅此而已。这就是我们建模用户对象所需的所有。现在，为了与计划创建的服务交互，我们需要一个\
    \ `RESTAdapter` 和一个 `RESTSerializer`。\n\n##创建适配器序列化器\n\n要创建 `RESTAdapter`，运行以下命令：\n\
    \n```bash\n$ ember generate adapter application\n```\n\n这创建了一个整个应用程序使用的 `RESTAdapter`，这就是为什么我们将其命名为\
    \ `application`。现在，编辑生成的文件使其如下所示：\n\n[ch1/ember-note/app/adapters/application.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/adapters/application.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.RESTAdapter.extend({\n\
    \  namespace: 'api'\n});\n```\n\n同样，要创建 `RESTSerializer`，运行此命令：\n\n```bash\n$\
    \ ember generate serializer application\n```\n\n生成的类看起来如下：\n\n[ch1/ember-note/app/serializers/application.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/serializers/application.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.RESTSerializer.extend({});\n\
    ```\n\n`RESTAdapter` 只有一个目的：定义服务器上的路径，我们可以在该路径找到我们的 RESTful 服务。`RESTSerializer`\
    \ 是一个空实现，因为我们正在使用默认功能。由于我们要创建一个为每个模型对象暴露预期 API 的服务，这就是我们需要做的的所有工作。关于这些更多内容，我们将在\
    \ 适配非传统 API 和 使用序列化器访问遗留 API 中看到。\n\n通常情况下，这里就是你 Ember 开发的终点。创建一个提供数据的服务通常不属于你使用\
    \ Ember 的范畴，因为 Ember 是一个前端框架，而不是用于开发 REST 服务的。正如我之前提到的，我们正在创建一个应用可以用于测试的模拟服务，然后通过使数据持久化来更进了一步。\n\
    \n## 使数据持久化\n\n为了让我们的数据持久化，我们需要能够做到两件目前还无法做的事情。首先，我们需要一个存放数据的地方。为此，我们将使用 NEDB\
    \ 项目，它是一个用于 Node 的嵌入式数据存储。这是用于开发数据库（如我们的）的一个很棒工具。对于生产环境数据库，你可能需要更健壮的工具。在 `ember-note`\
    \ 目录下运行以下命令（`--save-dev` 标志使其成为开发依赖，而不是生产环境依赖）：\n\n```bash\n$ npm install nedb\
    \ --save-dev\n```\n\n这使得 NEDB 项目可用。当 Ember Data store 在注册路由中保存新用户记录时，它将通过 HTTP\
    \ 向我们的模拟服务 POST 数据。因此，我们还需要能够解析传入的 HTTP 请求体。获取以下库来实现此操作：\n\n```bash\n$ npm install\
    \ body-parser --save-dev\n```\n\n现在我们准备好通过运行以下命令创建我们的模拟服务了：\n\n```bash\n$ ember\
    \ generate http-mock\n```\n\n服务创建完成后，我们只需要添加几行代码来使用刚刚添加的库，并响应请求。查看下面的代码，它使数据持久化到\
    \ NEDB：\n\n```javascript\nmodule.exports = function(app) {\n  var express = require('express');\n\
    \  var usersRouter = express.Router();\n\n  // 在此服务中使用 body-parser\n  var bodyParser\
    \ = require('body-parser');\n  app.use(bodyParser.json());\n\n  // 如果不存在则创建一个嵌入式数据库\n\
    \  var nedb = require('nedb');\n  var userDB = new nedb({ filename: 'users', autoload:\
    \ true});\n\n  // POST 用于创建记录\n  userRouter.post('/', function(req, res) {\n \
    \   // 查找最近创建的记录并设置请求的 id 字段\n    // 这是 Ember 需要的\n    userDB.find({}).sort({id:\
    \ -1}).limit(1).exec(function(err, users) {\n      if (users.length != 0)\n  \
    \      req.body.id = users[0].id + 1;\n      else\n        req.body.id = 1;\n\n\
    \      // 将新记录插入数据库，并将新创建的记录返回 Ember\n      userDB.insert(req.body, function(err,\
    \ newUser) {\n        res.status(201);\n        res.send(JSON.stringify({\n  \
    \        user: newUser\n        }));\n      });\n    });\n  });\n\n  // 目前我们不触碰其余代码，这些是由\
    \ Ember 创建的\n  userRouter.get('/', function(req, res) {\n    res.send({\n    \
    \  users: []\n    });\n  });\n\n  userRouter.get('/:id', function(req, res) {\n\
    \    res.send({\n      users: {\n        id: req.params.id\n      }\n    });\n\
    \  });\n\n  userRouter.put('/:id', function(req, res) {\n  });\n\n  userRouter.delete('/:id',\
    \ function(req, res) {\n    res.status(204).end();\n  });\n\n  app.use('/api/users',\
    \ usersRouter);\n};\n```\n\n现在，我们准备好尝试我们的注册功能了。如果它还没有运行，进入命令行并运行以下命令启动应用（如果已经在运行，你可能需要按\
    \ Ctrl-C 停止，重新启动）：\n\n```bash\n$ ember serve\n```\n\n然后导航到 localhost:4200，点击注册链接，提供用户名并点击\
    \ Add。你会看到一条显示用户已添加的消息，如下。\n\n![images/new-user.png](img/new-user.png)\n\n如果你想验证，可以查看\
    \ `ember-note` 目录下的 `users` 文件。你应该看到类似这样的内容：\n\n"
- fmt: "\n| ​  | {\"name\":\"newuser1@pragprog.com\",\"id\":1,\"_id\":\"8EszAw3RuDxYCIBh\"\
    } | |\n\nIf that’s something like what you’re seeing, congratulations! You’ve\
    \ completed your first step in learning Ember. Have a drink, take a walk, or just\
    \ relax how you see fit.\n\n### Ember Addon: Ember CLI Mirage\n\nYou can see that\
    \ we jumped through a few hoops to get a back end working with Ember CLI. Ember\
    \ CLI’s HTTP Mocks are a great way to serve up data using a mock server, but I\
    \ want to mention one other alternative called `Ember CLI Mirage`.\n\n`Ember CLI\
    \ Mirage` is an Ember addon that accomplishes many of the same goals as Ember\
    \ CLI’s HTTP Mocks, but does so entirely client-side (that is, without requiring\
    \ you to stand up a Node server to serve mock data). An Ember addon is a packaged\
    \ piece of code that a community member has shared and published to a repository,\
    \ generally `npm`, for use by the broader community.\n\n`Ember CLI Mirage` allows\
    \ you to create mock data services that run in your browser or in your continuous\
    \ integration environment. This enables your test classes to test your model layer\
    \ without requiring an existing back-end server, even a mock one.\n\nThroughout\
    \ the book I’ll mention Ember addons that are worth looking into. Often these\
    \ will represent an alternative way of performing a task we discussed in the book,\
    \ or a more mature way of performing a task we performed in a simple way. I make\
    \ no claims as to whether or not these addons are production-grade. At a minimum,\
    \ they should be useful for helping you to further explore the Ember ecosystem\
    \ and to use as a tool for additional learning, as all are open source. We’ll\
    \ cover addons in their own chapter in Chapter 9, [Building and Using Ember Addons](#f_0060.html_addons).\n\
    \nFor the complete documentation on how to use `Ember CLI Mirage`, take a look\
    \ at [http://www.ember-cli-mirage.com](http://www.ember-cli-mirage.com).\n\n##\
    \ Next Steps\n\nWe covered a large number of ideas in this first chapter. You’ve\
    \ seen a small example of each of the major classes in Ember and written a sample\
    \ application that makes use of a data-aware service. Still, there’s a lot more\
    \ to Ember than what we’ve covered, and you have a lot left to learn before we’re\
    \ done. Our next step is to begin to build the user interface, first by digging\
    \ deeper into routes.\n\n#### Footnotes\n\n| [[3]](#f_0012.html_FNPTR-3) | [http://nodejs.org](http://nodejs.org)\
    \ |\n| [[4]](#f_0012.html_FNPTR-4) | [https://npmjs.com](https://npmjs.com) |\n\
    | [[5]](#f_0012.html_FNPTR-5) | [http://git-scm.com/downloads](http://git-scm.com/downloads)\
    \ |\n| [[6]](#f_0013.html_FNPTR-6) | [https://evernote.com](https://evernote.com)\
    \ |\n\nCopyright © 2015, The Pragmatic Bookshelf.\n\n# Chapter 2\n\n## Directing\
    \ Traffic with Routes\n\nNow that we’ve installed Ember and Ember CLI and used\
    \ them to create an app that lets users register, we’re ready to dig into the\
    \ major features of Ember. The first feature we’ll look at is Ember routes. As\
    \ I mentioned in Chapter 1, the idea of the route is one of the core principles\
    \ behind Ember. A route is the starting point for a single unit of your app’s\
    \ functionality. The hierarchy of routes makes up the organizational structure\
    \ of your app.\n\nRoutes are really, really important in Ember. Fortunately, they\
    \ are also a really good place to start. In this chapter we’ll look at how to\
    \ use Ember CLI to structure your application using routes. You’ll learn how to\
    \ use the `Router` class to set up your route hierarchy, and how to use the `Route`\
    \ class to define a route. We’ll also look at how to move between routes using\
    \ Ember’s navigation helpers. And you’ll learn how Ember uses your app URL to\
    \ indicate not just your location in the app, but the records loaded into the\
    \ UI. To help you keep `Router` and `Route` straight, remember that each app has\
    \ only one `Router`, and within that `Router` you define the structure of your\
    \ app by defining its routes. A `Route` class implementation is how you define\
    \ the behavior of a single route.\n\nTo learn more about routes, we’ll begin to\
    \ piece together more of EmberNote’s feature set by building the app’s navigational\
    \ structure. By the end of this chapter you’ll have completed the majority of\
    \ the route structure of EmberNote, and you’ll know how to write the code to navigate\
    \ between routes.\n\n### Use the Router Class to Organize Your App\n\nIn the previous\
    \ chapter we created the register route for EmberNote. As you can imagine, Ember\
    \ applications are made up of many routes, each one unique within the application.\
    \ Taken together, the routes form a hierarchy of distinct locations in the application,\
    \ exposing each of the features unique to that place in the hierarchy. Ember keeps\
    \ a record of this hierarchy in a single class, the `Router` class, as shown in\
    \ the following figure.\n\n![images/router-and-routes.png](images/router-and-routes.png)\n\
    \nBecause we’re using Ember CLI to manage our app, we won’t directly edit EmberNote’s\
    \ `Router` all that often. Most of the time we’ll allow Ember CLI to do the editing\
    \ for us.\n\nLet’s look at one such example. When we last worked on EmberNote,\
    \ this is what the Router looked like:\n\n```javascript\nimport Ember from 'ember';\n\
    import config from './config/environment';\n\nvar Router = Ember.Router.map(function()\
    \ {\n  this.route('register');\n}, {\n  location: config.locationType\n});\n\n\
    export default Router;\n```\n\nFrom within your ember-note directory, run the\
    \ following commands:\n\n```bash\n$ ember generate route login --pod\n$ ember\
    \ generate route notebooks --pod\n```\n\nHaving run these commands, you should\
    \ see two new lines in your router:\n\n```javascript\nthis.route('login');\nthis.route('notebooks');\n\
    ```\n\nThe great thing is, Ember CLI will add in new routes as you create them,\
    \ without wiping out existing changes to your router. The Router now contains\
    \ the two routes we generated via Ember CLI. We’ll now be able to define both\
    \ the login and notebooks routes by building their classes.\n\nWe’ll create more\
    \ routes throughout the book, and we’ll often check back in on the Router. It’s\
    \ a good class to come back periodically, to help us stay anchored and keep the\
    \ overall app structure in mind. Right now, let’s take a look at how to define\
    \ a route by working through the login route.\n\n### Define Your Routes\n\nAs\
    \ noted previously, each route corresponds to a given URL. We defined four routes\
    \ in our application with:\n\n*   http://localhost:4200\n*   http://localhost:4200/register\n\
    *   http://localhost:4200/login\n*   http://localhost:4200/notebooks\n\nWe defined\
    \ register in the first chapter, and we generated the classes for login and notebook\
    \ just now. The names and paths of these routes correspond to the definitions\
    \ in `router.js`.\n\nYou may be wondering when we defined the root URL. The answer\
    \ is that we defined it when we created the application. This route, known as\
    \ the application route, uses Ember’s default implementation of the `Route` class.\
    \ We modified a file called `application.hbs` in the first chapter. This file\
    \ contains the template for the application route.\n"
