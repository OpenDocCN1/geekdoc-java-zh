  trans: "\n\n与编程世界中的许多概念一样，对于什么才是 RESTful API 也存在一些争议。（通常表现为：“你的 API 不是 RESTful 的！”“不，是你的\
    \ API 不是 RESTful 的！”）抛开这些不谈，让我们来聊如何在 Ember Data 中使用 RESTful API。\n\n通而言之，RESTful\
    \ 服务是一种使用统一资源标识符（URI）访问数据并执行函数的方法。RESTful 服务通常（但并非总是）使用 HTTP 作为传输协议。每个唯一的 URI\
    \ 和动词（verb）组合都定义了一个操作以及应用该操作时使用的相关记录（或记录集）。例如，如果你想获取 id 为 24 的笔记记录，你可以对 `/note/24`\
    \ 发起 `GET` 请求，并期望在该记录存在的情况下获取该记录当前的状态。\n\nRESTful API 的实现超出了本书的范围，我们一直在创建的模拟服务（mock\
    \ services）除外（请在生产环境中使用它们）。你可以使用任何数量的技术来实现它，例如 Ruby on Rails、Node.js、Java 或 .NET。选择权在于你。\n\
    \n一旦定义了模型类（model class），你将希望能够从该类的 API 端点加载数据。在此之前，你的应用需要声明一个 `DS.RESTAdapter`\
    \ 类的实例。让我们看看我们为 EmberNote 项目定义的那一个：\n\n```javascript\n// ch5/ember-note/app/adapters/application.js\n\
    import DS from 'ember-data';\n\nexport default DS.RESTAdapter.extend({\n  namespace:\
    \ 'api'\n});\n```\n\n这个适配器已经极其精简了。这个 `RESTAdapter` 实现的唯一功能是识别 API 的根 URL。通常情况下，适配器可以负责比这多得多，但我们现在先从一个简单的开始，并在\
    \ *适配非传统 API* 中更详细地介绍适配器。\n\n准备好这个适配器后，我们就可以开始查询 API 记录了。\n\n### 查询 API\n\n当我们第一次开始使用\
    \ Ember Data 时，我们用它来显示登录用户拥有的笔记本列表。从我们的定义中可以看出，每个笔记本记录都属于一个用户：\n\n```javascript\n\
    // ch5/ember-note/app/models/notebook.js\nimport DS from 'ember-data';\n\nexport\
    \ default DS.Model.extend({\n  title: DS.attr('string'),\n  user: DS.belongsTo('user'),\n\
    \  notes: DS.hasMany('note')\n});\n```\n\n给定该模型，我们使用笔记本路由的 `model` 钩子从 API 加载数据：\n\
    \n```javascript\n// ch5/ember-note/app/notebooks/route.js\nimport Ember from 'ember';\n\
    \nexport default Ember.Route.extend({\n  model(params) {\n    return this.store.query('notebook',{user:\
    \ params.user_id});\n  },\n  actions: {\n    addNotebook() {\n      var notebook\
    \ = this.store.createRecord('notebook', {\n        title: this.controller.get('title'),\n\
    \        user: this.controller.for('application').get('user')\n      });\n   \
    \   notebook.save().then(() => {\n        console.log('save successful');\n  \
    \      this.controller.set('title',null);\n        this.refresh();\n      }, function()\
    \ {\n        console.log('save failed');\n      });\n    }\n  }\n});\n```\n\n\
    正如你从 设置你的模型 中记得的，`model` 钩子用于获取将显示给特定路由的数据。我们使用 `this.store` 对象在路由内查找数据。`store`\
    \ 对象是 `DS.Store` 的实例，它是客户端数据存储。`find` 函数通常接受两个参数。第一个是 `find` 函数将返回的数据类型的类名。第二个是用于查询的参数列表。如果此列表为空，API\
    \ 应该返回该类型的所有记录。在我们的情况下，我们提供了当前登录用户的 ID，因此所有笔记本都将属于该用户。这个参数列表可以包含多个值，如果是这样，API\
    \ 预计返回匹配每项标准的所有记录。\n\n如果你不知道想要加载的记录的 ID，你可以使用其他字段的内容编写查询。这就是我们在 `route.js` 中使用的查询形式，当我们调用\
    \ `this.store.query('notebook',{user: params.user_id})` 来查找属于某个用户的笔记本时。用户的 ID\
    \ 是关于笔记本的一条已知信息，但它不能唯一标识笔记本。然而，如果你确实知道记录的 ID，就像我们在上一章的编辑笔记示例中那样，那么还有另一种形式的 `find`\
    \ 函数可以使用：\n\n```javascript\nmodel(params) {\n  return this.store.findRecord(\"\
    note\",params.id);\n}\n```\n\n最大的区别在于，在这种形式下，我们没有定义要搜索哪个字段。Ember Data 假设我们正在搜索给定记录的\
    \ `id` 字段。如果你想加载所有记录，只需不带参数调用 `findAll`，如下：\n\n```javascript\nthis.store.findAll(\"\
    note\");\n```\n\n查询 API 结果的不同形式会导致向后端发送略不同的 HTTP 请求。查询形式会对你的 API 创建一个 `GET` 请求，使用\
    \ URL 查询参数向后端通信查询。例如，`this.store.query(\"notebook\", { user: 1})` 将产生此请求：`GET\
    \ \"/api/notebooks?user=1\"`。基于 ID 的形式也会创建一个 `GET` 请求。例如，`this.store.findRecord(\"\
    note\",1)` 产生 `GET \"api/note/1\"`。\n\n URL 是 Ember Data 生成的默认 URL。然而，如果你的服务器\
    \ API 与 Ember Data 生成的不匹配，你不需要更改服务器。在 *允许适配器查询非传统 API* 中，我们将看到如何使用 Ember Data\
    \ 更改其查询的 URL 以匹配现有的 API。这是 Ember Data 轻松消费 RESTful API 的许多方法之一。另一种是基于浏览器的缓存，我们现在来看。\n\
    \n### 使用 Store\n\n如果 `DS.Store` 对象唯一的作用是代理对 RESTful API 的访问，它仍然是有用的。但它还提供了一个自你的用户会话开始以来加载数据的浏览器级缓存。一旦用户通过上一节描述的\
    \ `find` 方法加载了记录，该记录就会存在于缓存中，从而提供更快的访问速度。\n\n我们已经使用 `store` 变量来查找记录，但我们还没有真正讨论它是什么。store\
    \ 是与 RESTful API 交互的主要资源。除了提供 `find` 方法外，它还缓存这些方法返回的数据，并提供处理缓存数据的方法。它还提供了修改记录的方法，正如我们在本章后面部分将看到的。`DS.Store`\
    \ 的实例（由变量 `store` 表示）适用于每个 `Ember.Route` 实例。\n\nEmber Data 提供了多种处理数据的方法。首先，如果你想获取\
    \ store 中已有的特定类型的所有记录，它提供了 `peekAll` 方法：\n\n```javascript\nvar allNotes = this.store.peekAll(\"\
    note\");\n```\n\n该方法返回当前 store 中所有笔记记录的数组。每当你调用之前描述的任何形式的查询方法时，结果都会加载到 store 中并在整个应用可用。\n\
    \n"
- fmt: "\nWhen working with a browser-side cache, you’ll need to be aware of scenarios\
    \ when other users may have modified cached data. The store isn’t kept up to date\
    \ with each change as it occurs, so it’s a good idea to reload records from the\
    \ server when you need to use them, if they are able to be modified by others.\
    \ To do this, Ember Data provides the `reload` flag for `findRecord` and `findAll`.\
    \ For example, if we want to make sure we have the most recent changes to a shared\
    \ note record when we load our route, we would call the following:\n\n```javascript\n\
    model: function(params) {\n  this.store.findRecord(\"note\", params.id, { reload:true\
    \ })\n}\n```\n\nUsing `reload:true` will always ensure that you get the record\
    \ from the server and include the most recent changes.\n\nThere’s a second way\
    \ to accomplish this, assuming you have a handle on the record. If a record has\
    \ already been loaded in the cache, `findRecord` calls the `reload` method on\
    \ the record instance. If you already have the record, you can do the following\
    \ to refresh this object from the server:\n\n```javascript\nrecord.reload();\n\
    ```\n\n`DS.Store` also contains a method to pull all records of a given type from\
    \ the server, regardless of cache state. To do this, call the `findAll` method\
    \ with `reload:true`:\n\n```javascript\nmodel: function(params) {\n  this.store.findAll(\"\
    note\", { reload:true });\n}\n```\n\nYou may be thinking that the only way to\
    \ guarantee you have the most recent data is to use the `reload` parameter. This\
    \ is partially true, because the `findRecord` and `findAll` methods will return\
    \ records already cached in the store, if any exist. However, `DS.Store` provides\
    \ a way to evict all records of a given type from the store:\n\n```javascript\n\
    model: function(param) {\n  // Before looking for my data, flush the cache\n \
    \ this.store.unloadAll(\"note\");\n  // Now get my records\n  return this.store.query(\"\
    note\", {notebook: param.notebook_id});\n}\n```\n\nCalling `unloadAll` will result\
    \ in a clean slate for the following query method to work with. This is useful\
    \ when you want to be able to execute named-parameter queries against the store,\
    \ while making sure that the results it returns are the most recent data from\
    \ the server.\n\n`DS.Store` has a number of methods for working with server APIs\
    \ and for storing results of API calls in a browser-resident repository. As you’d\
    \ expect, it also provides a number of ways of dealing with those records once\
    \ they’ve been loaded. In the next section we’ll look at how to use Ember Data\
    \ to use the records we get from the API.\n\n## Work with Records\n\nWhile many\
    \ of the methods in the `DS.Store` class deal with loading and caching lists of\
    \ records, your app will also often work with records directly. Sometimes you’ll\
    \ use the store, and sometimes you’ll call methods on the record itself. Let’s\
    \ start with one that we call from the store, and learn how we can add data with\
    \ the Ember app.\n\n### Creating Records\n\nFor users to find your app useful,\
    \ they need to be able to add data to persistent storage. We’ve seen this already\
    \ in the EmberNote application, where users add their own notebooks and notes.\
    \ Let’s take a look at that code now. In the notebooks route, we added a feature\
    \ that let users add a notebook:\n\n`ch5/ember-note/app/notebooks/route.js`\n\n\
    ```javascript\naddNotebook: function() {\n  var notebook = this.store.createRecord('notebook',\
    \ {\n    title: this.controller.get('title'),\n    user: this.controllerFor('application').get('user')\n\
    \  });\n  notebook.save().then(() => {\n    console.log(\"save successful\");\n\
    \  }, function() {\n    console.log(\"save failed\");\n  });\n}\n```\n\nThe notebook\
    \ is created in the store by `this.store.createRecord('notebook', { ... })`. `createRecord`\
    \ takes two parameters. The first parameter is the model you want to create. The\
    \ second parameter is a list of key-value pairs. The keys match the names of attributes\
    \ defined in the model. The values are set. For example, if we wanted to create\
    \ a note with a title of “new note,” a description of “description,” and belonging\
    \ to 12, the request would look something like:\n\n```\nPOST /api/notes\n{note:\
    \ \"new note\", body: \"description\", notebook: \"12\"}\n```\n\n#### Saving Records\n\
    \nIt’s important to realize that calling `createRecord` does not result in writing\
    \ to persistent storage. This record lives only in the store until the `save`\
    \ method is called. As the examples demonstrate, the `save` method returns a `Promise`,\
    \ which can resolve to success or failure. The `then` method on the resulting\
    \ object is called once the Promise has resolved. The first argument to `then`\
    \ is executed when the Promise succeeds, and the second when it does.\n\n####\
    \ Monitoring Request Traffic\n\nAs you’re working through these examples, it can\
    \ be helpful to keep an eye on the request/response traffic. Chrome, Firefox,\
    \ Safari, and Internet Explorer all have built-in developer tools that allow you\
    \ to observe the traffic. This is very useful in investigating Ember Data further.\n\
    \nObserve there are no request parameters for this request. We’re simply POSTing\
    \ to a generic URL for the model type: `/api/notes`. The `POST` method for this\
    \ URL is reserved for receiving requests that relate exclusively to the creation\
    \ of new records, and it’s not used for update requests, which use the `PUT` method.\n\
    \nNow that we’ve seen how to add new records, let’s look at how to modify existing\
    \ records.\n\n### Updating Records\n\nThere’s not much difference between how\
    \ you create a record and how you update one: you call the `save` method on a\
    \ record that has the data you want to save. The big difference comes in how Ember\
    \ Data translates the action into an HTTP request.\n\nWhen a `save` is called\
    \ on a record that already exists in persistent storage, this results in an `PUT`\
    \ request to the API. For example, in the edit-note route, we used the following\
    \ action to save:\n\n`ch4/ember-note/app/components/edit-note/component.js`\n\n\
    ```javascript\nimport Ember from 'ember';\n\nexport default Ember.Component.extend({\n\
    \  actions: {\n    saveNote: function() {\n      this.get('note').save();\n  \
    \  },\n    closeNote: function() {\n      this.sendAction('close');\n    }\n \
    \ }\n});\n```\n\nThe note record, when saved, results in an HTTP request that\
    \ looks something like this:\n\n```\nPUT \"/api/notes/12\"\n{note: {title: \"\
    edited note\", body: \"edited description\", notebook: \"12\"}}\n```\n"
  raw: 'When working with a browser-side cache, you’ll need to be aware of scenarios
    when other users may have modified cached data. The store isn’t kept up to date
    with each change as it occurs, so it’s a good idea to reload records from the
    server when you need to use them, if they are able to be modified by others. To
    do this, Ember Data provides the reload flag for findRecord and findAll. For example,
    if we want to make sure we have the most recent changes to a shared note record
    when we load our route, we would call the following:


    | ​  | model: ​**function**​(params) { |


    | ​  | this.store.findRecord(​*"note"*​,params.id,{ reload:true }) |


    | ​  | } |


    Using reload:true will always ensure that you get the record from the server and
    include the most recent changes.


    There’s a second way to accomplish this, assuming you have a handle on the record.
    If a record has already been loaded in the cache, findRecord calls the reload
    method on the record instance. If you already have the record, you can do the
    following to refresh this object from the server:


    | ​  | record.reload(); |


    DS.Store also contains a method to pull all records of a given type from the server,
    regardless of cache state. To do this, call the findAll method with reload:true:


    | ​  | model: ​**function**​(params) { |


    | ​  | this.store.findAll(​*"note"*​,{ reload:true }); |


    | ​  | } |


    You may be thinking that the only way to guarantee you have the most recent data
    is to use the reload parameter. This is partially true, because the findRecord
    and findAll methods will return records already cached in the store, if any exist.
    However, DS.Store provides a way to evict all records of a given type from the
    store:


    | ​  | model: ​**function**​(param) { |


    | ​  | ​*// Before looking for my data, flush the cache*​ |


    | ​  | this.store.unloadAll(​*"note"*​); |


    | ​  | ​*// Now get my records*​ |


    | ​  | ​**return**​ this.store.query(​*"note"*​,{notebook: param.notebook_id});
    |


    | ​  | } |


    Calling unloadAll will result in a clean slate for the following query method
    to work with. This is useful when you want to be able to execute named-parameter
    queries against the store, while making sure that the results it returns are the
    most recent data from the server.


    DS.Store has a number of methods for working with server APIs and for storing
    results of API calls in a browser-resident repository. As you’d expect, it also
    provides a number of ways of dealing with those records once they’ve been loaded.
    In the next section we’ll look at how to use Ember Data to use the records we
    get from the API.


    ## Work with Records


    While many of the methods in the DS.Store class deal with loading and caching
    lists of records, your app will also often work with records directly. Sometimes
    you’ll use the store, and sometimes you’ll call methods on the record itself.
    Let’s start with one that we call from the store, and learn how we can add data
    with the Ember app.


    ### Creating Records


    For users to find your app useful, they need to be able to add data to persistent
    storage. We’ve seen this already in the EmberNote application, where users add
    their own notebooks and notes. Let’s take a look at that code now. In the notebooks
    route, we added a feature that let users add a notebook:


    | [ch5/ember-note/app/notebooks/route.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/notebooks/route.js)
    |


    | ​  | addNotebook: ​**function**​() { |


    | ​  | ​**var**​ notebook = this.store.createRecord(​*''notebook''*​, { |


    | ​  | title: this.controller.get(​*''title''*​), |


    | ​  | user: this.controllerFor(​*''application''*​).get(​*''user''*​) |


    | ​  | }); |


    | ​  | notebook.save().then(() => { |


    | ​  | console.log(​*''save successful''*​); |


    | ​  | this.controller.set(​*''title''*​,null); |


    | ​  | this.refresh(); |


    | ​  | }, ​**function**​() { |


    | ​  | console.log(​*''save failed''*​); |


    | ​  | }); |


    | ​  | } |


    The new notebook is created in the store by the following code: var notebook =
    this.store.createRecord(’notebook’, {...});. The createRecord method takes two
    parameters. The first parameter is the model type of the record you want to create.
    In this case it’s a notebook type. The second parameter is a properties list,
    consisting of a set of key-value pairs. The keys should match the names of attributes
    as defined in the referenced model implementation. The values are then set as
    the value of each attribute. In this case we’re pulling the values out of fields
    in our controller and using them to populate the new record.


    | Saving New Records |


    | --- |


    | ![images/aside-icons/important.png](images/aside-icons/important.png) | It’s
    important to realize that calling createRecord does not result in the new record
    being written to persistent storage. This new record lives only in the store until
    the next block of code is called. To write this new record to persistent storage,
    you must call the save method on the desired record. |


    The save method returns a Promise, which can resolve to either success or failure.
    The then method on the resulting Promise object is called once the Promise has
    resolved. As the logging statements demonstrate, the first argument to then is
    executed when the Promise resolves successfully, and the second when it does not.
    This allows you to handle each case separately and keep the user informed of your
    progress.


    When the save method is called, the store prepares a request to the RESTful API
    in the form of an HTTP POST request. The body of the request contains all of the
    information necessary to create the record within persistent storage. For example,
    if we wanted to create a note with a title of “new note,” a description of “description,”
    and belonging to notebook 12, the request would look something like this:


    | ​  | POST /api/notes |


    | ​  | {note: {title: "new note", body: "description", notebook: "12"}} |


    | Monitoring Request/Response Traffic |


    | --- |


    | ![images/aside-icons/tip.png](images/aside-icons/tip.png) | As you’re working
    through these examples, it can be helpful to keep an eye on the request/response
    traffic. Chrome, Firefox, Safari, and Internet Explorer all have built-in developer
    tools that allow you to observe the traffic a site generates. This is very useful
    in investigating the Ember Data requests further. |


    Observe that there are no request parameters for this request. We’re simply POSTing
    to a generic URL for the model type: /api/notes. The POST method for this URL
    is reserved for receiving requests that relate exclusively to the creation of
    new records, and it’s not used for update requests, which use the PUT method.


    Now that we’ve seen how to add new records to Ember apps, let’s look at how to
    modify existing records.


    ### Updating Records


    There’s not much difference between how you create a record and how you update
    one: you call the save method on a record that has the data you want to save.
    The big difference comes in how Ember Data translates the action into an HTTP
    request.


    When a save is called on a record that already exists in persistent storage, this
    results in an HTTP PUT request to the API. For example, in the edit-note route,
    we used the following action to save changes:


    | [ch4/ember-note/app/components/edit-note/component.js](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/components/edit-note/component.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Ember.Component.extend({ |


    | ​  | actions: { |


    | ​  | saveNote: ​**function**​() { |


    | ​  | this.get(​*''note''*​).save(); |


    | ​  | }, |


    | ​  | closeNote: ​**function**​() { |


    | ​  | this.sendAction(​*''close''*​); |


    | ​  | } |


    | ​  | } |


    | ​  | }); |


    The note record, when saved, results in an HTTP request that looks something like
    this:


    | ​  | PUT "/api/notes/12" |


    | ​  | {note: {title: "edited note", body: "edited description", notebook: "12"}}
    |'
