    \ message indicating that your code requires `Ember.run`. Other than that, the\
    \ details about `Ember.run` are mostly relevant if you’re working on Ember instead\
    \ of with Ember.\n\nWith that setup work performed, we’ll run the actual test\
    \ by asserting that the `noteCount` method returns the expected number of records:\
    \ the random number declared earlier. Our test should pass, and we can sleep a\
