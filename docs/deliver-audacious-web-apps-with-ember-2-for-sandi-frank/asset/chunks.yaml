  trans: "\n为了完成此转换，你需要在你的 `RESTSerializer` 实现中实现 `extractArray` 方法。该方法允许你对负载（payload）进行任何重格式化或清理。以下是该方法的实现示例：\n\
    \n```javascript\nextractArray(store, type, payload) {\n  // 你在这里对 payload 进行处理，然后将其传递给父类\n\
    \  return this._super(store, type, payload);\n}\n```\n\n`payload` 方法参数是来自服务器的原始响应。你的实现可能会获取此\
    \ `payload`，进行任何必要的调整以使其符合 Ember Data 的预期格式，然后将其传递给该方法的父类实例。一些常见的操作可能包括更改 payload\
    \ 的结构或删除不需要的信息（例如你的模型中不存在的属性）。这使得你能够使用即使是最不常规的 API 响应，并且仍然利用 Ember Data 的功能。\n\
    \n当负载是一个一个包含多个行的查询响应时（例如 `findMany`），会使用此方法。有一个并行的方法被称为 `extractSingle`，它承担相同的角色，但作用于仅包含单个记录的响应（例如\
    \ `find` 或 `save`）。该方法的签名如下：\n\n```javascript\nextractSingle(store, type, payload,\
    \ recordId) {\n  // 你在这里对 payload 进行处理，然后将其传递给父类\n  return this._super(store,\
    \ type, payload);\n}\n```\n\n还有许多其他类似的方法，每个方法都支持特定的数据操作（例如 `extractCreate`），但最相关的本质上只是\
    \ `extractSingle` 或 `extractArray` 的别名。然而，如果你的 API 要求不同类型接受不同的处理，了解这些选项是有用的。\n\
    \n## 将适配器（Adapters）和序列化器（Serializers）绑定到模型类\n\n在应用中实现适配器/序列化器模式有两种方法。到目前为止，实际上对于跨所有请求的常用更改（例如添加令牌），我们可以修改\
    \ Ember 创建的适配器或序列化器，位于 `ember-note/app/adapters/application` 和 `ember-note/app/serializers/application`。如果你想创建一个模型特定的适配器或序列化器，运行以下命令：\n\
    \n```bash\n$ ember generate serializer\n```\n\n或者\n\n```bash\n$ ember generate\
    \ adapter\n```\n\n这将创建一个适用于给定类型的适配器或序列化器。你可以以此实现之前描述的功能，而无需担心它们会被应用于其他模型类型。\n\n\
    现在我们已经探索了如何使用这些 API，让我们让适配器和序列化器全局生效。从命令行运行以下命令：\n\n```bash\n$ ember generate\
    \ adapter\n$ ember generate serializer\n```\n\n然后如下修改 `ember-note/app/adapters/application.js`\
    \ 文件中的 `namespace` 属性：\n\n```javascript\nnamespace: \"api\"\n```\n\n你可以保留头部；没有理由删除它们。在对非\
    \ de API 进行快速浏览后，我们准备好了下一步。\n\n## 下一步\n\n`RESTAdapter` 和 `RESTSerializer` 类提供的功能比我们在这里涵盖的要多。这些类提供了使用\
    \ Ember Data 与任何 API 通的强大方法，因此如果你遇到了我们还没有涵盖的情况，鼓励你进一步探索这些。我们现在看到了 Ember 和 Ember\
    \ Data 的许多核心功能，但还有更多。Ember 提供了各种选项来扩展核心并连接类。在下一章节中，我们将通过在整个应用中使用常用的工具来扩展 Ember。\n\
    \nCopyright © 2015, The Pragmatic Bookshelf.\n\n# 第 7 章：在 Ember 中重用代码\n\n我们花费了大量时间学习\
    \ Ember 的核心功能。我们已经看到了如何使用这些核心功能构建 Web 应用，以及如何依靠 Ember 的约定俗结构（opinionated structure）快速构建。\n\
    \n该结构不仅提供了构建应用核心的方法，还提供了系统不同部分之间共享代码的方法。它提供了通过准备任何对象来引导应用的能力，并提供了将数据值从一个上下文转换为另一个上下文的能力（例如货币转换）。\n\
    \n在本章中，我们将查看如何使用 Ember 和 Ember CLI 在约定俗成的结构之上分层应用特定的抽象，以便对 EmberNote 的逻辑应用良好的设计。让我们从查看最基本的抽象开始：工具类（utility\
    \ class）。\n\n## 使用工具抽象常用函数\n\n对象之间共享代码的一种方法是创建一个简单的工具函数。Ember CLI 包含一个蓝图用于创建一个可以导入到其他类的工具函数。严格来说，通过这种方式创建工具函数与其说是\
    \ Ember 核心框架的功能，不如说是 Ember CLI 的功能。我们将在第 8 章探索构建你的应用时，讨论 Ember CLI 如何使这种及其他功能成为。创建工具函数的目标是为可能在无关类中使用的逻辑提供单一场所。我之所以说“无关”，是因为如果类是相关的，我们使用混入（mixin）会更好。数据验证是可能存在于工具函数中的逻辑的一个很好的例子。你可能出于许多不同的原因需要验证数据。你可能需要验证一个字符串是否为有效的电子邮件、电话号码或邮政编码。你可能需要验证字符串的长度，或者它是否为有效的日期。在任何情况下，你都可能想在几个上下文中使用此类验证，所以验证是我们开始的一个很好的用用例。\n\
    \n为了我们的目的，假设我们想要验证 EmberNote 的标题长度在 0 到 140 之间。我们将创建一个工具函数来强制执行这一点，然后在我们的 notes\
    \ 路由中使用该函数。开始之前，从项目根目录运行以下命令：\n\n```bash\n$ ember generate util is-valid-length\n\
    ```\n\n此命令创建了一个空的工具函数，看起来如下：\n\n```javascript\nexport default function isValidLength()\
    \ {\n  return true\n}\n```\n\n为了添加我们的实际逻辑，对 `ch7/ember-note/app/utils/is-valid-length.js`\
    \ 进行以下更改：\n\n```javascript\nexport default function isValidLength(value, min,\
    \ max) {\n  return !(value.length <= min || value.length > max);\n}\n```\n\n现在我们已经探索了如何使用工具，让我们看看如何引用它？\n\
    \n"
- fmt: "\n```javascript\nimport Ember from 'ember';\nimport isValidLength from 'ember-note/utils/is-valid-length';\n\
    \nexport default Ember.Route.extend({\n  model: function(params) {\n    return\
    \ this.store.query('note', {notebook:params.notebook_id});\n  },\n  actions: {\n\
    \    addNote: function() {\n      var title = this.controller.get('title');\n\
    \      if(!isValidLength(title,0,140)) {\n        alert('Title must be longer\
    \ than 0 ' + 'characters and not more than 140.');\n      } else {\n        this.store.query('notebook',\n\
    \          this.paramsFor('notebooks.notes').notebook_id)\n        .then(\n  \
    \        (notebook) => {\n            console.log(notebook);\n            var\
    \ note = this.store.createRecord('note', {\n              title : this.controller.get('title'),\n\
    \              notebook: notebook\n            });\n            console.log(note);\n\
    \            note.save().then(() => {\n              console.log('save successful');\n\
    \              this.controller.set('title',null);\n              this.refresh();\n\
    \            }, function() {\n              console.log('save failed');\n    \
    \        });\n          }\n        );\n      }\n    },\n    deleteNote: function(note)\
    \ {\n      console.log('deleting note with title ' + note.get('title'));\n   \
    \   note.deleteRecord();\n      note.save();\n    }\n  }\n});\n```\n\nThe import\
    \ statement makes the new utility function available to the route. A few lines\
    \ later, we use the function to check the length of the title before we add it,\
    \ and alert the user that we’re not going to save the record if the title fails\
    \ validation.\n\nIt’s worth noting that the new function is referred to as `isValidLength`\
    \ in its definition in `is-valid-length.js`, and in both the import and invocation\
