    Ember 作为一个前端 Web 框架提供了很多功能。到目前为止，我们几乎完全关注你应用程序的渲染和导航。但当你构建应用时，最终最终会想要包含数据。Ember\
    \ 为此提供了一个解决方案：Ember Data。\n\nEmber Data 将许多功能封装在一个小型库中。它为你的 Web 客户端提供了一种简单的建模方法，以便在应用中包含简单的记录。它从\
    \ RESTful 服务读取数据，缓存加载的数据，并将这些记录持久化回服务器。\n\n在本章中，你将学习如何使用 Ember Data 从 RESTful\
