    \ 动作链接到保存按钮：\n\n```hbs\n<!-- ch4/ember-note/app/components/edit-note/template.hbs\n\
    <button {{action \"saveNote\"}}>save</button>\n```\n\n就像普通的模板/路由对一样，点击此按钮会执行 `saveNote`\
    \ 动作。\n\n组件作用域内的动作（如 `saveNote`）其用场景比引用动作（referred actions）稍微局限一些。它们只能对组件作用域内的数据（即由调用模板传递的数据）或注入的对象进行操作。如果你可以接受这些限制，那么尽可能让组件的逻辑保持自包含将是一个好主意。\n\
    \n然而，如果你想交给调用的路由/模板来定义实际行为，你可以使用发送动作（sent action）来实现这一点。\n\n### 发送动作 (Sending\
    \ Actions)\n\nEmber 组件还提供了将组件模板链接到调用路由或路由层级中更上层动作的能力。发送动作就是这种能力。我们将在 `edit-note`\
    \ 中定义一个动作。\n\n从初看来看，`closeNote` 动作看起来与 `saveNote` 动作没有区别。然而，它并不是在组件上下文中执行，而是使用\
    \ `sendAction` 方法请求包含它的路由来处理该动作。让我们跟踪代码查看它影响的各个类和模板。\n\n首先，在 `edit-note` 模板中，使用以下代码将动作映射到关闭按钮：\n\
    \n```hbs\n<!-- ch4/ember-note/app/components/edit-note/template.hbs\n<button {{action\
    \ \"closeNote\"}}>close</button>\n```\n\n这导致在组件动作映射中调用了底层的 `closeNote` 函数。该函数看起来如下：\n\
    \n```javascript\n// ch4/ember-note/app/components/edit-note/component.js\ncloseNote:\
    \ function() {\n  this.sendAction('close');\n}\n```\n\n这就是事情变得有趣且强大的之处——`sendAction`\
    \ 方法接收一个字符串参数，但该字符串并不是要在包含它的路由上调用的函数名称。它实际上是组件属性的值，该值由包含它的模板设置，并指向包含路由上的函数。以下是包含它的模板的样子：\n\
    \n```hbs\n<!-- ch4/ember-note/app/notebooks/notes/note/template.hbs\n{{edit-note\
    \ note=model close=\"close\"}}\n```\n\n在 `close=\"close\"` 赋值的左侧，我们定义了用于持有动作的组件参数名称。这与\
    \ `closeNote` 动作中传递给 `sendAction` 的字符串匹配。在赋值的右侧，我们使用了路由中的动作名称。底层路由看起来如下：\n\n```javascript\n\
    // ch4/ember-note/app/notebooks/notes/note/route.js\nimport Ember from 'ember';\n\
    \nexport default Ember.Route.extend({\n  model: function(params) {\n    return\
    \ this.store.findRecord('note', params.id);\n  },\n  actions: {\n    close: function()\
    \ {\n      this.transitionTo('notebooks.notes');\n    }\n  }\n});\n```\n\n你看到了这里定义的\
    \ `close` 动作。在这种情况下，它定义了一个简单的跳转，关闭 `edit-note` 屏幕。\n\n### 监听事件 (Listening for\
    \ Events)\n\n使用动作来响应事件是将逻辑链接到组件的一种简单方法。以事件驱动的方式执行代码也是可能的。\n\n在 Ember 中，每个组件都基于\
    \ `Ember.View` 类，即使是框架自带的 `{{input}}` 这样的组件也是如此。我们还没有提到视图（views），因为它们不是你用 Ember\
    \ 构建应用时所需的概念。它们主要在开发 Ember 框架本身时才重要。\n\n但在这种情况下，了解视图是有帮助的。因为每个组件都基于视图，你可以响应视图可以响应的任何事件。例如，如果你正在设计一个有状态的\
    \ `div` 标签，你可能想要处理点击事件，并在点击发生时更改 `div` 的状态，如下所示：\n\n```javascript\nimport Ember\
    \ from 'ember';\n\nexport default Ember.Component.extend({\n  click: function(event)\
    \ {\n    // 在此处更改状态\n  }\n});\n```\n\n这为你提供了另一种在组件中响应用户输入的手段。通过依赖视图，你可以访问多种事件，这些事件非常多，无法在此列举。\n\
    \n"
