  trans: "\n在 Ember 应用中，你所有的功能都组织在路由（routes）之下。路由本质上是一个 URL 段，正如 Nest 嵌套路由 中描述的。因此，我们的下一步是使用\
    \ Ember CLI 创建一个路由。打开一个新的命令行终端，在你的 `ember-note` 项目根目录下，运行以下命令：\n\n```bash\n$ ember\
    \ generate route register --pod\n```\n\n在 `generate` 命令中添加 `--pod` 标志时，会创建一个名为\
    \ `register` 的目录，其中包含了添加你的路由所需的文件：`route.js` 和 `template.hbs`。它们目前是空的，你将根据需要填充它们的内容，以创建路由的功能。通常来说，当你想要按功能组织项目时（即创建一个包含\
    \ `route.js` 和 `template.hbs` 文件的 `register` 目录），而不是按对象类型组织时，就会使用 pod 模式。\n\n\
    早些时候，当你使用 `ember new` 命令创建应用时，生成了以下四个文件：`index.html`、`app.js`、`router.js` 和 `application.hbs`。随后，`ember\
    \ generate` 命令会编辑你应用目录下的 `router.js` 文件。我们将在 使用 Router 类来组织你的应用 中深入探讨这一点，但 `router.js`\
    \ 类用于实现应用程序内部路由的层级结构。\n\n如果你运行 `ember generate` 命令但省略了 `--pod` 标志，Ember CLI 仍然会创建相同的对象，但它不在\
    \ `register` 目录中创建一个名为 `route.js` 的文件，而是在 `route` 目录中创建一个名为 `register.js` 的文件。对于我们来说，最好将路由所需的每个文件都放在同一个位置，因此在整本书中我们将一直使用\
    \ `--pod` 标志。\n\n让我们来看一下目前为止创建的每一个文件。\n\n### index.html\n\n该文件是你的应用的起点。它是当你运行\
    \ `ember new ember-note` 命令时创建。让我们来看看：\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n\
    \  <meta charset=\"utf-8\">\n  <meta http-equiv=\"X-UA-Compatible\" content=\"\
    IE=edge\">\n  <title>EmberNote</title>\n  <meta name=\"description\" content=\"\
    \">\n  <meta name=\"viewport\" content=\"width=device-width,initial-scale=1\"\
    >\n  {{content-for 'head'}}\n  <link rel=\"stylesheet\" href=\"assets/vendor.css\"\
    >\n  <link rel=\"stylesheet\" href=\"assets/ember-note.css\">\n  {{content-for\
    \ 'head-footer'}}\n</head>\n<body>\n  {{content-for 'body'}}\n  <script src=\"\
    assets/vendor.js\"></script>\n  <script src=\"assets/ember-note.js\"></script>\n\
    \  {{content-for 'body-footer'}}\n</body>\n</html>\n```\n\n`index.html` 的大部分内容是创建起始页面的\
    \ HTML 模板代码。Ember CLI 添加了两个名为 `vendor.css` 和 `ember-note.css` 的样式表来美化应用程序。在本书中，我们不会对样式表做太多操作，但你应该知道，`vendor.css`\
    \ 会捕获引入到应用中的任何第三方代码中使用的样式，而 `ember-note.css` 则用于你定义的样式。\n\n同样的情况适用于 `vendor.js`\
    \ 和 `ember-note.js`。Ember CLI 构建过程会为你应用中使用的所有第三方代码创建一个文件，名为 `vendor.js`，并为你的应用代码创建一个文件，名为\
    \ `ember-note.js`。这些文件都被包含在 `index.html` 中。\n\n你可能还会注意到 `{{content-for}}` 表达式。这些允许你使用\
    \ Ember CLI 插件在页面包含包含内容。\n\n### app.js\n\n`app.js` 文件用于创建 Ember 环境。看看下面的代码：\n\n\
    ```javascript\nimport Ember from 'ember';\nimport Resolver from 'ember/resolver';\n\
    import initializers from 'ember/initializers';\nimport config from './config/environment';\n\
    \nvar App;\n\nApp = Ember.Application.extend({\n  modulePrefix: config.modulePrefix,\n\
    \  podPrefix: config.podPrefix,\n  Resolver\n});\n\ninitializers(App, config.modulePrefix);\n\
    \nexport default App;\n```\n\n如果你是一个资深的 JavaScript 开发者但还没有看过 ECMAScript，那么前四行可能会让你大掉下巴。ECMAScript\
    \ 是 ECMA 国际组织指定的 JavaScript 语言的正式名称，而 ECMAScript 2015（也称为 ES6）是该标准的最新版本。\n\n`app.js`\
    \ 中代码的目的是设置应用范围内的构造。其中之一 `Resolver` 用于在整个应用中查找类。`modulePrefix` 变量被设置为 `ember-note`\
    \ 值，这是在你设置应用时定义的。`podPrefix` 没有被设置，因为它在我们的项目中没有定义，该值是从 `config/environment` 中读取的。\n\
    \n文件的最后一行使 `App` 类作为模块可用。如果这看起来还不完全理解，不要担心——随着学习的，你会看到更多关于 Ember 如何工作的示例。现在，让我们看看设置应用时创建的另一个文件，`router.js`\
    \ 文件。\n\n### router.js\n\n`router.js` 文件是你可以真正开始观察 Ember 如何工作的地方。Ember 最基础的功能之一是路由（route）的概念。简单来说，路由是应用中的一个位置。如果你将应用视为一组嵌套在另一个之中的页面或页面部分，那么每个页面都对应一个路由。而在\
    \ `router.js` 中定义的 `Router` 类就是你定义应用结构的地方。来看看代码：\n\n```javascript\nimport Ember\
    \ from 'ember';\nimport config from './config/environment';\n\nvar Router = Ember.Router.extend({\n\
    \  location: config.locationType\n});\n\nRouter.map(function() {\n  this.route('register');\n\
    });\n\nexport default Router;\n```\n\n在 `router.js` 文件的顶部你看到了必要的导入。在 `var Router\
    \ = Ember.Router.extend` 开始的类定义中，我们从设置应用时定义的全局配置中引入了一些配置变量。\n"
- fmt: "\nBut `Router.map` is where the real action happens. As you can see, we’ve\
    \ already created a route called `register`. This route was added to the `Router`\
    \ when we ran the `ember generate route register --pod` command. A number of other\
    \ files were also generated, and we’ll edit those files to create our registration\
    \ feature in a moment. The `register` route appears to be a top-level route, but\
    \ is actually at the first level of child routes beneath a default route for the\
    \ application. Let’s look at that default route by way of its associated template.\n\
    \n#### application.hbs\n\nEach application has a root route, the `Application`\
    \ route. Further, each route corresponds to exactly one template. A template is\
    \ a chunk of your user interface. In the case of the application route, this template\
    \ is defined in `application.hbs`. Let’s modify this template now to look like\
    \ the following:\n\n```html\n<div class=\"container\">\n  <div class=\"row\">\n\
    \    <div class=\"col-md-2\">\n      Welcome to EmberNote\n    </div>\n    <div\
    \ class=\"col-md-10\">\n      {{#link-to 'register'}}register{{/link-to}}\n  \
    \  </div>\n  </div>\n  <div class=\"row\">\n    <div>\n      {{outlet}}\n    </div>\n\
    \  </div>\n</div>\n```\n\nEach Ember template is a mixture of HTML and the Handlebars\
    \ expression language, which is the portions of code set off with `{{ }}` characters.\
    \ Handlebars is an expression language used by Ember to describe those segments\
    \ of Ember templates that are in some way related to the Ember application code.\
    \ You’ll see many examples of Ember using Handlebars expressions throughout the\
    \ book, always using the `{{ }}` characters. Ember ships with a compiler that\
    \ turns Handlebars template expressions into DOM objects, as we’ll see in [Compile\
    \ Templates](#).\n\nAs we saw earlier, each app consists of a hierarchy of routes.\
    \ The `{{#link-to}}` expression in the `application.hbs` file is used to generate\
    \ a hyperlink that when clicked will load the `register` route into the `{{outlet}}`.\n\
    \nYou may be wondering where the `Application` route is defined. In this particular\
    \ case, because we don’t have any specific action handling or data loading to\
    \ do, we don’t need to define the route class; we can simply rely on Ember to\
    \ create a route implementation on the fly using default route behavior.\n\nAll\
    \ of the code we’ve seen thus far has set up the bare minimum of application.\
    \ Now, let’s see how to add a feature to our app by building our `register` route.\n\
    \n### Building the Register Route\n\nAs discussed earlier, the `register` route\
    \ will allow a user to register for the EmberNote app by choosing a username.\
    \ When we created this route using the CLI, the following file was created (note,\
    \ this is `route.js`, which is different from `router.js`):\n\n```javascript\n\
    import Ember from 'ember';\n\nexport default Ember.Route.extend({\n});\n```\n\n\
    This is how you define an empty route class. A route has two primary reasons to\
    \ exist: loading data to be displayed by the route and responding to actions.\
    \ In our case, we don’t have any data to display, and we need to define an `addNew`\
    \ action to add new users to the app. We’ll come back to that action shortly.\
    \ First, let’s see what the user interface will look like. Here’s our route’s\
    \ template file, with the necessary UI code added in:\n\n```html\n<div class=\"\
    col-md-12\">\n  Register new user: {{input value=name}}\n  <button {{action 'addNew'}}>Add</button>\n\
    </div>\n<div class=\"col-md-12\">\n  {{message}}\n</div>\n```\n\nThe `{{input}}`\
    \ field allows us to key in a name. The `<button>` with `{{action 'addNew'}}`\
    \ triggers the `addNew` action. The `{{message}}` displays the status of the operation.\n\
    \nThe `register` route will allow a user to register for the EmberNote app by\
    \ choosing a username. When we created this route using the CLI, the following\
    \ file was created (note, this is `route.js`, which is different from `router.js`):\n\
    \n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n\
    });\n```\n\nThis is how you define an empty route class. A route has two primary\
    \ reasons to exist: loading data to be displayed by the route and responding to\
    \ actions. In our case, we don’t have any data to display, and we need to define\
    \ an `addNew` action to add new users to the app.\n"
  raw: 'But Router.map is where the real action happens. As you can see, we’ve already
    created a route called register. This route was added to the Router when we ran
    the ember generate route register --pod command. A number of other files were
    also generated, and we’ll edit those files to create our registration feature
    in a moment. The register route appears to be a top-level route, but is actually
    at the first level of child routes beneath a default route for the application.
    Let’s look at that default route by way of its associated template.


    #### application.hbs


    Each application has a root route, the Application route. Further, each route
    corresponds to exactly one template. A template is a chunk of your user interface.
    In the case of the application route, this template is defined in application.hbs.
    Let’s modify this template now to look like the following:


    | [ch1/ember-note/app/templates/application.hbs](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/templates/application.hbs)
    |


    | ​  | ​**<div**​ class=​*"container"*​​**>**​ |


    | ​  | ​**<div**​ class=​*"row"*​​**>**​ |


    | ​  | ​**<div**​ class=​*"col-md-2"*​​**>**​ |


    | ​  | Welcome to EmberNote |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div**​ class=​*"col-md-10"*​​**>**​ |


    | ​  | {{#link-to ''register''}}register{{/link-to}} |


    | ​  | ​**</div>**​ |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div**​ class=​*"row"*​​**>**​ |


    | ​  | ​**<div>**​ |


    | ​  | {{outlet}} |


    | ​  | ​**</div>**​ |


    | ​  | ​**</div>**​ |


    | ​  | ​**</div>**​ |


    Each Ember template is a mixture of HTML and the Handlebars expression language,
    which is the portions of code set off with “{{ }}” characters. Handlebars is an
    expression language used by Ember to describe those segments of Ember templates
    that are in some way related to the Ember application code. You’ll see many examples
    of Ember using Handlebars expressions throughout the book, always using the “{{
    }}” characters. Ember ships with a compiler that turns Handlebars template expressions
    into DOM objects, as we’ll see in [​*Compile Templates*​](#f_0027.html_precompiling).


    As we saw earlier, each app consists of a hierarchy of routes. The {{#link-to}}
    expression in the application.hbs file is used to generate a hyperlink that when
    clicked will load the register route into the {{outlet}}.


    You may be wondering where the Application route is defined. In this particular
    case, because we don’t have any specific action handling or data loading to do,
    we don’t need to define the route class; we can simply rely on Ember to create
    a route implementation on the fly using default route behavior.


    All of the code we’ve seen thus far has set up the bare minimum of application.
    Now, let’s see how to add a feature to our app by building our register route.


    ### Building the Register Route


    As discussed earlier, the register route will allow a user to register for the
    EmberNote app by choosing a username. When we created this route using the CLI,
    the following file was created (note, this is route.js, which is different from
    router.js):


    | [ch1/ember-note/app/register/route.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/register/route.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Ember.Route.extend({ |


    | ​  | }); |


    This is how you define an empty route class. A route has two primary reasons to
    exist: loading data to be displayed by the route and responding to actions. In
    our case, we don’t have any data to display, and we need to define an addNew action
    to add new users to the app. We’ll come back to that action shortly. First, let’s
    see what the user interface will look like. Here’s our route’s template file,
    with the necessary UI code added in:


    | [ch1/ember-note/app/register/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/register/template.hbs)
    |


    | ​  | ​**<div**​ class=​*"col-md-12"*​​**>**​ |


    | ​  | Register new user: {{input value=name}} |


    | ​  | ​**<button**​ {{action ''addNew''}}​**>**​Add​**</button>**​ |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div**​ class=​*"col-md-12"*​​**>**​ |


    | ​  | {{message}} |


    | ​  | ​**</div>**​ |


    The {{input}} field allows us to key in a name, which will be added to the name
    attribute of the controller (which we’ll create in a moment). The {{action}} expression,
    which we included in the <button>, binds the button’s click action to the addNew
    action in our route. And the {{message}} expression simply displays the contents
    of the message attribute in the controller. We don’t yet have a child route for
    register, but if we did, it would be rendered into {{outlet}}, similar to how
    the register route is rendered into the {{outlet}} in application.hbs.


    We’ll need some way to capture the UI state contained in the name and message
    fields. To do this, we’ll rely on the default controller. In Ember, each route
    maps to exactly one controller, and that controller acts as a proxy for the underlying
    model, including any UI state. Because we don’t have any data to load into our
    model yet, all we really use the controller for is to provide a place to put the
    state of the name and message fields from our template. In cases when you need
    only very simple functionality, you can skip creating a unique controller implementation
    for your route and just rely on the default implementation that Ember assigns
    to your route. Now, let’s create the addNew action to go in our route.


    | Avoiding Controllers |


    | --- |


    | ![images/aside-icons/tip.png](images/aside-icons/tip.png) | There’s another
    reason for not choosing to rely heavily on controllers. The Ember team plans to
    deprecate controllers early in the 2.x release cycle, in favor of performing similar
    work in the route or in components. Future versions of this book will follow suit,
    and for now, we’re avoiding using controllers as much as possible. |


    Edit the register route so it looks like this:


    | [ch1/ember-note/app/register/route.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/register/route.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Ember.Route.extend({ |


    | ​  | actions: { |


    | ​  | addNew: ​**function**​() { |


    | ​  | ​**var**​ user = this.store.createRecord(​*''user''*​, { |


    | ​  | name : this.controller.get(​*''name''*​) |


    | ​  | }); |


    | ​  | user.save().then(() => { |


    | ​  | console.log(​*''save successful''*​); |


    | ​  | this.controller.set(​*''message''*​,​*''A new user with the name "''*​
    |


    | ​  | + this.controller.get(​*''name''*​) + ​*''" was added!''*​); |


    | ​  | this.controller.set(​*''name''*​,null); |


    | ​  | }, ​**function**​() { |


    | ​  | console.log(​*''save failed''*​); |


    | ​  | }); |


    | ​  | } |


    | ​  | } |


    | ​  | }); |


    The first thing we do here is to add an actions hash to the route. A hash is a
    list of name-value pairs. In this case, the names are names of functions, and
    the values are the function definitions. We have one function, addNew. This function
    will be called when we click the button in our user interface, because that’s
    how it was defined in the template.


    We’re also relying on a bit of new ES 2015 syntax here. The code () =>, known
    as a fat arrow function, will let us continue to use this within the body of the
    then function, and this will continue to refer to the route object. The call to
    createRecord uses the Ember Data framework to create a new instance of a model
    object, and the subsequent call to save saves that record to persistent storage.
    Ember Data provides access to data over RESTful services. Before we test all of
    this, we’ll need to set up a mock service for Ember Data to call, and a model
    object to use that data. Let’s do that now.


    ### Adding a Data Service'
