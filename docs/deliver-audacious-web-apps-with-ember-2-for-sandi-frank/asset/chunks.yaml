- fmt: "\n![](images/cover.jpg)\n\n![Pragmatic Bookshelf](images/cover.jpg \"Pragmatic\
    \ Bookshelf\")\n\n# Deliver Audacious Web Apps with Ember 2\n\n### by Matthew\
    \ White\n\nVersion: P1.0 (October 2015) Copyright © 2015 The Pragmatic Programmers,\
    \ LLC. This book is licensed to the individual who purchased it. We don't copy-protect\
