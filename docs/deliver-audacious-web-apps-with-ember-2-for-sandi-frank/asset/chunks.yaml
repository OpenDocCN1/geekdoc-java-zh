  trans: "\n\n```javascript\nnotebook.save().then(() => {\n  console.log('save successful');\n\
    \  this.controller.set('title', null);\n  this.refresh();\n}, function() {\n \
    \ console.log('save failed');\n});\n} });\n```\n\n此更改允许我们在保存新笔记本时，使用存储在 session\
    \ 中的用户记录。\n\n如果说 `serialize` 方法接收来自 `Ember Data` 预期格式的数据并将其转换以便供 API 使用，那么 `normalize`\
    \ 方法执行的就是相反的操作。我们已经在 `RESTSerializer` 中使用了这一点。让我们来看看是如何操作的。\n\n### 数据归一化 (Normalizing\
    \ Data)\n\n`normalize` 方法定义在 `RESTSerializer` 的基础实现中。我们依赖的正是这个实现。由于我们对数据进行非常直接的归一化并更改了键的大小，我们只需要定义这个函数。让我们再次查看代码：\n\
    \n```javascript\nnormalize: function(typeClass, hash, prop) {\n  hash.title =\
    \ hash.Title;\n  delete hash.Title;\n  hash.user = hash.User;\n  delete hash.User;\n\
    \  return this._super(typeClass, hash, prop);\n}\n```\n\n这个函数非常简单：它将类首写（class-cased）键中的值映射到对应的驼峰命名（camel-cased）键上，然后删除类首写的项。\n\
    \n有时，你可能想在 `normalize` 函数中执行其他工作，例如删除不需要的数据点或添加新数据。以下代码在负载中分配了一个带有当前时间的属性。\n\n\
    ```javascript\nnormalize: function(type, hash, prop) {\n  hash['currentTime']\
    \ = new Date();\n  this._super(type, hash, prop);\n}\n```\n\n这些参数代表数据类型（即模型类）、要使用的\
    \ hash 键名（例如我们上一个示例中的 \"notebooks\"）以及从服务器返回的负载。记住带参数调用 `this._super` 是重要的，这可以确保调用了父类的\
    \ `normalize` 方法并运行你定义的 `normalizeHash` 操作。\n\n### 允许 Adapter 查询非传统 API\n\n此时，你对序列化器（serializer）所做的更改将允许你以新\
    \ API 的格式进行保存，但你将无法查询数据。在能够查询之前，你需要为你的笔记本模型创建一个新的 `RESTAdapter`。首先，运行以下命令：\n\n\
    ```bash\n$ ember generate adapter notebook\n```\n\n这会在 `ember-note/app/adapters/notebook.js`\
    \ 创建一个存根类。\n\n我们需要创建一个新 adapter 的原因是考虑到模型类中的属性名称与 API 中属性名称之间的大小写差异。如果不创建这个 adapter，查询参数\
    \ `{user : 1}` 将找不到任何记录，因为 API 中的属性被称为 `User`。为了解决这个问题，请如下所示实现 adapter 类 `ch6/ember-note/app/adapters/notebook.js`：\n\
    \n```javascript\nimport ApplicationAdapter from './application';\nimport Ember\
    \ from 'ember';\n\nexport default ApplicationAdapter.extend({\n  query: function(store,\
    \ query) {\n    var keys = Object.keys(query);\n    for (var i = 0; i < keys.length;\
    \ i++) {\n      var key = keys[i];\n      var classifiedKey = Ember.String.classify(key);\n\
    \      query[classifiedKey] = query[key];\n      delete query[key];\n    }\n \
    \   return this._super(store, query);\n  }\n});\n```\n\n我们正在扩展 `query` 方法，以便在查询到达服务器之前对其进行拦截。当我们像笔记本路由（notebooks\
    \ route）中使用 hash 进行查询时，在 adapter 上调用的就是这个方法。我们的代码获取具有驼峰命名键的键值对，并将其替换为 API 预期的格式的键值对。然后它将控制权交给父类方法。这使得我们的查询能够被\
    \ API 正确识别。如果你登录应用，应该能够添加新笔记本，并在列表中看到新笔记本，就像在我们更改后端 API 之前一样。\n\n### 适配路径变体 (Adapt\
    \ Path Variations)\n\n不仅可以使用 `RESTAdapter` 更改属性名称，你还可以更改路径。默认情况下，`Ember Data`\
    \ 尝试将类名变为复数形式以生成 API 路径，因此名为 `notebook` 的模型类将使用端点 `notebooks`。由于各种原因，这可能是不准确的。如果是这样，你可以使用\
    \ `pathForType` 方法来处理这种需求，如下：\n\n```javascript\npathForType: function(type) {\n\
    \  if (type === 'notebook') {\n    return 'poorly-named-endpoint';\n  }\n}\n```\n\
    \n如你所见，该方法接受模型类名作为参数，并将其转换为完全不同的值，或者通过更改大小写、添加下划线等方式对名称进行某种修改的版本。这允许你适配端点 URL\
    \ 上命名规范的变体。\n\n### 更改负载根 (Change the Payload Root)\n\n`RESTSerializer` 中有一个类似的方法，允许你接受来自服务器的\
    \ JSON 负载，并根据根键名称确定正确的类型。考虑以下负载：\n\n```json\n{\n  \"Notebooks\" : {\n    // 此处为你的负载数据\n\
    \  }\n}\n```\n\n如果你实现了 `modelNameFromKey` 函数，你就可以更改根键的值，从而允许 `Ember Data` 正确查找关联的模型类并处理负载，如下：\n\
    \n```javascript\nmodelNameFromKey: function(root) {\n  return Ember.String.camelize(root);\n\
    }\n```\n\n这会将 \"Notebooks\" 转换为 \"notebooks\"，允许 `Ember Data` 找到用于负载的相应类。\n\n\
    当然，为了保存回服务器，你需要对在 `modelNameFromKey` 中执行的操作进行反。你可以在 `payloadKeyFromName` 中实现它：\n\
    \n```javascript\npayloadKeyFromName: function(modelName) {\n  return Ember.String.classify(modelName);\n\
    }\n```\n\n这会将 \"notebooks\" 转换回 \"Notebooks\"，让你能够以预期的格式保存回服务器。\n\n### 修改飞行中的负载\
    \ (Modify the Payload in Flight)\n\n我们已经涵盖了与 RESTful API 工作时可能遇到的多数场景。但最后一种场景：你可能需要使用只能返回复合记录的\
    \ API，例如将子记录作为子节点包含在 JSON 负载中，而不是独立的节点。\n\n假设对笔记本 API 的查询返回了如下格式：\n\n```json\n\
    {\n  \"notebooks\": {\n    \"id\": 1,\n    \"title\": \"notebook one\",\n    \"\
    description\": \"description one\",\n    \"notes\": [{\n      \"id\": 1,\n   \
    \   \"title\": \"note one\",\n      \"description\": \"description one\"\n   \
    \ },\n    {\n      \"id\": 2,\n      \"title\": \"note two\",\n      \"description\"\
    : \"description two\"\n    }]\n  }\n}\n```\n\n注意 `notes` 节点嵌套在 `notebooks` 对象内部。这不是\
    \ `Ember Data` 预期的负载格式。`Ember Data` 的预期是相同的信息具有如下负载结构：\n\n```json\n{\n  \"notebooks\"\
    : {\n    \"id\": 1,\n    \"title\": \"notebook one\",\n    \"description\": \"\
    description one\",\n    \"notes\": [1, 2]\n  },\n  \"notes\": [{\n    \"id\":\
    \ 1,\n    \"title\": \"note one\",\n    \"description\": \"description one\"\n\
    \  },\n  {\n    \"id\": 2,\n    \"title\": \"note two\",\n    \"description\"\
    : \"description two\"\n  }]\n}\n```\n\n"
- fmt: "\nFor you to make this conversion, you need to implement the `extractArray`\
    \ method in your `RESTSerializer` implementation. This method allows you to perform\
    \ any reformatting or cleanup on the payload. Here’s an example implementation\
    \ of the method:\n\n```javascript\nextractArray(store, type, payload) {\n  //You'd\
    \ perform work on the payload here, then pass on to the superclass\n  return this._super(store,\
    \ type, payload);\n}\n```\n\nThe `payload` method parameter is the original response\
    \ from the server. Your implementation is likely to take this `payload`, make\
    \ whatever adjustments necessary to get it into Ember Data’s expected format,\
    \ and then pass it on to the superclass instance of the method. Some common operations\
    \ that might take place include changing the structure of the payload or deleting\
    \ unneeded information, such as attributes that are not in your model. This lets\
    \ you make use of even the most unconventional API responses and still take advantage\
    \ of Ember Data’s features.\n\nThis method is used when the payload is a response\
    \ to a query containing multiple rows, such as a `findMany`. There’s a parallel\
    \ method, known as `extractSingle`, that fills the same role, but acts on responses\
    \ that include just one record, such as a `find` or a `save`. The method signature\
    \ contains one additional parameter, and looks like this:\n\n```javascript\nextractSingle(store,\
    \ type, payload, recordId) {\n  //You'd perform work on the payload here, then\
    \ pass on to the superclass\n  return this._super(store, type, payload, recordId);\n\
    }\n```\n\nThere are many other similar methods, each of which supports a specific\
    \ data operation, such as `extractCreateRecord`, but the most relevant ones are\
    \ in essence just an alias for either `extractSingle` or `extractArray`. However,\
    \ if your API requires that different operation types receive different treatment,\
    \ it’s worth knowing that these options are out there.\n\n## Tie Adapters and\
    \ Serializers to Your Model Class\n\nThere are two ways to go about implementing\
    \ the adapter/serializer pattern in your app. We’ve actually used both so far.\
    \ For common changes that you want to share across all REST requests, such as\
    \ adding a user token, you modify the application adapter or serializer that Ember\
    \ CLI creates for you, located at `ember-note/app/adapters/application.js` and\
    \ `ember-note/app/serializers/application.js`. If you want to create a model-specific\
    \ adapter or serializer, you run one of the following commands:\n\n```bash\n$\
    \ ember generate serializer mymodel\n```\n\nor\n\n```bash\n$ ember generate adapter\
    \ mymodel\n```\n\nThis creates an adapter or serializer that will be applied to\
    \ requests for data of the given type. You can then implement the features we\
    \ described earlier, without worrying that they will be applied unnecessarily\
    \ to other model types.\n\nNow that we’ve explored how to use an alternate API,\
    \ let’s get rid of the notebook adapter and serializer, and change our application-wide\
    \ RESTAdapter back. From a command line, run the following commands:\n\n```bash\n\
    $ ember destroy adapter notebook\n$ ember destroy serializer notebook\n```\n\n\
    Then modify the `namespace` property in the `ember-note/app/adapters/application.js`\
    \ file as follows:\n\n```javascript\nnamespace: \"api\"\n```\n\nYou can leave\
    \ the headers in place; there’s no reason they should be removed. With our brisk\
    \ tour through nonconforming APIs at an end, we’re ready for our next step.\n\n\
    ## Next Steps\n\nThe `RESTAdapter` and `RESTSerializer` classes offer a lot more\
    \ than we’ve been able to cover here. These classes provide a powerful means of\
    \ using Ember Data to work with just about any API, so I encourage you to explore\
    \ these further if you run into a scenario we haven’t covered. We’ve now seen\
    \ a lot of the core features of Ember and Ember Data, but there’s more for us\
    \ yet. Ember offers a variety of options for extending this core and for using\
    \ the framework itself to link classes together to help increase the utility of\
    \ the classes you create. In the next chapter, we’ll extend Ember by making commonly\
    \ needed utilities available throughout your app.\n\nCopyright © 2015, The Pragmatic\
    \ Bookshelf.\n\n# Chapter 7: Reusing Code in Ember\n\nWe’ve spent a good deal\
    \ of time learning the core features of Ember. We’ve seen how to build web apps\
    \ using these core features, and how to do so quickly, by relying on Ember’s opinionated\
    \ structure.\n\nThat structure does more than provide you with a means of building\
    \ the core of your app. It also provides several ways of sharing code between\
    \ different aspects of your system. It offers the ability to bootstrap your app\
    \ by preparing any necessary objects. And it provides the ability to translate\
    \ a data value from one context to another, such as a currency translation.\n\n\
    In this chapter, we’ll look at how to use Ember and Ember CLI to layer in app-specific\
    \ abstractions on top of Ember’s opinionated structure so that you can apply sound\
    \ design to EmberNote’s logic. Let’s get started by looking at the most basic\
    \ level of abstraction: the utility class.\n\n## Abstract Common Functions with\
    \ Utilities\n\nOne way to share code between objects is to create a simple utility\
    \ function. Ember CLI includes a blueprint for creating a utility function that\
    \ can be imported into other classes. Strictly speaking, creating the utility\
    \ function this way isn’t a feature of the Ember core framework as much as a feature\
    \ of Ember CLI. We’ll discuss how Ember CLI makes this and other features possible\
    \ when we explore building your app in Chapter 8. The goal of creating a utility\
    \ function is to provide a single place for logic that might be used in unrelated\
    \ classes. I say “unrelated,” because if the classes were related, we’d be better\
    \ off using a mixin. Data validation is a good example of the sort of logic that\
    \ might live in a utility function. There are many different reasons why you might\
    \ need to validate data. You might need to validate that a string is a valid email,\
    \ or phone number, or postal code. You might need to validate the length of a\
    \ string, or that it’s a valid date. In any event, it’s possible that you’ll want\
    \ to use such validation in several contexts, so validation is a good use case\
    \ for us to start with.\n\nFor our purposes, let’s say we want to validate that\
    \ EmberNote’s titles have a length between 0 and 140. We’ll create a utility function\
    \ to enforce this, and then use that function in our notes route. To begin, run\
    \ the following command from your project root:\n\n```bash\n$ ember generate util\
    \ is-valid-length\n```\n\nThis command creates an empty utility function that\
    \ looks like this:\n\n```javascript\nexport default function isValidLength() {\n\
    \  return true;\n}\n```\n\nTo add our actual logic, make the following changes\
    \ to `ch7/ember-note/app/utils/is-valid-length.js`:\n\n```javascript\nexport default\
    \ function isValidLength(value, min, max) {\n  return !(value.length <= min ||\
    \ value.length > max);\n}\n```\n\nThe specific implementation details of this\
    \ function are less important than the form. You’ll notice that the command used\
    \ the dasherized text `is-valid-length`, whereas the function is called `isValidLength`.\
    \ Ember CLI performs that translation when creating the function, which is captured\
    \ in a file called `is-valid-length.js`. So now that we have a function, how do\
    \ we reference it?\n"
