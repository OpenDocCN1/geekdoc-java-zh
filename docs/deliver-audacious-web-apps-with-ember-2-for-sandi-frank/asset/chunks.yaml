    # 第 3 章：布局用户界面


    在牢固掌握如何使用路由来组织应用程序之后，让我们谈谈它们的兄弟：模板（template）。在 Ember 中，正如你预期的那样，模板包含你的部分用户界面代码。它由
    HTML、CSS 和 Handlebars 表达式组成。


    在本章中，你将学习 Ember 的架构如何支持模板的使用。你还将学习更多关于创建模板、如何通过路由结构将它们关联起来，以及使用 Handlebars 表达式语言处理
    Ember 对象的知识。此外，你还将学习如何使用 Ember 框架中已有的各种表达式为你的用户界面添加控制和显示逻辑。


