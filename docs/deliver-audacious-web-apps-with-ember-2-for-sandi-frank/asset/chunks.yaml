- fmt: "\nEach user interface is composed of distinct groupings of controls, such\
    \ as a menu, a table, or a form, that can be naturally separated into templates\
    \ (or components, which we’ll see next). A good design step when working with\
    \ Ember is to take a look at your planned user interface and draw boundaries around\
    \ associated sets of controls. Once you’ve defined the control groups that can\
    \ be represented by one data model, you have a template! Let’s take a look at\
    \ how exactly you create one.\n\n## Creating a Template\n\nWhen you create a route\
    \ with Ember CLI, a template is created for you to use within that route. If you’re\
    \ using the `--pod` flag, the template for your new route is in the route’s directory\
    \ and is named `template.hbs`. Otherwise, it’s in the `templates` directory and\
    \ is called `myroute.hbs`, where “myroute” is the name of the route you defined.\
    \ The decision of when to use the `--pod` flag is primarily an organizational\
    \ one, and you should decide based on what makes sense to you. I prefer to keep\
    \ related templates and routes in the same directory, so I choose to use the `--pod`\
    \ flag.\n\nWhen Ember CLI creates a new template in this way, the only thing it\
    \ adds to the template is an `{{outlet}}` expression for your child routes. It’s\
    \ up to you to add the rest! Let’s look at another, more interesting template,\
    \ the notebooks template:\n\n| [ch3/ember-note/app/notebooks/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch3/ember-note/app/notebooks/template.hbs)\
    \ |\n| ​  | ​`<div>`​ |\n| ​  | ​`<div class=\"col-md-3\">`​ |\n| ​  | ​`<div>Notebooks</div>`​\
    \ |\n| ​  | ​`<div>`​ |\n| ​  | title: {{input value=title}} |\n| ​  | ​`<button\
    \ {{action 'addNotebook'}}>Add</button>`​​ |\n| ​  | ​`</div>`​ |\n| ​  | ​`<div>`​\
    \ |\n| ​  | ​`<ul>`​ |\n| ​  | {{#each model as |notebook|}} |\n| ​  | {{#link-to\
    \ 'notebooks.notes' notebook.id}} |\n| ​  | ​`<li>{{notebook.title}}</li>`​​ |\n\
    | ​  | {{/link-to}} |\n| ​  | {{else}} |\n| ​  | ​`<div>No notebooks found</div>`​​\
    \ |\n| ​  | {{/each}} |\n| ​  | ​`</ul>`​ |\n| ​  | ​`</div>`​ |\n| ​  | ​`</div>`​\
    \ |\n| ​  | ​`<div class=\"col-md-9\">`​​ |\n| ​  | {{outlet}} |\n| ​  | ​`</div>`​\
    \ |\n| ​  | ​`</div>`​ |\n\nWithin the template, you see a mix of HTML and Handlebars\
    \ expressions (which are anything within a double set of curly braces). This particular\
    \ snippet includes a few HTML tags for structure, but most interesting are the\
    \ Handlebars expressions. Let’s take a look at a very important one now.\n\n##\
    \ Linking Templates Together\n\nOne Handlebars expression in this template is\
    \ the `{{#each}}` expression. This represents a basic looping construct. Recall\
    \ that each template is bound to one and only one route and controller. One purpose\
    \ of a route is to provide data to its associated template. Here the route provides\
    \ a list of zero to many notebook objects to the notebooks template. The `{{#each}}`\
    \ expression is evaluated for each notebook object. If the route provides an empty\
    \ list, the `{{else}}` segment of the expression will be evaluated, and the page\
    \ will display “No notebooks found” to the user.\n\nThe following code is then\
    \ evaluated for each of the notebook objects within the list:\n\n| ​  | ​`<div>`​\
    \ |\n| ​  | {{#link-to 'notebooks.notes' notebook.id}} |\n| ​  | {{notebook.title}}{{/link-to}}\
    \ |\n| ​  | ​`</div>`​ |\n\nThis is a `{{link-to}}` expression. At runtime, this\
    \ `{{#link-to}}` snippet evaluates to roughly the following HTML:\n\n| ​  | ​`<a\
    \ id=\"ember100\" class=\"ember-view\" href=\"notebooks/10/notes/1\">Notebook</a>`​​\
    \ |\n\nLet’s break down this link. The `{{link-to}}` expression generates a route,\
    \ including each of the necessary path segments. In this case, we are already\
    \ on the notebooks route, having loaded it for a user with an id value of “10.”\
    \ We’re trying to navigate from there to the notes child route, with a notebook\
    \ with an id of “1.”\n\nWhile this HTML is interesting, it’s how Ember uses this\
    \ link that matters most. When you click the link, Ember updates the current URL\
    \ to `http://localhost:4200/notebooks/1/notes/1` (the numbers may vary slightly,\
    \ but the other segments should be the same). Ember renders the notebooks template\
    \ into the `{{outlet}}` in the application template, and the notes template.\n\
    \n## Render Controls with Expressions\n\nSo far we’ve used some vanilla controls\
    \ to illustrate Ember’s system. But the Handlebars expression language and Ember’s\
    \ helper classes are capable of rendering a great deal more variety than that.\n\
    \nIn this section we’ll go through the most useful controls. We’ll start with\
    \ how to use Ember to display static data, and then talk about conditionals and\
    \ looping. Then we’ll visit input controls and wrap up by going over actions and\
    \ links.\n\n### Rendering Data\n\nThe most fundamental use of Handlebars expressions\
    \ is to simply display data from the route and its related controller. A controller\
    \ is a class used to provide access to the data supplied via the route’s model\
    \ hook. Recall that each template is bound to one and only one route. This is\
    \ also true for controllers. Each controller maintains a set of properties, which\
    \ are data that can be used by the template. Thus far, we haven’t needed to explicitly\
    \ define a controller class and have relied on default functionality in the framework.\
    \ However, if we want to display the data for a given controller property, we\
    \ simply add it to an expression in our template, like this:\n\n| ​  | ​`<div>{{propertyName}}</div>`​\
    \ |\n\nWhatever data is held in that property will be displayed as static text\
    \ on the page. If your controller looks like this:\n\n```javascript\nimport Ember\
    \ from 'ember';\n\nexport default Ember.Controller.extend({\n  propertyName: \"\
    A value\"\n});\n```\n\nthen the previous expression will render this:\n\n| ​ \
    \ | ​`<div>A value</div>`​​ |\n\nIt’s possible for a controller to manage the\
    \ data of just one record, which is called an ObjectController, or many records,\
    \ which is called an ArrayController. In our example, the controller that backs\
    \ the notebooks template is an ArrayController. If you have an ArrayController,\
    \ you can render data from the list of records it manages by using the `{{each}}`\
    \ expression, as we saw earlier in the chapter. Let’s now turn to Ember’s control\
    \ flow expressions.\n"
  raw: 'Each user interface is composed of distinct groupings of controls, such as
    a menu, a table, or a form, that can be naturally separated into templates (or
    components, which we’ll see next). A good design step when working with Ember
    is to take a look at your planned user interface and draw boundaries around associated
    sets of controls. Once you’ve defined the control groups that can be represented
    by one data model, you have a template! Let’s take a look at how exactly you create
    one.


    ### Creating a Template


    When you create a route with Ember CLI, a template is created for you to use within
    that route. If you’re using the --pod flag, the template for your new route is
    in the route’s directory and is named template.hbs. Otherwise, it’s in the templates
    directory and is called myroute.hbs, where “myroute” is the name of the route
    you defined. The decision of when to use the --pod flag is primarily an organizational
    one, and you should decide based on what makes sense to you. I prefer to keep
    related templates and routes in the same directory, so I choose to use the --pod
    flag.


    When Ember CLI creates a new template in this way, the only thing it adds to the
    template is an {{outlet}} expression for your child routes. It’s up to you to
    add the rest! Let’s look at another, more interesting template, the notebooks
    template:


    | [ch3/ember-note/app/notebooks/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch3/ember-note/app/notebooks/template.hbs)
    |


    | ​  | ​**<div>**​ |


    | ​  | ​**<div**​ class=​*"col-md-3"*​​**>**​ |


    | ​  | ​**<div>**​Notebooks​**</div>**​ |


    | ​  | ​**<div>**​ |


    | ​  | title: {{input value=title}} |


    | ​  | ​**<button**​ {{action ''addNotebook''}}​**>**​Add​**</button>**​ |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div>**​ |


    | ​  | ​**<ul>**​ |


    | ​  | {{#each model as &#124;notebook&#124;}} |


    | ​  | {{#link-to ''notebooks.notes'' notebook.id}} |


    | ​  | ​**<li>**​{{notebook.title}}​**</li>**​ |


    | ​  | {{/link-to}} |


    | ​  | {{else}} |


    | ​  | ​**<div>**​No notebooks found​**</div>**​ |


    | ​  | {{/each}} |


    | ​  | ​**</ul>**​ |


    | ​  | ​**</div>**​ |


    | ​  | ​**</div>**​ |


    | ​  | ​**<div**​ class=​*"col-md-9"*​​**>**​ |


    | ​  | {{outlet}} |


    | ​  | ​**</div>**​ |


    | ​  | ​**</div>**​ |


    Within the template, you see a mix of HTML and Handlebars expressions (which are
    anything within a double set of curly braces). This particular snippet includes
    a few HTML tags for structure, but most interesting are the Handlebars expressions.
    Let’s take a look at a very important one now.


    ### Linking Templates Together


    One Handlebars expression in this template is the {{#each}} expression. This represents
    a basic looping construct. Recall that each template is bound to one and only
    one route and controller. One purpose of a route is to provide data to its associated
    template. Here the route provides a list of zero to many notebook objects to the
    notebooks template. The {{#each}} expression is evaluated for each notebook object.
    If the route provides an empty list, the {{else}} segment of the expression will
    be evaluated, and the page will display “No notebooks found” to the user.


    The following code is then evaluated for each of the notebook objects within the
    list:


    | ​  | ​**<div>**​ |


    | ​  | {{#link-to ''notebooks.notes'' notebook.id}} |


    | ​  | {{notebook.title}}{{/link-to}} |


    | ​  | ​**</div>**​ |


    This is a {{link-to}} expression. At runtime, this {{#link-to}} snippet evaluates
    to roughly the following HTML:


    | ​  | ​**<a**​ id=​*"ember100"*​ class=​*"ember-view"*​ href=​*"notebooks/10/notes/1"*​​**>**​Notebook​**</a>**​
    |


    Let’s break down this link. The {{#link-to}} expression generates a route, including
    each of the necessary path segments. In this case, we are already on the notebooks
    route, having loaded it for a user with an id value of “10.” We’re trying to navigate
    from there to the notes child route, with a notebook with an id of “1.”


    While this HTML is interesting, it’s how Ember uses this link that matters most.
    When you click the link, Ember updates the current URL to http://localhost:4200/notebooks/1/notes/1
    (the numbers may vary slightly, but the other segments should be the same). Ember
    renders the notebooks template into the {{outlet}} in the application template,
    and the notes template into the {{outlet}} on the notebooks template. You can
    then add child routes to the notes route, and so forth.


    The following figure illustrates the relationship between URL segments and nested
    templates.


    ![images/route-diagram-1.png](images/route-diagram-1.png)


    The relationship between URLs and the exact location in the app, including the
    data loaded, is one of the killer features of Ember. When used this way, the URL
    becomes a complete representation of both the user’s current location (where in
    the app the user is) and the currently loaded data (which record is visible).
    The resulting URL will consistently display the same information when loaded,
    which enables easy sharing.


    When working with a real-world app, your goal is to present information to your
    users in a way that makes sense. That information will almost always have relationships
    between pieces of data, and those relationships result in a hierarchy. To display
    hierarchical data your user interface will have hierarchies of screens or widgets.
    In Ember, those screens or widgets are encapsulated by a template. So while a
    template is very nearly a stand-alone piece of functionality, you’ll also need
    to consider each template in relation to those near it.


    The ability to arrange templates in a hierarchy and use the URL to capture the
    state of the app are two of Ember’s most helpful features. But there’s a lot more
    about templates that is useful for developers. Next up, let’s take a look at how
    to use Handlebars expressions to render some standard HTML controls.


    ## Render HTML Controls with Expressions


    So far we’ve used some pretty vanilla controls to illustrate Ember’s templating
    system. But the Handlebars expression language and Ember’s helper classes are
    capable of rendering a great deal more variety than that.


    In this section we’ll go through the most useful controls available in Ember.
    We’ll start with how to use Ember to display static data, and then talk about
    conditionals and looping. Then we’ll visit input controls and wrap up by going
    over actions and links.


    ### Rendering Data


    The most fundamental use of Handlebars expressions is to simply display data from
    the route and its related controller. A controller is a class used to provide
    access to the data supplied via the route’s model hook. Recall that each template
    is bound to one and only one route. This is also true for controllers. Each controller
    maintains a set of properties, which are data that can be used by the template.
    Thus far, we haven’t needed to explicitly define a controller class and have relied
    on default functionality in the framework. However, if we want to display the
    data for a given controller property, we simply add it to an expression in our
    template, like this:


    | ​  | ​**<div>**​{{propertyName}}​**</div>**​ |


    Whatever data is held in that property will be displayed as static text on the
    page. If your controller looks like this:


    | ​  | ​**import**​ Ember from ​*''ember''*​ |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Ember.Controller.extend({ |


    | ​  | propertyName: ​*"A value"*​ |


    | ​  | }); |


    then the previous expression will render this:


    | ​  | ​**<div>**​A value​**</div>**​ |


    It’s possible for a controller to manage the data of just one record, which is
    called an ObjectController, or many records, which is called an ArrayController.
    In our example, the controller that backs the notebooks template is an ArrayController.
    If you have an ArrayController, you can render data from the list of records it
    manages by using the {{each}} expression, as we saw earlier in the chapter. Let’s
    now turn to Ember’s control flow expressions.'
