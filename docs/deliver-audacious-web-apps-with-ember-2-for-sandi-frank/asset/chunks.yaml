  trans: "\n\n这也引发了关于 Ember 默认结构的问题。每个独立的路由（route）恰对应一个模板（template）。对于应用路由，它是 `application.hbs`\
    \ 模板。对于我们生成的每个路由，如果你使用了 `--pod` 标记，它就是路由文件夹中定义的 `template.hbs` 模板；否则，模板将以路由命名，并位于\
    \ `templates` 文件夹中。\n\n### 创建登录路由 (Login Route)\n\n现在我们来创建登录路由。该路由需要让用户登录 EmberNote\
    \ 应用程序。它应该可以通过主页上的链接进行访问，就像之前的注册（register）路由一样，并允许之前注册的用户使用用户名登录。一旦他们登录成功，就应该被带到笔记本列表（这是我们到目前为止生成的另一个路由）。此外，一旦他们登录，注册和登录链接就不应该再显示了。\n\
    \n为了实现这一点，我们对对以下文件进行修改：\n\n*   `app/template/application.hbs`：添加导航，以允许用户加载登录路由，并在用户登录后隐藏注册和登录的导航。\n\
    *   `app/login/route.js`：定义登录动作（action）。\n*   `app/login/template.hbs`：定义登录路由的用户界面。\n\
    \n要到达登录路由，我们首先需要通过 `application.hbs` 文件使其可用。编辑该文件使其如下所示：\n\n| [ch2/ember-note/app/templates/application.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/templates/application.hbs)\
    \ |\n| :--- |\n| <div class=\"container\"> |\n| <div class=\"row\"> |\n| <div\
    \ class=\"col-md-2\"> |\n| Welcome to EmberNote |\n| </div> |\n| <div class=\"\
    col-md-10\"> |\n| {{#if user}} |\n| Hello, {{user.name}} |\n| {{/if}} |\n| {{#unless\
    \ user}} |\n| {{#link-to 'register'}}register{{/link-to}}&nbsp; |\n| {{#link-to\
    \ 'login'}}login{{/link-to}} |\n| {{/unless}} |\n| </div> |\n| </div> |\n| <div\
    \ class=\"row\"> |\n| <div> |\n| {{outlet}} |\n| </div> |\n| </div> |\n| </div>\
    \ |\n\n你对文件进行的第一个添加是 `{{#if}}` 表达式。该表达式包含的文本仅在表达式求值为真（true）时才会显示。在这种情况下，如果应用控制器（controller）的\
    \ `user` 属性有值，就会显示用户名。我们将在接下来查看登录路由时了解该属性是如何设置的。\n\n下一部分位于 `{{#unless}}` 表达式内部，当\
    \ `user` 属性缺失时显示。它包含了指向注册路由和我们新登录路由的 `{{#link-to}}` 导航项。当用户点击登录路由的链接时，他们会被带到 `localhost:4200/login`。登录模板被渲染到\
    \ `{{outlet}}` 中，这意味着该模板的内容显示在由 `{{outlet}}` 定义的占位符。定义在 `app/login/template.hbs`\
    \ 中的登录模板如下：\n\n| [ch2/ember-note/app/login/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/template.hbs)\
    \ |\n| :--- |\n| <div class=\"col-md-12\"> |\n| Login: <input value=name><button\
    \ action=\"login\">Login</button> |\n| </div> |\n\n这个模板是与登录路由关联的模板，它包含简单的元素。`{{input}}`\
    \ 表达式会显示一个 HTML 输入字段，并从 `name` 属性获取其值。`{{action}}` 表达式会导致在 `Route` 中执行登录动作，我们将在接下来定义它。\n\
    \n所有这些内容在登录路由类中串联在一起，如下所示：\n\n[ch2/ember-note/app/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/route.js)\n\
    ```javascript\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n\
    \  actions: {\n    login() {\n      this.store.query('user', {\n        name:\
    \ this.controller.get('name')\n      }).then((users) => {\n        if (users.get('length')\
    \ === 1) {\n          var user = users.objectAt(0);\n          this.controllerFor('application').set('user',user);\n\
    \          this.transitionTo('notebooks');\n        } else {\n          console.log('unexpected\
    \ query result');\n        }\n      });\n    }\n  }\n});\n```\n\n正如我们在第 1 章中看到的，这个\
    \ `Route` 类使用了 ES6 模块语法。类的第一行导入了 Ember 框架，然后在我们在类声明中扩展基础 `Route` 类时就会使用它。我们正在对\
    \ `Route` 进行匿名声明和导出。Ember CLI 获取文件路径并用它判断出该类虽然是匿名声明的，但代表了登录路由。\n\n下一个代码块定义了 `actions`\
    \ 哈希表，这是一个列动作名称及其实现的键值对列表。我们的登录路由只需要一个动作，即命名良好的 `login` 动作。\n\n正如在本章较早部分所述，`login`\
    \ 动作验证请求的用户是否已注册，然后显示用户的笔记本列表。接下来的代码块：\n\n```javascript\nthis.store.query('user',\
    \ {\n  name : this.controller.get('name')\n})\n```\n\n使用 `template.hbs` 中的 `name`\
    \ 字段的值对服务器 API 执行查询。接下来我们将更新 API。\n\n为了让你的登录路由工作，你需要对创建的模拟服务器进行小改。打开你的 `server/mocks/users.js`\
    \ 文件并按如下更新 `get` 端点：\n\n| [ch2/ember-note/server/mocks/users.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/server/mocks/users.js)\
    \ |\n| :--- |\n| usersRouter.get('/', function(req, res) { |\n| userDB.find(req.query).exec(function(error,users)\
    \ { |\n| res.send({ |\n| 'users': users |\n| }); |\n| }); |\n| });\n```\nEmber\
    \ CLI 会在你修改时部署更改，但如果由于某些原因没有，你可能需要在 `ember-note` 目录中运行 `ember serve` 命令以同步。完成后，访问登录路由并尝试登录\
    \ EmberNote。你应该会被重定向到笔记本路由。\n\n由于对 API 的 `store.find` 调用是异步的，它向登录路由返回一个 `Promise`\
    \ 对象。\n\n"
- fmt: "\nWe’ve covered more than just routes in this section to let us build a good\
    \ example. The key elements for you to focus on now are the `link-to` expression,\
    \ the `transitionTo` function, and the `actions` hash. As used in the `application.hbs`\
    \ template, the `link-to` expression allows the user to load the login route’s\
    \ `template.hbs` into the `outlet` in `application.hbs`, when the resulting link\
    \ is clicked. For this to work, we need the login route defined in `router.js`.\
    \ The `link-to` expression is one way of causing the parent route to load a child\
    \ route into its outlet.\n\nAnother way to implement navigation is by using functions\
    \ like `transitionTo` to move between routes. As used in the `login` route, it\
    \ takes the currently loaded route (as determined by the instance calling the\
    \ function), and replaces it with the route named in the function call. As noted\
    \ in our example, we can use this function to indicate not only which route to\
    \ load, but also which record it should load. We’ll see more on how the destination\
    \ route knows which record to load when we look at setting a route’s model shortly.\n\
    \nLast, the `actions` hash is used to define name-value pairs of actions and their\
    \ related functions. This concept isn’t route-specific, and we’ll see more examples\
    \ of this later, but it’s worth noting that one option for action handling is\
    \ to add your actions to a route in this way.\n\nNow we understand more of what\
    \ a route is and how it’s used, let’s take a look at how to use a route to load\
    \ and display data via the route’s model hook.\n\n## Set Your Model\n\nWhen we’re\
    \ working with a route, the `model` hook is used to load and supply the necessary\
    \ data. As we’ve seen, not every route will implement its `model` hook, but most\
    \ will. The `model` hook is a function, defined within an instance of a `Route`\
    \ class, that loads the data to be displayed by that route.\n\nIn the EmberNote\
    \ app, we haven’t yet built a route that makes use of the `model` hook. Let’s\
    \ do so now. When a user signs in via the `login` action, we use the `transitionTo`\
    \ function to transition to the `notebooks` route. Let’s define that route now,\
    \ and along the way we’ll see how to use the `model` hook.\n\nThe `notebooks`\
    \ route has a simple purpose: to display a list of the notebooks a user has created\
    \ in EmberNote. A notebook is a collection of notes, so clicking on a notebook\
    \ in the `notebooks` route will then display a list of that notebook’s notes.\
    \ Here’s the `notebooks` route:\n\n```javascript\nimport Ember from 'ember';\n\
    \nexport default Ember.Route.extend({\n  model: function(params) {\n    return\
    \ this.store.query('notebook',{user: params.user_id});\n  },\n  actions: {\n \
    \ }\n});\n```\n\nSimilar to the `login` route, `notebooks` uses the ES6 module\
    \ format and begins with the necessary import statement. Further, we defined it\
    \ using the `--pod` command-line flag, so the file is called `route.js` and resides\
    \ in the `app/notebooks` path, and the definition uses the `export default Ember.Route.extend`\
    \ form.\n\nThe `model` hook is the first block in the body of our `Route`. It’s\
    \ defined as a function, which is executed by Ember when the route is loaded.\
    \ You’ll also note that an object, known as `params`, is passed to this function.\
    \ We’ll come back to this shortly.\n\nThe body of the `model` hook contains some\
    \ Ember Data code to load the logged-in user’s notebooks. We’ll cover Ember Data\
    \ further in Chapter 5, so let’s focus on the route-specific portions of the code\
    \ now. This line of code causes Ember Data to query for notebook objects that\
    \ are owned by the user with `params.user_id`. So where does this `user_id` come\
    \ from?\n\nTo provide the `params` object to the route, and specifically the `user_id`,\
    \ we need to use a path segment in our route definition. Let’s look at the definition\
    \ of the `notebooks` route in the `router.js` file:\n\n```javascript\nthis.route('notebooks',\
    \ { path:'notebooks/:user_id'}, function() {});\n```\n\nThis is how you use the\
    \ `Router` class to define a route with a path segment. In Ember, a path segment\
    \ is used to provide a value that can be used to load a record in the route. For\
    \ this route, we’re using the id of the logged-on user to identify the notebooks\
    \ we want to load. Defining your route this way in the `Router` class, and then\
    \ using the `params` object in the `Route`, allows you to provide the data necessary\
    \ to load the notebooks. Of course, the object that initiated the navigation to\
    \ this route needs to add that data to the path in the first place. In our case,\
    \ we need to modify the `transitionTo` function in the `login` route:\n\n```javascript\n\
    this.transitionTo('notebooks', user);\n```\n\n> **Note**: Using path segments\
    \ to pass data between routes is a useful feature of Ember, but it’s easy to use\
    \ in a way that can be insecure. Placing clear data in URL is a direct object\
    \ vulnerability.\n\nNext, we need to define the mock service. To do this, run\
    \ the following command to create the service and populate the resulting file\
    \ with the following code:\n\n```javascript\nmodule.exports = function(app) {\n\
    \  var express = require('express');\n  var notebooksRouter = express.Router();\n\
    \  var bodyParser = require('body-parser');\n  app.use(bodyParser.json());\n \
    \ var nedb = require('nedb');\n  var notebookDB = new nedb({ filename: 'notebooks',\
    \ autoload: true});\n\n  notebooksRouter.get('/', function(req, res) {\n    notebookDB.find(req.query).exec(function(error,\
    \ notebooks) {\n      res.send({\n        'notebooks': notebooks\n      });\n\
    \    });\n  });\n\n  notebooksRouter.post('/', function(req, res) {\n    notebookDB.find({}).sort({id:\
    \ -1}).limit(1).exec(function(err, notebooks) {\n      if(notebooks.length !=\
    \ 0)\n        req.body.notebook.id = notebooks[0].id + 1;\n      else\n      \
    \  req.body.notebook.id = 1;\n      notebookDB.insert(req.body.notebook,function(err,newNotebook)\
    \ {\n        res.status(201);\n        res.send(\n          JSON.stringify({\n\
    \            notebook : newNotebook\n          })\n        );\n      });\n   \
    \ })\n  });\n\n  notebooksRouter.get('/:id', function(req, res) {\n    res.send({\n\
    \      'notebooks': {\n        id: req.params.id\n      }\n    });\n  });\n\n\
    \  notebooksRouter.put('/:id', function(req, res) {\n    res.send({\n```\n"
  raw: 'We’ve covered more than just routes in this section to let us build a good
    example. The key elements for you to focus on now are the {{#link-to}} expression,
    the transitionTo function, and the actions hash. As used in the application.hbs
    template, the {{#link-to}} expression allows the user to load the login route’s
    template.hbs into the {{outlet}} in application.hbs, when the resulting link is
    clicked. For this to work, we need the login route defined in router.js. The {{link-to}}
    expression is one way of causing the parent route to load a child route into its
    outlet.


    Another way to implement navigation is by using functions like transitionTo to
    move between routes. As used in the login route, it takes the currently loaded
    route (as determined by the instance calling the function), and replaces it with
    the route named in the function call. As noted in our example, we can use this
    function to indicate not only which route to load, but also which record it should
    load. We’ll see more on how the destination route knows which record to load when
    we look at setting a route’s model shortly.


    Last, the actions hash is used to define name-value pairs of actions and their
    related functions. This concept isn’t route-specific, and we’ll see more examples
    of this later, but it’s worth noting that one option for action handling is to
    add your actions to a route in this way.


    Now we understand more of what a route is and how it’s used, let’s take a look
    at how to use a route to load and display data via the route’s model hook.


    ## Set Your Model


    When we’re working with a route, the model hook is used to load and supply the
    necessary data. As we’ve seen, not every route will implement its model hook,
    but most will. The model hook is a function, defined within an instance of a Route
    class, that loads the data to be displayed by that route.


    In the EmberNote app, we haven’t yet built a route that makes use of the model
    hook. Let’s do so now. When a user signs in via the login action, we use the transitionTo
    function to transition to the notebooks route. Let’s define that route now, and
    along the way we’ll see how to use the model hook.


    The notebooks route has a simple purpose: to display a list of the notebooks a
    user has created in EmberNote. A notebook is a collection of notes, so clicking
    on a notebook in the notebooks route will then display a list of that notebook’s
    notes. Here’s the notebooks route:


    | [ch2/ember-note/app/notebooks/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/notebooks/route.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Ember.Route.extend({ |


    | ​  | model: ​**function**​(params) { |


    | ​  | ​**return**​ this.store.query(​*''notebook''*​,{user: params.user_id});
    |


    | ​  | }, |


    | ​  | actions: { |


    | ​  | } |


    | ​  | }); |


    Similar to the login route, notebooks uses the ES6 module format and begins with
    the necessary import statement. Further, we defined it using the --pod command-line
    flag, so the file is called route.js and resides in the app/notebooks path, and
    the definition uses the export default Ember.Route.extend form.


    The model hook is the first block in the body of our Route. It’s defined as a
    function, which is executed by Ember when the route is loaded. You’ll also note
    that an object, known as params, is passed to this function. We’ll come back to
    this shortly.


    The body of the model hook contains some Ember Data code to load the logged-in
    user’s notebooks. We’ll cover Ember Data further in Chapter 5, [​*Modeling Your
    Data*​](#f_0035.html_chp.models), so let’s focus on the route-specific portions
    of the code now. This line of code causes Ember Data to query for notebook objects
    that are owned by the user with params.user_id. So where does this user_id come
    from?


    To provide the params object to the route, and specifically the user_id, we need
    to use a path segment in our route definition. Let’s look at the definition of
    the notebooks route in the router.js file:


    | [ch2/ember-note/app/router.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/router.js)
    |


    | ​  | this.route(​*''notebooks''*​, { path:​*''notebooks/:user_id''*​}, ​**function**​()
    {}); |


    This is how you use the Router class to define a route with a path segment. In
    Ember, a path segment is used to provide a value that can be used to load a record
    in the route. For this route, we’re using the id of the logged-on user to identify
    the notebooks we want to load. Defining your route this way in the Router class,
    and then using the params object in the Route, allows you to provide the data
    necessary to load the notebooks. Of course, the object that initiated the navigation
    to this route needs to add that data to the path in the first place. In our case,
    we need to modify the transitionTo function in the login route to provide this
    data:


    | [ch2/ember-note/app/login/route.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/app/login/route.js)
    |


    | ​  | this.transitionTo(​*''notebooks''*​, user.get(​*''id''*​)); |


    With the correct data, we’re able to initiate a query against our API to get the
    current user’s notebook data.


    | Security Note |


    | --- |


    | ![images/aside-icons/tip.png](images/aside-icons/tip.png) | Using path segments
    to pass data between routes is an extremely useful feature of Ember, but it’s
    easy to use in a way that can be insecure. Placing cleartext data in your URL
    is a potential risk, given that it’s easy for a malicious user to change in an
    attempt to break your application’s security. This is known as a direct object
    reference vulnerability, and you can read more about it at [https://www.owasp.org/index.php/Top_10_2010-A4-Insecure_Direct_Object_References](https://www.owasp.org/index.php/Top_10_2010-A4-Insecure_Direct_Object_References).
    |


    Next, we need to define the notebook API. To do this, run the following command
    to create the mock service and provide a REST service to our route:


    | ​  | $ ember generate http-mock notebooks |


    We then populate the resulting file with the following code (I won’t go through
    the full explanation of what’s happening; it’s in essence the same code as we
    used for the users service in [​*Adding a Data Service*​](#f_0013.html_user-data-service)):


    | [ch2/ember-note/server/mocks/notebooks.js](http://media.pragprog.com/titles/mwjsember/code/ch2/ember-note/server/mocks/notebooks.js)
    |


    | ​  | module.exports = ​**function**​(app) { |


    | ​  | ​**var**​ express = require(​*''express''*​); |


    | ​  | ​**var**​ notebooksRouter = express.Router(); |


    | ​  | ​**var**​ bodyParser = require(​*''body-parser''*​); |


    | ​  | app.use(bodyParser.json()); |


    | ​  | ​**var**​ nedb = require(​*''nedb''*​); |


    | ​  | ​**var**​ notebookDB = ​**new**​ nedb({ filename : ​*''notebooks''*​, autoload:
    true}); |


    | ​  |  |


    | ​  | notebooksRouter.get(​*''/''*​, ​**function**​(req, res) { |


    | ​  | notebookDB.find(req.query).exec(​**function**​(error,notebooks) { |


    | ​  | res.send({ |


    | ​  | ''notebooks'': notebooks |


    | ​  | }); |


    | ​  | }); |


    | ​  | }); |


    | ​  |  |


    | ​  | notebooksRouter.post(​*''/''*​, ​**function**​(req, res) { |


    | ​  | notebookDB.find({}).sort({id : -1}).limit(1).exec( |


    | ​  | ​**function**​(err,notebooks) { |


    | ​  | ​**if**​(notebooks.length != 0) |


    | ​  | req.body.notebook.id = notebooks[0].id + 1; |


    | ​  | ​**else**​ |


    | ​  | req.body.notebook.id = 1; |


    | ​  | notebookDB.insert(req.body.notebook,​**function**​(err,newNotebook) { |


    | ​  | res.status(201); |


    | ​  | res.send( |


    | ​  | JSON.stringify( |


    | ​  | { |


    | ​  | notebook : newNotebook |


    | ​  | })); |


    | ​  | }); |


    | ​  | }) |


