  trans: "\n我们的第一个测试是“it saves”（保存）测试。正如我们在模型测试中看到的，该测试的第一项任务是创建被测试对象的实例。然后将其渲染到“屏幕”上。一旦完成这些设置工作，我们就会创建一个模拟对象（mock\
    \ object）来充当节点模型。这个模拟对象只需要一个方法：`save` 方法。在这种情况下，因为我们想验证组件是否正确调用了该方法，因此我们将断言放在了这个方法中。如果该方法被调用，将打印所引用的消息并且测试将通过。\n\
    \n创建好模拟对象后，我们使用 `Ember.run` 方法包裹 `component.set` 动作，因为由模型更改引起的重新渲染将异步发生并带有副作用（即更新\
    \ DOM）。然后，我们对命名的按钮对象强制执行点击操作。这将触发组件的 `saveNote` 动作，该动作本应该应该在模拟对象上运行 `save` 函数。由于它确实运行了，所以我们的测试通过了。\n\
    \n“it closes”（关闭）测试非常相似。我们获取组件实例，对其进行渲染，并创建一个包含我们想要运行的方法模拟对象。主要的区别在于我们连接测试对象的方式。\n\
    \n由于我们的赋值没有副作用，我们能够在不使用 `Ember.run` 循环的情况下运行它们。我们将模板的 `close` 参数的值设置为计划从模拟对象运行的函数，并将\
    \ `targetObject` 设置为我们的模拟对象。在运行的应用程序中，包含此组件的路由充当目标。由于 `closeNote` 动作使用 `sendAction`\
    \ 执行工作，测试中的点击会调用模拟对象中的 `closeAction`，我们的测试通过了。\n\n当然，你的组件可能会有不同的需要测试的自定义代码。这两个示例适用于某些组件特定的功能，例如确认组件是否正确处理了传入的模型，以及确认它是否正确处理了引用的动作。\n\
    \n正如我之前提到的，单元测试最适合测试与应用全局代码交互较少或需要复杂模拟的功能。我们尚未涵盖的主要对象类型是路由（routes）。我们不会在路由的单元测试上花费大量时间，是因为它们与应用全局代码有大量的交互。因此，它们是验收测试（acceptance\
    \ testing）的更佳人选。\n\n你可能会编写许多针对模型或组件之外的对象类型的单元测试。虽然细节会因实现而异，但思路是相同的。从 `Ember CLI`\
    \ 创建的测试蓝图开始，根据需要添加内容，以便在开发过程中确认你添加到类中的行为。\n\n单元测试对于低层级的工作非常棒，但在某些时刻，你将希望能够测试一个更完整的行为周期。为此，我们有了验收测试，接下来我们将查看它。\n\
    \n### 编写验收测试\n\n验收测试用于通过整个应用程序测试一系列事件，以确保获得正确的结果。这是遍历一组屏幕并对其进行测试的好方法。由于由于，我们需要在我们方面投入更多工作来让其运行，但它是确认功能甚至在添加代码时检测回归的强大方法。\n\
    \n在我们的案例，我们将处理一个相对较小的例子。我们将编写一个验收测试，以确认我们的注册路由能够正确注册有效用户。我们将创建一个测试，启动应用、导航到注册路由、填充字段并点击按钮，然后确认显示了正确的消息。\n\
    \n由于验收测试是如此针对你的应用程序定制的，因此它们不会在开发过程中由 `Ember CLI` 生成。要启动验收测试，请在项目根目录下运行以下命令：\n\n\
    ```bash\n$ ember generate acceptance-test register\n```\n\n此命令为命令命名的路由创建一个模板化的验收测试。让我们将其修改为如下所示：\n\
    \n| [ch8/ember-note/tests/acceptance/register-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/acceptance/register-test.js)\
    \ |\n\n```javascript\nimport Ember from 'ember';\nimport { module, test } from\
    \ 'qunit';\nimport startApp from 'ember-note/tests/helpers/start-app';\n\nvar\
    \ application;\n\nmodule('Acceptance | register', {\n  beforeEach: function()\
    \ {\n    application = startApp();\n  },\n  afterEach: function() {\n    Ember.run(application,\
    \ 'destroy');\n  }\n});\n\ntest('visiting /register', function(assert) {\n  visit('/register');\n\
    \n  fillIn('#name', 'test@pragprog.com');\n  click('#name');\n\n  andThen(function()\
    \ {\n    assert.equal(find('#message').text(), 'A user with test@pragprog.com\
    \ was added!');\n  });\n\n  assert.equal(currentURL(), '/register');\n});\n```\n\
