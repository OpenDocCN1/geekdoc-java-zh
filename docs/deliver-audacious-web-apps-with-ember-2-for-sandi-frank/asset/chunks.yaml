    # Chapter 5


    Modeling Your Data


    Ember has a lot to offer as a front-end web framework. So far, we’ve focused almost
    entirely on your app’s rendering and navigation. But as you build apps, you’ll
    eventually want to include data. Ember has a solution for that: Ember Data.


    Ember Data packs many things into one small library. It offers your web client
    a straightforward modeling approach to include simple records in your app. It
    reads from RESTful services, caches the data it loads, and persists these records
    back to the server.


    In this chapter you’ll learn how to use Ember Data to access data from a RESTful
    service. We’ll focus on an optimally designed RESTful service that requires little
    to no configuration from our app. By looking at all of the data-related code we’ve
    added to EmberNote so far, you’ll see how Ember Data works. Let’s start by looking
    at the model classes we’ve created so far.


    ## Define Your Models


    An Ember Data model class represents a record in some sort of persistent storage.
    Because we’re working on the web, it’s likely that this persistent storage is
    accessed via a RESTful API. An Ember Data record is an instance of a model class
    that actually holds data; a model is simply the definition of that record. The
    most important thing about a record is the data it maintains. Let’s look at how
    to define what data is maintained by a record.


    ### Defining a Model’s Fields


    As with each of the other classes we’ve created, we define models by first running
    an Ember CLI command to get a stub version of the class. In [​*Adding a Data Service*​](#f_0013.html_user-data-service),
    we ran the following command to generate our User model class.


    | ​  | $ ember generate model user |


    The stub version of this class had no fields. We’ll add them so that our class
    looks like this:


    | [ch5/ember-note/app/models/user.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/models/user.js)
    |


    | ​  | ​**import**​ DS from ​*''ember-data''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ DS.Model.extend({ |


    | ​  | name: DS.attr(​*''string''*​) |


    | ​  | }); |


    With Ember Data, your model definition is very simple. Your model has a set of
    fields that you define as key-value pairs in your class. The key is how you will
    reference the data from within your templates (that is, user.name).


    When you define a field, you have a few options for defining the field type. If
    you’re adding a field to hold a single value, you’ll use DS.attr. Calling this
    function creates a field in your model. Call this function with no parameters,
    and the model will simply accept whatever data type is passed to it.


    Alternatively, you can give it a type, known as a Transform, and Ember Data will
    take the raw data provided by your API and try to make it fit the type you provide.
    That’s what our user.js example does. Ember Data offers four available default
    choices: string, number, Boolean, and date. If needed, you can define your own
    Transform implementations, but we’ll get by with the basics for now.


    You can also define a default value for your field. For example, if your call
    to DS.attr looks like this:


    | ​  | name: DS.attr(​*"string"*​, {defaultValue: ​*"Matt"*​}) |


    the value Matt will be used if a given record doesn’t have a value for name.


    ### Defining Model Relationships


    Your model classes might have fields that contain a record, or even a list of
    records, rather than a basic data type. Ember Data makes this possible through
    the use of two constructs: DS.hasMany and DS.belongsTo. To see an example of this,
    let’s look at the notebook.js file:


    | [ch5/ember-note/app/models/notebook.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/models/notebook.js)
    |


    | ​  | ​**import**​ DS from ​*''ember-data''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ DS.Model.extend({ |


    | ​  | title: DS.attr(​*''string''*​), |


    | ​  | user: DS.belongsTo(​*''user''*​), |


    | ​  | notes: DS.hasMany(​*''note''*​) |


    | ​  | }); |


    Both the hasMany and belongsTo functions define a relationship between the calling
    class and another model definition. The argument to this function is the name
    of the other model’s class. In the notebook model example, we reference the user
    model from our belongsTo function and the note model from our hasMany function.
    Semantically, this makes sense: a notebook belongs to a user and has many notes.


    ![images/notebook-relationships.png](images/notebook-relationships.png)


    It is often desirable to traverse model relationships in both directions. For
    example, from the perspective of the note, you could include a belongsTo relationship
    back to the notebook. And from the user, you could include a hasMany relationship
    to the notebook.


    Of course, the cardinality of model relationships isn’t always a one-to-many or
    a many-to-one. If you want a one-to-one relationship, simply create both relationships
    using belongsTo. For a many-to-many, both sides should be a hasMany.


    Now that you have a better understanding of how to define a model class, you’ll
    need to learn how to populate them. Let’s take a look at how to load data from
    a server.


    ## Load Data from RESTful Services


    When using Ember to build your apps, it’s very likely that your data will come
    from a RESTful service. A RESTful service uses HTTP as a data query and delivery
    mechanism. Based on HTTP requests, it can be used to return data to the calling
    logic, or to modify a data store in some manner.


    The Ember project is very keen on adapting the best ideas from the web community
    into the Ember framework, and Ember Data’s use of RESTful services is no exception.
    By simply declaring your model class, you are able to use the DS.Store object
    to get data from your server, assuming that the RESTful service exposes the expected
    API.


    Although we won’t dig too deeply into the implementation of a RESTful service,
    throughout the rest of the chapter we’ll note the URL to which Ember Data makes
    requests. In [​*Use Serializers to Access Legacy APIs*​](#f_0042.html_serializers),
    we’ll cover how to use Ember Data to access APIs that don’t follow the expected
    conventions.


