    \          {\n            note : newNote\n          }));\n      );\n      })\n\
    \    });\n  });\n\n  notesRouter.get('/::id', function(req, res) {\n    res.send({\n\
    \      'notes': {\n        id: req.params.id\n      }\n    });\n  });\n\n  notesRouter.put('/::id',\
    \ function(req, res) {\n    var id = parseInt(req.params.id);\n    noteDB.update({id:\
