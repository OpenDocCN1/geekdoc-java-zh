  trans: "\n\n在本节中，我们涵盖的内容不仅仅是路由（routes），以便我们构建一个良好的示例。你现在需要关注的关键元素是 `link-to` 表达式、`transitionTo`\
    \ 函数以及 `actions` 哈希表（hash）。如 `application.hbs` 模板中使用所示，`link-to` 表达式允许用户在点击生成的链接时，将登录路由的\
    \ `template.hbs` 加载到 `application.hbs` 中的 `outlet` 中。为了实现这一功能，我们需要在 `router.js`\
    \ 中定义登录路由。`link-to` 表达式是让父路由将子路由加载到其 outlet 中的一种方法。\n\n实现导航的另一种方法是使用如 `transitionTo`\
    \ 等函数在路由之间移动。如在 `login` 路由中使用所示，它获取当前加载的路由（由调用该函数的实例确定），并用函数调用中命名的路由替换它。正如我们的示例中提到的，我们可以使用此函数不仅指示要加载哪个路由，还可以指示它应该加载哪条记录。稍后当我们查看设置路由模型时，我们将看到更多关于目标路由如何知道加载哪条记录的细节。\n\
    \n最后，`actions` 哈希表用于定义动作及其相关函数的键值对。这个概念并不是特定于路由的，稍后我们会看到更多示例，但值得注意的是，处理动作的一种选项就是通过这种方式将你的动作添加到路由中。\n\
    \n现在我们更深入地理解了什么是路由以及如何使用它，让我们来看看如何通过路由的模型钩子（model hook）来加载和显示数据。\n\n## 设置你的模型\
    \ (Set Your Model)\n\n当我们处理路由工作时，`model` 钩子用于加载并提供必要的数据。正如我们看到的，并不是每个路由都会实现其 `model`\
    \ 钩子，但大多数路由都会。`model` 钩子是一个函数，定义在 `Route` 类的实例内部，用于加载由该路由要显示的数据。\n\n在 EmberNote\
    \ 应用中，我们还没有构建过使用 `model` 钩子的路由。让我们现在就这样做吧。当用户通过 `login` 动作登录时，我们使用 `transitionTo`\
    \ 函数跳转到 `notebooks` 路由。让我们现在定义该路由，在此过程中我们将看到如何使用 `model` 钩子。\n\n`notebooks` 路由有一个简单的目的：显示用户在\
    \ EmberNote 中创建的笔记本（notebooks）列表。笔记本是笔记的集合，因此在 `notebooks` 路由中点击笔记本将显示该笔记本的笔记列表。以下是\
    \ `notebooks` 路由：\n\n```javascript\nimport Ember from 'ember';\n\nexport default\
    \ Ember.Route.extend({\n  model: function(params) {\n    return this.store.query('notebook',{user:\
    \ params.user_id});\n  },\n  actions: {\n  }\n});\n```\n\n与 `login` 路由类似，`notebooks`\
    \ 使用 ES6 模块格式并以必要的 import 语句开头。此外，我们使用 `--pod` 命令行标记定义了它，因此文件名为 `route.js` 并位于\
    \ `app/notebooks` 路径，且定义使用了 `export default Ember.Route.extend` 形式。\n\n`model`\
    \ 钩子是我们的 `Route` 主体中的第一个块。它被定义为一个函数，由 Ember 在路由加载时执行执行。你还会注意到一个名为 `params` 的对象被传递给这个函数。我们稍后会回到这一点。\n\
    \n`model` 钩子的正体包含了一些 Ember Data 代码，用于加载登录用户的笔记本。我们将在第 5 章进一步介绍 Ember Data，所以现在让我们关注代码中特定于路由的部分。这行代码导致\
    \ Ember Data 查询由 `params.user_id` 用户拥有的笔记本对象。那么这个 `user_id` 从哪里来呢？\n\n为了向路由提供\
    \ `params` 对象，特别是 `user_id`，我们需要在路由定义中使用路径分段（path segment）。让我们看看 `router.js` 文件中\
    \ `notebooks` 路由的定义：\n\n```javascript\nthis.route('notebooks', { path:'notebooks/:user_id'},\
    \ function() {});\n```\n\n这就是你如何使用 `Router` 类定义带有路径段的路由。在 Ember 中，路径段用于提供一个可以用于在路由中加载记录的值。对于此路由，我们正在使用登录用户的\
    \ ID 来标识我们想要加载的笔记本。在 `Router` 类中这样定义你的路由，然后在 `Route` 中使用 `params` 对象，可以允许你提供加载笔记本所需的数据。当然，发起导航到此路由的对象首先需要将该数据添加到路径中。在我们的案例中，我们需要修改\
    \ `login` 路由中的 `transitionTo` 函数：\n\n```javascript\nthis.transitionTo('notebooks',\
    \ user);\n```\n\n> **注意**：使用路径段在路由之间传递数据是 Ember 的一个有用功能，但很容易以不安全的方式使用。在 URL 中放置明文数据是一个直接的对象漏洞。\n\
    \n接下来，我们需要定义模拟服务（mock service）。要此此，运行以下命令创建服务，并将生成的文件填充以下代码：\n\n```javascript\n\
    module.exports = function(app) {\n  var express = require('express');\n  var notebooksRouter\
    \ = express.Router();\n  var bodyParser = require('body-parser');\n  app.use(bodyParser.json());\n\
    \  var nedb = require('nedb');\n  var notebookDB = new nedb({ filename: 'notebooks',\
    \ autoload: true});\n\n  notebooksRouter.get('/', function(req, res) {\n    notebookDB.find(req.query).exec(function(error,\
    \ notebooks) {\n      res.send({\n        'notebooks': notebooks\n      });\n\
    \    });\n  });\n\n  notebooksRouter.post('/', function(req, res) {\n    notebookDB.find({}).sort({id:\
    \ -1}).limit(1).exec(function(err, notebooks) {\n      if(notebooks.length !=\
    \ 0)\n        req.body.notebook.id = notebooks[0].id + 1;\n      else\n      \
    \  req.body.notebook.id = 1;\n      notebookDB.insert(req.body.notebook,function(err,newNotebook)\
    \ {\n        res.status(201);\n        res.send(\n          JSON.stringify({\n\
    \            notebook : newNotebook\n          })\n        );\n      });\n   \
    \ })\n  });\n\n  notebooksRouter.get('/:id', function(req, res) {\n    res.send({\n\
    \      'notebooks': {\n        id: req.params.id\n      }\n    });\n  });\n\n\
    \  notebooksRouter.put('/:id', function(req, res) {\n    res.send({\n```\n\n"
