- fmt: "\n```javascript\nnotebook.save().then(() => {\n  console.log('save successful');\n\
    \  this.controller.set('title', null);\n  this.refresh();\n}, function() {\n \
    \ console.log('save failed');\n});\n} });\n```\n\nThis change allows us to use\
    \ the user record stored in the session when we save a new notebook.\n\nIf the\
    \ `serialize` method takes data from `Ember Data`’s expected format and converts\
    \ it so the API can consume it, the `normalize` method does the opposite. We’re\
    \ already making use of this in our `RESTSerializer`. Let’s see how.\n\n### Normalizing\
    \ Data\n\nThe `normalize` method is defined in the base implementation of `RESTSerializer`.\
    \ It is this implementation that we rely on. Because we’re performing a fairly\
    \ straightforward normalization of our data and changing the case of the keys,\
    \ all we need to do is define this function. Let’s look again at the code:\n\n\
    ```javascript\nnormalize: function(typeClass, hash, prop) {\n  hash.title = hash.Title;\n\
    \  delete hash.Title;\n  hash.user = hash.User;\n  delete hash.User;\n  return\
    \ this._super(typeClass, hash, prop);\n}\n```\n\nThis function is simple: it maps\
    \ the values held in class-cased keys onto the corresponding camel-cased keys,\
    \ then deletes the class-cased entries.\n\nAt times there may be other work that\
    \ you want to do in the `normalize` function, such as deleting unnecessary data\
    \ points or adding new data. The following assigns a property in your payload\
    \ with the current time.\n\n```javascript\nnormalize: function(type, hash, prop)\
    \ {\n  hash['currentTime'] = new Date();\n  this._super(type, hash, prop);\n}\n\
    ```\n\nThese parameters represent the data type (that is, the model class), the\
    \ name of the hash key to use (such as \"notebooks\" in our previous example),\
    \ and the payload returned from the server. It’s important to remember to call\
    \ `this._super` with the parameters to ensure that the superclass `normalize`\
    \ method is called and your defined `normalizeHash` operations are run.\n\n###\
    \ Allow the Adapter to Query a Nonconventional API\n\nAt this point, the changes\
    \ you’ve made to the serializer will let you save into the new API’s format, but\
    \ you won’t be able to query data. Before you can query, you need to create a\
    \ new `RESTAdapter` for your notebook model. To begin, run the following command:\n\
    \n```bash\n$ ember generate adapter notebook\n```\n\nThis creates a stub class\
    \ at `ember-note/app/adapters/notebook.js`.\n\nThe reason we need to create a\
    \ new adapter is to account for the difference in case between the attribute names\
    \ in our model class and the attribute names in the API. Without creating this\
    \ adapter, a query parameter of `{user : 1}` will find no records because the\
    \ attribute in the API is called `User`. To address this, implement the adapter\
    \ class as follows `ch6/ember-note/app/adapters/notebook.js`:\n\n```javascript\n\
    import ApplicationAdapter from './application';\nimport Ember from 'ember';\n\n\
    export default ApplicationAdapter.extend({\n  query: function(store, query) {\n\
    \    var keys = Object.keys(query);\n    for (var i = 0; i < keys.length; i++)\
    \ {\n      var key = keys[i];\n      var classifiedKey = Ember.String.classify(key);\n\
    \      query[classifiedKey] = query[key];\n      delete query[key];\n    }\n \
    \   return this._super(store, query);\n  }\n});\n```\n\nWe’re extending the `query`\
    \ method to intercept queries before they get to the server. This is the method\
    \ that’s called on the adapter when we query using a hash, as we do in the notebooks\
    \ route. Our code takes the key-value pairs with the keys in camel-case, and replaces\
    \ them with key-value pairs in the case expected by the API. It then passes control\
    \ to the superclass method. This enables our query to be properly recognized by\
    \ the API. If you log in the app, you should be able to add new notebooks, and\
    \ see the new notebooks in your list, just as they did before we changed the back-end\
    \ API.\n\n### Adapt Path Variations\n\nNot only is there a means of changing the\
    \ attribute names using `RESTAdapter`, but you can alter the path as well. By\
    \ default, `Ember Data` attempts to pluralize the name of the class to arrive\
    \ at the API path, so a model class called `notebook` will use endpoint of `notebooks`.\
    \ For any number of reasons, this may not be accurate. If so, you can use the\
    \ `pathForType` method to address this need, like this:\n\n```javascript\npathForType:\
    \ function(type) {\n  if (type === 'notebook') {\n    return 'poorly-named-endpoint';\n\
    \  }\n}\n```\n\nAs you can see, this method takes the model class name as an argument,\
    \ and converts it into either a different value altogether or somehow modified\
    \ version of the name by changing the case, adding underscores, and so forth.\
    \ This allows you to adapt to variations in naming conventions on the endpoint\
    \ URL.\n\n### Change the Payload Root\n\nThere’s a similar method in `RESTSerializer`\
    \ that allows you to accept a JSON payload from the server and determine the correct\
    \ type based on the name of the root key. Take the following payload:\n\n```json\n\
    {\n  \"Notebooks\" : {\n    //Your payload data here\n  }\n}\n```\n\nIf you implement\
    \ the `modelNameFromKey` function, you can alter the value of the root key, which\
    \ allows `Ember Data` to properly look up the associated model class and handle\
    \ the payload accordingly, like this:\n\n```javascript\nmodelNameFromPayloadKey:\
    \ function(root) {\n  return Ember.String.camelize(root);\n}\n```\n\nThis converts\
    \ \"Notebooks\" into \"notebooks\" and allows `Ember Data` to find the appropriate\
    \ model class to use for the payload.\n\nOf course, to save back to the server,\
    \ you’ll need to reverse the action you took in `modelNameFromPayloadKey`. You\
    \ can implement this in `payloadKeyFromModelName`:\n\n```javascript\npayloadKeyFromModelName:\
    \ function(modelName) {\n  return Ember.String.classify(modelName);\n}\n```\n\n\
    This converts \"notebooks\" back to \"Notebooks\", which lets you save the payload\
    \ back into a server with that expected format.\n\n### Modify the Payload in Flight\n\
    \nWe’ve covered most of the scenarios you’re likely to see when working with a\
    \ RESTful API. There is one last scenario, though. You may need to use an API\
    \ that is only capable of returning composite records, such as an API response\
    \ that includes child records as a child node in your JSON payload, rather than\
    \ as a separate node altogether.\n\nLet’s say that a query to our notebooks API\
    \ returned data in the following format:\n\n```json\n{\n  \"notebooks\": {\n \
    \   \"id\": 1,\n    \"title\": \"notebook one\",\n    \"description\": \"description\
    \ one\",\n    \"notes\": [{\n      \"id\": 1,\n      \"title\": \"note one\",\n\
    \      \"description\": \"description one\"\n    },\n    {\n      \"id\": 2,\n\
    \      \"title\": \"note two\",\n      \"description\": \"description two\"\n\
    \    }]\n  }\n}\n```\n\nNote that the `notes` node is nested inside the `notebooks`\
    \ object. This is not the format `Ember Data` expects for the payload. `Ember\
    \ Data`’s expectation is that the same information should have have the following\
    \ payload structure:\n\n```json\n{\n  \"notebooks\": {\n    \"id\": 1,\n    \"\
    title\": \"notebook one\",\n    \"description\": \"description one\",\n    \"\
    notes\": [1, 2]\n  },\n  \"notes\": [{\n    \"id\": 1,\n    \"title\": \"note\
    \ one\",\n    \"description\": \"description one\"\n  },\n  {\n    \"id\": 2,\n\
    \    \"title\": \"note two\",\n    \"description\": \"description two\"\n  }]\n\
    }\n```\n"
