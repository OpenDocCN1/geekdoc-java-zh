    | ​  | ​**return**​ !(value === undefined |


    | ​  | &#124;&#124; value.length <= min &#124;&#124; value.length > max); |


    | ​  | }, |


    | ​  | isValidEmail: ​**function**​(value) { |


    | ​  | ​**var**​ pattern = /^​*\w*​+([\.-]?​*\w*​+)*@​*\w*​+([\.-]?​*\w*​+)*(\.​*\w*​{2,3})+$/;
    |


    | ​  | ​**return**​ value.match(pattern); |


    | ​  | } |


    | ​  | }); |


    This mixin consists of two functions: isValidLength and isValidEmail. The isValidLength
    function is nearly identical to the version of this function defined in ember-note/app/utils/is-valid-length.js.
    The only substantial difference is that the version of it in the mixin is a property
    of the Mixin object, whereas the utility version stands on its own.


    Regular Expressions


    The isValidEmail function uses a regular expression to determine if the passed-in
    string represents an email address. Regular expressions are a means of capturing
    the expected format of a piece of data, called a pattern, and then using that
    to verify whether an actual piece of data follows that format.


    As you can see from the pattern variable in isValidEmail, a regular expression
    often takes the form of a complex-looking string of characters, and these patterns
    can often grow to an unexpectedly large size. In our earlier example, the email
    validation is only 48 characters, but it doesn’t allow for new top-level domains,
    such as .museum, to be used. There are alternative patterns for validating an
    email address that run into the thousands of characters. Given this complexity,
    you could argue that you’re better off just trying to send a confirmation email
    to make sure the address is valid.


    The point is, regular expressions are extremely useful but getting them right
    is challenging. If you need to use regular expressions, be prepared to write fairly
    robust test cases, and then expand on them as issues arise. We could probably
    spend an entire book on regular expressions, so my advice is to use them judiciously.


