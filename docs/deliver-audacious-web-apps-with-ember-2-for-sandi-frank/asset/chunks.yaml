  trans: "\n\n但 `Router.map` 才是戏发生的地方。如你所见，我们已经创建了一个名为 `register` 的路由。当我们运行 `ember\
    \ generate route register --pod` 命令时，该路由被添加到了 `Router` 中。系统还生成了其他文件，稍后我们将编辑这些文件来创建注册功能。`register`\
    \ 路由看起来是一个顶层路由，但实际上它位于应用程序默认路由下的第一层子路由。让我们通过其关联模板来看这个默认路由。\n\n#### application.hbs\n\
    \n每个应用程序都有一个根路由，即 `Application` 路由。此外，每个路由都对应且仅一个模板。模板是用户界面的一部分。在应用程序路由的情况下，这个模板定义在\
    \ `application.hbs` 中。现在让我们修改这个模板，使其看起来如下所示：\n\n```html\n<div class=\"container\"\
    >\n  <div class=\"row\">\n    <div class=\"col-md-2\">\n      Welcome to EmberNote\n\
    \    </div>\n    <div class=\"col-md-10\">\n      {{#link-to 'register'}}register{{/link-to}}\n\
    \    </div>\n  </div>\n  <div class=\"row\">\n    <div>\n      {{outlet}}\n  \
    \  </div>\n  </div>\n</div>\n```\n\n每个 Ember 模板都是 HTML 和 Handlebars 表达式语言的混合，后者是用\
    \ `{{ }}` 字符分隔的代码部分。Handlebars 是 Ember 使用的表达式语言，用于描述 Ember 模板中与 Ember 应用程序代码相关的某些片段。你将在书中看到许多\
    \ Ember 使用 Handlebars 表达式的示例，它们始终使用 `{{ }}` 字符。Ember 附带了一个编译器，可以将 Handlebars 模板表达式转换为\
    \ DOM 对象，正如我们在编译模板 中将看到的。\n\n正如我们之前看到的，每个应用都由路由层次结构组成。`application.hbs` 文件中的 `{{#link-to}}`\
    \ 表达式用于生成超链接，点击该链接会将 `register` 路由加载到 `{{outlet}}` 中。\n\n你可能在想 `Application` 路由在哪里定义的。在这种特定情况下，由于我们没有任何特定的操作处理或数据加载需要完成，因此不需要定义路由类；我们可以简单地依靠\
    \ Ember 使用默认路由行为动态创建路由实现。\n\n到为止我们看到的所有代码都搭建了应用程序最基础的配置。现在，让我们看看如何通过构建 `register`\
    \ 路由为我们的应用添加功能。\n\n### 构建 Register 路由\n\n如之前讨论，`register` 路由将允许用户通过选择用户名来注册 EmberNote\
    \ 应用程序。当我们使用 CLI 创建此路由时，创建了以下文件（注意，这是 `route.js`，它与 `router.js` 不同）：\n\n```javascript\n\
    import Ember from 'ember';\n\nexport default Ember.Route.extend({\n});\n```\n\n\
    这就是定义一个空路由类的方式。路由存在两个主要原因：加载要由路由显示的数据以及响应操作。在我们的情况下，我们没有数据要显示，并且我们需要定义一个 `addNew`\
    \ 操作向应用中添加新用户。我们稍后会回到该操作。首先，让我们看看用户界面看起来什么样。这是我们路由的模板文件，已添加了必要的 UI 代码：\n\n```html\n\
    <div class=\"col-md-12\">\n  Register new user: {{input value=name}}\n  <button\
    \ {{action 'addNew'}}>Add</button>\n</div>\n<div class=\"col-md-12\">\n  {{message}}\n\
    </div>\n```\n\n`{{input}}` 字段允许我们输入名称。带有 `{{action 'addNew'}}` 的 `<button>` 会触发\
    \ `addNew` 操作。`{{message}}` 显示操作状态。\n\n`register` 路由将允许用户通过选择用户名来注册 EmberNote\
    \ 应用程序。当我们使用 CLI 创建此路由时，创建了以下文件（注意，这是 `route.js`，它与 `router.js` 不同）：\n\n```javascript\n\
    import Ember from 'ember';\n\nexport default Ember.Route.extend({\n});\n```\n\n\
    这就是定义一个空路由类的方式。路由存在两个主要原因：加载要由路由显示的数据以及响应操作。在我们的情况下，我们没有数据要显示，并且我们需要定义一个 `addNew`\
    \ 操作向应用中添加新用户。\n\n"
- fmt: "\nEmber and Ember CLI offer two ways to provide data to your app during development:\
    \ fixtures and mock services. While fixtures are easier to set up, mock services\
    \ offer you the ability to more fully test your code by requiring you to implement\
    \ everything required to access a RESTful service. So we use mock services in\
    \ this book. If you’re more concerned with testing your core Ember classes, and\
    \ you’re not worried about data access layer testing, you might consider fixtures,\
    \ which are essentially classes with hardcoded data and simple access methods.\n\
    \nIn fact, we go an extra step beyond mock services: our services will persist\
    \ data across a restart so that as we build the app we’ll also see data accumulate.\
    \ The default mock services created by Ember CLI don’t do this, and although this\
    \ behavior might be preferable for developing an app under normal circumstances,\
    \ I’d prefer that our data survive a service restart so that our test data is\
    \ maintained as we work through the examples. So, let’s see how a mock service\
    \ works.\n\n## Creating the Model\n\nWe start by creating a model class for our\
    \ user object. At the moment, our user consists of one data attribute: the name.\
    \ Let’s use Ember CLI to generate a stub class.\n\n```\n$ ember generate model\
    \ user\n```\n\nHere’s the class, with implementation details added in:\n\n[ch1/ember-note/app/models/user.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/models/user.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n\
    \  name: DS.attr('string')\n});\n```\n\nThis class relies on the Ember Data libraries\
    \ to create an instance of a Model, with a single attribute called `name`. This\
    \ attribute has a type of string, meaning it will hold text. That’s it. This is\
    \ all we need to model our user object. Now, to interact with the service we’re\
    \ planning to create, we need a `RESTAdapter` and a `RESTSerializer`.\n\n## Creating\
    \ the Adapter and Serializer\n\nTo create our `RESTAdapter`, run the following\
    \ command:\n\n```bash\n$ ember generate adapter application\n```\n\nThis creates\
    \ a `RESTAdapter` that will be used by the entire application, which is why we\
    \ named it `application`. Now, edit the resulting file so it looks like this:\n\
    \n[ch1/ember-note/app/adapters/application.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/adapters/application.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.RESTAdapter.extend({\n\
    \  namespace: 'api'\n});\n```\n\nSimilarly, to create the `RESTSerializer`, run\
    \ this command:\n\n```bash\n$ ember generate serializer application\n```\n\nAnd\
    \ the resulting class will look like this:\n\n[ch1/ember-note/app/serializers/application.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/serializers/application.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.RESTSerializer.extend({});\n\
    ```\n\nThe `RESTAdapter` has just one purpose: to define the path on the server\
    \ where we can find our RESTful service. The `RESTSerializer` is an empty implementation,\
    \ as we’re using default functionality. Because we’re going to create a service\
    \ that exposes the expected API for each model object, this is all we need to\
    \ do. We’ll see a lot more on these in [Adapt to a Nonconventional API](#f_0041.html_adapters)\
    \ and [Use Serializers to Access Legacy APIs](#f_0042.html_serializers).\n\nGenerally,\
    \ this is where your Ember development would stop. Creating a service to provide\
    \ data is generally out of the scope of what you’d be doing with Ember, which\
    \ is a front-end framework, and not for developing REST services. As I said earlier,\
    \ we’re creating a mock service that our app can use for testing and then taking\
    \ it one step further by making the data persistent.\n\n## Making Data Persistent\n\
    \nTo make our data persistent, we need to be able to do two things that we can’t\
    \ do just yet. First, we need a place to put the data. For that we’ll use the\
    \ NEDB project, which is an embedded datastore for use with Node. This is a great\
    \ tool to use for development datastores, such as ours. You’ll likely want something\
    \ more robust for production datastores. Run the following command from within\
    \ your `ember-note` directory (the `--save-dev` flag makes this a dev-only dependency,\
    \ not a production dependency):\n\n```bash\n$ npm install nedb --save-dev\n```\n\
    \nThis makes the NEDB project available. When the Ember Data store saves our new\
    \ user record in the register route, it POSTs data to our mock service over HTTP.\
    \ So we also need to be able to parse the body of the incoming HTTP request. Get\
    \ the following library to do this:\n\n```bash\n$ npm install body-parser --save-dev\n\
    ```\n\nNow we’re ready to create our mock service by running the following command:\n\
    \n```bash\n$ ember generate http-mock\n```\n\nWith our service created, we just\
    \ need to add a few lines of code to use the libraries we just added, and to respond\
    \ to request. Look at the following code, which makes data persist NEDB:\n\n```javascript\n\
    module.exports = function(app) {\n  var express = require('express');\n  var usersRouter\
    \ = express.Router();\n\n  // Use body-parser in this service\n  var bodyParser\
    \ = require('body-parser');\n  app.use(bodyParser.json());\n\n  // Create an embedded\
    \ datastore if it doesn't exist\n  var nedb = require('nedb');\n  var userDB =\
    \ new nedb({ filename: 'users', autoload: true});\n\n  // The POST URL is used\
    \ to create a record\n  userRouter.post('/', function(req, res) {\n    // Look\
    \ for most created record and use it to set the id\n    // field of incoming request,\
    \ which is required by Ember\n    userDB.find({}).sort({id: -1}).limit(1).exec(function(err,\
    \ users) {\n      if (users.length != 0)\n        req.body.id = users[0].id +\
    \ 1;\n      else\n        req.body.id = 1;\n\n      // Insert the new record into\
    \ datastore, and return the newly\n      // created record to Ember\n      userDB.insert(req.body,\
    \ function(err, newUser) {\n        res.status(201);\n        res.send(JSON.stringify({\n\
    \          user: newUser\n        }));\n      });\n    });\n  });\n\n  // For\
    \ now, we won't touch the rest of this code, which was created by\n  // Ember\n\
    \  userRouter.get('/', function(req, res) {\n    res.send({\n      users: []\n\
    \    });\n  });\n\n  userRouter.get('/:id', function(req, res) {\n    res.send({\n\
    \      users: {\n        id: req.params.id\n      }\n    });\n  });\n\n  userRouter.put('/:id',\
    \ function(req, res) {\n  });\n\n  userRouter.delete('/:id', function(req, res)\
    \ {\n    res.status(204).end();\n  });\n\n  app.use('/api/users', usersRouter);\n\
    };\n```\n\nAnd with that, we’re ready to try out our register feature. If it’s\
    \ not already running, go to a command line and start your app by running the\
    \ following (if it’s already running, you may want to stop it by pressing Ctrl-C,\
    \ then start it again):\n\n```bash\n$ ember serve\n```\n\nThen navigate to localhost:4200,\
    \ click the register link, provide a username, and click Add. You should see a\
    \ message that says your user was added, as shown here.\n\n![images/new-user.png](images/new-user.png)\n\
    \nIf you want to verify, you can look at the users file in the ember-note directory.\
    \ You should see something like this:\n"
