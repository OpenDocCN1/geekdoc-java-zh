    \ = this.subject({ title: 'my notebook' });\n  var note;\n  var noteCount = Math.floor(Math.random()\
    \ * (10 - 1) + 1);\n\n  Ember.run(() => {\n    for (var i = 0; i < noteCount;\
    \ i++) {\n      note = this.store().createRecord('note');\n      notebook.get('notes').addObject(note);\n\
    \    }\n  });\n\n  assert.equal(notebook.noteCount(),noteCount);\n});\n```\n\n\
    First, we’ll need to modify our imports to include the `Ember` class. (We’ll see\
