    The reason we need to create a new adapter is to account for the difference in
    case between the attribute names in our model class and the attribute names in
    the API. Without creating this adapter, a query parameter of {user : 1} will find
    no records because the attribute in the API is called User. To address this, implement
    the adapter class as follows:


    | [ch6/ember-note/app/adapters/notebook.js](http://media.pragprog.com/titles/mwjsember/code/ch6/ember-note/app/adapters/notebook.js)
