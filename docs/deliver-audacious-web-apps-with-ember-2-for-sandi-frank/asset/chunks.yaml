  trans: "\n\n为了实现这一点，Ember Data 有了一系列类，用于将非标准的 API 适配以符合 Ember 其他部分期望的惯例。这可能简单到将属性名称从一种命名规范转换为另一种，也复杂到使用\
    \ Ember Data 在传输过程中修改 JSON。\n\n在本章中，我们将看一眼如何使用 Ember Data 来处理你可能遇到的任何标准或非标准 API。\n\
    \n## 适配非惯用 API\n\n到目前为止，EmberNote API 使用了 Ember Data 期望 API 遵循的惯例。在本章中，我们首先创建一个不遵循传统惯例的\
    \ EmberNote API 并版本。然后，我们将使用新版本来学习如何让 Ember Data 适配此类 API。\n\n要开始此过程，你需要为我们创建的每个模拟服务器文件创建一个副本。获取\
    \ `ember-note/server/mocks` 目录中的每个文件，复制它，并在文件扩展名之前的文件名后添加 `-alt-api`，因此 `notes.js`\
    \ 变成 `notes-alt-api.js`。不要忘记保留原文件在位。在每个 `-alt-api` 文件中，当我们创建 NEDB 数据文件时，通过在名称后添加\
    \ `-alt` 来更改数据文件的名称，如下：\n\n```javascript\nvar noteDB = new nedb({ filename : 'notes-alt',\
    \ autoload: true});\n```\n\n然后，在每个新文件的底部，将监听器 URL 修改为包含 `api` 路径段：\n\n```javascript\n\
    app.use('/api/alt/notes', notesRouter);\n```\n\n运行 `ember serve` 命令确保你的应用使用新 API\
    \ 启动。\n\n### 为你的 API 添加请求头\n\n随着这个新 API 的运行，让我们如下所示修改 `RESTAdapter`：\n\n```javascript\n\
    import DS from 'ember-data';\n\nexport default DS.RESTAdapter.extend({\n  namespace:\
    \ 'api/alt',\n});\n```\n\n对 `namespace` 的这一简单更改将导致适配器向备用 API 端点发送请求。如果你现在在浏览器中加载\
    \ EmberNote，你会发现你之前注册的用户无法登录，因为我们创建了新的底层数据存储。在生产环境应用中，你不需要这样做，但由于我们的模拟服务器端点运行在同一个\
    \ Node 实例中，我们必须创建单独的数据存储来绕过 `NEDB` 重复加载同一个存储的限制。\n\n除了设置 API 端点路径外，`RESTAdapter`\
    \ 还有其他几个自定义选项。例如，许多 API 需要 HTTP 请求头来识别用户。`RESTAdapter` 包含一个名为 `headers` 的属性，你可以根据需要对其设置。让我们修改\
    \ EmberNote，在用户登录后在每个请求中添加用户令牌作为标头。\n\n为了从我们的 `RESTAdapter` 内部填充头部，我们需要一种方法向适配器提供用户数据。这些用户数据在用户首次登录时在登录路由中可用。之前，当我们想要在用户路由之外获取用户数据时，我们简单地使用了\
    \ `controllerFor` 方法。然而，该方法在我们的 `RESTAdapter` 内部是不可用的。为了从适配器获取用户信息，我们需要使用 Ember\
    \ 的高级功能之一：依赖注入。我们之前已经使用过依赖注入——事实上，每当我们在路由或控制器中调用 `this.store` 时都是如此。让我们看看如何创建用于依赖注入的自定义对象。\n\
    \n### 创建并注入用户会话\n\n我们将创建一个名为 `Session` 的类，并使用它来存储我们想在类之间共享的信息。我们将使用一个初始化器（initializer）来初始化此类类并使其可用。初始化器是在\
    \ Ember 应用首次在浏览器启动时运行的函数，它在通过依赖注入使对象可用方面非常有用。要创建一个，请从 EmberNote 根目录运行以下 Ember\
    \ CLI 命令：\n\n```bash\n$ ember generate initializer session\n```\n\n此命令为你的初始化器生成一个存根（stub）。向存根中添加以下代码以完成初始化器：\n\
    \n```javascript\nimport Ember from 'ember';\n\nexport function initialize(container,application)\
    \ {\n  var session = Ember.Object.extend();\n  application.register('session:main',\
    \ session);\n  application.inject('adapter', 'session', 'session:main');\n  application.inject('route',\
    \ 'session', 'session:main');\n}\n\nexport default {\n  name: 'session',\n  initialize:\
    \ initialize\n};\n```\n\n第一块代码定义了该初始化器的 `initialize` 方法。该方法接收应用的容器和应用实例。在方法内部，我们扩展了\
    \ `Ember.Object`并将结果赋值给名为 `session` 的变量。我们将使用这个匿名类通过 `Ember.Object` 上的 `get` 和\
