  trans: "\n在本示例中，我们假设已经创建了一个特定用户的翻译对象，并将其注入到转换（transform）中。这将允许我们计算使用用户货币汇率的翻译。转换本身仅只负责在模型请求原生货币格式的信息时介入。一个需要使用该转换的示例模型类如下：\n\
    \n```javascript\nimport DS from \"ember-data\";\n\nexport default DS.Model.extend({\n\
    \  toAccount: DS.attr('string'),\n  fromAccount: DS.attr('string'),\n  amount:\
    \ DS.attr('native-currency') // 原生货币单位的金额\n});\n```\n\n不使用 transform 也可以表示相同的数据：\n\
    \n```javascript\nimport DS from \"ember-data\";\n\nexport default DS.Model.extend({\n\
    \  toAccount: DS.attr('string'),\n  fromAccount: DS.attr('string'),\n  amount:\
    \ DS.attr('number') // 存储在数据存储中的 USD 单位的金额\n});\n```\n\ntransform 既用于反序列化数据（即从其存储格式翻译为显示格式），也用于序列化数据。这意味着你可以用选择的格式进行显示，但在需要保存时，`serialize`\
    \ 函数会介入并将数据转换回相应的格式，以保持与数据库要求的一致。\n\n# 下一步工作\n\n我们在一起的大部分时间花在了学习如何构建 Ember 应用。构建应用很棒，但你想让它呈现在人们面前，对吧？在接下来的两个章节中，你将学习更多关于\
    \ Ember CLI 的知识，这对部署和发布非常有帮助。接下来，你将学习如何使用它来管理依赖，并从你的 Ember 代码构建可部署的制品。作为该过程的一部分，我们还将查看如何使用\
    \ Ember CLI 提供的测试钩子，以便我们对代码有信心。\n\n版权所有 © 2015, The Pragmatic Bookshelf.\n\n#\
    \ 第 8 章：构建、测试和部署你的 Ember 应用\n\n到为止，我们在构建应用功能方面做了大量工作。但在完成之前，我们还需要处理另一个重要领域。我们需要花些时间思考如何让我们的应用准备好投入生产。\n\
    \nEmber CLI 为我们完成了大部分这些工作，但作为开发者，了解一些幕后发生的情况对你也会帮助。首先，我们将查看 Ember CLI 如何从你创建的代码准备出一个可用的应用程序版本。然后，我们将在这章的大部分内容讨论\
    \ Ember CLI 如何帮助你测试应用。最后，我们将查看 Ember CLI 如何帮助你部署你的应用。\n\n让我们先看看 Ember CLI 如何构建你的应用程序代码，并使其随时准备好让你运行。\n\
    \n## 构建你的应用\n\n如果你在 JavaScript（或任何其他软件开发工具）中工作已久，你可能很熟悉一个常见的障碍：构建系统。就像语言一样，每个人对于特定语言的什么是构建系统都有不同的意见。与此选择紧密相关的是你对依赖管理的选择。选择一个构建和依赖管理工具是一个挑战；配置所选的工具集是另一个挑战。坦率地说，Ember\
    \ CLI 为你优雅地解决了这个问题。\n\n### 获取你的依赖项\n\n当你你第一次安装 Ember CLI 时，它包含了最新版本的 Ember。作为\
    \ Ember 2.x 发布周期的一部分，Ember 核心和 Ember CLI 将同步发布计划。因此，如果你想升级 Ember CLI，Ember 也应该随之升级。你可以在项目目录中以管理员身份运行以下命令来升级\
    \ Ember CLI：\n\n```bash\n$ npm uninstall -g ember-cli\n$ npm cache clean\n$ bower\
    \ cache clean\n$ npm install -g ember-cli\n$ npm install ember-cli --save-dev\n\
    $ rm -rf node_modules bower_components dist tmp\n$ npm install\n$ bower install\n\
    $ ember init\n```\n\n前三个命令从 npm 包管理系统中删除当前版本的 Ember CLI，并从 npm 和 Bower 缓存中清除相关文件。接下来，安装最新的\
    \ Ember CLI 并使其全局可用（由 `-g` 标志定义），同时将其安装到你项目的 `package.json` 文件中（在此我们使用 `--save-dev`\
    \ 标志）。\n\n然后，为了安全起见，我们删除了应用中包含依赖项和构建版本的四个目录。接下来两个命令会将 `package.json` 和 `bower.json`\
    \ 中列出的所有依赖项重新安装到你的本地组件目录。最后，`ember init` 针对你当前代码库重新运行所有的 Ember CLI 蓝图（blueprints）以查找更改。你每次运行\
    \ `ember generate` 时都使用了这些蓝图，因为蓝图可能会变化，所以重新应用它们是好的。该命令让你有机会批准列出的每个差异（diff），这样你就能知道通过该命令更改了什么。在这里要小心——取决于\
    \ Ember CLI 的变化，某些更改可能会删除你想要保留的代码，因此最好保持谨慎。你正在使用一个良好的版本控制系统，对吧？\n\n有时你可能只想更新其中一个依赖项而不更新\
    \ Ember CLI。因为 Ember CLI 依赖于 Bower，你只需运行以下命令即可安装更新的依赖项：\n\n```bash\n$ bower install\
    \ my-dependency --save\n```\n\n这将更新你的 `bower.json`，使该依赖项成为项目的一部分。\n\n### 在本地运行你的应用\n\
    \n当你编码或更改依赖项时，假设你已经通过 `ember serve` 命令启动了一个运行实例，Ember CLI 会保持本地部署为最新。Ember CLI\
    \ 会构建一个本地可部署的应用版本并启动该应用。\n\n正如我们在整书中看到的，当你运行 `ember serve` 命令时，它会启动 `watchman`\
    \ 服务。当 `watchman` 检测到你的一个文件发生变化时，它会触发重新构建。此外，当你浏览应用时，本地部署的版本包含一个 WebSockets 客户端，会监控并在浏览器中加载应用。这非常有用，特别是当你快速编码并想要同样快速看到更改时。你在快速编码时可能想做的另一件事是编写测试用例。我们现在来看看如何这样做。\n\
    \n## 测试并调试你的应用\n\n一直以来，我一直隐藏着一个小秘密。当你运行 `ember generate` 时，Ember CLI 不仅为你生成类，还为你生成了测试支架（test\
    \ harnesses）。事实上，它们完整到可以运行（尽管提供的覆盖率不高）。如果你是那些过去难以将良好的测试实践应用于 JavaScript 客户端代码的人之一，那么你的最后一个理由消失了。\n\
    \n### 测试执行\n\n让我们先查看我们在工作过程中 Ember CLI 创建的测试结果。打开命令行提示符，导航到 EmberNote 项目根目录，运行以下命令：\n\
    \n```bash\n$ ember test\n```\n\n当你运行此命令时，你应该看到控制台充满了输出。Ember CLI 首先构建你的应用，然后运行它在整个工作中生成的测试。\n\
    \n查看测试还有第二种方法。在同一个命令行提示符中，按 Ctrl-C，这会暂停 `ember test` 的输出。它应该报告几个失败的测试，我们稍后会讨论。首先，从命令行运行\
    \ `ember serve`。然后，将浏览器指向 `localhost:4200/tests`。\n"
- fmt: "\nIn your browser, you’ll see the results of your tests displayed. Scroll\
    \ through the results and you should see the failing tests. Before we fix a few\
    \ of these failing tests (and yes, the tests do require some tweaking), let’s\
    \ talk a little bit about the tooling Ember CLI uses to accomplish test execution.\n\
    \nWhen you run the `ember test` command from the command line, Ember CLI spins\
    \ up a `PhantomJS` instance. `PhantomJS` is a headless web browser (a browser\
    \ with no user interface), written entirely in JavaScript. By using `PhantomJS`,\
    \ you’re able to execute your tests as part of a continuous integration process.\
    \ Continuous integration is the practice of regularly compiling your software\
    \ with an automated process on a dedicated build machine. Using continuous integration,\
    \ you can check if errors have been introduced by new changes. If you adopt continuous\
    \ integration, your tests should be run during the build process. Using `PhantomJS`\
    \ allows your testing to occur without requiring a traditional browser be installed\
    \ on the continuous integration machine.\n\nWhen you run the tests by visiting\
    \ `localhost:4200/tests`, you’re actually using an Ember application that Ember\
    \ CLI builds as you update your app. This app is built to run your tests and display\
    \ the results to you. It runs every test, and offers you a few options to determine\
    \ which test results you want to see.\n\nBoth of these methods for reviewing your\
    \ test results are useful, and both have a place in your development plans. Throughout\
    \ the rest of the chapter, we’ll rely on the test app viewable at `localhost:4200`,\
    \ as it offers a slightly better user experience.\n\nWith a way to look at our\
    \ test results, let’s start by writing the more foundational of the tests we’re\
    \ going to write: unit tests.\n\n### Writing Unit Tests\n\nOne benefit of being\
    \ able to use a module-based approach to JavaScript is that we can think in a\
    \ modular fashion about our tests as well. Ember CLI creates one test module for\
    \ each app module we create. Let’s see one of those now. When you created the\
    \ note model class, Ember CLI created a test in a file called `note-test.js`,\
    \ in the `ember-note/tests/unit` directory. The generated file looks like this:\n\
    \n```javascript\nimport {\n  moduleForModel,\n  test\n} from 'ember-qunit';\n\n\
    moduleForModel('notebook', 'Unit | Model | notebook', {\n  // Specify the other\
    \ units that are required for this test.\n  needs: [];\n});\n\ntest('it exists',\
    \ function(assert) {\n  var model = this.subject();\n  // var store = this.store();\n\
    \  assert.ok(!!model);\n});\n```\n\nThe import block pulls in `moduleForModel`\
    \ and `test` functions from `ember-qunit`. These functions are used in the test\
    \ class to load the class we want to test and then execute a test against it,\
    \ respectively. To test using the `ember test` command or via the browser, you’ll\
    \ primarily rely on three test frameworks: `QUnit`, `ember-test-helpers`, and\
    \ `ember-qunit`. Each of these plays a role in providing some of the code you\
    \ write for test cases. `QUnit` is a generic testing framework written originally\
    \ for jQuery; `ember-test-helpers` is an Ember-specific set of test harnesses\
    \ that requires a specific test framework, such as `QUnit`, to function; and `ember-qunit`\
    \ glues the two of these together.\n\n#### Test Case Dependencies\n\nThis generated\
    \ unit test will confirm the most fundamental behavior: that an instance of the\
    \ note model class can be created. And right now, this test is a failing test.\
    \ If you look at the test result, you should see a message that reads “No model\
    \ found for notebook.” Why is it reporting it can’t find the notebook? Because\
    \ the note model class contains `belongsTo` to notebook. Let’s fix that. Change\
    \ the `needs` array of your test case to look like this:\n\n```javascript\nneeds:\
    \ [\n  'model:user',\n  'model:note'\n];\n```\n\nOnce you make that change, the\
    \ failing notebook model tests should pass. Rerun your tests via the browser to\
    \ confirm. If you want a clean set of tests, you can also make similar changes\
    \ to the note tests to get them to pass.\n\nYou’ll also want to make a few changes\
    \ to the application serializer’s test case for it to pass. Update the `moduleForModel`\
    \ code as follows:\n\n```javascript\nmoduleForModel('user', 'Unit | Serializer\
    \ | application', {\n  // Specify the other units that are required for this test.\n\
    \  needs: ['model:user']\n});\n```\n\nThis change updates the serializer test\
    \ to rely on one of our model classes, the `user` model. The Ember CLI test blueprint\
    \ for the serializer test looks for a model called `application`, which doesn’t\
    \ exist in our app. Changing to a class that does exist allows this test to pass.\n\
    \nWith these changes, we’ve updated most of the tests to use the proper dependencies.\
    \ You may note that the `edit-note` test is failing right now. Leave that one\
    \ as is. We’ll come to it soon. First, let’s look at how to write unit tests for\
    \ our models.\n\n#### Unit Testing Your Models\n\nUnder many circumstances, you\
    \ may not need to write test cases for your model classes. If your model classes\
    \ rely solely on framework-defined behavior, as ours do, you won’t even need to\
    \ write test cases. But let’s complicate things for ourselves a bit, and add a\
    \ function to our notebook model that counts the number of notes associated to\
    \ the notebook instance. Update your notebook model to look like this:\n\n```javascript\n\
    import DS from 'ember-data';\n\nexport default DS.Model.extend({\n  title: DS.attr('string'),\n\
    \  user: DS.belongsTo('user'),\n  notes: DS.hasMany('note'),\n  noteCount: function()\
    \ {\n    return this.get('notes.length');\n  }\n});\n```\n\nThe `noteCount` function\
    \ gets a copy of the `notes` attribute, which points to the array of associated\
    \ notes, and returns the length of that array. That’s what it’s meant to do. Now,\
    \ let’s write a test that confirms this. Update your `notebook-test.js` file to\
    \ look like this:\n\n```javascript\nimport {\n  moduleForModel,\n  test\n} from\
    \ 'ember-qunit';\nimport Ember from 'ember';\n\nmoduleForModel('notebook', 'Unit\
    \ | Model | notebook', {\n  // Specify the other units that are required for this\
    \ test.\n  needs: [\n    'model:user',\n    'model:note'\n  ];\n});\n\ntest('it\
    \ exists', function(assert) {\n  var model = this.subject();\n  // var store =\
    \ this.store();\n  assert.ok(!!model);\n});\n```\n"
