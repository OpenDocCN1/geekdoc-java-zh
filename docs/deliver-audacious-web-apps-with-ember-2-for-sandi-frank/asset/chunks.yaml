    \n# Chapter 5: Modeling Your Data\n\nEmber has a lot to offer as a front-end web\
    \ framework. So far, we’ve focused almost entirely on your app’s rendering and\
    \ navigation. But as you build apps, you’ll eventually want to include data. Ember\
    \ has a solution for that: Ember Data.\n\nEmber Data packs many things into one\
    \ small library. It offers your web client a straightforward modeling approach\
    \ to include simple records in your app. It reads from RESTful services, caches\
    \ the data it loads, and persists these records back to the server.\n\nIn this\
    \ chapter you’ll learn how to use Ember Data to access data from a RESTful service.\
    \ We’ll focus on an optimally designed RESTful service that requires little to\
    \ no configuration from our app. By looking at all of the data-related code we’ve\
    \ added to EmberNote so far, you’ll see how Ember Data works. Let’s start by looking\
    \ at the model classes we’ve created so far.\n\n## Define Your Models\n\nAn Ember\
    \ Data model class represents a record in some sort of persistent storage. Because\
    \ we’re working on the web, it’s likely that this persistent storage is accessed\
    \ via a RESTful API. An Ember Data record is an instance of a model class that\
    \ actually holds data; a model is simply the definition of that record. The most\
    \ important thing about a record is the data it maintains. Let’s look at how to\
    \ define what data is maintained by a record.\n\n### Defining a Model’s Fields\n\
    \nAs with each of the other classes we’ve created, we define models by first running\
    \ an Ember CLI command to get a stub version of the class. In [*Adding a Data\
    \ Service*](#f_0013.html_user-data-service), we ran the following command to generate\
    \ our User model class.\n\n```bash\n$ ember generate model user\n```\n\nThe stub\
    \ version of this class had no fields. We’ll add them so that our class looks\
    \ like this:\n\n[ch5/ember-note/app/models/user.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/models/user.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n\
    \  name: DS.attr('string')\n});\n```\n\nWith Ember Data, your model definition\
    \ is very simple. Your model has a set of fields that you define as key-value\
    \ pairs in your class. The key is how you will reference the data from within\
    \ your templates (that is, `user.name`).\n\nWhen you define a field, you have\
    \ a few options for defining the field type. If you’re adding a field to hold\
    \ a single value, you’ll use `DS.attr`. Calling this function creates a field\
    \ in your model. Call this function with no parameters, and the model will simply\
    \ accept whatever data type is passed to it.\n\nAlternatively, you can give it\
    \ a type, known as a Transform, and Ember Data will take the raw data provided\
    \ by your API and try to make it fit the type you provide. That’s what our user.js\
    \ example does. Ember Data offers four available default choices: `string`, `number`,\
    \ `Boolean`, and `date`. If needed, you can define your own Transform implementations,\
    \ but we’ll get by with the basics for now.\n\nYou can also define a default value\
    \ for your field. For example, if your call to `DS.attr` looks like this:\n\n\
    ```javascript\nname: DS.attr('string', {defaultValue: 'Matt'})\n```\n\nthe value\
    \ `Matt` will be used if a given record doesn’t have a value for `name`.\n\n###\
    \ Defining Model Relationships\n\nYour model classes might have fields that contain\
    \ a record, or even a list of records, rather than a basic data type. Ember Data\
    \ makes this possible through the use of two constructs: `DS.hasMany` and `DS.belongsTo`.\
    \ To see an example of this, let’s look at the notebook.js file:\n\n[ch5/ember-note/app/models/notebook.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/models/notebook.js)\n\
    \n```javascript\nimport DS from 'ember-data';\n\nexport default DS.Model.extend({\n\
    \  title: DS.attr('string'),\n  user: DS.belongsTo('user'),\n  notes: DS.hasMany('note')\n\
    });\n```\n\nBoth `hasMany` and `belongsTo` functions define a relationship between\
    \ the calling class and another model. The argument to this function is the name\
    \ of the other model’s class. In the notebook example, we reference the user model\
    \ from our `belongsTo` function and the note model from our `hasMany` function.\
    \ Semantically, this makes sense: a notebook belongs to a user and has many notes.\n\
    \n![notebook-relationships.png](images/notebook-relationships.png)\n\nIt is often\
    \ desirable to traverse model relationships in both directions. For example, from\
    \ the perspective of the note, you could include a `belongsTo` relationship back\
    \ to the notebook. And from the user, you could include a `hasMany` relationship\
    \ to the notebook.\n\nOf course, the cardinality of model relationships isn’t\
    \ always a one-to-many or many-to-one. If you want a one-to-one relationship,\
    \ simply create both relationships using `belongsTo`. For many-to-many, both sides\
    \ should be `hasMany`.\n\nNow that you have a better understanding of how to define\
    \ a model class, you’ll need to learn how to populate them. Let’s take a look\
    \ at how to load data from a server.\n\n## Load Data from RESTful Services\n\n\
    When using Ember to build your apps, it’s very likely that your data will come\
    \ from a RESTful service. A RESTful service uses HTTP as a data query and delivery\
    \ mechanism. Based on HTTP requests, it can be used to return data to the calling\
    \ logic, or to modify a data store in some manner.\n\nThe Ember project is very\
    \ keen on adapting the best ideas from the web community into the Ember framework,\
    \ and Ember Data’s use of RESTful services is no exception. By simply declaring\
    \ your model class, you are able to use the `DS.Store` object to get data from\
    \ your server, assuming that the RESTful service exposes the expected API.\n\n\
    Although we won’t dig too deeply into the implementation of a RESTful service,\
    \ throughout the rest of the chapter we’ll note the URL to which Ember Data makes\
    \ requests. In [*Use Serializers to Access Legacy APIs](#f_0042.html_serializers),\
    \ we’ll cover how to use Ember Data to access APIs that don’t follow the expected\
    \ conventions.\n"
