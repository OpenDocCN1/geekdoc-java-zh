    If you want to create a single function that can be imported and used throughout
    your app, utility functions can help. However, it’s also often helpful to share
    a collection of such functions. One way to do this is to create a mixin, and then
    include it into the classes that need to use it. Let’s take a look at that now.


    ## Share Code with Mixins


    While utilities are a useful way to share one function, they don’t cover every
    possible need. Our validation utility function could have been more useful if
    it were in the form of a collection of functions that could be used in many places.
    To do this, we can create a mixin. In Ember, a mixin is a collection of properties
    and functions that can be used in any class that depends on them. The definition
    of these properties and functions resides in the mixin, and is available in any
    class that takes advantage of the mixin.


    Because a mixin can contain properties and functions, it can be used not only
    to abstract behavior, but to abstract state as well. When a class inherits this
    mixin, the properties and functions of that mixin become part of the definition
    of the inheriting class. A utility function can be used to perform operations
    on a piece of data passed to it, whereas a mixin can be used for operations and
    state.


    Now, let’s see how to create our mixin. From a command line, run the following
    Ember CLI command:


    | ​  | $ ember generate mixin validation-functions |


    We’re going to add two validation routines to this library. We’ll create one that
    performs the same length validation as we performed in the utility. The second
    will check whether a string represents a valid email address.


    Update the newly created mixin class to the following:


