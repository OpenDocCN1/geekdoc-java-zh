    \n## 使用 Mixins 共享代码\n\n虽然工具是共享单个函数的有用方法，但它们并没有涵盖所有可能的需求。如果我们的验证工具函数是以一组可以在许多地方使用的函数的形式存在的，它可能会更有用。为了实现这一点，我们可以创建一个\
