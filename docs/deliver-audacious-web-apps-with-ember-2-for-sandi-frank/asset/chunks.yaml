- fmt: "\n```javascript\nvar name = this.controller.get('name');\n\nif(this.isValidEmail(name))\
    \ {\n  var user = this.store.createRecord('user', {\n    name : name\n  });\n\
    \  user.save().then(() => {\n    console.log('save successful');\n    this.controller.set('message',\n\
    \      'A new user with the name \"' + name + '\" was added!'\n    );\n    this.controller.set('name',null);\n\
    \  }, function() {\n    console.log('save failed');\n  });\n} else {\n  alert('Invalid\
    \ email address.');\n}\n} });\n```\n\nThe changes to the register route are very\
    \ similar to the changes we made to the notes route. First, we need to import\
    \ the `ValidationFunctions` mixin. Then, we refer to it when we extend the `Ember.Route`,\
    \ so the mixin will be made part of the new route. Then, as we did in the notes\
    \ route, we call it using `this.isValidEmail`, and proceed with the `addNew` action\
    \ if the validation passes. We display a message to the user if not.\n\nWhile\
    \ we’ve defined `isValidLength` and `isValidEmail` as functions, these properties\
    \ could have just as easily held a value. If they had, the including class (in\
    \ this case the notes route) would have access to them, just like it has access\
    \ to the functions.\n\n### Ember Addon: Validation\n\nOur example validation class\
    \ is great for Illustrating the ideas behind a mixin, but it’s nowhere near mature.\
    \ For a much more complete example of how to use a mixin to perform validation,\
    \ check out the `ember-validations` addon, published by `Dockyard`. `Dockyard`\
    \ is a major part of the team behind `Ember` and `Ember CLI`.\n\nTo make use of\
    \ `ember-validations` within your app, you install it by running the following\
    \ command from your project root:\n\n```bash\n$ ember install ember-validations\n\
    ```\n\nThis addon makes use of the ability to add properties to a class using\
    \ a mixin. To add validation rules to a class, you initialize a property called\
    \ `validations`. This property holds a JSON object, consisting of name-value pairs.\
    \ The names are the properties on the class that you wish to validate, and the\
    \ values are a JSON object containing the rules you want to apply to that property.\
    \ For example, take a look at this code from the `ember-validations` documentation:\n\
    \n```javascript\nexport default Ember.Object.extend(EmberValidations.Mixin,{\n\
    \  validations: {\n    firstName: {\n      presence: true,\n      length: { minimum:\
    \ 5 }\n    },\n    age: {\n      numericality: true\n    }\n  }\n});\n```\n\n\
    Adding the `validations` property to an object, like you’re doing here, activates\
    \ this addon for the object. The validation rules you want to apply are then contained\
    \ in the `validations` property. The containing object will then be validated\
    \ to ensure that the `firstName` property is populated and has a minimum length\
    \ of 5. The `age` is validated to ensure that it’s a number. There are several\
    \ other validation options, such as format, which is used to test a regular expression,\
    \ and `inclusion`, which provides a list of values that the property must match.\n\
    \nEach validation can provide a custom message, and the mixin provides a property\
    \ called `isValid` to let you know whether or not the object contains valid data.\
    \ This property will be updated each time a property is set. The messages can\
    \ be accessed by referencing a property called `errors.propertyName` on the object.\
    \ These messages can then be displayed to users to give them a chance to update\
    \ the property value.\n\nFor the complete documentation, take a look at [https://github.com/dockyard/ember-validations](https://github.com/dockyard/ember-validations).\n\
    \nMixins are a great way to share code, but `Ember` has even more to offer. Sometimes,\
    \ you’ll want to share access to state or to services. `Ember` has a way to do\
    \ that called dependency injection, which you’ll learn about next.\n\n## Share\
    \ Services with Dependency Injection\n\nThe features we’ve covered so far help\
    \ you implement a sound design by creating reusable classes and sharing them across\
    \ objects. Mixins and utilities are great for abstracting behavior, but for more\
    \ complex abstractions, you’ll want to create a service and use dependency injection\
    \ to sprinkle it throughout your app.\n\n“Service” can be interpreted to mean\
    \ different things, so let’s start by defining what we mean by a service. A service\
    \ is a self-contained unit of functionality. It provides unrelated objects access\
    \ to its functionality in a loosely coupled way. `Ember` relies on a few services\
    \ out of the box. For instance, the application’s instance of `Ember.Router` is\
