  trans: "\n\n![](img/cover.jpg)\n\n![Pragmatic Bookshelf](img/cover.jpg \"Pragmatic\
    \ Bookshelf\")\n\n# 使用 Ember 2 构建大胆的 Web 应用\n\n### 作者 Matthew White\n\n版本：P1.0\
    \ (2015 年 10 月) 版权所有所有 © 2015 The Pragmatic Programmers, LLC. 本书许可给购买的个人使用。我们没有对其进行复制保护，因为那会限制你出于自己的目的使用它的能力。请不要违背这种信任——你可以在你的所有设备上使用此书，但请不要将此副本分享给团队的其他成员、朋友或通过文件共享服务分享。感谢。\n\
    \n—Dave & Andy.\n\n制造商和销售商用于区分其产品使用的许多术呼均被声明为商标。当这些术呼出现在书中且 The Pragmatic Programmers,\
    \ LLC 知晓存在商标声明时，这些术呼将以首字母大写或全大写的形式打印。`The Pragmatic Starter Kit`、`The Pragmatic\
    \ Programmer`、`Pragmatic Programming`、`Pragmatic Bookshelf` 以及链接设备 `g` 是 The Pragmatic\
    \ Programmers, LLC 的商标。\n\n在准备本书时已采取一切预防措施。然而，出版社对书中出现的错误或遗漏，或因使用本文所包含的信息（包括程序列表）可能导致的损害不承担责任。\n\
    \n我们的 Pragmatic 课程、工作坊和其他产品可以帮助你和你的团队创建更好的软件并增加乐趣。更多信息以及最新的 Pragmatic 书目，请访问 [`pragprog.com`](http://pragprog.com)。\n\
    \n制作本书的团队包括：Katharine Dvorak（编辑）、Potomac Indexing, LLC（索引）、Liz Welch（文字校对）、Dave\
    \ Thomas（排版）、Janet Furlow（制作）、Ellie Callahan（支持）。国际权利事宜请联系 rights@pragprog.com。\n\
    \n## 为了获得最佳阅读体验……\n\n我们强烈建议你在阅读设备或应用程序上启用“出版商默认”设置来阅读此书。如果没有此设置，某些格式和字符可能无法正常显示。请参阅你的阅读器说明，如何启用出版商默认设置。\n\
    \n# 目录\n\n- 致谢\n- 引言：为什么选择 Ember？\n- 本书包含什么，不包含什么\n- 谁应该读这本书？\n- 本书是如何组织结构的\n\
    - 去哪里寻求帮助\n- 1. 使用 Ember 开始你的应用\n    - 安装 Ember 和 Ember CLI\n    - 启动你的应用\n  \
    \  - 下一步\n- 2. 使用路由引导流量\n    - 使用 Router 类组织你的应用\n    - 定义你的路由\n    - 设置你的模型\n\
    \    - 嵌套路由\n    - 路由之间的切换\n    - 将模板渲染到命名的插槽\n    - 下一步\n- 3. 布局用户界面\n    - 使用单页构建你的应用\n\
    \    - 将 UI 划分为模板\n    - 使用表达式渲染 HTML 控件\n    - 编译模板\n    - 下一步\n- 4. 通过组件构建复用性\n\
    \    - 创建组件\n    - 从包含的模板获取数据\n    - 定义组件接口\n    - 处理动作\n    - 下一步\n- 5. 为你的数据建模\n\
    \    - 定义你的模型\n    - 从 RESTful 服务加载数据\n    - 与记录操作\n    - 下一步\n- 6. 处理非标准 API\n\
    \    - 使用 Adapter 处理非标准 API](#f_0041.html_adapters)\n    - 使用 Serializer 处理非标准\
    \ API](#f_0042.html_serializers)\n    - 让 Adapter 处理非标准 API](#f_0043.html_adapter)\n\
    \    - 处理 Path 变化](#f_0044.html_path)\n    - 修改 Payload](#f_0045.html_payload)\n\
    \    - 解析 Payload](#f_0046.html_extract)\n    - 将 Adapters 和 Serializers 绑定到模型](#f_0047.html_model)\n\
    \    - 下一步\n- 7. 在 Ember 中复用代码\n    - 使用 Utilities 抽象函数](#f_0050.html_utilities)\n\
    \    - 使用 Mixins 共享代码](#f_0051.html_mixins)\n    - 使用 Dependency Injection 共享服务](#f_0052.html_dependency-injection)\n\
    \    - 使用 Transforms 微调数据](#f_0053.html_transforms)\n    - 下一步\n- 8. 构建、测试和部署\
    \ Ember 应用\n    - 构建你的应用](#f_0056.html_building)\n    - 测试并调试你的应用](#f_0057.html_testing)\n\
    \    - 部署你的应用](#f_0058.html_deploying)\n    - 下一步\n- 9. 构建和使用 Ember Addons\n \
    \   - 安装 Ember Addon](#f_0061.html_installing-addons)\n    - 开发自己的 Addon](#f_0062.html_developing-addons)\n\
    \    - 下一步\n\nCopyright © 2015, The Pragmatic Bookshelf.\n\n# 《Deliver Audacious\
    \ Web Apps with Ember 2》早期好评\n\n《Deliver Audacious Web Apps with Ember 2》为强大且优雅的\
    \ Ember 框架提供了清晰的介绍。想要学习或提升 Ember 技能的开发者应该读这本书。\n\n> Nell Shamrell-Harrington,\
    \ Chef 软件开发工程师\n\n> Ember 带回了 Rails 的乐趣，这次是性能良好的单页应用。\n> Federico Tomassetti,\
    \ 软件工程师\n\n> 如果你考虑在下一个项目中使用 Ember，请买这本书。读完每一章后我都感觉自己提升了。\n> Stephen Orr, Impact\
    \ Applications 高级软件工程师\n\n"
- fmt: '

    To The Pragmatic Bookshelf, including Andy Hunt, Dave Thomas, Susannah Davidson
    Pfalzer, Janet Furlow, and anyone else who had a hand in production: You helped
    me shape this into something I hope we can all be proud to have our names on.


    To my editor, Katharine Dvorak: This is as much your book as mine. Your guidance
    and vision were so helpful to me, and without them, this book would be twice as
    long with half as much useful information. I can’t wait to start on the next book!


    To my good friend and fellow author, Sharone Williams: Thank you for commiserating
    with me over deadline-induced delusions. It was immeasurably helpful knowing you
    were also out there in the word mines.


    To my parents: Thank you for all the sacrifices you made for me, and for teaching
    me to work hard and try new things. I hope you’re as proud of this book as I am.


    Most important, to my wife and son: Your patience, support, and love mean everything
    to me, and I would have neither started nor finished this book without you. Thank
    you for everything!


    Matt White `mailto:matt@mattwhite.co` `mailto:matt@mattwhite.co` October, 2015
