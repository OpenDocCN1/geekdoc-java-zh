    \ 文件。它的内容应该像这样：\n\n```html\n<h2>Welcome to Ember</h2>\n{{outlet}}\n```\n\n对文件进行更改，使其变为“Welcome\
    \ to EmberNote”。然后文件应该是这样的：\n\n```html\n<h2>Welcome to EmberNote</h2>\n{{outlet}}\n\
    ```\n\n一旦你保存更改，查看你的浏览器。Ember CLI 检测到更改，重新构建了应用，并在保存时部署了它。\n\n## 注册用户\n\n让我们看一个简单的示例，它将展示\
    \ Ember 应用的许多核心功能：路由、模板和模型。我们将构建一个注册页面，允许用户注册 EmberNote 服务。该页面有一个单文本字段，用户可以在其中输入用户名，一个触发添加操作的按钮，以及在添加新用户时显示的某些文本。\n"
- fmt: "\nIn an Ember app, all of your functionality is organized under routes. A\
    \ route is in essence a URL segment, as described in [Nest Routes](#f_0019.html_nesting-routes).\
    \ So, our next step is to use Ember CLI to create a route. Open a new command\
    \ shell, and from the root of your `ember-note` project, run the following command:\n\
    \n```bash\n$ ember generate route register --pod\n```\n\nThe `--pod` flag, when\
    \ added to the `generate` command, creates a directory called `register`, which\
    \ includes the files that are needed to add your route: `route.js` and `template.hbs`.\
    \ They are empty at the moment, and you’ll fill them out as needed to create the\
    \ route’s features. Generally speaking, you use a pod when you want to organize\
    \ your project by feature (that is, create a `register` directory with a `route.js`\
    \ and a `template.hbs` file), rather than by object type.\n\nEarlier, when you\
    \ created the app with the `ember new` command, the following four files were\
    \ created: `index.html`, `app.js`, `router.js`, and `application.hbs`. The `ember\
    \ generate` command then edits the `router.js` file under your app directory.\
    \ We’ll dig into this more in [Use the Router Class to Organize Your App](#f_0016.html_router),\
    \ but the `router.js` class is used to implement the hierarchy of routes within\
    \ your application.\n\nIf you run the `ember generate` command but leave off the\
    \ `--pod` flag, Ember CLI still creates the same objects, but instead of creating\
    \ a file called `route.js` in the `register` directory, it creates a file called\
    \ `register.js` in the `route` directory. For our purposes, it’s preferable to\
    \ see each of the files we need for a route in one location, so we’ll use the\
    \ `--pod` flag throughout the book.\n\nLet’s take a look at each of the files\
    \ we’ve created so far.\n\n### index.html\n\nThis file is the starting point for\
    \ your application. It was created when you ran the `ember new ember-note` command.\
    \ Let’s have a look.\n\n```html\n<!DOCTYPE html>\n<html>\n<head>\n  <meta charset=\"\
    utf-8\">\n  <meta http-equiv=\"X-UA-Compatible\" content=\"IE=edge\">\n  <title>EmberNote</title>\n\
    \  <meta name=\"description\" content=\"\">\n  <meta name=\"viewport\" content=\"\
    width=device-width,initial-scale=1\">\n  {{content-for 'head'}}\n  <link rel=\"\
    stylesheet\" href=\"assets/vendor.css\">\n  <link rel=\"stylesheet\" href=\"assets/ember-note.css\"\
    >\n  {{content-for 'head-footer'}}\n</head>\n<body>\n  {{content-for 'body'}}\n\
    \  <script src=\"assets/vendor.js\"></script>\n  <script src=\"assets/ember-note.js\"\
    ></script>\n  {{content-for 'body-footer'}}\n</body>\n</html>\n```\n\nThe majority\
    \ of `index.html` is boilerplate HTML to create a starting page. Ember CLI adds\
    \ in two stylesheets named `vendor.css` and `ember-note.css` to style the application.\
    \ We won’t be doing much with stylesheets in this book, but you should know that\
    \ `vendor.css` will capture styles used in any third-party code you bring into\
    \ the app, and `ember-note.css` is for styles that you define.\n\nThe same thing\
    \ applies to `vendor.js` and `ember-note.js`. The Ember CLI build process creates\
    \ one file for all of the third-party code you use in your app, called `vendor.js`,\
    \ and one for your application code, called `ember-note.js`. These are included\
    \ in `index.html`.\n\nYou may also notice the `{{content-for}}` expressions. These\
    \ allow you to include additional content in your page using Ember CLI addons.\n\
    \n### app.js\n\nThe `app.js` file is used to create the Ember environment. Take\
    \ a look at the following code:\n\n```javascript\nimport Ember from 'ember';\n\
    import Resolver from 'ember/resolver';\nimport initializers from 'ember/initializers';\n\
    import config from './config/environment';\n\nvar App;\n\nApp = Ember.Application.extend({\n\
    \  modulePrefix: config.modulePrefix,\n  podPrefix: config.podPrefix,\n  Resolver\n\
    });\n\ninitializers(App, config.modulePrefix);\n\nexport default App;\n```\n\n\
    If you’re a veteran JavaScript developer who hasn’t looked at ECMAScript yet,\
    \ the first four lines may have your eyes popping out of head. ECMAScript is the\
    \ formal name of the JavaScript language as specified by ECMA International, and\
    \ ECMAScript 2015 (also known as ES6) is the latest release of the standard.\n\
    \nThe purpose of the code in `app.js` is to set up app-wide constructs. One of\
    \ these, the Resolver, is used to look up classes throughout the app. The `modulePrefix`\
    \ variable is set to the value ember-note, as defined when you set up the app.\
    \ `podPrefix` isn’t set, as it wasn’t defined for our project, which was read\
    \ from `config/environment`.\n\nThe last line of the file makes the `App` class\
    \ available as a module. Don’t worry if this doesn’t quite make sense—you’ll see\
    \ many more examples of how Ember work as we go along. For now, let’s look at\
    \ another file that was created when the app was set up, the `router.js` file.\n\
    \n### router.js\n\nThe `router.js` file is where you can really start to see how\
    \ Ember works. One of the most fundamental features of Ember is the notion of\
    \ a route. Simply put, a route is a location within your app. If you think of\
    \ your app as a collection of pages or page sections, each nested within another,\
    \ then each of those pages corresponds to a route. And the `Router` class, as\
    \ defined in `router.js`, is where you define the structure of your app. Let’s\
    \ look at the code:\n\n```javascript\nimport Ember from 'ember';\nimport config\
    \ from './config/environment';\n\nvar Router = Ember.Router.extend({\n  location:\
    \ config.locationType\n});\n\nRouter.map(function() {\n  this.route('register');\n\
    });\n\nexport default Router;\n```\n\nAt the top of the `router.js` file you see\
    \ the necessary imports. In the class definition, which begins with `var Router\
    \ = Ember.Router.extend`, we’re bringing in some configuration variables from\
    \ the global configuration as defined when we set up the app.\n"
  raw: 'In an Ember app, all of your functionality is organized under routes. A route
    is in essence a URL segment, as described in [​*Nest Routes*​](#f_0019.html_nesting-routes).
    So, our next step is to use Ember CLI to create a route. Open a new command shell,
    and from the root of your ember-note project, run the following command:


    | ​  | $ ember generate route register --pod |


    The --pod flag, when added to the generate command, creates a directory called
    register, which includes the files that are needed to add your route: route.js
    and template.hbs. They are empty at the moment, and you’ll fill them out as needed
    to create the route’s features. Generally speaking, you use a pod when you want
    to organize your project by feature (that is, create a register directory with
    a route.js and a template.hbs file), rather than by object type.


    Earlier, when you created the app with the ember new command, the following four
    files were created: index.html, app.js, router.js, and application.hbs. The ember
    generate command then edits the router.js file under your app directory. We’ll
    dig into this more in [​*Use the Router Class to Organize Your App*​](#f_0016.html_router),
    but the router.js class is used to implement the hierarchy of routes within your
    application.


    If you run the ember generate command but leave off the --pod flag, Ember CLI
    still creates the same objects, but instead of creating a file called route.js
    in the register directory, it creates a file called register.js in the route directory.
    For our purposes, it’s preferable to see each of the files we need for a route
    in one location, so we’ll use the --pod flag throughout the book.


    Let’s take a look at each of the files we’ve created so far.


    #### index.html


    This file is the starting point for your application. It was created when you
    ran the ember new ember-note command. Let’s have a look.


    | [ch1/ember-note/app/index.html](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/index.html)
    |


    | ​  | <!DOCTYPE html> |


    | ​  | ​**<html>**​ |


    | ​  | ​**<head>**​ |


    | ​  | ​**<meta**​ charset=​*"utf-8"*​​**>**​ |


    | ​  | ​**<meta**​ http-equiv=​*"X-UA-Compatible"*​ content=​*"IE=edge"*​​**>**​
    |


    | ​  | ​**<title>**​EmberNote​**</title>**​ |


    | ​  | ​**<meta**​ name=​*"description"*​ content=​*""*​​**>**​ |


    | ​  | ​**<meta**​ name=​*"viewport"*​ content=​*"width=device-width, initial-scale=1"*​​**>**​
    |


    | ​  |  |


    | ​  | {{content-for ''head''}} |


    | ​  |  |


    | ​  | ​**<link**​ rel=​*"stylesheet"*​ href=​*"assets/vendor.css"*​​**>**​ |


    | ​  | ​**<link**​ rel=​*"stylesheet"*​ href=​*"assets/ember-note.css"*​​**>**​
    |


    | ​  |  |


    | ​  | {{content-for ''head-footer''}} |


    | ​  | ​**</head>**​ |


    | ​  | ​**<body>**​ |


    | ​  | {{content-for ''body''}} |


    | ​  |  |


    | ​  | ​**<script**​ src=​*"assets/vendor.js"*​​**>**​​**</script>**​ |


    | ​  | ​**<script**​ src=​*"assets/ember-note.js"*​​**>**​​**</script>**​ |


    | ​  |  |


    | ​  | {{content-for ''body-footer''}} |


    | ​  | ​**</body>**​ |


    | ​  | ​**</html>**​ |


    The majority of index.html is boilerplate HTML to create a starting page. Ember
    CLI adds in two stylesheets named vendor.css and ember-note.css to style the application.
    We won’t be doing much with stylesheets in this book, but you should know that
    vendor.css will capture styles used in any third-party code you bring into the
    app, and ember-note.css is for styles that you define.


    The same thing applies to vendor.js and ember-note.js. The Ember CLI build process
    creates one file for all of the third-party code you use in your app, called vendor.js,
    and one for your application code, called ember-note.js. These are included in
    index.html.


    You may also notice the {{content-for}} expressions. These allow you to include
    additional content in your page using Ember CLI addons.


    #### app.js


    The app.js file is used to create the Ember environment. Take a look at the following
    code:


    | [ch1/ember-note/app/app.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/app.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  | ​**import**​ Resolver from ​*''ember/resolver''*​; |


    | ​  | ​**import**​ loadInitializers from ​*''ember/load-initializers''*​; |


    | ​  | ​**import**​ config from ​*''./config/environment''*​; |


    | ​  |  |


    | ​  | ​**var**​ App; |


    | ​  |  |


    | ​  | Ember.MODEL_FACTORY_INJECTIONS = true; |


    | ​  |  |


    | ​  | App = Ember.Application.extend({ |


    | ​  | modulePrefix: config.modulePrefix, |


    | ​  | podModulePrefix: config.podModulePrefix, |


    | ​  | Resolver: Resolver |


    | ​  | }); |


    | ​  |  |


    | ​  | loadInitializers(App, config.modulePrefix); |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ App; |


    If you’re a veteran JavaScript developer who hasn’t looked at ECMAScript 2015
    yet, the first four lines may have your eyes popping out of your head. ECMAScript
    is the formal name of the JavaScript language as specified by ECMA International,
    and ECMAScript 2015 (also known as ECMAScript 6 or ES6) is the latest release
    of the standard. Yes, those four lines are importing dependencies from other JavaScript
    files to use their modules within the current module. This is a hugely important
    aspect of using Ember CLI. When you start writing your code in a modular fashion,
    your dependencies become easier to reason about, and you eliminate the need to
    stuff objects into the global scope. It also helps you to structure your code
    in a way that makes sense. Don’t worry whether the browser supports ECMAScript
    2015, though. Ember CLI transpiles your code into a format that the browser can
    execute.


    The purpose of the code in app.js is to set up app-wide constructs. One of these,
    the Ember Resolver, is used to look up classes throughout the app. The modulePrefix
    variable is set to the value ember-note, as defined when you set up your app.
    The podModulePrefix isn’t set, as it wasn’t defined yet for our project configuration,
    which was read from config/environment.js.


    The last line of the file makes the App class available as a module. Don’t worry
    if this doesn’t quite make sense yet—you’ll see many more examples of how Ember
    modules work as we go along. For now, let’s look at another file that was created
    when the app was set up, the router.js file.


    #### router.js


    The router.js file is where you can really start to see how Ember works. One of
    the most fundamental features of Ember is the notion of a route. Simply put, a
    route is a location within your app. If you think of your app as a collection
    of pages or page sections, each nested within one another, then each of those
    pages corresponds to a route. And the Router class, as defined in router.js, is
    where you define the structure of your app. Let’s look at the code:


    | [ch1/ember-note/app/router.js](http://media.pragprog.com/titles/mwjsember/code/ch1/ember-note/app/router.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  | ​**import**​ config from ​*''./config/environment''*​; |


    | ​  |  |


    | ​  | ​**var**​ Router = Ember.Router.extend({ |


    | ​  | location: config.locationType |


    | ​  | }); |


    | ​  |  |


    | ​  | Router.map(​**function**​() { |


    | ​  | this.route(​*''register''*​); |


    | ​  | }); |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Router; |


    At the top of the router.js file you see the necessary imports. In the class definition,
    which begins with var Router = Ember.Router.extend, we’re bringing in some configuration
    variables from the global configuration as defined when we set up the app.'
