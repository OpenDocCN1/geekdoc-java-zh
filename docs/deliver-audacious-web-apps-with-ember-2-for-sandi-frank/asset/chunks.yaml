    # 引言：为什么选择 Ember？


    当你考虑编写一个 Web 应用时，什么最让你感到兴奋？你是期待编写框架代码，还是期待为你的用户交付功能？如果你像我一样，功能才是令人兴奋的东西，而框架是为了服务功能而。现在，想象一下，如果一组开发者寻找创建
    Web 应用前端的实践实践，并将发现的内容封装成一个框架。想象一下，如果你不再担心编写胶水代码，而是把时间花在那些兴奋的事情上。你的工作会有何不同？


    Ember 是一个开源 JavaScript 框架，在 `http://emberjs.com` 和 GitHub^([[1]](#f_0010.html_FOOTNOTE-1))
    上维护，旨在加速 Web 应用的。它提供了你所需的大部分前端基础设施，让你能够花时间创建一个出色的应用。如果你使用 Ember，你写的代码更少，也更简单。而简单的代码就是更好的代码。通过向
    JavaScript 注入面向对象的设计原则来帮助你以合理的方式组织代码，Ember 让你从模块化的层面进行思考。这使得你的应用更容易创建和维护。


    在本书中，你将学习如何创建大胆的 Web 应用，并通过让 Ember 承担繁重的工作来高效实现目标。你将使用 Ember 的路由系统构建具有丰富界面和简单、可共享
    URL 的单页应用。你将创建可重用的 UI 组件和模板，并将它们组合成高度实用的、复杂的应用。你将使用 Ember Data 读写 RESTful 服务。你将学习使用
    Ember 插件（addons）来共享代码并使用他人共享的代码。你还将学习使用 Ember CLI 和 `QUnit` 来组织、构建和测试你的应用。


    ## 本书是什么，又不是什么


    本书是对 Ember 2、Ember Data 和 Ember CLI 核心功能的简要介绍。这些功能依赖于 `Node.js`、`npm` 和 `Handlebars`，但我们不会详细讨论这些依赖项。


    本书并不是 Ember、Ember Data 或 Ember CLI 的详尽参考书。我希望你学到的知识足以激发你的好奇心，但我们不会涵盖每一个 Ember
    API。本书也不是 JavaScript 或 Web 开发的介绍。我假设你已经对 JavaScript、`DOM`、`Ajax`、`HTML/CSS` 和
    RESTful 服务有一定了解。


    ## 谁应该读这本书？


    本书面向初接触 Ember 的 Web 开发者。如果你用过 `React` 或 `AngularJS` 等其他框架，或者用过 `jQuery`，那么 Ember
    背后的一些理念对你来说应该熟悉，但如果没有，你也没问题。


    ## 本书是如何组织的


    在第一章中，我们将从创建本地开发环境开始，然后开始处理示例项目。在构建一个小型但完整的示例功能时，我们将在第一章中简要提到许多核心功能。


    在接下来的三章中，我们将重点关注使用 Ember 2 构建用户界的核心方面，并查看它如何利用路由、模板和组件动态地更新你的界面，而无需与服务器进行大量笨拙的往返。在第
    5 章和第 6 章中，我们集中于使用带有 Ember Data 的模型访问 RESTful 服务以获取数据，并将数据提供给用户界面。第 7 章讨论了在你的
    Ember 应用中促进代码重用的几种方法，包括工具类、混入（mixins）和依赖注入。我们将在第 8 章和第 9 章结束课程，学习如何使用 Ember CLI
    进行构建、测试和部署应用，以及通过插件共享代码。


    本书的一点小不同之处是，每一章都建立在前一章工作的基础上。我们将协作构建一个应用，从第一页开始，贯穿始终。因此，最好在第一次阅读时按顺序阅读本书。当你读完整个书后，再将其作为参考书使用会更有好运，但它在第一次初读时作为渐进式教程效果最好。


    我们将共同构建一个名为 `EmberNote` 的应用。它是 Evernote 应用的简化版，Evernote 是基于 Web 的笔记应用程序。以 Evernote
    为模型，我们将使用 Evernote 笔记本和笔记的层级结构来学习如何使用 Ember 的路由系统和 Ember Data。我们将使用 Ember CLI
    构建、测试和部署应用，以及通过插件共享代码。


    ## 哪里获取帮助


    本书中的所有代码示例都可以在网上找到^([[2]](#f_010.html_FOOTNOTE-2)) 在那里你还可以找到一个论坛，可以提问和提供反馈。


    现在，让我们开始吧！


    #### 脚注


    | [[1]](#f_006.html_FPTR-1) | [`github.com/emberjs/ember.js/`](https://github.com/emberjs/ember.js/)
    |

    | [[2]](#f_010.html_FPTR-2) | [`pragprog.com/book/mwjsem`](http://pragprog.com/book/mwjsem)
    |


    # 第一章：使用 Ember 开始你的应用


    在本章中，我们将通过学习 Ember 和 Ember CLI 的核心功能来快速上手。首先，我们将通过安装 Ember 和 Ember CLI 搭建开发环境。接下来，我们将开始构建贯穿全书的应用。我们将使用
    Ember CLI 创建应用及其第一个功能：注册页面。最后，我们将通过构建一个基础的、感知数据的测试后端来支持该页面。让我们从安装 Ember 和 Ember
    CLI 开始。


    ## 安装 Ember 和 Ember CLI


    Ember CLI 是用于构建 Ember 应用的命令行界面，它是项目团队获取框架库的首选方式。通常，Ember 非常关注 Ember 开发者所谓的“开发者工程学”。他们希望让开发者的工作更轻松。Ember
    CLI 正是基于这种精神的。正如你在整本书中看到的，Ember CLI 可以轻松处理许多样板任务，如构建和部署、执行测试、为新功能添加文件等。同样重要的是，它允许你使用新的模块化语法来编写类。这大大增加了你代码的清晰度。我们将在本书中使用
    Ember CLI，所以让我们从安装它开始吧。


