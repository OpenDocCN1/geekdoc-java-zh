- fmt: "\nTo help with this, Ember Data has a series of classes that adapt nonstandard\
    \ APIs to follow the conventions the rest of Ember expects. This can be as simple\
    \ as translating attribute names from one naming convention to another, or as\
    \ complicated as using Ember Data to alter JSON in flight.\n\nIn this chapter,\
    \ we’ll take a look at how to use Ember Data to work with any standard or nonstandard\
    \ API you might encounter.\n\n## Adapt to a Nonconventional API\n\nAs built so\
    \ far, the EmberNote API has used the conventions Ember Data expects from an API.\
    \ In this chapter, we’ll first create a parallel version of the EmberNote API\
    \ that doesn’t follow the traditional conventions. Then, we’ll use the new version\
    \ to learn how to make Ember Data fit such an API.\n\nTo start this process, you’ll\
    \ want to create a copy of each of the mock server files we’ve created. Take each\
    \ file in the `ember-note/server/mocks` directory, copy it, and append `-alt-api`\
    \ to the end of the filename, before the file extension, so `notes.js` becomes\
    \ `notes-alt-api.js`. Don’t forget to leave the original files in place. In each\
    \ of the `-alt-api` files, where we’re creating the NEDB data file, change the\
    \ name of the data file by appending `-alt` to the name, like this:\n\n```javascript\n\
    var noteDB = new nedb({ filename : 'notes-alt', autoload: true});\n```\n\nThen,\
    \ at the bottom of each of the new files, change the listener URL to include a\
    \ path segment for `api`:\n\n```javascript\napp.use('/api/alt/notes', notesRouter);\n\
    ```\n\nRun the `ember serve` command to ensure your app starts with the new API.\n\
    \n### Adding Request Headers to Your API\n\nWith this new API running, let’s modify\
    \ `RESTAdapter` as follows:\n\n```javascript\nimport DS from 'ember-data';\n\n\
    export default DS.RESTAdapter.extend({\n  namespace: 'api/alt',\n});\n```\n\n\
    This simple change to `namespace` will cause the adapter to send requests to the\
    \ alternate API endpoints. If you load EmberNote in a browser now, you’ll see\
    \ that your previously registered user isn’t able to log in because we created\
    \ new underlying data stores. In a production app you wouldn’t need to do this,\
    \ but because our mock server endpoints all run within the same Node instance,\
    \ we had to create separate data stores to work around a limitation on loading\
    \ the same store twice with `NEDB`.\n\nBeyond just setting the API endpoint path,\
    \ there are a few other customization options available for `RESTAdapter`. For\
    \ example, many APIs require HTTP request headers to identify the user. `RESTAdapter`\
    \ contains a property called `headers` that you can set as needed. Let’s modify\
    \ EmberNote to add a user token as a header on each request once the user has\
    \ logged in.\n\nTo populate the headers from within our `RESTAdapter`, we need\
    \ a way to provide user data to the adapter. This user data is available within\
    \ the login route when a user first signs in. Previously, when we wanted to get\
    \ at user data outside of the user route, we simply used the `controllerFor` method.\
    \ However, this method isn’t available inside our `RESTAdapter`. To get at the\
    \ user information from the adapter, we’re going to need to use one of the advanced\
    \ features of Ember: dependency injection. We’ve used dependency injection previously—in\
    \ fact, whenever we’ve called `this.store` in a route or controller. Let’s see\
    \ how to create our own objects for use with dependency injection.\n\n### Creating\
    \ and Injecting a User Session\n\nWe’re going to create a class, called `Session`,\
    \ and use it to store information we want to share between classes. We’ll use\
    \ an initializer to initialize this class and make it available. An initializer\
    \ is a function that runs when an Ember application is first started in the browser,\
    \ and it’s very useful in making objects available via dependency injection. To\
    \ create one, run the following Ember CLI command from the EmberNote root:\n\n\
    ```bash\n$ ember generate initializer session\n```\n\nThis command generates a\
    \ stub for your initializer. Add the following code to the stub to complete the\
    \ initializer:\n\n```javascript\nimport Ember from 'ember';\n\nexport function\
    \ initialize(container,application) {\n  var session = Ember.Object.extend();\n\
    \  application.register('session:main', session);\n  application.inject('adapter',\
    \ 'session', 'session:main');\n  application.inject('route', 'session', 'session:main');\n\
    }\n\nexport default {\n  name: 'session',\n  initialize: initialize\n};\n```\n\
    \nThe first block of code defines the `initialize` method for this initializer.\
    \ The method takes the app’s container and application instances. Within the method,\
    \ we extend the `Ember.Object` and assign the result to a variable called `session`.\
    \ We’ll use this anonymous class to hold our session information using the `get`\
    \ and `set` methods on `Ember.Object`.\n\n#### Ember Addon: Ember CLI Simple Auth\n\
    \nOur example session object is a good start, but we’re likely to need more sophisticated\
    \ authentication and session management at some point. Ember itself doesn’t provide\
    \ a session object or built-in authentication mechanism, but like with most other\
    \ things, there’s an addon for that. Let’s take a quick look at Ember Simple Auth\
    \ and the Ember CLI Simple Auth addon.\n\nThe Ember Simple Auth project is a library\
    \ for adding authentication to an Ember app. Among other things, it allows you\
    \ to authenticate against either your own server or external services that support\
    \ OAuth. Once authenticated, you can use Ember Simple Auth to authorize requests\
    \ to your server, protecting actions by preventing unauthorized users from reaching\
    \ them.\n\nEmber Simple Auth isn’t an addon by itself, however. To use it with\
    \ Ember CLI, you need the Ember CLI Simple Auth addon, which packages the Ember\
    \ Simple Auth code and makes it able to be installed from Ember CLI. This is a\
    \ good example of how Ember CLI makes it possible to share good ideas. A codebase\
    \ such as Ember Simple Auth becomes as easy to get as a single command within\
    \ your project.\n\nThe full documentation for the Ember CLI Simple Auth addon\
    \ is at `https://github.com/simplabs/ember-cli-simple-auth`.\n\n### Using the\
    \ Session\n\nNow that we have a session object, we need to make it available to\
    \ types that need it. First, we register this instance with the application object\
    \ under the name `session:main`. Using the `register` method results in a single\
    \ instance of the session object being created and shared across the app. We can\
    \ then use this single instance to share data between objects that would otherwise\
    \ be unable to do so.\n\nWith the object registered, the next two lines of code\
    \ inject this object into the type factories for the adapter and route types.\
    \ The first parameter to the `inject` function is the type we want to inject into.\
    \ The second parameter is the property name we want to make the object available\
    \ under within that type, and the third parameter is the name we registered the\
    \ object under previously. The remaining code in the initializer is used to help\
    \ organize the execution order, as we’ll see in the next chapter.\n\nNow that\
    \ we have an initializer ready to store the session, let’s modify the login route\
    \ to use it:\n\n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n\
    \  actions: {\n    login: function() {\n      this.store.query('user', {\n   \
    \     name: this.controller.get('name')\n      }).then((users) => {\n    }\n \
    \ }\n});\n```\n"
  raw: 'To help with this, Ember Data has a series of classes that adapt nonstandard
    APIs to follow the conventions the rest of Ember expects. This can be as simple
    as translating attribute names from one naming convention to another, or as complicated
    as using Ember Data to alter JSON in flight.


    In this chapter, we’ll take a look at how to use Ember Data to work with any standard
    or nonstandard API you might encounter.


    ## Adapt to a Nonconventional API


    As built so far, the EmberNote API has used the conventions Ember Data expects
    from an API. In this chapter, we’ll first create a parallel version of the EmberNote
    API that doesn’t follow the traditional conventions. Then, we’ll use the new version
    to learn how to make Ember Data fit such an API.


    To start this process, you’ll want to create a copy of each of the mock server
    files we’ve created. Take each file in the ember-note/server/mocks directory,
    copy it, and append -alt-api to the end of the filename, before the file extension,
    so notes.js becomes notes-alt-api.js. Don’t forget to leave the original files
    in place. In each of the -alt-api files, where we’re creating the NEDB data file,
    change the name of the data file by appending -alt to the name, like this:


    | ​  | ​**var**​ noteDB = ​**new**​ nedb({ filename : ​*''notes-alt''*​, autoload:
    true}); |


    Then, at the bottom of each of the new files, change the listener URL to include
    a path segment for api:


    | ​  | app.use(​*''/api/alt/notes''*​, notesRouter); |


    Run the ember serve command to ensure your app starts with the new API.


    ### Adding Request Headers to Your API


    With this new API running, let’s modify RESTAdapter as follows:


    | [ch6/ember-note/app/adapters/application.js](http://media.pragprog.com/titles/mwjsember/code/ch6/ember-note/app/adapters/application.js)
    |


    | ​  | ​**import**​ DS from ​*''ember-data''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ DS.RESTAdapter.extend({ |


    | ​  | namespace: ​*''api/alt''*​, |


    | ​  | }); |


    This simple change to namespace will cause the adapter to send requests to the
    alternate API endpoints. If you load EmberNote in a browser now, you’ll see that
    your previously registered user isn’t able to log in because we created new underlying
    data stores. In a production app you wouldn’t need to do this, but because our
    mock server endpoints all run within the same Node instance, we had to create
    separate data stores to work around a limitation on loading the same store twice
    with NEDB.


    Beyond just setting the API endpoint path, there are a few other customization
    options available for RESTAdapter. For example, many APIs require HTTP request
    headers to identify the user. RESTAdapter contains a property called headers that
    you can set as needed. Let’s modify EmberNote to add a user token as a header
    on each request once the user has logged in.


    To populate the headers from within our RESTAdapter, we need a way to provide
    user data to the adapter. This user data is available within the login route when
    a user first signs in. Previously, when we wanted to get at user data outside
    of the user route, we simply used the controllerFor method. However, this method
    isn’t available inside our RESTAdapter. To get at the user information from the
    adapter, we’re going to need to use one of the advanced features of Ember: dependency
    injection. We’ve used dependency injection previously—in fact, whenever we’ve
    called this.store in a route or controller. Let’s see how to create our own objects
    for use with dependency injection.


    #### Creating and Injecting a User Session


    We’re going to create a class, called Session, and use it to store information
    we want to share between classes. We’ll use an initializer to initialize this
    class and make it available. An initializer is a function that runs when an Ember
    application is first started in the browser, and it’s very useful in making objects
    available via dependency injection. To create one, run the following Ember CLI
    command from the EmberNote root:


    | ​  | $ ember generate initializer session |


    This command generates a stub for your initializer. Add the following code to
    the stub to complete the initializer:


    | [ch6/ember-note/app/initializers/session.js](http://media.pragprog.com/titles/mwjsember/code/ch6/ember-note/app/initializers/session.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**function**​ initialize(container,application) { |


    | ​  | ​**var**​ session = Ember.Object.extend(); |


    | ​  | application.register(​*''session:main''*​, session); |


    | ​  | application.inject(​*''adapter''*​, ​*''session''*​, ​*''session:main''*​);
    |


    | ​  | application.inject(​*''route''*​,​*''session''*​,​*''session:main''*​);
    |


    | ​  | } |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ { |


    | ​  | name: ​*''session''*​, |


    | ​  | initialize: initialize |


    | ​  | }; |


    The first block of code defines the initialize method for this initializer. The
    method takes the app’s container and application instances. Within the method,
    we extend the Ember.Object and assign the result to a variable called session.
    We’ll use this anonymous class to hold our session information using the get and
    set methods on Ember.Object.


    Ember Addon: Ember CLI Simple Auth


    Our example session object is a good start, but we’re likely to need more sophisticated
    authentication and session management at some point. Ember itself doesn’t provide
    a session object or built-in authentication mechanism, but like with most other
    things, there’s an addon for that. Let’s take a quick look at Ember Simple Auth
    and the Ember CLI Simple Auth addon.


    The Ember Simple Auth project is a library for adding authentication to an Ember
    app. Among other things, it allows you to authenticate against either your own
    server or external services that support OAuth. Once authenticated, you can use
    Ember Simple Auth to authorize requests to your server, protecting actions by
    preventing unauthorized users from reaching them.


    Ember Simple Auth isn’t an addon by itself, however. To use it with Ember CLI,
    you need the Ember CLI Simple Auth addon, which packages the Ember Simple Auth
    code and makes it able to be installed from Ember CLI. This is a good example
    of how Ember CLI makes it possible to share good ideas. A codebase such as Ember
    Simple Auth becomes as easy to get as a single command within your project.


    The full documentation for the Ember CLI Simple Auth addon is at [https://github.com/simplabs/ember-cli-simple-auth](https://github.com/simplabs/ember-cli-simple-auth).


    Now that we have a session object, we need to make it available to types that
    need it. First, we register this instance with the application object under the
    name "session:main". Using the register method results in a single instance of
    the session object being created and shared across the app. We can then use this
    single instance to share data between objects that would otherwise be unable to
    do so.


    With the object registered, the next two lines of code inject this object into
    the type factories for the adapter and route types. The first parameter to the
    inject function is the type we want to inject into. The second parameter is the
    property name we want to make the object available under within that type, and
    the third parameter is the name we registered the object under previously. The
    remaining code in the initializer is used to help organize the execution order,
    as we’ll see in the next chapter.


    Now that we have an initializer ready to store the session, let’s modify the login
    route to use it:


    | [ch6/ember-note/app/login/route.js](http://media.pragprog.com/titles/mwjsember/code/ch6/ember-note/app/login/route.js)
    |


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Ember.Route.extend({ |


    | ​  | actions: { |


    | ​  | login: ​**function**​() { |


    | ​  | this.store.query(​*''user''*​, { |


    | ​  | name: this.controller.get(​*''name''*​) |


    | ​  | }).then((users) => { |'
