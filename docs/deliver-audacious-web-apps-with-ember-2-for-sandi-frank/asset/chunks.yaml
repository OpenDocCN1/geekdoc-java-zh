    \ `Ember` 实例。由于我们正要执行的工作是异步的且具有副作用，因此测试运行器要求我们在自己的运行循环中执行这些工作。在运行循环内部，我们将使用之前的随机数来生成预期的记录实例数量，然后将它们添加到笔记本中。\n\
    \n此时，你可能不确定何时该使用 `Ember.run` 何时不该。请放心，测试运行器非常清楚为什么某个测试不会运行，并会提供错误消息指示你的代码需要 `Ember.run`。除此之外，关于\
    \ `Ember.run` 的细节大多在你在开发 Ember 本身而不是使用 Ember 时才相关。\n\n完成设置工作后，我们将通过断言 `noteCount`\
    \ 方法返回预期的记录数量（即之前声明的随机数）来运行实际测试。我们的测试应该会通过，知道我们少了一个需要担心的方法，我们可以睡得更踏实了。\n\n###\
    \ 随机数生成\n\n| | --- |\n| ![images/aside-icons/warning.png](img/warning.png) | 如果涉及安全，随机数生成是一个风险领域。我们之前使用的\
    \ `Math.random` 函数在我们的用法中是没问题的，但你不应该将其用于任何对安全要求的场景，例如为双重身份验证或验证码生成随机值，因为 `Math.random`\
    \ 的输出并非真正的随机。在这种情况下，你最好使用 `RandomSource.getRandomValues()` 函数，该函数可以在 Mozilla Developer\
    \ Network 上的：[`developer.mozilla.org/en-US/docs/Web/API/RandomSource/getRandomValues`](https://developer.mozilla.org/en-US/docs/Web/API/RandomSource/getRandomValues)\
    \ |\n\n现在，让我们来看看如何对组件进行单元测试。\n\n#### 组件的单元测试\n\n正如我之前提到的，我们希望将单元测试集中在尚未被框架测试的代码上。另一个判断一个类是否适合单元测试的标准是它是否依赖于外部依赖（如\
    \ Ember Data store），而这些依赖很难被模拟（mock）。我们的 `edit-note` 组件目前有两个动作：`saveNote` 和 `closeNote`。让我们快速回顾一下该类：\n\
    \n`ch8/ember-note/app/components/edit-note/component.js`\n\n```javascript\nimport\
    \ Ember from 'ember';\n\nexport default Ember.Component.extend({\n  actions: {\n\
    \    saveNote: function() {\n      this.get('note').save();\n    },\n    closeNote:\
    \ function() {\n      this.sendAction('close');\n    }\n  }\n});\n```\n\n在幕后，`saveNote`\
    \ 正在调用 store 来保存数据，因此此方法需要依赖验收测试。尽管如此，我们仍然可以在某种程度上对其进行单元测试。单元测试更好的候选对象是 `closeNote`\
    \ 动作，它只是将动作引用到传递给组件的类。这个类可以很容易被模拟。\n\n让我们对 `edit-note` 模板进行细微调整。为每个按钮添加一个 `id`\
    \ 参数，如下所示：\n\n`ch8/ember-note/app/components/edit-note/template.hbs`\n\n```html\n\
    <div>\n  <input value={{title}}>\n  <button id=\"save\" action=\"saveNote\">save</button>\n\
    \  <button id=\"close\" action=\"closeNote\">close</button>\n</div>\n<div>\n \
    \ <textarea rows=10 cols=60>{{body}}</textarea>\n</div>\n```\n\n稍后你会看到为什么添加了这些属性。让我们通过查看组件类并编写新测试来了解如何为组件编写测试：\n\
    \n`component-test.js`\n\n```javascript\nimport { moduleForComponent, test } from\
    \ 'ember-qunit';\nimport Ember from 'ember';\n\nmoduleForComponent('edit-note',\
    \ {\n  needs: ['component:markdown-html']\n});\n\ntest('it renders', function(assert)\
    \ {\n  assert.expect(2);\n  // 创建组件实例\n  var component = this.subject();\n  assert.equal(component._state,\
    \ 'preRender');\n  // 将组件渲染到页面\n  this.render();\n  assert.equal(component._state,\
    \ 'inDOM');\n});\n\ntest('it saves', function(assert) {\n  var component = this.subject();\n\
    \  this.render();\n  var saveTarget = {\n    save: function() {\n      assert.ok(true,\
    \ 'saved the note');\n    }\n  };\n  Ember.run(() => {\n    component.set('note',\
    \ saveTarget);\n  });\n  this.$().find('#save').click();\n});\n\ntest('it closes',\
    \ function(assert) {\n  var component = this.subject();\n  this.render();\n  var\
    \ closeTarget = {\n    closeAction: function() {\n      assert.ok(true, 'closed\
    \ the window');\n    }\n  };\n  component.set('close', 'closeAction');\n  component.set('targetObject',\
    \ closeTarget);\n  this.$().find('#close').click();\n});\n```\n\n我们再次添加了 `Ember`\
    \ 类，是因为我们将在其中一个测试中使用运行循环。在 `moduleForComponent` 中，我们添加了对 `markdown-html` 插件的依赖，以便测试框架知道在渲染\
    \ `edit-note` 组件时使用该类。\n\n“it renders”测试是 Ember CLI 用于组件的模板代码。我们没有修改它。它测试了组件是否按照测试容器的预期进行了设置和渲染。\n\
    \n"
- fmt: "\nOur first test is the “it saves” test. As we’ve seen in our model test,\
    \ the first task of this test is to create an instance of the object to be tested.\
    \ We then render it to the “screen.” Once that setup work is performed, we create\
    \ a mock object to act in the role of a note model. This mock object needs to\
    \ contain just one method: the `save` method. In this case, because we want to\
    \ verify that this method is properly called by the component, we put our assertion\
    \ in this method. If the method is called, the referenced message will be printed\
    \ and the test will pass.\n\nWith our mock object created, we use the `Ember.run`\
    \ method to wrap the `component.set` action, since the re-render caused by the\
    \ model change will happen asynchronously and have side effects (namely, updating\
    \ the DOM). Then, we force a click action on the named button object. This causes\
    \ the component’s `saveNote` action to fire, which is supposed to run the `save`\
    \ function on the mock object. Because it does, our test passes.\n\nThe “it closes”\
    \ test is rather similar. We get a component instance, render it, and create a\
    \ mock object that contains the method we want to run. The significant difference\
    \ is in how we link up the test objects.\n\nBecause our assignments have no side\
    \ effects, we’re able to run them without using the `Ember.run` loop. We set the\
    \ value of the template’s `close` parameter to the function we plan to run from\
    \ the mock object, and set `targetObject` to our mock object. In a running app,\
    \ the route that includes this component plays the role of the target. Because\
    \ the `closeNote` action uses `sendAction` to do its work, the click in our test\
    \ calls out to our `closeAction` in the mock object, and our test passes.\n\n\
    Of course, your components may have different custom code that requires testing.\
    \ These two examples are good for some component-specific features, such as confirming\
    \ that the component properly handles the passed-in model and confirming that\
    \ it properly handles referred actions.\n\nAs I mentioned earlier, unit tests\
    \ are best for testing features that don’t have a lot of interaction with app-wide\
    \ code or require complicated mocks. The primary type of object we haven’t covered\
    \ yet is routes. The reason we won’t spend much time on unit testing routes is\
    \ that they have a great deal of interaction with app-wide code. As such, they\
    \ are much better candidates for acceptance testing than unit testing.\n\nYou’re\
    \ likely to write a number of unit tests that address object types besides models\
    \ or components. While the details will vary by implementation, the ideas will\
    \ be the same. Start with the test blueprint that `Ember CLI` creates and add\
    \ to it as needed to confirm the behavior you’ve added to your classes as you\
    \ go.\n\nUnit testing is great for working at a low level, but at some point you’ll\
    \ want to be able to test a more complete cycle of behavior. For that, you have\
    \ acceptance testing, which we’ll take a look at next.\n\n### Writing Acceptance\
    \ Tests\n\nAcceptance tests are used to test a sequence of events through the\
    \ application to ensure that the correct result is achieved. It’s a good way to\
    \ work your way through a set of screens and give them a spin. Due to this, they\
    \ require a bit more work on our end to get up and running, but they are a powerful\
    \ way to confirm functionality and even detect regressions as you’re adding code.\n\
    \nIn our case, we’ll work through a relatively small example. We’re going to write\
    \ an acceptance test to confirm that our register route is properly registering\
    \ valid users. We’ll create a test that starts the app, navigates to the register\
    \ route, fills out the field and clicks the button, and then confirms that the\
    \ correct message is displayed.\n\nBecause acceptance tests are so tailored to\
    \ your app, they aren’t generated by `Ember CLI` as you go along. To start the\
    \ acceptance test, run the following command from your project root:\n\n```bash\n\
    $ ember generate acceptance-test register\n```\n\nThis command creates a boilerplate\
    \ acceptance test for the route named in the command. Let’s go ahead and modify\
    \ it to look like the following:\n\n| [ch8/ember-note/tests/acceptance/register-test.js](http://media.pragprog.com/titles/mwjsember/code/ch8/ember-note/tests/acceptance/register-test.js)\
    \ |\n\n```javascript\nimport Ember from 'ember';\nimport { module, test } from\
