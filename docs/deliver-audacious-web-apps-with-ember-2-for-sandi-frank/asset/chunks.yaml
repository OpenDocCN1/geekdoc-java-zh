    \ Certain formats and characters may not display correctly without this setting.\
    \ Please refer to the instructions for your reader on how to enable the publisher\
    \ defaults setting.\n\n# Table of Contents\n\n- [Acknowledgments](#f_0005.html_acknowledgments)\n\
    - [Introduction: Why Ember?](#f_0006.html_d24e104)\n- [What This Book Is, and\
    \ Isn’t](#f_0007.html_what)\n- [Who Should Read This Book?](#f_0008.html_who)\n\
    - [How This Book Is Organized](#f_0009.html_how)\n- [Where to Go for Help](#f_0010.html_help)\n\
    - [1. Starting Your App with Ember](#f_0011.html_d24e214)\n    - [Install Ember\
    \ and Ember CLI](#f_0012.html_getting-cli)\n    - [Start Your App](#f_0013.html_starting-app)\n\
    \    - [Next Steps](#f_0014.html_next-steps-ch1)\n- [2. Directing Traffic with\
    \ Routes](#f_0015.html_d24e2841)\n    - [Use the Router Class to Organize Your\
    \ App](#f_0016.html_router)\n    - [Define Your Routes](#f_0017.html_routes)\n\
    \    - [Set Your Model](#f_0018.html_setting-your-model)\n    - [Nest Routes](#f_0019.html_nesting-routes)\n\
    \    - [Transition Between Routes](#f_0020.html_transitions)\n    - [Render Templates\
    \ into Named Outlets](#f_0021.html_named-outlets)\n    - [Next Steps](#f_0022.html_next-steps-ch2)\n\
    - [3. Laying Out a User Interface](#f_0023.html_d24e6004)\n    - [Make Your App\
    \ with a Single Page](#f_0024.html_app-js)\n    - [Segment Your UI into Templates](#f_0025.html_templates)\n\
    \    - [Render HTML Controls with Expressions](#f_0026.html_other-expressions)\n\
    \    - [Compile Templates](#f_0027.html_precompiling)\n    - [Next Steps](#f_0028.html_next-steps-ch3)\n\
    - [4. Building In Reuse with Components](#f_0029.html_components)\n    - [Create\
    \ Components](#f_0030.html_defining-components)\n    - [Get Data from Containing\
    \ Templates](#f_0031.html_component-models)\n    - [Define a Component Interface](#f_0032.html_comnent-interface)\n\
    \    - [Handle Actions](#f_0033.html_handling-actions)\n    - [Next Steps](#f_0034.html_next-steps-ch4)\n\
    - [5. Modeling Your Data](#f_0035.html_chp.models)\n    - [Define Your Models](#f_0036.html_models)\n\
    \    - [Load Data from RESTful Services](#f_0037.html_rest-adapters)\n    - [Work\
    \ with Records](#f_0038.html_crud)\n    - [Next Steps](#f_0039.html_next-steps-ch5)\n\
    - [6. Reading Nonstandard APIs](#f_0040.html_d24e1870)\n    - [Adapt to a Nonconventional\
    \ API](#f_0041.html_adapters)\n    - [Use Serializers to Access Legacy APIs](#f_0042.html_serializers)\n\
    \    - [Allow the Adapter to Query a Nonconventional API](#f_0043.html_adapter)\n\
    \    - [Adapt to Path Variations](#f_0044.html_path-name)\n    - [Change the Payload\
    \ Root](#f_0045.html_payload-root)\n    - [Modify the Payload in Flight](#f_0046.html_extract)\n\
    \    - [Tie Adapters and Serializers to Your Model Class](#f_0047.html_model-specific)\n\
    \    - [Next Steps](#f_0048.html_next-steps-ch6)\n- [7. Reusing Code in Ember](#f_0049.html_ch7)\n\
    \    - [Abstract Common Functions with Utilities](#f_0050.html_utilities)\n  \
    \  - [Share Code with Mixins](#f_0051.html_mixins)\n    - [Share Services with\
    \ Dependency Injection](#f_0052.html_dependency-injection)\n    - [Use Transforms\
    \ to Tweak Data](#f_0053.html_transforms)\n    - [Next Steps](#f_0054.html_next-steps-ch7)\n\
    - [8. Building, Testing, and Deploying Your Ember Apps](#f_0055.html_ch8)\n  \
    \  - [Build Your App](#f_0056.html_building)\n    - [Test and Debug Your App](#f_0057.html_testing)\n\
    \    - [Deploy Your App](#f_0058.html_deploying)\n    - [Next Steps](#f_0059.html_next-steps-ch8)\n\
    - [9. Building and Using Ember Addons](#f_0060.html_addons)\n    - [Install an\
    \ Ember Addon](#f_0061.html_installing-addons)\n    - [Develop Your Own Addon](#f_0062.html_developing-addons)\n\
    \    - [Next Steps](#f_0063.html_next-steps-ch9)\n\nCopyright © 2015, The Pragmatic\
    \ Bookshelf.\n\n# Early praise for Deliver Audacious Web Apps with Ember 2\n\n\
    Deliver Audacious Web Apps with Ember 2 provides a clear and thorough introduction\
    \ to the powerful and elegant Ember framework. Developers looking to learn Ember\
    \ or level up their Ember skills should read this book.\n\n> Nell Shamrell-Harrington,\
    \ Software development engineer, Chef\n\n> Ember brought back the fun of Rails,\
    \ this time for single-page applications with great performance.\n> Federico Tomassetti,\
    \ Software engineer\n\n> If you’re considering Ember for your next JavaScript\
    \ project, buy this book. I felt like I’d leveled up after every chapter.\n> Stephen\
    \ Orr, Senior software engineer, Impact Applications\n\n# Acknowledgments\n\n\
    Every book is the result of a lot of behind-the-scenes effort, particularly if\
    \ that book was written by a first-time author. The following people were very\
    \ helpful to me in creating this book.\n\nTo the Ember core team and the Ember\
    \ community: Thank you for making a product that was fun to learn and to write\
    \ about. The web is better off because you volunteered your time. Thank you!\n\
    \nTo my technical reviewers, Alessandro Bahgat, Jacob Chae, Javier Collado, Jeremy\
    \ Frens, Kenneth Geisshirt, Alexander Henry, Eric Hung, Jan Nonnen, Stephen Orr,\
    \ Shreerang Patwardhan, Martijn Reuvers, Brian Schau, Nell Shamrell-Harrington,\
    \ Tibor Simic, Charley Stran, Federico Tomassetti, Paul Waring, Nick Watts, and\
    \ Stephen Wolff: Thank you for lending your time and expertise to this project.\
    \ Your comments made this a much better book than I would have written alone.\n"
