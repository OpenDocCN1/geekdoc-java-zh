  raw: 'It’s worth noting that while we’ll use Node to run the Ember CLI development
    tools, Ember itself isn’t a server-side framework, despite the fact that Node
    supports server-side JavaScript development. Ember is used for creating browser-resident
    apps.


    To begin, let’s install Node^([[3]](#f_0014.html_FOOTNOTE-3)) and npm,^([[4]](#f_0014.html_FOOTNOTE-4))
    as well as Git.^([[5]](#f_0014.html_FOOTNOTE-5)) Node comes with npm, but npm
    is updated frequently, so it’s worth confirming that you have the latest. Please
    visit the sites to install the most recent version of these tools for your particular
    platform. Your Node install should be at least version 0.12 to support Ember CLI
    tooling. If you already have Node installed, you may need to uninstall the existing
    version first.


    The latter two installs are required by Bower. Npm is a package manager for code
    built to run within Node, or to be used with a tool that runs in Node. Git is
    a distributed version control system. Install all three using the installation
    instructions at the respective sites.


    | Installation |


    | --- |


    | ![images/aside-icons/tip.png](images/aside-icons/tip.png) | When installing
    each of these tools, you’ll want to be running as an administrative user. On a
    Linux/BSD/OS X system, you’ll probably want to use the sudo prefix to do this,
    and on Windows, you’ll need to be signed in as a user with admin rights. As with
    many installations, there are things that can go wrong, so if an issue arises,
    head to the book’s forum on [http://pragprog.com](http://pragprog.com) and we’ll
    work through it together. |


    With these tools installed, you can get Bower from a command line:


    | ​  | $ npm install -g bower |


    You should see several lines of command output, indicating that Bower and its
    dependencies have been pulled onto your machine. The -g command option asks Node
    to install Bower and make it available globally, rather than restricting it to
    a specific project. Once Bower has finished installing (you’ll see the command
    output stop and be returned to the command prompt), you can install PhantomJS:


    | ​  | $ npm install -g phantomjs |


    Again, you should see some command output that tells you PhantomJS was installed
    successfully. With these tools, you’re ready to get Ember CLI:


    | ​  | $ npm install -g ember-cli |


    Installing Ember CLI causes the Ember framework libraries to be installed, along
    with the CLI itself. Now that you have Ember and Ember CLI, we’re ready to start
    coding.


    ## Start Your App


    Ember CLI takes a very app-centric approach. The first thing you do is to create
    the app, and every module you create is part of that app. As a result, we’re going
    to follow suit, and explore all of Ember’s key concepts in the context of one
    app.


    We’ll be writing an app called EmberNote, a slimmed-down clone of Evernote,^([[6]](#f_0014.html_FOOTNOTE-6))
    the web-based note-taking app. Our first step is to create the app’s repository
    (so called because Ember CLI assumes you’ll be using Git as a version control
    system).


    ### Creating the App Repository


    Open a command prompt, navigate to a location where you keep your code, and run
    the following command:


    | ​  | $ ember new ember-note |


    This will create a new directory for your app. Take a look at the tip that follows
    if any issues arise.


    | New Projects with Ember CLI |


    | --- |


    | ![images/aside-icons/important.png](images/aside-icons/important.png) | As of
    this writing, there’s a probable race condition that can occur with Ember CLI
    when creating a new repository. If you see an error that looks something like
    this: ENOENT, open ’ember/package.json’, you may have run into this error. Usually,
    the ember new command succeeds on the second try.On certain non-Windows systems,
    you may also see a console warning about not having watchman installed. Ember
    CLI uses watchman to monitor your filesystem for changes and live deploys them
    to your local server as you’re working on your Ember app. It’s good to have watchman,
    if for no other reason than to avoid seeing this error, but it’s not necessary.
    Without watchman, Ember CLI uses a tool called NodeWatcher for the same purpose.
    If you want to install watchman, visit [https://facebook.github.io/watchman/docs/install.html](https://facebook.github.io/watchman/docs/install.html)
    for platform-specific installation instructions. |


    Before we write our UI code, let’s also install a Bootstrap stylesheet so we can
    enjoy a UI that doesn’t look like it’s from the early 1990s. From a command prompt
    in the newly created ember-note directory, run the following commands:


    | ​  | $ ​**cd**​ ember-note |


    | ​  | $ npm install |


    | ​  | $ bower install |


    | ​  | $ bower install bootstrap --save |


    Then add these lines to ember-note/ember-cli-build.js, right before the last line
    of code:


    | ​  | app.​**import**​(​*''bower_components/bootstrap/dist/css/bootstrap.css''*​);
    |


    | ​  | app.​**import**​(​*''bower_components/bootstrap/dist/css/bootstrap.css.map''*​,{
    |


    | ​  | destDir: ​*''assets''*​ |


    | ​  | }); |


    When you run these commands, Ember CLI creates your app’s folder structure for
    you. Our task throughout the rest of this book is to take that structure and fill
    in all of the details to make an app out of it. Make no mistake, Ember and Ember
    CLI are opinionated tools. They have built-in expectations of how to develop web
    apps, known as convention-over-configuration. The Ember team hopes to take a set
    of best practices, codify them into the framework, and allow the developer to
    focus on more important decisions. To get good use from these tools, you’ll want
    to follow their lead.


    ### Running Your App


    Let’s run the app we made and see what that looks like. From a command prompt
    in your new ember-note directory, run the following command:


    | ​  | $ ember serve |


    You should see some command output that tells you that your build was successful
    and that your app is running on port 4200 of your localhost. Let’s open the browser
    and check. You should see something similar to the output shown in the following
    figure if you point your browser to localhost:4200.


    ![images/welcome.png](images/welcome.png)


    The ember serve command did a few things for you. First, it built a deployable
    version of your app and placed it in the ember-note/dist directory. Then, it started
    a node instance at port 4200 and deployed your app to that instance for testing.
    Once you’ve run this command, it will pick up on changes you make to the source
    code.


    Let’s try one now. Open the ember-note/app/templates/application.hbs file. Its
    contents should look like this:


    | ​  | ​**<h2**​ id=​*"title"*​​**>**​Welcome to Ember​**</h2>**​ |


    | ​  |  |


    | ​  | {{outlet}} |


    Make a change to the file so the text says “Welcome to EmberNote.” The file should
    then look like this:


    | ​  | ​**<h2**​ id=​*"title"*​​**>**​Welcome to EmberNote​**</h2>**​ |


    | ​  |  |


    | ​  | {{outlet}} |


    As soon as you save the change, look at your browser. Ember CLI detected the change,
    rebuilt your app, and deployed it when you saved. This is a big time-saver, because
    you don’t have to manually take steps to redeploy the app yourself. It all happens
    out of the box with Ember CLI!


    You can see that Ember CLI is a handy tool to have around. Now it’s time to get
    into some code. If we’re going to build an app, we’ll need to be able to let users
    sign up, right? Let’s start there.


    ### Registering Users


    Let’s look at a straightforward example that will demonstrate many of the core
    features of an Ember app: routes, templates, and models. We’re going to build
    a simplified registration page that will allow users to sign up for the EmberNote
    service. This page has a single text field where the user can enter his or her
    username, a button to trigger the add action, and some text that will be displayed
    when a new user is added.'
