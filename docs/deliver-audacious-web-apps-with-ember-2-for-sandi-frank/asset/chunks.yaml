  trans: "\n首先，我们添加了一个输入字段，这样 `{{action}}` 就就有内容可以处理了。在路由中，动作处理器会获取该值并向服务器进行比对，以检查用户是否有效。`{{action}}`\
    \ 表达式绑定到我们添加的下一个控件上：一个显示“登录（Login）”文本的 HTML 按钮。通过这种方式，`{{action}}` 表达式将路由中的登录动作绑定到按钮的\
    \ `onclick` 事件上。`onclick` 事件是按钮的默认事件，这就是为什么 `{{action}}` 表达式绑定到此事件的原因。当按钮被点击时，登录动作就会触发。\n\
    \n我们在上一章中已经学习了很多关于动作（actions）的内容，所以这对你来说可能是一次复习。现在让我们来看编译模板。\n\n## 编译模板\n\n当你在\
    \ `template.hbs` 文件中创建模板时，你添加的 HTML 和表达式语言不会直接构建成字符串。从 Ember 1.10 版本开始，使用了一种名为\
    \ `HTMLBars` 的新模板编译器来渲染你的模板。通过这个编译器，会在你应用程序生成的 `ember-note.js` 文件中创建一个虚拟 DOM。只要你使用\
    \ Ember CLI 来构建应用程序，这些细节就会对你抽象化。\n\n这种形式的编译出于两个原因非常重要。首先，虚拟 DOM 的生成和更新比基于字符串的模板更快，因为虚拟\
    \ DOM 可以在单个节点（例如页面上的某个控件）级别进行处理，而不需要在控件值变化时重新生成整个模板。\n\n第二，正是这种形式的编译使得 Ember 能够使用服务端渲染。使用服务端渲染允许用户体验到更快的应用启动速度，而不是看到一个空的\
    \ UI 加载，并等待与服务器往返以显示应用的初始数据。Ember 的服务端渲染工具名为 `FastBoot`，仍在开发中，但承诺在发布后将极大扩展 Ember\
    \ 的功能。\n\n## Ember 插件：Ember CLI Datepicker\n\n正如你所见，Ember 提供了许多使用内置模板助手（template\
    \ helpers）渲染 HTML 字段的基础功能。然而，模板助手是 Ember 插件（addon）的完美用例，其中一个插件就是 `Ember CLI Datepicker`。\n\
    \n`Ember CLI Datepicker` 是一个插件，可以用最少的逻辑为你的 Web 应用程序添加 Bootstrap 风格的日期选择器控件。你可以通过添加单个表达式将此控件添加到页面中，例如：\n\
    \n| `{{bootstrap-datepicker placeholder=\"Choose a date\"}}` | 这将在你的应用中插入一个文本字段，点击时会弹出一个日期选择器。选择日期会将你的选择添加到文本字段中，允许用户快速输入日期。\
    \ |\n\n`Ember CLI Datepicker` 只是你可以用来快速在应用中添加控件的几个类似插件中的一个。网站 [`emberobserver.com`](http://emberobserver.com)\
    \ 是寻找除此单例之外的其他类似插件的绝佳起点。我们将在全书中继续看到特定的插件，并在第 9 章 构建和使用 Ember 插件 中讨论如何创建自己的插件。\n\
    \n`Ember CLI Datepicker` 的完整文档可以在 [`github.com/soulim/ember-cli-bootstrap-datepicker`](https://github.com/soulim/ember-cli-bootstrap-datepicker)\
    \ 获取，并附带有使用该插件的演示链接。\n\n## 下一步\n\n你现在应该很好地掌握了使用 Ember 和 Handlebars 表达式语言构建用户界面的流程。我们看到了模板是如何相互关联的，并且讨论了模板与路由之间紧密的关系，以及如何利用这种关系来渲染控件。在下一章中，我们将看看如何利用这些概念创建我们自己的可复用控件，这在\
    \ Ember 术语中被称为组件（components）。\n\nCopyright © 2015, The Pragmatic Bookshelf.\n\n\
    # 第 4 章：通过组件构建复用性\n\n路由和模板的结合是非常强大的，它负责了 Ember 为你的开发工作提升的大部分效率。但我们还有一个尚未涵盖的、甚至更强大的功能：组件。在\
    \ Ember 中，组件是一种通过创建可复用元素来扩展 HTML 的方法。与路由和模板的配对类似，它同时实现了用户界面和动作层。但组件与路由和模板的区别在于，界面层和动作层是不可分离的，而且组件的作用范围被限于传递到组件的信息。\n\
    \n组件的一个常见用例是，当你有一部分用户界面，希望它在应用程序的多个处复用时。某些示例可能是按钮、菜单，或者我们将要使用的示例：一个关联有特定逻辑的文本区域。\n\
    \n你可能已经意识到，到目前为止 `EmberNote` 的实际笔记内容较少。我们现在将通过增加创建真实内容笔记来改变这一点。为此，我们将创建一个新路由，依赖组件来驱动笔记的编辑。该组件将实现你预期编辑功能中的内容。你将能够编辑笔记的标题和正文并保存笔记，或者关闭组件并丢弃更改。\n\
    \n为了增加趣味性，我们将在笔记正文中使用 Markdown。Markdown 是一种轻量级语言，用于对纯文本应用基础的 HTML 格式。因此，我们还需要预览\
    \ Markdown 处理后生成的 HTML 的能力，我们将通过 Ember CLI 获取一个 Ember 插件来实现这一点。\n\n让我们通过为 Ember\
    \ 创建此编辑功能，来看看如何使用组件。\n\n## 创建组件由于组件使用模板来定义其 UI，但其本身又被添加到容器模板中，因此组件和模板之间的关系可能有点复杂。将\
    \ `input` 作为一个例子对我来说很有帮助。它是一个可以在通用模板中使用的独立控件。\n\n在创建组件之前，我们需要为它准备一个位置。我们将创建一个新路由，并在路由中引用我们的组件。由于我们正在编辑单条笔记，该路由最合理的位置是作为\
    \ notebooks 路由的子路由。\n\n从命令行界面运行以下 Ember CLI 命令：\n\n```\n$ ember generate route\
    \ notes/note --pod\n```\n\n这为新路由创建了一个空存根。我们稍后会填充这个新类。首先，我们需要修改路由实现和 notes 模板，以便导航到新路由。\n\
    \n当你创建新路由时，Ember CLI 修改了 Router 类，将该路由添加到层次结构中的相应位置。由于我们将查询 Ember Data 记录，我们需要为路由添加参数，以便将笔记的\
    \ ID 传递给子路由。打开 `router.js` 并将其更新为：\n\n```javascript\nimport Ember from 'ember';\n\
    import config from './config/environment';\n\nvar Router = Ember.Router.extend({\n\
    \  location: config.locationType\n});\n\nRouter.map(function() {\n  this.route('register');\n\
    \  this.route('login');\n  this.route('notebooks', { path: 'notebooks/:user_id'\
    \ }, function() {\n    this.route('notes', { path: 'notes/:notebook_id' }, function()\
    \ {\n      this.route('note', { path: 'note/:note_id' }, function(){});\n    });\n\
    \  });\n});\n\nexport default Router;\n```\n"
- fmt: "\nYou’ll recall that we use the `path` attribute in our call to `this.route`\
    \ to provide data to the route. The route can use the data from the `path` attribute\
    \ however it chooses. We’ll want to pass the ID of the current note. Let’s tweak\
    \ the notes template to provide this ID to the route:\n\n| [ch4/ember-note/app/notebooks/notes/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/notebooks/notes/template.hbs)\
    \ |\n\n```handlebars\n<div class=\"col-md-12\">\n  Notes\n</div>\n<div>\n  <div\
    \ class=\"col-md-4\">\n    <div>\n      title: {{input value=title}}<button {{action\
    \ 'addNote'}}>Add</button>\n    </div>\n    <div>\n      <ul>\n        {{#each\
    \ model as |note}}\n          <li>\n          {{link-to 'notebooks.notes.note'\
    \ note.id}}\n            {{note.title}}\n          {{/link-to}}\n          <button\
    \ {{action 'deleteNote' note}}>delete</button>\n          </li>\n        {{else}}\n\
    \          <div>No notes found</div>\n        {{/each}}\n      </ul>\n    </div>\n\
    \  </div>\n  <div class=\"col-md-8\">\n    {{outlet}}\n  </div>\n</div>\n```\n\
    \nThis changes the notes page from a static list of titles to a list of clickable\
    \ links. Adding the `note.id` value to the `{{link-to}}` expression causes that\
    \ value to be added into the URL when navigating to the new route. This lets us\
    \ load the related note record into the child route.\n\nWithin our new route,\
    \ we want to load the related record using Ember Data, and also provide an action\
    \ that allows us to close the route without saving. We’ll see shortly how to make\
    \ use of these additions. The `model` hook queries for the note record, and the\
    \ `close` action navigates away from the current route by transitioning to the\
    \ notes route.\n\nHere’s our implementation:\n\n| [ch4/ember-note/app/notebooks/notes/note/route.js](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/notebooks/notes/note/route.js)\
    \ |\n\n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n\
    \  model: function(params) {\n    return this.store.findRecord('note', params.note_id);\n\
    \  },\n\n  actions: {\n    close: function() {\n      this.transitionTo('notebooks.notes');\n\
    \    }\n  }\n});\n```\n\nWe’re now ready to start work on our component.\n\nAn\
    \ Ember component is defined by two files. The first is a Handlebars template,\
    \ which is used to define the user interface of the component. The second is a\
    \ JavaScript class that extends `Ember.Component`. This is used to define any\
    \ action-handling code that the template needs to perform.\n\nWe’ll call this\
    \ the edit-note component. As in other areas of Ember, the naming convention is\
    \ important here. A dash in the name of the component is how Ember identifies\
    \ it as a component. To create the necessary files using Ember CLI, run the following\
    \ command at the command prompt:\n\n```bash\n$ ember generate component edit-note\
    \ --pod\n```\n\nOnce again, we use the `--pod` form of the command, as it provides\
    \ us with a clean project structure. This command creates a directory and two\
    \ files. The directory is named for the component and resides at the following\
    \ location: `ember-note/app/components/edit-note`. This provides us with a single\
    \ place to go to look for our component definition.\n\nTwo files were also created\
    \ in the edit-note directory: `template.hbs` and `component.js`. The first is\
    \ meant to hold our Handlebars template, and the second is for our component logic.\n\
    \nWe now have a few stub files ready to contain our component. Because we want\
    \ to pass the record to the component, let’s look at how we provide data.\n\n\
    ## Get Data from Templates\n\nOne important distinction between a component and\
    \ route is that a component doesn’t have its own data. It relies on the calling\
    \ template to provide it. As long as the records passed to it contain the properties\
    \ it needs, it will work fine. Now, let’s see how the newly created route, modify\
    \ the template:\n\n| [ch4/ember-note/app/notebooks/note/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/notebooks/note/template.hbs)\
    \ |\n\n```handlebars\n{{edit-note note=model close=\"close\"}}\n```\n\nThe `note=model`\
    \ assignment sets the property on the component. In this case, we pass the record.\
    \ If this were not the case, we could have simply passed the values we wanted\
    \ instead of the entire record.\n\n## Define Component User Interface\n\nThe process\
    \ of building a component user interface should be familiar to you. For the most\
    \ part, you use the same set of expressions to build a component as you do to\
    \ build a template. The interface is composed using Handlebars and HTML, and can\
    \ access any properties defined by the component in the calling template.\n\n\
    As an example, let’s take a look at the interface for the edit-note:\n\n| [ch4/ember-note/app/components/edit-note/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/components/edit-note/template.hbs)\
    \ |\n\n```handlebars\n<div>\n  {{input value=note.title}}\n  <button {{action\
    \ \"saveNote\"}}>save</button>\n  <button {{action \"closeNote\"}}>close</button>\n\
    </div>\n<div>\n  {{textarea rows=10 cols=60 value=note.body}}\n</div>\n<div>\n\
    \  {{markdown-to-html markdown=note.body}}\n</div>\n<div>\n  {{yield}}\n</div>\n\
    ```\n\nThere’s very little about this template that’s different from one that’s\
    \ associated to a route. We’re accessing the `note` property, which we set when\
    \ we added this component to the note template. We use the same Handlebars expressions\
    \ to display data: the `{{input}}` and `textarea` expressions. These rely on information\
    \ stored in the note record passed to the component.\n"
