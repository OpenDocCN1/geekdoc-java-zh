  trans: "\n\n该插件现在已可以在 EmberNote 应用中使用了。首先，我们需要让 EmberNote 能够看到该插件。当你本地环境同时用于 `ember-bs-dropdown`\
    \ 插件和 EmberNote 应用时，你可以使用一组 `npm` 命令使该插件包在本地可用。我们将在发布你的插件中介绍如何将插件发布到 `npm` 或私有存储库。\n\
    \n要让你的本地 `npm` 缓存感知到该插件，请在 `ember-bs-dropdown` 目录下运行以下命令：\n\n```\n$ npm link\n\
    ```\n\n此命令会创建一个从本地 `npm` 缓存到你插件项目的符号链接。通过此链接，你本地机器上的其他项目可以使用你的插件，但需要额外执行一个步骤。你的本地应用也需要创建一个指向该\
    \ Ember 插件的链接。因此，请从 `ember-note` 目录运行以下命令：\n\n```\n$ npm link ember-bs-dropdown\n\
    ```\n\n现在 EmberNote 应用已经能够定位到我们创建的插件了。然而，虽然我们已经为应用提供了查看插件的路径，但它仍然感知不到它。如果你有一个正在运行的\
    \ `ember serve` 实例，请现在停止它。然后，将以下行添加到根目录下的 EmberNote `package.json` 文件的 `devDependencies`\
    \ 部分的最末端（请确保在上一行的末尾添加逗号）：\n\n```json\n\"ember-bs-dropdown\": \"*\"\n```\n\n现在，当我们下次运行\
    \ `ember serve` 时，应用将看到该下拉组件。先不要急着尝试；我们需要对 EmberNote 应用进行最后一次更改。打开笔记本模板并将其修改为如下所示：\n\
    \n```handlebars\n<!-- ch9/ember-note/app/notebooks/template.hbs -->\n<div>\n \
    \ <div class=\"col-md-3\">\n    Notebooks\n  </div>\n  <div>\n    title: {{input\
    \ value=title}}\n    <button {{action 'addNotebook'}}>Add</button>\n  </div>\n\
    \  {{bs-dropdown model=model route='notebooks.notes' dropdownName='Notebooks'}}\n\
    \  </div>\n  <div class=\"col-md-9\">\n    {{outlet}}\n  </div>\n</div>\n```\n\
    \n我们已经为新的插件组件替换了大量代码。我们使用 `{{bs-dropdown}}` 表达式来引用我们的自定义组件。表达式中的 `model=model`\
    \ 部分将笔记本模型传递到组件中。由于该模型类包含了正确的属性（即 `id` 和 `title` 属性），因此它运行起来应该良好。我们将 `notebook.notes`\
    \ 路由名称作为下拉菜单的器路由，并将“Notebooks”作为默认下拉值。\n\n在在此生效之前，我们需要对应用进行最后一次更改。我们需要从 `ember-cli-build.js`\
    \ 中移除 Bootstrap 资源。如果我们将它们留在那里，`ember serve` 命令会报错说我们重复定义了它们。由于我们现在依赖派自 Bootstrap\
    \ 的插件来提供组件，我们将让它来定义我们使用的版本。将 `ember-cli-build.js` 文件修改为：\n\n```javascript\n//\
    \ ch9/ember-note/ember-cli-build.js\n/* global require, module */\nvar EmberApp\
    \ = require('ember-cli/lib/broccoli/ember-app');\n\nmodule.exports = function(defaults)\
    \ {\n  var app = new EmberApp(defaults, {\n    // 在此处添加选项\n  });\n\n  // 使用 `app.import`\
    \ 将额外的库添加到生成的\n  // 输出文件中。\n  //\n  // 如果你需要在不同的环境中使用\n  // 资源，请指定一个对象作为第一个参数。该\n\
    \  // 对象的键应该是环境名称，值应该是\n  // 在该环境中使用的资源。\n  //\n  // 如果你包含的库包含 AMD 或 ES6\n  return\
    \ app;\n};\n```\n"
- fmt: '

    Ember is a mature framework in many ways, and it offers a lot of great features
    out of the box. However, there are many features that might be useful to a lot
    of developers without belonging in the core framework. That’s why one of the most
    compelling features of the Ember ecosystem is the `Ember` addon.


    There’s also much more to Ember than we were able to cover here. The Ember team
    does a great job of maintaining the project’s documentation. If you run across
    a use case that we haven’t discussed, there’s a good chance that Ember accounts
    for it, or there’s an addon that does. So check the docs on the Ember site or
    `Ember Observer`!


    The Ember project is always moving forward, and there are a number of great features
    in process at any time that will no doubt be useful to you. I’ll make every effort
    to keep this book fresh, but I encourage also you to check out the following sources
    to keep up with the project:


    * The Ember site: [http://emberjs.com](http://emberjs.com)

