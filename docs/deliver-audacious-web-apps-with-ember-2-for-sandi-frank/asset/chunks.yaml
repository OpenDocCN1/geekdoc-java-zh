  trans: "\n\n你可能记得，我们在调用 `this.route` 时使用了 `path` 属性来为路由提供数据。路由可以根据需要自由使用 `path`\
    \ 属性中的数据。我们想要传递当前笔记的 ID。让我们调整笔记模板，将此 ID 传递给路由：\n\n| [ch4/ember-note/app/notebooks/notes/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/notebooks/notes/template.hbs)\
    \ |\n\n```handlebars\n<div class=\"col-md-12\">\n  Notes\n</div>\n<div>\n  <div\
    \ class=\"col-md-4\">\n    <div>\n      title: {{input value=title}}<button {{action\
    \ 'addNote'}}>Add</button>\n    </div>\n    <div>\n      <ul>\n        {{#each\
    \ model as |note}}\n          <li>\n          {{link-to 'notebooks.notes.note'\
    \ note.id}}\n            {{note.title}}\n          {{/link-to}}\n          <button\
    \ {{action 'deleteNote' note}}>delete</button>\n          </li>\n        {{else}}\n\
    \          <div>No notes found</div>\n        {{/each}}\n      </ul>\n    </div>\n\
    \  </div>\n  <div class=\"col-md-8\">\n    {{outlet}}\n  </div>\n</div>\n```\n\
    \n这使得笔记页面从静态标题列表变为可点击的链接列表。在 `{{link-to}}` 表达式中添加 `note.id` 值，会导致该值在导航到新路由时被添加到\
    \ URL 中。这允许我们把相关的笔记记录加载到子路由中。\n\n在我们的新路由中，我们想要使用 Ember Data 加载相关记录，并提供一个允许我们在不保存的情况下关闭路由的动作。很快我们将看到如何使用这些新增。`model`\
    \ 钩子查询笔记记录，而 `close` 动作通过跳转到笔记路由离开当前路由。\n\n以下是我们的实现：\n\n| [ch4/ember-note/app/notebooks/notes/note/route.js](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/notebooks/notes/note/route.js)\
    \ |\n\n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n\
    \  model: function(params) {\n    return this.store.findRecord('note', params.note_id);\n\
    \  },\n\n  actions: {\n    close: function() {\n      this.transitionTo('notebooks.notes');\n\
    \    }\n  }\n});\n```\n\n我们现在准备好开始编写我们的组件了。\n\n一个 Ember 组件由两个文件定义。第一个是 Handlebars\
    \ 模板，用于定义组件的用户界面。第二个是继承自 `Ember.Component` 的 JavaScript 类。它用于定义模板需要执行的任何动作处理代码。\n\
    \n我们将其称为 `edit-note` 组件。与 Ember 的其他领域一样，命名约定在这里非常重要。组件名称中的连字符是 Ember 识别其为组件的方式。要使用\
    \ Ember CLI 创建必要的文件，请在命令行提示符运行以下命令：\n\n```bash\n$ ember generate component edit-note\
    \ --pod\n```\n\n我们再次使用了命令的 `--pod` ，因为它为我们提供了一个整洁的项目结构。该命令创建了一个目录和两个文件。该目录以组件命名，位于以下位置：`ember-note/app/components/edit-note`。这为我们提供了一个查找组件定义的单一位置。\n\
    \n`edit-note` 目录中还创建了两个文件：`template.hbs` 和 `component.js`。第一个用于存放我们的 Handlebars\
    \ 模板，第二个用于我们的组件逻辑。\n\n我们现在已经有了几个存位文件来包含我们的组件。由于我们想将记录传递给组件，让我们看看如何提供数据。\n\n##\
    \ 从模板获取数据\n\n组件和路由之间的一个重要区别是，组件没有它自己的数据。它依赖于调用模板来提供数据。只要传递给它的记录包含它所需的属性，它就能正常工作。现在，让我们看看新创建的路由修改模板：\n\
    \n| [ch4/ember-note/app/notebooks/note/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/notebooks/note/template.hbs)\
    \ |\n\n```handlebars\n{{edit-note note=model close=\"close\"}}\n```\n\n`note=model`\
    \ 赋值在组件上设置了该属性。在这种情况下，我们传递了记录。如果不是这样，我们可以简单传递我们想要的值，而不是整个记录。\n\n## 定义组件用户界面\n\n\
    构建组件用户界面的过程对你来说应该是熟悉的。在大多数情况下，你构建组件时使用的表达式与构建模板时使用的表达式相同。界面使用 Handlebars 和 HTML\
    \ 组成，并可以访问调用模板中由组件定义的任何属性。\n\n例如，让我们来看看 `edit-note` 的界面：\n\n| [ch4/ember-note/app/components/edit-note/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch4/ember-note/app/components/edit-note/template.hbs)\
    \ |\n\n```handlebars\n<div>\n  {{input value=note.title}}\n  <button {{action\
    \ \"saveNote\"}}>save</button>\n  <button {{action \"closeNote\"}}>close</button>\n\
    </div>\n<div>\n  {{textarea rows=10 cols=60 value=note.body}}\n</div>\n<div>\n\
    \  {{markdown-to-html markdown=note.body}}\n</div>\n<div>\n  {{yield}}\n</div>\n\
    ```\n\n这个模板与关联路由的模板相比几乎没有区别。我们正在访问 `note` 属性，这是我们将此组件添加到笔记模板时设置的。我们使用相同的 Handlebars\
    \ 表达式显示数据：`{{input}}` 和 `{{textarea}}` 表达式。这些依赖于存储在传递给组件的笔记记录中的信息。\n\n"
- fmt: "\nEmber components are a great idea, and the team deserves a ton of credit\
    \ for implementing them. As of this writing, there’s also an in-progress W3C specification\
    \ on custom elements, which is very similar to how Ember aims to use components.\
    \ Rather than wait for the W3C to finalize the specification (which can take a\
    \ very long time), Ember has charged forward with their implementation.\n\nIn\
    \ the W3C specification, a custom element is a developer-defined DOM element that\
    \ the browser is able to understand and render. It allows developers to define\
    \ both the user interface and action behavior for the DOM element, just like a\
    \ component does. This specification, should it be approved, will eventually become\
    \ a part of the HTML language, which should reduce the need for custom framework\
    \ support.\n\nThe Ember team keeps a close eye on the standards process, so you\
    \ should feel comfortable that your components will match the specification once\
    \ it’s released, as long as you’re keeping relatively current with Ember releases.\
    \ The in-progress specification is being written on GitHub, and you can read it\
    \ at any time by going to `https://w3c.github.io/webcomponents/spec/custom/`.\
    \ If you’re curious, take a look!\n\nThree other features are demonstrated here:\
    \ action handling, component nesting, and the `{{yield}}` tag. We’ll take a look\
    \ at action handling in [Handle Actions](#f_0033.html_handling-actions). Let’s\
    \ deal with the other two next.\n\n### Nesting Components\n\nA lot of the power\
    \ of working with Ember components comes from being able to take a combination\
    \ of HTML tags that occurs repeatedly throughout your app and create a reusable\
    \ expression that captures that combination. To make that feature even more powerful,\
    \ Ember components are able to be nested. That is, you can call one component\
    \ from within another component, and it works as you would expect it to work.\n\
    \nFor our new edit-note template, we’re already doing this. The reference to `{{markdown-to-html\
    \ markdown=note.body}}` is using another component, `markdown-to-html`. We haven’t\
    \ obtained this component yet, so this reference won’t work.\n\nThe `markdown-to-html`\
    \ component is part of an Ember addon. An Ember addon is a library that’s useful\
    \ enough to be shared across multiple applications. It can be made publicly available\
    \ via `npm`, like the one we’re using, or it can be kept in a private repository.\
    \ We’ll see much more on Ember addons in Chapter 9, [Building and Using Ember\
    \ Addons](#f_0060.html_addons).\n\nTo install the addon component, run the following\
    \ command:\n\n```\n$ ember install ember-cli-showdown\n```\n\nAt this point, if\
    \ your server is running, you may need to press `Ctrl-C` and then run `ember serve`\
    \ to restart. When you run this command, the EmberNote application is updated\
    \ to include a dependency on the `ember-cli-showdown` addon, which includes the\
    \ `markdown-to-html` component. The addon is downloaded, along with any needed\
    \ dependencies, and made available to Ember CLI for build and deployment with\
    \ the app.\n\nLet’s take a look at how we’re using this addon. In our template\
    \ for the edit-note component, we have the following line of code:\n\n```handlebars\n\
    {{markdown-to-html markdown=note.body}}\n```\n\nJust like using an `{{input}}`\
    \ expression to create a text field, or using the `{{edit-note}}` expression to\
    \ create an edit-note component, we use `{{markdown-to-html}}` to refer to the\
    \ `markdown-to-html` component. The only difference here is that we’re nesting\
    \ one component inside another. So, the only property data we’re able to use is\
    \ property data that’s already in the containing component.\n\nThe `markdown`\
    \ attribute in the previous expression is used to capture the property that the\
    \ component will use to render HTML. Given a note with a body that’s written in\
    \ Markdown, the component uses the `body`, applies a Markdown processor to the\
    \ `body`, and renders the resulting HTML. The nested components work well together,\
    \ as long as you remember to only use properties from the containing scope when\
    \ building the child component.\n\nNow that you’ve seen how to combine components\
    \ via nesting, let’s take a look at how a component can allow the calling template\
    \ to inject content into the component.\n\n### Using the Yield Expression\n\n\
    In the edit-note template we included a `{{yield}}` expression. This expression\
    \ allows the calling template to include content into the component. Let’s look\
    \ at a quick example.\n\nIn the note template at `ember-note/app/notebooks/notes/note/template.hbs`,\
    \ make the following update:\n\n```handlebars\n{{#edit-note note=model close=\"\
    close\"}}\n  Notebook: {{model.notebook.title}}\n{{/edit-note}}\n```\n\nWe’ve\
    \ changed the `edit-note` expression from an inline form to a block form and included\
    \ a body. This body will be rendered within the component at the location of the\
    \ `{{yield}}` tag. However, it is executed by the note template.\n\nThis is relevant\
    \ because it means that you have access to information in a different scope, the\
    \ scope of the calling template. In this example, because we’re passing the entire\
    \ `model` in to the `edit-note` component, it can see every field in that model.\
    \ However, if we had passed in just the `body` of the note object, then that’s\
    \ all it would’ve been able to see, and only the calling template would’ve been\
    \ able to see the full model object.\n\nThis notion of scope is also important\
    \ to think about when designing your actions. For now, let’s take a look at how\
    \ to tweak the root element.\n\n### Altering the Component’s Root Element\n\n\
    When you create a component, the HTML generated for that resides inside a root\
    \ element. By default, Ember uses a `div` tag as the root element. However, in\
    \ some cases, you may want to wrap your component in a root element. Any HTML5\
    \ element is a valid choice.\n\nTo set the component’s root element to something\
    \ other than `div`, you need to set the `tagName` property. You can accomplish\
    \ this in a few ways.\n\nFirst, it’s possible to set the value of this property\
    \ when you initialize the component in the calling template, like this:\n\n```handlebars\n\
    {{edit-note note=model close=\"close\" tagName=\"span\"}}\n```\n\nThis will change\
    \ the root element of the component to `span`. You can also set the value of the\
    \ property in the class itself, like this:\n\n```javascript\nimport Ember from\
    \ 'ember';\n\nexport default Ember.Component.extend({\n  tagName: 'span'\n});\n\
    ```\n\nThis has the same effect as setting the property in the calling template.\
    \ If you use both mechanisms but set different values, the value set by the calling\
    \ template wins out.\n\nWe’ve talked a lot about the display concerns related\
    \ to Ember components. Components are also able to define self-contained action\
    \ code. Let’s turn there next.\n\n## Handle Actions\n\nSimilar to how a component\
    \ can render its own content and accept content from the calling template (or\
    \ component), a component can define its own actions, or it can refer the action\
    \ back to the calling context.\n\nIt’s easy to see why this feature exists. In\
    \ certain cases, such as UI manipulation for the component’s UI, you’d prefer\
    \ not to rely on the calling context, or even allow the calling context to see\
    \ what you’re doing. In other cases, such as navigation, you want the calling\
    \ context to define the expected behavior.\n\nAnd there are some use cases that\
    \ lie in the middle, such as saving a record. If you have passed the entire record\
    \ into the component, you can save it there. Otherwise, you might have to save\
    \ it in the calling context.\n\n### Calling Component Actions\n\nWhen we created\
    \ our component with Ember CLI, it added a file called `ember-note/app/components/edit-note/component.js`\
    \ to our project. This is where we’ll define our action handlers.\n\nOpen the\
    \ file, and add the following code:\n"
  raw: 'Ember components are a great idea, and the team deserves a ton of credit for
    implementing them. As of this writing, there’s also an in-progress W3C specification
    on custom elements, which is very similar to how Ember aims to use components.
    Rather than wait for the W3C to finalize the specification (which can take a very
    long time), Ember has charged forward with their implementation.


    In the W3C specification, a custom element is a developer-defined DOM element
    that the browser is able to understand and render. It allows developers to define
    both the user interface and action behavior for the DOM element, just like a component
    does. This specification, should it be approved, will eventually become a part
    of the HTML language, which should reduce the need for custom framework support.


    The Ember team keeps a close eye on the standards process, so you should feel
    comfortable that your components will match the specification once it’s released,
    as long as you’re keeping relatively current with Ember releases. The in-progress
    specification is being written on GitHub, and you can read it at any time by going
    to [https://w3c.github.io/webcomponents/spec/custom/](https://w3c.github.io/webcomponents/spec/custom/).
    If you’re curious, take a look!


    Three other features are demonstrated here: action handling, component nesting,
    and the {{yield}} tag. We’ll take a look at action handling in [​*Handle Actions*​](#f_0033.html_handling-actions).
    Let’s deal with the other two next.


    ### Nesting Components


    A lot of the power of working with Ember components comes from being able to take
    a combination of HTML tags that occurs repeatedly throughout your app and create
    a reusable expression that captures that combination. To make that feature even
    more powerful, Ember components are able to be nested. That is, you can call one
    component from within another component, and it works as you would expect it to
    work.


    For our new edit-note template, we’re already doing this. The reference to {{markdown-to-html
    markdown=note.body}} is using another component, markdown-to-html. We haven’t
    obtained this component yet, so this reference won’t work.


    The markdown-to-html component is part of an Ember addon. An Ember addon is a
    library that’s useful enough to be shared across multiple applications. It can
    be made publicly available via npm, like the one we’re using, or it can be kept
    in a private repository. We’ll see much more on Ember addons in Chapter 9, [​*Building
    and Using Ember Addons*​](#f_0060.html_addons).


    To install the addon component, run the following command:


    | ​  | $ ember install ember-cli-showdown |


    At this point, if your server is running, you may need to press Ctrl-C and then
    run an ember serve to restart. When you run this command, the EmberNote application
    is updated to include a dependency on the ember-cli-showdown addon, which includes
    the markdown-to-html component.^([[7]](#f_0034.html_FOOTNOTE-7)) The addon is
    downloaded, along with any needed dependencies, and made available to Ember CLI
    for build and deployment with the app.


    Let’s take a look at how we’re using this addon. In our template for the edit-note
    component, we have the following line of code:


    | ​  | {{markdown-to-html markdown=note.body}} |


    Just like using an {{input}} expression to create a text field, or using the {{edit-note}}
    expression to create an edit-note component, we use {{markdown-to-html}} to refer
    to the markdown-to-html component. The only difference here is that we’re nesting
    one component inside another. So, the only property data we’re able to use is
    property data that’s already in the containing component.


    The markdown attribute in the previous expression is used to capture the property
    that the component will use to render HTML. Given a note with a body that’s written
    in Markdown, the component uses the body, applies a Markdown processor to the
    body, and renders the resulting HTML. The nested components work well together,
    as long as you remember to only use properties from the containing scope when
    building the child component.


    Now that you’ve seen how to combine components via nesting, let’s take a look
    at how a component can allow the calling template to inject content into the component.


    ### Using the Yield Expression


    In the edit-note template we included a {{yield}} expression. This expression
    allows the calling template to include content into the component. Let’s look
    at a quick example.


    In the note template at ember-note/app/notebooks/notes/note/template.hbs, make
    the following update:


    | ​  | {{#edit-note note=model close="close"}} |


    | ​  | Notebook: {{model.notebook.title}} |


    | ​  | {{/edit-note}} |


    We’ve changed the edit-note expression from an inline form to a block form and
    included a body. This body will be rendered within the component at the location
    of the {{yield}} tag. However, it is executed by the note template.


    This is relevant because it means that you have access to information in a different
    scope, the scope of the calling template. In this example, because we’re passing
    the entire note model in to the edit-note component, it can see every field in
    that model. However, if we had passed in just the body of the note object, then
    that’s all it would’ve been able to see, and only the calling template would’ve
    been able to see the full model object.


    This notion of scope is also important to think about when designing your actions,
    as it determines where your action will need to execute, as we’ll see shortly.
    For now, let’s take a look at how to tweak the root element your component is
    wrapped in.


    ### Altering the Component’s Root Element


    When you create a component, the HTML generated for that resides inside a root
    element. By default, Ember uses a <div> tag as the root HTML element. However,
    in some cases, you may want to wrap your component in a different root element.
    Any HTML5 element is a valid choice here.


    To set the component’s root element to something other than <div>, you need to
    set the tagName property on the component. You can accomplish this in a few ways.


    First, it’s possible to set the value of this property when you initialize the
    component in the containing template, like this:


    | ​  | {{edit-note note=model close="close" tagName="span"}} |


    This will change the root element of the component to <span>. You can also set
    the value of the property in the class itself, like this:


    | ​  | ​**import**​ Ember from ​*''ember''*​; |


    | ​  |  |


    | ​  | ​**export**​ ​**default**​ Ember.Component.extend({ |


    | ​  | tagName: ​*"span"*​ |


    | ​  | }); |


    This has the same effect as setting the property in the calling template. If you
    use both mechanisms but set different values, the value set by the calling template
    wins out.


    We’ve talked a lot about the display concerns related to Ember components. Components
    are also able to define self-contained action handling code. Let’s turn there
    next.


    ## Handle Actions


    Similar to how a component can render its own content and accept content from
    the calling template (or component), a component can define its own actions, or
    it can refer the action back to the calling context.


    It’s easy to see why this feature exists. In certain cases, such as UI manipulation
    for the component’s UI, you’d prefer not to rely on the calling context, or even
    allow the calling context to see what you’re doing. In other cases, such as navigation,
    you want the calling context to define the expected behavior.


    And there are some use cases that lie in the middle, such as saving a record.
    If you have passed the entire record into the component, you can save it there.
    Otherwise, you might have to save it in the calling context.


    ### Calling Component Actions


    When we created our component with Ember CLI, it added a file called ember-note/app/components/edit-note/component.js
    to our project. This is where we’ll define our action handlers.


