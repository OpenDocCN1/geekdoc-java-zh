  raw: 'Ember is a mature framework in many ways, and it offers a lot of great features
    out of the box. However, there are many features that might be useful to a lot
    of developers without belonging in the core framework. That’s why one of the most
    compelling features of the Ember ecosystem is the Ember addon.


    There’s also much more to Ember than we were able to cover here. The Ember team
    does a great job of maintaining the project’s documentation. If you run across
    a use case that we haven’t discussed, there’s a good chance that Ember accounts
    for it, or there’s an addon that does. So check the docs on the Ember site or
    Ember Observer!


    The Ember project is always moving forward, and there are a number of great features
    in process at any time that will no doubt be useful to you. I’ll make every effort
    to keep this book fresh, but I encourage also you to check out the following sources
    to keep up with the project:


    *   The Ember site: [http://emberjs.com](http://emberjs.com)


    *   Ember on GitHub: [https://github.com/emberjs](https://github.com/emberjs)


