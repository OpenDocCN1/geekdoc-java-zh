    \ to tell you which test it’s running.\n\nNext, we’ll do some setup work. The\
    \ call to `this.subject` creates an instance of the `notebook` class that we’re\
    \ going to use to test. We’ll then initialize a variable called `note` that we’ll\
    \ populate with note instances. And we’ll create a random number between 1 and\
    \ 10, to test that the right number of note instances are added to the notebook.\n\
    \nHere’s where we’ll use the instance of `Ember` imported earlier. Because the\
    \ work we’re about to do runs asynchronously and has side effects, the test runner\
    \ requires that we do this work inside our own run loop. Within that run loop,\
    \ we’ll use the random number from earlier to generate the expected number of\
    \ note instances, and then add them to the notebook.\n\nAt this point you might\
    \ be unsure as to when to use `Ember.run` and when not to. Rest assured, the test\
