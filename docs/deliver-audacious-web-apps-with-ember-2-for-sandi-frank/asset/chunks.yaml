  trans: "\n\n在你的浏览器中，你将看到显示的测试结果。滚动结果，你应该能看到失败的测试。在我们修复其中一些失败的测试之前（是的，这些测试确实需要一些调整），让我们先简单聊一下\
    \ Ember CLI 用于完成测试执行的工具链。\n\n当你从命令行运行 `ember test` 命令时，Ember CLI 会启动一个 `PhantomJS`\
    \ 实例。`PhantomJS` 是一个无头 浏览器（没有用户界面的浏览器），完全用 JavaScript 编写。通过使用 `PhantomJS`，你可以将测试作为持续集成过程（continuous\
    \ integration）的一部分来执行。持续集成是在在专用构建机器上通过自动化过程定期编译软件的实践。使用持续集成，你可以检查新更改是否引入了错误。如果你采用了持续集成，那么你的测试应该在构建过程中运行。使用\
    \ `PhantomJS` 允许你的测试在不需要在持续集成机器上安装传统浏览器的情况下进行。\n\n当你通过访问 `localhost:4200/tests`\
    \ 来运行测试时，你实际上在使用一个 Ember CLI 在你更新应用时构建的 Ember 应用。该应用的作用是运行你的测试并向你显示结果。它会运行每一个测试，并提供几个选项让你决定想要查看哪些测试结果。\n\
    \n这回顾测试结果的两种方法都是用的，而且它们在你的开发计划中都有其地位。在本章的剩余部分中，我们将依赖于 `localhost:4200` 可见的测试视图，因为它提供了略更好的用户体验。\n\
    \n既然有了查看测试结果的方法，让我们开始编写我们将要编写的最基础的测试：单元测试。\n\n### 编写单元测试\n\n使用基于模块的 JavaScript\
    \ 方法的好处在于，我们可以以模块化的方式来考虑测试。Ember CLI 为我们创建的每个应用模块创建一个测试模块。现在让我们来看其中一个。当你创建 note\
    \ 模型类时，Ember CLI 在 `ember-note/tests/unit` 目录下创建了一个名为 `note-test.js` 的文件作为测试。生成的文件如下：\n\
    \n```javascript\nimport {\n  moduleForModel,\n  test\n} from 'ember-qunit';\n\n\
    moduleForModel('notebook', 'Unit | Model | notebook', {\n  // 指定此此测试所需的其他单元。\n\
    \  needs: [];\n});\n\ntest('it exists', function(assert) {\n  var model = this.subject();\n\
    \  // var store = this.store();\n  assert.ok(!!model);\n});\n```\n\nimport 块从\
    \ `ember-qunit` 引入了 `moduleForModel` 和 `test` 函数。这些函数在测试类中分别用于加载我们想要测试的类，然后对它执行测试。要使用\
    \ `ember test` 命令或通过浏览器进行测试，你主要依赖于三个测试框架：`QUnit`、`ember-test-helpers` 和 `ember-qunit`。这些框架中的每一个都为你为测试用例编写的一些代码起着作用。`QUnit`\
    \ 是一个最初为 jQuery 编写的通用测试框架；`ember-test-helpers` 是一组 Ember 特有的测试辅助工具，需要特定的测试框架（如\
    \ `QUnit`）才能运行；而 `ember-qunit` 则将两者胶接在一起。\n\n#### 测试用例依赖\n\n这个生成的单元测试将确认最基本的行为：可以创建\
    \ note 模型类的实例。现在，这个测试是一个失败的测试。如果你查看测试结果，你应该看到一条显示“No model found for notebook”（未找到\
    \ notebook 模型）的消息。为什么它报告找不到 notebook 呢？因为 note 模型类包含了对 notebook 的 `belongsTo`。让我们修复它。将你的测试用例的\
    \ `needs` 数组更改如下：\n\n```javascript\nneeds: [\n  'model:user',\n  'model:note'\n\
    ];\n```\n\n一旦你做了该更改，失败的 notebook 模型测试应该就会通过。通过浏览器重新运行测试以确认。如果你想要一组整洁的测试，你也可以对\
    \ note 测试进行类似的更改使它们通过。\n\n你还需要对应用序列化器（serializer）的测试用例进行一些更改使其通过。如下所示更新 `moduleForModel`\
    \ 代码：\n\n```javascript\nmoduleForModel('user', 'Unit | Serializer | application',\
    \ {\n  // 指定此测试所需的其他单元。\n  needs: ['model:user']\n});\n```\n\n此更改更新了序列化器测试，使其依赖于我们的模型类之一——`user`\
    \ 模型。Ember CLI 的序列化器测试蓝图寻找一个名为 `application` 的模型，而这个模型在我们的应用中并不存在。更改为确实存在的类允许此测试通过。\n\
    \n通过这些更改，我们更新了大多数测试以使用正确的依赖。你可能会注意到 `edit-note` 测试目前正在失败。让它保持原样即可。我们很快就会处理它。首先，让我们看看如何为模型编写单元测试。\n\
    \n#### 为模型进行单元测试\n\n在许多情况下，你可能不需要为你的模型类编写测试用例。如果你的模型类完全依赖框架定义的行为（就像我们的那样），你甚至不需要编写测试用例。但让我们增加一点复杂性，在我们的\
    \ notebook 模型中添加一个函数，计算与 notebook 实例关联的笔记数量。更新你的 notebook 模型如下：\n\n```javascript\n\
    import DS from 'ember-data';\n\nexport default DS.Model.extend({\n  title: DS.attr('string'),\n\
    \  user: DS.belongsTo('user'),\n  notes: DS.hasMany('note'),\n  noteCount: function()\
    \ {\n    return this.get('notes.length');\n  }\n});\n```\n\n`noteCount` 函数获取 `notes`\
    \ 属性的副本（它指向关联的数组），并返回数组的长度。这就是它的意图。现在，让我们写一个测试来确认这一点。更新你的 `notebook-test.js` 文件如下：\n\
    \n```javascript\nimport {\n  moduleForModel,\n  test\n} from 'ember-qunit';\n\
    import Ember from 'ember';\n\nmoduleForModel('notebook', 'Unit | Model | notebook',\
    \ {\n  // 指定此测试所需的其他单元。\n  needs: [\n    'model:user',\n    'model:note'\n  ];\n\
    });\n\ntest('it exists', function(assert) {\n  var model = this.subject();\n \
    \ // var store = this.store();\n  assert.ok(!!model);\n});\n```\n\n"
