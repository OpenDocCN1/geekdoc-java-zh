    \nMixins 是共享代码的一种极方法，但 `Ember` 提供的更多。有时，你可能想要共享状态或服务的访问权限。`Ember` 有一种称为依赖注入（dependency\
    \ injection）的方法，你接下来将学习。\n\n## 使用依赖注入共享服务\n\n我们目前为止涵盖的功能帮助你通过创建可重用的类并在并在对象之间共享它们来实现健壮的设计。Mixins\
    \ 和工具类非常适合抽象行为，但对于更复杂的抽象，你可能希望创建一个服务并使用依赖注入将其贯穿于整个应用。\n\n“服务（Service）”可以解释为不同的含义，所以让我们从定义什么是服务开始。服务是一个自包含的功能单元。它以松耦合的方式让不相关的对象访问其功能。`Ember`\
    \ 默认提供了几个服务。例如，应用程序的 `Ember.Router`实例就是一个很好的服务示例：它在单处管理 URL 层次结构，并为其他对象（特别是 `EmberRoute`）提供该层次结构的访问。另一个例子是\
    \ `Ember Data`，它是在整个应用中可用的服务。\n\n为了以松耦合的方式提供服务，`Ember` 需要为客户端提供它。在依赖注入模式中，服务（即依赖）在客户端外部实例化，稍后注入到其中。让我们来看看初始化器（initializers）。\n\
    \n### 使用初始化器\n\n为了让依赖注入生效，`Ember` 必须在应用的初始加载期间完成一些工作。这发生在应用程序生命周期的早期非常重要，因为使用依赖注入的服务类型通常用于很多地方。为了实现这一点，你可以使用\
    \ `EmberApplication.initializer`。\n\n我们已经在 [创建和注入用户] 中用过初始化器，但现在我们将创建第二个初始化器以集中管理行为。运行以下命令：\n\
    \n```bash\n$ ember generate initializer logger\n```\n\n当我们运行此命令时，`Ember CLI` 会创建一个空的初始化器存根：\n\
    \n```javascript\nexport function initialize(container, application) {\n  // application.inject('route',\
    \ 'foo', 'service:foo');\n}\n\nexport default {\n  name: 'logger',\n  initialize:\
    \ initialize\n};\n```\n\n当用户首次打开你的应用时，你创建的每个初始化器都会运行 `initialize` 函数。当然，你可能需要控制它们运行的顺序。对于这一点，`Ember`\
    \ 遵循你定义的顺序。如果你注意到，初始化器包含一个 `name` 属性。\n\n你可能还会使用名为 `before` 的属性和名为 `after` 的属性。每个属性都接受字符串或字符串数组。`before`\
    \ 和 `after` 属性使用其他初始化器的 `name` 属性来确定执行顺序。如果向这些属性传递一个数组，则数组中的每个初始化器都会被考虑。\n\n###\
    \ 注入类\n\n当你以基于服务的方法设计应用时，你创建的是那些旨在在整个应用中重用的对象。\n\n"
- fmt: "\nTo use dependency injection in Ember, you generally perform two steps. First,\
    \ you register the service with the container; then you inject it into any class\
    \ factory that you want to have access to it.\n\nThe following code demonstrates\
    \ how to implement these steps to inject our new logger initializer:\n\n```javascript\n\
    // ch7/ember-note/app/initializers/logger.js\nimport Ember from 'ember';\n\nexport\
    \ function initialize(registry, application) {\n  var logger = Ember.Object.extend({\n\
    \    log: function(message) {\n      console.log(message);\n    }\n  });\n  application.register('logger:main',\
    \ logger);\n  application.inject('route', 'logger', 'logger:main');\n}\n\nexport\
    \ default {\n  name: 'logger',\n  initialize: initialize\n};\n```\n\nThe first\
    \ thing we do is to create our logger implementation. It’s an extension of `Ember.Object`,\
    \ and has a simple one-parameter wrapper around the JavaScript console object.\n\
    \nNext, we register this new class using the `register` method of the `Ember.Application`\
    \ object passed in to the `initialize` function. The `register` method accepts\
    \ up to three parameters: the name of the object registered (`logger:main`), the\
    \ factory (the `logger` variable that points to our new class), and an options\
    \ hash.\n\nThe options hash can contain two properties: `instantiate` and `singleton`.\
    \ By default, the factory’s `create` method will be called unless an options hash\
    \ is passed with a value of `false`. If `singleton` is false, then multiple instances\
    \ of this object could be created when the object is looked up; otherwise the\
    \ same instance is returned from each lookup.\n\nThe `inject` method is what takes\
    \ this newly registered factory and makes it available throughout the app. The\
    \ `inject` method takes three parameters. The first is the name of the factory\
    \ into which your new factory is injected. In our case, we’re injecting our new\
    \ logger into each route implementation by passing the `route` factory into `inject`.\
    \ You can inject into specific implementations by identifying them by name (for\
    \ example, `route:notebooks`). The second parameter is the name of the property\
    \ that will receive the instance of the new factory. This property is how you\
    \ reference the injected service from the client class. And last, the third parameter\
    \ is the injection name of the factory you want to inject, which should match\
    \ the name it was registered under (for example, `logger:main`).\n\nOnce the injection\
    \ is completed during the app’s initialization process, it’s available under the\
    \ assigned property name in each instance into which it was injected. The following\
    \ code demonstrates the use of an injected service from a class:\n\n```javascript\n\
    // ch7/ember-note/app/notebooks/route.js\nimport Ember from 'ember';\n\nexport\
    \ default Ember.Route.extend({\n  model: function(params) {\n    return this.store.query('notebook',\
    \ {user: params.user_id});\n  },\n  actions: {\n    addNotebook: function() {\n\
    \      var notebook = this.store.createRecord('notebook', {\n        title: this.controller.get('title'),\n\
    \        user: this.session.get('user')\n      });\n      notebook.save().then(()\
    \ => {\n        this.logger.log('save successful');\n        this.controller.set('title',\
    \ null);\n        this.refresh();\n      }, () => {\n        this.logger.log('save\
    \ failed');\n      });\n    }\n  }\n});\n```\n\nWith the logging class registered\
    \ and injected in the initializer, a property called `logger` is available in\
    \ all of your app’s instances of `Ember.Route`. The figure illustrates how these\
    \ pieces fit together:\n\n![images/dependency-injection.png](images/dependency-injection.png)\n\
    \nThe Ember Data framework uses dependency injection to good effect. When you\
    \ reference the `store` property in your route implementations, it’s because that\
    \ property was set via an injection initializer that Ember Data set up.\n\nThere’s\
    \ an alternative to globally injecting a service into an object factory. If you\
    \ want to use a service in a limited subset of objects, you can use dependency\
    \ injection. Let’s say you have a service `foo` you want to use within a route:\n\
    \n```javascript\nimport Ember from 'ember';\n\nexport default Ember.Route.extend({\n\
    \  fooService: Ember.inject('foo'),\n  model: function(params) {\n    return this.foo(params);\n\
    \  }\n});\n```\n\nAssuming you have registered a service in the initializer, you\
    \ can access it using `this.fooService`. The distinction is that in the initializer,\
    \ rather than register `foo:main`, you need to register it under `foo`.\n\nUtilities,\
    \ mixins, and dependency injection are three helpful ways of making your code\
    \ modular.\n\n## Use Transforms to Tweak Data\n\nIf you’re using Ember Data to\
    \ access a legacy API, or even to use data from an upstream source, you may need\
    \ to perform some transformation on a value before using it in your app. For this\
    \ use case, Ember Data includes the `DS.Transform` class. `DS.Transform` encapsulates\
    \ the logic needed to take data from one form into the desired form.\n\nEmber\
    \ Data comes with few built-in `DS.Transform` implementations: `DS.BooleanTransform`,\
    \ `DS.DateTransform`, and `DS.NumberTransform`. Each of these is responsible for\
    \ taking data from a non-canonical form and translating it into the expected form.\
    \ For example, `DS.BooleanTransform` is able to take raw JSON with a value of\
    \ \"true\" or 1 and transform it into a Boolean `true`.\n\nTo get started, you\
    \ execute the following Ember CLI command:\n\n`ember generate transform native-currency`\n\
    \nThis command generates an empty transform stub. The following example illustrates\
    \ how the transform would be built:\n\n```javascript\nimport DS from 'ember-data';\n\
    \nexport default DS.Transform.extend({\n  deserialize(serialized) {\n    // Perform\
    \ your currency translation here\n    var amountInNative = this.currencyTranslator.translateToNative(serialized);\n\
    \    return amountInNative;\n  },\n  serialize(deserialized) {\n    // Translate\
    \ from native to USD\n    var amountInUSD = this.currencyTranslator.translateToUSD(deserialized);\n\
    \    return amountInUSD;\n  }\n});\n```\n"
