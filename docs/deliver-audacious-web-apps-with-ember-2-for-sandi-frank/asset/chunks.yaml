- fmt: "\nIf you’re curious, give the `Inspector` a try. A good place to begin is\
    \ by loading the `Inspector` while sitting on the login page. Before you log in,\
    \ move over to the `Data` tab in the `Inspector`. Once you log in, you should\
    \ see the user and notebook model types begin to reflect that you’ve loaded data.\n\
    \nOne other useful feature is the `Deprecations` tab. This tab helps you to identify\
    \ outdated use of the Ember framework. If you have existing code that you’re in\
    \ the process of migrating to Ember 2, this can be helpful in that migration effort.\n\
    \nLastly, the `Container` tab of the `Inspector`, which is shown in the following\
    \ figure, shows you each and every object you’ve created and some that Ember created\
    \ for you. This can be useful in observing the data in objects like injected services,\
    \ such as our session object.\n\n![images/inspector.png](images/inspector.png)\n\
    \nWith a deep, browser-based object model such as Ember’s, you need rich debugging\
    \ tools. As with many things, Ember has solved this problem in a useful and intuitive\
    \ way. Before we wrap up this chapter, let’s take a look at how you can create\
    \ deployable Ember artifacts using `Ember CLI`.\n\n## Deploy Your App\n\nIt’s\
    \ been a long road to get here, but at last you’re ready to deploy your app. Maybe\
    \ you’re putting it onto a development server, maybe to production. In either\
    \ case, you’re going to put it out somewhere for the world to see.\n\n`Ember CLI`\
    \ ships with a command to create a deployable artifact set for your application.\
    \ From a command prompt, run the following:\n\n```\n|  | $ ember build |\n```\n\
    \nThis runs the development version of your build by default. The resulting artifacts\
    \ will be located in the `ember-note/dist` directory. These include a JavaScript\
    \ file and stylesheet named for the app (`ember-note.js` and `ember-note.css`),\
    \ and a file containing the dependencies for those files (`vendor.js` and `vendor.css`).\
    \ A number of other files are also included to support the test application, as\
    \ well as `crossdomain.xml` and `robots.txt`, and of course your root `index.html`.\n\
    \nIf you want to deploy to production, though, you have different needs. If you\
    \ take a look at the `ember-note.js`, `ember-note.css`, `vendor.js`, and `vendor.css`\
    \ files, they are relatively easy to read and debug. But they are also bloated,\
    \ and always named the same thing, which means they are slow to load and cached\
    \ by the browser.\n\nTo deploy a production-grade build, you’ll want to run the\
    \ `ember build` command with the `--environment production` flag set. This generates\
    \ versions of those files that are minified where appropriate, and uniquely named\
    \ so as not to be cached. The test files are excluded. These artifacts can be\
    \ placed on your chosen high-performing web server, and your app is ready for\
    \ the world to see. Another often difficult problem solved by Ember.\n\n## Next\
    \ Steps\n\nWe’ve seen how `Ember CLI` helps you to build, test, debug, and deploy\
    \ your app. But we’re not quite done yet. Along the way to delivering your killer\
    \ app with Ember, you’ve likely used some addons, and possibly created some code\
    \ you think others would find useful. In the last chapter, we’ll take a closer\
    \ look at how to find and install addons into your app. We’ll also see how to\
    \ publish an addon, either to a private repository for sharing between your own.\n\
    \n### Chapter 9: Building and Using Addons\n\nThroughout the book we’ve seen how\
    \ to use addons. An addon is a modular piece of code that can be shared between\
    \ applications, or even publicly. Along the way to delivering your killer app\
    \ with Ember, you’ve likely used some addons, and possibly created some code you\
    \ think others would find useful. In the last chapter, we’ll take a closer look\
    \ at how to find and install addons into your app. We’ll also see how to publish\
    \ an addon, either to a private repository for sharing between your own.\n\nThere’s\
    \ a lot of productivity to be gained from using addons, but sometimes you have\
    \ a great idea that you want to share with others. For that, you may want to develop\
    \ your own addon. Developing an addon and learning how to release it to the community\
    \ is the last step on our journey.\n\nTo begin, let’s review how to use an addon.\n\
    \n## Install an Addon\n\nEmber addons aren’t technically a feature of Ember, but\
    \ rather a feature of `Ember CLI`. This distinction is important because if you\
    \ want to use addons, you need `Ember CLI`.\n\nThis becomes apparent when you\
    \ look at how to obtain an addon. We’ve already done this once when we pulled\
    \ in `ember-cli-showdown` to format our text using Markdown. In order to get that\
    \ addon, we ran the following:\n\n```\n|  | $ ember install ember-cli-showdown\
    \ |\n```\n\nWhen you run this command, `Ember CLI` searches the npm database for\
    \ the requested addon and installs it into your `node_modules` directory. You\
    \ can then use the addon just as you would any code that is part of your application.\
    \ The addon’s documentation, generally contained in its `README.md` file, should\
    \ describe how to use the addon.\n\nThere are a few different ways of discovering\
    \ addons. My preference, which I used most in this book, is via `Ember Observer`[^11].\
    \ This tool scores the addons. Once you’ve found the addon you want to use, the\
    \ `README.md` file usually tells you how to use the project.\n\n#### Footnotes\n\
    \n[9]: [Google Search](https://www.google.com/search)  \n[10]: [Ember Addons](https://addons.emberjs.com/)\
    \  \n[11]: [Ember Observer](https://www.google.com/ember-observer)\n\n## Develop\
    \ Your Own Addon\n\nIf you work with Ember and `Ember CLI` long enough, you’ll\
    \ find that you want to share code between apps, whether pointing multiple apps\
    \ at an addon in a private Git repository, or publishing your addon publicly via\
    \ npm. We’ve already seen how to obtain and use a third-party addon within your\
    \ app. Now, let’s talk about how to create an addon to be shared between your\
    \ applications, or even to be used by others.\n\nA natural use of Ember addons\
    \ is to create a reusable web component library. Many such libraries exist that\
    \ contain reusable web controls, like buttons or menu bars; we’ve even discussed\
    \ a few in this book. Let’s start a small one right now with a single control:\
    \ a Bootstrap-styled drop-down list, which we’ll use to replace the notebook list\
    \ in the EmberNote app with a drop-down of notebook records. This drop-down will\
    \ change to the chosen notebook when the user picks an entry in the list.\n\n\
    We’ll start by creating the basic structure for our addon using `Ember CLI`.\n\
    \n### Creating the Addon\n"
  raw: 'If you’re curious, give the Inspector a try. A good place to begin is by loading
    the Inspector while sitting on the login page. Before you log in, move over to
    the Data tab in the Inspector. Once you log in, you should see the user and notebook
    model types begin to reflect that you’ve loaded data.


    One other useful feature is the Deprecations tab. This tab helps you to identify
    outdated use of the Ember framework. If you have existing code that you’re in
    the process of migrating to Ember 2, this can be helpful in that migration effort.


    Lastly, the Container tab of the Inspector, which is shown in the following figure,
    shows you each and every object you’ve created and some that Ember created for
    you. This can be useful in observing the data in objects like injected services,
    such as our session object.


    ![images/inspector.png](images/inspector.png)


    With a deep, browser-based object model such as Ember’s, you need rich debugging
    tools. As with many things, Ember has solved this problem in a useful and intuitive
    way. Before we wrap up this chapter, let’s take a look at how you can create deployable
    Ember artifacts using Ember CLI.


    ## Deploy Your App


    It’s been a long road to get here, but at last you’re ready to deploy your app.
    Maybe you’re putting it onto a development server, maybe to production. In either
    case, you’re going to put it out somewhere for the world to see.


    Ember CLI ships with a command to create a deployable artifact set for your application.
    From a command prompt, run the following:


    | ​  | $ ember build |


    This runs the development version of your build by default. The resulting artifacts
    will be located in the ember-note/dist directory. These include a JavaScript file
    and stylesheet named for the app (ember-note.js and ember-note.css), and a file
    containing the dependencies for those files (vendor.js and vendor.css). A number
    of other files are also included to support the test application, as well as crossdomain.xml
    and robots.txt, and of course your root index.html.


    If you want to deploy to production, though, you have different needs. If you
    take a look at the ember-note.js, ember-note.css, vendor.js, and vendor.css files,
    they are relatively easy to read and debug. But they are also bloated, and always
    named the same thing, which means they are slow to load and cached by the browser.


    To deploy a production-grade build, you’ll want to run the ember build command
    with the --environment production flag set. This generates versions of those files
    that are minified where appropriate, and uniquely named so as not to be cached.
    The test files are excluded. These artifacts can be placed on your chosen high-performing
    web server, and your app is ready for the world to see. Another often difficult
    problem solved by Ember.


    ## Next Steps


    We’ve seen how Ember CLI helps you to build, test, debug, and deploy your app.
    But we’re not quite done yet. Along the way to delivering your killer app with
    Ember, you’ve likely used some addons, and possibly created some code you think
    others would find useful. In the last chapter, we’ll take a closer look at how
    to find and install addons into your app. We’ll also see how to publish an addon,
    either to a private repository for sharing between your own apps, or to a public
    repository for sharing with the world.


