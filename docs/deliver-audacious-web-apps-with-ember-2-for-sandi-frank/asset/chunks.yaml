    预期将按照请求提供的内容对记录进行更改保存。


    ## 删除记录


    当然，你的用户有时会犯错，或者想要放弃数据。为了这一点，你希望允许他们删除记录。Ember Data 提供了两种实现此目标的方法。第一种与我们目前看到的的方法类似。让我们稍微扩展一下
    `EmberNote`，允许用户在 `notebooks/notes` 路由中删除笔记。我们先在笔记列表中添加一个删除按钮。请确保模板看起来如下所示：


    | [ch5/ember-note/app/notebooks/notes/template.hbs](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/notebooks/notes/template.hbs)
    |

    | ​� | | <div class="col-md-12"></div> |

    | ​� | | Notes |

    | ​� | | </div> |

    | ​� | | <div> |

    | ​� | | <div class="col-md-4"></div> |

    | ​� | | <div> |

    | ​� | | title: {{input value=title}} <button {{action ''addNote''}}>Add</button>
    |

    | ​� | | </div> |

    | ​� | | <div> |

    | ​� | | <ul> |

    | ​� | {{#each model as note}} |

    | ​� | | <li> |

    | ​� | {{#link-to ''notebooks.notes.note'' note.id}} |

    | ​� | {{note.title}} |

    | ​� | {{/link-to}} |

    | ​� | | <button {{action ''deleteNote'' note}}>delete</button> |

    | ​� | | </li> |

    | ​� | {{else}} |

    | ​� | | <div>No notes found</div> |

    | ​� | {{/each}} |

    | ​� | | </ul> |

    | ​� | | </div> |

    | ​� | | </div> |

    | ​� | | <div class="col-md-8"> |

    | ​� | | {{outlet}} |

    | ​� | | </div> |

    | ​� | | </div> |


    现在，让我们修改路由，以定义从新按钮中引用的操作。添加以下操作：


    | [ch5/ember-note/app/notebooks/notes/route.js](http://media.pragprog.com/titles/mwjsember/code/ch5/ember-note/app/notebooks/notes/route.js)
    |

    | ​� | deleteNote: function(note) { |

    | ​� | console.log(''deleting note with title '' + note.get(''title'')); |

    | ​� | note.deleteRecord(); |

    | ​� | note.save(); |

    | ​� | } |


    调用 `deleteRecord` 并没有从后端完全删除它。如你所见，你还需要对记录调用 `save` 才能将其完全删除。


    与其他方法一样，`save` 会导致一个向 API 发出的 HTTP 请求，这次是一个删除请求：


    ```

    DELETE "/api/notes/12"

    ```


    由于我们正在删除记录，因此不需要提供 URL 中 ID 之外的任何其他信息。API 知道它需要的所有信息并返回成功或失败。


    与其他操作不同，删除也有一种快捷形式。`destroyRecord` 方法会在不需要先调用 `save` 的情况下直接从服务器删除记录。我的倾向是强调可读性和看起来熟悉的代码，所以我更倾向于使用
    `deleteRecord` 形式，但这个选项是存在的。


    现在让我们如何确定记录的状态，这可以帮助你决定是否需要对其进行某些操作。


    ## 获取记录的状态


    我们一直在构建 `EmberNote` 在保存记录方面是操作驱动的，但你可能偶尔希望作为后台过程保存记录。在这种模式下，你希望使用记录的状态来确定保存哪些记录。要获取记录的状态，调用以下代码：


    ```

    var state = record.get(''currentState.stateName'');

    ```


    记录的状态可以取以下值之一：


    * `root.deleted.saved`

    * `root.deleted.uncommitted`

    * `root.deleted.inFlight`

    * `root.empty`

    * `root.deleted.saved`

    * `root.deleted.uncommitted`

    * `root.deleted.inFlight`

    * `root.empty`

    * `root.deleted.saved`

    * `root.deleted.uncommitted`

    * `root.deleted.inFlight`

    * `root.empty`

    * `root.deleted.saved`

    * `root.deleted.uncommitted`

    * `root.deleted.inFlight`

    * `root.empty`

