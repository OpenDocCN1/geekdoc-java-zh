    ## Chapter 1: Road Mapping and Practicing

    As you go through this book, you’ll learn that it is divided into two major sections:
    tips and tricks to learn coding and tips and tricks to apply what you have learned
    about coding to actually writing `JavaScript`. By dividing it in this way, you
    will be able to learn more and start coding more efficiently. In the last three
    chapters of the book, you will learn coding tips, shortcuts, and templates that
    have already been designed and are prepared for you to be able to use. Make sure
    that you know where to find these for reference, later on, consider using a notebook
    or a document that we talked about in the previous book so that you will always
    know where the information is.


    In the first part of the book, in the first chapter, we are going to talk about
    your roadmap and the practice that you can take. These are important steps for
    you to follow if you want to make sure that you are getting the most out of the
    `JavaScript` experience and that you are learning as much as possible.


    ### Your Road Map

    If you want to go somewhere that you have never been, you’re going to have to
    use a roadmap to get there. Actually, you’ll likely use the GPS that is installed
    on your smartphone and your car, but the GPS has taken over roadmaps and wouldn’t
    be possible without them. To get to the `JavaScript` destination that you want
    to beat, you’re going to need to use a roadmap to get there. This does not mean
    that you are going to go on a trip or that you have to go to a specific place,
    it means only that you are going to need to find the best course of action to
    take to learn `JavaScript`.


    If you want to learn `JavaScript` so that you can code websites or even be a front-end
    developer, you will need to go through several steps before you even get to the
    `JavaScript` part. If you simply want to learn it so you can do that or teach
    people how to do it, consider touching lightly on each of the steps that are included
    in the roadmap.


    You will need to learn, at least, basic `HTML`. You don’t need to be an expert
    at it, and you certainly don’t need to use the only `HTML` if you are going to
    be doing `JavaScript` later on, but it can be helpful to learn it so that you
    can create an entire web page with the `JavaScript` and combined `HTML` that you
    have learned. Knowing this will give you the base that you need for your website
    and can help you decide on some of the bigger, more important decisions when it
    comes time to do the `JavaScript` portion of your website.


    After you have learned HTML, you will also need to learn some things about `CSS`.
    This is the language that most websites speak and learning both of these together
    will guarantee that you will be able to code it the correct way and use the `JavaScript`
    that you have learned. `CSS` is much more complicated than both `HTML` and `JavaScript`,
    so you may only want to go the surface of it. If you are planning on becoming
    a developer, you will eventually need to learn all the facets of `CSS` and `HTML`,
    but if you only want to learn it to set yourself up for `JavaScript`, you don’t
    have to dive too far into it.


    After learning both of these languages, you can create a fully functional website.
    All you need to do is use them to make the website, and you will be good to go.
    You can also, though, add some `JavaScript` to it. That’s why you were learning
    `HTML` and `CSS`, right? Your `JavaScript` will fit right in with the coding that
    you have done with the `HTML` and `CSS`. Make sure that, if you have problems,
    you check your `JavaScript`, your `HTML` and your `CSS` for any errors.


    Everyone’s roadmap is going to look different. You should make sure that the roadmap
    that you have created for yourself is tailored to you. For example, you may not
    need to worry about `HTML` or `CSS` because that is something that you already
    know about. You may also not need to know about different things that could come
    from the way that you write code because you are an expert at `Jquery`. There
    are many different facets to writing codes and developing websites, figure out
    which ones will work for you and put them into practice when you start to write
    the codes.


    ### practicing Efficiently

    When you made the decision to learn `JavaScript`, the chances are that you were
    very excited about it and couldn’t wait to get started with writing your own code
    and creating your own websites. Over time, this may have faded especially when
    you learned that there is a lot of practice and many steps are involved in learning
    how to write `JavaScript`. It can be discouraging, but there are some things that
    will help practice exciting again. These are just simple mind tricks that you
    can use when you are practicing `JavaScript`. (Bonus: you can actually use these
    tricks when you are practicing anything that you want to learn).

