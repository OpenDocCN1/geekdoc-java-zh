  trans: '

    要写注释，你唯一需要做的是在注释前写两个反斜杠，并在结尾写一个句号。你的注释看起来应该是这样：


    ```

    //开启计时器，以跟踪网站加载需要多长时间。

    ```


    ```javascript

    function time tracker ()

    ```


    不要使用列在注释后面的函数。它仅仅是一行代码的片段，如果你尝试实际寻找一个可以跟踪网站加载耗时的计时器，它将无法运行。显示它仅仅是为了参考，说明你的注释应该放置的位置。


    你可以在你写的每一行代码上使用注释功能。虽然在你只写几行代码时，在开头这样做似乎是多此一举，但当你编写了更多代码时，你会很幸自己这样做了，因为你将能够确保在成百上千代码的海洋中，准确地找到你正在寻找的内容。


    # Firebug 计时器


    在很多情况下，找出你的网页加载需要多长时间，以及还需要多长时间才能完全加载，是一个好主意。无论你是哪种类型的开发者，都可以从学习加载页面所需的时间中受益。然后你可以利用此对其进行改进。虽然这不一定是你自己编写的代码，但它是
    Firebug 创建的一个模板，你可以用它来找出加载需要多长时间：


    ```javascript

    function time tracker (){


    console.time (“THE TIMER”);


    for (x=5000; x > 0; x ---) {}


    console.timeend (“THE TIMER”);


    }

    ```


    这段代码在你刚开始学习或者只是想找出页面加载需要多长时间时特别有用。


    如果你发现页面加载需要很长时间，你有几种不同的选项可以让它运行得更快。你可以通过删掉一些不需要的内容来修改你编写的代码，使其更高效。你也可以花时间将所有内容移动到页面的底部。


    ## 移动到底部


    当你移动到页面底部时，你的文本和内容将加载得更快。虽然你确实需要在页面顶部编写重要信息，但你可以在底部添加一些并不一定需要的内容。这将确保你能够让页面加载。


    由于在所有必要信息加载到页面之前，页面无法加载，因此你仍然需要将重要部分添加到页面顶部以便它们加载。之所以在底部添加不那么重要的信息是可以的，是因为它们加载的时间较短。顶部的内容越少，当你访问时，页面加载的速度就越快。


    ## 消除语言标签


    当第一次编写 JavaScript 代码时，它们其中包含了“language”标签。这是为了让浏览器能够识别代码的语言并立即获取。由于现在大多数浏览器都具有直观性，且
    JavaScript 是人们用来编写代码最流行的选项之一，代码的语言标签已不再需要了。事实上，使用它已经过时了，实际上可能会减慢系统并让你的页面加载变慢得多。你可能在
    20 年年前看到的常见代码：


    ```html

    <script type= “text/javascript” language=”javascript”> PUT ALL OF YOUR INFORMATION
    HERE</script>

    ```


    由于语言标签是多余的，你只需要放：


    ```html

    <script type= “text/javascript” PUT ALL OF YOUR INFORMATION HERE</script>

    ```


    这消除了语言标签，让你列表中的代码行数更少，并且实际上可以提高你网页的加载速度。移除语言标签不仅能让你更容易找到所需的信息，还能让你在人们访问时有机会拥有一个更快速的网页。


    仅凭一些 JavaScript 基础知识你就可以做很多事情。这是你入门和练习的一种极方法，但使用其中的一些简单技巧将让你有机会利用现有的工具做更多事情。在你刚开始时，尝试本节包含的一些技巧，这样当你需要转向针对你的
    JavaScript 代码的更大、更复杂的技巧时，就不必担心该做什么了。


    # 第 5 章：酷炫的 JavaScript 技巧


    编写 JavaScript 并不完全关于如何制作单选按钮和弹窗供人们访问你的网页时使用。你还可以用 JavaScript 做一些酷炫的事情，让人们好奇你是如何让网页变成那样的。这是让你的网站在数百万网站中脱颖而出并声名鹊起的好方法。人们喜欢看到奇特的东西，所有酷炫的技巧将恰恰带给你这些——与众不同且你在执行时感到很好的东西。


    ## 图像移动


    你页面上的图像实际上是可以移动的。你甚至不需要使用常见的 GIF 图像来实现（尽管你可以像放入其他对象一样把它们放进代码中）。如果你想让静态图像在有人进入页面或鼠标悬停在图像上时开始移动和跳舞，你只需要在代码中放入几样东西。这个技巧将允许页面上的图像相互旋转跳舞：


    ```javascript

    R=0; x1=.1; y1=.05; x2=.25; y2=.24; x3=.6; y3=.24; x4=300; y4=200; x5=300; y5=200;
    DI= document.getElementsByTagName("img"); DIL=DI.length; function A(){for(i=0;
    i<DIL; i++){DIS=DI[i].style; DIS.position=''absolute''; DIS.left=(Math.sin(R*x1+i)*x2+x3)+"px";
    DIS.top=(Math.cos(R*y1+i)*y2+y4)+"px"}R++}setInterval(''A()'',5); void(0);

    ```


    确保你将精确的复制放入文本生成器中，以确保方式正确。直接复制粘贴是个好主意，但为了让图像以不同的模式跳舞，可以考虑调整底部数字。这些是它们跳舞的方向，并且很容易更改。为了弄清楚哪种方式最适合你的浏览器，你需要做出必要的更改，然后使用这些更改进行测试，看看图像以什么方向移动。


    ## 检查 URL


    被重定向到非预期的网站并不罕见。黑客、诈骗者和其他恶意人员可能试图让你访问特定的网站，出于许多原因。这可能是为了让他们能够获取你认为自己在真实网站上时在浏览器中输入的各种信息。虽然这段代码不一定能帮助到你自己的网页，但它可以防止你获得可能对计算机有害的恶意病毒。要使用此代码，你需要将其放入浏览器的控制部分。这将让你有机会查看一个网站是否是真实的网站，以及它是否与它所属的部分匹配。使用：


    ```javascript

    javascript:alert("实际 URL 为:\t\t" + location.protocol + "//" + location.hostname
    + "/" + "\n 地址 URL 为:\t\t" + location.href + "\n" + "\n 如果服务器名称不匹配，请警惕恶意或可能伤害你计算机的伪装网站。");

    ```

